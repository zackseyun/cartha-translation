id: 2KI.12.14
reference: 2 Kings 12:14
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: אַךְ֩ לֹ֨א יֵעָשֶׂ֜ה בֵּ֣ית יְהוָ֗ה סִפּ֥וֹת כֶּ֨סֶף֙ מְזַמְּר֤וֹת מִזְרָקוֹת֙ חֲצֹ֣צְר֔וֹת כָּל כְּלִ֥י זָהָ֖ב וּ/כְלִי כָ֑סֶף מִן הַ/כֶּ֖סֶף הַ/מּוּבָ֥א בֵית יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/014.yaml
  text: However[a], from the money brought into the house of Yahweh there were not made for the house of Yahweh silver basins, snuffers, sprinkling bowls, trumpets[c][b], or any vessel of gold or vessel of silver.
translation:
  language: zh_hans
  text: 然而，送进耶和华殿里的银钱，并没有用来为耶和华的殿制造银盆[a]、灯剪[b]、洒血碗[c]、号筒，或任何金器银器。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “银盆”也可译作“银碗”。
    reason: lexical_alternative
  - marker: b
    text: “灯剪”也可译作“剪芯器”。这个希伯来词在这里很可能指料理灯火、修剪灯芯的器具。
    reason: lexical_alternative
  - marker: c
    text: “洒血碗”直译可作“碗”或“盆”；这里的器皿很可能用于祭祀礼仪中承接或洒祭牲的血。
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: 然而
  rationale: 承接上文形成转折；现代汉语中自然且保留其反意连接作用。
- source_word: יֵעָשֶׂה
  choice: 并没有用来……制造
  rationale: 保留Nifal未完成式的被动、非人称意味，同时按汉语习惯清楚表达这些款项未被用于制作所列器物。
- source_word: בֵּית יְהוָה
  choice: 耶和华的殿／耶和华殿
  rationale: 这里指圣殿；用“殿”比直译“家”更符合现代汉语中的圣所语境。句中两次出现时稍作句法调整，意义不变。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的神名音译，不以“主”这一称号取代原文专名。
- source_word: סִפּוֹת כֶּסֶף
  choice: 银盆
  rationale: סִפּוֹת指盆、碗一类容器；“银盆”适合圣殿器具的语境，并与后面的מִזְרָקוֹת有所区别。
- source_word: מְזַמְּרוֹת
  choice: 灯剪
  rationale: 该词在圣殿陈设语境中很可能指修剪灯芯的器具；“灯剪”简洁地表达其可能用途，同时以脚注保留词义上的不确定性。
- source_word: מִזְרָקוֹת
  choice: 洒血碗
  rationale: 该词指礼仪中承接、泼洒祭牲之血所用的碗或盆；“洒血碗”在现代汉语中既与“银盆”区分，也说明其可能的祭祀用途。
- source_word: חֲצֹצְרוֹת
  choice: 号筒
  rationale: 指宗教礼仪中使用的金属直号；“号筒”比泛称“号”更明确地表示器物。
- source_word: כָּל כְּלִי זָהָב וּכְלִי כָסֶף
  choice: 任何金器银器
  rationale: כְּלִי涵盖器皿、用具或物件；汉语合称“金器银器”自然，并保留概括性。
- source_word: מִן הַכֶּסֶף הַמּוּבָא
  choice: 送进……里的银钱
  rationale: כֶּסֶף在此行政及奉献款项语境中指银钱，而非单指银料；“送进”对应被带入圣殿的动作。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用四字神名而非“主”这一称号。正文保留专名，并采用现代中文读者最熟悉、可辨识度最高的音译“耶和华”；“雅威”是较接近学术重构读音的另一译法。
- issue: 圣殿款项未用于制作器具的陈述
  choice: 按原文陈述用途限制，不补充动机或评价
  alternative: 解释为这些款项只能用于修缮圣殿
  rationale: 上下文可说明款项实际用于修缮，但本节本身只否定用它制作所列器物；不把上下文推论写进本节正文。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。保留原文列举器物的节奏，用“银钱”明确行政款项语境；对器具名称中无法完全确定的细节以脚注说明，而不在正文中过度断定。
