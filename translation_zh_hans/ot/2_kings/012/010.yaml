id: 2KI.12.10
reference: 2 Kings 12:10
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יִּקַּ֞ח יְהוֹיָדָ֤ע הַ/כֹּהֵן֙ אֲר֣וֹן אֶחָ֔ד וַ/יִּקֹּ֥ב חֹ֖ר בְּ/דַלְתּ֑/וֹ וַ/יִּתֵּ֣ן אֹת/וֹ֩ אֵ֨צֶל הַ/מִּזְבֵּ֜חַ ב/ימין בְּ/בֽוֹא אִישׁ֙ בֵּ֣ית יְהוָ֔ה וְ/נָֽתְנוּ שָׁ֤מָּ/ה הַ/כֹּֽהֲנִים֙ שֹׁמְרֵ֣י הַ/סַּ֔ף אֶת כָּל הַ/כֶּ֖סֶף הַ/מּוּבָ֥א בֵית יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/010.yaml
  text: Then Jehoiada the priest took one chest[a], bored a hole in its lid, and set it beside the altar, on the right as a man enters the house of Yahweh[c][b]; and the priests who guarded the threshold put there all the silver that was brought into the house of Yahweh.
translation:
  language: zh_hans
  text: 祭司耶何耶大拿了一个箱子，在箱盖[a]上钻了一个孔，把箱子放在祭坛旁边，就是进入雅威的殿之人右手边；看守门槛的祭司把所有带进雅威的殿的银子[b]都放在那里。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译“在它的门上”；在这里很可能指箱子可开合的盖。
    reason: lexical_alternative
  - marker: b
    text: 或译“钱财”。希伯来文“银子”也可泛指钱。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲרוֹן
  choice: 箱子
  rationale: 这里指收纳圣殿奉献银子的容器；“箱子”自然清楚，也避免“约柜”一类不合语境的联想。
- source_word: וַיִּקֹּב חֹר
  choice: 钻了一个孔
  rationale: נקב与חור连用，表示在物件上钻出或凿出孔洞；“钻了一个孔”准确而自然。
- source_word: בְּדַלְתּוֹ
  choice: 在箱盖上
  rationale: דלת通常指“门”，但用于这个箱子时，语境最可能指可开合的盖；正文采用自然的“箱盖”，并以脚注保留字面可能性。
- source_word: אֵצֶל הַמִּזְבֵּחַ
  choice: 在祭坛旁边
  rationale: אצל表示紧邻或靠近；“在祭坛旁边”明确传达空间关系。
- source_word: בימין בְּבוֹא אִישׁ בֵּית יְהוָה
  choice: 就是人进入雅威殿时的右边
  rationale: 这句话以进入者的视角说明箱子所在的右侧。汉语用“人”可自然表达希伯来文单数אִישׁ在此处的泛指作用。
- source_word: שֹׁמְרֵי הַסַּף
  choice: 看守门槛的祭司
  rationale: 保留“看守”与“门槛”两项词义，体现这些祭司在圣殿入口处的职分，又不改写为较宽泛的“守门人”。
- source_word: כָּל הַכֶּסֶף
  choice: 所有……银子
  rationale: כֶּסֶף本义为“银子”，也可泛指钱财；此处正文保留具体媒介“银子”，脚注说明另一可能译法。
- source_word: הַמּוּבָא בֵית יְהוָה
  choice: 带进雅威殿的
  rationale: 被动分词表达银子被带入圣殿；汉语定语结构简洁地保留这一意义。
- source_word: בֵּית יְהוָה
  choice: 雅威殿
  rationale: 字面为“雅威的殿／家”；在圣殿语境中，“雅威殿”简洁、庄重且明确。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以“雅威”音译四字神名，保留经文所用的专名。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；正文用“雅威”保留其专名性质，不以称号替代。
- issue: 方位表达中的单数אִישׁ
  choice: 人进入雅威殿时
  alternative: 一个男人进入雅威殿时；有人进入雅威殿时
  rationale: 此处אִישׁ用于设定任何进入者的观察视角。现代汉语的“人进入……时”既保留人的指称，也自然表达这种泛指，不额外限定实际进入者的性别。
translation_notes:
  register: 采用现代、庄重而易懂的叙事体。“箱子”“钻了一个孔”贴近日常语言；“祭坛”“门槛”“雅威殿”保留圣殿场景的正式感。分号划分安置箱子与祭司收纳银子两个连续动作。
