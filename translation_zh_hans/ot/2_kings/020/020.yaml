  text: וְ/יֶ֨תֶר דִּבְרֵ֤י חִזְקִיָּ֨הוּ֙ וְ/כָל גְּב֣וּרָת֔/וֹ וַ/אֲשֶׁ֣ר עָשָׂ֗ה אֶת הַ/בְּרֵכָה֙ וְ/אֶת הַ/תְּעָלָ֔ה וַ/יָּבֵ֥א אֶת הַ/מַּ֖יִם הָ/עִ֑ירָ/ה הֲ/לֹא הֵ֣ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יְהוּדָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/020.yaml
  text: The rest of the acts of Hezekiah[a], and all his might[c][b], and how he made the pool and the conduit and brought the water into the city—are they not written in the Book of the Chronicles of the Kings of Judah?
translation:
  language: zh_hans
  text: 希西家其余的事迹、他的一切功绩，以及他怎样修建蓄水池[a]和水道[b]，把水引进城中，不都记在《犹大列王诸事记》上吗？[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “蓄水池”也可译作“水池”或“水库”；希伯来语可指人工建造的储水设施。
    reason: lexical_alternative
  - marker: b
    text: “水道”也可译作“水渠”或“输水道”；希伯来语指引水的通道。
    reason: lexical_alternative
  - marker: c
    text: 这里很可能指希西家在耶路撒冷修建的水利工程；参看《历代志下》32:30。
    reason: cross_reference
lexical_decisions:
- source_word: יֶתֶר דִּבְרֵי
  choice: 其余的事迹
  rationale: 这是《列王纪》常见的史书结语。“事迹”自然体现君王生平和作为，也保留דְּבָרִים在此处较宽泛的含义。
- source_word: גְּבוּרָתוֹ
  choice: 他的英勇作为
  rationale: גְּבוּרָה可指力量、勇武或卓越功业；在君王史叙事中译作“英勇作为”既自然，也不把含义局限于单纯的体力或军力。
- source_word: וַאֲשֶׁר עָשָׂה
  choice: 以及他怎样修建
  rationale: 这里引出希西家工程方面的具体作为。“怎样修建”承接前文自然，并忠实反映关系结构。
- source_word: הַבְּרֵכָה
  choice: 蓄水池
  rationale: בְּרֵכָה指人工建造的水池或蓄水设施；“蓄水池”在本节水利工程语境中准确而清楚，同时不具体断定其规模或位置。
- source_word: הַתְּעָלָה
  choice: 水道
  rationale: 该词指水渠、水沟或输水通道；“水道”是现代汉语中自然且范围合宜的对应词。
- source_word: וַיָּבֵא אֶת־הַמַּיִם הָעִירָה
  choice: 把水引进城里
  rationale: 方向词尾表明水被带入城内；汉语描述水利工程时用“引进”比直译“带进”更自然，同时保留使水进入城中的含义。
- source_word: הֲלֹא הֵם כְּתוּבִים
  choice: 不都记在……上吗
  rationale: 保留希伯来文反问式的史书结语，并采用现代汉语自然表达。
- source_word: סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יְהוּדָה
  choice: 《犹大列王纪》
  rationale: 这是记载犹大诸王事迹的王室史料名称。用书名号标示文献题名；“纪”表达编年记录的性质，但不将其等同于正典《历代志》。
theological_decisions:
- issue: 希西家的גְּבוּרָה是抽象的能力还是具体功业
  choice: 英勇作为
  alternative: 能力／威势
  rationale: 上下文紧接具体水利工程，故具体化为“作为”较符合史叙语境；加“英勇”仍保留该词所含的力量、勇武色彩，但不把水利工程本身强行解释成军事行动。
translation_notes:
  register: 采用现代、庄重而易懂的史叙体。“不都记在……上吗”保留原文惯用的反问结语；正文避免把水池、水道进一步认定为某一具体遗址。脚注标记依相关词语安放，并将交叉参考置于全句末尾。
