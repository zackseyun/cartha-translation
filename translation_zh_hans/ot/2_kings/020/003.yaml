id: 2KI.20.3
reference: 2 Kings 20:3
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: אָנָּ֣ה יְהוָ֗ה זְכָר נָ֞א אֵ֣ת אֲשֶׁ֧ר הִתְהַלַּ֣כְתִּי לְ/פָנֶ֗י/ךָ בֶּֽ/אֱמֶת֙ וּ/בְ/לֵבָ֣ב שָׁלֵ֔ם וְ/הַ/טּ֥וֹב בְּ/עֵינֶ֖י/ךָ עָשִׂ֑יתִי וַ/יֵּ֥בְךְּ חִזְקִיָּ֖הוּ בְּכִ֥י גָדֽוֹל־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/003.yaml
  text: “Please[a], O Yahweh, remember, I pray, how I have walked before you in faithfulness and with a whole heart[b], and have done what is good in your eyes.” And Hezekiah wept bitterly.
translation:
  language: zh_hans
  text: “耶和华啊，求你记念，我曾怎样忠信地[a]、全心全意地[b]行在你面前，又做了你眼中看为善的事。”希西家就大哭[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “忠信地”也可译作“真实地”或“诚实地”。此处原文可指希西家在上帝面前行事的真实、正直或忠信。
    reason: 说明 אֱמֶת 的词义范围，并锚定于其所解释的词语。
  - marker: b
    text: 直译为“以完整的心”；也可表达为“以专一的心”或“以未分裂的心”。
    reason: 说明 לֵבָב שָׁלֵם 所指完整、专一的忠诚。
  - marker: c
    text: 原文直译为“希西家大大地哭了”或“以大的哭泣哭了”。这是加强哭泣程度的同源结构。
    reason: 说明 וַיֵּבְךְּ…בְּכִי גָדוֹל 的强调表达，避免将“放声”或特定情绪写入正文。
lexical_decisions:
- source_word: אָנָּה ... נָא
  choice: 求你
  rationale: 两个恳求语气成分共同表达迫切的祈求；中文用一次“求你”即可自然传达，不必重复。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经传统中广为人知的专名译法，保留这是以色列上帝之名，而不是普通称号。
- source_word: זְכָר
  choice: 记念
  rationale: 在祷告语境中，不只是从记忆中想起，也含有求上帝顾念并据此施行的意味；“记念”保留这一语义。
- source_word: הִתְהַלַּכְתִּי לְפָנֶיךָ
  choice: 行在你面前
  rationale: 保留希伯来文以“行走”描述生活与行为的比喻，也表达活在上帝面前的意思。
- source_word: בֶּאֱמֶת
  choice: 忠信地
  rationale: אֱמֶת 可指真实、诚实或忠信；此处修饰希西家在上帝面前的生活方式，“忠信地”较贴合伦理语境，同时不将其缩减为事实真实性。
- source_word: וּבְלֵבָב שָׁלֵם
  choice: 全心全意地
  rationale: שָׁלֵם 表示完整、无分裂；此译自然表达专一而完整的心，并避免“完全的心”可能引起的无罪完美之误解。
- source_word: וְהַטּוֹב בְּעֵינֶיךָ עָשִׂיתִי
  choice: 又做了你眼中看为善的事
  rationale: 保留“在你眼中”的希伯来表达，强调善的判断标准在于上帝。
- source_word: וַיֵּבְךְּ ... בְּכִי גָדוֹל
  choice: 就放声痛哭
  rationale: 同源结构配合“大的”加强哭泣程度；中文“放声痛哭”自然表达强烈哭泣，不过“痛”在语境中也带出哀伤色彩。
- source_word: חִזְקִיָּהוּ
  choice: 希西家
  rationale: 采用该人名通行的现代中文译名。
theological_decisions:
- issue: 希西家所说“全心全意”是否声称自己无罪完美
  choice: 全心全意地
  alternative: 以完全的心
  rationale: 原文强调心志完整、忠诚专一，并不必然声称绝对无罪；译文保留其自我陈述的力度，同时不额外引入完美主义解释。
- issue: בֶּאֱמֶת 的伦理与盟约意味
  choice: 忠信地
  alternative: 真实地
  rationale: 上下文谈的是希西家一贯在上帝面前的行事为人，因此“忠信”比单纯“真实”更能表达可靠、诚实的生活；但其“真实”义仍以脚注注明。
- issue: 神名 יְהוָה 的处理
  choice: 耶和华
  alternative: 雅威
  rationale: “耶和华”是简体中文普通读者最熟悉且可识别为专名的译法；不以“主”替换，因而仍保留原文使用神圣专名这一事实。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。祷告用“耶和华啊，求你记念”保持恳切语气；保留“行在你面前”和“你眼中看为善”等易懂的圣经意象。脚注标记置于主文末句之后，涵盖本节主要词义差异。
