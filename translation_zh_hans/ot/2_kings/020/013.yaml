  text: וַ/יִּשְׁמַ֣ע עֲלֵי/הֶם֮ חִזְקִיָּהוּ֒ וַ/יַּרְאֵ֣/ם אֶת כָּל בֵּ֣ית נְכֹתֹ֡/ה אֶת הַ/כֶּסֶף֩ וְ/אֶת הַ/זָּהָ֨ב וְ/אֶת הַ/בְּשָׂמִ֜ים וְ/אֵ֣ת שֶׁ֣מֶן הַ/טּ֗וֹב וְ/אֵת֙ בֵּ֣ית כֵּלָ֔י/ו וְ/אֵ֛ת כָּל אֲשֶׁ֥ר נִמְצָ֖א בְּ/אֽוֹצְרֹתָ֑י/ו לֹֽא הָיָ֣ה דָבָ֗ר אֲ֠שֶׁר לֹֽא הֶרְאָ֧/ם חִזְקִיָּ֛הוּ בְּ/בֵית֖/וֹ וּ/בְ/כָל מֶמְשַׁלְתּֽ/וֹ־־־־־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/013.yaml
  text: And Hezekiah listened to them and showed them all his treasure house—the silver[a], the gold, the spices, the fine oil, his armory, and everything that was found in his storehouses[d][c][b]. There was nothing in his house or in all his realm that Hezekiah did not show them.
translation:
  language: zh_hans
  text: 希西家接见了他们[a]，把他珍宝库[b]里所有的东西——银子、金子、香料、上等的油、他的军械库[c]，以及他库房里的一切——都给他们看。希西家在自己的宫中和他统治的全境[d]内，没有一样不让他们看。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“听了他们的话”。原文可含听取、给予接见或接待的意思。
    reason: lexical_alternative
  - marker: b
    text: 或译：“宝库”或“储藏珍宝的房屋”。
    reason: lexical_alternative
  - marker: c
    text: 或译：“装备库”；原文直译为“他的器具之屋”。
    reason: lexical_alternative
  - marker: d
    text: 或译：“他所有的辖地”或“他统治的一切地方”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע עֲלֵיהֶם
  choice: 听从了他们
  rationale: 该短语不只是指听见声音，也可表达听取、留心或给予接见并作出积极回应；“听从了他们”保留其正面接纳的语气，又不把具体接待方式说死。
- source_word: וַיַּרְאֵם / הֶרְאָם
  choice: 给他们看
  rationale: ראה的使役形在此自然表示“使他们看见、展示给他们看”；前后两处采用同一表达，以保留重复。
- source_word: בֵּית נְכֹתֹה
  choice: 他的整个珍宝库
  rationale: 该词组指存放贵重物品之处；“珍宝库”符合随后列举金银香料等物的语境，物主后缀译为“他的”。“整个”对应כָּל。
- source_word: הַכֶּסֶף
  choice: 银子
  rationale: 此处指作为财富储存的银，而非现代意义上的货币。
- source_word: הַזָּהָב
  choice: 金子
  rationale: 直接指王室收藏中的黄金。
- source_word: הַבְּשָׂמִים
  choice: 香料
  rationale: 该复数词泛指有价值的芳香物质；“香料”自然且不过度限定其具体用途。
- source_word: שֶׁמֶן הַטּוֹב
  choice: 上等的油
  rationale: 直译为“好的油”，语境中强调品质或价值；“上等的油”符合现代汉语。
- source_word: בֵּית כֵּלָיו
  choice: 他的军械库
  rationale: 字面为“他的器具之屋”；在王室财物和国力展示的语境中，כֵּלִים可指兵器或装备，“军械库”是较自然的语境译法，同时以脚注保留较宽的词义。
- source_word: אֲשֶׁר נִמְצָא בְּאֹצְרֹתָיו
  choice: 他库房里所有的东西
  rationale: אֹצָר可指库房或宝库；译作“库房”既自然，又与前面的“珍宝库”有所区分。
- source_word: לֹא הָיָה דָבָר אֲשֶׁר לֹא הֶרְאָם
  choice: 没有一样不给他们看的
  rationale: 保留希伯来文双重否定形成的全面、强调语气。
- source_word: בְּבֵיתוֹ
  choice: 在自己宫中
  rationale: 字面是“在他的家中/房屋中”；主语为君王，语境涉及王室珍藏，因此“宫中”较自然，但脚注不必增设，因为汉语正文已清楚体现王室语境。
- source_word: בְכָל מֶמְשַׁלְתּוֹ
  choice: 在他统管的全境
  rationale: מֶמְשָׁלָה指统治、管辖权或所辖领域；此译兼顾统治关系与地域范围，不径直等同于“王国”。
