  to: 希西家接见了他们[a]，把他珍宝库[b]里所有的东西——银子、金子、香料、上等的油、他的军械库[c]，以及他库房里的一切——都给他们看。希西家在自己的宫中和他统治的全境[d]内，没有一样不让他们看。
