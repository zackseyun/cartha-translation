base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/010.yaml
  text: And Hezekiah said, “It is an easy thing for the shadow to stretch forward ten steps. No, but let the shadow go back ten steps.”
translation:
  language: zh_hans
  text: 希西家说：“让影子向前移十级[a]是容易的。不，要让影子往后退十级。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“十个刻度”。希伯来语所用的词可指台阶、上升的层级或刻度；这里可能指亚哈斯测影装置上的台阶或分度。
    reason: lexical_alternative
lexical_decisions:
- source_word: נָקֵל
  choice: 是容易的
  rationale: 该词表示轻省、容易；译为“是容易的”自然地保留了希西家对这一现象的判断。
- source_word: הַצֵּל / לַצֵּל
  choice: 影子
  rationale: צֵל通常指“影子”；上下文所指是亚哈斯装置上移动的影子，不在正文中额外限定装置性质。
- source_word: לִנְטוֹת
  choice: 向前移
  rationale: נטה可表示伸展、倾斜或转移。这里与后文“往后退”构成对照，“向前移”以自然中文表达影子按通常方向移动，同时不把具体机械原理写入正文。
- source_word: מַעֲלוֹת
  choice: 级
  rationale: מַעֲלוֹת字面可指台阶、上升处或刻度。正文用可兼指阶级与分级刻度的“级”，并以脚注说明其可能含义。
- source_word: לֹא כִּי
  choice: 不，要
  rationale: 这一结构先否定前一种选择，再提出所要的另一种选择；“不，要”简洁保留鲜明转折。
- source_word: יָשׁוּב
  choice: 要让……退
  rationale: שׁוב表示返回、转回。结合希西家所选的征兆，以“要让影子……退”表达其愿望或要求。
- source_word: אֲחֹרַנִּית
  choice: 往后
  rationale: 该副词表示向后、倒退；“往后”是现代汉语中自然明确的表达。
theological_decisions:
- issue: 影子移动所涉及的装置及机制
  choice: 正文只说影子向前移或往后退，不指明日晷或具体机制
  alternative: 明确译作日晷上的影子或太阳倒退
  rationale: 希伯来文本本节只明说影子和מַעֲלוֹת，并未明确称装置为日晷，也未在本句说明天体运动机制；保留这种叙述范围可避免加入经文没有明说的解释。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“向前移”与“往后退”形成清楚对照；正文不将מַעֲלוֹת过度具体化，相关词义范围放入脚注。
