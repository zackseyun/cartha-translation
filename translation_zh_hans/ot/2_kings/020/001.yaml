  text: בַּ/יָּמִ֣ים הָ/הֵ֔ם חָלָ֥ה חִזְקִיָּ֖הוּ לָ/מ֑וּת וַ/יָּבֹ֣א אֵ֠לָי/ו יְשַׁעְיָ֨הוּ בֶן אָמ֜וֹץ הַ/נָּבִ֗יא וַ/יֹּ֨אמֶר אֵלָ֜י/ו כֹּֽה אָמַ֤ר יְהוָה֙ צַ֣ו לְ/בֵיתֶ֔/ךָ כִּ֛י מֵ֥ת אַתָּ֖ה וְ/לֹ֥א תִֽחְיֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/001.yaml
  text: 'In those days Hezekiah became sick, near to death. And Isaiah son of Amoz the prophet[a] came to him and said to him, “Thus says Yahweh: Set your house in order, for you are about to die; you will not live.”'
translation:
  language: zh_hans
  text: 那些日子，希西家病了，病得快要死了。亚摩斯的儿子以赛亚先知来见他，对他说：“雅威如此说：‘你要把家里的事安排妥当，因为你快要死了，不能活了。[a]’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “你快要死了”直译近于“你是死的”或“你正在死”；这里的希伯来语表达宣告死亡已经迫近，而且确定无疑。
    reason: 说明 מֵת אַתָּה 的字面形式及其语境含义，保留原文表达的力度与细微歧义。
lexical_decisions:
- source_word: בַּיָּמִים הָהֵם
  choice: 那些日子
  rationale: 保留希伯来语常见的叙事时间引语，现代汉语中自然而庄重。
- source_word: חָלָה חִזְקִיָּהוּ לָמוּת
  choice: 希西家病了，病得快要死了
  rationale: חָלָה 表示患病，לָמוּת 在此说明病势危重；重复“病”使汉语衔接自然，并保留濒死而尚未死亡的含义。
- source_word: יְשַׁעְיָהוּ בֶן אָמוֹץ הַנָּבִיא
  choice: 亚摩斯的儿子以赛亚先知
  rationale: 保留姓名、父称和先知身份，并采用自然可懂的汉语次序。
- source_word: כֹּה אָמַר יְהוָה
  choice: 雅威如此说
  rationale: 保留先知传信公式，并将四字神名按专名音译为“雅威”。
- source_word: צַו לְבֵיתֶךָ
  choice: 你要把家里的事安排妥当
  rationale: 该表达要求希西家在临死前向家人或家务作出必要安排；此译既传达命令意味，也避免把“家”狭义理解为房屋。
- source_word: כִּי מֵת אַתָּה
  choice: 因为你快要死了
  rationale: 字面近于“因为你是死的／正在死”，语境中是宣布确定而迫近的死亡；汉语以“快要死了”自然表达其未完成而临近的意味。
- source_word: וְלֹא תִחְיֶה
  choice: 不能活了
  rationale: 直接保留对继续存活的否定；与前句连用时，现代汉语“不能活了”比机械的“你将不活”自然。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；音译“雅威”将其作为专名呈现，而不以称号替代。
- issue: “你快要死了”与随后希西家得医治之间的张力
  choice: 按本节将话语译作确定而迫近的死亡宣告
  alternative: 弱化为“你可能会死”或“你的病很危险”
  rationale: 原文语气直接，并接着说“不能活了”；译文不因后续叙事而预先削弱此处宣告，也不额外解释神意或预言条件。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。叙事句避免不必要的文言化；神谕保留简洁、直接的权威语气。脚注标记置于所解释的整段死亡宣告之后。
