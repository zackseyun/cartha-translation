base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/009.yaml
  text: 'And Isaiah said[a], “This is the sign for you from Yahweh, that Yahweh will do the thing that he has spoken: shall the shadow go forward ten steps, or shall it turn back ten steps?”'
translation:
  language: zh_hans
  text: 以赛亚说：“这是耶和华给你的征兆：耶和华必成就他所说的事；影子要向前走十级，还是往后退十级？”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “级”也可译作“台阶”或“度”。希伯来语此词通常指上升处或台阶；因这里说到影子的移动，传统上也译作“度”。经文未明确说明所涉装置的具体形制。
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאוֹת
  choice: 征兆
  rationale: אוֹת 指用于确认应许的记号；此处是赐给希西家的神迹性凭据。“征兆”自然表达其确认作用。
- source_word: מֵאֵת יְהוָה
  choice: 耶和华给你的
  rationale: מֵאֵת 表示来源；结合中文语序译作“耶和华给你的”。专名 יְהוָה 音译为“耶和华”。
- source_word: כִּי
  choice: 表明
  rationale: 此处引出该征兆所确认的内容；“表明”比直译“因为”更符合现代汉语，同时保留逻辑关系。
- source_word: יַעֲשֶׂה יְהוָה אֶת הַדָּבָר אֲשֶׁר דִּבֵּר
  choice: 耶和华必成就他所说的事
  rationale: דָּבָר 在此兼有“话”和“事情”的意义；“成就他所说的事”自然表达神落实先前宣告的内容。
- source_word: הָלַךְ הַצֵּל
  choice: 影子要向前走
  rationale: 虽然 הָלַךְ 形式上是完成式，但在提出两种可选征兆的疑问句中，指影子将如何移动；“向前走”与下文“往后退”形成清楚对照。
- source_word: מַעֲלוֹת
  choice: 级
  rationale: 该词本义为台阶或阶级，此处可能指亚哈斯相关装置上的阶级；“级”既简洁，又不武断认定具体装置。
- source_word: אִם
  choice: 还是
  rationale: 在选择问句中引出第二种可能，现代汉语自然用“还是”。
- source_word: יָשׁוּב
  choice: 往后退
  rationale: שׁוּב 表示返回、转回；这里描写影子逆向移动，“往后退”清楚自然。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文两次直接使用四字神名。中文正文采用广为人知且庄重的“耶和华”，保留其专名性质，不以“主”替代。
- issue: 征兆与应许的关系
  choice: 表明耶和华必成就他所说的事
  alternative: 因为耶和华必成就他所说的事
  rationale: כִּי 可表示原因，也可引出内容。此处译作“表明”呈现征兆所确认的内容，但不额外解释该神迹如何发生。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。选择问句保留原文两种可能之间的张力；正文用“级”避免把 מַעֲלוֹת 过度具体化为台阶或现代刻度，并以脚注说明其他译法。
