base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/017.yaml
  text: Look, days are coming when all that is in your house, and what your fathers have stored up until this day, will be carried to Babylon. Not a thing will be left, says the LORD.
translation:
  language: zh_hans
  text: “看哪，日子将到：你宫中的一切，以及你列祖积存到今日的一切，都必被运到巴比伦去，一样也不会留下。”耶和华说。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  choice: 看哪
  rationale: 保留先知宣告中引人注意、强调信息迫近的语气，且符合庄重的现代汉语表达。
- source_word: בְּבֵיתֶךָ
  choice: 你宫里
  rationale: 字面为“你家中”；受话者是希西家，语境所指为王宫及其库藏，因此译作“你宫里”更自然准确。
- source_word: אָצְרוּ
  choice: 积存
  rationale: 表达储藏、积聚财物之意，也与上下文中的宫廷库藏相符。
- source_word: וְנִשָּׂא
  choice: 都必被运到
  rationale: 该动词在此表示财物被带走；用被动式保留原文未明说执行者的特点。
- source_word: דָּבָר
  choice: 一样
  rationale: 在否定句中指任何东西；“一样也不会留下”是自然汉语，同时保留彻底无余之意。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的专名形式来呈现神圣四字名。
theological_decisions:
- issue: 预言的确定性
  choice: 都必被运到……一样也不会留下
  alternative: 都将被运到……不会剩下什么
  rationale: 以“必”体现先知宣告的确定性，但不额外说明历史应验方式或神学原因。
- issue: 掳掠者在语法中的隐含状态
  choice: 使用“被运到”的被动表达
  alternative: 巴比伦人必把这一切掳去
  rationale: 原文没有明确指出执行者，不应补入“巴比伦人”，以免消除原文保留的信息空缺。
translation_notes:
  register: 采用庄重、清晰的现代标准汉语。“看哪”保留先知话语的宣告感；“这是耶和华说的”自然呈现原文末尾的神谕公式。
