base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/014.yaml
  text: Then Isaiah the prophet came to King Hezekiah and said to him[a], “What did these men say, and where did they come from to you?” And Hezekiah said, “They came to me from a distant land[b], from Babylon.”
translation:
  language: zh_hans
  text: 于是，先知以赛亚来到希西家王那里，对他说：“这些人说了什么？他们是从哪里到你这里来的？”希西家说：“他们从遥远之地来，是从巴比伦来的。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹא
  choice: 于是……来到
  rationale: 连续式叙事动词推进情节；“于是”自然表达事件的先后发展。
- source_word: יְשַׁעְיָהוּ הַנָּבִיא
  choice: 先知以赛亚
  rationale: 保留其身份与标准中文人名，并采用自然的现代汉语称谓次序。
- source_word: אֶל־הַמֶּלֶךְ חִזְקִיָּהוּ
  choice: 来到希西家王那里
  rationale: 准确表达趋向君王之处；“希西家王”符合自然中文表达。
- source_word: מָה אָמְרוּ הָאֲנָשִׁים הָאֵלֶּה
  choice: 这些人说了什么
  rationale: 完成体在叙事问话中指已经发生的言谈；“这些人”自然且未增添贬义。
- source_word: וּמֵאַיִן יָבֹאוּ אֵלֶיךָ
  choice: 他们从哪里到你这里来
  rationale: 保留希伯来文不完成体的形式张力以及明确的 אֵלֶיךָ（到你那里）；在上下文中仍自然指来访者此前的到来。
- source_word: מֵאֶרֶץ רְחוֹקָה
  choice: 从遥远的地方
  rationale: 表达地理上的遥远；“地方”在现代汉语中比“国土”或“国家”更自然，也不超出 אֶרֶץ 的语义范围。
- source_word: מִבָּבֶל
  choice: 从巴比伦
  rationale: 采用该地名的标准中文译名，并保留对前述遥远之地的具体说明。
