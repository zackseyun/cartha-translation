  naturalness: “他们是从哪里到你这里来的？”是自然、庄重的现代汉语，并明确保留原文的“到你这里”。“从遥远之地来，是从巴比伦来的”保留先概括遥远来源、后点明巴比伦的次序和强调。
  terminology: “先知以赛亚”“希西家王”“巴比伦”均为通行且合适的中文圣经名称与称谓。
