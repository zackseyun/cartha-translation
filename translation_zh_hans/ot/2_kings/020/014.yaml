  to: 于是，先知以赛亚来到希西家王那里，对他说：“这些人说了什么？他们是从哪里到你这里来的？”希西家说：“他们从遥远之地来，是从巴比伦来的。”
  rationale: 恢复“对他说”以对应原文的叙事动词；将第二问调整为符合既成来访语境的自然现代汉语，同时保留“到你这里”。回答保留“遥远之地”与“巴比伦”的先后结构，并以“来的”表达已经发生的来访。删除原脚注 a，因为修订后不再有“对他说／问他”的译法替换。
