base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/015.yaml
  text: And he said[a], “What did they see in your house?” And Hezekiah said, “They saw everything that is in my house[b]. There was nothing that I did not show them among my treasuries.”
translation:
  language: zh_hans
  text: 他问：“他们在你家中[a]看见了什么？”希西家说：“我家中所有的一切，他们都看见了；我的宝库[b]中没有一样东西是我没有给他们看的。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“你的王宫中”。希伯来语直译为“你家中”或“你的房屋中”；在君王的语境中，可指王宫。
    reason: lexical_alternative
  - marker: b
    text: 或译“库房”。希伯来语这个词可指存放财物或物资的地方。
    reason: lexical_alternative
lexical_decisions:
- source_word: מָה
  choice: 什么
  rationale: 直接表达疑问代词，符合现代汉语问句习惯。
- source_word: רָאוּ
  choice: 看见了
  rationale: 按叙事语境译为完成的过去事件；同一词根在问答中保持一致。
- source_word: בְּבֵיתֶךָ / בְּבֵיתִי
  choice: 在你宫中 / 我宫里
  rationale: בַּיִת本义为“房屋、家”，但说话对象是君王，此处指其王宫；译作“宫中”比“家里”自然，同时以脚注保留原词较宽的语义。
- source_word: חִזְקִיָּהוּ
  choice: 希西家
  rationale: 采用现代中文圣经中通行的人名译法。
- source_word: אֵת כָּל אֲשֶׁר בְּבֵיתִי
  choice: 我宫里所有的一切
  rationale: 保留כָּל אֲשֶׁר的全面、无遗漏之意，并用自然汉语表达。
- source_word: לֹא הָיָה דָבָר
  choice: 没有一样东西
  rationale: 自然呈现希伯来语否定存在句，同时保留“没有任何一件”的强调。
- source_word: אֲשֶׁר לֹא הִרְאִיתִם
  choice: 是我没有给他们看的
  rationale: הִרְאָה为ראה的使役式，意为“使人看见、给人看”；宾语后缀“他们”明确保留。
- source_word: בְּאֹצְרֹתָי
  choice: 我宝库中
  rationale: אֹצָר可指存放财宝或物资之处；王室语境下“宝库”最为贴切，脚注说明较宽的可能含义。
