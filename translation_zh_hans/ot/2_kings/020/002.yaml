  yaml_path: translation/ot/2_kings/020/002.yaml
  text: Then he turned his face to the wall and prayed to Yahweh[a], saying,
translation:
  language: zh_hans
  text: 于是，他转脸朝墙，向耶和华祷告说：
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּסֵּב
  choice: 于是，他转
  rationale: סבב的使役形叙事过去式表示承接上文的动作；“于是”自然体现叙事推进，“转”保留动作本义。
- source_word: אֶת פָּנָיו
  choice: 脸
  rationale: פָּנִים在此具体指“脸”；汉语以“他转脸”即可自然表达所属关系，无须重复“他的”。
- source_word: אֶל הַקִּיר
  choice: 朝向墙
  rationale: אֶל表示方向，קִיר意为“墙”；“朝向墙”比“对着墙”稍为贴近方向性，同时符合现代汉语。
- source_word: וַיִּתְפַּלֵּל
  choice: 祷告
  rationale: פלל的Hitpael形在此意为向神祷告；与后面的对象和引语连用自然。
- source_word: אֶל יְהוָה
  choice: 向耶和华
  rationale: אֶל直译为“向”；יהוה是神的专名，正文以现代中文圣经读者熟悉的“耶和华”音译呈现。
- source_word: לֵאמֹר
  choice: 说：
  rationale: אמר的不定式结构引出下一节的祷告内容；中文用“说：”简洁自然，并明确引语即将开始。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。中文正文采用广为人知、庄重且可辨识为专名的“耶和华”；“雅威”是按学界常见拟音所作的另一可行译法。这里不以“主”替代，以保留原文专名与אֲדֹנָי之间可能存在的区别。
translation_notes:
  register: 采用现代、庄重而易懂的叙事用语。“于是”承接上一节；“转脸朝向墙”保留原文具体动作和方向；句末用冒号引出下一节祷告内容。
