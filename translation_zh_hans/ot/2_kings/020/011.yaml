  text: וַ/יִּקְרָ֛א יְשַׁעְיָ֥הוּ הַ/נָּבִ֖יא אֶל יְהוָ֑ה וַ/יָּ֣שֶׁב אֶת הַ/צֵּ֗ל בַּֽ֠/מַּעֲלוֹת אֲשֶׁ֨ר יָרְדָ֜ה בְּ/מַעֲל֥וֹת אָחָ֛ז אֲחֹֽרַנִּ֖ית עֶ֥שֶׂר מַעֲלֽוֹת־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/011.yaml
  text: And Isaiah the prophet cried out to Yahweh[a], and he brought the shadow back the ten steps by which it had gone down on the steps of Ahaz.
translation:
  language: zh_hans
  text: 先知以赛亚向耶和华呼求，耶和华就使影子在亚哈斯的台阶上倒退了十个台阶；影子先前曾下移这十个台阶[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“十度”。希伯来文מַעֲלוֹת的基本意思是“台阶、上升处”。有人认为这里指一种阶梯式的测影装置，因此传统上也有译作“亚哈斯的日晷”的；原文并未明确说明该装置的具体性质。
    reason: 说明“十个台阶”的另一传统译法，并保留该结构或装置性质的不确定性。
lexical_decisions:
- source_word: וַיִּקְרָא ... אֶל־יְהוָה
  choice: 向耶和华呼求
  rationale: “呼求”保留קרא אל表示向上帝大声求告的含义，又不把原文直接扩释为“祷告”。
- source_word: יְשַׁעְיָהוּ הַנָּבִיא
  choice: 先知以赛亚
  rationale: 采用现代中文圣经读者熟悉的人名译法，并按自然汉语语序将称号置于姓名之前。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 直接以中文传统专名呈现四字神名，不以“主”替代；“耶和华”在现代普通中文读者中最易辨认。
- source_word: וַיָּשֶׁב אֶת־הַצֵּל
  choice: 耶和华就使……影子……倒退
  rationale: וַיָּשֶׁב是使役形，译为“使……倒退”既体现使役意义，也明确其主语承接前面的耶和华，避免汉语中的指代歧义。
- source_word: בַּמַּעֲלוֹת / מַעֲלוֹת אָחָז
  choice: 亚哈斯台阶上
  rationale: מַעֲלוֹת的基本意义是“台阶、阶级”，原文并未明确说明这是日晷或其他测影装置，因此正文不作历史性重构。
- source_word: אֲשֶׁר יָרְדָה
  choice: 沿着先前下移的台阶
  rationale: 关系从句说明影子此前曾顺着这些台阶下移；加入“先前”自然表达希伯来叙事中已发生的动作。
- source_word: אֲחֹרַנִּית עֶשֶׂר מַעֲלוֹת
  choice: 倒退了十级
  rationale: “倒退”表达אֲחֹרַנִּית的反向运动，“十级”则自然表达影子移动所跨越的十个台阶。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威；主
  rationale: 保留原文中的专有神名而不以称号“主”取代；正文采用普通现代中文读者最熟悉的专名形式“耶和华”。
- issue: “亚哈斯的台阶”所指为何
  choice: 不在正文中判定具体装置，只译作“亚哈斯台阶”
  alternative: 亚哈斯的日晷；亚哈斯的阶梯式日晷
  rationale: 希伯来文只明确说מַעֲלוֹת（台阶／阶级），无法单凭本节确定其结构和用途；保留这种历史层面的不确定性。
- issue: 使影子倒退者的身份
  choice: 明确重复“耶和华”
  alternative: 译作“他”
  rationale: 希伯来文动词的隐含主语在语境中指耶和华；若在中文中用“他”，容易误解为以赛亚使影子倒退。重复神名是为消除目标语指代歧义，并非增添新的神学解释。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“呼求”“倒退了十级”通俗清楚；保留“亚哈斯台阶”这一较贴近原文的说法，不在正文中引入“日晷”等推定性解释。
