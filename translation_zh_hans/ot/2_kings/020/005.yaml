- from: 你回去告诉我子民的领袖希西家：‘耶和华——你祖先大卫的上帝——这样说：我听见了你的祷告，也看见了你的眼泪。看哪，我正在医治你。[a]第三天，你必上耶和华的殿。’
  to: 你回去，告诉我子民的领袖希西家：‘耶和华——你先祖大卫的上帝——这样说：我听见了你的祷告，也看见了你的眼泪。看哪，我正在医治你。[a]第三天，你必上到耶和华的殿里去。’
