reference: 2 Kings 20:5
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: שׁ֣וּב וְ/אָמַרְתָּ֞ אֶל חִזְקִיָּ֣הוּ נְגִיד עַמִּ֗/י כֹּֽה אָמַ֤ר יְהוָה֙ אֱלֹהֵי֙ דָּוִ֣ד אָבִ֔י/ךָ שָׁמַ֨עְתִּי֙ אֶת תְּפִלָּתֶ֔/ךָ רָאִ֖יתִי אֶת דִּמְעָתֶ֑/ךָ הִנְ/נִי֙ רֹ֣פֶא לָ֔/ךְ בַּ/יּוֹם֙ הַ/שְּׁלִישִׁ֔י תַּעֲלֶ֖ה בֵּ֥ית יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/005.yaml
  text: 'Go back and say to Hezekiah[a], the leader of my people, ‘Thus says Yahweh, the God of David your father: I have heard your prayer; I have seen your tears. Look, I am healing you. On the third day you will go up to the house of Yahweh.’'
translation:
  language: zh_hans
  text: 你回去，告诉我子民的领袖希西家：‘耶和华——你先祖大卫的上帝——这样说：我听见了你的祷告，也看见了你的眼泪。看哪，我正在医治你。[a]第三天，你必上到耶和华的殿里去。’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“看哪，我必医治你。”希伯来文直译为“看哪，我正在医治你”，所用分词也可表示即将发生的行动。
    reason: 保留 הִנְנִי 加分词在进行与迫近将来之间的体貌空间。
lexical_decisions:
- source_word: שׁוּב
  choice: 你回去
  rationale: 这是对以赛亚的命令，要他折返去见希西家；“回去”自然保留方向含义。
- source_word: נְגִיד עַמִּי
  choice: 我子民的领袖
  rationale: נְגִיד 指受立、治理百姓的人；“领袖”清楚自然，也避免“王子”的世袭贵族意味。
- source_word: כֹּה אָמַר יְהוָה
  choice: 耶和华……这样说
  rationale: 保留先知传信的固定宣告格式，并直接译出神名。
- source_word: אֱלֹהֵי דָּוִד אָבִיךָ
  choice: 你祖先大卫的上帝
  rationale: אָב 可指先祖；现代汉语用“祖先”能清楚表达希西家与大卫的世代关系。
- source_word: שָׁמַעְתִּי אֶת תְּפִלָּתֶךָ
  choice: 我听见了你的祷告
  rationale: 完成式指已经发生且与当前回应直接相关的行动；“听见了”简洁自然。
- source_word: רָאִיתִי אֶת דִּמְעָתֶךָ
  choice: 也看见了你的眼泪
  rationale: 与“听见了你的祷告”形成平行，并用“也”体现两个回应依据的并列。
- source_word: הִנְנִי רֹפֶא לָךְ
  choice: 看哪，我正在医治你
  rationale: הִנְנִי 带出强调和临近的行动，分词 רֹפֶא 保留进行或即将发生的张力，不径直化为单纯将来时。
- source_word: בַּיּוֹם הַשְּׁלִישִׁי
  choice: 第三天
  rationale: 直接对应希伯来语时间短语，无须增补“从现在起”。
- source_word: תַּעֲלֶה בֵּית יְהוָה
  choice: 你必上耶和华的殿
  rationale: עלה 保留前往圣殿的“上”行意象；בֵּית יְהוָה 在此自然译作“耶和华的殿”，清楚指圣殿。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: “耶和华”是现代简体中文圣经传统中广为人知的专名形式，能区别于称号“主”，并保留原文中的圣约神名。
- issue: הִנְנִי רֹפֶא 的时态与体貌
  choice: 看哪，我正在医治你
  alternative: 看哪，我必医治你
  rationale: 原文用 הִנְנִי 加分词，可表达正在展开或迫近的行动；正文保留这种即时性，脚注说明符合语境的将来表达。
- issue: “第三天”与医治时间的关系
  choice: 不补充具体起算点，也不将医治限定为第三天才开始
  alternative: 三天后我必医治你
  rationale: 原文明确说第三天上殿，却未明确把医治本身限定在那一天；译文保留这一差别。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。先知宣告式用“这样说”，避免文言化的“如此说”；以“看哪”保留原文强调语气。正文中的脚注标记 [a] 紧随相关分句。
