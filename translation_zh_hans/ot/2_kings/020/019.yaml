  text: וַ/יֹּ֤אמֶר חִזְקִיָּ֨הוּ֙ אֶֽל יְשַֽׁעְיָ֔הוּ ט֥וֹב דְּבַר יְהוָ֖ה אֲשֶׁ֣ר דִּבַּ֑רְתָּ וַ/יֹּ֕אמֶר הֲ/ל֛וֹא אִם שָׁל֥וֹם וֶ/אֱמֶ֖ת יִהְיֶ֥ה בְ/יָמָֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/019.yaml
  text: Then Hezekiah said to Isaiah[a], “The word of Yahweh that you have spoken is good.” For he thought, “Will there not be peace and stability in my days?”
translation:
  language: zh_hans
  text: 于是，希西家对以赛亚说：“你所说的雅威的话很好。”他又说：“只要我在世的日子有平安和安稳[a]，不也好吗？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“平安和信实（或真实）。”希伯来词 אֱמֶת 可表示真实、信实，也可按本处语境指可靠而稳固的状态。
    reason: 保留 אֱמֶת 的词义范围及传统译法。
lexical_decisions:
- source_word: טוֹב
  choice: 好的
  rationale: 保留原文直接而简短的评价，不把希西家的动机解释为“有利”或“可接受”。
- source_word: דְּבַר יְהוָה
  choice: 雅威的话
  rationale: “话”保留先知性宣告中 דָּבָר 的正式关联；“雅威”按希伯来神名的通行学术拟音处理。
- source_word: דִּבַּרְתָּ
  choice: 你所传达的
  rationale: 原文直译为“你所说的”；中文用“传达”自然表明以赛亚是神谕的宣告者，但不改变信息的来源。
- source_word: שָׁלוֹם
  choice: 平安
  rationale: 保留该词涵盖和平、安康与整体福祉的宽泛含义。
- source_word: אֱמֶת
  choice: 安稳
  rationale: 在王国及现实处境中，该词可指可靠、稳固的状态；“安稳”比抽象的“真实”更合乎此处语境，同时在脚注保留其他词义。
- source_word: בְיָמָי
  choice: 我在世的日子
  rationale: 既保留“在我的日子里”的意象，又以现代汉语清楚表达“在我有生之年”。
theological_decisions:
- issue: 希西家最后一句在希伯来文中句式简略，且可视为直接说出的话或叙述者对其想法的说明。
  choice: 按 וַיֹּאמֶר 译为直接言语，并以“若……不也好吗？”补足中文所需的省略成分。
  alternative: 译为内心想法：“因为他心想：‘我在世的日子岂不会有平安和安稳吗？’”
  rationale: 原文明说“他又说”，因此保留直接言语更贴近文本；“若……不也好吗？”反映 הֲלוֹא אִם 的反问和条件意味，同时不替读者判定希西家的品格或动机。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“我在世的日子”通俗清楚；末句保留原文的反问、条件色彩和道德张力。
