  yaml_path: translation/ot/2_kings/020/016.yaml
  text: Then Isaiah said to Hezekiah[a], “Hear the word of Yahweh.”
translation:
  language: zh_hans
  text: 以赛亚就对希西家说：“你要听雅威[a]的话。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文为“YHWH”；传统译作“耶和华”。
    reason: 说明四字神名的原文形式及传统中文译法。
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 就……说
  rationale: 叙事性连续式推动情节；“就”自然表达承接和顺序，而不机械译作“并且”。
- source_word: יְשַׁעְיָהוּ
  choice: 以赛亚
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: אֶל חִזְקִיָּהוּ
  choice: 对希西家
  rationale: 介词 אֶל 在言说结构中表示说话对象，现代汉语自然译作“对……”。
- source_word: שְׁמַע
  choice: 你要听
  rationale: 这是第二人称阳性单数祈使式；补出“你要”可在现代汉语中清楚传达先知郑重命令的语气。
- source_word: דְּבַר
  choice: 的话
  rationale: 在先知宣告套语中指来自上帝的言语或信息；“的话”既自然，也保留“话语”的圣经意涵。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文读者最熟悉的专名形式呈现四字神名，同时用脚注说明其希伯来文形式，避免将专名仅处理为称号。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威；上主
  rationale: 原文直接使用四字神名。正文采用中文圣经传统中最通行、普通读者最易识别的专名“耶和华”；脚注交代希伯来文为 YHWH。此处不以称号“上主”取代专名，也不把有争议的古代发音当作完全确定。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“你要听”保留先知召唤的命令力度；句末用句号，因为引语在本节构成完整句子。
