base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/008.yaml
  text: And Hezekiah said to Isaiah[a], “What is the sign that Yahweh will heal me and that I will go up to the house of Yahweh on the third day?”
translation:
  language: zh_hans
  text: 希西家对以赛亚说：“有什么兆头能表明雅威会医治我，并且我会在第三天上雅威的殿[a]去呢？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “雅威的殿”直译为“雅威的家”。
    reason: 保留בֵּית יְהוָה的字面表达，并说明其在本处指圣殿。
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: 以普通话叙事中自然的过去事件表达承接希伯来语连续叙事形式；无需机械译出“于是”或“并且”。
- source_word: חִזְקִיָּהוּ
  choice: 希西家
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: יְשַׁעְיָהוּ
  choice: 以赛亚
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: מָה אוֹת
  choice: 有什么兆头
  rationale: אוֹת在此指证实神应许的可见记号；“兆头”自然且保留其超出一般证据的含义。
- source_word: כִּי
  choice: 能表明
  rationale: 这里引出所求兆头要证实的内容；译为“能表明”使中文问句清楚，同时不把它误解为原因从句。
- source_word: יִרְפָּא
  choice: 必医治
  rationale: 未完成式在应许内容中指向将来的行动；“必”兼顾未来性和所陈述应许的确定性。
- source_word: יְהוָה
  choice: 雅威
  rationale: 将四字神名作为专名音译，而不以“主”这一称号替代；“雅威”较直接反映通常重构的读音。
- source_word: לִי
  choice: 医治我
  rationale: 希伯来语介词结构按现代汉语习惯译为动词直接带宾语。
- source_word: וְעָלִיתִי
  choice: 并且我……必上
  rationale: 保留与前一应许内容的并列关系；עלה也保留前往圣殿所含的“上去”方向感。
- source_word: בַּיּוֹם הַשְּׁלִישִׁי
  choice: 第三天
  rationale: 自然、准确地表达所指的时间。
- source_word: בֵּית יְהוָה
  choice: 雅威的殿
  rationale: “殿”在此自然指敬拜雅威的圣殿；脚注保留其字面结构“雅威的家”。
theological_decisions:
- issue: 四字神名יהוה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用神的专名。正文采用音译“雅威”，既避免以称号“主”取代专名，也比传统形式“耶和华”更贴近通常重构的发音。
- issue: 兆头所证实的内容范围
  choice: 同时包括雅威医治希西家，以及希西家第三天上圣殿
  alternative: 只把兆头理解为医治的证据
  rationale: 原文以וְ连接两个分句，二者都自然受“有什么兆头”所引出的内容关系支配，因此译文保留并列，不缩窄兆头的指向。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。“必医治……必上”保留应许的未来性与确定语气；“上……的殿”保留原文עלה所体现的上行表达。脚注标记置于实际对应的“殿”之后。
