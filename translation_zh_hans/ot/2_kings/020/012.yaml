base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/012.yaml
  text: At that time Merodach-baladan son of Baladan[a], king of Babylon, sent letters and a gift to Hezekiah, because he had heard that Hezekiah had been sick.
translation:
  language: zh_hans
  text: 那时，巴比伦王巴拉但的儿子比罗达·巴拉但[a]送了书信和礼物给希西家，因为他听说希西家曾患病。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文本作“比罗达·巴拉但”；《以赛亚书》39:1及古代传统保存的另一名称形式作“米罗达·巴拉但”。
    reason: alternative_reading
lexical_decisions:
- source_word: בָּעֵת הַהִיא
  choice: 那时
  rationale: 这是常见的叙事时间标记；“那时”简洁自然，不额外限定时间长短。
- source_word: שָׁלַח
  choice: 派人送
  rationale: 希伯来语直译为“送出”；中文在君王寄送外交信函和礼物的语境中，用“派人送”自然地表达经由使者递送的含义，而不改变动作主体。
- source_word: בְּרֹאדַךְ בַּלְאֲדָן
  choice: 比罗达·巴拉但
  rationale: 按《列王纪下》马所拉文本的辅音形式音译为“比罗达”；与“巴拉但”之间加间隔号，清楚呈现复合人名。平行经文和古代传统所保存的“米罗达”异读置于脚注。
- source_word: בֶּן בַּלְאֲדָן
  choice: 巴拉但的儿子
  rationale: 直接表达希伯来语父子关系，并按自然中文把这一身份说明置于人名前。
- source_word: מֶלֶךְ בָּבֶל
  choice: 巴比伦王
  rationale: 以现代中文常用的称号结构表达其王位与疆域。
- source_word: סְפָרִים
  choice: 信
  rationale: 该词可泛指书面材料；在两国君王往来的外交语境中，具体译作“信”最贴切。
- source_word: וּמִנְחָה
  choice: 和礼物
  rationale: מִנְחָה 可指礼物、供物或贡物；本处没有明确的进贡或祭祀语境，“礼物”最中性。
- source_word: אֶל חִזְקִיָּהוּ
  choice: 给希西家
  rationale: 自然表达动作的接受者。
- source_word: כִּי שָׁמַע
  choice: 因为他听说
  rationale: 第一个 כִּי 引出送信和礼物的原因；“因为”明确保留因果关系。
- source_word: כִּי חָלָה חִזְקִיָּהוּ
  choice: 希西家病过
  rationale: 第二个 כִּי 引出听闻的内容。动词完成式结合上下文指先前的患病；“病过”自然表达这一点，又不添加康复细节。
