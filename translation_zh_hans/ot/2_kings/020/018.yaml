base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/018.yaml
  text: And some of your sons who will come from you[a], whom you will father, will be taken, and they will become eunuchs in the palace of the king of Babylon.
translation:
  language: zh_hans
  text: 从你而出、由你所生的儿子中，必有人会被带走；他们将在巴比伦王的宫中作太监[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“宫廷官员”或“王宫官员”。希伯来语这个词可指真正的太监，也可在某些语境中指王室官员。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִבָּנֶיךָ
  choice: 你的儿子中，必有人
  rationale: 介词 מִן 在这里表示整体中的一部分，因此译为“儿子中，必有人”，既保留“儿子”的具体称谓，也自然表达部分之意。
- source_word: אֲשֶׁר יֵצְאוּ מִמְּךָ
  choice: 从你而出的
  rationale: 保留希伯来语表示血缘出自希西家的说法；“从你而出”在现代汉语中略带庄重色彩，也能清楚表达亲生后代之意。
- source_word: אֲשֶׁר תּוֹלִיד
  choice: 你所生
  rationale: 该词是 ילד 的使役形，向男性说话时指生育、成为父亲；汉语“你所生”自然简洁，并保留父系生育的含义。
- source_word: יקח
  choice: 必有人被带走
  rationale: 马所拉文本的动词形式为单数主动，但语境中的施事者未明说，具有不定、非人称意味；汉语用被动表达最自然，也不擅自补出具体施事者。
- source_word: וְהָיוּ
  choice: 他们要……作
  rationale: היה 与表身份的名词连用，既可表示“是”，也可表示进入某种身份；“作太监”自然表达被带走后所处的新身份。
- source_word: סָרִיסִים
  choice: 太监
  rationale: 该词的核心义是受阉割、在宫廷供职的男子，此处用于被掳到外国王宫的王族子弟，按字面理解合理；其“宫廷官员”义保留在脚注中。
- source_word: בְּהֵיכַל
  choice: 在……宫中
  rationale: הֵיכָל 可指殿宇、圣殿或王宫；因其后限定为“巴比伦王”，这里明确是王宫。
- source_word: מֶלֶךְ בָּבֶל
  choice: 巴比伦王
  rationale: 这是清楚直接的属格结构；现代汉语以“巴比伦王”表达最简洁自然。
theological_decisions:
- issue: סָרִיסִים 在宫廷语境中的含义
  choice: 正文译为“太监”
  alternative: 宫廷官员；王宫官员
  rationale: 该词既可按字面指太监，也可引申指宫廷官员。此处预言希西家的儿子被带进巴比伦王宫，字面义符合词的核心含义和审判语境；但上下文不能完全排除官职义，因此以脚注保留另一种理解。
translation_notes:
  register: 采用现代、庄重而清楚的叙事语言。“你所生、从你而出的”有意保留原文两个相近的血缘表达，不将其合并为单一释义；“必有人被带走”则以自然汉语呈现原文未明说施事者的表达。脚注标记紧随存在词义歧义的“太监”。
