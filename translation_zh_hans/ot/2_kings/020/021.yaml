base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/021.yaml
  text: And Hezekiah lay down with his fathers[a], and Manasseh his son became king in his place.
translation:
  language: zh_hans
  text: 希西家与他的列祖同睡[a]，他儿子玛拿西接续他作王。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这是希伯来语中记述君王去世的惯用说法；也可译作“与他的列祖同眠”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: 同睡
  rationale: שׁכב在“与列祖”这一固定王室讣告用语中委婉表示死亡；译作“同睡”既保留希伯来语意象，也符合中文圣经语体。
- source_word: עִם אֲבֹתָיו
  choice: 与他的列祖
  rationale: 直译为“与他的父辈”，在此指先祖；“列祖”自然凝练，并保留传统死亡公式的庄重感。
- source_word: וַיִּמְלֹךְ
  choice: 作王
  rationale: מלך在王位继承公式中表示登基掌权；与“接续他”连用，清楚表达继位。
- source_word: מְנַשֶּׁה
  choice: 玛拿西
  rationale: 采用现代简体中文圣经中通行的人名音译。
- source_word: בְנוֹ
  choice: 他儿子
  rationale: 明确保留原文的父子关系，符合自然现代汉语表达。
- source_word: תַּחְתָּיו
  choice: 接续他
  rationale: תחתיו在王位继承语境中意为“代替他、居其位”；“接续他作王”自然准确地表达王位承继。
theological_decisions:
- issue: 死亡公式是否直接释为“死了”
  choice: 保留“与他的列祖同睡”的委婉意象
  alternative: 译为“死了”或“归到他的列祖那里”
  rationale: 原文使用王室记载中固定的委婉死亡公式，而非普通的“死”字；保留意象可避免抹平原文措辞，同时脚注说明其含义。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“列祖”“同睡”保留希伯来王室死亡公式的传统意象，脚注为普通读者说明其实际含义；“接续他作王”清楚传达王位继承。
