  text: וַ/יֹּ֣אמֶר יְשַֽׁעְיָ֔הוּ קְח֖וּ דְּבֶ֣לֶת תְּאֵנִ֑ים וַ/יִּקְח֛וּ וַ/יָּשִׂ֥ימוּ עַֽל הַ/שְּׁחִ֖ין וַ/יֶּֽחִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/007.yaml
  text: And Isaiah said[a], “Take a cake of figs.” So they took it and laid it on the boil[c][b], and he recovered.
translation:
  language: zh_hans
  text: 以赛亚说：“取一块无花果饼[a]。”他们就取了一块，敷在那疮[b]上，他便康复了[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “无花果饼”指压制成块的无花果；也可译作“一块压制的无花果”。
    reason: lexical_alternative
  - marker: b
    text: “疮”也可译作“疖”或“溃疡”。原词可指发炎的皮肤疮患。
    reason: lexical_alternative
  - marker: c
    text: 直译“他就活了”；在这里指他恢复了健康。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: 叙事体中的连续式推动情节；现代汉语通常无需逐字译出连接词，语序已清楚表达事件的推进。
- source_word: יְשַׁעְיָהוּ
  choice: 以赛亚
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: קְחוּ
  choice: 取……来
  rationale: 该复数命令式基本义为“拿、取”；“取……来”符合此处吩咐人取得物品的自然汉语表达，又不过度强调“带来”的方向性。
- source_word: דְּבֶלֶת תְּאֵנִים
  choice: 一块无花果饼
  rationale: דְּבֶלֶת 指压制成块的果饼，תְּאֵנִים 明确为无花果；“无花果饼”简洁、具体，并以脚注说明其压制成块的形态。
- source_word: וַיִּקְחוּ
  choice: 他们就取来
  rationale: 动词为复数，主语未明说；中文补出“他们”，并用“就”自然表达对命令的随即执行。宾语承接上文，无需再次明说。
- source_word: וַיָּשִׂימוּ עַל
  choice: 敷在……上
  rationale: שׂים עַל 直义为“放在……上”；因所放的是无花果饼，且对象是疮患，“敷在”是符合语境而不失原意的现代汉语。
- source_word: הַשְּׁחִין
  choice: 疮
  rationale: 该词可指疖、发炎的疮或溃疡。“疮”保留原词疾病类别上的一定宽度，不武断限定具体诊断。
- source_word: וַיֶּחִי
  choice: 他便康复了
  rationale: חיה 字面可表示“活了”，在本段医治疾病的语境中是恢复健康之意；“康复了”自然传达语境含义，同时以脚注保留字面表达。
theological_decisions:
- issue: וַיֶּחִי 所描述的结果
  choice: 身体从疾病中康复
  alternative: 字面译作“他就活了”或译作“他恢复了生气”
  rationale: 上下文叙述将无花果饼敷在希西家的疮上，因此该动词在这里最自然地表示恢复健康。译作“康复”避免让现代读者误以为这是死而复生，同时脚注保留希伯来文的字面措辞。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。叙事连接不机械重复“于是/并且”，以“就”“便”体现动作推进；“敷”准确呈现把无花果饼置于患处的动作，但不据此断定其医学机制。
