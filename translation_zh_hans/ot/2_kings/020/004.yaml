  terminology: “以赛亚”是通行中文人名；“雅威”一致呈现 יהוה 为专名；“雅威的话”“临到他”均符合中文圣经语体。将有争议的 הָעִיר הַתִּיכֹנָה 译为“中院”，并以脚注说明其字面“中间的城”及语境性理解，妥善保留了文本不确定性。
