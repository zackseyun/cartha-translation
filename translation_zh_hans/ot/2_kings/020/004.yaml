  text: וַ/יְהִ֣י יְשַׁעְיָ֔הוּ לֹ֣א יָצָ֔א ה/עיר הַ/תִּֽיכֹנָ֑ה וּ/דְבַר יְהוָ֔ה הָיָ֥ה אֵלָ֖י/ו לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/004.yaml
  text: And it happened[a], before Isaiah had gone out into the middle court, that the word of Yahweh came to him, saying,
translation:
  language: zh_hans
  text: 以赛亚还没有走出中院[a]，雅威的话就临到他，说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“中间的城”；这里传统上理解为王宫区域或院落，因此译作“中院”。
    reason: 保留 הָעִיר הַתִּיכֹנָה 在字面形式与上下文理解之间的差异。
lexical_decisions:
- source_word: וַיְהִי
  choice: （融入“还没有……就……”句式）
  rationale: 这是叙事性的 wayyiqtol，用来引出随即发生的新进展。现代汉语无需机械译成“事情发生了”；“还没有……就……”自然地表达了事件的衔接。
- source_word: יְשַׁעְיָהוּ
  choice: 以赛亚
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: לֹא יָצָא
  choice: 还没有走出
  rationale: 在 וַיְהִי 所引出的时间背景中，否定式表示以赛亚尚未完成离开的动作；“还没有”准确传达时间关系。
- source_word: הָעִיר הַתִּיכֹנָה
  choice: 中院
  rationale: 字面可理解为“中间的城”，但在希西家王宫的叙事场景中，传统上理解为宫殿区域的中院。“中院”适合正文，同时以脚注保留希伯来文本的字面歧义。
- source_word: וּדְבַר יְהוָה
  choice: 雅威的话
  rationale: 保留先知叙事中“雅威的话”这一固定表达，并将四字神名作为专名音译。
- source_word: הָיָה אֵלָיו
  choice: 临到他
  rationale: 这是先知领受神谕的惯用表达；“临到他”在现代庄重中文中自然，也保留其公式性。
- source_word: לֵאמֹר
  choice: 说
  rationale: 引出下一节的直接引语；句末用冒号表示话语尚未结束。
theological_decisions:
- issue: 四字神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用神的专名 יהוה；正文采用较能反映其可能读音的“雅威”，而不以称号替代。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。“还没有……就……”清楚呈现两件事紧密相接；脚注标记紧随存在文本歧义的“中院”。
