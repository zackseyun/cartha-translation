  source_fidelity: 译文准确表达了叙事的时间关系：以赛亚尚未完成离开，中间即有雅威的话临到他。“还没有……就……”自然地吸收了 וַיְהִי 所引出的事件衔接，并恰当传达 לֹא יָצָא 的未完成离开之意。“临到他，说：”忠实反映先知话语公式 וּדְבַר יְהוָה הָיָה אֵלָיו לֵאמֹר。
