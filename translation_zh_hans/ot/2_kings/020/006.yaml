  text: וְ/הֹסַפְתִּ֣י עַל יָמֶ֗י/ךָ חֲמֵ֤שׁ עֶשְׂרֵה֙ שָׁנָ֔ה וּ/מִ/כַּ֤ף מֶֽלֶךְ אַשּׁוּר֙ אַצִּ֣ילְ/ךָ֔ וְ/אֵ֖ת הָ/עִ֣יר הַ/זֹּ֑את וְ/גַנּוֹתִי֙ עַל הָ/עִ֣יר הַ/זֹּ֔את לְמַֽעֲנִ֔/י וּ/לְמַ֖עַן דָּוִ֥ד עַבְדִּֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/006.yaml
  text: And I will add fifteen years to your life[a], and I will deliver you and this city from the hand of the king of Assyria[b], and I will defend this city for my own sake and for the sake of my servant David.
translation:
  language: zh_hans
  text: 我要使你的寿命延长十五年；我要救你和这城脱离亚述王的手[a]，也要保卫这城[b]，为我自己的缘故，也为我仆人大卫的缘故。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“脱离亚述王的权势”；“手”是原文的字面表达。
    reason: lexical_alternative
  - marker: b
    text: 或译：“保护这城”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֹסַפְתִּי עַל יָמֶיךָ חֲמֵשׁ עֶשְׂרֵה שָׁנָה
  choice: 我要使你的寿命延长十五年
  rationale: 原文直译为“我要在你的日子上加添十五年”。“使你的寿命延长十五年”在现代汉语中自然清楚，同时准确表达加添年日的意思。
- source_word: וּמִכַּף מֶלֶךְ אַשּׁוּר אַצִּילְךָ וְאֵת הָעִיר הַזֹּאת
  choice: 我要救你和这城脱离亚述王的手
  rationale: נצל 的使役形表示救出、解救；כף 字面为“手”，在此指权势或控制。“脱离……的手”保留原文意象，在中文圣经语体中也易于理解。
- source_word: וְגַנּוֹתִי עַל הָעִיר הַזֹּאת
  choice: 也要保卫这城
  rationale: גנן 表示遮护、保护或防卫；在亚述军事威胁的语境中，“保卫”贴切地表达上帝护守城邑的行动。
- source_word: לְמַעֲנִי
  choice: 为我自己的缘故
  rationale: 该短语说明行动的依据或动机；“我自己”自然体现原文第一人称所带的强调。
- source_word: וּלְמַעַן דָּוִד עַבְדִּי
  choice: 也为我仆人大卫的缘故
  rationale: 直接保留原文所陈明的理由及“我仆人大卫”这一关系称谓，不扩展其神学含义。
theological_decisions:
- issue: 上帝保卫耶路撒冷的动机
  choice: 为我自己的缘故，也为我仆人大卫的缘故
  alternative: 为我的缘故，也为大卫的缘故
  rationale: 原文明说上帝顾念自己，也顾念他的仆人大卫。译文保留这两重理由以及“仆人”的关系称谓，不把其中的圣约含义作超出经文的解释。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“寿命延长”避免生硬直译“在你的日子上加添”；“亚述王的手”则有意保留原文可理解的形象表达。分号用于清楚区分延寿应许与解救、保卫之应许。
