  text: וַ/תֹּ֨אמֶר֙ אֵ֣ם הַ/נַּ֔עַר חַי יְהוָ֥ה וְ/חֵֽי נַפְשְׁ/ךָ֖ אִם אֶעֶזְבֶ֑/ךָּ וַ/יָּ֖קָם וַ/יֵּ֥לֶךְ אַחֲרֶֽי/הָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/030.yaml
  text: Then the boy’s mother said[a], “As Yahweh lives, and as your soul lives, I will not leave you.” So he arose and went after her.
translation:
  language: zh_hans
  text: 那男孩的母亲说[a]：“我指着永活的雅威和你的性命起誓，我决不离开你！”于是，以利沙起身跟着她去了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这是一种希伯来语誓言格式，字面意思是：“雅威活着，你的性命也活着；如果我离开你……”也就是：“雅威怎样确实活着、你怎样确实活着，我也决不离开你。”
    reason: 说明原文誓言公式及其省略式条件句，兼顾字面形式和实际含义。
lexical_decisions:
- source_word: אֵם הַנַּעַר
  choice: 孩子的母亲
  rationale: 按希伯来语领属结构直译为“孩子的母亲”，自然清楚，也保留上下文中的特定身份。
- source_word: חַי יְהוָה וְחֵי נַפְשְׁךָ
  choice: 我指着永活的雅威和你的性命起誓
  rationale: 这是希伯来语的郑重起誓公式。中文补出语义隐含的“指着……起誓”，使普通读者能自然理解；“性命”保留 נֶפֶשׁ 在此处所指的个人生命。
- source_word: יְהוָה
  choice: 雅威
  rationale: 采用四字神名 YHWH 的现代汉语音译，表明原文使用的是上帝的专名，而非“主”这一称号。
- source_word: אִם אֶעֶזְבֶךָּ
  choice: 我决不离开你
  rationale: אִם 位于誓言之后，构成省略惩罚后果的否定誓言，并非普通条件句；“决不”传达其强烈保证。
- source_word: וַיָּקָם
  choice: 以利沙起身
  rationale: 原文主语为“他”，上下文指以利沙；中文明确姓名可避免与孩子或其他男性人物混淆。“起身”自然对应 קום。
- source_word: וַיֵּלֶךְ אַחֲרֶיהָ
  choice: 跟着她去了
  rationale: 准确表达“在她之后走”的实际含义，比逐字译为“走在她后面”更符合现代汉语叙事。
theological_decisions:
- issue: 誓言中神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名。译作“雅威”保留专名性质，也避免以称号“上主”替代；“耶和华”虽是汉语传统形式，但源于较晚的混合读法。
- issue: 是否把 אִם אֶעֶזְבֶךָ 译成条件句
  choice: 我决不离开你
  alternative: 如果我离开你……
  rationale: 这里是古代誓言公式中省略自咒后果的表达。直译为未完的条件句会使现代读者误解；译出否定保证，同时以脚注保存原文形式。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“指着……起誓”使希伯来语誓言公式在汉语中清楚自然；“于是”承接连续叙事。主句补明“以利沙”，以免代词指向含混。
