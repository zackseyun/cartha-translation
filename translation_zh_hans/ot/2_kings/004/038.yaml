  source_fidelity: 经文主干意思准确：以利沙返回吉甲，饥荒在当地，先知群体成员坐在他面前；他吩咐侍从安置大锅，并为他们烹煮食物。须微调两处：希伯来语שׁפת在此明确为把锅置于火上，中文宜明说；“炖食”虽可勉强对应נָזִיד，但不是自然、稳定的现代汉语经文用语。
