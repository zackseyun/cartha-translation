base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/038.yaml
  text: And Elisha returned to Gilgal[a], and there was a famine in the land. Now the sons of the prophets were sitting before him, and he said to his servant, “Put on the large pot and boil stew for the sons of the prophets.”
translation:
  language: zh_hans
  text: 以利沙回到吉甲。当时那地正遭饥荒。先知的门徒[a]坐在他面前，他便对仆人说：“把大锅架在火上，给先知的门徒煮些汤。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译“先知的儿子们”，指先知群体中的成员或门徒。
    reason: 说明希伯来语群体称谓的字面形式及其语境含义。
lexical_decisions:
- source_word: שָׁב הַגִּלְגָּלָה
  choice: 回到吉甲
  rationale: שָׁב表示返回，地名后的方向词尾表示朝向该地；“回到吉甲”简洁自然地表达二者。
- source_word: וְהָרָעָב בָּאָרֶץ
  choice: 当时那地正遭饥荒
  rationale: 这是交代背景的无动词分句；“当时……正……”在现代汉语中自然呈现其伴随和持续意味。
- source_word: בְנֵי הַנְּבִיאִים
  choice: 众先知的门徒
  rationale: 字面为“先知的儿子们”，实际指先知群体中的成员或受教者。正文采用普通读者容易理解的功能对等表达，并以脚注保留原文意象。
- source_word: יֹשְׁבִים לְפָנָיו
  choice: 坐在他面前
  rationale: 保留原文的空间与关系表达，也自然暗示门徒在老师面前受教的场景，而不把这一含义明说为确定事实。
- source_word: לְנַעֲרוֹ
  choice: 对仆人
  rationale: נַעַר可指少年、侍从或仆人；此人奉命料理食物，语境支持“仆人”。
- source_word: שְׁפֹת הַסִּיר הַגְּדוֹלָה
  choice: 把那口大锅架起来
  rationale: שׁפת在炊事语境中指把锅安放到火上；“架起来”比单说“放上”更清楚，又无需添加原文未明说的“火”。
- source_word: וּבַשֵּׁל נָזִיד
  choice: 煮一锅炖食
  rationale: בשל表示煮或烹制，נָזִיד指煮成的浓汤或炖食；“炖食”保留其食物类别，“一锅”使汉语表达顺畅。
theological_decisions:
- issue: בְנֵי הַנְּבִיאִים这一群体称谓的译法
  choice: 正文译作“众先知的门徒”
  alternative: 直译作“先知的儿子们”或译作“先知团体”
  rationale: 这里的“儿子”是群体归属用语，并非明确表示血缘关系。“门徒”最便于现代读者理解，同时脚注保留字面形式和“群体成员”的可能内涵，避免把其具体制度性质说得过于确定。
translation_notes:
  register: 采用现代、庄重而清楚的叙事汉语。“遭饥荒”“架起来”“炖食”兼顾可懂度与经文语体；不使用较古旧的“先知门徒之子”或容易误解为血缘关系的直译。
