  terminology: “先知的门徒”可恰当地传达בְנֵי הַנְּבִיאִים作为先知群体成员的惯用称谓，且脚注保留其字面形式。删除“众”可避免中文读者把它理解为许多不同先知各自的门徒；原文复数属格仍由“先知的”充分表达。
