    issue: “煮一锅炖食”不够自然。
    rationale: “炖食”在现代标准汉语中不常作为名词性菜肴类别；נָזִיד可概括译为煮成的汤或炖煮食物。“煮些汤”自然且不将其具体食材或浓稠程度定得过细。
  - severity: low
    issue: “众先知的门徒”可能造成不必要的汉语歧义。
    rationale: “先知的门徒”已能表达原文的群体称谓；脚注说明其非必然血缘关系即可。
