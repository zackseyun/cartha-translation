base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/044.yaml
  text: So he set it before them[a], and they ate and had some left over, according to the word of Yahweh.
translation:
  language: zh_hans
  text: 于是，他把食物摆在众人面前；他们吃了，还有剩余[a]，正如雅威所说的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们吃了，也留下了一些。”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן לִפְנֵיהֶם
  choice: 他把食物摆在众人面前
  rationale: נתן与“在他们面前”连用时，表示把东西摆到人面前。中文补出承接上文的“食物”，使指代清楚而不增添新信息。
- source_word: וַיֹּאכְלוּ
  choice: 他们吃了
  rationale: 按希伯来语叙事次序直译，简洁自然。
- source_word: וַיּוֹתִרוּ
  choice: 还有剩余
  rationale: יתר的使役式在此表示吃过以后仍有食物剩下；“还有剩余”自然表达结果，同时保留可译为“他们留下了一些”的语法可能。
- source_word: כִּדְבַר
  choice: 正如……所说的
  rationale: 字面为“照着……的话”。在现代汉语中，“正如……所说的”准确表达事情应验先前话语的含义。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以常见现代汉语音译呈现四字神名，保留其作为专名的性质，不以头衔替代。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”较贴近学界通常重构的读音，并明确保留神的专名。
- issue: כִּדְבַר יְהוָה 的表达
  choice: 正如雅威所说的
  alternative: 照雅威的话
  rationale: 两者都可表达原文；正文采用自然现代汉语，同时保留这是神先前所说之话得到实现的含义，不额外说明实现机制。
translation_notes:
  register: 采用简洁、庄重的现代标准汉语。保留希伯来叙事的动作顺序，并通过分号清楚连接摆上食物、众人进食和仍有剩余三个环节。
