base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/040.yaml
  text: So they poured it out for the men to eat. But as they were eating from the stew[a], they cried out and said, “There is death in the pot, man of God!” And they could not eat.
translation:
  language: zh_hans
  text: 他们把汤羹盛出来给众人吃。他们正吃那汤羹时，喊叫说：“神人啊，锅里有死亡[a]！”他们就不能吃了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译为“锅里有死亡”。这句话很可能是说锅里的汤羹有致命的毒性。
    reason: 说明原文的形象化表达及其可能含义，同时在正文中保留字面措辞。
lexical_decisions:
- source_word: וַיִּצְקוּ
  choice: 盛出来
  rationale: 该动词本义为“倾倒、倒出”；在分食锅中汤羹的语境下，“盛出来”既保留具体动作，也符合现代汉语习惯。
- source_word: לַאֲנָשִׁים
  choice: 给众人
  rationale: 原文指在场的一群男子；汉语“众人”在本语境中自然指前文聚集的人，并未扩大所指范围。
- source_word: מֵהַנָּזִיד
  choice: 那汤羹
  rationale: נָזִיד指煮成的浓汤或炖食。“汤羹”适合本段以锅煮野瓜的语境，也比古雅的“菜羹”更易懂。
- source_word: צָעָקוּ
  choice: 忽然喊叫
  rationale: 该词表达因危急而发出的高声呼喊；“喊叫”准确传达他们惊恐的反应，“忽然”体现叙事中的突发感。
- source_word: מָוֶת בַּסִּיר
  choice: 锅里有死亡
  rationale: 保留希伯来文鲜明而简洁的字面表达，不直接改译为“锅里有毒”，以免消除原文修辞张力。
- source_word: אִישׁ הָאֱלֹהִים
  choice: 神人哪
  rationale: “神人”是以利沙这一称号的简洁、传统而清楚的译法；“哪”自然标明直接呼语。
- source_word: וְלֹא יָכְלוּ לֶאֱכֹל
  choice: 他们就不能吃了
  rationale: 原文未明说宾语；中文保留这种简洁表达，而“了”自然表示他们因察觉危险而无法继续吃。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而口语可懂的叙事语体。“汤羹”兼顾古代锅煮食物的情境与现代读者的可理解性；引语保留原文“死亡”的强烈意象。
