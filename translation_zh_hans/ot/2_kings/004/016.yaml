  naturalness: “到明年这个约定的时候”搭配生硬；“明年这时候”是现代汉语中自然、清楚且符合上下文的说法。“不要欺骗”比“不要欺哄”更符合现代标准书面语，同时不削弱原文所含“所言不实／使人抱持虚假希望”的张力。
  terminology: “我主”在此作为对以利沙的敬称可以保留，不表示神性；“神人”和“婢女”均准确保留原文的先知称号及女性谦称。“儿子”准确对应 בֵּן。
