  to: 他对她说：“明年这时候，你必抱着一个儿子。”她说：“不，我主，神人啊！不要欺骗你的婢女。”
  rationale: 修订使时间表达符合现代汉语，并以审慎的脚注处理原文习语。其余关键措辞保留原译的源语对应：儿子、我主、神人和女性仆人自称均未改变其基本语义与语体。
