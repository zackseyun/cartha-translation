base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/016.yaml
  text: Then he said[a], "At this appointed time next year, you will be embracing a son." But she said, "No, my lord, man of God; do not deceive your servant."
translation:
  language: zh_hans
  text: 他对她说：“明年这时候，你必抱着一个儿子。”她说：“不，我主，神人啊！不要欺骗你的婢女。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לַמּוֹעֵד הַזֶּה
  choice: 这个约定的时候
  rationale: מוֹעֵד指指定或约定的时间；译文保留其确定性，同时采用现代汉语自然表达。
- source_word: כָּעֵת חַיָּה
  choice: 明年
  rationale: 这个希伯来语习语在此指来年同一时节。正文译出语境中的明确含义，较直译法见脚注。
- source_word: אתי
  choice: 你
  rationale: 按语境和传统读法理解为第二人称阴性独立代词，指书念妇人；汉语以“你”自然表达，预言句式已足以承载其强调意味。
- source_word: חֹבֶקֶת
  choice: 抱着
  rationale: 该分词指拥抱或抱在怀中；“抱着一个儿子”既贴近原文意象，也符合现代汉语习惯。
- source_word: בֵּן
  choice: 一个儿子
  rationale: 原文明确指儿子，不泛化为“孩子”。
- source_word: אַל
  choice: 不
  rationale: 妇人回答开头的第一个אַל表达强烈而恳切的否定；译作“不”保留其情绪力度。
- source_word: אֲדֹנִי
  choice: 我主
  rationale: 这是妇人对以利沙的尊称，表达敬意与从属语气，并非对神的称呼。
- source_word: אִישׁ הָאֱלֹהִים
  choice: 神人
  rationale: “神人”是希伯来圣经中对先知这一称号的简洁、传统且准确的中文表达。
- source_word: תְּכַזֵּב
  choice: 不要欺哄
  rationale: 该动词可指说谎、欺骗或使所说的话落空；“欺哄”既保留字面意义，也传达妇人害怕希望落空的情感。
- source_word: בְּשִׁפְחָתֶךָ
  choice: 你的婢女
  rationale: 原词明确为阴性仆人自称；“婢女”保留性别与谦卑、恭敬的语气。
theological_decisions:
- issue: 对人的尊称 אֲדֹנִי 是否带有神性含义
  choice: 我主
  alternative: 先生；我主人
  rationale: 此处称呼对象是以利沙。“我主”保留社会性的敬称和妇人的恭谨语气，不把它理解为对神的称号。
- issue: תְּכַזֵּב 所表达的是主观欺骗还是应许落空
  choice: 不要欺哄
  alternative: 不要骗；不要使你的婢女失望
  rationale: 原动词容许“欺骗”和“所言不实、落空”的语义张力；“欺哄”不把经文缩减为单纯的失望感，也能表现妇人不敢相信这应许的心情。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“抱着一个儿子”保留原文具体意象；妇人的话使用“不，我主，神人啊”表现惊愕、恳切与尊敬。
