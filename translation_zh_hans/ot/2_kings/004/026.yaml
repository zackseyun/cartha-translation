  text: עַתָּה֮ רֽוּץ נָ֣א לִ/קְרָאתָ/הּ֒ וֶ/אֱמָר לָ֗/הּ הֲ/שָׁל֥וֹם לָ֛/ךְ הֲ/שָׁל֥וֹם לְ/אִישֵׁ֖/ךְ הֲ/שָׁל֣וֹם לַ/יָּ֑לֶד וַ/תֹּ֖אמֶר שָׁלֽוֹם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/026.yaml
  text: Now please run to meet her and say to her[a], ‘Is it well with you? Is it well with your husband? Is it well with the child?’ And she said[b], ‘It is well.’
translation:
  language: zh_hans
  text: 现在请你跑去迎接她，对她说：“你平安[a]吗？你丈夫平安吗？孩子[b]平安吗？”她回答：“平安。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节四次使用同一个希伯来词 shalom，可表示平安、完整、安稳或状况良好；这里是在询问或回答是否安好。
    reason: lexical_alternative
  - marker: b
    text: 或译“男孩”。希伯来语 yeled 可指“孩子”或“男孩”。
    reason: lexical_alternative
lexical_decisions:
- source_word: עַתָּה
  choice: 现在
  rationale: 作时间副词，引出带有急迫感的吩咐；“现在”贴近原文，也符合现代汉语表达。
- source_word: רֽוּץ נָא
  choice: 请你跑去
  rationale: 祈使动词 רוץ 表示“跑”，语气词 נָא 可使吩咐略显委婉，也可加强催促意味；“请你跑去”兼顾命令和语气。
- source_word: לִקְרָאתָהּ
  choice: 迎接她
  rationale: לקראת 常指朝某人而去、前去迎接；此处译为“迎接她”自然且准确。
- source_word: וֶאֱמָר לָהּ
  choice: 对她说
  rationale: אמר 是普通的“说”；“对她说”保留原文直接引语的结构。
- source_word: הֲשָׁלוֹם לָךְ
  choice: 你平安吗
  rationale: 疑问词与 שָׁלוֹם 连用，是询问对方是否安好；“平安”既保留关键词的重复，也涵盖健康、安稳和整体状况。
- source_word: הֲשָׁלוֹם לְאִישֵׁךְ
  choice: 你丈夫平安吗
  rationale: אִישׁ 在此婚姻关系中指“丈夫”；重复“平安吗”再现原文的排比。
- source_word: הֲשָׁלוֹם לַיָּלֶד
  choice: 孩子平安吗
  rationale: יֶלֶד 可指“孩子”或“男孩”；“孩子”不作超出词义本身的限定，并符合双方都知道所指对象的语境。
- source_word: וַתֹּאמֶר שָׁלוֹם
  choice: 她回答：“平安。”
  rationale: 原文答语只有 שָׁלוֹם 一词；汉语用简短的“平安”可保留其凝练和可能带有克制的语气。“回答”在此比机械重复“说”更符合对话关系。
theological_decisions:
- issue: 妇人的回答是否明确宣告一切都安好
  choice: 保留单独一句“平安”
  alternative: 译作“都好”或“一切都平安”
  rationale: 原文只有 שָׁלוֹם，并未明说“一切”或“都”；简短译法保留她当时回答所可能具有的含蓄与叙事张力，不替文本判定其陈述范围。
translation_notes:
  register: 采用现代、自然而庄重的叙事语言。三个问句保持相同句式，以再现希伯来文的重复和节奏；末句保留极简答语，避免消解叙事中的含蓄。
