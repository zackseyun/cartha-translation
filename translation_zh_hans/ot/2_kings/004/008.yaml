base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/008.yaml
  text: And one day Elisha passed through Shunem[a], where there was a prominent woman, and she urged him to eat bread. So whenever he passed by[b], he would turn in there to eat bread.
translation:
  language: zh_hans
  text: 有一天，以利沙经过书念。那里有一个有地位的妇人[a]；她极力请他吃饭[b]。每逢他经过那里，就会进去吃饭。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “有地位的妇人”原文直译为“一个大的妇人”，可能指她有社会地位、声望或财力。
    reason: lexical_alternative
  - marker: b
    text: “吃饭”原文直译为“吃饼”，是指用餐。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי הַיּוֹם
  choice: 有一天
  rationale: 这是希伯来叙事中常见的时间起句；译作“有一天”自然地保留了不定日期的含义。
- source_word: וַיַּעֲבֹר אֱלִישָׁע אֶל שׁוּנֵם
  choice: 以利沙经过书念
  rationale: עָבַר 在行旅语境中表示经过或路过；“经过书念”符合上下文中他日后屡次经过此地的叙述。
- source_word: שׁוּנֵם
  choice: 书念
  rationale: 采用现代中文圣经读者熟悉的传统地名译法。
- source_word: אִשָּׁה גְדוֹלָה
  choice: 一个有地位的妇人
  rationale: 字面为“一个大的妇人”，此处很可能指社会地位、声望或财力。“有地位”在正文中自然，又不把含义限定为单纯富有；脚注保留其语义范围。
- source_word: וַתַּחֲזֶק בּוֹ
  choice: 她竭力挽留他
  rationale: 该表达字面带有抓住、坚持之意，在待客语境中指极力劝请或坚持挽留；“竭力挽留”保留了动作的力度。
- source_word: לֶאֱכָל לָחֶם
  choice: 吃饭
  rationale: לֶחֶם 字面是“饼、食物”，而“吃饼”在此惯指用餐。中文“吃饭”既自然，又准确表达其习语功能；字面信息列入脚注。
- source_word: מִדֵּי עָבְרוֹ
  choice: 每次经过那里
  rationale: מִדֵּי 构式表达反复发生的场合，“每次”清楚体现迭代意义。
- source_word: יָסֻר שָׁמָּה
  choice: 都会进去
  rationale: סוּר 在此指转离原路、到某处停留；结合妇人的住处，译作“进去”简洁自然，并保留转入其家的语境含义。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而通顺的叙事语体。“妇人”与古代叙事背景相称；“吃饭”则使用普通读者自然理解的现代汉语。脚注标记紧随其实际说明的词语，避免将人物身份说明误附于地名，或将“吃饼”的说明误附于“经过”。
