  yaml_path: translation/ot/2_kings/004/020.yaml
  text: And he carried him and brought him to his mother[a], and he sat on her knees until noon; then he died.
translation:
  language: zh_hans
  text: 他抱起孩子，把他带到他母亲那里。孩子坐在母亲的膝上[a]，直到中午；随后死了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“母亲怀里”；希伯来文直译为“母亲的双膝上”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׂאֵהוּ
  choice: 把孩子抱起来
  rationale: נשׂא可表示“举起、抱起、抬、携带”。此处孩子身体不适，由人送到母亲那里，用“抱起来”既体现起始动作，也自然衔接随后的移动。
- source_word: וַיְבִיאֵהוּ
  choice: 送到孩子母亲那里
  rationale: ביא的使役形表示“带来、送到”。“送到……那里”保留朝向母亲的方向感，并符合现代汉语叙事习惯。
- source_word: אֶל אִמּוֹ
  choice: 到孩子母亲那里
  rationale: 原文直译为“到他的母亲那里”。为避免连续代词造成所指含混，汉语中明确为“孩子母亲”，未增加新的叙事信息。
- source_word: וַיֵּשֶׁב
  choice: 孩子坐在
  rationale: ישׁב通常表示“坐、居住、停留”。此处与“在母亲膝上”连用，取其具体的身体姿态“坐”。
- source_word: עַל בִּרְכֶּיהָ
  choice: 在母亲膝上
  rationale: 原文明确使用בֶּרֶךְ“膝”的复数形式。正文保留具体形象；“怀里”虽更符合部分现代汉语表达，但不如“膝上”贴近原文。
- source_word: עַד הַצָּהֳרַיִם
  choice: 直到中午
  rationale: צָהֳרַיִם指正午或中午；“直到中午”准确而自然。
- source_word: וַיָּמֹת
  choice: 就死了
  rationale: 该叙事动词推进事件次序。“就”自然表达孩子一直坐到中午、随后死亡的进展，不额外解释死因。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。为减少代词歧义，以“孩子”明确原文阳性单数代词的所指，但不在本节补出原文未明说的“仆人”。保留“坐在母亲膝上”的具体措辞，并以脚注提供较惯用的“怀里”。
