  text: וַ/יֹּ֨אמֶר֙ אֶל גֵּחֲזִ֣י נַעֲר֔/וֹ קְרָ֖א לַ/שּׁוּנַמִּ֣ית הַ/זֹּ֑את וַ/יִּקְרָא לָ֔/הּ וַֽ/תַּעֲמֹ֖ד לְ/פָנָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/012.yaml
  text: Then he said to Gehazi his servant[a], “Call this Shunammite woman.” So he called her, and she stood before him.
translation:
  language: zh_hans
  text: 以利沙对仆人基哈西说：“叫这个书念妇人[a]来。”基哈西就叫她，她便站在他面前。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “书念妇人”指来自书念的女子；原文是阴性居民称谓，也可译作“这个书念人”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: 叙事中的连续式推动事件发展；现代汉语通常无需逐一译出连接词，语序本身已清楚表达先后。
- source_word: גֵּחֲזִי
  choice: 基哈西
  rationale: 采用现代中文圣经中通行的人名音译。
- source_word: נַעֲרוֹ
  choice: 仆人
  rationale: נַעַר可指年轻人、侍从或仆人；此处强调基哈西服侍以利沙的身份，“仆人”简明自然。
- source_word: קְרָא
  choice: 叫……来
  rationale: 此处קרא表示叫某人到跟前；“叫……来”符合现代汉语表达，力度也不强于原文。
- source_word: לַשּׁוּנַמִּית הַזֹּאת
  choice: 这个书念妇人
  rationale: 阴性居民称谓指出她来自书念；“这个”对应指示词הַזֹּאת，并补出“妇人”使中文清楚自然。
- source_word: וַיִּקְרָא לָהּ
  choice: 基哈西就叫她
  rationale: 重复“叫”以保留原文קרא的复现；补出主语“基哈西”，避免中文代词指向不清。
- source_word: וַתַּעֲמֹד
  choice: 她便站
  rationale: 按עמד的基本义译作“站”，不增添原文未明说的行走动作。
- source_word: לְפָנָיו
  choice: 在他面前
  rationale: 直译该介词短语，并保留第三人称代词的形式，不在正文中强行判定所指。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“叫……来”比“召来”更口语自然，但仍适合经文语体；末句保留“他”的指代形式，以免过度解释原文。
