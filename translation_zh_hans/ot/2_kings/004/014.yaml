  text: So he said[a], “What then is to be done for her?” And Gehazi said, “Well, she has no son[b], and her husband is old.”
translation:
  language: zh_hans
  text: 他就说[a]：“那么，该为她做什么呢？”基哈西说：“不过，她没有儿子[b]，丈夫也老了。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“那么，该为她做些什么呢？”
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译：“她没有一个儿子。”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 他就说
  rationale: 希伯来文只用第三人称代词承接叙事；译作“他”避免在正文中补入原文未明说的名字，“就”自然表达连续叙事。
- source_word: וּמֶה לַעֲשׂוֹת לָהּ
  choice: 那么，该为她做什么呢
  rationale: מֶה 是“什么”，לַעֲשׂוֹת לָהּ 表示“为她做”；“那么”体现连接词在对话中的承接作用，“该”传达所当采取行动的语气。
- source_word: גֵּיחֲזִי
  choice: 基哈西
  rationale: 采用现代中文圣经人名的通行音译。
- source_word: אֲבָל
  choice: 其实
  rationale: 此处不是强烈转折，而是引出基哈西观察到的关键实情；“其实”符合现代汉语对话语气。
- source_word: בֵּן אֵין לָהּ
  choice: 她没有儿子
  rationale: 保留 בֵּן 的具体含义“儿子”，并将希伯来文存在句自然转换为现代汉语领有句。
- source_word: וְאִישָׁהּ זָקֵן
  choice: 丈夫也老了
  rationale: אִישׁ 带第三人称阴性单数后缀，在此指“她的丈夫”；“也”自然连接两个相关事实，זָקֵן 直译为“老了”。
