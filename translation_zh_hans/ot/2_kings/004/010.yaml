  text: נַֽעֲשֶׂה נָּ֤א עֲלִיַּת קִיר֙ קְטַנָּ֔ה וְ/נָשִׂ֨ים ל֥/וֹ שָׁ֛ם מִטָּ֥ה וְ/שֻׁלְחָ֖ן וְ/כִסֵּ֣א וּ/מְנוֹרָ֑ה וְ/הָיָ֛ה בְּ/בֹא֥/וֹ אֵלֵ֖י/נוּ יָס֥וּר שָֽׁמָּ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/010.yaml
  text: Please let us make a small upper room on the wall[a], and let us put there for him a bed, a table, a chair, and a lampstand; and whenever he comes to us[b], he can turn in there.
translation:
  language: zh_hans
  text: 请让我们盖一间小小的楼上房间[a]，在里面为他安放一张床、一张桌子、一把椅子和一座灯台。这样，他每次到我们这里来，就可以到那里歇宿[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译可作“一间小小的有墙的楼上房间”。其中“墙”的关系不甚明确，也可理解为“靠墙建造的”或“在墙上的”；因此也有译作“一间小小的楼上房间”。
    reason: lexical_alternative
  - marker: b
    text: 直译“他可以转到那里去”。这里指旅途中转入该处停留、歇宿。
    reason: lexical_alternative
lexical_decisions:
- source_word: נַעֲשֶׂה נָּא
  choice: 请让我们……盖
  rationale: 第一人称复数意愿式配合נָא，表达礼貌的提议；现代汉语用“请让我们”兼顾商议语气与礼貌意味。
- source_word: עֲלִיַּת קִיר קְטַנָּה
  choice: 在墙上盖一间小楼房
  rationale: עֲלִיָּה指楼上的房间，קִיר意为“墙”；正文保留“在墙上”这一具体而紧凑、但解释上略有歧义的表述，并以脚注列出其他可能理解。
- source_word: וְנָשִׂים לוֹ שָׁם
  choice: 在里面为他安放
  rationale: שׂים是“放置、安放”；“为他”保留间接受词，“在里面”自然承接刚提到的房间。
- source_word: מִטָּה וְשֻׁלְחָן וְכִסֵּא וּמְנוֹרָה
  choice: 一张床、一张桌子、一把椅子和一个灯台
  rationale: 按居室陈设逐项直译；מְנוֹרָה具体指承放灯盏的灯台，不泛化为“灯”。
- source_word: וְהָיָה בְּבֹאוֹ אֵלֵינוּ
  choice: 这样，他每次到我们这里来
  rationale: וְהָיָה引出预期情形或结果；未完成体在语境中表达反复发生的来访，译为“每次”自然明确。
- source_word: יָסוּר שָׁמָּה
  choice: 就可以进去歇息
  rationale: סור本义为“转离、转去”，在旅行接待语境中指转进去停留或住宿；“进去歇息”传达实际功能，同时脚注保留其字面动作意味。
