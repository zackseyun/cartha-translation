source:
  edition: WLC
  text: וְ/אִשָּׁ֣ה אַחַ֣ת מִ/נְּשֵׁ֣י בְנֵֽי הַ֠/נְּבִיאִים צָעֲקָ֨ה אֶל אֱלִישָׁ֜ע לֵ/אמֹ֗ר עַבְדְּ/ךָ֤ אִישִׁ/י֙ מֵ֔ת וְ/אַתָּ֣ה יָדַ֔עְתָּ כִּ֣י עַבְדְּ/ךָ֔ הָיָ֥ה יָרֵ֖א אֶת יְהוָ֑ה וְ/הַ֨/נֹּשֶׁ֔ה בָּ֗א לָ/קַ֜חַת אֶת שְׁנֵ֧י יְלָדַ֛/י ל֖/וֹ לַ/עֲבָדִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/001.yaml
  text: One woman from the wives of the sons of the prophets cried out to Elisha, saying, “Your servant, my husband, has died, and you know that your servant feared Yahweh. And the creditor has come to take my two children for himself as slaves.”
translation:
  language: zh_hans
  text: 有一个妇人，是先知门徒的妻子，向以利沙呼求说：“你的仆人，就是我的丈夫，死了。你知道你的仆人是敬畏耶和华的。债主来了，要把我的两个孩子[a]带走，给他作奴隶。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“我的两个儿子”。原文用的是“孩子”，上下文也可更具体地理解为儿子。
    reason: 保留 יְלָדַי 的词义宽度，同时提示语境中可能的具体所指。
lexical_decisions:
- source_word: וְאִשָּׁה אַחַת
  choice: 有一个……妻子
  rationale: 用自然的现代汉语引入新人物；“一个”保留 אַחַת 的不定指功能，句首 וְ 在此承接叙事，不必机械译出。
- source_word: מִנְּשֵׁי בְנֵי הַנְּבִיאִים
  choice: 先知门徒的妻子
  rationale: בְנֵי הַנְּבִיאִים 是指先知群体中的成员，并非先知的亲生儿子；“先知门徒”在中文中清楚而简洁。“妻子”保留原文的身份表述，不提前改作“寡妇”。
- source_word: צָעֲקָה אֶל
  choice: 向……哀求
  rationale: צעק 表达困苦中的迫切呼求；结合下文的债务危机，“哀求”比单纯“呼喊”更自然地传达语用力度。
- source_word: עַבְדְּךָ אִישִׁי
  choice: 你的仆人，就是我的丈夫
  rationale: 保留“你的仆人”和“我的丈夫”两层关系，并用“就是”清楚表达同位关系。
- source_word: מֵת
  choice: 死了
  rationale: 简洁自然，既说明已经发生的死亡，也符合其后果仍在持续的语境。
- source_word: הָיָה יָרֵא אֶת יְהוָה
  choice: 一向敬畏耶和华
  rationale: “敬畏”保留 ירא 的圣经神学含义；“一向”传达 הָיָה 与分词式意义所表现的持续品格。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代简体中文圣经读者最熟悉的神名音译，明确呈现专名而不以“主”这一称号替代。
- source_word: הַנֹּשֶׁה
  choice: 债主
  rationale: 准确指有权追讨债务的人，也比“债权人”更符合叙事对白的自然语体。
- source_word: בָּא לָקַחַת
  choice: 如今……来，要把……带走
  rationale: 表达债主已经前来或威胁迫近、意在带走孩子的当前危机；“如今”是汉语中对当前情势的自然提示，不被误解为原文含有独立的时间副词。
- source_word: שְׁנֵי יְלָדַי
  choice: 我的两个孩子
  rationale: יְלָדַי 本身是较宽泛的“孩子”，不在正文中擅自收窄为“儿子”；可能的具体理解置于脚注。
- source_word: לוֹ לַעֲבָדִים
  choice: 给他作奴仆
  rationale: 保留 לוֹ 的归属或受益含义，以及 עֲבָדִים 所指的受奴役身份。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用四字神名，正文应以专名呈现。简体中文现代标准语境中“耶和华”辨识度最高；“雅威”更接近学术界常见的拟音，但尚未成为普通中文读者最自然的形式。
- issue: “敬畏”是否仅指害怕
  choice: 敬畏耶和华
  alternative: 尊崇耶和华
  rationale: 保留原文 ירא 的张力：它包括畏惧、尊崇和忠诚信靠等关联意义，不用较窄的“尊崇”消解这一传统神学用语。
- issue: 债主带走孩子的法律与伦理背景
  choice: 按原文直译为“带走，给他作奴仆”
  alternative: 解释性译为“抓去抵债”
  rationale: 原文陈述债主的行动与目的，却未在本节明确说明全部法律程序或作价值判断；正文不增添“抵债”等虽合语境但未明说的解释。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。妇人的话保持急迫、恳求的口吻，但避免古奥表达；“先知门徒”以普通读者可理解的方式表达先知群体成员，“奴仆”保留古代受役身份的严肃性。
