  text: Then she saddled the donkey and said to her servant[a], “Drive on and go; do not slow down for me unless I tell you.”
translation:
  language: zh_hans
  text: 于是她给母驴备好鞍，对仆人[a]说：“赶着走！除非我吩咐你，不要因为我骑在上面就放慢。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “仆人”原文也可指“年轻侍从”；这里指负责赶驴的男性随从。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּחֲבֹשׁ הָאָתוֹן
  choice: 她备好母驴
  rationale: חבש在骑乘牲畜的语境中指把牲畜装备妥当；译作“备好”自然，也避免武断指定古代鞍具的具体形式。אָתוֹן明确是母驴，中文直译自然，予以保留。
- source_word: נַעֲרָהּ
  choice: 她的仆人
  rationale: נַעַר在此指随侍并赶驴的年轻男性仆役；“仆人”准确表达其叙事角色，不必在正文额外强调年龄。
- source_word: נְהַג וָלֵךְ
  choice: 赶着往前走
  rationale: נהג指驱赶或引导牲畜，הלך与之连用加强持续前行之意；“赶着往前走”符合中文表达，也传达命令的急切。
- source_word: אַל תַּעֲצָר לִי לִרְכֹּב
  choice: 不要因我骑着就放慢
  rationale: עצר可指拦阻、停住或使速度减缓；结合לִי与לִרְכֹּב，意思是不要顾虑她在骑乘而减速或停下。此译保留“为我／因我”的关系，同时用自然中文表达。
- source_word: כִּי אִם אָמַרְתִּי לָךְ
  choice: 除非我吩咐你
  rationale: 禁止句后的כִּי אִם引出例外条件，即“除非”；אמרתי לך在命令情境中译作“我吩咐你”比单纯“我对你说”更贴切。
