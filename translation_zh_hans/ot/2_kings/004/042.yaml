  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/אִ֨ישׁ בָּ֜א מִ/בַּ֣עַל שָׁלִ֗שָׁה וַ/יָּבֵא֩ לְ/אִ֨ישׁ הָ/אֱלֹהִ֜ים לֶ֤חֶם בִּכּוּרִים֙ עֶשְׂרִֽים לֶ֣חֶם שְׂעֹרִ֔ים וְ/כַרְמֶ֖ל בְּ/צִקְלֹנ֑/וֹ וַ/יֹּ֕אמֶר תֵּ֥ן לָ/עָ֖ם וְ/יֹאכֵֽלוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/042.yaml
  text: And a man came from Baal-shalishah and brought to the man of God bread of the firstfruits[a], twenty loaves of barley, and fresh grain in his sack. And he said, “Give it to the people[b], so that they may eat.”
translation:
  language: zh_hans
  text: 有一个人从巴力沙利沙来，给神人带来初熟谷物做的饼，共二十个大麦饼，还有装在袋子[b]里的新谷[a]。他说：“拿给众人，让他们吃。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “新谷”也可译作“烘过的谷粒”。原词可指新鲜的谷物，也可能指已经加工、可供食用的谷粒。
    reason: lexical_alternative
  - marker: b
    text: 译作“袋子”的希伯来词十分罕见，确切含义不能确定；也可能指包裹物，或指谷物的外壳。
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ
  choice: 有一个人
  rationale: 该词在这里指一名男子；“有一个人”符合希伯来叙事的引介方式，也合乎现代汉语表达。
- source_word: מִבַּעַל שָׁלִשָׁה
  choice: 从巴力沙利沙来
  rationale: 这是地名，采用音译，不赋予其构词成分额外的解释。
- source_word: אִישׁ הָאֱלֹהִים
  choice: 神人
  rationale: 这是希伯来语对先知的固定称谓；“神人”保留原文用语及其文学呼应，不直接改译为“先知”。
- source_word: לֶחֶם בִּכּוּרִים
  choice: 初熟谷物做的饼
  rationale: 该结构指与初熟之物有关的饼；补出“谷物做的”使现代汉语意思清楚，同时不把它过度限定为某种特定礼仪用语。
- source_word: עֶשְׂרִים לֶחֶם שְׂעֹרִים
  choice: 共二十个大麦饼
  rationale: 计数语境中的 לֶחֶם 指一个个饼；“大麦饼”是简洁自然的对应。“共”表明后语是对前述初熟之饼的具体说明。
- source_word: כַרְמֶל
  choice: 新谷
  rationale: 此处指新收的或可供食用的谷物，并非迦密山。“新谷”符合初熟收成的语境，又不武断指定其加工方式；其他可能性列入脚注。
- source_word: בְּצִקְלֹנוֹ
  choice: 装在袋子里
  rationale: 该罕见名词含义不确定，可能指盛装或包裹谷物的容器。“袋子”在语境中清楚可解，但以脚注保留不确定性。
- source_word: תֵּן לָעָם וְיֹאכֵלוּ
  choice: 拿给众人，让他们吃
  rationale: 命令式加未完成式在此表达预期目的或结果；这一译法自然保留“给他们，使他们吃”的结构。
theological_decisions:
- issue: וַיֹּאמֶר 的说话者
  choice: 译作“他说”，保留代词所具有的指向空间
  alternative: 明确译作“神人说”或“以利沙说”
  rationale: 上下文通常把命令理解为以利沙所说，但本节希伯来文本只用第三人称单数动词，没有重复主语；正文不额外补明，以免消除原文形式上的含混。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“神人”保留圣经叙事中的传统称谓；全句避免古奥虚词。脚注标记紧跟各自所解释的“新谷”和“袋子”，以纠正咨询层脚注标记与词项位置不相符的问题。
