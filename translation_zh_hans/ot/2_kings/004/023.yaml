  yaml_path: translation/ot/2_kings/004/023.yaml
  text: And he said[a], “Why are you going to him today? It is neither new moon nor Sabbath.” And she said, “Peace.”
translation:
  language: zh_hans
  text: 他问：“你今天为什么要到他那里去？既不是新月日，也不是安息日。”她说：“平安[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“都好”或“一切都好”。希伯来文直译“平安”。
    reason: lexical_alternative
lexical_decisions:
- source_word: מַדּוּעַ
  choice: 为什么
  rationale: 这是询问原因的疑问词；“为什么”是自然、准确的现代汉语表达。
- source_word: אתי הלכתי
  choice: 你……要去
  rationale: 马所拉文本此处形式不规则，但语境清楚表明丈夫是在问一个阴性单数对象为何此时前去；“要去”自然表达眼前将进行的行动，同时不把时态说得过死。
- source_word: אֵלָיו
  choice: 到他那里去
  rationale: 代词在上下文中指以利沙；保留代词，不在正文中将所指明说出来。
- source_word: הַיּוֹם
  choice: 今天
  rationale: 符合现代汉语习惯，也准确表达当日这一时间意义。
- source_word: לֹא חֹדֶשׁ וְלֹא שַׁבָּת
  choice: 既不是初一，也不是安息日
  rationale: “既不……也不……”自然对应希伯来文的并列否定，并表明当天并非常规前去见先知的宗教节期。
- source_word: חֹדֶשׁ
  choice: 初一
  rationale: 此处不是泛指“月份”，而是指朔日的宗教历法场合；“初一”是普通中文读者易懂且合乎语境的表达。
- source_word: שַׁבָּת
  choice: 安息日
  rationale: 采用中文圣经传统中通行且清楚的以色列圣日名称。
- source_word: שָׁלוֹם
  choice: 平安
  rationale: 保留希伯来词的字面意象及简短回答的含蓄性；脚注说明这里也可按语用意义理解为“没事”或“一切都好”。
