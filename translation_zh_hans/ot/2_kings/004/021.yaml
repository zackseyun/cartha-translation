base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/021.yaml
  text: Then she went up and laid him on the bed of the man of God[a], shut the door behind him[b], and went out.
translation:
  language: zh_hans
  text: 她就上楼，把他放在神人的床上，关上门，让他留在里面[a]，然后出去了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在他身后关上门。”原文的意思是她关上门，把他留在房内。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּעַל
  choice: 她就上楼
  rationale: עלה表示“上去”。结合上文为神人预备的楼上小房间，译作“上楼”自然明确；“就”体现连续叙事中的推进。
- source_word: וַתַּשְׁכִּבֵהוּ
  choice: 把他放在
  rationale: 这是שׁכב的使役形式，意为使人躺下。现代汉语在此用“把他放在……床上”简洁自然，也不额外暗示孩子能主动躺下。
- source_word: מִטַּת אִישׁ הָאֱלֹהִים
  choice: 神人的床
  rationale: מִטָּה指床或卧榻；אִישׁ הָאֱלֹהִים直译为“神人”，是希伯来文对先知的固定称号，不具体化为“神的先知”。
- source_word: וַתִּסְגֹּר בַּעֲדוֹ
  choice: 关上门，让他留在里面
  rationale: סגר意为“关闭”；בַּעֲדוֹ在此表示关门后将他留在房内。如此翻译比汉语直译“在他身后关门”更符合孩子已经躺在床上的场景，同时保留脚注说明原文表达。
- source_word: וַתֵּצֵא
  choice: 然后出去了
  rationale: יצא意为“出去”。“然后”承接叙事动作，不增添离开何处等原文未明说的信息。
theological_decisions: []
translation_notes:
