  text: וַ/תֹּ֨אמֶר֙ אֶל אִישָׁ֔/הּ הִנֵּה נָ֣א יָדַ֔עְתִּי כִּ֛י אִ֥ישׁ אֱלֹהִ֖ים קָד֣וֹשׁ ה֑וּא עֹבֵ֥ר עָלֵ֖י/נוּ תָּמִֽיד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/009.yaml
  text: And she said to her husband[a], “Look now, I know that this is a holy man of God who regularly passes by us.”
translation:
  language: zh_hans
  text: 她对丈夫说：“你看，我知道这位常常[a]从我们这里经过的人，是一位圣洁的上帝之人。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “常常”或译“不断地”。这里可表示一再、惯常地经过。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: 她……说
  rationale: 该叙事形式推动情节发展；汉语无需逐字译出连接词，也能自然呈现事件的顺承。
- source_word: אֶל אִישָׁהּ
  choice: 对丈夫
  rationale: אִישׁ带第三人称阴性单数后缀，在家庭语境中指“她的丈夫”。
- source_word: הִנֵּה נָא
  choice: 你看
  rationale: 这是引起对方注意、同时略带缓和语气的表达；“你看”自然保留其会话功能。
- source_word: יָדַעְתִּי
  choice: 我知道
  rationale: 完成式在这里表达由反复观察而形成的确定认识；“我知道”简洁自然，且不额外说明认识过程。
- source_word: אִישׁ אֱלֹהִים
  choice: 上帝之人
  rationale: 该词组在《列王纪》等叙事中是先知或受上帝差遣者的称号。“上帝之人”保留称号结构与文学、神学分量，也避免将其仅释为品德敬虔的人。
- source_word: קָדוֹשׁ
  choice: 圣洁的
  rationale: 保留“分别为圣、属圣”的核心含义，并直接修饰“上帝之人”。
- source_word: עֹבֵר עָלֵינוּ
  choice: 从我们这里经过
  rationale: 在行旅语境中，该短语表示从说话者所在之处经过；此译法符合上下文，也比“从我们上面越过”自然。
- source_word: תָּמִיד
  choice: 经常
  rationale: 上下文描述以利沙惯常反复经过，而非不间断地持续经过；“经常”自然表达这种习惯性重复，同时以脚注保留较直接的另一译法。
theological_decisions:
- issue: אִישׁ אֱלֹהִים这一称号的译法
  choice: 上帝之人
  alternative: 属上帝的人；敬虔的人；神人
  rationale: “上帝之人”较完整地保留原文的称号形式，不将其弱化为一般敬虔品质，也不额外明说“先知”；同时避免现代汉语中“神人”可能产生的超人或神奇人物联想。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“你看”保留口语中的提示作用；“上帝之人”略带经文称号色彩，以保存原文的固定称谓及其神学张力。
