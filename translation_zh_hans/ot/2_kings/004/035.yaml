base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/035.yaml
  text: Then he returned and walked in the house[a], once here and once there; then he went up and stretched himself over him, and the boy sneezed seven times[b], and the boy opened his eyes.
translation:
  language: zh_hans
  text: 于是他回来，在屋里来回走动[a]；然后上去，俯身在孩子身上[b]。孩子打了七个喷嚏，便睁开了眼睛。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“一次这边，一次那边”，意思是“来来回回”。
    reason: lexical_alternative
  - marker: b
    text: 也可译为“俯伏在孩子身上”。这里的希伯来语动词可指俯身、弯身或伏在某人上方。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: 于是他回来
  rationale: שׁוּב在连续叙事中表示“回来、返回”；“于是”自然体现希伯来语叙事时态的推进。
- source_word: וַיֵּלֶךְ בַּבַּיִת
  choice: 在屋里……走动
  rationale: הלך与处所短语连用，表示在屋内行走；“走动”比“踱步”较少加入人物心态。
- source_word: אַחַת הֵנָּה וְאַחַת הֵנָּה
  choice: 来回
  rationale: 这是描述向这边一次、向那边一次的表达；正文采用自然的现代汉语“来回”，脚注保留其字面意象。
- source_word: וַיַּעַל
  choice: 然后又上去
  rationale: עלה保留向上的空间动作，可能指上到孩子所在的楼上房间或床铺处；不在正文中进一步限定。
- source_word: וַיִּגְהַר עָלָיו
  choice: 俯伏在孩子身上
  rationale: גהר表示俯身、伏在某人上方；此译描写以利沙的身体姿势，同时不解释神迹的作用机制。
- source_word: וַיְזוֹרֵר
  choice: 打了……喷嚏
  rationale: 这个罕见动词按传统及词典证据解作“打喷嚏”；次数说明动作重复发生。
- source_word: הַנַּעַר
  choice: 孩子
  rationale: נַעַר在此指书念妇人的儿子；现代汉语“孩子”符合上下文，也不武断限定其具体年龄。
- source_word: עַד שֶׁבַע פְּעָמִים
  choice: 七个
  rationale: עַד与次数结合，在这里表示动作累计达到七次；汉语按“喷嚏”的量词习惯译为“七个喷嚏”。
- source_word: וַיִּפְקַח הַנַּעַר אֶת עֵינָיו
  choice: 便睁开了眼睛
  rationale: פקח עיניים是“睁开眼睛”的常用搭配；“便”自然承接前后连续发生的事件，不额外说明因果机制。
theological_decisions:
- issue: 以利沙伏在孩子身上的动作如何理解
  choice: 仅以“俯伏在孩子身上”描述身体动作，不说明这动作本身具有某种神奇或礼仪效力。
  alternative: 可译为“俯身在他上面”或结合前文译为“再次伏在他身上”。
  rationale: 希伯来文记载以利沙的动作，却没有解释神迹发生的机制；译文应保留事件本身及其张力，不加入宗派性或推测性的解释。
translation_notes:
  register: 采用现代、庄重而通顺的叙事语言。“来回走动”避免较具心理暗示的“焦急踱步”；“孩子”比“童子”更符合现代普通读者的语言习惯。脚注标记均放在所解释的具体短语之后。
