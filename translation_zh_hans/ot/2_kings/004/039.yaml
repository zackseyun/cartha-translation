base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/039.yaml
  text: Then one man went out into the field to gather herbs[a], and he found a wild vine and gathered from it wild gourds, filling his garment. Then he came and sliced them into the pot of stew[c][b], though they did not know what they were.
translation:
  language: zh_hans
  text: 于是，有一个人到田野去采摘野菜[a]。他发现一棵野藤，便从上面采了野瓜[b]，把衣服兜装满。他回来，把野瓜切开放进炖菜锅里；因为他们不知道那是什么[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “野菜”也可译作“可食用的植物”或“青菜”；希伯来语泛指从田野采集的植物。
    reason: lexical_alternative
  - marker: b
    text: “野藤”和“野瓜”直译分别为“田野的藤”和“田野的瓜”，指野外生长的藤及其果实；具体植物可能是药西瓜一类的野生瓜，但不能完全确定。
    reason: lexical_alternative
  - marker: c
    text: “因为”也可译作“原来”；希伯来语连接词在这里可用来补充说明他们并不知道那是什么。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶחָד
  choice: 有一个人
  rationale: 该数词在这里独立使用，指群体中的一名男子；“有一个人”符合现代汉语叙事习惯，并保留单数人物指称。
- source_word: לְלַקֵּט אֹרֹת
  choice: 采摘野菜
  rationale: אֹרֹת 泛指从田野采集、可供食用的植物或青菜；“野菜”既自然，也符合觅食备餐的语境，同时避免限定为调味用的“香草”。
- source_word: גֶּפֶן שָׂדֶה
  choice: 一棵野藤
  rationale: 字面为“田野的藤”，表示野外生长、未经栽培的藤本植物。“野藤”清楚自然，并避免让“葡萄藤”误导读者以为其果实是葡萄。
- source_word: פַּקֻּעֹת שָׂדֶה
  choice: 野瓜
  rationale: 该词指野生藤蔓所结的瓜，可能是药西瓜一类植物，但具体品种并不完全确定；“野瓜”保留原文的一般性，避免在正文中过度精确。
- source_word: מְלֹא בִגְדוֹ
  choice: 装满了衣襟
  rationale: 希伯来语直陈所采之物装满他的衣服，衣服在此被兜起作容器。“装满了衣襟”保留这一具体形象，且为中文读者所能理解。
- source_word: וַיְפַלַּח
  choice: 把野瓜切开
  rationale: 该动词有剖开、切开的意思；补出承前省略的宾语“野瓜”，使现代汉语表达清楚，同时不把切法过度限定为切片或切碎。
- source_word: סִיר הַנָּזִיד
  choice: 炖菜锅
  rationale: נָזִיד 指煮制的浓稠食物或炖菜；“炖菜锅”简洁保留锅与其中炖食的关系，比“汤锅”更贴近词义。
- source_word: כִּי לֹא יָדָעוּ
  choice: 因为他们不知道那是什么
  rationale: כִּי 在这里可作解释原因的连接词；“因为”直接呈现这一读法。原文未明说所不知道的对象，中文补出“那是什么”，使隐含意义自然明确。
theological_decisions: []
translation_notes:
  register: 采用现代、清楚而庄重的叙事语体。“于是”承接上文；“衣襟”保留古代人兜起外衣盛物的画面，但全句结构保持现代汉语的可读性。正文不确定具体植物品种，也不把 כִּי 的说明关系解释成额外的神学含义。
