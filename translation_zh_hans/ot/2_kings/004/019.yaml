source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר אֶל אָבִ֖י/ו רֹאשִׁ֣/י רֹאשִׁ֑/י וַ/יֹּ֨אמֶר֙ אֶל הַ/נַּ֔עַר שָׂאֵ֖/הוּ אֶל אִמּֽ/וֹ־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/019.yaml
  text: And he said to his father[a], “My head, my head!” Then he said to the young man, “Carry him to his mother.”
translation:
  language: zh_hans
  text: 他对父亲说：“我的头，我的头！”父亲就对那少年人[a]说：“把他抱到他母亲那里去。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “少年人”或译“侍从”或“仆人”；希伯来语 נַעַר 可按语境指少年、青年、侍从或仆人。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֶל אָבִיו
  choice: 他对父亲说
  rationale: אמר是普通的“说”；虽然情势紧急，原文并未明确使用“喊叫”。“父亲”准确、自然地表达亲属关系。
- source_word: רֹאשִׁי רֹאשִׁי
  choice: 我的头，我的头！
  rationale: 保留原文名词及其重复，以简短有力的形式表现孩子突发的痛苦，不增添“疼”等原文未明说的内容。
- source_word: וַיֹּאמֶר
  choice: 父亲就……说
  rationale: 希伯来文只写“他就说”，但上下文表明此处主语是父亲；汉语明说“父亲”可避免代词指向含混，而不改变叙事内容。“就”自然表达连续发生的动作。
- source_word: אֶל הַנַּעַר
  choice: 对那少年人
  rationale: נַעַר可指男孩、青年、侍从或仆人。此人能抱走孩子，译作“少年人”既符合语境，也不在正文中过度确定其仆役身份。
- source_word: שָׂאֵהוּ
  choice: 把他抱到
  rationale: נשׂא在此指把孩子托起并带走；现代汉语用“抱到”比笼统的“带到”更清楚地体现身体承载。
- source_word: אֶל אִמּוֹ
  choice: 他母亲那里去
  rationale: 准确表达目的地和亲属关系，符合现代汉语叙事习惯。
theological_decisions: []
translation_notes:
  register: 采用简洁、庄重而自然的现代汉语叙事风格；保留“我的头，我的头”的重复和急迫感。脚注标在“少年人”之后，因为词义上的译法差异对应希伯来语 הַנַּעַר。
