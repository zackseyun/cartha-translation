base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/036.yaml
  text: Then he called Gehazi and said[a], “Call this Shunammite woman.” So he called her, and she came to him. Then he said, “Take up your son.”
translation:
  language: zh_hans
  text: 于是，他叫基哈西来，对他说：“把这位书念妇人[a]叫来。”基哈西就叫了她，她便来到他面前。他对她说：“抱起你的儿子吧。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“这位来自书念的妇人”。希伯来语使用阴性居民称谓，直指“这位书念人（女性）”。
    reason: 说明希伯来语阴性居民称谓的含义及另一种自然译法。
lexical_decisions:
- source_word: וַיִּקְרָא אֶל גֵּיחֲזִי
  choice: 于是，他叫基哈西来
  rationale: וַיִּקְרָא承接叙事中的下一步行动；“于是”自然体现连续关系。介词אֶל与קרא连用表示呼叫某人，“叫……来”符合现代汉语表达。人名גֵּיחֲזִי按通行形式音译为“基哈西”。
- source_word: קְרָא אֶל הַשֻּׁנַמִּית הַזֹּאת
  choice: 把这位书念妇人叫来
  rationale: 祈使式קְרָא直译为“叫”；“叫来”自然表达召唤之意。הַשֻּׁנַמִּית是阴性居民称谓，指来自书念的妇人；הַזֹּאת明确保留为“这位”。
- source_word: וַיִּקְרָאֶהָ
  choice: 基哈西就叫了她
  rationale: 保留原文再次使用קרא所叙述的执行动作，不将其省略。汉语明说“基哈西”，可清楚交代执行命令者。
- source_word: וַתָּבוֹא אֵלָיו
  choice: 她便来到他面前
  rationale: בוא加אֶל表示来到某人那里。“来到他面前”符合自然汉语，也保留原文代词所具有的指代方式，不在本节内额外加入姓名。
- source_word: שְׂאִי
  choice: 抱起……吧
  rationale: 这是נשׂא的阴性单数祈使式，语境中指母亲将复生的儿子抱起。“抱起”比生硬的“拿起”更符合人与孩子之间的动作；“吧”使汉语命令语气自然，同时不削弱指令性质。
- source_word: בְנֵךְ
  choice: 你的儿子
  rationale: בֵּן加第二人称阴性单数后缀，明确意为“你的儿子”，保留性别和亲属关系的具体含义。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“书念妇人”沿用清楚而简洁的圣经地名称谓；用“抱起”表达母亲抱起儿子的具体情景。原文两处“他”的指代未在正文中作超出本节措辞的解释，以免不必要地消除原文的代词表达。
