base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/007.yaml
  text: Then she came and told the man of God[a], and he said, “Go, sell the oil, and pay your debts[b]; and you and your sons can live on what is left.”
translation:
  language: zh_hans
  text: 她便来见神人，把这事告诉他。神人说：“去把油卖了，偿还你的债务[a]；你和你的儿子们可以靠剩下的过活[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“偿还你的债权人。”原文形式既可理解为所欠的债务，也可理解为被欠债的人。
    reason: lexical_alternative
  - marker: b
    text: 直译：“你和你的儿子们要靠余下的活着。”
    reason: literal_rendering
lexical_decisions:
- source_word: וַתָּבֹא וַתַּגֵּד
  choice: 她就来告诉
  rationale: 两个连续的叙事性 wayyiqtol 推进情节；“就来告诉”以自然的现代汉语表达先后关系。
- source_word: לְאִישׁ הָאֱלֹהִים
  choice: 神人
  rationale: 保留希伯来文对先知的固定称号，而不直接释作“先知”。“神人”也是简洁、庄重且为中文圣经读者熟悉的表达。
- source_word: לְכִי מִכְרִי אֶת־הַשֶּׁמֶן
  choice: 去把油卖了
  rationale: 保留两个阴性单数祈使词的行动次序；汉语不标示祈使词的性。“油”不擅自具体化为橄榄油。
- source_word: וְשַׁלְּמִי אֶת־נשיכי
  choice: 偿还你的债务
  rationale: שלם 在财务语境中指偿付；相关名词形式可从所欠债务或债权人角度理解，正文采用符合上下文且自然的“债务”，并以脚注保留另一可能。
- source_word: וְאַתְּ בניכי
  choice: 你和你的儿子们
  rationale: 原文明确为复数“儿子”，故不泛化为“孩子们”。
- source_word: תִּחְיִי בַּנּוֹתָר
  choice: 可以靠剩下的过活
  rationale: 未完成式在此表达余款足以维持生活的结果或能力；“靠……过活”自然呈现 בְּ 的凭借含义。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而通顺的叙事体。“神人”保留原文称号；命令句简洁直接。正文中的[a]、[b]分别对应债务/债权人的词义歧义，以及末句较直译的表达。
