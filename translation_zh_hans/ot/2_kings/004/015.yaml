  text: Then he said[a], “Call her.” So he called her, and she stood in the doorway.
translation:
  language: zh_hans
  text: 他就说：“叫她。”基哈西便叫了她，她就站在门口。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 他就说
  rationale: 未完成式连续体推进叙事，现代汉语用“就说”自然表达随后的动作。根据上文，说话者是以利沙；此处保留原文代词“他”。
- source_word: קְרָא לָהּ
  choice: 叫她来
  rationale: קרא在此是吩咐基哈西召唤那妇人；“叫她来”是自然、直接的现代汉语，也明确表达此处所需的召请含义。
- source_word: וַיִּקְרָא לָהּ
  choice: 基哈西便叫了她
  rationale: 原文主语承接前文语境，是受命的基哈西。汉语若连续使用“他”容易与以利沙混淆，因此显明主语；“便”体现他随即照办。
- source_word: וַתַּעֲמֹד
  choice: 她就站
  rationale: עמד表示“站立、站在某处”；原文没有明说“来”，故不在这一分句另加“走来”等动作。
- source_word: בַּפָּתַח
  choice: 在门口
  rationale: פתח可指门的开口、门口或入口处。“门口”在现代汉语中自然，并保留位置范围上的适度宽泛性。
theological_decisions: []
translation_notes:
  register: 采用自然、庄重而清楚的现代标准汉语。为避免两个男性人物之间的代词歧义，第二句按上下文将主语明确为“基哈西”；不增添原文未明说的移动动作。原文בפתח可理解为门的开口或入口处，中文“门口”可自然涵盖二者，因此无需脚注。
