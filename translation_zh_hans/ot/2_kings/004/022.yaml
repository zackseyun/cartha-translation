base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/022.yaml
  text: Then she called to her husband and said[a], “Please send me one of the young men and one of the female donkeys[b], so that I may run to the man of God and return.”
translation:
  language: zh_hans
  text: 于是，她叫丈夫来，对他说：“请给我派一个年轻人和一头母驴[b]，我好跑到[a]神人那里，再回来。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “跑到”也可译为“赶到”；原文动词直译为“跑”，表达行动的急迫。
    reason: lexical_alternative
  - marker: b
    text: 原文所用名词特指母驴；有些译本只译作“驴”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּקְרָא אֶל אִישָׁהּ
  choice: 于是，她叫来丈夫
  rationale: 叙事性连续形式推进情节，译作“于是”符合现代汉语叙事习惯；אִישׁ带第三人称阴性单数后缀，在家庭语境中指“她的丈夫”。
- source_word: שִׁלְחָה נָא לִי
  choice: 请给我派
  rationale: 祈使形式与נָא共同表达礼貌请求；“请给我派”既保留请求语气，也自然引出所需同行者。
- source_word: אֶחָד מִן הַנְּעָרִים
  choice: 一个年轻人
  rationale: נַעַר可指年轻男子、随从或仆人。正文采用较少限定的“年轻人”，保留其基本词义及身份上的开放性。
- source_word: וְאַחַת הָאֲתֹנוֹת
  choice: 再备一头母驴
  rationale: אָתוֹן特指母驴；结合出行语境，“备一头”比直译“给我一头”更符合现代汉语，同时保留数量和性别信息。
- source_word: וְאָרוּצָה
  choice: 我要赶到
  rationale: 第一人称祈愿式表达说话人的意图；“赶到”自然传达רוץ“跑”的急迫意味，又避免让现代读者误解为她要徒步奔跑。
- source_word: עַד אִישׁ הָאֱלֹהִים
  choice: 神人那里
  rationale: עַד在移动语境中标示目的地；“神人”保留אִישׁ הָאֱלֹהִים这一先知称号，而不直接改译为“先知”。
- source_word: וְאָשׁוּבָה
  choice: 然后回来
  rationale: 第一人称祈愿式继续表达她打算采取的行动；“然后回来”清楚呈现行动次序，符合现代汉语表达。
