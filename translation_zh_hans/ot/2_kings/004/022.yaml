revisions:
- from: 于是，她叫来丈夫，说：“请给我派一个年轻人，再备一头母驴[b]，我要赶到[a]神人那里，然后回来。”
  to: 于是，她叫丈夫来，对他说：“请给我派一个年轻人和一头母驴[b]，我好跑到[a]神人那里，再回来。”
  rationale: 修订使中文更精确地反映“向丈夫呼叫”和“请为我差遣一个年轻人及一头母驴”的句法关系，并在正文保留“跑”的词汇意义。脚注锚点仍分别紧邻所说明的词语，且保留原有的词汇说明。
