base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/032.yaml
  text: When Elisha came into the house[a], behold, the boy was dead, laid on his bed.
translation:
  language: zh_hans
  text: 以利沙进了屋子，只见那孩子已经死了，躺在他的床上。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“被安放在他的床上。”原文的被动分词可较字面地表示被放置后躺卧的状态。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: 进了
  rationale: 叙事性未完成式推进情节；结合带方向词尾的“屋子”，自然表达进入屋内的动作。
- source_word: אֱלִישָׁע
  choice: 以利沙
  rationale: 采用现代中文圣经中通行的人名音译。
- source_word: הַבָּיְתָה
  choice: 屋子
  rationale: בַּיִת 指具体房屋，方向词尾表示朝向或进入；其方向意义已由“进了”体现。
- source_word: וְהִנֵּה
  choice: 只见
  rationale: 既保留 הִנֵּה 引人注意、鲜明呈现眼前景象的叙事作用，也符合现代汉语叙事习惯。
- source_word: הַנַּעַר
  choice: 那孩子
  rationale: נַעַר 语义范围可包括男孩、少年或仆人；本段指书念妇人的儿子，译为“孩子”自然且切合上下文。
- source_word: מֵת
  choice: 已经死了
  rationale: 原文描述以利沙到达时孩子所处的死亡状态；“已经”体现该状态在他进屋时已然存在，而不着重描述死亡事件本身。
- source_word: מֻשְׁכָּב
  choice: 躺在
  rationale: 该词为 שׁכב 的被动分词，表示被安放后躺卧的状态；现代汉语“躺在”自然，并可同时涵盖结果状态，不必生硬译成“被放置”。
- source_word: עַל מִטָּתוֹ
  choice: 他的床上
  rationale: 直接表达介词短语；物主代词在上下文中指以利沙，因为妇人先前把孩子放在神人的床上（4:21）。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“只见”传达 וְהִנֵּה 的现场感；全句保持简洁叙事，不增添原文没有说明的因果或神学解释。
