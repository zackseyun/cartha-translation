  text: וַ/יֹּ֨אמֶר֙ מְשָׁ֣רְת֔/וֹ מָ֚ה אֶתֵּ֣ן זֶ֔ה לִ/פְנֵ֖י מֵ֣אָה אִ֑ישׁ וַ/יֹּ֗אמֶר תֵּ֤ן לָ/עָם֙ וְ/יֹאכֵ֔לוּ כִּ֣י כֹ֥ה אָמַ֛ר יְהוָ֖ה אָכֹ֥ל וְ/הוֹתֵֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/043.yaml
  text: 'But his servant said[a], “How am I to set this before a hundred men?” And he said, “Give it to the people, and let them eat[b], for thus says Yahweh: ‘They shall eat and have some left over.’”'
translation:
  language: zh_hans
  text: 他的仆人说[a]：“我怎能把这些摆在一百个人面前呢？”以利沙说：“把这些给众人，让他们吃吧[b]；因为雅威如此说：‘他们必吃，并且还会有剩余。’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我怎能把这些给一百个人吃呢？”原文的疑问结构紧缩，直译近于：“我怎样把这摆在一百个人面前呢？”意思是质疑这些食物怎能供应一百人。
    reason: 更正原脚注不准确的“直译”，并说明“摆在……面前”在语境中指摆设食物供人食用。
  - marker: b
    text: 原文为“给众人，让他们吃”。末句直译为“吃，并且有剩余”，指众人吃过之后仍有食物留下。
    reason: 说明命令句中两个动词的对应关系，并保留末句简练的希伯来语表达及其语境含义。
lexical_decisions:
- source_word: מְשָׁרְתוֹ
  choice: 他的仆人
  rationale: 该词指在个人或职务上服侍他的人；此处是以利沙身边的从属者，译作“仆人”自然且符合叙事语境。
- source_word: מָה אֶתֵּן זֶה לִפְנֵי מֵאָה אִישׁ
  choice: 我怎能把这些摆在一百个人面前呢
  rationale: 保留“摆在……面前”的具体意象，并用“怎能”表达仆人面对食物不足时的疑问和难以置信；“这些”自然指上文的食物。
- source_word: מֵאָה אִישׁ
  choice: 一百个人
  rationale: אִישׁ在数词后为单数形式而具分配意义。现代汉语以“一百个人”表达自然，不必额外标示语法性别。
- source_word: תֵּן לָעָם וְיֹאכֵלוּ
  choice: 给众人吃吧
  rationale: 将命令和后续目的自然合译；עָם是集合名词，译作“众人”既贴合场景，又避免重复使用“人们”。
- source_word: כִּי כֹה אָמַר יְהוָה
  choice: 因为雅威如此说
  rationale: 保留先知宣告的固定公式及其庄重语气，并将神名直接译为“雅威”。
- source_word: אָכֹל וְהוֹתֵר
  choice: 他们必吃，并且还会有剩余
  rationale: 两个不定式结构简洁而有确定的预告意味；补出汉语所需的主语，并以“必”传达应许的确定性。“有剩余”说明吃过以后食物仍会留下。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华／上主
  rationale: 原文直接使用四字神名。音译为“雅威”保留其作为专名的性质，不以称号替代。
- issue: 预言末句的确定性
  choice: 他们必吃，并且还会有剩余
  alternative: 他们可以吃，还能剩下一些
  rationale: “必”体现先知话语所宣告结果的确定性；同时不把本句扩展为对神迹机制的解释。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“摆在……面前”保留原文具体形象；“给众人吃吧”则避免生硬直译。引语层次清楚，先知宣告以“如此说”和“必”维持郑重、确定的语气。
