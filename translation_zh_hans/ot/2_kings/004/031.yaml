  text: וְ/גֵחֲזִ֞י עָבַ֣ר לִ/פְנֵי/הֶ֗ם וַ/יָּ֤שֶׂם אֶת הַ/מִּשְׁעֶ֨נֶת֙ עַל פְּנֵ֣י הַ/נַּ֔עַר וְ/אֵ֥ין ק֖וֹל וְ/אֵ֣ין קָ֑שֶׁב וַ/יָּ֤שָׁב לִ/קְרָאת/וֹ֙ וַ/יַּגֶּד ל֣/וֹ לֵ/אמֹ֔ר לֹ֥א הֵקִ֖יץ הַ/נָּֽעַר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/031.yaml
  text: And Gehazi went on ahead of them and laid the staff on the boy’s face[a], but there was no sound and no response. So he returned to meet him and told him, saying, “The boy has not awakened.”
translation:
  language: zh_hans
  text: 基哈西走在他们前面，把杖放在孩子脸上；可是孩子没有声音，也没有回应[a]。于是他回去迎见以利沙，告诉他说：“孩子还没有醒过来。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“没有声音，也没有留心（或听见）。”
    reason: 说明 קָשֶׁב 的字面范围可指留心或听见；正文“回应”是合乎语境的表达，但原词仍有一定语义开放性。
lexical_decisions:
- source_word: עָבַר לִפְנֵיהֶם
  choice: 走在他们前面
  rationale: 准确表达基哈西先行、走在以利沙和妇人前面的意思，现代汉语自然清楚。
- source_word: הַמִּשְׁעֶנֶת
  choice: 杖
  rationale: 本段指以利沙交给基哈西的杖；“杖”简洁庄重，也不额外限定其用途。
- source_word: עַל־פְּנֵי הַנַּעַר
  choice: 放在孩子脸上
  rationale: 按字面保留“脸上”的具体动作；נַעַר 在本叙事中指妇人的孩子。
- source_word: וְאֵין קוֹל וְאֵין קָשֶׁב
  choice: 没有声音，也没有回应
  rationale: קוֹל 是“声音”，קָשֶׁב 可指留心、听见或有反应；正文用“回应”自然呈现语境意义，脚注保留原文措辞的开放性。
- source_word: וַיָּשָׁב לִקְרָאתוֹ
  choice: 他回去迎见以利沙
  rationale: 表达基哈西折返去迎接以利沙的动作；补出以利沙的名字，避免现代汉语代词指向含混。
- source_word: וַיַּגֶּד לוֹ לֵאמֹר
  choice: 告诉他说
  rationale: 保留希伯来语引出直接引语的报告格式，同时符合庄重的现代汉语叙事。
- source_word: לֹא הֵקִיץ הַנָּעַר
  choice: 孩子还没有醒过来
  rationale: הֵקִיץ 表示醒来；“还没有”体现尝试之后仍未达到苏醒结果的状态，又不把措辞解释成更宽泛的“没有复活”。
theological_decisions:
- issue: “醒过来”是否应解释为“复活”
  choice: 保留“醒过来”
  alternative: 译作“活过来”或“复活”
  rationale: 原文使用通常表示醒来的 הֵקִיץ。叙事情境涉及死亡，但翻译不应把原文的睡醒隐喻直接改写成明确的神学解释。
translation_notes:
  register: 采用自然、庄重、易懂的现代标准普通话。用“杖”而不用较口语化的“手杖”，用“孩子”贴合上下文；脚注标记置于它实际说明的“没有声音，也没有回应”之后。
