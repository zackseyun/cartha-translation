  text: וַ/יֹּ֗אמֶר לְכִ֨י שַׁאֲלִי לָ֤/ךְ כֵּלִים֙ מִן הַ/ח֔וּץ מֵ/אֵ֖ת כָּל שכנ/כי כֵּלִ֥ים רֵקִ֖ים אַל תַּמְעִֽיטִי־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/003.yaml
  text: Then he said[a], “Go, borrow vessels for yourself from outside, from all your neighbors—empty vessels[b]. Do not gather only a few.”
translation:
  language: zh_hans
  text: 他就说：“你去，到外面向所有的邻舍借空器皿来；不要少借。[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “不要少借”直译为“不要使之少”或“不要减少”，意思是不要只借少量器皿。
    reason: lexical_alternative
lexical_decisions:
- source_word: לְכִי
  choice: 你去
  rationale: 阴性单数命令式，指示这妇人前去行动；“你去”符合现代汉语叙事语气。
- source_word: שַׁאֲלִי לָךְ
  choice: 借……来
  rationale: שׁאל本可泛指“索取、请求”，但在向邻舍暂时取得盛油器具的语境中，“借”最自然；לָךְ所含的受益意味在汉语“借……来”的结构中已自然体现。
- source_word: כֵּלִים
  choice: 器皿
  rationale: 该词泛指器具或容器；这里用于盛油。“器皿”既保留词义宽度，也符合庄重而易懂的圣经叙事语体，不限定为陶罐。
- source_word: מִן הַחוּץ מֵאֵת כָּל שכנכי
  choice: 向外面所有的邻舍
  rationale: 保留“外面”与“所有邻舍”两个成分；“向……借”使整句成为自然汉语，同时表明器皿不是取自她家中。
- source_word: כֵּלִים רֵקִים
  choice: 空器皿
  rationale: 保留原文对“器皿”的重复和“空”的明确要求，为随后盛油的情节作准备。
- source_word: אַל תַּמְעִיטִי
  choice: 要多借，不要少借
  rationale: 字面意思是“不要使之少／不要减少”。结合语境，指借来的空器皿不可太少；汉语以正反并举的表达清楚传达其强调语气。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重且口语可懂的叙事表达。“邻舍”比“邻居”略具经文语体色彩，但现代读者仍易理解；保留“器皿”以避免把原文宽泛的כֵּלִים过度具体化。脚注标记置于其所解释的末句之后。
