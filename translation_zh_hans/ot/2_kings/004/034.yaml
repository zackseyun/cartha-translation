base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/034.yaml
  text: Then he went up and lay on the boy[a], and put his mouth on his mouth, his eyes on his eyes, and his palms on his palms; and he stretched himself over him, and the boy’s flesh became warm.
translation:
  language: zh_hans
  text: 他就上去，躺在孩子身上，把自己的口贴在孩子的口上，眼睛对着孩子的眼睛，手掌贴着孩子的手掌；他又俯身覆在孩子身上[a]，孩子的身体就暖和起来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他俯身在孩子身上。”这个希伯来动词较少见，可能指俯身、弯身，或伸展身体覆在孩子身上。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: 他就上去
  rationale: 保留עלה“上去”的基本方向意义；上到楼上的房间可由上下文得知，不在本节明说。
- source_word: וַיִּשְׁכַּב עַל הַיֶּלֶד
  choice: 伏在孩子身上
  rationale: שׁכב表示躺卧；结合介词עַל及随后身体各部位相贴的描写，“伏在……身上”比生硬的“躺在……上面”更自然，也保持具体动作。
- source_word: וַיָּשֶׂם פִּיו עַל פִּיו
  choice: 把自己的口贴着孩子的口
  rationale: שׂים是“放、置”；汉语需明确两个第三人称所指，并以“贴着”自然表达身体接触。
- source_word: וְעֵינָיו עַל עֵינָיו
  choice: 眼睛对着孩子的眼睛
  rationale: 这是承接前一动词的省略结构；“对着”保留对应关系，并避免汉语中“他的眼睛对他的眼睛”的指代含混。
- source_word: וְכַפָּיו עַל כַּפָּיו
  choice: 手掌贴着孩子的手掌
  rationale: כַּף具体指手掌；译作“手掌”保留原文身体部位的精确和平行结构。
- source_word: וַיִּגְהַר עָלָיו
  choice: 他俯伏在孩子身上
  rationale: 罕见动词גהר表示俯身、弯身或伸展身体在其上；“俯伏”自然呈现姿态，同时由脚注保留词义范围。
- source_word: וַיָּחָם בְּשַׂר הַיָּלֶד
  choice: 孩子的身体就渐渐暖和了
  rationale: חם在此表示变暖；בָּשָׂר直译“肉”，但现代汉语叙事中“身体”更自然，且不损失此处所指的身体状态。
- source_word: הַיֶּלֶד / הַיָּלֶד
  choice: 孩子
  rationale: יֶלֶד可指孩子或男孩；上下文已知是儿子，本节用“孩子”符合自然汉语，也保持叙事称谓。
theological_decisions:
- issue: 以利沙对死去孩子所行之事的性质
  choice: 具体直述身体动作，不说明其医学机制或赋予礼仪含义。
  alternative: 解释为人工呼吸，或用较含蓄的语言淡化身体接触。
  rationale: 希伯来文本记述先知与孩子身体相贴以及孩子身体变暖，却未解释作用机制；译文因此保留动作顺序及叙事张力，避免时代错置或教派性阐释。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。为避免连续第三人称代词造成歧义，适度重复“孩子”；身体部位用“口、眼睛、手掌”，保持原文具体而对称的描写。
