  text: וַ/תֹּ֕אמֶר הֲ/שָׁאַ֥לְתִּי בֵ֖ן מֵ/אֵ֣ת אֲדֹנִ֑/י הֲ/לֹ֣א אָמַ֔רְתִּי לֹ֥א תַשְׁלֶ֖ה אֹתִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/028.yaml
  text: She said[a], “Did I ask my lord for a son? Did I not say, ‘Do not deceive me’?”
translation:
  language: zh_hans
  text: 她说：“我何曾向我主求过一个儿子呢？我不是说过，‘不要欺骗我[a]’吗？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“不要让我空欢喜。”原文动词可指使人受骗；在这里，也可能特指使人产生终将落空的希望。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: 她说
  rationale: 叙事中的连续式引出妇人的话；现代汉语无需另译连接词，也不损失语义。
- source_word: הֲשָׁאַלְתִּי בֵן
  choice: 我何曾……求过一个儿子呢
  rationale: 疑问词构成带有责问意味的反问；“何曾……呢”自然保留反问语气。בֵן明确指“儿子”，不泛化为“孩子”。
- source_word: מֵאֵת אֲדֹנִי
  choice: 向我主
  rationale: 介词短语标明求取的对象；“我主”是妇人对以利沙的尊称，并非对上帝的称号。
- source_word: הֲלֹא אָמַרְתִּי
  choice: 我不是说过……吗
  rationale: 保留原文第二个反问，并用“说过”回指她先前所说的话。
- source_word: לֹא תַשְׁלֶה אֹתִי
  choice: 不要欺骗我
  rationale: שלה的使役形式在此表示使人受骗或产生终将落空的期待；“欺骗我”贴近词义，同时保留原文未明说“希望”的含蓄。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而口语自然的叙事表达。两个反问均予保留，以呈现妇人在丧子之痛中的责问和先前的顾虑；不把原文含蓄的“欺骗”直接释写成唯一确定的“给我虚假的希望”。
