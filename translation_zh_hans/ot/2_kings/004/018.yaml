  text: And the boy grew[a], and one day he went out to his father[b], to the reapers.
translation:
  language: zh_hans
  text: 那男孩[a]长大了。有一天[b]，他出去，到父亲和收割的人那里去。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“那孩子”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来语为叙事惯用语，直译可作“事情发生在那一天”；意思是“有一天”或“到了那一天”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגְדַּל
  choice: 渐渐长大了
  rationale: גדל在这里描述孩子成长；“渐渐长大了”符合现代汉语叙事习惯，又不把成长程度说得过满。
- source_word: הַיָּלֶד
  choice: 那男孩
  rationale: יֶלֶד既可泛指“孩子”，也可指“男孩”；上下文明确为男性，译作“男孩”自然，并以脚注保留较宽泛的译法。
- source_word: וַיְהִי הַיּוֹם
  choice: 有一天
  rationale: 这是希伯来语叙事中引出某个特定日子的惯用表达；“有一天”简洁自然。
- source_word: וַיֵּצֵא
  choice: 他出去
  rationale: 保留יצא所含“出去”的方向意味，暗示他从住处出去到田间。
- source_word: אֶל אָבִיו
  choice: 找父亲
  rationale: אֶל表示朝向父亲而去；汉语用“出去找父亲”比生硬的“出去到父亲那里”更自然，且不改变行动目标。
- source_word: אֶל הַקֹּצְרִים
  choice: 到收割的人那里去了
  rationale: קֹצְרִים指正在割取庄稼的人。“收割的人”清楚易懂；保留第二个表示趋向的短语，也反映父亲当时在收割者那里这一语境。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而通顺的叙事体。“渐渐长大了”承接前文并自然推进时间；后半句适度保留原文两个אֶל短语形成的重复趋向结构。
