base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/006.yaml
  text: And when the containers were full[a], she said to her son, “Bring me another container.” But he said to her[b], “There is not another container.” Then the oil stopped.
translation:
  language: zh_hans
  text: 当所有器皿都装满时[a]，她对儿子说：“再给我拿一个器皿来。”儿子对她说：“没有别的器皿了。”油就停住了[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“器皿都装满了以后。”
    reason: translation_alternative
  - marker: b
    text: “停住”原文直译为“站住”，意思是油不再流出了。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּמְלֹאת
  choice: 装满的时候
  rationale: כְּ加不定式构成时间从句；译为“装满的时候”既贴近原文，也符合现代汉语表达。
- source_word: הַכֵּלִים / כֶּלִי
  choice: 器皿
  rationale: כְּלִי在此泛指盛油用的容器，原文没有限定材质或形状；“器皿”比“罐子”更能保留其宽泛含义。
- source_word: הַגִּישָׁה
  choice: 给我拿……来
  rationale: 该使役命令式本义为“拿近、递上”；结合儿子把器皿递给母亲的场景，“给我拿……来”自然清楚。
- source_word: עוֹד
  choice: 再……一个 / 别的
  rationale: 与单数כֶּלִי连用时表示另一个同类物件；母亲的话译作“再……一个”，儿子的回答译作“别的”，符合汉语对话习惯。
- source_word: אֵין עוֹד כֶּלִי
  choice: 没有别的器皿了
  rationale: אֵין表示不存在，עוֹד在此指没有额外的器皿；句末“了”自然表达可用器皿已经没有，但不增加具体原因。
- source_word: וַיַּעֲמֹד הַשָּׁמֶן
  choice: 油就停住了
  rationale: עמד字面为“站立、停住”，此处指油停止继续流出；正文保留原文形象，脚注说明其语境含义。
