base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/041.yaml
  text: Then he said[a], “Bring some flour.” And he threw it into the pot and said, “Pour it out for the people[b], so that they may eat.” And there was nothing harmful in the pot.
translation:
  language: zh_hans
  text: 他就说：“拿些面粉来。”他把面粉投进锅里，又说：“倒出来给众人，让他们吃吧[a]。”锅里就没有任何有害之物了[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “倒出来”也可译作“盛出来”；原文动词通常指倾倒液体，此处是把锅里的食物分给众人。
    reason: lexical_alternative
  - marker: b
    text: 直译：“锅里没有坏的／恶的东西。”这里指锅里的食物不再有害。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 他就说
  rationale: 承接前文并推进叙事；“就”自然表达连续动作，不额外强化时间含义。
- source_word: וּקְחוּ קֶמַח
  choice: 拿些面粉来
  rationale: 复数命令式在汉语中无须明示复数；“拿……来”符合现场吩咐人取来物品的语境。“些”自然表达原文未限定的数量。
- source_word: וַיַּשְׁלֵךְ אֶל־הַסִּיר
  choice: 把面粉投进锅里
  rationale: 保留 שלך“投、扔”的动作力度；补出“面粉”以避免汉语代词指向含混。
- source_word: צַק לָעָם וְיֹאכֵלוּ
  choice: 倒出来给众人吃吧
  rationale: יצק 的基本动作是“倒出、倾倒”，此处指从锅中分盛食物；“给众人吃吧”自然表达后接未完成式在命令语境中的意愿或目的。
- source_word: וְלֹא הָיָה דָבָר רָע בַּסִּיר
  choice: 锅里就没有什么有害的东西了
  rationale: דָבָר רָע 字面为“坏的／恶的东西”，在有毒汤食的近接语境中指会造成伤害之物；“有害的东西”保留实体性表达，同时避免误读为道德上的邪恶。
theological_decisions:
- issue: 面粉与锅中有害之物消失之间的关系
  choice: 仅按叙事次序陈述，不解释面粉本身是否具有自然功效，也不明说神迹机制
  alternative: 明确译成“面粉使毒性消失”或“神借面粉行了神迹”
  rationale: 希伯来文本只叙述投放面粉、吩咐分食及锅中不再有害，并未在本节解释因果机制；译文保留这种叙事张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“投进”保留原文动作感，“倒出来给众人吃”兼顾原文具体用词和现代汉语可读性；两个脚注标记均置于所解释的短语之后。
