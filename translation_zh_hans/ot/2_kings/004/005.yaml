  text: So she went from him and shut the door behind herself and behind her sons; they were bringing the vessels to her[a], and she was pouring.
translation:
  language: zh_hans
  text: 于是，她离开以利沙，把门关在自己和儿子们身后。他们把器皿递给她[a]，她就倒油。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来原文只说“他们递给她”，没有明说所递的是什么；这里依照上文所说的空器皿补出“器皿”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּלֶךְ מֵאִתּוֹ
  choice: 于是，她离开以利沙
  rationale: 叙事性连续式推进情节；מֵאִתּוֹ表示从他那里离开。按上下文明确所指为以利沙，使现代汉语自然清楚。
- source_word: וַתִּסְגֹּר הַדֶּלֶת בַּעֲדָהּ וּבְעַד בָּנֶיהָ
  choice: 把门关上，自己和儿子们都在里面
  rationale: בְּעַד与“关门”连用，表示关门后将自己和儿子们留在门内。此译法保留两者均在屋内的含义，同时避免生硬直译为“在自己和儿子们后面”。
- source_word: הֵם מַגִּשִׁים אֵלֶיהָ
  choice: 他们不断把器皿递给她
  rationale: 分词表达持续、反复进行的动作；原文未明说宾语，但上文的空器皿是明确所指，因此正文补出“器皿”，并以脚注说明。מַגִּישׁ强调使物靠近，在场景中译作“递给”自然。
- source_word: וְהִיא מיצקת
  choice: 她就不断地倒油
  rationale: 分词与前一分词构成同时持续、反复的动作。“油”由上下文明确补出；“不断地”呈现过程性与反复性。
