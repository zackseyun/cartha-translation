translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。保留“他对他说”的代词形式，不把上下文中的人物姓名补入本节；正文直译妇人的回答，其可能隐含的社会与文化意义放入脚注，避免把推断写成明说。
