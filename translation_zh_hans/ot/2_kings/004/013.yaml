base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/013.yaml
  text: And he said to him[a], “Please say to her, ‘Look, you have taken all this trouble for us. What is to be done for you? Is there anything to be spoken for you to the king or to the commander of the army?’” And she said[c][b], “I am living among my own people.”
translation:
  language: zh_hans
  text: 他对他说：“请你对她说：‘你看，你为我们这样费心劳碌[a]，可以为你做些什么呢？是否需要替你向王或军队统帅说句话[b]？’”她回答：“我住在自己的同胞中间[c]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “费心劳碌”按原文直译近于“为我们极其战兢（或焦虑）”；这是强调她为他们十分挂心、殷勤操劳的说法。
    reason: lexical_alternative
  - marker: b
    text: 也可译作：“是否有什么事需要替你向王或军队统帅陈说？”
    reason: lexical_alternative
  - marker: c
    text: 这句话可能表示她安居在自己的群体中，不需要向王或军队统帅求助。
    reason: cultural_note
lexical_decisions:
- source_word: חָרַדְתְּ / חֲרָדָה
  choice: 你为我们这样费心劳碌
  rationale: 原文以同根动词和名词构成强调表达，字面涉及“战兢、焦虑、挂心”。结合款待的语境，指她为他们殷勤操劳、十分费心；此译保留关切与辛劳两方面的含义。
- source_word: הִנֵּה
  choice: 你看
  rationale: 这是引起对方注意的提示语；“你看”符合现代汉语表达，也保留了原文的语用功能。
- source_word: מֶה לַעֲשׂוֹת לָךְ
  choice: 可以为你做些什么呢
  rationale: 原文使用不定式结构，行动者没有明说。此译自然地表达可为她采取什么行动，同时避免把行动者过度限定为以利沙个人。
- source_word: הֲיֵשׁ לְדַבֶּר לָךְ
  choice: 是否需要替你……说句话
  rationale: 原文指为她说话，即代表她陈情或求情；“替你说句话”在现代汉语中自然，并由后面的王和军队统帅明确其对象。
- source_word: שַׂר הַצָּבָא
  choice: 军队统帅
  rationale: שַׂר 表示首领或长官；此处指军队的最高指挥官。“军队统帅”简洁、庄重且明确。
- source_word: בְּתוֹךְ עַמִּי אָנֹכִי יֹשָׁבֶת
  choice: 我住在自己的族人中间
  rationale: 直译原文的居住状态与群体归属。“自己的族人”体现 עַמִּי 的所属意味，同时不把言外之意直接写入正文。
- source_word: נָא
  choice: 请
  rationale: 该语气词在此缓和命令语气；“请”是自然的现代汉语对应表达。
