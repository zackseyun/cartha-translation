  text: וַ/תֵּ֗לֶךְ וַ/תָּב֛וֹא אֶל אִ֥ישׁ הָ/אֱלֹהִ֖ים אֶל הַ֣ר הַ/כַּרְמֶ֑ל וַ֠/יְהִי כִּ/רְא֨וֹת אִישׁ הָ/אֱלֹהִ֤ים אֹתָ/הּ֙ מִ/נֶּ֔גֶד וַ/יֹּ֨אמֶר֙ אֶל גֵּיחֲזִ֣י נַעֲר֔/וֹ הִנֵּ֖ה הַ/שּׁוּנַמִּ֥ית הַלָּֽז־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/025.yaml
  text: So she went and came to the man of God at Mount Carmel. And when the man of God saw her from a distance[a], he said to Gehazi his servant, “Look, that Shunammite woman.”
translation:
  language: zh_hans
  text: 于是她动身，来到迦密山的神人那里。神人远远[a]看见她，就对仆人基哈西说：“看，那是书念妇人。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“从远处”。希伯来语表达的意思是，他在她尚有一段距离时就看见了她。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּלֶךְ וַתָּבוֹא
  choice: 于是她动身，来到
  rationale: 两个连续叙事动词推进情节；用“于是……动身，来到”既保留先行后至的动作，也符合现代汉语叙事习惯。
- source_word: אִישׁ הָאֱלֹהִים
  choice: 神人
  rationale: 这是希伯来语的固定称谓；“神人”是简洁而传统的中文对应，不将其解释性改写为“先知”。
- source_word: אֶל הַר הַכַּרְמֶל
  choice: 迦密山的……那里
  rationale: 此处说明神人所在之地；合并为“来到迦密山的神人那里”，避免汉语中重复使用趋向介词。
- source_word: וַיְהִי כִּרְאוֹת
  choice: ……看见……就
  rationale: 该结构引出时间情境；汉语“看见……就……”自然体现主句与时间从句的关系，无须直译“事情发生了”。
- source_word: מִנֶּגֶד
  choice: 远远
  rationale: 语境表明神人在妇人仍有一段距离时便看见她；“远远看见”简洁自然，同时保留空间距离感。
- source_word: נַעֲרוֹ
  choice: 仆人
  rationale: 该词字面可指“年轻人”，在此表示基哈西作为以利沙随从或侍从的身份；“仆人”符合上下文。
- source_word: הִנֵּה
  choice: 看
  rationale: 这是引人注意的指示词；“看”保留说话的即时性，也符合现代口语而不显古奥。
- source_word: הַשּׁוּנַמִּית הַלָּז
  choice: 那是书念妇人
  rationale: 保留“书念妇人”这一地域身份称谓，并以“那是”传达指向有一定距离之人的指示意味。
theological_decisions: []
