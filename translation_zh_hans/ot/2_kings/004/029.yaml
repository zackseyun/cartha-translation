  text: וַ/יֹּ֨אמֶר לְ/גֵיחֲזִ֜י חֲגֹ֣ר מָתְנֶ֗י/ךָ וְ/קַ֨ח מִשְׁעַנְתִּ֣/י בְ/יָדְ/ךָ֮ וָ/לֵךְ֒ כִּֽי תִמְצָ֥א אִישׁ֙ לֹ֣א תְבָרְכֶ֔/נּוּ וְ/כִֽי יְבָרֶכְ/ךָ֥ אִ֖ישׁ לֹ֣א תַעֲנֶ/נּ֑וּ וְ/שַׂמְתָּ֥ מִשְׁעַנְתִּ֖/י עַל פְּנֵ֥י הַ/נָּֽעַר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/029.yaml
  text: Then he said to Gehazi, “Tuck up your garment, take my staff in your hand, and go. If you meet anyone, do not greet him; and if anyone greets you, do not answer him. Then place my staff on the boy’s face.”
translation:
  language: zh_hans
  text: 他对基哈西说：“束好腰间的衣服[a]，手里拿着我的杖，动身吧。若遇见任何人[c]，不要向他问安[b]；若有人向你问安，也不要回应他。要把我的杖放在那孩子的脸上。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译“束起你的腰”，是指束好衣服，准备迅速行动。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“不要祝福他／若有人祝福你”；这里很可能是指在路上彼此问候。
    reason: lexical_alternative
  - marker: c
    text: “任何人”所译的希伯来词字面为“人”或“男人”，在这里是泛指。
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲגֹר מָתְנֶיךָ
  choice: 束好腰间的衣服
  rationale: 原文直译为“束起你的腰”，指把长衣束好，以便迅速行动。此译保留具体动作及紧迫感，又避免现代汉语读者误解为单纯系腰带。
- source_word: מִשְׁעַנְתִּי
  choice: 我的杖
  rationale: 该词指用来支撑身体的杖；“杖”简洁自然，也符合本段中先知所持之物的叙事语境。
- source_word: וָלֵךְ
  choice: 动身吧
  rationale: 这是行动命令；“动身吧”在现代汉语中自然地传达立即上路的意思和语气。
- source_word: כִּי תִמְצָא אִישׁ
  choice: 若遇见任何人
  rationale: אִישׁ 字面为“男人/人”，此处在路遇的条件句中具有泛指作用，译作“任何人”最符合现代汉语。
- source_word: לֹא תְבָרְכֶנּוּ / וְכִי יְבָרֶכְךָ אִישׁ
  choice: 不要向他问安 / 若有人向你问安
  rationale: ברך 基本义与祝福有关，但在路上相遇的社交语境中可指问候、致意；“问安”既自然，也保留较庄重的叙事语体。
- source_word: לֹא תַעֲנֶנּוּ
  choice: 不要回应他
  rationale: ענה 在此指回答或回应。“回应”清楚表明即便对方先问安，也不可停下来答礼。
- source_word: וְשַׂמְתָּ מִשְׁעַנְתִּי עַל פְּנֵי הַנָּעַר
  choice: 要把我的杖放在那孩子的脸上
  rationale: 按原文保留“杖”“放在”和“脸上”等具体表达；句首“要”自然承接一连串命令，不额外加入时间推进词。
- source_word: הַנָּעַר
  choice: 那孩子
  rationale: נַעַר 可指男孩、少年或年轻人；本段所指是书念妇人的儿子，因此“那孩子”清楚自然，并避免不必要地突出年龄范围。
