base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/002.yaml
  text: And Elisha said to her[a], “What shall I do for you? Tell me, what do you have in the house?” And she said, “Your female servant has nothing at all in the house except a flask of oil.”
translation:
  language: zh_hans
  text: 以利沙对她说：“我该为你做什么呢？告诉我，你家里有什么？”她说：“婢女家里什么都没有，只有一小瓶油[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “一小瓶油”也可译作“一罐油”；希伯来语所指容器的确切形制不明，可能是盛油的小容器。
    reason: lexical_alternative
lexical_decisions:
- source_word: מָה אֶעֱשֶׂה לָּךְ
  choice: 我能为你做什么呢？
  rationale: 该表达询问以利沙可以采取什么行动帮助她；译文保留未完成式所含的商议意味，同时符合现代汉语习惯。
- source_word: הַגִּידִי לִי
  choice: 告诉我
  rationale: 直接对应命令式；原文没有明示“请”，故不添加。
- source_word: מַה יֶּשׁ לָכִי בַּבָּיִת
  choice: 你家里有什么？
  rationale: 存在句配介词ל表示领有，汉语自然表达为“有什么”；“家里”保留具体的家庭场景。
- source_word: לְשִׁפְחָתְךָ
  choice: 婢女
  rationale: שִׁפְחָה明确指女性仆人；这里是女子对以利沙谦卑的自称。“婢女”简洁地保留性别和恭敬语气。
- source_word: אֵין ... כֹל
  choice: 什么都没有
  rationale: אֵין与כֹל结合形成全面否定；“什么都没有”自然表达其强调范围，无须额外加入“完全”。
- source_word: כִּי אִם
  choice: 只有
  rationale: 在否定句后引出唯一例外，现代汉语用“只有”最自然。
- source_word: אָסוּךְ שָׁמֶן
  choice: 一小瓶油
  rationale: 罕见词אָסוּךְ指盛油的小容器，但其确切形制不明；“小瓶”传达容器较小而不赋予礼仪用途。
