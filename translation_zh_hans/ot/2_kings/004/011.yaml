  text: One day he came there[a], turned aside into the upper room, and lay down there.
translation:
  language: zh_hans
  text: 有一天，以利沙来到那里，就转进楼上的房间，躺在那里。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“睡在那里。”希伯来语动词既可指躺下，也可指睡觉；本处语境不要求采用较具体的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי הַיּוֹם
  choice: 有一天
  rationale: 这是引出某次事件的希伯来叙事惯用语；“有一天”自然地表达时间背景，不拘泥于原文句式。
- source_word: וַיָּבֹא שָׁמָּה
  choice: 以利沙来到那里
  rationale: בוא在此表示“来、到达”；根据上文补出主语“以利沙”，使独立经节在现代汉语中清楚易懂，同时保留שָׁמָּה“那里”。
- source_word: וַיָּסַר
  choice: 转进
  rationale: סור在此指偏离原来的行程而进入特定地点；“转进”既保留转向之意，又自然表达进入房间的动作。
- source_word: אֶל הָעֲלִיָּה
  choice: 楼上的房间
  rationale: עֲלִיָּה指位于上层的房间；“楼上的房间”比单用“楼房”更准确，也符合现代普通话。
- source_word: וַיִּשְׁכַּב שָׁמָּה
  choice: 躺在那里
  rationale: שׁכב可指躺下，也可依语境指睡觉；正文采用较宽泛的“躺在那里”，避免无根据地限定为入睡。
