  text: Then go in and shut the door behind yourself and behind your sons[a], and pour into all these containers[b]; and set aside the full ones.
translation:
  language: zh_hans
  text: 然后你进去，把门关在你和儿子们身后；把油倒进所有这些器皿[a]里，装满的就移到一旁[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “器皿”原文是广义词，也可译作“容器”或“各种用具”；这里按上下文指可用来盛油的器皿。
    reason: lexical_alternative
  - marker: b
    text: “装满的就移到一旁”也可译作“把装满的那个移开”。原文用单数形式，可理解为逐个处理装满的器皿。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָאת
  choice: 然后你要进去
  rationale: בוא在此指进入屋内；“进去”符合以利沙向妇人发出下一步指示的语境，“然后”自然表达承接次序。
- source_word: וְסָגַרְתְּ הַדֶּלֶת בַּעֲדֵךְ וּבְעַד בָּנַיִךְ
  choice: 把门关上，你和儿子们都留在里面
  rationale: בעד与“关门”连用，表示门关在他们身后，使他们留在门内并与外界隔开。中文若直译为“在你和儿子们后面关门”较生硬，现译保留具体空间意义。
- source_word: וְיָצַקְתְּ עַל
  choice: 再往……里倒
  rationale: יצק意为“倒、倾注”；对器皿施行此动作时，现代中文自然说“往……里倒”。原文未明说所倒之物，译文也不补出“油”，以保留原文的简洁。
- source_word: כָּל הַכֵּלִים הָאֵלֶּה
  choice: 这一切器皿
  rationale: כְּלִים是广义词，可指各类器具或容器。上下文所指是盛油之物；“器皿”既保留词义宽度，也适合庄重而易懂的经文语体。
- source_word: וְהַמָּלֵא
  choice: 装满的
  rationale: 带冠词的单数形容词作名词使用，指“装满的那个（器皿）”。中文“装满的”可自然地泛指每个装满的器皿，而不强行改成明确复数。
- source_word: תַּסִּיעִי
  choice: 移到一旁
  rationale: נסע的使役形在此表示把已经装满的器皿移开。“移到一旁”准确表达实际动作，比单说“移走”更清楚。
theological_decisions: []
translation_notes:
  register: 采用现代、自然而庄重的指示语体。“你和儿子们都留在里面”避免生硬复制希伯来语空间结构，同时保留关门隔绝外界的画面；末句保留原文单数形式可能具有逐个或泛指意义的张力。
