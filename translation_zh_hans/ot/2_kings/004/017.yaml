base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/017.yaml
  text: So the woman conceived and bore a son at that appointed time[a], about this time next year, just as Elisha had spoken to her.
translation:
  language: zh_hans
  text: 那妇人就怀了孕；到了所定的时候，就是次年这个时候[a]，她生了一个儿子，正如以利沙对她所说的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译：“在这所定的时候，按生命的时刻。”后一句是一个时间习语，约指来年同一时节。
    reason: 保留 כָּעֵת חַיָּה 的较字面形式，并说明其在此处的习语含义。
lexical_decisions:
- source_word: וַתַּהַר
  choice: 怀了孕
  rationale: 希伯来语 הרה 在叙事中表示怀孕；“怀了孕”是现代汉语自然、清楚的表达。
- source_word: הָאִשָּׁה
  choice: 那妇人
  rationale: אִשָּׁה 可指“女人”或“妻子”；此处回指前文的书念妇人，用“那妇人”保持叙事衔接和庄重语体。
- source_word: וַתֵּלֶד בֵּן
  choice: 生了一个儿子
  rationale: 这是表示生育儿子的常用结构；译文直接自然。
- source_word: לַמּוֹעֵד הַזֶּה
  choice: 在所定的日期
  rationale: מוֹעֵד 指指定、约定或确定的时间；“所定的日期”保留了时间已经预先确定的含义。
- source_word: כָּעֵת חַיָּה
  choice: 次年这个时候
  rationale: 该习语在应许生子的语境中指来年同一时节；正文采用自然汉语表达，脚注保留其较直译的形式与不确定性。
- source_word: אֲשֶׁר דִּבֶּר אֵלֶיהָ
  choice: 正如以利沙对她所说的
  rationale: 关系从句强调生产之事与以利沙先前所说的话相符；“正如”自然呈现应验关系。
- source_word: אֱלִישָׁע
  choice: 以利沙
  rationale: 采用现代中文圣经中通行的人名译法。
