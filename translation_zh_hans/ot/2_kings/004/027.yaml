source:
  edition: WLC
  text: וַ/תָּבֹ֞א אֶל אִ֤ישׁ הָֽ/אֱלֹהִים֙ אֶל הָ/הָ֔ר וַֽ/תַּחֲזֵ֖ק בְּ/רַגְלָ֑י/ו וַ/יִּגַּ֨שׁ גֵּֽיחֲזִ֜י לְ/הָדְפָ֗/הּ וַ/יֹּאמֶר֩ אִ֨ישׁ הָ/אֱלֹהִ֤ים הַרְפֵּֽה לָ/הּ֙ כִּֽי נַפְשָׁ֣/הּ מָֽרָה לָ֔/הּ וַֽ/יהוָה֙ הֶעְלִ֣ים מִמֶּ֔/נִּי וְ/לֹ֥א הִגִּ֖יד לִֽ/י־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/027.yaml
  text: When she came to the man of God at the mountain[a], she took hold of his feet. Gehazi came near to push her away, but the man of God said, “Leave her alone, for her soul is bitter within her[b], and Yahweh has hidden it from me and has not told me.”
translation:
  language: zh_hans
  text: 她到了山上的神人那里，就抱住他的脚。基哈西上前要把她推开，神人却说：“由她吧！她心里十分痛苦[a]；耶和华向我隐瞒了这事，没有告诉我。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“她的生命对她是苦的”，是形容内心极其痛苦的说法。
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ הָאֱלֹהִים
  choice: 神人
  rationale: 直译这一常见的希伯来先知称号，保留原文表达，不直接改释为“先知”。
- source_word: אֶל הָהָר
  choice: 山上的
  rationale: 结合动词“到了”和上下文中以利沙所在的位置，译为“山上的神人那里”自然地表达她来到山上见他，同时不把山具体化为某一座命名山。
- source_word: וַתַּחֲזֵק בְּרַגְלָיו
  choice: 抱住他的脚
  rationale: חזק与介词ב连用表示牢牢抓住；此处“抱住他的脚”符合汉语动作习惯，也传达她急切、不肯放开的举动。
- source_word: וַיִּגַּשׁ
  choice: 上前
  rationale: 简洁表达基哈西靠近并准备采取行动，符合现代汉语叙事。
- source_word: לְהָדְפָהּ
  choice: 要把她推开
  rationale: הדף表示用力排开；“推开”准确而自然，不额外强化为驱逐。
- source_word: הַרְפֵּה לָהּ
  choice: 由她吧
  rationale: 在此是命令基哈西停止干预。“由她吧”简洁庄重，并保留说话者准许她继续如此的语气。
- source_word: נַפְשָׁהּ מָרָה לָהּ
  choice: 她心里十分痛苦
  rationale: 这是表达内在深重苦楚的希伯来习语；汉语用“心里十分痛苦”准确传达意义，脚注保留其字面意象。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文读者熟悉的圣名音译“耶和华”，明确保留专名性质，而不以“主”等称号替代。
- source_word: הֶעְלִים מִמֶּנִּי
  choice: 向我隐瞒了这事
  rationale: 使役词形表示使某事不为以利沙所知；“这事”承接女子的痛苦处境，是汉语中必要且自然的宾语补足。
- source_word: וְלֹא הִגִּיד לִי
  choice: 没有告诉我
  rationale: 与前句平行，直接保留以利沙承认自己未获神启示的意思。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用四字神名，正文应保留为专名。中文“耶和华”是广泛通行且易懂的音译；“雅威”更接近一种现代学术重构读音，但不必据此排除传统中文形式。
- issue: נֶפֶשׁ 在痛苦习语中的表达
  choice: 她心里十分痛苦
  alternative: 她的灵魂苦涩
  rationale: נפשׁ在这里指她内在的生命与感受，整句是深切痛苦的习语。正文采用自然汉语传意，脚注说明字面形式，以免把希伯来人的整体性用语固化为特定的灵魂论。
- issue: 先知知识的限度
  choice: 耶和华向我隐瞒了这事，没有告诉我
  alternative: 耶和华没有向我显明这事
  rationale: 保留原文两个并列陈述及其张力：以利沙明确承认神没有让他知道此事，不将其弱化为一般性的未察觉。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。“神人”保留原文称号；“由她吧”体现命令停止干预的语气；正文只设置一处脚注，并已在相应位置标出[a]。
