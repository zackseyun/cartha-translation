  text: Then she came and fell at his feet and bowed to the ground[a]. Then she picked up her son and went out.
translation:
  language: zh_hans
  text: 她便来到，俯伏在以利沙脚前，向地叩拜[a]；随后抱起她儿子，出去了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“俯伏在地”。这个希伯来语动词在某些语境中也可译作“敬拜”；此处用于她在以利沙面前所行的深度敬礼。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּבֹא
  choice: 她就进来
  rationale: 叙事中的连续式推进动作；结合上文场景，用“就进来”自然表达她进入房内。
- source_word: וַתִּפֹּל עַל רַגְלָיו
  choice: 俯伏在以利沙脚前
  rationale: “俯伏在……脚前”既符合现代汉语习惯，也表达在以利沙面前伏下的动作；明确代词所指以免歧义。
- source_word: וַתִּשְׁתַּחוּ אָרְצָה
  choice: 向地叩拜
  rationale: 保留身体伏向地面的强烈敬礼动作，同时不直接判定为对神的敬拜。
- source_word: וַתִּשָּׂא אֶת בְּנָהּ
  choice: 抱起儿子
  rationale: נשא可指举起、拿起或带走；在母亲带走刚复生的孩子这一场景中，“抱起”具体而自然。
- source_word: וַתֵּצֵא
  choice: 出去了
  rationale: 直接表达她从所在之处出去，并保持简洁的叙事推进。
theological_decisions:
- issue: וַתִּשְׁתַּחוּ在以利沙面前的含义
  choice: 译作“向地叩拜”，表示深切感激和尊敬的俯伏动作
  alternative: 译作“敬拜”或“俯伏在地”
  rationale: 该词可按语境指敬拜或向人行伏地礼。此处对象是以利沙，译文保留敬礼动作及词义张力，而不明确断言这是对神的敬拜。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“叩拜”比单纯“鞠躬”更能体现伏向地面的动作；用“抱起”贴合母亲带走孩子的具体场景。
