base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/033.yaml
  text: He went in and shut the door behind the two of them[a], and prayed to Yahweh.
translation:
  language: zh_hans
  text: 他进去后，把门关在他和那孩子两人身后[a]，然后向雅威祷告。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可直译为“把门关在他们两人身后”。“他们两人”指以利沙和那孩子，表示门关上后只有他们二人在房内。
    reason: 保留בְּעַד שְׁנֵיהֶם与“关门”连用时“在两人身后”的表达，并说明代词在上下文中的所指。
lexical_decisions:
- source_word: וַיָּבֹא
  choice: 他进去
  rationale: בוא在连续叙事中表示以利沙进入孩子所在的房间；“进去”自然、清楚，并保留动作次序。
- source_word: וַיִּסְגֹּר הַדֶּלֶת
  choice: 把门关上
  rationale: סגר意为“关闭、关上”，דלת是“门”；此译具体而符合现代汉语习惯。
- source_word: בְּעַד שְׁנֵיהֶם
  choice: 将他们两人留在里面
  rationale: בְּעַד与“关门”连用时，可表示门在某人身后关上，从而将其留在门内。这里的“两人”指以利沙和孩子；正文采用自然汉语表达其空间含义，不额外说明人物身份。
- source_word: וַיִּתְפַּלֵּל
  choice: 然后……祷告
  rationale: פלל的Hitpael词形在此表示“祷告”；“然后”体现希伯来叙事连续式所表达的动作推进。
- source_word: אֶל יְהוָה
  choice: 向雅威
  rationale: 介词אֶל与“祷告”搭配译作“向”；专名יהוה音译为“雅威”，以保留经文中的神圣名字。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名יהוה。“雅威”较贴近学界通常重构的读音，并让读者看见这是专名；不以称号“上主”取代，也不采用受较晚元音组合影响的“耶和华”。
- issue: “他们两人”的所指
  choice: 保留代词，不在正文中明说是以利沙和孩子
  alternative: 把以利沙和孩子关在里面
  rationale: 上下文足以辨明所指；保留原文的代词形式，避免把解释直接写入正文，同时脚注说明其场景含义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“把门关上，将他们两人留在里面”避免生硬直译，同时保留房门关闭、两人独处的核心画面；脚注标记[a]已置于正文相应位置。
