  yaml_path: translation/ot/haggai/001/007.yaml
  text: 'Thus says Yahweh of hosts: Consider your ways.'
translation:
  language: zh_hans
  text: 万军之耶和华如此说：“你们要省察自己所行的路。”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“你们要把你们的心放在你们所行的路上。”
    reason: 保留希伯来语习语 שִׂימוּ לְבַבְכֶם עַל 的字面形象，以及“道路”的原始隐喻。
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: 如此说
  rationale: 这是先知信息常用的宣告公式；“如此说”既保留庄重语气，也符合现代中文圣经文体。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代简体中文读者最熟悉的专名形式音译四字神名，不以“主”替代。
- source_word: צְבָאוֹת
  choice: 万军之
  rationale: 保留该神圣称号的广泛含义，不限定为地上军队或天军；与“耶和华”组合为中文惯用称号“万军之耶和华”。
- source_word: שִׂימוּ לְבַבְכֶם עַל
  choice: 要省察
  rationale: 该短语字面为“把你们的心放在……上”，在此是要求人认真留意、反思；“省察”自然凝练，也保留内在审视的意味。
- source_word: דַּרְכֵיכֶם
  choice: 自己的行径
  rationale: “道路”在此比喻人的行为和生活历程；“行径”保留行为方向的意象，并清楚表达语境中的道德反省。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。中文正文采用广为人知的传统音译“耶和华”，既将其作为专名呈现，也避免以称号“主”取代。
- issue: “道路”的道德含义
  choice: 行径
  alternative: 道路
  rationale: 这里既可指人生道路，也在上下文中指百姓的行为与处境；“行径”凸显反省行为的要求，但不额外判定其行为性质。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“如此说”保留先知宣告体；“省察自己的行径”便于普通读者理解，脚注则呈现原文“把心放在……上”的具体意象。
