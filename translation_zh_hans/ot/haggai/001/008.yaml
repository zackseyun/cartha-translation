source:
  edition: WLC
  text: עֲל֥וּ הָ/הָ֛ר וַ/הֲבֵאתֶ֥ם עֵ֖ץ וּ/בְנ֣וּ הַ/בָּ֑יִת וְ/אֶרְצֶה בּ֥/וֹ ו/אכבד אָמַ֥ר יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/haggai/001/008.yaml
  text: Go up into the hills[a], bring wood, and build the house, so that I may take pleasure in it and be glorified[c][b], says Yahweh.
translation:
  language: zh_hans
  text: 你们要上山[a]，运来木料，建造这殿[b]，使我喜悦它，并得荣耀[c]。雅威说。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“山地”或“丘陵地带”。希伯来语הָהָר可指一座山、丘陵或高地地区。
    reason: lexical_alternative
  - marker: b
    text: 即圣殿；希伯来语字面意思是“房屋”。
    reason: lexical_alternative
  - marker: c
    text: 也可译作“并受尊崇”。这里的希伯来语动词既可表示“得荣耀”，也可表示“受尊崇”。
    reason: alternative_reading
lexical_decisions:
- source_word: עֲלוּ
  choice: 你们要上
  rationale: עלה的Qal祈使式复数，直接向众人发出上行的命令；“你们要上”在现代汉语中自然，并保留命令语气。
- source_word: הָהָר
  choice: 山
  rationale: הַר可指山、丘陵或山地。此处百姓要去取得木料；正文采用简洁的“山”，并以脚注保留“山地”等可能。
- source_word: וַהֲבֵאתֶם עֵץ
  choice: 运来木料
  rationale: בוא的Hiphil形式表示“带来、运来”，עֵץ在此作物质集合名词。“运来木料”切合建筑语境，也比“带来木头”更自然。
- source_word: וּבְנוּ
  choice: 建造
  rationale: בנה的Qal祈使式复数本义为“建造”。虽然后来工程具有重建性质，原文动词本身并未明确表达“重建”。
- source_word: הַבָּיִת
  choice: 这殿
  rationale: בַּיִת字面为“房屋”，在本书语境中明确指雅威的圣殿。汉语用“殿”可自然表达所指对象，脚注同时保留原文字面措辞。
- source_word: וְאֶרְצֶה בּוֹ
  choice: 好让我喜悦它
  rationale: רצה可表示喜悦、满意或悦纳；这里两个命令之后的连接形式适合按目的关系表达。“喜悦它”保留בּוֹ所指向的建筑本身，没有改写成对祭物或百姓的悦纳。
- source_word: ו/אכבד
  choice: 并得荣耀
  rationale: 按马所拉读法理解为כבד的Niphal形式，可表达“得荣耀”或“受尊崇”。“得荣耀”保留被动意义与圣殿语境中的神学分量，又不改写为主动的“彰显荣耀”。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以“雅威”音译四字神名，保留其作为以色列上帝之专名的性质，不以称号代替。
- source_word: אָמַר יְהוָה
  choice: 这是雅威说的
  rationale: 忠实表达先知话语末尾的神圣发言公式；这种语序在现代汉语中清楚自然。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。译作“雅威”保留专名性质，避免以“主”这一称号代替；“耶和华”是传统形式，但较不贴近通常重构的发音。
- issue: הַבָּיִת在圣殿语境中的表达
  choice: 这殿
  alternative: 这房屋
  rationale: 原文字面是“房屋”，语境所指则明确为圣殿。正文译作“这殿”使普通读者立刻明白所指，脚注说明字面形式，以兼顾语义清晰与原文措辞。
- issue: ו/אכבד的语态与神学含义
  choice: 并得荣耀
  alternative: 并受尊崇；并彰显我的荣耀
  rationale: 采用Niphal的被动理解，不把经文扩写为主动彰显荣耀。“得荣耀”和“受尊崇”均属可能含义，因此在脚注中保留后者。
- issue: וְאֶרְצֶה与前述命令的关系
  choice: 好让我喜悦它
  alternative: 我就会喜悦它
  rationale: 连接词可表达命令所指向的目的或结果。采用“好让”呈现目的意味，但不把上帝的喜悦解释为靠工程赚取；原文的因果张力予以保留。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“运来木料”符合建筑语境；“这殿”比字面的“这房屋”更清楚，字面信息置于脚注。句末采用“这是雅威说的”，自然呈现先知书中的神谕公式。所有脚注标记均已在正文对应位置出现。
