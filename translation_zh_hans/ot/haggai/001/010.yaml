base_translation:
  language: en
  yaml_path: translation/ot/haggai/001/010.yaml
  text: Therefore the heavens above you have withheld the dew[a], and the earth has withheld its produce.
translation:
  language: zh_hans
  text: 所以，你们头上的诸天不降甘露，大地也不出土产。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “大地……土产”也可译作“土地……收成”。希伯来语 אֶרֶץ 可指“大地”或“土地”，יְבוּל 可指“土产”或“收成”。
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל כֵּן
  choice: 所以
  rationale: 承接上文，明确表达因果推论；现代汉语自然简洁。
- source_word: עֲלֵיכֶם
  choice: 你们头上的
  rationale: 在“诸天”的语境中取空间意义，保留“在你们上方”的意象。
- source_word: כָּלְאוּ שָמַיִם מִטָּל
  choice: 诸天不降甘露
  rationale: כלא表示扣留、不予；按自然汉语表达为“不降”，同时保留“诸天”和“甘露”的庄重语体。
- source_word: וְהָאָרֶץ
  choice: 大地
  rationale: 与“诸天”形成上下对应；אֶרֶץ在此也可理解为“土地”。
- source_word: כָּלְאָה יְבוּלָהּ
  choice: 不出土产
  rationale: 再次体现כלא的扣留之意；יְבוּלָהּ泛指大地所出的农产或收成，不限于某一种作物。
