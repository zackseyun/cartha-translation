  yaml_path: translation/ot/haggai/001/004.yaml
  text: Is it a time for you yourselves to live in your paneled houses while this house lies in ruins?[a]
translation:
  language: zh_hans
  text: “难道现在是你们自己住在镶着木板的房屋里，而这房屋却荒废着的时候吗？[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “镶着木板的”或译“有顶棚的”；指房屋覆以或衬以木板。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַעֵת
  choice: 现在难道是……的时候吗
  rationale: 保留“时候/时机”这一名词概念和原文的反问语气，并自然呼应第2节百姓所说“时候还没有到”。
- source_word: לָכֶם אַתֶּם
  choice: 你们自己
  rationale: לָכֶם之后另加独立代词אַתֶּם，形成明显强调；“你们自己”保留先知责问时的对比力度。
- source_word: לָשֶׁבֶת
  choice: 住在
  rationale: ישׁב本义可指“坐”，但与房屋连用时通常表示居住；“住在”符合现代汉语习惯。
- source_word: בְּבָתֵּיכֶם
  choice: 在……房屋里
  rationale: 保留“房屋”的具体意象，使百姓的房屋与下文耶和华的殿形成鲜明对照。
- source_word: סְפוּנִים
  choice: 镶板
  rationale: 该被动分词表示房屋被木板覆盖、衬里或装饰；“镶板”简洁地传达房屋已经修整且较为讲究的意味，同时以脚注保留“装有天花板”等词义可能。
- source_word: וְהַבַּיִת הַזֶּה
  choice: 而这座殿却
  rationale: וְ在此构成强烈对照，译为“而……却”；根据紧邻上下文，这所“房屋”指耶和华的殿，“这座殿”在现代汉语中自然清楚。
- source_word: חָרֵב
  choice: 荒废着
  rationale: 该形容词描述遭破坏、荒凉的持续状态；“荒废着”既表达现状，也凸显百姓长期疏忽修建圣殿。
theological_decisions:
- issue: “这房屋”的所指
  choice: 这座殿
  alternative: 这座房屋
  rationale: 原文使用普通名词בַּיִת，但哈该书1:2、8—9清楚表明所指是耶和华的殿。汉语若直译“这座房屋”容易被误解为普通住宅，因此按语境译为“这座殿”，不另加原文没有的所有格或解释。
translation_notes:
  register: 采用现代、庄重而易懂的反问句式。“现在难道是……的时候吗”承接第2节有关“时候”的说法；“你们自己”保留原文重复代词造成的强调。“镶板”略带书面色彩，但能简洁表达修整讲究的住宅，并由脚注说明其词义范围。
