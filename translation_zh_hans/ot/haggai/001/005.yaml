  text: וְ/עַתָּ֕ה כֹּ֥ה אָמַ֖ר יְהוָ֣ה צְבָא֑וֹת שִׂ֥ימוּ לְבַבְ/כֶ֖ם עַל דַּרְכֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/haggai/001/005.yaml
  text: 'Now therefore[a], thus says Yahweh of hosts: Set your heart on your ways.'
translation:
  language: zh_hans
  text: 如今，万军之雅威如此说：“你们要用心省察自己所走的道路[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“把你们的心放在你们的道路上。”
    reason: 说明希伯来语习语的字面形式；正文以自然汉语表达其郑重思想、省察的含义。
lexical_decisions:
- source_word: וְעַתָּה
  choice: 所以，现在
  rationale: וְ与עַתָּה在这里既承接上文的责备，又引出由此而来的劝告；“所以，现在”兼顾推论与时间推进。
- source_word: כֹּה אָמַר
  choice: 如此说
  rationale: 保留先知信息中惯用的使者宣告格式；汉语用“如此说”自然且庄重。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文直接呈现神的专名，而不以“主”这一称号替代；“雅威”是现代汉语中通行的音译之一。
- source_word: צְבָאוֹת
  choice: 万军之
  rationale: “万军之雅威”保留该神圣称号的传统表达，也不把“军队”限定为地上或天上的某一类。
- source_word: שִׂימוּ לְבַבְכֶם
  choice: 用心省察
  rationale: 原文直译为“把你们的心放在……上”，在此是要求人郑重思想、自我反省；“用心省察”既保留“心”的意味，也符合现代汉语表达。
- source_word: עַל דַּרְכֵיכֶם
  choice: 自己所走的道路
  rationale: דֶּרֶךְ既可指道路，也可比喻生活方式和行为；此译保留道路意象，同时让汉语读者自然理解为人生行为。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文使用神的专名，正文采用音译以保留专名性质；不以称号“主”替代，也不据此加入本节没有明说的神学解释。
- issue: “道路”的伦理含义
  choice: 自己所走的道路
  alternative: 自己的行为；自己的生活方式
  rationale: 保留原文道路隐喻，使其既可指行为与生活方向，又不把意义缩窄为单一伦理术语。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“所以，现在”承接上下文；“用心省察自己所走的道路”避免生硬直译，同时以脚注保留“把心放在……上”的原文形象。
