  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וָ/אֶקְרָ֨א חֹ֜רֶב עַל הָ/אָ֣רֶץ וְ/עַל הֶ/הָרִ֗ים וְ/עַל הַ/דָּגָן֙ וְ/עַל הַ/תִּיר֣וֹשׁ וְ/עַל הַ/יִּצְהָ֔ר וְ/עַ֛ל אֲשֶׁ֥ר תּוֹצִ֖יא הָ/אֲדָמָ֑ה וְ/עַל הָֽ/אָדָם֙ וְ/עַל הַ/בְּהֵמָ֔ה וְ/עַ֖ל כָּל יְגִ֥יעַ כַּפָּֽיִם־־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/haggai/001/011.yaml
  text: And I called for a drought on the land and on the mountains[a], on the grain, on the new wine, on the fresh oil, on what the ground produces, on man and on beast[b], and on all the labor of the hands.
translation:
  language: zh_hans
  text: 我召来干旱，使它临到这地和山岭，临到五谷、新酒、新油[a]和土地所出产的一切，也临到人[b]和牲畜，以及人手的一切劳碌。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “新油”原文通常指新鲜的油，在此农产语境中多指橄榄油。
    reason: lexical_alternative
  - marker: b
    text: “人”原文为单数集合用法，泛指人类。
    reason: alternative_reading
lexical_decisions:
- source_word: וָאֶקְרָא
  choice: 我召来
  rationale: קרא在这里表示召唤、招致作为审判的干旱；“召来”既保留上帝主动施行审判的含义，又符合现代汉语表达。
- source_word: חֹרֶב
  choice: 干旱
  rationale: 本节列举土地、农作物、人与牲畜，语境明确指使万物枯干的旱灾，而非一般的荒凉。
- source_word: הָאָרֶץ
  choice: 这地
  rationale: 此处指当地受审判的土地，并非整个地球；“这地”自然地表达其特指和地域性。
- source_word: הֶהָרִים
  choice: 山岭
  rationale: 准确表达复数 הָרִים，同时比“众山”更符合现代普通话。
- source_word: הַדָּגָן
  choice: 五谷
  rationale: דָּגָן泛指谷类农作物；“五谷”是自然、庄重的集合性表达，并不限定为五种作物。
- source_word: הַתִּירוֹשׁ
  choice: 新酒
  rationale: תִּירוֹשׁ通常指新酿的酒或葡萄汁制品；“新酒”保留其与一般酒类词汇的区别。
- source_word: הַיִּצְהָר
  choice: 橄榄油
  rationale: יִצְהָר是农产语境中的新油，通常特指橄榄油；正文采用现代读者易懂的具体名称，并以脚注保留其较形式化的词义。
- source_word: אֲשֶׁר תּוֹצִיא הָאֲדָמָה
  choice: 土地所出产的一切
  rationale: 保留“土地生出”的农业意象和概括范围；“一切”明确呈现关系代词所涵盖的全部产物。
- source_word: הָאָדָם
  choice: 人
  rationale: אָדָם在这里是泛指全人类的单数形式，并与牲畜并列；汉语“人”既可自然泛指人类，也保留简洁的对举结构。
- source_word: הַבְּהֵמָה
  choice: 牲畜
  rationale: 在农业语境中 בְּהֵמָה主要指家养的大型动物；“牲畜”比“走兽”更贴合旱灾影响农牧生活的语境。
- source_word: כָּל יְגִיעַ כַּפָּיִם
  choice: 人手一切的劳作
  rationale: 保留“手”的具体意象，并表达 יְגִיעַ 所含辛劳、劳作之意，而不把它仅解释为劳动成果。
theological_decisions:
- issue: הָאָדָם作为泛指人类的单数名词
  choice: 人
  alternative: 人类
  rationale: 希伯来文以单数集合用法将“人”与“牲畜”并列。“人”在现代汉语中可自然泛指全体人类，同时保留原文简练的修辞结构；脚注说明其范围，避免误解为某一个人。
- issue: 旱灾的神圣施行者及其作用范围
  choice: 我召来干旱，使它临到……
  alternative: 我宣布这地必有干旱
  rationale: 原文第一人称动词表达说话者主动召来审判，而不是仅作预告；译文保留这一主动性，同时不额外解释其机制。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以重复的“临到”维持原文连续使用 עַל 所形成的审判清单节奏，同时避免机械地逐项重复。用“这地”和“土地”区分 אֶרֶץ 与 אֲדָמָה；前者侧重受审判的地域，后者侧重出产作物的土壤。
