source:
  edition: WLC
  text: פָּנֹ֤ה אֶל הַרְבֵּה֙ וְ/הִנֵּ֣ה לִ/מְעָ֔ט וַ/הֲבֵאתֶ֥ם הַ/בַּ֖יִת וְ/נָפַ֣חְתִּי ב֑/וֹ יַ֣עַן מֶ֗ה נְאֻם֙ יְהוָ֣ה צְבָא֔וֹת יַ֗עַן בֵּיתִ/י֙ אֲשֶׁר ה֣וּא חָרֵ֔ב וְ/אַתֶּ֥ם רָצִ֖ים אִ֥ישׁ לְ/בֵיתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/haggai/001/009.yaml
  text: You looked for much[a], but behold, it was little; and when you brought it home, I blew it away. Why? declares Yahweh of Armies. Because of my house, which lies in ruins[b], while each of you runs to his own house.
translation:
  language: zh_hans
  text: 你们指望丰收，看哪，所得的却很少；你们把它带回家，我却把它吹散了。[a]为什么呢？统领万军的耶和华[b]说：因为我的殿宇荒废，你们却各自奔向自己的房屋。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我向它吹气。”原文动词的本义是“吹、呼气”；这里表明上帝施行审判，使收成消散或减少。
    reason: lexical_alternative
  - marker: b
    text: 传统译法：“万军之耶和华。”这里的“万军”可指上帝所统领的众军。
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּנֹה אֶל הַרְבֵּה
  choice: 指望丰收
  rationale: 该短语字面有“转向许多”之意，在歉收的语境中表示期待大量收成。“指望丰收”以自然汉语表达这一习语含义，同时不过度扩写。
- source_word: וְהִנֵּה לִמְעָט
  choice: 看哪，所得的却很少
  rationale: “看哪”保留 הִנֵּה 的强调和引人注意之力；“所得的却很少”补出汉语所需的隐含对象，并表达 לִמְעָט 所指的少量结果。
- source_word: וַהֲבֵאתֶם הַבַּיִת
  choice: 你们把它带回家
  rationale: 此处 הַבַּיִת 表示把收成带回各人的家，与后文“我的殿宇”和“自己的房屋”形成对照；“带回家”符合现代汉语习惯。
- source_word: וְנָפַחְתִּי בוֹ
  choice: 我却把它吹散了
  rationale: נפח 的本义是“吹、呼气”。在审判语境中，“吹散”既保留具体意象，也表达收成被上帝消减、驱散的结果；脚注注明较字面的译法。
- source_word: יַעַן מֶה
  choice: 为什么呢？
  rationale: 该短语引出说明审判缘由的反问；此译简洁自然，并保留修辞力度。
- source_word: נְאֻם יְהוָה צְבָאוֹת
  choice: 统领万军的耶和华说
  rationale: נְאֻם 是先知性宣告公式，汉语以“说”自然表达；“耶和华”呈现神名，“统领万军”传达 צְבָאוֹת 所含的军队、众军含义。
- source_word: יַעַן בֵּיתִי אֲשֶׁר הוּא חָרֵב
  choice: 因为我的殿宇仍然荒废
  rationale: “我的殿宇”依据上下文指耶和华的圣殿，并与百姓自己的房屋清楚对照；“荒废”准确表达 חָרֵב 的荒凉、废弃状态。
- source_word: וְאַתֶּם רָצִים אִישׁ לְבֵיתוֹ
  choice: 你们却各自奔向自己的房屋
  rationale: “奔向”保留 רָצִים 的急切动态；“各自……自己的”自然表达 אִישׁ לְבֵיתוֹ 的逐一分配意义，不必在汉语中强加男性代词。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: “耶和华”是现代中文圣经传统中最广为人知的专名形式，作为名字而非普通称号呈现四字神名；“雅威”更接近常见学术拟音，但普通读者熟悉度较低。
- issue: 称号 צְבָאוֹת 的译法
  choice: 统领万军的
  alternative: 万军之
  rationale: “统领万军的”明确传达该称号涉及众军、军队的含义，也避免现代读者把“万军之”误解为含义不明的固定古语；脚注保留传统译法。
- issue: בֵּיתִי 在本节中的所指
  choice: 我的殿宇
  alternative: 我的房屋
  rationale: 上下文明确谈论被忽视的圣殿，因此“殿宇”可让普通读者明白所指；同时后半句用“自己的房屋”，保留圣殿与私人住宅之间的神学对照。
- issue: 上帝吹气行为的结果
  choice: 把它吹散了
  alternative: 向它吹气
  rationale: 原动词本身是“吹”，而上下文显示其效果是使带回家的收成消失或减少。“吹散”表达这一审判效果，但脚注保留较字面的可能译法，以免掩盖原文意象。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“看哪”保留先知话语的强调色彩；“殿宇”与“房屋”形成易懂的对照；整体句式尽量保留原文由失望、反问到说明原因的推进。
