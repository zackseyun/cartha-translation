source:
  edition: WLC
  text: וַ/יִּשְׁמַ֣ע זְרֻבָּבֶ֣ל בֶּֽן שַׁלְתִּיאֵ֡ל וִ/יהוֹשֻׁ֣עַ בֶּן יְהוֹצָדָק֩ הַ/כֹּהֵ֨ן הַ/גָּד֜וֹל וְ/כֹ֣ל שְׁאֵרִ֣ית הָ/עָ֗ם בְּ/קוֹל֙ יְהוָ֣ה אֱלֹֽהֵי/הֶ֔ם וְ/עַל דִּבְרֵי֙ חַגַּ֣י הַ/נָּבִ֔יא כַּ/אֲשֶׁ֥ר שְׁלָח֖/וֹ יְהוָ֣ה אֱלֹהֵי/הֶ֑ם וַ/יִּֽירְא֥וּ הָ/עָ֖ם מִ/פְּנֵ֥י יְהוָֽה׀־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/haggai/001/012.yaml
  text: Then Zerubbabel son of Shealtiel[a], and Joshua son of Jehozadak, the high priest, and all the remnant of the people, listened to the voice of Yahweh their God and to the words of Haggai the prophet, as Yahweh their God had sent him[d][c][b]; and the people feared before Yahweh.
translation:
  language: zh_hans
  text: 于是，撒拉铁的儿子所罗巴伯、约萨答的儿子、大祭司约书亚，以及全体余民[b]，都听了[a]他们的上帝雅威的声音和他们的上帝雅威所差遣的哈该先知的话[c]。百姓就敬畏雅威[d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“听从”；希伯来语动词也可指听见后留心回应。
    reason: lexical_alternative
  - marker: b
    text: 或译“其余的百姓”；“余民”保留了先知书中幸存群体的意味。
    reason: lexical_alternative
  - marker: c
    text: 也可理解为：“……和哈该先知的话，因为他们的上帝雅威差遣了他。”
    reason: alternative_reading
  - marker: d
    text: 或译“惧怕雅威”或“在雅威面前肃然起敬”；希伯来语兼有惧怕和敬畏之意。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: 听从了
  rationale: שׁמע在这里不只是听见，也包含留心响应；“听从”自然表达这种含义，但脚注保留“听了”等较弱译法，以免把后续行动完全读入本动词。
- source_word: זְרֻבָּבֶל בֶּן שַׁלְתִּיאֵל
  choice: 撒拉铁的儿子所罗巴伯
  rationale: 采用现代中文圣经读者较熟悉的人名音译，并保留父子关系。
- source_word: יְהוֹשֻׁעַ בֶּן יְהוֹצָדָק הַכֹּהֵן הַגָּדוֹל
  choice: 大祭司约萨答的儿子约书亚
  rationale: הַכֹּהֵן הַגָּדוֹל是以色列首席祭司的通行称谓，译作“大祭司”；中文语序清楚表明这一称号修饰约书亚。
- source_word: שְׁאֵרִית הָעָם
  choice: 全体余民
  rationale: “余民”保留先知书中幸存群体的历史及盟约意味；כֹל译作“全体”。
- source_word: בְּקוֹל יְהוָה אֱלֹהֵיהֶם
  choice: 雅威他们上帝的声音
  rationale: 保留“声音”这一具体意象，并把神名יהוה音译为“雅威”，不以称号替代。
- source_word: דִּבְרֵי חַגַּי הַנָּבִיא
  choice: 哈该先知的话
  rationale: “话”保留דִּבְרֵי的复数言语含义，也与前面的“声音”相呼应。
- source_word: כַּאֲשֶׁר שְׁלָחוֹ יְהוָה אֱלֹהֵיהֶם
  choice: 哈该正是雅威他们的上帝所差遣的
  rationale: 以自然中文明确哈该受神差遣，同时不在正文中强行断定该从句只表原因；脚注说明可作因果理解。
- source_word: וַיִּירְאוּ הָעָם מִפְּנֵי יְהוָה
  choice: 百姓在雅威面前心存敬畏
  rationale: ירא兼有惧怕、敬畏与肃然起敬之意；“心存敬畏”适合此处回应神话语的语境，脚注保留“惧怕”的可能。
theological_decisions:
- issue: שְׁאֵרִית在先知书语境中的含义
  choice: 余民
  alternative: 其余的百姓
  rationale: “余民”既可指人数上剩下的人，也保留被掳归回群体在先知传统中的意味，而不额外界定其神学身份。
- issue: שׁמע是否明确表示顺服
  choice: 听从了
  alternative: 听了／听见了
  rationale: 上下文显示他们作出了响应，但该词仍以听取声音和话语为直接宾语；正文采用自然的“听从”，脚注保留较弱的听觉义。
- issue: כַּאֲשֶׁר从句与听从之间的逻辑关系
  choice: 以独立说明表达哈该受差遣
  alternative: 因为雅威他们的上帝差遣了他
  rationale: 希伯来语可表达相应关系，也可能在语境中带出原因。正文确认差遣事实而不完全锁定逻辑关系，脚注呈现因果译法。
- issue: ירא所表达的回应
  choice: 心存敬畏
  alternative: 惧怕
  rationale: 该词可指恐惧，也可指面对神的敬畏；正文采用符合敬拜语境的表达，同时以脚注保留其较强的惧怕色彩。
translation_notes:
  register: 采用庄重而现代的标准普通话。句子拆为两句，以避免希伯来语长串并列在中文中显得生硬；“正是……所差遣的”清楚表达先知使命，又由脚注保留从句的因果理解。神名统一音译为“雅威”，人名采用中文圣经传统中较通行的形式。
