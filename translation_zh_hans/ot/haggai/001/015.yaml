lexical_decisions:
- source_word: בְּיוֹם עֶשְׂרִים וְאַרְבָּעָה
  choice: 二十四日
  rationale: 希伯来语日期格式用基数表达月份中的日期；现代汉语自然表达为“二十四日”，无需直译为“二十和四日”。
- source_word: לַחֹדֶשׁ בַּשִּׁשִּׁי
  choice: 六月
  rationale: 原文意为“第六个月”；在明确的日期公式中，现代汉语通常简洁地说“六月”。
- source_word: בִּשְׁנַת שְׁתַּיִם
  choice: 第二年
  rationale: 这是君王纪年公式，现代汉语以序数“第二年”准确、自然地表达。
- source_word: לְדָרְיָוֶשׁ הַמֶּלֶךְ
  choice: 大流士王
  rationale: לְ标明以大流士在位年数纪年，הַמֶּלֶךְ是其王号；“大流士王”符合现代汉语称谓和纪年习惯。
- source_word: בְּיוֹם
  choice: 那天是
  rationale: 本节在句法和叙事上承接上一节的行动陈述；以“那天是”既呈现日期，又使这个独立编排的节句在现代汉语中自然可读。
