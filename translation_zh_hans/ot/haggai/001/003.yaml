base_translation:
  language: en
  yaml_path: translation/ot/haggai/001/003.yaml
  text: Then the word of Yahweh came by the hand of Haggai the prophet[a], saying,
translation:
  language: zh_hans
  text: 于是，雅威的话藉先知哈该[a]临到，说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“雅威的话借先知哈该的手临到。”希伯来文直译为“借哈该这位先知的手”，是表示他作为传达媒介的习语。
    reason: 说明 בְּיַד 的字面形式及其表示中介作用的含义。
lexical_decisions:
- source_word: וַיְהִי
  choice: 那时……传来
  rationale: 承接叙事中的下一事件；“那时”自然表达希伯来语连续叙事的推进，而“传来”与本句的“话”搭配，保留事件性。
- source_word: דְּבַר
  choice: 话
  rationale: 在先知宣告的固定表达中，指来自上帝的话语或信息；译作“话”既保留启示用语，也符合现代汉语。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文四字神名作音译，保留其作为以色列之上帝专名的性质，不以称号代替。
- source_word: בְּיַד
  choice: 藉……传来
  rationale: 字面为“借着……的手”，在此表示哈该是传递神言语的媒介；正文采用自然汉语，并以脚注保存原文意象。
- source_word: חַגַּי
  choice: 哈该
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: הַנָּבִיא
  choice: 先知
  rationale: 直接表达哈该的身份与职分，并与人名组成自然的同位结构“先知哈该”。
- source_word: לֵאמֹר
  choice: 说
  rationale: 该不定式用于引出随后直接话语；“说”是简洁、自然且透明的对应表达。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”较贴近当前学界普遍采用的拟音，也保留专名性质。
- issue: בְּיַד 所表达的先知中介作用
  choice: 正文译作“藉先知哈该传来”，脚注说明字面意象
  alternative: “借先知哈该的手临到”
  rationale: 原文既表明神的话由哈该作为媒介传达，又使用“借……的手”的习语。正文采用自然现代汉语，不把“手”误解为身体动作；脚注保存其字面形式与语义张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“那时”承接上文，“雅威的话……传来”符合现代叙事表达；保留传统人名“哈该”和先知话语引介式“说：”。
