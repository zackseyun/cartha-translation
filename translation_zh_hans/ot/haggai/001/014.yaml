revisions:
- from: 耶和华激发了犹大省长撒拉铁的儿子所罗巴伯的心志，也激发了大祭司约萨答的儿子约书亚的心志，以及全体余民的心志。他们就前来，为万军之耶和华[a]他们的神的殿做工。
  to: 耶和华激发了犹大省长撒拉铁的儿子所罗巴伯的心志，也激发了大祭司约萨答的儿子约书亚的心志，以及全体余民的心志。他们就前来，在万军之耶和华[a]——他们的神的殿中做工。
  rationale: 仅作一处安全的介词短语调整：以“在……的殿中做工”明确原文所表达的工作场域，并以破折号澄清“他们的神”与耶和华的同位关系。其余措辞保留，因其忠实且自然。
