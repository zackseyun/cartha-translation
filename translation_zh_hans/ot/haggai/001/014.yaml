source:
  edition: WLC
  text: וַ/יָּ֣עַר יְהוָ֡ה אֶת רוּחַ֩ זְרֻבָּבֶ֨ל בֶּן שַׁלְתִּיאֵ֜ל פַּחַ֣ת יְהוּדָ֗ה וְ/אֶת ר֨וּחַ֙ יְהוֹשֻׁ֤עַ בֶּן יְהוֹצָדָק֙ הַ/כֹּהֵ֣ן הַ/גָּד֔וֹל וְֽ/אֶת ר֔וּחַ כֹּ֖ל שְׁאֵרִ֣ית הָ/עָ֑ם וַ/יָּבֹ֨אוּ֙ וַ/יַּעֲשׂ֣וּ מְלָאכָ֔ה בְּ/בֵית יְהוָ֥ה צְבָא֖וֹת אֱלֹהֵי/הֶֽם־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/haggai/001/014.yaml
  text: And Yahweh stirred up the spirit of Zerubbabel son of Shealtiel[a], governor of Judah, and the spirit of Joshua son of Jehozadak, the high priest, and the spirit of all the remnant of the people; and they came and did work on the house of Yahweh of Armies, their God.
translation:
  language: zh_hans
  text: 耶和华激发了犹大省长撒拉铁的儿子所罗巴伯的心志，也激发了大祭司约萨答的儿子约书亚的心志，以及全体余民的心志。他们就前来，在万军之耶和华[a]——他们的神的殿中做工。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“统领万军的耶和华”。
    reason: 用较直白的现代汉语说明צְבָאוֹת所表达的军旅称号，同时保留原文可能涵盖天上与地上众军的宽度。
lexical_decisions:
- source_word: וַיָּעַר
  choice: 激发
  rationale: 该动词表示唤起、推动人采取行动；“激发”在现代汉语中自然，也符合上下文中神促使领袖和百姓投入圣殿工作的意思。
- source_word: רוּחַ
  choice: 心志
  rationale: 这里指人的内在意愿与行动动力。“心志”避免让读者误以为是另一个灵体，同时保留内在受激发而行动的含义。
- source_word: פַּחַת יְהוּדָה
  choice: 犹大省长
  rationale: פַּחַת是波斯时期的行政官职；“省长”是清楚且符合历史语境的现代汉语称谓。
- source_word: הַכֹּהֵן הַגָּדוֹל
  choice: 大祭司
  rationale: 这是该职衔规范、自然的汉语译法。
- source_word: כֹּל שְׁאֵרִית הָעָם
  choice: 全体余民
  rationale: “余民”保留先知文献中幸存群体的用语及其神学意味，“全体”对应כֹּל。
- source_word: וַיָּבֹאוּ
  choice: 他们就前来
  rationale: 忠实表达叙事中的随后行动，并用“就”自然衔接前面的神圣推动。
- source_word: וַיַּעֲשׂוּ מְלָאכָה
  choice: 做工
  rationale: 保留原文“做工作”的表达，不额外加入“开始”等体貌信息。
- source_word: בְּבֵית
  choice: 为……的殿
  rationale: 此处介词短语说明工作的对象或场所；结合重建语境，“为……的殿做工”比生硬的“在殿上做工”更符合现代汉语，同时没有把工作具体化为原文未明说的某一道工序。
- source_word: יְהוָה צְבָאוֹת
  choice: 万军之耶和华
  rationale: 采用现代中文圣经语境中可辨识的称号，并以脚注提供更直白的意义表达。
- source_word: אֱלֹהֵיהֶם
  choice: 他们的神
  rationale: 自然表达希伯来文所属后缀，并保留神与这群人的关系。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: “耶和华”是现代汉语读者最广泛识别的专名形式，正文将其作为神名而非普通称号处理；“雅威”则更接近许多学者所采用的拟定发音。
- issue: רוּחַ在此处是“灵”还是人的内在心志
  choice: 心志
  alternative: 灵
  rationale: 三个רוּחַ分别属于所罗巴伯、约书亚和全体余民，语境着重他们被推动去做工。“心志”表达人的内在动力，但不把神如何施行这种激发解释得过细。
- issue: שְׁאֵרִית的余民含义
  choice: 余民
  alternative: 其余的百姓
  rationale: “余民”保留先知书中该词可能具有的盟约与幸存群体意味；译作“其余的百姓”会弱化这种回响。
- issue: יְהוָה צְבָאוֹת的称号
  choice: 万军之耶和华
  alternative: 统领万军的耶和华
  rationale: 正文保留庄重且已广为人知的称号形式，脚注给出透明的意义译法；不把“军队”限定为天军或地上军队，以免消除原文的涵盖性。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。人名使用中文圣经传统中通行的形式；句法将希伯来文连续并列的长句适度分为两句，以便普通读者理解，同时保留三次受激发对象之间的对应关系。
