base_translation:
  language: en
  yaml_path: translation/ot/haggai/001/002.yaml
  text: 'Thus says Yahweh of hosts: These people say[a], “The time has not come[b], the time for the house of Yahweh to be rebuilt.”'
translation:
  language: zh_hans
  text: 万军之耶和华如此说：“这百姓说[a]：‘时候还没有到，重建[b]耶和华的殿的时候还没有到。’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或较直译作“这百姓说”。原文的说法可能带有疏离或责备的意味。
    reason: lexical_alternative
  - marker: b
    text: “重建”或译“建造”。希伯来语不定式本身没有明确表达“再、重新”，但被掳归回后的历史背景表明这里是重建圣殿。
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: 如此说
  rationale: 保留先知传信公式的庄重语气；希伯来语完成式在此具有宣告功能，现代汉语用“如此说”自然表达。
- source_word: יְהוָה צְבָאוֹת
  choice: 万军之耶和华
  rationale: “万军”保留צְבָאוֹת可涵盖天上和地上众军的宽广含义，并直接音译神名为“耶和华”。
- source_word: לֵאמֹר
  choice: 以冒号引出引语
  rationale: 该引语标记在现代汉语中以标点表达最自然，无须机械译为“说”。
- source_word: הָעָם הַזֶּה
  choice: 这百姓
  rationale: 贴近原文单数集合名词及指示词，并保留可能带有疏离或责备意味的语气。
- source_word: אָמְרוּ
  choice: 说
  rationale: 在上下文中描述百姓现有、持续的态度，汉语一般现在表达自然。
- source_word: לֹא עֶת בֹּא עֶת
  choice: 时候还没有到，就是……的时候
  rationale: 原文连续两次使用עֶת，译文保留其重复和强调；“还没有到”自然呈现בֹּא及百姓推迟行动的口吻。
- source_word: בֵּית יְהוָה
  choice: 耶和华殿
  rationale: “殿”在现代汉语圣经语域中自然指向圣殿，同时维持其属于耶和华的关系。
- source_word: לְהִבָּנוֹת
  choice: 重建
  rationale: 该尼法勒不定式本身是“被建造”，但被掳归回后的历史语境明确涉及恢复已毁的圣殿；“重建”自然表达此语境含义。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名；采用现代中文读者最熟悉的专名“耶和华”，不以“主”等称号代替。
- issue: הָעָם הַזֶּה的修辞语气
  choice: 这百姓
  alternative: 这些人
  rationale: “这百姓”既贴近原文集合单数，也可保留神与百姓当前态度之间可能存在的距离感，而不把责备程度说得过满。
- issue: לְהִבָּנוֹת是否明确译为重建
  choice: 重建
  alternative: 建造
  rationale: 原词形未明示“再”，但哈该书被掳归回后的处境指向圣殿的复建；正文采用“重建”，脚注注明较直译的可能。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。保留先知宣告公式及原文“时候”的重复强调；引语层级用中文全角引号区分。所有脚注标记均置于正文相应位置。
