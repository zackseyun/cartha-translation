  text: זְרַעְתֶּ֨ם הַרְבֵּ֜ה וְ/הָבֵ֣א מְעָ֗ט אָכ֤וֹל וְ/אֵין לְ/שָׂבְעָה֙ שָׁת֣וֹ וְ/אֵין לְ/שָׁכְרָ֔ה לָב֖וֹשׁ וְ/אֵין לְ/חֹ֣ם ל֑/וֹ וְ/הַ֨/מִּשְׂתַּכֵּ֔ר מִשְׂתַּכֵּ֖ר אֶל צְר֥וֹר נָקֽוּב־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/haggai/001/006.yaml
  text: You have sown much[a], but brought in little. You eat, but there is not enough to be satisfied; you drink, but there is not enough to be filled; you clothe yourselves, but no one is warm[c][b]; and the one who earns wages earns them for a bag with holes.
translation:
  language: zh_hans
  text: 你们多多撒种，收进来的却少[a]；你们吃，却吃不饱；喝，却喝不到醉[b]；穿上衣服，却没有人暖和[c]；挣工钱的，所得的工钱却像装进有破洞的钱袋里。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “收进来的却少”也可译作“收成却少”。希伯来语直译为“带进来的少”，指农作物收成微薄。
    reason: lexical_alternative
  - marker: b
    text: 希伯来语具体指喝酒却达不到醉或产生酒意的程度。
    reason: lexical_alternative
  - marker: c
    text: 直译为“却没有温暖给他”；原文用单数代词作泛指。
    reason: lexical_alternative
lexical_decisions:
- source_word: זְרַעְתֶּם הַרְבֵּה
  choice: 你们撒的种多
  rationale: 第二人称复数直接指向百姓；用“撒的种多”自然表达已经大量播种且后果延续至今。
- source_word: וְהָבֵא מְעָט
  choice: 收进来的却少
  rationale: 保留希伯来语“带进来、收进来”的农业惯用说法，同时借“却”显明投入与收成的反差。
- source_word: אָכוֹל וְאֵין לְשָׂבְעָה
  choice: 你们吃，却吃不饱
  rationale: 简洁再现持续进食却不能饱足的匮乏，符合本节连续、紧凑的责备语气。
- source_word: שָׁתוֹ וְאֵין לְשָׁכְרָה
  choice: 喝，却喝不到醉
  rationale: שכר 指向醉酒或酒意，而不仅是解渴；译文保留这一较强而略显反常的原文措辞，不将其改释为“喝不够”或“不能解渴”。
- source_word: לָבוֹשׁ וְאֵין לְחֹם לוֹ
  choice: 穿上衣服，却没有人暖和
  rationale: 将希伯来语单数代词理解为泛指，以现代汉语的“没有人”自然表达人人仍不得温暖。
- source_word: וְהַמִּשְׂתַּכֵּר מִשְׂתַּכֵּר
  choice: 挣工钱的，挣来的工钱
  rationale: 重复“挣”以保留原文同根词反复所形成的强调。
- source_word: אֶל צְרוֹר נָקוּב
  choice: 装进有破洞的钱袋
  rationale: 清楚保留工钱仿佛落入破漏袋中、无法积存的具体比喻。
theological_decisions:
- issue: “喝不到醉”是否应弱化为“喝不足”或“不能尽兴”
  choice: 保留“喝不到醉”
  alternative: 喝，却喝不够／喝，却不能尽兴
  rationale: 原词明确属于 שכר（醉、酒意）词族。这里描述各样供给均不能达到预期结果；保留原词的张力，不对醉酒作道德赞许，也不把具体词义泛化为普通口渴。
translation_notes:
  register: 采用现代、庄重而易懂的普通话，以分号保留原文一连串短句的节奏和累积效果。反复使用“却”凸显付出与结果之间的落差；避免古奥表达，也不消解“喝不到醉”这一真实的词义张力。
