base_translation:
  language: en
  yaml_path: translation/ot/haggai/001/001.yaml
  text: 'In the second year of King Darius[a], in the sixth month, on the first day of the month, the word of Yahweh came by the hand of Haggai the prophet to Zerubbabel son of Shealtiel, governor of Judah, and to Joshua son of Jehozadak, the high priest, saying:'
translation:
  language: zh_hans
  text: 大流士王第二年六月初一，耶和华的话借先知哈该的手[a]临到撒拉铁的儿子、犹大省长所罗巴伯，以及约萨答的儿子、大祭司约书亚，说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“借着先知哈该传达”。原文直译为“借先知哈该的手”。
    reason: 说明希伯来语中介习语的直译与较自然的功能性译法。
lexical_decisions:
- source_word: בִּשְׁנַת שְׁתַּיִם לְדָרְיָוֶשׁ הַמֶּלֶךְ
  choice: 大流士王第二年
  rationale: 按君王在位年纪年；采用现代汉语自然的纪年次序，同时保留原文的王号。
- source_word: בַּחֹדֶשׁ הַשִּׁשִּׁי בְּיוֹם אֶחָד לַחֹדֶשׁ
  choice: 六月初一
  rationale: 原文直指“第六个月、当月第一日”；“六月初一”是简洁自然的汉语日期表达，不擅自补入月份名称。
- source_word: הָיָה דְבַר יְהוָה
  choice: 耶和华的话……临到
  rationale: “临到”自然传达先知书中启示发生的惯用公式，也保留“耶和华的话”为句子主语。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的神圣名字译法，直接对应四字神名。
- source_word: בְּיַד חַגַּי הַנָּבִיא
  choice: 借先知哈该的手
  rationale: 保留原文“借……的手”这一中介表达及其具体意象；脚注说明更自然的功能性译法。
- source_word: פַּחַת יְהוּדָה
  choice: 犹大省长
  rationale: פֶּחָה指波斯时期的地方行政长官；“省长”在现代汉语中清楚简明。
- source_word: הַכֹּהֵן הַגָּדוֹל
  choice: 大祭司
  rationale: 这是该职衔在现代中文圣经语境中的标准、清楚译法。
- source_word: לֵאמֹר
  choice: 说
  rationale: 保留引出下文信息的希伯来语公式，并以冒号承接直接引语。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名；“耶和华”是现代简体中文圣经传统中最广为人知且具尊严的音译，不以通称“主”替代专名。
- issue: 先知传话中介语 בְּיַד
  choice: 借先知哈该的手
  alternative: 借着先知哈该
  rationale: 保留原文“手”的意象，呈现信息由耶和华发出、经先知传达的结构，同时不对其机制增加解释。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。日期按汉语习惯压缩为“六月初一”；人名使用中文圣经传统中通行的形式。保留“借……的手”这一原文意象，并用脚注辅助普通读者理解。
