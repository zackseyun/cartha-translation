source:
  edition: WLC
  text: וַ֠/יֹּאמֶר חַגַּ֞י מַלְאַ֧ךְ יְהוָ֛ה בְּ/מַלְאֲכ֥וּת יְהוָ֖ה לָ/עָ֣ם לֵ/אמֹ֑ר אֲנִ֥י אִתְּ/כֶ֖ם נְאֻם יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/haggai/001/013.yaml
  text: Then Haggai[a], the messenger of Yahweh, spoke to the people with Yahweh’s message, saying[b], “I am with you,” declares Yahweh.
translation:
  language: zh_hans
  text: 于是，雅威的使者[a]哈该奉雅威的差遣[b]对百姓说：“雅威宣告：‘我与你们同在。’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里的“使者”指哈该是雅威所差遣的先知，并不是说他是天使。
    reason: alternative_reading
  - marker: b
    text: 也可译作“传达雅威的信息”或“以雅威使者的身份”。希伯来语可指使者的职分、所受的使命或所传的信息。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 于是……说
  rationale: 以自然的现代汉语承接前文叙事，同时保留希伯来语叙事动词所表达的推进作用。
- source_word: מַלְאַךְ יְהוָה
  choice: 雅威的使者
  rationale: 此处“使者”与哈该同位，指他作为雅威所差遣的先知，并非天上的使者；译作“使者”既贴近词义，也避免误解为天使。
- source_word: בְּמַלְאֲכוּת יְהוָה
  choice: 奉雅威的差遣
  rationale: מַלְאֲכוּת 可表示使者的职分、受托的使命或所传的信息；正文采用“奉……的差遣”，自然地表达哈该受雅威委派而发言，并以脚注保留其他可能。
- source_word: יְהוָה
  choice: 雅威
  rationale: 采用神圣四字名的现代汉语音译，保留其作为以色列之神专名的性质，而不以称号替代。
- source_word: לָעָם
  choice: 对百姓
  rationale: 上下文所指是哈该面对的圣约群体；“百姓”在现代汉语圣经语体中自然且准确。
- source_word: לֵאמֹר
  choice: 说
  rationale: 该引语标记在汉语中不宜机械重复；由“对百姓说”自然引出直接引语，完整传达其功能。
- source_word: אֲנִי אִתְּכֶם
  choice: 我与你们同在
  rationale: 保留原文简洁直接的同在应许；“你们”明确反映第二人称复数。
- source_word: נְאֻם יְהוָה
  choice: 雅威宣告
  rationale: 以惯用的先知性宣告公式表达话语的神圣权威，并在汉语中将引述者置于引语之前，使句子清楚流畅。
theological_decisions:
- issue: מַלְאַךְ 与哈该的关系
  choice: 译为人的“使者”
  alternative: 译为“雅威的天使”
  rationale: 语法上“雅威的使者”与哈该同位，语境也明确是先知向百姓传话；“天使”会使读者误以为此处出现了另一个天上存在。
- issue: בְּמַלְאֲכוּת יְהוָה 的语义范围
  choice: 正文译为“奉雅威的差遣”
  alternative: “传达雅威的信息”或“以雅威使者的身份”
  rationale: 原词可涉及使者职分、使命或信息。正文选择最符合哈该受差遣发言这一语境的表达，脚注则保留真实的词义张力。
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文使用的是神的专名。音译“雅威”保留专名性质，也与通常重构的读音 Yahweh 对应，不以称号“主”取代。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“奉……的差遣”符合正式宣告语境；内外引号区分先知的引述框架与雅威的直接话语。
