base_translation:
  language: en
  yaml_path: translation/ot/haggai/002/011.yaml
  text: 'Thus says Yahweh of hosts: Ask the priests for a ruling[a], saying,'
translation:
  language: zh_hans
  text: 万军之耶和华如此说：“请你向祭司求问有关律例的裁断[a]，说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“律法”或“指教”。这里的“裁断”（希伯来语 torah）很可能指祭司就律例问题所作的裁断或教导，不一定专指作为成文经典的《妥拉》。
    reason: 说明torah的词义范围及本段祭司裁断的语境，同时避免将其限定为成文《妥拉》。
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: 如此说
  rationale: 保留先知传信公式的庄重语体，也符合现代汉语圣经文体。
- source_word: יְהוָה צְבָאוֹת
  choice: 万军之耶和华
  rationale: “万军”保留צְבָאוֹת所涵盖的众军意象，不将其限定为地上或天上的军队；“耶和华”直接呈现神名。
- source_word: שְׁאַל נָא
  choice: 你要……求问
  rationale: 表达命令兼求取答复之意；语气助词נָא不机械译作“请”，其缓和作用由自然句式承载。
- source_word: אֶת הַכֹּהֲנִים
  choice: 向祭司们
  rationale: 祭司是受询问并提供相关训诲或裁断的人；汉语用“向”自然表达求问对象。
- source_word: תּוֹרָה
  choice: 训诲
  rationale: 此处指祭司就礼仪律例问题所给的教导或裁断，不必专指成文的《妥拉》；“训诲”保留其教导性，并以脚注说明语境中的司法功能。
- source_word: לֵאמֹר
  choice: 说
  rationale: 引出下一节具体问题，保留希伯来语引语公式。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 中文普通读者最熟悉“耶和华”这一直接神名形式；不以“主”替代神名，也不据此加入宗派性解释。
- issue: תּוֹרָה在本节的含义
  choice: 训诲
  alternative: 律法；裁断
  rationale: 语境显示这是祭司针对礼仪律例问题所作的指教或判定。“训诲”保留词义宽度，避免把它仅限于一部成文经典或仅限于司法裁决。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“万军之耶和华如此说”保留先知宣告公式；正文用“训诲”避免过度释义，脚注补充其祭司裁断的语境义。
