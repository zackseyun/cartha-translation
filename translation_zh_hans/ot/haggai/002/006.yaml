  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כִּ֣י כֹ֤ה אָמַר֙ יְהוָ֣ה צְבָא֔וֹת ע֥וֹד אַחַ֖ת מְעַ֣ט הִ֑יא וַ/אֲנִ֗י מַרְעִישׁ֙ אֶת הַ/שָּׁמַ֣יִם וְ/אֶת הָ/אָ֔רֶץ וְ/אֶת הַ/יָּ֖ם וְ/אֶת הֶ/חָרָבָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/haggai/002/006.yaml
  text: 'For this is what Yahweh of Armies says: Yet once more[a], in a little while[b], I will shake the heavens and the earth and the sea and the dry land.'
translation:
  language: zh_hans
  text: 因为万军之耶和华如此说：“再过不多时，我还要再一次[a]震动天、地、海和旱地。 ”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文语序凝缩，直译近似“还有一次，时候不多”；也可译作“再一次，过不多时”。
    reason: 保留 עוֹד אַחַת מְעַט הִיא 在“再一次”与“不多时”之间略显含混的句法关系。
lexical_decisions:
- source_word: יְהוָה צְבָאוֹת
  choice: 万军之耶和华
  rationale: “耶和华”在现代中文圣经语境中是该神名最通行、最易辨认的音译；“万军之”保留 צְבָאוֹת 所表达的统领众军之称号，并采用自然庄重的中文形式。
- source_word: כִּי כֹה אָמַר
  choice: 因为……如此说
  rationale: 保留 כִּי 的承接/说明作用及先知信息公式的庄重语气，同时符合现代中文表达。
- source_word: עוֹד אַחַת מְעַט הִיא
  choice: 再过不多时，我还要再一次
  rationale: 原文高度凝缩，兼有“时间不久”和“再一次”两个要素；中文调整语序，使其自然可懂，又不把措辞与后世经文的解释预先等同。
- source_word: מַרְעִישׁ
  choice: 震动
  rationale: Hifil 分词在此配合独立代词，具有即将施行之行动的语境功能；“要……震动”自然表达将来意义，并保留使宇宙震荡的力度。
- source_word: הַשָּׁמַיִם וְאֶת הָאָרֶץ
  choice: 天、地
  rationale: 这是自然且庄重的中文宇宙性配对；虽未形式保留希伯来语“天”的复数形态，却准确传达其整体范围。
- source_word: הַיָּם וְאֶת הֶחָרָבָה
  choice: 海和旱地
  rationale: הֶחָרָבָה 在此与“海”相对，意为无水的陆地；“旱地”比“荒野”更准确，也保留创造叙事式的海陆对照。
theological_decisions:
- issue: 神名与称号 יְהוָה צְבָאוֹת 的译法
  choice: 万军之耶和华
  alternative: 万军之雅威；万军之主
  rationale: 以“耶和华”直接呈现专名而非仅用“主”替代，并用中文传统而透明的“万军之”表达 צְבָאוֹת。此选择不额外限定这些“军”仅指天使、星辰或以色列军队。
- issue: עוֹד אַחַת מְעַט הִיא 的时间与次数关系
  choice: 再过不多时，我还要再一次
  alternative: 还有一次，时候不多了；再一次，过不多时
  rationale: 原文语法凝缩，既可较形式化地保留“还有一次，它是少许”，也可按语义整理为短期之后再度行动。本译文同时保留临近性和重复性，不借《希伯来书》12章消除本节自身的张力。
- issue: מַרְעִישׁ 的时态/体貌
  choice: 我还要……震动
  alternative: 我正在震动；我即将震动
  rationale: 原文为 Hifil 分词，可带正在发生或迫近将来的色彩；本段预告语境支持中文将来式“要”，但不把行动的具体时间表述得过度精确。
translation_notes:
  register: 采用现代、庄重而易懂的先知宣告语体。“如此说”保留使者公式；“天、地、海和旱地”维持原文四重宇宙范围。正文中的脚注标记 [a] 紧随“再一次”。
