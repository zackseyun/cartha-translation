base_translation:
  language: en
  yaml_path: translation/ot/haggai/002/016.yaml
  text: When one came to a heap of twenty measures[a], there were only ten; when one came to the wine vat to draw fifty measures, there were only twenty.
translation:
  language: zh_hans
  text: 当有人来到谷堆，想得到二十份时，结果只有十份；有人来到榨酒池，要舀取五十普拉[a]时，结果只有二十普拉。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “普拉”是容量单位或容器名称，确切大小不详。
    reason: 原文פּוּרָה的具体所指和准确容量无法确定，需保留其词汇上的不确定性。
lexical_decisions:
- source_word: מִהְיוֹתָם
  choice: 那时
  rationale: 该结构承接上文所指的先前时期，并引出当时反复发生的歉收情形；译作“那时”简洁自然，也不增添原文没有明说的问句。
- source_word: בָּא
  choice: 有人来到
  rationale: 原文用单数形式泛指任何遇到这种情形的人；“有人”符合现代汉语的泛指表达。
- source_word: עֲרֵמַת עֶשְׂרִים
  choice: 一堆本有二十份的谷物
  rationale: עֲרֵמָה指收获物堆；原文没有说明计量单位，因此以“份”表达隐含的量，不虚构具体度量名称。“本有”体现名义数量与实际所得之间的落差。
- source_word: וְהָיְתָה עֲשָׂרָה
  choice: 结果只有十份
  rationale: “结果”自然呈现实际所得，“只有”传达原文语境中明显的短缺。
- source_word: הַיֶּקֶב
  choice: 榨酒池
  rationale: 该词指榨酒设施中承接或存放汁液的池；“榨酒池”比泛称“池子”明确，也适合普通读者。
- source_word: לַחְשֹׂף
  choice: 要舀取
  rationale: 此处指从池中取出液体；“舀取”保留具体动作，又符合汉语习惯。
- source_word: חֲמִשִּׁים פּוּרָה
  choice: 五十普拉[a]
  rationale: פּוּרָה的准确容量及其究竟偏指量器还是容量单位并不确定，故采用音译并加注，避免用现代单位制造虚假精确性。
- source_word: וְהָיְתָה עֶשְׂרִים
  choice: 结果只有二十普拉
  rationale: 延续前句的对照句式，清楚表达预期五十而实际仅得二十的严重短缺。
theological_decisions: []
