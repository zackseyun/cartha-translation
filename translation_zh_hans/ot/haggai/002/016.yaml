  to: 当有人来到谷堆，想得到二十份时，结果只有十份；有人来到榨酒池，要舀取五十普拉[a]时，结果只有二十普拉。
  rationale: 修订以“想得到二十份”表达数量是预期所得而非谷堆原有存量，并以“当……时”自然涵盖原文的时间/情境引介。保留平行句式、短缺的结果，以及“普拉”在正文和脚注中的词汇不确定性。
