  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יְהִ֨י דְבַר יְהוָ֤ה שֵׁנִית֙ אֶל חַגַּ֔י בְּ/עֶשְׂרִ֧ים וְ/אַרְבָּעָ֛ה לַ/חֹ֖דֶשׁ לֵ/אמֹֽר־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/haggai/002/020.yaml
  text: And the word of Yahweh came a second time to Haggai on the twenty-fourth day of the month[a], saying,
translation:
  language: zh_hans
  text: 本月二十四日，雅威[a]的话第二次临到哈该，说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “雅威”是希伯来文上帝名字 יהוה 的拟音，传统上也译作“耶和华”。
    reason: 说明神名的原文形式及常见传统译法。
lexical_decisions:
- source_word: וַיְהִי דְבַר יְהוָה
  choice: 雅威的话……临到
  rationale: 这是先知书常见的启示公式。用“临到”自然表达 וַיְהִי 在该公式中的作用，同时以“话”保留 דָבָר 的基本词义。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按四字神名 יהוה 的通常学术拟音处理，保留其作为上帝名字的性质，不以称号替代。
- source_word: שֵׁנִית
  choice: 第二次
  rationale: 直接表达此次启示是第二次，较“再次”更明确地保留原文的次序含义。
- source_word: אֶל חַגַּי
  choice: 临到哈该
  rationale: אֶל 在传达话语的公式中指向领受者；现代汉语以“临到哈该”表达自然，也保持先知书的庄重语体。
- source_word: בְּעֶשְׂרִים וְאַרְבָּעָה לַחֹדֶשׁ
  choice: 本月二十四日
  rationale: 原文未重复月份名称，只说“这个月的二十四日”；“本月二十四日”简洁、自然，并保留其回指语境的作用。
- source_word: לֵאמֹר
  choice: 说：
  rationale: 该不定式引出下一节的直接话语；用冒号符合现代汉语标点习惯。
theological_decisions:
- issue: 四字神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用上帝的专名 יהוה。“雅威”较接近通常重建的读音，并避免把专名改成“主”这一称号；脚注同时说明传统译名，以便普通读者识别。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。句首先交代日期，再呈现启示公式，使汉语行文流畅；保留“第二次”和句末“说：”，以衔接下一节。
