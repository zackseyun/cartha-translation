base_translation:
  language: en
  yaml_path: translation/ot/haggai/002/017.yaml
  text: I struck you with blight and mildew and hail[a], all the work of your hands; yet you did not turn to me, declares Yahweh.
translation:
  language: zh_hans
  text: “我以枯焦、霉烂和冰雹击打你们，击打你们手所做的一切；你们却没有归向我[a]。”这是耶和华的宣告。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文较直译为“你们却不向着我”或“你们中没有一个向着我”；结合上下文，意思是他们没有归向耶和华。
    reason: 保留希伯来文省略结构的字面可能，同时说明正文所采用的语境性理解。
lexical_decisions:
- source_word: הִכֵּיתִי
  choice: 我……击打了
  rationale: נכה表示击打、降击；采用直接而庄重的表达，保留耶和华主动施行管教的语气。
- source_word: בַּשִּׁדָּפוֹן
  choice: 用枯萎病
  rationale: שִׁדָּפוֹן指使农作物枯焦、枯萎的灾害；“枯萎病”在现代汉语中清楚体现农业语境。
- source_word: וּבַיֵּרָקוֹן
  choice: 霉病
  rationale: יֵרָקוֹן指作物发黄、衰败一类的病害，传统上也常译作霉烂；“霉病”简明自然，并与前项有所区分。
- source_word: וּבַבָּרָד
  choice: 和冰雹
  rationale: בָּרָד明确指冰雹。
- source_word: אֵת כָּל מַעֲשֵׂה יְדֵיכֶם
  choice: 击打了你们双手所做的一切
  rationale: 保留“手所做的”这一希伯来语意象，同时用重复“击打了”明确其作为第二个受词，避免汉语句法含混。
- source_word: וְאֵין אֶתְכֶם אֵלַי
  choice: 你们却没有归向我
  rationale: 原文是没有明说动词的省略结构，字面近于“你们不向着我”；按先知责备与管教的语境，“没有归向我”自然表达其核心意思，同时以脚注保留字面歧义。
- source_word: נְאֻם יְהוָה
  choice: 这是耶和华的宣告
  rationale: נְאֻם是庄重的先知宣告公式；此译法自然、正式，并保留其权威语气。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经语境中对四字神名最通行、最易识别的音译，不以普通称号取代专名。
theological_decisions:
- issue: וְאֵין אֶתְכֶם אֵלַי这一省略句是否明确表示悔改归回
  choice: 正文译为“你们却没有归向我”，表达受管教后仍未回转回应神。
  alternative: 较字面的译法是“你们却不向着我”或“你们却不在我这里”。
  rationale: 上下文强调神借农业灾害管教百姓，而百姓没有作出应有回应；“归向”最能使现代读者理解这层关系。不过，希伯来文没有明写“归向”的动词，因此用脚注保留其形式上的开放性，不把解释冒充为唯一可能的字面意义。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。以“枯萎病、霉病和冰雹”呈现农业灾害；重复“击打了”以清楚反映原文的两个受词。引语后用“这是耶和华的宣告”呈现先知公式。
