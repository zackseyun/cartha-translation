base_translation:
  language: en
  yaml_path: translation/ot/haggai/002/002.yaml
  text: Speak now to Zerubbabel son of Shealtiel[a], governor of Judah, and to Joshua son of Jehozadak, the high priest, and to the remnant of the people, saying[b],
translation:
  language: zh_hans
  text: “现在你要对犹大省长撒拉铁的儿子所罗巴伯、约撒答的儿子大祭司约书亚，以及余下的百姓[a]说[b]：”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“百姓中的余民”。希伯来语这个词既可指余下的人，也可能带有先知书中“余民”的意味。
    reason: lexical_alternative
  - marker: b
    text: “说”引出下一节的信息。
    reason: discourse_clarification
lexical_decisions:
- source_word: אֱמָר נָא
  choice: 现在你要……说
  rationale: אֱמָר是命令式；נָא在此表示当下的催促或紧迫感，而非礼貌性的“请”。中文用“现在你要”自然地传达先知话语中的命令语气。
- source_word: זְרֻבָּבֶל בֶּן שַׁלְתִּיאֵל
  choice: 撒拉铁的儿子所罗巴伯
  rationale: 按现代中文圣经人名的通行形式音译，并保留希伯来文“某人的儿子某某”的身份结构。
- source_word: פַּחַת יְהוּדָה
  choice: 犹大省长
  rationale: פֶּחָה指波斯时期治理一省的行政长官；“省长”在现代中文中清楚、简洁，也符合历史背景。
- source_word: יְהוֹשֻׁעַ בֶּן יְהוֹצָדָק
  choice: 约萨答的儿子……约书亚
  rationale: 采用现代中文圣经中较通行的人名形式；原文此处是较完整的יְהוֹשֻׁעַ，故译“约书亚”。
- source_word: הַכֹּהֵן הַגָּדוֹל
  choice: 大祭司
  rationale: 这是该职分在现代中文中的固定而准确的表达。
- source_word: שְׁאֵרִית הָעָם
  choice: 余下的百姓
  rationale: שְׁאֵרִית可指幸存或留下的群体，并可带有先知文学中的“余民”意味。主文采用自然而不预先限定神学含义的“余下的百姓”，脚注保留“余民”的可能表达。
- source_word: לֵאמֹר
  choice: 说：
  rationale: 该不定式引出下一节的话语内容；中文以“说：”及冒号自然连接后文。
theological_decisions:
- issue: שְׁאֵרִית是否应明确译作带有神学色彩的“余民”
  choice: 主文译作“余下的百姓”，脚注注明也可译“百姓中的余民”
  alternative: 百姓中的余民
  rationale: 本处既可能只是指归回后留下的群体，也可能唤起先知传统中的“余民”主题。主文避免将后者定为唯一解释，脚注则保存这一真实语义张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。人名和职衔使用中文圣经读者较熟悉的形式；句法略作汉语化处理，同时保留原文依次列举受话者以及引出下文直接引语的结构。
