id: HAG.2.1
reference: Haggai 2:1
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: בַּ/שְּׁבִיעִ֕י בְּ/עֶשְׂרִ֥ים וְ/אֶחָ֖ד לַ/חֹ֑דֶשׁ הָיָה֙ דְּבַר יְהוָ֔ה בְּ/יַד חַגַּ֥י הַ/נָּבִ֖יא לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/haggai/002/001.yaml
  text: On the twenty-first day of the seventh month[a], the word of Yahweh came by the hand of Haggai the prophet, saying,
translation:
  language: zh_hans
  text: 七月二十一日，雅威的话借着先知哈该[a]传来，说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语直译为“借先知哈该的手”，意思是“通过先知哈该”或“由先知哈该传达”。
    reason: 说明希伯来语媒介用语בְּיַד的字面形式及含义；脚注标记置于相应短语之后。
lexical_decisions:
- source_word: בַּשְּׁבִיעִי בְּעֶשְׂרִים וְאֶחָד לַחֹדֶשׁ
  choice: 七月二十一日
  rationale: 这是希伯来语的日期表达；“日”虽为原文省略的成分，却由日期结构明确蕴含，现代汉语需补出。
- source_word: הָיָה דְּבַר יְהוָה
  choice: 雅威的话……传来
  rationale: 这是先知书常见的启示公式。此处的הָיָה不是单纯表示“是”，而是表达神的话临到并被传达这一事件；“传来”与后面的媒介短语自然衔接。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按四字神名的通常学术拟音译出专名，不以“主”这一称号替代。
- source_word: בְּיַד חַגַּי הַנָּבִיא
  choice: 借着先知哈该
  rationale: בְּיַד字面为“借……的手”，在这里表示媒介或代理；译作“借着”符合现代汉语，同时保留哈该作为传言媒介的含义。
- source_word: לֵאמֹר
  choice: 说：
  rationale: 该不定式引出下文的直接话语，汉语用“说：”简洁自然。
theological_decisions:
- issue: 四字神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文使用神的专名而非称号。采用较接近通常学术重构读音的“雅威”，既保留专名性质，也避免以称号代替；“耶和华”是历史悠久的传统形式。
- issue: 神的话与哈该之间的关系
  choice: “雅威的话借着先知哈该传来”
  alternative: “雅威的话临到先知哈该”
  rationale: 原文是בְּיַד（“借……的手”），侧重哈该作为传达神言的媒介，而不是常见的אֶל（“临到某人”）结构；因此不将其改写成话语仅仅临到哈该。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。日期按汉语习惯表达；保留先知启示公式的正式语气，并以冒号引出下一节的神谕。
