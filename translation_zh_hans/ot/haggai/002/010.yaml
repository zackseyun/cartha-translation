  yaml_path: translation/ot/haggai/002/010.yaml
  text: On the twenty-fourth day of the ninth month, in the second year of Darius, the word of Yahweh came to Haggai the prophet, saying,
translation:
  language: zh_hans
  text: 大流士第二年九月二十四日，雅威的话临到哈该先知，说：
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּ/עֶשְׂרִים וְ/אַרְבָּעָה
  choice: 二十四日
  rationale: 希伯来语按字面为“在二十又四”，用于日期；现代汉语自然表达为“二十四日”。
- source_word: לַ/תְּשִׁיעִי
  choice: 九月
  rationale: 序数“第九”在日期公式中指第九个月；汉语可简洁译为“九月”。
- source_word: בִּ/שְׁנַת שְׁתַּיִם לְ/דָרְיָוֶשׁ
  choice: 大流士第二年
  rationale: 这是君王纪年公式；采用现代汉语惯用次序，准确表达“大流士在位第二年”。
- source_word: הָיָה דְּבַר יְהוָה
  choice: 耶和华的话临到
  rationale: 这是常见的先知书启示公式；“临到”既保留原文表达，又符合庄重、通行的现代汉语圣经语体。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 使用现代汉语中对四字神名最通行且可辨识的音译，不以称号“主”代替专名。
- source_word: אֶל חַגַּי הַ/נָּבִיא
  choice: 临到哈该先知
  rationale: אֶל 标明神言的接受者；“哈该先知”自然保留人名及其同位称谓。
- source_word: לֵ/אמֹר
  choice: 说：
  rationale: 该不定式引出下一节的直接话语；汉语以“说：”自然承接后文。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。中文采用广为人知的专名“耶和华”，保留其作为名字而非称号的性质；“雅威”是较接近学术重构发音的可行替代。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话书面语。日期依汉语习惯重排为“大流士第二年九月二十四日”；保留先知书公式“耶和华的话临到……”，并以冒号表明话语延续至下一节。
