base_translation:
  language: en
  yaml_path: translation/ot/haggai/002/014.yaml
  text: Then Haggai answered and said[a], “So is this people, and so is this nation before me,” declares Yahweh, “and so is every work of their hands[b]; and what they offer there is unclean.”
translation:
  language: zh_hans
  text: 于是，哈该回答说：“在我面前，这百姓是这样；这个民族也是这样——这是雅威的宣告——他们手所做的一切也是这样；他们在那里所献的，是不洁净的。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כֵּן
  choice: 也是这样
  rationale: 承接2:11–13祭司问答中的类比，并保留原文三次重复所形成的审判语气；现代汉语中“也是这样”比逐字式“如此是”自然。
- source_word: הָעָם הַזֶּה
  choice: 这百姓
  rationale: 保留单数集合名词和略带疏离、责备意味的指称；“百姓”也符合先知话语的庄重语域。
- source_word: הַגּוֹי הַזֶּה
  choice: 这国民
  rationale: גּוֹי在此与“这百姓”平行，指归回后的群体，并非特指外邦人；“国民”保留其群体身份，又避免译成“外邦”。
- source_word: לְפָנַי
  choice: 在我面前
  rationale: 保留人在上帝临在与鉴察之下的空间性及审判意味。
- source_word: נְאֻם יְהוָה
  choice: 雅威宣告说
  rationale: 以专名“雅威”呈现四字神名，并用“宣告说”传达先知公式的郑重权威。
- source_word: כָּל מַעֲשֵׂה יְדֵיהֶם
  choice: 他们手中所做的一切
  rationale: 保留“手所做的”这一希伯来语意象，同时调整为自然的现代汉语语序。
- source_word: וַאֲשֶׁר יַקְרִיבוּ
  choice: 他们……献上的
  rationale: קרב的使役式在祭祀语境中指呈献祭物；“献上”简洁清楚，又不额外限定祭物种类。
- source_word: שָׁם
  choice: 在那里
  rationale: 保留原文地点副词的指示性，不擅自具体化为祭坛或圣殿。
- source_word: טָמֵא הוּא
  choice: 都是不洁净的
  rationale: 沿用前文礼仪洁净范畴。“不洁净”准确表达状态，且不把它改释为一般道德意义上的污秽。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”较接近学界通行的复原读音，并明确呈现其为专名。
- issue: “这国民”的所指
  choice: 指犹大归回后的盟约群体
  alternative: 指周围的外邦民族
  rationale: 上下文中哈该正在对当时的群体讲话，并把祭司关于不洁净的判定应用于他们及其献物；因此不应把 גּוֹי 译成带有外邦限定的词。
- issue: 不洁净的范围
  choice: 保留对百姓、其工作及所献之物的递进判定
  alternative: 只将“不洁净”明确限定于祭物
  rationale: 原文反复使用 כֵּן，将前文的不洁类比依次用于群体和他们手中的工作，末句又明确说所献的是不洁净的；译文保留这种结构，不替文本消解其神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“于是，哈该回答说”保留叙事公式；破折号标出插入的神谕公式，使三个“也是这样”的递进关系清楚。原文没有必须另列的文本异读或解释性脚注，因此正文不设脚注标记。
