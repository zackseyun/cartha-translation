id: HAG.2.4
reference: Haggai 2:4
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/עַתָּ֣ה חֲזַ֣ק זְרֻבָּבֶ֣ל נְאֻם יְהוָ֡ה וַ/חֲזַ֣ק יְהוֹשֻׁ֣עַ בֶּן יְהוֹצָדָק֩ הַ/כֹּהֵ֨ן הַ/גָּד֜וֹל וַ/חֲזַ֨ק כָּל עַ֥ם הָ/אָ֛רֶץ נְאֻם יְהוָ֖ה וַֽ/עֲשׂ֑וּ כִּֽי אֲנִ֣י אִתְּ/כֶ֔ם נְאֻ֖ם יְהוָ֥ה צְבָאֽוֹת׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/haggai/002/004.yaml
  text: But now[a], be strong, Zerubbabel, declares Yahweh, and be strong, Joshua son of Jehozadak, the high priest, and be strong, all the people of the land, declares Yahweh, and work, for I am with you, declares Yahweh of Armies.
translation:
  language: zh_hans
  text: “但现在，所罗巴伯，你要刚强！”这是耶和华的宣告。“约萨答的儿子约书亚，就是大祭司，你也要刚强！这地所有的百姓，你们都要刚强！”这是耶和华的宣告。“你们要做工，因为我与你们同在。”这是万军之耶和华[a]的宣告。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“统领万军的耶和华”。
    reason: 保留该神圣称号较解释性的现代译法；正文采用中文圣经传统中通行且直接对应原文的表达。
lexical_decisions:
- source_word: וְעַתָּה
  choice: 但现在
  rationale: 承接上文百姓因眼前圣殿寒酸而灰心的处境，并转入当下的劝勉；“但现在”自然表达语境中的转折。
- source_word: חֲזַק / וַחֲזַק / וַחֲזַק
  choice: 你要刚强 / 你也要刚强 / 你们都要刚强
  rationale: 保留三次命令的反复及其修辞力量；按三组受话者分别使用单数、单数和复数形式。
- source_word: נְאֻם יְהוָה
  choice: 耶和华宣告说 / 这是……耶和华的宣告
  rationale: 这是庄重的先知宣告公式。根据中文引语位置调整语序，同时保留原文三次出现的公式。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的神圣名字译法，并将其作为专名而非普通称号处理。
- source_word: בֶּן יְהוֹצָדָק
  choice: 约萨答的儿子
  rationale: 此处是直接的父子身份说明，按字面自然表达。
- source_word: הַכֹּהֵן הַגָּדוֹל
  choice: 大祭司
  rationale: 这是该职分准确且通行的现代中文名称。
- source_word: כָּל עַם הָאָרֶץ
  choice: 这地所有的百姓
  rationale: 在归回后的历史语境中，הָאָרֶץ 指本地而非整个世界；“这地所有的百姓”既保留地域表达，也避免误读为全人类。
- source_word: וַעֲשׂוּ
  choice: 你们要做工
  rationale: עָשָׂה 本可泛指“做、行”，但在眼前重建圣殿的语境中，“做工”自然明确，同时没有增添原文未明说的具体工序。
- source_word: כִּי אֲנִי אִתְּכֶם
  choice: 因为我与你们同在
  rationale: 直接保留命令与神同在之应许之间的因果关系。
- source_word: יְהוָה צְבָאוֹת
  choice: 统领万军的耶和华
  rationale: צְבָאוֹת 表示众军、万军；此译法使称号所表达的统御权对现代读者更透明，又不限定这些军队仅为天军或人间军队。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用四字神名。正文以中文读者最熟悉、具有专名功能的“耶和华”表达，不以“主”替代，从而保留神的立约之名。
- issue: 称号 יְהוָה צְבָאוֹת 的含义
  choice: 统领万军的耶和华
  alternative: 万军之耶和华
  rationale: 正文明确表达该称号中神对众军的统御，同时不把“万军”专门解释为天使军队；传统译法列于脚注。
- issue: וַעֲשׂוּ 所指的行动
  choice: 你们要做工
  alternative: 你们要行动
  rationale: 上下文所指是重建圣殿，故“做工”比泛泛的“行动”更贴合；但没有扩写成“重建圣殿”，以保留动词本身较宽的语义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话书面语。通过三次“刚强”和三次宣告公式保留原文的反复与先知语气；引语分段使多重受话对象在中文中清晰可读。
