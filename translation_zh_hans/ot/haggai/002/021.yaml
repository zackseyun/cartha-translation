base_translation:
  language: en
  yaml_path: translation/ot/haggai/002/021.yaml
  text: 'Speak to Zerubbabel[a], governor of Judah, saying: I am shaking the heavens and the earth.'
translation:
  language: zh_hans
  text: 你要对犹大省长所罗巴伯说：我必震动天地。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我正在震动天地”或“我就要震动天地。”希伯来语分词在这里可指正在进行、即将发生或将来的行动。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱמֹר
  choice: 你要……说
  rationale: 这是命令式；用现代汉语的“你要……说”自然传达先知所领受的命令。
- source_word: זְרֻבָּבֶל
  choice: 所罗巴伯
  rationale: 采用该人名通行的中文音译。
- source_word: פַּחַת יְהוּדָה
  choice: 犹大省长
  rationale: פֶּחָה指帝国行政体系下的地方长官；“省长”简明且符合其历史职分。
- source_word: לֵאמֹר
  choice: 说
  rationale: 这是引出直接引语的惯用形式；中文在“你要对……说”中已自然体现，无须另译为“说道”。
- source_word: אֲנִי
  choice: 我
  rationale: 保留显式第一人称，体现神宣告时的强调。
- source_word: מַרְעִישׁ
  choice: 必震动
  rationale: 使役分词在先知话语中可表达正在发生、即将发生或确定的将来行动；“必震动”自然表达确定的预告，同时以脚注保留时态层面的歧义。
- source_word: הַשָּׁמַיִם וְאֶת הָאָרֶץ
  choice: 天地
  rationale: “天地”是现代汉语中自然、庄重的整体表达，保留原文涵盖天与地的宇宙性范围。
theological_decisions:
- issue: 震动意象的范围
  choice: 保留“天地”的宇宙性表述
  alternative: 将其限定为列国之间的政治动荡
  rationale: 原文直接说“天和地”；后文虽将此意象应用于列国和政权，但本节不应预先缩窄其范围。
- issue: מַרְעִישׁ的时间指向
  choice: 正文译为确定将来的“必震动”，并用脚注保留进行或临近将来的可能
  alternative: “正在震动”或“就要震动”
  rationale: 希伯来语分词本身容许多种时间理解；上下文是预告性的神谕，中文正文用“必”较自然，但不把另一种理解排除。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“犹大省长”交代历史行政职分；“天地”简洁保留宇宙性意象。
