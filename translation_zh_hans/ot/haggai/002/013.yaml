source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר חַגַּ֔י אִם יִגַּ֧ע טְמֵא נֶ֛פֶשׁ בְּ/כָל אֵ֖לֶּה הֲ/יִטְמָ֑א וַ/יַּעֲנ֧וּ הַ/כֹּהֲנִ֛ים וַ/יֹּאמְר֖וּ יִטְמָֽא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/haggai/002/013.yaml
  text: Then Haggai said[a], “If one who is unclean by contact with a dead body touches any of these, does it become unclean?” And the priests answered and said, “It becomes unclean.”
translation:
  language: zh_hans
  text: 哈该又说：“如果一个因接触死尸而不洁净的人[a]碰到这些东西中的任何一样，那东西会变得不洁净吗？”祭司回答说：“会变得不洁净。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译近于“因人（或生命）而不洁净”，是指因接触死人或死尸而处于礼仪上的不洁净。
    reason: 说明希伯来惯用语的字面形式及其在礼仪洁净语境中的含义。
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 又说
  rationale: 承接上一节哈该的提问，既体现叙事推进，也符合现代汉语的自然表达。
- source_word: חַגַּי
  choice: 哈该
  rationale: 采用现代中文圣经中通行的人名音译。
- source_word: אִם
  choice: 如果
  rationale: 直接表达哈该向祭司提出的条件性案例。
- source_word: יִגַּע
  choice: 碰到
  rationale: 准确表达实际接触；在礼仪洁净的语境中自然清楚。
- source_word: טְמֵא נֶפֶשׁ
  choice: 一个因接触死尸而不洁净的人
  rationale: 这是礼仪条例中的惯用表达，指因死人或死尸而沾染不洁净的人；功能性翻译可避免把 נֶפֶשׁ 误解为抽象的“灵魂”。
- source_word: בְּכָל אֵלֶּה
  choice: 这些东西中的任何一样
  rationale: 回指上一节所列之物，并在条件问句中体现逐一而言的含义。
- source_word: הֲיִטְמָא
  choice: 那东西会变得不洁净吗
  rationale: 明确被触碰之物是问句的对象，并保留不洁净状态经接触而产生的动态含义。
- source_word: וַיַּעֲנוּ הַכֹּהֲנִים וַיֹּאמְרוּ
  choice: 祭司回答说
  rationale: 忠实涵盖“回答”和“说”两个动词，同时避免现代汉语中生硬的重复。
- source_word: יִטְמָא
  choice: 会变得不洁净
  rationale: 与问句用语呼应，保留祭司对不洁净可经接触传递这一礼仪判定。
theological_decisions:
- issue: 不洁净语言的性质
  choice: 译为因接触死尸而有的礼仪性不洁净
  alternative: 较字面地译作“因人／生命而不洁净”或将其理解为道德污秽
  rationale: 本节援引的是律法中的祭司洁净条例；טְמֵא נֶפֶשׁ 在此特指与死人相关的不洁净，并非在判断当事人的道德品格。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“不洁净”保留本段祭司礼仪术语的色彩；“碰到”与“会变得”使问答清楚自然。脚注紧随相关惯用语，而非置于“说”之后，以便读者准确对应。
