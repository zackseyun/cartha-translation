base_translation:
  language: en
  yaml_path: translation/ot/haggai/002/015.yaml
  text: 'And now[a], please set your heart on this from today onward: before one stone was placed upon another in the temple of Yahweh,'
translation:
  language: zh_hans
  text: 现在，请你们从今日起留心思量[a]：在耶和华的殿中，一块石头还没有垒在另一块石头上以前，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “留心思量”直译为“把你们的心放在……上”。“从今日起”也可译为“从这日起往后”；它与下文“……以前”并置，原文的时间关系较为紧凑。
    reason: 说明“把心放在”这一希伯来习语，并保留“从这日起往上/往后”与后续过去时间子句之间的句法张力，不在正文中加入解释性内容。
lexical_decisions:
- source_word: וְעַתָּה
  choice: 现在
  rationale: 兼顾连接语气和当前时点；现代汉语中不必机械译出连接词“和”。
- source_word: שִׂימוּ נָא לְבַבְכֶם
  choice: 请你们留心思想
  rationale: 此短语直译为“请把你们的心放在……上”，是要求人认真注意、反思的习语。“留心思想”既保留“心”的意味，也自然传达其功能；“请”对应恳请语气词 נָא。
- source_word: מִן הַיּוֹם הַזֶּה וָמָעְלָה
  choice: 从今天起，回想
  rationale: 该时间表达本身可理解为“从今天起/从这日起往前”，而下句 מִטֶּרֶם 引向建殿以前的时期。正文用“从今天起，回想”使现代汉语关系清楚，同时由脚注说明原文表达的方向性张力。
- source_word: מִטֶּרֶם
  choice: 以前
  rationale: 表示某事件发生之前；与后面的不定式结构自然组成“还没有……以前”。
- source_word: שׂוּם אֶבֶן אֶל אֶבֶן
  choice: 还没有一块石头叠在另一块石头上
  rationale: 保留“石头与石头”的具体建造图像，并用被动状态式汉语自然表达尚未砌建的情形。
- source_word: בְּהֵיכַל
  choice: 在……的殿里
  rationale: 此处 הֵיכָל 指耶和华的圣殿建筑，而非王宫；译作“殿”符合中文圣经语域。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代简体中文读者最熟悉的专名形式“耶和华”，明确保留四字神名的专名功能，而不以“主”这一称号代替。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 二者都旨在呈现四字神名。正文采用现代中文圣经传统中通行且普通读者容易辨认的“耶和华”，不以称号“主”替代专名。
- issue: 时间短语与“以前”的关系
  choice: 从今天起，回想……以前的情形
  alternative: 从今天起往后：在……以前
  rationale: 原文先说“从今天起/从这日起往前”，随即以“在……以前”指定反思的时期。正文呈现从当前时点回顾建殿前境况的语境意义，但以脚注保留该时间短语可作“从今天起往后”理解的可能，避免把语义张力完全隐藏。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“留心思想”比直译“把心放在”更易懂，同时借脚注保留原文意象。句末用逗号，因为本节的时间背景在下一节继续展开。
