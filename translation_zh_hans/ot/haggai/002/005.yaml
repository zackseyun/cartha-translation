  text: אֶֽת הַ/דָּבָ֞ר אֲשֶׁר כָּרַ֤תִּי אִתְּ/כֶם֙ בְּ/צֵאתְ/כֶ֣ם מִ/מִּצְרַ֔יִם וְ/רוּחִ֖/י עֹמֶ֣דֶת בְּ/תוֹכְ/כֶ֑ם אַל תִּירָֽאוּ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/haggai/002/005.yaml
  text: As for the promise that I made with you when you came out of Egypt[a], and my Spirit is standing in your midst[b]; do not fear.
translation:
  language: zh_hans
  text: 至于我在你们出埃及时与你们所立的约言[a]，我的灵仍在你们中间[b]；不要惧怕。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “约言”原文是“话”，而“立”所对应的动词字面意思是“切”；这种说法带有立约的意味。
    reason: lexical_alternative
  - marker: b
    text: 或译：“我的灵正立在你们中间。”这里的动词也可表达持续留在。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶת הַדָּבָר
  choice: 至于……约言
  rationale: 句首的宾格标记加“话／事情”在此承接上文，结构有所省略。“至于”保留其话题功能；结合后面的כרת，“约言”既保留“话”的词义，也传达立约语境，而不直接把原文改成名词“约”。
- source_word: אֲשֶׁר כָּרַתִּי אִתְּכֶם
  choice: 我……与你们所立的
  rationale: כרת字面为“切”，在这里唤起立约惯用语。中文以“立”自然表达这种约定关系，并与“约言”搭配。
- source_word: בְּצֵאתְכֶם מִמִּצְרַיִם
  choice: 在你们出埃及时
  rationale: 前缀ב与不定式结构表示时间；此译简洁保留出埃及这一历史指向。
- source_word: וְרוּחִי
  choice: 我的灵
  rationale: 在上帝与群体同在的语境中，רוּחַ指上帝的灵，而非普通的风或气息。中文“灵”无需借助大小写来标示神圣所指。
- source_word: עֹמֶדֶת בְּתוֹכְכֶם
  choice: 仍在你们中间
  rationale: 分词表达持续的状态；中文若直译“正站立”容易造成具有人体姿态的误解。“仍在”自然表达持续同在，同时将原文的站立意象收入脚注。
- source_word: אַל תִּירָאוּ
  choice: 不要惧怕
  rationale: 准确传达否定命令，语气庄重而简明。
theological_decisions:
- issue: רוּחִי所指的神圣临在
  choice: 我的灵
  alternative: 我的气息
  rationale: 上下文谈上帝在立约群体中的持续临在，“我的灵”最符合语境；译文不进一步加入原文未明说的后期教义细节。
- issue: דָּבָר……כָּרַתִּי中的立约意味
  choice: 所立的约言
  alternative: 所说的话／所立的约
  rationale: 原文使用“话／事情”而非“约”这一名词，但动词“切”带有鲜明的立约色彩。“约言”兼顾两面，避免只译“约”而过度明确，也避免只译“话”而淡化语境。
- issue: עֹמֶדֶת的持续性与站立意象
  choice: 仍在
  alternative: 正立在
  rationale: 原文分词可表达持续站立、留驻。正文采用自然中文表达持续临在，脚注保留较直译的可能，以免把该意象完全隐藏。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“约言”略带经文语体，但能在中文中同时承载原文“话”与立约意味；分号保留前述约言、神的同在和末尾劝勉之间的紧密关系。
