base_translation:
  language: en
  yaml_path: translation/ot/haggai/002/007.yaml
  text: And I will shake all the nations[a], and the treasures of all the nations will come, and I will fill this house with glory, says Yahweh of Armies.
translation:
  language: zh_hans
  text: 我必震动万国；万国的珍宝[a]必来到；我必使这殿充满荣耀。万军之耶和华说。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或按传统译作“万国所羡慕的必来到”。原文也可指万国“可喜爱的东西”或“珍贵之物”；与此词搭配的动词为复数，因此更支持集合性的理解。
    reason: 保留原文词义和语法所产生的传统替代译法，同时避免将原文未明确限定的人格性所指写入脚注。
lexical_decisions:
- source_word: וְהִרְעַשְׁתִּי
  choice: 我必震动
  rationale: 使役式表达使万国震动；“震动”自然简洁，并保留上帝主动施行的含义。
- source_word: כָּל־הַגּוֹיִם
  choice: 万国
  rationale: גּוֹיִם在此泛指列国；“万国”是庄重而通俗的现代汉语表达，不将其限缩为特定神学类别。
- source_word: וּבָאוּ
  choice: 都必来到
  rationale: 该动词是复数，按预言语境译作将来；“都”使其与集合意义的“珍宝”自然呼应。
- source_word: חֶמְדַּת כָּל־הַגּוֹיִם
  choice: 万国的珍宝
  rationale: חֶמְדַּת虽为单数形式，却可作集合名词，指珍贵、可喜爱的物品；相配的复数动词支持集合性的物质含义。“珍宝”既自然，也保留其贵重、令人喜爱的意味。
- source_word: וּמִלֵּאתִי
  choice: 我必使……充满
  rationale: מלא的加强式在此表示“使充满”；此句式符合现代汉语，并清楚表达耶和华是施事者。
- source_word: הַבַּיִת הַזֶּה
  choice: 这殿
  rationale: בַּיִת字面为“房屋”，但本段明确指圣殿；“这殿”在汉语中简明清楚，也保留指示语“这”。
- source_word: כָּבוֹד
  choice: 荣耀
  rationale: 在圣殿和上帝临在的语境中，“荣耀”兼具威荣、尊荣与神学意涵。
- source_word: יְהוָה צְבָאוֹת
  choice: 万军之耶和华
  rationale: 采用现代中文圣经读者熟悉而庄重的称号；“万军”表达צְבָאוֹת所含天上或军事众军的力量意象。
- source_word: אָמַר
  choice: 这是……说的
  rationale: 这是自然的现代汉语先知宣告公式，清楚标明话语来源。
theological_decisions:
- issue: חֶמְדַּת כָּל־הַגּוֹיִם的所指
  choice: 集合性、物质性的“万国的珍宝”
  alternative: 传统上也可译作单数、人格化的“万国所羡慕的那一位”；另可译“万国一切可喜爱的东西”
  rationale: 名词形式本身容许“所喜爱的事物、珍贵之物”等含义，而复数动词וּבָאוּ更有力地支持集合性所指，不宜在正文中直接断定为一位弥赛亚人物。脚注保留传统译法和原文歧义，以免抹去其历史神学意义。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。“万国”“这殿”“荣耀”“万军之耶和华”保持先知文体的凝练与威严；正文不把含混短语直接人格化，脚注则保留传统解释。
