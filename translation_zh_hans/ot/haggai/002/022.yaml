  terminology: “倾覆”“王位”“摧毁”“势力”“列邦”均可用。“驾驭战车的人”比“车上的人”更准确对应乘驾战车者，避免泛指所有在车上的人。保留“弟兄”以对应原文的男性单数惯用表达。
