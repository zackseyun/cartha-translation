  to: 我必倾覆列国的王位[a]，摧毁列邦的势力；我必倾覆战车和驾驭战车的人。马和骑马的人都必倒下[b]，各人都倒在自己弟兄的刀下。
  rationale: 修订仅收紧原文的军事名词：不将“马”预先限定为“战马”，也不将“骑马的人”转换为现代军事编制“骑兵”；同时将“车上的人”明确为与战车相关的驾驭者。其余保留原译对单数“王位”、重复“倾覆”及弟兄之刀的处理。
