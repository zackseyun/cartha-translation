id: HAG.2.22
reference: Haggai 2:22
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/הָֽפַכְתִּי֙ כִּסֵּ֣א מַמְלָכ֔וֹת וְ/הִ֨שְׁמַדְתִּ֔י חֹ֖זֶק מַמְלְכ֣וֹת הַ/גּוֹיִ֑ם וְ/הָפַכְתִּ֤י מֶרְכָּבָה֙ וְ/רֹ֣כְבֶ֔י/הָ וְ/יָרְד֤וּ סוּסִים֙ וְ/רֹ֣כְבֵי/הֶ֔ם אִ֖ישׁ בְּ/חֶ֥רֶב אָחִֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/haggai/002/022.yaml
  text: I will overturn the throne of kingdoms[a], and I will destroy the strength of the kingdoms of the nations. I will overturn the chariot and its rider, and horses and their riders will go down[b], each by the sword of his brother.
translation:
  language: zh_hans
  text: 我必倾覆列国的王位[a]，摧毁列邦的势力；我必倾覆战车和驾驭战车的人。马和骑马的人都必倒下[b]，各人都倒在自己弟兄的刀下。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“列国的王权。”原文“王位”为单数，可能集合性地代表列国的统治权。
    reason: lexical_alternative
  - marker: b
    text: “各人都倒在自己弟兄的刀下”指交战者彼此残杀，或因内讧而互相攻击。
    reason: cultural_note
lexical_decisions:
- source_word: וְהָפַכְתִּי
  choice: 我要倾覆
  rationale: הפך在审判语境中表示翻转、推翻；“倾覆”既能用于王位，也能用于战车，保留原文反复出现的具体意象。
- source_word: כִּסֵּא מַמְלָכוֹת
  choice: 列国的王位
  rationale: כִּסֵּא为单数，可象征或集合性地指王权；“王位”保留单数形式，“列国”则自然表达复数的מַמְלָכוֹת。
- source_word: וְהִשְׁמַדְתִּי
  choice: 摧毁
  rationale: שׁמד的使役式是强烈的审判动词；“摧毁”力度充分，又不过度扩展为“彻底灭绝”。
- source_word: חֹזֶק
  choice: 势力
  rationale: 该词意为力量、强势；此处对象是列邦，现代汉语用“势力”较自然，并兼顾政治与军事力量。
- source_word: מַמְלְכוֹת הַגּוֹיִם
  choice: 列邦
  rationale: 此处指各外邦国家及其政权；“列邦”简洁庄重，也避免把גּוֹיִם处理为带特定神学色彩的称谓。
- source_word: מֶרְכָּבָה
  choice: 战车
  rationale: 词本义为车或战车，语境明确属于军事场景；“战车”比单说“车”清楚，同时保留希伯来文单数的集合性意象。
- source_word: וְרֹכְבֶיהָ
  choice: 车上的人
  rationale: 原形式为复数并带阴性单数后缀，直译是“它的乘驾者们”。“车上的人”保留复数可涵盖性，也与单数集合性的“战车”自然搭配，不强行改作单数。
- source_word: וְיָרְדוּ
  choice: 都必倒下
  rationale: ירד本义是下去、降下；在战斗语境中指败亡倒下。“倒下”在现代汉语中自然，并保留未明说死亡程度的表达。
- source_word: סוּסִים
  choice: 战马
  rationale: 本义为马；与战车、骑兵并列时显然是军用马匹，因此译作“战马”使军事语境清楚。
- source_word: וְרֹכְבֵיהֶם
  choice: 骑兵
  rationale: 直义为“骑在它们上面的人”；在战场语境中，“骑兵”是简明自然的现代汉语表达。
- source_word: אִישׁ בְּחֶרֶב אָחִיו
  choice: 各人都倒在自己弟兄的刀下
  rationale: 保留אִישׁ的逐一分配意味和אָחִיו的男性“弟兄”用语，并以自然汉语表达彼此残杀或内讧的战场图景。
theological_decisions:
- issue: אִישׁ ... אָחִיו中的性别化表达
  choice: 各人都倒在自己弟兄的刀下
  alternative: 各人都倒在彼此的刀下
  rationale: 希伯来文使用阳性单数“人”和“他的弟兄”构成分配性惯用语。正文保留“弟兄”，不把原文中真实存在的男性战士图景中性化；脚注说明其相互残杀的含义。
- issue: כִּסֵּא מַמְלָכוֹת的单数王位意象
  choice: 列国的王位
  alternative: 列国的王权／列国的王位（复数理解）
  rationale: 原文“王位”为单数，可能集合性或象征性地指列国统治权。译文保留单数意象，不替文本判定究竟是一共同王权还是各国王位的集合。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。通过“倾覆……倾覆”保留原文动词复现；“王位”与“战车”保留单数集合意象。“列国／列邦”略作词汇变化以避免汉语重复生硬，但二者都对应国家政权。
