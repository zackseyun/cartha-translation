  text: גָּד֣וֹל יִֽהְיֶ֡ה כְּבוֹד֩ הַ/בַּ֨יִת הַ/זֶּ֤ה הָ/אַֽחֲרוֹן֙ מִן הָ֣/רִאשׁ֔וֹן אָמַ֖ר יְהוָ֣ה צְבָא֑וֹת וּ/בַ/מָּק֤וֹם הַ/זֶּה֙ אֶתֵּ֣ן שָׁל֔וֹם נְאֻ֖ם יְהוָ֥ה צְבָאֽוֹת־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/haggai/002/009.yaml
  text: The latter glory of this house will be greater than the former[a], says Yahweh of Armies; and in this place I will give peace[b], declares Yahweh of Armies.
translation:
  language: zh_hans
  text: “这殿后来的荣耀必大过先前的[a]，”万军之耶和华说，“在这地方，我必赐下平安[b]。”这是万军之耶和华的宣告。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “后来……先前”也可理解为“末后的……起初的”；原文没有在此明确说明是比较两座殿，还是这殿在不同时期的景况。
    reason: preserve_ambiguity
  - marker: b
    text: “平安”所译的希伯来词也可包含安康、福祉和完整之意。
    reason: lexical_alternative
lexical_decisions:
- source_word: גָּדוֹל יִהְיֶה ... מִן
  choice: 必大过
  rationale: 形容词גָּדוֹל与היה构成谓语，并由מִן引出比较对象；“必大过”自然表达将来的比较关系。
- source_word: כְּבוֹד
  choice: 荣耀
  rationale: 在圣殿语境中兼具尊荣、荣美及神学意味，“荣耀”最能保留其丰富内涵。
- source_word: הַבַּיִת הַזֶּה
  choice: 这殿
  rationale: בַּיִת本义为“房屋”，此处明确指圣殿；现代汉语用“这殿”既简洁，也不含混。
- source_word: הָאַחֲרוֹן ... הָרִאשׁוֹן
  choice: 后来……先前
  rationale: 保留两词的对应关系，同时不预先判定是两座圣殿，还是同一殿在不同时期的状态。
- source_word: יְהוָה צְבָאוֹת
  choice: 万军之耶和华
  rationale: 将盟约圣名译为“耶和华”，צְבָאוֹת依汉语圣经传统译作“万军”，表达其统帅众军的大能与权柄。
- source_word: וּבַמָּקוֹם הַזֶּה
  choice: 在这地方
  rationale: 直接保留מָקוֹם及指示词的强调，表达自然清楚。
- source_word: אֶתֵּן
  choice: 我必赐下
  rationale: נָתַן本义是“给”；与神赐予平安搭配时，“赐下”在现代庄重汉语中自然。
- source_word: שָׁלוֹם
  choice: 平安
  rationale: שָׁלוֹם不仅指没有争战，也可涵盖安康、福祉和完整；正文采用通行且语义宽广的“平安”，脚注补充其范围。
- source_word: נְאֻם
  choice: 这是……的宣告
  rationale: 该词标示庄严的神谕公式；此译法保留先知性权威，又符合现代汉语表达。
theological_decisions:
- issue: “这殿后来的荣耀”所指为何
  choice: 按原文直译为这殿后来的荣耀大过先前，不在正文限定具体应验方式
  alternative: 可理解为第二圣殿与所罗门圣殿的比较、同一圣殿后来与先前状态的比较，或带有弥赛亚及末世性的应验
  rationale: 希伯来文明确作出比较，却未在本节中界定其历史或末世所指；译文应保留这种开放性。
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: “耶和华”是现代普通中文读者最熟悉的专名形式，并将其作为盟约圣名而非普通称号呈现。
- issue: שָׁלוֹם的应许范围
  choice: 正文译“平安”，脚注说明也可涵盖安康、福祉与完整
  alternative: 正文译“福祉”或“圆满”
  rationale: 避免把此词仅限于政治安定，同时不把某种特定救赎论解释直接写入正文。
translation_notes:
  register: 采用现代、庄重而易懂的普通话书面语。引语结构清楚区分神谕正文与结尾宣告；保留“荣耀”“平安”等具有广泛经文共鸣的核心词，同时用脚注呈现真实的词义范围与所指歧义。
