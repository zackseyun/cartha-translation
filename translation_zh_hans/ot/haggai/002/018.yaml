base_translation:
  language: en
  yaml_path: translation/ot/haggai/002/018.yaml
  text: Set your heart on this from this day onward[a], from the twenty-fourth day of the ninth month, from the day when the temple of Yahweh was founded; consider it.
translation:
  language: zh_hans
  text: 请你们留心思量：从今日起，从九月二十四日、从雅威的殿宇奠基[a]之日起，要留心思量。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “奠基”或译“雅威殿宇的根基被立下”。
    reason: 原文使用יסד的被动式；“奠基”是自然的建筑用语，另一译法则更明确呈现“根基被立下”的被动表达。
lexical_decisions:
- source_word: שִׂימוּ נָא לְבַבְכֶם
  choice: 你们要……留心思想
  rationale: 这是希伯来语习语，字面意思是“把你们的心放在……上”，实际用于郑重劝人仔细思量。“留心思想”在现代汉语中自然、庄重，并保留了“心”所表达的专注意味；נָא在此加强劝告语气，以“要”体现。
- source_word: מִן הַיּוֹם הַזֶּה וָמָעְלָה
  choice: 从今日起
  rationale: 该时间表达以当日为起点并指向以后；“从今日起”简洁自然地传达“从这一天往后”的意思。
- source_word: מִיּוֹם עֶשְׂרִים וְאַרְבָּעָה לַתְּשִׁיעִי
  choice: 从九月二十四日起
  rationale: 原文精确给出第九月二十四日。汉语按通行日期语序译为“九月二十四日”，并以“起”保留起始点含义。
- source_word: לְמִן הַיּוֹם
  choice: 之日起
  rationale: 原文再次引出时间起点。“之日起”与前面的日期表达衔接自然，也保留重复强调。
- source_word: אֲשֶׁר יֻסַּד
  choice: 奠基
  rationale: יסד的被动式表示建筑物被立下根基。“奠基”准确、凝练；脚注列出更贴近被动形式的译法。
- source_word: הֵיכַל יְהוָה
  choice: 雅威的殿
  rationale: הֵיכַל在本段指圣殿建筑，译作“殿”符合中文圣经语体；神名יהוה按其专名译作“雅威”。
- source_word: שִׂימוּ לְבַבְכֶם
  choice: 要留心思想
  rationale: 末尾重复同一劝告以加强语气，译文也重复“留心思想”，不削弱原文的强调。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名יהוה。“雅威”按学界通行的重构读音音译，明确保留其专名性质；“耶和华”是中文传统译名，但反映的是后期混合读法。
- issue: 圣殿奠基日期与“今日”的关系
  choice: 保持原文连续的多个起始时间短语，不解释它们是否完全同指一天
  alternative: 明确改写为“也就是圣殿奠基的那一天”
  rationale: 原文并列、递进地重复“从……起”，其确切时间关系可能引发不同理解。译文不额外断定这些表达完全等同，以保留原有张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“留心思想”兼顾希伯来习语中的“心”与其实际劝勉功能；重复末句以保存原文强调。日期按现代汉语习惯排列，并保留各个“从……起”的层次。
