source:
  edition: WLC
  text: בַּ/יּ֣וֹם הַ/ה֣וּא נְאֻם יְהוָ֣ה צְבָא֡וֹת אֶ֠קָּחֲ/ךָ זְרֻבָּבֶ֨ל בֶּן שְׁאַלְתִּיאֵ֤ל עַבְדִּ/י֙ נְאֻם יְהוָ֔ה וְ/שַׂמְתִּ֖י/ךָ כַּֽ/חוֹתָ֑ם כִּֽי בְ/ךָ֣ בָחַ֔רְתִּי נְאֻ֖ם יְהוָ֥ה צְבָאֽוֹת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/haggai/002/023.yaml
  text: On that day[a], declares Yahweh of Armies, I will take you, Zerubbabel son of Shealtiel, my servant, declares Yahweh, and I will make you like a signet ring, for I have chosen you[b], declares Yahweh of Armies.
translation:
  language: zh_hans
  text: 万军之雅威宣告：“到那日，我必取你，撒拉铁的儿子所罗巴伯，我的仆人；这是雅威的宣告。我必使你如同一枚印戒[a]，因为我拣选了你；这是万军之雅威的宣告。”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “印戒”指可用来盖印、认证的戒指，也可象征权柄、归属和珍视。参耶利米书22:24。
    reason: 说明古代印戒意象，并提供相关经文。
  - marker: b
    text: “万军”指雅威所统领的天上和地上众军；传统上也常译为“万军之耶和华”。
    reason: 说明神圣称号的语义及传统译法。
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: 到那日
  rationale: 保留先知话语中的时间公式及其指向性；“到那日”符合现代汉语表达，也不额外限定其末世含义。
- source_word: נְאֻם יְהוָה צְבָאוֹת
  choice: 万军之雅威宣告说／这是万军之雅威的宣告
  rationale: נְאֻם 是庄严的先知宣告公式；按所在句子的汉语句法分别译成“宣告说”和“这是……的宣告”。“万军”保留 צְבָאוֹת 所表达的天上、地上众军之主的称号。
- source_word: אֶקָּחֲךָ
  choice: 我必取你
  rationale: 保留 לקח“取、拿”的基本意象，不提前将它解释成“拣选”或“提拔”，因为后文另有明确的“拣选”。
- source_word: זְרֻבָּבֶל בֶּן שְׁאַלְתִּיאֵל
  choice: 撒拉铁的儿子所罗巴伯
  rationale: 采用现代中文圣经人名的通行音译，并用自然的汉语亲属结构表达身份。
- source_word: עַבְדִּי
  choice: 我的仆人
  rationale: 在君王与先知语境中，“仆人”既表达归属，也表达受差遣的服事，较“奴隶”更符合本处称谓功能。
- source_word: וְשַׂמְתִּיךָ כַּחוֹתָם
  choice: 我要使你如同印戒
  rationale: 保留 כְּ 所标示的明喻。חוֹתָם 可指印章或佩戴的印戒；本处与王权、认证和珍视相关，“印戒”能较具体地传达该古代意象。
- source_word: כִּי בְךָ בָחַרְתִּי
  choice: 因为我拣选了你
  rationale: כִּי 取原因义；בחר ב 表示选中某人。完成式译为“拣选了”，表达已经作出的选择。
- source_word: יְהוָה
  choice: 雅威
  rationale: 直接音译希伯来文的神圣名字，避免以称号替代原文专名。
theological_decisions:
- issue: 神圣名字 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文三次直接使用四字神名。译作“雅威”保留其作为立约之神名字的性质，不以“主”这一称号取代。
- issue: צְבָאוֹת 的称号含义
  choice: 万军之雅威
  alternative: 军队之雅威；万军之耶和华
  rationale: “万军”是中文读者熟悉且庄重的表达，并可涵盖雅威所统领的天上与地上众军；脚注提示其语义范围。
- issue: “印戒”的王权及弥赛亚含义
  choice: 正文只保留比喻，不明确添加“大卫王权”或“弥赛亚”
  alternative: 扩译为“我的王室印戒”
  rationale: 所罗巴伯的身份及与耶利米书22:24的呼应具有王朝复兴意味，但希伯来正文只陈述印戒比喻和神的拣选；因此不在正文中消解其神学张力。
- issue: אֶקָּחֲךָ 与 בָחַרְתִּי 的关系
  choice: 分别译为“取你”和“拣选了你”
  alternative: 两处都译作“拣选你”
  rationale: 原文使用两个不同动词。保留区别，可避免把雅威采取、任用所罗巴伯的行动与其拣选完全合并。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。保留三次 נְאֻם 宣告公式，但按汉语句法调整其位置和形式，以避免生硬重复；称呼“我的仆人啊”保留直接 خطاب的庄严语气。
