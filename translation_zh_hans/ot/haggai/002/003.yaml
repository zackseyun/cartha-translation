  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: מִ֤י בָ/כֶם֙ הַ/נִּשְׁאָ֔ר אֲשֶׁ֤ר רָאָה֙ אֶת הַ/בַּ֣יִת הַ/זֶּ֔ה בִּ/כְבוֹד֖/וֹ הָ/רִאשׁ֑וֹן וּ/מָ֨ה אַתֶּ֜ם רֹאִ֤ים אֹת/וֹ֙ עַ֔תָּה הֲ/ל֥וֹא כָמֹ֛/הוּ כְּ/אַ֖יִן בְּ/עֵינֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/haggai/002/003.yaml
  text: Who among you is left who saw this house in its former glory? And how do you see it now? Is it not as nothing in your eyes?[a][b]
translation:
  language: zh_hans
  text: 你们中间还有谁见过这殿从前的荣耀？如今你们看它怎样？在你们眼中，它岂不是如同无有吗？[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “殿”原文直译为“房屋”，在这里是指圣殿。
    reason: lexical_alternative
  - marker: b
    text: “从前的荣耀”也可译作“起初的荣耀”。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי בָכֶם הַנִּשְׁאָר
  choice: 你们中间还有谁
  rationale: 表达听众中仍留存、曾经历早先时期之人的意思；“还有谁”在现代汉语中自然，也不把该词过度限定为“仍然活着”。
- source_word: אֲשֶׁר רָאָה
  choice: 见过
  rationale: 指过去已经发生的观看经历；“见过”自然传达经验性的完成事件。
- source_word: הַבַּיִת הַזֶּה
  choice: 这殿
  rationale: בַּיִת 字面是“房屋”，但在本段明确指圣殿；译作“殿”既合乎上下文，也保留庄重而通俗的表达。
- source_word: בִּכְבוֹדוֹ הָרִאשׁוֹן
  choice: 从前的荣耀
  rationale: כָּבוֹד 在这里包含荣美、辉煌和尊荣；“从前的荣耀”自然呈现与现况的时间对比。
- source_word: וּמָה אַתֶּם רֹאִים אֹתוֹ עַתָּה
  choice: 如今你们看它怎样
  rationale: 该问句要求听众评估圣殿现今的景况，而非仅询问看见什么；此译保留直接而带评价性的语气。
- source_word: הֲלוֹא
  choice: 岂不是
  rationale: 引出预期肯定回答的反问；“岂不是”保持原文的修辞力度和庄重语体。
- source_word: כָמֹהוּ כְּאַיִן
  choice: 它……如同无有
  rationale: 表达与昔日相比近乎微不足道；“如同无有”保留原文强烈的比较和张力。
- source_word: בְּעֵינֵיכֶם
  choice: 在你们眼中
  rationale: 保留希伯来语关于判断和观感的身体隐喻，现代汉语亦清楚自然。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“见过”体现往昔经验，“如今你们看它怎样”保留原文的评价性问句，末句以“岂不是如同无有吗”呈现反问的强烈对比。脚注标记均置于正文相关经句末尾。
