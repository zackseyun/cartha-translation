revisions:
- from: “假如有人把圣肉[a]兜在衣襟[b]里，他的衣襟碰到饼、炖菜、酒、油或任何食物，那食物会因此成为圣物吗？”众祭司回答说：“不会。”
  to: “假如有人用衣服的衣角[b]兜着圣肉[a]，衣角碰到饼、炖菜、酒、油或任何食物，这些食物会因此成为圣的吗？”祭司们回答说：“不会。”
  rationale: 将“衣襟”统一改为“衣角”，准确表达原文中用来兜载圣肉并接触食物的衣服部位；相应调整句式使其符合现代汉语。将“成为圣物”改为“成为圣的”，更直接保留希伯来文关于礼仪圣洁状态是否传递的问题。其余内容及脚注锚点均予保留。
