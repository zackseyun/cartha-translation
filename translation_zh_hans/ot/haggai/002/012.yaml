id: HAG.2.12
reference: Haggai 2:12
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: הֵ֣ן יִשָּׂא אִ֨ישׁ בְּשַׂר קֹ֜דֶשׁ בִּ/כְנַ֣ף בִּגְד֗/וֹ וְ/נָגַ֣ע בִּ֠/כְנָפ/וֹ אֶל הַ/לֶּ֨חֶם וְ/אֶל הַ/נָּזִ֜יד וְ/אֶל הַ/יַּ֧יִן וְ/אֶל שֶׁ֛מֶן וְ/אֶל כָּל מַאֲכָ֖ל הֲ/יִקְדָּ֑שׁ וַ/יַּעֲנ֧וּ הַ/כֹּהֲנִ֛ים וַ/יֹּאמְר֖וּ לֹֽא׀־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/haggai/002/012.yaml
  text: Suppose a man carries holy meat in the fold of his garment[a], and with his fold touches bread, stew, wine, oil, or any food—does it become holy? And the priests answered and said[b], “No.”
translation:
  language: zh_hans
  text: “假如有人用衣服的衣角[b]兜着圣肉[a]，衣角碰到饼、炖菜、酒、油或任何食物，这些食物会因此成为圣的吗？”祭司们回答说：“不会。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“分别为圣的肉”；希伯来文直译为“圣的肉”。
    reason: 保留 בְּשַׂר קֹדֶשׁ 既可直译、也可按礼仪功能表达的词义差异。
  - marker: b
    text: “衣角”也可译作“衣边”或“下摆”。
    reason: כָּנָף 在此可指衣服的角、边缘或下摆，具体形制无法由本节完全确定。
lexical_decisions:
- source_word: הֵן
  choice: 假如
  rationale: 此处引出一个供祭司裁断的假设情形；“假如”在现代汉语中自然地表达其条件和举例作用。
- source_word: יִשָּׂא אִישׁ
  choice: 有人……兜着
  rationale: נשׂא 表示携带；结合衣襟这一具体方式，以“兜在……里”表达最自然，也保留行动主体为单数泛指。
- source_word: בְּשַׂר קֹדֶשׁ
  choice: 圣肉
  rationale: 直译“圣的肉”，所指是分别为圣的祭肉；“圣肉”简洁，并保留原文的礼仪用语。
- source_word: בִּכְנַף בִּגְדוֹ
  choice: 衣襟
  rationale: כָּנָף 可指衣服的边、角或下摆；此处是可用来兜物并与其他食物接触的部位，“衣襟”最符合现代汉语表达。
- source_word: וְנָגַע בִּכְנָפוֹ
  choice: 他的衣襟碰到
  rationale: 明确接触媒介是装着圣肉的衣襟，而不是圣肉直接碰到食物；原文代词形式仍容许将重点理解为该衣襟。
- source_word: נָזִיד
  choice: 炖菜
  rationale: 指煮成的菜肴或浓汤；“炖菜”比旧式的“羹”更便于现代普通读者理解。
- source_word: שֶׁמֶן
  choice: 油
  rationale: 原文泛称油，虽在当地通常可能是橄榄油，但不在正文中加以限定。
- source_word: כָּל מַאֲכָל
  choice: 任何食物
  rationale: 在列举之后扩大问题范围；“任何食物”准确表达疑问语境中的泛指。
- source_word: הֲיִקְדָּשׁ
  choice: 那食物会因此成为圣物吗
  rationale: 表达被动、结果性的礼仪状态变化，并以“因此”点明问题在于圣是否会经衣襟的接触传递。
- source_word: וַיַּעֲנוּ הַכֹּהֲנִים וַיֹּאמְרוּ לֹא
  choice: 众祭司回答说：“不会。”
  rationale: “回答说”保留原文两个叙事动词的节奏；“不会”自然回应前面的“会……吗”。
theological_decisions:
- issue: 圣是否借间接接触传递
  choice: 把问题译为装有圣肉的衣襟碰到其他食物后，该食物是否成为圣物；祭司回答否定。
  alternative: 理解为圣肉本身直接接触其他食物，或将“圣”解释为道德、内在意义上的圣洁。
  rationale: 希伯来文明确提到衣襟及其接触，语境是祭司对礼仪律例的裁断。译文保留间接接触的结构和礼仪层面的“圣”，不引入后来的系统神学结论。
translation_notes:
  register: 采用现代、庄重而口语可懂的祭司法例问答体。“圣肉”“圣物”保留礼仪语境；“兜在衣襟里”使携带方式清楚。“众祭司”表达希伯来文带定冠词的复数称谓，但不额外推断人数。
