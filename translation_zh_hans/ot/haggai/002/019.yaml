source:
  edition: WLC
  text: הַ/ע֤וֹד הַ/זֶּ֨רַע֙ בַּ/מְּגוּרָ֔ה וְ/עַד הַ/גֶּ֨פֶן וְ/הַ/תְּאֵנָ֧ה וְ/הָ/רִמּ֛וֹן וְ/עֵ֥ץ הַ/זַּ֖יִת לֹ֣א נָשָׂ֑א מִן הַ/יּ֥וֹם הַ/זֶּ֖ה אֲבָרֵֽךְ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/haggai/002/019.yaml
  text: Is the seed still in the storehouse? Even the vine[a], the fig tree, the pomegranate, and the olive tree have not borne fruit. From this day on I will bless you.
translation:
  language: zh_hans
  text: 种子还在仓里吗？连葡萄树、无花果树、石榴树和橄榄树也都还没有结果。从今天起，我必赐福给你们。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“我必赐福”，没有明说赐福的对象；“给你们”是按上下文补出的。
    reason: 说明原文省略宾语及译文所作的语境补足。
lexical_decisions:
- source_word: הַעֹוד
  choice: 还
  rationale: 在疑问句中表示截至当时仍然存在的状态；“还”是现代汉语最自然的表达。
- source_word: הַזֶּרַע
  choice: 种子
  rationale: 保留 זֶרַע 的基本农业含义，不进一步限定为谷种或粮食。
- source_word: בַּמְּגוּרָה
  choice: 在仓里
  rationale: מְגוּרָה 指储存谷物或农产品的地方；“仓”简洁、自然，也符合农业语境。
- source_word: וְעַד
  choice: 连……也
  rationale: 这里把视线从仓中的种子扩展到随后列举的果树；“连……也”自然传达这种递进延伸。
- source_word: הַגֶּפֶן וְהַתְּאֵנָה וְהָרִמּוֹן וְעֵץ הַזַּיִת
  choice: 葡萄树、无花果树、石榴树和橄榄树
  rationale: 采用现代汉语中通行且明确的植物名称。
- source_word: לֹא נָשָׂא
  choice: 还没有结果
  rationale: נָשָׂא 本义为“承载”，用于果树时指结出果实；“结果”是自然的汉语农业表达。句中加入“还”以呈现截至该日尚未结果的时点意味。
- source_word: מִן הַיּוֹם הַזֶּה
  choice: 从今天起
  rationale: 清楚表达以当日为转折点、此后开始生效的前瞻意义。
- source_word: אֲבָרֵךְ
  choice: 我必赐福给你们
  rationale: Piel 未完成式第一人称单数在此表达郑重的将来应许；原文未明说宾语，译文按上下文补出受话群体“你们”，并以脚注说明。
theological_decisions:
- issue: “我必赐福”所隐含的宾语
  choice: 正文译作“我必赐福给你们”，并用脚注注明原文未明说宾语。
  alternative: 保留无宾语形式：“我必赐福。”
  rationale: 希伯来文只写“我必赐福”，但整段神谕直接面向百姓。现代汉语补出“给你们”可使应许自然清楚，同时脚注保留原文形式，避免把补足成分误当作明文。
- issue: 果树列表与单数动词的关系
  choice: 按汉语习惯用“也都还没有结果”，把列表理解为共同陈述的多个项目。
  alternative: 机械保留单数关系，译成“它还没有结果”。
  rationale: 希伯来文 נָשָׂא 为单数，但前面列举数种植物，可能按整组或最后一项作语法处理。汉语若用单数代词会造成指代不明；“都”忠实传达所列作物截至当时均未有收成的语境。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“仓里”比“仓库里”更贴近农业场景；“从今天起，我必……”保留宣告和应许的语气。
