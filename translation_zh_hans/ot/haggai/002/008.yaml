  text: לִ֥/י הַ/כֶּ֖סֶף וְ/לִ֣/י הַ/זָּהָ֑ב נְאֻ֖ם יְהוָ֥ה צְבָאֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/haggai/002/008.yaml
  text: The silver is mine[a], and the gold is mine[b], declares Yahweh of Armies.
translation:
  language: zh_hans
  text: 万军之耶和华[a]宣告：“银子是我的，金子也是我的。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “万军之耶和华”也可译作“统领万军的耶和华”；“万军”可指众军或天上的军队。
    reason: lexical_alternative
lexical_decisions:
- source_word: לִי
  choice: 是我的
  rationale: 介词 לְ 加第一人称单数后缀在此表示所属；译为“是我的”既自然，也保留句首所属表达所形成的强调。
- source_word: הַכֶּסֶף
  choice: 银子
  rationale: כֶּסֶף 可指银或钱财；这里与“金子”并列，首先指贵金属，因此译为“银子”。
- source_word: וְלִי הַזָּהָב
  choice: 金子也是我的
  rationale: 原文重复 לִי，分别强调银和金都归耶和华所有；“也”在自然汉语中保留这种并列和强调。
- source_word: נְאֻם
  choice: 宣告说
  rationale: 这是先知文体中庄严的神谕公式；“宣告说”既表达其郑重语气，也符合现代汉语。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的音译呈现四字神名，不以一般称号替代。
- source_word: צְבָאוֹת
  choice: 万军
  rationale: 该复数名词指众军、军队；置于神名之后构成称号。“万军之耶和华”保留原文形式和军事、统御意味，同时在中文中庄重而通行。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用以色列之神的专名。中文采用广为人知的“耶和华”，保留专名性质，而不改译为“主”。
- issue: 称号 יְהוָה צְבָאוֹת 的译法
  choice: 万军之耶和华
  alternative: 统领万军的耶和华
  rationale: “万军之耶和华”较贴近原文紧凑的名词组合，并保留其可涵盖地上或天上众军的宽度；正文不额外限定所指是哪一种军队。
- issue: 银与金的所有权断言
  choice: 分别保留“我的”这一所属断言
  alternative: 银子和金子都属于我
  rationale: 原文两次出现 לִי，形成强调性的平行结构；分别译出可避免削弱耶和华对两者所有权的郑重宣告。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留原文两次所属表达的平行强调；神谕公式置于引语之后，使汉语流畅而不削弱其庄严感。
