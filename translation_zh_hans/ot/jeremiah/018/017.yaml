base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/018/017.yaml
  text: Like an east wind I will scatter them before the enemy[a]; I will show them the back and not the face in the day of their disaster.
translation:
  language: zh_hans
  text: 我要像东风一样，在仇敌面前驱散他们；在他们遭难的日子，我要让他们看见我的背，而不是我的脸。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在他们遭难的日子，我要背向他们，不以脸面对他们。”希伯来语以“背”与“脸”的对比，描绘耶和华撤回眷顾，不再以关注和恩宠面向他们。
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּרוּחַ קָדִים
  choice: 像东风一样
  rationale: כְּ 标明比喻，רוּחַ קָדִים 指东风，在希伯来语境中常带有强劲、毁灭性的意味；译文保留意象而不额外加入“灼热”等解释。
- source_word: אֲפִיצֵם
  choice: 把他们吹散
  rationale: פוץ 的使役形表示“使分散、驱散”；结合东风的比喻，译作“吹散”自然地呈现风的作用，同时保留审判语境。
- source_word: לִפְנֵי אוֹיֵב
  choice: 在仇敌面前
  rationale: 直译为“在仇敌面前”，可指他们在敌军当前被驱散；原文“仇敌”没有冠词，汉语无需强行区分定指与不定指。
- source_word: עֹרֶף וְלֹא פָנִים
  choice: 我的背，而不是我的脸
  rationale: עֹרֶף 本指后颈、背面，与“脸”相对时构成转身离弃的具体意象。原文没有明示所有格，但说话者是第一人称，汉语补出“我的”才能自然表达这一身体隐喻。
- source_word: אֶרְאֵם
  choice: 我要让他们看见
  rationale: ראה 在此带宾语及补足成分，可理解为“使他们看见、给他们看”；这样既符合句法，也保留“背而非脸”的形象。
- source_word: בְּיוֹם אֵידָם
  choice: 在他们遭难的日子
  rationale: אֵיד 指灾祸、灾难；此译保留“在……的日子”这一庄重的先知性时间表达，同时符合现代汉语。
theological_decisions:
- issue: 用拟人化身体意象表达上帝在审判中撤回眷顾
  choice: 保留“让他们看见我的背，而不是我的脸”的具体意象
  alternative: 意译为“我要转身离弃他们”或“我不再眷顾他们”
  rationale: 原文刻意以“背”与“脸”相对，表达不再以恩宠和关注面向他们。正文保留张力，不把意象直接化约为抽象神学说明。
- issue: אֶרְאֵם 的句法理解
  choice: 理解为使役性的“让他们看见”
  alternative: 理解为“我看他们的背而不看他们的脸”
  rationale: 紧邻的“背而不是脸”最自然地充当所显示的内容，且上下文强调耶和华转脸不顾；不过希伯来语形式本身可引发不同句法理解，故以脚注提示另一种表达方向。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“吹散”与“东风”形成自然搭配；分号保留两个审判宣告之间的平行推进。脚注标记置于相关句末，并保留原文拟人化意象及其可能的表达方式。
