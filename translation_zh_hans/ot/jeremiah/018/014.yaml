base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/018/014.yaml
  text: Does the snow of Lebanon leave the rock of the open country? Or are cold[b][a], flowing foreign waters ever uprooted?
translation:
  language: zh_hans
  text: 黎巴嫩的雪岂会离开旷野的磐石[a]？那些外来的[b]、寒冷的流水，岂会被拔除[c]？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “旷野的磐石”原文含义不确定，也可译作“田野的磐石”“郊野的峭壁”等；这句话可能使人联想到与黎巴嫩积雪有关的岩石高地或开阔地。
    reason: lexical_alternative
  - marker: b
    text: “外来的”也可译作“陌生的”；这里可能指来自远处或异地水源的水。
    reason: lexical_alternative
  - marker: c
    text: “被拔除”所译的希伯来语通常有“被拔出”或“被扯离”的意思；用于流水时是一种不寻常的比喻，也可理解为水流被从其源头或所在之处扯离。
    reason: metaphor_preservation
lexical_decisions:
- source_word: הֲיַעֲזֹב
  choice: 岂会离开
  rationale: 疑问词与动词“离开、撇下”构成反问；“岂会离开”自然传达预期的否定回答，又不把自然景象人格化为“背弃”。
- source_word: מִצּוּר שָׂדַי
  choice: 旷野的磐石
  rationale: צוּר指磐石或峭壁，שָׂדַי与田野、郊野或开阔地有关。原短语意义困难，正文采用较直译且具体的表达，并以脚注保留其他理解。
- source_word: שֶׁלֶג לְבָנוֹן
  choice: 黎巴嫩的雪
  rationale: 按希伯来语所属关系直接翻译，保留地理意象。
- source_word: אִם
  choice: （第二个）岂会
  rationale: 这里引出诗歌平行结构中的第二个反问，而非条件句；中文以重复反问句式自然表达。
- source_word: יִנָּתְשׁוּ
  choice: 断绝
  rationale: 该动词通常有“拔出、扯离、弃置”之意，用于流水时意象异常。中文“断绝”可表达水流被截断、离开源头的效果，但脚注保留更贴近字面的译法。
- source_word: מַיִם זָרִים
  choice: 远方而来的水
  rationale: זָרִים基本义为陌生、外来的；在此很可能指来自远处或异地水源的水。“远方而来”避免现代中文“外国的水”所带来的政治地理误解。
- source_word: קָרִים נוֹזְלִים
  choice: 寒冷流水
  rationale: קָרִים表示寒冷，נוֹזְלִים表示流动；合译为“寒冷流水”简洁而保留山泉意象。
theological_decisions: []
