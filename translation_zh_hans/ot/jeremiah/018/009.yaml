  yaml_path: translation/ot/jeremiah/018/009.yaml
  text: And at another moment I may speak concerning a nation and concerning a kingdom[a], to build and to plant.
translation:
  language: zh_hans
  text: 又一时，我论到一国和一邦，说要建立、栽植[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在一时，我论到一国和一邦，说要建立、栽植。”希伯来文以“时刻”的说法统摄第7至10节中上帝的各项宣告。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/רֶגַע
  choice: 又有一刻
  rationale: רֶגַע意为“片刻、时刻”。本句与第7节构成对应情形；“又有一刻”既保留原文的时刻用语，也自然表达另一种宣告场景。
- source_word: אֲדַבֵּר
  choice: 我……说
  rationale: 未完成式在18:7–10的原则性、条件性陈述中指情境中所作的宣告。汉语以“又有一刻……说”表达这种场景，无须加入可能暗示不确定性的“也许”。
- source_word: עַל
  choice: 论到
  rationale: דבר על在此指针对、关于某对象发言；“论到”准确而庄重，也不把正面宣告误译为“攻击”。
- source_word: גּוֹי
  choice: 国
  rationale: גּוֹי在此指作为整体的民族或国家，与“邦”并列时译作“国”简洁清楚。
- source_word: מַמְלָכָה
  choice: 邦
  rationale: מַמְלָכָה指王国、邦国或政治领域；“邦”与“国”并列自然，并避免现代汉语中“王国”可能过度限定政体。
- source_word: לִ/בְנֹת
  choice: 建立
  rationale: בנה本义为“建造”。论及国家和邦国时，“建立”保留建造意象，同时符合现代汉语搭配。
- source_word: וְ/לִ/נְטֹעַ
  choice: 栽植
  rationale: נטע本义为“栽种、栽植”。采用及物性可由语境补足的“栽植”，不另加原文没有的代词，并保留农业比喻。
theological_decisions:
- issue: 预言宣告中的神圣条件性
  choice: 用“又有一刻……说要……”呈现原则性情境，并让18:7–10的上下文表明其条件关系。
  alternative: 我也许会论到……；我必论到……
  rationale: 原文未完成式置于成对的情境陈述中，既不必译成表示神不确定的“也许”，也不宜用“必”把条件性抹平。当前译法保存经文本身关于宣告与回应之间的张力。
- issue: 建立与栽植的施事和对象
  choice: 理解为上帝宣告自己要建立、栽植所论到的国家或邦国，但不在正文补出宾语。
  alternative: 说要建立它、栽植它
  rationale: 两个不定式由第一人称宣告统摄，对象可由“国或邦”自然领会；省略“它”更贴近希伯来文，也保留其简练结构。
translation_notes:
  register: 采用现代、庄重而简明的书面汉语。“国或一邦”反映两个介词短语所指的并列对象；“建立、栽植”保存原文相连的建筑与农业意象。脚注标记已置于正文。
