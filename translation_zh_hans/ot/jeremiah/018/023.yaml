reference: Jeremiah 18:23
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/אַתָּ֣ה יְ֠הוָה יָדַ֜עְתָּ אֶֽת כָּל עֲצָתָ֤/ם עָלַ/י֙ לַ/מָּ֔וֶת אַל תְּכַפֵּר֙ עַל עֲוֺנָ֔/ם וְ/חַטָּאתָ֖/ם מִ/לְּ/פָנֶ֣י/ךָ אַל תֶּ֑מְחִי ו/היו מֻכְשָׁלִים֙ לְ/פָנֶ֔י/ךָ בְּ/עֵ֥ת אַפְּ/ךָ֖ עֲשֵׂ֥ה בָ/הֶֽם־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/018/023.yaml
  text: But you[a], O Yahweh, know all their counsel against me for death. Do not cover over their iniquity, and do not blot out their sin from before you. Let them be made to stumble before you; in the time of your anger[c][b], act against them.
translation:
  language: zh_hans
  text: 但耶和华啊，你知道他们为置我于死地而设的一切计谋[a]。不要遮盖他们的罪孽[b]，也不要从你面前涂抹他们的罪；愿他们在你面前被绊倒[c]。你发怒的时候，求你对付他们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译近于“他们针对我、为了死亡的一切计谋”；也可译作“他们为杀害我而设的一切计谋”或“谋害我的一切计谋”。
    reason: lexical_alternative
  - marker: b
    text: “遮盖”也可译作“赦免”或“除去”。这里的希伯来语动词可表示遮盖罪责、除罪或赦免。
    reason: lexical_alternative
  - marker: c
    text: 也可译作“愿他们在你面前跌倒”。原文形式可带有被动或使役意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代汉语读者熟悉的专名形式，明确指向以色列上帝的圣名。
- source_word: עֲצָתָם
  choice: 他们……所设的一切计谋
  rationale: עֵצָה可指筹划、计策或谋略；上下文带有谋害之意，“计谋”自然体现敌对语境。
- source_word: עָלַי לַמָּוֶת
  choice: 为置我于死地
  rationale: 希伯来语直译近于“针对我、为了死亡”；此译明确其致死目的，同时不具体说明谋杀手段。
- source_word: תְּכַפֵּר עַל עֲוֺנָם
  choice: 遮盖他们的罪孽
  rationale: כפר在此可表达遮盖、除罪或赦免；正文保留“遮盖”的具体意象，脚注说明“赦免”的可能译法。
- source_word: עֲוֺנָם
  choice: 他们的罪孽
  rationale: 兼顾过犯及罪责含义，并与下一分句的“罪”保持词汇区别。
- source_word: חַטָּאתָם
  choice: 他们的罪
  rationale: 采用自然且稳定的对应词，并保留原文与“罪孽”并列的表达。
- source_word: תֶּמְחִי
  choice: 涂抹
  rationale: 保留擦除记录或从眼前除去的意象。
- source_word: מִלְּפָנֶיךָ
  choice: 从你面前
  rationale: 保留原文的空间性惯用语，也可传达罪仍陈列在上帝面前、等待审断的意味。
- source_word: וְהָיוּ מֻכְשָׁלִים לְפָנֶיךָ
  choice: 愿他们在你面前被绊倒
  rationale: 以祈愿句呈现该分句的意愿语气，并用被动形式反映Hophal词形所带的被动或使役色彩。
- source_word: בְּעֵת אַפְּךָ
  choice: 你发怒的时候
  rationale: 将“鼻子”所构成的希伯来语愤怒惯用语按现代汉语自然表达为“发怒”，保留时间结构。
- source_word: עֲשֵׂה בָהֶם
  choice: 求你对付他们
  rationale: 原文简短，直义近于“向他们行事”；“对付他们”自然表达此处敌对、审判性的语力，又不擅自指定惩罚方式。
theological_decisions:
- issue: 是否弱化咒诅性祈求
  choice: 保留先知请求上帝不遮盖、不涂抹仇敌之罪，并在怒中对付他们的直接语气。
  alternative: 将祈求弱化为对审判的客观描述，或使用较温和措辞。
  rationale: 原文的禁令和祈愿语气鲜明；译文应保留这段祷告在神学与情感上的张力，不因读者可能感到不适而加以缓和。
- issue: כפר的神学含义
  choice: 正文译作“遮盖”，保留其具体意象。
  alternative: 译作“赦免”或“为……赎罪”。
  rationale: 该动词语义可涉及遮盖、除罪、赎罪或赦免。正文不把多义性完全归结为某一系统神学术语，并在脚注列出自然的语境译法。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。以“耶和华啊”和“求你”呈现祷告语体；保留“遮盖”“涂抹”“从你面前”等原文意象，同时用“置我于死地”“对付他们”保证普通读者容易理解。
