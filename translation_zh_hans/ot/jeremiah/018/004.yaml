base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/018/004.yaml
  text: And the vessel that he was making from the clay was spoiled in the potter’s hand[a], and he turned and made it into another vessel[b], as seemed right in the potter’s eyes to make.
translation:
  language: zh_hans
  text: 陶匠正在用泥制作的器皿在陶匠手中变坏了[a]；他又把它做成另一个器皿，照陶匠看为合宜的去制作[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “变坏了”也可译作“损坏了”“毁坏了”或“有了瑕疵”。原文动词表示器皿在陶匠制作时变得有缺陷或毁损；经文没有说明其具体原因。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“照在陶匠眼中为正的去制作”，是指照陶匠认为合适、妥当的去制作。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנִשְׁחַת
  choice: 做坏了
  rationale: 此处שׁחת的尼法勒式表示器皿在制作过程中变坏、受损或不成形。“做坏了”符合现代汉语制陶语境，也保留结果意味，不额外断定损坏的具体原因。
- source_word: הַכְּלִי
  choice: 器皿
  rationale: כְּלִי泛指器具；在制陶场景中，“器皿”准确、自然，并保持原文用词的宽泛性。
- source_word: אֲשֶׁר הוּא עֹשֶׂה בַּחֹמֶר
  choice: 用泥做的
  rationale: 分词עֹשֶׂה表达正在进行的制作过程，בַּחֹמֶר指出所用材料。汉语用“用泥做的”简洁自然；后文“做坏了”已显出制作尚在过程中。
- source_word: בְּיַד הַיּוֹצֵר
  choice: 在他手中
  rationale: 保留器皿在陶匠手中受塑造的具体画面；“他”紧承句首“陶匠”，避免汉语中不必要的重复。
- source_word: וְשָׁב וַיַּעֲשֵׂהוּ
  choice: 他就重新把它做成
  rationale: שׁוּב在此表示再次、重新采取行动，并非空间上的返回。“重新”准确表达再造过程；“它”保留希伯来文宾语后缀对先行对象的指代，不把它明确改释为泥团。
- source_word: כְּלִי אַחֵר
  choice: 另一个器皿
  rationale: 直译原文，表明陶匠将原先做坏的对象改造成另一件器皿，而不具体规定其形状或用途。
- source_word: כַּאֲשֶׁר יָשַׁר בְּעֵינֵי הַיּוֹצֵר לַעֲשׂוֹת
  choice: 照自己看为合宜的去做
  rationale: “在某人眼中为正”是表示某人认为合适、妥当的希伯来习语。“看为合宜”保留其判断意味，又避免将יָשַׁר仅限于道德上的正义。
theological_decisions:
- issue: 陶匠意象及其后续神学含义
  choice: 只呈现陶匠重做器皿的具体场景，不在本节明说它象征上帝对个人或民族的主权。
  alternative: 直接释义为上帝有权重塑人或国家。
  rationale: 本节本身仍是先知所见的制陶场景，其神学应用在下文才得到说明。保留具体意象可避免提前消解经文的铺陈和张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“器皿”“陶匠”“合宜”兼顾经文语体与普通读者的可理解性；保留“在他手中”的具象表达，并以“重新”自然传达希伯来文שׁוּב在此处的重复行动含义。
