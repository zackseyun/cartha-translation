  yaml_path: translation/ot/jeremiah/018/016.yaml
  text: making their land a desolation[a], an object of perpetual hissing[b]; everyone who passes by it will be appalled and shake his head.
translation:
  language: zh_hans
  text: 使他们的土地成为荒凉，成为永远受人嘘声的对象[a]；凡从那里经过的人都必惊骇，摇头[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“永远的嘘声”或“永远受人吹哨的对象”。希伯来语指人面对荒废之地所发的声音，可能带有讥诮、惊异或厌弃的意味。
    reason: lexical_alternative
  - marker: b
    text: “摇头”是希伯来语中的一种姿势，可表示讥诮、惊异，或面对毁灭时的悲叹。
    reason: cultural_note
lexical_decisions:
- source_word: לָשׂוּם
  choice: 使
  rationale: 不定式结构承接上文，可表示目的或结果；中文用“使”自然连接前句，并保留两者之间的张力。
- source_word: אַרְצָם
  choice: 他们的土地
  rationale: 直译所属后缀，指受审判之民的土地；“土地”符合先知审判语境。
- source_word: לְשַׁמָּה
  choice: 荒凉
  rationale: שַׁמָּה在审判语境中主要指荒废、毁坏的状态；“荒凉”简洁而庄重。
- source_word: שרוקת עוֹלָם
  choice: 永远令人嗤笑
  rationale: שרוקת指人面对废墟所发的嘘声或哨声，常带讥诮、惊异意味；意译为“令人嗤笑”使现代读者易懂，脚注保留声音意象及其他可能。עוֹלָם在此表示长久持续，译作“永远”。
- source_word: כֹּל עוֹבֵר עָלֶיהָ
  choice: 凡从那里经过的人
  rationale: 指所有经过这片土地的路人；用“那里”避免照搬希伯来语阴性代词。
- source_word: יִשֹּׁם
  choice: 都必惊骇
  rationale: שמם的Qal在此描述目睹毁灭者震惊、骇异的反应；“惊骇”兼具震惊与恐惧色彩。
- source_word: וְיָנִיד בְּרֹאשׁוֹ
  choice: 摇头叹息
  rationale: 字面为“摇他的头”，是表达讥诮、惊异或悲叹的文化性动作；正文以“摇头叹息”传达其自然中文语感，脚注说明语义范围。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的普通话。分号保留本节由土地的结局转向路人反应的结构。“永远令人嗤笑”以通顺中文呈现声音意象，同时用脚注保留“发嘘声／吹哨”的字面可能；“摇头叹息”使动作在中文中自然，脚注则避免把其情感单一定为悲伤。
