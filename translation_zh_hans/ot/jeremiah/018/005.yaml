  text: Then the word of Yahweh came to me[a], saying[b],
translation:
  language: zh_hans
  text: 随后[b]，雅威[a]的话临到我，说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “雅威”是希伯来文 יְהוָה（YHWH）这一神名的音译；传统汉译常作“耶和华”。
    reason: alternative_reading
  - marker: b
    text: 希伯来文直译可作：“事情发生了；雅威的话临到我，说。”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: 随后……临到
  rationale: 该叙事形式推进事件次序；现代汉语用“随后”自然表达承接关系，并由全句的“临到”承载动词意义，避免生硬的“事情发生了”。
- source_word: דְבַר
  choice: 话
  rationale: 在先知书的固定表达中，דָּבָר指来自上帝的话语或信息；“话”既贴近原文，也保留庄重而熟悉的先知性用语。
- source_word: יְהוָה
  choice: 雅威
  rationale: 原文使用上帝的专名四字神名；“雅威”以现代汉语音译保留其作为专名的性质，而不以称号替代。
- source_word: אֵלַי
  choice: 临到我
  rationale: 介词加第一人称单数词尾表示话语来到耶利米这里；“临到我”是自然且庄重的现代汉语圣经表达。
- source_word: לֵאמֹר
  choice: 说：
  rationale: 该不定式引出下一节的直接话语；译作“说：”简洁清楚，冒号表明下文内容尚待展开。
theological_decisions:
- issue: 如何翻译神名 יְהוָה
  choice: 雅威
  alternative: 耶和华；主
  rationale: 此处原文直接使用以色列上帝的专名。译作“雅威”保留专名，并避免用“主”这一称号取代原文；“耶和华”虽是汉语传统译名，但较不贴近通常重构的读音。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“随后”承接上文叙事；“话临到我”保留先知书公式化表达。“说：”用冒号引向下一节，未补入原文没有的内容。
