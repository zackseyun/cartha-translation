  text: לָ/כֵ֗ן כֹּ֚ה אָמַ֣ר יְהוָ֔ה שַֽׁאֲלוּ נָא֙ בַּ/גּוֹיִ֔ם מִ֥י שָׁמַ֖ע כָּ/אֵ֑לֶּה שַֽׁעֲרֻרִת֙ עָשְׂתָ֣ה מְאֹ֔ד בְּתוּלַ֖ת יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/018/013.yaml
  text: 'Therefore thus says Yahweh: Ask now among the nations[b][a], who has heard such things? Virgin Israel has done a very horrible thing.'
translation:
  language: zh_hans
  text: 因此，雅威如此说：“你们去列国中问问吧：谁听说过这样的事？童贞的以色列竟做出了极其骇人的事！”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לָכֵן
  choice: 因此
  rationale: 承接上文的指控，并引出由此而来的神谕结论。
- source_word: כֹּה אָמַר יְהוָה
  choice: 雅威如此说
  rationale: 保留先知传信公式，并将神名יהוה音译为“雅威”。
- source_word: שַׁאֲלוּ נָא בַּגּוֹיִם
  choice: 你们去列国中问问吧
  rationale: 复数命令式译作“你们……问”；“吧”和重叠式“问问”自然传达נָא所带的敦促语气。
- source_word: מִי שָׁמַע כָּאֵלֶּה
  choice: 谁听说过这样的事？
  rationale: 保留反问及כָאֵלֶּה的比较指示意义，同时符合现代汉语习惯。
- source_word: שַׁעֲרֻרִת עָשְׂתָה מְאֹד
  choice: 竟做出了极其骇人的事
  rationale: “骇人的事”表达该罕见名词所指的可怖、骇异之举；“极其”对应מְאֹד，“竟”凸显原句的震惊和反常意味。
- source_word: בְּתוּלַת יִשְׂרָאֵל
  choice: 以色列处女
  rationale: 按原文保留对以色列的拟人化称谓，不增补原文没有的“女儿”。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华／主
  rationale: 原文明确使用四字神名；音译“雅威”直接保留其专名性质。
- issue: בְּתוּלַת יִשְׂרָאֵל的理解
  choice: 以色列处女
  alternative: 处女以色列／以色列的处女
  rationale: 将其视为对以色列民族的拟人称号，既不把它改释成某个个体，也不添加“女儿”等原文没有的成分。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“列国”保留先知文学语域；引语中的反问和感叹体现原文强烈的震惊与谴责。
