  text: הַ/דָּבָר֙ אֲשֶׁ֣ר הָיָ֣ה אֶֽל יִרְמְיָ֔הוּ מֵ/אֵ֥ת יְהוָ֖ה לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/018/001.yaml
  text: The word that came to Yirmeyahu from Yahweh[a], saying,
translation:
  language: zh_hans
  text: 雅威的话临到耶利米[a]，说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文名作“耶利米雅”（Yirmeyahu）；中文传统译作“耶利米”。
    reason: 说明原文人名形式与中文传统译名之间的关系。
lexical_decisions:
- source_word: הַדָּבָר
  choice: 话
  rationale: דָּבָר 在先知领受启示的固定表达中指来自上帝的话语或信息；译作“话”既直接，又保留其与随后宣告内容的联系。
- source_word: אֲשֶׁר הָיָה אֶל
  choice: 临到
  rationale: “话临到某人”是希伯来先知文献中表示启示来到先知的惯用结构；中文“临到”简洁、庄重，也能表达启示主动来到的意味。关系词 אֲשֶׁר 在中文中无需逐字另译。
- source_word: יִרְמְיָהוּ
  choice: 耶利米
  rationale: 采用现代中文圣经及一般读者熟悉的传统译名；脚注注明其希伯来文名的形式。
- source_word: מֵאֵת יְהוָה
  choice: 雅威的
  rationale: מֵאֵת 表明来源；中文以领属结构“雅威的话”自然表达这话来自雅威。יְהוָה 是上帝的专名，音译为“雅威”，不以称号替代。
- source_word: לֵאמֹר
  choice: 说
  rationale: 该词引出下一节的直接话语；译作“说”并加冒号，清楚保留其承接功能。
theological_decisions:
- issue: 上帝专名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名 יְהוָה。译作“雅威”保留其专名性质，并避免以“主”这一称号取代；“耶和华”则是中文传统中另一种常见形式。
translation_notes:
  register: 采用简洁、庄重而自然的现代汉语。“雅威的话临到……”保留先知书启示公式的特点；句末用冒号表明本句引出下一节内容。
