  terminology: ‘性命’准确处理נפש在生命受威胁语境中的意思；‘烈怒’恰当表达חמה的强度，未附加系统神学含义；‘为他们说好话’自然呈现代求，脚注充分说明可有的语义侧重。脚注标记均有对应锚点，内容与正文一致。
