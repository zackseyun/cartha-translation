id: JER.18.20
reference: Jeremiah 18:20
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: הַ/יְשֻׁלַּ֤ם תַּֽחַת טוֹבָה֙ רָעָ֔ה כִּֽי כָר֥וּ שׁוּחָ֖ה לְ/נַפְשִׁ֑/י זְכֹ֣ר עָמְדִ֣/י לְ/פָנֶ֗י/ךָ לְ/דַבֵּ֤ר עֲלֵי/הֶם֙ טוֹבָ֔ה לְ/הָשִׁ֥יב אֶת חֲמָתְ/ךָ֖ מֵ/הֶֽם־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/018/020.yaml
  text: Should evil be repaid for good? For they have dug a pit for my life[a]. Remember that I stood before you to speak good on their behalf[b], to turn your wrath away from them.
translation:
  language: zh_hans
  text: 难道要以恶报善吗？他们竟挖了坑，要害我的性命[a]。求你记念：我曾站在你面前，为他们说好话[b]，使你的烈怒转离他们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“为我的生命挖了坑”。这里的希伯来词常在致命危险的语境中指人的“生命”或“本人”。
    reason: lexical_alternative
  - marker: b
    text: 或译“为他们的好处说话”或“说他们的好话”。这里是指耶利米在上帝面前为他们代求。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַיְשֻׁלַּם תַּחַת טוֹבָה רָעָה
  choice: 难道要以恶报善吗
  rationale: 保留Pual未完成式所构成的反问及被动偿报含义；汉语成语“以恶报善”自然、凝练，也完整呈现善恶对照。
- source_word: כִּי
  choice: 他们竟
  rationale: 此处说明反问的事实依据；现代汉语不必机械译出连接词，以“竟”表达先知对恶意回报的震惊，并顺畅承接上句。
- source_word: כָר֥וּ שׁוּחָ֖ה
  choice: 挖了坑
  rationale: 直译该惯用搭配，坑在语境中带有陷阱意味，但正文不额外补入“陷阱”，以保留原文意象。
- source_word: לְנַפְשִׁי
  choice: 要害我的性命
  rationale: נֶפֶשׁ在受致命威胁的语境中指生命或本人；“性命”清楚表达危险，避免误导为非物质灵魂。
- source_word: זְכֹר עָמְדִי לְפָנֶיךָ
  choice: 求你记念：我曾站在你面前
  rationale: 保留向上帝发出的命令式祈求，以及“站在你面前”的代求姿态；加“求”符合现代汉语祷告语体。
- source_word: לְדַבֵּר עֲלֵיהֶם טוֹבָה
  choice: 为他们说好话
  rationale: 保留介词短语可能兼具“为他们的益处说话”和“说关于他们的好话”的空间；正文自然表达其代求性质，脚注交代其他译法。
- source_word: לְהָשִׁיב אֶת חֲמָתְךָ מֵהֶם
  choice: 使你的烈怒转离他们
  rationale: 体现Hiphil使役含义和מֵהֶם的离开方向；“烈怒”传达חֵמָה在审判语境中的强度。
theological_decisions:
- issue: חֲמָה所表达的上帝之怒
  choice: 烈怒
  alternative: 愤怒；震怒
  rationale: “烈怒”保留审判语境中的强烈程度，但不把该词扩展为经文本身没有明说的系统神学概念。
- issue: נֶפֶשׁ的语境含义
  choice: 性命
  alternative: 灵魂；我本人
  rationale: 上下文涉及敌人挖坑谋害耶利米，重点是其生命遭受威胁，而非身体与灵魂的二分。
- issue: לְדַבֵּר עֲלֵיהֶם טוֹבָה的代求性质
  choice: 为他们说好话
  alternative: 为他们的好处说话；说他们的好话
  rationale: 让上下文所显出的代求方向自然可见，同时用脚注保留希伯来表达在受益者与谈论对象之间的语义张力。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语体。“难道要以恶报善吗”保留反问力度；“求你记念”符合普通读者熟悉的经文表达。“性命”比“灵魂”更准确地呈现此处的生命危险。
