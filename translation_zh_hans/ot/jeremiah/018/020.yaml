  source_fidelity: 译文忠实反映希伯来文的反问句、善恶报应的对比、敌人挖坑谋害说话人、先知在上帝面前为他们求益处，以及求上帝使其烈怒离开他们。‘要害我的性命’虽将‘为我的性命挖坑’的字面表达意译为谋害意图，但符合陷坑意象在本语境中的含义，脚注也保留了较直译的可能。
