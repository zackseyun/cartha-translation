base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/018/006.yaml
  text: Can I not do with you[a], house of Israel, as this potter does? declares Yahweh. Look, like clay in the hand of the potter, so are you in my hand, house of Israel.
translation:
  language: zh_hans
  text: 耶和华说：“以色列家啊，我难道不能像这陶匠一样对待你们吗？看哪，你们在我手中，就像泥在陶匠手中一样，以色列家啊。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֲכַיּוֹצֵר הַזֶּה לֹא אוּכַל לַעֲשׂוֹת לָכֶם
  choice: 我难道不能像这个陶匠一样处置你们吗
  rationale: 保留反问所表达的能力与权柄，也保留陶匠比喻。לַעֲשׂוֹת לָכֶם含义宽泛；“处置你们”在现代汉语中自然，并不限定行动是施恩还是降罚。
- source_word: בֵּית יִשְׂרָאֵל
  choice: 以色列家
  rationale: 保留先知书中这一正式、集体性的称呼，而不简化为“以色列”。
- source_word: נְאֻם יְהוָה
  choice: 耶和华说
  rationale: 以庄重而自然的现代汉语表达先知宣告公式，并将四字神名译为“耶和华”。
- source_word: הִנֵּה
  choice: 看哪
  rationale: 保留提示听者注意的强调作用；“看哪”虽较庄重，但在现代圣经语体中清楚易懂。
- source_word: כַחֹמֶר בְּיַד הַיּוֹצֵר כֵּן אַתֶּם בְּיָדִי
  choice: 泥在陶匠手中怎样，你们在我手中也怎样
  rationale: 用汉语“怎样……也怎样”的对应结构清楚再现כ...כן的明喻关系，并完整保留“手中”的权柄意象。
theological_decisions:
- issue: 陶匠与泥的比喻所表达的神圣主权
  choice: 直接保留耶和华对以色列拥有如陶匠对泥一般权柄的比喻
  alternative: 将其解释为绝对预定，或弱化为单纯的照料与塑造
  rationale: 经文本身强调耶和华采取行动的权能，却未在本节内界定一套完整的决定论，也未把行动限定为慈爱塑造；译文因此不替文本消除张力。
- issue: לַעֲשׂוֹת לָכֶם所指行动的性质
  choice: 译作“处置你们”，不明确限定为赐福或惩罚
  alternative: 译作“惩罚你们”或“塑造你们”
  rationale: 上下文中的陶匠可以重做器皿，但该短语本身宽泛；采用中性的“处置”避免加入原文未明说的行动结果。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。保留“以色列家”“看哪”等先知书语体，同时避免艰涩古语。将重复呼语“以色列家啊”在句首和句末都保留下来，以呈现原文的强调与修辞包围。
