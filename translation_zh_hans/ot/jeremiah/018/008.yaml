  text: וְ/שָׁב֙ הַ/גּ֣וֹי הַ/ה֔וּא מֵ/רָ֣עָת֔/וֹ אֲשֶׁ֥ר דִּבַּ֖רְתִּי עָלָ֑י/ו וְ/נִֽחַמְתִּי֙ עַל הָ֣/רָעָ֔ה אֲשֶׁ֥ר חָשַׁ֖בְתִּי לַ/עֲשׂ֥וֹת לֽ/וֹ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/018/008.yaml
  text: And if that nation turns from its evil[a], against which I spoke[c][b], then I will relent concerning the disaster that I planned to do to it.
translation:
  language: zh_hans
  text: 如果那一国——就是我曾宣告要惩罚它的那一国——离开自己的恶行[a]，我就会改变心意[b]，不把我原先打算施加给它的灾祸[c]降在它身上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “离开”也可译作“转离”或“回转”。希伯来语动词的本义是“转回、返回”。
    reason: lexical_alternative
  - marker: b
    text: “改变心意”也可译作“转意”或“宽免”。这里指上帝不再施行所宣布的灾祸。
    reason: alternative_reading
  - marker: c
    text: “恶行”和“灾祸”在希伯来语中出自同一词族；前者指道德上的恶，后者指临到该国的灾难。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁב
  choice: 如果……离开
  rationale: שׁוּב本义为“转回、返回”。本节承接上一节的条件结构，因此明示“如果”；“离开自己的恶行”在现代汉语中自然地表达道德上的转离，同时保留转向的意象。
- source_word: הַגּוֹי הַהוּא
  choice: 那一国
  rationale: גּוֹי通常指“国、民族”；此处以整体为行动主体，“那一国”简洁自然。
- source_word: מֵרָעָתוֹ
  choice: 离开自己的恶行
  rationale: רָעָה在此指该国道德上的恶。“恶行”比单说“恶”更自然，也与后文指灾难的同词形成可由脚注说明的语义转换。
- source_word: אֲשֶׁר דִּבַּרְתִּי עָלָיו
  choice: 我曾宣告要攻击的那一国
  rationale: דבר על可指针对某对象发言；在审判语境中译作“宣告要攻击”传达敌对、审判性的言说，并使汉语关系结构清楚。
- source_word: וְנִחַמְתִּי
  choice: 那么，我就会回心转意
  rationale: נחם在此表示撤回已经宣告的审判行动，而不是承认道德过错。“回心转意”是普通读者易懂的现代汉语，并保留上帝因人的转离而作出回应这一张力。
- source_word: עַל הָרָעָה
  choice: 不把……灾祸降下
  rationale: 此处רָעָה指惩罚性的灾祸，不是道德之恶。汉语以否定结果表达“就此灾祸回心转意”，更为自然。
- source_word: אֲשֶׁר חָשַׁבְתִּי
  choice: 原先打算
  rationale: חשב在此为“计划、打算”；“原先打算”清楚表达先前的意向。
- source_word: לַעֲשׂוֹת לוֹ
  choice: 降给它
  rationale: 字面是“对它施行”。与“灾祸”搭配时，“降给它”符合自然汉语，并准确表达临到该国的惩罚。
theological_decisions:
- issue: 如何表达上帝的נחם
  choice: 回心转意，不把……灾祸降下
  alternative: 后悔；改变心意；收回成命
  rationale: “后悔”容易让读者误解为上帝承认道德错误；“收回成命”又过于制度化。“回心转意”保留原文所呈现的真实回应性，不把其神学张力消解掉，后半句则明确这种回应是撤回所宣告的灾祸。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“那一国”“恶行”“灾祸”分别清楚呈现集体主体、道德之恶与惩罚性灾难；用条件句承接上一节。正文的两个脚注标记均已出现。
