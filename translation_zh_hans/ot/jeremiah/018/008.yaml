  naturalness: “如果那一国离开自己的恶行，就是我曾宣告要攻击的那一国”关系结构不够顺畅，读者须回读才能确定“那一国”是关系从句的先行词。改用破折号插入说明，可保持原文的指代关系并使句子清楚自然。
