base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/018/022.yaml
  text: Let a cry be heard from their houses when you suddenly bring a raiding band upon them[b][a], for they have dug a pit to capture me and hidden traps for my feet.
translation:
  language: zh_hans
  text: 当你使一队劫掠者[a]突然临到他们时，愿哀号声从他们的房屋中传出！因为他们挖了坑要捕捉我，又为我的脚暗设了圈套[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “一队劫掠者”或译“军队”或“突袭队”。
    reason: lexical_alternative
  - marker: b
    text: “圈套”或译“网罗”。
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּשָּׁמַע
  choice: 愿……传出
  rationale: 该词为被动未完成式；在本段祈求审判的语境中具有祈愿语气。“愿……传出”既保留被动含义，也自然表达祈求的力度。
- source_word: זְעָקָה
  choice: 哀号声
  rationale: 该名词指人在危难中的呼喊；“哀号声”明确传达痛苦和灾祸中的呼声，又不过度限定具体声音。
- source_word: מִבָּתֵּיהֶם
  choice: 从他们的房屋中
  rationale: 保留介词所表达的空间来源，也保留“房屋”这一具体意象。
- source_word: כִּי（第一次）
  choice: 当……时
  rationale: 此处引出哀号声传出时的情境；按时间关系译为“当……时”比因果连接更符合上下文。
- source_word: תָבִיא
  choice: 你使……临到
  rationale: 使役式表达“使之来到、带来”；这里以“使……临到”自然呈现上帝使袭击者来到他们那里的意思。
- source_word: גְּדוּד
  choice: 一队劫掠者
  rationale: 该词可指军队、武装队伍或劫掠队；本处语境带有突袭和掠夺意味，“一队劫掠者”具体而自然。
- source_word: פִּתְאֹם
  choice: 突然
  rationale: 直接保留动作出乎意料、迅速发生的含义。
- source_word: כִּי（第二次）
  choice: 因为
  rationale: 第二个连接词说明先知如此祈求的理由，即他们曾设谋陷害他。
- source_word: כָרוּ שיחה
  choice: 挖了坑
  rationale: 动词与名词共同构成挖掘陷阱坑的图像；“挖了坑”简洁保留原文隐喻。
- source_word: לְלָכְדֵנִי
  choice: 要捕捉我
  rationale: 不定式表达目的；“捕捉”与坑和圈套的意象相互呼应。
- source_word: וּפַחִים טָמְנוּ לְרַגְלָי
  choice: 又在我脚前暗设圈套
  rationale: פַחִים 指捕捉用的网罗或圈套，טָמְנוּ 指隐藏、暗设；该译法以自然汉语保留针对先知脚步所设陷阱的图像。
theological_decisions:
- issue: 耶利米祈求审判的语气
  choice: 保留为直接祈愿：“愿哀号声……传出”
  alternative: 译作单纯预言：“哀号声必……传出”
  rationale: 本节处于耶利米祈求审判的语境，未完成式在此具有祈愿色彩。译为直接祈愿可保留原文的修辞和神学张力，不把它弱化为中性的未来陈述。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“愿……传出”保留祈愿语气；“哀号声”“劫掠者”“暗设圈套”保持诗性与具体意象，同时避免古奥表达。
