  text: הַקְשִׁ֥יבָ/ה יְהוָ֖ה אֵלָ֑/י וּ/שְׁמַ֖ע לְ/ק֥וֹל יְרִיבָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/018/019.yaml
  text: Pay attention to me[a], O Yahweh, and hear the voice of my adversaries.
translation:
  language: zh_hans
  text: 耶和华啊，求你留心听我，也听与我相争之人的声音。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译：“听与我相争之人的声音。”这既可指听他们对耶利米的控诉，也可指留意他们敌对的谋划。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַקְשִׁיבָה
  choice: 求你留心听
  rationale: 该词是קשׁב的使役式命令形，表示专注垂听，而不只是听见；加“求”符合汉语祈求语气。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代简体中文读者熟悉的专名形式音译四字神名，不以“主”这一称号替代。
- source_word: אֵלַי
  choice: 我
  rationale: 原文介词带第一人称单数后缀，直指说话者；在“留心听我”中自然表达其方向关系。
- source_word: וּשְׁמַע
  choice: 也听听
  rationale: שׁמע的命令形意为“听”；“也”承接前一祈使句，“听听”在现代汉语中既自然又可保留其请求语气。
- source_word: לְקוֹל
  choice: ……的话
  rationale: קוֹל字面为“声音”；此处“听……的话”是自然汉语表达，同时仍可涵盖控诉、言论或敌对谋划所发出的声音。
- source_word: יְרִיבָי
  choice: 与我争辩之人
  rationale: 该词源于ריב，指同说话者争辩、相争或控告的人；此译保留其广度，不限定为法庭上的“控告者”，也不笼统弱化为一般“敌人”。
theological_decisions:
- issue: 四字神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用神的专名。中文正文采用通行且易识别的“耶和华”，保留专名性质而不改译为称号“主”；“雅威”是另一种较贴近现代学术重构读音的音译。
- issue: “听与我争辩之人的声音”所指为何
  choice: 保留为可指他们所说的话、控诉或敌对言论的宽泛表达
  alternative: 明确译作“听他们对我的控告”或“察看他们的阴谋”
  rationale: 上下文容许法庭式控诉与敌对谋划两方面，原句本身没有明确限定，因此正文不替读者消除这层张力。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语体。“求你”传达希伯来语命令式在向上帝祈求时的语用功能；两个“听”保留原文平行结构。脚注标记置于相关整句之后。
