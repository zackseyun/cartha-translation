id: JER.18.11
reference: Jeremiah 18:11
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/עַתָּ֡ה אֱמָר נָ֣א אֶל אִישׁ יְהוּדָה֩ וְ/עַל יוֹשְׁבֵ֨י יְרוּשָׁלִַ֜ם לֵ/אמֹ֗ר כֹּ֚ה אָמַ֣ר יְהוָ֔ה הִנֵּ֨ה אָנֹכִ֜י יוֹצֵ֤ר עֲלֵי/כֶם֙ רָעָ֔ה וְ/חֹשֵׁ֥ב עֲלֵי/כֶ֖ם מַֽחֲשָׁבָ֑ה שׁ֣וּבוּ נָ֗א אִ֚ישׁ מִ/דַּרְכּ֣/וֹ הָֽ/רָעָ֔ה וְ/הֵיטִ֥יבוּ דַרְכֵי/כֶ֖ם וּ/מַעַלְלֵי/כֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/018/011.yaml
  text: 'Now therefore[a], say to the men of Judah and to the inhabitants of Jerusalem, saying, ‘Thus says Yahweh: Behold, I am shaping disaster against you and devising a plan against you. Turn back, please, each man from his evil way[c][b], and make your ways and your deeds good.’'
translation:
  language: zh_hans
  text: “所以现在，你要对犹大人和耶路撒冷的居民说：‘耶和华如此说：看哪，我正在塑造要临到你们的灾祸，也在筹划计谋来对付你们。请你们各人回转，离开自己的恶道[a]，使你们的道路和行为变好。’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文是“各人离开自己的恶道”；“各人”是逐一分配的说法，表示群体中的每一个人。
    reason: 说明希伯来语单数אִישׁ在此逐一指向群体成员。
lexical_decisions:
- source_word: וְעַתָּה
  choice: 所以现在
  rationale: 兼顾时间推进与承接上文窑匠比喻所得结论的语气。
- source_word: אֶל אִישׁ יְהוּדָה
  choice: 对犹大人
  rationale: אִישׁ在此作集合用法；现代汉语以“犹大人”自然表达群体，并未限定只有男性。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的专名形式表达四字神名，而不是以称号替代。
- source_word: יוֹצֵר עֲלֵיכֶם רָעָה
  choice: 正在塑造灾祸来攻击你们
  rationale: “塑造”保留与上下文窑匠意象及同一词根的呼应；“灾祸”在此指临到人的审判性祸患，而非道德邪恶。介词עַל保留敌对趋向。
- source_word: וְחֹשֵׁב עֲלֵיכֶם מַחֲשָׁבָה
  choice: 也在筹划计谋来对付你们
  rationale: 用“筹划计谋”体现希伯来语同根动词与名词所加强的刻意谋划意味；“对付”表达עַל在本语境中的不利指向。
- source_word: שׁוּבוּ נָא
  choice: 请你们……回转
  rationale: “回转”保留שׁוב的具体方向隐喻及其悔改含义；“请”体现נָא的恳切语气。
- source_word: אִישׁ מִדַּרְכּוֹ הָרָעָה
  choice: 各人……离开自己的恶道
  rationale: “各人”准确传达单数אִישׁ的逐一分配用法；“恶道”保留先知书中以道路喻行为方式的表达。
- source_word: וְהֵיטִיבוּ דַרְכֵיכֶם וּמַעַלְלֵיכֶם
  choice: 改正你们的道路和行为
  rationale: הֵיטִיבוּ在此为使之变好；“改正”符合现代汉语，同时保留“道路”和“行为”两个并列对象。
theological_decisions:
- issue: 上帝所“塑造”的רָעָה应如何表达
  choice: 灾祸
  alternative: 邪恶；祸患
  rationale: 上下文指上帝将施行的审判灾难，而非上帝在实施道德邪恶；“灾祸”既符合语境，也不抹去审判的严厉性。
- issue: שׁוב的悔改含义
  choice: 回转，离开
  alternative: 悔改；返回
  rationale: 保留原文空间隐喻，让“离开自己的恶道”在上下文中说明回转的伦理含义，而不直接用较为神学化的概括词取代。
- issue: אִישׁ的集合与分配用法
  choice: 犹大人……各人
  alternative: 犹大的男人……每个男人；犹大众人……每一个人
  rationale: 首处为集合用法，末处为分配用法。中文分别用“犹大人”和“各人”，既准确表达语法功能，也避免无根据地把受众缩限为成年男性。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。“看哪”保留先知宣告的郑重语气；“塑造”刻意呼应上下文窑匠塑造泥土的意象。引文层级清楚，避免古奥倒装。
