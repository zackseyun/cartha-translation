  text: ק֥וּם וְ/יָרַדְתָּ֖ בֵּ֣ית הַ/יּוֹצֵ֑ר וְ/שָׁ֖מָּ/ה אַשְׁמִֽיעֲ/ךָ֥ אֶת דְּבָרָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/018/002.yaml
  text: Arise and go down to the potter’s house[a], and there I will let you hear my words.
translation:
  language: zh_hans
  text: “起来，下到陶匠的家里去；在那里，我要使你听见我的话。[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在那里，我要让你听见我的话。”
    reason: “使你听见”严格保留希伯来语使役形式；“让你听见”在现代汉语中更自然，也可表达原文在该语境中的含义。
lexical_decisions:
- source_word: ק֥וּם
  choice: 起来
  rationale: 命令式，意为起身、站起来；“起来”既自然，也保留先知蒙命时庄重直接的语气。
- source_word: וְ/יָרַדְתָּ֖
  choice: 下到……去
  rationale: ירד具有向下行的方向含义，可能与耶路撒冷的地势有关；此译法保留该方向感，同时符合现代汉语表达。
- source_word: בֵּ֣ית הַ/יּוֹצֵ֑ר
  choice: 陶匠的家里
  rationale: 原文为“陶匠之家”的领属结构；结合下文陶匠制陶的场景，יוצר在此明确指陶匠。“家里”自然表达前往其所在房舍之意。
- source_word: וְ/שָׁ֖מָּ/ה
  choice: 在那里
  rationale: 保留原文对地点的强调，并自然承接前一命令。
- source_word: אַשְׁמִֽיעֲ/ךָ֥
  choice: 我要使你听见
  rationale: 这是שמע的使役形，字面为“使你听见”；译文保留使役语义，不简化为较具解释性的“我要告诉你”。
- source_word: אֶת דְּבָרָֽ/י
  choice: 我的话
  rationale: דברי在形式上是复数领属形式；汉语“我的话”可自然涵盖所说的话语，无须人为改成“我的信息”。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“起来”保留命令语气；“下到”保留地理方向；“使你听见”刻意保存原文使役结构及其可能的语义张力。
