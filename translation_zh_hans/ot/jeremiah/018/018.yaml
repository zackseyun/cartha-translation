reference: Jeremiah 18:18
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יֹּאמְר֗וּ לְכ֨וּ וְ/נַחְשְׁבָ֣ה עַֽל יִרְמְיָהוּ֮ מַחֲשָׁבוֹת֒ כִּי֩ לֹא תֹאבַ֨ד תּוֹרָ֜ה מִ/כֹּהֵ֗ן וְ/עֵצָה֙ מֵֽ/חָכָ֔ם וְ/דָבָ֖ר מִ/נָּבִ֑יא לְכוּ֙ וְ/נַכֵּ֣/הוּ בַ/לָּשׁ֔וֹן וְ/אַל נַקְשִׁ֖יבָה אֶל כָּל דְּבָרָֽי/ו־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/018/018.yaml
  text: Then they said[a], “Come, let us devise plans against Jeremiah, for instruction will not perish from the priest, nor counsel from the wise man, nor word from the prophet. Come, let us strike him with the tongue, and let us not pay attention to any of his words.”
translation:
  language: zh_hans
  text: 于是他们说：“来吧，我们来筹划对付耶利米的计谋；因为训诲不会从祭司那里断绝，谋略不会从智者那里断绝，话语也不会从先知那里断绝。来吧，我们要用言语攻击他[a]，不要理会他所说的一切。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“我们要用舌头击打他。”也可译为“我们要用舌头攻击他”；可能指以诽谤或控告等言语伤害他。
    reason: וְנַכֵּהוּ בַלָּשׁוֹן字面为“用舌头击打他”，是可指言语攻击的习语；其具体方式未明，故脚注保留诽谤或控告等可能性。
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: 于是他们说
  rationale: 未完成式加转换性瓦夫推进叙事；“于是”自然表达事件的承接与发展。
- source_word: לְכוּ
  choice: 来吧
  rationale: 这里是号召众人共同采取行动的祈使表达，现代汉语用“来吧”最自然。
- source_word: וְנַחְשְׁבָה ... מַחֲשָׁבוֹת
  choice: 我们来设谋
  rationale: 动词与同根名词连用，强调有意策划；“设谋”简洁保留敌对图谋的语气，避免生硬重复。
- source_word: עַל יִרְמְיָהוּ
  choice: 对付耶利米
  rationale: 上下文明显具有敌意，עַל表示谋划所针对的对象；“对付”比中性的“关于”准确。
- source_word: כִּי
  choice: 因为
  rationale: 引出他们自认为可以排斥耶利米的理由，保留解释性逻辑。
- source_word: לֹא תֹאבַד
  choice: 不会没有
  rationale: אָבַד在此指消失、断绝。汉语以三次“不会没有”统摄平行分句，清楚表达这些社会宗教资源不会因耶利米受害而断绝。
- source_word: תּוֹרָה
  choice: 教导
  rationale: 此处指祭司所提供的训诲，不宜限定为成文律法；“教导”符合其职能语境。
- source_word: מִכֹּהֵן
  choice: 祭司
  rationale: 希伯来文单数为代表性用法；汉语职业名词本身不必添加不定或定指标记。
- source_word: וְעֵצָה מֵחָכָם
  choice: 智者不会没有谋略
  rationale: עֵצָה可指建议、计策或谋略；在智者提供指导的平行结构中，“谋略”保留其分量，也与前文的敌对策划形成语义呼应。
- source_word: וְדָבָר מִנָּבִיא
  choice: 先知也不会没有话语
  rationale: דָבָר既可指话语也可指信息；“话语”保留先知性发言的广度及经文语感，不额外断定其必为神谕。
- source_word: וְנַכֵּהוּ בַלָּשׁוֹן
  choice: 我们用舌头攻击他
  rationale: 字面结构为“用舌头击打他”，是以言语伤害、控告或诽谤的形象说法；正文保留“舌头”的意象并用脚注说明可能含义。
- source_word: וְאַל נַקְשִׁיבָה אֶל כָּל דְּבָרָיו
  choice: 不要理会他所说的一切
  rationale: קשׁב אל表示留心听从或注意；“不要理会”在此能涵盖拒绝聆听与拒绝听从。
theological_decisions:
- issue: 祭司、智者和先知的代表性单数
  choice: 祭司、智者、先知
  alternative: 一位祭司、一个智慧人、一位先知
  rationale: 三个希伯来文名词均为代表性单数，指相应角色及其职能。汉语无需强加“一位”，也不必把智者的语法阳性刻意性别化；这样既忠实于单数类称功能，也避免加入原文未强调的性别含义。
- issue: 阴谋者关于教导、谋略和先知话语不会断绝的陈述
  choice: 按人物自身理由直接保留，不判定其神学真伪
  alternative: 将其解释为对宗教制度可靠性的正确宣告，或明确标成虚假自欺
  rationale: 这是阴谋者的直接引语，原文让其成为他们攻击耶利米的理由。译文不替叙述者判定这句话本身的真伪，保留其讽刺和神学张力。
- issue: דָבָר是否明确译作上帝的信息
  choice: 话语
  alternative: 神谕／上帝的信息
  rationale: 先知语境使其可能带有神谕色彩，但本节没有明说来源；“话语”保留这种可能性而不作过度阐释。
translation_notes:
  register: 采用现代、庄重而易懂的叙事与直接引语。“设谋”保留经文的凝练力度；三次“不会没有”再现希伯来文平行结构，并使逻辑关系在汉语中清晰。正文保留“舌头攻击”的原文意象，脚注提供自然释义。
