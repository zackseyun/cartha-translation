revisions:
- from: 但它若行我眼中看为恶的事，不听从我的话，我就会对原先说要赐给它的福改变心意。[a]
  to: 但它若行我眼中看为恶的事，不听从我的话，我就会改变心意[a]，不再施予我曾说要给它的恩惠。
  rationale: 修订保留条件句、“行恶”“不听从”及上帝对先前所宣告之福转意的全部语义。以“恩惠”取代句末孤立的“福”，并采用“不再施予”表达该转意所关乎的未来施惠，不暗示恩惠已经赐下又被收回。脚注缩限为对 נחם 的词汇说明，并移至相应词语之后。
