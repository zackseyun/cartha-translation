  text: וְ/עָשָׂ֤ה ה/רעה בְּ/עֵינַ֔/י לְ/בִלְתִּ֖י שְׁמֹ֣עַ בְּ/קוֹלִ֑/י וְ/נִֽחַמְתִּי֙ עַל הַ/טּוֹבָ֔ה אֲשֶׁ֥ר אָמַ֖רְתִּי לְ/הֵיטִ֥יב אוֹתֽ/וֹ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/018/010.yaml
  text: but if it does what is evil in my sight[a], not listening to my voice[b], then I will relent concerning the good that I said I would do to it.
translation:
  language: zh_hans
  text: 但它若行我眼中看为恶的事，不听从我的话，我就会改变心意[a]，不再施予我曾说要给它的恩惠。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“转意。”希伯来语动词可指对已宣告的行动方针改变心意或撤回。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשָׂה
  choice: 但它若行
  rationale: 承接第9节关于一国或一邦的条件句；希伯来语虽直译为“而它行”，汉语补出“若”以清楚表达上下文中的条件关系，并以“它”指集体性的国家或邦国。
- source_word: הָרָעָה בְּעֵינַי
  choice: 我眼中看为恶的事
  rationale: 保留“在我眼中”的希伯来语意象，同时用现代汉语自然表达这是上帝的判断。
- source_word: לְבִלְתִּי שְׁמֹעַ בְּקוֹלִי
  choice: 不听从我的话
  rationale: שׁמע בְּקוֹל 表示听从、顺从；“听从我的话”既传达服从之意，也保留声音/话语的表达层面。
- source_word: וְנִחַמְתִּי עַל הַטּוֹבָה
  choice: 我就会对……的福改变心意
  rationale: נחם 在此表示对已经宣告的行动转意或撤回；“改变心意”保留经文所呈现的真实条件性，又不暗示上帝犯了道德过错。הַטּוֹבָה 在此指原先应许的好处或福分。
- source_word: אֲשֶׁר אָמַרְתִּי לְהֵיטִיב אֹתוֹ
  choice: 原先说要赐给它的福
  rationale: היטיב 的使役形表示施惠、使之得好处；“赐给它的福”用自然汉语明确表达有利的行动，并以“它”承接国家或邦国。
theological_decisions:
- issue: 如何翻译用于上帝的 נחם
  choice: 改变心意
  alternative: 转意；收回原意；后悔
  rationale: 本节将先前宣告的福置于该国回应的条件之下。“改变心意”保留这种神学张力；“后悔”在现代汉语中容易使人误以为上帝承认道德错误，而“收回原意”又可能过度解释其结果。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“一国或一邦”的集体先行词在本节以“它”承接。脚注用于保留 נחם 的另一种自然译法及其行动层面的含义。
