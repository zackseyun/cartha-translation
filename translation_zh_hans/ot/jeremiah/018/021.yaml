source:
  edition: WLC
  text: לָ/כֵן֩ תֵּ֨ן אֶת בְּנֵי/הֶ֜ם לָ/רָעָ֗ב וְ/הַגִּרֵ/ם֮ עַל יְדֵי חֶרֶב֒ וְ/תִֽהְיֶ֨נָה נְשֵׁי/הֶ֤ם שַׁכֻּלוֹת֙ וְ/אַלְמָנ֔וֹת וְ/אַ֨נְשֵׁי/הֶ֔ם יִֽהְי֖וּ הֲרֻ֣גֵי מָ֑וֶת בַּח֣וּרֵי/הֶ֔ם מֻכֵּי חֶ֖רֶב בַּ/מִּלְחָמָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/018/021.yaml
  text: Therefore give their children over to famine[a], and hand them over to the power of the sword. Let their wives become bereaved and widowed, and let their men be slain by death[c][b], their young men struck down by the sword in battle.
translation:
  language: zh_hans
  text: 所以，求你使他们的儿女[a]遭受饥荒，把他们交在刀剑的权势下[b]。愿他们的妻子痛失儿女，成为寡妇；愿他们的成年男子被杀而死[c]，他们的青年男子在战场上被刀剑击杀。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “儿女”也可译作“儿子”；这里的希伯来语既可专指儿子，也可集合性地指儿女或后代。
    reason: lexical_alternative
  - marker: b
    text: 原文直译近于“把他们倾倒在刀剑之手上”；这是一个形象而较难确定的说法，表达把他们交给刀剑的权势。
    reason: source_idiom
  - marker: c
    text: 原文直译为“被死亡所杀的”或“被杀而死的”，是一个较难解释的希伯来语组合，强调致命的毁灭。
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: 所以
  rationale: 这是承接上文并引出结果或请求的推论连接词；“所以”在现代汉语中自然、清楚。
- source_word: תֵּן ... לָרָעָב
  choice: 使……遭受饥荒
  rationale: נתן与介词ל连用，表示把人交给某种命运或势力；汉语如此表达既自然，又保留任其受审判的含义。
- source_word: בְּנֵיהֶם
  choice: 他们的儿女
  rationale: בנים可狭义指“儿子”，也常集合性地指后代或儿女；正文采用较宽而自然的表达，并以脚注保留较窄的可能。
- source_word: וְהַגִּרֵם עַל יְדֵי חֶרֶב
  choice: 把他们交在刀剑的权势下
  rationale: 动词在此表达使人被交出、暴露于毁灭，后接字面为“在刀剑之手上”的拟人化习语；译文保留刀剑掌权的意象。
- source_word: שַׁכֻּלוֹת וְאַלְמָנוֹת
  choice: 痛失儿女，成为寡妇
  rationale: שַׁכֻּלוֹת指失去儿女的妇人，אַלְמָנוֹת指寡妇；明确译出两重家庭丧失，比笼统的“丧亲”更贴近原文。
- source_word: וְאַנְשֵׁיהֶם
  choice: 他们的男人
  rationale: 这里与妻子和青年并列，指群体中的成年男性；不宜径直缩窄为“丈夫”。
- source_word: הֲרֻגֵי מָוֶת
  choice: 被杀丧命
  rationale: 原文是罕见而强烈的“死亡所杀的／被杀而死”式表达；正文以略带叠加强调的汉语保留其致命意味，脚注说明字面难点。
- source_word: בַּחוּרֵיהֶם מֻכֵּי חֶרֶב בַּמִּלְחָמָה
  choice: 他们的青年在战场上倒在刀下
  rationale: בַּחוּרִים指正值壮年的青年男子；“倒在刀下”自然传达被刀剑击杀的被动含义，“在战场上”对应战争场景。
theological_decisions:
- issue: 向上帝直接祈求降下严厉审判
  choice: 保留命令式和祈愿式的直接请求，不淡化暴力内容
  alternative: 改写成将来的预言，或用委婉措辞减轻其严厉程度
  rationale: 希伯来文先用命令式，继而用祈愿意味的形式，记载耶利米直接求上帝施行审判。翻译应呈现这段祷告本有的修辞和神学张力，而不将其改成预测或替文本辩解。
translation_notes:
  register: 采用庄重而可懂的现代标准汉语。“求你”补明命令式在祷告语境中的恳求语气；后续用“愿……”保留祈愿色彩。句式保持先涉及儿女与妻子、再涉及成年男人和青年的递进结构。
