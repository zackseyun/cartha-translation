  yaml_path: translation/ot/jeremiah/018/003.yaml
  text: So I went down to the potter’s house[a], and there he was[b], doing work on the wheel.
translation:
  language: zh_hans
  text: 于是我下到陶匠家里；看哪，他正在转盘上做工。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “转盘”所译的希伯来语是双数形式，直译可作“两个轮盘”，指陶匠使用的轮盘装置。
    reason: cultural_note
lexical_decisions:
- source_word: וָאֵרֵד
  choice: 于是我下到
  rationale: 该形式承接叙事中的下一行动；“于是”自然表达顺承，“下到”保留 ירד 的方向含义。
- source_word: בֵּית הַיּוֹצֵר
  choice: 陶匠的作坊
  rationale: 字面为“陶匠的房屋”；在本语境中指陶匠工作的场所。“作坊”比“家”更自然，也不超出语境。
- source_word: וְהִנֵּהוּ
  choice: 看哪，他
  rationale: הִנֵּה 带有引人注意、呈现眼前景象的作用，后缀指向陶匠；“看哪”保留其鲜明的指示语气。
- source_word: עֹשֶׂה מְלָאכָה
  choice: 正在……做工
  rationale: 分词表达进行中的动作，名词 מְלָאכָה 表示工作；此译既保留进行性，也不擅自说明所制物件。
- source_word: עַל הָאָבְנָיִם
  choice: 在转盘上
  rationale: אָבְנַיִם 是双数形式，传统上指陶匠的双轮装置；现代汉语通常将整套装置自然地称为“转盘”。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“看哪”略带经文语体，用以保留原文 הִנֵּה 的突显作用；“陶匠的作坊”准确传达工作场所，“转盘”则兼顾汉语自然度与古代器具背景。
