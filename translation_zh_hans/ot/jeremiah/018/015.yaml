id: JER.18.15
reference: Jeremiah 18:15
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כִּֽי שְׁכֵחֻ֥/נִי עַמִּ֖/י לַ/שָּׁ֣וְא יְקַטֵּ֑רוּ וַ/יַּכְשִׁל֤וּ/ם בְּ/דַרְכֵי/הֶם֙ שְׁבִילֵ֣י עוֹלָ֔ם לָ/לֶ֣כֶת נְתִיב֔וֹת דֶּ֖רֶךְ לֹ֥א סְלוּלָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/018/015.yaml
  text: For my people have forgotten me[a]; they burn incense to emptiness. They have stumbled in their ways, in the ancient paths, to walk on side roads[d][c][b], on a road not built up.
translation:
  language: zh_hans
  text: 因为我的百姓忘记了我，向虚妄之物[a]烧香。他们在自己的道路上、在古老的路径[c]上被绊倒[b]，转去走岔路[d]，走一条未经修筑的路。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “虚妄之物”也可译作“虚空”“虚假之物”或“偶像”。希伯来语所用的词常指虚假、毫无价值的敬拜。
    reason: lexical_alternative
  - marker: b
    text: 原文动词按形态可直译为“他们使他们在自己的道路上、在古老的路径上绊倒”；施事在本句中没有清楚说明。正文用被动式保留使役意义，而不补出施事。
    reason: alternative_reading
  - marker: c
    text: “古老的路径”呼应耶利米书反复出现的意象，指上帝长久以来摆在百姓面前的道路；参6:16。
    reason: cross_reference
  - marker: d
    text: “岔路”也可译作“小径”“僻径”或“踪迹”。
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁכֵחֻנִי
  choice: 忘记了我
  rationale: 该词为שׁכח的Qal完成式，带第一人称单数宾语后缀；“忘记了我”直接保留百姓不再记念耶和华并背离他的关系性含义，不另作教义化解释。
- source_word: לַשָּׁוְא
  choice: 向虚妄之物
  rationale: שָׁוְא可指虚空、虚妄或虚假；在“烧香”的语境中指向毫无价值的敬拜对象。“虚妄之物”既符合现代汉语，又不把原文明确化为“偶像”或“假神”。
- source_word: יְקַטֵּרוּ
  choice: 烧香
  rationale: קטר的Piel形式常表示焚烧香料或使祭物冒烟；本处“烧香”最简洁自然，也符合敬拜语境。
- source_word: וַיַּכְשִׁלוּם
  choice: 他们……绊倒了
  rationale: 原形是使役式并带第三人称阳性复数宾语后缀，字面可理解为“他们使他们绊倒”；但施事在压缩的希伯来句法中并不明确。正文以不及物结果表达，避免在汉语中擅自补出“偶像”“假神”或其他施事，并以脚注保留主动使役读法。
- source_word: בְּדַרְכֵיהֶם
  choice: 在自己的道路上
  rationale: 保留介词ב的路径／范围意象；反身领属“自己的”在汉语中清楚表明该复数后缀指百姓。
- source_word: שְׁבִילֵי עוֹלָם
  choice: 古老的路径
  rationale: עוֹלָם在此修饰长期确立、历来存在的路径；“古老的路径”自然保留耶利米书中的道路意象，也不将其过度解释为抽象教义。
- source_word: לָלֶכֶת
  choice: 转去走
  rationale: הלך在道路比喻中宜译为“走”；“转去”按上下文显出从古老路径偏离而进入岔路的对比。
- source_word: נְתִיבוֹת
  choice: 岔路
  rationale: נְתִיבוֹת可指小径、路径或踪迹；它与“古老的路径”及“未经修筑的路”形成对照，因此“岔路”最能简洁表达偏离正道的空间意象。
- source_word: דֶּרֶךְ לֹא סְלוּלָה
  choice: 一条未经修筑的路
  rationale: סלל用于修筑、垫高或铺设道路；“未经修筑的路”保留具体的道路工程形象，又符合现代汉语。
theological_decisions:
- issue: לַשָּׁוְא所暗指的敬拜对象
  choice: 译作“虚妄之物”
  alternative: “偶像”、“假神”或“徒然地”
  rationale: 本节确实谴责虚假敬拜，但שָׁוְא本身的语义比“偶像”更宽。正文不把暗示改成明说，以保留原文“虚空／虚假／毫无价值”的张力。
- issue: וַיַּכְשִׁלוּם的施事与语态
  choice: 正文表达为“他们……绊倒了”，脚注保留主动使役读法
  alternative: “他们使他们绊倒”或补出“那些虚妄之物使他们绊倒”
  rationale: 希伯来语形态具有使役性和复数宾语，但近处施事并不清楚。汉语正文着重结果，避免擅自认定施事；脚注明示原文允许且形态上支持的主动译法。
- issue: “古老的路径”的价值指向
  choice: 保留道路意象，不直接释为“盟约之道”或“正道”
  alternative: 解释性译为“自古以来的正道”
  rationale: 上下文显示这是一条本应持守的道路，但原文采用具体而富张力的路径隐喻。保留隐喻可避免把解释写入正文。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。句中以“就是”说明“古老的路径”与“自己的道路”的同位关系；用“转去走”显出古道与岔路之间的对照。保留“烧香”“路径”“修筑”等具体意象，不以抽象神学术语替换。
