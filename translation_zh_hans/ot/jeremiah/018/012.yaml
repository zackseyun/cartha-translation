  yaml_path: translation/ot/jeremiah/018/012.yaml
  text: But they will say[a], ‘It is hopeless, for we will follow our own plans, and each of us will act according to the stubbornness of his evil heart.’
translation:
  language: zh_hans
  text: 但他们却说：“没希望了！[a]我们要随从自己的打算而行；各人都要照自己邪恶内心的顽梗而行。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“白费力气！”也可译：“没有指望了！”希伯来语这一表达既可表示绝望，也可表示他们认为先知的劝告徒劳无用。
    reason: lexical_alternative
lexical_decisions:
- source_word: נוֹאָשׁ
  choice: 没希望了
  rationale: 该词在这里可表达绝望，也可表达认为先知的劝告徒劳无用。“没希望了”符合现代汉语口吻，并保留拒绝悔改时的绝望或推拒语气；另一层可能含义收入脚注。
- source_word: אַחֲרֵי מַחְשְׁבוֹתֵינוּ נֵלֵךְ
  choice: 我们偏要照自己的谋算行事
  rationale: “跟随……而行”表示依从或追随；מַחְשְׁבוֹת在此指自己的想法、打算或谋划。“照自己的谋算行事”自然地传达刻意自行其是；“偏要”体现语境中的抗拒，却不把“谋算”限定为诡计。
- source_word: וְאִישׁ
  choice: 各人
  rationale: 希伯来文为分配性单数，意为群体中的每一个人。“各人”简洁保留这种分配含义，也符合现代书面汉语。
- source_word: שְׁרִרוּת
  choice: 顽梗
  rationale: 该名词指固执、任性和抗拒，常用于描述悖逆。“顽梗”保留其强烈的道德意味，也与耶利米书的庄重语体相称。
- source_word: לִבּוֹ הָרָע
  choice: 自己邪恶的内心
  rationale: לֵב涵盖思想、意志与欲望的内在中心；译作“内心”比单独的“心”更清楚地表达此义，同时保留הָרָע明确的道德判断。
- source_word: נַעֲשֶׂה
  choice: 去做
  rationale: עשה含义宽泛，可译为“做、实行”。此处指按顽梗内心采取行动，“去做”自然直接，并与前面的意向宣告衔接。
theological_decisions:
- issue: 百姓的回答应理解为绝望，还是对先知劝告的轻蔑推拒
  choice: 没希望了
  alternative: 白费力气；没有指望了
  rationale: נוֹאָשׁ既可表达“没有希望”，也可能表示事情徒劳、劝告无用。上下文显示百姓拒绝回转，执意自行其是。正文采用“没希望了”，不替他们减轻责任；脚注保留“白费力气”的可能，以维持原文的语义张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“没希望了”保留直接引语的口语力度；“谋算”“顽梗”维持先知文学所需的凝练与道德分量。正文中的脚注标记与脚注完全对应。
