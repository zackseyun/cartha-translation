base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/018/007.yaml
  text: At one moment I may speak concerning a nation and concerning a kingdom[a], to uproot and to tear down and to destroy.
translation:
  language: zh_hans
  text: 有时，我会论到一个国家或一个王国[a]，说要拔除、拆毁、毁灭它；
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“针对一个国家或一个王国”。鉴于后面的审判动词，这个介词也可理解为带有敌对意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: רֶגַע
  choice: 何时
  rationale: 此处与后文构成概括性的时机表达，表示“在某一时刻/当……时”。现代汉语用“我何时……”能自然引出上帝在不同情形下所作宣告的一般原则，同时保留其时间性。
- source_word: אֲדַבֵּר
  choice: 我……论到
  rationale: 未完成式在本段表达一般、可能发生的行动，并非专指一次过去的发言。“何时……论到”在汉语中保留这种开放而带条件意味的时态作用。
- source_word: עַל
  choice: 论到
  rationale: 介词 עַל 与 דבר 连用可指发言所涉及的对象或主题；判断性的敌对含义已由后续三个毁灭动词显明，因此正文不提前收窄为“攻击”。
- source_word: גּוֹי
  choice: 国家
  rationale: 这里指作为上帝宣告对象的政治共同体；“国家”是现代汉语中清楚、常用的对应词。
- source_word: מַמְלָכָה
  choice: 王国
  rationale: 保留该词所指的王权统治领域，并与“国家”形成自然并列。
- source_word: לִנְתוֹשׁ
  choice: 拔出
  rationale: 保留耶利米书中常见的把植物连根拔起的意象；“拔出”简洁、自然。
- source_word: לִנְתוֹץ
  choice: 拆毁
  rationale: 该词表示拆除或推倒建筑物；“拆毁”既保留结构物被毁的意象，也适合庄重的经文语体。
- source_word: וּלְהַאֲבִיד
  choice: 毁灭
  rationale: 使役形式表达使之灭亡；“毁灭”准确呈现这一判断序列的最终结果。
theological_decisions:
- issue: 上帝发言公式在概括性、近条件性语境中的语气
  choice: 译作“我何时……论到”，以时间从句表达一般而可能发生的宣告
  alternative: “有时我会论到”或“我一旦宣告”
  rationale: 希伯来语未完成式与 רֶגַע 在18:7–10引出上帝对列国施行治理的一般原则，而非仅叙述一次过去事件。此译法保留开放、情境性的力量，又不额外加入关于神意改变方式的教义判断。
- issue: עַל 的关系是中性涉及还是敌对指向
  choice: 正文采用较宽的“论到”
  alternative: “针对”或“攻击”一个国家和王国
  rationale: 介词本身可表示“关于/涉及”，也可依语境带“针对”之意。后续“拔出、拆毁、毁灭”清楚表明审判性质；正文保留介词的语义幅度，并以脚注注明较强译法。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“拔出、拆毁、毁灭”保留原文三个并列不定式的节奏和递进式毁坏意象。句末分号反映本节与下一节在语法和论述上的紧密连接。
