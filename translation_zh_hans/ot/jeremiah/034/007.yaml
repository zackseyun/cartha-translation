  text: וְ/חֵ֣יל מֶֽלֶךְ בָּבֶ֗ל נִלְחָמִים֙ עַל יְר֣וּשָׁלִַ֔ם וְ/עַ֛ל כָּל עָרֵ֥י יְהוּדָ֖ה הַ/נּֽוֹתָר֑וֹת אֶל לָכִישׁ֙ וְ/אֶל עֲזֵקָ֔ה כִּ֣י הֵ֗נָּה נִשְׁאֲר֛וּ בְּ/עָרֵ֥י יְהוּדָ֖ה עָרֵ֥י מִבְצָֽר־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/034/007.yaml
  text: while the army of the king of Babylon was fighting against Jerusalem and against all the remaining cities of Judah[a], against Lachish and against Azekah, for these alone remained among the cities of Judah as fortified cities.
translation:
  language: zh_hans
  text: 当时，巴比伦王的军队正在攻打耶路撒冷和犹大其余的所有城镇[a]，攻打拉吉和亚西加；因为在犹大的城镇中，只剩下这两座坚固城。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“也就是拉吉和亚西加。”希伯来文可理解为具体说明当时仍在遭围攻的犹大城镇。
    reason: lexical_alternative
lexical_decisions:
- source_word: חֵיל
  choice: 军队
  rationale: 此处指巴比伦王的武装军事力量；“军队”在现代汉语中准确、自然。
- source_word: נִלְחָמִים
  choice: 正在攻打
  rationale: 分词表示持续进行的军事行动；结合介词所引出的攻击对象，译作“正在攻打”比泛称“作战”更清楚。
- source_word: הַנּוֹתָרוֹת
  choice: 其余的
  rationale: 修饰“犹大的城镇”，指当时尚未陷落的城；“其余的”简洁保留了剩余之意。
- source_word: אֶל לָכִישׁ וְאֶל עֲזֵקָה
  choice: 攻打拉吉和亚西加
  rationale: 重复“攻打”以反映希伯来文介词结构，同时不在正文中强行判定这两个地名究竟是对“其余城镇”的同位说明，还是另列的攻击对象。
- source_word: כִּי הֵנָּה
  choice: 因为……只剩下这两座
  rationale: 阴性复数代词回指拉吉和亚西加；上下文具有排他意味，汉语用“只……这两座”自然表达。
- source_word: נִשְׁאֲרוּ
  choice: 剩下
  rationale: 表示这两座城在其他城陷落之后仍然存留。
- source_word: בְּעָרֵי יְהוּדָה
  choice: 在犹大的城镇中
  rationale: 此处有从犹大诸城之中存留下来的部分关系，用“在……中”自然表达。
- source_word: עָרֵי מִבְצָר
  choice: 坚固城
  rationale: 指设有防御工事的城邑；“坚固城”是简明、庄重且常见的圣经汉语表达。
theological_decisions: []
