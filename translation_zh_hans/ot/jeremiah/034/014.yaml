source:
  edition: WLC
  text: מִ/קֵּ֣ץ שֶׁ֣בַע שָׁנִ֡ים תְּֽשַׁלְּח֡וּ אִישׁ֩ אֶת אָחִ֨י/ו הָ/עִבְרִ֜י אֲשֶֽׁר יִמָּכֵ֣ר לְ/ךָ֗ וַ/עֲבָֽדְ/ךָ֙ שֵׁ֣שׁ שָׁנִ֔ים וְ/שִׁלַּחְתּ֥/וֹ חָפְשִׁ֖י מֵֽ/עִמָּ֑/ךְ וְ/לֹֽא שָׁמְע֤וּ אֲבֽוֹתֵי/כֶם֙ אֵלַ֔/י וְ/לֹ֥א הִטּ֖וּ אֶת אָזְנָֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/034/014.yaml
  text: At the end of seven years[a], each of you shall send away his Hebrew brother who has been sold to you and has served you six years; you shall send him away free from you[c][b]. But your fathers did not listen to me or incline their ear.
translation:
  language: zh_hans
  text: “七年期满[a]，你们各人都要放走那被卖给自己、服事自己六年的希伯来弟兄[b]；要让他自由地离开自己。”可是你们的祖先没有听从我，也没有侧耳而听。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“过了七年。”希伯来语也可理解为一个七年时期结束之后。
    reason: lexical_alternative
  - marker: b
    text: “希伯来弟兄”也可译作“希伯来同胞”或“希伯来族人”。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקֵּץ שֶׁבַע שָׁנִים
  choice: 七年期满
  rationale: 保留“到七年结束之时”的时间含义，同时用自然、简洁的现代汉语表达；具体计算方式仍留有余地。
- source_word: תְּשַׁלְּחוּ אִישׁ
  choice: 你们各人都要释放
  rationale: “各人”体现 אִישׁ 在复数命令中的逐一、分配意义；“释放”符合 שלח 在解除役使关系这一法律语境中的功能。
- source_word: אָחִיו הָעִבְרִי
  choice: 自己的希伯来弟兄
  rationale: 保留 אָחִיו 的男性单数和亲族、同胞色彩，也维持经文的盟约群体修辞。
- source_word: אֲשֶׁר יִמָּכֵר לְךָ
  choice: 他若被卖给你
  rationale: 按尼法勒式最直接译作被动；“若”顺应本句法律条件语境，但不排除该形式可能带有反身含义。
- source_word: וַעֲבָדְךָ שֵׁשׁ שָׁנִים
  choice: 服事了你六年
  rationale: “服事”保留 עבד 的役使关系含义，而完成体表达释放前已经完成的六年期限。
- source_word: וְשִׁלַּחְתּוֹ חָפְשִׁי מֵעִמָּךְ
  choice: 你就要释放他，使他离开你，得享自由
  rationale: 再次使用“释放”反映 שלח 的重复；后半明确表达 חָפְשִׁי 与 מֵעִמָּךְ，且符合现代汉语语序。
- source_word: וְלֹא שָׁמְעוּ אֲבוֹתֵיכֶם אֵלַי
  choice: 可是你们的祖先没有听从我
  rationale: “听从”同时传达听见与遵从的语用含义；“祖先”比“父亲们”更符合此处历代先人的所指。
- source_word: וְלֹא הִטּוּ אֶת אָזְנָם
  choice: 也没有侧耳而听
  rationale: 保留希伯来语的听觉意象，同时是普通现代读者可理解的庄重表达。
theological_decisions:
- issue: 盟约群体中的男性亲属称谓
  choice: 自己的希伯来弟兄
  alternative: 自己的希伯来同胞／希伯来族人
  rationale: 原文为男性单数亲属用语；正文保留其家庭式、盟约式修辞，不将其泛化为无性别称谓。
- issue: 进入役使关系的方式
  choice: 被卖给你
  alternative: 把自己卖给你
  rationale: 尼法勒式可作被动或反身理解。正文采用形态上较直接的被动译法，脚注保留法律语境中的反身可能，避免断定债役形成的具体方式。
- issue: 役使制度术语
  choice: 服事了你六年……得享自由
  alternative: 为你做工六年……成为自由人
  rationale: 译文保留“出售—服事—释放”的法律关系，不额外套入后世特定奴隶制度，也不淡化经文所述的受约束身份。
translation_notes:
  register: 采用现代、庄重且易懂的法律宣告语体。以“释放”清楚表达解除役使关系，以“侧耳而听”保留原文意象；正文所有脚注标记均在相关词句后出现。
