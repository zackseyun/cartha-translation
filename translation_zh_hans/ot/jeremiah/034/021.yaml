base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/034/021.yaml
  text: And I will give Zedekiah king of Judah and his officials into the hand of their enemies[a], into the hand of those who seek their life, and into the hand of the army of the king of Babylon, which has withdrawn from you.
translation:
  language: zh_hans
  text: 我必把犹大王西底家和他的官长交在他们仇敌手中，交在寻索他们性命的人手中，也交在已经从你们那里撤走的巴比伦王的军队手中。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“正在从你们那里撤走的。”希伯来文直译为“正从你们上面离去（上去）的”，在这里指军队离开对城的围攻。
    reason: 原文分词可侧重正在撤离，也可在上下文中理解为已经撤走；正文采用后者，脚注保留时态体貌上的歧义。
lexical_decisions:
- source_word: צִדְקִיָּהוּ
  choice: 西底家
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: שָׂרָיו
  choice: 他的官长
  rationale: שַׂר 在王国政治语境中可指官员、首领或权贵；“官长”既体现其身份地位，又不限定为军事将领。
- source_word: אֶתֵּן בְּיַד
  choice: 交在……手中
  rationale: נתן 与 בְּיַד 构成“交在某人权下”的惯用表达；保留“手中”的意象及原文三次重复的修辞。
- source_word: אֹיְבֵיהֶם
  choice: 他们仇敌
  rationale: 直接对应带第三人称阳性复数后缀的复数名词，所指包括西底家及其官长。
- source_word: מְבַקְשֵׁי נַפְשָׁם
  choice: 寻索他们性命的人
  rationale: 较贴近“寻求他们的性命”这一希伯来惯用语，并在中文中清楚表达企图杀害他们的含义。
- source_word: חֵיל מֶלֶךְ בָּבֶל
  choice: 巴比伦王军队
  rationale: חַיִל 在此指军事力量；“军队”符合围城语境。
- source_word: הָעֹלִים מֵעֲלֵיכֶם
  choice: 已经从你们那里撤走的
  rationale: 字面为“正从你们上面上去/离开的”；在围城语境中指军队撤离围攻。“已经……撤走”自然表达上下文中的暂时离去，同时以脚注保留分词可能具有进行意味的歧义。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。三次重复“交在……手中”，以保留原文的审判宣告节奏；“寻索他们性命”略带经文语体，但普通读者仍可理解。
