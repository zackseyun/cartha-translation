id: JER.34.2
reference: Jeremiah 34:2
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כֹּֽה אָמַ֤ר יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל הָלֹךְ֙ וְ/אָ֣מַרְתָּ֔ אֶל צִדְקִיָּ֖הוּ מֶ֣לֶךְ יְהוּדָ֑ה וְ/אָמַרְתָּ֣ אֵלָ֗י/ו כֹּ֚ה אָמַ֣ר יְהוָ֔ה הִנְ/נִ֨י נֹתֵ֜ן אֶת הָ/עִ֤יר הַ/זֹּאת֙ בְּ/יַ֣ד מֶֽלֶךְ בָּבֶ֔ל וּ/שְׂרָפָ֖/הּ בָּ/אֵֽשׁ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/034/002.yaml
  text: 'Thus says Yahweh[a], the God of Israel: Go and speak to Zedekiah king of Judah, and say to him, ‘Thus says Yahweh: Behold, I am giving this city into the hand of the king of Babylon, and he will burn it with fire.’'
translation:
  language: zh_hans
  text: 以色列的上帝雅威如此说：“你去对犹大王西底家讲话，对他说：‘雅威如此说：看哪，我要把这城交在巴比伦王手中[a]，他必用火焚烧这城。’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“交在巴比伦王的权势之下”。
    reason: 说明“在……手中”这一希伯来语习语表示落入某人的权力或控制之下。
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: 如此说
  rationale: 保留先知传信公式的庄重语气，也符合现代汉语的圣经文体。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以通行的现代汉语音译呈现四字神名，保留其作为专名的性质，不以称号替代。
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: 以色列的上帝
  rationale: 直接表达希伯来语的属格结构，清楚自然。
- source_word: הָלֹךְ
  choice: 你去
  rationale: 该绝对不定式在此具有命令功能；译作简洁明确的命令句。
- source_word: וְאָמַרְתָּ ... וְאָמַרְתָּ אֵלָיו
  choice: 对……讲话，对他说
  rationale: 保留原文连续出现的两个言说动词，同时避免现代汉语中完全重复同一表达。
- source_word: צִדְקִיָּהוּ מֶלֶךְ יְהוּדָה
  choice: 犹大王西底家
  rationale: 采用现代汉语中自然的人名与王号次序，并使用通行译名。
- source_word: הִנְנִי
  choice: 看哪，我要
  rationale: “看哪”保留郑重、引人注意的先知语气；“我要”配合后续分词，表达临近且确定的行动。
- source_word: נֹתֵן
  choice: 要把……交在
  rationale: 该分词在宣告中具有即将发生并确定实现的意味；“要”比进行体更符合自然汉语。
- source_word: הָעִיר הַזֹּאת
  choice: 这城
  rationale: 简洁对应带定冠词的名词和指示词。
- source_word: בְּיַד
  choice: 交在……手中
  rationale: 保留原文“手中”的形象，同时在汉语中自然表达落入某人控制之下。
- source_word: וּשְׂרָפָהּ בָּאֵשׁ
  choice: 他必用火焚烧这城
  rationale: 明确表达第三人称主语及阴性宾语后缀所指的“城”；“用火焚烧”保留原文表述。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名；译文以“雅威”作为专名音译，既不把神名改成称号，也不依赖传统混合读音。
- issue: בְּיַד 的先知性意象
  choice: 交在巴比伦王手中
  alternative: 交给巴比伦王控制
  rationale: 正文保留“手中”的源语意象及征服语境中的权势含义，脚注提供明释，避免把比喻含义绝对化。
- issue: 焚城者的指代
  choice: 他必用火焚烧这城
  alternative: 城必被火焚烧
  rationale: 希伯来语动词为主动第三人称单数，最自然的先行词是“巴比伦王”；保留主动结构，不改成神学上较弱的无施事被动句。
translation_notes:
  register: 采用庄重而现代的标准普通话。保留“如此说”“看哪”“手中”等先知文体意象，但调整语序，使普通读者无需古汉语背景也能顺畅理解。脚注标记置于实际对应的“手中”之后。
