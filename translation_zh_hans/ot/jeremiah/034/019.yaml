revisions:
- from: 犹大的官长、耶路撒冷的官长、宫廷官员[a]、祭司，以及所有从牛犊肉块之间走过的当地民众——
  to: 犹大的官长、耶路撒冷的官长、宫廷官员[a]、祭司，以及这地所有从劈开的牛犊两半之间经过的民众——
  rationale: 修订避免“肉块”的不当语感，并以“这地所有……民众”较忠实、自然地传达“所有这地的民”。“两半”依据紧邻上下文所述将牛犊劈成两半的仪式，明确原文“在牛犊的块之间经过”的实际所指，同时未改变本节承接下文的未完成句式。
