  source_fidelity: “当地民众”将“这地／那地的民”泛化为现代地域称呼，弱化了原文的“地之民”这一社会称谓；“牛犊肉块”在中文中容易指供食用的肉块，未能恰当地表达立约仪式中被劈开的牛犊。改为“这地所有……民众”及“劈开的牛犊两半之间”，既保留范围和仪式动作，也更清楚自然。
  naturalness: 原文的名单结构和句末破折号均可保留。“官长”“宫廷官员”“祭司”搭配庄重自然。将“从牛犊肉块之间走过”改为“从劈开的牛犊两半之间经过”，可避免“肉块”的口语化、食物化联想。
  terminology: “宫廷官员”并以脚注保留“宦官”合乎סָרִיסִים的词义歧义；“官长”和“祭司”恰当。“这地所有……民众”比“当地民众”更贴近עַם הָאָרֶץ，且不擅自界定其阶层。
  issues:
