base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/034/019.yaml
  text: the officials of Judah and the officials of Jerusalem[a], the court officials and the priests, and all the people of the land who passed between the pieces of the calf—
translation:
  language: zh_hans
  text: 犹大的官长、耶路撒冷的官长、宫廷官员[a]、祭司，以及这地所有从劈开的牛犊两半之间经过的民众——
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“宦官”。希伯来语这个词既可指宦官，也可指宫廷官员。
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂרֵי
  choice: 官长
  rationale: שַׂר指掌权者或高级官员；“官长”简洁庄重，也适用于犹大和耶路撒冷的领导阶层。
- source_word: יְהוּדָה
  choice: 犹大
  rationale: 采用现代中文圣经传统中通行的地名译法。
- source_word: יְרוּשָׁלִַם
  choice: 耶路撒冷
  rationale: 采用现代中文通行地名译法。
- source_word: הַסָּרִסִים
  choice: 宫廷官员[a]
  rationale: סָרִיס既可指被阉割的人，也可指宫廷官员。此处列举参与立约仪式的社会群体，正文采用较符合语境的职务称谓，同时以脚注保留另一词义。
- source_word: הַכֹּהֲנִים
  choice: 祭司
  rationale: כֹּהֵן的标准中文对应词。
- source_word: כֹל עַם הָאָרֶץ
  choice: 所有当地民众
  rationale: 保留כֹל的整体范围；此处עַם הָאָרֶץ指当地民众或国中百姓，“当地民众”自然易懂，又不额外限定为某一社会阶层。
- source_word: הָעֹבְרִים
  choice: 走过的
  rationale: 该分词指这些人曾履行从肉块之间经过的立约仪式；中文关系结构自然表达其回顾性指称。
- source_word: בֵּין
  choice: 从……之间
  rationale: 结合动作动词译为“从……之间走过”，符合现代汉语表达，并保留空间关系。
- source_word: בִּתְרֵי
  choice: 肉块
  rationale: בֶּתֶר指切开的块；结合牛犊被劈开的上下文，“肉块”比单说“块”更明确自然。
- source_word: הָעֵגֶל
  choice: 牛犊
  rationale: עֵגֶל通常指幼牛，“牛犊”准确对应，并与前文将牛犊劈成两半的仪式相合。
theological_decisions:
- issue: סָרִיסִים在社会群体名单中的含义
  choice: 正文译作“宫廷官员”
  alternative: “宦官”
  rationale: 该希伯来词既可描述身体身份，也可表示宫廷职务。此处行政职务义较符合社会群体名单，但证据不足以排除“宦官”，故以脚注保留真正的词义歧义。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。经文在本节末承接下一节，因此保留破折号。脚注标记紧随存在词义歧义的“宫廷官员”，而非置于“耶路撒冷的官长”之后。
