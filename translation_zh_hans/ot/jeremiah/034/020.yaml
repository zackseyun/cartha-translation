  text: וְ/נָתַתִּ֤י אוֹתָ/ם֙ בְּ/יַ֣ד אֹֽיְבֵי/הֶ֔ם וּ/בְ/יַ֖ד מְבַקְשֵׁ֣י נַפְשָׁ֑/ם וְ/הָיְתָ֤ה נִבְלָתָ/ם֙ לְ/מַֽאֲכָ֔ל לְ/ע֥וֹף הַ/שָּׁמַ֖יִם וּ/לְ/בֶהֱמַ֥ת הָ/אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/034/020.yaml
  text: And I will give them into the hand of their enemies and into the hand of those who seek their life[c][b][a], and their dead bodies will become food for the birds of the sky and for the beasts of the earth.
translation:
  language: zh_hans
  text: 我要把他们交在仇敌手中，交在那些寻索他们性命的人手中[a]；他们的尸首必成为空中飞鸟和地上走兽的食物。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “寻索他们性命”意思是企图杀害他们。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי אוֹתָם בְּיַד
  choice: 我要把他们交在……手中
  rationale: נתן与ביד连用表示交付在他人权下。“交在……手中”既保留希伯来语的具体意象，也自然表达落入控制之下。
- source_word: אֹיְבֵיהֶם
  choice: 仇敌
  rationale: 准确对应“敌人”，并符合庄重的经文语体。
- source_word: מְבַקְשֵׁי נַפְשָׁם
  choice: 那些寻索他们性命的人
  rationale: 保留“寻索性命”这一希伯来语习语及其威胁生命、意图杀害的含义，不在正文中完全释义化。
- source_word: וְהָיְתָה נִבְלָתָם לְמַאֲכָל
  choice: 他们的尸首必成为……的食物
  rationale: היה在此表达将形成的结果；נבלה指尸体。“尸首”清楚而庄重，也保留受辱、不得安葬的审判图景。
- source_word: לְעוֹף הַשָּׁמַיִם
  choice: 空中飞鸟
  rationale: עוֹף是飞禽的集合称谓，השמים在此指天空；“空中飞鸟”是自然、凝练的现代汉语表达。
- source_word: וּלְבֶהֱמַת הָאָרֶץ
  choice: 地上走兽
  rationale: בהמה在此泛指陆地兽类；“地上走兽”与“空中飞鸟”构成自然对称，并保持审判语境的庄严感。
theological_decisions:
- issue: 尸首暴露并被禽兽吞食的审判意象
  choice: 保留尸首成为飞鸟走兽食物的具体图景
  alternative: 弱化为他们将死在仇敌手中
  rationale: 原文不只宣告死亡，也描绘死后不得安葬、尸体受辱的严厉审判；译文不应淡化这一盟约咒诅式意象。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“交在……手中”与“寻索……性命”适度保留原文意象；脚注解释后一个习语，避免正文过度释义。
