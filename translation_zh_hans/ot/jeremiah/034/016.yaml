  to: 但你们却又反悔，亵渎了我的名：你们各人都叫自己已经释放、任其随意而去的男奴和女奴回来；随后又制伏他们，使他们作你们的男奴和女奴。
  rationale: 修订仅调整中文句法与措辞：将原文修饰奴隶的释放从句整合入名词短语，以保留其句法关系；以“却又反悔”体现对先前行动的逆转；以“任其随意而去”自然表达 לְנַפְשָׁם 的自主含义。保留“男奴和女奴”“亵渎”“制伏”及使役性的“叫……回来”。
