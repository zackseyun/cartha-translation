  naturalness: 原译庄重、清楚，但“任凭他们自己去”略口语，且与前面的“原先释放的”分号并列后显得句法松散。将释放及自主离去整合为对奴隶的定语，行文更自然，也更紧凑。
  terminology: “亵渎了我的名”“男奴和女奴”及“制伏”均准确并符合本段法律性释放与重新奴役的语境。无需脚注。
