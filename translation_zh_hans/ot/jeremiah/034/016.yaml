base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/034/016.yaml
  text: 'But you turned back and profaned my name: each of you made his male slave and his female slave return, though you had set them free to go where they wished; then you subjugated them to be your male and female slaves.'
translation:
  language: zh_hans
  text: 但你们却又反悔，亵渎了我的名：你们各人都叫自己已经释放、任其随意而去的男奴和女奴回来；随后又制伏他们，使他们作你们的男奴和女奴。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתָּשֻׁבוּ
  choice: 后来反悔
  rationale: 此处 שׁוּב 表示逆转先前释放奴隶的行动；“反悔”自然传达背弃承诺之意，“后来”承接叙事次序。
- source_word: וַתְּחַלְּלוּ אֶת־שְׁמִי
  choice: 亵渎了我的名
  rationale: חלל 的 Piel 形式与“名”连用，指把神圣之名当作俗物、加以亵渎；这是现代汉语中准确而庄重的表达。
- source_word: וַתָּשִׁבוּ
  choice: 强迫……回来
  rationale: Hiphil 形式具有使役意义；结合后文的制伏，“强迫……回来”明确表现获释者并非自愿返回。
- source_word: אִישׁ ... וְאִישׁ
  choice: 你们各人
  rationale: 保留希伯来语逐一分配的含义，同时避免在汉语中机械重复“各人”。
- source_word: עַבְדּוֹ ... שִׁפְחָתוֹ
  choice: 自己的……男奴和女奴
  rationale: 上下文涉及释放后再次奴役，奴属身份是核心；“男奴、女奴”既不淡化奴役，也保留两词的性别区别。
- source_word: שִׁלַּחְתֶּם חָפְשִׁים
  choice: 原先释放的；本已让他们自由
  rationale: 该词组表示授予自由，而非仅仅遣走；译文以两个相互呼应的表达保留释放这一法律及社会事实。
- source_word: לְנַפְשָׁם
  choice: 任凭他们自己去
  rationale: 此语表示获释者可以自主支配自己；该译法自然传达行动与生活不再受主人控制，而不把具体去向限定得过死。
- source_word: וַתִּכְבְּשׁוּ אֹתָם
  choice: 随后却又制伏他们
  rationale: כבש 表示强行置于控制之下。“制伏”保留强制性，“却又”呈现与先前释放行为的鲜明逆转。
- source_word: לִהְיוֹת לָכֶם לַעֲבָדִים וְלִשְׁפָחוֹת
  choice: 使他们作你们的男奴和女奴
  rationale: 清楚表达强制行动所造成的结果和归属关系，并保留男性与女性奴隶的并列。
theological_decisions:
- issue: 法律性释放及重新奴役语境中的奴属称谓
  choice: 男奴和女奴
  alternative: 仆人和婢女
  rationale: 本节明确涉及释放、强迫返回和重新制伏；“奴”最能呈现被支配的身份，避免用较温和的称谓淡化经文的控诉。
- issue: “亵渎我的名”的含义
  choice: 保留“亵渎了我的名”这一神学表述
  alternative: 使我的名蒙羞
  rationale: 原文直接以神的“名”为受词，重点不仅是名誉受损，也包括将神圣之名当作俗物；直译保留其盟约与敬拜层面的张力。
- issue: 获释者自主权的表达
  choice: 任凭他们自己去
  alternative: 随自己的心愿而去
  rationale: לְנַפְשָׁם 可指由他们自己作主。所选译法保留这种自主含义，但不把 נֶפֶשׁ 过度解释为内在愿望或特定目的地。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。以冒号和分号呈现罪行的推进：反悔并亵渎神名、强迫获释者返回、再次使其为奴。避免古旧的“仆婢”，也避免把原文的强制性弱化。
