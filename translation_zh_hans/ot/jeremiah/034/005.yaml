id: JER.34.5
reference: Jeremiah 34:5
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: בְּ/שָׁל֣וֹם תָּמ֗וּת וּֽ/כְ/מִשְׂרְפ֣וֹת אֲ֠בוֹתֶי/ךָ הַ/מְּלָכִ֨ים הָ/רִֽאשֹׁנִ֜ים אֲשֶׁר הָי֣וּ לְ/פָנֶ֗י/ךָ כֵּ֚ן יִשְׂרְפוּ לָ֔/ךְ וְ/ה֥וֹי אָד֖וֹן יִסְפְּדוּ לָ֑/ךְ כִּֽי דָבָ֥ר אֲנִֽי דִבַּ֖רְתִּי נְאֻם יְהוָֽה־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/034/005.yaml
  text: You will die in peace[a]. And as spices were burned for your fathers, the former kings who were before you, so they will burn spices for you, and they will lament for you, saying, “Alas, lord!” For I have spoken the word[b], declares Yahweh.
translation:
  language: zh_hans
  text: 你必平安地死去。人怎样为你的列祖——在你以前的先王——焚烧香料[a]，也必照样为你焚烧香料；他们必为你举哀，说：“哀哉，我主！”[b] 因为我已经说了这话。这是雅威的宣告。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译可作“焚烧”或“焚烧礼”。这是为已故君王举行的礼仪性焚烧，很可能焚烧香料或芳香物，并不是焚烧遗体。
    reason: 文化背景与原文语义范围
  - marker: b
    text: 也可译作：“唉，我主！”这是为统治者举哀时所发的正式哀声。
    reason: 词义备选
lexical_decisions:
- source_word: בְּשָׁלוֹם תָּמוּת
  choice: 你必平安死去
  rationale: 保留希伯来语“在平安中死去”的表达，指死亡的处境平安、非遭横死，不把它过度解释为内心安宁。
- source_word: וּכְמִשְׂרְפוֹת
  choice: 焚烧香料
  rationale: 王室丧葬语境中的复数名词指为死者举行的礼仪性焚烧，很可能焚烧香料或芳香物，并非焚烧遗体。正文采用清楚自然的表达，脚注保留原文较宽泛的措辞。
- source_word: אֲבוֹתֶיךָ הַמְּלָכִים הָרִאשֹׁנִים אֲשֶׁר הָיוּ לְפָנֶיךָ
  choice: 你的列祖，就是在你以前的先王
  rationale: “列祖”保留字面亲属称谓，随后的同位说明表明所指是君王的先辈和前任。
- source_word: כֵּן יִשְׂרְפוּ לָךְ
  choice: 也必照样为你焚烧
  rationale: 承接前文的香料，避免误解为焚烧君王本人，同时保留“为你”所表达的尊荣性丧葬安排。
- source_word: וְהוֹי אָדוֹן יִסְפְּדוּ לָךְ
  choice: 他们必为你哀悼，说：‘哀哉，我主！’
  rationale: יספד表示正式举哀；הוי אדון是为统治者发出的哀歌呼声。“我主”在此是对已故君王的尊称，不是神的称号。
- source_word: כִּי דָבָר אֲנִי דִבַּרְתִּי
  choice: 因为这话是我亲口说的
  rationale: 用“这话”和“亲口说”体现原文名词与同根动词并用的强调，同时保持现代汉语自然。
- source_word: נְאֻם יְהוָה
  choice: 这是雅威的宣告
  rationale: 将先知信息结束公式译为庄重自然的汉语，并以“雅威”音译四字神名。
theological_decisions:
- issue: 四字神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用上帝的专名；“雅威”较贴近现今通常重构的读音，也避免用称号替代专名。
- issue: 王室丧葬中“焚烧”的性质
  choice: 焚烧香料的纪念性丧葬礼仪
  alternative: 笼统译作“举行焚烧礼”
  rationale: 上下文应许西底家受到君王之礼，并非暗示火葬；正文明确为香料，脚注说明原文字面范围及其文化背景。
- issue: “平安死去”的含义
  choice: 保留“平安”而不进一步限定
  alternative: 译为“寿终正寝”或“不被杀害而死”
  rationale: 原文说明死亡的处境，却没有明确等同于高寿、自然死亡或主观安详；保留其神学与语义张力。
translation_notes:
  register: 采用庄重而清楚的现代标准普通话。“列祖”“先王”“哀哉”“宣告”保留先知文本和王室哀礼的庄严感；句法则按现代汉语调整，避免生硬直译。所有脚注标记均置于所说明的正文词句之后。
