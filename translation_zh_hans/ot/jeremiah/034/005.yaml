revisions:
- from: 你必平安死去。人怎样为你的列祖，就是在你以前的先王，焚烧香料[a]，也必照样为你焚烧；他们必为你哀悼，说：“哀哉，我主！”[b] 因为这话是我亲口说的。这是雅威的宣告。
  to: 你必平安地死去。人怎样为你的列祖——在你以前的先王——焚烧香料[a]，也必照样为你焚烧香料；他们必为你举哀，说：“哀哉，我主！”[b] 因为我已经说了这话。这是雅威的宣告。
  rationale: 修订仅澄清第二个“焚烧”的省略宾语，并将末句调整为更直接对应希伯来文“因为我说了这话”。脚注a保留“很可能”的审慎表述，不将礼仪焚烧的具体材料绝对化；脚注标记均紧随所注释的词句。
