review_pass:
  verdict: revise
  source_fidelity: 译文整体准确传达了死亡的平安、为王举行的礼仪性焚烧、哀悼呼号，以及雅威的宣告。惟第二个“焚烧”未明确承接前文的香料，在现代汉语中略显悬置；补出“香料”能忠实表达上下文所指而不致令人误会焚烧的是君王本人。结尾改为“因为我已经说了这话”更直接对应“因为我说了这话”。
  naturalness: 原文庄重流畅。“人怎样……也必照样……”和“这是雅威的宣告”自然可读。以破折号标出“先王”的同位说明，并在第二分句重复“焚烧香料”，可使句法关系和指代更清晰。
  terminology: “雅威”适当对应 יהוה；“列祖”“先王”“举哀／哀哉，我主”保持先知书与王室哀悼语境的庄重。“焚烧香料”配合脚注，恰当避免把礼仪性焚烧误作遗体火葬。
  issues:
  - severity: medium
    issue: 第二个“焚烧”缺少宾语
    rationale: “也必照样为你焚烧”虽可从前文推知所焚之物，却在汉语中容易形成不完整或短暂歧义。原文的比较结构所指正是前面的礼仪性焚烧；译作“也必照样为你焚烧香料”最清楚。
  - severity: low
    issue: “这话是我亲口说的”可更贴近原文措辞
    rationale: “亲口”可表达强调，但原文是“因为我说了这话”的名词—动词强调。改作“因为我已经说了这话”既自然，也更直接保留说话者为雅威的表达。
