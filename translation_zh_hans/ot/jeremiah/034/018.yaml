revisions:
- from: 我要把那些违背我约的人交出去[a]；他们没有履行在我面前所立之约的话[b]——他们把牛犊劈成两半，从肉块中间走过[c]。
  to: 我要把那些违背我的约、没有遵守他们在我面前所立之约的条款的人交出去[a]，使他们像那头被他们劈成两半、又从它的两半之间走过的牛犊一样[c]。[b]
  rationale: 依照希伯来文优先，恢复末尾牛犊短语所表达的审判性比较。中文必须补出“使他们像……一样”才不会将该短语误读为单纯的仪式说明；这并未具体化下一节才说明的受审判方式。为使脚注锚点紧邻相应内容，b置于句末，说明其所注的“条款”。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T07:28:58Z'
