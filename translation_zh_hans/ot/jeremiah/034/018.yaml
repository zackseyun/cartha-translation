  source_fidelity: 末尾“牛犊”短语在希伯来文中与“那些人”构成压缩的审判性比较：受审判的立约者将如他们所劈开并从其间走过的牛犊。草稿把该短语处理为仅说明立约仪式的破折号插语，未表达这一句法与语义关系。修订以“使他们像……一样”在现代汉语中明确该关系；这虽补足了汉语必需的连接成分，却不提前加入下一节具体展开的刑罚。其余主要意义均得到保留。
