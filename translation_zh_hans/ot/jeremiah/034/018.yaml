  text: וְ/נָתַתִּ֣י אֶת הָ/אֲנָשִׁ֗ים הָ/עֹֽבְרִים֙ אֶת בְּרִתִ֔/י אֲשֶׁ֤ר לֹֽא הֵקִ֨ימוּ֙ אֶת דִּבְרֵ֣י הַ/בְּרִ֔ית אֲשֶׁ֥ר כָּרְת֖וּ לְ/פָנָ֑/י הָ/עֵ֨גֶל֙ אֲשֶׁ֣ר כָּרְת֣וּ לִ/שְׁנַ֔יִם וַ/יַּעַבְר֖וּ בֵּ֥ין בְּתָרָֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/034/018.yaml
  text: And I will hand over the men who transgressed my covenant[a], who did not uphold the words of the covenant that they made before me[c][b], the calf that they cut in two and passed between its pieces.
translation:
  language: zh_hans
  text: 我要把那些违背我的约、没有遵守他们在我面前所立之约的条款的人交出去[a]，使他们像那头被他们劈成两半、又从它的两半之间走过的牛犊一样[c]。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “违背”所译的希伯来语也可表示“越过”；同一词根在本节末尾再次出现，那里译作“走过”。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“约的话”，指约中所规定、必须遵守的内容。
    reason: lexical_alternative
  - marker: c
    text: 把牲畜劈开并从其两半之间走过，是一种立约仪式，含有违约者将承受相应刑罚的意思。参创世记15:9–17。
    reason: cultural_note
lexical_decisions:
- source_word: וְנָתַתִּי
  choice: 我要……交出去
  rationale: נתן本义为“给”，在审判语境中常指把人交在他者权下；“交出去”既自然，也保留原文未在本节明说交给谁的含蓄。
- source_word: הָאֲנָשִׁים
  choice: 那些……的人
  rationale: 此处指特定的立约者。现代汉语用“人”最自然；不强行加入“男人”，因为上下文并不要求突出性别。
- source_word: הָעֹבְרִים אֶת־בְּרִיתִי
  choice: 违背我约的人
  rationale: עבר带约的宾语时表示越犯、违背。译作“违背”表达法律与道德含义；另以脚注说明它与后文“走过”的原文复现关系。
- source_word: לֹא הֵקִימוּ אֶת דִּבְרֵי הַבְּרִית
  choice: 没有履行……约的话
  rationale: הקים在此指使约言成立、付诸实行。“履行”符合现代汉语；保留“约的话”，不直接简化为“条款”。
- source_word: אֲשֶׁר כָּרְתוּ לְפָנָי
  choice: 在我面前所立之约
  rationale: כרת ברית是“立约”的固定表达；“在我面前”保留上帝作为见证者的庄严意味。
- source_word: הָעֵגֶל אֲשֶׁר כָּרְתוּ לִשְׁנַיִם
  choice: 他们把牛犊劈成两半
  rationale: עגל译作“牛犊”；כרתו לשנים具体描写把祭牲切为两半，“劈成两半”简明而有画面感。
- source_word: וַיַּעַבְרוּ בֵּין בְּתָרָיו
  choice: 从肉块中间走过
  rationale: 这里是立约仪式中的实际动作。“肉块”清楚表明是被劈开的牛犊各块，并以“走过”与前面的עבר词根形成可由脚注提示的呼应。
theological_decisions:
- issue: 末尾“牛犊”短语与受审判者的句法和含义关系
  choice: 用破折号把牛犊仪式作为对“所立之约”的具体说明，不补入“像牛犊一样”。
  alternative: 译为“我要使他们像那牛犊一样”，明确补出比较和惩罚结果。
  rationale: 马所拉文本结构压缩且略显悬置，原文没有比较词。下一节才展开受审判者的结局，因此本节避免提前补足“像牛犊一样”的含义，同时通过标点让现代读者看出末句是在说明立约仪式。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“所立之约”略带典雅色彩但通俗可懂；破折号用于呈现希伯来文末尾压缩的仪式说明，并避免擅自补出比较词。所有脚注标记均置于正文相关位置。
