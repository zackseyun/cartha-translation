base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/034/012.yaml
  text: Then the word of Yahweh came to Jeremiah from Yahweh[a], saying,
translation:
  language: zh_hans
  text: 那时，雅威的话从雅威[a]那里临到耶利米，说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文：YHWH（上帝的神名），传统译作“耶和华”。
    reason: 说明神名的原文形式及传统译法。
lexical_decisions:
- source_word: וַיְהִי
  choice: 那时……临到
  rationale: 该叙事形式标志事件向前推进；用“那时”承接上下文，并将动词自然融入先知书常用的“话临到”句式。
- source_word: דְבַר יְהוָה
  choice: 雅威的话
  rationale: 保留“话”这一先知启示的固定表达，避免用较具解释性的“信息”。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文四字神名的通行拟音处理，保留其作为专名的性质，而不以称号替代。
- source_word: אֶל יִרְמְיָהוּ
  choice: 临到耶利米
  rationale: 在汉语圣经语体中，“临到”自然表达神的话以先知为领受者。
- source_word: מֵאֵת יְהוָה
  choice: 从雅威那里
  rationale: מֵאֵת 表明来源。原文在“雅威的话”之后再次出现神名，译文保留这一看似重复但明确的结构。
- source_word: לֵאמֹר
  choice: 说：
  rationale: 自然引出下一节的直接引语，并保留原文的引语公式。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名；译作“雅威”可显示这是以色列之神的专名，而非一般称号。脚注同时说明传统译法。
- issue: 同一节两次出现神名
  choice: 两处均明确译出
  alternative: 省略第二处，译成“雅威的话临到耶利米”
  rationale: 希伯来原文为“雅威的话……从雅威那里”，重复可能具有公式性或强调来源；不应为追求流畅而消除这一真实文本特征。
translation_notes:
  register: 采用现代、庄重而清楚的普通话。“那时”推动叙事，“临到”保留先知书的固定表达；刻意保留原文两次出现“雅威”的结构。
