source:
  edition: WLC
  text: וַ/יִּשְׁמְעוּ֩ כָל הַ/שָּׂרִ֨ים וְ/כָל הָ/עָ֜ם אֲשֶׁר בָּ֣אוּ בַ/בְּרִ֗ית לְ֠/שַׁלַּח אִ֣ישׁ אֶת עַבְדּ֞/וֹ וְ/אִ֤ישׁ אֶת שִׁפְחָת/וֹ֙ חָפְשִׁ֔ים לְ/בִלְתִּ֥י עֲבָד בָּ֖/ם ע֑וֹד וַֽ/יִּשְׁמְע֖וּ וַ/יְשַׁלֵּֽחוּ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/034/010.yaml
  text: So all the officials and all the people who had entered into the covenant to send away[a], each man his male slave and each man his female slave, free, so as not to make them serve any longer[b], obeyed and sent them away.
translation:
  language: zh_hans
  text: 所有进入这约的官长和百姓都听从了：各人释放自己的男奴和女奴，使他们自由，不再奴役他们。他们听从了，就把他们释放了。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁמְעוּ
  choice: 听从了
  rationale: שׁמע本义可指“听”，但在立约后随即采取行动的语境中含有服从、照办之意。“听从”既保留听觉词根的色彩，也自然表达顺服。
- source_word: הַשָּׂרִים
  choice: 官长
  rationale: שׂרים指掌权者或官员；“官长”符合古代政治语境，又是现代中文读者可理解的庄重表达。
- source_word: בָּאוּ בַבְּרִית
  choice: 立约
  rationale: 希伯来语直译为“进入这约”。中文用“立约”能自然表达参与并承担此约，同时不增加具体仪式细节。
- source_word: לְשַׁלַּח ... חָפְשִׁים
  choice: 释放……使他们自由
  rationale: שׁלח在此法律—社会语境中指放走、释放奴隶；חָפְשִׁים说明获释后的自由身份。此译明确呈现解除奴役。
- source_word: אִישׁ אֶת עַבְדּוֹ וְאִישׁ אֶת שִׁפְחָתוֹ
  choice: 各人释放自己的男奴和女奴
  rationale: “各人”体现אִישׁ的分配意义；“男奴和女奴”保留原文明确的性别区分及受奴役身份。中文无需机械重复两次“各人”。
- source_word: לְבִלְתִּי עֲבָד בָּם עוֹד
  choice: 不再奴役他们
  rationale: עבד带宾语并处于使奴隶获释的语境中，表示继续役使或奴役他们；“不再奴役”简洁呈现其目的和社会关系。
- source_word: וַיְשַׁלֵּחוּ
  choice: 就把他们释放了
  rationale: 与前面的שׁלח保持词义一致；原文宾语由上下文补足，中文明示“他们”更自然。
theological_decisions:
- issue: 奴役身份术语
  choice: 男奴、女奴、奴役
  alternative: 男仆、婢女、服事
  rationale: 本节讲的是按约解除受束缚劳役的身份。译作“奴”比“仆”更准确地显出其非自由状态，也避免弱化经文的社会伦理张力。
- issue: 首尾两次וַיִּשְׁמְעוּ的处理
  choice: 两处都译作“听从了”
  alternative: 首处译“听见”，末处译“听从”
  rationale: 叙事以实际释放行动显示此词在两处均不只是听见，而是接受并照办。重复译法也保留原文强调。
- issue: 分配式אִישׁ的性别表达
  choice: 译作“各人”
  alternative: 各个男人
  rationale: 这里אִישׁ主要发挥分配功能，指出每一位奴隶主各自承担义务；现代中文“各人”准确自然，并不改写男奴、女奴的明确性别区分。
translation_notes:
  register: 采用现代、庄重而清楚的叙事语言。“释放”“自由”“奴役”准确呈现立约和解放奴隶的法律—社会背景；保留“听从了”的重复，以反映希伯来文的修辞强调。
