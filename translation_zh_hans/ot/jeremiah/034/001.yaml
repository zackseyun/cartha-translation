revisions:
- from: 耶和华[a]的话临到耶利米。那时，巴比伦王尼布甲尼撒率领他的全军，以及他手下所统辖的地上各国和各族，正在攻打耶路撒冷和属于她的所有城邑。耶和华的话说：[b]
  to: 有耶和华[a]的话临到耶利米：当巴比伦王尼布甲尼撒、他的全军、受他手中权势统治的地上[b]一切国度和所有各族，正在攻打耶路撒冷及其所有城邑时，说：
  rationale: 修订删除原文未明说的“率领”，恢复巴比伦王、军队、属下国度和各族作为并列参战者的结构；将 לֵאמֹר 简洁译为“说：”，使其自然引出下一节的神谕。对“耶路撒冷的城邑”采用自然的所属表达，并以脚注保留 אֶרֶץ 可指“地上”或“这地”的语义宽度。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T07:28:56Z'
review_pass:
  verdict: revise
  source_fidelity: 草稿准确保留了神谕临到耶利米、巴比伦军队及其属下诸国诸民攻打耶路撒冷和其城邑的基本内容。但“尼布甲尼撒率领”不是原文所明说，且将 לֵאמֹר 译为“耶和华的话说”造成不必要的重复。
  naturalness: 首句“耶和华的话临到耶利米”自然且符合中文先知书语体。修订后以冒号连接时间背景，并将并列的参战者置于同一主语结构中，语义关系更清楚；“耶路撒冷及其所有城邑”也比“属于她的所有城邑”更自然。
  terminology: 保留通行中文神名“耶和华”和人名“尼布甲尼撒”。“全军”“国度”“各族”恰当反映军事力量、政治实体及复数族群。“受他手中权势统治”保留“手”的权力意象，同时不作生硬直译。
  issues:
  - severity: medium
    issue: “尼布甲尼撒率领他的全军”添加了原文未明说的动作。
    rationale: 原文将巴比伦王、他的军队、受其统治的诸国及所有民族并列为“正在攻打”的主语；王作为统帅或许可推知，但“率领”仍属译文补充，不宜在形式对应的正文中明示。
  - severity: medium
    issue: “耶和华的话说：”重复并弱化 לֵאמֹר 的直接话语引介功能。
    rationale: 首句已经以“耶和华的话”说明神谕来源。句末 לֵאמֹר 可自然译为“说：”，引出下一节；添加“耶和华的话”既不必要，也使中文表达不顺。
  - severity: low
    issue: “属于她的所有城邑”措辞不够自然。
    rationale: 原文阴性后缀确实指耶路撒冷；中文用“其所有城邑”即可忠实保留所属关系，无须将城市人格化。
  - severity: low
    issue: 原脚注 b 未处理 אֶרֶץ 的“地／土地”歧义。
    rationale: 英文审校记录特别保留该词的两种可能。脚注宜锚定“地上”，说明也可译为“这地上的”，而不将脚注仅用于已可由正文清楚体现的“说：”。
