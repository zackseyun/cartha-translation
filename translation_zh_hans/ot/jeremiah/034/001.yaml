language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: הַ/דָּבָ֛ר אֲשֶׁר הָיָ֥ה אֶֽל יִרְמְיָ֖הוּ מֵ/אֵ֣ת יְהוָ֑ה וּ/נְבוּכַדְרֶאצַּ֣ר מֶֽלֶךְ בָּבֶ֣ל וְ/כָל חֵיל֡/וֹ וְ/כָל מַמְלְכ֣וֹת אֶרֶץ֩ מֶמְשֶׁ֨לֶת יָד֜/וֹ וְ/כָל הָ/עַמִּ֗ים נִלְחָמִ֧ים עַל יְרוּשָׁלִַ֛ם וְ/עַל כָּל עָרֶ֖י/הָ לֵ/אמֹֽר־־־׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/034/001.yaml
  text: The word that came to Jeremiah from Yahweh[a], when Nebuchadnezzar king of Babylon and all his army, and all the kingdoms of the earth under the dominion of his hand, and all the peoples, were fighting against Jerusalem and against all its cities, saying[b],
translation:
  language: zh_hans
  text: 有耶和华[a]的话临到耶利米：当巴比伦王尼布甲尼撒、他的全军、受他手中权势统治的地上[b]一切国度和所有各族，正在攻打耶路撒冷及其所有城邑时，说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “耶和华”是希伯来文神名 יהוה 的传统中文译法；也可音译作“雅威”。
    reason: divine_name
  - marker: b
    text: “地上”也可译为“这地上的”或“这地的”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַדָּבָר אֲשֶׁר הָיָה אֶל יִרְמְיָהוּ מֵאֵת יְהוָה
  choice: 耶和华的话临到耶利米
  rationale: 采用希伯来先知书常见的启示公式；“临到”自然而庄重，清楚表达话语来自耶和华。
- source_word: נְבוּכַדְרֶאצַּר
  choice: 尼布甲尼撒
  rationale: 采用现代中文读者最熟悉的人名形式；希伯来文本此处的拼写差异另以脚注说明。
- source_word: חֵילוֹ
  choice: 他的全军
  rationale: 在围城语境中，חַיִל指军事力量，译作“军”最清楚；כָל表达“全”。
- source_word: כָל מַמְלְכוֹת אֶרֶץ מֶמְשֶׁלֶת יָדוֹ
  choice: 他手下所统辖的地上各国
  rationale: 保留“手”所象征的权柄意象，同时用“所统辖”表达מֶמְשֶׁלֶת；אֶרֶץ在此可指“地”或“土地”，译文保留较宽泛的“地上”。
- source_word: כָל הָעַמִּים
  choice: 各族
  rationale: עַמִּים为复数，指不同的民族群体；“各族”比单数“人民”更能体现其群体复数意义。
- source_word: נִלְחָמִים עַל
  choice: 正在攻打
  rationale: 分词表示持续进行的军事行动；“正在攻打”符合围城语境，也比直译“交战反对”自然。
- source_word: כָל עָרֶיהָ
  choice: 属于她的所有城邑
  rationale: 阴性单数后缀指向耶路撒冷；用“属于她的”保留原文指代，以“城邑”表达其辖境内诸城。
- source_word: לֵאמֹר
  choice: 耶和华的话说：
  rationale: 该词引出下一节的神谕。中文若仅作“说”容易误接在战争参与者之后，因此补明隐含的发言来源，同时以脚注交代较形式对应的译法。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 使用现代中文圣经传统中最广为人知的专名“耶和华”，不以称号“主”替代原文的盟约神名；脚注提供更贴近学界常见重构读音的形式。
- issue: לֵאמֹר 的发言者是否明示
  choice: 耶和华的话说
  alternative: 说
  rationale: 原文语法上לֵאמֹר承接开头“耶和华的话”，而非让紧邻的军队成为说话者。中文明示主语可避免错误理解，但脚注保留原文简略结构。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。首句保留先知书惯用的“话临到”公式；长串围城参与者经适度调整，使中文层次清楚，但不消除“地上／土地”以及民族群体范围上的原有宽度。所有脚注标记均置于正文。
