  text: כֹּֽה אָמַ֥ר יְהוָ֖ה אֱלֹהֵ֣י יִשְׂרָאֵ֑ל אָנֹכִ֗י כָּרַ֤תִּֽי בְרִית֙ אֶת אֲב֣וֹתֵי/כֶ֔ם בְּ/י֨וֹם הוֹצִאִ֤/י אוֹתָ/ם֙ מֵ/אֶ֣רֶץ מִצְרַ֔יִם מִ/בֵּ֥ית עֲבָדִ֖ים לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/034/013.yaml
  text: 'Thus says Yahweh, the God of Israel: I myself made a covenant with your fathers on the day I brought them out from the land of Egypt, from the house of slaves, saying,'
translation:
  language: zh_hans
  text: 耶和华——以色列的上帝——如此说：“我在把他们从埃及地、从奴隶之家[b]领出来的那一天，与你们的祖先立了约[a]，说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“切了约”。
    reason: lexical_alternative
  - marker: b
    text: 或译“受奴役之家”。希伯来文直译为“奴隶之家”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: 如此说
  rationale: 保留先知传信公式的庄重语体，同时符合现代汉语表达。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文读者熟悉的神名音译，明确呈现专名而非以头衔替代。
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: 以色列的上帝
  rationale: 直接体现原文的所属结构和盟约身份。
- source_word: אָנֹכִי
  choice: 我
  rationale: 希伯来语独立代词可带强调，但本句现代汉语无需加入“亲自”也能自然突出说话者；避免过度解释其强调程度。
- source_word: כָּרַתִּי בְרִית
  choice: 立了约
  rationale: “立约”是自然、庄重且准确的中文盟约用语；原文字面为“切约”，以脚注保留。
- source_word: אֶת אֲבֹתֵיכֶם
  choice: 与你们的祖先
  rationale: 此处指听众先辈的群体；“祖先”在现代汉语中自然且不改变历史指向。
- source_word: בְּיוֹם
  choice: 那一天
  rationale: 保留原文明确的时间名词表达，并与后面的出埃及事件衔接。
- source_word: הוֹצִיאִי אוֹתָם
  choice: 我把他们……领出来
  rationale: 使役形表达带出；“领出来”在出埃及语境中自然，并保留行动方向。
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: 从埃及地
  rationale: 保留“地”这一成分及出埃及传统公式。
- source_word: מִבֵּית עֲבָדִים
  choice: 从为奴之家
  rationale: 兼顾“房屋/家”和“奴隶”意象，表达埃及是受奴役之处；字面形式见脚注。
- source_word: לֵאמֹר
  choice: 说：
  rationale: 引出下一节的盟约规定；中文以冒号自然标示后续直接引语。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 两者均为神名音译；正文采用现代中文圣经传统中辨识度更高的“耶和华”，不以“主”替代专名。
- issue: אָנֹכִי 是否明示强调
  choice: 我
  alternative: 我亲自
  rationale: 独立代词可能有强调作用，但此处强调强度并不确定；中文单独出现的“我”已能承载主体焦点，避免将其强化为明确的“亲自”。
- issue: עֲבָדִים 在出埃及公式中的表达
  choice: 为奴
  alternative: 奴隶；受奴役
  rationale: 上下文指埃及的实际奴役状态；不用较弱的“服役”，同时以自然中文保留受奴役的社会现实。
translation_notes:
  register: 采用现代、庄重而易懂的普通话书面语。句首按中文信息结构将“以色列的上帝耶和华”前置；以“说：”保留本节向下一节延续的未完结构。
