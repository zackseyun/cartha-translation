  text: לָ/כֵן֮ כֹּה אָמַ֣ר יְהוָה֒ אַתֶּם֙ לֹֽא שְׁמַעְתֶּ֣ם אֵלַ֔/י לִ/קְרֹ֣א דְר֔וֹר אִ֥ישׁ לְ/אָחִ֖י/ו וְ/אִ֣ישׁ לְ/רֵעֵ֑/הוּ הִנְ/נִ֣י קֹרֵא֩ לָ/כֶ֨ם דְּר֜וֹר נְאֻם יְהוָ֗ה אֶל הַ/חֶ֨רֶב֙ אֶל הַ/דֶּ֣בֶר וְ/אֶל הָ/רָעָ֔ב וְ/נָתַתִּ֤י אֶתְ/כֶם֙ ל/זועה לְ/כֹ֖ל מַמְלְכ֥וֹת הָ/אָֽרֶץ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/034/017.yaml
  text: 'Therefore thus says Yahweh: You have not listened to me[a], to proclaim liberty, each man to his brother and each man to his neighbor. Behold, I am proclaiming liberty for you, declares Yahweh—to the sword, to the pestilence[c][b], and to the famine—and I will make you a horror to all the kingdoms of the earth.'
translation:
  language: zh_hans
  text: 所以，耶和华如此说：“你们没有听从我，去各自向自己的弟兄和邻舍宣告自由。看哪，我向你们宣告‘自由’[a]——归于刀剑、瘟疫和饥荒——这是耶和华的宣告；我要使你们成为地上万国惊骇的对象[c]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “自由”也可译作“释放”。本节两次使用同一个希伯来词，构成刻意的反讽。
    reason: lexical_alternative
  - marker: c
    text: “惊骇的对象”也可译作“恐怖的对象”或“令人震骇之物”。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代汉语圣经传统中对四字神名最通行、最易辨识的音译，不以“主”这一称号取代原文中的专名。
- source_word: שְׁמַעְתֶּם אֵלַי
  choice: 听从我
  rationale: שׁמע 与 אֶל 连用兼有聆听和顺从之意；“听从”在现代汉语中自然地保留这两层含义。
- source_word: לִקְרֹא דְרוֹר
  choice: 宣告自由
  rationale: 此处指正式公开宣布奴仆获得释放；“宣告自由”兼顾法律语境与先知话语的庄重语气。
- source_word: דְרוֹר
  choice: 自由
  rationale: 两处均译作“自由”，保留原文重复及其反讽：百姓不肯给同胞自由，耶和华便向他们宣告通往审判的“自由”。
- source_word: אִישׁ לְאָחִיו וְאִישׁ לְרֵעֵהוּ
  choice: 各自向自己的弟兄和邻舍
  rationale: “各自”体现 אִישׁ…וְאִישׁ 的逐一分配意味，并以“弟兄”和“邻舍”区分两个原文名词。
- source_word: הִנְנִי
  choice: 看哪
  rationale: 保留郑重引出神圣宣告的先知性提示语。
- source_word: קֹרֵא לָכֶם דְרוֹר
  choice: 我也要向你们宣告‘自由’
  rationale: 以“也”凸显与前句的对应，以引号提示这里蓄意而严厉的反讽，同时仍保留同一关键词。
- source_word: אֶל הַחֶרֶב אֶל הַדֶּבֶר וְאֶל הָרָעָב
  choice: 让你们归于刀剑、瘟疫和饥荒
  rationale: 重复的 אֶל 表明这项反讽的“自由”使他们落入三种审判；“归于”保持方向关系，又不过度解释具体施行方式。
- source_word: לְזַוֲעָה
  choice: 令人惊骇
  rationale: 该词表示引发恐惧、震骇的对象；此译法符合现代汉语搭配，并与“在地上万国中”自然衔接。
- source_word: מַמְלְכוֹת הָאָרֶץ
  choice: 地上万国
  rationale: 该短语在此具有国际范围；“地上万国”简洁地表达全地诸王国，而非仅指犹大本地。
theological_decisions:
- issue: 神所宣告之“自由”的反讽
  choice: 两处都使用“自由”，第二处加引号，并用脚注说明
  alternative: 第二处改译为“任凭”或“交给”
  rationale: 原文刻意重复 דְרוֹר，形成审判性的反转。若直接将第二处改成“交给”，虽清楚却会抹去关键词重复及其神学张力。
- issue: 释放命令中的男性及亲属用语
  choice: 各自向自己的弟兄和邻舍
  alternative: 每个人向同胞宣告自由
  rationale: 原文明确使用 אִישׁ、אָחִיו 和 רֵעֵהוּ；保留“弟兄”和“邻舍”呈现其法律社会语境，不将两个关系词合并。
- issue: 审判所涉及的主体与方向
  choice: 让你们归于刀剑、瘟疫和饥荒
  alternative: 使刀剑、瘟疫和饥荒自由攻击你们
  rationale: 原文语法以“向你们宣告自由”后接三个 אֶל 短语，具有刻意突兀之处；译文表达他们被置于这些灾祸之下，但不增添原文未明说的拟人化主体。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。“所以，耶和华如此说”“看哪”“这是耶和华的宣告”保留先知宣告的节奏；其余句法适度汉语化，避免古奥表达。两次“自由”严格对应原文重复，并以脚注保存其法律背景和审判反讽。
