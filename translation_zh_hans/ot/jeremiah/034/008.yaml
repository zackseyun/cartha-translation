base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/034/008.yaml
  text: 'The word that came to Jeremiah from Yahweh after King Zedekiah had made a covenant with all the people who were in Jerusalem[b][a], to proclaim liberty to them:'
translation:
  language: zh_hans
  text: 耶和华的话临到耶利米，是在西底家王与耶路撒冷的全体百姓立约[a]，向他们宣告自由[b]以后。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语字面为“切割约”；这是指订立约的习语。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“释放”。这里指正式使人获得自由。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַדָּבָר אֲשֶׁר הָיָה אֶל יִרְמְיָהוּ מֵאֵת יְהוָה
  choice: 耶和华的话临到耶利米
  rationale: 保留先知书中常见的启示引言格式；“临到”自然表达话语从耶和华而来，且符合现代中文圣经语体。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代简体中文读者熟悉的专名形式呈现四字神名，区别于称号“主”。
- source_word: אַחֲרֵי כְּרֹת
  choice: 在……立约以后
  rationale: כרת ברית是“订立盟约”的固定表达；中文“立约”既简洁自然，又保留其正式性。
- source_word: בְּרִית
  choice: 约
  rationale: “立约”准确体现בְּרִית的正式、关系性含义；脚注补明希伯来语的字面习语。
- source_word: אֶת כָּל הָעָם אֲשֶׁר בִּירוּשָׁלִַם
  choice: 与耶路撒冷的全体百姓
  rationale: “全体”保留כָּל的总括意义；将关系从句自然化为中文定语，同时不改变范围。
- source_word: לִקְרֹא לָהֶם
  choice: 向他们宣告
  rationale: 在דְּרוֹר作宾语的法律语境中，קרא表示正式公开宣布；“宣告”比普通的“告诉”更贴切。
- source_word: דְּרוֹר
  choice: 自由
  rationale: 此词在本段指正式释放奴仆、恢复自由；“自由”是现代中文最自然的正文用语，脚注说明也可理解为“释放”及其法律含义。
- source_word: צִדְקִיָּהוּ
  choice: 西底家
  rationale: 采用现代中文圣经传统中通行的人名译法。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文明确使用四字神名。中文正文采用读者最熟悉且具有专名功能的“耶和华”；“雅威”是更接近学术重构读音的另一可行译法。
- issue: דְּרוֹר所指自由的性质
  choice: 正文译“自由”，脚注说明为正式获得自由或释放
  alternative: 释放
  rationale: 本节本身用词简短，而下文才具体说明释放希伯来奴仆。正文不提前补入“奴仆”等对象，以免消除原句的简洁和后续展开；脚注保留其法律解放色彩。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“耶和华的话临到耶利米”保留先知性引言的传统节奏；后半句按中文语序调整为“是在……以后”，避免生硬逐词对应。正文中的脚注标记均紧随相关词语。
