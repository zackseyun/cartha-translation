  text: לְ֠/שַׁלַּח אִ֣ישׁ אֶת עַבְדּ֞/וֹ וְ/אִ֧ישׁ אֶת שִׁפְחָת֛/וֹ הָ/עִבְרִ֥י וְ/הָ/עִבְרִיָּ֖ה חָפְשִׁ֑ים לְ/בִלְתִּ֧י עֲבָד בָּ֛/ם בִּ/יהוּדִ֥י אָחִ֖י/הוּ אִֽישׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/034/009.yaml
  text: that each man should set free his male slave and each man his female slave[a], the Hebrew man and the Hebrew woman, so that no one should enslave a Jew, his brother, among them.
translation:
  language: zh_hans
  text: 各人都要释放自己的男奴和自己的女奴，就是希伯来男子和希伯来女子，使他们自由；各人不可奴役自己的犹大弟兄[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “犹大弟兄”也可译作“犹太弟兄”。这里的希伯来词既可指犹大人，也可指犹太人；在当时的历史背景下，“犹大人”更为具体。
    reason: alternative_reading
lexical_decisions:
- source_word: לְשַׁלַּח
  choice: 释放
  rationale: 在立约释放奴隶的语境中，此动词指解除奴役、使其获得自由，而非一般意义的“送走”或“打发走”。
- source_word: עַבְדּוֹ וְשִׁפְחָתוֹ
  choice: 自己的……男奴和女奴
  rationale: 上下文明确涉及受奴役者的释放；“男奴、女奴”既保留身份性质，也准确呈现希伯来文的性别对举。
- source_word: הָעִבְרִי וְהָעִבְרִיָּה
  choice: 希伯来男奴和女奴
  rationale: 将阳性和阴性族称分别落实在“男奴、女奴”上，清楚表明两者都是希伯来人，同时避免生硬重复“希伯来男人和希伯来女人”。
- source_word: חָפְשִׁים
  choice: 使他们自由
  rationale: 该词表示获释后成为自由人的状态；结合 לְשַׁלַּח 译成自然汉语“释放……使他们自由”。
- source_word: לְבִלְתִּי עֲבָד בָּם
  choice: 谁也不可再奴役
  rationale: 否定不定式表达此项释放行动的目的或结果；עבד ב 在此指使人服役、把人当奴隶使用。“再”由持续奴役必须终止的语境得出。
- source_word: בִּיהוּדִי אָחִיהוּ אִישׁ
  choice: 自己的犹大弟兄
  rationale: איש 在此具分配意义，译作“谁也”；אָחִיהוּ 保留盟约群体中的亲族称谓“自己的弟兄”；יהודי 在晚期犹大王国的历史背景下首选“犹大人”，并在脚注保留“犹太人”这一可行译法。
theological_decisions:
- issue: 受奴役身份词的译法
  choice: 采用“男奴、女奴”
  alternative: 采用“男仆、女仆”
  rationale: 本节所说的是必须解除的实际奴役关系；译作“仆”容易弱化法律与社会身份，因此采用明确的“奴”字。
- issue: יהודי 的历史与族群含义
  choice: 正文译作“犹大”
  alternative: 译作“犹太”
  rationale: 在耶利米所处的犹大王国末期，“犹大人”更能呈现地域—政治背景；但该词也发展为族群—宗教意义上的“犹太人”，故以脚注保留真实的词义张力。
- issue: 弟兄称谓
  choice: 保留“自己的……弟兄”
  alternative: 译作“同胞”或“本族的人”
  rationale: “弟兄”保留原文的亲族及盟约共同体色彩，不把它完全解释为一般族群关系。
- issue: 性别对举
  choice: 明确译出“男奴和女奴”
  alternative: 统称“奴隶”
  rationale: 原文以阳性、阴性形式逐一列举，译文保留这一明确区分。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“各人都要”体现原文的逐一分配结构；分号划分释放命令及其目的。“自己的犹大弟兄”保留原文的弟兄措辞，同时避免过度展开原文紧凑句法。
