  text: וַ/יָּשׁ֨וּבוּ֙ אַחֲרֵי כֵ֔ן וַ/יָּשִׁ֗בוּ אֶת הָֽ/עֲבָדִים֙ וְ/אֶת הַ/שְּׁפָח֔וֹת אֲשֶׁ֥ר שִׁלְּח֖וּ חָפְשִׁ֑ים ו/יכבישו/ם לַ/עֲבָדִ֖ים וְ/לִ/שְׁפָחֽוֹת־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/034/011.yaml
  text: But afterward they turned back and brought back the male slaves and the female slaves whom they had set free[a], and they forced them into slavery as male and female slaves.
translation:
  language: zh_hans
  text: 但后来，他们反悔了，把已经释放[a]的男女奴隶带了回来，强迫他们重新做男女奴隶。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“使他们自由离去”。希伯来语的表达兼有放走和使其获得自由之意。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשׁוּבוּ
  choice: 他们反悔了
  rationale: 这里的שוב表示在先前释放奴隶之后改变做法、转回原来的决定；“反悔”自然地表达这种逆转，而不理解为单纯返回某地。
- source_word: אַחֲרֵי כֵן
  choice: 后来
  rationale: 简洁自然地表达事情在先前释放行动之后发生。
- source_word: וַיָּשִׁבוּ
  choice: 带了回来
  rationale: 这是שוב的使役形，表示使那些已获释的人回来；“带了回来”保留使役意味。
- source_word: הָעֲבָדִים וְאֶת הַשְּׁפָחוֹת
  choice: 男女奴隶
  rationale: 上下文明确涉及被释放后又遭奴役的人，因此译为“奴隶”而非较弱的“仆人”；“男女”保留עֲבָדִים与שְׁפָחוֹת的性别对应。
- source_word: שִׁלְּחוּ חָפְשִׁים
  choice: 已经释放
  rationale: 该短语指解除奴役、使人成为自由人；“已经释放”也清楚交代这是先于本句行动完成的事。
- source_word: וַיִּכְבְּשׁוּם
  choice: 强迫他们重新做
  rationale: כָּבַשׁ有压服、使受辖制之意；结合后面的奴隶身份，此处表达强制重新奴役。“重新”由释放后再受奴役的上下文自然得出。
- source_word: לַעֲבָדִים וְלִשְׁפָחוֹת
  choice: 男女奴隶
  rationale: 介词ל在此表示被压服后所处的结果身份；与前文对应，译作“做男女奴隶”自然清楚。
