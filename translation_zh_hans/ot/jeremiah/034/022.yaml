source:
  edition: WLC
  text: הִנְ/נִ֨י מְצַוֶּ֜ה נְאֻם יְהוָ֗ה וַ/הֲשִׁ֨בֹתִ֜י/ם אֶל הָ/עִ֤יר הַ/זֹּאת֙ וְ/נִלְחֲמ֣וּ עָלֶ֔י/הָ וּ/לְכָד֖וּ/הָ וּ/שְׂרָפֻ֣/הָ בָ/אֵ֑שׁ וְ/אֶת עָרֵ֧י יְהוּדָ֛ה אֶתֵּ֥ן שְׁמָמָ֖ה מֵ/אֵ֥ין יֹשֵֽׁב־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/034/022.yaml
  text: Behold[a], I am commanding, declares Yahweh, and I will bring them back to this city, and they will fight against it and capture it and burn it with fire. And I will make the cities of Judah a desolation[b], without inhabitant.
translation:
  language: zh_hans
  text: “看哪，我要下令——雅威宣告——使他们返回这城[a]。他们必攻打这城，将它攻取，放火焚烧。我要使犹大的各城荒凉，无人居住[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “使他们返回”也可译作“把他们带回”。希伯来文使用使役词形；按上下文，“他们”指先前撤离耶路撒冷的敌军。
    reason: 说明使役词形及代词所指。
  - marker: b
    text: 或译：“没有一个居民。”希伯来语这一惯用表达强调城邑完全荒废、居民尽失。
    reason: 说明希伯来语惯用语的强调含义。
lexical_decisions:
- source_word: הִנְנִי
  choice: 看哪
  rationale: 保留先知话语中引人注意的提示语，语体庄重，在现代汉语中仍清楚可懂。
- source_word: מְצַוֶּה
  choice: 我正发令
  rationale: 分词表达正在发生或迫近的神圣行动；“正发令”既保留其时体色彩，也避免把后句误解为命令的直接内容。
- source_word: נְאֻם יְהוָה
  choice: 雅威宣告
  rationale: 保留庄严的先知宣告公式，并将四字神名按其专名译作“雅威”。
- source_word: וַהֲשִׁבֹתִים
  choice: 我必使他们返回
  rationale: 使役词形表示雅威使先前撤离的敌军返回；“使……返回”清楚保留使役含义。
- source_word: הָעִיר הַזֹּאת
  choice: 这城
  rationale: 所指为上下文中的耶路撒冷；“这城”简洁自然。
- source_word: וְנִלְחֲמוּ עָלֶיהָ
  choice: 他们必攻打这城
  rationale: 在围城语境中表达针对该城进行军事攻击；重复“这城”比代词“它”更符合自然汉语。
- source_word: וּלְכָדוּהָ
  choice: 将它攻取
  rationale: לכד用于城邑时指以军事行动夺取；“攻取”准确体现围城背景。
- source_word: וּשְׂרָפֻהָ בָאֵשׁ
  choice: 放火焚烧
  rationale: 自然传达希伯来语“用火烧”的加强表达，并保留审判的强烈程度。
- source_word: עָרֵי יְהוּדָה
  choice: 犹大的各城
  rationale: 准确表达复数城邑及其与犹大的所属关系。
- source_word: אֶתֵּן שְׁמָמָה
  choice: 我要使……荒凉
  rationale: 以自然汉语表达“使之成为荒场”的结果义。
- source_word: מֵאֵין יֹשֵׁב
  choice: 无人居住
  rationale: 准确表达没有居民、彻底人口空虚的希伯来语惯用语。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用以色列上帝的专名；音译“雅威”保留其专名性质，不以称号替代。
- issue: 使敌军返回的行动主体
  choice: 明确由雅威使他们返回
  alternative: 他们自行返回
  rationale: וַהֲשִׁבֹתִים 是使役词形，语法上以雅威为行动主体；“他们”按上下文指围攻耶路撒冷的敌军。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“看哪”保留先知宣告的庄严语气；句中破折号标明“雅威宣告”为插入的宣告公式。用“必”传达确定的将来行动，并以“攻打—攻取—焚烧”的递进保持原文审判话语的力度。
