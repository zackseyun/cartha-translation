  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/אַתָּ֗ה לֹ֚א תִמָּלֵט֙ מִ/יָּד֔/וֹ כִּ֚י תָּפֹ֣שׂ תִּתָּפֵ֔שׂ וּ/בְ/יָד֖/וֹ תִּנָּתֵ֑ן וְֽ֠/עֵינֶי/ךָ אֶת עֵינֵ֨י מֶֽלֶךְ בָּבֶ֜ל תִּרְאֶ֗ינָה וּ/פִ֛י/הוּ אֶת פִּ֥י/ךָ יְדַבֵּ֖ר וּ/בָבֶ֥ל תָּבֽוֹא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/034/003.yaml
  text: And you will not escape from his hand[a], for you will surely be captured and given into his hand. Your eyes will see the eyes of the king of Babylon, and his mouth will speak to your mouth, and you will go to Babylon.
translation:
  language: zh_hans
  text: 而你逃不出他的手[a]，因为你必被捉住，交在他手中。你的眼睛必看见巴比伦王的眼睛；他必亲口同你说话，你也必到巴比伦去。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “他的手”指他的权势或控制。
    reason: 说明希伯来语“从某人的手中逃脱／交在某人手中”的惯用意象。
lexical_decisions:
- source_word: תִמָּלֵט מִיָּדוֹ
  choice: 逃不出他的手
  rationale: “从某人的手中逃脱”表示脱离其权势或控制；保留“手”的具体意象，同时符合现代汉语表达。
- source_word: כִּי תָּפֹשׂ תִּתָּפֵשׂ
  choice: 因为你必被捉住
  rationale: 不定式绝对形与限定动词连用，强化被捕的确定性；汉语用“必”简洁传达强调。
- source_word: וּבְיָדוֹ תִּנָּתֵן
  choice: 交在他手中
  rationale: 被动式 נתן 与“在他手中”连用，表示被交付其控制；译文保留希伯来文的手之意象。
- source_word: וְעֵינֶיךָ אֶת־עֵינֵי מֶלֶךְ בָּבֶל תִּרְאֶינָה
  choice: 你的眼睛必看见巴比伦王的眼睛
  rationale: 保留原文“你的眼睛”与“王的眼睛”相对的鲜明表达，强调亲自、直接面对巴比伦王，而不将其完全意译为“面对面”。
- source_word: וּפִיהוּ אֶת־פִּיךָ יְדַבֵּר
  choice: 他的口必与你的口说话
  rationale: 原文直译近于“他的口向/同你的口说话”，表达双方直接交谈。正文保留具体而不寻常的口对口意象，并以脚注说明自然汉语含义。
- source_word: וּבָבֶל תָּבוֹא
  choice: 你也必到巴比伦去
  rationale: בוא 可依叙述视角译作“来”或“去”；对受话者而言，“到巴比伦去”在现代汉语中自然，并保留目的地含义。
theological_decisions: []
