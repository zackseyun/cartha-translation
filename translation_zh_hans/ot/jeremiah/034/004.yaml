id: JER.34.4
reference: Jeremiah 34:4
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: אַ֚ךְ שְׁמַ֣ע דְּבַר יְהוָ֔ה צִדְקִיָּ֖הוּ מֶ֣לֶךְ יְהוּדָ֑ה כֹּֽה אָמַ֤ר יְהוָה֙ עָלֶ֔י/ךָ לֹ֥א תָמ֖וּת בֶּ/חָֽרֶב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/034/004.yaml
  text: 'Yet hear the word of Yahweh, Zedekiah king of Judah: Thus says Yahweh concerning you, You shall not die by the sword.'
translation:
  language: zh_hans
  text: 不过，犹大王西底家啊，你要听雅威[a]的话。雅威论到你如此说：“你必不死于刀剑之下。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “雅威”是希伯来文中以色列之神的专名，常写作 YHWH。
    reason: 帮助现代中文读者识别音译神名，同时不以称号替代原文专名。
lexical_decisions:
- source_word: אַךְ
  choice: 不过
  rationale: 此处承接前文的审判宣告，引出一个带安慰意味的转折和限定；“不过”自然地表达这种逆转语气。
- source_word: שְׁמַע
  choice: 你要听
  rationale: 保留命令语气，也符合先知信息中“听……的话”这一庄重而清楚的表达。
- source_word: דְּבַר יְהוָה
  choice: 雅威的话
  rationale: “话”保留希伯来语 דָּבָר 在先知宣告中的固定用语和权威色彩，而不将其解释性地改为“信息”。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文直接音译神的专名，避免以“主”这一称号代替原文中的名字。
- source_word: צִדְקִיָּהוּ מֶלֶךְ יְהוּדָה
  choice: 犹大王西底家
  rationale: 采用现代中文圣经人名和地名的通行译法，并按自然汉语次序表达其王位与辖地。
- source_word: כֹּה אָמַר יְהוָה
  choice: 雅威……如此说
  rationale: 保留希伯来先知使者宣告的固定格式及其庄重语气，同时使中文句法自然。
- source_word: עָלֶיךָ
  choice: 论到你
  rationale: 这里的 עַל 指宣告的对象或内容，即关于西底家的命运，并非表示敌对意义的“攻击你”。
- source_word: לֹא תָמוּת
  choice: 你必不死
  rationale: 否定式未完成体在此预告将来的结果；“必不”兼顾预言的确定语气和庄重文体。
- source_word: בֶּחָרֶב
  choice: 死于刀剑之下
  rationale: 保留“刀剑”的具体意象和暴力死亡之义，不将其缩窄解释为只在战场上阵亡。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文使用四字神名，而非表示“主”的称号；“雅威”较直接地反映通常重构的读音，并借脚注说明其性质。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“犹大王西底家啊”保留直接呼告；“如此说”和“必不死于刀剑之下”维持先知宣告的庄严节奏，不过度古文化。
