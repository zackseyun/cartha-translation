  yaml_path: translation/ot/jeremiah/034/006.yaml
  text: Then Jeremiah the prophet spoke all these words to Zedekiah king of Judah in Jerusalem.
translation:
  language: zh_hans
  text: 于是，先知耶利米在耶路撒冷把这一切话都告诉了犹大王西底家。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: 于是……告诉了
  rationale: 叙事性连续式推进情节，译作“于是”自然承接上文；在“把这一切话”结构中，“告诉了”比生硬的“说了”更符合现代汉语，同时保留向西底家传达信息的含义。
- source_word: יִרְמְיָהוּ הַנָּבִיא
  choice: 先知耶利米
  rationale: 保留原文明确的职分称谓，并按现代汉语习惯将称谓置于姓名之前。
- source_word: אֶל צִדְקִיָּהוּ מֶלֶךְ יְהוּדָה
  choice: 犹大王西底家
  rationale: 按现代汉语常用次序表达王的辖地、身份和姓名；“王”在此已由专名明确限定，无须另加“那位”。
- source_word: אֵת כָּל הַדְּבָרִים הָאֵלֶּה
  choice: 把这一切话都
  rationale: דברים 在语境中指先前的预言言辞，故译为“话”；“这一切”与“都”共同自然体现原文“所有这些”的完整范围。
- source_word: בִּירוּשָׁלִָם
  choice: 在耶路撒冷
  rationale: 直接表达地点；置于主语之后，使整句符合自然现代汉语语序。
