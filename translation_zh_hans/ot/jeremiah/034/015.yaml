  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/תָּשֻׁ֨בוּ אַתֶּ֜ם הַ/יּ֗וֹם וַ/תַּעֲשׂ֤וּ אֶת הַ/יָּשָׁר֙ בְּ/עֵינַ֔/י לִ/קְרֹ֥א דְר֖וֹר אִ֣ישׁ לְ/רֵעֵ֑/הוּ וַ/תִּכְרְת֤וּ בְרִית֙ לְ/פָנַ֔/י בַּ/בַּ֕יִת אֲשֶׁר נִקְרָ֥א שְׁמִ֖/י עָלָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/034/015.yaml
  text: And you yourselves had turned back today and had done what was right in my eyes[a], by proclaiming liberty, each man to his neighbor[b]; and you had cut a covenant before me in the house that is called by my name.
translation:
  language: zh_hans
  text: 你们今日回转，行了我眼中看为正的事：各人向自己的同胞宣告自由；又在我面前，在那称为我名下的殿中立约[a]。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “立约”按希伯来文直译为“切约”；这可能保留了立约仪式中切开祭牲的意象。参本章18—19节。
    reason: lexical_alternative
  - marker: b
    text: “那殿”指耶路撒冷的圣殿。
    reason: cultural_note
lexical_decisions:
- source_word: וַתָּשֻׁבוּ
  choice: 回转
  rationale: שׁוּב的基本义是转回、返回；此处指他们扭转先前的行为，重新顺服盟约要求。译作“回转”保留行为转向的含义，不把它限定为内心彻底悔改。
- source_word: הַיּוֹם
  choice: 今日
  rationale: 直接表达原文的时间指示；“今日”庄重而仍属现代汉语。
- source_word: הַיָּשָׁר בְּעֵינַי
  choice: 我眼中看为正的事
  rationale: 保留希伯来语“在我眼中为正”的意象，表达上帝对行为的道德判断。
- source_word: לִקְרֹא דְרוֹר
  choice: 宣告自由
  rationale: דְּרוֹר在此指正式宣布释放奴仆、使其获得自由；“宣告自由”保留公开且具法律效力的语气。
- source_word: אִישׁ לְרֵעֵהוּ
  choice: 各人向自己的同胞
  rationale: אִישׁ为分配性表达，“各人”自然传达逐一的含义；רֵעַ在本段以同一民族共同体成员为对象，译作“同胞”比泛指的“邻舍”更切合释放希伯来奴仆的语境。
- source_word: וַתִּכְרְתוּ בְרִית
  choice: 你们也……立约
  rationale: כרת ברית字面为“切约”，是希伯来语固定的立约用语；正文采用现代汉语自然的“立约”，并以脚注说明其字面意象。
- source_word: לְפָנַי
  choice: 在我面前
  rationale: 既保留原文空间意象，也表达立约是在上帝临在与见证之下进行。
- source_word: בַּבַּיִת אֲשֶׁר נִקְרָא שְׁמִי עָלָיו
  choice: 在称为我名下的那殿中
  rationale: “称为我名下”保留归属于上帝、以其名命名的希伯来表达；在此“房屋”明确指圣殿，译作“殿”符合上下文和现代汉语。
theological_decisions:
- issue: 盟约惯用语 כרת ברית 的表达
  choice: 正文译为“立约”，脚注注明字面为“切立盟约”
  alternative: 正文直译为“切立盟约”
  rationale: “立约”是自然、准确的现代汉语，不会遮蔽正式缔结盟约的意义；脚注保存“切”的仪式性意象，并与本章后文从劈开的祭牲中间经过的仪式相呼应。
- issue: אִישׁ לְרֵעֵהוּ 的性别与共同体范围
  choice: 各人向自己的同胞
  alternative: 各个男人向自己的邻舍
  rationale: 希伯来语单数阳性在这里构成分配性惯用表达；“各人”不额外断定只有男性主人，同时“同胞”准确反映本段希伯来人彼此释放奴仆的盟约共同体语境。
- issue: וַתָּשֻׁבוּ 是否译为完全的悔改
  choice: 回转
  alternative: 悔改
  rationale: 上下文随即说明他们后来反悔，因此此词主要描述行为上的转回；“回转”保留其可能具有属灵意味的张力，却不宣称这是彻底、持久的内在悔改。
translation_notes:
  register: 采用现代、庄重而清楚的书面汉语。句中以冒号说明何为“正的事”，并用分号连接宣告自由与在上帝面前立约这两个紧密相关的行动。保留“我眼中”“在我面前”“称为我名下”等原文意象，同时避免生硬照搬希伯来语句法。
