reference: Jeremiah 13:2
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וָ/אֶקְנֶ֥ה אֶת הָ/אֵז֖וֹר כִּ/דְבַ֣ר יְהוָ֑ה וָ/אָשִׂ֖ם עַל מָתְנָֽ/י־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/013/002.yaml
  text: So I bought the loincloth according to the word of Yahweh[a], and put it on my waist.
translation:
  language: zh_hans
  text: 于是，我照着雅威的话买了那条腰布[a]，系在腰间。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “腰布”也可译作“腰带”或“束带”；希伯来语指束在腰间、贴近身体的衣物。
    reason: 说明 אֵזוֹר 的词义范围，避免把具体形制解释得过窄。
lexical_decisions:
- source_word: וָאֶקְנֶה
  choice: 于是，我……买了
  rationale: 该词是 קנה 的第一人称单数连续叙事形式，表示承接上一节命令而采取的下一步行动。“于是”自然体现因命令而行动的叙事关系。
- source_word: הָאֵזוֹר
  choice: 那条腰布
  rationale: אֵזוֹר 指束在腰间、贴近身体的布制衣物，也可指腰带或束带。结合上下文中穿戴及不可沾水的命令，“腰布”较能保留其衣物性质；其他可能译法列入脚注。
- source_word: כִּדְבַר יְהוָה
  choice: 照着雅威的话
  rationale: 较贴近原文“按照雅威的话”，表达依照神所发命令而行；现代汉语自然且保留原文措辞。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见音译呈现四字神名，而不以称号代替专名。
- source_word: וָאָשִׂם עַל־מָתְנָי
  choice: 系在腰间
  rationale: 原文直义为“放在我的腰上”。在穿戴腰布的语境中，“系在腰间”是自然、明确的现代汉语表达。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。译作“雅威”保留其专名性质；“耶和华”是传统汉译形式，“主”则以称号替代神名。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“于是”承接上一节的命令；“照着雅威的话”保留原文的正式表达；“系在腰间”按汉语穿戴习惯处理。
