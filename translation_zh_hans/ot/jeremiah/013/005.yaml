  yaml_path: translation/ot/jeremiah/013/005.yaml
  text: So I went and hid it by the Euphrates[a], as Yahweh had commanded me.
translation:
  language: zh_hans
  text: 我就去把它藏在幼发拉底河边[a]，正如耶和华吩咐我的那样。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文作“伯拉”，通常理解为幼发拉底河；也有人认为这是当地一处名叫“伯拉”的地方。
    reason: 保留该专名可能指本地地点的另一种解释。
lexical_decisions:
- source_word: וָאֵלֵךְ
  choice: 于是我去
  rationale: 叙事性连续式推进事件；“于是”自然表达前命令与随后行动之间的承接关系。
- source_word: וָאֶטְמְנֵהוּ
  choice: 把它藏
  rationale: טמן的基本义是“隐藏、藏匿”；宾语后缀指上文的腰带。“藏”保留动作方式的宽泛性，不具体化为“埋”。
- source_word: בִּפְרָת
  choice: 在幼发拉底河边[a]
  rationale: פְרָת通常指幼发拉底河；介词ב在此结合藏物地点自然译为“在……边”。因该名称也可能被理解为本地一处名叫“毗拉”的地方，脚注保留此歧义。
- source_word: כַּאֲשֶׁר
  choice: 照着
  rationale: 表示行动符合先前的命令；“照着”在现代汉语中自然且准确。
- source_word: צִוָּה
  choice: 所吩咐
  rationale: צוה意为命令、吩咐；关系结构“所吩咐我的”自然表达耶利米按先前命令行事。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的专名形式，明确对应希伯来文四字神名。
- source_word: אוֹתִי
  choice: 我
  rationale: 直接宾语标记带第一人称单数后缀，在“吩咐我”中直接译作“我”。
theological_decisions:
- issue: פְרָת的地点认定
  choice: 幼发拉底河
  alternative: 名叫“毗拉”的本地地点
  rationale: 该词通常是幼发拉底河的希伯来名称，因此正文采用标准认定；但上下文所引发的地理疑问使本地同名地点的解释仍有可能，故以脚注保留，不在正文中强行消除歧义。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“于是”体现叙事推进；“藏”避免将原文过度具体化为“埋”；脚注保留地点认定上的真实歧义。
