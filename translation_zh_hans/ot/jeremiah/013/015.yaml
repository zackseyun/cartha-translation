  text: שִׁמְע֥וּ וְ/הַאֲזִ֖ינוּ אַל תִּגְבָּ֑הוּ כִּ֥י יְהוָ֖ה דִּבֵּֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/013/015.yaml
  text: Hear and listen; do not be proud[a], for Yahweh has spoken.
translation:
  language: zh_hans
  text: 你们要听，要侧耳听；不要高傲[a]，因为雅威已经说了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“不要自高”。希伯来语动词本义为“高”，在这里指骄傲自大。
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעוּ
  choice: 你们要听
  rationale: 该词是复数祈使式。译出“你们”以体现复数受众，并用“要听”保留直接命令的语气。
- source_word: וְהַאֲזִינוּ
  choice: 要侧耳听
  rationale: 该使役词形含专心倾听、留心听取之意。“侧耳听”既自然庄重，也保留与前一个“听”并列所形成的强调。
- source_word: אַל תִּגְבָּהוּ
  choice: 不要高傲
  rationale: 否定词与未完成式构成禁令；גבהּ本义与“高”有关，此处指态度上的自高。“高傲”简洁清楚，同时保留其高度隐喻。
- source_word: כִּי
  choice: 因为
  rationale: 此处最自然地引出听从禁令的理由；“因为”清楚表达因果关系。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以常见的现代汉语音译呈现四字神名，而不以称号替代专名。
- source_word: דִּבֵּר
  choice: 已经说了
  rationale: 该完成式表示言说已经发生，并对当前命令具有效力。“已经说了”符合现代汉语表达，也保持先知宣告的直接性。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用神的专名。采用“雅威”作为对该名的现代汉语音译，避免用“主”等称号取代专名；“耶和华”是传统译名，但所反映的读音来源不同。
- issue: תִּגְבָּהוּ 的道德含义
  choice: 不要高傲
  alternative: 不要自高
  rationale: 上下文要求将“高”理解为骄傲自大。“高傲”在现代汉语中清楚自然；脚注保留“自高”这一更贴近源语形象的译法，避免抹去词义幅度。
translation_notes:
  register: 采用现代、庄重而易懂的书面语。保留两个近义祈使句的修辞叠加强调，以“听／侧耳听”呈现；标点简洁，适合公开诵读。
