  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: הָ/עָם֩ הַ/זֶּ֨ה הָ/רָ֜ע הַֽ/מֵּאֲנִ֣ים לִ/שְׁמ֣וֹעַ אֶת דְּבָרַ֗/י הַ/הֹֽלְכִים֙ בִּ/שְׁרִר֣וּת לִבָּ֔/ם וַ/יֵּלְכ֗וּ אַֽחֲרֵי֙ אֱלֹהִ֣ים אֲחֵרִ֔ים לְ/עָבְדָ֖/ם וּ/לְ/הִשְׁתַּחֲוֺ֣ת לָ/הֶ֑ם וִ/יהִי֙ כָּ/אֵז֣וֹר הַ/זֶּ֔ה אֲשֶׁ֥ר לֹא יִצְלַ֖ח לַ/כֹּֽל׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/013/010.yaml
  text: This evil people[a], who refuse to hear my words, who walk in the stubbornness of their heart, and who go after other gods to serve them and to bow down to them, will become like this waistband, which is good for nothing.
translation:
  language: zh_hans
  text: 这群邪恶的百姓拒绝听我的话，随从自己顽梗的心而行，又跟从别神，服事它们，向它们下拜；这百姓必变得像这条腰带，毫无用处。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָעָם הַזֶּה הָרָע
  choice: 这邪恶的百姓
  rationale: 保留 עָם 的群体含义和 רַע 的强烈道德定性；“百姓”比“民族”更贴合这里所指的犹大和耶路撒冷群体。
- source_word: הַמֵּאֲנִים לִשְׁמוֹעַ אֶת־דְּבָרַי
  choice: 拒绝听我的话
  rationale: מָאֵן 表示主动拒绝，并非仅仅没有听见；“听”也保留希伯来语中听从、顺服的潜在意味。中文“话”可自然统摄原文复数 דְּבָרַי。
- source_word: הַהֹלְכִים בִּשְׁרִרוּת לִבָּם
  choice: 照着自己顽梗的心行事
  rationale: “行事”自然传达 הלך 的行为隐喻；שְׁרִרוּת 指执拗、顽梗，而非一般愿望。“自己……的心”在中文中自然表达原文集合性单数的分配意义。
- source_word: וַיֵּלְכוּ אַחֲרֵי אֱלֹהִים אֲחֵרִים
  choice: 又跟从别神
  rationale: “跟从”准确表达“走在……之后”的惯用意义，并与前面的持续行为描述衔接；不强行限定为单次过去行为。
- source_word: לְעָבְדָם וּלְהִשְׁתַּחֲוֺת לָהֶם
  choice: 服事它们，向它们下拜
  rationale: 分别保留 עבד 的事奉、效忠意义与 השתחוה 的俯伏下拜动作，避免把两个动词都笼统译成“敬拜”。
- source_word: וִיהִי כָּאֵזוֹר הַזֶּה
  choice: 他们必像这条腰带一样
  rationale: וִיהִי 在这里引出预告的结果；中文以“必像……一样”自然表达。אֵזוֹר 是束在腰间的衣物或带子，“腰带”清楚且符合上下文。
- source_word: אֲשֶׁר לֹא יִצְלַח לַכֹּל
  choice: 毫无用处
  rationale: 这是表示完全无用的强烈说法；“毫无用处”简洁、自然，并保留其绝对语气。
theological_decisions:
- issue: 偶像崇拜用语中两个动作的区分
  choice: 将 עבד 译为“服事”，将 השתחוה 译为“下拜”
  alternative: 将两者都译为“敬拜”
  rationale: 原文刻意使用两个不同动词，分别描述效忠服事和俯伏下拜；保留区别可完整呈现指控，而不额外加入宗派性解释。
- issue: “听”的顺服意味
  choice: 保留直译“听”，让上下文承载听从的意味
  alternative: 明确译为“听从”
  rationale: לִשְׁמוֹעַ 既可指听，也常含顺服之意；译作“听”保留原文的语义张力，避免在正文中完全消除歧义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。句子以分号区分百姓持续的悖逆行为与随后的审判结果；避免生硬复制希伯来语连续关系从句，同时保留“顽梗的心”“服事”“下拜”等核心意象。
