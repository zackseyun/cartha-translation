id: JER.13.17
reference: Jeremiah 13:17
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/אִם֙ לֹ֣א תִשְׁמָע֔וּ/הָ בְּ/מִסְתָּרִ֥ים תִּבְכֶּֽה נַפְשִׁ֖/י מִ/פְּנֵ֣י גֵוָ֑ה וְ/דָמֹ֨עַ תִּדְמַ֜ע וְ/תֵרַ֤ד עֵינִ/י֙ דִּמְעָ֔ה כִּ֥י נִשְׁבָּ֖ה עֵ֥דֶר יְהוָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/013/017.yaml
  text: But if you will not listen[a], my soul will weep in secret because of pride; my eyes will weep bitterly and run down with tears[e][d][c][b], because the flock of Yahweh has been taken captive.
translation:
  language: zh_hans
  text: 但你们若不听从这话[a]，我的心必因你们的骄傲[c]暗自哭泣[b]；我的眼必痛哭[d]，泪流不止，因为雅威的羊群[e]已被掳去。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “听从”也可译作“听”或“听见”；原词兼有聆听和依从的含义。
    reason: lexical_alternative
  - marker: b
    text: 直译“在隐密处”。
    reason: lexical_alternative
  - marker: c
    text: “骄傲”也可译作“傲慢”。
    reason: lexical_alternative
  - marker: d
    text: 原文用同源词重复来加强语气，直译近似“哭泣，必定哭泣”。
    reason: lexical_alternative
  - marker: e
    text: “雅威”是上帝名字יהוה的音译；传统译法作“耶和华”。
    reason: translation_tradition
lexical_decisions:
- source_word: תִשְׁמָעוּהָ
  choice: 听从这话
  rationale: שׁמע可指听见、聆听或听从；此处既有聆听先知警告、又有依从之意。阴性单数宾语后缀明确存在，结合上文，以“这话”自然承接先知的信息，同时不把所指限定得过细。
- source_word: בְּמִסְתָּרִים
  choice: 暗自
  rationale: 原文复数形式直译为“在隐密处”，这里表达不为人见的哀哭；“暗自”符合现代汉语习惯，也保留隐秘哀恸之意。
- source_word: תִּבְכֶּה נַפְשִׁי
  choice: 我的心必……哭泣
  rationale: נפשׁ在此指说话者内在的生命与情感。“我的心”比“我的灵魂”更符合汉语哀歌表达，并保留内心深处悲恸的诗性。
- source_word: מִפְּנֵי גֵוָה
  choice: 因你们的骄傲
  rationale: מִפְּנֵי在此表示原因，גֵוָה指骄傲或傲慢。按语境补出“你们的”，明确这是百姓不肯听从所显出的骄傲。
- source_word: וְדָמֹעַ תִּדְמַע
  choice: 必痛哭
  rationale: 不定式绝对式与限定动词连用，加强哭泣的程度；“痛哭”以自然汉语传达这一强化语气。
- source_word: וְתֵרַד עֵינִי דִּמְעָה
  choice: 我的眼……泪流不止
  rationale: 希伯来语以单数“我的眼”作诗性表达，并描绘泪水向下流淌；汉语用“泪流不止”自然再现持续流泪的画面。
- source_word: נִשְׁבָּה
  choice: 已被掳去
  rationale: שׁבה的Niphal形式表示被俘、被掳。“被掳去”准确体现遭敌人带走，而不预先扩展为更广泛的“流亡”。
- source_word: עֵדֶר יְהוָה
  choice: 雅威的羊群
  rationale: 保留牧者—羊群的比喻，指属于雅威的百姓；יהוה按其专名音译为“雅威”。
theological_decisions:
- issue: תִשְׁמָעוּהָ中阴性后缀的所指
  choice: 以“这话”指向先知刚才所传的信息
  alternative: 可理解为泛指前述警告，或译得较含蓄，只说“不听从”
  rationale: 原文有阴性单数宾语后缀，上下文最自然地指向先知所说的信息；“这话”保留宾语，又不把它狭窄地限定为某一句话。
- issue: 哀哭者的声音
  choice: 按第一人称译作耶利米本人的哀哭
  alternative: 也可从先知代言的层面听出雅威借先知流露的悲痛
  rationale: 经文明说“我的心”“我的眼”，首先是先知个人的哀恸；译文维持第一人称，不排除其中同时回响着上帝的悲痛。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。以“听从这话”兼顾原文宾语后缀与听而遵行的语义；“我的心”“暗自哭泣”“泪流不止”保持哀歌的诗性，又避免生硬直译。所有脚注标记均置于对应词语之后。
