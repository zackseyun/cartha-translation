id: JER.13.1
reference: Jeremiah 13:1
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כֹּֽה אָמַ֨ר יְהוָ֜ה אֵלַ֗/י הָל֞וֹךְ וְ/קָנִ֤יתָ לְּ/ךָ֙ אֵז֣וֹר פִּשְׁתִּ֔ים וְ/שַׂמְתּ֖/וֹ עַל מָתְנֶ֑י/ךָ וּ/בַ/מַּ֖יִם לֹ֥א תְבִאֵֽ/הוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/013/001.yaml
  text: 'Thus Yahweh said to me: “Go and buy yourself a linen waistband[a], and put it on your waist, but do not put it in water.”'
translation:
  language: zh_hans
  text: 雅威这样对我说：“你去为自己买一条亚麻布腰带[a]，束在腰间，却不可把它放进水里。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“亚麻布带子”“亚麻布束带”，也可能指“亚麻布裹腰布”。希伯来语 אֵזוֹר 指束在腰部的衣物或带子。
    reason: 词义范围较宽，无法仅凭本节确定其具体形制。
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: 这样……说
  rationale: 这是先知书中常见的传话公式；译为“这样……说”既保留原文的庄重语气，也符合现代汉语表达。
- source_word: יְהוָה
  choice: 雅威
  rationale: 原文直接使用四字神名；“雅威”以现代汉语常见音译保留专名性质，不以称号替代。
- source_word: הָלוֹךְ וְקָנִיתָ לְּךָ
  choice: 你去为自己买
  rationale: 原文以不定词绝对式加强随后命令的语气；“你去”自然传达命令，“为自己买”保留购买含义及 לְּךָ 的受益者意味。
- source_word: אֵזוֹר פִּשְׁתִּים
  choice: 一条亚麻布腰带
  rationale: אֵזוֹר 泛指束在腰部的衣物或带子，פִּשְׁתִּים 表示亚麻材料；正文采用自然且不过度限定具体形制的译法，并以脚注保留其他可能。
- source_word: וְשַׂמְתּוֹ עַל מָתְנֶיךָ
  choice: 束在腰间
  rationale: מָתְנַיִם 指腰胯部位；对腰带而言，“束在腰间”比字面直译“放在腰上”更符合现代汉语习惯。
- source_word: וּבַמַּיִם לֹא תְבִאֵהוּ
  choice: 却不可把它放进水里
  rationale: 使役形态表达使该物进入水中；“放进水里”准确而自然。“却”体现并列句在语义上的转折。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文使用神的专名而非普通称号。音译“雅威”保留专名及其经文功能，同时避免用“主”消除原文专名与称号之间的区别。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“雅威这样对我说”保留先知传话公式；“束在腰间”按汉语搭配自然表达动作。正文不把 אֵזוֹר 过度具体化，相关形制差异置于脚注。
