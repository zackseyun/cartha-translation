id: JER.13.18
reference: Jeremiah 13:18
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: אֱמֹ֥ר לַ/מֶּ֛לֶךְ וְ/לַ/גְּבִירָ֖ה הַשְׁפִּ֣ילוּ שֵׁ֑בוּ כִּ֤י יָרַד֙ מַרְאֲשׁ֣וֹתֵי/כֶ֔ם עֲטֶ֖רֶת תִּֽפְאַרְתְּ/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/013/018.yaml
  text: Say to the king and to the queen mother[a], ‘Humble yourselves; sit down[b], for your glorious crown has come down from your heads.’
translation:
  language: zh_hans
  text: 你要对王和太后[a]说：“你们要降卑，坐下，因为你们华美的冠冕[b]已经从头上落下。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “太后”所译的希伯来语 גְּבִירָה 是王室女性的尊称；在这里很可能指王的母亲，而不是王的妻子。
    reason: cultural_note
  - marker: b
    text: 或更形式对应地译作“你们荣耀的冠冕”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱמֹר
  choice: 你要……说
  rationale: 这是单数命令式，用来引出先知受命传达的话；译文保留命令语气和直接引语结构。
- source_word: לַמֶּלֶךְ
  choice: 对王
  rationale: 定冠词单数名词前接介词，指在位的君王；“王”简洁而庄重。
- source_word: וְלַגְּבִירָה
  choice: 和太后
  rationale: גְּבִירָה 在王室语境中是女性尊位，常指王的母亲；“太后”比“王后”更能避免误指王的妻子。
- source_word: הַשְׁפִּילוּ
  choice: 你们要降卑
  rationale: 使役词干复数命令式表达降低自身地位，兼有身体下沉和身份受辱的意味；“降卑”保留这两层意象。
- source_word: שֵׁבוּ
  choice: 坐下
  rationale: 复数命令式，与“降卑”并列，描绘二人从尊位降下。
- source_word: כִּי
  choice: 因为
  rationale: 引出前述命令的理由，清楚表达因果关系。
- source_word: יָרַד
  choice: 已经……落下
  rationale: Qal完成式表示向下移动；“落下”保留冠冕由高处降下的图像，又不明说是自行掉落还是在审判中被除去。
- source_word: מַרְאֲשׁוֹתֵיכֶם
  choice: 从头上
  rationale: 该词可指头所在之处或头部位置；与冠冕连用时，“头上”最自然，并保留第二人称复数所指的两位王室人物。
- source_word: עֲטֶרֶת תִּפְאַרְתְּכֶם
  choice: 你们华美的冠冕
  rationale: 原文为领属结构，直译是“你们荣耀／华美的冠冕”；此译自然地表达冠冕的尊荣与华美，脚注另列较形式对应的译法。
theological_decisions:
- issue: 冠冕落下是否明确表示被夺去
  choice: 译作“已经从头上落下”
  alternative: “已经从你们头上被夺去”
  rationale: 原文使用普通的“下去、降下”而非明确表示夺取的动词；译文保留审判语境中的意象，不额外指定施事者或夺冠方式。
translation_notes:
  register: 采用现代、庄重且便于朗读的普通话。“降卑，坐下”保留原文两个并列命令及由尊位下降的意象；“华美的冠冕”兼顾汉语自然度和希伯来语领属结构的含义。
