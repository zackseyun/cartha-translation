  text: כֹּ֖ה אָמַ֣ר יְהוָ֑ה כָּ֠כָה אַשְׁחִ֞ית אֶת גְּא֧וֹן יְהוּדָ֛ה וְ/אֶת גְּא֥וֹן יְרוּשָׁלִַ֖ם הָ/רָֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/013/009.yaml
  text: 'Thus says Yahweh: In this way I will ruin the pride of Judah and the great pride of Jerusalem[a][b].'
translation:
  language: zh_hans
  text: 雅威如此说：“我要这样败坏[a]犹大的骄傲，以及耶路撒冷的极大骄傲[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “败坏”也可译作“毁坏”或“损坏”。希伯来语动词可表示使某物败坏、损毁或毁灭；这里采用“败坏”，是为呼应本章已经败坏的腰带这一意象。
    reason: lexical_alternative
  - marker: b
    text: “骄傲”也可理解为“狂妄”；这个词有时也指“威荣”或“显赫”，但在这里取这种意思的可能性较小。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语中常见的音译保留四字神名，将其作为专名呈现，而不以“耶和华”或“主”等传统译法替代。
- source_word: כֹּה אָמַר
  choice: 如此说
  rationale: 这是先知传信的固定公式；“雅威如此说”简洁、庄重，也保留原文的宣告语气。
- source_word: כָּכָה
  choice: 照样
  rationale: 指向前文腰带败坏的象征行动，表达“以同样的方式”，并与开头的 כֹּה 区分。
- source_word: אַשְׁחִית
  choice: 败坏
  rationale: 该词是 שׁחת 的使役式，可指使之毁坏、损坏或败坏；结合本章已经败坏的腰带意象，“败坏”既保留物件受损的画面，也适用于犹大和耶路撒冷所受的羞辱与审判。
- source_word: גְּאוֹן
  choice: 骄傲
  rationale: 此词可表示骄傲、狂妄，也可表示威荣或显赫；本节的审判语境偏向负面的“骄傲”，但脚注保留其词义张力。
- source_word: גְּאוֹן יְהוּדָה
  choice: 犹大的骄傲
  rationale: 直接呈现原文所属结构，并与后半句形成平行。
- source_word: גְּאוֹן יְרוּשָׁלִַם הָרָב
  choice: 耶路撒冷极大的骄傲
  rationale: 将 הָרָב 理解为修饰“骄傲”的程度词；“极大的”自然传达其强化作用。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主；主
  rationale: 原文直接使用四字神名，因此译文采用专名音译“雅威”，不以称号替代。
- issue: גְּאוֹן 的褒贬含义
  choice: 骄傲
  alternative: 狂妄；威荣；显赫
  rationale: 审判语境和下文百姓拒绝听从的描述支持负面含义，但该希伯来词本身也能表示威荣或显赫，故不把其他可能性完全排除，并在脚注中说明。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“雅威如此说”保留先知宣告的固定节奏；“照样”明确连接前文的象征行动。用“以及”稍作停顿，以呈现“犹大”与“耶路撒冷”的平行结构。
