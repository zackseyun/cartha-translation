  text: זֶ֣ה גוֹרָלֵ֧/ךְ מְנָת מִדַּ֛יִ/ךְ מֵֽ/אִתִּ֖/י נְאֻם יְהוָ֑ה אֲשֶׁר֙ שָׁכַ֣חַתְּ אוֹתִ֔/י וַֽ/תִּבְטְחִ֖י בַּ/שָּֽׁקֶר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/013/025.yaml
  text: This is your lot[a], the portion measured out to you from me, declares Yahweh[b], because you have forgotten me and trusted in falsehood.
translation:
  language: zh_hans
  text: 这是你的份[a]，是我量给你的份额——这是雅威的宣告——因为你忘记了我，信靠虚假[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“命运”或“所得的份额”。原文连用“抽签所得的份额”和“量定的份额”等词，强调这是分派给受话者的。
    reason: lexical_alternative
  - marker: b
    text: 或译“谎言”或“欺骗”。原词可指虚假、谎言或欺骗。
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶה גוֹרָלֵךְ
  choice: 这是你的份
  rationale: גוֹרָל指抽签所得或被分定的份额，在审判语境中也可指命运；“你的份”保留分配意象，并与下句呼应。
- source_word: מְנָת מִדַּיִךְ
  choice: 我量给你的那一份
  rationale: מְנָה与度量相关的מִדָּה组合，强调被量定、分配的份额；汉语采用主动表达，使מֵאִתִּי所表明的来源自然清楚。
- source_word: מֵאִתִּי
  choice: 我……给你的
  rationale: 该介词短语表示来源；融入“我量给你的”中，既自然又明确指出这份审判出自说话者。
- source_word: נְאֻם יְהוָה
  choice: 雅威宣告
  rationale: נְאֻם יְהוָה是庄严的先知宣告公式；“雅威宣告”自然保留其功能，并以音译呈现神名。
- source_word: אֲשֶׁר
  choice: 因为
  rationale: 此处关系词在语境中引出受审判的原因，译为“因为”最符合汉语句法。
- source_word: שָׁכַחַתְּ אוֹתִי
  choice: 你忘记了我
  rationale: 保留第二人称阴性单数的直接指控；中文不标语法性别，也不在正文中补出犹大或耶路撒冷。
- source_word: וַתִּבְטְחִי בַּשָּׁקֶר
  choice: 信靠虚假
  rationale: בָּטַח表示倚赖、信靠；שֶׁקֶר可指虚假、谎言或欺骗，“虚假”保持其宽泛性，不限定具体对象。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名；采用“雅威”音译，保留其作为专名的性质，而不以称号替代。
- issue: 第二人称阴性单数的指向
  choice: 保留为单数“你”
  alternative: 在正文明确译作“犹大”或“耶路撒冷”
  rationale: 原文以阴性单数直接说话，语境可指拟人化的城或群体；正文不补入原文未明说的名称，以保留指向方式。
- issue: שֶׁקֶר在本节中的范围
  choice: 虚假
  alternative: 谎言；欺骗
  rationale: 该词可能涵盖谎言、骗局，以及不可靠的信靠对象；“虚假”避免把审判理由过度限定为某一种含义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以破折号标出插入的先知宣告公式；正文保留“份／量给”之间的分配意象，并用脚注呈现真实的词义幅度。
