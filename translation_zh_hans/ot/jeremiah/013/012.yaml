id: JER.13.12
reference: Jeremiah 13:12
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/אָמַרְתָּ֨ אֲלֵי/הֶ֜ם אֶת הַ/דָּבָ֣ר הַ/זֶּ֗ה כֹּֽה אָמַ֤ר יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל כָּל נֵ֖בֶל יִמָּ֣לֵא יָ֑יִן וְ/אָמְר֣וּ אֵלֶ֔י/ךָ הֲ/יָדֹ֨עַ֙ לֹ֣א נֵדַ֔ע כִּ֥י כָל נֵ֖בֶל יִמָּ֥לֵא יָֽיִן־ס־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/013/012.yaml
  text: 'So you shall say to them this word: Thus says the LORD, the God of Israel, ‘Every jar will be filled with wine.’ And they will say to you, ‘Do we not certainly know that every jar will be filled with wine?’'
translation:
  language: zh_hans
  text: 所以，你要对他们说这话：耶和华以色列的上帝如此说：‘每个酒坛都要盛满酒。’他们必对你说：‘难道我们还不知道每个酒坛都要盛满酒吗？’
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נֵבֶל
  choice: 酒坛
  rationale: 此词指盛装液体的皮囊或陶罐；本节语境明确是盛酒的容器。译作“酒坛”自然、具体，也保留后文比喻所需的容器意象。
- source_word: יִמָּלֵא
  choice: 都要盛满
  rationale: 尼法勒未完成式表达将发生之事；“要盛满”既传达被填满的含义，也与后面的预告语气相称。
- source_word: הֲיָדֹעַ לֹא נֵדַע
  choice: 难道我们还不知道……吗
  rationale: 原文以不定式绝对形加强同根动词，构成带有不耐烦或讥讽意味的反问。“还不知道”自然传达他们认为此事显而易见的语气。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 耶和华
  alternative: 上主
  rationale: 采用现代简体中文圣经读者熟悉的专名译法，并与随后“以色列的上帝”这一称号清楚区分；不借此加入宗派性解释。
- issue: “酒坛盛满酒”是俗语还是预言性宣告
  choice: 按表层话语直译，不在正文解释其后续审判含义
  alternative: 将其意译为醉酒或审判的预告
  rationale: 本节刻意让听众先按显而易见的常理理解，真正的比喻意义在后续经文揭示；正文应保留这种张力。
translation_notes:
  register: 采用庄重而自然的现代普通话。“所以，你要……”承接上文命令；引语层次清晰。听众的回答译成口语化但不失庄重的反问，以呈现其自以为当然的态度。
