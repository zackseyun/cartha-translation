base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/013/007.yaml
  text: So I went to Perath[a], and dug, and took the waistband from the place where I had hidden it. And behold, the waistband was ruined[b]; it was good for nothing.
translation:
  language: zh_hans
  text: 于是我到了比拉[a]，挖掘后，从我藏腰带的地方把腰带取出来。看哪，腰带已经坏了[b]，毫无用处。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “比拉”可能指幼发拉底河；希伯来文作地名“比拉”。
    reason: alternative_reading
  - marker: b
    text: “腰带”也可译作“束带”“缠腰布”或“腰巾”；希伯来文指系在腰间的物件。
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּרָתָה
  choice: 比拉
  rationale: 按希伯来语地名音译，不在正文中直接认定为幼发拉底河；传统认定保留在脚注中。
- source_word: אֵזוֹר
  choice: 腰带
  rationale: 该词指系在腰间的衣物或带子；“腰带”在现代汉语中自然、具体，同时不过度限定其形制。
- source_word: טְמַנְתִּיו
  choice: 我藏……的
  rationale: טמן表示隐藏、藏匿，有时涉及埋藏；因上下文已有“挖开土”，正文采用较宽泛的“藏”，避免重复并保留词义范围。
- source_word: וְהִנֵּה
  choice: 看哪
  rationale: 保留原文引人注意、突出意外发现的叙事标记及庄重语气。
- source_word: נִשְׁחַת
  choice: 已经坏了
  rationale: 此处表示腰带受损、败坏而不能使用；“已经坏了”自然地传达发现时的结果状态。
- source_word: לֹא יִצְלַח לַכֹּל
  choice: 毫无用处
  rationale: 这是表达彻底无用的惯用说法；译文简洁自然，并保留原文的绝对程度。
- source_word: וָאֵלֵךְ ... וָאֶחְפֹּר ... וָאֶקַּח
  choice: 于是我……去，挖开土，……取出
  rationale: 连续的叙事动词表示依次发生的动作；“于是”承接上文命令，并以自然汉语呈现动作进程。
