source:
  edition: WLC
  text: וְ/נִפַּצְתִּי/ם֩ אִ֨ישׁ אֶל אָחִ֜י/ו וְ/הָ/אָב֧וֹת וְ/הַ/בָּנִ֛ים יַחְדָּ֖ו נְאֻם יְהוָ֑ה לֹֽא אֶחְמ֧וֹל וְ/לֹֽא אָח֛וּס וְ/לֹ֥א אֲרַחֵ֖ם מֵ/הַשְׁחִיתָֽ/ם־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/013/014.yaml
  text: And I will smash them against each other[a], man against his brother, fathers and sons together, declares Yahweh. I will not spare, nor will I pity, nor will I have compassion[b], from destroying them.
translation:
  language: zh_hans
  text: “我要使他们彼此相撞、撞得粉碎：各人与自己的弟兄相撞，父亲和儿子也一同如此。”雅威说：“我必不顾惜，不怜惜，也不怜悯；我绝不因这些而不毁灭他们。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְנִפַּצְתִּים
  choice: 我要使他们……撞碎
  rationale: נפץ表达猛烈撞击以致破碎；“撞碎”既保留动作的暴烈和具体性，也适合本句彼此相撞的语境。
- source_word: אִישׁ אֶל אָחִיו
  choice: 人撞弟兄
  rationale: 保留希伯来文分配性的单数表达及男性亲属称谓，突出人与至亲彼此相撞的惨烈。
- source_word: וְהָאָבוֹת וְהַבָּנִים יַחְדָּו
  choice: 父亲和儿子也一同如此
  rationale: 原文明确使用男性亲属称谓；“也一同如此”自然承接前面的撞击动作，并保留יַחְדָּו的共同性。
- source_word: נְאֻם יְהוָה
  choice: 这是雅威的宣告
  rationale: נְאֻם是先知书常见的神谕公式；译作“宣告”庄重自然，神名יְהוָה音译为“雅威”。
- source_word: לֹא אֶחְמֹל
  choice: 我必不顾惜
  rationale: חמל在审判语境中表示因怜惜而不下手；“不顾惜”与后续近义词有所区分。
- source_word: וְלֹא אָחוּס
  choice: 不怜惜
  rationale: חוס兼有怜惜、顾惜之意；此处用“不怜惜”保留三重否定的层递，同时避免与前词完全重复。
- source_word: וְלֹא אֲרַחֵם
  choice: 也不怜悯
  rationale: רחם强调怜悯和慈悲；“怜悯”是现代汉语中清楚、庄重而不过度附加教派含义的对应词。
- source_word: מֵהַשְׁחִיתָם
  choice: 定要毁灭他们
  rationale: מִן加不定式依附于前三个否定动词，表示不会因顾惜或怜悯而停止毁灭。汉语用“定要”明确传达不加阻止的结果，避免生硬的“从毁灭他们”。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名。音译“雅威”保留其专名性质，不以称号替代，也不把某一传统读法当作无争议形式。
- issue: 男性亲属称谓
  choice: 人撞弟兄，父亲和儿子
  alternative: 彼此相撞，父母和儿女
  rationale: 原文使用אִישׁ、אָח、אָבוֹת、בָּנִים等阳性单数或男性亲属词。保留这些称谓可呈现家庭纽带破裂的具体震撼，不将其泛化为中性表达。
- issue: 三重否定与毁灭之间的关系
  choice: 我必不顾惜，不怜惜，也不怜悯，定要毁灭他们
  alternative: 我必不顾惜、不怜惜、不怜悯，以致不毁灭他们
  rationale: מֵהַשְׁחִיתָם不是说“不毁灭”，而是说上述情感不会使毁灭受阻。译文保留三重否定，并用“定要”自然表达最终行动。
translation_notes:
  register: 采用现代、庄重而清楚的书面汉语。保留原文暴烈意象、男性亲属用语和三重否定的修辞，同时将末尾希伯来语结构转化为自然汉语，避免造成“不毁灭他们”的误读。
