  text: וַ/יְהִ֧י דְבַר יְהוָ֛ה אֵלַ֖/י שֵׁנִ֥ית לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/013/003.yaml
  text: And the word of Yahweh came to me a second time[a], saying,
translation:
  language: zh_hans
  text: 雅威[a]的话第二次临到我，说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文为“YHWH”；传统上常译作“耶和华”或“主”。
    reason: 说明神名的原文形式及传统译法。
lexical_decisions:
- source_word: וַיְהִי
  choice: 临到
  rationale: 在先知叙事的固定表达“雅威的话临到……”中，用“临到”自然传达该动词所引出的事件，也符合现代中文圣经语体。
- source_word: דְבַר
  choice: 话
  rationale: 保留“话语、言语”的基本词义，并在“雅威的话”这一先知性表达中自然指向神所启示的信息。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文四字神名 YHWH 作音译，保留其作为神专名的性质，而不以称号代替。
- source_word: אֵלַי
  choice: 我
  rationale: 其方向意义由中文结构“临到我”清楚表达，无须另加“向”。
- source_word: שֵׁנִית
  choice: 第二次
  rationale: 明确保留原文所说的次数，比单译“再次”更具体。
- source_word: לֵאמֹר
  choice: 说
  rationale: 自然引出下文的直接话语，并保留希伯来叙事公式的功能。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名 YHWH；译作“雅威”可保留专名性质。“耶和华”是另一传统音译，“主”则是以称号代替神名。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。“雅威的话第二次临到我”保留先知叙事公式；句末用冒号引出下一节的神谕。
