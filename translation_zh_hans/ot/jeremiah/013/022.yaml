id: JER.13.22
reference: Jeremiah 13:22
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/כִ֤י תֹאמְרִי֙ בִּ/לְבָבֵ֔/ךְ מַדּ֖וּעַ קְרָאֻ֣/נִי אֵ֑לֶּה בְּ/רֹ֧ב עֲוֺנֵ֛/ךְ נִגְל֥וּ שׁוּלַ֖יִ/ךְ נֶחְמְס֥וּ עֲקֵבָֽיִ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/013/022.yaml
  text: And if you say in your heart[a], ‘Why have these things happened to me?’—because of the greatness of your iniquity your skirts have been uncovered[b], your heels have been violated.
translation:
  language: zh_hans
  text: 你若心里说：“为什么这些事临到我[a]？”这都是因你的罪孽深重：你的衣裙下摆被掀起，你的脚跟遭受暴力对待[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“为什么这些事发生在我身上？”
    reason: 原文表达这些灾祸来到或发生在说话者身上；“临到我”与“发生在我身上”均能传达此处的惯用意义。
  - marker: b
    text: “脚跟遭受暴力对待”延续衣裙暴露、受羞辱的意象；希伯来文也可较宽泛地理解为“脚跟受侵害”或“脚跟受凌辱”。
    reason: 动词可表示遭受暴力、侵害或凌辱；具体方式在原文中并未完全限定。
lexical_decisions:
- source_word: וְכִי
  choice: 你若
  rationale: 承接上文并引出预想中的自问；“若”保留条件意味，又符合现代汉语表达。
- source_word: תֹאמְרִי בִּלְבָבֵךְ
  choice: 你若心里说
  rationale: 保留希伯来语“在心里说”的内在言语意象，同时在现代汉语中自然易懂。原文为阴性单数，语境中所指是被拟人化为女子的耶路撒冷；汉语第二人称不显语法性别，因此不另行增补。
- source_word: קְרָאֻנִי אֵלֶּה
  choice: 这些事临到我
  rationale: 该结构在此表示这些灾祸临到说话者，而不是字面意义上的“呼叫我”；“临到”既清楚，也保留庄重的经文语体。
- source_word: בְּרֹב עֲוֺנֵךְ
  choice: 因你的罪孽深重
  rationale: 将介词理解为原因，并以“罪孽深重”传达 רֹב 的程度和 עָוֹן 的道德、盟约性分量。
- source_word: נִגְלוּ שׁוּלַיִךְ
  choice: 你的裙摆被揭开
  rationale: שׁוּלַיִם 指衣服下摆或裙边；“裙摆被揭开”保留公开暴露和羞辱的先知性意象，而不将其改写成抽象的“蒙羞”。
- source_word: נֶחְמְסוּ עֲקֵבָיִךְ
  choice: 你的脚跟遭到侵犯
  rationale: חמס 的被动形式含受暴力对待、侵害或凌辱之意。“遭到侵犯”保留其严重性及可能的羞辱意味，又不武断指定原文没有明说的具体性行为。
theological_decisions:
- issue: 先知话语中带有性化色彩的暴露和羞辱意象
  choice: 保留“裙摆被揭开”和“脚跟遭到侵犯”的具体隐喻
  alternative: 弱化为一般性的“你蒙受羞辱”，或强化为明确描述性侵犯
  rationale: 经文以阴性单数称呼拟人化的耶路撒冷，用强烈的公开暴露和侵害意象说明审判。译文既不应消解其严厉性，也不应添加希伯来文未明确说明的行为细节。
- issue: 灾祸与罪孽之间的因果关系
  choice: 译作“这是因你的罪孽深重”
  alternative: 将 בְּ 理解为较弱的伴随或处境关系
  rationale: 此处介词短语在修辞问答中自然说明灾祸临到的原因；译文保留经文本身明确表达的审判逻辑，不进一步扩展为系统性教义陈述。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“罪孽深重”保留道德力度；“裙摆被揭开”和“脚跟遭到侵犯”维持原文并列的身体性羞辱意象，同时借脚注说明后一句的词义幅度。
