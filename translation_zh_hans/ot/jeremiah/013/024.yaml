  text: וַ/אֲפִיצֵ֖/ם כְּ/קַשׁ עוֹבֵ֑ר לְ/ר֖וּחַ מִדְבָּֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/013/024.yaml
  text: So I will scatter them like chaff passing away before the desert wind[a].
translation:
  language: zh_hans
  text: 我必使他们四散，如同随旷野的风飘去的秸秆碎屑[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “秸秆碎屑”也可译作“碎秸”或“糠秕”；亦可译作“像被旷野的风吹走的秸秆碎屑”。
    reason: 说明קַשׁ可指禾秆、秸秆及其轻干残屑，并保留分词和介词短语在风吹意象中的自然译法差异。
lexical_decisions:
- source_word: וַאֲפִיצֵם
  choice: 因此，我要使他们四散
  rationale: 该形式以第一人称单数为主语、第三人称复数为宾语，表达使其分散；结合审判宣告的语境，用“我要”体现其将来指向，并以“因此”表达句首连接词的承接、结果意味。
- source_word: כקש
  choice: 像碎秸
  rationale: קַשׁ可指干草、秸秆残屑或糠秕。此处强调轻而干燥、任风卷走之物；“碎秸”既贴近农作物残梗的本义，也适合风中飘散的比喻。
- source_word: עובר
  choice: 飘走
  rationale: 这是עבר的主动分词，基本义为“经过、移过”。在风吹干秸的画面中，“飘走”自然表达持续移动，同时不把原文未明说的被动动作强化为“被吹散”。
- source_word: לרוח
  choice: 在……风前
  rationale: 介词ל在这里描写碎秸面对风、任风带动的方位关系。“在风前”保留原文表达的开放性，未硬性限定为单纯工具义“被风”。
- source_word: מדבר
  choice: 旷野
  rationale: מִדְבָּר指荒野、旷野，也可依语境译作沙漠。“旷野”较宽泛，保留无人荒凉之地的基本意象，而不必限定为沙质沙漠。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“使他们四散”保留神主动施行审判的语气；“碎秸……飘走”保持诗性画面，并尽量保存希伯来语分词与介词关系的含混度。
