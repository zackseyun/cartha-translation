id: JER.13.11
reference: Jeremiah 13:11
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כִּ֡י כַּ/אֲשֶׁר֩ יִדְבַּ֨ק הָ/אֵז֜וֹר אֶל מָתְנֵי אִ֗ישׁ כֵּ֣ן הִדְבַּ֣קְתִּי אֵ֠לַ/י אֶת כָּל בֵּ֨ית יִשְׂרָאֵ֜ל וְ/אֶת כָּל בֵּ֤ית יְהוּדָה֙ נְאֻם יְהוָ֔ה לִֽ/הְי֥וֹת לִ/י֙ לְ/עָ֔ם וּ/לְ/שֵׁ֥ם וְ/לִ/תְהִלָּ֖ה וּ/לְ/תִפְאָ֑רֶת וְ/לֹ֖א שָׁמֵֽעוּ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/013/011.yaml
  text: For as the waistband clings to a man's waist[a], so I made the whole house of Israel and the whole house of Judah cling to me, declares Yahweh, to be for me a people, a name, a praise, and a glory[c][b], but they did not listen.
translation:
  language: zh_hans
  text: 因为腰带怎样紧贴人的腰[a]，我也照样使以色列全家和犹大全家紧贴我；这是雅威的宣告；好让他们归我作子民，使我得名声、赞美和荣耀。可是他们没有听从[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “腰带”也可译作“束带”或“腰布”；原词指系在腰间的衣物，具体形制不能完全确定。
    reason: lexical_alternative
  - marker: b
    text: “听从”原文也可译作“听”；在这里兼含听取和服从的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֵזוֹר
  choice: 腰带
  rationale: 指系在腰间的衣物；“腰带”自然、具体，并与下文“腰”形成清晰呼应，同时不把形制过度限定为缠腰布。
- source_word: יִדְבַּק / הִדְבַּקְתִּי
  choice: 紧贴／使……紧贴
  rationale: דבק既描写衣物贴身，也可表达亲密依附；重复“紧贴”保留原文比喻和使役形式。
- source_word: מָתְנֵי אִישׁ
  choice: 人的腰
  rationale: 现代汉语以“腰”自然表达 מָתְנַיִם；אִישׁ在此用于一般性比较，译作“人”即可准确涵盖其代表性用法。
- source_word: כָּל בֵּית יִשְׂרָאֵל וְאֶת כָּל בֵּית יְהוּדָה
  choice: 以色列全家和犹大全家
  rationale: 保留“家”的群体和家族性意象，并以“全家”自然表达 כָּל בֵּית。
- source_word: נְאֻם יְהוָה
  choice: 雅威说
  rationale: 保留神名 יְהוָה；“雅威说”以庄重而自然的现代汉语表达先知宣告公式。
- source_word: לִהְיוֹת לִי לְעָם
  choice: 好让他们归我作子民
  rationale: 既保留 לִי 所表达的归属，也以汉语自然呈现目的句及集体名词“子民”。
- source_word: לְשֵׁם וְלִתְהִלָּה וּלְתִפְאָרֶת
  choice: 使我得名声、赞美和荣耀
  rationale: 这些目的语在希伯来语中与“归我作子民”并列；汉语补出“使我得”以清楚表达他们要成为雅威名声、赞美和荣耀的缘由或载体，而不生硬直译为“作一个名、一个赞美”。
- source_word: וְלֹא שָׁמֵעוּ
  choice: 可是他们没有听从
  rationale: שׁמע在此兼有听取和服从之意；“听从”自然保留两层含义，“可是”突出神的旨意与百姓回应之间的反差。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”较贴近通行的学术重构读音，并明确保留其专名性质。
- issue: דבק 的关系性含义
  choice: 紧贴
  alternative: 依附
  rationale: “紧贴”首先保留腰带贴腰的实体图像，同时让上下文承载盟约关系的意味；译作“依附”虽更抽象，却会削弱比喻的物质触感。
- issue: לְשֵׁם וְלִתְהִלָּה וּלְתִפְאָרֶת 的归属关系
  choice: 使我得名声、赞美和荣耀
  alternative: 作我的名声、赞美和荣耀
  rationale: 三个名词都受连续的 לְ 支配，所指是百姓对雅威名誉与荣耀的作用；采用功能性汉语表达，同时不把它们误解为百姓自身所得的荣耀。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。以“因为……照样……”保存原文类比结构，以插入语“雅威说”保留先知宣告公式；结尾用“可是”呈现强烈反差。所有脚注标记均置于相关主文之后。
