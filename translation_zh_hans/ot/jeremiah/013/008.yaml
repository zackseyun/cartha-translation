  text: וַ/יְהִ֥י דְבַר יְהוָ֖ה אֵלַ֥/י לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/013/008.yaml
  text: Then the word of Yahweh came to me[a], saying,
translation:
  language: zh_hans
  text: 随后，雅威的话临到我[a]，说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译：“事情发生了，雅威的话临到我，说。”
    reason: 说明וַיְהִי的字面形式；正文按希伯来叙事中的惯用功能译为“随后”。
lexical_decisions:
- source_word: וַיְהִי
  choice: 随后……临到
  rationale: 该叙事形式承接前文、引出下一件事；用“随后”自然表达事件的推进，并将希伯来语惯用表达与“临到”合并处理，避免生硬或古旧的“事情发生了”。
- source_word: דְבַר יְהוָה
  choice: 雅威的话
  rationale: “话”保留דָּבָר的基本词义及先知宣告公式的传统力度，不采用解释性较强的“信息”。
- source_word: יְהוָה
  choice: 雅威
  rationale: 音译四字神名，保留其作为以色列之上帝专名的性质，而不以称号代替。
- source_word: אֵלַי
  choice: 临到我
  rationale: 介词短语本义为“到我这里”；结合中文先知书常用表达，译为“临到我”准确而自然。
- source_word: לֵאמֹר
  choice: 说
  rationale: 该不定式引出下文的直接话语；中文用“说”简洁自然，并以冒号提示后续引语。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。译作“雅威”旨在以现代汉语音译保留专名，不以“主”这一称号替代；“耶和华”虽为传统汉译，但“雅威”更贴近学界通常采用的拟音。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“临到我”保留先知书宣告公式的语感；“随后”清楚承接叙事，又避免“事情发生了”或“于是发生”之类生硬表达。
