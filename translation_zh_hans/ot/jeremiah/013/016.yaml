source:
  edition: WLC
  text: תְּנוּ֩ לַ/יהוָ֨ה אֱלֹהֵי/כֶ֤ם כָּבוֹד֙ בְּ/טֶ֣רֶם יַחְשִׁ֔ךְ וּ/בְ/טֶ֛רֶם יִֽתְנַגְּפ֥וּ רַגְלֵי/כֶ֖ם עַל הָ֣רֵי נָ֑שֶׁף וְ/קִוִּיתֶ֤ם לְ/אוֹר֙ וְ/שָׂמָ֣/הּ לְ/צַלְמָ֔וֶת ישית לַ/עֲרָפֶֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/013/016.yaml
  text: Give glory to Yahweh your God before he brings darkness[a], and before your feet stumble on the mountains at twilight. Then you will hope for light, but he will make it deep darkness; he will turn it into gloom.
translation:
  language: zh_hans
  text: 你们要将荣耀归给耶和华你们的上帝，趁他还没有使黑暗降临，趁你们的脚还没有在暮色中的山岭上绊跌。那时，你们会盼望光明；他却要把所盼望的光明变为幽暗[a]，使它成为浓黑。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“死荫”。这个希伯来词既可指死亡般的幽暗，也可泛指极深的黑暗。
    reason: 保留צַלְמָוֶת的传统译法及其词义范围。
lexical_decisions:
- source_word: תְּנוּ ... כָּבוֹד
  choice: 将荣耀归给
  rationale: 这是希伯来语中“给予／归给荣耀”的固定表达；译为“将荣耀归给”既保留复数命令语气，也符合现代汉语表达。
- source_word: לַיהוָה אֱלֹהֵיכֶם
  choice: 耶和华你们的上帝
  rationale: 直译神名与第二人称复数所属结构，保留先知对群体的直接呼告。
- source_word: יַחְשִׁךְ
  choice: 使黑暗降临
  rationale: 该动词的使役形态表明黑暗由上帝带来；此译法既保留神圣施事者，也比“使之黑暗”更自然。
- source_word: יִתְנַגְּפוּ רַגְלֵיכֶם
  choice: 你们的脚……绊跌
  rationale: 保留原文以“脚”为主语的具体意象；该反身词形在此描写脚碰撞而失足。
- source_word: הָרֵי נָשֶׁף
  choice: 暮色中的山岭
  rationale: נָשֶׁף在此指光线渐暗的暮色；介词结构译为“暮色中的”，清楚呈现山路在昏暗时的危险。
- source_word: וְקִוִּיתֶם לְאוֹר
  choice: 那时，你们会盼望光明
  rationale: קוה兼有等候和盼望之意；在审判语境中，“盼望光明”自然地表达对解救的期待。
- source_word: וְשָׂמָהּ לְצַלְמָוֶת
  choice: 他却要使光明变为幽暗
  rationale: 阴性后缀回指“光明”；צַלְמָוֶת在这里可表示极深、如死亡一般的黑暗。正文采用自然的“幽暗”，传统译法置于脚注。
- source_word: יָשִׁית לַעֲרָפֶל
  choice: 变为浓黑
  rationale: עֲרָפֶל指浓密、压迫性的黑暗；“浓黑”避免与前句机械重复，同时保留黑暗加深的意象。
theological_decisions:
- issue: 即将来临的黑暗是否出于上帝的主动作为
  choice: 明确译作“他……使黑暗降临”，并让后续的“使……变为”继续以上帝为主语。
  alternative: 译作“天还没有黑”或“黑暗还没有来临”，将其理解为自然入夜。
  rationale: יַחְשִׁךְ的使役形态以及后续以上帝为主语的动作，都支持上帝主动带来黑暗作为审判；译文不把这一神学张力弱化为自然现象。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“趁……还没有……”传达警告的紧迫性；“暮色中的山岭”“幽暗”“浓黑”保留全节逐步加深的黑暗意象。脚注标记[a]已置于正文对应词之后。
