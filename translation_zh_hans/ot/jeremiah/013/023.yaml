revisions:
- from: 古实人[a]能改变自己的皮肤吗？豹子能改变身上的斑点吗？那么，你们这些惯于作恶[b]的人也能行善了。
  to: 古实人[a]能改变自己的皮肤吗？豹能改变身上的斑点吗？那么，你们这些惯于作恶[b]的人又怎能行善呢？
  rationale: 仅修改末句的汉语修辞表达：以“又怎能……呢”显明前两句反问所隐含的不可能性和对照关系，避免“也能行善了”造成已实现或普通陈述的理解。脚注锚点及内容保持完整。
