  text: הֲ/יַהֲפֹ֤ךְ כּוּשִׁי֙ עוֹר֔/וֹ וְ/נָמֵ֖ר חֲבַרְבֻּרֹתָ֑י/ו גַּם אַתֶּם֙ תּוּכְל֣וּ לְ/הֵיטִ֔יב לִמֻּדֵ֖י הָרֵֽעַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/013/023.yaml
  text: Can a Cushite change his skin[b][a], or a leopard its spots? Then you also can do good—you who are trained in evil.
translation:
  language: zh_hans
  text: 古实人[a]能改变自己的皮肤吗？豹能改变身上的斑点吗？那么，你们这些惯于作恶[b]的人又怎能行善呢？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“埃塞俄比亚人”。希伯来文是“古实人”，指来自古实的人。
    reason: lexical_alternative
  - marker: b
    text: 原文也可直译为“受教于恶”或“学会了恶”，意思是因反复作恶而习以为常。
    reason: lexical_alternative
lexical_decisions:
- source_word: כּוּשִׁי
  choice: 古实人
  rationale: 按希伯来民族名称直译为“古实人”，避免直接套用后世地理名称“埃塞俄比亚人”。
- source_word: הֲיַהֲפֹךְ
  choice: 能改变……吗
  rationale: 在反问句中表示改变既有状态；“改变”符合现代汉语表达，也保留不可能性的语气。
- source_word: עוֹרוֹ
  choice: 自己的皮肤
  rationale: 准确表达该人自身的皮肤，并使汉语指代清楚自然。
- source_word: נָמֵר
  choice: 豹子
  rationale: 这是该动物名称在现代汉语中的通行对应词。
- source_word: חֲבַרְבֻּרֹתָיו
  choice: 身上的斑点
  rationale: 指豹子特有的斑纹；“斑点”既准确又便于普通读者理解。
- source_word: גַּם אַתֶּם תּוּכְלוּ
  choice: 那么……也能
  rationale: 承接前面的两个反问，保留类比中的反讽：只有前述不可能之事能够发生，惯于作恶者才同样能够行善。
- source_word: לְהֵיטִיב
  choice: 行善
  rationale: 简洁自然地表达“做善事、行得正”的意思。
- source_word: לִמֻּדֵי הָרֵעַ
  choice: 惯于作恶
  rationale: 该形式可表达经学习或反复实践而形成的习惯；“惯于作恶”自然地传达根深蒂固的恶行倾向，同时在脚注中保留其较直译的可能表达。
theological_decisions:
- issue: 反问类比所表达的道德无力
  choice: 把经文译为针对眼前听众因长期作恶而形成的道德无力，并保留反问的强烈不可能性。
  alternative: 将其扩展为关于所有人在一切方面都完全无能的普遍系统神学命题；或把它弱化为不涉及真实道德无力的单纯夸张。
  rationale: 希伯来文把改变根深蒂固的恶行习惯与改变固定的身体特征相类比。译文保持这一张力，但不越出本节语境作额外的教义推论。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“古实人”保留原文民族名称；两个平行问句清楚呈现修辞结构。“那么……也能”保留原文类比的反讽和神学张力，而“惯于作恶”则让普通读者易于理解长期养成的恶行习惯。
