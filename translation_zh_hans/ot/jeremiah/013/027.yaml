  text: נִֽאֻפַ֤יִ/ךְ וּ/מִצְהֲלוֹתַ֨יִ/ךְ֙ זִמַּ֣ת זְנוּתֵ֔/ךְ עַל גְּבָעוֹת֙ בַּ/שָּׂדֶ֔ה רָאִ֖יתִי שִׁקּוּצָ֑יִ/ךְ א֥וֹי לָ/ךְ֙ יְר֣וּשָׁלִַ֔ם לֹ֣א תִטְהֲרִ֔י אַחֲרֵ֥י מָתַ֖י עֹֽד־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/013/027.yaml
  text: Your adulteries[a], your lustful neighings, the depravity of your prostitution on the hills in the field—I have seen your abominations. Woe to you, Jerusalem! Will you not be made clean?[d][c][b] How long will it still be?
translation:
  language: zh_hans
  text: 你的奸淫[a]、你情欲的嘶鸣[b]、你卖淫的邪恶——在田野的山冈上，我看见了你这些可憎之事。耶路撒冷啊，你有祸了！你还不洁净吗？[c]还要到几时呢？[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “奸淫”也可译作“奸淫的行为”。
    reason: lexical_alternative
  - marker: b
    text: “情欲的嘶鸣”沿用耶利米书5:8以马的嘶鸣描写性欲的意象。
    reason: cross_reference
  - marker: c
    text: 本句也可理解为陈述句：“你仍不洁净。”其中“洁净”也可译作“得洁净”或“变为洁净”。
    reason: alternative_reading
  - marker: d
    text: 希伯来文是省略式表达，直译近于“还要到什么时候？”，意思是“还要多久？”。
    reason: lexical_alternative
lexical_decisions:
- source_word: נִאֻפַיִךְ
  choice: 你的奸淫
  rationale: 保留复数行为的集合意义及先知话语中婚约不忠的具体性；现代汉语中用“奸淫”比抽象的“不忠”更能保存原文冲击力。
- source_word: וּמִצְהֲלוֹתַיִךְ
  choice: 你情欲的嘶鸣
  rationale: “嘶鸣”保留马匹意象，并以“情欲的”点明本语境中的性欲色彩，呼应耶利米书5:8。
- source_word: זִמַּת זְנוּתֵךְ
  choice: 你卖淫的淫邪
  rationale: זִמָּה在此含邪恶、淫荡之意，与זְנוּת连用加强道德与性方面的败坏；“淫邪”兼顾强烈语气与现代可懂性。
- source_word: עַל גְּבָעוֹת בַּשָּׂדֶה
  choice: 在田野的山冈上
  rationale: 保留原文地貌，也保存这些行为可能涉及山冈崇拜的语境，而不把这一解释直接写入正文。
- source_word: רָאִיתִי
  choice: 我都看见了；我看见了
  rationale: 希伯来语动词统摄前后的宾语；汉语分句中适度复现，使“山冈上的行为”和“可憎之事”之间的句法关系清楚，并体现指控的现实效力。
- source_word: שִׁקּוּצַיִךְ
  choice: 你那些可憎之事
  rationale: 既表达厌恶和审判色彩，也保留该词可能具有的偶像崇拜含义；不直接限定为“偶像”，以免缩窄原文。
- source_word: אוֹי לָךְ
  choice: 你有祸了
  rationale: 采用现代汉语中自然而庄重的先知性祸哉公式。
- source_word: לֹא תִטְהֲרִי
  choice: 你还不洁净吗？
  rationale: 按上下文译作带责问与呼吁意味的修辞问句；“洁净”保留道德与礼仪含义。希伯来语Nifal在汉语中不宜机械译成被动，故正文保持可兼容“成为洁净/得洁净”的表达。
- source_word: אַחֲרֵי מָתַי עוֹד
  choice: 还要到几时呢？
  rationale: 原文是省略式时间问句；这一译法自然保留“还要多久”的迫切语气，而不补明所省略的具体内容。
theological_decisions:
- issue: 性语言作为盟约不忠和偶像崇拜的比喻
  choice: 正文保留“奸淫”“情欲的嘶鸣”“卖淫”等具体而尖锐的性意象。
  alternative: 淡化为“不忠”“败坏”或“淫乱”。
  rationale: 原文刻意以强烈的性意象控诉耶路撒冷；抽象化会削弱先知话语的力度，并把解释取代翻译。
- issue: לֹא תִטְהֲרִי的语气和语态
  choice: 译为修辞问句“你还不洁净吗？”，并以脚注保存“你仍不洁净”的陈述式可能。
  alternative: 译为陈述句“你不会得洁净”或“你仍不洁净”。
  rationale: 否定未完成式后接省略式“还要到几时”，可自然理解为痛切的责问；但希伯来文未标现代标点，陈述式分析确有可能，故不应隐去。
- issue: 洁净是被动还是状态变化
  choice: 正文采用不明确标示施事者的“洁净”，脚注说明也可理解为“得洁净”或“变为洁净”。
  alternative: 明确译为“被洁净”或“使自己洁净”。
  rationale: Nifal可表达被动或状态变化；原文没有明说洁净的施事者，汉译不宜加入神学上更具体的因果关系。
translation_notes:
  register: 采用现代、庄重而可朗读的先知性汉语。正文保留原文尖锐的性意象和洁净语汇；避免古奥的“淫奔”等词，也不把“山冈”直接解释成异教祭坛。标点将最后两句理解为相连的责问，同时用脚注注明陈述式分析。
