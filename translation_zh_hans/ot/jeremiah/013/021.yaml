id: JER.13.21
reference: Jeremiah 13:21
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: מַה תֹּֽאמְרִי֙ כִּֽי יִפְקֹ֣ד עָלַ֔יִ/ךְ וְ֠/אַתְּ לִמַּ֨דְתְּ אֹתָ֥/ם עָלַ֛יִ/ךְ אַלֻּפִ֖ים לְ/רֹ֑אשׁ הֲ/ל֤וֹא חֲבָלִים֙ יֹאחֱז֔וּ/ךְ כְּמ֖וֹ אֵ֥שֶׁת לֵדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/013/021.yaml
  text: What will you say when he appoints over you those whom you yourself taught to be leaders over you? Will not labor pains seize you like a woman giving birth?[a][b]
translation:
  language: zh_hans
  text: 当他立[a]那些你亲自训练的人作首领[b]辖管你时，你要说什么呢？产痛岂不抓住你，像抓住临产的妇人一样吗？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“当他察看你时”或“当他惩罚你时”。这个希伯来动词可指“照管、察看、惩罚、任命”；本句因接着提到有人作首领，较可能是“立……辖管”的意思。
    reason: lexical_alternative
  - marker: b
    text: 或译：“族长”或“亲密伙伴”。这个希伯来词既可指群体的首领，也可指熟识亲近的人；本句似乎是说，犹大从前刻意结交或扶植的人如今反来辖管她。
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה תֹּאמְרִי
  choice: 你要说什么呢
  rationale: מַה与阴性单数未完成式构成反问，指向被拟人化为女性的犹大；“要说什么呢”自然表达其面向将来的语气。
- source_word: כִּי יִפְקֹד עָלַיִךְ
  choice: 当他立……辖管你时
  rationale: פקד语义范围较广，可指眷顾、察看、惩罚或任命；后文“作首领”使“立……辖管”最合此处句法和政治语境。保留未明说身份的“他”，不擅自确定主语。
- source_word: וְאַתְּ לִמַּדְתְּ אֹתָם
  choice: 那些你亲自训练的人
  rationale: למד的Piel词形意为教导、训练；独立代词וְאַתְּ带强调，故译“你亲自”。按上下文将该分句自然处理为修饰“那些人”的关系结构。
- source_word: עָלַיִךְ אַלֻּפִים לְרֹאשׁ
  choice: 作首领辖管你
  rationale: אַלֻּפִים可指首领、族长，也可指亲密伙伴；与לְרֹאשׁ及עָלַיִךְ连用时，重点是这些人居于犹大之上掌权。“作首领辖管你”清楚表达这一关系。
- source_word: הֲלוֹא
  choice: 岂不……吗
  rationale: 表达预期肯定回答的强烈反问。
- source_word: חֲבָלִים
  choice: 产痛
  rationale: 该词在别处可指绳索或痛苦，但紧接着以临产妇人为喻，此处明确指分娩的阵痛。
- source_word: יֹאחֱזוּךְ
  choice: 抓住你
  rationale: אחז的基本义是抓住、攫住；直译为“抓住”保留痛苦突然临到并控制人的鲜明意象。
- source_word: כְּמוֹ אֵשֶׁת לֵדָה
  choice: 像抓住临产的妇人一样
  rationale: 原文意为“像临产的妇人”；中文补出比较中省略的“抓住”，使“产痛抓住你”的比较对象清楚，同时不改变意象。
theological_decisions:
- issue: יִפְקֹד的阳性单数主语所指
  choice: 保留为未明确身份的“他”
  alternative: 明确译作“耶和华”“敌国君王”，或改译为“惩罚你”
  rationale: 希伯来文没有明说主语；它可能指耶和华借外邦势力施行的作为，也可能指敌对统治者。译文不替原文消除这一含混。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“辖管”保留政治从属关系，“产痛抓住你”则有意保存原文具体而有力的拟人意象。两个脚注标记均紧随其所解释的词语。
