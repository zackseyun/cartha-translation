id: JER.13.13
reference: Jeremiah 13:13
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/אָמַרְתָּ֨ אֲלֵי/הֶ֜ם כֹּֽה אָמַ֣ר יְהוָ֗ה הִנְ/נִ֣י מְמַלֵּ֣א אֶת כָּל יֹשְׁבֵ֣י הָ/אָ֪רֶץ הַ/זֹּ֟את וְ/אֶת הַ/מְּלָכִ֣ים הַ/יֹּשְׁבִים֩ לְ/דָוִ֨ד עַל כִּסְא֜/וֹ וְ/אֶת הַ/כֹּהֲנִ֣ים וְ/אֶת הַ/נְּבִיאִ֗ים וְ/אֵ֛ת כָּל יֹשְׁבֵ֥י יְרוּשָׁלִָ֖ם שִׁכָּרֽוֹן־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/013/013.yaml
  text: 'Then you shall say to them[a], ‘Thus says Yahweh: Behold, I am about to fill all the inhabitants of this land—and the kings who sit on David’s throne, and the priests, and the prophets[b], and all the inhabitants of Jerusalem—with drunkenness.’'
translation:
  language: zh_hans
  text: 你要对他们说：“雅威如此说：看哪，我正要使这地所有的居民——坐在大卫宝座上的君王[a]、祭司、先知，以及耶路撒冷所有的居民——都充满醉意[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译近于“代大卫坐在他宝座上的君王”，强调这些君王承继大卫的王位。
    reason: lexical_alternative
  - marker: b
    text: “醉意”很可能比喻神所加的迷乱和审判；正文仍保留原文具体的醉酒意象。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמַרְתָּ אֲלֵיהֶם
  choice: 你要对他们说
  rationale: 承接上文的吩咐；“要……说”自然表达先知所领受的指令。
- source_word: כֹּה אָמַר יְהוָה
  choice: 雅威如此说
  rationale: 保留标准的先知传信公式，并将四字神名按其专名音译为“雅威”。
- source_word: הִנְנִי מְמַלֵּא
  choice: 看哪，我正要使……充满
  rationale: “看哪”保留 הִנְנִי 的强调和宣告语气；“正要”结合分词表达即将施行的行动，“使……充满”对应使役式 מְמַלֵּא。
- source_word: כָּל יֹשְׁבֵי הָאָרֶץ הַזֹּאת
  choice: 这地所有的居民
  rationale: 上下文所指是犹大和耶路撒冷，故将 הָאָרֶץ 译为“这地”，而非“全地”或“地球”。
- source_word: הַמְּלָכִים הַיֹּשְׁבִים לְדָוִד עַל כִּסְאוֹ
  choice: 坐在大卫宝座上的君王
  rationale: 这是自然的现代汉语表达，传达继承大卫王位的历代君王；希伯来文较特殊的 לְדָוִד 所含王朝承继意味在脚注中说明。
- source_word: הַכֹּהֲנִים וְהַנְּבִיאִים
  choice: 祭司、先知
  rationale: 直接保留两类宗教职分，不预先判定这里的先知是真是假。
- source_word: כָּל יֹשְׁבֵי יְרוּשָׁלִָם
  choice: 耶路撒冷所有的居民
  rationale: 与前面的 יֹשְׁבֵי 一致译为“居民”。
- source_word: שִׁכָּרוֹן
  choice: 醉意
  rationale: 保留醉酒的具体意象，同时“充满醉意”在现代汉语中比“充满醉酒”自然；其审判性的比喻含义不在正文中抽象化。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名；音译“雅威”保留其作为盟约专名的性质，不以称号代替。
- issue: “醉意”的比喻性质
  choice: 正文保留具体的醉酒意象
  alternative: 昏乱；迷乱
  rationale: 上下文借酒坛和醉酒描绘神所施的审判与失序。将其直接译成“昏乱”会提前解释并削弱原有意象，因此只在脚注交代其可能的比喻功能。
- issue: 大卫宝座的王朝含义
  choice: 坐在大卫宝座上的君王
  alternative: 代大卫坐在他宝座上的君王
  rationale: 正文采用自然且准确的王朝表达；脚注保留希伯来文 לְדָוִד 所凸显的代表大卫、承继其王位这一层意味。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“雅威如此说”和“看哪”保留先知宣告的正式语体；破折号标明后列各群体是对“这地所有的居民”的展开说明。
