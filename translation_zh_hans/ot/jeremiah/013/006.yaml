  text: וַ/יְהִ֕י מִ/קֵּ֖ץ יָמִ֣ים רַבִּ֑ים וַ/יֹּ֨אמֶר יְהוָ֜ה אֵלַ֗/י ק֚וּם לֵ֣ךְ פְּרָ֔תָ/ה וְ/קַ֤ח מִ/שָּׁם֙ אֶת הָ֣/אֵז֔וֹר אֲשֶׁ֥ר צִוִּיתִ֖י/ךָ לְ/טָמְנ/וֹ שָֽׁם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/013/006.yaml
  text: And it happened after many days that Yahweh said to me[a], “Arise, go to Perath[c][b], and take from there the waistband that I commanded you to hide there.”
translation:
  language: zh_hans
  text: 过了许多日子，雅威对我说：“起来，到伯拉去[a]，从那里取来我吩咐你藏在那里的腰布[b][c]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “伯拉”可能指幼发拉底河；正文保留希伯来名称的音译，不在正文中确定其所指。
    reason: alternative_reading
  - marker: b
    text: “腰布”也可译作“腰带”、“束带”或“缠腰布”。
    reason: lexical_alternative
  - marker: c
    text: “藏”也可译作“埋藏”；希伯来语动词可指隐藏或藏匿，有时特指埋在地下。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: 过了
  rationale: 该叙事形式引出后续事件；与时间短语合译为“过了许多日子”，既自然又保留叙事推进。
- source_word: מִקֵּץ יָמִים רַבִּים
  choice: 许多日子
  rationale: 原文直译近于“许多日子结束之后”；“过了许多日子”准确、自然，也不把它泛化为不明确的“很久以后”。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来语四字神名作音译，保留其作为专名的性质，而不以称号替代。
- source_word: קוּם לֵךְ
  choice: 起来，到……去
  rationale: 保留两个连续命令的行动感；现代汉语中“起来，到……去”清楚而庄重。
- source_word: פְּרָתָה
  choice: 到比拉去
  rationale: 原文是专名 פְּרָת 加方向词尾；正文音译为“比拉”，不直接判定为幼发拉底河，并以脚注说明可能所指。
- source_word: וְקַח מִשָּׁם
  choice: 从那里取回
  rationale: 基本义是“从那里拿取”；上下文表明该物先前由先知放在那里，因此“取回”自然地表达动作关系，未改变所取之物。
- source_word: הָאֵזוֹר
  choice: 腰布
  rationale: 该词指束在腰间或围在腰部的物件。“腰布”不把形制过度限定为腰带、束带或贴身短裤，并以脚注保留其他可能译法。
- source_word: אֲשֶׁר צִוִּיתִיךָ
  choice: 我吩咐你
  rationale: 保留神命令先知的权威语气；“吩咐”在现代汉语中庄重且自然。
- source_word: לְטָמְנוֹ שָׁם
  choice: 藏在那里
  rationale: טמן 的基本范围是隐藏、藏匿，有时具体指埋藏；正文采用较宽泛的“藏”，脚注保留“埋”的可能。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；以“主”替代
  rationale: 原文直接使用四字神名。正文音译为“雅威”，保留其专名性质，不以称号替换；“耶和华”是另一传统音译。
- issue: פְּרָתָה 所指地点
  choice: 比拉
  alternative: 幼发拉底河
  rationale: 该名称通常可指幼发拉底河，但本段地点认定存在讨论。正文保留音译，避免在译文中消除歧义，并在脚注列出常见理解。
translation_notes:
  register: 采用现代、清楚而庄重的叙事语体。“过了许多日子”避免古雅的“事就这样成了”；命令句保持简洁有力。正文中的[a]、[b]、[c]均有对应脚注，并将地点、衣物形制及隐藏方式的真实歧义保留下来。
