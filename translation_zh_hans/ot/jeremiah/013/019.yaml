base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/013/019.yaml
  text: The cities of the Negev are shut up[a], with no one to open them; all Judah has been carried away into exile[c][b], wholly carried away into exile.
translation:
  language: zh_hans
  text: 南地的城邑都被关闭了[a]，无人开启；整个犹大都被掳去，完全被掳去了[b][c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“南方的城邑”。“南地”也可能特指犹大南部地区。
    reason: lexical_alternative
  - marker: b
    text: 直译：“犹大被掳去，全都；被掳去，彻底。”
    reason: lexical_alternative
  - marker: c
    text: 末句也可能译作“平安地被掳去”，但上下文更可能是在强调被掳的彻底。
    reason: alternative_reading
lexical_decisions:
- source_word: עָרֵי הַנֶּגֶב
  choice: 南地的城邑
  rationale: נֶגֶב既可泛指南方，也可特指犹大南部的干旱地区。“南地”保留地理专称的可能，同时符合现代中文圣经语体。
- source_word: סֻגְּרוּ
  choice: 都被关闭了
  rationale: 该词为被动完成式，表示城邑已经处于关闭、封锁的状态；被动表达也保留原文中城邑遭外力处置的意味。
- source_word: וְאֵין פֹּתֵחַ
  choice: 无人开启
  rationale: 简洁保留“没有开启者”的分词结构，表达无人能够解除关闭状态。
- source_word: הָגְלָת
  choice: 被掳去
  rationale: גלה的使役被动式表明犹大是被迫迁离，而非自愿离去；“被掳去”自然体现强制流放。
- source_word: יְהוּדָה כֻּלָּהּ
  choice: 整个犹大
  rationale: כֻּלָּהּ强调犹大整体，无一部分例外；“整个犹大”准确而自然。
- source_word: הָגְלָת שְׁלוֹמִים
  choice: 完全被掳去了
  rationale: 在重复的流放表述中，שְׁלוֹמִים较可能强调完整、彻底；译文保留原文动词的重复，以加强全面受审判的语势。
theological_decisions:
- issue: 流放公式中שְׁלוֹמִים的含义
  choice: 按表示完整程度的副词性用法译为“完全”
  alternative: 译为“平安地／安然地”被掳去
  rationale: 该词虽与שָׁלוֹם（平安、完整）相关，但它与כֻּלָּהּ平行，并处于重复的流放公式中，因此更可能强调流放的彻底性。脚注保留“平安地”这一真实但可能性较低的读法。
translation_notes:
  register: 采用庄重而明白的现代标准汉语。“城邑”兼顾城市与设防聚落的含义；保留“被掳去”的重复，以呈现希伯来文的强调结构。所有代词和范围词均避免加入原文未明确说明的解释。
