  text: וְ/גַם אֲנִ֛י חָשַׂ֥פְתִּי שׁוּלַ֖יִ/ךְ עַל פָּנָ֑יִ/ךְ וְ/נִרְאָ֖ה קְלוֹנֵֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/013/026.yaml
  text: So I myself have also lifted up your skirts over your face[c][b][a], and your shame has been seen.
translation:
  language: zh_hans
  text: 我也要亲自把你的裙摆掀起来，蒙在你脸上[a]；你的羞耻就显露出来[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“揭开你的裙摆，蒙在你脸上。”原文动词意为“揭开、暴露”；这里按衣着动作译作“掀起来”。
    reason: lexical_alternative
  - marker: b
    text: 这里描绘的是借强迫暴露而公开羞辱人的情景，是先知用来表达审判所带来耻辱的比喻。
    reason: cultural_note
lexical_decisions:
- source_word: וְגַם
  choice: 所以……也
  rationale: 既承接上文的审判宣告，又保留附加和强调的语气；现代汉语中用“所以……也”表达自然。
- source_word: אֲנִי
  choice: 我……亲自
  rationale: 希伯来语动词本身已标明第一人称，另加独立代词具有强调作用；“亲自”凸显施行审判的是说话者本人。
- source_word: חָשַׂפְתִּי
  choice: 要……掀
  rationale: 该词本义为揭开、暴露；以衣服下摆为宾语时，“掀”能自然保留具体动作。完成式在此置于预告审判的语境中，译作“要”表达宣告中确定将临的行动。
- source_word: שׁוּלַיִךְ
  choice: 你的裙摆
  rationale: 该词指衣服下部的边缘或垂摆；“裙摆”在现代汉语中清楚保留衣着意象，且比容易被理解为上衣前襟的“衣襟”更准确。
- source_word: עַל פָּנַיִךְ
  choice: 到你脸上
  rationale: 保留空间关系，描绘衣服被向上掀至脸部的鲜明画面。
- source_word: וְנִרְאָה
  choice: 使人看见
  rationale: 尼法勒式表达显露、被看见的结果；汉语用使动式自然呈现前一动作所导致的公开暴露。
- source_word: קְלוֹנֵךְ
  choice: 你的羞耻
  rationale: 该名词指因受辱而公开显出的羞耻或耻辱；“羞耻”兼顾个人羞辱与社会性蒙羞。
theological_decisions:
- issue: 以强迫暴露描写上帝审判中的公开羞辱
  choice: 保留“把裙摆掀到脸上”以及羞耻被看见的具体意象
  alternative: 淡化为“使你公开蒙羞”
  rationale: 原文刻意采用强烈的衣着和身体暴露意象，描绘耶路撒冷在审判中所受的羞辱；若只译成抽象的蒙羞，会削弱先知话语的力度。
- issue: 希伯来语完成式在审判预告中的时间表达
  choice: 译作将来而确定的行动：“我也要亲自……”
  alternative: 译作已经完成的行动：“我也亲自掀起了……”
  rationale: 上下文是对临到之审判的宣告，完成式可强调其确定性；现代汉语用“要”更清楚地传达语境中的指向，同时不削弱宣告的必然性。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“裙摆”准确传达衣服下部的意象，“掀到你脸上”保留原文突兀而强烈的画面；不将“羞耻”抽象化，以免减弱审判话语的张力。
