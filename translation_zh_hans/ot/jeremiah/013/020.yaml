base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/013/020.yaml
  text: Lift up your eyes and see those who are coming from the north. Where is the flock that was given to you[a], your beautiful sheep?
translation:
  language: zh_hans
  text: 你要举目，看那些从北方来的人。交托给你的羊群，就是你那华美[a]的羊群，在哪里呢？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“荣耀的”。希伯来语这个词可表示美丽、华美或荣耀。
    reason: lexical_alternative
lexical_decisions:
- source_word: שאי עיניכם
  choice: 你要举目
  rationale: “举目”自然保留“抬起眼睛”的具体意象。希伯来文命令式为阴性单数，而“你们的眼睛”带复数后缀；译文不擅自校改，以单数“你”延续本节对女性化对象的称呼。
- source_word: וראי הבאים מצפון
  choice: 观看那些从北方来的人
  rationale: 保留ראה“看”的直接性和בא的分词意味；“从北方”不在译文中明说其侵略者身份，让上下文传达威胁。
- source_word: העדר נתן לך
  choice: 交给你的羊群
  rationale: נתן是被动完成式，表示羊群被交托给受话者；汉语以“交给你的”简洁表达这一被动关系。
- source_word: צאן תפארתך
  choice: 你那荣耀的群羊
  rationale: תפארת可指美丽、华美、荣耀；此处采用“荣耀”保留该词较强的价值与尊荣色彩，并用“群羊”避免与前面的“羊群”完全重复。
theological_decisions:
- issue: 羊群这一比喻的所指
  choice: 正文保留牧养意象，不明确解释羊群所指何人。
  alternative: 将羊群直接译解为犹大百姓、耶路撒冷的居民或君王的臣民。
  rationale: 希伯来文本身没有在本节解开比喻；保留其开放性可避免把某一种具体解释写入正文。
- issue: תפארתך与צאן的句法关系
  choice: 理解为“你那荣耀的群羊”，即群羊是受话者引以为荣、极其珍贵的。
  alternative: 理解为“你的荣耀”，把羊群视为受话者荣耀本身。
  rationale: 两种理解语义接近；正文采用自然的修饰表达，脚注提示“华美”这一词义范围，不进一步限定其神学所指。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“举目观看”保留先知书的修辞力度；第二句把两个相邻的牧群用语分别译为“羊群”和“群羊”，既体现原文措辞差异，也保持汉语流畅。
