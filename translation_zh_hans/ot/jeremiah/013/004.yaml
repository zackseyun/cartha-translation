id: JER.13.4
reference: Jeremiah 13:4
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: קַ֧ח אֶת הָ/אֵז֛וֹר אֲשֶׁ֥ר קָנִ֖יתָ אֲשֶׁ֣ר עַל מָתְנֶ֑י/ךָ וְ/קוּם֙ לֵ֣ךְ פְּרָ֔תָ/ה וְ/טָמְנֵ֥/הוּ שָׁ֖ם בִּ/נְקִ֥יק הַ/סָּֽלַע־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/013/004.yaml
  text: Take the waistband that you bought[a], which is on your waist, and arise, go to Perath, and hide it there in a crevice of the rock.
translation:
  language: zh_hans
  text: 你要拿起你买来、正系在腰间的那条腰带，起来往佩拉特[a]去，把它藏在那里的岩缝中。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “佩拉特”传统上被认作幼发拉底河，因此许多译本译作“幼发拉底河”。
    reason: 保留传统地理认定这一重要异读，同时不在正文中将有争议的地点直接坐实。
lexical_decisions:
- source_word: אֵזוֹר
  choice: 腰带
  rationale: 该词指围在腰部的物件；“腰带”是现代汉语中自然、宽泛的表达，不把具体形制过度限定为腰布、束带或皮带。
- source_word: קָנִיתָ
  choice: 买来
  rationale: 该动词通常表示购买或取得；上文叙事语境支持具体的“买来”。
- source_word: עַל מָתְנֶיךָ
  choice: 正系在腰间
  rationale: מָתְנַיִם 指腰胯部位；此译符合现代汉语穿戴习惯，也保留物件位于腰间的身体意象。
- source_word: וְקוּם לֵךְ
  choice: 起来往……去
  rationale: 保留连续命令的语气和行动推进感，同时采用自然、庄重的现代汉语。
- source_word: פְּרָתָה
  choice: 佩拉特
  rationale: 按希伯来语地名 פְּרָת 作音译，不在正文中直接判定为幼发拉底河；词尾 ה 表示方向，不属于地名本身。
- source_word: טָמְנֵהוּ
  choice: 把它藏
  rationale: 该动词表示隐藏、藏匿，有时可指埋藏；“藏”保留其较宽泛的意义，不额外指定掩埋方式。
- source_word: נְקִיק הַסָּלַע
  choice: 岩缝
  rationale: נְקִיק 指裂隙或缝隙，סֶלַע 指岩石；合译为“岩缝”简洁自然，准确呈现藏匿地点。
theological_decisions:
- issue: פְּרָתָה 的地点认定
  choice: 正文音译为“佩拉特”
  alternative: 幼发拉底河
  rationale: 此处的地理认定会影响对先知行动范围及象征行为的理解。希伯来文直接使用地名 פְּרָת，并未出现“河”字；正文保留音译，传统认定则收入脚注，避免消除原文与解释传统之间的张力。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“你要……起来……去……藏”保留命令句的连续推进；“岩缝”比“磐石的裂缝”更符合现代汉语，同时未损失原文意象。
