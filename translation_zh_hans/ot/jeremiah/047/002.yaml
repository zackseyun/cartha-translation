  text: כֹּ֣ה אָמַ֣ר יְהוָ֗ה הִנֵּה מַ֜יִם עֹלִ֤ים מִ/צָּפוֹן֙ וְ/הָיוּ֙ לְ/נַ֣חַל שׁוֹטֵ֔ף וְ/יִשְׁטְפוּ֙ אֶ֣רֶץ וּ/מְלוֹאָ֔/הּ עִ֖יר וְ/יֹ֣שְׁבֵי בָ֑/הּ וְ/זָֽעֲקוּ֙ הָֽ/אָדָ֔ם וְ/הֵילִ֕ל כֹּ֖ל יוֹשֵׁ֥ב הָ/אָֽרֶץ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/047/002.yaml
  text: 'Thus says the LORD: Behold, waters are rising from the north, and they will become an overflowing torrent; they will overflow the land and its fullness, the city and those who dwell in it. Then mankind will cry out, and every inhabitant of the land will wail.'
translation:
  language: zh_hans
  text: '耶和华如此说：

    “看哪，有水从北方涨起，

    将成为泛滥的急流；

    它必淹没大地和其中的一切，

    淹没城和城中的居民。

    人们必呼喊，

    这地所有的居民都必哀号。”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经语境中广为人知的专名译法，明确对应希伯来文神名。
- source_word: מַיִם עֹלִים מִצָּפוֹן
  choice: 有水从北方涨起
  rationale: 保留洪水意象和进行中的上升动态；“水”在中文中可作集合名词。
- source_word: נַחַל שׁוֹטֵף
  choice: 泛滥的急流
  rationale: נחל 指河流或溪流，שוטף 强调奔涌、漫溢；此译兼顾水势和破坏性。
- source_word: אֶרֶץ וּמְלוֹאָהּ
  choice: 大地和其中的一切
  rationale: מְלוֹאָהּ 字面为“其所充满的”，在中文中自然表达为其中所有的一切，并保留范围的广泛性。
- source_word: הָאָדָם
  choice: 人们
  rationale: 此处带集合意义，泛指遭灾的人类或众人；译作“人们”与后句居民相衔接，不限定性别。
- source_word: הֵילִל
  choice: 哀号
  rationale: 表达因灾祸而发出的悲痛号哭，语体庄重且意义准确。
theological_decisions:
- issue: 北方之水的指涉
  choice: 保留为洪水般的“水”和“急流”意象
  alternative: 直接解释为从北方入侵的军队
  rationale: 原文以水灾隐喻呈现威胁，但本节没有明说军队；正文不应将隐喻所指提前坐实。
- issue: הָאָדָם 的范围
  choice: 译为泛指的“人们”
  alternative: 译为“人类”或“男人”
  rationale: 该词在此为集合性用法，强调普遍的惊恐；“人们”自然、包容，也不引入性别限定。
translation_notes:
  register: 采用现代、庄重而易懂的先知宣告体。按希伯来诗行组织句子，保留“看哪”的警示语气和洪水意象；以重复“淹没”再现原文并列推进的节奏。
