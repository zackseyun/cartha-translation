    rationale: 原词重点是神对拟人化之剑的指定、委派；单说“派到”较易仅理解为移动或遣送。
  - severity: low
    issue: “静止不动”过于具体。
    rationale: שקט主要指安静、止息或平静；本语境虽指剑停止行动，但不必限定为字面的不动。
