  source_fidelity: 开头的反问及阴性单数所指均基本准确，神名“雅威”和地名“亚实基伦”也合宜。不过，“他已派它到那里”把יְעָדָהּ（指定、派定）较明确地译成单纯的“派往”，且“那里”在中文中所指略显悬空；宜保留其委派／指定的含义。
  naturalness: “静止不动”偏重物理静止，未充分表达שקט的“安静、止息”。“你怎能安静呢”在此处对拟人化之剑的呼语更自然，也保留诗歌式反问。
  terminology: “雅威”符合既定神名译法；“亚实基伦”通行。“海岸地区”比“沿海地区”更贴近חוֹף הַיָּם，同时仍是自然现代汉语。“派定”能在中文中同时表达指定和差遣，适合יָעַד在本节的用法。
  issues:
