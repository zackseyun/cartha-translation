  rationale: 将“静止不动”改为“安静”，以更贴近שקט的语义范围；将末句改为“将它派定到那里”，以保留יָעַד所含的指定、委派意味，同时维持原文对拟人化之剑由第二人称转为阴性第三人称指代的表达。脚注也相应使“吩咐”与正文一致。
