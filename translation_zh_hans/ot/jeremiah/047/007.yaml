base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/047/007.yaml
  text: How can you be quiet when Yahweh has commanded it? Against Ashkelon and against the seacoast—there he has appointed it[a][b].
translation:
  language: zh_hans
  text: 你怎能安静呢？雅威已经吩咐它攻打亚实基伦和海岸地区；他已将它派定到那里。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文作“雅威已经吩咐她／它”和“他已指定（或派定）她／它”；阴性单数代词指上一节拟人化的“剑”。
    reason: 说明原文阴性单数代词的语法形式、所指及拟人表达。
  - marker: b
    text: “攻打”也可较直译为“向着”或“到”。原文介词表示方向；在剑所领受的使命这一语境中，可含有敌对意味。
    reason: 保留介词אֶל的基本词义范围及较直译的可能。
lexical_decisions:
- source_word: אֵיךְ תִּשְׁקֹטִי
  choice: 你怎能静止不动呢
  rationale: אֵיךְ引出反问；תִּשְׁקֹטִי是阴性单数，承接上一节拟人化的“剑”。“静止不动”既表达安静、止息，也符合武器停止行动的语境。
- source_word: וַיהוָה צִוָּה לָהּ
  choice: 雅威已经向它下令
  rationale: 保留神名יהוה为“雅威”。לָהּ是阴性单数受事，指上一节的剑；“向它下令”清楚保留第三人称指代，不把原文改成第二人称。
- source_word: אֶל אַשְׁקְלוֹן וְאֶל חוֹף הַיָּם
  choice: 要攻打亚实基伦和沿海地区
  rationale: אֶל本义是“向、到”，但在剑奉命出击的语境中含敌对方向。“攻打”使中文自然，并用脚注保留较直译的可能。חוֹף הַיָּם指海岸或沿海地带。
- source_word: שָׁם יְעָדָהּ
  choice: 他已派它到那里
  rationale: יעד在此表示指定、派定或委派；主语承接雅威，阴性单数后缀仍指剑。“派它到那里”自然呈现这把剑受命前往指定地点的意思。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名；音译为“雅威”保留其作为专名的性质，不以称号替代。
- issue: 阴性单数代词的所指
  choice: 理解为上一节拟人化的“剑”，正文用“它”指代
  alternative: 在命令句中继续用第二人称“你”；或以“她”强化拟人
  rationale: 希伯来文的阴性单数后缀与上一节的“剑”一致。现代汉语中以“它”指剑最自然，而开头仍保留对剑的直接呼语，维持拟人效果。
- issue: אֶל的敌对含义
  choice: 正文译为“攻打”
  alternative: 译为“向着”或“到”
  rationale: 介词本身主要表示方向，但剑所受的使命显然带有攻击性质。正文表达语境隐含义，脚注同时保存形式上更直译的读法。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。开头用反问保留诗性张力；分号体现命令内容与差遣地点的紧密关系。脚注标记置于完整经文末尾，正文中的[a][b]与脚注一一对应。
