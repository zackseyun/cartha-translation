id: JER.47.4
reference: Jeremiah 47:4
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: עַל הַ/יּ֗וֹם הַ/בָּא֙ לִ/שְׁד֣וֹד אֶת כָּל פְּלִשְׁתִּ֔ים לְ/הַכְרִ֤ית לְ/צֹר֙ וּ/לְ/צִיד֔וֹן כֹּ֖ל שָׂרִ֣יד עֹזֵ֑ר כִּֽי שֹׁדֵ֤ד יְהוָה֙ אֶת פְּלִשְׁתִּ֔ים שְׁאֵרִ֖ית אִ֥י כַפְתּֽוֹר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/047/004.yaml
  text: because of the day that is coming to devastate all the Philistines[a], to cut off from Tyre and Sidon every surviving helper. For Yahweh is devastating the Philistines, the remnant of the island of Caphtor.
translation:
  language: zh_hans
  text: 因为那将来临的日子要毁灭所有非利士人，从推罗和西顿剪除每一个尚存的援助者。因为雅威正在毁灭非利士人，就是迦斐托海岛[a]的余民。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “海岛”或译作“沿海地”。
    reason: 希伯来词אִי可指“海岛”或“沿海地”；此处的具体地理含义不能仅凭句法确定。
lexical_decisions:
- source_word: עַל הַיּוֹם הַבָּא
  choice: 因为那将要来临的日子
  rationale: עַל在上下文中表示原因，承接前文灾祸与哀号的缘由；“将要来临”保留分词הַבָּא所表达的临近感。
- source_word: לִשְׁדֹד / שֹׁדֵד
  choice: 要毁灭／正在毁灭
  rationale: שׁדד表示以暴力劫掠、摧毁，使一地荒废；在民族受审判的语境中，“毁灭”自然且涵盖其破坏性。后一个分词译作“正在毁灭”，保留行动正在展开或已确定发生的鲜明语气。
- source_word: אֶת כָּל פְּלִשְׁתִּים
  choice: 所有非利士人
  rationale: 希伯来文是复数族群称谓，指非利士人，而不是单指非利士地域。
- source_word: לְהַכְרִית
  choice: 剪除
  rationale: 保留כרת“砍下、除掉”的审判性意象；“剪除”在现代中文中庄重而可懂。
- source_word: לְצֹר וּלְצִידוֹן כֹּל שָׂרִיד עֹזֵר
  choice: 剪除推罗和西顿所有残存的援助者
  rationale: 介词לְ在此与“剪除”相连，指出推罗和西顿将失去一切尚存的帮助者；译文避免把“援助者”过度具体化为政治盟友。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文直接保留上帝的专名，而不以“主”这一称号代替。
- source_word: שְׁאֵרִית אִי כַפְתּוֹר
  choice: 来自迦斐托沿海地的余民
  rationale: שְׁאֵרִית是“余民”；אִי可指海岛或沿海地区。“沿海地”避免对迦斐托地理形态作过度断定，“来自”表达这群余民与迦斐托的来源关联。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华／主
  rationale: 原文使用四字神名；音译“雅威”保留其作为以色列之神专名的性质，不以称号替代。
- issue: אִי כַפְתּוֹר的地理含义
  choice: 迦斐托沿海地
  alternative: 迦斐托海岛
  rationale: אִי兼有“海岛”和“沿海地”之义，具体地理所指并不完全确定；正文采用较不武断的“沿海地”，脚注保存“海岛”这一真实可行的译法。
- issue: “非利士人”与“迦斐托余民”的关系
  choice: 用“就是”表示同位说明
  alternative: 将二者视作两个分别受毁灭的群体
  rationale: 句法上“迦斐托沿海地的余民”最自然地解释前面的“非利士人”，说明其来源或身份；但不进一步引入关于迦斐托确切位置或迁徙历史的推论。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“毁灭”“剪除”“余民”保留先知审判语境的力度；“援助者”较“盟友”更贴近עֹזֵר的一般含义。脚注标记[a]紧随存在词义歧义的“沿海地”。
