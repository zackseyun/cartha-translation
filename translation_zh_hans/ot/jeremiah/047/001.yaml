    reason: lexical_alternative
  - marker: b
    text: 原文开头采用关系结构，较直译可作：“……临到先知耶利米的雅威的话”；这里按其标题功能译为“这是……的话”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר הָיָה דְבַר יְהוָה
  choice: 这是雅威……的话
  rationale: 原文以关系结构开篇，具有标题功能。中文用“这是”自然呈现标题，同时把较严格的句法形式保留在脚注中。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来语四字神名的通行中文音译处理，保留其作为专名的性质，不以称号代替。
- source_word: אֶל יִרְמְיָהוּ הַנָּבִיא
  choice: 临到先知耶利米
  rationale: 在先知书固定表达中，“雅威的话临到某人”自然且准确地表达启示的话传达给先知。
- source_word: אֶל פְּלִשְׁתִּים
  choice: 论到非利士人
  rationale: 介词 אֶל 在预言标题中可引出预言的对象或主题。“论到”保留其宽泛含义，不在正文中预先判定为敌对性的“攻击”。
- source_word: בְּטֶרֶם
  choice: 在……以前
  rationale: 明确表达随后事件尚未发生时的时间关系。
- source_word: יַכֶּה
  choice: 攻打
  rationale: נכה 的使役式在军事语境中表示击打或攻袭；“攻打”符合对城市采取军事行动的现代汉语表达，又不进一步断定是否已经攻占。
- source_word: פַרְעֹה
  choice: 法老
  rationale: 采用该埃及王室称号的标准中文译法。
- source_word: עַזָּה
  choice: 迦萨
  rationale: 采用该地名在中文圣经传统中的通行译名。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；正文采用“雅威”这一较贴近 Yahweh 的中文音译，以保留其专名性质。
- issue: אֶל פְּלִשְׁתִּים 是否带有敌对含义
  choice: 论到非利士人
  alternative: 攻击非利士人／针对非利士人
  rationale: 该介词可标示预言的主题或对象；虽然后文是审判信息，本节本身的介词并不必须译成敌对含义，因此正文保持较中性的表达，并在脚注注明另一可能。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留先知书惯用语“雅威的话临到……”，并用“论到”保存原介词在主题与敌对对象之间的语义张力。
