base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/047/005.yaml
  text: Baldness has come upon Gaza[a]; Ashkelon has been silenced, the remnant of their valley[c][b]. How long will you gash yourself?
translation:
  language: zh_hans
  text: 迦萨成了光秃；亚实基伦沉寂了[a]，他们谷中所剩下的也沉寂了[b]。你还要割伤自己到几时呢？[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “沉寂了”也可译作“被剪除”或“灭亡了”。希伯来语动词可指被止息、归于沉寂或遭毁灭。
    reason: lexical_alternative
  - marker: b
    text: 直译“他们谷中所剩下的”。有些古代译本或不同读法将这句话理解为“亚衲族余剩的人”等。
    reason: alternative_reading
  - marker: c
    text: “割伤自己”是古代近东的一种哀悼习俗。
    reason: cultural_note
lexical_decisions:
- source_word: קָרְחָה
  choice: 秃头
  rationale: 该名词指头发脱落或剃去后的秃头状态，在本节语境中是哀悼与灾祸的标志；直译保留原文意象，不把动作明说为命令。
- source_word: בָּאָה ... אֶל עַזָּה
  choice: 临到迦萨
  rationale: בוא 与 אֶל 连用表示来到、临及；在战争审判语境中，“临到”自然传达灾祸袭来的意味。
- source_word: נִדְמְתָה
  choice: 沉寂了
  rationale: דמה 的 Niphal 形式可指归于沉寂、被止息，也可含灭亡或被毁之意；“沉寂了”保留其核心意象及语义张力。
- source_word: שְׁאֵרִית
  choice: 剩余的人
  rationale: 表示灾难之后所剩下的群体；此处译成“剩余的人”比抽象的“余剩”更符合现代汉语，同时未必限定他们都是幸存者。
- source_word: עִמְקָם
  choice: 他们谷中
  rationale: 马所拉文本的辅音和元音自然理解为“他们的谷”，带第三人称阳性复数后缀；主文据此翻译，其他古代传承所反映的读法留在脚注。
- source_word: תִּתְגּוֹדָדִי
  choice: 割伤自己
  rationale: 该反身形式指为哀悼而割划自身；译文保留反身意义和具体动作，也符合现代汉语表达。
- source_word: עַד מָתַי
  choice: 到几时
  rationale: 这是希伯来语常见的追问时限表达；置于“还要……到几时”结构中自然且庄重。
