  naturalness: 修订后以“迦萨成了光秃”表达原文的灾祸与哀悼意象，避免“秃头临到”的生硬搭配；“他们谷中所剩下的，也沉寂了”在现代庄重汉语中完整清楚，同时不将“余剩”过度具体化。
