  register: 采用现代、庄重而易懂的书面汉语。诗句以破折号呈现第二分句与“谷中剩余的人”的关系，同时不补入原文没有明说的谓语；末句用“还要……到几时呢”再现阴性单数受话者所承受的拟人化责问。
