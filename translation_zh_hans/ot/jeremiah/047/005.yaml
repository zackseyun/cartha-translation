- from: 秃头临到迦萨；亚实基伦沉寂了——他们谷中剩余的人。你还要割伤自己到几时呢？[a]
  to: 迦萨成了光秃；亚实基伦沉寂了[a]，他们谷中所剩下的也沉寂了[b]。你还要割伤自己到几时呢？[c]
  rationale: 修订以马所拉文本为主：保留迦萨“光秃”的哀悼／灾祸意象，保留亚实基伦“沉寂”的含混毁灭语义，并不把“他们的谷之余剩”限定为人。为使汉语完整可读，第二分句重复前句谓语“沉寂了”；这只显明希伯来诗体中省略的谓语，未增添新的事件。脚注分列并锚定于相应词语。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T07:29:29Z'
