source:
  edition: WLC
  text: מִ/קּ֗וֹל שַֽׁעֲטַת֙ פַּרְס֣וֹת אַבִּירָ֔י/ו מֵ/רַ֣עַשׁ לְ/רִכְבּ֔/וֹ הֲמ֖וֹן גַּלְגִּלָּ֑י/ו לֹֽא הִפְנ֤וּ אָבוֹת֙ אֶל בָּנִ֔ים מֵֽ/רִפְי֖וֹן יָדָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/047/003.yaml
  text: At the sound of the stamping of the hooves of his mighty horses[a], at the rumbling of his chariots, at the roar of his wheels, fathers do not turn to their sons because of the helplessness of their hands.
translation:
  language: zh_hans
  text: 当他骏马的马蹄奔踏声、他的战车轰鸣声和车轮隆隆声传来时，父亲们因双手发软，不转向自己的儿子[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“由于双手松软（无力）”；这是形容人因惊恐而失去力量、无力行动的说法。
    reason: 说明希伯来语惯用语的字面意象及语境含义。
lexical_decisions:
- source_word: מִקּוֹל
  choice: 听见……声
  rationale: מִן与קוֹל在这里表示引发反应的声音；译作“听见……声”符合现代汉语，也保留因敌军迫近之声而惊惧的关系。
- source_word: שַׁעֲטַת פַּרְסוֹת
  choice: 马蹄奔踏声
  rationale: שַׁעֲטַת描写马蹄急促有力的奔踏；与“马蹄”合译，既保留具体意象，也突出本节连续的声响描写。
- source_word: אַבִּירָיו
  choice: 他的骏马
  rationale: אַבִּיר本义可指“强壮者”，与“蹄”连用时指强健的战马；“骏马”简洁自然，并保留其威猛意味。
- source_word: מֵרַעַשׁ לְרִכְבּוֹ
  choice: 战车的轰鸣声
  rationale: רַעַשׁ可表示震动、巨响；רֶכֶב在此为集合意义的战车队。“轰鸣声”贴合战车迫近的声势。
- source_word: הֲמוֹן גַּלְגִּלָּיו
  choice: 车轮的隆隆声
  rationale: הֲמוֹן在此指喧响、轰响；“隆隆声”自然呈现众多车轮滚动的持续巨响。
- source_word: לֹא הִפְנוּ אָבוֹת אֶל בָּנִים
  choice: 父亲们也不回头顾念儿子
  rationale: הפנה אל表示转向某人；在逃难场景中，“回头顾念”传达父亲无力转身照顾儿子的含义，同时保留原文明确的父子称谓。
- source_word: מֵרִפְיוֹן יָדָיִם
  choice: 因为他们双手发软
  rationale: 原文是“双手松软、无力”的身体性惯用语，表示因恐惧而失去力量和行动能力；“双手发软”在现代汉语中自然，并保留身体意象。
theological_decisions:
- issue: 亲属称谓的性别限定
  choice: 父亲们……儿子
  alternative: 父母……孩子
  rationale: 原文分别使用阳性复数אָבוֹת和בָּנִים，明确说“父亲”和“儿子”；译文不将其泛化为中性亲属称谓。
- issue: 双手发软所表达的状态
  choice: 保留身体意象，正文译为“双手发软”
  alternative: 因恐慌而束手无策
  rationale: 该惯用语兼有身体无力、勇气尽失和无法行动的意味。正文保留原文意象，不把原因或心理状态解释得过于单一；脚注说明其语用范围。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。用“奔踏声—轰鸣声—隆隆声”再现原文层层推进的听觉排比；“他”保留原文第三人称单数领属关系，不在本节内擅自补明所指。
