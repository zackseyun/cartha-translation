base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/047/006.yaml
  text: Ah, sword of the LORD, how long will you not be quiet? Return to your sheath; rest and be still.
translation:
  language: zh_hans
  text: 唉，耶和华的刀剑啊，你到几时还不止息呢？归入你的鞘中吧；安歇吧，静默吧。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הוֹי
  choice: 唉
  rationale: 用哀叹性的感叹词传达原文呼喊和悲痛的语气，不额外加入解释。
- source_word: חֶרֶב לַיהוָה
  choice: 耶和华的刀剑
  rationale: 保留介词短语所表达的归属或关联关系，也维持对刀剑的直接呼告。
- source_word: לֹא תִשְׁקֹטִי
  choice: 还不止息
  rationale: 原文以阴性单数动词拟人化地对“刀剑”说话；现代汉语用“止息”自然表达停止活动、归于平静。
- source_word: הֵאָסְפִי אֶל־תַּעְרֵךְ
  choice: 收回鞘中吧
  rationale: 原意为刀剑将自身收拢、归回自己的鞘内；汉语如此表达简洁自然，并保留命令语气。
- source_word: הֵרָגְעִי וָדֹמִּי
  choice: 安歇静默吧
  rationale: 分别呈现“平静、安歇”和“沉默、静止”的并列命令，保留原文的诗性递进。
theological_decisions:
- issue: 刀剑与耶和华的关系
  choice: 耶和华的刀剑
  alternative: 耶和华所用的刀剑
  rationale: 原文 לַיהוָה 可表示归属、关联或受其差遣；采用较为开放的属格表达，避免把这种关系限定为单一解释。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。以“唉”开启哀叹式呼告，以“到几时还不……呢”保留原文反问结构；后半句用两个并列祈使句维持诗歌节奏。
