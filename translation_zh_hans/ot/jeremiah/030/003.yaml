source:
  edition: WLC
  text: כִּ֠י הִנֵּ֨ה יָמִ֤ים בָּאִים֙ נְאֻם יְהוָ֔ה וְ֠/שַׁבְתִּי אֶת שְׁב֨וּת עַמִּ֧/י יִשְׂרָאֵ֛ל וִֽ/יהוּדָ֖ה אָמַ֣ר יְהוָ֑ה וַ/הֲשִׁבֹתִ֗י/ם אֶל הָ/אָ֛רֶץ אֲשֶׁר נָתַ֥תִּי לַ/אֲבוֹתָ֖/ם וִֽ/ירֵשֽׁוּ/הָ־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/030/003.yaml
  text: For look, days are coming, declares the LORD, when I will restore the fortunes of my people Israel and Judah, says the LORD, and I will bring them back to the land that I gave to their fathers, and they will possess it.
translation:
  language: zh_hans
  text: 因为，看哪，日子将到——耶和华宣告——那时，我必恢复我子民以色列和犹大的境况[a]——耶和华说——我必领他们回到我赐给他们祖先的土地，他们必占有那地。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“使我子民以色列和犹大被掳的人归回”。希伯来语这一固定表达可指恢复境况，也可在流亡语境中指使被掳者归回。
    reason: 保留 שׁוּב שְׁבוּת 的语义范围；下文领回土地支持归回含义，却不足以排除“恢复境况”的广义表述。
lexical_decisions:
- source_word: כִּי הִנֵּה
  choice: 因为看哪
  rationale: כִּי承接上文，译作“因为”；הִנֵּה是引人注意的宣告语，保留为庄重而可懂的“看哪”。
- source_word: וְשַׁבְתִּי אֶת־שְׁבוּת
  choice: 使……被掳的人归回
  rationale: 该固定表达可指扭转境遇，也常在流亡语境中指使被掳者归回；本节随后明确说领回所赐之地，因此正文采用具体的归回含义，并以脚注保留“恢复境况”的可能译法。
- source_word: נְאֻם יְהוָה / אָמַר יְהוָה
  choice: 耶和华宣告 / 耶和华说
  rationale: 分别反映נְאֻם的正式神谕语气和אָמַר的一般言说动词，同时保留经文中重复的神圣发言框架。
- source_word: לַאֲבוֹתָם
  choice: 他们祖先
  rationale: 现代汉语中“祖先”比“列祖”更自然，也准确涵盖父辈与先祖。
- source_word: וִירֵשׁוּהָ
  choice: 他们必占有那地
  rationale: ירשׁ在土地语境中表示取得并持有产业；“占有”保留其实际承受土地的力度，且不额外加入征服方式。
theological_decisions:
- issue: שׁוּב שְׁבוּת的归回与复兴双重含义
  choice: 正文译作“使……被掳的人归回”，脚注注明“恢复……的境况”
  alternative: 恢复我子民以色列和犹大的境况
  rationale: 近处语境直接提到返回祖先之地，支持流亡归回的具体理解；但该希伯来习语也可泛指命运或境况逆转，故不应抹去其语义张力。
- issue: 神名יהוה的表达
  choice: 耶和华
  alternative: 上主／雅威
  rationale: “耶和华”是现代简体中文圣经传统中最广为识别的专名形式，能保留原文专名功能，而不改作称号。
translation_notes:
  register: 采用现代、庄重且适合公开诵读的普通话。以破折号标示两处神谕插语，避免汉语长句层次不清；保留“看哪”的先知宣告色彩，并避免使用过于古雅的“列祖”。
