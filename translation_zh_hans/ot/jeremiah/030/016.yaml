  text: לָ/כֵ֞ן כָּל אֹכְלַ֨יִ/ךְ֙ יֵאָכֵ֔לוּ וְ/כָל צָרַ֥יִ/ךְ כֻּלָּ֖/ם בַּ/שְּׁבִ֣י יֵלֵ֑כוּ וְ/הָי֤וּ שֹׁאסַ֨יִ/ךְ֙ לִ/מְשִׁסָּ֔ה וְ/כָל בֹּזְזַ֖יִ/ךְ אֶתֵּ֥ן לָ/בַֽז־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/030/016.yaml
  text: Therefore all who devour you will be devoured[a], and all your adversaries, every one of them, will go into captivity; those who plunder you will become plunder, and all who prey on you I will give up to prey.
translation:
  language: zh_hans
  text: 因此，凡吞吃你的，必被吞吃；你所有的敌人，一个不漏，都必被掳而去；抢掠你的，必成为掠物；凡劫掠你的，我必使他们成为掠物。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 末句也可较直译为：“凡劫掠你的，我必把他们交作掠物。”原文“劫掠”和“掠物”所用的词彼此相关。
    reason: 说明末句 נתן לָבַז 的‘交作掠物’含义，并保留原文词语呼应。
lexical_decisions:
- source_word: לָכֵן
  choice: 因此
  rationale: 承接上文，保留结论和因果推进的语气。
- source_word: אֹכְלַיִךְ / יֵאָכֵלוּ
  choice: 凡吞吃你的，必被吞吃
  rationale: 保留原文以“吃”为核心的鲜明比喻及同词反转；“吞吃”在现代汉语中自然表达敌对势力的毁灭性侵害。
- source_word: צָרַיִךְ
  choice: 你所有的敌人
  rationale: 表达敌对、压迫之人；“敌人”比“敌对者”更自然通晓，又不缩减上下文的敌意。
- source_word: כֻּלָּם
  choice: 一个不漏
  rationale: 在“所有”之后体现原文 כֻּלָּם 的强调语气，突出无一例外。
- source_word: בַּשְּׁבִי יֵלֵכוּ
  choice: 都必被掳而去
  rationale: 准确传达进入被掳状态，而非仅泛指迁徙或流亡。
- source_word: שֹׁאסַיִךְ / לִמְשִׁסָּה
  choice: 抢掠你的，必成为掠物
  rationale: 保留施掠者反成掠物的报应式反转，并以相关词根在汉语中形成呼应。
- source_word: בֹּזְזַיִךְ / אֶתֵּן לָבַז
  choice: 凡劫掠你的，我必使他们成为战利品
  rationale: בזז 与 בז 均属战争劫掠语域；“劫掠”与“战利品”清楚表达掠夺者被交作掠物的意思，同时避免连续机械重复“掠”。
theological_decisions:
- issue: 战争和审判的反转意象
  choice: 保留“吞吃—被吞吃、抢掠—成为掠物、劫掠—成为战利品”的对应结构
  alternative: 概括为敌人将受惩罚
  rationale: 原文借对称的命运反转表达审判；保留这些具体意象，既不淡化审判，也不添加原文没有说明的教义解释。
- issue: אֶתֵּן 的施事主体与处置含义
  choice: 译为“我必使他们成为战利品”
  alternative: “我必把他们交给人劫掠”
  rationale: 原文明确是第一人称神圣施事，但没有明说交给谁；正文保留神主动处置的含义，脚注说明更贴近形式的另一译法。
translation_notes:
  register: 采用现代、庄重而易懂的先知性语言。以短句和分号保持希伯来诗体的平行与递进；“一个不漏”自然呈现强调，“被掳而去”“战利品”保留战争语境。
