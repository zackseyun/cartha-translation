source:
  edition: WLC
  text: כִּי֩ אַעֲלֶ֨ה אֲרֻכָ֥ה לָ֛/ךְ וּ/מִ/מַּכּוֹתַ֥יִ/ךְ אֶרְפָּאֵ֖/ךְ נְאֻם יְהוָ֑ה כִּ֤י נִדָּחָה֙ קָ֣רְאוּ לָ֔/ךְ צִיּ֣וֹן הִ֔יא דֹּרֵ֖שׁ אֵ֥ין לָֽ/הּ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/030/017.yaml
  text: 'For I will bring healing to you[a], and I will heal you from your wounds, declares Yahweh, because they have called you an outcast: ‘It is Zion[c][b]; no one cares for her.’'
translation:
  language: zh_hans
  text: 因为我必使你恢复健康[a]，医治你的创伤；这是雅威的宣告。因为人们称你为“被弃的”，说：“这就是锡安；没有人寻求她[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文是一个习语，直译近于“使医治为你长起来”，意思是使你恢复健康。
    reason: lexical_alternative
  - marker: b
    text: “寻求她”也可理解为“过问她、关心她”或“来帮助她”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אַעֲלֶה אֲרֻכָה
  choice: 使你恢复健康
  rationale: 该希伯来语使役式习语直译近于“使医治/新肉为你长起来”，语境指使受伤者恢复健康；此译既体现使役含义，也符合现代汉语表达。
- source_word: וּמִמַּכּוֹתַיִךְ אֶרְפָּאֵךְ
  choice: 医治你的创伤
  rationale: מַכָּה可指击打、伤口或创伤；在医治语境中译为“创伤”自然，并保留对锡安整体苦难的比喻空间。汉语无需机械复现介词结构。
- source_word: נְאֻם יְהוָה
  choice: 雅威宣告说
  rationale: נְאֻם是庄重的先知宣告公式；יְהוָה按其专名音译为“雅威”。
- source_word: נִדָּחָה
  choice: 被弃的
  rationale: 阴性被动分词可表示被赶逐、被抛弃的人；“被弃的”保留被动状态及其社会与盟约羞辱意味，不把含义限缩为单纯流亡。
- source_word: קָרְאוּ לָךְ
  choice: 人们称你为
  rationale: 第三人称复数未明示主语，汉语用泛指“人们”；完成式在此概括别人加给锡安的称呼。
- source_word: צִיּוֹן
  choice: 锡安
  rationale: 采用现代中文圣经传统中通行的专名译法。
- source_word: דֹּרֵשׁ אֵין לָהּ
  choice: 没有人寻求她
  rationale: 直译为“她没有寻求者”。דָּרַשׁ可指寻找、过问、关怀或援助；正文用“寻求”保留原文意象及语义张力，脚注说明语境含义。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；音译“雅威”保留其专名性质，不以称号替代。
- issue: דֹּרֵשׁ אֵין לָהּ 所表达的是寻找还是关怀
  choice: 正文保留“没有人寻求她”
  alternative: 没有人关心她；没有人来帮助她
  rationale: 原词具有寻求、过问并由此关怀援助的范围。正文保留原有寻找意象，避免替原文消除其多义性；语境含义在脚注中交代。
- issue: נִדָּחָה 是称号还是状态描述
  choice: 译作引号内的“被弃的”
  alternative: 人们说你被赶逐了；被放逐者
  rationale: קָרְאוּ לָךְ可理解为给锡安冠以贬称，也可泛指这样称说她。加引号自然呈现其称号功能，同时“被弃的”仍保留状态描述的可能。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。以阴性代词“她”承接被人格化的锡安；破折号突出先知宣告公式，同时保持句子清晰。所有脚注标记均置于正文相应位置。
