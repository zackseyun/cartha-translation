  to: 他们的显贵者必出自他们中间[a]；他们的统治者必从他们中间兴起。我必使他近前来，他必亲近我；因为谁曾以心作保[b]，前来亲近我呢？这是耶和华的宣告。
  rationale: 修订以复数“他们”表达原文在本段语境中的集体单数所指，消除“他自己”可能造成的自我来源误解；以“显贵者／统治者”保留原文两个平行领导称谓的差异。正文仍保留“以心作保”的隐喻，不把其限定为单纯“敢于”、祭司资格或弥赛亚身份；脚注说明可行的较自然理解。
