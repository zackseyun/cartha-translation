language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/הָיָ֨ה אַדִּיר֜/וֹ מִמֶּ֗/נּוּ וּ/מֹֽשְׁל/וֹ֙ מִ/קִּרְבּ֣/וֹ יֵצֵ֔א וְ/הִקְרַבְתִּ֖י/ו וְ/נִגַּ֣שׁ אֵלָ֑/י כִּי֩ מִ֨י הוּא זֶ֜ה עָרַ֧ב אֶת לִבּ֛/וֹ לָ/גֶ֥שֶׁת אֵלַ֖/י נְאֻם יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/030/021.yaml
  text: His ruler will be one of them[a], and his governor will come out from his midst. I will bring him near, and he will approach me[c][b], for who is this who has pledged his heart to approach me? declares Yahweh.
translation:
  language: zh_hans
  text: 他们的显贵者必出自他们中间[a]；他们的统治者必从他们中间兴起。我必使他近前来，他必亲近我；因为谁曾以心作保[b]，前来亲近我呢？这是耶和华的宣告。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “显贵者”也可译作“有权势的领袖”或“尊贵者”。“出自他们中间”表示这位领袖出自本族人民。
    reason: lexical_alternative
  - marker: b
    text: 也可理解为“立志”或“心里敢于”。希伯来文直译为“以他的心作保”，表达人以自己的心作出承担或承诺。
    reason: alternative_reading
lexical_decisions:
- source_word: אַדִּירוֹ
  choice: 他的尊贵者
  rationale: 该词可指尊贵、有权势或显赫的人；与下句“他的统治者”平行。译作“尊贵者”既保留领袖意味，也避免把两个平行词完全合并为同一个称谓。
- source_word: מִמֶּנּוּ
  choice: 出自他自己
  rationale: 介词形式字面为“从他”，在集体性的雅各／以色列语境中表示这位领袖出自本族人民，而非外来者；保留单数集体指称以贴近希伯来文。
- source_word: מֹשְׁלוֹ
  choice: 他的统治者
  rationale: משל 的分词指掌权、治理的人；“统治者”准确表达其治理职能，并与“尊贵者”构成自然平行。
- source_word: מִקִּרְבּוֹ
  choice: 从他中间
  rationale: קֶרֶב 指内部或中间；此译保留领袖从群体内部兴起的意象，也保留原文单数集体表达。
- source_word: וְהִקְרַבְתִּיו
  choice: 我必使他近前来
  rationale: קרב 的使役式强调是耶和华主动准许并促成这人近前；“使他近前来”保留使役含义和庄重语气。
- source_word: וְנִגַּשׁ אֵלַי
  choice: 他也必亲近我
  rationale: נגשׁ 表示近前、接近，在此可能含有朝廷觐见或敬拜礼仪色彩；“亲近我”保留庄重而不限定为某一种身份。
- source_word: עָרַב אֶת־לִבּוֹ
  choice: 敢以自己的心作保
  rationale: ערב 可指担保、抵押；以“心”为宾语形成强烈隐喻，表达拿自身内在生命作保证而冒险近前。“敢”从反问语境呈现其胆量，但“以心作保”保留原文隐喻。
- source_word: לָגֶשֶׁת אֵלַי
  choice: 前来亲近我
  rationale: 与前面的 נגשׁ 同根，译文重复“亲近我”，保留原文的词语呼应及可能的礼仪／觐见意味。
- source_word: נְאֻם יְהוָה
  choice: 这是耶和华的宣告
  rationale: נְאֻם 是先知信息中庄重的神谕公式；“这是……的宣告”自然而正式，并按专名译出 יהוה 为“耶和华”。
theological_decisions:
- issue: 这位领袖亲近上帝的性质
  choice: 译文呈现一位出自本族、由耶和华亲自使其近前的领袖，并保留“亲近”可能含有特殊觐见或礼仪准入的意味。
  alternative: 明确将此人译释为弥赛亚、祭司君王，或被掳归回后的政治总督。
  rationale: 原文强调其内部来源以及由耶和华授予的近前资格，却没有明说他是弥赛亚或祭司；因此不在正文中缩窄其身份，以保留经文的神学张力。
- issue: עָרַב אֶת־לִבּוֹ 的语义张力
  choice: 采用“敢以自己的心作保”，兼顾反问中的大胆意味和“作保”的原文隐喻。
  alternative: 只译作“心里敢于”，或只译作“将心抵押”。
  rationale: 单译“敢于”会失去担保隐喻，完全直译“抵押自己的心”又可能使现代读者难以理解；正文结合二者，脚注提示另一种自然表达。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。以“尊贵者／统治者”保留平行词的差异；以单数“他”呼应上下文中作为集体人格的雅各／以色列。正文保留“以心作保”的罕见意象，并借“敢”帮助读者把握反问语气。
