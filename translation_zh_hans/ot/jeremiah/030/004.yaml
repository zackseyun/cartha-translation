base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/030/004.yaml
  text: And these are the words that Yahweh spoke concerning Israel and Judah:[a]
translation:
  language: zh_hans
  text: 以下是雅威论到以色列和犹大所说的话：[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“对以色列和犹大说的。”希伯来文介词可以这样较直译地表达；但本句作为下文的引言，也可理解为引出论及这两个群体的话。
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/אֵלֶּה
  choice: 以下是
  rationale: 以自然的现代汉语引出下文，同时保留希伯来文承接前文并指向随后话语的功能。若直译为“这些是”，汉语略显生硬。
- source_word: הַ/דְּבָרִים
  choice: 所说的话
  rationale: דְּבָרִים在此处指先知书中将要引出的神谕言辞；译作“话”比“事情”更符合语境。
- source_word: דִּבֶּר
  choice: 所说
  rationale: 保留“说、讲话”的基本含义，并与“话”组成自然的汉语关系结构。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文四字神名YHWH的通行学术拟音译出其专名性质，而不以“主”这一称号替代。
- source_word: אֶל יִשְׂרָאֵל וְ/אֶל יְהוּדָה
  choice: 论到以色列和犹大
  rationale: 本节具有神谕标题的作用，后文内容关乎以色列和犹大，因此正文采用自然的“论到”；同时以脚注保留介词אֶל更直接的“对……说”理解。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文使用神的专名而非称号；“雅威”较直接地反映YHWH的拟音，也避免以“主”消除专名信息。
- issue: 介词אֶל在神谕标题中的语义作用
  choice: 论到以色列和犹大
  alternative: 对以色列和犹大
  rationale: 上下文允许把本句理解为介绍有关两者的神谕，但אֶל通常也可表示言语所指向的对象。正文采用较符合标题功能的译法，脚注保留另一种真实可能，避免消除原文张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“以下是……所说的话”适合经文引言；冒号引出随后内容。正文中的[a]与脚注完全对应。
