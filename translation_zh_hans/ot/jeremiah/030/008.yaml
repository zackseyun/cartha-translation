id: JER.30.8
reference: Jeremiah 30:8
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/הָיָה֩ בַ/יּ֨וֹם הַ/ה֜וּא נְאֻ֣ם יְהוָ֣ה צְבָא֗וֹת אֶשְׁבֹּ֤ר עֻלּ/וֹ֙ מֵ/עַ֣ל צַוָּארֶ֔/ךָ וּ/מוֹסְרוֹתֶ֖י/ךָ אֲנַתֵּ֑ק וְ/לֹא יַעַבְדוּ ב֥/וֹ ע֖וֹד זָרִֽים׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/030/008.yaml
  text: And it shall happen in that day[a], declares Yahweh of Armies, that I will break his yoke from off your neck, and I will tear off your bonds[b], and foreigners shall no longer make him their slave.
translation:
  language: zh_hans
  text: “到那日，万军之耶和华宣告：我要从你颈项上折断他的轭，扯断你的绑索；外族人必不再奴役他。[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 末句希伯来文句法简省，直译近似“外族人必不再借着他服役”。按轭和绑索的语境，意思是外族人不再奴役雅各／以色列。原文在“你”和“他”之间转换，译文予以保留。
    reason: 说明句法歧义及原文人称转换
lexical_decisions:
- source_word: וְהָיָה בַיּוֹם הַהוּא
  choice: 到那日
  rationale: 这是先知书常见的未来时间句式；“到那日”自然、庄重，并保留所指日期尚待上下文界定的特点。
- source_word: נְאֻם יְהוָה צְבָאוֹת
  choice: 万军之耶和华宣告
  rationale: נְאֻם 是先知宣告的固定用语；“宣告”比单纯的“说”更能体现其权威性。יְהוָה 译为“耶和华”，צְבָאוֹת 采用现代中文圣经读者熟悉且涵盖天上、地上众军含义的“万军”。
- source_word: אֶשְׁבֹּר עֻלּוֹ מֵעַל צַוָּארֶךָ
  choice: 我要从你颈项上折断他的轭
  rationale: 保留“他的”与“你的”之间的原文人称差异，也保留轭压在颈项上的鲜明图像；“折断”准确表达 שׁבר 的动作。
- source_word: וּמוֹסְרוֹתֶיךָ אֲנַתֵּק
  choice: 扯断你的绑索
  rationale: מוֹסְרוֹת 指束缚人的带子或绳索；“绑索”与轭和奴役的语境相合。נתק 表示拉断、挣断或扯开，译作“扯断”既具体又避免与前句机械重复。
- source_word: וְלֹא יַעַבְדוּ בוֹ עוֹד זָרִים
  choice: 外族人必不再奴役他
  rationale: עבד ב 在本节轭、绑索和解放的语境中表达强迫服役、奴役；זָרִים 指本族以外的人，译作“外族人”比可能带现代人际意味的“陌生人”准确。保留单数“他”，不擅自消除原文的人称转换。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: “耶和华”是现代中文普通读者最熟悉的专名形式，明确呈现这是神的约名，而非以“主”替代；不据此加入额外的宗派性解释。
- issue: 称号 צְבָאוֹת 的范围
  choice: 万军
  alternative: 众军
  rationale: “万军”是庄重而通行的现代中文称号，并可涵盖天上与地上的军旅或众队，不将其范围限定为某一种受造群体。
- issue: 末句 עבד 的语义力量
  choice: 奴役他
  alternative: 叫他服役
  rationale: 轭与绑索构成强制劳役的语境，因此采用“奴役”；同时用脚注说明句法压缩和可能的直译，避免把复杂原文伪装成毫无歧义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话书面语。“颈项”保留先知文学的肃穆感，“绑索”则避免过度古雅。“他／你”的转换没有被统一处理，以保留希伯来文把雅各／以色列既当作受话者、又当作单数整体来指称的张力。
