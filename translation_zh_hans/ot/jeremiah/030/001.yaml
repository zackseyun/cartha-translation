base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/030/001.yaml
  text: The word that came to Jeremiah from Yahweh[a], saying,
translation:
  language: zh_hans
  text: 雅威[a]的话临到耶利米，说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文：YHWH。中文传统译作“耶和华”。
    reason: 说明神名的原文形式及传统中文译法。
lexical_decisions:
- source_word: הַדָּבָר
  choice: 话
  rationale: דָּבָר可指“话、信息、事情”；在先知书的启示引言中译作“话”，既保留固定表达，也符合现代汉语圣经语体。
- source_word: אֲשֶׁר הָיָה אֶל
  choice: 临到
  rationale: 字面结构近于“向……而有”，在先知领受启示的公式中表示话语来到某人；“临到”简洁、自然，并保留其启示来源与领受关系。
- source_word: יִרְמְיָהוּ
  choice: 耶利米
  rationale: 采用现代中文圣经中通行的人名译法。
- source_word: מֵאֵת
  choice: 从……而来（以汉语语序表达为‘耶和华的话’）
  rationale: 该复合介词标明来源。中文用所属结构“耶和华的话临到……”自然地表达这话来自耶和华。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文读者最熟悉的圣名传统音译；脚注说明其希伯来文形式，以免把专名误解为普通称号。
- source_word: לֵאמֹר
  choice: 说
  rationale: 该不定式引出下一节的直接言语；译作“说”保留跨节衔接，冒号提示后文内容。
theological_decisions:
- issue: 如何译写神的专名 יְהוָה
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名，而非“主”这一称号。正文采用中文圣经传统且普通读者易识别的“耶和华”，脚注交代原文为YHWH；不以“主”替代专名，也不据不确定的古代读音作过度断定。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“耶和华的话临到……说”保留先知书引言的公式性；句末用冒号，使本节与下一节将引出的直接话语自然衔接。
