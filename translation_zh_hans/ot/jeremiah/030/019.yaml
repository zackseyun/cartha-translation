base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/030/019.yaml
  text: From them will come thanksgiving and the sound of those who rejoice[a]; I will multiply them, and they will not be few; I will honor them[b], and they will not be insignificant.
translation:
  language: zh_hans
  text: 从他们中间必发出感恩和欢庆之人的欢声[a]。我要使他们人数增多，他们必不稀少；我要使他们尊贵，他们必不卑微[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “欢庆之人”也可译作“嬉戏的人”或“欢笑作乐的人”；希伯来语词可指节庆中的欢笑、嬉戏或作乐。
    reason: lexical_alternative
  - marker: b
    text: “使他们尊贵，他们必不卑微”也可译作“使他们有分量，他们必不微小”或“他们必不无足轻重”；希伯来语用词既可涉及尊荣和地位，也带有“有分量／微小”的语义。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָצָא מֵהֶם
  choice: 必有……从他们中间发出
  rationale: 在预言语境中表达将来的应许；介词短语表示声音源自复兴后的群体。“发出”自然呈现声音、感恩从群体中涌现。
- source_word: תּוֹדָה
  choice: 感恩的声音
  rationale: 此处主要指感谢、赞美，而非特指感谢祭。结合后面的“声音”，译为“感恩的声音”符合现代汉语表达。
- source_word: וְקוֹל מְשַׂחֲקִים
  choice: 也有欢庆之人的欢声
  rationale: מְשַׂחֲקִים 可指欢笑、嬉戏或作乐；复兴的语境侧重节庆性的欢乐。“欢声”保留其可听见的群体表达，脚注说明其他可能。
- source_word: וְהִרְבִּתִים
  choice: 我要使他们人数增多
  rationale: 使役形表示使群体变得众多。补出“人数”可与下句“不再稀少”形成清楚的数量对照。
- source_word: וְלֹא יִמְעָטוּ
  choice: 不再稀少
  rationale: מעט 在此与“使他们增多”对应，主要表达人数不再少，而非仅仅停止减少。
- source_word: וְהִכְבַּדְתִּים
  choice: 我要使他们尊贵
  rationale: כבד 的使役形可表达使之有分量、受尊重或得尊荣；“使他们尊贵”既保留使役结构，也符合社会地位提升的语境。
- source_word: וְלֹא יִצְעָרוּ
  choice: 不再卑微
  rationale: צער 可表示微小、卑微或无足轻重。与“使他们尊贵”相对时，“卑微”自然传达地位低微，同时不完全排除“小”的语义背景。
theological_decisions:
- issue: 复兴应许的性质
  choice: 译作群体在感恩、欢庆、人口增长和地位提升上的具体复兴
  alternative: 将其仅解释为内在属灵福分，或仅解释为民族政治上的 exaltation
  rationale: 希伯来文本直接陈述感恩、欢庆、增多和尊贵；译文保留这些群体性复兴意象，不把它们限定于某一后来的教会论、末世论或政治体系。
- issue: כבד 与 צער 的对应关系
  choice: 以“尊贵／卑微”呈现社会地位上的对照，并用脚注保留“壮大／微小”的可能
  alternative: 完全按数量或规模译为“使他们壮大／不再微小”
  rationale: 上下文前半已经明确涉及人数；后半更可能转向尊荣与地位，但希伯来语仍容许“有分量／微小”的字面张力，因此不应无提示地排除。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“必有……发出”保留预言应许的语气；两个分句分别以“增多／稀少”和“尊贵／卑微”形成清晰对仗。所有脚注标记均已置于正文。
