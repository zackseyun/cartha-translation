base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/030/023.yaml
  text: Look[a], Yahweh’s storm of wrath has gone out, a sweeping tempest[b]; it will whirl down on the head of the wicked.
translation:
  language: zh_hans
  text: 看哪[a]，雅威的暴风——烈怒——已经发出；一场翻腾的狂风，它必旋落在恶人的头上[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“看哪，雅威烈怒的暴风已经发出，是一场翻腾的狂风。”原文连续使用多个与暴风和烈怒有关的词，语势十分强烈，句法关系也可作不同理解。
    reason: lexical_alternative
  - marker: b
    text: 或译：“它必落在恶人的头上。”句末动词含义较难确定；正文的“旋落”延续了全句的风暴意象。
    reason: alternative_reading
lexical_decisions:
- source_word: הִנֵּה
  choice: 看哪
  rationale: 以简洁而庄重的感叹语引出迫近的审判，保留原文鲜明的指示和唤起注意的作用。
- source_word: סַעֲרַת יְהוָה
  choice: 雅威的暴风
  rationale: 保留原文的所属结构，并用“暴风”表达猛烈、具有毁灭性的风暴意象。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常用音译直接呈现四字神名，不以称号取代原文专名。
- source_word: חֵמָה יָצְאָה
  choice: 烈怒的暴风已经刮起
  rationale: 原文可理解为“烈怒已经发出”，也可把“烈怒”看作对暴风性质的说明；正文采用自然汉语把烈怒与暴风结合，同时在脚注保留另一种句法理解。完成体表达已经发动、无法阻挡的先知性宣告。
- source_word: סַעַר מִתְגּוֹרֵר
  choice: 一场翻腾的狂风
  rationale: 两个风暴词叠加以增强声势；“翻腾”表现分词所描写的聚集、滚动或搅动之势，又避免机械重复“暴风”。
- source_word: עַל רֹאשׁ רְשָׁעִים
  choice: 在恶人的头上
  rationale: 保留审判临到人头上的具体希伯来意象，不将其弱化为泛泛的“临到恶人”。
- source_word: יָחוּל
  choice: 必旋落
  rationale: 此动词在这里含义困难；结合风暴语境，“旋落”兼顾旋动与落到其上的冲击感，同时以脚注注明较平实的可能译法。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文使用神的专名，正文以音译“雅威”呈现，既区别于称号“主”，也避免把后来的汉语传统读音当作唯一可能的发音。
- issue: 烈怒与暴风之间的句法关系
  choice: “雅威烈怒的暴风已经刮起”
  alternative: “雅威的暴风——烈怒已经发出”
  rationale: 希伯来语名词密集排列，可将“烈怒”理解为风暴的性质，也可独立成句。正文采用较自然的汉语表达，脚注明确保留另一读法，不据此扩展额外的神学解释。
translation_notes:
  register: 采用现代、庄重而具画面感的普通话。“刮起”“翻腾”“旋落”使风暴意象连贯，同时避免古奥句式。正文保留原文短促、层叠、审判迫近的语气；两处脚注交代真实的句法与词义不确定性。
