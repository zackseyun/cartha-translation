revisions:
- from: 耶和华如此说：“看哪，我要使雅各的帐棚重得福祉[a]，也要怜悯他的住处。城必重建在原来的废墟山冈上，宫殿也必立在原来的地方。”
  to: 耶和华如此说：“看哪，我要使雅各的帐棚恢复兴盛[a]，也要怜悯他的住处。城必重建在其土丘上，宫殿必坐落在其应有的位置。”
  rationale: 修订以“恢复兴盛”自然表达广义的复兴，同时保留脚注中的被掳归回理解。将“废墟山冈”收敛为“土丘”，不把词义过度具体化；将末句译为“坐落在其应有的位置”，以保留 מִשְׁפָּט 所含位置、安排与合宜秩序的语义开放性。
