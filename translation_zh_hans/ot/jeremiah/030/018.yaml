source:
  edition: WLC
  text: כֹּ֣ה אָמַ֣ר יְהוָ֗ה הִנְ/נִי שָׁב֙ שְׁבוּת֙ אָהֳלֵ֣י יַֽעֲק֔וֹב וּ/מִשְׁכְּנֹתָ֖י/ו אֲרַחֵ֑ם וְ/נִבְנְתָ֥ה עִיר֙ עַל תִּלָּ֔/הּ וְ/אַרְמ֖וֹן עַל מִשְׁפָּט֥/וֹ יֵשֵֽׁב׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/030/018.yaml
  text: 'Thus says Yahweh: Behold[a], I am restoring the fortunes of the tents of Jacob, and I will have compassion on his dwellings. The city will be rebuilt on its mound, and the palace will stand in its proper place.'
translation:
  language: zh_hans
  text: 耶和华如此说：“看哪，我要使雅各的帐棚恢复兴盛[a]，也要怜悯他的住处。城必重建在其土丘上，宫殿必坐落在其应有的位置。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“使雅各的被掳者归回”，或“使雅各从被掳中归回”。这个希伯来语习语既可特指被掳者归回，也可泛指景况和福祉得到恢复。
    reason: 保留 שָׁב שְׁבוּת 在“被掳归回”与“整体复兴”之间的语义幅度，并避免加入“帐棚中”这一原文未明说的限定。
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的专名形式，明确呈现以色列上帝的立约之名，而不以“主”替代。
- source_word: הִנְנִי
  choice: 看哪，我要
  rationale: “看哪”保留指示和强调作用；结合后续未完成式，以“我要”自然表达上帝即将施行的行动。
- source_word: שָׁב שְׁבוּת
  choice: 使……重得福祉
  rationale: 该希伯来习语可泛指扭转困境、恢复景况，也可能特指使被掳者归回；正文采用较宽广的表达，并在脚注保留被掳归回的可能。
- source_word: אָהֳלֵי יַעֲקֹב
  choice: 雅各的帐棚
  rationale: 直译其具体而具群体性的意象，不将“雅各”限定为个人或把“帐棚”泛化为家园。
- source_word: מִשְׁכְּנֹתָיו
  choice: 他的住处
  rationale: 用现代、自然的中文保留居所之义，并以“他的”承接雅各这一群体性称谓。
- source_word: אֲרַחֵם
  choice: 怜悯
  rationale: 准确表达 רחם 所含的深切慈怜，同时符合庄重的先知文体。
- source_word: וְנִבְנְתָה עִיר
  choice: 城必重建
  rationale: 上下文指向那座遭毁而将恢复的城；“重建”自然体现复兴语境中的被动建造。
- source_word: עַל תִּלָּהּ
  choice: 在原来的废墟山冈上
  rationale: תל 可指城毁后形成的遗址土丘；“废墟山冈”保留其地貌与毁坏背景，“原来的”则体现附属代词所指该城自己的旧址。
- source_word: אַרְמוֹן
  choice: 宫殿
  rationale: 在城邑复兴的语境中，“宫殿”最自然地表示显要的王室或贵族建筑，不额外强化军事堡垒含义。
- source_word: עַל מִשְׁפָּטוֹ יֵשֵׁב
  choice: 必立在原来的地方
  rationale: 此处 מִשְׁפָּט 表示合宜、既定的位置或秩序；该译法以清楚中文表达建筑恢复原位，不采用生硬的“按其定例坐落”。
theological_decisions:
- issue: שָׁב שְׁבוּת 所指复兴的范围
  choice: 正文表达雅各整体景况和福祉的恢复
  alternative: 使雅各被掳的人归回，或使雅各脱离被掳状态
  rationale: 该习语既可与被掳归回密切相关，也可泛指困境的全面逆转。本节同时提到帐棚、住处、城和宫殿，支持整体复兴之义；脚注保留被掳归回这一更具体的理解，避免消除原文张力。
- issue: עַל מִשְׁפָּטוֹ 的含义
  choice: 宫殿恢复在其原来的地方
  alternative: 宫殿按既定规制恢复，或像从前一样有人居住
  rationale: מִשְׁפָּט 在此可能涉及应有的位置、安排或常态。正文依空间语境译作“原来的地方”，但不据此引申任何特定政治或末世制度。
translation_notes:
  register: 采用现代、庄重而易懂的普通话书面语。“耶和华如此说”保留先知宣告的肃穆语气；“看哪”保留原文强调。句式适度简洁，并维持帐棚、废墟山冈和宫殿等具体意象。
