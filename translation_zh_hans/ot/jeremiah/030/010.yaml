source:
  edition: WLC
  text: וְ/אַתָּ֡ה אַל תִּירָא֩ עַבְדִּ֨/י יַעֲקֹ֤ב נְאֻם יְהֹוָה֙ וְ/אַל תֵּחַ֣ת יִשְׂרָאֵ֔ל כִּ֠י הִנְ/נִ֤י מוֹשִֽׁיעֲ/ךָ֙ מֵֽ/רָח֔וֹק וְ/אֶֽת זַרְעֲ/ךָ֖ מֵ/אֶ֣רֶץ שִׁבְיָ֑/ם וְ/שָׁ֧ב יַעֲקֹ֛ב וְ/שָׁקַ֥ט וְ/שַׁאֲנַ֖ן וְ/אֵ֥ין מַחֲרִֽיד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/030/010.yaml
  text: But as for you[a], do not fear, my servant Jacob, declares Yahweh, and do not be dismayed, Israel; for behold, I am saving you from far away, and your offspring from the land of their captivity. Jacob will return and be quiet and at ease[c][b], with no one to make him afraid.
translation:
  language: zh_hans
  text: 至于你，我的仆人雅各，不要惧怕——这是雅威的宣告；以色列啊，不要惊惶。看哪，我要从远方拯救你[a]，从他们被掳之地拯救你的后裔[b]。雅各必归回，得享安宁，安然自在；无人使他害怕[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “我要拯救你”也可译作“我正在拯救你”或“我必拯救你”。希伯来语“看哪，我”后接分词，可表示临近或确定将发生的行动。
    reason: 保留原文分词结构在进行、临近及确定未来之间的体貌张力。
  - marker: b
    text: “他们被掳之地”也可译作“他们作俘虏之地”，广义上即“流亡之地”。
    reason: 说明 שִׁבְיָם 可着重俘虏身份或被掳、流亡的处境。
  - marker: c
    text: “无人使他害怕”也可译作“无人惊扰他”。
    reason: מַחֲרִיד 是使役形式，既可直译为使人害怕，也可按处境译为惊扰。
lexical_decisions:
- source_word: וְאַתָּה
  choice: 至于你
  rationale: 独立代词配合连接词形成强调性的转折或话题转换；“至于你”自然保留这种语篇作用。
- source_word: אַל תִּירָא
  choice: 不要惧怕
  rationale: 准确表达 ירא 的禁止式，并与下句“不要惊惶”保持词义区别。
- source_word: עַבְדִּי
  choice: 我的仆人
  rationale: 此处是雅各／以色列的尊荣性、盟约性称号，“仆人”比“奴隶”更合乎上下文。
- source_word: נְאֻם יְהוָה
  choice: 这是雅威的宣告
  rationale: 保留庄严的先知宣告公式，并将四字神名直接音译为“雅威”。
- source_word: וְאַל תֵּחַת
  choice: 不要惊惶
  rationale: חתת 的尼法勒词干可指因恐惧而丧胆、惊惶；此译既自然，也不与前句“惧怕”完全重复。
- source_word: הִנְנִי מוֹשִׁיעֲךָ
  choice: 看哪，我要……拯救你
  rationale: הִנְנִי 带出强调和临近感，后接分词，可表达正在展开、即将发生或确定的未来行动；“看哪，我要”兼顾先知语体与现代汉语。
- source_word: מֵרָחוֹק
  choice: 从远方
  rationale: 直接表达空间上的遥远，简洁自然。
- source_word: זַרְעֲךָ
  choice: 你的后裔
  rationale: זרע 在此是集合意义，指雅各的子孙；“后裔”比字面的“种子”更符合现代汉语。
- source_word: מֵאֶרֶץ שִׁבְיָם
  choice: 从他们被掳之地
  rationale: 既保留“地”的具体意象，也表达 שבי 所指的被掳状态，不将其泛化为单纯的“流亡”。
- source_word: וְשָׁב
  choice: 必归回
  rationale: שוב 在此指从被掳状态返回；“必”传达预言所表达的确定性。
- source_word: וְשָׁקַט וְשַׁאֲנַן
  choice: 安宁安逸
  rationale: 两个并列动词分别侧重不受扰动的平静和安稳自在的状态；采用两个相近而不完全相同的词保留叠加强调。
- source_word: וְאֵין מַחֲרִיד
  choice: 无人使他惊怕
  rationale: 贴近希伯来语使役分词的结构，说明不再有人令雅各恐惧。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；音译“雅威”保留其作为盟约之神专名的性质，不以称号替代。
- issue: “雅各”与“以色列”的所指
  choice: 保留两个平行的盟约名称
  alternative: 全都统一译作“以色列”
  rationale: 原文有意交替使用“雅各”和“以色列”；保留两者可维持诗性平行和盟约语境，而不额外判定二者具有不同所指。
- issue: הִנְנִי 加分词所表达的时间与体貌
  choice: 我要……拯救你
  alternative: 我正在拯救你；我必拯救你
  rationale: 该结构可强调临近或确定的行动，原文并未要求只能理解为正在进行或单纯未来；正文采用自然且保留前瞻性的译法，并以脚注说明歧义。
translation_notes:
  register: 采用现代、庄重而易懂的先知语体。“这是雅威的宣告”保留宣告公式的肃穆感；破折号帮助现代读者辨认插入语。正文保留“看哪”，以传达 הִנְנִי 的强调和临场感。
