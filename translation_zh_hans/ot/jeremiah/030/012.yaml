source:
  edition: WLC
  text: כִּ֣י כֹ֥ה אָמַ֛ר יְהוָ֖ה אָנ֣וּשׁ לְ/שִׁבְרֵ֑/ךְ נַחְלָ֖ה מַכָּתֵֽ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/030/012.yaml
  text: 'For thus says Yahweh: Your fracture is incurable[a]; your wound is grievous.'
translation:
  language: zh_hans
  text: '因为雅威如此说：

    “你的创伤无法医治[a]，

    你的伤口极其严重。”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你的损伤无可救治；你的伤势十分严重。”
    reason: 词汇备选译法：שֶׁבֶר可译为“损伤”，אָנושׁ也可表达“无可救治”。
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上下文，引出雅威对先前宣告的解释；现代汉语用“因为”自然表达这一话语关系。
- source_word: כֹה אָמַר יְהוָה
  choice: 雅威如此说
  rationale: 保留先知传信公式的庄重语气，并将神名直接音译为“雅威”。
- source_word: אָנושׁ
  choice: 无法医治
  rationale: 在创伤意象中表示病情危重乃至不可治愈；译作“无法医治”清楚自然。
- source_word: לְשִׁבְרֵךְ
  choice: 你的创伤
  rationale: שֶׁבֶר可指破裂、骨折或由打击造成的损伤；“创伤”既保留身体受损的意象，也适合这里对群体灾难的比喻。
- source_word: נַחְלָה
  choice: 极其严重
  rationale: 此处作谓语，形容伤口病重、恶化；避免与前句重复说“无法医治”，同时保留其严重程度。
- source_word: מַכָּתֵךְ
  choice: 你的伤口
  rationale: 在相邻的医疗意象中，מַכָּה自然指创伤或伤口；“伤口”具体且符合现代汉语表达。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”较直接地呈现其专名性质，不以“主”替代。
- issue: 两分句是否都表达“不可医治”
  choice: 首句译“无法医治”，次句译“极其严重”
  alternative: 两句都译为不可医治
  rationale: אָנושׁ明确传达无望或不可医治，נַחְלָה则可指病重、严重；采用不同措辞保留希伯来文平行句之间既相近又不完全相同的语义张力。
translation_notes:
  register: 采用现代、庄重而清楚的先知宣告语体。“创伤／伤口”保留原文连续的身体医疗意象；使用全角中文标点和诗行排版。
