id: JER.30.14
reference: Jeremiah 30:14
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כָּל מְאַהֲבַ֣יִ/ךְ שְׁכֵח֔וּ/ךְ אוֹתָ֖/ךְ לֹ֣א יִדְרֹ֑שׁוּ כִּי֩ מַכַּ֨ת אוֹיֵ֤ב הִכִּיתִי/ךְ֙ מוּסַ֣ר אַכְזָרִ֔י עַ֚ל רֹ֣ב עֲוֺנֵ֔/ךְ עָצְמ֖וּ חַטֹּאתָֽיִ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/030/014.yaml
  text: All your lovers have forgotten you[a]; they do not seek you. For I have struck you with the wound of an enemy, with cruel discipline, because of the greatness of your iniquity[b]; your sins are numerous.
translation:
  language: zh_hans
  text: 你所有的情人都忘了你[a]；他们不来寻找你。因为我以仇敌的击打击打你，以残酷的管教[b]待你；这是因你的罪孽深重，你的罪恶众多。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “情人”也可指“盟友”。希伯来文直译为“情人”，保留了耶利米书反复使用的隐喻，指犹大在政治和属灵上不忠地依恋别国。
    reason: lexical_alternative
  - marker: b
    text: “以残酷的管教待你”也可译作“严厉地惩治你”或“以无情的责罚待你”。
    reason: lexical_alternative
lexical_decisions:
- source_word: מְאַהֲבַיִךְ
  choice: 你的情人
  rationale: 原词直指“情人、爱人”；在耶利米书中也可暗指犹大所追逐的外国盟友。正文保留先知性的情爱隐喻，脚注说明政治含义。
- source_word: שְׁכֵחוּךְ
  choice: 都忘了你
  rationale: 忠实保留שׁכח“忘记”的基本义，不强化为“抛弃”。
- source_word: יִדְרֹשׁוּ
  choice: 来寻求你
  rationale: דרש的核心义为“寻求、探询”；加“来”使现代汉语自然，同时表达无人前来过问的语境。
- source_word: מַכַּת אוֹיֵב
  choice: 仇敌所造成的创伤
  rationale: מכה可指击打或创伤；此处与“我击打你”相连，译作“创伤”保留伤害意象，“仇敌所造成的”传达构造关系而不把实际施行者从上帝改为仇敌。
- source_word: הִכִּיתִיךְ
  choice: 我击打你
  rationale: נכה的基本义是“击打”；直译以保留上帝亲自施行审判的明确陈述。
- source_word: מוּסַר אַכְזָרִי
  choice: 以残酷的管教待你
  rationale: מוּסָר指管教、责罚，אַכְזָרִי指残酷、无情；该译法既保留管教含义，也不削弱严厉程度。
- source_word: עַל רֹב עֲוֺנֵךְ
  choice: 这是因你的罪孽深重
  rationale: רֹב可表达多或大，עָוֹן可指罪孽或罪责；“罪孽深重”在现代汉语中兼顾数量与严重性，并明确表达审判原因。
- source_word: עָצְמוּ חַטֹּאתַיִךְ
  choice: 你的罪恶众多
  rationale: עצם在此与“罪孽深重”平行，宜理解为多、强盛或严重；“众多”自然表达数量之大，同时避免加入原文未明确说明的增长过程。
theological_decisions:
- issue: 神施行审判的主体性与原因
  choice: 明确译为“我击打你……这是因你的罪孽深重”，保留神亲自施行审判及罪孽构成原因的表述。
  alternative: 弱化为仇敌单独造成伤害，或只说这是罪恶的自然后果。
  rationale: 希伯来文明确使用第一人称“我击打你”，并以עַל引出罪孽与罪恶作为原因；译文不缓和这一神学张力，也不作超出经文的解释。
- issue: “仇敌的创伤”中仇敌与神的关系
  choice: 将מַכַּת אוֹיֵב表达为具有仇敌般性质或通常由仇敌造成的创伤，同时让“我击打你”保持实际施行者为神。
  alternative: 译成“仇敌击伤了你”，把直接施行者改为仇敌。
  rationale: 句法主句的施事明确是神；构造短语“仇敌的创伤”描述击打的性质或样式，不应消除主句的神圣主体。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“情人”刻意保留原文尖锐的先知性隐喻；“击打”“创伤”“管教”维持原文的意象链与审判力度。脚注标记均置于正文相应位置。
