language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: ה֗וֹי כִּ֥י גָד֛וֹל הַ/יּ֥וֹם הַ/ה֖וּא מֵ/אַ֣יִן כָּמֹ֑/הוּ וְ/עֵֽת צָרָ֥ה הִיא֙ לְ/יַֽעֲקֹ֔ב וּ/מִמֶּ֖/נָּה יִוָּשֵֽׁעַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/030/007.yaml
  text: Alas! For that day is great[a]; there is none like it. It is a time of distress for Jacob[c][b], yet he will be saved out of it.
translation:
  language: zh_hans
  text: 唉！因为那日极其重大[a]，没有任何一天能与之相比。那是雅各遭难的时候[b]，然而他必从其中得救[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 开头的感叹词也可译作“哀哉！”或“祸哉！”。“极其重大”也可译作“极大”；其可怕的性质由上下文显明。
    reason: lexical_alternative
  - marker: b
    text: 或译：“那是雅各受困苦的时候。”
    reason: lexical_alternative
  - marker: c
    text: 或译：“然而他必从其中获救”或“被解救出来”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹי
  choice: 哀哉！
  rationale: 该感叹词表达惊惧或哀叹。“哀哉”保留先知话语庄重而强烈的感叹语气，又不必将其限定为正式的咒祸宣告。
- source_word: כִּי
  choice: 因为
  rationale: 在此引出发出哀叹的原因；“因为”清楚保留其解释作用。
- source_word: גָדוֹל
  choice: 极其重大
  rationale: 原词基本义为“大、重大”，指规模或分量非同寻常。上下文已显明其可怕性质，因此不直接译作“可怕”，以免把语境含义写进词义本身。
- source_word: הַיּוֹם הַהוּא
  choice: 那日
  rationale: 这是先知文献中常见的特定指称；“那日”简洁自然，并保留指示语气。
- source_word: מֵאַיִן כָּמֹהוּ
  choice: 没有任何日子能与它相比
  rationale: 这是表达无可比拟的希伯来语习语。补出“日子”使现代汉语指代清楚，而不增加解释性内容。
- source_word: וְעֵת צָרָה
  choice: 那是……遭难的时候
  rationale: עֵת 表示时候或时期，צָרָה 表示患难、困苦或危急；“遭难的时候”自然庄重，并体现该患难临到雅各。
- source_word: לְיַעֲקֹב
  choice: 雅各
  rationale: 保留原文专名，不在正文中改写为“以色列”或“雅各的后裔”，从而保留其拟人化及盟约语境。
- source_word: וּמִמֶּנָּה
  choice: 然而……从其中
  rationale: 阴性代词后缀回指阴性名词 צָרָה 所指的患难处境。“从其中”与“得救”搭配，准确表达脱离该患难。连接词按上下文译为“然而”，显出患难与拯救之间的转折。
- source_word: יִוָּשֵׁעַ
  choice: 他必……得救
  rationale: ישׁע 的尼法勒式表达被拯救、获救。“得救”保留圣经救恩词汇的联系，而“从其中”把这里的直接意义限定为脱离患难。
theological_decisions:
- issue: “雅各”的所指
  choice: 正文保留“雅各”，按单数拟人化表达，不直接改成“以色列”“雅各的后裔”或“上帝的子民”。
  alternative: 译作“以色列”“雅各的后裔”或“上帝的子民”。
  rationale: 希伯来文明确使用专名“雅各”。保留该名称既维持先知书的盟约语汇，也避免在翻译中提前锁定其群体所指。
- issue: יִוָּשֵׁעַ 的语义力度
  choice: 译作“他必从其中得救”。
  alternative: “他必从其中获救”“他必从其中被解救出来”或“他必逃脱”。
  rationale: “得救”保留该词所属的广泛拯救语义，同时由“从其中”表明眼前所说的是脱离患难，并不擅自把它限定为逃跑或扩展为特定的系统神学含义。
- issue: 患难与拯救之间的关系
  choice: 用“然而”呈现语境中的转折。
  alternative: 机械地译作“并且”，或不加连接词。
  rationale: 希伯来文仅用 וְ 连接，但后句在意义上与前句形成明显反差。“然而”以自然汉语传达该语篇关系，而不改变两项陈述本身。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“哀哉”保留先知性哀叹的力度；其余句式避免过度文言化。正文按原文次序推进，并用自然汉语明确比较对象与转折关系。所有脚注标记均已置于正文相应位置。
