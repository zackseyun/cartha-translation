base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/030/020.yaml
  text: His children will be as in former times[a], and his congregation will be established before me[d][c][b]; and I will punish all his oppressors.
translation:
  language: zh_hans
  text: 他的儿女必像从前一样[a]；他的会众必在我面前坚立[b][c]；我必惩罚所有压迫他的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “儿女”原文直译为“儿子们”，这里可集合性地指儿女或后裔；“像从前一样”也可译作“像古时一样”或“像先前一样”。
    reason: lexical_alternative
  - marker: b
    text: “会众”也可译作“群体”、“社群”或“集会”。
    reason: lexical_alternative
  - marker: c
    text: 原文各处均用单数“他的”；这可能是把雅各／以色列作为一个整体来人格化地表述。
    reason: cultural_note
lexical_decisions:
- source_word: וְהָיוּ
  choice: 必……一样
  rationale: 在先知性复兴应许的语境中，带连接词的完成式表达将来意义；用“必”体现应许的确定性。
- source_word: בָנָיו
  choice: 他的儿女
  rationale: בנים 字面可指“儿子们”，也可集合性地指儿女或后裔；“儿女”自然且不过度限定为男性。
- source_word: כְּקֶדֶם
  choice: 像从前一样
  rationale: 保留与先前景况相比的含义，现代汉语自然清楚。
- source_word: וַעֲדָתוֹ
  choice: 他的会众
  rationale: עֵדָה 指聚集的群体或共同体；“会众”保留其群体性和盟约语境，同时通俗可懂。
- source_word: לְפָנַי
  choice: 在我面前
  rationale: 直接对应原文介词短语，保留在上帝面前存立的关系性含义。
- source_word: תִּכּוֹן
  choice: 必……坚立
  rationale: כון 的尼法勒式表示被确立、稳固或安定；“坚立”兼顾结果状态与被动含义，又较为简洁庄重。
- source_word: וּפָקַדְתִּי
  choice: 我都必惩罚
  rationale: פקד 语义范围较广，但此处以敌对的压迫者为对象，具有追究并施行刑罚的含义。
- source_word: עַל כָּל לֹחֲצָיו
  choice: 凡压迫他的
  rationale: 参与分词 לֹחֲצָיו 指所有压迫他的人；译成关系分句自然，并保留单数代词。
theological_decisions:
- issue: “他的儿女、他的会众、压迫他的”中单数后缀的指代
  choice: 保留单数“他／他的”，不在正文中明确替换为“以色列”或复数“他们”。
  alternative: 将其解释为作为整体的雅各／以色列，并译作“他们的儿女、他们的会众、压迫他们的”。
  rationale: 希伯来文连续使用阳性单数后缀，可能把雅各／以色列人格化为一个整体；保留单数更贴近原文，也不消除其指代张力。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“坚立”保留经文语体但仍通顺；句末改为“凡……我都……”以自然呈现希伯来文“所有压迫他的人”。所有脚注标记均已置于正文相应位置。
