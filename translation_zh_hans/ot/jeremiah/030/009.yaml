source:
  edition: WLC
  text: וְ/עָ֣בְד֔וּ אֵ֖ת יְהוָ֣ה אֱלֹֽהֵי/הֶ֑ם וְ/אֵת֙ דָּוִ֣ד מַלְכָּ֔/ם אֲשֶׁ֥ר אָקִ֖ים לָ/הֶֽם׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/030/009.yaml
  text: They will serve Yahweh their God and David their king[a], whom I will raise up for them.
translation:
  language: zh_hans
  text: 他们要事奉耶和华他们的上帝和他们的王大卫；我必为他们兴起这王。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或理解为“未来一位大卫家的君王”。许多解经者认为，这里的“大卫”是预言性地指弥赛亚，而不是指大卫本人。
    reason: 说明“大卫”在此处可能具有的大卫家君王及弥赛亚含义，同时不改变正文的直译。
lexical_decisions:
- source_word: וְעָבְדוּ
  choice: 他们要事奉
  rationale: עבד的基本义是“服事、事奉”；在盟约语境中也包含敬拜之意。“事奉”既自然，又保留了比单纯“敬拜”更宽的含义。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经传统中对四字神名的通行音译“耶和华”，将其作为专名而非以称号替代。
- source_word: אֱלֹהֵיהֶם
  choice: 他们的上帝
  rationale: 准确表达带第三人称复数后缀的所属关系，也保留盟约关系的意味。
- source_word: וְאֵת
  choice: 也要事奉
  rationale: 原文以连词连接同一动词的第二个直接宾语。中文补出动词，清楚表明百姓既事奉耶和华，也事奉他们的王，同时不改变句法关系。
- source_word: דָּוִד מַלְכָּם
  choice: 他们的王大卫
  rationale: 直译人名与王号，保留原文所说的“大卫”，不在正文中提前解释为弥赛亚或大卫后裔。
- source_word: אָקִים
  choice: 兴起
  rationale: קום的使役式可指“使起来、兴起、设立”。“兴起”保留先知语言的惯用表达及其可能的语义张力，不将其收窄为单纯的任命或确立。
- source_word: לָהֶם
  choice: 为他们
  rationale: 表达该君王是上帝为百姓而兴起的；此处介词可自然译作“为”。
theological_decisions:
- issue: “他们的王大卫”的身份
  choice: 正文保留“大卫”这一名字，不作解释性扩写。
  alternative: 未来的大卫家君王；弥赛亚
  rationale: 希伯来文明确写“大卫”。它常被理解为对未来大卫家君王的预言，在基督教诠释中又常指向弥赛亚；但正文应保存原文措辞及其诠释张力，并在脚注中说明主要理解。
- issue: “兴起”的含义
  choice: 译作“兴起”，不明确限定为复活、任命或建立。
  alternative: 设立；使他起来
  rationale: 使役式אָקִים具有一定语义幅度。译作“兴起”可保留这种幅度，避免在译文中选定某一种神学解释。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“事奉”符合宗教与盟约语境；“兴起”保留先知文体。为避免“他们的王大卫，我必……”可能造成关系从句指向不够清晰，采用分号并补出代词“他”，自然呈现原文关系从句的内容。
