  text: מַה תִּזְעַק֙ עַל שִׁבְרֵ֔/ךְ אָנ֖וּשׁ מַכְאֹבֵ֑/ךְ עַ֣ל רֹ֣ב עֲוֺנֵ֗/ךְ עָֽצְמוּ֙ חַטֹּאתַ֔יִ/ךְ עָשִׂ֥יתִי אֵ֖לֶּה לָֽ/ךְ־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/030/015.yaml
  text: Why do you cry out over your injury? Your pain is incurable[a]. Because your iniquity is great, because your sins are many[b], I have done these things to you.
translation:
  language: zh_hans
  text: 你为什么为自己的创伤[a]呼喊？你的痛苦无可救治[b]。因你的罪孽深重，因你的罪恶众多[c]，我使这些事临到你。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “创伤”也可译作“伤口”或“破裂”；希伯来词可指破裂、骨折、创伤或毁坏。
    reason: lexical_alternative
  - marker: b
    text: “无可救治”也可理解为“极其严重”或“病入膏肓”；希伯来词既可强调病势危重，也可表达难以医治。
    reason: lexical_alternative
  - marker: c
    text: “众多”所译的希伯来词也可表示“强大”；这里与“罪孽深重”平行，主要表达罪恶多而严重。
    reason: lexical_ambiguity
lexical_decisions:
- source_word: מַה תִּזְעַק
  choice: 你为什么……呼喊
  rationale: 疑问词 מַה 在此引出带责问意味的“为什么”；זעק 指人在苦难中大声呼求，“呼喊”保留其强烈语气。
- source_word: עַל שִׁבְרֵךְ
  choice: 为自己的创伤
  rationale: עַל 表示呼喊所针对或缘起的事；שֶׁבֶר 可指破裂、骨折、创伤或毁坏。这里以“创伤”自然地承接人物化的锡安所受重创，又不把意象限于具体骨折。
- source_word: אָנושׁ מַכְאֹבֵךְ
  choice: 你的痛苦无可救治
  rationale: מַכְאוֹב 是疼痛、痛苦；אָנושׁ 可表示病势危重、难以医治乃至无望。“无可救治”切合上下文中的医疗隐喻，同时脚注保留“极其严重”的语义可能。
- source_word: עַל רֹב עֲוֺנֵךְ
  choice: 因你的罪孽深重
  rationale: 此处 עַל 引出审判的原因；רֹב 表示多、大或程度深；עָוֹן 在此主要指道德过犯，译为“罪孽”。
- source_word: עָצְמוּ חַטֹּאתַיִךְ
  choice: 因你的罪恶众多
  rationale: עצם 可表示强大、增多；与复数“罪恶”连用，并与上一分句平行，最自然的理解是数量众多，也可能兼有势大、严重之意。重复“因”保留原文两个 עַל 短语的并列强调。
- source_word: עָשִׂיתִי אֵלֶּה לָךְ
  choice: 我才使这些事临到你
  rationale: 第一人称完成式明确保留说话者主动施行审判；“这些事”对应复数指示词 אֵלֶּה。“使……临到”是自然汉语，同时没有把神的作为淡化为非人格事件。
theological_decisions:
- issue: 审判的施行者
  choice: 保留第一人称直接施行：“我才使这些事临到你”
  alternative: 这些事才临到你
  rationale: 希伯来文明确使用第一人称单数 עָשִׂיתִי（“我做了”），上下文中的说话者是耶和华；不可将其弱化成仅仅发生的遭遇。
- issue: 罪与苦难之间的因果关系
  choice: 用两个“因”明确保留本节所陈述的审判原因
  alternative: 将前两分句仅理解为一般性的伴随情况
  rationale: 两个 עַל 短语在这里最自然地说明“我使这些事临到你”的原因。译文只呈现本节的具体宣告，不扩展为对所有苦难的普遍解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“创伤—痛苦—救治”维持原文的伤病隐喻；“我才使这些事临到你”既自然，也明确保留神在审判中的主动性。称呼对象在希伯来文中为阴性单数，结合上下文可指被人格化的锡安，但本节不额外补出名称。
