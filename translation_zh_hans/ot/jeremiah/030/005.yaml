base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/030/005.yaml
  text: 'For thus says Yahweh: “We have heard a sound of trembling[a], of fear[b], and there is no peace.”'
translation:
  language: zh_hans
  text: '因为雅威如此说：


    “我们听见战栗之声[a]，


    恐惧[b]，且没有平安。”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “战栗之声”也可译作“惊恐之声”或“令人战栗的声响”；希伯来语 קוֹל 可依语境指声音、声响或人声。
    reason: lexical_alternative
  - marker: b
    text: “战栗”也可译作“惊恐”，“恐惧”也可译作“惧怕”；原文并用两个意义相近的词，加强危难惊惧之感。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 在此承接上文并引出说明性的神谕；“因为”保留其论述连接作用，不过度强化具体因果。
- source_word: כֹה אָמַר
  choice: 如此说
  rationale: 保留希伯来先知书常见的使者宣告格式，同时符合庄重的现代汉语表达。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按四字神名的通常重构读音作音译，直接保留经文中的专名，而不以称号替代。
- source_word: קוֹל
  choice: 声
  rationale: 此处表示所听见的声响；“声”既可涵盖声音，也不限定为有明确言语内容的人声。
- source_word: חֲרָדָה
  choice: 战栗
  rationale: 该词兼有因惊惧而颤抖之意；“战栗”保留身体反应与恐惧感，比单纯译作“害怕”更具体。
- source_word: שָׁמָעְנוּ
  choice: 我们听见
  rationale: 保留第一人称复数。希伯来完成式在此陈述已经感知到、且与当前有关的声音，现代汉语用“听见”即可自然表达。
- source_word: פַּחַד
  choice: 恐惧
  rationale: 直接表达强烈的惧怕，并与“战栗”形成语义相近而递进的组合。
- source_word: וְאֵין
  choice: 毫无
  rationale: 以简洁自然的汉语表达连接词加存在否定；“毫无”在诗性语境中强化彻底缺失，但不加入原文没有的原因。
- source_word: שָׁלוֹם
  choice: 平安
  rationale: 此处与战栗、恐惧相对，包含安宁、安全和健全处境；“平安”在汉语中能较完整地承载这些含义。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文使用四字神名而非“主”的称号；采用“雅威”是依据通常学术重构读音的直接音译。“耶和华”是汉语传统中广为人知的另一音译，故作为可选形式列明。
- issue: “我们”所指的说话群体
  choice: 保留第一人称复数，不明说所指
  alternative: 解释为百姓、列国或叙述者群体
  rationale: 本节本身没有明确界定“我们”的身份；直译代词可保留上下文中的开放性，避免加入特定解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话，并按诗行排列。保留先知宣告公式和第一人称复数，不解释“我们”的身份。“尽是恐惧，毫无平安”以自然汉语传达原文后半句的并列与强烈反差。
