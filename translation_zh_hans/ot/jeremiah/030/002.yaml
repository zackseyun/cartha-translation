  text: כֹּֽה אָמַ֧ר יְהוָ֛ה אֱלֹהֵ֥י יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר כְּתָב לְ/ךָ֗ אֵ֧ת כָּל הַ/דְּבָרִ֛ים אֲשֶׁר דִּבַּ֥רְתִּי אֵלֶ֖י/ךָ אֶל סֵֽפֶר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/030/002.yaml
  text: 'Thus says Yahweh[a], the God of Israel: Write for yourself in a scroll all the words that I have spoken to you.'
translation:
  language: zh_hans
  text: 雅威，以色列的上帝如此说：“你要把我对你说过的一切话都写在书卷[a]上。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “书卷”也可译作“书”或“文书”；希伯来语 סֵפֶר 指书写成的文献，在当时通常为卷轴形式。
    reason: 说明历史载体，并保留 סֵפֶר 较宽的词义范围。
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: 如此说
  rationale: 保留先知传信公式的庄重语气；希伯来语虽使用完成式，整个固定公式表达的是当前权威性的宣告。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按通常重构的读音音译上帝的专名，区别于作为称号的“主”，并与原文直接使用四字神名相对应。
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: 以色列的上帝
  rationale: 直接表达原文的属格结构，清楚指出雅威与以色列的关系。
- source_word: לֵאמֹר
  choice: 冒号并引出直接引语
  rationale: 此处用于引出下文话语，现代汉语以标点和引号表达比直译“说”更自然。
- source_word: כְּתָב לְךָ
  choice: 你要把……写在
  rationale: כְּתָב是对耶利米的直接命令；לְךָ带有与受命者相关的语气，汉语若硬译“为自己写”容易误解为供个人使用，因此由明确的第二人称命令自然承载。
- source_word: כָּל הַדְּבָרִים
  choice: 一切话都
  rationale: 在上帝说话并命人记录的语境中，דְּבָרִים宜译为“话”而非泛指“事情”；“一切……都”自然体现 כָּל 的完整范围。
- source_word: אֲשֶׁר דִּבַּרְתִּי אֵלֶיךָ
  choice: 我对你说过的
  rationale: “说过”既表达先前已经说出，也保留这些话现今要被记录的关联。
- source_word: אֶל־סֵפֶר
  choice: 写在卷册上
  rationale: סֵפֶר指书写文献；在当时通常是卷轴式文书。“卷册”既反映历史载体，又比单用“书卷”更贴近现代普通读者的语言。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用上帝的专名。采用“雅威”以反映通常重构的发音，并避免将专名改成称号；“耶和华”虽为熟悉的传统形式，但源于较晚的混合读法。
- issue: לְךָ 是否明译为“为自己”
  choice: 不另译“为自己”，由“你要”体现受命者
  alternative: 你要为自己写
  rationale: 原文保留与耶利米本人相关的语气，但汉语“为自己”容易引入“供私人用途”的含义，而上下文并未明确要求这种解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“如此说”保留先知宣告的正式节奏；直接引语使用现代汉语标点。脚注标记紧随“卷册”，与其所解释的词准确对应。
