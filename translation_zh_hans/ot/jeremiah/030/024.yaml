  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: לֹ֣א יָשׁ֗וּב חֲרוֹן֙ אַף יְהוָ֔ה עַד עֲשֹׂת֥/וֹ וְ/עַד הֲקִימ֖/וֹ מְזִמּ֣וֹת לִבּ֑/וֹ בְּ/אַחֲרִ֥ית הַ/יָּמִ֖ים תִּתְבּ֥וֹנְנוּ בָֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/030/024.yaml
  text: The burning anger of Yahweh will not turn back until he has done it[a], and until he has established the purposes of his heart. In the latter days you will understand it.
translation:
  language: zh_hans
  text: 耶和华的烈怒必不转回，直到他做成这事，直到他实现心中的谋划。末后的日子[a]，你们必明白这事。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“日后”或“将来的日子”。这个希伯来语表达可以指上帝旨意在未来最终实现的时期，但没有明确指定具体时间。
    reason: 说明先知性时间表达的可译范围，避免将其过度限定为某一特定末世时间点。
lexical_decisions:
- source_word: חֲרוֹן אַף
  choice: 烈怒
  rationale: 该搭配以怒气的炽热为意象。“烈怒”在现代汉语中自然、庄重，也保留了强烈而持续的怒气这一含义。
- source_word: יָשׁוּב
  choice: 转回
  rationale: שׁוב的基本义是“转回、返回”。此处指耶和华的怒气在旨意完成以前不会撤回；“转回”保留原文空间，避免直接解释为情绪上的“息怒”。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的神名音译“耶和华”，而不以称号替代原文专名。
- source_word: עַד עֲשֹׂתוֹ
  choice: 直到他做成这事
  rationale: 保留原文简洁表达及所指事项的概括性；“做成”同时传达行动与完成之意。
- source_word: וְעַד הֲקִימוֹ מְזִמּוֹת לִבּוֹ
  choice: 直到他实现心中的谋划
  rationale: Hiphil形式הקים在此表示使计划成立、付诸实现；מזמות指经过筹定的谋划。“实现心中的谋划”符合现代汉语，并保留神坚定施行其意旨的含义。
- source_word: בְּאַחֲרִית הַיָּמִים
  choice: 末后的日子
  rationale: 这是先知书中的固定时间表达，可指将来的终局阶段，但本身不精确界定时间范围。“末后的日子”保留其先知性和末世性张力。
- source_word: תִּתְבּוֹנְנוּ בָהּ
  choice: 你们必明白这事
  rationale: 该动词形式表达经过留意、思考而获得领悟。“必明白”在中文中简洁自然；阴性单数后缀以“这事”表达，保持其所指的概括性。
theological_decisions:
- issue: בְּאַחֲרִית הַיָּמִים所指的先知性时间范围
  choice: 末后的日子
  alternative: 日后；将来的日子
  rationale: 原文可带有上帝旨意最终实现的末世意味，却没有明确限定具体时点。正文保留传统先知性表达，脚注说明其语义幅度，不把它限定为某一种末世时间表。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“烈怒”“转回”“谋划”保持先知文学的力度，同时避免生硬直译；脚注标记置于其实际说明的“末后的日子”之后。
