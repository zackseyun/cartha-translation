base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/030/006.yaml
  text: 'Ask now[a], and see: does a male give birth? Why then do I see every man with his hands on his loins like a woman in labor, and every face turned pale?'
translation:
  language: zh_hans
  text: 你们要问一问，看看：男人能生孩子吗？为什么我看见每个男人都双手抱着腰间，像正在生产的妇人一样，所有人的脸都变得惨白[a]？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“所有人的脸都变得青白。”希伯来语所用的词表示一种病态的苍白，可能带青绿色或黄绿色。
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׁאֲלוּ נָא וּרְאוּ
  choice: 你们且问问，看一看
  rationale: 复数祈使句带语气词 נָא，表达催促听众查问并察看；“且问问，看一看”自然保留劝促和修辞性的邀请。
- source_word: אִם יֹלֵד זָכָר
  choice: 男人能生孩子吗？
  rationale: זָכָר 明指男性，配合分娩动词构成不可能情景。现代汉语用“男人”比“男性”更自然，“能……吗”清楚呈现反问。
- source_word: מַדּוּעַ רָאִיתִי
  choice: 为什么我看见
  rationale: מַדּוּעַ 引出反问；完成式 רָאִיתִי 在此为生动的当前观察，译作“我看见”而不限定为过去。
- source_word: כָל גֶּבֶר
  choice: 每个男人
  rationale: גֶּבֶר 可强调成年男子或强健者；此处重在男子与产妇形象的强烈反差。“每个男人”自然且不额外限定为战士。
- source_word: יָדָיו עַל חֲלָצָיו
  choice: 都双手按着腰腹
  rationale: חֲלָצַיִם 指腰胯、腰腹区域，与分娩剧痛的姿态相连。“腰腹”兼顾身体部位和现代可懂度，避免“腰间”过于轻淡或“腰子”产生歧义。
- source_word: כַיּוֹלֵדָה
  choice: 像临产的妇人一样
  rationale: 阴性分词明确指正在生产的女性；“临产的妇人”简洁、庄重，并保留分娩阵痛的鲜明形象。
- source_word: וְנֶהֶפְכוּ כָל־פָּנִים לְיֵרָקוֹן
  choice: 人人都面色惨白
  rationale: 希伯来语直述所有面容变为 יֵרָקוֹן 所指的病态苍白、偏青或黄绿色。“面色惨白”在现代汉语中自然传达因恐惧或痛苦而失色的景象，具体色调另以脚注说明。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以连续反问保持原文的急迫感和震撼力；“男人—临产的妇人”的反常对照予以直译，不淡化其苦痛意象。脚注标记[a]置于“惨白”之后，与颜色词的词义说明直接对应。
