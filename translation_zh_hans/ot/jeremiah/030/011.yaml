revisions:
- from: 因为我与你同在，要拯救你——这是耶和华的宣告[a]。我必使我把你赶散到的万国彻底灭亡，却不使你彻底灭亡。我必按公正管教你，绝不让你免受惩罚[b]。
  to: 因为我与你同在，要拯救你——这是耶和华的宣告[a]。我必使我把你驱散到其中的万国都彻底灭亡，却不使你彻底灭亡。我必按公正管教你，绝不让你免受惩罚[b]。
  rationale: 仅作低风险的汉语句法润饰：以“驱散到其中的万国”替换“赶散到的万国”，更自然、明确地表达原文的地点关系。其余措辞、重复的“彻底灭亡”、先知公式和两处脚注锚点均可保留。
