  text: כִּֽי אִתְּ/ךָ֥ אֲנִ֛י נְאֻם יְהוָ֖ה לְ/הֽוֹשִׁיעֶ֑/ךָ כִּי֩ אֶעֱשֶׂ֨ה כָלָ֜ה בְּ/כָֽל הַ/גּוֹיִ֣ם אֲשֶׁ֧ר הֲפִצוֹתִ֣י/ךָ שָּׁ֗ם אַ֤ךְ אֹֽתְ/ךָ֙ לֹֽא אֶעֱשֶׂ֣ה כָלָ֔ה וְ/יִסַּרְתִּ֨י/ךָ֙ לַ/מִּשְׁפָּ֔ט וְ/נַקֵּ֖ה לֹ֥א אֲנַקֶּֽ/ךָּ־־־׀־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/030/011.yaml
  text: For I am with you—oracle of Yahweh—to save you[a]. For I will make a full end of all the nations where I have scattered you, but of you I will not make a full end. I will discipline you with justice[b], and I will by no means leave you unpunished.
translation:
  language: zh_hans
  text: 因为我与你同在，要拯救你——这是耶和华的宣告[a]。我必使我把你驱散到其中的万国都彻底灭亡，却不使你彻底灭亡。我必按公正管教你，绝不让你免受惩罚[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “这是耶和华的宣告”也可译作“耶和华说”。希伯来语 נְאֻם יְהוָה 是先知书中表示神圣宣告的固定用语。
    reason: lexical_alternative
  - marker: b
    text: 或译：“我绝不宣告你无罪。”希伯来语以同一词根的不定式绝对形加强否定，强调绝不会免除罪责或刑罚。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经中广为人知的神圣名译法，既明确指向四字神名，又保持庄重、自然的经文语体。
- source_word: נְאֻם יְהוָה
  choice: 这是耶和华的宣告
  rationale: נְאֻם 是先知性宣告的固定用语；“宣告”保留其正式权威语气，同时比生硬的“神谕”更易为普通现代读者理解。
- source_word: לְהוֹשִׁיעֶךָ
  choice: 要拯救你
  rationale: ישׁע 的使役式表示施行拯救或解救；“拯救”简洁，并保留从危难中救出的宽广含义。
- source_word: כָלָה
  choice: 彻底灭亡
  rationale: 该词在本节指完全的终结或毁灭；两处使用同一译法，保留原文鲜明的对照和重复。
- source_word: הֲפִצוֹתִיךָ
  choice: 我把你赶散到
  rationale: פוץ 的使役式表示使之分散；“赶散”在被掳语境中自然地表达这是耶和华施行的离散，而“到”也顺畅连接地点关系从句。
- source_word: אַךְ
  choice: 却
  rationale: 此处突出列国与受话者所得待遇的对比；“却”准确传达转折，并使中文句势紧凑。
- source_word: וְיִסַּרְתִּיךָ
  choice: 我必……管教你
  rationale: יסר 表示带有纠正目的的惩戒；“管教”兼具惩罚与纠正的意义，不把它弱化为口头劝导。
- source_word: לַמִּשְׁפָּט
  choice: 按公正
  rationale: מִשְׁפָּט 在这里说明管教有公正的准则与分寸；“按公正”是自然现代中文，也避免仅译作模糊的“审判”。
- source_word: וְנַקֵּה לֹא אֲנַקֶּךָּ
  choice: 绝不让你免受惩罚
  rationale: 原文以不定式绝对形配合限定动词加强否定，字面涉及宣告无罪或免除刑罚；此译法传达强烈否定，并与前句的管教语境衔接。
theological_decisions:
- issue: 末句应采用法庭性的“定不以你为无罪”，还是惩戒性的“绝不让你免受惩罚”
  choice: 正文采用“绝不让你免受惩罚”
  alternative: 我绝不宣告你无罪／我断不以你为无罪
  rationale: 上下文同时宣告同在、拯救、不彻底毁灭以及公正管教。惩戒式措辞在不抹去司法含义的前提下，更直接保留本节的张力：耶和华保存他的子民，却不免除他们应受的惩治。
translation_notes:
  register: 采用庄重而清楚的现代标准普通话。“彻底灭亡”在两处重复，以重现 כָלָה 的修辞对照；保留拯救与管教并置的神学张力。破折号标明插入的先知公式；所有脚注标记均已置于正文。
