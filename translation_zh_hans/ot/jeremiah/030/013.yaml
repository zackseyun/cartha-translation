  yaml_path: translation/ot/jeremiah/030/013.yaml
  text: There is no one to plead your case for your wound[a]; there is no healing for you[b], no remedy.
translation:
  language: zh_hans
  text: 没有人为你的伤处申辩[a]；你得不到医治，也没有良药[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“没有人审理你关于伤处的案件。”希伯来文采用司法用语，既可理解为替人申辩，也可理解为审理案件。
    reason: lexical_alternative
  - marker: b
    text: “良药”所对应的希伯来词较罕见，也可理解为“绷带”或伤口长出的“新肉”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵין דָּן דִּינֵךְ
  choice: 没有人为……申辩
  rationale: דָּן与דִּינֵךְ构成司法语境，可指审理案件，也可指为案件申辩。正文采用自然的法律表达“申辩”，并以脚注保留“审理”的可能。
- source_word: לְמָזוֹר
  choice: 为你的创伤
  rationale: מָזוֹר指创伤、伤处；介词לְ在这里可表达“关于、针对”。“创伤”既符合上下文的伤病意象，也能自然连接司法比喻。
- source_word: רְפֻאוֹת
  choice: 医治你的良方
  rationale: 该词形式为复数，可集合性地表示治疗、疗法或医治之物。结合后面的罕见医学用语，译作“医治你的良方”既自然，也避免生硬复数。
- source_word: תְּעָלָה
  choice: 使伤口愈合的药
  rationale: 此罕见词可能指绷带、伤口长出的新肉，或促使伤口愈合的治疗之物。正文用功能性表达保留医疗意象，脚注列出较具体的词义可能。
- source_word: אֵין לָךְ
  choice: 没有……你的……
  rationale: 存在否定结构表示对受话者而言某物不存在。中文改用领属兼受益关系的自然句式，表达“你得不到、你没有”。
