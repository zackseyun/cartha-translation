  text: And you will be my people[a], and I will be your God.
translation:
  language: zh_hans
  text: 你们要作我的子民[a]，我要作你们的上帝。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语较直译为：“你们要作归我的子民；我要作归你们的上帝。”这是表达彼此相属的盟约用语。
    reason: lexical_alternative
lexical_decisions:
- source_word: וִהְיִיתֶם
  choice: 你们要作
  rationale: 这是动词 היה 的形式，带连接词，在此经典盟约表达中具有将来指向。“要作”既符合现代汉语，也保留预告性的语气。
- source_word: לִי לְעָם
  choice: 我的子民
  rationale: 希伯来语较直译为“对我成为子民”。在盟约公式中，现代汉语自然地用领属结构表达为“我的子民”；“子民”比单用“人民”更能体现群体与其所属者之间的关系。
- source_word: וְאָנֹכִי
  choice: 我
  rationale: 独立代词 אָנֹכִי 带有一定强调；汉语借助前后对称结构即可自然体现，不另加“至于我”，以免语气过重。连接词在汉语并列句中可自然省略。
- source_word: אֶהְיֶה
  choice: 我要作
  rationale: 未完成式在此表达将来意义。“我要作”与前句“你们要作”形成对应，并保留原文的动词结构。
- source_word: לָכֶם לֵאלֹהִים
  choice: 你们的上帝
  rationale: 希伯来语较直译为“对你们成为上帝”。在盟约公式中用汉语领属结构表达最自然；上下文所指是以色列的上帝，并非泛指某一位神。
theological_decisions:
- issue: 盟约公式的译法
  choice: 你们要作我的子民，我要作你们的上帝。
  alternative: 你们要对我成为子民，我要对你们成为上帝。
  rationale: 采用自然的现代汉语领属表达，同时保留双方相属的对称关系和将来指向；不在经文中额外解释盟约的性质或范围。
translation_notes:
  register: 语言简明、庄重而现代。采用“子民”表达盟约群体的归属关系，以“上帝”对应 אֱלֹהִים；两句保持紧凑、平衡的结构。
