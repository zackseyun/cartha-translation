base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/046/002.yaml
  text: 'Concerning Egypt: concerning the army of Pharaoh Neco king of Egypt[a], which was by the Euphrates River at Carchemish, which Nebuchadnezzar king of Babylon struck down in the fourth year of Jehoiakim son of Josiah[b], king of Judah.'
translation:
  language: zh_hans
  text: 论到埃及[a]：论到埃及王法老尼哥的军队；这军队当时在幼发拉底河边的迦基米施，巴比伦王尼布甲尼撒[b]在犹大王约西亚的儿子约雅敬第四年击败了它。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 标题中的希伯来语也可译作“攻击埃及”；这里译作“论到埃及”，因为本节是引出神谕主题的题署。
    reason: alternative_reading
  - marker: b
    text: 这里的希伯来文名字形式更接近“尼布甲尼利撒”；正文采用中文圣经中惯用的“尼布甲尼撒”。
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמִצְרַיִם
  choice: 论到埃及
  rationale: לְ在先知书的标题中可引出神谕所涉及的对象；“论到”自然体现主题标题的功能，也不把可能的敌对含义说得过满。
- source_word: עַל חֵיל
  choice: 论到……的军队
  rationale: עַל在这里引出更具体的主题，חֵיל在语境中指军事力量；译作“军队”清楚自然。
- source_word: פַּרְעֹה נְכוֹ
  choice: 法老尼哥
  rationale: 采用现代中文圣经读者较熟悉且贴近希伯来语读音的专名形式。
- source_word: אֲשֶׁר הָיָה עַל נְהַר פְּרָת
  choice: 这支军队驻扎在幼发拉底河边
  rationale: 关系代词的先行词是“军队”；היה配合地点短语表示军队当时所在，中文用“驻扎”符合军事语境，而“河边”准确传达עַל的地点意义。
- source_word: בְּכַרְכְּמִשׁ
  choice: 在……迦基米施
  rationale: בְּ标示地点；将城名与幼发拉底河的位置合并表达，符合现代汉语地理表述。
- source_word: הִכָּה
  choice: 击败
  rationale: נכה在军事语境中可指击打、重创或击败；此处述及军队和战役，用“击败”最清楚，同时避免“击杀”可能造成的全军尽灭含义。
- source_word: נְבוּכַדְרֶאצַּר
  choice: 尼布甲尼撒
  rationale: 希伯来语此处的名称形式更接近“尼布甲尼利撒”一类音译，但“尼布甲尼撒”是现代中文圣经传统中广为人知的标准形式；脚注保留原文形式差异。
- source_word: בִּשְׁנַת הָרְבִיעִית לִיהוֹיָקִים
  choice: 在……约雅敬第四年
  rationale: 这是标准的君王纪年公式；中文按“某王第几年”的习惯表达，不必补出原文没有的“登基”。
theological_decisions:
- issue: 标题介词是否表达敌对方向
  choice: 论到埃及
  alternative: 攻击埃及／关于埃及
  rationale: לְ在神谕标题中可表示所论对象，也可能结合语境带有针对意味。本节首先提供历史题署，故正文采用较中性的“论到”，脚注说明“攻击”这一可能译法，以保留原文张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。把连续的希伯来语关系从句拆分为两句，并以“这支军队”和“他们”明确所指，减少中文长句的歧义；保留题署式的“论到……：论到……”。
