source:
  edition: WLC
  text: וּ/נְתַתִּ֗י/ם בְּ/יַד֙ מְבַקְשֵׁ֣י נַפְשָׁ֔/ם וּ/בְ/יַ֛ד נְבֽוּכַדְרֶאצַּ֥ר מֶֽלֶךְ בָּבֶ֖ל וּ/בְ/יַד עֲבָדָ֑י/ו וְ/אַחֲרֵי כֵ֛ן תִּשְׁכֹּ֥ן כִּֽ/ימֵי קֶ֖דֶם נְאֻם יְהוָֽה־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/046/026.yaml
  text: And I will give them into the hand of those who seek their life[a], and into the hand of Nebuchadnezzar king of Babylon, and into the hand of his servants. But afterward she will dwell as in days of old[b], declares Yahweh.
translation:
  language: zh_hans
  text: 我必把他们交在那些寻索他们性命的人手中[a]，交在巴比伦王尼布甲尼撒[b]手中，也交在他臣仆手中。此后，埃及必像往昔一样安居。这是雅威的宣告。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“寻索他们性命的人”，意思也可译作“那些想杀他们的人”。
    reason: 说明希伯来习语的字面形式及其语境含义。
  - marker: b
    text: 原文此处的名字拼写更接近“尼布甲德列撒”；正文采用通行译名“尼布甲尼撒”。
    reason: 保留希伯来文本中的专名拼写差异，同时维持中文通行称呼。
lexical_decisions:
- source_word: וּנְתַתִּים בְּיַד
  choice: 我必把他们交在……手中
  rationale: נתן与“手中”这一介词短语连用，表示把人交由对方掌控；保留“手中”的希伯来意象，同时用“交在”自然表达敌意语境。
- source_word: מְבַקְשֵׁי נַפְשָׁם
  choice: 那些寻索他们性命的人
  rationale: 贴近原文“寻索他们的性命”，保留该习语的形象及语义张力；其语境含有追杀、取命之意，另以脚注说明。
- source_word: נְבוּכַדְרֶאצַּר
  choice: 尼布甲尼撒
  rationale: 采用现代中文读者熟悉的传统译名；原文此处的拼写差异以脚注保留。
- source_word: עֲבָדָיו
  choice: 他的臣仆
  rationale: 此处指巴比伦王属下的人。“臣仆”既符合君王语境，又不把其身份过度限定为奴隶或官员。
- source_word: וְאַחֲרֵי כֵן
  choice: 此后
  rationale: 准确表达审判之后的时间转折；上下文已足以显出从审判到恢复的对比，无须额外增添转折词。
- source_word: תִּשְׁכֹּן
  choice: 埃及必……安居
  rationale: 阴性单数动词回指埃及。现代汉语不以动词标示语法性别，明说“埃及”可清楚保留所指；“安居”自然表达居住、安顿的含义。
- source_word: כִּימֵי קֶדֶם
  choice: 像往昔一样
  rationale: 表达恢复到从前景况的意思，并保留时间上的回顾色彩。
- source_word: נְאֻם יְהוָה
  choice: 这是雅威的宣告
  rationale: 以庄重而自然的现代汉语呈现先知性宣告公式，并直接音译神名יהוה。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名；“雅威”较直接地呈现其专名性质，不以称号“主”替代。
- issue: 埃及在תִּשְׁכֹּן中的阴性指称
  choice: 埃及必……安居
  alternative: 她必……安居；它必……有人居住
  rationale: 希伯来文阴性单数形式回指埃及。汉语没有相应的动词性别变化，重复“埃及”既明确所指，也避免用“她”造成不自然或把“安居”改成被动式所带来的解释性扩展。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“交在……手中”保留原文意象；“寻索他们性命”略具经文语体，但在脚注中说明实际含义。末句采用“这是雅威的宣告”，保持先知宣告公式的分量。
