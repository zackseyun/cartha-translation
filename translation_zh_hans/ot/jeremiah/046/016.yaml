revisions:
- from: 他使许多人绊跌；他们甚至彼此撞倒。于是他们说：“起来吧！让我们回到自己的同胞那里，回到自己的故乡，躲避那残暴的刀剑[a]。”
  to: 他使许多人绊跌；甚至一个人跌在另一个人身上。他们说：“起来吧，让我们回到我们本族那里，回到我们出生之地，躲避那欺压者的刀剑[a]。”
  rationale: 修订恢复了“一个人跌在另一个人身上”的分配性战场图像，并将末句恢复为“欺压者的刀剑”的人物属格关系，同时以脚注保留“鸽子”的字面异读。其余措辞维持现代标准汉语的清楚庄重风格。
