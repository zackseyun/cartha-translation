    issue: “他们甚至彼此撞倒”未准确呈现נָפַל אִישׁ אֶל־רֵעֵהוּ。
    rationale: 原文是分配性的“一个人跌在其同伴身上”，描述溃乱中相继跌倒；“彼此撞倒”则容易理解为双方互相使对方倒下。
  - severity: medium
    issue: “那残暴的刀剑”未保留“欺压者的刀剑”的关系。
    rationale: 按上下文通常理解，הַיּוֹנָה指欺压者／施暴者，构成“欺压者的刀剑”；译为“残暴的”将人物指称和属格关系转换成刀剑的属性。
  - severity: low
    issue: 引语中“自己的同胞”“自己的故乡”改用了叙述性反身表述。
    rationale: 虽然汉语可通，但直接引语使用“我们本族”“我们出生之地”更自然地保留第一人称复数后缀。
