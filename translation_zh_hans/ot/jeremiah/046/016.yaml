source:
  edition: WLC
  text: הִרְבָּ֖ה כּוֹשֵׁ֑ל גַּם נָפַ֞ל אִ֣ישׁ אֶל רֵעֵ֗/הוּ וַ/יֹּֽאמְרוּ֙ ק֣וּמָ/ה וְ/נָשֻׁ֣בָה אֶל עַמֵּ֗/נוּ וְ/אֶל אֶ֨רֶץ֙ מֽוֹלַדְתֵּ֔/נוּ מִ/פְּנֵ֖י חֶ֥רֶב הַ/יּוֹנָֽה־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/046/016.yaml
  text: He has multiplied the stumbling; indeed[a], each man falls against his companion, and they say, “Come, and let us return to our people and to the land of our birth, away from the sword of the oppressor.”
translation:
  language: zh_hans
  text: 他使许多人绊跌；甚至一个人跌在另一个人身上。他们说：“起来吧，让我们回到我们本族那里，回到我们出生之地，躲避那欺压者的刀剑[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “欺压者的刀剑”或译“鸽子的刀剑”。这里的希伯来语可按同形词字面读作“鸽子”；但按上下文通常理解为“欺压者”或“施暴者”。
    reason: 保留הַיּוֹנָה的词汇歧义及其字面异读。
lexical_decisions:
- source_word: הִרְבָּה כּוֹשֵׁל
  choice: 他使许多人绊跌
  rationale: הִרְבָּה是使役形，结合上文以耶和华为隐含主语；כּוֹשֵׁל是单数分词，却可作集合性表达。译为“使许多人绊跌”既传达使役关系，也符合现代汉语。
- source_word: גַּם נָפַל אִישׁ אֶל רֵעֵהוּ
  choice: 他们甚至彼此撞倒
  rationale: גַּם在此有加强语气的作用；אִישׁ אֶל־רֵעֵהוּ表达一个人倒向同伴、众人相互碰撞倒下的混乱场面。“彼此撞倒”自然凝练，并保留战败溃乱的图景。
- source_word: קוּמָה וְנָשֻׁבָה
  choice: 起来吧！让我们回到
  rationale: קוּמָה在共同劝勉中可译为“起来吧”；וְנָשֻׁבָה是意愿式，译为“让我们回到”，保留共同决意撤离的语气。
- source_word: עַמֵּנוּ
  choice: 自己的同胞
  rationale: עַם在这里指这些外族军士所属的族群。“自己的同胞”比“我们的人民”更符合现代汉语中返回本族人那里的语境。
- source_word: אֶרֶץ מוֹלַדְתֵּנוּ
  choice: 自己的故乡
  rationale: 该短语直指出生之地或本国。“故乡”简明自然，涵盖出生地和本土的含义。
- source_word: מִפְּנֵי חֶרֶב הַיּוֹנָה
  choice: 躲避那残暴的刀剑
  rationale: מִפְּנֵי在逃亡语境中表示从威胁面前离开；הַיּוֹנָה可联系“欺压、施暴”之义，并以阴性形式修饰חֶרֶב。译文保留具体的“刀剑”意象，以“残暴的”传达其施暴、压迫的性质。
theological_decisions:
- issue: 末句הַיּוֹנָה的解释
  choice: 残暴的
  alternative: 鸽子的
  rationale: 按“欺压、施暴”的词义理解，与战争、溃败和逃亡的上下文连贯；同形词也可按字面理解为“鸽子”，但在这里语意晦涩，因此收入脚注，不在正文中消除这一文本歧义。
- issue: הִרְבָּה的隐含主语
  choice: 他（承接上文所说的耶和华）
  alternative: 非人称表达“许多人绊跌”
  rationale: 使役动词的单数阳性主语可自然承接上一节使敌军倒下的耶和华；正文只用“他”，既维持上下文衔接，也不额外重复神名。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“彼此撞倒”重现军阵崩溃的动态场景；“同胞”“故乡”使外族兵士相约返乡的意思易于普通读者理解。脚注标记置于产生歧义的末句词组之后。
