revisions:
- from: 那日属于主耶和华——万军之上帝；那是报仇的日子，他要向敌人报仇。刀剑必吞吃，直到饱足；必饱饮他们的血。因为在北方之地、幼发拉底河边，主耶和华——万军之上帝有一场献祭[a]。
  to: 那日属于主万军之耶和华；这是报仇的日子，他要向仇敌报仇。刀剑必吞吃，得饱足，又饱饮他们的血；因为主万军之耶和华在北方之地、幼发拉底河边有一场献祭[a]。
  rationale: 修订复合神名，使“万军”正确关联“耶和华”，并采用中文中清晰、庄重且通行的“主万军之耶和华”。同时把刀剑的三个动作译为并列关系，避免“直到”所额外引入的时间含义。其余报仇、饮血、献祭和地理意象均予保留；脚注继续保留名词句的句法歧义。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T07:29:22Z'
review_pass:
  verdict: revise
  source_fidelity: 译文总体保留了原文的报复、刀剑拟人化、饮血和献祭意象，也正确将地点置于幼发拉底河边。不过“万军之上帝”把复合神名中的“耶和华”与“万军”之间的修饰关系处理得不够准确；原文是“主／耶和华／万军”的复合称号，而非在“主耶和华”之后另加“万军之上帝”。“直到饱足”也轻微加入了原文未明说的时间终点关系。
  naturalness: “主耶和华——万军之上帝”在现代汉语中结构生硬，且“主”与“上帝”的层级关系不清。改为“主万军之耶和华”更符合汉语圣经称号的固定且可理解的表达。“刀剑必吞吃，得饱足，又饱饮他们的血”能更顺畅地呈现三个并列动词。
  terminology: 采用“主万军之耶和华”准确表达אֲדֹנָי יְהוָה צְבָאוֹת，并保留“耶和华”作为神名、“万军”作为军事性的称号。“献祭”可保留，且脚注恰当说明希伯来语名词句可按存在式理解。
