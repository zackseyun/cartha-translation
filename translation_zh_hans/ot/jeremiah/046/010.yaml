  text: וְֽ/הַ/יּ֨וֹם הַ/ה֜וּא לַ/אדֹנָ֧/י יְהוִ֣ה צְבָא֗וֹת י֤וֹם נְקָמָה֙ לְ/הִנָּקֵ֣ם מִ/צָּרָ֔י/ו וְ/אָכְלָ֥ה חֶ֨רֶב֙ וְ/שָׂ֣בְעָ֔ה וְ/רָוְתָ֖ה מִ/דָּמָ֑/ם כִּ֣י זֶ֠בַח לַ/אדֹנָ֨/י יְהוִ֧ה צְבָא֛וֹת בְּ/אֶ֥רֶץ צָפ֖וֹן אֶל נְהַר פְּרָֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/046/010.yaml
  text: That day belongs to the Lord GOD of Armies[a], a day of vengeance, to avenge himself on his foes. The sword will devour and be satisfied and drink its fill of their blood, for the Lord GOD of Armies has a sacrifice in the land of the north[b], by the Euphrates River.
translation:
  language: zh_hans
  text: 那日属于主万军之耶和华；这是报仇的日子，他要向仇敌报仇。刀剑必吞吃，得饱足，又饱饮他们的血；因为主万军之耶和华在北方之地、幼发拉底河边有一场献祭[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因为在北方之地、幼发拉底河边，有一场献给主万军之耶和华的献祭。”希伯来语也可理解为存在句。
    reason: 保留希伯来语名词句在归属式与存在式之间的真实歧义。
lexical_decisions:
- source_word: וְהַיּוֹם הַהוּא
  choice: 那日
  rationale: 保留指示和时间意义；句首连接词在中文中可自然省略。
- source_word: לַאדֹנָי יְהוִה צְבָאוֹת
  choice: 属于主耶和华——万军之上帝
  rationale: 介词 ל 表明归属或关联；将复合神名与称号完整表达，并用破折号帮助现代读者辨明结构。
- source_word: יוֹם נְקָמָה לְהִנָּקֵם מִצָּרָיו
  choice: 报仇的日子，他要向敌人报仇
  rationale: 保留原文“报仇”的重复和司法性、敌对性张力，不弱化为泛泛的惩罚。
- source_word: וְאָכְלָה חֶרֶב וְשָׂבְעָה וְרָוְתָה מִדָּמָם
  choice: 刀剑必吞吃，直到饱足；必饱饮他们的血
  rationale: 保留刀剑被人格化为吞吃、饮血并得饱足的强烈意象。
- source_word: כִּי זֶבַח לַאדֹנָי
  choice: 因为……主……有一场献祭
  rationale: 将 לַאדֹנָי 理解为归属关系，采用自然中文“有一场献祭”；另以脚注保存存在句的可能。
- source_word: בְּאֶרֶץ צָפוֹן אֶל נְהַר פְּרָת
  choice: 在北方之地、幼发拉底河边
  rationale: “北方之地”保留地理称谓；אֶל 在此按临近地点表达为“河边”。
theological_decisions:
- issue: 复合称号 אֲדֹנָי יְהוִה צְבָאוֹת 的译法
  choice: 主耶和华——万军之上帝
  alternative: 主耶和华——万军之主；主雅威——万军之上帝
  rationale: “耶和华”直接标明神名，避免把专名消解为普通称谓；“万军之上帝”透明呈现 צְבָאוֹת 的军事含义，又与审判战争的语境相合。
- issue: 献祭意象的施事与归属
  choice: 主……有一场献祭
  alternative: 有一场献给主……的献祭
  rationale: 希伯来语名词句容许归属式和存在式两种理解；正文采用较自然的归属表达，脚注保存另一种句法可能，不把献祭意象解释成特定教义。
translation_notes:
  register: 采用庄重而现代的标准普通话。“刀剑必吞吃”“饱饮他们的血”保留先知诗歌的拟人和献祭性屠杀意象；避免古奥虚词过多，同时以“那日”“之地”等维持经文体的凝练感。
