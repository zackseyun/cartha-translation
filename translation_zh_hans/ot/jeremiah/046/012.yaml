base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/046/012.yaml
  text: The nations have heard of your shame[a], and your cry has filled the earth; for warrior has stumbled against warrior; together both of them have fallen.
translation:
  language: zh_hans
  text: 列国听见了你的羞辱；你的哀号传遍了大地[a]，因为勇士撞上勇士而踉跄，二人一同倒下。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “大地”或译“这地”。希伯来语אֶרֶץ可指“大地”或“这地”；因上文提到“列国”，正文采用“大地”。
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמְעוּ גוֹיִם
  choice: 列国听见了
  rationale: שָׁמְעוּ为完成式，表明消息已经传开；גוֹיִם在预言语境中自然译作“列国”。
- source_word: קְלוֹנֵךְ
  choice: 你的羞辱
  rationale: קָלוֹן指公开的羞耻、耻辱；“羞辱”在现代汉语中兼顾蒙羞及受辱的含义。第二人称阴性单数所指为埃及，中文无需标示性别。
- source_word: וְצִוְחָתֵךְ
  choice: 你的哀号
  rationale: צְוָחָה是困苦中的呼喊；“哀号”符合战败溃乱的语境，又不把声音具体化为单纯的尖叫。
- source_word: מָלְאָה הָאָרֶץ
  choice: 传遍了大地
  rationale: 原文直译为“充满了大地”；中文用“传遍”与声音、哀号搭配更自然，同时保留其广泛传播之意。אֶרֶץ也可指“这地”，故加脚注保留歧义。
- source_word: כִּי
  choice: ；
  rationale: כִּי在此引出造成哀号遍地的原因。中文以分号连接，因果关系由上下文自然呈现，避免使用略显解释性的连接词。
- source_word: גִבּוֹר בְּגִבּוֹר כָּשָׁלוּ
  choice: 勇士彼此绊倒
  rationale: גִבּוֹר在军事语境中是“勇士”；בְּ表示相互碰撞或牵连，כָּשַׁל为绊倒、踉跄。“彼此绊倒”简洁呈现溃败中互相冲撞的画面，并与下句“倒下”区分。
- source_word: יַחְדָּיו נָפְלוּ שְׁנֵיהֶם
  choice: 二人一同倒下
  rationale: שְׁנֵיהֶם明确指“两者/二人”，יַחְדָּיו强调同时、共同；此译保留两名勇士双双倒下的强调。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。保留预言诗歌的紧凑节奏，并以“绊倒／倒下”对应两个不同的希伯来语动词，避免合并其意象。
