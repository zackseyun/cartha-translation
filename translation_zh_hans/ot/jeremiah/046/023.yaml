source:
  edition: WLC
  text: כָּרְת֤וּ יַעְרָ/הּ֙ נְאֻם יְהוָ֔ה כִּ֖י לֹ֣א יֵֽחָקֵ֑ר כִּ֤י רַבּוּ֙ מֵֽ/אַרְבֶּ֔ה וְ/אֵ֥ין לָ/הֶ֖ם מִסְפָּֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/046/023.yaml
  text: They have cut down her forest[a], declares Yahweh, though it cannot be searched out, because they are more numerous than locusts, and they are without number.
translation:
  language: zh_hans
  text: 他们要砍伐她的森林[a]——这是雅威的宣告——尽管这森林无法探察；因为他们比蝗虫还多，数也数不清。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因为这森林无法探察。”希伯来语连词可表示原因（“因为”），也可表示让步（“尽管”）；正文依上下文采用让步义。
    reason: 词义及句法关系存在两种可能
lexical_decisions:
- source_word: כָּרְתוּ
  choice: 砍伐了
  rationale: כרת的Qal完成式第三人称复数，在此描写入侵者对埃及所采取的行动；“砍伐了”自然地对应砍倒林木的意象，并保留完成式语感。
- source_word: יַעְרָהּ
  choice: 她的森林
  rationale: יַעַר意为“森林、林地”；阴性单数后缀指向上下文中被拟人化为女性的埃及，因此保留“她”及森林的比喻。
- source_word: נְאֻם יְהוָה
  choice: 雅威宣告
  rationale: 保留庄重的先知宣告公式，并将神名יהוה音译为“雅威”。
- source_word: כִּי לֹא יֵחָקֵר
  choice: 尽管那森林无法探察
  rationale: חקר的Niphal未完成式表达“无法被查究、探察”；此处可指森林广大或稠密到难以探明。正文将כִּי按让步关系处理，同时以脚注保留原因关系的可能。
- source_word: רַבּוּ מֵאַרְבֶּה
  choice: 他们比蝗虫还多
  rationale: רבו在这里强调敌军数量庞大，מִן引出与蝗虫的比较；“比蝗虫还多”清楚保留成群且具有破坏性的意象。
- source_word: וְאֵין לָהֶם מִסְפָּר
  choice: 数也数不清
  rationale: 原文直译为“他们没有数目”，即无法计数；此译法符合现代汉语，同时保留不可胜数之意。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；正文采用较贴近יהוה通常学术重构读音的“雅威”，以神名而非称号来表达。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“她”保留埃及的女性拟人化；破折号凸显先知宣告公式。
