revisions:
- from: 她境内的雇佣兵也像肥育的牛犊；可是，连他们也转身一同逃跑，没有站住。因为他们遭灾的日子已经临到，受惩罚[a]的时候已经来到。
  to: 她境内的雇佣兵也像栏里育肥的牛犊；因为连他们也都转身逃跑，没有站住，因为他们遭灾的日子已经临到，受惩罚[a]的时候已经来到。
  rationale: 删去无原文依据的转折词“可是”，以“因为连他们也”对应כִּי גַם的说明和强调。将“肥育的牛犊”修为“栏里育肥的牛犊”，更完整表达圈养／槽饲的原文意象。其余句意、审判语气和脚注的词义歧义均予保留。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T07:29:27Z'
