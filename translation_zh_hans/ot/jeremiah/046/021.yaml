  terminology: “雇佣兵”“灾祸”“惩罚”均符合本段军事审判语境。“惩罚的时候”对应פְּקֻדָּתָם的上下文主导义；脚注保留“追讨”和“察访”的可行语义替代，且锚点位置正确。
