  text: גַּם שְׂכִרֶ֤י/הָ בְ/קִרְבָּ/הּ֙ כְּ/עֶגְלֵ֣י מַרְבֵּ֔ק כִּֽי גַם הֵ֧מָּה הִפְנ֛וּ נָ֥סוּ יַחְדָּ֖יו לֹ֣א עָמָ֑דוּ כִּ֣י י֥וֹם אֵידָ֛/ם בָּ֥א עֲלֵי/הֶ֖ם עֵ֥ת פְּקֻדָּתָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/046/021.yaml
  text: Even her hired soldiers in her midst are like fattened calves; for even they have turned and fled together; they did not stand[a], for the day of their disaster has come upon them, the time of their punishment.
translation:
  language: zh_hans
  text: 她境内的雇佣兵也像栏里育肥的牛犊；因为连他们也都转身逃跑，没有站住，因为他们遭灾的日子已经临到，受惩罚[a]的时候已经来到。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“被追讨的时候”；或“被察访的时候”。
    reason: 保留פְּקֻדָּה在审判语境中除“惩罚”以外的词义可能。
lexical_decisions:
- source_word: שְׂכִרֶיהָ
  choice: 她境内的雇佣兵
  rationale: שָׂכִיר本指受雇的人；在针对埃及的军事预言中，所指是受雇作战的军人。“雇佣兵”既明确军事身份，也符合现代汉语习惯。
- source_word: בְקִרְבָּהּ
  choice: 境内
  rationale: 原义为“在她中间、在她里面”，这里指驻在埃及内部。译作“境内”自然简洁，并保留空间含义。
- source_word: כְּעֶגְלֵי מַרְבֵּק
  choice: 像肥育的牛犊
  rationale: מַרְבֵּק涉及圈养、槽饲以育肥的牲畜。“肥育的牛犊”保留这些雇佣兵养尊处优、看似强壮却容易成为宰杀对象的形象，同时不把后一个含义明说出来。
- source_word: הִפְנוּ נָסוּ יַחְדָּו
  choice: 转身一同逃跑
  rationale: 按希伯来文动词次序表达“转身”继而“逃跑”，יַחְדָּו译为“一同”。
- source_word: לֹא עָמָדוּ
  choice: 没有站住
  rationale: 原文直陈“没有站立”。“没有站住”在汉语中既自然，也保留军事上未能坚守的意象，而不加强为“不能抵挡”。
- source_word: יוֹם אֵידָם
  choice: 他们遭灾的日子
  rationale: אֵיד表示灾祸、灾难。“遭灾的日子”符合先知审判语境，也比抽象的“灾难之日”更自然地表达灾祸临到他们。
- source_word: עֵת פְּקֻדָּתָם
  choice: 受惩罚的时候
  rationale: פְּקֻדָּה可指察访、追讨或惩罚；与前句“遭灾的日子”平行时，惩罚义最合语境。脚注保留其他可能译法。
theological_decisions:
- issue: 审判预言中פְּקֻדָּה的译法
  choice: 受惩罚的时候
  alternative: 被追讨的时候；被察访的时候
  rationale: 上下文描述败逃和灾祸临到，因此采用惩罚义；但该词本身具有“察访、追讨”的语义范围，故不将其他可能性静默排除，而列入脚注。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“可是，连他们也”传达כִּי גַם在此处带出的强调和反差；以“她”承接上下文中人格化的埃及。句式兼顾希伯来文的平行结构与现代汉语可读性。
