base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/046/022.yaml
  text: Her sound goes like a serpent[a], for they go with an army and come against her with axes[c][b], like woodcutters.
translation:
  language: zh_hans
  text: 她的声响像蛇一样传去[a]，因为他们带着军队前来[b]，手拿斧头向她而来[c]，如同伐木的人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“她的声音像蛇一样传去”。希伯来语 קוֹל 可指“声音”“嗓音”或“声响”。
    reason: lexical_alternative
  - marker: b
    text: 或译“因为他们以军力前来”或“因为他们以强大的力量前来”。希伯来语 חַיִל 可指力量、军力或军队。
    reason: lexical_alternative
  - marker: c
    text: 字面意思是“来到她那里”或“向她而来”；在这里的军事语境中，可理解为来攻她。
    reason: lexical_alternative
lexical_decisions:
- source_word: קוֹלָהּ
  choice: 她的声响
  rationale: קוֹל 可指声音、嗓音或声响。这里的埃及被拟人化为女性，重点在听觉形象，并非明确的话语，因此译作“她的声响”。
- source_word: כַּנָּחָשׁ
  choice: 像蛇一般
  rationale: נָחָשׁ 指蛇；“像蛇一般”自然、庄重，又不额外限定蛇发出的具体声音或动作。
- source_word: יֵלֵךְ
  choice: 传去
  rationale: הלך 的基本义是“走、去”。因主语是“声响”，汉语用“传去”较自然，同时尽量保留声音移动的希伯来语意象，避免增译为“滑走”或“嘶叫”。
- source_word: כִּי
  choice: 因为
  rationale: כִּי 在此引出原因或解释，“因为”清楚保留上下句的因果关系。
- source_word: בְחַיִל
  choice: 大举
  rationale: חַיִל 可指力量、军力或军队。结合入侵者持斧而来的语境，“敌军大举而来”既体现军事含义，也保留“以强大力量而来”的可能色彩。
- source_word: יֵלֵכוּ
  choice: 而来
  rationale: הלך 的基本义为“去、行进”；按汉语叙述视角和敌军逼近埃及的语境，译作“而来”自然，未强化为特定步态。
- source_word: וּבְקַרְדֻּמּוֹת
  choice: 拿着斧头
  rationale: קַרְדֹּם 指斧头，复数表示入侵者所用的器具；“拿着斧头”符合现代汉语表达。
- source_word: בָּאוּ לָהּ
  choice: 攻击她
  rationale: 字面是“来到她那里／向她而来”，但军事语境明确带有敌对意味；译作“攻击她”使隐含的敌意在汉语中清楚呈现，并以脚注保留字面形式。
- source_word: כְּחֹטְבֵי עֵצִים
  choice: 好像伐木的人
  rationale: 该短语直指砍伐木头或树木的人。“伐木的人”是自然的现代汉语，也保留先知把军队比作砍树者的形象。
