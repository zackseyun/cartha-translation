base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/046/006.yaml
  text: Let not the swift flee[a], and let not the mighty man escape; in the north, by the bank of the Euphrates River[c][b], they have stumbled and fallen.
translation:
  language: zh_hans
  text: 跑得快的不可逃走，勇士[c]也不可脱身；在北方[a]，在幼发拉底河边[b]，他们踉跄仆倒。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“向北”或“往北方”。希伯来语 צָפוֹנָה 既可按地点理解，也可按方向理解。
    reason: lexical_alternative
  - marker: b
    text: 直译“在幼发拉底河的手边”；这是希伯来语习语，意思是“在河旁”或“沿着河岸”。
    reason: lexical_alternative
  - marker: c
    text: “勇士”或译“勇猛的人”。希伯来语 גִּבּוֹר 常指强壮、英勇的战士。
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל יָנוּס
  choice: 不可逃走
  rationale: אַל与未完成式连用，表达禁止或否定祈使的语气；“不可”保留先知诗歌庄重、第三人称的表达，避免改成直接对听者说“不要”.
- source_word: הַקַּל
  choice: 跑得快的
  rationale: קַל本义为“轻快、迅速”，此处指行动敏捷、善于奔逃的人；“跑得快的”比生硬的“迅捷者”更易为现代读者理解。
- source_word: יִמָּלֵט
  choice: 脱身
  rationale: מלט的Nifal词形在战败语境中表示逃脱、获救；“脱身”与前句“逃走”形成自然变化，同时保留无法逃离战场的意思。
- source_word: הַגִּבּוֹר
  choice: 勇士
  rationale: גִּבּוֹר可指强壮、有勇力的人，且在本节军事语境中通常指善战的勇士。
- source_word: צָפוֹנָה
  choice: 在北方
  rationale: 该词带方向词尾，可表示“向北”或“在北方”；结合随后幼发拉底河的地理说明，正文采用自然的地点表达，同时以脚注保留方向性理解。
- source_word: עַל יַד
  choice: 河边
  rationale: 该习语字面为“在……之手旁”，用于地点时意为“在旁边、沿着一侧”；与河流连用时译作“河边”自然准确。
- source_word: נְהַר פְּרָת
  choice: 幼发拉底河
  rationale: 按现代汉语通行地名表达，译为“幼发拉底河”。
- source_word: כָּשְׁלוּ וְנָפָלוּ
  choice: 绊倒跌落
  rationale: 两个完成式紧密相连，生动报告战败结果；“绊倒跌落”保留先失足、继而倒下的简洁诗性次序。
