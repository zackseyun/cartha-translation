  language: zh_hans
  text: 这是谁，像尼罗河[a]涨起；它的水像江河一样翻腾？[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语“耶奥尔”（יְאֹר）也可指“河流”；在这篇论埃及的预言中，很可能特指尼罗河。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“怒吼”或“翻涌”。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי זֶה
  choice: 这是谁
  rationale: 保留希伯来语疑问词与指示词构成的生动反问，现代汉语自然表达为“这是谁”。
- source_word: כַּיְאֹר
  choice: 像尼罗河一样
  rationale: יְאֹר 可泛指河流，但在这篇论埃及的预言中最自然地特指尼罗河；明译“尼罗河”呈现语境中的埃及意象。
- source_word: יַעֲלֶה
  choice: 涨起
  rationale: עלה 表示上升；用于尼罗河水势时，“涨起”既保留向上升高的画面，也符合现代汉语搭配。
- source_word: כַּנְּהָרוֹת
  choice: 像江河一样
  rationale: 保留 נְהָרוֹת 的复数、宽阔水流意象；汉语“江河”可自然表达泛指复数。
- source_word: יִתְגָּעֲשׁוּ
  choice: 水势汹涌
  rationale: 该词的 Hitpael 形态描写翻腾、涌动的状态；“汹涌”突出动荡奔涌，同时不把意义限于声响。
- source_word: מֵימָיו
  choice: 水势
  rationale: 字面为“它的水”。结合前面的江河意象译作“水势”，能自然传达水体翻涌；所属关系由句法和意象承接体现。
