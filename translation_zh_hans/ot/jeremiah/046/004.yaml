base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/046/004.yaml
  text: Harness the horses[a]; mount up, you horsemen; take your stand with helmets on. Polish the spears[b]; put on the armor.
translation:
  language: zh_hans
  text: 给战马套上挽具；骑兵啊，上马！戴着头盔列阵。擦亮长矛，穿上铠甲[a]！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “铠甲”原文指护身的甲胄，可能是锁子甲或护胸甲等，具体形制不确定。
    reason: lexical_alternative
lexical_decisions:
- source_word: אִסְרוּ הַסּוּסִים
  choice: 套好战马
  rationale: אָסַר本义为“绑、系”，用于战马备战时指给马套上挽具或马具；“套好战马”既保留具体动作，也符合军事语境。
- source_word: וַעֲלוּ הַפָּרָשִׁים
  choice: 骑兵啊，上马
  rationale: עָלָה本义为“上去”，与骑兵连用时自然指上马；用呼语和命令句再现连续号令的语气。
- source_word: וְהִתְיַצְּבוּ בְּכוֹבָעִים
  choice: 戴上头盔，站好阵势
  rationale: התיצב表示站定、就位；“站好阵势”体现军事部署语境。כּוֹבָעִים指头盔等军用护头装备。
- source_word: מִרְקוּ הָרְמָחִים
  choice: 擦亮长矛
  rationale: מרק表示擦磨至光亮；“擦亮”比“磨光”更自然，并保留备战时整治武器的具体动作。רְמָחִים译为常见且明确的“长矛”。
- source_word: לִבְשׁוּ הַסִּרְיֹנֹת
  choice: 穿上铠甲
  rationale: לָבַשׁ是“穿上”；סִרְיוֹן指护身甲胄，但具体形制不确定，“铠甲”准确、自然且不过度具体化。
theological_decisions: []
translation_notes:
  register: 采用简洁有力、连续推进的军事号令语体；用现代普通读者易懂的“上马、头盔、长矛、铠甲”，同时保留原文各复数命令的紧迫感。未沿用英文咨询层中错置于“horses”之后的脚注标记，而按其实际词义将说明附于“铠甲”。
