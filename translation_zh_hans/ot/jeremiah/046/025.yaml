base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/046/025.yaml
  text: 'Yahweh of hosts[a], the God of Israel, says: Behold, I am about to punish Amon of No, and Pharaoh, and Egypt, and her gods, and her kings, and Pharaoh[b], and those who trust in him.'
translation:
  language: zh_hans
  text: 万军之耶和华——以色列的神这样说：“看哪，我要惩罚挪的阿蒙神[a]，也要惩罚法老、埃及、埃及的神明和君王，以及法老和所有倚靠他的人[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “挪”是这座埃及城市的希伯来语名称，一般认为就是底比斯；因此本句也可译作“底比斯的阿蒙神”。
    reason: 文化背景及地名辨识
  - marker: b
    text: 或译：“所有倚靠埃及的人。”若按较宽的上下文理解，原文“他／它”也可能指埃及，而不是法老。
    reason: 代词指代存在另一种可能读法
lexical_decisions:
- source_word: יְהוָה צְבָאוֹת
  choice: 万军之耶和华
  rationale: 采用现代中文圣经语体中通行而庄重的神圣称号；“万军”保留צְבָאוֹת所涵盖的天上与地上众军之广度，不将其缩减为单纯的人间军队。
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: 以色列的神
  rationale: 直接呈现原文的属格结构及身份说明。
- source_word: הִנְנִי
  choice: 看哪，我要
  rationale: “看哪”保留先知宣告的郑重提示功能，“我要”结合语境表达行动即将实施，但不额外规定精确时间。
- source_word: פוֹקֵד
  choice: 惩罚
  rationale: 在审判语境中，פקד指追究罪责并施行刑罚；“惩罚”比直译为“眷顾”或“察看”更准确清楚。
- source_word: אָמֹון מִנֹּא
  choice: 挪城的亚扪神
  rationale: 将אָמֹון理解为埃及神祇亚扪，将נֹא保留为希伯来文中的城名“挪”；“神”字补明其身份，避免普通读者误以为“亚扪”在此是民族或国家。
- source_word: וְעַל
  choice: 也要惩罚／以及
  rationale: 原文反复使用介词引出受审判者；中文以重复谓语和连接词呈现层层累加的语势，同时避免生硬逐词复制。
- source_word: פַּרְעֹה
  choice: 法老
  rationale: 采用这一埃及君王称号的标准现代汉语译名，并保留原文两次出现“法老”的重复。
- source_word: מִצְרַיִם
  choice: 埃及
  rationale: 采用标准地名译法。
- source_word: אֱלֹהֶיהָ וְעַל מְלָכֶיהָ
  choice: 埃及的神明和君王
  rationale: 阴性单数后缀指向埃及；现代汉语不用语法性别，以重复“埃及的”自然、明确地表达所属关系。“神明”用于异教诸神，避免与独一之神的称谓混淆。
- source_word: הַבֹּטְחִים בּוֹ
  choice: 所有倚靠他的人
  rationale: “倚靠”准确表达בטח所含的信赖、以之为保障的意义；“他”依最近的阳性单数先行词“法老”处理。
theological_decisions:
- issue: בּוֹ中阳性单数代词的指代对象
  choice: 译作“倚靠他的人”，以“他”指法老
  alternative: 译作“倚靠埃及的人”或“倚靠它的人”，以埃及为较宽泛的指代对象
  rationale: 最近的先行词是再次出现的阳性单数“法老”，并且代词的阳性形式与之吻合，因此正文采用此读法；但整个段落以埃及为审判对象，故指向埃及的理解仍有语境上的可能性，列入脚注。
- issue: 原文重复提及法老
  choice: 正文保留两次“法老”
  alternative: 将第二次“法老”视为赘述并合并为一次
  rationale: 重复是马所拉文本的真实特征，可能具有强调或重新聚焦的作用；不应在翻译中静默删减或替作者整理句式。
translation_notes:
  register: 采用现代、庄重而易懂的先知宣告语体。“看哪”保留原文的郑重感；破折号清楚标示“以色列的神”是对“万军之耶和华”的同位说明。正文保留受审判对象的累加结构及“法老”的重复，不以流畅为由消除原文的修辞张力。所有脚注标记均置于相关词句之后。
