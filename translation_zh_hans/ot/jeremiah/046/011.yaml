base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/046/011.yaml
  text: Go up to Gilead and get balm[a], virgin daughter of Egypt. In vain you have multiplied remedies[b]; there is no healing for you.
translation:
  language: zh_hans
  text: 埃及的处女啊，上基列去取香膏[b]吧！你虽多用药物[a]，终是徒然；你得不着医治。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 辅音文本中译作“你虽多用”的动词形式，在文本和形态上较难确定；也可理解为“你虽用了许多药物”。但按上下文，无论怎样治疗都徒劳无效，意思是清楚的。
    reason: textual_variant
  - marker: b
    text: 基列以药用香膏闻名。这里的命令带有反讽意味：即使取来最有名的疗伤香膏，埃及仍不能痊愈。
    reason: cultural_note
lexical_decisions:
- source_word: עֲלִי
  choice: 上……去
  rationale: 这是עלה的Qal祈使式阴性单数，与被拟人化为女子的埃及相呼应；“上……去”自然保留方向和命令语气。
- source_word: גִלְעָד
  choice: 基列
  rationale: 按通行译名音译该地名；基列以药用香膏闻名，是本节讽刺意象的背景。
- source_word: וּקְחִי
  choice: 去取
  rationale: לקח的Qal祈使式阴性单数，表示取得或拿取；与前面的“上基列”连用时，“去取”符合现代汉语。
- source_word: צֳרִי
  choice: 香膏
  rationale: 指用于疗治的芳香树脂或香膏。“香膏”既保留具体物质意象，也避免将其直接泛化为“药”。
- source_word: בְּתוּלַת בַּת מִצְרַיִם
  choice: 处女埃及啊
  rationale: 这是先知书中将国家拟人化为年轻女子的称呼。译文保留“处女”和“埃及”之间紧密的同位关系，避免补入原文没有明确表达的身份说明。
- source_word: לַשָּׁוְא
  choice: 也是徒然
  rationale: 该介词短语表示行为毫无成效；“也是徒然”自然承接前面的反讽命令。
- source_word: הרביתי
  choice: 你用再多的
  rationale: 辅音文本的动词形式在文本和形态上有困难；结合阴性单数受话者和上下文，译作第二人称阴性单数，并以“用再多的”表达增多疗法的意思。
- source_word: רְפֻאוֹת
  choice: 药物
  rationale: 该复数名词源自治疗词根，在香膏和医治的语境中指各种治疗手段或药剂；“药物”适合现代汉语，并以“再多的”体现复数和增多之意。
- source_word: תְּעָלָה
  choice: 痊愈
  rationale: 指伤病得到恢复或医治；“痊愈”在“无法……”结构中自然表达结果，同时不限定具体病症。
- source_word: אֵין לָךְ
  choice: 你无法
  rationale: 希伯来语是存在否定加第二人称阴性单数介词后缀，直义为“对你没有”；结合תעלה，译为“你无法痊愈”准确而自然。
theological_decisions:
- issue: 对埃及无可医治的审判宣告
  choice: 你无法痊愈
  alternative: 你没有医治
  rationale: 译文保留原文断然否定的力度，不把它弱化为暂时缺少治疗，也不进一步解释为关于永恒命运的判断。
translation_notes:
  register: 采用现代、庄重而易懂的先知宣告语体。“处女埃及”保留希伯来语对国家的女性拟人称呼；“吧”使祈使句在汉语中自然，但其上下文仍显出尖锐的反讽。脚注标记按内容分别置于存在文本困难的“药物”处和具有文化背景的“香膏”处。
