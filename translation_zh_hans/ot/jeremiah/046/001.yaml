base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/046/001.yaml
  text: The word of Yahweh that came to Jeremiah the prophet concerning the nations:[a]
translation:
  language: zh_hans
  text: 雅威的话，就是论到列国的，临到先知耶利米：
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲשֶׁר הָיָה דְבַר יְהוָה אֶל
  choice: 耶和华……的话临到
  rationale: 按希伯来语先知性宣告的惯用表达译为自然、庄重的现代汉语；“临到”既保留启示主动来到先知的意味，也避免把 הָיָה 生硬译为“是”。关系词 אֲשֶׁר 在汉语中融入整句结构，无须单独直译。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代简体中文圣经语境中广为人知的神名音译，以区别于“主”这一称号，并保留原文专名的性质。
- source_word: יִרְמְיָהוּ הַנָּבִיא
  choice: 先知耶利米
  rationale: 使用通行中文人名，并以自然的汉语定中结构保留 הַנָּבִיא 所指明的先知职分。
- source_word: עַל הַגּוֹיִם
  choice: 论到列国
  rationale: עַל 在本段标题中可宽泛引出论述对象；“论到”保留其标题功能，不预先把所有信息都限定为敌对宣告。“列国”适合指本书46—51章所涉及的多个外邦政治实体。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 两者都意在呈现四字神名而非以称号替代；正文采用普通中文读者最熟悉、最易识别的传统音译“耶和华”，不据此加入额外的教派性解释。
- issue: עַל הַגּוֹיִם 的语义范围
  choice: 论到列国
  alternative: 攻击列国／针对列国
  rationale: עַל 既可表示一般的“关于、论到”，在审判语境中也可带“针对、攻击”之意。作为整组列国神谕的标题，正文采用较宽泛的“论到”，并以脚注保存敌对方向的可能性。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语，保留先知书标题式语气。以“耶和华……的话临到”呈现希伯来语固定宣告公式；句末冒号表明本节是随后列国神谕的总标题。
