- from: 耶和华论到列国[a]的话临到先知耶利米：
  to: 雅威的话，就是论到列国的，临到先知耶利米：
  rationale: 修订将神名改为“雅威”，与 Yahweh 的既定译法一致；以“就是论到列国的”明确关系从句所修饰的“话”，并保留原文标题式语气及句末冒号。脚注保留“against”的语境可能性，同时避免将其不必要地具体化为“攻击”。
