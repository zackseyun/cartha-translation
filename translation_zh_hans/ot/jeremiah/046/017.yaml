  yaml_path: translation/ot/jeremiah/046/017.yaml
  text: There they cry[a], ‘Pharaoh king of Egypt is only a noise; he has let the appointed time pass by.’
translation:
  language: zh_hans
  text: '他们在那里喊道[a]：

    “埃及王法老不过是喧嚷；

    他让所定的时机白白过去了。”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们在那里称埃及王法老为‘喧嚷’：他错过了所定的时机。”希伯来文简短而带嘲讽；“喧嚷”也可译作“骚动”或“虚张声势”。
    reason: lexical_alternative
lexical_decisions:
- source_word: קָרְאוּ שָׁם
  choice: 他们在那里喊道
  rationale: קָרְאוּ 是 קרא 的完成式第三人称复数，在此引出众人带嘲讽意味的呼喊；用“喊道”体现宣告的力度，同时保留 שָׁם 的地点含义“在那里”。
- source_word: פַּרְעֹה מֶלֶךְ מִצְרַיִם
  choice: 埃及王法老
  rationale: 按现代汉语自然语序表达专名及同位王号，不增添解释。
- source_word: שָׁאוֹן
  choice: 不过是喧嚷
  rationale: 该词可指响声、喧嚷或骚动；本节语气明显带有嘲讽。“不过是”显出其声势大而无实效的语用意味，“喧嚷”仍处于原词的基本词义范围内。
- source_word: הֶעֱבִיר הַמּוֹעֵד
  choice: 他让所定的时机白白过去了
  rationale: הֶעֱבִיר 是 עבר 的使役式，宜保留“让……过去”的使役色彩；הַמּוֹעֵד 在军事政治语境中指预定或关键的时机。“白白”自然传达错失机会的结果，但不把动词直接改译为“错过”。
