  text: הֹבִ֖ישָׁה בַּת מִצְרָ֑יִם נִתְּנָ֖ה בְּ/יַ֥ד עַם צָפֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/046/024.yaml
  text: The daughter of Egypt is put to shame[a]; she is given into the hand of a people from the north.
translation:
  language: zh_hans
  text: 埃及的女子蒙了羞；她被交在从北方来的一个民族手中[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “交在……手中”是希伯来语惯用语，意思是落入……的权势或控制之下。
    reason: lexical_alternative
lexical_decisions:
- source_word: הֹבִישָׁה
  choice: 蒙了羞
  rationale: 该词为בוש的Hiphil形式，在这里表达受辱、蒙羞的结果；“蒙了羞”保留审判语气，也避免仅理解为内心感到羞愧。
- source_word: בַּת מִצְרָיִם
  choice: 埃及女子
  rationale: 保留先知文学中把埃及人格化为女子的意象，并与后文阴性单数形式相呼应；不简化为“埃及”，以免丢失原文修辞。
- source_word: נִתְּנָה
  choice: 她被交在
  rationale: 该词为נתן的Niphal完成式，表示被动地落入他者权势之下；“被交在……手中”既贴近原文，也符合现代汉语中的圣经表达。
- source_word: בְּיַד
  choice: 手中
  rationale: 直译保留希伯来语“在某人手中”的惯用意象；此处实际表示落入对方权势或控制之下，并以脚注说明。
- source_word: עַם צָפוֹן
  choice: 北方来的一个民族
  rationale: 原文只说“北方的／来自北方的一个民族”，未明说其历史身份；此译自然地保留其不定性和来源方向。
theological_decisions:
- issue: 是否明确指出北方民族的历史身份
  choice: 保留为“北方来的一个民族”
  alternative: 在正文中译作“巴比伦人”或“北方军队”
  rationale: 原文没有在本节明确说出巴比伦，也没有使用“军队”一词；译文不应把可能的历史解释直接写入正文。
- issue: 如何处理“埃及之女”的人格化意象
  choice: 译作“埃及女子”，并以“她”承接
  alternative: 简化为“埃及”
  rationale: 保留原文的女性人格化及语法呼应，同时不额外赋予这一形象特定神学含义。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“蒙了羞”传达先知审判语气；分号呈现两个紧密相连的平行陈述。脚注标记置于其实际说明的“手中”之后。
