  rationale: 修订仅澄清“我赶你到的所有列国”在原文中是施行完全终结的地点范围，而非不必要地改变为另一种神学或历史解释；同时保留列国与雅各之间“彻底毁灭”重复所形成的修辞对照。原脚注a原本说明该重复，但修订后的正文中没有适当的单独锚点可供其准确附着，故删除；其余脚注均保留在相应词语处。
