source:
  edition: WLC
  text: אַ֠תָּה אַל תִּירָ֞א עַבְדִּ֤/י יַֽעֲקֹב֙ נְאֻם יְהוָ֔ה כִּ֥י אִתְּ/ךָ֖ אָ֑נִי כִּי֩ אֶעֱשֶׂ֨ה כָלָ֜ה בְּ/כָֽל הַ/גּוֹיִ֣ם אֲשֶׁ֧ר הִדַּחְתִּ֣י/ךָ שָׁ֗מָּ/ה וְ/אֹֽתְ/ךָ֙ לֹא אֶעֱשֶׂ֣ה כָלָ֔ה וְ/יִסַּרְתִּ֨י/ךָ֙ לַ/מִּשְׁפָּ֔ט וְ/נַקֵּ֖ה לֹ֥א אֲנַקֶּֽ/ךָּ־־־׀־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/046/028.yaml
  text: But you[a], do not fear, my servant Jacob, declares Yahweh, for I am with you. For I will make a full end of all the nations where I have driven you, but of you I will not make a full end. Yet I will discipline you with justice[b], and I will by no means leave you unpunished.
translation:
  language: zh_hans
  text: 但你，我的仆人雅各，不要惧怕！——这是耶和华的宣告。因为我与你同在。我必在我赶你到的所有列国中施行彻底的毁灭；但我必不将你彻底毁灭。我要按公正管教你[b]，绝不让你免受惩罚[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: “按公正”也可译作“按审判”或“按合宜的尺度”。这里强调管教并非任意而行。
    reason: lexical_alternative
  - marker: c
    text: 或译：“绝不宣告你无罪。”原文采用加强语气的结构，也可指绝不使雅各免受应有的惩罚。
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּירָא
  choice: 不要惧怕
  rationale: 准确表达否定命令，并以庄重、自然的现代汉语保留先知话语中的安慰语气。
- source_word: עַבְדִּי יַעֲקֹב
  choice: 我的仆人雅各
  rationale: 保留“我的仆人”这一身份称谓及原文所用的“雅各”，不改写为“以色列”。
- source_word: נְאֻם יְהוָה
  choice: 这是耶和华的宣告
  rationale: 体现先知书中庄严的宣告公式，并将神名 יְהוָה 译作中文读者熟悉的“耶和华”。
- source_word: כִּי אִתְּךָ אָנִי
  choice: 因为我与你同在
  rationale: 直接保留因果关系和神同在的保证，表达自然清楚。
- source_word: אֶעֱשֶׂה כָלָה
  choice: 彻底毁灭
  rationale: 该搭配在这里指完全终结或毁灭；上下两处采用相同译法，以保留列国与雅各之间刻意形成的对比。
- source_word: אֲשֶׁר הִדַּחְתִּיךָ שָׁמָּה
  choice: 我把你驱赶到的
  rationale: הדיח 的使役形表达被强行赶离、驱逐的意思；此译法保留神是行动主体，也符合流亡语境。
- source_word: וְיִסַּרְתִּיךָ
  choice: 我要……管教你
  rationale: יסר 在此具有纠正性管教的含义，不宜只译作一般惩罚。
- source_word: לַמִּשְׁפָּט
  choice: 按公正
  rationale: 既可表示依照公正施行管教，也保留“按审判／合宜尺度”的语义空间，避免暗示任意或过度的惩罚。
- source_word: וְנַקֵּה לֹא אֲנַקֶּךָּ
  choice: 绝不让你免受惩罚
  rationale: 不定式绝对形与限定动词同用，加强否定语气；此译法自然传达雅各不会被当作无罪、免除应受后果的意思。
theological_decisions:
- issue: 神不彻底毁灭雅各，却仍管教雅各
  choice: 同时保留神对雅各的保存与公正管教
  alternative: 将“不彻底毁灭”理解为雅各完全不受任何惩罚，或将管教仅理解为毁灭性的刑罚
  rationale: 原文先把列国遭彻底毁灭与雅各不遭彻底毁灭相对照，随后明确说雅各仍会受到公正管教；译文不消解怜悯与审判并存的张力。
- issue: נקה 的司法性与惩罚性含义
  choice: 正文译为“绝不让你免受惩罚”，脚注保留“绝不宣告你无罪”的司法性译法
  alternative: 只译作“绝不宣告你无罪”
  rationale: 上下文强调管教及其后果，正文采用普通读者容易理解的表达；脚注则保留原词可能具有的法庭语义。
translation_notes:
  register: 采用现代、庄重而清楚的书面汉语。“但你”保留原文开头对雅各的强调；两次“彻底毁灭”刻意重复，以呈现原文修辞对照。用短句呈现宣告、同在、审判和管教的层次，避免古奥措辞，也不把神的保存误解为完全免罚。
