  text: מִצְרַ֨יִם֙ כַּ/יְאֹ֣ר יַֽעֲלֶ֔ה וְ/כַ/נְּהָר֖וֹת יִתְגֹּ֣עֲשׁוּ מָ֑יִם וַ/יֹּ֗אמֶר אַֽעֲלֶה֙ אֲכַסֶּה אֶ֔רֶץ אֹבִ֥ידָה עִ֖יר וְ/יֹ֥שְׁבֵי בָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/046/008.yaml
  text: Egypt rises like the Nile[a], and its waters surge like rivers. It says, ‘I will rise, I will cover the earth; I will destroy the city and those who dwell in it.’
translation:
  language: zh_hans
  text: 埃及如尼罗河涨起；它的水势如江河翻腾。它说：“我要涨起，淹没大地[a]；我要毁灭城和住在其中的人。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“淹没这片土地。”希伯来语 אֶרֶץ 既可指“大地”，也可指“土地、国土”；正文保留埃及夸口时宏大、夸张的语气。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִצְרַיִם
  choice: 埃及
  rationale: 采用现代汉语通行国名；上下文把埃及这一政权人格化。
- source_word: כַּיְאֹר
  choice: 像尼罗河一样
  rationale: יְאֹר 在埃及语境中特指尼罗河，比泛译为“河流”更准确。
- source_word: יַעֲלֶה
  choice: 上涨
  rationale: 既贴合洪水升涨的比喻，也表现埃及军势推进，并与后文第一人称的“上涨”形成呼应。
- source_word: וְכַנְּהָרוֹת יִתְגֹּעֲשׁוּ מָיִם
  choice: 水势如江河翻腾
  rationale: 保留水流汹涌动荡的意象；“水势”在汉语中自然地表达原文复数水流所呈现的力量。
- source_word: וַיֹּאמֶר
  choice: 它说
  rationale: 将作为国家的埃及人格化，并以现在式叙述保持诗歌画面的鲜明感。
- source_word: אַעֲלֶה
  choice: 我要上涨
  rationale: 延续前句洪水上涨的动词意象，同时承载夸张的军事自负。
- source_word: אֲכַסֶּה אֶרֶץ
  choice: 淹没大地
  rationale: כסה 本义为遮盖、覆盖，在洪水语境中译作“淹没”更自然；אֶרֶץ 可指“大地”或“土地”，正文采用较有夸张气势的“大地”，并以脚注保留另一可能。
- source_word: אֹבִידָה
  choice: 我要毁灭
  rationale: 准确表达 אבד 使役形在军事威胁中的含义。
- source_word: עִיר וְיֹשְׁבֵי בָהּ
  choice: 城邑和其中的居民
  rationale: 原文“城”是单数集合性表达；“城邑”在中文中可自然表达泛指的城市目标，而不强行确定某一座城。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。通过“上涨—上涨”的重复保留原文动词呼应，以“翻腾”呈现水流的动荡力量；引语保持强烈而简洁的夸口语气。
