id: JER.46.14
reference: Jeremiah 46:14
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: הַגִּ֤ידוּ בְ/מִצְרַ֨יִם֙ וְ/הַשְׁמִ֣יעוּ בְ/מִגְדּ֔וֹל וְ/הַשְׁמִ֥יעוּ בְ/נֹ֖ף וּ/בְ/תַחְפַּנְחֵ֑ס אִמְר֗וּ הִתְיַצֵּב֙ וְ/הָכֵ֣ן לָ֔/ךְ כִּֽי אָכְלָ֥ה חֶ֖רֶב סְבִיבֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/046/014.yaml
  text: Declare it in Egypt[a], and proclaim it in Migdol; proclaim it in Noph and in Tahpanhes. Say, ‘Take your stand and prepare yourself, for the sword has devoured those around you.’
translation:
  language: zh_hans
  text: 你们要在埃及宣告，在密夺传扬；要在挪弗[a]和答比匿传扬。你们要说：‘站稳，预备好，因为刀剑已经吞噬了你四周的一切。’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “挪弗”是孟斐斯的希伯来名称。
    reason: 说明古地名的通行历史名称，帮助读者辨认地点。
lexical_decisions:
- source_word: הַגִּידוּ
  choice: 宣告
  rationale: 该词为复数祈使式，表示公开使人知道；“宣告”保留了传令般的庄重语气。
- source_word: וְהַשְׁמִיעוּ
  choice: 传扬
  rationale: 使役式在此指使消息被众人听见；两处均译为“传扬”，既自然又保留重复。
- source_word: בְמִצְרַיִם
  choice: 在埃及
  rationale: 介词 ב 在此作地点用法，直译为“在埃及”。
- source_word: בְמִגְדּוֹל
  choice: 在密夺
  rationale: 按希伯来语地名音译，并采用现代中文圣经语境中较熟悉的形式。
- source_word: בְנֹף
  choice: 在挪弗
  rationale: 正文保留希伯来地名的音译；其所指的孟斐斯另以脚注说明。
- source_word: וּבְתַחְפַּנְחֵס
  choice: 和答比匿
  rationale: 按希伯来语地名音译，避免以次生的希腊名称替换原文名称。
- source_word: אִמְרוּ
  choice: 你们要说
  rationale: 简单复数祈使式，用来引出随后直接引语。
- source_word: הִתְיַצֵּב
  choice: 站稳
  rationale: Hitpael 单数祈使式表示站定位置、准备迎战；“站稳”简洁地保留主动就位的意味。
- source_word: וְהָכֵן לָךְ
  choice: 预备好
  rationale: 命令受话者为自己作好准备；现代汉语中“预备好”自然，并可由上下文体现反身意义。
- source_word: כִּי
  choice: 因为
  rationale: 引出前述命令的原因。
- source_word: אָכְלָה חֶרֶב
  choice: 刀剑已经吞噬
  rationale: 保留“刀剑”拟人化吞噬的强烈意象；“已经”表达完成式所呈现的灾祸已然发生或迫近而确定的张力。
- source_word: סְבִיבֶיךָ
  choice: 你四周的一切
  rationale: 该表达字面指“你的周围”；补出“一切”使“吞噬”的宾语在中文中完整，同时不限定为人，保留原文对周遭地区或事物的概括性。
theological_decisions:
- issue: 引语中受话对象由复数转为单数
  choice: 前半节用复数“你们”，引语中用单数“你”，将埃及作为人格化的整体来称呼
  alternative: 把引语也译成复数，或理解为对某一城市、军队单位说话
  rationale: 原文刻意从复数宣告者转为单数受话者；保留这一转换，可维持人格化埃及的修辞效果，而不抹平语法张力。
- issue: אָכְלָה 的时体
  choice: 译为“已经吞噬”
  alternative: 译为“吞噬了”或“将要吞噬”
  rationale: 先知话语中的完成式既可描写已经发生的毁灭，也可把迫近之事说成确定事实。“已经吞噬”保留已然与确定迫近之间的张力。
- issue: סְבִיבֶיךָ 所指范围
  choice: 译为“你四周的一切”
  alternative: 译为“你周围的人”或“你四周”
  rationale: 希伯来语本身没有明确的“人”作宾语；采用概括表达，避免把可能包括邻近地区、城邑或军队的对象过早限定为人。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语；保留原文连续命令的宣告语气、地名音译、刀剑吞噬的拟人意象，以及复数宣告者与单数人格化受话者之间的转换。
