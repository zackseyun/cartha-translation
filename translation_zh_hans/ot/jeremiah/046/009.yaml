  text: עֲל֤וּ הַ/סּוּסִים֙ וְ/הִתְהֹלְל֣וּ הָ/רֶ֔כֶב וְ/יֵצְא֖וּ הַ/גִּבּוֹרִ֑ים כּ֤וּשׁ וּ/פוּט֙ תֹּפְשֵׂ֣י מָגֵ֔ן וְ/לוּדִ֕ים תֹּפְשֵׂ֖י דֹּ֥רְכֵי קָֽשֶׁת׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/046/009.yaml
  text: Go up, O horses, and rage, O chariots; let the warriors go out—Cush and Put, who grasp the shield, and the Ludim, who grasp and bend the bow.
translation:
  language: zh_hans
  text: 战马啊，冲上去！战车啊，狂奔吧！勇士们要出战——就是手持盾牌的古实人和弗人，以及手持并拉开弓的路德人。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֲלוּ הַסּוּסִים
  choice: 战马啊，冲上去
  rationale: עֲלוּ 字面为“上去”，在战阵语境中自然表达为“冲上去”；呼语形式保留诗性军令语气。
- source_word: וְהִתְהֹלְלוּ הָרֶכֶב
  choice: 战车啊，狂奔吧
  rationale: התהלל 在此处语义较罕见，结合战车语境指猛烈、狂暴地奔驰；“狂奔”既传达动势，也避免生硬直译。
- source_word: וְיֵצְאוּ הַגִּבּוֹרִים
  choice: 勇士们要出战
  rationale: יצא 字面为“出去”，军旅语境下“出战”更自然，并保留未完成式在号令中的祈使意味。
- source_word: כּוּשׁ וּפוּט
  choice: 古实人和弗人
  rationale: 两者在此指参战族群；采用常见圣经地名音译并补“人”，使现代读者清楚其所指。
- source_word: תֹּפְשֵׂי מָגֵן
  choice: 手持盾牌的
  rationale: תפש 是抓住、持有；“手持”简洁准确。מגן 泛指盾牌。
- source_word: וְלוּדִים
  choice: 路德人
  rationale: 保留族名 Ludim 的传统音译，并用“人”明确为族群。
- source_word: תֹּפְשֵׂי דֹרְכֵי קָשֶׁת
  choice: 手持并拉开弓的
  rationale: 文本连续使用“持有”和“拉开/张弓”两个分词。“手持并拉开”保留两项动作，不将其简化为一般性的“弓箭手”。
theological_decisions: []
