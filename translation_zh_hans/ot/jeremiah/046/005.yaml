  text: מַדּ֣וּעַ רָאִ֗יתִי הֵ֣מָּה חַתִּים֮ נְסֹגִ֣ים אָחוֹר֒ וְ/גִבּוֹרֵי/הֶ֣ם יֻכַּ֔תּוּ וּ/מָנ֥וֹס נָ֖סוּ וְ/לֹ֣א הִפְנ֑וּ מָג֥וֹר מִ/סָּבִ֖יב נְאֻם יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/046/005.yaml
  text: Why have I seen this? They are terrified[a], turning back; their warriors are crushed, and they have fled hastily and have not turned back. Terror is on every side[b], declares Yahweh.
translation:
  language: zh_hans
  text: 我为什么看见他们惊惶失措、向后退却？他们的勇士被击溃[a]，仓皇逃跑[b]，没有回头。四面尽是恐惧——这是雅威的宣告。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“被打倒”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译近似“逃跑着逃跑”，以同根词重复强调他们彻底溃逃。
    reason: lexical_alternative
lexical_decisions:
- source_word: מַדּוּעַ רָאִיתִי
  choice: 我为什么会看见这景象？
  rationale: 以带有惊愕意味的问句表达先知异象叙述中完成式的鲜明、即时感；“这景象”自然补出所见之事，不将其解释为特定对象。
- source_word: חַתִּים
  choice: 惊惶失措
  rationale: 该词源于 חתת，可指心志崩溃、惊惶或丧胆；此处军事溃败的语境适合译为“惊惶失措”。
- source_word: נְסֹגִים אָחוֹר
  choice: 向后退却
  rationale: 保留分词所描写的持续退却动作，也自然表达 אָחוֹר 的向后方向。
- source_word: גִבּוֹרֵיהֶם
  choice: 他们的勇士
  rationale: גִּבּוֹרִים 在战争语境中指善战之人或精锐战士；“勇士”简洁、庄重且为现代读者熟悉。
- source_word: יֻכַּתּוּ
  choice: 被击溃
  rationale: 被动形式表达遭受击打或击败；“被击溃”符合全军败退的语境，同时脚注保留较具体的另一译法。
- source_word: וּמָנוֹס נָסוּ
  choice: 仓皇逃跑
  rationale: 希伯来文以同根名词和动词连用来加强“逃跑”的语气；中文用“仓皇”传达彻底溃逃的强调作用，避免生硬直译。
- source_word: וְלֹא הִפְנוּ
  choice: 没有回头
  rationale: הִפְנָה 可表示转身、回头或转向；“没有回头”保留逃亡中不转身的画面，也不强行断定是“不回望”还是“不转身迎敌”。
- source_word: מָגוֹר מִסָּבִיב
  choice: 四面尽是恐惧
  rationale: 这是耶利米书反复出现的表达；译文保留“四面”与“恐惧”的核心意象，并符合现代汉语习惯。
- source_word: נְאֻם יְהוָה
  choice: 这是雅威的宣告
  rationale: 以庄重而自然的汉语表达先知性宣告公式，并按专名直接音译神名 יְהוָה。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”较贴近学界通常重构的读音，并保留其作为专名的性质。
- issue: וְלֹא הִפְנוּ 所指动作
  choice: 没有回头
  alternative: 没有转身迎敌
  rationale: 原文只说他们没有转身或转向，并未明说是回望还是重新面对敌军；正文采用较宽泛的表达，以保留这一语义张力。
translation_notes:
  register: 采用现代、庄重而清楚的叙事语言。“惊惶失措”“向后退却”“仓皇逃跑”形成连贯的战场溃败画面；破折号突出末尾的神谕公式。所有脚注标记均置于其实际说明的词语之后。
