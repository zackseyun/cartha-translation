base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/046/019.yaml
  text: Prepare your baggage for exile[a], O daughter dwelling in Egypt, for Noph will become a desolation, laid waste[c][b], without inhabitant.
translation:
  language: zh_hans
  text: 埃及的女居民啊，要为自己预备被掳的行装[a]！因为挪弗[b]必成为荒凉之地，遭到毁灭[c]，无人居住。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“被掳时所用的物品”或“放逐的装备”；原文描绘的是为被强制迁徙而收拾随身物品。
    reason: lexical_alternative
  - marker: b
    text: “挪弗”是这座埃及古城的希伯来名称，后来通称为孟斐斯。
    reason: cross_reference
  - marker: c
    text: 或译“被焚毁”；原文动词可带有火焚的意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּלֵי גוֹלָה
  choice: 流亡的行装
  rationale: כְּלֵי指器具、物品或装备，与גּוֹלָה连用时，具体描绘人为被掳迁徙所预备的随身物品。“流亡的行装”既自然，也保留了预备 belongings 赴放逐之路的形象。
- source_word: עֲשִׂי לָךְ
  choice: 要为自己预备
  rationale: 阴性单数命令式配合反身性的לָךְ，表示受话者要为自己备妥行装；译文保留命令语气和反身含义。
- source_word: יוֹשֶׁבֶת בַּת מִצְרָיִם
  choice: 住在埃及的女子啊
  rationale: יוֹשֶׁבֶת是阴性单数分词，修饰人格化的“埃及女子”。此译保留居住之意及先知话语中的女性人格化称呼，同时符合现代汉语表达。
- source_word: נֹף
  choice: 挪弗
  rationale: 保留该城的希伯来名称，并采用中文圣经传统中通行的音译；其与孟斐斯的历史对应关系置于脚注说明。
- source_word: לְשַׁמָּה
  choice: 变为荒场
  rationale: שַׁמָּה在此主要指荒凉、毁坏之地，也可能隐含令人惊骇的意味。“荒场”简洁地传达审判后彻底荒废的景象。
- source_word: וְנִצְּתָה
  choice: 被焚毁
  rationale: 该被动动词在此可表达遭焚烧、毁灭。原词的火焚意味较强，故正文采用“被焚毁”，同时以脚注保留较宽泛的“遭毁坏”理解。
- source_word: מֵאֵין יוֹשֵׁב
  choice: 无人居住
  rationale: 这一习语表示没有居民留下。“无人居住”是自然、清楚的现代汉语，也保留了审判宣告的简峻语气。
theological_decisions: []
