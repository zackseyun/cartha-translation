  text: Prepare buckler and shield[a], and advance to battle.
translation:
  language: zh_hans
  text: 备好小盾和大盾[a]，上前作战！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“把较小的盾和较大的盾布置好，上前参战。”原文用两个不同的词指盾具；后者通常指较大的盾，前者与之相比可能指较小的盾。
    reason: lexical_alternative
lexical_decisions:
- source_word: עִרְכוּ
  choice: 备好
  rationale: 该命令式本义为“排列、布置”。以兵器为宾语时，“备好”自然表达将武器布置妥当、准备使用之意。
- source_word: מָגֵן
  choice: 小盾
  rationale: מָגֵן通常指较小的盾；在此与צִנָּה并列，译作“小盾”可清楚保留两种盾牌的区别，也比采用生僻的专门术语更易懂。
- source_word: צִנָּה
  choice: 大盾
  rationale: צִנָּה通常指覆盖面积较大的盾牌。译作“大盾”与“小盾”形成原文所呈现的对比。
- source_word: וּגְשׁוּ
  choice: 上前
  rationale: נגשׁ意为靠近、上前；军事语境中的“上前”既保留趋近之意，也自然表达向战场推进。
- source_word: לַמִּלְחָמָה
  choice: 作战
  rationale: 该短语指向战斗而去。与“上前”搭配译为“上前作战”，简洁自然，并保留投入战斗的方向性。
