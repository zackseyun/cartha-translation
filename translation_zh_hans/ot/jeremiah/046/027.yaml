language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ֠/אַתָּה אַל תִּירָ֞א עַבְדִּ֤/י יַֽעֲקֹב֙ וְ/אַל תֵּחַ֣ת יִשְׂרָאֵ֔ל כִּ֠י הִנְ/נִ֤י מוֹשִֽׁעֲ/ךָ֙ מֵֽ/רָח֔וֹק וְ/אֶֽת זַרְעֲ/ךָ֖ מֵ/אֶ֣רֶץ שִׁבְיָ֑/ם וְ/שָׁ֧ב יַעֲק֛וֹב וְ/שָׁקַ֥ט וְ/שַׁאֲנַ֖ן וְ/אֵ֥ין מַחֲרִֽיד־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/046/027.yaml
  text: But as for you[a], do not fear, my servant Jacob, and do not be dismayed, Israel; for behold, I will save you from far away, and your offspring from the land of their captivity. Jacob will return and be quiet and at ease[c][b], with no one to make him afraid.
translation:
  language: zh_hans
  text: 但你，我的仆人雅各，不要惧怕；以色列啊[a]，不要惊惶！因为看哪，我必从远方拯救你[b]，也必从他们被掳之地[c]拯救你的后裔。雅各必归回，安静安稳；无人使他惊惶。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “雅各”和“以色列”在这里把立约的百姓作为一个人来称呼。
    reason: cultural_note
  - marker: b
    text: 原文用分词，可表达正在临近的行动，也可强调这行动确定必成；也可译作“我正在拯救你”或“我要拯救你”。
    reason: lexical_alternative
  - marker: c
    text: 或译：“从囚禁他们的地方拯救你的后裔。”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתָּה
  choice: 但你
  rationale: 连词与独立代词共同标出强调性的转折；结合前文对列国的审判，“但你”比单纯的“而你”更自然地呈现话语转换。
- source_word: אַל תִּירָא
  choice: 不要惧怕
  rationale: 直接保留否定命令的力度，符合现代汉语先知性劝慰的庄重语体。
- source_word: עַבְדִּי יַעֲקֹב
  choice: 我的仆人雅各
  rationale: 保留带领属意味的“我的仆人”称号及“雅各”这一人格化的群体名称，不改写为解释性的“以色列民”。
- source_word: וְאַל תֵּחַת
  choice: 不要惊惶
  rationale: נפעל词形在此表示因恐惧而惊惶、丧胆；“惊惶”既与“惧怕”平行，又不把含义过度限定为外在毁灭。
- source_word: כִּי הִנְנִי
  choice: 因为看哪
  rationale: “因为”保留因果关系，“看哪”保留 הִנְנִי 所带的郑重提示和神圣宣告语气。
- source_word: מוֹשִׁיעֲךָ
  choice: 我必……拯救你
  rationale: הִנְנִי 加分词表达正在临近或确定必成的行动；汉语以“必”自然呈现应许的确定性，同时在脚注中保留时体张力。
- source_word: מֵרָחוֹק
  choice: 从远方
  rationale: 按空间意义直接翻译，简洁而自然。
- source_word: וְאֶת זַרְעֲךָ
  choice: 也必……拯救你的后裔
  rationale: זֶרַע 在这里是集合意义，译作“后裔”比字面的“种子”清楚；补出并列分句共用的“拯救”，符合汉语表达。
- source_word: מֵאֶרֶץ שִׁבְיָם
  choice: 从他们被掳之地
  rationale: 保留名词所带复数后缀“他们”，明确指向“你的后裔”；“被掳之地”比抽象的“流亡之地”更贴近 שְׁבִי。
- source_word: וְשָׁב יַעֲקֹב
  choice: 雅各必归回
  rationale: שׁוב 在被掳与复兴的语境中表示返回；“必”呈现预告的确定语气。
- source_word: וְשָׁקַט וְשַׁאֲנַן
  choice: 安居宁静，安然无忧
  rationale: 用两个协调短语分别表达 שקט 的不受扰动、宁静状态和 שׁאנן 的安逸无忧，避免把二者压缩为同一个概念。
- source_word: וְאֵין מַחֲרִיד
  choice: 无人使他害怕
  rationale: 贴近使役分词的含义，并与开头“不要惧怕”形成首尾呼应。
theological_decisions:
- issue: “雅各”与“以色列”的所指
  choice: 保留两个专名，将其理解为对立约群体的人格化称呼。
  alternative: 直接意译为“以色列民”，或理解为族长雅各本人。
  rationale: 本节的被掳、后裔和归回语境表明，两个族长名在平行呼语中代表整体百姓；保留专名可保存先知话语的人格化表达，而不以释义取代正文。
- issue: מוֹשִׁיעֲךָ 的时间意味
  choice: 译为“我必……拯救你”，强调神所应许行动的确定性。
  alternative: 译为“我正在拯救你”或“我要拯救你”。
  rationale: 原文是 הִנְנִי 配合分词，兼有临近、展开或确定必成的意味；在未来复兴的语境中，“必”最自然，但以脚注保留原文并非普通简单将来时这一张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留先知呼语“以色列啊”和提示语“看哪”，以维持原文的宣告感；避免古奥的“休要”“莫要”及教派化解释。后半节以成对短语呈现平安与安稳，并保留“无人使他害怕”的具体使役表达。
