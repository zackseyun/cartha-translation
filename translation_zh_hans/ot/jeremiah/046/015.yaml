  yaml_path: translation/ot/jeremiah/046/015.yaml
  text: Why has your mighty one been swept away? He did not stand[a], for Yahweh drove him away.
translation:
  language: zh_hans
  text: 你的强者[a]为什么被冲走？他没有站住，因为雅威把他击退了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“你的强者们”。这个希伯来词也可理解为“你的公牛”，可能指埃及奉为神圣的阿庇斯牛。
    reason: 保留原文在数以及具体所指方面的另一种可能读法。
lexical_decisions:
- source_word: מַדּוּעַ
  choice: 为什么
  rationale: 作为疑问副词引出带有修辞意味的问句；“为什么”是自然、准确的现代汉语表达。
- source_word: נִסְחַף
  choice: 被冲走
  rationale: 保留动词的被动形式及被强力冲离原处的鲜明意象，适合战败语境。
- source_word: אַבִּירֶיךָ
  choice: 你那强者
  rationale: 该词表示强壮、有力者，也可指公牛。虽然其形式可按复数理解，但后面的动词和代词为单数，因此正文采用单数“强者”，其他可能性留在脚注中。
- source_word: לֹא עָמַד
  choice: 他没有站住
  rationale: 直译否定完成式，同时自然传达在争战中未能立稳或守住阵地的含义，不进一步解释失败的方式。
- source_word: כִּי
  choice: 因为
  rationale: 此处引出前述失败的原因；“因为”符合现代汉语因果表达。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以“雅威”音译上帝的专名，保留原文使用专名而非称号的特点。
- source_word: הֲדָפוֹ
  choice: 把他击退了
  rationale: 该动词表示推开、排斥或赶退；“击退”符合争战与败退语境，并保留单数宾语。
theological_decisions:
- issue: 埃及预言中 אַבִּירֶיךָ 的所指
  choice: 正文按单数泛指“你那强者”
  alternative: “你的强者们”；或“你的公牛”，后者可能指埃及奉为神圣的阿庇斯牛
  rationale: 该词本身表达强壮或大力，也可用于公牛。上下文的动词及宾语后缀均为单数，故正文采用单数，但不把可能的阿庇斯背景直接写入正文，以免将并不确定的历史解释当作明说的含义。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。“被冲走”保留原文的动态意象；“没有站住”既贴近字面，也适用于战败语境。脚注标记紧接存在歧义的“强者”。
