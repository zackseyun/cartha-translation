  yaml_path: translation/ot/jeremiah/046/020.yaml
  text: Egypt is a beautiful heifer; destruction from the north has come[a], it has come.
translation:
  language: zh_hans
  text: '埃及是一头秀美的小母牛；

    从北方来的牛虻[a]已经来了，已经来了！'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“毁灭”。这个希伯来词很罕见，也有人把它理解为从北方来的灾祸。
    reason: alternative_reading
lexical_decisions:
- source_word: עֶגְלָה
  choice: 小母牛
  rationale: 指尚年轻的母牛；“小母牛”在现代汉语中自然易懂，也保留了埃及被女性化为母牛的诗歌意象。
- source_word: יְפֵה פִיָּה
  choice: 秀美
  rationale: 该组合强调外形美好。“秀美”简洁、庄重，既传达美丽的形象，又避免生硬直译。
- source_word: מִצְרָיִם
  choice: 埃及
  rationale: 地名的标准译法；本节将埃及人格化为小母牛。
- source_word: קֶרֶץ
  choice: 牛虻
  rationale: 这是罕见且含义不确定的名词。具体的叮咬昆虫之义与前句母牛的意象衔接自然；“牛虻”也比泛称“咬人的飞虫”更凝练。另有将其理解为“毁灭”的传统，收入脚注。
- source_word: מִצָּפוֹן
  choice: 从北方来的
  rationale: 准确表达来源方向，并在汉语中自然修饰“牛虻”；在耶利米书中，北方常是入侵者前来的方向。
- source_word: בָּא בָא
  choice: 已经来了，已经来了
  rationale: 保留原文动词的重复和完成式所表达的迫近感与确定性，不把时态改写成较弱的普通将来。
theological_decisions:
- issue: 审判诗歌中罕见词 קֶרֶץ 的解释
  choice: 正文采用具体昆虫意象“牛虻”
  alternative: “毁灭”或“灾祸”
  rationale: 具体译法延续“小母牛”的动物意象，使诗歌比喻保持连贯；由于该希伯来词罕见、词义有争议，不能排除抽象的“毁灭”之义，因此在脚注中保留另一译法。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“秀美的小母牛”保留诗歌形象；分行和感叹号突出末尾重复所带来的紧迫语气。
