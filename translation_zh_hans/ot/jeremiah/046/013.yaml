  yaml_path: translation/ot/jeremiah/046/013.yaml
  text: The word that Yahweh spoke to Jeremiah the prophet about the coming of Nebuchadnezzar king of Babylon to strike the land of Egypt:[a]
translation:
  language: zh_hans
  text: 雅威对先知耶利米所说的话，论到巴比伦王尼布甲尼撒[a]前来攻打埃及地：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节希伯来文采用的名字形式更接近“尼布甲利撒”；正文采用通行译名“尼布甲尼撒”。
    reason: 说明原文专名拼写形式与中文通行译名之间的差异。
lexical_decisions:
- source_word: הַדָּבָר
  choice: 所说的话
  rationale: 在先知书的标题语中，דָּבָר指从雅威而来的话语或信息；译作“所说的话”既保留原文措辞，也符合现代汉语表达。
- source_word: דִּבֶּר
  choice: 说
  rationale: 原词以雅威为主语、耶利米为受话者；“说”自然准确，并与“所说的话”构成庄重的标题句式。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文四字神名的读音译出专名，而不以称号代替。
- source_word: הַנָּבִיא
  choice: 先知
  rationale: 这是说明耶利米职分的同位称谓，直接译为“先知”。
- source_word: לָבוֹא
  choice: 论到……前来
  rationale: 此处不定式与介词לְ引出话语的主题，指巴比伦王将要前来；“论到……前来”保留其前瞻性和标题功能。
- source_word: נְבוּכַדְרֶאצַּר
  choice: 尼布甲尼撒
  rationale: 采用现代中文圣经读者较熟悉的通行译名；本节希伯来文的具体拼写差异在脚注中说明。
- source_word: מֶלֶךְ בָּבֶל
  choice: 巴比伦王
  rationale: 以自然简洁的汉语表达希伯来文所属结构。
- source_word: לְהַכּוֹת
  choice: 攻打
  rationale: נכה可指击打、攻击或击败；以“埃及地”为宾语时具有军事含义。“攻打”自然明确，又不预先断定战果。
- source_word: אֶרֶץ מִצְרָיִם
  choice: 埃及地
  rationale: 保留原文אֶרֶץ“地、国土”，突出受攻击的地域，而不简化为“埃及”。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”按学界普遍重构的读音音译，保留其作为专名的性质，不以“主”等称号替代。
- issue: לְהַכּוֹת是否暗示击败埃及
  choice: 攻打
  alternative: 击败
  rationale: 该动词在军事语境中可涵盖攻击乃至击败，但本句本身没有明确陈述战果，因此采用不把结果说死的“攻打”，保留原文语义幅度。
translation_notes:
  register: 采用现代、庄重而易懂的先知书标题语体。“雅威对先知耶利米所说的话”保留原文关系从句结构；“论到”清楚引出预言主题。句末冒号表明以下经文是这段话的内容。
