  to: “我凭自己的生命起誓，”那位名为“万军之雅威”[a]的王宣告说，“必像群山中的他泊，像海边的迦密一样来到[b]。”
  rationale: 将自誓公式改为“我凭自己的生命起誓”，避免“永生”的现代神学联想，并以“万军之雅威”改善神名称号的汉语属格表达。其余句法保留比较语序和末尾零主语，以维持原文的强调及含混性。
