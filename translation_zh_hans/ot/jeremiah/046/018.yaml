  text: חַי אָ֨נִי֙ נְאֻם הַ/מֶּ֔לֶךְ יְהוָ֥ה צְבָא֖וֹת שְׁמ֑/וֹ כִּ֚י כְּ/תָב֣וֹר בֶּֽ/הָרִ֔ים וּ/כְ/כַרְמֶ֖ל בַּ/יָּ֥ם יָבֽוֹא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/046/018.yaml
  text: As I live[a], declares the King, whose name is Yahweh of Armies, surely as Tabor among the mountains and as Carmel by the sea[b], so he will come.
translation:
  language: zh_hans
  text: “我凭自己的生命起誓，”那位名为“万军之雅威”[a]的王宣告说，“必像群山中的他泊，像海边的迦密一样来到[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “雅威”是希伯来语上帝之名 יהוה（YHWH）的音译；传统上也译作“耶和华”。“万军”也常译作“万军之主”。
    reason: lexical_alternative
  - marker: b
    text: 原文没有明说“来到”的主语；上下文表明，这是指前后经文所宣告的那位征服者。
    reason: contextual_clarification
lexical_decisions:
- source_word: חַי אָ֨נִי
  choice: 我指着我的永生起誓
  rationale: 这是上帝以自己的永生作保证的庄严誓言套语；译出“起誓”可使现代汉语读者清楚理解其语用力量。
- source_word: נְאֻם
  choice: 宣告说
  rationale: 这是先知书常用的神谕引语标记；“宣告说”庄重而自然。
- source_word: הַמֶּלֶךְ
  choice: 王
  rationale: 定冠词所指的是上帝的王权身份；汉语无需冠词即可表达这一称号。
- source_word: יְהוָה צְבָאוֹת
  choice: 万军的雅威
  rationale: “雅威”按专名音译四字神名；“万军”保留צְבָאוֹת的军事和天军意象，不以传统称号替代。
- source_word: שְׁמוֹ
  choice: 名为
  rationale: 以自然的汉语关系结构表达“这是他的名”。
- source_word: כִּי
  choice: 必
  rationale: 此处引出誓言所保证的内容，具有强调确定性的作用；汉语“必”简洁传达这种断然语气。
- source_word: כְּתָבוֹר בֶּהָרִים
  choice: 像群山中的他泊
  rationale: 保留比较结构以及他泊山在众山之中的地理形象。
- source_word: וּכְכַרְמֶל בַּיָּם
  choice: 像海边的迦密一样
  rationale: 保留迦密山临海的地理图景，并与前一比较构成自然的汉语平行句式。
- source_word: יָבֹוא
  choice: 来到
  rationale: 希伯来语为第三人称阳性单数，但本节没有明说主语；汉语可自然省略主语，从而避免擅自确定来者身份。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”较贴近学界通常重构的读音，也明确把它作为专名，而不是以“主”替代。
- issue: צְבָאוֹת的所指范围
  choice: 万军
  alternative: 万军之主
  rationale: 原文是附属于神名的复数名词，可涵盖天上和地上的军队；“万军”保留其宽广意象，而“万军之主”会补入原文未明说的“主”。
- issue: יָבֹוא的隐含主语
  choice: 在正文中不补出主语
  alternative: 他必来到／那来者必来到
  rationale: 上下文指向将临的征服者，但本节本身没有明说主语；省略主语既符合现代汉语，也保留原文的含混与上下文张力。
translation_notes:
  register: 采用庄重而可读的现代标准汉语。保留原文誓言、王权称号、两个地理比较及末尾动词的次序；利用汉语零主语结构保留来者身份在本节中的未明状态。
