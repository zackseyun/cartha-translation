source:
  edition: WLC
  text: הִנְ/נִ֣י מֵבִיא֩ עֲלֵי/כֶ֨ם גּ֧וֹי מִ/מֶּרְחָ֛ק בֵּ֥ית יִשְׂרָאֵ֖ל נְאֻם יְהֹוָ֑ה גּ֣וֹי אֵיתָ֣ן ה֗וּא גּ֤וֹי מֵ/עוֹלָם֙ ה֔וּא גּ֚וֹי לֹא תֵדַ֣ע לְשֹׁנ֔/וֹ וְ/לֹ֥א תִשְׁמַ֖ע מַה יְדַבֵּֽר־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/005/015.yaml
  text: Look[a], I am bringing against you a nation from far away, O house of Israel, declares Yahweh. It is a mighty nation; it is an ancient nation[b], a nation whose language you do not know[c], and whose speech you do not understand.
translation:
  language: zh_hans
  text: “看哪，我要从远方带一个国家来攻击你们，以色列家啊，”雅威宣告，“这是一个强大的国家[a]，一个古老的国家[b]；你们不懂它的语言[c]，也听不懂它所说的话。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “强大的”也可译作“强盛的”、“坚固的”或“长存的”。
    reason: lexical_alternative
  - marker: b
    text: “古老的”也可译作“自古就有的”。
    reason: lexical_alternative
  - marker: c
    text: 原文直译：“你们不知道它的舌头，也听不懂它所说的是什么。”这里“舌头”指语言。
    reason: literal_rendering
lexical_decisions:
- source_word: הִנְנִי
  choice: 看哪，我正要
  rationale: “看哪”保留郑重宣告和唤起注意的功能；“正要”结合分词 מֵבִיא，表达迫近的行动。
- source_word: מֵבִיא עֲלֵיכֶם
  choice: 使……来攻击你们
  rationale: 在审判语境中，עַל 表明敌对方向；用现代汉语自然表达雅威将远方之国带来进攻的意思。
- source_word: גּוֹי
  choice: 国家
  rationale: 保留政治—族群实体的含义，并在经文中重复，以体现原文的修辞强调。
- source_word: מִמֶּרְחָק
  choice: 从远方
  rationale: 简洁保留空间距离及由此产生的威胁感。
- source_word: בֵּית יִשְׂרָאֵל
  choice: 以色列家啊
  rationale: 按原文作直接呼语；“家”保留群体及盟约共同体色彩。
- source_word: נְאֻם יְהוָה
  choice: 雅威宣告
  rationale: 保留先知书中的神谕公式，并将神名 יְהוָה 音译为“雅威”。
- source_word: גּוֹי אֵיתָן
  choice: 一个强大的国家
  rationale: אֵיתָן 可指强盛、坚固或持久；侵略语境中“强大”最自然地体现其令人畏惧的实力，同时以脚注保留其他可能。
- source_word: גּוֹי מֵעוֹלָם
  choice: 一个古老的国家
  rationale: מֵעוֹלָם 在这里指久远的历史，而非永恒；“古老”准确而通顺。
- source_word: לֹא תֵדַע לְשֹׁנוֹ
  choice: 那个国家的语言，你们不认识
  rationale: לָשׁוֹן 字面为“舌头”，此处指语言；保留原文先提出宾语再陈述的强调结构。
- source_word: וְלֹא תִשְׁמַע מַה יְדַבֵּר
  choice: 他们说什么，你们也听不懂
  rationale: שׁמע 在此不只是听见声音，而是听后理解；汉语以“听不懂”自然兼顾听闻与领会。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；采用“雅威”作为较贴近其通常重构发音的现代汉语音译，保留其专名性质，不以称号替代。
- issue: 远方之国的身份
  choice: 不在译文中指明具体国家
  alternative: 明确解释为巴比伦
  rationale: 本节原文只说“一个国家”，没有在句内点名；译文保留这种未明说的张力，不把历史解释写入正文。
translation_notes:
  register: 采用庄重而现代的标准普通话。“看哪”保留先知宣告的郑重语气；以直接引语呈现雅威的话，使呼语与宣告公式层次清楚。末句用“他们”指该国之民，符合现代汉语习惯；脚注则保留希伯来文单数形式。
