revisions:
- from: 然而，这百姓有一颗悖逆反抗的心；他们偏离正道，扬长而去。
  to: 然而，这百姓有一颗顽梗悖逆的心；他们背离而去。
  rationale: 修订删除原文未明说的“正道”，并以“背离而去”对应“转离”和“离去”的连续动作，不添加“扬长而去”的态度意味。“顽梗悖逆”更自然地呈现原文两个近义并列词的强调。
