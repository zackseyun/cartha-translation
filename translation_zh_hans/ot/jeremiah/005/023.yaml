  verdict: revise
  source_fidelity: “偏离正道”给原文未明说的转离对象补入了“正道”，虽与语境相合，却不必要地缩窄并解释了原文。 “扬长而去”带有较强的轻蔑、倨傲色彩，超过了“转离并离去”的基本语义。
  naturalness: “悖逆反抗的心”可以理解，但“顽梗悖逆的心”更符合现代汉语圣经语体，也较好呈现两个并列形容词的累加强度。“背离而去”自然、庄重，并保留动作的推进。
  terminology: “心”恰当保留希伯来语中内在意志与倾向的涵义。“顽梗悖逆”避免将两个相近词处理成现代政治语汇色彩较强的“反抗”，同时不引入特定教义解释。
