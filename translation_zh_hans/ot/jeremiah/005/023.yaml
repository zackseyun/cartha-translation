  text: וְ/לָ/עָ֤ם הַ/זֶּה֙ הָיָ֔ה לֵ֖ב סוֹרֵ֣ר וּ/מוֹרֶ֑ה סָ֖רוּ וַ/יֵּלֵֽכוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/005/023.yaml
  text: But this people has had a stubborn and rebellious heart; they have turned aside and gone away.
translation:
  language: zh_hans
  text: 然而，这百姓有一颗顽梗悖逆的心；他们背离而去。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֵב
  choice: 心
  rationale: 保留希伯来语以“心”指人的内在意志、思想与倾向的表达。
- source_word: סוֹרֵר
  choice: 悖逆
  rationale: 该词表示顽梗、背离、不肯顺从；“悖逆”既自然又能承接其道德与关系层面的含义。
- source_word: וּמוֹרֶה
  choice: 反抗
  rationale: 与“悖逆”并列，表达抗拒、不服从，保留两个近义词叠加的力度。
- source_word: סָרוּ
  choice: 偏离正道
  rationale: 动词本义为转离、偏离；补出“正道”使现代汉语语意完整，同时与上下文中的道德偏离相符。
- source_word: וַיֵּלֵכוּ
  choice: 扬长而去
  rationale: 直义是“就走了/离去了”；此处承接“偏离”，表达他们离开并继续走远，符合希伯来语结果性推进。
theological_decisions:
- issue: הָיָה 的时态和状态表达
  choice: 有一颗
  alternative: 已经有了一颗／一直有一颗
  rationale: 希伯来语完成式在此陈述百姓已经显明的既成状态；中文用“有”最自然，不强行判定为状态起始或持续至今。
- issue: “偏离”的宾语是否明说
  choice: 偏离正道
  alternative: 转身离去／偏离了
  rationale: 原文未明说所偏离的对象，单说“偏离”在现代汉语中略显悬空；“正道”依语境补足，但不具体限定为某一教义体系。
translation_notes:
  register: 采用庄重而通俗的现代标准汉语。保留“悖逆—反抗”和“偏离—离去”的平行递进，避免把近义表达压缩成单一概念。
