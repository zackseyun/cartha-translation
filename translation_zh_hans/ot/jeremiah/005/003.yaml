source:
  edition: WLC
  text: יְהֹוָ֗ה עֵינֶי/ךָ֮ הֲ/ל֣וֹא לֶ/אֱמוּנָה֒ הִכִּ֤יתָה אֹתָ/ם֙ וְֽ/לֹא חָ֔לוּ כִּלִּיתָ֕/ם מֵאֲנ֖וּ קַ֣חַת מוּסָ֑ר חִזְּק֤וּ פְנֵי/הֶם֙ מִ/סֶּ֔לַע מֵאֲנ֖וּ לָ/שֽׁוּב־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/005/003.yaml
  text: O Yahweh[a], are not your eyes on faithfulness? You struck them, but they did not feel pain; you consumed them, but they refused to accept discipline. They made their faces harder than rock[b]; they refused to return.
translation:
  language: zh_hans
  text: 耶和华啊[a]，你的眼目不是看顾忠信吗？你击打他们，他们却不觉疼痛；你灭尽他们，他们仍拒绝接受管教。他们使自己的脸比磐石还硬；他们拒绝回转[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “耶和华”译自上帝的希伯来文名字יהוה（YHWH）。
    reason: divine_name
  - marker: b
    text: “回转”也可译作“悔改”。希伯来文直译为“返回”，是先知书中常用的说法，指人转离罪恶、回到上帝那里。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהֹוָה
  choice: 耶和华
  rationale: 采用现代中文读者熟悉的专名译法，并保留呼格“啊”，体现先知直接向上帝说话。
- source_word: עֵינֶיךָ
  choice: 你的眼目
  rationale: 保留希伯来文具体的拟人意象，不抽象改写为“你寻求”。
- source_word: הֲלוֹא לֶאֱמוּנָה
  choice: 不是看顾忠信吗
  rationale: אֱמוּנָה在此可指忠信、信实或可靠；“忠信”切合本段对人的道德要求。“看顾”自然表达眼目所关注、察看的对象，同时不把含义收窄为单纯“寻找”。
- source_word: הִכִּיתָה אֹתָם
  choice: 你击打他们
  rationale: 直接表达נכה所指的惩罚性击打，简洁而有力度。
- source_word: וְלֹא חָלוּ
  choice: 他们却不觉疼痛
  rationale: חלה可表示软弱、患病或感受痛苦；在遭击打的语境中，“不觉疼痛”最自然地呈现预期却没有出现的反应，同时用脚注保留其他词义可能。
- source_word: כִּלִּיתָם
  choice: 你几乎灭尽他们
  rationale: כלה的Piel形式可指耗尽、灭尽或结束；依上下文受罚者仍继续拒绝管教，加入“几乎”使中文避免形成已经全数灭绝的逻辑误解，同时保留严厉审判的力度。
- source_word: מֵאֲנוּ קַחַת מוּסָר
  choice: 他们仍拒绝接受管教
  rationale: מוּסָר兼有惩戒、纠正与教导之意；“接受管教”保留惩治和塑造两方面。
- source_word: חִזְּקוּ פְנֵיהֶם מִסֶּלַע
  choice: 他们使自己的脸比磐石还硬
  rationale: 保留“脸”和“磐石”的具体比喻，并清楚表达比较关系，传达其顽梗、无惭和抗拒。
- source_word: מֵאֲנוּ לָשׁוּב
  choice: 他们拒绝回转
  rationale: שׁוּב本义为返回、转回，在先知语境中常含悔改归向上帝之意；正文保留“回转”的方向性，脚注说明其悔改含义。
theological_decisions:
- issue: 先知书中שׁוּב的道德与宗教含义
  choice: 回转
  alternative: 悔改／回到上帝那里
  rationale: “回转”保留希伯来文返回的意象，不在正文中把它完全抽象化为神学术语；脚注说明此处通常指悔改归向上帝。
- issue: אֱמוּנָה所指的品质
  choice: 忠信
  alternative: 信实／真诚／可靠
  rationale: 本节处于耶利米寻找行公义、求忠信之人的语境，“忠信”可兼顾人与人及人在上帝面前的可靠忠诚，不限定为某一教派化的“信心”解释。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。保留“眼目”“脸比磐石还硬”“回转”等希伯来文意象；句式简明，适合普通现代读者。正文中的脚注标记与脚注逐一对应。
