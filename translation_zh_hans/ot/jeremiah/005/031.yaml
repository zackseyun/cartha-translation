base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/005/031.yaml
  text: The prophets prophesy falsely[a], and the priests rule by their authority, and my people love it so[b]. But what will you do when its end comes?
translation:
  language: zh_hans
  text: 先知说虚假的预言，祭司照先知的意思掌权[a]；我的百姓竟喜爱这样。但到了这一切的结局[b]，你们要怎么办呢？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “照先知的意思”所译的原文短语含义不易确定；也可译作“凭他们的权柄”“按他们的指示”或“借他们的手”。
    reason: alternative_reading
  - marker: b
    text: 直译“到了她的结局”。原文为阴性单数，可能指上述局面、这地或这城。
    reason: lexical_alternative
lexical_decisions:
- source_word: נִבְּאוּ בַשֶּׁקֶר
  choice: 说假预言
  rationale: 该短语直指预言的虚假性；“说假预言”符合现代汉语习惯，也保留严厉的指控。
- source_word: יִרְדּוּ
  choice: 掌权
  rationale: 该动词常指统治、辖制或行使权力；“掌权”在祭司行使权势的语境中自然贴切。
- source_word: עַל יְדֵיהֶם
  choice: 凭他们的权柄
  rationale: 希伯来语短语含义困难，可能表示祭司凭先知的权柄、按其指示，或借其手掌权；正文采用较通顺而不失关系性的译法，并以脚注保留歧义。
- source_word: כֵן
  choice: 这样
  rationale: 指向前述先知与祭司的败坏情形；“喜爱这样”简洁自然。
- source_word: לְאַחֲרִיתָהּ
  choice: 到了这一切的结局
  rationale: אַחֲרִית可指结局、终局或最终后果；阴性单数后缀的所指不明确，“这一切”承接上述局面，同时避免武断指定为土地或城。
- source_word: וּמַה תַּעֲשׂוּ
  choice: 但……你们要怎么办呢
  rationale: 连接词在此形成强烈转折，由描述败坏转向警告；疑问语气保留原文的修辞力度。
theological_decisions:
- issue: עַל יְדֵיהֶם所表达的先知与祭司之间的权力关系
  choice: 祭司凭先知的权柄掌权
  alternative: 祭司按先知的指示掌权；祭司借他们的手掌权
  rationale: 原文措辞困难，不能确定是授权、指挥还是协作。正文采用可理解的关系性表达，脚注列明主要可能译法，不把具体机制定死。
- issue: לְאַחֲרִיתָהּ中阴性后缀的所指
  choice: 以“这一切的结局”指前述败坏局面的最终结果
  alternative: “她的结局”，可能指这地、这城或当前局面
  rationale: 原文没有明确先行词。正文保持警告所针对的整体局面，脚注说明阴性形式及可能所指，避免擅自确定。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“竟”突出百姓主动认同这种败坏局面的反常；末句用“怎么办呢”保留先知质问的直接力度。所有脚注标记均已置于正文相应位置。
