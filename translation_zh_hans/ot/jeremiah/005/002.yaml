review_pass:
  verdict: revise
  source_fidelity: 需修订。“永生的耶和华”虽意在表达 חַי־יְהוָה，却把固定誓言公式的谓词性陈述转成了对耶和华的定语，且加入第一人称“我指着……起誓”，与复数主语“他们”不完全协调。原文直译为“耶和华是活的／耶和华永活”，作为引语中的誓言公式；后半句明确说他们“起假誓”。
  naturalness: 修订后以“他们若说：‘耶和华是永活的’，他们仍是在起假誓”保留原文条件与让步关系，现代汉语自然、庄重，也避免引语内第一人称与叙述主语错位。
  terminology: 保留神名“耶和华”，符合既定中文圣经专名惯例。将“起假誓”用于 לַשֶּׁקֶר יִשָּׁבֵעוּ，较直接地反映“为虚假而起誓／虚假地起誓”，不额外界定其具体欺骗方式。
  issues:
  - severity: medium
    issue: 誓言公式被不协调地扩展为第一人称“我指着……起誓”
    rationale: 原文引语是固定公式“耶和华永活”，而全句主语为“他们”。汉语“我指着……”虽可解释为每个说话者的直接引语，但会造成叙述人称切换，并将原文未明说的“指着”显性加入。
  - severity: low
    issue: “永生的耶和华”将谓词性公式改为定语性称号
    rationale: חַי יְהוָה字面为“耶和华活着／永活”，在此是誓言宣告；译为“耶和华是永活的”更贴合其句法与语用。
  revised_text: 他们若说：“耶和华是永活的”，他们仍是在起假誓。
  revised_footnotes: []
