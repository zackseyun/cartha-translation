base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/005/002.yaml
  text: And if they say, “As the LORD lives,” even so they swear falsely.
translation:
  language: zh_hans
  text: 他们若说：“耶和华是永活的”，他们仍是在起假誓。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חַי יְהוָה
  choice: 我指着永生的耶和华起誓
  rationale: 这是希伯来语誓言套语；补出汉语中自然且明确的“我指着……起誓”，并以“永生的耶和华”表达字面意义“耶和华是活的”。
- source_word: לָכֵן
  choice: 仍
  rationale: 此处在让步结构中承接前句，表达“即使如此、仍然”，与句首וְאִם共同形成自然的现代汉语表达。
- source_word: לַשֶּׁקֶר יִשָּׁבֵעוּ
  choice: 他们所起的誓仍是假的
  rationale: 准确表达其誓言虚假、不真实；避免译成单纯“妄称”，以保留对起假誓行为的直接陈述。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 耶和华
  alternative: 雅威／上主
  rationale: 采用现代中文圣经读者熟悉的专名“耶和华”，既明确对应四字神名，也不引入特定宗派解释。
- issue: 誓言的虚假性质
  choice: 他们所起的誓仍是假的
  alternative: 他们仍起假誓
  rationale: 两者均可；正文措辞较自然，并保留לַשֶּׁקֶר所表达的虚假性，而不进一步断定具体欺骗方式。
translation_notes:
  register: 语言庄重而通俗。将希伯来语誓言公式按现代汉语习惯展开，同时保留句中的让步张力：口头承认永生的耶和华，并不改变其誓言虚假的事实。
