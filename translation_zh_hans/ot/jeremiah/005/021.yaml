id: JER.5.21
reference: Jeremiah 5:21
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: שִׁמְעוּ נָ֣א זֹ֔את עַ֥ם סָכָ֖ל וְ/אֵ֣ין לֵ֑ב עֵינַ֤יִם לָ/הֶם֙ וְ/לֹ֣א יִרְא֔וּ אָזְנַ֥יִם לָ/הֶ֖ם וְ/לֹ֥א יִשְׁמָֽעוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/005/021.yaml
  text: Hear this now[a], foolish people without understanding, who have eyes but do not see, who have ears but do not hear.
translation:
  language: zh_hans
  text: 你们这愚昧无知的百姓啊，现在要听这话[a]！你们有眼却看不见，有耳却听不见。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “愚昧无知”直译为“愚昧而没有心”；这里的“心”指理解和辨别的能力。
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעוּ נָא זֹאת
  choice: 现在要听这话
  rationale: 复数命令式 שִׁמְעוּ 构成先知性的直接呼召；נָא 在此表达催促语气，译为“现在”；זֹאת 直指所宣告的内容，译为“这话”较自然。
- source_word: עַם סָכָל
  choice: 愚昧……的百姓
  rationale: סָכָל 不仅指智力不足，更含道德与属灵上的愚顽；“愚昧”保留这一责备意味。עַם 是受呼告的集体，译作“百姓”符合耶利米书语境。
- source_word: וְאֵין לֵב
  choice: 无知
  rationale: 这里的 לֵב 指理解、辨别的内在能力，而非现代汉语通常所说的情感之“心”；“无知”与“愚昧”并列，简洁传达缺乏悟性之意。
- source_word: עֵינַיִם לָהֶם וְלֹא יִרְאוּ
  choice: 有眼却看不见
  rationale: 保留希伯来文中拥有器官却不能感知的鲜明反差，不额外限定为肉体或属灵的看见。
- source_word: אָזְנַיִם לָהֶם וְלֹא יִשְׁמָעוּ
  choice: 有耳却听不见
  rationale: 与前句保持平行，并以“听”呼应开头的命令，保留先知话语中的反讽。
theological_decisions:
- issue: לֵב 的人论习语
  choice: 无知
  alternative: 没有心；没有悟性
  rationale: 希伯来语“心”可指理解和辨别的中枢。正文采用自然汉语表达其功能意义，并在脚注保留字面形式，避免误解为缺乏情感，同时不削弱对道德和属灵麻木的责备。
- issue: “看不见”与“听不见”的性质
  choice: 不在正文中明说是属灵无能、拒绝或麻木
  alternative: 看不明白、听不进去
  rationale: 原文只陈述“有眼却不看见，有耳却不听见”，可能兼具不能感知与不肯回应的张力；直译式表达保留这种含混，不替文本作神学定论。
- issue: עַם 的集体称谓
  choice: 百姓
  alternative: 人民；民族
  rationale: 此处是向犹大这一群体发出的责备。“百姓”在现代中文圣经语体中自然，也不额外强调政治民族概念。
translation_notes:
  register: 采用现代、庄重而易懂的先知呼告语体。“啊”标明直接呼告，“却”凸显两组平行反差。脚注标记置于“这话”之后，正文与脚注完整对应。
