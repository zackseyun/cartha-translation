id: JER.5.10
reference: Jeremiah 5:10
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: עֲל֤וּ בְ/שָׁרוֹתֶ֨י/הָ֙ וְ/שַׁחֵ֔תוּ וְ/כָלָ֖ה אַֽל תַּעֲשׂ֑וּ הָסִ֨ירוּ֙ נְטִ֣ישׁוֹתֶ֔י/הָ כִּ֛י ל֥וֹא לַ/יהוָ֖ה הֵֽמָּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/005/010.yaml
  text: Go up through her vine-rows and destroy[a], but do not make a full end. Remove her branches[b], for they are not Yahweh’s.
translation:
  language: zh_hans
  text: 你们上去，穿过她的一行行葡萄树，毁坏吧[a]；但不可将她灭尽。除掉她的枝条[b]，因为它们不属于雅威。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你们登上她的城墙，毁坏吧。”译作“一行行葡萄树”的希伯来语词含义疑难；有人认为这里采用的是建筑或城防意象，而不是葡萄园意象。
    reason: alternative_reading
  - marker: b
    text: 或译：“除掉她的嫩枝（或卷须）。”希伯来语可能继续沿用葡萄园的比喻。
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲלוּ
  choice: 你们上去
  rationale: 这是עלה的复数祈使式，是对进攻者发出的命令。“上去”保留其行动和军事语境，又不额外补入原文没有明说的宾语。
- source_word: בְשָׁרוֹתֶיהָ
  choice: 穿行在她一排排葡萄树之间
  rationale: 该词形含义疑难，可按农业意象理解为葡萄树的行列；这与下文“枝条”相呼应。译文以自然汉语表达这种意象，同时用脚注保留建筑性解释。
- source_word: וְשַׁחֵתוּ
  choice: 施行毁坏
  rationale: שׁחת的祈使式表示毁坏、破坏；此处用“施行毁坏”承接对进攻者的命令。
- source_word: וְכָלָה אַל תַּעֲשׂוּ
  choice: 却不可将她灭尽
  rationale: כלה与עשה构成使之彻底终结的表达。“不可将她灭尽”既自然简洁，也保留毁坏受到限制、仍有余留的张力。
- source_word: הָסִירוּ
  choice: 除掉
  rationale: הסיר在此为复数祈使式，命令将某物移除；“除掉”适合修饰枝条，也具有鲜明的审判语气。
- source_word: נְטִישׁוֹתֶיהָ
  choice: 她的枝条
  rationale: 该词可指枝条、嫩枝或卷须。“枝条”在现代汉语中最清楚，并能延续葡萄园意象；更具体的可能含义列入脚注。
- source_word: כִּי לֹא לַיהוָה הֵמָּה
  choice: 因为它们不属于雅威
  rationale: 介词ל在此表达归属或关系；复数代词最自然地回指刚提到的枝条。“不属于”比直译“不归于”更符合现代汉语。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名יהוה。“雅威”按其较通行的学术拟音处理，保留这是专名而非头衔；不借此加入任何宗派性解释。
- issue: 毁坏命令与不得灭尽之间的张力
  choice: “施行毁坏，却不可将她灭尽”
  alternative: “摧毁她，但不要彻底消灭”
  rationale: 原文同时发出毁坏的命令并设下不可彻底灭绝的限制。译文不解释受保留者是谁，也不将这层张力改写成特定的余民教义。
- issue: 复数代词הֵמָּה的所指
  choice: 以“它们”回指枝条
  alternative: 理解为她的居民或防御设施
  rationale: 语法上最近的复数先行项是“枝条”，因此正文采用此理解；但不进一步界定枝条象征的具体群体。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。用“你们”明确复数命令，以“她”保留原文对城或群体的阴性拟人表达；正文维持葡萄园意象，疑难的建筑性读法和“枝条”的细分词义置于脚注。
