id: JER.5.5
reference: Jeremiah 5:5
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: אֵֽלֲכָה לִּ֤/י אֶל הַ/גְּדֹלִים֙ וַ/אֲדַבְּרָ֣ה אוֹתָ֔/ם כִּ֣י הֵ֗מָּה יָדְעוּ֙ דֶּ֣רֶךְ יְהוָ֔ה מִשְׁפַּ֖ט אֱלֹהֵי/הֶ֑ם אַ֣ךְ הֵ֤מָּה יַחְדָּו֙ שָׁ֣בְרוּ עֹ֔ל נִתְּק֖וּ מוֹסֵרֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/005/005.yaml
  text: I will go to the great men and speak to them[a], for they know the way of Yahweh, the justice of their God. But they too, together, have broken the yoke; they have torn off the bonds.
translation:
  language: zh_hans
  text: 我要到那些权贵那里去，跟他们说话；因为他们知道耶和华的道路，明白他们上帝的公正[a]。然而，他们也一同折断了轭，挣断了绳索。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“他们上帝的判断”或“他们上帝的规条”。希伯来语这个词可指公正、判断或法定要求。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֲכָה לִּי
  choice: 我要……去
  rationale: 第一人称祈愿式配合伦理与格，表达说话者坚定的意向；“我要……去”在现代汉语中自然地传达这一决意。
- source_word: הַגְּדֹלִים
  choice: 那些权贵
  rationale: 与上文的贫穷人形成社会地位上的对比，指有权势、有身份的人；“权贵”比泛称“伟人”更准确，也不把范围限死为正式官长。
- source_word: וַאֲדַבְּרָה אוֹתָם
  choice: 跟他们说话
  rationale: 保留直接与他们交谈的含义，现代汉语自然清楚。
- source_word: דֶּרֶךְ יְהוָה
  choice: 耶和华的道路
  rationale: 保留希伯来语“道路”的惯用比喻，不提前解释为旨意、律法或生活方式。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代简体中文圣经语境中广为人知的专名形式呈现四字神名，而不以“主”这一称号替代。
- source_word: מִשְׁפַּט אֱלֹהֵיהֶם
  choice: 他们上帝的公正
  rationale: מִשְׁפָּט兼具公正、判决和法定规范等意义；正文采用“公正”，脚注保留其他真实可能。
- source_word: אַךְ
  choice: 然而
  rationale: 表达预期与事实之间的强烈转折，适合庄重叙述语体。
- source_word: יַחְדָּו
  choice: 都
  rationale: 在“他们也都”中自然表达集体性和无一例外的语气，避免生硬的“共同地”。
- source_word: שָׁבְרוּ עֹל
  choice: 折断了轭
  rationale: 保留具体而强烈的轭之比喻，不擅自解释为拒绝律法或盟约。
- source_word: נִתְּקוּ מוֹסֵרוֹת
  choice: 挣断了绳索
  rationale: 与“轭”构成平行意象；“挣断”体现强行摆脱约束，且比“撕下绳索”更符合现代汉语搭配。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。中文正文保留专名而不以“主”替代；“耶和华”是现代标准汉语读者最熟悉且可识别的专名形式。
- issue: 轭与绳索意象的解释
  choice: 保留“折断轭、挣断绳索”的比喻
  alternative: 明译为拒绝上帝的律法或约束
  rationale: 原文没有把意象限定为某一种教义解释；保留具体比喻可维持其盟约、道德及社会层面的张力。
- issue: מִשְׁפַּט 的语义范围
  choice: 正文译“公正”，脚注列出“判断、规条”等可能
  alternative: 正文直接译“规条”或“判断”
  rationale: 该词在此可指上帝的公正秩序、判定或法定要求。正文需流畅，但不应掩盖原文的多义性。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“权贵”体现与上文贫穷人的对比；“道路、轭、绳索”均保留原文意象。脚注标记[a]已置于正文相应词语之后。
