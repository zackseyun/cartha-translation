  text: עַל כֵּן֩ הִכָּ֨/ם אַרְיֵ֜ה מִ/יַּ֗עַר זְאֵ֤ב עֲרָבוֹת֙ יְשָׁדְדֵ֔/ם נָמֵ֤ר שֹׁקֵד֙ עַל עָ֣רֵי/הֶ֔ם כָּל הַ/יּוֹצֵ֥א מֵ/הֵ֖נָּה יִטָּרֵ֑ף כִּ֤י רַבּוּ֙ פִּשְׁעֵי/הֶ֔ם עָצְמ֖וּ משבותי/הם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/005/006.yaml
  text: Therefore a lion from the forest strikes them down[a]; a wolf of the deserts devastates them; a leopard keeps watch over their cities. Everyone who goes out from them will be torn apart, because their transgressions are many[b]; their apostasies have grown strong.
translation:
  language: zh_hans
  text: 因此，从森林来的狮子击倒他们；荒原的狼摧毁他们[a]；豹子窥伺着他们的城邑。凡从这些城中出来的，都必被撕碎；因为他们的悖逆众多，他们的背道越发顽固[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “荒原的狼”也可译作“夜晚的狼”。希伯来语עֲרָבוֹת可指荒漠平原或旷野；也有人因狼在夜间捕食而将此短语理解为“夜晚的狼”。
    reason: lexical_alternative
  - marker: b
    text: “背道”也可译作“背离”或“退后”。此词指反复转离原有的忠诚。
    reason: lexical_alternative
lexical_decisions:
- source_word: הִכָּם
  choice: 击倒他们
  rationale: נכה表示猛烈击打，在猛兽施行审判的语境中可能含致命后果；“击倒”既保留动作力度，也不额外限定时态。
- source_word: אַרְיֵה מִיַּעַר
  choice: 林中的狮子
  rationale: 保留具体猛兽及其来源地的意象，现代汉语自然凝练。
- source_word: זְאֵב עֲרָבוֹת
  choice: 荒原的狼
  rationale: עֲרָבוֹת在此较自然地指荒漠平原或旷野；“荒原”比“沙漠”涵盖面更合适，并在脚注保留“夜晚的狼”这一词义解释传统。
- source_word: יְשָׁדְדֵם
  choice: 摧毁他们
  rationale: שדד表示劫掠、蹂躏、毁坏；此处主语是狼，“摧毁”传达猛烈破坏，避免把重点局限于掠夺财物。
- source_word: נָמֵר
  choice: 豹子
  rationale: 这是该动物名称在现代汉语中的常用对应，意象鲜明。
- source_word: שֹׁקֵד עַל
  choice: 在……旁伺机守候
  rationale: שקד含警醒注视、守候之意；猛兽语境使这种守候带有伏击意味。“伺机守候”明确敌意，同时保留持续警戒的语义。
- source_word: עָרֵיהֶם
  choice: 他们的城邑
  rationale: עיר可指城市或城镇；“城邑”可概括二者，并保持庄重而易懂的圣经叙事语体。
- source_word: כָּל הַיּוֹצֵא מֵהֵנָּה
  choice: 凡从城里出来的
  rationale: 表达כָּל加分词的周遍、概括意义。מֵהֵנָּה字面为“从它们”，其复数先行词是城邑；汉语用“从城里”更自然，也避免误解为从猛兽那里出来。
- source_word: יִטָּרֵף
  choice: 都必被撕碎
  rationale: טרף的被动式描绘遭猛兽撕裂；“被撕碎”保留具体而强烈的捕食图景。
- source_word: פִּשְׁעֵיהֶם
  choice: 他们的悖逆
  rationale: פשע兼有越界犯罪和反叛权威的含义；“悖逆”在此契约不忠语境中较能凸显反叛色彩。
- source_word: רַבּוּ
  choice: 众多
  rationale: 表达增多后所形成的数量状态，简洁对应“很多、增多”。
- source_word: עָצְמוּ
  choice: 日益严重
  rationale: עצם表示强盛、增强；用于背道行为时，“日益严重”自然传达其加剧和根深蒂固，而不是把抽象行为人格化为“强壮”。
- source_word: משבותיהם
  choice: 背道的事
  rationale: 马所拉文本所示形式不寻常，语境及既有解释通常联系反复转离、背道；正文采用自然且严肃的“背道的事”，脚注保留“转离”这一较贴近词根意象的表达。
theological_decisions:
- issue: משבותיהם所表达的契约性不忠
  choice: 背道的事
  alternative: 转离正道的行为
  rationale: “背道”能表达持续、严重地离弃应有的忠诚，却不限定某一宗派意义；脚注用“转离正道的行为”呈现其方向性意象，并避免把原文张力简化为一般过失。
translation_notes:
  register: 采用现代、庄重且便于普通读者理解的书面语。前三个猛兽分句保持平行推进；“伺机守候”让敌对语境自然显明。“悖逆”与“背道的事”分别呈现פשע的反叛和末词所指的反复转离，避免将二者压成完全相同的概念。所有脚注标记均置于相关正文之后。
