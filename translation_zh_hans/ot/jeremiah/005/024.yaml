source:
  edition: WLC
  text: וְ/לֹֽא אָמְר֣וּ בִ/לְבָבָ֗/ם נִ֤ירָא נָא֙ אֶת יְהוָ֣ה אֱלֹהֵ֔י/נוּ הַ/נֹּתֵ֗ן גֶּ֛שֶׁם ו/ירה וּ/מַלְק֖וֹשׁ בְּ/עִתּ֑/וֹ שְׁבֻע֛וֹת חֻקּ֥וֹת קָצִ֖יר יִשְׁמָר לָֽ/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/005/024.yaml
  text: They did not say in their heart[a], ‘Let us now fear Yahweh our God, who gives rain in its season, both the early rain and the latter rain, who keeps for us the appointed weeks of the harvest.’
translation:
  language: zh_hans
  text: 他们心里并没有说：“现在让我们敬畏耶和华我们的上帝吧！他按时赐下雨水——秋雨和春雨[a]，又为我们保守收割时节所定的那些周。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“早雨和晚雨”。“早雨”在秋季降下，“晚雨”在春季降下。
    reason: 词语 יוֹרֶה 和 מַלְקוֹשׁ 既可按农业次序译作“早雨、晚雨”，也可按实际季节译作“秋雨、春雨”。
lexical_decisions:
- source_word: וְלֹא אָמְרוּ בִלְבָבָם
  choice: 他们心里并没有说
  rationale: 保留希伯来语“在心里说”的意象，同时以自然的现代汉语表达内心并未产生这种念头。
- source_word: נִירָא נָא
  choice: 现在让我们敬畏……吧
  rationale: 以“让我们……吧”表达第一人称复数劝勉式，并用“现在”传达 נָא 在本语境中的催促意味。
- source_word: יְהוָה אֱלֹהֵינוּ
  choice: 耶和华我们的上帝
  rationale: 将四字神名直接音译为“耶和华”，并保留“我们的上帝”这一关系性称呼。
- source_word: הַנֹּתֵן גֶּשֶׁם
  choice: 他……赐下雨水
  rationale: 分词描述耶和华持续而具有代表性的作为；“赐下”自然体现雨水是他的供应。
- source_word: יוֹרֶה וּמַלְקוֹשׁ
  choice: 秋雨和春雨
  rationale: 按古代以色列农业周期明确表达两场季节性雨：秋季开始降下的早雨和春季临近收割时的晚雨；脚注保留较贴近词面次序的译法。
- source_word: בְּעִתּוֹ
  choice: 按时
  rationale: 简洁表达雨水在其适当、指定的时节降下。
- source_word: שְׁבֻעוֹת חֻקּוֹת קָצִיר
  choice: 指定作收割期的那几周
  rationale: 保留“周”这一具体时间单位，并以“指定”表达 חֻקּוֹת 所含固定、规定之意。
- source_word: יִשְׁמָר לָנוּ
  choice: 他为我们守住
  rationale: 保留 שמר 的“守护、维持”意味，表明上帝维持既定的收割时段，使之惠及百姓。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文明确使用四字神名；正文采用现代中文读者最熟悉且能作为专名辨识的“耶和华”，不以“主”取代神名。
- issue: “敬畏”所表达的态度
  choice: 敬畏
  alternative: 惧怕
  rationale: “敬畏”兼含畏惧、尊崇与顺服，保留该词在先知责备语境中的神学张力，不把它缩减为单纯害怕。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“指定作收割期的那几周”刻意保留原文具体的“周”，避免笼统改写成“收割时节”；标点将上帝赐雨与守住收割期这两项作为并列的恩惠呈现。
