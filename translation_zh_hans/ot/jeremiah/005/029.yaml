base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/005/029.yaml
  text: Shall I not punish for these things? declares Yahweh[b][a]. Shall my soul not avenge itself on a nation such as this?
translation:
  language: zh_hans
  text: 耶和华说：“难道我不因这些事施行惩罚吗？[a]难道我自己不向这样的国施行报应吗？[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “施行惩罚”也可译作“追究这些事”或“追讨这些事”。原文动词可指在审判中介入察看、追究并施行惩罚。
    reason: lexical_alternative
  - marker: b
    text: 原文按字面说“我的魂岂不向这样的国为自己报仇吗？”“我的魂”是指耶和华自身的希伯来语习语，表达他亲自施行审判的决意；也可译为“难道我不亲自向这样的国施行报应吗？”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַעַל אֵלֶּה לֹא אֶפְקֹד
  choice: 难道我不该因这些事施行惩罚吗
  rationale: 疑问词与否定式构成反问；עַל表示施罚的缘由，פָּקַד在审判语境中指追究、惩罚。译文保留反问力度，并采用现代汉语自然表达。
- source_word: נְאֻם יְהוָה
  choice: 耶和华说
  rationale: 这是先知书常见的神谕公式。将יהוה音译为“耶和华”，明确保留神的专名；“说”在现代汉语中庄重而自然。
- source_word: אִם ... לֹא
  choice: 难道……不该……吗
  rationale: 这里不是普通条件句，而是带誓言色彩的反问，与前句平行，表达肯定的审判决意。
- source_word: בְּגוֹי אֲשֶׁר כָּזֶה
  choice: 向这样的国
  rationale: בְּ在נקם结构中标示报应所针对的对象；אֲשֶׁר כָּזֶה意为“这样的一国、这种国”。
- source_word: תִתְנַקֵּם נַפְשִׁי
  choice: 我的心……施行报应
  rationale: נֶפֶשׁ在此指说话者自身及其内在意志，并非将“灵魂”视为独立行动者；“我的心”既保留原文的身体—人格表达，也比生硬的“我的魂为自己报仇”更符合现代汉语。נקם的反身/中动态含义由整句表达，强调耶和华亲自施行应得的报应。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。中文圣经传统及普通读者最熟悉“耶和华”；此译法将其作为专名呈现，不以“主”替代。
- issue: “我的心施行报应”的神学与拟人表达
  choice: 保留第一人称的内在主体表达
  alternative: 我亲自报仇
  rationale: 原文נַפְשִׁי保留了耶和华自身意志与行动的强烈个人色彩。译作“我的心”避免完全抹平原文修辞，也不把它解释为神内部彼此分离的部分。
- issue: נקם的道德语气
  choice: 施行报应
  alternative: 报仇
  rationale: 上下文是神对群体罪恶的司法追究。“报应”保留נקם的强烈回应与惩治含义，同时避免现代汉语“报仇”可能带出的私人怨恨色彩。
translation_notes:
  register: 采用现代、庄重且适合公开诵读的普通话。两句均保留原文平行的反问结构；“因这些事”回指上文罪行，“这样的国”保留指示语的谴责力度。脚注标记均已置于正文对应位置。
