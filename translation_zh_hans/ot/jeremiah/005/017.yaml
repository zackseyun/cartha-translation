  text: וְ/אָכַ֨ל קְצִֽירְ/ךָ֜ וְ/לַחְמֶ֗/ךָ יֹאכְלוּ֙ בָּנֶ֣י/ךָ וּ/בְנוֹתֶ֔י/ךָ יֹאכַ֤ל צֹאנְ/ךָ֙ וּ/בְקָרֶ֔/ךָ יֹאכַ֥ל גַּפְנְ/ךָ֖ וּ/תְאֵנָתֶ֑/ךָ יְרֹשֵׁ֞שׁ עָרֵ֣י מִבְצָרֶ֗י/ךָ אֲשֶׁ֥ר אַתָּ֛ה בּוֹטֵ֥חַ בָּ/הֵ֖נָּה בֶּ/חָֽרֶב׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/005/017.yaml
  text: And they will consume your harvest and your bread[a]; they will consume your sons and your daughters; they will consume your flock and your herd; they will consume your vine and your fig tree; they will destroy your fortified cities, in which you trust[b], with the sword.
translation:
  language: zh_hans
  text: 它要吞吃你的收成和粮食[a]；他们[b]要吞吃你的儿女；它要吞吃你的羊群和牛群；它要吞吃你的葡萄树和无花果树；它要用刀剑摧毁你所倚靠的坚固城邑。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节反复使用的希伯来语动词本义是“吃”，也可译作“吃掉”或“吞噬”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文在这里由单数动词转为复数动词，随后又回到单数，可能把来犯之国既视为一个整体，也视为实际行动的众军。
    reason: alternative_reading
lexical_decisions:
- source_word: וְאָכַל / יֹאכְלוּ / יֹאכַל
  choice: 要吞吃
  rationale: אָכַל本义为“吃”，此处反复用于收成、粮食、儿女、牲畜和果树，表示敌军将其吞噬、消灭或耗尽。“吞吃”既保留贯穿全节的同一动词，又符合审判语境的强烈意象。
- source_word: קְצִירְךָ וְלַחְמֶךָ
  choice: 你的庄稼和粮食
  rationale: קָצִיר在此指收获的农作物；לֶחֶם虽本义为“饼、食物”，与庄稼并列时用“粮食”在现代汉语中更自然，也不把范围过度缩窄为成品面饼。
- source_word: בָּנֶיךָ וּבְנוֹתֶיךָ
  choice: 你的儿女
  rationale: 希伯来文分别列出“儿子”和“女儿”；现代汉语“儿女”自然、简洁，并完整包含两者。
- source_word: צֹאנְךָ וּבְקָרֶךָ
  choice: 你的羊群和牛群
  rationale: צֹאן泛指绵羊、山羊等小型牲畜，בָּקָר指牛类；“羊群和牛群”清楚保留两类牲畜的区别。
- source_word: גַּפְנְךָ וּתְאֵנָתֶךָ
  choice: 你的葡萄树和无花果树
  rationale: 两个单数名词代表相应的果树及其农产资源；直译能保留原文熟悉的农业意象。
- source_word: יְרֹשֵׁשׁ
  choice: 摧毁
  rationale: 这一少见动词可表达使之败落、荒废或被剥夺；以坚固城邑为宾语并与“刀剑”连用时，“摧毁”最清楚地传达军事毁灭的结果。
- source_word: עָרֵי מִבְצָרֶיךָ
  choice: 你的坚固城邑
  rationale: 该结构指设有防御工事的城市；“坚固城邑”用语庄重而易懂。
- source_word: אֲשֶׁר אַתָּה בּוֹטֵחַ בָּהֵנָּה
  choice: 你所倚靠的
  rationale: בָּטַח表示信赖、倚仗或以某物为保障；“倚靠”准确表现犹大把安全寄托在城防上的含义。
- source_word: בֶּחָרֶב
  choice: 用刀剑
  rationale: 介词短语表示施行毁灭的手段；“用刀剑”在现代汉语中自然，并保留军事审判的形象。
theological_decisions:
- issue: 审判行动中单数与复数施事者的交替
  choice: 按希伯来文译作“它……他们……它”，并以脚注说明敌国作为整体与其军队成员之间的视角转换。
  alternative: 全节统一译为“他们”，使中文更顺畅，但会抹平原文刻意保留的数的变化。
  rationale: 希伯来文首个及后续多数动词为阳性单数，唯“吞吃你的儿女”为复数。保留这一转换，既不把敌国和敌军强行分成两个无关主体，也不消除原文的集体性张力。
translation_notes:
  register: 采用现代、庄重且易懂的标准普通话。“吞吃”有先知审判语言所需的力度，并能自然贯穿不同宾语；“城邑”略带庄重色彩，但仍为普通读者熟悉。保留原文单复数转换，相关歧义以脚注交代。
