source:
  edition: WLC
  text: כִּי֩ בָג֨וֹד בָּגְד֜וּ בִּ֗/י בֵּ֧ית יִשְׂרָאֵ֛ל וּ/בֵ֥ית יְהוּדָ֖ה נְאֻם יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/005/011.yaml
  text: For the house of Israel and the house of Judah have dealt very treacherously with me[a], declares Yahweh.
translation:
  language: zh_hans
  text: 因为以色列家和犹大家极其对我不忠[a]。这是耶和华的宣告。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“确实对我行了诡诈”或“完全背弃了我”。希伯来文将同一动词的绝对不定式与限定动词连用，以加强语气。
    reason: 说明“背信／行诡诈”的词义替代译法，并保留原文绝对不定式加限定动词所表达的强调。
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，为先前的指控或审判说明缘由，保留原文的解释性连接。
- source_word: בָגֹוד בָּגְדוּ
  choice: 实在背叛了
  rationale: 原文以绝对不定式与限定动词并用，强化בגד所表达的背信、背叛之意；“实在”自然传达强调，同时“背叛”保留行为对关系对象造成的伤害。
- source_word: בִּי
  choice: 我
  rationale: בגד与介词ב连用时表示针对某人背信；汉语“背叛了我”自然保留其人际及盟约关系指向。
- source_word: בֵּית יִשְׂרָאֵל
  choice: 以色列家
  rationale: 保留“家”这一集体称谓，而不简化为专名“以色列”。
- source_word: וּבֵית יְהוּדָה
  choice: 和犹大家
  rationale: 保留与“以色列家”平行的原文结构，并维持两个群体的区分。
- source_word: נְאֻם יְהוָה
  choice: 这是耶和华的宣告
  rationale: 以庄重而清楚的现代汉语表达先知书中的固定神谕公式，并将神名译为“耶和华”。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代简体中文圣经语境中通行且可辨识的神名译法，而非以称号“主”代替。
theological_decisions:
- issue: 盟约背信动词 בגד 的表达
  choice: 背叛
  alternative: 背信／以诡诈待
  rationale: “背叛”既能表达关系与盟约上的不忠，也不额外限定背叛的具体形式；脚注保留其他可能表达，并说明原文的强化结构。
- issue: 神名 יהוה 的译法
  choice: 耶和华
  alternative: 雅威／主
  rationale: 正文保留专有神名，不以称号替代；“耶和华”符合现代标准汉语中广泛使用的传统形式。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。“实在背叛了我”比逐字重复更自然，同时传达原文强调；末句独立处理神谕公式，以符合汉语表达习惯。
