  terminology: “孤儿”“案件”“为穷苦人主持公道”均适合本节的司法与社会弱势者语境。以“作恶的界限”表达דברי רע，避免把“דבר”限定为言语，也避免“恶贯满盈”的额外成语色彩和完成性。
