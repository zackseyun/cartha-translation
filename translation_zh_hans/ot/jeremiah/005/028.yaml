  text: שָׁמְנ֣וּ עָשְׁת֗וּ גַּ֚ם עָֽבְר֣וּ דִבְרֵי רָ֔ע דִּ֣ין לֹא דָ֔נוּ דִּ֥ין יָת֖וֹם וְ/יַצְלִ֑יחוּ וּ/מִשְׁפַּ֥ט אֶבְיוֹנִ֖ים לֹ֥א שָׁפָֽטוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/005/028.yaml
  text: They have grown fat[a]; they are sleek. They also have gone beyond evil words. They do not judge with justice the case of the fatherless, so that they might prosper[c][b], and they do not uphold the justice of the poor.
translation:
  language: zh_hans
  text: 他们肥壮油亮；他们甚至越过了作恶的界限。他们不审理孤儿的案件，自己却亨通[a]；也不为穷苦人主持公道。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “自己却亨通”所译的原文短句含义不甚明确。也可理解为“好使他们亨通”（“他们”可指孤儿这一类人），或“他们仍然亨通”。
    reason: alternative_reading
lexical_decisions:
- source_word: שָׁמְנוּ עָשְׁתוּ
  choice: 肥胖油润
  rationale: 保留两个并列动词所描绘的富足、养尊处优的外在形象；“油润”比直译“发亮”更符合现代汉语搭配。
- source_word: גַּם עָבְרוּ דִבְרֵי רָע
  choice: 甚至恶贯满盈
  rationale: עבר表达越过界限，דברי רע可指恶事而不只指言语；此译以自然汉语传达其罪恶越过限度的意思，同时不将其缩窄为“恶言”。
- source_word: דִּין לֹא דָנוּ דִּין יָתוֹם
  choice: 不秉公审理孤儿的案件
  rationale: 同根名词与动词形成强调性的司法表达；“秉公审理……案件”既保留法律语境，也符合现代汉语。יָתוֹם在此译作通常且自然的“孤儿”。
- source_word: וְיַצְלִיחוּ
  choice: 使自己亨通
  rationale: 保留前缀连词可能具有的目的或结果意味，并用脚注说明该短句的主语及逻辑关系存在歧义。
- source_word: וּמִשְׁפַּט אֶבְיוֹנִים לֹא שָׁפָטוּ
  choice: 也不为穷苦人主持公道
  rationale: מִשְׁפָּט兼有案件、合法权益和公义之意；“主持公道”自然地表达拒绝维护贫弱者权益的司法失职。
theological_decisions:
- issue: וְיַצְלִיחוּ这一困难短句的关系与主语
  choice: 接续前句译为“使自己亨通”
  alternative: “他们却亨通”；或“好让孤儿胜诉”
  rationale: 马所拉文本的句法简约，动词主语与逻辑关系并不完全明确。正文采用指恶人借不义而亨通的可能读法，但用脚注保留并列转折及以孤儿为隐含受益者的理解，避免消除原文张力。
- issue: יָתוֹם的表达
  choice: 孤儿
  alternative: 丧父的孩子
  rationale: 该词在古代语境中特指失去父亲、因而失去社会保障的人；现代汉语“孤儿”简洁自然，而较严格的词义范围在说明中予以交代。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“肥胖油润”保留先知讽刺性的具体形象；“恶贯满盈”是较凝练的成语，但仍属普通读者熟悉的表达。正文脚注标记[a]已在相应困难短句后出现。
