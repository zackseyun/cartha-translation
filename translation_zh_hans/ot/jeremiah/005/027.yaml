base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/005/027.yaml
  text: Like a cage full of birds[a], so their houses are full of deceit[b]; therefore they have become great and grown rich.
translation:
  language: zh_hans
  text: 笼子里充满飞鸟[a]，他们的房屋也照样充满诡诈[b]；因此，他们变得强盛而富有。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “笼子”也可译作“篮子”或“禽舍”；原词指盛放或关住鸟的容器。
    reason: lexical_alternative
  - marker: b
    text: “诡诈”也可译作“奸诈”或“欺诈”；原词广泛涵盖不诚实和剥削性的行为。
    reason: lexical_alternative
lexical_decisions:
- source_word: כְלוּב
  choice: 笼子
  rationale: 该词指盛放或关住鸟的容器；“笼子”在现代汉语中自然清楚，也保留了原文的容器意象。
- source_word: מָלֵא עוֹף
  choice: 装满飞鸟
  rationale: עוֹף泛指鸟类或有翼生物；“飞鸟”简洁而庄重，“装满”与具体容器搭配自然。
- source_word: כֵּן
  choice: 也照样
  rationale: 明确表达前后两幅图像之间的对应比较关系。
- source_word: בָּתֵּיהֶם
  choice: 他们的房屋
  rationale: 保留原文具体的“房屋”意象，不将其抽象化为财产或家业。
- source_word: מְלֵאִים מִרְמָה
  choice: 充满诡诈
  rationale: מִרְמָה涵盖欺骗、奸诈和欺诈性行为；“诡诈”保持较宽的道德含义，不局限于经济诈骗。
- source_word: עַל כֵּן
  choice: 因此
  rationale: 清楚标明他们壮大、富有是前述诡诈行为所带来的结果。
- source_word: גָּדְלוּ
  choice: 日益壮大
  rationale: 保留“变大、壮大”的基本意义，并自然表达其社会地位或势力增长；不具体限定为政治权力。
- source_word: וַיַּעֲשִׁירוּ
  choice: 变得富有
  rationale: 准确表达“成为富足”的状态变化；避免用“敛财”等措辞过度强化原文动词本身未明说的主动手段。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重且易懂的书面汉语。前半句保留希伯来文“怎样……也照样……”的比较结构，后半句用“因此”呈现因果关系；“日益壮大”保留原文的宽泛性，不把社会显达、势力增长或地位提升中的某一种解释绝对化。
