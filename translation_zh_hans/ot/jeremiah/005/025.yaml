  to: 你们的罪孽使这些[a]离开了你们；你们的罪扣留了那美好的事物，不给你们[b]。
  rationale: 修订补足第一分句的中文句法，并以“扣留了……，不给你们”对应מָנְעוּ和מִכֶּם，保留其与第一分句动词的差别。将“福分”调整为“那美好的事物”，更贴近הַטּוֹב的开放、集合性含义；脚注保留可行的中文替代译法。
