  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: עֲוֺנוֹתֵי/כֶ֖ם הִטּוּ אֵ֑לֶּה וְ/חַטֹּ֣אותֵי/כֶ֔ם מָנְע֥וּ הַ/טּ֖וֹב מִ/כֶּֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/005/025.yaml
  text: Your iniquities have turned these away[b][a], and your sins have withheld the good from you.
translation:
  language: zh_hans
  text: 你们的罪孽使这些[a]离开了你们；你们的罪扣留了那美好的事物，不给你们[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “这些”回指上文所述之事；原文没有明说具体所指。
    reason: 指代说明
  - marker: b
    text: “那美好的事物”也可译作“好处”或“美福”。
    reason: 词义选择
lexical_decisions:
- source_word: עֲוֺנוֹתֵיכֶם
  choice: 你们的罪孽
  rationale: “罪孽”体现 עָוֹן 所含的悖逆、过犯及罪责意味，并与下句 חַטֹּאותֵיכֶם 的“罪”略作区分。
- source_word: הִטּוּ
  choice: 使……转离
  rationale: 使役式在此表示使某物偏转、离开；译作“使……转离”既保留其方向性，也符合上下文中福泽被挪开的意思。
- source_word: אֵלֶּה
  choice: 这些
  rationale: 保留希伯来文指示代词的含蓄所指，让读者从上文判断它指按时降雨及相关福泽，而不在正文中加以限定。
- source_word: וְחַטֹּאותֵיכֶם
  choice: 你们的罪
  rationale: חַטָּאת 是常用的“罪、过犯”一词；译作“罪”清楚自然，并与前句“罪孽”保持措辞区别。
- source_word: מָנְעוּ
  choice: 使……离开了
  rationale: מנע 表示阻止、扣留或使人得不着；与“福分”和 מִכֶּם 搭配时，“使福分离开了你们”自然表达因罪而被剥夺。
- source_word: הַטּוֹב
  choice: 福分
  rationale: 该词带定冠词，既可抽象地指“好处”，也可集合性地指上文所述的美善供应。中文“福分”在此语境自然，但不把所指缩限为物质 prosperity。
- source_word: מִכֶּם
  choice: 离开了你们
  rationale: 介词 מן 表示分离或剥夺；融入“使……离开了你们”的句式，准确传达这些好处不再临到他们。
theological_decisions:
- issue: 是否在正文中明确“这些”所指的是雨水或上文的福泽
  choice: 保留“这些”，不在正文中明确展开
  alternative: 译作“这些事”“这些福分”或“这些雨水”
  rationale: 希伯来文只用指示代词回指上文，具体所指虽可由语境推知，却未在本节明说。保留指示语可避免消除原文的含蓄性。
- issue: הַטּוֹב 是抽象的“好处”还是集合性的“福分”
  choice: 正文译作“福分”，脚注保留“好处／美物”的可能
  alternative: 译作“好处”“美物”或“美福”
  rationale: 上下文涉及耶和华按时赐雨和收成，因此“福分”符合语境；同时不应把该词限定为单一种类的赐予。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“罪孽／罪”保留两个近义希伯来词的区别；“这些转离”略带原文式凝练，因此以脚注说明其回指对象。
