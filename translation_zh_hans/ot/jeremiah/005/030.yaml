  yaml_path: translation/ot/jeremiah/005/030.yaml
  text: An appalling and horrible thing has happened in the land:[a]
translation:
  language: zh_hans
  text: 这地发生了一件可怕而令人惊骇的事：[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“这地发生了一件惊骇、可怖的事。”
    reason: 原文两个并列名词都可表达恐怖、震惊或惊愕；其具体侧重点及两者的搭配方式有一定翻译空间。
lexical_decisions:
- source_word: שַׁמָּה
  choice: 令人惊骇的事
  rationale: 该名词指使人震惊、恐惧或惊愕之事；译为“令人惊骇”既保留其强烈情感色彩，也避免采用在本处可能过度具体的“荒凉”。
- source_word: וְשַׁעֲרוּרָה
  choice: 骇人听闻的事
  rationale: 该词表示可怕、骇人或令人震惊之事，与前词并列形成加强语气。“骇人听闻”符合现代汉语表达，也保留了事件令人震骇、难以置信的意味。
- source_word: נִהְיְתָה
  choice: 发生了
  rationale: 此处 היה 表示某事已经出现或成为事实。“发生了”自然地传达完成性语义，不采用较生硬的“成就了”。
- source_word: בָּאָרֶץ
  choice: 在这地
  rationale: 定冠词所指的“地”在先知语境中是相关的本地，即犹大之地；“这地”既自然，也避免误解为全世界。
theological_decisions: []
