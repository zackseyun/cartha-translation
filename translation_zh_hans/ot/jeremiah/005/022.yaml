source:
  edition: WLC
  text: הַ/אוֹתִ֨/י לֹא תִירָ֜אוּ נְאֻם יְהֹוָ֗ה אִ֤ם מִ/פָּנַ/י֙ לֹ֣א תָחִ֔ילוּ אֲשֶׁר שַׂ֤מְתִּי חוֹל֙ גְּב֣וּל לַ/יָּ֔ם חָק עוֹלָ֖ם וְ/לֹ֣א יַעַבְרֶ֑/נְהוּ וַ/יִּֽתְגָּעֲשׁוּ֙ וְ/לֹ֣א יוּכָ֔לוּ וְ/הָמ֥וּ גַלָּ֖י/ו וְ/לֹ֥א יַעַבְרֻֽ/נְהוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/005/022.yaml
  text: Do you not fear me? declares Yahweh[a]. Do you not tremble before me, he who set the sand as a boundary for the sea, an everlasting decree that it cannot cross? Though its waves toss, they cannot prevail; though they roar[b], they cannot cross it.
translation:
  language: zh_hans
  text: “你们不敬畏我吗？”雅威宣告说：“你们在我面前还不战兢吗？我把沙设为海的界限，作为永恒的定例，使海不能越过它。海水虽翻腾，却不能得胜；波涛虽轰鸣[b]，却不能越过它。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: “轰鸣”也可译作“喧腾”或“怒吼”。
    reason: המה可描写波涛的轰鸣、喧腾或骚动。
lexical_decisions:
- source_word: הַאוֹתִי לֹא תִירָאוּ
  choice: 你们不敬畏我吗
  rationale: 保留反问语气；“敬畏”兼含惧怕和尊崇，比单纯的“害怕”更能体现 ירא 在本段责备语境中的意义。
- source_word: נְאֻם יְהוָה
  choice: 雅威宣告说
  rationale: נְאֻם 是庄重的先知宣告用语；יְהוָה 按其专名音译为“雅威”，不以称号代替。
- source_word: אִם מִפָּנַי לֹא תָחִילוּ
  choice: 你们在我面前还不战兢吗
  rationale: חיל 在此与“敬畏”平行，表达因上帝威严而颤抖；“战兢”自然且保留庄严力度。
- source_word: חוֹל גְּבוּל לַיָּם
  choice: 把沙立作海的界限
  rationale: 准确表达 שׂים 的设立动作和 גְּבוּל 的边界意义，同时符合现代汉语表达。
- source_word: חָק עוֹלָם
  choice: 永远的法令
  rationale: חָק 表示固定的规定或法令，עוֹלָם 强调其长久有效；此译保留宇宙秩序兼具命令性的意象。
- source_word: וַיִּתְגָּעֲשׁוּ וְלֹא יוּכָלוּ
  choice: 海水虽汹涌，却无能为力
  rationale: געש 表示翻腾、汹涌或狂暴；יכל 后省略所不能成就之事，“无能为力”保留原文省略，不擅自限定为某一具体动作。
- source_word: וְהָמוּ גַלָּיו
  choice: 波涛虽咆哮
  rationale: המה 描写轰鸣、喧腾；“咆哮”传达波浪的声势，并与前句形成平行。
- source_word: וְלֹא יַעַבְרֻנְהוּ
  choice: 却不能越过界限
  rationale: 将代词所指明示为前文海的界限，使中文清楚自然，并保留“越过”的空间意象。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文使用以色列上帝的四字神名，而非普通称号；“雅威”较直接地按现代学界通常复原读音音译，避免以称号取代专名。
- issue: אֲשֶׁר שַׂמְתִּי 与前句的句法关系
  choice: 是我把沙立作海的界限
  alternative: 你们在我——这位把沙立作海之界限的主——面前还不战兢吗
  rationale: 关系从句以第一人称动词“我设立”描述说话者。正文采用自然的第一人称强调句，但脚注保留把它作为前句同位说明的可能译法，不消除原文句法张力。
translation_notes:
  register: 采用庄重而清楚的现代标准普通话，以成对反问和“虽……却……”保留先知话语的节奏。用“敬畏”“战兢”“法令”等常用而有尊严的词语；避免过度文言化，也不把原文省略的“不能”擅自解释为特定神学结论。
