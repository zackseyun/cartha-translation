id: JER.5.12
reference: Jeremiah 5:12
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כִּֽחֲשׁוּ֙ בַּ/יהוָ֔ה וַ/יֹּאמְר֖וּ לֹא ה֑וּא וְ/לֹא תָב֤וֹא עָלֵ֨י/נוּ֙ רָעָ֔ה וְ/חֶ֥רֶב וְ/רָעָ֖ב ל֥וֹא נִרְאֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/005/012.yaml
  text: They have denied Yahweh and said, “He is not there, and no disaster will come upon us; we will not see sword or famine.”
translation:
  language: zh_hans
  text: 他们否认雅威，说：“他不在[a]；灾祸不会临到我们，我们也不会遭遇刀剑和饥荒。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他不会做什么”，或“不是他”。希伯来文十分简短，语意有所省略。
    reason: alternative_reading
lexical_decisions:
- source_word: כִּחֲשׁוּ בַּיהוָה
  choice: 否认雅威
  rationale: כחשׁ 与介词 ב 连用，可指否认某人或以虚假对待某人；下文直接否认雅威的作为和审判，因此译为“否认雅威”最贴合语境。
- source_word: לֹא הוּא
  choice: 他不在
  rationale: 原文极其简短，可能否认雅威的存在、临在或行动。“他不在”保留人称和省略性，没有在正文中明确限定为“他不会做什么”。
- source_word: רָעָה
  choice: 灾祸
  rationale: 在先知宣告审判的语境中，此词指临到人的灾难，而非道德意义上的邪恶。
- source_word: חֶרֶב
  choice: 刀剑
  rationale: 保留原文具体的暴力与战争意象；“刀剑”也是现代中文圣经语体中清楚而庄重的表达。
- source_word: רָעָב
  choice: 饥荒
  rationale: 此处指群体性的饥荒灾害，不只是个人感到饥饿。
- source_word: לֹא נִרְאֶה
  choice: 我们也不会遭遇
  rationale: ראה 的字面意思是“看见”，但在这里表示经历审判；译为“遭遇”更符合现代汉语，同时保留第一人称复数和否定语气。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；“雅威”作为音译，明确保留其专名性质。
- issue: 省略短语 לֹא הוּא 的解释
  choice: 他不在
  alternative: 他不会做什么；不是他
  rationale: 该短语可能是在否认雅威的存在、临在或有效行动。正文采用简短表达，并以脚注列出其他可能译法，避免消除原文的歧义和神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“灾祸临到”保留先知文学的审判语气；“遭遇刀剑和饥荒”则自然表达“看见”在此处所含的经历之意。
