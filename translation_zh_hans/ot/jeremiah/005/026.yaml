  text: כִּי נִמְצְא֥וּ בְ/עַמִּ֖/י רְשָׁעִ֑ים יָשׁוּר֙ כְּ/שַׁ֣ךְ יְקוּשִׁ֔ים הִצִּ֥יבוּ מַשְׁחִ֖ית אֲנָשִׁ֥ים יִלְכֹּֽדוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/005/026.yaml
  text: For wicked men are found among my people[a]; they lie in wait like fowlers. They set a trap[b]; they catch men.
translation:
  language: zh_hans
  text: 因为我民中有恶人；他们像捕鸟人一样潜伏窥伺[a]。他们设下害人的圈套[b]，捕捉人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文这句话较难确定，也可译作“他们窥伺，像捕鸟人蹲伏等候一样”。意思是他们隐蔽守候，要使猎物落入圈套。
    reason: lexical_alternative
  - marker: b
    text: “圈套”原文也可直译为“毁坏之物”或译作“网罗”；在这里指用来伤害并捕捉人的装置。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，说明先前控诉的缘由，保留因果或解释语气。
- source_word: נִמְצְאוּ בְעַמִּי
  choice: 我民中有
  rationale: 意译其存在于群体之中的结果状态；现代汉语自然简洁，同时保留“在我子民当中”的含义。
- source_word: רְשָׁעִים
  choice: 恶人
  rationale: 准确表达道德上的邪恶或有罪之人；“恶人”在现代汉语中庄重而通俗。
- source_word: יָשׁוּר כְּשַׁךְ יְקוּשִׁים
  choice: 他们像捕鸟人一样潜伏窥伺
  rationale: 原文短语艰涩，整体意象是捕鸟者隐蔽等候猎物；“潜伏窥伺”保留守候、观察和伺机捕捉的意味，不把具体姿势定得过死。
- source_word: הִצִּיבוּ
  choice: 设下
  rationale: 在捕猎语境中，指安放或布置捕捉装置；“设下”符合现代汉语搭配。
- source_word: מַשְׁחִית
  choice: 害人的圈套
  rationale: 该词本义带有毁坏、伤害意味，语境则指捕人的装置；此译兼顾破坏性和捕猎比喻。
- source_word: אֲנָשִׁים יִלְכֹּדוּ
  choice: 捕捉人
  rationale: 保留原文以人作为猎物的突兀意象，并延续捕鸟、设圈套的比喻。
