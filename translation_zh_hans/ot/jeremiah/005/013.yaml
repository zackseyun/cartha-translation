base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/005/013.yaml
  text: And the prophets will become wind[a], and the word is not in them; thus it will be done to them.
translation:
  language: zh_hans
  text: 先知必成为风[a]，话不在他们里面；必这样临到他们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “风”也可译作“灵”或“气息”。希伯来语 רוּחַ 可有这些含义；这里很可能是说先知空泛、没有实质。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַנְּבִיאִים
  choice: 先知
  rationale: 定冠词复数名词在上下文中指前述先知；汉语无需另加表示强调的“那些”或“他们自己”。
- source_word: יִהְיוּ לְרוּחַ
  choice: 必变得像风
  rationale: היה 与 לְ 连用有“成为、变成”的述谓作用；汉语加“像”可自然表达他们变得如风一般空泛、无实质，同时保留意象。
- source_word: רוּחַ
  choice: 风
  rationale: 该词可指风、灵或气息；此处与“话并不在他们里面”相配，“风”最能表达先知言语空泛、不实在的讥讽意味，其他可能义置于脚注。
- source_word: וְהַדִּבֵּר
  choice: 话
  rationale: 此处名词指所说的话或信息；“话”简洁自然，也保留原文未明确说明是谁的话这一开放性。
- source_word: אֵין בָּהֶם
  choice: 并不在他们里面
  rationale: 贴近原文的存在否定结构，不擅自把“话”明确为“耶和华的话”，从而保留语义张力。
- source_word: כֹּה יֵעָשֶׂה לָהֶם
  choice: 他们所说的必这样临到他们
  rationale: 原文直译为“必这样行在他们身上”。结合上下文，这可理解为先知所预言的灾祸反临到他们；译文补出汉语所需的关联，但不指定施行者。
theological_decisions:
- issue: רוּחַ 在谴责先知语境中的含义
  choice: 风
  alternative: 灵；气息
  rationale: “风”最符合空泛、无实质的讥讽语境，也避免无根据地引入圣灵之义；词本身的多义性在脚注中保留。
- issue: 末句 כֹּה יֵעָשֶׂה לָהֶם 的说话内容与指向
  choice: 他们所说的必这样临到他们
  alternative: 必这样待他们；愿这事这样临到他们
  rationale: 该句可作非人称被动，也可能承接民众对先知预言的轻蔑话：“他们所说的反临到他们。”主文采用符合上下文、在现代汉语中较清楚的表达，同时不明说施行者。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“必”体现预告语气；分号保留两组判断之间紧密而递进的关系。末句避免僵硬的被动式，同时以“临到”维持先知文学的肃穆语域。
