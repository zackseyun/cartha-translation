  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: לָ/כֵ֗ן כֹּֽה אָמַ֤ר יְהוָה֙ אֱלֹהֵ֣י צְבָא֔וֹת יַ֚עַן דַּבֶּרְ/כֶ֔ם אֶת הַ/דָּבָ֖ר הַ/זֶּ֑ה הִנְ/נִ֣י נֹתֵן֩ דְּבָרַ֨/י בְּ/פִ֜י/ךָ לְ/אֵ֗שׁ וְ/הָ/עָ֥ם הַ/זֶּ֛ה עֵצִ֖ים וַ/אֲכָלָֽתַ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/005/014.yaml
  text: 'Therefore thus says Yahweh[a], the God of hosts: Because you speak this word, behold, I am making my words in your mouth fire, and this people wood[c][b], and it will consume them.'
translation:
  language: zh_hans
  text: '所以，耶和华——万军的上帝如此说：


    “因为你们说了这话，[a]


    看哪，我要使我的话在你口中成为火；[b]


    使这百姓成为木柴；


    这火必吞灭他们。”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “你们说了这话”也可译作“你们说这话”。原文分词在此可按现在或近期过去理解。
    reason: lexical_alternative
  - marker: b
    text: “我要使我的话在你口中成为火”也可译作“我要把我的话放在你口中，作为火”。原文动词直译为“给”；这里表达上帝的话在先知口中如火一般发挥作用。
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: 所以
  rationale: 以自然的现代汉语承接上文并引出审判宣告。
- source_word: כֹּה אָמַר
  choice: 如此说
  rationale: 保留先知书中庄严的使者宣告格式。
- source_word: יְהוָה אֱלֹהֵי צְבָאוֹת
  choice: 万军之上帝耶和华
  rationale: “万军”保留 צְבָאוֹת 的军事与宇宙性含义；“耶和华”以现代中文通行的专名形式呈现四字神名。
- source_word: יַעַן דַּבֶּרְכֶם אֶת־הַדָּבָר הַזֶּה
  choice: 因为你们说了这话
  rationale: 复数后缀译作“你们”；分词在本语境中取近期已发生的语气，同时以脚注保留现在时理解。
- source_word: הִנְנִי
  choice: 看哪
  rationale: 保留宣告的突显作用和庄严语气。
- source_word: נֹתֵן דְּבָרַי בְּפִיךָ לְאֵשׁ
  choice: 我要使我放在你口中的话成为火
  rationale: 兼顾 נֹתֵן 的“放置／使成为”语义和 בְּפִיךָ 的单数形式，并以自然汉语表达比喻关系。
- source_word: הָעָם הַזֶּה עֵצִים
  choice: 使这百姓成为木柴
  rationale: 保留集体单数“这百姓”，并将 עֵצִים 译为适合燃烧意象的“木柴”。
- source_word: וַאֲכָלָתַם
  choice: 这火必吞灭他们
  rationale: 阴性单数主语回指“火”；补出“这火”以避免现代汉语中的指代含混，“吞灭”保留 אָכַל 的吞吃与毁灭意象。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 采用现代中文圣经读者最熟悉的专名形式，同时不以“主”这一称号替代原文神名。
- issue: 人称由复数转为单数
  choice: “你们”指前述说话者；“你”指先知耶利米
  alternative: 把两个代词都理解为同一集体对象
  rationale: 原文 דַּבֶּרְכֶם 为第二人称复数，而 בְּפִיךָ 为第二人称阳性单数；译文明确保留这一转换，不抹平其神学与叙事张力。
- issue: 火与木柴的审判隐喻
  choice: 上帝使先知口中的话成为火，使百姓成为木柴
  alternative: 仅泛化为上帝的话带来惩罚
  rationale: 保留原文具体而强烈的比喻，显明宣告之言作为审判工具的作用，而不另行界定实现方式。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。诗行分行呈现因由、行动和结果。“上帝”用于 אֱלֹהִים，“耶和华”用于专名 יְהוָה；避免古奥词语，同时保留“如此说”“看哪”等先知宣告的庄严标记。
