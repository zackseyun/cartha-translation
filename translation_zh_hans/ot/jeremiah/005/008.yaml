    reason: lexical_alternative
lexical_decisions:
- source_word: סוּסִים
  choice: 公马
  rationale: 该词本义为“马”；这里的比喻明确描写男性的淫欲，因此译作“公马”，既符合语境，也不必采用较专业的“种马”。
- source_word: מְיֻזָּנִים
  choice: 吃得肥壮
  rationale: 该被动分词表示被喂养、养得壮实；“吃得肥壮”自然地呈现饱足而精力充沛的形象。
- source_word: מַשְׁכִּים
  choice: 欲火旺盛
  rationale: 此词形和词义较难确定，可能与“早起”有关；结合全句的性欲比喻，正文用“欲火旺盛”传达其语境作用，同时在脚注保留较直译的可能。
- source_word: אִישׁ
  choice: 个个
  rationale: 这里是分配用法，表示每一个人；“个个”简洁自然，并与复数主语衔接。
- source_word: אֶל אֵשֶׁת רֵעֵהוּ
  choice: 向邻舍的妻子
  rationale: 保留介词的趋向含义，也清楚呈现觊觎他人妻子的奸淫语境。
- source_word: יִצְהָלוּ
  choice: 嘶鸣
  rationale: 该动词指马的叫声；“嘶鸣”保留先知刻意使用的动物性比喻及其羞辱力度。
theological_decisions:
- issue: 是否把马的意象直接释义为淫乱的人
  choice: 保留公马和嘶鸣的比喻
  alternative: 直译为“他们个个贪恋邻舍的妻子”
  rationale: 原文以马的行为揭露人的淫欲；保留意象能维持其修辞冲击力，不把先知的话简化为抽象释义。
translation_notes:
  register: 采用现代、庄重而直接的普通话。“欲火旺盛”明确传达语境中的性欲，却不使用粗俗措辞；“邻舍”保留圣经语体中关系与伦理层面的含义。
