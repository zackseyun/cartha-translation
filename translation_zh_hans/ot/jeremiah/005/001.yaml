id: JER.5.1
reference: Jeremiah 5:1
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: שׁוֹטְט֞וּ בְּ/חוּצ֣וֹת יְרוּשָׁלִַ֗ם וּ/רְאוּ נָ֤א וּ/דְעוּ֙ וּ/בַקְשׁ֣וּ בִ/רְחוֹבוֹתֶ֔י/הָ אִם תִּמְצְא֣וּ אִ֔ישׁ אִם יֵ֛שׁ עֹשֶׂ֥ה מִשְׁפָּ֖ט מְבַקֵּ֣שׁ אֱמוּנָ֑ה וְ/אֶסְלַ֖ח לָֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/005/001.yaml
  text: Roam through the streets of Jerusalem[a], and please look and know, and search in her squares, whether you can find a man, whether there is one who does justice, who seeks faithfulness[b], and I will forgive her.
translation:
  language: zh_hans
  text: 你们要在耶路撒冷的街道上来回走动；请察看，留心，并在城中的广场上搜寻，看是否能找到一个人[a]，是否有一个施行公正、寻求忠信[b]的人；我就赦免这城。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “一个人”对应希伯来语的单数阳性名词אִישׁ；这里强调的是即使一个这样的人也找不到。
    reason: lexical_alternative
  - marker: b
    text: “忠信”也可译作“诚实”或“真实”。希伯来语אֱמוּנָה可指忠诚、可靠或真实可信。
    reason: lexical_alternative
lexical_decisions:
- source_word: שׁוֹטְטוּ
  choice: 来回奔走
  rationale: 该复数命令式表示在城中四处往来查访，不只是走过一次；“来回奔走”保留了广泛搜寻的动态意味。
- source_word: בְּחוּצוֹת יְרוּשָׁלִַם
  choice: 在耶路撒冷的街上
  rationale: חוּצוֹת在城市语境中通常指街道或户外公共区域；与运动动词搭配时，“在……街上来回奔走”自然准确。
- source_word: וּרְאוּ נָא וּדְעוּ
  choice: 仔细察看，认真了解
  rationale: נָא带有催促、恳请或加强语气的作用，难以用一个自然的汉语虚词完全对应；以“仔细、认真”体现郑重催促。ידע在此不是抽象地“知道”，而是查明实际情形。
- source_word: וּבַקְשׁוּ בִרְחוֹבוֹתֶיהָ
  choice: 要在城中的广场上搜寻
  rationale: רְחֹבוֹת指城内宽阔的公共空间或广场；“城中的”清楚表达阴性代词所指的耶路撒冷，同时保持自然汉语。
- source_word: אִם תִּמְצְאוּ אִישׁ אִם יֵשׁ
  choice: 看看能不能找到一个人，哪怕有一个
  rationale: 两个אִם结构形成递进式查问，重点在能否找到哪怕一个符合条件的人；保留“一人”的单数强调。
- source_word: עֹשֶׂה מִשְׁפָּט
  choice: 秉公行事
  rationale: מִשְׁפָּט在这里指实际行为中的公正；“秉公行事”比生硬的“行公义”更符合现代汉语，同时保留伦理行动的含义。
- source_word: מְבַקֵּשׁ אֱמוּנָה
  choice: 追求忠信
  rationale: אֱמוּנָה可表示忠信、可靠或真实；“忠信”兼顾道德可靠和关系上的忠诚，并在脚注保留“诚实/真实”的可能。
- source_word: וְאֶסְלַח לָהּ
  choice: 我就赦免这城
  rationale: סלח意为赦免；阴性代词לָהּ回指耶路撒冷。汉语以“这城”明确所指，也保留城市被整体赦免的意义。
theological_decisions:
- issue: 单数男性名词אִישׁ的代表性
  choice: 一个人
  alternative: 任何人
  rationale: 希伯来文明确使用单数אִישׁ，重点是即使一个符合条件的人也找不到。现代汉语“一个人”既保留单数，又不必额外限定为成年男性；脚注说明原文形式及代表性含义。
- issue: 伦理语境中אֱמוּנָה的含义
  choice: 忠信
  alternative: 诚实；真实
  rationale: 该词兼有忠诚、可靠与真实可信等语义。在本节的伦理和关系语境中，“忠信”较完整，但原文的语义张力真实存在，故以脚注保留其他可能。
- issue: 赦免对象לָהּ
  choice: 这城
  alternative: 她
  rationale: 阴性单数代词回指耶路撒冷；汉语通常不用“她”指城市，因此译作“这城”，不改变耶路撒冷整体作为赦免对象的意义。
translation_notes:
  register: 采用庄重而清晰的现代标准汉语。“仔细察看，认真了解”传达连续命令及נָא的郑重催促；“秉公行事、追求忠信”保持先知性伦理语言，又避免过度宗派化。主文中的脚注标记[a]、[b]均已对应列出。
