source:
  edition: WLC
  text: אַשְׁפָּת֖/וֹ כְּ/קֶ֣בֶר פָּת֑וּחַ כֻּלָּ֖/ם גִּבּוֹרִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/005/016.yaml
  text: Their quiver is like an open grave[b][a]; all of them are mighty men.
translation:
  language: zh_hans
  text: 他们的箭袋如同敞开的坟墓[a]；他们个个都是勇士[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他的箭袋。”希伯来原文使用单数后缀，但所指的民族可作为一个集合体。
    reason: lexical_alternative
  - marker: b
    text: 或译：“他们个个都是战士。”
    reason: lexical_alternative
lexical_decisions:
- source_word: אַשְׁפָּתוֹ
  choice: 他们的箭袋
  rationale: 名词指盛箭的箭袋。后缀在形态上是第三人称阳性单数“他的”，但此处所指是作为集合体的入侵民族；现代汉语用“他们的”更自然，同时以脚注保留严格按单数理解的可能。
- source_word: כְקֶבֶר פָּתוּחַ
  choice: 如同敞开的坟墓
  rationale: כְ表示比拟；קֶבֶר是“坟墓”；פָּתוּחַ描写其处于敞开状态。“敞开的坟墓”既保留意象，也符合现代汉语表达。
- source_word: כֻּלָּם
  choice: 他们个个都
  rationale: 突出整个群体无一例外；“个个都”比直译“他们全都”更自然有力。
- source_word: גִּבּוֹרִים
  choice: 勇士
  rationale: 该阳性复数词在军事语境中指强健、英勇的战士。“勇士”简洁地保留其力量与作战含义，而不必另加“男人”。
theological_decisions:
- issue: גִּבּוֹרִים的阳性复数及军事含义
  choice: 勇士
  alternative: 强壮的人／战士
  rationale: 上下文所指为入侵军中的男性战斗人员。“勇士”在汉语中通常已含男性和军事色彩，既不刻意中性化，也避免生硬的“强壮男子”；脚注列出较直接的语境译法“战士”。
- issue: אַשְׁפָּתוֹ的单数后缀与集合所指
  choice: 正文译作“他们的箭袋”
  alternative: “他的箭袋”
  rationale: 希伯来语后缀为第三人称阳性单数，但可承接前文作为集合体的民族。正文按现代汉语集合指称译为复数，同时用脚注保留形态上更严格的单数译法，不消除原文张力。
translation_notes:
  register: 采用现代、庄重而清楚的书面汉语。“箭袋”“敞开的坟墓”保留原文鲜明的军事与死亡意象；分号维持两个短句之间紧密而有力的并列关系。
