id: JER.5.4
reference: Jeremiah 5:4
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/אֲנִ֣י אָמַ֔רְתִּי אַךְ דַּלִּ֖ים הֵ֑ם נוֹאֲל֕וּ כִּ֣י לֹ֤א יָדְעוּ֙ דֶּ֣רֶךְ יְהוָ֔ה מִשְׁפַּ֖ט אֱלֹהֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/005/004.yaml
  text: But I said[a], “Surely these are only the poor; they are foolish, for they do not know the way of Yahweh, the justice of their God.”
translation:
  language: zh_hans
  text: 但我说：“这些人不过是穷人；他们愚昧无知，因为他们不明白雅威的道路，也不明白他们上帝的公正[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“他们上帝的审判”或“他们上帝的典章”。希伯来语这个词可指公正、审判或法定的规范。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי אָמַרְתִּי
  choice: 但我说
  rationale: וַאֲנִי 标示话语转折，אָמַרְתִּי 通常指“说”；此处可自然理解为先知心里所说的话，无须改译为“我想”。
- source_word: אַךְ דַּלִּים הֵם
  choice: 这些人不过是贫穷人
  rationale: אַךְ 在此兼有断定和限定意味；“不过是”自然表达说话者起初将问题局限于贫穷人的判断。דַּלִּים 可指贫穷、低微或弱小的人，此处译“贫穷人”最贴合上下文。
- source_word: נוֹאֲלוּ
  choice: 他们愚昧无知
  rationale: 该词表示愚昧或行事愚妄；“愚昧无知”与随后“不明白”的原因从句衔接自然，也不把它缩减为单纯智力不足。
- source_word: כִּי לֹא יָדְעוּ
  choice: 因为他们不明白
  rationale: כִּי 引出前述判断的原因；ידע 在这里涉及对上帝道路和规范的认识，译作“不明白”比单纯“不知道”更自然。
- source_word: דֶּרֶךְ יְהוָה
  choice: 雅威的道路
  rationale: 保留希伯来语“道路”的惯用意象，涵盖雅威的作为、旨意和人应遵行的生活道路；神名 יְהוָה 音译为“雅威”。
- source_word: מִשְׁפַּט אֱלֹהֵיהֶם
  choice: 他们上帝的公正
  rationale: מִשְׁפָּט 可指公正、审判、判例或法定要求；正文采用“公正”以呈现伦理—司法层面的含义，同时用脚注保留其他真实可能。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华／主
  rationale: 原文直接使用四字神名；“雅威”以现代汉语常见形式音译该专名，不以称号替代。
- issue: מִשְׁפַּט 的语义范围
  choice: 公正
  alternative: 审判／典章
  rationale: 该词与“雅威的道路”并列，可指上帝公正的秩序，也可强调他的判决或规范。正文不将它具体化为某一法典，脚注保留语义张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留“道路”的圣经意象；用“不过是”传达 אַךְ 的限定语气。为使并列宾语在汉语中清楚，第二项补出“也不明白”。
