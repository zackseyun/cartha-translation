id: JER.5.7
reference: Jeremiah 5:7
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: אֵ֤י לָ/זֹאת֙ אסלוח לָ֔/ךְ בָּנַ֣יִ/ךְ עֲזָב֔וּ/נִי וַ/יִּשָּׁבְע֖וּ בְּ/לֹ֣א אֱלֹהִ֑ים וָ/אַשְׂבִּ֤עַ אוֹתָ/ם֙ וַ/יִּנְאָ֔פוּ וּ/בֵ֥ית זוֹנָ֖ה יִתְגֹּדָֽדוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/005/007.yaml
  text: How can I forgive you for this? Your children have forsaken me and have sworn by those that are not gods[a]. When I had fed them to the full[b], they committed adultery and crowded into a prostitute’s house.
translation:
  language: zh_hans
  text: “我怎能因此赦免你呢？你的儿女离弃了我，指着那些根本不是神的起誓。我使他们饱足[a]，他们却犯奸淫，成群拥进妓女的家[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我使他们起誓。”按马所拉元音，此处动词意为使人满足、饱足；若联系“起誓”的词根，也可有另一种理解。
    reason: 词源及元音分析所产生的译法差异
  - marker: b
    text: 或译：“他们成群聚集在妓女的家。”这里的动词含有结队、成群聚集的意思。
    reason: 动词意象的译法选择
lexical_decisions:
- source_word: אֵי לָזֹאת אסלוח לָךְ
  choice: 我怎能因此赦免你呢
  rationale: אֵי在这里表达反问和难以置信的语气；“怎能”比单纯的“为何”更贴切。保留第二人称单数，以反映原文把耶路撒冷或犹大视为一个整体来称呼。
- source_word: בָּנַיִךְ עֲזָבוּנִי
  choice: 你的儿女离弃了我
  rationale: בנים在这里泛指所称呼之城或国的居民，译作“儿女”自然且不限定男性；“离弃”保留盟约背叛的庄重含义。
- source_word: וַיִּשָּׁבְעוּ בְּלֹא אֱלֹהִים
  choice: 指着那些根本不是神的起誓
  rationale: 原文直陈他们以“不是神”的对象起誓，带有否定偶像神性的讽刺意味；“根本”自然传达其强烈的论断。
- source_word: וָאַשְׂבִּיעַ אוֹתָם
  choice: 我使他们饱足
  rationale: 按马所拉元音，动词来自שׂבע，意为使人满足、饱足；该译法与上帝供应丰足而百姓仍不忠的上下文相合，同时在脚注保留另一种词源理解。
- source_word: וַיִּנְאָפוּ
  choice: 他们却犯奸淫
  rationale: נאף通常指犯奸淫；不进一步限定为肉体淫乱或属灵背叛，从而保留耶利米书中两种意象可能交叠的张力。“却”显明他们在饱足之后反而背叛的反差。
- source_word: וּבֵית זוֹנָה יִתְגֹּדָדוּ
  choice: 成群拥进妓女的家
  rationale: זוֹנָה明确指妓女；“妓女的家”保留原文单数表达，不径直改成“妓院”。יתגדדו表示聚集成群，译作“成群拥进”兼顾其群聚形象和汉语自然度。
theological_decisions:
- issue: 奸淫是字面还是比喻
  choice: 保留“犯奸淫”，不指定仅指性犯罪、偶像崇拜或两者兼有
  alternative: 明确译为“属灵淫乱”或仅解释为实际的性不道德
  rationale: 先知话语可能刻意叠合婚姻不忠与盟约背叛；译文不应消除这种神学张力。
- issue: 受话者的数与身份
  choice: 以单数“你”称呼整体，再以复数“你的儿女”指其中居民
  alternative: 直接补出“耶路撒冷”或“犹大”，或全句改用复数称呼
  rationale: 原文采用阴性单数受话者，却以复数描述其儿女；中文可自然保留这一转换，无须补入本节未明说的地名。
- issue: 上帝使百姓饱足后仍遭背叛
  choice: 按马所拉读法译为“我使他们饱足”
  alternative: 译为“我使他们起誓”
  rationale: 主流元音传统及上下文支持“使饱足”，但由于相关词根在辅音形式上可与起誓用语发生关联，脚注保留该少数理解。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“赦免”“离弃”“起誓”“犯奸淫”保持先知话语的严肃力度；“妓女”比古雅的“娼妓”更现代。“成群拥进”呈现原文动作感，同时由脚注交代较形式对应的译法。
