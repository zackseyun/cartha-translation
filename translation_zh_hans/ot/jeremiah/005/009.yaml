base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/005/009.yaml
  text: Shall I not punish for these things? declares Yahweh[a]. And on a nation such as this[b], shall I not avenge myself?
translation:
  language: zh_hans
  text: “难道我不因这些事惩罚吗？”雅威说，“我岂不向这样的国报仇吗？”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “我”直译为“我的魂”，是希伯来语中鲜明地指“我自己”的说法；“报仇”所用动词带有反身/中动态色彩。句首连接词可较直译为：“而对于这样的国，我的魂岂不报仇吗？”
    reason: 说明“我的魂”的自我指称、动词的反身/中动态色彩，并保留连接词的较直译可能。
lexical_decisions:
- source_word: הַעַל אֵלֶּה
  choice: 难道我不该因这些事……吗
  rationale: 疑问词与介词עַל构成反问，עַל在此表达惩罚的缘由；“因这些事”自然保留了因果意义，אֵלֶּה则回指上文所述的罪行。
- source_word: אֶפְקֹד
  choice: 惩罚
  rationale: פקד在审判语境中指追究并施行惩罚；“惩罚”比直译为“察访”更清楚，也与下句“报仇”形成语义呼应。
- source_word: נְאֻם יְהוָה
  choice: 雅威说
  rationale: נְאֻם是庄严的先知宣告公式；“说”在现代汉语中自然简洁。יהוה按项目规范音译为神的专名“雅威”。
- source_word: וְאִם
  choice: 岂能
  rationale: 字面可译“而若”，但在平行反问中并非真实条件句，而是引出第二个加强语气的问题；“岂能”自然传达其反问力量。
- source_word: בְּגוֹי אֲשֶׁר כָּזֶה
  choice: 对于这样的国
  rationale: 介词בְּ标示报仇所针对的对象；“这样的国”保留比较指示语气及谴责意味。
- source_word: תִתְנַקֵּם נַפְשִׁי
  choice: 我岂能不亲自报仇
  rationale: נפשׁי在此是雅威对自己的鲜明指称，תִתְנַקֵּם为反身/中动态，意为“为自己报仇、施行报复”。汉语“亲自报仇”既自然，也保留神本人采取报应行动的强调；脚注说明原文“我的魂”的形象。
theological_decisions:
- issue: נַפְשִׁי用于神的拟人化自称
  choice: 正文译为“我……亲自”，脚注保留“我的魂”这一原文表达
  alternative: 我的魂岂能不报仇
  rationale: “我的魂”在希伯来语中可鲜明地指说话者本人。逐字移入现代汉语容易使读者误解为有关神之构成的陈述；“亲自”传达自我指称和强调，同时脚注保留原文意象与神学张力。
- issue: יהוה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 采用四字神名的音译，明确其为以色列之神的专名，而不以称号替代。
- issue: 神施行报复的措辞
  choice: 报仇
  alternative: 施行报应；伸冤
  rationale: נקם在此表达神针对犯罪之国施行报复性审判。“报仇”直接保留原文力度；不改译为较弱的泛称，也不把对象或法理进一步解释进正文。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。两个平行反问以“难道……吗”和“岂能……吗”呈现；保留“惩罚—报仇”的强烈司法语气，不将其弱化为抽象后果。
