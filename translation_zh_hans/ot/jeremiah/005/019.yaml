id: JER.5.19
reference: Jeremiah 5:19
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/הָיָה֙ כִּ֣י תֹאמְר֔וּ תַּ֣חַת מֶ֗ה עָשָׂ֨ה יְהֹוָ֧ה אֱלֹהֵ֛י/נוּ לָ֖/נוּ אֶת כָּל אֵ֑לֶּה וְ/אָמַרְתָּ֣ אֲלֵי/הֶ֗ם כַּ/אֲשֶׁ֨ר עֲזַבְתֶּ֤ם אוֹתִ/י֙ וַ/תַּעַבְד֞וּ אֱלֹהֵ֤י נֵכָר֙ בְּ/אַרְצְ/כֶ֔ם כֵּ֚ן תַּעַבְד֣וּ זָרִ֔ים בְּ/אֶ֖רֶץ לֹ֥א לָ/כֶֽם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/005/019.yaml
  text: And when you say[a], ‘Why has Yahweh our God done all these things to us?’ then you shall say to them, ‘Just as you have forsaken me and served foreign gods in your land, so you shall serve foreigners in a land not yours.’
translation:
  language: zh_hans
  text: 将来，当你们问：‘雅威我们的上帝为什么对我们做了这一切事？’你就要对他们说：‘你们怎样离弃我，在自己的土地上事奉外族的神明，也必照样在不属于你们的土地上服侍外族人[a]。’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “外族人”也可译作“外国人”或“异乡人”。这里的希伯来语指外族的人，与前面的“外族的神明”相对照。
    reason: 说明 זָרִים 在此处指人，并保留其可译范围及前后对照。
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: 将来……若
  rationale: 该习语引出未来可能发生的情形；如此译法既保留时间与条件意味，又符合现代汉语表达。
- source_word: תַּחַת מֶה
  choice: 为什么
  rationale: 这是询问原因的惯用表达，现代汉语以“为什么”最自然。
- source_word: עָשָׂה ... אֶת כָּל אֵלֶּה
  choice: 向我们行了这一切事
  rationale: 保留动词以及复数指示语所指的一系列审判之事；“向我们”表达事件临到他们。
- source_word: יְהֹוָה
  choice: 雅威
  rationale: 按希伯来文四字神名作音译，以区别于普通称号“主”。
- source_word: אֱלֹהֵינוּ
  choice: 我们的上帝
  rationale: 直接保留第一人称复数所属关系及其盟约关系色彩。
- source_word: וְאָמַרְתָּ אֲלֵיהֶם
  choice: 你就要对他们说
  rationale: 表达先问后答的次序，并保留对先知的指示语气。
- source_word: כַּאֲשֶׁר ... כֵּן
  choice: 怎样……也必照样
  rationale: 保留希伯来文前后呼应的比较结构，以及宣告后果的确定语气。
- source_word: עֲזַבְתֶּם אוֹתִי
  choice: 你们……离弃我
  rationale: “离弃”体现盟约背叛的严重性，而不把它弱化为普通的离开。
- source_word: וַתַּעַבְדוּ / תַּעַבְדוּ
  choice: 事奉／服侍
  rationale: 两处均源自 עבד。对神明用“事奉”，对人用“服侍”，既合乎汉语搭配，也使同一词根所形成的报应式平行仍清楚可见。
- source_word: אֱלֹהֵי נֵכָר
  choice: 外族的神明
  rationale: 该结构指外来民族的神；“外族的神明”明确而自然，也与后文“外族人”形成呼应。
- source_word: בְּאַרְצְכֶם
  choice: 在自己的土地上
  rationale: “自己的”使本国土地与后文“不属于你们的土地”之间的对照清楚显出。
- source_word: זָרִים
  choice: 外族人
  rationale: 此处指外国或异族的人，而非前半句的神明；结合“服侍”，表达在异国受外族辖制的审判。
- source_word: בְּאֶרֶץ לֹא לָכֶם
  choice: 在不属于你们的土地上
  rationale: 贴近原文否定所属关系的表达，并与“自己的土地”构成鲜明对照。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。音译“雅威”保留专名性质，也避免将其改为普通称号；不据此加入额外的宗派性解释。
- issue: עבד 在前后两处的关系
  choice: 以“事奉／服侍”保留同一动作的平行
  alternative: 前处译“敬拜”，后处译“作奴仆”
  rationale: 原文刻意重复同一词根，使偶像崇拜与在异地服侍外族人形成对应的审判。所选译法不把“奴役”程度说得超过原文，也不消除宗教语境。
- issue: זָרִים 的所指
  choice: 外族人
  alternative: 陌生人；外邦人
  rationale: 前文已有“外族的神明”，此处复数名词在“服侍”和异国土地的语境中最自然地指外国人或异族人，形成同词域的反讽对应。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。以“将来……若……就……”自然呈现先知话语中的未来情形；引语层次清楚。前后使用“事奉／服侍”体现同一希伯来词根在不同宾语下的汉语搭配，并保留原文的报应式对称。
