  text: וְ/גַ֛ם בַּ/יָּמִ֥ים הָ/הֵ֖מָּה נְאֻם יְהֹוָ֑ה לֹֽא אֶעֱשֶׂ֥ה אִתְּ/כֶ֖ם כָּלָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/005/018.yaml
  text: Yet even in those days[a], declares Yahweh, I will not make a full end of you.
translation:
  language: zh_hans
  text: 然而，即使在那些日子，雅威宣告：“我也不会将你们灭尽。[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我不会彻底毁灭你们。”希伯来文直译近于：“我不会对你们施行彻底的毁灭。”
    reason: 说明עשה与כלה在此构成表示彻底毁灭的惯用语，并以自然中文较准确地保留原文结构。
lexical_decisions:
- source_word: וְגַם
  choice: 然而，即使
  rationale: וְ兼具承接作用，גַם带有加强语气；结合上文严厉的审判宣告，“然而，即使”自然表达转折中的强调，同时保留与前文的联系。
- source_word: בַּיָּמִים הָהֵמָּה
  choice: 在那些日子
  rationale: 这是指向所谈时期的常见时间表达；“在那些日子”既自然，也保留先知文学的庄重语体。
- source_word: נְאֻם יְהוָה
  choice: 雅威宣告
  rationale: נְאֻם是先知话语中庄严的宣告公式；译作“宣告”比一般的“说”更能体现其正式语气。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以常见音译呈现四字神名，保留其作为以色列之神专名的性质，而不以称号替代。
- source_word: לֹא אֶעֱשֶׂה אִתְּכֶם כָּלָה
  choice: 我也不会将你们灭尽
  rationale: עשה与כלה在这里构成表示彻底终结或毁灭的惯用语。“灭尽”简洁自然，传达不会把百姓完全消灭的含义；“你们”保留原文第二人称复数。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 采用音译以保留原文的个人神名，不以称号代替，也不借此加入宗派性解释。
- issue: 审判是否导致彻底灭绝
  choice: 我也不会将你们灭尽
  alternative: 我不会彻底毁灭你们
  rationale: 原文既确认严厉审判，又明确限制其最终程度。译文保留这种张力，不把审判弱化，也不暗示百姓将被完全消灭。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“然而，即使”承接上文并突出审判中的保留；引号清楚标示雅威的直接发言。
