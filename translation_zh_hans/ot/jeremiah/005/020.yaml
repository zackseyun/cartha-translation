  yaml_path: translation/ot/jeremiah/005/020.yaml
  text: 'Declare this in the house of Jacob[a], and proclaim it in Judah, saying:'
translation:
  language: zh_hans
  text: 你们要在雅各家宣告这事，也要在犹大传扬，说：
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַגִּידוּ
  choice: 宣告
  rationale: 这是复数祈使式，要求公开传达信息；“宣告”既保留郑重、公开的语气，也符合现代汉语表达。
- source_word: זֹאת
  choice: 这事
  rationale: 阴性单数指示代词在此指向将要宣告的内容；译作“这事”比单独的“这”更自然。
- source_word: בְּבֵית יַעֲקֹב
  choice: 在雅各家
  rationale: “雅各家”是对雅各后裔、即以色列民的集体称呼；保留这一盟约群体称谓，并按介词的通常意义译为“在”。
- source_word: וְהַשְׁמִיעוּהָ
  choice: 也要……传扬
  rationale: 这是שׁמע的使役形复数祈使式，字面义为“使人听见它”。“传扬”自然表达公开使众人听见的含义；宾语“这事”由前文承接，在汉语中不必重复。
- source_word: בִיהוּדָה
  choice: 在犹大
  rationale: 介词ב在此最自然地表示宣告发生的范围；“犹大”可指当地及其人民，译文保留这种可能的双重指向。
- source_word: לֵאמֹר
  choice: 说：
  rationale: 这是引出下文宣告内容的常用引语形式；译作“说：”简明并保留与下一节的衔接。
