revisions:
- from: 你要对他们说：“以色列的上帝、万军之耶和华如此说：看哪，我必差人召来巴比伦王尼布甲尼撒，就是我的仆人；我要把他的宝座安置在我藏下的这些石头上方，他必在其上张开华盖[a]。”
  to: 你要对他们说：“以色列的上帝、万军之耶和华如此说：看哪，我必差遣人，把巴比伦王尼布甲尼撒——我的仆人——带来；我要把他的宝座安置在我所藏的这些石头上方；他必在这些石头上方张设他的华盖[a]。”
  rationale: 修订仅调整“差人召来”以更直接反映“差遣／带来”的动词序列，改善“藏下”的现代汉语自然度，并消除末句代词指向的歧义。保留神名、王名、‘我的仆人’及罕见词脚注，不对尼布甲尼撒的身份作额外神学解释。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T07:29:19Z'
review_pass:
  verdict: revise
  source_fidelity: “差人召来”虽传达耶和华使尼布甲尼撒前来的意思，但“召来”并非原文两个动词（“差遣／带来”）的直接对应，且把“差遣”的受事和方式改写得较多。改为“差遣人，把……带来”较清楚地保留原文的连续行动及其使役含义。其余主要对应准确：神名与称号、‘我的仆人’、宝座与石头的空间关系，以及罕见词的语义不确定性均得到保留。
  naturalness: 正文庄重而基本自然。“我所藏的这些石头”比“我藏下的这些石头”更合乎现代书面汉语；将末句明确为“在这些石头上方张设”，避免“其上”在中文中可能误指宝座。
  terminology: “以色列的上帝、万军之耶和华”“尼布甲尼撒”“我的仆人”“宝座”均恰当且语域一致。“华盖”可作为暂定主译，但因原词罕见且释义存疑，脚注应保留“亭帐、王帐、覆盖物”等可能性。
  issues:
  - severity: medium
    issue: “我必差人召来”对“我正在差遣／将带来”的处理偏解释性。
    rationale: 原文并未明说“召”；“差遣人”可作为汉语表达中隐含使役的必要展开，但应以“把……带来”保留第二动词的实际结果，而非改为“召来”。
  - severity: low
    issue: “我藏下的”略显不自然，且“其上”指代可有歧义。
    rationale: “我所藏的”更自然地表达完成的隐藏动作；明确“这些石头上方”可准确对应末尾复数代词，不会被理解为覆盖宝座。
