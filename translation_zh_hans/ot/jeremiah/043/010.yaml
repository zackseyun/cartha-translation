source:
  edition: WLC
  text: וְ/אָמַרְתָּ֣ אֲלֵי/הֶ֡ם כֹּֽה אָמַר֩ יְהוָ֨ה צְבָא֜וֹת אֱלֹהֵ֣י יִשְׂרָאֵ֗ל הִנְ/נִ֤י שֹׁלֵ֨חַ֙ וְ֠/לָקַחְתִּי אֶת נְבוּכַדְרֶאצַּ֤ר מֶֽלֶךְ בָּבֶל֙ עַבְדִּ֔/י וְ/שַׂמְתִּ֣י כִסְא֔/וֹ מִ/מַּ֛עַל לָ/אֲבָנִ֥ים הָ/אֵ֖לֶּה אֲשֶׁ֣ר טָמָ֑נְתִּי וְ/נָטָ֥ה אֶת שפרור/ו עֲלֵי/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/043/010.yaml
  text: 'And say to them[a], ‘Thus says Yahweh of hosts, the God of Israel: Behold, I am sending and will take Nebuchadnezzar king of Babylon, my servant, and I will set his throne above these stones that I have hidden, and he will spread his canopy over them.’'
translation:
  language: zh_hans
  text: 你要对他们说：“以色列的上帝、万军之耶和华如此说：看哪，我必差遣人，把巴比伦王尼布甲尼撒——我的仆人——带来；我要把他的宝座安置在我所藏的这些石头上方；他必在这些石头上方张设他的华盖[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “华盖”所译的希伯来词十分罕见，也可理解为“亭帐”“王帐”，或君王张设的另一种覆盖物。
    reason: 原词罕见，确切所指不明，需保留词义上的多种可能。
lexical_decisions:
- source_word: יְהוָה צְבָאוֹת
  choice: 万军之耶和华
  rationale: 以“耶和华”保留神的专名，并采用现代中文圣经语域中通行的“万军之”表达 צְבָאוֹת；既庄重，也不把所指局限为人间军队。
- source_word: הִנְנִי שֹׁלֵחַ וְלָקַחְתִּי
  choice: 看哪，我必差人召来
  rationale: הִנְנִי 带出郑重而迫近的宣告，译作“看哪”；שׁלח 与 לקח 连用在此表示耶和华主动差遣并取来这位君王，中文以“差人召来”自然表达这一使役性行动，避免生硬的“差遣并拿取”。
- source_word: עַבְדִּי
  choice: 我的仆人
  rationale: 保留原文将尼布甲尼撒称为神之“仆人”的张力，表明他是神所使用的工具，却不额外暗示其敬虔、守约或得到道德认可。
- source_word: כִסְאוֹ
  choice: 他的宝座
  rationale: 语境明确涉及君王临到并施行统治，“宝座”比一般的“座位”更准确。
- source_word: מִמַּעַל לָאֲבָנִים הָאֵלֶּה
  choice: 在……这些石头上方
  rationale: 保留 מִמַּעַל 的空间关系；不武断说明宝座是否直接放在石头表面。
- source_word: טָמָנְתִּי
  choice: 我藏下的
  rationale: 动词表示隐藏、埋藏；“藏下”既呼应上文埋藏石头的动作，也不比原词更具体地限定埋藏方式。
- source_word: שפרורו
  choice: 他的华盖
  rationale: 这是罕见且词义不完全确定的词，可能指君王张设的华盖、帐幕或亭帐。“华盖”能体现王室覆盖物的意象，同时以脚注保留词义不确定性。
- source_word: וְנָטָה
  choice: 张开
  rationale: נטה 常指伸展、铺开；与覆盖物搭配时，“张开”符合现代汉语表达。
theological_decisions:
- issue: 尼布甲尼撒被称为 עַבְדִּי
  choice: 直译为“我的仆人”
  alternative: 译作“我的奴仆”或解释性改写为“我所使用的工具”
  rationale: “我的仆人”既保留尼布甲尼撒从属于耶和华并受其使用的含义，也不消除异教君王被神如此称呼所产生的神学张力；经文本身并未因此肯定他的信仰或品德。
translation_notes:
  register: 采用现代、庄重而易懂的普通话书面语。“如此说”“看哪”保留先知宣告的郑重语气；“差人召来”使希伯来语连用动词在中文中自然通顺。脚注标记 [a] 已置于正文对应词后。
