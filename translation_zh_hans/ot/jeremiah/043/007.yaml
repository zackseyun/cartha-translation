id: JER.43.7
reference: Jeremiah 43:7
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יָּבֹ֨אוּ֙ אֶ֣רֶץ מִצְרַ֔יִם כִּ֛י לֹ֥א שָׁמְע֖וּ בְּ/ק֣וֹל יְהוָ֑ה וַ/יָּבֹ֖אוּ עַד תַּחְפַּנְחֵֽס־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/043/007.yaml
  text: So they entered the land of Egypt[a], for they did not listen to the voice of Yahweh, and they came as far as Tahpanhes.
translation:
  language: zh_hans
  text: 于是，他们进入埃及地，因为他们不听雅威的话[a]，一直来到答比匿。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“不听从雅威”。希伯来语“不听……的声音”这一惯用语可含有拒绝服从的意思。
    reason: 说明希伯来语惯用语的字面意象及其顺从含义。
lexical_decisions:
- source_word: וַיָּבֹאוּ אֶרֶץ מִצְרַיִם
  choice: 他们进入埃及地
  rationale: בוא 与“埃及地”连用，表示进入一个地域；译为“进入”自然地表达这一方向，并保留 אֶרֶץ 的“地”这一成分。
- source_word: כִּי
  choice: 因为
  rationale: 此处引出他们进入埃及地的原因，现代汉语用“因为”清楚自然。
- source_word: לֹא שָׁמְעוּ בְּקוֹל
  choice: 不听……的话
  rationale: 这一希伯来语惯用语字面涉及“听声音”，语义常包含听从、服从；“不听……的话”既自然，又保留“听”与拒绝顺从之间的张力。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文四字神名作音译，保留其作为上帝专名的性质，而不以称号代替。
- source_word: וַיָּבֹאוּ עַד
  choice: 一直来到
  rationale: עַד 表示行程所达到的地点或界限；“一直来到”传达抵达该处的延伸意味。
- source_word: תַּחְפַּנְחֵס
  choice: 答比匿
  rationale: 采用该埃及地名在简体中文圣经传统中通行且易辨认的译名。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”较贴近学界通常重构的读音，并明确保留其专名性质。
- issue: שמע בקול 是否明确译作“服从”
  choice: 不听……的话
  alternative: 不服从
  rationale: 该惯用语确实包含拒绝顺从之意，但译文保留“听”的原文意象，不把其语义张力完全收窄为“服从”；脚注说明其含义。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“于是”承接前文叙事；“一直来到”表达 עַד 所标示的行程终点。脚注标记置于其实际说明的“不听雅威的话”之后。
