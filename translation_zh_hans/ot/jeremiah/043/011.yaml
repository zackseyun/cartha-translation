  text: ו/בא/ה וְ/הִכָּ֖ה אֶת אֶ֣רֶץ מִצְרָ֑יִם אֲשֶׁ֧ר לַ/מָּ֣וֶת לַ/מָּ֗וֶת וַ/אֲשֶׁ֤ר לַ/שְּׁבִי֙ לַ/שֶּׁ֔בִי וַ/אֲשֶׁ֥ר לַ/חֶ֖רֶב לֶ/חָֽרֶב־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/043/011.yaml
  text: 'He will come and strike the land of Egypt: those for death[a], to death; those for captivity, to captivity; and those for the sword, to the sword.'
translation:
  language: zh_hans
  text: 他必来攻击埃及地：归于死亡的，归于死亡[a]；归于被掳的，归于被掳；归于刀剑的，归于刀剑。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“凡归于死亡的，归于死亡；凡归于被掳的，归于被掳；凡归于刀剑的，归于刀剑。”希伯来文使用简短、重复的判决公式。
    reason: 说明该短语可按“凡……的”理解，并保留希伯来文重复的归属／判决结构，不将其解释为道德上的“该受”。
lexical_decisions:
- source_word: וּבָאָה
  choice: 他必来
  rationale: 阳性单数动词在先知叙事序列中指向将来的行动；依上下文，主语是巴比伦王。译作“必来”既表达将来语气，也保留宣告的确定性。
- source_word: וְהִכָּה
  choice: 攻击
  rationale: נכה基本义为“击打、打击”。此处宾语是“埃及地”，语境涉及军事入侵，因此“攻击”比字面的“击打”更符合现代汉语，同时不限定具体作战方式。
- source_word: אֶת־אֶרֶץ מִצְרַיִם
  choice: 埃及地
  rationale: 保留אֶרֶץ“地、国土”，表明受攻击的是埃及全境，而不只笼统译作“埃及”。
- source_word: אֲשֶׁר לַמָּוֶת לַמָּוֶת
  choice: 该死的，必死
  rationale: 希伯来文使用简短而重复的判决格式。汉语以“该……的，必……”呈现其分配性、确定性和严厉节奏。
- source_word: וַאֲשֶׁר לַשְּׁבִי לַשֶּׁבִי
  choice: 该被掳的，必被掳
  rationale: שְׁבִי指被俘、被掳的处境；“被掳”比“流亡”更准确地保留遭俘虏之意，并与其余判决形成平行。
- source_word: וַאֲשֶׁר לַחֶרֶב לֶחָרֶב
  choice: 该遭刀剑的，必遭刀剑
  rationale: חֶרֶב直译为“刀剑”，在此可转指战争中的暴力死亡。保留“刀剑”既保存原文意象，也维持三重平行结构。
theological_decisions:
- issue: 阳性单数主语所指
  choice: 译作“他”，按上下文指巴比伦王，即施行审判的工具。
  alternative: 可直接译作“尼布甲尼撒”，或采用不明确主语的表达。
  rationale: 原文只有阳性单数动词，并未在本节重复专名。译作“他”让上下文说明所指，避免把专名增入经文，也不抹去他作为行动者的角色。
- issue: 判决公式是否表达预定论意味
  choice: 用“该……的，必……”保留各人归于相应结局的判决语气，但不进一步说明其因果或预定机制。
  alternative: 译作“注定要……的，就……”会更明确地加入“命定”含义。
  rationale: 介词ל与重复名词构成的简约公式确实表达对应的结局，却没有解释这些结局如何决定；译文应保留这种神学张力，不作额外推论。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“该……的，必……”形成三重平行，传达原文简短严厉的宣告；“遭刀剑”保留古代战争意象，但在现代汉语中仍可理解。脚注标记[a]已置于正文相应位置。
