  naturalness: “他必来攻击埃及地”庄重且自然。“归于……的，归于……”略带经文体，但在这一刻意简短、重复的判决公式中清楚可懂，并比“该……的”更不易误解。
  terminology: “埃及地”“被掳”“刀剑”均合乎圣经汉语惯用语并忠实对应原文。“归于死亡”避免把“死亡”误作有罪者应受的刑罚。
