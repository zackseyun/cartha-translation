id: JER.43.6
reference: Jeremiah 43:6
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: אֶֽת הַ֠/גְּבָרִים וְ/אֶת הַ/נָּשִׁ֣ים וְ/אֶת הַ/טַּף֮ וְ/אֶת בְּנ֣וֹת הַ/מֶּלֶךְ֒ וְ/אֵ֣ת כָּל הַ/נֶּ֗פֶשׁ אֲשֶׁ֤ר הִנִּ֨יחַ֙ נְבוּזַרְאֲדָ֣ן רַב טַבָּחִ֔ים אֶת גְּדַלְיָ֖הוּ בֶּן אֲחִיקָ֣ם בֶּן שָׁפָ֑ן וְ/אֵת֙ יִרְמְיָ֣הוּ הַ/נָּבִ֔יא וְ/אֶת בָּר֖וּךְ בֶּן נֵרִיָּֽהוּ־־־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/043/006.yaml
  text: the men[a], the women, the little children, the king’s daughters, and every person whom Nebuzaradan the captain of the guard had left with Gedaliah son of Ahikam, son of Shaphan, and Jeremiah the prophet[c][b], and Baruch son of Neriah—
translation:
  language: zh_hans
  text: 男人、女人、幼童[a]、王的女儿们，以及护卫长[b]尼布撒拉旦留在沙番的儿子亚希甘的儿子基大利那里的所有人[c]，还有先知耶利米和尼利亚的儿子巴录——
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“孩子”；希伯来语 טַף 可指幼小的孩子，也可较广地指受抚养的孩童。
    reason: lexical_alternative
  - marker: b
    text: 希伯来语字面为“屠宰者（或行刑者）之长”，是一个官职名称，通常译作“护卫长”。
    reason: cultural_note
  - marker: c
    text: 希伯来语字面为“每一个人”或“每一性命（魂）”；这里是指所有的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַגְּבָרִים
  choice: 男人
  rationale: 在与女人、幼童并列的群体清单中，指成年男性；不应缩窄为“士兵”。
- source_word: הַנָּשִׁים
  choice: 女人
  rationale: 原词泛指女性，此处没有足够依据限定为“妻子”。
- source_word: הַטַּף
  choice: 幼童
  rationale: טַף通常指幼小的孩子，也可较广地涵盖受抚养的孩童；正文采用自然简洁的“幼童”，并以脚注保留较宽泛的可能。
- source_word: בְּנוֹת הַמֶּלֶךְ
  choice: 王的众女儿
  rationale: 贴近原文“王的女儿们”，避免用“公主”作进一步的身份概括。
- source_word: כָּל הַנֶּפֶשׁ
  choice: 所有人
  rationale: נֶפֶשׁ在此按希伯来语习惯指人或性命，并非专指非物质的“灵魂”；“所有人”符合现代汉语。
- source_word: הִנִּיחַ
  choice: 留在……那里
  rationale: 保留动词“留下”的基本含义；上下文可表达这些人被留在基大利监管范围内，但不在正文中明确增译“交托”。
- source_word: רַב טַבָּחִים
  choice: 护卫长
  rationale: 这是新巴比伦官职名称；“护卫长”能自然表达其职务功能，脚注说明其字面构成。
- source_word: אֶת גְּדַלְיָהוּ בֶּן אֲחִיקָם בֶּן שָׁפָן
  choice: 在沙番的孙子、亚希甘的儿子基大利那里
  rationale: 按汉语亲属关系自然重组谱系，同时保留“留在基大利那里”所具有的关系与监管含义。
- source_word: יִרְמְיָהוּ הַנָּבִיא
  choice: 先知耶利米
  rationale: 保留原文明确给出的职分称号，并采用现代汉语自然词序。
- source_word: בָּרוּךְ בֶּן נֵרִיָּהוּ
  choice: 尼利亚的儿子巴录
  rationale: 保留希伯来式父子身份信息，并采用通行的中文专名译法。
theological_decisions:
- issue: “留在基大利那里”是否明确表示委托监管
  choice: 保留“留在……那里”的表达
  alternative: 交托给基大利管理
  rationale: 原动词首先表示“留下、使留下”；上下文虽暗示基大利的管辖，却不宜把这种关系在正文中解释得比原文更明确。
- issue: נֶפֶשׁ是否译为“灵魂”
  choice: 所有人
  alternative: 所有灵魂
  rationale: 此处是在清点被带走的人，נֶפֶשׁ是指人的希伯来语表达；译作“灵魂”会在现代汉语中引入原文此处并不强调的身心二分含义。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。以顿号组织名单，以“沙番的孙子、亚希甘的儿子基大利”清楚呈现谱系；句末保留破折号，反映本节在句法上接续上下文。
