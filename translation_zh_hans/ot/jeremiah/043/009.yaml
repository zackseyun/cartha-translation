base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/043/009.yaml
  text: Take large stones in your hand and hide them in the mortar[a], in the brick pavement that is at the entrance of Pharaoh’s house in Tahpanhes[c][b], before the eyes of the Jewish men.
translation:
  language: zh_hans
  text: “你要亲手拿几块大石头，把它们藏在答比匿法老宫门口的砖铺地面[b]里的灰浆[a]中，当着犹大人的面。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “藏”也可译作“埋”；希伯来语动词可指把东西放进地下或建筑结构中，使其隐没。
    reason: lexical_alternative
  - marker: b
    text: “砖铺地面”也可译作“砖砌结构”或“砖台”，也可能指“砖窑”；这个希伯来语词很少见，确切的建筑含义不能确定。
    reason: lexical_alternative
lexical_decisions:
- source_word: קַח בְּיָדְךָ
  choice: 你手里拿
  rationale: 保留单数“手”和命令语气；现代汉语自然表达为“你手里拿”。
- source_word: אֲבָנִים גְּדֹלוֹת
  choice: 几块大石头
  rationale: “大石头”准确表达尺寸；汉语量词“块”使表达自然，复数由“几块”体现。
- source_word: וּטְמַנְתָּם
  choice: 把它们藏在
  rationale: טמן指将物件置于地下或结构中使其隐没；“藏”保留比“埋”更宽的语义，另义收入脚注。
- source_word: בַּמֶּלֶט
  choice: 灰浆里
  rationale: מֶלֶט在此建筑语境中最可能指砌筑或抹面的灰浆；避免使用可能带现代工业色彩的“水泥”。
- source_word: בַּמַּלְבֵּן
  choice: 砖铺地面
  rationale: מַלְבֵּן罕见且建筑学含义不确定；结合宫门口和灰浆的语境，“砖铺地面”是较合适的正文选择，同时以脚注保留其他可能。
- source_word: אֲשֶׁר בְּפֶתַח בֵּית פַּרְעֹה
  choice: 法老宫门口
  rationale: 字面为“法老之家的入口”；在该行政建筑语境中，“宫门口”简洁自然，但不额外限定为私人住所。
- source_word: בְּתַחְפַּנְחֵס
  choice: 答比匿
  rationale: 采用现代中文圣经传统中较通行的地名音译。
- source_word: לְעֵינֵי
  choice: 当着……的面
  rationale: 自然表达“在……眼前”，并保留行动须公开让人看见的意味。
- source_word: אֲנָשִׁים יְהוּדִים
  choice: 犹大人
  rationale: 在此历史语境下指来自犹大或属于犹大群体的人；中文“犹大人”保留地域—族群含义，不必把阳性复数名词机械译成“男人”。
