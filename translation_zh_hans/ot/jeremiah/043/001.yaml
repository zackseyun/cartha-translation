base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/043/001.yaml
  text: And when Jeremiah had finished speaking to all the people all the words of Yahweh their God[a], with which Yahweh their God had sent him to them—all these words—
translation:
  language: zh_hans
  text: 耶利米向全体百姓说完了雅威——他们的上帝——差遣他到他们那里去传达的一切话，就是所有这些话之后，——
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי כְּכַלּוֹת
  choice: ……说完了……之后
  rationale: וַיְהִי承接叙事，כ加不定词כַלּוֹת表示前一行动完成后随即进入下一事件；现代汉语用“……之后”自然表达这一时间关系。
- source_word: כָּל הָעָם
  choice: 全体百姓
  rationale: 这里指当时聚集并听耶利米讲话的全体民众；“百姓”符合先知叙事语境，也比“民族”更具体。
- source_word: אֶת כָּל דִּבְרֵי יְהוָה
  choice: 雅威……的一切话
  rationale: דְּבָרִים在这里是先知所传的言语，译作“一切话”保留原文具体措辞；יְהוָה音译为“雅威”，保留神的专名。
- source_word: אֱלֹהֵיהֶם
  choice: 他们的上帝
  rationale: 虽具有复数形态，但在“雅威”之后作同位说明，语义明确为单数。
- source_word: אֲשֶׁר שְׁלָחוֹ יְהוָה אֱלֹהֵיהֶם אֲלֵיהֶם
  choice: 雅威他们的上帝吩咐他向他们传达的
  rationale: שְׁלָחוֹ字面是“差遣他”，关系从句修饰前面的“话”。汉语译为“吩咐他向他们传达”既保留差遣使命的含义，也清楚说明这些话是所传内容。
- source_word: אֵת כָּל הַדְּבָרִים הָאֵלֶּה
  choice: 就是这一切话
  rationale: 该短语以同位方式重复前面的“一切话”，形成强调；用“就是”呈现同位关系，并保留重复。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；音译“雅威”较接近现代学界通常重构的读音，并保留其作为专名的性质，不以称号替代。
- issue: אֱלֹהֵיהֶם与百姓关系的表达
  choice: 他们的上帝
  alternative: 上帝
  rationale: 保留原文两次出现的所属关系，不弱化经文中“雅威是他们的上帝”这一带有张力的称谓，即使下文百姓拒绝顺从。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。保留原文末尾未完句式，以破折号承接下一节；同时保留“一切话”的同位重复，不另加脚注，因为正文已直接呈现其强调效果。
