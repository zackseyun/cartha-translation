base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/043/002.yaml
  text: Azariah son of Hoshaiah, Johanan son of Kareah, and all the arrogant men said to Jeremiah, “You are speaking a lie. The LORD our God has not sent you to say, ‘You must not go to Egypt to sojourn there.’”
translation:
  language: zh_hans
  text: 何沙雅的儿子亚撒利雅、加利亚的儿子约哈难，以及所有狂傲的人，对耶利米说：“你说的是谎话！耶和华我们的上帝没有差遣你来吩咐我们说：‘你们不可到埃及去寄居。’”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַזֵּדִים
  choice: 狂傲的人
  rationale: 该词指傲慢、擅越本分之人；“狂傲”既保留强烈贬义，也符合现代中文叙事语体。
- source_word: שֶׁקֶר אַתָּה מְדַבֵּר
  choice: 你说的是谎话
  rationale: 直陈对方所言为虚假，保持原文指控的尖锐语气，比仅说“你说得不对”更准确。
- source_word: יְהוָה אֱלֹהֵינוּ
  choice: 耶和华我们的上帝
  rationale: 以“耶和华”呈现神圣名号，以“上帝”表达 אֱלֹהִים，并保留“我们的”所体现的群体认信及其反讽张力。
- source_word: לָגוּר שָׁם
  choice: 到埃及寄居
  rationale: גור 表示以外来者身份暂住或居留；“寄居”保留这种非本土、未必永久定居的含义。
- source_word: לֹא תָבֹאוּ
  choice: 你们不可到
  rationale: 复数未完成式在所引命令中表达禁止；“不可”自然而庄重，并明确其规范性力量。
theological_decisions:
- issue: 说话者一面称“耶和华我们的上帝”，一面否认先知受差遣所形成的张力
  choice: 原样保留“耶和华我们的上帝”及“并没有差遣你”
  alternative: 通过措辞暗示他们虚伪或不信
  rationale: 原文让人物自己的言语显出张力，译文不额外判定其内心动机。
- issue: לֹא תָבֹאוּ 的禁止力度
  choice: 译作“你们不可到”
  alternative: “不要到”或“你们一定不可到”
  rationale: “不可”清楚表达禁令，又不添加希伯来文本未明说的强化副词。
translation_notes:
  register: 采用现代、庄重而易懂的叙事中文。人名依常见《圣经》汉语译名处理；直接引语保持激烈指控的语气。无需脚注。
