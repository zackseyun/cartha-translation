  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/הִצַּ֣תִּי אֵ֗שׁ בְּ/בָתֵּי֙ אֱלֹהֵ֣י מִצְרַ֔יִם וּ/שְׂרָפָ֖/ם וְ/שָׁבָ֑/ם וְ/עָטָה֩ אֶת אֶ֨רֶץ מִצְרַ֜יִם כַּ/אֲשֶׁר יַעְטֶ֤ה הָֽ/רֹעֶה֙ אֶת בִּגְד֔/וֹ וְ/יָצָ֥א מִ/שָּׁ֖ם בְּ/שָׁלֽוֹם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/043/012.yaml
  text: And he will set fire to the temples of the gods of Egypt[a], and he will burn them and carry them away. He will wrap himself in the land of Egypt as a shepherd wraps himself in his garment[b], and he will go out from there in peace.
translation:
  language: zh_hans
  text: 我必在埃及诸神的庙宇中点火[a]；他必焚烧它们，将它们掳去[b]。他必披上埃及地，就像牧人披上自己的衣服；他必平安地离开那里。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文是“我必在埃及诸神的庙宇中点火”。因上下文以巴比伦王为行动者，也可译作“他必……点火”。
    reason: 说明原文人称与上下文之间的张力及另一种译法。
  - marker: b
    text: “它们”所指不完全明确，可能包括庙宇、诸神的像或庙中的财物；“掳去”也可译作“带走”。
    reason: 保留代词指向和动词语义上的歧义。
lexical_decisions:
- source_word: וְהִצַּתִּי
  choice: 我必……点火
  rationale: 希伯来文本为第一人称单数使役形式，直译为“我必点火”。虽然上下文随后以第三人称指巴比伦王，但正文优先保留原文明确的人称转换，并在脚注说明上下文读法。
- source_word: בְּבָתֵּי אֱלֹהֵי מִצְרַיִם
  choice: 在埃及诸神的庙宇中
  rationale: בָּתִּים 字面为“房屋”，与神明连用时指其庙宇；“庙宇”在现代中文中自然、准确。
- source_word: וּשְׂרָפָם וְשָׁבָם
  choice: 焚烧它们，将它们掳去
  rationale: 两个第三人称复数宾语后缀的具体所指并不完全明确，可能涉及庙宇、神像或财物。“它们”保留指代张力，“掳去”兼顾 שבה“掳获、带走”的含义。
- source_word: וְעָטָה אֶת אֶרֶץ מִצְרַיִם
  choice: 他必披上埃及地
  rationale: 保留把埃及地比作衣服的鲜明隐喻，也与下句牧人披衣的比喻形成词语呼应。
- source_word: כַּאֲשֶׁר יַעְטֶה הָרֹעֶה אֶת בִּגְדוֹ
  choice: 就像牧人披上自己的衣服
  rationale: 同一动词 עָטָה 与前句均译为“披上”，使比喻关系清楚；בֶּגֶד 采用宽泛而自然的“衣服”。
- source_word: וְיָצָא מִשָּׁם בְּשָׁלוֹם
  choice: 他必平安地离开那里
  rationale: בְּשָׁלוֹם 可表示平安、安全、未受损害；“平安地离开”既贴近字面，也符合现代中文表达。
theological_decisions:
- issue: 首个动词为第一人称，而后续动词以第三人称指向巴比伦王
  choice: 正文译作“我必……点火；他必……”，保留马所拉文本的人称转换。
  alternative: 按上下文统一译作“他必……点火；他必……”。
  rationale: 原文 וְהִצַּתִּי 在现有文本中明确为第一人称单数，不宜仅为行文顺畅而静默改成第三人称。人称转换也可表达耶和华施行审判、巴比伦王作为执行者的关系；脚注同时交代上下文所支持的另一种译法，不把文本张力化解为单一解释。
- issue: “焚烧、掳去”的复数宾语所指
  choice: 正文以“它们”保留模糊性。
  alternative: 明确译作焚烧庙宇、掳走神像或庙中财宝。
  rationale: 希伯来语代词后缀没有明确区分庙宇、诸神的像或庙中财物；正文不替原文作过度具体的神学或历史判断。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以“庙宇”“披上”“平安地离开”等表达兼顾自然度与原文意象；正文保留首句第一人称与后文第三人称之间的转换，并通过脚注帮助普通读者理解。
