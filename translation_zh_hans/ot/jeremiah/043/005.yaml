base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/043/005.yaml
  text: Then Johanan son of Kareah[a], and all the commanders of the forces, took all the remnant of Judah who had returned from all the nations where they had been driven away[b], to sojourn in the land of Judah—
translation:
  language: zh_hans
  text: 于是，加利亚的儿子约哈难和所有军队的首领，把犹大所有的余民，就是那些从他们曾被赶逐[a]到的各国回来、寄居[b]在犹大地的人，全都带走了——
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“被驱散”。这个希伯来语动词可表示被赶走、放逐或驱散。
    reason: lexical_alternative
  - marker: b
    text: “寄居”也可译作“居住”；原文动词常带有暂住或以依附者身份居留的意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: 于是……带走了
  rationale: 叙事性连接词推进事件，译为“于是”符合现代汉语叙事；“带走”准确表达此处 לקח 对人的处置。
- source_word: יוֹחָנָן בֶּן קָרֵחַ
  choice: 加利亚的儿子约哈难
  rationale: 按现代中文圣经人名惯例音译，并保留希伯来语父子称谓结构。
- source_word: שָׂרֵי הַחֲיָלִים
  choice: 所有军队的首领
  rationale: שָׂרֵי 表示首领或指挥者；הַחֲיָלִים 在本语境指军事力量。此译法清楚自然，又保留军事含义。
- source_word: כָּל שְׁאֵרִית יְהוּדָה
  choice: 犹大所有的余民
  rationale: “余民”既表达幸存、剩余的一群人，也保留 שְׁאֵרִית 在《耶利米书》中的主题分量。
- source_word: אֲשֶׁר שָׁבוּ
  choice: 那些……回来的人
  rationale: 关系从句说明这群余民先前已经返回；汉语借助“那些……的人”自然呈现其修饰关系。
- source_word: מִכָּל הַגּוֹיִם
  choice: 从……各国
  rationale: 表达余民由多个外邦国家返回；结合后面的关系从句，译作“从被赶逐到的各国回来”可清楚交代起点。
- source_word: אֲשֶׁר נִדְּחוּ שָׁם
  choice: 被赶逐到的
  rationale: Nifal 形式表达被动和非自愿迁移；“赶逐”保留强制离散的力度，“到”则体现 שָׁם 所指的去向。
- source_word: לָגוּר
  choice: 寄居
  rationale: גור 不仅指居住，也常含暂住或以寄居者身份居留的意味；“寄居”简洁保留这一语义张力。
- source_word: בְּאֶרֶץ יְהוּדָה
  choice: 在犹大地
  rationale: 按希伯来圣经的地域名称直译为“犹大地”，避免采用较晚期的“犹太地区”等称呼。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“就是那些……的人”澄清长关系从句，“全都”呼应原文反复出现的 כָּל。句末破折号保留经文向下一节延续的未完结构。
