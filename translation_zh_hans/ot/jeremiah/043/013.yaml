base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/043/013.yaml
  text: He will shatter the pillars of Beth-shemesh that is in the land of Egypt[b][a], and he will burn the temples of the gods of Egypt with fire.
translation:
  language: zh_hans
  text: 他必打碎埃及地伯示麦[a]的祭祀石柱[b]，并用火焚烧埃及众神的庙宇。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “伯示麦”意为“太阳之家”，很可能指埃及那座希腊语称为“赫利奥波利斯”的城市。
    reason: cultural_note
  - marker: b
    text: 或译“石柱”或“立石”。希伯来语所用的词指宗教祭祀用途的石柱。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשִׁבַּר
  choice: 他必打碎
  rationale: שׁבר表示打破、粉碎；“打碎”自然有力，符合审判语境。连接词在汉语句流中不必机械译出。
- source_word: מַצְּבוֹת
  choice: 柱像
  rationale: מַצֵּבָה在此指宗教用途的立石或石柱。“柱像”简洁地提示其祭祀性质，同时以脚注保留“石柱、立石”的词义范围。
- source_word: בֵּית שֶׁמֶשׁ
  choice: 伯·示麦
  rationale: 按地名音译，避免把“太阳之家”的词义解释直接写入正文；其含义及可能对应的埃及城市在脚注说明。
- source_word: אֲשֶׁר בְּאֶרֶץ מִצְרָיִם
  choice: 埃及地伯·示麦的
  rationale: 将关系从句自然压缩为汉语定语，明确伯·示麦位于埃及，同时不改变修饰关系。
- source_word: בָּתֵּי אֱלֹהֵי מִצְרַיִם
  choice: 埃及众神的庙宇
  rationale: בָּתִּים字面为“房屋”，但在祭祀语境中指神庙；“庙宇”是自然、庄重且准确的现代汉语表达。
- source_word: יִשְׂרֹף בָּאֵשׁ
  choice: 用火焚烧
  rationale: 保留原文动词“焚烧”与名词“火”的并列表达及其强调效果，中文也自然庄重。
