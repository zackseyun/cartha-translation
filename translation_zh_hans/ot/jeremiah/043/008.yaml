  yaml_path: translation/ot/jeremiah/043/008.yaml
  text: Then the word of Yahweh came to Jeremiah in Tahpanhes[a], saying,
translation:
  language: zh_hans
  text: 后来[a]，雅威的话在答比匿临到耶利米，说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文以叙事引介语“事情是这样发生的／后来”开始，随后说“雅威的话……临到”。
    reason: 说明 וַיְהִי 的字面叙事形式，以及主文采用“后来”作为自然汉语承接语的处理。
lexical_decisions:
- source_word: וַיְהִי
  choice: 那时
  rationale: 该叙事形式引入接下来发生的新事件。“那时”在现代汉语中自然地表达叙事推进，同时避免使用生硬的“事情发生了”。
- source_word: דְבַר יְהוָה
  choice: 雅威的话
  rationale: 这是先知书中常见的神谕引介语。“话”既贴近原文，也保留神亲自发言的神学意味。
- source_word: יְהוָה
  choice: 雅威
  rationale: 原文使用神的专名四字神名；“雅威”以现代汉语音译保留其专名性质，不以称号替代。
- source_word: אֶל יִרְמְיָהוּ
  choice: 临到耶利米
  rationale: “临到某人”是自然且庄重的汉语先知叙事表达，清楚表明耶利米是领受神言语的人。
- source_word: בְּתַחְפַּנְחֵס
  choice: 在答比匿
  rationale: 介词 בְּ 表示地点；“答比匿”采用该埃及地名的通行中文译名。
- source_word: לֵאמֹר
  choice: 说
  rationale: 该不定式引出下一节的直接话语；汉语用“说”简洁自然。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用以色列之神的专名。译作“雅威”保留专名，并与较常见的学术重构读音相符；“耶和华”虽是中文传统译名，但反映较晚形成的混合读法。
- issue: דְבַר יְהוָה 的表达
  choice: 雅威的话
  alternative: 雅威的信息
  rationale: “话”保留原文 דָּבָר 的形式和先知公式的神学分量，不把它解释性地缩减为一般“信息”。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“临到”保留先知书语体，但在现代汉语中仍清楚自然；句末冒号承接下一节的神谕内容。
