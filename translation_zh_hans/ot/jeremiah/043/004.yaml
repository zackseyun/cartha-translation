  text: וְ/לֹֽא שָׁמַע֩ יוֹחָנָ֨ן בֶּן קָרֵ֜חַ וְ/כָל שָׂרֵ֧י הַ/חֲיָלִ֛ים וְ/כָל הָ/עָ֖ם בְּ/ק֣וֹל יְהוָ֑ה לָ/שֶׁ֖בֶת בְּ/אֶ֥רֶץ יְהוּדָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/043/004.yaml
  text: But Johanan son of Kareah[a], and all the commanders of the forces, and all the people, did not listen to the voice of Yahweh, to remain in the land of Judah.
translation:
  language: zh_hans
  text: 可是，加利亚的儿子约哈难、所有军队的将领和全体百姓，都没有听从雅威吩咐他们留在犹大地的话[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“雅威的声音”；“听从……的声音”也可表示“顺服雅威”。
    reason: 说明שָׁמַע בְּקוֹל的字面意象及其在此处“听从／顺服”的语义范围。
lexical_decisions:
- source_word: וְלֹא
  choice: 可是……没有
  rationale: וְ 在上下文中带有转折意味；“可是”自然承接前文，并与否定词 לֹא 一同表达他们拒绝遵行先前吩咐的事实。
- source_word: שָׁמַע בְּקוֹל
  choice: 听从……的话
  rationale: 这一搭配兼有听见、留意和顺从之意。“听从……的话”是现代汉语中的自然表达，既保留听觉意象，也让违命的含义清楚可见；字面形式另见脚注。
- source_word: יוֹחָנָן בֶּן קָרֵחַ
  choice: 加利亚的儿子约哈难
  rationale: 按现代汉语圣经人名的通行音译处理约哈难和加利亚，并明确保留父子关系。
- source_word: שָׂרֵי הַחֲיָלִים
  choice: 所有军队的将领
  rationale: שָׂרֵי 指领袖或长官，在军事语境中译作“将领”；הַחֲיָלִים 指军队或部队，译文不把它限定为某一特定编制。
- source_word: כָל הָעָם
  choice: 全体百姓
  rationale: 准确表达 כָל 的整体范围和 הָעָם 的集体意义，也符合先知书的庄重叙事语体。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以“雅威”音译四字神名，保留原文所用的专名，而不以称号替代。
- source_word: לָשֶׁבֶת
  choice: 留在
  rationale: 此处不定式指继续居住而不离开犹大地；“留在”比泛指居住的“住在”更贴合上下文。
- source_word: בְּאֶרֶץ יְהוּדָה
  choice: 在犹大地
  rationale: 保留 אֶרֶץ 的地域含义；“犹大地”准确而自然，也避免采用较晚时期的地域名称。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华／主
  rationale: 原文直接使用四字神名；音译“雅威”保留其专名性质，不以传统音译或称号代替。
- issue: שָׁמַע בְּקוֹל 所表达的听从与顺服
  choice: 正文译作“听从雅威的话”，脚注保留字面意象
  alternative: 不听雅威的声音／不顺服雅威
  rationale: 该希伯来语搭配同时包含听取和遵从的意味。正文采用自然且兼顾两者的“听从”，不把含义缩减为单纯听见，也不完全改写成抽象的“顺服”；脚注说明字面形式。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“可是”体现与前文命令之间的转折；“全体百姓”和“犹大地”符合先知书语体。脚注标记置于其实际解释的“雅威的话”之后。
