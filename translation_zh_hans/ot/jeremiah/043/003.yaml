source:
  edition: WLC
  text: כִּ֗י בָּרוּךְ֙ בֶּן נֵ֣רִיָּ֔ה מַסִּ֥ית אֹתְ/ךָ֖ בָּ֑/נוּ לְמַעַן֩ תֵּ֨ת אֹתָ֤/נוּ בְ/יַֽד הַ/כַּשְׂדִּים֙ לְ/הָמִ֣ית אֹתָ֔/נוּ וּ/לְ/הַגְל֥וֹת אֹתָ֖/נוּ בָּבֶֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/043/003.yaml
  text: For Baruch son of Neriah is inciting you against us[a], in order to give us into the hand of the Chaldeans[c][b], to put us to death and to carry us away into exile to Babylon.
translation:
  language: zh_hans
  text: 因为尼利亚的儿子巴录挑唆你反对我们[a]，要把我们交在迦勒底人手中[b]，使我们被杀，并把我们掳到巴比伦去[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “挑唆”也可译作“煽动”或“怂恿”。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“交在迦勒底人手中”，意思是交在他们的权势之下，任由他们处置。
    reason: cultural_note
  - marker: c
    text: “掳到巴比伦去”也可译作“流放到巴比伦”或“放逐到巴比伦”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，说明他们拒绝听从耶利米之言的理由；现代汉语用“因为”自然保留解释性因果关系。
- source_word: בָּרוּךְ בֶּן נֵרִיָּה
  choice: 尼利亚的儿子巴录
  rationale: 按现代中文圣经人名惯例音译，并自然表达父子关系。
- source_word: מַסִּית
  choice: 挑唆
  rationale: 该使役分词含煽动、怂恿之意；“挑唆”保留说话者指控巴录恶意操纵耶利米的语气。
- source_word: אֹתְךָ בָּנוּ
  choice: 你反对我们
  rationale: 介词结构在本语境中表示敌对方向；此译法清楚表达巴录被指控使耶利米与众人对立。
- source_word: לְמַעַן
  choice: 要
  rationale: 引出所指控的目的；汉语以“要”连接后续目的，简洁自然。
- source_word: תֵּת אֹתָנוּ בְיַד הַכַּשְׂדִּים
  choice: 把我们交在迦勒底人手中
  rationale: 保留“交在……手中”的希伯来语意象，同时中文也能自然表达置于对方权下。
- source_word: לְהָמִית אֹתָנוּ
  choice: 使他们杀死我们
  rationale: 使役式不定词表示使我们死亡；补出隐含施事“他们”，使中文关系清楚，并与交在迦勒底人手中的语境相连。
- source_word: וּלְהַגְלוֹת אֹתָנוּ בָּבֶל
  choice: 把我们掳到巴比伦去
  rationale: “掳到”兼顾强制迁移和流亡的含义，也自然表达巴比伦是目的地。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“挑唆”传达控告中的敌意；“交在……手中”保留原文惯用意象；“掳到……去”明确强制迁移。所有脚注标记均置于相关正文之后。
