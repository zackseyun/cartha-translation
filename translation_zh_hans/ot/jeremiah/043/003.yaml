revisions:
- from: 因为尼利亚的儿子巴录挑唆你反对我们[a]，要把我们交在迦勒底人手中[b]，使他们杀死我们，把我们掳到巴比伦去[c]。
  to: 因为尼利亚的儿子巴录挑唆你反对我们[a]，要把我们交在迦勒底人手中[b]，使我们被杀，并把我们掳到巴比伦去[c]。
  rationale: 仅作两项安全修订：正文以“使我们被杀”避免将未明说的施事固定为迦勒底人；脚注 c 删除可指自愿迁移的“迁徙到”，改用保留强制流放含义的“放逐到”。其余译文及脚注锚点均予保留。
