  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/אִ֣ם לֹֽא תֵצֵ֗א אֶל שָׂרֵי֙ מֶ֣לֶךְ בָּבֶ֔ל וְ/נִתְּנָ֞ה הָ/עִ֤יר הַ/זֹּאת֙ בְּ/יַ֣ד הַ/כַּשְׂדִּ֔ים וּ/שְׂרָפ֖וּ/הָ בָּ/אֵ֑שׁ וְ/אַתָּ֖ה לֹֽא תִמָּלֵ֥ט מִ/יָּדָֽ/ם־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/038/018.yaml
  text: But if you do not go out to the officials of the king of Babylon[a], then this city will be given into the hand of the Chaldeans, and they will burn it with fire[b], and you will not escape from their hand.
translation:
  language: zh_hans
  text: 但你若不出去见巴比伦王的官长[a]，这城就必被交在迦勒底人手中；他们必放火焚烧这城，你也逃不出他们的手[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “官长”也可译作“首领”或“将领”；原文所用的词可泛指身居高位的官员。
    reason: lexical_alternative
  - marker: b
    text: “交在……手中”和“逃不出……的手”是希伯来语表达，意思是落在对方的权势或控制之下。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם לֹא תֵצֵא
  choice: 但你若不出去见
  rationale: וְאִם在上下文中引出与前一条件相反的后果，译作“但……若”自然保留转折和条件关系；תֵצֵא直译为“出去”，不直接释作“投降”，以保留原文表达。介词אֶל结合汉语习惯译为“见”。
- source_word: שָׂרֵי מֶלֶךְ בָּבֶל
  choice: 巴比伦王的官长
  rationale: שָׂרִים可泛指高层官员、首领或将领。“官长”兼具尊严和一定宽度，不把其职分过度限定为纯军事职位。
- source_word: וְנִתְּנָה הָעִיר הַזֹּאת
  choice: 这城就必被交在
  rationale: 保留נתן被动式“被交”的语态；“就”清楚表达条件所导致的后果，“必”体现未完成式在预告语境中的确定性。
- source_word: בְּיַד הַכַּשְׂדִּים
  choice: 迦勒底人手中
  rationale: 保留希伯来语“在……手中”的权势隐喻，也与句末“他们的手”形成呼应。
- source_word: וּשְׂרָפוּהָ בָּאֵשׁ
  choice: 他们必放火焚烧这城
  rationale: בָּאֵשׁ直指“用火”；“放火焚烧”在现代汉语中自然，并保留原文明确提到火的强调。代词所指在汉语中改为“这城”，避免歧义。
- source_word: וְאַתָּה לֹא תִמָּלֵט מִיָּדָם
  choice: 你也逃不出他们的手
  rationale: תִמָּלֵט译作“逃出”；保留מִיָּדָם的“他们的手”这一具体权势隐喻。“也”承接城市被交付、焚烧之后对西底家本人的后果。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“出去见”保留原文“出去”的字面动作，让投降的含义由上下文呈现；两处“手”刻意保留，以再现原文首尾呼应的权势意象。
