base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/038/008.yaml
  text: Then Ebed-melech went out from the king’s house and spoke to the king[a], saying,
translation:
  language: zh_hans
  text: 于是，以伯·米勒从王宫[a]里出来，对王说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“王的房屋”。
    reason: 保留 בֵּית הַמֶּלֶךְ 的字面表达；在此语境中指王宫。
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: 出来
  rationale: 该动词表示向外移动；“出来”既保留方向感，也自然承接叙事。
- source_word: עֶבֶד מֶלֶךְ
  choice: 以伯·米勒
  rationale: 此处是人名，采用音译，不按普通名词短语翻译。
- source_word: מִבֵּית הַמֶּלֶךְ
  choice: 从王宫里
  rationale: 希伯来语字面为“从王的房屋”；在君王居所的语境中，“王宫”是自然且准确的现代汉语表达，同时以脚注保留字面形式。
- source_word: וַיְדַבֵּר אֶל הַמֶּלֶךְ
  choice: 对王说
  rationale: דבר אֶל 表示向某人讲话；汉语“对王说”简洁自然，并引出下一节的直接引语。
- source_word: לֵאמֹר
  choice: ：
  rationale: 该形式引出随后出现的直接引语；现代汉语以冒号表达这一功能，比另译“说道”更自然，也避免重复“说”。
theological_decisions: []
