base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/038/026.yaml
  text: Then you shall say to them[a], ‘I was presenting my plea before the king, that he should not send me back to the house of Jonathan to die there.’
translation:
  language: zh_hans
  text: 你就要对他们说：‘我当时在王面前恳求，求他不要把我送回约拿单的房子去，免得我死在那里。’
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאָמַרְתָּ אֲלֵיהֶם
  choice: 你就要对他们说
  rationale: 连接词与完成式在此承接前文命令，表达随后该采取的行动；“就要”自然体现次序和指示语气。
- source_word: מַפִּיל אֲנִי תְחִנָּתִי לִפְנֵי הַמֶּלֶךְ
  choice: 我当时正在王面前恳求
  rationale: 希伯来语直译近于“使我的恳求落在王面前”，是提出迫切请求的惯用语。分词加代词具有进行体色彩；按语境，这是耶利米对刚才会面的说法，故用“当时正在”。
- source_word: תְחִנָּתִי
  choice: 恳求
  rationale: 该词指为求恩惠或怜悯而发出的迫切请求；“恳求”既通俗又保留其迫切语气。
- source_word: לִפְנֵי הַמֶּלֶךְ
  choice: 在王面前
  rationale: 保留原文的空间及宫廷表达，在现代汉语中也自然。
- source_word: לְבִלְתִּי הֲשִׁיבֵנִי
  choice: 不要把我送回
  rationale: 此结构说明恳求的内容或目的。使役形式表示由王安排把耶利米送回；汉语省略已经明确的施事者更自然。
- source_word: בֵּית יְהוֹנָתָן
  choice: 约拿单的牢房
  rationale: 字面为“约拿单的房子”，但本段叙事中该处用作拘禁耶利米的地方；译作“牢房”清楚传达所指，同时保留专名。
- source_word: לָמוּת שָׁם
  choice: 免得我死在那里
  rationale: 不定式表达被送回后所担忧的结果。汉语“免得”自然呈现其与否定请求之间的目的—结果关系。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。保留“在王面前”的希伯来表达，同时将其惯用含义自然译为“恳求”。本节没有必须以脚注保留的实质歧义。
