  text: וַ/יֵּ֤שֶׁב יִרְמְיָ֨הוּ֙ בַּ/חֲצַ֣ר הַ/מַּטָּרָ֔ה עַד י֖וֹם אֲשֶׁר נִלְכְּדָ֣ה יְרוּשָׁלִָ֑ם וְ/הָיָ֕ה כַּ/אֲשֶׁ֥ר נִלְכְּדָ֖ה יְרוּשָׁלִָֽם־־ס׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/038/028.yaml
  text: And Jeremiah remained in the court of the guard until the day Jerusalem was captured[b][a]. And it happened when Jerusalem was captured—
translation:
  language: zh_hans
  text: 耶利米仍留在护卫院中，直到耶路撒冷被攻占的那一天[b]。耶路撒冷被攻占时，事情是这样的——[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文本在这里突然中断：“耶路撒冷被攻占时，事情是这样的——”这句话本身并不完整，很可能是引入下文的过渡语。
    reason: textual_variant
  - marker: b
    text: “被攻占”也可译作“被夺取”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: 仍留在
  rationale: ישׁב 可表示坐、居住或停留；此处是受拘禁的语境，“仍留在”既表达持续状态，也不暗示他自愿居住。
- source_word: בַּחֲצַר הַמַּטָּרָה
  choice: 在护卫院中
  rationale: חָצֵר 指院子，מַטָּרָה 在本书语境中指由护卫看守的拘禁场所；“护卫院”简洁、自然，并保留其官方羁押性质。
- source_word: עַד יוֹם אֲשֶׁר
  choice: 直到……的那一天
  rationale: 保留原文以某一日为持续状态终点的表达，同时符合现代汉语习惯。
- source_word: נִלְכְּדָה
  choice: 被攻占
  rationale: לכד 的Niphal形式意为被夺取、被占领；用于城市和军事语境时，“被攻占”比单纯“被捕获”自然准确。
- source_word: יְרוּשָׁלִַם
  choice: 耶路撒冷
  rationale: 采用现代中文圣经及一般用语中的标准地名译法。
- source_word: וְהָיָה
  choice: 事情是这样的
  rationale: 该表达在此引出后续叙事；此译法用自然现代汉语保留叙事过渡功能，不把残缺句强行补足。
- source_word: כַּאֲשֶׁר
  choice: ……时
  rationale: 在此时间结构中表示“当……的时候”；以“……时”简明呈现。
theological_decisions: []
