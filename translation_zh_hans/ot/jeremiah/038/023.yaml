base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/038/023.yaml
  text: And all your wives and your sons will be brought out to the Chaldeans[a], and you yourself will not escape from their hand, for you will be seized by the hand of the king of Babylon[c][b], and this city will be burned with fire.
translation:
  language: zh_hans
  text: 你所有的妻子和儿子都必被带到迦勒底人[a]那里；你自己也逃不脱他们的手[b]，因为你必被巴比伦王捉住，而且你必用火焚烧这城。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “迦勒底人”也可译为“巴比伦人”。
    reason: lexical_alternative
  - marker: b
    text: 原文“他们的手”是惯用语，表示他们的权势或控制。
    reason: cultural_note
lexical_decisions:
- source_word: נָשֶׁיךָ
  choice: 你的众妻
  rationale: 上下文是对西底家王说话，复数形式最自然地指他的妻妾；“众妻”既保留复数，也符合庄重的现代汉语。
- source_word: בָּנֶיךָ
  choice: 儿子
  rationale: 希伯来词明确指“儿子”，不泛化为“儿女”或“孩子”。
- source_word: מוֹצִאִים
  choice: 必被带到
  rationale: 使役被动分词在先知警告中具有将来意味；译文保留被动含义。
- source_word: הַכַּשְׂדִּים
  choice: 迦勒底人
  rationale: 保留原文族称；在此语境中指巴比伦一方，另以脚注提供通俗替代说法。
- source_word: לֹא תִמָּלֵט מִיָּדָם
  choice: 逃不出他们的手
  rationale: 保留“手”所表达的权势、控制这一希伯来意象，同时现代中文仍易于理解。
- source_word: בְיַד מֶלֶךְ בָּבֶל תִּתָּפֵשׂ
  choice: 必落在巴比伦王手中
  rationale: 自然呈现“被捉住”及“在……手中”的控制意象，避免生硬地重复两个“手”。
- source_word: הָעִיר הַזֹּאת
  choice: 这城
  rationale: 简洁、庄重地对应原文指示结构。
- source_word: תִּשְׂרֹף
  choice: 必被火焚烧
  rationale: 马所拉文本的动词为阴性单数，可与阴性名词“城”呼应；按上下文表达城遭焚毁。
- source_word: בָּאֵשׁ
  choice: 被火焚烧
  rationale: 以自然中文保留火焚的具体图像。
