  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יִרְמְיָ֣הוּ אֶל צִדְקִיָּ֡הוּ כֹּֽה אָמַ֣ר יְהוָה֩ אֱלֹהֵ֨י צְבָא֜וֹת אֱלֹהֵ֣י יִשְׂרָאֵ֗ל אִם יָצֹ֨א תֵצֵ֜א אֶל שָׂרֵ֤י מֶֽלֶךְ בָּבֶל֙ וְ/חָיְתָ֣ה נַפְשֶׁ֔/ךָ וְ/הָ/עִ֣יר הַ/זֹּ֔את לֹ֥א תִשָּׂרֵ֖ף בָּ/אֵ֑שׁ וְ/חָיִ֖תָה אַתָּ֥ה וּ/בֵיתֶֽ/ךָ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/038/017.yaml
  text: 'Then Jeremiah said to Zedekiah[a], “Thus says Yahweh, the God of hosts, the God of Israel: If you indeed go out to the officials of the king of Babylon, your life will be spared, and this city will not be burned with fire[c][b]; and you and your household will live.”'
translation:
  language: zh_hans
  text: 耶利米对西底家说：“万军之神、以色列的神雅威如此说：你若确实出去[a]，到巴比伦王的众官长[b]那里，你的性命必得保全[c]，这城也不会被火焚烧；你和你全家[d]必存活。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文以同一动词的绝对不定式和限定形式连用，加强“出去”的语气，也可译作“你若真的出去”。
    reason: 说明希伯来语强调结构。
  - marker: b
    text: “官长”也可译作“首领”或“将领”；原词本身未限定其职务纯属文职还是军职。
    reason: 保留词义范围。
  - marker: c
    text: 直译“你的性命必存活”；这里的“性命”指你本人得以生还。
    reason: 解释希伯来语惯用表达，并避免误解为抽象的灵魂。
  - marker: d
    text: 直译“你和你的家必存活”；“家”在这里指家属和家中人员，不是房屋。
    reason: 说明集合性名词的语境含义。
lexical_decisions:
- source_word: וַיֹּאמֶר יִרְמְיָהוּ אֶל צִדְקִיָּהוּ
  choice: 耶利米对西底家说
  rationale: 叙事中的连续式推进情节；现代汉语无需另加“然后”，语序本身已自然承接上文。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以通行的现代汉语音译保留四字神名，将其作为专名表达，而不以“主”等称号替代。
- source_word: אֱלֹהֵי צְבָאוֹת אֱלֹהֵי יִשְׂרָאֵל
  choice: 万军之神、以色列的神
  rationale: 保留两个并列的属格结构；“万军”不限定为人间军队，因而保存原词可能涵盖天上众军的宽度。
- source_word: אִם יָצֹא תֵצֵא
  choice: 你若确实出去
  rationale: 用“确实”体现绝对不定式与限定动词连用所产生的强调，同时保持自然汉语。
- source_word: אֶל שָׂרֵי מֶלֶךְ בָּבֶל
  choice: 到巴比伦王的众官长那里
  rationale: שָׂרִים可指官员、首领或将领；“官长”保留其政治与军事语义的开放性。原文只说“出去到……那里”，正文不直接增添“投降”。
- source_word: וְחָיְתָה נַפְשֶׁךָ
  choice: 你的性命就可保全
  rationale: נֶפֶשׁ在这里指人的性命或本人得以存活，不特指与身体相分离的“灵魂”；汉语用“性命得保全”自然传达生还之意。
- source_word: לֹא תִשָּׂרֵף בָּאֵשׁ
  choice: 不会被火焚烧
  rationale: 保留被动语态和“以火焚烧”的明示表达。
- source_word: וְחָיִתָה אַתָּה וּבֵיתֶךָ
  choice: 你和你全家都能存活
  rationale: בַּיִת在此指家属及家中人员，而非房屋建筑；“全家”符合现代汉语表达。
theological_decisions:
- issue: 神名的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名，因此正文保留专名。“雅威”较直接反映学界通常采用的读音；不以称号替换，也不将有争议的元音问题扩写进正文。
- issue: נֶפֶשׁ在生存语境中的含义
  choice: 性命
  alternative: 灵魂；本人
  rationale: 上下文谈到城被焚及王与全家的存活，故此处是生命得以保存的惯用说法；译作“灵魂”容易加入原文此处并未强调的身心二分观。
- issue: “出去到官长那里”是否明译为投降
  choice: 保留“出去……到……那里”
  alternative: 出去投降；出去归顺
  rationale: 语境显然涉及向巴比伦方面交出自己，但本节希伯来文本没有明用“投降”一词。正文保留原有措辞，避免把语境推论写成词面意义。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“如此说”保留先知宣告的固定语体；“官长”“焚烧”“存活”略具经文庄重感，但仍为普通读者易懂。句法尽量贴近希伯来文的条件—结果结构，同时不把语境中的“投降”直接写入正文。
