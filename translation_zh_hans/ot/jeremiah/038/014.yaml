base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/038/014.yaml
  text: Then King Zedekiah sent and took Jeremiah the prophet to himself[a], to the third entrance that is in the house of Yahweh, and the king said to Jeremiah, “I am asking you something[b]; do not hide anything from me.”
translation:
  language: zh_hans
  text: 西底家王派人把先知耶利米带到雅威殿[a]内第三个入口那里，来见他。王对耶利米说：“我有一件事要问你；你什么也不可向我隐瞒[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “雅威殿”直译为“雅威的家”；在此语境中指“雅威的圣殿”。
    reason: 说明בֵּית יְהוָה的字面形式及其语境含义。
  - marker: b
    text: 也可译作：“不可向我隐瞒任何事。”
    reason: 提供否定结构及דָּבָר的另一种自然译法。
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: 派人
  rationale: 在叙事语境中表示王差遣人去办事；译作“派人”符合现代汉语，也与后面的带来行动自然衔接。
- source_word: וַיִּקַּח אֶת יִרְמְיָהוּ הַנָּבִיא אֵלָיו
  choice: 把先知耶利米带到自己面前
  rationale: וַיִּקַּח字面为“取、带”，结合王差人行动的语境，指把耶利米带来；אֵלָיו表明是带到王本人面前。
- source_word: מָבוֹא הַשְּׁלִישִׁי
  choice: 第三个入口
  rationale: מָבוֹא可指入口、进入之处；保留“第三个”这一原文表达，不推断具体方位或建筑结构。
- source_word: בְּבֵית יְהוָה
  choice: 雅威殿里
  rationale: בֵּית יְהוָה字面是“雅威的家”，在此指圣殿建筑；正文采用自然、明确的“雅威殿”，脚注保留字面表达。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语音译四字神名，保留其作为专名的性质，不以称号替代。
- source_word: שֹׁאֵל אֲנִי אֹתְךָ דָּבָר
  choice: 我有一件事要问你
  rationale: 分词加独立代词表达当前、紧迫的询问意图；דָּבָר在此自然译为“一件事”。
- source_word: אַל תְּכַחֵד מִמֶּנִּי דָּבָר
  choice: 你什么也不可向我隐瞒
  rationale: כחד意为隐藏、隐瞒；用“什么也不可”传达דָּבָר在否定句中的全称意味。
theological_decisions:
- issue: 四字神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用神的专名；译作“雅威”既保留专名性质，也避免以“主”这一称号代替。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“第三个入口”刻意保留原文对该地点的简略称呼，不补入缺乏文本依据的具体解释；王的命令则用现代汉语清楚传达其强烈、全面的要求。
