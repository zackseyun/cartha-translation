  text: וַ/יִּקְח֣וּ אֶֽת יִרְמְיָ֗הוּ וַ/יַּשְׁלִ֨כוּ אֹת֜/וֹ אֶל הַ/בּ֣וֹר מַלְכִּיָּ֣הוּ בֶן הַ/מֶּ֗לֶךְ אֲשֶׁר֙ בַּ/חֲצַ֣ר הַ/מַּטָּרָ֔ה וַ/יְשַׁלְּח֥וּ אֶֽת יִרְמְיָ֖הוּ בַּ/חֲבָלִ֑ים וּ/בַ/בּ֤וֹר אֵֽין מַ֨יִם֙ כִּ֣י אִם טִ֔יט וַ/יִּטְבַּ֥ע יִרְמְיָ֖הוּ בַּ/טִּֽיט־־׀־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/038/006.yaml
  text: So they took Jeremiah and threw him into the cistern of Malkijah the king’s son[a], which was in the court of the guard, and they lowered Jeremiah with ropes. Now there was no water in the cistern, but only mud[c][b], and Jeremiah sank into the mud.
translation:
  language: zh_hans
  text: 于是，他们把耶利米带走，扔进王的儿子玛基雅的蓄水池[a]，这蓄水池在护卫院[b]里；他们用绳子把耶利米放下去。池里没有水，只有淤泥[c]，耶利米就陷进淤泥里。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “蓄水池”也可译作“坑”。希伯来语 בור 可指坑或蓄水池；下文说其中没有水、只有淤泥，较支持这里是蓄水池。
    reason: lexical_alternative
  - marker: b
    text: “护卫院”也可理解为“监禁的院子”。希伯来语所指很可能是有人看守的拘禁区域。
    reason: lexical_alternative
  - marker: c
    text: “淤泥”也可译作“泥泞”或“泥”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְחוּ
  choice: 他们抓住
  rationale: לקח的基本义是“拿、带走”；在官员将耶利米投入池中的强制语境里，“抓住”自然表达其被控制带走的动作，同时不过度强化为暴力“逮捕”。
- source_word: וַיַּשְׁלִכוּ אֹתוֹ אֶל הַבּוֹר
  choice: 把他扔进……蓄水池
  rationale: השליך表示投、扔；בור可指坑或蓄水池。下文特意说明池中无水而有泥，表明这里很可能是蓄水池，故正文采用较具体的“蓄水池”，脚注保留“坑”的可能。
- source_word: מַלְכִּיָּהוּ בֶן הַמֶּלֶךְ
  choice: 王的儿子玛基雅
  rationale: 按希伯来语结构直译，保留“王的儿子”这一身份表述，不将其扩展解释为王位继承人；人名采用现代中文圣经语境中易辨认的音译“玛基雅”。
- source_word: אֲשֶׁר בַּחֲצַר הַמַּטָּרָה
  choice: 那池在护卫院里
  rationale: חצר指院子；מטרה在耶利米书中指受守卫的拘禁区域。“护卫院”简洁保留守卫与拘禁的背景，又不把该词直接等同于普通“监狱”。
- source_word: וַיְשַׁלְּחוּ אֶת יִרְמְיָהוּ בַּחֲבָלִים
  choice: 他们用绳子把耶利米放下去
  rationale: שלח通常有“送、放”之义，但与绳子和蓄水池连用时指用绳索往下放。“放下去”符合现代汉语叙事，也清楚呈现动作。
- source_word: וּבַבּוֹר אֵין מַיִם כִּי אִם טִיט
  choice: 池里没有水，只有淤泥
  rationale: אין表示不存在，כי אם在此为排除性表达“只有”。טיט是泥、泥泞；“淤泥”尤其适合干涸蓄水池底部的沉积物。
- source_word: וַיִּטְבַּע יִרְמְיָהוּ בַּטִּיט
  choice: 耶利米就陷进淤泥里
  rationale: טבע表示下沉、陷入。“陷进”既传达向下沉入的动态，也符合人在浓稠淤泥中的处境。
