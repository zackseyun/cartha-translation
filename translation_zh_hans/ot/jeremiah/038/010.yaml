  text: וַ/יְצַוֶּ֣ה הַ/מֶּ֔לֶךְ אֵ֛ת עֶֽבֶד מֶ֥לֶךְ הַ/כּוּשִׁ֖י לֵ/אמֹ֑ר קַ֣ח בְּ/יָדְ/ךָ֤ מִ/זֶּה֙ שְׁלֹשִׁ֣ים אֲנָשִׁ֔ים וְֽ/הַעֲלִ֜יתָ אֶֽת יִרְמְיָ֧הוּ הַ/נָּבִ֛יא מִן הַ/בּ֖וֹר בְּ/טֶ֥רֶם יָמֽוּת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/038/010.yaml
  text: Then the king commanded Ebed-melech the Cushite[a], saying, “Take with you from here thirty men[b], and bring Jeremiah the prophet up from the cistern before he dies.”
translation:
  language: zh_hans
  text: 王就吩咐古实人以伯米勒[a]说：“你从这里带三十个人去，趁先知耶利米还没有死，把他从蓄水池[b]里拉上来。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “古实人”指来自古实的人；古实有时也传统地译作“埃塞俄比亚”。
    reason: 保留希伯来族属地理称谓及其传统译法。
  - marker: b
    text: 或译“坑”。希伯来语 בּוֹר 可指坑或蓄水池；按本段叙事情境，此处指坑状的蓄水设施。
    reason: 说明原词的语义范围，并交代正文采用“蓄水池”的上下文依据。
lexical_decisions:
- source_word: וַיְצַוֶּה
  choice: 吩咐
  rationale: 该动词在叙事中表示君王发出的直接命令；“吩咐”自然、庄重，也保留了权威语气。
- source_word: עֶבֶד מֶלֶךְ
  choice: 以伯米勒
  rationale: 按上下文视为人名并采用现代中文圣经中较通行的音译，不按普通名词短语译作“王的仆人”。
- source_word: הַכּוּשִׁי
  choice: 古实人
  rationale: 直译其族属或地域身份，指来自古实的人；比直接译作“埃塞俄比亚人”更贴近希伯来地理名称。
- source_word: קַח בְּיָדְךָ מִזֶּה שְׁלֹשִׁים אֲנָשִׁים
  choice: 你从这里带三十个人去
  rationale: בידך 字面为“在你手中”，此处是带人在自己率领之下同行的习语；中文以“带……去”自然传达，מזה 则保留为“从这里”。
- source_word: וְהַעֲלִיתָ
  choice: 拉上来
  rationale: 使役形表达“使之上来”；结合耶利米身在深坑式蓄水池中的情境，“拉上来”既自然又明确保留向上的动作。
- source_word: יִרְמְיָהוּ הַנָּבִיא
  choice: 先知耶利米
  rationale: 保留原文的人名与称号，并按自然中文次序将称号置于人名前。
- source_word: מִן הַבּוֹר
  choice: 从蓄水池里
  rationale: בּוֹר 可指坑、蓄水池或囚禁人的地坑；本段叙事情境是储水用的坑状设施，故正文采用“蓄水池”，脚注保留词义范围。
- source_word: בְּטֶרֶם יָמוּת
  choice: 趁……还没有死
  rationale: בטרם 表示“在……以前”；这一译法自然传达救援必须赶在耶利米死亡之前进行的紧迫性，而不把句子改作目的或结果结构。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“王就吩咐……说”保留希伯来叙事推进和引语格式；“趁……还没有死”符合现代汉语表达，并维持原文的时间界限与紧迫感。所有脚注标记均置于对应词语之后。
