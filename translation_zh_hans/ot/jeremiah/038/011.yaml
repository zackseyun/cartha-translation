base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/038/011.yaml
  text: So Ebed-melech took the men with him and went into the king’s house[a], to a place below the storeroom, and from there took worn-out rags and worn-out garments[c][b], and sent them down by ropes to Jeremiah in the cistern.
translation:
  language: zh_hans
  text: 于是，以伯·米勒带着手下的人进了王宫，来到库房[a]下面，从那里取了破旧的碎布和破旧的衣物[b]，用绳子把这些东西放下去，送给蓄水池[c]里的耶利米。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“宝库”。希伯来语אוֹצָר既可指宝库，也可指储藏物品的库房；这里的上下文较支持“库房”。
    reason: lexical_alternative
  - marker: b
    text: “衣物”所对应的希伯来语מְלָחִים十分罕见，确切含义不明；根据上下文，它可能指用来保护耶利米、避免绳子磨伤他的旧布料或旧衣物。
    reason: lexical_uncertainty
  - marker: c
    text: 或译“坑”。希伯来语בּוֹר可指坑或蓄水池；这里按叙事场景译作“蓄水池”。
    reason: lexical_alternative
lexical_decisions:
- source_word: עֶבֶד מֶלֶךְ
  choice: 以伯·米勒
  rationale: 按专名音译，不按其字面构成译作“王的仆人”；采用现代中文圣经人名的常见音译形式。
- source_word: הָאֲנָשִׁים בְּיָדוֹ
  choice: 手下的人
  rationale: בְּיָדוֹ在这里表示归他带领、调遣的人；“手下的人”既保留这种关系，也符合叙事语境。
- source_word: בֵית הַמֶּלֶךְ
  choice: 王宫
  rationale: 字面为“王的房屋”，在此指王的宫殿；“王宫”是自然、明确而庄重的现代汉语。
- source_word: אֶל תַּחַת הָאוֹצָר
  choice: 来到库房下面
  rationale: תַּחַת指下方的区域；אוֹצָר可指宝库或储藏处。此处从中取得旧布，译作“库房”更切合上下文，同时以脚注保留“宝库”的可能。
- source_word: בְּלוֹיֵ הַסְּחָבוֹת
  choice: 破旧的碎布
  rationale: בְּלוֹיֵ表示破旧、磨损，סחבות指破布或布片；“破旧的碎布”传达了两层含义。
- source_word: וּבְלוֹיֵ מְלָחִים
  choice: 破旧的衣物
  rationale: מְלָחִים是罕见词，确切含义不明；它与前面的破布并列，且下一节表明这些物品用于垫在绳子下面，因此“衣物”是合乎语境但不过度确定的译法，并以脚注说明不确定性。
- source_word: וַיְשַׁלְּחֵם
  choice: 把这些东西放下去，送到
  rationale: 动词基本义为“送”；因目的地在池中，中文补出“放下去”以明确垂直动作，同时保留“送到”的语义。
- source_word: הַבּוֹר
  choice: 蓄水池
  rationale: בּוֹר可指坑或蓄水池；本段叙事所指是用作囚禁处的蓄水池。脚注保留“坑”的词义可能。
- source_word: בַּחֲבָלִים
  choice: 用绳子
  rationale: 介词בְּ在此表示工具或手段；“用绳子”是自然准确的汉语表达。
