revisions:
- from: 西底家王就暗中向耶利米起誓说：“我指着赐给我们这生命的永活耶和华起誓，我绝不杀你，也不把你交在那些想要你命的人手中。”
  to: 西底家王就暗中向耶利米起誓说：“我指着那位为我们造了这生命[a]、永活的耶和华起誓：我绝不杀你，也不把你交在那些想要你命的人手中。”
  rationale: 修订仅恢复עשה所表达的“造”之义，并微调中文誓言公式的语序，使其既保留“耶和华活着”的起誓力量，也保持现代汉语的庄重与通顺。其余措辞忠实且自然，予以保留。
