source:
  edition: WLC
  text: וַ/יִּשָּׁבַ֞ע הַ/מֶּ֧לֶךְ צִדְקִיָּ֛הוּ אֶֽל יִרְמְיָ֖הוּ בַּ/סֵּ֣תֶר לֵ/אמֹ֑ר חַי יְהוָ֞ה את אֲשֶׁר֩ עָשָׂה לָ֨/נוּ אֶת הַ/נֶּ֤פֶשׁ הַ/זֹּאת֙ אִם אֲמִיתֶ֔/ךָ וְ/אִם אֶתֶּנְ/ךָ֗ בְּ/יַד֙ הָ/אֲנָשִׁ֣ים הָ/אֵ֔לֶּה אֲשֶׁ֥ר מְבַקְשִׁ֖ים אֶת נַפְשֶֽׁ/ךָ־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/038/016.yaml
  text: Then King Zedekiah swore secretly to Jeremiah[a], saying, “As Yahweh lives, who made this life for us, I will not put you to death, nor will I give you into the hand of these men who are seeking your life.”
translation:
  language: zh_hans
  text: 西底家王就暗中向耶利米起誓说：“我指着那位为我们造了这生命[a]、永活的耶和华起誓：我绝不杀你，也不把你交在那些想要你命的人手中。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“赐给我们这生命的。”原文较直译为：“为我们造了这生命的。”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׁבַע
  choice: 起誓
  rationale: 准确表达郑重立誓的动作，符合现代汉语庄重语体。
- source_word: בַּסֵּתֶר
  choice: 暗中
  rationale: 表达此誓言是在隐秘、不公开的情况下说出的；“暗中”简洁自然。
- source_word: חַי יְהוָה
  choice: 我指着……永活耶和华起誓
  rationale: 这是希伯来语常见的誓言公式。汉语补出“我指着……起誓”，使其誓言功能清楚；“永活”保留“耶和华活着”的含义。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的神圣名译法，并保留原文专名性质。
- source_word: אֵת אֲשֶׁר עָשָׂה לָנוּ אֶת הַנֶּפֶשׁ הַזֹּאת
  choice: 赐给我们这生命的
  rationale: 原文较直译为“为我们造了这生命的”。这里“赐给”在现代汉语中更自然，也清楚表达生命源于耶和华；创造意味未在正文中过度凸显，以免形成生硬表述。
- source_word: נֶפֶשׁ
  choice: 生命／命
  rationale: 本节两处均指人的性命而非与身体相分离的“灵魂”；依汉语搭配分别译作“生命”和“命”。
- source_word: אִם אֲמִיתֶךָ
  choice: 我绝不杀你
  rationale: 誓言之后的 אִם 具有省略式否定效力；汉语须明确补出否定。“绝不”体现誓言的强烈保证。
- source_word: וְאִם אֶתֶּנְךָ בְּיַד
  choice: 也不把你交在……手中
  rationale: 明确表达延续的否定，并保留希伯来语“交在某人手中”的权势隐喻。
- source_word: הָאֲנָשִׁים הָאֵלֶּה
  choice: 那些……的人
  rationale: 中文用关系结构自然指向上下文中的特定男子；无需重复译出性别词“男人”。
- source_word: מְבַקְשִׁים אֶת נַפְשֶׁךָ
  choice: 想要你命
  rationale: 这是现代汉语清楚自然的习语，准确表达他们企图杀害耶利米，而不造成仅仅寻找其生命的误解。
theological_decisions:
- issue: 誓言公式中神圣名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: “耶和华”是现代中文圣经传统中最通行、最易识别的专名形式；正文仍将其作为神的专名，而非普通称号处理。
- issue: אֲשֶׁר עָשָׂה לָנוּ אֶת הַנֶּפֶשׁ הַזֹּאת 所表达的神与生命之关系
  choice: 赐给我们这生命的
  alternative: 为我们造了这生命的
  rationale: 选择自然汉语表达生命来自神，不将 נֶפֶשׁ 神学化为不朽“灵魂”。“造”的字面创造意味是可能读法，但中文“造了这生命”较生硬。
translation_notes:
  register: 采用现代、庄重而易懂的叙事与王室誓言语体。“我指着……起誓”使希伯来誓言公式在中文中完整自然；避免将 נֶפֶשׁ 译成带有特定二元人观色彩的“灵魂”。
