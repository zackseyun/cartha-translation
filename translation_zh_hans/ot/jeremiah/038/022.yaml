  text: וְ/הִנֵּ֣ה כָל הַ/נָּשִׁ֗ים אֲשֶׁ֤ר נִשְׁאֲרוּ֙ בְּ/בֵ֣ית מֶֽלֶךְ יְהוּדָ֔ה מוּצָא֕וֹת אֶל שָׂרֵ֖י מֶ֣לֶךְ בָּבֶ֑ל וְ/הֵ֣נָּה אֹמְר֗וֹת הִסִּית֜וּ/ךָ וְ/יָכְל֤וּ לְ/ךָ֙ אַנְשֵׁ֣י שְׁלֹמֶ֔/ךָ הָטְבְּע֥וּ בַ/בֹּ֛ץ רַגְלֶ֖/ךָ נָסֹ֥גוּ אָחֽוֹר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/038/022.yaml
  text: And behold[a], all the women who remain in the house of the king of Judah are being brought out to the officials of the king of Babylon, and they are saying, ‘The men at peace with you have misled you and overcome you; your feet have sunk into the mud[b]; they have turned back.’
translation:
  language: zh_hans
  text: '“看哪，犹大王宫中所有剩下的妇女都正被带到巴比伦王的官员那里。她们说：


    ‘与你交好的人[a]误导了你，


    胜过了你；


    他们使你的脚陷入泥泞[b]，


    自己却退后了。’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “与你交好的人”直译为“与你和平的人”，可指朋友、亲信或盟友。
    reason: 说明希伯来语习语，并保留具体关系范围上的开放性。
  - marker: b
    text: 或译：“泥潭”。
    reason: בֹּץ 可指泥、泥泞或泥潭；脚陷其中的受困意象相同。
lexical_decisions:
- source_word: וְהִנֵּה
  choice: 看哪
  rationale: 保留希伯来语引人注意并使所述场景显得历历在目的话语标记；现代中文仍能自然理解。
- source_word: נִשְׁאֲרוּ בְּבֵית מֶלֶךְ יְהוּדָה
  choice: 犹大王宫中所有剩下的妇女
  rationale: 将“王的家”按此处场景译为“王宫”，并保留“剩下”的含义，不进一步限定这些妇女的身份。
- source_word: מוּצָאוֹת
  choice: 都正被带到
  rationale: 该词是使役被动分词，译文保留被动含义，并以“正”呈现先知话语中生动展开的场景；上下文也容许其指即将发生之事。
- source_word: שָׂרֵי מֶלֶךְ בָּבֶל
  choice: 巴比伦王的官员
  rationale: שָׂרִים 可指官员、首领或臣宰；“官员”不武断限定其贵族或军事身份。
- source_word: אַנְשֵׁי שְׁלֹמֶךָ
  choice: 与你交好的人
  rationale: 这是字面为“与你和平的人”的习语，指与王关系亲近、友好或结盟的人；正文用自然中文保留关系性表达，脚注说明其范围。
- source_word: הִסִּיתוּךָ
  choice: 误导了你
  rationale: 使役词形可表达怂恿、引诱或使人走入歧途；“误导”保留其较宽语义，不武断断定对方蓄意欺骗。
- source_word: וְיָכְלוּ לְךָ
  choice: 占了你的上风
  rationale: יכל 与介词 ל 连用表示胜过或压倒某人；此译法符合现代中文，也保留这些亲近者反而制约王的讽刺意味。
- source_word: הָטְבְּעוּ בַבֹּץ רַגְלֶךָ
  choice: 他们使你的脚陷入泥泞
  rationale: 保留希伯来语使役结构及受困无助的诗性图像，而不将其简化为非使役的“你的脚陷入”。
- source_word: נָסֹגוּ אָחוֹר
  choice: 自己却退后了
  rationale: 保留“向后退”的方向意象；“自己却”清楚呈现他们使王陷困之后反而撤离的语义对照。
