source:
  edition: WLC
  text: אֲדֹנִ֣/י הַ/מֶּ֗לֶךְ הֵרֵ֜עוּ הָ/אֲנָשִׁ֤ים הָ/אֵ֨לֶּה֙ אֵ֣ת כָּל אֲשֶׁ֤ר עָשׂוּ֙ לְ/יִרְמְיָ֣הוּ הַ/נָּבִ֔יא אֵ֥ת אֲשֶׁר הִשְׁלִ֖יכוּ אֶל הַ/בּ֑וֹר וַ/יָּ֤מָת תַּחְתָּי/ו֙ מִ/פְּנֵ֣י הָֽ/רָעָ֔ב כִּ֣י אֵ֥ין הַ/לֶּ֛חֶם ע֖וֹד בָּ/עִֽיר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/038/009.yaml
  text: My lord the king[a], these men have done evil in all that they did to Jeremiah the prophet, whom they threw into the cistern, and he will die there because of the famine, for there is no bread left in the city.
translation:
  language: zh_hans
  text: “我主我王，这些人对先知耶利米所做的一切都是恶行。他们把耶利米扔进蓄水池[a]，他会因饥荒死在那里，因为城里已经没有粮食了。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“坑”。希伯来语בּוֹר可指坑、地牢或蓄水池；这里按上下文译作“蓄水池”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: 我主我王
  rationale: 保留第一人称敬称与君王头衔，采用简洁、庄重而自然的宫廷称呼。
- source_word: הֵרֵעוּ
  choice: 都是恶事
  rationale: 该使役词形在此表达道德上的作恶，不弱化为一般的“做错了”。
- source_word: הָאֲנָשִׁים הָאֵלֶּה
  choice: 这些人
  rationale: 按上下文指控眼前所说的那群男子；现代汉语以“这些人”自然表达，不必额外标明性别。
- source_word: אֵת כָּל אֲשֶׁר עָשׂוּ לְיִרְמְיָהוּ הַנָּבִיא
  choice: 向先知耶利米所做的一切
  rationale: 保留“所做的一切”的周全语气，并明确保留耶利米的先知身份。
- source_word: הִשְׁלִיכוּ אֶל הַבּוֹר
  choice: 扔进蓄水池
  rationale: בּוֹר 可指坑、地牢或蓄水池；本段上下文提到池底的淤泥，因此“蓄水池”最贴切。
- source_word: וַיָּמָת
  choice: 他会……死
  rationale: 形式上是连续式过去时，但语境是在警告耶利米若仍被留在那里便将死亡；汉语用将来结果表达其语用意义。
- source_word: תַּחְתָּיו
  choice: 在那里
  rationale: 该表达字面涉及“在其下/原处”，此处实际指耶利米被投入后所在之处，以“在那里”最自然。
- source_word: מִפְּנֵי הָרָעָב
  choice: 因饥荒
  rationale: 指被围城中的整体饥荒处境，不仅是个人感到饥饿。
- source_word: כִּי אֵין הַלֶּחֶם עוֹד בָּעִיר
  choice: 因为城里已经没有饼了
  rationale: 保留לֶחֶם的具体意象“饼”，并以“已经没有……了”表达עוֹד在否定句中的“不再、没有剩下”之意。
theological_decisions:
- issue: וַיָּמָת所指的死亡是已经发生、正在发生，还是预期结果
  choice: 译作“他会……死”，表达若不获救便将发生的结果
  alternative: “他快要死了”或按形式直译“他死了”
  rationale: 后续叙事表明耶利米当时尚未死亡；此处是在陈明迫近且几乎必然的后果。译文不把它解释为已经发生的死亡，也不过度断定具体死亡时刻。
translation_notes:
  register: 采用现代、庄重且易懂的叙事语言。“我主我王”保留恭敬称呼；“饼”保留原文具体词语，而不泛化为“食物”。脚注标记置于其实际说明的“蓄水池”之后。
