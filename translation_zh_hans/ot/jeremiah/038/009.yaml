  to: “我主我王，这些人对先知耶利米所做的一切都是恶行。他们把耶利米扔进蓄水池[a]，他会因饥荒死在那里，因为城里已经没有粮食了。”
  rationale: 修订仅调整两处：以“恶行”更自然地表达原文对其行为的道德谴责；以“粮食”表达 לֶחֶם 在饥荒、围城语境中所指的基本食物供应，避免现代汉语“饼”的狭义误解。其余措辞及脚注锚点均可保留。
