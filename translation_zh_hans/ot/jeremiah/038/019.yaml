base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/038/019.yaml
  text: Then King Zedekiah said to Jeremiah[a], “I am afraid of the Judeans who have defected to the Chaldeans[e][d][c][b], lest they hand me over to them and they mistreat me.”
translation:
  language: zh_hans
  text: 西底家王对耶利米说：“我害怕那些已经投奔迦勒底人的犹大人[a]，恐怕他们把我交在迦勒底人手里，迦勒底人就凌辱我。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “犹大人”也可译作“犹太人”；这里特指当时犹大国的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: דֹאֵג
  choice: 害怕
  rationale: 在此语境中，西底家所表达的是对投降后果的恐惧；“害怕”比“担忧”更准确地传达其情绪强度。
- source_word: הַיְּהוּדִים
  choice: 犹大人
  rationale: 这里特指当时属于犹大、后来投奔敌军的人；“犹大人”既符合历史背景，也避免现代“犹太人”可能带来的宽泛含义。
- source_word: נָפְלוּ אֶל
  choice: 投奔
  rationale: 这一军事政治语境中的惯用表达意为转投对方阵营；“投奔”自然地涵盖了归附或投降之意，而不强行限定具体方式。
- source_word: הַכַּשְׂדִּים
  choice: 迦勒底人
  rationale: 保留希伯来文的具体称谓；在《耶利米书》中，该词常指新巴比伦政权及其军队。
- source_word: יִתְּנוּ אֹתִי בְּיָדָם
  choice: 迦勒底人把我交在他们手里
  rationale: 原文直译为“把我交在他们手中”。补明前一主语为迦勒底人，并保留“交在……手里”的权势意象，使两个复数指代在中文中清楚。
- source_word: וְהִתְעַלְּלוּ בִי
  choice: 让他们凌辱我
  rationale: 该动词表示恶意、残酷或羞辱性的对待。“凌辱”保留较强语气，却不限定为单纯嘲笑或某一种具体虐待。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重且易懂的叙事语言。为消除原文连续复数代词在中文中的歧义，第二句补明“迦勒底人”；同时保留“交在他们手里”这一希伯来语权势意象。
