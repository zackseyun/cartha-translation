base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/038/013.yaml
  text: So they pulled Jeremiah up with the ropes and brought him up out of the cistern[b][a], and Jeremiah remained in the court of the guard.
translation:
  language: zh_hans
  text: 于是，他们用绳子拉耶利米，把他从蓄水池[a]中拉上来。耶利米仍留在护卫兵的院子[b]里。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“坑”。希伯来语 בּוֹר 可指坑、蓄水池或地牢；这里按叙事情景译作“蓄水池”。
    reason: lexical_alternative
  - marker: b
    text: 或译“护卫所的院子”或“监牢的院子”。希伯来语这一说法指有人看守的拘禁区域。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמְשְׁכוּ
  choice: 拉上来
  rationale: 动词 משׁך 表示拉、牵引；结合绳索和从池中救出的情景，译作“拉上来”自然且具体。
- source_word: בַּחֲבָלִים
  choice: 用绳子
  rationale: חֲבָלִים 指绳索；介词 ב 在此表示工具，译作“用绳子”符合现代汉语。
- source_word: וַיַּעֲלוּ אֹתוֹ
  choice: 使他出了
  rationale: עלה 的使役式表示使某人上来。前句已说“拉上来”，此处译作“使他出了”既保留使役含义，也避免汉语中生硬重复。
- source_word: מִן הַבּוֹר
  choice: 出了蓄水池
  rationale: בּוֹר 可指坑、蓄水池或地牢；本段叙事明确涉及储水设施，故正文采用“蓄水池”，同时以脚注保留“坑”的可能译法。
- source_word: וַיֵּשֶׁב
  choice: 仍留在
  rationale: ישׁב 可表示坐、居住或停留；此处叙述耶利米获救后继续被安置在原有拘禁区域，译作“仍留在”最贴合语境。
- source_word: בַּחֲצַר הַמַּטָּרָה
  choice: 在护卫院里
  rationale: חָצֵר 是院子，מַטָּרָה 在《耶利米书》中指有人看守的拘禁区域。“护卫院”简洁保留其受看守的性质，又不把它过度具体化为某座监狱建筑。
theological_decisions: []
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“于是”承接前文救援行动；分为两句以清楚呈现获救与继续受拘禁两个叙事动作。所有词义上的真实可能性均以脚注保留。
