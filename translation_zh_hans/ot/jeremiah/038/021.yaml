  text: וְ/אִם מָאֵ֥ן אַתָּ֖ה לָ/צֵ֑את זֶ֣ה הַ/דָּבָ֔ר אֲשֶׁ֥ר הִרְאַ֖/נִי יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/038/021.yaml
  text: 'But if you refuse to go out[a], this is the word that Yahweh has shown me:'
translation:
  language: zh_hans
  text: 但你若不肯出去，这是耶和华所指示我的话[a]：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“这是耶和华向我显明的事。”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: 但你若
  rationale: 结合上文，此处条件句带有转折意味；“但你若”自然体现这一语境关系。
- source_word: מָאֵן
  choice: 不肯
  rationale: 该动词表示出于意愿的拒绝，而非没有能力；“不肯”准确且符合现代汉语。
- source_word: לָצֵאת
  choice: 出去
  rationale: 原文直指“出去”。虽然语境中是出去到巴比伦官长那里，但本节没有明说“投降”，因此不把解释写入正文。
- source_word: זֶה הַדָּבָר
  choice: 话是这样
  rationale: דָּבָר可指“话、事情、事”。这里引出先知所得的神圣启示，“话是这样”既保留言语含义，也使汉语引语结构自然。
- source_word: אֲשֶׁר הִרְאַנִי
  choice: 所指示我的
  rationale: ראה的使役式有“使看见、显示”之意；“指示”适合启示语境，同时没有过度限定启示的具体方式。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的神名音译“耶和华”，将专名与“主”这一称号区分开来。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 正文保留神的专名而不以“主”替代；在简体中文通行语境中，“耶和华”最易为普通读者识别。
- issue: 是否把לָצֵאת解释为投降
  choice: 译作“出去”
  alternative: 译作“出去投降”
  rationale: 上下文确实涉及向巴比伦官长归降，但本节原文只说“出去”；正文保留原文措辞及其语境张力，不添加未明说的行动性质。
- issue: דָּבָר在启示语境中的含义
  choice: 译作“话”
  alternative: 译作“事情”
  rationale: 该词兼有“话”和“事情”等义。这里后接耶和华向先知显示的内容，采用“话”贴合先知宣告，同时不否认后文也可能描述一个景象或事态。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“不肯出去”简洁保留意志性拒绝；句末冒号表明下文将展开耶和华所指示的内容。
