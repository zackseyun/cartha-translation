source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר יִרְמְיָ֖הוּ לֹ֣א יִתֵּ֑נוּ שְֽׁמַֽע נָ֣א בְּ/ק֣וֹל יְהוָ֗ה לַ/אֲשֶׁ֤ר אֲנִי֙ דֹּבֵ֣ר אֵלֶ֔י/ךָ וְ/יִ֥יטַב לְ/ךָ֖ וּ/תְחִ֥י נַפְשֶֽׁ/ךָ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/038/020.yaml
  text: Jeremiah said[a], “They will not hand you over. Please listen to the voice of Yahweh in what I am speaking to you, so that it may go well with you and your life may be spared.”
translation:
  language: zh_hans
  text: 耶利米说：“他们不会把你交出去[a]。请听从雅威的话，就是我对你所说的；这样，对你就会有好处，你的性命也会保全[c]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“他们不会把你交给他们”。原文动词直译为“他们不会交出”，宾语由上下文补出。
    reason: lexical_alternative
  - marker: c
    text: 原文直译为“你的性命将活着”。这里指肉身性命得以保存。
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא יִתֵּנוּ
  choice: 他们不会把你交出去
  rationale: 动词是第三人称复数，宾语“你”由上下文补出；“交出去”自然表达把西底家交到迦勒底人手中的意思，同时保留主语“他们”。
- source_word: שְׁמַע נָא
  choice: 请听从
  rationale: 祈使式加语气词 נָא 带有恳切请求的意味。“请”传达这一语气；“听从”兼顾聆听与依从。
- source_word: בְּקוֹל יְהוָה
  choice: 听从雅威的声音
  rationale: 保留希伯来语“声音”的意象，同时用“听从”表达此惯用语中留心并遵行的含义。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以“雅威”音译四字神名，保留经文所用的专名，不以称号代替。
- source_word: לַאֲשֶׁר אֲנִי דֹּבֵר אֵלֶיךָ
  choice: 照我对你所说的话去做
  rationale: 该短语把雅威的声音与耶利米正在传达的话相连；此译法在现代汉语中自然地表达按所传之言听从，而不把耶利米说成话语的最终源头。
- source_word: וְיִיטַב לְךָ
  choice: 这样，你就会平安无事
  rationale: 这是表示处境转好、结局有利的常见表达；结合眼前生命危险，“平安无事”清楚而自然。“这样”显明听从之后的结果。
- source_word: וּתְחִי נַפְשֶׁךָ
  choice: 性命也能保住
  rationale: נֶפֶשׁ 在此指人的生命，而非专指非物质的灵魂；“性命保住”自然传达免于死亡的实际结果。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。音译“雅威”保留其专名性质，避免以称号替换，也不据此加入额外的教派性解释。
- issue: נֶפֶשׁ 在生死威胁语境中的含义
  choice: 性命也能保住
  alternative: 你的灵魂将活着；你将活下去
  rationale: 上下文关注西底家的肉身性命是否得以保存。“性命”符合此处词义，也避免把本句解作关于灵魂构成的教义陈述。
- issue: 听从与存活之间的关系
  choice: 这样，你就会……
  alternative: 并且你会……；好使你可以……
  rationale: 连续的未完成式可表达随前一命令而来的有利结果。用“这样”呈现结果关系，但不进一步界定这是无条件预言还是带条件的应许。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“交出去”“平安无事”“性命保住”符合当代读者习惯；保留“雅威的声音”这一希伯来语意象，并以脚注说明其惯用含义。
