base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/038/024.yaml
  text: Then Zedekiah said to Jeremiah[a], “Let no one know about these things[b], and you will not die.”
translation:
  language: zh_hans
  text: 西底家对耶利米说：“这些事不要让任何人知道[a]，你就不至于死[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “任何人”原文直译为“一个人”，在这里是泛指。
    reason: lexical_alternative
  - marker: b
    text: 末句也可理解为目的：“免得你死”或“好使你不死”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: 未将叙事性连接词וַ独立译为“然后”；现代汉语连续叙事中可由语序自然体现推进，避免生硬重复。
- source_word: צִדְקִיָּהוּ אֶל יִרְמְיָהוּ
  choice: 西底家对耶利米
  rationale: 人名采用现代中文圣经通行译名；介词אֶל在言说结构中自然译作“对”。
- source_word: אִישׁ אַל יֵדַע
  choice: 不要让任何人知道
  rationale: אִישׁ在否定语境中泛指任何人，并非特指男性；אַל加未完成式表达禁止或劝阻。此译法符合现代汉语，又保留命令力度。
- source_word: בַּדְּבָרִים הָאֵלֶּה
  choice: 这些事
  rationale: דְּבָרִים可指话语、事情或事项；上下文指刚才谈论的内容。“这些事”保持其宽泛性，不擅自限定为“这次谈话”。
- source_word: וְלֹא תָמוּת
  choice: 你就不至于死
  rationale: וְ连接后句，其关系可理解为随之而来的结果、保证或隐含目的。“就不至于死”在中文中自然表达与保密要求相联的后果，同时用脚注保留其他句法可能。
theological_decisions:
- issue: 保密与“不死”之间的逻辑关系
  choice: 正文译为“你就不至于死”
  alternative: “免得你死”或“这样你就不会死”
  rationale: 希伯来文仅用וְ并列连接，语境可能表达结果、保证或目的。正文不把它强化为明确威胁，也不排除目的含义，脚注说明其开放性。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“任何人”准确传达泛指意义；“不至于死”比“不会死”略显庄重，并保留原文关于结果、保证或目的的张力。所有脚注标记均置于正文对应位置。
