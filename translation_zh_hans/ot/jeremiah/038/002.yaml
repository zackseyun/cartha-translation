  naturalness: 整体庄重通顺，但“性命必归他作战利品”搭配生硬，且脚注锚点误置在“刀剑”之后，读者会误以为脚注解释“刀剑”。修订后将锚点置于相关惯用语之后。
  terminology: “耶和华”“迦勒底人”“刀剑、饥荒和瘟疫”“性命”均合乎现代中文圣经语境，也忠实反映原文。保留“战利品”的战争意象，同时在正文中使所属关系明确。
