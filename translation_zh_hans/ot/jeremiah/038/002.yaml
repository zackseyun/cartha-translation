source:
  edition: WLC
  text: כֹּה֮ אָמַ֣ר יְהוָה֒ הַ/יֹּשֵׁב֙ בָּ/עִ֣יר הַ/זֹּ֔את יָמ֕וּת בַּ/חֶ֖רֶב בָּ/רָעָ֣ב וּ/בַ/דָּ֑בֶר וְ/הַ/יֹּצֵ֤א אֶל הַ/כַּשְׂדִּים֙ יחיה וְ/הָיְתָה לּ֥/וֹ נַפְשׁ֛/וֹ לְ/שָׁלָ֖ל וָ/חָֽי־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/038/002.yaml
  text: 'Thus says Yahweh: He who remains in this city will die by the sword[a], by famine, and by pestilence; but he who goes out to the Chaldeans will live, and his life will be to him as spoil, and he will live.'
translation:
  language: zh_hans
  text: 耶和华如此说：“凡留在这城里的，必死于刀剑、饥荒和瘟疫；但凡出去到迦勒底人那里去的，必存活；他的性命必成为他所得的战利品[a]，他也必活着。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译作“他的性命必归他作战利品”。这是希伯来语的战争隐喻，意为他得以保全性命；也可译作“他必以自己的性命为掠物”。
    reason: 解释“性命作为战利品”的希伯来语惯用表达，保留其战争意象，并将脚注锚定在所释短语之后。
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的专名形式译出四字神名，不以“主”替代，从而保留原文的专名指称。
- source_word: הַיֹּשֵׁב בָּעִיר הַזֹּאת
  choice: 留在这城里的
  rationale: ישׁב在此指继续留在城中，并非字面“坐着”；此译自然且保留分词所表达的泛指人物。
- source_word: בַּחֶרֶב בָּרָעָב וּבַדָּבֶר
  choice: 死于刀剑、饥荒和瘟疫
  rationale: 保留耶利米书常见的三重灾祸；“瘟疫”准确表达דֶּבֶר在审判语境中的传染性灾病。
- source_word: וְהַיֹּצֵא אֶל הַכַּשְׂדִּים
  choice: 但出去投向迦勒底人的
  rationale: “出去”保留原词动作，“投向”交代在围城语境中前往敌方阵营的含义，同时避免完全释义为“投降”；“但”体现上下句的明显对比。
- source_word: יִחְיֶה ... וָחָי
  choice: 必存活……他必活着
  rationale: 原文两次使用חיה词根，译文分别保留，以呈现重复和强调；首次用“存活”贴合险境中的生还，末次用“活着”保留措辞变化而不删减。
- source_word: נַפְשׁוֹ
  choice: 他的性命
  rationale: נֶפֶשׁ在此指人在灾难中得以保全的生命，而非狭义的非物质“灵魂”；“性命”适合汉语战争语境。
- source_word: לְשָׁלָל
  choice: 作战利品
  rationale: 保留战争中掳物的隐喻；“战利品”比单说“掠物”更易为普通现代读者理解。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威；主
  rationale: 原文直接使用四字神名。译作中文传统且广为人知的专名“耶和华”，既不以称号取代专名，也不要求读者接受对古代发音的单一重建。
- issue: נֶפֶשׁ在“性命作战利品”惯用语中的含义
  choice: 性命
  alternative: 灵魂
  rationale: 上下文关乎围城时肉身生命的保全；译作“性命”避免把本节误解为在讨论灵魂与身体的构成。
- issue: “出去到迦勒底人那里”的语用含义
  choice: 出去投向迦勒底人
  alternative: 出去到迦勒底人那里；向迦勒底人投降
  rationale: 语境暗含离城归向围城军队，但动词本身是“出去”。“投向”在保留动作的同时传达阵营转换，又不像“投降”那样将隐含意义完全明说。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“必”传达预告的确定性；保留“刀剑、饥荒和瘟疫”的先知性三联表达，并保留原文末尾重复的“活”字意念。
