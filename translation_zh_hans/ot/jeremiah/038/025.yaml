source:
  edition: WLC
  text: וְ/כִֽי יִשְׁמְע֣וּ הַ/שָּׂרִים֮ כִּֽי דִבַּ֣רְתִּי אִתָּ/ךְ֒ וּ/בָ֣אוּ אֵלֶ֣י/ךָ וְֽ/אָמְר֪וּ אֵלֶ֟י/ךָ הַגִּֽידָ/ה נָּ֨א לָ֜/נוּ מַה דִּבַּ֧רְתָּ אֶל הַ/מֶּ֛לֶךְ אַל תְּכַחֵ֥ד מִמֶּ֖/נּוּ וְ/לֹ֣א נְמִיתֶ֑/ךָ וּ/מַה דִּבֶּ֥ר אֵלֶ֖י/ךָ הַ/מֶּֽלֶךְ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/038/025.yaml
  text: But if the officials hear that I have spoken with you[a], and they come to you and say to you, ‘Please tell us what you said to the king; do not hide it from us, and we will not put you to death, and what the king said to you,’
translation:
  language: zh_hans
  text: 但官长[a]若听说我和你谈过，就会来见你，对你说：‘请告诉我们，你对王说了什么，不要向我们隐瞒，我们就不处死你；王对你说了什么，也要告诉我们。’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “官长”也可译作“首领”，指王室或政府中的领袖官员。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: 但……若
  rationale: 在上下文中引出一个带轻微转折意味的条件情形；“但……若”兼顾承接、转折和假设语气。
- source_word: הַשָּׂרִים
  choice: 官长
  rationale: 此处指犹大宫廷或政府中的统治官员，并不必然指王子；“官长”庄重且符合古代政治语境。
- source_word: דִבַּרְתִּי אִתָּךְ
  choice: 我和你谈过
  rationale: 介词 אֵת 表示双方交谈；完成式表示谈话已经发生，并与当前假设有关。
- source_word: וּבָאוּ אֵלֶיךָ
  choice: 就会来见你
  rationale: 置于条件句的连续动作中，按现代汉语自然表达为预期将发生的结果。
- source_word: הַגִּידָה נָּא לָנוּ
  choice: 请告诉我们
  rationale: 命令式配合 נָא，表达带催促意味的请求；“请告诉我们”自然保留其语气。
- source_word: מַה דִּבַּרְתָּ אֶל־הַמֶּלֶךְ
  choice: 你对王说了什么
  rationale: 准确表达对王所说内容的询问，符合现代汉语习惯。
- source_word: אַל־תְּכַחֵד מִמֶּנּוּ
  choice: 不要向我们隐瞒
  rationale: כחד 指隐瞒或隐藏；宾语由前文可知，汉语无需另行补出。
- source_word: וְלֹא נְמִיתֶךָ
  choice: 我们就不处死你
  rationale: מות 的使役形意为使人死亡；“处死”符合此处官员以死亡相威胁的语境。
- source_word: וּמַה דִּבֶּר אֵלֶיךָ הַמֶּלֶךְ
  choice: 王对你说了什么，也要告诉我们
  rationale: 原文是与前一问并列的省略结构；补出“也要告诉我们”可使汉语完整自然，同时不改变所问内容。
theological_decisions: []
