base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/038/003.yaml
  text: 'Thus says Yahweh: This city will surely be given into the hand of the army of the king of Babylon[a], and he will capture it.'
translation:
  language: zh_hans
  text: 雅威如此说：“这城必交在巴比伦王的军队手中[a]；并必攻取这城[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“交在巴比伦王军队的掌控之下”。原文直译为“交在……手中”。
    reason: lexical_alternative
  - marker: b
    text: 原文动词为阳性单数，未重复说明主语；可按语法理解为巴比伦王，也可按上下文理解为其军队。
    reason: referential_ambiguity
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  choice: 雅威如此说
  rationale: 保留先知宣告的固定格式；用“如此说”体现庄重、权威的语气，并以“雅威”呈现神的专名。
- source_word: הִנָּתֹן תִּנָּתֵן
  choice: 必交在
  rationale: 原文以不定式绝对式配合同根限定动词，加强“交出”的确定性；“必”简洁表达强调和将来必然性。
- source_word: הָעִיר הַזֹּאת
  choice: 这城
  rationale: 准确对应指示词和名词，在现代汉语中自然简练。
- source_word: בְּיַד
  choice: 在……的手中
  rationale: 保留希伯来语“在手中”的形象表达，同时汉语读者可自然理解为落入某方掌控。
- source_word: חֵיל מֶלֶךְ בָּבֶל
  choice: 巴比伦王军队
  rationale: חֵיל在此军事语境中指军队；这一语序符合现代汉语，并清楚表达军队隶属巴比伦王。
- source_word: וּלְכָדָהּ
  choice: 他必攻取这城
  rationale: לכד用于城市时通常指攻占、夺取；“攻取”准确体现军事语境。原文宾语后缀为阴性单数，指前文的“城”。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”按较通行的学术重构音译，保留其作为专名的性质，而不以称号替代。
- issue: וּלְכָדָהּ 隐含主语的指向
  choice: 正文保留单数“他”，并以脚注说明可指巴比伦王或按上下文指其军队
  alternative: 明确译作“巴比伦王必攻取这城”或“军队必攻取这城”
  rationale: 希伯来语动词为第三人称阳性单数，但没有明说主语；直接限定为王或军队都会消除原文尚存的语法歧义。
translation_notes:
  register: 采用现代、庄重而易懂的先知宣告体。“必”传达原文的强烈确定语气；“手中”保留希伯来语意象。标点和引号按现代简体中文规范处理。
