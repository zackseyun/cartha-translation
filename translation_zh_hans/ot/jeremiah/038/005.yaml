base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/038/005.yaml
  text: Then King Zedekiah said[a], “Look, he is in your hands, for the king can do nothing against you.”
translation:
  language: zh_hans
  text: 西底家王说：“看哪，他在你们手中，因为王不能对你们做什么。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: 未另译连接词，以自然汉语叙事承接上文；动词保留话语引入功能。
- source_word: הַמֶּלֶךְ צִדְקִיָּהוּ
  choice: 西底家王
  rationale: 按现代汉语习惯采用“人名＋王”的称号结构。
- source_word: הִנֵּה
  choice: 看哪
  rationale: 保留提示听者注意的指示语气，同时维持庄重的经文语体。
- source_word: הוּא
  choice: 他
  rationale: 独立代词指耶利米，在无动词句中作主语。
- source_word: בְּיֶדְכֶם
  choice: 在你们手中
  rationale: 保留希伯来语以“手”表示掌控权的意象；现代汉语也能自然理解。
- source_word: כִּי
  choice: 因为
  rationale: 在此引出王作出让步的理由。
- source_word: אֵין הַמֶּלֶךְ יוּכַל
  choice: 王不能
  rationale: 保留原文第三人称自称“王”，不改写为“我不能”，从而保存其修辞上的疏离感。
- source_word: אֶתְכֶם דָּבָר
  choice: 反对你们做什么
  rationale: 原结构简略，直近义为王不能就他们做一件事；结合语境，表达王无力反对或制止他们，同时以“做什么”保留 דָּבָר 的宽泛性。
theological_decisions:
- issue: 王所声称的无能是客观无权还是不愿行使权力
  choice: 不在正文中判定，只译作“王不能”
  alternative: 译成“王拿你们没有办法”或“王无法否决你们”
  rationale: 原文陈述能力上的否定，但上下文可能包含政治软弱或推卸责任；译文不替文本判定其动机。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“看哪”保留原文提示语气；“在你们手中”保留手的权力意象；末句尽量兼顾原文省略结构与上下文中“不能反对、制止”的含义。
