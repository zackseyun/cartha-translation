base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/038/012.yaml
  text: Then Ebed-melech the Cushite said to Jeremiah[a], “Please put these worn-out rags and torn clothes under your armpits[c][b], under the ropes.” And Jeremiah did so.
translation:
  language: zh_hans
  text: 古实人以伯·米勒对耶利米说[a]：“请把这些破旧的碎布和旧衣服[b]垫在腋下[c]，放在绳子下面。”耶利米就照着做了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “古实人”指来自古实的人；传统译法有“埃塞俄比亚人”。
    reason: lexical_alternative
  - marker: b
    text: 这里两个希伯来语材料名称较为罕见，可能泛指用来垫在身体与绳索之间的各种破旧布料。
    reason: lexical_alternative
  - marker: c
    text: 原文直译近于“你手臂的关节下面”；这里按上下文译作“腋下”，即吊起时绳索会压住的部位。
    reason: lexical_alternative
lexical_decisions:
- source_word: עֶבֶד מֶלֶךְ
  choice: 以伯·米勒
  rationale: 按专名音译，不按其词面意义“王的仆人”翻译；采用现代中文清楚可读的分隔形式。
- source_word: הַכּוּשִׁי
  choice: 古实人
  rationale: 直接保留希伯来语的民族地理称谓，避免以传统的“埃塞俄比亚人”替代而过度确定其与现代国家的对应关系。
- source_word: שִׂים נָא
  choice: 请把……垫在
  rationale: “请”体现 נָא 的恳请语气；结合这些布料作为衬垫的语境，以“垫在”自然表达 שִׂים。
- source_word: בְּלוֹאֵי הַסְּחָבוֹת וְהַמְּלָחִים
  choice: 这些破旧的碎布和烂衣服
  rationale: 两个材料名词罕见且含义不完全确定；译文保留两类破旧布制品的并列，又避免进一步臆断具体材质或形状。
- source_word: תַּחַת אַצִּלוֹת יָדֶיךָ
  choice: 垫在腋下
  rationale: 字面涉及手臂的关节或连接部位；在用绳索吊人的场景中，所指最可能是绳索压迫的腋下区域。
- source_word: מִתַּחַת לַחֲבָלִים
  choice: 隔在绳子下面
  rationale: 表达布料位于身体与绳索之间、起缓冲作用；“隔在”使空间关系在中文中更清楚。
- source_word: וַיַּעַשׂ יִרְמְיָהוּ כֵּן
  choice: 耶利米就照着做了
  rationale: 自然表达希伯来叙事中表示遵从指示的固定句式。
