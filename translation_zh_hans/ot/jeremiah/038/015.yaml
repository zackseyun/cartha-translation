  text: וַ/יֹּ֤אמֶר יִרְמְיָ֨הוּ֙ אֶל צִדְקִיָּ֔הוּ כִּ֚י אַגִּ֣יד לְ/ךָ֔ הֲ/ל֖וֹא הָמֵ֣ת תְּמִיתֵ֑/נִי וְ/כִי֙ אִיעָ֣צְ/ךָ֔ לֹ֥א תִשְׁמַ֖ע אֵלָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/038/015.yaml
  text: Jeremiah said to Zedekiah[a], “If I tell you, will you not surely put me to death? And if I advise you[b], you will not listen to me.”
translation:
  language: zh_hans
  text: 耶利米对西底家说：“我若告诉你，你岂不一定把我处死吗？我若劝你，你也不会听从我[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “听从我”也可译作“听我的话”；原词在这里既可侧重听取，也可含采纳、照办之意。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אַגִּיד לְךָ
  choice: 我若告诉你
  rationale: כִּי 在这里结合未完成式引出假设情形；“我若告诉你”自然表达耶利米的条件性顾虑。נגד 的使役式在此意为告诉、说明。
- source_word: הֲלוֹא
  choice: 你岂不……吗
  rationale: 该疑问词组引出预期肯定回答的反问；“岂不……吗”保留了原文的反问语气。
- source_word: הָמֵת תְּמִיתֵנִי
  choice: 一定把我处死
  rationale: 原文以绝对不定式配合同根限定动词加强语气。“一定”体现强调，“把我处死”符合君王下令杀害先知的语境。
- source_word: וְכִי אִיעָצְךָ
  choice: 我若劝你
  rationale: וְכִי 引出与前句平行的第二个假设；יעץ 意为劝告、进言。“劝你”简洁自然。
- source_word: לֹא תִשְׁמַע אֵלָי
  choice: 你也不会听从我
  rationale: שׁמע אֶל 可指听某人的话，并可含接受、照办之意。“听从”在本语境中兼顾听取和采纳，脚注说明较弱的译法。
- source_word: יִרְמְיָהוּ / צִדְקִיָּהוּ
  choice: 耶利米／西底家
  rationale: 采用现代中文圣经传统中通行且易识别的人名译法。
