base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/038/007.yaml
  text: Ebed-melech the Cushite[a], a court official who was in the king’s house, heard that they had put Jeremiah into the cistern[c][b], while the king was sitting at the Benjamin Gate.
translation:
  language: zh_hans
  text: 古实人以伯·米勒是一名官员[a]，当时在王宫里。他听说有人已经把耶利米放进蓄水池[b]里；当时王正坐在便雅悯门那里。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “官员”所对应的希伯来语也可指“太监”。
    reason: lexical_alternative
  - marker: b
    text: 或译“坑”。这里所用的希伯来语既可指坑，也可指蓄水池；本章下文表明这是一个没有水、只有淤泥的蓄水池。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: 听说
  rationale: שׁמע在这里引出所听见的消息内容；“听说”自然传达叙事动作，不额外加入原文没有的时间副词。
- source_word: עֶבֶד מֶלֶךְ
  choice: 以伯·米勒
  rationale: 此处是人名，按希伯来语音译，不按字面译成“王的仆人”。
- source_word: הַכּוּשִׁי
  choice: 古实人
  rationale: 指来自古实的人；“古实人”保留原文的民族地理称谓，避免使用可能造成现代地域联想的传统译名。
- source_word: אִישׁ סָרִיס
  choice: 一名官员
  rationale: סָרִיס既可指被阉割的人，也可泛指王室官员。正文采用符合宫廷语境且自然的“官员”，并用脚注保留另一种可能。
- source_word: וְהוּא בְּבֵית הַמֶּלֶךְ
  choice: 是王宫里的
  rationale: בֵּית הַמֶּלֶךְ字面为“王的家/房屋”，此处指王宫；译为“王宫里”既明确地点，也与官员身份自然衔接。
- source_word: כִּי
  choice: （听说）
  rationale: 此处כִּי引出听见的内容，汉语无需另译连接词，由“听说”直接统摄后面的从句。
- source_word: נָתְנוּ אֶת־יִרְמְיָהוּ אֶל־הַבּוֹר
  choice: 众人已经把耶利米放进蓄水池里
  rationale: 未明确指出的复数主语译作“众人”；“已经”显示该动作先于听见发生。בּוֹר可指坑或蓄水池，本章语境支持“蓄水池”。
- source_word: וְהַמֶּלֶךְ יוֹשֵׁב
  choice: 当时，王正坐着
  rationale: 分词יוֹשֵׁב表达与主叙事同时存在的背景状态；“当时……正……”自然体现这种伴随关系。
- source_word: בְּשַׁעַר בִּנְיָמִן
  choice: 在便雅悯门那里
  rationale: 指名为便雅悯门的特定城门；“那里”使汉语地点表达自然，同时不把בְּ过度限定为门内或门旁。
