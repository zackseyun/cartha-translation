base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/038/001.yaml
  text: Shephatiah son of Mattan[a], Gedaliah son of Pashhur, Jucal son of Shelemiah, and Pashhur son of Malchiah heard the words that Jeremiah was speaking to all the people, saying,
translation:
  language: zh_hans
  text: 玛坦的儿子示法提、巴施户珥的儿子基大利、示利米雅的儿子犹甲[a]，以及玛基雅的儿子巴施户珥，听见了耶利米正在对众百姓说的话：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节的希伯来文作“犹甲”；同一人在别处以较完整的名字“耶户甲”出现（耶37:3）。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: 听见了
  rationale: 该词为שׁמע的Qal叙事式，直接叙述这些人听见耶利米话语这一事件；不另加原文没有的“那时”或“现在”。
- source_word: שְׁפַטְיָה ... גְדַלְיָהוּ ... יוּכַל ... פַשְׁחוּר
  choice: 示法提……基大利……犹甲……巴施户珥
  rationale: 人名按现代中文圣经读者较熟悉的形式音译；本节的יוּכַל采用反映此处辅音形式的“犹甲”，其较完整形式另见耶利米书37:3。
- source_word: בֶּן
  choice: ……的儿子
  rationale: 清楚表达人物的父子关系及身份标识，并符合现代汉语姓名串列方式。
- source_word: אֶת הַדְּבָרִים
  choice: 所说的话
  rationale: דְּבָרִים在此指耶利米口头表达的内容；译作“话”比“事情”或抽象的“信息”更直接。
- source_word: אֲשֶׁר יִרְמְיָהוּ מְדַבֵּר
  choice: 耶利米正在……说的
  rationale: מְדַבֵּר为分词，呈现他们听见时仍在进行的讲话；“正在”保留这一未完成体意味。
- source_word: אֶל כָּל הָעָם
  choice: 对众百姓
  rationale: עָם在此指耶利米讲话所面对的全体民众；“众百姓”自然、庄重，也不把它抽象化为民族或国家。
- source_word: לֵאמֹר
  choice: ：
  rationale: 该引语引介词连接下一节的直接引语。现代汉语用冒号自然承担这一功能，避免生硬重复“说的话，说”。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。按希伯来文次序列出四人及其父名；用“正在”保留分词所表达的持续动作，并以冒号自然引出下一节的话语。脚注标记置于实际涉及的“犹甲”之后。
