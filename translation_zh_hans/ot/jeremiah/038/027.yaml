base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/038/027.yaml
  text: Then all the officials came to Jeremiah and questioned him[a], and he told them all these words that the king had commanded. So they were silent before him, for the matter had not been heard.
translation:
  language: zh_hans
  text: 于是，所有官员都来到耶利米那里，盘问他；他就把王所吩咐的这一切话告诉了他们。他们便不再对他说什么，因为那件事没有被人听见。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因为那番谈话没有被人听见。”希伯来文直译为“因为那件事没有被听见”，可能是说王与耶利米的谈话无人听见，因此官员接受了耶利米的回答，不再追问。
    reason: 说明 הַדָּבָר 可泛指“那件事”，也可能特指先前的谈话；保留原文被动句及未明说听者的含混性。
lexical_decisions:
- source_word: הַשָּׂרִים
  choice: 官员
  rationale: 在王宫行政语境中，שַׂר 指掌权的官员或首领；“官员”自然准确，也不暗示他们必为王子或军官。
- source_word: וַיִּשְׁאֲלוּ אֹתוֹ
  choice: 盘问他
  rationale: 这里是官员针对耶利米与王的会面加以查问，并非一般询问；“盘问”体现语境中的追查意味。
- source_word: וַיַּגֵּד לָהֶם
  choice: 告诉了他们
  rationale: נגד 的使役式在此意为使人知道、告知；此译符合现代叙事语言。
- source_word: כְּכָל הַדְּבָרִים הָאֵלֶּה
  choice: 照……把这一切话
  rationale: כְּ 表示依照，דברים 在这里指王预先吩咐耶利米所说的话；译文兼顾“照着”与言语内容。
- source_word: אֲשֶׁר צִוָּה הַמֶּלֶךְ
  choice: 王所吩咐的
  rationale: צוה 表示有权威的命令；“吩咐”适合王对耶利米交代说辞的上下文。
- source_word: וַיַּחֲרִשׁוּ מִמֶּנּוּ
  choice: 他们便不再追问他
  rationale: חרשׁ 表示沉默，结合前面的盘问，此处自然表达为停止追问；ממנו 的具体关系略不寻常，译文按语境处理而不扩展为额外行动。
- source_word: כִּי לֹא נִשְׁמַע הַדָּבָר
  choice: 因为那件事没有被人听见
  rationale: 保留希伯来文被动表达及未明说的听者；הדבר 可指事情、话或谈话，正文采用较宽泛的“那件事”。
