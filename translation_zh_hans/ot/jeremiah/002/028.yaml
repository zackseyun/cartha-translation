source:
  edition: WLC
  text: וְ/אַיֵּ֤ה אֱלֹהֶ֨י/ךָ֙ אֲשֶׁ֣ר עָשִׂ֣יתָ לָּ֔/ךְ יָק֕וּמוּ אִם יוֹשִׁיע֖וּ/ךָ בְּ/עֵ֣ת רָעָתֶ֑/ךָ כִּ֚י מִסְפַּ֣ר עָרֶ֔י/ךָ הָי֥וּ אֱלֹהֶ֖י/ךָ יְהוּדָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/028.yaml
  text: But where are your gods that you made for yourself? Let them arise[a], if they can save you in the time of your trouble. For your gods, Judah[b], are as many as your cities.
translation:
  language: zh_hans
  text: 可是，你为自己造的那些神在哪里呢？让它们起来吧，看它们能否在你遭难的时候救你！因为，犹大啊，你的城有多少，你的神也有多少。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאַיֵּה
  choice: 可是……在哪里呢
  rationale: אַיֵּה是询问所在之处的疑问词；前缀וְ在本段责问语境中带有转折和承接作用，译为“可是”自然地传达先知的反诘。
- source_word: אֱלֹהֶיךָ אֲשֶׁר עָשִׂיתָ לָּךְ
  choice: 你为自己造的那些神
  rationale: 复数“神”在上下文中指犹大亲手制造的偶像；“为自己”保留לָּךְ所表达的自为、归己意味。
- source_word: יָקוּמוּ
  choice: 就让它们起来吧
  rationale: 未完成式在这里具有命令或挑战语气，讽刺性地催促这些神明起而行动；“起来吧”保留原文鲜明的拟人表达。
- source_word: אִם יוֹשִׁיעוּךָ
  choice: 它们若能救你
  rationale: אִם在挑战语境中表达带有怀疑意味的条件，“若能”既保留条件性，也自然传达这些偶像无力施救的反讽。
- source_word: בְּעֵת רָעָתֶךָ
  choice: 在你遭难的时候
  rationale: רָעָה在此指临到人的祸患、灾难，而非道德意义上的邪恶；“遭难”简洁且符合现代汉语。
- source_word: כִּי מִסְפַּר עָרֶיךָ הָיוּ אֱלֹהֶיךָ
  choice: 因为……你的城有多少，你的神也有多少
  rationale: כִּי引出对前面挑战的说明；“有多少……也有多少”自然表达מִסְפַּר所指的数目相等，并保留原文对犹大偶像泛滥的谴责。
- source_word: יְהוּדָה
  choice: 犹大啊
  rationale: 此处是对犹大的直接呼告，加“啊”可在现代汉语中清楚标示呼语。
theological_decisions:
- issue: “你的神”所指为何
  choice: 指犹大为自己制造的众多偶像或假神
  alternative: 指耶和华，或含混地译作单数“你的神”
  rationale: 紧接的修饰语“你为自己造的”明确排除了耶和华；复数形式及末句与城邑数目相提并论，也要求保留众多偶像的含义。
- issue: 偶像能否施救的语气
  choice: 保留为带反讽的条件挑战：“若能救你”
  alternative: 直接断言“它们不能救你”
  rationale: 原文没有把否定命题明说出来，而是以命令和条件句形成讽刺性挑战；译文不把隐含结论改写成直陈句。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“那些神”明确复数所指，“就让它们起来吧”保留先知责问中的讽刺力度；末句用汉语对应结构表达数目相等，不增加原文未明说的解释。
