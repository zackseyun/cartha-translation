source:
  edition: WLC
  text: הַ/דּ֗וֹר אַתֶּם֙ רְא֣וּ דְבַר יְהוָ֔ה הֲ/מִדְבָּ֤ר הָיִ֨יתִי֙ לְ/יִשְׂרָאֵ֔ל אִ֛ם אֶ֥רֶץ מַאְפֵּ֖לְיָ֑ה מַדּ֜וּעַ אָמְר֤וּ עַמִּ/י֙ רַ֔דְנוּ לֽוֹא נָב֥וֹא ע֖וֹד אֵלֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/031.yaml
  text: 'O generation[a], you yourselves, see the word of Yahweh: Have I been a wilderness to Israel, or a land of deep darkness? Why has my people said, ‘We are lords; we will come to you no more’?”'
translation:
  language: zh_hans
  text: 这一代人哪[a]，你们自己要留心耶和华的话：难道我对以色列来说成了旷野，或成了幽暗之地吗？为什么我的百姓竟说：‘我们不受约束[b]；再也不来到你这里了’？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “这一代人哪”也可译为“这世代啊”。
    reason: 说明 הַדּוֹר 在此作为呼格的译法。
  - marker: b
    text: “我们不受约束”所译的希伯来语动词含义不确定，也可能指“我们四处游荡”、“我们掌权”或“我们已经挣脱”。在本语境中，这句话表达百姓宣称独立、不再受耶和华约束。
    reason: 保留 רַדְנוּ 的主要词义可能及其在上下文中的共同指向。
lexical_decisions:
- source_word: הַדּוֹר
  choice: 这一代人哪
  rationale: 按呼格理解，保留先知直接呼唤当代听众的语气；“哪”在现代汉语中庄重而自然。
- source_word: אַתֶּם רְאוּ דְבַר יְהוָה
  choice: 你们自己要留心耶和华的话
  rationale: 独立代词 אַתֶּם 表强调，译作“你们自己”；רְאוּ 在此不是单纯视觉动作，而是要求听众认真察看、思量，故译“留心”，同时保留“耶和华的话”这一先知性表达。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代简体中文圣经语域中广为人知的专名形式，明确表达四字神名而非以“主”这一称号替代。
- source_word: הֲמִדְבָּר הָיִיתִי לְיִשְׂרָאֵל
  choice: 难道我对以色列成了旷野
  rationale: 保留反问和“旷野”这一荒凉、缺乏供应之地的比喻。
- source_word: אֶרֶץ מַאְפֵּלְיָה
  choice: 幽暗之地
  rationale: מַאְפֵּלְיָה 表示浓重的黑暗或阴暗；“幽暗之地”简洁、庄重，并保留其强烈意象。
- source_word: רַדְנוּ
  choice: 我们不受约束
  rationale: 此词形和词根解释困难，可能涉及游荡、掌权或挣脱；上下文的共同指向是百姓宣称自主、不再受上帝约束。正文采取不过度限定词源而能传达语境核心的译法，并以脚注保存其他可能。
- source_word: לֹא נָבוֹא עוֹד אֵלֶיךָ
  choice: 再也不来归向你了
  rationale: 直译为“不再到你这里来”；“归向你”在此自然表达百姓拒绝回到耶和华面前的关系性含义，但不扩展为更具体的教义术语。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 中文正文采用普通读者最熟悉且明确作为专名使用的“耶和华”；这不是以称号“主”代替神名。“雅威”是较接近学术重构读音的另一可行形式。
- issue: 难解动词 רַדְנוּ 的解释
  choice: 我们不受约束
  alternative: 我们四处游荡／我们掌权／我们已经挣脱
  rationale: 希伯来文本允许数种词源分析，不能确定为单一含义。正文表达这些分析在本语境中的交集，即百姓自称独立并拒绝再归向耶和华；脚注明确保留词义歧义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“难道……吗”和“为什么……竟说”保持先知责问的力度；避免古奥措辞。脚注标记 [a] 已置于正文，并集中说明关键文本歧义。
