id: JER.2.17
reference: Jeremiah 2:17
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: הֲ/לוֹא זֹ֖את תַּעֲשֶׂה לָּ֑/ךְ עָזְבֵ/ךְ֙ אֶת יְהוָ֣ה אֱלֹהַ֔יִ/ךְ בְּ/עֵ֖ת מוֹלִיכֵ֥/ךְ בַּ/דָּֽרֶךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/017.yaml
  text: Has not this brought it upon you[b][a], because you have forsaken Yahweh your God when he was leading you in the way?
translation:
  language: zh_hans
  text: 这事之所以临到你[a]，不正是因为你在雅威你的上帝带领你走在路上时[b]离弃了他吗？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“这事不是对你做的吗？”原文较直译为“这事不是对你做的吗？”，此处可指这事给你带来的后果。
    reason: lexical_alternative
  - marker: b
    text: 或译：“正当他带领你走在路上时。”
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלוֹא
  choice: 不正是……吗
  rationale: 引出预期肯定回答的反问，保留责问语气，也符合现代汉语表达。
- source_word: זֹאת תַּעֲשֶׂה לָּךְ
  choice: 这事之所以临到你
  rationale: 原文直译近于“这事不是对你做成的吗”，结合上下文指当前灾祸或后果临到受话者；此译自然表达因果关系，同时用脚注保留原文措辞的开放性。
- source_word: עָזְבֵךְ
  choice: 因为你……离弃了
  rationale: 带第二人称阴性单数后缀的不定词结构可表达原因，即“因你的离弃”；汉语以原因从句清楚呈现。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语音译该神圣专名，避免用称号替代原文中的名字。
- source_word: אֱלֹהַיִךְ
  choice: 你的上帝
  rationale: 直接呈现第二人称所属关系；受话者在希伯来语中为阴性单数，现代汉语不作性别区分。
- source_word: בְּעֵת
  choice: 在……时
  rationale: 表达原文的时间关系；脚注保留可理解为持续同时发生的“正当……时”。
- source_word: מוֹלִיכֵךְ
  choice: 带领你
  rationale: 使役分词表示“使你行走、带领你”，可含持续进行的意味。
- source_word: בַּדָּרֶךְ
  choice: 走在路上
  rationale: 保留“道路”的具体意象及其可能具有的生活方向或盟约道路含义，不将其限定为纯粹地理或纯粹道德意义。
theological_decisions:
- issue: 神圣专名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文使用神的专名而非“主”这一称号；“雅威”较直接反映通常重构的读音，同时不把专名替换成称谓。
- issue: “道路”的含义
  choice: 走在路上
  alternative: 行在正道上
  rationale: 原文可指实际行程，也可能带有生活方向或盟约道路的意味；译文保留意象，不擅自把它明确解释为“正道”。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。为避免多层修饰造成歧义，将时间从句置于“离弃”之前；保留反问、因果关系和“道路”意象。
