  text: הַ/עֶ֨בֶד֙ יִשְׂרָאֵ֔ל אִם יְלִ֥יד בַּ֖יִת ה֑וּא מַדּ֖וּעַ הָיָ֥ה לָ/בַֽז־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/014.yaml
  text: Is Israel a slave[b][a], or a homeborn servant? Why then has he become plunder?
translation:
  language: zh_hans
  text: 以色列是奴隶吗？还是家生的奴仆？为什么他竟成了掠物？
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַעֶבֶד
  choice: 奴隶
  rationale: עֶבֶד兼有奴隶、仆役之义；此处反问突出受辖制的社会身份，译作“奴隶”比“仆人”更能保留原文力度。
- source_word: יִשְׂרָאֵל
  choice: 以色列
  rationale: 采用现代汉语圣经传统中通行的专名译法。
- source_word: אִם
  choice: 还是
  rationale: 此处אִם连接选择性问句中的第二项，汉语以“还是”自然表达。
- source_word: יְלִיד בַּיִת
  choice: 家生的奴仆
  rationale: 字面为“家中所生的”，指生在主人家中的从属者；“家生的奴仆”既保留家庭出生背景，也交代其受辖制身份。
- source_word: הוּא
  choice: 他
  rationale: 原文以阳性单数代词将以色列人格化，汉语用“他”保留这一表达。
- source_word: מַדּוּעַ
  choice: 为什么
  rationale: 直接对应原因疑问词；后接“竟”即可体现反问中的出乎意料，无须另加“那么”。
- source_word: הָיָה
  choice: 竟成了
  rationale: היה在此表示进入并处于某种结果状态；“成了”自然传达这一变化，“竟”体现反问语气。
- source_word: לָבַז
  choice: 掠物
  rationale: בַּז指被夺取的战利品、掠物；“掠物”保留其名词性和被人掠夺的含义。
theological_decisions:
- issue: עֶבֶד及יְלִיד בַּיִת所表达的从属身份
  choice: 首项译“奴隶”，次项译“家生的奴仆”
  alternative: 两项均采用较缓和的“仆人”用语
  rationale: 原文反问以受辖制身份衬托以色列沦为掠物的反常处境。首项明确译作“奴隶”可避免淡化其社会现实；次项译作“家生的奴仆”，则保留“生在家中”的特殊类别及两项之间细微差别。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。两个连续问句保留原文的修辞张力；不添加原文未明说的身份来源或神学解释。
