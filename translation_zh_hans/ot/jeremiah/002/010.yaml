base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/010.yaml
  text: For cross over to the coasts of Kittim and see[a]; send to Kedar and consider carefully[b]; see whether there has ever been anything like this.
translation:
  language: zh_hans
  text: 你们要渡海到基提的沿海地区去察看[a]；也要派人到基达，仔细查考[b]。察看是否曾有过这样的事。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “沿海地区”也可译作“岛屿”。“基提”可能指塞浦路斯，也可泛指西方的海上地区。
    reason: lexical_alternative
  - marker: b
    text: “基达”指阿拉伯的部族或其居住地区，位于东面或东南面；这里与西方的基提相对，表示从西到东广泛察看。
    reason: cultural_note
lexical_decisions:
- source_word: עִבְרוּ
  choice: 渡海到……去
  rationale: 该词是עבר的复数命令式，表示越过、前往；结合西方海域的基提，译作“渡海到……去”既保留具体移动感，也符合现代汉语表达。
- source_word: אִיֵּי כִתִּיִּים
  choice: 基提的沿海地区
  rationale: אִיִּים可指岛屿或沿海地区；“沿海地区”保留地理范围的弹性，“基提”则音译专名，不把它过早限定为塞浦路斯。
- source_word: וּרְאוּ
  choice: 察看
  rationale: ראה在本节反复出现，含亲自观察、验证之意；首处译作“察看”，自然体现调查语境。
- source_word: וְקֵדָר שִׁלְחוּ
  choice: 派人到基达
  rationale: 希伯来文直译为“派到基达”，宾语省略，语境暗示差派使者前去调查；汉语补出“人”可避免表达残缺，而不额外限定其身份。
- source_word: וְהִתְבּוֹנְנוּ מְאֹד
  choice: 仔细查考
  rationale: התבונן表示专注观察、思量，מְאֹד加强语气；“仔细查考”兼顾实地调查与审慎思考。
- source_word: וּרְאוּ הֵן הָיְתָה כָּזֹאת
  choice: 看看是否曾发生过这样的事
  rationale: 该句带有惊讶的修辞性查问；“是否曾发生过这样的事”保留疑问形式和比较意味，不把答案直接明说。
theological_decisions: []
