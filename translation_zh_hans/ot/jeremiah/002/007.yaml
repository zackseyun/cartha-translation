id: JER.2.7
reference: Jeremiah 2:7
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וָ/אָבִ֤יא אֶתְ/כֶם֙ אֶל אֶ֣רֶץ הַ/כַּרְמֶ֔ל לֶ/אֱכֹ֥ל פִּרְיָ֖/הּ וְ/טוּבָ֑/הּ וַ/תָּבֹ֨אוּ֙ וַ/תְּטַמְּא֣וּ אֶת אַרְצִ֔/י וְ/נַחֲלָתִ֥/י שַׂמְתֶּ֖ם לְ/תוֹעֵבָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/007.yaml
  text: I brought you into a fertile land to eat its fruit and its goodness[a], but when you came in[b], you defiled my land and made my inheritance an abomination.
translation:
  language: zh_hans
  text: 我把你们带进肥沃的土地[a]，让你们吃那里的果实和丰盛的出产[b]。可是你们进入那地以后，却玷污了我的土地，使我的产业成了可憎之物。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“迦密之地”；这里的“迦密”也可理解为肥美、耕作良好而多产的土地。
    reason: lexical_alternative
  - marker: b
    text: “丰盛的出产”也可译作“美好之物”或“丰饶”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאָבִיא
  choice: 我把你们带进
  rationale: 这是 בוא 的使役式，表示“带入、使进入”；“把你们带进”自然地保留了上帝主动引领的含义。
- source_word: אֶרֶץ הַכַּרְמֶל
  choice: 肥沃之地
  rationale: כַּרְמֶל 在此更可能是普通名词，指肥美、适于耕作且多产的土地；下文提到果实和美物，也支持这一理解。
- source_word: לֶאֱכֹל פִּרְיָהּ וְטוּבָהּ
  choice: 让你们吃那地的果实和美物
  rationale: 不定式表达目的；פְּרִי 直指“果实”，טוּבָהּ 可指土地所出的美好之物、丰盛物产。“美物”保留其较宽泛的语义，不将其限于农产。
- source_word: וַתָּבֹאוּ
  choice: 你们进来以后
  rationale: 叙事形式推进事件；结合上下文译作时间关系，顺畅地带出上帝赐地与百姓污地之间的反差。
- source_word: וַתְּטַמְּאוּ
  choice: 玷污了
  rationale: טמא 的加强式表示使之不洁，兼具礼仪和道德色彩；“玷污”比一般的“污染”更能保留这种分量。
- source_word: אַרְצִי
  choice: 我的土地
  rationale: 直译所有格，强调土地属于上帝。
- source_word: נַחֲלָתִי
  choice: 我的产业
  rationale: נַחֲלָה 指承受所得并归属某人的份或产业；“产业”保留归属和承受的意涵，也与前面的“我的土地”有所区别。
- source_word: שַׂמְתֶּם לְתוֹעֵבָה
  choice: 使……成了可憎之物
  rationale: תּוֹעֵבָה 是带有强烈道德和宗教意味的“可憎之物”；此译保留原文判断的严厉程度。
theological_decisions:
- issue: כַּרְמֶל 是普通名词还是地名
  choice: 按普通名词译为“肥沃之地”
  alternative: 按专名译为“迦密之地”
  rationale: 这里重点描写上帝所赐土地的肥美，并紧接“果实和美物”；普通名词义更符合语境，但专名理解在脚注中保留。
- issue: טוּבָהּ 的范围
  choice: 译为较宽泛的“美物”
  alternative: “丰盛出产”或“美好”
  rationale: 该词既可涉及土地的丰饶和出产，也保有一般“美好”的含义；不宜在正文中把它过度限定为某一种物产。
- issue: 上帝称土地为“我的土地”和“我的产业”
  choice: 保留两个第一人称所有格
  alternative: 为避免重复而合并或弱化其中一个
  rationale: 原文重复强调土地归属上帝，这构成百姓玷污土地之罪的神学张力，因此不应淡化。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“玷污”“产业”“可憎之物”保留先知谴责的力度和土地归属上帝的表达，同时避免过度古雅。脚注标记依其实际说明对象放在“肥沃之地”和“美物”之后。
