language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: אֹמְרִ֨ים לָ/עֵ֜ץ אָ֣בִ/י אַ֗תָּה וְ/לָ/אֶ֨בֶן֙ אַ֣תְּ ילדת/ני כִּֽי פָנ֥וּ אֵלַ֛/י עֹ֖רֶף וְ/לֹ֣א פָנִ֑ים וּ/בְ/עֵ֤ת רָֽעָתָ/ם֙ יֹֽאמְר֔וּ ק֖וּמָ/ה וְ/הוֹשִׁיעֵֽ/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/027.yaml
  text: They say to a tree[a], “You are my father,” and to a stone, “You gave birth to me.” For they have turned their back to me and not their face; but in the time of their trouble they say[c][b], “Rise up and save us!”
translation:
  language: zh_hans
  text: 他们对木头[a]说：“你是我的父亲”，又对石头说：“是你生了我。”因为他们背向我，却不肯面向我；可到了他们遭难的时候[b]，他们却说：“起来，拯救我们！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “木头”也可译作“树木”。
    reason: lexical_alternative
  - marker: b
    text: “遭难”也可译作“遭祸患”；原词按不同语境也可表示“恶”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹמְרִים
  choice: 他们……说
  rationale: 以现在时态的叙述表达希伯来语分词在上下文中的描述性、惯常性用法。
- source_word: לָעֵץ
  choice: 对木头
  rationale: עֵץ可指树或木材；这里与“石头”平行，指被当作神明的偶像材料。“木头”在现代汉语中自然保留了先知讽刺人向受造材料认父的力度。
- source_word: אָבִי אַתָּה
  choice: 你是我的父亲
  rationale: 直接保留说话者把父亲身份归给偶像的亲属称谓。
- source_word: וְלָאֶבֶן
  choice: 又对石头
  rationale: 直译אֶבֶן，并以“又”清楚呈现与“木头”的并列关系。
- source_word: אַתְּ יְלַדְתִּנִי
  choice: 是你生了我
  rationale: יַלד在此为阴性单数形式，与语法上为阴性的“石头”呼应，意思是“你生了我”；“是你”也保留原文强调的语序。
- source_word: כִּי
  choice: 因为
  rationale: 将下文作为前述指控的解释或根据，保留原文的逻辑连接。
- source_word: פָנוּ אֵלַי עֹרֶף וְלֹא פָנִים
  choice: 他们向我转过背，不向我转过脸来
  rationale: 保留原文“背／脸”的鲜明对照，同时用自然汉语表达拒绝、背弃之意。
- source_word: וּבְעֵת רָעָתָם
  choice: 可到了他们遭难的时候
  rationale: רָעָה在此按处境义理解为灾难或困苦；“可”传达他们平日背弃上帝、遇难却求救的反差。
- source_word: יֹאמְרוּ
  choice: 他们却说
  rationale: 未完成式在这里可描写遇难时惯常或将有的反应；汉语不必另加明确将来标记。
- source_word: קוּמָה
  choice: 起来
  rationale: 直接、现代而庄重地表达祈使语气。
- source_word: וְהוֹשִׁיעֵנוּ
  choice: 拯救我们
  rationale: 准确表达ישׁע使役式所指的施救、救拔。
theological_decisions:
- issue: 是否弱化人向木石认亲、归因生命来源的偶像崇拜语言
  choice: 直译他们称木头为父亲，并称石头生了自己
  alternative: 概括为“他们敬拜偶像”
  rationale: 原文刻意采用父亲和生育的语言，揭露人把自身来源归给木石的荒谬；直译可保留先知指控的神学力度。
- issue: “背”与“脸”的表达是否仅解释为背弃
  choice: 保留“向我转过背，不向我转过脸来”的身体意象
  alternative: 意译为“他们背弃我，不肯归向我”
  rationale: 原文的具体对照具有修辞力量；现代汉语可以理解这一意象，无须用解释性措辞取代。
translation_notes:
  register: 采用现代、庄重而通俗的普通话。保留“父亲”“生了我”以及“背／脸”的具体意象；用“木头／石头”形成自然平行，并以“可”“却”凸显百姓平日背弃、遭难时求救的反差。
