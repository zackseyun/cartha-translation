  text: קֹ֤דֶשׁ יִשְׂרָאֵל֙ לַ/יהוָ֔ה רֵאשִׁ֖ית תְּבוּאָתֹ֑/ה כָּל אֹכְלָ֣י/ו יֶאְשָׁ֔מוּ רָעָ֛ה תָּבֹ֥א אֲלֵי/הֶ֖ם נְאֻם יְהוָֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/003.yaml
  text: Israel was holy to Yahweh[a], the firstfruits of his harvest; all who devoured him became guilty; disaster came upon them[c][b], declares Yahweh.
translation:
  language: zh_hans
  text: 以色列归雅威为圣，是他收成中初熟的果子[a]；凡吞吃以色列的[b]，必担罪责[c]；灾祸必临到他们。这是雅威的宣告。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “初熟的果子”也可译作“最先的出产”；这里把以色列比作分别归给神的初熟之物。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译为“凡吃他的”；“他”指作为整体的以色列。这是指列国侵害、掠夺以色列的比喻。
    reason: cultural_note
  - marker: c
    text: “担罪责”也可译作“获罪”“招致罪咎”或“被判有罪”。
    reason: lexical_alternative
lexical_decisions:
- source_word: קֹדֶשׁ יִשְׂרָאֵל לַיהוָה
  choice: 以色列归雅威为圣
  rationale: קֹדֶשׁ在这里表明以色列被分别、奉献给雅威；译作“归雅威为圣”既保留归属和献呈关系，也符合现代汉语表达。
- source_word: רֵאשִׁית תְּבוּאָתוֹ
  choice: 他收成中初熟的果子
  rationale: רֵאשִׁית与农产语境中的תְּבוּאָה共同唤起初熟果子归给神的礼仪意象；此译比单纯的“最早的出产”更能保存该意象。
- source_word: אֹכְלָיו
  choice: 凡吞吃以色列的
  rationale: 字面是“凡吃他的”，以阳性单数后缀指作为整体的以色列；“吞吃”自然表达敌国侵害、掠夺以色列的比喻。为避免现代汉语代词指向含混，正文重述“以色列”。
- source_word: יֶאְשָׁמוּ
  choice: 都要负罪
  rationale: 该动词表示陷入罪责、承担罪咎；“负罪”保留法律与道德责任的含义，又不把具体司法程序强加于原文。
- source_word: רָעָה תָּבֹא אֲלֵיהֶם
  choice: 灾祸必临到他们
  rationale: רָעָה在审判语境中指灾难或祸患，而非道德意义上的“邪恶”；“必临到”保留未完成式在此所表达的确定后果。
- source_word: נְאֻם יְהוָה
  choice: 这是雅威的宣告
  rationale: 这是先知书中常见的神谕公式；“宣告”庄重而清楚，且正文直接音译神的盟约之名。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；“雅威”较贴近其常见学术重构，也避免用头衔替代专名。
- issue: 以色列作为初熟果子的祭祀性比喻
  choice: 他收成中初熟的果子
  alternative: 他出产中最先的一份
  rationale: 此表达保留以色列特别归属于神、不可随意侵犯的献呈意象，同时不引入经文未明说的后期教义。
- issue: 审判动词的时态与情态
  choice: 都要负罪，灾祸必临到他们
  alternative: 都负了罪，灾祸临到了他们
  rationale: 两个希伯来语未完成式可表达惯常或预期的审判后果；中文采用“要／必”保存这种开放性与确定性，而不完全限定为一次已经结束的过去事件。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。句式保留原文的两重比喻和因果推进；“归……为圣”“初熟的果子”“宣告”等词兼顾礼仪色彩与公众可读性。
