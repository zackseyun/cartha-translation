base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/036.yaml
  text: Why do you go about so much[a], changing your way? You will also be put to shame by Egypt[b], as you were put to shame by Assyria.
translation:
  language: zh_hans
  text: 你为什么如此四处奔走，为要改变你的道路？[a] 你也必因埃及蒙羞，[b] 正如你曾因亚述蒙羞一样。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“你为什么如此游移奔走，要改变你的路线？”希伯来语可能强调为了更换联盟而躁动奔波。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“你必因埃及失望……正如你曾因亚述失望一样”。这里的动词既可表示蒙羞，也可表示所倚靠的对象令人失望。
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה תֵּזְלִי מְאֹד
  choice: 你为什么如此四处奔走
  rationale: מַה在此引出带责备意味的反问，译作“为什么”最自然。תֵּזְלִי在本语境中描写为寻求外援而来回活动；“四处奔走”保留动态和躁动感，又不把隐喻过度解释为单纯旅行或淫乱。מְאֹד译作“如此”，强化反问语气。
- source_word: לְשַׁנּוֹת אֶת דַּרְכֵּךְ
  choice: 为要改变你的道路
  rationale: 不定式表达目的或结果，译作“为要改变”。דֶּרֶךְ可兼指行事方式、人生道路和政治路线；“道路”保留这一语义宽度。
- source_word: גַּם
  choice: 也
  rationale: 表示埃及同样会成为蒙羞的缘由，与后面的亚述构成递进和对照。
- source_word: מִמִּצְרַיִם תֵּבוֹשִׁי
  choice: 你也必因埃及蒙羞
  rationale: בושׁ可指羞愧、受辱或所倚靠的对象令人失望；介词מִן标示羞辱或失望的来源、缘由。“因埃及蒙羞”自然地保留这两层关联。
- source_word: כַּאֲשֶׁר בֹּשְׁתְּ מֵאַשּׁוּר
  choice: 正如你曾因亚述蒙羞一样
  rationale: 以“正如……一样”清楚呈现比较关系，并与“因埃及蒙羞”保持平行；“曾”表明这是先前已有的经历。
theological_decisions:
- issue: “你的道路”所指的范围
  choice: 保留为“你的道路”，不限定为政治路线或道德行为
  alternative: 你的政治路线；你的行径
  rationale: 上下文直接涉及犹大转向外国势力寻求倚靠，但先知的责备同时具有道德和属灵含义。“道路”保留这种张力。
- issue: בושׁ表达羞耻还是倚靠落空
  choice: 正文译作“蒙羞”，脚注说明也可理解为因所倚靠者而失望
  alternative: 因埃及失望；埃及必使你失望
  rationale: 该词既可描述公开受辱，也可描述信赖落空后的羞愧与失望。正文采用较宽广的“蒙羞”，不排除政治倚靠失败的含义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“四处奔走”传达反复寻求外援的动态；“道路”保留政治、道德和属灵层面的开放性。句式维持原文的反问、预告和历史类比。
