  text: כְּ/בֹ֤שֶׁת גַּנָּב֙ כִּ֣י יִמָּצֵ֔א כֵּ֥ן הֹבִ֖ישׁוּ בֵּ֣ית יִשְׂרָאֵ֑ל הֵ֤מָּה מַלְכֵי/הֶם֙ שָֽׂרֵי/הֶ֔ם וְ/כֹהֲנֵי/הֶ֖ם וּ/נְבִיאֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/026.yaml
  text: As a thief is ashamed when he is found[a], so the house of Israel has been put to shame—they, their kings, their officials, their priests[b], and their prophets.
translation:
  language: zh_hans
  text: 贼被发现时怎样蒙羞，以色列家也照样蒙羞——他们，就是他们的君王、首领、祭司和先知，也都蒙羞。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כְּבֹשֶׁת
  choice: 怎样蒙羞
  rationale: 介词כ与名词בֹּשֶׁת构成比较；汉语用“怎样蒙羞”自然表达，同时保留“羞耻”主题。
- source_word: גַּנָּב
  choice: 贼
  rationale: 原文为泛指的单数，现代汉语以无量词的“贼”表达一般性例证，简洁自然。
- source_word: כִּי יִמָּצֵא
  choice: 被发现时
  rationale: מצא的尼法勒式表示“被找到、被发现”；“被发现”贴近原文，并在语境中自然含有事情败露之意，而不额外加入“当场抓住”。
- source_word: כֵּן
  choice: 也照样
  rationale: 与前面的比较结构呼应，清楚表达“怎样……也照样……”的对应关系。
- source_word: הֹבִישׁוּ
  choice: 蒙羞
  rationale: 该使役形在此表达陷入羞辱、显得可耻的结果状态；“蒙羞”既可涵盖被置于羞辱中，也不把含义缩减为内心害羞。
- source_word: בֵּית יִשְׂרָאֵל
  choice: 以色列家
  rationale: 保留原文的群体及圣约性称谓，不简化为“以色列”。
- source_word: הֵמָּה
  choice: 他们和……都是如此
  rationale: 以总结性结构体现独立代词的强调和复指作用，并自然引出随后列举的群体。
- source_word: מַלְכֵיהֶם
  choice: 他们的君王
  rationale: 准确表达复数名词及第三人称复数所属后缀。
- source_word: שָׂרֵיהֶם
  choice: 首领
  rationale: שׂרים可指掌权者、官长或贵族；“首领”在此适合概括政治领导阶层，又不限定为世袭贵族。
- source_word: כֹהֲנֵיהֶם
  choice: 祭司
  rationale: כהנים的标准现代汉语圣经用语。
- source_word: נְבִיאֵיהֶם
  choice: 先知
  rationale: נביאים的标准现代汉语圣经用语。
theological_decisions:
- issue: 蒙羞责任的范围
  choice: 全体以色列家都受指控，并特别点出其君王、首领、祭司和先知。
  alternative: 本节只指控领导阶层。
  rationale: “以色列家”是整句主体，强调代词及其后的名单列明其中各领导群体；译文同时保留整体性指控和对领导层的明确点名。
- issue: הֹבִישׁוּ所表达的羞耻性质
  choice: 译作“蒙羞”，保留既可指陷入羞辱、也可含显出可耻之结果状态的张力。
  alternative: 译作“感到羞愧”或“被羞辱”。
  rationale: 原文形式和语境不宜被单纯心理化，也不必过度明确一个外在施事者；“蒙羞”较好保留这种语义张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“怎样……也照样……”保持希伯来语明晰的比较结构；破折号后的总结结构使复指代词及领导群体名单在汉语中自然清楚。
