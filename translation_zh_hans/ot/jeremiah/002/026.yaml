    rationale: 希伯来文的强调代词后接带后缀的群体列举，既维持对“以色列家”的整体指控，又明确涉及其领袖。汉语“他们和他们的君王”容易被理解为两个彼此分开的并列群体；“都是如此”也不如直接重复谓语清晰。
