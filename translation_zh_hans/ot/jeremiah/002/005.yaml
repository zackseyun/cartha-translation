base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/005.yaml
  text: 'Thus says Yahweh: What wrong did your fathers find in me[a], that they went far from me, and went after vanity[b], and became vain?'
translation:
  language: zh_hans
  text: '耶和华如此说：

    “你们的祖先在我身上发现了什么不义，

    竟远离我，

    去追随虚空之物[a]，

    自己也变得虚空？”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “虚空之物”和“变得虚空”译自同一希伯来词根，突出他们追随空虚、无价值之物，自己也随之成为空虚、无价值的人。这里的“虚空之物”可能暗指偶像。
    reason: lexical_wordplay
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  choice: 耶和华如此说
  rationale: 保留先知传信的固定公式，并以“耶和华”呈现圣名；语序庄重而符合现代汉语。
- source_word: מַה מָּצְאוּ אֲבוֹתֵיכֶם בִּי עָוֶל
  choice: 你们的祖先在我身上发现了什么不义
  rationale: 保留“发现……在我身上”的反问结构；עָוֶל可指不义、不公或邪曲，“不义”能自然表达这里所假设的道德过失。
- source_word: כִּי רָחֲקוּ מֵעָלָי
  choice: 竟远离我
  rationale: כִּי在此联系反问与其后行为，可理解为导致或说明关系；“竟”在汉语中凝练地传达反问和责问语气，同时保留疏远的空间隐喻。
- source_word: וַיֵּלְכוּ אַחֲרֵי
  choice: 去追随
  rationale: 表达“走在……之后、跟随”的惯用意义，也保留主动追逐的意象。
- source_word: הַהֶבֶל
  choice: 虚空之物
  rationale: הֶבֶל本义涉及气息、蒸气，转指虚空、无价值之物；本处可能暗指偶像，但不直接窄化为“偶像”。
- source_word: וַיֶּהְבָּלוּ
  choice: 自己也变得虚空
  rationale: 该动词与הֶבֶל同根；重复“虚空”可在汉语中保留原文的词根呼应，说明追随虚空者也成为虚空。
theological_decisions:
- issue: 圣名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字圣名。采用现代中文读者最熟悉且可辨识为专名的“耶和华”，而不以“主”替代；“雅威”是更接近学界重构发音的可行译法。
- issue: הַהֶבֶל 是否明确译作偶像
  choice: 虚空之物
  alternative: 偶像
  rationale: 上下文很可能涉及偶像崇拜，但该词本身较宽，强调所追随对象的虚空和无价值；保留宽义可避免消除原文的修辞张力。
- issue: כִּי 所表达的关系
  choice: 以“竟”连接反问与远离的行为
  alternative: 译作“以致”或“因为”
  rationale: 此处可解释为依据、结果或承接反问的关系。汉语“竟”不把逻辑关系规定得过死，同时传达责问意味。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语，并按希伯来诗行分行。用“祖先”自然表达群体的历代先辈；“不义”保留道德与公正层面的含义。脚注标记[a]已置于主文本相应词语之后。
