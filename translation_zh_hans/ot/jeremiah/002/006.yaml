source:
  edition: WLC
  text: וְ/לֹ֣א אָמְר֔וּ אַיֵּ֣ה יְהוָ֔ה הַ/מַּעֲלֶ֥ה אֹתָ֖/נוּ מֵ/אֶ֣רֶץ מִצְרָ֑יִם הַ/מּוֹלִ֨יךְ אֹתָ֜/נוּ בַּ/מִּדְבָּ֗ר בְּ/אֶ֨רֶץ עֲרָבָ֤ה וְ/שׁוּחָה֙ בְּ/אֶ֨רֶץ֙ צִיָּ֣ה וְ/צַלְמָ֔וֶת בְּ/אֶ֗רֶץ לֹֽא עָ֤בַר בָּ/הּ֙ אִ֔ישׁ וְ/לֹֽא יָשַׁ֥ב אָדָ֖ם שָֽׁם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/006.yaml
  text: They did not say[a], ‘Where is Yahweh, who brought us up from the land of Egypt, who led us through the wilderness, through a land of desert plain and pit, through a land of drought and deep darkness, through a land where no man passed through and no human dwelt?’
translation:
  language: zh_hans
  text: 他们也没有说：“雅威在哪里呢？他曾领我们从埃及地上来，带领我们穿越旷野，经过荒原和深坑之地，经过干旱和幽暗[a]之地，经过无人通行、无人居住之地。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “幽暗”或译“死荫”。
    reason: 保留צַלְמָוֶת可指深暗或死荫的词义歧义。
lexical_decisions:
- source_word: יְהוָה
  choice: 雅威
  rationale: 采用神名的通行汉语音译，而不以“主”这一称号替代，保留原文专名的性质。
- source_word: הַמַּעֲלֶה אֹתָנוּ מֵאֶרֶץ מִצְרָיִם
  choice: 领我们从埃及地上来
  rationale: 保留עלה使役式“领上来”的方向意象，同时用现代汉语可理解的表达呈现出埃及事件。
- source_word: הַמּוֹלִיךְ אֹתָנוּ
  choice: 带领我们走过
  rationale: 使役式הלך表示使人行走、带领；结合随后一连串地貌描写，“带领……走过”自然地表达穿越之意。
- source_word: בַּמִּדְבָּר
  choice: 走过旷野
  rationale: מִדְבָּר是荒无人烟的旷野；在运动语境中将介词自然表达为“走过”。
- source_word: עֲרָבָה וְשׁוּחָה
  choice: 荒原和坑洼
  rationale: עֲרָבָה指干旱的荒原或旷野平地；שׁוּחָה指坑、凹地。译文保留并列的险恶地貌意象。
- source_word: צִיָּה
  choice: 干旱
  rationale: 该词表示极度干燥、焦旱；“干旱之地”在现代汉语中简洁自然。
- source_word: צַלְמָוֶת
  choice: 幽暗
  rationale: 此词可表示浓重的黑暗，也传统地理解为“死荫”。正文以适合荒野地貌语境的“幽暗”呈现，并在脚注保留另一可能。
- source_word: לֹא עָבַר בָּהּ אִישׁ
  choice: 无人经过
  rationale: 简洁表达“没有人从其中经过”，保留该地罕有人迹的含义。
- source_word: וְלֹא יָשַׁב אָדָם שָׁם
  choice: 无人居住
  rationale: יָשַׁב在此指居住、定居；译文表达那里没有人类居住的荒凉景象。
theological_decisions:
- issue: צַלְמָוֶת的含义
  choice: 幽暗
  alternative: 死荫
  rationale: 该词在此可描绘极深的黑暗与危险，不必明确限定为死亡；但“死荫”既是传统译法，也保留词中可能的死亡色彩，因此列入脚注，不消除原文的语义张力。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。重复“走过”以再现希伯来文连续列举的节奏；末尾以“雅威，在哪里呢”保留原文追问的重心。
