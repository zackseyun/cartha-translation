revisions:
- from: 他们也没有说：“那位领我们从埃及地上来，带领我们走过旷野，走过荒原和坑洼之地，走过干旱和幽暗[a]之地，走过无人经过、无人居住之地的雅威，在哪里呢？”
  to: 他们也没有说：“雅威在哪里呢？他曾领我们从埃及地上来，带领我们穿越旷野，经过荒原和深坑之地，经过干旱和幽暗[a]之地，经过无人通行、无人居住之地。”
  rationale: 修订将反问句前置，使汉语句法自然，同时保留原文对雅威过去拯救与引领作为的回顾。将“坑洼”改为“深坑”，更准确呈现险恶荒野地貌。其余关键词、列举节奏及脚注所保留的语义张力均维持不变。
