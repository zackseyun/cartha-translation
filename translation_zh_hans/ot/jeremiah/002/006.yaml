  source_fidelity: 译文总体准确传达了从埃及被领上来、在旷野中被带领，以及连续列举荒凉险恶地带的内容；“幽暗”并以脚注保留“死荫”，恰当地保留了צַלְמָוֶת的可能含义。惟“荒原和坑洼”将单数且具危险意味的שׁוּחָה弱化为普通不平地貌，宜改为“深坑”。
  naturalness: 原句把很长的分词修饰语全部置于“雅威”之前，再以“雅威，在哪里呢？”收束，虽可理解，却不够自然。现代汉语宜先提出反问“雅威在哪里呢？”，再以“他曾……”说明其作为，使句法清楚且保留原文修辞重心。
  terminology: “雅威”一致保留神名专名性质；“旷野”“埃及地”及“死荫”脚注均合适。“深坑”比“坑洼”更贴合שׁוּחָה的坑、陷坑意象。
