base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/018.yaml
  text: And now[a], what have you to do with the way to Egypt, to drink the waters of Shihor? And what have you to do with the way to Assyria[b], to drink the waters of the River?
translation:
  language: zh_hans
  text: 现在，你为什么要走埃及的路，去喝西曷的水[a]？你又为什么要走亚述的路，去喝大河的水[b]？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “西曷”很可能是尼罗河或其东部某条支流的名称。
    reason: lexical_alternative
  - marker: b
    text: “大河”指幼发拉底河。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: 现在
  rationale: 承接上文并转向当前的责问；现代汉语中用“现在”自然表达时间推进，连接作用可由语境体现。
- source_word: מַה לָּךְ לְדֶרֶךְ
  choice: 你何必走上……的路
  rationale: 该习语带有责问和劝阻意味。“何必”保留反问语气，“走上……的路”则保留 דֶּרֶךְ 的道路意象，避免直接解释成寻求外国援助。
- source_word: מִצְרַיִם
  choice: 埃及
  rationale: 采用现代中文通行地名。
- source_word: לִשְׁתּוֹת
  choice: 去喝
  rationale: 保留目的不定式的功能及原文饮水意象。
- source_word: מֵי שִׁחוֹר
  choice: 西曷的水
  rationale: 将 שִׁחוֹר 作为专名音译，不在正文中直接等同于尼罗河，以保留名称及其具体所指的不确定性。
- source_word: אַשּׁוּר
  choice: 亚述
  rationale: 采用现代中文圣经语境中的通行国名。
- source_word: מֵי נָהָר
  choice: 大河的水
  rationale: 定冠词化的“河”在此指当地人熟知的那条大河，通常即幼发拉底河；正文保留“大河”这一表达，脚注说明其所指。
theological_decisions:
- issue: 喝埃及和亚述之水的意象
  choice: 在正文中保留走路和饮水的比喻
  alternative: 直接译为“寻求埃及和亚述的帮助”
  rationale: 上下文可能借饮用外国之水责备犹大倚靠外国势力，但本节以具体意象表达，并未明说政治结盟；保留意象可避免把解释写进正文。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“你何必……你又何必……”重现两句平行的责问；“走上通往……的路”兼顾中文自然度与原文的道路意象。所有脚注标记均置于相关词语之后。
