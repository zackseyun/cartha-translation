source:
  edition: WLC
  text: כִּֽי שְׁתַּ֥יִם רָע֖וֹת עָשָׂ֣ה עַמִּ֑/י אֹתִ֨/י עָזְב֜וּ מְק֣וֹר מַ֣יִם חַיִּ֗ים לַ/חְצֹ֤ב לָ/הֶם֙ בֹּאר֔וֹת בֹּארֹת֙ נִשְׁבָּרִ֔ים אֲשֶׁ֥ר לֹא יָכִ֖לוּ הַ/מָּֽיִם־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/013.yaml
  text: 'For my people have done two evils: they have forsaken me[a], the fountain of living waters, to dig for themselves cisterns—broken cisterns that cannot hold water.'
translation:
  language: zh_hans
  text: 因为我的子民做了两件恶事：他们离弃了我——活水的泉源[a]，为自己凿出蓄水池，就是破裂而不能存水的蓄水池。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “活水的泉源”也可译作“流水的泉源”或“活水的源头”。
    reason: 说明 מְקוֹר מַיִם חַיִּים 中“泉源／源头”及“活水／流水”的词义范围，同时不在正文中消解隐喻。
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，表达解释或原因；现代汉语中“因为”自然清楚。
- source_word: שְׁתַּיִם רָעוֹת
  choice: 两件恶事
  rationale: 保留数目和鲜明的道德分量；“恶事”比“错事”更符合先知责备的力度。
- source_word: עָשָׂה עַמִּי
  choice: 我的子民做了
  rationale: 贴近常用动词“做”，同时“子民”自然表达神与其百姓的关系。
- source_word: אֹתִי עָזְבוּ
  choice: 他们离弃了我
  rationale: “离弃”兼具关系和盟约语境中的严肃意味，且符合现代庄重汉语。
- source_word: מְקוֹר מַיִם חַיִּים
  choice: 我这活水的泉源
  rationale: 将同位隐喻自然嵌入汉语；“活水”保留希伯来语所指流动、新鲜之水及其生命意象，“泉源”保留源头图像。
- source_word: לַחְצֹב לָהֶם
  choice: 为自己凿出
  rationale: “凿”准确表现从岩石中开凿蓄水设施，“为自己”显出与离弃神相对的自我取向。
- source_word: בֹּארוֹת
  choice: 蓄水池
  rationale: 语境中指人工凿成、用于储水的池，而非从地下出水的井；“蓄水池”能保持与天然泉源的对比。
- source_word: בֹּארֹת נִשְׁבָּרִים
  choice: 破裂的蓄水池
  rationale: “破裂”明确表达池体有裂损、会漏水，比泛指损坏的“坏了”更贴合意象。
- source_word: אֲשֶׁר לֹא יָכִלוּ הַמָּיִם
  choice: 不能存水
  rationale: 按希伯来语习语表达无法留住水；“存水”在汉语中简洁自然。
theological_decisions:
- issue: 以水的意象描绘神
  choice: 保留“我这活水的泉源”的直接隐喻
  alternative: 意译为“赐生命之水的源头”或“生命和福分的源头”
  rationale: 原文以神自身作为活水泉源，却未进一步解释其所代表的生命、供应或福分；保留隐喻可维持其先知性张力与丰富含义。
- issue: “活水”的语义范围
  choice: 采用传统而仍可理解的“活水”
  alternative: 译作“流动的水”“新鲜的水”或“生命之水”
  rationale: 希伯来语首先可指流动的新鲜水，同时带有鲜明的生命意象；“活水”既不过度解释，也保留后续神学共鸣。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“子民”“离弃”“泉源”保留先知话语的郑重感；“蓄水池”比“水井”更准确地呈现人工储水设施。正文保持两项罪恶的平行结构：离弃天然活水泉源，并自凿无法存水的破池。
