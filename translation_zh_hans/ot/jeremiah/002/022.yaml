  rationale: 修订仅改善现代汉语表达：“并多用”自然表达大量施用洗涤剂的意思，不强行落实语境中不突出的反身与格；“仍带着污迹”延续原文洗涤—污渍的修辞链，并保留脚注所述“被标记”的词义可能。其余术语、神名和神谕语体均可保留。
