id: JER.2.22
reference: Jeremiah 2:22
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כִּ֤י אִם תְּכַבְּסִי֙ בַּ/נֶּ֔תֶר וְ/תַרְבִּי לָ֖/ךְ בֹּרִ֑ית נִכְתָּ֤ם עֲוֺנֵ/ךְ֙ לְ/פָנַ֔/י נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/022.yaml
  text: For though you wash with natron and use much lye[a], your guilt is stained before me[c][b], declares the Lord YHWH.
translation:
  language: zh_hans
  text: 即使你用天然碱[a]洗涤，并多用皂碱[b]，你的罪孽在我面前仍带着污迹[c]。这是主耶和华的宣告。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “天然碱”指古代用作清洁剂的一种矿物碱，也可称“泡碱”或“天然苏打”。
    reason: lexical_alternative
  - marker: b
    text: “皂碱”指古代洗涤用的碱性物质，可能由植物灰制成，并不一定是现代意义的肥皂。
    reason: historical_clarification
  - marker: c
    text: “仍带着污迹”也可译作“仍被标记”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: 即使
  rationale: 此处引出让步关系：无论怎样用清洁剂洗涤，后面的判语仍然成立；“即使”在现代汉语中自然清楚。
- source_word: תְּכַבְּסִי
  choice: 你……洗涤
  rationale: 该动词常指洗衣，此处比喻试图除去道德污秽；“洗涤”保留具体的洗濯意象，语体也较庄重。
- source_word: בַּנֶּתֶר
  choice: 用天然碱
  rationale: נֶתֶר 指古代使用的矿物性碱类清洁剂，通常认为是泡碱或天然苏打；“天然碱”比音译名称更便于普通读者理解。
- source_word: וְתַרְבִּי לָךְ
  choice: 又给自己多用
  rationale: רבה 的使役形式配合 לָךְ 表示为自己大量增加或施用；译文以自然汉语表达其大量使用之意，同时保留“为自己”的反身色彩。
- source_word: בֹּרִית
  choice: 皂碱
  rationale: בֹּרִית 是古代洗涤用的碱性物质，很可能来自植物灰，并不等同于现代肥皂；“皂碱”兼顾可懂性与历史准确性。
- source_word: נִכְתָּם
  choice: 仍留有污迹
  rationale: 此被动形式可表示被染污或被留下标记；上下文围绕洗涤展开，译作“留有污迹”延续这一意象，而“仍”表达让步句所含的结果持续性。
- source_word: עֲוֺנֵךְ
  choice: 你的罪孽
  rationale: עָוֹן 可兼指邪恶行为及其所带来的罪责；“罪孽”较能保留这种语义张力，避免只限定为法律责任。
- source_word: לְפָנַי
  choice: 在我面前
  rationale: 直陈罪孽处于上帝的临在、注视和判断之下；“在我面前”既贴近原文又符合现代汉语。
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: 这是主耶和华的宣告
  rationale: נְאֻם 是先知书常见的神谕宣告公式；“主耶和华”分别表达 אֲדֹנָי 与 יהוה，并避免含混为重复的“主”。
theological_decisions:
- issue: עָוֹן 在此处是指罪行还是罪责
  choice: 罪孽
  alternative: 罪责
  rationale: 原词可以兼含行为的悖逆和由此产生的罪责；采用“罪孽”以保留这两方面，不把含义过早收窄。
- issue: נִכְתָּם 是强调污迹还是被标记
  choice: 仍留有污迹
  alternative: 仍被标记
  rationale: 两种理解在词义上均有依据；洗涤和清洁剂的上下文支持污迹意象，但脚注保留“被标记”的可能。
- issue: אֲדֹנָי יְהוִה 的译法
  choice: 主耶和华
  alternative: 主雅威
  rationale: 采用现代中文圣经语境中广为人知的“耶和华”表达四字神名，同时明确保留前面的 אֲדֹנָי（主）；此选择不改变经文对神圣名号的并列使用。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“洗涤—天然碱—皂碱—污迹”构成连贯的清洗意象；句末用“这是……的宣告”再现先知性神谕公式。
