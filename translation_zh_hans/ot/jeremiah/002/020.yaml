source:
  edition: WLC
  text: כִּ֣י מֵ/עוֹלָ֞ם שָׁבַ֣רְתִּי עֻלֵּ֗/ךְ נִתַּ֨קְתִּי֙ מוֹסְרֹתַ֔יִ/ךְ וַ/תֹּאמְרִ֖י לֹ֣א אעבד כִּ֣י עַֽל כָּל גִּבְעָ֞ה גְּבֹהָ֗ה וְ/תַ֨חַת֙ כָּל עֵ֣ץ רַעֲנָ֔ן אַ֖תְּ צֹעָ֥ה זֹנָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/020.yaml
  text: For long ago I broke your yoke[a]; I tore off your bonds. But you said, “I will not serve.” Indeed, on every high hill and under every green tree[c][b], you sprawled out as a prostitute.
translation:
  language: zh_hans
  text: 因为早在从前，我就折断了你的轭[a]，扯开了你的绳索；你却说：“我不肯服事！”事实上，在每一座高冈上、每一棵青翠树下[b]，你都像妓女一样躺卧[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “早在从前”也可译作“自古以来”。这里可能是回指以色列早期蒙拯救的历史。
    reason: lexical_alternative
  - marker: b
    text: “在每一座高冈上、每一棵青翠树下”是先知书中常见的说法，通常指与偶像崇拜有关的场所。
    reason: cultural_note
  - marker: c
    text: 译作“躺卧”的希伯来语词十分罕见，含义难以确定；也可能指“俯身”等带有性暗示的姿态。
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵעוֹלָם
  choice: 早在从前
  rationale: 该短语表示久远的过去；结合折断轭、解除束缚的语境，指向以色列早期蒙拯救的历史。“早在从前”自然保留其时间深度，但不将其误解为抽象的永恒。
- source_word: שָׁבַרְתִּי עֻלֵּךְ
  choice: 我就折断了你的轭
  rationale: 保留解除奴役的具体意象。“折断……轭”符合现代汉语，又传达希伯来语动词的力度。
- source_word: נִתַּקְתִּי מוֹסְרֹתַיִךְ
  choice: 扯开了你的绳索
  rationale: 动词有拉断、挣开之意，名词指约束之带或绳索；此译延续轭与束缚的解放意象。
- source_word: לֹא אעבד
  choice: 我不愿服事
  rationale: עבד既可指服事，也可在宗教语境中指敬拜。译作“服事”既承接轭和绳索的意象，也保留拒绝事奉上帝这一含义，不把歧义提前消解。
- source_word: כִּי
  choice: 事实上
  rationale: 第二个כִּי引出对以色列言行的证实和说明；“事实上”可自然地转入其不忠行为的证据。
- source_word: עַל כָּל גִּבְעָה גְּבֹהָה וְתַחַת כָּל עֵץ רַעֲנָן
  choice: 在每一座高冈上、每一棵青翠树下
  rationale: 尽量保留先知文学中固定的地点表达；“青翠树”准确传达枝叶繁茂的树，也避免直接把正文释义化为偶像崇拜场所。
- source_word: צֹעָה
  choice: 躺卧
  rationale: 这是罕见且意义不确定的词；语境可能描绘俯身或铺展身体的姿态。“躺卧”保留身体姿态及性隐喻，同时以脚注交代不确定性。
- source_word: זֹנָה
  choice: 像妓女一样
  rationale: 保留原文明确而尖锐的卖淫隐喻，以表达以色列因偶像崇拜而背约；不用较弱的“不忠”取代原有形象。
theological_decisions:
- issue: 用性不忠比喻偶像崇拜和背约
  choice: 正文保留明确的妓女意象
  alternative: 弱化为“你不忠”或直接解释为“你拜偶像”
  rationale: 耶利米刻意以性不忠描绘以色列对上帝的背约。保留这一意象，才能呈现先知话语的力度，并维持偶像崇拜与婚约不忠之间的张力。
- issue: “服事”所指的双重语义
  choice: 译作“服事”，不在正文中限定为奴役或敬拜
  alternative: 译作“我不愿作奴仆”或“我不愿敬拜”
  rationale: 上下文同时包含解除奴役的轭与绳索意象，以及拒绝事奉上帝后转向偶像崇拜的宗教含义；“服事”能保留两者。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。女性单数第二人称指拟人化的以色列；中文不以代词性别额外标示。保留“轭”“青翠树”“妓女”等具体先知意象，并用脚注说明文化背景和罕见词的不确定性。
