source:
  edition: WLC
  text: הַ/הֵימִ֥יר גּוֹי֙ אֱלֹהִ֔ים וְ/הֵ֖מָּה לֹ֣א אֱלֹהִ֑ים וְ/עַמִּ֛/י הֵמִ֥יר כְּבוֹד֖/וֹ בְּ/ל֥וֹא יוֹעִֽיל׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/011.yaml
  text: Has a nation changed its gods—though they are not gods? Yet my people have changed their glory for what does not profit[a][b][c].
translation:
  language: zh_hans
  text: 哪一国曾更换过自己的神明呢[a]？那些其实并不是神；我的百姓却把自己的荣耀[b]换成了毫无益处的东西[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “更换”也可译作“交换”或“替换”。原文前后两处使用同一个动词。
    reason: lexical_alternative
  - marker: b
    text: “自己的荣耀”很可能指耶和华——他是以色列真正的荣耀；原文以“荣耀”转指他，并未直接写出他的名字。也可理解为“自己的尊荣”。
    reason: lexical_alternative
  - marker: c
    text: “毫无益处的东西”也可译作“无用之物”或“不能帮助人的东西”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵימִיר
  choice: 更换／换成
  rationale: 该动词可指更换、交换或替换。前半句用“更换”自然地表达改换所信奉的神明，后半句用“把……换成……”呈现以一物交换另一物的结构，同时保留两处用词的呼应。
- source_word: גּוֹי
  choice: 一国
  rationale: 这里指作为整体的国家或民族；在反问句中译作“一国”简洁自然。
- source_word: אֱלֹהִים
  choice: 神明／神
  rationale: 第一处指列国所信奉的诸神，译作“神明”符合现代汉语；第二处否定它们真实的神性，译作“并不是神”保留原文的尖锐判断。
- source_word: וְהֵמָּה לֹא אֱלֹהִים
  choice: 那些其实并不是神
  rationale: “那些”明确回指列国的神明；“其实”自然表达该分句带出的反讽和让步意味，同时保留复数所指。
- source_word: וְעַמִּי
  choice: 我的百姓却
  rationale: 连接词在此形成强烈对比：列国不改换虚假的神明，以色列却离弃自己的荣耀。“却”准确传达这种反讽。
- source_word: כְּבוֹדוֹ
  choice: 自己的荣耀
  rationale: 原文直译为“他的荣耀”，其中单数后缀回指作为整体的“我的百姓”。现代汉语用“自己的”避免性别和数的不自然，并保留“荣耀”既可指百姓的荣耀、也可转喻耶和华的张力。
- source_word: בְּלֹא יוֹעִיל
  choice: 毫无益处的东西
  rationale: 该短语指不能带来益处、帮助或功效之物。“毫无益处的东西”既贴近原义，又是自然清楚的现代汉语。
theological_decisions:
- issue: “自己的荣耀”（כְּבוֹדוֹ）所指为何
  choice: 正文保留“自己的荣耀”，由注释说明它很可能转喻耶和华
  alternative: 直接译作“耶和华”或理解为以色列自身的尊荣
  rationale: 上下文将列国的假神与以色列所离弃的对象相对照，因此“荣耀”很可能指作为以色列荣耀的耶和华。然而原文没有直接写出神名，正文保留其表达和一定程度的含混，避免把转喻完全释义化。
- issue: 列国的“神明”是否为真正的神
  choice: “那些其实并不是神”
  alternative: “但它们不是诸神”或“它们并非上帝”
  rationale: 希伯来文使用复数形式回指列国的所谓神明，并断然否认其神性；译文既保留复数所指，也不误译成单数的“上帝”。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“哪一国曾……呢”保留先知式反问；分号突出列国与“我的百姓”之间的反讽对比。正文避免把“荣耀”直接改写为“耶和华”，以保存原文的转喻和神学张力。
