  text: לָ֥/מָּה תָרִ֖יבוּ אֵלָ֑/י כֻּלְּ/כֶ֛ם פְּשַׁעְתֶּ֥ם בִּ֖/י נְאֻם יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/029.yaml
  text: Why do you contend with me? All of you have rebelled against me[b][a], declares Yahweh.
translation:
  language: zh_hans
  text: 你们为什么与我争辩？你们全都背叛了我[a]。这是耶和华的宣告。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “背叛了我”也可译作“反叛我”或“违逆了我”。原文动词常指背叛、反叛或严重违犯。
    reason: lexical_alternative
lexical_decisions:
- source_word: לָמָּה
  choice: 为什么
  rationale: 引出反问，质问以色列人如此行的缘由；“为什么”是自然、直接的现代汉语表达。
- source_word: תָרִיבוּ
  choice: 争辩
  rationale: ריב可指争执、争讼或提出诉讼；“争辩”既保留对抗意味，也能隐约体现法律语境，而不显得过于专业。
- source_word: אֵלַי
  choice: 与我
  rationale: 与ריב搭配时，汉语惯用“与我争辩”，比逐字译作“向我”自然，也不额外强化敌对程度。
- source_word: כֻּלְּכֶם
  choice: 你们全都
  rationale: 保留对全体百姓的强调，符合现代汉语表达。
- source_word: פְּשַׁעְתֶּם
  choice: 背叛了
  rationale: פשע常表达反叛、破坏忠诚关系，不只是一般性的犯罪；“背叛”能清楚传达其关系性和盟约性的力度。
- source_word: בִּי
  choice: 我
  rationale: 在“背叛了我”中，汉语以直接宾语自然表达בִּי所标明的受冒犯对象，无须机械译出介词。
- source_word: נְאֻם יְהוָה
  choice: 这是耶和华的宣告
  rationale: 保留先知书中庄重的宣告公式，并将神名יהוה译为现代中文圣经读者熟悉的“耶和华”。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。中文采用广为人知且具专名功能的“耶和华”，而不以称号“主”替代；“雅威”是更接近学界常见重构读音的可行替代。
- issue: פשע的盟约性力度
  choice: 背叛了我
  alternative: 得罪了我／违背了我
  rationale: 本句指向百姓对神的反叛和忠诚关系的破裂。“背叛”保留强烈指控；较宽泛的“得罪”可能削弱原文力度。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“与我争辩”保留原文可能含有的争讼色彩；“你们全都”突出全体受责备；宣告公式独立成句，以体现先知话语的权威感。
