id: JER.2.21
reference: Jeremiah 2:21
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/אָֽנֹכִי֙ נְטַעְתִּ֣י/ךְ שֹׂרֵ֔ק כֻּלֹּ֖/ה זֶ֣רַע אֱמֶ֑ת וְ/אֵיךְ֙ נֶהְפַּ֣כְתְּ לִ֔/י סוּרֵ֖י הַ/גֶּ֥פֶן נָכְרִיָּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/021.yaml
  text: Yet I planted you as a choice vine[a], wholly of true seed[c][b]. How then have you turned for me into the degenerate shoots of a foreign vine?
translation:
  language: zh_hans
  text: 然而，我栽种你为一株上等的葡萄树[a]，全是纯正的种苗[b]；你怎么竟在我看来变成了外来葡萄树的败坏枝条[c]呢？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “上等的葡萄树”也可译作“精选的葡萄树”；希伯来语指优良、名贵的葡萄树。
    reason: lexical_alternative
  - marker: b
    text: “全是纯正的种苗”也可译作“完全是纯正的种子”或“全是可靠的种源”；这里强调所栽种的种源完全纯正。
    reason: lexical_alternative
  - marker: c
    text: “败坏枝条”所对应的希伯来语含义不确定；也可理解为“野生枝条”“变质的生长物”或“偏离正种的枝条”。“外来”也可译作“陌生的”或“异类的”。
    reason: textual_or_lexical_difficulty
lexical_decisions:
- source_word: נְטַעְתִּיךְ
  choice: 我栽种你
  rationale: Qal完成式第一人称单数，带第二人称阴性单数后缀；按葡萄树隐喻，将被人格化的以色列或犹大作为阴性单数对象。
- source_word: שֹׂרֵק
  choice: 上等的葡萄树
  rationale: 指精选、优良的葡萄树；“上等”在现代汉语中自然地表达其品质含义，又不限定为某一特定品种或颜色。
- source_word: כֻּלֹּה זֶרַע אֱמֶת
  choice: 全由纯正的种苗长成
  rationale: כֻּלֹּה强调整株都是如此，זֶרַע אֱמֶת在此强调种源真实、纯正。“种苗”符合栽种葡萄树的语境，也避免把אֱמֶת直接道德化为人的“忠信”。
- source_word: וְאֵיךְ
  choice: 怎么竟
  rationale: 既表达疑问，也传达说话者面对强烈反差时的惊诧和责问。
- source_word: נֶהְפַּכְתְּ לִי
  choice: 竟在我面前变成了
  rationale: נפעל词形表达转变；“在我面前”保留לִי所带的关系性视角，同时比生硬的“向我变成”更符合现代汉语。
- source_word: סוּרֵי
  choice: 败坏枝条
  rationale: 此词形式和确切含义有困难；上下文指偏离原本优良种源、已经变坏的葡萄树生长物。“败坏枝条”保留葡萄树意象，也以脚注交代其他可能理解。
- source_word: הַגֶּפֶן נָכְרִיָּה
  choice: 异种葡萄树
  rationale: נָכְרִיָּה可指外来的、陌生的或异类的；“异种”在栽培隐喻中自然，并突出它已不再与原栽种的纯正种源相符。
theological_decisions:
- issue: 上帝栽种以色列或犹大的葡萄树隐喻
  choice: 完整保留栽种、种苗、葡萄树和枝条的农业意象
  alternative: 意译为“我使你成为纯正的子民，你却败坏了”
  rationale: 原文以延展的葡萄树隐喻表达上帝的栽培与百姓的变质；保留该意象可维持先知文学及相关经文之间的呼应，并避免在正文中把隐喻缩减为单一的道德解释。
- issue: אֱמֶת在“种子”短语中的含义
  choice: 译为“纯正”，侧重种源真实可靠
  alternative: 译为“忠信”，理解为百姓应有的道德或盟约忠诚
  rationale: 葡萄栽培语境首先支持种苗纯正、无掺杂的含义；“纯正”仍容许其盟约与道德联想，却不把该联想定为唯一解释。
- issue: לִי的关系性含义
  choice: 译为“在我面前”
  alternative: 省略不译，或译作“对我来说”
  rationale: 保留上帝与百姓之间的关系张力，同时承认该介词在此可表达“相对于我、在我看来或对我而言”，不进一步固定为某一种神学解释。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。以“然而”“怎么竟”呈现原文的强烈反差和责问语气；保留第二人称和葡萄树隐喻，不添加具体民族名称。
