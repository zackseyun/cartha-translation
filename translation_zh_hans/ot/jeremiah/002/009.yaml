  text: לָ/כֵ֗ן עֹ֛ד אָרִ֥יב אִתְּ/כֶ֖ם נְאֻם יְהוָ֑ה וְ/אֶת בְּנֵ֥י בְנֵי/כֶ֖ם אָרִֽיב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/009.yaml
  text: Therefore I will still contend with you[a], declares Yahweh, and with your children's children I will contend.
translation:
  language: zh_hans
  text: 因此，我还要与你们争辩[a]——这是雅威的宣告；并要与你们儿女的儿女争辩。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“控告你们……控告你们儿女的儿女。”
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: 因此
  rationale: 承接上文的指控，明确表达由此得出的结论。
- source_word: עוֹד
  choice: 还要
  rationale: 可表示行动仍将继续或再次发生；“还要”在中文中自然地保留这种延续和反复的空间。
- source_word: אָרִיב
  choice: 争辩
  rationale: ריב在此带有诉讼、控告和对质色彩；“争辩”不过度限定具体司法程序，同时两次重复，以保留原文强调。
- source_word: אִתְּכֶם
  choice: 与你们
  rationale: 贴近介词结构；对抗性由“争辩”表达。“控告你们”是可行的语境性理解，收入脚注。
- source_word: נְאֻם יְהוָה
  choice: 这是雅威的宣告
  rationale: 以庄重、自然的现代中文表达先知书中权威性的宣告公式。
- source_word: יְהוָה
  choice: 雅威
  rationale: 直接音译四字神名，保留其作为立约之神专名的性质。
- source_word: וְאֶת
  choice: 我也要与
  rationale: 在第二个争辩对象前承接同一动词；中文补出主语和动词，使重复与句法关系清楚。
- source_word: בְּנֵי בְנֵיכֶם
  choice: 你们子孙的子孙
  rationale: 保留希伯来语的代际叠加表达及其庄重修辞；“后代”虽自然，却会压缩原文形式。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；“雅威”较直接地体现专名，不以称号替代。
- issue: ריב 的法庭性含义
  choice: 正文译“争辩”
  alternative: 控告；提出诉讼
  rationale: 原词兼具争论、对质和诉讼意味；正文避免把司法程序说得过于具体，同时借脚注保留明确的敌对性译法。
- issue: 审判延及后代的表述
  choice: 按原文保留“你们子孙的子孙”
  alternative: 你们的后代
  rationale: 不淡化经文跨世代的严肃表述，也不在译文中解释其神学机制或范围。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“这是雅威的宣告”保留先知宣告公式；重复“争辩”以呈现原文的强调和平行结构。
