  text: גַּם בְּנֵי נֹ֖ף ו/תחפנס יִרְע֖וּ/ךְ קָדְקֹֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/016.yaml
  text: Even the sons of Noph and Tahpanhes have grazed your crown.
translation:
  language: zh_hans
  text: 连挪弗[b]和答比匿的居民[a]也啃食[c]你的头顶[d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语直译为“挪弗和答比匿的儿子们”；“某地的儿子们”可指该地的居民。
    reason: lexical_alternative
  - marker: b
    text: 挪弗通常被认定为埃及的孟斐斯。
    reason: cultural_note
  - marker: c
    text: 原文动词的基本意思是“放牧”“吃草”或“取食”；在这里可译作“啃食”。有些译本按此处语境意译为“打破”或“压碎”。
    reason: lexical_alternative
  - marker: d
    text: 也可译作“你的头冠部位”或“你的头皮”。
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: 连……也
  rationale: 在上下文中带有强调意味；“连……也”自然地表达“不仅如此，甚至这些埃及城邑的居民也……”的语气。
- source_word: בְּנֵי
  choice: 居民
  rationale: 字面为“儿子们”，但与地名连用时通常指该地的居民；正文采用现代汉语的自然表达，并以脚注保留希伯来语字面形式。
- source_word: נֹף
  choice: 挪弗
  rationale: 按希伯来语地名音译，并沿用中文圣经中较为人熟知的名称；其通常被认定为埃及的孟斐斯，见脚注。
- source_word: תחפנס
  choice: 答比匿
  rationale: 按地名音译，并采用中文圣经传统中通行的形式。
- source_word: יִרְעוּךְ
  choice: 啃噬
  rationale: 动词源于 רעה，基本意象是放牧、吃草或取食；此处以人头顶为宾语，具有羞辱性、破坏性的比喻色彩。“啃噬”既保留取食意象，也符合现代汉语表达，避免直接改释为“打破”或“压碎”。
- source_word: קָדְקֹד
  choice: 头顶
  rationale: 指头的顶部或头冠部位。“头顶”准确、自然，也保留原文具体的身体意象。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“啃噬你的头顶”刻意保留原文突兀而强烈的取食比喻，不将其平滑处理为单纯的击打或压碎。地名采用中文圣经传统中较通行的音译。
