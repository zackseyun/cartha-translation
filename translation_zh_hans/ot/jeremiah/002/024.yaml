id: JER.2.24
reference: Jeremiah 2:24
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: פֶּ֣רֶה לִמֻּ֣ד מִדְבָּ֗ר בְּ/אַוַּ֤ת נפש/ו שָׁאֲפָ֣ה ר֔וּחַ תַּאֲנָתָ֖/הּ מִ֣י יְשִׁיבֶ֑/נָּה כָּל מְבַקְשֶׁ֨י/הָ֙ לֹ֣א יִיעָ֔פוּ בְּ/חָדְשָׁ֖/הּ יִמְצָאֽוּ/נְהָ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/024.yaml
  text: A wild donkey accustomed to the wilderness[a], in the craving of her appetite sniffs the wind; in her heat, who can turn her back? All who seek her will not weary themselves[c][b]; in her month they will find her.
translation:
  language: zh_hans
  text: 一头惯于旷野的母野驴，在欲望的驱使下迎风嗅闻；她发情时，谁能使她回头？凡寻找她的都不会疲乏；在她的月份[a]，他们就会找到她。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “她的月份”直译希伯来文；这里可能指她发情或交配周期中的特定时节。
    reason: 说明不寻常的字面表达及其语境含义，同时保留原文的一定歧义。
lexical_decisions:
- source_word: פֶּרֶה
  choice: 母野驴
  rationale: 该词指野驴；本节后续动词和代词以阴性为主，而发情、被寻找的意象也指向雌兽，因此译作“母野驴”，使现代中文读者能清楚把握比喻。
- source_word: לִמֻּד מִדְבָּר
  choice: 惯于旷野的
  rationale: לִמֻּד在此表示已经习惯、适应某种环境；“惯于旷野”自然地表达野驴对荒野生活的适应。
- source_word: בְּאַוַּת נַפְשׁוֹ
  choice: 在欲望的驱使下
  rationale: אַוָּה表示强烈渴望，נֶפֶשׁ在此可涉及欲求或胃口。结合发情语境，译文保留强烈欲望，却不把整个短语狭窄化为单纯的性欲。
- source_word: שָׁאֲפָה רוּחַ
  choice: 嗅吸着风
  rationale: שׁאף可表示急切吸入、喘吸，搭配“风”描绘母野驴在躁动欲求中迎风嗅吸；“嗅吸”兼顾吸气和循气味追寻的画面。
- source_word: תַּאֲנָתָהּ
  choice: 她发情时
  rationale: 此词在语境中指性欲发动的时节或状态。“发情时”符合动物意象，也比直译为“情欲”更准确自然。
- source_word: מִי יְשִׁיבֶנָּה
  choice: 谁能使她回头？
  rationale: 使役形态保留“使之返回、转回”的基本意象，同时表达无人能制止或扭转她。
- source_word: כָּל מְבַקְשֶׁיהָ לֹא יִיעָפוּ
  choice: 凡寻找她的都不必劳累
  rationale: 字面为“凡寻找她的不会疲乏”。结合下一分句，意思是追寻者无需耗尽力气，因为到特定时节便能找到她。
- source_word: בְּחָדְשָׁהּ
  choice: 到了她的月份
  rationale: 正文保留希伯来文“她的月／月份”这一不寻常表达，不在正文中完全消解其含义，并以脚注说明可能所指。
- source_word: יִמְצָאוּנְהָ
  choice: 他们就会找到她
  rationale: 明确承接“凡寻找她的”，以自然现代汉语表达未完成式在此处的将来或一般结果。
theological_decisions:
- issue: 作为犹大比喻的野驴之性别一致性
  choice: 采用阴性动物形象，译作“母野驴”，并使用“她”
  alternative: 在“נַפְשׁוֹ”一处机械保留阳性所属形式
  rationale: 本节大多数动词和代词后缀均为阴性，且上下文把犹大描绘为雌性野驴。נַפְשׁוֹ表面上的阳性后缀不宜破坏整段明确的阴性指向；中文统一为阴性可避免无根据的性别转换。
- issue: “她的月份”的解释
  choice: 正文保留字面张力，脚注说明可能指发情期或交配周期
  alternative: 正文直接译为“到了交配期”或“在她发情的时候”
  rationale: 希伯来文חֹדֶשׁ通常指“月、月份”，此处具体含义需要由动物发情的语境推断。保留字面表达可避免把可能解释写成唯一确定含义。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“母野驴”“嗅吸着风”“使她回头”等措辞保留原文鲜明的动物意象；“她的月份”有意保留陌生感，并借脚注帮助普通读者理解。
