  naturalness: “你却说”“我是无辜的”“我没有犯罪”自然清楚。“看哪”符合庄重书面语。司法表达中，“对簿”在现代汉语通常强烈联想到双方当庭对质，且常见于“对簿公堂”；“我必与你争讼”更直接、庄重地表达原文进入司法争讼/审断的语义，也避免将其误解为单纯的互相辩论。
  terminology: “无辜”“怒气”“犯罪”恰当。“争讼”可保留שפט在此的法庭、诉讼色彩；不将其扁平化为一般“审判”，也不预先限定为普通争辩。脚注应保留“审判你”这一可行译法，并说明法庭语境。
