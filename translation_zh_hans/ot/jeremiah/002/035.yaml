  text: וַ/תֹּֽאמְרִי֙ כִּ֣י נִקֵּ֔יתִי אַ֛ךְ שָׁ֥ב אַפּ֖/וֹ מִמֶּ֑/נִּי הִנְ/נִי֙ נִשְׁפָּ֣ט אוֹתָ֔/ךְ עַל אָמְרֵ֖/ךְ לֹ֥א חָטָֽאתִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/035.yaml
  text: Yet you said[a], “I am innocent; surely his anger has turned away from me.” Behold, I am entering into judgment with you because you say, “I have not sinned.”
translation:
  language: zh_hans
  text: 你却说：“我是无辜的；他的怒气已经离开我了。”看哪，我必与你争讼[a]，因为你说：“我没有犯罪。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “我必与你争讼”也可译作“我要审判你”或“我要与你对簿”；希伯来语采用法庭用语。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמְרִי
  choice: 你却说
  rationale: 连续叙述中的连接词在上下文中带有转折意味；“却”自然表现对犹大（以阴性单数称呼）的反驳。
- source_word: נִקֵּיתִי
  choice: 我是无辜的
  rationale: נקה 的尼法勒形表示免于罪责；“无辜”保留此处道德与司法语境。
- source_word: אַךְ
  choice: 必定
  rationale: 这里是加强说话者自信的语气，并非表示排他性的“只是”。
- source_word: שָׁב אַפּוֹ מִמֶּנִּי
  choice: 他的怒气……已经从我身上转开了
  rationale: שׁוב 与 אַף 构成怒气转离的表达；译文保留“转开”的动态意象。
- source_word: הִנְנִי
  choice: 看哪
  rationale: 这一提示语引出上帝郑重而突然的回应；“看哪”庄重且为现代读者所能理解。
- source_word: נִשְׁפָּט אוֹתָךְ
  choice: 我要与你对簿
  rationale: שׁפט 的尼法勒形式在此具有诉讼、争讼的法庭意味；“对簿”比泛称“审判”更能保留双方进入司法争辩的表达。
- source_word: עַל אָמְרֵךְ
  choice: 因为你说
  rationale: עַל 加名词化的动词形式说明采取司法行动的缘由，汉语用“因为你说”自然清楚。
- source_word: לֹא חָטָאתִי
  choice: 我没有犯罪
  rationale: 完成式在引语中表达对自身罪责的否认；“没有犯罪”准确而自然。
theological_decisions:
- issue: 上帝采取司法行动的法庭意味
  choice: 我要与你对簿
  alternative: 我要审判你；我要与你争辩
  rationale: 原文保留诉讼性和关系性的张力，不宜仅译成一般性的定罪，也不宜淡化为普通争论；“对簿”传达进入司法争讼的意味。
- issue: 说话者所断言的怒气已经转离
  choice: 他的怒气必定已经从我身上转开了
  alternative: 他的怒气必不再向我发作
  rationale: 选择保留 שׁוב 的“转回、转开”意象，并将其作为说话者自以为是的断言呈现，不替文本判定该断言为真。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“对簿”略带正式司法色彩，配合脚注解释，以保留原文的法庭语义；第二人称阴性单数在普通话中不作性别标记。
