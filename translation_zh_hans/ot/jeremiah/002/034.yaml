  text: גַּ֤ם בִּ/כְנָפַ֨יִ/ךְ֙ נִמְצְא֔וּ דַּ֛ם נַפְשׁ֥וֹת אֶבְיוֹנִ֖ים נְקִיִּ֑ים לֹֽא בַ/מַּחְתֶּ֥רֶת מְצָאתִ֖י/ם כִּ֥י עַל כָּל אֵֽלֶּה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/034.yaml
  text: Even on your skirts is found the blood of the lives of innocent poor people[a]. I did not find them in a break-in[c][b], but on account of all these things.
translation:
  language: zh_hans
  text: 甚至在你的衣服下摆上，也发现了无辜穷苦人的血——他们的生命之血[a]。我发现他们，并不是在挖墙行窃时[b]；却是因着这一切[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “衣服下摆”也可译作“衣边”或“衣角”；原文直译为“翅膀上”。
    reason: lexical_alternative
  - marker: b
    text: “挖墙行窃”所译的词，指挖穿墙壁入室盗窃。可比较出埃及记22:2的法律背景。按马所拉文本，“我发现他们”中的“我”是第一人称，指上主；这些无辜穷苦人并非在入室行窃时被发现。
    reason: cross_reference
  - marker: c
    text: 本节末句的希伯来语高度省略，意思难以确定。这里按字面保留“却是因着这一切”的表达；也可理解为“不是因发现他们在挖墙行窃，而是由于这一切”，或作“尽管有这一切”。
    reason: alternative_reading
lexical_decisions:
- source_word: בִּכְנָפַיִךְ
  choice: 在你的衣襟上
  rationale: כָּנָף本义为“翅膀”或物体的边缘；用于衣服时指衣边、衣角或下摆。此处描写衣服上的血迹，“衣襟”既保留具体形象，也符合现代汉语表达。
- source_word: נִמְצְאוּ דַּם נַפְשׁוֹת
  choice: 也发现了……生命之血
  rationale: נִמְצְאוּ为被动的“被发现”，דַּם נַפְשׁוֹת是较不寻常且带强调意味的结构，直指被夺去的生命。“生命之血”比单说“血”更能传达原文力度，又避免把נֶפֶשׁ误解为后期意义上的“灵魂”。
- source_word: אֶבְיוֹנִים נְקִיִּים
  choice: 无辜穷苦人
  rationale: אֶבְיוֹנִים指贫穷、困乏的人，נְקִיִּים指清白无罪的人。“无辜穷苦人”自然地保留其社会处境和法律—道德上的无罪。
- source_word: לֹא בַמַּחְתֶּרֶת
  choice: 并不是在挖墙行窃
  rationale: מַחְתֶּרֶת特指挖穿墙壁入室盗窃的情形，并与出埃及记22:2的法律背景相呼应。“挖墙行窃”比泛称“盗窃”更准确，也便于现代读者理解。
- source_word: מְצָאתִים
  choice: 我发现他们时
  rationale: 马所拉文本的形式可按第一人称单数动词连第三人称复数宾语理解，即“我发现他们”；保留第一人称，让耶和华继续作为提出司法控诉的说话者，不凭推测改成“你发现他们”。
- source_word: כִּי עַל כָּל אֵלֶּה
  choice: 然而，这一切却发生了
  rationale: 末句高度省略，עַל כָּל אֵלֶּה的确切关系难以确定。正文用概括而克制的汉语表达其转折和指向前述诸事的功能，不擅自补出原文未明说的具体因果关系，并以脚注保留其他可能理解。
theological_decisions:
- issue: 困难中句的说话者及宾语所指
  choice: 按马所拉文本保留第一人称：“我发现他们时”，并把“他们”理解为遭杀害的无辜穷苦人。
  alternative: 按语境或经文校订译成第二人称：“你并没有发现他们正在挖墙行窃。”
  rationale: 第一人称读法保留现有希伯来文本，并呈现耶和华以审判者身份所作的控诉：这些人并非因被当场抓获入室行窃而遭杀害。
- issue: 末句כִּי עַל כָּל אֵלֶּה的逻辑关系
  choice: 正文保留其省略性，译作“然而，这一切却发生了”。
  alternative: 译作“却是因着这一切”“尽管有这一切”或“却在这一切之上”。
  rationale: 希伯来语末句本身残缺难解，因果、让步或空间性理解均有人提出。正文不把任何一种解释绝对化，脚注明确交代歧义。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“衣襟”“生命之血”“挖墙行窃”保留先知控诉中具体、司法性的意象；末句有意维持原文的断裂和歧义，并借脚注说明，而不以宗派性解释补足。
