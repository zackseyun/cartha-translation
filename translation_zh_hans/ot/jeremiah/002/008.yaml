id: JER.2.8
reference: Jeremiah 2:8
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: הַ/כֹּהֲנִ֗ים לֹ֤א אָֽמְרוּ֙ אַיֵּ֣ה יְהוָ֔ה וְ/תֹפְשֵׂ֤י הַ/תּוֹרָה֙ לֹ֣א יְדָע֔וּ/נִי וְ/הָ/רֹעִ֖ים פָּ֣שְׁעוּ בִ֑/י וְ/הַ/נְּבִיאִים֙ נִבְּא֣וּ בַ/בַּ֔עַל וְ/אַחֲרֵ֥י לֹֽא יוֹעִ֖לוּ הָלָֽכוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/008.yaml
  text: The priests did not say[a], ‘Where is Yahweh?’ Those who handle the law did not know me; the shepherds rebelled against me[c][b]; the prophets prophesied by Baal and went after things that do not profit.
translation:
  language: zh_hans
  text: 祭司没有说：“雅威在哪里？”掌管律法的人不认识我；牧人背叛了我；先知奉巴力说预言[a]，追随那些毫无益处的事物[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “奉巴力说预言”也可译作“靠巴力说预言”或“以巴力的名义说预言”。
    reason: 介词 ב 可表示凭借、媒介或名义，原文保留一定歧义。
  - marker: b
    text: “那些毫无益处的事物”也可译作“毫无用处的东西”；原文没有明说所指的是偶像。
    reason: 保留原文省略宾语所产生的开放性，避免过度具体化。
lexical_decisions:
- source_word: הַכֹּהֲנִים
  choice: 祭司
  rationale: 采用具体复数群体称谓，直接指祭司阶层中的领袖，中文无需另加复数标记。
- source_word: אַיֵּה יְהוָה
  choice: 雅威在哪里？
  rationale: 保留原文的反问和神的圣名；“雅威”直接对应四字神名 יהוה。
- source_word: תֹפְשֵׂי הַתּוֹרָה
  choice: 掌管律法的人
  rationale: תפשׂ 本义为抓住、持有或经手；“掌管”在现代中文中自然，也保留他们负责运用律法的含义，而不将其限定为教师。
- source_word: לֹא יְדָעוּנִי
  choice: 不认识我
  rationale: ידע 加人称宾语在此不只是认知，也涉及关系和承认；“认识我”保留这种盟约关系层面的指控。
- source_word: הָרֹעִים
  choice: 牧人
  rationale: 保留先知文本以牧人指领导者的隐喻，不直接解释成“统治者”或“领袖”。
- source_word: פָּשְׁעוּ בִי
  choice: 背叛了我
  rationale: פשע 表示反叛、悖逆；“背叛”在中文中有明确的关系和盟约破裂色彩。
- source_word: הַנְּבִיאִים נִבְּאוּ בַבַּעַל
  choice: 先知奉巴力说预言
  rationale: 介词 ב 可表示凭借、依靠或在某名义之下；“奉巴力说预言”自然地表达其权威来源，同时以脚注保留其他可能译法。
- source_word: אַחֲרֵי לֹא יוֹעִלוּ הָלָכוּ
  choice: 追随那些毫无益处的事物
  rationale: 保留“跟随……之后”的惯用表达和未明说的对象，不擅自明确译成偶像；“毫无益处”反映 יעל 的无助益、无效用之意。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；音译“雅威”保留其专名性质，不以称号取代，也不将传统的另一种音译混入正文。
- issue: בַבַּעַל 所表达的关系
  choice: 奉巴力说预言
  alternative: 靠巴力说预言；以巴力的名义说预言
  rationale: 介词 ב 的语义容许工具、凭借或名义等理解；正文采用自然而不过度展开的表达，脚注保留这一语义幅度。
- issue: 末句未明说的对象
  choice: 那些毫无益处的事物
  alternative: 毫无用处的东西；不能带来益处者
  rationale: 上下文暗示虚假神明，但希伯来文没有明说“偶像”；因此不把该神学判断直接补入正文。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。四个领导群体以并列分句呈现，保留原文逐项控诉的节奏；“牧人”保留隐喻，“说预言”避免较古雅的“说预言说”式同源结构。
