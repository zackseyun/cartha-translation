base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/037.yaml
  text: From this one too you will go out with your hands on your head[a], for Yahweh has rejected those in whom you trust[d][c][b], and you will not prosper through them.
translation:
  language: zh_hans
  text: 你也必离开这一个，把双手放在头上；因为雅威弃绝了你所倚靠的，你靠它们必不能成功[d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: d
    text: 或译“你必不能借着它们成功”或“你必不能靠它们亨通”。
    reason: 呈现 הצליח 与介词短语结合时“成功／亨通”和“靠着／借着”的可选表达。
lexical_decisions:
- source_word: גַּם
  choice: 也
  rationale: 承接上文，表明犹大从这个外邦势力那里也同样得不到帮助。
- source_word: מֵאֵת זֶה
  choice: 离开这个盟国
  rationale: 原文直译近于“从这个那里”；结合紧接的上文，所指很可能是埃及。正文用“盟国”使现代汉语自然，脚注同时保留原文较含混的指示表达。
- source_word: תֵּצְאִי
  choice: 必离开
  rationale: 在此表示犹大将从所投靠的外邦势力那里离去；“必”表达未完成式在预言语境中的将来确定性。
- source_word: וְיָדַיִךְ עַל רֹאשֵׁךְ
  choice: 双手抱头
  rationale: 保留双手置于头上的具体动作，也符合现代汉语对悲痛、羞辱或失败姿态的表达。
- source_word: מָאַס
  choice: 弃绝
  rationale: 表达雅威拒绝、摒弃犹大所信赖对象的强烈含义，又不必限定为单纯的厌恶情绪。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代简体中文常见音译呈现神的专名，而不以称号替代。
- source_word: בְּמִבְטַחַיִךְ
  choice: 你所倚靠的
  rationale: 希伯来文形式上是复数“你的倚靠／信赖”，在语境中具体指犹大倚赖的外邦势力；此译法自然，并保留对象未明说的特点。
- source_word: תַצְלִיחִי לָהֶם
  choice: 你靠它们必不能亨通
  rationale: הצליח 表示成功或亨通；介词短语指出犹大不能凭这些倚靠对象取得成功。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；正文以“雅威”音译该专名，避免用“主”等称号取代，同时不在本节加入原文没有的神学解释。
- issue: 雅威弃绝的对象
  choice: 你所倚靠的
  alternative: 你的倚靠／你所信赖的势力
  rationale: 原文复数名词既可抽象理解为“所倚仗之事”，也可具体指所信赖的盟邦。正文不把它过度限定为某一类人物或制度，脚注保留其词义范围。
translation_notes:
  register: 采用庄重而通顺的现代标准普通话。“离开这个盟国”依据上文明确语境，但以脚注提示原文只有指示语；“你所倚靠的”避免生硬直译，也不将复数对象过度具体化。分号呈现审判宣告与原因之间的逻辑关系。
