base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/032.yaml
  text: Does a virgin forget her jewelry[b][a], or a bride her ornaments? Yet my people have forgotten me for days without number.
translation:
  language: zh_hans
  text: 处女岂会忘记她的饰物[a]？新娘岂会忘记她的饰带[b]？然而，我的子民竟忘记了我，已经有无数的日子了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “处女”所译的希伯来语也可泛指年轻的未婚女子。
    reason: lexical_alternative
  - marker: b
    text: “饰带”所译的希伯来语可能更具体地指新娘的饰带、腰带或系扎的装饰品。
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲ/תִשְׁכַּח
  choice: 岂会忘记
  rationale: 以反问形式表达 הֲ 所引出的修辞问句；“岂会”自然传达这种事本不应发生的意味。
- source_word: בְּתוּלָה
  choice: 少女
  rationale: בְּתוּלָה 通常指未婚少女，并常含童贞之意；此处与“新娘”构成平行，“少女”在现代汉语中更自然，相关词义保留于脚注。
- source_word: עֶדְיָהּ
  choice: 她的首饰
  rationale: עֶדְיָהּ 指个人用来装扮自己的饰物；“首饰”简明自然，同时不把具体物件说得过细。
- source_word: כַּלָּה
  choice: 新娘
  rationale: 准确表达 כַּלָּה，并与前半句的“少女”形成对应。
- source_word: קִשֻּׁרֶיהָ
  choice: 她的佩饰
  rationale: 该词可能特指系扎在身上的装饰带、腰带或婚礼饰物；“佩饰”保留装饰品的总体含义而不过度限定。
- source_word: וְ/עַמִּי
  choice: 然而，我的子民
  rationale: וְ 在这里表示鲜明转折；“然而”凸显少女、新娘不会忘记饰物与百姓忘记上帝之间的反差。
- source_word: שְׁכֵחוּ/נִי
  choice: 竟忘记了我
  rationale: “忘记了我”忠实表达完成式所陈述的事实和持续结果；“竟”传达原文对反常行为的谴责性反差，但不强化为“离弃”。
- source_word: יָמִים אֵין מִסְפָּר
  choice: 已有数不清的日子
  rationale: 贴近“日子没有数目”的希伯来语表达，也以自然现代汉语说明这种遗忘持续已久。
theological_decisions:
- issue: “我的子民”忘记上帝所含的圣约关系
  choice: 保留“我的子民竟忘记了我”的关系性和控诉语气
  alternative: 译作“我的子民竟离弃了我”
  rationale: 上下文具有圣约不忠的含义，但本节所用动词明确是“忘记”；不以更强的“离弃”替换，从而保留经文本身的隐喻与神学张力。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。两个平行反问句分别完整表达，以突出诗句节奏；用“然而……竟……”呈现强烈反差。所有脚注标记均置于正文相应词语之后。
