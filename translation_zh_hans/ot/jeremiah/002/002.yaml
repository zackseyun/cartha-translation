- from: 你去，要向耶路撒冷宣告说：“雅威如此说：我记得你年轻时的忠贞之爱[a]，你作新娘时的爱情[b]；那时你跟随我，走在旷野，走在无人撒种之地。”
  to: 你去，向耶路撒冷宣告说：“雅威如此说：我记得你幼年时的忠贞之爱[a]，你作新娘时的爱[b]；你曾在旷野、在未曾撒种之地跟随我。”
