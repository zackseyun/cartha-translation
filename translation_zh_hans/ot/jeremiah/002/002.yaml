  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: הָלֹ֡ךְ וְ/קָֽרָאתָ֩ בְ/אָזְנֵ֨י יְרוּשָׁלִַ֜ם לֵ/אמֹ֗ר כֹּ֚ה אָמַ֣ר יְהוָ֔ה זָכַ֤רְתִּי לָ/ךְ֙ חֶ֣סֶד נְעוּרַ֔יִ/ךְ אַהֲבַ֖ת כְּלוּלֹתָ֑יִ/ךְ לֶכְתֵּ֤/ךְ אַחֲרַ/י֙ בַּ/מִּדְבָּ֔ר בְּ/אֶ֖רֶץ לֹ֥א זְרוּעָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/002.yaml
  text: 'Go and proclaim in the hearing of Jerusalem[a], saying, ‘Thus says Yahweh: I remember for you the faithful love of your youth, the love of your betrothal, when you went after me in the wilderness[b], in a land not sown.’'
translation:
  language: zh_hans
  text: 你去，向耶路撒冷宣告说：“雅威如此说：我记得你幼年时的忠贞之爱[a]，你作新娘时的爱[b]；你曾在旷野、在未曾撒种之地跟随我。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “忠贞之爱”也可译作“坚贞的爱”或“忠诚”；希伯来语 חֶסֶד 在这里兼有爱与关系忠贞的含义。
    reason: lexical_alternative
  - marker: b
    text: “作新娘时”也可理解为“订婚时”或“新婚时”；希伯来语所指的具体婚嫁阶段并不完全确定。
    reason: alternative_reading
lexical_decisions:
- source_word: הָלֹךְ וְקָרָאתָ
  choice: 你去，要……宣告
  rationale: 以“你去，要……”体现不定式绝对式与限定动词连用所加强的命令语气；“宣告”符合先知公开传话的语境。
- source_word: בְאָזְנֵי יְרוּשָׁלִַם
  choice: 向耶路撒冷宣告
  rationale: 希伯来文直译为“在耶路撒冷耳中”；中文以“向耶路撒冷”自然表达受话对象，同时保留“耶路撒冷”作为城及其居民的转喻。
- source_word: כֹּה אָמַר יְהוָה
  choice: 雅威如此说
  rationale: 保留标准的先知使者公式，并以“雅威”音译上帝的专名 יהוה。
- source_word: זָכַרְתִּי לָךְ
  choice: 我记得你……
  rationale: 中文用“我记得你……”自然表达动词及与格代词的关系；不采用生硬的“我为你记得”。
- source_word: חֶסֶד
  choice: 忠贞之爱
  rationale: 兼顾 חֶסֶד 所含的情爱与关系中的忠诚、坚定，不把它缩减为一般的善意。
- source_word: נְעוּרַיִךְ
  choice: 你年轻时
  rationale: 自然表达以色列民族早期阶段的拟人化意象。
- source_word: אַהֲבַת כְּלוּלֹתָיִךְ
  choice: 你作新娘时的爱情
  rationale: 保留婚姻比喻，同时不武断限定为订婚、婚礼当天或婚后初期。
- source_word: לֶכְתֵּךְ אַחֲרַי
  choice: 那时你跟随我
  rationale: 将不定式结构按语境译作时间从句；“跟随我”自然传达“走在我后面”的希伯来语习惯表达。
- source_word: בַּמִּדְבָּר
  choice: 走在旷野
  rationale: “旷野”既符合地理环境，也能唤起出埃及行程的背景。
- source_word: בְּאֶרֶץ לֹא זְרוּעָה
  choice: 走在无人撒种之地
  rationale: 保留原文未曾播种的农业图像；补出“无人”使现代中文清楚自然。
theological_decisions:
- issue: 以婚姻关系比喻以色列早期与雅威的关系
  choice: 译作“你作新娘时的爱情”
  alternative: “你订婚时的爱情”或“你新婚时的爱情”
  rationale: כְּלוּלֹת 指向新娘身份或婚嫁时期，但具体阶段并不完全确定；正文保留新娘意象，脚注呈现可能的时间理解，不把经文限定于某一种盟约婚姻解释。
- issue: חֶסֶד 在本节中的关系方向
  choice: 译作“你年轻时的忠贞之爱”，不在正文补出“对我的”
  alternative: “你年轻时对我的忠贞之爱”
  rationale: 下文“你跟随我”显示这爱以雅威为对象，但原文此处没有明说“对我”；不补出宾语可保留原有表达及其诗意张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。以“雅威如此说”保留先知宣告的正式语体；后半句用平行的“走在……”增强诗性节奏，同时保持普通读者易懂。
