  text: לַ/שָּׁוְא֙ הִכֵּ֣יתִי אֶת בְּנֵי/כֶ֔ם מוּסָ֖ר לֹ֣א לָקָ֑חוּ אָכְלָ֧ה חַרְבְּ/כֶ֛ם נְבִֽיאֵי/כֶ֖ם כְּ/אַרְיֵ֥ה מַשְׁחִֽית־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/030.yaml
  text: In vain I struck your sons[a]; they accepted no correction[c][b]. Your sword devoured your prophets like a destroying lion.
translation:
  language: zh_hans
  text: 我徒然击打了你们的儿子[a]，他们却不肯接受管教[b]。你们的刀吞灭了你们的先知，如同一头带来毁灭的狮子[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “儿子”也可译作“儿女”；希伯来原文直译为阳性复数“儿子”。
    reason: lexical_alternative
  - marker: b
    text: “管教”也可译作“纠正”或“训诲”；希伯来词מוּסָר兼有惩戒、纠正和道德教导的含义。
    reason: lexical_alternative
  - marker: c
    text: 或译“如同一头凶猛攫食的狮子”。希伯来文形容这狮子施行毁灭。
    reason: lexical_alternative
lexical_decisions:
- source_word: לַשָּׁוְא
  choice: 也是徒然
  rationale: 介词ל与שָׁוְא构成副词性表达，表示击打没有产生预期效果；“徒然”简洁而庄重。
- source_word: הִכֵּיתִי
  choice: 我击打
  rationale: 使役词干在此意为“击打”；不扩大为“击杀”，保留原文动作及其管教语境。
- source_word: בְּנֵיכֶם
  choice: 你们的儿子
  rationale: 原文为阳性复数“儿子”；正文按字面保留，同时以脚注说明也可能泛指“儿女”。
- source_word: מוּסָר
  choice: 管教
  rationale: מוּסָר兼有管束、纠正和教导之意；紧接神的击打，“管教”最能兼顾惩戒与纠正目的。
- source_word: לֹא לָקָחוּ
  choice: 不肯接受
  rationale: לקח与מוּסָר连用，意为接受管教；“不肯”自然表达语境中的拒绝意味，但不另行解释其动机。
- source_word: אָכְלָה
  choice: 吞灭了
  rationale: 保留刀剑“吞吃”的拟人化暴力意象；“吞灭”比“吃了”更符合现代庄重书面语。
- source_word: חַרְבְּכֶם
  choice: 你们的刀
  rationale: 直接保留第二人称复数所有格，也维持百姓以暴力对待自己先知的尖锐反讽。
- source_word: נְבִיאֵיכֶם
  choice: 你们的先知
  rationale: 保留原文所有格，不进一步限定为从他们中间兴起或奉差到他们那里的人。
- source_word: כְּאַרְיֵה מַשְׁחִית
  choice: 如同毁灭人的狮子
  rationale: מַשְׁחִית是使役分词，描写狮子施行毁灭；补出“人的”使中文通顺，却不采用“凶猛、撕掠”等额外色彩。
theological_decisions:
- issue: 击打与管教的关系
  choice: 以“管教”呈现击打的纠正目的
  alternative: 惩罚；训诲
  rationale: 上下句表明击打本应使人接受מוּסָר，但结果徒然；“管教”保留惩戒与教导之间的张力，不把它简化为纯粹报应或纯粹口头训诲。
- issue: “你们的刀”的施事含义
  choice: 保留原文所有格，不明说是谁亲手杀害先知
  alternative: 你们用刀吞灭了先知；你们中间的刀吞灭了先知
  rationale: 希伯来文把“你们的刀”拟人为吞灭者。直译既表明责任归属，又不越过原文明确判定具体施事方式。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“击打”“徒然”“管教”“吞灭”保留先知话语的力度与意象；句法略作中文化处理。未沿用英文咨询层中标记[c]的位置与内容，因为该脚注在英文正文中误置于“correction”之后；“如同毁灭人的狮子”已直接体现原文כְּאַרְיֵה מַשְׁחִית，无须另设脚注。
