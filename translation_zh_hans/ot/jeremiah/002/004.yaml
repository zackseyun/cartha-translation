    rationale: “各”可作分配性表达，虽不必然错误，但“所有宗族”或“全体宗族”更直接对应原文“所有／全体的宗族”，并消除歧义。
  revised_text: 雅各家啊，以色列家的所有宗族[a]啊，当听雅威的话。
