review_pass:
  verdict: revise
  source_fidelity: 原文以复数祈使式呼召“雅各家”和“以色列家的全体宗族”聆听雅威的话。草稿准确保留了神名、两组称谓及宗族的群体含义；但“各宗族”在现代汉语中可偏向逐一／分别，未明确表达 כָּל（“所有、全体”）的总括范围。
  naturalness: 语体庄重自然。将呼语置前、命令置后符合汉语表达；以“当听”表达先知性祈使，比“你们要听”更凝练，同时不改变命令力度。
  terminology: “雅威”“雅各家”“以色列家”“宗族”均合适。“宗族”准确对应以亲属关系构成、而非支派的 מִשְׁפָּחוֹת；脚注保留“家族”这一可行替代译法。
