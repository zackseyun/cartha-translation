  text: שִׁמְע֥וּ דְבַר יְהוָ֖ה בֵּ֣ית יַעֲקֹ֑ב וְ/כָֽל מִשְׁפְּח֖וֹת בֵּ֥ית יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/004.yaml
  text: Hear the word of Yahweh[a], O house of Jacob, and all the clans of the house of Israel.
translation:
  language: zh_hans
  text: 雅各家啊，以色列家的所有宗族[a]啊，当听雅威的话。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “宗族”或译“家族”；原词指以色列内部以亲属关系组成的群体。
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעוּ
  choice: 你们要听
  rationale: 这是 שׁמע 的 Qal 祈使式复数，既是直接呼召，也带有领受并听从信息的意味；“要听”保留先知宣告的庄重语气。
- source_word: דְבַר יְהוָה
  choice: 雅威的话
  rationale: “……的话”保留先知书中“雅威的话”这一固定宣告格式；将神名 יְהוָה 音译为“雅威”，不以称号代替。
- source_word: בֵּית יַעֲקֹב
  choice: 雅各家啊
  rationale: “家”保留 בֵּית 的整体、群体意义；“啊”自然表达希伯来文在此处的呼语功能。
- source_word: וְכָל מִשְׁפְּחוֹת
  choice: 各宗族
  rationale: מִשְׁפָּחוֹת 指由亲属关系组成的群体；“宗族”比现代汉语中的“家庭”范围更大，又不像“支派”那样指更大的社会单位。כָל 在复数名词前译为“各”，符合现代汉语习惯。
- source_word: בֵּית יִשְׂרָאֵל
  choice: 以色列家
  rationale: 保留与“雅各家”的平行结构，并表达以色列作为立约群体的整体含义。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名；“雅威”以现代汉语常见形式音译该专名，避免用“主”这一称号取代神名。
- issue: “雅各家”与“以色列家”的关系
  choice: 保留两个并列称呼
  alternative: 合并为“全以色列人”
  rationale: 原文先称“雅各家”，继而称“以色列家的各宗族”；保留二者可呈现原文的平行与递进，而不预先断定它们只是完全同义的重复。
translation_notes:
  register: 采用现代、庄重而易懂的先知宣告语体。为使中文呼语清楚，将两个受呼唤的群体前置，并在末尾给出命令“你们要听雅威的话”。脚注标记置于其实际解释的“宗族”之后。
