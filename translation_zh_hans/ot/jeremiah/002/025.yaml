  text: מִנְעִ֤י רַגְלֵ/ךְ֙ מִ/יָּחֵ֔ף ו/גורנ/ך מִ/צִּמְאָ֑ה וַ/תֹּאמְרִ֣י נוֹאָ֔שׁ ל֕וֹא כִּֽי אָהַ֥בְתִּי זָרִ֖ים וְ/אַחֲרֵי/הֶ֥ם אֵלֵֽךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/025.yaml
  text: Keep your feet from going unshod and your throat from thirst. But you said[a], “It is hopeless! No, for I have loved strangers, and after them I will go.”
translation:
  language: zh_hans
  text: 不要赤着脚走，也不要让你的喉咙干渴。你却说：“没希望了！不！因为我爱上了外人[a]，我要跟随他们。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “外人”也可译作“外国人”。在本段语境中，这个词可能比喻外邦神、外来的情人，或外国及其盟友。
    reason: 保留זָרִים的词义范围及本章多层隐喻，避免在正文中把所指限定得过窄。
lexical_decisions:
- source_word: מִנְעִי רַגְלֵךְ מִיָּחֵף
  choice: 不要让你的脚光着走
  rationale: מִנְעִי是阴性单数命令式，向人格化的犹大说话；“不要让……光着走”自然表达制止之意，并保留赤足奔走、追逐至疲惫的意象。
- source_word: וְגֹרֹנֵךְ מִצִּמְאָה
  choice: 也不要让你的喉咙干渴
  rationale: גרון在干渴语境中指“喉咙”；中文用“喉咙干渴”保留身体意象及与前句的平行。
- source_word: נוֹאָשׁ
  choice: 没希望了
  rationale: 此词表达绝望或认定劝阻无用；这一口语化而庄重的说法适合人物直接回应。
- source_word: לֹא
  choice: 不
  rationale: 理解为对先前劝告的强烈拒绝，而非单纯否定“没希望了”；独立成句可保留希伯来语突兀有力的语气。
- source_word: אָהַבְתִּי זָרִים
  choice: 我爱上了外人
  rationale: 完成式表达已形成且持续的爱恋；“外人”保留זָרִים的宽泛性及婚恋隐喻，不把所指限定为外邦神、情人或政治盟友。
- source_word: וְאַחֲרֵיהֶם אֵלֵךְ
  choice: 我要跟随他们
  rationale: 自然表达“在他们后面走”的希伯来语习语，并保留未完成式在此处的意愿、将来趋向。
theological_decisions:
- issue: “外人”（זָרִים）在属灵淫乱隐喻中的所指
  choice: 正文保留宽泛的“外人”并加注
  alternative: 外邦神、外邦情人或外国及其盟友
  rationale: 本章交织婚姻不忠、偶像崇拜和依靠外国势力的意象；译文不应替原文消除这种多层含义。
- issue: לֹא与נוֹאָשׁ的关系
  choice: 译作两个感叹：“没希望了！不！”
  alternative: “没有用，我不肯”或将לֹא并入前句
  rationale: 原文简短且语法关系具有张力；分开表达既呈现绝望之语，也呈现对劝告的拒绝，避免过度解释。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“脚光着走”和“喉咙干渴”保留原文并列的身体意象；直接引语简短有力。脚的单数在中文中可作整体称呼，无须机械改为复数。
