source:
  edition: WLC
  text: תְּיַסְּרֵ֣/ךְ רָעָתֵ֗/ךְ וּ/מְשֻֽׁבוֹתַ֨יִ/ךְ֙ תּוֹכִחֻ֔/ךְ וּ/דְעִ֤י וּ/רְאִי֙ כִּי רַ֣ע וָ/מָ֔ר עָזְבֵ֖/ךְ אֶת יְהוָ֣ה אֱלֹהָ֑יִ/ךְ וְ/לֹ֤א פַחְדָּתִ/י֙ אֵלַ֔יִ/ךְ נְאֻם אֲדֹנָ֥/י יְהוִ֖ה צְבָאֽוֹת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/019.yaml
  text: Your evil will discipline you[a], and your apostasies will reprove you. So know and see that it is evil and bitter for you to forsake Yahweh your God, and that my fear is not in you[c][b], declares the Lord GOD of hosts.
translation:
  language: zh_hans
  text: 你的恶必管教你；你的背道必指责你。所以你要知道，要看清：离弃耶和华你的上帝，是何等邪恶、何等苦涩；你里面并没有对我的敬畏[a]。这是万军之主耶和华的宣告。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你并不敬畏我。”
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּיַסְּרֵךְ
  choice: 必管教你
  rationale: יסר的加强语态兼有纠正与惩戒之意；“管教”在现代汉语中自然地保留这两层力量。
- source_word: רָעָתֵךְ
  choice: 你的恶
  rationale: 上下文指向离弃上帝的恶行，而非单指由此产生的灾祸；“恶”也与后文的רַע形成呼应。
- source_word: מְשֻׁבוֹתַיִךְ
  choice: 你的背道
  rationale: 该词表示转离耶和华、对圣约不忠；“背道”简洁地表达这种宗教和关系层面的叛离。希伯来语虽为复数，汉语抽象名词用单数形式更自然，仍可涵盖多次背离。
- source_word: תּוֹכִחֻךְ
  choice: 必指责你
  rationale: יכח在此有责备、揭明过错之意；“指责”表明百姓自身的背道成为控诉他们的证据。
- source_word: וּדְעִי וּרְאִי
  choice: 所以，你要知道，也要看清
  rationale: 保留两个女性单数命令式所表达的认识与察看；“所以”自然承接前句的因果关系。
- source_word: רַע וָמָר
  choice: 多么邪恶、多么苦涩
  rationale: “邪恶”保留רַע的道德分量，“苦涩”表达离弃上帝所带来的痛苦后果；“多么”使汉语感叹语气自然。
- source_word: עָזְבֵךְ אֶת־יְהוָה אֱלֹהָיִךְ
  choice: 离弃耶和华你的上帝
  rationale: 把带第二人称后缀的不定式结构译成汉语名词性短语，既贴近原文，也清楚说明“邪恶、苦涩”的具体所指。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文读者熟悉的神名音译，明确呈现原文专名YHWH，而不以普通称号代替。
- source_word: וְלֹא פַחְדָּתִי אֵלַיִךְ
  choice: 你里面并没有对我的敬畏
  rationale: 原文使用名词“我的畏惧／对我的敬畏”，而非简单的动词句；此译法保留其名词结构，并表达对上帝应有的敬惧缺失。
- source_word: נְאֻם אֲדֹנָי יְהוִה צְבָאוֹת
  choice: 这是主耶和华——万军之耶和华的宣告
  rationale: “宣告”自然表达נְאֻם的先知公式；“主耶和华”对应אֲדֹנָי יְהוִה，“万军之耶和华”保留צְבָאוֹת这一传统且具有军事与宇宙权柄色彩的称号。
theological_decisions:
- issue: מְשֻׁבוֹתַיִךְ在圣约语境中的含义
  choice: 你的背道
  alternative: 你的屡次转离／你的叛离
  rationale: 经文所斥责的不只是一般道德反复，而是离弃耶和华、破坏圣约关系。“背道”保留这种神学分量，同时仍是普通现代读者能够理解的表达。
- issue: וְלֹא פַחְדָּתִי אֵלַיִךְ的名词式表达
  choice: 你里面并没有对我的敬畏
  alternative: 你并不敬畏我
  rationale: 原文强调“对我的敬畏”这一实质在百姓里面缺失。正文保留这种结构和神学张力，脚注给出更口语化的动词式译法。
- issue: 审判与行为后果的关系
  choice: 你的恶必管教你，你的背道必指责你
  alternative: 你的恶必惩罚你，你的背道必责备你
  rationale: 原文把百姓自己的恶与背道描写成施行管教、提出指控的主体，突出罪行本身反过来审判人的意味；译文不把这种张力改写为单纯外加的惩罚。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“管教”“背道”“宣告”等词保留先知谕言的力度，同时避免文言句式。用第二人称“你”维持原文对犹大这一女性单数对象的直接责问；中文无需另行标示语法性别。
