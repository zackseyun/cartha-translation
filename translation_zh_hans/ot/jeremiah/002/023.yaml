source:
  edition: WLC
  text: אֵ֣יךְ תֹּאמְרִ֞י לֹ֣א נִטְמֵ֗אתִי אַחֲרֵ֤י הַ/בְּעָלִים֙ לֹ֣א הָלַ֔כְתִּי רְאִ֤י דַרְכֵּ/ךְ֙ בַּ/גַּ֔יְא דְּעִ֖י מֶ֣ה עָשִׂ֑ית בִּכְרָ֥ה קַלָּ֖ה מְשָׂרֶ֥כֶת דְּרָכֶֽי/הָ׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/023.yaml
  text: How can you say[a], ‘I have not defiled myself; I have not gone after the Baals’? Look at your way in the valley; know what you have done— a swift young she-camel[c][b], twisting her ways.
translation:
  language: zh_hans
  text: 你怎么能说：“我没有玷污自己[a]，没有跟随诸巴力[b]？”看看你在谷中的行径，认清你所做的事！你像一只轻快的年轻母骆驼，在自己的路径上迂回穿梭[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我没有成为不洁。”
    reason: lexical_alternative
  - marker: b
    text: “诸巴力”是复数，指人们所敬拜的各处或各种形态的巴力。
    reason: lexical_alternative
  - marker: c
    text: 本句的希伯来语用词罕见，含义不完全确定；可能描写年轻母骆驼在自己的路径上来回乱窜、踪迹纵横交错。
    reason: lexical_alternative
lexical_decisions:
- source_word: נִטְמֵאתִי
  choice: 我没有玷污自己
  rationale: 该词为 טמא 的尼斐勒完成式，可表示成为不洁或受到玷污。这里是百姓为自己辩解，用“玷污自己”自然地保留宗教与道德层面的含义；脚注注明也可译为“成为不洁”。
- source_word: אַחֲרֵי הַבְּעָלִים ... הָלַכְתִּי
  choice: 没有跟随诸巴力
  rationale: הלך אחרי 是“跟随、追随”的常用表达，在此指追随偶像。בְּעָלִים 是复数，故译作“诸巴力”，不将原文单数化。
- source_word: רְאִי דַרְכֵּךְ בַּגַּיְא
  choice: 看看你在谷中的行径
  rationale: דֶּרֶךְ 兼具道路与行为之意；“行径”在中文中保留道路隐喻，同时表达受责备的行为。גיא 译为“谷”，不过度指明具体地点。
- source_word: דְּעִי מֶה עָשִׂית
  choice: 认清你所做的事
  rationale: ידע 的命令式直译为“知道”，此处带有承认、意识到的责令意味；“认清”符合现代汉语语境，并保留责问力度。
- source_word: בִּכְרָה קַלָּה
  choice: 一匹轻快的母幼驼
  rationale: בִּכְרָה 指年轻的母骆驼，קַלָּה 原有轻捷、敏捷之意。“母幼驼”保留性别和年龄信息，“轻快”表现迅疾而躁动的动作。
- source_word: מְשָׂרֶכֶת דְּרָכֶיהָ
  choice: 来回穿梭，路径交错
  rationale: שרך 是罕见且含义不完全确定的词，在母幼驼的比喻中大概描写道路迂回、踪迹交错或奔走不定。正文采用形象而不僵硬的表达，脚注明示其不确定性。
theological_decisions:
- issue: בְּעָלִים 的复数及偶像崇拜含义
  choice: 诸巴力
  alternative: 巴力；诸主
  rationale: 原文明确使用复数，所指是不同地方或形态的巴力崇拜。译作“诸巴力”既保留复数，也避免将专名误解为一般性的“主人”。
- issue: 谷中的行径是否明确指欣嫩子谷
  choice: 保留为“谷中”
  alternative: 欣嫩子谷中
  rationale: 本节原文只说“谷”，上下文虽可能暗指耶路撒冷附近进行异教崇拜的山谷，却未在此明说其名称，因此不在正文中补入具体地名。
translation_notes:
  register: 采用现代、庄重而易懂的责问语气。以“你”对应阴性单数称呼，承接耶利米书将犹大人格化为女子的表达。动物比喻保留“母幼驼”的性别与年龄信息；末句通过正文与脚注共同保存罕见动词的语义不确定性。
