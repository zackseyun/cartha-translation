base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/033.yaml
  text: How well you make your way to seek love! Therefore even evil women you have taught your ways.
translation:
  language: zh_hans
  text: 你多么善于修饰自己的行径，为要寻求爱！所以，连邪恶的女人，你也把自己的行径教给了她们[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “邪恶的女人”也可译作“邪恶的事”或“种种恶事”；原文的阴性复数也可作较抽象的理解。
    reason: lexical_alternative
  - marker: b
    text: “你也把……教给了她们”依照上下文及传统读法译作第二人称阴性单数；原文书写形式按表面可读作“我教了”。
    reason: textual_variant
lexical_decisions:
- source_word: מַה תֵּיטִבִי דַּרְכֵּךְ
  choice: 你多么善于修整自己的道路
  rationale: מַה与使役形תֵּיטִבִי构成带讽刺意味的程度感叹；“修整自己的道路”保留“使道路变好、使之更有效”的使役意味和道路比喻，同时不把它过度解释为单纯“选择路线”。
- source_word: לְבַקֵּשׁ אַהֲבָה
  choice: 为了寻求爱情
  rationale: 原文אַהֲבָה是单数“爱、爱情”，并未明说“情人”；译文保留这一表达及其在上下文中的性关系隐喻。
- source_word: לָכֵן
  choice: 所以
  rationale: 保留前后两句的推论、结果关系；“所以”比“因此”更适合现代汉语经文叙述，同时仍显庄重。
- source_word: גַּם
  choice: 甚至
  rationale: 此处具有递进、加强语气的作用，突出犹大败坏到足以教坏别人的讽刺性指控。
- source_word: הָרָעוֹת
  choice: 邪恶的女人
  rationale: 带冠词的阴性复数在当前把犹大描写为追求不正当爱情之女子的语境中，较自然地指邪恶的女人；抽象理解仍有可能，故列入脚注。
- source_word: למדתי
  choice: 教给了
  rationale: 按上下文和传统读法作第二人称阴性单数“你教了”，与本节持续对女性化的犹大所作的直接称呼一致；汉语用“把……教给……”自然表达双宾语结构。
- source_word: דְּרָכָיִךְ
  choice: 自己的行径
  rationale: 原文为复数“你的道路”，在此喻指行为方式和惯行；“行径”保留道德意味，并与前半节的实体化“道路”形成有意义的词义呼应。
theological_decisions:
- issue: הָרָעוֹת在不贞爱情隐喻中的所指
  choice: 邪恶的女人
  alternative: 邪恶的事／种种恶事
  rationale: 阴性复数及上下文的人格化、性关系意象支持把它理解为“邪恶的女人”：犹大如此精于恶行，甚至能把自己的行径教给她们。但该形式也可作抽象或中性化理解，因此不在正文中排除另一读法。
- issue: למדתי的文本形式与人称
  choice: 按上下文及传统读法译为第二人称阴性单数“你教给了”
  alternative: 按书写辅音的表面形式译为第一人称单数“我教了”
  rationale: 全节以第二人称阴性单数称呼犹大，且后接“你的行径”；第二人称读法形成连贯的指控。书写形式可能使人想到第一人称，故用脚注透明说明。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“修整自己的道路”刻意保留原文道路意象和讽刺语气；“爱情”保留原文“爱”的词形，不直接扩译为“情人”。正文中的两个脚注标记分别保存词义歧义和文本人称问题。
