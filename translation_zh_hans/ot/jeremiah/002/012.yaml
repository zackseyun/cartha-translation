  text: שֹׁ֥מּוּ שָׁמַ֖יִם עַל זֹ֑את וְ/שַׂעֲר֛וּ חָרְב֥וּ מְאֹ֖ד נְאֻם יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/012.yaml
  text: Be appalled at this[a], O heavens; shudder, be utterly desolate, declares Yahweh.
translation:
  language: zh_hans
  text: 诸天哪，要因这事惊骇；要战栗，要极其荒凉[a]！这是雅威的宣告。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “要极其荒凉”也可译作“要极其荒芜”或“要彻底枯干”。本节几个动词意象强烈，彼此有所重叠，共同表达震惊、恐惧和毁灭般的凄凉。
    reason: 说明 חָרְבוּ מְאֹד 的词义范围，并保存这组诗性命令的多重意象。
lexical_decisions:
- source_word: שֹׁמּוּ
  choice: 惊骇
  rationale: 该复数命令式呼召诸天因所发生的事陷入震惊与恐惧；“惊骇”既保留强烈情绪，也符合现代汉语的庄重语体。
- source_word: שָׁמַיִם
  choice: 诸天哪
  rationale: 这里是把诸天当作见证者直接呼告；“诸天哪”保留拟人化呼语和先知诗歌的气势。
- source_word: עַל זֹאת
  choice: 因这事
  rationale: 指向上文所述的骇人事实；介词可表达“因、由于”，译文保留指示语的回指作用。
- source_word: וְשַׂעֲרוּ
  choice: 要战栗
  rationale: 该动词描写因恐怖而颤抖或毛发竖立；“战栗”自然地传达身体性的惊恐反应。
- source_word: חָרְבוּ מְאֹד
  choice: 变得极其荒凉
  rationale: חָרְבוּ 可指荒废、毁坏或枯干，מְאֹד 加强程度。译作“变得极其荒凉”保留诸天被命令进入彻底荒凉状态这一突兀而强烈的诗意形象。
- source_word: נְאֻם יְהוָה
  choice: 这是雅威的宣告
  rationale: נְאֻם 是庄严的先知宣告公式；这一表达在现代汉语中清楚、庄重，并将说话者置于句末以保留原文收束效果。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见音译呈现四字神名，保留其作为以色列之神专名的性质，而不以称号替代。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用神名；“雅威”较贴近通常重构的读音，并明确将其作为专名呈现。
- issue: 诸天“荒凉”的诗性命令
  choice: 保留为“变得极其荒凉”
  alternative: 弱化为“万分震惊”或“惊恐万状”
  rationale: 原文第三个命令式使用通常表示荒废、毁坏或枯干的 חרב。虽然用于“诸天”显得突兀，仍不把它同化为前两个表示惊恐的动词，以保存原文的张力和意象。
translation_notes:
  register: 采用现代、庄重而易懂的先知诗歌语体。以“诸天哪”保留直接呼告，以三个递进命令维持原文的节奏和强度；不将最后一个较突兀的荒凉意象顺化为单纯的情绪描写。
