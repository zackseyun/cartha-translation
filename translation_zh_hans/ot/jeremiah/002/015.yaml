base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/015.yaml
  text: Young lions roar against him; they raise their voice. They make his land a desolation; his cities are burned[a], without inhabitant.
translation:
  language: zh_hans
  text: 少壮狮子向他咆哮，高声吼叫；它们使他的国土一片荒凉，他的城邑被焚毁[a]，无人居住。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他的城邑荒废，无人居住。”希伯来语 נצתה 的词形较难确定，既可理解为“被焚毁”，也可较宽泛地理解为“被毁坏、荒废”。
    reason: lexical_alternative
lexical_decisions:
- source_word: עָלָיו
  choice: 向他
  rationale: 介词 עַל 与“咆哮”连用，在此表达敌意所指向的对象；“向他”自然保留攻击、威吓的意味。
- source_word: יִשְׁאֲגוּ
  choice: 咆哮
  rationale: 准确传达狮子的吼声及其捕食者般的威胁形象。
- source_word: כְפִרִים
  choice: 少壮狮子
  rationale: 该词指强健的年轻狮子，并非幼小的狮崽；“少壮狮子”兼顾年龄与力量感。
- source_word: נָתְנוּ קוֹלָם
  choice: 高声吼叫
  rationale: 希伯来语直译为“发出它们的声音”；结合狮子意象，译作“高声吼叫”自然且有力度。
- source_word: וַיָּשִׁיתוּ
  choice: 使
  rationale: 此处表示造成某种结果，即入侵者使国土陷入荒凉。
- source_word: אַרְצוֹ
  choice: 他的国土
  rationale: 保留第三人称阳性单数，延续上下文将以色列或雅各人格化为男性单数的表达；“国土”也清楚区别于一般土地。
- source_word: לְשַׁמָּה
  choice: 一片荒凉
  rationale: 该名词表示荒废、毁坏后的状态；“一片荒凉”符合现代汉语并保留结果性。
- source_word: עָרָיו
  choice: 他的城邑
  rationale: 忠实保留复数和第三人称阳性单数领属形式；“城邑”庄重而易懂。
- source_word: נצתה
  choice: 被焚毁
  rationale: 此疑难词形在本语境中很可能表示被烧、被点燃；“被焚毁”兼顾火烧与毁灭的结果，同时以脚注保留较宽泛的另一种理解。
- source_word: מִבְּלִי יֹשֵׁב
  choice: 无人居住
  rationale: 自然表达城邑人口断绝的意思，并保留单数分词所具有的集合意义。
