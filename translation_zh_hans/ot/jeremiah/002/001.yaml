  text: וַ/יְהִ֥י דְבַר יְהוָ֖ה אֵלַ֥/י לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/001.yaml
  text: And the word of Yahweh came to me[a], saying,
translation:
  language: zh_hans
  text: 雅威[a]的话临到我，说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文为יהוה（YHWH），是神的名字；传统中文译作“耶和华”。
    reason: 说明神名的原文形式及传统译法。
lexical_decisions:
- source_word: וַיְהִי
  choice: 临到
  rationale: 这里的叙事连接形式与整句“雅威的话临到……”共同构成先知书常见的启示引介语；汉语用“临到”即可自然表达事件的发生和话语向先知而来，无须另译为“事情发生了”。
- source_word: דְבַר
  choice: 话
  rationale: 在“雅威的话”这一先知性固定表达中，“话”既保留神发言、启示的含义，也比泛化的“信息”更贴近原文。
- source_word: יְהוָה
  choice: 雅威
  rationale: 原文直接使用四字神名יהוה；“雅威”按其通常推定读音音译，保留专名性质，而不以称号替代。
- source_word: אֵלַי
  choice: 临到我
  rationale: 介词加第一人称单数词尾表示话语朝向先知而来；“临到我”是自然、庄重且符合先知书语体的现代汉语表达。
- source_word: לֵאמֹר
  choice: 说
  rationale: 该不定式用于引出随后话语的内容；译作“说”简洁自然，并以冒号承接下一节的引语。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 本节使用的是神的专名，而非“主”这一称号。正文采用“雅威”以较直接地呈现该名的通常推定读音，同时用脚注说明传统中文译法，避免混淆。
translation_notes:
  register: 采用简洁、庄重的现代标准汉语。“雅威的话临到我”保留先知书常见的启示公式；句末用冒号引出下一节内容。
