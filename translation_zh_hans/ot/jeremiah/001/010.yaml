source:
  edition: WLC
  text: רְאֵ֞ה הִפְקַדְתִּ֣י/ךָ הַ/יּ֣וֹם הַ/זֶּ֗ה עַל הַ/גּוֹיִם֙ וְ/עַל הַ/מַּמְלָכ֔וֹת לִ/נְת֥וֹשׁ וְ/לִ/נְת֖וֹץ וּ/לְ/הַאֲבִ֣יד וְ/לַ/הֲר֑וֹס לִ/בְנ֖וֹת וְ/לִ/נְטֽוֹעַ׀־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/001/010.yaml
  text: See[a], today I have appointed you over the nations and over the kingdoms, to uproot and to tear down, and to destroy and to demolish[c][b], to build and to plant.
translation:
  language: zh_hans
  text: 你看，我今日立你在列国和诸王国之上[a]，为要拔出、拆毁、毁灭、摧毁，并建造、栽植。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在列国和诸王国之上”是指耶利米受托就它们施行先知使命，并不是说他直接实行政治统治。
    reason: cultural_note
lexical_decisions:
- source_word: רְאֵה
  choice: 你看
  rationale: 这是ראה的命令式，在此用来唤起注意；“你看”自然、直接，也保留了对先知的当面呼告。
- source_word: הִפְקַדְתִּיךָ
  choice: 我委派你管理
  rationale: פקד的使役式在此表示任命并交付职责；“委派你管理”与后面的עַל相配，表达受托负责某一范围，而非自行掌权。
- source_word: הַיּוֹם הַזֶּה
  choice: 今天
  rationale: 按现代汉语习惯译为“今天”，保留任命即时生效的意味。
- source_word: עַל הַגּוֹיִם וְעַל הַמַּמְלָכוֹת
  choice: 管理列国和列国的王国
  rationale: עַל与פקד连用，较自然地表示受托管理或负责的范围。“列国的王国”保留两个名词均带定冠词的限定关系，同时脚注说明这里是先知职分，不是政治统治。
- source_word: לִנְתוֹשׁ
  choice: 拔出
  rationale: 保留连根拔除的农耕意象，并与末尾“栽植”形成对应。
- source_word: לִנְתוֹץ
  choice: 拆毁
  rationale: 表示拆除、破坏建筑物；“拆毁”简洁自然，并与下一组毁灭性动词有所区分。
- source_word: וּלְהַאֲבִיד
  choice: 毁灭
  rationale: אבד的使役式在此表示使之灭亡；“毁灭”准确而不显累赘。
- source_word: וְלַהֲרוֹס
  choice: 摧毁
  rationale: 表示推倒、破坏；“摧毁”既保留与“拆毁”的词义重叠，也呈现四个审判动词逐层累积的力度。
- source_word: לִבְנוֹת
  choice: 建造
  rationale: 直译建筑与复兴的意象。
- source_word: וְלִנְטוֹעַ
  choice: 栽植
  rationale: 直译农耕意象，并与“拔出”对应；“栽植”庄重且适用于植物及其先知性比喻。
theological_decisions:
- issue: 耶利米对列国和王国所具有的权柄性质
  choice: 译作受上帝委派而“管理”列国和列国的王国，并用脚注限定为先知职分
  alternative: 译作“论到列国和王国”或“攻击列国和王国”
  rationale: 在פקד的任命语境中，עַל可表示所负责的范围；后续不定式表明这权柄借着宣告审判与复兴来施行，而不是政治上的直接统治。正文保留“在……之上/负责”的力度，脚注避免误解。
- issue: 审判与复兴在使命中的并置
  choice: 保留四个审判动词和两个复兴动词，不合并或弱化
  alternative: 概括为“施行审判与复兴”
  rationale: 原文刻意列出“拔出、拆毁、毁灭、摧毁、建造、栽植”，其重复与张力构成先知使命的重要内容，应予保留。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。以“你看”保留呼告语气，以连续六个双音节动词呈现原文的节奏和审判—复兴结构；仅在必要处添加“为要”和“也为要”，使目的关系在汉语中清楚。
