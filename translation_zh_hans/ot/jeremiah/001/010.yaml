  terminology: “拔出、拆毁、毁灭、摧毁、建造、栽植”恰当地保留了原文四个审判动词与两个恢复动词的累积和对照；“栽植”与“拔出”尤其形成适切呼应。“诸王国”用于ממלכות，区别于“列国”所译的גוים。
