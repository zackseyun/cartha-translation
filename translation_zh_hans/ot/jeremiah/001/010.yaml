revisions:
- from: 你看，我今天委派你管理列国和列国的王国[a]，为要拔出、拆毁、毁灭、摧毁，也为要建造、栽植。
  to: 你看，我今日立你在列国和诸王国之上[a]，为要拔出、拆毁、毁灭、摧毁，并建造、栽植。
  rationale: 修订以“立你在……之上”对应正式委任和原文介词的范围表达，避免把先知使命误译为行政管理；以“列国和诸王国”准确、自然地保留两个并列群体。脚注继续说明该权柄的先知性性质，不改变正文的开放力度。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T07:22:20Z'
