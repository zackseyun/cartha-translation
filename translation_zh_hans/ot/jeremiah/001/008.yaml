id: JER.1.8
reference: Jeremiah 1:8
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: אַל תִּירָ֖א מִ/פְּנֵי/הֶ֑ם כִּֽי אִתְּ/ךָ֥ אֲנִ֛י לְ/הַצִּלֶ֖/ךָ נְאֻם יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/001/008.yaml
  text: Do not be afraid of them[a], for I am with you to deliver you[b], declares Yahweh.
translation:
  language: zh_hans
  text: 不要怕他们[a]，因为我与你同在，要搭救你[b]。这是耶和华的宣告。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“不要从他们面前惧怕”；这是一个惯用表达，意思是“不要怕他们”或“不要因他们而害怕”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“救你脱险”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּירָא
  choice: 不要怕
  rationale: אַל与未完成时动词连用，表达禁止；“不要怕”是现代汉语自然、直接的表达。
- source_word: מִפְּנֵיהֶם
  choice: 他们
  rationale: 该短语字面为“从他们面前”，与“惧怕”连用时表示惧怕的对象；汉语用“怕他们”最自然。
- source_word: כִּי
  choice: 因为
  rationale: 引出不可惧怕的理由，译作“因为”清楚体现因果关系。
- source_word: אִתְּךָ אֲנִי
  choice: 我与你同在
  rationale: 保留神亲自临在的保证，并采用庄重而通顺的现代汉语表达。
- source_word: לְהַצִּלְךָ
  choice: 要搭救你
  rationale: נצל的使役形表示救出、解救；“搭救”既体现危难中的实际救援，又不把含义限定为属灵救恩。
- source_word: נְאֻם
  choice: 这是……的宣告
  rationale: 这是先知书中庄严的神谕公式；“宣告”比普通的“说”更能保留其正式语气。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的专名“耶和华”呈现四字神名，而不以称号替代。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。中文稿保留为专名；“耶和华”在现代中文中辨识度高且庄重，“雅威”则更接近常见学术拟音。
- issue: לְהַצִּיל所指搭救的范围
  choice: 搭救
  alternative: 拯救
  rationale: 上下文是神应许在耶利米执行先知使命时救他脱离敌对者；“搭救”保留现实危难中施救的广义，不额外限定为属灵救恩。
translation_notes:
  register: 采用自然、庄重、普通读者易懂的现代标准汉语。“我与你同在”保留先知语境中的郑重安慰；末句采用“这是耶和华的宣告”，呈现原文神谕公式的正式语气。
