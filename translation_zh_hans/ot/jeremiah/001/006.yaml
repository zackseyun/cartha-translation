id: JER.1.6
reference: Jeremiah 1:6
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וָ/אֹמַ֗ר אֲהָהּ֙ אֲדֹנָ֣/י יְהֹוִ֔ה הִנֵּ֥ה לֹא יָדַ֖עְתִּי דַּבֵּ֑ר כִּי נַ֖עַר אָנֹֽכִי־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/001/006.yaml
  text: Then I said[a], “Ah, Lord Yahweh! Look, I do not know how to speak[c][b], for I am a youth.”
translation:
  language: zh_hans
  text: 我就说：“唉，主耶和华[a]啊！你看，我不知道该怎样说话[b]，因为我还年轻[c]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文是“主耶和华”，其中“耶和华”代表神名 יהוה；传统上也有译作“主上帝”的。
    reason: 说明复合神圣称号及替代译法。
  - marker: b
    text: 原文直译近于“我不知道说话”，意思是“我不知道该怎样说话”或“我不懂得说话”。
    reason: 说明希伯来语习语及其词义范围。
  - marker: c
    text: “年轻”所译的希伯来词可指孩子、少年或年轻男子，具体年龄要由上下文判断。
    reason: 保留 נַעַר 的年龄范围和词义歧义。
lexical_decisions:
- source_word: וָאֹמַר
  choice: 我就说
  rationale: 该叙事动词承接上文并推进事件；“就”自然表达先后关系，同时不增添额外因果含义。
- source_word: אֲהָהּ
  choice: 唉
  rationale: 这是表达惊惶、为难或抗拒的感叹词；“唉”在现代汉语中自然，也保留耶利米迟疑申辩的语气。
- source_word: אֲדֹנָי יְהוִה
  choice: 主耶和华
  rationale: 分别呈现 אֲדֹנָי（主）和神名 יהוה（耶和华），避免把两个成分合并为一个普通称号。
- source_word: הִנֵּה
  choice: 你看
  rationale: 该提示词引导对方注意说话者接下来的申辩；在直接对神说话的语境中，“你看”比古雅的“看哪”更符合现代汉语。
- source_word: לֹא יָדַעְתִּי דַּבֵּר
  choice: 我不知道该怎样说话
  rationale: 原文直译近于“我不知道说话”，是表示不懂得或没有能力说话的希伯来语表达；此译法既自然，又不把意思过度限定为口才差或完全不能发声。
- source_word: כִּי
  choice: 因为
  rationale: 引出耶利米认为自己不会说话的理由。
- source_word: נַעַר
  choice: 年轻
  rationale: נַעַר 可指男孩、少年或年轻男子；“年轻”保留其年龄范围，重点落在年少和经验不足，而不武断认定耶利米还是儿童。
- source_word: אָנֹכִי
  choice: 我还年轻
  rationale: 独立人称代词带有强调意味；汉语用“我还……”自然突出说话者自身年少的处境。
theological_decisions:
- issue: 复合神圣称号 אֲדֹנָי יְהוִה 中神名的译法
  choice: 主耶和华
  alternative: 主上帝
  rationale: 原文同时包含“主”和四字神名 יהוה。正文将神名音译为“耶和华”，使两个成分都清楚可见；脚注说明传统替代译法，不以普通称号悄然取代专名。
- issue: 耶利米以 נַעַר 描述自己的年龄
  choice: 我还年轻
  alternative: 我是孩子／我是少年人
  rationale: 原词涵盖从儿童到青年男子的较宽范围。上下文强调年少和缺乏经验，但没有精确交代年龄，因此不把它限定为儿童，也不据此推导更具体的神学结论。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“唉”保留申辩和迟疑的情绪；“你看”自然传达 הִנֵּה 的提示作用。句式简洁，避免古奥表达，也不把耶利米的年龄或说话能力解释得超过原文。
