base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/001/012.yaml
  text: Then Yahweh said to me[a], “You have seen well[c][b], for I am watching over my word to perform it.”
translation:
  language: zh_hans
  text: 耶和华对我说：“你看得不错[a]，因为我正警醒地留意我的话，为要使它实现[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “杏树”（上一节的 שָׁקֵד，shaqed）与本节译作“警醒地留意”的词（שֹׁקֵד，shoqed）在希伯来语中构成双关。“你看得不错”也可译作“你看得正确”。
    reason: lexical_alternative
  - marker: b
    text: “使它实现”也可译作“使它成就”或“付诸实行”。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代汉语中广为人知的神名音译，不以“主”这一称号替代原文专名。
- source_word: וַיֹּאמֶר ... אֵלַי
  choice: 对我说
  rationale: 自然表达希伯来叙事中的发言承接；本节中文无需机械译出句首连接词。
- source_word: הֵיטַבְתָּ לִרְאוֹת
  choice: 你看得不错
  rationale: 既传达“看得好、看得正确”的肯定含义，也保持自然、庄重的现代汉语。
- source_word: כִּי
  choice: 因为
  rationale: 引出耶和华肯定耶利米所见之异象的理由。
- source_word: שֹׁקֵד
  choice: 留意
  rationale: 表达警醒关注、确保落实的含义，同时不把该词过度解释为单纯“催促”；其与上一节“杏树”一词的希伯来语双关由脚注说明。
- source_word: דְּבָרִי
  choice: 我的话
  rationale: 保留单数及较宽泛的先知性话语含义，不擅自限定为“应许”或“信息”。
- source_word: לַעֲשֹׂתוֹ
  choice: 要使它实现
  rationale: 在现代汉语中自然表达神使自己所说的话付诸实现；代词“它”仍明确回指“我的话”。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威；主
  rationale: 原文使用神的专名，故不以称号“主”取代；正文采用中文读者最熟悉的音译“耶和华”，同时不赋予额外宗派含义。
- issue: דָּבָר 在先知语境中的范围
  choice: 我的话
  alternative: 我的应许；我的信息
  rationale: 原文并未将其明确限缩为应许或信息；“我的话”保留其语义广度。
- issue: 神“留意”其话的目的
  choice: 要使它实现
  alternative: 要实行它；要成就它
  rationale: 目的结构表明耶和华警醒关注自己的话，以使所言成为事实；此译法不额外规定实现的时间或方式。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“留意我的话”保留神警醒看顾、确保其话落实的意象；希伯来语双关无法在正文中自然复现，因此置于脚注。所有脚注标记均在正文中出现。
