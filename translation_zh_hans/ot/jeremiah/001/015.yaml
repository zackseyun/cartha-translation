id: JER.1.15
reference: Jeremiah 1:15
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כִּ֣י הִנְ/נִ֣י קֹרֵ֗א לְ/כָֽל מִשְׁפְּח֛וֹת מַמְלְכ֥וֹת צָפ֖וֹנָ/ה נְאֻם יְהוָ֑ה וּ/בָ֡אוּ וְֽ/נָתְנוּ֩ אִ֨ישׁ כִּסְא֜/וֹ פֶּ֣תַח שַׁעֲרֵ֣י יְרוּשָׁלִַ֗ם וְ/עַ֤ל כָּל חוֹמֹתֶ֨י/הָ֙ סָבִ֔יב וְ/עַ֖ל כָּל עָרֵ֥י יְהוּדָֽה׀־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/001/015.yaml
  text: For behold[a], I am calling all the clans of the kingdoms of the north, declares Yahweh, and they will come, and each will set his throne at the entrance of the gates of Jerusalem, against all her walls all around[b], and against all the cities of Judah.
translation:
  language: zh_hans
  text: 因为，看哪，我正召集北方诸国的一切宗族[a]，这是雅威的宣告；他们必来，各自在耶路撒冷城门的入口处安设自己的宝座[b]，对着城四围所有的城墙，并对着犹大所有的城邑。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “宗族”也可译作“家族”或“各族”；希伯来语可指扩展家庭、氏族等社会群体。
    reason: lexical_alternative
  - marker: b
    text: “各自……安设自己的宝座”描绘入侵的统治者在耶路撒冷城门前占据权威和审判的位置。
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上一节，为即将临到的灾祸提供解释；中文用“因为”清楚表达篇章关系。
- source_word: הִנְנִי קֹרֵא
  choice: 看哪，我正在召集
  rationale: “看哪”保留提示注意和强调的语气；分词配合代词结构表达神当前正在展开、即将见效的行动。“召集”比一般的“呼叫”更能体现权威性征召。
- source_word: לְכָל מִשְׁפְּחוֹת מַמְלְכוֹת צָפוֹנָה
  choice: 北方诸国的各族
  rationale: 保留“诸国”的复数，并以“各族”表达 מִשְׁפְּחוֹת 所指的宗族、氏族等社会群体，避免“家庭”过于家居化。
- source_word: נְאֻם יְהוָה
  choice: 雅威宣告
  rationale: 以庄重而自然的先知公式表达，并按项目惯例直接音译神名。
- source_word: וּבָאוּ
  choice: 他们必来
  rationale: 上下文指受召的北方势力将要来到；“必”兼顾预告的确定性。
- source_word: וְנָתְנוּ אִישׁ כִּסְאוֹ
  choice: 各自……设立宝座
  rationale: אִישׁ 在此作逐一分配用法；“各自”自然表达其含义。“宝座”保留王权及审判意象。
- source_word: פֶּתַח שַׁעֲרֵי יְרוּשָׁלִַם
  choice: 在耶路撒冷城门入口处
  rationale: 保留 פֶּתַח 的“入口”含义，也反映 שַׁעֲרֵי 的复数整体概念。
- source_word: וְעַל כָּל חוֹמֹתֶיהָ סָבִיב
  choice: 攻击四围所有的城墙
  rationale: 军事语境中 עַל 表示敌对趋向，译为“攻击”；“四围”保留 סָבִיב 所含的环绕、包围意味。
- source_word: וְעַל כָּל עָרֵי יְהוּדָה
  choice: 以及犹大的所有城邑
  rationale: 与前面的“攻击”共同构成谓语关系；“城邑”庄重且适合指犹大境内各城。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；“雅威”较直接地呈现该专名，而不以称号替代。
- issue: 各自设立宝座的意象
  choice: 保留“宝座”，不在正文中解释为围城指挥座或审判席
  alternative: 各自设立座位；各自占据审判席
  rationale: 原文的 כִּסְאוֹ 可承载王权、统治和审判等多重意涵；正文保留意象，脚注说明其军事政治语境，以免过度限定。
- issue: עַל 在城墙和城邑前的关系
  choice: 译作“攻击”
  alternative: 临到；在……之上
  rationale: 上下文是北方势力进犯耶路撒冷和犹大，敌对意义最符合语境；但不把具体行动收窄为某一种围城战术。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。保留“看哪”的先知性提示语和“宝座”的原文意象；句法适度调整，以避免逐词直译造成的生硬，同时保持北方诸国、各族、城门、四围城墙和犹大诸城的范围层次。
