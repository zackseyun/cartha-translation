source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֵלַ֔/י אַל תֹּאמַ֖ר נַ֣עַר אָנֹ֑כִי כִּ֠י עַֽל כָּל אֲשֶׁ֤ר אֶֽשְׁלָחֲ/ךָ֙ תֵּלֵ֔ךְ וְ/אֵ֛ת כָּל אֲשֶׁ֥ר אֲצַוְּ/ךָ֖ תְּדַבֵּֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/001/007.yaml
  text: But Yahweh said to me[a], “Do not say, ‘I am a youth,’ for to all to whom I send you, you shall go, and all that I command you[b], you shall speak.”
translation:
  language: zh_hans
  text: 但耶和华对我说：“不要说‘我年纪轻[a]’，因为无论我差你到谁那里去[b]，你都要去；我吩咐你说什么，你就说什么。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“我是个青年”“我是个孩子”。希伯来语 נַעַר 可表示不同程度的年幼、年轻或缺乏阅历。
    reason: lexical_alternative
  - marker: b
    text: 或译“无论我差你到哪里”。这句希伯来语既可理解为耶和华差耶利米去面对的每一个人，也可较概括地指他奉差前往的每个地方或承担的每项任务。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 但……说
  rationale: אמר在叙事中通常译为“说”；结合上一节耶利米的推辞，句首用“但”自然表达上下文的转折。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文读者熟悉的专名形式呈现四字神名，避免将其仅作为称号译成“主”。
- source_word: אַל תֹּאמַר
  choice: 不要说
  rationale: אַל加未完成式在此构成禁止语气，“不要说”准确、自然。
- source_word: נַעַר
  choice: 年轻
  rationale: נַעַר可指男孩、青年，也可突出年轻和阅历不足；此处译作状态性的“年轻”，与אָנֹכִי所构成的“我年轻”在中文中自然，并保留年龄范围的不确定性。
- source_word: עַל כָּל אֲשֶׁר אֶשְׁלָחֲךָ
  choice: 无论我差你到谁那里
  rationale: 保留该表达可能以受差遣对象为重点的理解，同时用“无论……都……”传达כָּל的周全范围；地点性的理解列入脚注。
- source_word: תֵּלֵךְ
  choice: 你都要去
  rationale: 此处未完成式处于神圣差遣语境，带有命令性；“要去”比单纯将来时“会去”更合适。
- source_word: וְאֵת כָּל אֲשֶׁר אֲצַוְּךָ
  choice: 凡我吩咐你的
  rationale: “凡”保留כָּל的全面含义，“吩咐”准确表达צוה的权威性。
- source_word: תְּדַבֵּר
  choice: 你都要说
  rationale: 在先知受差遣传话的语境中，“说”自然准确，并与前句“你都要去”形成平行。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威；主
  rationale: 原文直接使用四字神名。正文采用中文传统中最为人熟悉的专名“耶和华”，既将其作为名字呈现，也避免以“主”取代原文神名。
- issue: 先知使命的权威性
  choice: “你都要去……你都要说”
  alternative: “你都会去……你都会说”
  rationale: 上下文不仅预告耶利米将来的行动，也表达耶和华对受差先知的命令，因此采用带命令意味的“要”，但不额外扩展为绝对顺服的神学论断。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。保留“去／说”的平行结构和神圣差遣的权威语气；不加入原文没有的“只是”“不过”等自轻意味。标点按现代简体中文规范处理。
