- from: 但耶和华对我说：“不要说‘我年轻[a]’，因为无论我差你到谁那里[b]，你都要去；凡我吩咐你的，你都要说。”
  to: 但耶和华对我说：“不要说‘我年纪轻[a]’，因为无论我差你到谁那里去[b]，你都要去；我吩咐你说什么，你就说什么。”
  rationale: 修订仅处理现代汉语表达与句法清晰度。“我年纪轻”避免不必要地界定耶利米的具体年龄；脚注继续呈现“青年／孩子”等可能译法。对于“差遣”的对象／目的地这一存在讨论的表达，正文保留受差对象的读法，脚注保留地点或任务范围的替代读法。末句以汉语常用的“说什么……就说什么”重现原文“凡……都……”的全面性与使命性的平行结构。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T07:22:37Z'
