language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/דִבַּרְתִּ֤י מִשְׁפָּטַ/י֙ אוֹתָ֔/ם עַ֖ל כָּל רָעָתָ֑/ם אֲשֶׁ֣ר עֲזָב֗וּ/נִי וַֽ/יְקַטְּרוּ֙ לֵ/אלֹהִ֣ים אֲחֵרִ֔ים וַ/יִּֽשְׁתַּחֲו֖וּ לְ/מַעֲשֵׂ֥י יְדֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/001/016.yaml
  text: And I will pronounce my judgments against them for all their evil[a], because they have forsaken me, burned incense to other gods[b], and bowed down to the works of their own hands.
translation:
  language: zh_hans
  text: 我要就他们所行的一切恶，向他们宣告我的审判[a]：他们离弃我，向别神烧香，又向自己亲手所造之物下拜[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我要就他们所行的一切恶，向他们说出我的审判。”希伯来语动词的字面意思是“说”，但在这里很可能指正式宣判。
    reason: lexical_alternative
  - marker: b
    text: “自己亲手所造之物”指他们自己制造的偶像。
    reason: cultural_note
lexical_decisions:
- source_word: וְדִבַּרְתִּי מִשְׁפָּטַי אוֹתָם
  choice: 向他们宣告我的判决
  rationale: דבר 的字面义是“说”，但与 מִשְׁפָּטַי 连用并置于审判语境中，表达正式宣告司法判决。“宣告我的判决”既保留言说行为，也体现法律语气；אוֹתָם 按现代汉语关系译作“向他们”。
- source_word: עַל כָּל רָעָתָם
  choice: 因他们所行的一切恶
  rationale: עַל 在此说明判决的根据。“恶”保留 רָעָה 较宽泛的道德含义；补出“所行”使现代汉语自然，但不把罪行限定为某一种具体形式。
- source_word: אֲשֶׁר עֲזָבוּנִי
  choice: 因为他们离弃我
  rationale: אֲשֶׁר 在此引出控告的内容和缘由，译为“因为”可清楚表达因果关系；“离弃”传达 עזב 在先知性责备中的关系与盟约分量。
- source_word: וַיְקַטְּרוּ לֵאלֹהִים אֲחֵרִים
  choice: 向别神烧香
  rationale: קטר 的加强词干在偶像崇拜语境中通常指焚香或献烟祭。“烧香”简洁明确；“别神”保留原文的盟约性措辞。
- source_word: וַיִּשְׁתַּחֲווּ
  choice: 跪拜
  rationale: 该词表示俯伏、下拜。“跪拜”保留可见的身体动作，同时让敬拜含义由上下文显明，避免直接概括为“敬拜”。
- source_word: לְמַעֲשֵׂי יְדֵיהֶם
  choice: 向自己亲手所造的
  rationale: 这一表达直指他们双手制造之物。“自己亲手所造的”在现代汉语中自然地保留原文的反讽；中心名词在汉语中可由“所造的”代替，脚注说明其所指。
theological_decisions:
- issue: וְדִבַּרְתִּי מִשְׁפָּטַי 所表达的神圣行动
  choice: 上帝正式向他们宣告判决
  alternative: 上帝只是与他们谈论自己的典章，或仅强调执行审判而不强调宣告
  rationale: דבר 与 משפטים 在这一先知审判语境中的搭配具有法庭式宣判的意味。译文同时保留“宣告”这一言说行动和“判决”这一司法含义，不引入后来的教义范畴。
- issue: 偶像崇拜行为的呈现方式
  choice: 分别保留离弃、向别神烧香和向亲手所造之物跪拜三项具体行为
  alternative: 概括译为“他们敬拜偶像”
  rationale: 原文逐项列举对上帝的背弃及具体崇拜行为；保留这些细节可呈现控告的层次，并维持“亲手制造却向其跪拜”的先知性反讽。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“宣告我的判决”保留法庭和先知宣告的语气；“别神”“离弃”“跪拜”清楚易懂，又不过度口语化。句法依照现代汉语调整，将审判根据置于主要动作之前，同时保留原文三项控告的次序。
