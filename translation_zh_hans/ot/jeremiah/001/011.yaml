id: JER.1.11
reference: Jeremiah 1:11
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יְהִ֤י דְבַר יְהוָה֙ אֵלַ֣/י לֵ/אמֹ֔ר מָה אַתָּ֥ה רֹאֶ֖ה יִרְמְיָ֑הוּ וָ/אֹמַ֕ר מַקֵּ֥ל שָׁקֵ֖ד אֲנִ֥י רֹאֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/001/011.yaml
  text: And the word of Yahweh came to me[a], saying, “What do you see, Jeremiah?” And I said, “I see a branch of an almond tree.”
translation:
  language: zh_hans
  text: 雅威的话临到我说：“耶利米，你看见什么？”我说：“我看见一根杏树枝[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“杏木杖”。希伯来语 מַקֵּל 既可指树枝，也可指棍或杖；“杏树”（shaqed）与下一节的“留意察看”（shoqed）构成谐音双关。
    reason: 保留词义歧义，并提示跨节的希伯来语文字游戏。
lexical_decisions:
- source_word: וַיְהִי דְבַר יְהוָה אֵלַי
  choice: 雅威的话临到我
  rationale: 采用汉语先知书中自然、庄重的启示公式；“话”保留 דָּבָר 与先知蒙召叙事的形式联系，“临到”表达话语主动来到先知那里。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见音译呈现四字神名，而不以“主”这一称号替代。
- source_word: לֵאמֹר
  choice: 说
  rationale: 自然引出后面的直接引语，同时保留希伯来语的话语结构。
- source_word: מָה אַתָּה רֹאֶה
  choice: 你看见什么
  rationale: 以现代汉语直接问句自然表达分词所指的当下视觉经验。
- source_word: יִרְמְיָהוּ
  choice: 耶利米
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: מַקֵּל שָׁקֵד
  choice: 一根杏树枝
  rationale: מַקֵּל 可指枝条、棍或杖；在异象中的树木意象下，“杏树枝”自然清楚，但以脚注保留“杏木杖”的可能性。量词“一根”符合现代汉语表达。
- source_word: אֲנִי רֹאֶה
  choice: 我看见
  rationale: 简洁自然地表达回答；希伯来语显明的主语代词由汉语“我”体现。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名；“雅威”以音译保留其作为以色列之神专名的性质，避免用称号“主”取代。
- issue: 异象物件 מַקֵּל 的具体形态
  choice: 正文译作“树枝”，脚注保留“杖”的可能
  alternative: 杏木杖
  rationale: 语境不足以绝对确定它是仍呈树枝形态，还是用杏木制成的杖；正文采用较符合树木异象的自然表达，同时不消除原文歧义。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。保留先知启示公式和神名；对 מַקֵּל 的真实歧义不在正文中强行消解，而以脚注说明。
