  text: וַ/יִּשְׁלַ֤ח יְהוָה֙ אֶת יָד֔/וֹ וַ/יַּגַּ֖ע עַל פִּ֑/י וַ/יֹּ֤אמֶר יְהוָה֙ אֵלַ֔/י הִנֵּ֛ה נָתַ֥תִּי דְבָרַ֖/י בְּ/פִֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/001/009.yaml
  text: Then the LORD stretched out his hand and touched my mouth, and the LORD said to me, “Look, I have put my words in your mouth.”
translation:
  language: zh_hans
  text: 于是，耶和华伸出手来，触碰我的口。耶和华对我说：“看，我已把我的话放在你口中。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的专名译法，明确对应希伯来文神名。
- source_word: וַיִּשְׁלַח ... אֶת־יָדוֹ
  choice: 伸出手来
  rationale: 自然、准确地表达伸手这一动作，同时保留叙事的具体形象。
- source_word: וַיַּגַּע עַל־פִּי
  choice: 触碰我的口
  rationale: 保留 נגע 的直接动作意义；介词 עַל 在此按自然汉语表达为动作所及的对象。
- source_word: הִנֵּה
  choice: 看
  rationale: 保留提示听者注意的语用功能，措辞简明且符合现代汉语。
- source_word: נָתַתִּי דְבָרַי בְּפִיךָ
  choice: 我已把我的话放在你口中
  rationale: 贴近原文完成体及其授予话语的具体意象，不将复数形式所涵盖的话语内容抽象化。
theological_decisions:
- issue: 耶和华把自己的话放在先知口中所表达的先知权柄
  choice: 按原文直译为“我已把我的话放在你口中”
  alternative: 解释性译为“我已授权你替我说话”
  rationale: 保留神主动赐下话语的原文意象，不额外界定默示或先知职分的具体教义机制。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“于是”承接前文叙事；两句分开处理，使神的动作与随后的宣告清楚有力。
