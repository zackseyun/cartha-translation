  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/אֲנִ֞י הִנֵּ֧ה נְתַתִּ֣י/ךָ הַ/יּ֗וֹם לְ/עִ֨יר מִבְצָ֜ר וּ/לְ/עַמּ֥וּד בַּרְזֶ֛ל וּ/לְ/חֹמ֥וֹת נְחֹ֖שֶׁת עַל כָּל הָ/אָ֑רֶץ לְ/מַלְכֵ֤י יְהוּדָה֙ לְ/שָׂרֶ֔י/הָ לְ/כֹהֲנֶ֖י/הָ וּ/לְ/עַ֥ם הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/001/018.yaml
  text: And I—behold[a], I have made you today a fortified city, an iron pillar, and bronze walls against the whole land—against the kings of Judah, its officials, its priests[b], and the people of the land.
translation:
  language: zh_hans
  text: 至于我，看哪，我今日使你成为[a]一座坚固城、一根铁柱和铜墙，面对全地——面对犹大的君王、官长、祭司和这地的百姓[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我今日设立你作坚固城”。原文动词本义为“给、放置、设立”，在这里表达上帝委任耶利米，使他如同坚固的防御工事。
    reason: lexical_alternative
  - marker: b
    text: “这地的百姓”在某些语境中可特指与统治者相对的普通民众；这里也可能较广泛地指当地民众整体。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: 至于我
  rationale: 连词加独立代词带有强调和前景化作用；“至于我”保留这种突出语气，又不强行将其解释为转折。
- source_word: הִנֵּה
  choice: 看哪
  rationale: 保留指示、唤起注意和庄严强调的语气，适合先知蒙召的语境。
- source_word: נְתַתִּיךָ
  choice: 使你成为
  rationale: נתן本义为“给、放置、设立”，在后接多个以לְ引出的表语时，表达使耶利米成为或设立他作某种角色；“使你成为”在现代汉语中自然，并保留比喻性的委任。
- source_word: הַיּוֹם
  choice: 今日
  rationale: 准确表达时间上的即时性；“今日”比“今天”略庄重，但仍是现代读者熟悉的表达。
- source_word: לְעִיר מִבְצָר
  choice: 坚固城
  rationale: לְ在此标示结果或表语；“坚固城”直接呈现防御性堡垒的比喻。
- source_word: וּלְעַמּוּד בַּרְזֶל
  choice: 铁柱
  rationale: 简洁、直译，并自然传达坚不可摧的形象。
- source_word: וּלְחֹמוֹת נְחֹשֶׁת
  choice: 铜墙
  rationale: נְחֹשֶׁת可指铜或青铜；“铜墙”是自然而有力的汉语意象。汉语名词在此无需以生硬形式标出希伯来文复数。
- source_word: עַל כָּל הָאָרֶץ
  choice: 抵挡全地
  rationale: 上下文中的עַל表示面对或敌对；“全地”保留אֶרֶץ的用语，而后面的犹大各群体限定其所指范围。
- source_word: לְמַלְכֵי יְהוּדָה
  choice: 抵挡犹大的众王
  rationale: לְ在此承接前面的敌对关系，列明耶利米所要面对的人；“众王”保留复数。
- source_word: לְשָׂרֶיהָ
  choice: 其中的官长
  rationale: שׂרים指掌权的官员或首领；“官长”兼顾古代政治身份与中文圣经语体，代词所指承接犹大之地。
- source_word: לְכֹהֲנֶיהָ
  choice: 祭司
  rationale: כֹּהֲנִים的标准对应词。
- source_word: וּלְעַם הָאָרֶץ
  choice: 这地的百姓
  rationale: 保留固定短语的字面形态，不预先限定为“平民”；在此也可能概括犹大其余民众。
theological_decisions:
- issue: “全地”的范围
  choice: 译作“全地”，并由下文犹大的众王、官长、祭司和百姓限定为犹大之地
  alternative: 全世界／全地球
  rationale: אֶרֶץ可指“地、土地、国土”或“世界”，但紧接着列出的群体全属犹大，表明这里主要是地方或国家范围；不应把使命范围扩大为全世界。
- issue: 耶利米与犹大众人的关系
  choice: 译作“抵挡”，呈现先知如防御工事般面对全地的冲突处境
  alternative: 在全地之上／向着全地
  rationale: עַל本身有一定语义范围，但下一节明确说众人要攻击耶利米，因此本节的敌对、对抗意味较强；“抵挡”既符合比喻，也不暗示先知主动施暴。
translation_notes:
  register: 采用自然、庄重而可理解的现代标准汉语。“看哪”“今日”“官长”保留先知文本的肃穆感，但整体句法现代清晰。用“就是”引出“全地”的具体组成，帮助读者把握希伯来文同位说明关系；不把“这地的百姓”过早收窄为某一社会阶层。
