  text: וַ/יְהִ֗י בִּ/ימֵ֨י יְהוֹיָקִ֤ים בֶּן יֹאשִׁיָּ֨הוּ֙ מֶ֣לֶךְ יְהוּדָ֔ה עַד תֹּם֙ עַשְׁתֵּ֣י עֶשְׂרֵ֣ה שָׁנָ֔ה לְ/צִדְקִיָּ֥הוּ בֶן יֹאשִׁיָּ֖הוּ מֶ֣לֶךְ יְהוּדָ֑ה עַד גְּל֥וֹת יְרוּשָׁלִַ֖ם בַּ/חֹ֥דֶשׁ הַ/חֲמִישִֽׁי־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/001/003.yaml
  text: And it continued in the days of Jehoiakim son of Josiah[a], king of Judah, until the completion of the eleventh year of Zedekiah son of Josiah, king of Judah[b], until the exile of Jerusalem in the fifth month.
translation:
  language: zh_hans
  text: 耶和华的话又在犹大王约西亚的儿子约雅敬在位的年间临到耶利米；一直到犹大王约西亚的儿子西底家在位第十一年届满，直到耶路撒冷被掳[a]的第五个月。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “耶路撒冷被掳”指耶路撒冷陷落时，城中居民遭放逐。
    reason: cultural_note
lexical_decisions:
- source_word: וַיְהִי
  choice: 这话也临到耶利米
  rationale: 承接上一节“耶和华的话临到他”，表达这话在随后时期继续临到耶利米；补出上下文中的主语和受词，使现代汉语清楚自然。
- source_word: בִּימֵי
  choice: 在……在位的年间
  rationale: 原义为“在……的日子”；这里用于君王纪年，译作“在位的年间”更符合现代汉语，同时保留时间跨度。
- source_word: יְהוֹיָקִים
  choice: 约雅敬
  rationale: 采用现代中文圣经中通行的人名译法。
- source_word: בֶּן יֹאשִׁיָּהוּ
  choice: 约西亚的儿子
  rationale: 直接保留父子关系的称谓。
- source_word: מֶלֶךְ יְהוּדָה
  choice: 犹大王
  rationale: 按现代汉语习惯表达王室头衔。
- source_word: עַד תֹּם
  choice: 一直到……届满
  rationale: תֹּם表示达到完整的终点；“届满”既传达完成之意，又适合王年纪时。
- source_word: עַשְׁתֵּי עֶשְׂרֵה שָׁנָה לְצִדְקִיָּהוּ
  choice: 西底家在位第十一年
  rationale: לְ在此标示西底家的王年；译成中文通行的纪年格式。
- source_word: גְּלוֹת יְרוּשָׁלִַם
  choice: 耶路撒冷被掳
  rationale: 原文以城市代指其居民遭迁徙的事件；保留其简练的转喻表达，并以脚注说明。
- source_word: בַּחֹדֶשׁ הַחֲמִישִׁי
  choice: 五月
  rationale: 直译为“第五个月”；在上下文的古代历法纪月中，中文自然表达为“五月”，并不等同于现代公历五月。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。以“这话也临到耶利米”承接上一节，避免把וַיְהִי孤立地译成生硬的“事情发生了”；重复“一直到……直到……”以保留原文两个עַד所形成的时间推进。
