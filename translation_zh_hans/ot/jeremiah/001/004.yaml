  text: וַ/יְהִ֥י דְבַר יְהוָ֖ה אֵלַ֥/י לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/001/004.yaml
  text: The word of Yahweh came to me[a], saying,
translation:
  language: zh_hans
  text: 雅威[a]的话临到我，说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文为 YHWH，汉语传统译作“耶和华”；此处译作“雅威”。
    reason: 说明神名的原文形式及常见替代译法。
lexical_decisions:
- source_word: וַיְהִי
  choice: 临到
  rationale: 该形式推动叙事发展，并与后面的“雅威的话”共同构成先知书常见的启示公式。汉语用“临到”自然表达信息从神而来，无须另加原文没有明确表达的“现在”。
- source_word: דְבַר
  choice: 话
  rationale: 在“雅威的话”这一先知性公式中，“话”既贴近原文，又保留神启示和宣告的含义；“信息”虽可通顺，却较少保留原词的形式联系。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以常见的现代汉语音译呈现四字神名 YHWH，使专名性质清楚可见，而不以称号代替。
- source_word: אֵלַי
  choice: 我
  rationale: 前置词 אֶל 加第一人称单数后缀意为“向我／到我这里”；在“话临到我”中译为“我”符合现代汉语搭配。
- source_word: לֵאמֹר
  choice: 说
  rationale: 该不定式常用来引出后续直接引语；“说”简洁保留希伯来语公式，并为下一节的引语作准备。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名 YHWH。正文采用“雅威”以呈现其专名性质，同时在脚注注明汉语传统译名“耶和华”，不把神名改译为称号。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“雅威的话临到我”保留先知书启示公式；句末用冒号自然引出下一节的直接引语。
