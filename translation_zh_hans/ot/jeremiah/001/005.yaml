source:
  edition: WLC
  text: בְּ/טֶ֨רֶם אצור/ך בַ/בֶּ֨טֶן֙ יְדַעְתִּ֔י/ךָ וּ/בְ/טֶ֛רֶם תֵּצֵ֥א מֵ/רֶ֖חֶם הִקְדַּשְׁתִּ֑י/ךָ נָבִ֥יא לַ/גּוֹיִ֖ם נְתַתִּֽי/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/001/005.yaml
  text: Before I formed you in the womb[a], I knew you, and before you came out from the womb, I set you apart[b]; I appointed you as a prophet to the nations.
translation:
  language: zh_hans
  text: “我尚未在母腹中塑造你，我已经认识你[a]；你尚未从母腹出来，我已经使你分别为圣[b]；我立你作列国的先知。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “认识”在这里也可能含有亲自眷顾或拣选的意味；正文保留原词较宽广的表达。
    reason: lexical_alternative
  - marker: b
    text: 或译：“我将你分别出来。”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּטֶרֶם
  choice: 还未……就已经
  rationale: 该时间词表示“在……以前”。结合两个分句，用“还未……就已经”自然地保留行动发生在先的强调，但不额外扩大其含义。
- source_word: אצור/ך（יצר）
  choice: 塑造你
  rationale: יצר常指像工匠一样塑造、形成。“塑造”保留具体意象，也比泛化的“创造”更贴近原词。
- source_word: בַבֶּטֶן
  choice: 在母腹中
  rationale: בטן可指腹部，也可在产前语境中指母腹；此处“母腹”准确而自然。
- source_word: יְדַעְתִּיךָ（ידע）
  choice: 认识你
  rationale: ידע的基本义是“认识、知道”，在此也可能包含亲自眷顾或拣选的意味。正文保留宽广的“认识”，不把含义收窄为“拣选”。
- source_word: תֵּצֵא מֵרֶחֶם
  choice: 出母胎
  rationale: 原文直译为“从子宫出来”，指人的出生。“出母胎”既保留具体表达，又符合庄重的现代汉语。
- source_word: הִקְדַּשְׁתִּיךָ（קדש，Hiphil）
  choice: 将你分别出来
  rationale: 该使役形式表示使之圣洁或为神圣用途分别出来。正文采用较易懂的表达，脚注保留“使你分别为圣”这一更明确的译法。
- source_word: נָבִיא
  choice: 先知
  rationale: 这是该词在此语境中的标准对应词。
- source_word: לַגּוֹיִם
  choice: 列国的
  rationale: גוים指各国、万邦。“列国”保留超越犹大的范围；与“先知”连用时，“列国的先知”是简洁自然的汉语，也不限定为后期术语“外邦人”。
- source_word: נְתַתִּיךָ（נתן）
  choice: 我立你作
  rationale: נתן本义为“给、置于”，在委任语境中可表示设立或任命。“立你作”自然表达神所赋予的先知职分。
theological_decisions:
- issue: “我认识你”（יְדַעְתִּיךָ）是否应直接译为预知或拣选
  choice: 正文译作“我认识你”，并以脚注说明其关系性及拣选意味的可能性。
  alternative: “我拣选你”或“我眷顾你”
  rationale: 原文使用ידע，而不是一个只表示“拣选”的动词。上下文确有呼召和委任的意味，但译文不应把该词丰富而开放的含义缩减成单一教义解释。
- issue: הִקְדַּשְׁתִּיךָ的圣洁及奉献含义
  choice: 正文译作“将你分别出来”。
  alternative: “使你分别为圣”或“使你归圣”
  rationale: “分别出来”便于普通读者理解其为特定使命而被划分出来的意思；脚注补出“分别为圣”，使原词的神圣用途含义不被遮蔽。
- issue: 先知使命与“列国”的关系
  choice: 译作“我立你作列国的先知”。
  alternative: “我任命你向列国作先知”或“我立你作给列国的先知”
  rationale: 介词ל可表达面向或关乎列国的使命。简洁译法保留其范围，不进一步规定耶利米对列国履职的具体方式。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“塑造”保留工匠塑形的意象；“母腹”“母胎”保持诗性平行而不显古奥；“立你作列国的先知”以简洁句式呈现正式的神圣委任。脚注标记均置于其所说明的词语之后。
