revisions:
- from: “我还未在母腹中塑造你，就已经认识你[a]；你还未出母胎，我就已将你分别出来[b]。我立你作列国的先知。”
  to: “我尚未在母腹中塑造你，我已经认识你[a]；你尚未从母腹出来，我已经使你分别为圣[b]；我立你作列国的先知。”
  rationale: 修订“分别出来”为“分别为圣”，以明确保留原文的归圣、奉献含义，并将其较宽泛的“分别”表达置于脚注。同步调整时间句式和“从母腹出来”的表达，使中文更自然，同时维持原文具体的出生意象、平行结构与使命范围。
