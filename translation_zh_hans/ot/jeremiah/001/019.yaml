id: JER.1.19
reference: Jeremiah 1:19
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/נִלְחֲמ֥וּ אֵלֶ֖י/ךָ וְ/לֹא י֣וּכְלוּ לָ֑/ךְ כִּֽי אִתְּ/ךָ֥ אֲנִ֛י נְאֻם יְהוָ֖ה לְ/הַצִּילֶֽ/ךָ־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/001/019.yaml
  text: They will fight against you[a], but they will not prevail against you, for I am with you, declares Yahweh[c][b], to deliver you.
translation:
  language: zh_hans
  text: 他们要攻击你，却不能胜过你，因为我与你同在，要搭救你。这是耶和华[a]的宣告。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “耶和华”对应希伯来文神名 YHWH，也常译作“雅威”。
    reason: 说明四字神名及中文常见替代译法。
lexical_decisions:
- source_word: וְנִלְחֲמוּ אֵלֶיךָ
  choice: 他们要攻击你
  rationale: נלחם 与 אֶל 连用表示敌对行动；“攻击你”在现代汉语中自然明确，又不把冲突夸大为全面战争。
- source_word: וְלֹא יוּכְלוּ לָךְ
  choice: 却不能胜过你
  rationale: יכל 加 ל 在此表示对手无法成功制伏耶利米；“不能胜过你”保留保护应许，同时不暗示他不会经历苦难。
- source_word: כִּי אִתְּךָ אֲנִי
  choice: 因为我与你同在
  rationale: 直译并保留先知书中上帝同在保证的神学分量。
- source_word: נְאֻם יְהוָה
  choice: 这是耶和华的宣告
  rationale: נְאֻם 标明权威性的神谕；调整至句末，形成庄重而自然的现代汉语表达。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经传统中最通行的专名形式，并以脚注说明其对应希伯来文四字神名。
- source_word: לְהַצִּילֶךָ
  choice: 要搭救你
  rationale: נצל 的使役式表示从危险或敌手手中救出；“搭救”具体贴切，也避免在此过度引入更广泛的救赎含义。
theological_decisions:
- issue: 上帝保护应许的力度
  choice: 却不能胜过你
  alternative: 却不能伤害你
  rationale: 原文应许敌人不能最终成功胜过耶利米，并未承诺他完全不受攻击或苦难，因此不将其强化为“不能伤害你”。
- issue: 神名 יהוה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: “耶和华”是简体中文普通读者最熟悉且可识别的神名形式；脚注保留原文为 YHWH 的信息，不把它仅处理为称号“主”。
- issue: לְהַצִּילֶךָ 与同在保证的关系
  choice: 因为我与你同在，要搭救你
  alternative: 因为我与你同在，必搭救你
  rationale: 保留目的式“要搭救你”的结构，不额外添加原文没有明示的强调副词“必”。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。“攻击”表达敌对行动，“胜过”保留对手最终不能得逞的含义；将“这是耶和华的宣告”置于句末，使话语层次符合自然汉语，同时保留先知宣告公式。
