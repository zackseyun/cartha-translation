base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/001/002.yaml
  text: to whom the word of Yahweh came in the days of Josiah son of Amon, king of Judah, in the thirteenth year of his reign.
translation:
  language: zh_hans
  text: 犹大王亚们的儿子约西亚在位第十三年，耶和华的话临到他。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲשֶׁר ... אֵלָיו
  choice: ……临到他
  rationale: 关系从句承接上一节的耶利米；汉语不必硬译关系代词，用“临到他”自然保留指向。
- source_word: הָיָה דְבַר יְהוָה אֵלָיו
  choice: 耶和华的话临到他
  rationale: 这是先知书中常见的启示公式；“临到”兼顾原文“发生／来到”的表达和现代汉语的庄重自然。
- source_word: דְבַר יְהוָה
  choice: 耶和华的话
  rationale: “话”比“信息”更直接保留 דָּבָר 的言说与启示意味。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代简体中文圣经传统中最通行、易辨识的神名音译，不以称号“主”替代专名。
- source_word: בִּימֵי יֹאשִׁיָּהוּ
  choice: 在……约西亚执政期间
  rationale: בִּימֵי 字面为“在……的日子”；用于君王年代时译作“执政期间”更符合现代汉语。
- source_word: בֶן אָמוֹן
  choice: 亚们的儿子
  rationale: 直接保留谱系身份说明。
- source_word: מֶלֶךְ יְהוּדָה
  choice: 犹大王
  rationale: 采用自然简洁的中文王号表达。
- source_word: בִּשְׁלֹשׁ עֶשְׂרֵה שָׁנָה לְמָלְכוֹ
  choice: 约西亚在位第十三年
  rationale: 原文按君王统治年数纪年；补出“约西亚”可消除中文代词指向可能造成的歧义。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用四字神名而非称号；正文保留专名。中文采用广为读者熟悉的“耶和华”，同时不以“主”取代。
translation_notes:
  register: 采用现代、庄重且易懂的普通话书面语。经文承接1:1，因此保留“他”指耶利米；后半句用“就是”明确第十三年是对“执政期间”的进一步限定。
