id: JER.1.17
reference: Jeremiah 1:17
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/אַתָּה֙ תֶּאְזֹ֣ר מָתְנֶ֔י/ךָ וְ/קַמְתָּ֙ וְ/דִבַּרְתָּ֣ אֲלֵי/הֶ֔ם אֵ֛ת כָּל אֲשֶׁ֥ר אָנֹכִ֖י אֲצַוֶּ֑/ךָּ אַל תֵּחַת֙ מִ/פְּנֵי/הֶ֔ם פֶּֽן אֲחִתְּ/ךָ֖ לִ/פְנֵי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/001/017.yaml
  text: But you[a], gird up your loins, and arise and speak to them all that I command you. Do not be dismayed before them, lest I dismay you before them.
translation:
  language: zh_hans
  text: 至于你，要束紧腰带[a]，起来，把我所吩咐你的一切都告诉他们。不要在他们面前惊惶，免得我使你在他们面前惊惶。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语惯用语，指束紧腰间的衣服，准备行动。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתָּה
  choice: 至于你
  rationale: 突出话语转向和对耶利米本人的直接委任；比单纯译作“而你”更符合现代汉语，又不过度加强为明显的转折。
- source_word: תֶּאְזֹר מָתְנֶיךָ
  choice: 束紧腰带
  rationale: 保留希伯来语为行动束紧腰间衣服的具体意象，同时用现代读者易懂的表达呈现；脚注说明其惯用含义。
- source_word: וְקַמְתָּ
  choice: 起来
  rationale: 此处连续动词带有命令和差遣意味；“起来”自然、庄重，并保留行动性的召命语气。
- source_word: וְדִבַּרְתָּ אֲלֵיהֶם
  choice: 告诉他们
  rationale: דבר אל 基本义是向某人说话；结合后接信息内容，译为“告诉他们”在现代汉语中更自然，且不增添“宣告”等原文未必要求的强度。
- source_word: אֵת כָּל אֲשֶׁר אָנֹכִי אֲצַוֶּךָּ
  choice: 我所吩咐你的一切
  rationale: 体现耶利米必须完整传达上帝命令的要求；“所吩咐……的一切”庄重而流畅，不强行限定未完成式的时间指向。
- source_word: אַל תֵּחַת
  choice: 不要……惊惶
  rationale: חתת 的尼法勒形可指丧胆、惊惶或被震慑；“惊惶”兼有恐惧与失去镇定之意，并可与下一分句的使役形保持同词复现。
- source_word: מִפְּנֵיהֶם / לִפְנֵיהֶם
  choice: 在他们面前
  rationale: 同一空间性短语在两分句中重复，既表达面对敌对者时的处境，也保留原文鲜明的平行结构。
- source_word: פֶּן אֲחִתְּךָ
  choice: 免得我使你……惊惶
  rationale: פֶּן 表警戒性的负面后果；使役形 אֲחִתְּךָ 与前面的 תֵּחַת 构成刻意的词根呼应，故用“惊惶／使……惊惶”保留原文的警告力度和修辞回声。
theological_decisions:
- issue: 先知受差遣时身体性惯用语的保留
  choice: 正文保留“束紧腰带”的具体意象，并以脚注解释为准备行动
  alternative: 直接译为“做好准备”或“准备行动”
  rationale: 原文以束紧腰间衣服表现准备、勇气和立即行动。保留意象可维护先知蒙召叙事的具体质感，同时脚注保障现代读者理解。
- issue: חתת 的尼法勒与使役形之间的警告性文字呼应
  choice: 译作“不要……惊惶，免得我使你……惊惶”
  alternative: 译作“不要害怕他们，否则我就使你在他们面前害怕”或分别采用不同词语
  rationale: 相同汉语词根式表达尽可能再现原文同一希伯来词根的反复，不把警告淡化为一般鼓励，也不额外解释上帝使其惊惶的具体方式。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。句式保留差遣命令的紧迫感及末尾两次“在他们面前”的平行结构；避免古奥的“束腰”和不够自然的“束上你腰间”。
