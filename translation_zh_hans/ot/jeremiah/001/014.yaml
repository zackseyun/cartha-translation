    rationale: תִּפָּתַח在此描写灾祸从北方迸发或被释放；“爆发出来”在汉语中更自然，同时不改变原文的被动／开启意象。
  - severity: low
    issue: 脚注a的较直译表述不够完整。
    rationale: “恶将被打开”在中文中既缺少定指，也容易被误解为抽象的道德恶被打开。改作“那灾祸将被打开”，并另列“恶”为词义替代，能更准确地说明词汇和句法。
  - severity: low
    issue: 脚注b的替代译法“全地”不够精确。
    rationale: הָאָרֶץ可指本地之“地”或“全地／大地”，但此处应以“这地”保留正文的语境指向；脚注以“整片土地”及“大地”说明范围歧义较清楚。
