  text: וַ/יֹּ֥אמֶר יְהוָ֖ה אֵלָ֑/י מִ/צָּפוֹן֙ תִּפָּתַ֣ח הָ/רָעָ֔ה עַ֥ל כָּל יֹשְׁבֵ֖י הָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/001/014.yaml
  text: And Yahweh said to me[b][a], “From the north the disaster will break forth against all the inhabitants of the land.”
translation:
  language: zh_hans
  text: 雅威对我说：“灾祸[a]必从北方爆发出来，临到这地[b]所有的居民。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “灾祸”也可译作“祸患”或“恶”；较直译为“那灾祸将被打开”。
    reason: lexical_alternative
  - marker: b
    text: “这地”在这里很可能指犹大地；也可理解为“整片土地”或“大地”。
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: 雅威
  rationale: 采用神圣名字的现代汉语音译，不以称号替代专名。
- source_word: וַיֹּאמֶר
  choice: 对我说
  rationale: 叙事中的连接词在汉语中无需机械译出；“对我说”自然表达动作及对象。
- source_word: מִצָּפוֹן
  choice: 从北方
  rationale: 直接保留灾祸来源的地理方位。
- source_word: תִּפָּתַח
  choice: 必……爆发
  rationale: 该词为פתח的尼斐勒式，字面义是“被打开”；与“灾祸”搭配时表示灾祸迸发、释放出来。“爆发”既自然，又保留其生动意象；“必”表达未完成式在预告中的确定将来意义。
- source_word: הָרָעָה
  choice: 灾祸
  rationale: רָעָה既可指道德上的恶，也可指遭遇性的祸患；本节预告从北方而来的审判，语境所指是灾难，但在脚注中保留词义范围。
- source_word: עַל
  choice: 临到
  rationale: 在灾祸与受灾者的关系中，“临到”是自然庄重的汉语表达，也保留“落在……之上”的方向感。
- source_word: כָּל יֹשְׁבֵי הָאָרֶץ
  choice: 这地所有的居民
  rationale: 自然表达“居住在这片土地上的所有人”。上下文较可能指犹大地，同时脚注保留“全地／大地”的可能。
theological_decisions:
- issue: הָרָעָה在神施行审判语境中的含义
  choice: 灾祸
  alternative: 恶；祸患
  rationale: 这里预告的是将临到居民的灾难，而不是直接断言神带来道德上的恶；脚注仍交代原词的宽广义域和字面结构。
- issue: הָאָרֶץ的范围
  choice: 这地，较可能指犹大地
  alternative: 全地；大地
  rationale: 从北方而来的入侵及本章语境支持本地性的指称，但希伯来词本身也可指“大地”，因此不在正文中加入“犹大”而在脚注说明。
- issue: תִּפָּתַח的被动形式与意象
  choice: 必……爆发
  alternative: 必被打开；必倾泻而出
  rationale: “被打开”在现代汉语中与“灾祸”搭配生硬；“爆发”传达灾祸被释放而出的意象，同时脚注保存字面表达。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“雅威”保留神名；“必从北方爆发”保持先知预告的力度。脚注标记紧随各自所解释的词语，避免歧义。
