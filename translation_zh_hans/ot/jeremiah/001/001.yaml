- from: 便雅悯地亚拿突众祭司中的一位，希勒家之子耶利米的话。[a]
  to: 希勒家之子耶利米[a]的话；他是便雅悯地亚拿突的祭司之一。
  rationale: 调整为符合现代标准汉语的卷首题语结构：先给出作者及其“话”，再说明其祭司身份和所属地点。“祭司之一”准确表达 מִן הַכֹּהֲנִים 的部分关系；“便雅悯地亚拿突的祭司”保留关系从句首先修饰“祭司”的语法关联。人名脚注内容可保留，惟将锚点移至相关姓名短语之后。
