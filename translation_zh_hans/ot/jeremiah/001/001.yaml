base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/001/001.yaml
  text: The words of Yirmeyahu son of Hilqiyahu[a], one of the priests who were in Anathoth, in the land of Benjamin.
translation:
  language: zh_hans
  text: 希勒家之子耶利米[a]的话；他是便雅悯地亚拿突的祭司之一。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “耶利米”和“希勒家”是这两个希伯来名字在中文圣经中的通行译名；按希伯来语音形可分别转写为“伊尔梅雅胡”和“希勒基雅胡”。
    reason: lexical_alternative
lexical_decisions:
- source_word: דִּבְרֵי
  choice: ……的话
  rationale: 这是复数附属形式，用作全书标题；译为“……的话”自然、庄重，也保留其可涵盖言语、信息与记述的宽泛语义。
- source_word: יִרְמְיָהוּ
  choice: 耶利米
  rationale: 采用现代中文圣经与一般读者熟悉的通行译名；中文不宜机械转写为近似希伯来语音形而降低辨识度。
- source_word: בֶּן חִלְקִיָּהוּ
  choice: 希勒家之子
  rationale: בֶּן 表示父子关系；“之子”适合卷首标题的庄重语体。חִלְקִיָּהוּ 采用中文通行译名“希勒家”。
- source_word: מִן הַכֹּהֲנִים
  choice: 众祭司中的一位
  rationale: מִן 在复数群体前为部分用法，表明耶利米属于该祭司群体；此译明确而不额外推断其具体职分。
- source_word: אֲשֶׁר בַּעֲנָתוֹת
  choice: 亚拿突众祭司
  rationale: 关系从句说明这些祭司位于亚拿突。中文将地点置于名词前，更自然紧凑，并保留修饰范围。
- source_word: בְּאֶרֶץ בִּנְיָמִן
  choice: 便雅悯地
  rationale: אֶרֶץ 在此指支派地域；“便雅悯地”准确、简洁，并符合现代中文圣经地理表达。
theological_decisions:
- issue: “祭司”这一身份描述的修饰范围
  choice: 理解为亚拿突的祭司群体，而耶利米是其中一位
  alternative: 将“在亚拿突”仅理解为耶利米个人的所在地
  rationale: 希伯来语关系代词 אֲשֶׁר 紧接复数名词“祭司”，且隐含系词按复数理解，因此语法上首先修饰“众祭司”。
translation_notes:
  register: 采用自然、庄重的卷首标题语体。调整希伯来语语序，把地域与群体身份前置，使中文清楚流畅；“众祭司中的一位”保留原文部分关系。脚注标记置于整句末尾，对应两个人名的译名说明。
