  text: וַ/יְהִ֨י דְבַר יְהוָ֤ה אֵלַ/י֙ שֵׁנִ֣ית לֵ/אמֹ֔ר מָ֥ה אַתָּ֖ה רֹאֶ֑ה וָ/אֹמַ֗ר סִ֤יר נָפ֨וּחַ֙ אֲנִ֣י רֹאֶ֔ה וּ/פָנָ֖י/ו מִ/פְּנֵ֥י צָפֽוֹנָ/ה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/001/013.yaml
  text: And the word of Yahweh came to me a second time[a], saying, “What do you see?” And I said, “I see a boiling pot[b], and its face is from the north.”
translation:
  language: zh_hans
  text: 耶和华的话第二次临到我，说：“你看见什么？”我说：“我看见一口沸腾的锅[a]，它的一面朝着北方[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “沸腾的”也可译作“被吹旺的”或“翻滚的”；这个希伯来语分词可描写火被吹旺，从而使锅烧沸。
    reason: lexical_alternative
  - marker: b
    text: 直译近似“它的面从北方的面前（而来）”。“面”可指锅朝外的一面或开口；这句话也可理解为锅面背向北方，或指锅以北方为参照而倾斜，确切的方位关系并不明确。
    reason: alternative_reading
lexical_decisions:
- source_word: דְבַר יְהוָה
  choice: 耶和华的话
  rationale: 保留先知书中固定的启示公式；דָּבָר 译为“话”，比“信息”更贴近原文表达。
- source_word: שֵׁנִית
  choice: 第二次
  rationale: 明确表达这是按次序发生的第二次，而不只笼统地说“又”。
- source_word: סִיר
  choice: 锅
  rationale: 原词泛指烹煮用的器皿；“锅”自然、清楚，也不过度限定其形制。
- source_word: נָפוּחַ
  choice: 沸腾的
  rationale: 该分词本义可指被吹动或煽旺，放在锅的意象中很可能指炉火被吹旺而使锅沸腾；正文采用自然可懂的结果性表达，并以脚注保留原词意象。
- source_word: וּפָנָיו
  choice: 锅口
  rationale: פָּנִים 字面为“面”，在锅的语境中可指朝外的一面或开口；“锅口”使视觉意象在现代汉语中清楚，但不把它误解为人的脸。
- source_word: מִפְּנֵי צָפוֹנָה
  choice: 从北边倾斜过来
  rationale: 该短语字面与“北方的面”有关，具体空间关系不完全明确；此译传达锅口以北方为起点倾斜的常见理解，同时用脚注保留原文含混性。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经传统中对神圣四字名的通行音译，明确其为专名。
theological_decisions:
- issue: 神圣四字名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: “耶和华”是简体中文读者最熟悉的专名形式；此处不以“主”替代，以保留原文使用专名的事实。
- issue: 锅与北方之间的方位关系
  choice: 锅口从北边倾斜过来
  alternative: 锅面朝向北方／锅口在北面
  rationale: 原文的介词结构和“面”这一意象容许不同的空间理解。正文采用锅从北方一侧倾斜的常见解释，使下一节来自北方的灾祸意象连贯；脚注同时说明字面形式和其他可能理解，不把含混之处隐藏起来。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。对话简洁，保留先知叙事公式。“一口锅”符合现代汉语量词习惯；对 נָפוּחַ 和锅的方位这两处原文难点，以正文传达主要图像，并由脚注保存词义及空间关系上的歧义。
