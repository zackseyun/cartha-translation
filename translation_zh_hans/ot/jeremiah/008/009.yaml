id: JER.8.9
reference: Jeremiah 8:9
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: הֹבִ֣ישׁוּ חֲכָמִ֔ים חַ֖תּוּ וַ/יִּלָּכֵ֑דוּ הִנֵּ֤ה בִ/דְבַר יְהוָה֙ מָאָ֔סוּ וְ/חָכְמַֽת מֶ֖ה לָ/הֶֽם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/008/009.yaml
  text: The wise men are put to shame; they are dismayed and captured. Look[a], they have rejected the word of Yahweh, so what wisdom do they have?
translation:
  language: zh_hans
  text: 智慧人蒙羞，惊惶，被捉住了[a]。看哪，他们厌弃了雅威的话；他们还有什么智慧呢？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“被捕获了”或“落入圈套了”。希伯来语动词可指被擒获，也可指落入陷阱。
    reason: lexical_alternative
lexical_decisions:
- source_word: הֹבִישׁוּ
  choice: 蒙羞
  rationale: 此处表示智慧人遭到公开羞辱、颜面尽失；“蒙羞”简洁庄重，也不把含义限于内心羞愧。
- source_word: חֲכָמִים
  choice: 智慧人
  rationale: 该阳性复数名词指当时被视为有智慧的一类人或智者；“智慧人”符合汉语圣经语体，又保留其群体身份。
- source_word: חַתּוּ
  choice: 惊惶
  rationale: 该动词可表示胆气受挫、惊恐失措；“惊惶”自然地承接“蒙羞”，体现他们在审判前崩溃失措。
- source_word: וַיִּלָּכֵדוּ
  choice: 被捉住了
  rationale: לכד表示被捕获、抓住或落入圈套；“被捉住了”保留其受制于审判的形象，其他可能含义列入脚注。
- source_word: הִנֵּה
  choice: 看哪
  rationale: 这是引人注意的语篇标记；“看哪”庄重且为普通读者熟悉，突出下文揭示其虚假智慧的原因。
- source_word: בִדְבַר יְהוָה
  choice: 雅威的话
  rationale: דבר在先知语境中指雅威所启示的话语或信息；译作“话”保留核心圣经用语。
- source_word: יְהוָה
  choice: 雅威
  rationale: 直接音译四字神名，以区别于称号“主”，并保留原文所用的盟约之名。
- source_word: מָאָסוּ
  choice: 厌弃
  rationale: מאס不只是拒绝接受，也可含轻视、弃绝之意；“厌弃”体现他们对雅威之话主动而有罪责的排斥。
- source_word: וְחָכְמַת מֶה לָהֶם
  choice: 他们还有什么智慧呢？
  rationale: 原文是带责问意味的修辞问句；加入“还”自然呈现逻辑：既厌弃雅威的话，所谓智慧便不能成立，同时不把问句改成直陈结论。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”较贴近学界通常重构的读音，并保留专名性质。
- issue: 末句是否直接断言智慧人毫无智慧
  choice: 保留修辞问句“他们还有什么智慧呢？”
  alternative: 他们根本没有智慧
  rationale: 原文以问句挑战其智慧资格。保留问句可维持先知话语的讽刺和神学张力，不把隐含结论改写成明说。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。短句和并列结构保留原文连续宣判的力度；脚注标记置于其实际所说明的“被捉住了”之后，以避免把词义说明误接到“看哪”上。
