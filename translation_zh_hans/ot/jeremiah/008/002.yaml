id: JER.8.2
reference: Jeremiah 8:2
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וּ/שְׁטָחוּ/ם֩ לַ/שֶּׁ֨מֶשׁ וְ/לַ/יָּרֵ֜חַ וּ/לְ/כֹ֣ל צְבָ֣א הַ/שָּׁמַ֗יִם אֲשֶׁ֨ר אֲהֵב֜וּ/ם וַ/אֲשֶׁ֤ר עֲבָדוּ/ם֙ וַֽ/אֲשֶׁר֙ הָלְכ֣וּ אַֽחֲרֵי/הֶ֔ם וַ/אֲשֶׁ֣ר דְּרָשׁ֔וּ/ם וַ/אֲשֶׁ֥ר הִֽשְׁתַּחֲו֖וּ לָ/הֶ֑ם לֹ֤א יֵאָֽסְפוּ֙ וְ/לֹ֣א יִקָּבֵ֔רוּ לְ/דֹ֛מֶן עַל פְּנֵ֥י הָ/אֲדָמָ֖ה יִֽהְיֽוּ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/008/002.yaml
  text: And they will spread them out before the sun and the moon and all the host of the heavens[a], which they loved and which they served and after which they walked and which they sought and to which they bowed down. They will not be gathered, and they will not be buried[c][b]; they will become dung on the surface of the ground.
translation:
  language: zh_hans
  text: 人必把他们的骸骨摊开在太阳、月亮和天上万象[a]面前；这些正是他们所爱、所侍奉、所跟随、所寻求[b]、所跪拜的。他们的骸骨无人收殓，也无人埋葬，必成为地面上的粪土[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“天上的万军”，指天上的众天体。
    reason: 保留 צְבָא 的“军旅、万军”字面意义，并说明本节语境中的所指。
  - marker: b
    text: “寻求”也可译作“求问”，即向这些天体寻求指示。
    reason: דרשׁ 在宗教语境中可表示求问或问卜；正文不宜将含义限定得过窄。
  - marker: c
    text: 直译“在土地表面”。
    reason: 说明 עַל־פְּנֵי הָאֲדָמָה 的字面表达。
lexical_decisions:
- source_word: וּשְׁטָחוּם
  choice: 人必把他们的骸骨摊开
  rationale: 承接上一节所掘出的骸骨；“摊开”保留 שׁטח 所表达的铺陈、暴露之具体画面。补出“骸骨”使中文指代清楚，并未增添原文语义。
- source_word: לַשֶּׁמֶשׁ וְלַיָּרֵחַ וּלְכֹל צְבָא הַשָּׁמַיִם
  choice: 在太阳、月亮和天上万象面前
  rationale: 此处 ל 表示骸骨暴露于这些天体之前；“天上万象”自然表达 צְבָא הַשָּׁמַיִם 所指的众天体，同时脚注保留较直译的“天上的万军”。
- source_word: אֲשֶׁר אֲהֵבוּם וַאֲשֶׁר עֲבָדוּם וַאֲשֶׁר הָלְכוּ אַחֲרֵיהֶם
  choice: 他们所爱、所侍奉、所跟随的
  rationale: 分别保留“爱”“服侍”和“跟随”的层次；“跟随”自然传达“行在……之后”所表示的效忠。
- source_word: וַאֲשֶׁר דְּרָשׁוּם
  choice: 所寻求的
  rationale: דרשׁ 可泛指寻求，也可在宗教语境中指求问；正文采用较宽的“寻求”，脚注保留“求问”的可能。
- source_word: וַאֲשֶׁר הִשְׁתַּחֲווּ לָהֶם
  choice: 所跪拜的
  rationale: 既保留俯伏敬拜的身体动作，也符合现代中文宗教语境，并与前面的“侍奉”保持词义区别。
- source_word: לֹא יֵאָסְפוּ וְלֹא יִקָּבֵרוּ
  choice: 无人收殓，也无人埋葬
  rationale: 在葬仪语境中，אסף 指收集、收殓遗骸；中文用主动式无人句，清楚表达两个被动否定句的结果。
- source_word: לְדֹמֶן עַל פְּנֵי הָאֲדָמָה יִהְיוּ
  choice: 必像粪土留在地面上
  rationale: “粪土”保留 דֹמֶן 的粗粝羞辱意象；“留在”自然呈现“成为／处于地面上的粪土”这一结局。
theological_decisions:
- issue: 是否合并一连串敬奉天体的动词
  choice: 分别译作“所爱、所侍奉、所跟随、所寻求、所跪拜”
  alternative: 概括为“所敬拜的”
  rationale: 原文累积五个不同动词，强调百姓对天体全面而持续的委身；逐项保留可避免削弱先知谴责的力度。
- issue: צְבָא הַשָּׁמַיִם 的所指与表达
  choice: 正文译“天上万象”
  alternative: “天上的万军”
  rationale: 上下文明确涉及太阳、月亮及其余天体；“天上万象”在现代中文中可懂且不预断这些对象的本体，脚注同时保留原词“军旅／万军”的字面意象。
translation_notes:
  register: 采用现代、庄重而直接的普通话。“骸骨”承接上一节并消除代词歧义；平行的“所……”结构保留希伯来文反复铺陈的修辞。末句使用“粪土”维持先知话语中刻意强烈的羞辱意象。
