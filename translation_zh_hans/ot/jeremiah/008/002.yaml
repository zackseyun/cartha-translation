revisions:
- from: 人必把他们的骸骨摊开在太阳、月亮和天上万象[a]面前；这些正是他们所爱、所侍奉、所跟随、所寻求[b]、所跪拜的。他们的骸骨无人收殓，也无人埋葬，必像粪土留在地面上[c]。
  to: 人必把他们的骸骨摊开在太阳、月亮和天上万象[a]面前；这些正是他们所爱、所侍奉、所跟随、所寻求[b]、所跪拜的。他们的骸骨无人收殓，也无人埋葬，必成为地面上的粪土[c]。
