  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: אָסֹ֥ף אֲסִיפֵ֖/ם נְאֻם יְהֹוָ֑ה אֵין֩ עֲנָבִ֨ים בַּ/גֶּ֜פֶן וְ/אֵ֧ין תְּאֵנִ֣ים בַּ/תְּאֵנָ֗ה וְ/הֶֽ/עָלֶה֙ נָבֵ֔ל וָ/אֶתֵּ֥ן לָ/הֶ֖ם יַעַבְרֽוּ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/008/013.yaml
  text: I will surely gather them[a], declares Yahweh. There are no grapes on the vine, and no figs on the fig tree; even the leaf has withered[b], and what I gave them will pass away from them.
translation:
  language: zh_hans
  text: '雅威宣告：

    “我必把他们全都收聚起来[a]。

    葡萄树上没有葡萄，

    无花果树上也没有无花果；

    连叶子也枯萎了。

    我赐给他们的，必离他们而去[b]。”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我必把他们彻底扫除”，或“我必灭尽他们”。希伯来文用“收聚”的加强形式；在这里的审判语境中，也可能含有清除或毁灭之意。
    reason: lexical_alternative
  - marker: b
    text: 本句希伯来文艰涩；也可能意为：“我赐给他们的，必从他们那里被夺走”，或有类似含义。
    reason: alternative_reading
lexical_decisions:
- source_word: אָסֹף אֲסִיפֵם
  choice: 我必把他们全都收聚起来
  rationale: 原文以同根不定式绝对形加强限定动词，强调动作确定而彻底。译文保留“收聚”的基本词义，并以“必”“全都”体现加强语气；审判语境所含的清除、毁灭意味留给上下文和脚注表达。
- source_word: נְאֻם יְהוָה
  choice: 雅威宣告
  rationale: 这是先知书常见的神谕公式；“宣告”保留其庄重、权威的语气，יהוה按其专名译作“雅威”。
- source_word: אֵין עֲנָבִים בַּגֶּפֶן
  choice: 葡萄树上没有葡萄
  rationale: 直接保留原文的存在否定句及葡萄树与果实的意象。
- source_word: וְאֵין תְּאֵנִים בַּתְּאֵנָה
  choice: 无花果树上也没有无花果
  rationale: “也”自然承接前句，并保留果实与树木的重复。
- source_word: וְהֶעָלֶה נָבֵל
  choice: 连叶子也枯萎了
  rationale: 原文单数“叶子”可作集合性表达；“连……也”传达递进意味，“枯萎了”自然表达结果状态。
- source_word: וָאֶתֵּן לָהֶם
  choice: 我赐给他们的
  rationale: נתן含义宽泛。译作“赐给”符合说话者为上帝的语境，但不擅自把所赐之物具体化为土地、律法或福分。
- source_word: יַעַבְרוּם
  choice: 必离他们而去
  rationale: 此形式句法艰涩。译文保留עבר所含的经过、离去之动态，并按审判语境表达失去，却不把含义过度确定为主动夺走。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”较贴近当前学界对其发音的通行重构，也明确保留其专名性质。
- issue: 开头审判措辞的解释程度
  choice: 保留“收聚”的基本意象，同时体现动作的彻底性
  alternative: 我必把他们彻底扫除／我必灭尽他们
  rationale: 在审判语境中，“收聚”很可能含有清除或毁灭意味，但原词的基本语义仍是聚集、收取。正文不把潜在含义直接定为“灭尽”，以保存原文张力。
- issue: 末句艰涩希伯来文的处理
  choice: 我赐给他们的，必离他们而去
  alternative: 我赐给他们的，必从他们手中被夺走
  rationale: 末句语法压缩且解释有争议。正文采用可读、贴近עבר动态语义的表达，但不明确补出夺取者或所赐之物。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。诗行保留葡萄树、无花果树和枯叶的递进意象；对开头和末尾两处有争议的表达不过度释义，并用脚注呈现主要可能读法。
