source:
  edition: WLC
  text: וַ/יְרַפּ֞וּ אֶת שֶׁ֤בֶר בַּת עַמִּ/י֙ עַל נְקַלָּ֔ה לֵ/אמֹ֖ר שָׁל֣וֹם שָׁל֑וֹם וְ/אֵ֖ין שָׁלֽוֹם־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/008/011.yaml
  text: They have treated the wound of the daughter of my people lightly[a], saying, ‘Peace[b], peace,’ when there is no peace.
translation:
  language: zh_hans
  text: 他们轻忽地医治我百姓的女儿的创伤[a]，说：“平安，平安！[b]”其实并没有平安。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“肤浅地医治”；也可理解为“把这创伤当作轻微的伤来医治”。
    reason: lexical_alternative
  - marker: b
    text: “平安”所译的希伯来语也可表示安好、完整或安稳。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְרַפּוּ
  choice: 医治
  rationale: רפא的基本义是“医治”。与“创伤”搭配可保留原文的医疗隐喻；结合“草草”一词，表达他们并未真正治好，而只是敷衍处置。
- source_word: שֶׁבֶר
  choice: 创伤
  rationale: שֶׁבֶר可指破裂、损伤或灾祸；在רפא“医治”的语境中，“创伤”自然地凸显身体受伤的比喻，同时也可承载群体遭受灾难的含义。
- source_word: בַּת עַמִּי
  choice: 我百姓女儿
  rationale: 保留先知文学中把百姓人格化为“女儿”的表达及其悲悯色彩，避免简化为单纯的“我的百姓”。
- source_word: עַל נְקַלָּה
  choice: 草草
  rationale: 该短语表示把严重伤势看得轻微，或仅作肤浅处理。“草草”在现代汉语中简洁自然，能体现敷衍和轻率。
- source_word: לֵאמֹר
  choice: 说
  rationale: 直接引出他们虚假的安抚之语，符合现代汉语叙述习惯。
- source_word: שָׁלוֹם שָׁלוֹם
  choice: 平安了，平安了
  rationale: “平安”是שָׁלוֹם的常用对应词；加入语气助词“了”使这句反复宣告在汉语中更像对现状的保证，同时保留原文的重复和口号式力度。
- source_word: וְאֵין שָׁלוֹם
  choice: 其实并没有平安
  rationale: וְ在这里使现实与前面的宣告形成强烈反差。“其实”自然揭露其虚假，“并没有平安”则紧扣原文用词。
theological_decisions:
- issue: 是否保留对百姓的女儿人格化称呼
  choice: 在正文中译作“我百姓女儿”
  alternative: 译作“我的百姓”或“我亲爱的百姓”
  rationale: 原文的“女儿”意象具有先知文学的情感张力和群体人格化作用；保留这一表达可避免抹平原文意象。
- issue: שָׁלוֹם的语义范围
  choice: 正文采用“平安”
  alternative: 译作“安好”“一切都好”或“安稳”
  rationale: “平安”既是该词的标准对应，也能保留重复宣告的形式；其较广的福祉、完整和安稳之义在脚注中说明。
- issue: 医治是否意味着已经治愈
  choice: 保留“医治”，并用“草草”限定
  alternative: 译作“处理”或“试图医治”
  rationale: 原文使用明确的医疗动词，但上下文讽刺这种所谓的医治只是肤浅处置。“草草医治”同时保留字面隐喻和控诉意味，不把结果解释为真正痊愈。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。以“草草医治”保留医疗隐喻和讽刺意味，以“我百姓女儿”保留先知文学的人格化意象；重复“平安了，平安了”再现虚假安抚的口号感。
