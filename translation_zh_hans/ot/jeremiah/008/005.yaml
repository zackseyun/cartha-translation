  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: מַדּ֨וּעַ שׁוֹבְבָ֜ה הָ/עָ֥ם הַ/זֶּ֛ה יְרוּשָׁלִַ֖ם מְשֻׁבָ֣ה נִצַּ֑חַת הֶחֱזִ֨יקוּ֙ בַּ/תַּרְמִ֔ית מֵאֲנ֖וּ לָ/שֽׁוּב׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/008/005.yaml
  text: Why has this people turned away—Jerusalem—with a perpetual turning away? They hold fast to deceit[c][b][a]; they refuse to return.
translation:
  language: zh_hans
  text: 为什么这百姓——耶路撒冷——一再转离，始终不回头呢？[a][b]他们紧抓诡诈不放，不肯回转。[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “耶路撒冷”也可理解为呼语：“耶路撒冷啊，为什么这百姓转离了……？”
    reason: alternative_reading
  - marker: b
    text: “一再转离，始终不回头”也可译作“不断背离”或“恒久背道”。
    reason: lexical_alternative
  - marker: c
    text: 希伯来原文在本节反复使用“转／回转”这一词根，以百姓的转离与他们不肯回转形成对照。
    reason: lexical_alternative
lexical_decisions:
- source_word: מַדּוּעַ
  choice: 为什么
  rationale: 这是引出反问的疑问副词；“为什么”符合现代汉语表达，并保留先知责问的语气。
- source_word: שׁוֹבְבָה
  choice: 转离了
  rationale: 此处表示背离后的状态或结果。“转离”清楚表达负面的离弃，也能与后文“回转”形成同根词语的呼应。
- source_word: הָעָם הַזֶּה
  choice: 这百姓
  rationale: 保留先知话语中指称群体的语气；“百姓”比“国家”更贴近 עַם 在此处的含义。
- source_word: יְרוּשָׁלִַם
  choice: 耶路撒冷
  rationale: 按标准中文译名处理，并在正文中用破折号将其理解为“这百姓”的同位说明；另一种呼语理解收入脚注。
- source_word: מְשֻׁבָה נִצַּחַת
  choice: 持久地转离
  rationale: מְשֻׁבָה 指背离、转离，נִצַּחַת 强调持续不止。“持久地转离”既保留持续性，也维持与“转离了／回转”的词语联系。
- source_word: הֶחֱזִיקוּ בַּתַּרְמִית
  choice: 他们紧抓诡诈
  rationale: חזק 的使役形在这里有牢牢抓住、执着不放之意；תַּרְמִית 可指欺骗、诡诈。“紧抓诡诈”保留主动而顽固的力度。
- source_word: מֵאֲנוּ
  choice: 不肯
  rationale: 该动词表达有意拒绝或不愿意；“不肯”自然地传达意志上的抗拒。
- source_word: לָשׁוּב
  choice: 回转
  rationale: 保留 שוב 的基本方向性含义，并与前面的“转离”形成鲜明对照；不直接译作“悔改”，以免把语境中的神学含义明说得超过原文。
theological_decisions:
- issue: שוב／מְשׁוּבָה 的重复与反差
  choice: 采用“转离了／转离／回转”
  alternative: 采用“背道／悔改”或全用“退后”一类传统术语
  rationale: 原文以同一词根构成修辞张力：百姓转离，却拒绝回转。中文用相关的“转”字表达可让普通读者听出这种反差，同时不把末尾的“回转”扩展为更专门的神学术语。
- issue: “耶路撒冷”的句法功能
  choice: 视为“这百姓”的同位说明，用破折号标出
  alternative: 视为呼语：“耶路撒冷啊，为什么这百姓……？”
  rationale: 同位理解在语境中较自然，但希伯来语形式允许呼语理解，因此正文不强行消除歧义，并在脚注交代另一读法。
- issue: נִצַּחַת 所表达的持续性
  choice: 译作“持久地”
  alternative: 译作“永远”“不断地”或将整句译为“恒久背道”
  rationale: 这里强调根深蒂固、持续不止的背离。“持久地”保留时间力度，又避免“永远”在现代汉语中可能造成过度绝对化。
translation_notes:
  register: 采用现代、庄重而易懂的先知性语言。“紧抓诡诈”保留原文责备的力度；“转离／回转”避免教会内部色彩较浓的术语，同时保留希伯来语的核心文字呼应。破折号用于呈现“耶路撒冷”作为同位语的主读法。
