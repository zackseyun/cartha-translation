id: JER.8.12
reference: Jeremiah 8:12
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: הֹבִ֕שׁוּ כִּ֥י תוֹעֵבָ֖ה עָשׂ֑וּ גַּם בּ֣וֹשׁ לֹֽא יֵבֹ֗שׁוּ וְ/הִכָּלֵם֙ לֹ֣א יָדָ֔עוּ לָ/כֵ֞ן יִפְּל֣וּ בַ/נֹּפְלִ֗ים בְּ/עֵ֧ת פְּקֻדָּתָ֛/ם יִכָּשְׁל֖וּ אָמַ֥ר יְהוָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/008/012.yaml
  text: Were they ashamed because they had done an abomination? No[a], they were not ashamed at all; they did not even know how to blush. Therefore they will fall among the fallen; at the time of their punishment they will stumble, says Yahweh.
translation:
  language: zh_hans
  text: 他们因行了可憎之事而感到羞耻吗？不！他们毫不羞耻，甚至不知道脸红。因此，他们必倒下，与倒下的人同列；到他们受惩罚[a]的时候，他们必跌倒。这是雅威说的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“到他们被察访的时候”或“到他们被追究的时候”。希伯来语可指上帝临到人施行审判，或叫人交账。
    reason: 保留 פְּקֻדָּה 在审判语境中“察访、追究、惩罚”的词义幅度。
lexical_decisions:
- source_word: הֹבִשׁוּ
  choice: 感到羞耻吗
  rationale: 结合下文的强烈否定，将该形式理解为反问，既符合上下文，也保留“羞耻”的核心含义。
- source_word: תוֹעֵבָה
  choice: 可憎之事
  rationale: 保留该词在先知谴责中强烈的道德与宗教意味，同时比音译式或过于书面的表达更易懂。
- source_word: גַּם בּוֹשׁ לֹא יֵבֹשׁוּ
  choice: 不！他们毫不羞耻
  rationale: 希伯来语不定式绝对形与限定动词连用，加强否定语气；“毫不”自然传达这种强调。
- source_word: וְהִכָּלֵם לֹא יָדָעוּ
  choice: 甚至不知道脸红
  rationale: 该表达与“羞耻”平行；“不知道脸红”在现代汉语中自然地表达丧失羞耻感，也保留可能涉及羞愧外在表现的意象。
- source_word: יִפְּלוּ בַנֹּפְלִים
  choice: 他们必倒下，与倒下的人同列
  rationale: 尽量保留原文“倒下／倒下的人”的重复和文字呼应，同时使汉语句意清楚。
- source_word: בְּעֵת פְּקֻדָּתָם
  choice: 到他们受惩罚的时候
  rationale: פְּקֻדָּה 可指察访、追究或惩罚；审判语境支持正文采用“受惩罚”，并以脚注保留“被察访／追究”的语义范围。
- source_word: יִכָּשְׁלוּ
  choice: 他们必跌倒
  rationale: 保留“绊跌、跌倒”的审判意象，并与前句的“倒下”形成呼应。
- source_word: אָמַר יְהוָה
  choice: 这是雅威说的
  rationale: 采用自然的现代汉语先知宣告公式，并将四字神名 יְהוָה 音译为“雅威”。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；“雅威”较接近学界通常重建的读音，并明确保留专名性质。
- issue: פְּקֻדָּה 所表达的神圣行动
  choice: 正文译为“惩罚”，脚注保留“察访／追究”
  alternative: 察访
  rationale: 本节明确处于审判语境，“惩罚”最直接；但原词也可指神临到、察访并叫人交账，因此不把其语义完全压缩为单一司法术语。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。开头保留反问及随后的强烈否定；后半句尽量重现原文“倒下／跌倒”的重复意象。脚注标记置于其实际解释的“受惩罚”之后。
