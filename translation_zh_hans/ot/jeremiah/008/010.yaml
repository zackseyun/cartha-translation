  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: לָ/כֵן֩ אֶתֵּ֨ן אֶת נְשֵׁי/הֶ֜ם לַ/אֲחֵרִ֗ים שְׂדֽוֹתֵי/הֶם֙ לְ/י֣וֹרְשִׁ֔ים כִּ֤י מִ/קָּטֹן֙ וְ/עַד גָּד֔וֹל כֻּלֹּ֖/ה בֹּצֵ֣עַ בָּ֑צַע מִ/נָּבִיא֙ וְ/עַד כֹּהֵ֔ן כֻּלֹּ֖/ה עֹ֥שֶׂה שָּֽׁקֶר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/008/010.yaml
  text: Therefore I will give their wives to others[a], their fields to those who will possess them; for from the least even to the greatest, every one of them is greedy for unjust gain; from prophet even to priest[c][b], every one of them practices falsehood.
translation:
  language: zh_hans
  text: 所以，我要把他们的妻子交给别人，把他们的田地交给将要占有这些田地的人[a]；因为从最小的到最大的，人人都贪图不义之财[b]；从先知到祭司，人人都行事诡诈[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“把他们的田地交给承受产业的人”。希伯来语动词可指“继承”，也可指“取得、占有”；这里很可能包括田地被新的占有者夺取的意思。
    reason: lexical_alternative
  - marker: b
    text: 或译：“人人都贪图财利”。原文可泛指贪求利益，但在先知谴责的语境中，通常暗含所得不义。
    reason: lexical_alternative
  - marker: c
    text: 或译：“人人都行事虚假”或“人人都以欺诈待人”。
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: 所以
  rationale: 表示前文罪状所导致的审判后果，现代汉语中自然清楚。
- source_word: אֶתֵּן
  choice: 我要……交给
  rationale: 未完成式用于先知性审判宣告，宜表达将来的行动；“交给”也保留主语主动施行审判的意味。
- source_word: נְשֵׁיהֶם
  choice: 他们的妻子
  rationale: אשה虽可指女人，但这里带所属后缀并与家庭、产业被夺的审判并列，较明确指妻子。
- source_word: לַאֲחֵרִים
  choice: 给别人
  rationale: 直译为“别人/其他人”，不额外限定其身份或性别。
- source_word: שְׂדוֹתֵיהֶם
  choice: 他们的田地
  rationale: 保留具体的农业产业意象。
- source_word: לְיוֹרְשִׁים
  choice: 给占有这些田地的人
  rationale: ירשׁ可表示继承、取得或占有；此处语境是产业转归新占有者，不一定是合法继承人。
- source_word: כִּי מִקָּטֹן וְעַד גָּדוֹל
  choice: 因为从最小的到最大的
  rationale: 保留原文涵盖不同地位人群的首尾表达，同时符合现代汉语。
- source_word: כֻּלֹּה
  choice: 人人都
  rationale: 体现其分配性含义，即每一个人无不如此。
- source_word: בֹּצֵעַ בָּצַע
  choice: 贪图不义之财
  rationale: 同根动词与名词的组合强调贪求利益；在先知谴责语境中，这种利益带有不正当性质。
- source_word: מִנָּבִיא וְעַד כֹּהֵן
  choice: 从先知到祭司
  rationale: 简洁保留原文涵盖宗教领袖群体的表达。
- source_word: עֹשֶׂה שָּׁקֶר
  choice: 弄虚作假
  rationale: 表达持续从事虚假、欺诈之事，而非仅说一次谎；现代汉语自然且庄重。
theological_decisions:
- issue: 妻子和田地被交给他人的审判性质
  choice: 译成上帝以第一人称主动宣告将他们的家庭与产业交给他人
  alternative: 仅描述战争造成妻子和产业被夺的社会后果
  rationale: 原文 אֶתֵּן 明确以第一人称陈述“我要交给”，将损失呈现为上帝所施行的审判；译文不额外补入战争或盟约等原文此节未明说的细节。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。以“所以”自然承接前文，以两个“人人都”再现原文平行结构和全面谴责；脚注保留 ירשׁ、בצע 和 עשה שקר 的真实词义幅度。
