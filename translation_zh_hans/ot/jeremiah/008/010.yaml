- from: 所以，我要把他们的妻子交给别人，把他们的田地交给占有这些田地的人[a]；因为从最小的到最大的，人人都贪图不义之财[b]；从先知到祭司，人人都弄虚作假[c]。
  to: 所以，我要把他们的妻子交给别人，把他们的田地交给将要占有这些田地的人[a]；因为从最小的到最大的，人人都贪图不义之财[b]；从先知到祭司，人人都行事诡诈[c]。
