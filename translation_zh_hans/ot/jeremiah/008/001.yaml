id: JER.8.1
reference: Jeremiah 8:1
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: בָּ/עֵ֣ת הַ/הִ֣יא נְאֻם יְהוָ֡ה ו/יציאו אֶת עַצְמ֣וֹת מַלְכֵֽי יְהוּדָ֣ה וְ/אֶת עַצְמוֹת שָׂרָי/ו֩ וְ/אֶת עַצְמ֨וֹת הַ/כֹּהֲנִ֜ים וְ/אֵ֣ת עַצְמ֣וֹת הַ/נְּבִיאִ֗ים וְ/אֵ֛ת עַצְמ֥וֹת יוֹשְׁבֵֽי יְרוּשָׁלִָ֖ם מִ/קִּבְרֵי/הֶֽם־־־־־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/008/001.yaml
  text: At that time, declares Yahweh, they will bring out the bones of the kings of Judah, the bones of its officials, the bones of the priests, the bones of the prophets, and the bones of the inhabitants of Jerusalem from their graves.
translation:
  language: zh_hans
  text: 那时，雅威[a]宣告：他们必把犹大列王的骸骨、犹大首领的骸骨、祭司的骸骨、先知的骸骨，以及耶路撒冷居民的骸骨，从他们的坟墓中取出来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “雅威”音译希伯来文神名 יהוה（YHWH）；传统上也常译作“耶和华”，或以“上主”代称。
    reason: 帮助普通读者辨认神名，并说明常见译法差异而不把称号混同于原文专名。
lexical_decisions:
- source_word: בָּעֵת הַהִיא
  choice: 到那时
  rationale: 这是常见的指示性时间短语；“到那时”自然地指向预告中的将来时刻。
- source_word: נְאֻם יְהוָה
  choice: 雅威宣告
  rationale: 保留先知话语中庄重的宣告公式，同时采用现代汉语易懂的表达。
- source_word: וְיֹצִיאוּ
  choice: 他们必……取出来
  rationale: 希伯来语为使役形式，表示使骸骨离开坟墓；“取出来”准确而自然，并保留原文没有明确指出施事者的第三人称复数。
- source_word: עַצְמוֹת
  choice: 骸骨
  rationale: 原词具体指骨头；在埋葬和掘墓语境中，“骸骨”比“遗骸”更贴近原词，也适合庄重文体。原文逐项重复该词，译文同样保留。
- source_word: מַלְכֵי יְהוּדָה
  choice: 犹大列王
  rationale: 准确表达复数构词关系，指犹大历代君王。
- source_word: שָׂרָיו
  choice: 犹大首领
  rationale: שׂרים可指官长、领袖或贵族；“首领”保留较宽的统治阶层含义。代词后缀所指最自然地是犹大，汉语中明说“犹大”可避免“它的”所指含混。
- source_word: הַכֹּהֲנִים
  choice: 祭司
  rationale: 这是该宗教职分的标准现代汉语译法。
- source_word: הַנְּבִיאִים
  choice: 先知
  rationale: 这是该职分的标准现代汉语译法。
- source_word: יוֹשְׁבֵי יְרוּשָׁלִָם
  choice: 耶路撒冷居民
  rationale: 分词在此作名词，泛指住在耶路撒冷的人；“居民”简洁、自然。
- source_word: מִקִּבְרֵיהֶם
  choice: 从各人的坟墓里
  rationale: קבר指坟墓或墓穴。复数后缀回指前述各类死者；“各人的坟墓”在汉语中清楚表达这些骸骨分别从所属坟墓中被取出。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名。音译“雅威”将其作为专名呈现，而不是以称号替代；脚注说明其希伯来文形式及传统读法。
- issue: 是否保留“骸骨”的反复
  choice: 在每一类人之后重复“骸骨”
  alternative: 只说一次“骸骨”，随后罗列各类人
  rationale: 原文五次重复 עַצְמוֹת，强化审判中坟墓遭亵渎的全面性和震撼感；译文保留这一修辞效果。
- issue: 取出骸骨者的身份
  choice: 保留未明确所指的“他们”
  alternative: 明确译为“敌人”或“入侵者”
  rationale: 本节动词是第三人称复数，但没有在本节明说主语。译文不依据上下文推断并补入具体身份，以保存原文的含混。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。保留原文列表结构和“骸骨”的逐项重复；不补明取出骸骨者的具体身份。
