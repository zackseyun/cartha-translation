  text: הַ/צֳרִי֙ אֵ֣ין בְּ/גִלְעָ֔ד אִם רֹפֵ֖א אֵ֣ין שָׁ֑ם כִּ֗י מַדּ֨וּעַ֙ לֹ֣א עָֽלְתָ֔ה אֲרֻכַ֖ת בַּת עַמִּֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/008/022.yaml
  text: Is there no balm in Gilead? Is there no physician there? Why then has the healing of the daughter of my people not come about?[a][b]
translation:
  language: zh_hans
  text: 基列难道没有香膏[a]吗？那里难道没有医生吗？那么，我百姓的女儿为何还没有得到医治[b]呢？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“药用树脂”“香脂”。原文所指是与基列相关、可作药用的树胶或树脂。
    reason: lexical_alternative
  - marker: b
    text: “医治”也可译作“康复”或“复原”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַצֳרִי
  choice: 乳香
  rationale: 该词指与基列相关、具有药用价值的树脂或香膏。“乳香”在现代中文中简洁自然，并能保留本节的医药意象；脚注注明更宽泛的词义。
- source_word: אֵין
  choice: 难道没有……吗
  rationale: 此处表示不存在，并用于反问。“难道没有……吗”自然传达希伯来文的修辞力度。
- source_word: בְּגִלְעָד
  choice: 在基列／基列……有
  rationale: 地点状语，基列作为地名按现代通行译名处理；中文为流畅起见调整语序。
- source_word: אִם
  choice: 以第二个反问句表达
  rationale: 这里不是条件句，而是引出与前句平行的第二个反问，因此译为“那里难道没有医生吗”。
- source_word: רֹפֵא
  choice: 医生
  rationale: 原词指施行医治的人。“医生”符合上下文的医药意象，也是现代中文最自然、清楚的表达。
- source_word: שָׁם
  choice: 那里
  rationale: 回指基列，直接译出地点副词。
- source_word: כִּי מַדּוּעַ
  choice: 那么……为何
  rationale: 该组合承接前两个反问并引出推论。“那么……为何”体现论证关系，也符合自然中文。
- source_word: לֹא עָלְתָה
  choice: 还没有得到
  rationale: עלה字面可指“上升”，但与אֲרֻכָה搭配时表示医治或康复尚未出现、实现。中文以“还没有得到医治”自然表达其结果意义。
- source_word: אֲרֻכַת
  choice: 医治
  rationale: 该名词可指医治、康复或健康的恢复。“医治”与乳香和医生的意象连贯，同时在脚注保留“康复、复原”的可能。
- source_word: בַּת עַמִּי
  choice: 我百姓的女儿
  rationale: 保留先知文学中的人格化称谓及其哀歌色彩，不将其扁平化为单纯的“我的百姓”。
theological_decisions:
- issue: 是否把“我百姓的女儿”意译为“我的百姓”或“我亲爱的百姓”
  choice: 正文保留“我百姓的女儿”
  alternative: 我的百姓／我亲爱的百姓
  rationale: 原文以女性形象人格化群体，具有鲜明的先知文学与哀叹色彩。保留这一表达可避免消解其文学张力，也不额外限定所指或引入神学解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。两个“难道没有”保留原文连续反问的力度；“那么……为何”呈现其推论关系。“我百姓的女儿”刻意保留原文的人格化意象。
