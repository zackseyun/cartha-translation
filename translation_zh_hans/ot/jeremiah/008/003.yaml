source:
  edition: WLC
  text: וְ/נִבְחַ֥ר מָ֨וֶת֙ מֵֽ/חַיִּ֔ים לְ/כֹ֗ל הַ/שְּׁאֵרִית֙ הַ/נִּשְׁאָרִ֔ים מִן הַ/מִּשְׁפָּחָ֥ה הָֽ/רָעָ֖ה הַ/זֹּ֑את בְּ/כָל הַ/מְּקֹמ֤וֹת הַ/נִּשְׁאָרִים֙ אֲשֶׁ֣ר הִדַּחְתִּ֣י/ם שָׁ֔ם נְאֻ֖ם יְהוָ֥ה צְבָאֽוֹת־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/008/003.yaml
  text: And death will be chosen rather than life by all the remnant who remain from this evil family[a], in all the places where the remnant remain, where I have driven them—declares Yahweh of hosts.
translation:
  language: zh_hans
  text: 这邪恶族类中所有剩下的余民，在我把他们赶逐到的一切余留之地[a]，都将宁可选择死亡，也不选择生命。这是万军之雅威的宣告。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译：“在所有余留之地，就是我把他们赶逐到那里的地方。”原文再次使用“余留”一词，与前面的“余民”和“剩下的”相呼应；这种不寻常的重复强调幸存者分散在各个被逐之地。
    reason: 说明原文对“余留”的重复，以及“余留之地”这一较不寻常的句法表达。
lexical_decisions:
- source_word: וְנִבְחַר מָוֶת מֵחַיִּים
  choice: 宁可选择死亡，而不选择生命
  rationale: 原文以被动形式直陈“死亡比生命更被选择”。汉语若照搬被动结构会十分生硬，因此改用主动表达，同时保留“死亡／生命”和“选择”的鲜明对照；“宁可……而不……”传达介词 מִן 所表示的取舍比较。
- source_word: לְכֹל הַשְּׁאֵרִית הַנִּשְׁאָרִים
  choice: 所有剩下的余民
  rationale: שְׁאֵרִית 译作“余民”，保留先知书中“剩余群体”的语义；并用“剩下的”呈现同根词重复。这里的余民仍处于审判之下，译文不把该词解释成必然带有希望的称谓。
- source_word: מִן הַמִּשְׁפָּחָה הָרָעָה הַזֹּאת
  choice: 这邪恶族类中
  rationale: מִשְׁפָּחָה 可指家庭、宗族或族群；语境涉及被驱散的整体人群，因此“族类”比现代汉语的“家庭”更不易造成狭义误解，同时保留群体亲属关系的含义。רָעָה 直译为“邪恶”。
- source_word: אֲשֶׁר הִדַּחְתִּים שָׁם
  choice: 就是我把他们赶到的地方
  rationale: 使役式 הִדַּחְתִּים 表示赶逐、驱散；“赶到”保留神施行审判的力度，也自然表达这些余民目前所在之地。
- source_word: נְאֻם יְהוָה צְבָאוֹת
  choice: 这是万军之雅威的宣告
  rationale: נְאֻם 是先知性宣告套语。“雅威”按 יְהוָה 的通行学术拟音呈现神名；“万军之”保留 צְבָאוֹת 的丰富称号含义，不将其限缩为某一种军队。
theological_decisions:
- issue: יְהוָה 神名的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名。译作“雅威”较接近 Yahweh 的拟音，并保留其作为专名的性质；不以称号取代，也不采用源自 Jehovah 传统形式的拟音。
- issue: “余民”在本节中的神学张力
  choice: 保留“余民”，同时译出“剩下的”
  alternative: 幸存者；剩余的人
  rationale: “余民”能保留 שְׁאֵרִית 在先知文学中的呼应，但本节描写的是仍在审判和流亡中的人，并非自动带有得救或复兴的正面含义。译文不消解这种张力。
- issue: 选择死亡的表达主体
  choice: 由余民主动“选择死亡”
  alternative: “死亡将被选择”这一形式被动表达
  rationale: 原文的被动式没有明说施事者，但 לְכֹל הַשְּׁאֵרִית 在语境中指向作出选择的余民。汉语主动句较自然，且不把“选择”改写为神判定他们死亡，从而避免增加原文没有明说的神学因果。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“宁可选择死亡，而不选择生命”保留原文冷峻的修辞对照；“这是……的宣告”呈现先知宣告公式。句序略作调整，使地点短语在汉语中清楚修饰被驱散的余民，而不掩盖希伯来文较生硬的“余下的地方”，该点由脚注交代。
