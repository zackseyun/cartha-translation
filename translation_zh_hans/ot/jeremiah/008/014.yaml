  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: עַל מָה֙ אֲנַ֣חְנוּ יֹֽשְׁבִ֔ים הֵֽאָסְפ֗וּ וְ/נָב֛וֹא אֶל עָרֵ֥י הַ/מִּבְצָ֖ר וְ/נִדְּמָה שָּׁ֑ם כִּי֩ יְהוָ֨ה אֱלֹהֵ֤י/נוּ הֲדִמָּ֨/נוּ֙ וַ/יַּשְׁקֵ֣/נוּ מֵי רֹ֔אשׁ כִּ֥י חָטָ֖אנוּ לַ/יהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/008/014.yaml
  text: Why are we sitting still? Gather yourselves[a], and let us enter the fortified cities and perish there, for Yahweh our God has doomed us and given us poisoned water to drink[b], because we have sinned against Yahweh.
translation:
  language: zh_hans
  text: 我们为什么还坐着不动？聚集起来吧！让我们进入坚固的城邑，在那里灭亡[a]。因为耶和华我们的上帝已使我们灭亡，又给我们毒水喝[b]；这是因为我们得罪了耶和华。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “灭亡”也可译作“静默”“止息”或“被毁灭”；这里的希伯来语动词可表示静默、静止或毁灭。
    reason: lexical_alternative
  - marker: b
    text: 直译“毒物之水”，也可理解为“苦毒之水”。
    reason: lexical_alternative
lexical_decisions:
- source_word: יֹשְׁבִים
  choice: 坐着不动
  rationale: 原义为“坐着、居住、停留”；在反问中指消极地留在原处。“坐着不动”既保留具体意象，也自然表达无所行动的语气。
- source_word: הֵאָסְפוּ
  choice: 你们聚集起来吧
  rationale: Nifal祈使式在此是召集众人集合的命令；此译法保留复数对象和紧迫的号召语气。
- source_word: עָרֵי הַמִּבְצָר
  choice: 坚固城
  rationale: 指设有防御工事、可供避难的城邑；“坚固城”简洁、自然，并保留军事防御含义。
- source_word: וְנִדְּמָה
  choice: 在那里灭亡
  rationale: דמה可涉及静默、止息或毁灭；侵袭、避入坚城及审判的上下文支持“灭亡”，但其词义张力在脚注中保留。
- source_word: הֲדִמָּנוּ
  choice: 已使我们灭亡
  rationale: 这是与וְנִדְּמָה同根的使役形式，表示耶和华使百姓归于毁灭。重复“灭亡”保留原文的同根呼应。
- source_word: מֵי רֹאשׁ
  choice: 毒水
  rationale: רֹאשׁ在此指有毒或极苦的植物、物质；“毒水”在现代汉语中清楚传达具体的致害意象，直译信息另见脚注。
- source_word: חָטָאנוּ לַיהוָה
  choice: 我们得罪了耶和华
  rationale: 介词结构表示犯罪所针对的对象；“得罪了”是自然现代汉语，并准确表达对耶和华的冒犯。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文读者熟悉的神圣名字译写“耶和华”，而不以“主”这一称号替代专名。
theological_decisions:
- issue: 两个דמה词形中的审判含义
  choice: 将百姓的话译为“在那里灭亡”，并将耶和华的行动译为“已使我们灭亡”
  alternative: 可译为“在那里沉寂／止息”及“已使我们沉寂／归于寂静”
  rationale: 同一词根既可表达静默、止息，也可在语境中表达被毁灭。坚固城、毒水和认罪共同支持毁灭性的审判含义；脚注则保留真实存在的词义歧义，避免将另一可能完全抹去。
- issue: 耶和华使百姓灭亡与百姓犯罪之间的关系
  choice: 保留“因为……；这是因为……”的因果陈述
  alternative: 弱化为耶和华仅仅容许灾祸发生
  rationale: 原文明确以使役动词描述耶和华的行动，又以百姓的罪说明原因；译文不把使役弱化为许可，也不添加超出经文的系统神学解释。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。用反问、祈使和共同劝告再现原文由迟疑转向集体行动的语势；以“坚固城”“毒水”等普通读者易懂的词语保存战争与审判意象，并通过脚注交代关键希伯来词的歧义。
