  text: קַוֵּ֥ה לְ/שָׁל֖וֹם וְ/אֵ֣ין ט֑וֹב לְ/עֵ֥ת מַרְפֵּ֖ה וְ/הִנֵּ֥ה בְעָתָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/008/015.yaml
  text: We hoped for peace[a], but there was no good; for a time of healing, but behold[c][b], terror.
translation:
  language: zh_hans
  text: 我们盼望[a]平安[b]，却没有好事；盼望医治的时候，但看哪[c]，竟是惊恐[d]！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “盼望”也可译作“等候”或“期待”。原文动词在此兼有这些意味。
    reason: lexical_alternative
  - marker: b
    text: “平安”也可包括安康、福祉、圆满的状态，不仅指没有争战。
    reason: lexical_alternative
  - marker: c
    text: “看哪”是原文用来突然引出眼前情形、加强反转语气的词；也可译作“不料”。
    reason: lexical_alternative
  - marker: d
    text: “惊恐”也可译作“惊惶”或“恐惧”。
    reason: lexical_alternative
lexical_decisions:
- source_word: קַוֵּה
  choice: 我们盼望
  rationale: 该形式单独来看可有形态歧义，也可带有等候、期待或盼望的意味；结合上下文的群体哀歌语气，采用第一人称复数“我们盼望”，同时以脚注保留“等候、期待”的可能。
- source_word: לְשָׁלוֹם
  choice: 平安
  rationale: שָׁלוֹם可指和平、安康、福祉或完整状态。“平安”在现代汉语中自然庄重，也能与后文的惊恐形成鲜明对照；其较宽的语义范围在脚注说明。
- source_word: וְאֵין טוֹב
  choice: 却没有福祉
  rationale: 原文直译为“而没有好（事）”。“福祉”比“好处”更适合此处关乎全民安康的哀歌语境，同时保留טוֹב概括性的“美好、福乐”含义。连接词按平行句中的转折关系译作“却”。
- source_word: לְעֵת מַרְפֵּה
  choice: 盼望医治的时刻
  rationale: מַרְפֵּה可指医治、痊愈或恢复。“医治”保留其开放的比喻空间，可同时涵盖身体、社会与国家的复原；“时刻”明确表达עֵת的时间含义。第二个“盼望”依照希伯来诗句的省略和平行结构补出，使汉语完整而不过度解释。
- source_word: וְהִנֵּה
  choice: 却看哪
  rationale: הִנֵּה用于突然引出眼前的反转。“看哪”保留其指示和修辞冲击力；“却”表达上下句本有的强烈逆转。
- source_word: בְעָתָה
  choice: 惊恐
  rationale: 该词表示恐惧、惊惶或因突发灾祸而产生的骇怕。“惊恐”简洁有力，并与所盼望的平安和医治形成对照。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的哀歌语体。两次“盼望”构成平行，随后用“却”突出期待与现实的反转；保留“看哪”的先知性修辞力度，并通过脚注呈现关键希伯来词的语义幅度。
