id: JER.8.4
reference: Jeremiah 8:4
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/אָמַרְתָּ֣ אֲלֵי/הֶ֗ם כֹּ֚ה אָמַ֣ר יְהוָ֔ה הֲ/יִפְּל֖וּ וְ/לֹ֣א יָק֑וּמוּ אִם יָשׁ֖וּב וְ/לֹ֥א יָשֽׁוּב־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/008/004.yaml
  text: 'You shall say to them[a], ‘Thus says Yahweh: Do people fall and not rise again? Does one turn away and not return?’'
translation:
  language: zh_hans
  text: 你要对他们说：“雅威如此说：人跌倒，岂不起来？人转离，岂不回转？[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“人转身，岂不转回来？”希伯来文两次使用同一个动词，意为“转／回转”，形成修辞上的重复。
    reason: 保留שׁוב重复所产生的词义双关及另一种自然译法。
lexical_decisions:
- source_word: וְאָמַרְתָּ אֲלֵיהֶם
  choice: 你要对他们说
  rationale: 这是对耶利米的直接吩咐；“要……说”自然地表达希伯来语完成式在先知命令语境中的指令意味，句首连接词不必机械译出。
- source_word: כֹּה אָמַר יְהוָה
  choice: 雅威如此说
  rationale: 保留标准的先知使者宣告格式，并用“雅威”音译上帝的专名。
- source_word: הֲיִפְּלוּ וְלֹא יָקוּמוּ
  choice: 人跌倒，岂不起来？
  rationale: 疑问词引出反问；第三人称复数在此表达普遍经验，汉语用泛指的“人”简洁自然。“起来”准确表达跌倒后重新站起。
- source_word: אִם יָשׁוּב וְלֹא יָשׁוּב
  choice: 人转离，岂不回转？
  rationale: אִם在平行结构中引出第二个反问。两个יָשׁוּב来自同一词根שׁוב；结合上下文，前者可指转离原路，后者指转回来。“转离／回转”既显出方向上的对照，也保留词根呼应。
- source_word: יְהוָה
  choice: 雅威
  rationale: 原文直接使用四字神名；译作“雅威”以保留其作为专名的性质，而不以头衔替代。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: “雅威”较直接地按学界通常重构的读音音译四字神名，并避免将专名改成“主”这一头衔。
- issue: שׁוב在第二个反问中的方向含义
  choice: 前一处译“转离”，后一处译“回转”
  alternative: 两处都可理解为“转身／转回”
  rationale: 原文有意重复同一动词，语义可随方向和语境变化。正文呈现转离后回返的对照，同时用脚注保留更贴近形式重复的译法，不把此处直接限定为某种教义性的“悔改”。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“岂不”保持先知反问的力度，且不过分古雅；两个简短问句保留原文的平行节奏。
