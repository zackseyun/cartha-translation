  naturalness: 整体庄重清楚。将“我百姓女儿”调整为“我百姓的女儿”，并将“遥远之地”改为“遥远的国土”，可使现代汉语的领属和“从一地而来”的空间表达更顺畅，同时保留诗性意象。
  terminology: “雅威”“锡安”“王”“雕刻偶像”均适切。“外邦那些虚妄之物”保留了הֶבֶל对偶像的贬抑意味，且不把语义过度限定；脚注可说明其亦可指外邦偶像。
