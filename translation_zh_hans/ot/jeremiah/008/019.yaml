  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: הִנֵּה ק֞וֹל שַֽׁוְעַ֣ת בַּת עַמִּ֗/י מֵ/אֶ֨רֶץ֙ מַרְחַקִּ֔ים הַֽ/יהוָה֙ אֵ֣ין בְּ/צִיּ֔וֹן אִם מַלְכָּ֖/הּ אֵ֣ין בָּ֑/הּ מַדּ֗וּעַ הִכְעִס֛וּ/נִי בִּ/פְסִלֵי/הֶ֖ם בְּ/הַבְלֵ֥י נֵכָֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/008/019.yaml
  text: 'Look—the cry of the daughter of my people from a distant land: “Is Yahweh not in Zion? Is her King not in her?” Why have they provoked me to anger with their carved images[c][b][a], with foreign idols?'
translation:
  language: zh_hans
  text: 看哪，我百姓的女儿从遥远的国土传来哀号声[a][b]：“雅威不在锡安吗？她的王不在她中间吗？”“他们为什么用他们的雕刻偶像、用外邦那些虚妄之物激怒我呢？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“我百姓的女儿哀号的声音。”
    reason: lexical_alternative
  - marker: b
    text: 原文作“从遥远的国土”，其中“遥远”采用复数形式，强调距离极远。
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: 看哪
  rationale: 作为引起注意的感叹词，保留原文突然而迫切的语气；“看哪”庄重而仍为现代读者所理解。
- source_word: קוֹל שַׁוְעַת
  choice: 哀求声
  rationale: 原文直译为“哀求的声音”；“哀求声”简洁地传达困苦中的呼求，同时避免汉语赘复。
- source_word: בַּת עַמִּי
  choice: 我百姓的女儿
  rationale: 保留先知文学中的亲属和女性拟人意象，不将其解释性地改写成单纯的“我的百姓”。
- source_word: מֵאֶרֶץ מַרְחַקִּים
  choice: 从遥远之地传来
  rationale: 原文表达来自极远之地；补出汉语语境自然需要的“传来”，说明声音的来向而不改变命题内容。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见音译呈现四字神名，区别于称号“主”，并保留原文专名的性质。
- source_word: אִם מַלְכָּהּ אֵין בָּהּ
  choice: 她的王不在其中吗
  rationale: 保留锡安作为女性实体的拟人化和第二个反问；“其中”使现代汉语较自然，又不把王解释为人间君王。
- source_word: הִכְעִסוּנִי
  choice: 激怒我
  rationale: 准确表达使役形态“使我发怒”，用语简洁自然。
- source_word: בִּפְסִילֵיהֶם
  choice: 用自己雕刻的神像
  rationale: 保留 פֶּסֶל 所指向的雕刻或凿制形象，比笼统的“偶像”更具体。
- source_word: בְּהַבְלֵי נֵכָר
  choice: 用外邦那些虚妄之物
  rationale: 保留 הֶבֶל 的空虚、无价值之讥讽及 נֵכָר 的外来性，同时不在正文中把其含义完全收窄为“偶像”。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；音译“雅威”保留专名性质，不以称号取代，也不依赖较晚形成的混合读音。
- issue: “她的王”所指为何
  choice: 保留“她的王”，让与雅威平行的上下文显示所指
  alternative: 明确译作“雅威这位王”；理解为人间君王
  rationale: 两个平行反问强烈暗示王就是锡安的神圣君王，但原文没有重复神名；译文保留代词和称号，既呈现这种关联，也不增添解释。
- issue: 末句与前面呼声的说话者转换
  choice: 用第二组引号标示雅威的回应
  alternative: 全句置于同一引语中；不加引号
  rationale: 人称从谈论雅威转为“激怒我”，表明说话者发生转换；分开引语有助于现代读者辨认，但不额外标明说话者身份。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。保留“我百姓的女儿”和“她的王”等先知文学意象；以“哀求声”“激怒”等日常可懂的表达避免过度文言化。引号区分百姓的呼喊与雅威的回应，正文中的所有脚注标记均与脚注对应。
