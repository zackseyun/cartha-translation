base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/008/007.yaml
  text: Even the stork in the heavens knows her appointed times, and the turtledove, the swift, and the crane keep the time of their coming; but my people do not know the judgment of the LORD.
translation:
  language: zh_hans
  text: 连天上的鹳也知道自己的定期；斑鸠、雨燕和鹤都谨守它们来临的时节；我的子民却不知道耶和华的法则。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “法则”或译“审判”、“判决”、“公正”或“典章”。“雨燕”和“鹤”所对应的希伯来鸟名，具体物种不能完全确定，也有其他译法。
    reason: 保留מִשְׁפָּט的多义性，并说明סוּס和עָגוּר的物种辨识不确定性。
lexical_decisions:
- source_word: חֲסִידָה
  choice: 鹳
  rationale: 该词通常指鹳；保留明确的鸟类名称及其按季迁徙的意象。
- source_word: מוֹעֲדֶיהָ
  choice: 自己迁徙的定期
  rationale: מוֹעֵד指规定或约定的时节；结合候鸟语境补出“迁徙”，使现代读者明白所指，同时保留“定期”的秩序意味。
- source_word: תֹר
  choice: 斑鸠
  rationale: 常见而准确的对应，且在圣经鸟类语境中自然。
- source_word: סוס
  choice: 雨燕
  rationale: 此处为鸟名，但具体物种存在古老的词义辨识问题；采用符合迁徙语境的“雨燕”，并在脚注说明异译。
- source_word: עָגוּר
  choice: 鹤
  rationale: 传统且语境合适的鸟名对应；具体物种并非完全确定。
- source_word: עֵת בֹּאָנָה
  choice: 归来的时节
  rationale: 字面为“它们来到的时间”；在候鸟迁徙语境中，“归来”自然表达按季到来的意思。
- source_word: מִשְׁפַּט יְהוָה
  choice: 耶和华的法则
  rationale: מִשְׁפָּט可指审判、判决、公正或规范性要求；这里与动物遵守既定时节对照，译作“法则”较贴合语境，同时以脚注保留其他可能。
theological_decisions:
- issue: מִשְׁפַּט在本节是“审判”还是“法则/要求”
  choice: 法则
  alternative: 审判；公正；典章
  rationale: 上下文责备百姓不认识耶和华所定的正道，与候鸟认识并遵守时节形成对照。“法则”能表达规范意义，但不排除该词所带的司法和审判色彩，故加脚注保存张力。
- issue: 神名יהוה的译法
  choice: 耶和华
  alternative: 雅威；上主
  rationale: 采用现代简体中文圣经读者广泛熟悉的专名形式，明确呈现原文神名，而不将其泛化为普通称号。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。用分号呈现前后强烈对比；“连……也……”再现גַּם的强调。“迁徙”和“归来”属于语境性明示，帮助普通读者理解候鸟意象，但不改变经文论点。
