lexical_decisions:
- source_word: מַבְלִיגִיתִי
  choice: 无法缓解
  rationale: 此词形及其句法关系十分疑难，词根通常涉及使自己振作、获得舒缓或恢复力量。结合哀歌语境，以“无法缓解”表达安慰或舒缓未能临到的意思，同时用脚注保留其他可能理解。
- source_word: עֲלֵי יָגוֹן
  choice: 我的悲痛
  rationale: יָגוֹן指悲伤、愁苦；עֲלֵי字面为“在……之上/临到”，但本句结构高度凝缩。中文将其整合为“我的悲痛”，使诗句自然，并避免对介词关系作过度确定的解释。
- source_word: עָלַי לִבִּי דַוָּי
  choice: 我的心在我里面病弱
  rationale: לִבִּי是作为内在自我与情感中心的“我的心”；דַוָּי表示患病、衰弱。עָלַי字面近于“在我身上”，此处按体验性的内在状态译作“在我里面”。“病弱”兼顾疾病与衰颓的意象。
