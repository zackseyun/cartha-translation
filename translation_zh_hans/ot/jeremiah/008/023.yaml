  text: מִֽי יִתֵּ֤ן רֹאשִׁ/י֙ מַ֔יִם וְ/עֵינִ֖/י מְק֣וֹר דִּמְעָ֑ה וְ/אֶבְכֶּה֙ יוֹמָ֣ם וָ/לַ֔יְלָה אֵ֖ת חַֽלְלֵ֥י בַת עַמִּֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/008/023.yaml
  text: Oh[a], that my head were water, and my eyes a fountain of tears, so that I might weep day and night for the slain of the daughter of my people.
translation:
  language: zh_hans
  text: 但愿我的头化为水，我的眼睛成为泪水的泉源[a]，好让我昼夜为我百姓之女的被杀者哭泣。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来原文直译可作：“谁能使我的头成为水，我的眼睛成为眼泪的泉源？”开头是表达愿望的惯用语；“眼睛”在原文中为单数。
    reason: 说明希伯来语愿望惯用式及单数“眼”，并提供较贴近形式的译法。
lexical_decisions:
- source_word: מִי יִתֵּן
  choice: 但愿
  rationale: 这是表达强烈愿望和哀叹的希伯来语惯用式，并非真正询问“谁会给”；“但愿”自然保留其愿望语气和诗性。
- source_word: רֹאשִׁי מַיִם
  choice: 我的头变成水
  rationale: 保留原文大胆的身体意象；在汉语中补出“变成”，使愿望句自然清楚。
- source_word: וְעֵינִי מְקוֹר דִּמְעָה
  choice: 我的眼成为泪泉
  rationale: “眼”依照希伯来语单数形式，“泪泉”凝练地表达“眼泪的泉源”，并保留诗歌平行结构。
- source_word: וְאֶבְכֶּה
  choice: 好让我……哭泣
  rationale: 承接愿望式，表达所愿结果或目的，符合原文意愿语气。
- source_word: יוֹמָם וָלַיְלָה
  choice: 昼夜
  rationale: 自然简洁地保留表示持续不断的时间总括。
- source_word: חַלְלֵי
  choice: 被杀的人
  rationale: 此处指遭杀戮而死的人；现代汉语比“被杀者”更自然，也比泛称“伤亡者”准确。
- source_word: בַת עַמִּי
  choice: 我百姓之女
  rationale: 保留先知文学中的女性人格化意象，不将其扁平化为单纯的“我的百姓”。
theological_decisions:
- issue: 是否将 בַת עַמִּי 的先知性人格化表达改写为非比喻说法
  choice: 保留为“我百姓之女”
  alternative: 我的百姓；我亲爱的百姓
  rationale: 原短语将群体人格化为女子，具有重要的文学和情感作用；保留该张力可避免加入解释性神学判断。
translation_notes:
  register: 采用现代、庄重而易懂的哀歌体。“但愿”“昼夜”“泪泉”保持诗性；“被杀的人”避免过度古雅。“我百姓之女”刻意保留原文较陌生的人格化表达，并用脚注交代相关形式。
