base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/008/008.yaml
  text: How can you say[a], ‘We are wise, and the law of Yahweh is with us’? But look, the lying pen of the scribes has made it into a lie.
translation:
  language: zh_hans
  text: 你们怎么能说：“我们有智慧，耶和华的律法与我们同在”？然而，看哪，文士虚假的笔竟把它变成了虚假。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本句希伯来文十分紧凑，也可译作：“看哪，文士的笔制造了虚假”，或“文士虚假的笔行了虚假之事。”原文容许不止一种方式来表达文士的篡改或弄虚作假。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵיכָה תֹאמְרוּ
  choice: 你们怎么能说
  rationale: אֵיכָה在这里引出带有责问和难以置信语气的反问；“怎么能说”比单纯的“怎么说”更自然地传达这种力度。
- source_word: חֲכָמִים אֲנַחְנוּ
  choice: 我们有智慧
  rationale: 直陈其自称有智慧；现代汉语自然易懂，也不把חֲכָמִים过度专门化为某一阶层的“智者”。
- source_word: תוֹרַת יְהוָה
  choice: 耶和华的律法
  rationale: תּוֹרָה既可指教导，也具有圣约律法和成文训诲的含义；本节涉及文士及书写，采用“律法”保留其圣约与文本层面的分量。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的专名形式表达四字神名，而不以泛称“主”取代。
- source_word: אִתָּנוּ
  choice: 与我们同在
  rationale: 直接保留介词“与……同在”的基本含义，不进一步断定其意为“属于我们”或“在我们中间”。
- source_word: אָכֵן הִנֵּה
  choice: 然而，看哪
  rationale: אָכֵן在这里引出强烈反驳，הִנֵּה要求听者注意；“然而，看哪”兼顾转折、强调和庄重语体。
- source_word: עֵט
  choice: 笔
  rationale: 指书写工具；“笔”是现代中文最通俗自然的对应词，不必技术化为“铁笔”或“尖笔”。
- source_word: שֶׁקֶר סֹפְרִים
  choice: 文士虚假的笔
  rationale: 希伯来语结构紧凑，可理解为以“虚假”描述文士的笔；此译保留对文士书写活动的指控，同时不把含混句法完全消解。
- source_word: לַשֶּׁקֶר עָשָׂה
  choice: 竟把它变成了谎言
  rationale: 将לַשֶּׁקֶר理解为结果，עָשָׂה译作“变成”；“竟”传达反驳中的震惊语气，“它”按上下文指耶和华的律法。
theological_decisions:
- issue: 先知责难中תּוֹרַת יְהוָה的译法
  choice: 耶和华的律法
  alternative: 耶和华的教导
  rationale: 此处既关乎耶和华的训诲，也关乎文士对其文本的处理。“律法”较能保留圣约和成文传统的语义重量，但“教导”在词义上仍属可能。
- issue: 文士的笔与律法成为“谎言”的关系
  choice: 文士虚假的笔竟把它变成了谎言
  alternative: 文士的笔行了虚假之事
  rationale: 正文采用结果式理解，呈现文士的书写使他们所声称拥有的律法遭到歪曲；但原文并未说明具体机制，且紧凑句法允许把重点放在文士之笔本身行事虚假，因此以脚注保留其他读法。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“看哪”保留先知言辞中的指示和强调功能；引语使用中文全角标点。脚注标记置于整句之后，与正文中的解释对象相连。
