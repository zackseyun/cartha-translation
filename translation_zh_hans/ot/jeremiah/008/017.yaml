base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/008/017.yaml
  text: For behold[a], I am sending among you snakes, vipers that cannot be charmed, and they will bite you[b], declares Yahweh.
translation:
  language: zh_hans
  text: 因为，看哪，我要把蛇、毒蛇[a]放到你们中间；它们无法用咒语制伏[b]，必咬你们——这是雅威的宣告。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “毒蛇”所译的希伯来词指一种有毒的蛇；具体是哪一种蛇并不确定。
    reason: lexical_alternative
  - marker: b
    text: 直译：“对它们没有咒语。”指没有咒语或制蛇术能控制这些蛇。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 保留其承接上文、说明缘由的连接作用。
- source_word: הִנְנִי
  choice: 看哪，我要
  rationale: 表达指示和强调，并与分词连用所传达的迫近、确定行动相配；“看哪”庄重而易懂。
- source_word: מְשַׁלֵּחַ
  choice: 放到
  rationale: 结合蛇被放入百姓中间的意象，译作“放到”比机械的“差遣”更自然，同时保留主动施行审判之意。
- source_word: בָּכֶם
  choice: 你们中间
  rationale: 保留介词表示进入群体内部的空间意象，而不直接释义为“攻击你们”。
- source_word: נְחָשִׁים
  choice: 蛇
  rationale: 采用现代汉语中普通、准确的总称。
- source_word: צִפְעֹנִים
  choice: 毒蛇
  rationale: 该词指危险的有毒蛇类，但具体物种难以确定；“毒蛇”清楚表达核心语义。
- source_word: אֲשֶׁר אֵין לָהֶם לָחַשׁ
  choice: 这些蛇无法用咒语制伏
  rationale: לָחַשׁ涉及低声念出的咒语或制蛇术；此译自然表达这些蛇不能被此类手段控制，同时以脚注保留字面形式。
- source_word: וְנִשְּׁכוּ אֶתְכֶם
  choice: 它们必咬你们
  rationale: 准确保留动词“咬”的具体含义；“必”体现此处未来行动的确定性。
- source_word: נְאֻם יְהוָה
  choice: 这是雅威的宣告
  rationale: 以庄重、自然的汉语再现先知宣告公式，并将四字神名音译为“雅威”。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；采用“雅威”以保留专名性质，不以称号取代。
- issue: 蛇是否纯属比喻
  choice: 不在正文中指明所象征的对象
  alternative: 释译为敌军、审判者或实际蛇群
  rationale: 本节以蛇和毒蛇表达不可制伏、必然临到的审判，但未在句内明确说明其具体所指，因此保留原文的意象与张力。
translation_notes:
  register: 采用现代、庄重且可朗读的标准普通话。“因为，看哪”保留原文连接词与强调语气；破折号突出结尾的先知宣告公式。将“蛇，就是毒蛇”理解为后项对前项的具体说明，而非两类彼此不同的蛇。
