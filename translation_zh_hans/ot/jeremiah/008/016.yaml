  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: מִ/דָּ֤ן נִשְׁמַע֙ נַחְרַ֣ת סוּסָ֗י/ו מִ/קּוֹל֙ מִצְהֲל֣וֹת אַבִּירָ֔י/ו רָעֲשָׁ֖ה כָּל הָ/אָ֑רֶץ וַ/יָּב֗וֹאוּ וַ/יֹּֽאכְלוּ֙ אֶ֣רֶץ וּ/מְלוֹאָ֔/הּ עִ֖יר וְ/יֹ֥שְׁבֵי בָֽ/הּ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/008/016.yaml
  text: From Dan is heard the snorting of his horses[a]; at the sound of the neighing of his stallions the whole land quakes. They come and devour the land and its fullness[c][b], the city and those who dwell in it.
translation:
  language: zh_hans
  text: 从但传来他马匹的喷鼻声；一听见他壮马[a]的嘶鸣声，全地[b]都震动。他们前来，吞噬这地和其中的一切[c]，以及城和城里的居民。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “壮马”也可译作“骏马”或“强健的马”。原文用词带有强壮、威武之意，在这里指战马。
    reason: lexical_alternative
  - marker: b
    text: “全地”也可译作“整个大地”。希伯来语 אֶרֶץ 既可指一片国土，也可指大地；这里的直接语境是入侵带来的毁灭。
    reason: lexical_ambiguity
  - marker: c
    text: “其中的一切”直译为“充满它的”，指这地所容纳的一切。
    reason: idiomatic_clarification
lexical_decisions:
- source_word: מִדָּן
  choice: 从但
  rationale: מִן表示声音传来的源头；但位于北部边境，是入侵者南下时首先传来动静之处。保留地名“但”。
- source_word: נִשְׁמַע נַחְרַת סוּסָיו
  choice: 他的马喷鼻的声音……传来
  rationale: נִשְׁמַע为被动感知用法，נַחְרַת指马粗重的喷鼻声。译文保留第三人称阳性单数所属后缀“他的”，不擅自明确其所指。
- source_word: מִצְהֲלוֹת אַבִּירָיו
  choice: 他的壮马嘶鸣
  rationale: מִצְהֲלוֹת指马高声嘶鸣；אַבִּירָיו在马匹语境中指强健有力的马。“壮马”兼顾力量意味与具体语境。
- source_word: רָעֲשָׁה כָּל הָאָרֶץ
  choice: 震动全地
  rationale: רעש表示震动、战栗；אֶרֶץ既可指当地国土，也可泛指大地。正文用“全地”保留一定幅度，并以脚注说明另一理解。
- source_word: וַיָּבֹאוּ וַיֹּאכְלוּ
  choice: 他们前来，吞噬
  rationale: 连续式动词推进先知所见的场景；“吞噬”保留“吃掉”的强烈比喻，表现侵略军造成的毁灭。阳性复数主语按入侵者译为“他们”。
- source_word: אֶרֶץ וּמְלוֹאָהּ
  choice: 这地和其中的一切
  rationale: מְלוֹאָהּ直指充满这地的一切事物；采用现代汉语自然表达，同时在脚注保留较贴近原文意象的说法。
- source_word: עִיר וְיֹשְׁבֵי בָהּ
  choice: 城和城里的居民
  rationale: 准确表达城市及居住其中的人；用现代、庄重而清楚的汉语，避免不必要的古雅措辞。
theological_decisions:
- issue: 第三人称单数所属后缀所指
  choice: 保留“他的马／他的壮马”
  alternative: 译作“敌军的马／敌军的壮马”
  rationale: 原文并未在本节内明说“他”是谁；保留代词可避免把上下文推断直接写入正文。
- issue: 复数主语的身份
  choice: 译作“他们”，理解为来犯者
  alternative: 译作“它们”，理解为前述马匹
  rationale: “前来、吞噬这地和城”的复数行动者在侵略语境中自然是入侵军队；但译文不进一步点明民族或首领，以免超出原文。
translation_notes:
  register: 采用现代、庄重、易懂的先知文学语体。“喷鼻”“嘶鸣”“震动”“吞噬”保持原文鲜明而强烈的听觉与毁灭意象；句法紧凑，以分号和逗号呈现声音逼近、全地震动、敌军吞噬的推进感。
