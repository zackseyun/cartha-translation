  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: עַל שֶׁ֥בֶר בַּת עַמִּ֖/י הָשְׁבָּ֑רְתִּי קָדַ֕רְתִּי שַׁמָּ֖ה הֶחֱזִקָֽתְ/נִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/008/021.yaml
  text: For the brokenness of the daughter of my people I am broken[a]; I mourn[c][b]; horror has seized me.
translation:
  language: zh_hans
  text: 因我百姓之女的破碎，我也破碎了[a]；我哀恸[b]；惊骇抓住了我。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “破碎”和“我也破碎了”在希伯来文中出自同一个词根，形成刻意的呼应；也可译作：“因我百姓之女的崩毁，我也崩溃了。”
    reason: lexical_alternative
  - marker: b
    text: 或译：“我陷入阴沉。”希伯来文动词含有变暗、阴沉的意象，在这里表达悲哀、举哀。
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל
  choice: 因
  rationale: 在本句中引出说话者悲痛的缘由；“因”简洁自然，也保留因果关系。
- source_word: שֶׁבֶר
  choice: 破碎
  rationale: 此词指破裂、崩毁，也可引申为群体所遭的灾难；译作“破碎”能与下句同根动词形成刻意的词语呼应。
- source_word: בַּת עַמִּי
  choice: 我百姓之女
  rationale: 保留先知文学中把百姓人格化为女儿的表达，不将其解释性改写为“我亲爱的百姓”。
- source_word: הָשְׁבָּרְתִּי
  choice: 我也破碎了
  rationale: 与 שֶׁבֶר 同根，原文以百姓的“破碎”和说话者的“破碎”构成双关；加入“也”自然呈现二者的呼应，而不增添新的神学判断。
- source_word: קָדַרְתִּי
  choice: 我哀恸
  rationale: 该动词本有变暗、阴沉之意，在哀歌语境中表达因悲伤而陷入幽暗、举哀；“哀恸”是自然庄重的中文，暗色意象另以脚注说明。
- source_word: שַׁמָּה
  choice: 惊骇
  rationale: 此名词可表示骇异、恐怖或令人震惊的状态；“惊骇”既可指强烈情绪，也保留原词的震慑力度。
- source_word: הֶחֱזִקַתְנִי
  choice: 抓住了我
  rationale: חזק 的使役式在此表达某种惊骇牢牢攫住说话者；“抓住了我”直观有力，并保持原句拟人化结构。
theological_decisions:
- issue: 说话者身份
  choice: 沿用第一人称“我”，不在正文中指明是耶利米还是耶和华
  alternative: 明确译为“我耶利米”或按特定解释认定为耶和华
  rationale: 本节希伯来文本只出现第一人称，近段话语中的说话者辨识存在解释张力；译文不应替原文消除这种含混。
- issue: “我百姓之女”的所指
  choice: 保留人格化称呼
  alternative: 直接释作“犹大百姓”或“以色列人”
  rationale: 原文以“女儿”人格化百姓，既有群体性又有亲密、脆弱的修辞色彩；直接释义会缩窄其文学和神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。正文保留“我百姓之女”这一先知文学人格化表达，并以“破碎／破碎”再现希伯来文同根词呼应。标点按三层递进的哀叹处理。
