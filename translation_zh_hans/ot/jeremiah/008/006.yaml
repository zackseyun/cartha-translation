  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: הִקְשַׁ֤בְתִּי וָֽ/אֶשְׁמָע֙ לוֹא כֵ֣ן יְדַבֵּ֔רוּ אֵ֣ין אִ֗ישׁ נִחָם֙ עַל רָ֣עָת֔/וֹ לֵ/אמֹ֖ר מֶ֣ה עָשִׂ֑יתִי כֻּלֹּ֗/ה שָׁ֚ב ב/מרצות/ם כְּ/ס֥וּס שׁוֹטֵ֖ף בַּ/מִּלְחָמָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/008/006.yaml
  text: 'I have paid attention and listened: they do not speak rightly[a]. No man repents of his evil, saying, ‘What have I done?’ Every one turns in his own course[c][b], like a horse rushing into battle.'
translation:
  language: zh_hans
  text: 我留心听察，听见他们说得不对。没有人因自己的恶行悔改，说：“我做了什么？”人人都转向自己奔走的路[a]，像马直冲战场。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“人人都转向自己奔行的路程。”原文“奔行／路程”描绘人执意沿着自己所选的方向猛冲。
    reason: 说明מרוצה可指奔行或所奔行的路线，并保留שׁוב在此可译“转向”的表达空间。
lexical_decisions:
- source_word: הִקְשַׁבְתִּי וָאֶשְׁמָע
  choice: 我留心细听，却听见
  rationale: 两个听觉动词连用，强调说话者刻意专注地听察；“留心细听”体现קשׁב的专注意味，“听见”保留שׁמע的基本意义。结合后文，增用“却”自然显明期待与实际所闻之间的反差。
- source_word: לוֹא כֵן יְדַבֵּרוּ
  choice: 他们说得不对
  rationale: 原文直译为“他们不是这样说”。在上下文中，这句话评断他们所说的并不合宜、不正确；“说得不对”既自然，又不把含义过度限定为撒谎或不诚实。
- source_word: אֵין אִישׁ נִחָם עַל רָעָתוֹ
  choice: 没有人因自己的恶行悔改
  rationale: אישׁ在这里具有代表性，现代汉语“没有人”自然涵盖群体中的每一个人。נחם在此指因所行的恶而懊悔并回心转意，故译为“悔改”；רעה按道德语境译作“恶行”。
- source_word: לֵאמֹר מֶה עָשִׂיתִי
  choice: 说：“我做了什么？”
  rationale: 保留原文简短而有自我省察意味的问句，不增添原文没有明说的“错事”。
- source_word: כֻּלֹּה שָׁב בִּמְרֻצוֹתָם
  choice: 人人都转回自己奔跑的路上
  rationale: כֻּלֹּה在语境中具有逐一涵盖的分配意味，译作“人人”。שׁוב保留“转回”的方向感；מרוצה可指奔跑或奔行的路程，此译法也为下句战马直冲的比喻作铺垫。
- source_word: כְּסוּס שׁוֹטֵף בַּמִּלְחָמָה
  choice: 像马直冲战场
  rationale: שׁוֹטֵף描绘猛烈、不可遏止地冲去；“直冲”简洁而鲜明地表现战马冲入战场的势头。
theological_decisions:
- issue: נחם在罪恶语境中的含义
  choice: 悔改
  alternative: 后悔／懊悔
  rationale: 本句不只描写情绪上的遗憾，还与停止恶行、改变方向的呼召有关；“悔改”能表达其道德与意志层面的含义，同时不额外规定悔改的具体过程。
- issue: אישׁ的代表性阳性单数
  choice: 没有人
  alternative: 没有一个男人
  rationale: 此处אישׁ虽为阳性单数，但功能是代表群体中的任何一个人，并非特意排除女性。汉语“没有人”准确传达这种普遍性，且不引入原文没有的性别对立。
- issue: שָׁב与悔改主题之间的反讽张力
  choice: 转回自己奔跑的路上
  alternative: 沿着自己的路直奔／转向自己的路
  rationale: 同一节先说无人悔改，随后却用שׁוב描写众人“转回”自己的奔路，形成反讽：他们不是转离恶行，而是回到原有方向。译文保留“转回”，不把这层张力消解为单纯的“继续”。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“留心细听”“恶行”“悔改”“直冲战场”保持先知话语的严肃与鲜明意象；句式简洁，适合公开诵读。
