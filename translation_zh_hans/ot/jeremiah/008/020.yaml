base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/008/020.yaml
  text: The harvest has passed[a], the summer has ended, and we have not been saved.
translation:
  language: zh_hans
  text: 收割期已过，夏季已经结束，我们却还没有得救[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “得救”也可译作“得到解救”；希伯来语动词可指从危险或灾祸中获救。
    reason: lexical_alternative
lexical_decisions:
- source_word: עָבַר
  choice: 已过
  rationale: Qal完成式表示事情已经过去；“已过”简洁自然，也体现机会或时节已逝。
- source_word: קָצִיר
  choice: 收割期
  rationale: 该名词可指收割或收割时节；这里与“夏季”平行，用“收割期”更清楚地呈现季节性含义。
- source_word: כָּלָה
  choice: 已经结束
  rationale: Qal完成式表达终结、完毕；此译法自然，并与前句的完成意义相呼应。
- source_word: קַיִץ
  choice: 夏季
  rationale: 在与“收割期”的诗歌平行中，采用通常的季节义；原词也可与夏季果实有关，但本句不必将该含义明说。
- source_word: וַאֲנַחְנוּ
  choice: 我们却
  rationale: וְ本为连接词，但语境形成强烈转折；现代汉语用“却”能自然表达这种语篇关系，同时不改变命题内容。
- source_word: לֹא נוֹשָׁעְנוּ
  choice: 还没有得救
  rationale: ישׁע的Niphal完成式第一人称复数表示“被拯救、获救”。“得救”保留广泛的拯救含义；“还没有”结合已经过去的两个时节，传达截至如今仍未获救的结果状态。
theological_decisions:
- issue: 民族哀歌语境中ישׁע的译法
  choice: 得救
  alternative: 获救／得到解救
  rationale: “得救”直接保留该词关于拯救的广泛正典共鸣，但本节语境将其指向从危险或灾祸中获救，并不限定为后来的系统神学意义。脚注说明“得到解救”这一语境性译法。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。前两分句保持诗歌式平行，末句用“却”呈现希伯来语连接词在语境中的转折作用。脚注标记置于整节末句相关词“得救”之后更合逻辑，因此正文中的[a]应随“得救”出现。
