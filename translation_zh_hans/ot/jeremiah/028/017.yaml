  text: And Hananiah the prophet died in that year[a], in the seventh month.
translation:
  language: zh_hans
  text: 哈拿尼雅先知在那一年的第七个月死了。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּמָת
  choice: 死了
  rationale: 这是מות的Qal叙事形式，直接表示“死了”；用“了”自然体现事件在叙事中的发生与完成。
- source_word: חֲנַנְיָה
  choice: 哈拿尼雅
  rationale: 按现代中文圣经人名的常见音译处理。
- source_word: הַנָּבִיא
  choice: 先知
  rationale: 原文只称其为“先知”，没有明说“假先知”；即使上下文否定他的信息，也不在本节擅自增添贬义限定。
- source_word: בַּשָּׁנָה הַהִיא
  choice: 就在那一年
  rationale: 忠实表达“在那一年”；“就”承接上文的预言及其应验，使中文叙事自然，但不把הַהִיא强化为“同一年”。
- source_word: בַּחֹדֶשׁ הַשְּׁבִיעִי
  choice: 第七个月
  rationale: 直译希伯来历法中的序数月份；不译作“七月”，以免现代读者误解为公历七月。
theological_decisions:
- issue: 是否明确称哈拿尼雅为“假先知”
  choice: 保留“先知”
  alternative: 假先知
  rationale: 本节原文使用普通称谓הַנָּבִיא，没有“假”之类的修饰语。译文保留上下文形成的张力，不将叙事评价直接加入称谓。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。以“第七个月”保留古代历法表达；在两个时间短语之间加顿号，清楚表明后者进一步限定前者。
