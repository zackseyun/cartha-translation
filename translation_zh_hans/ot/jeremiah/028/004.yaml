source:
  edition: WLC
  text: וְ/אֶת יְכָנְיָ֣ה בֶן יְהוֹיָקִ֣ים מֶֽלֶךְ יְ֠הוּדָה וְ/אֶת כָּל גָּל֨וּת יְהוּדָ֜ה הַ/בָּאִ֣ים בָּבֶ֗לָ/ה אֲנִ֥י מֵשִׁ֛יב אֶל הַ/מָּק֥וֹם הַ/זֶּ֖ה נְאֻם יְהוָ֑ה כִּ֣י אֶשְׁבֹּ֔ר אֶת עֹ֖ל מֶ֥לֶךְ בָּבֶֽל־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/028/004.yaml
  text: And I will bring back to this place Jeconiah son of Jehoiakim[a], king of Judah, and all the exiles of Judah who came to Babylon, declares Yahweh, for I will break the yoke of the king of Babylon.
translation:
  language: zh_hans
  text: 雅威宣告：“我必把约雅敬的儿子、犹大王耶哥尼雅，以及所有来到巴比伦[a]的犹大被掳之人，带回这地方，因为我必折断巴比伦王的轭。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“前往巴比伦”。希伯来语分词直译为“来到巴比伦的人”；从犹大的叙述视角，也可自然理解为“前往巴比伦”。
    reason: 保留希伯来语方向表达与叙述视角之间的翻译歧义。
lexical_decisions:
- source_word: יְכָנְיָה
  choice: 耶哥尼雅
  rationale: 采用该希伯来人名在现代中文圣经语境中的通行音译，并保留其完整形式。
- source_word: גָּלוּת יְהוּדָה
  choice: 犹大被掳之人
  rationale: גָּלוּת既可指被掳的状态，也可指被掳群体；后接表示人的复数分词，故此处取群体义。
- source_word: הַבָּאִים בָּבֶלָה
  choice: 来到巴比伦
  rationale: 贴近בוא分词“来、进入”的基本方向含义；不增添原文未明说的被动语态，同时以脚注保留按犹大视角译作“前往”的可能。
- source_word: מֵשִׁיב
  choice: 带回
  rationale: שוב的使役式在以人为宾语并带目的地时，表示使其返回、把其带回。
- source_word: הַמָּקוֹם הַזֶּה
  choice: 这地方
  rationale: 简洁保留原文的指示表达，不在正文中把所指明确化为耶路撒冷。
- source_word: נְאֻם יְהוָה
  choice: 雅威宣告
  rationale: 保留庄重的先知宣告公式，并以自然现代汉语置于引语之前。
- source_word: יְהוָה
  choice: 雅威
  rationale: 直接音译四字神名，而不以“主”这一称号替代。
- source_word: עֹל
  choice: 轭
  rationale: 保留原文借轭表达政治辖制与奴役的鲜明比喻。
- source_word: אֶשְׁבֹּר אֶת עֹל מֶלֶךְ בָּבֶל
  choice: 折断巴比伦王的轭
  rationale: 形式贴近原文，既保留“折断”的动作，也不把“轭”平化为统治或权势。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名；“雅威”较直接地保存专名性质，而“主”会以称号替代专名。
- issue: “巴比伦王的轭”的比喻
  choice: 保留“轭”
  alternative: 巴比伦王的统治
  rationale: 原文用轭象征帝国辖制；保留比喻可维持本章假先知宣告中的象征张力，不在正文中先行解释。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。将“雅威宣告”前置，使整句在中文中流畅；用“约雅敬的儿子、犹大王耶哥尼雅”明确“犹大王”修饰耶哥尼雅；正文保留“轭”的先知性意象。
