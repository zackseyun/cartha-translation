  text: וַ/יֹּ֨אמֶר֙ יִרְמְיָ֣ה הַ/נָּבִ֔יא אָמֵ֕ן כֵּ֖ן יַעֲשֶׂ֣ה יְהוָ֑ה יָקֵ֤ם יְהוָה֙ אֶת דְּבָרֶ֔י/ךָ אֲשֶׁ֣ר נִבֵּ֗אתָ לְ/הָשִׁ֞יב כְּלֵ֤י בֵית יְהוָה֙ וְ/כָל הַ/גּוֹלָ֔ה מִ/בָּבֶ֖ל אֶל הַ/מָּק֥וֹם הַ/זֶּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/028/006.yaml
  text: Then Jeremiah the prophet said[a], “Amen! May Yahweh do so; may Yahweh fulfill your words that you have prophesied, to bring back the vessels of the house of Yahweh and all the exiles from Babylon to this place.”
translation:
  language: zh_hans
  text: 耶利米先知说：“阿们！愿雅威这样做！愿雅威使你所预言的话应验[a]，就是把雅威殿的器皿和所有被掳的人从巴比伦带回这地方。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “使……应验”也可译作“使……成立”或“坚立……的话”。希伯来语动词含有“使话语站立”的意思，即使所说的话成为事实。
    reason: lexical_alternative
lexical_decisions:
- source_word: אָמֵן
  choice: 阿们
  rationale: 保留现代汉语基督教语境中熟悉的音译，也承载此处表示赞同和愿望的语气。
- source_word: כֵּן יַעֲשֶׂה
  choice: 愿……照这话成就
  rationale: 未完成式在“阿们”之后具有祈愿意味；“照这话”回指哈拿尼雅先前的预言，同时比直译“这样行”更自然。
- source_word: יְהוָה
  choice: 雅威
  rationale: 直接译出四字神名，不以称号代替。
- source_word: יָקֵם
  choice: 使……应验
  rationale: קום的使役式字面意象是“使……站立”，用于话语时表示使其成立、实现；此译自然表达预言成为事实的含义。
- source_word: דְּבָרֶיךָ אֲשֶׁר נִבֵּאתָ
  choice: 你所预言的话
  rationale: 保留“话”的具体表达，并以自然的汉语关系结构呈现已经说出的预言。
- source_word: לְהָשִׁיב
  choice: 带回
  rationale: 该使役式不定词同时支配器皿和被掳者；“带回”适用于两者，并保留返回此地的方向。
- source_word: כְּלֵי בֵית יְהוָה
  choice: 雅威殿中的器皿
  rationale: “殿”在此自然表达“雅威的家”即圣殿；“器皿”保留圣殿用具的概括性称谓。
- source_word: כָל הַגּוֹלָה
  choice: 所有被掳的人
  rationale: 原文单数集合名词指整个被掳群体；汉语用复数性表达更清楚自然。
- source_word: אֶל הַמָּקוֹם הַזֶּה
  choice: 回这地方
  rationale: 保留原文指示性，不在正文中将地点具体化为耶路撒冷或圣殿。
theological_decisions:
- issue: 耶利米回应的语气
  choice: 祈愿：“愿……成就……愿……应验”
  alternative: 将其译为确定的将来陈述：“雅威必…… ”
  rationale: “阿们”之后的两个未完成式最适合按祈愿语气理解。这样既表达耶利米盼望吉言实现，也不把他的话误解为确认哈拿尼雅的预言必然真实。
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华／主
  rationale: 原文直接使用四字神名；采用“雅威”保留其专名性质，不以称号取代。
- issue: יָקֵם 对预言之话的作用
  choice: 使……应验
  alternative: 证实／坚立……的话
  rationale: 原文可指使话语成立或实现；正文选用自然且符合语境的“应验”，脚注保留“使……成立”等词义层面的可能表达。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“阿们”保留经文语体和祈愿色彩；两个“愿”明确呈现希伯来语的祈愿语气。避免把耶利米的回应处理成对哈拿尼雅预言的无条件认可。
