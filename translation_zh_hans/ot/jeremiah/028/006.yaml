revisions:
- from: 耶利米先知说：“阿们！愿雅威照这话成就！愿雅威使你所预言的话应验[a]，把雅威殿中的器皿和所有被掳的人从巴比伦带回这地方。”
  to: 耶利米先知说：“阿们！愿雅威这样做！愿雅威使你所预言的话应验[a]，就是把雅威殿的器皿和所有被掳的人从巴比伦带回这地方。”
  rationale: 修订仅澄清原文句法关系并改善汉语自然度。“愿雅威这样做”保留“阿们”后的祈愿及对前述预言的回指；“就是”引出预言内容，明确“带回”并非独立附加动作。脚注保留原有的词义替代说明与锚点。
