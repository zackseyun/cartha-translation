  text: וַ/יֹּ֨אמֶר֙ יִרְמְיָ֣ה הַ/נָּבִ֔יא אֶל חֲנַנְיָ֖ה הַ/נָּבִ֑יא לְ/עֵינֵ֤י הַ/כֹּֽהֲנִים֙ וּ/לְ/עֵינֵ֣י כָל הָ/עָ֔ם הָ/עֹמְדִ֖ים בְּ/בֵ֥ית יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/028/005.yaml
  text: Then Jeremiah the prophet said to Hananiah the prophet in the sight of the priests and in the sight of all the people who were standing in the house of Yahweh:[a][b]
translation:
  language: zh_hans
  text: 于是，耶利米先知当着祭司，也当着所有站在耶和华殿里的百姓，对哈拿尼雅先知说：[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“在祭司眼前，也在所有百姓眼前”。
    reason: lexical_alternative
  - marker: b
    text: “耶和华殿”指圣殿；原文直译为“耶和华的殿（房屋）”。
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 于是……说
  rationale: 连续式叙事动词推进情节；“于是”自然表达前后次序。
- source_word: יִרְמְיָה הַנָּבִיא
  choice: 耶利米先知
  rationale: 采用通行中文人名译法，并保留“先知”这一明确称号。
- source_word: אֶל חֲנַנְיָה הַנָּבִיא
  choice: 对哈拿尼雅先知
  rationale: אֶל在说话结构中自然译作“对”；保留原文第二次出现的“先知”，维持修辞上的对应。
- source_word: לְעֵינֵי
  choice: 当着……的面
  rationale: 该短语字面与“眼前”有关，此处表示公开在场、亲眼见证；现代汉语用“当着……的面”自然准确。原文虽重复该短语，中文合并共享以避免生硬，并由脚注注明较形式对应的译法。
- source_word: הַכֹּהֲנִים
  choice: 祭司
  rationale: 明确的复数群体名词；汉语通常不必另加复数标记。
- source_word: כָל הָעָם הָעֹמְדִים
  choice: 所有站在……之人
  rationale: 保留כָל的全称范围及分词所描写的当时站立状态；“人”在此指聚集的民众。
- source_word: בְּבֵית יְהוָה
  choice: 在耶和华殿里
  rationale: בֵּית字面为“房屋、家”，在此明确指圣殿；“耶和华殿”是简洁庄重的中文表达，同时保留神名。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 耶和华
  alternative: 雅威；上主
  rationale: 原文直接使用四字神名。现代中文圣经语境中“耶和华”是最广为人知的专名形式，可使普通读者识别这是神的名字，而不是普通称号；“雅威”更贴近多数现代学者的拟音，但在中文大众语境中通行度较低。
- issue: 称哈拿尼雅为“先知”
  choice: 保留“哈拿尼雅先知”
  alternative: 哈拿尼雅
  rationale: 原文明确对耶利米和哈拿尼雅都使用同一称号。本译文不因上下文中真假先知的张力而删改这一称呼，保留叙事本身的表述与神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。保留两人同被称为“先知”的原文张力；将重复的לְעֵינֵי在正文中自然整合为“当着……的面”，并在脚注中呈现原文重复结构。
