  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יְהִ֥י דְבַר יְהוָ֖ה אֶֽל יִרְמְיָ֑ה אַ֠חֲרֵי שְׁב֞וֹר חֲנַנְיָ֤ה הַ/נָּבִיא֙ אֶת הַ/מּוֹטָ֔ה מֵ/עַ֗ל צַוַּ֛אר יִרְמְיָ֥ה הַ/נָּבִ֖יא לֵ/אמֹֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/028/012.yaml
  text: Then the word of Yahweh came to Jeremiah[a], after Hananiah the prophet had broken the yoke from off the neck of Jeremiah the prophet, saying,
translation:
  language: zh_hans
  text: 哈拿尼雅先知折断套在耶利米先知颈上的轭[a]以后，雅威的话临到耶利米，说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “轭”所译的希伯来语名词也可更具体地指轭木，即轭的木制横杆。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי דְבַר יְהוָה אֶל יִרְמְיָה
  choice: 雅威的话临到耶利米
  rationale: 采用先知书中自然且庄重的固定表达。“临到”体现叙事推进和神启示的主动性，不机械译出 וַיְהִי。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文四字神名的常见现代汉语音译处理，保留其作为专名的性质，而不以称号替代。
- source_word: אַחֲרֵי שְׁבוֹר
  choice: 折断……以后
  rationale: 明确表示哈拿尼雅折断轭的行动先已完成，随后雅威的话才临到耶利米。
- source_word: חֲנַנְיָה הַנָּבִיא
  choice: 哈拿尼雅先知
  rationale: 保留原文的人名和身份称谓，符合现代汉语圣经叙事的表达习惯。
- source_word: הַמּוֹטָה
  choice: 轭
  rationale: 上下文指耶利米戴在颈上作为先知性记号的轭；正文用普通读者易懂的“轭”，其更具体的器物含义在脚注说明。
- source_word: מֵעַל צַוַּאר יִרְמְיָה הַנָּבִיא
  choice: 套在耶利米先知颈上的
  rationale: 自然表达轭原先位于耶利米颈上以及被折断、移除的关系，同时保留原文重复出现的“先知”称谓。
- source_word: לֵאמֹר
  choice: 说：
  rationale: 引出下一节神谕的具体内容；冒号符合现代汉语标点习惯，并保留句子未完、下接引语的结构。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用以色列之神的四字神名。译作“雅威”保留专名性质，并避免用“主”这一称号替代；“耶和华”虽为传统译名，但较不贴近该神名通常重建的读音。
- issue: 两次“先知”称谓是否都保留
  choice: 保留“哈拿尼雅先知”和“耶利米先知”
  alternative: 第二处仅译“耶利米”
  rationale: 原文刻意同时称二人为“先知”，使二者的对峙保持张力；译文不预先以措辞裁定哈拿尼雅身份的真伪。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。调整语序，把时间从句置于句首，使事件先后在汉语中清楚自然；保留两处“先知”及末尾“说：”，以维持原文的重复、张力和与下一节的衔接。
