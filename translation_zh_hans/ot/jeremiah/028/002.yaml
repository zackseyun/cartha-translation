base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/028/002.yaml
  text: 'Thus says Yahweh of hosts[a], the God of Israel: I have broken the yoke of the king of Babylon.'
translation:
  language: zh_hans
  text: “万军之耶和华[a]——以色列的上帝——如此说：我已经折断了巴比伦王的轭。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “万军之耶和华”也可译作“军队之耶和华”，指耶和华所统领的诸军。
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: 如此说
  rationale: 这是先知传信公式；“如此说”既保留庄严、固定的表达，也符合现代汉语圣经语体。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以汉语中广为人知的专名形式呈现四字神名，避免用普通称号代替专名。
- source_word: צְבָאוֹת
  choice: 万军之
  rationale: 在复合称号“万军之耶和华”中保留其统领众军的广泛含义；脚注说明也可译作“军队之耶和华”。
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: 以色列的上帝
  rationale: 直接表达构词关系，清楚指出耶和华是以色列的上帝。
- source_word: לֵאמֹר
  choice: ：
  rationale: 此不定式用于引出直接引语，现代汉语以冒号自然表达。
- source_word: שָׁבַרְתִּי
  choice: 我已经折断了
  rationale: 希伯来语完成式把动作陈述为已经完成；“已经……了”保留其完成性和现实关联。
- source_word: עֹל
  choice: 轭
  rationale: 保留原文具体意象；在上下文中比喻政治辖制与臣服。
- source_word: מֶלֶךְ בָּבֶל
  choice: 巴比伦王
  rationale: 自然、简洁地表达希伯来语属格结构。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。正文采用现代简体中文读者最熟悉、且明确作为专名的“耶和华”；“雅威”更接近学界常见的拟音，但尚无绝对确定的古代读音，故不以脚注把其中一种拟音说成唯一确定形式。
- issue: 这句话的身份与真伪语境
  choice: 不在本节正文中加上“哈拿尼雅声称”等解释
  alternative: 将话语明示为哈拿尼雅的虚假宣告
  rationale: 本节语法只记录所说内容；其说话者及后来受到的判定由上下文交代。译文不应在本句内先行解决叙事张力。
translation_notes:
  register: 采用现代、庄重而易懂的先知宣告语体。保留“轭”的核心比喻和完成式的断言力度；不额外解释这句话在叙事中出自哈拿尼雅，也不在本节内预判其真伪。脚注标记置于整节句末。
