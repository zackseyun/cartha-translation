base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/028/008.yaml
  text: The prophets who were before me and before you from ancient times prophesied against many lands and against great kingdoms[b][a], of war and disaster and plague.
translation:
  language: zh_hans
  text: 从古以来，在我和你以前的先知，曾对许多土地和大国预言会有战争、灾祸和瘟疫[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “瘟疫”也可译作“疫病”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנְּבִיאִים אֲשֶׁר הָיוּ לְפָנַי וּלְפָנֶיךָ
  choice: 在我和你以前的先知
  rationale: 这里的“在……以前”表示时间先后；此译自然表达这些先知早于耶利米和哈拿尼雅。
- source_word: מִן הָעוֹלָם
  choice: 从古以来
  rationale: עוֹלָם在此指久远的过去，并非形而上的永恒；“从古以来”既庄重又符合现代汉语。
- source_word: וַיִּנָּבְאוּ
  choice: 曾……发预言
  rationale: 准确表达先知宣告信息的动作，并与后面的预言内容自然衔接。
- source_word: אֶל אֲרָצוֹת רַבּוֹת וְעַל מַמְלָכוֹת גְּדֹלוֹת
  choice: 向许多国家和强大的王国
  rationale: 保留两个介词可能具有的指向或涉及之意，不把敌对含义直接写进介词；后面的审判内容已清楚表明预言性质。“国家”在现代汉语中可自然涵盖土地及其人民、政体。
- source_word: לְמִלְחָמָה וּלְרָעָה
  choice: 说必有战争、灾祸
  rationale: 三个לְ短语说明预言内容；补出“说必有”使汉语通顺。רָעָה在审判语境中指灾难而非道德上的邪恶。
- source_word: וּלְדָבֶר
  choice: 和瘟疫
  rationale: דֶּבֶר指流行性致命疾病；“瘟疫”是准确、常用且庄重的现代汉语表达。
theological_decisions:
- issue: 审判预言中介词אֶל与עַל的语义
  choice: 译作“向许多国家和强大的王国发预言”
  alternative: “发预言攻击许多国家和强大的王国”或“论到许多国家和强大的王国发预言”
  rationale: אֶל通常表示“向、对”，עַל可表示“针对”或“论到”。上下文的战争、灾祸和瘟疫已显示审判性质，因此正文保留较中性的指向表达，避免把两个介词都无声地解释为“攻击”，同时不削弱严厉信息。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“从古以来”保留经文的历史纵深感；用“强大的王国”而非较生硬的“大的国度”。正文中的脚注标记[a]与脚注完全对应。
