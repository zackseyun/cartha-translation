  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כִּ֣י כֹֽה אָמַר֩ יְהוָ֨ה צְבָא֜וֹת אֱלֹהֵ֣י יִשְׂרָאֵ֗ל עֹ֣ל בַּרְזֶ֡ל נָתַ֜תִּי עַל צַוַּ֣אר כָּל הַ/גּוֹיִ֣ם הָ/אֵ֗לֶּה לַ/עֲבֹ֛ד אֶת נְבֻכַדְנֶאצַּ֥ר מֶֽלֶךְ בָּבֶ֖ל וַ/עֲבָדֻ֑/הוּ וְ/גַ֛ם אֶת חַיַּ֥ת הַ/שָּׂדֶ֖ה נָתַ֥תִּי לֽ/וֹ־־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/028/014.yaml
  text: 'For thus says Yahweh of hosts[a], the God of Israel: I have put an iron yoke on the necks of all these nations, to serve Nebuchadnezzar king of Babylon, and they shall serve him[b]. I have also given him the beasts of the field.'
translation:
  language: zh_hans
  text: 因为万军之雅威、以色列的上帝如此说：“我已经把铁轭放在这些国家的颈项上，要他们服事巴比伦王尼布甲尼撒；他们必服事他。我也把田野的走兽交给了他。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה צְבָאוֹת
  choice: 万军之雅威
  rationale: 以“雅威”音译上帝的专名，以“万军之”保留 צְבָאוֹת 所含天上、地上众军的宽泛意象，不把所指限定为某一种军队。
- source_word: עֹל בַּרְזֶל
  choice: 铁轭
  rationale: 简洁保留希伯来语的实体隐喻，并与上文被折断的木轭形成鲜明对照，表达更严厉、难以挣脱的辖制。
- source_word: נָתַתִּי עַל צַוַּאר
  choice: 我已经把……放在……的颈项上
  rationale: נתן 在此依其搭配译为“放在”；完成式译为“已经”，表达神所作的决定已然生效。צַוַּאר 的单数集合用法以自然的中文“颈项”保留。
- source_word: כָּל הַגּוֹיִם הָאֵלֶּה
  choice: 这些国家
  rationale: גּוֹיִם 在此指受巴比伦统治的政治共同体，译为“国家”比泛指“民众”更切合语境。
- source_word: לַעֲבֹד / וַעֲבָדֻהוּ
  choice: 使他们服事……；他们必服事他
  rationale: 重复“服事”以保留同一词根 עבד 的回响；这里指在政治上受辖制、向君王效命。“必”体现上下文中确定的将来结果。
- source_word: נְבֻכַדְנֶאצַּר
  choice: 尼布甲尼撒
  rationale: 采用现代中文圣经与历史文献中通行的名称译法；本节的希伯来文拼写对应通常所称的尼布甲尼撒。
- source_word: חַיַּת הַשָּׂדֶה
  choice: 田野的走兽
  rationale: 保留常见的圣经表达及其广泛所指，不擅自缩窄为特定种类的野生动物。
- source_word: נָתַתִּי לוֹ
  choice: 交给了他
  rationale: נתן 在此表达授予支配权；“交给”既自然，又保留一切受造物由上帝授予巴比伦王管辖的语气。
theological_decisions:
- issue: 上帝对列国和受造界的主权
  choice: 直陈雅威把铁轭加在列国颈项上，并把田野的走兽交给巴比伦王。
  alternative: 弱化为巴比伦的统治仅是一般政治进程。
  rationale: 原文两次使用 נתן，并由上帝亲自作主语，明确把巴比伦的权势表述为上帝审判与安排的结果；译文不淡化，也不添加经文以外的解释。
- issue: 动词的时间与语气
  choice: “我已经把……放在……；他们必服事他；我也把……交给了他。”
  alternative: 全用简单过去时，译作“我放了……他们服事了……我交给了……”。
  rationale: 首尾两个完成式表达已经确立、现今有效的神圣决定；中间 וַעֲבָדֻהוּ 在预言语境中指其确定结果，因此用“必服事”保留将来性与确定性。
- issue: 政治臣服与词汇重复
  choice: 两次使用“服事”，让命令目的与必然结果彼此呼应。
  alternative: 分别译作“臣服于”和“为他效劳”。
  rationale: 原文 לַעֲבֹד 与 וַעֲבָדֻהוּ 出自同一词根；保留重复可显出上帝所定目的必然实现，同时不把政治服役误解为敬拜。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“颈项”“铁轭”“田野的走兽”保留先知话语的具体意象；“服事”略带圣经语体，但在上下文中清楚表达向君王服役、受其辖制。未沿用英文咨询层中位置错配的脚注标记；本稿没有脚注，因此正文也不设脚注标记。
