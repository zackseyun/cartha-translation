revisions:
- from: 因为以色列的上帝、万军之雅威如此说：“我已经把铁轭放在这些国家的颈项上，使他们服事巴比伦王尼布甲尼撒；他们必服事他。我也把田野的走兽交给了他。”
  to: 因为万军之雅威、以色列的上帝如此说：“我已经把铁轭放在这些国家的颈项上，要他们服事巴比伦王尼布甲尼撒；他们必服事他。我也把田野的走兽交给了他。”
  rationale: 调整神名与称号的语序，使之对应希伯来原文“雅威万军之……以色列的上帝”并符合中文表达；将“使他们服事”改为“要他们服事”，以保留不定式所表达的目的/确定结果，且继续保留与后句相同的“服事”。未采用英文审计层错配的脚注；原文在此无需脚注。
