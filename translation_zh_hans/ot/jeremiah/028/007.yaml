  yaml_path: translation/ot/jeremiah/028/007.yaml
  text: Yet please hear this word that I am speaking in your hearing and in the hearing of all the people:[a]
translation:
  language: zh_hans
  text: 不过，请听我正在对你和全体百姓所说的这话：[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“在你的耳中，并在全体百姓的耳中”，是指让你和全体百姓听见。
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: 不过
  rationale: 本词在此承接第6节并转入限定或转折；“不过”自然表达这种语篇功能，又不把语气强化为完全反驳。
- source_word: שְׁמַע נָא
  choice: 请听
  rationale: שְׁמַע是命令式“听”，נָא带有恳请或缓和语气；“请听”兼顾命令与礼貌、恳切。
- source_word: הַדָּבָר הַזֶּה
  choice: 这话
  rationale: דָּבָר可指话、事情或信息；在先知当面发言的语境中，“这话”既保留言语性质，也符合现代汉语表达。
- source_word: אֲשֶׁר אָנֹכִי דֹּבֵר
  choice: 我现在……所说的
  rationale: 分词דֹּבֵר表示正在进行的说话行动；加入“现在”自然传达其即时、持续的语气。
- source_word: בְּאָזְנֶיךָ וּבְאָזְנֵי כָּל הָעָם
  choice: 对你和全体百姓所说
  rationale: 希伯来文直译为“在你耳中和全体百姓耳中”，是指当面、公开说给他们听的惯用语；汉语用“对……所说”较自然，同时以脚注说明原文意象。
