  yaml_path: translation/ot/jeremiah/028/010.yaml
  text: Then Hananiah the prophet took the yoke from the neck of Jeremiah the prophet and broke it[a].
translation:
  language: zh_hans
  text: 于是，先知哈拿尼雅从先知耶利米的颈项上取下那轭[a]，把它折断了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“轭木”或“横杠”。希伯来语这个词可指轭上的木杠；这里依据上下文中耶利米所负之轭的象征行动，译作“轭”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: 取下
  rationale: לקח本义为“拿、取”；结合מֵעַל（从……上）和颈项上的物件，译作“取下”自然表达移除动作，又不额外加入“夺”或“抢”的力度。
- source_word: חֲנַנְיָה
  choice: 哈拿尼雅
  rationale: 按现代中文圣经人名的通行音译处理。
- source_word: הַנָּבִיא
  choice: 先知
  rationale: נָבִיא的常规对应词；原文在哈拿尼雅和耶利米之后各用一次，正文两处均保留，以呈现原文的并列称谓和修辞张力。
- source_word: הַמּוֹטָה
  choice: 轭
  rationale: מוֹטָה可指横木、杠或轭木；上下文是耶利米负轭的象征行动，因此正文用普通读者易懂的“轭”，并以脚注保留更具体的词义可能。
- source_word: מֵעַל צַוַּאר
  choice: 从……的颈项上
  rationale: 体现“从……上面”的空间关系；“颈项”在庄重叙事中自然，也准确对应צַוַּאר。
- source_word: יִרְמְיָה
  choice: 耶利米
  rationale: 采用现代中文圣经传统通行译名。
- source_word: וַיִּשְׁבְּרֵהוּ
  choice: 把它折断了
  rationale: שׁבר表示“折断、打破”；对象是木制的轭或轭木，中文“折断”比“打碎”更贴切，代词“它”保留原文阳性单数后缀的指代。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事文体。“于是”承接连续叙事；保留两次“先知”，不因中文习惯而省略，以维持原文对哈拿尼雅与耶利米同样冠以该称谓所形成的张力。脚注标记紧随“轭”，明确其所解释的词。
