base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/028/013.yaml
  text: 'Go and say to Hananiah, saying, ‘Thus says the LORD: You have broken wooden yoke-bars, but you have made iron yoke-bars in their place.’'
translation:
  language: zh_hans
  text: 你去对哈拿尼雅说：‘耶和华如此说：你折断了木制轭杠，却在它们的位置上做了铁制轭杠。’
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָלוֹךְ וְאָמַרְתָּ
  choice: 你去……说
  rationale: 保留原文命令式“去”与随后“说”的结构，同时符合现代汉语表达。
- source_word: מֹטֹת עֵץ
  choice: 木轭
  rationale: מֹטוֹת 指轭的杠或轭条；汉语用“木轭”能自然、清楚地呈现上下文中的轭具意象，避免生硬的“木轭杠”。
- source_word: מֹטוֹת בַּרְזֶל
  choice: 铁轭
  rationale: 与“木轭”形成简洁而鲜明的材质对比，也保持原文由木变铁的加强意象。
- source_word: תַחְתֵּיהֶן
  choice: 来代替
  rationale: 准确表达“在它们的位置上、取代它们”的意思；汉语中无需重复宾语也能明确指向先前的木轭。
theological_decisions:
- issue: 折断木轭与做成铁轭之间的关系
  choice: 以“却”连接两个动作
  alternative: 译作“你折断了木轭，反而等于做了铁轭”
  rationale: 原文只并列陈述“你折断了”与“你做了”，带有鲜明转折效果，但没有“等于”等解释性词语；用“却”既呈现张力，又不额外阐释其因果机制。
- issue: 神名 יהוה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 采用现代中文圣经读者广泛熟悉的专名形式，并明确保留原文的神名，而不以一般称谓替代。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。引语结构简洁清楚；“木轭／铁轭”保留原文核心比喻和对比，避免因逐字译为复数“轭杠”而造成不自然或难懂的表达。
