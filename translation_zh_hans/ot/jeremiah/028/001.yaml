  naturalness: 原句总体自然庄重，但“从基遍来的先知哈拿尼雅，就是押朔的儿子”中“就是”不必要地弱化并插入父名信息；将父名按原文构造置于人名后，句法更顺畅。
  terminology: “西底家”“基遍”“哈拿尼雅”“押朔”“雅威”均可接受；“先知”不应预先加上“假”或“所谓”。“祭司和全体民众”准确；“全体百姓”更符合经文语体，二者皆可。
