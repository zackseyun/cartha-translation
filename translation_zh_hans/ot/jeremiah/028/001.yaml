id: JER.28.1
reference: Jeremiah 28:1
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יְהִ֣י בַּ/שָּׁנָ֣ה הַ/הִ֗יא בְּ/רֵאשִׁית֙ מַמְלֶ֨כֶת֙ צִדְקִיָּ֣ה מֶֽלֶךְ יְהוּדָ֔ה ב/שנת הָֽ/רְבִעִ֔ית בַּ/חֹ֖דֶשׁ הַ/חֲמִישִׁ֑י אָמַ֣ר אֵלַ֡/י חֲנַנְיָה֩ בֶן עַזּ֨וּר הַ/נָּבִ֜יא אֲשֶׁ֤ר מִ/גִּבְעוֹן֙ בְּ/בֵ֣ית יְהוָ֔ה לְ/עֵינֵ֧י הַ/כֹּהֲנִ֛ים וְ/כָל הָ/עָ֖ם לֵ/אמֹֽר׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/028/001.yaml
  text: And it happened in that year[a], at the beginning of the reign of Zedekiah king of Judah, in the fourth year, in the fifth month, that Hananiah son of Azzur, the prophet from Gibeon, spoke to me in the house of Yahweh, in the sight of the priests and all the people, saying[b],
translation:
  language: zh_hans
  text: 那一年，犹大王西底家在位初期的第四年五月，基遍人押朔的儿子、先知哈拿尼雅，在雅威的殿中，当着祭司和全体百姓的面，对我说：
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי בַּשָּׁנָה הַהִיא
  choice: 同年
  rationale: 这是叙事过渡和时间说明；“同年”在现代汉语中自然简洁，并保留与上文相连的作用。
- source_word: בְּרֵאשִׁית מַמְלֶכֶת צִדְקִיָּה מֶלֶךְ יְהוּדָה
  choice: 也就是犹大王西底家执政初期
  rationale: מַמְלֶכֶת 在这里指君王的统治时期，而非抽象的“国度”；“执政初期”自然传达其含义。
- source_word: בַשָּׁנָה הָרְבִיעִת בַּחֹדֶשׁ הַחֲמִישִׁי
  choice: 第四年五月
  rationale: 按希伯来历法表达保留“第四年”和“第五月”；汉语通常将“第五月”自然表达为“五月”，不换算成现代月份。
- source_word: חֲנַנְיָה בֶן עַזּוּר הַנָּבִיא אֲשֶׁר מִגִּבְעוֹן
  choice: 从基遍来的先知哈拿尼雅，就是押朔的儿子
  rationale: 保留人物的来源、身份称谓和父子关系，并按现代汉语信息次序组织。
- source_word: בְּבֵית יְהוָה
  choice: 在雅威的殿中
  rationale: בֵּית יְהוָה 字面是“雅威的家”，在此明确指圣殿；汉语用“雅威的殿”既自然又保留神名。
- source_word: לְעֵינֵי הַכֹּהֲנִים וְכָל הָעָם
  choice: 当着祭司和全体民众的面
  rationale: לְעֵינֵי 字面为“在……眼前”，此处是表示公开在场的惯用语；“当着……的面”准确自然。
- source_word: אָמַר אֵלַי ... לֵאמֹר
  choice: 对我说
  rationale: 希伯来语以“说……说”引出直接引语；现代汉语用一个“说”即可自然承接下文。
- source_word: יְהוָה
  choice: 雅威
  rationale: 用现代汉语音译呈现四字神名，不以称号替代专名。
theological_decisions:
- issue: “西底家执政初期”与“第四年”之间表面上的年代张力
  choice: 两项时间说明均照原文保留
  alternative: 把“初期”宽泛化，或改写、删去其中一项以消除张力
  rationale: 希伯来文本同时包含 בְּרֵאשִׁית מַמְלֶכֶת 和 בַשָּׁנָה הָרְבִיעִת。译文不应擅自协调两者。
- issue: הַנָּבִיא 对哈拿尼雅的称呼
  choice: 先知哈拿尼雅
  alternative: 所谓的先知哈拿尼雅／假先知哈拿尼雅
  rationale: 原文直接使用带定冠词的“先知”，本节没有加入贬义限定；译文保留叙事本身的称呼，不提前判定其真实性。
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华／主
  rationale: 原文使用神的专名；译作“雅威”保留专名性质，避免以称号代替。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。人名和地名使用常见中文圣经译名；以“雅威”音译神名。句法适度重组以符合汉语表达，但保留原文的年代张力、人物称谓及公开场合的叙事信息。
