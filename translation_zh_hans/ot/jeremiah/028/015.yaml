  text: וַ/יֹּ֨אמֶר יִרְמְיָ֧ה הַ/נָּבִ֛יא אֶל חֲנַנְיָ֥ה הַ/נָּבִ֖יא שְׁמַֽע נָ֣א חֲנַנְיָ֑ה לֹֽא שְׁלָחֲ/ךָ֣ יְהוָ֔ה וְ/אַתָּ֗ה הִבְטַ֛חְתָּ אֶת הָ/עָ֥ם הַ/זֶּ֖ה עַל שָֽׁקֶר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/028/015.yaml
  text: 'Then Jeremiah the prophet said to Hananiah the prophet[a], “Listen, please, Hananiah: Yahweh has not sent you[b], and you have made this people trust in a lie.”'
translation:
  language: zh_hans
  text: 于是，耶利米先知对哈拿尼雅先知说：“请听，哈拿尼雅！雅威[a]没有差遣你，而你使这百姓信靠谎言[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “雅威”是希伯来文神名“יהוה”（YHWH）的音译；传统上也常译作“耶和华”或“主”。
    reason: divine_name
  - marker: b
    text: “谎言”也可译作“虚假”；原文可直译为“使这百姓信靠虚假”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: 该叙事形式推进事件次序；现代汉语用“说”即可自然承接上文，无须机械加入“然后”。
- source_word: הַנָּבִיא
  choice: 先知
  rationale: 耶利米和哈拿尼雅之后的同位称号都予以保留，既忠于原文，也保留哈拿尼雅先知身份受到质疑时的张力。
- source_word: שְׁמַע נָא
  choice: 请听
  rationale: שְׁמַע是命令式“听”，נָא带请求或恳切语气；“请听”在现代汉语中自然地表达两者。
- source_word: לֹא שְׁלָחֲךָ יְהוָה
  choice: 雅威没有差遣你
  rationale: 直陈哈拿尼雅并非受雅威差遣；汉语“没有差遣”兼顾既往行动和当前身份上的否定。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文四字神名直接音译，保留经文所用的专名，而不以称号“主”替代。
- source_word: הִבְטַחְתָּ
  choice: 你却使……信靠
  rationale: 该词为בטח的使役式，表示使人信靠；“使……信靠”明确保留使役含义。“却”自然呈现原文连接词在否定差遣与误导百姓之间形成的对照。
- source_word: הָעָם הַזֶּה
  choice: 这百姓
  rationale: 保留原文单数集合名词及指示语，在先知话语中自然庄重。
- source_word: עַל שָׁקֶר
  choice: 信靠谎言
  rationale: שֶׁקֶר可指谎言、虚假；结合使役式בטח，译为“信靠谎言”清楚表达百姓把虚假信息当作可信依据。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名，正文采用“雅威”以保留专名；脚注交代中文传统译法，避免把不同中文形式误认为不同对象。
- issue: 哈拿尼雅仍被称为“先知”
  choice: 保留“哈拿尼雅先知”
  alternative: 哈拿尼雅；假先知哈拿尼雅
  rationale: 原文在耶利米否认哈拿尼雅受差遣时仍以הַנָּבִיא称他。译文不预先改成“假先知”，以保留叙述中的反讽和神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“请听”表达恳切命令，“这百姓”保留先知话语的集合性措辞；整体句式简洁有力，适合公开诵读。
