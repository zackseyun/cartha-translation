id: JER.28.3
reference: Jeremiah 28:3
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: בְּ/ע֣וֹד שְׁנָתַ֣יִם יָמִ֗ים אֲנִ֤י מֵשִׁיב֙ אֶל הַ/מָּק֣וֹם הַ/זֶּ֔ה אֶֽת כָּל כְּלֵ֖י בֵּ֣ית יְהוָ֑ה אֲשֶׁ֨ר לָקַ֜ח נְבוּכַדנֶאצַּ֤ר מֶֽלֶךְ בָּבֶל֙ מִן הַ/מָּק֣וֹם הַ/זֶּ֔ה וַ/יְבִיאֵ֖/ם בָּבֶֽל׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/028/003.yaml
  text: Within two years[a], I will bring back to this place all the vessels of the house of Yahweh[d][c][b], which Nebuchadnezzar king of Babylon took from this place and brought to Babylon.
translation:
  language: zh_hans
  text: 两年之内[a]，我必把耶和华殿里的一切器皿[b]带回这里；这些器皿是巴比伦王尼布甲尼撒从这里拿走、带到巴比伦去的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“在两年日子之内”，是表示“在两年之内”的习惯说法。
    reason: lexical_alternative
  - marker: b
    text: “器皿”也可译作“器具”或“用具”，泛指耶和华殿中的各类物件。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּעוֹד שְׁנָתַיִם יָמִים
  choice: 再过两年
  rationale: 该短语表示尚余的一段固定时间；“两年日子”是希伯来语习惯表达，现代汉语自然译作“再过两年”，不机械直译“日子”。
- source_word: מֵשִׁיב
  choice: 我必……带回
  rationale: שוב 的使役形在此表示使物件返回原处；分词在预言话语中具有将来语气。“带回”具体呈现圣殿器皿的空间移动。
- source_word: אֶל הַמָּקוֹם הַזֶּה
  choice: 回这里
  rationale: 保留指示语义和返回目的地；结合“带回”，译作“回这里”符合现代汉语表达。
- source_word: כָּל כְּלֵי בֵּית יְהוָה
  choice: 耶和华殿里的一切器皿
  rationale: כְּלֵי 在圣殿语境中指各类器具、用具；“器皿”是庄重且通行的译法。בֵּית יְהוָה 按语境自然译为“耶和华殿”，避免“耶和华的房屋”造成误解。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代简体中文圣经读者最熟悉的专名形式音译四字神名，保留其作为上帝名字而非称号的性质。
- source_word: אֲשֶׁר לָקַח
  choice: 是……拿走的
  rationale: 关系从句说明器皿的经历；לקח 取普通义“拿、取”，结合离开原地译作“拿走”，不强化为“掠夺”。
- source_word: נְבוּכַדנֶאצַּר
  choice: 尼布甲尼撒
  rationale: 采用现代中文圣经和一般中文资料中最通行、辨识度最高的译名；本节辅音形式对应通常所称的 Nebuchadnezzar。
- source_word: מֶלֶךְ בָּבֶל
  choice: 巴比伦王
  rationale: 直接而自然地表达希伯来语附属结构，并与专名构成同位称谓。
- source_word: מִן הַמָּקוֹם הַזֶּה
  choice: 从这里
  rationale: 与前面的目的地相呼应，准确保留空间起点，且符合现代汉语习惯。
- source_word: וַיְבִיאֵם בָּבֶל
  choice: 带到巴比伦去
  rationale: 使役形表示“带来/带去”；从说话地点看目的地为巴比伦，汉语用“带到……去”最自然。正文重复“这些器皿”，明确呈现希伯来文显式宾语后缀“它们”。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用上帝的专名而非“主”这一称号。中文正文采用广为人知的“耶和华”，既保留专名性质，也便于普通现代读者识别；“雅威”更接近学界常用的拟音，属可行替代。
- issue: “我必带回”的话语身份
  choice: 按发言者第一人称直译，不在本节正文中评断预言真伪
  alternative: 以引号或说明语显明这是哈拿尼雅的宣告
  rationale: 本节原文本身保留直接话语；其真实性由上下文展开。译文不应在单节内预先加入神学评断。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“再过两年”传达预言的时间界限；“耶和华殿”兼顾原文“耶和华之家”的形式与中文清晰度。后半句重提“这些器皿”，使较长关系结构清楚，并保留原文宾语所指。
