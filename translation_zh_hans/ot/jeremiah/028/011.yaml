    rationale: 原文直述“巴比伦王尼布甲尼撒的轭”从列国颈项上被折断，并未在本节明确使用“加上”的动词。虽不改变核心意思，改用属格表达可减少增补。
  - severity: low
    issue: “照这样”缺少与象征行动相关的脚注锚点。
    rationale: 英语审校轨迹将第二个指示词的可能所指作为文化说明列出；中文译文保留该指示语时，也宜提供对应脚注，帮助读者理解而不把解释写入正文。
