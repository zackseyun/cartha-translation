  source_fidelity: 译文整体准确传达了公开宣告、先知公式、两年期限、折断巴比伦之轭以及耶利米离去的叙事。惟“巴比伦王尼布甲尼撒加在列国颈项上的轭”将原文属格短语处理为“加在”，虽合乎上下文，却比原文略多解释；改为“巴比伦王尼布甲尼撒的轭”更贴近原文，同时保留其政治辖制的隐喻。
  naturalness: “当着众人的面”“耶和华如此说”“两年之内”均自然且符合庄重的现代中文圣经语体。将引语改为单层引号，并调整宾语、处所短语与动词的顺序后，句法更顺畅。
  terminology: “耶和华”“轭”“列国”“巴比伦王尼布甲尼撒”均恰当一致。保留“照这样”，以维持 כֹּה…כָּכָה 中先知公式与指示副词的区分；为此补上对应的说明性脚注锚点。
