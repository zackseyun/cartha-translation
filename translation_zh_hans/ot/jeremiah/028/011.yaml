  text: וַ/יֹּ֣אמֶר חֲנַנְיָה֩ לְ/עֵינֵ֨י כָל הָ/עָ֜ם לֵ/אמֹ֗ר כֹּה֮ אָמַ֣ר יְהוָה֒ כָּ֣כָה אֶשְׁבֹּ֞ר אֶת עֹ֣ל נְבֻֽכַדְנֶאצַּ֣ר מֶֽלֶךְ בָּבֶ֗ל בְּ/עוֹד֙ שְׁנָתַ֣יִם יָמִ֔ים מֵ/עַ֕ל צַוַּ֖אר כָּל הַ/גּוֹיִ֑ם וַ/יֵּ֛לֶךְ יִרְמְיָ֥ה הַ/נָּבִ֖יא לְ/דַרְכּֽ/וֹ־־׀־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/028/011.yaml
  text: 'And Hananiah said in the sight of all the people[a], saying[b], “Thus says Yahweh: In this way I will break the yoke of Nebuchadnezzar king of Babylon from upon the neck of all the nations within two years.” Then Jeremiah the prophet went on his way.'
translation:
  language: zh_hans
  text: 哈拿尼雅当着众人的面[a]说：“耶和华如此说：两年之内，我必照这样[b]把巴比伦王尼布甲尼撒的轭从列国的颈项上折断。”于是，先知耶利米就走了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在众人眼前”。
    reason: lexical_alternative
  - marker: b
    text: “照这样”很可能呼应哈拿尼雅折断轭的象征行动。
    reason: cultural_note
lexical_decisions:
- source_word: לְעֵינֵי
  choice: 当着众人的面
  rationale: 这是表示公开在场的希伯来语习语；译文自然表达“在众人眼前／面前”，并保留公开宣告的意味。
- source_word: כֹּה ... כָּכָה
  choice: 如此说……照这样
  rationale: 分别保留标准先知宣告公式和指示性副词之间的区别；“照这样”很可能指向哈拿尼雅刚刚折断轭的象征行动。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者最熟悉的专名形式来表达四字神名，而不以“主”替代原文专名。
- source_word: אֶשְׁבֹּר
  choice: 我必……折断
  rationale: 未完成式在预言宣告中自然表示将来；“折断”准确对应轭的具体意象。
- source_word: עֹל
  choice: 轭
  rationale: 保留原文关于奴役和政治辖制的具体比喻。
- source_word: בְּעוֹד שְׁנָתַיִם יָמִים
  choice: 两年之内
  rationale: 该时间短语指不超过两年的期限；此译法符合现代汉语，也不误解为持续整整两年。
- source_word: מֵעַל צַוַּאר
  choice: 加在……颈项上的
  rationale: 自然呈现轭压在颈项上的空间图像；“加在”在汉语中也清楚表达巴比伦的辖制。
- source_word: כָּל הַגּוֹיִם
  choice: 列国
  rationale: 指处于巴比伦势力之下的各国，不引入后期“外邦人”的神学含义。
- source_word: וַיֵּלֶךְ ... לְדַרְכּוֹ
  choice: 于是……就走了
  rationale: 这是表示离开、继续上路的习语；现代汉语用“就走了”简洁自然地传达叙事动作。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用神的专名。中文稿保留专名而不译作“主”；选用“耶和华”是因其在现代简体中文圣经语境中辨识度最高。“雅威”更接近学界常见的拟音，但在普通中文读者中较不熟悉。
- issue: 哈拿尼雅宣告中的第一人称是谁
  choice: 以引号层级表明“我”是哈拿尼雅所声称代言的耶和华
  alternative: 不设内层引号，使“我”的指向仅由上下文判断
  rationale: 原文的先知公式后接第一人称神谕。内层引号帮助现代读者识别话语层级，但不判定哈拿尼雅的宣告真实与否；上下文仍保留其真假先知的张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“耶和华如此说”保留先知宣告的固定语体；“照这样”维持原文的指示性，并让其自然呼应上一节折断轭的象征动作。未增加解释哈拿尼雅真伪的措辞。
