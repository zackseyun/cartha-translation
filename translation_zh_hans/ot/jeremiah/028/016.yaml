base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/028/016.yaml
  text: 'Therefore[a], this is what Yahweh says: Look, I am sending you away from the face of the earth. This year you will die[b], because you have spoken rebellion against Yahweh.'
translation:
  language: zh_hans
  text: 所以，雅威这样说：“看哪，我要把你从地面上除去[a]。今年你必死，因为你说了反叛雅威的话[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译为“我正把你从地面上送走”；这是指从活人中被除去。
    reason: lexical_alternative
  - marker: b
    text: “反叛”也可译为“背离”或“悖逆”。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语通行的音译保留上帝向以色列启示的专名，而不以“主”这一称号替代。
- source_word: לָכֵן
  choice: 所以
  rationale: 承接上文并引出由此而来的判决；“所以”在现代汉语中自然、明确。
- source_word: כֹּה אָמַר
  choice: 如此说
  rationale: 保留先知传信公式的庄重和辨识度，同时符合现代汉语表达。
- source_word: הִנְנִי
  choice: 看哪
  rationale: 体现原文唤起注意并强调即将采取行动的语气；“看哪”虽较庄重，却在经文语体中清楚自然。
- source_word: מְשַׁלֵּחֲךָ מֵעַל פְּנֵי הָאֲדָמָה
  choice: 要把你从大地上除去
  rationale: 原文直译近于“把你从大地表面送走”。“除去”在汉语中自然地表达从活人中被移除，同时“大地上”保留原有空间意象，且下一句明确说明结果是死亡。
- source_word: הַשָּׁנָה אַתָּה מֵת
  choice: 今年你必死
  rationale: 原文的状态式表达在语境中是对即将死亡的预告；“必死”准确传达确定的将来判断。
- source_word: סָרָה דִבַּרְתָּ אֶל יְהוָה
  choice: 你说了悖逆雅威的话
  rationale: סָרָה表示背离、反抗或悖逆；这一译法保留话语内容针对雅威权威的反叛性质，又不把它限定为后世技术意义上的“叛教”。
theological_decisions:
- issue: “从大地上除去”所指的审判
  choice: 理解为死亡判决，但在正文中保留原文的大地意象
  alternative: 理解为被逐出本地或遭流放
  rationale: 紧接着的“今年你必死”明确解释了这一移除是离开活人之地，而不只是迁离某片土地。
- issue: סָרָה的含义范围
  choice: 译为“悖逆”
  alternative: 译为“叛教”“反抗”或“背离”
  rationale: “悖逆”既涵盖对雅威的反抗，也避免将此处过度限定为正式离教行为，从而保留原词的语义张力。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“如此说”和“看哪”保留先知宣告的正式语气；其余句式力求普通读者无需专门背景即可理解。脚注标记均置于所说明的词句之后。
