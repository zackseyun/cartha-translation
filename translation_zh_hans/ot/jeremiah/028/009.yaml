base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/028/009.yaml
  text: As for the prophet who prophesies peace[a], when the word of that prophet comes to pass[c][b], then that prophet will be known as one whom Yahweh has truly sent.
translation:
  language: zh_hans
  text: 至于那预言平安[a]的先知，当那先知的话应验[b]时，人就知道他确是耶和华所差遣的[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “平安”也可译作“安好”或“福祉”。
    reason: lexical_alternative
  - marker: b
    text: 字面是“当那先知的话来到时”，意思是预言的信息得以实现。
    reason: lexical_alternative
  - marker: c
    text: 也可译作“人就知道耶和华真实地差遣了那先知”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנָּבִיא
  choice: 那……先知／那先知
  rationale: 希伯来文有定冠词，所指是在当前论述中被考验的特定先知；中文用“那”自然体现其特指性。
- source_word: יִנָּבֵא
  choice: 预言
  rationale: נבא 的 Niphal 在这里指以先知身份发言；“预言”符合先知语境，也与后文信息是否实现相呼应。
- source_word: לְשָׁלוֹם
  choice: 平安
  rationale: שָׁלוֹם 可涵盖和平、安好和福祉；“平安”既保留传统用语，也具有较宽的语义范围。
- source_word: בְּבֹא דְּבַר הַנָּבִיא
  choice: 等那先知的话应验时
  rationale: 字面是“当那先知的话来到时”，语境所指为预言实现；“应验”以自然中文表达这一含义。
- source_word: יִוָּדַע
  choice: 人就知道
  rationale: Niphal 表示其身份届时被确认或为人所知；中文非特指主语“人”自然传达被动／结果含义。
- source_word: שְׁלָחוֹ יְהוָה
  choice: 他是耶和华所差来的
  rationale: 保留关系从句的含义，并以自然现代中文表达先知受神差遣。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代简体中文圣经语境中广为人知的专名音译呈现四字神名，而不以称号替代。
- source_word: בֶּאֱמֶת
  choice: 确是
  rationale: 该词可修饰差遣的真实性，也可强调先知确实受差；“确是”自然表达真实认证，同时脚注保留另一种句法理解。
theological_decisions:
- issue: 真先知的辨认标准
  choice: 先知所预言的平安应验时，他确实受耶和华差遣这一点便为人所知。
  alternative: 较贴字面译作“那先知的话来到时，就可知道耶和华真实地差了那先知”。
  rationale: 经文把预言之话的实现与先知身份得到确认相连；译文保留这种证验关系，不扩展为经文本身未明说的完整先知辨别教义。
- issue: בֶּאֱמֶת 的修饰关系
  choice: 译为“他确是耶和华所差来的”，着重先知受差身份的真实性。
  alternative: 译为“耶和华真诚／真实地差来的”或“耶和华所差来传真话的”。
  rationale: 希伯来语可理解为“耶和华确实差遣了他”或“在真实性中差遣”；正文采用自然中文，但用脚注保留较贴字面的表达及句法张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“至于……等……时……”保留原文论证结构；“人就知道”避免生硬的被动句。“耶和华”按现代简体中文读者熟悉的圣经专名处理。所有脚注标记均置于正文相应位置。
