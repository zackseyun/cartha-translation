base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/039/006.yaml
  text: The king of Babylon slaughtered the sons of Zedekiah at Riblah before his eyes[a], and the king of Babylon slaughtered all the nobles of Judah.
translation:
  language: zh_hans
  text: 巴比伦王在利比拉，当着西底家的面宰杀了西底家的众子；巴比伦王又宰杀了犹大的所有贵族[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “贵族”或译“官员”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁחַט / שָׁחַט
  choice: 宰杀
  rationale: 该词常指屠宰或以残酷方式杀死；在处决语境中，“宰杀”比一般的“杀死”更能保留原文强烈而血腥的力度。
- source_word: מֶלֶךְ בָּבֶל
  choice: 巴比伦王
  rationale: 自然、准确地表达属格结构。希伯来文虽在后半句重复此称谓，但汉语若照样重复会显得生硬，故第二处依靠同一主语连贯表达。
- source_word: בְּנֵי צִדְקִיָּהוּ
  choice: 西底家的众子
  rationale: בְּנֵי在此明确指男性后代；“众子”既保留性别信息，也与叙事语体相称。
- source_word: בְּרִבְלָה
  choice: 在利比拉
  rationale: בְּ表示事件发生地点；“在利比拉”是现代汉语自然的地点表达。
- source_word: לְעֵינָיו
  choice: 当着西底家的面
  rationale: 该习语表示事情在他眼前发生、由他亲眼目睹。明确代词所指可避免汉语中的指代歧义，同时保留场面的残酷性。
- source_word: כָּל
  choice: 所有的
  rationale: 修饰群体名词时，“所有的”自然地表达整体无一例外。
- source_word: חֹרֵי יְהוּדָה
  choice: 犹大所有的贵族
  rationale: חֹרִים在此指社会政治地位较高的人，“贵族”最直接；也可能侧重其公共职分，译作“官员”。
- source_word: יְהוּדָה
  choice: 犹大
  rationale: 采用现代中文圣经语境中通行的地名译法。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而清楚的叙事语言。“宰杀”刻意保留原文的暴力力度；“当着西底家的面”使希伯来语代词的所指在汉语中清晰。正文保留“贵族”，脚注注明“官员”这一合理词义选择。
