  text: וְ/הִצַּלְתִּ֥י/ךָ בַ/יּוֹם הַ/ה֖וּא נְאֻם יְהוָ֑ה וְ/לֹ֤א תִנָּתֵן֙ בְּ/יַ֣ד הָֽ/אֲנָשִׁ֔ים אֲשֶׁר אַתָּ֥ה יָג֖וֹר מִ/פְּנֵי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/039/017.yaml
  text: But I will deliver you on that day[a], declares Yahweh[b], and you will not be given into the hand of the men of whom you are afraid.
translation:
  language: zh_hans
  text: “但在那日，我必搭救你[a]，”雅威说，“你必不被交在你所惧怕的人手中[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“救出你”“解救你”。希伯来语动词指使人脱离危险。
    reason: lexical_alternative
  - marker: b
    text: “交在……手中”直译保留了希伯来语的“手”这一意象，意思是落入那些人的权势或控制之下。
    reason: idiom_clarification
lexical_decisions:
- source_word: וְהִצַּלְתִּיךָ
  choice: 但……我必搭救你
  rationale: הִצִּיל的使役形在此表示从危险中解救、搭救。译作“搭救”既保留具体的脱险含义，也避免把它过度抽象化；句首וְ按上下文译作带转折意味的“但”。
- source_word: בַיּוֹם הַהוּא
  choice: 到那日
  rationale: 这是常见的时间表达。“到那日”符合现代汉语叙事语感，也自然承接此前的应许语境。
- source_word: נְאֻם יְהוָה
  choice: 雅威宣告说
  rationale: נְאֻם是先知书中标明神谕来源的固定表达；“宣告说”庄重而自然，并清楚标示随后及此前话语的权威来源。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文四字神名作音译，以区别于称号“主”，并保留经文中的专名性质。
- source_word: וְלֹא תִנָּתֵן
  choice: 你必不被交在
  rationale: נָתַן的被动形在此表示被交到他人的控制之下。“被交在”与后面的“手中”构成自然的现代汉语表达。
- source_word: בְּיַד
  choice: 手中
  rationale: 保留希伯来文“手”的具体意象；汉语“交在某人手中”同样可自然表示落入某人的权势或控制。
- source_word: הָאֲנָשִׁים
  choice: 那些……的人
  rationale: 定冠词表明所指是特定的一群人。现代汉语用“那些人”即可自然表达，不必机械标出语法上的阳性复数。
- source_word: אֲשֶׁר אַתָּה יָגוֹר מִפְּנֵיהֶם
  choice: 那些你惧怕的人
  rationale: יָגוֹר与מִפְּנֵיהֶם连用表示因这些人而恐惧。“你惧怕的人”简洁自然，并保留惧怕的直接对象。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名。译作“雅威”保留其专名性质，不以称号替代，也不在本节中增添神学解释。
- issue: הִצִּיל是否译成带有专门神学含义的“拯救”
  choice: 搭救
  alternative: 拯救；救出
  rationale: 本节语境首先是从所惧怕之人的手中获救。选用“搭救”突出具体危难中的解救，同时不否认该词在其他语境中可能具有更宽广的救恩含义。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“雅威宣告说”保留先知神谕公式；引语分段避免长句含混。“搭救”“交在……手中”兼顾原文意象与普通读者的可理解性。
