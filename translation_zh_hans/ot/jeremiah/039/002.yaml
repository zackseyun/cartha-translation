  text: 西底家在位第十一年，四月初九日，城被攻破。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּ/עַשְׁתֵּי עֶשְׂרֵה שָׁנָה לְ/צִדְקִיָּהוּ
  choice: 西底家在位第十一年
  rationale: 这是君王纪年的时间表达。补出“在位”符合现代汉语习惯，也清楚表明“第十一年”指西底家的统治年数，并未增添实质信息。
- source_word: בַּ/חֹדֶשׁ הָ/רְבִיעִי
  choice: 四月
  rationale: 原文按次序称“第四个月”；汉语用“四月”即可自然表达，且不换算成现代历法月份。
- source_word: בְּ/תִשְׁעָה לַ/חֹדֶשׁ
  choice: 初九
  rationale: 该希伯来语习语指本月第九日。“初九”是现代汉语日期表达，简洁明确。
- source_word: הָבְקְעָה
  choice: 被攻破了
  rationale: בקע 的尼法勒完成式在此表示城防被突破；“被攻破”保留军事语境，又比泛泛的“破开”更自然。句末“了”自然呈现事件已发生。
- source_word: הָ/עִיר
  choice: 城
  rationale: 原文仅说“那城”，上下文所指为耶路撒冷；译作“城”保留原文措辞，不把所指直接代入正文。
