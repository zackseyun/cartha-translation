  text: He blinded Zedekiah’s eyes and bound him with bronze shackles to bring him to Babylon[a].
translation:
  language: zh_hans
  text: 他弄瞎了西底家的眼睛，又用铜制镣铐捆住他，要把他带到巴比伦去。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֵינֵי צִדְקִיָּהוּ
  choice: 西底家的眼睛
  rationale: 按希伯来语的领属结构直译，同时符合现代汉语的自然表达。
- source_word: עִוֵּר
  choice: 弄瞎了
  rationale: 该动词意为“使失明、弄瞎”；此处用“弄瞎了”直接、自然，并保留具体动作。
- source_word: וַיַּאַסְרֵהוּ
  choice: 锁住他
  rationale: אסר表示捆绑或拘束；结合后面的铜制刑具，“锁住他”在现代汉语中清楚表达实际的束缚。
- source_word: בַּנְחֻשְׁתַּיִם
  choice: 用铜镣
  rationale: 该词指铜制的束缚器具；“铜镣”简洁具体，也保留其可能泛指镣铐或锁链的余地，其他译法收入脚注。
- source_word: לָבִיא אֹתוֹ
  choice: 要把他带到
  rationale: 不定式表达目的；“要把他带到”自然体现目的关系。
- source_word: בָּבֶלָה
  choice: 巴比伦
  rationale: 词尾方向标记表示朝向巴比伦；与“带到”搭配即可自然表达。
