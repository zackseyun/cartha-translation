  text: וַ/יִּשְׁלְחוּ֩ וַ/יִּקְח֨וּ אֶֽת יִרְמְיָ֜הוּ מֵ/חֲצַ֣ר הַ/מַּטָּרָ֗ה וַ/יִּתְּנ֤וּ אֹת/וֹ֙ אֶל גְּדַלְיָ֨הוּ֙ בֶּן אֲחִיקָ֣ם בֶּן שָׁפָ֔ן לְ/הוֹצִאֵ֖/הוּ אֶל הַ/בָּ֑יִת וַ/יֵּ֖שֶׁב בְּ/ת֥וֹךְ הָ/עָֽם־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/039/014.yaml
  text: So they sent and took Jeremiah from the court of the guard, and they entrusted him to Gedaliah son of Ahikam, son of Shaphan, to bring him home. So he lived among the people.
translation:
  language: zh_hans
  text: 于是，他们派人把耶利米从护卫院带出来，交给沙番的孙子、亚希甘的儿子基大利，让他带耶利米回家。耶利米就住在百姓中间。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חֲצַר הַמַּטָּרָה
  choice: 护卫院
  rationale: 指拘押并看守人员的院落；“护卫院”简洁，并与耶利米书相关上下文的惯常译法一致。
- source_word: וַיִּתְּנוּ אֹתוֹ אֶל גְּדַלְיָהוּ
  choice: 交给……基大利
  rationale: 保留 נתן אֶל 在此表示交由某人照管、处置的关系，不额外加入“托付”等较强解释。
- source_word: לְהוֹצִיאֵהוּ אֶל הַבָּיִת
  choice: 让他带耶利米回家
  rationale: הַבַּיִת 字面为“那房屋/家”；依语境自然译作“家”，但原文未明确说明是谁的家，因此中文不添加所有者。
- source_word: וַיֵּשֶׁב בְּתוֹךְ הָעָם
  choice: 耶利米就住在百姓中间
  rationale: 明确原文省略但可由上下文确定的主语，避免中文把主语误解为基大利；“住在百姓中间”贴近原文。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而通顺的叙事体。亲属关系按中文习惯由远及近表达为“沙番的孙子、亚希甘的儿子基大利”，既清楚又保留谱系信息。末句重提“耶利米”以消除中文代词歧义。
