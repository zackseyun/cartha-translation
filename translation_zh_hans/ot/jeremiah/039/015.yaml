  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/אֶֽל יִרְמְיָ֖הוּ הָיָ֣ה דְבַר יְהוָ֑ה בִּֽ/הְיֹת֣/וֹ עָצ֔וּר בַּ/חֲצַ֥ר הַ/מַּטָּרָ֖ה לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/039/015.yaml
  text: The word of Yahweh had come to Jeremiah while he was confined in the court of the guard[a], saying,
translation:
  language: zh_hans
  text: 耶利米被拘禁在护卫院[a]里的时候，雅威的话曾临到他，说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“护卫庭院”。
    reason: חֲצַר הַמַּטָּרָה 可较直译为守卫区域的庭院；“护卫院”则是简洁的地点称呼。
lexical_decisions:
- source_word: וְ/אֶל
  choice: 临到他
  rationale: 介词 אֶל 表示话语所临及的对象；句首 וְ 在这里承接并引入一则叙事补述，汉语无需机械译作“并且”。
- source_word: יִרְמְיָהוּ
  choice: 耶利米
  rationale: 采用现代中文圣经传统中通行的人名音译。
- source_word: הָיָה דְבַר יְהוָה
  choice: 雅威的话曾临到
  rationale: 保留先知书中表示领受神启示的固定表达。“曾”体现本句对先前发生之事的回叙，同时避免把 הָיָה 生硬译作“是”。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以通行的现代汉语形式音译四字神名，保留其专名性质。
- source_word: בִּֽ/הְיֹת֣/וֹ
  choice: ……的时候
  rationale: 不定式结构带第三人称后缀，引出与主句同时发生的时间背景；汉语用“……的时候”自然表达。
- source_word: עָצוּר
  choice: 被拘禁
  rationale: 该词表示受到限制、被看守；“被拘禁”符合此处羁押情境，又不把具体法律身份说得过满。
- source_word: בַּ/חֲצַר הַ/מַּטָּרָה
  choice: 在护卫院里
  rationale: חָצֵר 指院落，מַטָּרָה 在此指守卫或拘押区域；“护卫院”简洁保留地点名称，脚注列出较直译的表达。
- source_word: לֵ/אמֹר
  choice: 说：
  rationale: 这是引出下节直接引语的常用公式；汉语以“说：”衔接最自然。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；译作“雅威”保留其作为以色列之神专名的性质，不以称号替代。
- issue: דְבַר יְהוָה 的先知性公式
  choice: 雅威的话曾临到他
  alternative: 雅威的信息曾传给他
  rationale: “话临到”保留先知书的固定启示公式及其神学分量，不将其弱化为一般信息传递；“曾”表达回叙关系，但不改变启示发生于拘禁期间这一时间关系。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。调整原文语序，将时间从句前置，使句子清楚流畅；保留“话临到”的先知书传统表达，并以冒号引出下一节神谕。
