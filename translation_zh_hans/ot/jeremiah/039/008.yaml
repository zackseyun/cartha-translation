base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/039/008.yaml
  text: The Chaldeans burned the king’s house and the houses of the people with fire[b][a], and they tore down the walls of Jerusalem.
translation:
  language: zh_hans
  text: 迦勒底人[b]用火焚烧了王宫[a]和百姓的房屋，又拆毁了耶路撒冷的城墙。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “王宫”直译为“王的房屋”。
    reason: lexical_alternative
  - marker: b
    text: “迦勒底人”在这里指巴比伦的军队。
    reason: cultural_note
lexical_decisions:
- source_word: בֵּית הַמֶּלֶךְ
  choice: 王宫
  rationale: 字面为“王的房屋”，在王室语境中指王宫；“王宫”是现代汉语中自然、准确的表达，脚注保留其字面形式。
- source_word: בֵּית הָעָם
  choice: 百姓的房屋
  rationale: 单数构造形式与集合名词“百姓”连用，在城邑被毁的语境中宜按分配意义理解为百姓各家的房屋；不额外加入阶层含义。
- source_word: שָׂרְפוּ
  choice: 焚烧了
  rationale: 直接表达“烧”的动作；“焚烧”适合庄重的历史叙事，又不必然断言完全烧尽。
- source_word: הַכַּשְׂדִּים
  choice: 迦勒底人
  rationale: 保留希伯来文的族称；此处语境所指是巴比伦军队，以脚注说明。
- source_word: בָּאֵשׁ
  choice: 用火
  rationale: 介词加“火”在此表示手段；“用火”符合现代汉语习惯，也忠实呈现原文。
- source_word: חֹמוֹת יְרוּשָׁלִַם
  choice: 耶路撒冷的城墙
  rationale: 准确表达构造关系；原文为复数，但汉语通常以集合性的“城墙”自然涵盖全城墙垣。
- source_word: נָתָצוּ
  choice: 拆毁了
  rationale: 表示有意将建筑结构拆除、毁坏；“拆毁”比“打破”更适用于城墙，也比技术性的“拆除”更有叙事力度。
