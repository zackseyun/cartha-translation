base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/039/011.yaml
  text: Nebuchadnezzar king of Babylon gave orders concerning Jeremiah through Nebuzaradan[a], the captain of the guard, saying,
translation:
  language: zh_hans
  text: 巴比伦王尼布甲尼撒借着护卫长尼布撒拉旦[a]，就耶利米下令，说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“行刑官长”；原文直译为“宰杀者之长”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו
  choice: 下令
  rationale: צוה表示发出命令；“下令”简洁自然，并与下一节命令的具体内容衔接。句首的וַ仅承接叙事，不另加“当时”或“现在”。
- source_word: נְבוּכַדְרֶאצַּר
  choice: 尼布甲尼撒
  rationale: 采用现代中文圣经读者熟悉的巴比伦王名译法。
- source_word: מֶלֶךְ בָּבֶל
  choice: 巴比伦王
  rationale: 自然、准确地表达希伯来语属格结构“巴比伦的王”。
- source_word: עַל יִרְמְיָהוּ
  choice: 要他处置耶利米
  rationale: 在צוה与עַל的搭配中，命令是关于耶利米的；结合下一节内容，“要他处置耶利米”在中文中清楚表明命令对象并非耶利米本人，同时不预先限定具体处置方式。
- source_word: בְּיַד
  choice: 通过
  rationale: 该习语表示借某人的手施行，即由其传达或执行；“通过”保留中介关系。
- source_word: נְבוּזַרְאֲדָן
  choice: 尼布撒拉旦
  rationale: 采用现代中文圣经传统中通行且易辨认的人名译法。
- source_word: רַב טַבָּחִים
  choice: 护卫长
  rationale: 此宫廷军职字面与宰杀、行刑有关，但语境中指统领王室护卫或行刑人员的高级官员；正文用通顺的职衔，字面义保留于脚注。
- source_word: לֵאמֹר
  choice: 说
  rationale: 保留引出下一节命令内容的引语公式；冒号提示话语将在下节继续。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“通过……下令，要他处置……”明确命令经尼布撒拉旦传达或执行，并避免误读为直接向耶利米下令。保留句末“说”，以对应原文引语公式及跨节未完句。
