source:
  edition: WLC
  text: כִּ֤י מַלֵּט֙ אֲמַלֶּטְ/ךָ֔ וּ/בַ/חֶ֖רֶב לֹ֣א תִפֹּ֑ל וְ/הָיְתָ֨ה לְ/ךָ֤ נַפְשְׁ/ךָ֙ לְ/שָׁלָ֔ל כִּֽי בָטַ֥חְתָּ בִּ֖/י נְאֻם יְהוָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/039/018.yaml
  text: For I will surely rescue you[a], and you will not fall by the sword. Your life will be yours as plunder, because you have trusted in me[b], declares Yahweh.
translation:
  language: zh_hans
  text: 因为我必定救你[a]，你必不会倒在刀剑之下。你的性命必成为你的战利品[b]，因为你信靠了我。这是雅威的宣告。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语把同一词根的绝对不定式与限定动词连用，以加强语气，也可译作“我一定会搭救你”。
    reason: lexical_alternative
  - marker: b
    text: “性命作战利品”是战争用语，意思是即使其他东西失去，仍能保住性命、逃脱灾祸。
    reason: cultural_note
lexical_decisions:
- source_word: מַלֵּט אֲמַלֶּטְךָ
  choice: 我必定救你
  rationale: 希伯来语以绝对不定式配合同根限定动词加强语气；“必定救你”自然地表达这一强调，并贴合眼前从战祸中获救的语境。
- source_word: וּבַחֶרֶב לֹא תִפֹּל
  choice: 你必不会倒在刀剑之下
  rationale: 保留 נפל“倒下”的战争用语，同时让现代读者清楚理解为不会被刀剑击杀。
- source_word: וְהָיְתָה לְךָ נַפְשְׁךָ לְשָׁלָל
  choice: 你的性命必归你作战利品
  rationale: 保留耶利米书反复使用的战争隐喻：人在灾祸中虽未必保住其他一切，却能带着性命逃脱。
- source_word: נַפְשְׁךָ
  choice: 你的性命
  rationale: 此处 נֶפֶשׁ 指人在战争中得以保全的生命，并非专指非物质的“灵魂”。
- source_word: לְשָׁלָל
  choice: 作战利品
  rationale: “战利品”准确保留战争背景下的隐喻，也比单说“掠物”更符合现代汉语。
- source_word: כִּי בָטַחְתָּ בִּי
  choice: 因为你信靠了我
  rationale: בטח 表示倚赖、信赖；“信靠”保留关系性的倚靠含义，“了”体现此信靠已成为应许的根据。
- source_word: נְאֻם יְהוָה
  choice: 这是雅威的宣告
  rationale: נְאֻם 是先知话语中庄重的宣告公式；采用“宣告”而非普通的“说”。
- source_word: יְהוָה
  choice: 雅威
  rationale: 直接音译四字神名，表明原文此处使用的是专名，而非一般称号“主”。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名；“雅威”较贴近通行的学术重构读音，并避免把专名改写为称号。
- issue: נֶפֶשׁ 在“作战利品”这一惯用语中的含义
  choice: 性命
  alternative: 灵魂；自己
  rationale: 上下文关乎战乱中的肉身存活；译作“性命”不把这里变成有关灵魂构成的教义陈述。
- issue: 获救应许与信靠之间的关系
  choice: 保留“因为”所表达的因由关系
  alternative: 弱化为“而你信靠了我”
  rationale: כִּי 明确把应许与对神的信靠联系起来；译文保留这种张力，不进一步界定其系统神学性质。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“倒在刀剑之下”与“性命作战利品”保留原文战争意象，并用脚注解释较陌生的惯用语；整体避免古奥措辞和宗派化术语。
