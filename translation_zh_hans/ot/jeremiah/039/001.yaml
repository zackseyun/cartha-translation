base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/039/001.yaml
  text: In the ninth year of Zedekiah king of Judah[a], in the tenth month, Nebuchadnezzar king of Babylon came to Jerusalem with all his army, and they laid siege to it.
translation:
  language: zh_hans
  text: 犹大王西底家在位第九年十月，巴比伦王尼布甲尼撒[a]率领全军来到耶路撒冷，围困耶路撒冷。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文此处的人名形式更接近“尼布甲利撒”；“尼布甲尼撒”是通行译名。
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּשָּׁנָה הַתְּשִׁעִית לְצִדְקִיָּהוּ מֶלֶךְ יְהוּדָה
  choice: 犹大王西底家在位第九年
  rationale: לְ在纪年表达中标明以西底家统治年数为基准；汉语用“在位第九年”自然、准确，并保留“犹大王”这一王号。
- source_word: בַּחֹדֶשׁ הָעֲשִׂרִי
  choice: 十月
  rationale: 直译为“第十个月”；在君王纪年语境中，现代汉语惯用“十月”，并不等同于公历十月。
- source_word: נְבוּכַדְרֶאצַּר
  choice: 尼布甲尼撒
  rationale: 采用现代中文圣经传统中辨识度最高的通行译名；原文此处的辅音形式更贴近“尼布甲利撒”，故以脚注说明。
- source_word: וְכָל חֵילוֹ
  choice: 率领全军
  rationale: חַיִל在此为军事力量、军队；并列结构表达君王与其全军一同来到，汉语以“率领全军”自然呈现其统帅关系。
- source_word: בָּא ... אֶל יְרוּשָׁלִַם
  choice: 来到耶路撒冷
  rationale: בוא与אֶל基本义为“来到／向着”；敌对行动已由下一分句明确，不在介词中额外加入“攻打”。
- source_word: וַיָּצֻרוּ עָלֶיהָ
  choice: 围攻这城
  rationale: צור在此语境指包围、围城；阴性代词指耶路撒冷。译作“这城”比单用“它”更符合现代汉语叙事。
