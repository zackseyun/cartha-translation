  text: וּ/מִן הָ/עָ֣ם הַ/דַּלִּ֗ים אֲשֶׁ֤ר אֵין לָ/הֶם֙ מְא֔וּמָה הִשְׁאִ֛יר נְבוּזַרְאֲדָ֥ן רַב טַבָּחִ֖ים בְּ/אֶ֣רֶץ יְהוּדָ֑ה וַ/יִּתֵּ֥ן לָ/הֶ֛ם כְּרָמִ֥ים וִֽ/יגֵבִ֖ים בַּ/יּ֥וֹם הַ/הֽוּא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/039/010.yaml
  text: But Nebuzaradan the captain of the guard left some of the poorest of the people[a], who had nothing, in the land of Judah, and on that day he gave them vineyards and fields.
translation:
  language: zh_hans
  text: 但护卫长尼布撒拉旦把百姓中一无所有的穷人留在犹大地；那一天，他把葡萄园和田地[a]给了他们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “田地”所译的希伯来词词义不确定，也可能指“水池”或“酒榨”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִן הָעָם הַדַּלִּים
  choice: 但……百姓中……的穷人
  rationale: וּ承接并带出与前文处置的对照，译作“但”；מִן表达从整体中取出一部分的关系，以“百姓中”自然呈现。הַדַּלִּים指贫穷、社会地位低下的人，译作“穷人”。
- source_word: אֲשֶׁר אֵין לָהֶם מְאוּמָה
  choice: 一无所有的
  rationale: 该关系从句强调他们什么财物都没有；“一无所有”准确保留绝对语气，又符合现代汉语表达。
- source_word: הִשְׁאִיר
  choice: 留在
  rationale: 使役形在此表示让这些人留下、未被掳走；结合地点短语译作“留在”简洁清楚。
- source_word: נְבוּזַרְאֲדָן
  choice: 尼布撒拉旦
  rationale: 采用现代中文圣经传统中通行的人名音译。
- source_word: רַב טַבָּחִים
  choice: 护卫长
  rationale: 这是巴比伦官员的职衔；底层词义可涉及屠宰者、行刑者或卫士，但上下文主要指宫廷或军政护卫官长，“护卫长”既通行又避免过度限定为刽子手。
- source_word: בְּאֶרֶץ יְהוּדָה
  choice: 在犹大地
  rationale: 保留“地”所表达的领土含义，而不只译作“在犹大”。
- source_word: כְּרָמִים
  choice: 葡萄园
  rationale: 该词明确指种植葡萄的园地。
- source_word: וִיגֵבִים
  choice: 田地
  rationale: 此词词义不确定；与“葡萄园”并列，并作为分给穷人的农业资产，“田地”在语境中较为顺畅，但其他解释保留于脚注。
- source_word: בַּיּוֹם הַהוּא
  choice: 那一天
  rationale: 自然、准确地表达标准时间短语；置于分句开头符合现代汉语叙事习惯。
theological_decisions: []
