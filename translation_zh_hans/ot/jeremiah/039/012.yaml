  yaml_path: translation/ot/jeremiah/039/012.yaml
  text: Take him, keep your eyes on him, and do him no harm; rather, do with him just as he speaks to you.
translation:
  language: zh_hans
  text: “把他带走，留心照看他，不可加害于他；他对你怎么说，你就怎样对待他。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קָחֶנּוּ
  choice: 把他带来
  rationale: קח带第三人称单数宾语，语境中是命人接管并带走耶利米；“带来”比孤立的“带走”更自然，也不额外限定拘押或释放。
- source_word: וְעֵינֶיךָ שִׂים עָלָיו
  choice: 好好照看他
  rationale: 字面为“把你的眼睛放在他身上”，是留意、看顾之意；采用现代汉语自然表达，同时保留关照和保护的语义。
- source_word: וְאַל־תַּעַשׂ לוֹ מְאוּמָה רָּע
  choice: 不可伤害他
  rationale: 原文意为“不可对他做任何坏事”；在此命令语境中，“不可伤害他”准确而简洁。
- source_word: כִּי אם
  choice: ；
  rationale: 该组合在这里引出与前一禁令相对的正面吩咐，可理解为“而要/只要”；汉语用分号并在后句采用“就”结构，自然呈现转折推进，避免生硬直译。
- source_word: כַּאֲשֶׁר יְדַבֵּר אֵלֶיךָ כֵּן עֲשֵׂה עִמּוֹ
  choice: 他对你怎么说，你就照着为他做
  rationale: 保留כַּאֲשֶׁר…כֵּן的对应结构，并将עִמּוֹ译为“为他做”，符合这里按耶利米请求处置他的语境。
