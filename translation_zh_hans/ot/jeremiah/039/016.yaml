  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: הָל֣וֹךְ וְ/אָמַרְתָּ֡ לְ/עֶבֶד מֶ֨לֶךְ הַ/כּוּשִׁ֜י לֵ/אמֹ֗ר כֹּֽה אָמַ֞ר יְהוָ֤ה צְבָאוֹת֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל הִנְ/נִי֩ מבי אֶת דְּבָרַ֜/י אֶל הָ/עִ֥יר הַ/זֹּ֛את לְ/רָעָ֖ה וְ/לֹ֣א לְ/טוֹבָ֑ה וְ/הָי֥וּ לְ/פָנֶ֖י/ךָ בַּ/יּ֥וֹם הַ/הֽוּא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/039/016.yaml
  text: 'Go and say to Ebed-melech the Cushite[a], ‘Thus says Yahweh of hosts, the God of Israel: Behold, I am bringing my words against this city for harm and not for good[b], and they will come to pass before you on that day.’'
translation:
  language: zh_hans
  text: “你去告诉古实人以伯·米勒[a]说：‘万军之耶和华、以色列的上帝如此说：看哪，我要使我的话临到这城，使这城遭灾，而不蒙福[b]；到那日，这些话必在你眼前应验[c]。’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“埃塞俄比亚人”。原文作“古实人”。
    reason: lexical_alternative
  - marker: b
    text: 或译“为灾祸，而不为福”。
    reason: literal_rendering
  - marker: c
    text: 原文较直译：“到那日，它们必在你面前。”
    reason: literal_rendering
lexical_decisions:
- source_word: הָלוֹךְ וְאָמַרְתָּ
  choice: 你去告诉
  rationale: 以自然的现代汉语表达加强命令语气的不定词绝对式加限定动词结构；“去告诉”同时保留行动与传话的指令。
- source_word: לְעֶבֶד מֶלֶךְ
  choice: 以伯·米勒
  rationale: 此处是人名，采用音译，不按普通名词短语翻译。
- source_word: הַכּוּשִׁי
  choice: 古实人
  rationale: 直接对应希伯来族称“古实人”，避免以较晚的地理名称取代原文称谓。
- source_word: כֹּה אָמַר
  choice: 如此说
  rationale: 保留先知传信公式的庄重语气，同时符合现代汉语表达。
- source_word: יְהוָה צְבָאוֹת
  choice: 万军之耶和华
  rationale: “耶和华”呈现四字神名的传统汉语音译；“万军之”保留该神圣称号所指受上帝统领的众军。
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: 以色列的上帝
  rationale: 直接呈现原文所属结构及其身份说明。
- source_word: הִנְנִי
  choice: 看哪，我必
  rationale: “看哪”保留郑重提醒和临近感；结合后面的分词及审判语境，用“我必”表达行动的确定性。
- source_word: מבי（מֵבִיא）
  choice: 使……临到
  rationale: 使役分词字面为“使……来到”；“使我所说的话临到这城”保留使役结构及预言即将落实的含义。
- source_word: אֶת דְּבָרַי
  choice: 我所说的话
  rationale: 原文为复数“我的话”；汉语用集合性的“我所说的话”自然地指此前宣告的审判信息，并未改为单一的“话语”。
- source_word: אֶל הָעִיר הַזֹּאת
  choice: 临到这城
  rationale: 保留介词所表达的朝向；后文已明确其结果是灾祸，因此无需把敌对含义全部压入介词。
- source_word: לְרָעָה וְלֹא לְטוֹבָה
  choice: 给它带来灾祸，而不是福祉
  rationale: 审判语境中的רָעָה指灾祸而非道德邪恶；“灾祸／福祉”清楚保留原文的对照。
- source_word: וְהָיוּ לְפָנֶיךָ בַּיּוֹם הַהוּא
  choice: 到那日，这些话必在你眼前应验
  rationale: 字面是“到那日，它们必在你面前”；这里的复数回指上帝的话。“在你眼前应验”自然表达这些宣告的事件将由他亲眼见证，同时以脚注保存较字面的理解。
theological_decisions:
- issue: 四字神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用上帝的专名而非“主”的称号。正文采用现代中文圣经读者最熟悉的音译“耶和华”，不以头衔替代神名；“雅威”是另一种较贴近学术重构读音的音译。
- issue: “这些话必在你面前”的语义
  choice: 这些话必在你眼前应验
  alternative: 这些话必摆在你面前
  rationale: 上下文指上帝针对耶路撒冷的审判宣告将成为以伯·米勒亲眼见到的现实。正文作符合汉语习惯的语境化表达，脚注保留原文较为含蓄的字面措辞，避免掩盖其表达张力。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。保留先知传信公式“如此说”和提示词“看哪”，以维持原文的宣告力度；其余句法按自然汉语调整。所有脚注标记均已置于正文相应位置。
