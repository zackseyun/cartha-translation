  to: “你去告诉古实人以伯·米勒[a]说：‘万军之耶和华、以色列的上帝如此说：看哪，我要使我的话临到这城，使这城遭灾，而不蒙福[b]；到那日，这些话必在你眼前应验[c]。’”
