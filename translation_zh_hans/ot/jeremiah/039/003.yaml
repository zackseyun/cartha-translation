source:
  edition: WLC
  text: וַ/יָּבֹ֗אוּ כֹּ֚ל שָׂרֵ֣י מֶֽלֶךְ בָּבֶ֔ל וַ/יֵּשְׁב֖וּ בְּ/שַׁ֣עַר הַ/תָּ֑וֶךְ נֵרְגַ֣ל שַׂר אֶ֠צֶר סַֽמְגַּר נְב֞וּ שַׂר סְכִ֣ים רַב סָרִ֗יס נֵרְגַ֤ל שַׂר אֶ֨צֶר֙ רַב מָ֔ג וְ/כָל שְׁאֵרִ֔ית שָׂרֵ֖י מֶ֥לֶךְ בָּבֶֽל־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/039/003.yaml
  text: 'Then all the officials of the king of Babylon came in and sat in the Middle Gate: Nergal-sharezer[a], Samgar-nebu, Sarsechim the Rab-saris, Nergal-sharezer the Rab-mag[d][c][b], and all the rest of the officials of the king of Babylon.'
translation:
  language: zh_hans
  text: 于是，巴比伦王的所有官员都进来，坐在中门[a]。他们是：尼甲·沙利薛、三甲·尼波、撒西金[b]——拉伯撒里斯[c]，尼甲·沙利薛——拉伯玛格[d]，以及巴比伦王其余所有的官员。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“坐在中门内”或“坐在中门那里”。这里的希伯来语介词既可表示在城门建筑内，也可泛指在城门处。
    reason: lexical_alternative
  - marker: b
    text: “三甲·尼波、撒西金——拉伯撒里斯”这一连串名称和官衔很难确定如何切分。有人提出其他划分方式，例如把“三甲”或“撒西金”理解为官衔，而不是人名的一部分。
    reason: alternative_reading
  - marker: c
    text: “拉伯撒里斯”是巴比伦官衔，传统上常理解为“太监长”或“宫廷总管”。
    reason: cultural_note
  - marker: d
    text: “拉伯玛格”是巴比伦官衔，可能意为“术士长”，或指一位地位很高的宗教礼仪官员。
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: 进来
  rationale: 该动词在耶路撒冷被攻破的叙事语境中表示进入城内；“进来”自然地保留了向内进入的方向。
- source_word: כֹּל שָׂרֵי מֶלֶךְ בָּבֶל
  choice: 巴比伦王的所有官员
  rationale: שָׂרֵי 可指高级官员、统领或首领；“官员”既符合宫廷与军事背景，也避免将其误解为王子或仅限于将领。
- source_word: וַיֵּשְׁבוּ
  choice: 坐
  rationale: 保留 ישׁב 的直接含义；这些官员占据城门区域、行使权威的语境意义不在正文中额外发挥。
- source_word: בְּשַׁעַר הַתָּוֶךְ
  choice: 在中门内
  rationale: שַׁעַר הַתָּוֶךְ 很可能是特定城门的名称或称谓；“中门”简洁自然，“内”对应介词 בְּ，同时用脚注保留“在中门那里”的可能。
- source_word: נֵרְגַל שַׂר אֶצֶר
  choice: 尼甲·沙利薛
  rationale: 作为巴比伦人名采用音译，并以间隔号显示其复合名称结构。
- source_word: סַמְגַּר נְבוּ
  choice: 三甲·尼波
  rationale: 按马所拉元音所呈现的名称音译；由于整段人名与官衔的切分有争议，另以脚注说明。
- source_word: שַׂר סְכִים
  choice: 撒西金
  rationale: 依马所拉文本按人名音译，避免在正文中武断地改作官衔；其他切分方式列入脚注。
- source_word: רַב סָרִיס
  choice: 拉伯撒里斯
  rationale: 这是巴比伦官衔的音译。正文不直接译作“太监长”，以免断定任职者必为阉人；可能含义在脚注交代。
- source_word: רַב מָג
  choice: 拉伯玛格
  rationale: 这是巴比伦官衔的音译，可能涉及宗教礼仪或学术职务；音译可避免把后世对“术士”的理解直接带入正文。
- source_word: וְכָל שְׁאֵרִית שָׂרֵי מֶלֶךְ בָּבֶל
  choice: 以及巴比伦王其余所有的官员
  rationale: שְׁאֵרִית 在此指名单中未逐一列名的其余官员；此译法符合现代汉语表达。
