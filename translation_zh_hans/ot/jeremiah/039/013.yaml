  text: וַ/יִּשְׁלַ֞ח נְבֽוּזַרְאֲדָ֣ן רַב טַבָּחִ֗ים וּ/נְבֽוּשַׁזְבָּ רַב סָרִ֔יס וְ/נֵרְגַ֥ל שַׂר אֶ֖צֶר רַב מָ֑ג וְ/כֹ֖ל רַבֵּ֥י מֶֽלֶךְ בָּבֶֽל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/039/013.yaml
  text: Nebuzaradan the captain of the guard[a], Nebushazban the chief officer, Nergal-sharezer the chief magus[c][b], and all the chief officials of the king of Babylon sent word.
translation:
  language: zh_hans
  text: 于是，护卫长尼布撒拉旦、宫廷官长尼布沙斯班、术士长尼甲沙利薛，以及巴比伦王所有的高官，差人去。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: 都派人去
  rationale: 原词意为“差遣、派出”。希伯来文在这里省略了受差遣者，下一节才接着说明他们去把耶利米带出来；汉语补出泛指的“人”，可自然表达这一省略结构，又不具体断定所派者是谁。动词虽为单数，但位于复合主语之前，可按全组官员理解。
- source_word: רַב טַבָּחִים
  choice: 护卫长
  rationale: 这是受阿卡德语影响的宫廷军职称号，所指并非普通“屠夫”，而是统领王室卫队、并可能负责刑罚事务的高级官员。“护卫长”简明且符合上下文。
- source_word: רַב סָרִיס
  choice: 宫廷官长
  rationale: סָרִיס既可指“太监”，也可泛指宫廷高官。此处采用不对其身体身份作过度断定的译法，并以脚注保留另一可能。
- source_word: נְבוּשַׁזְבָּ
  choice: 尼布沙斯班
  rationale: 按普通话音译这一巴比伦人名。
- source_word: נֵרְגַל שַׂר אֶצֶר
  choice: 尼甲沙利薛
  rationale: 将这一完整的巴比伦人名作惯用汉语音译，不按希伯来文表面分词误拆为多个成分。
- source_word: רַב מָג
  choice: 术士长
  rationale: 将巴比伦宫廷称号按传统理解译出其职能和等级；“术士”在现代汉语中可表示从事占卜、法术等宫廷宗教活动者，脚注同时说明该称号也可音译。
- source_word: וְכֹל רַבֵּי מֶלֶךְ בָּבֶל
  choice: 以及巴比伦王所有的高官
  rationale: רַבֵּי在这里指王室中的高级官员，并非血统意义上的“王子”；“高官”准确传达其地位。
theological_decisions: []
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。官衔尽量译出职能，同时用脚注保留词义或身份上的不确定性；句末用“派人去”承接下一节，避免擅自补出具体任务。
