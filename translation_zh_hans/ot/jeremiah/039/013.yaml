  naturalness: 整体庄重通顺；“差人去”比“都派人去”更简洁，也更贴近经文在下一节才展开的行动。
  terminology: “护卫长”“宫廷官长”“术士长”均可用。“拉墨”不是 רַב־מָג 的适切音译，宜改为“拉伯玛格”，并说明亦可保留为音译称号。人名沿用译稿的常用汉语圣经形式可接受。
