  text: וַ/יִּרְדְּפ֨וּ חֵיל כַּשְׂדִּ֜ים אַחֲרֵי/הֶ֗ם וַ/יַּשִּׂ֣גוּ אֶת צִדְקִיָּהוּ֮ בְּ/עַֽרְב֣וֹת יְרֵחוֹ֒ וַ/יִּקְח֣וּ אֹת֗/וֹ וַֽ֠/יַּעֲלֻ/הוּ אֶל נְבוּכַדְרֶאצַּ֧ר מֶֽלֶךְ בָּבֶ֛ל רִבְלָ֖תָ/ה בְּ/אֶ֣רֶץ חֲמָ֑ת וַ/יְדַבֵּ֥ר אִתּ֖/וֹ מִשְׁפָּטִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/039/005.yaml
  text: But the army of the Chaldeans pursued them and overtook Zedekiah in the plains of Jericho. They seized him and brought him up to Nebuchadnezzar king of Babylon at Riblah[a], in the land of Hamath, and he passed sentence on him.
translation:
  language: zh_hans
  text: 迦勒底人的军队追赶他们，在耶利哥的平原追上西底家。他们擒住他，把他带上去，交给在哈马地利比拉的巴比伦王尼布甲尼撒；他就向西底家宣判。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חֵיל כַּשְׂדִּים
  choice: 迦勒底人的军队
  rationale: חֵיל在此指军事力量；כַּשְׂדִּים直译为“迦勒底人”。保留原文的族群—政治称谓，不以“巴比伦人”替换。
- source_word: וַיִּרְדְּפוּ ... אַחֲרֵיהֶם
  choice: 追赶他们
  rationale: רדף与אַחֲרֵי连用表示从后追逐；“追赶”自然、准确。
- source_word: וַיַּשִּׂגוּ
  choice: 追上了
  rationale: נשׂג在追捕语境中意为赶上、追及；“追上了”符合现代汉语叙事。
- source_word: בְּעַרְבוֹת יְרֵחוֹ
  choice: 在耶利哥平原
  rationale: עֲרָבוֹת指约旦裂谷一带的平原或旷野平地；“耶利哥平原”清楚而不过度技术化。
- source_word: וַיִּקְחוּ אֹתוֹ
  choice: 他们擒住西底家
  rationale: לקח字面为“拿、带走”，在军事追捕的上下文中指擒获；重复姓名可避免连续代词造成歧义。
- source_word: וַיַּעֲלֻהוּ אֶל
  choice: 把他押到……带到……那里
  rationale: עלה的使役形式表示带上去；中文以“押到／带到”自然表达被俘后解送的动作，而不勉强保留地势方向。
- source_word: נְבוּכַדְרֶאצַּר
  choice: 尼布甲尼撒
  rationale: 采用现代中文圣经和一般中文中较熟悉的标准译名。原文拼写反映同一巴比伦王姓名的另一形式，在中文中无需另设异体音译。
- source_word: רִבְלָתָה
  choice: 利比拉
  rationale: 按通行中文专名音译；希伯来语向格词尾以中文介词结构表达。
- source_word: בְּאֶרֶץ חֲמָת
  choice: 哈马地
  rationale: אֶרֶץ为“地、地区”；“哈马地”简洁保留地理限定。
- source_word: וַיְדַבֵּר אִתּוֹ מִשְׁפָּטִים
  choice: 王就向他宣判
  rationale: 该短语字面为“与／向他讲判决”，是司法语境中的惯用表达。“宣判”保留正式裁决含义，并比逐字译作“讲论审判”自然。补出“王”以明确希伯来语动词的主语所指。
theological_decisions:
- issue: מִשְׁפָּטִים的复数形式
  choice: 译作“宣判”，按希伯来语司法惯用语整体表达
  alternative: 向他宣布各项判决／向他说出审判的话
  rationale: 这里叙述君王对俘虏作司法裁断，并非展开多项神学意义上的“审判”。现代汉语“宣判”能自然表达该行为；上下文并未说明具体判项，因此不擅自增补。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。叙事动作清晰紧凑；专名使用简体中文通行译法。原文没有需要以脚注保留、且对中文读者有实质意义的异文或词义歧义，因此不设脚注。
