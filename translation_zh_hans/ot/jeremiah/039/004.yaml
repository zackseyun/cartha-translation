base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/039/004.yaml
  text: And when Zedekiah king of Judah and all the men of war saw them[a], they fled and went out by night from the city by way of the king’s garden, through the gate between the two walls[b]; and he went out by way of the Arabah.
translation:
  language: zh_hans
  text: 犹大王西底家和所有战士一看见他们，就逃跑了。他们趁夜出城，取道王园，从两道城墙之间的门出去；他[a]便取道亚拉巴[b]而去。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来原文在这里用单数“他”，前文则用复数“他们”；有些译本为使前后一致，将这里顺译为“他们”。
    reason: textual_variant
  - marker: b
    text: “亚拉巴”也可译作“平原”或“约旦河谷”。
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאָם
  choice: 看见他们
  rationale: ראה带第三人称阳性复数宾语后缀，直译为“看见他们”；结合上文，所指是巴比伦军队，但正文保留代词，不把所指直接写死。
- source_word: אַנְשֵׁי הַמִּלְחָמָה
  choice: 战士
  rationale: 该结构指参与作战的人员；“战士”简洁、庄重，也比逐字译作“战争之人”更符合现代汉语。
- source_word: וַיִּבְרְחוּ
  choice: 就逃跑了
  rationale: 准确表达 ברח 的逃离含义，并用“就”自然承接“一看见……”。
- source_word: וַיֵּצְאוּ לַיְלָה
  choice: 趁夜出城
  rationale: לַיְלָה表示在夜间行动；“趁夜”既简洁，又符合秘密逃离的叙事语境。
- source_word: דֶּרֶךְ גַּן הַמֶּלֶךְ
  choice: 取道王园
  rationale: דֶּרֶךְ在此表示路线；“取道”保留经由某处的含义，同时不武断说明是穿园而过还是沿园而行。
- source_word: בְּשַׁעַר בֵּין הַחֹמֹתָיִם
  choice: 从两道城墙之间的门出去
  rationale: חֹמֹתָיִם是双数，明确译出“两道城墙”；介词结合移动语境自然译为“从……门出去”。
- source_word: וַיֵּצֵא
  choice: 他便……去了
  rationale: 马所拉文本的动词为第三人称阳性单数，故保留由前面复数转为单数的变化，不顺译成“他们”。
- source_word: הָעֲרָבָה
  choice: 亚拉巴
  rationale: 此处很可能是地理名称，采用音译可保留地域指向，避免泛化成普通的“平原”。
