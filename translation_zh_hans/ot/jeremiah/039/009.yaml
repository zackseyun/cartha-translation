  text: וְ/אֵת֩ יֶ֨תֶר הָ/עָ֜ם הַ/נִּשְׁאָרִ֣ים בָּ/עִ֗יר וְ/אֶת הַ/נֹּֽפְלִים֙ אֲשֶׁ֣ר נָפְל֣וּ עָלָ֔י/ו וְ/אֵ֛ת יֶ֥תֶר הָ/עָ֖ם הַ/נִּשְׁאָרִ֑ים הֶגְלָ֛ה נְבֽוּזַר אֲדָ֥ן רַב טַבָּחִ֖ים בָּבֶֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/039/009.yaml
  text: As for the rest of the people who remained in the city[a], and the deserters who had gone over to him, together with the rest of the people who remained, Nebuzaradan, the captain of the guard[c][b], carried away to Babylon.
translation:
  language: zh_hans
  text: 至于城里剩下的百姓、那些投奔他的人[a]，以及其余剩下的百姓[b]，护卫长[c]尼布撒拉旦都掳到巴比伦去了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “投奔他”直译为“倒向他”；这是军事语境中的惯用说法，指转而归附或投降对方。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文再次说“其余剩下的百姓”；译文保留了这一重复。
    reason: lexical_alternative
  - marker: c
    text: “护卫长”所译的官衔，字面与“宰杀者之长”有关，指巴比伦王室或军队中的正式职位。
    reason: cultural_note
lexical_decisions:
- source_word: יֶתֶר הָעָם הַנִּשְׁאָרִים בָּעִיר
  choice: 城里剩下的百姓
  rationale: 按希伯来文表达“其余／剩下”之意，并保留地点短语；现代汉语中简洁自然。
- source_word: הַנֹּפְלִים אֲשֶׁר נָפְלוּ עָלָיו
  choice: 那些投奔他的人
  rationale: נפל על 在军事政治语境中是转而归附、投奔对方的惯用语。“投奔他”表达这一含义，同时不把所指的“他”擅自明确为某个具体人物。
- source_word: וְאֵת יֶתֶר הָעָם הַנִּשְׁאָרִים
  choice: 以及其余剩下的百姓
  rationale: 原文再次出现“其余……剩下的百姓”；译文保留重复，不将两组人合并或删略。
- source_word: הֶגְלָה
  choice: 掳到……去了
  rationale: 使役形表达强制带离、迁徙流放；“掳到巴比伦去了”符合战争语境，也比现代行政用语“遣送／驱逐”更贴切。
- source_word: נְבוּזַר אֲדָן
  choice: 尼布撒拉旦
  rationale: 采用该巴比伦官员名字的常见汉语音译。
- source_word: רַב טַבָּחִים
  choice: 护卫长
  rationale: 这是巴比伦王室或军政官职；字面虽与“宰杀者”相关，但在本语境中指护卫队首领。
- source_word: בָּבֶל
  choice: 巴比伦
  rationale: 采用地名的通行汉译。
theological_decisions:
- issue: “投奔他”中代词所指
  choice: 保留“他”，不在正文中明说具体人物
  alternative: 译作“投奔巴比伦王（或巴比伦军队）”
  rationale: 希伯来文只有第三人称单数代词；上下文可帮助判断所指，但本节自身并未明说，故保留原文的指代开放性。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。句首用“至于”承接前文并处理原文前置宾语；用并列结构保留三组对象和原文的重复。
