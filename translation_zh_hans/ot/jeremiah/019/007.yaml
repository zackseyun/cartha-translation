id: JER.19.7
reference: Jeremiah 19:7
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וּ֠/בַקֹּתִי אֶת עֲצַ֨ת יְהוּדָ֤ה וִ/ירוּשָׁלִַ֨ם֙ בַּ/מָּק֣וֹם הַ/זֶּ֔ה וְ/הִפַּלְתִּ֤י/ם בַּ/חֶ֨רֶב֙ לִ/פְנֵ֣י אֹֽיְבֵי/הֶ֔ם וּ/בְ/יַ֖ד מְבַקְשֵׁ֣י נַפְשָׁ֑/ם וְ/נָתַתִּ֤י אֶת נִבְלָתָ/ם֙ לְ/מַֽאֲכָ֔ל לְ/ע֥וֹף הַ/שָּׁמַ֖יִם וּ/לְ/בֶהֱמַ֥ת הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/019/007.yaml
  text: And I will frustrate the plan of Judah and Jerusalem in this place[a], and I will make them fall by the sword before their enemies and by the hand of those who seek their life[c][b], and I will give their corpses as food to the birds of the heavens and to the beasts of the earth.
translation:
  language: zh_hans
  text: 我要在这地方挫败犹大和耶路撒冷的计谋[a]；我要使他们在仇敌面前死于刀剑，落在那些寻索他们性命之人的手中[b]；我要使他们的尸体成为空中的飞鸟[c]和地上走兽的食物。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “计谋”也可译作“谋划”或“主意”。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“寻索他们性命的人”，意思是想要杀害他们的人。
    reason: lexical_alternative
  - marker: c
    text: “空中的飞鸟”直译为“诸天的飞鸟”，这里指天空中的鸟。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַקֹּתִי
  choice: 我要……挫败
  rationale: 此处בקק为使役意义，与“计谋”搭配，指使其落空、失效；“挫败”自然保留主动而明确的审判行动。
- source_word: עֲצַת
  choice: 计谋
  rationale: עֵצָה可指谋略、计划或主意；语境中“计谋”既简明又保留其可能含有筹划、谋策的意味。
- source_word: בַּמָּקוֹם הַזֶּה
  choice: 在这地方
  rationale: 直接保留指示性与地点意义。
- source_word: וְהִפַּלְתִּים בַּחֶרֶב
  choice: 我要使他们……倒在刀下
  rationale: 保留נפל使役式的因果力量；“倒在刀下”是自然、庄重的中文战争死亡表达。
- source_word: לִפְנֵי אֹיְבֵיהֶם
  choice: 在仇敌面前
  rationale: 贴近לִפְנֵי的空间关系，不额外解释为败于或交给仇敌。
- source_word: וּבְיַד מְבַקְשֵׁי נַפְשָׁם
  choice: 也倒在那些索取他们性命的人手中
  rationale: “手中”保留בְיַד所表达的施事或权势；补出承接动词“倒在”使中文句法清楚。“索取他们性命”保留希伯来习语，又能让现代读者理解为意图杀害。
- source_word: נִבְלָתָם
  choice: 他们的尸体
  rationale: 准确指人的死尸，并保留不得安葬、任凭吞食的羞辱意味。
- source_word: לְעוֹף הַשָּׁמַיִם וּלְבֶהֱמַת הָאָרֶץ
  choice: 天空飞鸟和地上走兽
  rationale: 分别自然表达空中鸟类与地上动物；“走兽”适合此处与飞鸟成对的庄重表述。
theological_decisions:
- issue: 神在审判中的直接行动
  choice: 保留三个第一人称主动陈述：“我要……挫败”“我要使……倒在”“我要使……成为”
  alternative: 采用“我要任凭他们……”等弱化直接行动的表达
  rationale: 希伯来文连续使用第一人称主动动词，明确呈现说话者实施审判；译文不将直接行动改写为单纯许可。
- issue: מְבַקְשֵׁי נַפְשָׁם的生命习语
  choice: 索取他们性命的人
  alternative: 寻索他们性命的人；想杀他们的人
  rationale: “索取性命”既传达杀害意图，又保留原文以“性命”为对象的表达，没有完全释义化。
translation_notes:
  register: 采用现代、庄重而清晰的普通话。“倒在刀下”保留经文式审判语体；分号呈现原文连续的三重第一人称行动。所有脚注标记均置于对应词语之后。
