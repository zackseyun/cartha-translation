source:
  edition: WLC
  text: וּ/בָנ֞וּ אֶת בָּמ֣וֹת הַ/בַּ֗עַל לִ/שְׂרֹ֧ף אֶת בְּנֵי/הֶ֛ם בָּ/אֵ֖שׁ עֹל֣וֹת לַ/בָּ֑עַל אֲשֶׁ֤ר לֹֽא צִוִּ֨יתִי֙ וְ/לֹ֣א דִבַּ֔רְתִּי וְ/לֹ֥א עָלְתָ֖ה עַל לִבִּֽ/י־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/019/005.yaml
  text: They have built the high places of Baal to burn their sons in the fire as burnt offerings to Baal—something I did not command or speak[a], nor did it arise in my heart.
translation:
  language: zh_hans
  text: 他们建造了巴力的丘坛，为要把自己的儿子在火中焚烧，作为献给巴力的燔祭——这是我未曾吩咐、未曾说过的[a]，也未曾浮现在我心上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“……未曾提说的。”下句也可译为：“也未曾进入我的意念。”希伯来文直译近于“也未曾升到我心上”。
    reason: 说明“未曾说过”可按上下文译作“未曾提说”，并保留末句希伯来文惯用语的直译及常见意译。
lexical_decisions:
- source_word: וּבָנוּ
  choice: 他们建造了
  rationale: Qal完成式第三人称复数；在先知的控诉中，中文用“建造了”自然表达已经实施、至今仍构成罪责的行动。
- source_word: בָּמוֹת
  choice: 丘坛
  rationale: 这是希伯来圣经中指设于高处或与异教祭祀有关之礼拜场所的术语；“丘坛”简洁并保留其宗教含义。
- source_word: הַבַּעַל / לַבָּעַל
  choice: 巴力／献给巴力
  rationale: 按神名处理；第二处以“献给”清楚表达祭物的归属对象。
- source_word: לִשְׂרֹף
  choice: 为要……焚烧
  rationale: 不定词结构表示建造丘坛的目的；“为要”明确呈现目的关系。
- source_word: בְּנֵיהֶם
  choice: 自己的儿子
  rationale: 原文明确为“他们的儿子”，不泛化为“儿女”或“孩子”；“自己的”在中文中强调行为人与受害者的关系。
- source_word: בָּאֵשׁ
  choice: 在火中
  rationale: 保留介词的处所性表达，也符合献祭场景。
- source_word: עֹלוֹת
  choice: 作为……燔祭
  rationale: עֹלָה是整只焚烧献上的祭物这一技术性祭祀术语；“作为”表明儿子被焚烧而充当祭物。
- source_word: אֲשֶׁר לֹא צִוִּיתִי
  choice: 这是我未曾吩咐……的
  rationale: 关系从句回指前述整项献子行为；“这是”使中文指代清楚。
- source_word: וְלֹא דִבַּרְתִּי
  choice: 未曾说过
  rationale: 紧贴“说”的基本义，不擅自补入宾语；与“未曾吩咐”并列，强调上帝从未发出或表达此事。
- source_word: וְלֹא עָלְתָה עַל לִבִּי
  choice: 也未曾在我心中升起
  rationale: 尽量保留“升到／升在我心上”的希伯来意象和“心”的拟人性表达，同时采用可理解的现代汉语。
theological_decisions:
- issue: 关于上帝内在意向的拟人化表述
  choice: 也未曾在我心中升起
  alternative: 也未曾进入我的意念
  rationale: 原文明确使用“心”，并以“升起”描述此事从未成为上帝内在的意愿或意向。正文保留这一拟人化和情感—意志层面的张力，不将其单纯解释为认知意义上的“不知道”或“没想到”。
- issue: “未曾吩咐、未曾说过”之间的关系
  choice: 保留两个并列否定分句
  alternative: 合并为“我从未吩咐过”
  rationale: 原文分别使用צוה与דבר，形成加强语气的并列；保留二者可避免削弱经文对这种祭祀完全没有神圣授权的强调。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“丘坛”“燔祭”保留常用圣经祭祀术语；句中破折号呈现原文后半段对前述恶行的强烈否定。脚注标记[a]已置于相关分句之后。
