revisions:
- from: 耶路撒冷的房屋和犹大诸王的房屋都必变得不洁净，像陀斐一样[a]；也就是所有那些人们曾在屋顶上向天上万象烧香、向别神浇奠祭的房屋[b]。
  to: 耶路撒冷的房屋和犹大诸王的房屋——就是所有那些在屋顶上向天上的万象烧香、向别神浇奠酒的房屋——都必像陀斐特之地一样，成为不洁净之地[a][b]。
  rationale: 修订以希伯来语文本的复数一致为准：不洁净的是耶路撒冷和犹大王室的各房屋，它们将如陀斐特之地一样成为不洁净之地。破折号将לְכֹל הַבָּתִּים所引出的具体范围以自然的同位语呈现，未将其解释为因果。并将不自然的“浇奠祭”改为“浇奠酒”，保留“烧香”“天上的万象”“别神”等关键祭祀和神学术语。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T07:28:57Z'
review_pass:
  verdict: revise
  source_fidelity: 草稿正确辨认出הַטְּמֵאִים为阳性复数，并将其理解为与复数“房屋”相关，这比英文审计文本把它紧邻地修饰为单数“地方”更符合马所拉文本的形态。然而，正文“变得不洁净，像陀斐一样”使比较关系略显悬空，且“也就是”虽可表达说明关系，却不如直接将“所有……的房屋”置为同位语清楚。
  naturalness: “浇奠祭”不是自然的现代汉语祭祀搭配；“浇奠酒”准确且通顺。“天上的万象”较“天上万象”更合乎现代书面语及中文圣经惯用表达。地名宜采用通行的“陀斐特”。
  terminology: 保留“房屋”“不洁净”“烧香”“天上的万象”“别神”等译法是恰当的。“不洁净”可涵盖此处的礼仪／道德污秽，不应把它改窄为仅物理污秽。原脚注a所称“像陀斐这被玷污的地方一样”为异译不反映该形容词的复数形态，且与正文的正确句法判断相冲突，应改为说明性注释。
  issues:
