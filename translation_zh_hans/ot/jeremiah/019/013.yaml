    issue: 比较结构与同位说明的汉语表达不够清晰
    rationale: “房屋都必变得不洁净，像陀斐一样；也就是所有……”可被读成后半句只是补充说明，未充分体现“所有在屋顶……的房屋”是受审判房屋的具体范围。改为“……的房屋——就是所有……的房屋——都必像陀斐特之地一样成为不洁净之地”可保留原文关系。
  - severity: medium
    issue: “浇奠祭”用语不自然且未明确奠祭的液体供物
    rationale: נְסָכִים指奠酒／奠祭所用的酒；“浇奠酒”是自然、准确的现代汉语表达。
  - severity: low
    issue: 脚注a的异译与希伯来语复数不一致
    rationale: הַטְּמֵאִים是阳性复数，不能直接作单数“地方”的形容词。脚注应说明其与“房屋”相关及“不洁净”的语义，而非把不符合形态的英文式读法列为“或译”。
  - severity: low
