  text: וְ/הָי֞וּ בָּתֵּ֣י יְרוּשָׁלִַ֗ם וּ/בָתֵּי֙ מַלְכֵ֣י יְהוּדָ֔ה כִּ/מְק֥וֹם הַ/תֹּ֖פֶת הַ/טְּמֵאִ֑ים לְ/כֹ֣ל הַ/בָּתִּ֗ים אֲשֶׁ֨ר קִטְּר֜וּ עַל גַּגֹּֽתֵי/הֶם֙ לְ/כֹל֙ צְבָ֣א הַ/שָּׁמַ֔יִם וְ/הַסֵּ֥ךְ נְסָכִ֖ים לֵ/אלֹהִ֥ים אֲחֵרִֽים־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/019/013.yaml
  text: The houses of Jerusalem and the houses of the kings of Judah will become like the unclean place of Topheth—all the houses on whose rooftops they burned incense to all the host of heaven and poured out drink offerings to other gods[a][b].
translation:
  language: zh_hans
  text: 耶路撒冷的房屋和犹大诸王的房屋——就是所有那些在屋顶上向天上的万象烧香、向别神浇奠酒的房屋——都必像陀斐特之地一样，成为不洁净之地[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “不洁净”含有礼仪和道德上的污秽之意。原文此词为复数，与“房屋”相应。
    reason: 语法与词义说明
  - marker: b
    text: “天上的万象”指在星辰崇拜中被当作神明敬拜的日月星辰等天体。
    reason: 文化背景说明
lexical_decisions:
- source_word: וְהָיוּ
  choice: 都必变得
  rationale: היה与比较介词כ连用，在审判语境中表示进入一种结果状态；“必变得”自然传达这一变化。
- source_word: בָּתֵּי יְרוּשָׁלִַם וּבָתֵּי מַלְכֵי יְהוּדָה
  choice: 耶路撒冷的房屋和犹大诸王的房屋
  rationale: 保留两个结构平行的“房屋”，不将后者解释性改写为“王宫”。
- source_word: כִּמְקוֹם הַתֹּפֶת
  choice: 像陀斐一样
  rationale: מקום在此构成“陀斐之地”的表达；现代汉语以“像陀斐一样”更自然，地名本身足以指向该处。
- source_word: הַטְּמֵאִים
  choice: 不洁净
  rationale: 该词为阳性复数，最自然地与前面的复数“房屋”呼应，表达礼仪及道德上的污秽；不依照英文层将其直接当作修饰单数“地方”的形容词。
- source_word: לְכֹל הַבָּתִּים אֲשֶׁר
  choice: 也就是所有那些……的房屋
  rationale: 将לְ理解为说明或具体界定前述房屋的范围，“也就是”清楚表达同位关系。
- source_word: קִטְּרוּ עַל גַּגֹּתֵיהֶם
  choice: 人们曾在屋顶上……烧香
  rationale: קטר的皮勒勒词干在祭祀语境中通常指烧香；中文补出泛指主语“人们”，并以“屋顶上”保留祭祀地点。
- source_word: לְכֹל צְבָא הַשָּׁמַיִם
  choice: 向天上万象
  rationale: 这是指天体整体的固定表达；“天上万象”既自然又保留其群体性和敬拜对象的含义。
- source_word: וְהַסֵּךְ נְסָכִים
  choice: 浇奠祭
  rationale: 以简洁的祭祀用语表达把奠酒浇献出去的行为。
- source_word: לֵאלֹהִים אֲחֵרִים
  choice: 向别神
  rationale: 直接保留先知文献中对其他神明的常用称呼。
theological_decisions:
- issue: הַטְּמֵאִים的句法归属及不洁概念
  choice: 译作复数房屋的谓语：“房屋都必变得不洁净”
  alternative: 译作“像陀斐这不洁净的地方一样”
  rationale: 马所拉文本中的הַטְּמֵאִים为阳性复数，与复数“房屋”一致，而“地方”是阳性单数。正文据此保留最直接的语法关系；脚注说明另一种常见理解。
- issue: “犹大诸王的房屋”的所指
  choice: 保留“房屋”
  alternative: 译作“犹大诸王的宫殿”
  rationale: 原文使用普通名词“房屋”；虽可能实际指王室住所，正文不作超出词面的限定。
- issue: “天上万象”的宗教含义
  choice: 正文保留原有意象，脚注说明其为受敬拜的天体
  alternative: 正文直接译为“天上的一切星体”
  rationale: 保留先知文献的固定表达，同时借脚注帮助现代读者理解这里涉及星辰崇拜。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“陀斐”沿用常见圣经地名译法；以“不洁净”保留礼仪与道德污秽的双重语感。正文按希伯来语复数一致关系处理关键句法，并用脚注保存传统异译。
