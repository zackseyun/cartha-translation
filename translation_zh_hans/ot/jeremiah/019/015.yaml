revisions:
- from: 万军之雅威[a]——以色列的神如此说：“看哪，我必使我曾宣告要降在这城的一切灾祸[b]，临到这城和它所属的所有城镇[c]，因为他们硬着颈项[d]，不肯听我的话。”
  to: 万军之雅威[a]——以色列的神如此说：“看哪，我要使我所说要降在这城的一切灾祸[b]，临到这城和它所有的城镇[c]，因为他们硬着颈项[d]，不肯听我的话。”
  rationale: 修订仅消除不必要的“所属”限定并调整语序，使“我所说要降在这城的一切灾祸”自然对应“我所说攻击/针对这城的一切灾祸”，同时保留灾祸实际临到“这城和它所有的城镇”的范围。脚注标记及内容均保留并与其所注释的词语相符。
