  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כֹּֽה אָמַ֞ר יְהוָ֤ה צְבָאוֹת֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל הִנְ/נִ֨י מבי אֶל הָ/עִ֤יר הַ/זֹּאת֙ וְ/עַל כָּל עָרֶ֔י/הָ אֵ֚ת כָּל הָ֣/רָעָ֔ה אֲשֶׁ֥ר דִּבַּ֖רְתִּי עָלֶ֑י/הָ כִּ֤י הִקְשׁוּ֙ אֶת עָרְפָּ֔/ם לְ/בִלְתִּ֖י שְׁמ֥וֹעַ אֶת דְּבָרָֽ/י־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/019/015.yaml
  text: 'Thus says Yahweh of hosts[a], the God of Israel: Behold, I am bringing on this city and on all its towns all the disaster that I have spoken against it[c][b], because they have stiffened their neck so as not to hear my words.'
translation:
  language: zh_hans
  text: 万军之雅威[a]——以色列的神如此说：“看哪，我要使我所说要降在这城的一切灾祸[b]，临到这城和它所有的城镇[c]，因为他们硬着颈项[d]，不肯听我的话。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “万军”也可译作“众军”，可包括天上和地上的军队。
    reason: lexical_alternative
  - marker: b
    text: “灾祸”所译的希伯来词在这里指审判所带来的灾难，不是指道德上的邪恶。
    reason: lexical_alternative
  - marker: c
    text: “城镇”也可译作“城市”。
    reason: lexical_alternative
  - marker: d
    text: “硬着颈项”是希伯来语习语，表示顽梗地拒绝顺服。
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语音译保留四字神名，不以称号替代；“雅威”直接对应通常重构的读音 Yahweh。
- source_word: צְבָאוֹת
  choice: 万军之
  rationale: 用于固定称号“万军之雅威”，既符合庄重的中文圣经语体，也保留天上、地上众军的宽广含义。
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: 以色列的神
  rationale: 直接、自然地保留原文的所属结构和盟约身份。
- source_word: הִנְנִי
  choice: 看哪，我必
  rationale: “看哪”传达郑重提示和迫近感；结合未完成的审判行动译作“我必”，比机械直译“我正在”更符合此处预告即将执行之事的语境。
- source_word: מבי（即使……来到的使役意义）
  choice: 使……临到
  rationale: 按 בוא 的使役用法表达雅威使灾祸来到目标之上，中文搭配自然。
- source_word: כָּל עָרֶיהָ
  choice: 它所属的所有城镇
  rationale: עָרִים 可指城市或城镇；此处指与“这城”相关的各处聚居地。“所属的”明确阴性单数后缀所表达的关系，但不把这些地方过度限定为乡村。
- source_word: כָּל הָרָעָה
  choice: 一切灾祸
  rationale: רָעָה 在审判语境中指临到人的灾难，而非道德上的邪恶；“灾祸”兼具严肃语气和清晰含义。
- source_word: דִּבַּרְתִּי עָלֶיהָ
  choice: 我曾宣告要降在这城
  rationale: “曾宣告”体现完成式所指先前已经说出的话；阴性单数代词自然回指“这城”。“要降在”把针对该城的审判宣告表达清楚。
- source_word: הִקְשׁוּ אֶת עָרְפָּם
  choice: 他们硬着颈项
  rationale: 保留希伯来文身体隐喻，并以脚注说明其表示顽梗拒绝；“颈项”维持庄重而可理解的语体。
- source_word: לְבִלְתִּי שְׁמוֹעַ אֶת דְּבָרָי
  choice: 不肯听我的话
  rationale: 目的或结果结构在此表达执意拒听；“不肯”比单纯“不”更准确传达顽固意志。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 保留经文中的神圣专名，不以“主”这一称号取代；“雅威”较直接对应 Yahweh 的通行学术重构音。
- issue: 称号 יְהוָה צְבָאוֹת 的范围
  choice: 万军之雅威
  alternative: 众军之雅威；军队之雅威
  rationale: “万军”保留原词可涵盖天上与地上众军的开放范围，避免只理解为人间军队。
- issue: רָעָה 是否指道德邪恶
  choice: 灾祸
  alternative: 邪恶；灾难
  rationale: 这里是神所宣告并带来的审判性灾害，不是说神带来道德上的邪恶；“灾祸”保留审判的严肃性。
- issue: 硬着颈项这一隐喻是否意译
  choice: 正文保留隐喻，脚注解释
  alternative: 顽固不化；执意反抗
  rationale: 原文以身体姿态描写顽梗抗拒。保留隐喻可呈现先知语言的力度，脚注则保障现代读者理解。
translation_notes:
  register: 采用庄重而清晰的现代标准汉语。“如此说”“看哪”“颈项”保留先知宣告的肃穆感；句法经适度调整，使“灾祸”与“临到”在中文中衔接自然。破折号用于标明“以色列的神”是对“万军之雅威”的同位说明。
