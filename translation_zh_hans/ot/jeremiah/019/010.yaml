base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/019/010.yaml
  text: Then you shall break the flask before the eyes of the men who are going with you[a].
translation:
  language: zh_hans
  text: 然后，你要在跟你同去的那些人眼前[a]打碎那只陶瓶。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“当着跟你同去的那些人的面”。
    reason: 希伯来语“在……眼前”是表示公开可见的惯用语；脚注给出自然的汉语惯用表达。
lexical_decisions:
- source_word: וְשָׁבַרְתָּ
  choice: 然后，你要……摔碎
  rationale: 带连接词的第二人称阳性单数完成式承接上文一连串指示，具有命令意味；“然后，你要”既体现行动次序，也保留庄重的指令语气。
- source_word: הַבַּקְבֻּק
  choice: 那只陶瓶
  rationale: 该词指瓶状器皿；结合本章1节所述陶匠制作的器皿，以“陶瓶”明确材质和具体形态，也适合此处象征性行动的场景。
- source_word: לְעֵינֵי
  choice: 在……眼前
  rationale: 直译为“在……眼前”，意为在众人看得见的地方；此译保留希伯来语鲜明的视觉表达。
- source_word: הָאֲנָשִׁים
  choice: 那些人
  rationale: 原词为阳性复数，指与耶利米同行的具体一群人；现代汉语用“那些人”自然且不额外强调性别，所指范围并未扩大。
- source_word: הַהֹלְכִים אוֹתָךְ
  choice: 跟你同去的
  rationale: 分词结构描写正与耶利米同行的人；“跟你同去的”简洁自然，并保留同行的持续状态。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的指令语体。“摔碎”比单纯“打破”更具体地表现将陶瓶掷下并使其破裂的象征性动作；“那只”承接上文已经提到的特定陶瓶。
