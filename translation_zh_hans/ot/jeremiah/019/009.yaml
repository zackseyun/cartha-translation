revisions:
- from: 我要使他们吃自己儿子的肉和女儿的肉；在仇敌和那些要取他们性命的人围困他们、使他们陷入绝境时，他们各人还要吃邻舍的肉。[a]
  to: 我要使他们吃自己儿子和女儿的肉；他们各人要在仇敌和那些要取他们性命的人所加给他们的围困和困境中，吃邻舍的肉。[a]
  rationale: 修订恢复“在围困和困境中”的处境性表达，以“所加给他们的”对应仇敌施加的压迫，并以“困境”避免将原文程度强化为“绝境”。删去无对应的“还要”。其余关键译法及脚注均可保留。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T07:28:37Z'
review_pass:
  verdict: revise
  source_fidelity: 草稿正确保留了第一人称使役式“我要使他们吃”、儿子与女儿的明确并列、邻舍之肉，以及仇敌和寻索其性命者所施的压力。可是“围困他们、使他们陷入绝境时”将原文的“在围困和困境中”改写为时间从句，并把“困境”强化为较绝对的“绝境”；“还要”也增添了原文未明说的递进色彩。
  naturalness: 原译整体通顺庄重，但将原文的处境性介词短语改为“……时”略显绕曲。采用“在……所加给他们的围困和困境中”既自然，也更清晰地保留关系从句对两项处境的关联。
  terminology: “使他们吃”“儿子和女儿的肉”“邻舍”“取他们性命”均合适。“困境”比“绝境”更贴近 מָצוֹק 的受压、窘迫义，且不无根据地强化程度。脚注保留“取他们性命”的希伯来惯用语说明。
  issues:
  - severity: medium
    issue: “围困他们、使他们陷入绝境时”重构了原文的句法关系。
    rationale: בְּמָצוֹר וּבְמָצוֹק 表示“在围困和困境中”，后面的关系从句说明这是仇敌和寻索其性命者加给他们的压力。译为时间从句虽不致误解，却削弱了原文两个名词并列的处境表达。
  - severity: low
    issue: “绝境”和“还要”略有增译。
    rationale: מָצוֹק 是困迫、窘境或极大压力，不必确定为无路可逃的“绝境”；“还要”带出额外递进意味，原文仅以连词并列第二项。
  revised_text: 我要使他们吃自己儿子和女儿的肉；他们各人要在仇敌和那些要取他们性命的人所加给他们的围困和困境中，吃邻舍的肉。[a]
  revised_footnotes:
