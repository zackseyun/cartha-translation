  text: וְ/הַֽאֲכַלְתִּ֞י/ם אֶת בְּשַׂ֣ר בְּנֵי/הֶ֗ם וְ/אֵת֙ בְּשַׂ֣ר בְּנֹתֵי/הֶ֔ם וְ/אִ֥ישׁ בְּשַׂר רֵעֵ֖/הוּ יֹאכֵ֑לוּ בְּ/מָצוֹר֙ וּ/בְ/מָצ֔וֹק אֲשֶׁ֨ר יָצִ֧יקוּ לָ/הֶ֛ם אֹיְבֵי/הֶ֖ם וּ/מְבַקְשֵׁ֥י נַפְשָֽׁ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/019/009.yaml
  text: And I will make them eat the flesh of their sons and the flesh of their daughters[b][a], and each will eat the flesh of his neighbor in the siege and in the distress with which their enemies and those who seek their life will afflict them.
translation:
  language: zh_hans
  text: 我要使他们吃自己儿子和女儿的肉；他们各人要在仇敌和那些要取他们性命的人所加给他们的围困和困境中，吃邻舍的肉。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “要取他们性命”是希伯来语惯用说法，意思是企图杀死他们。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַאֲכַלְתִּים
  choice: 我要使他们吃
  rationale: 保留使役形的直接因果力度，表达上帝使此审判临到，而不弱化为仅仅许可。
- source_word: בְּשַׂר בְּנֵיהֶם וְאֵת בְּשַׂר בְּנֹתֵיהֶם
  choice: 自己儿子的肉和女儿的肉
  rationale: 分别译出“儿子”和“女儿”，并以“肉”保留原文所呈现的惨烈现实。
- source_word: וְאִישׁ בְּשַׂר רֵעֵהוּ יֹאכֵלוּ
  choice: 他们各人还要吃邻舍的肉
  rationale: אִישׁ在此为逐一分配用法，“各人”自然地传达其意义；“邻舍”避免把关系过度限定为朋友。
- source_word: בְּמָצוֹר וּבְמָצוֹק
  choice: 围困他们、使他们陷入绝境时
  rationale: 将名词组合按自然汉语转化为敌人施加的围困与极端困境，同时保留两层压迫含义。
- source_word: אֲשֶׁר יָצִיקוּ לָהֶם
  choice: 使他们陷入
  rationale: 表达敌人以围困和困境逼迫他们的严重压力，并使整句汉语关系清楚。
- source_word: וּמְבַקְשֵׁי נַפְשָׁם
  choice: 那些要取他们性命的人
  rationale: 此处נֶפֶשׁ指生命；“取……性命”自然传达该希伯来惯用语所指的杀害意图。
theological_decisions:
- issue: 审判中的神圣主体性
  choice: “我要使他们吃”
  alternative: “我要任凭他们吃”
  rationale: 原文使役形明确呈现上帝使这项盟约审判临到，不宜在翻译中弱化为单纯许可。
- issue: נֶפֶשׁ的人论用法
  choice: “要取他们性命”
  alternative: “寻索他们的灵魂”或“寻索他们的命”
  rationale: 这里所指是杀害、夺取生命，并非专指非物质的灵魂；意译可避免引入原文没有的人论限定。
- issue: 围城与绝境的关系
  choice: 将二者都表达为敌人施加的处境
  alternative: 把关系从句仅理解为修饰“绝境”
  rationale: 希伯来语关系从句的修饰范围在句法上可涵盖围困与困境；中文采用合并结构，保留敌人借这些处境施压的整体意思。
translation_notes:
  register: 采用现代、庄重且可朗读的普通话。“陷入绝境”传达מָצוֹק的极端压迫感；用分号划分两个并列而递进的审判场景。脚注标记置于相关整句之后。
