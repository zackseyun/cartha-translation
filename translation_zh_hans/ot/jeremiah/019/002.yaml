  text: וְ/יָצָ֨אתָ֙ אֶל גֵּ֣יא בֶן הִנֹּ֔ם אֲשֶׁ֕ר פֶּ֖תַח שַׁ֣עַר ה/חרסות וְ/קָרָ֣אתָ שָּׁ֔ם אֶת הַ/דְּבָרִ֖ים אֲשֶׁר אֲדַבֵּ֥ר אֵלֶֽי/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/019/002.yaml
  text: and go out to the Valley of Ben Hinnom[a], which is at the entrance of the Potsherd Gate, and proclaim there the words that I will speak to you.
translation:
  language: zh_hans
  text: 你要出去，到欣嫩子谷去；那谷在陶片门的入口处。你要在那里宣告我将要对你说的话。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְיָצָאתָ
  choice: 你要出去
  rationale: 该形式在连续指令中具有命令作用；“你要出去”既保留第二人称和方向意味，也符合庄重自然的现代汉语。
- source_word: גֵּיא בֶן הִנֹּם
  choice: 欣嫩子谷
  rationale: 按汉语圣经地名的通行形式处理为专名，避免译作“欣嫩之子的谷”而削弱地名性质，也避免使用带有后期观念的“地狱”或“革赫拿”。
- source_word: אֲשֶׁר פֶּתַח שַׁעַר ה/חרסות
  choice: 就是陶片门入口那里
  rationale: פֶּתַח שַׁעַר指门的入口；门名通常联系陶器或碎陶片，译作“陶片门”与本章陶器意象相合，同时以脚注保留希伯来门名含义不确定这一点。
- source_word: וְקָרָאתָ
  choice: 宣告
  rationale: קרא在先知语境中指公开呼喊或宣讲；“宣告”准确体现公开而郑重的传达。
- source_word: שָׁם
  choice: 在那里
  rationale: 直接表达地点副词，并使汉语句子衔接自然。
- source_word: אֶת־הַדְּבָרִים
  choice: ……的话
  rationale: 保留דְּבָרִים“话语”的形式联系；汉语中纳入“我要对你说的话”比孤立译作“这些话”更自然。
- source_word: אֲשֶׁר אֲדַבֵּר אֵלֶיךָ
  choice: 我要对你说的
  rationale: 直译其未来指向和上帝向耶利米说话的关系，不扩展为较解释性的“我要吩咐你的”。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“你要出去……宣告”保留先知受命语气；地名使用汉语化专名，门名的不确定性放入脚注，正文不作过度解释。
