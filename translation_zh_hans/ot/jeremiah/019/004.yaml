source:
  edition: WLC
  text: יַ֣עַן אֲשֶׁ֣ר עֲזָבֻ֗/נִי וַֽ/יְנַכְּר֞וּ אֶת הַ/מָּק֤וֹם הַ/זֶּה֙ וַ/יְקַטְּרוּ ב/וֹ֙ לֵ/אלֹהִ֣ים אֲחֵרִ֔ים אֲשֶׁ֧ר לֹֽא יְדָע֛וּ/ם הֵ֥מָּה וַ/אֲבֽוֹתֵי/הֶ֖ם וּ/מַלְכֵ֣י יְהוּדָ֑ה וּ/מָֽלְא֛וּ אֶת הַ/מָּק֥וֹם הַ/זֶּ֖ה דַּ֥ם נְקִיִּֽם׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/019/004.yaml
  text: Because they have forsaken me and made this place unrecognizable[a], and have burned incense in it to other gods whom neither they nor their fathers nor the kings of Judah had known, and they have filled this place with the blood of innocents[b],
translation:
  language: zh_hans
  text: 因为他们离弃了我，使这地方变得陌生[a]，又在这里向别的神烧香；这些神是他们、他们的祖先和犹大诸王素来不认识的；他们还使这地方充满了无辜人的血[b]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“把这地方当作外来的地方”，也可理解为“玷污了这地方”。希伯来语动词含有使某物变得外来、陌生或疏离的意思。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“无辜者的血”；这里指无辜之人的血。
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעַן אֲשֶׁר
  choice: 因为
  rationale: 直接表达希伯来语引出审判缘由的因果关系，也符合现代汉语。
- source_word: עֲזָבֻנִי
  choice: 他们离弃了我
  rationale: “离弃”既表达抛弃，也保留先知话语中关系破裂的庄重意味。
- source_word: וַיְנַכְּרוּ אֶת־הַמָּקוֹם הַזֶּה
  choice: 使这地方成了异地
  rationale: 保留 נכר 所含“使之成为外来的、陌生的”意象，不在正文中径直解释为“玷污”。
- source_word: וַיְקַטְּרוּ בוֹ
  choice: 又在这里向……烧香
  rationale: קטר 在本语境中指焚香献给神明；“烧香”准确而通俗。
- source_word: לֵאלֹהִים אֲחֵרִים
  choice: 别的神
  rationale: 忠实表达“其他的神”，不额外加入“外邦”含义。
- source_word: אֲשֶׁר לֹא יְדָעוּם
  choice: 素来不认识的
  rationale: ידע 在此可指认识或承认这些神；“认识”保留原文措辞，“素来”显出历来的否定。
- source_word: הֵמָּה וַאֲבוֹתֵיהֶם וּמַלְכֵי יְהוּדָה
  choice: 他们、他们的祖先和犹大诸王
  rationale: 让前面的“不认识”自然统摄三个并列群体，避免汉语中繁复的重复否定。
- source_word: וּמָלְאוּ אֶת־הַמָּקוֹם הַזֶּה דַּם נְקִיִּם
  choice: 他们还使这地方流满了无辜人的血
  rationale: “无辜人的血”保留原文复数所指的人；“流满”在汉语中自然呈现血充满此地的暴力图景。
theological_decisions:
- issue: נכר 描述他们怎样对待“这地方”
  choice: 使这地方成了异地
  alternative: 玷污了这地方；把这地方当作外来的地方
  rationale: 原动词的核心意象是使某物变得外来、陌生或疏离。“玷污”虽符合语境，却会把隐喻直接解释掉；正文保留异化意象，并以脚注说明可能含义。
- issue: ידע 用于以色列人与别神的关系
  choice: 不认识
  alternative: 不承认；未曾敬奉
  rationale: “认识”既可按字面理解，也可在宗教关系中包含承认和敬奉，不把原文的语义范围缩窄为单一解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留本节作为后续句子的原因从句，因此句末用逗号；用分号划分偶像崇拜与流无辜人血两项指控。
