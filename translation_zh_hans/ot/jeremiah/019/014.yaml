    rationale: וַיָּבֹא可按上下文译“来”，但本句本身没有“返回”这一词义；避免将叙事推断写成明示内容更为稳妥。
  - severity: low
    issue: 原文修饰“陀斐特”的关系从句在中文中宜更明确地与该地点相连。
    rationale: “雅威曾差他到那里传讲预言”可以理解，但使用“那里是雅威差他去传讲预言的地方”更清楚地保留其限定/说明功能。
