base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/019/014.yaml
  text: Then Jeremiah came from Topheth[a], where Yahweh had sent him to prophesy, and he stood in the court of the house of Yahweh and said to all the people,
translation:
  language: zh_hans
  text: 耶利米从陀斐特[a]而来；那里是雅威差他去传讲预言的地方。他站在雅威殿的院子里，对众民说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 陀斐特是本章前文中耶利米施行先知性象征行动并宣告信息的地点。
    reason: 交代本章上下文，帮助读者识别此地与前文行动及宣告的联系。
lexical_decisions:
- source_word: וַיָּבֹא
  choice: 回来
  rationale: 该动词可按叙事视角译为“来”“去”或“回来”。上文记述耶利米前往陀斐特，本节则叙述他从那里到了圣殿，因此“回来”在中文中自然地表达这一叙事动向。
- source_word: מֵהַתֹּפֶת
  choice: 从陀斐特
  rationale: תֹּפֶת是地名，采用通行音译“陀斐特”；希伯来语定冠词不必在中文地名中另行表达。
- source_word: אֲשֶׁר שְׁלָחוֹ יְהוָה שָׁם
  choice: 雅威曾差他到那里
  rationale: 关系从句说明陀斐特就是雅威先前差遣耶利米前往的地方；“曾”清楚表达差遣先于本节的返回。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代中文常见音译呈现四字神名，保留其作为专名的性质，而不以称号替代。
- source_word: לְהִנָּבֵא
  choice: 传讲预言
  rationale: נבא的Niphal不定式表示履行先知宣讲的职分；“传讲预言”比单说“预言”更能避免现代中文中“预测未来”的狭义联想。
- source_word: וַיַּעֲמֹד
  choice: 他站
  rationale: 直接表达עמד的基本意义，不额外加入“挺身而立”等强调。
- source_word: בַּחֲצַר בֵּית יְהוָה
  choice: 在雅威殿的院子里
  rationale: חצר指建筑群的院子；“雅威殿”自然、简洁地表达“雅威的殿”。
- source_word: וַיֹּאמֶר אֶל כָּל הָעָם
  choice: 对众民说
  rationale: 保留אמר的普通言说意义，并以“众民”表达כל העם，不缩小听众范围。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华／主
  rationale: 原文直接使用四字神名；译作“雅威”保留其专名性质，也避免以“主”这一称号替代。
translation_notes:
  register: 采用现代、庄重且便于朗读的标准普通话。“雅威殿的院子”兼顾原文结构与中文自然度；句末用冒号，因为耶利米的话在下一节开始。
