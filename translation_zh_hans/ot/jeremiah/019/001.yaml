  yaml_path: translation/ot/jeremiah/019/001.yaml
  text: 'Thus says Yahweh: Go and buy a potter’s earthenware flask[a], and take some of the elders of the people and some of the elders of the priests[b],'
translation:
  language: zh_hans
  text: 雅威如此说：“你去买一个陶匠做的瓦瓶[a]，并从百姓的长老中带几位，又从祭司的长老中带几位[b]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“陶匠做的陶罐”或“陶瓶”。希伯来语 בַקְבֻּק 指一种成形的器皿，很可能瓶颈较窄。
    reason: lexical_alternative
  - marker: b
    text: 直译为“从百姓的长老中，也从祭司的长老中”；意思是要耶利米从两组人中分别带几位代表。
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  choice: 雅威如此说
  rationale: 保留先知宣告的固定公式和神圣名字；汉语用现在时“说”表达宣告当下的权威与直接性。
- source_word: הָלוֹךְ וְקָנִיתָ
  choice: 你去买
  rationale: הָלוֹךְ在此具有命令作用，并与后续动词构成连续吩咐；“你去买”是自然、直接的现代汉语。
- source_word: בַקְבֻּק
  choice: 瓦瓶
  rationale: 该词指成形的容器，可能是窄颈瓶；“瓦瓶”既体现陶制材质，也较自然地传达瓶状器皿。
- source_word: יוֹצֵר חָרֶשׂ
  choice: 陶匠烧制的
  rationale: 兼顾יוֹצֵר“陶匠”和חָרֶשׂ“陶器、烧制黏土”的含义；与“瓦瓶”搭配后，避免生硬重复。
- source_word: וּמִזִּקְנֵי הָעָם וּמִזִּקְנֵי הַכֹּהֲנִים
  choice: 再从百姓的长老和祭司的长老中各带几个人
  rationale: 原文两个מִן结构表示分别从两组人中选取代表；补出上下文隐含的“带”，使汉语句意完整，同时以“各……几个人”保留部分选取之意。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 按希伯来语四字神名的常见学术拟音处理为专名，不以“主”这一称号替代，也不把传统汉译形式强加于原文。
- issue: 两组“长老”的关系
  choice: 百姓的长老和祭司的长老
  alternative: 民间长老和年长的祭司
  rationale: 原文两处均使用זִקְנֵי的平行结构；译文保留这种制度性称谓可能性，不把第二组直接解释成仅指年长祭司。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“雅威如此说”保留先知宣告语体；“瓦瓶”简洁通俗，脚注说明器形与其他可能译法。经文在本节末仍承接下文，故保留逗号和未闭合引号。
