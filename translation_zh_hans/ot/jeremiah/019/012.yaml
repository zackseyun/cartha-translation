id: JER.19.12
reference: Jeremiah 19:12
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כֵּֽן אֶעֱשֶׂ֞ה לַ/מָּק֥וֹם הַ/זֶּ֛ה נְאֻם יְהוָ֖ה וּ/לְ/יֽוֹשְׁבָ֑י/ו וְ/לָ/תֵ֛ת אֶת הָ/עִ֥יר הַ/זֹּ֖את כְּ/תֹֽפֶת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/019/012.yaml
  text: So I will do to this place[a], declares Yahweh, and to its inhabitants, making this city like Topheth.
translation:
  language: zh_hans
  text: 雅威宣告：“我必这样对待这地方和其中的居民，使这城像陀斐特一样。[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 陀斐特位于欣嫩子谷，与献儿童为祭的行为有关，后来成为被玷污和受审判之地。这里的比喻表明，耶路撒冷也将成为令人惊骇、污秽不洁的地方。
    reason: cultural_note
lexical_decisions:
- source_word: כֵּן
  choice: 这样
  rationale: 承接上文摔碎瓦瓶的象征行动及审判宣告，保留“照样、如此”的承接和推论意味。
- source_word: אֶעֱשֶׂה לַמָּקוֹם הַזֶּה
  choice: 我必这样对待这地方
  rationale: עָשָׂה含义宽泛；与介词ל连用时指向受行动影响的对象。译作“对待”在现代汉语中自然，也不额外强化为“攻击”。
- source_word: נְאֻם יְהוָה
  choice: 雅威宣告
  rationale: 保留先知话语中庄重而固定的神谕公式，并将神名יהוה音译为“雅威”。
- source_word: וּלְיֹשְׁבָיו
  choice: 和其中的居民
  rationale: 指居住在这地方的人；“其中的居民”简洁自然，并清楚表达代词所指。
- source_word: וְלָתֵת
  choice: 使
  rationale: 该不定式进一步说明前述行动的结果或目的；“使”在汉语中顺畅地连接神的行动与这城将有的结局，同时不强行排除目的或结果色彩。
- source_word: הָעִיר הַזֹּאת
  choice: 这城
  rationale: 忠实保留指示语，语境中所指为耶路撒冷；“这城”符合庄重而自然的经文语体。
- source_word: כְּתֹפֶת
  choice: 像陀斐特一样
  rationale: 前缀כְּ明确表示比较；采用常见地名音译“陀斐特”，不在正文中将其解释性改写为刑罚或污秽之地。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名יהוה；“雅威”较贴近学界通常重构的读音，并保留其专名性质。
- issue: וְלָתֵת所表达的是目的还是结果
  choice: 以“使”保留两者可兼容的表达
  alternative: 译作“为了使”或“以致成为”
  rationale: 希伯来语不定式在此可说明所宣告行动的目的或结果；正文不将这一语义张力单方面限定。
translation_notes:
  register: 采用现代、庄重且易懂的标准普通话。“雅威宣告”保留先知神谕的正式语气；句式尽量贴近希伯来文的推进关系，同时以“对待”和“使”确保中文自然。
