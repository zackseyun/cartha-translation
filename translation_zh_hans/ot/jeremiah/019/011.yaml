id: JER.19.11
reference: Jeremiah 19:11
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/אָמַרְתָּ֨ אֲלֵי/הֶ֜ם כֹּה אָמַ֣ר יְהוָ֣ה צְבָא֗וֹת כָּ֣כָה אֶשְׁבֹּ֞ר אֶת הָ/עָ֤ם הַ/זֶּה֙ וְ/אֶת הָ/עִ֣יר הַ/זֹּ֔את כַּ/אֲשֶׁ֤ר יִשְׁבֹּר֙ אֶת כְּלִ֣י הַ/יּוֹצֵ֔ר אֲשֶׁ֛ר לֹֽא יוּכַ֥ל לְ/הֵרָפֵ֖ה ע֑וֹד וּ/בְ/תֹ֣פֶת יִקְבְּר֔וּ מֵ/אֵ֥ין מָק֖וֹם לִ/קְבּֽוֹר־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/019/011.yaml
  text: 'And you shall say to them[a], ‘Thus says Yahweh of hosts: In this way I will break this people and this city, as one breaks a potter’s vessel, which cannot be repaired again[b]; and in Topheth they will bury because there is no place else to bury.’'
translation:
  language: zh_hans
  text: 你要对他们说：‘万军之耶和华如此说：我必这样打碎这百姓和这城，正如人打碎陶匠的器皿，那器皿再也无法修复[a]。人必在陀斐特埋葬，因为没有地方可埋葬。’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “修复”原文直译为“医治”；这里指破碎的陶器再也不能恢复完整。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה צְבָאוֹת
  choice: 万军之耶和华
  rationale: 以“耶和华”呈现神名，以汉语中庄重且通行的“万军之”表达 צְבָאוֹת，并保留该称号可能涵盖天上与地上众军的广度。
- source_word: כָּכָה
  choice: 照样
  rationale: 指向前文打碎陶瓶的象征行动，同时与引出神谕的 כֹּה（“如此说”）有所区别。
- source_word: אֶשְׁבֹּר / יִשְׁבֹּר
  choice: 打碎
  rationale: 两处使用同一汉语动词，保留神将百姓和城打碎与人打碎陶器之间的对应关系。
- source_word: הָעָם הַזֶּה וְאֶת הָעִיר הַזֹּאת
  choice: 这百姓和这城
  rationale: 直接保留指示语和集体名词；“这城”在上下文中指耶路撒冷。
- source_word: כְּלִי הַיּוֹצֵר
  choice: 陶匠的器皿
  rationale: כְּלִי 是泛指器物或容器，并不限定为坛、罐等某一种陶器，因此译作“器皿”以保留其宽泛含义。
- source_word: לֹא יוּכַל לְהֵרָפֵה עוֹד
  choice: 再也无法修复
  rationale: רפא 字面可指“医治”，但以破碎的陶器为对象时，“修复”是自然准确的汉语表达；“再也”体现 עוֹד，并突出不可逆性。
- source_word: וּבְתֹפֶת
  choice: 在陀斐特
  rationale: 按地名音译，并以“在”表达 בְּ 所标明的埋葬地点。
- source_word: יִקְבְּרוּ
  choice: 人必……埋葬死人
  rationale: 原文是第三人称复数主动式，宾语省略。汉语若只说“他们必埋葬”显得悬空，故以泛指主语“人”并按语境补出“死人”，而不误译成被动。
- source_word: מֵאֵין מָקוֹם לִקְבּוֹר
  choice: 因为再没有地方可埋葬了
  rationale: 自然表达原文“由于缺少埋葬之处”的原因意义；“再没有”符合上下文中墓地耗尽的语境。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。中文采用广为人知且具有专名功能的“耶和华”，不以“主”这一称号替代神名；“雅威”是可取的另一种音译。
- issue: 陶器不可“医治”的比喻
  choice: 按对象译为“无法修复”
  alternative: “无法医治”
  rationale: 原词保有“医治”的词源色彩，但句中所指是被打碎的陶器；译为“修复”既符合实际对象，也保留百姓与城遭毁坏后不可复原的严厉含义，不额外解释其神学范围。
translation_notes:
  register: 采用现代、庄重、可朗读的标准普通话。“你要……说”传达连续叙事中的命令形式；神谕用“如此说”保持先知文体。“照样”明确连接前文象征动作。仅设置一个确有助于读者理解原文措辞的脚注，且标记已置于正文相应位置。
