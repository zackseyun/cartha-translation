id: JER.19.6
reference: Jeremiah 19:6
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: לָ/כֵ֞ן הִנֵּֽה יָמִ֤ים בָּאִים֙ נְאֻם יְהוָ֔ה וְ/לֹא יִקָּרֵא֩ לַ/מָּק֨וֹם הַ/זֶּ֥ה ע֛וֹד הַ/תֹּ֖פֶת וְ/גֵ֣יא בֶן הִנֹּ֑ם כִּ֖י אִם גֵּ֥יא הַ/הֲרֵגָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/019/006.yaml
  text: Therefore, look, days are coming, declares the LORD, when this place will no longer be called Topheth and the Valley of Ben-hinnom, but the Valley of Slaughter.
translation:
  language: zh_hans
  text: 因此，看哪，日子将到——这是耶和华说的——那时，这地方不再叫陀斐特和欣嫩子谷，而要叫杀戮谷。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לָכֵן
  choice: 因此
  rationale: 明确承接上文所宣告的审判后果，符合希伯来语因果连接词的作用。
- source_word: הִנֵּה
  choice: 看哪
  rationale: 保留先知宣告中引人注意、加强语气的标记，同时维持庄重的经文语体。
- source_word: נְאֻם יְהוָה
  choice: 这是耶和华说的
  rationale: 将先知书常见的神谕公式译成自然而庄重的现代汉语；专名采用“耶和华”。
- source_word: הַתֹּפֶת
  choice: 陀斐特
  rationale: 这是地名，采用通行的音译，不额外加入原文未明说的解释。
- source_word: גֵיא בֶן הִנֹּם
  choice: 欣嫩子谷
  rationale: 按该地名在中文圣经传统中的通行形式表达；希伯来语字面含“欣嫩之子谷”，但作为专名译为“欣嫩子谷”更自然。
- source_word: גֵּיא הַהֲרֵגָה
  choice: 杀戮谷
  rationale: הֲרֵגָה 表示杀戮、屠杀；“杀戮谷”既准确又保留该地被重新命名的审判意味。
theological_decisions:
- issue: 神名 יהוה 的表达
  choice: 耶和华
  alternative: 上主／雅威
  rationale: 原文使用四字神名；采用中文读者熟悉的专名“耶和华”，避免仅以称号取代专名，也不借此加入宗派性解释。
- issue: 两个旧地名之间 וְ 的关系
  choice: 和
  alternative: 或
  rationale: 原文以 וְ 连接“陀斐特”和“欣嫩子谷”，直译为“和”最为稳妥；语境可理解为同一地方的两个称呼，无须改写为选择关系。
- issue: 未来审判宣告的确定性
  choice: 不再叫……而要叫……
  alternative: 将不再被称为……只会被称为……
  rationale: 保留希伯来语被动称名结构所表达的公开名称变更，同时避免过度强调排他程度。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“看哪”保留先知性警示语气；以破折号嵌入神谕公式，使句子清楚自然。全文无脚注，因此正文不设脚注标记。
