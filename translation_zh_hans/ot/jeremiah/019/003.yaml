  text: וְ/אָֽמַרְתָּ֙ שִׁמְע֣וּ דְבַר יְהוָ֔ה מַלְכֵ֣י יְהוּדָ֔ה וְ/יֹשְׁבֵ֖י יְרֽוּשָׁלִָ֑ם כֹּֽה אָמַר֩ יְהוָ֨ה צְבָא֜וֹת אֱלֹהֵ֣י יִשְׂרָאֵ֗ל הִנְ/נִ֨י מֵבִ֤יא רָעָה֙ עַל הַ/מָּק֣וֹם הַ/זֶּ֔ה אֲשֶׁ֥ר כָּל שֹׁמְעָ֖/הּ תִּצַּ֥לְנָה אָזְנָֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/019/003.yaml
  text: 'And say, ‘Hear the word of the LORD, O kings of Judah and inhabitants of Jerusalem. Thus says the LORD of hosts, the God of Israel: Behold, I am bringing disaster on this place, at which everyone who hears of it—his ears will tingle.’'
translation:
  language: zh_hans
  text: 你要说：‘犹大诸王和耶路撒冷的居民啊，要听耶和华的话。万军之耶和华、以色列的神如此说：看哪，我必使灾祸临到这地方；凡听见这事的，耳朵都必嗡嗡作响。’
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的专名译法，明确呈现以色列之神的圣名，并与“万军之耶和华”这一固定称谓自然衔接。
- source_word: יְהוָה צְבָאוֹת
  choice: 万军之耶和华
  rationale: 保留传统且准确的称号，表达耶和华统领天上众军的权能，不将“万军”窄化为人间军队。
- source_word: רָעָה
  choice: 灾祸
  rationale: 此处指神将降下的严重祸患或灾难；“灾祸”既符合审判语境，也避免“邪恶”在中文中造成道德属性上的误读。
- source_word: תִּצַּלְנָה אָזְנָיו
  choice: 耳朵都必嗡嗡作响
  rationale: 这是希伯来语中形容听见骇人消息后耳中鸣响的强烈表达；采用具象而自然的中文，保留原文的身体感受和震撼效果。
- source_word: מַלְכֵי יְהוּדָה
  choice: 犹大诸王
  rationale: 保留复数“王”；它可能泛指王室统治者或犹大历代诸王，译文不擅自改成单数或具体化为官长。
theological_decisions:
- issue: 灾祸的施动者
  choice: 我必使灾祸临到这地方
  alternative: 灾祸将临到这地方
  rationale: 原文 הִנְנִי מֵבִיא 明确以耶和华为施动者，译文保留神主动施行审判的含义。
- issue: “万军”的所指
  choice: 保留“万军之耶和华”而不加解释
  alternative: 全能的耶和华
  rationale: 原文称号具有自身的经文传统与开放含义；直接意译为“全能”会丢失“众军”的意象，并在正文中提前解释其神学含义。
- issue: 结尾惯用语的主语范围
  choice: 凡听见这事的，耳朵都必嗡嗡作响
  alternative: 凡听见的人都必耳鸣
  rationale: 保留原文“每一个听见者—他的耳朵”的分配性含义，同时用自然中文表达，不把反应弱化为抽象的震惊。
translation_notes:
  register: 采用庄重而清晰的现代标准汉语。以“你要说”“如此说”“看哪”保留先知宣告的正式语气；“居民”比“住户”更符合公共审判语境；结尾以“嗡嗡作响”具体传达希伯来惯用语的听觉冲击。
