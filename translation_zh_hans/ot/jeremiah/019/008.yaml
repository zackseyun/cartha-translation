  text: וְ/שַׂמְתִּי֙ אֶת הָ/עִ֣יר הַ/זֹּ֔את לְ/שַׁמָּ֖ה וְ/לִ/שְׁרֵקָ֑ה כֹּ֚ל עֹבֵ֣ר עָלֶ֔י/הָ יִשֹּׁ֥ם וְ/יִשְׁרֹ֖ק עַל כָּל מַכֹּתֶֽ/הָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/019/008.yaml
  text: And I will make this city a horror and an object of hissing[b][a]; everyone who passes by it will be appalled and will hiss because of all its wounds.
translation:
  language: zh_hans
  text: 我要使这城成为荒凉之地，受人嘲弄的对象[a]；凡经过这城的人，都会因它所受的一切灾祸而惊骇，并发出嘘声[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我要使这城成为荒凉和受人发嘘声的对象。”希伯来语既指这城的荒废，也指它所招致的讥诮；“发嘘声”也可理解为“吹口哨”。
    reason: lexical_alternative
  - marker: b
    text: “发出嘘声”也可译作“吹口哨”或“嗤笑”。这是先知书中描写人看见上帝审判所造成的荒凉景象时，因震惊或讥诮而作出反应的惯用形象。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׂמְתִּי
  choice: 我要使
  rationale: שׂים与表示结果的לְ结构连用，意为“使……成为”；译为“我要使”自然且保留结果含义。
- source_word: הָעִיר הַזֹּאת
  choice: 这城
  rationale: 保留指示词“这”的现场指向；“这城”符合庄重而自然的现代汉语经文语体。
- source_word: לְשַׁמָּה
  choice: 荒凉
  rationale: שַׁמָּה兼有毁坏荒废及令人震惊之意；正文以“荒凉”呈现城市的客观状态，并由后文“惊骇”表达其引起的反应。
- source_word: וְלִשְׁרֵקָה
  choice: 令人嗤笑
  rationale: 该名词指受审判之废墟所招致的吹哨、嘘声或讥嘲。“令人嗤笑”以自然汉语表达其成为讥诮对象的含义，同时以脚注保留声音意象。
- source_word: כֹּל עֹבֵר עָלֶיהָ
  choice: 凡从这里经过的人
  rationale: 参与式短语具有泛指和全称作用；此译自然表达“每一个经过者”。介词עַל在这里依语境译作“从这里经过”。
- source_word: יִשֹּׁם
  choice: 都会……惊骇
  rationale: שׁמם在此表示面对毁灭而震惊、骇然；“惊骇”比单纯“惊讶”更符合审判语境。
- source_word: וְיִשְׁרֹק
  choice: 并发出嘘声
  rationale: שרק可指吹哨或发嘘声；“发出嘘声”保留声音意象，也能表达面对灾祸时震惊或讥诮的惯用动作，避免在正文中过度限定其情感色彩。
- source_word: עַל כָּל מַכֹּתֶיהָ
  choice: 因它所受的一切创伤
  rationale: מַכָּה可指击打、伤口、灾祸或瘟疫；“所受的一切创伤”生动表达这城遭击打后的惨状，又不把含义局限为疾病。
theological_decisions:
- issue: 嘘声所表达的态度
  choice: 正文译作“发出嘘声”，不明确限定为讥讽
  alternative: 因鄙夷而嗤笑／吹口哨表示震惊
  rationale: 先知文学中的שרק可同时唤起震惊、鄙夷和嘲弄等反应；保留动作本身，避免消除原文的语义张力。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“荒凉”与“惊骇”分别承载שׁמם词族在本节中的客观毁坏和主观反应；“发出嘘声”保留希伯来语的具体声音意象，并通过脚注说明“吹口哨／嗤笑”等可能含义。所有脚注标记均置于正文相应位置。
