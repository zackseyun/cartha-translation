id: JER.23.21
reference: Jeremiah 23:21
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: לֹא שָׁלַ֥חְתִּי אֶת הַ/נְּבִאִ֖ים וְ/הֵ֣ם רָ֑צוּ לֹא דִבַּ֥רְתִּי אֲלֵי/הֶ֖ם וְ/הֵ֥ם נִבָּֽאוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/021.yaml
  text: I did not send the prophets[a], yet they ran; I did not speak to them, yet they prophesied.
translation:
  language: zh_hans
  text: 我没有差遣先知，他们却奔走[a]；我没有对他们说话，他们却说预言。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们就跑了。”希伯来语连词也可直译为“而”；但在这里的上下文中带有强烈的对比。
    reason: 保留“跑”的字面意象，并说明连词的另一种可能译法及其在本句的逆接作用；不加入原文未表达的方向性。
lexical_decisions:
- source_word: שָׁלַחְתִּי
  choice: 差遣
  rationale: “差遣”自然表达 שׁלח 的基本意义，并在先知语境中保留奉派、获授权的含义，而不额外解释。
- source_word: הַנְּבִאִים
  choice: 那些先知
  rationale: 定冠词指向上下文中受责备的先知群体；汉语用“那些先知”既明确所指，也符合现代叙述习惯。
- source_word: רָצוּ
  choice: 奔走
  rationale: 保留 רוץ“跑、奔跑”的鲜明意象；在汉语中“奔走”也可自然表示未经差遣便积极行动，避免直接释为“擅自传道”。
- source_word: דִבַּרְתִּי אֲלֵיהֶם
  choice: 对他们说话
  rationale: 直接对应 דבר אל，保留上帝并未向他们传达话语这一陈述，不添加“启示”等解释性措辞。
- source_word: נִבָּאוּ
  choice: 说预言
  rationale: 对应 נבא 的先知性言说。现代汉语“说预言”比单用较书面的“预言”作动词更易懂，同时不预先判定其话语内容。
- source_word: וְהֵם
  choice: 他们却
  rationale: ו 本可作简单连接词“而/并且”，但两组平行否定句形成明显反差；“却”自然传达此处的逆接关系。
- source_word: לֹא
  choice: 没有
  rationale: 与完成式动词连用，在本语境中否定已经发生的差遣和说话；汉语“没有”表达自然准确。
theological_decisions:
- issue: 假先知活动的性质
  choice: 经文表明这些先知在没有上帝差遣、也没有领受上帝话语的情况下行动并说预言。
  alternative: 也可能较弱地理解为经文主要责备他们急于行动，而非完全否认其受差遣。
  rationale: “我没有差遣”与“我没有对他们说话”两句彼此平行，强烈表明他们缺少神圣授权和所领受的话语；译文保留这一责备，却不扩展为本节以外的预言论主张。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“差遣”符合圣经叙事语域；“奔走”保留原文意象。两处“却”再现希伯来语并列结构中的强烈反差。
