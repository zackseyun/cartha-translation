  source_fidelity: 译文准确保留了两组平行的否定与结果，以及“跑／奔走”的比喻性意象。惟“那些先知”较希伯来语定冠词所要求的明确程度略强；中文直接说“先知”即可自然指向上下文中的相关群体。脚注中的“跑去了”给原文未明示的方向性增义，宜避免。
  naturalness: “差遣”“奔走”“说预言”均属现代汉语中庄重、易懂且适合经文的表达。“我没有差遣先知”比“我没有差遣那些先知”更凝练自然。
  terminology: “差遣”恰当保留神圣委派的语境而不作过度诠释；“先知”“说预言”用语一致。“对他们说话”直接对应原文“向他们说话”，并未擅加“启示”等解释。
