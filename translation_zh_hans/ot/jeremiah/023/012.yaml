id: JER.23.12
reference: Jeremiah 23:12
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: לָ/כֵן֩ יִֽהְיֶ֨ה דַרְכָּ֜/ם לָ/הֶ֗ם כַּ/חֲלַקְלַקּוֹת֙ בָּֽ/אֲפֵלָ֔ה יִדַּ֖חוּ וְ/נָ֣פְלוּ בָ֑/הּ כִּֽי אָבִ֨יא עֲלֵי/הֶ֥ם רָעָ֛ה שְׁנַ֥ת פְּקֻדָּתָ֖/ם נְאֻם יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/012.yaml
  text: Therefore their way will be to them like slippery places in the darkness; they will be driven along and fall in it[a], for I will bring disaster on them in the year of their punishment, declares Yahweh.
translation:
  language: zh_hans
  text: 因此，他们的道路对他们必如黑暗中的滑地；他们必被驱赶，跌倒在其中。因为在追讨他们之年[a]，我要使灾祸临到他们。这是雅威的宣告。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“惩罚他们之年”。希伯来语“追讨”也可指神临到人，进行查究、清算或审判。
    reason: 说明 פְּקֻדָּה 的语义范围及审判语境中的另一种译法。
lexical_decisions:
- source_word: לָכֵן
  choice: 因此
  rationale: 明确承接上文的控诉，引出相应的审判后果。
- source_word: יִהְיֶה דַרְכָּם לָהֶם
  choice: 他们的道路对他们必如
  rationale: 保留“道路”这一可兼指行为方式与人生际遇的隐喻，也保留 לָהֶם 所表达的意味：他们自己的道路反而成为危害他们的处境。
- source_word: כַּחֲלַקְלַקּוֹת בָּאֲפֵלָה
  choice: 如黑暗中的滑地
  rationale: 以简洁、形象的现代汉语表达复数 חֲלַקְלַקּוֹת 所指的湿滑、危险之地；“黑暗”兼具实际环境与审判意象。
- source_word: יִדַּחוּ
  choice: 必被驱赶
  rationale: 尼斐勒式表明他们受到外力推动或驱逐；此译保留被动语态，并与道路意象衔接。
- source_word: וְנָפְלוּ בָהּ
  choice: 跌倒在其中
  rationale: 保留阴性代词 בָהּ 的含混指向，不强行限定为“黑暗”或“滑地”；“跌倒”符合危险道路的画面。
- source_word: רָעָה
  choice: 灾祸
  rationale: 在神施行审判的语境中指临到人的灾难，而非道德意义上的邪恶。
- source_word: שְׁנַת פְּקֻדָּתָם
  choice: 追讨他们之年
  rationale: פְּקֻדָּה 在此有神临到并清算、惩治之意；“追讨”既符合审判语境，也较“惩罚”保留其探访、查究与问责的语义幅度。
- source_word: נְאֻם יְהוָה
  choice: 这是雅威的宣告
  rationale: 以庄重自然的汉语呈现先知书常见的权威宣告格式，并将圣名直接音译为“雅威”。
theological_decisions:
- issue: 如何译写 יְהוָה
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字圣名；音译“雅威”使读者看见这里是神的专名，而不是普通称号。
- issue: 神所带来的 רָעָה
  choice: 灾祸
  alternative: 恶；灾难
  rationale: 此处谈的是作为审判而临到的祸患，不是说神施行道德上的恶；“灾祸”既保留严厉性，也避免不必要的误解。
- issue: שְׁנַת פְּקֻדָּתָם 的审判含义
  choice: 追讨他们之年
  alternative: 惩罚他们之年；临到他们之年
  rationale: 上下文明确指向审判，但 פְּקֻדָּה 本身涵盖临到、查究、问责与惩治；正文用“追讨”保留这层张力，脚注说明其他可能表达。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。保留“道路—滑地—黑暗—跌倒”的连续意象，并以“其中”维持原文代词所具有的指向含混。
