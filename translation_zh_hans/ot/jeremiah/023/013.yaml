base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/013.yaml
  text: 'And among the prophets of Samaria I saw something offensive: they prophesied by Baal and led my people Israel astray[a][b].'
translation:
  language: zh_hans
  text: 我在撒玛利亚的先知中看见了荒唐的事[a]：他们奉巴力说预言[b]，使我的子民以色列走入歧途。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “荒唐的事”或译“愚妄的事”或“骇人的事”。原词指在道德或宗教上荒谬、败坏、令人震惊的事。
    reason: lexical_alternative
  - marker: b
    text: “奉巴力说预言”也可译作“靠巴力说预言”或“为巴力说预言”；意思是他们以巴力之名，或在其权威之下从事预言活动。
    reason: alternative_reading
lexical_decisions:
- source_word: וּבִנְבִיאֵי שֹׁמְרוֹן
  choice: 我在撒玛利亚的先知中
  rationale: 介词 ב 表示观察所涉及的群体，译作“在……中”自然准确；ו 在本节承接上文，中文独立呈现时不必机械译出“并且”。“撒玛利亚”保留地名，并指向北国的先知群体。
- source_word: רָאִיתִי
  choice: 我……看见了
  rationale: Qal 完成式第一人称单数，直接保留说话者所作的观察。
- source_word: תִפְלָה
  choice: 可憎的事
  rationale: 该词在这里表达道德和宗教层面的荒谬、败坏或令人震惊之事；“可憎的事”比单纯的“愚妄”更能传达上下文中的负面宗教评价，同时以脚注保留其他可能译法。
- source_word: הִנַּבְּאוּ
  choice: 说预言
  rationale: Hitpael 形式表示从事先知性宣告；现代汉语用“说预言”清楚自然。
- source_word: בַבַּעַל
  choice: 奉巴力
  rationale: 介词 ב 在此表示其预言活动所凭借、归属或诉诸的权威；“奉巴力”自然表达奉巴力之名或倚靠巴力说预言，同时不将语义限定得过窄。
- source_word: וַיַּתְעוּ
  choice: 使……走入歧途
  rationale: תעה 的 Hiphil 形式具有使役义，即“使偏离、引入迷途”；此译保留使役性和道德、信仰上的迷失意象。
- source_word: אֶת עַמִּי אֶת יִשְׂרָאֵל
  choice: 我的子民以色列
  rationale: 第二个带宾格标记的名词“以色列”与“我的子民”构成同位关系；中文直接并置最为自然。
theological_decisions:
- issue: הִנַּבְּאוּ בַבַּעַל 中先知与巴力的关系
  choice: 他们奉巴力说预言
  alternative: 他们靠巴力说预言；他们为巴力说预言
  rationale: 原文介词 ב 可以表达凭借、关联或权威范围。“奉巴力”保留他们以巴力之名或在其权威之下进行预言活动的谴责意味，却不武断限定为工具或受益关系。
- issue: תִפְלָה 的道德—宗教评价力度
  choice: 可憎的事
  alternative: 愚妄的事；骇人的事；荒唐的事
  rationale: 语境所斥责的是涉及偶像崇拜和误导百姓的宗教败坏，而非单纯智识上的愚蠢。“可憎”传达强烈评价；脚注保留该词可能涵盖的“愚妄、骇人”等语义。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“可憎的事”保持先知谴责的力度；“奉巴力说预言”符合现代宗教语境中的自然表达；“走入歧途”保留原文使人偏离正道的意象。所有脚注标记均已置于正文相应位置。
