  text: בְּ/יָמָי/ו֙ תִּוָּשַׁ֣ע יְהוּדָ֔ה וְ/יִשְׂרָאֵ֖ל יִשְׁכֹּ֣ן לָ/בֶ֑טַח וְ/זֶה שְּׁמ֥/וֹ אֲֽשֶׁר יִקְרְא֖/וֹ יְהוָ֥ה צִדְקֵֽ/נוּ־־׀׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/006.yaml
  text: 'In his days Judah will be saved[a], and Israel will dwell securely[b]; and this is the name by which he will be called: Yahweh Is Our Righteousness.'
translation:
  language: zh_hans
  text: 在他的日子，犹大必得拯救，以色列必安然居住；人要称他为“耶和华是我们的公义[b]”[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文是未明写系词的名号短语，也可译作：“耶和华——我们的公义。”
    reason: 保留原文名词性称名公式的句法歧义。
  - marker: b
    text: “公义”也可译作“正义”。
    reason: 说明希伯来词 צדק 在公义与正义之间的语义范围。
lexical_decisions:
- source_word: בְּיָמָיו
  choice: 在他的日子
  rationale: 直译希伯来语时间短语，并按上下文指向前文所说那位公义苗裔在世掌权的时期，不将其扩展为“在他执政期间”。
- source_word: תִּוָּשַׁע
  choice: 必得拯救
  rationale: 保留尼法勒语态所表达的“被救、获救”，且不限定为军事、政治或属灵层面的拯救。
- source_word: יִשְׁכֹּן לָבֶטַח
  choice: 必安然居住
  rationale: 兼顾 שׁכן 的定居、居住含义和 לבטח 的安全、无惧含义，中文庄重而自然。
- source_word: אֲשֶׁר יִקְרְאוֹ
  choice: 人要称他为
  rationale: 马所拉文本的动词为单数，主语未明确，可理解为泛指的“人”；这样既保留不定主语，也避免误译成明确的复数“他们”。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的四字神名音译，不以“主”这一称号替代原文专名。
- source_word: צִדְקֵנוּ
  choice: 我们的公义
  rationale: צדק 的语义范围包括公义、正义和合乎正直标准的状态；在这一命名公式中，“我们的公义”最能保留其关系性和神学张力，同时不把含义缩减为司法公平。
theological_decisions:
- issue: 名号 יְהוָה צִדְקֵנוּ 的句法关系
  choice: 耶和华是我们的公义
  alternative: 耶和华——我们的公义
  rationale: 希伯来语是没有明写系词的名词性短语，既可按述谓关系理解，也可保留为并置的名号。正文补出中文所需的“是”，使称名公式清楚自然；脚注保留不补系词的读法。
- issue: צִדְקֵנוּ 的语义
  choice: 我们的公义
  alternative: 我们的正义
  rationale: “公义”可涵盖合乎正直标准、关系上的正当和施行公平等维度；“正义”虽属可能译法，却较容易使中文读者只想到司法或社会公平。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“必得拯救”“安然居住”保留先知文学的郑重语气；“人要称他为”自然表达原文未指明的单数泛指主语。脚注标记均紧随其所说明的内容。
