source:
  edition: WLC
  text: כֹּֽה אָמַ֞ר יְהוָ֣ה צְבָא֗וֹת אַֽל תִּשְׁמְע֞וּ עַל דִּבְרֵ֤י הַ/נְּבִאִים֙ הַ/נִּבְּאִ֣ים לָ/כֶ֔ם מַהְבִּלִ֥ים הֵ֖מָּה אֶתְ/כֶ֑ם חֲז֤וֹן לִבָּ/ם֙ יְדַבֵּ֔רוּ לֹ֖א מִ/פִּ֥י יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/016.yaml
  text: 'Thus says Yahweh of hosts: Do not listen to the words of the prophets who prophesy to you; they are deluding you. They speak a vision of their own heart[a], not from the mouth of Yahweh.'
translation:
  language: zh_hans
  text: 万军之耶和华如此说：“不要听从那些向你们说预言的先知所说的话；他们在欺骗你们。[a]他们所讲的是自己心中的异象，并非出自耶和华的口。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “他们在欺骗你们”也可较直译为“他们使你们落入虚妄”。原文动词与“虚妄、空虚”有关，在此处指以空洞的信息误导人。
    reason: 说明 מַהְבִּלִים 的词根所含“虚妄／空虚”语义，并给出不生硬的较直译替代，同时不将含义限定为“虚假的希望”。
lexical_decisions:
- source_word: יְהוָה צְבָאוֹת
  choice: 万军之耶和华
  rationale: 保留神名“耶和华”，并以汉语圣经语体中清楚、庄重的“万军之”表达 צְבָאוֹת；不把所指范围局限为地上的军队。
- source_word: אַל תִּשְׁמְעוּ עַל דִּבְרֵי
  choice: 不要听……所说的话
  rationale: 按语境将“听”表达为听从、采纳其言论，同时保留 דִּבְרֵי 的“话”这一具体意象。
- source_word: הַנְּבִאִים הַנִּבְּאִים לָכֶם
  choice: 那些向你们说预言的先知
  rationale: 保留“先知／说预言”的同根复现和复数第二人称受众，汉语表达自然。
- source_word: מַהְבִּלִים הֵמָּה אֶתְכֶם
  choice: 他们使你们陷入虚妄
  rationale: 该词为 הבל 的使役形式，核心意涵是使人落入空虚、虚妄；此译避免将其过度限定为“虚假的希望”或单纯“欺骗”。
- source_word: חֲזוֹן לִבָּם
  choice: 异象出于自己的心
  rationale: 保留单数“异象”和希伯来文“心”的意象；“自己的”明确其内容源于先知自身，而非神。
- source_word: לֹא מִפִּי יְהוָה
  choice: 并非出自耶和华的口
  rationale: 保留“从……的口”这一具体希伯来语意象，突出这些话并非耶和华亲自发出的言语。
theological_decisions:
- issue: 假先知对听众造成的作用
  choice: 他们使你们陷入虚妄
  alternative: 他们欺骗你们；他们使你们产生虚假的希望
  rationale: מַהְבִּלִים 表达使人进入空虚、虚妄的状态，可能包含误导和空洞保证，但本节本身没有明说“希望”；采用较宽而贴近词根的译法，保留语义张力。
- issue: “心”作为异象来源的含义
  choice: 出于自己的心
  alternative: 出于自己的思想
  rationale: 希伯来语“心”可涵盖思想、意愿和欲望。直译“心”既为现代汉语所能理解，也避免只将其收窄为理智活动。
- issue: 神谕来源的对比
  choice: 并非出自耶和华的口
  alternative: 并非出自耶和华
  rationale: 保留原文身体意象，使“自心而出”与“从耶和华口而出”的来源对比更鲜明，而不额外解释启示机制。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“万军之耶和华”“异象”“出自……的口”保留原文关键意象；句式略带宣告体，但避免生硬古语。脚注标记置于其所解释的分句之后。
