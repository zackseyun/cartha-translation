  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/הֲקִמֹתִ֧י עֲלֵי/הֶ֛ם רֹעִ֖ים וְ/רָע֑וּ/ם וְ/לֹא יִֽירְא֨וּ ע֧וֹד וְ/לֹא יֵחַ֛תּוּ וְ/לֹ֥א יִפָּקֵ֖דוּ נְאֻם יְהוָֽה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/004.yaml
  text: And I will raise up over them shepherds who will shepherd them[a], and they will no longer fear, nor be dismayed, nor will any be missing, declares Yahweh.
translation:
  language: zh_hans
  text: “我必为他们兴起牧人，牧养他们。他们不再惧怕，不再惊惶，一个也不会少[a]。”这是雅威的宣告。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“他们不会缺乏”，也可理解为“一个也不会失落”。这里的希伯来语很可能是说，羊群中没有一个缺失或下落不明。
    reason: 词义存在可保留的多种可能；正文采用最符合羊群意象且最自然的译法。
lexical_decisions:
- source_word: וַהֲקִמֹתִי
  choice: 我必……兴起
  rationale: 保留使领袖兴起、就位的含义，并突出上帝主动施行此事；“必”表达未完成式在预言语境中的将来指向。
- source_word: עֲלֵיהֶם
  choice: 为他们
  rationale: 希伯来语介词在此表示牧人对群体所负的权柄与责任。直译“在他们之上”不合现代汉语习惯，“为他们”自然传达上帝给群体安排牧人的意思，而牧养关系由下句明确。
- source_word: רֹעִים
  choice: 牧人
  rationale: 保留上下文核心的牧羊意象，避免用“领袖”将比喻扁平化，也避免“牧师”带入后世教会职分。
- source_word: וְרָעוּם
  choice: 牧养他们
  rationale: 与“牧人”使用同源表达，重现希伯来语名词与动词的呼应；“牧养”兼有喂养、照料和引导之意。
- source_word: וְלֹא יִירְאוּ עוֹד
  choice: 他们不再惧怕
  rationale: 准确表达 ירא 的恐惧含义和 עוֹד 的“不再”，措辞自然庄重。
- source_word: וְלֹא יֵחַתּוּ
  choice: 不再惊惶
  rationale: חתת 的被动词干可指因威胁而胆怯、惊恐或沮丧。“惊惶”与“惧怕”相关但不完全重合，并符合群羊蒙恢复的语境。
- source_word: וְלֹא יִפָּקֵדוּ
  choice: 一个也不会少
  rationale: 此处最可能指羊群中没有任何一个缺失或未被点算在内。该译法简洁具体，并避免“失丧”可能引发的额外救恩论联想。
- source_word: נְאֻם יְהוָה
  choice: 这是雅威的宣告
  rationale: 保留先知书常见的神谕公式；“宣告”体现 נְאֻם 的正式语气，使用“雅威”呈现神名。
theological_decisions:
- issue: 牧人意象的处理
  choice: 保留“牧人／牧养”的字面比喻
  alternative: 译作“领袖／照管”
  rationale: 本节承接上下文对坏牧人与蒙恢复之群羊的对比；保留比喻才能呈现其先知性与神学张力，同时不把牧人直接等同于某一种后世宗教职分。
- issue: וְלֹא יִפָּקֵדוּ 的范围与含义
  choice: 译作“一个也不会少”
  alternative: 译作“他们不会缺乏”或“一个也不会失落”
  rationale: 该动词在此很可能表示无人缺失、无人未被点算；“一个也不会少”呈现整群得以保全的结果，却不把“失落”解释为后世特定的属灵状态。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以短句和并列结构保留希伯来语的节奏；“惧怕／惊惶”区分两个相近但不相同的动词；神名 יְהוָה 音译为“雅威”。
