  text: אֹמְרִ֤ים אָמוֹר֙ לִֽ/מְנַאֲצַ֔/י דִּבֶּ֣ר יְהוָ֔ה שָׁל֖וֹם יִֽהְיֶ֣ה לָ/כֶ֑ם וְ֠/כֹל הֹלֵ֞ךְ בִּ/שְׁרִר֤וּת לִבּ/וֹ֙ אָֽמְר֔וּ לֹֽא תָב֥וֹא עֲלֵי/כֶ֖ם רָעָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/017.yaml
  text: 'They keep saying to those who despise me[a], ‘Yahweh has spoken: You will have peace’; and to everyone who walks in the stubbornness of his own heart they say[c][b], ‘No disaster will come upon you.’'
translation:
  language: zh_hans
  text: 他们不断对那些藐视我的人说[a]：“雅威说：你们必享平安[b]。”他们又对所有随从自己顽梗的心而行的人说：“灾祸必不临到你们[c]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“那些轻蔑我的人”或“那些厌弃我的人”。希伯来文直译为“藐视我的人”。
    reason: lexical_alternative
  - marker: b
    text: “平安”也可包括安康、福祉或兴盛之意。
    reason: lexical_alternative
  - marker: c
    text: 或译：“祸患必不会临到你们。”这里所说的不是道德上的“恶”，而是灾难。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹמְרִים אָמוֹר
  choice: 不断……说
  rationale: 分词与同词根不定式绝对形连用，具有强调和反复持续的意味；“不断……说”既自然，也传达其一再宣讲。
- source_word: לִמְנַאֲצַי
  choice: 对那些藐视我的人
  rationale: נאץ 的分词带第一人称单数后缀，直指“藐视我的人”；“藐视”保留了对上帝本人轻蔑、弃绝的意味。
- source_word: דִּבֶּר יְהוָה
  choice: 雅威已经说了
  rationale: 完成式表达已经作出的宣告，假先知借此声称自己的话有神圣权威；译出神名“雅威”。
- source_word: שָׁלוֹם יִהְיֶה לָכֶם
  choice: 你们必享平安
  rationale: 将希伯来语“平安将归于你们”的存在句按现代汉语表达为“必享平安”，同时保留 שָׁלוֹם 的核心用语。
- source_word: וְכֹל הֹלֵךְ
  choice: 又对所有……而行的人
  rationale: הֹלֵךְ 表示惯常的行事方式；“而行”保留圣经中以行走比喻生活行为的色彩，又符合中文句法。
- source_word: בִּשְׁרִרוּת לִבּוֹ
  choice: 固执己心而行
  rationale: שְׁרִרוּת 指顽梗、固执；“固执己心”自然凝练，并保留其凭自己内心执意而行的含义。
- source_word: לֹא תָבוֹא עֲלֵיכֶם רָעָה
  choice: 灾祸必不会临到你们
  rationale: רָעָה 在此为审判语境中的灾难、祸患，并非道德意义的邪恶；“临到”对应 בוא על 的惯用表达。
theological_decisions:
- issue: “藐视我的人”中第一人称后缀所指
  choice: 正文保留“我”，在语境中理解为雅威
  alternative: 理解为先知耶利米
  rationale: 上下文聚焦于人拒绝雅威的话，紧接着假先知又声称“雅威已经说了”；不过译文不以解释性改写取代原文第一人称形式。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“不断……说”传达原文的反复强调；两处引语以“又”衔接，使假先知对两类人的虚假保证清楚并列。保留“雅威”作为神名，并用脚注呈现 שָׁלוֹם 与 רָעָה 的语义范围。
