base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/034.yaml
  text: And as for the prophet[a], the priest, or the people who say, “The burden of Yahweh,” I will punish that man and his household.
translation:
  language: zh_hans
  text: 至于先知、祭司或百姓，无论谁说：“雅威的重担[a]”，我必惩罚那人和他的家。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “重担”也可译作“神谕”。希伯来语 מַשָּׂא 可表示“神谕”，但耶利米在这里似乎借用其较字面的“重担”之意来责备他们。
    reason: 保留关键词的词义歧义及本段的双关。
lexical_decisions:
- source_word: הַנָּבִיא וְהַכֹּהֵן וְהָעָם
  choice: 先知、祭司或百姓
  rationale: 三个带定冠词的群体按汉语习惯列举；上下文表达任一类人若如此说便受审判，因此用“或”自然传达逐项适用的关系。
- source_word: אֲשֶׁר יֹאמַר
  choice: 无论谁说
  rationale: 希伯来语动词为阳性单数，关系从句以分配方式指向前述各类人中的个体；“无论谁说”既自然，也与下文“那人”呼应。
- source_word: מַשָּׂא יְהוָה
  choice: 这是雅威的重担
  rationale: מַשָּׂא既可指“神谕”，也有“重担”之意；本段刻意利用后一含义进行责备，正文采用“重担”以保留双关，并用脚注说明另一译法。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语中常见的音译呈现神名，区别于作为称号的“主”。
- source_word: וּפָקַדְתִּי עַל
  choice: 我都要惩罚
  rationale: פָּקַד עַל在此审判语境中表示追究并施罚；“惩罚”清楚直接，“都”承接“无论谁”的分配结构。
- source_word: הָאִישׁ הַהוּא
  choice: 那人
  rationale: 保留希伯来语阳性单数及其对具体违规者的指向，同时符合现代汉语表达。
- source_word: בֵּיתוֹ
  choice: 他的全家
  rationale: בַּיִת在这里指家庭或家户，而非建筑物；“全家”准确自然地表达受牵连的家户整体。
theological_decisions:
- issue: 耶利米责备中מַשָּׂא יְהוָה的译法
  choice: 雅威的重担
  alternative: 雅威的神谕
  rationale: מַשָּׂא在先知文本中可以是“神谕”，但耶利米书23:33–40借其“重担”义展开责备。正文保留“重担”，避免抹平经文的修辞张力；脚注保存“神谕”这一真实词义。
- issue: 神名יְהוָה的呈现
  choice: 雅威
  alternative: 耶和华
  rationale: 采用直接音译，使专名与“主”这一称号有所区别；不据此加入任何宗派性解释。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“至于”承接本段前文的话题；“无论谁说……我都要……”清楚呈现从群体到个体的分配关系。引语中补出“这是”，使汉语完整流畅，并不改变原文命题内容。
