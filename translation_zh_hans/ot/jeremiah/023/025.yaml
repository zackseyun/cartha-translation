  to: 我听见了那些奉我的名说假预言的先知所说的话[a]；他们说：‘我梦见了！我梦见了！’
  rationale: 修订将“奉我的名……预言”的分词性说明直接修饰“先知”，使其更贴近希伯来文结构；以“说假预言”取代不够自然的“预言谎言”。“我梦见了”保留重复和强调，且较“我做了梦”更适合此处自称获得梦中启示的语境。
