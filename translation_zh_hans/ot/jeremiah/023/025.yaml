  text: שָׁמַ֗עְתִּי אֵ֤ת אֲשֶׁר אָֽמְרוּ֙ הַ/נְּבִאִ֔ים הַֽ/נִּבְּאִ֥ים בִּ/שְׁמִ֛/י שֶׁ֖קֶר לֵ/אמֹ֑ר חָלַ֖מְתִּי חָלָֽמְתִּי־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/025.yaml
  text: I have heard what the prophets have said[a], those who prophesy lies in my name, saying, ‘I have dreamed! I have dreamed!’
translation:
  language: zh_hans
  text: 我听见了那些奉我的名说假预言的先知所说的话[a]；他们说：‘我梦见了！我梦见了！’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我听见了那些先知所说的话；他们奉我的名预言谎言。”
    reason: שֶׁקֶר 可理解为预言的内容，即“谎言”，也可理解为“虚假地”。正文采用汉语更自然的“说假预言”，同时保留原文对虚假预言的指控。
lexical_decisions:
- source_word: שָׁמַעְתִּי
  choice: 我听见了
  rationale: שׁמע 的 Qal 完成式第一人称单数；“听见了”自然表达已经发生且与当前宣告有关的听闻。
- source_word: אֵת אֲשֶׁר אָמְרוּ
  choice: 那些先知所说的话
  rationale: אֵת אֲשֶׁר 引出动词“说”的宾语；汉语用“所说的话”清楚而自然。
- source_word: הַנְּבִאִים
  choice: 那些先知
  rationale: נביאים 的通常译法；“那些”兼顾定冠词及本句对特定先知群体的指称。
- source_word: הַנִּבְּאִים
  choice: 他们……预言
  rationale: Niphal 主动分词阳性复数，与“先知”构成同位说明；汉语改用承接分句，避免生硬重复。
- source_word: בִּשְׁמִי
  choice: 奉我的名
  rationale: 表达他们声称以耶和华的授权和权威发言；这是现代汉语中自然且庄重的圣经语体。
- source_word: שֶׁקֶר
  choice: 谎言
  rationale: 保留名词的具体力度，把它理解为预言的虚假内容；也可能作方式意义，故以脚注注明另一译法。
- source_word: לֵאמֹר
  choice: 说
  rationale: 常见引语标记，在此自然引出先知反复声称的内容。
- source_word: חָלַמְתִּי חָלָמְתִּי
  choice: 我做了梦！我做了梦！
  rationale: 保留两个完成式的重复及强调语气，不将其合并或弱化。
theological_decisions:
- issue: 假先知所作预言的性质
  choice: 他们奉我的名预言谎言
  alternative: 他们奉我的名作虚假的预言
  rationale: 希伯来语 שֶׁקֶר 既可理解为预言的内容“谎言”，也可带方式意义“虚假地”。正文保留具体的名词力度，脚注则保存另一种合理理解，不额外界定其谎言的心理动机。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“奉我的名”准确传达声称得到神授权的语义；重复“我做了梦”保留原文强烈而近乎炫示的语气。
