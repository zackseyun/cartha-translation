  text: לָ/כֵ֞ן כֹּֽה אָמַ֨ר יְהוָ֤ה צְבָאוֹת֙ עַל הַ/נְּבִאִ֔ים הִנְ/נִ֨י מַאֲכִ֤יל אוֹתָ/ם֙ לַֽעֲנָ֔ה וְ/הִשְׁקִתִ֖י/ם מֵי רֹ֑אשׁ כִּ֗י מֵ/אֵת֙ נְבִיאֵ֣י יְרוּשָׁלִַ֔ם יָצְאָ֥ה חֲנֻפָּ֖ה לְ/כָל הָ/אָֽרֶץ־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/015.yaml
  text: 'Therefore this is what Yahweh of Armies says concerning the prophets: ‘Look[a], I am feeding them wormwood and making them drink poisoned water, because from the prophets of Jerusalem ungodliness has gone out into all the land.’'
translation:
  language: zh_hans
  text: 所以，万军之耶和华论到这些先知如此说：“看哪，我要使他们吃苦艾，喝毒水[a]；因为不敬虔之事从耶路撒冷的先知那里传到了全地。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“苦毒之水”。希伯来文直译为“罗施之水”；“罗施”所指的是一种有苦味或有毒的东西。
    reason: 保留רֹאשׁ具体所指并不完全确定的词汇歧义；正文采用语境清楚的“毒水”。
lexical_decisions:
- source_word: יְהוָה צְבָאוֹת
  choice: 万军之耶和华
  rationale: 保留神的专名“耶和华”，并以现代中文仍可理解的传统表达“万军之”呈现צְבָאוֹת所含军旅、众军之意。
- source_word: עַל הַנְּבִאִים
  choice: 论到这些先知
  rationale: עַל在宣告公式中可指“论到”或“攻击”；采用较宽泛的“论到”，而由下文审判内容表达敌对意味。定冠词以“这些”自然呈现，指向上下文中的先知。
- source_word: הִנְנִי
  choice: 看哪，我要
  rationale: “看哪”保留强调、唤起注意的语用功能；“我要”配合后续分词和使役形式，表达神正在宣告、即将施行的审判，不把时态过度限定为已经进行。
- source_word: מַאֲכִיל אוֹתָם לַעֲנָה
  choice: 使他们吃苦艾
  rationale: 保留使役语态和苦艾这一具体、苦涩的审判意象，不抽象改写为“使他们受苦”。
- source_word: וְהִשְׁקִתִים מֵי רֹאשׁ
  choice: 喝毒水
  rationale: 动词为使役形式；中文并列结构“使他们吃……，喝……”已自然涵盖使役关系。רֹאשׁ在此指苦味或有毒之物，“毒水”清楚传达主要语义，同时以脚注保留词义的不确定性。
- source_word: חֲנֻפָּה
  choice: 不敬虔之事
  rationale: 该词兼有不敬神、亵渎和道德败坏之意；“不敬虔之事”保留宗教与伦理两方面，不将其窄化为口头亵渎。
- source_word: יָצְאָה ... לְכָל הָאָרֶץ
  choice: 传到了全地
  rationale: 以自然中文保留败坏从耶路撒冷先知那里向外而去的图景；“全地”在本段语境中指所论之地，不扩大解释为整个世界。
theological_decisions:
- issue: 神施行审判的具体意象
  choice: 保留“使他们吃苦艾，喝毒水”
  alternative: 意译为“使他们遭受苦毒的审判”
  rationale: 原文用进食苦艾、饮用毒水描绘神对败坏先知的惩罚。保留具体意象可呈现先知话语的力度及神圣审判的神学分量。
- issue: חֲנֻפָּה的宗教与伦理含义
  choice: 不敬虔之事
  alternative: 邪恶、亵渎或败坏
  rationale: 原词含义不只一般道德邪恶，也涉及对神的不敬；所选译法兼顾两者，又避免断定这里只指某一种具体罪行。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。“万军之耶和华”和“看哪”保留先知宣告的经文语体；其余句法力求普通读者易懂。脚注标记[a]置于其实际解释的“毒水”之后。
