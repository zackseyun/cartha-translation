  terminology: “耶和华”“万军之”“苦艾”及“不敬虔之事”均能妥善传达原文的专名、军事称号、具体审判意象和宗教—伦理败坏含义。“毒水”是对מֵי רֹאשׁ的清楚正文处理；脚注同时保留该词具体所指未完全确定的事实，处理稳妥。
