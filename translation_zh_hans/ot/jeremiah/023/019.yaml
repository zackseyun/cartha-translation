  text: הִנֵּ֣ה סַעֲרַ֣ת יְהוָ֗ה חֵמָה֙ יָֽצְאָ֔ה וְ/סַ֖עַר מִתְחוֹלֵ֑ל עַ֛ל רֹ֥אשׁ רְשָׁעִ֖ים יָחֽוּל׀׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/019.yaml
  text: Look[a], the storm of Yahweh has gone out in wrath, a whirling tempest[c][b]; it will whirl down on the head of the wicked.
translation:
  language: zh_hans
  text: 看哪，雅威的暴风带着烈怒已经发出[a]；那旋转的狂风必旋转着临到恶人的头上[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “已经发出”也可译作“必将发出”。原文使用完成式，把未来而确定的审判描写为已经发动。
    reason: aspectual_alternative
  - marker: b
    text: “旋转着临到”也可译作“必猛然袭击”。原文动词与前面的“旋转”同根，既可突出狂风的回旋，也可能强调它猛烈临到恶人的冲击。
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: 看哪
  rationale: 保留原文引人注意、使宣告显得迫在眼前的语气；“看哪”庄重而仍为现代读者所熟悉。
- source_word: סַעֲרַת יְהוָה
  choice: 雅威的暴风
  rationale: סַעֲרָה指猛烈的风暴；属格结构表明这风暴属于或出自雅威。“暴风”比“风暴”更能自然衔接后文狂烈旋转的意象。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见音译直接呈现四字神名，保留其专名性质。
- source_word: חֵמָה
  choice: 带着烈怒
  rationale: 将名词按伴随情状表达，既保留审判语境中强烈的忿怒含义，也避免生硬直译成同位语。
- source_word: יָצְאָה
  choice: 已经刮起
  rationale: “刮起”符合汉语对暴风发动的自然说法；“已经”保留完成式将确定的审判描写为已经启动的修辞力度。
- source_word: וְסַעַר מִתְחוֹלֵל
  choice: 是一阵旋转的狂风
  rationale: 将连接词理解为进一步说明前述暴风；“旋转”体现התפעל形态所描绘的剧烈回旋，“狂风”保留强化效果。
- source_word: עַל רֹאשׁ רְשָׁעִים
  choice: 在恶人的头上
  rationale: 保留希伯来文单数“头”与复数集合称谓“恶人”的表达，不额外限定人数。
- source_word: יָחוּל
  choice: 必旋落
  rationale: 与前面的מִתְחוֹלֵל保持词根和风暴回旋意象的联系；“落”同时表达风暴临到恶人的方向与冲击。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；译作“雅威”保留专名指称，也避免用称号替代。
- issue: 完成式יָצְאָה的时态与修辞
  choice: 已经刮起
  alternative: 必将刮起
  rationale: 保留先知性宣告把未来而确定的审判说成已经发动的张力，不将其单纯改写为将来时。
- issue: 末尾动词יָחוּל的意象
  choice: 必旋落
  alternative: 必猛然袭击
  rationale: 原词可能兼有回旋和猛烈临到之意；正文优先保留与前一分词的词根呼应，脚注说明冲击性的另一理解。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。“看哪”保留先知宣告的突发感；“暴风—狂风—旋落”维持原文连续而强烈的风暴意象。
