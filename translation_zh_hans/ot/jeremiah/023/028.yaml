base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/028.yaml
  text: Let the prophet who has a dream tell the dream[a], but let the one who has my word speak my word truthfully[b]. What is straw to grain? declares Yahweh.
translation:
  language: zh_hans
  text: 有梦的先知，就让他讲述那梦；有我的话的人，就让他忠实地传讲我的话。[a]禾秆怎能与谷粒相比呢？[b]这是耶和华的宣告。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“要真实地传讲我的话”，又或：“传讲我真实的话。”希伯来文可能强调传讲的方式真实可信，也可能强调这话本身是真实的。
    reason: lexical_alternative
  - marker: b
    text: 或译：“禾秆与谷粒有什么相干呢？”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנָּבִיא אֲשֶׁר אִתּוֹ חֲלוֹם
  choice: 有梦的先知
  rationale: 保留定冠词所表达的类别性用法，并将“梦与他同在”的希伯来语习语自然译为“有梦”。
- source_word: יְסַפֵּר חֲלוֹם
  choice: 讲述那梦
  rationale: ספר的Piel词形在此意为讲述、述说；“那梦”自然指前句所说的梦。
- source_word: וַאֲשֶׁר דְּבָרִי אִתּוֹ
  choice: 有我的话的人
  rationale: 自然表达“我的话与他同在”，并与前面的“有梦的先知”形成平行和对比。
- source_word: יְדַבֵּר דְּבָרִי אֱמֶת
  choice: 忠实地传讲我的话
  rationale: 将אֱמֶת理解为修饰传讲方式的副词性成分；“忠实地”兼具如实、不篡改之意。原文也可能强调“话”本身为真实，故以脚注保留歧义。
- source_word: מַה לַתֶּבֶן אֶת הַבָּר
  choice: 禾秆怎能与谷粒相比呢
  rationale: תֶּבֶן是禾秆、秸秆，并非特指糠秕；בָּר是谷粒或净谷。此译保留农业比喻，并自然表达两者不可同日而语。
- source_word: נְאֻם יְהוָה
  choice: 这是耶和华的宣告
  rationale: 以庄重而现代的汉语呈现先知书常见的神谕公式，并明确保留神名。
theological_decisions:
- issue: 梦与耶和华之话之间的对比
  choice: 将两小句译为许可／命令式的鲜明对照：讲梦者讲梦，领受神话语者则须忠实传讲。
  alternative: 把连接词仅译为中性的“而”，弱化上下文中的对比。
  rationale: 本章上下文将欺骗人的梦与耶和华真实的话相对照，末尾禾秆与谷粒的比喻也支持这一对比；译文不进一步断言所有梦本身都属虚假。
- issue: אֱמֶת所修饰的对象
  choice: 正文按副词理解为“忠实地传讲”。
  alternative: 译作“传讲我真实的话”或“按真理传讲我的话”。
  rationale: 希伯来语可强调传讲的忠实方式，也可能强调话语本身的真实性；正文采用较自然的副词读法，并用脚注保存另一可能。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“禾秆／谷粒”准确保留原文的农作物意象，避免误译为“糠秕／麦子”。脚注标记均置于正文相关位置。
