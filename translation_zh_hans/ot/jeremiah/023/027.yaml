source:
  edition: WLC
  text: הַ/חֹשְׁבִ֗ים לְ/הַשְׁכִּ֤יחַ אֶת עַמִּ/י֙ שְׁמִ֔/י בַּ/חֲל֣וֹמֹתָ֔/ם אֲשֶׁ֥ר יְסַפְּר֖וּ אִ֣ישׁ לְ/רֵעֵ֑/הוּ כַּ/אֲשֶׁ֨ר שָׁכְח֧וּ אֲבוֹתָ֛/ם אֶת שְׁמִ֖/י בַּ/בָּֽעַל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/027.yaml
  text: who plan to make my people forget my name by their dreams that they tell[a], each man to his neighbor[b], just as their fathers forgot my name because of Baal.
translation:
  language: zh_hans
  text: 他们图谋借着他们各人向同伴讲述的梦[a]，使我的子民忘记我的名，正如他们的祖先因巴力[b]忘记了我的名。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在他们各人向同伴讲述的梦中。”希伯来语介词既可表示手段，也可表示所处范围。
    reason: lexical_alternative
  - marker: b
    text: “因巴力”也可译作“为了巴力”或“借着巴力”。这里很可能是说，他们因敬奉巴力而忘记了耶和华的名。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחֹשְׁבִים
  choice: 他们图谋
  rationale: 此处分词表达蓄意的打算；“图谋”既保留主动谋划之意，也符合假先知受责备的语境。
- source_word: לְהַשְׁכִּיחַ
  choice: 使……忘记
  rationale: שׁכח 的使役式不定词明确表示使人遗忘；“使……忘记”准确保留使役含义。
- source_word: עַמִּי
  choice: 我的子民
  rationale: 保留原文第一人称所属关系；“子民”自然呈现上帝与其百姓的立约关系。
- source_word: שְׁמִי
  choice: 我的名
  rationale: 两处均直译为“我的名”，保留上帝所启示之身份及立约意义，不以解释性措辞取代。
- source_word: בַּחֲלֹמוֹתָם
  choice: 借着……的梦
  rationale: 介词 ב 可表示手段，也可表示范围；正文按上下文译作手段义，同时以脚注保留另一可能。
- source_word: אֲשֶׁר יְסַפְּרוּ
  choice: 讲述的
  rationale: ספר 的加强式在此指讲述、转述梦；“讲述”符合现代汉语，并保留口头传播的语境。
- source_word: אִישׁ לְרֵעֵהוּ
  choice: 彼此
  rationale: 希伯来语惯用分配结构，意思是一个人向同伴讲、互相传讲；汉语“彼此”自然准确，且不额外限定现代社会意义上的邻居。
- source_word: כַּאֲשֶׁר
  choice: 正如
  rationale: 明确引出当前图谋与祖先遗忘上帝之名之间的类比。
- source_word: שָׁכְחוּ אֲבוֹתָם
  choice: 他们的祖先……忘记了
  rationale: אָבוֹת 在代际回顾中泛指先辈；“祖先”比直译“父亲们”更符合现代汉语，同时保留群体历史指向。
- source_word: בַּבָּעַל
  choice: 因巴力
  rationale: 此处 ב 可表达原因、关联或凭借；正文以简洁的原因义呈现敬奉巴力导致遗忘耶和华之名，同时脚注保留其他理解。
theological_decisions:
- issue: “我的名”的立约含义
  choice: 两处均保留“我的名”
  alternative: 我的声名；我是谁
  rationale: 原文明确使用“名”，直译能保留上帝所启示身份及立约归属的神学分量，不在正文中作解释性改写。
- issue: אִישׁ לְרֵעֵהוּ 的分配表达
  choice: 彼此讲述
  alternative: 各人向同伴讲述；一个人向邻舍讲述
  rationale: “彼此”自然表达原文逐人相传的分配与相互关系，不把 רֵעַ 过度限定为地理意义上的邻居。
- issue: בַּבָּעַל 的因果与关联含义
  choice: 因巴力
  alternative: 为了巴力；借着巴力；在巴力的事上
  rationale: 上下文所责备的是对巴力的归附使祖先忘记上帝的名；“因巴力”清楚传达主要理解，脚注则保留介词本身的语义张力。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“图谋”体现蓄意性；“子民”和“我的名”保留先知文本的立约语气。句序略作汉语化处理，将“彼此讲述”嵌入“梦”的修饰结构，同时保留原文的因果链和历史类比。
