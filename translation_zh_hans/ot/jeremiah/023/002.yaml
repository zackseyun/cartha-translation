revisions:
- from: 因此，雅威——以色列的上帝——论到[a]那些牧养我子民的牧人如此说：“你们使我的羊群四散，又把他们赶走，却没有过问他们。看哪，我要过问你们，追究你们行为中的恶[b]。”这是雅威的宣告。
  to: 因此，雅威——以色列的上帝——论到[a]那些牧养我子民的牧人如此说：“你们使我的羊群四散，把它们赶走，却没有过问它们。看哪，我要因你们恶劣的行为而过问你们。”这是雅威的宣告。
  rationale: 修订集中于保留פקד在两处的同词重复，并使其后的审判根据以“因……而”表达，避免正文新增第二个对应原文中没有的谓语。同步将“行为中的恶”改为更自然的“恶劣的行为”，并使“羊群”的代词保持意象一致。脚注b随正文代词及句式更新，仍说明双关与惩罚含义。
