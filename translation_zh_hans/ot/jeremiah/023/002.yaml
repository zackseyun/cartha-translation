source:
  edition: WLC
  text: לָ֠/כֵן כֹּֽה אָמַ֨ר יְהוָ֜ה אֱלֹהֵ֣י יִשְׂרָאֵ֗ל עַֽל הָ/רֹעִים֮ הָ/רֹעִ֣ים אֶת עַמִּ/י֒ אַתֶּ֞ם הֲפִצֹתֶ֤ם אֶת צֹאנִ/י֙ וַ/תַּדִּח֔וּ/ם וְ/לֹ֥א פְקַדְתֶּ֖ם אֹתָ֑/ם הִנְ/נִ֨י פֹקֵ֧ד עֲלֵי/כֶ֛ם אֶת רֹ֥עַ מַעַלְלֵי/כֶ֖ם נְאֻם יְהוָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/002.yaml
  text: 'Therefore this is what Yahweh[a], the God of Israel, says concerning the shepherds who shepherd my people: You have scattered my flock and driven them away, and you have not attended to them. Behold, I am about to attend to you for the evil of your deeds[b], declares Yahweh.'
translation:
  language: zh_hans
  text: 因此，雅威——以色列的上帝——论到[a]那些牧养我子民的牧人如此说：“你们使我的羊群四散，把它们赶走，却没有过问它们。看哪，我要因你们恶劣的行为而过问你们。”这是雅威的宣告。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “论到”也可译作“针对”；这个介词可引出对牧人的敌对性宣告。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语中接近“Yahweh”的通行音译呈现上帝的专名，不以称号代替；全节两处保持一致。
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: 以色列的上帝
  rationale: 自然呈现希伯来语的属格结构，表明雅威与以色列的关系。
- source_word: עַל
  choice: 论到
  rationale: 该介词在先知宣告中可表示“论到”，也可能带有“攻击、针对”的敌对意味；正文保留较宽泛的表达，审判语气由下文明确。
- source_word: הָרֹעִים הָרֹעִים אֶת עַמִּי
  choice: 那些牧养我子民的牧人
  rationale: 保留“牧人／牧养”的同根重复和牧羊隐喻，不直接解释为“领袖”。
- source_word: הֲפִצֹתֶם אֶת צֹאנִי וַתַּדִּחוּם
  choice: 你们使我的羊群四散，又把他们赶走
  rationale: 体现两个使役动作：使羊群分散，并迫使他们离开；“羊群”保留全段核心意象。
- source_word: פְקַדְתֶּם ... פֹקֵד
  choice: 过问……过问
  rationale: 希伯来语在疏于照料与上帝施行审判两处重复同一动词。汉语用“过问”同时容纳关注、干预和查究的语义，并以“追究”明确第二处的惩罚意味。
- source_word: רֹעַ מַעַלְלֵיכֶם
  choice: 你们行为中的恶
  rationale: 保留“行为之恶”的结构，指出受审判的是牧人行为中的邪恶，而不只笼统称其为恶人。
- source_word: נְאֻם יְהוָה
  choice: 这是雅威的宣告
  rationale: 以庄重而自然的现代汉语呈现固定的先知宣告公式。
theological_decisions:
- issue: פקד在疏忽照料与审判中的双关和反转
  choice: 正文两处均译为“过问”，第二处加“追究你们行为中的恶”明确审判意义。
  alternative: 第一处译“看顾”，第二处译“惩罚”或“追究”。
  rationale: 同词复现构成刻意反转：牧人没有照料羊群，上帝便要介入查究牧人。统一译词保存修辞联系，同时避免模糊审判性质。
- issue: “牧人”是否解释为政治或宗教领袖
  choice: 保留“牧人／牧养”的比喻。
  alternative: 译作“领袖”“统治者”或“首领”。
  rationale: 原文并未在本节限定具体职分，而牧羊意象对上下文十分重要；直译可保留其适用范围及神学张力。
- issue: עַל的中性或敌对方向
  choice: 正文译“论到”，脚注说明也可理解为“针对”。
  alternative: 正文直接译“攻击”或“针对”。
  rationale: 介词本身允许两种理解；下文的责备与审判已显出敌对方向，无须在正文中排除较宽的句法含义。
translation_notes:
  register: 采用庄重、清晰的现代标准汉语。“看哪”保留先知宣告的郑重和临近行动感；“这是雅威的宣告”保持经文公式感。标点以引号区分上帝的直接发言。
