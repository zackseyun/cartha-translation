    rationale: בְּבֵיתִי 的字面意思是“在我的家中”。它在本处确实指圣殿，但正文可保留原文意象，所指则由脚注交代；这也与英文 POB 审校决定一致。
  - severity: low
    issue: 脚注 a 的“亵渎神圣”措辞不完整，“受到玷污”则不必要地使用被动表达。
    rationale: 这些译语不够自然、也未最佳反映该动词描述主体宗教—道德败坏的用法。
