  source_fidelity: 正文将 בְּבֵיתִי 直接译为“我的殿中”，虽符合其所指的圣殿，却未保留原文“我的家”的措辞；英文审校轨迹也明确保留该字面表达。因此宜将正文改为“我的家中”，并以脚注说明其指圣殿。其余主要对应关系准确：כִּי 的解释性连接、三次 גַּם 的涵义、先知与祭司的并列、他们的恶，以及神谕公式均得到保留。
  naturalness: 修订后的“就连在我的家中，我也发现了他们的恶行”在现代标准汉语中通顺且庄重。“不敬虔”属于通行的圣经语体，适合本段先知性谴责；“这是雅威的宣告”自然地表达 נְאֻם יְהוָה。
  terminology: “先知”“祭司”“雅威”均恰当且前后一致。脚注 a 原有“亵渎神圣”表达略显不完整，修订为“亵渎神圣之物”，并将“受到玷污”的被动说法调整为“污秽”，以更贴近 חָנֵפוּ 所含的亵渎、污秽或不敬神的语义范围。
