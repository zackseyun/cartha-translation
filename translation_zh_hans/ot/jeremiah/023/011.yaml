id: JER.23.11
reference: Jeremiah 23:11
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כִּֽי גַם נָבִ֥יא גַם כֹּהֵ֖ן חָנֵ֑פוּ גַּם בְּ/בֵיתִ֛/י מָצָ֥אתִי רָעָתָ֖/ם נְאֻם יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/011.yaml
  text: For both prophet and priest are ungodly[a]; even in my house I have found their evil[b], declares Yahweh.
translation:
  language: zh_hans
  text: 因为先知和祭司都不敬虔[a]；就连在我的家中，我也发现了他们的恶行[b]。这是雅威的宣告。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“亵渎神圣之物”“污秽”或“虚伪”。这个希伯来语动词表示道德和宗教上的败坏或不敬神。
    reason: lexical_alternative
  - marker: b
    text: “我的家”指圣殿。
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，为先前所宣告的审判说明缘由，保留其解释性连接作用。
- source_word: גַם נָבִיא גַם כֹּהֵן
  choice: 先知和祭司都
  rationale: 两个 גַם 构成并列强调，表明先知、祭司两类人无一例外都在指控之中。
- source_word: חָנֵפוּ
  choice: 不敬虔
  rationale: 该动词在此指道德与宗教层面的败坏、不敬神；“不敬虔”清楚自然，也避免将含义缩窄为仅仅“虚伪”。
- source_word: גַּם בְּבֵיתִי
  choice: 就连在我的殿中
  rationale: 第三个 גַם 加强语气，表明恶行甚至出现在雅威自己的居所；בֵּיתִי 字面为“我的家”，在语境中指圣殿。
- source_word: מָצָאתִי
  choice: 我也发现了
  rationale: 以完成体过去表达雅威已经察见并确认此事，同时在汉语中保持自然。
- source_word: רָעָתָם
  choice: 他们的恶行
  rationale: רָעָה 在这里指他们所行的道德之恶；“恶行”比孤立的“恶”更符合现代汉语，同时不减弱指控。
- source_word: נְאֻם יְהוָה
  choice: 这是雅威的宣告
  rationale: 保留庄严的先知宣告公式，并直接音译神的专名 יהוה。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；采用“雅威”以保留其专名性质，不以称号替代。
- issue: בְּבֵיתִי 所指的场所
  choice: 我的殿中
  alternative: 我的家中
  rationale: 字面虽是“我的家中”，但说话者为雅威，且上下文涉及祭司，因此所指是圣殿；正文采用自然明确的“殿”，脚注保留字面表达。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。句首“因为”保留与上文的逻辑联系；“就连”呈现第三个 גַם 的递进强调；结尾使用独立的宣告公式，体现先知话语的郑重语气。
