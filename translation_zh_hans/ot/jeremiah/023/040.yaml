  text: וְ/נָתַתִּ֥י עֲלֵי/כֶ֖ם חֶרְפַּ֣ת עוֹלָ֑ם וּ/כְלִמּ֣וּת עוֹלָ֔ם אֲשֶׁ֖ר לֹ֥א תִשָּׁכֵֽחַ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/040.yaml
  text: And I will put on you everlasting reproach and everlasting disgrace[a], which will not be forgotten.
translation:
  language: zh_hans
  text: 我要使你们永远受辱、永远蒙羞；这羞耻必不被遗忘。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְנָתַתִּי
  choice: 我要使
  rationale: נתן与介词“在你们身上”及抽象宾语连用，表达把某种羞辱加在受话者身上。汉语用“使……受/蒙……”比直译“放在你们身上”自然，也保留施加审判的语义。
- source_word: עֲלֵיכֶם
  choice: 使你们……
  rationale: עַל加第二人称复数后缀表示羞辱临到受话者；其关系在汉语使役结构中体现，无须机械译作“在你们身上”。
- source_word: חֶרְפַּת
  choice: 受人辱骂
  rationale: חֶרְפָּה可指责骂、凌辱及由此产生的公开羞耻。译作“受人辱骂”突出外界加诸他们的责难，并与后面的“蒙羞”保持区别。
- source_word: עוֹלָם
  choice: 永远
  rationale: עוֹלָם表示长久持续乃至无尽；“永远”在现代汉语中庄重自然，同时其具体时限仍由上下文决定。
- source_word: וּכְלִמּוּת
  choice: 永远蒙羞
  rationale: כְּלִמּוּת指羞耻、耻辱或受辱状态；“蒙羞”简洁地表达这种结果，并与前面的公开辱骂形成相关而不完全重复的概念。
- source_word: אֲשֶׁר
  choice: 这是
  rationale: 关系词引出对前述永久辱骂和羞耻的说明。汉语以“这是”承接整体，比生硬的关系从句更自然。
- source_word: לֹא תִשָּׁכֵחַ
  choice: 不会被遗忘
  rationale: שׁכח的Niphal未完成式为被动意义“被遗忘”；“不会被遗忘”准确保留其被动表达及将来取向。
theological_decisions:
- issue: 审判宣告中עוֹלָם的力度
  choice: 永远
  alternative: 长久／永久
  rationale: 上下文强调持续且不可忘却的羞辱。“永远”保留原文庄严而强烈的措辞，但脚注说明该词也可按语境表示持续不止或期限未定，避免把词义范围化约为单一教义结论。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“受人辱骂／蒙羞”区分חֶרְפָּה的外在责骂与כְּלִמּוּת的羞耻状态；分号使末句自然地总括前述两项审判。
