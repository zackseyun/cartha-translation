- from: “那些毁坏、驱散我草场之羊的牧人有祸了！”这是雅威的宣告。[a]
  to: “那些毁坏、驱散我草场的羊群的牧人有祸了！”——雅威的宣告。[a]
  rationale: 修订仅改善现代汉语的自然度和神谕公式的庄重简洁性。“我草场的羊群”保留מַרְעִיתִי（“我的草场”）与צֹאן（集合性的“羊/羊群”）所构成的牧养图像，不将“牧人”解释为领袖，也不把羊群直接改译为百姓。
