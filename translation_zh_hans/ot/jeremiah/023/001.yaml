  text: ה֣וֹי רֹעִ֗ים מְאַבְּדִ֧ים וּ/מְפִצִ֛ים אֶת צֹ֥אן מַרְעִיתִ֖/י נְאֻם יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/001.yaml
  text: Woe to the shepherds who are destroying and scattering the sheep of my pasture[a], declares Yahweh.
translation:
  language: zh_hans
  text: “那些毁坏、驱散我草场的羊群的牧人有祸了！”——雅威的宣告。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “羊群”也可译作“羊”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹי
  choice: 有祸了
  rationale: 该感叹词在此发出先知性的谴责与审判警告；“有祸了”自然保留其强烈语气。
- source_word: רֹעִים
  choice: 牧人
  rationale: 直译为“牧人”。经文以此比喻统治者或领袖，正文保留原有牧养意象，不直接释作“领袖”。
- source_word: מְאַבְּדִים
  choice: 毁坏
  rationale: 使役词干的分词表达持续或惯常的行动；“毁坏”保留其严重性，并与“驱散”形成并列。
- source_word: וּמְפִצִים
  choice: 驱散
  rationale: 该使役分词指使羊群四散；“驱散”既体现外力作用，也符合牧人反而伤害羊群的语境。
- source_word: אֶת צֹאן
  choice: 羊
  rationale: צֹאן可指羊群或小型牲畜；在牧人意象中译作“羊”具体鲜明，同时脚注保留“羊群”这一可能表达。
- source_word: מַרְעִיתִי
  choice: 我草场之
  rationale: 名词意为“草场、牧场”，带第一人称单数后缀。译文保留“我的草场”所表达的归属与牧养意象。
- source_word: נְאֻם יְהוָה
  choice: 这是雅威的宣告
  rationale: 这是庄严的先知公式；“宣告”比一般的“说”更能体现其神谕语体。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见音译呈现四字神名，保留其作为以色列之神专名的性质，而不以称号代替。
theological_decisions:
- issue: 牧人和羊的比喻
  choice: 正文保留“牧人”“羊”和“草场”的完整牧养意象。
  alternative: 解释性译作“领袖”“人民”或“我所照管的百姓”。
  rationale: 希伯来文明确采用牧养意象，这一意象对本章及更广泛的圣经脉络具有文学和神学意义；直接解释会削弱原文张力。
- issue: “我的草场”与羊群归属的关系
  choice: 译作“我草场之羊”，让草场直接带第一人称所属关系。
  alternative: 译作“我的羊群”或“我所牧养的羊”。
  rationale: 原文第一人称后缀附在“草场”上，而非“羊”上；正文尽量保留这一语法和意象，不将其明确化为原文没有直接说出的关系。
translation_notes:
  register: 采用现代、庄重而清楚的先知宣告语体。“有祸了”置于句末，符合自然汉语的谴责句式；保留“牧人—羊—草场”的连贯比喻。
