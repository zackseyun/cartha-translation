  text: כִּ֣י מִ֤י עָמַד֙ בְּ/ס֣וֹד יְהוָ֔ה וְ/יֵ֖רֶא וְ/יִשְׁמַ֣ע אֶת דְּבָר֑/וֹ מִֽי הִקְשִׁ֥יב דבר/י וַ/יִּשְׁמָֽע־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/018.yaml
  text: For who has stood in the council of Yahweh[a], that he should see and hear his word? Who has paid attention to my word and heard it?
translation:
  language: zh_hans
  text: 因为谁曾站在耶和华的议事会中[a]，得以看见并听见他的话呢？谁曾留心听我的话，并听见了呢？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “议事会”也可译作“密议”或“亲密商议”。希伯来语 סוֹד 可指秘密或亲密的商议，也可指参与这种商议的议事会或群体。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，为先前的指控提出反问式依据；“因为”在现代汉语中自然保留论证关系。
- source_word: עָמַד
  choice: 曾站在
  rationale: 表达已经进入并置身其中的经历；“曾”适合汉语反问语境，也保留完成体的意味。
- source_word: בְּסוֹד
  choice: 在……的议会中
  rationale: 本段先知论战的语境指向进入耶和华议事的会中；同时以脚注保留“密议、亲密商议”等词义可能。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代简体中文圣经传统中广为人知的神名译法。
- source_word: וְיֵרֶא
  choice: 得以看见
  rationale: 将未完成式理解为站在议会中所产生的结果或获得的资格，且与后面的“听见”构成感官动词对。
- source_word: וְיִשְׁמַע
  choice: 并听见
  rationale: 保留“看见—听见”的并列结构和先知领受启示的意象。
- source_word: דְּבָרוֹ
  choice: 他的话
  rationale: “话”保留 דָּבָר 的言语与启示意味，并避免过早限定为某一种信息形式。
- source_word: הִקְשִׁיב
  choice: 留心听
  rationale: 体现使役词干在此所表达的专注倾听，比单纯“听见”更强，又符合现代汉语。
- source_word: דברי
  choice: 我的话
  rationale: 按马所拉文本的辅音及语境保留第一人称神谕，并显出前句“他的话”转为直接说话者“我的话”的人称变化。
- source_word: וַיִּשְׁמָע
  choice: 并且听见了
  rationale: 延续本节反复出现的听见主题，不擅自将其解释为“顺从”；“了”表达动作达成。
theological_decisions:
- issue: סוֹד יְהוָה 的含义
  choice: 耶和华的议会
  alternative: 耶和华的密议／亲密商议
  rationale: 先知论战的焦点是虚假先知是否进入耶和华的议事圈、亲自领受他的话。“议会”较清楚地保留神圣会议的图像，但原词也可指秘密或亲密的商议，因此用脚注保留歧义。
- issue: “看见并听见”与“站在议会中”的关系
  choice: 译为结果或资格：“得以看见并听见”
  alternative: 简单并列：“又看见、又听见”
  rationale: 此译法在汉语中自然表达进入议会后所获得的启示经验，但不进一步界定所“看见”的具体对象，以免消解原文张力。
- issue: 末句 שׁמע 是否包含顺服之意
  choice: 听见
  alternative: 听从／顺服
  rationale: 上下文的重复首先构成“听”的语义链；虽然 שׁמע 有时可指听从，本节并不要求明确译成顺服。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“耶和华的议会”保留先知获准进入神圣议事圈的意象；两个反问句结构清楚，并保留“他的话”转为“我的话”的原文人称变化。所有脚注标记均已置于正文。
