  to: 因为谁曾站在耶和华的议事会中[a]，得以看见并听见他的话呢？谁曾留心听我的话，并听见了呢？
  rationale: 将“议会”改为“议事会”，避免现代汉语中政治立法机关的强烈联想，并更贴近本节关于进入耶和华神圣议事/密议圈的语境。脚注保留 סוֹד 的“密议、亲密商议”义项及其可指参与者群体的含义。其余措辞维持原文的反问力度、看见与听见的并列，以及“他的话／我的话”的人称转换。
