  naturalness: “行奸淫的人”“旷野的草场”自然且庄重。“这地悲哀”可理解，但“哀伤”更合现代汉语中拟人化主语的谓语习惯。“他们的奔走是邪恶的”“他们的能力也不正”略显生硬；以“行径”和“权势并不正当”可在不消除原文简略性的前提下改善可读性。
  terminology: “行奸淫的人”忠实保留了 מְנָאֲפִים 的字面伦理指控，不应径直改释为“背信的人”。אָלָה 正文译“咒诅”合乎语境，脚注保留“誓言／带咒诅的誓言”的词义可能。将 גְבוּרָתָם 译为“权势”在此谴责性语境中自然，但脚注应说明其基本义也可为“力量”或“能力”。
