id: JER.23.10
reference: Jeremiah 23:10
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כִּ֤י מְנָֽאֲפִים֙ מָלְאָ֣ה הָ/אָ֔רֶץ כִּֽי מִ/פְּנֵ֤י אָלָה֙ אָבְלָ֣ה הָ/אָ֔רֶץ יָבְשׁ֖וּ נְא֣וֹת מִדְבָּ֑ר וַ/תְּהִ֤י מְרֽוּצָתָ/ם֙ רָעָ֔ה וּ/גְבוּרָתָ֖/ם לֹא כֵֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/010.yaml
  text: For the land is full of adulterers[a]; because of the curse the land mourns, and the pastures of the wilderness are dried up. Their course is evil[c][b], and their might is not right.
translation:
  language: zh_hans
  text: 因为这地满了行奸淫的人；因这咒诅[a]，这地哀伤，旷野的草场也都枯干。他们的行径[b]邪恶，他们的权势也并不正当[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “咒诅”也可译作“誓言”或“带咒诅的誓言”；希伯来语 אָלָה 可有这些含义。
    reason: lexical_alternative
  - marker: b
    text: “行径”也可理解为“奔走”“所走的路”；这个词在此比喻他们的行为方式。
    reason: lexical_alternative
  - marker: c
    text: “权势”也可译作“力量”或“能力”。原文十分简略，也可理解为“并非如此”或“不正直”。
    reason: lexical_alternative
lexical_decisions:
- source_word: מְנָאֲפִים
  choice: 行奸淫的人
  rationale: 该复数分词直接指惯于或正在犯奸淫的人；用这一表达保留字面上的道德指控，也不排除耶利米书语境中更广泛的不忠含义。
- source_word: מָלְאָה הָאָרֶץ
  choice: 这地满了
  rationale: 本段语境聚焦犹大之地，因此将 אֶרֶץ 译为“这地”，比泛指“全地”或“世界”更自然。
- source_word: מִפְּנֵי אָלָה
  choice: 因受咒诅
  rationale: אָלָה 可指誓言、带咒诅的誓言或咒诅本身；下文土地悲哀、草场枯干，较支持咒诅及其后果这一语义。
- source_word: אָבְלָה
  choice: 悲哀
  rationale: 保留土地拟人化的哀悼意象，不将其简化为单纯的干旱。
- source_word: יָבְשׁוּ
  choice: 都枯干
  rationale: 表达草场已经进入枯干状态；“都”自然呈现复数草场的整体景象。
- source_word: נְאוֹת מִדְבָּר
  choice: 旷野的草场
  rationale: נְאוֹת 指牧放之地或草场，מִדְבָּר 在此更宜译为“旷野”，不必理解为纯沙漠。
- source_word: מְרוּצָתָם
  choice: 他们的奔走
  rationale: 保留源自动词“奔跑”的名词意象，同时让其在语境中指向人的行为进路；其确切比喻范围以脚注说明。
- source_word: רָעָה
  choice: 是邪恶的
  rationale: 该形容词在此具有明确的伦理判断，“邪恶”比一般的“不好”更准确。
- source_word: גְבוּרָתָם
  choice: 他们的能力
  rationale: גְבוּרָה 可指力量、能力或勇力；“能力”在现代汉语中自然，并能涵盖其施展出来的势力。
- source_word: לֹא כֵן
  choice: 也不正
  rationale: 希伯来语表达简短且有所省略；“不正”保留道德否定，也避免把具体含义过度限定为“不公义”或“使用不当”。
theological_decisions:
- issue: “行奸淫的人”是按字面理解，还是直接解释为对圣约不忠的人
  choice: 正文按字面译为“行奸淫的人”
  alternative: 不忠的人
  rationale: 原词直接表示犯奸淫者；正文保留其本义，让先知语境本身承载可能存在的圣约不忠意蕴，而不替读者预先消解这层张力。
- issue: אָלָה 在本节指誓言还是咒诅
  choice: 正文译为“受咒诅”
  alternative: 因誓言；因带咒诅的誓言
  rationale: 土地悲哀和草场枯干更直接呈现咒诅的后果，但该词确有誓言方面的语义，因此在脚注中保留另一可能。
- issue: לֹא כֵן 的省略含义
  choice: 译为“也不正”
  alternative: 并非如此；不正直；使用得不当
  rationale: 原文没有明确补出力量在哪一方面“不如此”；采用简短的“不正”保存其道德批判和原文的含混性。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“行奸淫的人”保留先知话语的直接力度；“这地悲哀”保留拟人意象；末句刻意简洁，以反映希伯来原文的凝练和省略。
