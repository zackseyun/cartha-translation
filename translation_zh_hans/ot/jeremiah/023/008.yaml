language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כִּ֣י אִם חַי יְהוָ֗ה אֲשֶׁ֣ר הֶעֱלָה֩ וַ/אֲשֶׁ֨ר הֵבִ֜יא אֶת זֶ֨רַע בֵּ֤ית יִשְׂרָאֵל֙ מֵ/אֶ֣רֶץ צָפ֔וֹנָ/ה וּ/מִ/כֹּל֙ הָֽ/אֲרָצ֔וֹת אֲשֶׁ֥ר הִדַּחְתִּ֖י/ם שָׁ֑ם וְ/יָשְׁב֖וּ עַל אַדְמָתָֽ/ם־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/008.yaml
  text: but[a], ‘As Yahweh lives[d][c][b], who brought up and who brought in the offspring of the house of Israel from the land of the north and from all the lands where I had driven them,’ and they shall dwell on their own soil.
translation:
  language: zh_hans
  text: 而是：“雅威[a]永活！他曾把以色列家的后裔[b]从北方之地领上来，又从我曾赶逐他们到的各地带回来。”他们必住在自己的土地[c]上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “雅威”是希伯来文神名 יהוה（YHWH）的音译；传统译作“耶和华”，也常以“主”代称。
    reason: alternative_reading
  - marker: b
    text: “后裔”直译为“种子”，在这里集合性地指以色列家的子孙。
    reason: lexical_alternative
  - marker: c
    text: 或译：“自己的地土”。原词侧重泥土、地面或土地。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: 而是
  rationale: 承接上一节，表示新的起誓用语取代旧的用语；“而是”自然地传达纠正和替代关系。
- source_word: חַי יְהוָה
  choice: 永活的雅威
  rationale: 这是希伯来语庄严的起誓公式。中文以“永活的……”表达凭其生命起誓的惯用含义，同时保留原文的郑重语气。
- source_word: יְהוָה
  choice: 雅威
  rationale: 音译四字神名，保留其作为以色列之神专名的性质，而不以称号代替。
- source_word: הֶעֱלָה
  choice: 领上来
  rationale: 使役形表示“使上来、领上来”，并与出埃及及归回的语言形成呼应。
- source_word: הֵבִיא
  choice: 领回来
  rationale: 基本义为“带来、领入”；按本节归回故土的语境译作“领回来”，同时与前面的“领上来”有所区别。
- source_word: זֶרַע בֵּית יִשְׂרָאֵל
  choice: 以色列家的后裔
  rationale: זֶרַע在此为集合意义，指后代；“以色列家”保留原文的民族与盟约称谓。
- source_word: מֵאֶרֶץ צָפוֹנָה
  choice: 从北方之地
  rationale: 保留耶利米书中“北方”兼具地理和流亡背景的表达，且贴近原文。
- source_word: וּמִכֹּל הָאֲרָצוֹת
  choice: 又从……各国
  rationale: 原文为复数“众地”；中文“各国”在离散语境中更自然，但不要求现代民族国家的严格含义。
- source_word: אֲשֶׁר הִדַּחְתִּים שָׁם
  choice: 我赶逐他们去的
  rationale: 保留神为施事者以及动词“赶散、赶逐”的力度，不弱化为被动迁徙。
- source_word: וְיָשְׁבוּ
  choice: 他们必住
  rationale: 表达预告或应许的将来意义；“住”是现代中文中自然且庄重的说法。
- source_word: עַל אַדְמָתָם
  choice: 在自己的土地上
  rationale: אַדָמָה侧重土地、地土；中文“土地”既自然，也保留归回本土的具体性。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；音译为“雅威”保留专名性质，并避免用称号取代。
- issue: 复兴图景同时包含领出与领回
  choice: 分别译为“领上来”和“领回来”
  alternative: 两处均译为“带来”；意译为“拯救并带回”
  rationale: 原文使用两个不同动词，既回响出埃及，也描绘从分散之地归回；分别翻译可保留这一张力而不作解释性扩写。
- issue: 引语中第三人称“他”与第一人称“我”的转换
  choice: 照原文保留“我赶逐他们去”
  alternative: 统一改为“他赶逐他们去”
  rationale: 马所拉文本在同一誓言公式中出现神的第三人称称谓与第一人称发言的转换。译文保留这种突转，不静默协调文本。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以“而是”显示与上一节旧起誓公式的替代关系；保留誓言中的人称突转及“领上来／领回来”的动词区别。所有脚注标记均置于正文相应位置。
