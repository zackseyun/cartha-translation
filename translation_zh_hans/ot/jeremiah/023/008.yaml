  naturalness: 修订后的“而是：‘雅威永活！他曾……’”在现代庄重中文中比“永活的雅威，曾……”更自然清晰。将“我赶逐他们去的各国”改为“我曾赶逐他们到的各地”，语法更顺畅，也更符合书面经文语体。
  terminology: 保留“雅威”作为יהוה的音译；“以色列家”“后裔”“北方之地”“土地”均恰当。“领上来、带回来”保留两个希伯来动词的区别，且不把其神学含义扩写为解释。
