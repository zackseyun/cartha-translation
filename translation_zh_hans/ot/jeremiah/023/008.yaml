- from: 而是：“永活的雅威[a]，曾把以色列家的后裔[b]从北方之地领上来，又从我赶逐他们去的各国领回来。”他们必住在自己的土地[c]上。
  to: 而是：“雅威[a]永活！他曾把以色列家的后裔[b]从北方之地领上来，又从我曾赶逐他们到的各地带回来。”他们必住在自己的土地[c]上。
  rationale: 修订以“雅威永活！”准确而自然地呈现希伯来语誓言公式，并保留原文由第三人称“他”转为第一人称“我”的突转。将“各国”改为“各地”，使其更贴近原文的复数“诸地”；将“赶逐他们去的”调整为“赶逐他们到的”，改善现代书面中文的流畅度。脚注标记仍均置于相应词语之后，脚注集完整。
