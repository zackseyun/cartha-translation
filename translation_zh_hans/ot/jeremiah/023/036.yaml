  text: וּ/מַשָּׂ֥א יְהוָ֖ה לֹ֣א תִזְכְּרוּ ע֑וֹד כִּ֣י הַ/מַּשָּׂ֗א יִֽהְיֶה֙ לְ/אִ֣ישׁ דְּבָר֔/וֹ וַ/הֲפַכְתֶּ֗ם אֶת דִּבְרֵי֙ אֱלֹהִ֣ים חַיִּ֔ים יְהוָ֥ה צְבָא֖וֹת אֱלֹהֵֽי/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/036.yaml
  text: But you shall no longer mention ‘the burden of Yahweh,’ for each man's own word will become his burden[a], and you have twisted the words of the living God, Yahweh of hosts[b], our God.
translation:
  language: zh_hans
  text: 你们不可再提“耶和华的重担”，因为各人自己的话必成为他的重担[a]；你们歪曲了永活的上帝——万军之耶和华、我们的上帝——的话。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “重担”所译的希伯来词也可指先知性的“默示”或“宣告”。这里可能刻意兼用两义：人所说的话反倒成为自己的“重担”。
    reason: lexical_alternative
lexical_decisions:
- source_word: מַשָּׂא
  choice: 重担
  rationale: 此词既可指实际的“重担”，在先知语境中也可指“默示、宣告”。本节刻意利用双关，因此两处均译作“重担”，并用脚注说明另一词义。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代汉语圣经传统中广为人知的神名译法，保留其专名性质，不以“主”这一称号代替。
- source_word: תִזְכְּרוּ
  choice: 提
  rationale: זכר本义可为“记得”，但以引语为宾语时自然表示“提及、说起”；这里禁止人再使用这一说法。
- source_word: הַמַּשָּׂא יִהְיֶה לְאִישׁ דְּבָרוֹ
  choice: 各人自己的话必成为自己的重担
  rationale: 保留原文压缩句式的核心关系及מַשָּׂא的双关，表达人的话反过来成为自己的重担，同时不把其具体后果解释得过满。
- source_word: וַהֲפַכְתֶּם
  choice: 你们歪曲了
  rationale: הפך在此指把话翻转、扭曲。“歪曲”是自然、庄重的现代汉语，并明确传达对上帝话语的恶意变形。
- source_word: אֱלֹהִים חַיִּים
  choice: 永活上帝
  rationale: 保留“活着的上帝”这一神学称谓；“永活”在中文中凝练自然，也避免误解为仅指暂时活着。
- source_word: יְהוָה צְבָאוֹת
  choice: 万军之耶和华
  rationale: 沿用透明且庄重的传统表达，保留צְבָאוֹת所含军旅、众军的意象，不释义为“全能者”。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威；主
  rationale: “耶和华”是简体中文普通读者最熟悉的专名形式，既保留神名，又避免以称号“主”替代；“雅威”更接近学术重构的读音，但普及度较低。
- issue: מַשָּׂא双关的处理
  choice: 两处都译作“重担”
  alternative: 译作“默示”或“信息”，并在第二处改译“重担”
  rationale: 原文的责备依赖同一词的双重意义；重复“重担”最能保存修辞关联，脚注则补足其先知语境中的“默示”义。
- issue: “各人自己的话必成为自己的重担”的含义
  choice: 保留原文含混而不明确补出审判如何临到
  alternative: 译作“各人的话必反过来定自己的罪”
  rationale: 原句可能暗示人的话反过来压在自己身上，但没有明说“定罪”；正文保留张力，避免加入原文未明确表达的司法解释。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“不可再提”体现禁令；“各人自己的话”保留分配意义；末句用“就是……的话”明确同位关系，同时避免中文中连续属格造成生硬。
