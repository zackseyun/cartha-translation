  naturalness: “你们不可再提”及“歪曲”庄重自然。末句改用破折号标出“永活的上帝”与“万军之耶和华、我们的上帝”的同位关系，避免“上帝的话，就是……上帝的话”的重复。将第二个“自己的”改为“他的”，使汉语更顺畅而不损失分配意义。
  terminology: “耶和华”“万军之耶和华”“重担”均恰当；两处重复“重担”有效保存מַשָּׂא在“负担”与先知性“默示/宣告”之间的双关。
