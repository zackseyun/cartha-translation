base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/026.yaml
  text: How long will this be in the heart of the prophets who prophesy falsehood[b][a], and who prophesy the deceit of their own heart?
translation:
  language: zh_hans
  text: 这[a]还要存留在那些预言虚假之事、预言自己心中诡诈之事的先知心里到几时呢？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文用疑问式“有”构成省略表达，较直译可作：“在那些预言虚假之事、预言自己心中诡诈之事的先知心里，有吗……？”这里的“这”和“存留”是按上下文补出的。
    reason: lexical_alternative
lexical_decisions:
- source_word: עַד מָתַי
  choice: 还要……到几时呢
  rationale: 这是带有责问和不耐意味的时间疑问语；此译法自然地表达持续状态及其应当终止的语气。
- source_word: הֲיֵשׁ
  choice: 这还要……存
  rationale: 原文以疑问式存在词构成省略句。中文用“这”和“存”补明上下文隐含的情形，使句子可读，同时以脚注交代较直译的形式。
- source_word: בְּלֵב
  choice: 在……心里
  rationale: “心”在希伯来语中涵盖思想、意向和意志；保留“心里”既符合经文意象，也符合现代汉语表达。
- source_word: נִבְּאֵי הַשָּׁקֶר
  choice: 预言虚假之事的先知
  rationale: 保留该表达的动作与内容，不只将其压缩为一个身份标签；“虚假之事”比单说“虚假”更适合现代汉语。
- source_word: וּנְבִיאֵי תַּרְמִת לִבָּם
  choice: 他们所预言的，是自己心中的诡诈
  rationale: 以中文分句清楚呈现平行成分的谓词意义，并明确这种预言源于他们自己的内心。
- source_word: תַּרְמִת
  choice: 诡诈
  rationale: 该名词指欺骗、奸诈；“诡诈”保留其道德谴责色彩，而不弱化为一般性的错误或幻觉。
- source_word: לִבָּם
  choice: 自己心中的
  rationale: “自己”凸显原文第三人称复数所属关系及其论战重点：预言出自他们自身，而不是出自耶和华。
theological_decisions:
- issue: לֵב 的人论含义
  choice: 心／心里
  alternative: 思想、内心
  rationale: “心”在此不单指情感，也包括思想、意图和意志；保留原文身体意象，不将其窄化为现代认知术语。
- issue: 是否把 נִבְּאֵי הַשָּׁקֶר 压缩为固定称号
  choice: 预言虚假之事的先知
  alternative: 假先知
  rationale: 原文着重于他们预言虚假内容这一行为；展开翻译可保留其动词性和指控重点。
- issue: 如何处理 הֲיֵשׁ 所构成的省略疑问句
  choice: 在正文补出“这……存”，并用脚注说明
  alternative: 按字面译作“先知心里有吗”
  rationale: 原文的省略确实存在，不宜在解释上过度确定；正文以最少补足使中文通顺，脚注则保留其形式上的歧义与张力。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“到几时呢”保留先知书中神圣责问的力度；第二个平行成分拆为短句，以免中文主干过长。脚注标记均置于正文相应词语之后。
