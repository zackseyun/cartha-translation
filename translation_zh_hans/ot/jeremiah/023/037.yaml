base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/037.yaml
  text: 'Thus you shall say to the prophet: ‘What has Yahweh answered you[a], and what has Yahweh spoken?’'
translation:
  language: zh_hans
  text: 你要这样对那先知说：“耶和华回答你什么？耶和华说了什么？”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כֹּה
  choice: 这样
  rationale: 引出规定说法；“这样”自然简洁，并保留希伯来语的指示和命令语气。
- source_word: תֹאמַר
  choice: 你要……说
  rationale: 第二人称阳性单数未完成式在此表达指示；“你要……说”比单纯将来时更符合上下文。
- source_word: אֶל הַנָּבִיא
  choice: 对那先知
  rationale: 保留定冠词和单数形式；现代汉语用“对……说”表达自然。
- source_word: מֶה עָנָךְ יְהוָה
  choice: 耶和华回答了你什么
  rationale: 保留疑问词“什么”和ענה“回答”的基本义；中文不在代词“你”上标示性别，因此正文自然地保留原句所指，却不强行解释词形不一致。
- source_word: וּמַה דִּבֶּר יְהוָה
  choice: 耶和华说了什么
  rationale: דבר取常用义“说、讲话”；与前句平行，同时不把“回答”和“说”合并为同一个动词。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的专名“耶和华”呈现四字神名，而不以“主”这一称号替代。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威；主
  rationale: 原文直接使用神的专名。中文正文采用广为人知且具专名性质的“耶和华”，避免以称号“主”取代；“雅威”是另一种较接近现代学界重构发音的音译。
- issue: עָנָךְ 的第二人称阴性单数形式与 הַנָּבִיא“那先知”的阳性单数形式之间的张力
  choice: 正文译作不标性别的“你”，并以脚注说明词形
  alternative: 按上下文改译成明确的阳性对象，或把先知解释为集体
  rationale: 希伯来文本的词形确有不一致；中文“你”本身不标性别，适合在正文中保留指向上的开放性，而不替原文解决问题。
translation_notes:
  register: 采用现代、庄重而口语可懂的普通话。“你要这样对……说”清楚表达规定性话语；两个直接问句保持原文的平行结构。
