  text: לָ/כֵ֣ן הִנְ/נִ֔י וְ/נָשִׁ֥יתִי אֶתְ/כֶ֖ם נָשֹׁ֑א וְ/נָטַשְׁתִּ֣י אֶתְ/כֶ֗ם וְ/אֶת הָ/עִיר֙ אֲשֶׁ֨ר נָתַ֧תִּי לָ/כֶ֛ם וְ/לַ/אֲבוֹתֵי/כֶ֖ם מֵ/עַ֥ל פָּנָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/039.yaml
  text: Therefore[a], behold, I will surely lift you up and cast you away, you and the city that I gave to you and to your fathers[b], from before my face.
translation:
  language: zh_hans
  text: 所以，看哪，我必定把你们举起，又要把你们，连同我赐给你们和你们祖先的这城，从我面前赶逐[a]。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我必彻底忘记你们”；这里的希伯来文较难，也有人将这一动词理解为“提起带走”。
    reason: alternative_reading
  - marker: b
    text: “从我面前”也可译为“离开我的面前”或“离开我的同在”。
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: 所以
  rationale: 自然表达承接上文的推论与审判后果。
- source_word: הִנְנִי
  choice: 看哪
  rationale: 保留先知宣告中引人注意的庄严语气。
- source_word: וְנָשִׁיתִי אֶתְכֶם נָשֹׂא
  choice: 我必把你们高高举起
  rationale: 依WLC所示马所拉读法处理，并以“高高”传达不定式绝对形的加强作用；与随后“抛弃”形成带有反讽意味的动作组合，也尽量保留与前文“重担/神谕”相关的 נשׂא 文字呼应。
- source_word: וְנָטַשְׁתִּי
  choice: 随后把你们抛弃
  rationale: 表达 נטשׁ 的离弃、扔下之意；“随后”使中文读者不致把“举起”误解为正面高举，同时未改变两个动作的次序。
- source_word: הָעִיר
  choice: 这城
  rationale: 原文仅说“城”，语境指特定之城；中文用“这城”自然体现其特指性而不直接补出“耶路撒冷”。
- source_word: אֲשֶׁר נָתַתִּי לָכֶם וְלַאֲבוֹתֵיכֶם
  choice: 我赐给你们及你们祖先的
  rationale: 保留赐予现今百姓及其祖先的盟约历史背景。
- source_word: מֵעַל פָּנָי
  choice: 从我面前赶走
  rationale: “从我面前”保留原文拟人化的“面”与临在意象；结合 נטשׁ，以“赶走”自然表达司法性的排除。
theological_decisions:
- issue: וְנָשִׁיתִי ... נָשֹׂא 的文本与词义歧义
  choice: 我必把你们高高举起
  alternative: 我必彻底忘记你们；我必把你们提起带走
  rationale: 正文依所给WLC的元音标注，保留 נשׂא“举起/负载”的读法及其与上下文的文字游戏，并让“举起—抛弃”的反讽张力保持可见。由于“彻底忘记”是重要而古老的另一理解，脚注明确列出，不在正文中暗自消解歧义。
- issue: מֵעַל פָּנָי 的临在意象
  choice: 从我面前赶走
  alternative: 赶出我的同在
  rationale: 正文保留“面”的具体意象，不把它完全抽象化为“同在”；脚注提供较顺畅的意义表达。
translation_notes:
  register: 采用现代、庄严而易懂的先知宣告语体。“看哪”保留经文的郑重提示功能；“高高举起，随后……抛弃”刻意保存原文反讽和词义张力。所有脚注标记均已置于正文对应位置。
