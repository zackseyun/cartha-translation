revisions:
- from: 所以，看哪，我必把你们高高举起，随后把你们抛弃[a]；我也必把你们和我赐给你们及你们祖先的这城，从我面前赶走[b]。
  to: 所以，看哪，我必定把你们举起，又要把你们，连同我赐给你们和你们祖先的这城，从我面前赶逐[a]。[b]
  rationale: 修订使“赶逐”作为一个动作同时支配“你们”和“这城”，不再把原文的弃逐重复扩展为两个动作；“连同”明确第二宾语的附加关系。“必定”表达不定式绝对式的强调，而“举起”保留所给WLC读法的文字游戏及其不寻常张力。脚注a保留重要替代读法，脚注b则准确锚定“从我面前”的词义替代。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T07:28:44Z'
