  naturalness: “高高举起，随后把你们抛弃；我也必把你们和……这城，从我面前赶走”的重复主语和双重处置动作不够顺畅。“必定……又要……”及“连同”能更清楚地表达原文的并列和宾语范围。
  terminology: 保留“看哪”、 “祖先”和“从我面前”的庄严先知体与原文意象。“举起”不添加“高高”，避免在有争议的动词上强化正面“高举”含义；以脚注保留“忘记”及“提起带走”的替代理解。
