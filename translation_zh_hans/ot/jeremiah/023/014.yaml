id: JER.23.14
reference: Jeremiah 23:14
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וּ/בִ/נְבִאֵ֨י יְרוּשָׁלִַ֜ם רָאִ֣יתִי שַׁעֲרוּרָ֗ה נָא֞וֹף וְ/הָלֹ֤ךְ בַּ/שֶּׁ֨קֶר֙ וְ/חִזְּקוּ֙ יְדֵ֣י מְרֵעִ֔ים לְ/בִ֨לְתִּי שָׁ֔בוּ אִ֖ישׁ מֵ/רָֽעָת֑/וֹ הָֽיוּ לִ֤/י כֻלָּ/ם֙ כִּ/סְדֹ֔ם וְ/יֹשְׁבֶ֖י/הָ כַּ/עֲמֹרָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/014.yaml
  text: 'And among the prophets of Jerusalem I have seen a horrible thing: committing adultery and walking in falsehood[a]; they have strengthened the hands of evildoers, so that no man turns back from his evil. All of them are to me like Sodom[b], and her inhabitants like Gomorrah.'
translation:
  language: zh_hans
  text: 我在耶路撒冷的先知中看见了骇人的事：他们通奸，在虚假中行事；他们助长作恶者的气焰，以致无人从自己的恶行中回转。[a]在我看来[b]，他们全都像所多玛，城中的居民也像蛾摩拉。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “回转”也可译作“悔改”；原文含有转离恶行的意思。“无人”原文为分配性单数，直译为“没有一人”。
    reason: 说明שוב的悔改意味及איש的分配性单数。
  - marker: b
    text: “在我看来”直译为“对我而言”，表示这是上主对他们的判断。
    reason: 说明לִי的评判性用法，避免被理解为单纯主观印象。
lexical_decisions:
- source_word: וּבִנְבִאֵי יְרוּשָׁלִַם
  choice: 我在耶路撒冷的先知中也
  rationale: ב按群体范围译为“在……中”；句首ו承接上文，以“也”自然表达递进而不强化为转折。
- source_word: שַׁעֲרוּרָה
  choice: 骇人的事
  rationale: 表达该词所含的震骇与道德愤慨，语言庄重且为现代读者易懂。
- source_word: נָאוֹף
  choice: 他们通奸
  rationale: 按其动词性表达实际行为，并补出由上下文明确的复数主语。
- source_word: וְהָלֹךְ בַּשֶּׁקֶר
  choice: 在虚假中行事
  rationale: 保留“在虚假中”的领域性意象，同时以“行事”自然表达הלך所指的生活与行为方式。
- source_word: וְחִזְּקוּ יְדֵי מְרֵעִים
  choice: 他们助长作恶者的气焰
  rationale: 将“使……的手坚强”这一希伯来语习语功能对等地译出，表示鼓励、壮胆并纵容作恶者。
- source_word: לְבִלְתִּי שָׁבוּ אִישׁ מֵרָעָתוֹ
  choice: 以致无人回转，离开自己的恶行
  rationale: לבלתי表达结果；איש为分配性单数，汉语自然译为“无人”；“回转，离开”保留שוב的转向意象及悔改意味。
- source_word: הָיוּ לִי כֻלָּם כִּסְדֹם
  choice: 在我看来，他们全都像所多玛
  rationale: לִי标明这是耶和华的判断，以“在我看来”自然表达；不强行将היו解释为状态变化。
- source_word: וְיֹשְׁבֶיהָ כַּעֲמֹרָה
  choice: 城中的居民也像蛾摩拉
  rationale: 阴性后缀指耶路撒冷；汉语以“城中”明确所指，避免不自然的阴性代词，同时保留全城受评判的含义。
theological_decisions:
- issue: שוב是否明确译作宗教术语“悔改”
  choice: 回转，离开自己的恶行
  alternative: 悔改，离弃自己的恶行
  rationale: 原词在此具有悔改意味，但仍保留具体的“转离”图像；正文不把含义收窄为专门术语，脚注说明其可能译法。
- issue: 所多玛与蛾摩拉的类比范围
  choice: 保持简洁类比，不具体限定罪行
  alternative: 解释为与所多玛、蛾摩拉犯同一种特定罪
  rationale: 本节强调先知与居民的整体邪恶及神的判断，却未把类比限定为某一种罪；译文不加入经文未明说的教义解释。
- issue: הָיוּ是否译为“变得”
  choice: 他们全都像所多玛
  alternative: 他们全都变得像所多玛
  rationale: 完成体可描述已成立的状态，也可能含结果意味；本句重点是神当前的评价，因此不额外强化变化过程。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“骇人的事”“在虚假中行事”保留先知话语的严肃力度；“助长……的气焰”以自然汉语传达希伯来语“使手坚强”的习语意义。专名采用简体中文圣经中通行的“耶路撒冷、所多玛、蛾摩拉”。
