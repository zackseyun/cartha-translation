  to: 我在耶路撒冷的先知中看见了骇人的事：他们通奸，在虚假中行事；他们助长作恶者的气焰，以致无人从自己的恶行中回转。[a]在我看来[b]，他们全都像所多玛，城中的居民也像蛾摩拉。
