source:
  edition: WLC
  text: הִנְ/נִ֥י עַל הַ/נְּבִיאִ֖ם נְאֻם יְהוָ֑ה הַ/לֹּקְחִ֣ים לְשׁוֹנָ֔/ם וַֽ/יִּנְאֲמ֖וּ נְאֻֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/031.yaml
  text: Behold[a], I am against the prophets, declares Yahweh, who take their own tongues and declare, ‘Declaration!’
translation:
  language: zh_hans
  text: “看哪，我与那些先知为敌——雅威宣告——他们动用自己的舌头，宣称：‘神谕！’[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们用自己的舌头说：‘神谕！’”希伯来文十分简短，可能带有讽刺意味，刻画这些先知从自己口中制造出听来颇具权威的话。
    reason: 说明“拿／动用舌头”这一不寻常表达及末尾“神谕”的可能讽刺意味。
lexical_decisions:
- source_word: הִנְנִי
  choice: 看哪，我
  rationale: 保留先知性宣告的郑重语气和第一人称的强调；“看哪”虽较庄重，却仍是现代中文读者熟悉的圣经表达。
- source_word: עַל
  choice: 与……为敌
  rationale: 在“我……对付某人”的固定语境中表示敌对和审判，而非空间意义上的“在……之上”。
- source_word: הַנְּבִיאִם
  choice: 那些先知
  rationale: 原文只称“先知”；上下文表明他们是假先知，但正文不额外加入这一解释性标签。
- source_word: נְאֻם יְהוָה
  choice: 雅威宣告
  rationale: 保留标准的先知宣告公式，并直接音译圣名יהוה为“雅威”。
- source_word: הַלֹּקְחִים לְשׁוֹנָם
  choice: 他们动用自己的舌头
  rationale: “动用”既保留לקח“拿、取”的能动意味，又比生硬的“拿自己的舌头”符合现代汉语；“自己的”凸显话语出于他们自身。
- source_word: וַיִּנְאֲמוּ נְאֻם
  choice: 宣称：‘神谕！’
  rationale: 原文以同根词形成刻意而简短的重复，末尾裸置的“神谕”很可能带讽刺意味；用引语和感叹号保留他们制造权威口吻的效果。
theological_decisions:
- issue: יהוה这一神名的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名；“雅威”较贴近其通常重构的发音，也不把专名改写为称号。
- issue: 是否明确称这些人为“假先知”
  choice: 那些先知
  alternative: 那些假先知
  rationale: 上下文确实谴责他们，但本节希伯来文仅写“先知”；保留原文措辞，避免把上下文判断直接添入正文。
- issue: 末尾נְאֻם是否补成“雅威宣告”
  choice: 神谕
  alternative: “雅威宣告”；“宣告”
  rationale: 末尾原文只有נְאֻם，并无יהוה；不补出神名，以保留其突兀、含混且可能带讽刺的表达。
translation_notes:
  register: 采用庄重而可懂的现代标准普通话。“看哪”和“神谕”保留先知文学的正式语域；破折号标出插入的宣告公式，也使长句层次清楚。
