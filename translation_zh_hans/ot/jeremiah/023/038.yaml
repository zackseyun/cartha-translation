  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/אִם מַשָּׂ֣א יְהוָה֮ תֹּאמֵרוּ֒ לָ/כֵ֗ן כֹּ֚ה אָמַ֣ר יְהוָ֔ה יַ֧עַן אֲמָרְ/כֶ֛ם אֶת הַ/דָּבָ֥ר הַ/זֶּ֖ה מַשָּׂ֣א יְהוָ֑ה וָ/אֶשְׁלַ֤ח אֲלֵי/כֶם֙ לֵ/אמֹ֔ר לֹ֥א תֹאמְר֖וּ מַשָּׂ֥א יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/038.yaml
  text: 'But if you say[a], ‘The burden of Yahweh,’ therefore this is what Yahweh says: Because you have said this word, ‘The burden of Yahweh,’ though I sent to you, saying, ‘You shall not say, “The burden of Yahweh,”’'
translation:
  language: zh_hans
  text: 但如果你们说：“耶和华的重担[a]”，那么耶和华这样说：“因为你们说了‘耶和华的重担’这句话，尽管我曾差遣人到你们那里，吩咐说：‘你们不可说“耶和华的重担”’，”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“耶和华的默示”。希伯来语“玛萨”既可指“重担”，也可指先知性的宣告；正文译作“重担”，以保留本段反复用词所形成的双关。
    reason: 词义备选及双关说明
lexical_decisions:
- source_word: וְאִם
  choice: 但如果
  rationale: 承接上文的禁令并引出与之相反的假设情形，兼顾连接词和条件意味。
- source_word: מַשָּׂא
  choice: 重担
  rationale: 该词既可指负担，也可指先知性宣告；此处反复使用并带有讽刺性双关，译作“重担”可保存这一修辞张力，另以脚注注明“默示”这一语境义。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 直接译出四字神名在现代汉语圣经传统中的通行形式，不以“主”替代。
- source_word: לָכֵן כֹּה אָמַר יְהוָה
  choice: 那么耶和华这样说
  rationale: “那么”清楚标示条件句的结果，“这样说”自然保留先知传信公式。
- source_word: יַעַן אֲמָרְכֶם אֶת הַדָּבָר הַזֶּה
  choice: 因为你们说了……这句话
  rationale: יַעַן引出审判理由；“这句话”准确指向他们所说的特定用语，符合现代汉语表达。
- source_word: וָאֶשְׁלַח אֲלֵיכֶם לֵאמֹר
  choice: 尽管我曾传话给你们说
  rationale: 在上下文中带有让步意味：他们是在已经受警告后仍如此说。“传话”避免补出原文未明说的使者，同时表达“差遣到你们那里说”的惯用含义。
- source_word: לֹא תֹאמְרוּ
  choice: 你们不可说
  rationale: 以简洁而庄重的现代汉语表达第二人称复数禁令。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名；“耶和华”是简体中文普通读者最熟悉且具有专名功能的译法，同时不将其泛化为称号“主”。
- issue: 先知语境中 מַשָּׂא 的双义
  choice: 重担
  alternative: 默示
  rationale: 译作“默示”能传达先知性宣告的术语义，却会削弱本段反复围绕“负担／重担”形成的双关与讽刺；正文保留“重担”，脚注列出另一可能。
- issue: וָאֶשְׁלַח 所连接分句的逻辑关系
  choice: 尽管我曾传话给你们说
  alternative: 我曾传话给你们说
  rationale: 希伯来语连接形式本身可直译为“而我曾差遣”，但上下文强调百姓违背先前禁令，汉语用“尽管”显明这一让步关系；并未改变禁令内容。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。保留原文重复出现的“耶和华的重担”，不为追求流畅而改换同义词；本节句法延续至下一节，因此末尾保留未完结的引语和逗号。
