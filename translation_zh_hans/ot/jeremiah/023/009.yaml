language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: לַ/נְּבִאִ֞ים נִשְׁבַּ֧ר לִבִּ֣/י בְ/קִרְבִּ֗/י רָֽחֲפוּ֙ כָּל עַצְמוֹתַ֔/י הָיִ֨יתִי֙ כְּ/אִ֣ישׁ שִׁכּ֔וֹר וּ/כְ/גֶ֖בֶר עֲבָ֣ר/וֹ יָ֑יִן מִ/פְּנֵ֣י יְהוָ֔ה וּ/מִ/פְּנֵ֖י דִּבְרֵ֥י קָדְשֽׁ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/009.yaml
  text: 'Concerning the prophets: my heart is broken within me[a]; all my bones tremble. I have become like a drunken man, like a strong man overcome by wine[c][b], because of Yahweh and because of his holy words.'
translation:
  language: zh_hans
  text: '论到先知们：[a]


    我的心在我里面碎裂，


    我浑身的骨头都颤抖；[b]


    我变得像醉酒的人，


    又像被酒制伏的壮汉，


    因为雅威，


    也因为他圣洁的话语。[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“针对先知们”。希伯来语介词既可引出信息的主题，也可能在此含有敌对意味。
    reason: alternative_reading
  - marker: b
    text: “颤抖”也可译作“震动”或“战栗”。
    reason: lexical_alternative
  - marker: c
    text: “因为雅威，也因为他圣洁的话语”或译“在雅威面前，也在他圣洁的话语面前”；这里正文把原文理解为说明先知不胜震撼的原因。
    reason: lexical_alternative
lexical_decisions:
- source_word: לַנְּבִאִים
  choice: 论到先知们
  rationale: 前缀 לְ 在这里最自然地引出下文的主题。译作“论到”既符合先知书中标题式用法，也不把其可能含有的敌对意味直接写入正文。
- source_word: נִשְׁבַּר לִבִּי בְקִרְבִּי
  choice: 我的心在我里面破碎
  rationale: 保留 שׁבר 的“破碎”意象和 בְקִרְבִּי“在我里面”的身体性表达，呈现说话者内在崩裂的状态。
- source_word: רָחֲפוּ כָּל עַצְמוֹתַי
  choice: 我浑身的骨头都颤抖
  rationale: רחף 在此表示震颤、抖动；“浑身的骨头”自然传达 כָּל עַצְמוֹתַי 所指的全身性反应。
- source_word: הָיִיתִי כְּאִישׁ שִׁכּוֹר
  choice: 我像醉酒的人
  rationale: 直译其明喻，并以简洁现代汉语表达说话者如醉者般失去稳态的情形；不额外规定完成体是状态还是状态转变。
- source_word: וּכְגֶבֶר
  choice: 又像……壮汉
  rationale: גֶּבֶר 可强调男性的强健有力；“壮汉”保留这一语义色彩，并强化连强者也被酒制伏的反差。
- source_word: עֲבָרוֹ יָיִן
  choice: 被酒制伏
  rationale: עבר 与 יין 构成的表达在此指酒胜过、压倒一个人；“制伏”既保留被支配的力度，又符合现代汉语。
- source_word: מִפְּנֵי יְהוָה
  choice: 因为雅威
  rationale: מִפְּנֵי 在语境中可表达造成先知震撼状态的原因；正文采用“因为”，同时以脚注保留“在……面前”的可能读法。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代中文常见音译呈现四字神名，保留其作为专名的性质，而不以称号替代。
- source_word: דִּבְרֵי קָדְשׁוֹ
  choice: 他的圣言
  rationale: 该构造短语指属于他、具有圣洁性质的话语；“圣言”凝练庄重，并保留复数集合意义。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。正文以“雅威”音译，保留专名性质；不用“主”替换，以免把名字转化为称号。
- issue: 说话者受震撼的原因或所在情境
  choice: 因为雅威，也因为他的圣言
  alternative: 在雅威面前，也在他的圣言面前
  rationale: מִפְּנֵי 可表达原因，也可带有“在……面前／因其临在”的空间或关系意味。正文依上下文取原因义，但在脚注中保留另一读法，避免消除原文张力。
translation_notes:
  register: 采用现代、庄重而易懂的诗体汉语，按原文分行呈现身体震颤与醉酒比喻。保留“心在我里面破碎”的希伯来意象；“壮汉”传达 גֶּבֶר 的力量色彩。所有歧义均以正文择一、脚注保留另一可能的方式处理。
