  to: '论到先知们：[a]


    我的心在我里面碎裂，


    我浑身的骨头都颤抖；[b]


    我变得像醉酒的人，


    又像被酒制伏的壮汉，


    因为雅威，


    也因为他圣洁的话语。[c]'
  rationale: 修订仅提高现代汉语的自然度并使关键短语更贴近原文：以“碎裂”替换稍显生硬的“破碎”，以“变得像”呈现完成体所指的结果状态，并以“他圣洁的话语”明确保留原文的复数及圣洁修饰。标题、神名、比喻和“因为／在……面前”的歧义处理均维持原有取向与脚注。
  reviewer_model: gpt-5.6-terra
