  naturalness: “我指着……永活的雅威起誓”本身自然，但在“人不再说”之后突然转为第一人称，指代略显不稳。改为“人不再指着……起誓”是现代、庄重且流畅的汉语，同时清楚传达“雅威永活”这一誓言公式的功能。
  terminology: “雅威”与项目既定神名译法一致；“以色列子孙”可保留其原文亲属／后裔措辞，脚注所给“以色列人”适合作为通顺替代。“埃及地”准确保留原文“地”的成分。“永活”可表达חַי的含义。
