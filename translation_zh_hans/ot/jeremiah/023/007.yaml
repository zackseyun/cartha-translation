  text: לָ/כֵ֛ן הִנֵּֽה יָמִ֥ים בָּאִ֖ים נְאֻם יְהוָ֑ה וְ/לֹא יֹ֤אמְרוּ עוֹד֙ חַי יְהוָ֔ה אֲשֶׁ֧ר הֶעֱלָ֛ה אֶת בְּנֵ֥י יִשְׂרָאֵ֖ל מֵ/אֶ֥רֶץ מִצְרָֽיִם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/007.yaml
  text: Therefore[a], behold, days are coming, declares Yahweh, when they will no longer say, ‘As Yahweh lives, who brought up the sons of Israel from the land of Egypt,’
translation:
  language: zh_hans
  text: 因此，看哪，日子将到——这是雅威的宣告——人不再指着那位领以色列子孙[a]从埃及地上来的永活雅威起誓。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可更通顺地译作“以色列人”。
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: 因此
  rationale: 承接上文，保留先知话语中的推论关系。
- source_word: הִנֵּה
  choice: 看哪
  rationale: 保留指示、唤起注意的语气及庄重的先知文体。
- source_word: יָמִים בָּאִים
  choice: 日子将到
  rationale: 以自然而庄重的汉语表达常见的先知性未来宣告。
- source_word: נְאֻם יְהוָה
  choice: 这是雅威的宣告
  rationale: 清楚表达先知传信公式，并把它与句子主体适当区隔。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以音译保留四字神名，而不以称号替代。
- source_word: וְלֹא יֹאמְרוּ עוֹד
  choice: 人不再说
  rationale: 第三人称复数的主语未具体指明，用泛指的“人”自然表达；“不再”准确体现 עוֹד 与否定词连用时的停止含义。
- source_word: חַי יְהוָה
  choice: 我指着……永活的雅威起誓
  rationale: 这是固定的起誓公式；采用现代汉语中明确而庄重的表达，传达其语用功能，而非误解为单纯陈述。
- source_word: אֲשֶׁר הֶעֱלָה
  choice: 那位领……上来的
  rationale: 保留 עלה“上来”的空间意象以及出埃及叙事中的传统用语。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列子孙
  rationale: 贴近希伯来语的亲属称谓，并保留其盟约历史色彩；脚注提供更符合日常汉语的表达。
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: 从埃及地
  rationale: 保留“地”这一成分及其救赎历史语境，不缩略为单纯的“从埃及”。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；音译“雅威”保留其专名性质，而不是用“主”等称号替换。
- issue: חַי יְהוָה 的性质
  choice: 按起誓公式意译为“我指着……永活的雅威起誓”
  alternative: 直译为“雅威永活”
  rationale: 该短语在这里引出庄严誓言。明确译出起誓功能可避免现代读者将它仅理解为神学陈述，同时保留“永活”的内容。
- issue: בְּנֵי יִשְׂרָאֵל 的群体含义
  choice: 以色列子孙
  alternative: 以色列人
  rationale: 主文保留原文的亲属和后裔表述，不将其暗中化约为一般民族称谓；脚注说明自然汉语中的等值表达。
translation_notes:
  register: 采用庄重而可理解的现代标准汉语。“看哪”和“雅威的宣告”保留先知文体；破折号帮助读者辨认插入的传信公式。起誓公式按汉语习惯重组，但没有消除原文中雅威既是永活者、又是领以色列出埃及者的关系。
