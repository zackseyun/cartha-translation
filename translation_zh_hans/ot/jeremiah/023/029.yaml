  text: הֲ/ל֨וֹא כֹ֧ה דְבָרִ֛/י כָּ/אֵ֖שׁ נְאֻם יְהוָ֑ה וּ/כְ/פַטִּ֖ישׁ יְפֹ֥צֵֽץ סָֽלַע־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/029.yaml
  text: Is not my word like fire—oracle of Yahweh—and like a hammer that shatters rock?[a]
translation:
  language: zh_hans
  text: “我的话岂不如火——雅威的宣告——又如击碎岩石的锤子吗？”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֲלוֹא
  choice: 岂不……吗
  rationale: 该词引出预期肯定回答的反问；“岂不……吗”既保留疑问形式，也自然传达强烈的肯定意味。
- source_word: כֹה דְבָרִי
  choice: 我的话
  rationale: דְבָרִי 是单数“我的话／我的言语”；כֹה 在此与后面的比较结构紧密相连，汉语无需机械译出“如此”，可由“像”自然承载比较关系。
- source_word: כָאֵשׁ
  choice: 像火
  rationale: 直接保留火的比喻，不补入焚烧、炼净或审判等原文未明说的功能。
- source_word: נְאֻם יְהוָה
  choice: 这是雅威的宣告
  rationale: נְאֻם 是先知话语中常见的名词性宣告公式；此译保留其名词性质，并将神名 יְהוָה 音译为“雅威”。
- source_word: וּכְפַטִּישׁ
  choice: 又像……锤子
  rationale: 保留连接词与第二个明喻；פַטִּישׁ 可指锤或铁匠用锤，“锤子”不对器具大小作原文没有明确给出的限定。
- source_word: יְפֹצֵץ סָלַע
  choice: 击碎磐石
  rationale: יְפֹצֵץ 表达猛烈打碎、粉碎；סָלַע 指岩石或巨岩，“击碎磐石”兼具力度和庄重感。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 采用对四字神名的现代汉语音译，以明确保留其作为专名的性质，而不以称号代替。
- issue: 火与锤子的比喻所指
  choice: 不加解释，保留开放性
  alternative: 明确译成审判、炼净或摧毁假先知的话
  rationale: 上下文显示神的话具有压倒性的效力，但本节没有把“火”和“锤子”各自限定为单一神学功能，因此正文不替读者消除这一张力。
- issue: נְאֻם יְהוָה 的句法形式
  choice: 这是雅威的宣告
  alternative: 雅威说；雅威宣告说
  rationale: 原文使用名词性先知公式，并置于两个比喻之间；正文尽量保留其位置和形式，脚注提供更自然的动词性译法。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“岂不……吗”保留原文反问力度；破折号保留宣告公式插入两个比喻之间的修辞位置。
