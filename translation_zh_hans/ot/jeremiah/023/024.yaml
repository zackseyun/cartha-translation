id: JER.23.24
reference: Jeremiah 23:24
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: אִם יִסָּתֵ֨ר אִ֧ישׁ בַּ/מִּסְתָּרִ֛ים וַ/אֲנִ֥י לֹֽא אֶרְאֶ֖/נּוּ נְאֻם יְהוָ֑ה הֲ/ל֨וֹא אֶת הַ/שָּׁמַ֧יִם וְ/אֶת הָ/אָ֛רֶץ אֲנִ֥י מָלֵ֖א נְאֻם יְהוָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/024.yaml
  text: Can a man hide himself in secret places so that I do not see him? declares Yahweh[b][a]. Do I not fill heaven and earth? declares Yahweh.
translation:
  language: zh_hans
  text: '人岂能藏在隐秘处，使我看不见他呢？[a]——雅威宣告。

    我岂不充满天地吗？[b]——雅威宣告。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“若有人藏在隐秘处，我会看不见他吗？”
    reason: 原文אִם通常意为“如果”，此处也可按条件句来理解。
  - marker: b
    text: 原文直译：“诸天和大地。”
    reason: 正文以汉语惯用的“天地”表达原文带冠词的复数“诸天”和单数“大地”。
lexical_decisions:
- source_word: אִם
  choice: 岂能
  rationale: אִם通常表示“如果”，但在这里引出反问。译作“岂能”自然传达挑战性的反问语气，同时以脚注保留条件句的另一种理解。
- source_word: יִסָּתֵר
  choice: 藏
  rationale: 该词为尼法勒形态，在此可按反身意义理解，指人试图把自己隐藏起来；现代汉语用“藏”简洁自然。
- source_word: אִישׁ
  choice: 人
  rationale: 希伯来语为阳性单数，但在这里泛指任何人；汉语“人”既保留单数代表性，也不额外限定性别。
- source_word: בַּמִּסְתָּרִים
  choice: 在隐秘处
  rationale: 原词为复数，指隐蔽、秘密之处。汉语“隐秘处”可作集合性表达，语气庄重且易懂。
- source_word: וַאֲנִי לֹא אֶרְאֶנּוּ
  choice: 使我看不见他
  rationale: 在反问结构中，这一分句表达企图达到的结果：藏到神看不见。译文明确表达这种逻辑关系，而不把它误解为神事实上没有看见。
- source_word: נְאֻם יְהוָה
  choice: 雅威宣告
  rationale: 保留先知话语中郑重的神谕公式，并将神名置于主语位置，符合现代汉语表达。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以常见的汉语音译呈现四字神名，保留其专名性质，不以称号替代。
- source_word: הֲלוֹא
  choice: 岂不……吗
  rationale: 该词引出预期肯定回答的反问；“岂不……吗”保留其语气和庄重感。
- source_word: הַשָּׁמַיִם וְאֶת הָאָרֶץ
  choice: 天地
  rationale: “天地”是自然、凝练的汉语配对，表达原文“诸天和大地”所涵盖的整个受造领域；脚注注明较贴近形式的译法。
- source_word: מָלֵא
  choice: 充满
  rationale: 保留原文“充满”的空间性比喻，不将其抽象改写为“无处不在”，从而保留原文的神学表达力度。
theological_decisions:
- issue: 神充满天地的表述
  choice: 我岂不充满天地吗？
  alternative: 我岂不是遍在天地之间吗？
  rationale: 原文直接使用“充满”，译文保留这一强烈而具体的比喻，不把它化约为后来的抽象神学术语。
- issue: 首句反问的句法
  choice: 人岂能藏在隐秘处，使我看不见他呢？
  alternative: 若有人藏在隐秘处，我会看不见他吗？
  rationale: אִם既可按条件标记理解，也可在此反问中表达“岂能”的挑战意味。正文采用较自然的汉语反问，脚注保留条件句分析，避免抹去句法歧义。
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文使用神的专名，正文以“雅威”音译，避免用“主”等称号取代专名。
translation_notes:
  register: 采用现代、庄重而口语可懂的标准普通话。“岂能”“岂不”维持先知神谕的郑重反问语气；破折号区分神谕内容与“雅威宣告”这一公式。
