base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/033.yaml
  text: And when this people, or a prophet, or a priest asks you, saying, ‘What is the burden of the LORD?’ then you shall say to them, ‘You are the burden, and I will cast you off,’ declares the LORD.
translation:
  language: zh_hans
  text: 这百姓、先知或祭司若问你说：‘耶和华的重担是什么？’你就要对他们说：‘什么重担？[a]我要丢弃你们。’这是耶和华的宣告。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “重担”所译的希伯来词也常指先知所传的“默示”。同一辅音串可按另一种分词和元音读作：“你们就是重担；我要丢弃你们。”
    reason: 说明מַשָּׂא在本段的双关，并保留אֶת מה משא／אתם המשא的真实读法歧义，而不改变依所给WLC元音文本所作的正文翻译。
lexical_decisions:
- source_word: מַשָּׂא
  choice: 重担
  rationale: 保留该词在本段中的双关：它既可指先知所传的“默示”，也可按本义指沉重的“担子”。译作“重担”能使百姓带嘲弄意味的问题与耶和华“丢弃你们”的回应形成张力。
- source_word: וְנָטַשְׁתִּי אֶתְכֶם
  choice: 我要丢弃你们
  rationale: נָטַשׁ 表示撇下、遗弃或丢开；“丢弃”既自然，也保留审判语气及与“重担”意象的呼应。
- source_word: נְאֻם יְהוָה
  choice: 这是耶和华的宣告
  rationale: 用庄重而通顺的现代汉语呈现先知书常见的神谕结语，并采用“耶和华”对应神名。
theological_decisions:
- issue: 回应中的希伯来文本歧义
  choice: 正文依所给WLC元音文本译为“什么重担？我要丢弃你们”
  alternative: “你们就是重担，我要丢弃你们”
  rationale: 辅音串 אתמהמשא 可按马所拉元音读作 אֶת־מַה מַשָּׂא（“什么重担？”），也可重新分词、加元音理解为 אַתֶּם הַמַּשָּׂא（“你们就是重担”）。因任务要求首先依据所给WLC文本，正文采用前者，同时以脚注保留另一古老理解，不消除真实的文本张力。
translation_notes:
  register: 采用现代、庄重、可朗读的标准普通话。“有什么重担／什么重担”刻意保留原文反复及讽刺性的问答结构；脚注明示文本歧义而不在正文中混合两种读法。
