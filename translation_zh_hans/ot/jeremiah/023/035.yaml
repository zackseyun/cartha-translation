base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/035.yaml
  text: Thus each man shall say to his neighbor[a], and each man to his brother, ‘What has Yahweh answered?’ and[b], ‘What has Yahweh spoken?’
translation:
  language: zh_hans
  text: 你们要这样说：各人对邻舍、各人对弟兄说：“雅威回答了什么？雅威说了什么？”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “雅威”是希伯来文神名יהוה（YHWH）的音译，传统中文译作“耶和华”。
    reason: 说明神名的译法及其与传统中文译名的关系。
lexical_decisions:
- source_word: כֹּה תֹאמְרוּ
  choice: 你们……要……这样说
  rationale: 保留第二人称复数的直接吩咐语气，并将כֹּה自然译为“这样”。
- source_word: אִישׁ עַל רֵעֵהוּ וְאִישׁ אֶל אָחִיו
  choice: 各人要对邻舍和弟兄
  rationale: אִישׁ在此具有逐一、分配性的作用，译作“各人”；רֵעַ与אָח的平行关系分别保留为“邻舍”和“弟兄”。两个介词在说话语境中均表示话语所指向的对象，汉语统一用“对”表达更自然。
- source_word: מֶה עָנָה
  choice: 回答了什么
  rationale: 准确保留ענה“回答、回应”的意义，不把它弱化为一般的“说”。
- source_word: וּמַה דִּבֶּר
  choice: 雅威说了什么
  rationale: דבר在这里指说话；译作“说了什么”符合现代汉语，同时与前句“回答了什么”形成原文的平行而不抹去动词差异。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以常见的现代汉语音译呈现四字神名，保留其作为专名而非称号的性质。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名。译作“雅威”较贴近学界通行的发音重构，并避免以“上主”这一称号代替专名；脚注说明传统译名，方便普通读者辨认。
translation_notes:
  register: 采用现代、庄重而口语可懂的表达。“你们各人”同时保留复数受众和逐一吩咐的意味；引语中的两个问句保持原文平行结构。
