id: JER.23.5
reference: Jeremiah 23:5
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: הִנֵּ֨ה יָמִ֤ים בָּאִים֙ נְאֻם יְהוָ֔ה וַ/הֲקִמֹתִ֥י לְ/דָוִ֖ד צֶ֣מַח צַדִּ֑יק וּ/מָ֤לַךְ מֶ֨לֶךְ֙ וְ/הִשְׂכִּ֔יל וְ/עָשָׂ֛ה מִשְׁפָּ֥ט וּ/צְדָקָ֖ה בָּ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/005.yaml
  text: Behold[a], days are coming, declares Yahweh, when I will raise up for David a righteous Branch, and he will reign as king and act wisely[b], and he will do justice and righteousness in the land.
translation:
  language: zh_hans
  text: 看哪，日子将要来到——雅威宣告说——我要为大卫兴起一根公义的枝条[a]；他必作王掌权，行事明智[b]，在地上施行公平和公义。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “枝条”也可译作“嫩芽”或“新芽”。这个希伯来语比喻指从大卫一系生出的后裔。
    reason: lexical_alternative
  - marker: b
    text: “行事明智”也可译作“处事有智慧”或“亨通”。这个希伯来语动词既可指明智地行事，也可包含由此获得成功的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: 看哪
  rationale: 保留先知宣告中引人注意的指示语气和庄重感，同时符合现代中文圣经语体。
- source_word: יָמִים בָּאִים
  choice: 日子将到
  rationale: 保留希伯来文常见的先知性未来公式，表达上自然而凝练。
- source_word: נְאֻם יְהוָה
  choice: 这是雅威的宣告
  rationale: 体现 נְאֻם 的权威性宣告功能，并直接音译神的圣名 יְהוָה。
- source_word: וַהֲקִמֹתִי לְדָוִד
  choice: 我要为大卫兴起
  rationale: “兴起”保留使某位统治者或后裔出现的使役含义；“为大卫”不把原文扩写为“大卫家”。
- source_word: צֶמַח צַדִּיק
  choice: 一根公义的枝条
  rationale: 保留植物新生部分的王朝隐喻及其与大卫谱系的关联；不在正文中直接增译为“弥赛亚”。
- source_word: וּמָלַךְ מֶלֶךְ
  choice: 他必作王掌权
  rationale: 用动宾组合再现希伯来文同源动词与名词所加强的君王统治含义。
- source_word: וְהִשְׂכִּיל
  choice: 行事明智
  rationale: 首先呈现审慎而有见识地行事之义，同时以脚注保留“亨通”的结果性含义。
- source_word: מִשְׁפָּט וּצְדָקָה
  choice: 公平和公义
  rationale: 在君王治理语境中，分别表达公正的司法治理和合乎正义的行为；也保留原文两个相关而不完全相同的概念。
- source_word: בָּאָרֶץ
  choice: 在地上
  rationale: 原词可指土地、国土或大地；正文采用不限定疆域的直译，以保留范围上的可能含混。
theological_decisions:
- issue: 大卫“枝条”的弥赛亚含义
  choice: 保留大卫谱系中的王室枝条意象，不在正文中明说“弥赛亚”或“基督”
  alternative: 将其直接译为“弥赛亚”，或弱化为泛指的“后裔”
  rationale: 原文具有明确的大卫王朝背景和后续弥赛亚解读空间，却未直接使用“弥赛亚”一词；保留隐喻可避免把传统解释写入正文。
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文明确使用四字神名；音译“雅威”直接呈现专名，而不以称号替代。
- issue: “地” בָּאָרֶץ 的范围
  choice: 在地上
  alternative: 在国中；在这片土地上；在全地
  rationale: 该词在语境中可以指犹大国土，也可具有更广范围；正文不擅自限定，保留原文张力。
translation_notes:
  register: 采用现代、庄重而易懂的先知书语体。“看哪”“宣告”等词保留宣告的肃穆感；破折号划出插入的神谕公式，使长句层次清楚。
