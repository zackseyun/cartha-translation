  text: Am I a God who is near[a], declares Yahweh, and not a God who is far away?
translation:
  language: zh_hans
  text: 耶和华宣告：“难道我是近处的上帝，不是远处的上帝吗？”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַ/אֱלֹהֵי מִ/קָּרֹב אָ֖נִי
  choice: 难道我只是近处的上帝
  rationale: 希伯来语是无系词的疑问句，直译近似“我是近处的上帝吗”。结合后半句的反问，加入“难道”和“只是”，自然表达其否定上帝仅受限于近处的语用含义；脚注保留不加“只是”的形式对应译法。
- source_word: נְאֻם יְהוָה
  choice: 耶和华说
  rationale: 这是先知书常见的宣告公式。现代汉语以“耶和华说”简洁、庄重地表达，并将神名 יְהוָה 音译为中文传统通行形式“耶和华”。
- source_word: וְ/לֹא אֱלֹהֵי מֵ/רָחֹק
  choice: 不是远处的上帝吗
  rationale: 保留连接词与否定所构成的反问，并与“近处的上帝”形成清楚、对称的空间对照，不把“远处”解释成情感疏离。
theological_decisions:
- issue: 上帝在近处与远处的反问
  choice: 难道我只是近处的上帝……不是远处的上帝吗？
  alternative: 我是近处的上帝，而不是远处的上帝吗？
  rationale: 上下文中的反问否定上帝的临在或主权只限于近处。“只是”使现代汉语读者容易把握这一语用含义，但正文不扩写其具体神学范围，脚注同时保留更贴近原句结构的译法。
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威；主
  rationale: 采用现代简体中文圣经语境中最通行、可辨识的专名形式，不以称号“主”替代原文神名。
translation_notes:
  register: 采用现代、庄重而清楚的普通话。“近处／远处”紧扣原文对举；引号和“难道……吗”使神谕公式及反问关系自然易懂。
