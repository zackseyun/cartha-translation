reference: Jeremiah 23:32
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: הִ֠נְ/נִי עַֽל נִבְּאֵ֞י חֲלֹמ֥וֹת שֶׁ֨קֶר֙ נְאֻם יְהוָ֔ה וַֽ/יְסַפְּרוּ/ם֙ וַ/יַּתְע֣וּ אֶת עַמִּ֔/י בְּ/שִׁקְרֵי/הֶ֖ם וּ/בְ/פַחֲזוּתָ֑/ם וְ/אָנֹכִ֨י לֹֽא שְׁלַחְתִּ֜י/ם וְ/לֹ֣א צִוִּיתִ֗י/ם וְ/הוֹעֵ֛יל לֹֽא יוֹעִ֥ילוּ לָֽ/עָם הַ/זֶּ֖ה נְאֻם יְהוָֽה־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/032.yaml
  text: Behold[a], I am against those who prophesy lying dreams, declares Yahweh, and who tell them and lead my people astray by their lies and by their recklessness, though I did not send them or command them. They do not profit this people at all[b], declares Yahweh.
translation:
  language: zh_hans
  text: “看哪，我要敌对那些预言虚假的梦[a]的人，”雅威宣告，“他们讲述这些梦，并以自己的谎言和轻率妄为[b]使我的百姓走入歧途；我没有差遣他们，也没有吩咐他们。他们对这百姓毫无益处。”雅威宣告。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“虚谎的梦”或“谎言的梦”；也可译作“预言虚假梦的人”。
    reason: lexical_alternative
  - marker: b
    text: “轻率妄为”所译的希伯来词含义较难确定，也可理解为“鲁莽放肆”“狂妄”或“轻浮而不负责任”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנְנִי עַל
  choice: 看哪，我与……为敌
  rationale: 这是宣告敌对与审判的先知性惯用语；“看哪”保留郑重的提示语气，“与……为敌”自然表达 עַל 在此处的敌对含义。
- source_word: נִבְּאֵי חֲלֹמוֹת שֶׁקֶר
  choice: 那些预言虚假梦境的人
  rationale: 保留分词结构所指的一类人，也保留 שֶׁקֶר 修饰“梦”的表达；“虚假梦境”在现代汉语中清楚自然。
- source_word: נְאֻם יְהוָה
  choice: 雅威宣告
  rationale: 这是典型的先知宣告公式；“宣告”比普通的“说”更能传达其庄严性。
- source_word: וַיְסַפְּרוּם
  choice: 他们讲述这些梦
  rationale: 动词后的宾语后缀回指前面的梦；明说“这些梦”可避免汉语中的指代含混。
- source_word: וַיַּתְעוּ אֶת עַמִּי
  choice: 使我的百姓走入歧途
  rationale: 使役式表达使人偏离正路，既包含欺骗，也包含误导。
- source_word: בְּשִׁקְרֵיהֶם
  choice: 以自己的谎言
  rationale: 介词 בְּ 在此表示手段；复数 שִׁקְרֵיהֶם 直译为“他们的谎言”。
- source_word: וּבְפַחֲזוּתָם
  choice: 和轻率妄为
  rationale: 该罕见词带有鲁莽、不负责任及僭妄的意味；“轻率妄为”保留这些相互交叠的含义，而不局限为单纯的夸口。
- source_word: וְאָנֹכִי לֹא שְׁלַחְתִּים וְלֹא צִוִּיתִים
  choice: 我没有差遣他们，也没有吩咐他们
  rationale: 保留 אָנֹכִי 所强调的第一人称和两个并列否定，突出这些人并未得到神的授权。
- source_word: וְהוֹעֵיל לֹא יוֹעִילוּ
  choice: 他们对……毫无益处
  rationale: 不定式绝对式与限定动词并用加强否定；“毫无益处”自然体现这种强烈语气。
- source_word: לָעָם הַזֶּה
  choice: 对这百姓
  rationale: 保留 עָם 的群体含义以及指示词所带的轻微疏离语气。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”较贴近学界通常重构的读音，并保留其作为专名的性质，不以称号替代。
- issue: 假先知言论的来源与责任
  choice: 明确区分他们自称的预言与雅威并未给予的差遣或命令
  alternative: 把“没有吩咐”解释成没有任命他们担任某种固定职分
  rationale: צוה 的基本意义是“吩咐、命令”；译文不进一步规定具体制度或职分，从而保留原文对虚假宣称和未经授权发言的双重谴责。
translation_notes:
  register: 采用庄重而现代的标准普通话。以直接引语和“雅威宣告”的插入语保留先知神谕的力度；句式清楚，避免古奥文言，同时用“走入歧途”“毫无益处”等常用表达传达原文的使役与强调。
