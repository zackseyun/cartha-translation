  text: לֹ֤א יָשׁוּב֙ אַף יְהוָ֔ה עַד עֲשֹׂת֥/וֹ וְ/עַד הֲקִימ֖/וֹ מְזִמּ֣וֹת לִבּ֑/וֹ בְּ/אַֽחֲרִית֙ הַ/יָּמִ֔ים תִּתְבּ֥וֹנְנוּ בָ֖/הּ בִּינָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/020.yaml
  text: The anger of Yahweh will not turn back until he has done it[a], and until he has established the purposes of his heart[c][b]. In the latter days you will understand it clearly.
translation:
  language: zh_hans
  text: 耶和华的怒气必不转回，直到他成就这事[a]，直到他实现他心中的计划[b]。在末后的日子[c]，你们必清楚明白这事。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“直到他施行完毕”。原文没有明说所成就之事的具体内容。
    reason: lexical_alternative
  - marker: b
    text: 或译：“他心中的旨意”。
    reason: lexical_alternative
  - marker: c
    text: 或译：“在将来的日子”；原文直译为“在日子的末后”。
    reason: alternative_reading
lexical_decisions:
- source_word: אַף יְהוָה
  choice: 耶和华的怒气
  rationale: אַף在此为表达忿怒的惯用义，而非字面的“鼻子”；用“怒气”自然、庄重，并符合审判语境。神名יְהוָה按现代中文圣经的通行形式译作“耶和华”。
- source_word: לֹא יָשׁוּב
  choice: 必不转回
  rationale: 保留שׁוב“转回、返回”的意象，表示怒气在旨意完成以前不会撤回；“必”体现未完成式在预言语境中的确定将来意义。
- source_word: עַד עֲשֹׂתוֹ
  choice: 直到他成就这事
  rationale: 希伯来语没有明说宾语所指，故以“这事”保留其宽泛性；“成就”比单纯“做”更自然地表达行动达到完成。
- source_word: וְעַד הֲקִימוֹ
  choice: 实现
  rationale: 使役形הקים在此指使所谋定的事成立并付诸实现；“实现”与后面的“谋定”搭配自然，也保留落实意图的含义。
- source_word: מְזִמּוֹת לִבּוֹ
  choice: 他心中的谋定
  rationale: מְזִמּוֹת指经过筹划的意图，可依语境为正面或负面；“谋定”避免“阴谋”的负面预断，同时保留深思筹划之意。“心中”保留希伯来语以心为意志和意图所在的表达。
- source_word: בְּאַחֲרִית הַיָּמִים
  choice: 在末后的日子
  rationale: 贴近原文并保留先知性表达可能具有的末世意味，而不把它限定为某一套末世论；脚注提示也可泛指将来的日子。
- source_word: תִּתְבּוֹנְנוּ בָהּ בִּינָה
  choice: 你们必清楚明白这事
  rationale: 动词与同根名词连用形成强调，含认真领会、确切明白之意；译为“清楚明白”以自然中文传达这种加强语气。
theological_decisions:
- issue: בְּאַחֲרִית הַיָּמִים的先知性时间含义
  choice: 在末后的日子
  alternative: 在将来的日子
  rationale: “末后的日子”保留原文的末时色彩及其神学张力，但不强行判定为某一特定末世阶段；脚注明示较宽泛的可能译法。
- issue: 耶和华的怒气与其心中所谋之事的关系
  choice: 保留怒气不转回，直到神成就并实现其谋定的表述
  alternative: 释义为神在完成审判前不会息怒
  rationale: 原文以诗性意象表达，不明确把所成就之事完全等同于审判；正文不增加这一限定，以免消解语义空间。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。句式保留希伯来诗句中“直到……实现……”的推进关系；“必不”“必清楚明白”传达预言的确定语气。所有脚注标记均置于相应正文位置。
