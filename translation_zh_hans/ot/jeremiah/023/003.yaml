  text: וַ/אֲנִ֗י אֲקַבֵּץ֙ אֶת שְׁאֵרִ֣ית צֹאנִ֔/י מִ/כֹּל֙ הָ/אֲרָצ֔וֹת אֲשֶׁר הִדַּ֥חְתִּי אֹתָ֖/ם שָׁ֑ם וַ/הֲשִׁבֹתִ֥י אֶתְ/הֶ֛ן עַל נְוֵ/הֶ֖ן וּ/פָר֥וּ וְ/רָבֽוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/003.yaml
  text: And I myself will gather the remnant of my flock out of all the lands where I have driven them[a], and I will bring them back to their pasture[b], and they will be fruitful and multiply.
translation:
  language: zh_hans
  text: 至于我，我要从我曾赶逐他们到的各地[a]，把我羊群中余剩的聚集起来，领他们回到自己的草场[b]；他们必生养增多。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “赶逐”也可译作“驱散”。这个希伯来词可表示使人被赶走或四散；正文采用“赶逐”，以保留上帝施行审判的力度。
    reason: lexical_alternative
  - marker: b
    text: “草场”也可译作“羊圈”或“居所”。这个希伯来词可指牧场、居所或安歇之地；此处采用“草场”，以配合上下文的羊群意象。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: 至于我，我要
  rationale: 独立代词强化上帝亲自采取行动；“至于我，我”在中文中保留转折性的强调，又不把连接词机械译为“并且”。
- source_word: אֲקַבֵּץ
  choice: 聚集起来
  rationale: קבץ在先知书的复兴语境中常指把分散者重新聚拢；此译自然，并与羊群意象相合。
- source_word: שְׁאֵרִית צֹאנִי
  choice: 我羊群中剩下的
  rationale: שְׁאֵרִית表示余剩者；结合צֹאן的集合意义，译为“我羊群中剩下的”比抽象的“余民”更直接保留羊群比喻。
- source_word: מִכֹּל הָאֲרָצוֹת
  choice: 从……各地
  rationale: 复数אֲרָצוֹת在此指被逐散所到的不同地域；“各地”是自然、准确的现代汉语。
- source_word: הִדַּחְתִּי
  choice: 我赶逐他们
  rationale: נדח的使役式表达使其被驱离、流散；“赶逐”保留上帝施行审判的主动性和力度。
- source_word: וַהֲשִׁבֹתִי אֶתְהֶן
  choice: 领他们回到
  rationale: שוב的使役式指使之返回；“领……回到”既表达使其归回，也贴合牧者带领羊群的语境。
- source_word: עַל נְוֵיהֶן
  choice: 回到自己的草场
  rationale: נָוֶה可指草场、居所或安歇之处；羊群语境支持“草场”，而עַל按中文习惯译作“到”。
- source_word: וּפָרוּ וְרָבוּ
  choice: 生养增多
  rationale: 这一固定搭配呼应创造和盟约中繁衍增多的用语；“生养增多”简洁庄重，并保留其经文共鸣。
theological_decisions:
- issue: 上帝在被逐与复兴中的主动作为
  choice: 同时明确保留上帝“赶逐”他们及亲自“聚集、领回”他们的双重行动
  alternative: 把前者弱化为无人称的“他们被分散”，或只说“他们流散”
  rationale: 希伯来文明确以第一人称陈述“我赶逐他们”，随后又应许“我聚集、领回”；译文应保留审判与复兴并存的神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“至于我，我要”保留独立代词的强调；“赶逐”与“领……回到”形成审判和复兴的鲜明对应；整体维持牧者与羊群的比喻。
