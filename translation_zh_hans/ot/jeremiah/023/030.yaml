id: JER.23.30
reference: Jeremiah 23:30
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: לָ/כֵ֛ן הִנְ/נִ֥י עַל הַ/נְּבִאִ֖ים נְאֻם יְהוָ֑ה מְגַנְּבֵ֣י דְבָרַ֔/י אִ֖ישׁ מֵ/אֵ֥ת רֵעֵֽ/הוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/030.yaml
  text: Therefore[a], behold, I am against the prophets, declares Yahweh, who steal my words, each from his neighbor.
translation:
  language: zh_hans
  text: 所以，看哪，我与那些先知为敌——雅威宣告——他们各自从同伴那里偷取我的话。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或较贴近原文语序：“那些偷取我话语的先知——各人从他的同伴那里（偷取）。”
    reason: 原文以“偷取我话语的”这一分词短语描述“先知”，并在句末以“各人从他的同伴那里”说明偷取的来源；括号中的“偷取”为汉语表达所补。
lexical_decisions:
- source_word: לָכֵן
  choice: 所以
  rationale: 承接上文的斥责并引出相应的审判；“所以”在现代汉语中自然地保留因果推进。
- source_word: הִנְנִי עַל
  choice: 看哪，我与……为敌
  rationale: הִנְנִי 是强调性的神圣宣告，译作“看哪，我……”保留唤起注意和亲自介入的语气；עַל 在审判语境中表示敌对立场。
- source_word: הַנְּבִאִים
  choice: 那些先知
  rationale: 指上文所谴责、声称传达神言语的一群先知；“那些”使汉语指称自然。
- source_word: נְאֻם יְהוָה
  choice: 雅威宣告
  rationale: 保留先知书中庄严的宣告公式，并将四字神名 יְהוָה 音译为“雅威”。
- source_word: מְגַנְּבֵי דְבָרַי
  choice: 偷取我的话
  rationale: 分词描述这些先知一贯或典型的行为；דְבָרַי 为复数，但汉语“我的话”自然包含多项言语，不必生硬译作“我的话语们”。
- source_word: אִישׁ מֵאֵת רֵעֵהוּ
  choice: 各自从同伴那里
  rationale: אִישׁ 在此具有逐一分配的作用；רֵעֵהוּ 指同伴或同业者。译文保留每个人从另一同伴那里取用言语的关系，而不额外解释为抄袭或冒充启示。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。音译“雅威”保留其作为以色列之神专名的性质，不以称号替代。
- issue: “偷取我的话”的具体所指
  choice: 保留原文措辞，不明说这些话究竟如何成为“我的话”
  alternative: 彼此抄袭所谓从神而来的信息；盗用别人的预言冒充神言
  rationale: 原文控告先知彼此偷取“我的话”，但没有在本节明确说明其操作方式。直译可保留这项修辞和神学张力，避免加入原文未明说的解释。
- issue: אִישׁ…רֵעֵהוּ 的性别表达
  choice: 各自从同伴那里
  alternative: 各人从他的邻舍那里
  rationale: 这里的阳性单数形式构成希伯来语的分配表达，重点是“一个从另一个那里”，并非强调性别。现代汉语用“各自”准确传达分配关系，也不会引入原文没有强调的男性限定。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“看哪”保留先知性宣告的郑重语气；破折号标示插入的宣告公式，使长句层次清晰。“偷取”比口语化的“偷拿”更适合神谕文体，同时不把行为过度解释为现代意义上的文字抄袭。
