  text: וְ/אִֽם עָמְד֖וּ בְּ/סוֹדִ֑/י וְ/יַשְׁמִ֤עוּ דְבָרַ/י֙ אֶת עַמִּ֔/י וִֽ/ישִׁבוּ/ם֙ מִ/דַּרְכָּ֣/ם הָ/רָ֔ע וּ/מֵ/רֹ֖עַ מַֽעַלְלֵי/הֶֽם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/022.yaml
  text: But if they had stood in my council[a], then they would have caused my people to hear my words, and they would have turned them from their evil way and from the evil of their deeds.
translation:
  language: zh_hans
  text: 但他们若曾站在我的议事会中[a]，就会使我的百姓听见我的话，并使他们回转，离开他们的恶道和他们行为中的恶。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“我的密会中”或“我的谋议中”。希伯来语“סוֹד”可指秘密议事的聚会、亲密圈子或谋议。
    reason: 说明原词可指议事群体、隐秘聚会或谋议，保留其词义范围，避免正文的“议事会”被误解为唯一可能的解释。
lexical_decisions:
- source_word: וְאִם
  choice: 但……若
  rationale: 结合上文对假先知的斥责，此处具有转折和反事实条件的意味；“但……若”自然体现这种语境关系。
- source_word: עָמְדוּ
  choice: 曾站在
  rationale: 完成式处于反事实条件句中；“曾站在”既表达先前本应发生却未发生的情形，也避免中文过度繁复。
- source_word: בְּסוֹדִי
  choice: 在我的议会中
  rationale: סוֹד可指亲密、隐秘的议事群体或会议；“议会”保留先知进入上帝议事场域的意象，同时用脚注说明“密会”与“谋议”等可能含义。
- source_word: וְיַשְׁמִעוּ דְבָרַי אֶת־עַמִּי
  choice: 就会使我的百姓听见我的话
  rationale: 保留שׁמע使役式“使……听见”的语法力量，并保留דְבָרַי的复数含义；中文“我的话”可自然涵盖复数言语。
- source_word: וִישִׁבוּם
  choice: 使他们回转
  rationale: שׁוב的使役式表示使百姓转回；“回转”既保留方向变化，也符合道德悔改的上下文。
- source_word: מִדַּרְכָּם הָרָע
  choice: 离开自己的恶道
  rationale: “恶道”保留“道路”作为行为方式的希伯来语隐喻；“自己”清楚回指百姓。
- source_word: וּמֵרֹעַ מַעַלְלֵיהֶם
  choice: 离开自己所行的恶
  rationale: 原文直指“他们行为中的恶”；此译保留抽象名词“恶”与行为概念，而不简化为单一的“恶行”。
theological_decisions:
- issue: סוֹד所表达的神圣议事场景
  choice: 译作“我的议会”，体现先知站在上帝议事聚会中的意象
  alternative: “我的密会”或“我的谋议中”
  rationale: 上下文把真先知与未曾进入耶和华סוֹד的假先知相对照。“议会”保留群体性的议事场景，又不把该词仅解释为抽象的意见或计谋；脚注保留词义上的真实开放性。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“但……若曾……就会……”表达反事实条件；两个“离开”形成清晰的平行结构，并保留原文“恶道”与“所行的恶”两层表述。
