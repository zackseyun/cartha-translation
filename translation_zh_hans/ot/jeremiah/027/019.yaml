  text: כִּ֣י כֹ֤ה אָמַר֙ יְהוָ֣ה צְבָא֔וֹת אֶל הָֽ/עַמֻּדִ֔ים וְ/עַל הַ/יָּ֖ם וְ/עַל הַ/מְּכֹנ֑וֹת וְ/עַל֙ יֶ֣תֶר הַ/כֵּלִ֔ים הַ/נּוֹתָרִ֖ים בָּ/עִ֥יר הַ/זֹּֽאת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/027/019.yaml
  text: 'For thus says Yahweh of Armies concerning the pillars[a], the Sea, the stands[b], and the rest of the vessels that remain in this city:'
translation:
  language: zh_hans
  text: 因为万军之耶和华如此说，论到柱子、“海”[a]、台座[b]，以及留在这城里的其余器具：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “海”指圣殿中的大型水盆，也称“铜海”。
    reason: cultural_note
  - marker: b
    text: “台座”也可译作“底座”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文并引出对前述话语的说明；“因为”保留原文的因果或解释性衔接。
- source_word: כֹה אָמַר
  choice: 如此说
  rationale: 保留先知宣告中固定的使者公式，同时采用庄重、自然的现代汉语表达。
- source_word: יְהוָה צְבָאוֹת
  choice: 万军之耶和华
  rationale: “耶和华”传达神名，צְבָאוֹת译作“万军”，既保留复数军旅意象，也符合汉语中清楚而庄重的神圣称号表达。
- source_word: אֶל
  choice: 论到
  rationale: 此处不是向无生命之物说话，而是引出宣告所涉及的对象；“论到”准确表达主题关系。
- source_word: הָעַמֻּדִים
  choice: 柱子
  rationale: 指圣殿中的建筑柱；“柱子”比“圆柱”或“支柱”更少加入原文未明说的形制或功能。
- source_word: הַיָּם
  choice: “海”
  rationale: 保留这件圣殿陈设的专名式称呼，并以引号提示此处不是普通海洋；脚注说明其实际所指。
- source_word: הַמְּכֹנוֹת
  choice: 台座
  rationale: 该词指承托圣殿器具的座架或底座；“台座”既表达功能，又不武断限定其具体结构。
- source_word: יֶתֶר הַכֵּלִים
  choice: 其余器具
  rationale: יֶתֶר表示余下部分，כֵּלִים在圣殿清单语境中泛指器具；该译法简洁自然。
- source_word: הַנּוֹתָרִים בָּעִיר הַזֹּאת
  choice: 留在这城里的
  rationale: 保留分词所表达的仍被留下、尚存于城中的状态，并用汉语定语结构自然修饰“其余器具”。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名；采用现代中文读者最熟悉的专名“耶和华”，不以“主”替代，从而保留其作为神名的性质。
- issue: 称号 צְבָאוֹת 的译法
  choice: 万军
  alternative: 众军
  rationale: “万军”保留军队、军旅的具体意象，同时是庄重而易懂的现代汉语表达；不额外加入原文未明说的“天上”。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。句序略作调整，使“如此说”置于引述公式末端，但仍保留原文的宣告结构和冒号所引出的未完内容。“海”保留原文专称，不在正文中补入“铜”，以免把相关经文提供的信息直接写进本节原文。
