base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/027/001.yaml
  text: At the beginning of the reign of Jehoiakim son of Josiah[a], king of Judah, this word came to Jeremiah from Yahweh, saying[b],
translation:
  language: zh_hans
  text: 在犹大王、约西亚的儿子约雅敬执政初期，这话从雅威[a]临到耶利米，说：[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “雅威”音译自希伯来文神名 יהוה（YHWH）。
    reason: lexical_alternative
  - marker: b
    text: 本节希伯来文本作“约雅敬”；但本章下文所述的时代是西底家在位期间（见27:3、12），因此这里在上下文中存在年代上的疑难。
    reason: textual_variant
lexical_decisions:
- source_word: בְּרֵאשִׁית מַמְלֶכֶת
  choice: 执政初期
  rationale: 这里指一位君王统治的起初阶段。“执政初期”符合现代汉语表达，并保留时间含义。
- source_word: יְהוֹיָקִם בֶּן־יֹאושִׁיָּהוּ מֶלֶךְ יְהוּדָה
  choice: 犹大王约西亚的儿子约雅敬
  rationale: 按希伯来文保留王的身份、父子关系和专名；采用中文圣经人名的通行译法。
- source_word: הָיָה הַדָּבָר הַזֶּה אֶל־יִרְמְיָה
  choice: 有这话临到耶利米
  rationale: 保留先知书常见的启示公式。“话”比“信息”更贴近 דָּבָר，而“临到”自然表达话语由神而来。
- source_word: מֵאֵת יְהוָה
  choice: 雅威
  rationale: 介词短语标明这话来自雅威；汉语中调整语序为“雅威有这话临到”，仍清楚保留来源关系。
- source_word: לֵאמֹר
  choice: 说：
  rationale: 该词引出下文的直接话语；用冒号自然连接下一节。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名，音译“雅威”可将其作为专名呈现，避免以称号代替，也不把传统的另一种音译当作原始读音。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“执政初期”避免生硬的“国度开始时”；“有这话临到”保留先知文学的固定表达。经文末用冒号，表明话语在下一节继续。
