base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/027/012.yaml
  text: And to Zedekiah king of Judah I spoke all these words[a], saying, “Bring your necks under the yoke of the king of Babylon, and serve him and his people[b], and live.”
translation:
  language: zh_hans
  text: 我又照这一切话对犹大王西底家说：“你们要把你们的颈项放在巴比伦王的轭下[a]，服侍他和他的百姓，并且存活[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译可作“把你们的颈项带进巴比伦王的轭中”。
    reason: lexical_alternative
  - marker: b
    text: “并且存活”也可按结果或目的理解为“你们就会存活”或“好使你们存活”。
    reason: lexical_alternative
lexical_decisions:
- source_word: דִּבַּרְתִּי
  choice: 我……说
  rationale: דבר 的 piel 形式意为“说、讲话”；汉语以“对……说”最自然，也与随后引出直接引语的结构相合。
- source_word: כְּכָל הַדְּבָרִים הָאֵלֶּה
  choice: 照这一切话
  rationale: 保留 כְּ 的“照、按照”意味和 דְּבָרִים 的“话”，同时采用自然的现代汉语表达。
- source_word: הָבִיאוּ אֶת צַוְּארֵיכֶם בְּעֹל
  choice: 把颈项放在……的轭下
  rationale: הביאו 字面为“带来、使进入”，这里与“颈项、轭”构成顺服于统治的具体比喻；“放在轭下”在汉语中自然且保留意象。
- source_word: מֶלֶךְ בָּבֶל
  choice: 巴比伦王
  rationale: 直接呈现希伯来语属格结构，符合现代汉语习惯。
- source_word: וְעִבְדוּ אֹתוֹ
  choice: 服侍他
  rationale: עבד 在此指为巴比伦王效力并臣服于其统治；“服侍”既保留词义宽度，也不把政治含义抽象化。
- source_word: וְעַמּוֹ
  choice: 和他的人民
  rationale: עַם 通常意为“人民、百姓”；“他的人民”直接保留原文措辞，不将其限定为官员、军队或国家机器。
- source_word: וִחְיוּ
  choice: 并且存活
  rationale: 保留原文命令式串联的简短形式；“存活”比单说“活”更自然地表达在审判与战争背景下得以保全性命。
- source_word: צִדְקִיָּה מֶלֶךְ יְהוּדָה
  choice: 犹大王西底家
  rationale: 采用现代中文圣经人名惯例，并按自然汉语语序表达头衔。
theological_decisions:
- issue: 臣服巴比伦统治的政治命令
  choice: 直译为把颈项放在巴比伦王的轭下，并服侍他和他的人民
  alternative: 泛化为谦卑、属灵顺服或接受一般性的管教
  rationale: 原文指向具体历史处境中的政治臣服；译文保留这一令人紧张的先知性命令，不将其灵意化或淡化。
- issue: וִחְיוּ 的命令与结果关系
  choice: 正文作“并且存活”，脚注说明也可按结果理解
  alternative: 直接译为“你们就会存活”或“好使你们存活”
  rationale: 连接词加命令式既可维持并列命令，也可能含结果或目的意味；正文保留形式上的简洁和歧义，脚注交代其他理解。
translation_notes:
  register: 采用庄重而清楚的现代标准普通话。“颈项”和“轭”保留先知话语的具体意象；“照这一切话”略带正式色彩，但自然可懂，并体现原文 כְּכָל 的结构。所有脚注标记均已置于正文相应位置。
