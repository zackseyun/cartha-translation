source:
  edition: WLC
  text: וְ/הָיָ֨ה הַ/גּ֜וֹי וְ/הַ/מַּמְלָכָ֗ה אֲשֶׁ֨ר לֹֽא יַעַבְד֤וּ אֹת/וֹ֙ אֶת נְבוּכַדְנֶאצַּ֣ר מֶֽלֶךְ בָּבֶ֔ל וְ/אֵ֨ת אֲשֶׁ֤ר לֹֽא יִתֵּן֙ אֶת צַוָּאר֔/וֹ בְּ/עֹ֖ל מֶ֣לֶךְ בָּבֶ֑ל בַּ/חֶרֶב֩ וּ/בָ/רָעָ֨ב וּ/בַ/דֶּ֜בֶר אֶפְקֹ֨ד עַל הַ/גּ֤וֹי הַ/הוּא֙ נְאֻם יְהוָ֔ה עַד תֻּמִּ֥/י אֹתָ֖/ם בְּ/יָדֽ/וֹ־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/027/008.yaml
  text: And it shall be that the nation or the kingdom that will not serve him[a], Nebuchadnezzar king of Babylon, and that will not put its neck under the yoke of the king of Babylon, I will punish that nation with the sword, with famine, and with pestilence, declares Yahweh[c][b], until I have finished them by his hand.
translation:
  language: zh_hans
  text: “任何国家或王国[a]，若不臣服于巴比伦王尼布甲尼撒，也不把自己的颈项置于巴比伦王的轭下[b]，我必以刀剑、饥荒和瘟疫惩罚那国——这是雅威的宣告——直到我借他的手把他们除尽[c]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文作“国家和王国”；这两个政治称谓在这里构成分配式警告，意指任何拒绝巴比伦统治的政权。
    reason: lexical_alternative
  - marker: b
    text: “把颈项置于轭下”是屈服于巴比伦统治的比喻。
    reason: cultural_note
  - marker: c
    text: “除尽”也可译作“使他们终结”；原文强调使之彻底结束，并未在这个动词本身限定具体方式。
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיָה הַגּוֹי וְהַמַּמְלָכָה אֲשֶׁר
  choice: 任何国家或王国，若
  rationale: 希伯来文以“国家和王国”并列，语用上是针对任何拒绝归顺的政治实体作分配式警告；中文用“任何……或……”自然表达这一点，同时在脚注保留字面的“和”。
- source_word: יַעַבְדוּ אֹתוֹ אֶת נְבוּכַדְנֶאצַּר
  choice: 臣服于他，就是……尼布甲尼撒
  rationale: עבד 在此指受帝王统治、向其效忠，不只是一般的服事或劳作；保留“他”及其后的同位说明，以反映原文结构。
- source_word: יִתֵּן אֶת צַוָּארוֹ בְּעֹל
  choice: 把颈项放在……的轭下
  rationale: 保留负轭象征屈服于统治的具体比喻，并采用现代中文可理解的表达。
- source_word: בַּחֶרֶב וּבָרָעָב וּבַדֶּבֶר
  choice: 用刀剑、饥荒和瘟疫
  rationale: 准确保留耶利米书反复出现的三重审判用语；“瘟疫”比泛称“疾病”更贴合 דֶּבֶר。
- source_word: אֶפְקֹד עַל
  choice: 惩罚
  rationale: פקד 与 עַל 连用且处于审判语境时，表示追讨罪责、施行惩罚；直译为“眷顾”会在现代中文中造成反义误解。
- source_word: נְאֻם יְהוָה
  choice: 这是雅威的宣告
  rationale: 以庄重而自然的中文呈现先知宣告公式，并直接音译神名。
- source_word: עַד תֻּמִּי אֹתָם
  choice: 直到我……把他们除尽
  rationale: תמם 表示使之达到终结；“除尽”传达审判中的彻底终结，又不额外指定具体毁灭方式。
- source_word: בְּיָדוֹ
  choice: 借他的手
  rationale: 保留“手”这一希伯来语施事惯用语；此处“他”回指尼布甲尼撒。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文明确使用四字神名；“雅威”直接呈现专名，既不以称号替代，也不把后起读法写入正文。
- issue: 审判终点 עַד תֻּמִּי אֹתָם 的力度
  choice: 直到我借他的手把他们除尽
  alternative: 直到我借他的手使他们终结；直到我借他的手将他们灭尽
  rationale: 保留彻底终结的严厉含义，但不把词义收窄为某一种具体死亡或毁灭方式。
- issue: 单数“那国”与复数“他们”的张力
  choice: 保留“那国……他们”
  alternative: 统一译为“那个国家……它”
  rationale: 原文先以单数 הַגּוֹי הַהוּא 指称受罚实体，随后以复数 אֹתָם 指其所涵盖的群体；正文保留这一数的转换，不静默消解。
translation_notes:
  register: 采用现代、庄重而易懂的先知性文体。“臣服”“颈项”“轭”“宣告”等词保留原文的政治与审判意象。将较长的希伯来句式分为两句，以免中文主干失焦，同时保留条件、惩罚和终点三层逻辑。
