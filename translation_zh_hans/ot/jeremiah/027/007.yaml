  text: וְ/עָבְד֤וּ אֹת/וֹ֙ כָּל הַ/גּוֹיִ֔ם וְ/אֶת בְּנ֖/וֹ וְ/אֶֽת בֶּן בְּנ֑/וֹ עַ֣ד בֹּא עֵ֤ת אַרְצ/וֹ֙ גַּם ה֔וּא וְ/עָ֤בְדוּ ב/וֹ֙ גּוֹיִ֣ם רַבִּ֔ים וּ/מְלָכִ֖ים גְּדֹלִֽים־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/027/007.yaml
  text: All the nations will serve him[a], and his son, and his grandson, until the time of his own land comes[c][b]; then many nations and great kings will make even him serve them.
translation:
  language: zh_hans
  text: 列国都要服事他、他的儿子和他的孙子[a]，直到他的国土的时日来到[b]；那时，连他也要被许多国家和强大的君王役使[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“他的儿子和他儿子的儿子”。
    reason: lexical_alternative
  - marker: b
    text: 也可较直译为“直到他国土的时日来到”，指与巴比伦本国有关的既定时日。
    reason: lexical_alternative
  - marker: c
    text: 原文较字面可译为“许多国家和强大的君王要借着他服役／使用他”；在上下文中，意思是他们将使他服役、支配他。
    reason: alternative_reading
lexical_decisions:
- source_word: וְעָבְדוּ אֹתוֹ
  choice: 要服事他
  rationale: עבד在此处表示列国臣服于统治者或帝国；“服事”既保留原词，又能表达政治上的隶属。
- source_word: כָּל הַגּוֹיִם
  choice: 列国
  rationale: גּוֹיִם在本节指受巴比伦支配的各政治实体；“列国”简洁、庄重，也不带后来的宗教性含义。
- source_word: וְאֶת בְּנוֹ וְאֶת בֶּן בְּנוֹ
  choice: 他的儿子和他的孙子
  rationale: “孙子”自然表达希伯来语字面上的“儿子的儿子”，并保留王朝延续之意。
- source_word: עַד בֹּא עֵת אַרְצוֹ
  choice: 直到他本国的时刻来到
  rationale: 原文是压缩且略带含混的表达，意为与其本国有关的时刻来到；正文不直接增添“受审判”等解释，以保留原文张力。
- source_word: גַּם הוּא
  choice: 那时，连他也
  rationale: “连他也”明确保留גַּם הוּא的强调，突显此前支配列国者自身也将遭遇权势逆转。
- source_word: וְעָבְדוּ בוֹ
  choice: 要被……役使
  rationale: עבד带介词ב在这里表示将劳役或服事加在对象身上，而不是继续“服事他”；“被役使”清楚表达这一逆转，同时避免过度扩写。
- source_word: גּוֹיִם רַבִּים וּמְלָכִים גְּדֹלִים
  choice: 许多国家和强大的君王
  rationale: “许多国家”体现政治范围，“强大的君王”在王权语境中自然传达גְּדֹלִים。
theological_decisions:
- issue: 末句所表达的巴比伦权势逆转
  choice: 许多国家和强大的君王将役使他
  alternative: 许多国家和强大的君王将利用他为自己效力
  rationale: 上下文表明巴比伦的支配是暂时的，之后它自身将受制于人。被动式“被……役使”符合וְעָבְדוּ בוֹ在此处的句法和语境，又没有进一步指定这一逆转的具体历史方式。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“列国”“服事”保持先知文学的语体；“他本国的时刻”有意保留希伯来语的压缩表达，并以脚注说明；末句用“被……役使”自然呈现权势逆转。
