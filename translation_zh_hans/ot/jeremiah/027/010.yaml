  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כִּ֣י שֶׁ֔קֶר הֵ֖ם נִבְּאִ֣ים לָ/כֶ֑ם לְמַ֨עַן הַרְחִ֤יק אֶתְ/כֶם֙ מֵ/עַ֣ל אַדְמַתְ/כֶ֔ם וְ/הִדַּחְתִּ֥י אֶתְ/כֶ֖ם וַ/אֲבַדְתֶּֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/027/010.yaml
  text: For they are prophesying lies to you[a], in order to remove you from your land; and I will drive you out[c][b], and you will perish.
translation:
  language: zh_hans
  text: 因为他们向你们预言的是谎言[a]，为要使你们远离自己的土地[b]；我必把你们赶出去[c]，你们就必灭亡。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “谎言”也可译作“虚假之事”。
    reason: lexical_alternative
  - marker: b
    text: “使你们远离自己的土地”也可译作“把你们远远送离自己的土地”。
    reason: lexical_alternative
  - marker: c
    text: 希伯来文在这里明确转为上帝亲自施行的第一人称表达：“我必把你们赶出去，你们就必灭亡。”
    reason: cross_reference
lexical_decisions:
- source_word: שֶׁקֶר
  choice: 谎言
  rationale: 该词表示虚假、欺骗；“预言的是谎言”在现代汉语中自然，并保留原文对预言内容真实性的直接否定。
- source_word: נִבְּאִים לָכֶם
  choice: 向你们预言
  rationale: נבא 的尼法勒分词在此表示持续进行的说预言行为；汉语无需另加进行体标记也能自然表达其语境中的持续性。
- source_word: לְמַעַן
  choice: 为要
  rationale: 保留目的意味，同时不排除由此产生结果的语义张力。
- source_word: הַרְחִיק אֶתְכֶם מֵעַל אַדְמַתְכֶם
  choice: 使你们远离自己的土地
  rationale: רחק 的使役式表达使之远离；“远离自己的土地”兼顾使役与空间分离，也符合流亡语境。
- source_word: אַדְמַתְכֶם
  choice: 自己的土地
  rationale: אֲדָמָה 可指地土或土地；此处关乎被逐离本土，译作“土地”最自然。“自己的”清楚回指听众。
- source_word: וְהִדַּחְתִּי אֶתְכֶם
  choice: 我必把你们赶出去
  rationale: נדח 的使役式含赶走、驱逐之意；此译法有力度，并清楚保留上帝第一人称的主动施行。
- source_word: וַאֲבַדְתֶּם
  choice: 你们就必灭亡
  rationale: אבד 在此表示灭亡、毁灭；“就”显明前后相继或结果关系，而不额外限定灭亡的具体方式。
theological_decisions:
- issue: 审判过程中的施事者
  choice: 先陈述假先知说谎，为要使百姓远离土地；随后以第一人称明确宣告“我必把你们赶出去”。
  alternative: 把整段驱离行动都理解为假先知所施行。
  rationale: 希伯来文先用 לְמַעַן הַרְחִיק 表达假预言所指向的目的或结果，随后在 וְהִדַּחְתִּי 中转为明确的第一人称神圣施事。译文保留这种施事转换和其中的神学张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“为要”保留目的意味；分号标示从假先知的虚假预言转到上帝亲自施行审判的结构变化。所有代词均按复数听众处理。
