  rationale: 修订保留原文的主语强调、创造行为、能力与伸臂的意象，以及上帝分配大地的主权。以“我看为合宜的人”对应בְּעֵינַי，同时不把原文简洁的判断关系扩展为明确的“把地给谁合宜”。以“地面上的动物”避免“走兽”可能造成的范围缩窄。
