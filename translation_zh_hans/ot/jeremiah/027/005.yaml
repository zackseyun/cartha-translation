source:
  edition: WLC
  text: אָנֹכִ֞י עָשִׂ֣יתִי אֶת הָ/אָ֗רֶץ אֶת הָ/אָדָ֤ם וְ/אֶת הַ/בְּהֵמָה֙ אֲשֶׁר֙ עַל פְּנֵ֣י הָ/אָ֔רֶץ בְּ/כֹחִ/י֙ הַ/גָּד֔וֹל וּ/בִ/זְרוֹעִ֖/י הַ/נְּטוּיָ֑ה וּ/נְתַתִּ֕י/הָ לַ/אֲשֶׁ֖ר יָשַׁ֥ר בְּ/עֵינָֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/027/005.yaml
  text: I myself made the earth[a], mankind, and the animals that are on the face of the earth, by my great power and by my outstretched arm, and I give it to whomever is right in my eyes.
translation:
  language: zh_hans
  text: “我亲自用我的大能和伸出的膀臂造了大地、人类和地面上的动物；我把它赐给我看为合宜的人。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָנֹכִי
  choice: 是我
  rationale: 独立代词在动词已含第一人称主语之外另加重音；“是我”以自然中文保留强调。
- source_word: עָשִׂיתִי
  choice: 造了
  rationale: עשה的基本义是“做、制造”；在天地受造语境中译作“造了”自然，但不特意引入ברא的专门措辞。
- source_word: הָאָרֶץ
  choice: 大地
  rationale: 本句把它与人类及地面上的走兽并列，范围是整个大地，而非某一地区或国土。
- source_word: הָאָדָם
  choice: 人类
  rationale: 带冠词的单数אָדָם在此代表整个人类；现代汉语“人类”既清楚表达集合意义，也避免把它误解为某一个男人。
- source_word: הַבְּהֵמָה
  choice: 走兽
  rationale: 该单数名词在此作集合用；“走兽”保留陆生动物的语义色彩和庄重文体，又不缩窄为牲畜。
- source_word: אֲשֶׁר עַל־פְּנֵי הָאָרֶץ
  choice: 地面上的
  rationale: 简洁而准确地表达“在大地表面”的希伯来语关系从句，符合现代中文表达。
- source_word: בְּכֹחִי הַגָּדוֹל
  choice: 用我的大能
  rationale: 工具性的ב以“用”表达；“大能”在庄重中文中自然传达强大能力。
- source_word: וּבִזְרוֹעִי הַנְּטוּיָה
  choice: 和伸出的膀臂
  rationale: 保留神以伸臂施展能力的拟人意象；“膀臂”庄重且易懂。
- source_word: וּנְתַתִּיהָ
  choice: 就把它给谁
  rationale: 依上下文将完成式理解为上帝持续行使的主权性处置；代词“它”回指大地。
- source_word: לַאֲשֶׁר יָשַׁר בְּעֵינָי
  choice: 我看把大地给谁合宜
  rationale: 保留“在我眼中为正/合宜”的判断视角，同时用自然中文明确：所判断的是把大地赐给何人合宜，并非宣称该人本身道德正直。
theological_decisions:
- issue: 创造语境中אָדָם的代表性单数
  choice: 人类
  alternative: 那人／世人
  rationale: 原文形态为单数，但在“大地、人、走兽”的创造性总括中代表全人类；中文不必以形式上的单数来承载这一集合意义。
- issue: יָשַׁר בְּעֵינַי所修饰的判断
  choice: 我看把大地给谁合宜
  alternative: 谁在我眼中是正直的／我看谁合意
  rationale: 原文可直译为“给在我眼中为正的那人”，但语境重点是上帝按自己的判断分配大地。所选译文避免把这句话单向解释为受赐者具有道德义，同时保留上帝判断标准的张力。
- issue: וּנְתַתִּיהָ的时态体意义
  choice: 就把它给谁
  alternative: 我已经把它给了谁／我要把它给谁
  rationale: 完成式在此可陈述主权事实，并在后文落实于具体授予；中文采用不标明严格时间的常态表达，避免过度限定为过去或未来。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。语序先陈述创造，再陈述分配大地的主权；保留“大能”和“伸出的膀臂”的圣经意象。无脚注标记。
