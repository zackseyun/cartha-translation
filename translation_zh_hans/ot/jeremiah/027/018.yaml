id: JER.27.18
reference: Jeremiah 27:18
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/אִם נְבִאִ֣ים הֵ֔ם וְ/אִם יֵ֥שׁ דְּבַר יְהוָ֖ה אִתָּ֑/ם יִפְגְּעוּ נָא֙ בַּֽ/יהוָ֣ה צְבָא֔וֹת לְ/בִלְתִּי בֹ֜אוּ הַ/כֵּלִ֣ים הַ/נּוֹתָרִ֣ים בְּ/בֵית יְהוָ֗ה וּ/בֵ֨ית מֶ֧לֶךְ יְהוּדָ֛ה וּ/בִ/ירוּשָׁלִַ֖ם בָּבֶֽלָ/ה־־־־־׀־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/027/018.yaml
  text: But if they are prophets[a], and if the word of Yahweh is with them, let them now plead with Yahweh of hosts that the vessels remaining in the house of Yahweh, in the house of the king of Judah[c][b], and in Jerusalem may not go to Babylon.
translation:
  language: zh_hans
  text: 但他们若是先知，若雅威的话与他们同在，就让他们向万军之雅威恳求[a]，使留在雅威的殿、犹大王宫和耶路撒冷的器皿不至于到巴比伦[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“向万军之雅威代求。”这里的希伯来语动词既可表示恳求，也可表示代求。
    reason: lexical_alternative
  - marker: b
    text: 直译：“到巴比伦。”原文动词通常意为“来、到”；按此处语境，汉语译为“到巴比伦”最自然。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם נְבִאִים הֵם
  choice: 但他们若真是先知
  rationale: וְאִם在上下文中引出带有反诘意味的条件挑战；“但……若真是”以自然汉语体现其对比和质疑语气，同时保留条件性。נְבִאִים按通常意义译为“先知”。
- source_word: וְאִם יֵשׁ דְּבַר יְהוָה אִתָּם
  choice: 若雅威的话与他们同在
  rationale: 贴近希伯来语存在句及אִתָּם“与他们同在”的表达，不将其过度解释为他们必然拥有真实启示。
- source_word: יִפְגְּעוּ נָא בַּיהוָה צְבָאוֹת
  choice: 就让他们向万军之雅威恳求
  rationale: פגע与ב连用可指恳求或代求；“恳求”在现代汉语中自然，并保留祈求的迫切意味。נָא的催促语气由“就让他们”及上下文体现。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以“雅威”音译四字神名，表明原文使用的是专名，而非普通称号“主”。
- source_word: יְהוָה צְבָאוֹת
  choice: 万军之雅威
  rationale: 保留צְבָאוֹת“众军、万军”的意象及其与神名构成的称号，避免笼统改译为“全能者”。
- source_word: הַכֵּלִים הַנּוֹתָרִים
  choice: 所剩的器皿
  rationale: 指尚未被掳走的圣殿及王室器物；“器皿”既能涵盖礼仪用品，也保留原词的具体物件含义。
- source_word: בְּבֵית יְהוָה
  choice: 雅威殿中
  rationale: בֵית יְהוָה字面为“雅威的殿宇／家”；在此明确指圣殿，汉语译作“雅威殿”简洁清楚。
- source_word: וּבֵית מֶלֶךְ יְהוּדָה
  choice: 犹大王宫中
  rationale: 字面为“犹大王的家”；在王室建筑和财物语境中，“王宫”是自然且准确的现代汉语表达。
- source_word: לְבִלְתִּי בֹאוּ ... בָּבֶלָה
  choice: 不被运到巴比伦
  rationale: 原文按器皿作主语，字面是“不来到巴比伦”；汉语从说话地点的视角自然表达为“不被运到巴比伦”，并明确这里所说的是器物遭转移。
theological_decisions:
- issue: 四字神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华／上主
  rationale: 原文使用神的专名；音译“雅威”保存专名性质，避免把它化为一般称号。
- issue: יִפְגְּעוּ在先知语境中的含义
  choice: 恳求
  alternative: 代求
  rationale: 经文挑战这些自称为先知的人向神祈求；原动词可涵盖恳求和代求。正文采用较宽泛的“恳求”，脚注保留“代求”的可能，不将其固定为技术性神学术语。
- issue: 条件句对这些先知身份的态度
  choice: 若真是先知
  alternative: 若是先知
  rationale: 上下文具有挑战和质疑意味；“真”体现语用上的真伪对照，却仍将判断置于条件句中，没有直接替经文下定论。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“雅威殿”“万军之雅威”保留经文的圣殿和神名用语；句法稍作汉语化处理，以“被运到”自然表达器皿被带往巴比伦。所有实质性词义歧义均以脚注保留。
