base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/027/020.yaml
  text: which Nebuchadnezzar king of Babylon did not take when he exiled Jeconiah son of Jehoiakim[a], king of Judah, from Jerusalem to Babylon[c][b], along with all the nobles of Judah and Jerusalem.
translation:
  language: zh_hans
  text: 这些器皿，是巴比伦王尼布甲尼撒把犹大王耶哥尼雅[a]——约雅敬的儿子——从耶路撒冷掳到巴比伦，并把犹大和耶路撒冷所有的贵族一同掳去时，没有带走的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “耶哥尼雅”又可译作“耶哥雅斤”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר לֹא לְקָחָם
  choice: 这些器皿……并没有带走
  rationale: 关系代词承接上一节的器皿；为使本节单独阅读时指代清楚，在中文中明示“这些器皿”。לָקַח按语境译为“带走”。
- source_word: נְבוּכַדְנֶאצַּר מֶלֶךְ בָּבֶל
  choice: 巴比伦王尼布甲尼撒
  rationale: 采用现代中文圣经语境中通行的人名音译和自然的头衔次序。
- source_word: בַּגְלוֹתוֹ
  choice: 在把……掳到……时
  rationale: 介词ב加不定式结构表达时间；גלה在此指强制迁徙、放逐，译作“掳到”简洁而贴合历史语境。
- source_word: יְכָונְיָה בֶן־יְהוֹיָקִים מֶלֶךְ יְהוּדָה
  choice: 犹大王约雅敬的儿子耶哥尼雅
  rationale: 保留父子关系和王室身份；“犹大王”在语法上同位说明耶哥尼雅，中文次序同时可能让人短暂理解为修饰约雅敬，因此以脚注说明原文关系。
- source_word: מִירוּשָׁלִַם בָּבֶלָה
  choice: 从耶路撒冷……到巴比伦
  rationale: 准确呈现起点介词מִן与表示趋向的方位词尾־ָה。
- source_word: וְאֵת כָּל חֹרֵי יְהוּדָה וִירוּשָׁלִָם
  choice: 连同犹大和耶路撒冷所有的贵族
  rationale: חֹרֵי在王国政治语境中指有地位的上层人士；“贵族”比宽泛的“官员”更贴近其社会身份，同时“连同”清楚表达这些人也一并被掳。
theological_decisions: []
