  source_fidelity: 译文准确承接上节的器皿，并保留了尼布甲尼撒未带走这些器皿、将耶哥尼雅从耶路撒冷迁至巴比伦，以及一并迁走犹大和耶路撒冷贵族的全部要素。原译中“犹大王约雅敬的儿子耶哥尼雅”会使“犹大王”在中文句法上误修饰约雅敬；希伯来文的“犹大王”同位说明的是耶哥尼雅，须消除这一歧义。
  naturalness: 修订后以破折号标明父子关系，清晰、庄重且符合现代书面中文。将“连同”所引介的人群改为与前一动词并列的“一同掳去”，使其明确是被掳的对象，不会误读为仅是伴随状语。
  terminology: “尼布甲尼撒”“耶哥尼雅”“约雅敬”“犹大”“耶路撒冷”“巴比伦”均为通行中文圣经人地名。“掳到／掳去”在此处适切表达被强制迁徙；“贵族”可恰当对应该政治社会语境中的חֹרֵי。
