revisions:
- from: 这些器皿，巴比伦王尼布甲尼撒在把犹大王约雅敬的儿子耶哥尼雅[a]连同犹大和耶路撒冷所有的贵族，从耶路撒冷掳到巴比伦时，并没有带走。
  to: 这些器皿，是巴比伦王尼布甲尼撒把犹大王耶哥尼雅[a]——约雅敬的儿子——从耶路撒冷掳到巴比伦，并把犹大和耶路撒冷所有的贵族一同掳去时，没有带走的。
  rationale: 修订仅消除了“犹大王”可能误修饰约雅敬的中文歧义，并使“所有的贵族”明确为被一同掳去者。脚注删去“原文在这里称他为犹大王”，因为这一信息已在修订正文中清楚表达，且不再需要用脚注补救句法问题。
