  text: וְ/אַֽל תִּשְׁמְע֞וּ אֶל דִּבְרֵ֣י הַ/נְּבִאִ֗ים הָ/אֹמְרִ֤ים אֲלֵי/כֶם֙ לֵ/אמֹ֔ר לֹ֥א תַעַבְד֖וּ אֶת מֶ֣לֶךְ בָּבֶ֑ל כִּ֣י שֶׁ֔קֶר הֵ֖ם נִבְּאִ֥ים לָ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/027/014.yaml
  text: And do not listen to the words of the prophets who are saying to you[a], ‘You will not serve the king of Babylon,’ for they are prophesying a lie to you.
translation:
  language: zh_hans
  text: 不要听那些先知对你们所说的话；他们对你们说：‘你们不会服事巴比伦王。’[a] 因为他们向你们所说的是虚假的预言。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你们不要服事巴比伦王。”希伯来语形式可以理解为禁令；但按上下文，这里更可能是那些先知的虚假预告，声称犹大不会服事巴比伦王。
    reason: alternative_reading
lexical_decisions:
- source_word: וְאַל תִּשְׁמְעוּ
  choice: 不要听
  rationale: אַל加未完成式表达禁止；שׁמע在此与“话”连用，指听从、听信。中文“不要听”自然保留了听取并采信的含义。句首וְ承接上文，在独立经节中不必机械译出“并且”。
- source_word: אֶל דִּבְרֵי הַנְּבִאִים
  choice: 那些先知对你们所说的话
  rationale: דִּבְרֵי直译为“话”；定冠词指上下文中已知的先知群体，译作“那些先知”较符合现代汉语指称。
- source_word: הָאֹמְרִים אֲלֵיכֶם לֵאמֹר
  choice: 他们说
  rationale: 分词表示这些先知正在或反复宣讲，לֵאמֹר引出直接引语。中文用“他们说”简洁自然；前句已用“对你们所说”交代受话者。
- source_word: לֹא תַעַבְדוּ אֶת מֶלֶךְ בָּבֶל
  choice: 你们不必服事巴比伦王
  rationale: עבד用于君王时指服事、臣服。未完成式在虚假预言的引语中最可能是对未来处境的否定性宣称；“不必服事”自然表达他们声称犹大无须受巴比伦王支配，同时脚注保留禁令读法。
- source_word: כִּי שֶׁקֶר הֵם נִבְּאִים לָכֶם
  choice: 因为他们向你们预言的是谎言
  rationale: כִּי引出不可听信他们的原因。שֶׁקֶר是“虚假、谎言”，与נבא结合表示其预言内容虚假；此译保留“预言”这一动作及其对象。
theological_decisions:
- issue: 虚假先知话语的性质
  choice: 正文理解为虚假的预告：他们声称百姓不必服事巴比伦王。
  alternative: 理解为命令：“不要服事巴比伦王。”
  rationale: 上下文针对那些否认巴比伦统治将临到的先知；引语中的未完成式可表达将来性的宣告。不过希伯来语形式也可读作禁令，因此以脚注保留该真实歧义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“服事巴比伦王”既保持经文语域，也传达臣服于君王的政治含义。正文中的[a]与脚注对应。
