  text: כִּ֣י כֹ֥ה אָמַ֛ר יְהוָ֥ה צְבָא֖וֹת אֱלֹהֵ֣י יִשְׂרָאֵ֑ל עַל הַ/כֵּלִ֗ים הַ/נּֽוֹתָרִים֙ בֵּ֣ית יְהוָ֔ה וּ/בֵ֥ית מֶֽלֶךְ יְהוּדָ֖ה וִ/ירוּשָׁלִָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/027/021.yaml
  text: 'For thus says Yahweh of hosts[a], the God of Israel, concerning the vessels that remain in the house of Yahweh, in the house of the king of Judah[b], and in Jerusalem:'
translation:
  language: zh_hans
  text: 因为万军之耶和华、以色列的上帝，论到那些还留在耶和华殿中、犹大王宫中和耶路撒冷的器具，如此说：
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 本词承接并说明上文，在此具有引出理由的连接作用；译作“因为”既准确又自然。
- source_word: כֹה אָמַר
  choice: 如此说
  rationale: 保留先知传信公式的庄重和宣告性质，并与后续引语自然衔接。
- source_word: יְהוָה צְבָאוֹת
  choice: 万军之耶和华
  rationale: “万军”保留 צְבָאוֹת 所指众军的广度；“耶和华”是现代中文圣经传统中对四字神名的通行音译。
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: 以色列的上帝
  rationale: 直接呈现原文的属格结构及其盟约性称号。
- source_word: עַל
  choice: 论到
  rationale: 此处用于引出神谕所谈论的对象，并非表示敌对意义。
- source_word: הַכֵּלִים הַנּוֹתָרִים
  choice: 那些还留在……的器具
  rationale: “器具”适合圣殿语境而不过度限定具体种类；“还留在”体现此前已有器物被移走的背景。
- source_word: בֵּית יְהוָה
  choice: 耶和华殿中
  rationale: בַּיִת 字面为“房屋”，但在此明确指圣殿；中文用“殿”自然清楚。
- source_word: וּבֵית מֶלֶךְ יְהוּדָה
  choice: 犹大王宫中
  rationale: 这里的“王之房屋”在中文中自然指王宫；该选择准确传达地点而避免“犹大王的家中”的误解。
- source_word: וִירוּשָׁלִָם
  choice: 和耶路撒冷
  rationale: 沿用前置的“留在”，形成“留在……耶路撒冷”的并列地点结构，符合中文习惯。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用四字神名。中文正文采用现代中文基督教读者最熟悉且能明确识别为专名的“耶和华”，而不以“主”这一称号替代；“雅威”是可能的学术音译。
- issue: יְהוָה צְבָאוֹת 的范围
  choice: 万军之耶和华
  alternative: 万军的耶和华／众军之耶和华
  rationale: “万军”保留该称号可能涵盖天上与地上众军的宽广含义，不将其限定为某一种军队。
translation_notes:
  register: 采用庄重而易懂的现代标准普通话。句子保留原文作为后续神谕引言的冒号结构；地点并列采用中文自然表达，并避免不必要的重复。
