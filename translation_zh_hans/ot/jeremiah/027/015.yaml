    rationale: לְמַעַן 通常引出目的；在此审判语境中可同时带有结果色彩，但正文以“致使”单独表达结果，较少保留原文的目的性。用“好让我”更直接，且不表示雅威差派假先知。
  - severity: low
    issue: 末句“都必如此”以省略承接“灭亡”。
    rationale: 汉语虽可理解，但原文明确把“你们”和“向你们说预言的先知”并列为“必灭亡”的主体。补出谓语能更完整、清晰地对应原文。
  - severity: low
