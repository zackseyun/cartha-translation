  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כִּ֣י לֹ֤א שְׁלַחְתִּי/ם֙ נְאֻם יְהוָ֔ה וְ/הֵ֛ם נִבְּאִ֥ים בִּ/שְׁמִ֖/י לַ/שָּׁ֑קֶר לְמַ֨עַן הַדִּיחִ֤/י אֶתְ/כֶם֙ וַ/אֲבַדְתֶּ֔ם אַתֶּ֕ם וְ/הַ/נְּבִאִ֖ים הַֽ/נִּבְּאִ֥ים לָ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/027/015.yaml
  text: For I did not send them[a], declares Yahweh, and they are prophesying falsely in my name, so that I may drive you out[b], and you will perish—you and the prophets who are prophesying to you.
translation:
  language: zh_hans
  text: 因为我并没有差派他们[a]——这是雅威的宣告——他们却奉我的名说虚假的预言，好让我把你们赶出去[b]；你们和那些向你们说预言的先知都必灭亡。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作：“他们奉我的名说的是谎言。”
    reason: 原文“奉我的名……虚假地说预言”可按“说谎言”理解。
  - marker: b
    text: “赶出去”也可译作“驱逐”或“逐走”。这里的希伯来语动词可指使人离开或被逐走；“好让”所译的连接词也可表达结果，即“以致”。
    reason: 注明 נדח 的词义范围，并保留 לְמַעַן 在目的与结果之间的语义张力。
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，说明警告的缘由；现代汉语中“因为”比“因”更自然清楚。
- source_word: לֹא שְׁלַחְתִּים
  choice: 我并没有差派他们
  rationale: 准确表达否定的完成式及第三人称复数宾语；“并没有”加强与他们自称受差派之间的反差。
- source_word: נְאֻם יְהוָה
  choice: 这是雅威的宣告
  rationale: 保留庄重的先知宣告公式，并直接音译神的专名 יהוה。
- source_word: וְהֵם נִבְּאִים בִּשְׁמִי לַשָּׁקֶר
  choice: 他们却奉我的名说虚假的预言
  rationale: “却”自然呈现希伯来语并列在语境中的对比；“奉我的名”表达借神之名与权柄发言；“说虚假的预言”保留 נבא 与 שקר 的搭配。
- source_word: לְמַעַן
  choice: 致使
  rationale: 该连接词可表达目的或结果；此处用“致使”保留由假预言引向审判后果的关系，而不把神描写成差派假先知。
- source_word: הַדִּיחִי אֶתְכֶם
  choice: 我把你们赶出去
  rationale: 在流亡审判的语境中，נדח 的使役形表示赶离、逐出；“赶出去”自然且不额外限定具体地点。
- source_word: וַאֲבַדְתֶּם
  choice: 你们就必灭亡
  rationale: 此完成式在预言序列中指将来的确定结果；“灭亡”保留遭毁灭、归于败亡的宽泛含义。
- source_word: אַתֶּם וְהַנְּבִאִים הַנִּבְּאִים לָכֶם
  choice: 你们和那些向你们说预言的先知都必如此
  rationale: 明确包括听从者和对他们说预言的先知；“都必如此”承接“灭亡”，避免汉语中生硬重复，同时保留共同结局。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文使用四字神名；“雅威”较直接反映学界通常重构的读音，并将其作为专名呈现。
- issue: לְמַעַן 所表达的目的或结果
  choice: 致使我把你们赶出去
  alternative: 为要使我把你们赶出去
  rationale: לְמַעַן 可表达目的或结果。采用“致使”保留审判因假预言而临到的逻辑，同时避免暗示神差派这些假先知以达成欺骗目的；脚注说明另一种句法理解。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。以破折号标示先知宣告公式，保持句意清晰；用“奉我的名”“说预言”“灭亡”等常用宗教语汇，但避免古奥句式。
