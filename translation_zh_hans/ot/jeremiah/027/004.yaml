  text: וְ/צִוִּיתָ֣ אֹתָ֔/ם אֶל אֲדֹֽנֵי/הֶ֖ם לֵ/אמֹ֑ר כֹּֽה אָמַ֞ר יְהוָ֤ה צְבָאוֹת֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל כֹּ֥ה תֹֽאמְר֖וּ אֶל אֲדֹֽנֵי/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/027/004.yaml
  text: 'And command them to say to their masters[a], ‘Thus says Yahweh of hosts, the God of Israel: Thus you shall say to your masters,’'
translation:
  language: zh_hans
  text: 你要吩咐他们对他们的君王[a]说：“万军之雅威——以色列的上帝——如此说：你们要对你们的君王这样说：”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“他们的主”；本节指差遣这些使臣的各国君王。后文“你们的君王”使用的是同一个词。
    reason: 说明原词的字面意义、上下文所指及两处用词的一致性。
lexical_decisions:
- source_word: וְצִוִּיתָ
  choice: 你要吩咐
  rationale: 该形式在连续指令中承接上文，具有命令意味；译为“你要吩咐”既保留第二人称单数，也符合现代汉语表达。
- source_word: אֹתָם
  choice: 他们
  rationale: 指上文提到的各国使臣。
- source_word: אֶל אֲדֹנֵיהֶם / אֶל אֲדֹנֵיכֶם
  choice: 对他们的君王 / 对你们的君王
  rationale: אדון本义为“主、主人、掌权者”；此处所指是使臣所属各国的统治者。结合上下文译作“君王”，比“主人”更准确自然，并分别保留第三人称复数和第二人称复数的领属变化。
- source_word: לֵאמֹר
  choice: 说
  rationale: 引出所吩咐的话；与“去对……说”组合，形成自然的现代汉语句式。
- source_word: כֹּה אָמַר
  choice: 如此说
  rationale: 保留先知信息中固定的使者宣告格式，同时使用庄重而通顺的汉语。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以音译呈现四字神名，而不以“主”这一称号替代，从而保留专名性质，并避免与本节指人间掌权者的אדון混淆。
- source_word: צְבָאוֹת
  choice: 万军之
  rationale: 在固定称号中表示军旅或众军；“万军之雅威”保留传统经文语体及其广阔、威严的意涵。
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: 以色列的上帝
  rationale: 按原文组合关系直译，清楚表达雅威与以色列的关系。
- source_word: כֹּה תֹּאמְרוּ
  choice: 你们要……这样说
  rationale: 保留第二人称复数及其指令语气；调整词序以符合现代汉语习惯。
theological_decisions:
- issue: 四字神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文使用上帝的专名而非“主”这一称号。“雅威”是较直接的现代汉语音译；“耶和华”虽为历史悠久且广为人知的传统译名，但反映了较早的拟音形式。
- issue: אדון在本节所指的身份
  choice: 君王
  alternative: 主人／主上
  rationale: 上下文说明受话者是奉各国君王差遣而来的使臣，因此此词在这里指人间统治者。译作“君王”明确其政治身份，又不把它误作神圣称号。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。保留“如此说”这一先知宣告公式；用“去对……说”理顺希伯来语连续指令在汉语中的关系。引号结尾的冒号表明下一节将继续引述信息。
