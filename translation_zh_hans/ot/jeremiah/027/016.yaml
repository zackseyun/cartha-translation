source:
  edition: WLC
  text: וְ/אֶל הַ/כֹּהֲנִים֩ וְ/אֶל כָּל הָ/עָ֨ם הַ/זֶּ֜ה דִּבַּ֣רְתִּי לֵ/אמֹ֗ר כֹּה֮ אָמַ֣ר יְהוָה֒ אַֽל תִּשְׁמְע֞וּ אֶל דִּבְרֵ֣י נְבִֽיאֵי/כֶ֗ם הַֽ/נִּבְּאִ֤ים לָ/כֶם֙ לֵ/אמֹ֔ר הִנֵּ֨ה כְלֵ֧י בֵית יְהוָ֛ה מוּשָׁבִ֥ים מִ/בָּבֶ֖לָ/ה עַתָּ֣ה מְהֵרָ֑ה כִּ֣י שֶׁ֔קֶר הֵ֖מָּה נִבְּאִ֥ים לָ/כֶֽם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/027/016.yaml
  text: 'And to the priests and to all this people I spoke[a], saying, “Thus says Yahweh: Do not listen to the words of your prophets who are prophesying to you, saying, ‘Behold, the vessels of the house of Yahweh are being brought back from Babylon now, quickly,’ for they are prophesying falsely to you.”'
translation:
  language: zh_hans
  text: 我也对祭司和这所有的百姓说：“雅威如此说：不要听你们的先知向你们所说的话；他们预言说：‘看哪，雅威殿的器皿现在很快就会从巴比伦运回来[a]。’因为他们向你们所说的预言是假的。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“现在，迅速地从巴比伦运回来。”希伯来文直译为“现在，迅速地”，强调这些先知声称此事迫在眉睫。
    reason: 说明时间副词 עַתָּה מְהֵרָה 的直译形式及其所强调的迫近性。
lexical_decisions:
- source_word: וְאֶל הַכֹּהֲנִים וְאֶל כָּל הָעָם הַזֶּה
  choice: 我又对祭司和这全体百姓
  rationale: “又”承接上文的叙事进程；“祭司”和“这全体百姓”保留两个受话群体以及指示词 הַזֶּה。
- source_word: דִּבַּרְתִּי לֵאמֹר
  choice: 说
  rationale: 希伯来语“说话……说”在现代汉语中若机械复现会显得累赘；用“说”自然地引出直接引语，同时不损失信息。
- source_word: כֹּה אָמַר יְהוָה
  choice: 雅威如此说
  rationale: 保留先知宣告的固定公式，并以“雅威”音译神名 יהוה。
- source_word: אַל תִּשְׁמְעוּ אֶל דִּבְרֵי נְבִיאֵיכֶם
  choice: 不要听你们的先知向你们所说的话
  rationale: “听”在此包含听从、采信之意；保留“你们的先知”和具体的“话”。
- source_word: הַנִּבְּאִים לָכֶם לֵאמֹר
  choice: 他们预言说
  rationale: 分句处理以避免汉语句子过度嵌套，并保留分词所表达的正在进行的宣讲活动。
- source_word: הִנֵּה
  choice: 看哪
  rationale: 保留提示注意和加强临场感的功能，同时符合庄重的经文语体。
- source_word: כְלֵי בֵית יְהוָה
  choice: 雅威殿里的器皿
  rationale: “器皿”可涵盖圣殿中被掳走的礼仪用具；“殿”在汉语中自然表达“雅威的殿宇”，未把器皿泛化为普通物品。
- source_word: מוּשָׁבִים מִבָּבֶלָה
  choice: 要从巴比伦运回来
  rationale: Hophal被动使役形式表示这些器皿被带回；“运回来”适合器物，也保留被动事件的实际含义。
- source_word: עַתָּה מְהֵרָה
  choice: 很快就要
  rationale: 以自然现代汉语表达假先知所宣称的迫近性；希伯来语较直译的形式在脚注中说明。
- source_word: כִּי שֶׁקֶר הֵמָּה נִבְּאִים לָכֶם
  choice: 因为他们向你们预言的是谎言
  rationale: 将 שֶׁקֶר 保留为名词性的“谎言”，明确否定预言内容的真实性，而不额外判定先知的身份或动机。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名；音译为“雅威”保留专名性质，避免以称号替代。
- issue: 假先知信息的性质
  choice: 他们向你们预言的是谎言
  alternative: 他们向你们作虚假的预言
  rationale: 原文以名词 שֶׁקֶר 强调所预言的内容是虚假之事；此译法保留这一断言，又不添加原文没有明说的心理动机。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“看哪”“雅威如此说”保留先知文体的庄严感；其余句法按现代汉语调整，避免生硬仿译。脚注标记置于其实际解释的“很快就要从巴比伦运回来”之后。
