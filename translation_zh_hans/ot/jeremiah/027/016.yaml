revisions:
- from: 我又对祭司和这全体百姓说：“雅威如此说：不要听你们的先知向你们所说的话。他们预言说：‘看哪，雅威殿里的器皿很快就要从巴比伦运回来了[a]。’因为他们向你们预言的是谎言。”
  to: 我也对祭司和这所有的百姓说：“雅威如此说：不要听你们的先知向你们所说的话；他们预言说：‘看哪，雅威殿的器皿现在很快就会从巴比伦运回来[a]。’因为他们向你们所说的预言是假的。”
  rationale: 删去会额外暗示“再次”的“又”，并将不自然的“这全体百姓”改为“这所有的百姓”。主文改为“现在很快就会”，保留 עַתָּה 与 מְהֵרָה 的双重时间强调；脚注相应与主文区分，提供较贴近原文语序的译法。末句改为“向你们所说的预言是假的”，自然表达 כִּי שֶׁקֶר הֵמָּה נִבְּאִים לָכֶם，且不添加对先知动机的判断。
