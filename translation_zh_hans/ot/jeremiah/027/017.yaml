source:
  edition: WLC
  text: אַל תִּשְׁמְע֣וּ אֲלֵי/הֶ֔ם עִבְד֥וּ אֶת מֶֽלֶךְ בָּבֶ֖ל וִֽ/חְי֑וּ לָ֧/מָּה תִֽהְיֶ֛ה הָ/עִ֥יר הַ/זֹּ֖את חָרְבָּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/027/017.yaml
  text: Do not listen to them[a]. Serve the king of Babylon and live[b]. Why should this city become a ruin?
translation:
  language: zh_hans
  text: 不要听从他们[a]。要服侍巴比伦王，活下去。这城何必成为废墟[b]呢？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“不要听他们的话。”原文动词既可指听，也可指听从、理会。
    reason: lexical_alternative
  - marker: b
    text: 或译：“荒凉之地。”原文名词指遭毁坏、荒废的状态。
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּשְׁמְעוּ אֲלֵיהֶם
  choice: 不要听从他们
  rationale: שׁמע与אֶל连用可指聆听、理会或听从某人；“听从”在本语境中自然表达不要接受并依从假先知的信息，同时以脚注保留“听”的译法。
- source_word: עִבְדוּ
  choice: 要服侍
  rationale: עבד在这里指向巴比伦王服役并接受其统治；“服侍”保留原文“服事、效力”的宽广含义，而不把政治臣服解释得过窄。
- source_word: אֶת מֶלֶךְ בָּבֶל
  choice: 巴比伦王
  rationale: 这是该希伯来语短语直接、自然的现代汉语表达。
- source_word: וִחְיוּ
  choice: 活下去
  rationale: 原文以连接词加命令式承接前一命令，既可视为并列劝告，也带有结果意味；“活下去”保留简洁有力的命令形式，不明确改写为条件句。
- source_word: לָמָּה תִהְיֶה
  choice: 何必成为
  rationale: לָמָּה引出反问，תִהְיֶה可表达将要成为的状态；“何必成为”自然传达先知劝阻灾祸的反问语气。
- source_word: הָעִיר הַזֹּאת
  choice: 这城
  rationale: 符合希伯来语指示结构，也是在经文语体中简洁自然的现代汉语。
- source_word: חָרְבָּה
  choice: 废墟
  rationale: 该名词表示遭毁坏后的荒废、残破状态；“废墟”具体且符合谓语名词结构，脚注保留“荒凉之地”的可能表达。
theological_decisions: []
translation_notes:
  register: 采用简洁、庄重而易懂的现代标准汉语。两句命令保持原文的紧迫感；末句用“何必……呢”呈现反问。脚注标记均置于其所说明的词语之后，并纠正英语咨询层中第二个标记与其注释对象位置不一致的问题。
