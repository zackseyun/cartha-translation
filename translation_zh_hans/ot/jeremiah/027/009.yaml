id: JER.27.9
reference: Jeremiah 27:9
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ֠/אַתֶּם אַל תִּשְׁמְע֨וּ אֶל נְבִיאֵי/כֶ֜ם וְ/אֶל קֹֽסְמֵי/כֶ֗ם וְ/אֶל֙ חֲלֹמֹ֣תֵי/כֶ֔ם וְ/אֶל עֹֽנְנֵי/כֶ֖ם וְ/אֶל כַּשָּׁפֵי/כֶ֑ם אֲשֶׁר הֵ֞ם אֹמְרִ֤ים אֲלֵי/כֶם֙ לֵ/אמֹ֔ר לֹ֥א תַעַבְד֖וּ אֶת מֶ֥לֶךְ בָּבֶֽל־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/027/009.yaml
  text: But you[a], do not listen to your prophets, your diviners, your dreamers, your soothsayers, or your sorcerers, who are saying to you, ‘You will not serve the king of Babylon.’
translation:
  language: zh_hans
  text: 至于你们，不要听从你们的先知、占卜者、做梦的[a]、观兆者和行巫术的人；他们对你们说：‘你们不会臣服于巴比伦王。’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译为“你们的梦”；在这一连串人物称谓中，这个词很可能代指那些声称从梦中得到启示的人。
    reason: 保留希伯来词的形式意义及其在语境中的转喻可能。
lexical_decisions:
- source_word: וְאַתֶּם
  choice: 至于你们
  rationale: 独立代词带有突出和对比作用；“至于你们”自然保留这一话语转折，而不把连接词机械译成“并且”。
- source_word: אַל תִּשְׁמְעוּ אֶל
  choice: 不要听从
  rationale: שׁמע 与 אֶל 连用表示听取、理会；“听从”在中文中既自然，也体现这里不应接受其言论的禁令。
- source_word: נְבִיאֵיכֶם
  choice: 你们的先知
  rationale: 保留所有格和先知这一常规称谓；不擅自加上“假”字，因为本节借禁令和言论内容显明他们不可信。
- source_word: קֹסְמֵיכֶם
  choice: 占卜者
  rationale: 该词指从事占卜的人；“占卜者”准确、简明，现代读者容易理解。
- source_word: חֲלֹמֹתֵיכֶם
  choice: 解梦者
  rationale: 词形直译是“你们的梦”，但在一连串从业者名称中很可能转喻那些凭梦传递信息的人；正文采用自然的人员称谓，并以脚注保留形式上的歧义。
- source_word: עֹנְנֵיכֶם
  choice: 观兆者
  rationale: 该词表示观察征兆、据兆作判断的人；“观兆者”避免把具体方法限定得超过原文。
- source_word: כַּשָּׁפֵיכֶם
  choice: 行巫术的人
  rationale: כשף 涉及巫术或法术实践；这一表达比生僻名词更适合现代普通读者。
- source_word: אֲשֶׁר הֵם אֹמְרִים אֲלֵיכֶם לֵאמֹר
  choice: 他们对你们说
  rationale: 简洁表达关系从句及其引语功能；中文不必重复翻出“说……说”。
- source_word: לֹא תַעַבְדוּ
  choice: 你们不会臣服于
  rationale: 这里的未完成式在转述的信息中最自然地表示预测，而非命令；对君王而言，עבד 指受其统治、向其效力，“臣服于”清楚表达政治隶属。
- source_word: אֶת מֶלֶךְ בָּבֶל
  choice: 巴比伦王
  rationale: 准确呈现原文的属格结构，也是现代中文惯用表达。
theological_decisions:
- issue: 如何称呼这些不可靠的启示性从业者，而不暗示他们与耶利米同样具有正当权威
  choice: 照原文保留“先知、占卜者、解梦者、观兆者和行巫术的人”等称谓，由“不要听从”及其信息显出其不可靠。
  alternative: 译为“假先知”或“所谓的先知”，直接标明虚假。
  rationale: 本节希伯来文本并未在名词前加“假”或“所谓的”；添加这些词会把上下文判断直接写进称谓，超过本节明说的内容。
- issue: לֹא תַעַבְדוּ 是预测还是命令
  choice: 译为预测：“你们不会臣服于巴比伦王。”
  alternative: 译为禁令：“你们不可臣服于巴比伦王。”
  rationale: 该句处于“他们对你们说”的引语中，未完成式最适合表达这些人所作的保证或预测；若译为命令，会改变其言论性质。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“至于你们”保留话语对比；名单中的术语保持区分，但避免过度生僻。“臣服于”清楚传达此处服事君王所含的政治隶属关系。
