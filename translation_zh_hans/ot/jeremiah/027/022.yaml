  text: בָּבֶ֥לָ/ה יוּבָ֖אוּ וְ/שָׁ֣מָּ/ה יִֽהְי֑וּ עַ֠ד י֣וֹם פָּקְדִ֤/י אֹתָ/ם֙ נְאֻם יְהוָ֔ה וְ/הַֽעֲלִיתִי/ם֙ וַ/הֲשִׁ֣יבֹתִ֔י/ם אֶל הַ/מָּק֖וֹם הַ/זֶּֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/027/022.yaml
  text: They will be brought to Babylon[a], and there they will remain until the day I attend to them, declares Yahweh[b]. Then I will bring them up and restore them to this place.
translation:
  language: zh_hans
  text: 它们必被带到巴比伦，并留在那里，直到我眷顾它们的那日[a]——这是雅威的宣告。那时，我必把它们带上来[b]，使它们回到这地方。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “眷顾”所译的希伯来语也可指“察看”“临到”或“追讨／惩罚”；这里下文所说的是带回与复归。
    reason: 保留 פקד 的多义性，并说明本节上下文使其行动导向恢复。
  - marker: b
    text: “带上来”也可译作“带回来”；原文保留了从被掳之地“上来”的表达。
    reason: 说明希伯来语空间意象及其归回含义。
lexical_decisions:
- source_word: בָּבֶלָה
  choice: 到巴比伦
  rationale: 地名后的方向词尾表示朝向巴比伦；现代汉语用“到巴比伦”自然表达。
- source_word: יוּבָאוּ
  choice: 必被带到
  rationale: 这是 בוא 的使役被动式，表明这些物件由他者带往巴比伦；“被带到”保留被动语态。
- source_word: וְשָׁמָּה יִהְיוּ
  choice: 留在那里
  rationale: 字面为“在那里”，但在此处表达持续处于该地；“留在那里”符合现代汉语并保留延续意味。
- source_word: פָּקְדִי אֹתָם
  choice: 我眷顾它们
  rationale: פקד 可表示察看、介入、追讨或眷顾；下文明确指向带回与复归，因此正文采用合乎语境的“眷顾”，脚注保留词义范围。
- source_word: נְאֻם יְהוָה
  choice: 这是雅威的宣告
  rationale: 这是先知书常见的神谕公式；以“宣告”体现其庄重和权威，并以“雅威”音译神名。
- source_word: וְהַעֲלִיתִים
  choice: 我必把它们带上来
  rationale: עלה 的使役式字面为“使上去、带上来”，也常用于从被掳之地归回；正文保留“上来”的空间意象。
- source_word: וַהֲשִׁיבֹתִים
  choice: 使它们回到
  rationale: שוב 的使役式表示使之返回；“使它们回到”准确连接下文目的地“这地方”。
- source_word: אֶל הַמָּקוֹם הַזֶּה
  choice: 这地方
  rationale: 原文明确说“这地方”，不扩释为“这地”或“耶路撒冷”。
theological_decisions:
- issue: פקד 在复归语境中的语义倾向
  choice: 眷顾，即有利的临到与介入
  alternative: 察看、追讨或较中性的临到
  rationale: 该动词本身可指为审判或施恩而临到；紧接着的“带上来”和“使……回到”表明此处结果是复归。正文体现语境倾向，脚注则避免抹去原词较宽的语义张力。
- issue: וְהַעֲלִיתִים 的归回意象
  choice: 保留“带上来”
  alternative: 直接译为“带回来”
  rationale: “上来”保留从被掳之地返回本地的希伯来空间表达；下一分句再明确说明回到“这地方”，无需将两句合并。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“它们”承接上文所说的圣殿器皿；本节不擅自补出名词。“这是雅威的宣告”保留先知神谕公式的正式语气。
