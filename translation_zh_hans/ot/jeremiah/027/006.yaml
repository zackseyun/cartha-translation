  text: וְ/עַתָּ֗ה אָֽנֹכִי֙ נָתַ֨תִּי֙ אֶת כָּל הָ/אֲרָצ֣וֹת הָ/אֵ֔לֶּה בְּ/יַ֛ד נְבוּכַדְנֶאצַּ֥ר מֶֽלֶךְ בָּבֶ֖ל עַבְדִּ֑/י וְ/גַם֙ אֶת חַיַּ֣ת הַ/שָּׂדֶ֔ה נָתַ֥תִּי ל֖/וֹ לְ/עָבְדֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/027/006.yaml
  text: And now I have given all these lands into the hand of Nebuchadnezzar king of Babylon[a], my servant[b]; and I have also given him the beasts of the field to serve him.
translation:
  language: zh_hans
  text: “现在，是我把这一切土地交在巴比伦王尼布甲尼撒[a]——我的仆人[b]——手中；我也把田野的走兽交给他，让它们服事他。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文中这位王的名字也常音译作“尼布甲尼察”；中文圣经传统通常译作“尼布甲尼撒”。
    reason: lexical_alternative
  - marker: b
    text: “我的仆人”表示尼布甲尼撒在这里被神用作执行旨意的工具，并不表示神认可他的品格或一切行为。
    reason: cultural_note
lexical_decisions:
- source_word: וְעַתָּה
  choice: 现在
  rationale: 作为承接上文并引出当前宣告的话语标记；现代汉语用“现在”自然表达时间推进，句间关系由语境清楚呈现。
- source_word: אָנֹכִי
  choice: 是我
  rationale: 独立人称代词带有强调意味；用“是我”体现说话者对自身行动的强调。
- source_word: נָתַתִּי
  choice: 把……交在……手中／把……交给
  rationale: 完成式在先知性宣告中表示已经作成、现今有效的授予；“交在……手中”兼顾完成性和支配权的转移。
- source_word: כָּל הָאֲרָצוֹת הָאֵלֶּה
  choice: 这一切土地
  rationale: אֲרָצוֹת在此指上下文所涉及的各片领土或邦国；“土地”保留其地域含义，避免把古代政治实体直接现代化为“国家”。
- source_word: בְּיַד
  choice: 交在……手中
  rationale: 保留希伯来语“在手中”的形象，同时自然表达置于某人权下。
- source_word: נְבוּכַדְנֶאצַּר
  choice: 尼布甲尼撒
  rationale: 采用现代中文圣经读者熟悉的巴比伦王名音译。
- source_word: מֶלֶךְ בָּבֶל
  choice: 巴比伦王
  rationale: 简洁、准确地表达其王位及所属国度。
- source_word: עַבְדִּי
  choice: 我的仆人
  rationale: 保留神称异邦君王为“我的仆人”的鲜明神学表述；此处重点是他作为神所使用的执行者，而非其社会身份。
- source_word: וְגַם
  choice: 也
  rationale: 清楚表达在土地之外进一步加上的授予。
- source_word: חַיַּת הַשָּׂדֶה
  choice: 田野的走兽
  rationale: 保留原文的地域意象和集合性表达，指陆地上的野生动物。
- source_word: לְעָבְדוֹ
  choice: 让它们服事他
  rationale: 直接表达不定式所含的目的或结果，并保留受造物服从其统治的拟人化语气。
theological_decisions:
- issue: 神称尼布甲尼撒为“我的仆人”
  choice: 我的仆人
  alternative: 我的奴仆
  rationale: 原文עבד可指仆人或奴隶；这里强调异邦君王被神使用、执行神的旨意，而非界定其法律或社会身份。“仆人”既保留原文的神学张力，也不暗示神赞同他的品格和一切行为。
- issue: 走兽“服事”尼布甲尼撒
  choice: 让它们服事他
  alternative: 使它们归他役使
  rationale: 原文将动物置于君王权下，并使用“服事”一词。译文保留这一较强且略带拟人化的说法，不把它缩减为单纯的所有权。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“现在，是我”体现原文显式主语的强调；“交在……手中”保留希伯来语权力转移的意象。脚注标记均置于正文相关词句之后。
