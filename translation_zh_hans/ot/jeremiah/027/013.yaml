base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/027/013.yaml
  text: Why will you and your people die by the sword, by famine, and by pestilence, just as the LORD has spoken concerning the nation that will not serve the king of Babylon?
translation:
  language: zh_hans
  text: 你和你的百姓为什么要死于刀剑、饥荒和瘟疫呢？这正如耶和华对那不服事巴比伦王的国所说的。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לָמָּה תָמוּתוּ
  choice: 为什么要死……呢
  rationale: 保留反问语气；这里不是询问死因，而是劝阻对方选择一条必致死亡的道路。“要死”在现代汉语中自然传达其意。
- source_word: בַּחֶרֶב בָּרָעָב וּבַדָּבֶר
  choice: 死于刀剑、饥荒和瘟疫
  rationale: 按原文并列三种灾祸；“刀剑”保留战争与杀戮的传统意象，“瘟疫”准确表达דֶּבֶר。
- source_word: כַּאֲשֶׁר
  choice: 正如
  rationale: 表达前述死亡结局与耶和华所宣告之事相符，不弱化原文的比较关系。
- source_word: דִּבֶּר יְהוָה אֶל הַגּוֹי
  choice: 耶和华论到……国家所说的
  rationale: 介词אֶל在此可按语境理解为针对、论及该国的宣告；此译法符合自然汉语，也保留神谕指向。
- source_word: יַעֲבֹד אֶת מֶלֶךְ בָּבֶל
  choice: 服事巴比伦王
  rationale: עבד在政治语境中可指臣服、效劳；采用“服事”保留其较宽语义，并与先知信息中的政治臣服含义相容。
theological_decisions:
- issue: 神名四字神名יהוה的译法
  choice: 耶和华
  alternative: 雅威／上主
  rationale: 采用现代中文圣经读者熟悉的专名形式，明确这是以色列之神的名，不将其泛化为普通称号。
- issue: 灾祸与神言语的关系
  choice: “正如耶和华……所说的”
  alternative: “照耶和华……所说的”
  rationale: 保留原文所呈现的宣告与结局之间的对应关系，不额外断定或削弱其中的神学因果。
translation_notes:
  register: 语言庄重而通俗，采用直接反问，符合先知向君王劝告的语境。保留“刀剑”和“服事”等圣经语体词，但整体句法按现代标准普通话处理。
