  text: וְ/שִׁלַּחְתָּ/ם֩ אֶל מֶ֨לֶךְ אֱד֜וֹם וְ/אֶל מֶ֣לֶךְ מוֹאָ֗ב וְ/אֶל מֶ֨לֶךְ֙ בְּנֵ֣י עַמּ֔וֹן וְ/אֶל מֶ֥לֶךְ צֹ֖ר וְ/אֶל מֶ֣לֶךְ צִיד֑וֹן בְּ/יַ֤ד מַלְאָכִים֙ הַ/בָּאִ֣ים יְרוּשָׁלִַ֔ם אֶל צִדְקִיָּ֖הוּ מֶ֥לֶךְ יְהוּדָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/027/003.yaml
  text: And send them to the king of Edom[a], the king of Moab, the king of the Ammonites, the king of Tyre, and the king of Sidon, by the hand of the messengers who are coming to Jerusalem to Zedekiah king of Judah.
translation:
  language: zh_hans
  text: 你要把这些送给以东王、摩押王、亚扪人[a]的王、推罗王和西顿王，托那些前来耶路撒冷见犹大王西底家的使者带去。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语直译“亚扪的子孙”，即亚扪人。
    reason: 说明原文族群称谓的字面形式。
lexical_decisions:
- source_word: וְשִׁלַּחְתָּם
  choice: 你要把这些送给
  rationale: 该形式在连续指令中具有命令语气；“你要……送给”既保留指令力度，也符合现代汉语表达。“这些”承接上文所指的复数物件。
- source_word: מֶלֶךְ
  choice: 王
  rationale: 构造形式反复连接各国名；汉语以“以东王、摩押王”等表达最自然，无须重复“……的王”。
- source_word: בְּנֵי עַמּוֹן
  choice: 亚扪人
  rationale: 字面为“亚扪的子孙”，在此地缘政治名单中是族群称谓；正文采用现代汉语通行名称，并在脚注保留字面形式。
- source_word: בְּיַד
  choice: 托……带去
  rationale: 该习语表示经由某人之手或以某人为媒介；“托……带去”自然传达使者实际转交这些物件的意思。
- source_word: מַלְאָכִים
  choice: 使者
  rationale: 该词泛指受差遣传递信息或物件的人；语境虽可能指外交使团，但“使者”避免把其正式身份规定得过窄。
- source_word: הַבָּאִים
  choice: 前来
  rationale: 带冠词的分词描述正在来或将要来的使者；“前来”保留其动态意义。
- source_word: אֶל צִדְקִיָּהוּ
  choice: 见……西底家
  rationale: 介词表示使者前往西底家那里；现代汉语以“见犹大王西底家”自然表达来访对象，而不额外断定来访性质。
theological_decisions:
- issue: בְּנֵי עַמּוֹן 的族群表达
  choice: 正文译作“亚扪人”，脚注注明字面为“亚扪的子孙”
  alternative: 正文直译“亚扪的子孙”
  rationale: 此处短语作为民族名称使用，“亚扪人”清楚、自然，也不改变所指群体；脚注保留希伯来语的亲属式表达，避免遮蔽原文措辞。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。列举各国君王时使用简洁的“国名＋王”结构；后半句以“托……带去”清楚表达使者作为转交媒介，同时保留使者前来耶路撒冷见西底家的信息。
