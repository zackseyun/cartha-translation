source:
  edition: WLC
  text: וְ/הַ/גּ֗וֹי אֲשֶׁ֨ר יָבִ֧יא אֶת צַוָּאר֛/וֹ בְּ/עֹ֥ל מֶֽלֶךְ בָּבֶ֖ל וַֽ/עֲבָד֑/וֹ וְ/הִנַּחְתִּ֤י/ו עַל אַדְמָת/וֹ֙ נְאֻם יְהוָ֔ה וַֽ/עֲבָדָ֖/הּ וְ/יָ֥שַׁב בָּֽ/הּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/027/011.yaml
  text: But the nation that brings its neck under the yoke of the king of Babylon and serves him[a], I will let remain on its own land, declares Yahweh[b], and it will till it and dwell in it.
translation:
  language: zh_hans
  text: 但凡把颈项放在巴比伦王的轭下、服事他的国家，我就让那国留在自己的土地上[a]——这是雅威的宣告——那国必耕种那地[b]，住在那里。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“我就把那国留在自己的土地上”或“我就让那国在自己的土地上安歇”。
    reason: 希伯来语动词可表达使其留下，也可含使其安歇、安顿之意。
  - marker: b
    text: 直译“那国必劳作它”，其中“它”指土地；也可译作“那国必开垦那地”。
    reason: עבד与土地连用时通常表示耕作或开垦；直译还会与前面的“服事他”保留同一词根的呼应。
lexical_decisions:
- source_word: הַגּוֹי
  choice: 哪一国
  rationale: גּוֹי在此指处于国际政治关系中的国家或民族；结合אֲשֶׁר所引出的条件性关系，译为“哪一国”自然地表达“那……的国家”。
- source_word: יָבִיא אֶת צַוָּארוֹ בְּעֹל
  choice: 把颈项放在……的轭下
  rationale: 保留希伯来文以颈项负轭来象征政治臣服的具体意象，同时符合现代汉语表达。
- source_word: עֹל מֶלֶךְ בָּבֶל
  choice: 巴比伦王的轭
  rationale: 直译核心意象；“轭”在本章中是臣服于巴比伦统治的关键象征，不宜淡化为“重担”或直接释为“统治”。
- source_word: וַעֲבָדוֹ
  choice: 服事他
  rationale: עבד在此表示臣服并为巴比伦王效力；“服事”既保留动词的宽泛含义，也能涵盖政治上的臣属关系。
- source_word: וְהִנַּחְתִּיו עַל אַדְמָתוֹ
  choice: 我就让那国留在自己的土地上
  rationale: 使役形态在此表示让其留下或安居而不被迁离；“自己的土地”明确呈现第三人称所有关系。
- source_word: נְאֻם יְהוָה
  choice: 这是雅威的宣告
  rationale: נְאֻם是先知书常见的神谕公式；用“宣告”保持庄重语体，并将神名יְהוָה音译为“雅威”。
- source_word: וַעֲבָדָהּ
  choice: 那国必耕种那地
  rationale: 阴性后缀指向“土地”；עבד以土地为宾语时指耕作或治理土地，译为“耕种”在汉语中清楚自然。
- source_word: וְיָשַׁב בָּהּ
  choice: 住在那里
  rationale: ישב在此表示居住；בָּהּ回指土地，汉语用“在那里”避免生硬重复。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；音译“雅威”保留其专名性质，不以称号取代。
- issue: 臣服巴比伦与留在本土之间的关系
  choice: 保留条件性陈述，不增添神学解释
  alternative: 将“负轭”解释性译成“顺服神所设立的巴比伦王”
  rationale: 原文明确说臣服巴比伦王的国家可留在本土，但本节没有明说这种臣服的更广泛神学含义，因此不在正文中补入。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留“颈项”和“轭”的先知性意象；以破折号标示插入的神谕公式，使长句层次清楚。所有脚注标记均置于其所说明的词句之后。
