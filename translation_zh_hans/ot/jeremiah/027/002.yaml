base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/027/002.yaml
  text: 'Thus said Yahweh to me: “Make for yourself bonds and yoke-bars[a], and put them on your neck.”'
translation:
  language: zh_hans
  text: 耶和华对我这样说：“你要为自己制作绳索和轭杠[a]，套在自己的颈项上。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文作“绳索和轭杠”；有些译本简化为“系带和轭”。
    reason: 说明两个轭具相关名词的字面含义及常见简化译法。
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה אֵלַי
  choice: 耶和华对我这样说
  rationale: 保留先知宣告公式及完成式在叙事语境中的过去时意味；אֶל在言说语境中译作“对”。
- source_word: עֲשֵׂה לְךָ
  choice: 你要为自己制作
  rationale: 以“你要”表达命令语气，并用“为自己”保留לְךָ的受益或反身意味。
- source_word: מוֹסֵרוֹת
  choice: 绳索
  rationale: 该复数名词指与轭具相关的捆绑物或系带；“绳索”自然易懂，也不把材质限定为皮带。
- source_word: מֹטוֹת
  choice: 轭杠
  rationale: 该词在此指轭具的杠杆或横木，而不只是泛称整个“轭”；“轭杠”兼顾准确与可读性。
- source_word: וּנְתַתָּם עַל צַוָּארֶךָ
  choice: 套在自己的颈项上
  rationale: 连接式完成形承接前一命令，具有命令效力；结合轭具语境，“套在”比字面的“放在”更自然，复数宾语由上下文涵盖。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。中文圣经传统中“耶和华”辨识度最高，也明确保留专名性质；“雅威”更接近学界常见的拟音，但普通读者较不熟悉。
translation_notes:
  register: 采用现代、庄重而通顺的普通话。“颈项”较“脖子”庄重，适合先知书语体；“这样说”自然保留希伯来文宣告公式。
