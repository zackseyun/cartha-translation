source:
  edition: WLC
  text: כֹּֽה אָמַ֨ר יְהוָ֜ה אֱלֹהֵ֣י יִשְׂרָאֵ֗ל הִנְ/נִ֣י מֵסֵב֮ אֶת כְּלֵ֣י הַ/מִּלְחָמָה֮ אֲשֶׁ֣ר בְּ/יֶדְ/כֶם֒ אֲשֶׁ֨ר אַתֶּ֜ם נִלְחָמִ֣ים בָּ֗/ם אֶת מֶ֤לֶךְ בָּבֶל֙ וְ/אֶת הַ/כַּשְׂדִּ֔ים הַ/צָּרִ֣ים עֲלֵי/כֶ֔ם מִ/ח֖וּץ לַֽ/חוֹמָ֑ה וְ/אָסַפְתִּ֣י אוֹתָ֔/ם אֶל תּ֖וֹךְ הָ/עִ֥יר הַ/זֹּֽאת־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/021/004.yaml
  text: 'Thus says Yahweh[a], the God of Israel: Behold, I am turning back the weapons of war that are in your hands, with which you are fighting against the king of Babylon and against the Chaldeans who are besieging you outside the wall, and I will gather them into the midst of this city.'
translation:
  language: zh_hans
  text: 以色列的神耶和华如此说：“看哪，我要使你们手中的兵器掉转回来，就是你们用来与巴比伦王和迦勒底人交战的兵器；迦勒底人正从城墙外围困你们。我要把这些兵器收聚到这城中[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “这些兵器”所对应的原文代词也可能指巴比伦王和迦勒底人，意思是神要把敌军带进城中。
    reason: 保留原文复数代词所指对象的真实歧义。
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经语境中通行的神名音译，保留这是以色列之神的专名，而不以“主”等称号代替。
- source_word: הִנְנִי
  choice: 看哪，我要
  rationale: “看哪”保留先知宣告中郑重、引人注意的语气；后接“我要”自然表达分词所带的临近行动意味。
- source_word: מֵסֵב
  choice: 使……掉转回来
  rationale: 保留使役和军事语境中的“转回、掉转”意象，表明神要逆转守军兵器原本对敌的方向或效用，而不额外说明兵器将攻击谁。
- source_word: כְּלֵי הַמִּלְחָמָה
  choice: 兵器
  rationale: 在上下文中，“兵器”已自然包含战争用途，简洁而庄重，避免生硬的“战争器具”。
- source_word: בְּיֶדְכֶם
  choice: 你们手中的
  rationale: 保留希伯来文具体的“在手中”意象，强调这些是城中守军正在持用的武器。
- source_word: נִלְחָמִים בָּם
  choice: 你们用来……交战的
  rationale: 明确介词的工具意义，并用进行性语境自然表达守军正在作战。
- source_word: הַכַּשְׂדִּים
  choice: 迦勒底人
  rationale: 保留原文的族群—历史名称，不将其泛化为“巴比伦人”。
- source_word: הַצָּרִים עֲלֵיכֶם
  choice: 正在……围困你们
  rationale: 城墙和敌军压境的语境明确指向围城，因此采用准确而自然的军事用语。
- source_word: מִחוּץ לַחוֹמָה
  choice: 在城墙外
  rationale: 直接保留原文的空间关系；上下文足以表明这是城的防御墙。
- source_word: וְאָסַפְתִּי אוֹתָם
  choice: 我要把这些兵器收聚
  rationale: 正文按较自然的语法衔接，将代词理解为前文的兵器；“收聚”兼顾 אָסַף 的聚拢含义，并以脚注保留另一种可能指代。
- source_word: אֶל תּוֹךְ הָעִיר הַזֹּאת
  choice: 到这城中
  rationale: 简洁对应方向介词和“这城内部”的空间意义。
theological_decisions:
- issue: “我要把它们收聚到这城中”中代词的所指
  choice: 正文理解为犹大守军的兵器
  alternative: 也可能指巴比伦王及迦勒底人，即神要使敌军进入城内
  rationale: “兵器”在语法上是合适且较突出的先行词，“使兵器掉转……再收聚到城中”也构成连贯的审判图景；然而敌军是较近的复数对象，且上下文容许敌军被带入城中的理解，所以不应消除这一真实歧义，另以脚注说明。
translation_notes:
  register: 采用现代、庄重而易懂的普通话书面语。“如此说”和“看哪”保留先知宣告的正式语体；其余句法适度拆分，以免希伯来文长句在中文中显得拖沓。脚注标记紧随相关分句。
