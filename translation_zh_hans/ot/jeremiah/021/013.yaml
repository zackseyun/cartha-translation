  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: הִנְ/נִ֨י אֵלַ֜יִ/ךְ יֹשֶׁ֧בֶת הָ/עֵ֛מֶק צ֥וּר הַ/מִּישֹׁ֖ר נְאֻם יְהוָ֑ה הָ/אֹֽמְרִים֙ מִֽי יֵחַ֣ת עָלֵ֔י/נוּ וּ/מִ֥י יָב֖וֹא בִּ/מְעוֹנוֹתֵֽי/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/021/013.yaml
  text: Behold[a], I am against you, O inhabitant of the valley, O rock of the plain, declares Yahweh—you who say, “Who will come down against us[b], and who will enter into our dwellings?”
translation:
  language: zh_hans
  text: 耶和华宣告：“看哪，住在山谷中的城、平原上的磐石啊，我与你为敌！你们说：‘谁能下来攻击我们[a]？谁能进入我们的居所[b]？’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “下来攻击”所译的希伯来语动词含义较难确定；也可理解为“攻到我们这里”。上下文表明，这城自认为不会遭到攻击。
    reason: lexical_alternative
  - marker: b
    text: “居所”或可带有安全住处、据点的意味；原文没有直接使用通常译作“堡垒”的词。
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנְנִי אֵלַיִךְ
  choice: 看哪……我与你为敌
  rationale: הִנְנִי引出庄严的神谕；与אֵלַיִךְ连用且处于审判语境时，表达敌对和审判之意。
- source_word: יֹשֶׁבֶת הָעֵמֶק
  choice: 住在山谷中的城
  rationale: 阴性单数分词把受话者描写为住在山谷中的一位女性；中文补出“城”，使拟人化的直接称呼清楚自然，同时不把对象泛化为居民。
- source_word: צוּר הַמִּישֹׁר
  choice: 平原上的磐石
  rationale: 保留צוּר“磐石”的具体意象，不直接解释成“堡垒”；מִישֹׁר按地形义译为“平原”。
- source_word: נְאֻם יְהוָה
  choice: 耶和华宣告
  rationale: 采用庄重而自然的先知宣告公式，并以“耶和华”音译神名。
- source_word: הָאֹמְרִים
  choice: 你们说
  rationale: 原文由阴性单数的拟人化城市转为复数说话者，即城中居民；中文保留这一数的转换。
- source_word: מִי יֵחַת עָלֵינוּ
  choice: 谁能下来攻击我们
  rationale: 动词词义有困难；结合军事和地形语境，“下来攻击”保留下降的空间意象，也表达敌军进攻的含义。
- source_word: וּמִי יָבוֹא בִּמְעוֹנוֹתֵינוּ
  choice: 谁能进入我们的居所
  rationale: יָבוֹא与介词בְּ及“居所”连用时，译作“进入”最合中文；מָעוֹן保留为较少解释性的“居所”。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 采用现代中文圣经读者最熟悉的专名形式，同时明确保留原文的神圣专名。
- issue: 拟人化城市的单数称呼与居民的复数发言
  choice: 前半句称“城”，引语转为“你们／我们”
  alternative: 全句统一译成单数，或全句改成复数居民
  rationale: 原文刻意并置阴性单数受话者与复数说话者；译文保留这种修辞张力，不强行抹平。
- issue: 城市自信安全的语气
  choice: 以两个“谁能……”的反问表达夸口
  alternative: 改写为陈述句“无人能攻击我们”
  rationale: 保留原文反问形式，使城市倚仗地势和防御的自信直接呈现，而不额外判定其依据。
translation_notes:
  register: 采用现代、庄重且可朗读的普通话书面语。“看哪”和“耶和华宣告”保留先知神谕的郑重语气；以“城”明确阴性单数拟人对象，并保留随后复数居民发言造成的语法与修辞转换。所有脚注标记均置于所说明的词句之后。
