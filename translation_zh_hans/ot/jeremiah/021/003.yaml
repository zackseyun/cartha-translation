  text: Jeremiah said to them, “Thus you shall say to Zedekiah:”
translation:
  language: zh_hans
  text: 耶利米对他们说：“你们要对西底家这样说：”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: 该叙事形式承接上文、推进事件；现代汉语无需逐字译出连接词“于是/并”，用“说”自然准确。
- source_word: יִרְמְיָהוּ
  choice: 耶利米
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: אֲלֵיהֶם
  choice: 对他们
  rationale: 介词及第三人称阳性复数后缀标明说话对象；“对他们”符合现代汉语表达。
- source_word: כֹּה
  choice: 这样
  rationale: 此词引出正式传话内容；“这样说”既保留使者传言公式，又比“如此”更符合自然的现代汉语。
- source_word: תֹאמְרֻן
  choice: 你们要……说
  rationale: 第二人称阳性复数未完成式在此具有指令语气，明确吩咐多位使者传话。
- source_word: אֶל
  choice: 对
  rationale: 标示信息的受话者；与汉语“对……说”搭配自然。
- source_word: צִדְקִיָּהוּ
  choice: 西底家
  rationale: 采用现代中文圣经传统中通行的王名译法。
