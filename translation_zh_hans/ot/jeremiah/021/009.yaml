  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: הַ/יֹּשֵׁב֙ בָּ/עִ֣יר הַ/זֹּ֔את יָמ֕וּת בַּ/חֶ֖רֶב וּ/בָ/רָעָ֣ב וּ/בַ/דָּ֑בֶר וְ/הַ/יּוֹצֵא֩ וְ/נָפַ֨ל עַל הַ/כַּשְׂדִּ֜ים הַ/צָּרִ֤ים עֲלֵי/כֶם֙ יחיה וְ/הָֽיְתָה לּ֥/וֹ נַפְשׁ֖/וֹ לְ/שָׁלָֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/021/009.yaml
  text: The one who stays in this city will die by the sword[a], by famine, and by pestilence; but the one who goes out and defects to the Chaldeans who are besieging you will live[b], and his life will be to him as plunder.
translation:
  language: zh_hans
  text: 留在这城里的人，必死于刀剑、饥荒和瘟疫；但出去投奔[a]那些围困你们的迦勒底人的，必能活命；他的性命必成为他的战利品[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语直译为“倒向”或“落到……一方”；在这里可指转投敌方。
    reason: lexical_alternative
  - marker: b
    text: 直译为“他的性命必归他作战利品”，意思是他在灾难中虽失去其他一切，却能保住性命。
    reason: idiom_explanation
lexical_decisions:
- source_word: הַיֹּשֵׁב בָּעִיר הַזֹּאת
  choice: 留在这城里的人
  rationale: ישב在围城语境中指留下或居留，并非单指坐着；用“留在”自然表达其处境，同时保留单数代表性称谓。
- source_word: יָמוּת
  choice: 必死
  rationale: 在先知警告中表达确定的将来结果；“必死”比单纯“会死”更符合庄重语域。
- source_word: בַּחֶרֶב וּבָרָעָב וּבַדָּבֶר
  choice: 死于刀剑、饥荒和瘟疫
  rationale: 保留耶利米书常见的三重灾祸。“刀剑”保留具体意象，“瘟疫”准确表达审判与围城语境中的דבר。
- source_word: וְהַיּוֹצֵא
  choice: 但出去……的
  rationale: 连接词在此构成与前句的明显对比，汉语用“但”自然呈现逆接关系。
- source_word: וְנָפַל עַל
  choice: 投奔
  rationale: 该军事政治习语字面有“倒向、落到……一方”之意，在此指转投围城敌军；“投奔”既自然，又不额外断言具体投降仪式。
- source_word: הַכַּשְׂדִּים
  choice: 迦勒底人
  rationale: 保留原文族名，不以历史解释性的“巴比伦人”取代。
- source_word: הַצָּרִים עֲלֵיכֶם
  choice: 那些围困你们的
  rationale: צור的分词在此指军事围城；“围困”准确而自然。
- source_word: יִחְיֶה
  choice: 必能活命
  rationale: 直译为“必活着”；在刀剑、饥荒和瘟疫的语境中，“活命”自然表达身体存活，同时不引入灵魂层面的含义。
- source_word: וְהָיְתָה לּוֹ נַפְשׁוֹ לְשָׁלָל
  choice: 他的性命必归他作战利品
  rationale: 保留“性命如战利品所得”的希伯来隐喻，同时借助脚注说明其实际含义是灾难中仅保住性命。
- source_word: נַפְשׁוֹ
  choice: 他的性命
  rationale: נפש在此指人的生命，而非与身体相对的非物质“灵魂”；“性命”符合围城逃生的具体语境。
theological_decisions:
- issue: נֶפֶשׁ在逃生惯用语中的人论含义
  choice: 译作“性命”
  alternative: 灵魂
  rationale: 本节谈的是围城中的身体存活；译成“灵魂”会引入原文此处并未主张的身心二分含义。
- issue: 投奔围城者这一行动的表述强度
  choice: 投奔迦勒底人
  alternative: 向迦勒底人投降
  rationale: נפל על确实表示转到敌方一边，但原文没有专门描述正式投降程序；“投奔”保留行动方向，又避免过度具体化。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“刀剑、饥荒和瘟疫”保留先知书的固定审判语汇；“性命必归他作战利品”有意保存原文隐喻，并用脚注帮助普通读者理解。
