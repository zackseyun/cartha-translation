  text: וְ/הִכֵּיתִ֗י אֶת יֽוֹשְׁבֵי֙ הָ/עִ֣יר הַ/זֹּ֔את וְ/אֶת הָ/אָדָ֖ם וְ/אֶת הַ/בְּהֵמָ֑ה בְּ/דֶ֥בֶר גָּד֖וֹל יָמֻֽתוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/021/006.yaml
  text: And I will strike the inhabitants of this city, both man and beast; they will die by a great pestilence.
translation:
  language: zh_hans
  text: 我必击打住在这城中的人和牲畜；他们必死于大瘟疫。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִכֵּיתִי
  choice: 我必击打
  rationale: 使役形在这里表达上帝直接施行打击。“击打”保留原文动作的力度；“必”自然传达预告审判时未完成式的确定性。
- source_word: יֹשְׁבֵי הָעִיר הַזֹּאת
  choice: 这城的一切居民
  rationale: 分词形式指住在城中的对象。“居民”简洁自然；“一切”配合随后“人和牲畜”的总括说明，但不改变审判覆盖全城的含义。
- source_word: הָאָדָם
  choice: 人
  rationale: 此处与“牲畜”相对，是集合意义的人类，译作“人”可自然保留人和动物的对举。
- source_word: הַבְּהֵמָה
  choice: 牲畜
  rationale: 该词通常指陆生动物，尤其家养牲畜；在城市受审判的语境中，“牲畜”比“野兽”自然，也比泛称“动物”更贴近其常见所指。
- source_word: בְּדֶבֶר גָּדוֹל
  choice: 死于大瘟疫
  rationale: דֶּבֶר 指致命的传染病或瘟疫；介词 בְּ 表达死亡的原因或手段。גָּדוֹל 直译为“大”，保持庄重的先知性表达。
- source_word: יָמֻתוּ
  choice: 他们都必死
  rationale: 未完成式在审判预告中表示将来且确定的结果。“他们”承接人和牲畜，“都”明示两类对象无一例外。
theological_decisions:
- issue: 审判对象中 הָאָדָם 的集合意义
  choice: 人
  alternative: 人类；众人
  rationale: 原文将 אָדָם 与 בְּהֵמָה 并列，形成“人—牲畜”的整体对举。“人”既保留集合意义，也不把该词限定为男性。
- issue: 上帝施行审判的直接性
  choice: 我必击打
  alternative: 他们必遭击打；我必使灾祸临到
  rationale: 原文使用第一人称主动形式，明确以上帝为施行者，因此保留直接主动表达，不改成被动或弱化为间接许可。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“无论人还是牲畜”自然呈现重复宾格标记所强调的全面涵盖；分号保留“击打”与“死于瘟疫”之间先宣告行动、后说明结果的结构。
