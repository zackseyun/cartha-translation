base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/021/005.yaml
  text: And I myself will fight against you with an outstretched hand and a strong arm[b][a], and with anger and wrath and great fury.
translation:
  language: zh_hans
  text: 我必亲自攻击你们，用伸出的手和有力的膀臂[a]，带着怒气、烈怒和极大的愤怒[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “伸出的手和有力的膀臂”是表示上帝以决定性大能行动的固定表达，常见于出埃及的语境；这里却转而用来描述审判。
    reason: cross_reference
  - marker: b
    text: “极大的愤怒”也可译作“极大的烈怒”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנִלְחַמְתִּי
  choice: 我必……交战
  rationale: 该词为לחם的尼法勒式，结合语境表达第一人称将来的敌对行动。“交战”自然、庄重，也保留直接争战的力度。
- source_word: אֲנִי
  choice: 亲自
  rationale: 动词已经标明第一人称，另加独立代词具有强调作用；译为“亲自”可自然传达“我自己”的强调。
- source_word: אִתְּכֶם
  choice: 与你们
  rationale: 在נלחם的搭配中表示敌对对象。汉语“与你们交战”本身明确表示对抗，无须另译“反对你们”。
- source_word: בְּיָד נְטוּיָה
  choice: 用伸出的手
  rationale: 保留希伯来文具象的拟人表达及其表示上帝大能行动的经文呼应。
- source_word: וּבִזְרֹעַ חֲזָקָה
  choice: 和强壮的膀臂
  rationale: 直译与“伸出的手”平行；“膀臂”庄重而易懂，并保留身体意象。
- source_word: וּבְאַף
  choice: 带着怒气
  rationale: אַף字面为“鼻子”，在此是表达发怒的惯用语；译出其惯用意义，并与后续两个愤怒词形成累加强调。
- source_word: וּבְחֵמָה
  choice: 烈怒
  rationale: חֵמָה含有炽烈、猛烈之怒的意味；“烈怒”简洁地保留强度，并区别于前面的“怒气”。
- source_word: וּבְקֶצֶף גָּדוֹל
  choice: 极大的愤怒
  rationale: קֶצֶף表示强烈的震怒，גָּדוֹל明确加以强化；“极大的愤怒”自然传达句末高潮，同时避免生僻措辞。
theological_decisions:
- issue: 上帝行动的拟人化语言
  choice: 保留“伸出的手和强壮的膀臂”的身体意象，表达上帝亲自施行审判的大能。
  alternative: 意译为“用大能”或“以强大的力量”。
  rationale: 原文有意使用常见于出埃及叙事的具象表达，却在此将它转用于审判自己的百姓。保留该意象可维持经文之间的呼应和神学张力，而不把它简化为抽象能力。
- issue: 三个愤怒词的累加
  choice: 译为“怒气、烈怒和极大的愤怒”，保留三个并列成分及渐强效果。
  alternative: 合并为“极其愤怒”，或把末项译成“极大的烈怒”。
  rationale: 原文连续使用אַף、חֵמָה、קֶצֶף三个近义词，意在强化审判的严厉。译文既保留累加，也不强行为每个词设定过度精确的神学差别。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“我必亲自”体现独立代词的强调；“交战”保留直接敌对行动。“膀臂”略具经文语体色彩，但仍为现代读者所理解，并有助于保留原文平行的身体意象。脚注标记依其所解释内容分别置于相关短语之后。
