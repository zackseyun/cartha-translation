  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/אַחֲרֵי כֵ֣ן נְאֻם יְהוָ֡ה אֶתֵּ֣ן אֶת צִדְקִיָּ֣הוּ מֶֽלֶךְ יְהוּדָ֣ה וְ/אֶת עֲבָדָ֣י/ו וְ/אֶת הָ/עָ֡ם וְ/אֶת הַ/נִּשְׁאָרִים֩ בָּ/עִ֨יר הַ/זֹּ֜את מִן הַ/דֶּ֣בֶר מִן הַ/חֶ֣רֶב וּ/מִן הָ/רָעָ֗ב בְּ/יַד֙ נְבוּכַדְרֶאצַּ֣ר מֶֽלֶךְ בָּבֶ֔ל וּ/בְ/יַד֙ אֹֽיְבֵי/הֶ֔ם וּ/בְ/יַ֖ד מְבַקְשֵׁ֣י נַפְשָׁ֑/ם וְ/הִכָּ֣/ם לְ/פִי חֶ֔רֶב לֹֽא יָח֣וּס עֲלֵי/הֶ֔ם וְ/לֹ֥א יַחְמֹ֖ל וְ/לֹ֥א יְרַחֵֽם־־־־־׀־־־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/021/007.yaml
  text: And after that[a], declares Yahweh, I will give Zedekiah king of Judah, his servants, the people, and those left in this city from the plague, from the sword, and from the famine into the hand of Nebuchadnezzar king of Babylon, into the hand of their enemies, and into the hand of those seeking their life; and he will strike them down with the edge of the sword. He will not spare them or have pity or compassion.
translation:
  language: zh_hans
  text: “此后，雅威宣告：我要把犹大王西底家、他的臣仆、百姓，以及这城里那些从瘟疫、刀剑和饥荒中剩下的人，交在巴比伦王尼布甲尼撒[a]手中，交在他们的仇敌和那些要取他们性命的人手中。尼布甲尼撒必用刀刃击杀他们；他必不顾惜他们，不怜恤，也不施怜悯。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文此处的名字拼作“Nebuchadrezzar”；正文采用中文惯用译名“尼布甲尼撒”。
    reason: 说明希伯来文人名拼写与中文惯用译名之间的差异。
lexical_decisions:
- source_word: וְאַחֲרֵי כֵן
  choice: 此后
  rationale: 简洁自然地表达时间上的承接，并保留审判行动的先后次序。
- source_word: נְאֻם יְהוָה
  choice: 雅威宣告
  rationale: 保留先知话语公式的庄重语气，并以“雅威”呈现神的专名。
- source_word: אֶתֵּן ... בְּיַד
  choice: 把……交在……手中
  rationale: 结合动词“交出、给予”与“在某人手中”的权势意象，既准确表达交付之意，也保留希伯来语的形象。
- source_word: עֲבָדָיו
  choice: 他的臣仆
  rationale: 王室语境中可指王的仆役或官员；“臣仆”保持范围宽泛，又符合中文历史叙事语体。
- source_word: הַנִּשְׁאָרִים
  choice: 剩下的人
  rationale: 这里指经历灾祸后仍留在城中的人，避免用可能带有额外神学色彩的“余民”。
- source_word: מִן הַדֶּבֶר מִן הַחֶרֶב וּמִן הָרָעָב
  choice: 从瘟疫、刀剑和饥荒中
  rationale: 保留三重审判的并列结构；“刀剑”在现代中文中仍能自然表达战争杀戮。
- source_word: מְבַקְשֵׁי נַפְשָׁם
  choice: 那些要取他们性命的人
  rationale: 按希伯来语惯用语表达寻索某人性命、企图杀害之意。
- source_word: וְהִכָּם לְפִי חֶרֶב
  choice: 必用刀刃击杀他们
  rationale: “刀口”直译在中文中较生硬；“用刀刃击杀”保留兵刃意象和致命结果。
- source_word: לֹא יָחוּס ... וְלֹא יַחְמֹל וְלֹא יְרַחֵם
  choice: 不顾惜他们，不怜恤，也不施怜悯
  rationale: 以三个相近但不完全相同的表达再现原文层叠的否定，保留审判毫无宽免的强调。
- source_word: נְבוּכַדְרֶאצַּר
  choice: 尼布甲尼撒
  rationale: 采用现代中文圣经读者熟悉的传统译名；原文此处的拼写差异在脚注说明。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；音译“雅威”较贴近主流学界对其读音的重构，也使专名性质清楚可见。
- issue: 连续三个怜悯用语是否合并
  choice: 保留三个并列否定
  alternative: 概括为“毫不怜悯”
  rationale: 原文以 חוס、חמל、רחם 层叠加强语势；逐项呈现可保留审判宣告的强度，而不把其中的修辞张力抹平。
- issue: וְהִכָּם 的主语
  choice: 明确为尼布甲尼撒
  alternative: 保留代词“他”
  rationale: 希伯来语动词为阳性单数，最近且合乎语境的主语是巴比伦王尼布甲尼撒；中文重复其名可避免将主语误解为雅威，同时不改变原文所述的施行者。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。句式保留先知宣告的力度和希伯来文多重并列结构，同时通过补明后半句主语来避免中文歧义。
