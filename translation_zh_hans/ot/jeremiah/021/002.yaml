source:
  edition: WLC
  text: דְּרָשׁ נָ֤א בַעֲדֵ֨/נוּ֙ אֶת יְהוָ֔ה כִּ֛י נְבוּכַדְרֶאצַּ֥ר מֶֽלֶךְ בָּבֶ֖ל נִלְחָ֣ם עָלֵ֑י/נוּ אוּלַי֩ יַעֲשֶׂ֨ה יְהוָ֤ה אוֹתָ֨/נוּ֙ כְּ/כָל נִפְלְאֹתָ֔י/ו וְ/יַעֲלֶ֖ה מֵ/עָלֵֽי/נוּ־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/021/002.yaml
  text: Please inquire of Yahweh on our behalf[a], because Nebuchadnezzar king of Babylon is fighting against us. Perhaps Yahweh will act for us according to all his wondrous acts[c][b], so that he will withdraw from us.
translation:
  language: zh_hans
  text: “请为我们求问耶和华，因为巴比伦王尼布甲尼撒正在攻打我们。或许耶和华会照着他一切奇妙作为的方式为我们行事，使尼布甲尼撒从我们这里撤离。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דְּרָשׁ נָא
  choice: 请……求问
  rationale: 此处是带礼貌语气词 נָא 的祈使表达，指借先知向上帝寻求答复；“请……求问”自然地保留了郑重请求和先知求问的语境。
- source_word: בַעֲדֵנוּ
  choice: 为我们
  rationale: בַעַד 在这里表示代表或代求；中文“为我们”简洁自然，并能表达代表众人求问之意。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文读者熟悉的专名形式呈现四字神名，避免用称号替代原文中的专名。
- source_word: נְבוּכַדְרֶאצַּר
  choice: 尼布甲尼撒
  rationale: 采用现代中文圣经及一般中文语境中通行的人名译法，便于辨认；原文拼写的细微差异不影响所指人物。
- source_word: נִלְחָם עָלֵינוּ
  choice: 正在攻打我们
  rationale: Nifal 分词表示持续进行的敌对军事行动；“正在攻打”比字面“与我们争战”更符合围城语境。
- source_word: אוּלַי
  choice: 或许
  rationale: 保留说话者带着盼望却并无把握的语气，不把可能性强化为确定性。
- source_word: יַעֲשֶׂה יְהוָה אוֹתָנוּ כְּכָל נִפְלְאֹתָיו
  choice: 耶和华会照他以往所行的一切奇事为我们施行奇事
  rationale: 原文“对我们行，照他一切奇事”的结构在中文中需适度补足；此译表达所盼望的是上帝按以往奇妙拯救的模式再次行动，同时不具体限定行动方式。
- source_word: וְיַעֲלֶה מֵעָלֵינוּ
  choice: 使尼布甲尼撒撤兵离开我们
  rationale: 字面为“他就从我们上面上去”，在军事语境中指进攻者解除压力并撤离；中文需明示语意上的主语，以免误解为耶和华离开。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威；上主
  rationale: 原文使用上帝的专名而非普通称号；采用现代中文最广为人知的专名形式，既保留专名性质，也便于普通读者理解。
- issue: יַעֲשֶׂה יְהוָה אוֹתָנוּ 的受益或关系方向
  choice: 为我们施行奇事
  alternative: 照他一切奇事对待我们；向我们行事
  rationale: 介词结构本身较宽泛，但上下文是向上帝求救，因此译作“为我们”符合语境；仍以“或许”保留请求中的不确定性，不把拯救说成必然。
- issue: וְיַעֲלֶה 的隐含主语
  choice: 尼布甲尼撒
  alternative: 保留含混的“他就从我们这里上去”
  rationale: 希伯来文语法上主语未重述，但军事上下文自然指围攻者尼布甲尼撒撤离。现代中文若只说“他”，容易误指紧邻出现的耶和华，因此明示所指。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“求问”保留先知性语境；“正在攻打”清楚呈现持续的军事危机；结句明示尼布甲尼撒为撤兵者，以避免中文代词歧义。
