base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/021/014.yaml
  text: And I will punish you according to the fruit of your deeds[a], declares Yahweh, and I will kindle a fire in her forest[b], and it will consume all that is around her.
translation:
  language: zh_hans
  text: 我必按你们行为所结的果子惩罚你们[a]——这是雅威的宣告。我要在她的树林中燃起火来[b]，火必吞灭她周围的一切。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “惩罚”所译的希伯来语动词也可表示“眷顾”“察看”或“追究”；这里的审判语境使“惩罚”之意最为明显。
    reason: lexical_alternative
  - marker: b
    text: “她的树林”很可能是诗性地指耶路撒冷或其王宫建筑群；也有人将“树林”理解为密集的建筑或防御工事。
    reason: cultural_note
lexical_decisions:
- source_word: וּפָקַדְתִּי עֲלֵיכֶם
  choice: 我必……惩罚你们
  rationale: פקד含有眷顾、察看、追究或惩罚等意义；本节明确处于审判语境，且与按行为报应相连，因此正文采用“惩罚”，脚注保留较宽的词义。
- source_word: כִּפְרִי מַעַלְלֵיכֶם
  choice: 照你们所作之事的果子
  rationale: 保留“果子”这一结果与报应的比喻，并以“照”表达כ所标示的对应尺度；“所作之事”自然传达מעללים的道德行为含义。
- source_word: נְאֻם יְהוָה
  choice: 这是雅威的宣告
  rationale: 以现代庄重汉语呈现先知性的权威宣告公式，并直接音译神名יהוה为“雅威”。
- source_word: וְהִצַּתִּי אֵשׁ
  choice: 我要……点火
  rationale: 准确表达יצת使役形“点燃、燃起”的意义，中文简洁自然。
- source_word: בְּיַעְרָהּ
  choice: 在她的树林中
  rationale: יער直译为“树林”；保留阴性单数后缀“她”，不在正文中把其所指明确限定为耶路撒冷、王宫或防御工事。
- source_word: וְאָכְלָה כָּל סְבִיבֶיהָ
  choice: 火必吞灭她周围的一切
  rationale: אכל以火为主语时表示吞噬、烧尽；补出“火”使中文指代清楚，同时保留第二个阴性后缀与前文的呼应。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名；采用“雅威”保留其专名性质，而不以称号代替。
- issue: “她的树林”及“她周围”的阴性所指
  choice: 保留“她”，不在正文中明确解释所指
  alternative: 译作“它”；直接解释为耶路撒冷、锡安或王宫建筑群
  rationale: 希伯来文连续使用阴性单数后缀，很可能以女性形象指称该城；保留这一形式可维持诗性意象和所指的开放性。
- issue: פקד在审判语境中的力度
  choice: 正文译为“惩罚”
  alternative: 察看；临到；追究
  rationale: 该动词本身语义较广，但“照……果子”及上下文使惩罚性审判成为此处最自然的理解；脚注仍说明其词义范围。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。正文保留“果子”“她的树林”等原文意象；将较长句分为三句，以清楚呈现审判宣告及火焚意象。所有脚注标记均已置于正文相应位置。
