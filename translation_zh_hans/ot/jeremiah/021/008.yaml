base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/021/008.yaml
  text: 'And to this people you shall say[a], ‘Thus says Yahweh: Behold, I am setting before you the way of life and the way of death.’'
translation:
  language: zh_hans
  text: 你又要对这百姓说：“雅威如此说：‘看哪，我把生命之路和死亡之路摆在你们面前。[a]’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “摆在你们面前”所译的希伯来语动词基本义为“给”；在“在你们面前”的结构中，这里表示把两条路呈现在他们面前。
    reason: 说明 נֹתֵן 的基本词义及其在本句结构中的惯用表达。
lexical_decisions:
- source_word: וְ/אֶל הָ/עָם הַ/זֶּה
  choice: 你要对这百姓说
  rationale: וְאֶל承接上文，并引出先知奉命向百姓传话；“这百姓”保留单数集合名词的表达。中文以“你要对……说”自然体现תֹּאמַר在此的指令语气。
- source_word: כֹּה אָמַר יְהוָה
  choice: 雅威如此说
  rationale: 保留先知宣告常用的使者公式；“雅威”按希伯来文四字神名的通行现代音译处理，不以称号代替专名。
- source_word: הִנְנִי
  choice: 看哪
  rationale: 表达郑重提醒和眼前即将施行之事，保留先知话语的庄严感。
- source_word: נֹתֵן לִפְנֵיכֶם
  choice: 摆在你们面前
  rationale: נֹתֵן字面为“给”，但与“在你们面前”连用时表示把事物陈列、呈于面前；“摆在……面前”符合现代汉语，也保留选择摆在面前的意象。
- source_word: דֶּרֶךְ הַחַיִּים וְאֶת דֶּרֶךְ הַמָּוֶת
  choice: 生命之路和死亡之路
  rationale: דֶּרֶךְ在这里比喻通向某种结局的道路；“生命之路／死亡之路”保留原文工整而强烈的对举。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华／主
  rationale: 原文直接使用以色列上帝的四字神名。译作“雅威”旨在保留专名及其与称号的区别，不把原文改成“主”；“耶和华”是中文传统形式，但“雅威”更接近现代学界通常采用的读音。
- issue: “生命之路”和“死亡之路”的关系
  choice: 保留并列对举，不增添“选择”或“通向”等解释
  alternative: 摆在你们面前供你们选择的通往生命和死亡的路
  rationale: 上下文确实涉及两种去路及其结局，但本节本身只说两条路被摆在百姓面前。直译其对举可避免把隐含意义扩写成经文未明说的命令。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“看哪”和“如此说”保留先知宣告的郑重语体；其余措辞避免过度古雅。引号层级区分叙述者的命令与雅威的直接引语。
