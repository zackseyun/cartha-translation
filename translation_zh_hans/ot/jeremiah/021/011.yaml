base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/021/011.yaml
  text: 'And to the house of the king of Judah: Hear the word of Yahweh[a].'
translation:
  language: zh_hans
  text: 至于犹大王的家：你们要听雅威的话。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作：“对犹大王的家：你们要听雅威的话。”或“关于犹大王的家：你们要听雅威的话。”希伯来语介词可引出向王室发出的宣告，也可引出关于王室的宣告。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/בֵית
  choice: 至于……的家
  rationale: וְ连接前文，לְ在这里引出新的宣告对象，可理解为“对”或“关于”；中文用“至于”自然地标示话题转换，同时保留其所指对象可能兼具受话者与论及对象的含义。בֵית保留为“家”，可指王室、王家或宫廷群体，不窄化为建筑物“王宫”。
- source_word: מֶלֶךְ יְהוּדָה
  choice: 犹大王
  rationale: 这是自然简洁的现代汉语表达，对应“犹大的王”，并与בֵית构成“犹大王的家”。
- source_word: שִׁמְעוּ
  choice: 你们要听
  rationale: 该词是复数命令式；明示“你们”体现复数受话群体，“要听”保留先知宣告中郑重的命令语气。
- source_word: דְּבַר
  choice: 话
  rationale: 在先知公式中指上帝所说的话或信息；“耶和华的话”是自然且庄重的汉语表达，也保留了“话”而非解释性较强的“信息”。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的神名音译“耶和华”，明确呈现专名，而不以称号“主”代替。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。中文正文采用通行且易懂的专名“耶和华”，既不以“主”替换，也避免把一种较新的音译形式规定为唯一读音。
- issue: 王室是受话者还是被论及对象
  choice: 正文用“至于”保留话题引入的开放性
  alternative: “对犹大王的家说”或“关于犹大王的家”
  rationale: 介词לְ既可引出宣告所针对的受话群体，也可引出所论及的对象；不应在正文中无提示地排除其中一种可能。脚注列出两种理解。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“犹大王的家”保留原文“家”的王室/家族含义；复数命令式译为“你们要听”。脚注标记置于正文相应句末。
