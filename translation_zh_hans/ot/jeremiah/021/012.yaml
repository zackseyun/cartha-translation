    rationale: 应删除这条无依据且锚定错误的脚注；正文恢复原文人称后不需要文本异文注。
  - severity: low
    issue: “我的烈怒如火发出”中文搭配略不自然。
    rationale: “烈怒必如火般发作”更符合现代汉语，同时没有增添或删减原文意思。
