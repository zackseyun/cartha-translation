revisions:
- from: 大卫家啊，耶和华如此说：你们要在早晨秉公审判，救被抢夺的人脱离欺压者的手[a]；免得我的烈怒如火发出，燃烧起来，无人能熄灭[b]，这是因你们所行的恶。
  to: 大卫家啊，耶和华如此说：你们要在早晨秉公审判，救被抢夺的人脱离欺压者的手[a]；免得我的烈怒必如火般发作，燃烧起来，无人能熄灭；这是因他们所行的恶。
  rationale: 恢复末句与马所拉文本一致的第三人称“他们”，删除无充分依据且锚点不当的异文脚注，并对烈怒如火的表达作轻微润饰，使其在现代汉语中自然且保留原文意象。其余译文忠实呈现对大卫家的呼告、司法命令、拯救受害者的要求及不可熄灭的审判警告。
