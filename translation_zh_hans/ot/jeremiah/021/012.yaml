  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: בֵּ֣ית דָּוִ֗ד כֹּ֚ה אָמַ֣ר יְהוָ֔ה דִּ֤ינוּ לַ/בֹּ֨קֶר֙ מִשְׁפָּ֔ט וְ/הַצִּ֥ילוּ גָז֖וּל מִ/יַּ֣ד עוֹשֵׁ֑ק פֶּן תֵּצֵ֨א כָ/אֵ֜שׁ חֲמָתִ֗/י וּ/בָעֲרָה֙ וְ/אֵ֣ין מְכַבֶּ֔ה מִ/פְּנֵ֖י רֹ֥עַ מעללי/הם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/021/012.yaml
  text: 'House of David[a], thus says Yahweh: Administer justice in the morning, and deliver the one who has been robbed from the hand of the oppressor, lest my wrath go out like fire and burn with no one to quench it[c][b], because of the evil of their deeds.'
translation:
  language: zh_hans
  text: 大卫家啊，耶和华如此说：你们要在早晨秉公审判，救被抢夺的人脱离欺压者的手[a]；免得我的烈怒必如火般发作，燃烧起来，无人能熄灭；这是因他们所行的恶。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “脱离欺压者的手”意为脱离欺压者的权势或控制。
    reason: cultural_note
lexical_decisions:
- source_word: בֵּית דָּוִד
  choice: 大卫家
  rationale: 这是呼格，指大卫王室或王族；“大卫家”简洁保留原文家族与王朝的双重含义。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的神名形式，明确其为专名而非称号。
- source_word: דִּינוּ לַבֹּקֶר מִשְׁפָּט
  choice: 要在早晨秉公审判
  rationale: דִּינוּ与מִשְׁפָּט共同表达履行司法公义；“秉公审判”自然传达法律和伦理层面的要求，同时保留“在早晨”的时间表达。
- source_word: גָזוּל
  choice: 被抢夺的人
  rationale: 该被动形式在此指遭掠夺或被剥夺权益的人；译为具体的人，避免误解为被夺走的物品。
- source_word: מִיַּד עוֹשֵׁק
  choice: 脱离欺压者的手
  rationale: 保留希伯来语“从……手中”的形象；“手”在此表示权势或控制。
- source_word: תֵּצֵא כָאֵשׁ חֲמָתִי
  choice: 我的烈怒如火发出
  rationale: 保留烈怒“发出”以及“如火”的明喻，不将其解释性改写为单纯的惩罚。
- source_word: וּבָעֲרָה וְאֵין מְכַבֶּה
  choice: 燃烧起来，无人能熄灭
  rationale: 延续火的意象；“无人能熄灭”自然表达原文没有熄灭者的结构。
- source_word: מִפְּנֵי רֹעַ מעלליהם
  choice: 这是因你们所行的恶
  rationale: מעללים指行为或作为；“所行的恶”自然简洁。马所拉正文后缀作第三人称复数“他们”，但直接 خطاب语境及部分文本传统支持第二人称“你们”，故正文按受 خطاب对象的读法处理并以脚注说明。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: “耶和华”是现代简体中文普通读者最熟悉的专名形式；不以“主”替代，以保留原文神名。
- issue: 司法命令的范围
  choice: 在早晨秉公审判
  alternative: 每天早晨施行公义；在早晨作出判决
  rationale: 原文可强调早晨的审判时间，也可能含有日常、及时施行司法的意味；正文保留较少解释性的时间表达，并用“秉公”体现מִשְׁפָּט的公义维度。
- issue: 末句人称的文本张力
  choice: 你们所行的恶
  alternative: 他们所行的恶
  rationale: 马所拉正文表面为第三人称复数，但古译本及上下文中的直接 خطاب支持第二人称。正文采用语境连贯的第二人称，同时脚注保留马所拉文本读法，避免掩盖文本差异。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“大卫家啊”保留先知宣告的直接呼告；“秉公审判”“烈怒”等词维持司法与审判语域，又避免过度古雅。
