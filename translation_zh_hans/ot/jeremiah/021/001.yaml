  text: הַ/דָּבָ֛ר אֲשֶׁר הָיָ֥ה אֶֽל יִרְמְיָ֖הוּ מֵ/אֵ֣ת יְהוָ֑ה בִּ/שְׁלֹ֨חַ אֵלָ֜י/ו הַ/מֶּ֣לֶךְ צִדְקִיָּ֗הוּ אֶת פַּשְׁחוּר֙ בֶּן מַלְכִּיָּ֔ה וְ/אֶת צְפַנְיָ֧ה בֶן מַעֲשֵׂיָ֛ה הַ/כֹּהֵ֖ן לֵ/אמֹֽר־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/021/001.yaml
  text: The word that came to Jeremiah from Yahweh when King Zedekiah sent to him Pashhur son of Malchiah and Zephaniah son of Maaseiah the priest[a], saying,
translation:
  language: zh_hans
  text: 西底家王派玛基雅的儿子巴施户珥和祭司玛西雅的儿子西番雅[b]去见耶利米时，雅威[a]的话临到耶利米，说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “雅威”音译希伯来文的神名 יהוה（YHWH）；传统译作“耶和华”，有些译本以“上主”代替。
    reason: 说明神名的原文形式及主要传统译法。
  - marker: b
    text: 希伯来文末尾的“祭司”紧随“玛西雅”，故正文按其修饰玛西雅翻译；也可理解为说明西番雅。
    reason: 保留“祭司”所指对象的句法歧义。
lexical_decisions:
- source_word: הַדָּבָר אֲשֶׁר הָיָה אֶל יִרְמְיָהוּ
  choice: 话临到耶利米
  rationale: 保留先知书中“话临到某人”的固定启示用语；“话”比“信息”更贴近 דָּבָר，也维持其公式性。
- source_word: מֵאֵת יְהוָה
  choice: 雅威的话
  rationale: מֵאֵת 表明来源；汉语以“雅威的话临到”自然表达“从雅威而来的话”，并将四字神名音译为“雅威”。
- source_word: בִּשְׁלֹחַ
  choice: ……派……时
  rationale: 介词 בְּ 加不定式结构在此表示时间背景，译作“……时”简洁自然。
- source_word: אֵלָיו
  choice: 去见耶利米
  rationale: 代词所指是耶利米；汉语明确复现人名，并以“去见”表达受差遣到某人那里。
- source_word: הַמֶּלֶךְ צִדְקִיָּהוּ
  choice: 西底家王
  rationale: 采用现代汉语中姓名在前、王号在后的常用形式。
- source_word: פַּשְׁחוּר בֶּן מַלְכִּיָּה
  choice: 玛基雅的儿子巴施户珥
  rationale: 采用通行汉语圣经人名音译，并清楚保留父子关系。
- source_word: צְפַנְיָה בֶן מַעֲשֵׂיָה הַכֹּהֵן
  choice: 玛西雅的儿子、祭司西番雅
  rationale: 将 הַכֹּהֵן 作为西番雅的同位称谓；用顿号避免误读为“祭司玛西雅”，同时保留其父子身份。
- source_word: לֵאמֹר
  choice: 说：
  rationale: 这是引出下一节话语内容的引语标记；冒号符合现代汉语标点习惯。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名。音译“雅威”保留其作为专名的性质，不以称号取代；脚注说明其希伯来文背景。
- issue: “祭司”所修饰的人物
  choice: 祭司西番雅
  alternative: 玛西雅祭司的儿子西番雅
  rationale: 按本句人物识别结构及西番雅在耶利米书其他经文中的祭司身份，将称谓理解为指西番雅；汉语正文明确表达这一关系。
translation_notes:
  register: 采用庄重而现代的叙事语体。为使较长的希伯来语句在汉语中清晰，将时间从句前置，并以“说：”承接下一节。人名采用简体中文圣经中较通行的译名。
