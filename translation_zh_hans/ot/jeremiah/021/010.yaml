source:
  edition: WLC
  text: כִּ֣י שַׂ֣מְתִּי פָ֠נַ/י בָּ/עִ֨יר הַ/זֹּ֧את לְ/רָעָ֛ה וְ/לֹ֥א לְ/טוֹבָ֖ה נְאֻם יְהוָ֑ה בְּ/יַד מֶ֤לֶךְ בָּבֶל֙ תִּנָּתֵ֔ן וּ/שְׂרָפָ֖/הּ בָּ/אֵֽשׁ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/021/010.yaml
  text: For I have set my face against this city for harm and not for good[a], declares Yahweh. It will be given into the hand of the king of Babylon[b], and he will burn it with fire.
translation:
  language: zh_hans
  text: 因为我已经定意与这城为敌，要降祸，不降福[a]——这是耶和华的宣告。这城必被交在巴比伦王手中[b]，他要放火焚烧这城。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “降祸”也可译作“使灾难临到”。这里的希伯来词指灾祸或带来伤害的审判，并非说道德上的邪恶。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“交在巴比伦王的手中”，意思是交在他的权势之下。
    reason: idiom_clarification
lexical_decisions:
- source_word: שַׂמְתִּי פָנַי
  choice: 我已经定意与……为敌
  rationale: 希伯来语直译为“我已把脸朝向”，在此表达坚定而敌对的决意。中文若直译为“把脸朝向”容易只表示方向；“定意与……为敌”自然传达该习语在上下文中的力度。
- source_word: בָּעִיר הַזֹּאת
  choice: 与这城为敌
  rationale: 介词短语与“定意”这一习语合译；后文“降祸，不降福”表明朝向这城的是敌对的审判。
- source_word: לְרָעָה וְלֹא לְטוֹבָה
  choice: 要降祸，不降福
  rationale: רָעָה 在此指灾祸、伤害性的审判，而非上帝所行的道德邪恶；טוֹבָה 与之构成简洁鲜明的对照。“降祸／降福”符合现代中文表达，也保留主动施行审判的语气。
- source_word: נְאֻם יְהוָה
  choice: 这是耶和华的宣告
  rationale: 保留先知书中庄严的宣告公式，并将神名 יְהוָה 音译为现代中文通行的“耶和华”。
- source_word: בְּיַד מֶלֶךְ בָּבֶל
  choice: 交在巴比伦王手中
  rationale: 保留“在……手中”的希伯来意象；此习语表示落入其权势或控制之下。
- source_word: תִּנָּתֵן
  choice: 必被交
  rationale: 该词为尼法勒未完成式，表达被动动作；在预言语境中以“必”传达确定的将来结果。
- source_word: וּשְׂרָפָהּ בָּאֵשׁ
  choice: 他要放火焚烧这城
  rationale: 动词为主动第三人称阳性单数，宾语为阴性单数，指前述城市；“他”最自然地回指巴比伦王，也可代表其军队。“放火焚烧”自然表达工具性 בָּאֵשׁ。
theological_decisions:
- issue: לְרָעָה 所表达的神圣审判
  choice: 要降祸
  alternative: 要行恶／要加害
  rationale: 本节宣告耶和华决意使灾祸临到这城。רָעָה 在语境中是灾难性的审判，不是在断言上帝施行道德邪恶；“降祸”既保留严厉的神学张力，也避免中文“行恶”所造成的非必要误解。
- issue: שַׂמְתִּי פָנַי 的敌对含义
  choice: 定意与这城为敌
  alternative: 面向这城／转脸攻击这城
  rationale: 原文介词本身可表示向着、在或对，但紧接的“降祸，不降福”确定了敌对取向。“为敌”是由语境明确支持的习语性表达，而非加入额外教义。
- issue: 焚城者的指代
  choice: 他要放火焚烧这城
  alternative: 这城必被火焚烧
  rationale: 原文使用主动第三人称阳性单数，最直接的先行词是“巴比伦王”；同时古代君王的行动通常包括其军队的行动。保留“他”不将文本改成被动，也不进一步限定为王本人或军队。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“定意与这城为敌”传达希伯来习语的坚决敌对意味；“降祸，不降福”保留原文对称而尖锐的反差。神名按中文传统音译为“耶和华”。主句均简洁有力，适合公开诵读。
