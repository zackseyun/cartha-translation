source:
  edition: WLC
  text: וּ/פְלִיטֵ֨י חֶ֜רֶב יְשֻׁב֨וּ/ן מִן אֶ֧רֶץ מִצְרַ֛יִם אֶ֥רֶץ יְהוּדָ֖ה מְתֵ֣י מִסְפָּ֑ר וְֽ/יָדְע֞וּ כָּל שְׁאֵרִ֣ית יְהוּדָ֗ה הַ/בָּאִ֤ים לְ/אֶֽרֶץ מִצְרַ֨יִם֙ לָ/ג֣וּר שָׁ֔ם דְּבַר מִ֥י יָק֖וּם מִמֶּ֥/נִּי וּ/מֵ/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/044/028.yaml
  text: And a few survivors of the sword will return from the land of Egypt to the land of Judah[a], and all the remnant of Judah who came to the land of Egypt to sojourn there will know whose word will stand[b], mine or theirs.
translation:
  language: zh_hans
  text: 逃过刀剑的人将从埃及地回到犹大地，人数寥寥[a]。所有来到埃及地寄居的犹大余民都必知道，谁的话会站得住——是我的话，还是他们的话[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 此希伯来语习语意为人数很少、屈指可数。
    reason: lexical_alternative
  - marker: b
    text: “会站得住”也可译作“会应验”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפְלִיטֵי חֶרֶב
  choice: 逃过刀剑的人
  rationale: פְלִיטֵי 指逃脱者、幸存者；חֶרֶב 直译为“刀剑”，在此指战争或暴力审判。译文保留原文意象，并以现代汉语自然表达其关系。
- source_word: יְשֻׁבוּן
  choice: 将……回到
  rationale: שׁוב 的基本义为“返回、回去”；此处是对未来结果的宣告。
- source_word: מִן אֶרֶץ מִצְרַיִם אֶרֶץ יְהוּדָה
  choice: 从埃及地回到犹大地
  rationale: 保留原文两次出现的“地”，同时用“从……回到……”清楚表达起点和终点。
- source_word: מְתֵי מִסְפָּר
  choice: 人数寥寥
  rationale: 这是表示人数少、屈指可数的习语。“人数寥寥”既准确又庄重，并保留该短语在原句中的后置强调。
- source_word: וְיָדְעוּ
  choice: 都必知道
  rationale: 直陈将来的结果；“必”符合先知宣告的确定语气，但没有增加原文以外的解释。
- source_word: כָּל שְׁאֵרִית יְהוּדָה
  choice: 所有……犹大余民
  rationale: שְׁאֵרִית 译作“余民”，保留先知书中常见的群体称谓；כָּל 以“所有”表达。
- source_word: הַבָּאִים לְאֶרֶץ מִצְרַיִם לָגוּר שָׁם
  choice: 来到埃及地寄居的
  rationale: בוא 为“来、来到”；גור 指作为外来者居住或暂居。“寄居”比单纯“居住”更能体现原词含义。
- source_word: דְּבַר מִי יָקוּם
  choice: 究竟谁的话能够立定
  rationale: קום 在此表示话语得以确立、站立或实现。“立定”保留希伯来文的隐喻，也传达双方话语最终受事实验证的含义。
- source_word: מִמֶּנִּי וּמֵהֶם
  choice: 是我的，还是他们的
  rationale: 两个代词承接前面的“话”。汉语采用“是……还是……”明确呈现原文的对比，而不另行解释“他们”具体所指。
theological_decisions:
- issue: 先知话语得到证实的表达
  choice: 谁的话能够立定——是我的，还是他们的
  alternative: 谁的话会应验——是我的，还是他们的
  rationale: 本节将耶和华所宣告的审判与犹大余民相反的主张或期待并列。“立定”保留 יָקוּם 的具体隐喻及原文张力；“应验”虽能说明结果，却较直接地解释了隐喻。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“寄居”“余民”“立定”保留先知文学的关键语义与意象；破折号突出“我的”与“他们的”之间的对照。
