  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/תִּתַּ֤ךְ חֲמָתִ/י֙ וְ/אַפִּ֔/י וַ/תִּבְעַר֙ בְּ/עָרֵ֣י יְהוּדָ֔ה וּ/בְ/חֻצ֖וֹת יְרֽוּשָׁלִָ֑ם וַ/תִּהְיֶ֛ינָה לְ/חָרְבָּ֥ה לִ/שְׁמָמָ֖ה כַּ/יּ֥וֹם הַ/זֶּֽה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/044/006.yaml
  text: So my wrath and my anger were poured out and burned in the cities of Judah and in the streets of Jerusalem[a], and they became a ruin and a desolation, as they are this day.
translation:
  language: zh_hans
  text: 因此，我的烈怒和怒气倾泻而出，在犹大的各城和耶路撒冷的街道[a]中燃烧；这些地方就成了废墟和荒凉之地，正如今日一样。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “街道”也可译作“广场”或“露天公共场所”。
    reason: חֻצוֹת 的词义范围包括街道、广场及城中的开放空间，具体所指在本节并不完全确定。
lexical_decisions:
- source_word: וַתִּתַּךְ
  choice: 倾泻出来
  rationale: 保留 נתך 所表达的“被倒出、倾注”这一具体比喻；汉语用主动形式承接后置的复合主语，更自然，也不改变语义。
- source_word: חֲמָתִי וְאַפִּי
  choice: 我的烈怒和怒气
  rationale: חֵמָה 带有炽烈、盛怒之意，译作“烈怒”；אַף 在此为“怒气”的惯用义。并列保留希伯来文的强调和张力。
- source_word: וַתִּבְעַר
  choice: 燃烧
  rationale: 直接保留 בער 的火焰意象，并与前面的“倾泻出来”共同呈现原文中交叠而鲜明的审判隐喻。
- source_word: בְּעָרֵי יְהוּדָה
  choice: 在犹大的城镇
  rationale: בְּ 在此说明燃烧发生、产生作用的地点；עָרִים 译作现代汉语自然的“城镇”，兼顾各类设防或聚居城邑。
- source_word: וּבְחֻצוֹת יְרוּשָׁלִָם
  choice: 和耶路撒冷的街道上
  rationale: חֻצוֹת 可指街道、广场或露天公共空间；正文采用语境中最自然的“街道”，并以脚注保留其他可能。
- source_word: וַתִּהְיֶינָה
  choice: 使这些地方沦为
  rationale: 阴性复数动词回指前述犹大诸城及耶路撒冷街道。汉语以结果式“使这些地方沦为”清楚表达审判造成的状态，同时避免生硬的复数代词。
- source_word: לְחָרְבָּה לִשְׁמָמָה
  choice: 废墟，一片荒凉
  rationale: 分别呈现 חָרְבָּה 的毁坏、废墟状态与 שְׁמָמָה 的荒废凄凉，保留原文同义叠加强调。
- source_word: כַּיּוֹם הַזֶּה
  choice: 直到今日
  rationale: 该惯用语指说话当时仍可见的现状。汉语“直到今日”自然表达这种结果延续至今的意义；不额外加入解释。
theological_decisions:
- issue: 上帝审判语言的具体性
  choice: 保留“烈怒、怒气、倾泻、燃烧”等具体措辞
  alternative: 概括译为“我的惩罚临到”或“我的审判降下”
  rationale: 原文以倾倒和燃烧的强烈意象描述上帝亲自施行审判；保留这些表达可维持经文的神学力度，而不加以淡化或扩释。
- issue: 阴性复数动词所指
  choice: 以“这些地方”统指犹大的城镇和耶路撒冷的街道
  alternative: 采用非人称单数表达，如“那里便成了……”
  rationale: וַתִּהְיֶינָה 为阴性复数，最自然地回指前述复数地点；“这些地方”既明确所指，也符合现代汉语习惯。
- issue: 倾泻与燃烧两个意象的关系
  choice: 并列保留两个意象，不将其逻辑化或改写为单一比喻
  alternative: 为避免意象交叠而仅译成“怒火燃烧”
  rationale: 希伯来文有意将烈怒“倾泻”与怒气“燃烧”的图像连续使用。译文保留这种张力，不替原文消解其修辞。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。句首先用“于是”承接上文因果进程；以“沦为废墟，一片荒凉”传达先知审判语体，同时避免过度古雅。脚注标记已置于相关词语之后。
