revisions:
- from: 于是，我的烈怒和怒气倾泻出来，在犹大的城镇和耶路撒冷的街道上燃烧[a]，使这些地方沦为废墟，一片荒凉，直到今日。
  to: 因此，我的烈怒和怒气倾泻而出，在犹大的各城和耶路撒冷的街道[a]中燃烧；这些地方就成了废墟和荒凉之地，正如今日一样。
  rationale: 修订“直到今日”为“正如今日一样”，以保留原文比较性的时间表达；并将“使这些地方沦为”调整为“这些地方就成了”，更贴近阴性复数结果动词的句法，同时保留审判导致荒凉的语义。其余关键意象、地名、术语和脚注均可维持。
