source:
  edition: WLC
  text: וְ/לֹֽא יוּכַל֩ יְהוָ֨ה ע֜וֹד לָ/שֵׂ֗את מִ/פְּנֵי֙ רֹ֣עַ מַעַלְלֵי/כֶ֔ם מִ/פְּנֵ֥י הַ/תּוֹעֵבֹ֖ת אֲשֶׁ֣ר עֲשִׂיתֶ֑ם וַ/תְּהִ֣י אַ֠רְצְ/כֶם לְ/חָרְבָּ֨ה וּ/לְ/שַׁמָּ֧ה וְ/לִ/קְלָלָ֛ה מֵ/אֵ֥ין יוֹשֵׁ֖ב כְּ/הַ/יּ֥וֹם הַ/זֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/044/022.yaml
  text: And Yahweh could no longer bear it because of the evil of your deeds[a], because of the abominations that you committed. So your land became a ruin, a desolation, and a curse, without inhabitant[c][b], as it is this day.
translation:
  language: zh_hans
  text: 耶和华因你们所作之事的邪恶，又因你们所行的可憎之事，再也不能忍受[a]。因此，你们的土地成了废墟、荒凉[b]和咒诅[c]，无人居住，正如今日一样。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“再也无法忍受”。原文直译为“再也不能承受”，表示宽容已经到了尽头。
    reason: lexical_alternative
  - marker: b
    text: “荒凉”也可含有“令人惊骇之物”或“令人愕然的景象”的意味。
    reason: lexical_alternative
  - marker: c
    text: 或译“成了咒诅”。也可能指这地成为人们咒诅时援引的对象或套语。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的专名“耶和华”来呈现四字神名，避免以普通称号替代原文专名。
- source_word: יוּכַל ... לָשֵׂאת
  choice: 再也不能容忍
  rationale: 此处“承受、负担”用于忍受之义；“不能容忍”自然表达神不再继续宽容，而不把句子误解为能力不足。
- source_word: רֹעַ מַעַלְלֵיכֶם
  choice: 你们所作之事的邪恶
  rationale: 保留原文属格结构及明确的道德判断，而非仅译作泛指的坏事。
- source_word: הַתּוֹעֵבוֹת אֲשֶׁר עֲשִׂיתֶם
  choice: 你们所行的可憎之事
  rationale: “可憎之事”保留该词强烈的宗教与道德厌恶色彩；“所行”符合庄重的现代汉语。
- source_word: וַתְּהִי אַרְצְכֶם
  choice: 因此，你们的土地变成了
  rationale: 上下文显示后句是前述恶行招致的结果，以“因此”明确自然的结果关系。
- source_word: לְחָרְבָּה
  choice: 废墟
  rationale: 简洁表达土地遭毁坏后的残破状态。
- source_word: וּלְשַׁמָּה
  choice: 荒凉得令人惊骇
  rationale: 兼顾该词“荒凉”与“令人惊骇、愕然”的语义范围，避免只保留其中一面。
- source_word: וְלִקְלָלָה
  choice: 成了被人咒诅的话柄
  rationale: 具体表达原文不仅指受咒诅，也可指成为人们咒诅时援引的对象或套语。
- source_word: מֵאֵין יוֹשֵׁב
  choice: 无人居住
  rationale: 以自然、凝练的现代汉语表达完全无人居住。
- source_word: כְּהַיּוֹם הַזֶּה
  choice: 正如今日一样
  rationale: 贴近原文固定表达，并保留说话者指向当时现实状况的语气。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用四字神名而非称号；正文保留专名性质。“耶和华”在现代中文普通读者中辨识度更高，“雅威”则更接近常见学术重构读音。
- issue: “再也不能容忍”是否暗示神能力有限
  choice: 按希伯来语惯用表达理解为宽容达到尽头
  alternative: 再也无法承受
  rationale: 上下文焦点是百姓恶行使审判最终临到，并非讨论神本体上的能力限制；译文仍保留原文强烈的拟人表达，不另加神学解释。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。句法顺应中文表达，将两个原因短语前置；结果部分保留原文三项递进，并以脚注呈现 שַׁמָּה 与 קְלָלָה 的真实语义张力。所有脚注标记均置于正文相应词语之后。
