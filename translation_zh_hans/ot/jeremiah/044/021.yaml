    rationale: עַם הָאָרֶץ 在此可泛指该地民众；采用“这地的百姓”更接近原有表达，避免不必要地界定“当地”。
  revised_text: 你们和你们的祖先、你们的君王和官长，以及这地的百姓，在犹大各城和耶路撒冷的街头所烧的香，雅威岂不记念；它岂不也浮上他的心头吗？[a]
