id: JER.44.21
reference: Jeremiah 44:21
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: הֲ/ל֣וֹא אֶת הַ/קִּטֵּ֗ר אֲשֶׁ֨ר קִטַּרְתֶּ֜ם בְּ/עָרֵ֤י יְהוּדָה֙ וּ/בְ/חֻצ֣וֹת יְרוּשָׁלִַ֔ם אַתֶּ֧ם וַ/אֲבֽוֹתֵי/כֶ֛ם מַלְכֵי/כֶ֥ם וְ/שָׂרֵי/כֶ֖ם וְ/עַ֣ם הָ/אָ֑רֶץ אֹתָ/ם֙ זָכַ֣ר יְהוָ֔ה וַֽ/תַּעֲלֶ֖ה עַל לִבּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/044/021.yaml
  text: Was it not the incense that you burned in the cities of Judah and in the streets of Jerusalem—you and your fathers[a], your kings and your officials, and the people of the land—that Yahweh remembered, and it came up upon his heart?
translation:
  language: zh_hans
  text: 你们和你们的祖先、你们的君王和官长，以及这地的百姓，在犹大各城和耶路撒冷的街头所烧的香，雅威岂不记念；它岂不也浮上他的心头吗？[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “浮上他的心头”直译为“上到他的心上”。“它”在语法上可回指“香”，也可按上下文指焚香这件事；此语表达它进入雅威的内心关注与记念之中。
    reason: 说明希伯来语拟人性习语及阴性单数代词可能的所指，同时不取消正文保留的意象和歧义。
lexical_decisions:
- source_word: הֲלוֹא
  choice: 岂没有……吗
  rationale: 用于反问，预期肯定回答；现代汉语中自然保留其强调和诘问语气。
- source_word: אֶת הַקִּטֵּר אֲשֶׁר קִטַּרְתֶּם
  choice: 你们……所烧的香
  rationale: 将名词性形式与同根动词合译为自然的汉语关系结构，既保留焚香这一祭祀行为，也避免生硬重复。
- source_word: בְּעָרֵי יְהוּדָה וּבְחֻצוֹת יְרוּשָׁלִַם
  choice: 在犹大各城和耶路撒冷街头
  rationale: חֻצוֹת 可指街道或广场；“街头”既自然，也能涵盖公开的城市空间。
- source_word: אַתֶּם וַאֲבוֹתֵיכֶם
  choice: 你们和你们的祖先
  rationale: אֲבוֹת 在此指前代；“祖先”较“父亲”更准确地表达群体的历代先人。
- source_word: מַלְכֵיכֶם וְשָׂרֵיכֶם
  choice: 你们的君王和官长
  rationale: שָׂרִים 指掌权者或官员；“官长”庄重且不误导为王室子弟。
- source_word: וְעַם הָאָרֶץ
  choice: 以及当地的百姓
  rationale: 保留一般民众与统治者并列的含义；避免把该短语武断限定为某一社会阶层。“当地”对应 הָאָרֶץ 在语境中的地域关系。
- source_word: זָכַר יְהוָה
  choice: 雅威岂没有记得吗
  rationale: זכר 直译为“记得”；神名 יְהוָה 音译为“雅威”，保留专名性质。
- source_word: וַתַּעֲלֶה עַל לִבּוֹ
  choice: 这事岂没有涌上他的心头吗
  rationale: 保留“上到心上”的拟人性意象，同时用现代汉语可理解的“涌上心头”表达；“这事”承接整个焚香行为。分作并列反问，使希伯来语中的后续陈述在汉语里衔接自然。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；采用常见的学术音译“雅威”，不以称号替代专名。
- issue: עַל לִבּוֹ 的拟人表达
  choice: 涌上他的心头
  alternative: 被他放在心上；进入他的意念
  rationale: 保留原文把“心”用于雅威的拟人性和神学张力，不将其化约为纯认知性的解释。
- issue: 单数阴性动词 וַתַּעֲלֶה 的所指
  choice: 以“这事”概括前述焚香行为
  alternative: 以“香”作为语法主语
  rationale: 该动词可回指阴性名词所表达的焚香之事或行为；汉语以“这事”承接，既清楚又不把所指过度限定为香料实体。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。以“岂没有……吗”保留先知话语的反问力度；正文保留“心头”的拟人意象，并借脚注解释其含义。
