revisions:
- from: 你们和你们的祖先、你们的君王和官长，以及当地的百姓，在犹大各城和耶路撒冷街头所烧的香，雅威岂没有记得吗？这事岂没有涌上他的心头吗？[a]
  to: 你们和你们的祖先、你们的君王和官长，以及这地的百姓，在犹大各城和耶路撒冷的街头所烧的香，雅威岂不记念；它岂不也浮上他的心头吗？[a]
  rationale: 修订使一个汉语反问覆盖原文的两个并列陈述，以“它”而非“这事”保留阴性单数动词的可能回指；将“涌上”改为“浮上”，减少原文未明示的动态强化；并将“当地的百姓”改为较透明的“这地的百姓”。
