  text: כֹּה אָמַ֞ר יְהוָ֤ה צְבָאוֹת֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל אַתֶּ֣ם רְאִיתֶ֗ם אֵ֤ת כָּל הָֽ/רָעָה֙ אֲשֶׁ֤ר הֵבֵ֨אתִי֙ עַל יְר֣וּשָׁלִַ֔ם וְ/עַ֖ל כָּל עָרֵ֣י יְהוּדָ֑ה וְ/הִנָּ֤/ם חָרְבָּה֙ הַ/יּ֣וֹם הַ/זֶּ֔ה וְ/אֵ֥ין בָּ/הֶ֖ם יוֹשֵֽׁב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/044/002.yaml
  text: 'Thus says Yahweh of hosts[a], the God of Israel: You yourselves have seen all the disaster that I brought on Jerusalem and on all the cities of Judah. And behold, they are a ruin this day[b], and there is no one living in them.'
translation:
  language: zh_hans
  text: 万军之耶和华[a]、以色列的上帝如此说：“我降在耶路撒冷和犹大各城的一切灾祸，你们都亲眼看见了。看哪，这些地方今日已成废墟[b]，无人居住。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “耶和华”是希伯来文神名 יהוה 的传统中文音译，也常译作“雅威”；“万军”可指天上和地上的众军。
    reason: 说明神名音译及称号的语义范围。
  - marker: b
    text: 或译：“今日一片荒凉。”
    reason: 保留 חָרְבָּה 可表达“废墟”或“荒凉状态”的词义空间。
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: 如此说
  rationale: 保留先知传信公式的庄重语气，同时符合现代汉语圣经文体。
- source_word: יְהוָה צְבָאוֹת
  choice: 万军之耶和华
  rationale: “万军”保留 צְבָאוֹת 可涵盖天上与地上众军的宽广含义；“耶和华”作为该神名在现代中文中的通行音译。
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: 以色列的上帝
  rationale: 直接表达原文的属格结构，并使用现代标准汉语。
- source_word: אַתֶּם רְאִיתֶם
  choice: 你们都亲眼看见了
  rationale: 独立人称代词带有强调作用；“亲眼”自然传达听众自身见证这一重点。
- source_word: כָּל הָרָעָה
  choice: 一切灾祸
  rationale: 此处 רָעָה 指临到城邑的毁灭性灾难或审判，并非道德意义上的邪恶。
- source_word: הֵבֵאתִי עַל
  choice: 我降在……的
  rationale: 自然表达使某种灾祸临到某地的使役意义，并保留上帝是行动主体。
- source_word: וְהִנָּם
  choice: 看哪，这些地方
  rationale: “看哪”保留指示并唤起注意的语篇功能；“这些地方”自然承接耶路撒冷和犹大各城。
- source_word: חָרְבָּה
  choice: 已成废墟
  rationale: 表达荒废、毁坏后的状态；汉语用“废墟”能自然涵盖前述多个地点。
- source_word: הַיּוֹם הַזֶּה
  choice: 今日
  rationale: 简洁对应“这日”，不额外加入“直到今日”的持续含义。
- source_word: וְאֵין בָּהֶם יוֹשֵׁב
  choice: 无人居住
  rationale: 以自然简洁的现代汉语表达其中没有居民。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名；中文正文采用读者最熟悉且通行的专名音译“耶和华”，不以“主”这一称号替代，同时用脚注注明另一常见拟音。
- issue: רָעָה 用于上帝所降之事
  choice: 灾祸
  alternative: 祸患
  rationale: 上下文明确指对耶路撒冷和犹大诸城的毁灭性审判；译作“灾祸”避免暗示上帝施行道德上的恶，同时不削弱审判的严厉性。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“如此说”和“看哪”保留先知宣告的正式节奏；其余句法避免文言化，使普通现代读者易于理解。
