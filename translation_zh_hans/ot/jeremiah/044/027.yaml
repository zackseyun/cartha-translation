source:
  edition: WLC
  text: הִנְ/נִ֨י שֹׁקֵ֧ד עֲלֵי/הֶ֛ם לְ/רָעָ֖ה וְ/לֹ֣א לְ/טוֹבָ֑ה וְ/תַמּוּ֩ כָל אִ֨ישׁ יְהוּדָ֜ה אֲשֶׁ֧ר בְּ/אֶֽרֶץ מִצְרַ֛יִם בַּ/חֶ֥רֶב וּ/בָ/רָעָ֖ב עַד כְּלוֹתָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/044/027.yaml
  text: Behold[a], I am watching over them for harm and not for good, and every man of Judah who is in the land of Egypt will come to an end by the sword and by famine[c][b], until they are consumed.
translation:
  language: zh_hans
  text: 看哪，我正留意他们，要降祸[a]，不赐福；每一个住在埃及地的犹大人[b]都必因刀剑和饥荒而灭亡，直到他们灭尽[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “祸”也可译作“灾祸”或“灾难”；这里指审判所带来的伤害，并非道德上的邪恶。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“每一个犹大人”，采用阳性单数形式作逐一、分配性的表达。
    reason: source_form
  - marker: c
    text: “灭尽”也可译作“被耗尽”或“全都消灭”。原文在前句“灭亡”之后再次强调彻底的结局。
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנְנִי
  choice: 看哪
  rationale: 这是先知话语中引人注意的庄严宣告；“看哪”既保留其强调作用，也符合现代中文的经文语体。
- source_word: שֹׁקֵד עֲלֵיהֶם
  choice: 我正留意他们
  rationale: שׁקד表示警醒、持续地关注；此处保留进行性的分词意味。敌对结果由下文“要降祸”表达，不把介词本身过度译成“敌对他们”。
- source_word: לְרָעָה וְלֹא לְטוֹבָה
  choice: 要降祸，不赐福
  rationale: רָעָה在这里指灾祸或有害的审判结果，并非道德上的邪恶；中文以“降祸／赐福”自然呈现原文的鲜明对照。
- source_word: וְתַמּוּ
  choice: 都必死于
  rationale: תמם表示终结、耗尽。结合随后“刀剑和饥荒”这两种致死方式，译作“死于”简洁自然；末句则保留全体被耗尽的最终意味。
- source_word: כָל אִישׁ יְהוּדָה
  choice: 每一个……犹大人
  rationale: 保留原文阳性单数的逐一、分配性表达，同时“犹大人”在现代中文中自然指属于犹大群体的人。
- source_word: אֲשֶׁר בְּאֶרֶץ מִצְרַיִם
  choice: 住在埃及地的
  rationale: 关系从句承接分配性单数；补出中文所需的“住在”，并保留“埃及地”这一完整地理表达。
- source_word: בַּחֶרֶב וּבָרָעָב
  choice: 死于刀剑和饥荒
  rationale: 保留耶利米书常见的审判公式及其工具、原因意味。
- source_word: עַד כְּלוֹתָם
  choice: 直到他们灭尽
  rationale: כלה的结构表达群体被彻底耗尽、直至终结；“灭尽”保留原文严峻的终局性，也不消除它与前句的刻意重复。
theological_decisions:
- issue: 如何表达上帝所降的רָעָה而不暗示道德邪恶
  choice: 降祸
  alternative: 作恶／降灾
  rationale: 此处所指是审判性的灾祸和伤害结果，不是说上帝在道德上行恶；“降祸”既保留审判的严厉，也避免错误含义。
- issue: כָל אִישׁ יְהוּדָה的性别和分配性
  choice: 每一个……犹大人
  alternative: 所有犹大人／每一个犹大男子
  rationale: “每一个”保留单数分配性；אִישׁ在这一群体表达中可指个体成员，若径直译成“男子”可能无根据地把妇女排除在审判对象之外，而“所有”则会削弱原文逐一指认的形式。
- issue: 保留וְתַמּוּ与עַד כְּלוֹתָם之间的语义复现
  choice: 都必死于……直到他们灭尽
  alternative: 都必灭尽／直到全部死去
  rationale: 原文先说他们终结，随后又说直至耗尽，具有强化作用。译文保留这一张力和重复，而不将两部分合并。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“看哪”保留先知宣告的郑重语气；正文避免生硬直译，同时保留“降祸／赐福”的对照、逐一指认的表达，以及末尾重复强化的彻底性。
