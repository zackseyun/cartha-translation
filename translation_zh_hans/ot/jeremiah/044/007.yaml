  naturalness: “大大害自己”稍显生硬，“犹大中间”不如“从犹大中”自然；“不给自己留下一个余民”中的量词搭配不合现代汉语常用法。改为“作这大恶，害自己”既庄重自然，也较好保留原文的道德恶与自取祸害之间的关联。
  terminology: 保留“耶和华”“万军之上帝”“以色列的上帝”“剪除”“余民”，可维持神名、神圣称号和耶利米书关键词的一致性。
