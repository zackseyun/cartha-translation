  text: וְ/עַתָּ֡ה כֹּֽה אָמַ֣ר יְהוָה֩ אֱלֹהֵ֨י צְבָא֜וֹת אֱלֹהֵ֣י יִשְׂרָאֵ֗ל לָ/מָה֩ אַתֶּ֨ם עֹשִׂ֜ים רָעָ֤ה גְדוֹלָה֙ אֶל נַפְשֹׁ֣תֵ/כֶ֔ם לְ/הַכְרִ֨ית לָ/כֶ֧ם אִישׁ וְ/אִשָּׁ֛ה עוֹלֵ֥ל וְ/יוֹנֵ֖ק מִ/תּ֣וֹךְ יְהוּדָ֑ה לְ/בִלְתִּ֛י הוֹתִ֥יר לָ/כֶ֖ם שְׁאֵרִֽית־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/044/007.yaml
  text: 'And now[a], thus says Yahweh, the God of hosts, the God of Israel: Why are you doing this great evil against yourselves, to cut off from among Judah man and woman, child and infant, leaving yourselves no remnant?'
translation:
  language: zh_hans
  text: “现在，耶和华——万军之上帝、以色列的上帝——如此说：你们为什么要作这大恶，害自己[a]，以致从犹大中剪除男女、孩童和吃奶的婴儿，不给自己留下余民呢？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “作这大恶，害自己”也可译作“给自己造成大害”。原文的“恶”既可指道德上的邪恶，也可指造成伤害或灾祸；这里两层意思彼此相连。
    reason: 保留רָעָה在本句中道德之恶与自取祸害之间的词义张力。
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代汉语中广为人知的专名“耶和华”音译四字神名，避免用头衔替代其专名性质。
- source_word: אֱלֹהֵי צְבָאוֹת
  choice: 万军之上帝
  rationale: 保留固定神圣称号及צְבָאוֹת所含军旅、众军的宽广意象；“万军之上帝”在中文中庄重而可懂。
- source_word: עֹשִׂים רָעָה גְדוֹלָה אֶל נַפְשֹׁתֵכֶם
  choice: 这样大大害自己
  rationale: 上下文强调行为导致自我毁灭，故正文自然表达为“害自己”；脚注保留רָעָה兼具道德之“恶”与灾害之“祸害”的歧义。
- source_word: נַפְשֹׁתֵכֶם
  choice: 自己
  rationale: 此处נֶפֶשׁ指整个人或性命；译作“自己”符合反身语义，避免误解为只伤害非物质的“灵魂”。
- source_word: לְהַכְרִית
  choice: 被剪除
  rationale: 保留כרת“剪除”的先知审判意象；结合句法用被动式，清楚表达他们的行为将使各类人从犹大消失。
- source_word: אִישׁ וְאִשָּׁה עוֹלֵל וְיוֹנֵק
  choice: 男女、孩童和吃奶的婴儿
  rationale: 以自然汉语涵盖成年男女、幼童及仍在吃奶的婴儿，保存原文逐层列举的全面性。
- source_word: מִתּוֹךְ יְהוּדָה
  choice: 犹大中间
  rationale: 贴近מִתּוֹךְ“从……中间”的空间及群体意义，不预先限定“犹大”仅指地域或人民。
- source_word: שְׁאֵרִית
  choice: 余民
  rationale: “余民”既表示灾难后留下的人，也保存该词在耶利米书中的先知性回响。
theological_decisions:
- issue: רָעָה的道德与灾害双重含义
  choice: 正文译“这样大大害自己”，脚注说明也可理解为“对自己行这大恶”
  alternative: 这样对自己行大恶
  rationale: 结果分句直接描述全体被剪除，支持“自害”的语境义；但原词仍可指道德上的恶，因此不在正文中把张力彻底消解。
- issue: שְׁאֵרִית的表达
  choice: 余民
  alternative: 剩下的人；幸存者
  rationale: “余民”准确指审判后存留的群体，并保留耶利米书的关键词关联，同时不额外界定其救恩地位。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“如此说”保留先知宣告的正式语气；“吃奶的婴儿”具体传达יוֹנֵק；问句末用“呢”使强烈责问符合现代汉语表达。
