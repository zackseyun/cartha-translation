revisions:
- from: “现在，万军之上帝、以色列的上帝耶和华如此说：你们为什么要这样大大害自己[a]，使犹大中间的男女、孩童和吃奶的婴儿都被剪除，不给自己留下一个余民呢？”
  to: “现在，耶和华——万军之上帝、以色列的上帝——如此说：你们为什么要作这大恶，害自己[a]，以致从犹大中剪除男女、孩童和吃奶的婴儿，不给自己留下余民呢？”
  rationale: 修订消除原文未明示的“这样”，以“作这大恶，害自己”在正文中保留道德谴责和反身伤害的紧密关系，并以脚注说明词义张力。调整神名同位称号的语序，采用更自然的“从犹大中”，并删去“余民”前不自然的量词；其余列举、审判意象及先知性关键词均予保留。
