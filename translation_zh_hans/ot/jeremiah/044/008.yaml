source:
  edition: WLC
  text: לְ/הַכְעִסֵ֨/נִי֙ בְּ/מַעֲשֵׂ֣י יְדֵי/כֶ֔ם לְ/קַטֵּ֞ר לֵ/אלֹהִ֤ים אֲחֵרִים֙ בְּ/אֶ֣רֶץ מִצְרַ֔יִם אֲשֶׁר אַתֶּ֥ם בָּאִ֖ים לָ/ג֣וּר שָׁ֑ם לְמַ֨עַן֙ הַכְרִ֣ית לָ/כֶ֔ם וּ/לְמַ֤עַן הֱיֽוֹתְ/כֶם֙ לִ/קְלָלָ֣ה וּ/לְ/חֶרְפָּ֔ה בְּ/כֹ֖ל גּוֹיֵ֥י הָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/044/008.yaml
  text: provoking me to anger by the works of your hands[a], by burning incense to other gods in the land of Egypt, where you are going to sojourn[c][b], so that you may cut yourselves off and so that you may become a curse and a reproach among all the nations of the earth.
translation:
  language: zh_hans
  text: 你们竟以亲手所做的事[a]惹我发怒，就是在你们前往寄居[b]的埃及地向别神烧香，以致使自己遭剪除[c]，并在地上万国中成为咒诅[d]和羞辱。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “亲手所做的事”也可理解为“亲手所造之物”，在这里可能特指人手制造的偶像。
    reason: 保留希伯来语习语在“行为”与“制成之物”之间的语义幅度。
  - marker: b
    text: “寄居”指以外来者的身份居住。
    reason: 说明 גור 在一般“居住”之外所含的外来居民意味。
  - marker: c
    text: 也可译作“以致你们自取灭亡”或“以致你们被剪除”。原文没有在此明说执行剪除者。
    reason: 保留自害、被动结果以及上下文所暗含的神圣审判之间的歧义。
  - marker: d
    text: “成为咒诅”也可理解为“成为人咒诅时所援引的对象”，即他们的遭遇成为咒诅别人的话柄。
    reason: 说明 קְלָלָה 可指咒诅本身，也可指咒诅公式所援引的对象。
lexical_decisions:
- source_word: לְהַכְעִסֵנִי
  choice: 惹我发怒
  rationale: 保留使役含义，明示这些行为激起上帝的怒气；现代汉语自然清楚。
- source_word: בְּמַעֲשֵׂי יְדֵיכֶם
  choice: 以自己手所做的事
  rationale: 保留希伯来语“手所做的”这一表达，不在正文中限定为偶像；在本语境中可涵盖人手制造之物及相关敬拜行为。
- source_word: לְקַטֵּר
  choice: 烧香
  rationale: 该词在此祭祀语境中通常指焚香，也可较广地指使祭物冒烟；“烧香”最符合上下文且易懂。
- source_word: לֵאלֹהִים אֲחֵרִים
  choice: 向别神
  rationale: 直译“其他的神”，不额外引入“外邦的”这一解释。
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: 在埃及地
  rationale: 明确保留 אֶרֶץ“地”，同时符合现代汉语的圣经叙事语体。
- source_word: אֲשֶׁר אַתֶּם בָּאִים לָגוּר שָׁם
  choice: 你们前往寄居的
  rationale: “寄居”保留 גור 所含以外来者身份居住的意味；按汉语习惯省去已由定语结构表达的“那里”。
- source_word: לְמַעַן הַכְרִית לָכֶם
  choice: 以致使自己被剪除
  rationale: “以致”容纳目的与结果之间的语义张力；“使自己被剪除”既反映 לָכֶם 的自害意味，又不擅自补出经文未明说的施事者。
- source_word: וּלְמַעַן הֱיוֹתְכֶם
  choice: 并……成为
  rationale: 表达进入某种状态的结果，并与前一结果分句自然衔接。
- source_word: לִקְלָלָה
  choice: 咒诅
  rationale: 保留该词可指“咒诅”本身或“被人用作咒诅话柄之对象”的双重可能。
- source_word: וּלְחֶרְפָּה
  choice: 羞辱
  rationale: 传达 חרפה 所含的耻辱、受辱及遭人鄙弃之意，现代读者容易理解。
- source_word: בְּכֹל גּוֹיֵי הָאָרֶץ
  choice: 在地上万国中
  rationale: “地上”在“万国”的搭配中自然指全地；“在……中”表达他们在列国间所处的羞辱地位。
theological_decisions:
- issue: לְמַעַן הַכְרִית לָכֶם 中剪除的施事者与百姓自身的责任
  choice: 以致使自己被剪除
  alternative: 以致你们自取灭亡；以致我将你们剪除；以致你们被剪除
  rationale: 希伯来文没有在本分句中明说新的施事者，而 לָכֶם 带有行动反归自身、给自身招致祸害的意味。译文保留百姓自招结局与神施行审判之间的张力，不擅自排除任何一面。
- issue: לְמַעַן 所表达的是目的还是结果
  choice: 以致
  alternative: 为要；结果
  rationale: 上下文可把结局理解为他们行为所导致的结果，也带有带讽刺意味的目的表达。“以致”在汉语中容纳这种张力，避免断定他们主观上企图毁灭自己。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“别神”“寄居”“被剪除”等词保留先知审判宣告的圣经语感，同时用脚注解释普通读者可能不熟悉的习语。句首“你们竟”承接本节在原文中的从属/质问语势，使独立引述时仍自然，但不补入原文未明说的完整问句。
