id: JER.44.29
reference: Jeremiah 44:29
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/זֹאת לָ/כֶ֤ם הָ/אוֹת֙ נְאֻם יְהוָ֔ה כִּֽי פֹקֵ֥ד אֲנִ֛י עֲלֵי/כֶ֖ם בַּ/מָּק֣וֹם הַ/זֶּ֑ה לְמַ֨עַן֙ תֵּֽדְע֔וּ כִּי֩ ק֨וֹם יָק֧וּמוּ דְבָרַ֛/י עֲלֵי/כֶ֖ם לְ/רָעָֽה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/044/029.yaml
  text: And this will be the sign for you[a], declares Yahweh, that I am punishing you in this place, so that you may know that my words will surely stand against you for harm.
translation:
  language: zh_hans
  text: “这就是给你们的记号[a]——雅威宣告：我要在这地方惩罚你们，好让你们知道，我的话必定会实现，给你们带来灾祸。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本句末尾也可译作：“我的话必定会应验，针对你们而带来灾祸。”原文直译为“我的话必定会站立（或成立），针对你们，为灾祸”。
    reason: 说明 קוֹם יָקוּמוּ 的加强语气和“站立／成立”的字面意象，并交代 עֲלֵיכֶם לְרָעָה 的“针对你们、带来灾祸”之意。
lexical_decisions:
- source_word: וְזֹאת לָכֶם הָאוֹת
  choice: 这就是给你们的记号
  rationale: 补出汉语所需的判断词“就是”，同时保留指示语、复数受词和预告性“记号”的含义。
- source_word: נְאֻם יְהוָה
  choice: 雅威宣告说
  rationale: 以自然的先知宣告用语表达固定公式，并直接音译神名 יהוה。
- source_word: כִּי פֹקֵד אֲנִי עֲלֵיכֶם
  choice: 我要……惩罚你们
  rationale: פקד 本可指眷顾、察看或追讨；本节明确以降祸为结局，因此采用负面的“惩罚”，并以将来表达即将施行的行动。
- source_word: בַּמָּקוֹם הַזֶּה
  choice: 在这地方
  rationale: 保留原文直接的地点指示。
- source_word: לְמַעַן תֵּדְעוּ
  choice: 好让你们知道
  rationale: 自然表达目的关系，同时保留其认知结果。
- source_word: כִּי קוֹם יָקוּמוּ דְבָרַי
  choice: 我的话必定会立定
  rationale: “必定”体现不定式绝对形配合限定动词的加强语气；“立定”保留 קום 的形象及话语确定成立的含义。
- source_word: עֲלֵיכֶם לְרָעָה
  choice: 降祸于你们
  rationale: 结合“针对你们”与“为祸害”两层关系，表达这些话将以灾祸临到他们，而非把 רָעָה 理解为神的道德邪恶。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文明确使用四字神名；“雅威”较直接地保留其专名性质，不以称号替代。
- issue: לְרָעָה 是否译作道德意义的“恶”
  choice: 降祸于你们
  alternative: 对你们不利；使灾难临到你们
  rationale: 上下文指审判所带来的灾祸与伤害，而非宣称神的话在道德上为恶。
- issue: קוֹם יָקוּמוּ 的形象是否保留
  choice: 必定会立定
  alternative: 必定应验
  rationale: “应验”更惯用，但会消除原文“站立、成立”的措辞；正文保留该形象，脚注交代自然的替代译法。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“给你们的记号”“在这地方”保持先知话语的直接感；“立定”略带经文语体，但仍可理解，并借脚注说明“应验”的含义。
