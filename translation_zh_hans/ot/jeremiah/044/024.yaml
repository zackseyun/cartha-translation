revisions:
- from: 耶利米又对众民和所有妇女说：“所有住在埃及地的犹大人[a]，你们要听耶和华的话。”
  to: 耶利米于是对全体百姓和所有妇女说：“所有在埃及地的犹大人哪，你们要听雅威的话。”
  rationale: 修订以“于是”表达叙事推进，以“全体百姓”提升现代汉语清晰度，并将神名统一为“雅威”以对应原文 יהוה 和英文 POB 的 Yahweh。正文仍将集合性称谓译为易懂的“犹大人”，脚注保留“犹大”的形式及其集合含义。
