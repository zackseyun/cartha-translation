  text: וַ/יֹּ֤אמֶר יִרְמְיָ֨הוּ֙ אֶל כָּל הָ/עָ֔ם וְ/אֶ֖ל כָּל הַ/נָּשִׁ֑ים שִׁמְעוּ֙ דְּבַר יְהוָ֔ה כָּל יְהוּדָ֕ה אֲשֶׁ֖ר בְּ/אֶ֥רֶץ מִצְרָֽיִם־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/044/024.yaml
  text: Then Jeremiah said to all the people and to all the women[a], “Hear the word of Yahweh, all Judah who are in the land of Egypt.”
translation:
  language: zh_hans
  text: 耶利米于是对全体百姓和所有妇女说：“所有在埃及地的犹大人哪，你们要听雅威的话。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 又……说
  rationale: 承接前文叙事；“又”在现代汉语中自然表达希伯来语连续叙事的推进，而不必机械译作“于是”。
- source_word: יִרְמְיָהוּ
  choice: 耶利米
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: אֶל כָּל הָעָם
  choice: 对众民
  rationale: עָם在此为集合名词；“众民”简洁庄重，也保留“全体百姓”的含义。
- source_word: וְאֶל כָּל הַנָּשִׁים
  choice: 和所有妇女
  rationale: נָשִׁים可指“妇女”或“妻子”；本节是公开宣告的对象，且上下文特别提到妇女，因此正文译作“妇女”。
- source_word: שִׁמְעוּ
  choice: 你们要听
  rationale: 复数祈使式；补出“你们”使中文呼语清楚，并保留先知宣告中的命令语气。
- source_word: דְּבַר יְהוָה
  choice: 耶和华的话
  rationale: 保留先知书中固定而重要的表达“YHWH的话”，不用较解释性的“信息”。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代简体中文读者最熟悉、且作为专名使用的传统音译，以区别于称号“主”。
- source_word: כָּל יְהוּדָה אֲשֶׁר בְּאֶרֶץ מִצְרָיִם
  choice: 所有住在埃及地的犹大人
  rationale: כָּל יְהוּדָה在此集合性地指身在埃及的犹大群体；译作“犹大人”比直译“全犹大”更符合现代汉语，同时以脚注保留形式较贴近原文的译法。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用四字神名。正文采用简体中文圣经传统中最通行的专名“耶和华”，不以“主”替代，从而保留其作为神名的功能；“雅威”是较贴近学术重构读音的另一译法。
- issue: “犹大”是地域/国家名称还是群体称谓
  choice: 犹大人
  alternative: 全犹大
  rationale: 关系从句“住在埃及地的”表明这里直接呼唤的是移居埃及的犹大群体。译作“犹大人”使现代读者易懂，但脚注保留集合名称所具有的原文形式。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“众民”“耶和华的话”保留先知宣告的经文语体；调整呼语次序，将“所有住在埃及地的犹大人”置于命令之前，使中文指向清楚。
