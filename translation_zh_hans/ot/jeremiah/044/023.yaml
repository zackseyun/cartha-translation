language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: מִ/פְּנֵי֩ אֲשֶׁ֨ר קִטַּרְתֶּ֜ם וַ/אֲשֶׁ֧ר חֲטָאתֶ֣ם לַ/יהוָ֗ה וְ/לֹ֤א שְׁמַעְתֶּם֙ בְּ/ק֣וֹל יְהוָ֔ה וּ/בְ/תֹרָת֧/וֹ וּ/בְ/חֻקֹּתָ֛י/ו וּ/בְ/עֵדְוֺתָ֖י/ו לֹ֣א הֲלַכְתֶּ֑ם עַל כֵּ֞ן קָרָ֥את אֶתְ/כֶ֛ם הָ/רָעָ֥ה הַ/זֹּ֖את כַּ/יּ֥וֹם הַ/זֶּֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/044/023.yaml
  text: Because you burned incense and sinned against Yahweh[a], and did not listen to the voice of Yahweh or walk in his law, his statutes, and his testimonies, therefore this disaster has come upon you[d][c][b], as it is this day.
translation:
  language: zh_hans
  text: 你们烧香[a]，得罪雅威，又不听从雅威的话[b]，不遵行他的律法[c]、律例和法度；正因如此，这灾祸[d]才临到你们，正如今日所见。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“献香”。原文动词指焚烧香料或祭物，使其烟气上升。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“听雅威的声音”，在这里含有顺服的意思。
    reason: lexical_alternative
  - marker: c
    text: “律法”也可译作“教导”（希伯来文：תורה，torah）。
    reason: lexical_alternative
  - marker: d
    text: “灾祸”也可译作“祸患”。这里的希伯来词可指“恶”，但在本句中指临到人的灾难。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִפְּנֵי אֲשֶׁר
  choice: 正因如此
  rationale: 保留原文明确的因果关系，并在汉语中自然承接前述罪行与后面的灾祸。
- source_word: קִטַּרְתֶּם
  choice: 烧香
  rationale: 该动词在本段祭祀语境中指焚烧香料、使祭物冒烟；“烧香”简明自然，并由脚注补充“献香”的含义。
- source_word: חֲטָאתֶם לַיהוָה
  choice: 得罪雅威
  rationale: חטא 与介词 ל 在此表示向雅威犯罪；“得罪”是现代汉语中自然、庄重的表达。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以中文音译呈现以色列上帝的专名，而不以称号替代。
- source_word: שְׁמַעְתֶּם בְּקוֹל יְהוָה
  choice: 听从雅威的话
  rationale: 原文直译为“听雅威的声音”，在此兼有听取与顺服之意；“听从……的话”既自然又保留服从的语义。
- source_word: וּבְתוֹרָתוֹ
  choice: 他的律法
  rationale: תורה 可泛指教导，但在与“律例、法度”并列的盟约语境中，“律法”最为清楚。
- source_word: וּבְחֻקֹּתָיו
  choice: 律例
  rationale: 保留该词在盟约和法律语境中所指的规定，并与相邻词项有所区别。
- source_word: וּבְעֵדְוֹתָיו
  choice: 法度
  rationale: 采用庄重而仍可理解的传统法律用语，以保留原文三项并列的词汇层次。
- source_word: לֹא הֲלַכְתֶּם
  choice: 不遵行
  rationale: 原文是“没有行在……之中”的行为隐喻；汉语以“不遵行”自然表达按这些规范生活行事。
- source_word: קָרָאת אֶתְכֶם הָרָעָה הַזֹּאת
  choice: 这灾祸才临到你们
  rationale: רעה 在审判语境中指灾难而非道德上的邪恶；“临到”自然表达灾祸发生在他们身上。
- source_word: כַּיּוֹם הַזֶּה
  choice: 正如今日所见
  rationale: 此惯用语指向当下可见的结果；该译法在现代汉语中自然，并保留其现实指示作用。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文使用四字神名，音译“雅威”保留其专名性质，不以称号“主”替代。
- issue: רָעָה 在审判语境中的含义
  choice: 灾祸
  alternative: 祸患；恶事
  rationale: 上下文所说的是临到百姓的惩罚性灾难，不是把道德之恶归给上帝；“灾祸”准确保留事件性的审判含义。
- issue: “不听”是否明确译成“不顺服”
  choice: 听从雅威的话
  alternative: 顺服雅威；听雅威的声音
  rationale: “听从”保留听取与服从之间的语义张力，既不只表示听见，也不完全消去原文“听声音”的表达。
translation_notes:
  register: 采用现代、庄重而通顺的书面汉语。“律法、律例和法度”保留原文三个盟约法律词项的并列，不将其压缩为单一概念；分号清楚呈现罪行与后果之间的因果结构。
