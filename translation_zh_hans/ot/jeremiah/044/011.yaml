  text: לָ/כֵ֗ן כֹּֽה אָמַ֞ר יְהוָ֤ה צְבָאוֹת֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל הִנְ/נִ֨י שָׂ֥ם פָּנַ֛/י בָּ/כֶ֖ם לְ/רָעָ֑ה וּ/לְ/הַכְרִ֖ית אֶת כָּל יְהוּדָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/044/011.yaml
  text: 'Therefore[a], this is what Yahweh of Armies, the God of Israel, says: Behold, I am setting my face against you for harm[b], to cut off all Judah.'
translation:
  language: zh_hans
  text: 所以，万军之耶和华[a]——以色列的上帝这样说：“看哪，我必定意与你们为敌，使你们遭灾，并要剪除全犹大。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “万军之耶和华”也可译作“统领天军的耶和华”；“耶和华”是希伯来文神名יהוה的传统中文音译。
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: 所以
  rationale: 承接上文的指控，引出审判结论；“所以”在现代汉语中自然保留了推论关系。
- source_word: כֹּה אָמַר
  choice: 如此说
  rationale: 保留先知宣告中庄严的使者公式，同时符合现代汉语表达。
- source_word: יְהוָה צְבָאוֹת
  choice: 万军之耶和华
  rationale: “耶和华”采用神名四字母的传统中文音译；“万军”表达צְבָאוֹת所指受上帝统领的众军，是中文圣经语体中清楚而庄重的称号。
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: 以色列的上帝
  rationale: 直接表达原文的属格结构，指明说话者是以色列的上帝。
- source_word: הִנְנִי
  choice: 看哪，我
  rationale: “看哪”保留原文提示注意并强调上帝郑重决意的功能，也维持先知话语的庄严语体。
- source_word: שָׂם פָּנַי בָּכֶם
  choice: 我定意攻击你们
  rationale: 原文直译为“把我的脸朝向你们”，在此是坚定敌对和施行审判的习语；中文若直译容易被误解，因此以“定意攻击”传达其决绝意味。
- source_word: לְרָעָה
  choice: 降下灾祸
  rationale: 此处רָעָה指审判中的祸患、灾难，而非道德上的邪恶；“降下灾祸”也自然衔接上帝主动施行审判的语境。
- source_word: וּלְהַכְרִית
  choice: 并要剪除
  rationale: 保留כרת“剪除、断绝”的强烈审判意象，又不把其具体方式过度限定为某一种毁灭。
- source_word: כָּל יְהוּדָה
  choice: 整个犹大
  rationale: 保留原文集合性的简洁表达，可涵盖被称为“犹大”的群体，而不擅自限定为领土或某一部分居民。
theological_decisions:
- issue: 神名及称号יְהוָה צְבָאוֹת的译法
  choice: 万军之耶和华
  alternative: 统领天军的耶和华；万军之主
  rationale: 正文保留专有神名，不以一般称号“主”取代；同时将צְבָאוֹת译为传统而透明的“万军”，不额外限定其只指天军或地上的军队。
- issue: לְרָעָה是否表示上帝行道德上的恶
  choice: 降下灾祸
  alternative: 加害；降恶
  rationale: 上下文所说的是审判所带来的灾难，不是把道德邪恶归于上帝；译文保留惩罚和毁灭性的力度，同时避免错误的伦理含义。
- issue: שָׂם פָּנַי בָּכֶם的面部隐喻
  choice: 定意攻击你们
  alternative: 向你们变脸；使我的脸转向你们
  rationale: 该习语表达坚定的敌对与审判。直译在现代汉语中可能显得含义不明，因此正文明确其语用意义；并未把审判方式进一步具体化。
translation_notes:
  register: 采用现代、庄重而易懂的先知宣告语体。“看哪”“剪除”保留原文的肃穆和审判力度；其余表达避免生硬逐字直译。破折号标明“万军之耶和华”与“以色列的上帝”为同一说话者的并列称谓。
