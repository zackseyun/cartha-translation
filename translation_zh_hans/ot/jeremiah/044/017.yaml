reference: Jeremiah 44:17
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כִּ֩י עָשֹׂ֨ה נַעֲשֶׂ֜ה אֶֽת כָּל הַ/דָּבָ֣ר אֲשֶׁר יָצָ֣א מִ/פִּ֗י/נוּ לְ/קַטֵּ֞ר לִ/מְלֶ֣כֶת הַ/שָּׁמַיִם֮ וְ/הַסֵּֽיךְ לָ֣/הּ נְסָכִים֒ כַּ/אֲשֶׁ֨ר עָשִׂ֜ינוּ אֲנַ֤חְנוּ וַ/אֲבֹתֵ֨י/נוּ֙ מְלָכֵ֣י/נוּ וְ/שָׂרֵ֔י/נוּ בְּ/עָרֵ֣י יְהוּדָ֔ה וּ/בְ/חֻצ֖וֹת יְרוּשָׁלִָ֑ם וַ/נִּֽשְׂבַּֽע לֶ֨חֶם֙ וַ/נִּֽהְיֶ֣ה טוֹבִ֔ים וְ/רָעָ֖ה לֹ֥א רָאִֽינוּ־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/044/017.yaml
  text: 'But we will certainly do every word that has gone out from our mouth: to burn incense to the Queen of Heaven and to pour out drink offerings to her[a], just as we and our fathers, our kings and our officials, did in the cities of Judah and in the streets of Jerusalem; then we had plenty of bread, prospered[b], and saw no disaster.'
translation:
  language: zh_hans
  text: “我们一定要照自己亲口说出的一切去做：向天后烧香，向她奠酒[a]，就像从前我们和我们的祖先、君王、官长在犹大的各城和耶路撒冷的街道上所做的一样。那时我们吃得饱，过得安好[b]，也没有遭遇灾祸。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “奠酒”指把酒倾倒出来，作为祭物献上。
    reason: cultural_clarification
  - marker: b
    text: 或译：“生活兴旺”。原文直译为“我们处境良好”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 不
  rationale: 结合上文，这是对耶利米劝告的断然拒绝和转折；现代汉语用“不”能自然表现其抗拒语气。
- source_word: עָשֹׂה נַעֲשֶׂה
  choice: 我们一定要……去做
  rationale: 不定式绝对形与限定动词连用以加强语气；“一定要”既传达强调，也符合现代汉语表达。
- source_word: כָּל הַדָּבָר אֲשֶׁר יָצָא מִפִּינוּ
  choice: 自己亲口说出的一切
  rationale: 保留“从我们口中出来”的口语意象，同时自然表达他们执意履行自己所宣告或许下之事。
- source_word: לְקַטֵּר
  choice: 烧香
  rationale: 该动词在祭祀语境中指焚烧香料献祭；“烧香”清楚简洁。
- source_word: לִמְלֶכֶת הַשָּׁמַיִם
  choice: 向天后
  rationale: “天后”是这一女神称号在中文中的简明直译；照实呈现崇拜对象，并不表示认可。
- source_word: וְהַסֵּיךְ לָהּ נְסָכִים
  choice: 给她浇奠祭酒
  rationale: נסך与נסכים构成祭祀用语，指倾倒酒类奠祭；“浇奠祭酒”兼顾准确性和普通读者的可理解性。
- source_word: אֲנַחְנוּ וַאֲבֹתֵינוּ מְלָכֵינוּ וְשָׂרֵינוּ
  choice: 我们和我们的祖先、君王、官长
  rationale: אבותינו在此泛指先人，译作“祖先”比“父亲”更符合现代汉语；שרים在政治语境中译作“官长”。
- source_word: בְּעָרֵי יְהוּדָה וּבְחֻצוֹת יְרוּשָׁלִָם
  choice: 在犹大的城镇和耶路撒冷的街道上
  rationale: חוצות可指街道或公共空地；正文采用较宽泛自然的“街道”。
- source_word: וַנִּשְׂבַּע לֶחֶם
  choice: 那时我们吃得饱足
  rationale: 原文直指“因饼得饱足”；译文保留吃饱的具体意象，同时不把לֶחֶם过度限定为某种饼。
- source_word: וַנִּהְיֶה טוֹבִים
  choice: 过得安好
  rationale: 原文字面为“我们处境良好”；“过得安好”保留其宽泛含义，避免直接收窄为经济上的兴旺。
- source_word: וְרָעָה לֹא רָאִינוּ
  choice: 也没有遭遇灾祸
  rationale: 此处רָעָה指灾难而非道德上的邪恶；“遭遇灾祸”自然表达希伯来语“看见灾祸”的经验性含义。
theological_decisions:
- issue: 异教神祇称号的译法
  choice: 天后
  alternative: 诸天之后
  rationale: מְלֶכֶת הַשָּׁמַיִם是被崇拜女神的称号；直译为“天后”能保留称号性质，不淡化其偶像崇拜背景，也不引入后世宗教联想。
- issue: 说话者所宣称的安稳是否明确等同于兴旺
  choice: 过得安好
  alternative: 兴旺
  rationale: וַנִּהְיֶה טוֹבִים本身较宽泛，可指处境良好；不将其限定为经济繁荣，从而保留说话者论证中的概括性。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。以“不”表现针对上文的公然拒绝；祭祀用语保持明确但不过分古雅。引号标明本节为百姓的直接言论。
