  text: לֹ֣א דֻכְּא֔וּ עַ֖ד הַ/יּ֣וֹם הַ/זֶּ֑ה וְ/לֹ֣א יָרְא֗וּ וְ/לֹֽא הָלְכ֤וּ בְ/תֽוֹרָתִ/י֙ וּ/בְ/חֻקֹּתַ֔/י אֲשֶׁר נָתַ֥תִּי לִ/פְנֵי/כֶ֖ם וְ/לִ/פְנֵ֥י אֲבוֹתֵי/כֶֽם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/044/010.yaml
  text: They have not been humbled to this day[a], and they have not feared[b], and they have not walked in my law and in my statutes that I set before you and before your fathers.
translation:
  language: zh_hans
  text: 至今他们仍未谦卑下来[a]，也没有敬畏，并且没有遵行我的律法和条例；这些是我摆在你们和你们列祖面前的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “谦卑下来”也可译作“被压碎”或“被压低”；按语境解释，也可理解为“变得痛悔”或“悔改”。
    reason: lexical_alternative
lexical_decisions:
- source_word: דֻכְּאוּ
  choice: 降卑自己
  rationale: 该被动形式可表示“被压碎、受压低、谦卑下来”。语境关乎他们在审判面前仍不回转；“降卑自己”自然表达道德与属灵层面的低伏，同时不直接释为原文没有明说的“悔改”。
- source_word: עַד הַיּוֹם הַזֶּה
  choice: 直到今天……仍
  rationale: 保留标准时间习语及持续至今的意味，现代汉语以“直到今天……仍”表达自然。
- source_word: יָרְאוּ
  choice: 敬畏
  rationale: 这里较可能指对上帝应有的敬惧，而非单纯害怕；“敬畏”保留其盟约语境中的分量。
- source_word: הָלְכוּ בְתוֹרָתִי וּבְחֻקֹּתַי
  choice: 遵行我的律法和条例
  rationale: 希伯来文直译为“行走在我的律法和条例中”。汉语“遵行”自然传达按这些规范生活的惯用含义；“律法、条例”保留法律与盟约语域。
- source_word: אֲשֶׁר נָתַתִּי לִפְנֵיכֶם
  choice: 这些是我摆在你们……面前的
  rationale: נתן 与 לפני 构成“摆在……面前”的表达，兼有颁布、陈明并要求遵守的意味；严格保留第二人称复数“你们”。
- source_word: אֲבוֹתֵיכֶם
  choice: 你们列祖
  rationale: 指听众以前的父辈和历代祖先；“列祖”符合庄重的圣经语域，也保留原文阳性复数所指的历代先辈。
theological_decisions:
- issue: דֻכְּאוּ 是否应直接译成悔改用语
  choice: 他们仍没有降卑自己
  alternative: 他们仍没有悔改／仍没有痛悔
  rationale: 经文确实暗示他们不肯因审判而回转，但该动词本身并不明确等同于“悔改”。正文保留“降卑”的词义范围，不把神学含义直接写进动词。
- issue: יָרְאוּ 所指是恐惧还是敬畏
  choice: 敬畏
  alternative: 害怕
  rationale: 在未遵行上帝律法和条例的并列语境中，这里是对上帝应有的敬惧；“敬畏”比单纯“害怕”更贴切，同时不消除“惧怕”的成分。
- issue: 人称后缀的处理
  choice: 你们和你们列祖
  alternative: 他们和他们的列祖
  rationale: לִפְנֵיכֶם 与 אֲבוֹתֵיכֶם 均为明确的第二人称阳性复数后缀。即使前半句用第三人称指称所责备的人，原文随后转为直接对听众说话，因此保留这一人称转换。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“遵行”自然呈现希伯来语“行走于……中”的生活方式隐喻；保留前半句第三人称转为后半句第二人称的原文转换。正文仅设一个脚注，所有脚注标记均已在正文出现。
