  text: הַ/דָּבָ֛ר אֲשֶׁר דִּבַּ֥רְתָּ אֵלֵ֖י/נוּ בְּ/שֵׁ֣ם יְהוָ֑ה אֵינֶ֥/נּוּ שֹׁמְעִ֖ים אֵלֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/044/016.yaml
  text: As for the word that you have spoken to us in the name of Yahweh[a], we will not listen to you.
translation:
  language: zh_hans
  text: “至于你奉雅威的名向我们所说的话，我们绝不听[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我们绝不听从你。”这里的希伯来语动词既可表示听，也可表示听从、服从。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַדָּבָר
  choice: 这话
  rationale: דָּבָר在此指耶利米刚刚宣讲的预言信息。“这话”既保留“话语”的直接含义，也符合现代汉语指称前述言论的习惯。
- source_word: אֲשֶׁר דִּבַּרְתָּ אֵלֵינוּ
  choice: 你对我们所说的
  rationale: 按希伯来语关系从句表达说话者、对象和已说出的内容；汉语用“所说的”自然地修饰“这话”。
- source_word: בְּשֵׁם יְהוָה
  choice: 奉雅威的名
  rationale: “奉……的名”是自然、庄重的汉语表达，可传达代表雅威并凭其权柄说话的含义；雅威保留四字神名作为专名。
- source_word: אֵינֶנּוּ שֹׁמְעִים
  choice: 我们绝不听
  rationale: 否定存在式加分词在这段直接回应中表示坚决拒绝。“绝不听”体现其强烈的意志性，同时保留שׁמע兼有听取与听从的语义空间。
- source_word: אֵלֶיךָ
  choice: 你的
  rationale: 希伯来语是第二人称阳性单数，直接针对耶利米。现代汉语“听你的”自然表达“听你所说的／听从你”，也保留原文的直接针对性。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。译作“雅威”将其作为以色列之神的专名保留下来，而不以称号“主”替代。
- issue: שׁמע在拒绝先知信息语境中的含义
  choice: 听
  alternative: 听从；服从
  rationale: שׁמע可兼指听见、听取和遵从。主文用“听你的”保留这种语义张力；上下文清楚表明这不只是拒绝聆听，也是拒绝服从。
translation_notes:
  register: 采用现代、庄重而直接的口吻。“至于……”对应句首被突出的话题；“绝不”传达说话者坚定而公然的拒绝。脚注标记置于“你的”之后，对应“听／服从”的词义差异。
