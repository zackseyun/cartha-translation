  text: כֹּֽה אָמַ֣ר יְהוָֽה צְבָאוֹת֩ אֱלֹהֵ֨י יִשְׂרָאֵ֜ל לֵ/אמֹ֗ר אַתֶּ֨ם וּ/נְשֵׁי/כֶ֜ם וַ/תְּדַבֵּ֣רְנָה בְּ/פִי/כֶם֮ וּ/בִ/ידֵי/כֶ֣ם מִלֵּאתֶ֣ם לֵ/אמֹר֒ עָשֹׂ֨ה נַעֲשֶׂ֜ה אֶת נְדָרֵ֗י/נוּ אֲשֶׁ֤ר נָדַ֨רְנוּ֙ לְ/קַטֵּר֙ לִ/מְלֶ֣כֶת הַ/שָּׁמַ֔יִם וּ/לְ/הַסֵּ֥ךְ לָ֖/הּ נְסָכִ֑ים הָקֵ֤ים תָּקִ֨ימְנָה֙ אֶת נִדְרֵי/כֶ֔ם וְ/עָשֹׂ֥ה תַעֲשֶׂ֖ינָה אֶת נִדְרֵי/כֶֽם־־׀־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/044/025.yaml
  text: 'Thus says the LORD of hosts, the God of Israel: You and your wives have spoken with your mouths and fulfilled it with your hands, saying, ‘We will surely carry out our vows that we have vowed, to burn incense to the Queen of Heaven and to pour out drink offerings to her.’ Go ahead, confirm your vows and carry out your vows.'
translation:
  language: zh_hans
  text: 万军之耶和华——以色列的神如此说：“你们和你们的妻子亲口说了，又亲手实行，说：‘我们一定要履行我们所许的愿：向天后焚香，并向她浇奠。’你们只管坚立所许的愿，并履行所许的愿吧！”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה צְבָאוֹת
  choice: 万军之耶和华
  rationale: 保留神的专名和复合称号；“万军之”是庄重且通行的现代中文圣经措辞。
- source_word: מִלֵּאתֶם
  choice: 实行
  rationale: 此处指用手完成口中所说的话；译作“实行”自然地表达言语付诸行动。
- source_word: עָשֹׂה נַעֲשֶׂה
  choice: 必要偿还
  rationale: 希伯来语不定式绝对形加强限定动词，表示坚决实行；结合נדרים，中文以“必要偿还”表达强烈决心。
- source_word: מְלֶכֶת הַשָּׁמַיִם
  choice: 天后
  rationale: 按马所拉文本的传统读法译作女性神祇称号“天后”，不额外指认具体神祇。
- source_word: לְהַסֵּךְ ... נְסָכִים
  choice: 向她浇奠祭
  rationale: 准确表达向该神祇倾倒酒类祭物的礼仪行为。
- source_word: הָקֵים תָּקִימְנָה
  choice: 尽管坚定
  rationale: 形式为阴性复数，主要针对妻子；上下文带讽刺或任凭意味，用“尽管”传达，而不误作真诚认可。
theological_decisions:
- issue: 末句命令语气是否表示神认可这些誓愿
  choice: 译为“尽管……吧”，保留讽刺、任凭和挑战性的命令语气
  alternative: 直译为“你们务要坚定……并实行……”
  rationale: 上下文明确定罪敬拜天后的行为，因此该命令不是神学上的认可；但正文仍保留命令形式，不改写成直接禁令。
- issue: “天后”的身份
  choice: 仅保留经文称号，不指认具体女神
  alternative: 译作某个具名的古代近东女神
  rationale: 文本本身没有提供专名，避免把有争议的历史鉴定写入正文。
- issue: 末句阴性复数的指向
  choice: 中文正文维持对全体的自然承接
  alternative: 明确译为“你们这些妇女”
  rationale: 希伯来语形式强调妇女，但前文同时提到男人及其妻子；中文不以性别标记动词，强行补出可能过度限定。
translation_notes:
  register: 采用现代、庄重而清楚的标准普通话。保留“亲口／亲手”的修辞对应和誓愿用语；末句用“尽管……吧”呈现上下文中的讽刺性许可，同时避免增添解释性脚注。
