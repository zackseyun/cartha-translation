revisions:
- from: 万军之耶和华以色列的神如此说：“你们和你们的妻子亲口说了，又亲手实行，说：‘我们所许的愿，必要偿还：向天后烧香，向她浇奠祭。’你们尽管坚定所许的愿，尽管偿还所许的愿吧！”
  to: 万军之耶和华——以色列的神如此说：“你们和你们的妻子亲口说了，又亲手实行，说：‘我们一定要履行我们所许的愿：向天后焚香，并向她浇奠。’你们只管坚立所许的愿，并履行所许的愿吧！”
  rationale: 仅作必要的词义与搭配修正：以“履行”一致翻译誓愿语境中的“做／实行”，避免“偿还”造成债务或民俗性“还愿”的误解；以“坚立”对应末句的“确立／使其站立”。“只管……吧”继续以中文自然方式保留该命令在上下文中的讽刺或任凭色彩，同时不在正文或脚注中指定“天后”的身份，也不强行把末句阴性复数限定为妇女。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T07:29:19Z'
review_pass:
  verdict: revise
  source_fidelity: 译文整体准确保留了称号、口与手的对应、向“天后”焚香和浇奠的内容，以及末句带反讽/任凭色彩的命令语气。不过，“偿还所许的愿”把“履行誓愿”的行为误导为偿债或还愿，未充分对应希伯来文中“实行／完成”誓愿的重复表达。
  naturalness: “亲口说了，又亲手实行”自然清楚；但“必要偿还”“尽管偿还所许的愿”在现代普通话中不够贴切。改为“一定要履行……所许的愿”及“只管坚立……并履行……”更自然，也更准确。
  terminology: “万军之耶和华”“以色列的神”“天后”“焚香”“浇奠”均合适。“浇奠”准确表达奠祭中的倾倒祭物，且不额外界定“天后”的历史身份。
  issues:
  - severity: medium
    issue: 将“实行／履行誓愿”译为“偿还誓愿”
    rationale: עָשָׂה与末句重复的同源动词表示做、实行、履行所许的愿；中文“偿还”通常指归还债务，或可在“还愿”语境中引入未见于原文的习语色彩。应改为“履行”。
  - severity: low
    issue: “坚定所许的愿”搭配略生硬
    rationale: הָקֵים在此是使誓愿站立、确立/坚持之意。“坚立所许的愿”较贴近原文且中文庄重自然；“只管”可保留上下文所显示的反讽或任凭意味，而不把它改成认可。
  revised_text: 万军之耶和华——以色列的神如此说：“你们和你们的妻子亲口说了，又亲手实行，说：‘我们一定要履行我们所许的愿：向天后焚香，并向她浇奠。’你们只管坚立所许的愿，并履行所许的愿吧！”
