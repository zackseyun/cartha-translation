  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: הַֽ/שְׁכַחְתֶּם֩ אֶת רָע֨וֹת אֲבוֹתֵי/כֶ֜ם וְ/אֶת רָע֣וֹת מַלְכֵ֣י יְהוּדָ֗ה וְ/אֵת֙ רָע֣וֹת נָשָׁ֔י/ו וְ/אֵת֙ רָעֹ֣תֵ/כֶ֔ם וְ/אֵ֖ת רָעֹ֣ת נְשֵׁי/כֶ֑ם אֲשֶׁ֤ר עָשׂוּ֙ בְּ/אֶ֣רֶץ יְהוּדָ֔ה וּ/בְ/חֻצ֖וֹת יְרוּשָׁלִָֽם־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/044/009.yaml
  text: Have you forgotten the evil deeds of your fathers[a], the evil deeds of the kings of Judah, the evil deeds of their wives, your own evil deeds, and the evil deeds of your wives[b], which they did in the land of Judah and in the streets of Jerusalem?
translation:
  language: zh_hans
  text: 你们岂忘了你们列祖的恶行、犹大诸王的恶行、他们妻子的恶行、你们自己的恶行，以及你们妻子的恶行，就是在犹大地和耶路撒冷的街道上所行的恶行吗？
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַשְׁכַחְתֶּם
  choice: 你们忘了……吗
  rationale: 用现代汉语反问句表达希伯来语的责问语气；上下文表明过去的忘却具有当前的道德后果。
- source_word: רָעוֹת / רָעֹת
  choice: 恶行
  rationale: 复数名词在此具体指人所做的恶事，且后文有“所行的”，译作“恶行”比抽象的“邪恶”更贴切。
- source_word: אֲבוֹתֵיכֶם
  choice: 你们列祖
  rationale: 保留男性祖辈和世代相承的意味；“列祖”在庄重而通俗的经文语体中自然。
- source_word: מַלְכֵי יְהוּדָה
  choice: 犹大诸王
  rationale: 准确表达复数属格结构，并采用简洁自然的汉语。
- source_word: נָשָׁיו
  choice: 他们妻子
  rationale: 后缀形态为单数“他的”，但紧接复数的“犹大诸王”，应按集合或分配意义自然译为“他们妻子”。
- source_word: רָעֹתֵיכֶם
  choice: 你们自己的恶行
  rationale: “自己的”凸显由列祖、君王及其妻子转向听众本人的责问层次，不增加新的命题内容。
- source_word: נְשֵׁיכֶם
  choice: 你们妻子
  rationale: 按原文直译，保留被点名群体。
- source_word: אֲשֶׁר עָשׂוּ
  choice: 这些恶行，都是他们……所行的
  rationale: 保留关系从句对前述全部恶行的概括；“行”与“恶行”搭配庄重自然。
- source_word: בְּאֶרֶץ יְהוּדָה
  choice: 在犹大地
  rationale: “地”准确保留 אֶרֶץ 的地域含义及其经文语感。
- source_word: בְּחֻצוֹת יְרוּשָׁלִָם
  choice: 在耶路撒冷街上
  rationale: חֻצוֹת 可指街道或公共场所；“街上”是现代汉语中最自然且能体现公开城市空间的表达。
theological_decisions:
- issue: רָעוֹת 的道德含义
  choice: 具体译为“恶行”
  alternative: “种种邪恶”或“恶事”
  rationale: 本节列举各群体应负责任的行为，并以“所行的”修饰，宜采用行为性的译法，同时不扩充恶行的具体性质。
- issue: אֲבוֹתֵיכֶם 的亲属与世代含义
  choice: 译为“你们列祖”
  alternative: “你们的祖先”
  rationale: “列祖”保留原文阳性祖辈称谓和世代罪责的修辞力量，又符合现代庄重经文语体。
- issue: נָשָׁיו 与复数“犹大诸王”的对应
  choice: 按集合意义译为“他们妻子”
  alternative: 按形态直译“他的妻子”
  rationale: 希伯来语后缀虽为单数，但上下文先行词为“犹大诸王”；汉语用复数代词能清楚表达各王之妻的分配或集合关系。
- issue: אֲשֶׁר עָשׂוּ 中复数主语的范围
  choice: 保留概括性的“他们”，指前述行恶者
  alternative: 改为“你们和他们”或逐一重列各群体
  rationale: 原文只用第三人称复数，可能概括前述群体；译文不替原文消除其指称上的张力。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。以“列祖、诸王、恶行、所行”保持经文语体，但避免生硬古奥。将较长的希伯来语问句在关系从句前稍作汉语化停顿，使列举清楚，并保留原文反问和责备的力度。
