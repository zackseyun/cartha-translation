  source_fidelity: 原译文准确列出了五组行为人，并将 רָעוֹת 具体译为“恶行”。但将末尾关系从句拆为“这些恶行，都是他们……所行的”，其中“他们”在现代汉语中通常排除受话人“你们”，因而会使“你们自己的恶行”和“你们妻子的恶行”仿佛并非末句所指的“所行的”行为。这不符合原文第三人称复数概括前述各组行恶者、且其具体指称保有一定张力的表达。
  naturalness: “耶路撒冷街上”可理解，但“耶路撒冷的街道上”更自然清楚。将地点关系从句直接置于“恶行”后，可避免重复“恶行”，并使汉语问句更流畅。
  terminology: “列祖”“犹大诸王”“恶行”“犹大地”均符合庄重、现代的经文语体。“妻子”应保留，不宜泛化为“妇女”。
  issues:
  - severity: medium
    issue: “都是他们……所行的”将关系从句中的复数主语限定为“他们”。
    rationale: 该代词在汉语中通常不包括前文直接称呼的“你们”，却把“你们自己的恶行”和“你们妻子的恶行”纳入“这些恶行”。改用无显性代词的定语结构，既涵盖全部所列群体，也不人为消除原文指称的概括性。
  - severity: low
    issue: “耶路撒冷街上”略显口语且结构紧缩。
    rationale: “耶路撒冷的街道上”更符合现代书面普通话，同时准确表达城市公共街道。
