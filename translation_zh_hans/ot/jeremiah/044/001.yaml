  yaml_path: translation/ot/jeremiah/044/001.yaml
  text: The word that came to Jeremiah concerning all the Judeans living in the land of Egypt[a], those living in Migdol and in Tahpanhes and in Noph and in the land of Pathros, saying,
translation:
  language: zh_hans
  text: 有话临到耶利米，论到所有住在埃及地的犹大人，就是住在密夺、答比匿、挪弗[a]和巴忒罗地的人，说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “挪弗”是这座埃及城的希伯来名称；该城更常称为“孟斐斯”。
    reason: cross_reference
lexical_decisions:
- source_word: הַדָּבָר
  choice: 话
  rationale: 先知书标题中的公式用语，指来自上帝的言语或信息；译作“话”既贴近原文，也保留庄重的先知性语体。
- source_word: אֲשֶׁר הָיָה אֶל יִרְמְיָהוּ
  choice: 临到耶利米
  rationale: “话临到某人”是希伯来先知书的固定表达；现代中文圣经语体中自然且能保留原文公式。
- source_word: אֶל כָּל הַיְּהוּדִים
  choice: 是对所有……犹大人说的
  rationale: 第二个 אֶל 在此引出话语的对象。译作“对……说的”与末尾 לֵאמֹר 相协调，也比“关于”更直接地呈现受话者。
- source_word: הַיְּהוּדִים
  choice: 犹大人
  rationale: 本段语境指来自犹大、现居埃及的人群；“犹大人”保留其地域和族群背景，避免以较后期含义较广的“犹太人”抹平语境。
- source_word: הַיֹּשְׁבִים בְּאֶרֶץ מִצְרָיִם
  choice: 住在埃及地
  rationale: 分词表达持续居住的状态；“住在”是自然、清楚的现代汉语。
- source_word: הַיֹּשְׁבִים
  choice: 就是住在
  rationale: 重复原文的居住分词，并用“就是”清楚表示后列地点是对前述埃及居民的具体说明。
- source_word: מִגְדֹּל
  choice: 密夺
  rationale: 采用现代中文圣经传统中通行的地名音译。
- source_word: תַחְפַּנְחֵס
  choice: 答比匿
  rationale: 采用现代中文圣经传统中通行的地名音译。
- source_word: נֹף
  choice: 挪弗
  rationale: 正文保留希伯来名称的音译；其通常所指的孟斐斯另以脚注说明。
- source_word: אֶרֶץ פַּתְרוֹס
  choice: 巴忒罗地
  rationale: 保留原文明确出现的“地”，并采用通行中文音译。
- source_word: לֵאמֹר
  choice: 说的……：
  rationale: 原文用该公式引出下一节的话语。中文将其融入“对……说的”并以冒号承接，比在本节末另译“说”更自然，同时保留其引语功能。
