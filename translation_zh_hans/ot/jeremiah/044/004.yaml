  text: וָ/אֶשְׁלַ֤ח אֲלֵי/כֶם֙ אֶת כָּל עֲבָדַ֣/י הַ/נְּבִיאִ֔ים הַשְׁכֵּ֥ים וְ/שָׁלֹ֖חַ לֵ/אמֹ֑ר אַל נָ֣א תַעֲשׂ֗וּ אֵ֛ת דְּבַֽר הַ/תֹּעֵבָ֥ה הַ/זֹּ֖את אֲשֶׁ֥ר שָׂנֵֽאתִי־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/044/004.yaml
  text: Yet I sent to you all my servants the prophets[a], rising early and sending them, saying[b], 'Please do not do this abominable thing that I hate.'
translation:
  language: zh_hans
  text: 然而，我一再差遣[a]我所有的仆人——众先知——到你们那里去，说：“请不要做这件我所憎恨的可憎之事。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “一再差遣”按希伯来文直译为“早起并差遣”，是表示殷勤、持续、反复行动的惯用语。
    reason: cultural_note
lexical_decisions:
- source_word: וָאֶשְׁלַח
  choice: 然而，我……差遣
  rationale: 承接上文时带有轻微转折意味：百姓虽不听从，上帝仍差遣先知警告他们。“差遣”准确表达 שלח，并符合先知受委派的语境。
- source_word: אֲלֵיכֶם
  choice: 到你们那里
  rationale: 自然表达介词 אֶל 的方向意义及第二人称复数对象。
- source_word: כָּל עֲבָדַי הַנְּבִיאִים
  choice: 我的众仆人，就是众先知
  rationale: 保留“仆人”和“先知”两个称谓，并以“就是”清楚表达同位关系，强调先知受上帝差遣和服事上帝的身份。
- source_word: הַשְׁכֵּים וְשָׁלֹחַ
  choice: 一再差遣
  rationale: 这是希伯来语惯用语，字面为“早起并差遣”，在此强调殷勤、持续、反复地差遣。正文采用自然现代汉语传达其语用意义，字面意象见脚注。
- source_word: לֵאמֹר
  choice: 对你们说
  rationale: 引出所传信息，并按汉语习惯补明说话对象。
- source_word: אַל נָא תַעֲשׂוּ
  choice: 请不要做
  rationale: “不要”表达禁令，נָא 所含的恳切、催促语气以“请”保留。
- source_word: דְּבַר הַתּוֹעֵבָה הַזֹּאת
  choice: 这件……可憎之事
  rationale: דבר 在此指事情或行为；תועבה 表示在道德和敬拜层面令人厌恶、可憎之物，语境中尤指偶像崇拜。
- source_word: אֲשֶׁר שָׂנֵאתִי
  choice: 我所憎恨的
  rationale: 希伯来语完成式在此表达上帝对该行为坚定而持续的态度；汉语用“所憎恨的”自然保留这种强烈的道德否定。
theological_decisions:
- issue: 如何表达上帝对偶像崇拜行为的厌恶，而不加以淡化或作教义性扩展
  choice: 我所憎恨的
  alternative: 我所厌恶的；我恨恶的
  rationale: 原文直接陈明上帝憎恨这项可憎行为。“憎恨”保留原文力度，所指明确是该行为，并未加入原文没有说明的后世教义范畴。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“一再差遣”避免把古代希伯来惯用语机械译成不自然的汉语，同时以脚注保留其字面意象；引语中的“请”保留上帝借先知发出恳切警告的语气。
