source:
  edition: WLC
  text: כֹּ֣ה אָמַ֣ר יְהוָ֗ה הִנְ/נִ֣י נֹ֠תֵן אֶת פַּרְעֹ֨ה חָפְרַ֤ע מֶֽלֶךְ מִצְרַ֨יִם֙ בְּ/יַ֣ד אֹֽיְבָ֔י/ו וּ/בְ/יַ֖ד מְבַקְשֵׁ֣י נַפְשׁ֑/וֹ כַּ/אֲשֶׁ֨ר נָתַ֜תִּי אֶת צִדְקִיָּ֣הוּ מֶֽלֶךְ יְהוּדָ֗ה בְּ/יַ֨ד נְבוּכַדְרֶאצַּ֧ר מֶֽלֶךְ בָּבֶ֛ל אֹיְב֖/וֹ וּ/מְבַקֵּ֥שׁ נַפְשֽׁ/וֹ׀־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/044/030.yaml
  text: 'Thus says Yahweh: Behold[a], I am giving Pharaoh Hophra king of Egypt into the hand of his enemies and into the hand of those seeking his life, just as I gave Zedekiah king of Judah into the hand of Nebuchadnezzar king of Babylon, his enemy and the one seeking his life.'
translation:
  language: zh_hans
  text: 雅威如此说：“看哪，我要把法老合弗拉，埃及王，交在他的仇敌和寻索他性命的人手中，正如我曾把犹大王西底家交在巴比伦王尼布甲尼撒[a]手中一样；尼布甲尼撒是他的仇敌，也是寻索他性命的人。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文的名字形式较接近 Nebuchadrezzar；“尼布甲尼撒”是通行的中文译名。
    reason: 说明原文名字形式与通行中文译名之间的差异。
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  choice: 雅威如此说
  rationale: 保留先知宣告中庄严的使者公式；按项目惯例将神名 יְהוָה 译为“雅威”。
- source_word: הִנְנִי
  choice: 看哪
  rationale: 保留希伯来文提示听者注意并加强宣告语气的功能。
- source_word: נֹתֵן
  choice: 我要把……交在
  rationale: הִנְנִי 加分词在此表达即将发生而又确定的行动；“我要”在现代汉语中自然地传达这种临近的将来意味。
- source_word: פַּרְעֹה חָפְרַע
  choice: 埃及王法老合弗拉
  rationale: 采用希伯来名字形式的常用中文音译“合弗拉”，不改用源自希腊文的历史名称“阿普里斯”。
- source_word: בְּיַד
  choice: 交在……手中
  rationale: 保留“在某人手中”这一表示落入其权势或控制之下的希伯来意象，在中文里也清楚自然。
- source_word: מְבַקְשֵׁי נַפְשׁוֹ
  choice: 寻索他性命的人
  rationale: 既传达企图杀害他的含义，也保留“寻索性命”的原文意象。
- source_word: כַּאֲשֶׁר
  choice: 正如……一样
  rationale: 明确合弗拉的命运与西底家先前遭遇之间的对应关系。
- source_word: צִדְקִיָּהוּ
  choice: 西底家
  rationale: 采用该犹大王名字通行的中文圣经译名。
- source_word: נְבוּכַדְרֶאצַּר
  choice: 尼布甲尼撒
  rationale: 采用现代中文读者最熟悉的通行译名，同时以脚注说明此处希伯来文的名字形式。
- source_word: אֹיְבוֹ וּמְבַקֵּשׁ נַפְשׁוֹ
  choice: 尼布甲尼撒是他的仇敌，也是寻索他性命的人
  rationale: 两个单数称谓都修饰尼布甲尼撒；拆成独立分句可避免中文误读为两个不同的人，同时保留两项并列描述。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 依项目对四字神名的默认处理，采用较直接反映该名读音的“雅威”，而不以称号代替专名。
- issue: נֹתֵן 的时间与确定性
  choice: 我要把……交在
  alternative: 我正在把……交在
  rationale: 该分词与 הִנְנִי 连用，既有生动、确定的意味，也指向即将发生的行动；中文用“我要”较自然，且不把它误解为交付过程已在进行。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。保留“看哪”“交在……手中”“寻索他性命”等原文意象；后半句略作句法重组，以清楚表明“仇敌”和“寻索他性命的人”都指尼布甲尼撒。
