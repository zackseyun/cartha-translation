  text: וּ/מִן אָ֡ז חָדַ֜לְנוּ לְ/קַטֵּ֨ר לִ/מְלֶ֧כֶת הַ/שָּׁמַ֛יִם וְ/הַסֵּֽךְ לָ֥/הּ נְסָכִ֖ים חָסַ֣רְנוּ כֹ֑ל וּ/בַ/חֶ֥רֶב וּ/בָ/רָעָ֖ב תָּֽמְנוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/044/018.yaml
  text: But from the time we stopped burning incense to the Queen of Heaven and pouring out drink offerings to her[a], we have lacked everything[c][b], and we have been consumed by the sword and by famine.
translation:
  language: zh_hans
  text: 可是，自从我们停止向“天后”[a]烧香、向她浇奠祭[b]以来，我们就什么都缺少，并因刀剑和饥荒而灭尽了[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “天后”是这里受百姓敬拜的一位女神的称号；本节没有说明她具体对应哪一位古代女神。
    reason: cultural_note
  - marker: b
    text: “浇奠祭”指把酒倾倒出来作为祭物。
    reason: cultural_note
  - marker: c
    text: “灭尽了”也可译为“灭亡了”或“走到尽头了”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִן אָז חָדַלְנוּ
  choice: 可是，自从我们不再……以后
  rationale: וּ承接上下文并带有反驳语气，译为“可是”；מִן אָז与חָדַלְנוּ共同表达从停止某事起算的时间关系。中文用“自从……不再……以后”自然地传达这一结构。
- source_word: לְקַטֵּר
  choice: 烧香
  rationale: קטר在祭祀语境中指焚烧香料或使祭物冒烟；本节与偶像崇拜相关，“烧香”简明、自然。
- source_word: לִמְלֶכֶת הַשָּׁמַיִם
  choice: 向“天后”
  rationale: 该短语是受崇拜女神的称号。译作“天后”保留称号本身，并加引号提示这是专称，不引入后来的宗教含义。
- source_word: וְהַסֵּךְ לָהּ נְסָכִים
  choice: 不再向她浇奠酒
  rationale: 原文指把酒等液体倾倒为祭。“浇奠酒”保留具体祭祀动作，也与现代中文圣经语体相协调；第二个“不再”是为使并列结构清楚而补出。
- source_word: חָסַרְנוּ כֹל
  choice: 我们就什么都缺少
  rationale: חסר表示缺乏，כֹל表示范围完全；“什么都缺少”准确而自然。
- source_word: וּבַחֶרֶב וּבָרָעָב
  choice: 并因刀剑和饥荒
  rationale: 介词ב在此表示导致毁灭的手段或处境。“因刀剑和饥荒”清楚表达战争杀戮与饥荒造成的灾难。
- source_word: תָּמְנוּ
  choice: 被灭尽了
  rationale: תמם在此表达耗尽、终结或灭亡。“被灭尽了”保留其达到尽头的强烈语义，同时脚注列出可行的较宽泛译法。
theological_decisions:
- issue: 如何处理מְלֶכֶת הַשָּׁמַיִם这一偶像称号
  choice: “天后”
  alternative: “诸天之后”或“天上的女王”
  rationale: 原文在此称呼百姓所敬拜的女神，并非表达基督教或其他后世神学称号。正文直接保留该称号，脚注说明其语境身份，不进一步判定具体对应哪一位古代女神。
- issue: 是否认可说话者关于停止献祭导致灾祸的因果判断
  choice: 按说话者的陈述直接翻译，不加认可性措辞
  alternative: 在正文中加入“他们以为”等解释
  rationale: 本节记录百姓的辩解。译文应忠实呈现其因果主张，但不应通过增词把该主张说成叙述者或译者认可的事实。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“烧香”“什么都缺少”贴近日常表达；“浇奠酒”“刀剑和饥荒”保留经文的祭祀与先知性语域。引号只用于标明“天后”为称号。
