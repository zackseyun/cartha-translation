id: JER.44.26
reference: Jeremiah 44:26
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: לָ/כֵן֙ שִׁמְע֣וּ דְבַר יְהוָ֔ה כָּל יְהוּדָ֕ה הַ/יֹּשְׁבִ֖ים בְּ/אֶ֣רֶץ מִצְרָ֑יִם הִנְ/נִ֨י נִשְׁבַּ֜עְתִּי בִּ/שְׁמִ֤/י הַ/גָּדוֹל֙ אָמַ֣ר יְהוָ֔ה אִם יִהְיֶה֩ ע֨וֹד שְׁמִ֜/י נִקְרָ֣א בְּ/פִ֣י כָּל אִ֣ישׁ יְהוּדָ֗ה אֹמֵ֛ר חַי אֲדֹנָ֥/י יְהוִ֖ה בְּ/כָל אֶ֥רֶץ מִצְרָֽיִם־־־׀׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/044/026.yaml
  text: 'Therefore hear the word of Yahweh[a], all Judah who dwell in the land of Egypt: Behold, I have sworn by my great name, says Yahweh, that my name shall no longer be called upon by the mouth of any man of Judah in all the land of Egypt, saying, ‘As the Lord GOD lives.’'
translation:
  language: zh_hans
  text: 所以，所有住在埃及地的犹大人哪，你们要听耶和华的话。耶和华说：“看哪，我已指着我的大名起誓：在埃及全地，任何犹大人的口中都必不再提起我的名[a]，说：‘我指着永活的主耶和华起誓。’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“任何犹大人的嘴唇都必不再提我的名”。希伯来语直译是神的名“在某人口中被称说”，这里指人在誓言中援引神的名。
    reason: 说明希伯来语习语及其在本节誓言语境中的含义，同时保留较直译的另一种表达。
lexical_decisions:
- source_word: לָכֵן
  choice: 所以
  rationale: 承接上文的审判宣告，清楚表达推论关系，也符合现代汉语先知话语的语气。
- source_word: שִׁמְעוּ דְבַר יְהוָה
  choice: 你们要听耶和华的话
  rationale: 保留复数命令式和先知书惯用的“耶和华的话”表达。
- source_word: כָּל יְהוּדָה הַיֹּשְׁבִים בְּאֶרֶץ מִצְרָיִם
  choice: 所有住在埃及地的犹大人哪
  rationale: 将集体称呼“全犹大”按此处直接呼告当地犹大群体的语境自然表达，并保留“埃及地”。
- source_word: הִנְנִי
  choice: 看哪
  rationale: 引出庄严的神圣宣告，保留原文的强调和先知性语体。
- source_word: נִשְׁבַּעְתִּי בִּשְׁמִי הַגָּדוֹל
  choice: 我已指着我的大名起誓
  rationale: 准确表达完成式誓言及以自己名起誓的含义；“大名”保留原文的尊荣意味。
- source_word: אִם יִהְיֶה עוֹד
  choice: 都必不再
  rationale: אִם用于誓言公式时在语境中具有强烈否定作用，汉语需明示为“不再”。
- source_word: שְׁמִי נִקְרָא בְּפִי
  choice: 口中都必不再提起我的名
  rationale: 保留“口中”这一身体意象；“提起”在汉语中可涵盖说出或援引神名，脚注说明这里特指誓言中的调用。
- source_word: כָּל אִישׁ יְהוּדָה
  choice: 任何犹大人
  rationale: 表达单数分配性的全称否定；汉语“人”自然涵盖群体成员，不必额外加入原文没有强调的性别信息。
- source_word: חַי אֲדֹנָי יְהוִה
  choice: 我指着永活的主耶和华起誓
  rationale: 将希伯来语固定誓言公式转成自然且庄重的现代汉语，同时保留“主”与神名的组合。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 采用现代简体中文圣经读者最熟悉、可直接辨认为以色列之神专名的“耶和华”；不以“主”取代神名。
- issue: אֲדֹנָי יְהוִה的译法
  choice: 主耶和华
  alternative: 主雅威
  rationale: 同时保留אֲדֹנָי的称号“主”和יהוה的专名，避免将两者合并或遗漏。
- issue: 誓言公式中神名将不再出现在犹大人口中
  choice: 口中都必不再提起我的名
  alternative: 都必不再用我的名起誓
  rationale: 正文保留原文“名在口中被称说”的形象和一定的语义张力，再由上下文及脚注指出此处是以神名起誓，避免在正文中完全释义化。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语，保留先知宣告中的呼告、命令和“看哪”等修辞标志；标点与语序按现代中文调整，使长句易于朗读。
