  language: en
  yaml_path: translation/ot/jeremiah/044/020.yaml
  text: Then Jeremiah said to all the people—to the men[a], to the women, and to all the people who were answering him, saying,
translation:
  language: zh_hans
  text: 于是，耶利米对众民、对男人、对女人，以及对所有回答他的人[a]说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文在“回答他”后还有“话”一词；此处是希伯来语惯用表达，意思是“回应他”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 于是……说
  rationale: 连续式叙事形式推进情节；“于是”自然表达前后次序，“说”保留基本语义。
- source_word: יִרְמְיָהוּ
  choice: 耶利米
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: אֶל כָּל הָעָם
  choice: 对全体百姓
  rationale: אֶל 表示说话的对象；עָם 是集合意义的“百姓、民众”，“全体百姓”既准确又自然。
- source_word: עַל הַגְּבָרִים וְעַל הַנָּשִׁים
  choice: 就是对男人、女人
  rationale: 此处两个 עַל 短语是在具体说明“全体百姓”的构成，而非表示“攻击”或“论到”；用“就是对”显明同位关系，并保留男女两类。
- source_word: וְעַל כָּל הָעָם
  choice: 以及所有……的人
  rationale: 保留原文再次使用“所有/全体”的强调，同时按现代汉语句法将其与后面的分词短语结合。
- source_word: הָעֹנִים אֹתוֹ דָּבָר
  choice: 回答他的人
  rationale: ענה 与 דָּבָר 构成紧凑的希伯来语表达，语境义为以言语回应。正文采用自然汉语，不生硬直译“回答他一句话”；脚注保存原文形式及可译选择。
- source_word: לֵאמֹר
  choice: 说：
  rationale: 该不定式引出下一节的直接引语；中文用“说：”自然承接后文。
