  text: וַ/יַּעֲנ֣וּ אֶֽת יִרְמְיָ֗הוּ כָּל הָ/אֲנָשִׁ֤ים הַ/יֹּֽדְעִים֙ כִּֽי מְקַטְּר֤וֹת נְשֵׁי/הֶם֙ לֵ/אלֹהִ֣ים אֲחֵרִ֔ים וְ/כָל הַ/נָּשִׁ֥ים הָ/עֹמְד֖וֹת קָהָ֣ל גָּד֑וֹל וְ/כָל הָ/עָ֛ם הַ/יֹּשְׁבִ֥ים בְּ/אֶֽרֶץ מִצְרַ֖יִם בְּ/פַתְר֥וֹס לֵ/אמֹֽר־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/044/015.yaml
  text: Then all the men who knew that their wives were burning incense to other gods[a], and all the women who were standing by—a great assembly—and all the people who were living in the land of Egypt, in Pathros, answered Jeremiah, saying,
translation:
  language: zh_hans
  text: 于是，所有知道自己妻子向别神烧香的男人，以及在场的所有妇女——一大群人——还有所有住在埃及地巴忒罗的百姓，都回答耶利米说：
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲנוּ
  choice: 回答
  rationale: ענה在此叙事语境中引出对耶利米的回应；“回答”自然准确。
- source_word: כָּל הָאֲנָשִׁים
  choice: 所有……男人
  rationale: 此处特指男性，因为下文提到“他们的妻子”，并另列妇女；译作“男人”保留性别区分。
- source_word: הַיֹּדְעִים
  choice: 知道
  rationale: 分词作定语，指这些男人知晓妻子的行为。
- source_word: מְקַטְּרוֹת
  choice: 烧香
  rationale: קטר的Piel形式在敬拜语境中通常指焚烧香料献祭；“烧香”简洁保留祭祀含义。
- source_word: לֵאלֹהִים אֲחֵרִים
  choice: 向别神
  rationale: 表示敬拜行为所指向的是以色列上帝以外的神明；“向别神”符合现代汉语圣经语体。
- source_word: וְכָל הַנָּשִׁים הָעֹמְדוֹת
  choice: 以及在场的所有妇女
  rationale: עמד字面为“站立”，此处分词主要说明妇女当时在现场；“在场”比“站着”更自然，也不额外推断其立场。
- source_word: קָהָל גָּדוֹל
  choice: 一大群会众
  rationale: קהל指聚集起来的群体；“会众”保留集会性质，“一大群”表达规模之大。
- source_word: וְכָל הָעָם
  choice: 还有……所有百姓
  rationale: עם泛指群众；“百姓”符合庄重叙事语体，并与前述男人、妇女相衔接。
- source_word: הַיֹּשְׁבִים
  choice: 住在
  rationale: ישב用于地理描述时表示居住；“住在”是自然的现代汉语。
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: 在埃及地
  rationale: 保留原文“埃及之地”的正式地理表达，同时符合汉语传统地名表达。
- source_word: בְּפַתְרוֹס
  choice: 巴忒罗
  rationale: 地名按常见中文圣经形式音译。句法上与“埃及地”相连，表明这些百姓住在埃及地的巴忒罗地区。
- source_word: לֵאמֹר
  choice: 说：
  rationale: 标准引语公式；汉语以“说：”自然引出下一节的直接引语。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。原文“站立的妇女”在语境中主要表示现场参与，因此译作“在场的所有妇女”，避免将“站立”误读为立场支持。以破折号保留“一大群会众”对聚集规模的插入说明。
