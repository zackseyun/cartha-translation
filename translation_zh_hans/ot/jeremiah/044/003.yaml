base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/044/003.yaml
  text: because of their evil that they did to provoke me to anger[a], by going to burn incense and to serve other gods[b], whom they had not known—they, you, and your fathers.
translation:
  language: zh_hans
  text: 这是因为他们所行的恶：他们去向别神烧香，事奉别神[b]，借此惹我发怒[a]；这些神是他们、你们和你们的列祖所不认识的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “惹我发怒”也可译作“使我恼怒”；原文强调他们的行为招致上帝发怒。
    reason: lexical_alternative
  - marker: b
    text: “事奉”在这里包括对别神的敬拜和效忠，也可译作“敬拜”。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִפְּנֵי רָעָתָם אֲשֶׁר עָשׂוּ
  choice: 这是因为他们所行的恶
  rationale: מִפְּנֵי在上下文中表示原因；רָעָה由“所行的”及后续偶像崇拜行为限定，指道德上的恶。
- source_word: לְהַכְעִסֵנִי
  choice: 以此惹我发怒
  rationale: 保留כעס使役式“使……发怒”的含义，并以自然汉语说明后列行为的结果和目的色彩。
- source_word: לָלֶכֶת לְקַטֵּר
  choice: 他们去……烧香
  rationale: לָלֶכֶת引出他们惹怒上帝的具体行为；קטר的Piel式在偶像崇拜语境中通常指焚香。
- source_word: לַעֲבֹד לֵאלֹהִים אֲחֵרִים
  choice: 事奉那些……别神
  rationale: עבד的基本义是服事，在神祇语境中包含敬拜和效忠；“事奉”保留其较广的宗教服役含义。
- source_word: אֲשֶׁר לֹא יְדָעוּם
  choice: 他们素不认识的神
  rationale: “认识”保留ידע的基本意义及可能的关系性内涵；“素不”表达此前从未认识。
- source_word: הֵמָּה אַתֶּם וַאֲבֹתֵיכֶם
  choice: 他们、你们和你们的列祖都不认识
  rationale: 保留希伯来文强调性的并列名单；“列祖”准确传达阳性复数אָבוֹת，并符合庄重的现代汉语圣经语体。
theological_decisions:
- issue: 偶像崇拜语境中עבד的译法
  choice: 事奉
  alternative: 敬拜
  rationale: “事奉”更直接对应עבד，并保留服役、效忠和宗教崇拜的较广语义，不把词义限缩为礼仪性敬拜。
- issue: 否定关系与强调性主语名单
  choice: 那些他们素不认识的神——他们、你们和你们的列祖都不认识
  alternative: 他们、你们和你们的列祖都不认识的神
  rationale: 正文尽量保留先出现“他们”，随后由“他们、你们和你们的列祖”加以强调说明的希伯来语结构，同时通过破折号使现代读者易于理解。
- issue: לְהַכְעִיס的语义关系
  choice: 以此惹我发怒
  alternative: 故意惹我发怒
  rationale: 希伯来语可表达导致或招致上帝发怒；不加入“故意”，以免过度断定其主观动机。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“列祖”略带经文语体，但准确保留原文阳性亲属称谓。破折号用于呈现原文末尾强调性的同位并列。所有脚注标记均置于正文句末，因为脚注分别说明“惹我发怒”和“事奉”的译法。
