  text: וְ/לֹ֤א שָֽׁמְעוּ֙ וְ/לֹא הִטּ֣וּ אֶת אָזְנָ֔/ם לָ/שׁ֖וּב מֵ/רָֽעָתָ֑/ם לְ/בִלְתִּ֥י קַטֵּ֖ר לֵ/אלֹהִ֥ים אֲחֵרִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/044/005.yaml
  text: But they did not listen or incline their ear to turn from their evil[a], so as not to make offerings to other gods.
translation:
  language: zh_hans
  text: 可是，他们不听，也不侧耳聆听；他们不肯离开自己的恶行，也不肯停止向别神烧香。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׁמְעוּ
  choice: 听
  rationale: 这里不是指没有听见声音，而是没有接受、听从先知的信息；“不听”在现代汉语中可自然表达这种拒绝听从的含义。
- source_word: הִטּוּ אֶת אָזְנָם
  choice: 侧耳倾听
  rationale: 保留希伯来语“使耳朵倾斜”的身体隐喻，同时使用现代读者容易理解、且符合庄重语体的表达。
- source_word: לָשׁוּב
  choice: 回头离开
  rationale: שׁוב表示转回、转离；“回头离开”既保留回转意象，也借后接的“恶行”明确其方向，而不直接采用神学含义更强的“悔改”。
- source_word: מֵרָעָתָם
  choice: 离开自己的恶行
  rationale: רָעָה可指邪恶、恶事或恶劣行为；本节语境紧接具体的偶像崇拜行为，“恶行”自然且不把范围限于内在品性。
- source_word: לְבִלְתִּי קַטֵּר
  choice: 好不再……烧香
  rationale: לבלתי表达目的或预期结果；“好不再”在汉语中保留这一关系。קטר在本书的祭祀语境中通常指烧香或焚烧香料献祭，因此采用较具体的“烧香”，避免泛化为所有献祭。
- source_word: לֵאלֹהִים אֲחֵרִים
  choice: 向别神
  rationale: 介词ל在此表示敬拜行为的对象或归向；“向别神烧香”是自然、准确的汉语表达。
theological_decisions:
- issue: 偶像崇拜语境中 קטר 的范围
  choice: 向别神烧香
  alternative: 向别神献祭
  rationale: 该动词虽可在祭祀语境中具有焚烧祭物、使之冒烟的关联，但在耶利米书反复出现的固定语境中通常具体指烧香。直译能够清楚呈现所谴责的敬拜行为，也不需要用较宽泛的“献祭”替代。
- issue: שׁוב 是否译为“悔改”
  choice: 回头离开自己的恶行
  alternative: 悔改
  rationale: 原文描写从恶中转离；采用动作性表达，保留回转意象，并避免把该词在正文中直接收窄为一个系统神学术语。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“侧耳倾听”保留原文修辞；“好不再”呈现末句与“回头离开”之间的目的关系。未设脚注，因为正文已直接呈现 קטר 在本节中最有根据的具体含义。
