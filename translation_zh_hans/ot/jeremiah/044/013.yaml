  text: וּ/פָקַדְתִּ֗י עַ֤ל הַ/יּֽוֹשְׁבִים֙ בְּ/אֶ֣רֶץ מִצְרַ֔יִם כַּ/אֲשֶׁ֥ר פָּקַ֖דְתִּי עַל יְרֽוּשָׁלִָ֑ם בַּ/חֶ֥רֶב בָּ/רָעָ֖ב וּ/בַ/דָּֽבֶר־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/044/013.yaml
  text: And I will punish those who dwell in the land of Egypt[a], just as I punished Jerusalem, with the sword, with famine[b], and with pestilence.
translation:
  language: zh_hans
  text: 我必惩罚住在埃及地的人[a]，正如我惩罚耶路撒冷一样，用刀剑、饥荒和瘟疫[b]惩罚他们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我必向住在埃及地的人追讨……正如我向耶路撒冷追讨一样。”希伯来语动词 פקד 可表示“察看”“眷顾”或“追讨”；在本节的审判语境中，含有惩罚之意。
    reason: lexical_alternative
  - marker: b
    text: “瘟疫”也可译为“疫病”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפָקַדְתִּי
  choice: 我必惩罚
  rationale: פקד语义范围较广，可指眷顾、察看或追讨；本节以刀剑、饥荒和瘟疫说明审判，因此译为“惩罚”最清楚自然。
- source_word: הַיֹּשְׁבִים
  choice: 住……的人
  rationale: 该分词指居住、定居者；“住在埃及地的人”既保留分词含义，也符合现代汉语表达。
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: 在埃及地
  rationale: 保留原文“埃及之地”的表达，同时在汉语中自然通顺。
- source_word: כַּאֲשֶׁר
  choice: 正如……一样
  rationale: 明确表达埃及居民所受惩罚与耶路撒冷所受惩罚之间的对应关系。
- source_word: פָּקַדְתִּי עַל יְרוּשָׁלִָם
  choice: 我惩罚耶路撒冷
  rationale: 与本节首次出现的פקד保持一致；介词עַל按自然汉语融入动宾结构。
- source_word: בַּחֶרֶב
  choice: 用刀剑
  rationale: 介词ב在此表示施行审判的方式或手段；“刀剑”保留先知书常见的审判用语。
- source_word: בָּרָעָב
  choice: 饥荒
  rationale: 与“刀剑、瘟疫”并列，构成原文三项审判灾祸。
- source_word: וּבַדָּבֶר
  choice: 和瘟疫
  rationale: דבר在先知书审判语境中通常指流行性灾病；“瘟疫”准确且庄重，“疫病”亦可。
theological_decisions:
- issue: פקד所表达的神圣审判
  choice: 明确译为“惩罚”
  alternative: 译为“追讨”或较字面的“临到……施行审判”
  rationale: 刀剑、饥荒和瘟疫使该动词的惩罚性语义十分明确；“惩罚”没有加入原文之外的教义判断，同时比含混的直译更便于现代读者理解。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。主句末尾补出“惩罚他们”，使“用刀剑、饥荒和瘟疫”在汉语中明确修饰惩罚的方式，同时不增添新的语义内容。
