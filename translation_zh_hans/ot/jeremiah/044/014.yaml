id: JER.44.14
reference: Jeremiah 44:14
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/לֹ֨א יִהְיֶ֜ה פָּלִ֤יט וְ/שָׂרִיד֙ לִ/שְׁאֵרִ֣ית יְהוּדָ֔ה הַ/בָּאִ֥ים לָ/גֽוּר שָׁ֖ם בְּ/אֶ֣רֶץ מִצְרָ֑יִם וְ/לָ/שׁ֣וּב אֶ֣רֶץ יְהוּדָ֗ה אֲשֶׁר הֵ֜מָּה מְנַשְּׂאִ֤ים אֶת נַפְשָׁ/ם֙ לָ/שׁוּב֙ לָ/שֶׁ֣בֶת שָׁ֔ם כִּ֥י לֹֽא יָשׁ֖וּבוּ כִּ֥י אִם פְּלֵטִֽים־׀־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/044/014.yaml
  text: So there will be no fugitive or survivor for the remnant of Judah who are coming to sojourn there in the land of Egypt and then to return to the land of Judah[a], to which they are lifting up their soul to return and dwell there; for they will not return, except for fugitives.
translation:
  language: zh_hans
  text: 那些来到埃及地寄居、盼望返回犹大地居住的犹大余民，必没有逃脱的，也没有存留的；他们一心向往[a]回去住在那里，却必不回去，除非是逃脱的人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“他们举起自己的心魂”，意思是热切向往或一心想要。
    reason: 保留希伯来习语的字面意象，并说明正文意译“一心向往”的依据。
lexical_decisions:
- source_word: פָּלִיט / פְּלֵטִים
  choice: 逃脱的人
  rationale: 该词指从灾祸中逃出的人。前后采用相同译法，保留本节先说无人逃脱、末尾又作例外说明的张力。
- source_word: שָׂרִיד
  choice: 存留
  rationale: 指灾难或审判之后仍留下、仍存活；与“逃脱”区分，同时符合先知宣告的庄重语体。
- source_word: שְׁאֵרִית יְהוּדָה
  choice: 犹大余民
  rationale: 准确表达犹大剩余下来的人群；这里是历史性的描述，并不额外赋予“忠信余民”的正面含义。
- source_word: הַבָּאִים לָגוּר שָׁם
  choice: 那些来到……寄居的人
  rationale: גור含暂居、寄居之意；“寄居”比单纯的“居住”更能保留原词色彩。分词按这群人来到埃及这一现实处境译出。
- source_word: בְּאֶרֶץ מִצְרָיִם
  choice: 在埃及地
  rationale: 保留原文明确出现的“地”，也维持审判宣告的庄重感。
- source_word: וְלָשׁוּב אֶרֶץ יְהוּדָה
  choice: 以后再返回犹大地
  rationale: 将返回犹大理解为这些寄居者所期望的后续行动；“以后再”自然表达寄居与返回的先后关系。
- source_word: אֲשֶׁר הֵמָּה מְנַשְּׂאִים אֶת נַפְשָׁם
  choice: 他们一心向往
  rationale: 这是“举起自己的性命/心魂”的希伯来习语，语义为热切向往或定意。正文采用现代汉语自然表达，脚注保留其字面意象。
- source_word: לָשׁוּב לָשֶׁבֶת שָׁם
  choice: 回去住在那里
  rationale: 两个不定式分别表达返回和居住，译文保留二者，不合并为单纯的“定居”。
- source_word: כִּי לֹא יָשׁוּבוּ
  choice: 但他们必不能回去
  rationale: 此处在中文中用“但”承接他们的热切愿望，并突出愿望与审判结果之间的转折；“必不能”表达预告的确定性。
- source_word: כִּי אִם פְּלֵטִים
  choice: 只有逃脱的人能回去
  rationale: 保留原文明确的例外，不擅自加入“少数”等原文未明说的数量限定；补出“能回去”使汉语句意完整。
theological_decisions:
- issue: “犹大余民”是否含有正面的神学评价
  choice: 按历史描述译为“犹大余民”
  alternative: 译为带有褒义的“忠信的犹大余民”
  rationale: 上下文中的对象是身在埃及并面临审判的犹大幸存群体，原文没有称他们忠信，不应加入正面神学评价。
- issue: “无人逃脱”与“只有逃脱的人”之间的表面张力
  choice: 保留前面的全面否定和末尾的例外
  alternative: 把末句解释性改写为“只有极少数人侥幸逃脱”
  rationale: 原文确实以פְּלֵטִים提出例外，却没有明说人数；译文不消解这种修辞和语义张力，也不加入“极少数”。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“寄居”“余民”保留先知文学和历史语境的色彩；其余句法适度汉语化，避免照搬希伯来语造成歧义。脚注标记[a]已置于正文所解释的习语之后。
