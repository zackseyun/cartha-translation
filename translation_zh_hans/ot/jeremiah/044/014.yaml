revisions:
- from: 犹大余民中，那些来到埃及地寄居、以后再返回犹大地的人，必没有一人逃脱或存留。他们一心向往[a]回去住在那里；但他们必不能回去，只有逃脱的人能回去。
  to: 那些来到埃及地寄居、盼望返回犹大地居住的犹大余民，必没有逃脱的，也没有存留的；他们一心向往[a]回去住在那里，却必不回去，除非是逃脱的人。
  rationale: 修订将首次“返回犹大地”明示为余民的盼望，避免与后文“必不回去”形成非原文所致的汉语逻辑冲突；保留原文重复表达返回愿望的修辞。末句以“除非是逃脱的人”对应原文的例外结构，不额外引入能力含义。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T07:29:37Z'
review_pass:
  verdict: revise
  source_fidelity: 草稿总体准确保留了“犹大余民”“寄居埃及”“返回犹大”“举起心魂”这一习语所表达的渴望，以及末尾的例外。但首句“那些来到埃及地寄居、以后再返回犹大地的人”容易在汉语中表述为已经/将实际返回的人；原文在后文恰恰否定其返回，只表达他们怀着返回的意愿。末句宜避免加入原文未明说的“能”。
  naturalness: 原稿庄重、易懂，脚注位置正确。“必没有一人逃脱或存留”略不如“必没有逃脱的，也没有存留的”贴合原文两个名词并列。以“盼望”明确首处不定式所含的意向，能消除汉语的时序歧义，同时保留后文对其强烈愿望的重复强调。
  terminology: “犹大余民”“埃及地”“寄居”均合适。“一心向往”是对习语自然且不过度神学化的现代汉语表达；脚注保留字面意象即可。
  issues:
  - severity: medium
    issue: 首句的“以后再返回犹大地的人”可能被读为返回已成事实或确定将发生。
    rationale: 希伯来文在此描述赴埃及寄居者所盼望/意图的返回，随后明确说“他们必不返回”。中文应把该返回表为愿望或意向。
  - severity: low
    issue: 末句“只有逃脱的人能回去”补入“能”。
    rationale: 原文的“除非逃脱的人”省略重复的“返回”；补出“能”虽可通顺，但把预告结果轻微改为能力表述。
  revised_text: 那些来到埃及地寄居、盼望返回犹大地居住的犹大余民，必没有逃脱的，也没有存留的；他们一心向往[a]回去住在那里，却必不回去，除非是逃脱的人。
  revised_footnotes:
  - marker: a
    text: 原文直译为“他们举起自己的心魂”，意思是热切向往或一心想要。
    reason: 保留希伯来习语的字面意象，并说明正文意译“一心向往”的依据。
  revision_rationale: 修订将首次“返回犹大地”明示为余民的盼望，避免与后文“必不回去”形成非原文所致的汉语逻辑冲突；保留原文重复表达返回愿望的修辞。末句以“除非是逃脱的人”对应原文的例外结构，不额外引入能力含义。
