source:
  edition: WLC
  text: וְ/לָקַחְתִּ֞י אֶת שְׁאֵרִ֣ית יְהוּדָ֗ה אֲשֶׁר שָׂ֨מוּ פְנֵי/הֶ֜ם לָ/ב֣וֹא אֶֽרֶץ מִצְרַיִם֮ לָ/ג֣וּר שָׁם֒ וְ/תַ֨מּוּ כֹ֜ל בְּ/אֶ֧רֶץ מִצְרַ֣יִם יִפֹּ֗לוּ בַּ/חֶ֤רֶב בָּֽ/רָעָב֙ יִתַּ֔מּוּ מִ/קָּטֹן֙ וְ/עַד גָּד֔וֹל בַּ/חֶ֥רֶב וּ/בָ/רָעָ֖ב יָמֻ֑תוּ וְ/הָיוּ֙ לְ/אָלָ֣ה לְ/שַׁמָּ֔ה וְ/לִ/קְלָלָ֖ה וּ/לְ/חֶרְפָּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/044/012.yaml
  text: And I will take the remnant of Judah who have set their faces to enter the land of Egypt to sojourn there[a], and they will all come to an end in the land of Egypt. They will fall by the sword and by famine; from the least even to the greatest, they will come to an end. By the sword and by famine they will die, and they will become an oath, a horror, a curse, and a reproach.
translation:
  language: zh_hans
  text: 我必取那些定意进入埃及地寄居的犹大余民；他们都必在埃及地灭尽。他们必因刀剑和饥荒仆倒；从最小的到最大的，都必灭尽。他们必死于刀剑和饥荒，成为咒诅誓言中的例证[a]，令人惊骇，受人咒诅，遭人羞辱。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文词可指“誓言”，尤其指带有咒诅的誓言；这里指他们的遭遇将成为人起咒诅誓言时所引用的例证。
    reason: 说明אָלָה兼有“誓言”和“咒诅誓言”的含义，并保留其与后文“咒诅”（קְלָלָה）的区别。
lexical_decisions:
- source_word: וְלָקַחְתִּי
  choice: 我必处置
  rationale: לקח本义为“取、拿”，但在此审判语境中，直译“取犹大余民”在现代汉语中意义不明；“处置”表达上帝将他们置于审判之下，同时不额外指定审判方式。
- source_word: שְׁאֵרִית יְהוּדָה
  choice: 犹大余民
  rationale: “余民”准确表达灾难之后剩余的人，也保留先知书中的常用概念。
- source_word: אֲשֶׁר שָׂמוּ פְנֵיהֶם
  choice: 那些定意……的
  rationale: 希伯来习语直译为“把脸朝向”，表示坚定决意；现代汉语用“定意”自然地传达其意志与决心。
- source_word: לָבוֹא אֶרֶץ מִצְרַיִם לָגוּר שָׁם
  choice: 进入埃及地寄居
  rationale: בוא译作“进入”；גור含以外来者身份暂住的意味，“寄居”比单纯的“居住”更准确。
- source_word: וְתַמּוּ כֹל / יִתַּמּוּ
  choice: 他们都必灭尽／都必灭尽
  rationale: תם在本语境指走到尽头、全部消亡。“灭尽”符合严厉的审判语境，并在两处重复，以保留原文同一词根的修辞强调。
- source_word: יִפֹּלוּ בַּחֶרֶב בָּרָעָב
  choice: 倒在刀剑和饥荒之下
  rationale: 保留נפל“倒下”的具体意象；介词表示造成死亡的手段或原因。
- source_word: מִקָּטֹן וְעַד גָּדוֹל
  choice: 从最小的到最大的
  rationale: 保留原文涵盖全体的两极表达，不限定其具体指年龄、地位或权势。
- source_word: בַּחֶרֶב וּבָרָעָב יָמֻתוּ
  choice: 死于刀剑和饥荒
  rationale: מות是普通的“死”；“死于”在汉语中自然表达工具或死因。
- source_word: לְאָלָה
  choice: 成为人起誓咒诅时所引用的对象
  rationale: אָלָה可指带有咒诅内容的誓言。此处用解释性表达，与后面的קְלָלָה“咒诅”保持区别。
- source_word: לְשַׁמָּה וְלִקְלָלָה וּלְחֶרְפָּה
  choice: 令人惊骇，受人咒诅，遭人羞辱
  rationale: 分别表达荒凉或惊骇、咒诅和羞辱的结果；依各名词在此结果性结构中的自然汉语搭配处理。
theological_decisions:
- issue: 是否弱化反复出现的审判措辞
  choice: 保留“灭尽、倒下、死”等直接措辞，并重复“灭尽”
  alternative: 合并或改写为一次概括性的“彻底毁灭”
  rationale: 原文以תם、נפל、מות反复强化审判的全面性；保留不同动词及同词根重复，既不缓和，也不添加超出经文的神学解释。
- issue: אָלָה与קְלָלָה的区别
  choice: 将אָלָה表达为起誓咒诅时引用的对象，将קְלָלָה译为“受人咒诅”
  alternative: 两者都译作“咒诅”
  rationale: 两个词语义相关但并非完全相同；分别翻译可保存原文张力，脚注说明אָלָה所含的咒诅誓言色彩。
- issue: וְלָקַחְתִּי的审判含义
  choice: 译为“我必处置”
  alternative: 直译为“我必取来”或加强为“我必捉拿”
  rationale: “处置”使现代读者明白这是上帝施行审判，却不把动词过度具体化为逮捕或掳走。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“定意”“寄居”“余民”保留先知文学色彩，但仍为普通读者可理解；避免生硬直译“把脸朝向”和难以理解的“成为誓言”。经文中的[a]与脚注严格对应。
