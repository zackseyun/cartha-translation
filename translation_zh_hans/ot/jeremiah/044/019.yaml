  to: “我们向天后烧香、向她浇奠酒的时候，做饼，把它们做成她的样式[a]，又向她浇奠酒，难道不是在我们丈夫的参与下吗？”
  rationale: 修订“浇奠祭”为“浇奠酒”，使祭祀动作和祭物名称准确、自然；将“背着自己的丈夫”改为“在我们丈夫的参与下”，更贴合原文“没有撇开我们的丈夫”的反问，而不将其限定为隐瞒或同意。调整制饼短语及脚注，使其更符合汉语表达，并保留原文关于饼与女神形象关系的争议和不确定性。
