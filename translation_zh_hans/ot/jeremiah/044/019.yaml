id: JER.44.19
reference: Jeremiah 44:19
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/כִֽי אֲנַ֤חְנוּ מְקַטְּרִים֙ לִ/מְלֶ֣כֶת הַ/שָּׁמַ֔יִם וּ/לְ/הַסֵּ֥ךְ לָ֖/הּ נְסָכִ֑ים הֲ/מִֽ/בַּלְעֲדֵ֣י אֲנָשֵׁ֗י/נוּ עָשִׂ֨ינוּ לָ֤/הּ כַּוָּנִים֙ לְ/הַ֣עֲצִבָ֔/ה וְ/הַסֵּ֥ךְ לָ֖/הּ נְסָכִֽים־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/044/019.yaml
  text: And when we burned incense to the Queen of Heaven and poured out drink offerings to her[a], was it apart from our husbands that we made cakes for her, to depict her, and poured out drink offerings to her?
translation:
  language: zh_hans
  text: “我们向天后烧香、向她浇奠酒的时候，做饼，把它们做成她的样式[a]，又向她浇奠酒，难道不是在我们丈夫的参与下吗？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“做成她的像”或“用以表现她”。希伯来语很可能指把饼做成这位女神的样式，但其确切形式并不明确。
    reason: 保留 לְהַעֲצִבָהּ 可指塑成女神样式、制作其像或较宽泛地表征她的词义空间。
lexical_decisions:
- source_word: וְכִי
  choice: 我们……的时候
  rationale: 结合上文，这是妇女继续为自己的行为辩解，说明当时的情形，而不是提出真实的条件；这样的译法自然地带出后面的反问。
- source_word: מְקַטְּרִים
  choice: 烧香
  rationale: קטר 的 Piel 形式在祭祀语境中通常指焚香或献烟祭；本节又与奠祭并列，因此“烧香”准确而简明。
- source_word: לִמְלֶכֶת הַשָּׁמַיִם
  choice: 向天后
  rationale: 这是耶利米书7章和44章中异教女神的称号。“天后”是现代汉语中简洁自然的称谓，不额外判定该神祇的具体身份。
- source_word: וּלְהַסֵּךְ לָהּ נְסָכִים
  choice: 向她浇奠祭
  rationale: נסכים 指奠酒一类的液体祭物，נסך 表示倾倒；“浇奠祭”既保留动作，也表达其祭祀性质。
- source_word: הֲמִבַּלְעֲדֵי אֲנָשֵׁינוּ
  choice: 难道……是背着自己的丈夫吗
  rationale: 该短语构成反问，意思是并非没有她们男人的同意或参与。按女性说话者的家庭语境，אֲנָשֵׁינוּ 译作“自己的丈夫”比泛称“我们的男人”更清楚；“背着”自然表达“在……不知情或不参与的情况下”。
- source_word: עָשִׂינוּ לָהּ כַּוָּנִים
  choice: 我们做饼
  rationale: כַּוָּנִים 指用于这种祭祀的特制饼；上下文已明确祭祀用途，因此正文采用通俗的“做饼”，避免加入原文没有明说的材料或形式。
- source_word: לְהַעֲצִבָהּ
  choice: 来表现她的形象
  rationale: 此词很可能说明制饼的目的，即以饼表现该女神，但究竟是塑成女神样式还是作象征性呈现并不完全确定；正文采用较宽泛的表达，并以脚注保留其他可能。
- source_word: וְהַסֵּךְ לָהּ נְסָכִים
  choice: 又向她浇奠祭
  rationale: 与本节前半句的相同祭祀用语保持一致；“又”使反问中并列的两项行为在汉语里更清晰。
theological_decisions:
- issue: 异教称号 מְלֶכֶת הַשָּׁמַיִם 的处理
  choice: 天后
  alternative: 诸天之后；天空女王
  rationale: 把它作为说话者所用的异教神祇称号保留下来，不赋予正面神学含义，也不擅自认定其对应某一位古代女神。
- issue: 丈夫是否参与这些祭祀行为
  choice: 以反问保留妇女所声称的丈夫知情或参与
  alternative: 明确译成“我们的丈夫也参与了”
  rationale: 原文用“不是撇开我们的男人吧？”这样的反问辩护，没有具体界定丈夫是亲自参与、许可还是仅仅知情，因此不把其中含义说死。
translation_notes:
  register: 采用现代、庄重而口语可懂的叙事语言。“天后”“烧香”“奠祭”保留祭祀语域；反问句式体现妇女的辩解口吻。脚注标记[a]已在正文对应位置出现。
