- from: 看哪[a]，我要把他们从我在怒气、烈怒和大愤慨中赶逐他们所到的各地聚集起来；我要把他们带回这地方，使他们安然居住。
  to: 看哪[a]，我要把他们从我在怒气、烈怒和极大的愤怒中赶逐到的所有地方聚集起来；我要把他们带回这地方，使他们安然居住。
  rationale: 修订仅消除“赶逐……所到的各地”的句法含混，并使第三项怒气用语更符合现代普通话。开头采用“我要”并保留脚注，继续反映 הִנְנִי 加分词可表达临近或确定未来、亦可作进行性理解的开放性。
