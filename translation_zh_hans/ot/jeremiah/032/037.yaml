  text: הִנְ/נִ֤י מְקַבְּצָ/ם֙ מִ/כָּל הָ֣/אֲרָצ֔וֹת אֲשֶׁ֨ר הִדַּחְתִּ֥י/ם שָׁ֛ם בְּ/אַפִּ֥/י וּ/בַ/חֲמָתִ֖/י וּ/בְ/קֶ֣צֶף גָּד֑וֹל וַ/הֲשִֽׁבֹתִי/ם֙ אֶל הַ/מָּק֣וֹם הַ/זֶּ֔ה וְ/הֹשַׁבְתִּ֖י/ם לָ/בֶֽטַח־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/037.yaml
  text: Behold[a], I am gathering them from all the lands where I drove them in my anger and in my wrath and in great indignation[b], and I will bring them back to this place and make them dwell in safety.
translation:
  language: zh_hans
  text: 看哪[a]，我要把他们从我在怒气、烈怒和极大的愤怒中赶逐到的所有地方聚集起来；我要把他们带回这地方，使他们安然居住。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“看哪，我正在把他们聚集起来。”这个希伯来语结构可以表达即将发生或确定无疑的未来行动。
    reason: 保留 הִנְנִי 加分词在体貌和时间指向上的真实含混。
lexical_decisions:
- source_word: הִנְנִי
  choice: 看哪
  rationale: 保留先知宣告中强调、唤起注意的语气，同时符合现代中文圣经文体。
- source_word: מְקַבְּצָם
  choice: 我要把他们……聚集起来
  rationale: הִנְנִי 加分词可表示即将发生或确定无疑的行动；中文用“我要”自然表达这一确定的将来意义，同时以脚注保留体貌上的可能理解。
- source_word: מִכָּל הָאֲרָצוֹת
  choice: 从……各地
  rationale: 这里指被掳者流散所到的多个地域；“各地”比“各国”更少加入政治实体的含义，也比直译“各土地”自然。
- source_word: הִדַּחְתִּים
  choice: 赶逐他们
  rationale: 表达使其被迫离开的强制性及上帝作为施事者的明确性，不弱化为一般性的“分散”。
- source_word: בְּאַפִּי וּבַחֲמָתִי וּבְקֶצֶף גָּדוֹל
  choice: 在怒气、烈怒和大愤慨中
  rationale: 用三个彼此有别的中文表达保留希伯来文连续堆叠审判用语的修辞力度，而不主张三者存在严格的神学术语差异。
- source_word: וַהֲשִׁבֹתִים
  choice: 我要把他们带回
  rationale: 准确体现 שוב 的使役意义和返回此地的空间方向。
- source_word: וְהֹשַׁבְתִּים לָבֶטַח
  choice: 使他们安然居住
  rationale: “使……居住”保留 ישׁב 使役式的力量，“安然”自然表达安全、无惧的生活状态。
theological_decisions:
- issue: 开头 הִנְנִי 加分词的体貌
  choice: 看哪，我要……聚集起来
  alternative: 看哪，我正在……聚集起来
  rationale: 此结构可指正在展开、即将发生或确定的未来行动。正文采用更符合本段应许语境的“我要”，但以脚注明确保留“正在”的可能性，避免把希伯来文体貌解释得过窄。
- issue: 上帝愤怒用语的三重累积
  choice: 怒气、烈怒和大愤慨
  alternative: 怒气、忿怒和极大的恼怒
  rationale: 保留三个近义词的累积强度，以呈现审判的严重性以及随后复归应许的张力；同时不人为赋予每个词固定、独立的教义含义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“看哪”保留先知宣告的郑重语气；句中三个愤怒词语刻意不合并，以重现原文的层层加强。正文仅设一处脚注，标记[a]已在主文中出现。
