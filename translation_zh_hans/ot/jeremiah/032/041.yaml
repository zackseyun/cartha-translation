base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/041.yaml
  text: I will rejoice over them to do them good[a], and I will plant them in this land in faithfulness, with all my heart and with all my soul.
translation:
  language: zh_hans
  text: 我必因他们欢喜，施恩给他们；我必凭着信实[a]，以全心全意，把他们栽种在这地。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“真实地”或“确实地”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׂשְׂתִּי עֲלֵיהֶם
  choice: 我必因他们欢喜
  rationale: שׂושׂ表示强烈的喜悦，עַל标明所喜悦的对象。“因他们欢喜”既符合现代汉语，也保留上帝以他们为喜乐对象的情感色彩。
- source_word: לְהֵיטִיב אוֹתָם
  choice: 善待他们
  rationale: יטב的使役式在此表示使人得好处、向人施善。“善待他们”自然简洁，并保留目的意味。
- source_word: וּנְטַעְתִּים
  choice: 我必……把他们栽种
  rationale: 保留נטע“栽种”的农业比喻，而不改写为“安置”或“建立”；这一比喻在耶利米书的复兴应许中具有连贯性。
- source_word: בָּאָרֶץ הַזֹּאת
  choice: 在这地
  rationale: אֶרֶץ在本段指应许归回并定居之地；“这地”准确、庄重，也避免现代政治意义较强的“国家”。
- source_word: בֶּאֱמֶת
  choice: 凭信实
  rationale: אֱמֶת可指真实、确实或可靠忠信。此处描述上帝栽种百姓的坚定作为，“凭信实”凸显其可靠不变的委身，同时以脚注保留其他可行理解。
- source_word: בְּכָל לִבִּי וּבְכָל נַפְשִׁי
  choice: 尽心尽性地这样做
  rationale: 直译意为“用我的全心和我的全性命”。“尽心尽性”保留两个身体—人格意象及全然投入的力度；补出“这样做”使其在现代汉语中自然地修饰前述栽种行动。
theological_decisions:
- issue: 上帝的“心”和“性命”这一拟人化表达
  choice: 保留为“尽心尽性”
  alternative: 译作“全然投入”或“以我的全部心意”
  rationale: 原文明确将通常描述人全然委身的用语用于上帝。保留这一表达，可呈现上帝亲自且完全投入应许之事的力度，不把具体而富感情的语言抽象化。
- issue: בֶּאֱמֶת在复兴应许中的含义
  choice: 主文译为“凭信实”
  alternative: “真实地”或“确实地”
  rationale: 上下文着重上帝可靠地施恩并使百姓安居，因此“信实”最能表达其坚定可靠；但原词也可强调行动真实或确定，故在脚注中保留歧义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“必”体现先知性应许的确定语气；分号呈现两个平行的第一人称行动。“栽种”保留耶利米书中的核心复兴意象，“尽心尽性”则保留原文应用于上帝的强烈拟人化措辞。
