  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: גְּדֹל֙ הָֽ/עֵצָ֔ה וְ/רַ֖ב הָ/עֲלִֽילִיָּ֑ה אֲשֶׁר עֵינֶ֣י/ךָ פְקֻח֗וֹת עַל כָּל דַּרְכֵי֙ בְּנֵ֣י אָדָ֔ם לָ/תֵ֤ת לְ/אִישׁ֙ כִּ/דְרָכָ֔י/ו וְ/כִ/פְרִ֖י מַעֲלָלָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/019.yaml
  text: great in counsel and mighty in deed[a], whose eyes are open upon all the ways of the sons of man, to give to each man according to his ways and according to the fruit of his deeds.
translation:
  language: zh_hans
  text: 你的谋略宏大，行事大有能力；你的眼目睁开，注视世人的一切道路[a]，要照各人的道路和各人所作所为的果子施予各人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “世人”所对应的希伯来文表达可直译为“人的众子”，是泛指全人类的集合说法，并非只指男性。
    reason: 说明原文的字面表达及其集合含义，避免误解为仅指男性。
lexical_decisions:
- source_word: גְּדֹל הָעֵצָה
  choice: 谋略宏大
  rationale: עֵצָה可指谋略、筹划或旨意；“谋略”保留智慧筹划的含义，“宏大”对应גְּדֹל，同时与下句形成庄重的平行结构。
- source_word: רַב הָעֲלִילִיָּה
  choice: 行事大有能力
  rationale: עֲלִילִיָּה指行动、作为或成就；结合רַב，此处强调上帝施行其谋略的强大能力。“行事大有能力”在现代汉语中自然，也保留“谋略—行动”的对称。
- source_word: עֵינֶיךָ פְקֻחוֹת עַל
  choice: 你的眼目睁开，注视
  rationale: 保留希伯来文以“眼目睁开”表达上帝洞察一切的具体拟人意象；“注视”使介词עַל所表达的朝向在汉语中完整自然。
- source_word: כָּל דַּרְכֵי בְּנֵי אָדָם
  choice: 世人的一切道路
  rationale: דְּרָכִים在此比喻人的生活道路和行为方式；בְּנֵי אָדָם是泛指全人类的集合表达。“世人”准确传达范围，并以脚注说明原文形式。
- source_word: לָתֵת לְאִישׁ
  choice: 给各人
  rationale: אִישׁ在此为逐一分配的单数用法，译作“各人”自然准确；保留לָתֵת的基本义“给”，不直接加入“报应”这一较强的解释性词语。
- source_word: כִּדְרָכָיו
  choice: 照各人的道路
  rationale: 保留“道路”这一比喻及希伯来文复数的总体含义，并与前面的“一切道路”形成词语呼应。
- source_word: וְכִפְרִי מַעֲלָלָיו
  choice: 照他行为的果子
  rationale: 保留פְרִי“果子”的结果性比喻；מַעֲלָלִים译作“行为”，表达带有道德分量的所作所为。
theological_decisions:
- issue: 以上帝睁开的眼目表达其洞察
  choice: 保留“你的眼目睁开”的具体意象
  alternative: 译为“你洞察一切”或“你察看”
  rationale: 原文使用身体意象，并未改写为抽象的全知陈述；保留意象可维持经文的文学力度，又不额外系统化其神学含义。
- issue: 按人的道路和行为结果施予
  choice: 译作“要照各人的道路，照他行为的果子给他”
  alternative: 译作“按各人的行为报应各人”
  rationale: “报应”能说明上下文的赏罚含义，却比原文לָתֵת“给”更明确。正文保留较宽的“给”，使其可涵盖按行为施行的回报或惩处，而不提前缩窄语义。
- issue: 阳性集合用语的表达
  choice: 将בְּנֵי אָדָם译为“世人”，将分配性的אִישׁ译为“各人”
  alternative: 直译为“人的众子”和“各个男人”
  rationale: 两处在语境中泛指所有人，并非限定男性；现代汉语的“世人”“各人”准确表达其指称范围，脚注同时保留原文集合说法的信息。
translation_notes:
  register: 采用庄重而清晰的现代标准汉语。“谋略宏大，行事大有能力”保留原文平行结构；“眼目睁开”和“行为的果子”保留具体意象。句法略具经文节奏，但避免生硬直译。
