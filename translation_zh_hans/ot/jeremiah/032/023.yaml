  text: וַ/יָּבֹ֜אוּ וַ/יִּֽרְשׁ֣וּ אֹתָ֗/הּ וְ/לֹֽא שָׁמְע֤וּ בְ/קוֹלֶ֨/ךָ֙ ו/ב/תרות/ך לֹא הָלָ֔כוּ אֵת֩ כָּל אֲשֶׁ֨ר צִוִּ֧יתָה לָ/הֶ֛ם לַ/עֲשׂ֖וֹת לֹ֣א עָשׂ֑וּ וַ/תַּקְרֵ֣א אֹתָ֔/ם אֵ֥ת כָּל הָ/רָעָ֖ה הַ/זֹּֽאת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/023.yaml
  text: They came in and took possession of it[a], but they did not listen to your voice, and they did not walk in your law. They did not do all that you commanded them to do[b], and you brought upon them all this disaster.
translation:
  language: zh_hans
  text: 他们进来，取得了这地，却不听从你的话，也不遵行你的律法[a]。凡你吩咐他们做的，他们都没有做；因此，你使这一切灾祸临到他们[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “律法”也可译作“教导”。希伯来语词“תּוֹרָה”可指律法或教导；本节用的是带后缀的复数形式，这里指上帝在盟约中赐下的教导和规范。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译近于“你向他们召来这一切灾祸”，这是表示使灾祸临到他们的说法。
    reason: idiom
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: 他们进来
  rationale: בוא在此叙述以色列人进入上文所说之地；“进来”自然保留进入的方向感。
- source_word: וַיִּרְשׁוּ אֹתָהּ
  choice: 占领了这地
  rationale: ירשׁ在土地语境中表示取得并据有；“占领”清楚表达实际取得土地，宾语按上下文明确为“这地”。
- source_word: בְקוֹלֶךָ
  choice: 听从你的话
  rationale: 希伯来文直译为“听你的声音”，但该表达在此指听从上帝；现代汉语用“听从你的话”既自然，也保留关系性的言语意象。
- source_word: וּבְתוֹרֹתֶךָ לֹא הָלָכוּ
  choice: 也不遵行你的律法
  rationale: הלך与介词ב及תורה连用，表示按上帝的教导行事。“遵行”自然传达行为层面的隐喻；“律法”在此作为集合称谓表达盟约性的教导。
- source_word: אֵת כָּל אֲשֶׁר צִוִּיתָה לָהֶם לַעֲשׂוֹת לֹא עָשׂוּ
  choice: 凡你吩咐他们做的，他们都没有做
  rationale: 保留כָּל的全面语气和原文前置宾语的强调，同时符合现代汉语表达。
- source_word: וַתַּקְרֵא אֹתָם אֵת כָּל הָרָעָה הַזֹּאת
  choice: 因此，你使这一切灾祸临到他们
  rationale: קרא在此结构中表达使灾祸临到人的意思；“使……临到”传达审判的因果关系，又避免把希伯来习语生硬直译为“召来”。
- source_word: הָרָעָה
  choice: 灾祸
  rationale: רָעָה在本节的审判语境中指有害的灾难，而非道德上的邪恶；“灾祸”准确且庄重。
theological_decisions:
- issue: 盟约语境中תורה的译法
  choice: 你的律法
  alternative: 你的教导
  rationale: 这里回顾百姓进入土地后未履行盟约责任；“律法”较明确地表达既定的盟约规范，同时脚注保留“教导”这一真实语义。
- issue: 上帝与רָעָה之间的关系
  choice: 你使这一切灾祸临到他们
  alternative: 你向他们召来这一切灾祸
  rationale: 上下文所指是因悖逆而临到的盟约审判。“灾祸”不把רָעָה误解为道德邪恶；“使……临到”则忠实表达上帝施行审判，而不采用不自然的逐字译法。
- issue: 连接词ו所表达的逻辑关系
  choice: 因此
  alternative: 于是／并且
  rationale: 前文陈述百姓不听从、不遵行，后文陈述灾祸临到；语境显示结果关系。“因此”将隐含逻辑明示，但不进一步说明灾祸的具体性质。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“听从你的话”和“遵行你的律法”保留盟约语境，又避免生硬仿照希伯来语。“这地”明确代词所指；分号突出百姓悖逆与灾祸临到之间的结果关系。
