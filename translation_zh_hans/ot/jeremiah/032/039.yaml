base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/039.yaml
  text: And I will give them one heart and one way[a], so that they may fear me all their days[b], for their good and for the good of their children after them.
translation:
  language: zh_hans
  text: 我必赐给他们一颗心[a]、一条道路[b]，使他们终生敬畏我，为使他们和他们的子孙得益处。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “一颗心”也可译为“专一的心”。希伯来文直译为“一颗心”，其具体含义仍可兼指内在专一或群体同心。
    reason: lexical_alternative
  - marker: b
    text: “一条道路”也可译为“一条路”。希伯来文的“道路”可比喻一种生活方式。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי
  choice: 我必赐给
  rationale: 该形式在先知应许语境中表达将来的行动；“赐给”自然体现上帝主动施予的意味。
- source_word: לֵב אֶחָד
  choice: 一颗心
  rationale: 保留希伯来文的直译性比喻，不限定为群体同心或个人专一，保存原文的语义广度。
- source_word: וְדֶרֶךְ אֶחָד
  choice: 一条道路
  rationale: דֶּרֶךְ既可指道路，也可比喻生活方式；“道路”在现代中文中能保留这一双重含义。
- source_word: לְיִרְאָה אוֹתִי
  choice: 使他们……敬畏我
  rationale: לְ加不定式在此表示目的；“敬畏”准确表达盟约语境中对上帝的敬重、畏惧与顺服，而非单纯恐惧。
- source_word: כָּל הַיָּמִים
  choice: 一生都
  rationale: 原文字面为“所有的日子”；“一生都”是自然的现代汉语，表达持续终身的时间范围。
- source_word: לְטוֹב לָהֶם
  choice: 好使他们……得福
  rationale: לְטוֹב表达对其有益、为其好；“得福”在此自然简洁，并与后代共享的益处相连。
- source_word: וְלִבְנֵיהֶם אַחֲרֵיהֶם
  choice: 和他们后世的儿女
  rationale: בנים直指儿女，אַחֲרֵיהֶם表示在他们之后；“后世的儿女”既保留亲子措辞，也清楚表达后续世代。
theological_decisions:
- issue: “一颗心、一条道路”的含义
  choice: 保留原文比喻，可同时涵盖群体同心、内在专一和共同生活方向。
  alternative: 明确译为“专一的心和共同的生活方式”。
  rationale: 明确释义会缩窄原文有意保留的群体与个人、内在与外在之间的张力。
- issue: “敬畏我”的含义
  choice: 采用“敬畏我”，表达盟约关系中对上帝的敬重、畏惧和顺服。
  alternative: 译为“尊崇我”或“惧怕我”。
  rationale: “尊崇”可能淡化畏惧成分，“惧怕”又可能被理解为单纯恐怖；“敬畏”最能保存原词的神学范围。
- issue: 末句益处的范围
  choice: 将“为他们的好”自然表达为他们和后世儿女都得福。
  alternative: 严格照字面译为“为他们的好，也为他们身后的儿女”。
  rationale: 希伯来句法将益处延及儿女；中文补明“都得福”可避免末句悬空，却不改变受益范围。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“一颗心、一条道路”保留先知性比喻及其开放性；“得福”简洁表达“为他们的好”，并明确该益处延及后世儿女。
