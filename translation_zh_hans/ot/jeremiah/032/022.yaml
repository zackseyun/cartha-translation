base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/022.yaml
  text: And you gave them this land[a], which you swore to their fathers to give them, a land flowing with milk and honey.
translation:
  language: zh_hans
  text: 你把这地赐给了他们；这地是你曾向他们的祖先[a]起誓要赐给他们的，是流奶与蜜之地。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“列祖”；希伯来文直译为“他们的父辈”，这里指以色列的先祖。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּתֵּן
  choice: 你把……赐给了
  rationale: נתן的基本义是“给”；在向上帝祷告的语境中，“赐给”自然、庄重，并保留第二人称叙述。句首וַ在上下文中承接前文，中文无需机械译出“并且”。
- source_word: הָאָרֶץ הַזֹּאת
  choice: 这地
  rationale: אֶרֶץ在应许和疆土语境中指“地、土地”；“这地”简洁地保留指示意味和盟约背景。
- source_word: אֲשֶׁר נִשְׁבַּעְתָּ
  choice: 你起誓
  rationale: נשבע明确表示起誓，而不只是一般性的应许；“起誓”保留誓约的力度。
- source_word: לַאֲבוֹתָם
  choice: 他们祖先[a]
  rationale: אָבוֹת字面为“父辈/列祖”，此处指以色列的先祖；现代普通话以“祖先”表达所指最自然，并用脚注注明字面形式。
- source_word: לָתֵת לָהֶם
  choice: 要赐给他们
  rationale: 该不定式结构说明誓言的内容；重复“赐给”保留原文两次使用נתן的呼应。
- source_word: אֶרֶץ זָבַת חָלָב וּדְבָשׁ
  choice: 流奶与蜜之地
  rationale: 这是形容土地丰饶和盟约福分的固定希伯来表达；“流奶与蜜之地”在中文圣经语体中清楚、凝练且庄重。
theological_decisions:
- issue: 盟约公式中אָבוֹת的称谓
  choice: 祖先
  alternative: 列祖／父辈
  rationale: 原词为阳性复数，字面可译“父辈”或传统译作“列祖”，所指是以色列的先祖。正文采用现代读者更易懂的“祖先”，不改变历史所指；脚注保留其字面和传统表达。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“就是……的那地”使关系从句在中文中清晰自然；保留“赐给”的重复以及“流奶与蜜”这一源语言意象。
