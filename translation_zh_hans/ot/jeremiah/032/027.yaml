  text: הִנֵּה֙ אֲנִ֣י יְהוָ֔ה אֱלֹהֵ֖י כָּל בָּשָׂ֑ר הֲֽ/מִמֶּ֔/נִּי יִפָּלֵ֖א כָּל דָּבָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/027.yaml
  text: Behold[a], I am Yahweh, the God of all flesh. Is anything too difficult for me?
translation:
  language: zh_hans
  text: 看哪，我是耶和华，是一切有血肉之躯者的上帝。难道有任何事是我做不到的吗？[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“难道有什么事对我来说太奇妙、超乎我的能力吗？”希伯来语动词既可指“奇妙、非凡”，也可指某事超出能力范围。
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: 看哪
  rationale: 保留引人注意并带有庄重语气的话语标记，适合上帝的自我宣告。
- source_word: אֲנִי יְהוָה
  choice: 我是耶和华
  rationale: 希伯来语无系词句在现代汉语中自然补出“是”；以“耶和华”呈现神名 יהוה。
- source_word: אֱלֹהֵי כָּל בָּשָׂר
  choice: 所有血肉之躯的上帝
  rationale: 尽量保留“凡有血肉者”的希伯来意象及其广度，而不直接限缩为“全人类”；“血肉之躯”在现代汉语中比“所有肉体”自然。
- source_word: הֲמִמֶּנִּי יִפָּלֵא כָּל דָּבָר
  choice: 难道有任何事是我做不到的吗？
  rationale: 以自然的汉语反问表达该习语在语境中的能力含义；פלא 的“奇妙、非凡”词义张力在脚注中保留。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名；采用现代简体中文圣经读者最熟悉且庄重的专名“耶和华”，不以“主”替代，从而保留专名性质。
- issue: “所有血肉”所指范围
  choice: 所有血肉之躯
  alternative: 全人类
  rationale: 原文 כָּל בָּשָׂר 的范围具有一定广度，可指一切有血肉、必朽的受造者，语境尤其关涉人类；不在正文中将其静默限缩为“全人类”。
- issue: פלא 的能力与奇妙双重语义
  choice: 正文译作“做不到”
  alternative: “对我来说太奇妙”或“超乎我的能力”
  rationale: 本节的反问强调耶和华无所不能，但该动词也可表示奇妙、非凡；正文采用自然明确的语境义，同时用脚注保存词汇张力，避免译成绝对抽象的“没有什么不可能”而丢失原句结构。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“看哪”保留先知文体的郑重感；“血肉之躯”保留原文意象；反问句以“做不到”自然传达能力含义。脚注标记置于对应问句之后。
