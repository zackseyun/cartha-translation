source:
  edition: WLC
  text: כִּ֧י עַל אַפִּ֣/י וְ/עַל חֲמָתִ֗/י הָ֤יְתָה לִּ/י֙ הָ/עִ֣יר הַ/זֹּ֔את לְ/מִן הַ/יּוֹם֙ אֲשֶׁ֣ר בָּנ֣וּ אוֹתָ֔/הּ וְ/עַ֖ד הַ/יּ֣וֹם הַ/זֶּ֑ה לַ/הֲסִירָ֖/הּ מֵ/עַ֥ל פָּנָֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/031.yaml
  text: For this city has been to me a cause of my anger and my wrath from the day they built it even to this day[b][a], so that I should remove it from before my face.
translation:
  language: zh_hans
  text: 因为这城从他们建造的那一天起，直到今日，一直惹动我的怒气和烈怒[a]，以致我把它从我面前除去[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语字面作“在我的怒气之上，也在我的烈怒之上”，是说这城不断招致或激起上帝的愤怒。
    reason: lexical_alternative
  - marker: b
    text: “从我面前”也可译作“从我的同在中”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 本词在上下文中引出前述审判宣告的理由；“因为”自然表达其解释、因果作用。
- source_word: עַל אַפִּי וְעַל חֲמָתִי
  choice: 惹动我的怒气和烈怒
  rationale: 希伯来语字面为“在我的怒气和烈怒之上”，属于惯用表达，意指这城招致、激起上帝的愤怒。“惹动”在现代汉语中自然，又保留主动冒犯所造成的后果。
- source_word: אַפִּי
  choice: 我的怒气
  rationale: אַף 字面可指鼻或鼻孔，但常以转喻表达愤怒；此处显然采用这一惯用义。
- source_word: חֲמָתִי
  choice: 我的烈怒
  rationale: חֵמָה 含炽烈、燃烧般愤怒的意味；“烈怒”既与“怒气”相配，也保留强烈而庄严的审判语气。
- source_word: הָיְתָה לִּי
  choice: 一直惹动我的
  rationale: 完成式结合从建城之日至今日的时间范围，表示持续至今的状态；“一直”清楚体现这种延续性。
- source_word: הָעִיר הַזֹּאת
  choice: 这城
  rationale: 自然、简洁地对应希伯来语指示结构，并符合先知书庄重的汉语表达。
- source_word: לְמִן הַיּוֹם אֲשֶׁר בָּנוּ אוֹתָהּ
  choice: 从他们建造的那一天起
  rationale: לְמִן 标明起点；保留第三人称复数“他们”，不擅自明确建造者。
- source_word: וְעַד הַיּוֹם הַזֶּה
  choice: 直到今日
  rationale: 准确表达行为或状态延续至说话当下。
- source_word: לַהֲסִירָהּ
  choice: 以致我要把它……除去
  rationale: ל 加不定式在此可表示结果或目的；“以致”保留后果意味，同时不把目的性说得过强。
- source_word: מֵעַל פָּנַי
  choice: 从我面前
  rationale: 贴近字面的身体意象，同时是自然可懂的现代汉语，也传达被逐离上帝临在的含义。
theological_decisions:
- issue: 上帝的愤怒与临在所采用的拟人化表达
  choice: 保留“我的怒气和烈怒”及“从我面前”等具体表达
  alternative: 译为较抽象的“冒犯了我”及“从我的同在中”
  rationale: 原文以身体和情感意象描写上帝的愤怒与临在。保留这些意象，既不将其粗陋地按字面解释，也不把经文的神学张力消解为抽象概念。
- issue: לַהֲסִירָהּ 的目的或结果关系
  choice: 译作“以致我要……除去”
  alternative: 译作“为要……除去”
  rationale: 介词 ל 与不定式可表达目的或结果；上下文容许两者相连。“以致”较好地呈现长期惹怒所导致的审判结果，而不排除其中的意向性。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“这城”“烈怒”“除去”保持先知审判宣告的凝重语体；句序略作汉语化调整，将时间范围提前，使持续性及因果关系更清晰。
