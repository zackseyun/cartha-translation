base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/001.yaml
  text: The word that came to Jeremiah from Yahweh in the tenth year of Zedekiah king of Judah[a], which was the eighteenth year of Nebuchadnezzar.
translation:
  language: zh_hans
  text: 犹大王西底家在位第十年，就是尼布甲尼撒在位第十八年，雅威的话临到耶利米。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַדָּבָר
  choice: 话
  rationale: 在先知书的启示公式中，דָּבָר 指来自上帝的言语或信息；译作“话”既保留传统表达，也不作过度解释。
- source_word: אֲשֶׁר הָיָה אֶל
  choice: 临到
  rationale: 这是希伯来先知文献中常见的固定表达；现代中文圣经语体中的“临到”简洁、自然，并保留启示主动来到先知的意味。
- source_word: מֵאֵת יְהוָה
  choice: 雅威的
  rationale: 该介词结构表明信息的来源。中文以“雅威的话”自然表达“从雅威而来的话”，并直接呈现神名。
- source_word: בשנת הָעֲשִׂרִית לְצִדְקִיָּהוּ מֶלֶךְ יְהוּדָה
  choice: 犹大王西底家第十年
  rationale: 按现代中文纪年习惯调整语序，同时完整保留君王、国名和在位年数。
- source_word: הִיא הַשָּׁנָה שְׁמֹנֶה עֶשְׂרֵה שָׁנָה
  choice: 也就是……第十八年
  rationale: הִיא 在此把同一年对应到另一位君王的纪年；“也就是”清楚表达等同关系，避免逐字重复“年”。
- source_word: לִנְבוּכַדְרֶאצַּר
  choice: 尼布甲尼撒
  rationale: 采用现代中文圣经及一般读者熟悉的标准人名形式；前缀 ל 在君王纪年公式中表示其在位年次。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。译作“雅威”保留其专名性质，不以称号“主”替代；同时避免把后起形式“耶和华”当作原始读音。
translation_notes:
  register: 采用现代、庄重而清楚的中文。为符合中文叙事节奏，将两个纪年置于句首，把核心启示公式“雅威的话临到耶利米”置于句末；不改变原文的时间对应关系或神圣信息来源。
