  text: Then the word of Yahweh came to Jeremiah[a], saying,
translation:
  language: zh_hans
  text: 于是，耶和华的话临到耶利米说：
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: 于是……临到
  rationale: 该叙事形式承接前文并引出下一事件；“于是”自然表达事件推进，与后面的“临到”共同传达希伯来语句式。
- source_word: דְּבַר
  choice: 话
  rationale: 在先知书固定表达“耶和华的话”中，“话”既简明自然，也保留其宣告与启示的分量。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经传统中对四字神名的通行音译，保留这是专名而非一般称号。
- source_word: אֶל
  choice: 临到
  rationale: 原词本义表示方向“向、到”；结合“耶和华的话”这一固定表达，中文以“临到”最自然。
- source_word: יִרְמְיָהוּ
  choice: 耶利米
  rationale: 采用该先知姓名在现代中文中的标准译名。
- source_word: לֵאמֹר
  choice: 说
  rationale: 该不定式引出随后神谕的内容；中文叙事公式用“说”简洁自然。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。正文采用中文读者最熟悉且作为专名使用的“耶和华”；“雅威”是依现代学界通常拟音而来的另一译法。此处不以“主”替代，以免把专名化为称号。
translation_notes:
  register: 采用庄重而自然的现代书面汉语，并保留先知书常见的启示公式“耶和华的话临到……说”。本节未设脚注，因此正文无脚注标记。
