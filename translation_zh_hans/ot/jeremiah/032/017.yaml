language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: אֲהָהּ֮ אֲדֹנָ֣/י יְהוִה֒ הִנֵּ֣ה אַתָּ֣ה עָשִׂ֗יתָ אֶת הַ/שָּׁמַ֨יִם֙ וְ/אֶת הָ/אָ֔רֶץ בְּ/כֹֽחֲ/ךָ֙ הַ/גָּד֔וֹל וּ/בִֽ/זְרֹעֲ/ךָ֖ הַ/נְּטוּיָ֑ה לֹֽא יִפָּלֵ֥א מִמְּ/ךָ֖ כָּל דָּבָֽר׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/017.yaml
  text: Ah, Lord GOD! Look, you yourself made the heavens and the earth by your great power and by your outstretched arm. Nothing is too difficult for you.
translation:
  language: zh_hans
  text: 啊，主耶和华！看哪，是你以大能和伸出的膀臂创造了天地；没有任何事对你太难。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲהָהּ
  choice: 啊
  rationale: 保留祷告开头强烈的感叹语气；在现代汉语中简洁、庄重。
- source_word: אֲדֹנָי יְהוִה
  choice: 主耶和华
  rationale: 分别体现“主”和神的专名，符合现代中文圣经语域，也避免把两词合并而损失原文形式。
- source_word: הִנֵּה
  choice: 看哪
  rationale: 保留原文引人注意、强调下文的功能；“看哪”虽较书面，却在庄重祷告中自然。
- source_word: עָשִׂיתָ
  choice: 创造了
  rationale: 此处宾语为天地，语境明确指神的创造作为；中文用“创造”比泛义“做成”自然准确。
- source_word: בְכֹחֲךָ הַגָּדוֹל
  choice: 以大能
  rationale: 表达凭借或施行创造的能力；“大能”凝练地保留“大而有力”的含义。
- source_word: וּבִזְרֹעֲךָ הַנְּטוּיָה
  choice: 和伸出的膀臂
  rationale: 保留原文具象的拟人表达，不将其解释性改写为抽象的“能力”。
- source_word: לֹא יִפָּלֵא מִמְּךָ כָּל דָּבָר
  choice: 没有任何事对你太难
  rationale: נפלא在此表示超乎能力、难以成就；此译自然表达原句对神无所不能的肯定。
theological_decisions:
- issue: 第二人称代词的强调
  choice: 是你……创造了
  alternative: 你创造了
  rationale: 原文显式使用אַתָּה，带有强调意味；用“是你”保留这一焦点，同时不额外加入“亲自”等解释。
- issue: 神的能力与“奇妙”词义之间的张力
  choice: 没有任何事对你太难
  alternative: 没有任何事对你是奇妙的
  rationale: 该动词词根可涉及奇妙、超常，但与介词מִן及神为对象的结构在此惯常表示“难得无法做到”；所选译法保留经文关于神能力的直接陈述，而不扩展为宗派性命题。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语体。“看哪”“膀臂”略具经文色彩，用以保留原文的强调和形象；全句避免过度古雅。
