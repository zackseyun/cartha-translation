base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/021.yaml
  text: And you brought your people Israel out of the land of Egypt with signs and wonders[a], with a strong hand and an outstretched arm, and with great terror.
translation:
  language: zh_hans
  text: 你用神迹奇事[a]，用大能的手和伸出的膀臂，并用大而可畏的作为，将你的子民以色列从埃及地领了出来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “大而可畏的作为”也可理解为“极大的惊恐”或“极大的敬畏”。希伯来语此处可指恐惧、惊恐、敬畏，或使人恐惧的事。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּצֵא
  choice: 领了出来
  rationale: 该词是יצא的使役式，意为使人出去、带领出来；中文“领了出来”既保留使役含义，也符合出埃及叙事的自然表达。
- source_word: עַמְּךָ אֶת יִשְׂרָאֵל
  choice: 你的子民以色列
  rationale: 保留“你的子民”的归属关系，并将“以色列”按希伯来文作为同位说明。
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: 从埃及地
  rationale: 准确表达离开埃及国土，也与“领了出来”自然搭配。
- source_word: בְּאֹתוֹת וּבְמוֹפְתִים
  choice: 用神迹奇事
  rationale: 介词בְּ在此表示手段；“神迹奇事”是现代中文中自然且为读者熟悉的固定搭配。
- source_word: וּבְיָד חֲזָקָה
  choice: 用大能的手
  rationale: יָד חֲזָקָה直译为“强有力的手”；“大能的手”保留身体意象，同时自然表达神施展的强大力量。
- source_word: וּבְאֶזְרֹעַ נְטוּיָה
  choice: 和伸出的膀臂
  rationale: 保留希伯来文具体的身体意象和出埃及公式用语；“伸出的”准确对应נְטוּיָה。
- source_word: וּבְמוֹרָא גָּדוֹל
  choice: 并用大而可畏的作为
  rationale: מוֹרָא可表示恐惧、可畏之事或令人敬畏的威势。结合工具性介词和并列结构，译成“大而可畏的作为”在中文中较自然，并保留使人恐惧与敬畏的语义张力。
theological_decisions:
- issue: וּבְמוֹרָא גָּדוֹל所指的是恐怖、敬畏，还是令人畏惧的作为
  choice: 并用大而可畏的作为
  alternative: 并使人大大惊恐；并彰显极大的威严
  rationale: 原文可以指恐惧、可畏的威势或引发恐惧的事。正文采用“可畏的作为”，既契合神对埃及所行之事的客观性质，又不把含义局限为人的主观恐惧或宗教敬畏；脚注说明其语义范围。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“你的子民以色列”保留原文同位结构；连续使用“用”呈现原文反复的工具性介词。末句为避免中文中“用大恐惧”生硬，译为“大而可畏的作为”，并以脚注保留原词的多义性。
