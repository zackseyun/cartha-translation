base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/002.yaml
  text: At that time the army of the king of Babylon was besieging Jerusalem[a], and Jeremiah the prophet was confined in the court of the guard[b], which was in the house of the king of Judah.
translation:
  language: zh_hans
  text: 那时，巴比伦王的军队正在围攻耶路撒冷[a]；先知耶利米被拘禁在护卫院里，这院位于犹大王宫中[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“正在围困耶路撒冷。”
    reason: lexical_alternative
  - marker: b
    text: “犹大王宫”指犹大王的宫殿建筑群。
    reason: cultural_note
lexical_decisions:
- source_word: וְ/אָז
  choice: 那时
  rationale: 这是引出历史场景的时间标记；“那时”自然、简洁，并保留原文的时间推进作用。
- source_word: חֵיל מֶלֶךְ בָּבֶל
  choice: 巴比伦王的军队
  rationale: חֵיל在此指王所统领的军事力量；“军队”是现代汉语中清楚自然的集体称谓。
- source_word: צָרִים עַל
  choice: 正在围攻
  rationale: 分词表达当时持续进行的军事行动；“正在围攻”既传达进行状态，也符合现代汉语叙事习惯。
- source_word: וְ/יִרְמְיָהוּ הַ/נָּבִיא
  choice: 先知耶利米
  rationale: 保留原文明确给出的身份称号，并采用现代汉语自然的“称号＋姓名”语序。
- source_word: הָיָה כָלוּא
  choice: 被拘禁
  rationale: 表达受限制、被关押的状态，同时不把场所过度具体化为普通牢房。
- source_word: בַּ/חֲצַר הַ/מַּטָּרָה
  choice: 在护卫院里
  rationale: “护卫院”保留该处作为受守卫、受监管院落的制度性含义，也与后文的王宫位置相协调。
- source_word: אֲשֶׁר בֵּית מֶלֶךְ יְהוּדָה
  choice: 这院位于犹大王宫中
  rationale: 原文以“犹大王的房屋”定位该院；此处“王宫”准确传达王室宫殿建筑群之义，并以“这院”明确关系从句的所指。
theological_decisions: []
