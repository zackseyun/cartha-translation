base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/009.yaml
  text: 'So I bought the field from Hanamel the son of my uncle[a], who was at Anathoth[b], and I weighed out the silver to him: seventeen shekels of silver.'
translation:
  language: zh_hans
  text: 于是我从我叔父的儿子哈拿篾手中买下了亚拿突的那块田[a]，称出十七舍客勒银子交给他[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文的关系从句也可理解为“从我叔父的儿子、在亚拿突的哈拿篾手中买下那块田”。结合本章8节，正文将“在亚拿突”理解为说明田的所在地。
    reason: 保留关系从句所修饰对象的句法歧义。
  - marker: b
    text: 希伯来文直译为“七舍客勒和十银子”，通常理解为十七舍客勒银子。
    reason: 说明原文数目表达中省略成分所造成的形式难点，并保留其通常理解。
lexical_decisions:
- source_word: וָאֶקְנֶה
  choice: 于是，我……买下了
  rationale: קנה在这里指商业购买；用“于是”自然承接前文所叙述的行动。
- source_word: הַשָּׂדֶה
  choice: 那块田
  rationale: שָׂדֶה指田地或一片土地；“那块田”既自然，也符合已知特定产业的语境。
- source_word: מֵאֵת חֲנַמְאֵל
  choice: 从……哈拿篾手中
  rationale: מֵאֵת标明交易中的卖方；“从……手中”清楚表达购买来源，同时符合现代汉语习惯。
- source_word: בֶּן דֹּדִי
  choice: 我叔父的儿子
  rationale: 保留希伯来文明确的亲属表达，不直接简化为“我的堂兄弟”，以免加入年龄等原文未说明的信息。
- source_word: אֲשֶׁר בַּעֲנָתוֹת
  choice: 亚拿突的那块田
  rationale: 关系从句在句法上有附着歧义；结合本章8节对该田所在地的明确说明，正文将其理解为田在亚拿突，同时以脚注保留另一种读法。
- source_word: וָאֶשְׁקֲלָה לּוֹ אֶת הַכֶּסֶף
  choice: 称了……银子给他
  rationale: שקל具体指称量，反映古代以重量支付银子的做法；“银子”兼顾材料和支付媒介。
- source_word: שִׁבְעָה שְׁקָלִים וַעֲשָׂרָה הַכָּסֶף
  choice: 十七舍客勒银子
  rationale: 希伯来文按“七舍客勒和十”的次序表达，通常理解为十七舍客勒；正文采用现代读者容易理解的合计数，脚注保留原文形式。
- source_word: שְׁקָלִים
  choice: 舍客勒
  rationale: 这是重量单位，在此也用于计量所付银子；保留专名比泛译为“银币”更准确。
