  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: לָ/כֵ֕ן כֹּ֖ה אָמַ֣ר יְהוָ֑ה הִנְ/נִ֣י נֹתֵן֩ אֶת הָ/עִ֨יר הַ/זֹּ֜את בְּ/יַ֣ד הַ/כַּשְׂדִּ֗ים וּ/בְ/יַ֛ד נְבֽוּכַדְרֶאצַּ֥ר מֶֽלֶךְ בָּבֶ֖ל וּ/לְכָדָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/028.yaml
  text: 'Therefore thus says Yahweh: Behold[a], I am giving this city into the hand of the Chaldeans and into the hand of Nebuchadnezzar king of Babylon, and he will capture it.'
translation:
  language: zh_hans
  text: 因此，雅威如此说：“看哪[a]，我要把这城交在迦勒底人手中，交在巴比伦王尼布甲尼撒手中；他必攻取这城。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “看哪”是郑重引起注意并加强宣告语气的用语。
    reason: 说明现代汉语中较具古雅色彩、但承载原文强调功能的表达。
lexical_decisions:
- source_word: לָכֵן
  choice: 因此
  rationale: 承接上文的指控与解释，保留明确的因果推论语气。
- source_word: כֹּה אָמַר יְהוָה
  choice: 雅威如此说
  rationale: 保留先知信息常用的传信公式，并将神名 יְהוָה 音译为“雅威”。
- source_word: הִנְנִי
  choice: 看哪，我要
  rationale: “看哪”保留郑重、强调的宣告语气；后接“我要”自然表达说话者亲自实施的迫近行动。
- source_word: נֹתֵן
  choice: 交
  rationale: 此分词在语境中表示即将发生、已确定的行动；“交在……手中”既贴近原文，也清楚表达移交控制权。
- source_word: הָעִיר הַזֹּאת
  choice: 这城
  rationale: 简洁自然地保留名词与指示词的特指意义。
- source_word: בְּיַד
  choice: 在……手中
  rationale: 保留希伯来语“在手中”的意象，同时现代汉语可自然理解为置于对方控制之下。
- source_word: הַכַּשְׂדִּים
  choice: 迦勒底人
  rationale: 直接翻译族名，不以语境性的“巴比伦人”取代。
- source_word: נְבוּכַדְרֶאצַּר
  choice: 尼布甲尼撒
  rationale: 采用现代中文圣经读者较熟悉的传统译名；原文在此使用的辅音形式另见脚注。
- source_word: מֶלֶךְ בָּבֶל
  choice: 巴比伦王
  rationale: 自然、准确地表达希伯来语的属格结构。
- source_word: וּלְכָדָהּ
  choice: 他必攻取这城
  rationale: לכד 用于城邑时意为攻取、夺取；第三人称阳性单数主语按最近的单数先行词理解为尼布甲尼撒，阴性宾语后缀则明确回指“城”。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名；音译“雅威”保留其专名性质，不以称号替代。
- issue: וּלְכָדָהּ 的单数主语所指
  choice: 译作“他必攻取这城”，指尼布甲尼撒
  alternative: 译作“这城必被攻取”，或理解为迦勒底军队集体实施
  rationale: 动词是第三人称阳性单数，最近的明确单数阳性先行词是巴比伦王尼布甲尼撒；但行动实际可包括其麾下军队。正文保留原文单数句法。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“雅威如此说”保留先知宣告的正式语体；“交在……手中”保留原文意象且在现代汉语中易懂。正文仅使用脚注标记[a]，未放置[b]，故出版时应删除未被正文引用的[b]脚注，或在“尼布甲尼撒”后补上[b]。
