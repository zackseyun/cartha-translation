  text: וּ/בָ֣אוּ הַ/כַּשְׂדִּ֗ים הַ/נִּלְחָמִים֙ עַל הָ/עִ֣יר הַ/זֹּ֔את וְ/הִצִּ֜יתוּ אֶת הָ/עִ֥יר הַ/זֹּ֛את בָּ/אֵ֖שׁ וּ/שְׂרָפ֑וּ/הָ וְ/אֵ֣ת הַ/בָּתִּ֡ים אֲשֶׁר֩ קִטְּר֨וּ עַל גַּגּֽוֹתֵי/הֶ֜ם לַ/בַּ֗עַל וְ/הִסִּ֤כוּ נְסָכִים֙ לֵ/אלֹהִ֣ים אֲחֵרִ֔ים לְמַ֖עַן הַכְעִסֵֽ/נִי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/029.yaml
  text: And the Chaldeans who are fighting against this city will come and set this city on fire and burn it[a], along with the houses on whose rooftops they burned incense to Baal and poured out drink offerings to other gods, to provoke me to anger.
translation:
  language: zh_hans
  text: 攻打这城的迦勒底人[a]必来，放火焚烧这城，也要烧毁那些房屋；那些房屋的屋顶上曾有人向巴力烧香，向别神浇奠，惹我发怒。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“巴比伦人”。希伯来文作“迦勒底人”，这里指新巴比伦的军队。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכַּשְׂדִּים
  choice: 迦勒底人
  rationale: 这是对族名的直接翻译；在本处语境中指新巴比伦的军队。“巴比伦人”作为语境性替代译法列入脚注。
- source_word: הַנִּלְחָמִים עַל
  choice: 攻打
  rationale: 分词配介词עַל表示正在针对这城进行敌对军事行动；“攻打”自然简洁，也符合此处围城语境。
- source_word: וְהִצִּיתוּ אֶת הָעִיר הַזֹּאת בָּאֵשׁ וּשְׂרָפוּהָ
  choice: 放火焚烧这城
  rationale: 希伯来文连续表达“用火点燃”并“烧毁”；汉语以“放火焚烧”自然保留纵火及焚毁之意，避免机械重复。
- source_word: וְאֵת הַבָּתִּים
  choice: 也要烧毁那些房屋
  rationale: 第二个直接宾语把房屋纳入焚烧范围；补出谓语使中文句法清楚流畅。
- source_word: אֲשֶׁר קִטְּרוּ עַל גַּגּוֹתֵיהֶם
  choice: 人曾在那些房屋的屋顶上……烧香
  rationale: קטר在此指祭祀性的烧香；关系从句修饰房屋，明确重复“那些房屋”可避免中文中代词所指含混。
- source_word: לַבַּעַל
  choice: 向巴力
  rationale: 介词标示祭献的对象；“巴力”保留专名，向普通读者也较为熟悉。
- source_word: וְהִסִּכוּ נְסָכִים
  choice: 浇奠祭
  rationale: 这是献祭语境中倾倒液体祭物的固定表达；“浇奠祭”兼顾动作、祭物及现代中文可懂度。
- source_word: לֵאלֹהִים אֲחֵרִים
  choice: 向别神
  rationale: 直译“其他的神”；“别神”是自然而凝练的圣经汉语表达，不额外解释为“外国的神”。
- source_word: לְמַעַן הַכְעִסֵנִי
  choice: 惹我发怒
  rationale: 保留כעס使役形的因果力量，以及לְמַעַן可能表达的目的或结果；中文未强行判定他们是否主观以激怒上帝为目的。
theological_decisions:
- issue: 偶像崇拜引发上帝发怒
  choice: 惹我发怒
  alternative: 使我发怒／为要激怒我
  rationale: 原文明确把这些祭拜行为与上帝的愤怒相连。“惹我发怒”保留人格性和审判意味，同时不把לְמַעַן所含的目的或结果张力单向化。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“放火焚烧”合并原文相邻的点火与烧毁表达，但没有削弱其力度；以分号划分军事毁灭与房屋中偶像祭祀的说明。脚注标记[a]已置于正文对应词后。
