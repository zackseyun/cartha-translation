  yaml_path: translation/ot/jeremiah/032/010.yaml
  text: So I wrote it in the deed[a], sealed it, called witnesses, and weighed out the silver on the scales.
translation:
  language: zh_hans
  text: 于是我在契约上写下[a]，封上印，请证人作证，并用天平称出银子。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “契约”也可译作“文书”或“书卷”。希伯来语 סֵפֶר 泛指书写成的文件或书卷；这里很可能指购地契约。
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶכְתֹּב
  choice: 于是我……写好
  rationale: 该词是כתב的Qal连续式第一人称单数，承接前文叙事；“于是”自然表达动作次序，“写好”符合办理契约的语境。
- source_word: בַּסֵּפֶר
  choice: 把契约写好
  rationale: סֵפֶר泛指书写物、文书或卷册；本节处于购地交易语境，指购置契约最为可能。汉语用“把契约写好”自然表达在文书上完成书写，但以脚注保留“文书、卷册”的广义可能。
- source_word: וָאֶחְתֹּם
  choice: 封了起来
  rationale: חתם在法律文书语境中指封缄、加封；宾语承接前面的契约，在汉语中可自然省略。
- source_word: וָאָעֵד עֵדִים
  choice: 请来见证人
  rationale: עוד的Hiphil形态与“见证人”连用，在此表示使见证人作证或请见证人在场确认；“请来见证人”简洁自然，并保留法律交易场景。
- source_word: וָאֶשְׁקֹל הַכֶּסֶף
  choice: 称出银子
  rationale: שקל表示称量，כֶּסֶף本义为银子，也可引申为钱；因下文明确提到天平，译作“称出银子”保留古代按重量支付白银的具体图景。
- source_word: בְּמֹאזְנָיִם
  choice: 用天平
  rationale: מֹאזְנַיִם指称量用的双盘天平或秤；“用天平”是现代汉语中清楚自然的工具表达。
