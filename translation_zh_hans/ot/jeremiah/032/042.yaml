  text: כִּֽי כֹה֙ אָמַ֣ר יְהוָ֔ה כַּ/אֲשֶׁ֤ר הֵבֵ֨אתִי֙ אֶל הָ/עָ֣ם הַ/זֶּ֔ה אֵ֛ת כָּל הָ/רָעָ֥ה הַ/גְּדוֹלָ֖ה הַ/זֹּ֑את כֵּ֣ן אָנֹכִ֞י מֵבִ֤יא עֲלֵי/הֶם֙ אֶת כָּל הַ/טּוֹבָ֔ה אֲשֶׁ֥ר אָנֹכִ֖י דֹּבֵ֥ר עֲלֵי/הֶֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/042.yaml
  text: 'For thus says Yahweh: Just as I brought on this people all this great disaster[b][a], so I will bring on them all the good that I am speaking concerning them.'
translation:
  language: zh_hans
  text: 因为耶和华如此说：“我怎样使这一切大灾祸[a]临到这百姓，我也必使我所说有关他们的一切福祉[b]临到他们。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “灾祸”也可译作“灾难”；原文所用的词也可指“恶”，但此处是指审判所带来的祸患。
    reason: lexical_alternative
  - marker: b
    text: “我所说有关他们的”，更直译为“我论到他们所说的”。按上下文，也可理解为“我所应许给他们的”，但原文动词本身是“说”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，为前述应许提供理由；现代汉语用“因为”可自然表达这一篇章关系。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代简体中文圣经读者熟悉的专名形式，明确保留神的圣约之名。
- source_word: כֹה אָמַר
  choice: 如此说
  rationale: 保留先知信息中固定的使者宣告格式，同时符合庄重的现代汉语表达。
- source_word: כַּאֲשֶׁר ... כֵּן
  choice: 怎样……也必照样
  rationale: 清楚保留过去审判与将来赐福之间明确的对应比较结构。
- source_word: הֵבֵאתִי
  choice: 使……临到
  rationale: 该使役形式表明耶和华使灾祸临到百姓；此译法既保留神的主动作用，也比逐字译法自然。
- source_word: כָּל הָרָעָה הַגְּדוֹלָה הַזֹּאת
  choice: 这一切大灾祸
  rationale: רָעָה 在此指审判性的灾难，而非道德上的邪恶；“灾祸”保留其严重性和先知语境。
- source_word: מֵבִיא
  choice: 必……使……临到
  rationale: 分词在这一预言语境中表达确定的将来行动；“必”传达应许的确定性，也符合自然汉语。
- source_word: כָּל הַטּוֹבָה
  choice: 一切福祉
  rationale: טוֹבָה 泛指神将赐下的好处、安乐与兴盛；“福祉”较“一切好事”庄重，也不把范围缩窄为单一福分。
- source_word: אֲשֶׁר אָנֹכִי דֹּבֵר עֲלֵיהֶם
  choice: 我所说要赐给他们的
  rationale: “所说”保留 דֹּבֵר 的言说含义；结合赐福语境补出“要赐给”，使中文关系清楚，同时脚注注明更贴近字面的译法。
theological_decisions:
- issue: 如何表达 רָעָה 与神主动施行审判的关系
  choice: 灾祸
  alternative: 恶、灾难
  rationale: 本节将过去临到百姓的审判与将来的福祉相对照；“灾祸”表达审判性祸患，却不暗示神施行道德之恶。
- issue: 将 דֹּבֵר עֲלֵיהֶם 理解为言说还是应许
  choice: 正文译作“我所说要赐给他们的”，并以脚注保留“论到他们所说的”
  alternative: 我向他们所应许的；我论到他们所说的
  rationale: 上下文具有应许含义，但希伯来文动词本身是“说”而非专门的“应许”；正文兼顾自然中文与语境，脚注保留原文措辞和解释空间。
translation_notes:
  register: 采用庄重而清晰的现代标准汉语。“怎样……也必照样”保留原文对称结构；“使……临到”在两半句中重复，以凸显审判与赐福的对应。所有脚注标记均置于正文相关句末。
