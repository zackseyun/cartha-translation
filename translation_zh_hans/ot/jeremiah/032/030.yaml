  text: כִּֽי הָי֨וּ בְנֵֽי יִשְׂרָאֵ֜ל וּ/בְנֵ֣י יְהוּדָ֗ה אַ֣ךְ עֹשִׂ֥ים הָ/רַ֛ע בְּ/עֵינַ֖/י מִ/נְּעֻרֹֽתֵי/הֶ֑ם כִּ֣י בְנֵֽי יִשְׂרָאֵ֗ל אַ֣ךְ מַכְעִסִ֥ים אֹתִ֛/י בְּ/מַעֲשֵׂ֥ה יְדֵי/הֶ֖ם נְאֻם יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/030.yaml
  text: For the sons of Israel and the sons of Judah have done only what was evil in my eyes from their youth[a], for the sons of Israel have only provoked me by the work of their hands[b], declares Yahweh.
translation:
  language: zh_hans
  text: 因为以色列人和犹大人自幼年以来，总是行我眼中看为恶的事[a]；以色列人一味因他们手所做的惹我发怒[b]。这是耶和华的宣告。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “以色列人”和“犹大人”，希伯来文直译分别为“以色列之子”和“犹大之子”。“自幼年以来”也可能指这两个民族从早期历史以来。
    reason: 词义与历史指向说明
  - marker: b
    text: “他们手所做的”可泛指他们的作为；在本段语境中，也可特指他们亲手制造的偶像。
    reason: 保留语义歧义并说明文化背景
lexical_decisions:
- source_word: בְנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 字面为“以色列之子”，在现代汉语中用“以色列人”自然表达其群体、盟约性称谓；脚注保留字面形式。
- source_word: וּבְנֵי יְהוּדָה
  choice: 和犹大人
  rationale: 与“以色列人”平行，保留北国与南国群体的区分，同时符合现代汉语表达。
- source_word: אַךְ
  choice: 尽
  rationale: 此处强调其行为一贯以恶与触怒上帝为特征；“尽”简洁地表达“只是、尽都”的排他和强化语气。
- source_word: עֹשִׂים הָרַע בְּעֵינַי
  choice: 做我眼中看为恶的事
  rationale: 既保留“在我眼中”的希伯来语意象，也以“看为恶”清楚表达耶和华对行为的判断。
- source_word: מִנְּעֻרֹתֵיהֶם
  choice: 从幼年起
  rationale: 直译其时间含义，并保留可能指这些群体自民族早期以来的长期历史意味。
- source_word: מַכְעִסִים אֹתִי
  choice: 惹我发怒
  rationale: 准确表达使役形式所指的持续冒犯及其引发上帝愤怒的结果，比单用“触怒”更通俗自然。
- source_word: בְּמַעֲשֵׂה יְדֵיהֶם
  choice: 以他们手所做的
  rationale: 保留原文“手所做的”这一表达，使其既可泛指人的作为，也可在语境中具体暗指人手制造的偶像。
- source_word: נְאֻם יְהוָה
  choice: 这是耶和华的宣告
  rationale: 以庄重而自然的现代汉语呈现先知宣告公式，并将神名 יְהוָה 译作“耶和华”。
theological_decisions:
- issue: 第二分句中“以色列人”的范围
  choice: 仍明确译作“以色列人”
  alternative: 改译为“他们”或扩展为“以色列人和犹大人”
  rationale: 希伯来文第二次明确重复“以色列人”。保留这一措辞，避免把可能具有代表性或范围收窄意味的表达擅自协调。
- issue: “他们手所做的”的具体所指
  choice: 正文保留开放表达
  alternative: 正文直接译为“他们制造的偶像”
  rationale: 该短语既可泛指人的行为，也可能特指人手制造的偶像；正文不消除歧义，脚注说明其偶像含义。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。保留“我眼中”“手所做的”等原文意象，但避免生硬直译；两个“尽”对应原文两次 אַךְ，呈现反复强化的责备语气。
