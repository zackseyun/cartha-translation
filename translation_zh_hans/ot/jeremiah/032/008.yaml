id: JER.32.8
reference: Jeremiah 32:8
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יָּבֹ֣א אֵ֠לַ/י חֲנַמְאֵ֨ל בֶּן דֹּדִ֜/י כִּ/דְבַ֣ר יְהוָה֮ אֶל חֲצַ֣ר הַ/מַּטָּרָה֒ וַ/יֹּ֣אמֶר אֵלַ֡/י קְנֵ֣ה נָ֠א אֶת שָׂדִ֨/י אֲשֶׁר בַּ/עֲנָת֜וֹת אֲשֶׁ֣ר בְּ/אֶ֣רֶץ בִּנְיָמִ֗ין כִּֽי לְ/ךָ֞ מִשְׁפַּ֧ט הַ/יְרֻשָּׁ֛ה וּ/לְ/ךָ֥ הַ/גְּאֻלָּ֖ה קְנֵה לָ֑/ךְ וָ/אֵדַ֕ע כִּ֥י דְבַר יְהוָ֖ה הֽוּא־־־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/008.yaml
  text: Then Hanamel the son of my uncle came to me in the court of the guard[a], according to the word of Yahweh, and he said to me, “Please buy my field that is at Anathoth, in the land of Benjamin, for the right of inheritance is yours and the redemption is yours. Buy it for yourself.” Then I knew that this was the word of Yahweh.
translation:
  language: zh_hans
  text: 我叔叔的儿子哈拿篾照雅威所说的话，来到我所在的护卫院，对我说：“请你买下我在便雅悯地亚拿突的那块田，因为你有承受产业的权利，也有赎回产业的权利[a]。你为自己买下吧。”我便知道这是雅威的话。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“赎回是你的”。这是指近亲赎回家族产业的权利，也可能包含相应的责任。
    reason: 说明亲属赎回制度，并保留原词在权利与责任之间的语义范围。
lexical_decisions:
- source_word: כִּדְבַר יְהוָה
  choice: 果然照雅威的话
  rationale: כְּדְבַר 表示事情与先前所说的话相符；“照……的话”保留这一联系，“果然”自然体现事件证实前文预告的叙事作用。
- source_word: חֲצַר הַמַּטָּרָה
  choice: 护卫院
  rationale: 指耶利米受看守时所在的院落；“护卫院”简洁保留看守、拘禁的含义，又不把它过度具体化为监狱。
- source_word: קְנֵה נָא
  choice: 请你买下
  rationale: קנה 在地产交易语境中是“购买”，נָא 缓和命令语气，故译为礼貌的请求。
- source_word: שָׂדִי
  choice: 我的那块田
  rationale: שָׂדֶה 的基本义为“田地”；量词“块”符合现代汉语地产语境，“那”使特指自然明确。
- source_word: מִשְׁפַּט הַיְרֻשָּׁה
  choice: 承受产业的权利
  rationale: מִשְׁפָּט 在此指合法权利或资格，יְרֻשָּׁה 指承受、占有的产业；此译保留法律意味，也避免只让人联想到死后继承。
- source_word: הַגְּאֻלָּה
  choice: 赎回产业的权利
  rationale: 该词在这里涉及近亲赎回家族地产的制度。正文补出语境隐含的“产业”和“权利”，使现代读者能够理解；脚注保留希伯来文较简略的表达及权利与责任之间的张力。
- source_word: קְנֵה לָךְ
  choice: 请买下来归你
  rationale: לָךְ 在这里表示为自己取得、归自己所有；译文传达重复劝买及所有权归属。
- source_word: וָאֵדַע כִּי דְבַר יְהוָה הוּא
  choice: 我便知道这是雅威的话
  rationale: 直译并保留耶利米因事件应验而确认先前启示的语气。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见音译呈现四字神名，保留其专名性质，不以称号替代。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。译作“雅威”保留专名，并较贴近通常重构的发音；不用“主”替代神名。
- issue: הַגְּאֻלָּה 所含的是权利还是责任
  choice: 正文译“赎回产业的权利”，脚注说明也可能兼有亲属责任
  alternative: 赎回产业的责任
  rationale: 上下文首先强调耶利米具有优先赎买资格，但古代亲属制度也可能赋予相应责任；不把这种法律与伦理张力单向定死。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“果然”衔接前文预告；“护卫院”避免误解为普通庭院，同时不擅自具体化为监牢。脚注标记紧随实际需要解释的“赎回产业的权利”，而非置于“护卫院”之后。
