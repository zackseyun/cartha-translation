  text: אֲשֶׁ֣ר כְּלָא֔/וֹ צִדְקִיָּ֥הוּ מֶֽלֶךְ יְהוּדָ֖ה לֵ/אמֹ֑ר מַדּוּעַ֩ אַתָּ֨ה נִבָּ֜א לֵ/אמֹ֗ר כֹּ֚ה אָמַ֣ר יְהוָ֔ה הִנְ/נִ֨י נֹתֵ֜ן אֶת הָ/עִ֥יר הַ/זֹּ֛את בְּ/יַ֥ד מֶֽלֶךְ בָּבֶ֖ל וּ/לְכָדָֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/003.yaml
  text: 'because Zedekiah king of Judah had confined him[a], saying, “Why do you prophesy, saying, ‘Thus says Yahweh: Behold, I am giving this city into the hand of the king of Babylon, and he will capture it’?”'
translation:
  language: zh_hans
  text: 因为犹大王西底家拘禁了他[a]，说：“你为什么预言：‘雅威如此说：看哪，我要把这城交在巴比伦王手中，他必攻取这城’呢？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “拘禁”或译“关押”或“囚禁”。
    reason: 原词 כלא 涵盖限制自由、关押和监禁等相近含义。
lexical_decisions:
- source_word: אֲשֶׁר
  choice: 因为
  rationale: 这里的关系词承接上一节，说明耶利米被关押的原因；译为“因为”最能体现其篇章功能。
- source_word: כְּלָאוֹ
  choice: 拘禁了他
  rationale: כלא表示限制自由、关押或监禁。“拘禁”既保留司法羁押的含义，又符合现代汉语。
- source_word: לֵאמֹר
  choice: 说
  rationale: 这是引出直接引语的常用希伯来语结构，汉语简洁译作“说”。
- source_word: מַדּוּעַ
  choice: 为什么
  rationale: 直接表达质问原因，符合西底家责问先知的语气。
- source_word: נִבָּא
  choice: 预言
  rationale: נבא的尼法勒词干在此指发出先知性宣告；“预言”自然且准确。
- source_word: כֹּה אָמַר יְהוָה
  choice: 雅威如此说
  rationale: 保留先知使者宣告的固定公式，并将神名 יְהוָה 音译为“雅威”。
- source_word: הִנְנִי
  choice: 看哪，我要
  rationale: “看哪”保留 הִנֵּה 所带的郑重、引人注意的语气；“我要”自然表达分词所指的迫近且确定的行动。
- source_word: נֹתֵן
  choice: 要把……交
  rationale: 该分词描写即将发生而确定无疑的行动；现代汉语用“要把……交”既自然，也保留其迫近感。
- source_word: בְּיַד
  choice: 交在……手中
  rationale: 既保留“手”的希伯来语意象，也清楚表达落入某人权势之下。
- source_word: וּלְכָדָהּ
  choice: 他必攻取这城
  rationale: לכד用于城市时指军事攻占；明确重复“这城”可避免汉语代词指向不清，“必”表达预告的确定性。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；音译为“雅威”保留其作为以色列之神专名的功能，而不以称号代替。
- issue: נֹתֵן 的时间与语气
  choice: 我要把这城交在……手中
  alternative: 我正在把这城交在……手中
  rationale: 希伯来语分词可表达正在进行、迫近或被视为确定的行动。上下文指尚待实现却已由神宣告确定的交付，因此译作“我要”，但不额外规定更精确的时间。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。保留“雅威如此说”“看哪”以及“交在……手中”等先知宣告的修辞特征；通过内外层引号清楚呈现西底家的话及其所引用的预言。
