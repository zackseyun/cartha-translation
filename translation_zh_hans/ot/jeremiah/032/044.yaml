  text: שָׂד֞וֹת בַּ/כֶּ֣סֶף יִקְנ֗וּ וְ/כָת֨וֹב בַּ/סֵּ֥פֶר וְ/חָתוֹם֮ וְ/הָעֵ֣ד עֵדִים֒ בְּ/אֶ֨רֶץ בִּנְיָמִ֜ן וּ/בִ/סְבִיבֵ֣י יְרוּשָׁלִַ֗ם וּ/בְ/עָרֵ֤י יְהוּדָה֙ וּ/בְ/עָרֵ֣י הָ/הָ֔ר וּ/בְ/עָרֵ֥י הַ/שְּׁפֵלָ֖ה וּ/בְ/עָרֵ֣י הַ/נֶּ֑גֶב כִּֽי אָשִׁ֥יב אֶת שְׁבוּתָ֖/ם נְאֻם יְהוָֽה׀־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/044.yaml
  text: Fields will be bought with silver[a], and deeds will be written in a scroll and sealed and witnessed by witnesses in the land of Benjamin, around Jerusalem, and in the cities of Judah, in the cities of the hill country, in the cities of the lowland, and in the cities of the Negeb; for I will restore their fortunes[c][b], declares Yahweh.
translation:
  language: zh_hans
  text: 人必用银子买田地，写下契约，封缄，并请证人作证[a]；这事必发生在便雅悯地、耶路撒冷周围、犹大各城，以及山区、低地[b]和南地的各城。因为我必恢复他们的景况[c]。这是雅威的宣告。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译近于“使证人作证”，是正式确认交易的法律用语。
    reason: lexical_alternative
  - marker: b
    text: “低地”原文为“示非拉”，指犹大山地与沿海平原之间的丘陵低地区域。
    reason: cultural_note
  - marker: c
    text: 也可译作“使他们被掳的人归回”或“扭转他们被掳的境况”。这个希伯来语惯用语既可指流亡者归回，也可泛指整体景况得到恢复。
    reason: alternative_reading
lexical_decisions:
- source_word: שָׂדוֹת בַּכֶּסֶף יִקְנוּ
  choice: 人必用银子买田地
  rationale: 希伯来文直译为“他们必用银子买田地”。保留主动句和具体的交易媒介“银子”，以呈现战乱之后土地交易恢复的图景。
- source_word: וְכָתוֹב בַּסֵּפֶר
  choice: 写下契约
  rationale: סֵפֶר 在此处于购地法律程序中，指书面契据或契约，而非一般书卷；“写下契约”在现代汉语中自然清楚。
- source_word: וְחָתוֹם
  choice: 封缄
  rationale: 指契约经过封存或盖印确认，是古代法律交易程序的一环；“封缄”简洁而庄重。
- source_word: וְהָעֵד עֵדִים
  choice: 并请证人作证
  rationale: 原文是使役结构配合同根名词，字面近于“使证人作证”。译文保留正式见证的法律意义，同时避免生硬重复。
- source_word: בְּאֶרֶץ בִּנְיָמִן
  choice: 在便雅悯地
  rationale: אֶרֶץ 在此指便雅悯支派的地域；“便雅悯地”简明且符合中文圣经地理表达。
- source_word: וּבִסְבִיבֵי יְרוּשָׁלִַם
  choice: 耶路撒冷周围
  rationale: 准确表达城外及邻近区域，现代汉语自然。
- source_word: וּבְעָרֵי יְהוּדָה
  choice: 犹大各城
  rationale: עָרֵי 是复数构造形式，泛指犹大境内诸城镇；“各城”既简洁又保留重复列举的地域范围。
- source_word: הָהָר
  choice: 山区
  rationale: 这里是犹大的地理区域名称，指中央山地，并非某一座山。
- source_word: הַשְּׁפֵלָה
  choice: 低地
  rationale: 指犹大山地与沿海平原之间的示非拉区域；正文采用普通读者易懂的地貌名称，并以脚注补充专名。
- source_word: הַנֶּגֶב
  choice: 南地
  rationale: 在本节与其他地理区域并列，指称南部的尼革夫地区；“南地”保留该词兼具方位和地域名称的特点。
- source_word: נְאֻם יְהוָה
  choice: 这是雅威的宣告
  rationale: נְאֻם 是先知书常见的神谕结束语；译为“宣告”保留其庄严正式的语气，并以“雅威”音译神名。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文明确使用四字神名。采用现代汉语中较直接反映其可能读音的“雅威”，不以称号替代专名。
- issue: 恢复公式 אָשִׁיב אֶת שְׁבוּתָם 的含义
  choice: 我必恢复他们的景况
  alternative: 我必使他们被掳的人归回；我必扭转他们被掳的境况
  rationale: 该固定表达既可涉及被掳者归回，也可泛指苦境的扭转与整体复兴。正文采用范围较宽的译法，并在脚注保留与流亡、被掳直接相关的理解，避免把原文的含义收窄。
translation_notes:
  register: 采用现代、庄重而易懂的叙述语体。保留原文从交易手续到地理区域逐项铺陈的结构，但以“这事必发生在”衔接地点清单，使中文句法清晰。正文中的脚注标记[a]、[b]、[c]均与脚注一一对应。
