  yaml_path: translation/ot/jeremiah/032/038.yaml
  text: And they will be my people[a], and I will be their God.
translation:
  language: zh_hans
  text: 他们要作我的子民[a]，我要作他们的上帝。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“他们要对我作子民，我要对他们作上帝。”这是希伯来语的盟约惯用语，表达彼此相属的关系。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיוּ
  choice: 他们要作
  rationale: 在这一连串先知性应许中，带连接词的完成式表达将来的应验；“要作”既自然，也保留“成为／是”的关系含义。
- source_word: לִי לְעָם
  choice: 我的子民
  rationale: 直译为“对我作子民”，但这是希伯来语盟约惯用语；现代汉语以“我的子民”自然表达归属和关系。选择“子民”而非泛称“人民”，更贴合群体与上帝之间的盟约关系。
- source_word: וַאֲנִי
  choice: 我
  rationale: 连接词承接并平衡前一分句。汉语并列句中不必明译“和”，省略后更自然，且不产生转折含义。
- source_word: אֶהְיֶה
  choice: 要作
  rationale: 未完成式在这里表达上帝面向未来的盟约承诺；“要作”与前句形成对称。
- source_word: לָהֶם לֵאלֹהִים
  choice: 他们的上帝
  rationale: 直译为“对他们作上帝”，在盟约公式中表达确定的归属关系，而非泛指“一位神”；“他们的上帝”符合现代汉语习惯。
theological_decisions:
- issue: 盟约公式的译法
  choice: 他们要作我的子民，我要作他们的上帝。
  alternative: 他们要对我作子民，我要对他们作上帝。
  rationale: 正文采用自然汉语表达双方相属的盟约关系，并保留两个分句的平衡与互应；脚注说明原文形式，避免因意译而隐藏希伯来语的关系结构。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“子民”保留圣经盟约语境中的群体关系色彩；两个“要作”构成清楚的平行句式。
