  text: וַ/יָּשִׂ֣ימוּ שִׁקּֽוּצֵי/הֶ֗ם בַּ/בַּ֛יִת אֲשֶׁר נִקְרָֽא שְׁמִ֥/י עָלָ֖י/ו לְ/טַמְּאֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/034.yaml
  text: They put their detestable things in the house that is called by my name[b][a], to defile it.
translation:
  language: zh_hans
  text: 他们把自己的可憎之物[b]放在那归我名下的殿[a]中，为要玷污它。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“房屋”；这里指归上帝名下的殿，即圣殿。
    reason: lexical_alternative
  - marker: b
    text: 或译“他们的可憎之事”。这个希伯来词常指令人憎恶的事物或行为，尤其与偶像崇拜有关。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשִׂימוּ
  choice: 他们……放在
  rationale: 叙事形式表达过去的行动；“放在”自然、具体，并与地点短语顺畅衔接。
- source_word: שִׁקּוּצֵיהֶם
  choice: 自己可憎之物
  rationale: 该词指令人憎恶之物，常与偶像崇拜有关；“可憎之物”保留较宽泛的含义，不把所指过早限定为偶像。
- source_word: בַּבַּיִת
  choice: 在……殿中
  rationale: בַּיִת 字面是“房屋”，但此处明确指耶和华的圣殿；现代汉语中译作“殿”既保留“神之居所”的表达，又能让普通读者自然理解。脚注注明字面意义。
- source_word: אֲשֶׁר נִקְרָא שְׁמִי עָלָיו
  choice: 称为我名下的
  rationale: 保留希伯来语“我的名被称在其上”的核心意象，同时用现代汉语表达归属、宣称和奉献给神的含义。
- source_word: לְטַמְּאוֹ
  choice: 玷污了这殿
  rationale: 不定式可表达目的或结果；此处汉语用结果性表述自然，同时“玷污”兼有礼仪和道德污染的庄重含义。重复“这殿”可消除代词指向不清。
theological_decisions:
- issue: בַּבַּיִת 应按字面译为“房屋”，还是按语境译为“圣殿/殿”
  choice: 殿
  alternative: 房屋；圣殿
  rationale: 原词字面为“房屋”，语境则无疑指耶路撒冷圣殿。“殿”在现代汉语中自然且不过度解释，并以脚注保存字面措辞。
- issue: לְטַמְּאוֹ 表示目的还是结果
  choice: 按结果表达为“玷污了这殿”
  alternative: 为要玷污这殿
  rationale: 希伯来语不定式可涵盖目的或结果；上下文至少明确说明行为造成玷污。正文采用自然的结果表达，但不据此断言玷污圣殿必是他们自觉的主观目的。
translation_notes:
  register: 采用现代、庄重而清楚的普通话。“可憎之物”保留经文的宗教与道德分量；“称为我名下”略带源语色彩，但在汉语中仍可理解，并保存神宣告归属的意象。所有脚注标记均置于对应词语之后。
