  text: וְ/כָרַתִּ֤י לָ/הֶם֙ בְּרִ֣ית עוֹלָ֔ם אֲשֶׁ֤ר לֹֽא אָשׁוּב֙ מֵ/אַ֣חֲרֵי/הֶ֔ם לְ/הֵיטִיבִ֖/י אוֹתָ֑/ם וְ/אֶת יִרְאָתִ/י֙ אֶתֵּ֣ן בִּ/לְבָבָ֔/ם לְ/בִלְתִּ֖י ס֥וּר מֵ/עָלָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/040.yaml
  text: I will make with them an everlasting covenant[a], that I will not turn away from them, to do them good. And I will put the fear of me in their hearts[b], so that they will not turn away from me.
translation:
  language: zh_hans
  text: 我要与他们立永远的约[a]：我绝不离开他们，必善待他们；我也要把对我的敬畏放在他们心里[b]，使他们不离开我。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “永远的约”也可译作“永久的约”或“永恒的约”。
    reason: lexical_alternative
  - marker: b
    text: 原文为“我的敬畏”，即“对我的敬畏”；“心”在这里包括人的思想、意志和内在倾向。
    reason: lexical_alternative
lexical_decisions:
- source_word: כָרַתִּי
  choice: 立
  rationale: 希伯来语直译为“切约”，是订立盟约的固定说法；现代汉语以“立约”最自然、准确。
- source_word: בְּרִית עוֹלָם
  choice: 永远的约
  rationale: 保留 עוֹלָם 在盟约语境中持久、无尽的含义，同时符合现代汉语圣经语体。
- source_word: אֲשֶׁר לֹא אָשׁוּב מֵאַחֲרֵיהֶם
  choice: 我绝不离开他们
  rationale: 该短语表示上帝不再从他们身后转回、不撤回眷顾；“离开他们”自然传达其语义。“绝不”体现 לֹא 与该盟约应许的坚决语气。
- source_word: לְהֵיטִיבִי אוֹתָם
  choice: 必善待他们
  rationale: 表达上帝持续向他们施恩、使他们得益处；与前句连用时，“必善待”比机械直译更符合现代汉语。
- source_word: יִרְאָתִי
  choice: 敬畏我的心
  rationale: 字面为“对我的敬畏”。译作“敬畏我的心”明确敬畏以上帝为对象，也与“放在他们里面”自然衔接。
- source_word: בִּלְבָבָם
  choice: 在他们里面
  rationale: 原文“在他们心里”指意志和内在倾向。因汉语中前文已译“敬畏我的心”，采用“在他们里面”避免“把……心放在心里”的累赘，并保留内在性。
- source_word: לְבִלְתִּי סוּר מֵעָלָי
  choice: 使他们不离开我
  rationale: לְבִלְתִּי 表目的或预期结果；“使……不……”准确表达上帝赐下敬畏的作用，同时不额外界定其系统神学含义。
theological_decisions:
- issue: 盟约持续的性质
  choice: 永远的约
  alternative: 永久的约；永恒的约
  rationale: “永远”直接保留 עוֹלָם 所表达的持久性，不借译文裁定后来的神学体系。
- issue: “敬畏”与上帝的关系
  choice: 敬畏我的心
  alternative: 对我的敬畏；我的敬畏
  rationale: 明确这是人以上帝为对象的敬畏，而不是上帝自身所有的恐惧；“敬畏”也保留原词可能包含的畏惧、尊崇和忠诚意味，不缩减为单一情绪。
- issue: 上帝的行动与百姓不离开的关系
  choice: 使他们不离开我
  alternative: 好叫他们不离开我；以免他们离开我
  rationale: 保留原文中上帝把敬畏放入人心与他们不离开上帝之间的目的或结果关系，但不导入某一宗派关于坚忍或自由意志的完整理论。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“立约”“敬畏”保留圣经核心用语；句式清晰，避免古奥表达。两个分句中的“离开”形成呼应，对应原文中上帝不离开百姓、百姓不离开上帝的结构。
