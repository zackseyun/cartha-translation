  text: עֹ֤שֶׂה חֶ֨סֶד֙ לַֽ/אֲלָפִ֔ים וּ/מְשַׁלֵּם֙ עֲוֺ֣ן אָב֔וֹת אֶל חֵ֥יק בְּנֵי/הֶ֖ם אַחֲרֵי/הֶ֑ם הָ/אֵ֤ל הַ/גָּדוֹל֙ הַ/גִּבּ֔וֹר יְהוָ֥ה צְבָא֖וֹת שְׁמֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/018.yaml
  text: showing steadfast love to thousands[a], and repaying the iniquity of fathers into the lap of their children after them—the great, mighty God, Yahweh of Armies[b], is his name.
translation:
  language: zh_hans
  text: 你向数千人施慈爱[a]，又把父亲的罪孽报应到他们之后的子女怀中。伟大而大有能力的神，万军之耶和华[b]是他的名。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“向数千代施慈爱”；原文只说“向数千”，结合其他相似的圣约用语，可理解为“数千代”。
    reason: lexical_alternative
  - marker: b
    text: 或译“万军之主”。
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹשֶׂה חֶסֶד
  choice: 施慈爱
  rationale: 分词延续上文对神恒常作为的描述；“施慈爱”在现代汉语中自然庄重，也保留חֶסֶד所含的怜爱与信实。
- source_word: לַאֲלָפִים
  choice: 向千万人
  rationale: 希伯来文直译为“向数千”，没有明说“代”；正文以“千万人”表达受惠者众多，同时脚注保留“千代”的可能解释。
- source_word: וּמְשַׁלֵּם
  choice: 又……报
  rationale: 表达按行为施行报应或偿还的意思，并与前面的持续性分词结构相配；不采用较含混的“追讨”。
- source_word: עֲוֺן
  choice: 罪孽
  rationale: 该词可指罪行、罪责或罪的后果；“罪孽”保留其道德分量，也不强行判定此处专指哪一层含义。
- source_word: אָבוֹת
  choice: 父亲
  rationale: 原文为阳性复数，直指父辈；译作“父亲”而不泛化为“父母”。
- source_word: אֶל חֵיק
  choice: 在……怀中
  rationale: 保留原文将报应放入人怀中的鲜明隐喻；“怀中”比完全意译为“身上”更贴近原文。
- source_word: בְּנֵיהֶם אַחֲרֵיהֶם
  choice: 他们后代子女
  rationale: בנים在此可泛指子女或后代；“后代子女”既表达亲子关系，也保留אַחֲרֵיהֶם所指的世代承接。
- source_word: הָאֵל הַגָּדוֹל הַגִּבּוֹר
  choice: 伟大而大有能力的神
  rationale: 采用自然、庄重的现代汉语，保留两个称号所表达的尊荣与能力。
- source_word: יְהוָה צְבָאוֹת
  choice: 万军之耶和华
  rationale: “耶和华”呈现神的专名；“万军之”是中文读者较熟悉且庄严的称号，并保留神统领天上地下众军的主权意味。
theological_decisions:
- issue: 跨世代报应的表述
  choice: 保留神把父亲的罪孽报在后代子女怀中的直接陈述
  alternative: 仅解释为父辈犯罪造成的自然社会后果，或明确断言无辜子女受到直接刑罚
  rationale: 本节确实陈述了报应的跨世代层面；译文不加以弱化，也不预先调和它与强调个人责任的经文之间的张力。
- issue: 称号צְבָאוֹת的理解
  choice: 译为“万军之耶和华”
  alternative: “天军之耶和华”或“万军之主”
  rationale: “万军”保留原词的复数军旅意象及神的统治权；同时不把所统领的军队限定为天军，也不以称号“主”取代专名。
translation_notes:
  register: 采用现代、庄重而易懂的普通话书面语。“施慈爱”“罪孽”“万军之耶和华”保留经文的礼仪性与神学分量；句法尽量贴近希伯来文的赞颂结构，又避免生硬逐词对应。
