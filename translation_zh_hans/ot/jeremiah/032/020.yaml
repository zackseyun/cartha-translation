base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/020.yaml
  text: who set signs and wonders in the land of Egypt[a], and in Israel and among mankind to this day, and made a name for yourself, as it is this day.
translation:
  language: zh_hans
  text: 你曾在埃及地施行神迹奇事，又在以色列和世人中施行，直到今日；你为自己赢得了名声，正如今日所见。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שַׂמְתָּ
  choice: 施行
  rationale: 该动词本义为“放置、设立”，但与“神迹奇事”搭配时表达使这些事发生；现代汉语用“施行”自然准确，也避免生硬的“设置神迹”
- source_word: אֹתוֹת וּמֹפְתִים
  choice: 神迹奇事
  rationale: 这是希伯来语中表示超常作为的固定搭配；“神迹奇事”既符合中文圣经语体，也保留两个并列词的区别。
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: 在埃及地
  rationale: 保留 אֶרֶץ“地、国土”的地理表达，而不简化为单纯的“在埃及”。
- source_word: עַד הַיּוֹם הַזֶּה
  choice: 直到今日
  rationale: 直接对应希伯来语的时间表达，并保留其在原文中的位置及可能涵盖后续并列成分的语义空间。
- source_word: וּבְיִשְׂרָאֵל וּבָאָדָם
  choice: 也在以色列和全人类中
  rationale: ב 在这里表达作为显明的范围；אָדָם 为集合性用法，指整个人类，而非某一个人。
- source_word: וַתַּעֲשֶׂה לְּךָ שֵׁם
  choice: 你为自己赢得了名声
  rationale: 这是“为自己建立名声、声誉”的习语；“赢得了名声”在现代汉语中自然，并保留 לְךָ 的反身意味。
- source_word: כַּיּוֹם הַזֶּה
  choice: 正如今日所见
  rationale: 该短语指向当下可见、仍然成立的结果；“今日所见”比逐字译作“像这日”更清楚，同时保留其现实指向。
theological_decisions:
- issue: אָדָם 的集合性所指
  choice: 全人类
  alternative: 世人／人间
  rationale: 此处 אָדָם 泛指人类整体，不宜译成单数“人”；“全人类”明确表达集合意义，也不加入性别限定。
- issue: “直到今日”的修饰范围
  choice: 依原文次序置于“埃及地”之后，并以“也……如此”衔接后续范围
  alternative: 移至“全人类中”之后，使其明确统摄全部地点和群体
  rationale: 原文位置允许其首先承接埃及，也可能在语义上延伸至以色列和人类；译文不将其范围完全锁定，以保留这种句法张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“神迹奇事”保留传统且易懂的经文搭配；“正如今日所见”使末尾希伯来习语在中文中自然清晰。
