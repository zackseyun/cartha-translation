- from: 你曾在埃及地施行神迹奇事，直到今日，也在以色列和全人类中[a]如此；你为自己赢得了名声，正如今日所见。
  to: 你曾在埃及地施行神迹奇事，又在以色列和世人中施行，直到今日；你为自己赢得了名声，正如今日所见。
  rationale: 修订明确“施行神迹奇事”延续到“以色列和世人中”，并以“直到今日”自然涵盖这些并列范围。末句保留“为自己赢得了名声”的习语意义及“正如今日所见”的当下印证。
