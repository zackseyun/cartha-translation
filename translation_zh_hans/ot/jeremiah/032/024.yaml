  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: הִנֵּ֣ה הַ/סֹּלְל֗וֹת בָּ֣אוּ הָ/עִיר֮ לְ/לָכְדָ/הּ֒ וְ/הָ/עִ֣יר נִתְּנָ֗ה בְּ/יַ֤ד הַ/כַּשְׂדִּים֙ הַ/נִּלְחָמִ֣ים עָלֶ֔י/הָ מִ/פְּנֵ֛י הַ/חֶ֥רֶב וְ/הָ/רָעָ֖ב וְ/הַ/דָּ֑בֶר וַ/אֲשֶׁ֥ר דִּבַּ֛רְתָּ הָיָ֖ה וְ/הִנְּ/ךָ֥ רֹאֶֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/024.yaml
  text: Look[a], the siege ramps have come up against the city to capture it, and the city has been given into the hand of the Chaldeans who are fighting against it, because of the sword and the famine and the plague. What you spoke has happened, and look[c][b], you see it.
translation:
  language: zh_hans
  text: 看哪，攻城土垒已经逼近这城，要攻取它；这城因刀剑、饥荒和瘟疫，已经交在与它争战的迦勒底人[a]手中。你所说的已经实现；看哪，你亲眼看见。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “迦勒底人”在这里指巴比伦人，即新巴比伦帝国的军队。
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה / וְהִנְּךָ
  choice: 看哪
  rationale: 保留希伯来文两处指示语的鲜明呼唤和现场感；现代中文仍能自然理解，且适合庄重经文语体。
- source_word: הַסֹּלְלוֹת
  choice: 攻城土垒
  rationale: 指围城时堆筑、用来逼近并攻打城墙的土木工事；“攻城土垒”比单说“土堆”更明确。
- source_word: בָּאוּ הָעִיר
  choice: 已经推进到城前
  rationale: 结合主语“攻城土垒”和目的“不定式‘要攻取它’”，表达攻城工事已延伸、逼近城墙，而不机械译为“来到城”。
- source_word: לְלָכְדָהּ
  choice: 要攻取这城
  rationale: לכד在攻城语境中指夺取、攻占；“攻取”兼具军事语境和庄重感。
- source_word: נִתְּנָה בְּיַד
  choice: 已被交在……手中
  rationale: 保留希伯来语“交在手中”的支配权意象，同时中文清楚可懂。
- source_word: הַכַּשְׂדִּים
  choice: 迦勒底人
  rationale: 直接保留原文族名；其在此指新巴比伦势力，不在正文中以解释性名称取代。
- source_word: הַנִּלְחָמִים עָלֶיהָ
  choice: 与它争战的
  rationale: 反映分词所表达的持续作战状态，并保留原文较宽泛的“争战”含义。
- source_word: מִפְּנֵי הַחֶרֶב וְהָרָעָב וְהַדָּבֶר
  choice: 因刀剑、饥荒和瘟疫
  rationale: מִפְּנֵי在此说明城市落入敌手的原因；三项灾祸按原文次序保留。“瘟疫”准确且为现代中文常用词。
- source_word: וַאֲשֶׁר דִּבַּרְתָּ הָיָה
  choice: 你所说的已经实现
  rationale: היה在此表示先前宣告之事已成为现实；“实现”自然表达话语应验，但不额外加入神学解释。
- source_word: וְהִנְּךָ רֹאֶה
  choice: 看哪，你也亲眼看见了
  rationale: 保留第二个הנה的强调，并以“亲眼”自然呈现对直接目睹的强调；“也”衔接前句所述事实。
theological_decisions:
- issue: 神所说之话与当前灾难之间的应验关系
  choice: 你所说的已经实现
  alternative: 你所说的已经发生了
  rationale: 译文明确保留先前神谕在现实中成就的含义，但不进一步解释灾难的神学机制或责任关系。
- issue: 城市被交付与刀剑、饥荒、瘟疫的因果关系
  choice: 这城也因刀剑、饥荒和瘟疫，已被交在……手中
  alternative: 这城已交在……手中，面临刀剑、饥荒和瘟疫
  rationale: 原文מִפְּנֵי最自然地说明城市陷落的原因或促成因素；保留因果关系，不将三灾仅处理为并列处境。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“攻城土垒”提供必要的历史军事清晰度；保留“交在……手中”和两次“看哪”，以呈现希伯来文的意象、节奏和现场感。正文中的脚注标记[a]与脚注相对应。
