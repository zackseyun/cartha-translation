  text: וְ/אַתָּ֞ה אָמַ֤רְתָּ אֵלַ/י֙ אֲדֹנָ֣/י יְהוִ֔ה קְנֵֽה לְ/ךָ֧ הַ/שָּׂדֶ֛ה בַּ/כֶּ֖סֶף וְ/הָעֵ֣ד עֵדִ֑ים וְ/הָ/עִ֥יר נִתְּנָ֖ה בְּ/יַ֥ד הַ/כַּשְׂדִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/025.yaml
  text: Yet you yourself said to me[a], Lord Yahweh[b], ‘Buy the field for yourself with silver and call witnesses,’ though the city has been given into the hand of the Chaldeans.
translation:
  language: zh_hans
  text: 可是，主耶和华啊，你却对我说：“你要用银子为自己买下那块田，并请证人作证。”而[a]这城已经交在迦勒底人手中了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “而这城……”也可译作“但这城……”或“这时，这城……”。希伯来语连接词本身可单纯表示“而／并且”；上下文显示买田的命令与城池已落入敌手的现实之间存在反差。
    reason: alternative_reading
lexical_decisions:
- source_word: וְאַתָּה
  choice: 可是……你却
  rationale: 连接词与独立代词共同形成强调和转折；在耶利米的祷告中，这一表达突出上帝命令与当前局势之间的张力。
- source_word: אֲדֹנָי יְהוִה
  choice: 主耶和华
  rationale: 分别体现 אֲדֹנָי 的尊称“主”和四字神名 יהוה；采用现代中文圣经语体中易于辨认的表达。
- source_word: קְנֵה לְךָ הַשָּׂדֶה
  choice: 为自己买下那块田
  rationale: “买下”自然表达 קנה 的交易含义，“为自己”保留 לְךָ 所强调的本人购置。
- source_word: בַּכֶּסֶף
  choice: 用银子
  rationale: 保留 כֶּסֶף 的具体字面意象，同时在中文中可自然表示以银钱支付。
- source_word: וְהָעֵד עֵדִים
  choice: 并请证人作证
  rationale: 使役式动词与“证人”连用，意为正式请来或确立证人；此译法清楚传达法律程序。
- source_word: וְהָעִיר נִתְּנָה
  choice: 但这城已经交在
  rationale: 首个连接词按上下文译为让步转折“但”；被动完成式译为“已经交在”，表现当前已成定局的军事现实。
- source_word: בְּיַד הַכַּשְׂדִּים
  choice: 迦勒底人手中
  rationale: 保留“在……手中”这一希伯来语权势隐喻，也准确保留族群称谓“迦勒底人”。
theological_decisions:
- issue: 复合神圣称号 אֲדֹנָי יְהוִה 的译法
  choice: 主耶和华
  alternative: 主上帝；主雅威
  rationale: “主耶和华”同时区分尊称与专名，避免把神名泛化为普通称号，也符合现代中文读者熟悉的圣经专名形式。
- issue: 末句连接词 וְ 的逻辑关系
  choice: 正文译为“但”，脚注保留“而／这时”的可能
  alternative: 而这城已经交在迦勒底人手中
  rationale: 上下文显示耶利米在指出买田命令与城池陷落现实之间的强烈反差，但希伯来语连接词本身较宽泛，因此不把让步含义视为唯一语法解释。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。用“可是……却……但”呈现祷告中的惊讶与张力；末尾感叹号反映该句作为申诉高潮的语气。脚注标记均置于正文相关位置。
