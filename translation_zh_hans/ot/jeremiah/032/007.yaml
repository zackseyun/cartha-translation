base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/007.yaml
  text: Look[a], Hanamel son of Shallum, your uncle, is coming to you, saying, ‘Buy my field that is in Anathoth, for the right of redemption to buy it belongs to you.’
translation:
  language: zh_hans
  text: 看哪，沙龙——你叔叔——的儿子哈拿篾正要来见你，对你说：‘你要买下我在亚拿突的那块田，因为赎回权在你[a]，你有权买下它。’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “赎回权”也可译作“依法赎回的权利”或“购回权”。希伯来语所指的是亲属基于家族关系赎回家产的权利。
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: 看哪
  rationale: 保留指示语的即时感和引人注意的作用；“看哪”庄重而仍为现代读者所熟悉。
- source_word: חֲנַמְאֵל
  choice: 哈拿篾
  rationale: 按常见中文圣经人名音译处理。
- source_word: דֹּדְךָ
  choice: 你叔叔
  rationale: 在亲属赎地的语境中，דּוֹד指叔伯一类的男性长辈；此处依上下文译为“叔叔”，不取“所爱的”之义。
- source_word: בָּא אֵלֶיךָ
  choice: 正到你这里来
  rationale: 分词形式生动呈现即将发生或正在趋近的事件，“正到……来”保留这种临近感。
- source_word: קְנֵה לְךָ
  choice: 你要买下
  rationale: 准确表达命令式，并以自然汉语体现为自己购置该田的意思。
- source_word: שָׂדִי
  choice: 我的那块田
  rationale: שָׂדֶה具体指田地；量词“块”符合现代汉语土地表达。
- source_word: בַּעֲנָתוֹת
  choice: 在亚拿突
  rationale: 地名采用通行中文圣经音译。
- source_word: מִשְׁפַּט הַגְּאֻלָּה
  choice: 赎回……的权利
  rationale: 该短语指基于亲属关系、受法律认可的家产赎回权；译文保留“赎回”概念和法律性质。
- source_word: לִקְנוֹת
  choice: 并买下它
  rationale: 不定式与赎回权相连，说明实际购买该田；补出承前的宾语“它”，使中文清楚顺畅。
- source_word: כִּי לְךָ
  choice: 因为你有
  rationale: 自然表达该权利归耶利米所有，并清楚引出买田的理由。
theological_decisions:
- issue: גְּאֻלָּה在土地律法语境中的性质
  choice: 按亲属依法赎回家族土地的权利来翻译，不作属灵化处理
  alternative: 译作“购回权”或泛称“赎回”
  rationale: 本节所述是亲属土地交易；“赎回并买下它的权利”既保留希伯来语的救赎/赎回用词，也让现代读者看出其具体法律含义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。直接引语保持口语自然度；“看哪”保留原文的突显作用。人名、地名采用通行音译。
