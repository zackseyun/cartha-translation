  text: וְ/נִקְנָ֥ה הַ/שָּׂדֶ֖ה בָּ/אָ֣רֶץ הַ/זֹּ֑את אֲשֶׁ֣ר אַתֶּ֣ם אֹמְרִ֗ים שְׁמָמָ֥ה הִיא֙ מֵ/אֵ֤ין אָדָם֙ וּ/בְהֵמָ֔ה נִתְּנָ֖ה בְּ/יַ֥ד הַ/כַּשְׂדִּֽים׀׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/043.yaml
  text: Fields will be bought in this land of which you say[a], ‘It is a desolation, without man or beast[b]; it has been given into the hand of the Chaldeans.’
translation:
  language: zh_hans
  text: 在这片土地上，田地必会有人购买。你们论到这地说：‘这地荒凉，无人也无牲畜；这地已被交在迦勒底人[a]手中。’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “迦勒底人”在这里指巴比伦人。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנִקְנָה
  choice: 必有人买卖
  rationale: 尼法勒式在此表达被动意义及将来的确定性。现代汉语用“必有人买卖”自然表达土地将被购置，也与下文恢复产业交易的语境相符；不增添原文没有明说的“再次”。
- source_word: הַשָּׂדֶה
  choice: 田地
  rationale: 原文虽为带冠词的单数，但可作集合意义；汉语“田地”本身可涵盖一块或多块地产，无须强行标明单复数。
- source_word: בָּאָרֶץ הַזֹּאת
  choice: 在这片土地上
  rationale: “土地”既自然，又保留本段的地域与产业双重语境。
- source_word: אֲשֶׁר אַתֶּם אֹמְרִים
  choice: 你们论到这地说
  rationale: 明确关系从句所指的是这片土地，并以自然庄重的现代汉语引出引语。
- source_word: שְׁמָמָה
  choice: 荒凉
  rationale: 该名词表示荒废、毁坏的状态；汉语谓语“荒凉”简洁自然，不必机械保留名词形式。
- source_word: מֵאֵין אָדָם וּבְהֵמָה
  choice: 无人也无牲畜
  rationale: 准确传达没有人和家畜的固定表达；“人”在此泛指居民，“牲畜”较“兽”更符合 בהמה 在土地荒废语境中的通常所指。
- source_word: נִתְּנָה
  choice: 已被交在
  rationale: 完成式被动强调土地已经落入敌方控制之下，并有持续到当前的结果。
- source_word: בְּיַד
  choice: 手中
  rationale: 保留希伯来语“在……手中”的权柄隐喻，在汉语中同样自然可懂。
- source_word: הַכַּשְׂדִּים
  choice: 迦勒底人
  rationale: 保留原文的历史族群称谓，而不直接解释为“巴比伦人”；以脚注提供通俗对应。
theological_decisions:
- issue: אָדָם 在无人无牲畜公式中的表达
  choice: 人
  alternative: 居民／人类
  rationale: 此处泛指土地上的人口，不强调性别；现代汉语“人”既忠实又自然，并保留人与牲畜的对举。
- issue: 恢复交易是否明说“再次”
  choice: 不增添“再次”
  alternative: 田地必再次有人买卖
  rationale: 恢复的含义可由上下文推知，但本节动词本身没有“再次”这一词义，因此正文不将语境推论写成明说内容。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“必有人买卖”兼顾原文被动式与汉语土地交易的惯用表达；引语保留土地荒废与落入敌手之间的张力。
