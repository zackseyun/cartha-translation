  text: וּ/בָבֶ֞ל יוֹלִ֤ךְ אֶת צִדְקִיָּ֨הוּ֙ וְ/שָׁ֣ם יִֽהְיֶ֔ה עַד פָּקְדִ֥/י אֹת֖/וֹ נְאֻם יְהוָ֑ה כִּ֧י תִֽלָּחֲמ֛וּ אֶת הַ/כַּשְׂדִּ֖ים לֹ֥א תַצְלִֽיחוּ־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/005.yaml
  text: And he will take Zedekiah to Babylon, and there he will remain until I attend to him, declares the LORD. Though you fight against the Chaldeans, you will not succeed.
translation:
  language: zh_hans
  text: 巴比伦必把西底家带到巴比伦；他要留在那里，直到我过问他[a]。这是耶和华的宣告。即使你们与迦勒底人交战，也不能得胜[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “过问他”也可译作“眷顾他”或“处置他”；原文没有明说结果是恩待还是惩治。
    reason: 说明פָּקַד的语义范围，并保留原文未明示行动结果的张力。
  - marker: b
    text: “得胜”直译为“成功”或“顺利”。
    reason: 交代תַצְלִיחוּ在军事语境中的译法。
lexical_decisions:
- source_word: פָּקְדִי אֹתוֹ
  choice: 我过问他的事
  rationale: פּקד语义宽广，可指眷顾、察看或处置；此处不明说结果是恩待还是惩治，因此用“过问他的事”保留原文的开放性。
- source_word: תַצְלִיחוּ
  choice: 得胜
  rationale: 该动词基本义为成功、顺利；在交战语境中，“得胜”自然表达不会取得成功的含义。
- source_word: הַכַּשְׂדִּים
  choice: 迦勒底人
  rationale: 采用现代中文圣经与历史叙述中通行的族名译法。
- source_word: נְאֻם יְהוָה
  choice: 这是耶和华说的
  rationale: 以庄重而自然的现代汉语表达先知宣告公式，同时保留神名。
theological_decisions:
- issue: פּקד在此处所指行动的性质
  choice: 不限定为恩待或惩罚，译作“过问他的事”
  alternative: 眷顾他／处置他
  rationale: 原文没有明确说明上帝临到西底家是施恩还是施行审判，译文不应消除这种张力。
- issue: כִּי引导末句的逻辑关系
  choice: 即使
  alternative: 如果／因为／当……时
  rationale: 结合上下文，末句表达让步性警告：无论他们与迦勒底人交战，仍不会成功；“即使”符合该语境，也与审校后的咨询文本一致。
translation_notes:
  register: 采用庄重、清晰的现代标准普通话。“他必把西底家带到巴比伦”保留原文第三人称主语；“西底家要留在那里”用姓名复指，避免连续代词在中文中造成指代含混。
