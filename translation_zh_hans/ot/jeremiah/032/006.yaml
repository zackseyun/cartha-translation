source:
  edition: WLC
  text: וַ/יֹּ֖אמֶר יִרְמְיָ֑הוּ הָיָ֥ה דְּבַר יְהוָ֖ה אֵלַ֥/י לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/006.yaml
  text: And Jeremiah said[a], "The word of Yahweh came to me, saying,"
translation:
  language: zh_hans
  text: 耶利米说：“雅威[a]的话临到我，说：”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文为“YHWH”；传统译作“耶和华”。
    reason: 说明神名的原文形式及传统译法。
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: 该形式承接并推进叙事；现代汉语无需机械译出连接词，也能自然表达叙事顺序。
- source_word: יִרְמְיָהוּ
  choice: 耶利米
  rationale: 采用现代中文圣经传统中通行的人名音译。
- source_word: הָיָה דְבַר יְהוָה אֵלַי
  choice: 雅威的话临到我
  rationale: 这是先知文献中惯用的启示公式。“临到我”既符合现代庄重汉语，也准确表达神的话传给先知之意，同时保留 דְבַר 的“话”。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以常见的现代汉语音译呈现四字神名，而不是用头衔替代；脚注说明其希伯来文形式和传统译法。
- source_word: לֵאמֹר
  choice: 说
  rationale: 保留引出下一节直接话语的功能，也呈现原文中与前一个“说”相呼应的表达。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文使用神的专名，而非表示“主”的头衔；正文采用音译“雅威”，以保留专名性质，并在脚注中交代传统译法。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。保留先知启示公式“……的话临到我”和句末引出后文的“说”，不消除原文两个“说”所形成的结构。脚注标记置于其实际说明的神名“雅威”之后。
