lexical_decisions:
- source_word: וָאֲצַוֶּה
  choice: 我又……嘱咐
  rationale: צוה可表示“命令、吩咐、嘱咐”。本处是公开、郑重地交代巴录办理后续事项；“嘱咐”既保留郑重指示的语气，也符合现代汉语。句首ו在叙事中承接上文，译为“又”。
- source_word: אֶת
  choice: 不另译
  rationale: 直接宾语标记，表明“巴录”是动词的宾语，汉语无需对应词。
- source_word: בָּרוּךְ
  choice: 巴录
  rationale: 按现代中文圣经人名的通行译法处理。
- source_word: לְעֵינֵיהֶם
  choice: 当着他们的面
  rationale: 希伯来语字面为“在他们眼前”，在本段法律交易的语境中强调众人亲眼见证、公开进行；“当着他们的面”自然保留这一含义。
- source_word: לֵאמֹר
  choice: 说
  rationale: 用于引出后面的直接引语；现代汉语以“说”自然承接。
