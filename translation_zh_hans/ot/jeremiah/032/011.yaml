  text: Then I took the deed of purchase[a], the sealed copy, containing the terms and conditions[b], and the open copy.
translation:
  language: zh_hans
  text: 于是我取了那份购契：封缄的副本，载有条款和规定[a]；以及未封缄的副本[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “条款和规定”直译可作“命令和律例”；在购契的语境中，很可能指文书所载的约定和规定。原文的句法也可理解为把“命令和律例”与“封缄的”和“未封缄的”文书并列。
    reason: lexical_alternative
  - marker: b
    text: “未封缄的”直译为“敞开的”或“未遮盖的”；指与封缄副本相对、可供查阅的那一份。
    reason: cultural_note
lexical_decisions:
- source_word: וָאֶקַּח
  choice: 于是，我取了
  rationale: 连续式动词推进叙事；“于是”自然表达先后关系，“取了”保留动作本身。
- source_word: סֵפֶר הַמִּקְנָה
  choice: 购契
  rationale: סֵפֶר在此指正式文书，מִקְנָה指购买或取得；“购契”简洁表达土地交易中的购买契约。
- source_word: הֶחָתוּם
  choice: 那份盖了印……的契约
  rationale: 该被动分词意为“盖印的”；补出“契约”使中文完整，并与后面的公开契约形成对照。
- source_word: הַמִּצְוָה וְהַחֻקִּים
  choice: 条款和规定
  rationale: 这两个词通常可译为“命令”和“律例”，但在购契语境中指文书所载的约定与法定规定；译法保留法律文书色彩而不使用现代固定套语“条款和条件”。
- source_word: הַגָּלוּי
  choice: 那份公开的契约
  rationale: 该词本义为显露、未遮盖，与盖印的文书相对；“公开的”保留原文表象，也可涵盖未封、可供查阅之意。
