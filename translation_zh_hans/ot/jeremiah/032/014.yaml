    rationale: 该词在本节与 הֶחָתוּם（封缄的）相对，所指是敞开／未封缄的交易文书，不是“公开发布”或“可公开阅览”的文书。
  - severity: low
    issue: 脚注 b 仍以“公开的文书”为基准，可能保留正文歧义
    rationale: 应使正文和脚注一致地呈现封缄与未封缄的对照。
