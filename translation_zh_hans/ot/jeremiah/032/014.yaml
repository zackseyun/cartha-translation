  text: כֹּֽה אָמַר֩ יְהוָ֨ה צְבָא֜וֹת אֱלֹהֵ֣י יִשְׂרָאֵ֗ל לָק֣וֹחַ אֶת הַ/סְּפָרִ֣ים הָ/אֵ֡לֶּה אֵ֣ת סֵפֶר֩ הַ/מִּקְנָ֨ה הַ/זֶּ֜ה וְ/אֵ֣ת הֶ/חָת֗וּם וְ/אֵ֨ת סֵ֤פֶר הַ/גָּלוּי֙ הַ/זֶּ֔ה וּ/נְתַתָּ֖/ם בִּ/כְלִי חָ֑רֶשׂ לְמַ֥עַן יַעַמְד֖וּ יָמִ֥ים רַבִּֽים־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/014.yaml
  text: 'Thus says Yahweh of hosts[a], the God of Israel: Take these documents, this deed of purchase, both the sealed copy and this open copy, and put them in an earthenware vessel[b], so that they may last for many days.'
translation:
  language: zh_hans
  text: 万军之雅威、以色列的神如此说：“你要拿这些文书[a]，就是这份买契——封缄的那份和这份敞开的文书[b]——把它们放在陶器中，好使它们可以保存许多年。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“这些书卷”。这里的希伯来词可泛指书写材料；在本段语境中，它们是土地交易的法律文书。
    reason: lexical_alternative
  - marker: b
    text: 或译“这份未封缄的文书”。原文将它与封缄的那份相对。
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה צְבָאוֹת
  choice: 万军之雅威
  rationale: 以“雅威”音译立约之名，以“万军”表达 צְבָאוֹת 所指受其统领的天上和地上众军；保留传统称号的庄重感。
- source_word: לָקוֹחַ
  choice: 你要拿
  rationale: 此不定式在上下文中具有命令作用；“你要拿”自然体现指令语气。
- source_word: הַסְּפָרִים הָאֵלֶּה
  choice: 这些文书
  rationale: סְפָרִים 可泛指书写材料或文件；本节涉及土地交易，以“文书”既符合司法语境，又不将其过度限定为某一种契据。
- source_word: סֵפֶר הַמִּקְנָה
  choice: 这份买契
  rationale: 该词组指土地买卖的法律凭据；“买契”简洁、明确，也符合中文契约语境。
- source_word: הֶחָתוּם
  choice: 封缄的那份
  rationale: 希伯来文以形容词名词化，回指买契或文书；“那份”不额外断定它必为现代意义上的副本。
- source_word: סֵפֶר הַגָּלוּי
  choice: 这份公开的文书
  rationale: גָּלוּי 与封缄者相对，表示敞开、未封的文件；正文保留“公开”这一较贴近字面的表达，并以脚注说明“未封缄”的可能译法。
- source_word: בִּכְלִי חָרֶשׂ
  choice: 放在陶器中
  rationale: 指放入陶土制成的容器；“陶器”保留材质信息，同时避免将器形具体化为罐或瓮。
- source_word: לְמַעַן יַעַמְדוּ יָמִים רַבִּים
  choice: 好使它们可以保存许多年
  rationale: יַעַמְדוּ 在此表达长久存留而非字面站立；“保存许多年”自然呈现文书长期留存的目的。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；采用较贴近希伯来语发音的“雅威”，保留其作为专名的性质，不以头衔代替。
- issue: 称号 יְהוָה צְבָאוֹת 的含义
  choice: 万军之雅威
  alternative: 众军之雅威
  rationale: “万军”是中文中庄重而易懂的固定表达，可涵盖雅威对天上和地上众军的统领，又不把所指仅限于人间军队。
translation_notes:
  register: 采用现代、庄重而清楚的普通话。“买契”体现古代土地交易的法律性质；“封缄的那份”和“公开的文书”保留原文的不完全对称结构及两份文书之间的对照，不擅自统一为“正本／副本”。
