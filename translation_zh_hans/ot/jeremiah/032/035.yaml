source:
  edition: WLC
  text: וַ/יִּבְנוּ֩ אֶת בָּמ֨וֹת הַ/בַּ֜עַל אֲשֶׁ֣ר בְּ/גֵ֣יא בֶן הִנֹּ֗ם לְ֠/הַעֲבִיר אֶת בְּנֵי/הֶ֣ם וְ/אֶת בְּנוֹתֵי/הֶם֮ לַ/מֹּלֶךְ֒ אֲשֶׁ֣ר לֹֽא צִוִּיתִ֗י/ם וְ/לֹ֤א עָֽלְתָה֙ עַל לִבִּ֔/י לַ/עֲשׂ֖וֹת הַ/תּוֹעֵבָ֣ה הַ/זֹּ֑את לְמַ֖עַן החטי אֶת יְהוּדָֽה־׀־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/035.yaml
  text: They built the high places of Baal that are in the Valley of Ben-hinnom[a], to make their sons and their daughters pass through the fire to Molech—something I had not commanded them, nor had it entered my heart that they should do this abomination[c][b], causing Judah to sin.
translation:
  language: zh_hans
  text: 他们在欣嫩子谷[a]建造了巴力的丘坛，要把自己的儿女献给摩洛[b]。这事我没有吩咐他们；这可憎的事，我心里也从未想过[c]要他们去行，以致使犹大犯罪。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“欣嫩之子的谷”。
    reason: 保留地名原有构词，说明通行地名译法。
  - marker: b
    text: 原文直译“使自己的儿女经过，归给摩洛”。在这种祭祀语境中，这一表达通常指儿童献祭；本节没有明写“火”。
    reason: 说明希伯来习语、其语境含义，以及本节未明确交代的仪式细节。
  - marker: c
    text: 原文直译“这事也未曾上到我心里”。
    reason: 保留希伯来文拟人化表达的字面形式和可能的译法。
lexical_decisions:
- source_word: וַיִּבְנוּ
  choice: 他们……建造了
  rationale: 忠实表达第三人称复数及已发生的行动；句首连接词按现代汉语叙事习惯不另译。
- source_word: בָּמוֹת הַבַּעַל
  choice: 巴力的丘坛
  rationale: “丘坛”是圣经祭祀语境中对 בָּמוֹת 的通行译法，既可指高处，也可指设于其上的敬拜场所；הַבַּעַל 在此作神名“巴力”。
- source_word: בְּגֵיא בֶן־הִנֹּם
  choice: 在欣嫩子谷
  rationale: 采用现代中文圣经地名的自然形式；原文构词直译为“欣嫩之子的谷”，另收入脚注。
- source_word: לְהַעֲבִיר אֶת־בְּנֵיהֶם וְאֶת־בְּנוֹתֵיהֶם
  choice: 使自己的儿女经火献给
  rationale: העביר 的基本意思是“使……经过”；在摩洛崇拜语境中指使儿女经火献祭。正文保留“经火”的意象，并用“献给”说明方向和祭祀性质。
- source_word: לַמֹּלֶךְ
  choice: 给摩洛
  rationale: 此处按相关祭祀语境理解为神名“摩洛”，而非普通名词“王”。
- source_word: וְלֹא עָלְתָה עַל־לִבִּי
  choice: 我心里也从未想过
  rationale: 以自然现代汉语保留“心”这一拟人化表达，同时传达该事完全不合上帝旨意；原文较直译形式收入脚注。
- source_word: הַתּוֹעֵבָה הַזֹּאת
  choice: 这可憎的事
  rationale: 准确表达 תּוֹעֵבָה 在偶像崇拜及道德语境中的强烈否定意味，又比名词化的“可憎之物”更自然。
- source_word: לְמַעַן החטי אֶת־יְהוּדָה
  choice: 以致使犹大陷入罪中
  rationale: 按马所拉旁读所反映的使役形式 הַחֲטִיא，表达“使犹大犯罪”；“以致”保留 לְמַעַן 在此可有的结果意味，避免把目的或结果限定得过死。
theological_decisions:
- issue: 儿女“经过”的祭祀表达
  choice: 译作“使自己的儿女经火献给摩洛”，并加脚注说明原文没有明写“火”
  alternative: 使自己的儿女经过，归给摩洛；把自己的儿女献给摩洛
  rationale: 希伯来文本本节只写“使……经过”，但这一固定祭祀语境涉及经火献儿女。正文需让现代读者理解，同时脚注明示“火”属于语境补足，避免把它误当成本节明文。
- issue: 上帝的拟人化“心”语
  choice: 保留为“我心里也从未想过”
  alternative: 我意念中从未有过；这也从未上到我心上
  rationale: 保留“心”的原文意象和神学张力，同时以自然汉语表达；不将其解释为上帝缺乏预知，而让经文本身强调此举绝非他的命令或旨意。
- issue: לְמַעַן 的目的与结果关系
  choice: 译作“以致使犹大陷入罪中”
  alternative: 为要使犹大犯罪；从而使犹大犯罪
  rationale: 原文形式可表达目的或结果。此处“以致”较自然地呈现结果，并不额外断定百姓主观上以使全犹大犯罪为明确目的。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“儿女”自然涵盖原文“儿子和女儿”；“丘坛”“巴力”“摩洛”“可憎的事”等保持圣经祭祀语域。句法分为两句，以避免希伯来长句在中文中过重，同时维持命令、内心和犯罪结果之间的逻辑联系。
