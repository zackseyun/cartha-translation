  yaml_path: translation/ot/jeremiah/032/016.yaml
  text: After I had given the deed of purchase to Baruch son of Neriah[a], I prayed to Yahweh, saying,
translation:
  language: zh_hans
  text: 我把买契交给尼利亚的儿子巴录以后，就向雅威[a]祷告说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文：YHWH。也可译作“耶和华”。
    reason: alternative_reading
lexical_decisions:
- source_word: וָאֶתְפַּלֵּל
  choice: 我……祷告
  rationale: התפלל在此通常指向上帝祷告；译作“祷告”自然准确，不额外加入恳切或代求的含义。
- source_word: אֶל יְהוָה
  choice: 向耶和华
  rationale: 介词אֶל表示动作所指向的对象；专名יהוה采用现代中文圣经语境中通行且庄重的“耶和华”。
- source_word: אַחֲרֵי תִתִּי
  choice: 我……交给……以后
  rationale: 该时间结构表明交付已经完成，随后才祷告；中文用“以后”清楚呈现先后次序，无须使用类似英语过去完成时的形式。
- source_word: סֵפֶר הַמִּקְנָה
  choice: 买契
  rationale: סֵפֶר指书面文书，הַמִּקְנָה限定其为购买交易的凭据；“买契”简洁保留其法律文书性质，并符合本段土地买卖的语境。
- source_word: אֶל בָּרוּךְ בֶּן נֵרִיָּה
  choice: 交给尼利亚的儿子巴录
  rationale: אֶל在נתן的搭配中标明交付对象；完整保留父子称谓和专名。
- source_word: לֵאמֹר
  choice: 说：
  rationale: 该词引出下一节祷告的内容；中文以“说：”自然连接后续直接引语。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。正文采用现代简体中文圣经读者最熟悉的专名“耶和华”，既不以“主”替代，也不把该名称解释为头衔；“雅威”是依据学界常见拟音的可行译法。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“买契”体现法律文书语境；句式依照希伯来文事件顺序，先交付买契，后向耶和华祷告，并以冒号引出下一节内容。
