source:
  edition: WLC
  text: וְ/צִדְקִיָּ֨הוּ֙ מֶ֣לֶךְ יְהוּדָ֔ה לֹ֥א יִמָּלֵ֖ט מִ/יַּ֣ד הַ/כַּשְׂדִּ֑ים כִּ֣י הִנָּתֹ֤ן יִנָּתֵן֙ בְּ/יַ֣ד מֶֽלֶךְ בָּבֶ֔ל וְ/דִבֶּר פִּ֣י/ו עִם פִּ֔י/ו וְ/עֵינָ֖י/ו אֶת עינ/ו תִּרְאֶֽינָה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/004.yaml
  text: And Zedekiah king of Judah will not escape from the hand of the Chaldeans[a], for he will surely be given into the hand of the king of Babylon, and he will speak mouth to mouth with him[b], and his eyes will see his eyes.
translation:
  language: zh_hans
  text: 犹大王西底家必不能逃脱迦勒底人的手，因为他必被交在巴比伦王手中；他要与巴比伦王当面交谈[a]，亲眼看见他[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“他的口与他的口说话”，意思是二人直接会面交谈。
    reason: 保留希伯来文具体而少见的身体部位表达，并说明其惯用意义。
  - marker: b
    text: 直译：“他的眼睛要看见他的眼睛”，即二人会直接相见。
    reason: 保留原文以“眼睛”表达直接相见的鲜明具体意象，同时帮助读者理解自然含义。
lexical_decisions:
- source_word: יִמָּלֵט
  choice: 逃脱
  rationale: 该词的尼法勒词形在这里表示逃走、脱离控制；“逃脱”符合军事围困和被俘的语境。
- source_word: מִיַּד הַכַּשְׂדִּים
  choice: 逃脱迦勒底人的手
  rationale: 保留“手”的具体意象，表达权势和控制；“迦勒底人”准确保留原文的族群—政治称谓。
- source_word: הִנָּתֹן יִנָּתֵן
  choice: 必被交在
  rationale: 不定式绝对式与限定动词连用，强调事情的确定性；“必被交在”同时保留被动语态和强调意味。
- source_word: בְּיַד מֶלֶךְ בָּבֶל
  choice: 巴比伦王手中
  rationale: 保留与前半句呼应的“手”之意象，并采用现代汉语中自然的“在……手中”。
- source_word: וְדִבֶּר פִּיו עִם פִּיו
  choice: 他要与巴比伦王当面交谈
  rationale: 希伯来文直译为“他的口与他的口说话”，表示双方直接会面交谈；“当面交谈”在现代汉语中自然，并保留直接接触的核心意义。
- source_word: וְעֵינָיו אֶת־עֵינוֹ תִּרְאֶינָה
  choice: 亲眼看见他
  rationale: 原文直译为“他的眼睛要看见他的眼睛”，强调西底家将直接见到巴比伦王；正文用自然汉语表达，脚注保留原文的具体互视意象。
- source_word: צִדְקִיָּהוּ
  choice: 西底家
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: הַכַּשְׂדִּים
  choice: 迦勒底人
  rationale: 原文特指迦勒底人，不笼统改作“巴比伦人”，以保留词汇区别。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“必不能……因为……必……”传达预言的确定语气；分号使后半句关于西底家与巴比伦王直接相见的两个并列动作更清楚。所有代词所指在正文中适度明确，以避免汉语歧义。
