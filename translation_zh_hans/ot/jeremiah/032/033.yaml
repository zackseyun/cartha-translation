base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/033.yaml
  text: They turned their back to me and not their face[a]; though I taught them, rising early and teaching[b], they would not listen to receive correction.
translation:
  language: zh_hans
  text: 他们背向我，不肯面对我；我虽不断早起教导他们，他们却不肯听，也不肯接受管教[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “早起教导”直译为“早起并教导”，是表示持续、殷勤教导的惯用说法。“管教”也可译作“纠正”或“训诲”；原词常含借着责备塑造、使人改正的意思。
    reason: cultural_note; lexical_alternative
lexical_decisions:
- source_word: וַיִּפְנוּ אֵלַי עֹרֶף וְלֹא פָנִים
  choice: 他们向我转过背去，不肯以正面向我
  rationale: 保留“背”与“面”的鲜明对比，并用现代汉语表达百姓对上帝的拒绝；“不肯”也传达上下文中的顽梗意味。
- source_word: וְלַמֵּד אֹתָם הַשְׁכֵּם וְלַמֵּד
  choice: 我虽一次又一次殷勤教导他们
  rationale: “早起教导”是耶利米书中表示持续、勤勉行动的惯用语。正文传达其功能意义，脚注保留原文意象。
- source_word: וְאֵינָם שֹׁמְעִים
  choice: 他们却不肯听
  rationale: 该结构描述持续而有意的拒绝；“不肯听”比单纯“没有听”更准确地表达这一语气。
- source_word: לָקַחַת מוּסָר
  choice: 接受管教
  rationale: מוּסָר可指管教、纠正或训诲，此处带有使人改正的责备意味；“接受管教”简洁自然，同时以脚注说明词义范围。
