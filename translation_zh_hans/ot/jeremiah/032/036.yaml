  text: וְ/עַתָּ֕ה לָ/כֵ֛ן כֹּֽה אָמַ֥ר יְהוָ֖ה אֱלֹהֵ֣י יִשְׂרָאֵ֑ל אֶל הָ/עִ֨יר הַ/זֹּ֜את אֲשֶׁ֣ר אַתֶּ֣ם אֹמְרִ֗ים נִתְּנָה֙ בְּ/יַ֣ד מֶֽלֶךְ בָּבֶ֔ל בַּ/חֶ֖רֶב וּ/בָ/רָעָ֥ב וּ/בַ/דָּֽבֶר־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/036.yaml
  text: 'Now therefore[a], thus says Yahweh, the God of Israel, concerning this city of which you say, ‘It has been given into the hand of the king of Babylon by the sword, by famine[b], and by pestilence’:'
translation:
  language: zh_hans
  text: 现在，因此，耶和华——以色列的上帝——论到这城如此说：你们说，这城已经因刀剑、饥荒和瘟疫[b]交在巴比伦王手中[a]：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“这城正交在巴比伦王手中”。希伯来语形式也可按简单被动式理解。
    reason: lexical_alternative
  - marker: b
    text: “瘟疫”也可译为“灾疫”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה לָכֵן
  choice: 现在，因此
  rationale: 分别保留时间推进和推论关系；虽略带庄重书面色彩，却清楚承接上文并引出下文。
- source_word: כֹּה אָמַר
  choice: 如此说
  rationale: 保留先知宣告的固定使者公式，同时符合现代中文圣经语体。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以中文读者熟悉的专名音译呈现四字神名，不以头衔替代。
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: 以色列的上帝
  rationale: 直接呈现原文属格结构及上帝与以色列的关系。
- source_word: אֶל הָעִיר הַזֹּאת
  choice: 论到这城
  rationale: 此处 אֶל 在言说公式中指宣告所针对的对象或主题；译作“论到”比机械译作“向”更符合语境。
- source_word: אֲשֶׁר אַתֶּם אֹמְרִים
  choice: 你们说
  rationale: 中文可用直接引语自然承接，无须硬译关系从句，同时保留说话主体为复数“你们”。
- source_word: נִתְּנָה
  choice: 已经……交在
  rationale: 尼法勒完成式将城被交付视为已成定局；“已经”保留完成体意味，而上下文中的现实进程仍可由语境体现。
- source_word: בְּיַד מֶלֶךְ בָּבֶל
  choice: 交在巴比伦王手中
  rationale: 保留“在……手中”这一在中文中同样清楚的权柄、控制隐喻。
- source_word: בַּחֶרֶב וּבָרָעָב וּבַדָּבֶר
  choice: 因刀剑、饥荒和瘟疫
  rationale: 保留三重灾祸的具体名词和并列节奏；介词 ב 在此表达城市陷落所凭借或伴随的手段、灾难因素，中文用“因”自然概括。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用以色列上帝的专名。简体中文主流圣经语境中“耶和华”辨识度最高，也明确保留专名性质；不以“主”替换。
- issue: נִתְּנָה 的体貌
  choice: 已经……交在
  alternative: 正被交在
  rationale: 原文是尼法勒完成式，形式上更直接支持把交付看作已经实现或确定无疑；上下文可能包含正在发生的围城进程，但不宜在正文中把完成式单向改成进行体。
- issue: 刀剑、饥荒、瘟疫与交城的关系
  choice: 因刀剑、饥荒和瘟疫
  alternative: 借着刀剑、饥荒和瘟疫
  rationale: 保留这些灾祸作为城市落入巴比伦王手中的手段或原因，不额外解释其神学施动者。
translation_notes:
  register: 采用现代、庄重而可理解的先知书语体。用破折号界定“以色列的上帝”这一同位语，并以分号引出百姓对该城的判断；避免生硬复制希伯来语关系从句。
