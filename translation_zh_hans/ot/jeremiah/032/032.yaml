language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: עַל֩ כָּל רָעַ֨ת בְּנֵֽי יִשְׂרָאֵ֜ל וּ/בְנֵ֣י יְהוּדָ֗ה אֲשֶׁ֤ר עָשׂוּ֙ לְ/הַכְעִסֵ֔/נִי הֵ֤מָּה מַלְכֵי/הֶם֙ שָֽׂרֵי/הֶ֔ם כֹּהֲנֵי/הֶ֖ם וּ/נְבִֽיאֵי/הֶ֑ם וְ/אִ֣ישׁ יְהוּדָ֔ה וְ/יֹשְׁבֵ֖י יְרוּשָׁלִָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/032.yaml
  text: because of all the evil of the sons of Israel and the sons of Judah that they did to provoke me to anger—they[a], their kings, their officials, their priests, and their prophets[c][b], and the men of Judah and the inhabitants of Jerusalem.
translation:
  language: zh_hans
  text: 这是因为以色列人和犹大人[a]为要激怒我所行的一切恶——他们、他们的君王、官长、祭司和先知，以及犹大人[b]和耶路撒冷的居民。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“以色列的众子和犹大的众子”，是指以色列人和犹大人。
    reason: 说明希伯来语民族称谓的字面形式及集合意义。
  - marker: b
    text: 原文“人”是单数，在这里作集合性用法；也可理解为“每一个犹大人”。
    reason: 保留אִישׁ יְהוּדָה在单数形式与集合或分配意义之间的张力。
lexical_decisions:
- source_word: עַל כָּל רָעַת
  choice: 这是因为……所行的一切恶
  rationale: עַל承接上一节，说明审判的原因；中文用“这是因为”清楚保留跨节衔接。רָעָה在此指道德上的恶，“一切恶”也保留כָּל的全面语气。
- source_word: בְּנֵי יִשְׂרָאֵל וּבְנֵי יְהוּדָה
  choice: 以色列人和犹大人
  rationale: בְּנֵי字面为“众子”，在民族称谓中指群体成员；译作“……人”符合现代汉语习惯，同时以脚注保留原文形式。
- source_word: אֲשֶׁר עָשׂוּ
  choice: 所行的
  rationale: 简洁对应关系从句及עשה，并以“行恶”的自然搭配表达其行为含义，不额外加入解释。
- source_word: לְהַכְעִסֵנִי
  choice: 激怒了我
  rationale: כעס的使役式表示使某人发怒；“激怒”自然、凝练地保留使役含义。
- source_word: הֵמָּה
  choice: 他们，包括
  rationale: 独立代词带强调和复指作用，并引出后面的责任群体；“他们，包括……”在中文中清楚呈现这一结构，而不把代词误解为另一个并列群体。
- source_word: מַלְכֵיהֶם שָׂרֵיהֶם כֹּהֲנֵיהֶם וּנְבִיאֵיהֶם
  choice: 他们的君王、官长、祭司和先知
  rationale: 逐项保留政治与宗教领袖的类别；שָׂרִים译作“官长”，兼顾古代职分和庄重经文语体。
- source_word: וְאִישׁ יְהוּדָה
  choice: 以及犹大人
  rationale: אִישׁ虽为单数，在这里具有集合或代表性用法；汉语“犹大人”自然涵盖这一群体，脚注说明原文形式。
- source_word: וְיֹשְׁבֵי יְרוּשָׁלִָם
  choice: 和耶路撒冷的居民
  rationale: 准确表达分词短语所指的常住居民群体，现代汉语清楚自然。
theological_decisions:
- issue: 民族与群体称谓中的阳性形式
  choice: 正文按现代汉语译为“以色列人和犹大人”，并用脚注交代“众子”和单数“人”的原文形式
  alternative: 直译为“以色列的众子、犹大的众子”及“犹大的男人”
  rationale: 希伯来语阳性形式在此承担民族性、集合性或代表性功能；中文若机械直译会误导为只指儿子或男性。正文传达实际指称，脚注则保留形式信息，不据此引入额外的性别或教义判断。
- issue: לְהַכְעִיס所表达的上帝之怒
  choice: 译作“激怒了我”
  alternative: 译作“使我发怒”
  rationale: 两者都承认原文明确表达人的恶行引发上帝的怒气；“激怒”更凝练，脚注保留较形式对应的说法，不弱化其中的神学张力。
- issue: הֵמָּה与后列群体的关系
  choice: 理解为强调性复指，并以“他们，包括……”引出具体责任群体
  alternative: 将“他们自己”视为与君王、官长等完全分开的首个并列项目
  rationale: 独立代词在句法上回指先行群体，后面的名词列举其组成或责任范围；译文保留强调而避免制造原文未必具有的额外类别。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“这是因为”明确本节与上一节的因果衔接；分号和破折号帮助读者辨认长句中的原因、行为与责任群体。正文避免生硬的“众子”直译，但通过脚注保留源语信息。
