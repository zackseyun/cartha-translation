  text: וָ/אֶתֵּ֞ן אֶת הַ/סֵּ֣פֶר הַ/מִּקְנָ֗ה אֶל בָּר֣וּךְ בֶּן נֵרִיָּה֮ בֶּן מַחְסֵיָה֒ לְ/עֵינֵי֙ חֲנַמְאֵ֣ל דֹּדִ֔/י וּ/לְ/עֵינֵי֙ הָֽ/עֵדִ֔ים הַ/כֹּתְבִ֖ים בְּ/סֵ֣פֶר הַ/מִּקְנָ֑ה לְ/עֵינֵי֙ כָּל הַ/יְּהוּדִ֔ים הַ/יֹּשְׁבִ֖ים בַּ/חֲצַ֥ר הַ/מַּטָּרָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/012.yaml
  text: Then I gave the deed of purchase to Baruch son of Neriah[a], son of Mahseiah, in the sight of Hanamel my uncle, and in the sight of the witnesses who had written in the deed of purchase[e][d][c][b], in the sight of all the Judeans who were sitting in the court of the guard.
translation:
  language: zh_hans
  text: 于是，我把购买契约交给尼利亚的儿子、玛西雅的孙子巴录，当着我叔叔哈拿篾[a]的面，当着那些在购买契约上书写的见证人[b]的面，也当着所有坐在护卫院[c]里的犹大人[d]的面。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节希伯来文直译为“我叔叔哈拿篾”；但本章其他经文称哈拿篾为耶利米叔叔的儿子，即他的堂兄弟。
    reason: cross_reference
  - marker: b
    text: 或译：“那些在购买契约上书写的见证人”；在交易文书的语境中，也可能指在契约上签名。
    reason: lexical_alternative
  - marker: c
    text: 或译：“护卫庭院”；也可能理解为“监牢院”。
    reason: lexical_alternative
  - marker: d
    text: 或译：“犹太人”；“犹大人”强调当时犹大国的历史背景。
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶתֵּן
  choice: 于是，我把……交给
  rationale: 叙事性连续式推动事件发展；“于是”自然表达先后关系，“交给”准确呈现 נתן 与受事介词 אֶל。
- source_word: סֵפֶר הַמִּקְנָה
  choice: 购地契
  rationale: סֵפֶר 在此指法律文书，מִקְנָה 指购买所得；上下文是土地交易，因此“购地契”简洁、明确并符合现代汉语法律语境。
- source_word: בָּרוּךְ בֶּן נֵרִיָּה בֶּן מַחְסֵיָה
  choice: 尼利亚的儿子、玛西雅的孙子巴录
  rationale: 按希伯来文保留父系谱系，同时用现代汉语自然说明两代关系。
- source_word: לְעֵינֵי
  choice: 当着……的面
  rationale: 原义为“在……眼前”；此处是公开见证交易的法律性套语。译文保留三次重复，以呈现原文的郑重和公开性质。
- source_word: חֲנַמְאֵל דֹּדִי
  choice: 我叔叔哈拿篾
  rationale: דּוֹדִי 的直接词义是“我的叔叔”；本章其他经文所呈现的亲属关系张力交由脚注说明，不在正文中擅自消解。
- source_word: הָעֵדִים הַכֹּתְבִים בְּסֵפֶר הַמִּקְנָה
  choice: 那些在购地契上写名的见证人
  rationale: הַכֹּתְבִים 是“写”的分词。“写名”既贴近字面，也能在交易文书语境中表达见证人的书面确认，而不完全收窄为现代意义的签名。
- source_word: כָּל הַיְּהוּדִים
  choice: 所有……犹大人
  rationale: 在耶利米时代的历史语境中，יְהוּדִים 首先指犹大国的人；“犹大人”比后期较广义的“犹太人”更具历史针对性。
- source_word: הַיֹּשְׁבִים
  choice: 坐在……里的
  rationale: ישׁב 的分词在此直接描述当时在场坐着的人；采用具体直译。
- source_word: חֲצַר הַמַּטָּרָה
  choice: 护卫院
  rationale: חָצֵר 指院落，מַטָּרָה 在本章指设有看守、耶利米被拘禁的区域；“护卫院”简洁并贴合历史场景。
theological_decisions:
- issue: 哈拿篾与耶利米的亲属关系
  choice: 正文按本节直接措辞译作“我叔叔哈拿篾”
  alternative: “我的堂兄弟哈拿篾”或“我的亲属哈拿篾”
  rationale: 本节的 דֹּדִי 通常意为“我的叔叔”，但本章其他经文称哈拿篾为耶利米叔叔的儿子。保留正文直译并以脚注指出张力，避免用协调性译法覆盖原文现象。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“当着……的面”重复三次，保留希伯来文法律叙述的公开见证色彩；人名按通行圣经译名处理。
