  text: כִּ֣י כֹ֥ה אָמַ֛ר יְהוָ֥ה צְבָא֖וֹת אֱלֹהֵ֣י יִשְׂרָאֵ֑ל ע֣וֹד יִקָּנ֥וּ בָתִּ֛ים וְ/שָׂד֥וֹת וּ/כְרָמִ֖ים בָּ/אָ֥רֶץ הַ/זֹּֽאת׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/015.yaml
  text: 'For thus says Yahweh of hosts[a], the God of Israel: Houses and fields and vineyards will again be bought in this land.'
translation:
  language: zh_hans
  text: 因为万军之耶和华、以色列的上帝如此说：房屋、田地和葡萄园必再次在这片土地上被买下。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“人必再次在这片土地上购买房屋、田地和葡萄园。”原文动词为尼法勒形态，通常可理解为被动；也可较宽泛地理解为有人再次购买。
    reason: 保留יִקָּנוּ可能的中间态或泛指主动理解，同时正文优先反映其被动形式。
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，说明耶利米购地这一象征行动的理由；现代汉语用“因为”自然清楚。
- source_word: כֹה אָמַר
  choice: 如此说
  rationale: 保留先知信息中惯用的使者宣告格式，同时符合庄重的现代汉语。
- source_word: יְהוָה צְבָאוֹת
  choice: 万军之耶和华
  rationale: “耶和华”保留神的专名在中文圣经中的通行形式；“万军之”表达其统辖众军的称号，并避免将所指范围限于人间军队。
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: 以色列的上帝
  rationale: 直接表达原文的属格结构和盟约身份，现代读者也容易理解。
- source_word: עוֹד
  choice: 再次
  rationale: 语境是灾后恢复，表示中断之后重新发生。
- source_word: יִקָּנוּ
  choice: 人必再次买卖
  rationale: 该词为尼法勒形态，可作被动，也可有中间态或泛指主动意味。“人必买卖”在汉语中自然呈现不定主体，并突出正常地产交易恢复；脚注保留较严格的被动理解。
- source_word: בָתִּים וְשָׂדוֹת וּכְרָמִים
  choice: 房屋、田地和葡萄园
  rationale: 逐项保留三类产业，措辞自然且适合地产交易语境。
- source_word: בָּאָרֶץ הַזֹּאת
  choice: 在这片土地上
  rationale: “土地”既符合具体地产语境，也保留耶利米书中应许之地的意味；量词“片”使现代汉语更自然。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 采用现代简体中文圣经读者最熟悉的专名形式，不以“主”这一称号替代神名；同时不对其古代发音作超出文本证据的断定。
- issue: יִקָּנוּ（尼法勒）的语态
  choice: 以泛指主体译作“人必再次买卖”
  alternative: “房屋、田地和葡萄园必再次被买下”
  rationale: 尼法勒在此可按被动理解，也可能带中间态或泛指交易活动的意味。正文采用自然汉语表达地产交易恢复，脚注明确保留形态上更严格的被动译法，避免消除原文歧义。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“万军之耶和华”保留传统先知宣告的语体；正文以“人必再次买卖”避免生硬的汉语被动句，并用脚注呈现较形式对应的译法。
