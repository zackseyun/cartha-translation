base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/010/019.yaml
  text: Woe is me because of my brokenness[a]; my wound is grievous. But I said, “Surely this is my sickness[c][b], and I must bear it.”
translation:
  language: zh_hans
  text: 我有祸了！我因所受的创伤而痛苦；我的伤口很严重。[a]但我说：“这确是我的病痛，我必须承受。”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “创伤”也可译作“破碎”或“毁坏”；“伤口很严重”也可译作“伤口病重”。原文没有明确说“无法医治”。
    reason: lexical_alternative
  - marker: b
    text: “我必须承受”也可译作“我会承受”。原文既可表达无奈接受，也可理解为简单的将来行动。
    reason: lexical_alternative
lexical_decisions:
- source_word: א֥וֹי לִי
  choice: 我有祸了
  rationale: 保留哀歌中强烈的悲叹语气；相比单纯“唉”，更明确传达灾祸临身。
- source_word: עַל שִׁבְרִי
  choice: 因我遭受破碎
  rationale: שֶׁבֶר可指断裂、损伤或毁灭；“遭受破碎”保留身体受创与更广泛毁坏之间的意象张力，עַל按语境译为原因。
- source_word: נַחְלָה מַכָּתִי
  choice: 我的伤势沉重
  rationale: נַחְלָה是חלה的阴性单数尼法勒形，与מַכָּתִי呼应，可表达病弱、严重；“伤势沉重”自然地呈现严重性，却不把含义限定为“无法医治”。
- source_word: מַכָּתִי
  choice: 我的伤势
  rationale: מַכָּה可指击打、创伤或灾害；此处医疗意象明显，“伤势”也便于与谓语“沉重”自然搭配。
- source_word: אַךְ
  choice: 确
  rationale: 在此引出说话者带有认定或无奈意味的判断；“确”简洁保留强调语气。
- source_word: חֳלִי
  choice: 我的病痛
  rationale: חֳלִי本指疾病，也可比喻苦难；“病痛”既延续医疗意象，又能涵盖所受痛苦。
- source_word: וְאֶשָּׂאֶנּוּ
  choice: 我必须承受
  rationale: נשא意为背负、承受；未完成式在此可听作未来的承担，也可带无奈接受的必要意味，正文采用自然的“必须承受”，并以脚注保留另一理解。
theological_decisions:
- issue: 末句未完成式所表达的是必要、决意还是单纯未来
  choice: 我必须承受
  alternative: 我会承受
  rationale: 上下文中的自我陈述带有无奈接受之意，但希伯来语形式本身也容许简单未来，因此正文采用较合语境的必要意味，并在脚注说明歧义。
translation_notes:
  register: 采用现代、庄重而可朗读的普通话。“破碎—伤势—病痛—承受”尽量保留原文连续的受创与疾病意象，同时避免擅自解释说话者身份或把伤势定性为不可医治。
