id: JER.10.20
reference: Jeremiah 10:20
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: אָהֳלִ֣/י שֻׁדָּ֔ד וְ/כָל מֵיתָרַ֖/י נִתָּ֑קוּ בָּנַ֤/י יְצָאֻ֨/נִי֙ וְ/אֵינָ֔/ם אֵין נֹטֶ֥ה עוֹד֙ אָהֳלִ֔/י וּ/מֵקִ֖ים יְרִיעוֹתָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/010/020.yaml
  text: My tent is destroyed[a], and all my ropes are torn away. My sons have gone from me, and they are no more[d][c][b]. There is no one left to stretch out my tent again and set up my curtains.
translation:
  language: zh_hans
  text: 我的帐篷被毁了[a]，我所有的绳索都被扯断了[b]。我的儿子们离我而去[c]，已经不在了。再也没有人支搭我的帐篷，竖起我的幔子[d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “被毁了”也可译作“遭劫掠”或“毁坏殆尽”；希伯来语可强调暴力造成的荒凉与毁灭。
    reason: lexical_alternative
  - marker: b
    text: 这里的“绳索”指固定帐篷的绳子，也可译作“帐绳”。
    reason: lexical_alternative
  - marker: c
    text: “我的儿子们”可按字面指儿子，也可能是拟人说法，指已经离去的百姓或居民。
    reason: cultural_note
  - marker: d
    text: 本句也可译作：“再也没有人展开我的帐篷，撑起我的帐幕。”
    reason: lexical_alternative
lexical_decisions:
- source_word: אָהֳלִי
  choice: 我的帐篷
  rationale: 按字面译出帐篷意象，并与后文的绳索、支搭和幔子保持连贯；不译作带有特定宗教含义的“会幕”。
- source_word: שֻׁדָּד
  choice: 被毁了
  rationale: 该被动形式可指遭劫掠或受到猛烈毁坏；“被毁了”自然地表达眼前的破败状态，同时以脚注保留词义幅度。
- source_word: מֵיתָרַי
  choice: 我的绳索
  rationale: 指固定帐篷的绳索；现代汉语中“绳索”清楚易懂，也保留帐篷意象。
- source_word: נִתָּקוּ
  choice: 都被扯断了
  rationale: 该动词可表示被拉脱、扯开或割断；在帐篷绳索的语境中，“被扯断”兼具暴力感和画面感。
- source_word: בָּנַי
  choice: 我的儿子们
  rationale: 希伯来语明确为阳性复数“儿子们”；正文保留这一形式，不直接解释为百姓或居民。
- source_word: יְצָאֻנִי
  choice: 离我而去
  rationale: 表达从说话者身边出去、离开的意思；“离我而去”符合现代汉语哀歌语气。
- source_word: וְאֵינָם
  choice: 已经不在了
  rationale: 表达他们如今缺席或不复存在，但不明确限定为死亡，保留原文可能涵盖离散、被掳或死亡的张力。
- source_word: אֵין נֹטֶה עוֹד אָהֳלִי
  choice: 再也没有人支搭我的帐篷
  rationale: נֹטֶה用于帐篷时有展开、支搭之意；“再也没有人”自然表达 אֵין 与 עוֹד 的合力。
- source_word: וּמֵקִים יְרִיעוֹתָי
  choice: 竖起我的幔子
  rationale: מֵקִים表示使之立起，יְרִיעוֹת指构成帐篷的布幅；“竖起……幔子”保留具体动作和诗歌意象。
theological_decisions:
- issue: “我的儿子们”的指称
  choice: 正文直译为“我的儿子们”，脚注说明可能是拟人化指居民或百姓
  alternative: 直接译为“我的子民”或“我的居民”
  rationale: 原文既可让人想到实际儿女，也可在城邑或群体的拟人化哀叹中指其居民；正文不替读者消除这一歧义。
- issue: “已经不在了”是否明确表示死亡
  choice: 保留缺席或不复存在的开放表达
  alternative: 译为“都死了”或仅译为“都走了”
  rationale: וְאֵינָם本身没有在本节明确交代他们是死亡、流亡还是离散；不应过度限定。
translation_notes:
  register: 采用庄重而自然的现代标准汉语，以“帐篷—绳索—幔子”贯穿整节意象。“离我而去，已经不在了”保留哀歌节奏，也不把缺席强行解释为死亡。“支搭”在帐篷语境中通顺且略具经文庄重感，但普通读者仍易理解。
