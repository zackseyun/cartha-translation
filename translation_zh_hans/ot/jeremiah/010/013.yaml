  text: לְ/ק֨וֹל תִּתּ֜/וֹ הֲמ֥וֹן מַ֨יִם֙ בַּ/שָּׁמַ֔יִם וַ/יַּעֲלֶ֥ה נְשִׂאִ֖ים מִ/קְצֵ֣ה ארץ בְּרָקִ֤ים לַ/מָּטָר֙ עָשָׂ֔ה וַ/יּ֥וֹצֵא ר֖וּחַ מֵ/אֹצְרֹתָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/010/013.yaml
  text: At the sound of his voice[a], there is a roar of waters in the heavens, and he makes clouds rise from the ends of the earth; he makes lightning for the rain[b], and brings out the wind from his storehouses.
translation:
  language: zh_hans
  text: 他一发声，天上就有众水的轰鸣[a]；他使云彩[b]从地极升起，为降雨造闪电，又从他的仓库中带出风来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译近于“在他发出声音时，天上就有众水的喧响”；原文表达简练。
    reason: lexical_alternative
  - marker: b
    text: “云彩”也可译作“水汽”或“雾气”。
    reason: lexical_alternative
lexical_decisions:
- source_word: לְקוֹל תִּתּוֹ
  choice: 他一发声
  rationale: 原文直译近于“在他发出声音时”，是压缩的希伯来语表达。译作“他一发声”自然简洁，同时保留上帝以声音施行作为的拟人意象。
- source_word: הֲמוֹן מַיִם
  choice: 众水轰鸣
  rationale: הָמוֹן兼有众多、喧响和骚动之意；上下文描写风暴，“众水轰鸣”兼顾水量与声响，也呼应前面的“发声”。
- source_word: בַּשָּׁמַיִם
  choice: 天上
  rationale: שָׁמַיִם在这里指发生气象现象的天空；“天上”符合现代汉语，又不削弱诗句的宏阔感。
- source_word: וַיַּעֲלֶה נְשִׂאִים
  choice: 他使云彩……升起
  rationale: עלה的使役式表示“使……上升”；נְשִׂאִים在气象语境中可指云、雾气或水汽，“云彩”最自然，并以脚注保留其词义幅度。
- source_word: מִקְצֵה אֶרֶץ
  choice: 从地极
  rationale: 这是表示大地遥远边缘的常见希伯来语表达；“地极”简洁、庄重，也保留古代诗歌的宇宙图景。
- source_word: בְּרָקִים לַמָּטָר עָשָׂה
  choice: 为降雨造出闪电
  rationale: 保留介词ל所表达的关联而不把闪电与雨的确切关系解释得过细；“造出”体现上帝主动掌管风暴现象。
- source_word: וַיּוֹצֵא רוּחַ
  choice: 又……带出风来
  rationale: רוּחַ在本节气象语境中明确指“风”；“带出”反映使之从储藏处出来的动作。
- source_word: מֵאֹצְרֹתָיו
  choice: 从他的仓库中
  rationale: אוֹצָר可指仓库、宝库或储藏处。这里采用“仓库”，清楚呈现风被储藏并由上帝取出的诗性图像。
theological_decisions:
- issue: 风暴意象中上帝的位格性行动
  choice: 连续使用“他发声”“他使”“造出”“带出”，保留上帝的主动施为
  alternative: 改写成非人格化的自然气象描述
  rationale: 原文明确把水、云、闪电和风归于上帝的直接统管；译文保留这一神学陈述，同时不对自然过程作额外解释。
- issue: “为降雨造出闪电”中闪电与雨的关系
  choice: 保留宽泛的目的或关联表达“为降雨”
  alternative: 译作“使闪电伴随雨水”或“为暴雨造闪电”
  rationale: 希伯来语介词ל可以表示目的或关联，原文没有进一步界定两者关系，因此不把它限定为单纯伴随或特指暴雨。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。分号保留诗句前后两组风暴图景的推进；“众水轰鸣”和“地极”维持先知诗歌的力度，不使用生硬的逐词直译。
