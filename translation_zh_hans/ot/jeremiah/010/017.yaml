  text: אִסְפִּ֥י מֵ/אֶ֖רֶץ כִּנְעָתֵ֑/ךְ ישבתי בַּ/מָּצֽוֹר׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/010/017.yaml
  text: Gather up your bundle from the land[a], you who dwell under siege.
translation:
  language: zh_hans
  text: 你这住在被围困之地的人哪，要从地上收拾起你的包裹。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “包裹”或译“财物”“货物”或“行囊”。“从地上”也可译“从这地”；“住在被围困之地的人”也可较直译为“住在围困中的居民”。
    reason: כִּנְעָתֵךְ是罕见词，可能指财物、货物或打包的物品；מֵאֶרֶץ可指“从地上”，也可理解为“从这地”。原文受话者为阴性单数，但这可能是对拟人化城市的称呼，不宜在正文中增译为“女子”。
lexical_decisions:
- source_word: אִסְפִּי
  choice: 收拾好
  rationale: 这是阴性单数祈使式。结合随后的“行囊”，译作“收拾好”自然表达把物品聚拢、准备带走之意。
- source_word: מֵאֶרֶץ
  choice: 从地上
  rationale: אֶרֶץ可指地、土地或大地；此处与收拾物品的动作相连，“从地上”最具体自然，同时保留原文意象。
- source_word: כִּנְעָתֵךְ
  choice: 你的行囊
  rationale: 这个罕见名词可指货物、财物或包裹；“行囊”契合围城中即将迁离的语境，但其词义不确定性在脚注中保留。
- source_word: ישבתי
  choice: 住在……中的女子啊
  rationale: 马所拉文本的书写形式较特殊，语境通常按阴性单数称呼语理解，即“居住者”。明示“女子”可在现代汉语中体现阴性单数受话者，并保持拟人化称呼。
- source_word: בַּמָּצוֹר
  choice: 围城中
  rationale: מָצוֹר可表示围困、围城状态，也可涉及围城设施；“围城中”简洁表达受话者身处被围困境地。
theological_decisions: []
