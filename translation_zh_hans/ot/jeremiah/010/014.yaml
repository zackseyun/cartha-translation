source:
  edition: WLC
  text: נִבְעַ֤ר כָּל אָדָם֙ מִ/דַּ֔עַת הֹבִ֥ישׁ כָּל צוֹרֵ֖ף מִ/פָּ֑סֶל כִּ֛י שֶׁ֥קֶר נִסְכּ֖/וֹ וְ/לֹא ר֥וּחַ בָּֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/010/014.yaml
  text: Every man is stupid[a], without knowledge; every metalworker is put to shame by his idol, for his cast image is a lie[c][b], and there is no breath in them.
translation:
  language: zh_hans
  text: 人人都愚昧无知；每个金属匠都因偶像蒙羞，因为他所铸的像是谎言[a]；这些像里面没有气息[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “谎言”也可译作“虚假”或“虚假之物”。
    reason: 说明 שֶׁקֶר 的词义范围，并保留较平实的汉语表达可能。
  - marker: b
    text: “气息”也可译作“灵”；意思是这些偶像里面没有生命。
    reason: 说明 רוּחַ 的词义范围及其在本句语境中的含义。
lexical_decisions:
- source_word: נִבְעַר כָּל אָדָם מִדַּעַת
  choice: 人人都愚昧无知
  rationale: נִבְעַר 表示变得愚钝、毫无理性；מִדַּעַת 可作缺乏知识的意义。合译为“愚昧无知”，既保留强烈责备，也符合现代汉语表达。כָּל אָדָם 在此泛指每一个人。
- source_word: הֹבִישׁ כָּל צוֹרֵף מִפָּסֶל
  choice: 每个金属匠都因雕像而蒙羞
  rationale: צוֹרֵף 指熔炼、加工金属的人，以“金属匠”避免过度限定为金匠；הֹבִישׁ 在这里表达受羞辱、显为可耻；מִן 可表原因，译作“因”。פֶּסֶל 指供崇拜的雕刻之像，但本句随后另用铸像用语，正文以“雕像”保留词语区别。
- source_word: כִּי שֶׁקֶר נִסְכּוֹ
  choice: 因为他铸造的像是虚假的
  rationale: נִסְכּוֹ 指他所浇铸的像；שֶׁקֶר 可指虚假、谎言。正文采用自然的“是虚假的”，脚注保留更具修辞力度的“是谎言”。
- source_word: וְלֹא רוּחַ בָּם
  choice: 其中并无气息
  rationale: רוּחַ 可指气息、风或灵；在偶像论辩中“气息”直接表达没有生命，同时脚注注明“灵”的可能。בָּם 是复数，概括前述这一类神像，汉语“其中”自然保留集合指称。
theological_decisions:
- issue: 本节对人的谴责范围
  choice: 保留“人人／每个”的普遍措辞，同时让上下文显明其锋芒针对制造和倚靠偶像的人类愚昧。
  alternative: 把首句明确限缩为“制造偶像的人都愚昧无知”。
  rationale: 原文确用 כָּל אָדָם，不宜在正文中增添限制语；但全节语境是反偶像论辩，也不应把它擅自扩展成脱离语境的全面人性论断。
- issue: 偶像“虚假”的含义
  choice: 将铸像称为“虚假的”，并由“没有气息”说明其欺骗性和无生命。
  alternative: 将 שֶׁקֶר 直接译成“谎言”，形成更强的拟人化表达。
  rationale: 两者均有词义依据；正文采用较自然且不额外解释其本体论范围的表达，脚注保留直译。
- issue: רוּחַ 的译法
  choice: 气息
  alternative: 灵
  rationale: 语境重点是人造神像没有生命；“气息”最直接，但原词的“灵”义仍以脚注明示，以保留语义张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“愚昧无知”传达先知责备的力度；“金属匠”准确而不过分专业。“雕像”与“铸造的像”分别对应 פֶּסֶל 和 נִסְכּוֹ，尽量保留原文用词变化。
