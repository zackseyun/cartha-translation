id: JER.10.1
reference: Jeremiah 10:1
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: שִׁמְע֣וּ אֶת הַ/דָּבָ֗ר אֲשֶׁ֨ר דִּבֶּ֧ר יְהוָ֛ה עֲלֵי/כֶ֖ם בֵּ֥ית יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/010/001.yaml
  text: Hear the word that Yahweh has spoken concerning you[a], O house of Israel.
translation:
  language: zh_hans
  text: 以色列家啊，要听耶和华对你们所说的话。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שִׁמְעוּ
  choice: 要听
  rationale: 这是复数祈使式，向以色列全体发出郑重的先知性召唤；“要听”既自然，也包含留心领受之意。
- source_word: הַדָּבָר
  choice: 话
  rationale: דבר在先知语境中可指“话”或“信息”；此处译为“话”，保留原文常见表达，并与“所说”自然衔接。
- source_word: אֲשֶׁר דִּבֶּר
  choice: 所说的
  rationale: 用现代汉语关系结构表达完成式动词；上下文已清楚表明这是已经发出的、当下必须听从的话。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以中文圣经传统中通行的专名“耶和华”直接呈现四字神名，使普通读者易于识别其为以色列上帝的专名，而非一般称号。
- source_word: עֲלֵיכֶם
  choice: 对你们
  rationale: 介词עַל与“说”连用时可表示话语所指向的对象，也可能有“论到你们”之意；本句作为引言，译为“对你们”最自然，并不提前加入“攻击你们”的判断色彩。
- source_word: בֵּית יִשְׂרָאֵל
  choice: 以色列家
  rationale: 保留先知书中表示整体圣约群体的固定称呼；加语气词“啊”清楚呈现呼语功能。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用四字神名而非一般称号。中文正文采用读者最熟悉且作为专名通行的“耶和华”；“雅威”更接近学界常见的拟音，但在普通现代中文读者中识别度较低。
- issue: עֲלֵיכֶם表示话语方向还是论及对象
  choice: 对你们
  alternative: 论到你们
  rationale: 两者在语义上都可能成立。此处采用较自然的“对你们”，将其理解为耶和华向以色列家发言，同时不排除这些话涉及他们自身。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“以色列家啊”保留先知性呼语和群体身份，“要听”呈现复数命令的郑重语气。
