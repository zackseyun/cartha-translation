id: JER.10.8
reference: Jeremiah 10:8
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וּ/בְ/אַחַ֖ת יִבְעֲר֣וּ וְ/יִכְסָ֑לוּ מוּסַ֥ר הֲבָלִ֖ים עֵ֥ץ הֽוּא׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/010/008.yaml
  text: But together they are stupid and foolish[b][a]; the instruction of idols is wood.
translation:
  language: zh_hans
  text: 可是，他们全都[a]愚昧无知；偶像[b]的教诲不过是木头。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们一概”或“他们在这一点上”。原文开头是一个难解的惯用表达，可表示“全都”“一概”，也可能表示“在一件事上”。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“虚妄之物”；在这里是先知书中常用来指偶像或毫无价值之物的说法。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְאַחַת
  choice: 可是，他们全都
  rationale: 该短语含义较难确定；结合后面的复数动词，译作“全都”可自然表达众者同样如此。“可是”则承接上文形成对比。
- source_word: יִבְעֲרוּ
  choice: 愚昧
  rationale: 此处 בער 表示迟钝、无知，并非同形词“燃烧”；“愚昧”符合先知文学中的智识与道德批判。
- source_word: וְיִכְסָלוּ
  choice: 无知
  rationale: כסל 表示愚蠢；与“愚昧”并列译为“愚昧无知”，既保留同义加强，也符合现代汉语表达。
- source_word: מוּסַר
  choice: 教诲
  rationale: מוּסָר 可指教导、训诫或管教；此处“教诲”能保留其教导含义，又适合庄重语体。
- source_word: הֲבָלִים
  choice: 偶像
  rationale: 该词本义涉及虚空、虚妄之物，但在先知反偶像语境中常用来指偶像；正文明确所指，脚注保留原词意象。
- source_word: עֵץ הוּא
  choice: 不过是木头
  rationale: 希伯来文是简短的无系词句。“不过是木头”在汉语中保留其直截了当的贬抑力量，并凸显偶像的物质本相。
theological_decisions:
- issue: 反偶像论述中末句的所指和语力
  choice: 把本句理解为：偶像所能给予的教诲，归根结底不过来自木头。
  alternative: 木制偶像本身就是施教者；或整句意为这种教诲像木头一样毫无生命。
  rationale: 希伯来文表达压缩，语法关系存在张力。上下文正在讥讽人手制作的木偶像，因此保留“偶像的教诲不过是木头”这一简短而略带突兀的说法，既呈现反偶像语力，也不把某一种解释过度展开。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“愚昧无知”自然呈现两个近义动词的并列；末句刻意保留原文简短、突兀的结构，不将其释义扩写进正文。
