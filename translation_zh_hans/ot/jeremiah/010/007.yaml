id: JER.10.7
reference: Jeremiah 10:7
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: מִ֣י לֹ֤א יִֽרָאֲ/ךָ֙ מֶ֣לֶךְ הַ/גּוֹיִ֔ם כִּ֥י לְ/ךָ֖ יָאָ֑תָה כִּ֣י בְ/כָל חַכְמֵ֧י הַ/גּוֹיִ֛ם וּ/בְ/כָל מַלְכוּתָ֖/ם מֵ/אֵ֥ין כָּמֽוֹ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/010/007.yaml
  text: Who would not fear you[a], O King of the nations? For this is your due; for among all the wise men of the nations and in all their kingdoms[b], there is none like you.
translation:
  language: zh_hans
  text: 列国的王啊，谁不敬畏你[a]？因为这是你当得的[b]；因为在列国所有的智慧人中，在他们所有的国度里，没有谁能与你相比。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“谁不该敬畏你？”希伯来语的反问既可表示会发生的事，也可表示理当如此的事。
    reason: lexical_alternative
  - marker: b
    text: 或译：“这是与你相称的”或“这是理当归你的”。这里指这样的敬畏理当归给上帝。
    reason: lexical_alternative
lexical_decisions:
- source_word: יִרָאֲךָ
  choice: 谁不敬畏你
  rationale: מִי לֹא加未完成式构成反问，可表示“谁会不……”或“谁不该……”。“敬畏”保留对上帝既畏惧又崇敬的语义张力。
- source_word: מֶלֶךְ הַגּוֹיִם
  choice: 列国的王
  rationale: 按希伯来语附属结构直译为王的称号，表达他对列国的普世王权，不作额外扩展。
- source_word: יָאָתָה
  choice: 这是你当得的
  rationale: 该词表示合宜、相称或理当归属；结合上文，所指的是敬畏理当归给上帝。“当得的”在现代汉语中自然，并保留应得、合宜之意。
- source_word: חַכְמֵי הַגּוֹיִם
  choice: 列国所有的智慧人
  rationale: חַכְמֵי指有智慧的人，也可指智者或贤士；“智慧人”贴近原词，又避免限定其具体社会身份。
- source_word: מַלְכוּתָם
  choice: 他们所有的国度
  rationale: מַלְכוּת可指国度、王权或统治；此处复数所有格译作“他们的国度”，最符合上下文并保留空间与政治领域的含义。
- source_word: מֵאֵין כָּמוֹךָ
  choice: 没有谁能与你相比
  rationale: 这是表达无可比拟的惯用语；此译符合现代汉语，同时保留绝对的比较意味。
- source_word: כִּי ... כִּי
  choice: 因为……因为……
  rationale: 保留两个כִּי从句的论证推进：先说明敬畏是上帝当得的，再以无人能与他相比作为依据。
theological_decisions:
- issue: 上帝对列国的王权
  choice: 列国的王
  alternative: 统管列国的王
  rationale: 原文直接以“列国的王”称呼上帝。所选译法保留这一普世王权宣告，却不加入原文未明说的解释性动词。
- issue: 敬畏上帝的含义
  choice: 敬畏你
  alternative: 怕你
  rationale: יִרָא可兼具惧怕与崇敬。“敬畏”在现代汉语圣经语境中能保留这两方面，不将其弱化为单纯尊敬，也不局限为恐惧。
- issue: 反问所表达的应然与实然
  choice: 谁不敬畏你
  alternative: 谁不该敬畏你
  rationale: 希伯来语反问既可强调无人会不敬畏，也可表达人人都理当敬畏。正文保持简洁的反问形式，并在脚注中保留两种理解。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。“列国的王啊”保留直接呼语；两个“因为”对应原文重复的כִּי，呈现其论证结构。正文不消解“敬畏”中惧怕与崇敬的张力，也不把反问单独限定为实然或应然。
