  text: לֹֽא כְ/אֵ֜לֶּה חֵ֣לֶק יַעֲקֹ֗ב כִּֽי יוֹצֵ֤ר הַ/כֹּל֙ ה֔וּא וְ/יִ֨שְׂרָאֵ֔ל שֵׁ֖בֶט נַֽחֲלָת֑/וֹ יְהוָ֥ה צְבָא֖וֹת שְׁמֽ/וֹ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/010/016.yaml
  text: Not like these is the Portion of Jacob[a], for he is the Former of all things, and Israel is the tribe of his inheritance[b]; Yahweh of hosts is his name.
translation:
  language: zh_hans
  text: 雅各的份不像这些[a]；因为他是塑造万有者，以色列是他产业的支派[b]。万军之雅威是他的名。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“雅各所得的份”。这个短语可有不同译法；上下文表明，雅各的神不像上文所说的那些偶像。
    reason: lexical_alternative
  - marker: b
    text: “支派”所译的希伯来语也可指“杖”或“权杖”；因此本句也可译作“以色列是他产业的杖（或权杖）”。
    reason: alternative_reading
lexical_decisions:
- source_word: חֵלֶק יַעֲקֹב
  choice: 雅各所得的份
  rationale: חֵלֶק意为“份、分得之物”。这里指雅各（以色列）所得的神，与上文偶像相对；“所得的份”既自然，也保留了分配、归属的意象。
- source_word: כְאֵלֶּה
  choice: 像这些
  rationale: 指示词回指上文所述之物，即偶像；正文不直接补出“偶像”，以保留原文含蓄的指代。
- source_word: יוֹצֵר הַכֹּל
  choice: 塑造万有的那一位
  rationale: יוֹצֵר着重“塑造、形成”，与人手制造偶像形成对照；הַכֹּל在此指万有。“那一位”使希伯来语名词性分词在现代汉语中自然通顺。
- source_word: שֵׁבֶט נַחֲלָתוֹ
  choice: 他产业的部族
  rationale: שֵׁבֶט可指“部族、杖、权杖”。以色列在此是属于神、作为其产业的群体，因此正文采用“部族”，同时以脚注保留其他词义。
- source_word: יְהוָה צְבָאוֹת
  choice: 万军之雅威
  rationale: “雅威”音译四字神名，保留其专名性质；“万军”简洁保留צְבָאוֹת所涵盖的众军意象。
- source_word: שְׁמוֹ
  choice: 是他的名
  rationale: 直译这一庄严的名词句，明确指出前述称号所指之神的名。
theological_decisions:
- issue: “雅各所得的份”的所指
  choice: 理解为雅各／以色列所得的神，即雅威，与偶像相对
  alternative: 较抽象地理解为“雅各的份额”，不突出其指向神的准称号作用
  rationale: 上下文把虚无的偶像与创造万有的真神对照；此译法保留盟约归属意味，但不在正文中增添解释。
- issue: שֵׁבֶט נַחֲלָתוֹ的理解
  choice: 以色列是属于神、作为其产业的部族
  alternative: 以色列是神产业的杖或权杖
  rationale: שֵׁבֶט具有真实的多义性。以色列作主语且与“他的产业”连用时，“部族”在语境中较连贯；脚注保留“杖／权杖”的可能。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“塑造”保留造物主与人造偶像之间的修辞对照；“产业”延续圣经中有关归属与承受之物的表达；句式尽量贴近希伯来语的对称与宣告语气。
