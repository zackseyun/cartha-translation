source:
  edition: WLC
  text: כְּ/תֹ֨מֶר מִקְשָׁ֥ה הֵ֨מָּה֙ וְ/לֹ֣א יְדַבֵּ֔רוּ נָשׂ֥וֹא יִנָּשׂ֖וּא כִּ֣י לֹ֣א יִצְעָ֑דוּ אַל תִּֽירְא֤וּ מֵ/הֶם֙ כִּי לֹ֣א יָרֵ֔עוּ וְ/גַם הֵיטֵ֖יב אֵ֥ין אוֹתָֽ/ם־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/010/005.yaml
  text: They are like a scarecrow in a cucumber field[a], and they cannot speak; they must be carried, because they cannot walk. Do not fear them, for they cannot do harm[b], nor can they do good.
translation:
  language: zh_hans
  text: 它们好像瓜田里的稻草人[a]，不能说话；它们必须被人搬运，因为不能行走。不要怕它们，因为它们不能加害于人，也不能行善[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“好像瓜田里的一根柱子。”希伯来文的这个形象含义不易确定；许多人理解为菜园中直立的稻草人或木柱。
    reason: lexical_alternative
  - marker: b
    text: 或译：“也不能使人得好处。”原文泛指没有行善或带来益处的能力。
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּתֹמֶר מִקְשָׁה
  choice: 好像瓜田里的稻草人
  rationale: 此短语含义艰深；תֹמֶר 在这里可能指棕榈状的直立物或柱子，מִקְשָׁה 指瓜类菜园。结合下文偶像不能说话、必须被抬着的描写，“瓜田里的稻草人”能自然传达直立而无生命的形象，同时以脚注保留“柱子”的可能。
- source_word: וְלֹא יְדַבֵּרוּ
  choice: 不能说话
  rationale: 上下文着重说明偶像毫无能力，因此译为能力上的否定，而不只译作“不开口说话”。
- source_word: נָשׂוֹא יִנָּשׂוּא
  choice: 必须被人抬着
  rationale: 不定式绝对形与限定动词连用，加强被动含义；中文以“必须被人抬着”自然表达它们非由人搬运不可。
- source_word: כִּי לֹא יִצְעָדוּ
  choice: 因为不能行走
  rationale: צעד 表示迈步、行走；此处与被人抬着相对，强调偶像不能自行移动。
- source_word: אַל תִּירְאוּ מֵהֶם
  choice: 不要怕它们
  rationale: 以直接、自然的中文命令句保留希伯来文劝诫的力度。
- source_word: כִּי לֹא יָרֵעוּ
  choice: 因为它们不能加害于人
  rationale: רעע 的使役形在此指造成伤害；补出“于人”使现代中文表达完整，但不改变原意。
- source_word: וְגַם הֵיטֵיב אֵין אוֹתָם
  choice: 也不能赐福于人
  rationale: 原句否定它们具有“行善/使人得好处”的能力。鉴于对象是被敬奉的偶像，“赐福于人”自然呈现其不能带来福祉的语境意义；脚注保留较直译的“行善”。
theological_decisions:
- issue: 偶像讽喻所强调的是实际行为还是彻底无能
  choice: 采用“不能”贯穿说话、行走、加害和赐福，突出偶像完全无能。
  alternative: 较字面地译成“不说话、不行走、不作恶，也不行善”。
  rationale: 本节上下文将偶像描绘为人手制造、须由人搬动的死物；连续的否定旨在揭示它们没有任何行动能力。这样的译法保留经文本身的神学张力，而不加入宗派性解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“稻草人”使艰深的田园形象清楚可感；“必须被人抬着”与“不能行走”形成自然对照。末句用“加害于人／赐福于人”构成对称，并用脚注保留更宽泛的词义。
