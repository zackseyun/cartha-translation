id: JER.10.10
reference: Jeremiah 10:10
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַֽ/יהוָ֤ה אֱלֹהִים֙ אֱמֶ֔ת הֽוּא אֱלֹהִ֥ים חַיִּ֖ים וּ/מֶ֣לֶךְ עוֹלָ֑ם מִ/קִּצְפּ/וֹ֙ תִּרְעַ֣שׁ הָ/אָ֔רֶץ וְ/לֹֽא יָכִ֥לוּ גוֹיִ֖ם זַעְמֽ/וֹ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/010/010.yaml
  text: But Yahweh is the true God[a]; he is the living God and the everlasting King. At his wrath the earth quakes[c][b], and the nations cannot endure his indignation.
translation:
  language: zh_hans
  text: 然而，雅威是真神[a]；他是永活的神，是永远的君王[b]。因他的震怒，大地震动；列国承受不住他的愤怒。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “真神”也可译作“真实的神”或“真理的神”。这里主要是与前文虚假的偶像相对。
    reason: lexical_alternative
  - marker: b
    text: “永远的君王”也可译作“永恒的君王”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיהוָה
  choice: 然而，雅威
  rationale: וַ־在上下文中承接前文并形成与偶像的鲜明对比，故译为“然而”；神名 יהוה 音译为“雅威”，保留其专名性质。
- source_word: אֱלֹהִים אֱמֶת
  choice: 真神
  rationale: 此处最自然地表达“真实的神”，与前文虚假、无生命的偶像相对；也保留可理解为“信实之神”的词义空间，并以脚注说明。
- source_word: הוּא אֱלֹהִים חַיִּים
  choice: 他是永活的神
  rationale: חַיִּים 在该称谓中强调神真实而持续地活着，与无生命的偶像形成对照；“永活”在中文中自然、庄重。
- source_word: וּמֶלֶךְ עוֹלָם
  choice: 是永远的君王
  rationale: עוֹלָם 表示没有终止的长久持续；“永远的君王”既自然，又保留“永恒的君王”的可能表达。
- source_word: מִקִּצְפּוֹ
  choice: 因他的震怒
  rationale: 介词 מִן 在此表示原因；קֶצֶף 是强烈的怒气，“震怒”也与随后大地震动的语境协调。
- source_word: תִּרְעַשׁ הָאָרֶץ
  choice: 大地震动
  rationale: רעש 指摇动、震颤；הָאָרֶץ 在普世君王与列国语境中宜译作“大地”，而非局部的“土地”。
- source_word: וְלֹא יָכִלוּ גוֹיִם
  choice: 列国承受不住
  rationale: יכל 与后接对象表示无力承受；“列国”准确表达 גוֹיִם 的群体和政治含义。
- source_word: זַעְמוֹ
  choice: 他的愤怒
  rationale: זַעַם 表示强烈的怒气；“愤怒”庄重而自然，也避免用词过度渲染。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华／上主
  rationale: 原文直接使用四字神名，音译“雅威”能清楚保留这是神的专名，不以称号替代。
- issue: 句首连接词的语气
  choice: 然而
  alternative: 而／并且
  rationale: 前文论及偶像，本句转而宣告雅威的真实与永活；逆接译法体现原文在语境中的对比作用，同时不把该连接词视为只能逆接。
- issue: אֱלֹהִים אֱמֶת 的关系
  choice: 真神
  alternative: 信实的神／真理的神
  rationale: 上下文主要将雅威与虚假偶像对照，因此采用“真神”；但 אֱמֶת 也可涉及真实、信实，故在脚注中保留这一可能。
- issue: עוֹלָם 的时间含义
  choice: 永远的君王
  alternative: 永恒的君王
  rationale: 两者都能表达持续无尽；“永远的君王”更贴近日常现代汉语，同时不削弱神王权的恒久性。
translation_notes:
  register: 采用现代、庄重而易懂的普通话书面语。以“然而”呈现上下文对比；“永活”“君王”“震怒”“列国”等词保留先知文体的肃穆与力度。所有脚注标记均置于正文相应位置。
