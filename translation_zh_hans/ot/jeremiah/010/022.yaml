source:
  edition: WLC
  text: ק֤וֹל שְׁמוּעָה֙ הִנֵּ֣ה בָאָ֔ה וְ/רַ֥עַשׁ גָּד֖וֹל מֵ/אֶ֣רֶץ צָפ֑וֹן לָ/שׂ֞וּם אֶת עָרֵ֧י יְהוּדָ֛ה שְׁמָמָ֖ה מְע֥וֹן תַּנִּֽים־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/010/022.yaml
  text: The sound of a report—look, it is coming!—a great commotion from the land of the north, to make the cities of Judah a desolation, a haunt of jackals.
translation:
  language: zh_hans
  text: 有消息传来的声音——看哪，它来了！从北方之地传来巨大的震响，要使犹大的城邑成为荒凉之地，作豺狼的住处。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ק֤וֹל שְׁמוּעָה֙
  choice: 听啊，有消息传来
  rationale: קול字面为“声音”，与שׁמועה连用，指传来的消息或风声；用“听啊”保留突发的听觉提示，并以“有消息传来”自然表达该短语。
- source_word: הִנֵּ֣ה
  choice: 看哪
  rationale: 保留希伯来文引人注意、强调眼前迫近之事的语用功能；现代读者虽较少口语使用，但在庄重经文体中清楚可懂。
- source_word: רַ֥עַשׁ גָּד֖וֹל
  choice: 巨大的震响
  rationale: רעש可指震动、轰响或骚动；“震响”兼顾声响与动荡感，避免过早限定为军队的喧嚣。
- source_word: מֵ/אֶ֣רֶץ צָפ֑וֹן
  choice: 从北方之地传来
  rationale: 忠实保留介词“从”和“北方之地”；补出“传来”使汉语句法自然，并与前文听觉意象衔接。
- source_word: לָ/שׂ֞וּם
  choice: 要使
  rationale: 表达不定式所指的结果或目的，保留原文在目的与预期结果之间的张力。
- source_word: שְׁמָמָ֖ה
  choice: 荒凉
  rationale: 表示遭毁坏、无人居住的状态；“荒凉”简洁且符合先知文学语域。
- source_word: מְע֥וֹן תַּנִּֽים
  choice: 豺狼的住处
  rationale: תנים在此通常指栖居废墟的豺狼类动物；“住处”直接对应מְעוֹן，也呈现城市沦为野兽栖所的图景。
theological_decisions:
- issue: 北方而来的震响之施动者是否明说
  choice: 不明说具体施动者，只译“要使犹大的城镇荒凉”
  alternative: 译为“敌军要使犹大的城镇荒凉”
  rationale: 本节原文没有明言敌军、巴比伦或上帝为语法施动者；保持省略可保存其预告性的张力，并避免将上下文推断写入正文。
- issue: לשום表达目的还是结果
  choice: 采用兼容目的与预期结果的“要使”
  alternative: 采用明确目的性的“为要使”或纯结果性的“以致”
  rationale: 希伯来语不定式可在此表达来势所指向的目的或结果；“要使”不强行消除这种含混。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以短促感叹句再现原文警报般的节奏；不添加原文未明说的敌军身份。
