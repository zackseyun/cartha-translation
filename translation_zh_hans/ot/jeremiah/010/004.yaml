base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/010/004.yaml
  text: They decorate it with silver and with gold[b][a]; they fasten it with nails and with hammers so that it will not totter.
translation:
  language: zh_hans
  text: 人用金银装饰它[a]，又用钉子和锤子将它固定[b]，使它不致摇晃[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “装饰”也可译作“使它美观”或“装点它”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文此处的宾语字面为复数“它们”，所指不明确；前后文则以单数指这个物件。
    reason: textual_grammatical_ambiguity
  - marker: c
    text: “摇晃”也可译作“移动”或“动摇”。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּכֶסֶף וּבְזָהָב
  choice: 用金银
  rationale: 两个介词 בְּ 在这里表示材料或工具；“用金银”自然地表达以银和金加以装饰，同时保留两种贵金属的并列。
- source_word: יְיַפֵּהוּ
  choice: 装饰它
  rationale: יפה 的 Piel 词形表示使之美观、装饰。“装饰”是现代汉语中自然清楚的表达；宾语按上下文译作单数“它”。
- source_word: בְּמַסְמְרוֹת וּבְמַקָּבוֹת
  choice: 用钉子和锤子
  rationale: מַסְמְרוֹת 指钉子或固定用的钉状物，מַקָּבוֹת 指锤子或木槌；在制作并固定偶像的语境中，“钉子和锤子”最直观。
- source_word: יְחַזְּקוּם
  choice: 将它固定
  rationale: חזק 的 Piel 在此表示使稳固、固定。马所拉文本的宾语后缀为复数，但前后语境均以单数指该物件；正文按语境采用单数，并以脚注保留这一语法现象及其不确定性。
- source_word: וְלֹא יָפִיק
  choice: 使它不致摇晃
  rationale: 字面结构是“而不……”，在这里自然表达固定后的目的或结果。יָפִיק 在此涉及不稳、晃动；“摇晃”既符合实物语境，也保留经文对人造偶像必须靠外力稳住的讽刺。
theological_decisions:
- issue: 经文对偶像的讽刺意味
  choice: 以“装饰”“固定”“不致摇晃”呈现偶像由人加工并须由人稳住的形象
  alternative: 仅作中性的工艺制作描述
  rationale: 耶利米书10:3-5的上下文刻意揭示偶像是人手制造、没有自主能力的物件；译文保留这种讽刺，却不额外加入正文未明说的教义判断。
- issue: יְחַזְּקוּם 的复数宾语后缀
  choice: 正文依前后单数语境译作“它”，脚注说明希伯来文此处为“它们”
  alternative: 正文直译“将它们固定”，保留突兀的数变化
  rationale: 原文前一句的宾语后缀及末句动词均为单数，而此处后缀为复数，所指并不明确。正文采用语境上最连贯的单数，同时以脚注避免掩盖原文形式。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“人用……又用……”使制作偶像的主体清楚；“不致摇晃”比生硬的“不能移动”更贴合被钉牢以保持稳定的具体画面。所有原文中值得保留的词义和数变化均在脚注中说明。
