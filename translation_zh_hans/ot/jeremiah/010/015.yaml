id: JER.10.15
reference: Jeremiah 10:15
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: הֶ֣בֶל הֵ֔מָּה מַעֲשֵׂ֖ה תַּעְתֻּעִ֑ים בְּ/עֵ֥ת פְּקֻדָּתָ֖/ם יֹאבֵֽדוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/010/015.yaml
  text: They are vanity, a work of mockery; at the time of their punishment they will perish.
translation:
  language: zh_hans
  text: 它们都是虚空，是可笑的作品；到了受惩罚的时候，它们必灭亡。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֶבֶל
  choice: 虚空
  rationale: 既表达偶像的虚妄、毫无实质，也保留该词在先知文学中的凝练力度。
- source_word: מַעֲשֵׂה תַּעְתֻּעִים
  choice: 可笑的作品
  rationale: מַעֲשֵׂה 指制作出来的作品；תַּעְתֻּעִים 在此语境中带有嘲弄、荒谬可笑之意。此译法依循修订意见中的“mockery”，同时用自然汉语表达。
- source_word: פְּקֻדָּתָם
  choice: 受惩罚的时候
  rationale: פְּקֻדָּה 可指察验、追讨或惩罚；结合偶像“灭亡”的结果，译作“受惩罚”最合语境，并保留“时候”的时间结构。
- source_word: יֹאבֵדוּ
  choice: 必灭亡
  rationale: 未完成式在预告审判结果时表达将来的确定结局；“必灭亡”简洁而有先知宣告的力度。
theological_decisions:
- issue: 受审判者是偶像还是其制造者
  choice: 用复数代词“它们”，承接上下文中的偶像
  alternative: 译为“它们的制造者”或含混处理
  rationale: 本节两个阳性复数形式 הֵמָּה、יֹאבֵדוּ 最自然地回指前文的偶像；不把经文未明说的制造者加入正文。
- issue: פְּקֻדָּה 的审判含义
  choice: 受惩罚
  alternative: 被察验、被追讨
  rationale: 该词本有一定语义幅度，但在本句中以“灭亡”为结果，惩罚性含义最为突出。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“虚空”保留经文的神学与文学凝练感；“可笑的作品”避免生硬直译，并与本段对偶像的讽刺语气相符。
