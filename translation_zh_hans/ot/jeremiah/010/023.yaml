  text: יָדַ֣עְתִּי יְהוָ֔ה כִּ֛י לֹ֥א לָ/אָדָ֖ם דַּרְכּ֑/וֹ לֹֽא לְ/אִ֣ישׁ הֹלֵ֔ךְ וְ/הָכִ֖ין אֶֽת צַעֲדֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/010/023.yaml
  text: I know[a], O Yahweh, that a man's way is not his own[b]; it is not for a man who walks to direct his steps.
translation:
  language: zh_hans
  text: 耶和华啊，我知道：人的道路不由人自己掌握[a]；行路的人也不能定自己的脚步[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文近于“人的道路不在于人自己”或“不属于人自己”。
    reason: 说明希伯来文省略式结构，并保留较形式对应的译法。
  - marker: b
    text: “定”也可译作“确立”“使……稳固”或“安排”。
    reason: 反映 הָכִין 在此处可表示使稳固、确立或安排的词义范围。
lexical_decisions:
- source_word: יָדַעְתִּי
  choice: 我知道
  rationale: ידע 的 Qal 完成式第一人称单数在这里表达说话者已经形成并持续持有的认识；现代汉语用“我知道”最自然地传达这种确认语气。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 保留四字神名作为专名；“耶和华”是现代中文读者最熟悉的传统音译，不以“主”这一称号替代原文神名。
- source_word: לֹא לָאָדָם דַּרְכּוֹ
  choice: 人的道路不由自己掌握
  rationale: 希伯来文是省略式结构，近于“人的道路不属于人”。“不由自己掌握”在现代汉语中清楚表达：人并不拥有自主支配其人生道路的最终权柄，同时不把经文扩展为完整的决定论命题。
- source_word: דַּרְכּוֹ
  choice: 人的道路
  rationale: דרך 可指实际道路，也常比喻人生的方向和历程；“道路”保留了原文意象及其双重含义。
- source_word: לְאִישׁ הֹלֵךְ
  choice: 行路的人
  rationale: 保留 אִישׁ 与分词 הֹלֵךְ 的具体行走意象，也可自然地指人在一生中的行程。
- source_word: וְהָכִין
  choice: 定准
  rationale: כון 的 Hiphil 形式可表示使稳固、确立或安排。与“脚步”搭配时，“定准”兼具确定方向和使之稳妥的含义，较好保留原词的语义范围。
- source_word: אֶת צַעֲדוֹ
  choice: 自己的脚步
  rationale: צעד 指脚步或步伐；汉语用“脚步”既自然，也保留人生行程的比喻。
theological_decisions:
- issue: 人的能动性与上帝主权之间的张力
  choice: 译文断言人不能最终自主掌握人生道路、定准自己的脚步。
  alternative: 仅强调人的有限，或把本节明确译成上帝预定人的每一个行动。
  rationale: 原文直接否定人生道路和脚步最终由人自主确定，却未在本节明说这一切如何由上帝安排。因此译文保留人对上帝的依赖及人的有限，不额外引入更强的决定论表述。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“道路—行路—脚步”的连续意象予以保留；两个分句形成自然平行。“耶和华啊”保留呼告语气。
