base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/010/018.yaml
  text: 'For thus says Yahweh: Behold[a], I am slinging out the inhabitants of the land at this time[c][b], and I will press them hard so that they may be found.'
translation:
  language: zh_hans
  text: '因为耶和华如此说：


    “看哪，我这一次要把这地[b]的居民甩出去[a]；


    我要使他们陷入困苦，


    好让他们被找着[c]。”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “甩出去”原文所用的动词令人想到用投石带甩掷，也可译作“抛出去”或“掷出去”。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“地上”或“大地”；此处按上下文译为“这地”。
    reason: alternative_reading
  - marker: c
    text: 末句原文含义不明确；也可能意为“好让他们感受到”或“好让他们发现自己已被捉住”。
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经中对神圣名号的通行音译，明确保留其专名性质。
- source_word: הִנְנִי
  choice: 看哪，我……
  rationale: 表达说话者强调性的临近行动；“看哪”保留先知宣告的庄重和突显语气。
- source_word: קוֹלֵעַ
  choice: 甩出去
  rationale: 该分词源于投石或甩掷的动作；“甩出去”在现代汉语中自然，并保留强力逐出的鲜明意象。
- source_word: יוֹשְׁבֵי הָאָרֶץ
  choice: 这地的居民
  rationale: 上下文指犹大当地居民；“这地”比“全地”或“地上的人”更符合语境，同时保留 אֶרֶץ 的地域含义。
- source_word: בַּפַּעַם הַזֹּאת
  choice: 这一次
  rationale: 自然表达此次审判的特定时机，并保留“这回、这一次”的语义。
- source_word: וַהֲצֵרוֹתִי
  choice: 我要使他们受困苦
  rationale: 该使役形表达使人陷入窘迫、困苦或受压迫；此译兼顾痛苦与受困的意味，而不过度限定为军事围困。
- source_word: לְמַעַן יִמְצָאוּ
  choice: 好让他们被找着
  rationale: 希伯来文没有明示宾语，末句含义困难。“被找着”保留 מצא 的基本词义及原文的突兀和歧义，不擅自补入“它”。
theological_decisions:
- issue: הָאָרֶץ 的范围
  choice: 这地
  alternative: 大地／地上
  rationale: 当前审判语境主要指犹大及其居民，不将经文无根据地扩大为普世审判。
- issue: לְמַעַן יִמְצָאוּ 的含义
  choice: 好让他们被找着
  alternative: 好让他们感受到／好让他们发现自己已被捉住
  rationale: 原文末句简略且解释困难。正文尽量保留其字面词义和开放性，脚注列出较具解释性的可能理解。
translation_notes:
  register: 采用庄重而可懂的现代标准汉语。诗行安排体现宣告的节奏；避免古奥表达。“甩出去”有意保留原文强烈而具体的投掷意象，末句则保留原文真实的语义困难。
