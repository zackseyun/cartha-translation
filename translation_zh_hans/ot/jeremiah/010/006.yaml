base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/010/006.yaml
  text: There is none like you[a], O Yahweh; you are great, and your name is great in might.
translation:
  language: zh_hans
  text: 雅威[a]啊，没有谁能与你相比！你是伟大的；你的名也大有能力。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “雅威”原文为 יהוה（YHWH），即以色列上帝的神名；传统上常译作“耶和华”。
    reason: 说明四字神名的原文形式及传统中文译名。
lexical_decisions:
- source_word: מֵאֵין כָּמוֹךָ
  choice: 没有谁能与你相比
  rationale: 希伯来语惯用表达否定有任何可与上帝相比者；这样译为自然的现代汉语，同时保留直接称呼和比较含义。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代简体中文读者最熟悉的专名形式呈现四字神名，并用脚注说明其希伯来文性质及另一音译。
- source_word: גָּדוֹל אַתָּה
  choice: 你本为大
  rationale: 保留谓语形容词所表达的强调；“本为大”庄重而易懂，并表明这是对上帝本身伟大的直接宣告。
- source_word: וְגָדוֹל שִׁמְךָ
  choice: 你的名也……显为大
  rationale: 保留“名”这一原文意象及与前句的平行，同时使汉语表达自然；“名”可涵盖名声、威望和所启示的身份。
- source_word: בִּגְבוּרָה
  choice: 因大能
  rationale: 介词בְּ在此可表示领域、方式或彰显的层面；“因大能而显为大”自然表达其名在大能中彰显为大，同时避免把含义限定为具体神迹。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用以色列上帝的专名。正文采用汉语圣经传统中辨识度最高的“耶和华”，脚注保留“雅威”这一较接近现代学界复原读音的音译，避免把专名仅译作称号。
- issue: “你的名为大”与“大能”的关系
  choice: 你的名因大能而显为大
  alternative: 你的名在大能中为大
  rationale: 希伯来语בִּגְבוּרָה容许领域或彰显方式等理解；正文用通顺汉语表达其名借大能彰显为大，但不扩展为特定的“大能作为”。
translation_notes:
  register: 采用现代、庄重而清楚的标准普通话。首句以感叹号体现直接呼告和无可比拟的赞叹；后半保持原文“你—你的名”的诗性平行。
