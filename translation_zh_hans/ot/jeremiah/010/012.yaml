id: JER.10.12
reference: Jeremiah 10:12
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: עֹשֵׂ֥ה אֶ֨רֶץ֙ בְּ/כֹח֔/וֹ מֵכִ֥ין תֵּבֵ֖ל בְּ/חָכְמָת֑/וֹ וּ/בִ/תְבוּנָת֖/וֹ נָטָ֥ה שָׁמָֽיִם׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/010/012.yaml
  text: He made the earth by his power[a]; he established the world by his wisdom[b], and by his understanding he stretched out the heavens.
translation:
  language: zh_hans
  text: 他以能力创造大地[a]，以智慧奠定世界[b]，又以聪明铺展诸天。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “创造”原文为分词，也可理解为“造”或“创造者”；这里与后文并列，指他创造大地的作为。
    reason: lexical_alternative
  - marker: b
    text: “世界”原文常指有秩序、可居住的世界。
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹשֵׂה
  choice: 创造
  rationale: 该词是动词 עשה 的主动分词，可表示持续或特征性的“造／创造”，也可在诗歌语境中与后面的完成式动词协调，按过去的创造行动理解。正文采用自然庄重的“创造”，脚注保留其分词语感。
- source_word: אֶרֶץ
  choice: 大地
  rationale: 本节是宇宙创造语境，并与“世界”和“诸天”对应；“大地”比“土地”更合适，也具有诗歌庄重感。
- source_word: בְּכֹחוֹ
  choice: 以能力
  rationale: 介词 בְּ 在此表工具或凭借；“以能力”准确而简洁地表达上帝施行创造的大能。
- source_word: מֵכִין
  choice: 奠定
  rationale: כון 的 Hiphil 分词含使之稳固、建立之意；“奠定”既保留稳固世界的意象，又符合中文诗体。
- source_word: תֵּבֵל
  choice: 世界
  rationale: תֵּבֵל 常指有秩序、可居住的世界；正文用自然简洁的“世界”，脚注说明其较具体的语义范围。
- source_word: בְּחָכְמָתוֹ
  choice: 以智慧
  rationale: 保留工具性的介词和希伯来智慧传统中的核心词义。
- source_word: וּבִתְבוּנָתוֹ
  choice: 又以聪明
  rationale: תְּבוּנָה 指理解力、洞察力；“聪明”在庄重中文圣经语体中可与“智慧”区分，同时避免重复译作“智慧”。
- source_word: נָטָה
  choice: 铺展
  rationale: נטה 与“诸天”搭配时描绘将其伸展、展开；“铺展”自然地保留空间意象。
- source_word: שָׁמָיִם
  choice: 诸天
  rationale: 以“诸天”体现希伯来语复数形式及宇宙性语境，比“天空”范围更广，也更庄重。
theological_decisions:
- issue: 本节未明说主语，只由上下文承接
  choice: 使用“他”，不补入神名或称号
  alternative: 译作“上帝”或“耶和华”
  rationale: 希伯来文此处以分词开头，没有再次出现主语名词；“他”忠实承接上文，并避免加入本节原文未明说的神名。
- issue: 首个分词的时间与体貌
  choice: 正文按创造行动译为“创造”，不额外标明过去或现在；脚注保留“创造者／造”的可能语感
  alternative: 明确译作“他创造了”或“他是创造……的主”
  rationale: עֹשֵׂה 是分词，本身可有进行、惯常或特征性含义，而后两项分别使用分词和完成式。中文“创造”无需强加明显时态，可较好保留这种张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。三个“以……”结构保留希伯来诗句的平行关系；“大地—世界—诸天”呈现由地上到天上的宇宙范围。“聪明”与“智慧”有所区分，同时保持自然的经文语体。
