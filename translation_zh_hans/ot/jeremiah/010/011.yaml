id: JER.10.11
reference: Jeremiah 10:11
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כִּ/דְנָה֙ תֵּאמְר֣וּן לְ/ה֔וֹם אֱלָ֣הַיָּ֔/א דִּֽי שְׁמַיָּ֥/א וְ/אַרְקָ֖/א לָ֣א עֲבַ֑דוּ יֵאבַ֧דוּ מֵֽ/אַרְעָ֛/א וּ/מִן תְּח֥וֹת שְׁמַיָּ֖/א אֵֽלֶּה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/010/011.yaml
  text: 'Thus you shall say to them: “The gods that did not make the heavens and the earth will perish from the earth and from under these heavens.”[a][b]'
translation:
  language: zh_hans
  text: 你们要这样对他们说：“那些没有创造天地的神，必从地上、从这诸天之下消亡。[a][b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “消亡”也可译作“被毁灭”或“消失”。亚兰文动词既可指灭亡，也可指被除灭。
    reason: lexical_alternative
  - marker: b
    text: 这里的“神”可指偶像、所谓的神祇，或兼指两者；原文保留了宽泛的论战对象。
    reason: alternative_reading
lexical_decisions:
- source_word: כִּדְנָה
  choice: 这样
  rationale: 这是引出所要宣告之话的指示副词；“这样”自然保留“以这种方式”的语气。
- source_word: תֵּאמְרוּן
  choice: 你们要……说
  rationale: 二人称复数未完成式在此表达指示；“要……说”符合现代汉语的命令语气。
- source_word: אֱלָהַיָּא
  choice: 那些……神
  rationale: 亚兰文为定指复数；这一译法既表达复数和特指，又不预先限定为偶像或所谓的神祇。
- source_word: שְׁמַיָּא וְאַרְקָא
  choice: 天地
  rationale: 这是涵盖受造宇宙的常见并列表达；“天地”在现代汉语中自然、庄重，也保留创造语境。
- source_word: לָא עֲבַדוּ
  choice: 没有创造
  rationale: 否定完成式指出这些神并未造出天地；“创造”比一般的“制造”更贴合宇宙创造语境。
- source_word: יֵאבַדוּ
  choice: 必……消亡
  rationale: 动词 אבד 在此可表达灭亡、消失；“消亡”保留不及物含义，也呈现非创造者自身终将不复存在的讽刺。
- source_word: מֵאַרְעָא
  choice: 从地上
  rationale: 前文已有宇宙性的“天地”，此处指从大地之上消失，而非某一特定地区。
- source_word: וּמִן תְּחוֹת שְׁמַיָּא אֵלֶּה
  choice: 从这诸天之下
  rationale: 保留 תְּחוֹת 的“之下”、שְׁמַיָּא 的复数意象及 אֵלֶּה 的近指意味；虽略带经文语体，却准确呈现原文具体的宇宙范围。
theological_decisions:
- issue: “神”的指涉范围
  choice: 保留宽泛的“那些……神”，不明确限定为偶像或灵界存在
  alternative: 译作“那些偶像”或“那些所谓的神”
  rationale: 原文以复数“神”与创造天地的主形成对比，却没有明说其仅指物质偶像，或承认其为真实神祇；宽泛译法保留原文的论战张力。
- issue: 这些神的结局
  choice: 译为“消亡”
  alternative: 译为“被毁灭”或“消失”
  rationale: 原文动词可涵盖灭亡或被除灭；“消亡”不强行指定施动者，同时清楚表达它们终将不复存在。
translation_notes:
  register: 采用现代、庄重而易懂的经文语体。“天地”自然凝练；“这诸天之下”刻意保留原文复数及指示词，避免把具体表达简化成一般性的“天下”。
