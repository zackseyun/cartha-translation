source:
  edition: WLC
  text: שְׁפֹ֣ךְ חֲמָתְ/ךָ֗ עַל הַ/גּוֹיִם֙ אֲשֶׁ֣ר לֹֽא יְדָע֔וּ/ךָ וְ/עַל֙ מִשְׁפָּח֔וֹת אֲשֶׁ֥ר בְּ/שִׁמְ/ךָ֖ לֹ֣א קָרָ֑אוּ כִּֽי אָכְל֣וּ אֶֽת יַעֲקֹ֗ב וַ/אֲכָלֻ֨/הוּ֙ וַ/יְכַלֻּ֔/הוּ וְ/אֶת נָוֵ֖/הוּ הֵשַֽׁמּוּ־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/010/025.yaml
  text: Pour out your wrath on the nations that do not know you[a], and on the clans that do not call on your name; for they have devoured Jacob, they have devoured him and consumed him, and they have laid waste his habitation.
translation:
  language: zh_hans
  text: 求你将烈怒倾倒在不认识你的列国，和不求告你名的各族上；因为他们吞吃了雅各，吞吃他，将他灭尽，又使他的居所[a]荒凉。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“牧场”。
    reason: נָוֶה既可表示居所，也可表示牧场；正文按语境译为“居所”，脚注保留另一项真实可能。
lexical_decisions:
- source_word: שְׁפֹךְ
  choice: 倾倒
  rationale: 保留祷告中将烈怒如液体倾出的强烈隐喻，并准确表达命令式。
- source_word: חֲמָתְךָ
  choice: 你的烈怒
  rationale: חֵמָה表示炽烈的愤怒；“烈怒”兼具力度与庄重感。
- source_word: הַגּוֹיִם
  choice: 列国
  rationale: 指敌对雅各的外邦国家；“列国”自然且不引入后期技术性含义。
- source_word: אֲשֶׁר לֹא יְדָעוּךָ
  choice: 不认识你的
  rationale: 保留“认识”对上帝可包含关系性认识与承认的语义，不作过度解释。
- source_word: מִשְׁפָּחוֹת
  choice: 各族
  rationale: 该词指亲族或宗族群体；“各族”与“列国”平行，同时保留较小社会群体的含义。
- source_word: בְּשִׁמְךָ לֹא קָרָאוּ
  choice: 不求告你名的
  rationale: קרא בשם是呼求、敬拜的惯用表达；“求告你名”在中文中清楚而庄重。
- source_word: כִּי
  choice: 因为
  rationale: 明确引出祈求审判的理由。
- source_word: אָכְלוּ אֶת יַעֲקֹב וַאֲכָלֻהוּ
  choice: 他们吞吃了雅各，吞吃他
  rationale: 以“吞吃”表现敌人猛烈毁灭的比喻，并保留希伯来文刻意的动词重复。
- source_word: וַיְכַלֻּהוּ
  choice: 将他灭尽
  rationale: 表达使之终结、彻底毁灭的递进意义，与前面的“吞吃”有所区分。
- source_word: נָוֵהוּ
  choice: 他的居所
  rationale: נָוֶה可指住处、牧场；此处“居所”更自然地指雅各的家园，同时用脚注保留具体的牧场意象。
- source_word: הֵשַׁמּוּ
  choice: 使……荒凉
  rationale: 准确表达使某地成为荒场、遭受彻底破坏的使役含义。
theological_decisions:
- issue: 针对外邦群体的求罚祷告
  choice: 保留直接求上帝倾倒烈怒的祷告
  alternative: 弱化为一般不悦，或改写为单纯宣告审判
  rationale: 原文明确祈求上帝因列国毁灭雅各而施行烈怒；译文应保留这一神学张力，不加淡化。
translation_notes:
  register: 采用现代、庄重、普通读者易懂的祷告语体；保留“吞吃”的重复和“吞吃—灭尽—荒凉”的递进。脚注标记紧随其实际对应的“居所”，而非置于无关短语之后。
