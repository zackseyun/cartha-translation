  text: כִּֽי חֻקּ֥וֹת הָֽ/עַמִּ֖ים הֶ֣בֶל ה֑וּא כִּֽי עֵץ֙ מִ/יַּ֣עַר כְּרָת֔/וֹ מַעֲשֵׂ֥ה יְדֵ֥י חָרָ֖שׁ בַּֽ/מַּעֲצָֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/010/003.yaml
  text: For the customs of the peoples are vanity[a], for a tree is cut from the forest, the work of the hands of a craftsman with an axe.
translation:
  language: zh_hans
  text: 原来，列族的习俗尽是虚空；因为有人从林中砍下一棵树，匠人用斧子[a]亲手把它制成。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“锛子”。希伯来语所指的是砍削或修整木材的工具，确切是哪一种工具不能确定。
    reason: 词义存在具体工具类型上的不确定性；脚注保留“锛子”这一可能译法。
lexical_decisions:
- source_word: חֻקּוֹת
  choice: 习俗
  rationale: 本节谈列族敬拜偶像的惯常做法，并非正式法令；“习俗”自然地表达其惯例、礼俗之意。
- source_word: הָעַמִּים
  choice: 列族
  rationale: 保留复数族群含义，也避免把古代族群误解为现代民族国家。
- source_word: הֶבֶל
  choice: 虚空
  rationale: 保留该词“气息、空幻”所引申出的空洞、徒然和毫无价值，同时不把其含义过度限定为单一解释。
- source_word: כִּי
  choice: 原来；（后一个כי按汉语解释关系表达为“不过”）
  rationale: 首个כי承接上文并说明理由，用“原来”符合现代汉语篇章关系；第二个כי引出习俗之所以虚空的说明，为避免生硬重复“因为”，以解释性结构呈现。
- source_word: עֵץ
  choice: 一棵树
  rationale: 保留原文具体、鲜明的树木意象，而不抽象化为“木料”。
- source_word: מִיַּעַר
  choice: 从林中
  rationale: 直接、自然地表达来源。
- source_word: כְּרָתוֹ
  choice: 砍下
  rationale: 原文是第三人称阳性单数动词并带宾语后缀，施事者未明确；汉语用“从林中砍下的”保留匿名施事和对树木的聚焦。
- source_word: מַעֲשֵׂה יְדֵי חָרָשׁ
  choice: 匠人……亲手制成的
  rationale: 既表达这是匠人的作品，也保留“手”的具体意象，突出其为人手制造。
- source_word: חָרָשׁ
  choice: 匠人
  rationale: 此词泛指有技艺的工匠；“匠人”简洁、庄重，又不过度限定具体工种。
- source_word: בַּמַּעֲצָד
  choice: 用斧子
  rationale: 指木工使用的砍削工具，确切器形不易断定；正文采用普通读者容易理解的“斧子”，并在脚注保留另一可能。
theological_decisions:
- issue: 如何表达对列族偶像习俗的批判而不加入后来的神学术语
  choice: 列族的习俗尽是虚空
  alternative: 列国的规例毫无价值
  rationale: 译文保留原文对这些习俗空幻、徒然性质的判断，并借后半节强调其对象只是人手制作之物，不额外加入原文没有的教义术语。
- issue: 是否在正文补出“偶像”
  choice: 不补出“偶像”，以“那”承接所论对象
  alternative: 偶像不过是从林中砍下的一棵树
  rationale: 上下文显然指向偶像，但本节希伯来文本没有明说“偶像”；不补出该词可更贴近原文，同时“那不过是”使现代汉语仍能自然衔接，并保留原文含蓄的指涉。
translation_notes:
  register: 采用现代、庄重且便于普通读者理解的书面汉语。“原来”承接上文，“那不过是”体现后一个כי的解释作用；分号保留前后两分句的紧密论证关系。脚注标记置于实际存在词义不确定性的“斧子”之后。
