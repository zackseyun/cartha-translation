  naturalness: “原来”“列族”“虚空”均属庄重而可理解的现代书面语。“那不过是”后的系表结构不自然且造成逻辑歧义。改为两个并列、递进的分句更符合现代汉语。
  terminology: “列族”“习俗”“虚空”“匠人”恰当。“斧子”可用，但该工具的精确类型不确定，保留脚注的“锛子”备选译法是合适的。
