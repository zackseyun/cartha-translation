  text: יַסְּרֵ֥/נִי יְהוָ֖ה אַךְ בְּ/מִשְׁפָּ֑ט אַל בְּ/אַפְּ/ךָ֖ פֶּן תַּמְעִטֵֽ/נִי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/010/024.yaml
  text: Discipline me[a], Yahweh, but with justice, not in your anger[c][b], lest you diminish me.
translation:
  language: zh_hans
  text: 耶和华啊，求你管教我[a]，只要按公正管教我，不要在你的怒气中管教我，免得你使我衰微[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “管教”也可译作“纠正”或“惩戒”。
    reason: lexical_alternative
  - marker: b
    text: “使我衰微”也可译作“使我减少”或“使我微小”；原文意为使之变小或减少，是否指彻底毁灭并不明确。
    reason: lexical_alternative
lexical_decisions:
- source_word: יַסְּרֵנִי
  choice: 求你管教我
  rationale: יסר 的皮埃尔式在此指带有纠正目的的管教。“管教”自然、庄重，并保留责罚与纠正兼具的语义；加“求”符合希伯来语祈求语境。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 直接以现代中文圣经读者熟悉的专名“耶和华”表达四字神名，不以头衔代替。
- source_word: אַךְ בְּמִשְׁפָּט
  choice: 但要按公正行
  rationale: אַךְ 在此限制前面的请求；מִשְׁפָּט 可指审判、公正或合宜的尺度。“按公正行”保留神施行管教，却与怒中施罚形成对照。
- source_word: אַל בְּאַפְּךָ
  choice: 不要在怒中管教我
  rationale: 原文省略重复的动词，中文补出“管教我”以清楚表达所否定的是管教的方式，而非否认神的愤怒本身。
- source_word: פֶּן תַּמְעִיטֵנִי
  choice: 免得你使我微小
  rationale: מעט 的使役式直指“使变小、使减少”。“使我微小”保留原文较为开放的意象，不擅自强化为“消灭我”或“使我归于无有”。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用四字神名。中文正文采用广为人知且具有专名功能的“耶和华”，既不以“主”这一头衔替代，也避免在正文中引入中文读者较不熟悉的音译形式。
- issue: בְּמִשְׁפָּט 所表达的管教方式
  choice: 按公正行
  alternative: 按审判／有分寸地
  rationale: 本句并非请求免受管教，而是请求神以公正而非怒气管教。译文保留管教与公正、怒气之间的神学张力，不将其淡化为单纯温和。
- issue: תַּמְעִיטֵנִי 的程度
  choice: 使我微小
  alternative: 使我衰微／使我归于无有
  rationale: 希伯来语本义是“使变小、使减少”，具体程度存在歧义。正文采用较贴近词形且不扩大程度的译法，并在脚注列出自然的中文替代说法。
translation_notes:
  register: 采用现代、庄重而易懂的祈祷语体。“不要在怒中管教我”补出希伯来语中承前省略的动词，使中文自然清楚；末句刻意保留“使小、使少”的原始意象与程度歧义。
