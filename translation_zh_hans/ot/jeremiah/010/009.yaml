language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כֶּ֣סֶף מְרֻקָּ֞ע מִ/תַּרְשִׁ֣ישׁ יוּבָ֗א וְ/זָהָב֙ מֵֽ/אוּפָ֔ז מַעֲשֵׂ֥ה חָרָ֖שׁ וִ/ידֵ֣י צוֹרֵ֑ף תְּכֵ֤לֶת וְ/אַרְגָּמָן֙ לְבוּשָׁ֔/ם מַעֲשֵׂ֥ה חֲכָמִ֖ים כֻּלָּֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/010/009.yaml
  text: Beaten silver is brought from Tarshish[a], and gold from Uphaz, the work of a craftsman and of the hands of a goldsmith. Blue and purple are their clothing; all of them are the work of skilled men.
translation:
  language: zh_hans
  text: 锤成薄片的银子从他施运来，金子从乌法[a]运来；这些都是工匠的作品，是金匠亲手做成的。蓝色和紫色布料是它们的衣服；它们全都是巧匠的作品。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “乌法”是希伯来文本中的名称；有人认为这是“俄斐”的异体。
    reason: 说明地名的另一种理解；正文依马所拉文本保留“乌法”。
lexical_decisions:
- source_word: כֶּסֶף מְרֻקָּע
  choice: 锤成薄片的银子
  rationale: כֶּסֶף在此指制作偶像所用的银，而非钱币；מְרֻקָּע指金属经锤打延展成薄片。此译既呈现材料，也说明加工形态。
- source_word: מִתַּרְשִׁישׁ יוּבָא
  choice: 从他施运来
  rationale: 他施是地名；יוּבָא为使役被动式，意为“被带来”。“运来”自然体现贵金属贸易运输的语境，同时保留被带来的含义。
- source_word: וְזָהָב מֵאוּפָז
  choice: 金子从乌法运来
  rationale: 马所拉文本作אוּפָז，按地名音译为“乌法”，不在正文中改作“俄斐”；动词“运来”依前句承接补出。
- source_word: מַעֲשֵׂה חָרָשׁ וִידֵי צוֹרֵף
  choice: 都是工匠制作、金匠亲手打造的
  rationale: חָרָשׁ是从事手艺的工匠；צוֹרֵף可指熔炼、精炼贵金属者或金匠。译作“金匠”切合偶像制造语境，“亲手”保留“手”的强调。
- source_word: תְּכֵלֶת וְאַרְגָּמָן
  choice: 蓝色和紫色布料
  rationale: 两词指昂贵的染色织物或相应色彩；结合“衣服”，补出“布料”可避免现代读者将抽象颜色直接误解为衣服，同时不限定具体衣料。
- source_word: לְבוּשָׁם
  choice: 是它们的衣服
  rationale: 单数集合名词לְבוּשׁ带复数所属后缀，表示这些偶像所穿戴的衣物；中文“它们的衣服”自然清楚。
- source_word: מַעֲשֵׂה חֲכָמִים כֻּלָּם
  choice: 它们全都是巧匠的作品
  rationale: חֲכָמִים在手工业语境中指有技艺的人，不是道德或哲学意义上的智者。“巧匠”准确传达熟练工匠之意；כֻּלָּם译为“全都”，保留其总括作用。
theological_decisions:
- issue: חֲכָמִים的性别与语境含义
  choice: 巧匠
  alternative: 有技艺的男子／熟练工人
  rationale: 希伯来语形式为阳性复数，但现代汉语职业名词通常不以语法性别作区分；“巧匠”没有把该词误释为宗教或哲学上的“智慧人”，也没有额外断定工匠群体的自然性别。
- issue: כֻּלָּם所指对象
  choice: 以“它们”保留上下文所指
  alternative: 明确译作“这些偶像”或“这些衣服”
  rationale: 希伯来语阳性复数代词依据上下文可回指所论的偶像或其制成品；正文不用解释性名词替换，以免消除原文指代上的张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“锤成薄片”“运来”“亲手打造”让制作过程具体可懂；“它们”符合无生命偶像的现代汉语指称。脚注标记置于“乌法”之后，因为异读涉及该地名，而非“他施”。
