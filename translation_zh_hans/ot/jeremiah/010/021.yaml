id: JER.10.21
reference: Jeremiah 10:21
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כִּ֤י נִבְעֲרוּ֙ הָֽ/רֹעִ֔ים וְ/אֶת יְהוָ֖ה לֹ֣א דָרָ֑שׁוּ עַל כֵּן֙ לֹ֣א הִשְׂכִּ֔ילוּ וְ/כָל מַרְעִיתָ֖/ם נָפֽוֹצָה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/010/021.yaml
  text: For the shepherds have become stupid[a], and they have not sought Yahweh; therefore they have not acted wisely[c][b], and all their flock is scattered.
translation:
  language: zh_hans
  text: 因为牧人变得愚顽[a][b]，也没有寻求雅威；因此他们没有明智地行事[c]，他们的羊群都四散了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“变得昏昧”或“变得如牲畜般愚钝”。
    reason: lexical_alternative
  - marker: b
    text: “牧人”很可能是比喻百姓的领袖。
    reason: cultural_note
  - marker: c
    text: “没有明智地行事”也可译为“没有成功”或“没有亨通”；原文动词可兼指明智地行事及由此而有成效。
    reason: lexical_alternative
lexical_decisions:
- source_word: נִבְעֲרוּ
  choice: 已经愚顽
  rationale: 该词在此表示变得如畜类般迟钝、失去理性判断；“愚顽”保留先知责斥的强度，也比单纯“无知”更贴近原文。
- source_word: הָרֹעִים
  choice: 牧人
  rationale: 保留原文的牧羊隐喻；在耶利米书语境中，很可能指百姓的领袖。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以音译呈现四字神名，保留原文对立约之神专名的直接使用。
- source_word: דָרָשׁוּ
  choice: 寻求
  rationale: 该动词用于神时可兼有寻求、求问和求取指引之意；“寻求”自然且保留较宽语义。
- source_word: הִשְׂכִּילוּ
  choice: 行事没有智慧
  rationale: 使役形可指明智地行事，也可延伸为顺利、成功；正文采用与上下文因果关系相合的智慧义，并以脚注保留成功义。
- source_word: מַרְעִיתָם
  choice: 他们的羊群
  rationale: 该名词可指牧场、牧养或所牧养的群体；与“牧人”和“四散”连用时，集体意义“羊群”最自然。
- source_word: נָפוֹצָה
  choice: 全都四散了
  rationale: 该动词意为散开、被驱散；原文形式未明确表达施事者，故中文不补出谁使其分散。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；音译“雅威”使读者看到这是专名，而不是普通称号。
- issue: “牧人”的所指
  choice: 正文保留牧人隐喻
  alternative: 直接译作领袖
  rationale: 原文借牧人谴责治理百姓的人；保留隐喻避免把可能涵盖君王、官长或宗教领袖的用语限定为单一群体。
- issue: הִשְׂכִּילוּ 的智慧与成效语义
  choice: 行事没有智慧
  alternative: 没有亨通；没有成功
  rationale: 此词可兼具明智行事及由此获得成效的含义；正文采用智慧义，脚注保留结果义，不将两者强行合并。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“愚顽”保留先知性责斥；“行事没有智慧”比生硬的“未能明智行事”更自然。脚注标记分别紧随相关词语或分句。
