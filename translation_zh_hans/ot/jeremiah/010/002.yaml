source:
  edition: WLC
  text: כֹּ֣ה אָמַ֣ר יְהוָ֗ה אֶל דֶּ֤רֶךְ הַ/גּוֹיִם֙ אַל תִּלְמָ֔דוּ וּ/מֵ/אֹת֥וֹת הַ/שָּׁמַ֖יִם אַל תֵּחָ֑תּוּ כִּֽי יֵחַ֥תּוּ הַ/גּוֹיִ֖ם מֵ/הֵֽמָּה׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/010/002.yaml
  text: 'Thus says Yahweh: Do not learn the way of the nations[a], and do not be dismayed at the signs of the heavens, because the nations are dismayed at them.'
translation:
  language: zh_hans
  text: 耶和华如此说：“不要仿效列国的行事方式[a]，也不要因天上的征兆而惊惶，因为列国因这些征兆而惊惶。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “行事方式”直译为“道路”，在这里指列国的习俗或行为模式。
    reason: 说明希伯来语“道路”的隐喻性用法，并保留其较直译的表达可能。
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代汉语读者熟悉的专名形式来表达希伯来文四字神名，避免以“主”取代原文中的名字。
- source_word: כֹּה אָמַר
  choice: 如此说
  rationale: 保留先知宣告的固定公式及庄重语体，同时符合现代汉语表达。
- source_word: דֶּרֶךְ הַגּוֹיִם
  choice: 列国的行事方式
  rationale: דֶּרֶךְ 在此指行为模式、习俗或生活方式，并非字面上的道路；“列国”比“外邦人”更直接对应 גּוֹיִם，也避免引入后期术语色彩。
- source_word: אַל תִּלְמָדוּ
  choice: 不要仿效
  rationale: למד 字面为“学习”，但与“行事方式”连用时意指学来并采用；“仿效”自然地传达这里的禁令，又未具体限定所指习俗。
- source_word: מֵאֹתוֹת הַשָּׁמַיִם
  choice: 因天上的征兆
  rationale: אוֹתוֹת 可指征兆或预兆；介词 מִן 在这里表达引发惊惶的原因。“天上的”保留 הַשָּׁמַיִם 的空间与宗教语境。
- source_word: תֵּחָתּוּ / יֵחַתּוּ
  choice: 惊惶
  rationale: חתת 表示因恐惧而丧胆、惊惶；“惊惶”兼顾其恐惧感和庄重语体，不将语气强化为极端的“恐怖”。
- source_word: כִּי
  choice: 因为
  rationale: 按上下文理解为说明禁令理由的因果连接词。
- source_word: מֵהֵמָּה
  choice: 因这些征兆
  rationale: 代词回指“天上的征兆”；在汉语中重复名词比单说“因它们”更清楚自然。
theological_decisions:
- issue: גּוֹיִם 在异教习俗语境中的译法
  choice: 列国
  alternative: 外邦人
  rationale: 原词泛指以色列之外的各国或各族；“列国”较为中性，也更贴近耶利米书的先知语境，不预先套用后期宗教群体术语。
- issue: 四字神名 יְהוָה 的表达
  choice: 耶和华
  alternative: 雅威；主
  rationale: 原文直接使用神名，因此以中文专名表达，而不以称号“主”取代；“耶和华”是普通现代中文读者最熟悉的专名形式。
- issue: 天上征兆的性质
  choice: 保留为“征兆”
  alternative: 天象；凶兆
  rationale: 原文并未逐一说明这些记号是占星现象、日月食或其他天象，也没有在名词本身明确加入“凶”的判断，因此不作更具体的神学或历史解释。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。先知公式保留正式感；正文避免生硬的逐词对应，同时不具体化“天上的征兆”或列国的习俗，以保存原文的概括性。
