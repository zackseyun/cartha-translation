source:
  edition: WLC
  text: וַֽ/יְרַפְּא֞וּ אֶת שֶׁ֤בֶר עַמִּ/י֙ עַל נְקַלָּ֔ה לֵ/אמֹ֖ר שָׁל֣וֹם שָׁל֑וֹם וְ/אֵ֖ין שָׁלֽוֹם־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/006/014.yaml
  text: They have healed the wound of my people lightly[a], saying, ‘Peace, peace,’ when there is no peace.
translation:
  language: zh_hans
  text: 他们敷衍地医治我百姓的创伤[a]，说：“平安！平安！”其实并没有平安。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们敷衍地医治我百姓的破裂。”
    reason: “创伤”所对应的希伯来词也可指破裂或损伤；“敷衍地”所对应的短语强调把严重问题轻看、草率处理。
lexical_decisions:
- source_word: וַיְרַפְּאוּ
  choice: 医治
  rationale: רפא的基本义是“医治”。这里带有反讽意味，并非说明医治已经奏效；现代汉语“医治”既可指施行治疗，也不必然表示痊愈，因而能保留医疗比喻和先知的谴责。
- source_word: שֶׁבֶר
  choice: 创伤
  rationale: שֶׁבֶר可指破裂、折断或严重损伤。“创伤”与“医治”自然搭配，也能涵盖百姓在属灵、道德与社会层面的严重破败，而不把所指限于身体骨折。
- source_word: עַמִּי
  choice: 我百姓
  rationale: 直译所属关系，保留耶和华称以色列为“我百姓”所带有的立约与先知性语气。
- source_word: עַל נְקַלָּה
  choice: 草草
  rationale: 该短语表达把严重问题看得轻微、以轻忽或肤浅的方式处理。“草草医治”是自然简洁的现代汉语，兼有处理敷衍和轻看伤势之意。
- source_word: לֵאמֹר
  choice: 说
  rationale: 按其引出直接引语的常规功能译为“说”。
- source_word: שָׁלוֹם שָׁלוֹם
  choice: 平安了！平安了！
  rationale: 保留שָׁלוֹם的核心用语和原文重复所表达的坚持与虚假保证；加“了”使中文更自然地呈现他们宣称局势已经安稳。
- source_word: וְאֵין שָׁלוֹם
  choice: 其实并没有平安
  rationale: 原句以现实否定前面的虚假宣告。“其实并没有”自然呈现强烈反差，同时不把שָׁלוֹם的广义安宁、健全与安全缩窄为单一层面。
theological_decisions:
- issue: 对虚假安慰的先知性控诉
  choice: 将经文译成对那些轻忽百姓严重创伤、虚称已有平安之人的控诉。
  alternative: 可将וַיְרַפְּאוּ理解为已经“治好了”，但这容易在中文中误示真正的复原已经发生。
  rationale: “医治”保留原文动词，又不必然表示成功；“草草”与末句“其实并没有平安”共同保留反讽、道德谴责及虚假保证与现实之间的张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“草草医治”保留医疗意象并显出敷衍；重复“平安了”保留原文的强调和虚假安慰。引号与标点依现代简体中文规范。
