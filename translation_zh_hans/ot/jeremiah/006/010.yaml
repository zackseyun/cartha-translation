id: JER.6.10
reference: Jeremiah 6:10
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: עַל מִ֨י אֲדַבְּרָ֤ה וְ/אָעִ֨ידָה֙ וְ/יִשְׁמָ֔עוּ הִנֵּה֙ עֲרֵלָ֣ה אָזְנָ֔/ם וְ/לֹ֥א יוּכְל֖וּ לְ/הַקְשִׁ֑יב הִנֵּ֣ה דְבַר יְהוָ֗ה הָיָ֥ה לָ/הֶ֛ם לְ/חֶרְפָּ֖ה לֹ֥א יַחְפְּצוּ בֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/006/010.yaml
  text: To whom shall I speak and give warning[a], that they may hear? Look, their ear is uncircumcised, and they are not able to listen. Look, the word of Yahweh has become a reproach to them[b]; they take no delight in it.
translation:
  language: zh_hans
  text: 我该向谁说话、提出警告，好叫他们听见呢？看哪，他们的耳朵未受割礼[a]，不能留心听。看哪，雅威的话在他们那里竟成了受讥诮的对象[b]；他们不以此为乐。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “耳朵未受割礼”是希伯来文的隐喻，表示他们不肯听从、对所传的话没有回应。
    reason: cultural_note
  - marker: b
    text: 或译：“雅威的话在他们看来竟成了可耻的。”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדַבְּרָה
  choice: 我可以……说话
  rationale: 第一人称未完成式在疑问句中带有商议和无奈的语气；“我可以向谁说话”自然保留这一修辞力量。
- source_word: וְאָעִידָה
  choice: 警告谁
  rationale: עוד 的使役式在先知语境中可指郑重作证或警告；正文采用符合语境的“警告”，脚注保留“作证”的可能。
- source_word: וְיִשְׁמָעוּ
  choice: 使他们听见
  rationale: 将连接词加未完成式理解为目的或结果，承接前面的修辞问句，同时不把“听见”进一步解释为“顺从”。
- source_word: עֲרֵלָה אָזְנָם
  choice: 他们的耳朵未受割礼
  rationale: 保留希伯来文身体与盟约意象，不将其扁平化为“耳朵闭塞”或“灵性耳聋”。
- source_word: לְהַקְשִׁיב
  choice: 留心听
  rationale: קשב 不只是声音感知，也含专注聆听之意；“留心听”与前面的“听见”形成恰当区别。
- source_word: דְבַר יְהוָה
  choice: 雅威的话
  rationale: 直接保留神圣四字名所指的盟约之名，并采用现代汉语中清楚的所有结构。
- source_word: הָיָה לָהֶם לְחֶרְפָּה
  choice: 竟成了他们所羞辱的
  rationale: חרפה 可指羞辱、耻辱或被讥诮的对象；此译呈现他们以轻蔑态度对待雅威的话，并以“竟”传达语境中的反常意味。
- source_word: לֹא יַחְפְּצוּ בוֹ
  choice: 他们不以此为乐
  rationale: חפץ 同时涉及喜悦与意愿；“不以此为乐”保留情感上的厌弃，也避免仅译为“不想要”的弱化。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；音译“雅威”保留专名性质，而不以称号替代。
- issue: “耳朵未受割礼”的盟约性隐喻
  choice: 在正文保留隐喻
  alternative: 他们的耳朵闭塞；他们在属灵上耳聋
  rationale: 割礼意象将他们不听与盟约上的悖逆联系起来；直译保留神学张力，解释放入脚注。
- issue: חרפה 的主客观关系
  choice: 雅威的话成了他们所羞辱的对象
  alternative: 雅威的话使他们蒙羞；雅威的话在他们看来是可耻的
  rationale: לָהֶם לְחֶרְפָּה 可以表达这话在他们那里成为受鄙视、受羞辱之物。正文避免把它明确限定为话语使他们蒙羞，同时脚注说明另一种自然理解。
translation_notes:
  register: 采用现代、庄重而可朗读的普通话。“看哪”保留 הִנֵּה 的先知宣告语气；“未受割礼”保留原文突出的盟约隐喻。正文以“警告”表达先知话语的实际功能，并避免过度古雅的“作见证”。
