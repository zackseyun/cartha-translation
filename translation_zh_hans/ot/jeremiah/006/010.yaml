  terminology: “雅威”与既定神名处理一致。“未受割礼”保留原文的盟约性身体隐喻，避免以解释性措辞取代正文。חֶרְפָּה宜表述为“讥诮／羞辱的对象”，而不是可能理解为雅威的话使他们蒙羞的“他们的羞辱”。
