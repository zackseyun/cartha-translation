base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/006/029.yaml
  text: The bellows blow fiercely[a]; the lead is consumed by the fire. In vain the refiner keeps refining[b], but the wicked are not separated out.
translation:
  language: zh_hans
  text: 风箱猛烈鼓风[a]，铅被火烧尽。炼了又炼，仍是徒然；恶人并没有被除去[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“风箱被烧焦；铅因火而耗尽。”这半句的希伯来文艰涩，风箱、火和铅之间的关系有不同理解。
    reason: textual_variant
  - marker: b
    text: “恶人并没有被除去”也可按冶炼比喻译作“杂质并没有被分离出来”。
    reason: lexical_alternative
lexical_decisions:
- source_word: נָחַר
  choice: 猛烈吹动
  rationale: 该动词本指喷气、喘息；以风箱为主语时，描写其强烈鼓风。这样既自然，也保留原文的力度。
- source_word: מַפֻּחַ
  choice: 风箱
  rationale: 指冶炼时用来增强火势的鼓风器具；“风箱”是现代汉语中清楚、常用的对应词。
- source_word: מ/אשת/ם
  choice: 被火
  rationale: 此处希伯来文本形态和句法艰涩。正文采用工具性理解，使其与铅在冶炼过程中耗尽相连，同时以脚注保留其他可能。
- source_word: עֹפָרֶת
  choice: 铅
  rationale: 该名词明确指铅，在古代冶炼中可能用作帮助分离杂质的材料。
- source_word: לַשָּׁוְא
  choice: 仍是徒然
  rationale: 表达冶炼工作没有达到目的；“徒然”简洁，并符合先知话语的庄重语体。
- source_word: צָרַף צָרוֹף
  choice: 炼了又炼
  rationale: 同根动词的重复强化或延续动作。“炼了又炼”在中文中保留反复冶炼的强调，也比补出“炼净者”更贴近原文形式。
- source_word: וְרָעִים
  choice: 恶人
  rationale: 该词通常指邪恶的人。虽然冶炼比喻可使人联想到杂质，正文仍保留其伦理和人物指向。
- source_word: נִתָּקוּ
  choice: 被除去
  rationale: 该动词在此表达未能从整体中移除或分离；“除去”既适合比喻，也保留对恶人的直接指称。
theological_decisions:
- issue: 冶炼比喻的解释
  choice: 正文既呈现失败的冶炼过程，也以“恶人”明确保留其对百姓道德败坏的指向。
  alternative: 完全按冶金术语译作“杂质没有被分离出来”。
  rationale: 上下文把冶炼用于检验和洁净百姓；但本节仍借真实冶炼场景说话，因此不应消除其字面意象，也不应把“恶人”改写成纯粹的物质杂质。
- issue: 首句艰涩文本的处理
  choice: 采用“风箱猛烈吹动，铅被火烧尽”作为正文。
  alternative: “风箱被烧焦；铅因他们的火而耗尽。”
  rationale: 希伯来文首句的形式和关系不确定。正文选取语境中较连贯的理解，脚注明确标示另一种主要译法，避免把不确定性隐藏起来。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“猛烈吹动”呈现风箱的强烈动作；“炼了又炼”保留希伯来文同根重复的强调。正文中的每个脚注标记均已对应列出。
