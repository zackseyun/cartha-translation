  text: כֶּ֣סֶף נִמְאָ֔ס קָרְא֖וּ לָ/הֶ֑ם כִּֽי מָאַ֥ס יְהוָ֖ה בָּ/הֶֽם־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/006/030.yaml
  text: They call them rejected silver[a], because Yahweh has rejected them.
translation:
  language: zh_hans
  text: 人称他们为“被弃的银子”[a]，因为耶和华已经弃绝他们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“废银”或“遭鄙弃的银子”。希伯来文采用炼银的比喻，指金属经过检验后被判定为无用。
    reason: 说明 נִמְאָס 的词义范围及炼银比喻，保留“拒绝、鄙弃、判为废物”等可能侧重。
lexical_decisions:
- source_word: כֶּסֶף
  choice: 银子
  rationale: 该词通常指“银”。本节延续炼银的比喻，所指是经检验后被判为无用的金属，而不是钱币；“银子”既自然，也保留了先知的意象。
- source_word: נִמְאָס
  choice: 被弃
  rationale: 这是 מאס 的被动分词，表示被拒绝、被厌弃。“被弃”适合修饰“银子”，并与后半句“弃绝”形成明显呼应。
- source_word: קָרְאוּ לָהֶם
  choice: 人称他们为
  rationale: 希伯来文用第三人称复数动词而未明说主语，可表达泛指的“人们”。译作“人称他们为”既保留主动表达，又不擅自指定具体说话者。
- source_word: כִּי
  choice: 因为
  rationale: 此处引出他们被称为“被弃的银子”的原因，译作“因为”清楚体现因果关系。
- source_word: מָאַס
  choice: 弃绝
  rationale: 与前面的 נִמְאָס 同源。用“被弃／弃绝”保留词根重复及判定为不合用的意味。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文读者熟悉的专名形式呈现希伯来文四字神名，不以“主”替代。
- source_word: בָּהֶם
  choice: 他们
  rationale: 介词 ב 在 מאס 后标示被弃绝的对象；现代汉语自然表达为“弃绝他们”。
theological_decisions:
- issue: 如何译出神名 יְהוָה
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名，应以专名译出，不泛化为“主”。“耶和华”是现代简体中文中最广为人知且庄重的形式；“雅威”则更接近部分学者采用的拟音。
- issue: 前后两次 מאס 是否保持呼应
  choice: 译为“被弃……弃绝”
  alternative: 译为“废银……弃绝”
  rationale: 前后同源词的重复是本句修辞和神学判断的关键；“被弃／弃绝”既能呼应，也避免把“废银”解释成纯粹的材料分类。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“人称他们为”表达原文未明确主语的第三人称复数；“被弃的银子”保留炼银意象，并与“耶和华已经弃绝他们”形成词语呼应。
