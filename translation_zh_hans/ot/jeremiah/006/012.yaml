  text: וְ/נָסַ֤בּוּ בָֽתֵּי/הֶם֙ לַ/אֲחֵרִ֔ים שָׂד֥וֹת וְ/נָשִׁ֖ים יַחְדָּ֑ו כִּֽי אַטֶּ֧ה אֶת יָדִ֛/י עַל יֹשְׁבֵ֥י הָ/אָ֖רֶץ נְאֻם יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/006/012.yaml
  text: Their houses will be turned over to others[a], together with their fields and wives; for I will stretch out my hand against the inhabitants of the land[b], declares Yahweh.
translation:
  language: zh_hans
  text: 他们的房屋，连同田地和妻子[a]，都必转归别人；因为我要伸手攻击这地[b]的居民。这是雅威的宣告。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“女人”。希伯来语 נָשִׁים 两义皆可；在房屋和田地被夺的语境中，“妻子”较可能。
    reason: lexical_alternative
  - marker: b
    text: 或译“大地的居民”。希伯来语 הָאָרֶץ 可指“这地”或“大地”；此处上下文较支持前者。
    reason: alternative_reading
lexical_decisions:
- source_word: וְנָסַבּוּ
  choice: 必转归
  rationale: 此处 סבב 的尼פעל形式表示财产易手、归给别人；“转归”自然地表达被剥夺后所有权转移的结果。
- source_word: בָתֵּיהֶם לַאֲחֵרִים
  choice: 他们的房屋……必转归别人
  rationale: 直译核心意象，不把 אֲחֵרִים 过度具体化为“陌生人”或“外族人”。
- source_word: שָׂדוֹת וְנָשִׁים יַחְדָּו
  choice: 连同田地和妻子，都
  rationale: “连同……都”表达 יַחְדָּו 所强调的一并丧失，并使整组名词共同受“转归别人”支配。
- source_word: נָשִׁים
  choice: 妻子
  rationale: 该词可指“女人”或“妻子”；在房屋、田地等家庭与产业被夺的语境中，“妻子”较可能，但以脚注保留另一词义。
- source_word: כִּי אַטֶּה אֶת־יָדִי עַל
  choice: 因为我要伸手攻击
  rationale: 保留 נטה יד 的圣经意象；介词 עַל 在审判语境中表达敌对行动，译作“攻击”清楚自然。
- source_word: יֹשְׁבֵי הָאָרֶץ
  choice: 这地的居民
  rationale: 结合耶利米书当前对犹大之地的审判语境，采用局部意义“这地”，同时用脚注保留“全地／大地”的可能。
- source_word: נְאֻם יְהוָה
  choice: 这是雅威的宣告
  rationale: 以庄重、清楚的现代汉语保留先知宣告公式，并将四字神名直接音译为“雅威”。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名；音译“雅威”可明确保留其专名性质，避免以称号代替。
- issue: הָאָרֶץ 的范围
  choice: 这地
  alternative: 全地；大地
  rationale: 上下文聚焦犹大及其居民所受的审判，因此局部意义较合适；但原词本身也可指更广泛的“大地”，故以脚注保留歧义。
- issue: נָשִׁים 所指的人群
  choice: 妻子
  alternative: 女人
  rationale: 产业和家庭一并被夺的语境支持“妻子”，但希伯来词在形式上不能排除一般的“女人”，故不将该歧义完全隐去。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“转归别人”准确表达产业易手；“连同……都”使并列关系清楚。“伸手攻击”保留原文审判行动的身体意象，而不改写为抽象的“惩罚”。
