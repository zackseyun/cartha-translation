source:
  edition: WLC
  text: כֻּלָּ/ם֙ סָרֵ֣י סֽוֹרְרִ֔ים הֹלְכֵ֥י רָכִ֖יל נְחֹ֣שֶׁת וּ/בַרְזֶ֑ל כֻּלָּ֥/ם מַשְׁחִיתִ֖ים הֵֽמָּה׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/006/028.yaml
  text: All of them are the most stubborn rebels[a], going about as slanderers; they are bronze and iron[d][c][b]; all of them are corrupters.
translation:
  language: zh_hans
  text: 他们全都是最顽梗的叛逆者[a]，四处搬弄是非[b]；他们是铜和铁[c]，全都是行败坏之事的人[d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“叛逆者中的叛逆者”或“为首的叛逆者”。原文的表达带有加强语气。
    reason: lexical_alternative
  - marker: b
    text: 或译“四处散布流言”“四处毁谤人”。
    reason: lexical_alternative
  - marker: c
    text: “铜和铁”很可能是比喻，可描写他们性情刚硬、品质低劣，或如未经炼净的金属；具体侧重点并不确定。
    reason: cultural_note
  - marker: d
    text: 或译“毁灭者”或“造成毁坏的人”。原词可指行败坏之事、使人败坏，或造成毁坏。
    reason: lexical_alternative
lexical_decisions:
- source_word: כֻּלָּם
  choice: 他们全都是
  rationale: 保留原文句首的强调和无一例外的整体范围，同时符合现代汉语表达。
- source_word: סָרֵי סוֹרְרִים
  choice: 最顽梗的叛逆者
  rationale: 这一希伯来语组合具有强化意味；译为“最顽梗的叛逆者”，比生硬直译更自然，也保留其强烈谴责。
- source_word: הֹלְכֵי רָכִיל
  choice: 到处搬弄是非
  rationale: 分词结构表示惯常行为；“搬弄是非”自然涵盖四处传话、散布流言乃至毁谤的含义。
- source_word: נְחֹשֶׁת וּבַרְזֶל
  choice: 铜和铁
  rationale: 直译金属意象，不在正文中限定其究竟强调坚硬、低劣还是未经炼净；其比喻作用交由脚注说明。
- source_word: מַשְׁחִיתִים
  choice: 败坏人的人
  rationale: 保留使役分词的主动意义，并体现 שׁחת 可指使人败坏或造成毁坏的语义幅度。
- source_word: הֵמָּה
  choice: （体现在）全都是……的人
  rationale: 以明确的判断句收束，传达原文结尾代词所加强的身份认定，不机械重复汉语代词。
theological_decisions:
- issue: “铜和铁”的比喻所指
  choice: 正文保留“铜和铁”，脚注仅列出可能表达的坚硬、低劣或未经炼净
  alternative: 在正文直接解释为“心硬如铜铁”或“都是渣滓”
  rationale: 原文意象简洁而含义并非完全单一，且与上下文炼净金属的图景有关；保留意象可避免过早消解其张力。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。“顽梗”“叛逆者”保留先知谴责的力度；“到处搬弄是非”使惯常的恶意传话行为易于普通读者理解。正文保留“铜和铁”的原始意象，并用脚注呈现其歧义。
