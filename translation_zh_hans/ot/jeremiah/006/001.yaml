base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/006/001.yaml
  text: Take cover[a], sons of Benjamin, from the midst of Jerusalem! Blow the trumpet in Tekoa, and raise a signal over Beth-haccherem, for disaster is looking down from the north[d][c][b], and great destruction.
translation:
  language: zh_hans
  text: 便雅悯人哪，你们要从耶路撒冷城中赶快避难[a]！要在提哥亚吹响号角，在伯哈基琳上举起警报信号[c][b]；因为灾祸已从北方俯视[d]，还有大毁灭。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“逃到安全的地方”，也可能是“聚集起来逃走”。这里的希伯来语命令式含义较难确定，重点似乎是迫切寻求安全。
    reason: lexical_alternative
  - marker: b
    text: “伯哈基琳”是地名，可能位于高处，处在耶路撒冷与提哥亚之间，适合设置警报信号。
    reason: cultural_note
  - marker: c
    text: 或译“举起信号火光”或“竖起信号标志”。原文没有明确说明信号的具体形式。
    reason: lexical_alternative
  - marker: d
    text: 原文直译是“灾祸已从北方俯视”，把将临的灾祸拟人化。
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעִזוּ
  choice: 赶快避难
  rationale: 该使役命令式在此处含义较难确定。结合吹角、示警和北方灾祸将临的语境，译作紧急寻求安全较为合适；“赶快”体现命令的迫切性。
- source_word: בְּנֵי בִנְיָמִן
  choice: 便雅悯的子孙
  rationale: 保留希伯来文的亲属称谓和支派身份；这里是对便雅悯群体的集体称呼。
- source_word: מִקֶּרֶב יְרוּשָׁלִַם
  choice: 从耶路撒冷城中
  rationale: קֶרֶב指内部或当中；加“城”使现代汉语表达清楚，同时不改变所指。
- source_word: וּבִתְקוֹעַ תִּקְעוּ שׁוֹפָר
  choice: 要在提哥亚吹响号角
  rationale: שׁוֹפָר是用于发出警报等用途的角；“吹响号角”既自然，也保留古代情境。
- source_word: וְעַל בֵּית הַכֶּרֶם
  choice: 在伯·哈基琳上
  rationale: עַל含“在……上”的空间意义；此地可能是设置警报信号的高处。地名采用音译，避免把专名误当普通名词。
- source_word: שְׂאוּ מַשְׂאֵת
  choice: 竖起警报信号
  rationale: מַשְׂאֵת指举起之物，在本语境中是示警用的信号；不具体限定为火光，以保留词义范围。
- source_word: כִּי רָעָה
  choice: 因为灾祸
  rationale: רָעָה在此指临到的灾难，而非抽象的道德邪恶。
- source_word: נִשְׁקְפָה
  choice: 已……俯临
  rationale: 该词带有从高处向下观看的意象。“俯临”在自然汉语中保留灾祸被拟人化、从北方压境的画面。
- source_word: מִצָּפוֹן
  choice: 从北方
  rationale: 直接保留方向；在耶利米书的语境中，这是入侵和审判来临的方向。
- source_word: וְשֶׁבֶר גָּדוֹל
  choice: 一场大毁灭
  rationale: שֶׁבֶר本义涉及破碎，在预言灾祸的语境中表示严重毁坏或毁灭；量词“一场”符合现代汉语。
theological_decisions:
- issue: 带性别色彩的支派称呼
  choice: 便雅悯的子孙
  alternative: 便雅悯人
  rationale: 保留原文“……之子”的支派性表达，同时在汉语中自然地作为群体称呼理解，不将其改成与原文形式无关的中性称谓。
- issue: 临近审判的措辞
  choice: 灾祸……大毁灭
  alternative: 邪恶……大破碎
  rationale: 这里的词语描写即将临到的灾难性审判，而不是在此对道德邪恶作抽象论述；译文不添加灾祸施行者或具体历史身份。
- issue: 灾祸的拟人化意象
  choice: 灾祸已从北方俯临
  alternative: 灾祸从北方出现
  rationale: “俯临”保留原文从高处向下观看的拟人化张力，避免用较平面的“出现”消除诗性意象。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。命令句保持紧迫感；地名用常见圣经音译形式。译文保留“俯临”的拟人化意象，并通过脚注说明首个命令式及警报信号的词义不确定性。
