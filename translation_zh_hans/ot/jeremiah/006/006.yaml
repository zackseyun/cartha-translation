source:
  edition: WLC
  text: כִּ֣י כֹ֤ה אָמַר֙ יְהוָ֣ה צְבָא֔וֹת כִּרְת֣וּ עֵצָ֔ה וְ/שִׁפְכ֥וּ עַל יְרוּשָׁלִַ֖ם סֹלְלָ֑ה הִ֚יא הָ/עִ֣יר הָפְקַ֔ד כֻּלָּ֖/הּ עֹ֥שֶׁק בְּ/קִרְבָּֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/006/006.yaml
  text: 'For thus says Yahweh of hosts: “Cut down trees[a], and heap up a siege ramp against Jerusalem. This is the city that must be punished[b]; there is nothing but oppression within her.”'
translation:
  language: zh_hans
  text: '因为万军之耶和华如此说：


    “你们要砍伐树木，


    向耶路撒冷堆筑攻城土坡。[a]


    这城就是那必须受惩罚的城；[b]


    城中尽是欺压。”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“向耶路撒冷倾倒攻城土坡”，指堆土筑起攻城工事。
    reason: 说明原文动词的字面意象及其攻城语境中的惯用含义。
  - marker: b
    text: 或译：“这就是那要受追讨的城。”这里的“追讨”指因罪被追究、受审判。
    reason: 保留 פקד 的词义张力，同时交代本节中的审判含义。
lexical_decisions:
- source_word: יְהוָה צְבָאוֹת
  choice: 万军之耶和华
  rationale: 保留盟约之名“耶和华”，并以现代中文圣经读者熟悉的“万军之”表达 צְבָאוֹת；该称号不限定为单指人间军队。
- source_word: כִּרְתוּ עֵצָה
  choice: 砍伐树木
  rationale: עֵצָה 在这里是集合用法，指为攻城工程预备木材；“砍伐树木”自然且保留具体意象。
- source_word: וְשִׁפְכוּ ... סֹלְלָה
  choice: 筑起攻城坡
  rationale: שׁפך 字面为“倾倒”，与 סֹלְלָה 连用时指堆筑攻城土坡；采用功能清楚而不过度解释的中文表达。
- source_word: עַל יְרוּשָׁלִַם
  choice: 攻打耶路撒冷
  rationale: 在攻城工事语境中，עַל 表示敌对指向；将其与“筑起攻城坡”连贯表达为“攻打耶路撒冷”。
- source_word: הִיא הָעִיר הָפְקַד
  choice: 这就是那必须受惩罚的城
  rationale: 保留 הִיא 的强调语气，并按此审判语境表达 פקד 的惩治含义；“必须”传达该城已被判定要受追讨。
- source_word: כֻּלָּהּ עֹשֶׁק בְּקִרְבָּהּ
  choice: 城中尽是欺压
  rationale: “尽是”保留 כֻּלָּהּ 的全面性，“城中”自然表达 בְּקִרְבָּהּ；“欺压”能涵盖 עֹשֶׁק 所指的压迫与强夺。
theological_decisions:
- issue: הָפְקַד 所表达的神圣追讨性质
  choice: 必须受惩罚
  alternative: 要被察看／要受追讨
  rationale: פקד 本身可表示临到、察看或追讨，但在先知宣告围城的上下文中显然带有司法审判意味；正文明确其惩罚性质，脚注保留“追讨”这一较贴近词语范围的表达。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。“万军之耶和华”保持传统经文语域；诗行式排版呈现神谕的命令与判词。正文不机械复制希伯来语序，但保留其强调、攻城意象和全面控诉。
