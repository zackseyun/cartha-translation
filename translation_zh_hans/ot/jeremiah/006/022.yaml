source:
  edition: WLC
  text: כֹּ֚ה אָמַ֣ר יְהוָ֔ה הִנֵּ֛ה עַ֥ם בָּ֖א מֵ/אֶ֣רֶץ צָפ֑וֹן וְ/ג֣וֹי גָּד֔וֹל יֵע֖וֹר מִ/יַּרְכְּתֵי אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/006/022.yaml
  text: 'Thus says Yahweh: Behold[a], a people is coming from the land of the north, and a great nation is stirred up from the farthest parts of the earth.'
translation:
  language: zh_hans
  text: '雅威如此说：


    “看哪，有一个民族正从北方之地来；

    有一个大国正从大地极远之处[a]被唤起。”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“大地的尽头”，也可译“那地偏远之处”。希伯来语所指的是边缘、尽头或遥远地区；אֶרֶץ既可指“大地”，也可指特定的“土地”。
    reason: 说明מִיַּרְכְּתֵי אָרֶץ在“尽头／偏远之处”和“大地／那地”两方面的词义可能性。
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  choice: 雅威如此说
  rationale: 保留先知宣告的使者公式及神的专名；“如此说”庄重而符合现代汉语圣经语体。
- source_word: הִנֵּה
  choice: 看哪
  rationale: 传达引人注意、使景象临到眼前的语用功能，也保留先知警告的庄严感。
- source_word: עַם בָּא
  choice: 有一族人正……而来
  rationale: עַם指一个族群；“正……而来”表达分词所呈现的正在逼近之感。
- source_word: מֵאֶרֶץ צָפוֹן
  choice: 从北方之地
  rationale: 同时保留“地”和“北方”，不将其简化为单纯的方向表达。
- source_word: וְגוֹי גָּדוֹל
  choice: 有一个大国
  rationale: 以“大国”表达גּוֹי גָּדוֹל，并与前面的עַם“一族人”保持词义和修辞上的区别。
- source_word: יֵעוֹר
  choice: 被唤起
  rationale: 保留Nifal未完成式的被动或反身色彩及即将动员起来的含义，不明说唤起者是谁。
- source_word: מִיַּרְכְּתֵי אָרֶץ
  choice: 从大地极远之处
  rationale: יַרְכְּתֵי表示边缘、尽头或遥远区域；此译法自然表达遥远性，同时避免把意象限定为某个精确地点。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”按现代普通话音译YHWH，保留其作为专名的性质，而不以称号代替。
- issue: 唤起大国的行动者
  choice: 采用“被唤起”，不明说行动者
  alternative: “雅威唤起一个大国”
  rationale: 希伯来文使用Nifal形式，但本句未明示行动者；译文保留这一含蓄之处，不凭语境补入神为施事者。
translation_notes:
  register: 采用庄重而可懂的现代标准普通话。“看哪”和“如此说”保留先知宣告的正式语气；“一族人／一个大国”再现原文近义平行中的词汇区别。脚注标记置于其实际说明的短语之后。
