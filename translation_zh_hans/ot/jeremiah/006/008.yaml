base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/006/008.yaml
  text: Be warned[a], O Jerusalem, lest my soul turn away from you, lest I make you a desolation[b], a land not inhabited.
translation:
  language: zh_hans
  text: 耶路撒冷啊，你要接受管教[a]，免得我的心离开你[b]，免得我使你成为荒凉、无人居住之地。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“你要受教”或“你要接受纠正”。原文动词指领受管教、训诫或纠正，不只是听见警告。
    reason: lexical_alternative
  - marker: b
    text: 原文也可译为“我的魂从你那里被扯开”或“我的心与你隔绝”。这里描写上帝与耶路撒冷关系的断裂。
    reason: lexical_alternative
lexical_decisions:
- source_word: הִוָּסְרִי
  choice: 你要接受管教
  rationale: 这是阴性单数的尼斐勒命令式，直接呼吁耶路撒冷领受管教或纠正。“接受管教”既保留被动／反身意味，也传达先知警告中要求悔改的力量。
- source_word: יְרוּשָׁלִַם
  choice: 耶路撒冷啊
  rationale: 采用通行中文地名，并以“啊”清楚表达呼格。
- source_word: פֶּן
  choice: 免得
  rationale: 两次出现均引出警告中的负面后果；重复译为“免得”，保留原文的平行结构和紧迫感。
- source_word: תֵּקַע נַפְשִׁי מִמֵּךְ
  choice: 我的心与你疏远
  rationale: 该短语描写耶和华的内在自我与耶路撒冷分离或疏远。“我的心”在现代汉语中自然地保留 נֶפֶשׁ 所表达的内在自我；“与你疏远”则呈现关系破裂，同时不把词义过度限定为物理撕裂。
- source_word: אֲשִׂימֵךְ שְׁמָמָה
  choice: 我使你荒凉
  rationale: שׂים 在此表示使耶路撒冷进入某种状态；שְׁמָמָה 表示荒废、毁坏后的荒凉景象。此译简洁自然，并保留审判宣告。
- source_word: אֶרֶץ לֹא נוֹשָׁבָה
  choice: 成为无人居住之地
  rationale: 此短语进一步说明荒凉的结果。“无人居住之地”贴近原文的否定被动分词结构，也符合现代汉语表达。
theological_decisions:
- issue: 上帝以 נַפְשִׁי（“我的魂／内在自我”）自称的拟人表达
  choice: 我的心与你疏远
  alternative: 我离弃你
  rationale: 原文并非仅说上帝采取离开的行动，而是以“我的魂／内在自我”为主语，生动表达关系上的厌离与撤回。译作“我的心”保留这一拟人张力，又避免“我的魂”在现代汉语中的生硬感及可能引发的实体化误读。
- issue: תֵּקַע 所表达的分离程度
  choice: 与你疏远
  alternative: 从你那里被扯开
  rationale: 该动词可指脱离、被扯开或变得疏远。正文采用关系性的“疏远”，与 נַפְשִׁי 搭配自然；脚注保留更具物理力度的可能译法，不武断排除其意象。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。保留两次“免得”的先知性平行结构；以“接受管教”表达命令的纠正意味，以“我的心与你疏远”保存原文拟人化及关系破裂的张力。所有脚注标记均置于相应正文短语之后。
