  text: כֹּ֤ה אָמַר֙ יְהֹוָ֣ה צְבָא֔וֹת עוֹלֵ֛ל יְעוֹלְל֥וּ כַ/גֶּ֖פֶן שְׁאֵרִ֣ית יִשְׂרָאֵ֑ל הָשֵׁב֙ יָדְ/ךָ֔ כְּ/בוֹצֵ֖ר עַל סַלְסִלּֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/006/009.yaml
  text: 'Thus says Yahweh of hosts: They will thoroughly glean the remnant of Israel as a vine[a]; pass your hand over the branches again like a grape-gatherer.'
translation:
  language: zh_hans
  text: '万军之耶和华如此说：

    “他们必把以色列的余民摘了又摘，

    像摘葡萄一样；

    你要像采葡萄的人，

    再把手伸向葡萄枝[a]。”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “葡萄枝”所译的希伯来词很少见，确切所指有争议；也可能指“卷须”，另有人理解为“筐子”。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהֹוָה צְבָאוֹת
  choice: 万军之耶和华
  rationale: 以“耶和华”音译圣名，以“万军之”表达其统领天上、地上一切军旅的称号；保留原文固定称谓的庄重感。
- source_word: עוֹלֵל יְעוֹלְלוּ
  choice: 必……摘了又摘
  rationale: 原文以同词根的不定式绝对式加强未完成式，表示彻底、反复地摘取；“摘了又摘”既保留葡萄采摘意象，也自然传达强调语气。
- source_word: כַגֶּפֶן
  choice: 像摘葡萄一样
  rationale: 原文直译为“像葡萄树”；结合动词“摘取”，汉语如此表达可清楚呈现把余民比作葡萄树上果实的意象，而不将比喻改成非农业性语言。
- source_word: שְׁאֵרִית יִשְׂרָאֵל
  choice: 以色列的余民
  rationale: “余民”准确对应 שְׁאֵרִית，保留审判之后所剩之人的语义及其经文术语色彩。
- source_word: הָשֵׁב יָדְךָ
  choice: 再把手伸向
  rationale: 字面为“使你的手返回”；在采摘场景中指再次伸手采摘。“再把手伸向”符合现代汉语，同时保留动作重复之意。
- source_word: כְּבוֹצֵר
  choice: 像采葡萄的人
  rationale: 明确指采收葡萄者；这一译法通俗、准确，并延续全节的葡萄园意象。
- source_word: עַל סַלְסִלּוֹת
  choice: 向葡萄枝
  rationale: סַלְסִלּוֹת 是罕见词；在葡萄采摘语境中，理解为葡萄树的枝条较为贴切，但其确切所指仍有争议，故以脚注保留其他可能。
theological_decisions:
- issue: 圣名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: “耶和华”是现代中文读者最熟悉且可辨识为以色列上帝专名的传统音译；不以泛称“主”替代，以保留原文圣名与主权称号的区别。
- issue: “以色列的余民”在本节中的处境
  choice: 保留为仍将遭到彻底采摘的对象
  alternative: 将“余民”解释为蒙保守、必然得救的群体
  rationale: 本节的审判语境形成明确张力：已经剩下的人仍被命令再次搜摘。译文不以系统神学预设消解这种张力。
translation_notes:
  register: 采用庄重而自然的现代标准普通话，并按诗行呈现。用“摘了又摘”传达原文加强结构及反复搜摘的审判意象；脚注明示罕见词的不确定性，不在正文中强行消除歧义。
