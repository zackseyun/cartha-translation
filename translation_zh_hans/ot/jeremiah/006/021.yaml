reference: Jeremiah 6:21
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: לָ/כֵ֗ן כֹּ֚ה אָמַ֣ר יְהוָ֔ה הִנְ/נִ֥י נֹתֵ֛ן אֶל הָ/עָ֥ם הַ/זֶּ֖ה מִכְשֹׁלִ֑ים וְ/כָ֣שְׁלוּ בָ֠/ם אָב֨וֹת וּ/בָנִ֥ים יַחְדָּ֛ו שָׁכֵ֥ן וְ/רֵע֖/וֹ יאבדו־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/006/021.yaml
  text: 'Therefore[a], thus says Yahweh: Behold, I am setting stumbling blocks before this people, and they will stumble over them—fathers and sons together[b]; neighbor and his friend will perish.'
translation:
  language: zh_hans
  text: 因此，耶和华如此说：“看哪，我要在这百姓面前设下绊脚石[a]；父亲和儿子必一同被它们绊倒[b]，邻舍和他的朋友也必灭亡。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “绊脚石”也可译作“障碍”。这里描写把使人跌倒之物放在路上。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译：“他们必被它们绊倒——父亲和儿子一同；邻舍和他的朋友必灭亡。”这里以家庭和邻里关系中的成对人物强调审判波及众人。
    reason: cultural_note
lexical_decisions:
- source_word: לָכֵן
  choice: 因此
  rationale: 保留承接上文指控并引出审判后果的推论关系。
- source_word: כֹּה אָמַר יְהוָה
  choice: 耶和华如此说
  rationale: 采用庄重而清楚的先知使者公式，并将四字神名译作“耶和华”。
- source_word: הִנְנִי
  choice: 看哪
  rationale: 保留宣告即将采取行动时的指示和强调语气；“看哪”在现代中文中略显庄重，但仍易于理解。
- source_word: נֹתֵן אֶל הָעָם הַזֶּה
  choice: 我要在这百姓面前设下
  rationale: 分词在此表达正在临近或确定要施行的行动；结合道路障碍的意象，将介词结构自然表达为“在……面前”。
- source_word: מִכְשֹׁלִים
  choice: 绊脚石
  rationale: 保留具体的障碍意象，也与随后“绊倒”形成原文的词根呼应。
- source_word: וְכָשְׁלוּ בָם
  choice: 必被它们绊倒
  rationale: 明确“它们”回指绊脚石，并保留绊脚石导致跌倒的语义；中文被动表达使句子自然。
- source_word: אָבוֹת וּבָנִים יַחְדָּו
  choice: 父亲和儿子必一同
  rationale: 按希伯来文保留男性亲属配对及“一同”的群体性强调，不泛化为父母和儿女。
- source_word: שָׁכֵן וְרֵעוֹ
  choice: 邻舍和他的朋友
  rationale: 分别保留近邻与朋友、同伴这两个彼此相关但不完全相同的社会关系词。
- source_word: יֹאבֵדוּ
  choice: 必灭亡
  rationale: 表达审判的严重结局，同时不把原文限定为某一种具体的毁灭方式。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。现代简体中文圣经语境中“耶和华”最广为普通读者识别，也明确将其作为专名而非以“主”这一称号替代；“雅威”则更接近部分学界采用的拟音。
- issue: 绊脚石是普通困难还是审判工具
  choice: 保留“设下绊脚石”的审判意象
  alternative: 译作“设置障碍”
  rationale: 上下文表明这是耶和华施行审判，但原文借道路上的绊脚物表达其方式；正文保留比喻，不进一步说明这些绊脚石具体指什么。
translation_notes:
  register: 采用现代、庄重而易懂的先知宣告语体。“看哪”“如此说”保留原文的郑重语气；“绊脚石／绊倒”保留希伯来文的词语呼应。标点将两组受审判者清楚分开，同时不消除原文简练而强烈的并列结构。
