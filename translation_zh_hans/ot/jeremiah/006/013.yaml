base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/006/013.yaml
  text: For from their least to their greatest[a], every one of them is greedy for unjust gain; and from prophet to priest[c][b], every one of them practices falsehood.
translation:
  language: zh_hans
  text: 因为他们从最小的到最大的[a]，个个都贪图不义之财[b]；从先知到祭司，个个都弄虚作假[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“从他们中最小的到最大的。”
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译为“贪图财利”；这里很可能指以不诚实或不公正手段取得的利益。
    reason: lexical_alternative
  - marker: c
    text: 或译：“行事虚假”或“施行欺诈”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，为先前的指控或审判说明缘由；现代汉语中“因为”自然保留解释性连接。
- source_word: מִקְּטַנָּם וְעַד גְּדוֹלָם
  choice: 从最小的到最大的
  rationale: 保留由小到大的总括式表达，涵盖群体中的各个层级，也不把“大小”过度限定为年龄、地位或财富。
- source_word: כֻּלּוֹ
  choice: 个个都
  rationale: 体现原文集合中逐一分配的语气，比单说“都”更能传达无一例外。
- source_word: בּוֹצֵעַ בָּצַע
  choice: 贪图不义之财
  rationale: 原文同根动词与名词连用，强调对利益的贪求，并常含不正当获利的负面意味；此译简洁而清楚。
- source_word: וּמִנָּבִיא וְעַד כֹּהֵן
  choice: 从先知到祭司
  rationale: 保留第二个总括式结构，点明宗教领袖各类职分都涉及其中。
- source_word: עֹשֶׂה שָּׁקֶר
  choice: 弄虚作假
  rationale: 表达持续以虚假、欺诈行事，而不只是偶然说一句谎话；用语现代、自然，同时保留道德谴责。
theological_decisions: []
