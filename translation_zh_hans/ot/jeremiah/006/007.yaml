id: JER.6.7
reference: Jeremiah 6:7
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כְּ/הָקִ֥יר בור מֵימֶ֔י/הָ כֵּ֖ן הֵקֵ֣רָה רָעָתָ֑/הּ חָמָ֣ס וָ֠/שֹׁד יִשָּׁ֨מַע בָּ֧/הּ עַל פָּנַ֛/י תָּמִ֖יד חֳלִ֥י וּ/מַכָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/006/007.yaml
  text: As a well keeps its waters fresh[a], so she keeps her evil fresh. Violence and destruction are heard in her[c][b]; before me continually are sickness and wounds.
translation:
  language: zh_hans
  text: 水井怎样不断涌出水来[a]，她也照样不断涌出恶事。城中传来暴力和毁灭[b]的声音；在我面前，疾病和创伤不断出现[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“蓄水池怎样使其中的水保持清凉（或新鲜），她也照样使自己的恶保持清凉（或新鲜）。”这里的希伯来语动词意义难定；也有人把这个意象理解为井不断出水，并以此比喻这城不断生出恶事。
    reason: lexical_alternative
  - marker: b
    text: “毁灭”也可译作“蹂躏”或“劫掠”。
    reason: lexical_alternative
  - marker: c
    text: 希伯来文直译：“在我面前常有疾病和创伤。”这既可能指实际的苦难，也可能比喻这城的状况。
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּהָקִיר / הֵקֵרָה
  choice: 怎样不断涌出……也照样不断涌出
  rationale: 这两个同根、彼此呼应的动词意义有争议，可能指使水清凉、保持新鲜，也可能在本句意象中指不断产生或涌出。正文采用“不断涌出”，既保留井水与恶事之间的平行，也自然表达耶路撒冷持续产生邪恶的意思；脚注保留另一种主要理解。
- source_word: בּוֹר
  choice: 水井
  rationale: 该词可指坑、蓄水池或井；因本句描写水不断供应或涌出，译作“水井”在现代汉语中最自然，同时在脚注说明“蓄水池”的可能。
- source_word: מֵימֶיהָ
  choice: 水
  rationale: 希伯来语形式为复数，但 מַיִם 通常是复数形态的集合名词；现代汉语用“水”最自然。
- source_word: רָעָתָהּ
  choice: 她……恶事
  rationale: 此处上下文谴责城中的暴力与毁灭，רָעָה 取道德意义。译作“恶事”比抽象的“邪恶”更能与“涌出”自然搭配，同时保留广泛含义。
- source_word: חָמָס וָשֹׁד
  choice: 暴力和毁灭
  rationale: חָמָס 指暴力、强暴或压迫；שֹׁד 可指毁灭、劫掠或蹂躏。正文采用宽泛而符合先知谴责语境的“暴力和毁灭”，其他可能见脚注。
- source_word: יִשָּׁמַע בָּהּ
  choice: 城中传来……的声音
  rationale: 被动式表达这些事在城里不断被人听见。“城中传来……的声音”符合现代汉语，也使复合主语与听觉意象清楚。
- source_word: עַל־פָּנַי תָּמִיד
  choice: 在我面前……不断出现
  rationale: 保留说话者上帝的第一人称视角，并以“不断出现”自然表达 תָּמִיד 的持续性。
- source_word: חֳלִי וּמַכָּה
  choice: 疾病和创伤
  rationale: 保留身体受损的具体意象，不预先判定它是字面疾病，还是对城中道德与社会状况的比喻。
theological_decisions:
- issue: 耶路撒冷的阴性人格化
  choice: 用“她”指这座城
  alternative: 用“它”或直接重复“这城”
  rationale: 希伯来文以阴性后缀人格化耶路撒冷；保留“她”可传达先知话语中的人格性和修辞力度，而不增添额外教义。
- issue: “疾病和创伤”是字面还是比喻
  choice: 保留具体身体意象，不在正文中作出判定
  alternative: 意译为“败坏和灾祸”或“痛苦和打击”
  rationale: 原文容许这些词既描写实际苦难，也比喻城市的道德和社会病况。直译具体意象可保存这种张力。
- issue: “在我面前”的说话者
  choice: 保留第一人称“我”
  alternative: 明说“在耶和华面前”
  rationale: 原文直接使用第一人称，语境表明说话者是耶和华；不在正文补出神名可保留原有话语形式。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“不断涌出”强化原文前后两个同根动词的平行；短句和分号保留先知宣告的节奏。用“她”维持耶路撒冷作为女性的拟人表达。
