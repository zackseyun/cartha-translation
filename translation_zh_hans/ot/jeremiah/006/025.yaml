base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/006/025.yaml
  text: Do not go out into the field[a], and do not walk on the road[b], for the sword of the enemy and terror are on every side.
translation:
  language: zh_hans
  text: 不要到田野去[a]，也不要在路上行走[b]，因为有仇敌的刀剑，四围都有惊恐。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “田野”也可译作“田地”或“野外”。
    reason: lexical_alternative
  - marker: b
    text: 原文两个动词都是阴性单数形式；这里很可能把耶路撒冷（锡安女子）当作受话者。
    reason: cultural_note
lexical_decisions:
- source_word: אַל תצאי
  choice: 不要走到
  rationale: אַל与未完成式构成禁止语气；תצאי为阴性单数第二人称。译作“不要走到”自然表达向外进入田野的动作。
- source_word: הַשָּׂדֶה
  choice: 田野里
  rationale: שׂדה可指田地或城外旷野；“田野里”直接且符合现代汉语。
- source_word: וּבַדֶּרֶךְ אַל תלכי
  choice: 也不要在路上行走
  rationale: 保留连接词、地点介词和הלך“行走”的基本意象，同时与前句“走到”形成自然变化。
- source_word: כִּי
  choice: 因为
  rationale: 引出两项禁令的理由。
- source_word: חֶרֶב לְאֹיֵב
  choice: 仇敌的刀剑
  rationale: לְאֹיֵב可表达归属或关联，直译为“仇敌的刀剑”既保留希伯来语结构，也维持威胁意象。
- source_word: מָגוֹר מִסָּבִיב
  choice: 四围的惊恐
  rationale: מָגוֹר表示惊恐、恐怖；מִסָּבִיב表示周围各处。“四围的惊恐”保留耶利米书中反复出现的凝练表达。
theological_decisions:
- issue: 警告对象的身份
  choice: 正文保留阴性单数在现代汉语中不可见的形式，不直接补出“耶路撒冷”或“锡安女子”
  alternative: 不要走到田野里，耶路撒冷啊……
  rationale: 原文只以阴性单数动词体现受话者，具体身份需由上下文推知；正文不应把推断写成明说，相关信息放入脚注。
- issue: 末句的句法关系
  choice: 把“仇敌的刀剑”和“四围的惊恐”一并理解为外面的危险
  alternative: 因为仇敌有刀剑；四围尽是惊恐
  rationale: 希伯来语是简短的名词性警语，允许不同的标点和关系理解。当前译法顺应禁令所指的处境，同时避免把“刀剑”仅解释成抽象暴力。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。两项禁令保持平行；“刀剑”“四围的惊恐”保留先知警告的具体意象和凝练力度。
