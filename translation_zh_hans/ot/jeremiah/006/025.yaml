  rationale: 修订首句以表达“出去／到……去”的动作，重译末句以保留“仇敌的刀剑”与“四围的惊恐”这两个并列威胁，并删去无原文依据且不自然的“都在那里”。同时校正词汇脚注，使其不将“田野”误导为“旷野”。
