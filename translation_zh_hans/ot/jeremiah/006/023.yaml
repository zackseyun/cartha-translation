source:
  edition: WLC
  text: קֶ֣שֶׁת וְ/כִיד֞וֹן יַחֲזִ֗יקוּ אַכְזָרִ֥י הוּא֙ וְ/לֹ֣א יְרַחֵ֔מוּ קוֹלָ/ם֙ כַּ/יָּ֣ם יֶהֱמֶ֔ה וְ/עַל סוּסִ֖ים יִרְכָּ֑בוּ עָר֗וּךְ כְּ/אִישׁ֙ לַ/מִּלְחָמָ֔ה עָלַ֖יִ/ךְ בַּת צִיּֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/006/023.yaml
  text: They seize bow and javelin; they are cruel and show no mercy. Their sound roars like the sea[a], and they ride on horses, arrayed like a man for battle against you, daughter Zion.
translation:
  language: zh_hans
  text: 他们手持弓和标枪；他们残酷无情，毫不怜悯。他们的声响如海涛轰鸣；他们骑着马，如战士般列阵备战[a]，要攻击你，锡安之女！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“如同一人，为战斗列阵。”原文“如同一个男子”既可指战士般的备战姿态，也可强调全军整齐一致，如同一人。
    reason: 保留 כְּאִישׁ 在战士比喻与统一阵形之间的词义歧义。
lexical_decisions:
- source_word: קֶשֶׁת
  choice: 弓
  rationale: 原文为单数，但在军事描写中可作集合或兵器名称使用；汉语用“弓”自然且忠实。
- source_word: כִידוֹן
  choice: 标枪
  rationale: 该词指可投掷或刺击的长柄兵器；“标枪”较“矛”更能保留其具体兵器色彩。
- source_word: יַחֲזִיקוּ
  choice: 手持
  rationale: 此处指拿住、持有兵器；“手持”符合现代汉语军事描写，又避免把动作强化为“挥舞”。
- source_word: אַכְזָרִי הוּא וְלֹא יְרַחֵמוּ
  choice: 他们残酷无情
  rationale: 原文前半句用形容词单数和单数代词指整个来犯民族，后半句转为复数；汉语以复数“他们”承接上下文，并把“不怜悯”自然表达为“无情”。
- source_word: קוֹלָם כַיָּם יֶהֱמֶה
  choice: 他们的声响如海涛轰鸣
  rationale: קוֹלָם 是军队发出的整体声响，יֶהֱמֶה 表示喧腾、轰鸣；加入“海涛”使汉语意象清楚，但不改变“如海”的比喻。
- source_word: וְעַל סוּסִים יִרְכָּבוּ
  choice: 他们骑着马
  rationale: 按现代汉语语序直接呈现骑马进军的画面。
- source_word: עָרוּךְ כְּאִישׁ לַמִּלְחָמָה
  choice: 像战士一样列阵
  rationale: עָרוּךְ 在军事语境中指为战斗排列整齐；כְּאִישׁ 字面为“像一个男子”，此处可描述战士般的备战姿态，也可能强调全军如一人，后者收入脚注。
- source_word: עָלַיִךְ בַּת צִיּוֹן
  choice: 要攻击你，锡安之女
  rationale: 保留第二人称阴性指向和对锡安城的女性人格化称呼；“锡安之女”是简洁、庄重且可识别的汉语表达。
theological_decisions:
- issue: בַּת צִיּוֹן 的人格化表达
  choice: 锡安之女
  alternative: 锡安女子
  rationale: 此语把锡安或耶路撒冷人格化为女子，并非指某一位具体女性。“锡安之女”保留原文诗性称呼及直接呼告，也不额外引入教派性解释。
- issue: כְּאִישׁ 的单数含义
  choice: 像战士一样
  alternative: 如同一人
  rationale: 原文既可描写军队像战士那样准备作战，也可把单数理解为强调队伍行动一致。正文采用在汉语中更顺畅的战士比喻，脚注保留统一列阵的可能。
translation_notes:
  register: 采用现代、庄重而易懂的先知性叙述。“残酷无情”“海涛轰鸣”“列阵”等词保持战争场面的力度；末尾用“锡安之女”保留诗性人格化和直接呼告。脚注标记置于实际存在歧义的“像战士一样列阵”之后。
