id: JER.6.16
reference: Jeremiah 6:16
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כֹּ֣ה אָמַ֣ר יְהוָ֡ה עִמְדוּ֩ עַל דְּרָכִ֨ים וּ/רְא֜וּ וְ/שַׁאֲל֣וּ לִ/נְתִב֣וֹת עוֹלָ֗ם אֵי זֶ֨ה דֶ֤רֶךְ הַ/טּוֹב֙ וּ/לְכוּ בָ֔/הּ וּ/מִצְא֥וּ מַרְגּ֖וֹעַ לְ/נַפְשְׁ/כֶ֑ם וַ/יֹּאמְר֖וּ לֹ֥א נֵלֵֽךְ־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/006/016.yaml
  text: 'Thus says Yahweh: “Stand by the roads and look[a], and ask for the ancient paths, where the good way is; then walk in it, and find rest for your souls. But they said[b], ‘We will not walk in it.’”'
translation:
  language: zh_hans
  text: '耶和华如此说：


    “你们要站在路旁察看，


    询问古老的路径[a]：


    哪一条是善道；


    就行在其中，


    使你们自己得安歇。[b]”


    但他们说：


    “我们不走！”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “古老的路径”也可译作“古时的路径”或“恒久的路径”。
    reason: 保留 עוֹלָם 所含久远、长久的词义幅度。
  - marker: b
    text: “你们自己”直译为“你们的生命（נֶפֶשׁ）”；也可译作“你们的心灵”或“你们的生命”。
    reason: 保留 נֶפֶשׁ 可指自身、生命或内在之人的词义幅度，避免将其限定为单一的人论意义。
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的神名音译“耶和华”，明确呈现专名，而不以“主”这一称号替代。
- source_word: עַל דְּרָכִים
  choice: 在路旁
  rationale: 希伯来语可指在道路上或道路旁；“在路旁”保留道路意象，又不将场景过度具体化为原文未明说的“十字路口”。
- source_word: וּרְאוּ
  choice: 察看
  rationale: 兼顾实际观看与审慎辨察，在道路隐喻中比单纯“看”更能传达语境中的慎重意味。
- source_word: לִנְתִבוֹת עוֹלָם
  choice: 古老的路径
  rationale: עוֹלָם 在此最自然地指久远、古时；“古老的路径”保留复数和道路意象，同时不排除“恒久路径”的词义可能。
- source_word: אֵי זֶה דֶרֶךְ הַטּוֹב
  choice: 问哪一条是善道
  rationale: אֵי זֶה 在此要求辨明哪条路；“善道”简洁庄重，并保留定冠词所指的那条好路。
- source_word: וּלְכוּ בָהּ
  choice: 就行在其中
  rationale: 保留“行走”作为生活方式的隐喻；“其中”准确回指阴性单数的“道”。
- source_word: מַרְגּוֹעַ
  choice: 安歇
  rationale: 表达安息、舒缓和安稳，语体庄重而自然。
- source_word: לְנַפְשְׁכֶם
  choice: 你们的心灵
  rationale: נֶפֶשׁ 可指人自身、生命或内在之人；“心灵”在中文中自然表达深层的个人安歇，同时以脚注保存其他可能。
- source_word: וַיֹּאמְרוּ
  choice: 但他们说
  rationale: 连接词形式上可译“于是/他们说”，但上下文呈现明确转折和拒绝，故译“但”。
- source_word: לֹא נֵלֵךְ
  choice: 我们不走
  rationale: 按希伯来语简洁直译，不补出“其中”；所拒绝的道路可由上文自然领会。
theological_decisions:
- issue: נֶפֶשׁ 所指的人的层面
  choice: 你们的心灵
  alternative: 你们自己／你们的生命
  rationale: 此处应许的是全人深处的安歇。“心灵”符合现代中文表达，但不把 נֶפֶשׁ 限定为与身体截然分离的实体；脚注保留其“自己、生命”的语义范围。
- issue: עוֹלָם 描写路径的时间含义
  choice: 古老的路径
  alternative: 恒久的路径
  rationale: 语境呼吁百姓回到久已确立的正道，“古老”较为贴切；但原词也可强调长久、恒常，故在脚注中保留。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语，并以诗行呈现神谕的平行结构。保留道路与行走的核心隐喻；避免把场景明确化为“十字路口”，也避免将 נֶפֶשׁ 技术化为二元论意义上的“灵魂”。
