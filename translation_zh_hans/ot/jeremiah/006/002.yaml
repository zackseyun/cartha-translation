base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/006/002.yaml
  text: I have likened daughter Zion to a lovely and delicate woman[a].
translation:
  language: zh_hans
  text: 我把锡安女儿比作一位秀美娇嫩的女子。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我要毁灭秀美娇嫩的锡安女儿。”这里的希伯来语动词较难确定；有人认为它表示“毁灭”，而不是“比作”。
    reason: alternative_reading
lexical_decisions:
- source_word: הַנָּוָה
  choice: 秀美
  rationale: 此处是阴性单数形容词，与“娇嫩”并列，用来描写拟人化的锡安；“秀美”自然、庄重，也不引入该词根在其他语境中可能有的居所或牧场含义。
- source_word: וְהַמְּעֻנָּגָה
  choice: 娇嫩
  rationale: 该词源于ענג，表示柔嫩、精致或养尊处优；“娇嫩”既与“秀美”形成自然的诗意搭配，也避免像“娇生惯养”那样加入明显的贬义判断。
- source_word: דָּמִיתִי
  choice: 我把……比作
  rationale: 按דמה的常见Qal词义及本句句法，第一人称单数最自然地表示“我比作”。不过，此词在本节的解释存在困难，也可能被理解为“毁灭”，故在脚注保留异读。
- source_word: בַּת צִיּוֹן
  choice: 锡安女子
  rationale: 这是先知书中把锡安人格化为女性的惯用表达。“锡安女子”在现代汉语中比直译为“锡安的女儿”更自然，同时保留女性人格化意象。
- source_word: implicit feminine referent
  choice: 女子
  rationale: 两个形容词均为阴性单数，语境隐含一位女性形象。汉语为使“比作”的对象完整自然，补出“女子”；这比“少女”更少加入年龄信息。
theological_decisions:
- issue: 本节中心意象的解释
  choice: 耶和华把锡安女子比作一位秀美娇嫩的女子。
  alternative: 也可能是：“我要毁灭秀美娇嫩的锡安女子。”
  rationale: דָּמִיתִי在这里历来被视为难解。其较直接的词义和句中两个阴性形容词支持“比作”的理解；但其可能具有毁灭或使之沉寂的含义，因此不在正文中混合两种解释，而以脚注保存真实的歧义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“秀美娇嫩”保留原文两个并列阴性形容词的诗意；“锡安女子”体现先知文学中的人格化表达。
