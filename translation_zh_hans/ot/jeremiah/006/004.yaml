revisions:
- from: 你们要把攻打她的战争分别为圣！起来吧，我们中午就上去！我们有祸了！因为白昼正在转逝，傍晚的影子越伸越长。
  to: 你们要将攻打她的战争分别为圣！起来吧，我们要在正午上去！我们有祸了！因为白日已经西斜，暮影渐渐拉长。
  rationale: 修订仅改善汉语自然度与经文语体：以“将”调整处置式句法；以“在正午”明确时间状语；以“白日已经西斜”自然表达白日转向晚暮；以“暮影渐渐拉长”保留晚影延展意象。原文的战争神圣化语言、城市拟人化代词和“上去”的字面军事意象均予保留。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T07:22:25Z'
review_pass:
  verdict: revise
  source_fidelity: 译文总体准确传达了敌军的复数命令、对耶路撒冷（阴性“她”）的敌对方向、正午进军，以及因日暮将临而发出的哀叹。惟“白昼正在转逝”虽试图保留פנה的“转”意象，却不符合自然汉语；以“白日已经西斜”准确表达此处日光转向晚暮的语境含义。
  naturalness: “把攻打她的战争分别为圣”可理解，但“将……分别为圣”更合乎庄重现代汉语的书面句法。“暮影渐渐拉长”比“傍晚的影子越伸越长”更凝练自然，仍保留影子延展的画面。
  terminology: “分别为圣”恰当保留קדשׁ在军事语境中的神圣化／奉献语言，不淡化为“备战”，也不额外暗示神对该战争的认可。“上去”保留עלה的空间与进军意象。
