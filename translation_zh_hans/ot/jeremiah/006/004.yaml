  text: קַדְּשׁ֤וּ עָלֶ֨י/הָ֙ מִלְחָמָ֔ה ק֖וּמוּ וְ/נַעֲלֶ֣ה בַֽ/צָּהֳרָ֑יִם א֥וֹי לָ֨/נוּ֙ כִּי פָנָ֣ה הַ/יּ֔וֹם כִּ֥י יִנָּט֖וּ צִלְלֵי עָֽרֶב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/006/004.yaml
  text: Consecrate war against her; rise up[a], and let us go up at noon. Woe to us, for the day is turning away, for the shadows of evening are stretching out.
translation:
  language: zh_hans
  text: 你们要将攻打她的战争分别为圣！起来吧，我们要在正午上去！我们有祸了！因为白日已经西斜，暮影渐渐拉长。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קַדְּשׁוּ ... מִלְחָמָה
  choice: 把……战争分别为圣
  rationale: 保留קדשׁ的分别、奉献语言，以及古代战争语境中的宗教性军事表达；正文不将其淡化为单纯的“备战”。
- source_word: עָלֶיהָ
  choice: 攻打她的
  rationale: 介词עַל与“战争”连用时表示敌对方向；阴性代词按上下文指城，译作“她”保留原文拟人化。
- source_word: קוּמוּ
  choice: 起来吧
  rationale: 传达复数命令式的紧迫号召，现代汉语自然有力。
- source_word: וְנַעֲלֶה
  choice: 我们……就上去
  rationale: 保留עלה“上去”的空间和军事进发意象，不直接释为“进攻”。
- source_word: בַצָּהֳרָיִם
  choice: 中午
  rationale: 准确表达正午时分；加“就”体现说话者催促立即行动的语气。
- source_word: אוֹי לָנוּ
  choice: 我们有祸了
  rationale: 以自然庄重的现代汉语表达哀叹和受挫之感。
- source_word: כִּי פָנָה הַיּוֹם
  choice: 因为白昼正在转逝
  rationale: “转逝”既保留פנה的“转向”意象，也清楚表达日光将尽。
- source_word: יִנָּטוּ צִלְלֵי עָרֶב
  choice: 傍晚的影子越伸越长
  rationale: “伸”对应נטה的延展意象，“越……越长”则符合现代汉语对暮影渐长的表达。
theological_decisions:
- issue: קַדְּשׁוּ ... מִלְחָמָה中的宗教—军事习语
  choice: 正文译作“把攻打她的战争分别为圣”
  alternative: “准备攻打她”或“备战攻打她”
  rationale: 保留原文将战争加以分别、奉献的神圣化语言，但不额外断言上帝认可侵略者的行动。
translation_notes:
  register: 采用庄重而可懂的现代标准汉语，以短促感叹句再现敌军先催战、后因日暮而懊恼的戏剧性。保留城市的阴性拟人称谓“她”和“上去”的原文空间意象。
