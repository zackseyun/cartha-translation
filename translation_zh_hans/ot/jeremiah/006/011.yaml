id: JER.6.11
reference: Jeremiah 6:11
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/אֵת֩ חֲמַ֨ת יְהוָ֤ה מָלֵ֨אתִי֙ נִלְאֵ֣יתִי הָכִ֔יל שְׁפֹ֤ךְ עַל עוֹלָל֙ בַּ/ח֔וּץ וְ/עַ֛ל ס֥וֹד בַּחוּרִ֖ים יַחְדָּ֑ו כִּֽי גַם אִ֤ישׁ עִם אִשָּׁה֙ יִלָּכֵ֔דוּ זָקֵ֖ן עִם מְלֵ֥א יָמִֽים׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/006/011.yaml
  text: But I am full of the wrath of Yahweh[a]; I am weary of holding it in. Pour it out on the child in the street, and on the company of young men together; for both man and woman will be taken[b], the old man along with the very aged.
translation:
  language: zh_hans
  text: 但我充满了耶和华的烈怒[a]，再也无力忍住。把这烈怒倾倒在街上的孩童和聚在一起的青年人身上吧！因为男人和女人都必被捉拿，老人和年事已高的人[b]也一样。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “烈怒”也可译作“愤怒”或“震怒”。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“满了日子的人”，是指年纪很大、年事已高的人。
    reason: idiom_explanation
lexical_decisions:
- source_word: חֲמַת יְהוָה
  choice: 耶和华的烈怒
  rationale: חֵמָה表示炽烈的怒气；“烈怒”保留先知审判语境中的强度。“耶和华”直接呈现专名יהוה。
- source_word: מָלֵאתִי
  choice: 我充满了
  rationale: 完成式在此表示形成后持续至今的状态；这一译法自然承接下文无法再容纳。
- source_word: נִלְאֵיתִי הָכִיל
  choice: 再也无力忍住
  rationale: נלא表示疲乏、力竭，הכיל表示容纳或抑制；合译既保留精疲力尽之意，也自然呈现压抑烈怒的意象。
- source_word: שְׁפֹךְ
  choice: 把这烈怒倾倒……吧
  rationale: 保留“倾倒”的具体意象，并明示由上文补出的宾语“这烈怒”；句末“吧”使祈使语气在现代汉语中自然，同时不指定执行者。
- source_word: עוֹלָל
  choice: 孩童
  rationale: 指年幼的孩子；“孩童”庄重自然，又不把年龄范围过度限定为婴儿。
- source_word: בַּחוּץ
  choice: 在街上的
  rationale: חוּץ在此指公共的户外或街道空间；“街上”符合上下文。
- source_word: סוֹד בַּחוּרִים יַחְדָּו
  choice: 聚在一起的青年人
  rationale: סוֹד可指圈子、群体或聚集；结合יַחְדָּו，译为“聚在一起”可避免误解为正式议会。
- source_word: יִלָּכֵדוּ
  choice: 都必被捉拿
  rationale: לכד的Niphal式表示被捕获或被擒；“被捉拿”保留审判和敌军临到的广泛语境。
- source_word: אִישׁ עִם אִשָּׁה
  choice: 男人和女人
  rationale: 此处为泛指两性，不应限定为夫妻。
- source_word: זָקֵן עִם מְלֵא יָמִים
  choice: 老人和年事已高的人
  rationale: 保留两个并列年龄称谓，并将“满了日子”这一希伯来习语译成现代汉语的“年事已高”。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名；“耶和华”是现代简体中文圣经语境中最广为人知的专名形式，避免以“主”代替而遮蔽原文专名。
- issue: “倾倒”的说话者、执行者与句法关系
  choice: 保留祈使表达，但不明说执行者
  alternative: 译作先知陈述自己将要倾倒，或明确说是耶和华命令先知倾倒
  rationale: 希伯来语行文紧凑，שְׁפֹךְ可按祈使式理解，但上下文没有明示执行者。中文用无主语祈使句，保留原文的张力而不额外判定。
- issue: 烈怒与先知的关系
  choice: 译为先知“充满”耶和华的烈怒并无力忍住
  alternative: 把先知的话处理成耶和华直接发言
  rationale: 第一人称形式最自然地承接先知的发言；同时“耶和华的烈怒”说明怒气源于神，不将其简化为先知个人的愤怒。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“再也无力忍住”传达疲惫与无法继续容纳的双重含义；末句用“也一样”承接“都必被捉拿”，避免重复过重，同时保持各年龄与性别群体无一例外的审判范围。所有脚注标记均置于其所解释的词语之后。
