  text: Rise up[a], and let us go up by night, and let us destroy her palaces.
translation:
  language: zh_hans
  text: 起来！让我们趁夜上去，摧毁她的宫殿[a]！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“堡垒”或“城堡”。希伯来语这个词既可指宫殿，也可指高大而设防的建筑。
    reason: lexical_alternative
lexical_decisions:
- source_word: ק֚וּמוּ
  choice: 起来
  rationale: 阳性复数祈使式，直接号召众人行动；“起来”既自然，也保留军事召集的急迫感。
- source_word: וְ/נַעֲלֶ֣ה
  choice: 让我们……上去
  rationale: 第一人称复数鼓励式，表达共同采取行动的倡议。“上去”保留עלה的基本意象，不直接释作“进攻”，从而避免过度解释。
- source_word: בַ/לָּ֔יְלָה
  choice: 趁夜
  rationale: 介词短语表示行动时间；“趁夜”在现代汉语中自然，并传达利用夜间发动攻势的语境。
- source_word: וְ/נַשְׁחִ֖יתָה
  choice: 摧毁
  rationale: 使役词干第一人称复数鼓励式，表示有意实施毁坏；“摧毁”准确而有力度。
- source_word: אַרְמְנוֹתֶֽי/הָ
  choice: 她的宫殿
  rationale: 该复数名词带第三人称阴性单数后缀，指拟人化城邑的宏伟建筑或设防建筑；正文采用常见义“宫殿”，脚注保留“堡垒”等语义可能。
