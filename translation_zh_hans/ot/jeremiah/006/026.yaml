id: JER.6.26
reference: Jeremiah 6:26
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: בַּת עַמִּ֤/י חִגְרִי שָׂק֙ וְ/הִתְפַּלְּשִׁ֣י בָ/אֵ֔פֶר אֵ֤בֶל יָחִיד֙ עֲשִׂ֣י לָ֔/ךְ מִסְפַּ֖ד תַּמְרוּרִ֑ים כִּ֣י פִתְאֹ֔ם יָבֹ֥א הַ/שֹּׁדֵ֖ד עָלֵֽי/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/006/026.yaml
  text: Daughter of my people[a], put on sackcloth and roll in ashes; make mourning as for an only son, a most bitter lamentation[c][b], for suddenly the destroyer will come upon us.
translation:
  language: zh_hans
  text: 我民的女儿啊[a]，要腰束麻布，在灰中打滚；要为自己作如丧独生子[b]般的哀悼，发出极其悲苦的哀号；因为毁灭者必突然临到我们[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “我民的女儿”是把百姓人格化为女儿的称呼。
    reason: clarification
  - marker: b
    text: 原文直译为“独一者的哀悼”；在这里指如同丧失独生子那样哀痛。
    reason: lexical_alternative
  - marker: c
    text: 原文是“临到我们”，保留了先知把自己包括在百姓之中的人称转换；有些译本为使人称一致而译作“临到你”或“临到你们”。
    reason: alternative_reading
lexical_decisions:
- source_word: בַּת עַמִּי
  choice: 我民的女儿啊
  rationale: 保留希伯来文直接呼语和将百姓人格化为“女儿”的先知性意象；“啊”使现代汉语呼语自然庄重。
- source_word: חִגְרִי שָׂק
  choice: 要腰束麻布
  rationale: חגר本义为束在腰间；“腰束麻布”既保留具体动作，也清楚表达哀悼习俗。
- source_word: וְהִתְפַּלְּשִׁי בָאֵפֶר
  choice: 在灰中打滚
  rationale: 该反身词形描绘人在灰尘中翻滚或辗转的强烈哀悼动作；译文保留其具体而剧烈的形象。
- source_word: אֵבֶל יָחִיד
  choice: 如同哀悼独生子
  rationale: 直译近于“独一者的哀悼”；在哀悼语境中通常指丧失独生子所带来的极深悲痛。
- source_word: עֲשִׂי לָךְ
  choice: 要为自己哀悼
  rationale: 保留命令式以及לָךְ的反身意味，同时采用自然的现代汉语表达。
- source_word: מִסְפַּד תַּמְרוּרִים
  choice: 发出极其苦痛的哀号
  rationale: מִסְפַּד指为死者哀哭、号哭；复数形式תַּמְרוּרִים具有强化作用，“极其苦痛”传达其强度。
- source_word: כִּי פִתְאֹם
  choice: 因为……突然
  rationale: 保留כִּי引出的原因关系，并以“突然”表达灾祸猝然来到。
- source_word: הַשֹּׁדֵד
  choice: 毁灭者
  rationale: 该分词可指劫掠者、蹂躏者或毁灭者；上下文强调全面灾害，“毁灭者”涵盖其破坏性而不限于夺财。
- source_word: עָלֵינוּ
  choice: 临到我们
  rationale: 严格保留第一人称复数，呈现先知由对百姓说话转而把自己包括在受灾群体中的修辞变化。
theological_decisions:
- issue: 从第二人称阴性呼语转为第一人称复数结语
  choice: 保留“我民的女儿啊……临到我们”的人称转换
  alternative: 为求表面一致而译作“临到你”或“临到你们”
  rationale: 马所拉文本明确使用עָלֵינוּ“我们”；保留这一转换体现先知与百姓认同并共同置身审判之下，不应擅自调和。
- issue: יָחִיד在哀悼语境中的指称
  choice: 译为“独生子”，并用脚注说明字面范围
  alternative: 译为“独生的孩子”或“独一者”
  rationale: 相关先知书哀悼用语通常以独生子象征最惨痛的丧失；正文采用合乎语境的传统含义，同时脚注保留原词的概括性。
translation_notes:
  register: 采用现代、庄重且可朗读的标准普通话。“腰束麻布”“在灰中打滚”保留古代哀悼动作的具体形象；“哀号”传达 מִסְפַּד 的声音与强烈悲情。脚注标记按正文出现顺序排列。
