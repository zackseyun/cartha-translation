id: JER.6.19
reference: Jeremiah 6:19
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: שִׁמְעִ֣י הָ/אָ֔רֶץ הִנֵּ֨ה אָנֹכִ֜י מֵבִ֥יא רָעָ֛ה אֶל הָ/עָ֥ם הַ/זֶּ֖ה פְּרִ֣י מַחְשְׁבוֹתָ֑/ם כִּ֤י עַל דְּבָרַ/י֙ לֹ֣א הִקְשִׁ֔יבוּ וְ/תוֹרָתִ֖/י וַ/יִּמְאֲסוּ בָֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/006/019.yaml
  text: 'Hear[a], O earth: behold, I am bringing disaster on this people, the fruit of their thoughts, because they have not listened to my words[b], and they have rejected my law.'
translation:
  language: zh_hans
  text: 地啊，要听！看哪，我正要使灾祸临到这百姓，作为他们意念所结的果子[a]；因为他们不留心听我的话，也厌弃了我的律法[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们计谋的结果”或“他们计划的后果”。
    reason: מַחְשְׁבוֹת 可指思想、意念，也可指谋划；不同译法分别强调源文隐喻或结果含义。
  - marker: b
    text: 或译：“我的教导”。希伯来语 תּוֹרָה 可指“律法”或“教导”；正文采用“律法”，以保留本节立约指控的分量。
    reason: 保留 תּוֹרָה 在此语境中的真实词义选择。
lexical_decisions:
- source_word: שִׁמְעִי הָאָרֶץ
  choice: 地啊，要听
  rationale: 阴性单数祈使式把“地”人格化，作为受召聆听的见证者。“地”比“国土”更能保留这一先知性呼告的广度与庄重语气。
- source_word: הִנֵּה
  choice: 看哪
  rationale: 用于引出庄严的神谕宣告；“看哪”既保留提示和强调作用，也符合现代中文圣经语体。
- source_word: אָנֹכִי מֵבִיא רָעָה
  choice: 我正要使灾祸临到
  rationale: רָעָה 在此指审判性的灾难，并非道德意义上的邪恶。“正要”表达分词结构所带出的临近、正在展开之感，同时避免生硬的“正在带来”。
- source_word: הָעָם הַזֶּה
  choice: 这百姓
  rationale: 保留单数集合名词及先知责备中带有距离感的指称；“百姓”在庄重而通俗的中文中自然。
- source_word: פְּרִי מַחְשְׁבוֹתָם
  choice: 他们意念所结的果子
  rationale: 保留“果子”的源文隐喻，表明临到的审判是其内在思想、打算所产生的结果；“意念”也保留 מַחְשָׁבוֹת 可指思想或谋划的语义宽度。
- source_word: עַל דְּבָרַי לֹא הִקְשִׁיבוּ
  choice: 他们不留心听我的话
  rationale: הקשיב 表示专心听取、留意；译为“不留心听”比直接译成“不顺服”更贴近词义，同时让上下文自然显出悖逆的含义。
- source_word: וְתוֹרָתִי
  choice: 我的律法
  rationale: תּוֹרָה 可指教导或律法；在此立约审判的语境中，“律法”较能表达上帝启示之规范的约束力，同时以脚注保留“教导”这一可行译法。
- source_word: וַיִּמְאֲסוּ בָהּ
  choice: 也厌弃了
  rationale: מָאַס 含拒绝、鄙弃之意。“厌弃”比一般的“拒绝”更能保留其轻蔑和排斥的力度，且与“律法”搭配自然。
theological_decisions:
- issue: 立约语境中 תּוֹרָה 的译法
  choice: 我的律法
  alternative: 我的教导
  rationale: 本节指控百姓拒绝耶和华所启示、具有约束力的准则。“律法”保留司法和立约层面的分量；但源词并不限于法规，因此脚注列出“教导”，不把其语义范围静默缩窄。
- issue: “意念的果子”与灾祸之间的关系
  choice: 作为他们意念所结的果子
  alternative: 即他们计谋的结果
  rationale: 将该短语理解为说明灾祸与百姓自身意念之产物相对应，但不进一步断定这是纯粹自然后果还是直接刑罚；保留源文中神主动降灾与人的意念结出后果两方面的张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“地啊，要听！看哪”保留先知宣告的呼告语气；正文避免过度口语化。“意念所结的果子”有意保留源文隐喻。脚注标记按其实际所解释的词语放置在“果子”和“律法”之后；英语咨询层中的标记位置与脚注内容不一致，未予照搬。
