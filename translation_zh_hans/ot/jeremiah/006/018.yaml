id: JER.6.18
reference: Jeremiah 6:18
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: לָ/כֵ֖ן שִׁמְע֣וּ הַ/גּוֹיִ֑ם וּ/דְעִ֥י עֵדָ֖ה אֶת אֲשֶׁר בָּֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/006/018.yaml
  text: Therefore hear[a], O nations, and know, O congregation[b], what is among them.
translation:
  language: zh_hans
  text: 因此，列国啊，你们要听！会众[a]啊，你要知道他们中间有什么。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“集会”或“群体”。希伯来语 עֵדָה 是集合名词，此处确切指谁，仍有争议。
    reason: lexical_alternative
  - marker: b
    text: 或译“他们里面有什么”。原文表达简约，既可指他们里面的情形，也可指他们中间的情形。
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: 因此
  rationale: 承接上文的指控与审判，表示由此得出的结果；“因此”庄重自然，也保留原文的推论关系。
- source_word: שִׁמְעוּ
  choice: 你们要听
  rationale: 这是复数命令式，向“列国”发出先知性的召唤；“听”既贴近基本词义，也可包含留心听从之意。
- source_word: הַגּוֹיִם
  choice: 列国
  rationale: 该词通常指各国或各民族；“列国”符合先知文体，又不额外限定为宗教意义上的“外邦人”。
- source_word: וּדְעִי
  choice: 你要知道
  rationale: 这是阴性单数命令式，与作为集合名词的“会众”呼应；保留“知道”的基本意义，不将其具体化为“明白”或“留意”。
- source_word: עֵדָה
  choice: 会众
  rationale: 该集合名词可指会众、集会或群体。“会众”保留单数集体受话者的形式以及先知性、公共性的语气；其确切所指仍有争议，故加脚注。
- source_word: אֶת אֲשֶׁר בָּם
  choice: 他们中间有什么
  rationale: 原表达简约，可指他们里面或他们中间所有的情形。“他们中间有什么”在现代汉语中自然，同时不把所指过度具体化。
theological_decisions:
- issue: עֵדָה在第二个命令句中的所指和句法作用
  choice: 按呼格单数集合名词处理，译作“会众啊”，与“列国”并列受呼告。
  alternative: 可理解为“列国的集会”的同位结构，或因本句艰涩而采取校勘、改读。
  rationale: 马所拉读法中的阴性单数命令式与单数集合名词相配。按直接呼告翻译能保存原文形式和修辞力度，且避免采用推测性的改读。
- issue: אֲשֶׁר בָּם所表达的范围
  choice: 译作“他们中间有什么”，保留所指的开放性。
  alternative: 可译作“他们里面有什么”，强调其内在情况。
  rationale: 介词短语既可能指在他们里面，也可能指在他们中间；上下文虽涉及犹大的状况与将临的审判，本节本身却没有进一步明说，因此不宜替原文限定。
translation_notes:
  register: 采用现代、庄重而易懂的先知文体。“列国啊……会众啊……”保留连续呼告的修辞形式；用复数“你们”对应列国，用单数“你”对应集合名词“会众”，以显出希伯来语命令式的数与性所形成的结构。
