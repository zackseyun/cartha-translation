language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: הֹבִ֕ישׁוּ כִּ֥י תוֹעֵבָ֖ה עָשׂ֑וּ גַּם בּ֣וֹשׁ לֹֽא יֵב֗וֹשׁוּ גַּם הַכְלִים֙ לֹ֣א יָדָ֔עוּ לָ/כֵ֞ן יִפְּל֧וּ בַ/נֹּפְלִ֛ים בְּ/עֵת פְּקַדְתִּ֥י/ם יִכָּשְׁל֖וּ אָמַ֥ר יְהוָֽה־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/006/015.yaml
  text: Were they ashamed because they had done an abomination? No[a], they were not ashamed at all; they did not even know how to blush. Therefore they will fall among the fallen; at the time I punish them, they will stumble, says Yahweh.
translation:
  language: zh_hans
  text: 他们做了可憎的事，难道感到羞愧吗？不，他们毫不羞愧，甚至不知道脸红。因此，他们必在倒下的人中间倒下；到我惩罚他们的时候[a]，他们必跌倒。耶和华说。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “惩罚”所译的希伯来语也可表示“察看、临到或处置”；这里的上下文带有惩治的含义。
    reason: 保留 פקד 的词义范围及其在本节审判语境中的具体用法。
lexical_decisions:
- source_word: הֹבִישׁוּ
  choice: 难道感到羞愧吗
  rationale: 结合后面连续的否定句，将完成式按语境理解为反问，能自然呈现先知的讽刺语气；不采用平直陈述。
- source_word: תוֹעֵבָה
  choice: 可憎的事
  rationale: 保留该词在先知书中的强烈道德与盟约色彩，同时比“可憎之物”更符合现代汉语表达。
- source_word: גַּם בּוֹשׁ לֹא יֵבֹשׁוּ
  choice: 毫不羞愧
  rationale: 用“毫不”传达绝对不定式与未完成式组合所加强的否定语气。
- source_word: הַכְלִים לֹא יָדָעוּ
  choice: 甚至不知道脸红
  rationale: “脸红”在现代汉语中自然表达外显的羞耻反应，并与“不知道”共同表现他们连羞耻感都已丧失。
- source_word: יִפְּלוּ בַנֹּפְלִים
  choice: 必倒在倒下的人中间
  rationale: 尽量保留原文“倒下/倒下的人”的词根复现与简洁诗意，不把含义具体化为阵亡或毁灭。
- source_word: בְּעֵת פְּקַדְתִּים
  choice: 到我惩罚他们的时候
  rationale: פקד本可指探访、察看或处置，但此处的审判语境使“惩罚”最清楚地传达其惩治含义；脚注保留其较宽的词义。
- source_word: יִכָּשְׁלוּ
  choice: 必跌倒
  rationale: 保留与前一分句“倒下”相呼应的失足、倾覆意象，又不额外说明审判的具体方式。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代简体中文圣经传统中最通行、普通读者最易识别的神名译法。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: “耶和华”是现代中文圣经传统中最普及且庄重的专名形式；此选择只处理中文接受习惯，不改变原文以神圣四字名指称以色列之神的事实。
- issue: 审判语境中 פקד 的含义
  choice: 惩罚他们
  alternative: 察看他们／临到他们
  rationale: 上下文明确描述犯罪所招致的倒下和跌倒，因此正文采用惩治义；同时以脚注保留该动词“察看、临到、处置”的词义张力。
- issue: הֹבִישׁוּ 的句法语气
  choice: 反问
  alternative: 他们蒙羞了／他们行事可耻
  rationale: 紧接的“毫不羞愧”最自然地回答一个反问；采用反问既符合语篇推进，也保留先知责问的力度。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。以“难道……吗？不……”呈现反问及明确否定；“毫不羞愧，甚至不知道脸红”保持平行递进；“倒在倒下的人中间”有意保留原文词根复现带来的诗性与力度。
