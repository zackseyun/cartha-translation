  text: וַ/הֲקִמֹתִ֤י עֲלֵי/כֶם֙ צֹפִ֔ים הַקְשִׁ֖יבוּ לְ/ק֣וֹל שׁוֹפָ֑ר וַ/יֹּאמְר֖וּ לֹ֥א נַקְשִֽׁיב׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/006/017.yaml
  text: 'I set watchmen over you: ‘Listen to the sound of the trumpet!’ But they said[b][a], ‘We will not listen.’'
translation:
  language: zh_hans
  text: 我在你们之上设立[a]守望者：“要留心听号角声[b]！”他们却说：“我们不肯听。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我任命了守望者。”
    reason: lexical_alternative
  - marker: b
    text: “号角”原文为שׁוֹפָר（shofar），是一种用兽角制成、用于报警或召集的吹奏器。
    reason: cultural_note
lexical_decisions:
- source_word: וַהֲקִמֹתִי
  choice: 我设立
  rationale: קום的使役式在这里表示使人站立于岗位、设立或任命。“设立”既保留安置之意，也自然表达授予守望职责。
- source_word: עֲלֵיכֶם
  choice: 看顾你们
  rationale: 介词עַל带第二人称复数后缀，描绘守望者被安置在百姓之上。“看顾你们”在现代汉语中自然表达其相对于百姓的守望职责，同时避免误译成敌对的“攻击你们”。
- source_word: צֹפִים
  choice: 守望者
  rationale: צפה的分词指警戒、观察并发出警报的人。“守望者”保留先知语境中的形象及警告功能，不限定其具体身份。
- source_word: הַקְשִׁיבוּ
  choice: 要留心听
  rationale: קשב的命令式要求专注聆听；“留心听”比单纯“听”更充分体现注意、听从的语气。
- source_word: לְקוֹל
  choice: ……声
  rationale: קוֹל与שׁוֹפָר连用时指乐器发出的声音；汉语以“号角声”简洁自然地表达。
- source_word: שׁוֹפָר
  choice: 号角
  rationale: שׁוֹפָר是用于召集或报警的角制吹奏器。“号角”既符合古代器物形象，也能传达这里的警报功能。
- source_word: וַיֹּאמְרוּ
  choice: 他们却说
  rationale: 连接词推进叙述，而上下文构成警告与拒绝之间的鲜明转折；“却”自然地显明这一关系。
- source_word: לֹא נַקְשִׁיב
  choice: 我们不听
  rationale: 否定词加第一人称复数未完成式在此表达明确拒绝。“我们不听”简洁有力，并与前面的“要留心听”形成呼应。
theological_decisions:
- issue: 守望者的身份与职能
  choice: 保留“守望者”这一宽泛形象，不在正文中明确认定为先知、领袖或军事哨兵。
  alternative: 直接译作“先知”，或解释为军事哨兵或负责警告百姓的领袖。
  rationale: 希伯来文本强调其守望和警告的职能，却没有在本节明确界定身份；保留该形象可避免不必要的神学窄化。
- issue: 守望者与百姓的关系
  choice: 译作“看顾你们”，表达被设在百姓之上执行守望职责。
  alternative: 译作“管辖你们”“反对你们”或“为你们”。
  rationale: עַל在此可呈现位置或职责上的“在……之上”，但正文重点是发出警告，并非明确说明统治、敌对或纯粹保护关系；“看顾”保留守望意象而不过度断定。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。引语直接呈现守望者的警告以及百姓的拒绝；“留心听”与“不听”形成清楚呼应。避免使用过于古雅的“听从角声”或现代军事色彩过强的术语。
