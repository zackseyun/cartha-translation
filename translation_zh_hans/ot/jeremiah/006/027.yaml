  text: בָּח֛וֹן נְתַתִּ֥י/ךָ בְ/עַמִּ֖/י מִבְצָ֑ר וְ/תֵדַ֕ע וּ/בָחַנְתָּ֖ אֶת דַּרְכָּֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/006/027.yaml
  text: I have made you a tester among my people[a], a fortress[b], so that you may know and test their way.
translation:
  language: zh_hans
  text: “我已立你在我的子民中作检验者[a]，又作堡垒[b]，使你得以知道并察验他们的道路[c]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “检验者”也可译作“验金者”。这里承接下文检验金属成色的意象；希伯来原文简短，句法也较难确定。
    reason: lexical_alternative
  - marker: b
    text: “堡垒”也可译作“坚固之地”。它与“检验者”的确切关系并不清楚；有些理解将其视为形容这项察验使命的坚固性质。
    reason: textual_or_syntactic_ambiguity
  - marker: c
    text: “他们的道路”意为他们的行为或生活方式。
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּחוֹן
  choice: 试验者
  rationale: 该词源于בחן，指检验、察验的人；上下文以金属熬炼为喻。“试验者”既保留词根意义，也比专业性的“验金者”更易懂。
- source_word: נְתַתִּיךָ
  choice: 我已立你
  rationale: נתן本义为“给、安置”，在此与角色名词连用，表达委任；“立你……作”符合现代汉语圣经语体。
- source_word: בְעַמִּי
  choice: 在我的子民中
  rationale: 介词ב可表示“在……中”；此处指耶利米被安置在百姓中履行察验职责。
- source_word: מִבְצָר
  choice: 堡垒
  rationale: 该名词通常指堡垒或坚固之地。原文结构紧凑且含义较难，直译具体意象，避免以推测性的功能解释取代马所拉文本。
- source_word: וְתֵדַע
  choice: 使你察验
  rationale: 连接词加未完成式可表结果、顺承或目的；这里译作目的结构。“察验”体现由观察而认识的语境，同时不把“知道”仅理解为获得信息。
- source_word: וּבָחַנְתָּ
  choice: 并试炼
  rationale: 动词与בָּחוֹן同根，表示检验成色或品质。用“试炼”保留金属熬炼背景及对百姓品行的检验意味。
- source_word: דַּרְכָּם
  choice: 他们的道路
  rationale: דֶּרֶךְ既可指实际道路，也常比喻行为、生活方式；保留“道路”可维持原文隐喻及其语义张力。
theological_decisions:
- issue: “知道并试验”中两个动词的关系
  choice: 译为“使你察验并试炼”，将וְתֵדַע理解为委任的目的，并保留两个并列动作。
  alternative: “这样你就会知道并试验”或“使你知道、试验”。
  rationale: 希伯来语连接形式可表达目的或顺承，不能完全排除其他理解；正文采用通顺的目的表达，但不将二者合并为单一动作。
- issue: “堡垒”与“试验者”的句法和意象关系
  choice: 将מִבְצָר作为第二个委任角色，与“试验者”并列。
  alternative: 理解为修饰性的“坚固的试验者”，或依据上下文作概念性改译。
  rationale: 马所拉文本明确保留名词“堡垒”，但短语紧凑难解；并列直译最能保存文本形态及未解张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“立你……作”保持先知受委任的语气；“试验者／试炼”尽量呈现בחן的词根呼应，虽为避免中文重复生硬而使用近义表达。正文保留“堡垒”和“道路”两个具体隐喻，并用脚注说明原文的词义与句法难点。
