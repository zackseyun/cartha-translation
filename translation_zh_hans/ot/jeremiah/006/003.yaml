  text: אֵלֶ֛י/הָ יָבֹ֥אוּ רֹעִ֖ים וְ/עֶדְרֵי/הֶ֑ם תָּקְע֨וּ עָלֶ֤י/הָ אֹהָלִים֙ סָבִ֔יב רָע֖וּ אִ֥ישׁ אֶת יָדֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/006/003.yaml
  text: To her shepherds will come with their flocks[a]; they will pitch tents against her all around; each will pasture his own place.
translation:
  language: zh_hans
  text: 牧人必带着羊群来到她那里；他们必在她四周搭起帐篷，围攻她；各人都在自己所占之地放牧。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“各人放牧自己的手”。这可能是习惯用语，意指各自在所分得、所占据或手边的区域放牧，也可能暗含在那里吞吃、毁坏。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶיהָ
  choice: 来到她那里
  rationale: 保留 אֶל 的方向义“到、向着”；敌对意味由后面的围攻语境表达，不提前强加于此前置短语。
- source_word: רֹעִים וְעֶדְרֵיהֶם
  choice: 牧人必带着羊群
  rationale: 保留贯穿本节的牧人、羊群和放牧意象；连接词在此自然表达伴随关系。
- source_word: תָּקְעוּ עָלֶיהָ אֹהָלִים סָבִיב
  choice: 他们必在她四周搭起帐篷，围攻她
  rationale: “搭起帐篷”传达 תקע 与帐篷搭配时的惯用义；עָלֶיהָ 在军事语境中带敌对意味，译作“围攻她”并与 סָבִיב 的包围图景结合。
- source_word: רָעוּ
  choice: 放牧
  rationale: 保留 רעה 的牧养意象，不直接释为“吞吃”或“毁坏”，从而维持原文隐喻。
- source_word: אִישׁ אֶת יָדוֹ
  choice: 各人都在自己所占之地
  rationale: אִישׁ 表示逐一分配；“他的手”是难解的习语，在这里很可能指各自控制、分得或邻近的一片区域。“所占之地”贴合围城场景，同时以脚注保留字面形式及不确定性。
