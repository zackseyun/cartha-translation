  terminology: “牧人、羊群、放牧”一致地维持原文隐喻，避免将牧人直接释作军队首领或将放牧直接译成掠夺。脚注中的“吞吃、毁坏”明确以“可能暗含”提出，未将一种解释当作定论。脚注锚点置于末句之后，准确对应困难的“自己的手／所占之地”表达。
