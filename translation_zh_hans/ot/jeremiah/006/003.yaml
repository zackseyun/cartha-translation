  source_fidelity: 译文忠实呈现了原文的连续牧放意象：רֹעִים／עֶדְרֵיהֶם译为“牧人……羊群”，רָעוּ译为“放牧”。“来到她那里”保留אֵלֶיהָ的基本趋向义；“在她四周搭起帐篷，围攻她”自然表达了עָלֶיהָ与סָבִיב所构成的敌对、环绕扎营情景。末句“各人都在自己所占之地放牧”对אִישׁ אֶת־יָדוֹ这一困难表达作了合乎语境但不过度确定的处理，脚注也保留其字面形式与解释的不确定性。
