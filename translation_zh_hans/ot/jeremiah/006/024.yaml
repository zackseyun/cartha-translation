  text: שָׁמַ֥עְנוּ אֶת שָׁמְע֖/וֹ רָפ֣וּ יָדֵ֑י/נוּ צָרָה֙ הֶחֱזִיקַ֔תְ/נוּ חִ֖יל כַּ/יּוֹלֵדָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/006/024.yaml
  text: We have heard the report of it[a]; our hands hang limp. Distress has seized us[c][b], pain like a woman giving birth.
translation:
  language: zh_hans
  text: 我们听见了有关他的消息[a]，双手就发软[b]；苦难抓住了我们，痛苦如临产的妇人[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“他的消息”，也可理解为“他传出的消息”；希伯来语既可指有关敌人的消息，也可指他所传出的消息，后者按上下文可能性较小。
    reason: lexical_alternative
  - marker: b
    text: 直译“我们的手松弛了”，是指失去力量或勇气。
    reason: lexical_alternative
  - marker: c
    text: 或译“阵痛，如同生产的妇人”。
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמַעְנוּ
  choice: 我们听见了
  rationale: Qal完成式第一人称复数，表示已经听见，并自然带出这一消息所造成的持续反应。
- source_word: אֶת שָׁמְעוֹ
  choice: 有关他的消息
  rationale: שֵׁמַע/שֶׁמַע指消息、传闻；第三人称阳性单数后缀可表示与“他”有关的消息。上下文指逼近之敌的消息，同时以脚注保留“他传出的消息”这一语法可能。
- source_word: רָפוּ יָדֵינוּ
  choice: 双手就发软
  rationale: 直译为“我们的手松弛了”，是失去力量或勇气的惯用表达；“双手发软”既保留身体意象，也符合现代汉语。
- source_word: צָרָה
  choice: 患难
  rationale: 该词可指困境、苦难或危急；“患难”庄重而通俗，适合此处外敌造成的压迫。
- source_word: הֶחֱזִיקַתְנוּ
  choice: 攫住了我们
  rationale: חזק的Hiphil形式在此表示抓住、控制；“攫住”传达突然而强烈的控制感。
- source_word: חִיל
  choice: 痛苦
  rationale: 该词可表示扭动、阵痛、剧痛或痛苦；紧接临产比喻，“痛苦”既清楚又不把词义过度限定为产痛。
- source_word: כַּיּוֹלֵדָה
  choice: 如临产的妇人
  rationale: ילד的阴性分词配比较前缀כ，描写正在生产的妇人；“临产的妇人”是自然、凝练且庄重的现代汉语。
