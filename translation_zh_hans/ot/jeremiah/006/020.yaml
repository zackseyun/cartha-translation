  text: לָ/מָּה זֶּ֨ה לִ֤/י לְבוֹנָה֙ מִ/שְּׁבָ֣א תָב֔וֹא וְ/קָנֶ֥ה הַ/טּ֖וֹב מֵ/אֶ֣רֶץ מֶרְחָ֑ק עֹלֽוֹתֵי/כֶם֙ לֹ֣א לְ/רָצ֔וֹן וְ/זִבְחֵי/כֶ֖ם לֹא עָ֥רְבוּ לִֽ/י־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/006/020.yaml
  text: 'Why is this to me: frankincense comes from Sheba[a], and sweet cane from a distant land? Your burnt offerings are not acceptable[b], and your sacrifices do not please me.'
translation:
  language: zh_hans
  text: 从示巴来的乳香，和从遥远之地来的上好的芳香蒲草[b]，对我有什么用呢？你们的燔祭不蒙悦纳，你们的祭物也不使我喜悦。
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: “芳香蒲草”也可译作“香菖蒲”或“芬芳的蒲草”；原文没有明确指出具体植物品种。
    reason: קָנֶה הַטּוֹב指一种贵重的芳香性蒲草或芦苇类植物，但其确切植物学所指并不确定。
lexical_decisions:
- source_word: לָמָּה זֶּה לִי
  choice: 对我有什么用呢
  rationale: 这是带有“对我／给我”意味的反问。译文采用现代汉语的自然表达，传达上帝拒绝这些礼物的语气，同时以脚注保留较贴近希伯来语结构的理解。
- source_word: לְבוֹנָה
  choice: 乳香
  rationale: 该词特指乳香，而非泛指一切香料或香品；此处又处于远方贸易品的语境中，宜采用准确名称。
- source_word: מִשְּׁבָא
  choice: 从示巴
  rationale: 示巴是传统且通行的专名译法，保留原文所指的地域。
- source_word: תָבוֹא
  choice: 运来的
  rationale: 原文动词基本义为“来”，但在乳香从示巴而来的贸易语境中，“运来的”更符合现代汉语，也没有增添实质信息。
- source_word: קָנֶה הַטּוֹב
  choice: 上好香料蒲草
  rationale: קָנֶה意为蒲草、芦苇或其茎秆，הַטּוֹב表示其优良、珍贵；此处显然指有芳香用途的贵重品。“上好香料蒲草”保留植物类别与品质含义，又避免武断确定具体植物品种。
- source_word: מֵאֶרֶץ מֶרְחָק
  choice: 从遥远之地
  rationale: 直译原文的距离和地域意味，语言庄重而自然。
- source_word: עֹלוֹתֵיכֶם
  choice: 你们的燔祭
  rationale: 这是祭祀语境中的专门用语，指全烧献上的祭物；“燔祭”是准确且通行的汉语圣经术语。
- source_word: לֹא לְרָצוֹן
  choice: 不蒙悦纳
  rationale: 该短语表示这些燔祭不能得到上帝的接纳或恩准。“不蒙悦纳”简洁地保留祭祀语境与被动关系。
- source_word: זִבְחֵיכֶם
  choice: 你们的祭物
  rationale: זֶבַח指宰杀献上的祭牲或祭物；此处译作“祭物”，既自然，也与前面的“燔祭”形成适当区分。
- source_word: לֹא עָרְבוּ לִי
  choice: 不能使我喜悦
  rationale: ערב在此表示令人愉悦、合意。译文明确保留לִי“对我”的关系，并与前句“不蒙悦纳”避免机械重复。
theological_decisions:
- issue: 上帝拒绝昂贵祭礼的表达
  choice: 按经文本身译为上帝对进口香料、燔祭和祭物的直接反问与拒绝
  alternative: 在正文中明说这些敬拜因虚伪、悖逆或缺乏顺服而被拒绝
  rationale: 本节明确表达祭礼不蒙悦纳，却没有在本节内明说拒绝的全部原因。译文保留其强烈的神学张力，不把上下文中的解释扩写进正文。
- issue: לָמָּה זֶּה לִי的反问含义
  choice: 对我有什么用呢
  alternative: 为什么把这些给我呢／这些对我算什么呢
  rationale: 原文可理解为质问这些礼物对上帝有何意义，也可更形式化地译为“为什么这些给我”。正文采用最自然且合乎语境的反问，脚注保留结构较直的另一译法。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“燔祭”“悦纳”保留必要的祭祀语域；其余措辞尽量避免古奥。反问置于进口香料清单之后，使汉语句法自然，同时保持原文的责问力度。
