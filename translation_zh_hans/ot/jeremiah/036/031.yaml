base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/036/031.yaml
  text: And I will punish him and his offspring and his servants for their iniquity[a], and I will bring on them, on the inhabitants of Jerusalem, and on the men of Judah all the disaster that I spoke against them, but they did not listen.
translation:
  language: zh_hans
  text: 我要惩罚他、他的后裔和臣仆，追讨他们的罪孽；我要使我曾对他们宣告的一切灾祸临到他们、耶路撒冷的居民和犹大的每一个人[a]，但他们没有听从。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“犹大的每一个男子”。这里的“人”在希伯来语中是阳性单数，并带有逐一分配的意味；也可译作“犹大人”或“犹大的每一个男子”。
    reason: 说明原文的语法性别和分配性，并列出可行译法。
lexical_decisions:
- source_word: וּפָקַדְתִּי עָלָיו
  choice: 我要……惩罚他们
  rationale: פָּקַד与עַל用于审判语境时表示追究、惩罚，而非中性的“眷顾”或“访问”。中文补出复数宾语“他们”，自然涵盖随后列出的王、后裔和臣仆。
- source_word: זַרְעוֹ
  choice: 他的后裔
  rationale: זֶרַע在这里指子孙后代；“后裔”保留其集合意义，也符合庄重的现代汉语。
- source_word: עֲבָדָיו
  choice: 他的臣仆
  rationale: עֶבֶד可指奴仆或臣仆；本节涉及王室语境，“臣仆”比“奴隶”更贴切，也能涵盖服侍君王的官员和侍从。
- source_word: אֶת עֲוֺנָם
  choice: 因……的罪孽
  rationale: עָוֹן可指罪孽、罪责，也可延伸指罪的后果；这里是受罚的原因，译为“罪孽”保留其道德和司法分量。
- source_word: וְהֵבֵאתִי עֲלֵיהֶם
  choice: 我要使……临到他们
  rationale: הביא על是使灾祸或审判临到某人的惯用表达；此译既贴近希伯来语意象，又符合自然汉语。
- source_word: יֹשְׁבֵי יְרוּשָׁלִַם
  choice: 耶路撒冷的居民
  rationale: 该分词结构指居住在耶路撒冷的人；“居民”简洁、准确。
- source_word: וְאֶל אִישׁ יְהוּדָה
  choice: 和犹大的每一个人[a]
  rationale: אִישׁ为单数阳性，在这里具有逐一分配的意味；“每一个人”保留分配性，脚注则说明原文形式上的阳性以及其他可能译法。
- source_word: כָּל הָרָעָה
  choice: 一切灾祸
  rationale: רָעָה在先知审判语境中指灾难、祸患，而非人的道德邪恶；“灾祸”准确传达所宣告的审判。
- source_word: אֲשֶׁר דִּבַּרְתִּי אֲלֵיהֶם
  choice: 我曾对他们宣告的
  rationale: 原文介词אֶל基本义为“向、对”；上下文表明所说的是审判，因此“宣告”兼顾原文和语境，而不额外强化为“攻击他们”。
- source_word: וְלֹא שָׁמֵעוּ
  choice: 可是他们没有听从
  rationale: שׁמע可表示听见、听取或顺从；“听从”表达他们未理会先知警告的含义，“可是”体现语境中的转折。
theological_decisions:
- issue: אִישׁ יְהוּדָה的范围与性别形式
  choice: 犹大的每一个人[a]
  alternative: 犹大的每一个男子；犹大人
  rationale: 原文用单数阳性אִישׁ，并有分配性。正文保留“每一个”的逐一意味，同时采用现代汉语中自然的代表性称呼；脚注明示其阳性形式，避免悄然抹去原文特征，也不武断断定审判只涉及成年男性。
- issue: עָוֹן表示罪孽还是罪罚
  choice: 罪孽
  alternative: 罪责；罪的惩罚
  rationale: 本句把עָוֹן作为惩罚所针对的过犯或罪责来理解；译作“罪孽”保留道德责任，不把词义预先收窄为惩罚后果。
- issue: שׁמע表示听见还是顺从
  choice: 听从
  alternative: 听；听进去；顺服
  rationale: 语境涉及拒绝接受先知所宣告的话。“听从”保留听取与响应的结合，而不将其扩大成特定神学意义上的“顺服”。
translation_notes:
  register: 采用庄重而清晰的现代标准汉语。“臣仆”“罪孽”“灾祸”适合王室与先知审判语境，但不过分古雅。句子依照希伯来语的审判宣告结构展开，并用分号减轻长句负担。
