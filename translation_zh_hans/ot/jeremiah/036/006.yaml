language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וּ/בָאתָ֣ אַתָּ֡ה וְ/קָרָ֣אתָ בַ/מְּגִלָּ֣ה אֲשֶׁר כָּתַֽבְתָּ מִ/פִּ/י֩ אֶת דִּבְרֵ֨י יְהוָ֜ה בְּ/אָזְנֵ֥י הָ/עָ֛ם בֵּ֥ית יְהוָ֖ה בְּ/י֣וֹם צ֑וֹם וְ/גַ֨ם בְּ/אָזְנֵ֧י כָל יְהוּדָ֛ה הַ/בָּאִ֥ים מֵ/עָרֵי/הֶ֖ם תִּקְרָאֵֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/036/006.yaml
  text: So you yourself must go and read from the scroll that you wrote from my mouth—the words of Yahweh—in the hearing of the people in the house of Yahweh on a day of fasting[b][a]; and you must also read them in the hearing of all Judah who come from their cities.
translation:
  language: zh_hans
  text: 所以你要亲自去，在禁食的日子，在耶和华的殿里[b]，向百姓宣读卷轴上耶和华的话；这卷轴是你照我口述写下的[a]。你也要向从各城前来的所有犹大人宣读这些话。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译：“你从我口中写下的。”
    reason: lexical_alternative
  - marker: b
    text: “耶和华的殿”指圣殿；原文字面为“耶和华的家”。
    reason: cultural_note
lexical_decisions:
- source_word: וּבָאתָ אַתָּה
  choice: 所以你要亲自去
  rationale: 此处的连词加完成式在连续吩咐中具有命令意味；独立代词 אַתָּה 带有强调，因此译作“亲自”。按说话者与巴录所处位置，现代汉语用“去”比“来”自然。
- source_word: וְקָרָאתָ בַמְּגִלָּה
  choice: 宣读卷轴上……的话
  rationale: קרא 以书面材料为对象时指朗读；公开场合中的“宣读”既保留阅读行为，也表达出声读给众人听。בַמְּגִלָּה 表示从卷轴所载文字中宣读，汉语自然表达为“卷轴上”。
- source_word: אֲשֶׁר כָּתַבְתָּ מִפִּי
  choice: 这卷轴是你照我口述写下的
  rationale: מִפִּי 字面为“从我口中”，意指巴录根据耶利米所说的话书写；正文采用自然明确的“照我口述”，脚注保留字面表达。
- source_word: אֶת דִּבְרֵי יְהוָה
  choice: 耶和华的话
  rationale: 该短语是所写并宣读的内容。“耶和华的话”直接保留所有关系表达，也符合现代中文圣经语体。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代简体中文读者熟悉的神名形式“耶和华”，以专名而非称号表达四字神名。
- source_word: בְּאָזְנֵי הָעָם
  choice: 向百姓宣读
  rationale: 希伯来语字面为“在百姓耳中”，强调公开使人听见；汉语以“向百姓宣读”自然传达这一听觉和公开场景。
- source_word: בֵּית יְהוָה
  choice: 耶和华的殿
  rationale: 字面为“耶和华的家”，在此明确指圣殿。正文用“殿”避免现代读者误解，脚注说明原文字面表达。
- source_word: בְּיוֹם צוֹם
  choice: 在禁食的日子
  rationale: 该短语指举行禁食的某一日，并未明确是固定节期，故不译成特定的“禁食节”。
- source_word: בְּאָזְנֵי כָל יְהוּדָה הַבָּאִים מֵעָרֵיהֶם
  choice: 向所有从犹大各城来的人
  rationale: “全犹大”在此由复数分词“来的人”具体化，指从犹大各城来到现场的人；这样译清楚自然，并不把“犹大”误解为单纯地域。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用四字神名。简体中文正文采用广为人知且具专名功能的“耶和华”；“雅威”是较接近学术重构发音的另一种音译，但原始准确发音并不完全确定。
- issue: בֵּית יְהוָה 的所指
  choice: 耶和华的殿
  alternative: 耶和华的家
  rationale: 在本段历史场景中，该词组指耶路撒冷圣殿。译作“殿”明确文化所指；脚注保留其字面为“家”的信息，不额外引入宗派性解释。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“宣读”适合公开朗读书卷的场景；调整语序，将时间和地点置于主要动作之前，并把关系从句拆开，以免中文句子过长。正文中的脚注标记均紧随相关措辞。
