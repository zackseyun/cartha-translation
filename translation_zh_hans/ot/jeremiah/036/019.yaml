  text: וַ/יֹּאמְר֤וּ הַ/שָּׂרִים֙ אֶל בָּר֔וּךְ לֵ֥ךְ הִסָּתֵ֖ר אַתָּ֣ה וְ/יִרְמְיָ֑הוּ וְ/אִ֥ישׁ אַל יֵדַ֖ע אֵיפֹ֥ה אַתֶּֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/036/019.yaml
  text: Then the officials said to Baruch, “Go, hide yourself, you and Jeremiah, and let no one know where you are.”
translation:
  language: zh_hans
  text: 于是，官员们对巴录说：“去吧，你和耶利米都躲起来，不要让任何人知道你们在哪里。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: 于是……说
  rationale: 承接前文并推进叙事；“于是”比机械重复“和”更符合现代汉语叙事习惯。
- source_word: הַשָּׂרִים
  choice: 官员们
  rationale: 此词指王室行政体系中的领袖或官员；“官员们”现代、清楚，也符合上下文，并避免“王子们”可能造成的误解。
- source_word: לֵךְ הִסָּתֵר
  choice: 去吧……躲起来
  rationale: 两个阳性单数命令式直接针对巴录；译文保留命令语气，同时以自然汉语表达行动的先后与紧迫感。
- source_word: אַתָּה וְיִרְמְיָהוּ
  choice: 你和耶利米都
  rationale: 保留希伯来文显明的“你”，并说明躲藏的命令涉及巴录和耶利米二人；“都”使现代汉语表达自然。
- source_word: וְאִישׁ אַל יֵדַע
  choice: 不要让任何人知道
  rationale: 否定语境中的 אִישׁ 泛指任何人；此译法自然地表达禁止含义，不误译为仅指男性。
- source_word: אֵיפֹה אַתֶּם
  choice: 你们在哪里
  rationale: 复数代词指巴录和耶利米；直译地点问句结构，清楚保留复数所指。
