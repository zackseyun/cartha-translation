  text: וְ/עַל יְהוֹיָקִ֤ים מֶֽלֶךְ יְהוּדָה֙ תֹּאמַ֔ר כֹּ֖ה אָמַ֣ר יְהוָ֑ה אַ֠תָּה שָׂרַ֜פְתָּ אֶת הַ/מְּגִלָּ֤ה הַ/זֹּאת֙ לֵ/אמֹ֔ר מַדּוּעַ֩ כָּתַ֨בְתָּ עָלֶ֜י/הָ לֵ/אמֹ֗ר בֹּֽא יָב֤וֹא מֶֽלֶךְ בָּבֶל֙ וְ/הִשְׁחִית֙ אֶת הָ/אָ֣רֶץ הַ/זֹּ֔את וְ/הִשְׁבִּ֥ית מִמֶּ֖/נָּה אָדָ֥ם וּ/בְהֵמָֽה־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/036/029.yaml
  text: 'And concerning Jehoiakim king of Judah[a], you shall say, ‘Thus says Yahweh: You have burned this scroll, saying, “Why have you written on it, saying, ‘The king of Babylon will surely come and destroy this land, and cut off from it man and beast’?”’'
translation:
  language: zh_hans
  text: 至于犹大王约雅敬，你要说：“雅威如此说：你烧了这书卷，说：‘你为什么在上面写道：“巴比伦王必定会来，毁灭这地，使其中的人和牲畜断绝[a]？”’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “人和牲畜”是希伯来语中表示彻底荒凉的惯用说法，也可译作“人类和动物”。
    reason: 说明固定表达的整体含义，并提供更宽泛的词义译法。
lexical_decisions:
- source_word: וְעַל
  choice: 至于
  rationale: 在言说动词的语境中引出宣告所针对的对象；译作“至于”自然，也不额外强化为“攻击”。
- source_word: תֹּאמַר
  choice: 你要说
  rationale: 未完成式在此具有指令作用，是雅威吩咐耶利米传话。
- source_word: כֹּה אָמַר יְהוָה
  choice: 雅威如此说
  rationale: 保留先知性的使者宣告格式，并以“雅威”音译神名。
- source_word: שָׂרַפְתָּ
  choice: 你烧了
  rationale: 完成式指约雅敬已经做出的焚烧行为；现代汉语用“烧了”简明自然。
- source_word: הַמְּגִלָּה הַזֹּאת
  choice: 这卷书
  rationale: מְגִלָּה指卷轴形态的书写文献；“卷书”兼顾历史形态与本章常用中文表达。
- source_word: כָּתַבְתָּ עָלֶיהָ
  choice: 在上面写着
  rationale: 直接反映עַל的表面方位，并以“写着”自然引出所写内容。
- source_word: בֹּא יָבֹא
  choice: 必定会来
  rationale: 以“必定”表达不定式绝对式与未完成式并用所产生的强调语气。
- source_word: וְהִשְׁחִית
  choice: 毁灭
  rationale: 使役词形在此表示使这地遭受严重破坏；“毁灭”保留预言的强烈程度。
- source_word: וְהִשְׁבִּית מִמֶּנָּה אָדָם וּבְהֵמָה
  choice: 使其中的人和牲畜都断绝
  rationale: הִשְׁבִּית表示使之止息、消失；“断绝”保留彻底荒凉的力度，“都”清楚呈现该成对表达的全面性。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文明确使用四字神名；“雅威”较直接地保留其专名性质，不以称号代替。
- issue: אָדָם וּבְהֵמָה的表达
  choice: 人和牲畜
  alternative: 世人和动物；人和走兽
  rationale: 这是表示全面荒凉的固定成对语。“人和牲畜”在现代汉语中自然，并保持人类与陆生家畜并举的原文形式；脚注说明其语用范围。
- issue: בֹּא יָבֹא的确定性
  choice: 必定会来
  alternative: 要来；果真会来
  rationale: 保留希伯来语强调结构所表达的确定语气，不把它弱化为一般将来。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。保留原文层层引用的结构与“写着说”一类闪语式重复，但通过中文标点使说话层次清楚。
