  naturalness: “在上面写着说”在现代汉语中不自然；“写着”不宜在此承担对已写内容的提问，且“说”与其连用生硬。改为“在上面写道”既保留原文的引述功能，也符合现代书面汉语。原稿末尾的引号闭合层级不完整，需校正。
  terminology: “雅威”一致呈现神名；“书卷”比“卷书”更自然，也更明确对应书写卷轴。“人和牲畜”保留原文的固定成对表达；脚注恰当说明其指向全面荒凉，未把解释混入正文。
