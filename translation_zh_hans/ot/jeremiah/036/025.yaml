base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/036/025.yaml
  text: Yet even Elnathan[a], Delaiah, and Gemariah urged the king not to burn the scroll, but he did not listen to them.
translation:
  language: zh_hans
  text: 然而，以利拿单[a]、第莱雅和基玛利雅都恳求王不要烧毁书卷，王却不听从他们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “恳求”也可译为“竭力劝说”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: 然而……都
  rationale: וְגַם兼有连接、增补和强调作用；结合上下文，用“然而”带出转折，以“都”体现这些官员也曾出面劝阻。
- source_word: הִפְגִּיעוּ בַמֶּלֶךְ
  choice: 恳求王
  rationale: פגע的使役式在此表示向某人迫切请求；“恳求王”自然、庄重，并保留其请求力度。
- source_word: לְבִלְתִּי שְׂרֹף
  choice: 不要烧毁
  rationale: 该结构表达请求阻止某项行动；“不要烧毁”符合现代汉语中“恳求”的补语形式。
- source_word: הַמְּגִלָּה
  choice: 书卷
  rationale: מְגִלָּה指卷成卷轴的书写材料；“书卷”是此叙事语境中准确且通行的译法。
- source_word: וְלֹא שָׁמַע אֲלֵיהֶם
  choice: 王却不听他们
  rationale: 连接词在语境中具有转折意味；补出“王”避免汉语代词歧义，“不听他们”直接表达未接受其劝求。
