id: JER.36.26
reference: Jeremiah 36:26
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יְצַוֶּ֣ה הַ֠/מֶּלֶךְ אֶת יְרַחְמְאֵ֨ל בֶּן הַ/מֶּ֜לֶךְ וְ/אֶת שְׂרָיָ֣הוּ בֶן עַזְרִיאֵ֗ל וְ/אֶת שֶֽׁלֶמְיָ֨הוּ֙ בֶּֽן עַבְדְּאֵ֔ל לָ/קַ֨חַת֙ אֶת בָּר֣וּךְ הַ/סֹּפֵ֔ר וְ/אֵ֖ת יִרְמְיָ֣הוּ הַ/נָּבִ֑יא וַ/יַּסְתִּרֵ֖/ם יְהוָֽה־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/036/026.yaml
  text: Then the king commanded Jerahmeel the king’s son[a], and Seraiah son of Azriel, and Shelemiah son of Abdeel, to seize Baruch the scribe and Jeremiah the prophet[b], but Yahweh hid them.
translation:
  language: zh_hans
  text: 王命令王子耶拉篾[a]、亚斯列的儿子西莱雅和亚伯叠的儿子示利米雅，去捉拿[b]书记巴录和先知耶利米；但雅威把他们藏了起来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“王的儿子耶拉篾”。
    reason: 说明“王子”在此表达的是亲属身份，不一定是正式头衔。
  - marker: b
    text: “捉拿”所译的希伯来词本义是“拿、取”；这里按上下文指拘拿他们。
    reason: 保留原词较宽的词义范围，并说明语境化译法。
lexical_decisions:
- source_word: וַיְצַוֶּה הַמֶּלֶךְ
  choice: 王命令
  rationale: צוה表示权威性的吩咐；“命令”准确保留其力度，并以自然汉语避免重复“王命令……”。
- source_word: יְרַחְמְאֵל בֶּן הַמֶּלֶךְ
  choice: 王子耶拉篾
  rationale: בן המלך直译为“王的儿子”；现代汉语以“王子”简洁自然地表达这一亲属身份，但不将其扩展为职官称号。
- source_word: שְׂרָיָהוּ בֶן עַזְרִיאֵל
  choice: 亚斯列的儿子西莱雅
  rationale: 保留父子身份结构，并依现代汉语习惯将父名置于“的儿子”之前。
- source_word: שֶׁלֶמְיָהוּ בֶּן עַבְדְּאֵל
  choice: 亚伯叠的儿子示利米雅
  rationale: 直接保留希伯来语父子身份结构，采用通行、易读的人名音译。
- source_word: לָקַחַת
  choice: 去捉拿
  rationale: לקח本义为“拿、取”，但此处是王派人拘拿巴录和耶利米；“捉拿”传达敌意性的拘捕行动，又不像“逮捕”那样预设现代法律程序。
- source_word: בָּרוּךְ הַסֹּפֵר
  choice: 书记巴录
  rationale: סֹפֵר可指抄写者或书记；本章语境强调巴录负责书写并宣读卷轴，“书记”在现代汉语中自然，也保留其实际职能。
- source_word: יִרְמְיָהוּ הַנָּבִיא
  choice: 先知耶利米
  rationale: נביא直接译为“先知”，清楚保留耶利米的身份。
- source_word: וַיַּסְתִּרֵם
  choice: 把他们藏了起来
  rationale: סתר的使役形表达使他们隐藏或将他们藏起；此译自然明确地保留雅威主动保护他们的行动。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以“雅威”音译四字神名，保留原文使用的专名，而不以称号替代。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用以色列上帝的专名；“雅威”较贴近通常重构的读音，并避免把专名改成称号。
- issue: 雅威隐藏二人的主动性
  choice: 但雅威把他们藏了起来
  alternative: 但他们被隐藏起来了
  rationale: 希伯来语明确以雅威为主语，并使用带复数宾语后缀的使役形动词；译文保留神主动隐藏、保护二人的陈述，不将其弱化为被动表达。
- issue: לקח在王命语境中的力度
  choice: 捉拿
  alternative: 带来；逮捕
  rationale: 上下文表明王要差人控制巴录和耶利米。“捉拿”保留敌意和强制性，同时不额外引入正式司法程序。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。人名使用简体中文圣经语境中较通行的音译；句末用“但”呈现王命与雅威保护之间的转折。
