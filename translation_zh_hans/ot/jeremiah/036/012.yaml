base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/036/012.yaml
  text: 'he went down to the king''s house, to the scribe''s chamber, and behold, all the officials were sitting there: Elishama the scribe, Delaiah son of Shemaiah, Elnathan son of Achbor, Gemariah son of Shaphan, Zedekiah son of Hananiah, and all the officials.'
translation:
  language: zh_hans
  text: 他下到王宫，来到书记的房间。只见所有官员都坐在那里：书记以利沙玛、示玛雅的儿子第莱雅、亚革波的儿子以利拿单、沙番的儿子基玛利雅、哈拿尼雅的儿子西底家，以及其余所有官员。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֵּית הַמֶּלֶךְ
  choice: 王宫
  rationale: 字面为“王的房屋”，在此指君王办公居住的宫殿；“王宫”是现代汉语自然且准确的表达。
- source_word: לִשְׁכַּת הַסֹּפֵר
  choice: 书记的房间
  rationale: לִשְׁכָּה 指宫中房间或办公厅；הַסֹּפֵר 指担任文书职务的书记。此处保留所属关系，不擅自断定专指以利沙玛。
- source_word: הַשָּׂרִים
  choice: 官员
  rationale: 在王宫行政语境中指掌权或任职的官员；“官员”比“首领”更贴合此处场景。
- source_word: וְהִנֵּה
  choice: 看哪
  rationale: 保留希伯来叙事中的现场感和注意提示；用现代读者仍能理解的庄重表达。
- source_word: וְכָל הַשָּׂרִים
  choice: 以及其余所有官员
  rationale: 名单前已说“所有官员”，末尾再次出现该短语，语用上指除已列名者外其余在场官员；补出“其余”避免汉语误解为机械重复。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而清楚的叙事体。人名按常见中文圣经音译处理；不添加原文未明说的身份、动机或神学解释。以句号分开行程与在场名单，使长句在现代汉语中更易读。
