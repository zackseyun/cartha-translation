source:
  edition: WLC
  text: קַח לְ/ךָ֮ מְגִלַּת סֵפֶר֒ וְ/כָתַבְתָּ֣ אֵלֶ֗י/הָ אֵ֣ת כָּל הַ/דְּבָרִ֞ים אֲשֶׁר דִּבַּ֧רְתִּי אֵלֶ֛י/ךָ עַל יִשְׂרָאֵ֥ל וְ/עַל יְהוּדָ֖ה וְ/עַל כָּל הַ/גּוֹיִ֑ם מִ/יּ֞וֹם דִּבַּ֤רְתִּי אֵלֶ֨י/ךָ֙ מִ/ימֵ֣י יֹאשִׁיָּ֔הוּ וְ/עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/036/002.yaml
  text: Take for yourself a scroll[a], and write on it all the words that I have spoken to you concerning Israel and concerning Judah and concerning all the nations, from the day I spoke to you, from the days of Josiah until this day.
translation:
  language: zh_hans
  text: 你拿一卷书卷，把我从约西亚的日子起直到今日对你所说的一切话，就是关于[a]以色列、犹大和列国的话，都写在上面。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“攻击以色列、犹大和列国”或“针对以色列、犹大和列国”。希伯来语介词 עַל 在先知语境中既可表示“关于”，也可表示“攻击、针对”。
    reason: 保留希伯来语介词 עַל 在此处的语义歧义，避免正文将全部话语预先限定为审判或完全排除审判意味。
lexical_decisions:
- source_word: קַח לְךָ
  choice: 你拿……来
  rationale: 命令式后的伦理与格 לְךָ 表明耶利米本人要采取行动；现代汉语用“你拿……来”自然传达这一命令和亲自参与的意味。
- source_word: מְגִלַּת סֵפֶר
  choice: 一卷书卷
  rationale: 该组合词指供书写的卷轴；“书卷”是庄重而易懂的现代汉语对应词，“一卷”同时表达其数量。
- source_word: וְכָתַבְתָּ אֵלֶיהָ
  choice: 都写在上面
  rationale: 连接词加完成式承接前面的命令，具有命令语气；“在上面”准确指向前述书卷。
- source_word: אֵת כָּל הַדְּבָרִים
  choice: 一切话
  rationale: דְּבָרִים 在先知受言并记录的语境中主要指所说的话；“一切话”保留启示言语的整体性。
- source_word: אֲשֶׁר דִּבַּרְתִּי אֵלֶיךָ
  choice: 我对你说过的
  rationale: 完成式指此前历次所说而如今仍须记录的话；汉语助词“过”自然体现既往经历。
- source_word: עַל יִשְׂרָאֵל וְעַל יְהוּדָה וְעַל כָּל הַגּוֹיִם
  choice: 关于以色列、犹大和列国
  rationale: עַל 在先知语境中既可表示“关于”，也可表示“攻击、针对”。正文采用较不限定内容性质的“关于”，并以脚注保留另一可能。汉语列举不必机械重复介词。
- source_word: כָּל הַגּוֹיִם
  choice: 列国
  rationale: 此处指以色列和犹大以外的各国；“列国”简洁、庄重，也避免后期宗教分类意味较强的“外邦人”。
- source_word: מִיּוֹם דִּבַּרְתִּי אֵלֶיךָ
  choice: 从我开始对你说话的那一天
  rationale: מִן 标明这段时期的起点；“开始”在汉语中明确其起始功能，并与后文“直到今日”顺畅呼应。
- source_word: מִימֵי יֹאשִׁיָּהוּ
  choice: 就是从约西亚的日子起
  rationale: 第二个时间短语进一步说明前述起点；“就是”体现同位解释关系，“日子”保留原文的历史时期表达。
- source_word: וְעַד הַיּוֹם הַזֶּה
  choice: 直到今日
  rationale: עַד 指时间范围的终点；“直到今日”忠实而符合庄重的现代汉语。
theological_decisions:
- issue: עַל 在以色列、犹大和列国之前的语义
  choice: 关于以色列、犹大和列国
  alternative: 攻击以色列、犹大和列国；针对以色列、犹大和列国
  rationale: 本节概括上帝历年来交付耶利米的全部话语，未明说这些话全是审判宣告。“关于”保留较广范围，不把内容预先限定为攻击；脚注同时保留先知审判语境中“攻击、针对”的真实可能。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“书卷”“列国”“直到今日”保持经文语体，但句法按现代汉语调整。用“就是”连接两个起始时间短语，使原文的同位说明清楚；正文中的脚注标记[a]紧随存在歧义的“关于”。
