source:
  edition: WLC
  text: לָ/כֵ֞ן כֹּֽה אָמַ֣ר יְהוָ֗ה עַל יְהֽוֹיָקִים֙ מֶ֣לֶךְ יְהוּדָ֔ה לֹא יִֽהְיֶה לּ֥/וֹ יוֹשֵׁ֖ב עַל כִּסֵּ֣א דָוִ֑ד וְ/נִבְלָת/וֹ֙ תִּֽהְיֶ֣ה מֻשְׁלֶ֔כֶת לַ/חֹ֥רֶב בַּ/יּ֖וֹם וְ/לַ/קֶּ֥רַח בַּ/לָּֽיְלָה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/036/030.yaml
  text: 'Therefore this is what Yahweh says concerning Jehoiakim king of Judah: He will have no one to sit on the throne of David[a], and his dead body will be thrown out to the heat by day and to the frost by night.'
translation:
  language: zh_hans
  text: 因此，雅威论到犹大王约雅敬这样说：“必没有属他的人坐在大卫的宝座上；他的尸首必被抛在外面，白天遭受炎热[a]，夜间遭受霜冻。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “炎热”或译“干旱”；希伯来词也可表示干燥或旱灾。
    reason: 保留 חֹרֶב 的词义范围；正文按昼夜天气对偶译作“炎热”。
lexical_decisions:
- source_word: לָכֵן
  choice: 因此
  rationale: 明确承接上文，保留先知宣告中因果推论的力度。
- source_word: כֹּה אָמַר יְהוָה
  choice: 雅威这样说
  rationale: 以自然的现代汉语保留先知使者公式，并将四字神名 יְהוָה 音译为“雅威”。
- source_word: עַל יְהוֹיָקִים מֶלֶךְ יְהוּדָה
  choice: 论到犹大王约雅敬
  rationale: עַל 在此引出审判宣告所针对的人；“论到”既不削弱敌对语境，也不把介词过度明确为“攻击”。
- source_word: לֹא יִהְיֶה לּוֹ יוֹשֵׁב עַל כִּסֵּא דָוִד
  choice: 他必没有人坐在大卫的宝座上
  rationale: 贴近希伯来文“属于他/对他而言，不会有坐在……上的人”的表达，不擅自补入原文未明说的“后裔”，同时保留王朝延续的语境含义。
- source_word: נִבְלָתוֹ
  choice: 他的尸首
  rationale: 准确表达死者遗体及其遭受弃置的羞辱，语言庄重而清楚。
- source_word: מֻשְׁלֶכֶת
  choice: 必被抛在外面
  rationale: 保留被动及弃置、抛出的强烈意味；“在外面”使尸首未得安葬并暴露于天气之下的图景在汉语中自然清楚。
- source_word: לַחֹרֶב בַּיּוֹם
  choice: 白天遭受炎热
  rationale: חֹרֶב 可指热、干燥或干旱；与夜间的霜冻平行时，“炎热”最能表达尸首暴露于昼夜极端天气的图景。
- source_word: לַקֶּרַח בַּלָּיְלָה
  choice: 夜间遭受霜冻
  rationale: קֶרַח 具体指冰霜或严寒；“霜冻”保留具体意象及与白昼炎热的对偶。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；采用“雅威”音译，明确保留其作为神圣专名的性质。
- issue: 约雅敬王位继承审判的表述范围
  choice: 他必没有人坐在大卫的宝座上
  alternative: 他的后裔必没有人坐在大卫的宝座上
  rationale: 语境显然涉及王朝继承，但原文没有明说“后裔”；正文不补入这一解释，以保留希伯来文措辞的宽度和审判宣告的张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。先知宣告公式简洁有力；以“尸首”“抛在外面”“霜冻”等具体词语保留审判场景的羞辱感和鲜明意象。
