lexical_decisions:
- source_word: וְהַמֶּלֶךְ
  choice: 王
  rationale: 定冠词表明是上下文中已知的王；句首的 וְ 在此承接叙事，中文无需机械译作“并且”。
- source_word: יוֹשֵׁב
  choice: 坐在
  rationale: 分词描写持续的背景状态；“坐在”配合“正烧着”，自然呈现当时的场景。
- source_word: בֵּית הַחֹרֶף
  choice: 过冬的宫室
  rationale: 原文直译为“冬天的房屋”，指寒冷季节使用的王室居所；“过冬的宫室”既保留季节用途，也避免“冬宫”可能引起的专名联想。
- source_word: בַּחֹדֶשׁ הַתְּשִׁיעִי
  choice: 在九月
  rationale: 按原文保留“第九月”的历法表达；现代中文圣经语体中简洁译作“九月”。
- source_word: וְאֶת
  choice: 他面前的
  rationale: 此处引出伴随场景，不宜按通常的直接宾语标记处理；中文改用并列分句自然表达。
- source_word: הָאָח
  choice: 火盆
  rationale: 该词指盛放炭火、供人取暖的器具；“火盆”比“壁炉”更能避免暗示固定式炉膛。
- source_word: לְפָנָיו
  choice: 他面前
  rationale: 直接保留原文的空间关系。
- source_word: מְבֹעָרֶת
  choice: 正烧着
  rationale: 被动分词描写火盆处于点燃、燃烧的状态；“正烧着”自然体现持续情状。
