id: JER.36.7
reference: Jeremiah 36:7
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: אוּלַ֞י תִּפֹּ֤ל תְּחִנָּתָ/ם֙ לִ/פְנֵ֣י יְהוָ֔ה וְ/יָשֻׁ֕בוּ אִ֖ישׁ מִ/דַּרְכּ֣/וֹ הָ/רָעָ֑ה כִּֽי גָד֤וֹל הָ/אַף֙ וְ/הַ֣/חֵמָ֔ה אֲשֶׁר דִּבֶּ֥ר יְהוָ֖ה אֶל הָ/עָ֥ם הַ/זֶּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/036/007.yaml
  text: Perhaps their plea will fall before Yahweh[a], and each man will turn from his evil way[c][b], for great is the anger and the wrath that Yahweh has spoken against this people.
translation:
  language: zh_hans
  text: 或许他们的恳求会呈到耶和华面前[a]，各人就回转，离开自己的恶道[b]；因为耶和华对这百姓所宣告的怒气和烈怒甚大[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“他们的恳求会落在耶和华面前”，是指恳求被带到他面前或陈明在他面前。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“各人离开他的恶道”；这里用阳性单数作分配表达，意为逐一指向每个人。
    reason: lexical_alternative
  - marker: c
    text: 也可译作“耶和华向这百姓所说的”。原文介词通常表示“向、对”；“所宣告的”按上下文表明这是针对百姓的审判信息。
    reason: lexical_alternative
lexical_decisions:
- source_word: אוּלַי
  choice: 或许
  rationale: 保留原文所表达的可能与盼望，不把结果说成确定之事。
- source_word: תִּפֹּל תְּחִנָּתָם לִפְנֵי יְהוָה
  choice: 他们的恳求会呈到耶和华面前
  rationale: 希伯来语直译为“他们的恳求会落在耶和华面前”，是把诉求陈到他面前的习语；正文采用自然的现代汉语表达，脚注保留原文意象。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代汉语圣经读者熟悉的神圣名字音译，不以头衔代替专名。
- source_word: וְיָשֻׁבוּ
  choice: 就回转
  rationale: שׁוּב在此指从恶行转回；“回转”保留方向转变的比喻，也不直接以神学术语“悔改”替换。
- source_word: אִישׁ
  choice: 各人
  rationale: 原文以阳性单数作分配用法，重点在逐一指向每个人；现代汉语“各人”自然保留这种个别化语气。
- source_word: מִדַּרְכּוֹ הָרָעָה
  choice: 离开自己的恶道
  rationale: “道”保留 דֶּרֶךְ 以道路喻行为和生活方式的圣经意象，“恶”直接对应 רָעָה。
- source_word: גָדוֹל הָאַף וְהַחֵמָה
  choice: 怒气和烈怒甚大
  rationale: 分别译出两个意义重叠的愤怒词，保留原文的强化效果；“烈怒”体现 חֵמָה 的强烈程度。
- source_word: אֲשֶׁר דִּבֶּר יְהוָה אֶל הָעָם הַזֶּה
  choice: 耶和华对这百姓所宣告的
  rationale: אֶל 通常表示“向、对”，而上下文表明所宣告的是审判；“对……所宣告”既保留介词方向，也让汉语句意通顺。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用四字神名；正文保留为专名。现代简体中文语境中“耶和华”最为通行，“雅威”则是较贴近学术重构读音的可选译法。
- issue: שׁוּב 在悔改语境中的表达
  choice: 回转
  alternative: 悔改
  rationale: “回转”保留原文的空间隐喻，并让“离开自己的恶道”具体说明其含义，避免把词义直接收窄为后来的神学术语。
- issue: אֶל הָעָם הַזֶּה 的方向或敌对含义
  choice: 对这百姓所宣告的
  alternative: 向这百姓所说的／宣告要临到这百姓的
  rationale: 介词本身通常是“向、对”，但语境是审判宣告。正文不将其直接改成“攻击、反对”，同时以“宣告”呈现严肃的判词语境。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“呈到……面前”避免照搬希伯来语习语造成生硬；“回转”“恶道”“怒气和烈怒”保留先知文学的核心意象与力度。句式略带经文的凝练感，但普通读者仍可直接理解。
