id: JER.36.23
reference: Jeremiah 36:23
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יְהִ֣י כִּ/קְר֣וֹא יְהוּדִ֗י שָׁלֹ֣שׁ דְּלָתוֹת֮ וְ/אַרְבָּעָה֒ יִֽקְרָעֶ֨/הָ֙ בְּ/תַ֣עַר הַ/סֹּפֵ֔ר וְ/הַשְׁלֵ֕ךְ אֶל הָ/אֵ֖שׁ אֲשֶׁ֣ר אֶל הָ/אָ֑ח עַד תֹּם֙ כָּל הַ/מְּגִלָּ֔ה עַל הָ/אֵ֖שׁ אֲשֶׁ֥ר עַל הָ/אָֽח׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/036/023.yaml
  text: And whenever Yehudi had read three or four columns[a], he would cut it off with the scribe’s knife and throw it into the fire that was in the brazier[b], until the entire scroll was consumed in the fire that was in the brazier.
translation:
  language: zh_hans
  text: 每逢耶户底读了三四栏[a]，他就用书记的刀把那部分割下来，扔进火盆[b]里的火中，直到整卷书都在火盆里的火中烧尽。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“三扇或四扇门”；这里指书卷的版面分段，可能是栏或幅。
    reason: lexical_alternative
  - marker: b
    text: “火盆”也可译作“火炉”或“火钵”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּקְרֹא
  choice: 每逢……读了
  rationale: כְּ加不定式在连续叙事中配合后续动作，表达反复发生的时间关系；“每逢……读了”自然呈现每读完一段便采取行动的过程。
- source_word: יְהוּדִי
  choice: 耶户底
  rationale: 按希伯来语人名形式音译，并采用现代中文圣经读者较易辨认的译名。
- source_word: שָׁלֹשׁ דְּלָתוֹת וְאַרְבָּעָה
  choice: 三四栏
  rationale: דְּלָתוֹת字面为“门”，此处指书卷上依次展开、诵读的版面分段，按语境译作“栏”最清楚；脚注保留字面信息及其他可能理解。
- source_word: יִקְרָעֶהָ
  choice: 把那部分割下来
  rationale: קרע通常可指撕裂，但这里明确使用书记的刀，故译为“割下来”；“那部分”说明阴性代词所指的是刚读过的书卷部分，同时避免误解为每次割下整卷。
- source_word: בְּתַעַר הַסֹּפֵר
  choice: 用书记的刀
  rationale: תַעַר是刀片或剃刀；结合切割书卷的用途，“刀”最自然。סֹפֵר可指书记或文士，此处宫廷行政场景中译“书记”。
- source_word: וְהַשְׁלֵךְ
  choice: 扔进
  rationale: 该形式承接反复动作；“扔进”简洁地保留将割下部分投入火中的力度和方向。
- source_word: הָאָח
  choice: 火盆
  rationale: אָח指室内盛火或设火的器具；结合冬宫语境，“火盆”是现代中文中清楚自然的对应词。
- source_word: עַד תֹּם כָּל הַמְּגִלָּה
  choice: 直到整卷书都……烧尽
  rationale: 原文直译为“直到整卷书完了”；上下文是逐段投入火中，译作“烧尽”自然表达这一终点，但不改变事件结果。
- source_word: הַמְּגִלָּה
  choice: 书卷
  rationale: מְגִלָּה指卷轴形式的文书；“书卷”准确且符合庄重的现代中文经文语体。
- source_word: אֶל הָאֵשׁ אֲשֶׁר אֶל הָאָח / עַל הָאֵשׁ אֲשֶׁר עַל הָאָח
  choice: 进火盆里的火中／在火盆里的火中
  rationale: 希伯来文前后分别使用אֶל和עַל；中文依动作与结果分别译作“进……中”和“在……中”，自然表达投入和焚烧的位置关系。
theological_decisions:
- issue: 割书卷并投入火中的动作主体
  choice: 保留代词“他”
  alternative: 明确译作“王”
  rationale: 本节希伯来文动词为第三人称阳性单数，但没有明说主语。虽可由上下文理解为王，正文仍不补入“王”，以保留原文的指代形式与潜在歧义。
translation_notes:
  register: 采用现代、庄重而通顺的普通话。“每逢……就……”呈现反复过程；“那部分”澄清每次被割下的是刚读过的书卷部分。正文不把代词“他”解释性改成“王”，以忠实保留原文未明说主语的表达。
