  text: וַ/יְצַוֶּ֣ה יִרְמְיָ֔הוּ אֶת בָּר֖וּךְ לֵ/אמֹ֑ר אֲנִ֣י עָצ֔וּר לֹ֣א אוּכַ֔ל לָ/ב֖וֹא בֵּ֥ית יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/036/005.yaml
  text: Then Jeremiah commanded Baruch[a], saying, “I am restrained; I cannot go into the house of Yahweh.”
translation:
  language: zh_hans
  text: 耶利米吩咐巴录说：“我受到限制[a]，不能进耶和华的殿。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“被拘禁”“被关着”或“受到阻拦”。希伯来文没有明确说明耶利米所受限制的具体性质。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַוֶּה
  choice: 吩咐
  rationale: צוה 的皮埃勒词干表示带有权威的命令或嘱咐；“吩咐”既保留其指令性，也符合现代汉语叙事表达。
- source_word: לֵאמֹר
  choice: 说
  rationale: 这是引出直接引语的常用公式；译作“说”简洁自然。
- source_word: עָצוּר
  choice: 受到限制
  rationale: 该词表示被拦阻、受约束或遭禁闭，但经文本身没有说明限制的性质。“受到限制”保留这种不确定性，避免擅自断定耶利米已被监禁。
- source_word: לֹא אוּכַל
  choice: 不能
  rationale: 直接表达否定的能力或可能性，符合现代汉语习惯。
- source_word: לָבוֹא
  choice: 进
  rationale: 在“耶和华的殿”这一处所前，“进”自然表达进入其中或其范围的意思。
- source_word: בֵּית יְהוָה
  choice: 耶和华的殿
  rationale: בֵּית 字面为“家、房屋”，在此指敬拜场所；“殿”在中文圣经语境中清楚而庄重，并避免让读者误解为普通住宅。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文读者熟悉的专名“耶和华”呈现四字神名，保留其专名性质。
theological_decisions:
- issue: עָצוּר 所指限制的具体性质
  choice: 不在正文中说明限制来源，只译为“受到限制”
  alternative: 译作“被拘禁”或“被监禁”
  rationale: 原文没有明确耶利米是遭官方拘押、礼仪方面受限，还是因其他缘故无法入殿；译文应保留这一张力。
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 上主
  rationale: 原文直接使用四字神名；译作“耶和华”在简体中文中明确呈现其专名性质，而不是以称号取代。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“吩咐……说”保留希伯来文的发言引介结构；正文中的[a]与脚注对应。“耶和华的殿”既自然，也准确指向圣殿。
