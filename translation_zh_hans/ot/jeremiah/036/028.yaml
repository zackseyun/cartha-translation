  yaml_path: translation/ot/jeremiah/036/028.yaml
  text: Take for yourself another scroll and write on it all the former words that were on the first scroll[a], which Jehoiakim king of Judah burned.
translation:
  language: zh_hans
  text: “你要再拿另一卷书卷，把先前在第一卷书卷上的一切话都写在上面；第一卷书卷是犹大王约雅敬烧掉的。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שׁוּב קַח לְךָ
  choice: 你要再拿……来
  rationale: שׁוּב置于命令式קַח之前，在这里作副词性用法，表示“再一次”；“拿……来”符合现代汉语命令句习惯。לְךָ所表达的亲自领受命令之意已由“你要”及语境自然体现，不生硬直译为“为自己”。
- source_word: מְגִלָּה אַחֶרֶת
  choice: 一卷别的书卷
  rationale: מְגִלָּה指供书写的卷轴，译作“书卷”清楚且符合圣经时代语境；אַחֶרֶת译作“别的”，并与前面的“再”一同保留原文既有重复动作又有更换书卷的双重表达。
- source_word: וּכְתֹב עָלֶיהָ
  choice: 都写在上面
  rationale: 准确表达命令式“写”和书写载体“在其上”；“都”与后面的“一切话”呼应，使汉语自然。
- source_word: אֵת כָּל הַדְּבָרִים הָרִאשֹׁנִים
  choice: 先前……的一切话
  rationale: דְּבָרִים在本段指书卷中的言语或内容，译作“话”；הָרִאשֹׁנִים在此表示先前已有的内容，译作“先前”比“最初”更自然。
- source_word: אֲשֶׁר הָיוּ עַל הַמְּגִלָּה הָרִאשֹׁנָה
  choice: 写在第一卷书卷上的
  rationale: 原文直义为“在第一卷书卷上的”；汉语补出语境隐含的“写”，明确这些话原先载于该书卷，而不增加新的实质信息。
- source_word: אֲשֶׁר שָׂרַף יְהוֹיָקִים מֶלֶךְ יְהוּדָה
  choice: 那卷书卷是犹大王约雅敬烧掉的
  rationale: 将关系从句独立处理，清楚表明约雅敬烧掉的是第一卷书卷，避免汉语误读成烧掉“一切话”。שָׂרַף译作“烧掉”，表达焚毁书卷，但不额外强化。
