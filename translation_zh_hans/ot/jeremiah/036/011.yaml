  text: וַ֠/יִּשְׁמַ֗ע מִכָ֨יְהוּ בֶן גְּמַרְיָ֧הוּ בֶן שָׁפָ֛ן אֶת כָּל דִּבְרֵ֥י יְהוָ֖ה מֵ/עַ֥ל הַ/סֵּֽפֶר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/036/011.yaml
  text: And Micaiah son of Gemariah[a], son of Shaphan, heard all the words of Yahweh from the scroll.
translation:
  language: zh_hans
  text: 基玛利雅的儿子，沙番的孙子米该亚，听见了书卷上雅威[a]的一切话。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文为“YHWH”（四字神名），传统译作“耶和华”。
    reason: 说明神名原文及传统译法。
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: 听见了
  rationale: 该形式在叙事中表示过去发生的事件；这里强调米该亚听到书卷内容，而不必译成较具持续意味的“聆听”。
- source_word: מִכָיְהוּ
  choice: 米该亚
  rationale: 采用现代中文圣经中较通行、易辨识的人名译法。
- source_word: בֶן גְּמַרְיָהוּ בֶן שָׁפָן
  choice: 沙番的孙子、基玛利雅的儿子
  rationale: 按自然汉语调整希伯来语父系身份链的次序，同时完整保留两代亲属关系。
- source_word: כָּל
  choice: 一切
  rationale: 保留原文所强调的完整范围。
- source_word: דִּבְרֵי יְהוָה
  choice: 雅威的一切话
  rationale: דִּבְרֵי直译为“话”，不改写成较宽泛的“信息”；神名按其专名音译为“雅威”。
- source_word: מֵעַל הַסֵּפֶר
  choice: 从书卷上读出的
  rationale: 该短语说明所听内容来自书卷；汉语补出语境隐含的“读出”，比生硬的“从书卷上”更清楚，并保留古代卷轴文献的含义。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 上主（传统译法）
  rationale: 原文直接使用四字神名；正文以“雅威”保留其专名性质，脚注交代传统替代译法，不把专名无声改成称号。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“沙番的孙子、基玛利雅的儿子”符合汉语身份介绍习惯；“书卷”保留古代文本载体。“从书卷上读出的”明确表达原文介词短语在此处所指的诵读来源。
