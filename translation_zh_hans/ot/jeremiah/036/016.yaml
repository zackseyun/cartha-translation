base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/036/016.yaml
  text: And when they heard all the words[a], each man turned in fear to his companion, and they said to Baruch, “We must surely tell the king all these words.”
translation:
  language: zh_hans
  text: 他们听见所有的话，就害怕起来，彼此相望[a]，对巴录说：“我们一定要把这一切话禀告王。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们都害怕，彼此面面相觑。”希伯来语直译近似“他们害怕，各人对着同伴”，表达众人彼此间共同的惊惧反应。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כְּשָׁמְעָם
  choice: 他们听见……就
  rationale: וַיְהִי在这里推进叙事，并与כְּשָׁמְעָם构成时间关系；用现代汉语“……就……”自然表达，无须生硬译出“事情发生了”。
- source_word: אֶת כָּל הַדְּבָרִים
  choice: 这一切话
  rationale: 上下文是宣读书卷，דְּבָרִים在此指所宣读的话语；“这一切话”既明确又符合汉语表达。
- source_word: פָּחֲדוּ אִישׁ אֶל רֵעֵהוּ
  choice: 害怕起来，彼此相望
  rationale: פָּחֲדוּ明确表示惧怕；אִישׁ אֶל רֵעֵהוּ描述众人彼此之间的反应。正文采用自然汉语呈现这种共同而可见的惊惧，同时以脚注保留希伯来语表达的歧义。
- source_word: וַיֹּאמְרוּ אֶל בָּרוּךְ
  choice: 对巴录说
  rationale: 直接表达叙事中的说话对象，简洁自然。
- source_word: הַגֵּיד נַגִּיד
  choice: 我们一定要……禀告
  rationale: 不定式绝对式与未完成式同根连用，强化报告的确定性或迫切性；נַגִּיד为第一人称复数，因此保留“我们”，而不译成对巴录的单数命令。
- source_word: לַמֶּלֶךְ
  choice: 王
  rationale: 所指为上下文中明确的在位君王；汉语在“禀告王”中无需另加指示词。
- source_word: אֵת כָּל הַדְּבָרִים הָאֵלֶּה
  choice: 这一切话
  rationale: 保留原文对“话”的重复，并以“这一切”表达הָאֵלֶּה的指示意义。
theological_decisions: []
