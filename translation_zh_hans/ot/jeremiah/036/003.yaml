language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: אוּלַ֤י יִשְׁמְעוּ֙ בֵּ֣ית יְהוּדָ֔ה אֵ֚ת כָּל הָ֣/רָעָ֔ה אֲשֶׁ֛ר אָנֹכִ֥י חֹשֵׁ֖ב לַ/עֲשׂ֣וֹת לָ/הֶ֑ם לְמַ֣עַן יָשׁ֗וּבוּ אִ֚ישׁ מִ/דַּרְכּ֣/וֹ הָ/רָעָ֔ה וְ/סָלַחְתִּ֥י לַ/עֲוֺנָ֖/ם וּ/לְ/חַטָּאתָֽ/ם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/036/003.yaml
  text: Perhaps the house of Judah will hear of all the disaster that I am planning to bring on them[a], so that each man may turn from his evil way[b], and I will forgive their iniquity and their sin.
translation:
  language: zh_hans
  text: 或许犹大家会听见我计划降在他们身上的一切灾祸[a]，好叫他们各人离开自己的恶道[b]；我便赦免他们的罪孽和罪。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “灾祸”也可译作“灾难”。原文用词也可表示“恶”，但这里指上帝警告将降给犹大的审判，并非指上帝行道德上的恶。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“各人离开他的恶道”，以单数形式逐一指犹大家的成员。
    reason: lexical_alternative
lexical_decisions:
- source_word: אוּלַי
  choice: 或许
  rationale: 保留原文所表达的可能与期待，不把结果说成确定发生。
- source_word: יִשְׁמְעוּ
  choice: 听见
  rationale: 保留“听见”的基本义；是否作出回应则由后面的目的从句表达。
- source_word: בֵּית יְהוּדָה
  choice: 犹大家
  rationale: 保留原文“犹大家”的群体性、盟约性称谓，同时符合中文圣经语体。
- source_word: אֵת כָּל הָרָעָה
  choice: 这一切灾祸
  rationale: 此处指上帝警告要降下的审判性灾难，而不是道德意义上的邪恶。
- source_word: חֹשֵׁב לַעֲשׂוֹת לָהֶם
  choice: 我打算降在他们身上的
  rationale: חֹשֵׁב加不定式表示筹划或意图；在灾祸的语境中，“降在……身上”自然表达לָהֶם的指向。
- source_word: לְמַעַן יָשׁוּבוּ
  choice: 就会……回转
  rationale: 表达原文的目的和所期待的结果，并保留שׁוב“回转”的先知性用语。
- source_word: אִישׁ מִדַּרְכּוֹ הָרָעָה
  choice: 各人回转，离开自己的恶道
  rationale: אִישׁ在这里以单数形式逐一指向犹大家的成员；“各人”在现代汉语中自然且不排除任何成员。“恶道”保留行为道路的先知性比喻。
- source_word: וְסָלַחְתִּי
  choice: 这样，我就赦免
  rationale: 连词在上下文中表达回转之后的结果；“这样……就……”使中文关系清楚而不改变条件与应许之间的张力。
- source_word: לַעֲוֺנָם וּלְחַטָּאתָם
  choice: 他们的罪孽和罪
  rationale: 分别翻译עָוֹן与חַטָּאת，不将两个相关但有别的词合并；“罪孽”保留前者较重的道德含义。
theological_decisions:
- issue: רָעָה用于上帝所预告的审判
  choice: 灾祸
  alternative: 邪恶；灾难
  rationale: 本节所说的是上帝将降给犹大的审判性祸患，不是说上帝施行道德上的邪恶；“灾祸”既避免误解，也保留先知警告的力度。
- issue: 代表性单数阳性אִישׁ
  choice: 各人
  alternative: 每个男人；人人
  rationale: 此处的阳性单数逐一代表犹大家的成员。现代汉语“各人”既保留逐一分配的含义，也避免把原文的代表性用法误解为只涉及成年男性。
- issue: 回转与赦免的关系
  choice: 这样，我就赦免
  alternative: 我便可以赦免；于是我会赦免
  rationale: 原文把百姓离开恶道与上帝赦免相连接，但并未在本节系统说明悔改和赦免的全部神学关系；译文只呈现句中的顺序与结果，不额外建构教义。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“犹大家”“回转”“恶道”“罪孽”等词保留先知文献的宗教与修辞色彩；通过“听见……灾祸”“降在……身上”和“这样……就……”使句法符合自然现代汉语。
