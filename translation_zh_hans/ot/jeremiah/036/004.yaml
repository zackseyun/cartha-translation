  text: וַ/יִּקְרָ֣א יִרְמְיָ֔הוּ אֶת בָּר֖וּךְ בֶּן נֵֽרִיָּ֑ה וַ/יִּכְתֹּ֨ב בָּר֜וּךְ מִ/פִּ֣י יִרְמְיָ֗הוּ אֵ֣ת כָּל דִּבְרֵ֧י יְהוָ֛ה אֲשֶׁר דִּבֶּ֥ר אֵלָ֖י/ו עַל מְגִלַּת סֵֽפֶר־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/036/004.yaml
  text: So Jeremiah called Baruch son of Neriah[a], and Baruch wrote on a scroll all the words of Yahweh from Jeremiah’s mouth[b], which he had spoken to him.
translation:
  language: zh_hans
  text: 于是，耶利米叫来尼利亚的儿子巴录。巴录照耶利米口述[a]，把雅威对耶利米说的一切话写在书卷上[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译：“从耶利米口中”，意思是巴录按耶利米的口述书写。
    reason: lexical_alternative
  - marker: b
    text: 原文较直译为“写在一卷书上”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: 叫来
  rationale: 此处 קרא 表示叫某人前来；“叫来”符合现代汉语，也不赋予“召见”可能带有的过强权威色彩。
- source_word: בָּרוּךְ בֶּן נֵרִיָּה
  choice: 尼利亚的儿子巴录
  rationale: 按现代汉语自然次序表达父子关系，并采用通行的圣经人名译法。
- source_word: וַיִּכְתֹּב
  choice: 写
  rationale: 忠实表达 כתב 的基本义；宾语和书写载体已由上下文明确，无须增译。
- source_word: מִפִּי יִרְמְיָהוּ
  choice: 照耶利米口述
  rationale: 原文直译为“从耶利米口中”，在本语境中指巴录按耶利米的口述书写；正文采用自然明确的现代汉语，原有意象见脚注。
- source_word: כָּל דִּבְרֵי יְהוָה
  choice: 雅威……一切话
  rationale: 保留 דְּבָרִים 的具体“话语”含义，而不笼统译作“信息”或“内容”。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以“雅威”音译四字神名，保留其作为专名的性质，不以称号替代。
- source_word: אֲשֶׁר דִּבֶּר אֵלָיו
  choice: 雅威对耶利米说的
  rationale: 希伯来语代词在语境中分别回指雅威和耶利米；汉语若直用“他对他说的”会造成不必要的指代混乱，因此复现人名，但不增添“借着”等原文没有的含义。
- source_word: עַל מְגִלַּת סֵפֶר
  choice: 写在书卷上
  rationale: 该词组指供书写的卷轴文书；“书卷”简洁、庄重，也为普通现代读者所能理解。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名。译作“雅威”保留专名性质，并较接近学界通常重构的读音；不以“上主”这一称号替换。
- issue: אֲשֶׁר דִּבֶּר אֵלָיו 的指代
  choice: 雅威对耶利米说的
  alternative: 他对他说的
  rationale: 按句法与语境，主语是雅威，间接宾语是耶利米。复现所指对象是为避免现代汉语歧义，并未将“对他说”神学化为“借着他说”。
translation_notes:
  register: 采用现代、清楚而庄重的叙事语体。首句独立成句，使动作次序自然；第二句以“照耶利米口述”表达听写关系。所有脚注标记均置于所注释的对应短语之后。
