base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/036/020.yaml
  text: Then they went to the king in the court[a], and they deposited the scroll in the chamber of Elishama the scribe[b], and they reported all the words in the hearing of the king.
translation:
  language: zh_hans
  text: 他们就到院子里去见王，把书卷存放在文士以利沙玛的房间里，然后把这一切话都说给王听。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹאוּ אֶל־הַמֶּלֶךְ חָצֵרָה
  choice: 他们就到院子里去见王
  rationale: 方向词尾表明他们朝院子而去，而“到……去见王”自然表达叙事推进、行动方向和王所在的宫廷院落。
- source_word: הַמְּגִלָּה
  choice: 书卷
  rationale: 指可卷起的书写载体；“书卷”是现代中文圣经语境中清楚而庄重的表达。
- source_word: הִפְקִדוּ
  choice: 存放
  rationale: 该使役形式在这里有交付保管、妥善放置之意；“存放”既保留保管意味，又不过度推断具体托付程序。
- source_word: בְּלִשְׁכַּת אֱלִישָׁמָע
  choice: 在以利沙玛的房间里
  rationale: לִשְׁכָּה 指宫廷建筑中的房间或办公用房；“房间”比“内室”少添色彩，也比现代官制意味较强的“办公室”更稳妥。
- source_word: הַסֹּפֵר
  choice: 文士
  rationale: סֹפֵר 可指抄写者、书记或宫廷秘书；“文士”保留其传统称谓及职能上的一定开放性。
- source_word: וַיַּגִּידוּ
  choice: 说给……听
  rationale: 在此指向王禀告或陈述；中文“说给王听”与后面的“在王耳中”这一听觉习语自然对应。
- source_word: אֵת כָּל־הַדְּבָרִים
  choice: 这一切话
  rationale: דְּבָרִים 在上下文中指刚才所读、所议的全部内容；“这一切话”保留其言语和文本色彩。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。按希伯来文三个连续动词依次译出“到……去见”“存放”“说给……听”，不把第二个动作从属化。原文“在王耳中”属于自然可转换的听觉习语，因此正文译作“说给王听”，无需脚注。
