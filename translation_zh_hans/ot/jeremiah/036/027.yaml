base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/036/027.yaml
  text: Then the word of Yahweh came to Jeremiah[a], after the king had burned the scroll and the words that Baruch had written from the mouth of Jeremiah, saying,
translation:
  language: zh_hans
  text: 王烧毁书卷和巴录按耶利米口述[a]写下的话以后，耶和华的话临到耶利米，说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“从耶利米口中”。
    reason: 保留 מִפִּי יִרְמְיָהוּ 的字面表达，并说明正文“按耶利米口述”的原文依据。
lexical_decisions:
- source_word: וַיְהִי דְבַר יְהוָה אֶל יִרְמְיָהוּ
  choice: 耶和华的话临到耶利米
  rationale: 保留先知书中标准的启示公式；上下文已用“以后”明确叙事推进，无须生硬译出“事情发生了”。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代简体中文圣经语境中通行的专名形式表达四字神名，而非以“主”这一称号替代。
- source_word: אַחֲרֵי שְׂרֹף הַמֶּלֶךְ
  choice: 王……烧毁……以后
  rationale: 将介词加不定式结构自然译为先于主句发生的时间从句。
- source_word: הַמְּגִלָּה וְאֶת הַדְּבָרִים
  choice: 书卷和其中的话
  rationale: 既区分承载文字的实体书卷与所写的话，又以“其中”明确这些话就在被焚的书卷上，符合汉语表达。
- source_word: אֲשֶׁר כָּתַב בָּרוּךְ
  choice: 这些话是巴录……写下的
  rationale: 明确关系从句修饰“话”，并保持巴录是书写者。
- source_word: מִפִּי יִרְמְיָהוּ
  choice: 照耶利米口述
  rationale: 希伯来语直译为“从耶利米口中”，在此表示以耶利米口头所说的为来源；“照……口述”自然且保留听写关系。
- source_word: לֵאמֹר
  choice: 耶和华说：
  rationale: 该词引出下一节的神谕；中文以冒号衔接后文比悬置的“说”更自然，并从主句清楚补出说话者。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用神的专名而非“主”这一称号；“耶和华”是现代普通中文读者最熟悉且可辨识为专名的形式。
- issue: “耶和华的话”是话语还是一般信息
  choice: 耶和华的话
  alternative: 耶和华的信息
  rationale: “话”保留先知启示公式的语言形式和神学分量，不将其解释性地弱化为一般“信息”。
- issue: מִפִּי יִרְמְיָהוּ 所表达的传递关系
  choice: 照耶利米口述
  alternative: 从耶利米口中
  rationale: 语境表明巴录写下耶利米口述的话；正文采用自然汉语，脚注保留原文身体意象，避免掩盖其字面形式。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。将较长的希伯来语句拆为两句，以免修饰关系含混；“王”承接上下文中的已知君王，“书卷”保留古代卷轴文书的语境。
