revisions:
- from: 米该亚就把他听见的所有话告诉了他们，就是巴录在百姓听得到的地方宣读书卷时，他所听见的。[a]
  to: 米该亚就把巴录当着百姓宣读书卷时所听见的一切话，都告诉了他们。[a]
  rationale: 修订保留“所有／一切话”、书卷和公开宣读等关键要素，将“在百姓听得到的地方”改为“当着百姓”，并重组句法以消除不必要的空间含义和代词指代负担。脚注保留原文关系从句与时间结构的可行中文替代表达。
