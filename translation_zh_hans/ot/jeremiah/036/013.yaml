  yaml_path: translation/ot/jeremiah/036/013.yaml
  text: And Micaiah told them all the words that he had heard when Baruch read the scroll in the hearing of the people[a].
translation:
  language: zh_hans
  text: 米该亚就把巴录当着百姓宣读书卷时所听见的一切话，都告诉了他们。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“米该亚就把他听见的所有话告诉了他们；这些话是巴录当着百姓宣读书卷时他所听见的。”
    reason: 原文关系从句与时间结构可在中文中采用不同语序组合；两种译法都表明所听见的话是米该亚在巴录公开宣读时听见的。
lexical_decisions:
- source_word: וַיַּגֵּד
  choice: 告诉了
  rationale: 该词的使役形在此表示把所知的信息告知或报告给人；“告诉了”符合现代叙事语体，也不过度强化正式宣告的意味。
- source_word: לָהֶם
  choice: 他们
  rationale: 作间接宾语，按上下文指前文的众首领。
- source_word: מִכָיְהוּ
  choice: 米该亚
  rationale: 采用现代中文圣经人名的通行音译。
- source_word: אֵת כָּל־הַדְּבָרִים
  choice: 所有话
  rationale: דְּבָרִים 在这里指宣读出来的言语及其内容；保留“话”可呼应本章对口述、书写和宣读之言的强调。
- source_word: אֲשֶׁר שָׁמֵעַ
  choice: 他听见的
  rationale: 完成式表示这些话是在米该亚转告之前听见的；中文借语序和上下文自然体现先后，无须另加过去完成标记。
- source_word: בִּקְרֹא
  choice: 宣读……时
  rationale: 介词加不定词结构表示时间情境；“宣读”准确表现向聚集的百姓公开朗读书卷。
- source_word: בָרוּךְ
  choice: 巴录
  rationale: 采用现代中文圣经人名的通行音译。
- source_word: בַּסֵּפֶר
  choice: 书卷
  rationale: סֵפֶר 可指书、文书或卷轴；耶利米书36章的语境明确指写成的卷轴，“书卷”既准确又符合中文经文语体。
- source_word: בְּאָזְנֵי הָעָם
  choice: 在百姓听得到的地方
  rationale: 该希伯来习语直译为“在百姓耳中”，意思是当着百姓、使他们能够听见；此译保留“听见”的感官含义，同时为现代读者提供自然表达。
