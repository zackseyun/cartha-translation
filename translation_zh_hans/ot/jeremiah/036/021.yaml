base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/036/021.yaml
  text: Then the king sent Jehudi to get the scroll[a], and he took it from the chamber of Elishama the scribe[d][c][b]. And Jehudi read it in the hearing of the king and in the hearing of all the officials standing beside the king.
translation:
  language: zh_hans
  text: 于是，王派犹底去取书卷；犹底就从书记以利沙玛的房间里取来书卷，读给王和侍立在王身旁的众官员听。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: 派
  rationale: 叙事中表示王差遣某人执行任务；“派”比直译“打发”更符合现代汉语宫廷语境。
- source_word: יְהוּדִי
  choice: 犹底
  rationale: 人名按现代中文圣经常见音译处理。
- source_word: לָקַחַת אֶת־הַמְּגִלָּה
  choice: 去取书卷
  rationale: 不定式表差遣目的；“去取”自然表达取来之意，מְגִלָּה明确指卷轴式文书。
- source_word: וַיִּקָּחֶהָ
  choice: 就……取来
  rationale: 阴性单数后缀指前述书卷；“取来”衔接王的差遣，并传达从房间拿到现场的动作。
- source_word: מִלִּשְׁכַּת
  choice: 从……的房间里
  rationale: לִשְׁכָּה是建筑群内的房间或办公用房；“房间”清楚自然，避免“内室”可能产生的私人居室含义。
- source_word: אֱלִישָׁמָע הַסֹּפֵר
  choice: 书记以利沙玛
  rationale: סֹפֵר在王室行政语境可指书记或文书官；“书记”兼顾书写职能与官署身份。
- source_word: וַיִּקְרָאֶהָ
  choice: 宣读
  rationale: 动词以书卷为宾语且多人听取，表示出声诵读；“宣读”比仅说“读”更清楚地体现公开朗读。
- source_word: בְּאָזְנֵי
  choice: 在……面前
  rationale: 字面为“在……耳中”，实际表示让在场者听见；“面前宣读”在现代汉语中自然且保留公开听读场景。
- source_word: כָּל־הַשָּׂרִים
  choice: 众官员
  rationale: שָׂרִים在王宫语境指高级官员；译作“官员”避免“首领”或“王子”的误解。
- source_word: הָעֹמְדִים מֵעַל הַמֶּלֶךְ
  choice: 侍立在王身旁的
  rationale: 字面近于“站在王之上/旁”；结合宫廷语境，指在王近旁侍立的官员。“侍立”保留其站立与随侍色彩，不误解为地位高于王。
theological_decisions: []
