source:
  edition: WLC
  text: וַ/יִּשְׁלְח֨וּ כָל הַ/שָּׂרִ֜ים אֶל בָּר֗וּךְ אֶת יְהוּדִ֡י בֶּן נְ֠תַנְיָהוּ בֶּן שֶׁלֶמְיָ֣הוּ בֶן כּוּשִׁי֮ לֵ/אמֹר֒ הַ/מְּגִלָּ֗ה אֲשֶׁ֨ר קָרָ֤אתָ בָּ/הּ֙ בְּ/אָזְנֵ֣י הָ/עָ֔ם קָחֶ֥/נָּה בְ/יָדְ/ךָ֖ וָ/לֵ֑ךְ וַ֠/יִּקַּח בָּר֨וּךְ בֶּן נֵרִיָּ֤הוּ אֶת הַ/מְּגִלָּה֙ בְּ/יָד֔/וֹ וַ/יָּבֹ֖א אֲלֵי/הֶֽם־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/036/014.yaml
  text: Then all the officials sent Jehudi son of Nethaniah[a], son of Shelemiah, son of Cushi, to Baruch, saying, “Take in your hand the scroll from which you read in the hearing of the people, and come.” So Baruch son of Neriah took the scroll in his hand and came to them.
translation:
  language: zh_hans
  text: 于是，众官长派古示的曾孙、示利米雅的孙子、尼探雅的儿子犹底去见巴录，对他说：“你在百姓面前宣读的那书卷，要拿在手里，到我们这里来[a]。”尼利亚的儿子巴录就手拿书卷，来到他们那里。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“就去。”希伯来文用的是“去”，这里按说话者所在的位置译为“到我们这里来”。
    reason: 保留原文方向动词与自然汉语指示视角之间的差异。
lexical_decisions:
- source_word: כָל הַשָּׂרִים
  choice: 众官长
  rationale: שַׂר 在本段宫廷行政语境中指掌权的官员；“官长”既符合上下文，也保留其地位与权柄色彩。
- source_word: יְהוּדִי
  choice: 犹底
  rationale: 后接完整父系谱系，表明此处是人名，并非“犹大人”的称谓。
- source_word: אֶת יְהוּדִי ... אֶל בָּרוּךְ
  choice: 派……犹底去见巴录
  rationale: אֵת 标明犹底是被差派者，אֶל בָּרוּךְ 标明行动所指向的人；此表达符合现代汉语语序。
- source_word: בֶּן נְתַנְיָהוּ בֶּן שֶׁלֶמְיָהוּ בֶן כּוּשִׁי
  choice: 古示的曾孙、示利米雅的孙子、尼探雅的儿子
  rationale: 希伯来文逐代列出父系关系。汉语按由远及近的亲属关系表达，可清楚显示犹底的三代谱系，同时避免连续使用“……的儿子”造成歧义。
- source_word: הַמְּגִלָּה
  choice: 书卷
  rationale: מְגִלָּה 指卷起来的书写材料；“书卷”是现代读者能够理解且适合经文语体的对应词。
- source_word: קָרָאתָ בָּהּ
  choice: 你……宣读的
  rationale: 上下文是当众从书卷中出声诵读；“宣读”自然体现公开读出的含义。
- source_word: בְּאָזְנֵי הָעָם
  choice: 在百姓耳中
  rationale: 保留希伯来语“在……耳中”的具体意象，强调百姓亲耳听见，而不简化为仅仅“在百姓面前”。
- source_word: קָחֶנָּה בְיָדְךָ
  choice: 要拿在手里
  rationale: 阴性宾语后缀所指的书卷已在前文明确；译文保留“在手里”，并与后半节巴录的照办形成呼应。
- source_word: וָלֵךְ
  choice: 到我们这里来
  rationale: 动词字面为“去”，但直接引语中的目的地是说话者所在之处，现代汉语自然说“到我们这里来”；脚注保留字面方向。
- source_word: וַיִּקַּח ... אֶת הַמְּגִלָּה בְּיָדוֹ
  choice: 巴录就手拿书卷
  rationale: 保留“手拿”这一细节，显示巴录准确执行命令，也与前面的“拿在手里”相呼应。
- source_word: וַיָּבֹא אֲלֵיהֶם
  choice: 来到他们那里
  rationale: בוא 表示到达他们所在之处；“来到他们那里”既体现到达，也清楚交代目的地。
theological_decisions: []
