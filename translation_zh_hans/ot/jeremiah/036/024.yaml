  text: וְ/לֹ֣א פָחֲד֔וּ וְ/לֹ֥א קָרְע֖וּ אֶת בִּגְדֵי/הֶ֑ם הַ/מֶּ֨לֶךְ֙ וְ/כָל עֲבָדָ֔י/ו הַ/שֹּׁ֣מְעִ֔ים אֵ֥ת כָּל הַ/דְּבָרִ֖ים הָ/אֵֽלֶּה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/036/024.yaml
  text: Yet neither the king nor any of his servants who heard all these words were afraid[b][a], nor did they tear their garments.
translation:
  language: zh_hans
  text: 王和所有听见这一切话的臣仆却都不害怕，也没有撕裂自己的衣服。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 撕裂衣服是古代近东表达悲痛、惊骇或悔改的惯常举动。
    reason: cultural_note
lexical_decisions:
- source_word: וְלֹא פָחֲדוּ
  choice: 却都不害怕
  rationale: 两个否定句承接上文，并在语境中带有转折意味；“却”自然表达这种反差。“害怕”准确而不过度强化 פָחַד 的含义。
- source_word: וְלֹא קָרְעוּ אֶת־בִּגְדֵיהֶם
  choice: 也没有撕裂自己的衣服
  rationale: 保留“撕裂衣服”这一具体文化动作，而不将其解释性地改写为悲哀或悔改；“自己的”清楚表达希伯来语物主后缀。
- source_word: הַמֶּלֶךְ
  choice: 王
  rationale: 直接对应定冠词名词；在圣经历史叙事中，“王”比“国王”更凝练自然。
- source_word: וְכָל־עֲבָדָיו
  choice: 和所有……臣仆
  rationale: עֲבָדִים 在王宫语境中指服事王的人或官员；“臣仆”兼顾其从属身份与宫廷背景，避免不必要地限定为奴隶或仅仅是官员。
- source_word: הַשֹּׁמְעִים
  choice: 听见……的
  rationale: 将分词按其限定作用译出，指明王的臣仆是听见这些话的人；中文关系结构自然简洁。
- source_word: אֵת כָּל־הַדְּבָרִים הָאֵלֶּה
  choice: 这一切话
  rationale: דְּבָרִים 可指话或事情；本段讲书卷被宣读，因此译为“话”最贴合语境并保留文本重点。
theological_decisions:
- issue: 撕裂衣服这一动作的意义
  choice: 正文保留动作本身，脚注说明其文化含义
  alternative: 在正文中直接译成“表示悲痛/悔改”
  rationale: 原文只陈述他们没有撕裂衣服，并未明说此处究竟侧重悲痛、惊骇还是悔改；保留动作并用脚注介绍可能意义，可避免消除原文的开放性。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“臣仆”体现王宫语境；“撕裂自己的衣服”保留原文的具体文化意象。脚注标记置于相关整句之后。
