  yaml_path: translation/ot/jeremiah/036/018.yaml
  text: Then Baruch said to them[a], “He would recite all these words to me with his mouth, and I was writing them on the scroll with ink.”
translation:
  language: zh_hans
  text: 巴录对他们说：“他亲口把这一切话念给我听[a]，我用墨把这一切话写在卷轴上。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “念给我听”也可译作“读给我听”或“朗读给我听”。希伯来语动词常指“读、朗读”；结合本章语境，本句也可理解为耶利米口述，巴录记录。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר לָהֶם בָּרוּךְ
  choice: 巴录对他们说
  rationale: 顺应希伯来叙事次序，以自然的现代汉语表达；专名按通行形式译作“巴录”。
- source_word: מִפִּיו
  choice: 他亲口
  rationale: 保留“从他口中”的具体意象，同时以自然汉语表明这些话由他本人说出。
- source_word: יִקְרָא אֵלַי
  choice: 念给我听
  rationale: קרא可指朗读、念出或呼喊；本句语境是耶利米口述、巴录记录。“念给我听”既自然地体现口述情境，也不过度限定这些话是照文朗读还是背诵说出。
- source_word: אֵת כָּל הַדְּבָרִים הָאֵלֶּה
  choice: 这一切话
  rationale: דברים在此指被说出并写下的言语，译作“话”准确自然。
- source_word: וַאֲנִי כֹּתֵב
  choice: 我就……写
  rationale: 表达巴录随着口述而进行的书写；“就”清楚体现两项动作之间的对应关系。
- source_word: עַל הַסֵּפֶר
  choice: 在卷轴上
  rationale: 本章的סֵפֶר指古代书写卷轴，并非现代装订书册。
- source_word: בַּדְּיוֹ
  choice: 用墨
  rationale: ב在这里表示书写所用的材料或工具，译作“用墨”简洁准确。
