language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יִּקְרָ֨א בָר֥וּךְ בַּ/סֵּ֛פֶר אֶת דִּבְרֵ֥י יִרְמְיָ֖הוּ בֵּ֣ית יְהוָ֑ה בְּ/לִשְׁכַּ֡ת גְּמַרְיָהוּ֩ בֶן שָׁפָ֨ן הַ/סֹּפֵ֜ר בֶּ/חָצֵ֣ר הָ/עֶלְי֗וֹן פֶּ֣תַח שַׁ֤עַר בֵּית יְהוָה֙ הֶֽ/חָדָ֔שׁ בְּ/אָזְנֵ֖י כָּל הָ/עָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/036/010.yaml
  text: And Baruch read from the scroll the words of Jeremiah in the house of Yahweh[a], in the chamber of Gemariah son of Shaphan the scribe, in the upper court, at the entrance of the new gate of the house of Yahweh, in the hearing of all the people.
translation:
  language: zh_hans
  text: 巴录在耶和华的殿[a]里、在沙番的儿子基玛利雅书记的房间中，向全体百姓宣读书卷中耶利米的话；这房间位于上院，靠近耶和华殿新门的入口。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译作“耶和华的家”，这里指耶和华的圣殿。
    reason: 保留בֵּית יְהוָה的字面表达，同时说明其在本节中的地点含义。
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: 宣读
  rationale: 此处与“卷”连用，指从书面文本公开朗读；“宣读”兼顾朗读行为和公开场合。
- source_word: בַּסֵּפֶר
  choice: 卷上所记
  rationale: סֵפֶר在当时语境中指书卷；介词ב与קרא连用表示依据卷中文字而读。中文用“卷上所记”自然说明所宣读内容的载体。
- source_word: דִּבְרֵי יִרְמְיָהוּ
  choice: 耶利米的话
  rationale: 直接保留希伯来语属格关系和先知话语的表达。
- source_word: בֵּית יְהוָה
  choice: 耶和华的殿
  rationale: בֵּית字面为“房屋、家”，在此明确指圣殿建筑群；正文译作“殿”符合现代中文习惯，脚注保留“耶和华的家”这一较直译表达。神名יְהוָה音译为“耶和华”。
- source_word: בְּלִשְׁכַּת
  choice: 在……的房间中
  rationale: לִשְׁכָּה指圣殿范围内供官员使用的房间；“房间”比“内室”更清楚且不过度限定用途。
- source_word: גְּמַרְיָהוּ בֶן שָׁפָן
  choice: 沙番的儿子……基玛利雅
  rationale: 按现代中文亲属结构排列，保留父子身份，并采用常见圣经人名音译。
- source_word: הַסֹּפֵר
  choice: 书记
  rationale: סֹפֵר可指抄写员或行政书记；本处作为沙番的职衔，“书记”保留其行政职务的宽泛含义。
- source_word: בֶּחָצֵר הָעֶלְיוֹן
  choice: 上院
  rationale: חָצֵר指圣殿的院落，הָעֶלְיוֹן加以区分为“上院”；此译简洁并符合建筑语境。
- source_word: פֶּתַח
  choice: 入口处
  rationale: 表示开口或入口；与后面的“门”搭配时，“门入口处”能自然表达所在位置。
- source_word: שַׁעַר בֵּית יְהוָה הֶחָדָשׁ
  choice: 耶和华殿的新门
  rationale: 保留“新”的普通形容意义，不推断建造时间或门的专名性质。
- source_word: בְּאָזְנֵי כָּל הָעָם
  choice: 向全体百姓宣读
  rationale: 希伯来语字面为“在全体百姓耳中”，意指让他们都听见。中文结合动词译为“向……宣读”，自然传达公开可闻的含义。
- source_word: כָּל הָעָם
  choice: 全体百姓
  rationale: 指当场聚集的民众整体；“全体百姓”自然且保持范围用语。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。正文采用现代中文圣经读者最熟悉的专名“耶和华”，不以“主”替代，从而保留其专名性质；“雅威”是另一种较接近学术重构发音的音译。
- issue: בֵּית יְהוָה的表达
  choice: 耶和华的殿
  alternative: 耶和华的家
  rationale: 此处实际指圣殿范围。“殿”清楚呈现地点，不将“家”的比喻或神学含义强加给语境；脚注明示原文较直译的可能表达。
translation_notes:
  register: 采用庄重而易懂的现代标准普通话。调整地点短语次序以免中文句子层层滞重，同时保留房间、上院和新门入口三项空间信息。用“宣读”明确这是公开朗读书卷，而不是一般的阅读。
