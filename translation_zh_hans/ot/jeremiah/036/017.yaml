revisions:
- from: 他们问巴录说：“请告诉我们，你是怎样把这一切话从他口中[a]写下来的？”
  to: 他们问巴录说：“请告诉我们，你是怎样把他口中所说的这一切话写下来的？”
  rationale: 将“从他口中”调整为修饰“话”的“他口中所说的”，以清楚表达巴录记录耶利米口述的话。此调整不增添教义性解释，也不改变原文所问的书写方式；脚注继续保留并解释原文的字面措辞。
