  yaml_path: translation/ot/jeremiah/036/017.yaml
  text: And they asked Baruch[a], saying, “Please tell us, how did you write all these words from his mouth?”
translation:
  language: zh_hans
  text: 他们问巴录说：“请告诉我们，你是怎样把他口中所说的这一切话写下来的？”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׁאֲלוּ
  choice: 问
  rationale: 该动词表示询问；“问”符合直接问话的语境，也是现代汉语最自然的表达。
- source_word: לֵאמֹר
  choice: 说
  rationale: 保留希伯来语引出直接引语的常见结构；“问……说”在庄重的叙事文体中清楚自然。
- source_word: הַגֶּד נָא
  choice: 请告诉我们
  rationale: 命令式 הַגֶּד 表示“告诉”，语气词 נָא 带有请求或礼貌语气，以“请”自然传达。
- source_word: אֵיךְ
  choice: 怎样
  rationale: 该疑问词询问方式；“怎样”准确、自然。
- source_word: כָּתַבְתָּ
  choice: 写下来的
  rationale: 这里指已经完成并正在受询问的书写行为；“写下来”也贴合将口述内容记录成文的语境。
- source_word: כָּל הַדְּבָרִים הָאֵלֶּה
  choice: 这一切话
  rationale: דְּבָרִים 可指“话、事情”；在先口述后书写的语境中，“话”更准确，同时“一切”保留 כָּל 的整体范围。
- source_word: מִפִּיו
  choice: 从他口中
  rationale: 直译该短语，保留希伯来语鲜明的身体意象及代词所具有的原文形式；脚注说明其在语境中指听人口述。
- source_word: וְאֶת בָּרוּךְ
  choice: 他们问巴录
  rationale: אֶת 标示前置宾语“巴录”；汉语按自然语序置于动词之后。句首连接词在本节独立呈现时不必机械译出，其叙事承接由语境自然体现。
