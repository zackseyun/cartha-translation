source:
  edition: WLC
  text: וַ/יְהִ֣י בַ/שָּׁנָ֣ה הַ֠/חֲמִשִׁית לִ/יהוֹיָקִ֨ים בֶּן יֹאשִׁיָּ֤הוּ מֶֽלֶךְ יְהוּדָה֙ בַּ/חֹ֣דֶשׁ הַ/תְּשִׁעִ֔י קָרְא֨וּ צ֜וֹם לִ/פְנֵ֧י יְהוָ֛ה כָּל הָ/עָ֖ם בִּ/ירֽוּשָׁלִָ֑ם וְ/כָל הָ/עָ֗ם הַ/בָּאִ֛ים מֵ/עָרֵ֥י יְהוּדָ֖ה בִּ/ירוּשָׁלִָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/036/009.yaml
  text: And it happened in the fifth year of Jehoiakim son of Josiah[a], king of Judah, in the ninth month, that they proclaimed a fast before Yahweh for all the people in Jerusalem and all the people coming from the cities of Judah into Jerusalem.
translation:
  language: zh_hans
  text: 约西亚的儿子、犹大王约雅敬第五年九月，有人宣告，在耶路撒冷的所有民众，以及从犹大各城来到耶路撒冷的所有民众，都要在雅威[a]面前禁食。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “雅威”是希伯来文神名 יהוה 的拟音；中文传统常译作“耶和华”，也有译本以“上主”代称。
    reason: 说明神名的原文形式及主要中文译法。
lexical_decisions:
- source_word: וַיְהִי
  choice: （不另译，以时间状语引出事件）
  rationale: 这是希伯来叙事中引出新事件的常用形式。现代汉语直接以日期开篇更自然，也完整保留了其叙事功能。
- source_word: בַשָּׁנָה הַחֲמִשִׁית לִיהוֹיָקִים בֶּן־יֹאשִׁיָּהוּ מֶלֶךְ יְהוּדָה
  choice: 约西亚的儿子犹大王约雅敬第五年
  rationale: 按王在位年数表达日期；将“约西亚的儿子”和“犹大王”都保留为约雅敬的说明语。
- source_word: בַחֹדֶשׁ הַתְּשִׁעִי
  choice: 九月
  rationale: 原文指该年历的第九个月；汉语日期公式中译作“九月”简洁自然，但并非现代公历九月。
- source_word: קָרְאוּ צוֹם
  choice: 有人宣告……禁食
  rationale: קרא与צום连用，表示公开宣布一次禁食。原文动词为无明示主语的第三人称复数，因此用“有人”保留发布者未说明这一点。
- source_word: לִפְנֵי יְהוָה
  choice: 在雅威面前
  rationale: לִפְנֵי表示在某位面前或临在中；“在……面前”既贴近原文，也保留禁食朝向上帝的宗教含义。
- source_word: כָּל־הָעָם בִּירוּשָׁלָם
  choice: 耶路撒冷的全体民众
  rationale: 指当时在耶路撒冷的民众，不限于该城原住民；结合下文，以自然汉语表达其所在地。
- source_word: וְכָל־הָעָם הַבָּאִים מֵעָרֵי יְהוּדָה בִּירוּשָׁלָם
  choice: 以及从犹大各城来到耶路撒冷的全体民众
  rationale: 分词הַבָּאִים表示来到或正在来的人；译文保留其来源地与目的地，并避免把这些民众误作发布禁食命令的主体。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名יהוה。“雅威”较接近学界通行的拟定读音，并明确保留专名性质；脚注列出中文传统常见译名，不把称号“上主”无提示地代替原文专名。
- issue: 禁食宣告的对象与发布者
  choice: 以未指明的“有人”为发布者，以两组民众为禁食对象
  alternative: 把全体民众理解为宣告禁食的主语
  rationale: קָרְאוּ虽为复数，但未明说主语；后续两处כָּל־הָעָם最自然地与介词ל所标示的对象范围相连。译文不擅自认定是民众自己发布命令。
translation_notes:
  register: 采用庄重而流畅的现代标准汉语。以直接日期开篇，避免“事情发生在”一类生硬套语；通过“有人宣告……都要……”清楚呈现原文未说明发布者、却明确涵盖两组民众的结构。
