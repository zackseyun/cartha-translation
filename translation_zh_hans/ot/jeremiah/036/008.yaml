base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/036/008.yaml
  text: And Baruch son of Neriah did according to all that Jeremiah the prophet had commanded him, to read from the scroll the words of the LORD in the house of the LORD.
translation:
  language: zh_hans
  text: 尼利亚的儿子巴录照先知耶利米所吩咐他的一切去做，在耶和华的殿里，从书卷中宣读耶和华的话。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ ... כְּכֹל אֲשֶׁר צִוָּהוּ
  choice: 照……所吩咐他的一切去做
  rationale: 贴合“按着所吩咐的一切而行”的希伯来语结构，同时符合现代汉语表达。
- source_word: לִקְרֹא
  choice: 宣读
  rationale: 此处是在圣殿中把书卷内容公开读出；“宣读”比单纯“读”更能传达公开朗读的语境。
- source_word: בַסֵּפֶר
  choice: 从书卷上
  rationale: סֵפֶר 在此指前文写成的卷轴式文书；译作“书卷”符合历史语境。介词 ב 在此自然理解为借着或从该书卷宣读。
- source_word: דִּבְרֵי יְהוָה
  choice: 耶和华的话
  rationale: 保留复数集合名词所表达的神谕内容，采用现代中文圣经语体中清楚而庄重的说法。
- source_word: בֵּית יְהוָה
  choice: 耶和华的殿
  rationale: 字面为“耶和华的家”，在此明确指圣殿；译作“殿”自然准确，并保留与神名的所属关系。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 耶和华
  alternative: 上主／雅威
  rationale: 采用普通简体中文读者熟悉且可明确识别为以色列之神专名的传统译法；不以一般称号替代专名，也不借此加入宗派性解释。
- issue: 不定式 לִקְרֹא 与前句的关系
  choice: 作为巴录遵命所执行的内容，译为“在……宣读”
  alternative: 译为目的式“为要宣读”
  rationale: 原文不定式可表达命令内容或目的；上下文说明巴录实际照办。中文以顺承方式表达，但不额外说明宣读发生的具体日期或听众。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“尼利亚的儿子巴录”保留希伯来叙事中的父名身份表达；句序稍作汉语化处理，使宣读地点、媒介和内容清楚自然。
