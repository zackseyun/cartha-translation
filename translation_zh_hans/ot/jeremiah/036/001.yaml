  text: וַֽ/יְהִי֙ בַּ/שָּׁנָ֣ה הָ/רְבִיעִ֔ת לִ/יהוֹיָקִ֥ים בֶּן יֹאשִׁיָּ֖הוּ מֶ֣לֶךְ יְהוּדָ֑ה הָיָ֞ה הַ/דָּבָ֤ר הַ/זֶּה֙ אֶֽל יִרְמְיָ֔הוּ מֵ/אֵ֥ת יְהוָ֖ה לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/036/001.yaml
  text: In the fourth year of Jehoiakim son of Josiah[a], king of Judah, this word came to Jeremiah from Yahweh, saying,
translation:
  language: zh_hans
  text: 犹大王约雅敬，就是约西亚的儿子，在位第四年，雅威的话临到耶利米，说：
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: （不单独译出）
  rationale: 这里的连续式用于引入新的叙事背景；现代汉语可直接以时间状语起句，无须添加“事情是这样”或“那时”等原文没有明确表达的词。
- source_word: בַּשָּׁנָה הָרְבִיעִת לִיהוֹיָקִים
  choice: 约雅敬在位第四年
  rationale: 原文直译为“约雅敬的第四年”，语境指其作王的第四年；补出“在位”符合现代汉语表达，并未改变所指。
- source_word: לִיהוֹיָקִים בֶּן יֹאשִׁיָּהוּ מֶלֶךְ יְהוּדָה
  choice: 犹大王约西亚的儿子约雅敬
  rationale: 保留约雅敬与约西亚的父子关系及“犹大王”这一头衔；依汉语习惯调整语序，使修饰关系清楚。
- source_word: הָיָה הַדָּבָר הַזֶּה אֶל יִרְמְיָהוּ
  choice: 有这话临到耶利米
  rationale: “临到”自然保留先知书中神谕来到先知的公式表达；将 הַדָּבָר 译为“话”，兼顾其字面意义与启示语境。
- source_word: מֵאֵת יְהוָה
  choice: 雅威
  rationale: מֵאֵת 表明来源；汉语句式“雅威有这话临到……”已自然表达这话来自雅威。神名 יְהוָה 音译为“雅威”。
- source_word: לֵאמֹר
  choice: 说：
  rationale: 保留引出下文直接话语的功能，并以冒号衔接下一节。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；音译“雅威”使读者看见这是专名，同时避免以称号替代原文神名。
- issue: דָּבָר 在先知启示公式中的含义
  choice: 话
  alternative: 信息；事情
  rationale: “话”保留该词的基本意义和神谕的神学色彩；脚注说明其语义范围，不把原文的多义性完全消除。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。以“在位第四年”明确纪年含义，以“临到”保留先知书公式的传统语感；不额外加入原文没有明确表达的篇章连接词。
