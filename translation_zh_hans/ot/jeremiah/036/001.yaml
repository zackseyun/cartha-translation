revisions:
- from: 犹大王约西亚的儿子约雅敬在位第四年，雅威有这话[a]临到耶利米，说：
  to: 犹大王约雅敬，就是约西亚的儿子，在位第四年，雅威的话临到耶利米，说：
  rationale: 修订将“犹大王”明确归于约雅敬，恢复原文的句法关系；同时以“雅威的话临到耶利米”自然、明确地表达神谕来自雅威。其余时间、父子关系及下文引语的衔接均予保留。
