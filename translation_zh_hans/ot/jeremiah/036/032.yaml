  text: וְ/יִרְמְיָ֜הוּ לָקַ֣ח מְגִלָּ֣ה אַחֶ֗רֶת וַֽ/יִּתְּנָ/הּ֮ אֶל בָּר֣וּךְ בֶּן נֵרִיָּהוּ֮ הַ/סֹּפֵר֒ וַ/יִּכְתֹּ֤ב עָלֶ֨י/הָ֙ מִ/פִּ֣י יִרְמְיָ֔הוּ אֵ֚ת כָּל דִּבְרֵ֣י הַ/סֵּ֔פֶר אֲשֶׁ֥ר שָׂרַ֛ף יְהוֹיָקִ֥ים מֶֽלֶךְ יְהוּדָ֖ה בָּ/אֵ֑שׁ וְ/ע֨וֹד נוֹסַ֧ף עֲלֵי/הֶ֛ם דְּבָרִ֥ים רַבִּ֖ים כָּ/הֵֽמָּה׀־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/036/032.yaml
  text: Then Jeremiah took another scroll and gave it to Baruch son of Neriah[a], the scribe, and he wrote on it from the mouth of Jeremiah all the words of the scroll that Jehoiakim king of Judah had burned in the fire; and many similar words were added to them besides.
translation:
  language: zh_hans
  text: 耶利米另取一卷书卷，交给书记巴录，就是尼利亚的儿子。巴录把耶利米所口述[a]的一切话，就是犹大王约雅敬用火烧掉的那卷书上的话，都写在这卷书卷上；此外，还增添了许多类似的话。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“从耶利米口中。”
    reason: 说明 מִפִּי יִרְמְיָהוּ 的字面表达；按上下文，此语指巴录按耶利米口头说出的内容书写。
lexical_decisions:
- source_word: מְגִלָּה אַחֶרֶת
  choice: 又拿了一卷书卷
  rationale: מְגִלָּה指卷轴式书卷；“一卷书卷”具体而符合历史语境，אַחֶרֶת表示另一个，结合叙事用“又拿了”自然呈现。
- source_word: וַיִּתְּנָהּ אֶל בָּרוּךְ
  choice: 交给……巴录
  rationale: 忠实表达נתן与אֶל的给予关系；“交给”比“递给”更中性。
- source_word: הַסֹּפֵר
  choice: 书记
  rationale: סֹפֵר可指专业抄写者或文书官员；“书记”兼顾其书写职能和当时的职分，又避免现代“秘书”的行政色彩。
- source_word: וַיִּכְתֹּב עָלֶיהָ
  choice: 巴录就……全都写在这书卷上
  rationale: 最近的先行人物巴录是书写者；补出姓名可消除中文代词歧义，עַל按书写表面译为“写在……上”。
- source_word: מִפִּי יִרְמְיָהוּ
  choice: 照耶利米口述的
  rationale: 原文直译为“从耶利米口中”，语境指听其口述而书写；正文采用自然现代汉语，同时脚注保留字面形象。
- source_word: אֵת כָּל דִּבְרֵי הַסֵּפֶר
  choice: 那卷书上的一切话
  rationale: סֵפֶר可指书或文书，此处明确指先前被焚毁的实体书卷；“一切话”保留דְּבָרִים的宽泛含义。
- source_word: אֲשֶׁר שָׂרַף יְהוֹיָקִים ... בָּאֵשׁ
  choice: 犹大王约雅敬用火烧掉的
  rationale: 准确保留施事者、王号及焚烧动作；“用火烧掉”自然表达בָּאֵשׁ，并表明书卷已被毁。
- source_word: וְעוֹד נוֹסַף עֲלֵיהֶם
  choice: 此外，又增添了
  rationale: יסף的Nifal形式为被动意义，但中文无主句“又增添了”自然保留未说明增添者的表达；“此外”体现וְעוֹד。
- source_word: דְּבָרִים רַבִּים כָּהֵמָּה
  choice: 许多类似的话
  rationale: כָהֵמָּה意为“像那些的”；“类似的话”在现代汉语中自然，并保留新增内容与原有话语同类而非完全相同的含义。
theological_decisions: []
translation_notes:
  register: 采用庄重、清晰的现代标准普通话。“书记”保留古代文书职分；分为两句以避免希伯来语长串并列结构在中文中显得拖沓。正文脚注标记[a]紧随“口述的”，对应其解释对象。
