base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/036/015.yaml
  text: And they said to him[a], “Please sit down and read it in our hearing.” So Baruch read it in their hearing.
translation:
  language: zh_hans
  text: 他们对他说：“请坐下，念给我们听。”于是巴录就念给他们听。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמְרוּ אֵלָיו
  choice: 他们对他说
  rationale: 叙事性连续式推进事件；中文无需机械译出连接词，以自然语序表达叙事承接。
- source_word: שֵׁב נָא
  choice: 请坐下
  rationale: שֵׁב在此是“坐下”的命令式，נָא表达礼貌请求，译作“请”。
- source_word: וּקְרָאֶנָּה
  choice: 念
  rationale: קרא在书卷语境中指朗读；阴性宾语后缀指前文的书卷。中文“念”已自然包含朗读书卷内容之意，无须另加宾语。
- source_word: בְּאָזְנֵינוּ
  choice: 给我们听
  rationale: 原文直译为“在我们耳中”，是表示让人亲耳听见的希伯来习语；现代汉语用“念给我们听”自然准确。
- source_word: וַיִּקְרָא בָרוּךְ
  choice: 于是巴录就念
  rationale: 连续式在此叙述巴录依请求而行；“于是……就……”清楚表达动作承接，而不过度强调因果。
- source_word: בְּאָזְנֵיהֶם
  choice: 给他们听
  rationale: 与前面的同一习语一致，按自然现代汉语译为“给他们听”。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“念给……听”比“在……听来”或“在……耳中诵读”更符合普通读者的表达习惯，同时准确传达公开朗读、使在场者听见的含义。原文两次“在耳中”的习语在正文中自然化处理，不另设脚注，因为不存在影响理解的实质性词义差异。
