  - severity: medium
    issue: “为躲避迦勒底人”把原因性短语译成目的性短语。
    rationale: מִפְּנֵי在这里是解释上节行动的原因（因／由于迦勒底人），而不是明确陈述行动目的。虽然惧怕蕴含躲避，但不宜将该推论写入正文。
  - severity: medium
    issue: “他们惧怕他们”在中文中指代含混。
    rationale: 希伯来文中第二个复数代词的先行词是“迦勒底人”；中文重复“他们”无法清楚区分惧怕者与被惧怕者。明确为“迦勒底人”不会增加原文信息。
  - severity: low
    issue: 脚注c的“立在这地之上”不够自然。
    rationale: 该说法是对英语结构的生硬摹写；可用“设立为管理这地的人”说明“任命／置于负责地位”的词义范围。
  revised_text: 他们因惧怕迦勒底人[a]，因为尼探雅的儿子以实玛利击杀了[b]亚希甘的儿子基大利；基大利是巴比伦王任命管理这地的[c]。
