revisions:
- from: 为躲避迦勒底人[a]，因为他们惧怕他们；这是因为尼探雅的儿子以实玛利击杀了[b]亚希甘的儿子基大利，而基大利是巴比伦王委派管理这地的[c]。
  to: 他们因惧怕迦勒底人[a]，因为尼探雅的儿子以实玛利击杀了[b]亚希甘的儿子基大利；基大利是巴比伦王任命管理这地的[c]。
  rationale: 修订以“因惧怕迦勒底人”保留本节承接上文时的因果功能，同时避免将原因明确改写成“躲避”的目的。中文以明确名词消除双重代词歧义。后句改用分号，使“基大利”后的关系从句在现代汉语中清晰地回指基大利，而不改变其为巴比伦王所任命的原文信息。
  reviewer_model: gpt-5.6-terra
