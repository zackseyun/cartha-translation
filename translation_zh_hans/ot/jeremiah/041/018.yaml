base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/041/018.yaml
  text: because of the Chaldeans[a], for they were afraid of them, because Ishmael son of Nethaniah had struck down Gedaliah son of Ahikam[c][b], whom the king of Babylon had appointed over the land.
translation:
  language: zh_hans
  text: 他们因惧怕迦勒底人[a]，因为尼探雅的儿子以实玛利击杀了[b]亚希甘的儿子基大利；基大利是巴比伦王任命管理这地的[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “迦勒底人”也可译作“巴比伦人”。
    reason: lexical_alternative
  - marker: b
    text: “击杀了”也可译作“杀死了”；希伯来文动词字面为“击打”，这里指致命的击打。
    reason: lexical_alternative
  - marker: c
    text: “任命管理这地”也可译作“设立为管理这地的人”或“派来负责这地”。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִפְּנֵי הַכַּשְׂדִּים
  choice: 为躲避迦勒底人
  rationale: מִפְּנֵי在这里承接上一节所述的行动，表达因惧怕而避开对方；译作“为躲避”既显明与上文的句法联系，也比直译“从……面前”更符合现代汉语。保留“迦勒底人”这一族称。
- source_word: כִּי יָרְאוּ מִפְּנֵיהֶם
  choice: 因为他们惧怕他们
  rationale: כִּי引出原因，יָרְאוּ表示惧怕。保留原文两组复数代词及其指代关系，不擅自改写为更具体的名词。
- source_word: הִכָּה
  choice: 击杀了
  rationale: נכה基本义为“击打”，在本段明确是致死行为。“击杀”兼顾动作意象和致命结果，避免只译成结果性的“杀死”。
- source_word: יִשְׁמָעֵאל בֶּן נְתַנְיָה
  choice: 尼探雅的儿子以实玛利
  rationale: 按现代中文圣经人名惯例音译，并以自然汉语表达父子关系。
- source_word: גְּדַלְיָהוּ בֶּן אֲחִיקָם
  choice: 亚希甘的儿子基大利
  rationale: 按现代中文圣经人名惯例音译，并清楚表达谱系关系。
- source_word: אֲשֶׁר הִפְקִיד מֶלֶךְ בָּבֶל בָּאָרֶץ
  choice: 而基大利是巴比伦王委派管理这地的
  rationale: הִפְקִיד在使役词干中表示委任、置于职责之上；结合בָּאָרֶץ，译为“委派管理这地”自然呈现行政任命的含义，同时保留“地”的宽泛地域概念。
