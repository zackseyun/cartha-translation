  text: וַ/יְהִ֛י בַּ/יּ֥וֹם הַ/שֵּׁנִ֖י לְ/הָמִ֣ית אֶת גְּדַלְיָ֑הוּ וְ/אִ֖ישׁ לֹ֥א יָדָֽע־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/041/004.yaml
  text: And it happened on the second day after he had killed Gedaliah[a], when no man yet knew it,
translation:
  language: zh_hans
  text: 到了杀害基大利后的第二天，那时还没有人知道这事[a]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“没有人知道”；“这事”是译文按上下文补出的宾语，指基大利被杀一事。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: 到了
  rationale: 这里的叙事公式与后面的时间短语共同引出下一件事；译作“到了”既承接上下文，也保留本节通向下一节的未完句式，避免生硬的“事情发生了”。
- source_word: בַּיּוֹם הַשֵּׁנִי
  choice: 第二天
  rationale: 按希伯来文保留明确编号的“第二天”，不弱化为较笼统的“后来”或“次日”。
- source_word: לְהָמִית אֶת גְּדַלְיָהוּ
  choice: 杀害基大利后
  rationale: לְ 加使役式不定词在此标明相对于杀害事件的时间。中文不明说主语，既符合语境，又不在本节中额外补入“以实玛利”。“杀害”准确表达致死的行为。
- source_word: גְּדַלְיָהוּ
  choice: 基大利
  rationale: 采用现代中文圣经人名的通行音译。
- source_word: וְאִישׁ לֹא יָדָע
  choice: 那时还没有人知道这事
  rationale: אִישׁ 在否定句中泛指任何人，宜译“没有人”。“还”自然表达当时消息尚未传开的状态；“这事”是中文为清楚起见补出的宾语，所指为基大利被杀。
theological_decisions: []
translation_notes:
  register: 采用自然、庄重的现代标准汉语。本节在希伯来文中引出下一节，故保留句末逗号和未完的叙事结构。“那时”使并列分句在中文中衔接自然，同时不改变其时间背景作用。
