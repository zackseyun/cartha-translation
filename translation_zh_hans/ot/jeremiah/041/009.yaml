  text: וְ/הַ/בּ֗וֹר אֲשֶׁר֩ הִשְׁלִ֨יךְ שָׁ֤ם יִשְׁמָעֵאל֙ אֵ֣ת כָּל פִּגְרֵ֣י הָ/אֲנָשִׁ֗ים אֲשֶׁ֤ר הִכָּה֙ בְּ/יַד גְּדַלְיָ֔הוּ ה֗וּא אֲשֶׁ֤ר עָשָׂה֙ הַ/מֶּ֣לֶךְ אָסָ֔א מִ/פְּנֵ֖י בַּעְשָׁ֣א מֶֽלֶךְ יִשְׂרָאֵ֑ל אֹת֗/וֹ מִלֵּ֛א יִשְׁמָעֵ֥אל בֶּן נְתַנְיָ֖הוּ חֲלָלִֽים׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/041/009.yaml
  text: The cistern into which Ishmael had thrown all the corpses of the men whom he had struck down because of Gedaliah was the one that King Asa had made because of Baasha king of Israel[b][a]. Ishmael son of Nethaniah filled it with the slain.
translation:
  language: zh_hans
  text: 那口蓄水池，就是以实玛利把他在基大利身边杀害的众人的尸体扔进去的那口[a]；它也是亚撒王因以色列王巴沙而修造的那口[b]。尼探雅的儿子以实玛利把被杀者的尸体填满了那口蓄水池。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在基大利身边杀害”所译的希伯来语短语较难确定，也可理解为“因基大利而杀害”或“与基大利一同杀害”。
    reason: alternative_reading
  - marker: b
    text: “因以色列王巴沙而修造”也可译作“因惧怕以色列王巴沙而修造”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבּוֹר
  choice: 那口井
  rationale: בּוֹר可指坑或蓄水井；此处是亚撒王修造的设施，译作“井”自然，也保留它后来被用来弃尸的空间含义。
- source_word: הִשְׁלִיךְ שָׁם
  choice: 扔进去
  rationale: 直译动作“扔、抛”；汉语用“扔进去”自然表达目的地。
- source_word: פִּגְרֵי
  choice: 尸体
  rationale: 准确传达死尸之意，并保留原文阴森、强烈的语气。
- source_word: הָאֲנָשִׁים
  choice: 所有人
  rationale: 上下文所指为被杀的人；现代汉语用“人”不必显式标出男性，且不改变所指群体。
- source_word: הִכָּה
  choice: 杀
  rationale: נכה在此为致死性击打；“杀”比“击打”更清楚地符合尸体和被杀者的上下文。
- source_word: בְּיַד גְּדַלְיָהוּ
  choice: 因基大利而
  rationale: 该短语字面为“在/借基大利的手”，句法和语义困难；正文采用宽泛的关联或缘由表达，同时以脚注保留其他可能。
- source_word: הוּא אֲשֶׁר עָשָׂה
  choice: 也是……修造的
  rationale: 重述结构把前述井认定为亚撒所造的那一口；汉语用“也是”衔接清楚。
- source_word: מִפְּנֵי בַּעְשָׁא
  choice: 因……巴沙而
  rationale: מִפְּנֵי可表示“因为、由于”或“因惧怕”；正文选择较宽泛、不预断具体动机的表达。
- source_word: מִלֵּא
  choice: 填满了
  rationale: 准确反映Piel形态的使之充满义。
- source_word: חֲלָלִים
  choice: 被杀的人
  rationale: 表达遭杀戮者，既保留暴力含义，又与前面的“尸体”有所区分。
theological_decisions:
- issue: בְּיַד גְּדַלְיָהוּ所表达的基大利与死者之关系
  choice: 因基大利而杀
  alternative: 在基大利身边杀／与基大利一同杀
  rationale: 原文短语含混，不能理解为基大利是施杀者。正文采用较宽泛的因由或关联义，脚注明确其他合乎上下文的读法，不把叙事关系过度定死。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。正文保留两处希伯来语介词短语的开放性，并用脚注列出重要异读；所有脚注标记均紧随相关语句。
