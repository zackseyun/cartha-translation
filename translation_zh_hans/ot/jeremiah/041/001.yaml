  text: וַ/יְהִ֣י בַּ/חֹ֣דֶשׁ הַ/שְּׁבִיעִ֗י בָּ֣א יִשְׁמָעֵ֣אל בֶּן נְתַנְיָ֣ה בֶן אֱלִישָׁמָ֣ע מִ/זֶּ֣רַע הַ֠/מְּלוּכָה וְ/רַבֵּ֨י הַ/מֶּ֜לֶךְ וַ/עֲשָׂרָ֨ה אֲנָשִׁ֥ים אִתּ֛/וֹ אֶל גְּדַלְיָ֥הוּ בֶן אֲחִיקָ֖ם הַ/מִּצְפָּ֑תָ/ה וַ/יֹּ֨אכְלוּ שָׁ֥ם לֶ֛חֶם יַחְדָּ֖ו בַּ/מִּצְפָּֽה׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/041/001.yaml
  text: In the seventh month[a], Ishmael son of Nethaniah, son of Elishama, of the royal line and one of the chief officers of the king, came with ten men to Gedaliah son of Ahikam at Mizpah[c][b], and they ate bread there together in Mizpah.
translation:
  language: zh_hans
  text: 第七个月[a]，以利沙玛的孙子、尼探雅的儿子以实玛利——他是王室后裔，也是王的一位重臣[b]——带着十个人来到米斯巴的亚希甘之子基大利那里。他们一同在米斯巴吃饭[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里没有说明是哪一年；按上下文，是基大利被立为犹大地省长之后的第七个月。
    reason: chronological_ambiguity
  - marker: b
    text: “王的一位重臣”也可译作“王的一位显贵”。希伯来语原句表明以实玛利属于王室后裔和王的显贵之列。
    reason: lexical_alternative
  - marker: c
    text: 希伯来语直译为“吃饼”，是指一起用餐。
    reason: idiom
lexical_decisions:
- source_word: וַיְהִי בַּחֹדֶשׁ הַשְּׁבִיעִי
  choice: 第七个月
  rationale: וַיְהִי在此为叙事场景转换公式，无须另加没有明确词汇对应的“那时”或“事情是这样”。时间短语按原文直译。
- source_word: יִשְׁמָעֵאל בֶּן נְתַנְיָה בֶן אֱלִישָׁמָע
  choice: 以利沙玛的孙子、尼探雅的儿子以实玛利
  rationale: 按现代汉语亲属关系重组连续的“某某之子”，清楚保留三代谱系。
- source_word: מִזֶּרַע הַמְּלוּכָה
  choice: 王室后裔
  rationale: זֶרַע在此指血统或后代，而非字面的“种子”；“王室后裔”自然表达其王族血统。
- source_word: וְרַבֵּי הַמֶּלֶךְ
  choice: 也是王的一位重臣
  rationale: 该短语形式上含复数，但在句中与单数的以实玛利相连，宜理解为他属于王的显贵或高级官员之列；“一位重臣”保留身份而避免生硬复数。
- source_word: וַעֲשָׂרָה אֲנָשִׁים אִתּוֹ
  choice: 带着十个人
  rationale: 自然表达随行关系，并完整保留人数。
- source_word: אֶל גְּדַלְיָהוּ בֶן אֲחִיקָם הַמִּצְפָּתָה
  choice: 来到米斯巴的亚希甘之子基大利那里
  rationale: 米斯巴的方向词尾表明行动目的地；此译法既交代基大利所在之处，也自然表达“来到……那里”。
- source_word: וַיֹּאכְלוּ שָׁם לֶחֶם יַחְדָּו
  choice: 他们一同……吃饭
  rationale: “吃饼/吃食物”在此为共同用餐的惯用表达；汉语用“吃饭”自然传达实际意义，“一同”保留יַחְדָּו。
- source_word: בַּמִּצְפָּה
  choice: 在米斯巴
  rationale: 保留原文末尾重复的地名，以维持叙事地点的强调。
