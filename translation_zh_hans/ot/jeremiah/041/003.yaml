base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/041/003.yaml
  text: And Ishmael struck down all the Judeans who were with Gedaliah at Mizpah[c][b][a], and the Chaldeans who were found there—the men of war.
translation:
  language: zh_hans
  text: 以实玛利击杀了所有在米斯巴和基大利在一起的犹大人[a]，以及在那里被发现的迦勒底人[b]——即那些战士[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“犹太人”。这里的希伯来词可指犹大地或犹大国的人；“犹大人”突出了本段的历史地理背景。
    reason: lexical_alternative
  - marker: b
    text: 或译“巴比伦人”。原文作“迦勒底人”。
    reason: lexical_alternative
  - marker: c
    text: 原文直译“打仗的人”，即作战人员或士兵；这个短语在句中紧接“迦勒底人”，作为同位说明。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַיְּהוּדִים
  choice: 犹大人
  rationale: 这里指历史与地域意义上的犹大居民或犹大群体；“犹大人”比现代常用的“犹太人”更能凸显当时的政治地理背景，同时在脚注保留另一译法。
- source_word: אִתּוֹ אֶת־גְּדַלְיָהוּ
  choice: 与基大利同在
  rationale: אִתּוֹ 的代词所指由随后出现的“基大利”说明；汉语直接译作“与基大利同在”，既自然，也避免重复说“与他、与基大利”。
- source_word: בַּמִּצְפָּה
  choice: 在米斯巴
  rationale: 介词与地名结合，表示事件发生的地点；“在米斯巴”符合现代汉语叙事习惯。
- source_word: הַכַּשְׂדִּים
  choice: 迦勒底人
  rationale: 原文明确使用“迦勒底人”，保留这一历史称谓；其在本叙事中可指巴比伦方面的人，脚注列出通俗替代译法。
- source_word: נִמְצְאוּ שָׁם
  choice: 当时在那里被发现
  rationale: 保留 מצא 的尼法勒式所带的被动、结果意味，而不简化为单纯的“在那里”；加入“当时”使汉语较为顺畅。
- source_word: אַנְשֵׁי הַמִּלְחָמָה
  choice: 这些战士
  rationale: 原义是“战争之人”或“打仗的人”。正文用现代汉语自然的“战士”，并以破折号体现它对前项的同位说明；直译见脚注。
- source_word: הִכָּה
  choice: 击杀
  rationale: נכה 的使役式在此叙事语境中表示以暴力击倒并杀死。“击杀”兼顾动作力度与致命结果，比单译“杀了”更贴近词义。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。主语依汉语习惯前置；以破折号保留原文末尾同位语的强调效果。专名采用常见圣经汉译“以实玛利、米斯巴、基大利、迦勒底人”。
