  text: וַ/יְהִ֕י כְּ/בוֹאָ֖/ם אֶל תּ֣וֹךְ הָ/עִ֑יר וַ/יִּשְׁחָטֵ֞/ם יִשְׁמָעֵ֤אל בֶּן נְתַנְיָה֙ אֶל תּ֣וֹךְ הַ/בּ֔וֹר ה֖וּא וְ/הָ/אֲנָשִׁ֥ים אֲשֶׁר אִתּֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/041/007.yaml
  text: And when they came into the midst of the city[a], Ishmael son of Nethaniah slaughtered them and threw them into the midst of the cistern, he and the men who were with him.
translation:
  language: zh_hans
  text: 他们进入城中时，尼探雅的儿子以实玛利和同他在一起的人屠杀了他们，把他们扔进蓄水池[a]里。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“坑”。希伯来语“בּוֹר”（bor）既可指坑，也可指蓄水池；本段上下文更适合译作“蓄水池”。
    reason: 保留原词的词义范围及“坑”这一可能译法。
lexical_decisions:
- source_word: וַיְהִי כְּבוֹאָם
  choice: 他们来到……时
  rationale: 这是希伯来语叙事中引出后续事件的时间结构；译作“来到……时”自然保留时间关系，无须生硬译出“事情发生了”。
- source_word: אֶל תּוֹךְ הָעִיר
  choice: 来到城中
  rationale: תּוֹךְ 指内部或当中；“城中”既保留空间含义，也符合现代汉语表达。
- source_word: וַיִּשְׁחָטֵם
  choice: 把他们宰杀了
  rationale: שׁחט 比一般的“杀死”更具屠杀色彩；“宰杀”传达原文的暴烈语气，又不添加原文没有的细节。
- source_word: אֶל תּוֹךְ הַבּוֹר
  choice: 扔进蓄水池中
  rationale: 原文直译近于“到蓄水池里面”，在此叙事句法中含有将尸体投入其中之意；汉语补出“扔进”，使动作关系清楚。“蓄水池”也切合上下文中的具体设施。
- source_word: הוּא וְהָאֲנָשִׁים אֲשֶׁר אִתּוֹ
  choice: 以实玛利和跟随他的人
  rationale: 该同位语表明以实玛利及其同伙共同施行此事；调整到主语位置，更符合汉语语序，同时保留共同责任。
- source_word: בּוֹר
  choice: 蓄水池
  rationale: בּוֹר 可指坑，也可指储水的池窖；本段语境更适合“蓄水池”，但以脚注保留词义上的另一可能。
