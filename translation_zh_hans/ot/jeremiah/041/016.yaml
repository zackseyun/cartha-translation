revisions:
- from: 于是，加利亚的儿子约哈难和跟随他的众军官，带走了所有剩下的百姓；这些人原是他从尼探雅的儿子以实玛利手中救回的，是以实玛利击杀亚希甘的儿子基大利之后从米斯巴掳走的人，包括壮丁、战士、妇女、幼童和宫廷官员[a]。约哈难把他们从基遍带了回来。
  to: 于是，迦利亚的儿子约哈难和跟随他的众军队首领，把所有从尼探雅的儿子以实玛利那里救回的余民，就是以实玛利在米斯巴击杀亚希甘的儿子基大利之后的那些人——男人、战士、妇女、幼童和宫廷官员[a]——从基遍带了回来。
  rationale: 修订避免“带走”与“带回来”的方向矛盾，删除原文未明说的“掳走”，并将“从基遍带了回来”保留为约哈难行动的终点信息。译文明确以实玛利为“击杀基大利”的施事者，这是上下文及该从句语义所要求；其余处不额外消除原文的句法压缩。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T07:29:27Z'
review_pass:
  verdict: revise
  source_fidelity: 草稿将 וַיִּקַּח 译为“带走了”，容易误示约哈难把人从当前位置带离；本节末尾明确说他“从基遍带了回来”，在此应译为“带着/带领”或以“把……从基遍带了回来”统摄。草稿又把“从米斯巴”扩展为“是以实玛利……从米斯巴掳走的人”；“掳走”虽符合上下文叙事，却不是本节明说的词义，且会将原文修饰关系的句法歧义消除。
  naturalness: 原译总体通顺，但末句另起为“约哈难把他们从基遍带了回来”，与前句“带走了”形成方向冲突。重组为一个主句，并用破折号列出人群类别，较符合现代汉语，也能保持原文长句的信息结构。
  terminology: “约哈难、迦利亚、以实玛利、尼探雅、基大利、亚希甘、米斯巴、基遍”均可接受。“众军队首领”比“众军官”更贴近“军队的首领/统领”，且不预设现代军衔体系。“余民”准确传达 שְׁאֵרִית 的幸存余剩之意；“宫廷官员”保留 סָרִיסִים 的宽泛含义，并应以脚注保留“宦官”的可能。
  issues:
  - severity: medium
    issue: “带走了”与“从基遍带了回来”在叙事方向上不协调。
    rationale: וַיִּקַּח 可为“带着、带领、带走”，但结合句末 אֲשֶׁר הֵשִׁיב מִגִּבְעוֹן（从基遍带回），中文应避免造成约哈难把人再次带离的印象。
  - severity: medium
    issue: “从米斯巴掳走的人”加入“掳走”。
    rationale: 原文只有“从米斯巴”，并未在本节使用“掳掠/掳走”的动词。尽管41章上下文说明以实玛利带走了这些人，译文不宜把该历史推断写成此处明示的修饰语。
  - severity: low
    issue: “众军官”略偏现代军事制度用语。
    rationale: שָׂרֵי הַחֲיָלִים 指军队的首领或统领；“众军队首领”更具时代中性，也保留其领导身份。
  revised_text: 于是，迦利亚的儿子约哈难和跟随他的众军队首领，把所有从尼探雅的儿子以实玛利那里救回的余民，就是以实玛利在米斯巴击杀亚希甘的儿子基大利之后的那些人——男人、战士、妇女、幼童和宫廷官员[a]——从基遍带了回来。
  revised_footnotes:
  - marker: a
    text: “宫廷官员”或译“宦官”；希伯来语 סָרִיסִים 可指宦官，也可指宫廷或王室官员。
    reason: lexical_alternative
  revision_rationale: 修订避免“带走”与“带回来”的方向矛盾，删除原文未明说的“掳走”，并将“从基遍带了回来”保留为约哈难行动的终点信息。译文明确以实玛利为“击杀基大利”的施事者，这是上下文及该从句语义所要求；其余处不额外消除原文的句法压缩。
