  text: וַ/יִּקַּח֩ יוֹחָנָ֨ן בֶּן קָרֵ֜חַ וְ/כָל שָׂרֵ֧י הַ/חֲיָלִ֣ים אֲשֶׁר אִתּ֗/וֹ אֵ֣ת כָּל שְׁאֵרִ֤ית הָ/עָם֙ אֲשֶׁ֣ר הֵ֠שִׁיב מֵ/אֵ֨ת יִשְׁמָעֵ֤אל בֶּן נְתַנְיָה֙ מִן הַ/מִּצְפָּ֔ה אַחַ֣ר הִכָּ֔ה אֶת גְּדַלְיָ֖ה בֶּן אֲחִיקָ֑ם גְּבָרִ֞ים אַנְשֵׁ֣י הַ/מִּלְחָמָ֗ה וְ/נָשִׁ֤ים וְ/טַף֙ וְ/סָ֣רִסִ֔ים אֲשֶׁ֥ר הֵשִׁ֖יב מִ/גִּבְעֽוֹן־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/041/016.yaml
  text: 'Then Yohanan son of Kareah[a], and all the commanders of the forces who were with him, took all the remnant of the people whom he had recovered from Ishmael son of Nethaniah, from Mizpah, after he had struck down Gedaliah son of Ahikam: the soldiers, the men of war, and the women, and the little children, and the court officials[b], whom he had brought back from Gibeon.'
translation:
  language: zh_hans
  text: 于是，迦利亚的儿子约哈难和跟随他的众军队首领，把所有从尼探雅的儿子以实玛利那里救回的余民，就是以实玛利在米斯巴击杀亚希甘的儿子基大利之后的那些人——男人、战士、妇女、幼童和宫廷官员[a]——从基遍带了回来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “宫廷官员”或译“宦官”；希伯来语 סָרִיסִים 可指宦官，也可指宫廷或王室官员。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: 于是……带走了
  rationale: 叙事性连续式推动事件发展；“于是”自然表达先后承接，“带走”也为下一节的行程作铺垫。
- source_word: שָׂרֵי הַחֲיָלִים
  choice: 众军官
  rationale: שָׂרֵי 指统领者，הַחֲיָלִים 在此指军队；“军官”简洁自然地表达军队中的领袖。
- source_word: שְׁאֵרִית הָעָם
  choice: 所有剩下的百姓
  rationale: 保留 שְׁאֵרִית 作为劫难后剩余之人的含义，同时比术语化的“余民”更便于普通读者理解。
- source_word: הֵשִׁיב מֵאֵת יִשְׁמָעֵאל
  choice: 从以实玛利手中救回
  rationale: 使役式 שוב 基本义为“使返回、带回”；上下文涉及从以实玛利控制下夺回人群，因此“救回”自然表达情境，但不改变其返回之意。
- source_word: מִן הַמִּצְפָּה
  choice: 从米斯巴掳走的人
  rationale: מִן 表示来源。结合40:7、10及41:10，以实玛利把这些人从米斯巴带走；补出“掳走”可在中文中明确修饰关系，避免误读为约哈难在米斯巴救回他们。
- source_word: אַחַר הִכָּה
  choice: 击杀……之后
  rationale: נכה 表示击打，并可指致死；基大利在上下文中确已被杀，因此“击杀”准确而简洁。
- source_word: גְּבָרִים אַנְשֵׁי הַמִּלְחָמָה
  choice: 壮丁、战士
  rationale: 保留原文两个并列/同位成分。גְּבָרִים 指成年男子或壮丁，אַנְשֵׁי הַמִּלְחָמָה 指作战人员；中文用顿号维持原文略显堆叠的列举。
- source_word: טַף
  choice: 幼童
  rationale: 该词通常指弱小的孩子或随行家属；此处列在人群类别中，“幼童”最直接。
- source_word: סָרִסִים
  choice: 宫廷官员
  rationale: סָרִיסִים 可指宦官，也可泛指宫廷或王室官员；上下文不能确定其生理身份，正文采用较宽泛的职务义，并以脚注保留另一可能。
- source_word: אֲשֶׁר הֵשִׁיב מִגִּבְעוֹן
  choice: 约哈难把他们从基遍带了回来
  rationale: 再次出现的 שוב 取其直接义“带回来”。拆成独立短句能在现代汉语中清楚交代地点来源和主语，同时保留希伯来文长句的全部信息。
- source_word: יוֹחָנָן; קָרֵחַ; יִשְׁמָעֵאל; נְתַנְיָה; גְּדַלְיָה; אֲחִיקָם
  choice: 约哈难；加利亚；以实玛利；尼探雅；基大利；亚希甘
  rationale: 采用现代中文圣经读者较熟悉的人名音译，并保持各人父子关系清楚。
