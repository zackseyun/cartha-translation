base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/041/011.yaml
  text: When Johanan son of Kareah, and all the commanders of the forces who were with him, heard of all the evil that Ishmael son of Nethaniah had done,
translation:
  language: zh_hans
  text: 加利亚的儿子约哈难和与他同在的众军长，听说了尼探雅的儿子以实玛利所行的一切恶事，
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: 听说了
  rationale: 该动词在叙事中表示得知所发生的事；“听说了”自然表达从消息中获知，也保留叙事推进。原文以连续式开头，但本节在句法上承接下一节，因此用未完结分句。
- source_word: שָׂרֵי הַחֲיָלִים
  choice: 众军官
  rationale: שָׂרֵי 指军事首领或指挥官，הַחֲיָלִים 指军队、部队；“众军官”在现代汉语中简洁自然，并符合本段军事语境。
- source_word: אֲשֶׁר אִתּוֹ
  choice: 跟随他的
  rationale: 关系从句说明这些军官与约哈难同在；“跟随他的”在此语境中自然表达他们与他同行、同属一方，不额外加入地点信息。
- source_word: אֵת כָּל הָרָעָה
  choice: 一切恶事
  rationale: רָעָה 在这里兼具道德邪恶与实际伤害的意味；“恶事”既保留道德分量，也适合指以实玛利已经实施的一系列行为。
- source_word: עָשָׂה
  choice: 所行的
  rationale: עָשָׂה 的基本义是“做、行”；“所行的”忠实而庄重，避免把含义收窄为特定法律术语。
- source_word: יוֹחָנָן בֶּן קָרֵחַ
  choice: 加利亚的儿子约哈难
  rationale: 依现代中文圣经人名惯例音译，并明确保留父子关系。
- source_word: יִשְׁמָעֵאל בֶּן נְתַנְיָה
  choice: 尼探雅的儿子以实玛利
  rationale: 依现代中文圣经人名惯例音译，并明确保留父子关系。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而通顺的叙事语言。原文第11节是引出下一节主句的前置叙事成分，因此末尾保留逗号，不将本节强行处理为独立完整句。“一切恶事”保留原文对行为既有道德评判又造成伤害的张力。
