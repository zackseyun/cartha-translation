base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/041/013.yaml
  text: And when all the people who were with Ishmael saw Johanan son of Kareah and all the commanders of the forces who were with him[a], they rejoiced.
translation:
  language: zh_hans
  text: 所有与以实玛利在一起的人看见加利亚的儿子约哈难和与他同在的众军官，就都欢喜了。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי כִּרְאוֹת
  choice: 看见……就
  rationale: וַיְהִי引入叙事中的时间情境，כ加不定式结构表示“当……看见时”。汉语用“看见……就”自然地呈现先后关系，又不额外强化为“刚一看见”。
- source_word: כָּל הָעָם אֲשֶׁר אֶת יִשְׁמָעֵאל
  choice: 跟随以实玛利的众人
  rationale: 原文关系从句有所省略，אֵת在此表伴随。结合上下文，所指是被以实玛利带走、当时随他同行的人；“跟随”在现代汉语中简洁表达其同行状态，不暗示他们自愿归属他。
- source_word: יֽוֹחָנָן בֶּן־קָרֵחַ
  choice: 加利亚的儿子约哈难
  rationale: 按现代汉语圣经人名惯例音译，并保留父子称谓结构。
- source_word: שָׂרֵי הַחֲיָלִים
  choice: 众军官
  rationale: שָׂרֵי指领袖、长官，הַחֲיָלִים在本段语境中指军事队伍。“众军官”简明、现代，并保留军事含义。
- source_word: אֲשֶׁר אִתּוֹ
  choice: 跟随他的
  rationale: 代词最自然地回指约哈难。译文保留代词，不将原文未明说的名字重复加入。
- source_word: וַיִּשְׂמָחוּ
  choice: 就都欢喜了
  rationale: שׂמח表达喜悦、欢喜；“欢喜”保留其情感力度，“都”明确承接主语“众人”，而“就”使汉语叙事衔接自然。
