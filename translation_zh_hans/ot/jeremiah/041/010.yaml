source:
  edition: WLC
  text: וַ/יִּ֣שְׁבְּ יִ֠שְׁמָעֵאל אֶת כָּל שְׁאֵרִ֨ית הָ/עָ֜ם אֲשֶׁ֣ר בַּ/מִּצְפָּ֗ה אֶת בְּנ֤וֹת הַ/מֶּ֨לֶךְ֙ וְ/אֶת כָּל הָ/עָם֙ הַ/נִּשְׁאָרִ֣ים בַּ/מִּצְפָּ֔ה אֲשֶׁ֣ר הִפְקִ֗יד נְבֽוּזַרְאֲדָן֙ רַב טַבָּחִ֔ים אֶת גְּדַלְיָ֖הוּ בֶּן אֲחִיקָ֑ם וַ/יִּשְׁבֵּ/ם֙ יִשְׁמָעֵ֣אל בֶּן נְתַנְיָ֔ה וַ/יֵּ֕לֶךְ לַ/עֲבֹ֖ר אֶל בְּנֵ֥י עַמּֽוֹן׀־־־־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/041/010.yaml
  text: Then Ishmael took captive all the remnant of the people who were in Mizpah—the king’s daughters and all the people who were left in Mizpah[a], whom Nebuzaradan the captain of the guard had entrusted to Gedaliah son of Ahikam[b]. Ishmael son of Nethaniah took them captive and went to cross over to the Ammonites.
translation:
  language: zh_hans
  text: 以实玛利把所有留在米斯巴的余民都掳走了[a]，其中有王的女儿们，以及所有留在米斯巴、由护卫长尼布撒拉旦交托给亚希甘的儿子基大利的百姓。尼探雅的儿子以实玛利掳走他们，动身渡往亚扪人那里去[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “掳走”也可译作“掳为俘虏”；希伯来文动词强调以强制手段将人掳去。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译“亚扪之子”，即亚扪人。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁבְּ / וַיִּשְׁבֵּם
  choice: 掳走了 / 掳走他们
  rationale: שׁבה的Qal词干表示以强制手段俘掳人口；“掳走”既保留被掳的含义，也体现从原地带走的动作，并照希伯来文重复此动词。
- source_word: שְׁאֵרִית הָעָם
  choice: 剩下的百姓
  rationale: שְׁאֵרִית指经历灾难后留下的一群人；“剩下的百姓”在现代汉语中自然，也保留耶利米书中的余民语义，而不额外赋予专门神学术语色彩。
- source_word: בַּמִּצְפָּה
  choice: 在米斯巴
  rationale: 介词ב在此表示地点；“在米斯巴”符合现代汉语地名用法。
- source_word: בְּנוֹת הַמֶּלֶךְ
  choice: 王的女儿们
  rationale: 直译“王的女儿”，避免用“公主”替文本预先界定其身份或地位。
- source_word: הַנִּשְׁאָרִים
  choice: 留在米斯巴
  rationale: שׁאר的分词表示仍然留下的人；结合地点译作“留在米斯巴”，行文清楚自然。
- source_word: הִפְקִיד ... אֶת גְּדַלְיָהוּ
  choice: 交托给……基大利
  rationale: הפקיד在此描述尼布撒拉旦把留下的百姓置于基大利监管之下；“交托给”保留委派管理的关系，又不把基大利本身误作被留下的对象。
- source_word: רַב טַבָּחִים
  choice: 护卫长
  rationale: 这是巴比伦官职称号；“护卫长”是简明、通行且符合语境的译法，比按词源译作“刽子手长”更能表达实际职务。
- source_word: לַעֲבֹר אֶל
  choice: 渡到……那里去
  rationale: עבר与אל连用，表示越过某处朝目的地前进；“渡到”保留可能涉及渡河或越境的空间动作，同时不具体添加文本未明说的河流。
- source_word: בְּנֵי עַמּוֹן
  choice: 亚扪人
  rationale: 字面为“亚扪之子”，在此是族群名称；“亚扪人”是现代汉语中准确自然的表达。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。保留原文两次使用“掳走”的重复，以呈现强制性及叙事强调；调整长句内部结构，使“其中有王的女儿们”清楚说明被掳者的组成，同时不消除原文关于其余百姓的包举关系。脚注标记置于各自所解释的词语之后。
