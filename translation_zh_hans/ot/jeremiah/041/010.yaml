- from: 以实玛利把所有在米斯巴剩下的百姓都掳走了[a]，其中有王的女儿们，以及尼布撒拉旦护卫长留在米斯巴、交托给亚希甘的儿子基大利的所有百姓。尼探雅的儿子以实玛利掳走他们，动身渡到亚扪人那里去[b]。
  to: 以实玛利把所有留在米斯巴的余民都掳走了[a]，其中有王的女儿们，以及所有留在米斯巴、由护卫长尼布撒拉旦交托给亚希甘的儿子基大利的百姓。尼探雅的儿子以实玛利掳走他们，动身渡往亚扪人那里去[b]。
