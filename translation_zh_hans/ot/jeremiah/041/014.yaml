base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/041/014.yaml
  text: Then all the people whom Ishmael had taken captive from Mizpah turned around and went back to Johanan son of Kareah[a].
translation:
  language: zh_hans
  text: 于是，以实玛利从米斯巴掳走的众人都转身回去，来到加利亚的儿子约哈难那里。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “掳走”也可译为“俘获”，或较直译为“掳去作俘虏”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּסֹבּוּ
  choice: 转身
  rationale: סבב在此描述众人改变行进方向；“转身”自然地保留了实际掉头的动作。
- source_word: כָּל הָעָם
  choice: 众人
  rationale: 带冠词的集合名词与כָּל连用，指被以实玛利掳走的全体人员；“众人”简洁自然。
- source_word: אֲשֶׁר שָׁבָה יִשְׁמָעֵאל
  choice: 以实玛利……掳走的
  rationale: שׁבה的Qal词形通常表示“掳掠、掳走”；中文定语结构自然表达该行动先于主线动作发生。
- source_word: מִן הַמִּצְפָּה
  choice: 从米斯巴
  rationale: מִן表示起点；“从米斯巴”直接对应原文，同时保留其可与“掳走”相连的自然理解。
- source_word: וַיָּשֻׁבוּ וַיֵּלְכוּ אֶל
  choice: 回去，投奔
  rationale: וַיָּשֻׁבוּ表达返回，וַיֵּלְכוּ אֶל表达走向约哈难。译作“回去，投奔”既保留两个连续动作，也自然呈现他们转而归向约哈难；“投奔”所含归附意味来自上下文，而非单独由הלך决定。
- source_word: יוֹחָנָן בֶּן קָרֵחַ
  choice: 加利亚的儿子约哈难
  rationale: 按现代中文圣经人名惯例音译，并保留“某人的儿子”这一父系称谓。
