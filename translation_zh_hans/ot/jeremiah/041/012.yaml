  text: וַ/יִּקְחוּ֙ אֶת כָּל הָ֣/אֲנָשִׁ֔ים וַ/יֵּ֣לְכ֔וּ לְ/הִלָּחֵ֖ם עִם יִשְׁמָעֵ֣אל בֶּן נְתַנְיָ֑ה וַ/יִּמְצְא֣וּ אֹת֔/וֹ אֶל מַ֥יִם רַבִּ֖ים אֲשֶׁ֥ר בְּ/גִבְעֽוֹן־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/041/012.yaml
  text: They took all the men and went to fight against Ishmael son of Nethaniah[a], and they found him by the great waters that are in Gibeon.
translation:
  language: zh_hans
  text: 他们带上所有的男子，去与尼探雅的儿子以实玛利交战；他们在基遍的众水旁找到了他。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在基遍水量充沛的地方”，或“在基遍的大水池旁”。希伯来文直译为“在基遍的许多（或大）水旁”。
    reason: 原文 מַיִם רַבִּים 可指许多、充沛或广大的水；具体所指可能是大型水池或蓄水池，但不能确定，正文保留较开放的表达。
lexical_decisions:
- source_word: וַיִּקְחוּ
  choice: 带上
  rationale: לקח在连续叙事中基本义为“拿、带”；此处指约哈难等人带领前节所说的人同行，并非擒拿他们。现代汉语用“带上”最自然。
- source_word: כָּל הָאֲנָשִׁים
  choice: 所有的人
  rationale: אֲנָשִׁים指“人、男人”。上下文虽属军事行动，但原文没有明确称他们为士兵，因此不增译为“所有士兵”。
- source_word: לְהִלָּחֵם עִם
  choice: 去攻打
  rationale: לחם的尼法勒不定式与עִם连用，表示与某人交战；“去攻打”在此清楚表达敌对行动，并符合现代汉语叙事习惯。
- source_word: יִשְׁמָעֵאל בֶּן נְתַנְיָה
  choice: 尼探雅的儿子以实玛利
  rationale: 按现代中文圣经人名惯例音译，并保留希伯来语父子关系结构。
- source_word: וַיִּמְצְאוּ אֹתוֹ
  choice: 他们……找到了他
  rationale: מצא的常用义是“找到”；在追击语境中，这一译法直接自然。
- source_word: אֶל מַיִם רַבִּים
  choice: 在……大水边
  rationale: מצא之后的אֶל在此指找到对象时所在或到达的位置；מַיִם רַבִּים直译为“大水”或“众水”。“大水边”保留原文意象，避免未经明示便确定为水池。
- source_word: אֲשֶׁר בְּגִבְעוֹן
  choice: 基遍的
  rationale: 关系从句直译为“在基遍的”，汉语整合为“基遍的大水”，简洁自然，仍表明水域位于基遍。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“带上”避免“带走”可能产生的强迫意味；“攻打”明确军事敌对关系；“大水”保留希伯来语的具体意象和所指的不确定性。脚注标记置于相关句末。
