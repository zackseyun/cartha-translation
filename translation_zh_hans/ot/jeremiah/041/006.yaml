  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ֠/יֵּצֵא יִשְׁמָעֵ֨אל בֶּן נְתַנְיָ֤ה לִ/קְרָאתָ/ם֙ מִן הַ/מִּצְפָּ֔ה הֹלֵ֥ךְ הָלֹ֖ךְ וּ/בֹכֶ֑ה וַֽ/יְהִי֙ כִּ/פְגֹ֣שׁ אֹתָ֔/ם וַ/יֹּ֣אמֶר אֲלֵי/הֶ֔ם בֹּ֖אוּ אֶל גְּדַלְיָ֥הוּ בֶן אֲחִיקָֽם־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/041/006.yaml
  text: Then Ishmael son of Nethaniah went out from Mizpah to meet them[a], going and weeping. When he met them, he said to them, “Come to Gedaliah son of Ahikam.”
translation:
  language: zh_hans
  text: 以实玛利，就是尼探雅的儿子，从米斯巴出来迎接他们[a]，一路走，一路哭。他遇见他们时，就对他们说：“到亚希甘的儿子基大利那里来。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“走着，走着并哭着”；这种表达强调他在走近他们时动作持续不断。
    reason: 说明原文以同词根重复结构表达持续动作，而正文采用自然汉语译法。
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: 出来
  rationale: 该叙事动词承接上文、推进事件；现代汉语无须逐字译出连接词，语序本身即可自然表达先后。
- source_word: לִקְרָאתָם
  choice: 迎接他们
  rationale: לִקְרַאת 表示朝某人而去、与其会合；“迎接”既简洁，也符合此处以实玛利主动出城相迎的场景。
- source_word: מִן הַמִּצְפָּה
  choice: 从米斯巴
  rationale: מִן 标明出发地点；地名按通行圣经译名译作“米斯巴”。
- source_word: הֹלֵךְ הָלֹךְ
  choice: 一路走
  rationale: 分词与同词根绝对不定式连用，具有持续、进行的意味；“一路走”用自然汉语保留其延续性。
- source_word: וּבֹכֶה
  choice: 一路哭
  rationale: בכה 指哭泣；与前面的持续结构并列表达，译为“一路走，一路哭”，既再现持续动作，也保留原文刻意描写的伪装性场景而不额外解释动机。
- source_word: וַיְהִי כִּפְגֹשׁ אֹתָם
  choice: 他遇见他们时
  rationale: 这是常见的希伯来语时间结构；以现代汉语时间从句表达，避免生硬直译“事情发生在……”。
- source_word: בֹּאוּ אֶל
  choice: 到……那里来
  rationale: בוא 加 אֶל 在此为邀请或引导对方前往某人所在之处；“到……那里来”比单说“来见”更贴近方向表达，又不预设基大利是否亲自接见。
- source_word: גְּדַלְיָהוּ בֶן אֲחִיקָם
  choice: 亚希甘的儿子基大利
  rationale: 按现代汉语常用的亲属定语结构表达希伯来语父名式，并采用通行人名译法。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“一路走，一路哭”保留原文的持续性和略带刻意的重复节奏；不在正文中补入“假装”等原文未明说的动机。
