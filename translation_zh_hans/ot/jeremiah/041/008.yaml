  text: וַ/עֲשָׂרָ֨ה אֲנָשִׁ֜ים נִמְצְאוּ בָ֗/ם וַ/יֹּאמְר֤וּ אֶל יִשְׁמָעֵאל֙ אַל תְּמִתֵ֔/נוּ כִּֽי יֶשׁ לָ֤/נוּ מַטְמֹנִים֙ בַּ/שָּׂדֶ֔ה חִטִּ֥ים וּ/שְׂעֹרִ֖ים וְ/שֶׁ֣מֶן וּ/דְבָ֑שׁ וַ/יֶּחְדַּ֕ל וְ/לֹ֥א הֱמִיתָ֖/ם בְּ/ת֥וֹךְ אֲחֵי/הֶֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/041/008.yaml
  text: But ten men were found among them[a], and they said to Ishmael, “Do not put us to death, for we have hidden stores in the field—wheat and barley[b], oil and honey.” So he refrained and did not put them to death among their brothers.
translation:
  language: zh_hans
  text: 但在他们中间发现了十个人。他们对以实玛利说：“不要杀我们，因为我们在田里藏着一些储备[a]：小麦、大麦、油和蜜。”于是他住了手，没有在他们弟兄中间杀死他们[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “储备”也可译作“宝藏”或“藏起来的东西”；从下文列出的物资看，这里更可能指藏起来的食物等物资。
    reason: lexical_alternative
  - marker: b
    text: “他们的弟兄”可能指与他们同在一群、当时正在被杀的人；也可泛指他们的同胞或同伴。
    reason: cultural_note
lexical_decisions:
- source_word: וַעֲשָׂרָה אֲנָשִׁים נִמְצְאוּ בָם
  choice: 但在他们中间发现了十个人
  rationale: 保留 נִמְצְאוּ 的被动含义，并以“但”表达这十人构成前文杀戮中的例外。
- source_word: אַל תְּמִתֵנוּ
  choice: 不要杀我们
  rationale: 这是现代汉语中自然、直接的求饶用语；虽未逐字呈现使役形态，却准确表达“使我们死／处死我们”的语境含义。
- source_word: כִּי יֶשׁ לָנוּ מַטְמֹנִים בַּשָּׂדֶה
  choice: 因为我们在田里藏着一些储备
  rationale: מַטְמֹנִים 可指隐藏之物或宝藏；随后列出的粮食、油和蜜表明此处主要是藏起来的物资储备。
- source_word: חִטִּים וּשְׂעֹרִים וְשֶׁמֶן וּדְבָשׁ
  choice: 小麦、大麦、油和蜜
  rationale: 逐项保留四类物资；“油”不在正文中擅自限定为橄榄油，“蜜”也保留原词可能涵盖蜂蜜或浓缩果汁的历史语义范围。
- source_word: וַיֶּחְדַּל
  choice: 于是他住了手
  rationale: חדל 表示停止、不再继续；“住了手”自然地表达以实玛利停止杀害这些人。
- source_word: וְלֹא הֱמִיתָם בְּתוֹךְ אֲחֵיהֶם
  choice: 没有把他们杀死在他们的弟兄中间
  rationale: 贴近希伯来语的空间表达，并保留 אֲחֵיהֶם 的亲属／同伴称谓，不把所指对象过度明确化。
theological_decisions:
- issue: “他们的弟兄”所指范围
  choice: 正文直译为“他们的弟兄”，脚注说明可能指同行而遭杀害的人
  alternative: 译作“同伴”或“族人”
  rationale: אֲחֵיהֶם 本义为“他们的兄弟”，在此可能泛指同胞、同伴或同一群体中的人；原文没有进一步限定，故保留其含混性。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“住了手”简洁呈现停止杀人的动作；正文保留“弟兄”的原文称谓，以免把关系解释得过于确定。
