base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/041/015.yaml
  text: But Ishmael son of Nethaniah escaped from Johanan with eight men and went to the Ammonites[a][b][c].
translation:
  language: zh_hans
  text: 可是，尼探雅的儿子以实玛利同八个人逃脱了约哈难的追捕，往亚扪人那里去了[a][b][c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文作“而以实玛利”；这里译作“可是”，是为了表达与上文行动结果之间的转折。
    reason: lexical_alternative
  - marker: b
    text: 直译“从约哈难面前”；这是希伯来语习惯说法，指逃离约哈难本人或他的追捕。
    reason: lexical_alternative
  - marker: c
    text: 希伯来文作“到亚扪之子那里”，意思是到亚扪人那里。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/יִשְׁמָעֵאל
  choice: 可是，……以实玛利
  rationale: 连词 וְ 字面可译“而／和”，但上下文强调约哈难虽采取行动，以实玛利却仍逃脱，因此用“可是”自然表达叙事中的转折。
- source_word: בֶּן נְתַנְיָה
  choice: 尼探雅的儿子
  rationale: 按希伯来语父名结构直译，同时符合现代汉语表达。
- source_word: נִמְלַט
  choice: 逃脱
  rationale: מלט 的尼法勒形在此表示成功脱离追捕或危险；“逃脱”准确而自然。
- source_word: בִּ/שְׁמֹנָה אֲנָשִׁים
  choice: 带着八个人
  rationale: 介词 בְּ 在此表示伴随；“带着八个人”清楚表达以实玛利与八人一同逃走。
- source_word: מִ/פְּנֵי יֽוֹחָנָן
  choice: 从约哈难面前
  rationale: 保留“从……面前”这一希伯来语意象；在“逃脱”的搭配中，现代汉语读者可自然理解为逃离其面前或追捕。
- source_word: וַ/יֵּלֶךְ
  choice: 去了
  rationale: 表达连续发生的叙事动作；汉语用句末“去了”简洁自然。
- source_word: אֶל בְּנֵי עַמּוֹן
  choice: 到亚扪人那里
  rationale: בְּנֵי עַמּוֹן 字面为“亚扪之子”，是对亚扪人的常用族群称谓；译作“亚扪人”符合现代汉语。
