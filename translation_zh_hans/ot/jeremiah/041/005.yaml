  text: וַ/יָּבֹ֣אוּ אֲ֠נָשִׁים מִ/שְּׁכֶ֞ם מִ/שִּׁל֤וֹ וּ/מִ/שֹּֽׁמְרוֹן֙ שְׁמֹנִ֣ים אִ֔ישׁ מְגֻלְּחֵ֥י זָקָ֛ן וּ/קְרֻעֵ֥י בְגָדִ֖ים וּ/מִתְגֹּֽדְדִ֑ים וּ/מִנְחָ֤ה וּ/לְבוֹנָה֙ בְּ/יָדָ֔/ם לְ/הָבִ֖יא בֵּ֥ית יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/041/005.yaml
  text: Then eighty men came from Shechem[a], from Shiloh, and from Samaria, with their beards shaved, their clothes torn, and gashing themselves[c][b], with grain offerings and frankincense in their hands to bring to the house of Yahweh.
translation:
  language: zh_hans
  text: 那时，有八十名男子从示剑、示罗和撒马利亚来。他们胡须剃光，衣服撕裂，又割伤自己[a]，手里拿着素祭[b]和乳香，要带到雅威的殿[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“在自己身上划口子”。这是当时一种哀悼行为。
    reason: lexical_alternative
  - marker: b
    text: “素祭”也可译作“供物”；这里与乳香并列，并要带到圣所，因此很可能指谷物祭物。
    reason: lexical_alternative
  - marker: c
    text: 直译“雅威的家”。这里可能指圣所所在地，不一定表示圣殿建筑仍完整存在。
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: 那时……来
  rationale: 连续式叙事动词推进情节；“那时”自然表达事件的先后承接。
- source_word: אֲנָשִׁים / שְׁמֹנִים אִישׁ
  choice: 八十个人
  rationale: 上下文所指为成年男性，但现代汉语在数词后用“个人”比“八十个男人”自然，且不改变所指。
- source_word: מִשְּׁכֶם מִשִּׁלוֹ וּמִשֹּׁמְרוֹן
  choice: 从示剑、示罗和撒马利亚
  rationale: 采用现代中文圣经地名的通行译法，并保留三个来源地的并列关系。
- source_word: מְגֻלְּחֵי זָקָן
  choice: 剃了胡须
  rationale: 准确表达被动分词所描述的状态，也保留哀悼行为的具体形象。
- source_word: וּקְרֻעֵי בְגָדִים
  choice: 撕裂衣服
  rationale: 这是哀悼的惯常动作；译文简明、具体。
- source_word: וּמִתְגֹּדְדִים
  choice: 割伤自己
  rationale: 该词形表示在自己身上划割；“割伤自己”既表达蓄意自割，又避免加入原文未说明的伤口程度。
- source_word: וּמִנְחָה
  choice: 素祭
  rationale: 在与乳香同带往圣所的礼仪语境中，מִנְחָה最可能指谷物祭物；采用中文圣经常用的“素祭”。
- source_word: וּלְבוֹנָה
  choice: 乳香
  rationale: 该名词特指乳香，不只是泛称的香料或香。
- source_word: בְּיָדָם
  choice: 手里拿着
  rationale: 保留希伯来文“在他们手中”的具体表达，同时符合现代汉语习惯。
- source_word: לְהָבִיא
  choice: 要带到
  rationale: 表达不定式的目的意义，并与前面的“拿着”自然衔接。
- source_word: בֵּית יְהוָה
  choice: 雅威的殿
  rationale: “殿”在中文中自然指神的圣所；脚注保留“家”的字面形式及殿宇是否完整存在的语境张力。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名。译作“雅威”旨在以现代汉语近似呈现该名，而不以称号“上主”取代；“耶和华”虽为中文传统译法，但其语音形式来自较晚的混合读法。
- issue: 被毁之后“雅威的殿”所指为何
  choice: 正文保留“雅威的殿”，脚注说明可能指圣所所在地
  alternative: 直接译作“雅威殿的遗址”
  rationale: 原文仍用“雅威的家”，没有明确说“遗址”；正文不替作者消解殿宇被毁与人们仍来献祭之间的张力。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。以短句分开来者的身份和哀悼状态，避免欧化的长串修饰；“示剑、示罗、撒马利亚、素祭、乳香”等沿用易识别的中文圣经用语。
