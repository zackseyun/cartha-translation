  yaml_path: translation/ot/jeremiah/041/017.yaml
  text: So they went and stayed at Geruth Chimham[a], which is beside Bethlehem[b], intending to go on into Egypt.
translation:
  language: zh_hans
  text: 他们就前往，在伯利恒附近的基罗特·金罕[a]住下，打算进入埃及。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “基罗特·金罕”也可译作“金罕的寄居处（或住宿处）”。希伯来语“基罗特”在这里很可能是地名，但也可能指与金罕有关的寄居或住宿之处。本节所据的希伯来文本中，“金罕”的书写形式不规则；根据上下文以及《撒母耳记下》19:37—40所见的人名，此处宜理解为“金罕”。
    reason: lexical_alternative_and_textual_variant
lexical_decisions:
- source_word: וַיֵּלְכוּ
  choice: 于是，他们动身
  rationale: 该连续叙事形式推进事件；“于是”承接上文，“动身”自然表达他们开始行程。
- source_word: וַיֵּשְׁבוּ
  choice: 住下
  rationale: ישׁב可指坐、居住或停留；旅行语境中指暂时驻留，“住下”简洁自然。
- source_word: בְּגֵרוּת
  choice: 在基罗特
  rationale: 此处很可能用作地名；音译既保留这一理解，也避免把可能的专名径直解释为普通名词。
- source_word: כמו/הם
  choice: 金罕
  rationale: 所提供文本的书写形式异常；结合上下文以及撒母耳记下19:37–40所见人名，宜按专名כִּמְהָם理解。
- source_word: אֲשֶׁר אֵצֶל בֵּית לָחֶם
  choice: 伯利恒附近的
  rationale: אֵצֶל表示邻近；中文定语结构自然地交代该地点与伯利恒的位置关系。
- source_word: לָלֶכֶת לָבוֹא מִצְרָיִם
  choice: 打算继续前往埃及
  rationale: 两个带ל的动词不定式表达目的和趋向；“打算”显出尚未完成的意向，“继续前往”体现从暂住地再往埃及去的行程。
- source_word: מִצְרָיִם
  choice: 埃及
  rationale: 该地名的现代标准汉语译名。
