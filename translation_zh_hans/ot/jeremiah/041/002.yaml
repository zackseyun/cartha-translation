base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/041/002.yaml
  text: Then Ishmael son of Nethaniah rose up with the ten men who were with him[a], and they struck down Gedaliah son of Ahikam, son of Shaphan, with the sword, and killed him—the one whom the king of Babylon had appointed over the land.
translation:
  language: zh_hans
  text: 于是，尼探雅的儿子以实玛利和与他同在的那十个人[a]起来，用刀击打沙番的孙子、亚希甘的儿子基大利，杀了他；这基大利是巴比伦王委派管理这地的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“以实玛利起来，他和与他同在的那十个人用刀击打基大利……杀了他。”希伯来文连续使用“击打”和“杀死”两个动词，表达袭击及其致死结果。
    reason: 词义与句法备选
lexical_decisions:
- source_word: וַיָּקָם
  choice: 起身
  rationale: קום的Qal叙事形式标志敌对行动的开始；“起身”既保留动作意象，也不额外补入原文未明说的“反叛”。
- source_word: וַעֲשֶׂרֶת הָאֲנָשִׁים אֲשֶׁר הָיוּ אִתּוֹ
  choice: 和跟随他的那十个人
  rationale: 定冠词所指的是已知的十人；“跟随他的”自然表达这些人与以实玛利同在并参与行动的关系。
- source_word: וַיַּכּוּ
  choice: 击杀
  rationale: נכה在暴力叙事中可指致命打击；“击杀”保留攻击动作，并与随后明确结果的“使他丧命”形成连续表达。
- source_word: בַּחֶרֶב
  choice: 用刀
  rationale: 工具性介词ב用“用”表达；חֶרֶב可泛指刀剑类兵器，现代汉语叙事中“用刀”自然且不武断限定具体兵器形制。
- source_word: וַיָּמֶת אֹתוֹ
  choice: 使他丧命
  rationale: מות的Hiphil使役式明确表示造成死亡；此译法保留与前一动词相继出现的致死结果。
- source_word: אֲשֶׁר הִפְקִיד
  choice: 委派管理
  rationale: פקיד在行政语境中表示委任并使其负责；“委派管理”同时传达任命及职权，避免只译“任命”而使句末“这地”的关系生硬。
- source_word: מֶלֶךְ בָּבֶל
  choice: 巴比伦王
  rationale: 采用现代汉语中自然、庄重的构式表达希伯来语属格结构。
- source_word: בָּאָרֶץ
  choice: 管理这地
  rationale: 结合הִפְקִיד的行政含义，介词短语表示基大利对该地负有治理职责，而不只是身处其中。
- source_word: גְּדַלְיָהוּ בֶן אֲחִיקָם בֶּן שָׁפָן
  choice: 沙番的孙子、亚希甘的儿子基大利
  rationale: 按自然汉语亲属称谓重组谱系，完整保留基大利经亚希甘追溯至沙番的身份信息。
