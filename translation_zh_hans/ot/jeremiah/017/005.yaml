base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/017/005.yaml
  text: 'Thus says Yahweh: Cursed is the man who trusts in man and makes flesh his strength[b][a], whose heart turns away from Yahweh.'
translation:
  language: zh_hans
  text: '耶和华如此说：


    “倚靠人、

    以血肉为自己的臂膀[a]、

    心转离耶和华的人，

    是受咒诅的[b]。”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “臂膀”在这里比喻力量或所倚仗的能力。原文直译为“以血肉为自己的臂膀”。
    reason: lexical_alternative
  - marker: b
    text: 原文“人”和“人”均为阳性单数形式，在这里具有代表性，泛指任何这样倚靠人的人。
    reason: cultural_note
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  choice: 耶和华如此说
  rationale: 保留先知传信公式的庄重语气，并以“耶和华”呈现神的专名。
- source_word: אָרוּר
  choice: 必受咒诅
  rationale: 表达宣告性的受咒诅状态；加“必”使现代汉语句法自然，但不削弱其司法和盟约意味。
- source_word: הַגֶּבֶר אֲשֶׁר יִבְטַח בָּאָדָם
  choice: 倚靠世人的人
  rationale: 两个阳性单数名词在这里具有代表性；汉语“人／世人”自然涵盖所有人。“世人”突出受造人类与耶和华之间的对照。
- source_word: וְשָׂם בָּשָׂר זְרֹעוֹ
  choice: 以血肉之躯为自己臂膀
  rationale: 保留“血肉”与“臂膀”的原文意象；“臂膀”在庄重现代汉语中可自然表示所倚仗的力量。
- source_word: וּמִן יְהוָה יָסוּר לִבּוֹ
  choice: 心却转离耶和华
  rationale: “心”保留希伯来语有关意志、思想与忠诚中心的整体观念；“却”显明倚靠人和离开耶和华之间的内在对照。
theological_decisions:
- issue: 倚靠人的范围
  choice: 倚靠世人
  alternative: 倚靠某个人
  rationale: אָדָם在此泛指人类或凡人；“世人”既保持单数表达背后的普遍意义，也避免把警告局限于某一特定个人。
- issue: “血肉”与“臂膀”的关系
  choice: 以血肉之躯为自己臂膀
  alternative: 以血肉为自己的力量
  rationale: 原文同时使用בָּשָׂר（血肉）和זְרוֹעַ（臂膀）。正文保留两个意象，不把“臂膀”直接释义成“力量”；脚注说明其比喻意义。
- issue: 咒诅宣告的语气
  choice: 必受咒诅
  alternative: 是可咒诅的
  rationale: 该句是耶和华发出的审判宣告，而不是准许人去咒骂；“受咒诅”能避免后者的误解。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语，并按希伯来诗句层次分行。保留“血肉之躯”和“臂膀”的具体意象，以脚注解释其习语意义；神名统一译作“耶和华”。
