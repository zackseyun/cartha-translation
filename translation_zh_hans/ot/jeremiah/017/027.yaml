source:
  edition: WLC
  text: וְ/אִם לֹ֨א תִשְׁמְע֜וּ אֵלַ֗/י לְ/קַדֵּשׁ֙ אֶת י֣וֹם הַ/שַּׁבָּ֔ת וּ/לְ/בִלְתִּ֣י שְׂאֵ֣ת מַשָּׂ֗א וּ/בֹ֛א בְּ/שַׁעֲרֵ֥י יְרוּשָׁלִַ֖ם בְּ/י֣וֹם הַ/שַּׁבָּ֑ת וְ/הִצַּ֧תִּי אֵ֣שׁ בִּ/שְׁעָרֶ֗י/הָ וְ/אָֽכְלָ֛ה אַרְמְנ֥וֹת יְרוּשָׁלִַ֖ם וְ/לֹ֥א תִכְבֶּֽה־־׀׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/017/027.yaml
  text: But if you do not listen to me[a], to keep the Sabbath day holy, and not to carry a load and bring it in through the gates of Jerusalem on the Sabbath day, then I will kindle a fire in its gates, and it will consume the palaces of Jerusalem[b], and it will not be quenched.
translation:
  language: zh_hans
  text: 但你们若不听从我，不把安息日分别为圣，也不在安息日搬运担子，并把担子从耶路撒冷的城门带进城，我就要在耶路撒冷的城门中点起火来；这火必吞灭耶路撒冷的宫殿，必不熄灭。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תִשְׁמְעוּ אֵלַי
  choice: 听从我
  rationale: שׁמע与אֶל连用表示听取、留心并顺从；“听从”在现代汉语中自然地保留听与服从两层含义。
- source_word: לְקַדֵּשׁ אֶת יוֹם הַשַּׁבָּת
  choice: 把安息日分别为圣
  rationale: קדשׁ的使役/强化词干在此指将某日分别出来，视为圣；此译保留“圣”的核心概念。
- source_word: וּלְבִלְתִּי שְׂאֵת מַשָּׂא
  choice: 不……挑担子
  rationale: שׂאת מַשָּׂא直指提起、搬运重物；结合城门与安息日的语境，“挑担子”简明地表达运载货物或重物，又不将所载之物限定得过窄。
- source_word: וּבֹא בְּשַׁעֲרֵי יְרוּשָׁלִַם
  choice: 把担子带进耶路撒冷的城门
  rationale: בוא在此与前面的搬运担子并列，语义上含有把刚提到的担子带入城门；在汉语中补出宾语可使关系清楚。
- source_word: וְהִצַּתִּי אֵשׁ
  choice: 我就要……点起火来
  rationale: יצת的使役词干意为点燃；“就”清楚表达条件句后件，而不改变原文逻辑。
- source_word: בִּשְׁעָרֶיהָ
  choice: 在耶路撒冷的城门中
  rationale: 阴性代词后缀回指耶路撒冷。汉语重复城名比译作“她的”自然，并避免不必要的拟人化。
- source_word: וְאָכְלָה אַרְמְנוֹת יְרוּשָׁלִַם
  choice: 这火必吞灭耶路撒冷的宫殿
  rationale: אָכְלָה以火为主语，具有吞吃、烧尽之意；“吞灭”保留火焰吞噬的形象。אַרְמְנוֹת可指宫殿或坚固的大宅，此处取常见义“宫殿”。
- source_word: וְלֹא תִכְבֶּה
  choice: 不能熄灭
  rationale: כבה的基本含义是火熄灭或被扑灭；“不能熄灭”保留原文未明确施事者的表达。
theological_decisions:
- issue: 安息日术语
  choice: 安息日
  alternative: 安息日这一天
  rationale: 希伯来文虽有יוֹם（“日”），但“安息日”在现代汉语中已经完整指称该日；避免重复“日”字，同时未削弱其作为特定日子的含义。
- issue: 条件性审判的句法
  choice: 若……我就要……
  alternative: 若……我便……／若……而我将……
  rationale: 原文由וְאִם引出否定条件，后以连续结构陈述结果；“若……就……”准确而自然地呈现条件与后果。
- issue: 不可熄灭之火
  choice: 不能熄灭
  alternative: 无人能把它熄灭
  rationale: 原文只说火不熄灭，并未明说无人有能力扑灭；所选译法保留审判宣告的力度，又不增添施事者或进一步的教义推论。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“分别为圣”保留先知文本的圣洁术语；“挑担子”具体、易懂，符合城门运输的语境。全节不用脚注，因为主要词义可在正文中自然表达，且没有必须标出的文本异读。
