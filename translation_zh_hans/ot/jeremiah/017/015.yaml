  text: הִנֵּה הֵ֕מָּה אֹמְרִ֖ים אֵלָ֑/י אַיֵּ֥ה דְבַר יְהוָ֖ה יָ֥בוֹא נָֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/017/015.yaml
  text: Look[a], they are saying to me, “Where is the word of Yahweh? Let it come now!”
translation:
  language: zh_hans
  text: 看，他们正在对我说：“雅威的话[a]在哪里？让它现在来到吧！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“雅威的信息”。希伯来语这一短语是先知书中表示上帝所赐话语或神谕的惯用说法。
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: 看
  rationale: 这是引人注意的指示性语气词；“看”在现代汉语中自然直接，也保留了原文要求听者注意眼前情形的作用。
- source_word: הֵמָּה אֹמְרִים
  choice: 他们正对我说
  rationale: 独立代词 הֵמָּה 强调说话者群体，分词 אֹמְרִים 表示正在发生或持续的言说；“他们正……说”保留进行意味，又不把反复性说得过死。
- source_word: אֵלַי
  choice: 对我
  rationale: 介词 אֶל 加第一人称单数词尾，最直接表示话语朝向耶利米；敌意由引语本身体现，不译成解释性更强的“攻击我”。
- source_word: אַיֵּה
  choice: 在哪里
  rationale: 保留对位置或存在的直接质问；在此语境中也自然传达对预言迟迟未实现的嘲讽。
- source_word: דְבַר יְהוָה
  choice: 雅威的话
  rationale: 这是先知文献中表示来自上帝之言语、宣告或信息的惯用表达；“话”保留其广度，不预先限定为某一种神谕形式。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语音译呈现四字神名，而不以“主”这一称号替代。
- source_word: יָבוֹא נָא
  choice: 现在让它来吧
  rationale: 未完成式在此带祈使或催促意味，נָא 加强挑战语气；“让它来吧”保留“话来到”这一原文意象，也让嘲讽性的催促保持可见。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用神名；采用“雅威”以音译保留专名性质，避免用称号代替，也不沿用较偏离当前学界重构读音的“耶和华”。
- issue: “雅威的话”来到的含义
  choice: 让它来吧
  alternative: 让它应验吧
  rationale: 上下文可能指预言实现，但原文使用普通动词“来”；直译保留“话来到”的先知性表达及其神学张力，不在正文中把它明确解释成“应验”。
translation_notes:
  register: 采用现代、庄重而直接的汉语。“看”比“看哪”更贴近日常现代书面语；引语中的“现在让它来吧”刻意保留挑衅、催促的口吻和原文意象。
