base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/017/003.yaml
  text: My mountain in the field—your wealth[a], all your treasures[c][b], and your high places because of sin throughout all your territory—I will give as plunder.
translation:
  language: zh_hans
  text: 我那在田野中的山[a]，连同你的财富[b]、你所有的宝藏和你的丘坛，我都要因你全境各处的罪[c]交给人掳掠。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我那在田野中的山啊！”希伯来语此处较难理解，可能指耶和华的山，即锡安或耶路撒冷。
    reason: alternative_reading
  - marker: b
    text: “财富”也可译为“力量”，在此处较不可能指“军队”。
    reason: lexical_alternative
  - marker: c
    text: 这句话也可理解为“为你全境各处的罪”或“在你全境各处的罪中”；原文中“罪”与“丘坛”及整项审判的关系并不完全明确。
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲרָרִי בַּשָּׂדֶה
  choice: 我在田野中的山
  rationale: 按“山”加第一人称单数所有格直译，并保留“在田野中”的具体意象及原文难解之处；这里很可能指耶和华的山，即锡安或耶路撒冷。
- source_word: חֵילְךָ
  choice: 你的财富
  rationale: חַיִל 可指力量、财富或军队；本节与“宝藏”和“交给人掳掠”并列，经济意义最合语境。
- source_word: כָל אוֹצְרוֹתֶיךָ
  choice: 你所有的宝藏
  rationale: 该词既可指宝物，也可指库房；作为被掳掠之物，“宝藏”在现代汉语中最清楚自然。
- source_word: לָבַז אֶתֵּן
  choice: 我都要……交给人掳掠
  rationale: 这是审判宣告中的常见表达；“交给人掳掠”既体现 אֶתֵּן 的“给出、交出”，也传达 לָבַז 的战利品含义。
- source_word: בָּמֹתֶיךָ
  choice: 你的丘坛
  rationale: בָּמוֹת 指高处的祭祀场所；“丘坛”简洁保留其地势与宗教含义。
- source_word: בְּחַטָּאת בְּכָל גְּבוּלֶיךָ
  choice: 因你遍境的罪
  rationale: 将介词 בְּ 理解为审判的原因，并把“全境”表达为罪遍及领土各处；脚注保留“为罪”或“在罪中”等可能关系。
theological_decisions:
- issue: “我在田野中的山”的所指与句法功能
  choice: 保留为耶和华所属之山，并作为被交给人掳掠的前置对象
  alternative: 作呼语“我在田野中的山啊”，或泛指该地的山地
  rationale: “我的”最可能使人想到耶和华的山，即锡安或耶路撒冷，但原文句法困难；正文不直接以“锡安”替换，从而保留其意象与张力。
- issue: 罪、丘坛与审判之间的关系
  choice: 将“因你遍境的罪”理解为整项掳掠审判的原因
  alternative: 理解为“为着罪遍及你全境的丘坛”，或“在你全境的罪中”
  rationale: 因果理解符合审判语境，但希伯来语连续的介词短语可有不同连接方式，因此以脚注说明。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“连同……我都要……”使前置宾语关系清楚，同时保留希伯来语的强调次序；“丘坛”沿用普通读者可理解的圣经宗教用语，未将其扩写为带特定宗派判断的术语。
