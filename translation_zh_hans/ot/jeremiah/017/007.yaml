id: JER.17.7
reference: Jeremiah 17:7
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: בָּר֣וּךְ הַ/גֶּ֔בֶר אֲשֶׁ֥ר יִבְטַ֖ח בַּֽ/יהוָ֑ה וְ/הָיָ֥ה יְהוָ֖ה מִבְטַחֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/017/007.yaml
  text: Blessed is the man who trusts in Yahweh[b][a], and whose trust is Yahweh.
translation:
  language: zh_hans
  text: 信靠耶和华、以耶和华为所倚靠的，那人有福了。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“信靠耶和华的人有福了；耶和华是他所倚靠的。”其中“所倚靠的”也可译作“信赖”或“信心所在”。
    reason: 保留原文后半句的句法及 מִבְטָח 的词义幅度。
lexical_decisions:
- source_word: בָּרוּךְ
  choice: 有福了
  rationale: 表达被赐福、蒙福的客观状态，比“快乐”更能保留原文的神学分量，也符合现代中文圣经语体。
- source_word: הַגֶּבֶר
  choice: 那人
  rationale: 原词是阳性单数，在此具有格言式、代表性的用法；“那人”保留单数形式，同时在现代汉语中自然。
- source_word: יִבְטַח בַּיהוָה
  choice: 信靠耶和华
  rationale: בטח 表示信任、倚赖；与介词 ב 连用时，“信靠”简洁而准确。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文读者熟悉的专名形式呈现四字神名，并与普通称号“主”相区分。
- source_word: וְהָיָה יְהוָה מִבְטַחוֹ
  choice: 以耶和华为所倚靠的
  rationale: 原文直陈耶和华是此人信赖的对象；此译保留与前半句 בטח／מבטח 的词根呼应，并用自然中文表达其关系。
- source_word: מִבְטַחוֹ
  choice: 所倚靠的
  rationale: 该名词可指“信赖”或“信赖的对象”；在本句中后者更合适，因为耶和华被明确置于这一位置。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文两次使用四字神名。正文保留专名而不泛化为“主”；“耶和华”是现代中文圣经传统中最广为人知的形式。
- issue: מִבְטַחוֹ 指主观信心还是信靠对象
  choice: 所倚靠的（信靠对象）
  alternative: 他的信心／他的倚靠
  rationale: 希伯来语名词本身可有一定幅度，但句法将耶和华等同于 מִבְטַחוֹ，更自然地表示他所信赖、所倚靠的对象；脚注保留较直译的表达。
- issue: הַגֶּבֶר 的性别与代表性
  choice: 那人
  alternative: 那个人
  rationale: 保留原文阳性单数的形式，不额外扩大或限制其格言式适用范围。
translation_notes:
  register: 采用庄重而通顺的现代标准普通话。“信靠／倚靠”再现原文 בטח 与 מִבְטָח 的词根呼应；调整语序，使整句在中文中形成自然的主题结构。
