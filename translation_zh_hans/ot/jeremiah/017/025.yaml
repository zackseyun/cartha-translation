id: JER.17.25
reference: Jeremiah 17:25
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וּ/בָ֣אוּ בְ/שַׁעֲרֵ֣י הָ/עִ֣יר הַ/זֹּ֡את מְלָכִ֣ים וְ/שָׂרִ֡ים יֹשְׁבִים֩ עַל כִּסֵּ֨א דָוִ֜ד רֹכְבִ֣ים בָּ/רֶ֣כֶב וּ/בַ/סּוּסִ֗ים הֵ֚מָּה וְ/שָׂ֣רֵי/הֶ֔ם אִ֥ישׁ יְהוּדָ֖ה וְ/יֹשְׁבֵ֣י יְרוּשָׁלִָ֑ם וְ/יָשְׁבָ֥ה הָֽ/עִיר הַ/זֹּ֖את לְ/עוֹלָֽם׀־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/017/025.yaml
  text: then kings and officials will enter through the gates of this city[a], sitting on the throne of David, riding in chariots and on horses—they and their officials, the men of Judah and the inhabitants of Jerusalem—and this city will be inhabited forever.
translation:
  language: zh_hans
  text: 那么，君王和官员，就是坐在大卫宝座上、乘坐战车和骑着马的他们及其官员，以及犹大人[a]和耶路撒冷的居民，都必从这城的城门进来；这城必永远有人居住。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“犹大之人”，这里用作集合称谓。
    reason: 说明希伯来语阳性单数形式及其集合意义。
lexical_decisions:
- source_word: וּבָאוּ
  choice: 那么……必……进来
  rationale: 连词承接上一节的条件，表示其结果；“那么”自然地标明这一关系。“进来”也符合随后“从各门”的移动场景。
- source_word: בְשַׁעֲרֵי הָעִיר הַזֹּאת
  choice: 从这城的各门进来
  rationale: בוא与介词ב连用，在此表示经由城门进入；“各门”自然表达复数שַׁעֲרֵי。
- source_word: מְלָכִים וְשָׂרִים
  choice: 君王和官员
  rationale: מְלָכִים是复数“君王”；שָׂרִים泛指执政者、首领或宫廷官员，“官员”现代、宽泛，也不额外暗示世袭贵族身份。
- source_word: יֹשְׁבִים עַל כִּסֵּא דָוִד
  choice: 坐在大卫宝座上的君王
  rationale: 保留“坐在……宝座上”的王权意象和大卫王朝的明确指涉；补出“君王”使现代汉语指向清楚，同时避免让官员也被理解为坐在同一宝座上。
- source_word: רֹכְבִים בָּרֶכֶב וּבַסּוּסִים
  choice: 乘着战车和马
  rationale: “乘着”可自然统摄战车与马，保留两种王室出行方式；单数集合名词רֶכֶב按汉语习惯译为“战车”。
- source_word: הֵמָּה וְשָׂרֵיהֶם
  choice: 他们和他们的官员
  rationale: 保留强调性的代词及所属关系，也保留原文对שָׂרִים的重复。
- source_word: אִישׁ יְהוּדָה
  choice: 犹大人
  rationale: 字面为“犹大之人”，单数形式在这里作集合称谓；“犹大人”简洁自然，并借脚注说明其字面形式与集合用法。
- source_word: וְיֹשְׁבֵי יְרוּשָׁלָ͏ִם
  choice: 和耶路撒冷的居民
  rationale: 准确表达居住在耶路撒冷的群体，语体庄重而通行。
- source_word: וְיָשְׁבָה הָעִיר הַזֹּאת
  choice: 这城也必永远有人居住
  rationale: 城作יָשַׁב的主语时，意思是城持续有人居住；汉语用“有人居住”比直译为“城居住”自然。
- source_word: לְעוֹלָם
  choice: 永远
  rationale: 表达持续不止的状态，符合本段盟约福分的语境，同时不另行限定其神学含义。
theological_decisions:
- issue: “大卫宝座”的王朝含义
  choice: 保留“大卫宝座”的明确说法
  alternative: 大卫王朝的统治／合法的王权
  rationale: 原文直接使用大卫及其宝座的意象，具有王朝和盟约意义；译文不把它泛化，也不加入原文未明说的基督论解释。
- issue: אִישׁ יְהוּדָה的性别与集合用法
  choice: 正文译作“犹大人”，脚注交代字面为“犹大之人”且为集合用法
  alternative: 犹大的男人／犹大众人
  rationale: 希伯来语阳性单数在此具有集合意义。“犹大人”在现代汉语中既保留“人”的对应，也避免误解为仅有一个人；脚注使原文形式保持透明。
- issue: 谁坐在大卫宝座上
  choice: 在汉语中将“坐在大卫宝座上”明确联系于君王
  alternative: 让“君王和官员”共同受该分词短语修饰
  rationale: 就现实语义与王权惯用语而言，坐在大卫宝座上的是君王；同时正文仍完整保留官员随行的角色，不把此处扩展成额外的制度性主张。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以分号保留原文长句的行进感，并使君王、官员和居民的层次清楚；“必”体现预告语气，“有人居住”则按汉语习惯表达城持续繁盛的含义。
