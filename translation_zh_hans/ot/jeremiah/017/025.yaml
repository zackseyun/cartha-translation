revisions:
- from: 那么，君王和官员必从这城的各门进来；坐在大卫宝座上的君王乘着战车和马，他们和他们的官员，以及犹大人[a]和耶路撒冷的居民，都必进来；这城也必永远有人居住。
  to: 那么，君王和官员，就是坐在大卫宝座上、乘坐战车和骑着马的他们及其官员，以及犹大人[a]和耶路撒冷的居民，都必从这城的城门进来；这城必永远有人居住。
  rationale: 将“城的各门”改为“城的城门”，避免分配性过译；把所有列举对象归入同一“都必……进来”的主句，以对应原文单一的入城谓语；并将车马出行改为现代汉语更自然且语义清楚的“乘坐战车和骑着马”。“坐在大卫宝座上”的关系仍明确指向君王，符合其王权语义，也不加入额外神学解释。
