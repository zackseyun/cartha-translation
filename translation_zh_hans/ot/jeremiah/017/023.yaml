  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/לֹ֣א שָֽׁמְע֔וּ וְ/לֹ֥א הִטּ֖וּ אֶת אָזְנָ֑/ם וַ/יַּקְשׁוּ֙ אֶת עָרְפָּ֔/ם לְ/בִלְתִּ֣י שומע וּ/לְ/בִלְתִּ֖י קַ֥חַת מוּסָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/017/023.yaml
  text: But they did not listen[a], and they did not incline their ear[c][b], but stiffened their neck so as not to hear and not to accept discipline.
translation:
  language: zh_hans
  text: 可是，他们不听[a]，也不侧耳听；反而硬着颈项[b]，以便不听，也不接受管教[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “不听”也可译为“不听从”或“不顺从”。原词可指听见、留心听或顺从。
    reason: lexical_alternative
  - marker: b
    text: “硬着颈项”是希伯来语惯用语，表示顽固抗拒。
    reason: cultural_note
  - marker: c
    text: “管教”也可译为“训诲”或“纠正”。
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמְעוּ
  choice: 不听
  rationale: שׁמע可表示听见、听从或顺从。此处与“侧耳听”和拒绝接受管教并列，“不听”既保留听觉意象，也含有不肯理会的意味，而不直接强化为“不顺从”。
- source_word: הִטּוּ אֶת אָזְנָם
  choice: 侧耳听
  rationale: 原文直译为“使耳朵倾斜”，指留心聆听。“侧耳听”保留身体意象，在现代汉语中也自然易懂。
- source_word: וַיַּקְשׁוּ אֶת עָרְפָּם
  choice: 硬着颈项
  rationale: 保留希伯来语以颈项僵硬表达顽梗抗拒的身体隐喻；脚注说明其含义，避免正文改成纯解释性的“顽固不化”。
- source_word: לְבִלְתִּי שומע
  choice: 以致不听
  rationale: לְבִלְתִּי加动词形式表示否定的目的或结果。“以致不听”在汉语中顺畅，并把这里理解为其刚硬所导致的结果；脚注保留目的性译法。
- source_word: וּלְבִלְתִּי קַחַת מוּסָר
  choice: 也不接受管教
  rationale: קחת在此是“领受、接受”，מוּסָר兼有管教、纠正和训诲之意。“接受管教”保留先知责备语境中的纠正与塑造意味。
- source_word: מוּסָר
  choice: 管教
  rationale: 该词兼具教育和纠正的层面。“管教”比单纯的“教导”更能体现此处责备性的语境，同时没有把含义缩窄为惩罚。
theological_decisions:
- issue: 顽梗抗拒的身体隐喻
  choice: 保留“硬着颈项”
  alternative: 变得顽固／顽梗不化
  rationale: 原文的身体隐喻在先知书中具有反复出现的呼应，且汉语读者借助脚注可以理解；保留意象比直接释义更贴近原文。
- issue: שׁמע在先知责备中的语义力度
  choice: 译为“不听”
  alternative: 不听从／不顺从
  rationale: 上下文确实暗含拒绝回应，但原词和“侧耳”首先维持听觉图像；“不听”可兼有不理会之意，又不把隐含的顺从意义提升为正文中的明说。
- issue: לְבִלְתִּי所表达的目的或结果
  choice: 正文采用结果性的“以致”
  alternative: 目的性的“为的是”或“好叫”
  rationale: 该结构可表达目的或结果，语境也容许把不听视为刚硬的意图或后果。正文采用较自然的结果表达，并以脚注保留目的性理解，不消除原文张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。正文保留“侧耳”和“硬着颈项”两个原文身体意象；前者在现代汉语中可直接理解，后者以脚注解释。分号呈现前两项拒绝与随后顽梗行动之间的转折。“管教”保持先知责备中兼具纠正和教导的力度。
