  text: אַל תִּֽהְיֵה לִ֖/י לִ/מְחִתָּ֑ה מַֽחֲסִ/י אַ֖תָּה בְּ/י֥וֹם רָעָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/017/017.yaml
  text: Do not be a terror to me[b][a]; you are my refuge in the day of disaster.
translation:
  language: zh_hans
  text: 求你不要使我惊惶[a]；在灾祸[b]之日，你是我的避难所。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “惊惶”也可译作“恐怖”或“毁灭”；原文也可指使人惊惶的对象或根源。
    reason: lexical_alternative
  - marker: b
    text: 这里的“灾祸”指灾难或患难，不是道德意义上的邪恶。
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּהְיֵה
  choice: 求你不要成为
  rationale: 否定词与未完成式在此构成祈求。加入“求你”自然表达祷告语气；“成为”也保留 היה 可能含有的动态意味。
- source_word: לִי לִמְחִתָּה
  choice: 成为我的惊恐
  rationale: מְחִתָּה 可指惊恐、惶恐，也可延伸指崩毁或灾祸。“我的惊恐”在中文中简洁地表达“使我惊恐的对象或根源”，同时借脚注保留词义幅度。
- source_word: מַחֲסִי
  choice: 我的避难所
  rationale: מַחֲסֶה 指躲避危险的庇护之处；“避难所”是现代中文清楚、庄重且常用的对应。
- source_word: אַתָּה
  choice: 你是
  rationale: 独立代词带有强调意味；中文用“你是”自然保留直接称呼和强调。
- source_word: בְּיוֹם רָעָה
  choice: 在灾祸之日
  rationale: רָעָה 在此依语境指患难、灾祸，而非道德意义的邪恶；“灾祸之日”既准确又符合庄重的祷告语体。
theological_decisions:
- issue: רָעָה 应译为道德意义的“邪恶”，还是处境意义的“灾祸”
  choice: 灾祸
  alternative: 邪恶；患难；灾难
  rationale: 上下文说耶和华在危难之时作先知的避难所，因此这里主要指临到人的逆境或灾难。译作“灾祸”避免误解为道德之恶。
- issue: מְחִתָּה 是主观的惊恐，还是导致惊恐或毁灭的对象
  choice: 惊恐，并以脚注保留“使我惊惶的根源／毁灭”的可能
  alternative: 使我惊惶的根源；毁灭；可怕的对象
  rationale: 该名词具有惊恐、惊惶和崩毁等语义范围。正文不把它过度解释成单一因果关系，脚注则保存原文真实的词义张力。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语体。以“求你”显明原句的祈求功能；保留前后两分句的强烈对照：不要成为我的惊恐，因为你是我的避难所。所有脚注标记均置于相关正文词语之后。
