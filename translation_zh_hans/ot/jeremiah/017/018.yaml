  text: יֵבֹ֤שׁוּ רֹדְפַ/י֙ וְ/אַל אֵבֹ֣שָׁה אָ֔נִי יֵחַ֣תּוּ הֵ֔מָּה וְ/אַל אֵחַ֖תָּה אָ֑נִי הָבִ֤יא עֲלֵי/הֶם֙ י֣וֹם רָעָ֔ה וּ/מִשְׁנֶ֥ה שִׁבָּר֖וֹן שָׁבְרֵֽ/ם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/017/018.yaml
  text: Let my pursuers be put to shame[a], but let me not be put to shame; let them be dismayed, but let me not be dismayed. Bring upon them a day of disaster[c][b], and shatter them with double destruction.
translation:
  language: zh_hans
  text: 愿追赶我的人蒙羞[a]，却不要让我蒙羞；愿他们惊惶，却不要让我惊惶。求你使灾祸之日临到他们[b]，以双重的毁灭击碎他们[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“迫害我的人”。希伯来文直译为“追赶我的人”。
    reason: lexical_alternative
  - marker: b
    text: 或译“灾难之日”。这里指审判或败亡临到的日子，并非道德意义上的邪恶之日。
    reason: lexical_alternative
  - marker: c
    text: 直译“以双重的破碎击碎他们”。原文用同根词加强语气。
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵבֹשׁוּ / אֵבֹשָׁה
  choice: 蒙羞
  rationale: בושׁ可指遭受羞辱、落空或败露；“蒙羞”既保留外在受辱的意味，也与两处对称句式自然对应。
- source_word: רֹדְפַי
  choice: 追赶我的人
  rationale: 源自动词רדף，直指追赶、追逐者；此译保留具体动作意象，不预先将其限定为宗教意义上的“迫害者”。
- source_word: יֵחַתּוּ / אֵחַתָּה
  choice: 惊惶
  rationale: חתת的尼法勒式可表示被压垮、惊恐或丧胆；“惊惶”能表达内心崩溃与恐惧，并适合此处平行结构。
- source_word: הָבִיא עֲלֵיהֶם
  choice: 使……临到他们
  rationale: בוא的使役式与עַל搭配，表示使某事来到某人身上；该译准确保留向上帝发出的直接祈求。
- source_word: יוֹם רָעָה
  choice: 灾祸之日
  rationale: 此处רָעָה指灾难、祸患，而非道德上的邪恶；“灾祸之日”也保留审判临到之日的庄重表达。
- source_word: מִשְׁנֶה
  choice: 加倍的
  rationale: מִשְׁנֶה表示双倍或加倍的分量；“加倍的”在汉语中自然地强化后面的毁灭。
- source_word: שִׁבָּרוֹן
  choice: 毁灭
  rationale: 该名词可指破裂、崩毁或毁灭；在审判语境中，“毁灭”清楚表达其结果，同时脚注保留字面意象。
- source_word: שָׁבְרֵם
  choice: 击碎他们
  rationale: שׁבר意为打破、击碎；“击碎”保留强烈的破坏性比喻，并与同根名词שִׁבָּרוֹן相呼应。
theological_decisions:
- issue: 求上帝审判仇敌的咒诅性祈求
  choice: 按原文保留耶利米直接求上帝使仇敌蒙羞、惊惶并遭毁灭的强烈祈求
  alternative: 弱化为一般性的伸冤或保护请求
  rationale: 希伯来文以愿望式和命令式直接向上帝祈求；译文应保留先知寻求个人伸冤与神圣审判之间的神学张力，不淡化其严厉程度。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“愿……却不要……”保留两组鲜明的平行对照；末句用“击碎”保留原文强烈的破坏意象。所有脚注标记均置于相关正文之后。
