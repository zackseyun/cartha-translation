id: JER.17.9
reference: Jeremiah 17:9
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: עָקֹ֥ב הַ/לֵּ֛ב מִ/כֹּ֖ל וְ/אָנֻ֣שׁ ה֑וּא מִ֖י יֵדָעֶֽ/נּוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/017/009.yaml
  text: The heart is more deceitful than anything else[c][b][a], and desperately sick—who can know it?
translation:
  language: zh_hans
  text: 人心[a]比一切都诡诈[b]，而且病重难治[c]；谁能识透它呢？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里的“心”指人的内在生命，包括思想、意志和欲望，并非仅指情感。
    reason: cultural_note
  - marker: b
    text: 或译：“人心诡诈，胜过一切。”
    reason: lexical_alternative
  - marker: c
    text: 或译：“无可医治。”原文所用的词可形容病情危重或无法救治。
    reason: lexical_alternative
lexical_decisions:
- source_word: עָקֹב
  choice: 诡诈
  rationale: 该词表达欺骗、乖曲或阴险的性质；“诡诈”既保留道德意味，也比“复杂”更贴近原文。
- source_word: הַלֵּב
  choice: 人心
  rationale: 希伯来语“心”指人的内在核心，包括思想、意志和欲望，并不限于情感；“人心”是现代汉语中自然且有圣经语感的表达。
- source_word: מִכֹּל
  choice: 比一切都
  rationale: 介词 מִן 与“全部、一切”构成比较，表达“胜过一切”或“比任何事物更……”；此译法清楚保留比较和最高程度的语气。
- source_word: וְאָנֻשׁ
  choice: 而且病重难治
  rationale: אָנֻשׁ 可指病势严重、危重或无可医治。“病重难治”保留疾病隐喻及“难以救治”的力度，又不把含义完全限定为绝对无法医治。
- source_word: הוּא
  choice: 而且病重难治
  rationale: 原文代词回指“心”，汉语承前省略主语更自然，其述谓功能已由“而且病重难治”完整表达。
- source_word: מִי
  choice: 谁
  rationale: 直接译作“谁”，简洁保留原文反问的力量。
- source_word: יֵדָעֶנּוּ
  choice: 能识透它
  rationale: ידע 的基本义是“知道、认识”；在此语境中，“识透”自然表达彻底认识人心真实状况的意思，并保留反问语气。
theological_decisions:
- issue: “心”的人论含义
  choice: 保留“人心”，指人的整个内在生命
  alternative: 译作“思想”或“内在自我”
  rationale: 原文并非只谈情绪，也包括思想、意志和欲望。保留“心”可维持希伯来人论的整体性，脚注则防止现代读者把它窄化为感情。
- issue: אָנֻשׁ 的疾病隐喻
  choice: 译作“病重难治”
  alternative: 译作“邪恶透顶”或“无可医治”
  rationale: 原词首先采用严重疾病或难以医治的图像。译文不将这一张力改写为抽象的道德判断，也不武断排除“无可医治”这一可能含义。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“人心”保持经文传统意象；“比一切都诡诈”清楚表达希伯来语的比较结构；“病重难治”保留疾病隐喻和“难以医治／无可医治”之间的词义张力。
