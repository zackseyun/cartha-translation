  text: כִּסֵּ֣א כָב֔וֹד מָר֖וֹם מֵֽ/רִאשׁ֑וֹן מְק֖וֹם מִקְדָּשֵֽׁ/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/017/012.yaml
  text: A glorious throne[a], exalted from the beginning, is the place of our sanctuary.
translation:
  language: zh_hans
  text: 荣耀的宝座[a]，自起初就在高处，是我们圣所所在之处。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“荣耀的宝座，自起初高居于上，是我们圣所所在之处。”也可能作呼语：“荣耀的宝座啊，自起初高居于上，我们圣所所在之处！”希伯来文极为凝缩，可有不止一种句法理解。
    reason: alternative_reading
lexical_decisions:
- source_word: כִּסֵּא
  choice: 宝座
  rationale: 该词通常指君王的座位或施行统治的宝座；“宝座”保留了原文的王权意象与庄严色彩。
- source_word: כָבוֹד
  choice: 荣耀的
  rationale: 原文是“宝座”与“荣耀”的名词组合；汉语译作“荣耀的宝座”自然凝练，同时保留其尊荣、威严之意。
- source_word: מָרוֹם
  choice: 高高在上
  rationale: 该词与高度、高处有关；在这句高度压缩的无动词结构中，译为“高高在上”既可表达空间上的崇高，也保留尊贵、超越的意味。
- source_word: מֵרִאשׁוֹן
  choice: 从起初
  rationale: 该短语表示自最初之时而来，也可含久远之意；“从起初”直接保留其时间意义，不限定具体起点。
- source_word: מְקוֹם
  choice: 所在之处
  rationale: 基本义为“地方、所在”；结合后面的“我们的圣所”，译作“所在之处”符合现代汉语，同时没有扩充为原文未明说的“居所”。
- source_word: מִקְדָּשֵׁנוּ
  choice: 我们的圣所
  rationale: 该词指分别为圣的地方或圣所，词尾明确表示第一人称复数所属；“我们的圣所”简洁地保留了两方面信息。
theological_decisions:
- issue: 几个无动词短语之间的句法关系
  choice: 将“荣耀的宝座，从起初就高高在上”理解为主语及其描述，并以“是我们圣所所在之处”作名词性判断。
  alternative: 也可把“高处”直接修饰“宝座”，或把整句理解为对“荣耀的宝座”的呼语，后接“我们圣所所在之处”作为同位语。
  rationale: 希伯来文极为凝缩，没有明写系词，因而各短语之间存在不止一种合理组合。正文采用通顺且常见的认同式理解，脚注则保留其他句法可能，避免把神学意象过度确定化。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“高高在上”在此主要表达崇高与高处，并非现代语境中贬义的疏离感；全句保留原文诗性、无动词结构所产生的庄严与张力。
