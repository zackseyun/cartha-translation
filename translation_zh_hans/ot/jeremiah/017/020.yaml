id: JER.17.20
reference: Jeremiah 17:20
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/אָמַרְתָּ֣ אֲ֠לֵי/הֶם שִׁמְע֨וּ דְבַר יְהוָ֜ה מַלְכֵ֤י יְהוּדָה֙ וְ/כָל יְהוּדָ֔ה וְ/כֹ֖ל יֹשְׁבֵ֣י יְרוּשָׁלִָ֑ם הַ/בָּאִ֖ים בַּ/שְּׁעָרִ֥ים הָ/אֵֽלֶּה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/017/020.yaml
  text: And say to them[a], “Hear the word of Yahweh, you kings of Judah, and all Judah, and all the inhabitants of Jerusalem who enter through these gates.”
translation:
  language: zh_hans
  text: 你要对他们说：“犹大的众王、全犹大，以及所有从这些城门进来的耶路撒冷居民，你们要听雅威[a]的话。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文为四字神名 YHWH（יהוה），这里音译作“雅威”；传统上也常译作“耶和华”或以“上主”代称。
    reason: 说明神名的原文形式、正文音译及传统替代译法。
lexical_decisions:
- source_word: וְאָמַרְתָּ אֲלֵיהֶם
  choice: 你要对他们说
  rationale: 承接上一节的先知指令；用“要……说”表达带连接词的完成式在此所具有的连续命令功能，同时保持现代汉语自然。
- source_word: שִׁמְעוּ
  choice: 你们要听
  rationale: 复数祈使式，向后列出的全部听众发出郑重的先知性召唤；“听”保留原文兼有聆听与留心服从的力度，不扩译为单一含义。
- source_word: דְבַר יְהוָה
  choice: 雅威的话
  rationale: 保留先知书中“雅威的话”这一固定表达及其神学分量；“话”比“信息”更直接对应 דָּבָר。
- source_word: יְהוָה
  choice: 雅威
  rationale: 将四字神名按其常见学术重构音译为“雅威”，保留原文使用专名而非称号这一特点。
- source_word: מַלְכֵי יְהוּדָה
  choice: 犹大的众王
  rationale: 复数构词，作为直接称呼；“众王”保留复数，不擅自解释为单数君王、王室成员或官员。
- source_word: וְכָל יְהוּדָה
  choice: 全犹大
  rationale: 保留原文以地名代指全体人民或国土群体的简洁表达，不补入原文没有的“百姓”。
- source_word: וְכֹל יֹשְׁבֵי יְרוּשָׁלִָם
  choice: 所有……耶路撒冷居民
  rationale: 分词 יֹשְׁבֵי 表示居住者；“居民”准确、庄重且符合现代汉语。
- source_word: הַבָּאִים בַּשְּׁעָרִים הָאֵלֶּה
  choice: 从这些城门进来的
  rationale: 关系分句修饰就近的“耶路撒冷居民”；运动动词与介词 בְּ 连用，在此自然表达经由城门进入。补出“城”以明确这是城市的门。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用以色列上帝的四字神名，而非“主”这一称号。“雅威”以音译方式保留专名性质；脚注说明其他传统译法，避免把有争议的发音问题隐藏起来。
- issue: “全犹大”的指涉
  choice: 保留“全犹大”这一转喻表达
  alternative: 犹大全体百姓
  rationale: 原文可借地名指其人民，但没有明说“百姓”；正文保留原文的简洁与一定张力，不将转喻完全解释化。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。为使长句清楚，将呼语“犹大的众王、全犹大……”置于命令“你们要听”之前；信息结构有所调整，但各成分及其关系均予保留。脚注标记紧随其实际说明的“雅威”，而不沿用英文咨询层中位置与内容不对应的标记。
