base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/017/010.yaml
  text: I[a], Yahweh, search the heart[b], testing the kidneys, to give to each man according to his way, according to the fruit of his deeds.
translation:
  language: zh_hans
  text: 我—耶和华，鉴察人心，察验人的肺腑[a]，为要按各人的道路，按他行为的果子，给予各人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“肾脏”；在希伯来表达中，这一身体部位可指人最深处的思想和情感。
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 用现代中文最通行的圣名音译“耶和华”，明确保留专名，不以“主”这一称号代替。
- source_word: חֹקֵר לֵב
  choice: 鉴察人心
  rationale: “鉴察”表达深入而持续的查究；“心”保留希伯来人论中思想、意志与内在生命的整体意象。原文“心”为单数泛指，中文加“人”使表达自然。
- source_word: בֹּחֵן כְּלָיוֹת
  choice: 试验人的肺腑
  rationale: “试验”保留评估、检验之意；“肺腑”是现代中文仍可理解的身体意象，也能自然表示最深处的思想与情感，比直译“肾脏”更符合庄重经文语体。
- source_word: וְלָתֵת
  choice: 报应他
  rationale: לָתֵת字面为“给予”，但在按道路和行为施行审判的语境中，中文“报应”准确表达照人的行为给予相应结果；脚注提示其字面形式，避免掩盖原文。
- source_word: לְאִישׁ
  choice: 各人……他
  rationale: 原文是阳性单数，具有代表性和分配性；“各人”自然传达“每一个人”，随后用“他”保留单数指代。
- source_word: כדרכו
  choice: 按各人所行的道路
  rationale: 保留“道路”这一人生行径的隐喻；加入“所行的”使现代汉语读者清楚其指生活方式和行为道路。
- source_word: כפרי מעלליו
  choice: 照他行为所结的果子
  rationale: 保留“果子”的生动隐喻，表明人的行为产生相应结果；“行为”传达מַעֲלָלִים所含道德分量。
theological_decisions:
- issue: 神对人内在生命的鉴察
  choice: 保留“心”和“肺腑”两个具体的人体意象
  alternative: 译为“内心”和“思想感情”
  rationale: 原文以身体部位描绘耶和华对人的思想、意志和最深情感的彻底认识。保留双重意象可避免把古希伯来人论直接改写成现代心理学术语。
- issue: וְלָתֵת所表达的审判关系
  choice: 正文译作“报应他”，脚注说明字面为“给予”
  alternative: 直译为“给予各人”
  rationale: 上下文明确是神按人的道路和行为之果施予相应结果。“报应”在此不预先限定结果只为惩罚，仍可涵盖与行为相称的回报。
- issue: לְאִישׁ的代表性阳性单数
  choice: 译为“各人”，并以“他”作单数回指
  alternative: 译为“每一个男人”
  rationale: 这里的阳性单数具有泛指每个人的代表作用，并非把审判范围限于男性；“各人”准确传达范围，“他”则保留原文单数结构。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“鉴察”“肺腑”“道路”“果子”保留经文的诗性与希伯来意象；句式简洁，适合公开诵读。所有脚注标记均已置于正文相应位置。
