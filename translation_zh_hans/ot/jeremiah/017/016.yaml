source:
  edition: WLC
  text: וַ/אֲנִ֞י לֹא אַ֣צְתִּי מֵ/רֹעֶ֣ה אַחֲרֶ֗י/ךָ וְ/י֥וֹם אָנ֛וּשׁ לֹ֥א הִתְאַוֵּ֖יתִי אַתָּ֣ה יָדָ֑עְתָּ מוֹצָ֣א שְׂפָתַ֔/י נֹ֥כַח פָּנֶ֖י/ךָ הָיָֽה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/017/016.yaml
  text: But as for me[a], I did not hurry away from being a shepherd after you, and I did not desire the day of disaster; you know. What came from my lips was before your face.
translation:
  language: zh_hans
  text: 至于我，我并没有急着放弃作跟随你的牧人；那灾祸的日子，我也没有盼望过[a]。你知道：我嘴唇所出的，都在你面前。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “灾祸的日子”也可译作“悲惨的日子”或“无可医治的日子”。原文用的是形容重病、严重或无可医治的词，在这里可能指灾难或审判临到的日子。
    reason: 说明יוֹם אָנושׁ的字面意象及其语境义，保留真实的词义范围。
lexical_decisions:
- source_word: אַצְתִּי
  choice: 急着离开
  rationale: אוץ有“催促、赶紧、急速”的意思；与מִן结构连用时，这里可理解为没有匆忙退出或逃离所承担的角色。“急着离开”保留动作感，也不过度解释为“退缩”。
- source_word: מֵרֹעֶה אַחֲרֶיךָ
  choice: 不再跟随你作牧人
  rationale: רֹעֶה直译为“牧人”，אַחֲרֶיךָ为“在你后面、跟随你”。此译保留牧人意象，并用现代汉语清楚表达跟随上主履行此职分之意。
- source_word: יוֹם אָנ֛וּשׁ
  choice: 灾祸的日子
  rationale: אָנושׁ本有“病重、无可医治、严重”的含义，修饰“日子”时指 grievous day，即带来严重灾难或审判的日子。直译“患病的日子”在现代汉语中容易被误解为个人生病，故正文按语境译为“灾祸的日子”，脚注保留原词意象。
- source_word: הִתְאַוֵּיתִי
  choice: 没有盼望过
  rationale: אוה的Hitpael表达渴望、切望。这里否认自己期盼灾祸临到；“盼望”在汉语中自然地传达对未来之日的期待，同时不把动机解释得更强。
- source_word: מוֹצָא שְׂפָתַי
  choice: 我嘴里所说的
  rationale: 该短语字面为“从我嘴唇出来的”，即所说的话。译文采用自然汉语，同时保留话语从口而出的基本含义。
- source_word: נֹכַח פָּנֶיךָ
  choice: 在你面前
  rationale: 字面为“在你脸面之前”，惯用义是在某人面前或临在中。“在你面前”既自然，也保留直接面对上主的意味。
- source_word: אַתָּה יָדָעְתָּ
  choice: 你知道
  rationale: 形式上为完成式，但在直接呼告中表达上主现今确知此事；汉语用“你知道”最自然。
theological_decisions:
- issue: רֹעֶה作为耶利米自述的隐喻意义
  choice: 保留“牧人”，并译作“跟随你作牧人”
  alternative: 不再跟随你作先知；没有退缩，不再牧养
  rationale: 原文明确使用牧人意象，却未直接使用“先知”或后世教会职称。保留“牧人”可避免把隐喻收窄为某一制度性职分，也保留耶利米在上主之后引导、警戒百姓的张力。
- issue: יוֹם אָנושׁ所指的灾难或审判
  choice: 正文译为“灾祸的日子”
  alternative: 患病的日子；无可医治的日子；悲惨的日子
  rationale: 该表达很可能指百姓将遭遇的严重灾难或审判，但原文没有在此明确界定具体事件。译作“灾祸”传达语境意义，同时不额外指定历史事件或系统神学含义。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“至于我”保留原文强调性的转折；“不再跟随你作牧人”使מִן结构在汉语中可理解，同时保留“牧人”和“跟随你”两个原文要素。分句标点体现“你知道”既可承接前述自辩，也可引出上主对其言语的察知。
