reference: Jeremiah 17:26
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וּ/בָ֣אוּ מֵ/עָרֵֽי יְ֠הוּדָה וּ/מִ/סְּבִיב֨וֹת יְרוּשָׁלִַ֜ם וּ/מֵ/אֶ֣רֶץ בִּנְיָמִ֗ן וּ/מִן הַ/שְּׁפֵלָ֤ה וּ/מִן הָ/הָר֙ וּ/מִן הַ/נֶּ֔גֶב מְבִאִ֛ים עוֹלָ֥ה וְ/זֶ֖בַח וּ/מִנְחָ֣ה וּ/לְבוֹנָ֑ה וּ/מְבִאֵ֥י תוֹדָ֖ה בֵּ֥ית יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/017/026.yaml
  text: And they will come from the cities of Judah and from the areas around Jerusalem[a], and from the land of Benjamin, and from the lowland, and from the hill country, and from the Negeb, bringing burnt offerings and sacrifices, grain offerings and frankincense[c][b], and bringing thank offerings to the house of Yahweh.
translation:
  language: zh_hans
  text: 人们必从犹大的各城、耶路撒冷周围、便雅悯地、低地[a]、山地和南地[b]前来，带着燔祭、祭牲、素祭和乳香，又带着感恩祭，来到耶和华的殿[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “低地”即示非拉，是犹大山地西面的丘陵地带。
    reason: geographical_note
  - marker: b
    text: “南地”也可译作“南方”；这里指犹大南部的内盖夫地区。
    reason: lexical_alternative
  - marker: c
    text: “耶和华的殿”指圣殿；希伯来语直译为“耶和华的家”。
    reason: cultural_note
lexical_decisions:
- source_word: וּבָאוּ
  choice: 人们必……前来
  rationale: 在先知性条件语境中，以将来表达承接前文的结果；补出“人们”使现代汉语自然，但不限定具体群体。
- source_word: מֵעָרֵי יְהוּדָה
  choice: 从犹大的各城
  rationale: עָרֵי为复数，指犹大境内的城镇；“各城”简洁地表达其分布性。
- source_word: וּמִסְּבִיבוֹת יְרוּשָׁלַם
  choice: 耶路撒冷周围
  rationale: סְבִיבוֹת指周边地区；此译法自然且不增加范围上的限定。
- source_word: וּמֵאֶרֶץ בִּנְיָמִן
  choice: 便雅悯地
  rationale: אֶרֶץ在此指便雅悯支派的地域，而非泛指大地。
- source_word: הַשְּׁפֵלָה
  choice: 低地
  rationale: 这是犹大山地以西的特定地理区域；正文直译其含义，脚注补充专名。
- source_word: הָהָר
  choice: 山地
  rationale: 定冠词单数形式在地理列表中指犹大的山地区域，并非某一座山。
- source_word: הַנֶּגֶב
  choice: 南地
  rationale: 该词既有“南方”之义，也是犹大南部地区的名称；“南地”兼顾方位含义和地名性质。
- source_word: מְבִאִים
  choice: 带着
  rationale: 分词说明人们前来时所携带的祭物；“带着”符合汉语叙述习惯。
- source_word: עוֹלָה
  choice: 燔祭
  rationale: 指全部焚烧献上的祭，是中文圣经语域中清楚而准确的礼仪术语。
- source_word: זֶבַח
  choice: 祭牲
  rationale: 指宰杀献上的祭物；译为“祭牲”可与作为祭礼类别的“燔祭”“素祭”区分。
- source_word: מִנְחָה
  choice: 素祭
  rationale: 在献祭清单中指以谷物等献上的祭；采用现代读者仍可辨识的传统礼仪术语。
- source_word: לְבוֹנָה
  choice: 乳香
  rationale: 该词特指乳香，不泛化为一般的香。
- source_word: וּמְבִאֵי תוֹדָה
  choice: 又带着感恩祭
  rationale: תוֹדָה在献祭语境中指表达感谢的祭；保留重复的“带来”及其与前一组祭物的轻微句法区分。
- source_word: בֵּית יְהוָה
  choice: 耶和华的殿
  rationale: 字面为“耶和华的家”，在此指圣殿；“殿”自然表达其敬拜场所含义。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用四字神名。正文以现代中文读者最熟悉、并作为专名使用的“耶和华”呈现，不以“主”取代神名；“雅威”是另一种更接近学界拟音的译法。
- issue: תוֹדָה 是一般感谢还是祭物名称
  choice: 感恩祭
  alternative: 感谢
  rationale: 本节列举带到圣殿的祭物，语境支持将תוֹדָה理解为感恩祭；同时不进一步规定其具体礼仪形式。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。地理名单保持原文次序和平行结构；献祭术语使用通行且准确的中文表达，并用脚注说明不易从正文看出的地域与文化信息。
