base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/017/004.yaml
  text: And you[a] yourself will let go of your inheritance that I gave you, and I will make you serve your enemies in a land that you have not known; for you have kindled a fire in my anger[d][c][b]—it will burn forever.
translation:
  language: zh_hans
  text: 你自己必放弃我赐给你的产业[a]；我必使你在你素不熟悉的土地上服侍你的仇敌。因为你们[b]点燃了我怒气[c]中的火；这火必燃烧到永远[d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你必松开、不再持守我赐给你的产业。”希伯来语动词含有松开、放下或舍弃的形象。
    reason: lexical_alternative
  - marker: b
    text: 希伯来原文在这里由单数“你”转为复数“你们”，可能是从人格化的犹大转向全体民众。
    reason: alternative_reading
  - marker: c
    text: 或译：“烈怒。”原文直译为“在我的鼻子中”；“鼻子”在希伯来语中可作为愤怒的惯用表达。
    reason: lexical_alternative
  - marker: d
    text: 也可理解为“直到久远”或“长久不息”。希伯来语 עוֹלָם 可按语境表示永远、久远或无定限的时期。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁמַטְתָּה וּבְךָ
  choice: 你自己必放弃
  rationale: שׁמט有松手、放开、 relinquish之意；结合产业受审判而失去的语境，“放弃”在现代汉语中自然清楚。“你自己”体现וּבְךָ在此较可能具有的强调作用，同时不把它硬译为工具意义。
- source_word: מִנַּחֲלָתְךָ אֲשֶׁר נָתַתִּי לָךְ
  choice: 我赐给你的产业
  rationale: נחלה既指承受之业，也特别指上帝所赐的土地；“产业”能保留其土地和盟约承受物的双重意味。
- source_word: וְהַעֲבַדְתִּיךָ אֶת אֹיְבֶיךָ
  choice: 我必使你……服侍你的仇敌
  rationale: עבד的使役式表达“使某人服侍”；此译保留审判与被迫臣服的含义，而不额外强化为“沦为奴隶”。
- source_word: בָּאָרֶץ אֲשֶׁר לֹא יָדָעְתָּ
  choice: 在素不认识的地方
  rationale: ידע在此表示熟悉或经历过；“素不认识”自然表达从未熟悉之意。אָרֶץ可指土地、地域或国家，此处译作“地方”保留一定范围弹性。
- source_word: אֵשׁ קְדַחְתֶּם
  choice: 你们点燃了火
  rationale: קדח表示点燃、引燃；译文保留火的意象，并以“你们”呈现希伯来文由单数转为复数的变化。
- source_word: בְּאַפִּי
  choice: 在我的怒气中
  rationale: אַף字面为鼻子或鼻孔，在此是表示愤怒的希伯来语惯用法；“怒气”符合现代汉语表达。
- source_word: עַד עוֹלָם תּוּקָד
  choice: 这火必燃烧到永远
  rationale: תּוּקָד回指前面的火，表示它将继续燃烧；עַד עוֹלָם表达持久、无定限的时段，正文采用力度明确的“到永远”。
theological_decisions:
- issue: 第二人称由单数转为复数
  choice: 前半句用单数“你”，指人格化的犹大；指控时保留复数“你们”
  alternative: 全文统一译成单数或复数
  rationale: 希伯来文本身在קְדַחְתֶּם处明确转为复数。保留这一变化，可呈现先向犹大整体说话、继而向民众集体发出指控的修辞张力，而不擅自整齐化。
- issue: עַד עוֹלָם在审判话语中的时长
  choice: 译为“到永远”
  alternative: 译为“长久”“直到久远”或“不断”
  rationale: 此处措辞表达持续而无明确终点的审判；正文保留其强烈、开放式的永续表达，同时由脚注说明该词可依语境表示久远或无定限的时期。
translation_notes:
  register: 采用庄重而通顺的现代标准普通话。“产业”延续圣经语境中土地与承受之业的含义；“素不认识”简洁表达陌生异地。标点将审判结果分成两个相连句子，避免过长，同时保留因果关系和火的连续意象。
