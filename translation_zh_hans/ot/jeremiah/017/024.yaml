  text: וְ֠/הָיָה אִם שָׁמֹ֨עַ תִּשְׁמְע֤וּ/ן אֵלַ/י֙ נְאֻם יְהוָ֔ה לְ/בִלְתִּ֣י הָבִ֣יא מַשָּׂ֗א בְּ/שַׁעֲרֵ֛י הָ/עִ֥יר הַ/זֹּ֖את בְּ/י֣וֹם הַ/שַּׁבָּ֑ת וּ/לְ/קַדֵּשׁ֙ אֶת י֣וֹם הַ/שַּׁבָּ֔ת לְ/בִלְתִּ֥י עֲשֽׂוֹת ב/ה כָּל מְלָאכָֽה־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/017/024.yaml
  text: And it shall be[a], if you truly listen to me, declares Yahweh, by not bringing a load through the gates of this city on the Sabbath day, and by keeping the Sabbath day holy, by not doing any work on it[b],
translation:
  language: zh_hans
  text: 如果你们切实听从我[a]——雅威宣告——不在安息日经这城的城门搬运担子[b]，并且守安息日为圣，不在这日做任何工，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“听，确实听”，用同一动词的重复结构加强语气；在这里也含有听而遵行的意思。
    reason: lexical_alternative
  - marker: b
    text: “担子”也可译作“重担”或“负载”；这里指安息日经城门搬运的载物。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה אִם
  choice: 事情将会是这样：你们若
  rationale: 保留表示后续结果的引入语和条件结构；本节只有条件句，结果延续到下一节，因此以逗号收束，不擅自补出结果。
- source_word: שָׁמֹעַ תִּשְׁמְעוּן אֵלַי
  choice: 切实听从我
  rationale: 希伯来语以不定式绝对形配合限定动词加强语气；“听从”兼顾聆听与顺服的含义，“切实”表达其强调作用。
- source_word: נְאֻם יְהוָה
  choice: 雅威宣告
  rationale: 以庄重而自然的先知公式表达 נְאֻם，并将四字神名按其专名音译为“雅威”。
- source_word: לְבִלְתִּי הָבִיא מַשָּׂא בְּשַׁעֲרֵי הָעִיר הַזֹּאת
  choice: 不从这城的各门运进担子
  rationale: הביא 表示带来或运进；מַשָּׂא 在本段语境中指经城门搬运的实物担子，不先限定为商品。
- source_word: וּלְקַדֵּשׁ אֶת יוֹם הַשַּׁבָּת
  choice: 并且守安息日为圣
  rationale: “守……为圣”自然表达将该日分别为圣、按圣日对待的含义，也保留与前后不定式结构的并列关系。
- source_word: לְבִלְתִּי עֲשׂוֹת בָּהּ כָּל מְלָאכָה
  choice: 不在这日做任何工
  rationale: 明确代词所指为安息日，并以“任何工”自然对应 כָּל מְלָאכָה。
theological_decisions:
- issue: שׁמע 在盟约语境中是译作“听”还是“顺服”
  choice: 听从
  alternative: 听；顺服
  rationale: “听从”保留听闻的词汇形象，同时传达该语境所要求的实际遵行；脚注说明原文的强调表达，避免把两层含义割裂。
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；采用“雅威”作为现代汉语音译，不以称号替代专名，也不引入特定宗派解释。
- issue: 安息日为圣的表达
  choice: 守安息日为圣
  alternative: 使安息日成圣；把安息日分别为圣
  rationale: 这里的命令是把安息日当作圣日遵守；“守……为圣”既避免暗示人使该日本体获得圣性，也不削弱实际分别为圣的要求。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“雅威宣告”以破折号嵌入，保留先知宣告公式而不打断条件句。经文的条件句要到下一节才出现结果，因此本节末保留逗号，避免把跨节句法误改成完整句。
