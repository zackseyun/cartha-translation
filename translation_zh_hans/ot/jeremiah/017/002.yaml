  text: כִּ/זְכֹּ֤ר בְּנֵי/הֶם֙ מִזְבְּחוֹתָ֔/ם וַ/אֲשֵׁרֵי/הֶ֖ם עַל עֵ֣ץ רַֽעֲנָ֑ן עַ֖ל גְּבָע֥וֹת הַ/גְּבֹהֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/017/002.yaml
  text: As their children remember their altars and their Asherim beside every green tree[a], on the high hills,
translation:
  language: zh_hans
  text: 正如他们的儿女记得他们的祭坛和亚舍拉——在每一棵青翠的树旁，在高高的山冈上。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּזְכֹּר
  choice: 还记得
  rationale: זכר意为“记得、想起”；这里的形式与כִּי相连，引出承接上文的说明或情状。汉语用“还记得”自然表达这种延续关系，同时不把כִּי强行限定为单一的因果含义。
- source_word: בְּנֵיהֶם
  choice: 他们的儿女
  rationale: בנים既可专指“儿子”，也可泛指“儿女、后代”；此处用“儿女”较自然，也避免不必要地限于男性。
- source_word: מִזְבְּחוֹתָם
  choice: 他们的祭坛
  rationale: מזבחות指用于祭祀的坛；保留复数和所属关系。
- source_word: וַאֲשֵׁרֵיהֶם
  choice: 他们的亚舍拉
  rationale: אֲשֵׁרִים是与亚舍拉相关的崇拜物，具体形制未必能确定。正文保留音译，不直接限定为木柱、神像或树木，并以脚注说明。
- source_word: עַל עֵץ רַעֲנָן
  choice: 在青翠的树旁
  rationale: עַל在地点语境中可表示靠近、旁边；עֵץ רַעֲנָן指枝叶繁茂、青翠的树。用“树旁”避免误解为祭坛实际放在树顶。
- source_word: עַל גְּבָעוֹת הַגְּבֹהוֹת
  choice: 高高的山冈上
  rationale: 直译其高处位置，并保留这些崇拜场所设于山冈之上的意象。
theological_decisions:
- issue: אֲשֵׁרִים在偶像崇拜语境中的译法
  choice: 亚舍拉
  alternative: 亚舍拉柱；神木；圣柱
  rationale: 该词可指与女神亚舍拉有关的崇拜物，常被理解为木柱或树木一类的对象，但具体所指仍有争议。正文采用音译以保留歧义，脚注提供解释和可选译法。
translation_notes:
  register: 采用庄重而易懂的现代汉语。“还记得”承接上文，“青翠的树旁、高高的山冈上”保持原文的崇拜地点意象。为使汉语关系清楚，以“它们立在”连接地点短语；这表达祭坛和亚舍拉与这些地点的关联，不进一步界定其具体摆放方式。
