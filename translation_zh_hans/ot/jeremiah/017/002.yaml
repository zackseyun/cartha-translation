revisions:
- from: 他们的儿女还记得他们的祭坛和亚舍拉[a]，它们立在青翠的树旁、高高的山冈上。
  to: 正如他们的儿女记得他们的祭坛和亚舍拉——在每一棵青翠的树旁，在高高的山冈上。
  rationale: 删去原文没有的“它们立在”，以破折号引出地点短语，保留这些短语在希伯来文中较松动的修饰关系，而不武断判定其只修饰物件或只修饰“记得”。“正如”对应承接上文的כִּי；“每一棵青翠的树”和“高高的山冈”保留原文的集合性与高地崇拜意象。
