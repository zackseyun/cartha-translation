  source_fidelity: 草稿准确保留了“儿女／祭坛／亚舍拉”和两类崇拜地点，但加入“它们立在”并非希伯来文本明说；这既增添了一个存在／竖立的断言，也将地点明确限定为祭坛和亚舍拉的物理位置，超过原文较为松动的句法关系。
  naturalness: 原译整体通顺，但“它们立在青翠的树旁、高高的山冈上”中“它们”所指略显生硬，且“树旁、高高的山冈上”的并列不够整齐。修订后保留经文与上节相连的从属、说明性语气，同时以自然的现代汉语呈现地点短语。
  terminology: “祭坛”和“亚舍拉”适切。“亚舍拉”保留了אֲשֵׁרִים究竟是何种崇拜物的争议，脚注宜说明其为与亚舍拉有关的崇拜物，并给出“亚舍拉柱／圣柱”等可能译法；“神木”可能过早把具体形制限定为树木，故不列为主要替代译法。
