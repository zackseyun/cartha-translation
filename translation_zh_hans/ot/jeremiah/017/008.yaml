id: JER.17.8
reference: Jeremiah 17:8
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/הָיָ֞ה כְּ/עֵ֣ץ שָׁת֣וּל עַל מַ֗יִם וְ/עַל יוּבַל֙ יְשַׁלַּ֣ח שָֽׁרָשָׁ֔י/ו וְ/לֹ֤א ירא כִּֽי יָבֹ֣א חֹ֔ם וְ/הָיָ֥ה עָלֵ֖/הוּ רַֽעֲנָ֑ן וּ/בִ/שְׁנַ֤ת בַּצֹּ֨רֶת֙ לֹ֣א יִדְאָ֔ג וְ/לֹ֥א יָמִ֖ישׁ מֵ/עֲשׂ֥וֹת פֶּֽרִי׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/017/008.yaml
  text: He will be like a tree planted by water[a], that sends out its roots by a stream; it does not fear when heat comes, and its leaf remains green. In a year of drought it is not anxious[b], and it does not cease from bearing fruit.
translation:
  language: zh_hans
  text: 他必像一棵栽在水边的树，把根伸向水道[a]；炎热来到时，它并不惧怕[b]，叶子仍然青翠[c]。在干旱之年，它也不忧虑，也不停止结果子。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “水道”也可译作“溪流”或“水渠”。原词可指天然或人工的流水通道。
    reason: lexical_alternative
  - marker: b
    text: “并不惧怕”按原文辅音通常的含义翻译；另有读法作“看不见”或“不察觉炎热来到”。
    reason: textual_ambiguity
  - marker: c
    text: “青翠”原词兼有鲜润、茂盛的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּעֵץ שָׁתוּל
  choice: 像一棵栽……的树
  rationale: 保留比较结构和被动分词所表达的刻意栽植之意；现代汉语自然简洁。
- source_word: עַל מַיִם
  choice: 在水边
  rationale: 此处 עַל 表示临近水源；“在水边”比直译“在水上”准确自然。
- source_word: יוּבַל
  choice: 水道
  rationale: 该词可指溪流、河道或水渠；“水道”既保留其流动水道的核心意义，也不武断限定为天然或人工。
- source_word: יְשַׁלַּח שָׁרָשָׁיו
  choice: 把根伸向
  rationale: שׁלח 的加强语干在此描绘根向外延伸；“伸向”符合汉语植物意象，也保留方向感。
- source_word: לֹא ירא
  choice: 并不惧怕
  rationale: 按 consonantal form ירא 的通常词义译为“惧怕”，延续树被人格化的形象；同时用脚注交代另一种传统理解。
- source_word: כִּי יָבֹא חֹם
  choice: 炎热来到时
  rationale: כִּי 在上下文中作时间关系理解；保留“炎热来到”的生动表达。
- source_word: עָלֵהוּ רַעֲנָן
  choice: 叶子仍然青翠
  rationale: רַעֲנָן兼有鲜润、茂盛和青绿之意；“仍然青翠”自然表达炎热中持续鲜活的状态。
- source_word: וּבִשְׁנַת בַּצֹּרֶת
  choice: 在干旱之年
  rationale: 保留原文“年”的时间单位与旱灾背景，措辞简洁庄重。
- source_word: לֹא יִדְאָג
  choice: 也不忧虑
  rationale: דאג 表示忧虑、焦灼；“忧虑”与前面的“惧怕”既相关又不完全重复。
- source_word: לֹא יָמִישׁ מֵעֲשׂוֹת פֶּרִי
  choice: 也不停止结果子
  rationale: 准确表达 מוּשׁ 配合介词 מן 和不定式所表示的“不离开、不停止某行动”，没有强化为绝对性的“永远不断”。
theological_decisions:
- issue: 树在炎热来到时的反应：惧怕或看见
  choice: 并不惧怕
  alternative: 看不见／不察觉炎热来到
  rationale: WLC 所呈现的辅音 ירא 最直接可按“惧怕”理解，并与后文“不忧虑”形成平行；但相关读法可联系“看见”，故不在正文中消除这种文本与释读张力，而以脚注说明。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。正文保留希伯来诗句中拟人化的树，以及“惧怕—忧虑”“炎热—干旱”“青翠—结果”的平行意象；避免过度古雅或把水道限定为天然溪流。
