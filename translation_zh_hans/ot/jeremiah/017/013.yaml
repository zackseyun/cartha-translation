  text: מִקְוֵ֤ה יִשְׂרָאֵל֙ יְהוָ֔ה כָּל עֹזְבֶ֖י/ךָ יֵבֹ֑שׁוּ יסור/י בָּ/אָ֣רֶץ יִכָּתֵ֔בוּ כִּ֥י עָזְב֛וּ מְק֥וֹר מַֽיִם חַיִּ֖ים אֶת יְהוָֽה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/017/013.yaml
  text: O Yahweh[a], the hope of Israel, all who forsake you will be put to shame; those who turn away from you will be written in the earth, because they have forsaken Yahweh[c][b], the fountain of living waters.
translation:
  language: zh_hans
  text: 耶和华啊，你是以色列的盼望；凡离弃你的，都必蒙羞；离开我的人必被写在地上[a]，因为他们离弃了活水的泉源——耶和华[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “离开我的人”也可译作“离开你的人”。这里的希伯来文本读法困难；正文保留马所拉文本所呈现的第一人称。“写在地上”也可译作“记在这地”；这图景可能暗示名字像地上的字迹一样不能长存。
    reason: textual_variant; lexical_alternative
  - marker: b
    text: “活水”指从泉源涌出、流动的新鲜水，不是停滞的水。
    reason: cultural_note
lexical_decisions:
- source_word: מִקְוֵה יִשְׂרָאֵל
  choice: 以色列的盼望
  rationale: מִקְוֵה在这里用作耶和华的称号，取“所盼望者、盼望”之意；译为“以色列的盼望”自然且保留呼语结构。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代汉语中通行的专名“耶和华”译出四字神名，而不以称号替代。
- source_word: עֹזְבֶיךָ
  choice: 凡离弃你的
  rationale: 分词表示具有这种行为或特征的人；“离弃”保留其关系与盟约语境中的强烈意味。
- source_word: יֵבֹשׁוּ
  choice: 都必蒙羞
  rationale: 该动词在审判语境中表达遭受羞辱、希望落空的结果；“蒙羞”比单纯内在的“惭愧”更贴切。
- source_word: יסורי
  choice: 那些离弃我的人
  rationale: 依马所拉文本所保留的第一人称读法处理；选用“离弃”与上句形成自然平行，同时不消除人称转换造成的文本张力。
- source_word: בָּאָרֶץ יִכָּתֵבוּ
  choice: 名字必写在尘土中
  rationale: 被动式直译为“必写”；汉语补出语义隐含的“名字”，并以“尘土”传达写在地面、容易消逝的意象。
- source_word: מְקוֹר מַיִם חַיִּים
  choice: 活水的泉源
  rationale: מְקוֹר指泉源；“活水”既保留字面隐喻，也在汉语中自然表达新鲜流动之水。
theological_decisions:
- issue: “离弃我的人”中的说话者人称
  choice: 正文保留第一人称“我的”
  alternative: 那些离弃你的人
  rationale: 希伯来文本此处存在抄读困难，但马所拉传统支持第一人称。保留人称转换，不将其与前文第二人称称呼强行协调，可保存先知作为上帝代表发言或上帝直接插话的张力。
- issue: 耶和华与“活水的泉源”的关系
  choice: 译作“活水的泉源——耶和华”
  alternative: 他们离弃了耶和华，就是活水的泉源
  rationale: 破折号保留希伯来语中宾语标记所突出的同位关系，明确所离弃的正是耶和华，同时维持原句的诗性收束。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。呼语以“啊”呈现诗体语气；正文保留“我的”这一突兀的人称转换，以忠实呈现文本难点。所有脚注标记均置于相关正文之后。
