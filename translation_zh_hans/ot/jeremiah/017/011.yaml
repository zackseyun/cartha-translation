  text: קֹרֵ֤א דָגַר֙ וְ/לֹ֣א יָלָ֔ד עֹ֥שֶׂה עֹ֖שֶׁר וְ/לֹ֣א בְ/מִשְׁפָּ֑ט בַּ/חֲצִ֤י ימ/ו יַעַזְבֶ֔/נּוּ וּ/בְ/אַחֲרִית֖/וֹ יִהְיֶ֥ה נָבָֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/017/011.yaml
  text: 'Like a partridge that gathers a brood it did not hatch[a], so is one who makes wealth unjustly: in the middle of his days it will leave him, and in his end he will be a fool.'
translation:
  language: zh_hans
  text: 鹧鸪聚拢一窝自己没有孵出的雏鸟[a]；不义得财的人也是如此：在他年日过半时，财富必离开他；到他末了，他必成为愚妄人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“鹧鸪伏在不是自己所下的蛋上。”这句谚语所指的确切鸟类行为并不确定；要点是，不正当得来的东西终不能长久保有。
    reason: lexical_alternative
lexical_decisions:
- source_word: קֹרֵא
  choice: 鹧鸪
  rationale: 此处与孵育、生产的鸟类意象相连，按传统及词典证据取鸟名“鹧鸪”，而非“呼叫者”。
- source_word: דָגַר
  choice: 孵育
  rationale: 该动词可指鸟伏窝孵卵或聚拢、照料幼鸟；“孵育”在中文中自然，也保留具体行为的不确定性。
- source_word: וְלֹא יָלָד
  choice: 不是自己所生的雏鸟
  rationale: יָלָד本义为“生”，用于鸟类意象时可涉及产卵或孵出幼鸟；此译与“孵育”衔接，同时由脚注说明另一可能。
- source_word: עֹשֶׂה עֹשֶׁר
  choice: 得财
  rationale: 希伯来语直译近于“造作财富”，语境指取得或积聚财富；“得财”简洁自然。
- source_word: וְלֹא בְמִשְׁפָּט
  choice: 不义
  rationale: מִשְׁפָּט在此指公正、正当；“不义得财”保留伦理与司法色彩。
- source_word: בַּחֲצִי יָמָיו
  choice: 到了他年日的中途
  rationale: 贴近希伯来语“在他日子的中间”，表达尚未尽其年日，避免直接限定为现代意义的“中年”。
- source_word: יַעַזְבֶנּוּ
  choice: 财富必离开他
  rationale: 单数动词及宾语后缀最自然地以“财富”为主语、以得财者为宾语；明说“财富”可消除中文代词歧义。
- source_word: וּבְאַחֲרִיתוֹ
  choice: 到他末了
  rationale: 保留第三人称后缀所指的个人结局，不泛化为抽象的“最终”。
- source_word: נָבָל
  choice: 愚顽人
  rationale: 该词不仅指智力欠缺，也常带道德和属灵上的悖逆、卑劣意味；“愚顽人”比单纯“愚人”更能体现这一层次。
theological_decisions:
- issue: 鸟类比喻所描述的具体行为
  choice: 正文写作鹧鸪孵育并非自己所生的雏鸟，以表达占有不属于自己的生命或成果。
  alternative: 鹧鸪伏在不是自己所下的蛋上。
  rationale: 古代谚语所依据的确切鸟类行为无法确定；经文重点是非正当所得终不能长久，因此正文保留较宽泛的鸟类意象，脚注列出另一种同样可能的理解。
- issue: 不义之财离去的时间与人的结局
  choice: 财富在此人年日未尽时离开他，而他最终显为愚顽人。
  alternative: 此人早逝，因而留下财富。
  rationale: יַעַזְבֶנּוּ的语法最自然地让财富作主语、此人作宾语；不将经文扩展为必然早逝的断言。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“年日的中途”有意保留原文诗性表达；“愚顽人”承载נָבָל兼具道德与属灵意味的贬义。
