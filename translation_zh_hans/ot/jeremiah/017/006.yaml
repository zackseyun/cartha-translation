  text: וְ/הָיָה֙ כְּ/עַרְעָ֣ר בָּֽ/עֲרָבָ֔ה וְ/לֹ֥א יִרְאֶ֖ה כִּי יָב֣וֹא ט֑וֹב וְ/שָׁכַ֤ן חֲרֵרִים֙ בַּ/מִּדְבָּ֔ר אֶ֥רֶץ מְלֵחָ֖ה וְ/לֹ֥א תֵשֵֽׁב־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/017/006.yaml
  text: He will be like a shrub in the desert[a], and he will not see when good comes. He will dwell in parched places in the wilderness[c][b], in a salt land that is not inhabited.
translation:
  language: zh_hans
  text: 他必像荒原[a][c]中的灌木，福乐来到时也看不见[b]。他必居于旷野干旱之处，在无人居住的盐碱地。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“杜松”“柽柳”或“枯槁的灌木”；希伯来文所指的具体植物不能确定。
    reason: lexical_alternative
  - marker: b
    text: 直译“好处来到时，他也看不见”；也可理解为“兴盛来到时，他也察觉不到”。
    reason: lexical_alternative
  - marker: c
    text: “荒原”也可译作地名“亚拉巴”，即特定的干旱地区。
    reason: alternative_reading
lexical_decisions:
- source_word: כְּעַרְעָר
  choice: 像……灌木
  rationale: 该词指一种生长于干旱地带的植物，但具体品种不确定；译作“灌木”既保留植物意象，也避免武断确定物种。
- source_word: בָּעֲרָבָה
  choice: 荒原中
  rationale: עֲרָבָה既可泛指干旱荒原，也可能指特定的亚拉巴地区；本句诗歌语境以一般地貌义较自然，同时在脚注保留专名可能。
- source_word: וְלֹא יִרְאֶה כִּי יָבוֹא טוֹב
  choice: 福乐来到时也看不见
  rationale: 保留希伯来文“看见”和“好处/福乐来到”的意象，不将其过度收窄为物质上的兴旺；“福乐”在现代汉语中比单独的“好处”更符合庄重的诗体。
- source_word: וְשָׁכַן
  choice: 他必住
  rationale: שׁכן意为居住、栖居；“住”清楚自然，并与后续处所短语顺畅衔接。
- source_word: חֲרֵרִים
  choice: 干旱之处
  rationale: 该词所指可能是焦灼、干涸或荒芜之地；“干旱之处”准确传达这里的荒凉环境而不过度限定地形。
- source_word: בַּמִּדְבָּר
  choice: 在旷野
  rationale: מִדְבָּר通常指旷野或荒漠；“旷野”符合圣经诗歌语域，也避免与前面的“荒原”完全重复。
- source_word: אֶרֶץ מְלֵחָה
  choice: 盐碱地
  rationale: 短语直指受盐分影响、难以生长作物的土地；现代汉语“盐碱地”自然、具体，并传达不毛之地的含义。
- source_word: וְלֹא תֵשֵׁב
  choice: 无人居住的
  rationale: 阴性单数动词与“地”呼应，意为该地不被居住；用定语结构符合自然汉语。
theological_decisions: []
