base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/017/019.yaml
  text: 'Thus Yahweh said to me: Go and stand in the gate of the people[a], by which the kings of Judah enter and by which they go out, and in all the gates of Jerusalem.'
translation:
  language: zh_hans
  text: 耶和华对我这样说：“你去，站在百姓的城门[a]门口，就是犹大诸王进出的那座门；也要在耶路撒冷所有的城门口站立。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“百姓的子弟之门”。此短语意义未定，可能指一座特定城门，其名称也可理解为“百姓门”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה אֵלַי
  choice: 耶和华对我这样说
  rationale: 采用现代汉语中庄重而自然的先知宣告格式；将圣名 יְהוָה 音义传统上通行地译作“耶和华”。
- source_word: הָלֹךְ וְעָמַדְתָּ
  choice: 你去，站在
  rationale: 不定式绝对形与完成式结合，在此表达直接命令；保留“去—站”的动作次序。
- source_word: בְּשַׁעַר בְּנֵי עָם
  choice: 在‘民众门’那里
  rationale: 该短语字面为“人民之子之门”，含义不确定，也可能是特定城门的名称；正文以可理解的门名形式表达，并用引号及脚注保留疑义。
- source_word: אֲשֶׁר יָבֹאוּ בוֹ מַלְכֵי יְהוּדָה וַאֲשֶׁר יֵצְאוּ בוֹ
  choice: 就是犹大诸王进出的那座门
  rationale: 关系从句说明该门是犹大诸王出入的通道；中文合并重复结构，使表达自然，同时不改变所指。
- source_word: וּבְכֹל שַׁעֲרֵי יְרוּשָׁלִָם
  choice: 你也要站在耶路撒冷的各城门那里
  rationale: 希伯来文省略前述动词，中文补出“你也要站在”以明确命令范围涵盖所有城门。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文明确使用四字神名；采用简体中文圣经传统中最通行、普通读者最易识别的专名译法，不以“主”替代专名。
- issue: בְּנֵי עָם 是否视为专名
  choice: 正文作“民众门”，脚注说明字面形式与不确定性
  alternative: 民众的子孙之门／百姓的门
  rationale: 原文结构罕见，既可能是门名，也可能是描述性短语；正文保持可读性，脚注避免把不确定解释定为唯一含义。
translation_notes:
  register: 采用现代、庄重、易懂的普通话书面语。为避免“在门里”造成现代空间误解，将 בְּשַׁעַר 译为“在……门那里”；末句补出原文承前省略的命令动词。
