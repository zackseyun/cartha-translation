base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/017/021.yaml
  text: 'Thus says Yahweh: Take care for yourselves[b][a], and do not carry a load on the Sabbath day or bring it in through the gates of Jerusalem.'
translation:
  language: zh_hans
  text: 雅威如此说：“你们务要谨慎自守[a]；不可在安息日搬运担子[b]，也不可把担子经耶路撒冷的城门运进城里。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译可作“要为自己的性命谨慎”；这是一个要求人严加自我警戒的希伯来语表达。
    reason: lexical_alternative
  - marker: b
    text: “担子”也可译作“载荷”或“货物”。这里很可能指安息日被搬运的实体物件。
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: 如此说
  rationale: 保留先知传信公式的庄重语气，同时符合现代汉语表达。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语音译呈现四字神名，而不以称号替代。
- source_word: הִשָּׁמְרוּ בְּנַפְשׁוֹתֵיכֶם
  choice: 你们务要谨慎自守
  rationale: 该结构直译涉及“你们的性命／自身”，在这里是要求人严加留意自己的行为；“谨慎自守”自然地保留了反身和警戒意味。
- source_word: וְאַל תִּשְׂאוּ מַשָּׂא
  choice: 不可……搬运重物
  rationale: נשא 与 מַשָּׂא 在本段安息日禁令中指搬运实体物件；“重物”比容易产生抽象联想的“重担”更贴合语境。
- source_word: בְּיוֹם הַשַּׁבָּת
  choice: 在安息日
  rationale: 简洁、自然地表达该时间短语，并沿用现代汉语通行的“安息日”。
- source_word: וַהֲבֵאתֶם בְּשַׁעֲרֵי יְרוּשָׁלִָם
  choice: 也不可把重物经耶路撒冷的城门运进城里
  rationale: 否定语境中的 waw 译作“也不可”，表示并列禁令；补出前文隐含的宾语“重物”和方向终点“城里”，清楚传达经城门运入耶路撒冷之意。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用神的专名；采用“雅威”音译，以区别于“主”等称号，同时不把后期汉语传统读音写入正文。
- issue: בְּנַפְשׁוֹתֵיכֶם 是否专指保全性命
  choice: 按警戒自身的习语译为“谨慎自守”
  alternative: “要为自己的性命谨慎”
  rationale: 原文确实含 נֶפֶשׁ（性命／自身），但整个短语可表达严加自我警戒，并不必然只指避免死亡；脚注保留较字面的可能性。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“务要”强化复数命令式的警戒语气，但不过度古雅；后半句补明“重物”和“城里”，使移动方向在汉语中清楚，同时不改变原文禁令的范围。
