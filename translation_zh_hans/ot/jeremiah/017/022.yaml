source:
  edition: WLC
  text: וְ/לֹא תוֹצִ֨יאוּ מַשָּׂ֤א מִ/בָּֽתֵּי/כֶם֙ בְּ/י֣וֹם הַ/שַּׁבָּ֔ת וְ/כָל מְלָאכָ֖ה לֹ֣א תַֽעֲשׂ֑וּ וְ/קִדַּשְׁתֶּם֙ אֶת י֣וֹם הַ/שַּׁבָּ֔ת כַּ/אֲשֶׁ֥ר צִוִּ֖יתִי אֶת אֲבוֹתֵי/כֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/017/022.yaml
  text: Do not carry a load out of your houses on the Sabbath day[a], and do not do any work, but sanctify the Sabbath day[b], just as I commanded your fathers.
translation:
  language: zh_hans
  text: 在安息日[a]，不可从你们家里搬出担子，也不可做任何工；你们要使安息日分别为圣，正如我吩咐你们列祖[b]的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“在安息日这一天”。
    reason: 说明希伯来文明确含有“日”，而中文“安息日”已自然包含这一意义。
  - marker: b
    text: “列祖”指以色列先前蒙上帝赐下这项命令的世代。
    reason: 澄清亲属称谓在此处的群体和历史所指。
lexical_decisions:
- source_word: תוֹצִיאוּ
  choice: 搬出
  rationale: 该词是 יצא 的使役式，意为“使出去、带出”。与“担子”搭配时，“搬出”自然表达把所载之物从屋内运出的具体动作。
- source_word: מַשָּׂא
  choice: 担子
  rationale: 指被负载、搬运的东西；“担子”保留具体负载之意，也不把经文过度限定为商业货物。
- source_word: מִבָּתֵּיכֶם
  choice: 从你们家里
  rationale: 介词 מן 表示动作的起点或来源；“从你们家里”准确而自然。
- source_word: בְּיוֹם הַשַּׁבָּת
  choice: 在安息日
  rationale: 这是时间短语；汉语“安息日”本身已明确指特定的一日，无须重复译出“日”。
- source_word: מְלָאכָה
  choice: 工
  rationale: 在安息日律例的语境中，指应停止的工作或劳作；“做任何工”简洁、庄重，并贴近原文的概括性。
- source_word: וְקִדַּשְׁתֶּם
  choice: 使……分别为圣
  rationale: קדש 的加强式在此表示将安息日划分出来归为圣；“使……分别为圣”直接保留圣别和奉献的含义。
- source_word: כַּאֲשֶׁר
  choice: 正如
  rationale: 自然表达与先前命令之间的对应和比较关系。
- source_word: צִוִּיתִי
  choice: 我吩咐
  rationale: 准确表达 צוה 的第一人称单数形式，并符合上帝颁布命令的庄重语域。
- source_word: אֲבוֹתֵיכֶם
  choice: 你们列祖
  rationale: 原词是阳性复数亲属称谓，在此指以色列先前世代；“列祖”既保留父系称谓，也符合中文圣经语域。
theological_decisions:
- issue: 安息日成圣用语
  choice: 使安息日分别为圣
  alternative: 守安息日为圣；以安息日为圣
  rationale: 原文用使役/宣告圣别意味鲜明的 קדש。所选译法不只表达遵守，也保留把这一日划归为圣的神学含义。
- issue: 祖先称谓的性别与所指
  choice: 你们列祖
  alternative: 你们的祖先
  rationale: 原文使用阳性复数“父辈”。“列祖”保留这一形式，同时在中文中自然指以色列以前各代受命者，不将其误解为仅指听众的亲生父亲。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“搬出担子”保留具体搬运图景；“分别为圣”保留原文的圣别用语。脚注标记均置于正文相应位置。
