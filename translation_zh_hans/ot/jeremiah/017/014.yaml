source:
  edition: WLC
  text: רְפָאֵ֤/נִי יְהוָה֙ וְ/אֵ֣רָפֵ֔א הוֹשִׁיעֵ֖/נִי וְ/אִוָּשֵׁ֑עָה כִּ֥י תְהִלָּתִ֖/י אָֽתָּה׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/017/014.yaml
  text: Heal me[a], O Yahweh, and I will be healed; save me, and I will be saved[b], for you are my praise.
translation:
  language: zh_hans
  text: 耶和华啊，求你医治我，我就得医治；求你拯救我，我就得救，因为你是我的赞美。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因为你是我所赞美的。”原文直译：“因为你是我的赞美。”
    reason: lexical_alternative
lexical_decisions:
- source_word: רְפָאֵנִי
  choice: 求你医治我
  rationale: 该词是רפא的祈使式，带第一人称单数宾语后缀。“医治我”直接保留身体、心灵及比喻层面的开放含义；加“求你”使汉语祷告语气自然。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文读者熟悉的专名“耶和华”呈现四字神名，而不以称号替代。
- source_word: וְאֵרָפֵא
  choice: 我就得医治
  rationale: Nifal未完成式接在祈使句之后，表达神施行医治所带来的结果。“就”清楚呈现条件—结果关系。
- source_word: הוֹשִׁיעֵנִי
  choice: 求你拯救我
  rationale: ישׁע的Hifil祈使式可指拯救、搭救或解救；“拯救”保留其宽广含义，并与下句同词根形式对应。
- source_word: וְאִוָּשֵׁעָה
  choice: 我就得救
  rationale: Nifal未完成式表达祈求实现后的结果；“得救”与“拯救我”保持词根呼应，也不把含义限缩为某一种危险。
- source_word: כִּי
  choice: 因为
  rationale: 此处引出祈求所依据的理由；“因为”在现代汉语中明确自然。
- source_word: תְהִלָּתִי
  choice: 我所赞美的
  rationale: 希伯来文直译为“我的赞美”。中文主文采用关系结构，表达“我赞美的对象”，使句意自然，同时以脚注保留原文紧凑表达。
- source_word: אָתָּה
  choice: 你是
  rationale: 独立人称代词带有强调作用；汉语以“你是”自然表达其判断句功能。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用神的专名。采用中文圣经传统中广为人知的“耶和华”，保留其专名性质，不译作一般称号。
- issue: הוֹשִׁיעֵנִי的含义范围
  choice: 求你拯救我
  alternative: 求你搭救我
  rationale: 原词既可指现实处境中的解救，也具有较宽广的拯救含义；“拯救”不将语义局限于某一种救援。
- issue: תְהִלָּתִי的谓语关系
  choice: 你是我所赞美的
  alternative: 你是我的赞美
  rationale: 原文名词结构简洁而略带张力。主文用自然汉语表达上帝是先知赞美的对象；脚注保留直译，避免掩盖原文形式及可能的诗性理解。
translation_notes:
  register: 采用庄重而自然的现代标准汉语，保留两组“求你……我就……”的诗歌平行结构。神名用“耶和华”；末句以自然表达为主，并用脚注呈现原文的紧凑名词结构。
