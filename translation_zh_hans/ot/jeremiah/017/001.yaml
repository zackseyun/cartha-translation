id: JER.17.1
reference: Jeremiah 17:1
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: חַטַּ֣את יְהוּדָ֗ה כְּתוּבָ֛ה בְּ/עֵ֥ט בַּרְזֶ֖ל בְּ/צִפֹּ֣רֶן שָׁמִ֑יר חֲרוּשָׁה֙ עַל ל֣וּחַ לִבָּ֔/ם וּ/לְ/קַרְנ֖וֹת מִזְבְּחוֹתֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/017/001.yaml
  text: The sin of Judah is written with an iron stylus[a]; with a diamond point it is engraved on the tablet of their heart and on the horns of your altars.
translation:
  language: zh_hans
  text: 犹大的罪，是用铁笔写下的，用金刚石的尖端[a]刻在他们的心版上，也刻在你们祭坛的角上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “金刚石”也可译作“极硬的石头”或“燧石”；שָׁמִיר所指的确切物质不能确定，主要表示一种可用来刻写的极坚硬材料。
    reason: lexical_alternative
lexical_decisions:
- source_word: חַטַּאת
  choice: 罪
  rationale: 在先知谴责的语境中指道德上的罪，而非“赎罪祭”；本节描写犹大的罪被长久刻下。
- source_word: כְּתוּבָה
  choice: 写下的
  rationale: 保留被动分词所表达的既成、持续状态，同时符合现代汉语表达。
- source_word: עֵט בַּרְזֶל
  choice: 铁笔
  rationale: 这里是用于刻写的铁制尖笔；“铁笔”简洁保留器具及材质意象，不使人误解为普通墨水笔。
- source_word: צִפֹּרֶן שָׁמִיר
  choice: 金刚石的尖端
  rationale: צִפֹּרֶן 在此指刻写工具的尖端；שָׁמִיר 指极坚硬、可供刻写的物质，但确切所指不明，因此正文采用易懂的“金刚石”，并以脚注说明不确定性。
- source_word: חֲרוּשָׁה
  choice: 刻
  rationale: 该被动分词强化了前面的书写意象，表示切入、镌刻；汉语用“刻”自然有力。
- source_word: לוּחַ לִבָּם
  choice: 他们的心版
  rationale: 保留“版”这一承载刻文之物的比喻，并保留希伯来文从复数群体到集合性单数“心”的表达。
- source_word: קַרְנוֹת
  choice: 角
  rationale: 指祭坛四角凸起的“角”，是希伯来圣经中固定的礼仪设施用语，应按原有意象直译。
- source_word: מִזְבְּחוֹתֵיכֶם
  choice: 你们祭坛
  rationale: 保留第二人称复数后缀，使原文从谈论“他们”转为直接对“你们”说话的变化清楚可见。
theological_decisions:
- issue: 人称指代由第三人称转为第二人称
  choice: 保留“他们的心版……你们祭坛”
  alternative: 统一译为“他们的心版……他们祭坛”
  rationale: 马所拉文本先谈及犹大及“他们的心”，继而直接转向听众的“你们祭坛”；保留这一转换能呈现先知话语突然转为当面指责的力度。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。保留“心版”“祭坛的角”等核心刻写与礼仪意象，并保留原文人称突变；以脚注交代שָׁמִיר的词义不确定性。
