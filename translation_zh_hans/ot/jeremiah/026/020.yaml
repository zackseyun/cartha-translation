  text: וְ/גַם אִ֗ישׁ הָיָ֤ה מִתְנַבֵּא֙ בְּ/שֵׁ֣ם יְהוָ֔ה אֽוּרִיָּ֨הוּ֙ בֶּֽן שְׁמַעְיָ֔הוּ מִ/קִּרְיַ֖ת הַיְּעָרִ֑ים וַ/יִּנָּבֵ֞א עַל הָ/עִ֤יר הַ/זֹּאת֙ וְ/עַל הָ/אָ֣רֶץ הַ/זֹּ֔את כְּ/כֹ֖ל דִּבְרֵ֥י יִרְמְיָֽהוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/026/020.yaml
  text: And there was also a man prophesying in the name of Yahweh[a], Uriah son of Shemaiah from Kiriath-jearim[b], and he prophesied against this city and against this land according to all the words of Jeremiah.
translation:
  language: zh_hans
  text: 还有一个人奉耶和华的名说预言，就是来自基列·耶琳的示玛雅之子乌利亚。他预言攻击这城和这地，所说的话全都与耶利米的话相同。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “攻击”也可译作“论到”。这里的希伯来语介词可以一般性地引出预言的主题，不过上下文较支持审判性的“攻击”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם אִישׁ
  choice: 另外，还有一个人
  rationale: 自然表达附加事例的作用，并保留“一个人”的阳性单数所指。
- source_word: הָיָה מִתְנַבֵּא
  choice: 说预言
  rationale: 希伯来语结构描写当时持续从事先知性宣告的情形；现代汉语以“说预言”表达较为自然。
- source_word: בְּשֵׁם יְהוָה
  choice: 奉耶和华的名
  rationale: 保留受神授权而发言的惯用含义，并直接译出神名。
- source_word: אֽוּרִיָּהוּ בֶּן שְׁמַעְיָהוּ
  choice: 示玛雅之子乌利亚
  rationale: 按现代中文圣经人名惯例音译，并清楚表达父子关系。
- source_word: מִקִּרְיַת הַיְּעָרִים
  choice: 来自基列·耶琳
  rationale: 地名采用音译；间隔号帮助现代读者辨识复合音译名称。
- source_word: עַל הָעִיר הַזֹּאת וְעַל הָאָרֶץ הַזֹּאת
  choice: 攻击这城和这地
  rationale: 上下文是审判性预言，因此 עַל 取敌对方向的含义；其一般性的“论到”义在脚注中保留。
- source_word: כְּכֹל דִּבְרֵי יִרְמְיָהוּ
  choice: 所说的全都与耶利米的话相同
  rationale: 表达 כְּכֹל 所指的全面对应关系，避免让中文“照着”误示乌利亚只是复述或奉行耶利米的话。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: “耶和华”是现代中文普通读者最熟悉的专名形式，同时保留其作为神之专名的功能，而不以“主”替代。
- issue: 预言对象前介词 עַל 的语气
  choice: 攻击这城和这地
  alternative: 论到这城和这地
  rationale: 本段语境涉及与耶利米相同的审判信息，支持敌对意义；但介词本身也可较中性地引出预言主题，因此以脚注保留歧义。
translation_notes:
  register: 采用自然、庄重的现代标准普通话。“说预言”较“预言”更清楚地表达发言行为；“这城和这地”保留原文简洁、平行的措辞。脚注标记置于相关整句之后。
