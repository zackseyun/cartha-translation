base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/026/014.yaml
  text: But as for me[a], here I am in your hand[b]. Do to me what is good and right in your eyes.
translation:
  language: zh_hans
  text: 至于我，我就在你们手中[a]。在你们眼中怎样算好、怎样算对，就怎样待我吧[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文用单数“手”，是表示处于某人控制之下的惯用说法。
    reason: lexical_alternative
  - marker: b
    text: 直译：“照你们眼中所看为好、为正的待我。”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: 至于我
  rationale: 独立代词配合连接词形成话语转折；“至于我”自然地突出耶利米由申辩转向自己处境的语气。
- source_word: הִנְנִי
  choice: 我现在就在
  rationale: 该呈现式表达强调说话者当下处于对方面前、任其处置；“现在就在”比古雅的“看哪”更符合现代汉语，同时保留现场感。
- source_word: בְיֶדְכֶם
  choice: 在你们手中
  rationale: 保留希伯来语“手”的意象，也自然表达处于对方掌控之下。汉语“手中”无需标明单复数。
- source_word: עֲשׂוּ לִי
  choice: 就照样待我吧
  rationale: 表达对耶利米采取行动；“待我”符合审判处境，又比“向我行”更自然。“吧”传达其坦然任凭处置的语气，并非软化命令内容。
- source_word: כַּטּוֹב
  choice: 看为好
  rationale: כְּ引出行动标准；“看为好”与后面的“你们眼中”搭配，既保留评价含义，也避免将其限定为法律上的正当。
- source_word: וְכַיָּשָׁר
  choice: 看为正
  rationale: יָשָׁר可指正直、正确或合宜；“正”保留道德及司法语境的宽度，并与“好”形成简洁对举。
- source_word: בְּעֵינֵיכֶם
  choice: 你们眼中
  rationale: 直译并保留希伯来语以“眼中”表示个人判断或评价的常见意象；脚注提供更动态的现代汉语表达。
theological_decisions: []
