  text: כֹּ֣ה אָמַ֣ר יְהוָ֗ה עֲמֹד֮ בַּ/חֲצַ֣ר בֵּית יְהוָה֒ וְ/דִבַּרְתָּ֞ עַל כָּל עָרֵ֣י יְהוּדָ֗ה הַ/בָּאִים֙ לְ/הִשְׁתַּחֲוֺ֣ת בֵּית יְהוָ֔ה אֵ֚ת כָּל הַ/דְּבָרִ֔ים אֲשֶׁ֥ר צִוִּיתִ֖י/ךָ לְ/דַבֵּ֣ר אֲלֵי/הֶ֑ם אַל תִּגְרַ֖ע דָּבָֽר׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/026/002.yaml
  text: 'Thus says Yahweh: Stand in the court of the house of Yahweh[a], and speak to all the cities of Judah that come to worship at the house of Yahweh all the words that I have commanded you to speak to them[c][b]; do not hold back a word.'
translation:
  language: zh_hans
  text: 雅威如此说：“你要站在雅威殿的院子里[a]，向所有从犹大各城前来雅威殿敬拜的人[b]说我吩咐你对他们说的一切话；一句也不可省略[c]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “院子”也可译作“院”；希伯来词 חָצֵר 可指庭院或院落。
    reason: lexical_alternative
  - marker: b
    text: 原文较直译为“向犹大所有的城说话，就是那些前来……的”。“城”在这里指各城的居民；介词 עַל 也可理解为“论及”或“针对”。
    reason: lexical_and_syntactic_ambiguity
  - marker: c
    text: “不可省略”也可译作“不可删去”“不可扣留”或“不可减少”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  choice: 雅威如此说
  rationale: 保留先知传信公式的庄重语气，并将四字神名译作其专名“雅威”，不以称号代替。
- source_word: בַּחֲצַר בֵּית יְהוָה
  choice: 在雅威殿的院子里
  rationale: חָצֵר 指院或院子；בֵּית יְהוָה 直译为“雅威的殿（房屋）”，此处用“雅威殿”既贴近原文，又符合现代汉语宗教建筑语境。
- source_word: עַל כָּל עָרֵי יְהוּדָה הַבָּאִים
  choice: 向所有从犹大各城前来……的人
  rationale: 原文以“犹大各城”转指各城居民，后接阳性复数“前来的”，表明实际所指是人；汉语明说“人”可避免将城市理解为亲自前来。
- source_word: לְהִשְׁתַּחֲוֺת
  choice: 俯伏敬拜
  rationale: 该词兼有俯伏与敬拜之意；合译为“俯伏敬拜”保留身体动作和宗教含义。
- source_word: אֵת כָּל הַדְּבָרִים
  choice: 一切话
  rationale: 保留信息内容的完整性，并与末尾不可减少任何话的命令相呼应。
- source_word: אַל תִּגְרַע דָּבָר
  choice: 一句话也不可少说
  rationale: גרע 可指减少、删去或扣留；在宣告信息的语境中，“不可少说”自然表达不得省略任何内容。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用以色列上帝的专名。译作“雅威”保留专名性质，不以“主”这一称号替代；“耶和华”则是另一传统音译。
- issue: 对犹大各城说话的对象
  choice: 各城前来敬拜的人
  alternative: 向／论及／攻击犹大所有的城说话
  rationale: 介词 עַל 容许多种关系，但后面的阳性复数分词“前来的”指向各城居民。正文据此明示人为听众，同时在脚注保留介词和转喻表达的歧义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。句式保留先知宣告的正式节奏；“俯伏敬拜”兼顾原文动作与功能，“一句话也不可少说”则以自然汉语表达信息必须完整传达。所有脚注标记均置于相关正文之后。
