base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/026/021.yaml
  text: When King Jehoiakim[a], and all his mighty men, and all the officials heard his words, the king sought to put him to death. But when Uriah heard[b], he was afraid and fled and went to Egypt.
translation:
  language: zh_hans
  text: 约雅敬王、他所有的勇士和所有官员听见乌利亚的话，王就想要杀死他。乌利亚听见这事，便害怕，逃到了埃及。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: 听见
  rationale: 叙事语境中表示听到话语或消息；两个分句均保留“听”的基本意义。第二处依上下文补出“这事”，使现代汉语表达完整自然。
- source_word: גִּבּוֹרָיו
  choice: 他所有的勇士
  rationale: גִּבּוֹר可指英勇强健之人，且在王室语境中常带军事随从或战士的意味；“勇士”既保留这一色彩，也不把身份限定得过窄。
- source_word: הַשָּׂרִים
  choice: 所有官员
  rationale: שׂרים在此指王廷中的掌权者或官长；“官员”是清楚、现代且不暗示王族身份的译法。
- source_word: דְּבָרָיו
  choice: 乌利亚的话
  rationale: 原文为“他的话”；汉语中明确指出乌利亚，可避免连续代词造成指代含混，同时保留其言论的含义。
- source_word: וַיְבַקֵּשׁ הַמֶּלֶךְ הֲמִיתוֹ
  choice: 王就想要杀死他
  rationale: בקש加使役不定式表达王寻求使乌利亚死亡的意图。“想要杀死他”自然地传达这一致命意图，又不额外断定已经采取了具体处决程序。
- source_word: וַיִּרָא
  choice: 便害怕
  rationale: 直接表达乌利亚得知危险后的恐惧反应。
- source_word: וַיִּבְרַח
  choice: 逃
  rationale: 保留 ברח所表达的仓促逃离和避险意味。
- source_word: וַיָּבֹא מִצְרָיִם
  choice: 逃到了埃及
  rationale: 原文动词字面为“来到”，但从叙述视角和现代汉语习惯，以“到了埃及”表达向目的地的移动最自然；并与前面的“逃”连读。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而清楚的叙事语言。保留王的意图与乌利亚反应之间的紧迫推进，不把“杀死”专门化为司法意义上的“处决”，也不对勇士的具体官职作过度界定。
