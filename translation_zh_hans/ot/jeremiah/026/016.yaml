  text: וַ/יֹּאמְר֤וּ הַ/שָּׂרִים֙ וְ/כָל הָ/עָ֔ם אֶל הַ/כֹּהֲנִ֖ים וְ/אֶל הַ/נְּבִיאִ֑ים אֵין לָ/אִ֤ישׁ הַ/זֶּה֙ מִשְׁפַּט מָ֔וֶת כִּ֗י בְּ/שֵׁ֛ם יְהוָ֥ה אֱלֹהֵ֖י/נוּ דִּבֶּ֥ר אֵלֵֽי/נוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/026/016.yaml
  text: Then the officials and all the people said to the priests and the prophets[a], “This man does not deserve the sentence of death[b], for he has spoken to us in the name of Yahweh our God.”
translation:
  language: zh_hans
  text: 于是，官长和众百姓对祭司和先知说：“这人不该被判死刑，因为他奉耶和华我们的上帝的名对我们说了话。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַשָּׂרִים
  choice: 官长
  rationale: 指掌权并参与审理的官员；“官长”既保留其权力身份，也符合本段司法场景。
- source_word: וְכָל הָעָם
  choice: 和众百姓
  rationale: 保留全体民众共同参与裁断的集体意味，同时使现代汉语表达自然。
- source_word: הַכֹּהֲנִים וְהַנְּבִיאִים
  choice: 祭司和先知
  rationale: 按其宗教职分直接翻译，并清楚标明官长与百姓说话的对象。
- source_word: אֵין לָאִישׁ הַזֶּה מִשְׁפַּט מָוֶת
  choice: 这人不该被判死刑
  rationale: מִשְׁפַּט מָוֶת 在审判语境中表示死刑判决或死罪责任；此译法自然地传达他们认为耶利米不应被处以死刑。
- source_word: בְּשֵׁם יְהוָה אֱלֹהֵינוּ
  choice: 奉耶和华我们上帝的名
  rationale: “奉……的名”表达受其权柄差遣、代表其发言的含义；“耶和华”直接呈现专名 יהוה。
- source_word: דִּבֶּר אֵלֵינוּ
  choice: 向我们说话
  rationale: 准确表达发言对象；汉语叙事无需强行标示希伯来完成式的时态差异。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名；“耶和华”是现代中文圣经语境中广为人知且庄重的专名形式，不以“主”替代原文专名。
- issue: מִשְׁפַּט מָוֶת 的司法含义
  choice: 不该被判死刑
  alternative: 没有死罪；不配死
  rationale: 上下文是正式审理，重点在是否应受死刑判决；所选译法保留司法力度，又不把表达缩减为纯粹的道德评价。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“于是”承接前文审讯进程；全句保持公开裁决的正式语气，同时避免古奥或过度法律化的措辞。
