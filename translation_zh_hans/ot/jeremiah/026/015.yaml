  text: אַ֣ךְ יָדֹ֣עַ תֵּדְע֗וּ כִּ֣י אִם מְמִתִ֣ים אַתֶּם֮ אֹתִ/י֒ כִּי דָ֣ם נָקִ֗י אַתֶּם֙ נֹתְנִ֣ים עֲלֵי/כֶ֔ם וְ/אֶל הָ/עִ֥יר הַ/זֹּ֖את וְ/אֶל יֹשְׁבֶ֑י/הָ כִּ֣י בֶ/אֱמֶ֗ת שְׁלָחַ֤/נִי יְהוָה֙ עֲלֵי/כֶ֔ם לְ/דַבֵּר֙ בְּ/אָזְנֵי/כֶ֔ם אֵ֥ת כָּל הַ/דְּבָרִ֖ים הָ/אֵֽלֶּה׀־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/026/015.yaml
  text: Only know for certain that if you put me to death[a], you are bringing innocent blood on yourselves, on this city, and on its inhabitants[b]; for in truth Yahweh has sent me to you to speak all these words in your hearing.
translation:
  language: zh_hans
  text: 只是，你们务要确实知道：如果你们把我处死[a]，你们就是使无辜人的血归到你们自己、这城和城中居民身上；因为雅威确实差遣我到你们这里，把这一切话说给你们听[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“杀死我”。原文动词是使役形式；在这里的审判语境中，“处死”更为贴切。
    reason: lexical_alternative
  - marker: b
    text: 原文直译“在你们耳中说”，意思是直接说给你们听。
    reason: idiom
lexical_decisions:
- source_word: אַךְ
  choice: 不过
  rationale: 在这里引出庄严而带有限定意味的警告；“不过”自然承接前文，同时保留强调性的转折。
- source_word: יָדֹעַ תֵּדְעוּ
  choice: 务要确知
  rationale: 以“务要”表达不定式绝对形与限定动词同用所产生的加强语气，“确知”体现确定性。
- source_word: כִּי אִם
  choice: 如果
  rationale: 在“确知”之后引出必须明白的条件内容；汉语无需逐字补出“就是知道，如果”。
- source_word: מְמִתִים אַתֶּם אֹתִי
  choice: 你们把我处死
  rationale: מות的使役形式表示使人死亡；审判语境中的“处死”比一般的“杀死”更贴切。
- source_word: דָם נָקִי
  choice: 无辜人的血
  rationale: 这是指错杀无辜者的固定表达；补出“人”使现代汉语语义清楚，又不改变原意。
- source_word: נֹתְנִים עֲלֵיכֶם
  choice: 使……血归到……身上
  rationale: 保留希伯来语把血置于责任承担者身上的意象，同时自然表达招致流无辜人血之罪责。
- source_word: וְאֶל הָעִיר הַזֹּאת וְאֶל יֹשְׁבֶיהָ
  choice: 这城和城中居民的身上
  rationale: 延续“归到……身上”的支配关系，表明罪责及其后果临到城与居民。
- source_word: בֶאֱמֶת
  choice: 实在
  rationale: 突出耶利米受差遣这件事的真实性，语气庄重而自然。
- source_word: שְׁלָחַנִי יְהוָה
  choice: 耶和华差我
  rationale: 忠实表达完成式所陈述的既成差遣；中文语境中以通行音译“耶和华”呈现专名。
- source_word: עֲלֵיכֶם
  choice: 到你们这里
  rationale: 在先知受差遣的结构中表示受差遣前往并面对的对象；此处不强行译成带敌对意味的“攻击你们”。
- source_word: לְדַבֵּר בְּאָזְנֵיכֶם
  choice: 把……话说给你们听
  rationale: 自然传达字面“在你们耳中说”的希伯来习语，并在脚注中保留其具体意象。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用四字神名。正文采用现代简体中文圣经读者最熟悉且可识别为专名的“耶和华”；“雅威”是较接近学术重构读音的另一译法。
- issue: 无辜之血归到城和居民身上的含义
  choice: 保留“血归到……身上”的责任意象
  alternative: 译为“使……担负杀害无辜者的罪”
  rationale: 原文以血被放在相关各方身上的形象表达流血罪责；保留意象可避免把法律、礼仪和后果层面的张力压缩成单一抽象解释。
translation_notes:
  register: 采用庄重、清晰的现代标准汉语。“务要确知”保留原文强烈警告的语气；分号呈现条件后果与先知受差遣这一理由之间的逻辑关系。所有脚注标记均置于正文相应位置。
