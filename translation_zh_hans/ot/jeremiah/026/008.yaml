source:
  edition: WLC
  text: וַ/יְהִ֣י כְּ/כַלּ֣וֹת יִרְמְיָ֗הוּ לְ/דַבֵּר֙ אֵ֣ת כָּל אֲשֶׁר צִוָּ֣ה יְהוָ֔ה לְ/דַבֵּ֖ר אֶל כָּל הָ/עָ֑ם וַ/יִּתְפְּשׂ֨וּ אֹת֜/וֹ הַ/כֹּהֲנִ֧ים וְ/הַ/נְּבִאִ֛ים וְ/כָל הָ/עָ֥ם לֵ/אמֹ֖ר מ֥וֹת תָּמֽוּת׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/026/008.yaml
  text: And it happened[a], when Yirmeyahu had finished speaking all that Yahweh had commanded him to speak to all the people, that the priests and the prophets and all the people seized him, saying, “You must surely die!”
translation:
  language: zh_hans
  text: 耶利米把雅威吩咐他向全体百姓说的一切话都说完以后，祭司、先知和全体百姓就抓住他，说：“你非死不可！”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你必定死！”希伯来文用绝对不定式和限定动词连用，强烈强调“死”。
    reason: 说明原文的强调句式，并保留其可表达必然性或强制性的语气空间。
lexical_decisions:
- source_word: וַיְהִי כְּכַלּוֹת
  choice: ……都说完以后
  rationale: וַיְהִי承接叙事，כְּ加不定式结构表达时间背景。现代汉语无需机械译出“事情发生了”，用“……以后”自然呈现事件的先后关系，也不额外加入“立刻”的含义。
- source_word: יִרְמְיָהוּ
  choice: 耶利米
  rationale: 采用现代中文读者熟悉且已固定的先知姓名形式；这是希伯来名字יִרְמְיָהוּ的中文传统音译，不改变人物身份。
- source_word: אֵת כָּל אֲשֶׁר צִוָּה יְהוָה לְדַבֵּר
  choice: 雅威吩咐他……说的一切话
  rationale: 保留“吩咐—说”的内容关系和“一切”的完整范围；中文调整语序以避免生硬。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来四字神名的常见现代汉语拟音直接呈现专名，区别于以称号代替神名的译法。
- source_word: אֶל כָּל הָעָם
  choice: 向全体百姓
  rationale: אֶל表示言说的对象，כָּל强调群体的整体范围；“全体百姓”简洁自然。
- source_word: וַיִּתְפְּשׂוּ אֹתוֹ
  choice: 就抓住他
  rationale: תפשׂ表示用力抓住或控制某人；“抓住”保留动作力度，又不把它具体化为正式逮捕程序。
- source_word: הַכֹּהֲנִים וְהַנְּבִאִים וְכָל הָעָם
  choice: 祭司、先知和全体百姓
  rationale: 忠实列出三个参与群体；现代汉语用顿号与“和”自然连接。
- source_word: מוֹת תָּמוּת
  choice: 你非死不可
  rationale: 希伯来语以绝对不定式配合限定动词加强语气。“非死不可”在现代汉语中有强烈、直接的判决或威胁意味，同时避免把句式仅限于未来预言。
theological_decisions:
- issue: 四字神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用神的专名。译作“雅威”旨在以现代汉语拟音保留专名，不以“主”这一称号替换；“耶和华”是中文传统形式，但不如“雅威”贴近通常重构的读音。
- issue: מוֹת תָּמוּת的语力
  choice: 你非死不可
  alternative: 你必定死；你一定要死
  rationale: 该结构明确加强“死”的语气，但上下文可让它兼有死亡判决、强烈威胁或必然结果的色彩。“非死不可”保留这种力度，不进一步断定它属于哪一种正式法律表达。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。句子依照汉语习惯重排，但保留原文的信息顺序、重复的“说”以及“全体百姓”的范围。引语简短有力，适合群众当面抓住先知时的强烈威胁语境。
