base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/026/017.yaml
  text: Then some of the elders of the land stood up and said to all the assembly of the people[a], saying,
translation:
  language: zh_hans
  text: 于是，这地的一些长老[a]站起来，向全体会众说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文可直译为“这地的长老中有几个人站起来”。
    reason: 保留希伯来文“人”与“从长老中”这一较为具体的句法表达。
lexical_decisions:
- source_word: וַיָּקֻמוּ
  choice: 站起来
  rationale: קום的叙事性未完成式在这里表示起身发言或采取行动；“站起来”自然地保留了公开集会中的动作。
- source_word: אֲנָשִׁים מִזִּקְנֵי הָאָרֶץ
  choice: 这地的一些长老
  rationale: 介词מִן在此最自然地表达从长老群体中选取一部分人；意译为“一些长老”既准确又符合现代汉语。“这地”保留הָאָרֶץ在上下文中的地域性表达。
- source_word: וַיֹּאמְרוּ
  choice: 说
  rationale: אמר是引出直接引语的常用动词；用“说”简洁自然。
- source_word: אֶל כָּל קְהַל הָעָם
  choice: 对全体会众
  rationale: קָהָל指聚集起来的群体或大会；“会众”保留正式集会的意味，且“全体”明确表达כָּל。
- source_word: לֵאמֹר
  choice: 说：
  rationale: 该不定式引出下一节的发言内容。现代汉语以冒号承担这一篇章功能，无须重复译成“说道”。
theological_decisions: []
