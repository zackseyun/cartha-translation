  text: אַ֗ךְ יַ֚ד אֲחִיקָ֣ם בֶּן שָׁפָ֔ן הָיְתָ֖ה אֶֽת יִרְמְיָ֑הוּ לְ/בִלְתִּ֛י תֵּת אֹת֥/וֹ בְ/יַד הָ/עָ֖ם לַ/הֲמִיתֽ/וֹ־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/026/024.yaml
  text: But the hand of Ahikam son of Shaphan was with Jeremiah[b][a], so that he was not given into the hand of the people to put him to death.
translation:
  language: zh_hans
  text: 然而，沙番的儿子亚希甘出手保护耶利米[a]，使他没有被交在百姓手中[b]处死。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“亚希甘的手与耶利米同在”，意思是亚希甘支持并保护耶利米。
    reason: lexical_alternative
  - marker: b
    text: “在百姓手中”是希伯来语习惯表达，意思是落入百姓的权势或控制之下。
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: 然而
  rationale: 此处承接上文百姓对耶利米的威胁，表达明显的转折；“然而”自然、庄重。
- source_word: יַד אֲחִיקָם בֶּן שָׁפָן הָיְתָה אֶת יִרְמְיָהוּ
  choice: 沙番的儿子亚希甘出手保护耶利米
  rationale: 希伯来文直译为“亚希甘的手与耶利米同在”，意指亚希甘积极支持并保护他。“出手保护”既传达实际含义，也部分保留“手”的意象。
- source_word: אֲחִיקָם בֶּן שָׁפָן
  choice: 沙番的儿子亚希甘
  rationale: 按现代汉语习惯先说明父子关系，再列出人物姓名。
- source_word: לְבִלְתִּי תֵּת אֹתוֹ
  choice: 使他没有被交
  rationale: לְבִלְתִּי 可表达否定的目的或结果；此处用“使……没有”自然呈现其功能，同时以被动式避免增添原文未明说的施事者。
- source_word: בְיַד הָעָם
  choice: 在百姓手中
  rationale: 该短语表示落入百姓的权势或控制之下；保留“手中”既符合现代汉语习惯，也与前半句“出手保护”形成呼应。
- source_word: הָעָם
  choice: 百姓
  rationale: 此处指作为集体的民众；“百姓”适合本段庄重的叙事语体。
- source_word: לַהֲמִיתוֹ
  choice: 处死
  rationale: מות 的使役形意为“使其死亡”。在本章审判式语境中，“处死”简洁而准确，但不额外断定这是合法执行的刑罚。
theological_decisions: []
