  text: וַֽ/יִּשְׁמְע֛וּ הַ/כֹּהֲנִ֥ים וְ/הַ/נְּבִאִ֖ים וְ/כָל הָ/עָ֑ם אֶֽת יִרְמְיָ֔הוּ מְדַבֵּ֛ר אֶת הַ/דְּבָרִ֥ים הָ/אֵ֖לֶּה בְּ/בֵ֥ית יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/026/007.yaml
  text: And the priests and the prophets and all the people heard Jeremiah speaking these words in the house of Yahweh[a].
translation:
  language: zh_hans
  text: 祭司、先知和所有百姓都听见耶利米在雅威的殿里[a]说这些话。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“雅威的家里”；也可译“雅威的圣殿里”。
    reason: 说明בְּבֵית יְהוָה的字面表达及语境性译法。
lexical_decisions:
- source_word: וַיִּשְׁמְעוּ
  choice: 都听见
  rationale: שׁמע在此叙述过去发生的事，取普通感知义“听见”，不扩展为“听从”；“都”与后面的全体主语自然呼应。
- source_word: הַכֹּהֲנִים וְהַנְּבִאִים וְכָל הָעָם
  choice: 祭司、先知和所有百姓
  rationale: 准确保留三个并列群体；现代汉语以顿号和“和”自然表达希伯来语重复连接词。
- source_word: אֶת יִרְמְיָהוּ מְדַבֵּר
  choice: 耶利米……说
  rationale: 分词מְדַבֵּר描写耶利米当时正在进行的说话行为；置于“听见”后的兼语结构，在汉语中已自然表达动作同时发生，无须生硬添加“正在”。
- source_word: אֶת הַדְּבָרִים הָאֵלֶּה
  choice: 这些话
  rationale: דְּבָרִים既可指“话”也可指“事情”，本节明确处于宣讲语境，因此译作“这些话”最贴切。
- source_word: בְּבֵית יְהוָה
  choice: 在雅威的殿里
  rationale: בֵּית יְהוָה直译为“雅威的家/殿”，语境所指是圣殿；“殿”兼顾原文“房屋”意象与现代汉语的清晰度。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按其专名性质音译神名，不以称号“主”替代。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名；“雅威”较贴近通行的学术重构读音，并保留其作为专名的功能。“耶和华”是传统形式，“主”则是替代性称号。
- issue: בְּבֵית יְהוָה中“殿”的表达
  choice: 雅威的殿
  alternative: 雅威的家；雅威的圣殿
  rationale: 原文字面为“雅威的家”，实际指圣殿。“殿”既不抹去原文的“房屋”表达，也能让普通读者清楚理解地点；脚注保留更直译和更明确的选项。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“百姓”保留经文语体但仍属当代通用词；句序尽量贴近原文，同时避免机械重复连接词。
