base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/026/009.yaml
  text: Why have you prophesied in the name of the LORD, saying, ‘This house will become like Shiloh, and this city will be laid waste, with no inhabitant’?” Then all the people gathered against Jeremiah in the house of the LORD.
translation:
  language: zh_hans
  text: “你为什么奉耶和华的名预言说：‘这殿必变得像示罗一样，这城必荒废，无人居住’？”于是，众人都聚集到在耶和华殿里的耶利米那里。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַדּוּעַ נִבֵּיתָ
  choice: 你为什么……预言
  rationale: 直译质问句，保留说话者对耶利米奉名宣告的责难语气。
- source_word: בְשֵׁם יְהוָה
  choice: 奉耶和华的名
  rationale: “奉……的名”自然表达凭其名义和权柄说话；神名 יהוה 译作“耶和华”，符合现代中文圣经的通行用法。
- source_word: כְשִׁלוֹ יִהְיֶה הַבַּיִת הַזֶּה
  choice: 这殿必像示罗一样
  rationale: 保留原文简洁的类比；“殿”在语境中自然指耶和华的圣殿，但不额外补出解释。
- source_word: תֶּחֱרַב
  choice: 必荒废
  rationale: 该词表示毁坏、荒凉；“荒废”兼顾城被毁及荒无人烟的结果，并与下句衔接自然。
- source_word: מֵאֵין יוֹשֵׁב
  choice: 无人居住
  rationale: 准确表达“没有居民/居住者”，采用自然现代汉语。
- source_word: וַיִּקָּהֵל כָּל־הָעָם אֶל־יִרְמְיָהוּ
  choice: 于是，众人都……聚集到耶利米那里
  rationale: אֶל 基本义为“向、到……那里”；不直接译成“围攻”或“敌对”，以免把上下文暗示写进词义。
- source_word: בְּבֵית יְהוָה
  choice: 在耶和华的殿里
  rationale: 明确聚集事件发生的地点，并保持与前文“这殿”的呼应。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 耶和华
  alternative: 雅威；上主
  rationale: 采用简体中文读者最熟悉的专名形式，不加脚注引入文本未要求的争议。
- issue: 众人聚集的敌对意味
  choice: 聚集到耶利米那里
  alternative: 聚集起来攻击耶利米；围住耶利米
  rationale: 本节语境明显紧张，但动词本身只说聚集，介词 אֶל 表示趋向；译文保留这种张力，不把敌意显化为原文未直接说出的行动。
- issue: 示罗类比的含义
  choice: 保留“像示罗一样”而不解释
  alternative: 像示罗一样被毁
  rationale: 原文依赖历史与上下文让读者理解类比，译文不替作者补全其隐含意义。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。引语结构清楚，避免文言化的“何以”“居民断绝”，也避免口语化表达。末句严格保留原文“聚集到……那里”的方向性，不擅自强化为攻击。
