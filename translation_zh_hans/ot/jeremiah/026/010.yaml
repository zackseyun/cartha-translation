  text: וַֽ/יִּשְׁמְע֣וּ שָׂרֵ֣י יְהוּדָ֗ה אֵ֚ת הַ/דְּבָרִ֣ים הָ/אֵ֔לֶּה וַ/יַּעֲל֥וּ מִ/בֵּית הַ/מֶּ֖לֶךְ בֵּ֣ית יְהוָ֑ה וַ/יֵּֽשְׁב֛וּ בְּ/פֶ֥תַח שַֽׁעַר יְהוָ֖ה הֶ/חָדָֽשׁ׀־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/026/010.yaml
  text: When the officials of Judah heard these words[c][b][a], they went up from the king’s house to the house of Yahweh and sat at the entrance of the New Gate of Yahweh.
translation:
  language: zh_hans
  text: 犹大的官长[a]听见这些话，就从王宫[b]上到雅威的殿，坐在雅威殿的新门入口处[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “官长”也可译作“首领”或“权贵”；原词指身居高位的统治者或官员。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“王的家”。
    reason: lexical_alternative
  - marker: c
    text: 指雅威殿建筑群中一座称为“新门”的门；原文的语序可较直译为“雅威的门，那座新的门”。
    reason: cultural_note
lexical_decisions:
- source_word: שָׂרֵי יְהוּדָה
  choice: 犹大的官长
  rationale: שָׂרִים指身居高位、参与治理或审判的人。“官长”既保留其统治权柄，也不限定为世袭王子。
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: 这些话
  rationale: דְּבָרִים可指“话”“事情”或“事件”；本段语境是他们听见耶利米所说的信息，因此译作“这些话”。
- source_word: וַיַּעֲלוּ
  choice: 上到
  rationale: עלה表示“上去、登上”；此处保留前往圣殿时的上行动词，可能兼含地势和圣殿方位的意味。
- source_word: מִבֵּית הַמֶּלֶךְ
  choice: 从王宫
  rationale: 原文直译为“从王的家”；现代汉语用“王宫”可清楚表达君王的居所和行政中心，直译另见脚注。
- source_word: בֵּית יְהוָה
  choice: 雅威的殿
  rationale: 原文为“雅威的家”，在此特指圣殿；“殿”自然、庄重，也准确交代地点。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以常见汉语音译呈现四字神名，而不以称号替代专名。
- source_word: וַיֵּשְׁבוּ
  choice: 坐在
  rationale: ישׁב在此直接表示“坐下、就座”；不在正文中额外加入原文未明说的审判含义。
- source_word: בְּפֶתַח
  choice: 在……入口处
  rationale: פֶּתַח表示开口或入口；“入口处”符合官长就座的位置。
- source_word: שַׁעַר יְהוָה הֶחָדָשׁ
  choice: 雅威的“新门”
  rationale: 原文是“雅威的门，那新的”；译文保留其与雅威圣殿的所属关系，并用引号表明“新门”在语境中像是特定门的名称。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文使用四字神名，正文以“雅威”呈现其专名性质，避免把专名悄然改为称号。
- issue: 官长就座是否明确具有审判含义
  choice: 仅译“坐在”
  alternative: 坐堂审判；就审判席
  rationale: 上下文可能带有司法场景，但本节的 וַיֵּשְׁבוּ 本身只明确说他们坐下；正文不把语境推断写成明说。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“官长”保留古代治理阶层的色彩；“王宫”避免生硬的“王的家”；“上到”保留希伯来文的上行动势。所有脚注标记均放在其所说明的词语之后。
