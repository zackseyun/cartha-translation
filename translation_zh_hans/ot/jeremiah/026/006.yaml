  yaml_path: translation/ot/jeremiah/026/006.yaml
  text: then I will make this house like Shiloh[b][a], and I will make this city a curse to all the nations of the earth.
translation:
  language: zh_hans
  text: 那么，我就要使这殿宇像示罗一样[b]，使这城成为地上万国的咒诅[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“使这城成为地上万国咒诅时所援引的对象。”
    reason: lexical_alternative
  - marker: b
    text: 示罗是以色列早期的圣所所在地，后来受到审判；这里的比较表示弃绝和毁坏。
    reason: cultural_note
lexical_decisions:
- source_word: וְנָתַתִּי
  choice: 那么，我就要使
  rationale: נתן本义为“给、放置”，在此双宾语的审判语境中表示使某物成为某种状况。结合上一节的条件句，以“那么……就”自然表达结果关系，同时不把连接词本身解释得过重。
- source_word: הַבַּיִת הַזֶּה
  choice: 这殿
  rationale: בַּיִת直译为“房屋”，但本段明确指耶和华的圣殿。现代汉语单说“这家/这房屋”容易误解；“这殿”既明确所指，也保留庄重宗教语域。
- source_word: כְּשִׁלֹה
  choice: 像示罗一样
  rationale: 前缀כְּ表示比较；示罗为地名。译文保留其历史典故，并以脚注说明其审判含义。
- source_word: הָעִיר הַזֹּאת
  choice: 这城
  rationale: 忠实呈现指示短语，语境所指为耶路撒冷，无须在正文中明说。
- source_word: אֶתֵּן לִקְלָלָה
  choice: 使……成为咒诅
  rationale: נתן + ל + קללה在此表示使这城成为咒诅或人咒诅时援引的对象。“成为咒诅”保留原文简洁而强烈的审判措辞，另一层含义收入脚注。
- source_word: לְכֹל גּוֹיֵי הָאָרֶץ
  choice: 在地上万国中
  rationale: גּוֹיֵי הָאָרֶץ在此自然指全地或世界各国；介词לְ表达这城与万国之间的关联或影响。“在……中”符合现代汉语习惯，并与“成为咒诅”自然搭配。
theological_decisions:
- issue: 圣殿称谓的译法
  choice: 这殿
  alternative: 这房屋
  rationale: 原词虽为“房屋”，但上下文明确指耶和华的殿。中文“这殿”既准确可懂，也保留圣所语境；不额外加入宗派性解释。
- issue: 这城成为咒诅的含义
  choice: 使这城在地上万国中成为咒诅
  alternative: 使这城成为地上万国咒诅时所援引的对象
  rationale: 原文可指城本身成为咒诅，也可指它成为咒语或诅咒公式中的反面典型。正文保留凝练表达，脚注交代较具体的可能含义，避免消除原有张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“那么，我就要”承接上一节的条件结构；“这殿”避免“这房屋”在现代中文中的歧义。脚注标记均紧随对应词语：示罗[b]、咒诅[a]。
