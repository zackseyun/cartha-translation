source:
  edition: WLC
  text: הֶ/הָמֵ֣ת הֱ֠מִתֻ/הוּ חִזְקִיָּ֨הוּ מֶֽלֶךְ יְהוּדָ֜ה וְ/כָל יְהוּדָ֗ה הֲ/לֹא֮ יָרֵ֣א אֶת יְהוָה֒ וַ/יְחַל֙ אֶת פְּנֵ֣י יְהוָ֔ה וַ/יִּנָּ֣חֶם יְהוָ֔ה אֶל הָ/רָעָ֖ה אֲשֶׁר דִּבֶּ֣ר עֲלֵי/הֶ֑ם וַ/אֲנַ֗חְנוּ עֹשִׂ֛ים רָעָ֥ה גְדוֹלָ֖ה עַל נַפְשׁוֹתֵֽי/נוּ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/026/019.yaml
  text: Did Hezekiah king of Judah and all Judah put him to death? Did he not fear Yahweh and seek the favor of Yahweh[c][b][a], and Yahweh relented concerning the disaster that he had spoken against them? But we are doing great evil against ourselves.
translation:
  language: zh_hans
  text: 犹大王希西家和全犹大果真把他处死了吗？他岂不是敬畏耶和华，恳求耶和华施恩[a]，耶和华就不再降下他曾宣告要降给他们的灾祸吗？[b][c]可是，我们正在犯大恶，害自己性命。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“使耶和华的脸柔和”，意思是恳求他施恩。
    reason: lexical_alternative
  - marker: b
    text: 或译：“耶和华便就他曾宣告要降给他们的灾祸改变心意。”
    reason: alternative_reading
  - marker: c
    text: “灾祸”和本节末的“大恶”源自同一个希伯来词；前者指灾难或审判，后者指道德上的恶。“害自己性命”也可译为“害自己”或“危及自己的性命”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶהָמֵת הֱמִתֻהוּ
  choice: 果真把他处死
  rationale: 以“果真”体现不定式绝对形与使役式动词连用所加强的反问语气；“处死”自然表达杀害先知之意。
- source_word: וְכָל יְהוּדָה
  choice: 和全犹大
  rationale: 保留希伯来文以地域/民族名称统称全体民众的集体表达。
- source_word: הֲלֹא יָרֵא אֶת־יְהוָה
  choice: 不是敬畏耶和华
  rationale: “敬畏”兼具畏惧与尊崇之意，保留该词在信仰语境中的含义。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 按现代中文圣经传统中广为人知的专名形式译出四字神名，而非以“主”这一称号代替。
- source_word: וַיְחַל אֶת־פְּנֵי יְהוָה
  choice: 恳求耶和华施恩
  rationale: 将字面为“使耶和华的脸柔和”的惯用语自然译出，既表达恳求，也保留寻求恩惠的关系性含义。
- source_word: וַיִּנָּחֶם יְהוָה אֶל־הָרָעָה
  choice: 耶和华就不再降下……灾祸
  rationale: 在本语境中表示神撤回已经宣告的审判；此译自然表达行动上的转变，同时脚注保留“回心转意”的较直译说法。
- source_word: אֲשֶׁר דִּבֶּר עֲלֵיהֶם
  choice: 他曾宣告要降给他们的
  rationale: דבר על 在先知审判语境中是针对某人宣告灾祸；中文补出“要降”使所指清楚。
- source_word: וַאֲנַחְנוּ עֹשִׂים רָעָה גְדוֹלָה עַל־נַפְשׁוֹתֵינוּ
  choice: 可是，我们正在给自己招来大祸
  rationale: 此句既可理解为“对自己行大恶”，也带有自招严重祸患的结果意味；正文采用自然的警告语气，脚注保留较形式对应的译法。
theological_decisions:
- issue: 神对悔改与恳求作出回应的人格化表述
  choice: 耶和华就不再降下……灾祸
  alternative: 耶和华便对那灾祸回心转意
  rationale: 正文清楚表达已宣告的审判被撤回，却不以系统神学解释消解原文 נִחם 所呈现的张力；脚注保留更直接的人格化表达。
- issue: 同一词 רָעָה 在本节两处的语义张力
  choice: 前处译“灾祸”，后处译“给自己招来大祸”
  alternative: 前处译“灾祸”，后处译“对自己行大恶”
  rationale: 前处明确指神所宣告的灾难；后处可侧重领袖们杀害耶利米所犯的恶，也可侧重由此自招祸患。正文体现后者，脚注说明前者，避免掩盖歧义。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。反问句用“果真……吗”传达加强语气；神名译作“耶和华”。正文避免生硬直译希伯来惯用语，并借脚注保存原文措辞、神回应之表述及 רָעָה 的双重语义。
