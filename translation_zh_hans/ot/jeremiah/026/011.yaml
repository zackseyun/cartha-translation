base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/026/011.yaml
  text: Then the priests and the prophets said to the officials and to all the people, saying, “A sentence of death is for this man, because he has prophesied against this city, just as you have heard with your own ears.”
translation:
  language: zh_hans
  text: 祭司和先知对众首领和全体百姓说：“这人该判死刑，因为他曾预言攻击这城，正如你们亲耳所听见的。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִשְׁפַּט מָוֶת
  choice: 该判死刑
  rationale: 该短语直译近于“死的判决／死刑判决”；结合司法语境，用现代汉语“该判死刑”自然表达控方所主张的死刑判决，而不弱化为仅仅“该死”。
- source_word: נִבָּא אֶל הָעִיר הַזֹּאת
  choice: 说预言攻击这城
  rationale: 介词 אֶל 在此语境表示预言针对该城，内容对城不利；“攻击这城”保留指控者的敌对措辞，同时明确这是言语上的预言，不是武力攻击。
- source_word: כַּאֲשֶׁר שְׁמַעְתֶּם בְּאָזְנֵיכֶם
  choice: 这是你们亲耳听见的
  rationale: 保留希伯来语“用你们的耳朵听见”的强调，以自然汉语“亲耳听见”表达直接作证的意味。
- source_word: הַשָּׂרִים
  choice: 众首领
  rationale: 此词指承担治理或审判职能的领袖官员；“众首领”既符合耶利米书常用政治语境，也避免过度限定具体官职。
theological_decisions:
- issue: 祭司和先知对耶利米所宣告之预言的定性
  choice: 保留“说预言攻击这城”这一指控性表述
  alternative: 预言论到这城／向这城说预言
  rationale: 说话者将耶利米的信息视为针对耶路撒冷的敌对言论；译文呈现其控告视角，不据此判断耶利米预言的真伪或正当性。
- issue: 死刑措辞的法律性质
  choice: 该判死刑
  alternative: 这人该死／这人犯了死罪
  rationale: מִשְׁפַּט מָוֶת 强调判决或司法裁定；采用法律措辞，避免把控告改写为一般性的道德判断，也不额外断言已正式定罪。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“祭司和先知”“众首领”“全体百姓”保持公共审讯场景的正式感；省去在汉语中显得累赘的“说着”，直接引出引语。
