  text: בְּ/רֵאשִׁ֗ית מַמְלְכ֛וּת יְהוֹיָקִ֥ים בֶּן יֹאשִׁיָּ֖הוּ מֶ֣לֶךְ יְהוּדָ֑ה הָיָה֙ הַ/דָּבָ֣ר הַ/זֶּ֔ה מֵ/אֵ֥ת יְהוָ֖ה לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/026/001.yaml
  text: At the beginning of the reign of Jehoiakim son of Josiah[a], king of Judah, this word came from Yahweh, saying[c][b],
translation:
  language: zh_hans
  text: 犹大王、约西亚的儿子约雅敬在位之初[a]，这话从雅威[c]而来[b]，说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在位之初”也可译作“开始执政的时候”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文较直译为“这话是从雅威而有的”；正文采用先知书引言公式的自然汉语表达。
    reason: lexical_alternative
  - marker: c
    text: “雅威”音译希伯来文的上帝之名 YHWH；传统中文常译作“耶和华”，也常以“主”代称。
    reason: alternative_reading
lexical_decisions:
- source_word: בְּרֵאשִׁית מַמְלְכוּת
  choice: 执政初期
  rationale: בְּרֵאשִׁית 表示某一时期的开端，מַמְלְכוּת 在君王语境中指王权的施行或在位时期；“执政初期”在现代汉语中自然，并保留时间含义。
- source_word: יְהוֹיָקִים בֶּן יֹאשִׁיָּהוּ מֶלֶךְ יְהוּדָה
  choice: 约西亚的儿子、犹大王约雅敬
  rationale: 采用现代中文圣经中通行的人名、地名译法，并用顿号清楚表明“犹大王”是约雅敬的同位称号，而不是修饰约西亚。
- source_word: הָיָה הַדָּבָר הַזֶּה מֵאֵת
  choice: 这话从……而来
  rationale: 希伯来文较直译为“这话是从……而有的”；在先知书的启示引言中，“这话从……而来”自然表达话语的来源，同时不增添原文没有的受话者。
- source_word: דָּבָר
  choice: 话
  rationale: 此处指来自上帝的言语或信息；“话”保留先知性公式的传统语感，也比单纯译作“信息”更贴近原词。
- source_word: יְהוָה
  choice: 雅威
  rationale: 原文使用上帝的专名四字神名 YHWH；“雅威”按较普遍接受的读音音译，以专名呈现，而不以“主”这一称号替代。
- source_word: לֵאמֹר
  choice: 说：
  rationale: 该词引出下一节的直接引语；现代汉语用“说：”既贴近原文句法，也自然衔接后文。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文写的是上帝的专名 YHWH。正文采用“雅威”以保留专名性质；脚注说明传统中文译名“耶和华”及“主”的替代传统，不把某一种后期读法说成毫无争议。
- issue: הָיָה הַדָּבָר הַזֶּה 的先知性公式
  choice: 这话从雅威而来
  alternative: 这话是从雅威而有的
  rationale: 选择自然的现代汉语表达启示话语的来源，同时以脚注保留希伯来文较直译的结构，避免把公式扩写成“雅威对耶利米说”，因为本节原文没有明说受话者。
translation_notes:
  register: 采用庄重而明白的现代标准汉语。“约西亚的儿子、犹大王约雅敬”通过同位结构避免修饰歧义；句末“说：”保留未完句式，以自然引出下一节的神谕。
