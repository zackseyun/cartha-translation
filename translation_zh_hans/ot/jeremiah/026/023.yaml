  text: וַ/יּוֹצִ֨יאוּ אֶת אוּרִיָּ֜הוּ מִ/מִּצְרַ֗יִם וַ/יְבִאֻ֨/הוּ֙ אֶל הַ/מֶּ֣לֶךְ יְהוֹיָקִ֔ים וַ/יַּכֵּ֖/הוּ בֶּ/חָ֑רֶב וַ/יַּשְׁלֵךְ֙ אֶת נִבְלָת֔/וֹ אֶל קִבְרֵ֖י בְּנֵ֥י הָ/עָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/026/023.yaml
  text: They brought Uriah out of Egypt and brought him to King Jehoiakim[a], and he struck him down with the sword and threw his corpse into the burial places of the common people.
translation:
  language: zh_hans
  text: 他们把乌利亚从埃及带出来，带到约雅敬王那里；王用刀剑击杀了他，又把他的尸首扔进平民的坟地里[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“百姓的坟墓。”希伯来语较字面的意思可以是属于普通百姓的埋葬之处，与尊贵的安葬相对。
    reason: 保留קִבְרֵי בְּנֵי הָעָם既可较字面理解为“百姓的坟墓”，也可按社会含义理解为“平民的坟地”的词义空间。
lexical_decisions:
- source_word: וַיּוֹצִיאוּ אֶת־אוּרִיָּהוּ מִמִּצְרַיִם
  choice: 他们把乌利亚从埃及带出来
  rationale: 使役形态表达“使……出来、带出来”；此译保留从埃及被带出的方向与使役含义，同时符合现代汉语。
- source_word: וַיְבִאֻהוּ אֶל־הַמֶּלֶךְ יְהוֹיָקִים
  choice: 带到约雅敬王那里
  rationale: בוא的使役形态带宾语后缀，直指“把他带到”；王号置于人名前，符合自然汉语。
- source_word: וַיַּכֵּהוּ בֶּחָרֶב
  choice: 王用刀击杀了他
  rationale: נכה本义范围包括“击打、击杀”；在“用刀”的语境中结果显然是死亡。“击杀”兼顾动作意象和致死结果，避免仅概括为“处死”。
- source_word: נִבְלָתוֹ
  choice: 他的尸首
  rationale: נְבֵלָה指尸体；“尸首”在此庄重而直接，也保留遗体遭弃置所带出的受辱意味。
- source_word: קִבְרֵי בְּנֵי הָעָם
  choice: 平民的坟地
  rationale: קִבְרֵי可指坟墓或埋葬之处；בְּנֵי הָעָם在此很可能指普通百姓，与尊贵的安葬形成对照。“平民的坟地”自然传达这一社会含义，同时以脚注保留较字面的理解。
theological_decisions:
- issue: 前两个复数动词与后两个单数动词之间的主语转换
  choice: 前半句用“他们”，后半句明确为“王”
  alternative: 把后半句也理解为那些奉命办事的人所为，或全句使用不明确的施事者
  rationale: 希伯来文从复数动词וַיּוֹצִיאוּ、וַיְבִאֻהוּ转为单数动词וַיַּכֵּהוּ、וַיַּשְׁלֵךְ；最近的单数先行词是约雅敬王。译文保留这一叙事转换，并用“王”避免现代汉语中“他”指代不清，但不扩展为关于亲手执行方式的额外说明。
translation_notes:
  register: 采用现代、庄重而易懂的叙事文体。“带出来……带到”保留原文连续动作；分号标示施事者由复数转为单数。“扔进”体现וַיַּשְׁלֵךְ的弃置意味，不美化乌利亚死后所受的羞辱。
