source:
  edition: WLC
  text: לִ/שְׁמֹ֗עַ עַל דִּבְרֵ֨י עֲבָדַ֣/י הַ/נְּבִאִ֔ים אֲשֶׁ֥ר אָנֹכִ֖י שֹׁלֵ֣חַ אֲלֵי/כֶ֑ם וְ/הַשְׁכֵּ֥ם וְ/שָׁלֹ֖חַ וְ/לֹ֥א שְׁמַעְתֶּֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/026/005.yaml
  text: to listen to the words of my servants the prophets[a], whom I am sending to you, rising early and sending, though you have not listened,
translation:
  language: zh_hans
  text: 听从我仆人、众先知的话；我一次又一次地差遣他们到你们这里[a]，你们却没有听从。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“早起并差遣”，是希伯来语惯用表达，表示殷勤、持续而反复地差遣。
    reason: 说明原文惯用语的字面形象与正文译法。
lexical_decisions:
- source_word: לִשְׁמֹעַ / וְלֹא שְׁמַעְתֶּם
  choice: 听从／没有听从
  rationale: שׁמע在本句中不只是听见声音，也含有留心接受之意。“听从”符合现代汉语习惯，并在前后两处保留同一词根的呼应。
- source_word: דִּבְרֵי עֲבָדַי הַנְּבִאִים
  choice: 我仆人众先知的话
  rationale: 按原文保留“话”的复数性概念和“我的仆人”这一受差遣者称号；“众先知”自然表达带定冠词的复数名词及其同位关系。
- source_word: אֲשֶׁר אָנֹכִי שֹׁלֵחַ אֲלֵיכֶם
  choice: 我……差遣他们到你们这里
  rationale: 分词结合上下文表达持续、反复的差遣；补出“他们”使中文指代清楚，不增加新的所指。
- source_word: וְהַשְׁכֵּם וְשָׁלֹחַ
  choice: 一次又一次差遣
  rationale: 这是希伯来语惯用表达，字面为“早起并差遣”，在此强调殷勤而反复的行动。正文传达其语用意义，字面形式在脚注中说明。
- source_word: וְלֹא שְׁמַעְתֶּם
  choice: 你们却没有听从
  rationale: 连接词在语境中具有转折作用；“却”清楚表现上帝反复差遣与百姓不听之间的对照。
theological_decisions:
- issue: 如何表达“早起并差遣”的拟人化惯用语
  choice: 正文译作“一次又一次差遣”，脚注保留字面形式
  alternative: 直译为“早起并差遣”
  rationale: 原文重点是上帝持续、殷勤地差遣先知，而非断言某个具体起床时刻。意译其惯用含义可避免现代读者误解，同时脚注保留原文形象及翻译透明度。
- issue: עֲבָדַי的身份称谓
  choice: 我的仆人
  alternative: 我的奴隶
  rationale: 这里是先知受上帝委派的固定称号，语境突出服事和受差遣，而非社会法律身份；“仆人”更准确地传达本句焦点。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。经节在原段落中承接上一节的条件句；本稿按所给单节呈现，保留其内容连续性，同时用分号理清先知的话、反复差遣和百姓不听之间的关系。
