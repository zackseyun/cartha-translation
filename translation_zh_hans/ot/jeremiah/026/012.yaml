base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/026/012.yaml
  text: Then Yirmeyahu said to all the officials and to all the people, saying, “The LORD sent me to prophesy against this house and against this city all the words that you have heard.”
translation:
  language: zh_hans
  text: 耶利米对所有官长和全体百姓说：“耶和华差遣我，叫我把你们所听见的这一切话，向这殿和这城说预言。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַשָּׂרִים
  choice: 官长
  rationale: 指掌权审理此事的官员；“官长”既贴近原词，也符合本段庄重的司法场景。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的专名形式表达四字神名。
- source_word: לְהִנָּבֵא אֶל
  choice: 向……说预言
  rationale: 保留介词 אֶל 的基本方向义。此处预言内容显然是针对殿和城的审判，但不把介词本身过度解释为“攻击”。
- source_word: הַבַּיִת הַזֶּה
  choice: 这殿
  rationale: 上下文所指是耶和华的圣殿，中文用“殿”比泛称“房屋”准确自然。
- source_word: כָּל הַדְּבָרִים
  choice: 这一切话
  rationale: דְּבָרִים 在这里指先知宣告的话语，而不是抽象的“事情”。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 耶和华
  alternative: 上主／雅威
  rationale: “耶和华”是现代简体中文圣经传统中辨识度最高的专名译法，明确区别于一般称号“主”。
- issue: אֶל 是否译成带敌对色彩的“攻击／指责”
  choice: 向这殿和这城说预言
  alternative: 说预言攻击这殿和这城
  rationale: 原介词可依语境带有针对之意，但其词形本身是“向、对”；译文保留方向性，让审判性质由上下文和“所听见的一切话”呈现，避免额外强化。
- issue: 是否直译 לֵאמֹר“说”
  choice: 不另译
  alternative: 说道／说
  rationale: 中文“对……说”已经自然承载引语功能；再译“说道”会重复，不增加实质意义。
translation_notes:
  register: 采用庄重而通顺的现代标准普通话。“官长”“差遣”“说预言”保留经文语体，同时避免生硬的希伯来语句法复制。调整“一切话”的位置，使中文清楚表达：耶利米受差遣，把百姓已经听见的全部信息向殿和城宣告。
