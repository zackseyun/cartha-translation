base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/026/004.yaml
  text: 'And you shall say to them, ‘Thus says the LORD: If you do not listen to me, to walk in my law that I have set before you,’'
translation:
  language: zh_hans
  text: 你要对他们说：‘耶和华如此说：你们若不听从我，不遵行我摆在你们面前的律法，’
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תִשְׁמְעוּ אֵלַי
  choice: 听从我
  rationale: שׁמע 与介词 אֶל 连用，在此不只是听见，也包含听从、顺服；“听从我”符合现代汉语并保留其行动要求。
- source_word: לָלֶכֶת בְּתוֹרָתִי
  choice: 遵行我的律法
  rationale: 字面为“行在我的律法中”；汉语以“遵行……律法”自然表达按律法生活行事的含义。
- source_word: נָתַתִּי לִפְנֵיכֶם
  choice: 我摆在你们面前的
  rationale: 保留“置于你们面前”的空间隐喻，表达上帝已将律法明确赐下并陈明。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的专名形式，以区别于通称“主”，并对应原文神名。
theological_decisions:
- issue: “听从”与“遵行”之间的句法关系
  choice: 译作并列而相互说明的“不听从我，不遵行……”
  alternative: “不借着遵行……来听从我”或“若不听从我，去遵行……”
  rationale: 原文 אִם לֹא תִשְׁמְעוּ אֵלַי לָלֶכֶת 可将不定式理解为听从的具体表现或内容。中文采用两个紧密相连的否定短语，既自然，也不把关系过度限定为方式或目的。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“你要对他们说”传达先知命令；保留引语未完结的逗号，因为本节条件句在后续经文继续。
