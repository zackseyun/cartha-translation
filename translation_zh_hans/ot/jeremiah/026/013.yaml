source:
  edition: WLC
  text: וְ/עַתָּ֗ה הֵיטִ֤יבוּ דַרְכֵי/כֶם֙ וּ/מַ֣עַלְלֵי/כֶ֔ם וְ/שִׁמְע֕וּ בְּ/ק֖וֹל יְהוָ֣ה אֱלֹהֵי/כֶ֑ם וְ/יִנָּחֵ֣ם יְהוָ֔ה אֶל הָ֣/רָעָ֔ה אֲשֶׁ֥ר דִּבֶּ֖ר עֲלֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/026/013.yaml
  text: So now[a], make your ways and your deeds good, and listen to the voice of Yahweh your God[c][b], and Yahweh will relent concerning the disaster that he has spoken against you.
translation:
  language: zh_hans
  text: 现在，你们要改正自己的道路和行为[a]，听从耶和华你们上帝的话[b]；耶和华就会转意[c]，不施行他所宣告要加给你们的灾祸。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“使你们的道路和行为变好。”希伯来语直译是“使你们的道路和行为好”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来语直译是“听耶和华你们上帝的声音”；这个说法通常也含有服从的意思。
    reason: lexical_alternative
  - marker: c
    text: 也可译：“耶和华就会为那灾祸改变心意。”希伯来语这个词可直译为“后悔”或“转意”；这里是指不再施行已经宣告的灾祸，并不表示道德上的悔改。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: 所以现在
  rationale: 承接上文并引出紧迫的劝告；既保留推论和转折作用，也符合现代汉语表达。
- source_word: הֵיטִיבוּ דַרְכֵיכֶם וּמַעַלְלֵיכֶם
  choice: 使自己的道路和行为变好
  rationale: 保留使役式“使……好”的力量，也保留“道路”这一可理解的伦理隐喻；“行为”自然表达 מַעֲלָלִים 所指的作为。
- source_word: וְשִׁמְעוּ בְּקוֹל
  choice: 听从……的话
  rationale: 这个希伯来语惯用语字面为“听……的声音”，在语境中含有服从之意；“听从……的话”兼顾原有听觉意象和顺服含义。
- source_word: יְהוָה אֱלֹהֵיכֶם
  choice: 耶和华你们的上帝
  rationale: 以“耶和华”音译神名，以“你们的上帝”直译所属关系。正文为汉语流畅而省去“的”，写作“耶和华你们上帝的话”。
- source_word: וְיִנָּחֵם
  choice: 就会转意，不降下
  rationale: נחם 的尼法勒式在这里表示不再执行已经宣告的审判。“转意”保留神对所宣告灾祸采取不同处置的张力，又避免“悔改”暗示道德过失；补出“不降下”使汉语语义完整。
- source_word: אֶל הָרָעָה
  choice: 不降下……灾祸
  rationale: רָעָה 在审判语境中指灾难、祸患，并非道德意义的邪恶。介词结构依其语义关系自然译出。
- source_word: דִּבֶּר עֲלֵיכֶם
  choice: 他所宣告要加给你们的
  rationale: 这里是针对百姓发出的审判宣告；“宣告要加给你们”比机械地译成“向你们说”更清楚，同时保留话语所针对的对象。
theological_decisions:
- issue: 上帝对已宣告灾祸的“转意”
  choice: 耶和华就会转意，不降下……灾祸
  alternative: 耶和华就会为那灾祸而后悔／改变心意
  rationale: 译文保留经文所呈现的张力：上帝宣告审判，却在百姓改正并听从时不执行灾祸；既不把这种“转意”解释为上帝犯错后的悔改，也不以神学体系消除经文本身的条件性表达。
- issue: רָעָה 的伦理或灾难含义
  choice: 灾祸
  alternative: 恶事
  rationale: 此处所指是上帝宣告要施行的审判性灾难，而不是上帝所行的道德邪恶。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“道路和行为”保留希伯来文的修辞搭配；“听从……的话”避免生硬的“听……的声音”；“转意，不降下”用自然汉语表达原文，同时由脚注交代更贴近字面的说法。
