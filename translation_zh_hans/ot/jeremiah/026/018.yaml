source:
  edition: WLC
  text: מיכיה הַ/מּ֣וֹרַשְׁתִּ֔י הָיָ֣ה נִבָּ֔א בִּ/ימֵ֖י חִזְקִיָּ֣הוּ מֶֽלֶךְ יְהוּדָ֑ה וַ/יֹּ֣אמֶר אֶל כָּל עַם֩ יְהוּדָ֨ה לֵ/אמֹ֜ר כֹּֽה אָמַ֣ר יְהוָ֣ה צְבָא֗וֹת צִיּ֞וֹן שָׂדֶ֤ה תֵֽחָרֵשׁ֙ וִ/ירוּשָׁלַ֨יִם֙ עִיִּ֣ים תִּֽהְיֶ֔ה וְ/הַ֥ר הַ/בַּ֖יִת לְ/בָמ֥וֹת יָֽעַר־־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/026/018.yaml
  text: 'Micah the Morashtite was prophesying in the days of Hezekiah king of Judah[a], and he said to all the people of Judah, saying, “Thus says Yahweh of Armies: Zion will be plowed as a field, and Jerusalem will become ruins[c][b], and the mountain of the house will become wooded heights.”'
translation:
  language: zh_hans
  text: 摩利沙人弥迦在犹大王希西家的日子说预言。他对犹大全体百姓说：“万军的雅威如此说[a]：锡安必被耕成田地，耶路撒冷必变成废墟；圣殿山[b]必变成林木覆盖的高冈[c]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “万军的雅威”也可按华语传统译作“万军之耶和华”。
    reason: lexical_alternative
  - marker: b
    text: 即圣殿所在的山。原文直译为“殿宇的山”。
    reason: cultural_note
  - marker: c
    text: 或译：“树林中的高处。”这里的“高冈”也可译作“高处”。
    reason: lexical_alternative
lexical_decisions:
- source_word: מיכיה הַמּוֹרַשְׁתִּי
  choice: 摩利沙人弥迦
  rationale: מיכיה在此指《弥迦书》所载预言的先知弥迦；הַמּוֹרַשְׁתִּי是表示籍贯的称谓，译为“摩利沙人”既简洁又符合现代汉语表达。
- source_word: הָיָה נִבָּא
  choice: 说预言
  rationale: 该结构由היה与分词构成，具有过去持续或进行的意味。汉语结合“在……的日子”即可自然表达当时从事先知宣讲之意，无须生硬添加进行体标记。
- source_word: בִּימֵי חִזְקִיָּהוּ מֶלֶךְ יְהוּדָה
  choice: 在犹大王希西家的日子
  rationale: 保留希伯来语时间表达“在……的日子”，同时采用汉语自然的王号语序。
- source_word: אֶל כָּל עַם יְהוּדָה
  choice: 对犹大全体百姓
  rationale: כָּל表达整体范围，עַם在此指犹大民众；“全体百姓”清楚而庄重。
- source_word: צִיּוֹן שָׂדֶה תֵחָרֵשׁ
  choice: 锡安必被耕成田地
  rationale: שָׂדֶה作结果或表语性成分；“耕成田地”直接传达圣城所在地将像普通农田一样被翻耕的审判图景。
- source_word: עִיִּים
  choice: 废墟
  rationale: 该复数名词表示废墟或瓦砾堆；“废墟”是准确、简明的现代汉语。
- source_word: וְהַר הַבַּיִת
  choice: 圣殿所在的山
  rationale: 字面为“这殿的山”，语境中的“殿”指雅威的圣殿。译文使所指清楚，同时以脚注注明其通常称谓。
- source_word: לְבָמוֹת יָעַר
  choice: 变成林木覆盖的高冈
  rationale: בָּמוֹת可指高处或高冈，יַעַר指树林。此处描绘圣殿山荒废后成为林木丛生的高地；译法保留地貌意象，不把בָּמוֹת限定解释为异教丘坛。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名。正文采用接近YHWH传统学术读音的“雅威”，以保留专名性质；脚注提供华语传统译名。
- issue: 称号צְבָאוֹת的译法
  choice: 万军
  alternative: 万军之主／万军之耶和华
  rationale: צְבָאוֹת是复数，基本义为军队或众军。“万军”保留其具体、威严并带有军事色彩的含义，不另加原文没有的“主”。
- issue: בָּמוֹת在末句中的含义
  choice: 高冈
  alternative: 高处／丘坛
  rationale: 该词有时指敬拜用的“丘坛”，但与יַעַר连用时也可表示林中的高地。正文保留地貌意义，并在脚注列出较贴近形式的替代译法，避免断定这里专指异教设施。
translation_notes:
  register: 采用现代、庄重而易懂的叙事与宣告体。保留“在……的日子”和“如此说”等经文语体，但避免过度古雅；预言部分用“必”体现确定的将来审判。
