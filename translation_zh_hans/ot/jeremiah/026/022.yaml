base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/026/022.yaml
  text: 'Then King Jehoiakim sent men to Egypt: Elnathan son of Achbor[a], and men with him, to Egypt.'
translation:
  language: zh_hans
  text: 于是，约雅敬王派人到埃及去：亚革波的儿子以利拿单和随行的人，到埃及去。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来原文在句末再次说“到埃及去”，指以利拿单和随行的人的目的地；译文保留了这一重复。
    reason: 原文重复
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: 于是……派
  rationale: שׁלח在这里表示差派；“派”符合奉王命执行任务的语境，“于是”体现叙事中连续推进的语气。
- source_word: הַמֶּלֶךְ יְהוֹיָקִים
  choice: 约雅敬王
  rationale: 采用现代汉语中自然的“姓名＋王”称谓结构。
- source_word: אֲנָשִׁים
  choice: 人
  rationale: 原词在此指受派执行任务的人员；汉语“人”自然，并不额外强调原文在本语境中未着重突出的性别。
- source_word: מִצְרַיִם
  choice: 埃及
  rationale: 采用该地名的标准中文译名。
- source_word: אֵת
  choice: 就是
  rationale: 该词是直接宾语标记，后文具体说明所派的人；“就是”自然呈现这种解释、指明关系。
- source_word: אֶלְנָתָן בֶּן עַכְבּוֹר
  choice: 亚革波的儿子以利拿单
  rationale: 按希伯来语父子关系表达，并采用通行的圣经人名音译。
- source_word: וַאֲנָשִׁים אִתּוֹ
  choice: 和跟他一起的人
  rationale: 贴近原文“以及与他同在的人”，不擅自加入“其他”等原文未明说的成分。
- source_word: אֶל מִצְרַיִם
  choice: 到埃及去
  rationale: אֶל表示目的地；译文保留句末再次出现的目的地，以反映希伯来文本的重复。
