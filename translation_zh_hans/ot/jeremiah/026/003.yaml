  to: 或许他们会听从[a]，各人从自己的恶道回转[b]；我就会对我因他们恶行而计划降给他们的灾祸改变心意[c]。
  rationale: 修订将“从自己的恶道回转”连贯译出，明确保留原文的方向性隐喻；将神的נחם译为“对……灾祸改变心意”，使其所指对象和条件关系清晰，同时不把神学解释强加给文本。脚注c删除“已经宣告”这一超出本节直接措辞的限定。
