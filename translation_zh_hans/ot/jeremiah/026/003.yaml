  text: אוּלַ֣י יִשְׁמְע֔וּ וְ/יָשֻׁ֕בוּ אִ֖ישׁ מִ/דַּרְכּ֣/וֹ הָ/רָעָ֑ה וְ/נִחַמְתִּ֣י אֶל הָ/רָעָ֗ה אֲשֶׁ֨ר אָנֹכִ֤י חֹשֵׁב֙ לַ/עֲשׂ֣וֹת לָ/הֶ֔ם מִ/פְּנֵ֖י רֹ֥עַ מַעַלְלֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/026/003.yaml
  text: Perhaps they will listen[a], and each man will turn from his evil way[c][b], and I will relent concerning the disaster that I am planning to bring on them because of the evil of their deeds.
translation:
  language: zh_hans
  text: 或许他们会听从[a]，各人从自己的恶道回转[b]；我就会对我因他们恶行而计划降给他们的灾祸改变心意[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“听见”；这里的希伯来语动词既可指听见，也可指听从。
    reason: lexical_alternative
  - marker: b
    text: “回转”也可译作“转回”或“悔改”。
    reason: lexical_alternative
  - marker: c
    text: 或译“我会转意，不降下灾祸”。原文以描述人的语言表达神不施行所计划的审判。
    reason: lexical_alternative
lexical_decisions:
- source_word: אוּלַי
  choice: 或许
  rationale: 自然表达可能与盼望，保留希伯来语语气词的开放性，不额外解释神的认知。
- source_word: יִשְׁמְעוּ
  choice: 听从
  rationale: שׁמע在先知劝告的语境中兼有听见与听命之意；“听从”突出回应信息的含义，另以脚注保留“听见”。
- source_word: וְיָשֻׁבוּ
  choice: 回转
  rationale: 保留שׁוב“转回、返回”的方向性隐喻，并由后面的“离开自己的恶道”说明其道德含义。
- source_word: אִישׁ
  choice: 各人
  rationale: 体现单数名词在群体中的逐一分配意义，现代汉语自然且不无必要地限定性别。
- source_word: מִדַּרְכּוֹ הָרָעָה
  choice: 离开自己的恶道
  rationale: “恶道”保留דרך所表达的人生道路隐喻；“自己的”对应第三人称单数所属形式。
- source_word: וְנִחַמְתִּי
  choice: 我也会转意
  rationale: נחם用于神与审判的语境时，表示转意而不施行已经宣告的灾祸；此译保留经文所用的人际化表达及其真实张力。
- source_word: אֶל הָרָעָה
  choice: 不降下……灾祸
  rationale: 此处רעה不是道德上的邪恶，而是将临的灾难；结合נחם译出撤回灾祸的语义，使汉语完整自然。
- source_word: חֹשֵׁב לַעֲשׂוֹת לָהֶם
  choice: 计划降给他们
  rationale: חשב加不定式表示筹划或意图；“降给”按汉语习惯表达向人施行灾祸。
- source_word: מִפְּנֵי רֹעַ מַעַלְלֵיהֶם
  choice: 因他们所行的恶
  rationale: מִפְּנֵי在此表示原因，מעללים指行为或作为；这一表达简洁保留其行为之恶是审判缘由的意思。
theological_decisions:
- issue: 如何翻译神的נחם
  choice: 我也会转意，不降下……灾祸
  alternative: 我会后悔／我会改变主意
  rationale: 经文描述神因人回转而不施行预告的审判。“转意”保留这种真实的条件性和拟人化语言，却不暗示神犯了道德错误；脚注说明另一种直译，以免消除原文的神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“听从”“回转”“恶道”保留先知话语的劝诫色彩；分号清楚呈现人的回应与神转意之间的条件关系。所有脚注标记均置于相关词语之后。
