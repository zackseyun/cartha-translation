id: JER.50.3
reference: Jeremiah 50:3
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כִּ֣י עָלָה֩ עָלֶ֨י/הָ גּ֜וֹי מִ/צָּפ֗וֹן הֽוּא יָשִׁ֤ית אֶת אַרְצָ/הּ֙ לְ/שַׁמָּ֔ה וְ/לֹֽא יִהְיֶ֥ה יוֹשֵׁ֖ב בָּ֑/הּ מֵ/אָדָ֥ם וְ/עַד בְּהֵמָ֖ה נָ֥דוּ הָלָֽכוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/003.yaml
  text: For a nation has come up against her from the north; it will make her land a desolation[a], and there will be no inhabitant in it. From man to beast, they have fled; they have gone away.
translation:
  language: zh_hans
  text: 因为有一国从北方上来攻击她；那国必使她的土地荒凉，无人居住。从人到牲畜，全都逃走，离去了。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，说明宣告巴比伦倾覆的原因；现代汉语用“因为”自然保留解释关系。
- source_word: עָלָה עָלֶיהָ
  choice: 上来攻击她
  rationale: עלה与על连用在此表示敌对的军事进逼；“上来攻击”既保留“上来”的意象，也明确敌意。
- source_word: גּוֹי
  choice: 一国
  rationale: 此处指实施入侵的政治共同体，而非泛指族群。
- source_word: מִצָּפוֹן
  choice: 从北方
  rationale: 直接保留耶利米书中常见的入侵来源方位。
- source_word: הוּא
  choice: 那国
  rationale: 希伯来语代词回指“一国”；汉语重复名词比使用有性别色彩的代词更清楚。
- source_word: יָשִׁית אֶת אַרְצָהּ לְשַׁמָּה
  choice: 必使她的土地荒凉
  rationale: שׂים加结果成分表示使某物进入某种状态；“荒凉”准确表达שַׁמָּה在这里的毁坏、荒废之意。
- source_word: וְלֹא יִהְיֶה יוֹשֵׁב בָּהּ
  choice: 无人居住
  rationale: 简洁表达其中将没有居民的彻底荒无人烟状态。
- source_word: מֵאָדָם וְעַד בְּהֵמָה
  choice: 从人到牲畜，全都
  rationale: 保留“从……到……”的总体范围表达，并以“全都”使汉语读者清楚看出人和牲畜均在内。
- source_word: נָדוּ הָלָכוּ
  choice: 逃走，离去了
  rationale: 两个完成式动词叠加强调彻底离开；前者在灾祸语境中可指逃离，后者补充最终离去。
theological_decisions:
- issue: אָדָם在涵盖全部生灵的固定表达中的译法
  choice: 人
  alternative: 人类；男人
  rationale: 此处אָדָם与“牲畜”相对，泛指人而不专指男性；现代汉语“人”准确保留总体含义，也不引入经文没有的性别限定。
- issue: 巴比伦的阴性拟人化
  choice: 她
  alternative: 它
  rationale: אַרְצָהּ及בָּהּ的阴性后缀回指上下文中的巴比伦；用“她”保留先知话语中的拟人色彩。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。保留“从北方上来”和巴比伦的阴性拟人化；末句用两个动词呈现原文重复加强的离去含义。英文咨询层所列脚注内容与“荒凉”并不对应，疑为标记错置，因此中文正文不设置无根据的脚注。
