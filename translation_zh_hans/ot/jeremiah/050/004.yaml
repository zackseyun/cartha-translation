revisions:
- from: 在那些日子，在那时候——这是雅威的宣告——以色列人和犹大人[a]将一同前来。他们边走边哭，一路走来[b]，并要寻求雅威他们的上帝。
  to: 在那些日子，在那时候——这是雅威的宣告——以色列人和犹大人[a]将一同前来。他们一面前行，一面哭泣，不断前行[b]，并要寻求雅威他们的上帝。
  rationale: 仅修正“走来”所引入的无据方向性及其回顾性语感，改用“不断前行”保留希伯来文动词重复所表达的持续与加强。其余译法可维持。
