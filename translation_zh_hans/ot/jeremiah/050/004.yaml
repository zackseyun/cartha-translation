language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: בַּ/יָּמִ֨ים הָ/הֵ֜מָּה וּ/בָ/עֵ֤ת הַ/הִיא֙ נְאֻם יְהוָ֔ה יָבֹ֧אוּ בְנֵֽי יִשְׂרָאֵ֛ל הֵ֥מָּה וּ/בְנֵֽי יְהוּדָ֖ה יַחְדָּ֑ו הָל֤וֹךְ וּ/בָכוֹ֙ יֵלֵ֔כוּ וְ/אֶת יְהוָ֥ה אֱלֹהֵי/הֶ֖ם יְבַקֵּֽשׁוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/004.yaml
  text: In those days and at that time[a], declares Yahweh, the children of Israel will come, they and the children of Judah together. Going and weeping, they will go[b], and they will seek Yahweh their God.
translation:
  language: zh_hans
  text: 在那些日子，在那时候——这是雅威的宣告——以色列人和犹大人[a]将一同前来。他们一面前行，一面哭泣，不断前行[b]，并要寻求雅威他们的上帝。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “以色列人”和“犹大人”，希伯来文直译为“以色列的儿女”和“犹大的儿女”，指这两个群体的成员。
    reason: 说明原文的亲属性群体称谓。
  - marker: b
    text: 希伯来文重复“前行”的意思，直译近似“前行着、哭泣着，他们将前行”，表现他们在哭泣中持续前行。
    reason: 说明原文以不定式绝对形配合限定动词所形成的重复和持续意味。
lexical_decisions:
- source_word: בַּיָּמִים הָהֵמָּה וּבָעֵת הַהִיא
  choice: 在那些日子，在那时候
  rationale: 保留希伯来文并列的双重时间表达，不把两句压缩成一句；这种表述也延续先知预言的庄重语气。
- source_word: נְאֻם יְהוָה
  choice: 这是雅威的宣告
  rationale: 以自然、庄重的现代汉语表达先知书常见的神谕公式，并将其作为插入语处理。
- source_word: יָבֹאוּ
  choice: 将一同前来
  rationale: “前来”保留动作方向，同时不擅自补出希伯来文未说明的目的地；“将”体现此处预告性的语境。
- source_word: בְנֵי יִשְׂרָאֵל ... וּבְנֵי יְהוּדָה
  choice: 以色列人和犹大人
  rationale: 采用现代汉语自然的群体称谓；脚注说明原文的亲属性表达，以免其意象完全隐没。
- source_word: הֵמָּה ... יַחְדָּו
  choice: 以色列人和犹大人将一同前来
  rationale: “一同”明确保留两个群体共同归来的重点；汉语中不机械复制复指代词“他们”，以免句子生硬。
- source_word: הָלוֹךְ וּבָכוֹ יֵלֵכוּ
  choice: 他们边走边哭，一路走来
  rationale: 用“边走边哭”表达哭泣伴随行程持续发生，并用“一路走来”部分保留原文重复“走”的加强效果。
- source_word: וְאֶת יְהוָה אֱלֹהֵיהֶם יְבַקֵּשׁוּ
  choice: 并要寻求雅威他们的上帝
  rationale: “寻求”保留 בקשׁ 可能包含寻找、转向及敬拜追求的宽广含义，不将其窄化为某一种神学解释。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名；音译“雅威”使它作为以色列上帝之专名的性质清楚可见，而不以称号取代。
- issue: 以色列与犹大的共同复兴
  choice: 分别保留“以色列人”和“犹大人”，并译出“一同”
  alternative: 概括为“全以色列”；解释为其他后来的宗教群体
  rationale: 原文明确区分两个群体，同时强调他们共同前来；译文保留这一历史与盟约层面的张力，不引入后来的体系化解释。
- issue: “寻求”雅威的具体含义
  choice: 保留宽泛的“寻求”
  alternative: 明确译为“悔改归向”“敬拜”或“求问”
  rationale: 上下文允许这些观念有所关联，但本节动词本身没有把意义限定为其中一种，因此不在正文中替作者作出选择。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。开头保留双重时间短语；主体避免生硬照搬希伯来语序，但借脚注交代亲属性称谓与“走”的重复。神名统一译作“雅威”。
