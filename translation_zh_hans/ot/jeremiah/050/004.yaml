    issue: “一路走来”改变了动词的方向和时态语感。
    rationale: 希伯来文 הָלוֹךְ וּבָכוֹ יֵלֵכוּ 以不定式绝对形加未完成式强调、延续“走/前行”；并未说“走来”，也不是回顾既成的“一路走来”。译为“不断前行”既不补加方向，也保留重复的持续加强。
