id: JER.50.8
reference: Jeremiah 50:8
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: נֻ֚דוּ מִ/תּ֣וֹךְ בָּבֶ֔ל וּ/מֵ/אֶ֥רֶץ כַּשְׂדִּ֖ים יצאו וִ/הְי֕וּ כְּ/עַתּוּדִ֖ים לִ/פְנֵי צֹֽאן־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/008.yaml
  text: Flee from the midst of Babylon[a], and go out from the land of the Chaldeans; and be like male goats before the flock.
translation:
  language: zh_hans
  text: 你们要从巴比伦中逃走，离开迦勒底人的土地；要像走在羊群前面的公山羊。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נֻדוּ
  choice: 逃走
  rationale: 该命令在巴比伦将受审判的语境中带有紧迫离去之意；“逃走”比“迁离”或“游走”更自然地传达其语用力度。
- source_word: מִתּוֹךְ בָּבֶל
  choice: 从巴比伦中
  rationale: 保留“从……内部”的空间意象，同时符合现代汉语表达。
- source_word: וּמֵאֶרֶץ כַּשְׂדִּים יצאו
  choice: 离开迦勒底人的土地
  rationale: יצאו 形式上为第三人称复数，但在连续劝令中承接前一命令，按命令语气处理；“迦勒底人的土地”保留原文的民族属格表达。
- source_word: וִהְיוּ כְּעַתּוּדִים
  choice: 要像……公山羊
  rationale: עַתּוּדִים 指雄性的山羊；“公山羊”准确且为现代读者熟悉。“要像”自然表达比较结构及劝令语气。
- source_word: לִפְנֵי צֹאן
  choice: 走在羊群前面的
  rationale: לִפְנֵי 的基本空间意义是“在……前面”；加入“走在”使汉语比喻自然，同时不把原文进一步解释为“率领”。
- source_word: צֹאן
  choice: 羊群
  rationale: 该词泛指成群的小型牲畜；在公山羊走在前面的比喻中，“羊群”简明自然。
theological_decisions:
- issue: 走在羊群前面的公山羊是否明确表示领袖身份
  choice: 保留空间图像“走在羊群前面”
  alternative: 译作“带领羊群的公山羊”
  rationale: 原文明确表达位于羊群之前，但未使用“带领”的动词；避免把可能隐含的带领意义提升为明说。
translation_notes:
  register: 采用现代、庄重而易懂的命令句。以分号衔接离开巴比伦与走在群体前面的比喻；不添加原文未明说的对象或神学解释。
