  text: עַל הָ/אָ֤רֶץ מְרָתַ֨יִם֙ עֲלֵ֣ה עָלֶ֔י/הָ וְ/אֶל יוֹשְׁבֵ֖י פְּק֑וֹד חֲרֹ֨ב וְ/הַחֲרֵ֤ם אַֽחֲרֵי/הֶם֙ נְאֻם יְהוָ֔ה וַ/עֲשֵׂ֕ה כְּ/כֹ֖ל אֲשֶׁ֥ר צִוִּיתִֽי/ךָ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/021.yaml
  text: Go up against the land of Merathaim[a], against it, and against the inhabitants of Pekod. Put them to the sword and devote them to destruction after them, declares Yahweh[c][b], and do all that I have commanded you.
translation:
  language: zh_hans
  text: 你要上去攻打米拉泰音之地[a]，攻打那地和比割的居民[b]；要用刀杀戮，随后将他们尽行毁灭[c]。这是耶和华的宣告。你要照我所吩咐你的一切去做。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “米拉泰音”可能是指巴比伦的象征性名称；希伯来语读来可使人联想到“双重悖逆”，也可能使人想到“双重苦楚”。
    reason: lexical_alternative
  - marker: b
    text: “比割”是地名或族群名；这个名称也可能呼应一个含有“追讨、惩罚”或“临到”之意的希伯来词根。
    reason: lexical_alternative
  - marker: c
    text: “尽行毁灭”也可译为“置于禁毁之下”，指把某物交付毁灭。原文此处直译为“在他们之后”；也可能理解为“随后”，其具体关系并不完全确定。
    reason: lexical_alternative
lexical_decisions:
- source_word: מְרָתַיִם
  choice: 米拉泰音
  rationale: 按专名音译，以保留其作为地名的句法功能；其可能指巴比伦，并含有“双重悖逆”或“双重苦楚”的双关，交由脚注说明。
- source_word: עֲלֵה עָלֶיהָ
  choice: 上去攻打那地
  rationale: עלה在军事语境中可指上去进攻；“上去攻打”既保留希伯来语方向性，也符合现代汉语战事表达。
- source_word: יוֹשְׁבֵי פְּקוֹד
  choice: 比割的居民
  rationale: 将פְּקוֹד视为地方或族群专名，并采用汉语圣经传统中较为人熟悉的译名“比割”；其与“追讨、惩罚、临到”相关的词根呼应在脚注中保留。
- source_word: חֲרֹב
  choice: 用刀杀戮
  rationale: 上下文是军事审判命令，此词表达强烈的杀灭行动；“用刀杀戮”明确呈现其刀剑与战争语境，不以较弱的“击败”淡化。
- source_word: וְהַחֲרֵם
  choice: 把他们尽行毁灭
  rationale: חרם的使役形表示将对象置于禁毁之下、献作毁灭；正文采用可理解的“尽行毁灭”，脚注补明其专门含义。
- source_word: אַחֲרֵיהֶם
  choice: 追在他们后面
  rationale: 直译为“在他们后面／随后追着他们”；此处句法和具体关系不完全明确，正文保留追赶意味，脚注说明也可能理解为“在他们之后／随后”。
- source_word: נְאֻם יְהוָה
  choice: 这是耶和华的宣告
  rationale: 以庄重、自然的现代汉语呈现先知书常见的神谕公式，并将神名יְהוָה译为“耶和华”。
- source_word: וַעֲשֵׂה כְּכֹל אֲשֶׁר צִוִּיתִיךָ
  choice: 你要照我所吩咐你的一切去做
  rationale: 保留כְכֹל的全面性和命令语气，同时使中文流畅清楚。
theological_decisions:
- issue: 是否弱化战争审判与禁毁用语
  choice: 保留“用刀杀戮”和“尽行毁灭”的强烈措辞
  alternative: 笼统译作“击败”或“毁坏”
  rationale: 原文同时使用战争杀戮和חרם禁毁术语；弱化会遮蔽经文中严厉的神圣审判及其张力。
- issue: 象征性地名应音译还是意译
  choice: 正文保留专名“米拉泰音”和“比割”，脚注说明可能的双关
  alternative: 正文直接译为“双重悖逆之地”和“惩罚之民”等
  rationale: 两词在句中发挥专名作用，但又可能具有针对巴比伦的象征性双关；音译配脚注可避免武断判定它们只有地理意义或只有象征意义。
- issue: 如何处理אַחֲרֵיהֶם的含混关系
  choice: 译作“追在他们后面”，并以脚注保留“随后”的可能
  alternative: 明确改写为“追杀他们”或“在他们之后毁灭其余的人”
  rationale: 原文短语简略，所修饰的动作及其具体含义并不完全确定；译文不把一种解释伪装成唯一含义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留先知战争神谕的命令力度，避免古奥的“剪除”“灭绝净尽”等表达；专名在正文音译，词源双关和句法歧义放入脚注。所有脚注标记均紧随相关正文内容。
