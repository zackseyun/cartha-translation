  text: חֹ֥רֶב אֶל מֵימֶ֖י/הָ וְ/יָבֵ֑שׁוּ כִּ֣י אֶ֤רֶץ פְּסִלִים֙ הִ֔יא וּ/בָ/אֵימִ֖ים יִתְהֹלָֽלוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/038.yaml
  text: A drought is against her waters[a], and they will dry up, for it is a land of carved idols[b], and they are mad over terrifying things.
translation:
  language: zh_hans
  text: 干旱临到她的众水[a]，众水必干涸；因为她是雕刻偶像之地，人们因那些可怖之物而癫狂[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “干旱”也可按相同的希伯来文辅音另读作“刀剑”：刀剑临到她的众水。所给马所拉标音为“干旱”；但此处也可能有意呼应上下文“刀剑临到……”的审判宣告。
    reason: alternative_reading
  - marker: b
    text: “人们因那些可怖之物而癫狂”也可译作“他们为可怖的偶像而发狂”或“他们因恐怖之事而狂乱”。
    reason: lexical_alternative
lexical_decisions:
- source_word: חֹרֶב
  choice: 刀剑
  rationale: 该词形可理解为“刀剑”，也可能表示“干旱、干燥”。耶利米书50:35起连续使用“刀剑临到……”的审判句式，因此正文采用“刀剑”；下句“众水就必干涸”同时保留与“干旱”义的呼应。
- source_word: אֶל
  choice: 临到
  rationale: 在审判宣告中，表示灾祸针对某对象；“临到”既自然又符合先知性语体。
- source_word: מֵימֶיהָ
  choice: 她的众水
  rationale: 阴性单数后缀承接拟人化的巴比伦；“众水”也体现希伯来语复数形式，可能涵盖河流、水道和水源。
- source_word: וְיָבֵשׁוּ
  choice: 众水就必干涸
  rationale: Qal未完成式以“众水”为主语，表达审判的确定结果；“干涸”是现代汉语描述水体枯竭的自然说法。
- source_word: כִּי
  choice: 因为
  rationale: 引出审判的理由。
- source_word: אֶרֶץ פְּסִלִים
  choice: 雕刻偶像之地
  rationale: פְּסִלִים具体指雕刻而成的像，语境中明确具有偶像含义；此译法兼顾具体形态与宗教语义。
- source_word: וּבָאֵימִים
  choice: 因那些可怖之物
  rationale: אֵימִים可指“恐怖、可怖之物”，也可能在本语境中特指形貌可畏的偶像。正文保留所指对象的开放性。
- source_word: יִתְהֹלָלוּ
  choice: 癫狂
  rationale: 此处词形表达失常、狂乱的行为状态。“癫狂”简洁庄重，并能传达拜偶像所表现的狂热与失去理性，而不误解为单纯夸口。
theological_decisions:
- issue: חֹרֶב究竟指“刀剑”还是“干旱”
  choice: 正文译作“刀剑”，脚注保留“干旱”读法
  alternative: 干旱临到她的众水，众水就必干涸
  rationale: 上下文50:35—37反复出现“刀剑临到……”的公式，支持正文采用“刀剑”；但本节对象是水，且随后说水必干涸，因此“干旱”在词义和语境上同样真实可行，甚至可能构成有意双关，不宜消除。
- issue: אֵימִים所指为何
  choice: 译作开放性的“可怖之物”
  alternative: 可怖的偶像／恐怖之事
  rationale: 紧邻“雕刻偶像之地”使其很可能指可怖的偶像，但希伯来词本身并未明确重复“偶像”；正文不把可能的指涉提升为确定含义。
translation_notes:
  register: 采用现代、庄重而易懂的先知宣告语体。“刀剑临到”延续上下文重复的审判句式；“她”保留巴比伦作为女性形象的拟人表达。正文中的[a]、[b]均与脚注对应。
