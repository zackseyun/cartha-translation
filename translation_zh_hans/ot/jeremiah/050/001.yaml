base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/001.yaml
  text: 'The word that Yahweh spoke concerning Babylon[a], concerning the land of the Chaldeans[b], by the hand of Jeremiah the prophet:'
translation:
  language: zh_hans
  text: 雅威借着先知耶利米[b]所说、论到巴比伦[a]，论到迦勒底人之地的话：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“攻击巴比伦，攻击迦勒底人之地”。这里的希伯来介词可引出针对某国的神谕；正文按标题的宽泛含义译作“论到”。
    reason: alternative_reading
  - marker: b
    text: 希伯来文直译为“借先知耶利米的手”，是表示媒介或代理的习语，意思是“借着先知耶利米”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַדָּבָר
  choice: 话
  rationale: דָּבָר可指“话、信息、事情”；在先知书标题中译作“话”，既保留公式化表达，也符合现代汉语习惯。
- source_word: דִּבֶּר
  choice: 所说的
  rationale: דבר在此表示“说、讲说”。采用“所说的”与前面的关系从句自然衔接，并贴近希伯来文。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见音译呈现四字神名，而不以称号代替专名。
- source_word: אֶל
  choice: 论到
  rationale: 先知性标题中的אֶל可引出神谕所涉及的对象。“论到”保持中性，不预先将其限定为“攻击”。原文两次使用该介词，译文也重复“论到”。
- source_word: בָּבֶל
  choice: 巴比伦
  rationale: 采用该地名的现代汉语标准译名。
- source_word: אֶרֶץ כַּשְׂדִּים
  choice: 迦勒底人之地
  rationale: 按构词关系直译为“迦勒底人之地”，保留原文的族群—地域表达，而不改写为较具解释性的“迦勒底”。
- source_word: בְּיַד
  choice: 借着
  rationale: 该短语字面为“借……的手”，在此表达先知作为传话媒介或代理者。正文译作自然的现代汉语“借着”，字面形式在脚注说明。
- source_word: יִרְמְיָהוּ הַנָּבִיא
  choice: 先知耶利米
  rationale: 采用人名的标准汉语译法，并将身份称谓前置，符合自然汉语语序。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名；音译“雅威”保留其专名性质，不用称号“主”取代。
- issue: 先知书标题中אֶל的语气
  choice: 论到
  alternative: 攻击；针对
  rationale: 虽然下文包含审判信息，但该介词在标题中可宽泛地标明神谕对象。“论到”保留其语义空间，避免在标题中提前确定敌对语气。
- issue: בְּיַד所表达的先知中介作用
  choice: 借着先知耶利米
  alternative: 借先知耶利米之手
  rationale: 该习语表明雅威借耶利米传达话语。正文使用自然汉语，但不把耶利米改写成话语的最终来源。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。重复“论到”以反映原文两次出现的介词；“借着”则将希伯来习语自然化，并用脚注保留其字面形式。句末冒号表明本节是随后神谕的标题。
