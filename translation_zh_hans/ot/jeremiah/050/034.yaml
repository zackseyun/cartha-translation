  text: גֹּאֲלָ֣/ם חָזָ֗ק יְהוָ֤ה צְבָאוֹת֙ שְׁמ֔/וֹ רִ֥יב יָרִ֖יב אֶת רִיבָ֑/ם לְמַ֨עַן֙ הִרְגִּ֣יעַ אֶת הָ/אָ֔רֶץ וְ/הִרְגִּ֖יז לְ/יֹשְׁבֵ֥י בָבֶֽל׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/034.yaml
  text: Their Redeemer is strong[a]; Yahweh of Armies is his name. He will surely plead their case[d][c][b], so that he may give rest to the earth and bring unrest to the inhabitants of Babylon.
translation:
  language: zh_hans
  text: 他们的救赎主大有能力；他的名是万军之耶和华。他必定为他们申辩，使大地得安宁，并使巴比伦的居民不安。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: גֹּאֲלָם
  choice: 救赎他们的那一位
  rationale: גאל指为亲属履行赎回、解救或伸冤责任的人。正文采用自然清楚的表达，并以脚注保留其亲属法律内涵。
- source_word: חָזָק
  choice: 大有能力
  rationale: חָזָק表示强壮、有力；“大有能力”适合描述施行救赎者，也符合先知书庄重的语体。
- source_word: יְהוָה צְבָאוֹת
  choice: 万军之耶和华
  rationale: 直译神名及其称号；“万军”保留צְבָאוֹת的军旅意象，也承接现代中文圣经的通行表达。
- source_word: רִיב יָרִיב אֶת רִיבָם
  choice: 他必为他们力争
  rationale: 同根名词与动词相连，并借不定式绝对形加强语气。“必”体现强调，“为他们力争”保留法律争讼与维护其案件的含义。
- source_word: הִרְגִּיעַ אֶת הָאָרֶץ
  choice: 使大地得安宁
  rationale: 使役形表达使之平静、安歇；“大地”保留הָאָרֶץ可能具有的广阔范围。
- source_word: וְהִרְגִּיז לְיֹשְׁבֵי בָבֶל
  choice: 却使巴比伦的居民不得安宁
  rationale: רגז的使役形表示使骚动、震颤或不安。以“不得安宁”自然呈现其与前句“得安宁”的鲜明反差；“却”明示希伯来语并列结构在语义上的转折。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 正文采用现代中文读者最熟悉的专名形式，并不以“主”替代原文神名；“雅威”是较接近学术重构读音的可选译法。
- issue: הָאָרֶץ的范围
  choice: 大地
  alternative: 这地
  rationale: 该词既可指全地，也可指特定地域。此处巴比伦受扰与其余范围得安宁形成对照，正文保留较广的“大地”，脚注说明地域性译法。
- issue: ריב的法律意象
  choice: 为他们力争
  alternative: 为他们申辩
  rationale: 原文可兼有争讼、辩护和维护案件之意；正文不把上帝的角色限定为单纯辩护者，而保留积极争辩、伸张其诉求的张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“得安宁／不得安宁”重现原文两个使役动词之间的修辞反差；正文避免生硬的法律术语，同时通过脚注保存亲属救赎、争讼和“地／大地”的歧义。
