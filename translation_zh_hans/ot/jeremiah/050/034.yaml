    reason: lexical_alternative
  - marker: b
    text: “万军之耶和华”也可译作“万军之雅威”；“万军”带有天上或地上军队的意象。
    reason: lexical_alternative
  - marker: c
    text: 或译：“他必定为他们的案件争讼。”原文重复同一词根，以加强争讼、维护其案件的语气。
    reason: lexical_alternative
  - marker: d
    text: “大地”也可译作“土地”或“全地”。
    reason: alternative_reading
