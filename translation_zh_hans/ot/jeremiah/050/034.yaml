revisions:
- from: 救赎他们的那一位大有能力[a]；他的名是万军之耶和华[b]。他必为他们力争[c]，使大地得安宁[d]，却使巴比伦的居民不得安宁。
  to: 他们的救赎主大有能力；他的名是万军之耶和华。他必定为他们申辩，使大地得安宁，并使巴比伦的居民不安。
  rationale: 修订使中文更凝练、庄重，并更明确保留ריב的法律申辩含义和不定式绝对形所带来的强调。将“却”改为“并”避免把原文普通并列连词译得过强，同时安宁／不安的词语对照仍然清楚。脚注b和d改正了神名构造及“地／土地”的语义范围说明。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T07:30:46Z'
review_pass:
  verdict: revise
  source_fidelity: 正文准确传达了“他们的救赎者强大”“万军之耶和华”“必定为他们争讼”以及使大地安宁、使巴比伦居民不安的对照。需避免用“却”把原文的并列连词明确限定为转折；脚注b的“军队之主雅威”也未准确对应原文的神名构造。
  naturalness: “救赎他们的那一位”可懂，但“他们的救赎主”在现代庄重汉语中更凝练自然。“为他们力争”略偏口语，改为“必定为他们申辩”能更清楚体现争讼语境。
  terminology: “万军之耶和华”是自然且通行的神名称号译法；保留“救赎主”并以脚注说明其亲属—法律背景，既准确也不将该背景过度纳入正文。
  issues:
  - severity: medium
    issue: 脚注b的替代译文“军队之主雅威”不准确对应“万军之耶和华”。
    rationale: 原文为“YHWH of armies”，若以“雅威”替代神名，应为“万军之雅威”；“军队之主”另行加入“主”的称号，改变了原有构造。
  - severity: low
    issue: 正文“却使”把原文的并列连接明确化为逆转关系。
    rationale: 上下文确有安宁与不安的修辞对照，但希伯来文连接词本身是普通并列。用“并使”既保留对照，也不额外限定句法关系。
  - severity: low
    issue: 脚注d以“这地／此地”说明歧义不够准确。
    rationale: הָאָרֶץ的核心歧义是“地／大地”与“土地（某地）”的范围，而非指示词“这／此”。
  revised_text: 他们的救赎主大有能力；他的名是万军之耶和华。他必定为他们申辩，使大地得安宁，并使巴比伦的居民不安。
  revised_footnotes:
