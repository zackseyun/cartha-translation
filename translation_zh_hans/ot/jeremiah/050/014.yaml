  text: עִרְכ֨וּ עַל בָּבֶ֤ל סָבִיב֙ כָּל דֹּ֣רְכֵי קֶ֔שֶׁת יְד֣וּ אֵלֶ֔י/הָ אַֽל תַּחְמְל֖וּ אֶל חֵ֑ץ כִּ֥י לַֽ/יהוָ֖ה חָטָֽאָה־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/014.yaml
  text: Draw up against Babylon all around, all you who bend the bow; shoot at her; do not spare an arrow, for she has sinned against Yahweh.
translation:
  language: zh_hans
  text: 凡拉弓的，都要在巴比伦四周列阵攻击她；向她射箭，不要吝惜一箭，因为她得罪了雅威。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עִרְכוּ עַל־בָּבֶל סָבִיב
  choice: 要在巴比伦四周列阵攻击她
  rationale: עִרְכוּ在军事语境中指排开阵势、列阵；עַל表达敌对方向，סָבִיב表示从四周包围。译文兼顾军事画面和现代汉语的自然表达。
- source_word: כָּל־דֹּרְכֵי קֶשֶׁת
  choice: 凡拉弓的
  rationale: 希伯来语字面为“凡踩弓的”，所指是张弓射箭的人。古代强弓有时需用脚踩住来上弦；译作“拉弓的”保留具体意象，也比笼统的“弓箭手”更贴近原文。
- source_word: יְדוּ אֵלֶיהָ
  choice: 向她射箭
  rationale: ידה的使役形在此射箭语境中意为“射”；阴性单数代词指被拟人化的巴比伦，因此译作“她”。
- source_word: אַל־תַּחְמְלוּ אֶל־חֵץ
  choice: 一支箭也不要留下
  rationale: חמל含“怜惜、饶惜、不肯耗用”之意；以“箭”为对象时，命令的意思是不要节省箭矢。原文单数חֵץ可作集合性理解，中文用“一支箭也不要留下”自然传达彻底攻击的语气。
- source_word: כִּי לַיהוָה חָטָאָה
  choice: 因为她得罪了雅威
  rationale: כי引出攻击的理由；חטא与介词ל连用时表示得罪某人、向某人犯罪。完成式阴性单数以“她得罪了”表达，主语仍是拟人化的巴比伦。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名。采用“雅威”作为较贴近该名通常学术重构读音、且在现代中文中可辨识的音译，不以称号替代专名。
- issue: 巴比伦犯罪的对象
  choice: 她得罪了雅威
  alternative: 她向雅威犯罪了
  rationale: 介词ל在חטא的搭配中标明受冒犯的对象。“得罪了”准确传达敌对、冒犯的关系，同时保持自然现代汉语，并未把原文理解为只是未达某种抽象标准。
translation_notes:
  register: 采用庄重而清晰的现代标准汉语。命令句保持紧迫有力；“列阵”“箭”等词符合战争语境而不过分古雅。用“她”延续希伯来文对巴比伦城的阴性拟人化。
