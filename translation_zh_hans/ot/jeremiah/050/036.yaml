base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/036.yaml
  text: A sword is against the diviners[a], and they will become fools; a sword is against her warriors[b], and they will be dismayed.
translation:
  language: zh_hans
  text: 刀剑临到占卜者[a]，他们必变得愚妄；刀剑临到巴比伦的勇士，他们必惊惶[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“说谎的人”。希伯来语这个词也可泛指说虚假之言或欺骗人的人。
    reason: lexical_alternative
  - marker: b
    text: “惊惶”也可译作“崩溃”或“被击垮”；原词既可指恐惧失措，也可指遭受击垮。
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶרֶב אֶל
  choice: 刀剑临到
  rationale: 保留先知审判宣告的简短有力；“临到”在现代汉语圣经语体中自然表达刀剑所指向的敌对对象。
- source_word: הַבַּדִּים
  choice: 占卜者
  rationale: 该词可指说虚假之言的人或骗子；在耶利米书论及巴比伦的语境中，也可特指作虚假预言、占卜的人，因此正文采用“占卜者”，并以脚注保留较宽泛的词义。
- source_word: וְנֹאָלוּ
  choice: 他们就愚昧了
  rationale: 此处动词表达变得愚昧或显为愚昧；译文保留其结果意味，而不增添“被证明”等原文未明说的成分。
- source_word: גִּבּוֹרֶיהָ
  choice: 巴比伦的勇士
  rationale: גִּבּוֹר在军事语境中指勇士或战士。阴性单数后缀回指巴比伦；中文明确说“巴比伦的”，可避免孤立经节中“她的”指代不清。
- source_word: וָחָתּוּ
  choice: 他们就惊惶
  rationale: חתת可表示惊惶、崩溃或被摧毁；这里采用常见的心理与军事失措义，同时在脚注保留“崩溃”的可能。
