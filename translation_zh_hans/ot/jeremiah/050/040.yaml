base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/040.yaml
  text: As when God overthrew Sodom and Gomorrah and their neighboring towns[a], declares Yahweh, no man will live there[b], and no son of man will dwell in her.
translation:
  language: zh_hans
  text: 正如上帝倾覆所多玛、蛾摩拉和她邻近的城镇[a]一样——雅威宣告——必无人住在那里，也必无人寄居其中[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译“她的邻舍”，指与所多玛、蛾摩拉相邻的城镇或聚落。
    reason: lexical_alternative
  - marker: b
    text: 原文后半句直译“也没有人的儿子寄居在她里面”，意思是没有任何人居留其中。
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּמַהְפֵּכַת
  choice: 正如……倾覆……一样
  rationale: 介词כְּ表示比较，מַהְפֵּכָה指毁灭性的倾覆；用这一结构既保留明喻，也符合现代汉语表达。
- source_word: אֱלֹהִים
  choice: 上帝
  rationale: 此处指独一的上帝，是倾覆所多玛和蛾摩拉的施事者。
- source_word: שְׁכֵנֶיהָ
  choice: 她邻近的城镇
  rationale: 字面为“她的邻舍”，阴性单数后缀可能以所多玛或相关地域为集合性先行词；上下文所指应是附近的聚落，正文明确为“城镇”，脚注保留原文形式。
- source_word: נְאֻם יְהוָה
  choice: 雅威宣告
  rationale: 保留标准先知宣告公式的庄重语气，并将神名יְהוָה音译为“雅威”。
- source_word: יֵשֵׁב
  choice: 住
  rationale: 在荒废审判的语境中，该词表示居住或定居；“住”自然简洁。
- source_word: אִישׁ
  choice: 人
  rationale: 这里的阳性单数作泛指，与下句בֶּן־אָדָם平行；现代汉语用“人”即可准确涵盖其普遍否定意义。
- source_word: יָגוּר
  choice: 寄居
  rationale: גור可指旅居、寄居或居留；译作“寄居”保留它与ישׁב“居住”之间的词义差别。
- source_word: בֶּן אָדָם
  choice: 人
  rationale: 字面为“人的儿子”，此处是泛指人类个体，并与אִישׁ构成诗性平行；正文按现代汉语译为“人”，脚注说明字面形式。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；采用较能反映通常学术重构读音的“雅威”，而不以称号替代。
- issue: 末两分句是否指不同类别的人
  choice: 视为同义平行，分别译作“无人住在那里”和“无人寄居其中”
  alternative: 把“人”和“人的儿子”理解为两个不同群体
  rationale: אִישׁ与בֶּן־אָדָם在此共同强化彻底无人居留，并无充分依据将其区分为不同类别。
translation_notes:
  register: 采用现代、庄重而易懂的先知书文体。“正如……一样”保留比较结构；破折号标出插入的宣告公式。代词“她”保留希伯来文阴性指称，并以脚注解释可能引起的理解困难。
