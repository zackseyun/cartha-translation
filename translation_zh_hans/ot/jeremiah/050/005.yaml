source:
  edition: WLC
  text: צִיּ֣וֹן יִשְׁאָ֔לוּ דֶּ֖רֶךְ הֵ֣נָּה פְנֵי/הֶ֑ם בֹּ֚אוּ וְ/נִלְו֣וּ אֶל יְהוָ֔ה בְּרִ֥ית עוֹלָ֖ם לֹ֥א תִשָּׁכֵֽחַ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/005.yaml
  text: 'They will ask the way to Zion[a], with their faces turned toward it: ‘Come[b], let us join ourselves to Yahweh in an everlasting covenant that will not be forgotten.’'
translation:
  language: zh_hans
  text: 他们必询问通往锡安的路，面朝那里，说：“来吧！让我们归附[a]雅威，借着永远不被忘记的约。”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “归附”也可译作“与雅威联合”或“被联合于雅威”。原文动词出自“联合、附随”之意的词根；在此劝勉语境中，可表达主动归附，也可保留“被联合”的意味。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“永远的约，不被忘记”。这描述持久的约，且不把“忘记”直接解释为“背弃”。
    reason: cultural_note
lexical_decisions:
- source_word: צִיּוֹן
  choice: 锡安
  rationale: 专有地名采用现代中文圣经读者熟悉的音译。
- source_word: יִשְׁאָלוּ דֶּרֶךְ
  choice: 必询问通往……的路
  rationale: יִשְׁאָלוּ是未完成体复数，按预言语境译为将来的“必询问”；דֶּרֶךְ保留具体的道路意象。
- source_word: הֵנָּה פְנֵיהֶם
  choice: 面朝那里
  rationale: 原文直译近于“他们的脸朝向那里”，中文凝练表达仍保留身体朝向锡安的画面。
- source_word: בֹּאוּ
  choice: 来吧
  rationale: 复数命令式，译作带劝勉语气的邀请。
- source_word: וְנִלְווּ
  choice: 让我们归附
  rationale: לוה的Niphal形式可表达归附、与之联合；结合前面的邀请，中文用共同劝勉自然传达语境，同时以脚注保留其语法和语态上的另一种译法。
- source_word: אֶל יְהוָה
  choice: 归附雅威
  rationale: 介词אֶל表示归向的对象；神名יהוה按其专名性质音译为“雅威”。
- source_word: בְּרִית עוֹלָם
  choice: 以永远的约与他联合
  rationale: בְּרִית是“约”，עוֹלָם在此强调恒久不止；补出“与他联合”使其同前面的归附关系在中文中清楚，但不改变约所关联的对象。
- source_word: לֹא תִשָּׁכֵחַ
  choice: 这约必不被忘记
  rationale: Niphal未完成体为被动意义，阴性主语是“约”；译文保留“被忘记”，不改释为“被背弃”。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”较贴近YHWH通常重构的读音，并保留其作为立约之神专名的性质。
- issue: וְנִלְווּ的劝勉对象与语态
  choice: 让我们归附
  alternative: 你们来归附／让我们与雅威联合
  rationale: 形式上是复数命令式，语义可为“归附”或“被联合”；在彼此招呼同行的语境中，“让我们”是自然中文，但脚注保留较贴近形式及语态的可能译法。
- issue: “永远的约”与“不被忘记”的关系
  choice: 这约必不被忘记
  alternative: 永不背弃的约
  rationale: שׁכח本义是“忘记”，原文使用被动式；译文不把它直接解释为“背弃”，从而保留记念与忠诚之间的神学张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“面朝那里”保留原文具体画面；引语用共同劝勉的口吻。“归附”兼顾人与雅威联合及立约归属的含义，避免加入特定宗派术语。
