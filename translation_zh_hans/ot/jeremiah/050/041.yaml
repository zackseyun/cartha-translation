  register: 采用现代、庄重而易懂的先知性语体。“看哪”保留原文的强调功能；以“民族”与“国”分别对应עַם和גּוֹי。脚注标记按其实际所解释的希伯来词语放置：标记[a]置于“被唤起”之后，标记[b]置于“大地的尽头”之后。
