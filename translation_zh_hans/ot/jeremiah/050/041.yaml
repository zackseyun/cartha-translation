base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/041.yaml
  text: Behold[a], a people is coming from the north[b], and a great nation and many kings will be stirred up from the farthest parts of the earth.
translation:
  language: zh_hans
  text: 看哪！一个民族从北方而来；一个强大的国家和许多君王必从地极[b]被激起[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“被唤起”或“被唤醒”；希伯来动词含有被唤醒、被激发或被动员起来采取行动的意思。
    reason: lexical_alternative
  - marker: b
    text: 或译“大地最遥远之处”或“大地的尽头”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: 看哪
  rationale: 这是引起注意的话语标记；“看哪”保留先知宣告的庄重和突显作用。
- source_word: עַם
  choice: 一个民族
  rationale: עַם在此指一个族群；译作“民族”既自然，也与后面的גּוֹי（国）有所区别。
- source_word: בָּא
  choice: 而来
  rationale: 完成式在הִנֵּה之后具有生动、迫近的现在或将来意味；结合“看哪”译为“而来”，简洁地呈现正在逼近的景象。
- source_word: מִצָּפוֹן
  choice: 从北方
  rationale: 直接表达来向，符合现代汉语习惯。
- source_word: גּוֹי גָּדוֹל
  choice: 一个强大的国
  rationale: גּוֹי可侧重政治实体，גָּדוֹל在此表达其强盛；“强大的国”也避免与前面的“民族”混同。
- source_word: וּמְלָכִים רַבִּים
  choice: 和许多君王
  rationale: 保留并列结构及统治者为复数的含义。
- source_word: יֵעֹרוּ
  choice: 将被唤起
  rationale: 该词为尼法勒未完成式，表达被唤醒、被激发或被动员起来；“将被唤起”保留被动语态及尚待发生的意味，不把军事含义明说得过满。
- source_word: מִיַּרְכְּתֵי אָרֶץ
  choice: 从大地的尽头
  rationale: 该短语指大地遥远的边缘或极远之处；“大地的尽头”庄重、自然，并保留其空间意象。
theological_decisions: []
