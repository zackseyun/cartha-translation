  text: מִ/קֶּ֤צֶף יְהוָה֙ לֹ֣א תֵשֵׁ֔ב וְ/הָיְתָ֥ה שְׁמָמָ֖ה כֻּלָּ֑/הּ כֹּ֚ל עֹבֵ֣ר עַל בָּבֶ֔ל יִשֹּׁ֥ם וְ/יִשְׁרֹ֖ק עַל כָּל מַכּוֹתֶֽי/הָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/013.yaml
  text: Because of the wrath of Yahweh[a], it will not be inhabited, but will become a complete desolation. Everyone who passes by Babylon will be appalled and will hiss over all her wounds.
translation:
  language: zh_hans
  text: 因雅威的烈怒，巴比伦必无人居住，反要全然荒凉。凡经过巴比伦的人，都必惊骇，并因她所受的一切创伤而发出嘘声[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“吹口哨”。希伯来语这个动词既可指发出嘘声，也可指吹口哨；这里可能表达惊讶或讥诮。
    reason: 保留שרק的词义歧义及其语用张力。
lexical_decisions:
- source_word: מִקֶּצֶף יְהוָה
  choice: 因雅威的烈怒
  rationale: מִן在此表示原因；קֶצֶף带有强烈的忿怒和审判意味，译作“烈怒”。יהוה按其专名译作“雅威”。
- source_word: לֹא תֵשֵׁב
  choice: 必无人居住
  rationale: ישׁב为阴性单数，与作为城市的巴比伦呼应；在此指城市不再有人居住。
- source_word: וְהָיְתָה שְׁמָמָה כֻּלָּהּ
  choice: 反要全然荒凉
  rationale: שְׁמָמָה表示荒废、荒凉，כֻּלָּהּ强调其彻底性；“反要”自然表达前后转折。
- source_word: כֹּל עֹבֵר עַל בָּבֶל
  choice: 凡从巴比伦旁边经过的人
  rationale: 该短语指经过并目睹巴比伦废墟的过路人；“凡……的人”保留全称含义并符合现代汉语。
- source_word: יִשֹּׁם
  choice: 都必惊骇
  rationale: שׁמם在此描述见到毁灭景象后的震惊、骇异；“惊骇”兼具震惊和恐惧色彩。
- source_word: וְיִשְׁרֹק
  choice: 发出嘘声
  rationale: שרק可指发出嘶声、嘘声或吹哨；审判预言中常表示面对废墟时的惊讶或讥诮。正文采用“发出嘘声”，脚注保留“吹口哨”的可能。
- source_word: עַל כָּל מַכּוֹתֶיהָ
  choice: 因她所受的一切创伤
  rationale: מַכָּה可指击打、伤痕或灾害；此处将巴比伦拟人化，译作“她所受的一切创伤”保留受击后的伤势意象。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名יהוה；“雅威”较贴近通常重构的希伯来语读音，并保留其作为专名而非称号的性质。
- issue: 巴比伦的拟人化
  choice: 她所受的一切创伤
  alternative: 它所遭的一切打击
  rationale: 原文以阴性代词指巴比伦，保持“她”可传达城市拟人化；但不进一步赋予该意象原文未明说的神学含义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。句式保留先宣告巴比伦彻底荒凉、再描写过路人反应的结构；用“她”延续原文对城市的阴性拟人化。
