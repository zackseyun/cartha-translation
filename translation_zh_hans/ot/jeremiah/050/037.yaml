  text: חֶ֜רֶב אֶל סוּסָ֣י/ו וְ/אֶל רִכְבּ֗/וֹ וְ/אֶל כָּל הָ/עֶ֛רֶב אֲשֶׁ֥ר בְּ/תוֹכָ֖/הּ וְ/הָי֣וּ לְ/נָשִׁ֑ים חֶ֥רֶב אֶל אוֹצְרֹתֶ֖י/הָ וּ/בֻזָּֽזוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/037.yaml
  text: A sword against his horses and against his chariots[a], and against all the mixed people in her midst, and they will become women. A sword against her treasuries[b], and they will be plundered.
translation:
  language: zh_hans
  text: 刀剑临到它的马匹和战车，临到它境内所有混杂的民众[a]；他们必变成妇女[b]。刀剑临到它的府库，府库必遭抢掠。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “混杂的民众”也可译作“外族雇佣兵”或“混杂的群众”。这里可能指巴比伦境内由不同族群组成的居民，也可能指外族辅助军。
    reason: lexical_alternative
  - marker: b
    text: “变成妇女”是古代战争语境中的说法，意指他们惧怕、丧失作战的勇气。
    reason: cultural_note
lexical_decisions:
- source_word: חֶרֶב אֶל
  choice: 刀剑临到
  rationale: 这是先知宣告审判的省略句式。“临到”补足现代汉语所需的谓语关系，同时保留反复而简洁的宣告语气。
- source_word: סוּסָיו וְאֶל רִכְבּוֹ
  choice: 它的马匹和战车
  rationale: רֶכֶב在这里是集合性单数，指战车或战车部队；译作“战车”自然且符合军事语境。希伯来语虽使用阳性后缀，所指为巴比伦，汉语以“它”指称城邦或帝国，避免凭语法性别添加自然性别。
- source_word: כָּל הָעֶרֶב
  choice: 所有混杂的民众
  rationale: עֶרֶב可能指巴比伦境内成分混杂的居民，也可能特指外族辅助军。正文保留较宽泛的词义，不把“雇佣兵”这一较具体解释写入正文。
- source_word: בְּתוֹכָהּ
  choice: 它境内
  rationale: 阴性后缀所指为人格化的巴比伦城；现代汉语用“境内”清楚表达“在她中间”，并与城邦或帝国的语境相合。
- source_word: וְהָיוּ לְנָשִׁים
  choice: 他们必变成妇女
  rationale: 按字面保留古代战争语境中的性别化说法，不在正文中直接改写为“胆怯”或“丧胆”；其习语含义由脚注说明。
- source_word: אוֹצְרֹתֶיהָ
  choice: 它的府库
  rationale: 复数名词指储藏财物的库房或国库；“府库”兼具财货储藏与国家财富的语感。
- source_word: וּבֻזָּזוּ
  choice: 府库必遭抢掠
  rationale: 被动复数动词最自然地回指“府库”。汉语重述主语以避免代词指向含混，并保留被动受掠之意。
theological_decisions:
- issue: לְנָשִׁים这一性别化战争习语的处理
  choice: 正文译作“他们必变成妇女”
  alternative: 他们必像妇女一样／他们必丧胆
  rationale: 原文明确使用“妇女”表达战士失去勇气。正文保留其古代修辞及可能造成的张力，不以解释性译法替代；脚注说明其历史语境中的习语功能。
- issue: 巴比伦相关代词的语法性别
  choice: 统一以中性“它”指称城邦或帝国
  alternative: 依照希伯来语后缀交替译作“他／她”
  rationale: 本节希伯来语先用阳性后缀，随后用阴性后缀。该变化主要属于语法和人格化表达，并不要求汉语赋予巴比伦自然性别；使用“它”可避免制造原文没有强调的性别解释。
translation_notes:
  register: 采用现代、庄重而易懂的先知审判语体。重复“刀剑临到”以保留原文排比；正文中的脚注标记紧随各自解释的词组，纠正咨询层中标记位置与脚注内容不对应的问题。
