id: JER.50.29
reference: Jeremiah 50:29
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: הַשְׁמִ֣יעוּ אֶל בָּבֶ֣ל רַ֠בִּים כָּל דֹּ֨רְכֵי קֶ֜שֶׁת חֲנ֧וּ עָלֶ֣י/הָ סָבִ֗יב אַל יְהִי פְּלֵטָ֔ה שַׁלְּמוּ לָ֣/הּ כְּ/פָעֳלָ֔/הּ כְּ/כֹ֛ל אֲשֶׁ֥ר עָשְׂתָ֖ה עֲשׂוּ לָ֑/הּ כִּ֧י אֶל יְהוָ֛ה זָ֖דָה אֶל קְד֥וֹשׁ יִשְׂרָאֵֽל־׀־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/029.yaml
  text: Summon many against Babylon[a], all who bend the bow; encamp around her on every side; let there be no escape. Repay her according to her work; according to all that she has done, do to her. For she has acted arrogantly against Yahweh, against the Holy One of Israel.
translation:
  language: zh_hans
  text: 要召集许多人来攻击巴比伦，就是所有拉弓的人；你们要在她四围安营，不可有逃脱[a]。要照她所行的报还她；她所做的一切，你们也要照样向她施行。因为她狂妄地对抗雅威，对抗以色列的圣者。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“不可留下幸存者”或“不可有逃脱的余民”。希伯来语 פְּלֵטָה 可指“逃脱”，也可指逃脱者或幸存者。
    reason: 保留该词可指抽象的“逃脱”或具体的“逃脱者、幸存者”的词义歧义。
lexical_decisions:
- source_word: הַשְׁמִיעוּ אֶל־בָּבֶל רַבִּים
  choice: 要召集许多人来攻击巴比伦
  rationale: הַשְׁמִיעוּ 字面有“使听见、宣告”之意，但在这里引出军事集结；结合后文弓箭手与围城语境，译为“召集”最符合语用。אֶל 在敌对行动语境中译作“来攻击”。
- source_word: כָּל דֹּרְכֵי קֶשֶׁת
  choice: 就是所有拉弓的人
  rationale: 原文意为“所有踩弓／张弓的人”，是对弓箭手的形象化说法；“拉弓的人”保留动作画面，也便于现代读者理解。
- source_word: חֲנוּ עָלֶיהָ סָבִיב
  choice: 你们要在她四围安营
  rationale: 保留复数命令语气及围城时从四面驻扎的含义；以“她”承接拟人化的巴比伦。
- source_word: אַל יְהִי פְּלֵטָה
  choice: 不可让人逃脱
  rationale: פְּלֵטָה 可指逃脱、获救，也可指逃脱者或幸存者。正文采用符合围城语境而又不过度限定为全体死亡的“不可让人逃脱”，并以脚注保留另一种理解。
- source_word: שַׁלְּמוּ לָהּ כְּפָעֳלָהּ
  choice: 要照她所行的报应她
  rationale: שַׁלְּמוּ 在此表示按行为施行回报或报应；“报应”表达审判性的对等回报，כְּפָעֳלָהּ 则译为“照她所行的”。
- source_word: כְּכֹל אֲשֶׁר עָשְׂתָה עֲשׂוּ לָהּ
  choice: 她怎样待人，你们也要照她所做的一切待她
  rationale: 保留原文“她所做的／也要对她做”的对称和报偿原则，同时用自然汉语表达。
- source_word: זָדָה
  choice: 狂妄地对抗
  rationale: 该动词兼有骄傲、僭越和放肆行事之意；与介词 אֶל 连用时，“狂妄地对抗”兼顾态度和敌对行为。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见音译呈现四字神名，保留其作为专名而非称号的性质。
- source_word: קְדוֹשׁ יִשְׂרָאֵל
  choice: 以色列的圣者
  rationale: 保留这一固定先知性称号的形式和庄重语体。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”按其较通行的学术复原音译，明确呈现专名，不以“主”这一称号替代。
- issue: 审判语境中 פְּלֵטָה 的含义
  choice: 不可让人逃脱
  alternative: 不可留下幸存者／不可有逃脱的余民
  rationale: 围城和四面安营的上下文首先强调断绝逃路；正文不把词义收窄为无人存活，脚注则保留其也可指逃脱者或幸存者的可能。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语；保留连续命令句的军事紧迫感、巴比伦的阴性拟人以及末句对“雅威／以色列的圣者”的平行强调。
