id: JER.50.15
reference: Jeremiah 50:15
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: הָרִ֨יעוּ עָלֶ֤י/הָ סָבִיב֙ נָתְנָ֣ה יָדָ֔/הּ נָֽפְלוּ֙ אשויתי/ה נֶהֶרְס֖וּ חֽוֹמוֹתֶ֑י/הָ כִּי֩ נִקְמַ֨ת יְהוָ֥ה הִיא֙ הִנָּ֣קְמוּ בָ֔/הּ כַּ/אֲשֶׁ֥ר עָשְׂתָ֖ה עֲשׂוּ לָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/015.yaml
  text: Raise a shout against her all around[a]; she has given her hand; her foundations have fallen, her walls are torn down. For it is the vengeance of Yahweh—take vengeance on her; as she has done[b], do to her.
translation:
  language: zh_hans
  text: 你们要从四面向她呐喊！她已经举手投降[a]；她的根基[b]倒塌了，她的城墙被拆毁了。因为这是雅威所施行的报应；你们要向她施行报应。她怎样行，你们也要怎样对待她。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译：“她交出了她的手”；这是表示归顺或投降的说法。
    reason: lexical_alternative
  - marker: b
    text: 这个希伯来词的确切含义不确定，可能指地基、扶壁、堡垒或其他城防／支撑结构。
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרִיעוּ עָלֶיהָ סָבִיב
  choice: 你们要从四面向她呐喊
  rationale: הָרִיעוּ在围城语境中指发出敌对的呼喊或战斗呐喊；“从四面向她”保留סָבִיב所表达的包围意味，同时不把呼喊的具体性质限定得过窄。
- source_word: נָתְנָה יָדָהּ
  choice: 她已经举手投降
  rationale: 原文直译为“她交出了她的手”，在此是表示归顺、投降的惯用语。中文“举手投降”既自然，也保留了“手”的形象；脚注说明其字面形式。
- source_word: אשויתיה
  choice: 她的防御工事
  rationale: 该词罕见且词义不确定，可能指扶壁、堡垒、地基等城防或支撑结构。“防御工事”适合围城上下文，也避免武断指定某一种建筑构件。
- source_word: נֶהֶרְסוּ חוֹמוֹתֶיהָ
  choice: 她的城墙拆毁了
  rationale: נֶהֶרְסוּ是被动形式，表示被拆除、毁坏；“城墙”明确חומות在此所指的城市防御墙。
- source_word: נִקְמַת יְהוָה הִיא
  choice: 因为这是雅威的报应
  rationale: 该短句把巴比伦遭受的毁灭认定为雅威所施的报应；“报应”在现代中文中能表达因恶行而受惩治的对应性。
- source_word: הִנָּקְמוּ בָהּ
  choice: 你们要向她施行报应
  rationale: 保留复数命令的语气，并与前句“雅威的报应”形成词根上的呼应。
- source_word: כַּאֲשֶׁר עָשְׂתָה עֲשׂוּ לָהּ
  choice: 她怎样待人，你们也要怎样待她
  rationale: 原文极为简练，直译是“照她所做的，向她做”。中文补出隐含的受事者“人”，使互报原则清楚自然，而不改变其对应报偿之意。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以通行的中文音译呈现神的专名，不以称号替代。
theological_decisions:
- issue: 是否把נָתְנָה יָדָהּ按字面译为“交出她的手”
  choice: 正文译作“举手投降”，脚注保留字面形式
  alternative: 她交出了她的手
  rationale: 在围城语境中该表达明显指归顺或投降。逐字直译在现代中文中难以理解；“举手投降”既传达惯用义，也部分保留原文的手部意象。
- issue: 如何处理词义不确定的אשויתיה
  choice: 译作“防御工事”，并以脚注列出主要可能含义
  alternative: 扶壁；堡垒；地基；角楼
  rationale: 该词的具体建筑所指无法确定。上下文只足以表明它属于城防或结构设施，因此采用上位表达，避免把不确定的词义解释成确定的建筑部位。
- issue: 如何表达报复性命令而不弱化经文张力
  choice: 直译为“你们要向她施行报应”
  alternative: 你们要报复她；你们要为自己向她报仇
  rationale: 原文明确发出执行报应的命令，并以她过去的行为作为尺度。译文不把这一神学张力改写为抽象的后果或非人格化审判。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以短促命令句保留围城宣告的力度；“她”沿用原文对巴比伦城的阴性拟人。正文中的[a]、[b]与脚注一一对应。
