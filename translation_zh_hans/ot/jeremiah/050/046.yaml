  text: מִ/קּוֹל֙ נִתְפְּשָׂ֣ה בָבֶ֔ל נִרְעֲשָׁ֖ה הָ/אָ֑רֶץ וּ/זְעָקָ֖ה בַּ/גּוֹיִ֥ם נִשְׁמָֽע׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/046.yaml
  text: At the sound of Babylon being captured, the earth quakes, and a cry is heard among the nations.
translation:
  language: zh_hans
  text: 巴比伦被攻取的消息一传来，大地就震动；呼喊声在列国中被听见。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִקּוֹל
  choice: 因……的响声
  rationale: 介词מִן在此可表达原因或触发因素；קוֹל既可指声音，也可指消息。结合后文“被听见”的听觉意象，译作“响声”较贴近原文，并保留事件震动四方的修辞效果。
- source_word: נִתְפְּשָׂה בָבֶל
  choice: 巴比伦被攻取
  rationale: נִתְפְּשָׂה为被动完成式，指城被抓住、夺取或攻占；“被攻取”自然体现军事语境和被动意义。
- source_word: נִרְעֲשָׁה הָאָרֶץ
  choice: 大地震动
  rationale: רעש表示震动、摇撼；“大地”可兼顾הָאָרֶץ指土地或全地的语义幅度，不把范围过早限定为某一地区。
- source_word: וּזְעָקָה בַּגּוֹיִם נִשְׁמָע
  choice: 呼喊声传到列国之中
  rationale: זְעָקָה是因灾难发出的喊叫或哀呼；נִשְׁמָע字面为“被听见”。汉语用“传到……之中”自然表达声音在那里被听见，同时避免误解为列国本身发出呼喊。
theological_decisions:
- issue: “大地”所指范围
  choice: 保留“大地”的宽泛表达
  alternative: “那地”或“全地”
  rationale: הָאָרֶץ可指当地土地、某一区域或大地；上下文本身未要求精确限定，因此不将其明确收窄或扩大。
- issue: 呼喊声的发出者
  choice: 译为“呼喊声传到列国之中”
  alternative: “列国中响起呼喊声”
  rationale: 原文只说明呼喊在列国中被听见，并未明确列国是发声者；所选译法保留这一关系，避免增加解释。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。两分句以分号衔接，保留希伯来诗句中巴比伦陷落、大地震动、声闻列国的递进气势。
