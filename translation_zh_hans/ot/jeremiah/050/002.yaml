reference: Jeremiah 50:2
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: הַגִּ֨ידוּ בַ/גּוֹיִ֤ם וְ/הַשְׁמִ֨יעוּ֙ וּֽ/שְׂאוּ נֵ֔ס הַשְׁמִ֖יעוּ אַל תְּכַחֵ֑דוּ אִמְרוּ֩ נִלְכְּדָ֨ה בָבֶ֜ל הֹבִ֥ישׁ בֵּל֙ חַ֣ת מְרֹדָ֔ךְ הֹבִ֣ישׁוּ עֲצַבֶּ֔י/הָ חַ֖תּוּ גִּלּוּלֶֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/002.yaml
  text: Declare among the nations and proclaim[a]; lift up a banner. Proclaim; do not hide it. Say, “Babylon is captured; Bel is put to shame; Merodach is shattered. Her images are put to shame[b]; her idols are shattered.”
translation:
  language: zh_hans
  text: 你们要在列国中宣告，传扬出去；要竖起旗号。要传扬，不可隐瞒。你们要说：“巴比伦被攻取了；彼勒蒙羞，米罗达[a]惊惶。她的神像蒙羞，她的偶像[b]惊惶。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “米罗达”是希伯来语中的名称形式；这位巴比伦神更常以其阿卡德语名称“马尔杜克”为人所知。
    reason: 说明专名形式及历史认同。
  - marker: b
    text: 这里译作“偶像”的希伯来词带有强烈贬义，含有污秽、可憎之物的意味。
    reason: 保留原词的轻蔑和厌恶色彩。
lexical_decisions:
- source_word: הַגִּידוּ בַגּוֹיִם
  choice: 在列国中宣告
  rationale: הַגִּידוּ是使役命令式，要求公开发布消息；“宣告”符合先知性公告的庄重语气。בַגּוֹיִם指列国，保留其国际范围。
- source_word: וְהַשְׁמִיעוּ / הַשְׁמִיעוּ
  choice: 传扬出去 / 要传扬
  rationale: 使役形式强调使消息被人听见；中文用“传扬”自然表达公开传播，并保留原文的重复修辞。首次加“出去”是汉语表达所需，不限定原文未说明的对象。
- source_word: וּשְׂאוּ נֵס
  choice: 要竖起旗号
  rationale: נֵס指用于召集或传递信号的旗帜、标志；“竖起旗号”既保留具体意象，也符合现代汉语。
- source_word: אַל תְּכַחֵדוּ
  choice: 不可隐瞒
  rationale: כחד在此表示隐藏或压下消息；“不可隐瞒”简洁、庄重，并与公开传扬形成鲜明对照。
- source_word: נִלְכְּדָה בָבֶל
  choice: 巴比伦被攻取了
  rationale: נִלְכְּדָה为被动完成式，表示城已被夺取；“被攻取了”在中文中清楚体现军事陷落及完成结果。
- source_word: הֹבִישׁ / הֹבִישׁוּ
  choice: 蒙羞
  rationale: בוש的使役形式在此表达落入羞辱、被证明无能的结果；“蒙羞”自然凝练，适合用于异教神祇和神像。
- source_word: בֵּל
  choice: 彼勒
  rationale: 按希伯来语专名音译，不在正文中直接用解释性称号替代。
- source_word: חַת / חַתּוּ
  choice: 惊惶
  rationale: חתת可表达惊恐、丧胆，也可在某些语境中有破碎或崩溃之意。此处采用与形态和常见语义贴近的“惊惶”，同时不把神像实际碎裂这一较具体解释写死。
- source_word: מְרֹדָךְ
  choice: 米罗达
  rationale: 依据希伯来语形式音译；较常见的阿卡德语名称“马尔杜克”留在脚注说明。
- source_word: עֲצַבֶּיהָ
  choice: 她的神像
  rationale: עֲצַבִּים常指制作出来供奉的偶像形体；译作“神像”可与下文贬义更强的גִּלּוּלִים有所区别。
- source_word: גִּלּוּלֶיהָ
  choice: 她的偶像
  rationale: 正文用读者易懂的“偶像”，其强烈轻蔑、污秽意味则在脚注中保留。
theological_decisions:
- issue: 巴比伦神祇名称的处理
  choice: 正文音译为“彼勒”和“米罗达”
  alternative: 在正文中直接认同或改写为其他美索不达米亚神名
  rationale: 音译保留希伯来文本的历史具体性，也避免把解释性认同强加进正文；米罗达与马尔杜克的关系放在脚注交代。
- issue: חַת / חַתּוּ的语义
  choice: 译为“惊惶”
  alternative: 译为“破碎”或“崩溃”
  rationale: 该词可涉及惊恐、丧胆或崩溃。这里译作“惊惶”保留对神祇及偶像人格化描写的张力，也避免未经明示便断定它们被物理击碎。
- issue: 贬义偶像词汇的处理
  choice: 正文译“神像、偶像”，脚注说明גִּלּוּלִים的强烈贬义
  alternative: 正文直译为“污秽的偶像”或“粪偶像”
  rationale: 这样既使普通读者顺畅理解，又不抹去原文对偶像的轻蔑色彩。
translation_notes:
  register: 采用现代、庄重而清楚的普通话。保留连续命令句和“传扬”的重复，以呈现公开宣告的紧迫感；用“她”回指作为城市的巴比伦，并与原文阴性后缀对应。
