base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/043.yaml
  text: The king of Babylon has heard the report about them[a], and his hands have gone limp; distress has seized him, anguish like a woman in labor.
translation:
  language: zh_hans
  text: 巴比伦王听见了关于他们的消息[a]，双手发软；痛苦攫住了他，他像正在分娩的妇人一样疼痛难当。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们的消息。”希伯来语可较直译为“他们的消息”；上下文所指是有关来犯军队的消息。
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמַע
  choice: 听见了
  rationale: Qal完成式第三人称阳性单数；以“听见了”表达已经获悉消息及其随即产生的反应，符合汉语叙事习惯。
- source_word: מֶלֶךְ בָּבֶל
  choice: 巴比伦王
  rationale: 结构明确指巴比伦的君王；“巴比伦王”简洁、庄重，也符合现代中文圣经语体。
- source_word: שִׁמְעָם
  choice: 关于他们的消息
  rationale: שֵׁמַע可指“消息、传闻”，第三人称复数后缀在上下文中表示消息所涉及的入侵者，而不必表示消息由他们发出。正文采用自然中文，并以脚注保留较直译的可能。
- source_word: וְרָפוּ יָדָיו
  choice: 双手就发软
  rationale: 保留“手变软弱”的身体意象，同时自然传达力量和勇气消退的惯用含义；“就”体现听闻消息后的紧接反应。
- source_word: צָרָה
  choice: 苦难
  rationale: 该词可指困境、患难或痛苦；此处选“苦难”，既包括所处危局，也与后面的疼痛意象相呼应。
- source_word: הֶחֱזִיקַתְהוּ
  choice: 攫住了他
  rationale: 此处Hiphil表示抓住、控制或压倒；“攫住”保留强烈而具体的动作感。
- source_word: חִיל
  choice: 疼痛
  rationale: 在分娩比喻中，该词可表示剧痛、战栗或扭痛；“疼痛”自然承接“如临产的妇人”，但不把词义过度限定为产痛。
- source_word: כַּיּוֹלֵדָה
  choice: 如临产的妇人
  rationale: 阴性分词指正在生产的妇人；“临产的妇人”简洁、现代而庄重，清楚表达比较意象。
theological_decisions: []
translation_notes:
