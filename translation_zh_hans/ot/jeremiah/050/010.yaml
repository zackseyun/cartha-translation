source:
  edition: WLC
  text: וְ/הָיְתָ֥ה כַשְׂדִּ֖ים לְ/שָׁלָ֑ל כָּל שֹׁלְלֶ֥י/הָ יִשְׂבָּ֖עוּ נְאֻם יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/010.yaml
  text: And Chaldea will become plunder[a]; all who plunder her will have their fill[b], declares Yahweh.
translation:
  language: zh_hans
  text: 迦勒底必成为战利品[a]；凡掠夺她的，都必得饱足[b]。这是耶和华的宣告。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“迦勒底人”。原文形式为复数，但后文以阴性单数“她”指代，因此这里很可能是指迦勒底之地或政权。
    reason: lexical_alternative
  - marker: b
    text: 或译“都必得到满足”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיְתָה
  choice: 必成为
  rationale: 连词加完成式出现在先知性话语中，表达将来的结果；“成为”凸显其转变为被掠夺之物。
- source_word: כַשְׂדִּים
  choice: 迦勒底
  rationale: 原文虽为复数形式，但后接阴性单数代词“她”，此处更可能指迦勒底这一地域或政权，而非单指迦勒底人。
- source_word: לְשָׁלָל
  choice: 战利品
  rationale: 准确表达战争中供人掠夺之物，符合本节军事语境，也比单用“掳物”更符合现代汉语。
- source_word: כָּל שֹׁלְלֶיהָ
  choice: 凡掠夺她的
  rationale: 保留“所有”的周延意义及分词所表达的主动掠夺行为；阴性代词回指作为地域或政权的迦勒底。
- source_word: יִשְׂבָּעוּ
  choice: 都必尽量取足
  rationale: 该动词意为吃饱、满足；在掠夺语境中译作“尽量取足”，自然传达掠夺者所得丰厚并得到满足。
- source_word: נְאֻם יְהוָה
  choice: 这是耶和华的宣告
  rationale: 保留先知书中神圣谕告的固定公式，并以“耶和华”音译神名。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名；“耶和华”是现代简体中文圣经语境中最广为人知且庄重的专名译法，同时不以“主”替代原文神名。
- issue: כַשְׂדִּים 所指是地域政权还是族群
  choice: 迦勒底（地域或政权）
  alternative: 迦勒底人
  rationale: 原词形态上是复数，可指迦勒底人；但后面的阴性单数“她”以及“成为战利品”的谓语更支持把它理解为迦勒底之地或政权。脚注保留族群读法。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“战利品”点明战争掠夺语境；“尽量取足”保留原文“饱足、满足”的意象。神名译作通行的“耶和华”。
