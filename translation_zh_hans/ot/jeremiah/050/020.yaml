base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/020.yaml
  text: In those days and at that time, declares the LORD, the guilt of Israel will be sought, but there will be none, and the sins of Judah, but they will not be found; for I will forgive those whom I leave as a remnant.
translation:
  language: zh_hans
  text: “在那些日子和那时候，耶和华宣告：以色列的罪孽将被寻找，却不复存在；犹大的罪也将被寻找，却找不到；因为我必赦免我所留下的人[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “我所留下的人”也可译作“我所存留的余民”。
    reason: 说明 אַשְׁאִיר 的使役含义及其在语境中可能具有的“存留余民”意味，同时不在正文中过度明确化。
lexical_decisions:
- source_word: עָוֹן (עֲוֺן)
  choice: 罪孽
  rationale: 该词可涵盖罪恶、罪责及其后果；本节因赦免而再也寻不见，译作“罪孽”既自然，也不把含义限缩为单纯的法律责任。
- source_word: חַטָּאוֹת (חַטֹּאת)
  choice: 罪
  rationale: 采用现代汉语常用的“罪”，并与前句“罪孽”保持原文词汇变化。
- source_word: נְאֻם יְהוָה
  choice: 耶和华宣告
  rationale: נְאֻם 是先知书常见的神谕宣告公式；译作“宣告”庄重而直接，יהוה 按现代中文圣经传统音译为“耶和华”。
- source_word: אֶסְלַח
  choice: 我必赦免
  rationale: 准确表达完成式在预言语境中的确定将来意义。
- source_word: לַאֲשֶׁר אַשְׁאִיר
  choice: 我所留下的人
  rationale: 使役式 אַשְׁאִיר 表示“使留下、存留”；正文保留关系从句的直接表达，不额外限定其群体身份。
theological_decisions:
- issue: 以色列和犹大的罪为何无法找到
  choice: 保留“寻找—没有/找不到—因为赦免”的因果结构
  alternative: 解释为罪从未存在，或加入“完全除去”“不再追究”等神学阐释
  rationale: 原文明确将罪无法寻见归因于耶和华的赦免，但未进一步说明赦免的机制；译文不替原文补充特定教义框架。
- issue: “我所留下的人”是否明确称为“余民”
  choice: 正文译作“我所留下的人”，脚注提示“余民”译法
  alternative: 正文直接译作“我所存留的余民”
  rationale: 原文使用“留下”的动词，而非“余民”的名词；直译保留表达形式及其范围上的开放性，同时脚注说明其余民含义。
translation_notes:
  register: 采用庄重、流畅的现代标准汉语。“在那些日子、那时候”保留原文双重时间表达；分号呈现两组平行句。“却再也没有”表达 וְאֵינֶנּוּ 在预言实现后的不存在，“却找不到”对应 וְלֹא תִמָּצֶאינָה，并保留单复数谓语所形成的细微变化。
