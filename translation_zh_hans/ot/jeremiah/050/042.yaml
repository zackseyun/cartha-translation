source:
  edition: WLC
  text: קֶ֣שֶׁת וְ/כִידֹ֞ן יַחֲזִ֗יקוּ אַכְזָרִ֥י הֵ֨מָּה֙ וְ/לֹ֣א יְרַחֵ֔מוּ קוֹלָ/ם֙ כַּ/יָּ֣ם יֶהֱמֶ֔ה וְ/עַל סוּסִ֖ים יִרְכָּ֑בוּ עָר֗וּךְ כְּ/אִישׁ֙ לַ/מִּלְחָמָ֔ה עָלַ֖יִ/ךְ בַּת בָּבֶֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/042.yaml
  text: They seize bow and javelin; they are cruel and will show no mercy. Their sound roars like the sea[a], and they ride on horses, arrayed like a man for battle against you, daughter Babylon.
translation:
  language: zh_hans
  text: 他们手持弓和标枪；他们残忍，毫不怜悯。他们的声音如海涛轰鸣；他们骑着马，为作战列好阵势，如同一人[a]，要攻击你，巴比伦的女儿啊！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“像一个男子那样，为作战列好阵势。”
    reason: lexical_alternative
lexical_decisions:
- source_word: קֶשֶׁת
  choice: 弓
  rationale: 该词在这里是集合性、器具性的单数，指入侵军队所持的弓；汉语用单数“弓”自然且忠实。
- source_word: כִידֹן
  choice: 标枪
  rationale: 指与弓并列的矛状武器，可能用于投掷或刺击；“标枪”比笼统的“矛”更能体现其较轻型兵器的意味。
- source_word: יַחֲזִיקוּ
  choice: 手持
  rationale: 此处表示拿住兵器、装备待战；“手持”既保留动作，也符合现代汉语军事描写。
- source_word: אַכְזָרִי
  choice: 残忍
  rationale: 直接描述敌军冷酷无情的性情，并与下句“毫不怜悯”形成原文中的强化关系。
- source_word: לֹא יְרַחֵמוּ
  choice: 毫不怜悯
  rationale: 准确传达否定式“不会施怜悯”，同时在汉语中简洁有力。
- source_word: קוֹלָם
  choice: 他们的声音
  rationale: קוֹל可指声音、呼声或响声；这里保留较宽泛的“声音”，不限定为呐喊或兵器声。
- source_word: כַּיָּם יֶהֱמֶה
  choice: 如海涛轰鸣
  rationale: 动词描写翻腾、轰响；“海涛轰鸣”自然呈现军势如海的巨大声响。
- source_word: עַל סוּסִים יִרְכָּבוּ
  choice: 他们骑着马
  rationale: 按原文直接描述敌军骑马而来，现代汉语自然清楚。
- source_word: עָרוּךְ
  choice: 列好阵势
  rationale: 被动分词表示已经排列整齐、准备作战；“列好阵势”兼顾军阵秩序和备战状态。
- source_word: כְּאִישׁ
  choice: 像一个男子
  rationale: אִישׁ为阳性单数，可直指“男子”，也可能在语境中表达全军如同一人；正文保留其单数和男性意象，另一种理解置于脚注。
- source_word: לַמִּלְחָמָה
  choice: 准备上阵
  rationale: 该介词短语直义为“为了战争／战斗”；与עָרוּךְ结合译作“准备上阵”，符合现代汉语且保留备战含义。
- source_word: בַּת בָּבֶל
  choice: 巴比伦之女
  rationale: 保留原文把巴比伦城及其居民人格化为“女儿”的诗性称呼，并通过“啊”体现直接呼告。
theological_decisions:
- issue: 军事比喻כְּאִישׁ中的阳性单数及其可能的集体含义
  choice: 像一个男子准备上阵
  alternative: 如同一人列阵上战场
  rationale: 正文保留אִישׁ的阳性单数形式和人物比喻，不把它直接解释为战士或军队同心；但该短语也常可理解为全军统一行动，因此在脚注中保存这一合理的语义可能。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。分号保留原文并列推进的节奏；“巴比伦之女啊”维持先知诗歌中的人格化呼告。脚注标记紧随其所说明的כְּאִישׁ短语，避免误系于前面的海涛比喻。
