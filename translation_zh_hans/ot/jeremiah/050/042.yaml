revisions:
- from: 他们手持弓和标枪；他们残忍，毫不怜悯。他们的声音如海涛轰鸣；他们骑着马，列好阵势，像一个男子准备上阵[a]，要攻击你，巴比伦之女啊！
  to: 他们手持弓和标枪；他们残忍，毫不怜悯。他们的声音如海涛轰鸣；他们骑着马，为作战列好阵势，如同一人[a]，要攻击你，巴比伦的女儿啊！
  rationale: 修订仅调整כְּאִישׁ及其与“列好阵势”的句法关系，使中文表达自然，并在正文与脚注之间保留该单数军事比喻的两种合理理解。其余内容维持原译的词义和庄重文体。
