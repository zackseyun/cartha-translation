source:
  edition: WLC
  text: אֵ֤יךְ נִגְדַּע֙ וַ/יִּשָּׁבֵ֔ר פַּטִּ֖ישׁ כָּל הָ/אָ֑רֶץ אֵ֣יךְ הָיְתָ֧ה לְ/שַׁמָּ֛ה בָּבֶ֖ל בַּ/גּוֹיִֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/023.yaml
  text: How the hammer of the whole earth has been cut down and broken! How Babylon has become a desolation among the nations![a][b]
translation:
  language: zh_hans
  text: 全地的锤子怎么竟被砍断、打碎了！巴比伦怎么竟在列国中成了一片荒凉[a]！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“巴比伦怎么竟在列国中成了令人惊骇之物！”原词既可指荒凉，也可强调人看见这废墟时的惊骇。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵיךְ
  choice: 怎么竟
  rationale: 这里是表达惊叹与哀叹的感叹语，并非询问信息；“怎么竟”在现代汉语中自然地保留这种震惊语气。
- source_word: נִגְדַּע
  choice: 被砍断
  rationale: גדע的尼法勒式表示被砍下或砍断；与后面的“打碎”并列，也凸显强者遭摧毁的反转。
- source_word: וַיִּשָּׁבֵר
  choice: 打碎了
  rationale: שבר在此具有被破坏、破碎之意；汉语用“打碎”与“锤子”搭配自然，同时保留被动意义所表达的结果。
- source_word: פַּטִּישׁ
  choice: 锤子
  rationale: 原词指锤子；直接保留比喻，使巴比伦这件曾击打列国的工具如今自身被毁的修辞反转清楚可见。
- source_word: כָּל הָאָרֶץ
  choice: 全地的
  rationale: 结合下句“列国”，这里指广阔的国际范围；“全地”既贴近原文，也保留其宏大的修辞尺度。
- source_word: הָיְתָה לְשַׁמָּה
  choice: 成了一片荒凉
  rationale: שַׁמָּה可指荒凉的状态，也可带有令人惊骇之意；正文采用自然而具先知文体色彩的“成了一片荒凉”，另一语义见脚注。
- source_word: בָּבֶל
  choice: 巴比伦
  rationale: 采用现代简体中文圣经与通行历史名称。
- source_word: בַּגּוֹיִם
  choice: 在列国中
  rationale: 此处是地缘政治性的列国或众民族，并非后期神学意义上的“外邦人”；“列国”庄重、简洁且符合语境。
theological_decisions:
- issue: 巴比伦被称为“全地的锤子”的比喻
  choice: 正文直接保留“全地的锤子”
  alternative: 译作“全地的毁灭者”或“全地的战锤”
  rationale: 原文的工具性比喻构成本节的修辞核心：曾击打别人的锤子，如今自己被砍断、打碎。直译可避免将这一开放比喻缩窄为解释性称号。
- issue: שַׁמָּה兼具荒凉与骇异色彩
  choice: 正文译为“成了一片荒凉”，脚注说明也可强调成为令人惊骇之物
  alternative: 正文译为“在列国中成了令人惊骇之物”
  rationale: 两种语义色彩都由原词支持。正文优先呈现毁灭后的状态，脚注保存因其毁灭而引起惊骇的可能含义，不强行消除原文张力。
translation_notes:
  register: 采用现代、庄重而可朗读的普通话。“怎么竟……！”重复原文两个אֵיךְ形成的惊叹结构；“锤子”不改写为抽象的“毁灭者”。脚注标记[a]已在正文对应位置出现。
