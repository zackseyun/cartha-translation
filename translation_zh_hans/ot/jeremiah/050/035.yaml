source:
  edition: WLC
  text: חֶ֥רֶב עַל כַּשְׂדִּ֖ים נְאֻם יְהוָ֑ה וְ/אֶל יֹשְׁבֵ֣י בָבֶ֔ל וְ/אֶל שָׂרֶ֖י/הָ וְ/אֶל חֲכָמֶֽי/הָ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/035.yaml
  text: A sword is against the Chaldeans[a], declares Yahweh, and against the inhabitants of Babylon, and against her officials[b], and against her wise men.
translation:
  language: zh_hans
  text: “刀剑临到迦勒底人[a]！”雅威宣告，“也临到巴比伦的居民，临到她的官长[b]和智慧人！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “迦勒底人”或译“巴比伦人”。
    reason: lexical_alternative
  - marker: b
    text: “官长”或译“首领”。
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶרֶב עַל
  choice: 刀剑临到
  rationale: 希伯来文是无动词的审判宣告，直陈“刀剑”针对某人而来。“刀剑临到”在现代汉语中自然，并保留战争与毁灭迫近的意象。
- source_word: כַּשְׂדִּים
  choice: 迦勒底人
  rationale: 保留原文的民族称谓及其历史色彩；上下文中所指也可概括为巴比伦人，故以脚注说明。
- source_word: נְאֻם יְהוָה
  choice: 雅威宣告
  rationale: 这是先知书常见的神谕公式；“宣告”庄重而清楚，“雅威”直接呈现原文中的神名。
- source_word: וְאֶל
  choice: 也临到……临到
  rationale: אֶל本可表示“向、到”，但在此承接“刀剑临到”的敌对审判含义；重复“临到”保留原文列举时的修辞力度。
- source_word: יֹשְׁבֵי בָבֶל
  choice: 巴比伦的居民
  rationale: 准确表达“住在巴比伦的人”，同时采用自然、简洁的现代汉语。
- source_word: שָׂרֶיהָ
  choice: 她的官长
  rationale: שַׂר可指首领、官员、统治者或将领；“官长”兼顾政治领导与行政职分，又不误解为王室子弟。
- source_word: חֲכָמֶיהָ
  choice: 她的智慧人
  rationale: 直译原文所指被视为有智慧的群体，并保留巴比伦谋士和学识阶层的文化意味，而不限定为某一种职业。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”较贴近当代学界通常采用的拟音，也使神的专名与“主”这一称号有所区分。
- issue: “刀剑”的审判意象
  choice: 保留具体意象“刀剑”，不释义为“战争”或“毁灭”
  alternative: 战争临到／毁灭临到
  rationale: 原文以刀剑作为先知性审判宣告，既可指军事攻击，也承载神施行审判的含义；保留意象可避免把其意义范围过早限定。
translation_notes:
  register: 采用现代、庄重、易懂的先知宣告体。用引号和感叹号呈现原文简短而有力的审判宣告；以重复“临到”重现希伯来文列举结构。代词“她”承接作为城邦与帝国的巴比伦。
