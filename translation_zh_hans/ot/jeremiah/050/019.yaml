base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/019.yaml
  text: And I will bring Israel back to his pasture[a], and he will graze on Carmel and Bashan; and on the hill country of Ephraim and Gilead his appetite will be satisfied.
translation:
  language: zh_hans
  text: 我要领以色列回到他的草场；他必在迦密和巴珊吃草；他的胃口必在以法莲山地和基列得到满足[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“他的生命（或：他自己）必得饱足。”
    reason: 说明נֶפֶשׁ的原文字面表达及其较宽的语义范围；正文根据牧场和进食的语境译为“胃口”。
lexical_decisions:
- source_word: וְשֹׁבַבְתִּי
  choice: 我要领……回到
  rationale: 该动词表达使其归回或恢复；“领……回到”既保留实际归回的动作，也与后面的草场意象自然衔接。
- source_word: נָוֵהוּ
  choice: 他的草场
  rationale: נָוֶה可指居所、牧场或羊圈；下文明确使用吃草的牧养意象，因此译作“草场”最贴合语境。
- source_word: וְרָעָה
  choice: 他必……吃草
  rationale: 这里描写被拟作羊群的以色列在肥美地区放牧；“吃草”是现代汉语中自然、清楚的表达。
- source_word: הַכַּרְמֶל
  choice: 迦密
  rationale: 按现代中文圣经地名惯例音译此专名。
- source_word: הַבָּשָׁן
  choice: 巴珊
  rationale: 按现代中文圣经地名惯例音译此地区名。
- source_word: וּבְהַר אֶפְרַיִם
  choice: 在以法莲山区
  rationale: הַר在此指一片山地，而非单独一座山；“以法莲山区”既准确又符合现代汉语地理表达。
- source_word: וְהַגִּלְעָד
  choice: 和基列
  rationale: 按现代中文圣经地名惯例音译此地区名。
- source_word: תִּשְׂבַּע נַפְשׁוֹ
  choice: 他的食欲……得到满足
  rationale: 直译近于“他的生命/自身必得饱足”。在吃草和牧场的语境中，נֶפֶשׁ侧重有食欲、需要饱足的生命个体；译作“食欲”可传达语境含义，同时以脚注保留直译。
- source_word: יִשְׂרָאֵל
  choice: 以色列
  rationale: 这是民族专名；原文将以色列作为单数集合体加以拟人化。
theological_decisions:
- issue: 以色列的拟人化及单数形式
  choice: 使用单数第三人称“他／他的”
  alternative: 按群体意义使用“他们／他们的”
  rationale: 希伯来文以单数动词和单数代词指代以色列。保留单数形式可呈现原文把整个民族拟作一个归回并吃草的个体这一意象。
- issue: נֶפֶשׁ在进食语境中的译法
  choice: 正文译作“食欲”
  alternative: 较直译为“生命”或传统地译为“心灵”
  rationale: 本节的牧场、吃草和饱足语境表明，נֶפֶשׁ在此不是专指与身体分离的非物质“灵魂”，而是指有食欲、需要饱足的生命自身。正文按语境译出，脚注则保留原文表达的透明度。
translation_notes:
  register: 采用现代、庄重而通顺的普通话。保留牧养意象、地理名称的并列结构，以及原文将以色列视为单数整体的拟人化表达。
