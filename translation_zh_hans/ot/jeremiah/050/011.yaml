id: JER.50.11
reference: Jeremiah 50:11
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כִּ֤י תשמחי כִּ֣י תעלזי שֹׁסֵ֖י נַחֲלָתִ֑/י כִּ֤י תפושי כְּ/עֶגְלָ֣ה דָשָׁ֔ה ו/תצהלי כָּ/אֲבִּרִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/011.yaml
  text: Because you rejoice[a], because you exult, plunderers of my inheritance, because you frolic like a threshing heifer and neigh like stallions[b],
translation:
  language: zh_hans
  text: 因为你欢喜[a]，因为你雀跃，抢夺我产业[b]的人哪；因为你像踹谷的小母牛一样蹦跳，又像骏马[c]一样嘶鸣。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “因为”也可译作“虽然”。希伯来语连接词 כִּי 在这里既可按原因理解，也可结合讥讽和审判语气按让步理解。
    reason: lexical_alternative
  - marker: b
    text: “产业”也可译作“基业”，可指属于耶和华的百姓和／或土地。
    reason: lexical_alternative
  - marker: c
    text: “骏马”：希伯来语原意为“强壮有力者”；在“嘶鸣”的语境中指强健的马，也可具体理解为公马。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: כִּי在本句中重复三次，最自然地说明下文审判的缘由；译作“因为”也保留了本节与下一节在句法上的承接。鉴于语境也容许让步理解，另在脚注注明“虽然”的可能。
- source_word: תשמחי / תעלזי
  choice: 你欢喜 / 你雀跃
  rationale: 分别表达喜乐与更强烈、外显的欢腾，既保留平行递进，也符合先知讥讽性的语气。第二人称阴性单数按汉语以“你”表达，由上下文体现巴比伦被人格化。
- source_word: שֹׁסֵי נַחֲלָתִי
  choice: 抢夺我产业的人
  rationale: שֹׁסֵי指劫掠者；נַחֲלָתִי指属于耶和华的产业，可涵盖他的百姓和土地。“产业”保留归属及承受所得之物的意味。
- source_word: תפושי
  choice: 欢蹦
  rationale: 此处动词描写活泼、放纵的跳跃动作；“欢蹦”自然地配合小母牛的形象，并传达受讥讽的得意忘形。
- source_word: כְּעֶגְלָה דָשָׁה
  choice: 像踹谷的母牛犊一样
  rationale: 直陈农耕场景：小母牛踩踏谷物脱粒。“踹谷”简洁保留古代农业意象。
- source_word: ותצהלי כָּאֲבִּרִים
  choice: 又像骏马一样嘶鸣
  rationale: צהל在马匹语境中表示嘶鸣；אַבִּירִים本义强调强壮有力者，此处结合嘶鸣指强健的马。“骏马”既自然又保留力量感。
theological_decisions:
- issue: 第二人称阴性单数与复数称呼之间的关系
  choice: 以单数“你”保留对巴比伦这座城的拟人化称呼，同时把复数分词译作数目未明的“抢夺……的人”
  alternative: 统一译为复数“你们这些抢夺我产业的人”
  rationale: 希伯来文动词为阴性单数，而“抢夺者”为复数。中文“人”本身不标明单复数，因而能够保留原文在拟人化城市与其中劫掠者之间的张力，而不必强行消除。
- issue: 重复的כִּי表示原因还是让步
  choice: 正文采用原因义“因为”
  alternative: 译作“虽然”或“尽管”
  rationale: 原因义是כִּי的常见用法，并可把巴比伦因劫掠上帝产业而欢腾作为审判的缘由；但先知讥讽及后续审判也容许让步式理解，因此脚注保留该可能。
- issue: “我的产业”的所指
  choice: 不在正文限定为土地或百姓
  alternative: 明确译为“我的百姓”或“我的土地”
  rationale: נַחֲלָתִי可以指属于耶和华的百姓、土地，或两者兼有。译作“我的产业”保留圣约归属含义及原文的开放性。
translation_notes:
  register: 采用现代、庄重而易懂的先知诗歌语体。重复“因为”以保留原文的修辞节奏；“欢喜—雀跃—欢蹦—嘶鸣”逐步加强巴比伦得意忘形的画面。“踹谷”保留古代农业意象，不作解释性改写。
