  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: פָּתַ֤ח יְהוָה֙ אֶת א֣וֹצָר֔/וֹ וַ/יּוֹצֵ֖א אֶת כְּלֵ֣י זַעְמ֑/וֹ כִּי מְלָאכָ֣ה הִ֗יא לַֽ/אדֹנָ֧/י יְהוִ֛ה צְבָא֖וֹת בְּ/אֶ֥רֶץ כַּשְׂדִּֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/025.yaml
  text: Yahweh has opened his storehouse and brought out the weapons of his wrath[d][c][b][a], for this is a work of the Lord GOD of Armies in the land of the Chaldeans.
translation:
  language: zh_hans
  text: 雅威打开了他的库房[a]，拿出他震怒的兵器[b]；因为在迦勒底人之地[d]，主雅威——万军之主[c]——有一项工作要做。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “库房”或译“宝库”；按上下文也可理解为“军械库”。
    reason: lexical_alternative
  - marker: b
    text: “兵器”也可译“器具”或“工具”；原词含义较广，但这里很可能带有军事意味。
    reason: lexical_alternative
  - marker: c
    text: “主雅威——万军之主”传统译作“主万军之耶和华”。
    reason: lexical_alternative
  - marker: d
    text: “迦勒底人之地”或译“迦勒底”。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: 雅威
  rationale: 采用神圣四字名的中文音译，保留其作为以色列之神专名的性质，不以普通称号替代。
- source_word: פָּתַח
  choice: 打开了
  rationale: 完成体在此将行动呈现为已经落实；“打开了”符合现代汉语叙事表达。
- source_word: אֹצָרוֹ
  choice: 他的库房
  rationale: אוֹצָר可指库房或宝库；“库房”保留宽泛意象，不因下文的军事语境而把本词直接窄化为“军械库”。
- source_word: וַיּוֹצֵא
  choice: 拿出
  rationale: 该使役式表示使某物出来；在打开库房的具体图景中，“拿出”自然明白。
- source_word: כְּלֵי זַעְמוֹ
  choice: 他震怒的兵器
  rationale: כְּלִי本可泛指器具、装备或兵器；本段审判与战争语境支持“兵器”。זַעַם译为“震怒”，保留强烈而庄严的审判意味。
- source_word: מְלָאכָה
  choice: 一项工作
  rationale: 本词泛指工作、任务或所办之事；不进一步指定工作的性质，以保留原文概括性的表达。
- source_word: לַאדֹנָי יְהוִה צְבָאוֹת
  choice: 主雅威——万军之主——有一项工作要做
  rationale: 介词ל在“有工作归某人/由某人办理”的结构中，用自然汉语表达为“有一项工作要做”。אֲדֹנָי保留为“主”，יְהוָה保留专名“雅威”；“万军之主”使צְבָאוֹת这一称号在现代汉语中清楚可懂。
- source_word: בְּאֶרֶץ כַּשְׂדִּים
  choice: 在迦勒底人之地
  rationale: 按原文保留“迦勒底人之地”的族群领土表达；“迦勒底”则是较顺畅的地名化译法。
theological_decisions:
- issue: 复合神名אֲדֹנָי יְהוִה的译法
  choice: 主雅威
  alternative: 主耶和华；主上帝
  rationale: “主雅威”同时保留אֲדֹנָי的称号和יְהוָה的专名，避免把两者合并为一个泛称，也不额外加入原文没有的“上帝”一词。
- issue: צְבָאוֹת在神圣称号中的译法
  choice: 万军之主
  alternative: 万军；万军之雅威
  rationale: “万军之主”在中文中能清楚表达雅威统领众军的称号含义；脚注列出更贴近传统形式的译法，避免把此处的“军”限定为单一的人间军队。
translation_notes:
  register: 采用庄重而清楚的现代标准普通话。“库房—拿出—兵器”的连续意象予以保留；后半句调整为现代汉语自然语序。“万军之主”以破折号作为“主雅威”的同位称号。
