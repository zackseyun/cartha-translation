  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: לָ/כֵ֞ן שִׁמְע֣וּ עֲצַת יְהוָ֗ה אֲשֶׁ֤ר יָעַץ֙ אֶל בָּבֶ֔ל וּ/מַ֨חְשְׁבוֹתָ֔י/ו אֲשֶׁ֥ר חָשַׁ֖ב אֶל אֶ֣רֶץ כַּשְׂדִּ֑ים אִם לֹ֤א יִסְחָבוּ/ם֙ צְעִירֵ֣י הַ/צֹּ֔אן אִם לֹ֥א יַשִּׁ֛ים עֲלֵי/הֶ֖ם נָוֶֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/045.yaml
  text: 'Therefore hear the counsel of Yahweh that he has planned against Babylon[a], and his thoughts that he has devised against the land of the Chaldeans: Surely the little ones of the flock will drag them away[c][b]; surely he will make their pasture desolate.'
translation:
  language: zh_hans
  text: 所以，你们要听雅威针对巴比伦所定的谋略，以及他针对迦勒底人之地所筹划的意念：羊群中最小的必把他们拖走[a]；他必使他们的牧场荒凉[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “最小的”也可译作“幼小的”或“最卑微的”；这里很可能以羊群作比喻，指进攻者中最弱小或最不起眼的。
    reason: lexical_alternative
  - marker: b
    text: “牧场”也可译作“住处”。末句也可按另一种理解译为：“他必因他们使牧场荒凉。”
    reason: lexical_and_syntactic_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: 所以
  rationale: 表达承接上文的推论或结论，比生硬的“因此之故”更符合现代汉语。
- source_word: עֲצַת יְהוָה
  choice: 雅威所定的谋略
  rationale: עֵצָה在此指经过筹定的谋略或计划；“谋略”保留先知宣告中审判计划的庄重语气。יהוה按其专名音译为“雅威”。
- source_word: יָעַץ אֶל־בָּבֶל
  choice: 针对巴比伦所定
  rationale: אֶל字面为“向着”，在敌对审判的语境中表示计划所针对的对象；“针对”既自然又不夸大为已经实施的攻击。
- source_word: וּמַחְשְׁבוֹתָיו אֲשֶׁר חָשַׁב
  choice: 他所筹划的意念
  rationale: מַחֲשָׁבוֹת可指思想、意图或计划；译作“意念”保留它与前面的“谋略”之间的词汇区别，“筹划”则传达动词חָשַׁב在此处的有意谋定之义。
- source_word: אֶרֶץ כַּשְׂדִּים
  choice: 迦勒底人之地
  rationale: 直接反映“迦勒底人的土地”这一希伯来语结构，也避免仅用地名“迦勒底”可能产生的含混。
- source_word: אִם לֹא
  choice: 必
  rationale: 两次出现的אִם לֹא在这里是誓言式加强语气，不是普通条件句；汉语用“必”自然表达确定性。
- source_word: יִסְחָבוּם
  choice: 必把他们拖走
  rationale: 保留复数主语和复数宾语；סחב表示拖、拉走，具有强制带离的形象。
- source_word: צְעִירֵי הַצֹּאן
  choice: 羊群中最小的
  rationale: 保留原文“羊群”这一比喻，不直接解释为弱小的进攻者；צָעִיר可表示幼小、微小或地位低微。
- source_word: נָוֶה
  choice: 牧场
  rationale: 该词可指牧场、居所或住处；“牧场”与前一句的羊群意象相呼应，同时在脚注保留“住处”的可能。
- source_word: יַשִּׁים עֲלֵיהֶם נָוֶה
  choice: 他必使他们的牧场荒凉
  rationale: 按审判语境将该结构理解为使与他们有关的牧场或居所荒凉；用所属表达处理עֲלֵיהֶם，使现代汉语通顺，同时以脚注标示该结构的另一种理解。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文使用以色列上帝的专名；音译“雅威”保留专名性质，不以称号“主”代替。
- issue: “羊群中最小的”所指为何
  choice: 正文保留比喻，不明确解释其所指
  alternative: 译为“最弱小的进攻者”或“最不起眼的敌军”
  rationale: 语境很可能指巴比伦攻击者中最弱小或最不起眼的，但原文没有明说；保留比喻可避免把推断写入正文。
- issue: 末句עֲלֵיהֶם与נָוֶה的关系
  choice: 译作“他们的牧场”
  alternative: “因他们使牧场荒凉”或“使他们的住处荒凉”
  rationale: 希伯来语结构简略，עֲלֵיהֶם可在语境中表示与他们相关或临到他们；正文采用通顺的所属表达，但不排除因果或临到其上的理解。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。以“听……听……”呈现复数命令和两个平行宾语；保留“羊群”与“牧场”的诗性意象，并将原文中两次誓言式的אִם לֹא都以“必”表达，其中首处配合“也”突出连最小者都能拖走巴比伦人的反讽力量。
