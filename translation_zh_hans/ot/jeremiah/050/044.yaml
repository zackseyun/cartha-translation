source:
  edition: WLC
  text: הִ֠נֵּה כְּ/אַרְיֵ֞ה יַעֲלֶ֨ה מִ/גְּא֣וֹן הַ/יַּרְדֵּן֮ אֶל נְוֵ֣ה אֵיתָן֒ כִּֽי אַרְגִּ֤עָה ארוצ/ם מֵֽ/עָלֶ֔י/הָ וּ/מִ֥י בָח֖וּר אֵלֶ֣י/הָ אֶפְקֹ֑ד כִּ֣י מִ֤י כָמ֨וֹ/נִי֙ וּ/מִ֣י יוֹעִדֶ֔/נִּי וּ/מִֽי זֶ֣ה רֹעֶ֔ה אֲשֶׁ֥ר יַעֲמֹ֖ד לְ/פָנָֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/044.yaml
  text: Look[a], like a lion he comes up from the thicket of the Jordan against a secure pasture; for in an instant I will make them run from it, and I will appoint over it whoever is chosen. For who is like me[c][b], and who can summon me? What shepherd can stand before me?
translation:
  language: zh_hans
  text: 看哪，他像狮子从约旦河边的密林[a]上来，来到安稳的牧场。因为转眼之间，我必使他们从那里逃走[b]；我也必任命所拣选的人管理那里。谁能像我？谁能传唤我[c]？有哪个牧人能在我面前站立得住？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语直译为“从约旦河的威荣”；这里可能指约旦河岸繁茂浓密的灌木林。
    reason: lexical_alternative
  - marker: b
    text: 或译：“我必把他们从那里赶走。”
    reason: lexical_alternative
  - marker: c
    text: 或译：“谁能给我定下时间？”这句话也可含有约定会面时间或传唤问责的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: 看哪
  rationale: 作为引出鲜明先知性画面的篇章标记，“看哪”既保留提醒和强调作用，也符合庄重的现代汉语表达。
- source_word: כְּאַרְיֵה יַעֲלֶה
  choice: 他像狮子……上来
  rationale: 保留比喻和第三人称形式，并以现在可感的画面呈现先知性叙述，不先行判定“他”的具体身份。
- source_word: מִגְּאוֹן הַיַּרְדֵּן
  choice: 从约旦河边的密林
  rationale: גאון用于约旦河时很可能指河岸繁茂浓密的灌木林，是狮子栖息出没之处；脚注保留字面“约旦河的威荣”。
- source_word: אֶל נְוֵה אֵיתָן
  choice: 扑向安稳的牧场
  rationale: נוה可指牧场或居所，איתן有稳固、长久之意；“安稳的牧场”维持狮子与牧人的整体意象，“扑向”自然表达敌对趋向。
- source_word: כִּי אַרְגִּעָה ארוצם מֵעָלֶיהָ
  choice: 因为转眼之间，我必使他们从那里逃走
  rationale: רגע表达极短时间；ארוצם来自“跑”，按语境取使役意味，同时保留复数宾语“他们”。
- source_word: וּמִי בָחוּר אֵלֶיהָ אֶפְקֹד
  choice: 我也必派所拣选的人治理那里
  rationale: 压缩的希伯来语句法表达神将选定并委派一人；פקד在此兼有委任、使其负责之意，“治理”说明其受派管理该地。
- source_word: כִּי מִי כָמוֹנִי
  choice: 谁能像我
  rationale: 保留宣告上帝无可比拟的反问形式。
- source_word: וּמִי יוֹעִדֶנִּי
  choice: 谁能传唤我
  rationale: יעד的使役形可表示约定时间、召来或传唤；正文采用符合问责语境的“传唤”，脚注保留“给我定下时间”的可能。
- source_word: וּמִי זֶה רֹעֶה אֲשֶׁר יַעֲמֹד לְפָנָי
  choice: 有哪个牧人能在我面前站立得住
  rationale: 保留“牧人”意象；“站立得住”传达面对上帝而能够抗衡、抵挡的语境含义。
theological_decisions:
- issue: 狮子意象的所指与第一人称神谕之间的关系
  choice: 保留“他……上来”到“我必……”的原文转换，不明确等同二者。
  alternative: 把狮子直接解释为入侵的君王，或直接解释为耶和华自己。
  rationale: 原文先以第三人称描绘狮子，继而转入上帝第一人称的审判宣告。保留这种转换，可呈现入侵者与上帝主权行动之间的张力，而不加入原文未明说的身份判定。
- issue: “所拣选的人”的身份
  choice: 译作未指名的“所拣选的人”。
  alternative: 明确译成某位具体君王、统帅或牧人。
  rationale: בָחוּר表示被选择者，但本节没有点名；不把后来的历史或教义身份读入经文。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“看哪”“必”等词维持先知宣告的力度；整体保留狮子、牧场和牧人的连续意象。所有脚注标记均置于相关正文词句之后。
