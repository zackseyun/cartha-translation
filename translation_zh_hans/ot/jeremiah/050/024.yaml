revisions:
- from: 我为你设下圈套[a]，你果然被捉住了，巴比伦；你却毫不知情。你被发现，又被抓获[b]，因为你竟与雅威争斗。
  to: 我给你设下圈套[a]，你也被捉住了，巴比伦；你却毫不知情。你被发现，又被抓获[b]，因为你与雅威抗争。
  rationale: 将“果然”改为“也”，以对应וְגַם而不引入原文未明说的应验意味；删去“竟”，避免额外的评价性强化；将“争斗”调整为“抗争”，更自然地表达此处向雅威挑起对抗的含义。其余译文及脚注均可保留。
