    rationale: וְגַם基本为“也、并且、甚至”的附加或强调；“果然”通常预设预期、验证或事情如所料发生。此处并无这种明确预设，改作“也”可避免添加。
  - severity: low
    issue: “竟”属于可省略的解释性修辞。
    rationale: הִתְגָּרִית表达向雅威挑起对抗/与之抗争，但并没有一个单独对应“竟”的词。删去可更严格保留原文，同时不损失庄重语气。
