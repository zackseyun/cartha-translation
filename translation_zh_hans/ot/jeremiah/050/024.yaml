base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/024.yaml
  text: I set a trap for you[a], and you also were caught, Babylon, and you did not know it; you were found and also seized[c][b], because you contended against Yahweh.
translation:
  language: zh_hans
  text: 我给你设下圈套[a]，你也被捉住了，巴比伦；你却毫不知情。你被发现，又被抓获[b]，因为你与雅威抗争。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我为你布下罗网。”
    reason: lexical_alternative
  - marker: b
    text: 或译：“你被找到，也被擒住。”这两个动词连用，加强了巴比伦彻底败落的语气。
    reason: lexical_alternative
lexical_decisions:
- source_word: יָקֹשְׁתִּי לָךְ
  choice: 我为你设下圈套
  rationale: 保留设下罗网或陷阱的具体意象；“设下圈套”是自然的现代汉语，也清楚表明巴比伦是针对的对象。
- source_word: וְגַם נִלְכַּדְתְּ
  choice: 你果然被捉住了
  rationale: נלכדת承接圈套意象，译为“被捉住”；גם在此带强调意味，以“果然”表达，避免生硬的“也”。
- source_word: לֹא יָדָעַתְּ
  choice: 你却毫不知情
  rationale: 希伯来文没有明说宾语；汉语“毫不知情”自然地保留这种不明确性，并表达巴比伦未察觉圈套与被捕。
- source_word: נִמְצֵאת וְגַם נִתְפַּשְׂתְּ
  choice: 你被发现，又被抓获
  rationale: 分别保留“被找到、显露”和“被抓住、擒获”两个动词，并用“又”体现גם的递进强调。
- source_word: הִתְגָּרִית
  choice: 你竟……争斗
  rationale: 该Hitpael形式表示挑起对抗、与之争竞；“争斗”保留双向敌对意味，“竟”传达这种行为面对雅威时的冒犯与不自量力，但不把词义收窄为单纯“激怒”。
- source_word: בַיהוָה
  choice: 与雅威
  rationale: 介词ב在此随动词表达对抗对象，译作“与”；יהוה按专名音译为“雅威”。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；“雅威”较贴近学界通行的拟音，并保留其作为专名的性质。
- issue: הִתְגָּרִית所表达的对抗性质
  choice: 与雅威争斗
  alternative: 向雅威挑战；招惹雅威
  rationale: “争斗”保留挑起对抗或争竞的语义张力，不额外限定为言语挑战，也不只解释为引起神的愤怒。
translation_notes:
  register: 采用现代、庄重而易懂的叙述语言。以第二人称阴性单数所指的巴比伦为拟人化受话者；用分号和短句保留先设圈套、继而捕获、最后说明原因的推进结构。
