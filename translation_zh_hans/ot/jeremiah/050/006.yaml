source:
  edition: WLC
  text: צֹ֤אן אֹֽבְדוֹת֙ היה עַמִּ֔/י רֹעֵי/הֶ֣ם הִתְע֔וּ/ם הָרִ֖ים שובבים מֵ/הַ֤ר אֶל גִּבְעָה֙ הָלָ֔כוּ שָׁכְח֖וּ רִבְצָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/006.yaml
  text: My people have been lost sheep[a]; their shepherds have led them astray, turning them away on the mountains. They have gone from mountain to hill[b]; they have forgotten their resting place.
translation:
  language: zh_hans
  text: 我的子民成了迷失的羊群[a]；他们的牧人使他们走入歧途，让他们在群山间流离。他们从山走到山冈[b]，忘了自己安歇的地方。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这句也可较形式化地译为：“我的子民是迷失的羊；他们的牧人使他们走入歧途，山岭使他们偏离。”原文中与“山岭”相关的“使他们流离”这一表达，词义和句法都较难确定。
    reason: lexical_alternative
  - marker: b
    text: “从山走到山冈”也可能使人联想到以色列人在各处高地间辗转；在《耶利米书》中，山冈有时与背道和敬拜偶像有关。
    reason: cross_reference
lexical_decisions:
- source_word: צֹאן אֹבְדוֹת
  choice: 迷失的羊群
  rationale: צֹאן是集合名词，可指羊群；אֹבְדוֹת在牧羊语境中表示迷失、失散。译作“迷失的羊群”既保留比喻，也不把含义过度限定为灭亡。
- source_word: היה עַמִּי
  choice: 我的子民成了
  rationale: 谓语结构描述子民所处的状态；“成了”在现代汉语中自然，并保持先说比喻、后点明“我的子民”的希伯来语强调关系。汉语为通顺而调整语序。
- source_word: רֹעֵיהֶם
  choice: 他们的牧人
  rationale: 保留牧羊比喻及其对民众领袖的隐含指涉，不直接解释为“领袖”，以免削弱原文意象。
- source_word: הִתְעוּם
  choice: 使他们走入歧途
  rationale: תעה的使役形明确表示牧人导致羊群迷失；此译保留使役关系和牧人的责任。
- source_word: הָרִים שובבים
  choice: 让他们在群山间流离
  rationale: 这一短语的句法和词义较难确定。正文按上下文表达羊群因牧人而在山间迷失流离，同时在脚注中保留较形式化的另一种理解。
- source_word: מֵהַר אֶל גִּבְעָה הָלָכוּ
  choice: 他们从山走到冈
  rationale: הָלָכוּ本义为“走、去”；译作“走到”比直接重复“流离”更贴近词面。מֵהַר אֶל גִּבְעָה直译为“从山到冈”，保留连续移动的图景。
- source_word: שָׁכְחוּ רִבְצָם
  choice: 忘了自己安歇的地方
  rationale: רִבְצָם指牲畜躺卧、休息之处；“安歇的地方”自然清楚，又不将其过度具体化为羊圈或草场。
theological_decisions:
- issue: “山”和“冈”是否明确指向偶像崇拜的邱坛
  choice: 正文保留山冈的地理和牧羊意象，不明说偶像崇拜
  alternative: 将“冈”解释性地译为敬拜偶像的“丘坛”
  rationale: 耶利米书中山冈有时与背道和邱坛崇拜相关，但本节直接语境是迷羊受牧人误导。保留原有意象，可让潜在暗示继续存在，而不把一种解释写入正文。
- issue: 难词שובבים的主语和作用
  choice: 结合上下文译为牧人“让他们在群山间流离”
  alternative: 按较形式化的句法理解为“群山使他们偏离”或“使他们转离的山”
  rationale: 原文在此句法紧缩且含义不够确定。正文传达牧人致使羊群流离的主要脉络，脚注则保存“山岭”可能担当作用者的形式化读法，避免掩盖原文难点。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“牧人”“羊群”“安歇的地方”贯穿牧羊意象；分号保持先陈述迷失及其原因、再描写漂泊及后果的诗性层次。正文不强行消除שובבים的歧义，相关形式化读法置于脚注。
