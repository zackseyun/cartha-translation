  yaml_path: translation/ot/jeremiah/050/030.yaml
  text: Therefore her young men will fall in her streets[a], and all her warriors will be silenced on that day, declares Yahweh.
translation:
  language: zh_hans
  text: 因此，她的青年人必倒下在她的街道上；她所有的战士在那日都必沉寂[a]。这是雅威的宣告。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“都必灭亡”。希伯来语动词可表示“沉默”或“静止”，在这里也可能暗指因死亡而归于沉寂。
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: 因此
  rationale: 保留这一推论连接词与前文审判宣告之间明确的因果关系。
- source_word: יִפְּלוּ
  choice: 必倒
  rationale: 直译 נפל 的“倒下”意象；在战争和审判语境中可自然表示战死，但正文不额外明说“被杀”。
- source_word: בַחוּרֶיהָ
  choice: 她的青年人
  rationale: 指正值壮年的年轻男子，语境虽可能带有军事意味，但此处保留较宽泛的原词含义。
- source_word: בִּרְחֹבֹתֶיהָ
  choice: 在她的街道上
  rationale: רחובות 可指城中的宽街或广场；“街道”在现代汉语中自然，也符合城市受审判的场景。
- source_word: אַנְשֵׁי מִלְחַמְתָּהּ
  choice: 她所有的战士
  rationale: 原文直义为“她的战争之人”；“战士”简洁自然地表达参战人员，כָל 译为“所有的”。
- source_word: יִדַּמּוּ
  choice: 必沉寂
  rationale: 保留 דמם 所含“沉默、静止”的意象，同时让战争审判语境传达因死亡而归于沉寂的可能含义，不在正文中消除词义张力。
- source_word: בַּיּוֹם הַהוּא
  choice: 到那日
  rationale: 自然表达先知性宣告中所指的特定将来时日。
- source_word: נְאֻם יְהוָה
  choice: 这是雅威的宣告
  rationale: 以现代、庄重的汉语表达先知信息中的神谕公式，并将四字神名音译为“雅威”。
theological_decisions:
- issue: 如何翻译神名 יְהוָה
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名；采用现代汉语常见的音译“雅威”，保留其作为专名的性质，而不以称号替代。
- issue: 是否明确把 יִדַּמּוּ 译为死亡
  choice: 必沉寂
  alternative: 必灭亡
  rationale: 该动词可表示沉默或静止，在此战争审判语境中很可能暗含死亡。正文保留原有意象和含义张力，脚注列出明确表达死亡结果的译法。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“必倒”保留希伯来语的军事意象；“必沉寂”避免把原文可能兼具的沉默、静止与死亡含义单一化。代词“她”承接上下文中拟人化的巴比伦。脚注标记置于其实际所说明的“沉寂”之后。
