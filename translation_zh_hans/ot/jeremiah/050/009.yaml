  naturalness: 整体庄重、可读。“她必从那里被攻取”虽较直译而略显凝滞，但在先知书的庄重语体中可接受，且保留原文空间副词的开放指向。修订后的首句将来源、行动者和攻击对象的关系表达得更清楚。
