source:
  edition: WLC
  text: כִּ֣י הִנֵּ֣ה אָנֹכִ֡י מֵעִיר֩ וּ/מַעֲלֶ֨ה עַל בָּבֶ֜ל קְהַל גּוֹיִ֤ם גְּדֹלִים֙ מֵ/אֶ֣רֶץ צָפ֔וֹן וְ/עָ֣רְכוּ לָ֔/הּ מִ/שָּׁ֖ם תִּלָּכֵ֑ד חִצָּי/ו֙ כְּ/גִבּ֣וֹר מַשְׁכִּ֔יל לֹ֥א יָשׁ֖וּב רֵיקָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/009.yaml
  text: For behold[a], I am stirring up and bringing against Babylon an assembly of great nations from the land of the north. They will array themselves against her; from there she will be captured. Their arrows are like those of a skilled warrior[b]; none returns empty-handed.
translation:
  language: zh_hans
  text: 因为，看哪，我必激起并使一群强大的列国从北方之地上来，攻击巴比伦。他们要列阵攻击她；她必从那里被攻取。[a]他们的箭好像善战勇士的箭；没有一支徒然返回。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “从那里”可能指列国列阵攻击巴比伦之处。
    reason: 原文副词מִשָּׁם的具体所指没有完全明说；脚注保留其空间指向的开放性。
  - marker: b
    text: 或译：“他的箭好像善战的勇士；他必不空手返回。”希伯来文的比较很紧缩，“箭”“勇士”和“不空返”之间的确切关系并不完全明确。
    reason: 保留压缩句法所产生的词汇和指代歧义，避免正文排除另一种合理理解。
lexical_decisions:
- source_word: מֵעִיר
  choice: 激起
  rationale: 该词为עור的使役分词，表示使列国奋起行动；“激起”既保留使役含义，也符合现代汉语表达。
- source_word: וּמַעֲלֶה
  choice: 使他们上来攻击
  rationale: עלה的使役形式在军事语境中可指使军队上来进攻；补出“他们”和“攻击”，使汉语关系清楚而不改变原意。
- source_word: קְהַל גּוֹיִם גְּדֹלִים
  choice: 许多大国
  rationale: קהל本指集结的群体，גוים גדלים指强大或规模宏大的列国。此处用“许多大国”自然传达联合集结之意；不采用“联盟”，以免过度具体化其政治组织形式。
- source_word: מֵאֶרֶץ צָפוֹן
  choice: 从北方之地
  rationale: 保留先知书中常见的地域表达，同时采用现代读者容易理解的措辞。
- source_word: וְעָרְכוּ לָהּ
  choice: 他们要列阵攻击她
  rationale: ערך在军事语境中指摆开阵势、列阵；“攻击她”表达לָהּ在此处的敌对方向。
- source_word: מִשָּׁם תִּלָּכֵד
  choice: 她必从那里被攻取
  rationale: מִשָּׁם直译为“从那里”，其确切指向略有压缩；תִּלָּכֵד为被动，表示被攻取或被俘获。正文保留原文空间关系，并以脚注说明。
- source_word: חִצָּיו
  choice: 他们的箭
  rationale: 希伯来文后缀为阳性单数，可把进攻的集结体视为一个整体；汉语按上下文中的复数列国译作“他们的”，避免生硬，也保留集体所指。
- source_word: כְּגִבּוֹר מַשְׁכִּיל
  choice: 好像善战勇士的箭
  rationale: 原文比较结构紧缩，מַשְׁכִּיל可表示有技巧、精明或因技巧而成功。“善战勇士”兼顾军事技能与成效；补出“的箭”使汉语比喻通顺。
- source_word: לֹא יָשׁוּב רֵיקָם
  choice: 没有一支徒然返回
  rationale: 直译为“不空空返回”。结合箭的意象，以“一支”为主语，表达每箭皆有效而不落空，并保留“返回”的原文图像。
theological_decisions:
- issue: 进攻列国的行动主体与上帝的主权作用
  choice: 保留“我要……激起……使他们上来”的第一人称使役表达，明确耶和华发动并带来进攻巴比伦的列国。
  alternative: 仅译成对列国进攻的描述，弱化上帝的直接使役作用。
  rationale: 原文 אָנֹכִי 与两个使役分词 מֵעִיר、מַעֲלֶה 明确突出说话者的行动；这是语法所表达的含义，不是外加的教义解释。
- issue: 箭、勇士与“不空返”的句法关系
  choice: 正文将箭比作善战勇士的箭，并把“不徒然返回”理解为箭无一落空。
  alternative: 直译为“他的箭好像善战的勇士；他不空手返回”，让“不空返”指勇士或整体军队。
  rationale: 希伯来文比较高度压缩，代词与单数动词容许不同关联。正文采用最通顺且符合军事意象的读法，同时用脚注保留更直译的另一可能。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“看哪”保留 הִנֵּה 的宣告和强调功能；以“她”指拟人化的巴比伦。军事词汇使用“列阵”“攻取”“善战勇士”，既贴近原文又便于普通读者理解。
