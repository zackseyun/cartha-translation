base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/032.yaml
  text: And the arrogant one will stumble and fall[a], with no one to raise him up; and I will kindle a fire in his cities[b], and it will consume all around him.
translation:
  language: zh_hans
  text: 狂傲者必绊倒，倒下[a]，无人把他扶起；我要在他的城邑中点起火来[b]；这火必烧尽他周围的一切。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “狂傲者”或译“狂傲”“狂妄”。希伯来语 זָדוֹן 通常可作抽象名词，但本节相连的动词和代词均为阳性单数，因此正文按人格化表达翻译。
    reason: lexical_alternative
  - marker: b
    text: 原文作“他的城邑”。这里把巴比伦人格化为一个阳性单数人物。
    reason: cultural_note
lexical_decisions:
- source_word: זָדוֹן
  choice: 狂傲者
  rationale: 该词常指抽象的“狂傲、狂妄”，但本节的动词和代词均为阳性单数，语境又把巴比伦人格化，因此译作“狂傲者”，同时用脚注保留抽象释义的可能。
- source_word: כָשַׁל
  choice: 必绊倒
  rationale: 在预言审判的语境中，此完成式表达将要发生的确定结果；“绊倒”保留原文失足不稳的形象。
- source_word: נָפַל
  choice: 倒下
  rationale: 与“绊倒”并列，保留原文从失足到倒下的递进，而不将其扩大解释为政治覆亡。
- source_word: מֵקִים
  choice: 把他扶起
  rationale: 使役分词表示使跌倒者重新起来；“扶起”是自然的现代汉语，也保留具体形象。
- source_word: הִצַּתִּי אֵשׁ
  choice: 我要……点燃烈火
  rationale: 原文明确包含“火”，在预言语境中译为将来的审判行动；“点燃烈火”自然且有庄重感。
- source_word: בְּעָרָיו
  choice: 在他的城邑中
  rationale: 后缀为阳性单数，承接巴比伦被人格化为“狂傲者”的表达；“城邑”准确涵盖其所属诸城。
- source_word: וְאָכְלָה
  choice: 烧尽
  rationale: 阴性单数动词以“火”为主语，描写火吞噬焚毁的结果；“烧尽”在汉语中明确、自然。
- source_word: כָּל סְבִיבֹתָיו
  choice: 他周围的一切
  rationale: 保留“全部”与阳性单数所指对象，表达环绕巴比伦的一切都被火吞灭。
theological_decisions:
- issue: 巴比伦的阳性单数人格化
  choice: 保留“狂傲者……他……他的城邑”的人物化表达
  alternative: 把 זָדוֹן 译为抽象的“狂傲”，或以非人格化方式称巴比伦及其城邑
  rationale: 希伯来文连续使用阳性单数形式，把巴比伦或其狂傲人格化。保留这一张力，比将其化约为抽象品质或非人格国家称谓更贴近原文。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“城邑”略带书面色彩，但在先知审判语境中自然；“绊倒、倒下”保留两个连续动词，“烧尽他周围的一切”则以自然汉语传达火吞噬四围的意象。
