  text: הִנְ/נִ֤י אֵלֶ֨י/ךָ֙ זָד֔וֹן נְאֻם אֲדֹנָ֥/י יְהוִ֖ה צְבָא֑וֹת כִּ֛י בָּ֥א יוֹמְ/ךָ֖ עֵ֥ת פְּקַדְתִּֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/031.yaml
  text: Behold[a], I am against you, O arrogant one, declares the Lord GOD of hosts, for your day has come[b], the time when I will punish you.
translation:
  language: zh_hans
  text: “看哪，我与你为敌，狂傲者啊[a]！”主——万军之耶和华宣告说：“因为你的日子已经来到，我追讨你的时候到了[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “狂傲者”也可译作“傲慢者”或“放肆者”。原文以“狂傲”称呼人格化的巴比伦。
    reason: lexical_alternative
  - marker: b
    text: 原文直译近于“我察访你的时候”；这里的“察访”带有审判含义，指追究罪责、施行惩罚。
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנְנִי
  choice: 看哪，我
  rationale: 保留先知宣告中郑重、引人注意的语气；与后面的“与你为敌”连读自然。
- source_word: אֵלֶיךָ
  choice: 与你为敌
  rationale: 在审判语境中，הִנְנִי אֵלֶיךָ 表示敌对和审判，并非单纯的朝向。
- source_word: זָדוֹן
  choice: 狂傲者
  rationale: 该名词表示狂妄、傲慢或放肆，此处人格化地称呼巴比伦；“狂傲者”兼顾称谓形式与负面的道德含义。
- source_word: נְאֻם
  choice: 宣告说
  rationale: 体现先知书中权威性的神谕公式，同时符合现代汉语表达。
- source_word: אֲדֹנָי יְהוִה צְבָאוֹת
  choice: 主万军之耶和华
  rationale: “主”对应 אֲדֹנָי，“耶和华”直接标示圣名 יְהוִה，“万军之”对应 צְבָאוֹת；采用中文圣经语体中庄重而可辨识的组合称号。
- source_word: בָּא יוֹמְךָ
  choice: 你的日子已经来到
  rationale: 完成式把所定的审判之日说成已经临到，突出其确定性和紧迫性。
- source_word: עֵת פְּקַדְתִּיךָ
  choice: 我追讨你的时候到了
  rationale: פקד 在此审判语境中指查问罪责并施行惩罚；“追讨”保留了临到、鉴察和问责的语义层次，比单说“惩罚”稍宽。
theological_decisions:
- issue: 复合神名 אֲדֹנָי יְהוִה צְבָאוֹת 的译法
  choice: 主万军之耶和华
  alternative: 主耶和华——万军之主；主耶和华、万军的统帅
  rationale: 原文同时包含 אֲדֹנָי、圣名 יְהוִה 和 צְבָאוֹת。译文保留“主”与“耶和华”，不把圣名泛化为普通称号，也不把“万军”限定解释为某一种受造军队。
- issue: פקד 在本节中的审判含义
  choice: 追讨
  alternative: 惩罚；察访；向你问罪
  rationale: 上下文明确是对巴比伦的审判，但 פקד 本身含临到、鉴察、处置或问责等语义。“追讨”在中文中能表达因罪施行审判，同时避免把词义压缩为单一的刑罚动作。
translation_notes:
  register: 采用现代、庄重的先知宣告语体。“看哪”保留原文的郑重提示；直接引语与插入的宣告公式清楚呈现说话结构。用“与你为敌”“追讨”传达审判语境，同时通过脚注保留 פקד 的语义张力。
