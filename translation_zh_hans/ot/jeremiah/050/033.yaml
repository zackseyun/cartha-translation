  text: כֹּ֤ה אָמַר֙ יְהוָ֣ה צְבָא֔וֹת עֲשׁוּקִ֛ים בְּנֵי יִשְׂרָאֵ֥ל וּ/בְנֵי יְהוּדָ֖ה יַחְדָּ֑ו וְ/כָל שֹֽׁבֵי/הֶם֙ הֶחֱזִ֣יקוּ בָ֔/ם מֵאֲנ֖וּ שַׁלְּחָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/033.yaml
  text: 'Thus says Yahweh of hosts: The sons of Israel and the sons of Judah alike are oppressed[a]; all their captors hold them fast[b]; they refuse to let them go.'
translation:
  language: zh_hans
  text: 万军之耶和华如此说：以色列人和犹大人同受欺压[a]；所有掳走他们的人都牢牢扣住他们，不肯放他们走。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“以色列人受欺压，犹大人也和他们一同受欺压。”
    reason: 原文中“一同”与两个群体的句法关系可按较贴近希伯来语线性语序表达；正文则将两者视为共同主语。
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: 如此说
  rationale: 采用先知宣告的惯用表达，既贴近原文语序，又保持庄重自然。
- source_word: יְהוָה צְבָאוֹת
  choice: 万军之耶和华
  rationale: “耶和华”音译神名；“万军之”保留 צְבָאוֹת 所涵盖的天上与地上众军之广义，也符合现代中文圣经语体。
- source_word: עֲשׁוּקִים
  choice: 受欺压
  rationale: 该被动分词描述以色列与犹大当前共同遭受压迫的状态；“受欺压”简洁而准确。
- source_word: בְּנֵי יִשְׂרָאֵל וּבְנֵי יְהוּדָה
  choice: 以色列人和犹大人
  rationale: בְּנֵי 在民族名称中是群体称谓；现代汉语以“以色列人、犹大人”表达最自然，并不额外限定为男性后裔。
- source_word: יַחְדָּו
  choice: 同
  rationale: 修饰两群人共有的受压状态；“同受欺压”自然体现“一同、同样”的含义。
- source_word: שֹׁבֵיהֶם
  choice: 掳掠他们的
  rationale: 主动分词指掳走并扣留他们的人；使用动词性称谓比“俘虏他们的人”更符合经文语境。
- source_word: הֶחֱזִיקוּ בָם
  choice: 紧抓住他们
  rationale: 保留 החזיק ב 所表达的牢牢抓住、不肯松手之力度，并与下句“不肯放”形成呼应。
- source_word: מֵאֲנוּ שַׁלְּחָם
  choice: 不肯放他们走
  rationale: מֵאֲנוּ 表示坚决拒绝，שַׁלְּחָם 在被掳语境中指释放；此译自然保留两者语义。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文明确使用四字神名。中文采用广为人知且庄重的音译“耶和华”，不以“主”替代，从而保留专名性质。
- issue: בְּנֵי 的群体称谓是否直译为“儿子们”
  choice: 以色列人……犹大人
  alternative: 以色列的众子……犹大的众子
  rationale: 在此民族群体语境中，直译“众子”会使现代读者误以为只指男性或直接后代；“人”准确传达两群被掳百姓，不加入性别或神学限定。
- issue: יַחְדָּו 与受压状态的关系
  choice: 两群人同受欺压
  alternative: 以色列人受欺压，犹大人也和他们一起受欺压
  rationale: 原文可按语序理解为“以色列人受欺压，犹大人也同他们一起”，也可视为两组并列主语共同受压。正文用紧凑的共同状态表达，脚注保留较贴近线性语序的可能。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留先知公式“如此说”和传统称号“万军之耶和华”，同时避免生硬直译“以色列的众子”。分号呈现受压处境与掳掠者拒绝释放之间的推进关系。
