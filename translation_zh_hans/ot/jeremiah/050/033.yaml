- from: 万军之耶和华如此说：以色列人和犹大人同受欺压[a]；凡掳掠他们的，都紧抓住他们，不肯放他们走。
  to: 万军之耶和华如此说：以色列人和犹大人同受欺压[a]；所有掳走他们的人都牢牢扣住他们，不肯放他们走。
  rationale: 仅作两处语义与语体上的安全修订：将俘掳者明确为“掳走他们的人”，并以“牢牢扣住”表达其持续扣留。其余措辞及脚注所保留的句法可能性均可维持。
