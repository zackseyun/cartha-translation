base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/026.yaml
  text: Come against her from the farthest border[a]; open her storehouses; pile her up like heaps, and devote her to destruction[c][b]; let no remnant remain to her.
translation:
  language: zh_hans
  text: 你们要从极远之处前来攻击她[a]；打开她的仓房[b]，把她堆起，如同堆垛；使她归于彻底毁灭[c]，不可给她留下任何余剩。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “从极远之处”直译作“从尽头”或“从极处”。希伯来语没有明说所指的是哪一地域；也可理解为“从边境”或“从四境”。
    reason: lexical_alternative
  - marker: b
    text: “仓房”所译的希伯来词可指牲畜取食的槽或喂养之处；在此语境中，也可指粮仓、谷仓或储存供应物的仓房。
    reason: lexical_alternative
  - marker: c
    text: “使她归于彻底毁灭”所译的希伯来词含有使某物归于毁灭禁令之下、完全毁灭的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: בֹּאוּ לָהּ
  choice: 来攻击她
  rationale: בוא的复数命令式在先知向进攻者发出的召唤中可译为“来”；לָהּ在敌对行动的语境中表达针对性，因此译作“攻击她”。
- source_word: מִקֵּץ
  choice: 从尽头
  rationale: קֵץ本义为“尽头、极处”。原文没有明说是疆界、地域还是远方，正文保留简练和一定歧义，并以脚注说明可能含义。
- source_word: פִּתְחוּ מַאֲבֻסֶיהָ
  choice: 打开她的粮仓
  rationale: פתח是“打开”；מַאֲבוּס通常与喂养或储粮之处有关，在劫掠巴比伦的语境中，“粮仓”自然地表达储存粮食之所，同时脚注保留“仓房”等可能。
- source_word: סָלּוּהָ כְמוֹ עֲרֵמִים
  choice: 把她堆成一堆一堆
  rationale: סלל在此有“堆起、堆积”之意，עֲרֵמִים是复数“堆”。译文保留把巴比伦或其物资堆作许多堆的鲜明图像，而不擅自限定为谷堆。
- source_word: וְהַחֲרִימוּהָ
  choice: 彻底毁灭她
  rationale: חרם的使役式在审判语境中指将对象置于禁令之下而完全毁灭。正文采用现代读者易懂的“彻底毁灭”，脚注交代其专门含义。
- source_word: אַל תְּהִי לָהּ שְׁאֵרִית
  choice: 不可给她留下余民
  rationale: שְׁאֵרִית可指剩余之物或存留的人群；在针对城邦的审判宣告中，“余民”保留先知书的重要用语及原句的彻底性。
theological_decisions:
- issue: 审判宣告中 החרים 的译法
  choice: 正文译“彻底毁灭她”，脚注说明“置于禁令之下”
  alternative: 把她献作毁灭；使她归于当灭之物
  rationale: 原词不只是一般意义的破坏，也带有因禁令而完全毁灭的司法和宗教色彩。正文以自然、清楚的现代汉语传达结果，脚注保留其技术性内涵，避免把特定宗派解释带入正文。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。命令句保持紧迫有力；“一堆一堆”再现复数意象并使中文自然。“余民”保留先知文学中的传统神学用语。所有脚注标记均置于相应正文词语之后。
