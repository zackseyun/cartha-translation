source:
  edition: WLC
  text: שֶׂ֧ה פְזוּרָ֛ה יִשְׂרָאֵ֖ל אֲרָי֣וֹת הִדִּ֑יחוּ הָ/רִאשׁ֤וֹן אֲכָל/וֹ֙ מֶ֣לֶךְ אַשּׁ֔וּר וְ/זֶ֤ה הָ/אַחֲרוֹן֙ עִצְּמ֔/וֹ נְבוּכַדְרֶאצַּ֖ר מֶ֥לֶךְ בָּבֶֽל׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/017.yaml
  text: Israel is a scattered sheep[a]; lions have driven him away. First the king of Assyria devoured him[c][b], and this last one—Nebuchadnezzar king of Babylon—has gnawed his bones.
translation:
  language: zh_hans
  text: 以色列是一只被驱散的羊[a]；狮子把它赶走了。先是亚述王吞吃了它，后来这最后一个——巴比伦王尼布甲尼撒——啃噬了它的骨头[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “被驱散的”也可译作“离群的”或“流离失散的”；“羊”也可译作“羊羔”。
    reason: 保留 פְזוּרָה 的被动分散含义及 שֶׂה 可指羊或羊羔的词义范围。
  - marker: b
    text: “啃噬了它的骨头”也可理解为“咬碎了它的骨头”或“把它啃得只剩骨头”；该罕见动词的精确含义不确定。
    reason: 保留 עִצְּמוֹ 可能指啃骨、剥肉至骨或压碎骨头的语义不确定性，而不将争议解释定为单一含义。
lexical_decisions:
- source_word: שֶׂה
  choice: 羊
  rationale: 该词泛指绵羊或山羊中的幼小牲畜，可译“羊”或“羊羔”；此处用“羊”较自然，也保留以色列作为易受猛兽侵害之猎物的比喻。
- source_word: פְזוּרָה
  choice: 离群的
  rationale: 阴性被动分词表达分散、流离的状态；结合单数“羊”和狮子追赶的图景，“离群的”在中文中自然地呈现一只与羊群失散的羊，同时仍暗含民族被驱散之意。
- source_word: אֲרָיוֹת הִדִּיחוּ
  choice: 被狮子赶走了
  rationale: הדיח 的使役形可指驱逐、赶散或迫使逃离。采用被动句使中文顺畅，并维持羊遭狮子驱赶的捕食图景。
- source_word: אֲכָלוֹ
  choice: 吞吃了它
  rationale: 动词字面为“吃”，在猛兽与帝国压迫的比喻中译作“吞吃”能传达暴烈的捕食意味。
- source_word: וְזֶה הָאַחֲרוֹן
  choice: 后来这一个
  rationale: 保留指示词“这一个”及其与“先是”的时序对照，不把表达改写成仅表示最终一位的抽象说法。
- source_word: עִצְּמוֹ
  choice: 啃噬了它的骨头
  rationale: 这一罕见动词与“骨头”相关，可理解为啃骨、剔净骨上之肉，也可能泛指压碎；正文选择能延续猛兽捕食意象的“啃噬”，并用脚注保留词义范围。
- source_word: נְבוּכַדְרֶאצַּר
  choice: 尼布甲尼撒
  rationale: 采用现代中文圣经及一般中文中通行的人名译法；希伯来文本在此所用拼写的细微差别无需另造中文名。
theological_decisions:
- issue: 以色列的单数拟人化与动物意象
  choice: 将“以色列”比作“一只……羊”，后续用“它”指代
  alternative: 将以色列理解为复数羊群，后续改用“他们”
  rationale: 希伯来文 שֶׂה 为单数，后续两个宾语后缀也均为阳性单数。中文用动物代词“它”，既保持单数语法和比喻，也避免把民族集体含义擅自改成复数。
- issue: 两位帝王在捕食比喻中的次序
  choice: “先是……后来这一个……”
  alternative: “第一个……最后一个……”
  rationale: 原文 הָרִאשׁוֹן 与 הָאַחֲרוֹן 构成先后对照。中文采用自然的时序表达，并保留“这一个”的指示意味，不额外解释历史事件。
translation_notes:
  register: 采用庄重而易懂的现代标准普通话。“吞吃”“啃噬骨头”保留原文连贯而强烈的猛兽捕食意象；用破折号标明“巴比伦王尼布甲尼撒”是“后来这一个”的同位说明。所有脚注标记均置于正文相应位置。
