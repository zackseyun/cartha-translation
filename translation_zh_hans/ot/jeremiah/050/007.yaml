source:
  edition: WLC
  text: כָּל מוֹצְאֵי/הֶ֣ם אֲכָל֔וּ/ם וְ/צָרֵי/הֶ֥ם אָמְר֖וּ לֹ֣א נֶאְשָׁ֑ם תַּ֗חַת אֲשֶׁ֨ר חָטְא֤וּ לַֽ/יהוָה֙ נְוֵה צֶ֔דֶק וּ/מִקְוֵ֥ה אֲבֽוֹתֵי/הֶ֖ם יְהוָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/007.yaml
  text: All who found them devoured them[a], and their adversaries said, “We are not guilty, because they sinned against Yahweh, the habitation of righteousness[b], the hope of their fathers—Yahweh.”
translation:
  language: zh_hans
  text: 凡遇见他们的，都把他们吞吃了；他们的仇敌说：“我们没有罪责，因为他们得罪了雅威——公义的居所[a]，他们祖先所仰望的[b]——雅威。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“公义的草场”。希伯来语 נְוֵה 可指草场、住处或居所。
    reason: 保留该词在牧羊语境中的词义选择。
  - marker: b
    text: 或译“他们祖先所期待的”或“他们祖先的希望”。
    reason: 希伯来语 מִקְוֵה 可表示盼望、期待，也可指所盼望的对象。
lexical_decisions:
- source_word: מוֹצְאֵיהֶם
  choice: 凡遇见他们的
  rationale: 该分词作名词用，指所有碰上他们的人；“遇见”自然简洁，也不暗示刻意寻找。
- source_word: אֲכָלוּם
  choice: 吞吃他们
  rationale: 保留“吃”的掠食性比喻，表达敌人毁灭、侵吞他们。
- source_word: צָרֵיהֶם
  choice: 他们的仇敌
  rationale: 准确表达敌对者，现代汉语中自然庄重，又不局限于某一种军事身份。
- source_word: לֹא נֶאְשָׁם
  choice: 我们没有罪
  rationale: 按直接引语表达仇敌自称不负罪责；保留其辩解语气，不认可其判断。
- source_word: תַּחַת אֲשֶׁר
  choice: 因为
  rationale: 此结构在句中说明仇敌声称无罪的理由，用“因为”清楚传达因果关系。
- source_word: חָטְאוּ לַיהוָה
  choice: 他们得罪了雅威
  rationale: חטא加ל在此表示犯罪冒犯雅威；“得罪了”是自然的汉语宗教表达。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以音译呈现四字神名，保留其作为以色列之神专名的功能，而不以称号替代。
- source_word: נְוֵה צֶדֶק
  choice: 公义的居所
  rationale: נוה可指草场或居所；此处作为雅威的同位称谓，“居所”较能自然表达雅威是公义安居之处，同时保留脚注中的牧场义。
- source_word: מִקְוֵה אֲבוֹתֵיהֶם
  choice: 他们祖先所仰望的
  rationale: מִקְוֶה表示所盼望、所期待的对象；“所仰望的”在汉语中自然地把该短语指向雅威，并保留希望与期待的含义。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名，因此以“雅威”音译，保留专名性质。
- issue: נְוֵה צֶדֶק与מִקְוֵה אֲבוֹתֵיהֶם所指
  choice: 两者都作为雅威的同位称谓
  alternative: 将“公义的居所”理解为以色列的土地或羊圈
  rationale: 两短语位于“雅威”之后，末尾又重复“雅威”形成收束，句法上较自然地把二者理解为对雅威的称述；同时以脚注保留נוה的牧场义。
- issue: 仇敌的无罪宣称
  choice: 按引语直译为“我们没有罪”
  alternative: 解释为他们确实不负罪责
  rationale: 这是仇敌为吞吃百姓所作的辩解，译文只呈现其说法，不在译文中判定该说法正确。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。用分号区分叙述与引语，用破折号标明两个同位称谓最终都归于“雅威”。所有脚注标记均置于正文相应词语之后。
