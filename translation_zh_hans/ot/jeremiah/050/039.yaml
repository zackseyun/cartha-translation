base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/039.yaml
  text: Therefore desert creatures will dwell there with hyenas[a], and ostriches will dwell in her; she will never again be inhabited forever[c][b], nor will she be lived in from generation to generation.
translation:
  language: zh_hans
  text: 因此，荒野的走兽必与鬣狗[a]一同住在那里；鸵鸟[b]也必栖居其中。她[c]必永远不再有人居住；世世代代也无人居住。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“豺狼”或“嚎叫的野兽”；这些希伯来语荒野动物名称所指的确切物种不能确定。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“鸵鸟的女儿们”，意思是鸵鸟；较早的译本有时译作“猫头鹰”。
    reason: lexical_alternative
  - marker: c
    text: 希伯来语将这座城拟人化为女性；原文以阴性形式指称她，并说她必不再有人居住。
    reason: cultural_note
lexical_decisions:
- source_word: לָכֵן
  choice: 因此
  rationale: 以现代汉语常用的推论连接词，引出巴比伦受审判的结果。
- source_word: צִיִּים
  choice: 荒野的走兽
  rationale: 该词泛指与荒野、废墟相关的动物，确切物种不明，因此采用概括性译法。
- source_word: אֶת
  choice: 与……一同
  rationale: 此处 אֶת 表伴随关系，而非通常的直接宾语标记。
- source_word: אִיִּים
  choice: 鬣狗
  rationale: 该疑难词很可能指栖居废墟、发出嚎叫的野生食腐动物；“鬣狗”是常见推定，但在脚注保留其他可能。
- source_word: בְּנוֹת יַעֲנָה
  choice: 鸵鸟
  rationale: 字面为“鸵鸟的女儿们”，是指鸵鸟的希伯来语表达；旧译“猫头鹰”可能性较低。
- source_word: בָהּ
  choice: 在她里面
  rationale: 阴性单数后缀指巴比伦这座城；保留“她”以呈现先知文学中的城市拟人。
- source_word: לֹא תֵשֵׁב עוֹד לָנֶצַח
  choice: 她必再也无人居住，直到永远
  rationale: 兼顾“再也不”与“直到永远”的双重强调，保留原文对永久荒凉的强化表达。
- source_word: לֹא תִשְׁכּוֹן
  choice: 都无人定居
  rationale: 该动词意为居住、定居；汉语用无人称表达，自然传达城中不再有人居住。
- source_word: עַד דּוֹר וָדוֹר
  choice: 世世代代
  rationale: 以自然、庄重的汉语成语表达连续历代的长久时间。
theological_decisions:
- issue: 巴比伦荒凉的永久性
  choice: 保留“再也……直到永远”及“世世代代”的叠加强调
  alternative: 合并为单一的“永远无人居住”
  rationale: 原文连续使用 עוֹד、לָנֶצַח 和 עַד דּוֹר וָדוֹר 强调持续性；译文不将这种修辞张力简化。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“栖息”虽适合动物，但为贴近重复出现的“居住”语义并与后半节呼应，译作“住”；末句改用“定居”，避免汉语机械重复，同时保留平行结构。
