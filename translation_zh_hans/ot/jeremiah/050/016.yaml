source:
  edition: WLC
  text: כִּרְת֤וּ זוֹרֵ֨עַ֙ מִ/בָּבֶ֔ל וְ/תֹפֵ֥שׂ מַגָּ֖ל בְּ/עֵ֣ת קָצִ֑יר מִ/פְּנֵי֙ חֶ֣רֶב הַ/יּוֹנָ֔ה אִ֤ישׁ אֶל עַמּ/וֹ֙ יִפְנ֔וּ וְ/אִ֥ישׁ לְ/אַרְצ֖/וֹ יָנֻֽסוּ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/016.yaml
  text: Cut off from Babylon the sower[a], and the one who handles the sickle at the time of harvest. Because of the sword of the oppressor, each man will turn to his own people, and each will flee to his own land.
translation:
  language: zh_hans
  text: 要从巴比伦剪除撒种的，也要剪除收割时手握镰刀的。因压迫者的刀[a]，各人必转向自己的族人，各人必逃往自己的土地。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“施行压迫者的刀”。也有人译作“残酷的刀”；较不可能而按字面可译为“鸽子的刀”。
    reason: 原文הַיּוֹנָה的词源及所指有争议；保留“压迫者”、 “残酷”与按字面“鸽子”的主要替代解释。
lexical_decisions:
- source_word: כִּרְתוּ
  choice: 剪除
  rationale: 这是כרת的复数命令式；在审判语境中指除掉、消灭。“剪除”保留原文的切断意象和命令力度。
- source_word: זוֹרֵעַ מִבָּבֶל
  choice: 从巴比伦剪除撒种的
  rationale: 分词זוֹרֵעַ作名词用，指从事播种的人；מן与כרת连用，表示从巴比伦境内除去。
- source_word: וְתֹפֵשׂ מַגָּל בְּעֵת קָצִיר
  choice: 也剪除收割时手握镰刀的
  rationale: תפשׂ意为抓住、握住；直译其动作，同时由收割语境清楚表明这是收割者。第二个“剪除”在汉语中补出，以明确并列命令的支配关系。
- source_word: מִפְּנֵי
  choice: 因
  rationale: 此处引出人们转身逃亡的原因，用简洁的“因”符合庄重叙述语体。
- source_word: חֶרֶב הַיּוֹנָה
  choice: 那压迫者的刀剑
  rationale: הַיּוֹנָה最可能与表示压迫的词根相关，指施行压迫者；“刀剑”承接חֶרֶב，并以脚注保留其确有争议的词义。
- source_word: אִישׁ אֶל עַמּוֹ יִפְנוּ
  choice: 各人都要转向自己的族人
  rationale: אִישׁ在此作逐一分配用法；עַם在返乡语境中是所属族群。“各人”自然涵盖原文所指的每一个人，而不额外限定性别。
- source_word: וְאִישׁ לְאַרְצוֹ יָנֻסוּ
  choice: 各自逃回自己的故土
  rationale: נוס表示逃跑；לְאַרְצוֹ表示朝自己的土地去。“故土”自然传达各人返回原属之地，且“逃回”补足方向意味。
theological_decisions:
- issue: אִישׁ在分配句中的性别表达
  choice: 各人／各自
  alternative: 各个男人／每个人
  rationale: 这里的阳性单数形式按分配方式指群体中的每一个人，重点是逐一返族归土，并非强调生理性别；现代汉语“各人／各自”既准确又自然。
- issue: חֶרֶב הַיּוֹנָה的解释
  choice: 那压迫者的刀剑
  alternative: 残酷的刀剑／鸽子的刀剑
  rationale: 语境是导致外来人口逃离巴比伦的军事威胁，把הַיּוֹנָה理解为施压迫者最为连贯；但原形也可被联想到“鸽子”，故不掩盖其词汇歧义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“撒种的”“手握镰刀的”保留希伯来文分词式人物描写；“剪除”呼应审判语境。“刀剑”比单用“剑”更适合חֶרֶב的宽泛兵器义。
