id: JER.50.28
reference: Jeremiah 50:28
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: ק֥וֹל נָסִ֛ים וּ/פְלֵטִ֖ים מֵ/אֶ֣רֶץ בָּבֶ֑ל לְ/הַגִּ֣יד בְּ/צִיּ֗וֹן אֶת נִקְמַת֙ יְהוָ֣ה אֱלֹהֵ֔י/נוּ נִקְמַ֖ת הֵיכָלֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/028.yaml
  text: The sound of fugitives and escapees from the land of Babylon[a], to declare in Zion the vengeance of Yahweh our God[c][b], the vengeance for his temple.
translation:
  language: zh_hans
  text: 从巴比伦地传来逃亡者和脱险者[b]的声音[a]；他们要在锡安宣告耶和华——我们的上帝所施的报应，就是为他的殿所施的报应[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “声音”或译“呼声”。
    reason: lexical_alternative
  - marker: b
    text: “脱险者”或译“幸存者”。
    reason: lexical_alternative
  - marker: c
    text: 直译“他殿的报应”；这里很可能指因他的殿所受的侵害而施行报应。
    reason: lexical_alternative
lexical_decisions:
- source_word: ק֥וֹל
  choice: 声音
  rationale: קוֹל可指声音、呼声或声响。这里引出从巴比伦逃出之人的声音；译作“声音”既保留听觉画面，也不把群体过度具体化为单一说话者。句首加“听！”使希伯来语的省略式呼告在现代汉语中自然显明。
- source_word: נָסִים
  choice: 逃亡者
  rationale: 该词是נוּס（逃跑）的分词复数，指正在逃离的人。“逃亡者”简洁保留其动态含义。
- source_word: וּפְלֵטִים
  choice: 和脱险者
  rationale: 该词指逃脱或获救的人。“脱险者”与“逃亡者”形成对应，同时保留已经逃脱的重点；“幸存者”也是可能译法。
- source_word: מֵאֶרֶץ בָּבֶל
  choice: 从巴比伦地传来
  rationale: 原文明确含“地”אֶרֶץ，故保留“巴比伦地”。“传来”使“声音……从……”的关系符合现代汉语表达。
- source_word: לְהַגִּיד
  choice: 要……宣告
  rationale: 不定式表示目的，说明这些逃出者要在锡安公开传报此事。“宣告”兼顾庄重和清楚。
- source_word: בְּצִיּוֹן
  choice: 在锡安
  rationale: 介词בְּ表示地点“在……”，不是方向“到……”。
- source_word: נִקְמַת
  choice: 所施的报应
  rationale: נְקָמָה表示报仇、复仇或报应。此处是上帝对巴比伦的惩治；“所施的报应”保留司法性和惩罚力度，又比“上帝的报仇”更合乎自然、庄重的现代汉语。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代简体中文中通行的音译“耶和华”呈现四字神名，不以“主”这一称号替代。
- source_word: אֱלֹהֵינוּ
  choice: 我们上帝
  rationale: 保留第一人称复数后缀，呈现以色列群体“我们的上帝”这一认信。
- source_word: נִקְמַת הֵיכָלוֹ
  choice: 为他的殿所施的报应
  rationale: 第二个结构短语重复“报应”，并将其具体关联于圣殿，最可能指因圣殿遭毁坏而施行的报应。译文保留重复，并用“为”表达对象或缘由。
- source_word: הֵיכָלוֹ
  choice: 他的殿
  rationale: הֵיכָל在此指耶路撒冷圣殿。“殿”清楚、庄重，也避免“宫殿”在此语境中的误导。
theological_decisions:
- issue: 四字神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威；主
  rationale: 原文直接使用神名。译作“耶和华”保留专名性质，并符合现代中文圣经语境中的广泛认知；不以称号“主”代替。
- issue: 上帝的报应与圣殿之间的关系
  choice: 就是为他的殿所施的报应
  alternative: 就是他殿的报应；就是替他的殿报仇
  rationale: 原文“他殿的报应”是紧缩的属格结构，可能表示因圣殿所受侵害而施行的报应。正文采用最符合语境的关系，但以脚注保留原文较为含混的字面结构。
- issue: 两个“报应”的重复
  choice: 保留重复
  alternative: 合并为一次表达
  rationale: 希伯来文重复נִקְמַת，第二次具有说明和强调作用；保留重复能呈现原文的修辞力度。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。以“听！”自然呈现句首省略式的听觉呼告；分号划分声音出现与其宣告目的。保留“逃亡者／脱险者”和两次“报应”的平行与重复，不消除原文在“他殿的报应”这一结构上的张力。
