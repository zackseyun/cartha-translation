reference: Jeremiah 50:18
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: לָ/כֵ֗ן כֹּֽה אָמַ֞ר יְהוָ֤ה צְבָאוֹת֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל הִנְ/נִ֥י פֹקֵ֛ד אֶל מֶ֥לֶךְ בָּבֶ֖ל וְ/אֶל אַרְצ֑/וֹ כַּ/אֲשֶׁ֥ר פָּקַ֖דְתִּי אֶל מֶ֥לֶךְ אַשּֽׁוּר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/018.yaml
  text: 'Therefore thus says Yahweh of hosts[a], the God of Israel: Behold, I am about to punish the king of Babylon and his land, just as I punished the king of Assyria.'
translation:
  language: zh_hans
  text: 因此，万军之雅威——以色列的神如此说：“看哪，我就要惩罚[a]巴比伦王和他的国土，正如我惩罚了亚述王一样。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节两处“惩罚”所译的希伯来语动词也可表示“察看”“临到”或“追究、问责”；在本节的审判语境中，它带有惩治的含义。
    reason: 保留פקד的较宽语义范围，并说明正文为何在两处均按惩治义翻译。
lexical_decisions:
- source_word: לָכֵן
  choice: 因此
  rationale: 承接上文并引出结论，保留原文的推论关系。
- source_word: כֹּה אָמַר
  choice: 如此说
  rationale: 保留先知宣告中庄重的传信公式，同时符合现代中文表达。
- source_word: יְהוָה צְבָאוֹת
  choice: 万军之雅威
  rationale: “雅威”音译神名יהוה；“万军之”保留צְבָאוֹת所涵盖的众军、天军之广义，而不局限于人间军队。
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: 以色列的神
  rationale: 直接表达原文的属格结构，并与前一神圣称号构成同位说明。
- source_word: הִנְנִי
  choice: 看哪，我就要
  rationale: “看哪”保留引人注意的语气，“就要”表达神所宣告行动的迫近性。
- source_word: פֹקֵד / פָּקַדְתִּי
  choice: 惩罚 / 惩罚了
  rationale: פקד语义范围较广，但本节是审判巴比伦并类比亚述所受处置的语境，采用“惩罚”清楚传达其惩治含义；脚注保留其词义张力。
- source_word: מֶלֶךְ בָּבֶל
  choice: 巴比伦王
  rationale: 简洁、直接地翻译原文的构属短语。
- source_word: אַרְצוֹ
  choice: 他的国土
  rationale: 这里指巴比伦王统治的地域；“国土”比单用“地”更清楚，同时不把所指缩减为某一城市。
- source_word: כַּאֲשֶׁר
  choice: 正如……一样
  rationale: 明确呈现巴比伦将受的惩罚与亚述先前所受惩罚之间的对应关系。
- source_word: מֶלֶךְ אַשּׁוּר
  choice: 亚述王
  rationale: 直接翻译原文称谓，保持与“巴比伦王”的平行结构。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；采用“雅威”作为较贴近学界通常复原读音的音译，保留其作为专名的性质，而不以称号替代。
- issue: 审判语境中פקד的含义
  choice: 惩罚
  alternative: 追讨／察看／临到
  rationale: 该词本身可表示察看、关注或追究，但本节把巴比伦将受的处置与亚述已经遭受的审判相比，因此正文采用明确的惩治义，同时用脚注保留原词较宽的语义范围。
- issue: הִנְנִי פֹקֵד的时间与语气
  choice: 看哪，我就要惩罚
  alternative: 看哪，我正在惩罚
  rationale: 分词结构可描写即将展开或已经临近的行动；在预告巴比伦受审判的语境中，“就要”自然表达迫近性，而不把它说成已经完成。
translation_notes:
  register: 采用庄重而易懂的现代标准普通话。“万军之雅威”保留传统先知宣告的肃穆感；破折号使“以色列的神”作为同位称号清楚可读。“看哪”保留原文的强调语气，“就要”则以自然中文表达行动迫近。
