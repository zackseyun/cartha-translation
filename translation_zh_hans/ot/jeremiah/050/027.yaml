base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/027.yaml
  text: Slay all her bulls; let them go down to the slaughter. Woe to them[a], for their day has come, the time of their punishment.
translation:
  language: zh_hans
  text: 杀尽她所有的公牛！让它们下去受宰杀！它们有祸了，因为它们的日子到了，它们受惩罚的时候也到了。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “受惩罚”也可译为“受察访”或“受追究”。原文这个词可指察访、监管或追究；这里的上下文指向惩罚性的审判。
    reason: lexical_alternative
lexical_decisions:
- source_word: חִרְבוּ
  choice: 杀尽
  rationale: 此处是复数命令式，语境紧接“屠宰”，明确表示杀戮。“杀尽”既传达暴力动作，也与宾语前的“所有”自然衔接。
- source_word: כָּל פָּרֶיהָ
  choice: 她所有的公牛
  rationale: פַּר本义为公牛或幼公牛，在这里比喻巴比伦的强者；正文保留动物意象，不直接改译为“勇士”或“贵族”。“她”承接巴比伦这一阴性指称。
- source_word: יֵרְדוּ לַטָּבַח
  choice: 让它们下到屠宰之地
  rationale: 将未完成式理解为承接命令的祈使意味，译作“让……下到”。טֶבַח指屠宰或杀戮；“屠宰之地”在中文中保留目的地意象及公牛比喻。
- source_word: הוֹי עֲלֵיהֶם
  choice: 它们有祸了
  rationale: הוֹי是先知宣告哀祸的感叹语。“有祸了”庄重而自然，也保留审判宣告的语气。代词依照正文公牛意象用“它们”。
- source_word: כִּי בָא יוֹמָם
  choice: 因为它们的日子已经来到
  rationale: 完成式בָא把指定的日子表述为已经临到。“它们的日子”保留原文简洁而带审判意味的表达。
- source_word: עֵת פְּקֻדָּתָם
  choice: 它们受惩罚的时候
  rationale: פְּקֻדָּה可指察访、追究或惩罚；在巴比伦受审判的语境中，“受惩罚”最清楚自然，同时用脚注保留原词较宽的语义范围。
theological_decisions:
- issue: 审判用语 פְּקֻדָּה 的译法
  choice: 受惩罚的时候
  alternative: 被察访的时候／被追究的时候
  rationale: 上下文明确宣告对巴比伦的毁灭性审判，因此正文采用惩罚义；但该词本身也可表示察访、监管或追究，脚注保留这一词义张力，避免把原词的范围完全收窄。
- issue: “公牛”的比喻是否解释为巴比伦的强者
  choice: 正文保留“公牛”
  alternative: 勇士／权贵
  rationale: 原文使用鲜明的动物比喻，并与“屠宰”形成连贯图景。直接解释为人物类别会消除这一修辞效果，因此不在正文中替换。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以短促的命令句和哀祸句保留先知审判宣告的力度；保留“公牛—屠宰”的原文意象，并在惩罚用语处加脚注说明真实的词义幅度。
