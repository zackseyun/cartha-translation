  text: בּ֤וֹשָׁה אִמְּ/כֶם֙ מְאֹ֔ד חָפְרָ֖ה יֽוֹלַדְתְּ/כֶ֑ם הִנֵּה֙ אַחֲרִ֣ית גּוֹיִ֔ם מִדְבָּ֖ר צִיָּ֥ה וַ/עֲרָבָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/012.yaml
  text: Your mother will be utterly ashamed; she who gave birth to you will be disgraced. Behold[a], she will be the last of the nations, a wilderness, a dry land, and a desert.
translation:
  language: zh_hans
  text: 你们的母亲必大大蒙羞；那生你们的必受辱。看哪，她必成为列国中最末的一国[a]，成为旷野、干旱之地和荒漠。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“列国中最卑微的一国。”这个希伯来语说法可指巴比伦最终在列国中沦为卑微的地位。
    reason: lexical_alternative
lexical_decisions:
- source_word: בּוֹשָׁה
  choice: 必大大蒙羞
  rationale: 该词是阴性单数完成式；在先知审判宣告中可表达确定将发生的结果。译作“必……蒙羞”既传达将来意味，也保留羞耻临到她的语感。
- source_word: אִמְּכֶם
  choice: 你们的母亲
  rationale: 直译为“你们的母亲”。上下文把巴比伦人格化为其居民的母亲；正文保留原有隐喻，不直接解释为“母城”或“祖国”。
- source_word: מְאֹד
  choice: 大大
  rationale: 作为程度副词加强“蒙羞”的力度；“大大蒙羞”自然、庄重，也符合先知性语言。
- source_word: חָפְרָה
  choice: 必受辱
  rationale: 表达羞愧、受辱的意思；与前句“蒙羞”平行，同时避免把两个相近的希伯来语词完全译成同一个词。
- source_word: יֽוֹלַדְתְּכֶם
  choice: 生你们的
  rationale: 保留阴性单数分词的生育意象，并与“你们的母亲”形成诗歌平行。
- source_word: הִנֵּה
  choice: 看哪
  rationale: 用于郑重引出将临到的结局；“看哪”保留先知宣告的强调语气，且现代读者能够理解。
- source_word: אַחֲרִית גּוֹיִם
  choice: 列国中最末后的
  rationale: אַחֲרִית可指末后、结局或居后的位置。此处译为“最末后的”，保留巴比伦在列国中沦落至末位及其最终状态的含义；“最微小的”作为可能解释列入脚注。
- source_word: מִדְבָּר
  choice: 旷野
  rationale: 在审判语境中指荒凉无人之地；译作“旷野”可与后面的干旱之地和荒漠有所区分。
- source_word: צִיָּה
  choice: 干旱之地
  rationale: 该名词强调干燥、焦旱；此译清楚传达地貌特征，并不与相邻词混同。
- source_word: וַעֲרָבָה
  choice: 和荒漠
  rationale: 指干旱荒凉的平原或沙漠地带；“荒漠”在现代汉语中自然，并与“旷野”“干旱之地”构成递进式并列。
theological_decisions:
- issue: 把巴比伦人格化为母亲和生育者
  choice: 在正文中直接保留母亲与生育的隐喻
  alternative: 在正文中解释为“母城”或“祖国”
  rationale: 原文借母亲受辱描绘巴比伦的结局。直保留这一诗性意象，避免把解释性判断写入正文。
- issue: 先知性完成式的时态力量
  choice: 用“必”表达确定的未来结果
  alternative: 译为当前或结果状态，如“已经蒙羞……已经受辱”
  rationale: 在审判神谕中，希伯来语完成式常把将来的事件表述为确定无疑。汉语用“必”能自然传达这种话语功能。
- issue: אַחֲרִית גּוֹיִם的含义
  choice: 正文译为“列国中最末后的”
  alternative: 译为“列国中最微小的”或“列国的结局”
  rationale: 该短语既可能强调排在最后，也可蕴含地位降卑。正文保留较贴近词形且具有张力的“最末后的”，并以脚注说明另一种合理理解。
translation_notes:
  register: 采用现代、庄重而易懂的普通话书面语。保留“看哪”的先知性语体以及母亲、生育的诗性平行；“旷野、干旱之地和荒漠”尽量维持原文三个荒凉地貌词的层次。
