id: JER.14.12
reference: Jeremiah 14:12
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כִּ֣י יָצֻ֗מוּ אֵינֶ֤/נִּי שֹׁמֵ֨עַ֙ אֶל רִנָּתָ֔/ם וְ/כִ֧י יַעֲל֛וּ עֹלָ֥ה וּ/מִנְחָ֖ה אֵינֶ֣/נִּי רֹצָ֑/ם כִּ֗י בַּ/חֶ֨רֶב֙ וּ/בָ/רָעָ֣ב וּ/בַ/דֶּ֔בֶר אָנֹכִ֖י מְכַלֶּ֥ה אוֹתָֽ/ם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/014/012.yaml
  text: Though they fast[a], I do not hear their cry; and though they offer up burnt offering and grain offering, I do not accept them. Rather, by the sword, by famine[d][c][b], and by pestilence I am consuming them.
translation:
  language: zh_hans
  text: 即使他们禁食，我也不听他们的呼求；即使他们献上燔祭和素祭，我也不悦纳他们。相反，我正用刀剑、饥荒和瘟疫[a]毁灭他们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “瘟疫”也可译作“疫病”。
    reason: דֶּבֶר可指造成广泛死亡的传染性灾病。
lexical_decisions:
- source_word: כִּי יָצֻמוּ
  choice: 即使他们禁食
  rationale: 此处כִּי结合上下文具有让步意味；“即使”自然表达他们虽禁食，上主仍不垂听。
- source_word: אֵינֶנִּי שֹׁמֵעַ אֶל רִנָּתָם
  choice: 我也不听他们的呼求
  rationale: “听”在这里不只是听见声音，而是垂听、回应；“呼求”符合רִנָּה在哀告语境中的含义。
- source_word: עֹלָה וּמִנְחָה
  choice: 燔祭和素祭
  rationale: 采用现代中文圣经语境中通行且准确的祭祀术语；מִנְחָה在此祭祀语境中指谷物祭，即“素祭”。
- source_word: אֵינֶנִּי רֹצָם
  choice: 我也不悦纳
  rationale: רצה在献祭语境中表示带着认可而接受；“悦纳”既保留接纳与喜悦的语义，也不强行限定代词只指祭物或献祭者。
- source_word: כִּי
  choice: 相反
  rationale: 末句与前面禁食献祭形成鲜明转折，并说明上主实际要施行的审判。
- source_word: בַּחֶרֶב וּבָרָעָב וּבַדֶּבֶר
  choice: 用刀剑、饥荒和瘟疫
  rationale: 保留先知书中常见的三重审判表达；介词ב在此表示施行审判的手段。
- source_word: אָנֹכִי מְכַלֶּה אוֹתָם
  choice: 我要……把他们灭尽
  rationale: Piel分词表达正在施行或确定要施行的彻底毁灭；中文用“我要……灭尽”自然体现迫近而确定的审判。
theological_decisions:
- issue: 审判期间上主拒绝禁食与献祭
  choice: 译文同时明确拒绝百姓的呼求与祭献，并以刀剑、饥荒、瘟疫的审判形成对照。
  alternative: 把拒绝仅理解为不听祷告，或弱化末句的主动审判。
  rationale: 原文两个平行让步句分别涉及禁食呼求和献祭，末句则明确陈述上主将施行毁灭。
- issue: רֹצָם中“他们”的所指
  choice: 采用不带显性宾语的“悦纳”，保留其可能指祭物、也可能连及献祭者的语义张力。
  alternative: 明确译为“我不接受这些祭物”或“我不喜悦他们”。
  rationale: 原文阳性复数后缀在紧邻语境中可关联祭物，但也可能指向百姓；中文省略宾语可忠实保留这一歧义。
- issue: 上主毁灭行动的时态体貌
  choice: 译为“我要……灭尽”，表达确定且迫近的审判。
  alternative: 译为“我正在把他们灭尽”。
  rationale: 分词可表示进行中的行动，但在预告审判的语境中也具有确定、即将实施的力量；中文将来式更自然，同时不削弱主动性。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“燔祭”“素祭”为必要且通行的祭祀术语；句式保留两重“即使”及末尾审判三联语的节奏。
