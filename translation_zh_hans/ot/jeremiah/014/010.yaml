  text: כֹּֽה אָמַ֨ר יְהוָ֜ה לָ/עָ֣ם הַ/זֶּ֗ה כֵּ֤ן אָֽהֲבוּ֙ לָ/נ֔וּעַ רַגְלֵי/הֶ֖ם לֹ֣א חָשָׂ֑כוּ וַ/יהוָה֙ לֹ֣א רָצָ֔/ם עַתָּה֙ יִזְכֹּ֣ר עֲוֺנָ֔/ם וְ/יִפְקֹ֖ד חַטֹּאתָֽ/ם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/014/010.yaml
  text: 'Thus says Yahweh concerning this people: Thus they have loved to wander[a]; they have not restrained their feet. Therefore Yahweh does not accept them[c][b]. Now he will remember their iniquity and punish their sins.'
translation:
  language: zh_hans
  text: 耶和华论到这百姓如此说：“他们就这样喜爱游荡[a]，不收住自己的脚步。因此，耶和华不悦纳他们[b]。现在，他要记起他们的罪孽，追讨他们的罪[c]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “游荡”也可译作“飘荡”或“漂泊”；这里含有不安定、不断偏离的意味。
    reason: lexical_alternative
  - marker: b
    text: “不悦纳他们”也可译作“不喜悦他们”。
    reason: lexical_alternative
  - marker: c
    text: “追讨他们的罪”直译近于“察看（或追究）他们的罪”；在这里指因他们的罪而追究，并施行审判。
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代汉语圣经传统中通行的神名音译，保留四字神名作为专名的功能，而不以称号代替。
- source_word: לָעָם הַזֶּה
  choice: 论到这百姓
  rationale: 这里的介词引出神谕所针对、所论及的对象；“论到”符合汉语先知性宣告的庄重语体。
- source_word: כֵּן אָהֲבוּ לָנוּעַ
  choice: 他们就是这样喜爱飘荡
  rationale: “就是这样”保留כֵּן所表达的方式或状态；“喜爱飘荡”保留אָהַב加不定式所表达的偏爱，并以“飘荡”呈现נוּעַ的不安定及偏离意味，而不把隐喻过度解释为特定罪行。
- source_word: רַגְלֵיהֶם לֹא חָשָׂכוּ
  choice: 不约束自己的脚步
  rationale: 保留原文“脚”的身体意象，同时用现代汉语可懂的“约束脚步”表达行为不受节制。
- source_word: לֹא רָצָם
  choice: 不悦纳他们
  rationale: רצה在此表示有利的接纳或认可；“悦纳”兼顾接纳与喜悦的语义，且适合敬虔而不古奥的语体。
- source_word: יִזְכֹּר עֲוֺנָם
  choice: 要记起他们的罪孽
  rationale: 直译“记起”，保留司法性记念的表达，不弱化为普通回忆；“罪孽”体现עָוֹן的道德与罪责分量。
- source_word: וְיִפְקֹד חַטֹּאתָם
  choice: 追讨他们的罪
  rationale: פקד在审判语境中指察究并使人承担后果；“追讨”既保留主动审判意味，又比单纯“惩罚”更接近原文的查访、追究色彩。
theological_decisions:
- issue: 神不再悦纳百姓与随后审判之间的关系
  choice: 因此，耶和华不悦纳他们。现在，他要记起他们的罪孽，追讨他们的罪。
  alternative: 耶和华不喜悦他们；如今他要记念他们的罪孽，惩罚他们的罪。
  rationale: 译文明确保留百姓持续偏离、神拒绝悦纳及神施行审判的连续关系，却不引入关于弃绝、救恩状态或惩罚机制的额外教义判断。
- issue: “记起”是否暗示神先前遗忘
  choice: 保留“记起”的司法性隐喻
  alternative: 意译为“要追究他们的罪孽”
  rationale: 原文的“记起”在此具有将罪置于审判之下的盟约—司法功能，并非说明神认知上的遗忘；保留原有张力比在正文中解释性改写更忠实。
translation_notes:
  register: 采用现代、庄重、清楚的先知性宣告语体。保留“脚步”“记起”等希伯来文意象；以“飘荡”和“追讨”在可读性与原文隐喻、司法含义之间取得平衡。所有脚注标记均置于对应正文之后。
