id: JER.14.3
reference: Jeremiah 14:3
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/אַדִּ֣רֵי/הֶ֔ם שָׁלְח֥וּ צעורי/הם לַ/מָּ֑יִם בָּ֣אוּ עַל גֵּבִ֞ים לֹא מָ֣צְאוּ מַ֗יִם שָׁ֤בוּ כְלֵי/הֶם֙ רֵיקָ֔ם בֹּ֥שׁוּ וְ/הָכְלְמ֖וּ וְ/חָפ֥וּ רֹאשָֽׁ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/014/003.yaml
  text: Their nobles send their servants for water[a]; they come to the cisterns and find no water. They return with their containers empty; they are ashamed and humiliated[c][b], and they cover their heads.
translation:
  language: zh_hans
  text: 他们的贵族派仆人去打水[a]；仆人来到蓄水池[b]，却找不到水。他们提着空器皿回来，羞愧又受辱，蒙住了头[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “仆人”也可译作“年轻人”或“小辈”；原词可表示年幼或地位较低的人。这里贵族差派下属打水，因此正文按社会身份翻译。
    reason: lexical_alternative
  - marker: b
    text: “蓄水池”也可译作“水坑”或“池塘”。
    reason: lexical_alternative
  - marker: c
    text: 蒙头在当时可表示羞耻、哀伤或苦恼。
    reason: cultural_note
lexical_decisions:
- source_word: אַדִּירֵיהֶם
  choice: 他们的贵族
  rationale: 该词指有权势、地位显赫的人；在旱灾及上下属关系的语境中，“贵族”自然准确。
- source_word: צְעוּרֵיהֶם
  choice: 仆人
  rationale: 本义可指年幼者或卑微者；这里是贵族差派其下属取水，按社会身份译作“仆人”最符合上下文，同时以脚注保留年龄义的可能。
- source_word: לַמָּיִם
  choice: 去打水
  rationale: 与“派”连用表示差派的目的；现代汉语“去打水”比直译“到水那里”自然。
- source_word: גֵּבִים
  choice: 蓄水池
  rationale: 该复数名词指蓄积水的坑池或水槽；旱灾语境中“蓄水池”清楚且不过度限定具体构造。
- source_word: שָׁבוּ כְלֵיהֶם רֵיקָם
  choice: 他们提着空器皿回来
  rationale: 表达取水容器仍空着而返回；“器皿”保留原文未说明容器种类的宽泛性。
- source_word: בֹּשׁוּ וְהָכְלְמוּ
  choice: 羞愧又受辱
  rationale: 用两个相关而有区别的词保留希伯来文并列加强的效果，也反映第二个动词较偏向蒙羞、受辱。
- source_word: וְחָפוּ רֹאשָׁם
  choice: 蒙住了头
  rationale: 直接呈现以遮头表达羞耻、哀伤或苦恼的动作，不在正文中将其简化为单一情绪。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的普通话。为避免连续代词造成施事者含混，第二句重复“仆人”；动词时态按叙事进程自然处理。脚注标记依正文出现顺序排列。
