source:
  edition: WLC
  text: וְ/הָ/עָ֣ם אֲשֶׁר הֵ֣מָּה נִבְּאִ֣ים לָ/הֶ֡ם יִֽהְי֣וּ מֻשְׁלָכִים֩ בְּ/חֻצ֨וֹת יְרוּשָׁלִַ֜ם מִ/פְּנֵ֣י הָ/רָעָ֣ב וְ/הַ/חֶ֗רֶב וְ/אֵ֤ין מְקַבֵּר֙ לָ/הֵ֔מָּה הֵ֣מָּה נְשֵׁי/הֶ֔ם וּ/בְנֵי/הֶ֖ם וּ/בְנֹֽתֵי/הֶ֑ם וְ/שָׁפַכְתִּ֥י עֲלֵי/הֶ֖ם אֶת רָעָתָֽ/ם־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/014/016.yaml
  text: And the people to whom they are prophesying will be thrown out into the streets of Jerusalem because of the famine and the sword[a], with no one to bury them—them, their wives, their sons, and their daughters. And I will pour out on them their evil.
translation:
  language: zh_hans
  text: 那些先知向其说预言的百姓，必因饥荒和刀剑被抛在耶路撒冷街头，无人埋葬他们——他们、他们的妻子、儿子和女儿。我要把他们的恶[a]倾倒在他们身上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “恶”也可译作“邪恶”，或“临到他们的灾祸”“他们的灾难”。这个希伯来词既可指道德上的恶，也可指由此而来的灾祸。
    reason: 保留 רָעָה 在道德上的恶与临到人的灾祸之间的语义歧义。
lexical_decisions:
- source_word: נִבְּאִים לָהֶם
  choice: 那些先知向他们说预言
  rationale: 原文为分词形式，指先知持续向这些百姓发出预言；汉语用“向他们说预言”自然表达其指向性。补出“那些先知”，承接上下文并避免把被动形态误译为百姓自己说预言。
- source_word: מֻשְׁלָכִים בְּחֻצוֹת יְרוּשָׁלִַם
  choice: 被抛在耶路撒冷街头
  rationale: Hophal分词表达被抛弃、弃置的状态；“被抛在……街头”既保留动作，也传达尸首暴露街头的羞辱与无人收殓。介词短语在此自然理解为所在或结果位置。
- source_word: מִפְּנֵי הָרָעָב וְהַחֶרֶב
  choice: 因饥荒和刀剑
  rationale: מִפְּנֵי在此表示原因。“刀剑”保留希伯来文具体的审判意象，不泛化为“战争”。
- source_word: וְאֵין מְקַבֵּר לָהֵמָּה
  choice: 无人埋葬
  rationale: אין加分词表示没有任何埋葬者；简洁的汉语表达完整保留此意。
- source_word: הֵמָּה נְשֵׁיהֶם וּבְנֵיהֶם וּבְנֹתֵיהֶם
  choice: 他们和他们的妻子、儿子、女儿都是如此
  rationale: הֵמָּה具有复指和强调作用，后列全家成员；“都是如此”明确无人埋葬这一命运涵盖他们全家。
- source_word: וְשָׁפַכְתִּי עֲלֵיהֶם
  choice: 我要把……倾倒在他们身上
  rationale: 保留שׁפך的“倾倒”隐喻及其审判语势。
- source_word: אֶת רָעָתָם
  choice: 他们的恶
  rationale: רָעָה既可指道德上的恶，也可指临到人的灾祸；正文采用贴近词形且保留张力的“他们的恶”，脚注说明其他可能含义。
theological_decisions:
- issue: 审判语句中רָעָתָם的含义
  choice: 他们的恶
  alternative: 他们的邪恶；他们应得的灾祸；他们的灾难
  rationale: 原文可能指他们所行的恶被归还到自己身上，也可能指因此临到他们的灾祸。正文不替原文消除这种因果与语义张力，脚注列出两类理解。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“被抛在……街头”比文言色彩较重的“被弃于”自然；“刀剑”和“倾倒”则保留原文鲜明的审判意象。
