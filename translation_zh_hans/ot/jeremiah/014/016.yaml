  - severity: low
    issue: “他们和他们的妻子、儿子、女儿都是如此”对复指结构的呈现稍显松散。
    rationale: 原文在“无人埋葬他们”后以“他们、他们的妻子、儿子和女儿”作强调性复指/同位说明。直接重复“他们”并列家属，更贴近原文的修辞和指涉。
