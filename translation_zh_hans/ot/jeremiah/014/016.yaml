revisions:
- from: 那些先知向他们说预言，听的人必因饥荒和刀剑被抛在耶路撒冷街头，无人埋葬——他们和他们的妻子、儿子、女儿都是如此。我要把他们的恶[a]倾倒在他们身上。
  to: 那些先知向其说预言的百姓，必因饥荒和刀剑被抛在耶路撒冷街头，无人埋葬他们——他们、他们的妻子、儿子和女儿。我要把他们的恶[a]倾倒在他们身上。
  rationale: 修订仅恢复原文中“百姓”与“向其说预言”的限定关系，并更直接呈现无人埋葬者涵盖百姓及其妻子、儿子、女儿的复指结构。保留“他们的恶”及脚注，以免预先裁定 רָעָתָם 指人的恶行、其应受的报应，还是临到他们的灾祸。
  reviewer_model: gpt-5.6-terra
