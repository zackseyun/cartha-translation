id: JER.14.9
reference: Jeremiah 14:9
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: לָ֤/מָּה תִֽהְיֶה֙ כְּ/אִ֣ישׁ נִדְהָ֔ם כְּ/גִבּ֖וֹר לֹא יוּכַ֣ל לְ/הוֹשִׁ֑יעַ וְ/אַתָּ֧ה בְ/קִרְבֵּ֣/נוּ יְהוָ֗ה וְ/שִׁמְ/ךָ֛ עָלֵ֥י/נוּ נִקְרָ֖א אַל תַּנִּחֵֽ/נוּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/014/009.yaml
  text: Why should you be like a stunned man[a], like a warrior who cannot save? Yet you are in our midst, O Yahweh, and your name is called over us; do not forsake us.
translation:
  language: zh_hans
  text: '你为何像个惊呆的人，

    像个不能施救的勇士？


    然而，耶和华啊，你在我们中间；

    我们是称为你名下的人[a]。

    求你不要撇下我们！'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“你的名被称在我们身上”。这是表示归属和以其名为标记的希伯来习语。
    reason: 以自然的现代汉语表达原文习语，同时保留其字面意象及开放的归属含义。
lexical_decisions:
- source_word: לָמָּה תִהְיֶה
  choice: 你为何像
  rationale: לָמָּה引出带有申诉意味的问句，תִהְיֶה在此不是单纯陈述未来，而是质问上帝为何显得如此。现代汉语用“你为何像”即可自然表达这种语气，无须另加“竟会”。
- source_word: כְּאִישׁ נִדְהָם
  choice: 像个惊呆的人
  rationale: נִדְהָם是Niphal分词，表示因震惊而茫然、失去反应；“惊呆”既保留震愕之意，也与下句“不能施救”形成无能为力的平行。אִישׁ在这里指一个男子或人，汉语自然译作“人”。
- source_word: כְּגִבּוֹר לֹא יוּכַל לְהוֹשִׁיעַ
  choice: 像个不能施救的勇士
  rationale: גִּבּוֹר在语境中是有能力争战、救援的勇士；יכול加不定式表达不能，הושיע表示拯救或搭救。“施救”简洁保留救援图景。
- source_word: וְאַתָּה בְקִרְבֵּנוּ
  choice: 然而，……你在我们中间
  rationale: וְ在这里承接前面的反问并形成转折；בְקִרְבֵּנוּ直指上帝临在于群体中间，故译作“然而……你在我们中间”。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 这是希伯来文本中的上帝专名四字神名。采用现代中文圣经读者熟悉的专名音译“耶和华”，而不以称号“主”取代。呼格语气以“啊”表达。
- source_word: וְשִׁמְךָ עָלֵינוּ נִקְרָא
  choice: 你的名被称在我们身上
  rationale: 尽量保留希伯来语“名被称在……之上”的具体表达及其归属含义；较顺畅的惯用解释放入脚注，以免正文默默消解原文意象。
- source_word: אַל תַּנִּחֵנוּ
  choice: 求你不要撇下我们
  rationale: אַל加未完成式构成否定祈求；此处的נוח使役式有任其留下、弃置不顾之意。“撇下”符合祷告语境，“求你”明确汉语中的恳求口吻。
theological_decisions:
- issue: 四字神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威；主
  rationale: 原文直接使用上帝的专名，不宜以头衔“主”代替。中文采用广为人知的专名形式“耶和华”，保持这是名字而非称号。
- issue: “你的名被称在我们身上”的盟约归属表达
  choice: 正文保留原文意象
  alternative: 我们是称为你名下的人；我们被称为属你名的人
  rationale: 这一希伯来习语可以表示归属、认同和上帝的权利。正文直译以保留其开放而丰富的含义，脚注给出自然汉语释义，不把它限定成单一神学解释。
- issue: 把上帝比作惊呆者和无力施救的勇士
  choice: 保留祈祷中的大胆反问
  alternative: 弱化为“为何仿佛不采取行动”
  rationale: 原文刻意使用尖锐比喻，表达群体在危难中的困惑与申诉；不应为了神学上的顺滑而软化这种张力。后半句同时确认上帝在他们中间。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语言。诗行布局呈现两个比喻及随后的转折。正文保留“名被称在我们身上”的希伯来意象，以脚注帮助普通读者理解；“求你不要撇下我们”保持哀歌中恳切而不失敬意的语气。
