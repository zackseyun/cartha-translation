source:
  edition: WLC
  text: לָ/כֵ֞ן כֹּֽה אָמַ֣ר יְהוָ֗ה עַֽל הַ/נְּבִאִ֞ים הַ/נִּבְּאִ֣ים בִּ/שְׁמִ/י֮ וַ/אֲנִ֣י לֹֽא שְׁלַחְתִּי/ם֒ וְ/הֵ֨מָּה֙ אֹֽמְרִ֔ים חֶ֣רֶב וְ/רָעָ֔ב לֹ֥א יִהְיֶ֖ה בָּ/אָ֣רֶץ הַ/זֹּ֑את בַּ/חֶ֤רֶב וּ/בָֽ/רָעָב֙ יִתַּ֔מּוּ הַ/נְּבִאִ֖ים הָ/הֵֽמָּה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/014/015.yaml
  text: 'Therefore thus says Yahweh concerning the prophets who prophesy in my name though I did not send them[a], and who say, ‘Sword and famine will not be in this land’: by sword and by famine those prophets will be consumed.'
translation:
  language: zh_hans
  text: 因此，雅威论到那些奉我名说预言的先知——我没有差遣他们——如此说：“他们说，‘这地必没有刀剑和饥荒[a]。’那些先知必因刀剑和饥荒而灭亡。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “刀剑”常转指战争；这句话也可译为：“战争和饥荒必不临到这地。”希伯来文直译为：“这地必没有刀剑和饥荒。”
    reason: 说明“刀剑”的转喻意义，并提供更符合汉语习惯的另一种译法，同时交代原文的字面结构。
lexical_decisions:
- source_word: לָכֵן
  choice: 因此
  rationale: 明确承接上文并引出由此而来的审判宣告。
- source_word: כֹּה אָמַר יְהוָה
  choice: 雅威如此说
  rationale: 保留先知信息中正式的使者宣告格式，并以“雅威”音译圣名יהוה。
- source_word: עַל
  choice: 论到
  rationale: 表示宣告所针对的对象，同时不把介词本身过度限定为“攻击”。
- source_word: הַנְּבִאִים הַנִּבְּאִים
  choice: 说预言的先知
  rationale: 尽量保留希伯来文中“先知—说预言”的同根复现。
- source_word: בִּשְׁמִי
  choice: 奉我的名
  rationale: 自然表达他们声称代表雅威、受其授权而发言。
- source_word: וַאֲנִי לֹא שְׁלַחְתִּים
  choice: 我并没有差遣他们
  rationale: “并没有”凸显他们所声称的权柄与事实之间的对立。
- source_word: וְהֵמָּה אֹמְרִים
  choice: 他们却说
  rationale: 以“却”表达与未受差遣这一事实的反差，不额外加入“不断”等迭代含义。
- source_word: חֶרֶב וְרָעָב
  choice: 刀剑和饥荒
  rationale: 保留חֶרֶב的具体意象；“刀剑”在先知文学中也可转指战争。
- source_word: לֹא יִהְיֶה בָּאָרֶץ הַזֹּאת
  choice: 这地必没有
  rationale: 贴近希伯来文存在句，同时在现代汉语中简洁清楚。
- source_word: בַּחֶרֶב וּבָרָעָב
  choice: 因刀剑和饥荒
  rationale: 介词ב在此表示造成灭亡的手段或原因；汉语用“因”较为自然。
- source_word: יִתַּמּוּ
  choice: 必……灭亡
  rationale: 表达在审判中走到尽头、遭毁灭的语义，避免生硬的“被耗尽”。
- source_word: הַנְּבִאִים הָהֵמָּה
  choice: 那些先知
  rationale: 保留指示词的回指作用，明确所受审判的正是前述先知。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”对应Yahweh的现代汉语音译，而不是以“主”替代神名。
- issue: 假先知所宣称的平安与其结局之间的反转
  choice: 重复使用“刀剑和饥荒”
  alternative: 第二处概括为“这些灾祸”
  rationale: 原文刻意逐字重复两种灾祸，显示他们所否认的审判恰成为他们灭亡的方式，因此保留这种神学张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。以破折号隔开插入说明，使“雅威论到……如此说”的先知宣告框架清楚可辨；保留“说预言的先知”和两次“刀剑和饥荒”的原文呼应。
