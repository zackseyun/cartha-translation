  text: אִם יָצָ֣אתִי הַ/שָּׂדֶ֗ה וְ/הִנֵּה֙ חַלְלֵי חֶ֔רֶב וְ/אִם֙ בָּ֣אתִי הָ/עִ֔יר וְ/הִנֵּ֖ה תַּחֲלוּאֵ֣י רָעָ֑ב כִּֽי גַם נָבִ֧יא גַם כֹּהֵ֛ן סָחֲר֥וּ אֶל אֶ֖רֶץ וְ/לֹ֥א יָדָֽעוּ־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/014/018.yaml
  text: If I go out into the field[a], look—those slain by the sword! And if I enter the city[b], look—those sick with famine! For both prophet and priest wander through the land and do not know what to do.
translation:
  language: zh_hans
  text: 我若到田野去，看哪，尽是被刀剑杀死的人！我若进城，看哪，尽是因饥荒而患病的人！因为连先知和祭司也都在这地来往[a]，却不知道。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这句话也可译作“先知和祭司也都在这地往来经商，却不明白”，因为这里的希伯来语动词既可表示四处往来，也可带有经商的意思。
    reason: lexical_alternative
  - marker: b
    text: 末句的希伯来语较难理解，也可能意为“他们去了一个自己不认识的地方”，或仅作“他们却不知道”。
    reason: alternative_reading
lexical_decisions:
- source_word: אִם יָצָאתִי הַשָּׂדֶה
  choice: 我若走到田野
  rationale: אִם在此引出鲜明的假设性观察；“若”保留条件语气。שׂדה与“城”相对，译作“田野”既贴近字面，也可指城外旷野。
- source_word: וְהִנֵּה
  choice: 看哪
  rationale: 保留הִנֵּה引人注意、使眼前景象骤然呈现的作用，同时使用现代读者能够理解的庄重表达。
- source_word: חַלְלֵי חֶרֶב
  choice: 倒在刀下的人
  rationale: חָלָל指被刺杀或杀死的人；“倒在刀下”自然传达战争暴力造成的死亡，也保留具体可见的惨状。
- source_word: תַּחֲלוּאֵי רָעָב
  choice: 因饥荒而患病的人
  rationale: 该短语可指饥荒造成的疾病或患病者；上下文与“倒在刀下的人”平行，因此采用具体的人称表达。
- source_word: כִּי גַם נָבִיא גַם כֹּהֵן
  choice: 因为连先知和祭司也都
  rationale: כִּי引出对灾情的说明，两个גַם并列强调先知与祭司两类人均未能幸免；“连……也都”兼顾解释与强调。
- source_word: סָחֲרוּ אֶל אֶרֶץ
  choice: 在这地四处奔走
  rationale: סחר可表示往来、巡行，也可能带有经商含义。正文采用符合受审判后迷惘处境的移动义，但以脚注保留商业义。אֶל אֶרֶץ在这一理解下自然译为活动所在的地域。
- source_word: וְלֹא יָדָעוּ
  choice: 却不知道该怎么办
  rationale: 希伯来文直译为“却不知道”，未明说宾语。中文补出“该怎么办”，表达语境中的无措；脚注保留更简略及其他句法理解。
theological_decisions:
- issue: 先知和祭司在审判中的处境
  choice: 描写宗教领袖也在灾难中奔走无措
  alternative: 他们可能为求生而经商，或已经去到一个陌生之地
  rationale: 正文不把他们描写为提供解决之道，也不额外断定其罪责；脚注保留困难希伯来语所容许的经商和进入陌生之地等理解，以维持经文本身的张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“看哪”保留先知诗歌中骤然指示景象的力度；两个感叹句呈现城外战争与城内饥荒的对应画面。对末句不确定的句法与词义，以正文给出语境通顺的理解，并用脚注明确保留其他可能。
