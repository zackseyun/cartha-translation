id: JER.14.17
reference: Jeremiah 14:17
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/אָמַרְתָּ֤ אֲלֵי/הֶם֙ אֶת הַ/דָּבָ֣ר הַ/זֶּ֔ה תֵּרַ֨דְנָה עֵינַ֥/י דִּמְעָ֛ה לַ֥יְלָה וְ/יוֹמָ֖ם וְ/אַל תִּדְמֶ֑ינָה כִּי֩ שֶׁ֨בֶר גָּד֜וֹל נִשְׁבְּרָ֗ה בְּתוּלַת֙ בַּת עַמִּ֔/י מַכָּ֖ה נַחְלָ֥ה מְאֹֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/014/017.yaml
  text: 'And you shall say to them this word: ‘Let my eyes run down with tears night and day[a], and let them not cease, for the virgin daughter of my people is broken with a great breaking[c][b], with a very grievous wound.’'
translation:
  language: zh_hans
  text: '你要对他们说这话：


    “愿我双眼昼夜流泪，


    永不停息[a]；


    因为我百姓的处女[b]被重重击碎[c]，


    受了极其严重的创伤。”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “不停息”也可译作“不静止”或“不歇息”；这里的希伯来语动词可表示停止或安静下来。
    reason: lexical_alternative
  - marker: b
    text: “我百姓的处女”是诗性拟人说法，把百姓描绘成一位年轻女子。
    reason: cultural_note
  - marker: c
    text: 希伯来语在这里重复使用同一词根，直译近似“以巨大的破碎被破碎”，借此加强语气。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמַרְתָּ אֲלֵיהֶם אֶת־הַדָּבָר הַזֶּה
  choice: 你要对他们说这话
  rationale: 连词加完成式在先知指令中具有命令意味；“说这话”既保留 דָּבָר 的单数形式，也符合现代汉语表达。
- source_word: תֵּרַדְנָה עֵינַי דִּמְעָה
  choice: 愿我双眼……流泪
  rationale: 希伯来语以“眼睛流下泪来”的形象表达持续哀哭；“愿”传达此处意愿式语气，“双眼流泪”在汉语中自然且保留原有意象。
- source_word: לַיְלָה וְיוֹמָם
  choice: 昼夜
  rationale: 这是表示持续不断的时间并称；“昼夜”简洁、庄重，并保留原文“夜与日”的整体含义。
- source_word: וְאַל תִּדְמֶינָה
  choice: 永不停息
  rationale: דמה 在此表示停止或静止；结合流泪的语境，译为“不停息”最自然。“永”表达昼夜不止的持续性。
- source_word: שֶׁבֶר גָּדוֹל נִשְׁבְּרָה
  choice: 惨遭破碎
  rationale: 原文以同词根名词和动词加强语势，直译在现代汉语中十分生硬；“惨遭破碎”保留被动受创、破败及强烈程度，并以脚注说明原文修辞。
- source_word: בְּתוּלַת בַּת־עַמִּי
  choice: 我百姓的童贞女
  rationale: 保留原文把百姓人格化为年轻女子的诗性称呼，不直接改写为“犹大”或“锡安”，以免消除原文意象或缩窄所指。
- source_word: מַכָּה נַחְלָה מְאֹד
  choice: 伤势极其严重
  rationale: מַכָּה 可指创伤或所受的击打，נַחְלָה מְאֹד 强调其极为严重；此译自然表达结果，不把词义限定为“无法医治”。
theological_decisions:
- issue: “我百姓的童贞女”的身份与诗性意象
  choice: 保留人格化称呼“我百姓的童贞女”
  alternative: 直接译作“犹大百姓”或“锡安”
  rationale: 原文以女子形象描写百姓所受的创伤。保留这一称呼可维持先知哀歌的情感和文学张力，又不额外断定其所指仅限于某一地名。
- issue: 第一人称“我的双眼”的说话者
  choice: 保留第一人称，不在正文中指明是耶利米还是耶和华
  alternative: 解释为“耶利米的双眼”或“耶和华的双眼”
  rationale: 上下文可引发对哀哭者身份的讨论，而本节希伯来文本本身只使用第一人称。译文不应暗中消除这种张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话，以诗行呈现哀歌节奏。“惨遭破碎”避免生硬复制希伯来语同源词结构，同时借脚注保留其修辞信息；全文不加入特定宗派解释。
