id: JER.14.7
reference: Jeremiah 14:7
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: אִם עֲוֺנֵ֨י/נוּ֙ עָ֣נוּ בָ֔/נוּ יְהוָ֕ה עֲשֵׂ֖ה לְמַ֣עַן שְׁמֶ֑/ךָ כִּֽי רַבּ֥וּ מְשׁוּבֹתֵ֖י/נוּ לְ/ךָ֥ חָטָֽאנוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/014/007.yaml
  text: Though our iniquities testify against us[a], O Yahweh, act for your name’s sake; for our apostasies are many[b]; against you we have sinned.
translation:
  language: zh_hans
  text: 尽管我们的罪孽指证我们[a]，雅威啊，求你为你名的缘故行事；因为我们背道的事很多[b]，我们得罪了你。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“如果我们的罪孽指证我们。”希伯来语אִם既可表示条件“如果”，也可表示让步“尽管”；本段祷告的语境较支持让步义。
    reason: lexical_alternative
  - marker: b
    text: 或译：“我们背离的事很多。”这里的希伯来语指转离雅威、对他不忠，也可译作“退后”或“背离”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: 尽管
  rationale: אִם既可表示条件“如果”，也可在语境中表示让步“尽管”。本节是在承认罪责的同时恳求上帝行动，因此正文采用让步义，并以脚注保留条件义。
- source_word: עֲוֺנֵינוּ
  choice: 我们的罪孽
  rationale: עָוֹן包含罪行、道德败坏及罪责的意味；“罪孽”比泛称的“罪”更能保留其分量。
- source_word: עָנוּ בָנוּ
  choice: 指证我们
  rationale: ענה与介词ב连用，在此具有仿佛在审判中作证、提出不利证词的意味；“指证我们”自然地表达这种司法色彩。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语音译呈现四字神名，而不以称号替代；“雅威”对应YHWH的通行学术重构读音。
- source_word: עֲשֵׂה
  choice: 行事
  rationale: 该命令式本义宽泛，为“做、行”；“行事”保留祈求雅威采取行动的含义，而不擅自限定为某一种具体干预。
- source_word: לְמַעַן שְׁמֶךָ
  choice: 为你名的缘故
  rationale: 保留希伯来语诉诸上帝之名，即其身份、品格和声誉的表达方式；措辞庄重且易懂。
- source_word: כִּי
  choice: 因为
  rationale: 此处引出祈求背景中的认罪理由；“因为”清楚呈现其因果功能。
- source_word: רַבּוּ
  choice: 很多
  rationale: 表达这些背离行为数量众多、已经累积的状态，符合完成式在本语境中的结果意味。
- source_word: מְשׁוּבֹתֵינוּ
  choice: 我们背道的事
  rationale: 该词指转离雅威、背弃忠诚的行为或状态。“背道的事”保留其严重性，也比单用较抽象的“背道”更自然地与“很多”搭配。
- source_word: לְךָ חָטָאנוּ
  choice: 我们得罪了你
  rationale: חטא与לְ在此标明被冒犯的一方；“得罪了你”自然表达向雅威犯罪，而不把לְ机械译成“向”。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。正文采用“雅威”音译，以保留其专名性质；不以“主”这一称号替换，也不采用源自较晚元音组合传统的“耶和华”。
- issue: מְשׁוּבֹתֵינוּ所表达的背离程度
  choice: 我们背道的事
  alternative: 我们的退后；我们的背离
  rationale: 这里是群体承认多次背弃对雅威的忠诚。“背道”传达这种严肃的转离，但不把它限定为后世教义体系中的技术术语；加上“的事”则保留复数行为的意味。
- issue: אִם在祷告中的逻辑关系
  choice: 让步义“尽管”
  alternative: 条件义“如果”
  rationale: 上下文并非怀疑罪孽是否存在，而是在承认罪责的情况下仍诉诸雅威之名，因此让步义较符合祷告进程；同时以脚注保留希伯来语真实存在的条件读法。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语体。保留原文先承认罪责、再诉诸神名、最后再次认罪的张力；不将宽泛的“行事”具体化为“拯救”或“赦免”。
