  text: וָ/אֹמַ֞ר אֲהָ֣הּ אֲדֹנָ֣/י יְהוִ֗ה הִנֵּ֨ה הַ/נְּבִאִ֜ים אֹמְרִ֤ים לָ/הֶם֙ לֹֽא תִרְא֣וּ חֶ֔רֶב וְ/רָעָ֖ב לֹֽא יִהְיֶ֣ה לָ/כֶ֑ם כִּֽי שְׁל֤וֹם אֱמֶת֙ אֶתֵּ֣ן לָ/כֶ֔ם בַּ/מָּק֖וֹם הַ/זֶּֽה׀־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/014/013.yaml
  text: Then I said, “Ah, Lord GOD, look, the prophets are saying to them, ‘You will not see the sword, and famine will not come upon you, for I will give you true peace in this place.’”
translation:
  language: zh_hans
  text: 我就说：“唉，主耶和华啊！看哪，那些先知正对他们说：‘你们必看不见刀剑，也不会有饥荒临到你们；因为我要在这地方赐给你们真实的平安。’”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲהָהּ
  choice: 唉
  rationale: 保留先知哀叹、惊惧式的感叹语气，符合现代汉语庄重表达。
- source_word: אֲדֹנָי יְהוִה
  choice: 主耶和华
  rationale: 区分“主”与神名，并采用现代中文圣经读者熟悉的神名译法。
- source_word: לֹא תִרְאוּ חֶרֶב
  choice: 你们必看不见刀剑
  rationale: “看见刀剑”是遭遇战争或兵灾的表达；直译可保留原文意象，且中文可以理解。
- source_word: וְרָעָב לֹא יִהְיֶה לָכֶם
  choice: 也不会有饥荒临到你们
  rationale: 希伯来语字面为“饥荒不会给/属于你们”，译作“临到你们”自然表达灾祸不会发生在他们身上。
- source_word: שְׁלוֹם אֱמֶת
  choice: 真实的平安
  rationale: 保留名词组合的语义张力；可指真实可靠、确实持久的平安，不窄化为单一解释。
- source_word: בַּמָּקוֹם הַזֶּה
  choice: 在这地方
  rationale: 直接对应原文地点短语，保持简洁。
theological_decisions:
- issue: 假先知话语中的第一人称施予者
  choice: 保留“我要……赐给你们”
  alternative: 改成“耶和华要……赐给你们”
  rationale: 原文引语明确使用第一人称，表现这些先知冒用神的口吻作出应许；不在正文中替说话者加解释。
- issue: “真实的平安”的性质
  choice: 按原文保留为“真实的平安”
  alternative: 译为“长久的平安”或“稳妥的和平”
  rationale: 原文 אֱמֶת 可表达真实、可靠、确实；保持较开放的译法，避免提前化解其语义范围及上下文中的讽刺张力。
translation_notes:
  register: 采用现代、庄重且易懂的叙事语言。引号层级清楚，保留“看哪”“刀剑”等先知文学色彩；避免古奥句式，也不额外标明这些先知为“假先知”，让上下文自行揭示。
