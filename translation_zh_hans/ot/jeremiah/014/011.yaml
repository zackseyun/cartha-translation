  text: וַ/יֹּ֥אמֶר יְהוָ֖ה אֵלָ֑/י אַל תִּתְפַּלֵּ֛ל בְּעַד הָ/עָ֥ם הַ/זֶּ֖ה לְ/טוֹבָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/014/011.yaml
  text: Then Yahweh said to me[a], “Do not pray for the welfare of this people.”
translation:
  language: zh_hans
  text: 耶和华对我说：“不要为这百姓祷告求福。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 对我说
  rationale: 连续式叙事动词承接上文；中文无需机械加入“然后”，即可自然推进叙事。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代简体中文圣经语境中对四字神名最通行、易识别的音译，不以“主”这一称号替代专名。
- source_word: אַל תִּתְפַּלֵּל
  choice: 不要……祷告
  rationale: אַל与未完成式构成直接禁令；תפלל在此取常用义“祷告”，而介词短语已表明代求对象。
- source_word: בְּעַד הָעָם הַזֶּה
  choice: 为这百姓
  rationale: בְּעַד表示代表、为了某人；“为这百姓”既简洁自然，也保留集体单数的表达。
- source_word: לְטוֹבָה
  choice: 求他们得好处
  rationale: לְטוֹבָה表示祷告所指向的益处或福祉；用“求他们得好处”明确修饰祷告内容，同时避免把它误读成对“百姓”的定语。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威；上主
  rationale: 原文直接使用神的专名。正文保留专名，并采用普通现代中文读者最熟悉的传统音译“耶和华”；不以称号“上主”替代。
- issue: 禁止代求的范围
  choice: 不要为这百姓祷告，求他们得好处
  alternative: 不要为这百姓祷告
  rationale: 原文明确含有לְטוֹבָה，限定所禁止的是为百姓求益处的祷告；译文保留这一限定，不扩展为对所有形式祷告的绝对禁止。
translation_notes:
  register: 采用现代、庄重而清楚的普通话。“这百姓”保留先知书语境中的集体称谓；分句“求他们得好处”自然呈现לְטוֹבָה的目的意味。
