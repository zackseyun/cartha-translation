base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/014/005.yaml
  text: For even the doe in the field gives birth and abandons her young[a], because there is no grass.
translation:
  language: zh_hans
  text: 原来，就连田野里的母鹿，生下幼崽后，也把它撇下[a]，因为没有青草。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“生下后便离开”。希伯来原文没有明说“撇下”的对象；按上下文，所指是刚生的幼崽。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 原来
  rationale: 此处承接上文，进一步说明旱灾造成的惨状；“原来”自然体现解释性的篇章关系，又避免与句末表原因的כִּי重复。
- source_word: גַם
  choice: 就连……也
  rationale: 保留强调意味，指出旱灾不仅殃及人和牲畜，甚至使野生动物违背护幼常态。
- source_word: אַיֶּלֶת
  choice: 母鹿
  rationale: 准确表达阴性名词所指的雌鹿，现代汉语自然易懂。
- source_word: בַּשָּׂדֶה
  choice: 田野里的
  rationale: 保留原文具体的野外场景；“田野”比泛称“野外”更贴近שׂדה的常用意象。
- source_word: יָלְדָה
  choice: 生下幼崽
  rationale: 动词表示生产、产仔；补出“幼崽”符合汉语搭配，也为下文隐含的受事提供清楚指向。
- source_word: וְעָזוֹב
  choice: 也把它撇下
  rationale: עזב可指离开、撇下或离弃。原文没有明说宾语，汉语以代词“它”回指幼崽，在保持简洁的同时传达语境所指；脚注注明这一补足。
- source_word: כִּי לֹא הָיָה
  choice: 因为没有
  rationale: 明确给出母鹿撇下幼崽的原因；汉语不必机械体现希伯来语过去时形式，按诗歌所描绘的旱情自然表达。
- source_word: דֶּשֶׁא
  choice: 青草
  rationale: 该词指嫩草或新鲜绿色植物；“青草”比单说“草”更能保留鲜嫩草木的含义，同时简明自然。
