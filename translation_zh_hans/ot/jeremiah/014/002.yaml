base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/014/002.yaml
  text: Judah mourns[a], and her gates languish; they grow dark on the ground, and the cry of Jerusalem goes up.
translation:
  language: zh_hans
  text: 犹大哀悼；她的城门衰残，黑沉在地上[a]；耶路撒冷的哀号上达。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“发黑，低垂到地。”希伯来语动词可指变得昏暗或发黑，常见于哀悼的语境；本句也可能描写哀悼者伏在地上，但原文没有明说“坐下”或具体人物。
    reason: 保留 קָדְרוּ לָאָרֶץ 在昏暗、发黑与哀悼姿态之间的词义和意象歧义。
lexical_decisions:
- source_word: אָבְלָה
  choice: 悲哀
  rationale: 该词表示哀悼、悲伤；用“悲哀”既保留拟人化表达，也符合庄重的诗歌语体。
- source_word: יְהוּדָה
  choice: 犹大
  rationale: 采用该地名在现代中文圣经传统中的通行译名。
- source_word: שְׁעָרֶיהָ
  choice: 她的城门
  rationale: 保留“城门”的具体意象及阴性单数所属关系，不将其解释性改译为城门口的人或城市公共生活。
- source_word: אֻמְלְלוּ
  choice: 衰败
  rationale: 该被动或结果性形式表示衰弱、凋残；“衰败”可自然用于拟人化的城门，又不局限为植物枯萎。
- source_word: קָדְרוּ לָאָרֶץ
  choice: 暗沉在地
  rationale: “暗沉”反映 קדר 的昏暗、发黑及哀悼色彩；“在地”保留 לָאָרֶץ 的具体地面意象，同时不擅自补入“坐下”或“披黑衣”的主体与动作。
- source_word: צִוְחַת
  choice: 哀号
  rationale: 该名词指痛苦中的呼喊；“哀号”比一般的“呼声”更能传达灾情中的悲痛。
- source_word: יְרוּשָׁלִַם
  choice: 耶路撒冷
  rationale: 采用现代中文通行地名。
- source_word: עָלָתָה
  choice: 上达
  rationale: 保留“上升”的方向感，并以简洁庄重的中文表达呼声向上升腾。
