  text: בַּ/עֲב֤וּר הָ/אֲדָמָה֙ חַ֔תָּה כִּ֛י לֹא הָיָ֥ה גֶ֖שֶׁם בָּ/אָ֑רֶץ בֹּ֥שׁוּ אִכָּרִ֖ים חָפ֥וּ רֹאשָֽׁ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/014/004.yaml
  text: Because the ground is dismayed[a], since there has been no rain in the land, the farmers are ashamed[b]; they cover their heads.
translation:
  language: zh_hans
  text: 地面因境内没有雨而干裂[a]；农夫羞愧，蒙住了头[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“地面惊惶了”或“地面破碎了”。希伯来语动词可指破碎，也可指惊惶；在旱灾的语境中，很可能描写土地因干旱而裂开。
    reason: lexical_alternative
  - marker: b
    text: 蒙头是表示羞愧、悲伤或哀悼的文化动作。
    reason: cultural_note
lexical_decisions:
- source_word: בַּעֲבוּר
  choice: 因为
  rationale: 表达原因关系；按现代汉语语序与后面的原因说明合并处理，使句子自然清楚。
- source_word: הָאֲדָמָה
  choice: 地面
  rationale: 这里指受旱灾影响、可耕作的土地表面；“地面”比宽泛的“地土”更自然，也与干裂的景象相称。
- source_word: חַתָּה
  choice: 干裂了
  rationale: 该动词可表示破碎或惊惶；在无雨的旱灾语境中，译作“干裂”直接呈现土地裂开的状态，同时用脚注保留其拟人化的另一种理解。
- source_word: כִּי לֹא הָיָה גֶשֶׁם בָּאָרֶץ
  choice: 因为境内没有降雨
  rationale: כִּי引出解释原因；“境内”对应此处的“地/国土”，“没有降雨”准确而自然。
- source_word: בֹּשׁוּ
  choice: 羞愧
  rationale: 保留该动词“蒙羞、羞愧”的基本意义，不将其弱化为单纯失望。
- source_word: אִכָּרִים
  choice: 农夫
  rationale: 指耕种土地的人；“农夫”简洁、庄重，也符合先知诗歌语体。
- source_word: חָפוּ רֹאשָׁם
  choice: 蒙住了头
  rationale: 直译这一表示羞愧、悲伤或哀悼的文化动作，不在正文中替读者限定其唯一含义。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的普通话。正文以“干裂”呈现旱灾的具体景象，脚注保留希伯来语可能具有的拟人化意味；分号体现土地与农夫两幅彼此关联的画面。
