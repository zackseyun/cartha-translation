  text: מִקְוֵה֙ יִשְׂרָאֵ֔ל מֽוֹשִׁיע֖/וֹ בְּ/עֵ֣ת צָרָ֑ה לָ֤/מָּה תִֽהְיֶה֙ כְּ/גֵ֣ר בָּ/אָ֔רֶץ וּ/כְ/אֹרֵ֖חַ נָטָ֥ה לָ/לֽוּן׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/014/008.yaml
  text: O Hope of Israel[a], his Savior in time of distress, why should you be like a foreigner in the land[b], like a traveler who turns aside to spend the night?
translation:
  language: zh_hans
  text: 以色列的盼望啊，以色列在患难时的救主啊，你为何像这地的寄居者[a]，又像转到一旁留宿的旅客[b]呢？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “寄居者”或译“外乡人”。原词指住在当地、却不属于本地群体的人。
    reason: lexical_alternative
  - marker: b
    text: “转到一旁留宿”或译“转去投宿一夜”，强调旅客只作短暂停留。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקְוֵה יִשְׂרָאֵל
  choice: 以色列的盼望
  rationale: מִקְוֵה在这里指以色列寄托盼望的对象，并作为对上帝的直接称呼；“以色列的盼望”既自然，也保留其称号般的神学分量。
- source_word: מוֹשִׁיעוֹ בְּעֵת צָרָה
  choice: 在患难时拯救以色列的那一位
  rationale: 后缀־וֹ是第三人称阳性单数，指作为集合单数的“以色列”。中文重复“以色列”可避免“他的拯救者”所造成的指代不清，同时用“拯救……的那一位”保留分词的施事意义。
- source_word: לָמָּה תִהְיֶה
  choice: 你为何像
  rationale: 未完成式在哀诉性的反问中带有情态意味；中文“为何像”自然表达质问和困惑，而不是将其误作单纯将来时。
- source_word: כְּגֵר בָּאָרֶץ
  choice: 像寄居在这地的外乡人
  rationale: גֵר指居住于当地却不属本地群体的人。“寄居……的外乡人”兼顾暂居或外来者身份；“这地”体现定冠词所指的特定土地，并保留可能的应许之地意涵。
- source_word: וּכְאֹרֵחַ
  choice: 又像……旅客
  rationale: אֹרֵחַ指途中行旅之人；“旅客”是清楚、现代且不显古奥的对应词。
- source_word: נָטָה לָלוּן
  choice: 转去投宿一夜
  rationale: נָטָה含转向、偏离路线之意，לוּן表示留宿过夜；此译同时传达途中转去和短暂停宿的画面。
theological_decisions:
- issue: 开头名词短语是否作为对上帝的直接称呼
  choice: 译作“以色列的盼望啊，在患难时拯救以色列的那一位啊”
  alternative: 译作陈述句：“以色列的盼望、他患难时的拯救者”
  rationale: 上下文是向耶和华发出的祷告和哀诉，因此这些短语是直接呼求上帝的称谓。译文保留这一祷告语气，但不加入原文没有的特定神学称号。
- issue: 上帝为何被比作外乡人和过夜旅客
  choice: 保留原文反问及其张力，不解释为上帝实际离弃或仅仅看似离弃
  alternative: 释义为“你为何不再住在我们中间”或“你为何仿佛已经离弃我们”
  rationale: 原文以两个暂居者的比喻表达群体对上帝似乎疏远的哀诉；直译其形象可保留祷告中的神学张力，避免替说话者或上帝作出解释。
translation_notes:
  register: 采用现代、庄重而可朗读的祷告语体。两个“啊”清楚标示直接呼求；“患难时”“外乡人”“旅客”等用语为普通现代读者所熟悉。保留土地、寄居和短暂停宿的原文意象，不以解释性改写消除哀诉中的张力。
