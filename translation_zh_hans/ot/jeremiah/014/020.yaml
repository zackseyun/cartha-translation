source:
  edition: WLC
  text: יָדַ֧עְנוּ יְהוָ֛ה רִשְׁעֵ֖/נוּ עֲוֺ֣ן אֲבוֹתֵ֑י/נוּ כִּ֥י חָטָ֖אנוּ לָֽ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/014/020.yaml
  text: We acknowledge[a], O Yahweh, our wickedness, the iniquity of our fathers, for we have sinned against you.
translation:
  language: zh_hans
  text: 雅威啊，我们承认我们的邪恶和列祖[a]的罪孽，因为我们得罪了你。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “列祖”原文直译为“我们的父亲们”，在这里可泛指先辈或祖先。
    reason: 说明希伯来文的字面性别形式及其在语境中的较广指称范围。
lexical_decisions:
- source_word: יָדַעְנוּ
  choice: 我们承认
  rationale: ידע的基本义是“知道”，但在认罪祷告的语境中表示认识并承认罪责；“承认”既符合句意，也不把它强化为特定的礼仪性“告解”。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文四字神名的通行学术拟音译作“雅威”，保留其专名性质，不以“主”这一称号替代。
- source_word: רִשְׁעֵנוּ
  choice: 自己的邪恶
  rationale: רֶשַׁע表示邪恶、恶行或由此而来的罪责；“邪恶”保留抽象名词的性质，并与下文“罪孽”有所区分。
- source_word: עֲוֺן
  choice: 罪孽
  rationale: עָוֹן可指罪孽、罪责，有时也可指罪的后果；此处与“邪恶”和“得罪”并列，“罪孽”最能保留其道德分量。
- source_word: אֲבוֹתֵינוּ
  choice: 列祖
  rationale: 原文直译为“我们的父辈/父亲们”，在此指民族历代先辈；“列祖”既保留原文的男性形式和历史语感，也符合庄重祷告语体。
- source_word: כִּי
  choice: 因为
  rationale: כִּי在这里引出承认罪孽的理由或根据；“因为”在现代汉语中清楚自然。
- source_word: חָטָאנוּ
  choice: 我们得罪了
  rationale: חטא在带有指向受冒犯对象的介词ל时，可自然译为“得罪”；中文由上下文明确其含义是向神犯罪。
- source_word: לָךְ
  choice: 你
  rationale: לָךְ标明犯罪所冒犯的对象；与“得罪”搭配时，现代汉语直接用宾语“你”，不另译介词。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用以色列神的专名。译作“雅威”较接近YHWH的主流拟音，也避免用称号“主”取代专名；“耶和华”虽为中文传统译名，却反映较晚形成的混合读音。
- issue: אֲבוֹתֵינוּ的性别与范围
  choice: 列祖
  alternative: 祖先；父辈
  rationale: 希伯来文为阳性复数，字面是“我们的父亲们”，语境中可泛指历代先辈。“列祖”保留男性形式及群体历史含义，脚注说明其可能涵盖的较宽范围。
- issue: 本代与先代罪孽的并置
  choice: 保留“自己的邪恶”和“列祖的罪孽”的并列
  alternative: 将两者合并为共同或代际罪责
  rationale: 原文承认两项对象，并以“我们得罪了你”收束；译文不进一步解释当代人如何承担列祖罪孽，以保留经文本身的神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语言。“雅威啊”保留呼语；句式紧凑，维持原文由承认罪恶转向直接向神认罪的结构。
