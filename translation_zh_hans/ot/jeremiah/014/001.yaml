  text: 耶和华论到旱灾[a]的话临到耶利米。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“关于旱灾的事”，也可译“关于干旱”。希伯来文采用复数形式，可能指反复出现的旱情，也可能指干旱所引发的种种危机。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר הָיָה דְבַר יְהוָה אֶל יִרְמְיָהוּ
  choice: 耶和华的话临到耶利米
  rationale: 这是先知书常见的标题句式。用“临到”表达 הָיָה…אֶל 的惯用意义，同时保留 דְבַר 的“话”，措辞自然而庄重。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代简体中文读者熟悉的专名“耶和华”对应四字神名，避免改用称号“主”。
- source_word: עַל דִּבְרֵי
  choice: 关于
  rationale: 该组合在这里引出预言信息的主题；“关于”自然传达其惯用意义，不直译为生硬的“关于……的话/事情”。
- source_word: הַבַּצָּרוֹת
  choice: 那些旱灾
  rationale: “旱灾”兼顾干旱及其造成的灾情；加入“那些”使希伯来语复数在中文中有所体现，但不武断限定为若干彼此独立的事件。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用神的专名而非称号。中文采用广为人知且庄重的专名“耶和华”，保留专名性质，不译成“主”。
- issue: הַבַּצָּרוֹת 复数所指
  choice: 那些旱灾
  alternative: 旱灾／干旱的事
  rationale: 保留复数提示，同时不判定它必然指多次截然分开的干旱；脚注说明它也可能概括持续或反复出现的旱情及相关危机。
translation_notes:
  register: 采用现代、庄重而易懂的先知书标题语体。“耶和华的话临到耶利米”延续中文圣经中清楚自然的先知公式；“那些旱灾”保留原文复数，并以脚注呈现其语义范围。
