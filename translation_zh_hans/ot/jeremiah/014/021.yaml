base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/014/021.yaml
  text: Do not spurn us for the sake of your name; do not dishonor your glorious throne[a]. Remember; do not break your covenant with us.
translation:
  language: zh_hans
  text: 求你为你名的缘故，不要厌弃我们；不要羞辱你荣耀的宝座[a]。求你记念，不要破坏你与我们所立的约。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或直译：“你荣耀的宝座。”
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּנְאַץ
  choice: 厌弃我们
  rationale: נאץ在此表达带有轻蔑意味的拒绝；“厌弃”比普通的“拒绝”语气更强，也符合现代汉语祷告语体。原文未明说宾语，但上下文及末句“与我们”表明所指为“我们”，故补出。
- source_word: לְמַעַן שִׁמְךָ
  choice: 为了你名的缘故
  rationale: 保留לְמַעַן的目的或缘由意味，以及“名”所承载的声誉、品格和盟约含义，不将其解释性展开。
- source_word: תְּנַבֵּל
  choice: 羞辱
  rationale: נבל的Piel形式在此指使之蒙羞、失去尊荣；“羞辱”自然地搭配“宝座”，且不像“玷污”那样过度强调礼仪性不洁。
- source_word: כִּסֵּא כְבוֹדֶךָ
  choice: 你荣耀的宝座
  rationale: 较形式地保留原文构造“你荣耀的宝座”，避免把כָּבוֹד仅处理为形容词；其可能指圣殿、锡安或天上宝座的多层含义均予保留。
- source_word: זְכֹר
  choice: 求你记念
  rationale: 直译为“记念”，并以“求你”体现向上帝发出的祈求式命令，也延续圣经盟约语汇。
- source_word: תָּפֵר
  choice: 废弃
  rationale: פרר与“约”连用可指破坏、废除或使之失效；“废弃约”既自然又保留其强度，不预设上帝已经违约。
- source_word: בְּרִיתְךָ אִתָּנוּ
  choice: 你与我们所立的约
  rationale: “你与我们的约”虽更贴近表面形式，但汉语略显生硬；补出“所立”是由“约”的关系自然蕴含的最小限度表达。
theological_decisions:
- issue: “你荣耀的宝座”的所指
  choice: 不在正文中明确所指，保留“你荣耀的宝座”
  alternative: 明确译作圣殿、锡安，或上帝天上的宝座
  rationale: 原文措辞具有多层可能性，既可使人想到圣殿或锡安，也可指上帝天上的宝座；明确其中之一会消除原文保留的神学张力。
- issue: 向上帝说“不要废弃约”的表达
  choice: 按祷告原貌保留直接恳求
  alternative: 弱化为“不要忘记你的约”或解释为求上帝不要停止施行约的福分
  rationale: 原文直接使用פרר，不应因系统神学考虑而缓和；这是一句危急处境中的盟约祈求，并不等于叙述上帝实际会违约。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“求你”只在两个祈求段落的开头使用，以显明祷告语气而避免重复累赘；分号与句号呈现原文连续而急切的呼求。
