source:
  edition: WLC
  text: וּ/פְרָאִים֙ עָמְד֣וּ עַל שְׁפָיִ֔ם שָׁאֲפ֥וּ ר֖וּחַ כַּ/תַּנִּ֑ים כָּל֥וּ עֵינֵי/הֶ֖ם כִּי אֵ֥ין עֵֽשֶׂב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/014/006.yaml
  text: And the wild donkeys stand on the bare heights[a]; they pant for air like jackals. Their eyes fail[c][b], because there is no grass.
translation:
  language: zh_hans
  text: 野驴站在光秃的高地上，像豺狼[b]一样喘着气[a]；它们的眼睛都昏暗了，因为没有青草。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“吸入风”；也可译作“喘气”或“喘息”。
    reason: lexical_alternative
  - marker: b
    text: 或译“野狗”。较古老的译本有“龙”，但在这里的荒野语境中，希伯来语最可能指豺狼一类的食腐动物。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפְרָאִים
  choice: 野驴
  rationale: פְרָאִים指野生驴类（野驴、亚洲野驴），并非家养的驴；“野驴”是现代汉语中准确自然的表达。
- source_word: עָמְדוּ
  choice: 站在
  rationale: 虽为完成式，但这里生动描写旱灾中的景象，汉语无需以形态标明时态；用“站在”自然呈现当前画面。
- source_word: עַל שְׁפָיִם
  choice: 在光秃的高地上
  rationale: שְׁפָיִם指无遮蔽、少草木的高处；“光秃的高地”同时表达地势与荒芜，且避免“邱坛”等祭祀含义。
- source_word: שָׁאֲפוּ רוּחַ
  choice: 大口吸气
  rationale: 该短语字面为“吸入风（空气）”，在旱灾中描写动物因干渴而急促、费力地呼吸；“大口吸气”既保留吸入空气的意象，也符合现代汉语。
- source_word: כַּתַּנִּים
  choice: 像豺狼一样
  rationale: 在陆地荒野的语境中，תַּנִּים最可能指豺狼一类出没于荒凉之地的动物；“豺狼”符合先知书中的常见意象。
- source_word: כָּלוּ עֵינֵיהֶם
  choice: 它们双眼昏花
  rationale: כלה与“眼睛”连用表示眼目因衰弱、疲惫而失去能力或变得昏暗；“双眼昏花”自然地表达这种身体衰竭，同时不把含义强化为完全失明。
- source_word: כִּי אֵין עֵשֶׂב
  choice: 因为没有青草
  rationale: עֵשֶׂב在此指供动物取食的草或草本植物；“青草”贴合野驴觅食及旱灾的语境。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“光秃的高地”“大口吸气”“双眼昏花”形成清晰的旱灾画面；分号保留希伯来诗句中动作与原因之间的推进。脚注标记均置于相关词语之后。
