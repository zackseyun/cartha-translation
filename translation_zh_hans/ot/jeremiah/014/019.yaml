source:
  edition: WLC
  text: הֲ/מָאֹ֨ס מָאַ֜סְתָּ אֶת יְהוּדָ֗ה אִם בְּ/צִיּוֹן֙ גָּעֲלָ֣ה נַפְשֶׁ֔/ךָ מַדּ֨וּעַ֙ הִכִּיתָ֔/נוּ וְ/אֵ֥ין לָ֖/נוּ מַרְפֵּ֑א קַוֵּ֤ה לְ/שָׁלוֹם֙ וְ/אֵ֣ין ט֔וֹב וּ/לְ/עֵ֥ת מַרְפֵּ֖א וְ/הִנֵּ֥ה בְעָתָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/014/019.yaml
  text: Have you utterly rejected Judah? Does your soul loathe Zion? Why have you struck us so that there is no healing for us? We hoped for peace[a], but there was no good, and for a time of healing, but behold[b], terror.
translation:
  language: zh_hans
  text: 你果真彻底弃绝犹大了吗？还是[b]你的心[a]厌恶锡安？你为什么击打我们，以致我们得不到医治？我们盼望平安，却没有福乐；盼望医治的时候，看哪，反有惊恐！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “你的心”直译为“你的魂”，是指内在的自我或整个人。
    reason: lexical_alternative
  - marker: b
    text: “还是”也可不译，理解为另起一个平行问句：“你的心厌恶锡安吗？”
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲ/מָאֹס מָאַסְתָּ
  choice: 你果真彻底弃绝……了吗
  rationale: 不定式绝对形与同根限定动词连用，加强“弃绝”的语气；“果真彻底”兼顾强调和疑问语气。
- source_word: אִם
  choice: 还是
  rationale: 与句首疑问词 הֲ 呼应，可构成选择式的连续问句；这样保留两个问题之间可能存在的“或／还是”关系。
- source_word: גָּעֲלָה נַפְשֶׁךָ
  choice: 你的心厌恶
  rationale: געל 表达强烈的嫌恶；נפש 在此指内在自我或整个人。“你的心”是现代汉语中自然且仍具形象性的表达，脚注说明其字面形式。
- source_word: הִכִּיתָנוּ
  choice: 击打我们
  rationale: 保留 נכה 的具体动作意象，也与下文“医治”形成伤害与痊愈的对应。
- source_word: מַרְפֵּא
  choice: 医治
  rationale: 两处统一译为“医治”，保留由受击打到得医治的比喻链条。
- source_word: קַוֵּה לְשָׁלוֹם
  choice: 我们盼望平安
  rationale: 该短语在此表达期待；שׁלום 可涵盖安宁、健全与福祉，“平安”简洁并保留其宽广含义。
- source_word: וְאֵין טוֹב
  choice: 却没有福乐
  rationale: טוב 含义宽泛。“福乐”比单说“好”更符合汉语诗性哀歌，同时不限定为物质繁荣。
- source_word: וְהִנֵּה בְעָתָה
  choice: 看哪，反有惊恐
  rationale: “看哪”保留 הִנֵּה 的突显作用；“反有”自然呈现所盼医治与实际惊恐之间的强烈反差。
theological_decisions:
- issue: 上帝是否弃绝犹大并厌恶锡安
  choice: 保留向上帝发出的尖锐直接问句
  alternative: 解释为暂时管教或暂时离弃
  rationale: 原文让哀诉者直接质问上帝，并未在本节中化解圣约审判所带来的张力；译文不加入“暂时”等解释。
- issue: הֲ……אִם 两问之间的关系
  choice: 译作“……吗？还是……”
  alternative: 译成两个彼此并列、没有“还是”的独立问句
  rationale: 该结构可作选择式疑问；正文呈现这种句法联系，同时脚注承认也可理解为第二个平行问句。
translation_notes:
  register: 采用现代、庄重而易懂的哀歌语体。“击打—医治”保持原文意象呼应；“看哪”略具经文语感，用来保留突转和强调。所有脚注标记均置于正文；关于 אִם 的脚注置于全节末，以免打断开头连续问句。
