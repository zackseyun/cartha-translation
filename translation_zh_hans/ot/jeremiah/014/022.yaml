source:
  edition: WLC
  text: הֲ/יֵ֨שׁ בְּ/הַבְלֵ֤י הַ/גּוֹיִם֙ מַגְשִׁמִ֔ים וְ/אִם הַ/שָּׁמַ֖יִם יִתְּנ֣וּ רְבִבִ֑ים הֲ/לֹ֨א אַתָּה ה֜וּא יְהוָ֤ה אֱלֹהֵ֨י/נוּ֙ וּ֨/נְקַוֶּה לָּ֔/ךְ כִּֽי אַתָּ֥ה עָשִׂ֖יתָ אֶת כָּל אֵֽלֶּה־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/014/022.yaml
  text: Are there any among the idols of the nations that bring rain? Or can the heavens give showers? Is it not you[a], O Yahweh our God? And we wait for you[c][b], for you have made all these things.
translation:
  language: zh_hans
  text: 列国的偶像[a]中，有能降雨的吗？诸天能降下雨水吗？雅威——我们的上帝，不正是你吗？我们等候你[b]，因为这一切都是你所造的[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “偶像”直译为“列国的虚妄之物”，也就是列国所敬奉的虚假神明或偶像。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“我们仰望你”或“我们寄望于你”。原文动词表示带着盼望的等候。
    reason: lexical_alternative
  - marker: c
    text: 也可译作“这一切都是你所行的”。原文动词可指“作、造”或“行”。
    reason: alternative_reading
lexical_decisions:
- source_word: הַבְלֵי הַגּוֹיִם
  choice: 列国的偶像
  rationale: הֶבֶל本义为气息、虚空，由此可指虚妄无用之物；在这里与雅威形成对照，并被问及能否降雨，所指是列国所敬奉的偶像。正文明确所指，脚注保留其字面意象。
- source_word: מַגְשִׁמִים
  choice: 能降雨
  rationale: 该使役形式表示使雨降下；“能降雨”自然地表达能力与因果含义，也配合反问语气。
- source_word: הַשָּׁמַיִם
  choice: 诸天
  rationale: 保留希伯来语复数形式和诗性、庄重语域；此处实际指天空。
- source_word: יִתְּנוּ רְבִבִים
  choice: 能赐下甘霖
  rationale: 直译为“给出阵雨”。在旱灾祈求的语境中，“赐下甘霖”自然而庄重，并保留“给”的拟人表达。
- source_word: הֲלֹא אַתָּה הוּא
  choice: 不正是你吗
  rationale: 以强调性的反问明确雅威才是降雨者，保留原文“你就是那一位”的聚焦作用。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见音译呈现四字神名，不以称号代替专名。
- source_word: וּנְקַוֶּה לָּךְ
  choice: 我们等候你
  rationale: קוה兼有等候、盼望和怀着期待仰望之意；正文采用贴近动词形象的“等候”，脚注说明其中的盼望意味。
- source_word: עָשִׂיתָ אֶת כָּל אֵלֶּה
  choice: 这一切都是你所成就的
  rationale: עשה可表示“做、行、造”。“成就”在现代汉语中可涵盖使这些事发生的意思，同时避免正文过早排除“造”或“行”的可能，脚注列明替代译法。
theological_decisions:
- issue: 四字神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用神的专名；正文采用较贴近学界通行重构读音Yahweh的汉语音译“雅威”，而不以“主”等称号替换。
- issue: 降雨者的排他性反问
  choice: “不正是你吗”保留强调反问
  alternative: “你不就是那一位吗”
  rationale: 原文把列国偶像和诸天都排除后，以强调结构指认真正能降雨的是雅威；译文保留这种修辞力度，不另加系统神学说明。
- issue: עשה在末句中的语义
  choice: 成就
  alternative: 创造／行
  rationale: 该动词本身可指制造或施行；上下文容许把“这一切”理解为受造现实或方才所说的降雨作为。正文不强行消除张力，脚注保留两种具体表达。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“诸天”“甘霖”保留祷告与诗性语域，但句法保持自然清晰。三个脚注标记均置于相应词句之后，并分别保留“虚妄之物”、带盼望的等候，以及עשה“造／行”的真实语义幅度。
