source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֵלַ֗/י שֶׁ֚קֶר הַ/נְּבִאִים֙ נִבְּאִ֣ים בִּ/שְׁמִ֔/י לֹ֤א שְׁלַחְתִּי/ם֙ וְ/לֹ֣א צִוִּיתִ֔י/ם וְ/לֹ֥א דִבַּ֖רְתִּי אֲלֵי/הֶ֑ם חֲז֨וֹן שֶׁ֜קֶר וְ/קֶ֤סֶם ו/אלול ו/תרמות לִבָּ֔/ם הֵ֖מָּה מִֽתְנַבְּאִ֥ים לָ/כֶֽם׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/014/014.yaml
  text: And Yahweh said to me[a], “The prophets are prophesying lies in my name. I did not send them, nor did I command them, nor did I speak to them. They are prophesying to you a false vision, divination, emptiness, and the deceit of their own heart.”
translation:
  language: zh_hans
  text: 耶和华对我说：“那些先知正奉我的名说假预言。我没有差遣他们，也没有吩咐他们，更没有对他们说过话。他们向你们预言的，不过是假异象、占卜、虚无[a]和自己心里的诡诈。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “虚无”或译“毫无价值之物”或“偶像”；这个希伯来词在其他语境中可有这些含义。
    reason: 保留אֱלִיל的词义范围及本处可能存在的理解差异。
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者最熟悉的专名形式，明确对应希伯来文四字神名，而不以“主”替代。
- source_word: שֶׁקֶר / חֲזוֹן שֶׁקֶר
  choice: 假预言／假异象
  rationale: שֶׁקֶר表示虚假、欺骗；首句按中文习惯译为“说假预言”，与חֲזוֹן连用时译为“假异象”，保持同一语义范围。
- source_word: הַנְּבִאִים נִבְּאִים
  choice: 那些先知正……说假预言
  rationale: 保留名词与同根动词的呼应，并以“正”表达分词所呈现的持续行为。
- source_word: בִּשְׁמִי
  choice: 奉我的名
  rationale: 这是自然且庄重的现代中文表达，保留他们冒称具有上帝授权的含义。
- source_word: לֹא שְׁלַחְתִּים וְלֹא צִוִּיתִים וְלֹא דִבַּרְתִּי אֲלֵיהֶם
  choice: 我没有差遣他们，也没有吩咐他们，更没有对他们说过话
  rationale: 保持“差遣—吩咐—说话”三重否定及其递进力量，不把三个动作合并解释。
- source_word: קֶסֶם
  choice: 占卜
  rationale: 准确表达以禁忌术法求问隐秘之事的含义，也是普通中文读者易懂的对应词。
- source_word: אֱלִיל
  choice: 虚无
  rationale: 在本节的虚假信息清单中，译作“虚无”较为贴切；该词也可表示“毫无价值之物”或“偶像”，故以脚注保留歧义。
- source_word: תַּרְמוּת לִבָּם
  choice: 自己心里的诡诈
  rationale: 既保留欺骗、虚妄之意，也明确这些信息出自他们自己的内心，而非耶和华的启示。
- source_word: הֵמָּה מִתְנַבְּאִים לָכֶם
  choice: 他们向你们预言的，不过是……
  rationale: 保留复数受众“你们”和强调性代词，并按自然中文调整清单位置；“不过是”突出其内容并非来自上帝。
theological_decisions:
- issue: 假先知信息的性质与来源
  choice: 译文同时否定其神圣授权，并将其信息描述为假异象、占卜、虚无和内心的诡诈。
  alternative: 可把清单理解为四类彼此有别的虚假启示，也可理解为一连串意义相近的谴责语。
  rationale: 不把各项强行建构成技术性的分类；保留经文本身的并列及张力，突出这些预言并非出于耶和华。
translation_notes:
  register: 采用自然、庄重、易懂的现代标准汉语。“奉我的名”保留先知声称神圣授权的语气；“也……更……”呈现三重否定的力度。脚注标记紧随其实际所注释的“虚无”，避免误附于句首。
