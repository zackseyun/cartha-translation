id: JER.20.17
reference: Jeremiah 20:17
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: אֲשֶׁ֥ר לֹא מוֹתְתַ֖/נִי מֵ/רָ֑חֶם וַ/תְּהִי לִ֤/י אִמִּ/י֙ קִבְרִ֔/י וְ/רַחְמָ֖/הֿ הֲרַ֥ת עוֹלָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/020/017.yaml
  text: because he did not kill me from the womb[a], so that my mother would have been my grave[c][b], and her womb forever pregnant.
translation:
  language: zh_hans
  text: 因为他没有使我胎死腹中[a]，好让我的母亲成为我的坟墓[b]，她的子宫永远怀着孕[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译近于“没有从母腹杀死我”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文为“我的母亲，我的坟墓”，是压缩的比喻：若我死在母腹中，母亲便会成为我的坟墓。
    reason: cultural_note
  - marker: c
    text: 也可译作“永远怀孕”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר
  choice: 因为
  rationale: 结合14—18节的咒诅与哀叹，这个关系词在此引出咒诅那报信者的原因；译作“因为”比生硬的“那……的人”更清楚地表达篇章关系。
- source_word: מוֹתְתַנִי
  choice: 使我……死
  rationale: 该词具有使役、及物的力量，主语仍是报信的人；“使我胎死”既保留其主动致死之意，也符合现代汉语表达。
- source_word: מֵרָחֶם
  choice: 胎死腹中
  rationale: 希伯来文直译近于“从母腹杀死我”，在本节非现实的愿望语境中，实际所指是在出生前死于母腹；正文采用自然汉语，脚注保留原文介词意象。
- source_word: וַתְּהִי לִי
  choice: 好让……成为我的
  rationale: 在上下文未实现的愿望与怨诉中，此处表达设想中的结果；“好让”传达这种反事实结果，同时没有把它改写成已经发生的事实。
- source_word: אִמִּי קִבְרִי
  choice: 我的母亲成为我的坟墓
  rationale: 保留原文将“我的母亲”和“我的坟墓”直接并置的强烈压缩比喻，不在正文中擅自改成“母腹”。
- source_word: וְרַחְמָהּ
  choice: 她的子宫
  rationale: 此处与怀孕和出生相连，明确指母体器官；“子宫”准确而且为现代普通读者所熟悉。
- source_word: הֲרַת עוֹלָם
  choice: 永远怀着孕
  rationale: 表达一种无止境的怀孕状态，保留哀歌中令人不安的夸张意象。
theological_decisions:
- issue: 反事实哀叹的句法
  choice: 将后半句译为设想中的结果：“好让我的母亲成为我的坟墓”。
  alternative: 按表层时态译作“我的母亲就成了我的坟墓”。
  rationale: 上下文是耶利米咒诅自己的生日和报信者；事情事实上并未发生，因此现代汉语宜显明这是未实现的死亡愿望，但不进一步解释其神学意义。
- issue: “母亲—坟墓”意象
  choice: 保留“我的母亲成为我的坟墓”的直接比喻。
  alternative: 解释性地译为“我母亲的子宫成为我的坟墓”。
  rationale: 原文刻意压缩并置“母亲”与“坟墓”；保留这种张力比在正文中补明“子宫”更忠实。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。正文保留原诗强烈的死亡愿望和“母亲—坟墓”比喻；“胎死腹中”使汉语自然，脚注则交代希伯来文“从母腹”的较直译形式。
