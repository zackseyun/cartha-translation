base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/020/002.yaml
  text: Then Pashhur struck Jeremiah the prophet and put him in the stocks that were at the upper Benjamin Gate[a], which was in the house of Yahweh.
translation:
  language: zh_hans
  text: 于是，巴施户珥打了先知耶利米，把他置于雅威殿内便雅悯上门处的枷具[a]中。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“刑架”等；מַהְפֶּכֶת所指的具体形制不能确定，可能是一种使人以痛苦姿势受拘束的刑具。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכֶּה
  choice: 打了
  rationale: נכה在此表示击打；“打了”自然简明，不武断限定为一下击打或一顿毒打。
- source_word: פַשְׁחוּר
  choice: 巴施户珥
  rationale: 采用现代中文圣经语境中易辨认的人名音译。
- source_word: יִרְמְיָהוּ הַנָּבִיא
  choice: 先知耶利米
  rationale: 保留原文明确给出的身份称谓，并按自然中文语序表达。
- source_word: וַיִּתֵּן אֹתוֹ עַל הַמַּהְפֶּכֶת
  choice: 把他锁在枷具中
  rationale: 该结构描述把耶利米置于惩罚性拘束器具之中；“锁在……中”符合现代中文表达，“枷具”则避免过度确定器具的具体形制。
- source_word: הַמַּהְפֶּכֶת
  choice: 枷具
  rationale: 该词所指器具可能使身体受到拘束、扭转或痛苦，但具体形制不确定；正文采用较宽泛的“枷具”，脚注说明其他可能。
- source_word: שַׁעַר בִּנְיָמִן הָעֶלְיוֹן
  choice: 便雅悯上门
  rationale: 将其作为门名处理，并保留הָעֶלְיוֹן“上面的、较高的”这一限定。
- source_word: בְּבֵית יְהוָה
  choice: 雅威殿内
  rationale: בֵית יְהוָה字面为“雅威的殿/家”；在此建筑与门的语境中，“雅威殿”比“雅威的家”更清楚自然。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以“雅威”音译四字神名，保留其作为专名的性质。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华／主
  rationale: 原文直接使用神的专名；译作“雅威”可保留专名性质，而不以称号替代。
- issue: הַמַּהְפֶּכֶת 的惩罚性质与具体形制
  choice: 正文译作较宽泛的“枷具”，脚注保留不确定性
  alternative: 木狗／枷锁／刑架
  rationale: 上下文明确这是拘束、惩罚人的器具，但原词不足以确定其是否相当于某一种特定的中式枷具或刑架，不应在正文中消除这一词义张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。以分号理清动作与地点关系；保留“先知”称谓和“上门”的空间限定。脚注标记[a]已置于正文对应词后。
