  yaml_path: translation/ot/jeremiah/020/015.yaml
  text: Cursed be the man who brought my father the news[a], saying[b], “A son has been born to you,” making him very glad.
translation:
  language: zh_hans
  text: 愿那给我父亲报信、说“你得了一个儿子[a]”，并使我父亲大大欢喜[b]的人受诅咒！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“一个儿子，一个男孩”。
    reason: lexical_alternative
  - marker: b
    text: 原文以同根词构成强调结构，近于“使他非常欢喜”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אָרוּר
  choice: 愿……受诅咒
  rationale: 该词在这里作表语，带有强烈的咒诅或谴责语气；用“愿……受诅咒”自然表达希伯来语的祈愿性力量。
- source_word: הָאִישׁ אֲשֶׁר בִּשַּׂר אֶת אָבִי
  choice: 那给我父亲报信的人
  rationale: 保留定指的“那人”和关系从句；בִּשַּׂר 在此指报告令人喜悦的出生消息，译作“报信”简洁自然，又不额外引入宗教性的“福音”含义。
- source_word: לֵאמֹר
  choice: 他说
  rationale: 该词引出直接引语；现代汉语用“他说”比直译为“说”更顺畅。
- source_word: יֻלַּד לְךָ
  choice: 你得了
  rationale: 希伯来语直意为“有一个……为你而生”；在父亲收到生子消息的语境中，“你得了一个儿子”是自然、清楚的现代汉语表达。
- source_word: בֵּן זָכָר
  choice: 一个儿子
  rationale: 原文近于“一个儿子，一个男孩/男性”；汉语“儿子”已经明确性别，正文避免累赘，同时以脚注保存原文的复叠表达。
- source_word: שַׂמֵּחַ שִׂמֳּחָהוּ
  choice: 使我父亲大大欢喜
  rationale: 同根词构成的强调结构加强喜乐程度；“大大欢喜”既体现强调，也符合庄重而易懂的汉语表达。代词所指为父亲，正文明确说出以避免汉语歧义。
