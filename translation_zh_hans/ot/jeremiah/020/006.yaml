base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/020/006.yaml
  text: And you[a], Pashhur, and all who live in your house will go into captivity; and you will come to Babylon, and there you will die, and there you will be buried—you and all your loved ones, to whom you prophesied falsely.
translation:
  language: zh_hans
  text: 至于你，巴施户珥，你和所有住在你家里的人都必被掳去；你必到巴比伦。你和所有爱你的人，就是你曾向他们说过虚假预言的人，都必死在那里，也必葬在那里。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“……就是你曾向他们预言谎言的人。”
    reason: בַּשָּׁקֶר可理解为“虚假地”，也可较具体地译为“谎言”；脚注保留这一词汇表达上的可能性，并保留原文修饰“所有爱你的人”的关系从句。
lexical_decisions:
- source_word: יֹשְׁבֵי בֵיתֶךָ
  choice: 所有住在你家里的人
  rationale: 该分词结构指住在其家中的人；此译自然清楚，并保留全家范围。
- source_word: תֵּלְכוּ בַּשֶּׁבִי
  choice: 都必被掳去
  rationale: שׁבי 强调成为俘虏、被掳，而不只是迁居异地；汉语“被掳去”简洁地表达这一含义。
- source_word: וּבָבֶל תָּבוֹא
  choice: 你必到巴比伦
  rationale: בוא 的基本义为“来、到、进入”；现代汉语用“到巴比伦”自然，又不必按叙述视角改为“去”。
- source_word: וְשָׁם תָּמוּת וְשָׁם תִּקָּבֵר
  choice: 在那里死，也葬在那里
  rationale: 保留“在那里”的重复，以重现原文对审判地点与确定性的强调。
- source_word: אֹהֲבֶיךָ
  choice: 所有爱你的人
  rationale: 直译为爱他的人，可涵盖亲近者、朋友和支持者；比“亲人”或“朋友”更少限定义域。
- source_word: נִבֵּאתָ לָהֶם בַּשָּׁקֶר
  choice: 你向他们说了虚假的预言
  rationale: 表达其预言为虚假，同时不额外断定其主观欺骗动机；“向他们”对应间接受词 לָהֶם。
theological_decisions:
- issue: 巴施户珥预言之罪的性质
  choice: 说了虚假的预言
  alternative: 向他们预言谎言
  rationale: 原文明确谴责预言为虚假，却未必要求译文进一步裁定说话者是否有意撒谎；正文保留这一张力，脚注列出较贴近字面的译法。
- issue: “你和所有爱你的人”与前述死亡、埋葬的关系
  choice: 补出“都必如此”，使汉语明确指向同一命运
  alternative: 以破折号直接并列“你和所有爱你的人”
  rationale: 希伯来语将该名词短语后置，语法上承接此前关于死在并葬在巴比伦的宣告；汉语补出必要的照应语，不改变所指。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留巴比伦地点短语的重复；避免较古雅的“被掳为囚”，也避免将 אֹהֲבֶיךָ 缩窄为“朋友”或“亲人”。
