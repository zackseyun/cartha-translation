  text: כִּ֣י שָׁמַ֜עְתִּי דִּבַּ֣ת רַבִּים֮ מָג֣וֹר מִ/סָּבִיב֒ הַגִּ֨ידוּ֙ וְ/נַגִּידֶ֔/נּוּ כֹּ֚ל אֱנ֣וֹשׁ שְׁלוֹמִ֔/י שֹׁמְרֵ֖י צַלְעִ֑/י אוּלַ֤י יְפֻתֶּה֙ וְ/נ֣וּכְלָה ל֔/וֹ וְ/נִקְחָ֥ה נִקְמָתֵ֖/נוּ מִמֶּֽ/נּוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/020/010.yaml
  text: 'For I have heard the whispering of many: “Terror on every side!” “Report[a], and let us report it!” All the men at peace with me are watching for my stumbling: “Perhaps he will be deceived, and we will prevail against him[b], and we will take our vengeance on him.”'
translation:
  language: zh_hans
  text: '因为我听见许多人的毁谤：


    “四面都是恐怖！”


    “告发吧[a]！我们也要告发他！”


    所有与我和睦的人都在窥伺我失足[b]：


    “也许他会受骗，我们就能胜过他，向他报仇。”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“宣告吧！我们也要宣告他。”原文动词意为“告诉、报告、宣告”；在这里的敌对语境中，也可含有告发、控诉的意味。
    reason: lexical_alternative
  - marker: b
    text: 原文可直译为“窥伺我的跛行”或“窥伺我的侧面”，可能指等候我显出弱点、失误或跌倒。
    reason: lexical_alternative
lexical_decisions:
- source_word: דִּבַּת רַבִּים
  choice: 许多人的毁谤
  rationale: דִּבָּה可指传言、恶意议论或毁谤；上下文是敌意监视与谋害，因此译作“毁谤”，既表达恶意，又不把它限定为正式控告。
- source_word: מָגוֹר מִסָּבִיב
  choice: 四面都是恐怖
  rationale: 保留耶利米书中反复出现的“四面”意象及被恐怖包围的语气，并采用自然、凝重的现代汉语。
- source_word: הַגִּידוּ וְנַגִּידֶנּוּ
  choice: 告发吧！我们也来告发他
  rationale: נגד的使役形基本义是告诉、宣告、报告；在敌对密谋的语境中，“告发”能自然传达借报告进行控诉的意味。首个命令未明说宾语，译文也不补出宾语；后句保留第三人称单数宾语“他”。
- source_word: כֹּל אֱנוֹשׁ שְׁלוֹמִי
  choice: 所有与我和睦的人
  rationale: 直译近于“所有与我有和平的人”，指与说话者相安或友好的人；此译法保留关系上的和平含义，不直接把他们定性为亲密朋友。
- source_word: שֹׁמְרֵי צַלְעִי
  choice: 都在窥伺我失足
  rationale: שׁמר表示留意、守候，צלע可指肋旁、侧面，也可能涉及跛行或弱点；“窥伺我失足”传达敌意观察、等待破绽的惯用含义，同时以脚注保留原文具体意象的不确定性。
- source_word: יְפֻתֶּה
  choice: 他会受骗
  rationale: פתה的被动式可表示受诱惑、受哄骗或被引入歧途；“受骗”符合敌人设局的语境，又不额外指定诱骗的方式。
- source_word: וְנוּכְלָה לוֹ
  choice: 我们就能胜过他
  rationale: יכל与介词ל连用，在敌对语境中表示有能力胜过或制服某人；“胜过他”贴近原义且不过度强化为暴力制服。
- source_word: וְנִקְחָה נִקְמָתֵנוּ מִמֶּנּוּ
  choice: 向他报仇
  rationale: 原文直译为“从他那里取得我们的报仇”；“向他报仇”是自然汉语，并保留报复性的强烈语气。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙述语言。以分行引语呈现敌人的呼喊与密谋，保留说话者转换所带来的张力；不把“与我和睦的人”进一步解释为亲密朋友，也不消除“侧面／跛行／失足”这一意象的词义张力。
