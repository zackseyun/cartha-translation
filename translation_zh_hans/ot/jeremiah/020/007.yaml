source:
  edition: WLC
  text: פִּתִּיתַ֤/נִי יְהוָה֙ וָֽ/אֶפָּ֔ת חֲזַקְתַּ֖/נִי וַ/תּוּכָ֑ל הָיִ֤יתִי לִ/שְׂחוֹק֙ כָּל הַ/יּ֔וֹם כֻּלֹּ֖/ה לֹעֵ֥ג לִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/020/007.yaml
  text: You persuaded me[a], Yahweh, and I was persuaded; you overpowered me and prevailed. I have become a laughingstock all day long; everyone mocks me.
translation:
  language: zh_hans
  text: 耶和华啊，你劝服了我[a]，我也被你劝服；你制伏了我，并且得胜。我终日成了笑柄，人人都嘲笑我。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“耶和华啊，你欺骗了我，我也受骗了。”希伯来语动词可表示“引诱、劝服”或“欺骗”；耶利米在哀诉中用语十分强烈。
    reason: alternative_reading
lexical_decisions:
- source_word: פִּתִּיתַנִי
  choice: 你劝服了我
  rationale: פתה在此可表示引诱、劝服或欺骗。正文采用“劝服”，既保留使先知屈从的语气，又不在正文中独断地将其限定为欺骗；更尖锐的可能含义收入脚注。
- source_word: וָאֶפָּת
  choice: 我也被你劝服
  rationale: 以被动表达与前句形成清楚的对应，呈现耶利米被劝动、屈从的意思，同时保留可理解为“受骗”的语义空间。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代简体中文圣经语域中对四字神名最通行、最易辨识的专名译法，而非以“主”这一称号替代。
- source_word: חֲזַקְתַּנִי
  choice: 你制伏了我
  rationale: 此处חזק表示向耶利米施加强力并胜过他；“制伏”自然地传达力量压倒与个人受制的语气。
- source_word: וַתּוּכָל
  choice: 并且得胜
  rationale: יכל在这里表示成功胜过对方；“得胜”与“制伏”相承，保持简洁而庄重。
- source_word: הָיִיתִי לִשְׂחוֹק
  choice: 我……成了笑柄
  rationale: 该短语指成为众人取笑的对象；“成了笑柄”是自然、准确的现代汉语表达。
- source_word: כָּל־הַיּוֹם כֻּלֹּה
  choice: 终日
  rationale: 希伯来语重复性表达加强持续时间；“终日”凝练地传达整日不断之意。
- source_word: לֹעֵג לִי
  choice: 人人都嘲笑我
  rationale: 单数分词在此具有逐一、概括性的作用；“人人都”自然呈现普遍受嘲弄的意思。
theological_decisions:
- issue: 是否在正文中把פתה译为对上帝“欺骗”的直接指控
  choice: 正文译作“劝服”，脚注保留“欺骗”的读法
  alternative: “耶和华啊，你欺骗了我，我也受了欺骗。”
  rationale: 本节是语气强烈的哀诉，פתה的语义范围确实包括“引诱、劝服、欺骗”。正文采用较宽的“劝服”，脚注则明确保留尖锐的“欺骗”，使经文的神学张力不被抹平，也不把有歧义的原文强行限定为单一解释。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“劝服—被劝服”保留原文的重复对应；“制伏—得胜”呈现力量上的压倒。“终日成了笑柄，人人都嘲笑我”力求简洁并保持公开受辱的强烈情绪。
