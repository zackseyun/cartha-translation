base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/020/014.yaml
  text: Cursed be the day on which I was born[a]; the day my mother bore me[b], let it not be blessed.
translation:
  language: zh_hans
  text: 愿我出生的那日受诅咒；我母亲生我的那日，不要蒙福。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָרוּר
  choice: 愿……受诅咒
  rationale: 该词是ארר的被动分词，在此作述语并带有咒诅、愿望的语气；这样译既保留其强烈力度，也符合现代汉语表达。
- source_word: הַיּוֹם אֲשֶׁר יֻלַּדְתִּי בּוֹ
  choice: 我出生的那日
  rationale: 关系结构直指说话者出生之日；汉语无需逐字重现בּוֹ，译为“我出生的那日”自然且完整。
- source_word: יוֹם אֲשֶׁר יְלָדַתְנִי אִּמִי
  choice: 我母亲生我的那日
  rationale: 主动式明确以母亲为施事；“生我”简洁、具体，并与前句“我出生”形成对应。
- source_word: אַל יְהִי
  choice: 不要
  rationale: 否定祈愿式表达说话者的愿望；“不要蒙福”在现代汉语中自然保留其意愿语气。
- source_word: בָרוּךְ
  choice: 蒙福
  rationale: 与前句“受诅咒”构成清楚的反义对应，也保留祝福概念的神学与修辞内涵。
