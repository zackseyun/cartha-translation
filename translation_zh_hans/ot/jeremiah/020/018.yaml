source:
  edition: WLC
  text: לָ֤/מָּה זֶּה֙ מֵ/רֶ֣חֶם יָצָ֔אתִי לִ/רְא֥וֹת עָמָ֖ל וְ/יָג֑וֹן וַ/יִּכְל֥וּ בְּ/בֹ֖שֶׁת יָמָֽ/י׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/020/018.yaml
  text: Why did I come out from the womb to see trouble and sorrow[b][a], and for my days to end in shame?
translation:
  language: zh_hans
  text: 我为什么竟从母腹出来，看见苦难和忧愁[a]，而我的年日也在羞耻中耗尽[b]呢？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“劳苦和悲伤”。
    reason: lexical_alternative
  - marker: b
    text: “耗尽”也可译为“结束”。
    reason: lexical_alternative
lexical_decisions:
- source_word: לָמָּה זֶּה
  choice: 我为什么竟……呢
  rationale: לָמָּה提出直接疑问，זֶּה加强反问语气；用“竟”和句末“呢”自然表达哀叹中的强调。
- source_word: מֵרֶחֶם יָצָאתִי
  choice: 从母腹出来
  rationale: 保留希伯来文“从腹中出来”的具体出生意象，不直接释为“出生”；现代汉语以“母腹”明确这一惯用含义。
- source_word: לִרְאוֹת
  choice: 看见
  rationale: 保留ראה的基本视觉表达，同时让上下文自然传达“遭遇、经历”的含义。
- source_word: עָמָל וְיָגוֹן
  choice: 苦难和忧愁
  rationale: עָמָל可指劳苦、患难或痛苦，יָגוֹן指忧愁、悲伤；此译符合哀歌语境，又不把עָמָל限于劳作。
- source_word: וַיִּכְלוּ
  choice: 也……耗尽
  rationale: 该动词为第三人称复数，以“我的年日”为主语，可表达年日被消耗殆尽或走到尽头；“耗尽”保留其较强的消逝意象。
- source_word: בְּבֹשֶׁת יָמָי
  choice: 我的年日也在羞耻中
  rationale: 保留“我的年日”这一诗性说法，并将בְּבֹשֶׁת直译为“在羞耻中”，不扩展为特定形式的公开羞辱。
theological_decisions:
- issue: 末句与前文的逻辑关系
  choice: 用“而”并列连接，不明确译成目的或结果
  alternative: “以致我的年日在羞耻中耗尽”或“为要让我的年日在羞耻中结束”
  rationale: 希伯来文末句由וַיִּכְלוּ续接，形式上陈述“我的年日耗尽”，并未使用明确的目的标记。并列译法保留它可能是人生结果、伴随结局或反问内容延伸的张力。
translation_notes:
  register: 采用现代、庄重而易懂的哀叹语体。“母腹”“年日”保留原文的诗性意象；“竟……呢”传达强烈反问，但避免过度口语化。所有脚注标记均置于其对应短语之后。
