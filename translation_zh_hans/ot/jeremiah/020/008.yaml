base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/020/008.yaml
  text: For whenever I speak[a], I cry out; I proclaim, “Violence and destruction!” For the word of Yahweh has become to me a reproach and a derision all day long.
translation:
  language: zh_hans
  text: 每当我说话，我就呼喊；我宣告：“暴力和毁灭！”因为雅威的话使我终日受辱，遭人嘲笑。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִדֵּי
  choice: 每当
  rationale: מִדֵּי与未完成式连用，表达反复发生的情形；“每当”自然地保留这种惯常、重复的意味。
- source_word: אֲדַבֵּר
  choice: 我开口
  rationale: 此处指耶利米每次开始传讲；“开口”符合现代汉语，并与下文“呼喊”“宣告”形成自然层次。
- source_word: אֶזְעָק
  choice: 总要呼喊
  rationale: זעק表示强烈地呼喊；补出“总要”使原文迭次结构在汉语中清楚可感。
- source_word: חָמָס
  choice: 暴力
  rationale: חָמָס常指暴力或暴行；“暴力”直接保留先知控诉的力度。
- source_word: שֹׁד
  choice: 毁灭
  rationale: שֹׁד可指毁坏、蹂躏或劫掠；在此与“暴力”并列，“毁灭”涵盖面较广，也符合先知性警告的语境。
- source_word: אֶקְרָא
  choice: 我宣告
  rationale: קרא在这里引出公开传告的内容；“宣告”既区别于前面的“呼喊”，又保留公开发布信息的意味。
- source_word: דְבַר יְהוָה
  choice: 雅威的话
  rationale: 保留标准先知用语“……的话”，并将四字神名按其专名音译为“雅威”。
- source_word: לְחֶרְפָּה
  choice: 使我受辱
  rationale: חֶרְפָּה包括羞辱、辱骂和被人蔑视；汉语用结果性表达“使我受辱”较自然。
- source_word: לְקֶלֶס
  choice: 被人嘲笑
  rationale: קֶלֶס指嘲弄、讥笑；译作“被人嘲笑”明确表达耶利米因所传之道而成为他人嘲弄的对象。
- source_word: כָּל־הַיּוֹם
  choice: 终日
  rationale: 该短语表示整日持续；“终日”简洁、庄重且符合现代书面汉语。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华／主
  rationale: 原文使用神的专名，而非称号；“雅威”作为现代汉语常见的学术性音译，保留其专名性质，不以“主”替代。
- issue: “雅威的话”与受辱、嘲笑的关系
  choice: 雅威的话使我终日受辱，被人嘲笑
  alternative: 雅威的话终日成了我的羞辱和笑柄
  rationale: 原文可按结果理解为这话给先知带来羞辱与嘲弄，也可较字面地说这话成了他的羞辱和笑柄。正文采用自然汉语表达其因果关系，注释保留较字面的替代译法，避免把“神的话本身可耻”误作作者的神学判断。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“呼喊—宣告”保留两个动词的区分；“受辱，被人嘲笑”以自然汉语呈现两个并列结果。主文中的脚注标记[a]与脚注完全对应。
