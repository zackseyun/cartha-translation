  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: שִׁ֚ירוּ לַֽ/יהוָ֔ה הַֽלְל֖וּ אֶת יְהוָ֑ה כִּ֥י הִצִּ֛יל אֶת נֶ֥פֶשׁ אֶבְי֖וֹן מִ/יַּ֥ד מְרֵעִֽים־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/020/013.yaml
  text: Sing to Yahweh[a]; praise Yahweh[c][b], for he has delivered the life of the poor from the hand of evildoers.
translation:
  language: zh_hans
  text: 你们要向雅威[a]歌唱，要赞美雅威！因为他从作恶之人的手中[c]救出了穷乏人的性命[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “雅威”对应希伯来文神名יהוה（YHWH）；中文传统常译作“耶和华”。
    reason: alternative_reading
  - marker: b
    text: 原文为“穷乏人的נֶפֶשׁ”；נֶפֶשׁ可指性命、生命或人本身。此处指受威胁之人的性命。
    reason: lexical_alternative
  - marker: c
    text: “从……的手中”是希伯来语表达，也有“脱离……的权势或控制”的意思。
    reason: idiom_explanation
lexical_decisions:
- source_word: שִׁירוּ
  choice: 你们要……歌唱
  rationale: 这是שׁיר的复数命令式；用“你们要……歌唱”明确共同体呼召，同时避免添加原文未明说的“颂歌”等内容。
- source_word: לַיהוָה
  choice: 向雅威
  rationale: 介词ל表示歌唱所朝向的对象；“向”符合现代汉语表达。神名יהוה音译为“雅威”，并以脚注说明传统译法。
- source_word: הַלְלוּ
  choice: 要赞美
  rationale: הלל的Piel复数命令式在敬拜语境中意为“赞美”；简洁庄重，并与前句形成平行。
- source_word: כִּי
  choice: 因为
  rationale: 引出前述两个命令的理由，清楚保留因果关系。
- source_word: הִצִּיל
  choice: 救出了
  rationale: נצל的Hiphil完成式表示已经成就的拯救；“救出了”自然表达脱离敌人控制的结果。
- source_word: נֶפֶשׁ
  choice: 性命
  rationale: 此处指处于危险中的生命或本人，而非专指与身体有别的“灵魂”；“性命”最贴合受人加害而蒙救的语境。
- source_word: אֶבְיוֹן
  choice: 穷乏人
  rationale: 该词指贫穷、缺乏而无力自保的人；“穷乏人”兼顾经济匮乏和困弱处境，并保留原文的代表性单数。
- source_word: מִיַּד
  choice: 从……的手中
  rationale: 直译保留希伯来语“手”的鲜明意象；汉语“从某人手中救出”也自然表达脱离其权势或控制。
- source_word: מְרֵעִים
  choice: 作恶之人
  rationale: 这是רעע的分词名词化用法，指行恶的人；“作恶之人”准确、庄重，也避免生硬的抽象名词。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名YHWH。“雅威”较接近学界通常重构的读音，同时脚注交代中文传统译名，不以普通称号取代专名。
- issue: נֶפֶשׁ在拯救语境中的含义
  choice: 性命
  alternative: 灵魂；本人
  rationale: 上下文所说的是穷乏人从作恶者手中获救，因此נֶפֶשׁ自然指其生命或整个人，不宜借“灵魂”导入原文没有明确表达的身心二分观。
- issue: “手”是否按权势解释
  choice: 正文保留“手中”
  alternative: 权势之下；掌控之中
  rationale: 原文以“手”比喻控制和权势。现代汉语同样能理解“从某人手中救出”，故正文保留意象，并在脚注说明其含义。
translation_notes:
  register: 采用现代、庄重而可朗读的诗歌体。两个复数命令式以“要……，要……”形成平行；后半句按自然汉语调整语序，但保留“手中”的希伯来意象和“穷乏人”的代表性单数。
