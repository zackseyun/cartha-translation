    rationale: 原文的主干是“巴施户珥……听见耶利米正在说预言”。原稿先以“是……首席主管”构成完整句，再另起“他听见”，虽不致误译，却不如将身份说明置于同一叙事句中紧凑。
  revised_text: 祭司巴施户珥是音麦的儿子，也是雅威的殿[a]里的首席主管；他听见耶利米正在说预言，宣告这些话。
  revised_footnotes:
