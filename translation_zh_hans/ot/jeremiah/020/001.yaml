revisions:
- from: 音麦的儿子、祭司巴施户珥，是雅威殿里的首席主管[a]。他听见耶利米正在说预言，宣告这些话。
  to: 祭司巴施户珥是音麦的儿子，也是雅威的殿[a]里的首席主管；他听见耶利米正在说预言，宣告这些话。
  rationale: 修订将人物身份及职务作为同一叙事中的背景说明，保留“听见”为事件主干；同时把脚注锚点移至其实际所释的“雅威的殿”。“正在说预言，宣告这些话”保留分词的同时性及“这些话”的指称，不增加解释性神学含义。
