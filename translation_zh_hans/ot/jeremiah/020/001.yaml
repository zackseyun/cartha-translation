  text: וַ/יִּשְׁמַ֤ע פַּשְׁחוּר֙ בֶּן אִמֵּ֣ר הַ/כֹּהֵ֔ן וְ/הֽוּא פָקִ֥יד נָגִ֖יד בְּ/בֵ֣ית יְהוָ֑ה אֶֽת יִרְמְיָ֔הוּ נִבָּ֖א אֶת הַ/דְּבָרִ֥ים הָ/אֵֽלֶּה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/020/001.yaml
  text: Pashhur son of Immer the priest[a], who was chief officer in the house of Yahweh, heard Jeremiah prophesying these words.
translation:
  language: zh_hans
  text: 祭司巴施户珥是音麦的儿子，也是雅威的殿[a]里的首席主管；他听见耶利米正在说预言，宣告这些话。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “殿”原文直译为“家”或“房屋”，这里指雅威的圣殿。
    reason: 保留בֵּית的字面意义，同时说明其语境所指。
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: 听见
  rationale: שׁמע在叙事中表示巴施户珥听到了耶利米所说的话；“听见”不额外暗示他有意专心聆听。句首的וַ仅承接叙事，不另加“现在”。
- source_word: פַּשְׁחוּר בֶּן אִמֵּר הַכֹּהֵן
  choice: 音麦的儿子、祭司巴施户珥
  rationale: 保留父子称谓，并把带定冠词的“祭司”作为巴施户珥的身份说明。
- source_word: וְהוּא פָקִיד נָגִיד
  choice: 是……首席主管
  rationale: פקיד指受委任的主管或官员，נגיד强调其领导地位；“首席主管”自然地表达两个词合用的意义。
- source_word: בְּבֵית יְהוָה
  choice: 在雅威殿里
  rationale: בַּיִת在此指敬拜场所，即圣殿；正文用现代中文自然表达，脚注保留“家／房屋”的字面意象。
- source_word: יְהוָה
  choice: 雅威
  rationale: 把四字神名作为专名音译，而不以“主”这一称号代替。
- source_word: נִבָּא
  choice: 正在说预言
  rationale: 分词表示巴施户珥听见时，耶利米正处于先知宣告的行动中；“正在”保留其持续、同时发生的意味。
- source_word: אֶת הַדְּבָרִים הָאֵלֶּה
  choice: 宣告这些话
  rationale: דברים在此指耶利米刚刚说出的先知话语；译作“这些话”比泛指“这些事”更贴合语境。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文使用神的专名；采用接近YHWH传统读音的现代汉语音译“雅威”，既保留专名性质，也避免用称号消解原文。
- issue: “祭司”所修饰的人物
  choice: 理解为巴施户珥的身份
  alternative: 理解为音麦的身份
  rationale: 希伯来语词序在形式上可能使读者短暂联想到音麦，但后续官职说明和通常的句法理解支持把“祭司”视为巴施户珥的同位身份；正文采用这一较自然读法。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。将希伯来语较长的单句分成两句，以避免中文主干过重；用“首席主管”表达圣殿行政职务，不引入后世宗派性的官衔。
