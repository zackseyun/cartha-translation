  source_fidelity: 译文准确传达了巴施户珥听见耶利米说预言、其身为祭司并在雅威殿中任首席主管的主要内容。惟原稿将首句独立为判断句，较弱化了原文以“听见”为主干的叙事结构；脚注锚点也错误地附在“祭司”之后，而脚注实际说明的是“雅威的殿”。
  naturalness: “音麦的儿子、祭司巴施户珥”在现代汉语中略显堆叠，改为“祭司巴施户珥是音麦的儿子”更清楚自然。以分号连接身份说明和主要事件，既符合中文表达，也较好保留原文叙事推进。
  terminology: “雅威”对应יהוה，处理一致；“祭司”“首席主管”分别恰当地表达הכהן与פקיד נגיד。“雅威的殿”自然表达“雅威的家”，并由脚注保留其字面措辞及圣殿所指。
