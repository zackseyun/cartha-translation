id: JER.20.9
reference: Jeremiah 20:9
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/אָמַרְתִּ֣י לֹֽא אֶזְכְּרֶ֗/נּוּ וְ/לֹֽא אֲדַבֵּ֥ר עוֹד֙ בִּ/שְׁמ֔/וֹ וְ/הָיָ֤ה בְ/לִבִּ/י֙ כְּ/אֵ֣שׁ בֹּעֶ֔רֶת עָצֻ֖ר בְּ/עַצְמֹתָ֑/י וְ/נִלְאֵ֥יתִי כַּֽלְכֵ֖ל וְ/לֹ֥א אוּכָֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/020/009.yaml
  text: If I say[a], “I will not mention him, or speak any longer in his name,” then in my heart it is like a burning fire, shut up in my bones; I grow weary of holding it in[c][b], and I cannot.
translation:
  language: zh_hans
  text: 我若说[a]：“我不再提起他，也不再奉他的名说话，”这话便在我心里如燃烧的火，被封在我骨中；我竭力抑制，已经疲惫不堪，却不能不说。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我若说：‘我不再记念他。’”希伯来语这个动词既可指“记念”，也可指“提起”；这里与下句“说话”平行，所以正文译作“提起”。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“而我不能”，没有明说不能做什么；按上下文，是指无法继续忍住而不说。
    reason: alternative_reading
lexical_decisions:
- source_word: וְאָמַרְתִּי
  choice: 我若说
  rationale: 该形式字面可作“我说了”，但上下文呈现先知内心所作的设想或反复出现的决意；“我若说”自然表达这一语境功能。
- source_word: אֶזְכְּרֶנּוּ
  choice: 我不再提起他
  rationale: זכר既可指“记念”，也可指“提起”。这里与下句“不再……说话”构成平行，因此采用言语层面的“提起”，同时以脚注保留另一义项。
- source_word: אֲדַבֵּר עוֹד בִּשְׁמוֹ
  choice: 也不再奉他的名说话
  rationale: בשם在先知语境中表示以某人的名义、权柄或代表身份说话。“奉他的名”保留原文惯用语及使命意味。
- source_word: וְהָיָה בְלִבִּי
  choice: 这话便在我心里
  rationale: 希伯来文动词为阳性单数，却没有明说主语；上下文最可能指所要压抑的信息。“这话”在中文中衔接自然，但脚注说明原文所指是隐含的。
- source_word: כְּאֵשׁ בֹּעֶרֶת
  choice: 如燃烧的火
  rationale: 保留具体而强烈的火焰意象，并以自然现代汉语表达名词与分词的组合。
- source_word: עָצֻר בְּעַצְמֹתָי
  choice: 闭塞在我的骨中
  rationale: עצר表达被禁闭、拘束或压住；“闭塞在我的骨中”保留其受困状态和深入骨髓的身体意象。
- source_word: וְנִלְאֵיתִי כַּלְכֵּל
  choice: 我竭力忍住，已经疲惫不堪
  rationale: נלאיתי表示疲惫，כלכל在此表示承受、容纳或抑制。“竭力忍住”传达压下这话的努力，“疲惫不堪”体现结果。
- source_word: וְלֹא אוּכָל
  choice: 却不能不说
  rationale: 原文直译为“而我不能”，宾语隐含。中文若仅说“我不能”语意悬空，因此补出上下文所指的不能继续抑制、不得不说；脚注注明原文的简略形式。
theological_decisions:
- issue: 第三人称代词“他／他的”所指
  choice: 正文保留“他”和“他的”，不直接改为“耶和华”
  alternative: 在正文明确译作“耶和华”或“耶和华的名”
  rationale: 上下文能辨明所指，但希伯来文本节使用代词。保留代词避免加入原文没有明说的名称，也维持先知独白的直接感。
- issue: 心中如火之物的隐含所指
  choice: 正文以“这话”作最低限度的中文衔接，并用脚注说明原文没有明说
  alternative: 译作“他的言语”或完全使用无明确所指的“它”
  rationale: 原文没有显式名词，可能指耶和华的信息，也可能强调无法抗拒的说话冲动。中文需要可理解的承接，故用“这话”，但不把它神学化地限定为某个专门术语，并在脚注保存原文的含蓄。
- issue: 末句隐含的不能之事
  choice: 译作“却不能不说”
  alternative: 直译为“而我不能”或译作“我无法忍住”
  rationale: 希伯来文省略宾语，语境是无法继续压抑先知的信息。中文补出“不说”可表达实际结果，但脚注保留原文并未明说宾语这一事实。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“奉他的名说话”保留先知代表某位权威发言的语义；“骨中”保存原文强烈的身体意象。标点和语序按现代汉语调整，同时以脚注保留词义及省略成分的歧义。
