id: JER.20.11
reference: Jeremiah 20:11
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַֽ/יהוָ֤ה אוֹתִ/י֙ כְּ/גִבּ֣וֹר עָרִ֔יץ עַל כֵּ֛ן רֹדְפַ֥/י יִכָּשְׁל֖וּ וְ/לֹ֣א יֻכָ֑לוּ בֹּ֤שׁוּ מְאֹד֙ כִּֽי לֹ֣א הִשְׂכִּ֔ילוּ כְּלִמַּ֥ת עוֹלָ֖ם לֹ֥א תִשָּׁכֵֽחַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/020/011.yaml
  text: But Yahweh is with me like a mighty warrior[a]; therefore my persecutors will stumble and will not prevail. They will be utterly ashamed, because they have not acted wisely[c][b]; their everlasting disgrace will not be forgotten.
translation:
  language: zh_hans
  text: 但耶和华与我同在，像一位勇猛可畏的战士[a]；因此，迫害我的人[b]必绊倒，不能得胜。他们必大大蒙羞，因为他们行事不明智[c]；他们永远的耻辱必不被遗忘。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文也可译作“像一位强大的勇士”或“像一位令人畏惧的战士”。
    reason: lexical_alternative
  - marker: b
    text: “迫害我的人”也可译作“追赶我的人”。
    reason: lexical_alternative
  - marker: c
    text: “行事不明智”也可译作“没有领悟”或“行事没有见识”；原词也可能含有“未能成功”的意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיהוָה
  choice: 但耶和华
  rationale: וַ在上下文中表示转折，从先知的哀诉转向对上帝同在的确信；יהוה按其专名译作“耶和华”。
- source_word: אוֹתִי
  choice: 与我同在
  rationale: 原文是带代词的宾格标记，处于省略系词的名词句中；按希伯来语习惯表达支持性的临在，汉语自然译为“与我同在”。
- source_word: כְגִבּוֹר עָרִיץ
  choice: 像一位勇猛可畏的战士
  rationale: גִּבּוֹר指勇士或战士，עָרִיץ在此增添强悍、令人畏惧的意味；两者都在正文中保留。
- source_word: עַל כֵּן
  choice: 因此
  rationale: 准确表达由耶和华同在所引出的结果。
- source_word: רֹדְפַי
  choice: 迫害我的人
  rationale: רדף既可指追赶，也可指迫害；本段语境涉及敌意攻击，正文采用“迫害”，脚注保留“追赶”的可能。
- source_word: יִכָּשְׁלוּ
  choice: 必绊倒
  rationale: 保留כשל的跌绊意象，不把失败程度解释得过满。
- source_word: וְלֹא יֻכָלוּ
  choice: 不能得胜
  rationale: יכל字面为“能够”；在敌对冲突语境中表示无法成功或占上风，译为“不能得胜”较自然。
- source_word: בֹּשׁוּ מְאֹד
  choice: 必大大蒙羞
  rationale: בוש表达受羞辱或蒙羞，מְאֹד加强程度；“大大蒙羞”兼顾强度和庄重语体。
- source_word: כִּי לֹא הִשְׂכִּילוּ
  choice: 因为他们行事不明智
  rationale: שׂכל的使役形可表示领悟、明智行事或行事有成；正文选择符合敌对行动语境的“行事不明智”，脚注保留语义张力。
- source_word: כְּלִמַּת עוֹלָם
  choice: 他们永远的耻辱
  rationale: כְּלִמָּה为耻辱、羞辱，עוֹלָם在此表示持久不消逝；译文保持原文凝重表达。
- source_word: לֹא תִשָּׁכֵחַ
  choice: 必不被遗忘
  rationale: 阴性单数动词与前面的“耻辱”呼应，采用被动表达，保持原句焦点。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。中文正文采用读者最熟悉且明确作为专名的“耶和华”，不以“主”替代神名；“雅威”是较接近学界重构读音的另一译法。
- issue: 耶和华同在的作用
  choice: 保留“与我同在”及其战士比喻
  alternative: 扩写为“保护我”或“为我争战”
  rationale: 上下文暗示支持和保护，但原文本身仅陈述同在并使用战士比喻，因此不把隐含意义扩写为明确的神学命题。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留“绊倒”的原文意象，并以“勇猛可畏”体现复合短语中力量与威慑两层含义；标点突出因果和末句的审判力度。
