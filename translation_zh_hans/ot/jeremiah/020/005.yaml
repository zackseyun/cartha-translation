source:
  edition: WLC
  text: וְ/נָתַתִּ֗י אֶת כָּל חֹ֨סֶן֙ הָ/עִ֣יר הַ/זֹּ֔את וְ/אֶת כָּל יְגִיעָ֖/הּ וְ/אֶת כָּל יְקָרָ֑/הּ וְ/אֵ֨ת כָּל אוֹצְר֜וֹת מַלְכֵ֣י יְהוּדָ֗ה אֶתֵּן֙ בְּ/יַ֣ד אֹֽיְבֵי/הֶ֔ם וּ/בְזָזוּ/ם֙ וּ/לְקָח֔וּ/ם וֶ/הֱבִיא֖וּ/ם בָּבֶֽלָ/ה־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/020/005.yaml
  text: And I will give all the wealth of this city[a], all its gains, all its precious things, and all the treasures of the kings of Judah into the hand of their enemies. They will plunder them, take them[c][b], and bring them to Babylon.
translation:
  language: zh_hans
  text: 我必把这城的一切财富、它劳碌所得的一切[a]、它一切珍贵之物，以及犹大列王的一切宝藏，都交在他们的仇敌[c]手中[b]。仇敌必劫掠这一切，把它们拿走，带到巴比伦去。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “劳碌所得”或译“劳碌”或“出产”。希伯来语原词既可指劳作本身，也可指劳作带来的成果。
    reason: lexical_alternative
  - marker: b
    text: “交在……手中”是希伯来语惯用说法，意思是交在对方的控制或权势之下。
    reason: cultural_note
  - marker: c
    text: “他们”按语法最近可指犹大列王；按整个语境，仇敌也是这城及其居民的仇敌。
    reason: referent_ambiguity
lexical_decisions:
- source_word: חֹסֶן
  choice: 财富
  rationale: 在财物被交出、劫掠并运走的语境中，这个词指物质财富，而不是抽象的“力量”。
- source_word: יְגִיעָהּ
  choice: 它劳碌所得的一切
  rationale: 原词既可指劳碌本身，也可指劳碌的成果；“劳碌所得”在中文中保留两者的联系，同时符合可被掠走之物的语境。
- source_word: יְקָרָהּ
  choice: 它一切珍贵之物
  rationale: 在一连串可被掠夺的资产中，采用具体的“珍贵之物”，同时保留原词“贵重、宝贵”的语义。
- source_word: אוֹצְרוֹת מַלְכֵי יְהוּדָה
  choice: 犹大列王的一切宝藏
  rationale: 原词也可指库房，但上下文强调被夺走的内容物；“宝藏”自然且不必把词义限定为建筑或储藏处。
- source_word: בְּיַד
  choice: 交在……手中
  rationale: 保留希伯来语表示落入他人控制或权势之下的常见身体隐喻，在现代中文里也清楚自然。
- source_word: אֹיְבֵיהֶם
  choice: 他们的仇敌
  rationale: 保留原文复数代词，不在正文中强行判定其所指；最近的语法先行词是“犹大列王”，但语境也涉及这城。
- source_word: וּבְזָזוּם
  choice: 仇敌必劫掠这一切
  rationale: “劫掠”准确表达战争中抢夺战利品的含义；补出“仇敌”作主语，使中文衔接清楚。
- source_word: וּלְקָחוּם
  choice: 把它们拿走
  rationale: 采用宽泛直接的“拿走”，避免与前面的“劫掠”和后面的运往巴比伦重复。
- source_word: וֶהֱבִיאוּם בָּבֶלָה
  choice: 带到巴比伦去
  rationale: 准确表达使这些物品到达巴比伦及原文的方向含义，中文自然。
theological_decisions:
- issue: אֹיְבֵיהֶם中复数代词的所指
  choice: 正文译作“他们的仇敌”，并以脚注说明
  alternative: 明确译作“犹大列王的仇敌”或“这城的仇敌”
  rationale: 希伯来语最近的复数先行词是“犹大列王”，但在整个宣告中，这些敌人同时也是城及其居民的敌人；保留代词可避免消除原文的指代张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话；保留“交在……手中”的圣经式意象，并用脚注解释。句末把三个连续动作译为“劫掠……拿走，带到……去”，既反映希伯来语的推进，也避免中文中过度重复。
