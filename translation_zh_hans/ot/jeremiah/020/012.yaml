id: JER.20.12
reference: Jeremiah 20:12
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יהוָ֤ה צְבָאוֹת֙ בֹּחֵ֣ן צַדִּ֔יק רֹאֶ֥ה כְלָי֖וֹת וָ/לֵ֑ב אֶרְאֶ֤ה נִקְמָֽתְ/ךָ֙ מֵ/הֶ֔ם כִּ֥י אֵלֶ֖י/ךָ גִּלִּ֥יתִי אֶת רִיבִֽ/י־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/020/012.yaml
  text: But you[a], O Yahweh of Armies, who test the righteous, who see the kidneys and the heart, let me see your vengeance on them[b], for to you I have revealed my case.
translation:
  language: zh_hans
  text: 但万军之雅威啊，你察验义人，看透人的肺腑和心[a]。愿我看见你向他们报仇，因为我已向你陈明我的案件[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“肺腑和心”；在古代希伯来表达中，这些器官可代表人内在深处的思想、动机和情感。
    reason: cultural_note
  - marker: b
    text: “案件”也可译作“诉讼”“争讼”或“争端”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיהוָה צְבָאוֹת
  choice: 但万军之雅威啊
  rationale: 保留转折连接词、呼语语气和神的专名；“万军”传达 צְבָאוֹת 的复数军事意象。
- source_word: בֹּחֵן צַדִּיק
  choice: 你察验义人
  rationale: 分词表示雅威持续具有察验的行动或特征；צַדִּיק 以单数类称方式指“义人”。
- source_word: רֹאֶה כְלָיוֹת וָלֵב
  choice: 看透人的肺腑和心
  rationale: “看透”自然表达彻底洞察；保留“肺腑和心”的身体意象，并补出“人的”以符合现代汉语表达。
- source_word: אֶרְאֶה
  choice: 愿我看见
  rationale: 第一人称未完成式在此语境中带愿望或祈求色彩；不武断处理为单纯将来陈述。
- source_word: נִקְמָתְךָ מֵהֶם
  choice: 你向他们报仇
  rationale: 直接保留 נְקָמָה 的报复、报仇力度；介词在这一搭配中自然译作“向他们”。
- source_word: אֵלֶיךָ גִּלִּיתִי אֶת־רִיבִי
  choice: 我已向你陈明我的案件
  rationale: “陈明”体现向神揭示、呈明之意；רִיב 可指案件、诉讼或争讼，正文采用自然且具司法色彩的“案件”。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；音译为“雅威”可保留其作为专名的性质，不以称号取代。
- issue: כְלָיוֹת וָלֵב 的人观意象
  choice: 保留“肺腑和心”
  alternative: 内心深处；心思意念
  rationale: 原文以身体器官描绘最深处的思想、动机和情感。正文保留具体意象，脚注说明其文化含义，避免把古代意象过早化约为现代心理术语。
- issue: אֶרְאֶה 的语气
  choice: 愿我看见
  alternative: 我必看见；让我看见
  rationale: 该形式既可能被读作将来陈述，也可在上下文中表达愿望；“愿我看见”保留先知向神祈求的语境，同时不把它强化为命令。
- issue: נִקְמָה 的司法与报复张力
  choice: 报仇
  alternative: 伸冤；施行报应
  rationale: “报仇”最直接保留词语的反击与惩治力度；不以“伸冤”完全替代，从而避免只突出 vindication 而削弱原文的惩罚性。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“万军之雅威”保留传统经文的凝练呼语感；其余句式避免过度文言化。标点将前半句对神属性的陈述与后半句祈愿分开，以呈现希伯来诗句的推进。
