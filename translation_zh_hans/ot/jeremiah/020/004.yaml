revisions:
- from: 因为耶和华如此说：“看哪，我要使你成为你自己和所有爱你之人的惊恐[a]。他们必倒在仇敌的刀下，你要亲眼看见。我必把全犹大交在巴比伦王手中；他要把他们掳到巴比伦[b]，并用刀击杀他们。”
  to: 因为耶和华如此说：“看哪，我要使你成为令你自己和所有爱你的人恐惧的对象[a]。他们必倒在仇敌的刀下，你要亲眼看见。我必把全犹大交在巴比伦王手中；他要把他们掳到巴比伦[b]，并以刀攻击他们。”
  rationale: 修订仅处理两处会影响语义精确度的措辞：以“令……恐惧的对象”表达מָגוֹר及其后与格短语的关系；以“以刀攻击他们”保留נכה在此处“击打／攻击”的较宽语义。其余结构、专名、庄重语体和脚注锚点均予保留。
