source:
  edition: WLC
  text: כִּ֣י כֹ֣ה אָמַ֣ר יְהוָ֡ה הִנְ/נִי֩ נֹתֶנְ/ךָ֨ לְ/מָג֜וֹר לְ/ךָ֣ וּ/לְ/כָל אֹהֲבֶ֗י/ךָ וְ/נָֽפְל֛וּ בְּ/חֶ֥רֶב אֹיְבֵי/הֶ֖ם וְ/עֵינֶ֣י/ךָ רֹא֑וֹת וְ/אֶת כָּל יְהוּדָ֗ה אֶתֵּן֙ בְּ/יַ֣ד מֶֽלֶךְ בָּבֶ֔ל וְ/הִגְלָ֥/ם בָּבֶ֖לָ/ה וְ/הִכָּ֥/ם בֶּ/חָֽרֶב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/020/004.yaml
  text: 'For thus says Yahweh: Behold[a], I am making you a terror to yourself and to all your loved ones, and they will fall by the sword of their enemies while your eyes look on. And I will give all Judah into the hand of the king of Babylon[c][b], and he will carry them away to Babylon and strike them with the sword.'
translation:
  language: zh_hans
  text: 因为耶和华如此说：“看哪，我要使你成为令你自己和所有爱你的人恐惧的对象[a]。他们必倒在仇敌的刀下，你要亲眼看见。我必把全犹大交在巴比伦王手中；他要把他们掳到巴比伦[b]，并以刀攻击他们。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “恐惧的对象”原文为 מָגוֹר（magor），也可指“惊恐、可怕的对象”；这个词呼应上下文给巴施户珥所起的名字“玛歌珥·米撒毕”，意为“四面惊恐”。
    reason: 说明关键词的语义范围及其与上下文名称的文字呼应。
  - marker: b
    text: “掳到巴比伦”也可译作“放逐到巴比伦”。
    reason: 保留使役动词 גלה 所表达的强制迁徙、流放含义及可行译法。
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代汉语中广为人知的专名形式表达四字神名，而不以“主”这一称号代替。
- source_word: הִנְנִי
  choice: 看哪
  rationale: 保留先知宣告中提示注意、加强语势的功能，也符合庄重经文语体。
- source_word: נֹתֶנְךָ לְמָגוֹר
  choice: 我要使你成为……惊恐
  rationale: נתן与לְמָגוֹר连用在此表示“使成为惊恐的缘由或对象”；用“使……成为”表达其习语意义，并以“我要”传达即将施行的行动。
- source_word: לְךָ וּלְכָל־אֹהֲבֶיךָ
  choice: 你自己和所有爱你之人的
  rationale: לְךָ在此具有反身指向，译作“你自己”；אֹהֲבֶיךָ直译为“爱你的人”，避免把范围限定为朋友、亲属或盟友。
- source_word: וְנָפְלוּ בְּחֶרֶב אֹיְבֵיהֶם
  choice: 他们必倒在仇敌的刀下
  rationale: 保留“倒在刀下”的希伯来语意象，同时在现代汉语中自然地表达被敌人杀害。
- source_word: וְעֵינֶיךָ רֹאוֹת
  choice: 你要亲眼看见
  rationale: 自然表达巴施户珥将亲自目睹此事的强调意味。
- source_word: אֶתֵּן בְּיַד
  choice: 交在……手中
  rationale: 保留常见的希伯来语权势隐喻，清楚表达交由对方掌控。
- source_word: וְהִגְלָם בָּבֶלָה
  choice: 他要把他们掳到巴比伦
  rationale: 使役形态在此指强制迁徙、放逐；“掳到”既自然又保留战争背景。
- source_word: וְהִכָּם בֶּחָרֶב
  choice: 用刀击杀他们
  rationale: נכה本义较宽，但与“刀”连用且处于审判与战争语境中，译作“击杀”比仅作“击打”更准确，同时不必断言每一个被掳者都被杀。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威；主
  rationale: 原文直接使用神的专名。正文采用现代简体中文读者最熟悉的专名“耶和华”，而不以称号“主”替代；“雅威”是另一种可能的音译。
- issue: לְמָגוֹר 与上下文给巴施户珥所起名称的关系
  choice: 正文译“成为你自己和所有爱你之人的惊恐”，脚注说明上下文呼应
  alternative: 成为四面惊吓
  rationale: 本节句法明确带有“对你自己和所有爱你的人”的对象，不宜直接改写为上一节的“四面惊吓”；词语呼应则在脚注中保留。
- issue: 末句击杀对象的范围
  choice: 按语法以“他们”承接全犹大，同时不作系统性解释
  alternative: 把“他们”限定为未被掳走的人
  rationale: 希伯来语连续使用复数代词，表面上都回指“全犹大”。译文保留这种张力，不擅自把群体拆分或解释为每个人都经历两种结局。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“看哪”“交在……手中”“倒在……刀下”保留先知宣告的力度和原文意象；其余句式避免过度古雅。所有脚注标记均置于正文相应位置。
