source:
  edition: WLC
  text: וְ/הָיָה֙ הָ/אִ֣ישׁ הַ/ה֔וּא כֶּֽ/עָרִ֛ים אֲשֶׁר הָפַ֥ךְ יְהוָ֖ה וְ/לֹ֣א נִחָ֑ם וְ/שָׁמַ֤ע זְעָקָה֙ בַּ/בֹּ֔קֶר וּ/תְרוּעָ֖ה בְּ/עֵ֥ת צָהֳרָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/020/016.yaml
  text: Let that man be like the cities that Yahweh overthrew without relenting[b][a], and let him hear a cry in the morning and a battle shout at the time of noon.
translation:
  language: zh_hans
  text: 愿那人像雅威所倾覆、且没有改变心意的那些城一样[b]；愿他早晨听见哀号，中午时听见呐喊声[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “呐喊声”也可译作“警报声”或“号角声”。
    reason: lexical_alternative
  - marker: b
    text: 这里可能是在呼应雅威施行审判、倾覆所多玛和蛾摩拉等城的事。
    reason: cross_reference
lexical_decisions:
- source_word: וְהָיָה
  choice: 愿……像……一样
  rationale: 在耶利米咒诅自己出生之日的语境中，此处表示愿望或咒愿，不宜仅作将来叙述。
- source_word: הָאִישׁ הַהוּא
  choice: 那人
  rationale: 保留定冠词与指示词所表达的特指和距离感，也保留阳性单数。
- source_word: כֶּעָרִים
  choice: 像……那些城一样
  rationale: כְּ表示比较；关系从句限定所指的城，汉语用“那些城”自然清楚。
- source_word: אֲשֶׁר הָפַךְ יְהוָה
  choice: 雅威倾覆的
  rationale: הפך在审判语境中指灾难性的倾覆，并可能呼应所多玛、蛾摩拉；“倾覆”比泛称“毁灭”更能保留原词意象。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以常见汉语音译呈现四字神名，避免以称号代替专名。
- source_word: וְלֹא נִחָם
  choice: 而没有回心转意
  rationale: נחם在此表示面对已经宣告或施行的审判而改变心意、收回行动；该译法既不暗示道德过错，也不抹去原文关于神是否改变心意的张力。
- source_word: וְשָׁמַע
  choice: 愿他……听见
  rationale: 延续前半句的咒愿语气。
- source_word: זְעָקָה
  choice: 哀号
  rationale: זעקה是困苦中的呼喊；“哀号”在此能自然传达灾祸中的痛苦呼声。
- source_word: בַּבֹּקֶר
  choice: 早晨
  rationale: 简洁自然地表达时间。
- source_word: וּתְרוּעָה
  choice: 呐喊声
  rationale: תרועה可指战场呐喊、警报或号角声；正文用较宽泛的“呐喊声”保留声音与战乱色彩，并在脚注列出其他可能。
- source_word: בְּעֵת צָהֳרָיִם
  choice: 中午时
  rationale: 保留עֵת的时间表达，同时符合现代汉语习惯。
theological_decisions:
- issue: 神施行审判时נחם的含义
  choice: 没有回心转意
  alternative: 没有后悔；没有收回成命
  rationale: “后悔”容易使现代读者误解为神承认自己做错了事；“没有收回成命”则把原文的内在态度完全解释为行动。正文保留“改变心意”的概念及其神学张力。
- issue: 被倾覆之城的指涉
  choice: 正文不明确点名，脚注说明可能的经文呼应
  alternative: 直接译作所多玛和蛾摩拉
  rationale: 原文只说“那些城”，虽很可能令人联想到所多玛和蛾摩拉，却没有直接点名，不应在正文中消除这种含蓄性。
translation_notes:
  register: 采用现代、庄重而可朗读的普通话。“愿……愿……”保留咒愿语气；分号呈现两个彼此衔接的愿望句。所有脚注标记均置于相关正文之后。
