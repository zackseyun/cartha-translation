base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/020/003.yaml
  text: And it happened the next day[a], when Pashhur brought Jeremiah out of the stocks, that Jeremiah said to him, “Yahweh has not called your name Pashhur, but Terror on Every Side.”
translation:
  language: zh_hans
  text: 第二天，巴施户把耶利米从枷具中放了出来。耶利米对他说：“雅威给你起的名不是‘巴施户’，而是‘四面惊恐’[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语为“玛歌珥·米撒毕”（Magor-missabib），意思可译作“四面惊恐”“四周尽是恐怖”或“恐怖从四面而来”。这是给巴施户所起的新名，也形成文字上的双关。
    reason: 说明希伯来语新名的音译、语义范围及文字游戏。
lexical_decisions:
- source_word: מִמָּחֳרָת
  choice: 第二天
  rationale: 准确表达“次日、翌日”的时间顺序，符合现代汉语叙事习惯。
- source_word: וַיֹּצֵא ... אֶת יִרְמְיָהוּ מִן הַמַּהְפָּכֶת
  choice: 把耶利米从枷具中放了出来
  rationale: 使役形态表达“使出来、放出来”；汉语用“把……放出来”自然清楚。
- source_word: הַמַּהְפָּכֶת
  choice: 枷具
  rationale: 指用于拘禁并使受刑者身体姿势受限的器具；“枷具”既传达刑罚与拘束功能，也避免断定其具体构造完全等同于某一种中式木枷或脚镣。
- source_word: קָרָא ... שְׁמֶךָ
  choice: 给你起的名
  rationale: 保留希伯来语命名公式的含义，同时比逐字译作“称你的名”更符合现代汉语。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见音译呈现四字神名，保留其作为专名而非头衔的性质。
- source_word: כִּי אִם
  choice: 而是
  rationale: 在“不是……而是……”结构中自然表达否定后的强烈对照。
- source_word: מָגוֹר מִסָּבִיב
  choice: 四面惊恐
  rationale: 保留这一短语作为新名字的功能，并传达从四周而来的恐惧或四面皆有恐怖的意象；原文含义可兼指周围的恐怖与四面受惊。
- source_word: פַשְׁחוּר
  choice: 巴施户
  rationale: 按现代汉语圣经人名惯例音译该专名。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名，译为“雅威”可明确保留专名性质，不以“主”这一头衔替代；“耶和华”是汉语传统形式，但较不贴近通常重建的读音。
- issue: “四面惊恐”是描述还是新名
  choice: 作为雅威所赐的新名，以引号标明
  alternative: 仅译作对巴施户处境的描述
  rationale: קָרָא שְׁמֶךָ 的命名公式和“不……而是……”的对照表明，这里是带有审判意义的改名；同时不进一步解释此名具体指他使别人惊恐还是他自己四面受惊，以保留上下文展开的张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。叙事部分拆为两句以避免欧化长句；引语保留正式的命名宣告语气。“枷具”有意不把古代刑具过度具体化。
