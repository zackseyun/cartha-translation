  text: וַ/יֵּ֣לְכ֔וּ אַחֲרֵ֖י שְׁרִר֣וּת לִבָּ֑/ם וְ/אַחֲרֵי֙ הַ/בְּעָלִ֔ים אֲשֶׁ֥ר לִמְּד֖וּ/ם אֲבוֹתָֽ/ם׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/009/013.yaml
  text: They went after the stubbornness of their heart and after the Baals[a], which their fathers taught them.
translation:
  language: zh_hans
  text: 他们随从自己顽梗的心，又随从巴力诸神；他们的父辈[a]曾教导他们追随这些神。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“祖先”。原文直译为“父亲们”，这里指先前世代的父辈。
    reason: 说明אֲבוֹתָם字面为阳性复数“父亲们”，但在此语境中可指先前世代的父辈。
lexical_decisions:
- source_word: וַיֵּלְכוּ אַחֲרֵי
  choice: 随从
  rationale: הלך与אַחֲרֵי连用，表示跟从、追随或效忠；“随从”自然地表达这一习语，并适合本节关于宗教与道德背离的语境。
- source_word: שְׁרִרוּת לִבָּם
  choice: 自己顽梗的心
  rationale: שְׁרִרוּת指固执、自行其是的顽梗；希伯来文以单数“心”配复数所属形式，中文用“自己……的心”可自然保留这种集体性的单数表达。
- source_word: וְאַחֲרֵי
  choice: 又随从
  rationale: 原文重复介词结构，形成两个并列的追随对象；译文重复“随从”，保留其修辞平行。
- source_word: הַבְּעָלִים
  choice: 众巴力
  rationale: 复数形式指各地所崇拜的巴力神祇或其不同地方形态；“众巴力”既保留专名，也显明原文复数。
- source_word: אֲשֶׁר לִמְּדוּם
  choice: 是……教他们随从的
  rationale: למד的加强词干意为“教导”，宾语后缀为“他们”。中文补出从上下文承接的“随从”，使关系从句通顺，却不增添新的行为内容。
- source_word: אֲבוֹתָם
  choice: 他们的父辈
  rationale: 原文直译为“他们的父亲们”，在此指先前世代的男性祖辈；“父辈”既保留阳性和代际含义，也比逐字译作“父亲们”更符合现代汉语。
theological_decisions:
- issue: אֲבוֹתָם的性别与世代范围
  choice: 他们的父辈
  alternative: 他们的祖先
  rationale: “父辈”保留原文阳性复数的形式与上一代、历代先人的含义；脚注说明其语境可泛指先前世代，避免把范围误限于各人的亲生父亲。
- issue: 关系从句所表达的教导内容
  choice: 教他们随从的
  alternative: 教给他们的
  rationale: 原文关系词紧接“众巴力”，而动词带“他们”为受教者；中文明确补出前文动词“随从”，表达原句省略而不把巴力简单物化为所传授的知识内容。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“顽梗”保留先知书的道德力度；“众巴力”为简洁的宗教专名复数表达。脚注标记置于“父辈”之后，使其与所解释的词直接对应。
