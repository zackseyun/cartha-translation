  text: וַ/הֲפִֽצוֹתִי/ם֙ בַּ/גּוֹיִ֔ם אֲשֶׁר֙ לֹ֣א יָֽדְע֔וּ הֵ֖מָּה וַֽ/אֲבוֹתָ֑/ם וְ/שִׁלַּחְתִּ֤י אַֽחֲרֵי/הֶם֙ אֶת הַ/חֶ֔רֶב עַ֥ד כַּלּוֹתִ֖/י אוֹתָֽ/ם־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/009/015.yaml
  text: And I will scatter them among the nations that neither they nor their fathers have known[c][b][a], and I will send the sword after them until I have consumed them.
translation:
  language: zh_hans
  text: 我要把他们分散到他们和他们的父亲[a]都不认识的列国中；我要差遣刀剑[b]追赶他们，直到我把他们灭尽[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“祖先”。希伯来文直译为“他们的父亲们”。
    reason: lexical_alternative
  - marker: b
    text: “刀剑”在圣经中常用来指战争或致命的审判。
    reason: cultural_note
  - marker: c
    text: 或译“直到我将他们除灭”或“直到我使他们灭绝”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַהֲפִצוֹתִים
  choice: 我要把他们分散
  rationale: הפיץ在使役意义上表示“使分散、驱散”。“把他们分散”既贴近原文，又符合现代汉语表达。
- source_word: בַּגּוֹיִם
  choice: 到列国中
  rationale: גּוֹיִם指各国或各民族；此处用“列国”保留先知书庄重语体，也避免加入后期“外邦人”的宗教群体含义。
- source_word: אֲשֶׁר לֹא יָדְעוּ הֵמָּה וַאֲבוֹתָם
  choice: 就是他们和他们的父辈都不认识的列国
  rationale: יָדַע在这里指认识、熟悉；“都不认识”自然表达否定同时涵盖“他们”和“他们的父辈”。重复“列国”可清楚交代关系从句所指，避免汉语歧义。
- source_word: וְשִׁלַּחְתִּי
  choice: 我还要使
  rationale: שׁלח通常意为“差遣、使……出去”。结合“刀剑追赶”的拟人化图像，“使”比单说“派”更自然，同时不强化为“释放”。
- source_word: אַחֲרֵיהֶם
  choice: 追赶他们
  rationale: 原义为“在他们后面”。语境表示刀剑随后追击；“追赶他们”在汉语中清楚保留这一动态意象。
- source_word: אֶת־הַחֶרֶב
  choice: 刀剑
  rationale: חֶרֶב是“剑、刀剑”，此处也可借指战争或致命审判。正文保留具体意象，不直接解释成抽象的“战争”。
- source_word: עַד כַּלּוֹתִי אוֹתָם
  choice: 直到把他们灭尽
  rationale: כלה在此表示使之终结、消灭净尽。“灭尽”体现审判的彻底性，同时脚注保留“使他们终结”等词义可能。
theological_decisions:
- issue: וַאֲבוֹתָם的亲属与历史含义
  choice: 他们的父辈
  alternative: 他们的祖先
  rationale: אָבוֹת字面为“父亲们”，在此可泛指从前的世代。“父辈”兼顾原文的男性复数形式与汉语中的历代含义；脚注说明也可译作“祖先”。
- issue: “刀剑”的转喻含义
  choice: 正文保留“刀剑”
  alternative: 战争或致命的审判
  rationale: 原文以具体的刀剑形象表达军事毁灭或审判。正文不把这一形象化解为单一解释，以保留原文的意象和神学张力。
- issue: כלה所表达的最终结果
  choice: 灭尽
  alternative: 使他们终结／除灭他们
  rationale: 该动词可表示完成、耗尽或使之终结。上下文具有严厉审判意味，但其词义并非只限于一种汉语措辞，因此正文采用自然的“灭尽”，脚注保留其他可能。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“列国”“刀剑”保留先知文学的凝练意象；句中重复“列国”是为使关系从句在现代汉语中指向明确。脚注标记按所注词语就近排列。
