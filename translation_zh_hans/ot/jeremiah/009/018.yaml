source:
  edition: WLC
  text: כִּ֣י ק֥וֹל נְהִ֛י נִשְׁמַ֥ע מִ/צִּיּ֖וֹן אֵ֣יךְ שֻׁדָּ֑דְנוּ בֹּ֤שְׁנֽוּ מְאֹד֙ כִּֽי עָזַ֣בְנוּ אָ֔רֶץ כִּ֥י הִשְׁלִ֖יכוּ מִשְׁכְּנוֹתֵֽי/נוּ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/009/018.yaml
  text: 'For the sound of wailing is heard from Zion: “How we are devastated! We are utterly ashamed[a], because we have left the land[c][b], because they have cast down our dwellings.”'
translation:
  language: zh_hans
  text: '因为有哀号声从锡安传来：


    “我们何等惨遭蹂躏！


    我们极其蒙羞，


    因为我们离开了这地[a]，


    因为他们推倒了我们的住处[b]。”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “离开了这地”也可译作“离弃了这地”。原文既可指离去，也可指弃绝；本节的哀叹语境较倾向于在审判中离境。
    reason: lexical_alternative
  - marker: b
    text: “住处”也可译作“居所”或“家园”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文召集善哭妇女、发出哀声的吩咐，说明哀哭的缘由；中文用“因为”自然清楚。
- source_word: קוֹל נְהִי
  choice: 哀号声
  rationale: 保留“声音”的听觉意象，并以现代汉语自然表达 נְהִי 所指的哀哭、悲号。
- source_word: נִשְׁמַע
  choice: 传来
  rationale: 希伯来语为被动“被听见”；结合 מִן“从”，译作“从……传来”更符合现代汉语，同时保留声音可闻的动态感。
- source_word: מִצִּיּוֹן
  choice: 从锡安
  rationale: 按地点来源直译，保留“锡安”这一地名及其诗歌和神学意蕴。
- source_word: אֵיךְ
  choice: 竟
  rationale: 在感叹句中表达惊痛与哀叹，比生硬的“何等”更自然，又不额外加入“哀哉”。
- source_word: שֻׁדָּדְנוּ
  choice: 我们竟遭到毁灭
  rationale: שׁדד 的被动可指遭蹂躏、劫掠或毁坏；正文采用范围较广的“遭到毁灭”，不把意义限于财物被掠。
- source_word: בֹּשְׁנוּ מְאֹד
  choice: 我们深感羞耻
  rationale: בושׁ 表示蒙羞或羞愧，מְאֹד 加强程度；“深感羞耻”庄重而符合现代汉语。
- source_word: כִּי עָזַבְנוּ אָרֶץ
  choice: 因为我们离开了这地
  rationale: עָזַבְנוּ 可指离开或弃绝；上下文较支持在审判中被迫离境，但正文以“离开”保留动作是否自愿的含混。“这地”在哀歌话语中自然指本土。
- source_word: כִּי הִשְׁלִיכוּ
  choice: 因为他们拆毁了
  rationale: השליך 本义为投掷、抛下；与“住处”搭配时语境指暴力推倒或毁坏。“拆毁”在中文中自然，但仍保留未明说身份的复数主语“他们”。
- source_word: מִשְׁכְּנוֹתֵינוּ
  choice: 我们的住处
  rationale: מִשְׁכָּן 可泛指居所、住所；“住处”比“帐幕”更少过度限定建筑形态，也比“居所”更通俗。
theological_decisions:
- issue: 离开土地是主动弃绝还是被迫离境
  choice: 正文译作“离开了这地”，不明确动机
  alternative: “离弃了这地”或“被迫离开这地”
  rationale: 原文 עזב 本身可表达离开或弃绝；本节哀叹和敌人毁坏住处的语境倾向被迫离境，但原文没有被动形式，因此不在正文中补入“被迫”。
- issue: 毁坏住处者的身份
  choice: 保留“他们”
  alternative: 明确译为“敌人”
  rationale: 原文只用未指明身份的第三人称复数，不应在译文中将其明确解释为某一群体。
translation_notes:
  register: 采用现代、庄重而易懂的哀歌体。分行呈现锡安传出的集体哀叹；保留“我们”与身份未明的“他们”之间的张力，不补出敌人或被掳等解释。所有脚注标记均置于正文相应词语之后。
