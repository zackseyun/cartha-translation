  text: שִׁבְתְּ/ךָ֖ בְּ/ת֣וֹךְ מִרְמָ֑ה בְּ/מִרְמָ֛ה מֵאֲנ֥וּ דַֽעַת אוֹתִ֖/י נְאֻם יְהוָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/009/005.yaml
  text: Your dwelling is in the midst of deceit[a]; through deceit they refuse to know me[b], declares Yahweh.
translation:
  language: zh_hans
  text: 你的住处在诡诈之中[a]；他们以诡诈拒绝认识我[b]。这是雅威的宣告。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文在这里先用第二人称单数“你的”，后面却用复数“他们”；这可能是先把百姓或城作为一个整体来称呼，再转指其中的居民。
    reason: lexical_alternative
  - marker: b
    text: 或译：“他们在诡诈中拒绝认识我。”
    reason: alternative_reading
lexical_decisions:
- source_word: שִׁבְתְּךָ
  choice: 你住在
  rationale: 该形式源于ישׁב，带第二人称阳性单数后缀，在此表达居住、栖身之意。译成“你住在”比名词化的“你的居所”更符合现代汉语，同时保留单数称呼。
- source_word: בְּתוֹךְ
  choice: 在……之中
  rationale: 准确表达身处某种包围性环境之内，不仅是一般地点介词“在”。
- source_word: מִרְמָה
  choice: 诡诈
  rationale: 该词指欺骗、虚假及奸诈行为；“诡诈”简洁而有道德力度，也便于保留原文的重复。
- source_word: בְּמִרְמָה
  choice: 以诡诈
  rationale: 将前缀בְּ理解为方式或手段，表达他们借诡诈维持对神的拒绝，并保留מִרְמָה在本句中的重复。
- source_word: מֵאֲנוּ
  choice: 他们……拒绝
  rationale: מאן意为拒绝、不肯。完成式在先知话语中可描述已经形成并持续存在的状态，因此正文用自然的现在性表达“拒绝”。
- source_word: דַעַת אֹתִי
  choice: 认识我
  rationale: ידע的不定式与第一人称宾语直译为“认识我”；既保留基本词义，也不把其关系性、盟约性含义解释性扩写进正文。
- source_word: נְאֻם יְהוָה
  choice: 这是雅威的宣告
  rationale: 这是庄严的先知公式；“宣告”保留权威语气，יְהוָה按其专名译作“雅威”。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名。正文以“雅威”音译，明确保留其作为神圣专名的性质，而不以称号替代。
- issue: 句中人称与数的转换
  choice: 保留单数“你”与复数“他们”的转换
  alternative: 全部统一为单数或复数
  rationale: 希伯来文先用第二人称单数后缀，随后改用复数动词。此转换可能先把百姓或城视为一个整体，再指其中居民；正文不将这一张力抹平。
- issue: בְּמִרְמָה与拒绝之间的关系
  choice: 以诡诈（方式或手段）
  alternative: 因诡诈（原因）
  rationale: 介词בְּ可表达手段、方式，也可能在语境中带原因意味。正文采用较直接的工具性理解，并以脚注保留另一种可能。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“诡诈”重复两次，以反映原文的修辞；保留人称数目的突变，并用脚注说明。
