  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כִּ֣י אִם בְּ/זֹ֞את יִתְהַלֵּ֣ל הַ/מִּתְהַלֵּ֗ל הַשְׂכֵּל֮ וְ/יָדֹ֣עַ אוֹתִ/י֒ כִּ֚י אֲנִ֣י יְהוָ֔ה עֹ֥שֶׂה חֶ֛סֶד מִשְׁפָּ֥ט וּ/צְדָקָ֖ה בָּ/אָ֑רֶץ כִּֽי בְ/אֵ֥לֶּה חָפַ֖צְתִּי נְאֻם יְהוָֽה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/009/023.yaml
  text: 'But let the one who boasts boast in this: that he understands and knows me[a], that I am Yahweh, who practices steadfast love, justice, and righteousness in the earth; for in these I delight[b], declares Yahweh.'
translation:
  language: zh_hans
  text: 但夸口的，应当以此夸口：他明白并认识我，知道我是雅威；我在地上[b]施行慈爱[a]、公平和公义，因为我喜爱这些事。——雅威宣告说。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “慈爱”译自希伯来语חֶסֶד。这个词也可表达忠贞的爱、怜悯或守约的信实，具体侧重随语境而定。
    reason: lexical_alternative
  - marker: b
    text: 或译“在这地”。希伯来语אֶרֶץ既可泛指大地，也可指某一特定的土地；正文采用较广的含义。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: 但……应当
  rationale: 承接上文不可凭智慧、勇力和财富夸口的禁令，引出正面的对比；中文用“但”简洁表达转折。
- source_word: בְּזֹאת
  choice: 以此
  rationale: 保留希伯来文前指结构，指向随后说明的正当夸口根据。
- source_word: יִתְהַלֵּל / הַמִּתְהַלֵּל
  choice: 夸口的，应当……夸口
  rationale: 保留词根重复及代表性单数，同时符合现代中文表达。
- source_word: הַשְׂכֵּל
  choice: 有洞察力
  rationale: 该词在使役词干中可指明智地领悟；这里与“认识我”并列，“有洞察力”既保留认知意味，也避免把它缩减为一般的聪明。
- source_word: וְיָדֹעַ אוֹתִי
  choice: 认识我
  rationale: ידע在此不只是掌握信息，也可包含关系性的认识；“认识我”直接而不作过度解释。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代中文音译呈现四字神名，保留其专名性质，不以称号替代。
- source_word: עֹשֶׂה
  choice: 施行
  rationale: 分词表达雅威持续而具有特征性的行动；“施行”适合与慈爱、公平和公义搭配。
- source_word: חֶסֶד
  choice: 慈爱
  rationale: “慈爱”自然、庄重，并能涵盖恩慈与忠贞之爱的主要意味；脚注提示其更丰富的盟约语义。
- source_word: מִשְׁפָּט
  choice: 公平
  rationale: 在与צְדָקָה并列时译作“公平”，表达公正的判断与治理，并与“公义”保持区别。
- source_word: צְדָקָה
  choice: 公义
  rationale: 保留该词关于正直、合乎正道的伦理含义，也维持与מִשְׁפָּט并列而不完全等同的关系。
- source_word: בָּאָרֶץ
  choice: 在地上
  rationale: אֶרֶץ既可指全地，也可指特定土地；正文采用较广义且在中文中自然的“地上”，脚注保留另一可能。
- source_word: כִּי בְאֵלֶּה חָפַצְתִּי
  choice: 因为我喜爱这些事
  rationale: חפץ表达喜悦与乐意，不只是意志上的选择；“喜爱”保留其情感力度。
- source_word: נְאֻם יְהוָה
  choice: 雅威宣告说
  rationale: 采用先知书中神谕结束语的庄重而清晰的现代中文表达。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名；正文以“雅威”音译，保留其作为以色列之神专名的功能，不把它替换为称号。
- issue: בָּאָרֶץ的范围
  choice: 在地上
  alternative: 在这地／在国中
  rationale: 本句陈述雅威施行慈爱、公平和公义的恒常特性，广义理解与语境相称；但אֶרֶץ本身也允许特指某片土地，因此用脚注保留歧义。
- issue: “明白”与“认识雅威”的关系
  choice: 他有洞察力，认识我，知道我是雅威
  alternative: 他明白并认识我：我是雅威
  rationale: 译文保留הַשְׂכֵּל与וְיָדֹעַ的并列，也让后一个כִּי自然引出所认识的内容，而不把洞察与关系性的认识合并成单一概念。
translation_notes:
  register: 采用庄重、清晰的现代标准汉语。保留“夸口”的词语重复和神谕结束语；以“洞察力”呈现认知层面的意味，同时用“认识我”保留关系性张力。脚注标记均置于其所解释的词语之后。
