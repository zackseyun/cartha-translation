  text: וַ/יֹּ֣אמֶר יְהוָ֔ה עַל עָזְבָ/ם֙ אֶת תּ֣וֹרָתִ֔/י אֲשֶׁ֥ר נָתַ֖תִּי לִ/פְנֵי/הֶ֑ם וְ/לֹא שָׁמְע֥וּ בְ/קוֹלִ֖/י וְ/לֹא הָ֥לְכוּ בָֽ/הּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/009/012.yaml
  text: And Yahweh said[a], "Because they have forsaken my law that I set before them[b], and have not obeyed my voice or walked in it,"
translation:
  language: zh_hans
  text: 耶和华说：“因为他们离弃了我摆在他们面前的律法[a]，不听我的话[b]，也不照它而行，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“教导”。希伯来语“妥拉”可泛指教导，但在这里也带有盟约规范的意味。
    reason: lexical_alternative
  - marker: b
    text: 或译“不听从我的话”。希伯来语“听我的声音”这一说法通常也含有服从的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的神圣名号译法，明确保留原文中的专名。
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: 上下文已由叙事次序衔接，现代汉语无需机械译出连接词 וַ。
- source_word: עַל עָזְבָם
  choice: 因为他们离弃了
  rationale: עַל 在此说明原因；“离弃”保留 עזב 在盟约语境中的郑重意味。
- source_word: תּוֹרָתִי
  choice: 我的律法
  rationale: תּוֹרָה 可泛指教导，但本节着重百姓违背上帝所颁示的盟约规范，“律法”较能体现其法律与盟约分量。
- source_word: אֲשֶׁר נָתַתִּי לִפְנֵיהֶם
  choice: 我摆在他们面前的
  rationale: 按 נתן לפני 的语境性用法译为“摆在……面前”，表达上帝将律法置于百姓面前、要他们遵守。
- source_word: וְלֹא שָׁמְעוּ בְּקוֹלִי
  choice: 不听我的话
  rationale: 中文“听我的话”自然保留听见与服从之间的语义张力，也避免把原文直接收窄为单一的“服从”。
- source_word: וְלֹא הָלְכוּ בָהּ
  choice: 也不照它而行
  rationale: הלך ב־ 描写依照某一准则生活行事；“照它而行”在现代中文中自然，并保留“行”的行为意象。
theological_decisions:
- issue: 盟约语境中 תּוֹרָה 的译法
  choice: 我的律法
  alternative: 我的教导
  rationale: 本节指百姓离弃上帝置于他们面前、要求遵行的规范，“律法”保留其盟约及法理分量；脚注同时保存“教导”这一真实词义。
- issue: 是否把 שמע בקול 明译为“听从／服从”
  choice: 不听我的话
  alternative: 不听从我的话
  rationale: 原文习语显然含有顺服之意，但字面仍以“听”为意象；中文“听我的话”恰能兼具聆听和服从两层含义。
- issue: הלך ב־ 的行为隐喻
  choice: 照它而行
  alternative: 遵行它
  rationale: “照它而行”既清楚表达按律法生活，也保留原文“行走”隐喻的一部分，避免完全释义化。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“耶和华”保留神圣名号；“摆在他们面前”和“照它而行”兼顾原文意象与中文可读性。引文在本节末尚未完结，因此保留逗号。
