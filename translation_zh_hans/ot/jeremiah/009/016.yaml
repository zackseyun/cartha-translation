    issue: “唱哀歌的妇女”略显过度限定。
    rationale: מְקוֹנְנוֹת指作哀悼、哀号或哀歌的妇女；其行为可包括吟唱，但词本身不必然限定为“唱”。
  - severity: medium
    issue: “善于哀哭的妇女”在正文中过度具体化。
    rationale: הַחֲכָמוֹת字面为“有智慧的妇女”，语境很可能指熟练的哀悼者，但原文没有直接说“善于哀哭”。较宽的“有经验的妇女”既反映语境，也保留技能性质未被明确界定的余地。
