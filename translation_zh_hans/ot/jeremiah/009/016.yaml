revisions:
- from: '万军之雅威如此说：

    “你们要仔细思量，

    召来唱哀歌的妇女[a]，让她们来；

    又派人去请善于哀哭的妇女[b]，让她们来。”'
  to: '万军之雅威如此说：


    “你们要仔细思量，


    召唤那些哀哭的妇女[a]，让她们来；


    又差人去请那些有经验的妇女[b]，让她们来。”'
  rationale: 修订避免把第一组妇女的哀悼行为限定为歌唱，并避免将第二组妇女的“智慧／熟练”直接等同于“哀哭”。同时保留原文两项命令与两次“让她们来”的对称结构，以及正式而自然的现代普通话语体。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T07:22:59Z'
review_pass:
  verdict: revise
  source_fidelity: 整体准确传达命令序列、两组妇女及两次“来”的平行结构。惟“唱哀歌”将哀悼行为限定为歌唱，略强于מְקוֹנְנוֹת本身；“善于哀哭”也比“有技巧／熟练的妇女”更具体地限定其技能为哭泣。宜以较宽的措辞保留原文在称谓上的区别与语义余地。
  naturalness: 译文庄重、通顺，适合现代汉语圣经语体。“派人去请”自然，但“派人”并非原文明说；以“差人去请”或“去请”均可。修订稿保留自然的命令语气和重复结构。
  terminology: “雅威”对应יְהוָה，“万军之雅威”对应神圣称号，处理恰当。将第二组称为“有经验的妇女”，并在注释说明原文直译及语境中的哀悼技艺，可避免正文过度解释。
  issues:
