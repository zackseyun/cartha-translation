base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/009/016.yaml
  text: 'Thus says Yahweh of hosts: Consider[a], and call for the mourning women, that they may come; and send for the skillful women[b], that they may come.'
translation:
  language: zh_hans
  text: '万军之雅威如此说：


    “你们要仔细思量，


    召唤那些哀哭的妇女[a]，让她们来；


    又差人去请那些有经验的妇女[b]，让她们来。”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“哀号的妇女”或“专门替人哀悼的妇女”。
    reason: lexical_alternative
  - marker: b
    text: 原文直译“有智慧的妇女”；这里可能指熟练带领哀悼的妇女。
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: 如此说
  rationale: 保留先知宣告的固定句式，庄重而符合现代汉语圣经语体。
- source_word: יְהוָה צְבָאוֹת
  choice: 万军之雅威
  rationale: 将四字神名音译为“雅威”，并用“万军之”表达צְבָאוֹת在神圣称号中的广泛含义，不局限为地上的军队。
- source_word: הִתְבּוֹנְנוּ
  choice: 你们要仔细思量
  rationale: 该命令式要求人留心察看并认真思考；“仔细思量”既表达专注，也保留反思之意。
- source_word: לַמְקוֹנְנוֹת
  choice: 唱哀歌的妇女
  rationale: 该阴性复数形式指负责作哀歌、带领哀悼的妇女；正文避免直接加入“职业”这一语义推断。
- source_word: וּתְבוֹאֶינָה / וְתָבֹאנָה
  choice: 让她们来
  rationale: 两个未完成式承接命令，表达所期望的行动；重复译出，以保留希伯来文平行结构。
- source_word: הַחֲכָמוֹת
  choice: 善于哀哭的妇女
  rationale: חכם字面可指“有智慧”，但在与唱哀歌者平行的语境中，更可能指熟练掌握哀哭技艺的妇女；译文体现语境含义，脚注保留字面可能。
- source_word: שִׁלְחוּ
  choice: 派人去请
  rationale: 语境要求差人把这些妇女请来；此译法比直译“差遣”更自然，并准确表达行动方向。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名；音译“雅威”保留专名性质，不以称号“主”取代，也不介入特定宗派解释。
- issue: הַחֲכָמוֹת所指的智慧或技艺
  choice: 正文按语境译为“善于哀哭的妇女”，脚注保留“有智慧的妇女”
  alternative: 有智慧的妇女
  rationale: 上下文把她们与唱哀歌的妇女并列，因此“智慧”很可能是指哀悼方面的熟练本领；脚注保留希伯来词的一般义，避免消除原文张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“仔细思量—召来—派人去请”保持命令次序，两次“让她们来”保留原文的平行与催促感。
