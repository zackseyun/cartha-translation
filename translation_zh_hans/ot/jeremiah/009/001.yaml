reference: Jeremiah 9:1
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: מִֽי יִתְּנֵ֣/נִי בַ/מִּדְבָּ֗ר מְלוֹן֙ אֹֽרְחִ֔ים וְ/אֶֽעֶזְבָה֙ אֶת עַמִּ֔/י וְ/אֵלְכָ֖ה מֵֽ/אִתָּ֑/ם כִּ֤י כֻלָּ/ם֙ מְנָ֣אֲפִ֔ים עֲצֶ֖רֶת בֹּגְדִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/009/001.yaml
  text: Oh[a], that I had a travelers' lodging place in the wilderness, so that I might leave my people and go away from them! For all of them are adulterers[d][c][b], an assembly of traitors.
translation:
  language: zh_hans
  text: 但愿我在旷野有一处供旅人住宿的地方[a]，好让我离开我的百姓，远离他们！因为他们全是行奸淫的人[b]，是一群背信之徒[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译近似：“谁能给我旷野中一处旅人住宿的地方？”这是表达愿望的惯用说法。
    reason: lexical_alternative
  - marker: b
    text: “行奸淫的人”也可译作“淫乱的人”；在先知语境中，还可能使人联想到对盟约的不忠，并不限于实际的奸淫行为。
    reason: alternative_reading
  - marker: c
    text: “一群背信之徒”也可译作“一伙背叛的人”或“一群不忠的人”。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי יִתְּנֵנִי
  choice: 但愿我……有
  rationale: 希伯来文直译近似“谁能给我……？”，在这里是表达强烈愿望的惯用语。译作“但愿我……有”自然传达祈愿和哀叹语气。
- source_word: בַמִּדְבָּר
  choice: 在旷野
  rationale: “旷野”既符合 מִדְבָּר 所指的荒僻、未开垦之地，也保留先知文学的庄重语感。
- source_word: מְלוֹן אֹרְחִים
  choice: 一处供旅人住宿的地方
  rationale: מְלוֹן 是过夜或投宿之处，אֹרְחִים 是旅人；此译避免将其现代化为设施完备的“旅馆”，保留简陋临时落脚处的意象。
- source_word: וְאֶעֶזְבָה
  choice: 好让我离开
  rationale: 意愿式在前述愿望之后可表达所期望的结果或目的；“好让我”保留这种意愿和目的色彩。
- source_word: עַמִּי
  choice: 我的人民
  rationale: 直译所有格与群体称谓；“人民”在现代汉语中庄重自然，也保留说话者与该群体之间的关系。
- source_word: וְאֵלְכָה מֵאִתָּם
  choice: 远离他们
  rationale: 原文兼有“去”和“从他们那里离开”的意思；“远离他们”简洁表达空间上的离去和关系上的疏离。
- source_word: כִּי כֻלָּם
  choice: 因为他们全是
  rationale: כִּי 引出愿意离开的理由，כֻלָּם 强调无一例外；“全是”保留其强烈的总体指控。
- source_word: מְנָאֲפִים
  choice: 行奸淫的人
  rationale: 保留 נאף 的具体词义，不将其直接改译为抽象的“不忠”；同时汉语表达仍容许先知语境中的盟约不忠意涵。
- source_word: עֲצֶרֶת
  choice: 一群
  rationale: 此处是集合名词，与“背信之徒”构成同位关系。“一群”符合现代汉语，并保留被指控者结成群体的含义。
- source_word: בֹּגְדִים
  choice: 背信之徒
  rationale: בגד 表示以诡诈或不忠的方式背叛。“背信之徒”兼具背叛与不忠之义，且符合庄重的谴责语体。
theological_decisions:
- issue: מְנָאֲפִים 是仅指实际奸淫，还是也暗示对盟约不忠
  choice: 正文译作“行奸淫的人”，保留具体指控，并以脚注说明其先知性延伸含义。
  alternative: 直接译作“不忠的人”或“对上帝不忠的人”。
  rationale: 先知书中的奸淫语言可能同时涉及实际淫乱和对盟约的背叛。若只译成抽象的“不忠”，会消除原词的具体性和刻意保留的双重张力。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“但愿”传达哀叹式愿望；“供旅人住宿的地方”避免把古代简陋落脚处误解为现代旅馆；末句保持强烈的先知性谴责，并通过脚注保留“奸淫”在具体行为与盟约不忠之间的语义张力。
