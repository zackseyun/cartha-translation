  text: וְ/נָתַתִּ֧י אֶת יְרוּשָׁלִַ֛ם לְ/גַלִּ֖ים מְע֣וֹן תַּנִּ֑ים וְ/אֶת עָרֵ֧י יְהוּדָ֛ה אֶתֵּ֥ן שְׁמָמָ֖ה מִ/בְּלִ֖י יוֹשֵֽׁב־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/009/010.yaml
  text: And I will make Jerusalem a heap of ruins[a], a haunt of jackals; and I will make the cities of Judah a desolation[c][b], without inhabitant.
translation:
  language: zh_hans
  text: 我要使耶路撒冷成为一堆堆废墟[a]，作豺狼的栖身之处[b]；我要使犹大的城邑一片荒凉，无人居住[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“废墟堆”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文为 tannim；传统上也译作“龙”，但在此处荒凉的语境中，很可能指“豺狼”。
    reason: lexical_alternative
  - marker: c
    text: 直译：“没有居住者”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי / אֶתֵּן
  choice: 我要使
  rationale: נתן的基本义是“给、置放”，但这里与结果性补语连用，表达使耶路撒冷和犹大诸城变成废墟、陷入荒凉；译作“使”既自然，也保留上帝施行审判的主动性。
- source_word: לְגַלִּים
  choice: 成为一堆堆废墟
  rationale: גַלִּים为复数，指瓦砾堆或废墟堆；“一堆堆废墟”保留复数意象，并清楚呈现城市毁坏后的景象。
- source_word: מְעוֹן
  choice: 出没的地方
  rationale: 本义为“住处、居所”。在荒城被野兽占据的语境中，“出没的地方”是自然、形象的现代汉语表达，同时不改变其作为栖居之所的含义。
- source_word: תַּנִּים
  choice: 豺狼
  rationale: 该词在先知书的荒凉场景中通常指栖息于废墟的豺狼类动物；“豺狼”比传统的“龙”更符合此处自然景象，但以脚注保留词义史上的其他译法。
- source_word: עָרֵי יְהוּדָה
  choice: 犹大的城邑
  rationale: 忠实呈现希伯来语属格结构；“城邑”具有庄重的先知文学语体，又为现代读者所能理解。
- source_word: שְׁמָמָה
  choice: 一片荒凉
  rationale: 该名词表示荒废、毁坏后的状态；“一片荒凉”符合现代汉语习惯，并保留审判所造成的整体荒芜景象。
- source_word: מִבְּלִי יוֹשֵׁב
  choice: 无人居住
  rationale: 短语意为“没有居住者”；“无人居住”简洁自然，准确表达城邑完全被弃置的结果。
theological_decisions:
- issue: 审判宣告中重复使用נתן所表达的施事性
  choice: 两处均译为“我要使”，明确说话者使耶路撒冷和犹大诸城成为废墟与荒凉之地。
  alternative: 较形式化地译为“我要将……置为”或“我要把……交给”。
  rationale: 原文在结果性补语中使用נתן，重点是说话者造成的结果。“使”准确表达其结果义和审判行动，又不额外说明审判的方式或中间施行者。
- issue: תַּנִּים所指生物的辨识
  choice: 正文译为“豺狼”。
  alternative: 译为“龙”“蛇”或较笼统的“野兽”。
  rationale: 荒城成为野生食腐动物栖息地，是先知文学中常见的荒凉意象；“豺狼”最契合此处语境。由于该词的传统译法和词源辨识存在差异，脚注保留替代可能，不将其神话化。
translation_notes:
  register: 采用现代、庄重而易懂的先知宣告语体。以“一堆堆废墟”“一片荒凉”保留原文鲜明的毁灭景象；分号对应两组平行的审判宣告。所有脚注标记均置于相关词语之后。
