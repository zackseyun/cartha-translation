base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/009/008.yaml
  text: Shall I not punish them for these things? declares Yahweh[a]. Shall my soul not avenge itself on a nation such as this?
translation:
  language: zh_hans
  text: “我岂不因这些事惩罚他们吗？——雅威宣告——我的心[a]岂不向这样的民族报仇吗？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译“我的魂”；也可理解为“我自己”或“我的全人”。
    reason: 说明 נַפְשִׁי 的字面形象及可成立的解释性译法，避免把拟人化表达误解为对神本体构成的定义。
lexical_decisions:
- source_word: הַעַל אֵלֶּה
  choice: 岂不因这些事……吗
  rationale: 疑问词 הַ 与 עַל 构成带因由含义的反问；用“岂不因这些事……吗”既保留“因这些事”的因果关系，也传达预期肯定回答的语气。
- source_word: אֶפְקָד
  choice: 惩罚
  rationale: פקד 可表示察看、追究或惩罚；在本节审判语境中，“惩罚”最清楚地表达其司法性的负面含义。
- source_word: נְאֻם יְהוָה
  choice: 雅威宣告
  rationale: נְאֻם 是庄严的先知宣告套语；“宣告”保留其郑重语气，神名 יְהוָה 音译为“雅威”。
- source_word: אִם ... לֹא
  choice: 岂不……吗
  rationale: 这里 אִם 不是条件词，而是引出与前句平行的反问；“岂不……吗”保留其预期肯定回答的力度。
- source_word: בְּגוֹי אֲשֶׁר כָּזֶה
  choice: 向这样的国民
  rationale: “这样的”保留指示和强调意味；“国民”在现代汉语中可自然指作为整体的民族群体，并适合作“报仇”的对象。
- source_word: תִתְנַקֵּם
  choice: 报仇
  rationale: נקם 的 Hitpael 词形带反身或中动态意味；与“我的心”搭配时，“报仇”能自然表达亲自施行报应的意思。
- source_word: נַפְשִׁי
  choice: 我的心
  rationale: נפש 可指魂、生命、自我或内在之人。“我的心”在现代汉语中保留神以人的情感与意志方式自述的鲜明表达，又比“我的魂”自然；脚注列明较直译及解释性译法。
theological_decisions:
- issue: 审判语境中神以 נַפְשִׁי 自称
  choice: 我的心
  alternative: 我自己
  rationale: 保留原文将神的内在生命拟人化表达的张力与情感力度，不将其直接化约为平直的“我自己”；同时以脚注说明字面形式和可能理解。
- issue: 四字神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 采用接近希伯来神名的现代音译，表明这是神的专名，而不是以“主”这一称号替代。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。两次“岂不……吗”保留原文平行反问及审判语气；“我的心”有意保留原文鲜明而未被消解的拟人化神学张力。
