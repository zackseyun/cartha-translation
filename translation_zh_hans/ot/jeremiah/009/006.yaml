source:
  edition: WLC
  text: לָ/כֵ֗ן כֹּ֤ה אָמַר֙ יְהוָ֣ה צְבָא֔וֹת הִנְ/נִ֥י צוֹרְפָ֖/ם וּ/בְחַנְתִּ֑י/ם כִּֽי אֵ֣יךְ אֶעֱשֶׂ֔ה מִ/פְּנֵ֖י בַּת עַמִּֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/009/006.yaml
  text: 'Therefore[a], thus says Yahweh of hosts: Behold, I am refining them and testing them[b], for how else can I act because of the daughter of my people?'
translation:
  language: zh_hans
  text: '所以，万军之雅威如此说：


    “看哪，我要熬炼他们，试验他们；


    因着我百姓的女儿[a]，我还能怎样做呢？[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “我百姓的女儿”是希伯来语先知性称谓，也可意译为“我的百姓”或“我亲爱的百姓”；这个说法带有亲近和归属的意味。
    reason: lexical_alternative
  - marker: b
    text: “我还能怎样做呢？”也可译作“我怎能另作处置呢？”
    reason: alternative_reading
lexical_decisions:
- source_word: לָכֵן
  choice: 所以
  rationale: 表达由前文罪恶与诡诈所引出的结论，简洁保留推论关系。
- source_word: יְהוָה צְבָאוֹת
  choice: 万军之雅威
  rationale: 以“雅威”音译神的专名，以“万军”保留 צְבָאוֹת 可涵盖天上与地上众军的宽广含义，并符合庄重的先知语体。
- source_word: הִנְנִי
  choice: 看哪，我正在
  rationale: “看哪”保留指示和强调作用；与后面的分词连用时，以“正在”体现眼前展开或确定进行的行动。
- source_word: צוֹרְפָם
  choice: 熬炼他们
  rationale: צרף 本指熔炼、精炼金属；“熬炼”既保留冶金意象，也能自然表达借考验除去杂质的比喻意义。
- source_word: וּבְחַנְתִּים
  choice: 试验他们
  rationale: בחן 表示检验、察验；“试验”与“熬炼”并列自然，同时不将金属检验的背景解释得过满。
- source_word: כִּי אֵיךְ אֶעֱשֶׂה
  choice: 我还能怎样做呢
  rationale: 以反问呈现说话者面对百姓败坏时别无其他处置方式的语气，但不增添有关神受外在限制的解释。
- source_word: מִפְּנֵי
  choice: 因
  rationale: 此处表达缘由或所面对的情势；“因”简洁保留因果关系。
- source_word: בַּת עַמִּי
  choice: 我百姓的女儿
  rationale: 直译先知书中的亲族性集合称谓，保留其亲近、怜爱与群体人格化的张力；脚注说明较自然的理解。
theological_decisions:
- issue: בַּת עַמִּי 的先知性称谓
  choice: 我百姓的女儿
  alternative: 我的百姓；我亲爱的百姓
  rationale: 保留原文将百姓人格化为“女儿”的亲族意象，不把其中的温情、归属关系和审判张力化约成普通群体称呼。
- issue: כִּי אֵיךְ אֶעֱשֶׂה 的反问力度
  choice: 我还能怎样做呢
  alternative: 我怎能另作处置呢；我该怎样做呢
  rationale: “还能”自然传达原文反问中“除此之外还能如何”的意味，同时避免把这句话发展成关于神性能力或必然性的教义陈述。
- issue: הִנְנִי צוֹרְפָם 与 וּבְחַנְתִּים 的时态体貌
  choice: 我正在熬炼他们，试验他们
  alternative: 我要熬炼他们，试验他们
  rationale: הִנְנִי 加分词突出行动正在展开或被鲜明呈现；后接完成式可理解为与前项构成一个确定的复合行动。中文不重复体貌标记，以免行文笨重；脚注提示也可按迫近将来理解。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“所以……如此说”保持先知宣告的正式感；“看哪”保留原文强调语气；“熬炼”延续金属精炼意象。诗行分行体现宣告、行动与反问的结构。
