base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/009/022.yaml
  text: 'Thus says Yahweh: Let not the wise man boast in his wisdom[a], and let not the mighty man boast in his might; let not the rich man boast in his riches.'
translation:
  language: zh_hans
  text: '雅威[a]如此说：


    “智慧人不要因自己的智慧夸口，


    强者不要因自己的力量夸口，


    富足的人不要因自己的财富夸口。”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文为“YHWH”（יהוה），传统常译作“耶和华”或“上主”。
    reason: 说明神名的原文形式及常见传统译法。
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  choice: 雅威如此说
  rationale: 保留先知宣告的固定引言形式，同时采用现代汉语中自然、庄重的语序。
- source_word: אַל יִתְהַלֵּל
  choice: 不要……夸口
  rationale: הלל 的 Hitpael 形式在此表示自夸、自我炫耀；“不要……夸口”清楚传达禁止语气，并适合三句排比。
- source_word: חָכָם בְּחָכְמָתוֹ
  choice: 智慧人……因自己的智慧
  rationale: חָכָם 是单数实体化形容词；“智慧人”保留代表性单数。“因”自然表达 ב 所标示的夸口根据。
- source_word: הַגִּבּוֹר בִּגְבוּרָתוֹ
  choice: 勇士……因自己的勇力
  rationale: גִּבּוֹר 可指强壮、英勇或有能力的人，此处与智慧和财富并列，采用“勇士”而不限定为特定军职；“勇力”保留与词根相关的力量含义。
- source_word: עָשִׁיר בְּעָשְׁרוֹ
  choice: 富足的人……因自己的财富
  rationale: “富足的人”自然表达实体化的单数形容词 עָשִׁיר；“财富”准确对应 עֹשֶׁר，并与智慧、勇力构成清晰排比。
- source_word: יְהוָה
  choice: 雅威
  rationale: 直接音译四字神名，避免以称号代替专名；脚注注明传统译法。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文明确使用四字神名，正文以“雅威”音译，保留其作为盟约之神专名的性质；传统形式另见脚注，不把任何特定宗派解释带入正文。
- issue: 夸口所针对的对象
  choice: 保留“因自己的智慧／勇力／财富夸口”的三重平行结构
  alternative: 解释为不可拥有或运用智慧、力量、财富
  rationale: 原文禁止的是以这些人为优势自夸，并未直接否定这些事物本身；译文不扩展其神学含义。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。三行排比对应原文的智慧人、勇士和富足者，并重复“不要因自己的……夸口”，以保存修辞节奏。
