  text: מִֽי הָ/אִ֤ישׁ הֶֽ/חָכָם֙ וְ/יָבֵ֣ן אֶת זֹ֔את וַ/אֲשֶׁ֨ר דִּבֶּ֧ר פִּֽי יְהוָ֛ה אֵלָ֖י/ו וְ/יַגִּדָ֑/הּ עַל מָה֙ אָבְדָ֣ה הָ/אָ֔רֶץ נִצְּתָ֥ה כַ/מִּדְבָּ֖ר מִ/בְּלִ֖י עֹבֵֽר־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/009/011.yaml
  text: Who is the wise man who can understand this? To whom has the mouth of Yahweh spoken[a], that he may declare it? Why has the land perished, laid waste like the wilderness[c][b], with no one passing through?
translation:
  language: zh_hans
  text: 谁是有智慧、能明白这事的人？雅威的口曾向谁说过话，使他能把这事宣告出来？这地为何毁坏，荒凉如旷野，无人经过？
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִי הָאִישׁ הֶחָכָם
  choice: 谁是有智慧的人
  rationale: 既保留单数“人”和“有智慧”的含义，也采用现代汉语自然表达；汉语“人”本身不标示语法性别，不额外加入原文没有的性别说明。
- source_word: וְיָבֵן אֶת זֹאת
  choice: 能明白这事
  rationale: 未完成式在疑问语境中可带能力或可能性的语气；“能明白”自然传达这一层含义。
- source_word: וַאֲשֶׁר דִּבֶּר פִּי יְהוָה אֵלָיו
  choice: 雅威的口曾向谁说话
  rationale: 保留原文“雅威的口”这一先知性拟人表达，并以“雅威”音译神名。
- source_word: וְיַגִּדָהּ
  choice: 使他能把这事说明
  rationale: 使役词干在这里表示使人知道、讲明；代词后缀承接前文的“这事”。
- source_word: עַל מָה אָבְדָה הָאָרֶץ
  choice: 这地为何毁灭
  rationale: עַל מָה 在此询问原因；אבד 描写土地遭毁坏、归于败亡，“毁灭”保持庄重而不解释毁灭的具体方式。
- source_word: נִצְּתָה כַמִּדְבָּר
  choice: 烧得像旷野
  rationale: נִצְּתָה 可表达被焚烧；“旷野”准确体现 מִדְבָּר，并保留原文鲜明的荒芜图景。
- source_word: מִבְּלִי עֹבֵר
  choice: 无人经过
  rationale: 简洁保留分词“经过者”的含义，表达彻底荒凉、没有行旅往来的景象。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”按较通行的学术重构音译，保留其作为专名的性质。
- issue: 是否保留“雅威的口”这一拟人表达
  choice: 在正文保留
  alternative: 雅威曾向谁说话
  rationale: 直译保留先知话语来自神直接发言的形象和力度；脚注帮助现代读者理解这一希伯来表达。
- issue: “智慧人”的性别表达
  choice: 有智慧的人
  alternative: 有智慧的男人
  rationale: אִישׁ 为阳性单数，但在此询问具备智慧、能解释灾难的人；现代汉语“人”自然保留单数指称而不强加不必要的生理性别限定。
translation_notes:
  register: 采用现代、庄重而清楚的书面汉语。保留“雅威的口”和“旷野”等原文意象，同时用“能明白”“把这事说明”“无人经过”等普通读者易懂的表达。
