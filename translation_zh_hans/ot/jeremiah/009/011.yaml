revisions:
- from: 谁是有智慧的人，能明白这事？雅威的口曾向谁说话[a]，使他能把这事说明？这地为何毁灭，烧得像旷野，无人经过？
  to: 谁是有智慧、能明白这事的人？雅威的口曾向谁说过话，使他能把这事宣告出来？这地为何毁坏，荒凉如旷野，无人经过？
  rationale: 修订避免把土地荒废明确译成焚烧，并将“说明”改为“宣告出来”，以较贴近原文的传达、宣告语气。保留雅威神名及“雅威的口”的先知性拟人表达；脚注仍准确说明该表达。
  reviewer_model: gpt-5.6-terra
