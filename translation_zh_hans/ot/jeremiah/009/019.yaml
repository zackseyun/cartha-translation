  text: כִּֽי שְׁמַ֤עְנָה נָשִׁים֙ דְּבַר יְהוָ֔ה וְ/תִקַּ֥ח אָזְנְ/כֶ֖ם דְּבַר פִּ֑י/ו וְ/לַמֵּ֤דְנָה בְנֽוֹתֵי/כֶם֙ נֶ֔הִי וְ/אִשָּׁ֥ה רְעוּתָ֖/הּ קִינָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/009/019.yaml
  text: For hear the word of Yahweh[a], O women, and let your ear receive the word of his mouth; teach your daughters a lament[c][b], and each woman her neighbor a dirge.
translation:
  language: zh_hans
  text: 因此，妇女们哪，你们要听雅威的话[a]，让你们的耳朵领受他口中的话[b]；要教你们的女儿哀号[c]，每个妇女要把挽歌教给自己的同伴。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “听”也可译作“留心听”；原文是对妇女发出的复数命令。
    reason: lexical_alternative
  - marker: b
    text: “让你们的耳朵领受”是原文的具体说法，意思是专心听取。
    reason: idiom_note
  - marker: c
    text: 本节的“哀号”和“挽歌”对应两个彼此相关而不完全相同的希伯来语词；前者侧重哀号，后者多指正式的哀悼之歌。
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: （不单独译出，以“要”承接劝命语气）
  rationale: 此处可作连接或加强语气的虚词；汉语若直译为“因为”会显得悬空。上下文中的迫切承接由“要”自然表达。
- source_word: שְׁמַעְנָה נָשִׁים
  choice: 妇女们哪，你们要听
  rationale: 保留阴性复数命令和明确的女性称呼；“哪”标示庄重的呼语。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 直接译出四字神名；“耶和华”是现代汉语圣经传统中最通行、最易识别的专名形式。
- source_word: וְתִקַּח אָזְנְכֶם
  choice: 让你们的耳朵领受
  rationale: 保留原文以“耳朵领受”表达专心聆听的具体意象，而不简单重复“听”。
- source_word: דְּבַר פִּיו
  choice: 他口中的言语
  rationale: 保留话语出自他口的具体意象，并采用自然的现代汉语表达。
- source_word: נֶהִי
  choice: 哀哭
  rationale: 该词指哀号或哀哭的表达；与下文较正式的“哀歌”有所区别。
- source_word: וְאִשָּׁה רְעוּתָהּ
  choice: 各人也要教自己的女伴
  rationale: 原文按字面为“一个妇女〔教〕她的同伴”，动词承接前句；译文补出“教”，并用“女伴”保留阴性所指。
- source_word: קִינָה
  choice: 唱哀歌
  rationale: קִינָה通常指正式的哀悼之歌；补入“唱”使汉语搭配自然，并与“哀哭”相区别。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用神的专名；译文不用“主”替代，以保留专名性质。“耶和华”在简体中文普通读者中辨识度最高。
- issue: 对女性群体的特定称呼
  choice: 妇女们／你们的女儿／自己的女伴
  alternative: 众人／儿女／同伴
  rationale: 原文的命令式、称呼和相关名词明确指向女性；译文不将其泛化，以保存经文所描绘的哀悼传承场景。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“妇女们哪”保留先知呼告的语气；整体维持原文的命令结构和平行句式，同时在末句补出汉语所需的动词“教”和“唱”。
