  to: 因此，妇女们哪，你们要听雅威的话[a]，让你们的耳朵领受他口中的话[b]；要教你们的女儿哀号[c]，每个妇女要把挽歌教给自己的同伴。
  rationale: 以“因此”表达כִּי对前文的承接；将神名统一为“雅威”，以对应项目的Yahweh译名决定。“每个妇女”保留אִשָּׁה的性别限定；“把挽歌教给自己的同伴”补足汉语必需的句法关系，却不擅自加入“唱”。“哀号／挽歌”保留原文两种哀悼词语的区别。
