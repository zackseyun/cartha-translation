revisions:
- from: 因为死亡已经从我们的窗户爬进来，闯入我们的宫殿，要从外面剪除孩童[a]，从街市剪除青年人[b]。
  to: 因为死亡已经从我们的窗户爬进来，进入我们的宫殿，要除灭外面的孩童[a]和街市[b]上的青年男子。
  rationale: 将“闯入”收敛为与原文相称的“进入”；重组末句，使“从外面／从街市”在自然中文中明确修饰相应群体，同时保留二者的平行。将脚注 b 移至“街市”后，以使锚点与其所释词语一致。
