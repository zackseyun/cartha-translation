  text: כִּֽי עָ֤לָה מָ֨וֶת֙ בְּ/חַלּוֹנֵ֔י/נוּ בָּ֖א בְּ/אַרְמְנוֹתֵ֑י/נוּ לְ/הַכְרִ֤ית עוֹלָל֙ מִ/ח֔וּץ בַּחוּרִ֖ים מֵ/רְחֹבֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/009/020.yaml
  text: For death has climbed in through our windows[a]; it has entered our palaces, to cut off the child from outside[b], the young men from the streets.
translation:
  language: zh_hans
  text: 因为死亡已经从我们的窗户爬进来，进入我们的宫殿，要除灭外面的孩童[a]和街市[b]上的青年男子。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“婴孩”。希伯来语 עוֹלָל 可指非常年幼的孩子。
    reason: lexical_alternative
  - marker: b
    text: “街市”也可译作“广场”。希伯来语原词可指城中的宽阔街道或公共空地。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文的哀哭呼召，保留原因或解释的语气。
- source_word: עָלָה מָוֶת בְּחַלּוֹנֵינוּ
  choice: 死亡已经从我们的窗户爬进来
  rationale: 保留死亡被人格化为入侵者的鲜明意象；“爬进来”自然表达 עָלָה 与“窗户”结合时向上而入的动作。
- source_word: בָּא בְּאַרְמְנוֹתֵינוּ
  choice: 闯入我们的宫殿
  rationale: בָּא 表示进入；“闯入”突出侵袭性，并与死亡侵入本应安全的宫殿这一意象相称。אַרְמוֹנוֹת 可指宫殿或设防的高大住所，此处译“宫殿”简明而不过度解释。
- source_word: לְהַכְרִית
  choice: 剪除
  rationale: 保留 כרת 使人断绝、消灭的强烈词义，也维持原文庄重而严峻的语体。
- source_word: עוֹלָל
  choice: 孩童
  rationale: 该单数名词可作集合性用法，指年幼的孩子；“孩童”既保留年龄意味，也不把范围限定为婴儿。
- source_word: מִחוּץ
  choice: 从外面
  rationale: 直译其空间意义，并与下一分句的公共街市形成平行。
- source_word: בַּחוּרִים
  choice: 青年人
  rationale: 指青年男子或适龄青年；中文“青年人”在本句中自然，且不额外引入其是否为战士的信息。
- source_word: מֵרְחֹבוֹת
  choice: 从街市
  rationale: רְחֹבוֹת 可指宽阔街道、广场或城市公共空地；“街市”兼顾公共街道与市镇开放空间的含义。
theological_decisions:
- issue: 死亡的人格化
  choice: 保留“死亡爬进来、闯入”的人格化表达
  alternative: 释义为灾祸或杀戮临到
  rationale: 原文直接以“死亡”为行动主体；保留这一修辞可避免把诗性与神学张力消解为单一历史解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“爬进来—闯入”保存原文入侵意象；两个“从……剪除……”形成平行结构，贴近希伯来诗句的节奏。脚注标记置于其实际说明的词语之后。
