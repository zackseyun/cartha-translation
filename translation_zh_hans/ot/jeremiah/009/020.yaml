    rationale: 该动词本义为“来、进入”；死亡已由“爬进来”的前句呈现入侵意象，后句不必另加“闯入”所含的强行侵入意味。
  - severity: medium
    issue: 脚注 b 的锚点未置于所说明的“街市”之后。
    rationale: 脚注内容说明 רְחֹבוֹת，即“街市”；目前标记附在“青年人”后，可能误导读者以为注释说明青年人。
  - severity: low
    issue: “青年人”没有明确表达原文的男性指称。
    rationale: בַּחוּרִים 指青年男子；译为“青年男子”更精确。
