  text: וְ/אִ֤ישׁ בְּ/רֵעֵ֨/הוּ֙ יְהָתֵ֔לּוּ וֶ/אֱמֶ֖ת לֹ֣א יְדַבֵּ֑רוּ לִמְּד֧וּ לְשׁוֹנָ֛/ם דַּבֶּר שֶׁ֖קֶר הַעֲוֵ֥ה נִלְאֽוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/009/004.yaml
  text: And each man deceives his neighbor[a], and they do not speak truth; they have taught their tongue to speak falsehood[b]; they weary themselves committing iniquity.
translation:
  language: zh_hans
  text: 人人都欺骗自己的邻舍[a]，不说真话；他们教自己的舌头说谎；他们在作恶中劳累不堪[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “欺骗自己的邻舍”或译“戏弄自己的邻舍”或“以诡诈待自己的邻舍”。
    reason: lexical_alternative
  - marker: b
    text: 末句也可译为“他们耗尽自己去行恶”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ
  choice: 人人
  rationale: 单数名词在这里具有逐一、普遍的分配意义；“人人”用自然的现代汉语传达这一点，不把所指不必要地限于男性。
- source_word: בְּרֵעֵהוּ
  choice: 邻舍
  rationale: רֵעַ 可指朋友、同伴或社会关系中的他人；“邻舍”保留其社会伦理色彩，也与圣经常用语相协调。
- source_word: יְהָתֵלּוּ
  choice: 欺骗
  rationale: התל 的使役形在本语境中主要指欺哄、误导，与下句“不说真话”形成紧密平行；脚注保留“戏弄”等可能。
- source_word: אֱמֶת
  choice: 真话
  rationale: 这里直接涉及言语真假，因此译作“不说真话”比抽象的“不说真理”更符合现代汉语语境。
- source_word: לִמְּדוּ לְשׁוֹנָם
  choice: 他们教自己的舌头
  rationale: 保留原文把舌头人格化、使之受训练的鲜明意象；完成体也显示说谎已成为养成的习惯。
- source_word: דַּבֶּר שֶׁקֶר
  choice: 说谎
  rationale: 自然、凝练地表达“说虚假之言”，并与前面的“不说真话”形成清楚对照。
- source_word: הַעֲוֵה
  choice: 作恶
  rationale: 该形式表示行事乖谬、作恶；“作恶”保留道德力度，同时比“行不义”更通俗自然。
- source_word: נִלְאוּ
  choice: 作到疲乏
  rationale: 按其与 הַעֲוֵה 的关系理解为他们因持续作恶而疲乏；此译保留原文简练结构及行为与疲乏之间的联系。
theological_decisions:
- issue: 末句 הַעֲוֵה נִלְאוּ 的句法关系
  choice: 作恶作到疲乏
  alternative: 他们疲乏，却仍不肯回转
  rationale: 马所拉文本最直接可理解为他们因作恶而耗尽自己；不引入原文未明说的“回转”，也不把“疲乏”解释成悔改或停止犯罪。
translation_notes:
  register: 采用现代、庄重而易懂的先知性语言。“人人”体现分配性的普遍指控；“教自己的舌头”刻意保留希伯来文的拟人意象。主句简短有力，末句用“作到疲乏”表现持续作恶所付出的劳力。
