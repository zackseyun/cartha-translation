  text: הִנֵּ֛ה יָמִ֥ים בָּאִ֖ים נְאֻם יְהוָ֑ה וּ/פָ֣קַדְתִּ֔י עַל כָּל מ֖וּל בְּ/עָרְלָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/009/024.yaml
  text: Look[a], days are coming, declares Yahweh[b], when I will punish everyone circumcised only in foreskin.
translation:
  language: zh_hans
  text: “看哪，日子将到——这是耶和华的宣告——我要惩罚一切受了割礼却仍带着包皮的人[a][b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“所有受割礼的和未受割礼的人。”这种译法更形式化地保留希伯来文的悖论。
    reason: alternative_reading
  - marker: b
    text: 这句话很可能是指：他们外表有割礼的记号，在更深的圣约意义上却仍未受割礼。参耶利米书4:4及下文。
    reason: cross_reference
lexical_decisions:
- source_word: הִנֵּה
  choice: 看哪
  rationale: 这是引出郑重宣告的提示词；“看哪”保留其强调和指示作用，也符合现代汉语庄重的先知性语体。
- source_word: יָמִים בָּאִים
  choice: 日子将到
  rationale: 保留希伯来文常见的先知宣告公式及其简洁结构。
- source_word: נְאֻם יְהוָה
  choice: 耶和华宣告说
  rationale: נְאֻם 表示郑重的神谕宣告；“宣告说”在中文中既自然，又保留其庄严语气。神名 יְהוָה 按其专名译作“耶和华”。
- source_word: וּפָקַדְתִּי עַל
  choice: 我要惩罚
  rationale: פקד 的含义较广，但在这里与 עַל 连用且处于审判语境，表示追讨、问罪或施行惩罚；“惩罚”清楚表达其司法含义。
- source_word: כָּל מוּל
  choice: 一切受了割礼……的人
  rationale: מוּל 在此作名词性用法，指受过割礼者；“一切……的人”自然传达 כָּל 的范围。
- source_word: בְּעָרְלָה
  choice: 却仍有包皮
  rationale: 该短语与“受了割礼”构成刻意而尖锐的悖论。“仍有包皮”保留 עָרְלָה 的具体意象，同时以“却”显明原文中的张力，而不直接把它解释成“心里未受割礼”。
theological_decisions:
- issue: 如何表达 מוּל בְּעָרְלָה 的悖论
  choice: 受了割礼却仍有包皮的人
  alternative: 受割礼的和未受割礼的所有人
  rationale: 马所拉文本的措辞简短且有意形成矛盾效果。正文保留外在受割礼却仍被视为有包皮的张力，不提前将其完全解释为内心或圣约层面的未受割礼；脚注则交代另一种较形式化的理解。
- issue: 是否在正文中明确说明“内心未受割礼”
  choice: 不在正文中明说，只在脚注提示上下文含义
  alternative: 只在肉身受割礼的人
  rationale: “心里未受割礼”在随后经文中变得明确，但本节本身采用更含混、更具冲击力的表达。保留这一层次可避免把上下文解释直接写入正文。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“看哪”和“宣告说”维持先知神谕的正式语气；破折号标示插入的宣告公式。末句刻意保留原文令人不安的悖论，不用教派性术语加以化解。
