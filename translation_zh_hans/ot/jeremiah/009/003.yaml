base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/009/003.yaml
  text: Each man[a], beware of his neighbor, and do not trust any brother; for every brother surely deceives[c][b], and every neighbor goes about as a slanderer.
translation:
  language: zh_hans
  text: 你们各人都要提防邻舍，不要信赖任何弟兄；因为弟兄个个都诡诈欺人[a]，邻舍个个都四处搬弄是非[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“弟兄个个都极其诡诈”，或“弟兄个个都以诡诈胜过人”。希伯来语以עקב的同根词连用来加强语气；这个词根可表达以诡诈胜过人、取代人的意思。
    reason: lexical_alternative
  - marker: b
    text: “搬弄是非”也可译作“散布流言”或“到处毁谤人”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ מֵרֵעֵהוּ הִשָּׁמֵרוּ
  choice: 你们各人都要提防邻舍
  rationale: אִישׁ在复数命令语境中具有逐一分配的意思，译作“你们各人”自然表达对每个人的警告。מן与הִשָּׁמֵרוּ连用，指出应当防备的对象；רֵעַ在此译作范围较广的“邻舍”。
- source_word: וְעַל כָּל אָח אַל תִּבְטָחוּ
  choice: 不要信赖任何弟兄
  rationale: בָּטַח表示信任、倚靠；否定命令中的כָּל译作“任何”。“弟兄”保留其既可指亲兄弟、也可泛指群体同胞的歧义。
- source_word: כִּי
  choice: 因为
  rationale: 引出前述警告的理由，现代汉语中用“因为”清楚自然。
- source_word: עָקוֹב יַעְקֹב
  choice: 个个都诡诈欺人
  rationale: 同根词并用加强עקב所表达的欺骗、以诡诈胜过他人的动作。“诡诈欺人”既保留行为性，也体现强化语气，避免生硬复制希伯来语词根重复。
- source_word: וְכָל רֵעַ רָכִיל יַהֲלֹךְ
  choice: 邻舍个个都四处搬弄是非
  rationale: רָכִיל指散播流言、毁谤或搬弄口舌的人；הלך在此描述惯常地到处活动。译作“四处搬弄是非”符合现代汉语习惯，并传达持续而有害的社会行为。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“邻舍”比“朋友”范围更广，也与上下两处רֵעַ保持一致；“弟兄”保留原文可能指亲属或群体同胞的双重含义。平行句使用“个个都”再现原文כָּל的全面性和警告力度。
