id: JER.9.9
reference: Jeremiah 9:9
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: עַל הֶ֨/הָרִ֜ים אֶשָּׂ֧א בְכִ֣י וָ/נֶ֗הִי וְ/עַל נְא֤וֹת מִדְבָּר֙ קִינָ֔ה כִּ֤י נִצְּתוּ֙ מִ/בְּלִי אִ֣ישׁ עֹבֵ֔ר וְ/לֹ֥א שָׁמְע֖וּ ק֣וֹל מִקְנֶ֑ה מֵ/ע֤וֹף הַ/שָּׁמַ֨יִם֙ וְ/עַד בְּהֵמָ֔ה נָדְד֖וּ הָלָֽכוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/009/009.yaml
  text: Over the mountains I will lift up weeping and wailing[a], and over the pastures of the wilderness a lament, because they are laid waste so that no man passes through, and they do not hear the sound of livestock. From the birds of the heavens to the beasts, they have fled[c][b]; they are gone.
translation:
  language: zh_hans
  text: '我要为群山放声哭泣哀号，

    为旷野的草场作哀歌；


    因为那里已被烧毁[a]，无人经过，

    也听不见牲畜的叫声。


    从天空的飞鸟到地上的走兽[b]，

    都逃走了，离去了。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“已被毁坏”。希伯来语动词可着重于焚烧，也可泛指由此造成的荒废。
    reason: lexical_alternative
  - marker: b
    text: “走兽”在这里泛指地上的动物，不一定专指野兽。
    reason: lexical_clarification
lexical_decisions:
- source_word: אֶשָּׂא בְכִי וָנֶהִי
  choice: 扬声哭泣哀号
  rationale: נשׂא与“哭泣、哀号”连用，表示发出或唱起哀声；“扬声”保留“举起、发出”的意象，也符合现代汉语哀歌语境。
- source_word: נְאוֹת מִדְבָּר
  choice: 旷野的草场
  rationale: נְאוֹת在这里指牧放牲畜的草场，与下文“牲畜的叫声”相呼应；מִדְבָּר译作“旷野”。
- source_word: קִינָה
  choice: 哀歌
  rationale: 该词指为死亡或灾祸所作的正式哀悼之歌；“哀歌”简明且保留诗歌性质。
- source_word: נִצְּתוּ
  choice: 已被烧毁
  rationale: 这个被动动词通常包含点燃、焚烧的具体意象；上下文同时表明由此造成彻底荒废。
- source_word: מִבְּלִי אִישׁ עֹבֵר
  choice: 无人经过
  rationale: אִישׁ在此泛指任何人；简洁地表达彻底无人往来的景象，不必在汉语中保留阳性形式。
- source_word: וְלֹא שָׁמְעוּ קוֹל מִקְנֶה
  choice: 也听不见牲畜的叫声
  rationale: 希伯来语为第三人称复数“他们没有听见”；因所指对象不明，汉语用无主句保留这种不确定性，并自然表达寂静荒凉。
- source_word: מֵעוֹף הַשָּׁמַיִם וְעַד בְּהֵמָה
  choice: 从天空的飞鸟到地上的走兽
  rationale: “从……到……”保留范围结构；הַשָּׁמַיִם在此自然指天空，בְּהֵמָה泛指地上的动物，“地上的”是为清楚呈现与飞鸟的对照。
- source_word: נָדְדוּ הָלָכוּ
  choice: 都已逃离，远远去了
  rationale: 两个连续动词分别表示离开原处和已经去掉；分作两个短语，保留原文加强消失殆尽之感的重复。
theological_decisions: []
translation_notes:
  register: 采用庄重而易懂的现代标准汉语，并以分行形式呈现哀歌的诗体。保留第一人称的哀悼，也避免为“听不见”的不明确主语强加解释。
