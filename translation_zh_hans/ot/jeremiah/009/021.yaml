base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/009/021.yaml
  text: 'Speak: Thus says Yahweh[a], “The corpse of man will fall like dung on the face of the field, and like a sheaf behind the reaper, with no one to gather it.”'
translation:
  language: zh_hans
  text: 你要说：“雅威如此说：人的尸体[a]必像粪便一样倒在田野地面上，又像收割者身后的一捆禾稼，无人收集。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “人的尸体”也可理解为“人类的尸体”。希伯来语“人”是单数，在这里可以泛指人类。
    reason: 保留הָאָדָם单数形式与泛指用法之间的真实歧义。
lexical_decisions:
- source_word: דַּבֵּר
  choice: 你要说
  rationale: 第二人称阳性单数命令式；汉语用“你要说”既保留命令语气，也自然引出先知宣告。
- source_word: נְאֻם יְהוָה
  choice: 雅威如此宣告
  rationale: 保留先知信息公式的庄严语气，并将四字神名直接音译为“雅威”。
- source_word: וְנָפְלָה נִבְלַת הָאָדָם
  choice: 人的尸体必……倒在
  rationale: נבלה直指尸体；אָדם为单数但可作泛指。“人的尸体”保留单数形式及其代表全人类的可能，נפלה在预告审判的语境中译作将来必然发生。
- source_word: כְדֹמֶן עַל־פְּנֵי הַשָּׂדֶה
  choice: 像粪土倒在田野地面上
  rationale: 保留原文刻意粗粝、贬抑的农耕意象；“田野地面上”自然表达“田野表面”。
- source_word: וּכְעָמִיר מֵאַחֲרֵי הַקֹּצֵר
  choice: 又像收割的人身后遗落的禾捆
  rationale: עמיר在收割语境中指禾捆；“身后遗落”明确其处于收割者后方、被弃置的图景，但不改变比喻焦点。
- source_word: וְאֵין מְאַסֵּף
  choice: 无人收拾
  rationale: 可涵盖无人收集禾捆和无人收殓尸体的双重意象；“收拾”在汉语中可自然承载这种刻意保留的关联。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华／主
  rationale: 原文直接使用四字神名；音译“雅威”保留其专名性质，不以称号替代。
- issue: הָאָדָם 的泛指范围
  choice: 人的尸体
  alternative: 人类的尸体／人的尸首
  rationale: 原文为单数אָדם，但可作类称；正文保留单数表达，不把它明确限定为某一个男人，也不擅自改成复数。
- issue: 审判预告中完成式 וְנָפְלָה 的时间指向
  choice: 必……倒在
  alternative: 已经倒下／将要倒下
  rationale: 在先知审判宣告中，此形式自然表达确定将临之事；“必”兼顾将来指向和宣告的确定性。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“粪土”“尸体”等词保留原文审判图景的尖锐感；句式略带先知宣告的庄严节奏，但避免文言化。
