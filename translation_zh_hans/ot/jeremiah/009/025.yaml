  source_fidelity: 译文准确列出埃及、犹大、以东、亚扪人、摩押及旷野居民，并保留“列国未受割礼”与“以色列全家心未受割礼”的关键对照。开头的“反对／临到”承接上节的审判动词，中文列举式可省略。惟“却”比原文简单并列的 וְ 更强，宜改为中性的并列；同时将关系从句次序调整得更贴近希伯来语。
