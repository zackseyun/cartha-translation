id: JER.9.25
reference: Jeremiah 9:25
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: עַל מִצְרַ֣יִם וְ/עַל יְהוּדָ֗ה וְ/עַל אֱד֞וֹם וְ/עַל בְּנֵ֤י עַמּוֹן֙ וְ/עַל מוֹאָ֔ב וְ/עַל֙ כָּל קְצוּצֵ֣י פֵאָ֔ה הַ/יֹּשְׁבִ֖ים בַּ/מִּדְבָּ֑ר כִּ֤י כָל הַ/גּוֹיִם֙ עֲרֵלִ֔ים וְ/כָל בֵּ֥ית יִשְׂרָאֵ֖ל עַרְלֵי לֵֽב־־־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/009/025.yaml
  text: against Egypt[a], and against Judah, and against Edom, and against the sons of Ammon, and against Moab, and against all those with the corners of their hair cut off, who dwell in the wilderness; for all the nations are uncircumcised, and all the house of Israel are uncircumcised in heart.
translation:
  language: zh_hans
  text: 埃及、犹大、以东、亚扪人、摩押，以及所有剃去鬓角、住在旷野的人[a]；因为列国都未受割礼，以色列全家都是心未受割礼的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“所有把头发边缘剪短的人”。希伯来语可能指旷野民族的一种独特发式。
    reason: 说明“剃去鬓角”所译希伯来语的具体部位和发式样貌尚有不确定性，避免正文对其民族文化背景作过度断定。
lexical_decisions:
- source_word: עַל
  choice: （由上文“惩罚”统摄，不在本节重复译出）
  rationale: 本节开头连续使用介词 עַל，承接上一节的惩罚宣告。中文列举时省去重复介词，既保留句法衔接，也避免擅自增添本节原文没有的动词。
- source_word: בְּנֵי עַמּוֹן
  choice: 亚扪人
  rationale: 字面为“亚扪之子”，在这里是民族称谓；“亚扪人”是现代中文自然、准确的集体表达，并不把所指范围不当地限于男性。
- source_word: כָּל קְצוּצֵי פֵאָה
  choice: 所有……剪去鬓角的人
  rationale: 保留“剪去”和头发边缘部位的具体形象；该短语可能指旷野民族的一种独特发式，但正文不进一步断定其具体样貌。
- source_word: הַיֹּשְׁבִים בַּמִּדְבָּר
  choice: 住在旷野
  rationale: מִדְבָּר 可指荒野、旷野或沙漠地区；“旷野”保留较宽的语义范围，也符合先知书庄重的语体。
- source_word: כִּי
  choice: 因为
  rationale: 引出前述审判对象受到惩罚的理由，现代中文用“因为”关系清楚。
- source_word: כָל הַגּוֹיִם
  choice: 列国
  rationale: 此处指周边各民族或国家；“列国”简洁而符合先知文学语体，不预先套入后来的“犹太人—外邦人”神学分类。
- source_word: עֲרֵלִים
  choice: 未受割礼
  rationale: 直译身体上的未受割礼状态，保留其盟约语境及与下半句内在状态的对照。
- source_word: כָל בֵּית יִשְׂרָאֵל
  choice: 以色列全家
  rationale: 忠实保留“家”这一整体性称谓，在现代中文中也清楚自然。
- source_word: עַרְלֵי לֵב
  choice: 心未受割礼
  rationale: 保留原文以割礼描写内在悖逆的鲜明隐喻，不将其解释性改写为“刚硬”或“属灵上未受割礼”。
theological_decisions:
- issue: 以色列内在状况的割礼隐喻
  choice: 心未受割礼
  alternative: 心里刚硬；在属灵上未受割礼
  rationale: 原文刻意把列国身体上的“未受割礼”与以色列内心的“未受割礼”并置。直译可保留外在盟约记号与内在真实之间的神学张力。
- issue: 列国与以色列之间的关系
  choice: 列国都未受割礼，以色列全家却是心未受割礼
  alternative: 列国和以色列全家都未受割礼
  rationale: “却”显明两种未受割礼状态的对照，但没有否定二者同受审判；这符合希伯来文并列中蕴含的修辞张力。
- issue: בְּנֵי עַמּוֹן 的集体指称
  choice: 亚扪人
  alternative: 亚扪之子
  rationale: 该结构在此是常规民族名称，而不是专门强调男性血统；采用自然的中文族名可避免制造原文并无意强调的性别限制。
translation_notes:
  register: 采用现代、庄重而简洁的先知文学语体。本节在希伯来文中承接上一节的惩罚动词，因此中文保留列举式开头，不擅自补入新动词；人名与国名使用现代中文圣经读者熟悉的标准形式。
