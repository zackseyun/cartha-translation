base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/009/007.yaml
  text: Their tongue is a slaughtering arrow[a]; it speaks deceit. With his mouth each man speaks peace to his neighbor[c][b], but within himself he sets his ambush.
translation:
  language: zh_hans
  text: 他们的舌头是杀人的箭[a]，说的尽是诡诈。各人用口向邻舍说平安的话[b]，心里却设下埋伏[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“致命的箭”，也可能理解为“磨利的箭”。“杀人的”所对应的希伯来词源自“宰杀”，重点在致命的意图，不仅是锋利。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译为“向邻舍说平安”。意思是外表说友好、和善的话，内心却图谋伤害。
    reason: cultural_note
  - marker: c
    text: 也可译“在他里面设下埋伏”或“暗中布下圈套”。希伯来文没有明确说出埋伏所针对的对象。
    reason: lexical_alternative
lexical_decisions:
- source_word: חֵץ שוחט
  choice: 杀人的箭
  rationale: חֵץ指“箭”；שוחט源自“宰杀、屠杀”，在这里突出致命的用途或意图，而不只是箭头锋利。“杀人的箭”既保留暴力意象，也符合现代汉语表达。
- source_word: לשונם
  choice: 他们的舌头
  rationale: 希伯来文用集合性的单数“舌头”指众人的言语器官；中文保留单数说法自然，也维持群体性的指控。
- source_word: מרמה דבר
  choice: 说的尽是诡诈
  rationale: מרמה可指诡诈、欺骗；דבר虽为阳性单数，但语义上承接“舌头／箭”。译文不强行标明代词所指，以自然中文表达其惯常的欺骗性言语。
- source_word: בפיו
  choice: 口里
  rationale: 介词短语表示外在说话的方式或所在，与后面的内在意图形成鲜明对照。
- source_word: שלום
  choice: 和平的话
  rationale: שלום基本义为和平、平安；在“说和平”这一结构中，指友好、和善的话。正文保留“和平”意象，脚注解释其语用含义。
- source_word: את רעהו
  choice: 向邻舍
  rationale: רֵעַ指邻舍、同伴或朋友。“邻舍”保留其社会关系含义，并与圣经常见用语一致。
- source_word: ידבר
  choice: 说
  rationale: 未完成式在此描述反复、惯常的行为，现代汉语用一般陈述即可自然传达。
- source_word: ובקרבו
  choice: 心里
  rationale: 字面为“在他的内部”。“心里”自然表达隐藏于内的意图，并与“口里”构成对应。
- source_word: ישים ארבו
  choice: 设下埋伏
  rationale: שים意为放置、设立；ארב指埋伏或潜伏等候袭击。中文“设下埋伏”准确而自然；不在正文补出希伯来文未明说的袭击对象。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“杀人的箭”保留原文强烈的致命意象；“口里／心里”形成清楚对照。“各人”用于自然呈现原文从复数群体指控转向阳性单数泛指个体的表达。
