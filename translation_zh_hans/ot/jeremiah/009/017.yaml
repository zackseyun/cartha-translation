base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/009/017.yaml
  text: Let them hurry and raise a lament over us[a], so that our eyes may run down with tears and our eyelids flow with water.
translation:
  language: zh_hans
  text: 让她们快快为我们举哀，好叫我们的眼睛流下泪来，我们的眼皮淌下水来[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “水”是诗歌用语，与上句的“泪”平行，指泪水。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּתְמַהֵרְנָה
  choice: 让她们赶快来
  rationale: 这是阴性复数的意愿式表达，承接上下文所召来的哭丧妇女；“让她们赶快来”既保留催促语气，也符合现代汉语表达。
- source_word: וְתִשֶּׂנָה עָלֵינוּ נֶהִי
  choice: 为我们唱起哀歌
  rationale: נשא与נהי连用，意为发起或扬起哀声。“唱起哀歌”自然、庄重，并保留开始举哀的动态意味。
- source_word: נֶהִי
  choice: 哀歌
  rationale: 该词可指哀号、哀哭或挽歌；“哀歌”适合诗体和先知书语境，又不过度限定具体仪式。
- source_word: וְתֵרַדְנָה עֵינֵינוּ דִמְעָה
  choice: 使我们的眼睛泪流不止
  rationale: 希伯来文直译近于“让我们的眼睛流下泪来”。此处用汉语常见说法表达泪水向下流淌的形象；“不止”传达持续涌流的语境效果。
- source_word: דִמְעָה
  choice: 泪
  rationale: 原文为单数，但在此作集合意义；汉语用“泪”自然，并与下句的“水”构成诗意平行。
- source_word: וְעַפְעַפֵּינוּ יִזְּלוּ מָיִם
  choice: 眼皮淌出水来
  rationale: 保留原文“眼皮”和“水”的具体意象及流淌动作，不直接在正文中把“水”改释为“泪水”。
- source_word: מָיִם
  choice: 水
  rationale: 原文明确使用“水”，与前句的“泪”形成诗歌平行；正文保留这一措辞，并以脚注说明其所指。
