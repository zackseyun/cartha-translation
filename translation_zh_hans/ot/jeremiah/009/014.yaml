  text: לָ/כֵ֗ן כֹּֽה אָמַ֞ר יְהוָ֤ה צְבָאוֹת֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל הִנְ/נִ֧י מַאֲכִילָ֛/ם אֶת הָ/עָ֥ם הַ/זֶּ֖ה לַֽעֲנָ֑ה וְ/הִשְׁקִיתִ֖י/ם מֵי רֹֽאשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/009/014.yaml
  text: 'Therefore thus says Yahweh of Armies[a], the God of Israel: Behold, I am feeding this people wormwood[b], and I will make them drink poisoned water.'
translation:
  language: zh_hans
  text: 因此，万军之耶和华、以色列的上帝如此说：“看哪，我要使这百姓吃苦艾[a]，也要使他们喝毒水[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “苦艾”是一种味道极苦的植物，在先知书中常用来象征苦难和审判；也可意译为“苦味”。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“毒物之水”，也可能强调极苦或有毒的水；传统上有译作“苦胆水”的。
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: 因此
  rationale: 保留由前文罪责引出审判宣告的因果衔接。
- source_word: יְהוָה צְבָאוֹת
  choice: 万军之耶和华
  rationale: 以中文圣经语体中清楚而庄重的形式保留上帝的专名“耶和华”，并将 צְבָאוֹת 的复数集合含义译为“万军”。
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: 以色列的上帝
  rationale: 直接表达原文的属格结构及耶和华与以色列的关系。
- source_word: הִנְנִי מַאֲכִילָם
  choice: 看哪，我要使……吃
  rationale: “看哪”保留 הִנְנִי 的强调和提示作用；“我要使……吃”兼顾分词所表达的迫近、确定行动与使役语态。
- source_word: הָעָם הַזֶּה
  choice: 这百姓
  rationale: 保留指示词及先知审判话语中对盟约群体的称呼。
- source_word: לַעֲנָה
  choice: 苦艾
  rationale: 保留原文所指苦味植物的具体意象，不在正文中抽象化为“苦楚”。
- source_word: וְהִשְׁקִיתִים
  choice: 也要使他们喝
  rationale: 准确表达 Hiphil 使役义，同时符合现代汉语表达。
- source_word: מֵי רֹאשׁ
  choice: 毒水
  rationale: רֹאשׁ 在此搭配中指有毒或极苦之物；“毒水”简洁保留审判意象，而不误解为通常意义的“头”。
theological_decisions:
- issue: 神名与称号 יְהוָה צְבָאוֹת 的译法
  choice: 万军之耶和华
  alternative: 万军之主
  rationale: 原文明确使用四字神名，故保留“耶和华”，而不以称号“主”取代；“万军”则保留 צְבָאוֹת 的具体集合性含义。
- issue: 审判行动的时态与确定性
  choice: 我要使……也要使……
  alternative: 我正在使……并将使……
  rationale: הִנְנִי 加分词可表示正在展开或迫近而确定的行动。中文用“看哪，我要……”既保留强调，也避免武断限定为已经开始，随后与完成式连用亦自然。
translation_notes:
  register: 采用现代、庄重而易懂的先知宣告语体。“如此说”和“看哪”保留原文宣告公式的力度；其余句法按自然现代汉语调整。
