id: JER.9.2
reference: Jeremiah 9:2
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַֽ/יַּדְרְכ֤וּ אֶת לְשׁוֹנָ/ם֙ קַשְׁתָּ֣/ם שֶׁ֔קֶר וְ/לֹ֥א לֶ/אֱמוּנָ֖ה גָּבְר֣וּ בָ/אָ֑רֶץ כִּי֩ מֵ/רָעָ֨ה אֶל רָעָ֧ה יָצָ֛אוּ וְ/אֹתִ֥/י לֹֽא יָדָ֖עוּ נְאֻם יְהוָֽה־־׀־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/009/002.yaml
  text: They bend their tongue[a] like their bow for falsehood, and not for faithfulness have they grown strong in the land; for from evil to evil they go out, and they do not know me[b], declares Yahweh.
translation:
  language: zh_hans
  text: 他们弯起舌头，如同弯弓，为要说谎；他们在这地得势，却不是凭忠信。他们从恶走向恶[a]，也不认识我[b]。这是雅威的宣告。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“从一件恶事走向另一件恶事”。
    reason: lexical_alternative
  - marker: b
    text: “认识我”也可包含在关系和盟约中承认雅威的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּדְרְכוּ
  choice: 弯起
  rationale: דרך用于弓的语境时指把弓拉开或弯起；这里以舌头为武器，译作“弯起”既保留弓箭意象，也符合现代汉语。
- source_word: לְשׁוֹנָם
  choice: 舌头
  rationale: 原文为带复数人称后缀的单数名词，具有集合意义；汉语用单数“舌头”自然，也保留原文的集体性表达。
- source_word: קַשְׁתָּם
  choice: 如同拉弓
  rationale: 原文结构简练，可理解为把“舌头”与“弓”并置。汉语明确为比喻，以“如同拉弓”呈现预备攻击的武器意象，避免生硬直译。
- source_word: שֶׁקֶר
  choice: 弄虚作假
  rationale: שֶׁקֶר涵盖虚假、谎言和欺骗；“弄虚作假”在此能自然表达以言语行骗的伦理含义。
- source_word: לֶאֱמוּנָה
  choice: 凭忠信
  rationale: אֱמוּנָה可指坚定、可靠、忠诚；“忠信”保留其伦理及关系层面的丰富含义，并与“弄虚作假”形成对照。
- source_word: גָּבְרוּ
  choice: 得势
  rationale: גבר表示强盛、占优势或得胜；“得势”自然表达他们在社会中势力增强、占据优势的含义，也保留其反讽色彩。
- source_word: בָאָרֶץ
  choice: 在这地
  rationale: 上下文所指是犹大的土地与社会，而非全世界；“这地”能自然体现这一特定语境。
- source_word: מֵרָעָה אֶל־רָעָה
  choice: 从恶走向恶
  rationale: 尽量保留原文简洁而递进的重复形式，表达不断陷入或推进于邪恶之中；更明确的惯用表达列入脚注。
- source_word: יָצָאוּ
  choice: 走向
  rationale: יצא本义为出去，在此与“从……到……”连用，表示进程或转移；“走向”符合现代汉语，同时保留动态意象。
- source_word: יָדָעוּ
  choice: 认识
  rationale: ידע既可指知道，也可指关系性的认识和承认；“认识”保留宽广含义，不把经文缩减为纯认知或单一的盟约术语。
- source_word: נְאֻם יְהוָה
  choice: 这是雅威的宣告
  rationale: נְאֻם是庄严的先知宣告公式；此译法保留其权威性，并以自然现代汉语呈现。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语音译四字神名，保留其作为以色列之神专名的性质，不以称号取代。
theological_decisions:
- issue: “认识我”的关系及盟约含义
  choice: 也不认识我
  alternative: 也不承认我
  rationale: ידע在此不只涉及头脑中的知识，也可能包括关系上的认识、承认和忠于雅威。正文采用较宽的“认识”，脚注说明其关系和盟约层面的含义，以免把经文的张力限制为单一解释。
- issue: אֱמוּנָה的伦理与关系含义
  choice: 忠信
  alternative: 诚实／真理
  rationale: 此词与שֶׁקֶר形成对照，但其意义不只是言语真实，也包含可靠和忠诚；“忠信”较能保留这种宽度。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。保留舌头如弓、从恶走向恶等鲜明意象；在原文极度简练而汉语需要补足关系之处，使用“如同”和“为要”作最低限度的明示。神名译作“雅威”，先知公式译作“这是雅威的宣告”。
