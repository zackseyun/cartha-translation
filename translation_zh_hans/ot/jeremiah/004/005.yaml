source:
  edition: WLC
  text: הַגִּ֣ידוּ בִֽ/יהוּדָ֗ה וּ/בִ/ירוּשָׁלִַ֨ם֙ הַשְׁמִ֔יעוּ וְ/אִמְר֕וּ ו/תקעו שׁוֹפָ֖ר בָּ/אָ֑רֶץ קִרְא֤וּ מַלְאוּ֙ וְ/אִמְר֔וּ הֵאָסְפ֥וּ וְ/נָב֖וֹאָה אֶל עָרֵ֥י הַ/מִּבְצָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/004/005.yaml
  text: 'Declare it in Judah[a], and proclaim it in Jerusalem, and say: Blow the trumpet in the land. Cry aloud, fill the air, and say: Gather yourselves[d][c][b], and let us go into the fortified cities.'
translation:
  language: zh_hans
  text: '你们要在犹大宣告，在耶路撒冷传扬，说：


    “要在这地吹响号角[a]！”


    你们要放声呼喊[b]，说：


    “集合起来！让我们进坚固的城邑去[c]！”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “号角”指羊角号一类用于召集或报警的吹奏器具。
    reason: cultural_note
  - marker: b
    text: “放声呼喊”所对应的希伯来文十分简略，直译近似“呼喊，充满”；“充满”的宾语没有明说，也可理解为“尽力呼喊”或“让警报声充满各处”。
    reason: lexical_alternative
  - marker: c
    text: “进坚固的城邑去”也可译作“到坚固的城邑去”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַגִּידוּ
  choice: 宣告
  rationale: 该词是 נגד 的使役式复数命令，指公开发布消息；“宣告”既体现公开性，也符合警报语境。希伯来文没有明说宾语，因此中文不补“这事”。
- source_word: הַשְׁמִיעוּ
  choice: 传扬
  rationale: 该词字面为“使人听见”，在公开警告的语境中译作“传扬”自然，并与前面的“宣告”构成平行。
- source_word: וְתִקְעוּ שׁוֹפָר
  choice: 吹响号角
  rationale: שׁוֹפָר 指用作召集或报警信号的角；“吹响号角”比现代乐器意义上的“吹小号”更贴近其文化背景。
- source_word: בָּאָרֶץ
  choice: 在这地
  rationale: 介词 בּ 表示范围或地点，אָרֶץ 在此指犹大之地；“在这地”保留原文简洁而宽泛的地域表达。
- source_word: קִרְאוּ מַלְאוּ
  choice: 放声呼喊
  rationale: קִרְאוּ 是“呼喊”的命令式；其后的 מַלְאוּ 字面为“充满”，但宾语省略，似用于加强呼喊的声势。“放声呼喊”以自然中文表达两词合成的急迫命令，同时不武断补出“空气”或“全地”为宾语。
- source_word: הֵאָסְפוּ
  choice: 集合起来
  rationale: 这是 אסף 的尼法勒式命令，在此是召集众人聚拢；“集合起来”准确传达其号召语气。
- source_word: וְנָבוֹאָה
  choice: 我们进……去
  rationale: בוא 的第一人称复数意愿式带有共同劝勉的语气；“我们……去”在直接引语中自然表达“让我们去”的意思。
- source_word: אֶל עָרֵי הַמִּבְצָר
  choice: 进坚固城去
  rationale: 该短语指前往有防御工事的城邑寻求庇护。“坚固城”简洁自然；“进……去”体现进入其中的语境含义，但介词本身也可只表示“到、往”。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而清楚的警报式语言。用短句和直接引语保留原文连续命令的急迫节奏；避免补出希伯来文未明说的宾语，也不把含混的 מַלְאוּ 单一解释为“充满空气”。
