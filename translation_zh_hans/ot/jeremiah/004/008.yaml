source:
  edition: WLC
  text: עַל זֹ֛את חִגְר֥וּ שַׂקִּ֖ים סִפְד֣וּ וְ/הֵילִ֑ילוּ כִּ֥י לֹא שָׁ֛ב חֲר֥וֹן אַף יְהֹוָ֖ה מִמֶּֽ/נּוּ־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/004/008.yaml
  text: Because of this[a], put on sackcloth; mourn and wail[b], for the burning anger of Yahweh has not turned away from us.
translation:
  language: zh_hans
  text: 为这事，要腰束麻衣[a]，悲哀号哭；因为雅威炽烈的怒气还没有离开我们[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“披上麻衣。”
    reason: lexical_alternative
  - marker: b
    text: 或译：“雅威的烈怒尚未离开我们。”
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל זֹאת
  choice: 因此
  rationale: 该短语指出下列命令的缘由或场合；“因此”在现代汉语中简洁自然，并保留因果衔接。
- source_word: חִגְרוּ שַׂקִּים
  choice: 束上麻布
  rationale: חגר本指束上、系上；与שַׂקִּים连用，描写人以粗麻布为哀服。“束上麻布”保留具体动作及哀悼意象。
- source_word: סִפְדוּ וְהֵילִילוּ
  choice: 哀哭号啕
  rationale: ספד表示举哀、哀哭，ילל表示因悲痛或灾难而高声哭号；并列译法既保留两个动词，也呈现后者声音强烈的特点。
- source_word: כִּי
  choice: 因为
  rationale: 此处引出前述命令的根据，用“因为”清楚表达解释性的因果关系。
- source_word: לֹא שָׁב
  choice: 还没有……转去
  rationale: שׁוב的基本意象是转回、转离；此译保留原文隐喻，并以“还没有”表达完成式在当前处境中的持续结果。
- source_word: חֲרוֹן אַף
  choice: 怒火
  rationale: 该惯用语表达炽烈的愤怒；“怒火”自然凝练，并保留原文以热度描写愤怒的意象。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以通行的现代汉语音译呈现四字神名，而不以称号代替专名。
- source_word: מִמֶּנּוּ
  choice: 从我们身上
  rationale: 后缀为第一人称复数，先知把自己与受审判的群体包括在内；“从我们身上”明确保留这一指向。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”较贴近学界通常采用的拟音，同时明确将其作为专名呈现。
- issue: 雅威之怒是否已经止息
  choice: 还没有从我们身上转去
  alternative: 尚未向我们息怒
  rationale: 选择保留שׁוב“转去”的空间隐喻，不把经文进一步解释为情绪平息；同时保留神的烈怒仍临到群体的严肃张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“束上麻布”刻意保留古代哀悼行为的具体形象；“哀哭号啕”呈现两个连续命令及声音强度；全句以分号区分命令与其理由。
