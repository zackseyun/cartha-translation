  text: וְ/נִשְׁבַּ֨עְתָּ֙ חַי יְהוָ֔ה בֶּ/אֱמֶ֖ת בְּ/מִשְׁפָּ֣ט וּ/בִ/צְדָקָ֑ה וְ/הִתְבָּ֥רְכוּ ב֛/וֹ גּוֹיִ֖ם וּ/ב֥/וֹ יִתְהַלָּֽלוּ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/004/002.yaml
  text: and if you swear[a], ‘As Yahweh lives,’ in truth, in justice, and in righteousness, then nations will bless themselves in him[c][b], and in him they will boast.
translation:
  language: zh_hans
  text: 并且，你若本着真实、公正和公义起誓说：“雅威是永活的！”[a] 列国就必以他为自己求福[b][c]，也必以他夸耀。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “雅威是永活的”是希伯来语的起誓套语，相当于指着永活的雅威起誓。
    reason: cultural_note
  - marker: b
    text: “为自己求福”或译“得福”。这里的希伯来语动词可理解为反身意义，也可能带有被动意义。
    reason: lexical_alternative
  - marker: c
    text: “他”在上下文中的所指并不明确，可能指复兴后的以色列或犹大；也有人理解为雅威。
    reason: alternative_reading
lexical_decisions:
- source_word: וְנִשְׁבַּעְתָּ
  choice: 并且，你若……起誓说
  rationale: 该形式在上文呼召回转所展开的条件结构中承接前句；用“若”表达其条件意味，以“并且”保留句首连接词的承接作用。
- source_word: חַי יְהוָה
  choice: “雅威永活！”
  rationale: 这是希伯来语的固定起誓用语。正文保留其陈述形式，并由“起誓说”清楚标明其功能；神名 יְהוָה 音译为“雅威”。
- source_word: בֶּאֱמֶת בְּמִשְׁפָּט וּבִצְדָקָה
  choice: 本着真实、公正和公义
  rationale: 三个并列介词短语描述起誓应具备的品格与准则。“真实”强调诚实可靠，“公正”对应审断与正当秩序，“公义”则保留 צְדָקָה 的道德正直意味。
- source_word: וְהִתְבָּרְכוּ
  choice: 就必……为自己求福
  rationale: Hitpael 形式在此最自然地理解为反身意义，即列国以某位对象为依据或范式，为自己求取祝福；脚注保留被动式理解的可能。
- source_word: בּוֹ
  choice: 以他
  rationale: 介词 בְּ 在求福和夸耀的惯用表达中可表示所凭借、所关联或所指向的对象。译作“以他”在现代汉语中较自然，同时保留阳性单数代词而不擅自确定所指。
- source_word: גּוֹיִם
  choice: 列国
  rationale: 该词在先知书语境中泛指以色列之外或世界上的各国；“列国”兼具清楚、庄重和经文体裁所需的凝练。
- source_word: יִתְהַלָּלוּ
  choice: 夸耀
  rationale: הלל 的 Hitpael 在此表示以某对象为荣耀或夸口的根据。“夸耀”既保留其语义，也比单纯译作“赞美”更准确。
theological_decisions:
- issue: 两处“以他”中代词的所指
  choice: 正文保留阳性单数代词“他”，不明确补出所指。
  alternative: 明确译为“以雅威”或“以复兴后的以色列／犹大”。
  rationale: 希伯来文本只使用阳性单数代词，未在本节中明说先行词。上下文可使人理解为复兴后的以色列／犹大，也有人理解为雅威；正文不消解这一真实的指代含混。
- issue: וְהִתְבָּרְכוּ 的语态意义
  choice: 按 Hitpael 的反身意义译为“为自己求福”。
  alternative: 按被动或近被动意义译为“得福”。
  rationale: 反身理解更直接反映该词形，并与列国以某对象为祝福依据的表达相合；但此类祝福公式也可能带有被动意味，因此在脚注中注明另一译法。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“本着真实、公正和公义”保持希伯来文三项并列的节奏；“以他”在两处分句中重复，以再现原文的平行结构，并保留代词所指的含混。
