  source_fidelity: 译文准确传达了“你的道路和作为”导致灾祸临到自身的因果责备。将 רָעָה 译为“恶”，并以脚注保留“灾祸／灾难”的结果性含义，恰当保存了原文在道德之恶与其招致灾祸之间的词义张力。后两句以“多么苦涩！因为它已经触及你的心”自然表达 כִּי מָר 与 כִּי נָגַע עַד־לִבֵּךְ 的强调、苦痛及深入内在的意象；“已经”也可反映完成式语境。
