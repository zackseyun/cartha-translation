id: JER.4.18
reference: Jeremiah 4:18
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: דַּרְכֵּ/ךְ֙ וּ/מַ֣עֲלָלַ֔יִ/ךְ עָשׂ֥וֹ אֵ֖לֶּה לָ֑/ךְ זֹ֤את רָעָתֵ/ךְ֙ כִּ֣י מָ֔ר כִּ֥י נָגַ֖ע עַד לִבֵּֽ/ךְ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/004/018.yaml
  text: Your way and your deeds have brought these things upon you. This is your evil[a]—how bitter it is! For it has reached your heart.
translation:
  language: zh_hans
  text: 你的道路和你的所作所为，使这一切临到你。这就是你的恶[a]——多么苦涩！因为它已经触及你的心。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“这就是你的灾祸”或“这就是你的灾难”。希伯来语这个词既可指道德上的恶，也可指由此而来的灾祸；正文保留了本段责备人的意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּרְכֵּךְ
  choice: 你的道路
  rationale: 保留“道路”这一希伯来语比喻；与“所作所为”并列时，指犹大的行事方式和生活方向。
- source_word: וּמַעֲלָלַיִךְ
  choice: 和你的所作所为
  rationale: מַעֲלָלִים 指人的行为、作为，在先知语境中常带道德评价；“所作所为”自然且保留责备意味。
- source_word: עָשׂוּ אֵלֶּה לָךְ
  choice: 使这一切临到你
  rationale: 原文直译近似“为你做了这些”；在审判语境中表达行为造成后果，译为“使这一切临到你”符合现代汉语，同时不增添具体灾祸内容。
- source_word: זֹאת רָעָתֵךְ
  choice: 这就是你的恶
  rationale: רָעָה 可指道德上的恶，也可指由此而来的灾祸。正文采用“恶”，保留上下文对犹大罪责的指控，并以脚注呈现“灾祸”的可能性。
- source_word: כִּי מָר
  choice: 多么苦涩
  rationale: כִּי 在此可引出强调或说明；采用感叹式，使汉语自然，并传达 מָר 的强烈感受，同时不把逻辑关系限定为单纯因果。
- source_word: כִּי נָגַע עַד לִבֵּךְ
  choice: 因为它已经触及你的心
  rationale: נגע 可指触及、达到；完成式表示事情已经发生。“触及你的心”保留原文身体隐喻及“深入内在”的张力，不扩释为情绪或良知。
theological_decisions:
- issue: רָעָה 在“זֹאת רָעָתֵךְ”中的含义
  choice: 正文译作“你的恶”
  alternative: 你的灾祸／你的灾难
  rationale: 本节先说犹大自己的道路和行为使这一切临到，因此“恶”能保留其道德罪责；但后面的“苦涩”和“触及你的心”也容许该词指恶所招致的灾祸。正文与脚注共同保存这一词义张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“道路”保留先知文学的核心比喻；“所作所为”避免生硬直译。后半句用感叹号呈现强烈语气，并保留“心”的原文意象。
