  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: ו/אתי שָׁד֜וּד מַֽה תַּעֲשִׂ֗י כִּֽי תִלְבְּשִׁ֨י שָׁנִ֜י כִּי תַעְדִּ֣י עֲדִי זָהָ֗ב כִּֽי תִקְרְעִ֤י בַ/פּוּךְ֙ עֵינַ֔יִ/ךְ לַ/שָּׁ֖וְא תִּתְיַפִּ֑י מָאֲסוּ בָ֥/ךְ עֹגְבִ֖ים נַפְשֵׁ֥/ךְ יְבַקֵּֽשׁוּ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/004/030.yaml
  text: And you[a], devastated one, what will you do? Though you dress in scarlet, though you adorn yourself with ornaments of gold, though you enlarge your eyes with paint, you beautify yourself in vain. Your lovers despise you[b]; they seek your life.
translation:
  language: zh_hans
  text: 你这被毁坏的啊，[a]你要怎么办呢？即使你穿上朱红衣服，即使你佩戴黄金饰物，即使用眼部颜料勾画双眼，[b]你这样打扮也是徒然。你的情人厌弃你；他们要取你的性命。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “被毁坏的”也可译作“被抢掠的”或“被毁灭的”。希伯来语在这里称呼一位阴性单数人物，很可能是拟人化的耶路撒冷或锡安。
    reason: lexical_alternative
  - marker: b
    text: 原文直译近于“用眼部颜料撕开你的眼睛”。这种深色颜料可指科尔粉或锑粉，用来勾画眼睛，使眼睛显得更大。
    reason: cultural_note
lexical_decisions:
- source_word: שָׁדוּד
  choice: 遭毁灭的女子
  rationale: 该词是源自 שׁדד 的阴性单数被动形式，直接称呼一个女性化的人物；上下文很可能把耶路撒冷或锡安拟人化。译作“遭毁灭的女子”既保留受毁坏的状态，也不把意义局限于遭抢掠。
- source_word: מַה תַּעֲשִׂי
  choice: 你要怎么办呢？
  rationale: 第二人称阴性单数未完成式在此构成面临危机的反问；“要怎么办”比单纯的未来动作更自然地传达无计可施的语气。
- source_word: שָׁנִי
  choice: 朱红衣服
  rationale: שָׁנִי 指朱红或猩红的染色材料；结合“穿上”，补出“衣服”使现代汉语自然，而不改变所指。
- source_word: תַעְדִּי עֲדִי זָהָב
  choice: 佩戴黄金饰物
  rationale: 动词表达装饰自己，עֲדִי 指饰物；汉语“佩戴黄金饰物”简洁保留动作和宾语。
- source_word: תִקְרְעִי בַפּוּךְ עֵינַיִךְ
  choice: 用眼影把眼睛画大
  rationale: 字面近于“用 פּוּךְ 撕开/拉开你的眼睛”，在此是以深色眼部化妆品突出、显大双眼的修饰说法；意译可避免让现代读者误解为伤害眼睛。
- source_word: פּוּךְ
  choice: 眼影
  rationale: 指涂在眼周的深色化妆品，常对应眼线粉、科尔粉或锑粉；主文用普通读者易懂的“眼影”，具体文化背景置于脚注。
- source_word: לַשָּׁוְא תִּתְיַפִּי
  choice: 你这样打扮也是徒然
  rationale: לַשָּׁוְא 表示徒劳无效，反身动词 תִּתְיַפִּי 表示使自己美丽；“这样打扮”在汉语中自然承接前列的衣饰和眼妆。
- source_word: מָאֲסוּ בָךְ עֹגְבִים
  choice: 你的情人厌弃你
  rationale: עֹגְבִים 是情欲或不正当关系语境中的爱慕者、情人；“情人”保留先知文学中的关系隐喻，“厌弃”准确表达 מָאַס。
- source_word: נַפְשֵׁךְ יְבַקֵּשׁוּ
  choice: 他们要取你的性命
  rationale: “寻求某人的 נֶפֶשׁ”在此意为企图夺取其生命；译成“要取你的性命”清楚表达希伯来语习语的实际含义。
theological_decisions:
- issue: 以第二人称阴性单数将耶路撒冷或锡安拟人化为女子
  choice: 用“遭毁灭的女子”保留阴性称呼，但不在主文补入“耶路撒冷”或“锡安”
  alternative: 在主文明确译作“耶路撒冷啊”或“锡安女子啊”
  rationale: 希伯来语明确使用阴性单数称呼，却未在本节明说该人物的名称。保留女子形象可呈现拟人手法；不补出专名则避免把上下文推断写进正文。
- issue: “情人”的先知性隐喻
  choice: 保留“情人”，不明确解释为政治盟友或偶像
  alternative: 译作“盟友”或“与你行淫的人”
  rationale: 原词带有情欲和不正当爱恋色彩，但具体所指可能涉及外邦盟友及其相关的不忠。保留隐喻可避免过早消解其多层含义。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“朱红衣服”“黄金饰物”“眼影”构成自然的修饰场景；“你要怎么办呢”传达反问和危机感。正文保留女子与情人的拟人隐喻，不擅自将其具体化为某一政治或宗教解释。
