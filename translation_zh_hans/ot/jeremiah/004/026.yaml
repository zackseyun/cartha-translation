  text: רָאִ֕יתִי וְ/הִנֵּ֥ה הַ/כַּרְמֶ֖ל הַ/מִּדְבָּ֑ר וְ/כָל עָרָ֗י/ו נִתְּצוּ֙ מִ/פְּנֵ֣י יְהוָ֔ה מִ/פְּנֵ֖י חֲר֥וֹן אַפּֽ/וֹ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/004/026.yaml
  text: I looked[a], and behold, the fruitful land was a wilderness, and all its cities were torn down before Yahweh[b], before his fierce anger.
translation:
  language: zh_hans
  text: 我观看，只见肥沃之地成了旷野[a]；那地所有的城邑都因雅威、因他的烈怒而被拆毁了[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “肥沃之地”所译的希伯来语是“迦密”（Carmel）；这里很可能泛指肥沃或耕种之地，但也可理解为迦密地区。
    reason: lexical_alternative
  - marker: b
    text: 希伯来原文两次使用字面可指“从／在……面前”的短语。也可译为“在雅威面前、在他的烈怒面前”；在审判语境中，该短语也可表达“因／由于”的意思。
    reason: alternative_reading
lexical_decisions:
- source_word: רָאִיתִי
  choice: 我观看
  rationale: ראה在先知异象叙述中可指“看见”或“观看”。此处采用“我观看”，与上下文反复出现的异象观察句式相配，也保留第一人称视角。
- source_word: וְהִנֵּה
  choice: 看哪
  rationale: הִנֵּה用于突然引导读者注意先知眼前的景象；“看哪”保留其鲜明、突兀的提示作用，并符合庄重的现代汉语。
- source_word: הַכַּרְמֶל
  choice: 肥沃之地
  rationale: כַּרְמֶל既可作地名“迦密”，也可泛指肥沃、经过耕种的土地。这里与“旷野”构成对照，普通名词义更符合语境；脚注保留地名理解的可能。
- source_word: הַמִּדְבָּר
  choice: 旷野
  rationale: מִדְבָּר通常指荒凉、无人耕作之地，不必然是沙漠。“旷野”既准确，也与“肥沃之地”形成清楚对照。
- source_word: וְכָל עָרָיו
  choice: 那里的一切城邑
  rationale: 第三人称阳性单数后缀最自然地回指前述土地或地区。汉语用“那里”避免把无生命地区拟人化，并清楚表达地域关系。
- source_word: נִתְּצוּ
  choice: 被拆毁了
  rationale: נתץ的尼法勒式表示建筑或城邑遭拆除、摧毁。“被拆毁”保留被动意义及城邑倾覆的具体画面。
- source_word: מִפְּנֵי יְהוָה
  choice: 在雅威面前
  rationale: מִפְּנֵי字面与“面前”有关，在审判语境中也可表示原因。正文保留空间性和临在感，脚注说明因果性译法。
- source_word: יְהוָה
  choice: 雅威
  rationale: 这是神的专名四字神名YHWH；采用现代汉语音译“雅威”，不以称号代替专名。
- source_word: מִפְּנֵי חֲרוֹן אַפּוֹ
  choice: 在他的烈怒面前
  rationale: חֲרוֹן אַף是表达炽烈愤怒的惯用语。正文保留מִפְּנֵי的重复，以呈现原文的平行和加强语气；“烈怒”自然表达其强度。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名。译作“雅威”保留专名性质，不以“上主”等称号替换；“耶和华”是传统形式，但较不符合该名称通常所重建的读音。
- issue: מִפְּנֵי所表达的临在与因果关系
  choice: 正文译作“在……面前”，并在脚注保留“因为……”的理解
  alternative: 因为雅威，因为他的烈怒
  rationale: 希伯来语重复“从／在……面前”的表达，既可描绘城邑在雅威临到时倾覆，也可指出毁灭的原因。正文不把这一张力单一化，脚注提供自然的因果性读法。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“看哪”保留先知异象的突现感；“城邑”比“城市”略显庄重，也适合古代设防聚落。正文有意保留末句介词结构的重复，以反映原文节奏及临在／原因之间的语义张力。
