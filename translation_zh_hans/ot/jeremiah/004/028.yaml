id: JER.4.28
reference: Jeremiah 4:28
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: עַל זֹאת֙ תֶּאֱבַ֣ל הָ/אָ֔רֶץ וְ/קָדְר֥וּ הַ/שָּׁמַ֖יִם מִ/מָּ֑עַל עַ֤ל כִּי דִבַּ֨רְתִּי֙ זַמֹּ֔תִי וְ/לֹ֥א נִחַ֖מְתִּי וְ/לֹא אָשׁ֥וּב מִמֶּֽ/נָּה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/004/028.yaml
  text: Because of this the earth will mourn[a], and the heavens above will grow dark, because I have spoken, I have purposed, and I have not relented[c][b], nor will I turn back from it.
translation:
  language: zh_hans
  text: 为此，大地要哀恸[a]，天上的诸天要昏暗；因为我已经说了，已经定意[b]，不曾改变心意[c]，也不从此回转。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “大地”也可译作“这地”。希伯来语אֶרֶץ可指大地，也可指一片土地；这里与“天上的诸天”平行，故正文译作“大地”。
    reason: lexical_alternative
  - marker: b
    text: “定意”也可译作“计划”或“决意”。
    reason: lexical_alternative
  - marker: c
    text: “不曾改变心意”也可译作“没有回心”或“不收回成命”。
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל זֹאת
  choice: 因此
  rationale: 该短语承接上文所述的审判，表达原因及其结果；“因此”在现代汉语中自然凝练。
- source_word: תֶּאֱבַל
  choice: 要哀恸
  rationale: אבל在此表示哀悼、悲哀；“哀恸”既保留大地拟人化的诗意，也符合庄重语体。
- source_word: הָאָרֶץ
  choice: 大地
  rationale: אֶרֶץ既可指“地、土地”，也可指“大地”；因与“上面的诸天”平行，此处采用范围较广的“大地”，同时以脚注保留“这地”的可能。
- source_word: וְקָדְרוּ
  choice: 要昏暗
  rationale: קדר在此描写天空变得黑暗阴沉；“昏暗”简洁地呈现宇宙性的黯淡景象。
- source_word: הַשָּׁמַיִם מִמָּעַל
  choice: 上面的诸天
  rationale: 保留שׁמים的复数诗性表达和ממעל的空间含义，比日常化的“天空”更贴近原文庄重语域。
- source_word: עַל כִּי
  choice: 因为
  rationale: 此组合引出大地哀恸、诸天昏暗的原因。
- source_word: דִבַּרְתִּי
  choice: 我已经说了
  rationale: 直译神已发出的宣告，并保留其郑重和确定性。
- source_word: זַמֹּתִי
  choice: 我已经定意
  rationale: זמם在此表示经过考虑而形成的意图或决断；“定意”兼具计划与决心的含义。
- source_word: וְלֹא נִחַמְתִּי
  choice: 我没有回心
  rationale: נחם在此指不因所宣告的审判而改变意向或收回决定；“没有回心”保留其转意、不再施行的语义，又不暗示道德过错。
- source_word: וְלֹא אָשׁוּב מִמֶּנָּה
  choice: 也不会从这事上回转
  rationale: 保留שׁוב的“回转”隐喻；阴性代词所指可理解为已说出并定下的事或审判，译作“这事”避免过度限定。
theological_decisions:
- issue: 神的נחם如何表达
  choice: 我没有回心
  alternative: 我没有改变心意／我没有后悔／我不收回成命
  rationale: 上下文强调神不撤回已经宣告并定意的审判，而不是承认道德错误；“没有回心”既避免误导，也保留原词有关心意转变的张力。
- issue: הָאָרֶץ的范围
  choice: 大地
  alternative: 这地／土地
  rationale: 上下文直接关乎犹大，但该词与“上面的诸天”形成平行，带出宇宙性的诗歌图景；正文取“大地”，脚注保留地域性理解。
- issue: מִמֶּנָּה的指代
  choice: 这事
  alternative: 这定意／这审判
  rationale: 阴性后缀可能概括前述宣告、定意或审判行动；采用较开放的“这事”，不把原文含混之处缩窄为单一先行词。
translation_notes:
  register: 采用现代、庄重而可懂的书面普通话；以“大地—诸天”的对应保留原文诗性平行，并用“哀恸、昏暗、定意、回转”维持先知宣告的凝重语气。所有脚注标记均已置于正文相应词语之后。
