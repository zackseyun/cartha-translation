  text: 我还要看见信号旗、听见号角声到几时呢？[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“旗号”“大旗”，也可泛指“信号”。希伯来语 נֵס 指高举起来的标志，常作军事信号。
    reason: lexical_alternative
  - marker: b
