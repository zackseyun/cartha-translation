    reason: cultural_note
lexical_decisions:
- source_word: עַד מָתַי
  choice: 到几时呢
  rationale: 这是带有哀叹意味的时间疑问；“到几时呢”自然保留了持续忍受和迫切追问的语气。
- source_word: אֶרְאֶה
  choice: 我还要看
  rationale: 未完成式在语境中表示持续经历；“还要看”既体现未止息的状态，也传达说话者不堪继续承受的意味，而不把情态说得过满。
- source_word: נֵס
  choice: 警旗
  rationale: 该词指高举的标志或军用信号；结合号角和战争警报的语境，“警旗”简洁表达可见的警戒信号。
- source_word: אֶשְׁמְעָה
  choice: 听
  rationale: 与前一动词并列，并共同受“还要……到几时”的疑问结构支配；中文无需重复情态成分。
- source_word: קוֹל
  choice: 声
  rationale: 与号角连用时指其发出的声音；“号角声”是自然、准确的现代汉语表达。
- source_word: שׁוֹפָר
  choice: 号角
  rationale: 指用于警报或召集的角号，往往由公羊角制成；“号角”比泛称“号”更具体，也比“喇叭”更符合古代背景。
