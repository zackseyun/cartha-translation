  text: וָ/אֹמַ֞ר אֲהָ֣הּ אֲדֹנָ֣/י יְהוִ֗ה אָכֵן֩ הַשֵּׁ֨א הִשֵּׁ֜אתָ לָ/עָ֤ם הַ/זֶּה֙ וְ/לִ/ירוּשָׁלִַ֣ם לֵ/אמֹ֔ר שָׁל֖וֹם יִהְיֶ֣ה לָ/כֶ֑ם וְ/נָגְעָ֥ה חֶ֖רֶב עַד הַ/נָּֽפֶשׁ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/004/010.yaml
  text: Then I said[a], “Ah, Lord Yahweh, surely you have greatly deceived this people and Jerusalem, saying[b], ‘You will have peace,’ while the sword has reached to the soul.”
translation:
  language: zh_hans
  text: 于是我说：“唉，主耶和华啊，你实在是大大地欺骗了这百姓和耶路撒冷，说：‘你们必享平安。’其实刀剑已经害及性命了[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “害及性命”也可译作“触及生命”或“逼到咽喉”。希伯来语“性命”一词也可指生命、本人或咽喉；这里表示刀剑已经临到致命关头。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲהָהּ
  choice: 唉
  rationale: 表达突然而强烈的悲叹与惊愕，符合现代汉语庄重语体。
- source_word: אֲדֹנָי יְהוִה
  choice: 主耶和华
  rationale: 直接区分并保留复合神名中“主”与四字神名的结构。
- source_word: הַשֵּׁא הִשֵּׁאתָ
  choice: 实在大大欺骗了
  rationale: “欺骗”保留动词的直接意义；“实在大大”传达不定式绝对形与限定动词并用所产生的强调，不将神学张力软化为“任凭受骗”。
- source_word: לָעָם הַזֶּה וְלִירוּשָׁלִַם
  choice: 这百姓和耶路撒冷
  rationale: 保留原文将百姓与人格化的耶路撒冷并列为受事者的表达。
- source_word: שָׁלוֹם יִהְיֶה לָכֶם
  choice: 你们必享平安
  rationale: “平安”涵盖安全、福祉与安稳；“必享”自然表达将来陈述。
- source_word: וְנָגְעָה חֶרֶב
  choice: 其实刀剑已经逼近
  rationale: נגע在此表示触及、临到；“逼近”适合刀剑威胁生命的语境，“其实”凸显与平安宣告的强烈反差。
- source_word: עַד הַנָּפֶשׁ
  choice: 逼近性命
  rationale: נֶפֶשׁ在本语境主要指生命本身，即刀剑已临到致命关头；汉语“性命”比直译“灵魂”更准确自然。
theological_decisions:
- issue: 是否缓和“你欺骗了这百姓”这一对上帝的直接指控
  choice: 保留“你实在大大欺骗了”
  alternative: 你任凭这百姓受骗／你使这百姓大受误导
  rationale: 原文自然表达先知对上帝的直接指控。译文将其作为耶利米的话如实呈现，不替读者消解其中的神学张力。
- issue: “平安”宣告与刀剑临近之间的关系
  choice: 以“其实”表达对照
  alternative: 而／但
  rationale: 连接词在语境中构成强烈反差；“其实”不额外判定宣告来源，同时清楚呈现先知所感受到的矛盾。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“实在大大欺骗了”有意保留原文突兀而强烈的控诉；“性命”则避免“灵魂”在现代汉语中容易引出的狭义宗教含义。脚注标记置于其所解释的句末。
