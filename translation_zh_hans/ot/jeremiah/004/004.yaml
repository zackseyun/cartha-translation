id: JER.4.4
reference: Jeremiah 4:4
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: הִמֹּ֣לוּ לַ/יהֹוָ֗ה וְ/הָסִ֨רוּ֙ עָרְל֣וֹת לְבַבְ/כֶ֔ם אִ֥ישׁ יְהוּדָ֖ה וְ/יֹשְׁבֵ֣י יְרוּשָׁלִָ֑ם פֶּן תֵּצֵ֨א כָ/אֵ֜שׁ חֲמָתִ֗/י וּ/בָעֲרָה֙ וְ/אֵ֣ין מְכַבֶּ֔ה מִ/פְּנֵ֖י רֹ֥עַ מַעַלְלֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/004/004.yaml
  text: Circumcise yourselves to Yahweh[a], and remove the foreskins of your hearts, men of Judah and inhabitants of Jerusalem, lest my wrath go out like fire and burn, with no one to quench it[b], because of the evil of your deeds.
translation:
  language: zh_hans
  text: 犹大人和耶路撒冷的居民啊，你们要自行割礼，归向耶和华[a]；除掉你们心里的包皮，免得我的烈怒如火发出，燃烧起来，无人能扑灭[b]，因你们的恶行。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“你们要向耶和华给自己行割礼”；下句把割礼的意象用于人的内心，呼吁他们从内在归向并忠于神。
    reason: cultural_note
  - marker: b
    text: “我的烈怒如火发出”也可译作“我的怒气如火爆发”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הִמֹּלוּ לַיהוָה
  choice: 为耶和华行割礼
  rationale: 保留 מול 的割礼意象及 ל־ 所表达的归向、奉献方向；中文用“为……行割礼”比机械的“向……受割礼”自然。
- source_word: וְהָסִרוּ עָרְלוֹת לְבַבְכֶם
  choice: 除掉你们心里的包皮
  rationale: 保留原文具体而强烈的身体隐喻；לְבַבְכֶם 为复数领属意义，中文“你们心里的”自然涵盖各人的内心。
- source_word: אִישׁ יְהוּדָה
  choice: 犹大人
  rationale: אִישׁ 在此与复数受话者和后续居民并列，具有集合或分配用法；“犹大人”自然且不把范围不必要地限定为成年男性。
- source_word: וְיֹשְׁבֵי יְרוּשָׁלִָם
  choice: 和耶路撒冷的居民
  rationale: 准确表达作名词用的分词“居住者”，语体庄重而通顺。
- source_word: פֶּן
  choice: 免得
  rationale: 保留警告性的否定后果关系，符合现代中文先知性劝诫语气。
- source_word: תֵּצֵא כָאֵשׁ חֲמָתִי
  choice: 我的烈怒如火发出
  rationale: חֵמָה 译作“烈怒”体现强度，יצא 仍保留“发出”的动态及原文火焰意象。
- source_word: וּבָעֲרָה וְאֵין מְכַבֶּה
  choice: 燃烧起来，无人能扑灭
  rationale: “燃烧起来”承接火的比喻；“无人能扑灭”自然表达不存在灭火者的结构，而不额外指定燃烧对象。
- source_word: מִפְּנֵי רֹעַ מַעַלְלֵיכֶם
  choice: 因为你们所行的事邪恶
  rationale: מִפְּנֵי 在此表原因；将名词结构自然转为中文判断句，同时保留行为及其道德恶性。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 在简体中文普通读者熟悉的圣经语境中采用传统专名“耶和华”，明确呈现专有神名而不以“主”替代；原文读音的具体复原并无绝对定论。
- issue: 割礼与内心的隐喻
  choice: 正文保留“行割礼”和“心里的包皮”
  alternative: 洁净你们的心／除去你们心中的刚硬
  rationale: 原文把盟约的身体记号直接应用于内心，具有刻意的张力和先知性冲击；解释性改写会削弱这一联系。
- issue: אִישׁ יְהוּדָה 的群体所指
  choice: 犹大人
  alternative: 犹大的男子
  rationale: 单数 אִישׁ 在复数命令和群体呼语中具有集合或分配功能；译成“犹大人”既忠于群体指向，也避免无依据地排除女性居民。
translation_notes:
  register: 采用现代、庄重而可朗读的普通话。保留先知话语中割礼与心相连的尖锐隐喻，并以“免得”呈现警告语势。神名用“耶和华”；标点将直接呼语独立出来，以免误读句法。
