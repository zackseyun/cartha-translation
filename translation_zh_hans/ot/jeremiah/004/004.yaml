  source_fidelity: 译文总体准确保留了两重割礼的隐喻、对犹大和耶路撒冷居民的呼告、烈怒如火的警告，以及恶行为审判原因。不过，“为耶和华行割礼”在现代中文中容易理解成替耶和华施行割礼，未清楚表达希伯来文反身式“你们自己受／行割礼”及其归向耶和华的意义。
  naturalness: “犹大人和耶路撒冷的居民啊”置于两句命令之间，使其与前一句“你们”在语篇上略显脱节；将呼语前置更符合中文先知性宣告的节奏。“因为你们所行的事邪恶”不如“因你们的恶行”凝练自然。
  terminology: “耶和华”是中文圣经语境中可接受的专名译法；“割礼”“心里的包皮”恰当保留了原文刻意具体的盟约隐喻，不宜改作“洁净心灵”或“刚硬”。“烈怒”“扑灭”也适合庄重语体。
