revisions:
- from: 你们要为耶和华行割礼[a]，除掉你们心里的包皮。犹大人和耶路撒冷的居民啊，免得我的烈怒如火发出，燃烧起来，无人能扑灭[b]，因为你们所行的事邪恶。
  to: 犹大人和耶路撒冷的居民啊，你们要自行割礼，归向耶和华[a]；除掉你们心里的包皮，免得我的烈怒如火发出，燃烧起来，无人能扑灭[b]，因你们的恶行。
  rationale: 修订以“自行割礼，归向耶和华”明确反身命令及其归向耶和华的方向，同时保留割礼的字面意象和命令的突兀力量。呼语前置以改善中文句法，末句改为“因你们的恶行”以更自然、简洁地表达原文的因果名词结构。脚注a相应澄清直译，脚注锚点均保留。
