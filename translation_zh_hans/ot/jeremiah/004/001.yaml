source:
  edition: WLC
  text: אִם תָּשׁ֨וּב יִשְׂרָאֵ֧ל נְאֻם יְהוָ֛ה אֵלַ֖/י תָּשׁ֑וּב וְ/אִם תָּסִ֧יר שִׁקּוּצֶ֛י/ךָ מִ/פָּנַ֖/י וְ/לֹ֥א תָנֽוּד־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/004/001.yaml
  text: If you return[a], O Israel, declares Yahweh, to me you should return; if you remove your detestable things from before me and do not wander about[c][b],
translation:
  language: zh_hans
  text: “以色列啊，你若回转——这是雅威的宣告——你必归向我；你若从我面前除去你那些可憎之物[b]，就不再漂泊不定[c]。”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文两次使用同一个“回转”动词。也可按劝令语气译为：“以色列啊，你若回转……就当归向我。”
    reason: alternative_reading
  - marker: b
    text: “可憎之物”尤其可指令人厌恶的偶像崇拜物；也可译作“可憎的偶像”或“可憎之事”。
    reason: lexical_alternative
  - marker: c
    text: 或译：“就不再飘摇”或“不要再偏离。”原文动词可表达漂泊、游移或动摇；也可理解为悔改呼召中的劝阻语气。
    reason: lexical_and_syntactic_alternative
lexical_decisions:
- source_word: אִם
  choice: 若
  rationale: 明确保留条件句的语气；现代中文中“若”庄重而不晦涩。
- source_word: תָּשׁוּב（首次）
  choice: 你若回转
  rationale: שוב可指转回、归回；“回转”既保留行动与方向的意象，也不把含义缩减为纯粹内在的“悔改”。
- source_word: יִשְׂרָאֵל
  choice: 以色列啊
  rationale: 按其在句中的直接呼语功能处理；“啊”自然传达先知的郑重呼唤。
- source_word: נְאֻם יְהוָה
  choice: 雅威宣告说
  rationale: 保留郑重的先知宣告公式，并将四字神名按其专名音译为“雅威”。
- source_word: אֵלַי תָּשׁוּב
  choice: 就当回转归向我
  rationale: 保留原文第二次使用שוב所形成的强调，并以“当”表达此处合乎语境的劝令意味；“归向我”明确呈现אֵלַי的方向。
- source_word: תָּסִיר
  choice: 除掉
  rationale: 使役词形在此表示移除、清除；“除掉”符合清除敬拜中可憎之物的语境。
- source_word: שִׁקּוּצֶיךָ
  choice: 你那些可憎之物
  rationale: 该词尤其可指令人厌恶的偶像崇拜物；“可憎之物”保留其强烈贬义，又不直接把所指限定为偶像。
- source_word: מִפָּנַי
  choice: 从我面前
  rationale: 贴近“从我脸面／临在之前”的空间与关系意象。
- source_word: וְלֹא תָנוּד
  choice: 不再漂泊不定
  rationale: נוד可表示流荡、游移或动摇；“漂泊不定”同时传达偏离与不稳定，且未过度限定具体比喻。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”较贴近现代学界通常重建的读音，并把它作为专名呈现。
- issue: 两次שוב之间的语气关系
  choice: “你若回转……就当回转归向我”
  alternative: “你若回转……就必归向我”
  rationale: 原文重复同一动词，却未显式标明第二处究竟是劝令还是结果。正文依上下文采用条件—劝令的理解，同时用脚注保留条件—结果的可能。
- issue: וְלֹא תָנוּד的语气
  choice: “不再漂泊不定”作为回转要求的一部分
  alternative: “就不再漂泊不定”作为条件达成后的结果
  rationale: 希伯来语未完成式在此既可带劝阻意味，也可陈述结果；正文顺着悔改呼召来表达，脚注注明另一种句法理解。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。用“回转归向我”保留盟约关系中的方向性，用“可憎之物”避免过早缩窄所指。末尾保留逗号，以提示本节在句法和意义上与下一节相连。
