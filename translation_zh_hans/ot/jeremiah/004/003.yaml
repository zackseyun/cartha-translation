source:
  edition: WLC
  text: כִּי כֹ֣ה אָמַ֣ר יְהֹוָ֗ה לְ/אִ֤ישׁ יְהוּדָה֙ וְ/לִ/יר֣וּשָׁלִַ֔ם נִ֥ירוּ לָ/כֶ֖ם נִ֑יר וְ/אַֽל תִּזְרְע֖וּ אֶל קוֹצִֽים־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/004/003.yaml
  text: 'For thus says Yahweh to the men of Judah and to Jerusalem: Break up for yourselves unplowed ground[a], and do not sow among thorns.'
translation:
  language: zh_hans
  text: '因为耶和华对犹大人和耶路撒冷这样说：


    “你们要开垦自己的未耕之地[a]，


    不要撒种在荆棘中。”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“休耕地”。希伯来语指需要先翻耕、预备才适合撒种的土地。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהֹוָה
  choice: 耶和华
  rationale: 采用现代中文圣经语体中广为人知的专名译法，明确对应神名四字母词，避免以“主”掩盖原文此处使用专名这一事实。
- source_word: לְאִישׁ יְהוּדָה
  choice: 对犹大人
  rationale: אִישׁ虽为单数形式，在这里具有集合意义；“犹大人”自然表达群体所指，也不把经文误解为仅对一个男子说话。
- source_word: וְלִירוּשָׁלִַם
  choice: 和耶路撒冷
  rationale: 保留原文直接称呼城市的转喻表达，不擅自扩写为“耶路撒冷的居民”。
- source_word: נִירוּ לָכֶם נִיר
  choice: 你们要为自己开垦荒地
  rationale: 动词与同根名词形成强调性的农耕表达；“开垦荒地”在现代汉语中自然清楚，并保留土地须先翻耕、预备才可播种的意象。“为自己”保留לָכֶם的受益或反身意味。
- source_word: וְאַל תִּזְרְעוּ
  choice: 不要撒种
  rationale: 准确保留זָרַע所指的播种行为及否定命令语气。
- source_word: אֶל קוֹצִים
  choice: 在荆棘中
  rationale: 结合“撒种”的语境，אֶל表示种子落入或处在荆棘之中；“在荆棘中”是自然的中文表达，同时保留原有农耕图景。
theological_decisions:
- issue: 农耕命令的隐喻意义
  choice: 正文直接保留“开垦荒地”和“撒种在荆棘中”的农耕意象，不明说这是悔改或内心预备。
  alternative: 在正文中解释为“预备你们的心”或“除去罪恶再悔改”。
  rationale: 上下文可能赋予这些命令属灵和伦理意义，但本节原文本身采用的是农耕隐喻。保留意象可避免把解释直接写入经文，并保存其张力和开放性。
- issue: “耶路撒冷”的所指
  choice: 保留城市名称作为被告知的对象。
  alternative: 译为“耶路撒冷的居民”。
  rationale: 这里很可能以城市转指居民，但原文并未明说“居民”；直译既自然，也不消除这一修辞现象。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“因为……这样说”承接上文的כִּי，并保留先知宣告公式；诗行排列突出两个并列命令。正文中的脚注标记[a]与脚注完全对应。
