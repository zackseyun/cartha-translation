base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/004/013.yaml
  text: Look[a], he comes up like clouds, and his chariots are like the whirlwind; his horses are swifter than eagles. Woe to us, for we are ruined!
translation:
  language: zh_hans
  text: 看哪，他如云彩般涌上；他的战车如旋风；他的马比鹰[a]更快。我们有祸了，因为我们遭劫掠了！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “鹰”也可译作“秃鹫”；希伯来语נְשָׁרִים也可较广泛地指大型食腐鸟或猛禽。
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: 看哪
  rationale: 表达突然而紧迫的指示与惊叹；“看哪”既保留先知话语的庄重感，也能为现代读者理解。
- source_word: כַּעֲנָנִים יַעֲלֶה
  choice: 他如云涌上
  rationale: 保留复数“云”的聚集、逼近意象，并以“涌上”自然表达עלה在入侵者进逼语境中的方向与动态。
- source_word: וְכַסּוּפָה מַרְכְּבוֹתָיו
  choice: 他的战车如旋风
  rationale: סוּפָה指猛烈风暴或旋风；“旋风”保留迅猛而可怕的军事比喻。
- source_word: קַלּוּ מִנְּשָׁרִים סוּסָיו
  choice: 他的马比鹰更快
  rationale: קלל在此表示轻捷、迅速，מן构成比较；按现代汉语语序调整，同时保留速度比较。
- source_word: נְשָׁרִים
  choice: 鹰
  rationale: 该词可泛指大型猛禽或食腐鸟；正文采用传统且符合速度意象的“鹰”，另一可能以脚注注明。
- source_word: אוֹי לָנוּ
  choice: 我们有祸了
  rationale: 自然表达灾祸临头的集体哀号，并保留先知语境中的强烈情绪。
- source_word: שֻׁדָּדְנוּ
  choice: 我们被毁了
  rationale: 该被动形式表示遭暴力劫掠、蹂躏而陷于毁灭；“被毁了”保留受害的被动性及结果意味，又不必解释为彻底灭绝。
