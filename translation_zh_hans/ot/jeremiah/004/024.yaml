  text: רָאִ֨יתִי֙ הֶֽ/הָרִ֔ים וְ/הִנֵּ֖ה רֹעֲשִׁ֑ים וְ/כָל הַ/גְּבָע֖וֹת הִתְקַלְקָֽלוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/004/024.yaml
  text: I looked at the mountains[a], and behold, they were quaking, and all the hills were shaken.
translation:
  language: zh_hans
  text: 我看见群山[a]，看哪，它们正在震动；所有的丘陵都摇晃不定。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我观看群山，看哪，它们在颤抖；所有的丘陵都摇摆不定。”
    reason: 原文的“看见／观看”、“震动／颤抖”，以及末一动词所表达的摇晃、失稳，均容许这些近义译法。
lexical_decisions:
- source_word: רָאִיתִי
  choice: 我观看
  rationale: 这是 ראה 的 Qal 完成式第一人称单数。在本段连续的异象观察中，“我观看”既保留直接视觉感受，也自然承接先知反复观看的叙述方式；“我看见”亦可。
- source_word: הֶהָרִים
  choice: 群山
  rationale: הָרִים 通常指山岳。译作“群山”符合汉语表达，并与下文较低的 גְּבָעוֹת（“冈陵”）保持地貌上的区别。
- source_word: וְהִנֵּה
  choice: 看哪
  rationale: הִנֵּה 是引人注意、突出眼前景象的提示语。“看哪”保留先知异象突然而鲜明的语气。
- source_word: רֹעֲשִׁים
  choice: 在震动
  rationale: 这是 רעשׁ 的复数分词，常描写地震般的震荡。“在震动”表达正在持续发生的强烈运动，同时避免把它弱化为一般的轻微颤动。
- source_word: וְכָל
  choice: 所有……都
  rationale: כָּל 与复数名词连用，在此表示整体范围；汉语采用“所有……都”的呼应结构，清楚自然。
- source_word: הַגְּבָעוֹת
  choice: 冈陵
  rationale: גְּבָעוֹת 指丘陵或小山，与前面的 הָרִים 相对。“冈陵”简洁、庄重，并保留诗句中的地貌平行。
- source_word: הִתְקַלְקָלוּ
  choice: 摇晃起来
  rationale: 该词为 התפעל 形式，描写剧烈扰动、不稳或摇摆，并不必然是被动。“摇晃起来”自然表现冈陵失稳摆动的景象；“踉跄摇摆”或“摇摇欲坠”可传达更强烈的意象，但会增加原文未明确说明的拟人或将要倒塌之意。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“看哪”保留先知异象的突显语气；“群山／冈陵”维持原文的诗意平行与地貌区分。末句用主动状态描写，不按英语修订中的被动表达处理，因为希伯来语 התפעל 形式在此更自然地表示主体自身摇晃、失稳。
