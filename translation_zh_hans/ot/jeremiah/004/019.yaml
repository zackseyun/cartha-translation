  text: מֵעַ֣/י מֵעַ֨/י אחולה קִיר֥וֹת לִבִּ֛/י הֹֽמֶה לִּ֥/י לִבִּ֖/י לֹ֣א אַחֲרִ֑ישׁ כִּ֣י ק֤וֹל שׁוֹפָר֙ שמעתי נַפְשִׁ֔/י תְּרוּעַ֖ת מִלְחָמָֽה׀׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/004/019.yaml
  text: My inward parts[a], my inward parts! I writhe in pain! O walls of my heart! My heart pounds within me; I cannot keep silent, for you, my soul, have heard the sound of the trumpet[c][b], the battle cry.
translation:
  language: zh_hans
  text: 我的肺腑啊，我的肺腑啊！我痛得辗转不安！我心的墙壁啊！[a]我的心在我里面怦怦跳动；我不能沉默，因为你，我的心灵啊，[b]听见了号角声、战争的警报。[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“我心的墙壁”；也可理解为“我心的内室”。这是描写内心剧痛的鲜明身体意象。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文可理解为对自己的呼喊：“你，我的心灵啊，听见了”；也可理解为强调性的主语：“我的心灵听见了”。
    reason: grammatical_ambiguity
  - marker: c
    text: “战争的警报”也可译作“战斗的呐喊”或“战争的警号”。
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵעַי
  choice: 我的肺腑
  rationale: 该词本指腹中内脏，在诗歌中表达发自身体深处的痛苦。“肺腑”既保留内在器官的具体意象，也符合现代汉语庄重而强烈的感情表达；原文的重复照录。
- source_word: אחולה
  choice: 我痛得辗转不安
  rationale: 此形式源于表示翻腾、扭动或产痛般痛苦的词根；译文兼顾身体上的辗转与内心的剧痛。
- source_word: קִירוֹת לִבִּי
  choice: 我心的墙壁
  rationale: קִירוֹת直译为“墙壁”。原文意象突兀而具体，故不径自解释为“心房”或抽象化为“内心深处”。
- source_word: הֹמֶה לִּי לִבִּי
  choice: 我的心在我里面怦怦跳动
  rationale: המה可表示喧腾、轰鸣或骚动；在惊惧和身体痛苦的语境中，“怦怦跳动”自然传达心中的剧烈躁动。
- source_word: לֹא אַחֲרִישׁ
  choice: 我不能沉默
  rationale: 这里表示无法保持安静；结合前后的痛苦呼喊和原因从句，“不能”比单纯意志性的“不愿”更贴合语境。
- source_word: קוֹל שׁוֹפָר
  choice: 号角声
  rationale: שׁוֹפָר指通常以羊角制成的号角，קוֹל是声音；“号角声”简洁保留两项含义。
- source_word: שמעתי נַפְשִׁי
  choice: 我听见了……我的心魂啊
  rationale: שמעתי是第一人称单数“我听见了”。将נַפְשִׁי作为插入的自我呼语，既保留动词人称，也呈现原文骤然转向自身的激烈语气。
- source_word: תְּרוּעַת מִלְחָמָה
  choice: 战争的警号
  rationale: תְּרוּעָה可指呐喊、号声或警报；与“战争”连用时，“警号”保留军事警报或战斗信号的语义，同时不排除它由呼喊或号声发出。
