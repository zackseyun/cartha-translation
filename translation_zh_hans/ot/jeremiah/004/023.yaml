source:
  edition: WLC
  text: רָאִ֨יתִי֙ אֶת הָ/אָ֔רֶץ וְ/הִנֵּה תֹ֖הוּ וָ/בֹ֑הוּ וְ/אֶל הַ/שָּׁמַ֖יִם וְ/אֵ֥ין אוֹרָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/004/023.yaml
  text: I looked at the earth[a], and behold, it was formless and empty; and at the heavens, and they had no light.
translation:
  language: zh_hans
  text: 我观看大地，看哪，竟是混沌空虚[a]；又观看诸天，却没有光。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “混沌空虚”原文为 tohu vabohu，也可译作“荒芜空荡”或“无形空虚”；这一短语呼应《创世记》1:2。
    reason: 说明罕见固定搭配的译法及其互文关联。
lexical_decisions:
- source_word: רָאִיתִי
  choice: 我观看
  rationale: 这是 ראה 的 Qal 完成式第一人称单数。在先知异象的语境中，“我观看”既保留第一人称观察的力度，也适合本段反复展开的视觉场景。
- source_word: הָאָרֶץ
  choice: 大地
  rationale: אֶרֶץ 可指“地、土地、国土”。本句与“诸天”配对，并以 תֹהוּ וָבֹהוּ 呼应《创世记》1:2，因此采用宇宙性较强的“大地”，同时不否认上下文所指向的本地灾难。
- source_word: וְהִנֵּה
  choice: 看哪，竟是
  rationale: “看哪”保留 הִנֵּה 的指示与异象现场感；“竟是”使后接的判断在现代汉语中自然，并传达眼前景象的突兀。
- source_word: תֹהוּ וָבֹהוּ
  choice: 混沌空虚
  rationale: 该固定搭配强烈呼应《创世记》1:2。“混沌空虚”依原文词序表达失序、荒凉和空无，也保留创造被逆转的文学意象。
- source_word: הַשָּׁמַיִם
  choice: 诸天
  rationale: שָׁמַיִם 在形式上为复数，并与“大地”构成宇宙性对举；“诸天”比单指可见天空的“天空”更能保留这一范围。
- source_word: וְאֵין אוֹרָם
  choice: 却没有光
  rationale: 原文意为“它们没有光”，其中后缀回指诸天。汉语承接“观看诸天”后省略重复主语更自然；“没有光”不额外断定光是被夺去还是本来就不存在。
theological_decisions:
- issue: 审判神谕中对《创世记》1:2的互文呼应
  choice: 以“大地……混沌空虚”和“诸天……没有光”保留宇宙性的反创造图景。
  alternative: 将 הָאָרֶץ 译作“这地”，主要突出犹大本地遭毁灭的景象。
  rationale: תֹהוּ וָבֹהוּ、天地的配对以及光的缺失共同唤起创造叙事，描绘审判仿佛使受造秩序倒退。本译文保留这种神学与文学张力，同时不排除本段在历史层面针对犹大的灾难。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“看哪”保留先知异象的现场感；分号呈现大地与诸天的平行结构。“诸天”属较庄重的圣经语体，但普通读者仍易理解。
