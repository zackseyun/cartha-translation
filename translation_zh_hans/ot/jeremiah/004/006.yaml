  text: שְׂאוּ נֵ֣ס צִיּ֔וֹנָ/ה הָעִ֖יזוּ אַֽל תַּעֲמֹ֑דוּ כִּ֣י רָעָ֗ה אָנֹכִ֛י מֵבִ֥יא מִ/צָּפ֖וֹן וְ/שֶׁ֥בֶר גָּדֽוֹל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/004/006.yaml
  text: Raise a signal toward Zion[a]. Take refuge; do not stand still, for I am bringing disaster from the north[c][b], and great destruction.
translation:
  language: zh_hans
  text: 你们要向锡安竖起信号旗[a]！要赶快避难，不要停留！因为我要从北方带来灾祸[b]和大毁灭。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你们要朝锡安竖起旗号！”
    reason: “信号旗”也可译作“旗号”；方向词表示朝向锡安，修饰竖旗的动作。
  - marker: b
    text: “灾祸”在这里指灾难或审判，并非道德上的邪恶。
    reason: 说明רָעָה在本节先知审判语境中的词义。
lexical_decisions:
- source_word: שְׂאוּ נֵס
  choice: 竖起信号旗
  rationale: 该短语指竖起用于召集或警告的旗号；“信号旗”兼顾其具体形态与警示功能。
- source_word: צִיּוֹנָה
  choice: 指向锡安
  rationale: 词尾的方向性־ָה表示朝向锡安；结合“信号旗”，译为“指向锡安”较自然，并保留方向含义。
- source_word: הָעִיזוּ
  choice: 赶快避难
  rationale: 此处使役式命令的具体语义较罕见，语境强调立即寻求安全；“赶快避难”表达避难之意及警告的紧迫感。
- source_word: אַל תַּעֲמֹדוּ
  choice: 不要停留
  rationale: 直译为“不要站着”，语境中是不可耽搁、不可停下之意；“不要停留”符合现代汉语。
- source_word: רָעָה
  choice: 灾祸
  rationale: 在先知审判语境中指灾难、祸患，并非道德意义上的邪恶。
- source_word: אָנֹכִי מֵבִיא מִצָּפוֹן
  choice: 我要使灾祸从北方临到
  rationale: 分词配合强调主语אָנֹכִי，突出上帝亲自带来且迫近的行动；汉语如此表达自然，并保留来源方向。
- source_word: שֶׁבֶר גָּדוֹל
  choice: 大毁灭
  rationale: שֶׁבֶר可指破碎、崩毁或毁灭；此处与“灾祸”并列，“大毁灭”简明而有力度。
theological_decisions:
- issue: 上帝带来רָעָה的含义
  choice: 灾祸
  alternative: 邪恶／灾难
  rationale: 经文讲的是上帝从北方带来审判性的祸患。“灾祸”保留上帝施行审判的直接行动，同时不把רָעָה误解为道德邪恶。
- issue: 灾祸临到的施动者
  choice: 保留第一人称“我要使……临到”
  alternative: 灾祸将从北方临到
  rationale: 原文以אָנֹכִי明确强调“我”，不宜弱化上帝在这场审判中的直接施动角色。
translation_notes:
  register: 采用现代、庄重且紧迫的先知警告语气。用两个感叹句呈现连续命令；不使用生僻的军事术语。“赶快避难”反映הָעִיזוּ在此处的紧迫性，同时避免过度确定其罕见词形所表达的具体移动方式。
