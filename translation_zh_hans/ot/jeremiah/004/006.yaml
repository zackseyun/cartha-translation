revisions:
- from: 你们要竖起信号旗，指向锡安[a]！要赶快避难，不要停留！因为我要使灾祸从北方临到[b]，并带来大毁灭。
  to: 你们要向锡安竖起信号旗[a]！要赶快避难，不要停留！因为我要从北方带来灾祸[b]和大毁灭。
  rationale: 修订仅澄清希伯来文方向词与动作的关系，并将“从北方”明确连接到并列的“灾祸和大毁灭”。其余措辞保留原译的现代、庄重和紧迫语气；不对罕见的הָעִיזוּ作超出语境所支持的细化解释。
