  text: כַּבְּסִ֨י מֵ/רָעָ֤ה לִבֵּ/ךְ֙ יְר֣וּשָׁלִַ֔ם לְמַ֖עַן תִּוָּשֵׁ֑עִי עַד מָתַ֛י תָּלִ֥ין בְּ/קִרְבֵּ֖/ךְ מַחְשְׁב֥וֹת אוֹנֵֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/004/014.yaml
  text: Wash your heart from evil[a], Jerusalem, so that you may be saved. How long will wicked thoughts lodge within you?
translation:
  language: zh_hans
  text: 耶路撒冷啊，洗净你的心，除去邪恶，好使你得救。邪恶的念头[a]还要在你里面留宿多久呢？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “邪恶的念头”也可译作“罪恶的图谋”。
    reason: מַחְשְׁבוֹת可指念头、计划或图谋；אָוֶן带有邪恶、罪孽的道德含义。
lexical_decisions:
- source_word: כַּבְּסִי מֵרָעָה לִבֵּךְ
  choice: 洗去你心中的邪恶
  rationale: כּבס本指洗涤、漂洗；介词מִן表示除去或脱离。这样译既保留洗涤内心的具体意象，又符合现代汉语表达。
- source_word: לִבֵּךְ
  choice: 你的心／你心中
  rationale: 希伯来语“心”指人的内在，包括思想、意志和道德取向；保留“心”的意象。
- source_word: לְמַעַן תִּוָּשֵׁעִי
  choice: 好使你得救
  rationale: לְמַעַן表示目的；ישׁע的尼法勒式可指得救或获救。此译不把含义限定为眼前脱离灾祸或更广义的救恩。
- source_word: תָּלִין
  choice: 留宿
  rationale: לון的基本含义是过夜、留宿。此处用拟人化表达，描绘恶念住在人里面，而不弱化为单纯的“存留”。
- source_word: מַחְשְׁבוֹת אוֹנֵךְ
  choice: 邪恶的念头
  rationale: מַחְשָׁבוֹת可指思想、计划或图谋，אָוֶן可指邪恶、罪孽或祸害。正文采用自然且贴合内心语境的“邪恶的念头”，脚注保留“图谋”的可能。
- source_word: בְּקִרְבֵּךְ
  choice: 在你里面
  rationale: 受话者是被人格化的耶路撒冷；此表达保留恶念位于其内部的空间意象。
theological_decisions:
- issue: תִּוָּשֵׁעִי在先知语境中的范围
  choice: 得救
  alternative: 获救／得解救
  rationale: 经文既涉及悔改后免受迫近审判，也保有更广的拯救含义；“得救”不将两者强行拆开。
- issue: 洗心命令与拯救目的之间的关系
  choice: 按原文译为“要……好使……”
  alternative: 改写为条件句“你若……就……”
  rationale: 保留לְמַעַן所表达的目的关系，不额外把它系统化为明确的条件公式。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“留宿”刻意保留原文鲜明的拟人化意象；“耶路撒冷啊”清楚呈现对被人格化城市的直接呼唤。
