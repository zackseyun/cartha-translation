language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כִּי כֹה֙ אָמַ֣ר יְהוָ֔ה שְׁמָמָ֥ה תִהְיֶ֖ה כָּל הָ/אָ֑רֶץ וְ/כָלָ֖ה לֹ֥א אֶעֱשֶֽׂה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/004/027.yaml
  text: 'For thus says Yahweh: The whole land will be a desolation[b][a], yet I will not make a full end.'
translation:
  language: zh_hans
  text: 因为耶和华如此说：全地都必荒凉[a]，但我不会将它彻底毁灭[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “全地”也可译作“整个大地”。希伯来语 אֶרֶץ 既可指一片土地，也可指大地；这里的上下文主要关乎犹大受审判，但周围的意象也可能使人联想到范围更广的毁灭。
    reason: alternative_reading
  - marker: b
    text: 也可译作“但我不会使它完全终结”。希伯来原文保留了一种张力：审判带来极其严重的毁坏，却不是彻底的灭绝。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文并引出耶和华对先前异象的解释；现代汉语中“因为”能自然表达此处的因果衔接。
- source_word: כֹה אָמַר
  choice: 如此说
  rationale: 保留先知宣告中固定的使者公式及其庄重语体。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代简体中文圣经语境中对四字神名最通行且易于辨认的音译，不以称号取代专名。
- source_word: שְׁמָמָה תִהְיֶה
  choice: 都必荒凉
  rationale: 谓语名词 שְׁמָמָה 表示荒废、毁坏的状态；汉语以“必荒凉”自然而准确地表达其未来结果。
- source_word: כָּל הָאָרֶץ
  choice: 全地
  rationale: אֶרֶץ 在此可指犹大之地，也可能被听作大地；“全地”既符合直接语境，也保留一定的范围含混性。
- source_word: וְכָלָה לֹא אֶעֱשֶׂה
  choice: 但我不会将它彻底毁灭
  rationale: 以自然汉语传达“不会造成完全终结”的希伯来语习语，并保留严厉审判与不彻底灭绝之间的张力。
theological_decisions:
- issue: הָאָרֶץ 的范围
  choice: 全地
  alternative: 全世界／整个大地
  rationale: 直接语境集中于犹大受审判，因此不宜明确扩大为全球；然而周围带有宇宙性回响的意象及该词本身的多义性，需在注脚中保留。
- issue: וְכָלָה לֹא אֶעֱשֶׂה 的力度
  choice: 但我不会将它彻底毁灭
  alternative: 但我不会使它完全终结
  rationale: 该句一面确认全面荒凉，一面否定彻底灭绝。正文采用清楚自然的现代汉语，同时用注脚保留“完全终结”这一较贴近形式的表达。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“耶和华如此说”保留先知宣告的正式语气；正文避免生硬照搬“作成完全的终结”，改用普通读者容易理解的“彻底毁灭”，并借注脚保存原文习语及其神学张力。
