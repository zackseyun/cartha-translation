id: JER.4.7
reference: Jeremiah 4:7
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: עָלָ֤ה אַרְיֵה֙ מִֽ/סֻּבְּכ֔/וֹ וּ/מַשְׁחִ֣ית גּוֹיִ֔ם נָסַ֖ע יָצָ֣א מִ/מְּקֹמ֑/וֹ לָ/שׂ֤וּם אַרְצֵ/ךְ֙ לְ/שַׁמָּ֔ה עָרַ֥יִ/ךְ תִּצֶּ֖ינָה מֵ/אֵ֥ין יוֹשֵֽׁב׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/004/007.yaml
  text: A lion has come up from his thicket[a], and a destroyer of nations has set out; he has gone out from his place to make your land a desolation. Your cities will be laid waste[b], without inhabitant.
translation:
  language: zh_hans
  text: 狮子已经从密林中上来[a]，毁灭列国者已经动身；他已离开自己的地方，要使你的国土一片荒凉。你的城邑必荒废，无人居住[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“从它的藏身处出来。”原文所指的是枝叶交错、浓密隐蔽的地方，狮子可从那里出现。
    reason: lexical_alternative
  - marker: b
    text: 也可译：“你的城邑必荒废，其中无人居住。”
    reason: lexical_alternative
lexical_decisions:
- source_word: עָלָה
  choice: 已经……上来
  rationale: 该动词是完成式，基本义为“上去、上来”。这里描绘入侵者向犹大逼近，译作“上来”既保留方向感，也符合先知宣告临近灾祸的语境。
- source_word: אַרְיֵה
  choice: 狮子
  rationale: 保留原文用来描绘入侵者的核心比喻，不在正文中直接解释为“仇敌”或某一历史人物。
- source_word: מִסֻּבְּכוֹ
  choice: 从密林中
  rationale: סֹבֶךְ指枝叶交错、浓密隐蔽之处。“密林”在现代汉语中自然，并保留狮子从浓密掩蔽物中出现的画面；“巢穴”作为可能理解列入脚注。
- source_word: מַשְׁחִית גּוֹיִם
  choice: 毁灭列国者
  rationale: 分词短语与“狮子”同位，描述这位入侵者的作为。“毁灭列国者”简洁保留原文的称谓形式及“列国”的复数。
- source_word: נָסַע
  choice: 已经动身
  rationale: 该词常指拔营启程。此处是军事进犯的语境，“动身”清楚表达已经开始行进，又不额外加入原文未明说的“军队”或“拔营”。
- source_word: יָצָא מִמְּקוֹמוֹ
  choice: 他已离开自己的地方
  rationale: 较自然地保留原文“从他的地方出来”的意思，并与前面的“动身”共同形成步步逼近的画面。
- source_word: לָשׂוּם אַרְצֵךְ לְשַׁמָּה
  choice: 要使你的国土一片荒凉
  rationale: לָשׂוּם在此引出目的或结果，שַׁמָּה表示荒凉、令人惊骇的废墟状态。“一片荒凉”符合现代汉语先知性语体，也不把目的与结果之间的关系解释得过细。
- source_word: עָרַיִךְ תִּצֶּינָה
  choice: 你的城邑必荒废
  rationale: 动词表达城邑遭破坏、沦为荒废之地。“必荒废”简洁自然，并保留预告的确定语气。
- source_word: מֵאֵין יוֹשֵׁב
  choice: 无人居住
  rationale: 该短语直指没有居民留下。“无人居住”是现代汉语中清楚而庄重的表达，并保留原文单数集合性用语的整体含义。
theological_decisions:
- issue: “狮子”和“毁灭列国者”的身份
  choice: 保留比喻和描述性称谓，不在正文中指明具体人物或帝国
  alternative: 直接译明为某位君王、巴比伦或敌军
  rationale: 本节原文本身没有明说其历史身份；保留这种开放性可避免把上下文推断或特定解释写进译文。
- issue: 入侵者行动的目的与结果
  choice: 译作“要使”，保留目的表达，同时不扩充行动背后的神学主语
  alternative: 译作“以致”或明说这是上帝差遣他来施行审判
  rationale: לְ加不定式自然可表达目的，但本节没有在该句中明说谁差遣入侵者。译文不应补入未明说的施动者。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“城邑”比单用“城市”更适合古代城镇语境，也保持先知文学的凝练感。句中用分号对应两个相互解释的行动描述；不添加“军队”“巴比伦”等原文未明说的信息。
