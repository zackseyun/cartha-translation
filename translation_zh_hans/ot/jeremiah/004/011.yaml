  text: בָּ/עֵ֣ת הַ/הִ֗יא יֵאָמֵ֤ר לָֽ/עָם הַ/זֶּה֙ וְ/לִ/יר֣וּשָׁלִַ֔ם ר֣וּחַ צַ֤ח שְׁפָיִים֙ בַּ/מִּדְבָּ֔ר דֶּ֖רֶךְ בַּת עַמִּ֑/י ל֥וֹא לִ/זְר֖וֹת וְ/ל֥וֹא לְ/הָבַֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/004/011.yaml
  text: 'At that time it will be said to this people and to Jerusalem: “A scorching wind from the bare heights in the wilderness comes toward the daughter of my people—not for winnowing and not for cleansing.”'
translation:
  language: zh_hans
  text: 那时，必有人对这百姓和耶路撒冷说：“有一股灼热的风，从旷野光秃的高地吹向我百姓的女儿；这风不是用来扬谷，也不是用来簸净的。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רוּחַ צַח
  choice: 一股灼热的风
  rationale: רוּחַ在此指风；צַח基本义为清澈、纯净或强烈，结合旷野高地及下文扬谷的意象，指干燥猛烈、令人灼热的风。译作“灼热”自然表达审判语境，同时不把它具体化为某种已命名的风。
- source_word: שְׁפָיִים
  choice: 光秃的高地
  rationale: 该词指荒凉、无遮蔽的高处或山脊；“光秃的高地”兼顾地形和暴露无草木的特征。
- source_word: דֶּרֶךְ בַּת עַמִּי
  choice: 吹向我百姓的女儿
  rationale: דֶּרֶךְ可表示朝向、在……方向；这里与风连用，译为“吹向”。“我百姓的女儿”保留先知诗歌中的拟人称谓及其群体含义。
- source_word: לִזְרוֹת
  choice: 扬谷
  rationale: 指借风扬起谷物、分开谷粒与糠秕的农事动作；“扬谷”准确且能与风的意象对应。
- source_word: לְהָבַר
  choice: 簸净
  rationale: 该不定式与洁净、筛净有关，在扬谷语境中指进一步清除杂质；“簸净”既保留农事图景，也表达净除之意。
theological_decisions:
- issue: 风的功能与审判性质
  choice: 保留“不是用来扬谷，也不是用来簸净”的双重否定
  alternative: 意译为“这不是有益的洁净之风，而是毁灭之风”
  rationale: 原文只否定风通常在农事中的两种用途，并未在本节明说其最终功能；直译可保留其威胁感，又不提前引入下一节或解释性的神学结论。
- issue: “我百姓的女儿”的身份
  choice: 保留原有拟人表达
  alternative: 译作“我的百姓”或“我的子民耶路撒冷”
  rationale: 原文的属格结构有诗性张力，可能指作为女性形象被拟人的百姓群体；不将其缩减或明确等同于单一地点。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“必有人……说”保留无主被动式的含蓄；“灼热的风”“光秃的高地”“扬谷”“簸净”维持旷野与农事意象。无脚注，因此正文不设脚注标记。
