reference: Jeremiah 4:16
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: הַזְכִּ֣ירוּ לַ/גּוֹיִ֗ם הִנֵּה֙ הַשְׁמִ֣יעוּ עַל יְרוּשָׁלִַ֔ם נֹצְרִ֥ים בָּאִ֖ים מֵ/אֶ֣רֶץ הַ/מֶּרְחָ֑ק וַֽ/יִּתְּנ֛וּ עַל עָרֵ֥י יְהוּדָ֖ה קוֹלָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/004/016.yaml
  text: 'Declare it to the nations: ‘Look[a], proclaim it concerning Jerusalem: Watchers are coming from a distant land, and they raise their voice against the cities of Judah.’'
translation:
  language: zh_hans
  text: 你们要向列国宣告，也要传扬有关耶路撒冷的事：“看哪，守望者[a]正从遥远之地而来，向犹大的各城高声呼喊。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“围城者”。希伯来语原词字面指看守或守望的人，但在这里可能指包围城邑的敌军。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַזְכִּירוּ
  choice: 宣告
  rationale: 这是 זכר 的使役式复数命令式，可指使人记起、提说或公布；在发出公开警报的语境中，“宣告”自然地表达其命令语气。
- source_word: לַגּוֹיִם
  choice: 向列国
  rationale: לְ 通常标示传达的对象，גּוֹיִם 指各国或列国；“向列国”贴近原文，又避免带入后期语境中“外邦人”的特定含义。
- source_word: הִנֵּה
  choice: 看哪
  rationale: 这是引人注意并突出迫近之事的指示词；“看哪”保留其警示力度，同时符合庄重的现代经文语体。
- source_word: הַשְׁמִיעוּ עַל יְרוּשָׁלִַם
  choice: 传扬有关耶路撒冷的事
  rationale: שׁמע 的使役式表示使人听见、宣布；עַל 在此可表示关于或针对。“有关耶路撒冷”保留所传信息以该城为对象的含义，不提前把介词的敌对色彩定死。
- source_word: נֹצְרִים
  choice: 守望者
  rationale: 该词源于 נצר，字面指看守、守望的人；下文显示这些人是敌对势力，但正文保留原有意象，并以脚注说明语境中的另一种理解。
- source_word: בָּאִים
  choice: 正……而来
  rationale: 分词可表达正在发生或迫近的行动；“正……而来”自然传达敌军逼近的动态。
- source_word: מֵאֶרֶץ הַמֶּרְחָק
  choice: 从遥远之地
  rationale: 直译该单数短语的地域遥远之意；“遥远之地”简洁而庄重。
- source_word: וַיִּתְּנוּ ... קוֹלָם
  choice: 高声呼喊
  rationale: 希伯来语字面为“发出他们的声音”，在此指大声喊叫；“高声呼喊”以自然中文传达其力度。
- source_word: עַל עָרֵי יְהוּדָה
  choice: 向犹大的各城
  rationale: 军事威胁的语境使 עַל 带有针对这些城邑的意味；“向……高声呼喊”在中文中既自然，也让敌对方向由上下文显明。
theological_decisions:
- issue: נֹצְרִים 所指身份的语境判断
  choice: 正文译作“守望者”
  alternative: 围城者／围攻者
  rationale: 原词的基本意象是看守或守望，而本节及下一节的军事语境可能使它专指包围城邑的敌军。正文保留词汇意象，脚注呈现语境性解释，避免消除原文张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“看哪”保留先知警告的紧迫语气；“守望者”保留希伯来语意象，并用脚注交代其在军事语境中的可能含义。
