  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כִּי֩ ק֨וֹל כְּ/חוֹלָ֜ה שָׁמַ֗עְתִּי צָרָה֙ כְּ/מַבְכִּירָ֔ה ק֧וֹל בַּת צִיּ֛וֹן תִּתְיַפֵּ֖חַ תְּפָרֵ֣שׂ כַּפֶּ֑י/הָ אֽוֹי נָ֣א לִ֔/י כִּֽי עָיְפָ֥ה נַפְשִׁ֖/י לְ/הֹרְגִֽים־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/004/031.yaml
  text: 'For I have heard a sound like a woman in labor[a], distress like one giving birth to her first child— the sound of Daughter Zion gasping for breath, spreading out her hands: “Woe is me[c][b], for my life is faint before killers.”'
translation:
  language: zh_hans
  text: 因为我听见一种声音[a]，如同临产妇人的声音；一种痛苦，如同初产妇人的痛苦[b]——这是锡安女子的声音：她喘着气，张开双手，说：“我有祸了！我的性命[c]在杀人者面前衰竭了。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “声音”所译的希伯来语也可译作“呼声”；原文在本节重复使用这个词。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“如同初次生产的妇人”，以首次分娩的剧痛强化这里的苦难意象。
    reason: cultural_note
  - marker: c
    text: “性命”也可译作“生命”“自己”或“心魂”；末句也可理解为“我的性命因杀人者而衰竭”。
    reason: lexical_alternative
lexical_decisions:
- source_word: קוֹל
  choice: 声音；喊声
  rationale: 首处用较宽泛的“声音”引入听觉印象，随后在临产比喻中用“喊声”表达其具体性质；后文再次用“声音”保留原文重复。
- source_word: כְּחוֹלָה
  choice: 仿佛妇人临产时的喊声
  rationale: 该词在先知文学的产痛意象中指临产、阵痛；译文补出“妇人”和“喊声”，使汉语自然，并与前面的“声音”衔接。
- source_word: צָרָה כְּמַבְכִּירָה
  choice: 又像初次分娩者的痛苦
  rationale: צָרָה 表示困苦、痛楚；מַבְכִּירָה 指初次生产者。此译保留首次分娩所强化的剧痛意象。
- source_word: בַּת צִיּוֹן
  choice: 锡安女子
  rationale: 保留先知书中将锡安拟人化为女子的凝练称呼，不将其解释性改写为其他对象。
- source_word: תִּתְיַפֵּחַ
  choice: 喘息着
  rationale: 该动词描写急促、艰难的呼吸；“喘息”简洁自然，并保留身体上的痛苦。
- source_word: תְּפָרֵשׂ כַּפֶּיהָ
  choice: 伸开双手
  rationale: 直观保留伸展手掌的绝望或求告姿态，而不在正文中限定其具体用意。
- source_word: אוֹי נָא לִי
  choice: 我有祸了
  rationale: 表达紧迫而沉痛的哀叹；较“我真苦啊”更贴近 אוֹי 的灾祸语义。
- source_word: עָיְפָה נַפְשִׁי
  choice: 我的性命……已经衰竭
  rationale: נֶפֶשׁ 在受杀害威胁的语境中可指人的生命或自身；“性命”避免把它狭义化为与身体相对的“灵魂”。עָיְפָה 用“衰竭”呈现耗尽、昏弱之意。
- source_word: לְהֹרְגִים
  choice: 在杀人者面前
  rationale: לְ 在此可表示面对、落在其势力之下；“杀人者”保留分词“杀人的人”的直接含义，不额外裁定为法律意义上的谋杀犯。
theological_decisions:
- issue: 锡安的拟人化表达
  choice: 锡安女子
  alternative: 锡安的女儿
  rationale: “锡安女子”在现代汉语中更像凝练的拟人称号，同时保留锡安作为发声哀叹者的诗歌形象，不作寓意化扩展。
- issue: 死亡威胁语境中的 נֶפֶשׁ
  choice: 我的性命
  alternative: 我的灵魂
  rationale: 此处重点是面对杀人者时整个人的生命衰竭。“性命”保留 נֶפֶשׁ 的语义弹性，避免引入原文并未明确表达的灵魂—身体二分。
- issue: לְהֹרְגִים 的关系含义
  choice: 在杀人者面前
  alternative: 因杀人者而／交给杀人者
  rationale: 原介词关系略有开放性；正文采用符合场景的“在……面前”，脚注提示也可理解为因其威胁而衰竭，以免消除真实歧义。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语，保留原文由产痛、喘息、伸手到性命衰竭的递进。破折号划分比喻与身份揭示，直接引语呈现锡安女子的哀叹。所有脚注标记均置于相关正文处。
