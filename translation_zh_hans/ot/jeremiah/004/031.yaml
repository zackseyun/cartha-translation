    rationale: 希伯来文先说“如临产妇人的声音”，继说“如初产妇人的痛苦/苦难”，两者是平行诗性描述。草稿的“声音……喊声，又像……痛苦”使“声音像痛苦”的汉语关系不顺，并将 קול 缩窄为“喊声”。
