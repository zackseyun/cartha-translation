revisions:
- from: 因为我听见声音，仿佛妇人临产时的喊声[a]，又像初次分娩者的痛苦[b]——这是锡安女子的声音；她喘息着，伸开双手，说：“我有祸了！我的性命在杀人者面前已经衰竭[c]。”
  to: 因为我听见一种声音[a]，如同临产妇人的声音；一种痛苦，如同初产妇人的痛苦[b]——这是锡安女子的声音：她喘着气，张开双手，说：“我有祸了！我的性命[c]在杀人者面前衰竭了。”
  rationale: 修订使两个“如同”引出的诗行在汉语中分别修饰“声音”和“痛苦”，更忠实地保留原文平行结构。将首处“喊声”改为“声音”，保存 קול 可指声音、呼声的语义宽度和本节重复用词；其余关键表达维持草稿对死亡威胁语境、锡安拟人化及介词关系的审慎处理。
