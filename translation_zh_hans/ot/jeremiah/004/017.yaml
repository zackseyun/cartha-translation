  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כְּ/שֹׁמְרֵ֣י שָׂדַ֔י הָי֥וּ עָלֶ֖י/הָ מִ/סָּבִ֑יב כִּי אֹתִ֥/י מָרָ֖תָה נְאֻם יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/004/017.yaml
  text: Like watchmen of a field[a], they are against her all around, because she has rebelled against me, declares Yahweh.
translation:
  language: zh_hans
  text: 他们像看守田地的人[a]，从四面围住她，因为她悖逆了我。这是耶和华的宣告。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“看守田野的人”或“守护田地的人”。这里以看守田地者环绕田地的画面，比喻敌军包围城邑。
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּשֹׁמְרֵי
  choice: 像看守……的人
  rationale: כְּ־表示比拟；שֹׁמְרֵי是复数分词，指负责看守、守望的人。译法自然，并保留守卫与围困的意象。
- source_word: שָׂדַי
  choice: 田地
  rationale: שָׂדֶה通常指田地或田野；这里取“田地”，保留希伯来文单数形式以及看守田地的具体画面。
- source_word: הָיוּ עָלֶיהָ מִסָּבִיב
  choice: 从四面围住她
  rationale: הָיוּ虽为完成式，但在预言语境中可生动呈现当前或迫近的局面；עָלֶיהָ在敌对语境中表示针对她，מִסָּבִיב表示四面环绕。合译为“从四面围住她”，清楚传达围城意象。
- source_word: כִּי
  choice: 因为
  rationale: 引出敌军包围和审判的原因，取明确的因果义。
- source_word: אֹתִי מָרָתָה
  choice: 她悖逆了我
  rationale: מרה常指对上帝的反叛、不服从；“悖逆”庄重而通俗，并自然带出宾语“我”。
- source_word: נְאֻם יְהוָה
  choice: 这是耶和华的宣告
  rationale: נְאֻם是庄严的先知宣告公式；译作完整句，既符合现代汉语，也保留神谕式郑重语气。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的神名形式“耶和华”，将其作为专名呈现，而非改用称号。
theological_decisions:
- issue: 阴性单数代词的所指
  choice: 正文保留“她”，不明确补作耶路撒冷
  alternative: 译作“耶路撒冷”“锡安女子”或“犹大”
  rationale: 希伯来文在本节没有明说先行词；上下文将受审判的城或群体拟人化为女性。保留“她”可维持原文的含混与拟人意象。
- issue: הָיוּ的时间与体貌
  choice: 以当前、鲜明的围困场景表达，不另加“已经”或“将要”
  alternative: 译作“他们已经围住她”或“他们将围住她”
  rationale: 完成式在先知话语中可能把迫近之事呈现为已然或鲜明现实。汉语不显式限定时间，可避免过度判定，同时保持画面的紧迫感。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“从四面围住她”比逐词译作“在她四周与她为敌”更自然，并保留包围意象；“悖逆”保持先知文体的分量。
