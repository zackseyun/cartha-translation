source:
  edition: WLC
  text: ר֧וּחַ מָלֵ֛א מֵ/אֵ֖לֶּה יָ֣בוֹא לִ֑/י עַתָּ֕ה גַּם אֲנִ֛י אֲדַבֵּ֥ר מִשְׁפָּטִ֖ים אוֹתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/004/012.yaml
  text: A wind too full for these will come for me[b][a]; now I myself will also speak judgments against them.
translation:
  language: zh_hans
  text: 有一阵远比这更强劲的风要为我而来[a]；现在，我也要亲自宣告对他们的判决[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“有一阵强风从这些地方而来，到我这里。”原文短语十分紧凑；其中介词可表示比较、来源或目的。“这些地方”是按上下文补足。
    reason: lexical_alternative
  - marker: b
    text: 或译：“我也要亲自向他们宣判。”
    reason: lexical_alternative
lexical_decisions:
- source_word: רוּחַ
  choice: 风
  rationale: 本段延续旷野和光秃高地刮来热风的气象意象，因此译作“风”，不取“灵”或“气息”之义。
- source_word: מָלֵא
  choice: 更猛烈
  rationale: 字面义为“满、充足”；结合上一节所说扬净、簸净的用途，此处表示风力超过那些用途所需，汉语用“更猛烈”自然传达其强度。
- source_word: מֵאֵלֶּה
  choice: 比这些更
  rationale: 介词מִן与指示词组成的短语十分紧凑，可表示比较或来源；正文依上下文采用比较义，同时用脚注保留其他可能。
- source_word: יָבוֹא לִי
  choice: 为我而来
  rationale: לִי可表示“到我这里”或“为我、受我差遣”；“为我而来”保留其方向与目的之间的张力，没有明说风必是“奉命”而来。
- source_word: עַתָּה
  choice: 现在
  rationale: 直接、自然地表达时间副词的通常含义。
- source_word: גַּם אֲנִי
  choice: 我也要亲自
  rationale: “也”体现גַּם的附加意味，“亲自”传达独立人称代词אֲנִי所带的强调。
- source_word: אֲדַבֵּר מִשְׁפָּטִים
  choice: 宣告判决
  rationale: אֲדַבֵּר本义为“说”，מִשְׁפָּטִים在此指司法性的裁断；合译为“宣告判决”符合现代汉语，又保留审判语气。
- source_word: אוֹתָם
  choice: 对他们
  rationale: 形式上是带代词后缀的宾语标记；在“宣告判决”的汉语结构中用“对他们”自然表达判决所针对的对象。
theological_decisions:
- issue: “为我而来”及“我也要亲自宣告”中的说话者
  choice: 按上下文理解为耶和华发言：毁灭性的风为他而来，他也亲自向百姓宣判。
  alternative: 也有人可能把部分第一人称话语理解为先知所说，或只把“为我”理解为方向性的“到我这里”。
  rationale: 上下文是上帝宣布审判，第一人称表达最自然地延续神圣发言；正文不增补“耶和华说”，以免消除原文简洁表达所容纳的张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“比这些更猛烈”承接上一节风并非为扬净、簸净而来的对比；“为我而来”有意保留原文在方向、目的和受差遣含义之间的简约性。
