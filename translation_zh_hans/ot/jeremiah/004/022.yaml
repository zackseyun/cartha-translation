id: JER.4.22
reference: Jeremiah 4:22
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כִּ֣י אֱוִ֣יל עַמִּ֗/י אוֹתִ/י֙ לֹ֣א יָדָ֔עוּ בָּנִ֤ים סְכָלִים֙ הֵ֔מָּה וְ/לֹ֥א נְבוֹנִ֖ים הֵ֑מָּה חֲכָמִ֥ים הֵ֨מָּה֙ לְ/הָרַ֔ע וּ/לְ/הֵיטִ֖יב לֹ֥א יָדָֽעוּ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/004/022.yaml
  text: For my people are foolish; they do not know me. They are foolish children[a], and they have no understanding. They are wise to do evil, but they do not know how to do good.
translation:
  language: zh_hans
  text: 因为我的子民愚昧，不认识我；他们是愚顽的儿女[a]，毫无悟性。他们善于作恶，却不懂得行善。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“愚顽的儿子们”；这里用复数“儿子”统称上帝的百姓。
    reason: 说明בָּנִים的字面形式及其集体用法。
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文的审判异象，说明其缘由；中文“因为”清楚表达解释或因果关系。
- source_word: אֱוִיל
  choice: 愚昧
  rationale: 此词所指不只是智力不足，也包含道德和属灵上的愚昧；“愚昧”庄重自然，并保留伦理意味。
- source_word: עַמִּי
  choice: 我的子民
  rationale: 保留第一人称所属关系及其立约语境，也凸显这些人虽属上帝，却不认识他的悲剧张力。
- source_word: אוֹתִי לֹא יָדָעוּ
  choice: 不认识我
  rationale: יָדַע在此包含关系和立约层面的认识；正文仍采用简洁的“认识”，不把丰富含义过度解释进译文。
- source_word: בָּנִים סְכָלִים
  choice: 愚顽的儿女
  rationale: בָּנִים字面为“儿子们”，在此集体指百姓；“儿女”自然涵盖整体。סְכָלִים语气尖锐，译作“愚顽”既保留责备力度，也符合经文的庄重语体。
- source_word: וְלֹא נְבוֹנִים הֵמָּה
  choice: 毫无悟性
  rationale: נבון强调理解力和辨别力；“毫无悟性”简洁地表达否定，并与下句反讽性的“善于作恶”形成对照。
- source_word: חֲכָמִים הֵמָּה לְהָרַע
  choice: 他们善于作恶
  rationale: 原文以“有智慧”反讽他们在恶事上的本领。“善于”在现代中文中自然传达实际能力，同时保留这种反讽。
- source_word: וּלְהֵיטִיב לֹא יָדָעוּ
  choice: 却不懂得行善
  rationale: 这里的“知道”涉及实践上的能力与道德取向；“不懂得行善”比生硬的“不知道行善”更自然，同时未把它简化为纯粹技能问题。
theological_decisions:
- issue: “认识”上帝的性质
  choice: 保留简明的“不认识我”，让其承载关系和立约层面的含义。
  alternative: 仅指头脑上不知道上帝，或明译为“不承认我”。
  rationale: 先知书中以上帝为宾语的“认识”通常不止是知识层面的知晓，也包含关系、忠诚和顺服；译文不应缩窄，也不应以解释性词语消除原文张力。
- issue: בָּנִים的集体与性别含义
  choice: 译作“儿女”。
  alternative: 译作“儿子们”或“孩子”。
  rationale: 原文阳性复数在此集体指上帝的百姓，并非只限男性。“儿女”保留亲属意象，又准确涵盖整体。
- issue: 作恶方面的“智慧”
  choice: 译作“善于作恶”，表达带反讽意味的实际本领。
  alternative: 直译为“有智慧作恶”。
  rationale: 原文并非肯定一种真正合宜的智慧，而是讽刺百姓把才智用于恶事；“善于”在中文中较自然，也不把这种能力赋予正面神学价值。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“愚昧—愚顽—毫无悟性”保留原文平行句中的层层责备；后半句用“善于作恶，却不懂得行善”呈现鲜明反讽和对比。
