  text: וְ/הָיָ֤ה בַ/יּוֹם הַ/הוּא֙ נְאֻם יְהוָ֔ה יֹאבַ֥ד לֵב הַ/מֶּ֖לֶךְ וְ/לֵ֣ב הַ/שָּׂרִ֑ים וְ/נָשַׁ֨מּוּ֙ הַ/כֹּ֣הֲנִ֔ים וְ/הַ/נְּבִיאִ֖ים יִתְמָֽהוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/004/009.yaml
  text: And it will happen on that day[a], declares Yahweh, that the heart of the king and the heart of the officials will perish, and the priests will be appalled, and the prophets will be astonished.
translation:
  language: zh_hans
  text: 雅威宣告说：那日，君王的心和众首领的心必丧失；祭司必惊骇，先知必惊愕。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָיָה בַיּוֹם הַהוּא
  choice: 到那日
  rationale: 以现代汉语常用的先知性时间表达传达将来事件；“到”自然体现事件临到。
- source_word: נְאֻם יְהוָה
  choice: 这是雅威的宣告
  rationale: נְאֻם是庄严的先知宣告公式；置于句末更符合现代汉语表达，同时保留其权威语气。יְהוָה按其专名译作“雅威”。
- source_word: יֹאבַד לֵב הַמֶּלֶךְ וְלֵב הַשָּׂרִים
  choice: 君王和众首领都必丧胆
  rationale: לֵב在此指内在的勇气或定力，אָבַד表示丧失、消逝；“丧胆”自然传达面对灾难时勇气尽失的意思。脚注保留原文“心……消失”的具体意象。
- source_word: הַשָּׂרִים
  choice: 众首领
  rationale: 指掌权的官长或领袖；“首领”既体现其统治地位，也避免把他们限定为世袭贵族。
- source_word: וְנָשַׁמּוּ הַכֹּהֲנִים
  choice: 祭司必惊骇
  rationale: נָשַׁם在此表达因震惊而骇然失措；“惊骇”简洁地传达强烈的恐惧和震愕。
- source_word: וְהַנְּבִיאִים יִתְמָהוּ
  choice: 先知必诧异
  rationale: תמה表示惊讶、困惑或不知所措；“诧异”保留其与祭司“惊骇”之间相近而不完全相同的反应。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文使用四字神名而非称号；“雅威”较直接地音译该专名，避免将其改成“主”等称号。
- issue: 君王与首领之“心灭亡”的含义
  choice: 正文译作“丧胆”，脚注保留直译
  alternative: 君王的心和众首领的心都必消失
  rationale: 上下文描述灾祸来临时统治者、祭司和先知的震惊反应，因此“心”最可能指勇气或内在定力；但脚注保留希伯来文意象，不排除心智、判断力丧失等语义余地。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。用分号保留祭司与先知两组平行反应；将宣告公式移至句末，使汉语自然流畅，同时不改变其对整句预言的权威性。
