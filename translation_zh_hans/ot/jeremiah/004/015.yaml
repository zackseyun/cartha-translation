base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/004/015.yaml
  text: For a voice is declaring from Dan[b][a], and proclaiming disaster from the hill country of Ephraim.
translation:
  language: zh_hans
  text: 因为有声音从但传来，又从以法莲山区[b]传报灾祸[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “灾祸”也可译作“患难”或“灾难”；这个希伯来词在其他语境中也可表示“罪恶”。
    reason: lexical_alternative
  - marker: b
    text: 原文直译“从以法莲山”；这里很可能指以法莲的山区。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上下文，说明警报的依据；保留希伯来语连接和解释的作用。
- source_word: קוֹל
  choice: 有声音
  rationale: 保留原文“声音”的鲜明意象，同时符合现代汉语表达。
- source_word: מַגִּיד
  choice: 传来
  rationale: 该分词描写正在发出的通报；结合来源短语“从但”，译为“传来”自然呈现消息逐站南下的画面。
- source_word: מִדָּן
  choice: 从但
  rationale: “但”是以色列北部地名，按通行中文圣经专名译法处理。
- source_word: וּמַשְׁמִיעַ
  choice: 宣告
  rationale: 该使役分词本义为“使人听见”，此处表示公开发布消息；“宣告”与预言语体相称。
- source_word: אָוֶן
  choice: 灾祸
  rationale: 此词可指罪恶、患难或灾难；在外敌逼近和审判警报的语境中，“灾祸”最贴切，同时以脚注保留其他可能。
- source_word: מֵהַר אֶפְרָיִם
  choice: 从以法莲山区
  rationale: הַר אֶפְרָיִם 是地域名称，指以法莲的山地，而非一座名为“以法莲山”的单独山峰。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“有声音……传来”保留原文通报声由北向南逼近的动态感；后半句补出“临到”，使“宣告灾祸从……（而来）”在汉语中清楚顺畅，而不改变原意。脚注标记均置于相关经文句末。
