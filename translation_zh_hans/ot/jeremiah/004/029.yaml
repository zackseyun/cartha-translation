  text: מִ/קּ֨וֹל פָּרָ֜שׁ וְ/רֹ֣מֵה קֶ֗שֶׁת בֹּרַ֨חַת֙ כָּל הָ/עִ֔יר בָּ֚אוּ בֶּ/עָבִ֔ים וּ/בַ/כֵּפִ֖ים עָל֑וּ כָּל הָ/עִ֣יר עֲזוּבָ֔ה וְ/אֵין יוֹשֵׁ֥ב בָּ/הֵ֖ן אִֽישׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/004/029.yaml
  text: At the sound of the horseman and the archer[a], every city flees; they go into the thickets and climb up among the rocks. Every city is abandoned[d][c][b], and no man dwells in them.
translation:
  language: zh_hans
  text: 骑兵和弓箭手的声响一传来[a]，各城的人都逃跑；他们逃进密林[b]，爬上岩石。各城都荒废了[c]，其中没有一个人居住。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因骑兵和弓箭手的声响。”原文介词可表示事情发生的契机，也可表示原因。
    reason: lexical_alternative
  - marker: b
    text: “密林”所译的原文词义不确定；也可译作“云中”。但上下文说逃亡者寻找藏身之处，故译作茂密的林木。
    reason: lexical_alternative
  - marker: c
    text: “各城”也可理解为“全城”。原文用单数表达整体或逐一分配的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקּוֹל
  choice: 一听见……的声响
  rationale: מִן与קוֹל连用，可表示事情发生的契机或原因；“一听见”自然呈现敌军声响引发的即时逃亡，同时不把因果关系说得过重。
- source_word: פָּרָשׁ
  choice: 骑兵
  rationale: 此处指骑马的军事人员；用集合意义的“骑兵”符合战争语境，也比“骑马的人”简洁。
- source_word: וְרֹמֵה קֶשֶׁת
  choice: 和弓箭手
  rationale: 原文直译为“射弓的人”；“弓箭手”是现代汉语中自然的军事称谓。
- source_word: בֹּרַחַת כָּל הָעִיר
  choice: 各城的人都逃跑
  rationale: כָּל加单数עִיר可作逐一分配理解；动词阴性单数与“城”一致，但实际逃跑的是居民，汉语补出“的人”以避免把城拟人化得过于突兀。
- source_word: בָּאוּ
  choice: 钻进
  rationale: 原义为“进入”；结合逃难藏身的情景，与“密林”搭配译作“钻进”自然生动。
- source_word: בֶּעָבִים
  choice: 密林
  rationale: 该词含义不确定，也可按通常词义理解为“云中”；但与进入藏身处及爬上岩石的平行关系，更支持指浓密树丛或林木。
- source_word: וּבַכֵּפִים עָלוּ
  choice: 爬上岩石
  rationale: כֵּפִים指岩石、岩崖；עלה表示上去。“爬上岩石”清楚表达逃亡者前往高处避难。
- source_word: עֲזוּבָה
  choice: 都被撇下
  rationale: 该阴性单数分词表达被弃置、无人留守的结果状态；“被撇下”既贴近原文，又符合城邑因居民逃亡而荒弃的场景。
- source_word: וְאֵין יוֹשֵׁב בָּהֵן אִישׁ
  choice: 其中无人居住
  rationale: 原文直译为“其中没有一个人居住”；汉语“无人居住”自然、准确地表达彻底空城，并保留אִישׁ在此泛指任何人的作用。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。用“各城的人”明确实际逃亡者，同时脚注保留“各城／全城”的希伯来语歧义；将词义不确定的בֶּעָבִים正文译为“密林”，并在脚注注明“云中”的可能。
