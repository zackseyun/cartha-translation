  text: רָאִ֕יתִי וְ/הִנֵּ֖ה אֵ֣ין הָ/אָדָ֑ם וְ/כָל ע֥וֹף הַ/שָּׁמַ֖יִם נָדָֽדוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/004/025.yaml
  text: I looked[a], and behold, there was no man, and all the birds of the heavens had fled.
translation:
  language: zh_hans
  text: 我观看，见没有人；天空的飞鸟也都逃走了。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רָאִיתִי
  choice: 我观看
  rationale: Qal完成式第一人称单数在此属于反复出现的异象观察句式；“我观看”比单纯的“我看见”更能表现先知察看眼前景象。
- source_word: וְהִנֵּה
  choice: 见
  rationale: הִנֵּה用于引人注意所见之事；现代汉语以“见”简洁保留异象叙述的鲜明感和庄重语气。
- source_word: אֵין הָאָדָם
  choice: 没有人
  rationale: אֵין表示不存在；带冠词的אָדָם在此为泛指，现代汉语“没有人”自然涵盖无人类存在之意，并不限定男性。
- source_word: וְכָל עוֹף הַשָּׁמַיִם
  choice: 天空的飞鸟也都
  rationale: עוֹף在此指鸟类，שָׁמַיִם按鸟类活动的领域译作“天空”；וְ在并列的荒凉景象中自然译为“也”，כָל译为“都”。
- source_word: נָדָדוּ
  choice: 逃走了
  rationale: נדד表示迁离、逃离或飘泊；此处描写灾后鸟类尽皆离去，“逃走了”保留其主动远离的力度，同时不额外说明原因。
theological_decisions:
- issue: הָאָדָם作为泛指单数的译法
  choice: 没有人
  alternative: 没有人类／人类都不见了
  rationale: 希伯来语的אָדָם虽为单数形式，在本句却具有集合性、代表性的泛指意义。汉语“人”本身不标示性别，既直接对应原文，又不会误解为仅指男性，因此正文无需另设性别包容脚注。
- issue: 鸟类离去是否明确归因于审判
  choice: 只译“逃走了”
  alternative: 因审判而逃走了
  rationale: 上下文可能使读者理解其为灾难或审判所致，但本节动词本身只陈述鸟已迁离；正文不补入原文未明说的因果关系。
translation_notes:
  register: 采用自然、庄重的现代标准汉语，保留先知异象中逐景察看的节奏。用分号连接两幅荒凉景象；“天空”比“诸天”更符合此处鸟类活动范围，也更易为普通读者理解。
