id: JER.4.20
reference: Jeremiah 4:20
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: שֶׁ֤בֶר עַל שֶׁ֨בֶר֙ נִקְרָ֔א כִּ֥י שֻׁדְּדָ֖ה כָּל הָ/אָ֑רֶץ פִּתְאֹם֙ שֻׁדְּד֣וּ אֹהָלַ֔/י רֶ֖גַע יְרִיעֹתָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/004/020.yaml
  text: Disaster upon disaster is proclaimed[a], for the whole land is devastated. Suddenly my tents are devastated[b], my curtains in a moment.
translation:
  language: zh_hans
  text: '灾祸接着灾祸的消息传来；


    因为全地[a]都被毁坏。


    我的帐棚突然被毁坏，


    我的幔子[b]在转瞬之间被毁坏。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “全地”也可译作“全世界”或“整个大地”。希伯来语 אֶרֶץ 可指国土、土地或大地；这里的上下文较倾向指正在受审判的国土。
    reason: alternative_reading
  - marker: b
    text: “幔子”指帐棚所用的布幔；本句描绘居所在顷刻间遭到毁坏。
    reason: cultural_note
lexical_decisions:
- source_word: שֶׁבֶר עַל שֶׁבֶר
  choice: 灾祸接着灾祸
  rationale: שֶׁבֶר在这里指重大的毁灭或灾难；重复结构配合עַל表现灾祸层叠而来。此译保留原文的反复和递进感。
- source_word: נִקְרָא
  choice: 接连传报
  rationale: קרא的尼法勒式在此表示消息被喊出、传出或报告。译作“传报”保留公开报信的意味，并与前半句自然衔接。
- source_word: שֻׁדְּדָה / שֻׁדְּדוּ
  choice: 被毁坏／被毁
  rationale: שׁדד可指掠夺，也可强调暴力造成的荒废和毁灭。这里的对象是全地和帐棚，采用“毁坏”较能涵盖整体破坏，不局限于财物被抢。
- source_word: כָּל הָאָרֶץ
  choice: 全地
  rationale: אֶרֶץ既可指“地、土地、国土”，也可指“全地、世界”。本章直接语境是犹大遭受审判，因此正文采用“全地”，同时以脚注保留词义范围。
- source_word: פִּתְאֹם
  choice: 突然
  rationale: 直接表达事件毫无预警、骤然发生。
- source_word: אֹהָלַי
  choice: 我的帐棚
  rationale: 保留原文第一人称所有格和帐棚意象，不在正文中替其确定隐喻所指。
- source_word: רֶגַע
  choice: 转瞬之间
  rationale: רֶגַע在此作时间状语，强调毁坏发生得极快；“转瞬之间”自然且适合诗体。
- source_word: יְרִיעֹתַי
  choice: 我的幔子
  rationale: יְרִיעָה在帐棚语境中指构成或遮盖帐棚的布幔。“幔子”保留具体意象，脚注说明其用途。
theological_decisions:
- issue: הָאָרֶץ的范围
  choice: 全地
  alternative: 全世界／整个大地
  rationale: 耶利米书第四章的直接背景是临到犹大和耶路撒冷的审判，故正文不将其明确扩大为全球；但希伯来词本身容许更广的“大地”含义，因此在脚注中保留这一歧义。
- issue: “我的帐棚／我的幔子”的说话者或象征所指
  choice: 保留第一人称居所意象，不明确指定说话者
  alternative: 解释为先知、锡安或百姓的住处
  rationale: 原文没有在本节内明说第一人称所指。正文保留这种诗歌张力，避免把某一种解释写进译文。
translation_notes:
  register: 采用现代、庄重而易懂的诗体汉语；分行保留原文的平行结构。以“灾祸接着灾祸”再现开头的重复，以“突然／转瞬之间”对应末两行的急迫节奏。
