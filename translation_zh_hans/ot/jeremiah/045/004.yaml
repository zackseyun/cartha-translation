source:
  edition: WLC
  text: כֹּ֣ה תֹּאמַ֣ר אֵלָ֗י/ו כֹּ֚ה אָמַ֣ר יְהוָ֔ה הִנֵּ֤ה אֲשֶׁר בָּנִ֨יתִי֙ אֲנִ֣י הֹרֵ֔ס וְ/אֵ֥ת אֲשֶׁר נָטַ֖עְתִּי אֲנִ֣י נֹתֵ֑שׁ וְ/אֶת כָּל הָ/אָ֖רֶץ הִֽיא׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/045/004.yaml
  text: 'This is what you shall say to him: ‘This is what Yahweh says: Behold[a], what I have built I am tearing down, and what I have planted I am uprooting, that is, the whole land.’'
translation:
  language: zh_hans
  text: 你要对他说：“雅威如此说：看哪，我所建造的，我要拆毁；我所栽植的，我要拔除——也就是整片土地[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “土地”或可译作“全地”。希伯来语 אֶרֶץ 既可指一片土地，也可指全地或世界；这里按耶利米书审判犹大之地的直接语境译作“整片土地”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה תֹּאמַר אֵלָיו
  choice: 你要对他说
  rationale: כֹּה引出将要转述的话；未完成式在先知受命的语境中表达指示，现代汉语用“要……说”自然明确。
- source_word: כֹּה אָמַר יְהוָה
  choice: 雅威如此说
  rationale: 保留先知性的使者宣告格式；אָמַר虽为完成式，在固定公式中表示雅威当前具有权威的宣告。יהוה按其专名音译为“雅威”，不以称号替代。
- source_word: הִנֵּה
  choice: 看哪
  rationale: 保留提醒听者注意和庄严强调的功能，同时符合现代中文圣经语体。
- source_word: אֲשֶׁר בָּנִיתִי אֲנִי הֹרֵס
  choice: 我所建造的，我要拆毁
  rationale: 保留“建造—拆毁”的意象和前置宾语结构；分词הֹרֵס表示正在展开或迫近的行动，中文以“我要”自然表达此处的确定意向。
- source_word: וְאֵת אֲשֶׁר נָטַעְתִּי אֲנִי נֹתֵשׁ
  choice: 我所栽植的，我要拔除
  rationale: 保留耶利米书反复出现的“栽植—拔除”农业意象；“拔除”既可指连根拔起，也保持庄重简洁。
- source_word: וְאֶת כָּל הָאָרֶץ הִיא
  choice: 也就是整片土地
  rationale: 希伯来文结尾是省略式结构，הִיא很可能以同位或强调方式界定前述行动的范围。“也就是”使中文清楚但不增添因果；“整片土地”依上下文指受审判之地，同时用脚注保留“全地”的可能性。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名；音译“雅威”保留其专名性质，不以称号“主”替代。
- issue: הָאָרֶץ的范围
  choice: 整片土地
  alternative: 全地（或全世界）
  rationale: אֶרֶץ可指土地、国土或全地；耶利米书此处的直接审判语境较支持受审判的这片土地，但原词的较广含义仍以脚注保留。
- issue: 神亲自拆毁并拔除的表达
  choice: 我所建造的，我要拆毁；我所栽植的，我要拔除
  alternative: 我所建造的，我正在拆毁；我所栽植的，我正在拔除
  rationale: 两个第一人称代词和两个分词凸显行动者正是雅威。中文重复“我”保留这一强调；“我要”兼顾迫近性与确定性，而不限定行动在说话时已经进行。
translation_notes:
  register: 采用现代、庄重而易懂的宣告语体。“看哪”保留先知话语的郑重感；平行句式和“建造—拆毁、栽植—拔除”的对照均按原文保留。
