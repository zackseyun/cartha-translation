  yaml_path: translation/ot/jeremiah/045/002.yaml
  text: 'Thus says Yahweh[a], the God of Israel, concerning you, Baruch:'
translation:
  language: zh_hans
  text: “以色列的上帝耶和华论到你[a]，巴录，如此说：”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “论到你”也可译作“关于你”；较不可能译作“攻击你”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: 如此说
  rationale: 这是先知传信公式；用“如此说”既保留庄重、公式化的语气，也符合现代汉语表达。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代简体中文读者熟悉的形式音译四字神名，不以称号替代专名。
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: 以色列的上帝
  rationale: 直接表达希伯来语构造关系，保留完整的盟约称谓。
- source_word: עָלֶיךָ
  choice: 论到你
  rationale: עַל 在这里引出信息所涉及的人；“论到你”保留“关于你”的意义，又不武断地理解为敌对的“攻击你”。
- source_word: בָּרוּךְ
  choice: 巴录
  rationale: 按现代中文圣经人名的通行形式音译该专名。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。中文采用广为人知的专名形式“耶和华”，而不以“主”等称号取代；“雅威”是更贴近常见学术拟音的另一选择。
- issue: עָלֶיךָ 是否带有敌对含义
  choice: 论到你
  alternative: 攻击你／对你不利
  rationale: 介词本身在本句中不必然表示敌对；上下文是在宣告一段涉及巴录的信息，因此保留较中性的表达。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“耶和华——以色列的上帝——”用破折号标出同位称谓，使长句关系清楚；“如此说”保留先知宣告公式的正式语体。
