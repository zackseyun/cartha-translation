  to: 至于你，你为自己图谋大事吗？不要图谋！因为看哪，我要把灾祸降在一切有血肉的身上——这是耶和华的宣告。不过，无论你去哪里，我都要把你的性命赐给你作战利品。[a]
  rationale: 删除无对应的“还”，调整“降灾”搭配，并以更贴近原文的方式保留“性命作战利品”的战争隐喻。其余措辞维持原稿的准确性、先知宣告的庄重语气，以及原文范围上的开放性。
