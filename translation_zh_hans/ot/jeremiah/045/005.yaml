  text: וְ/אַתָּ֛ה תְּבַקֶּשׁ לְ/ךָ֥ גְדֹל֖וֹת אַל תְּבַקֵּ֑שׁ כִּ֡י הִנְ/נִי֩ מֵבִ֨יא רָעָ֤ה עַל כָּל בָּשָׂר֙ נְאֻם יְהוָ֔ה וְ/נָתַתִּ֨י לְ/ךָ֤ אֶֽת נַפְשְׁ/ךָ֙ לְ/שָׁלָ֔ל עַ֥ל כָּל הַ/מְּקֹמ֖וֹת אֲשֶׁ֥ר תֵּֽלֶךְ שָֽׁם־־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/045/005.yaml
  text: And you—are you seeking great things for yourself? Do not seek them, for behold, I am bringing disaster on all flesh, declares the LORD. But I will give you your life as plunder in every place where you go.
translation:
  language: zh_hans
  text: 至于你，你为自己图谋大事吗？不要图谋！因为看哪，我要把灾祸降在一切有血肉的身上——这是耶和华的宣告。不过，无论你去哪里，我都要把你的性命赐给你作战利品。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “把你的性命赐给你作战利品”：直译原文的战争隐喻；意思是你虽将失去其他所求，却能在灾祸中保全性命。
    reason: 说明“性命作战利品”这一不寻常的希伯来语表达，同时保留正文的原文比喻。
lexical_decisions:
- source_word: גְדֹלוֹת
  choice: 大事
  rationale: 保留原文宽泛的复数表达，不具体限定为地位、财富或成就。
- source_word: רָעָה
  choice: 灾祸
  rationale: 此处指耶和华将要带来的灾难，而非抽象的道德邪恶。
- source_word: כָּל־בָּשָׂר
  choice: 所有血肉之躯
  rationale: 较形式地保留希伯来语惯用表达及其广阔范围，避免直接缩窄为“所有人”。
- source_word: נַפְשְׁךָ
  choice: 性命
  rationale: 在“作为战利品”这一生死处境中，נפש指人的生命。
- source_word: לְשָׁלָל
  choice: 如同得了战利品
  rationale: 保留战争意象，表达巴录虽失去其他所求，却能从灾难中保全生命。
- source_word: עַל כָּל־הַמְּקֹמוֹת
  choice: 无论你去哪里
  rationale: 按现代汉语自然表达传达“在你所去的一切地方”的周遍含义。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 耶和华
  alternative: 上主／雅威
  rationale: 采用现代简体中文读者熟悉的专名形式，明确这是以色列上帝的立约之名。
- issue: “所有血肉之躯”的范围
  choice: 保留原文概括性说法
  alternative: 所有人
  rationale: 原文并未在本节内明确把范围限定为人类，因此不替文本消除其修辞张力。
- issue: 后半句与审判宣告的关系
  choice: 译作“不过”
  alternative: 并且／但
  rationale: וְ 在语境中引出灾祸中的保全应许；“不过”自然呈现转折，又不把它强化成与审判完全对立。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“至于你”凸显原文对巴录的强调；连续使用“图谋”再现同一词根的重复。“看哪”保留先知宣告的警示语气，破折号标明“这是耶和华的宣告”为神谕公式。
