base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/045/001.yaml
  text: 'The word that Jeremiah the prophet spoke to Baruch son of Neriah when he wrote these words in a scroll at the mouth of Jeremiah[a], in the fourth year of Jehoiakim son of Josiah, king of Judah, saying:'
translation:
  language: zh_hans
  text: 在犹大王约西亚的儿子约雅敬第四年，尼利亚的儿子巴录按先知耶利米的口述[a]把这些话写在书卷上时，先知耶利米对他说了以下的话：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“从耶利米口中”。
    reason: 保留希伯来语习语的字面形式；正文“按先知耶利米的口述”表达其在此处的口授含义。
lexical_decisions:
- source_word: הַדָּבָר
  choice: 所说的话
  rationale: דָּבָר可指“话、信息、事情”；此处引出先知对巴录所说的内容，用“所说的话”既自然，也保留话语性质。
- source_word: דִּבֶּר
  choice: 所说
  rationale: דבר是普通的“说、讲话”；在汉语关系结构中译作“所说”最顺畅。
- source_word: הַנָּבִיא
  choice: 先知
  rationale: 直接翻译耶利米的职分称号。
- source_word: בְּכָתְבוֹ
  choice: 巴录……写……时
  rationale: 介词ב加带后缀的不定词在此表示时间；根据最近的先行对象和上下文，明确主语为巴录。
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: 这些话
  rationale: 上下文涉及口述和书写，译作“这些话”最贴合文本内容。
- source_word: עַל סֵפֶר
  choice: 写在卷轴上
  rationale: סֵפֶר在此指书写文献，历史语境中“卷轴”比现代意义的“书”更准确；עַל按汉语习惯译为“在……上”。
- source_word: מִפִּי יִרְמְיָהוּ
  choice: 照耶利米口述
  rationale: 原文直译为“从耶利米口中”，在此表示巴录按耶利米口述记录；正文采用自然汉语，脚注保留字面表达。
- source_word: בַּשָּׁנָה הָרְבִעִית לִיהוֹיָקִים
  choice: 在……约雅敬第四年
  rationale: 这是标准的君王纪年格式；汉语通常简洁表达为某王“第四年”。
- source_word: לֵאמֹר
  choice: 所说的：
  rationale: 该公式引出下一节的直接话语；中文用冒号清楚表示下文内容，并以“所说的”保留引语功能。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。为避免冗长难解的中心嵌套，将纪年语置于书写事件之前；不改变各事件之间的关系。正文明确“巴录”为书写者，以消除中文代词歧义。
