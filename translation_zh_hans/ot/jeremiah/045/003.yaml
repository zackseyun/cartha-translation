  text: אָמַ֨רְתָּ֙ אֽוֹי נָ֣א לִ֔/י כִּֽי יָסַ֧ף יְהוָ֛ה יָג֖וֹן עַל מַכְאֹבִ֑/י יָגַ֨עְתִּי֙ בְּ/אַנְחָתִ֔/י וּ/מְנוּחָ֖ה לֹ֥א מָצָֽאתִי־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/045/003.yaml
  text: You said[a], ‘Woe is me now, for Yahweh has added sorrow to my pain. I am weary with my groaning, and I have found no rest.’
translation:
  language: zh_hans
  text: 你曾说：“我如今真苦啊！[a]因为雅威在我的痛苦上又加了愁苦；我在叹息中疲惫不堪，得不到安歇。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我如今有祸了！”希伯来语这一呼喊表达悲叹和痛苦。
    reason: 词义与语气存在可自然表达为“真苦”或“有祸”的选择。
lexical_decisions:
- source_word: אָמַרְתָּ
  choice: 你曾说
  rationale: אמר的Qal完成时第二人称阳性单数形式，引出巴录先前所说的哀叹；“曾说”自然体现叙事中的既往话语。
- source_word: אֽוֹי נָא לִי
  choice: 我如今有祸了
  rationale: אוי是表达灾祸、悲痛和困苦的哀叹词；נא在此加强当下的悲叹语气。“我如今有祸了”既保留“祸”的意象，也符合现代汉语表达。
- source_word: כִּי
  choice: 因为
  rationale: 引出哀叹的原因，清楚保留原文的解释关系。
- source_word: יָסַף
  choice: 又加了
  rationale: יסף意为“增加、加上”；“又加了”明确表达在已有痛苦之上再添愁苦。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以音译呈现四字神名，保留原文所用的上帝专名，而不以称号替代。
- source_word: יָגוֹן
  choice: 愁苦
  rationale: 指忧愁、悲伤；“愁苦”保留情感层面，并与后面的“痛苦”有所区分。
- source_word: עַל מַכְאֹבִי
  choice: 在我的痛苦上
  rationale: 较直接地保留עַל“在……之上”的叠加意象，说明新的愁苦加在原有痛苦之上。
- source_word: יָגַעְתִּי
  choice: 我……疲惫
  rationale: 完成时在这里表达由持续困苦造成的现时结果；“疲惫”准确而自然。
- source_word: בְּאַנְחָתִי
  choice: 因叹息
  rationale: אַנְחָה可指叹息或呻吟；介词ב可表达原因、方式或伴随情形，此处译作“因叹息”能自然传达不断哀叹所带来的疲惫。
- source_word: וּמְנוּחָה לֹא מָצָאתִי
  choice: 却得不到安歇
  rationale: מְנוּחָה意为安歇、休息；原文直译为“没有找到安歇”，“得不到安歇”在现代汉语中自然，并保留缺乏舒缓的体验。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华／主
  rationale: 原文直接使用四字神名。译作“雅威”旨在保留其作为以色列上帝专名的性质，不以“主”这一称号代替；“耶和华”是传统汉译的另一种形式。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留“在我的痛苦上又加了愁苦”的叠加意象，并用“却”自然呈现后半句得不到安歇的转折感；脚注标记已置于对应哀叹之后。
