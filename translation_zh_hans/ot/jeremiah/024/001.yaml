id: JER.24.1
reference: Jeremiah 24:1
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: הִרְאַ/נִי֮ יְהוָה֒ וְ/הִנֵּ֗ה שְׁנֵי֙ דּוּדָאֵ֣י תְאֵנִ֔ים מוּעָדִ֕ים לִ/פְנֵ֖י הֵיכַ֣ל יְהוָ֑ה אַחֲרֵ֣י הַגְל֣וֹת נְבוּכַדְרֶאצַּ֣ר מֶֽלֶךְ בָּבֶ֡ל אֶת יְכָנְיָ֣הוּ בֶן יְהוֹיָקִ֣ים מֶֽלֶךְ יְהוּדָה֩ וְ/אֶת שָׂרֵ֨י יְהוּדָ֜ה וְ/אֶת הֶ/חָרָ֤שׁ וְ/אֶת הַ/מַּסְגֵּר֙ מִ/יר֣וּשָׁלִַ֔ם וַ/יְבִאֵ֖/ם בָּבֶֽל־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/024/001.yaml
  text: Yahweh showed me[a], and behold, two baskets of figs were set before the temple of Yahweh, after Nebuchadrezzar king of Babylon had taken into exile Jeconiah son of Jehoiakim, king of Judah, along with the officials of Judah, the craftsmen, and the smiths from Jerusalem[c][b], and had brought them to Babylon.
translation:
  language: zh_hans
  text: 耶和华让我看见：看哪，有两筐无花果摆在耶和华的殿前。此前，巴比伦王尼布甲尼撒[a]把犹大王约雅敬的儿子耶哥尼雅、犹大的首领[b]、工匠和铁匠[c]从耶路撒冷掳走，带到巴比伦。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “尼布甲尼撒”原文在此采用 נְבוּכַדְרֶאצַּר 所代表的名称形式；这是同一位巴比伦王名称的一种拼写形式。
    reason: 说明原文名称形式，避免把通行中文译名误认为对希伯来拼写差异的抹平。
  - marker: b
    text: “首领”也可译作“官长”。
    reason: 保留 שָׂרֵי 在统治者、官员或首领之间的词义幅度。
  - marker: c
    text: “铁匠”也可译作“金属工匠”；这两个希伯来职业词在此可能泛指被掳的熟练工匠群体。
    reason: 原文 הַמַּסְגֵּר 的具体职业所指存在词义不确定性。
lexical_decisions:
- source_word: הִרְאַנִי
  choice: 让我看见
  rationale: 使役式意为“使我看见、给我看”；“让我看见”在现代汉语中自然，也保留异象由耶和华启示的意味。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的神名音译“耶和华”，不以“主”这一称号替代原文专名。
- source_word: וְהִנֵּה
  choice: 看哪
  rationale: 保留原文引人注意、鲜明呈现异象场景的话语功能。
- source_word: שְׁנֵי דּוּדָאֵי תְאֵנִים
  choice: 两筐无花果
  rationale: דּוּד可指锅或筐；盛放无花果并置于殿前的语境支持“筐”，中文量词“筐”简洁自然。
- source_word: מוּעָדִים
  choice: 摆在
  rationale: 此处被动分词表示物件被安放、陈列；中文用主动形态的“摆在”即可自然表达其状态。
- source_word: הֵיכַל יְהוָה
  choice: 耶和华的殿
  rationale: הֵיכָל在此指圣殿建筑；“殿”庄重简洁，并由上下文明确为耶和华的圣殿。
- source_word: אַחֲרֵי הַגְלוֹת
  choice: 此前……掳走
  rationale: 原文标明尼布甲尼撒掳人之事先于所见异象；“此前”清楚传达时间次序，“掳走”也体现强制迁徙。
- source_word: נְבוּכַדְרֶאצַּר
  choice: 尼布甲尼撒
  rationale: 采用现代中文最通行的巴比伦王名译法；脚注说明原文在此所用的名称形式。
- source_word: יְכָנְיָהוּ
  choice: 耶哥尼雅
  rationale: 按本节希伯来名称形式音译，并与中文圣经传统中该王的名称保持可辨识性。
- source_word: שָׂרֵי יְהוּדָה
  choice: 犹大的首领
  rationale: שָׂרִים可指统治者、官长或首领；“首领”既涵盖执政阶层，也不误示他们必为王室子弟。
- source_word: הֶחָרָשׁ
  choice: 工匠
  rationale: חָרָשׁ可泛指各种手艺人；原文单数带冠词在此作集合名词，中文自然译为群体性的“工匠”。
- source_word: הַמַּסְגֵּר
  choice: 铁匠
  rationale: 该词所指具体行业并不完全确定，可能是铁匠或更广义的金属工匠；正文采用传统且符合历史语境的“铁匠”，并以脚注保留不确定性。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用四字神名而非“主”的称号。正文保留专名；采用现代中文圣经传统中最广为人知的“耶和华”，同时不据此推断原始发音。
- issue: 异象启示的表达
  choice: 耶和华让我看见
  alternative: 耶和华指给我看
  rationale: 使役式ראה表明所见源自神的呈现；“让我看见”保留这一启示关系，却不额外界定异象发生的具体方式。
translation_notes:
  register: 采用庄重而清楚的现代标准普通话。以“看哪”保留先知叙事的异象语气；后半句调整为符合汉语的信息顺序，同时保留原文明确的先后关系。所有脚注标记均置于正文相应词语之后。
