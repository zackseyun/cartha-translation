source:
  edition: WLC
  text: וְ/כַ/תְּאֵנִים֙ הָֽ/רָע֔וֹת אֲשֶׁ֥ר לֹא תֵאָכַ֖לְנָה מֵ/רֹ֑עַ כִּי כֹ֣ה אָמַ֣ר יְהוָ֗ה כֵּ֣ן אֶ֠תֵּן אֶת צִדְקִיָּ֨הוּ מֶֽלֶךְ יְהוּדָ֤ה וְ/אֶת שָׂרָי/ו֙ וְ/אֵ֣ת שְׁאֵרִ֣ית יְרוּשָׁלִַ֗ם הַ/נִּשְׁאָרִים֙ בָּ/אָ֣רֶץ הַ/זֹּ֔את וְ/הַ/יֹּשְׁבִ֖ים בְּ/אֶ֥רֶץ מִצְרָֽיִם־־׀־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/024/008.yaml
  text: 'But like the bad figs that cannot be eaten because they are so bad[a], thus says Yahweh: so I will make Zedekiah king of Judah, his officials, the remnant of Jerusalem who remain in this land, and those who dwell in the land of Egypt.'
translation:
  language: zh_hans
  text: “至于那些坏得不能吃的无花果，耶和华如此说：我必使犹大王西底家、他的官员、耶路撒冷的余民、留在这地的人，以及住在埃及地的人，如同这些无花果一样。[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “使……如同这些无花果一样”直译可作“这样给西底家……”。原文用“给”；在坏无花果的比较中，句意是耶和华要使所列的人如同这些坏无花果。具体的审判结果在下文说明。
    reason: 说明 כֵּן אֶתֵּן 的字面形式，以及比较结构所补足的含义。
lexical_decisions:
- source_word: וְ/כַ/תְּאֵנִים הָרָעוֹת
  choice: 那些坏无花果
  rationale: 承接上文好无花果与坏无花果的对比；“坏”符合果实品质的语境，也保留比喻中的负面评价。
- source_word: לֹא תֵאָכַלְנָה מֵרֹעַ
  choice: 坏得不能吃
  rationale: 以自然简洁的现代汉语表达因坏到极点而无法食用的因果含义。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的神名音译，不以称号替代专名。
- source_word: כֵּן אֶתֵּן
  choice: 我也必照样处置
  rationale: כֵּן 回应坏无花果的比喻；נתן 字面为“给”，但此处需由上下文补足“照样对待”的关系。“处置”既使汉语句意完整，又不提前具体说明后文将展开的审判方式。
- source_word: שָׂרָיו
  choice: 他的官员
  rationale: 指王室及治理体系中的首领或执政者；“官员”比“王子”准确，也符合现代汉语。
- source_word: שְׁאֵרִית יְרוּשָׁלִַם
  choice: 耶路撒冷的余民
  rationale: 保留先知书中“余民”的固定概念及其神学张力；此处随后进一步界定他们包括留在本地者。
- source_word: הַנִּשְׁאָרִים בָּאָרֶץ הַזֹּאת
  choice: 留在这地的人
  rationale: 自然表达分词所指仍留在犹大地的人，并与前面的“余民”形成解释关系。
- source_word: וְהַיֹּשְׁבִים בְּאֶרֶץ מִצְרָיִם
  choice: 和住在埃及地的人
  rationale: 保留“住在”和“埃及地”的原文表达，同时使用自然的现代汉语。
theological_decisions:
- issue: 坏无花果比喻中 כֵּן אֶתֵּן 的审判含义
  choice: 译作“我也必照样处置”
  alternative: “我也必这样交出”或更直译为“我也必这样给”
  rationale: 原文 נתן 的基本义是“给”，但本句没有明说接受者或结果，比较结构则表明神要照坏无花果所象征的方式对待这些人。“照样处置”保留审判意味和后文展开的空间，避免把未明说的对象或具体刑罚加入本节。
translation_notes:
  register: 采用庄重而易懂的现代标准普通话。“如此说”保留先知宣告公式的郑重语气；“余民”作为先知文学中的关键术语予以保留。
