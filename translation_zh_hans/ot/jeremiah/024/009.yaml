reference: Jeremiah 24:9
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וּ/נְתַתִּי/ם֙ ל/זועה לְ/רָעָ֔ה לְ/כֹ֖ל מַמְלְכ֣וֹת הָ/אָ֑רֶץ לְ/חֶרְפָּ֤ה וּ/לְ/מָשָׁל֙ לִ/שְׁנִינָ֣ה וְ/לִ/קְלָלָ֔ה בְּ/כָל הַ/מְּקֹמ֖וֹת אֲשֶֽׁר אַדִּיחֵ֥/ם שָֽׁם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/024/009.yaml
  text: I will make them a horror[a], a calamity, to all the kingdoms of the earth—a reproach, a proverb, a taunt[c][b], and a curse in all the places where I drive them.
translation:
  language: zh_hans
  text: 我要使他们在地上万国中成为惊骇的对象和灾祸；在我把他们赶逐到的各处，他们都要成为羞辱、笑谈[a]、讥诮和咒诅。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “笑谈”也可译作“俗语”或“话柄”；这里指人们带着轻蔑反复提说他们的遭遇。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּנְתַתִּים
  choice: 我要使他们成为
  rationale: נתן与表结果或身份的ל结构连用，在这里表示使他们落入某种处境、成为某种对象；此译保留其使役和结果意味。
- source_word: לְזַוֲעָה
  choice: 令……惊骇的对象
  rationale: 该名词指使人战栗、惊骇之物；明确译出“对象”，使现代汉语自然，也保留他人见其遭遇便惊骇的含义。
- source_word: לְרָעָה
  choice: 灾祸
  rationale: רָעָה在审判语境中可指祸患、灾难。译作“灾祸”比抽象的“恶”更符合此处他们成为万国眼中灾难性景象的语境，同时不把它窄化为道德邪恶。
- source_word: לְכֹל מַמְלְכוֹת הָאָרֶץ
  choice: 令地上万国……
  rationale: ל在此标示他们成为惊骇对象所面向的范围；用“令地上万国”自然表达该关系，并保留普遍范围。
- source_word: לְחֶרְפָּה
  choice: 受凌辱
  rationale: חֶרְפָּה涵盖羞辱、辱骂和耻辱；“受凌辱”能在中文中自然表达他们成为受辱对象的状态。
- source_word: וּלְמָשָׁל
  choice: 成为笑谈
  rationale: מָשָׁל本义范围包括箴言、俗语、比喻；在审判套语中指人们拿他们的遭遇当作反复传说的讥刺话柄。“笑谈”传达此处贬抑性的口头传说，脚注保留“俗语／话柄”的词义空间。
- source_word: לִשְׁנִינָה
  choice: 讥诮
  rationale: 这个罕见名词指带有敌意的讥讽、嘲弄之言；“讥诮”与“笑谈”有所区别，并保持先知书庄重语体。
- source_word: וְלִקְלָלָה
  choice: 咒语
  rationale: קְלָלָה指咒诅；在此不仅是他们受咒诅，也可指其命运成为人咒诅别人时引用的套语。“咒语”较能表达这一结果性身份。
- source_word: אֲשֶׁר אַדִּיחֵם שָׁם
  choice: 我赶逐他们所到的
  rationale: נדח的使役式表示赶走、驱逐或放逐。“赶逐”保留行动的强制性和流亡色彩；关系从句按汉语语序调整为“所到的各处”。
theological_decisions:
- issue: 审判宣告中连续名词的关系
  choice: 保留多项并列的审判结果，但按现代汉语分成两个紧密相连的分句
  alternative: 把整串词概括为“使他们在万国中遭灾受辱”
  rationale: 希伯来文反复使用ל，层层累积他们在流亡中所受的惊骇、羞辱、嘲弄和咒诅。保留各项可维持修辞力度，不把审判后果简化为单一概念。
- issue: “灾祸”是他们的状态还是给万国带来的伤害
  choice: 将其与“惊骇的对象”并列，理解为他们因所遭审判而成为灾祸性的景象
  alternative: 译为“把他们交给地上万国，使他们遭害”
  rationale: 上下文的连续ל短语较自然地构成结果或身份清单；本译不把该词解释成万国主动加害他们，也不额外说明灾祸的具体机制。
translation_notes:
  register: 采用现代、庄重而可朗读的普通话。以“地上万国”“赶逐”“凌辱”“讥诮”等词保留先知审判宣告的力度；避免逐字堆叠介词造成生硬，同时保留原文列举式修辞。脚注标记[a]已在正文对应位置出现。
