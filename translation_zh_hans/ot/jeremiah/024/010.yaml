source:
  edition: WLC
  text: וְ/שִׁלַּ֣חְתִּי בָ֔/ם אֶת הַ/חֶ֖רֶב אֶת הָ/רָעָ֣ב וְ/אֶת הַ/דָּ֑בֶר עַד תֻּמָּ/ם֙ מֵ/עַ֣ל הָ/אֲדָמָ֔ה אֲשֶׁר נָתַ֥תִּי לָ/הֶ֖ם וְ/לַ/אֲבוֹתֵי/הֶֽם־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/024/010.yaml
  text: And I will send against them the sword[a], the famine, and the pestilence, until they are consumed from the land that I gave to them and to their fathers.
translation:
  language: zh_hans
  text: 我要使刀剑、饥荒和瘟疫[a]临到他们，直到他们从我赐给他们和他们列祖的土地上灭绝。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “瘟疫”也可译作“疫病”；希伯来语可泛指流行性疾病。
    reason: 保留דֶּבֶר的词义范围，避免读者将其限定为某一种特定疫病。
lexical_decisions:
- source_word: וְשִׁלַּחְתִּי בָם
  choice: 我要使……临到他们
  rationale: שׁלח的Piel形式与ב连用，在审判语境中表示把灾祸遣向某些人。“使……临到他们”既保留上帝主动施行审判的含义，也符合现代汉语表达。
- source_word: הַחֶרֶב
  choice: 刀剑
  rationale: חֶרֶב本义为“刀剑”，在此可转指战争或战乱造成的死亡。正文保留具体意象，并与“饥荒、瘟疫”组成耶利米书常见的审判三联语。
- source_word: הָרָעָב
  choice: 饥荒
  rationale: רָעָב在此审判语境中指造成普遍缺粮与死亡的饥荒，不只是个人的饥饿感。
- source_word: הַדָּבֶר
  choice: 瘟疫
  rationale: דֶּבֶר在先知书的审判用语中通常指流行性致命疾病。“瘟疫”庄重自然，同时以脚注保留较宽泛的语义范围。
- source_word: עַד תֻּמָּם
  choice: 直到他们……灭绝
  rationale: תמם的这一形式表达被彻底除尽、走到尽头的结果。“灭绝”准确传达刀剑、饥荒和瘟疫所导致的终局。
- source_word: מֵעַל הָאֲדָמָה
  choice: 从……土地上
  rationale: מֵעַל含有“从……之上、离开”的意味；“从土地上灭绝”自然地保留了被从该地除去的空间含义。אֲדָמָה在这里指上帝所赐的疆土，而非单指土壤。
- source_word: אֲשֶׁר נָתַתִּי לָהֶם וְלַאֲבוֹתֵיהֶם
  choice: 我赐给他们和他们列祖的
  rationale: 此从句明确回指上帝赐地给当代百姓及其父辈。“列祖”符合现代中文圣经语体，并保留盟约历史中的代际指向。
theological_decisions:
- issue: 应许之地的盟约性表述
  choice: 我赐给他们和他们列祖的土地
  alternative: 我赐给他们及其祖先的土地
  rationale: “列祖”比泛称“祖先”更能保留אֲבוֹתֵיהֶם在以色列盟约历史中的具体代际色彩，同时不额外引入宗派性解释。
- issue: 审判中上帝主动性的表达
  choice: 我要使……临到他们
  alternative: 刀剑、饥荒和瘟疫将临到他们
  rationale: 希伯来文以第一人称动词明确以上帝为施动者，因此正文不宜将其弱化为无人称的灾难发生。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“刀剑、饥荒和瘟疫”保留原文有节奏的审判三联语；“灭绝”传达彻底终结的力度；“列祖”保留盟约历史语境，但整句句法保持现代、易懂。
