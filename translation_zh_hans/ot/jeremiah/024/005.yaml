  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כֹּֽה אָמַ֤ר יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל כַּ/תְּאֵנִ֥ים הַ/טֹּב֖וֹת הָ/אֵ֑לֶּה כֵּֽן אַכִּ֞יר אֶת גָּל֣וּת יְהוּדָ֗ה אֲשֶׁ֨ר שִׁלַּ֜חְתִּי מִן הַ/מָּק֥וֹם הַ/זֶּ֛ה אֶ֥רֶץ כַּשְׂדִּ֖ים לְ/טוֹבָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/024/005.yaml
  text: 'Thus says Yahweh[a], the God of Israel: Like these good figs, so I will regard the exiles of Judah, whom I sent away from this place to the land of the Chaldeans[b], for good.'
translation:
  language: zh_hans
  text: 耶和华、以色列的神如此说：“正如这些好无花果，我也必照样看待犹大被掳的人[a]；他们是我从这地方遣送到迦勒底人之地的，为使他们得益[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“犹大的被掳”或“犹大的流亡”。希伯来语可指被掳的人，也可指被掳的状态或事件；这里后文说“他们是我……遣送的”，因此正文取人的意思。
    reason: alternative_reading
  - marker: b
    text: 或译“为着好处”。希伯来语只说“为好处”，没有明说谁是受益者；正文根据上下文译为“使他们得益”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: 如此说
  rationale: 保留先知信息常用的传信公式，简洁庄重，也符合现代汉语圣经语体。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代简体中文读者最熟悉的上帝专名译法，以专名呈现希伯来文本中的四字神名。
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: 以色列的神
  rationale: 直接呈现原文的属格结构和盟约身份指称。
- source_word: כַּתְּאֵנִים הַטֹּבוֹת הָאֵלֶּה ... כֵּן
  choice: 这些好无花果怎样，我也必怎样
  rationale: 以“怎样……也必怎样”自然地重现希伯来文“像……如此……”的对应结构，并保留“这些”的指示作用。
- source_word: אַכִּיר
  choice: 看待
  rationale: 此处使役词形不只是认知上的“认出”，而含有以某种方式看待、对待之意；“看待”既贴合异象中的评判，也避免提前把含义收窄为“善待”。
- source_word: גָּלוּת יְהוּדָה
  choice: 犹大被掳的人
  rationale: 该词组可指流亡、被掳状态或被掳群体；后面的关系从句以复数对象为所指，故正文采用人的集体意义。
- source_word: שִׁלַּחְתִּי
  choice: 遣送
  rationale: 表达从本地被送往异地以及上帝在事件中的主动性，同时不采用比原文更技术化的政治术语。
- source_word: מִן הַמָּקוֹם הַזֶּה
  choice: 从这地方
  rationale: 直接而自然地保留原文的空间指示。
- source_word: אֶרֶץ כַּשְׂדִּים
  choice: 迦勒底人之地
  rationale: 保留原文的民族—地域称谓，不把它直接同义替换为“巴比伦”。
- source_word: לְטוֹבָה
  choice: 为要成就美善
  rationale: 保留“为着好处／美善”的目的或结果意味，同时不在正文中明说受益者，以反映原文未带显式代词的简约表达。
theological_decisions:
- issue: גָּלוּת יְהוּדָה所指的是人群还是被掳事件／状态
  choice: 正文译为“犹大被掳的人”
  alternative: “犹大的被掳”或“犹大的流亡”
  rationale: 好无花果所比拟的对象以及随后“他们是我……遣送”的关系从句都更自然地指向被掳者，但脚注保留名词本身的语义幅度。
- issue: לְטוֹבָה的目的与受益者
  choice: 译为“为要成就美善”
  alternative: “为他们的益处”
  rationale: 原文可在上下文中理解为使被掳者得益，但没有明写“他们”；正文保留目的意味和受益者的含蓄性，不把审判与美善之间的张力解释掉。
translation_notes:
  register: 采用现代、庄重而易懂的普通话书面语。“这些……怎样，我也必怎样……”保留异象比喻的平行结构；“看待”避免把神的行动过早窄化为单纯的眷顾，“成就美善”则保留原文简短而富有神学张力的目的表达。
