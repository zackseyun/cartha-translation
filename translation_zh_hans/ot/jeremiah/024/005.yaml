  naturalness: “这些好无花果怎样，我也必怎样看待”可以理解，但改为“正如……我也必照样……”更合现代汉语的比况句式。“耶和华以色列的神”宜以顿号隔开同位称谓，避免结构黏连。
  terminology: “耶和华”“以色列的神”“无花果”“犹大”“迦勒底人之地”均恰当。“被掳的人”自然且符合本节将גָּלוּת作为被遣送之群体的上下文。
  issues:
