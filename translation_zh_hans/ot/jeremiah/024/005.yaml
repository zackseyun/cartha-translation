revisions:
- from: 耶和华以色列的神如此说：“这些好无花果怎样，我也必怎样看待犹大被掳的人[a]；他们是我从这地方遣送到迦勒底人之地去的，为要成就美善[b]。”
  to: 耶和华、以色列的神如此说：“正如这些好无花果，我也必照样看待犹大被掳的人[a]；他们是我从这地方遣送到迦勒底人之地的，为使他们得益[b]。”
  rationale: 修订将比况句调整为自然的现代汉语，并把结尾恢复为与原文相称的“为好处／使……得益”目的表达，避免“成就美善”所引入的额外动作和抽象化措辞。脚注保留גָּלוּת的语义幅度，并明确说明结尾受益者在原文中未被显式标出。
