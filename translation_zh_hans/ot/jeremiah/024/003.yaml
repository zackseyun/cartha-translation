  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֵלַ֗/י מָֽה אַתָּ֤ה רֹאֶה֙ יִרְמְיָ֔הוּ וָ/אֹמַ֖ר תְּאֵנִ֑ים הַ/תְּאֵנִ֤ים הַ/טֹּבוֹת֙ טֹב֣וֹת מְאֹ֔ד וְ/הָֽ/רָעוֹת֙ רָע֣וֹת מְאֹ֔ד אֲשֶׁ֥ר לֹא תֵאָכַ֖לְנָה מֵ/רֹֽעַ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/024/003.yaml
  text: Then Yahweh said to me[a], “What do you see, Jeremiah?” And I said, “Figs—the good figs are very good, and the bad figs are very bad, so bad that they cannot be eaten.”
translation:
  language: zh_hans
  text: 于是，雅威对我说：“耶利米，你看见什么？”我说：“无花果。好的无花果非常好，坏的无花果非常坏，坏得不能吃[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因其坏而不能吃。”
    reason: 希伯来语 מֵרֹעַ 可侧重原因（“因其坏”），正文则以程度表达为“坏得不能吃”。
lexical_decisions:
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见音译呈现四字神名，保留其专名性质，不以“主”等称号替代。
- source_word: וַיֹּאמֶר אֵלַי
  choice: 于是……对我说
  rationale: “于是”自然表达叙事推进，“对我说”准确呈现说话对象。
- source_word: מָה אַתָּה רֹאֶה
  choice: 你看见什么
  rationale: 用自然的现代汉语表达分词结构所体现的当下观看。
- source_word: תְּאֵנִים
  choice: 无花果
  rationale: 准确指明耶利米所见的果实；汉语名词通常不标复数。
- source_word: הַתְּאֵנִים הַטֹּבוֹת טֹבוֹת מְאֹד
  choice: 好的无花果非常好
  rationale: 保留原文“好……非常好”的强调性重复，同时符合现代汉语表达。
- source_word: וְהָרָעוֹת רָעוֹת מְאֹד
  choice: 坏的无花果非常坏
  rationale: 此处形容果实品质而非道德邪恶，因此译作“坏”；补出“无花果”使两部分结构清楚、对称。
- source_word: אֲשֶׁר לֹא תֵאָכַלְנָה מֵרֹעַ
  choice: 坏得不能吃
  rationale: 以自然汉语表达果实坏到无法食用的程度，同时不擅自具体化为“腐烂”。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名；音译“雅威”保留其作为以色列之神专名的性质，避免用称号替代，也不采用源于后期元音组合的“耶和华”。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“好的……非常好，坏的……非常坏”保留原文刻意重复与鲜明对比；脚注保存末句原因与程度之间的语义张力。
