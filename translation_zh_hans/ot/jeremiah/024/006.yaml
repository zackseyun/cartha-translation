base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/024/006.yaml
  text: I will set my eyes on them for good[a], and I will bring them back to this land. I will build them up and not tear them down[c][b]; I will plant them and not uproot them.
translation:
  language: zh_hans
  text: 我要眷顾他们，使他们得福[a]；我要把他们带回这地[b]。我要建立他们，不拆毁他们；我要栽种他们，不拔除他们[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“为他们的益处。”
    reason: lexical_alternative
  - marker: b
    text: 或译：“我要使他们回到这地。”
    reason: lexical_alternative
  - marker: c
    text: 希伯来语使用两组成对的复兴比喻：“建立……不拆毁”和“栽种……不拔除”。
    reason: cross_reference
lexical_decisions:
- source_word: וְשַׂמְתִּי עֵינִי עֲלֵיהֶם
  choice: 我要眷顾他们
  rationale: 希伯来语直译为“我要把我的眼目放在他们身上”，表示带着关注和善意看顾。“眷顾”在现代中文中自然、庄重，并与后面的“使他们得福”相连。
- source_word: לְטוֹבָה
  choice: 使他们得福
  rationale: לְטוֹבָה 表示有利的目的或结果，可理解为“为着好处／使之得福”。正文采用自然中文明确其受益者，同时以脚注保留较贴近形式的表达。
- source_word: וַהֲשִׁבֹתִים עַל הָאָרֶץ הַזֹּאת
  choice: 我要把他们带回这地
  rationale: שׁוב 的使役式带直接宾语，意为“使他们回来”。本段语境是被掳者返回犹大，因此“带回这地”准确保留空间方向和具体土地背景。
- source_word: וּבְנִיתִים וְלֹא אֶהֱרֹס
  choice: 我要建立他们，不拆毁他们
  rationale: 保留 בנה／הרס 的成对比喻。“建立”可用于群体，较“建造他们”自然；“拆毁”则保留与建筑相关的反义意象。
- source_word: וּנְטַעְתִּים וְלֹא אֶתּוֹשׁ
  choice: 我要栽种他们，不拔除他们
  rationale: 保留栽种与拔除的农业比喻；“拔除”既表达连根移除，也符合现代庄重中文。
theological_decisions:
- issue: 审判与拯救语境中的复兴应许
  choice: 译为上帝善意眷顾被掳者、把他们带回这地，并以建立和栽种描写其复兴。
  alternative: 将本节泛化为一般兴盛的应许，或解释为纯属灵的复兴。
  rationale: 紧邻语境明确涉及被掳者和他们返回的土地。译文保留历史性、地域性的应许，同时不把比喻限定为任何后来的宗派性解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“眷顾”保留上帝主动而善意的关注；“建立／拆毁”和“栽种／拔除”保留原文平行结构与先知性意象。所有脚注标记均置于正文相应位置。
