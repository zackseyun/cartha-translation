  text: וְ/נָתַתִּי֩ לָ/הֶ֨ם לֵ֜ב לָ/דַ֣עַת אֹתִ֗/י כִּ֚י אֲנִ֣י יְהוָ֔ה וְ/הָיוּ לִ֣/י לְ/עָ֔ם וְ/אָ֣נֹכִ֔י אֶהְיֶ֥ה לָ/הֶ֖ם לֵ/אלֹהִ֑ים כִּֽי יָשֻׁ֥בוּ אֵלַ֖/י בְּ/כָל לִבָּֽ/ם־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/024/007.yaml
  text: And I will give them a heart to know me[a], that I am Yahweh; and they will be my people, and I will be their God[b], for they will return to me with all their heart.
translation:
  language: zh_hans
  text: 我要赐给他们一颗心，使他们认识我，知道我是耶和华；他们要作我的子民，我要作他们的神，因为他们必全心归向我。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “耶和华”音译原文的神名“יְהוָה”（YHWH）；有些译本依犹太诵读传统译作“主”。
    reason: 说明原文神名及常见的译名传统。
lexical_decisions:
- source_word: וְנָתַתִּי
  choice: 我要赐给
  rationale: 连词加完成式在先知应许中表达将来的行动；中文以“我要”自然呈现这一应许，“赐给”也符合赐予之物来自上帝的语境。
- source_word: לֵב לָדַעַת אֹתִי
  choice: 一颗认识我的心
  rationale: 保留“心”的希伯来比喻，所指包括人的认知、意志和内在生命；“认识我”也保留关系性和盟约性的含义，不缩减为单纯知道某项事实。
- source_word: כִּי אֲנִי יְהוָה
  choice: 使他们知道我是耶和华
  rationale: 这里的כִּי自然引出“认识”的内容。中文补出“使他们知道”，既明确句法关系，又保留“认识我”与“我是耶和华”两层相连的表达。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文读者熟悉的神圣名字音译，而不以普通称号取代原文专名。
- source_word: וְהָיוּ לִי לְעָם וְאָנֹכִי אֶהְיֶה לָהֶם לֵאלֹהִים
  choice: 他们要作我的子民，我要作他们的神
  rationale: 直接保留耶利米书中典型的双向盟约公式，并以自然、庄重的现代中文表达。
- source_word: כִּי יָשֻׁבוּ אֵלַי
  choice: 因为他们必……归向我
  rationale: 句末כִּי按其自然的因果功能译为“因为”；שׁוּב在此指重新转回上帝，“归向我”兼顾回转和关系恢复。
- source_word: בְּכָל לִבָּם
  choice: 全心
  rationale: 简洁自然地表达“以他们全部的心”，涵盖完整、专一的内在归向，而不限于情感层面。
theological_decisions:
- issue: “认识我”的性质
  choice: 保留“认识我”，并接“知道我是耶和华”
  alternative: 译作“承认我”或只译作“明白我是耶和华”
  rationale: 原文既有对上帝本人的认识，也有认识其身份的内容；当前译法不把这种认识缩减为理智认知，也不额外规定其系统神学含义。
- issue: 盟约公式
  choice: “他们要作我的子民，我要作他们的神”
  alternative: 意译为彼此归属或亲密关系
  rationale: 保留原文对称的盟约措辞，有助于维持耶利米书内部及圣经其他经文之间的呼应，而不添加经文未明说的教义解释。
- issue: 人的回转与上帝赐心之间的张力
  choice: 同时直陈上帝赐心和他们全心归向上帝
  alternative: 用解释性措辞明确其中的因果次序或责任关系
  rationale: 原文把两者并列于同一应许中；译文保留这种神圣作为与人的回转并存的张力，不替经文作进一步调和。
translation_notes:
  register: 采用庄重而通顺的现代标准普通话。“一颗认识我的心”有意保留原文的具体比喻；“作我的子民／作他们的神”保留经典盟约公式；避免古奥虚词和解释性神学扩写。
