base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/024/002.yaml
  text: One basket had very good figs[a], like first-ripe figs, and one basket had very bad figs[b], which could not be eaten because of their badness.
translation:
  language: zh_hans
  text: 一个筐里的无花果非常好[a]，像初熟的无花果；另一个筐里的无花果非常坏[b]，坏得不能吃。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “初熟的无花果”也可译作“早熟的无花果”或“头一茬无花果”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译：“因坏而不能吃。”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַדּוּד
  choice: 筐
  rationale: 该词在别处可指锅、罐等容器，但本节所盛的是无花果；结合异象语境，译作“筐”最自然。
- source_word: אֶחָד
  choice: 一个
  rationale: 按其数词本义翻译，分别修饰两个筐，保留“一筐……另一筐……”的对照。
- source_word: תְּאֵנִים
  choice: 无花果
  rationale: 直接译出异象中所指的果实。
- source_word: טֹבוֹת מְאֹד
  choice: 非常好
  rationale: 自然表达形容词与加强词的组合，并保留强烈的正面评价。
- source_word: כִּתְאֵנֵי הַבַּכֻּרוֹת
  choice: 像初熟的无花果
  rationale: “初熟”既表达时序上的最早成熟，也保留当季首批果实格外珍贵、上好的含义，不把这一层意思过度明说。
- source_word: רָעוֹת מְאֹד
  choice: 非常坏
  rationale: 与“非常好”形成鲜明而对称的反差；“坏”在现代汉语中可自然形容不能食用的果实。
- source_word: אֲשֶׁר לֹא תֵאָכַלְנָה מֵרֹעַ
  choice: 坏得不能吃
  rationale: 以自然、简洁的汉语表达原文“因坏而不能被吃”的结果兼原因关系，同时不擅自断定是腐烂或其他具体缺陷。
