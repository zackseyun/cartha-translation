base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/024/004.yaml
  text: And the word of Yahweh came to me[a], saying,
translation:
  language: zh_hans
  text: 耶和华的话临到我，说：
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: 临到
  rationale: 在先知领受启示的固定表达中，“临到”自然传达信息从上帝而来，同时保留庄重的经文语体。
- source_word: דְבַר
  choice: 话
  rationale: “话”贴近希伯来语的基本词义，也与先知书中反复出现的固定表达相协调；“信息”虽可理解，却会削弱词汇对应。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 这是现代中文圣经语境中对四字神名最通行、最易识别的音译，保留其作为专名的性质，而不以“主”这一称号替代。
- source_word: אֵלַי
  choice: 我
  rationale: 与“临到”搭配时，现代汉语通常直接说“临到我”，无需另译介词。
- source_word: לֵאמֹר
  choice: 说
  rationale: 自然引出下一节的直接话语，并准确表达希伯来语引语公式。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。正文采用中文读者最熟悉的专名形式“耶和华”，既不以称号“主”替代，也避免因较少通行的“雅威”造成不必要的阅读障碍。
translation_notes:
  register: 采用现代、庄重而通顺的先知书语体。“耶和华的话临到我”保留了中文圣经中成熟的启示公式；末尾用“说：”衔接下一节引语。
