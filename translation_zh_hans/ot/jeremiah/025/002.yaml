  text: 'which Jeremiah the prophet spoke to all the people of Judah and to all the inhabitants of Jerusalem[b][a], saying:'
translation:
  language: zh_hans
  text: 这话是先知耶利米对犹大的全体民众和耶路撒冷所有居民说的：
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲשֶׁר
  choice: 这话是……说的
  rationale: 用现代汉语的“是……的”结构承接上一节的“话”，自然地表达希伯来语关系从句，而不把本节误作独立新句。
- source_word: דִּבֶּר
  choice: 说的
  rationale: דבר的基本义是“说、讲”。与句末לֵאמֹר共同构成引出下文话语的结构，汉语用“说的：”即可自然表达，避免生硬重复。
- source_word: יִרְמְיָהוּ הַנָּבִיא
  choice: 先知耶利米
  rationale: 采用中文圣经传统且现代读者熟悉的人名译法；称号置于姓名前，符合自然汉语。
- source_word: עַל
  choice: 对
  rationale: 结合与后面וְאֶל的平行关系，这里最可能标明说话对象，因此译为“对”；同时以脚注保留“论到”或“针对”的可能性。
- source_word: כָּל עַם יְהוּדָה
  choice: 犹大众民
  rationale: עַם是集合名词；“犹大众民”简洁、庄重，并保留“全体”的范围。
- source_word: וְאֶל כָּל יֹשְׁבֵי יְרוּשָׁלִַם
  choice: 和耶路撒冷所有居民
  rationale: יֹשְׁבֵי指居住者；“所有居民”是准确、自然的现代汉语表达。
- source_word: לֵאמֹר
  choice: ：
  rationale: 该词是引出直接话语的常用公式。中文以冒号自然引出下一节的讲话内容，无需重复译作“说”。
