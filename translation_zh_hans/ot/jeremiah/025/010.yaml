id: JER.25.10
reference: Jeremiah 25:10
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/הַאֲבַדְתִּ֣י מֵ/הֶ֗ם ק֤וֹל שָׂשׂוֹן֙ וְ/ק֣וֹל שִׂמְחָ֔ה ק֥וֹל חָתָ֖ן וְ/ק֣וֹל כַּלָּ֑ה ק֥וֹל רֵחַ֖יִם וְ/א֥וֹר נֵֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/010.yaml
  text: And I will destroy from among them the sound of joy and the sound of gladness[a], the voice of the bridegroom and the voice of the bride[b], the sound of the millstones and the light of the lamp.
translation:
  language: zh_hans
  text: 我要使他们中间不再有欢喜和快乐的声音[a]，不再有新郎和新娘的声音[b]，不再有磨石的响声和灯的亮光。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我要使他们中间欢喜和快乐的声音消失。”原文动词是使役形式，意思是“使消失”或“使不复存在”。
    reason: lexical_alternative
  - marker: b
    text: “新郎和新娘的声音”指婚礼的欢庆，是正常群体生活的典型景象。
    reason: cultural_note
lexical_decisions:
- source_word: וְהַאֲבַדְתִּי
  choice: 我要使……不再有
  rationale: 该词是 אבד 的使役式，表示“使消失、使不复存在”。本节的宾语是各种声音和灯光，因此译作“使……不再有”既保留使役含义，也符合现代汉语表达。
- source_word: מֵהֶם
  choice: 他们中间
  rationale: 介词 מן 加代词表示从群体内部除去；“他们中间”自然地表达这些生活景象将从其群体中消失。
- source_word: קוֹל שָׂשׂוֹן וְקוֹל שִׂמְחָה
  choice: 欢喜和快乐的声音
  rationale: 两个近义词共同描写喜庆欢腾；中文采用“欢喜”和“快乐”保留并列结构，而共享“声音”以避免生硬重复。
- source_word: קוֹל חָתָן וְקוֹל כַּלָּה
  choice: 新郎和新娘的声音
  rationale: 这里指婚庆中人的声音；“新郎、新娘”是准确、自然的现代汉语称谓，并保留婚礼意象。
- source_word: קוֹל רֵחַיִם
  choice: 磨石的响声
  rationale: רֵחַיִם 指成对用于磨粮的磨石；“磨石的响声”保留日常劳作的具体声音。
- source_word: אוֹר נֵר
  choice: 灯的亮光
  rationale: 直译该构造短语，呈现有人居住、日常生活仍在延续的视觉景象。
theological_decisions:
- issue: 审判中日常生活景象的消失
  choice: 保留喜乐、婚庆、磨粮和灯光等具体意象，不将其概括为抽象的荒凉描述
  alternative: 译成“我要使他们一切欢乐和日常生活都止息”
  rationale: 希伯来文本借一连串声音和光景表现审判造成的荒废；保留这些意象可避免加入经文本身没有明说的解释。
- issue: וְהַאֲבַדְתִּי 的力度
  choice: 使……不再有
  alternative: 毁灭
  rationale: 动词本身有使之消失或灭亡的力度，但其直接宾语在本节是声音和亮光；“不再有”在中文中更自然，也不把这些非人格宾语过度实体化。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。以三次“不再有”承接原文反复出现的 קוֹל，保持列举的节奏，同时避免逐项重复“声音”造成的生硬；末项“灯的亮光”也纳入同一谓语结构。
