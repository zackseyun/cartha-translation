  yaml_path: translation/ot/jeremiah/025/037.yaml
  text: And the peaceful pastures are laid waste because of the burning anger of Yahweh[a].
translation:
  language: zh_hans
  text: 安宁的牧场都必荒凉，因耶和华的烈怒。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְנָדַמּוּ
  choice: 都荒废了
  rationale: דמם 的尼法勒形式本可表示“沉寂”，但以牧场为主语，并结合耶和华烈怒所造成的审判，语境指向荒凉、废弃的结果；“荒废了”既自然，也保留其结果状态。
- source_word: נְאוֹת הַשָּׁלוֹם
  choice: 安宁的牧场
  rationale: נְאוֹת 在此指牧场、草场；הַשָּׁלוֹם 修饰其平安稳妥的状态。“安宁的牧场”自然表达“平安之牧场”的含义。
- source_word: מִפְּנֵי
  choice: 因为
  rationale: 此处引出造成牧场荒废的原因，而非空间意义，故译为“因为”。
- source_word: חֲרוֹן אַף
  choice: 烈怒
  rationale: 该希伯来语惯用语表达炽烈、强烈的怒气；“烈怒”在现代汉语中庄重而自然，虽未逐字呈现热度意象，却准确传达其强度。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代简体中文圣经语境中最通行、最易识别的专名形式呈现四字神名，而不以“主”这一称号替代。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。中文正文保留专名而非代以“主”；“耶和华”是普通现代中文读者最熟悉的传统音译，“雅威”则更接近常见的学术拟音。
- issue: וְנָדַמּוּ 在审判语境中的含义
  choice: 荒废了
  alternative: 沉寂了
  rationale: 词根含有静默、止息之义，因此“沉寂”并非不可能；但牧场因神的烈怒而受影响的上下文更自然地描写其荒凉废弃。译文保留审判造成的结果，而不额外说明具体毁坏方式。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。“安宁的牧场”保留 נְאוֹת הַשָּׁלוֹם 的牧养意象；“都荒废了”使复数主语及结果状态在中文中清楚可感。原文无须另设脚注才能维持其主要语义张力。
