source:
  edition: WLC
  text: וְ/לֹֽא שְׁמַעְתֶּ֥ם אֵלַ֖/י נְאֻם יְהוָ֑ה לְמַ֧עַן הכעסו/ני בְּ/מַעֲשֵׂ֥ה יְדֵי/כֶ֖ם לְ/רַ֥ע לָ/כֶֽם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/007.yaml
  text: Yet you did not listen to me[a], declares Yahweh, to provoke me to anger by the work of your hands, to your own harm.
translation:
  language: zh_hans
  text: 可是你们没有听从我——雅威宣告——为要借着你们手所做的事惹我发怒，以致自己受害。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְלֹא
  choice: 可是……没有
  rationale: 承接上文多次劝告而未获回应的语境，以转折语气表达希伯来语连接词在此处的对比作用。
- source_word: שְׁמַעְתֶּם אֵלַי
  choice: 你们没有听从我
  rationale: שׁמע兼有听见、听取和服从之意；“听从”适合神借先知发言的语境，同时保留听取与顺服之间的关联。
- source_word: נְאֻם יְהוָה
  choice: 雅威宣告
  rationale: 以庄重而简洁的现代汉语表达先知书的宣告套语，并将神名 יְהוָה 音译为“雅威”。
- source_word: לְמַעַן הַכְעִסוּנִי
  choice: 反而……惹我发怒
  rationale: לְמַעַן 可表达目的或结果；“反而”自然连接拒绝听从与招惹神发怒的行为，不把目的、结果之间的张力过度限定。使役形式 הַכְעִסוּנִי 译为“惹我发怒”。
- source_word: בְּמַעֲשֵׂה יְדֵיכֶם
  choice: 用自己手所做的
  rationale: 保留“手所做的”这一希伯来语意象；在耶利米书中它常暗指偶像或相关行为，但原句没有明说偶像，因此正文不作窄化。
- source_word: לְרַע לָכֶם
  choice: 给自己招来祸患
  rationale: 表达恶果回到百姓自身的含义；“招来祸患”是自然汉语，也保留行为造成有害后果的力度。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；采用较贴近学界常见重构读音的“雅威”，不以称号代替专名。
- issue: 是否把“手所做的”明确译成偶像
  choice: 保留较宽泛的“自己手所做的”
  alternative: 你们亲手制造的偶像
  rationale: 上下文和耶利米书的惯用法可使人联想到偶像崇拜，但本节没有明确使用“偶像”一词；正文保留原文的含蓄性，并在脚注说明。
- issue: לְמַעַן 表示目的还是结果
  choice: 用“反而”保留关联，不明确限定为单一逻辑关系
  alternative: 为要／以致
  rationale: 该介词可表达目的或结果；此处若硬译为“为要”可能过分强调蓄意目的，硬译为“以致”又可能消解原文的责难力度。
translation_notes:
  register: 采用庄重、清晰的现代标准汉语。“雅威宣告”以破折号嵌入句中，保持先知宣告的节奏；正文保留“手所做的”这一具体意象，并以脚注提示其可能的偶像崇拜背景。
