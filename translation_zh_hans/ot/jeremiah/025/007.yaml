review_pass:
  verdict: revise
  source_fidelity: “反而”只表达转折，未呈现 לְמַעַן 所标示的目的／趋向关系；宜以“为要”保留原文带有责难意味的目的表达。末句应明确其害处归于听者自身。其余核心信息、神名及对“手所做的”的不窄化处理均可保留。
  naturalness: 原句整体庄重通顺，但“用自己手所做的”缺少中心名词，在现代汉语中略显悬置。改为“借着你们手所做的事”更完整自然，也保留原文惯用语的开放所指。
  terminology: “雅威”一致对应 יהוה，适合本项目既定译名；“惹我发怒”准确体现使役动词。正文不把“手所做的”限定为偶像，脚注仅说明该惯用语在本书中的常见语境，处理恰当。
  issues:
  - severity: medium
    issue: “反而”未译出 לְמַעַן 的逻辑功能。
    rationale: לְמַעַן 在此至少标示朝向“惹我发怒”的目的／结果性联系；单用“反而”改写为一般转折，遗漏了原文的连接关系。采用“为要”可保留其目的性，且不需要判定其是否为百姓完全自觉的心理意图。
  - severity: low
    issue: “用自己手所做的”名词短语不完整。
    rationale: 汉语中“所做的”通常需要由“事、东西、事物”等承接；补出“事”使句法自然，同时不把该短语解释为偶像。
  revised_text: 可是你们没有听从我——雅威宣告——为要借着你们手所做的事惹我发怒，以致自己受害。
  revised_footnotes:
