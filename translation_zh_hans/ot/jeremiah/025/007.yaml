revisions:
- from: 可是你们没有听从我——雅威宣告——反而用自己手所做的[a]惹我发怒，给自己招来祸患。
  to: 可是你们没有听从我——雅威宣告——为要借着你们手所做的事惹我发怒，以致自己受害。
  rationale: 修订补出 לְמַעַן 的目的性连接，并使“手所做的”在现代汉语中成为完整、但仍保持宽泛的名词短语。“以致自己受害”自然表达 לְרַע לָכֶם 的自我受害结果。保留“雅威”“惹我发怒”及脚注锚点 [a]。
