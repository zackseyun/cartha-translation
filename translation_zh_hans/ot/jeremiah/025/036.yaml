  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: ק֚וֹל צַעֲקַ֣ת הָֽ/רֹעִ֔ים וִֽ/ילְלַ֖ת אַדִּירֵ֣י הַ/צֹּ֑אן כִּֽי שֹׁדֵ֥ד יְהוָ֖ה אֶת מַרְעִיתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/036.yaml
  text: The sound of the cry of the shepherds[a], and the wailing of the leaders of the flock[b], for Yahweh is devastating their pasture.
translation:
  language: zh_hans
  text: 传来牧人的呼喊声和羊群中显贵者[a]的哀号，因为雅威正在毁坏他们的草场。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“羊群的首领”或“羊群中强壮的羊”。
    reason: lexical_alternative
  - marker: b
    text: 这里牧人、羊群和草场的意象，很可能隐喻统治者、受其治理的人以及他们所管辖之地。
    reason: cultural_note
lexical_decisions:
- source_word: קוֹל
  choice: 传来……声
  rationale: קוֹל指声音或响声；用“传来……声”自然引出下文的呼喊和哀号，同时保留听觉画面。
- source_word: צַעֲקַת
  choice: 呼喊声
  rationale: 该词表示因危难而发出的呼喊、哀求或呼号；这里与“哀号”并列，“呼喊声”清楚而自然。
- source_word: הָרֹעִים
  choice: 牧人
  rationale: 原文直指牧人，语境中很可能隐喻统治者或领袖；正文保留牧羊意象，不直接改写为解释。
- source_word: וִילְלַת
  choice: 哀号
  rationale: 该词表示因悲痛而高声哭号；“哀号”既传达强烈悲恸，也符合庄重的先知文体。
- source_word: אַדִּירֵי הַצֹּאן
  choice: 羊群中显贵者
  rationale: אַדִּירֵי可指有权势者、尊贵者或首领。“显贵者”保留其地位与权势意味，也避免把其功能过早限定为“领袖”。
- source_word: כִּי
  choice: 因为
  rationale: 此处引出牧人呼喊、显贵者哀号的原因，现代汉语用“因为”最清楚。
- source_word: שֹׁדֵד
  choice: 正在毁坏
  rationale: שׁדד的分词表达正在发生的蹂躏、摧毁；“正在毁坏”保留其进行中的力量，也不局限于掠夺财物。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以音译呈现四字神名，保留原文所用的专名，而不以称号替代。
- source_word: מַרְעִיתָם
  choice: 他们的草场
  rationale: מַרְעִית指牧场或放牧之地；“草场”简洁自然，并延续牧人、羊群的整体意象。
theological_decisions:
- issue: 如何译出神名 יְהוָה
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。采用“雅威”作为音译，保留其专名性质，不用称号取代。
- issue: 是否把牧人、羊群和草场直接解释为统治者、百姓与国土
  choice: 正文保留牧羊隐喻
  alternative: 解释性译作统治者、受其治理的人和他们的国土
  rationale: 上下文很可能具有政治隐喻，但本节原文本身始终维持牧羊图景。保留这一图景可避免把可能的所指写死，并保存先知话语的张力。
- issue: אַדִּירֵי הַצֹּאן 的身份
  choice: 羊群中显贵者
  alternative: 羊群的首领；羊群中强壮的羊
  rationale: אַדִּיר可表示尊贵、有权势或强大者；该短语既可能延续政治领袖的隐喻，也可能在羊群图景中指强壮者。正文采用较宽的“显贵者”，脚注保留其他可能。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“传来……声和……哀号”使希伯来语名词性表达在汉语中完整自然；全文保留牧羊意象，并用脚注说明其可能的政治隐喻。
