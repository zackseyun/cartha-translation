  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/הָֽיְתָה֙ כָּל הָ/אָ֣רֶץ הַ/זֹּ֔את לְ/חָרְבָּ֖ה לְ/שַׁמָּ֑ה וְ/עָ֨בְד֜וּ הַ/גּוֹיִ֥ם הָ/אֵ֛לֶּה אֶת מֶ֥לֶךְ בָּבֶ֖ל שִׁבְעִ֥ים שָׁנָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/011.yaml
  text: And all this land will become a ruin and a horror[a], and these nations will serve the king of Babylon for seventy years.
translation:
  language: zh_hans
  text: 这全地必变为废墟，令人惊骇[a]；这些国必服事巴比伦王七十年。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“成为令人惊骇之物”，强调这地遭毁坏后使看见的人震惊。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיְתָה
  choice: 必变为
  rationale: 连词加完成式在先知话语中表达将来结果；“必变为”既传达预告的确定性，也突出成为荒废状态的变化。
- source_word: כָּל הָאָרֶץ הַזֹּאת
  choice: 这全地
  rationale: 保留“全”和指示词“这”；此处 אֶרֶץ 指当前审判语境中的地域，而非整个世界。
- source_word: לְחָרְבָּה
  choice: 废墟
  rationale: 该名词表示遭毁坏后的荒废状态；“废墟”在现代汉语中具体、自然。
- source_word: לְשַׁמָּה
  choice: 令人惊骇
  rationale: שַׁמָּה 可指因毁灭景象而产生的惊骇，也可指成为令人惊骇之物；正文以自然汉语表达其所引起的反应，并用脚注保留另一种表述。
- source_word: וְעָבְדוּ
  choice: 必服事
  rationale: עבד 以君王为直接宾语时表示臣服并为其效力；“服事”较直接地保留政治隶属的含义。
- source_word: הַגּוֹיִם הָאֵלֶּה
  choice: 这些国
  rationale: 此处 גּוֹיִם 指受巴比伦支配的政治实体；“这些国”简洁并贴合上下文。
- source_word: אֶת מֶלֶךְ בָּבֶל
  choice: 巴比伦王
  rationale: 按现代汉语惯用结构直译该属格短语。
- source_word: שִׁבְעִים שָׁנָה
  choice: 七十年
  rationale: 直接保留原文的时间长度；汉语无须另加介词即可自然表示持续时间。
theological_decisions:
- issue: “地”的审判范围
  choice: 理解为当前预言所论及的地域
  alternative: 理解为整个大地，或作范围更广的夸张表达
  rationale: 紧邻语境涉及犹大及周边列国受巴比伦辖制；译作“地”而非“全世界”，避免扩大原文所指，同时“这全地”仍保留其范围强调。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“这全地”保留原文的指示和整体范围；“废墟，令人惊骇”以结果状态加反应呈现两个并列名词。“服事”保留古代列国臣属于君王的政治语感。
