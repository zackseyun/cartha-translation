revisions:
- from: 犹大王约西亚的儿子约雅敬第四年，也就是巴比伦王尼布甲尼撒元年，临到耶利米的话，是关于全体犹大百姓的[a]——
  to: 在犹大王约雅敬——约西亚的儿子——在位第四年，就是巴比伦王尼布甲尼撒在位第一年，有话临到耶利米，是关于全体犹大百姓的[a]。
  rationale: 修订将“犹大王”明确归于约雅敬，完整保留其为约西亚之子的谱系信息、两种纪年的对应关系，以及“关于／针对”这一介词歧义。删除句末破折号，按原文的节内句法以完整句收束。
