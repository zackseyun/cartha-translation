    issue: “犹大王”在草稿的句法位置上容易修饰“约西亚”。
    rationale: 希伯来文的“犹大王”紧随“约雅敬，约西亚的儿子”，明确约雅敬是犹大王。中文必须消除将约西亚误读为犹大王的歧义。
  - severity: low
