base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/001.yaml
  text: The word that came to Yirmeyahu concerning all the people of Judah in the fourth year of Jehoiakim son of Josiah[a], king of Judah—it was the first year of Nebuchadnezzar king of Babylon—
translation:
  language: zh_hans
  text: 在犹大王约雅敬——约西亚的儿子——在位第四年，就是巴比伦王尼布甲尼撒在位第一年，有话临到耶利米，是关于全体犹大百姓的[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“是针对全体犹大百姓的。”在先知书语境中，这个希伯来介词既可表示“关于”，也可表示“针对”。
    reason: alternative_reading
lexical_decisions:
- source_word: הַדָּבָר
  choice: 话
  rationale: 在先知书的题记中，דבר通常指来自上帝的启示性言语；译作“话”既保留传统先知用语，也不过度释义为“信息”。
- source_word: אֲשֶׁר הָיָה עַל יִרְמְיָהוּ
  choice: 临到耶利米的话
  rationale: היה על与先知连用时表示话语临到他；“临到”是自然、庄重且为现代中文读者熟悉的先知书表达。
- source_word: עַל כָּל עַם יְהוּדָה
  choice: 关于全体犹大百姓的
  rationale: 介词עַל在先知语境中既可表示“关于”，也可表示“攻击、针对”。正文采用语义较宽的“关于”，不提前判定这番话的敌对性质。
- source_word: בַּשָּׁנָה הָרְבִעִית לִיהוֹיָקִים
  choice: 约雅敬第四年
  rationale: 按现代中文王朝纪年习惯简洁表达希伯来文的在位年份公式。
- source_word: בֶּן יֹאשִׁיָּהוּ מֶלֶךְ יְהוּדָה
  choice: 犹大王约西亚的儿子
  rationale: 调整中文语序，使“犹大王”自然修饰约雅敬，同时保留其父为约西亚的谱系信息。
- source_word: הִיא הַשָּׁנָה הָרִאשֹׁנִית לִנְבוּכַדְרֶאצַּר
  choice: 也就是巴比伦王尼布甲尼撒元年
  rationale: היא回指前述年份并将两种纪年等同；“也就是”明确这种对应，“元年”是自然的中文君王纪年表达。
- source_word: מֶלֶךְ בָּבֶל
  choice: 巴比伦王
  rationale: 采用现代中文常见且简洁的王号格式。
theological_decisions:
- issue: עַל在“全体犹大百姓”之前的语力
  choice: 关于全体犹大百姓
  alternative: 针对全体犹大百姓／攻击全体犹大百姓
  rationale: 本章虽包含审判信息，但题记中的介词本身可以仅标明预言所涉及的对象。正文保留较宽泛的“关于”，并用脚注交代可能带有敌对意味的读法，以免消除原文张力。
translation_notes:
  register: 采用现代、庄重而通顺的简体中文。人名沿用中文圣经读者熟悉的通行译名。句末破折号保留本节在句法上引向下一节的未完结构；脚注标记紧随存在歧义的短语。
