source:
  edition: WLC
  text: כִּ֣י עָֽבְדוּ בָ֤/ם גַּם הֵ֨מָּה֙ גּוֹיִ֣ם רַבִּ֔ים וּ/מְלָכִ֖ים גְּדוֹלִ֑ים וְ/שִׁלַּמְתִּ֥י לָ/הֶ֛ם כְּ/פָעֳלָ֖/ם וּ/כְ/מַעֲשֵׂ֥ה יְדֵי/הֶֽם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/014.yaml
  text: For many nations and great kings will make even them serve[a], and I will repay them according to their work and according to the work of their hands.
translation:
  language: zh_hans
  text: 因为许多国和强大的君王也必役使他们[a]；我必照他们的作为，照他们手所做的报应他们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或较直译作：“因为许多国和强大的君王也曾服事他们（或：利用他们服役）。”希伯来语措辞凝练；按上下文，最可能是说巴比伦人自己也将被许多国和强大的君王役使。
    reason: 保留עָבְדוּ בָם在时态、介词关系和施受方向上的真实歧义。
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，说明巴比伦受罚的缘由；现代汉语用“因为”自然保留解释关系。
- source_word: עָבְדוּ בָם
  choice: 必使他们服役
  rationale: 希伯来语是完成式配合介词ב，措辞凝练且存在歧义；根据25:12—14审判巴比伦的语境，此处表达许多国和君王反过来使巴比伦人服役。以“必”体现预言语境中的将来结果，但用脚注保留较直译的可能。
- source_word: גַּם הֵמָּה
  choice: 也……他们
  rationale: 保留גם与强调代词所凸显的逆转：先前奴役别人的巴比伦人自己也要服役。
- source_word: גּוֹיִם רַבִּים
  choice: 许多国
  rationale: 此处是列国参与对巴比伦的审判，译作“国”符合政治语境。
- source_word: וּמְלָכִים גְּדוֹלִים
  choice: 和强大的君王
  rationale: גדולים字面为“大”，在修饰君王时主要指权势强盛；“强大的君王”在现代汉语中更清楚。
- source_word: וְשִׁלַּמְתִּי לָהֶם
  choice: 我必……报应他们
  rationale: Piel词形表达按行为偿还、施行报偿；“报应”保留司法审判色彩。
- source_word: כְּפָעֳלָם
  choice: 照他们所做的
  rationale: פעל可指工作或行为；译成“所做的”自然清楚，并与下句形成平行。
- source_word: וּכְמַעֲשֵׂה יְדֵיהֶם
  choice: 照他们双手所行的
  rationale: 保留“手”的具体意象，并以“所行的”表达其实际作为；“双手”是自然汉语，不意在强调恰为两只手。
theological_decisions:
- issue: 受列国役使的“他们”所指为何
  choice: 指巴比伦人或迦勒底人；他们也必被许多国和强大的君王役使
  alternative: 按希伯来语表面结构译为“许多国和强大的君王也曾服事他们／借他们服役”
  rationale: 25:12—14的直接语境宣告对巴比伦王及其土地的审判，故逆转性的理解最合上下文；然而原文Qal词形和介词结构本身较为压缩，故不把另一种句法可能从脚注中删去。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“服役”比“作奴仆”更贴近עבד的宽泛语义，也避免在原文未明确时过度强化为奴隶制度。“报应”用于神施行相称审判的语境，并以两个“照……”保留原文平行结构。
