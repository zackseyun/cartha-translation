source:
  edition: WLC
  text: הִנְ/נִ֣י שֹׁלֵ֡חַ וְ/לָקַחְתִּי֩ אֶת כָּל מִשְׁפְּח֨וֹת צָפ֜וֹן נְאֻם יְהוָ֗ה וְ/אֶל נְבֽוּכַדְרֶאצַּ֣ר מֶֽלֶךְ בָּבֶל֮ עַבְדִּ/י֒ וַ/הֲבִ֨אֹתִ֜י/ם עַל הָ/אָ֤רֶץ הַ/זֹּאת֙ וְ/עַל יֹ֣שְׁבֶ֔י/הָ וְ/עַ֛ל כָּל הַ/גּוֹיִ֥ם הָ/אֵ֖לֶּה סָבִ֑יב וְ/הַ֣חֲרַמְתִּ֔י/ם וְ/שַׂמְתִּי/ם֙ לְ/שַׁמָּ֣ה וְ/לִ/שְׁרֵקָ֔ה וּ/לְ/חָרְב֖וֹת עוֹלָֽם־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/009.yaml
  text: Look[a], I am sending for and taking all the clans of the north, declares Yahweh, and Nebuchadnezzar king of Babylon, my servant, and I will bring them against this land and against its inhabitants and against all these surrounding nations[b]. I will devote them to destruction and make them a horror, a hissing[c], and everlasting ruins.
translation:
  language: zh_hans
  text: 看哪[a]，我必召来北方的各族——这是雅威的宣告——也召来我的仆人巴比伦王尼布甲尼撒[b]。我要领他们来攻击这地和其中的居民，以及周围这一切国家。我要把他们尽行毁灭[c]，使他们成为令人惊骇、受人嗤笑的对象，并成为永远的废墟。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “看哪”用来引起注意，并引出庄严的宣告。
    reason: discourse_note
  - marker: b
    text: 这里称尼布甲尼撒为“我的仆人”，是说雅威使用他来成就自己的旨意，并不必然表示他是忠心敬拜雅威的人。
    reason: theological_note
  - marker: c
    text: “尽行毁灭”所译的希伯来语，也可表示把人或物置于禁毁之下，即指定其遭受毁灭。
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנְנִי
  choice: 看哪
  rationale: 这是引出庄严神谕的提示语；“看哪”既保留指示和唤起注意的力量，也符合中文经文的庄重语体。
- source_word: שֹׁלֵחַ וְלָקַחְתִּי
  choice: 我必召来
  rationale: 两个动词在此共同表达差遣人去召集、带来北方势力；中文合译为“召来”自然地传达这一语义，同时保留行动迫近且确定的先知性表达。
- source_word: מִשְׁפְּחוֹת צָפוֹן
  choice: 北方的各族
  rationale: מִשְׁפָּחוֹת 在此不是狭义家庭，而是有亲族或族群联系的群体；“各族”比“各家”更贴合军事政治语境，又不强加严格的部落制度含义。
- source_word: נְאֻם יְהוָה
  choice: 这是雅威的宣告
  rationale: 保留标准先知公式的权威语气，并按项目取向将神名 יְהוָה 音译为“雅威”。
- source_word: וְאֶל נְבוּכַדְרֶאצַּר מֶלֶךְ בָּבֶל עַבְדִּי
  choice: 也召来我的仆人巴比伦王尼布甲尼撒
  rationale: 原文介词结构略显突兀，可能把尼布甲尼撒列入所召来的力量；补出“召来”使中文关系清楚。“我的仆人”按原文保留，不额外说明其个人敬虔。
- source_word: וַהֲבִאֹתִים עַל
  choice: 我要领他们来攻击
  rationale: 在敌对军事行动的语境中，עַל 表示“攻击、敌对”；未来式表达随后将实施的审判。
- source_word: וְהַחֲרַמְתִּים
  choice: 我要把他们尽行毁灭
  rationale: חרם 的使役形表示将对象置于禁毁之下、献作毁灭；“尽行毁灭”在正文中清楚自然，其较专门的禁毁含义留在脚注说明。
- source_word: לְשַׁמָּה וְלִשְׁרֵקָה
  choice: 令人惊骇，受人嗤笑
  rationale: שַׁמָּה 可指荒凉及其引发的惊骇；שְׁרֵקָה 指旁观者以嘘声表达惊诧、鄙夷。采用效果性表达，使现代中文读者容易理解。
- source_word: לְחָרְבוֹת עוֹלָם
  choice: 永远沦为废墟
  rationale: 直陈长期、持续的荒废状态；“永远”保留 עוֹלָם 的强烈修辞，不擅自弱化其时间张力。
theological_decisions:
- issue: 尼布甲尼撒被称为“我的仆人”
  choice: 正文直译为“我的仆人”，脚注说明他是雅威施行旨意的工具
  alternative: 把“仆人”解释为他个人敬虔或忠于圣约
  rationale: 上下文强调雅威掌管列国，并使用巴比伦执行审判；称号必须保留，但不应加入原文没有明说的属灵认可。
- issue: חרם 的含义
  choice: 正文译“尽行毁灭”，脚注交代“置于禁毁之下”的专门含义
  alternative: 译为“奉献给毁灭”或“置于禁令之下”
  rationale: 中文“奉献给毁灭”生硬且容易误解，“置于禁令之下”又不透明；正文清楚表达毁灭结果，脚注保存其宗教和审判语义。
- issue: עוֹלָם 的时间力度
  choice: 译为“永远”
  alternative: 译为“长久”或“永久性的”
  rationale: 保留原文强烈而未加限定的持续性表达，不在翻译中预先解决其修辞或时间范围问题。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。以破折号处理插入的神谕公式，避免超长句关系含混；保留“看哪”“雅威”“我的仆人”等具有经文和神学分量的措辞，同时用“受人嗤笑”等自然表达传达古代旁观者发嘘声的意象。
