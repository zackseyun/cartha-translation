source:
  edition: WLC
  text: וְ/אַתָּה֙ תִּנָּבֵ֣א אֲלֵי/הֶ֔ם אֵ֥ת כָּל הַ/דְּבָרִ֖ים הָ/אֵ֑לֶּה וְ/אָמַרְתָּ֣ אֲלֵי/הֶ֗ם יְהוָ֞ה מִ/מָּר֤וֹם יִשְׁאָג֙ וּ/מִ/מְּע֤וֹן קָדְשׁ/וֹ֙ יִתֵּ֣ן קוֹל֔/וֹ שָׁאֹ֤ג יִשְׁאַג֙ עַל נָוֵ֔/הוּ הֵידָד֙ כְּ/דֹרְכִ֣ים יַֽעֲנֶ֔ה אֶ֥ל כָּל יֹשְׁבֵ֖י הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/030.yaml
  text: 'And you, you shall prophesy all these words against them, and you shall say to them: The LORD will roar from on high, and from his holy dwelling he will give his voice; he will surely roar against his pasture. He will answer with a shout like those who tread grapes, against all the inhabitants of the earth.'
translation:
  language: zh_hans
  text: '“至于你，要向他们预言这一切攻击他们的话，对他们说：


    ‘耶和华必从高处吼叫，

    从他的圣所发声；

    他必向自己的草场大声吼叫；

    他必像踹葡萄的人一样高声呼喊，

    向地上一切居民发出回应。[a]’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “发出回应”直译为“回答／应声”。此处与“像踹葡萄的人一样高声呼喊”相连，也可理解为发出踹葡萄者的号子般呼声；原文的确切句法关系和语义带有张力。
    reason: 保留 יַעֲנֶה 的“回答、应声”基本义，同时说明它在 הֵידָד 和踹葡萄者意象中的呼喊含义，避免正文误译为“攻击”。
lexical_decisions:
- source_word: תִּנָּבֵא אֲלֵיהֶם
  choice: 向他们预言
  rationale: 介词 אֶל 在此按受话对象处理；结合后文“对他们说”，译为“向他们预言”自然且不削弱审判信息的指向。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的专名形式，明确对应四字神名。
- source_word: מִמָּרוֹם
  choice: 从高处
  rationale: 保留空间意象及其崇高意味，不额外解释为“天上”。
- source_word: יִתֵּן קוֹלוֹ
  choice: 发声
  rationale: 希伯来语直译为“发出他的声音”；中文以“发声”简洁表达，同时与平行句“吼叫”协调。
- source_word: נָוֵהוּ
  choice: 自己的草场
  rationale: נָוֶה 可指居所或牧场；此处选择“草场”，保留牧养领地的意象，并以“自己的”表达后缀。
- source_word: הֵידָד
  choice: 高声呼喊
  rationale: 该词指劳作或争战中的呼声；下句明确以踹葡萄者作比，译为“高声呼喊”较自然。
- source_word: יַעֲנֶה
  choice: 呼喊
  rationale: 词形通常为“回答、应声”，但与 הֵידָד 连用时可表达发出呼声；正文按语境顺译，歧义置于脚注。
- source_word: הָאָרֶץ
  choice: 地上
  rationale: 可指“地”或“全地”；与“所有居民”连用时译作“地上”，不预先限定为犹大地或全世界。
theological_decisions:
- issue: “他的草场”所指为何
  choice: 保留“自己的草场”
  alternative: 译为“他的居所”或明确解释为“他的百姓之地”
  rationale: 原词既可指居所，也可指牧场；不在正文中把意象直接等同于圣殿、犹大或全地，以保留文本张力。
- issue: 审判范围“地上一切居民”
  choice: 不限定其地理范围
  alternative: “全世界所有居民”或“这地所有居民”
  rationale: הָאָרֶץ 的范围可由更大语境判定；中文“地上”保存原文可能指全地或特定土地的开放性。
- issue: 神发声的拟兽意象
  choice: 直译为“吼叫”
  alternative: 弱化为“呼喊”或“发怒”
  rationale: 保留原文将耶和华描绘为狮子般吼叫的强烈诗性与审判意象。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。以诗行呈现神谕中的平行结构；“大声吼叫”“高声呼喊”保留原文密集的声音意象。正文避免古奥的“发其声”，也不把“草场”“地上”等开放意象过度释义。
