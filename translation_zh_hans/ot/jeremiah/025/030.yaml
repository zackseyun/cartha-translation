  rationale: 修订明确首句审判预言“攻击他们”的方向，并将末句恢复为耶和华向全地居民发出带有踹葡萄者号子意象的回应／呼喊，而非另行“攻击”居民。其余译法保留原稿的诗性、现代普通话表达及开放的意象范围。
