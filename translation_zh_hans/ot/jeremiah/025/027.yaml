id: JER.25.27
reference: Jeremiah 25:27
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/אָמַרְתָּ֣ אֲלֵי/הֶ֡ם כֹּֽה אָמַר֩ יְהוָ֨ה צְבָא֜וֹת אֱלֹהֵ֣י יִשְׂרָאֵ֗ל שְׁת֤וּ וְ/שִׁכְרוּ֙ וּ/קְי֔וּ וְ/נִפְל֖וּ וְ/לֹ֣א תָק֑וּמוּ מִ/פְּנֵ֣י הַ/חֶ֔רֶב אֲשֶׁ֛ר אָנֹכִ֥י שֹׁלֵ֖חַ בֵּינֵי/כֶֽםס־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/027.yaml
  text: 'You shall say to them[a], ‘Thus says Yahweh of hosts, the God of Israel: Drink and become drunk, and vomit, and fall, and do not rise, because of the sword that I am sending among you.’'
translation:
  language: zh_hans
  text: 你要对他们说：“万军之雅威、以色列的上帝如此说：你们要喝，喝醉，呕吐[a]，倒下，不得起来，因为我要使刀剑临到你们中间。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“吐出来”。
    reason: 原词罕见，可用较口语而具动作感的表达来翻译。
lexical_decisions:
- source_word: וְאָמַרְתָּ אֲלֵיהֶם
  choice: 你要对他们说
  rationale: 以现代汉语自然表达先知话语中带指令意味的连接词加完成式，同时保留差遣口吻。
- source_word: כֹּה אָמַר
  choice: 如此说
  rationale: 保留希伯来先知宣告的固定使者公式，在中文圣经语体中庄重而清楚。
- source_word: יְהוָה צְבָאוֹת
  choice: 万军之雅威
  rationale: “雅威”音译四字神名；“万军”保留该称号所指受上帝统领的众军，而不将范围限于地上的军队。
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: 以色列的上帝
  rationale: 直接表达原文的属格结构。
- source_word: שְׁתוּ וְשִׁכְרוּ
  choice: 你们要喝，喝醉
  rationale: 两个复数命令式依次译出；补出“你们”使中文命令对象明确。
- source_word: וּקְיוּ
  choice: 呕吐
  rationale: 该罕见动词指因醉酒而呕吐；“呕吐”是准确、通行且不过分修饰的现代汉语。
- source_word: וְנִפְלוּ וְלֹא תָקוּמוּ
  choice: 倒下，不得起来
  rationale: 保留“倒下—不起来”的连续动作和审判意味，不擅自加入“永远”或“再也”等强化成分。
- source_word: מִפְּנֵי הַחֶרֶב
  choice: 因为……刀剑
  rationale: 此处介词短语说明他们倒下而不能起来的原因；汉语用“因为”清楚传达这种关系。
- source_word: אֲשֶׁר אָנֹכִי שֹׁלֵחַ בֵּינֵיכֶם
  choice: 我要使刀剑临到你们中间
  rationale: “临到你们中间”保留 בֵּינֵיכֶם 的空间意象；“使刀剑临到”比机械直译“发送刀剑”更符合现代汉语，同时不改译为较强的“攻击你们”。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用以色列上帝的专名；正文以“雅威”音译，避免用称号替代专名。
- issue: 饮酒、醉倒与刀剑之间的意象关系
  choice: 按原文保留一连串命令，并以“因为”连接刀剑所造成的结局
  alternative: 将全部命令解释性改写为预言或比喻说明
  rationale: 上下文借忿怒之杯描绘审判，但本节本身采用直接命令。译文不将命令消解为说明，也不额外明说原文此处未重复出现的“忿怒之杯”。
translation_notes:
  register: 采用庄重而易懂的现代标准普通话。“不得起来”保留命令形式及审判张力；没有加上原文未明说的“再也”。脚注标记紧随其实际说明的“呕吐”之后。
