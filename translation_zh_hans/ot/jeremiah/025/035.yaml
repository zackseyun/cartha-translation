  text: וְ/אָבַ֥ד מָנ֖וֹס מִן הָֽ/רֹעִ֑ים וּ/פְלֵיטָ֖ה מֵ/אַדִּירֵ֥י הַ/צֹּֽאן־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/035.yaml
  text: Escape has perished from the shepherds[b][a], and deliverance from the lords of the flock.
translation:
  language: zh_hans
  text: 牧人的逃路断绝了[a][b]，羊群中的显贵者也无处逃脱。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “逃路”也可译为“避难所”或“逃脱的机会”。
    reason: lexical_alternative
  - marker: b
    text: “牧人”和“羊群中的显贵者”都是先知性的比喻，在此语境中指百姓的领袖或显要者。
    reason: cultural_note
lexical_decisions:
- source_word: וְאָבַד
  choice: 无路可
  rationale: אָבַד在此表示逃生的可能已经消失；与מָנוֹס合译为“无路可逃”，自然地传达彻底失去逃路的意思。
- source_word: מָנוֹס
  choice: 逃
  rationale: 此名词在审判语境中指逃跑或逃生的途径；“无路可逃”符合现代汉语表达。
- source_word: מִן הָרֹעִים
  choice: 牧人
  rationale: 保留希伯来文的牧养隐喻；מן表达逃路从他们那里消失，汉语通过“牧人无路可逃”自然呈现。
- source_word: וּפְלֵיטָה
  choice: 也无法逃脱
  rationale: פְלֵיטָה可指逃脱、获救或生还；此处与מָנוֹס平行，以“无法逃脱”表达没有脱身的可能。
- source_word: מֵאַדִּירֵי הַצֹּאן
  choice: 羊群中的尊贵者
  rationale: אַדִּירֵי表示有权势、尊贵或显赫的人；“尊贵者”保留身份色彩，而“羊群中的”维持原文的牧群意象。
theological_decisions:
- issue: 是否把牧人和羊群中的尊贵者直接解释为政治领袖
  choice: 正文保留“牧人”和“羊群”的牧养隐喻
  alternative: 正文直译其所指为“领袖”或“统治者”
  rationale: 原文刻意维持牧人—羊群意象；保留这一意象可避免把解释直接写入正文，并由脚注说明其语境含义。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。两个并行分句都明确表达逃生途径的消失；保留牧人、羊群的意象，并以“尊贵者”呈现אַדִּירֵי的地位和权势含义。
