id: JER.25.33
reference: Jeremiah 25:33
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/הָי֞וּ חַֽלְלֵ֤י יְהוָה֙ בַּ/יּ֣וֹם הַ/ה֔וּא מִ/קְצֵ֥ה הָ/אָ֖רֶץ וְ/עַד קְצֵ֣ה הָ/אָ֑רֶץ לֹ֣א יִסָּפְד֗וּ וְ/לֹ֤א יֵאָֽסְפוּ֙ וְ/לֹ֣א יִקָּבֵ֔רוּ לְ/דֹ֛מֶן עַל פְּנֵ֥י הָ/אֲדָמָ֖ה יִֽהְיֽוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/033.yaml
  text: And the slain of Yahweh on that day will be from one end of the earth even to the other end of the earth[a]. They will not be mourned, or gathered, or buried[c][b]; they will become dung on the surface of the ground.
translation:
  language: zh_hans
  text: 那一日，从地的一端直到地的另一端，都有雅威所杀的人[a]。无人为他们哀悼，也无人收殓他们、埋葬他们；他们必成为地面上的粪土[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“雅威的被杀者。”原文的附属结构也可较紧凑地这样表达。
    reason: alternative_reading
  - marker: b
    text: 原文直译为：“他们必成为地面上的粪土。”这里描写尸首无人收殓、埋葬，像粪土般被弃置。
    reason: lexical_alternative
lexical_decisions:
- source_word: חַלְלֵי יְהוָה
  choice: 雅威所杀的人
  rationale: חַלְלֵי 是“被杀者”的复数附属形式，与雅威之名连用，在本节审判语境中自然表达雅威是击杀者；中文用主动关系比“雅威的被杀者”更清楚。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以音译呈现四字神名，保留其作为专名的性质。
- source_word: בַּיּוֹם הַהוּא
  choice: 那一日
  rationale: 符合现代中文的先知性表达，简洁庄重。
- source_word: מִקְצֵה הָאָרֶץ וְעַד קְצֵה הָאָרֶץ
  choice: 从地这头直到地那头
  rationale: 保留原文首尾相对的范围表达及“直到”的强调；אֶרֶץ 可指“地”或“土地”，正文用较开放的“地”保留语义张力。
- source_word: לֹא יִסָּפְדוּ
  choice: 无人为他们哀悼
  rationale: 被动形式指死者得不到哀悼；改用自然中文的无人句式准确传达被动含义。
- source_word: וְלֹא יֵאָסְפוּ
  choice: 也无人收殓他们
  rationale: 此处指尸体无人聚拢、收拾；“收殓”在与埋葬并列时自然且具体，但不把它等同于下句的埋葬。
- source_word: וְלֹא יִקָּבֵרוּ
  choice: 埋葬他们
  rationale: 直接表达 קבר 被动式的含义，并与前面的“无人”共辖。
- source_word: לְדֹמֶן עַל־פְּנֵי הָאֲדָמָה יִהְיוּ
  choice: 他们必像粪土一样留在地面上
  rationale: לְדֹמֶן 表达其沦为粪土般弃置、受辱的状态；“留在”结合无人收殓埋葬的语境，避免中文误解为尸体在物质上变成粪土。
- source_word: עַל־פְּנֵי הָאֲדָמָה
  choice: 在地面上
  rationale: 自然对应字面“在土地表面上”，保留尸体暴露于地表的具体图景。
theological_decisions:
- issue: אֶרֶץ 的范围
  choice: 地
  alternative: 大地；土地
  rationale: 上下文涉及列国和广泛审判，但 אֶרֶץ 本身可指土地或全地；“地”在中文正文中既自然，也不必过度限定其地理范围。
- issue: חַלְלֵי יְהוָה 中附属结构的施事关系
  choice: 雅威所杀的人
  alternative: 雅威的被杀者
  rationale: 审判语境支持把雅威理解为击杀的施事者；此译法明确而不增添原文没有的机制说明。
- issue: לְדֹמֶן ... יִהְיוּ 是等同、结果还是比拟
  choice: 必像粪土一样留在地面上
  alternative: 必成为地面上的粪土
  rationale: 原文没有明示比喻词，但中文若直译“成为粪土”容易被理解为实体转化；正文传达尸首如粪土般被弃置和羞辱的实际语用意义，脚注说明更直译的可能。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“那一日”保留先知宣告的语体；“哀悼—收殓—埋葬”形成清楚递进。正文中的所有脚注标记均已出现。
