source:
  edition: WLC
  text: לֵ/אמֹ֗ר שֽׁוּבוּ נָ֞א אִ֣ישׁ מִ/דַּרְכּ֤/וֹ הָֽ/רָעָה֙ וּ/מֵ/רֹ֣עַ מַעַלְלֵי/כֶ֔ם וּ/שְׁבוּ֙ עַל הָ֣/אֲדָמָ֔ה אֲשֶׁ֨ר נָתַ֧ן יְהוָ֛ה לָ/כֶ֖ם וְ/לַ/אֲבֽוֹתֵי/כֶ֑ם לְ/מִן עוֹלָ֖ם וְ/עַד עוֹלָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/005.yaml
  text: saying[a], ‘Please turn back, each man from his evil way and from the evil of your deeds[b], and dwell in the land that Yahweh gave to you and to your fathers from of old and forever.’
translation:
  language: zh_hans
  text: 说：“请[a]你们各人回头，离开自己的恶道，也离开你们行为中的恶；要住在耶和华赐给你们和你们祖先的土地上，从亘古直到永远。[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “请”所译的希伯来语小词表示恳请或劝请，也可译作“求你们”。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“从久远之时直到永远”，是跨越过去与未来的时间表达，用来强调耶和华赐地的长久性。
    reason: cultural_note
lexical_decisions:
- source_word: לֵאמֹר
  choice: 说
  rationale: 这是希伯来语中引出随后话语内容的常用形式；现代汉语以“说”自然承接上文。
- source_word: שׁוּבוּ נָא
  choice: 请你们……回头
  rationale: שׁוּב在先知劝人悔改的语境中指转回、回头；נָא表示恳请或劝请，并非时间副词“现在”。
- source_word: אִישׁ מִדַּרְכּוֹ הָרָעָה
  choice: 各人……离开自己的恶道
  rationale: אִישׁ在复数命令后具有逐一分配的意思，即“各人”；“恶道”保留דֶּרֶךְ所表达的人生道路或行为方式这一比喻。
- source_word: וּמֵרֹעַ מַעַלְלֵיכֶם
  choice: 也离开你们行为中的恶
  rationale: 原文直指“你们行为的恶”，既包括行为本身，也强调其中的邪恶性质；同时保留原文从单数“自己的”转为复数“你们”的变化。
- source_word: וּשְׁבוּ עַל הָאֲדָמָה
  choice: 要住在……土地上
  rationale: יָשַׁב在土地语境中表示定居、居住；“土地上”自然表达עַל与אֲדָמָה的搭配，并指向上帝所赐之地。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代简体中文圣经语境中辨识度最高的专名形式，明确译出四字神名，而不以称号替代。
- source_word: לָכֶם וְלַאֲבוֹתֵיכֶם
  choice: 给你们和你们祖先
  rationale: “祖先”在现代汉语中自然表达אָבוֹת的历代先辈含义，同时保留赐地对象包括当代听众与先辈。
- source_word: לְמִן עוֹלָם וְעַד עוֹלָם
  choice: 从亘古直到永远
  rationale: 保留原文分别朝向久远过去与无尽未来的时间跨度，不把其简化为单纯的“永远”。
theological_decisions:
- issue: 四字神名יהוה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 两者都是对神名的处理；正文采用中文读者最熟悉且具有专名功能的“耶和华”，不以“主”这一称号取代原文神名。
- issue: 居住命令与回转之间的逻辑关系
  choice: 以并列命令“要住在”表达
  alternative: 译作结果或应许性的“就可以住在”
  rationale: 原文使用并列的祈使形式，没有明说条件—结果关系；正文因此保留其语法张力，不额外补入“就可以”。
- issue: 赐地期限的时间表达
  choice: 从亘古直到永远
  alternative: 永远
  rationale: 原文同时具有向过去和向未来展开的表达；即使与历史中的赐地事件形成张力，也不在正文中将其消解。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“回头”“恶道”保留先知话语中的悔改意象；句法尽量清楚，同时保留原文单数“自己的”与复数“你们”的转换，以及“从亘古直到永远”的时间张力。
