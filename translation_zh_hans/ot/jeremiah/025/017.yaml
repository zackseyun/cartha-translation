  text: וָ/אֶקַּ֥ח אֶת הַ/כּ֖וֹס מִ/יַּ֣ד יְהוָ֑ה וָֽ/אַשְׁקֶה֙ אֶת כָּל הַ/גּוֹיִ֔ם אֲשֶׁר שְׁלָחַ֥/נִי יְהוָ֖ה אֲלֵי/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/017.yaml
  text: So I took the cup from the hand of Yahweh and made all the nations to whom Yahweh had sent me drink[a][b].
translation:
  language: zh_hans
  text: 于是，我从雅威手中接过那杯，叫雅威差遣我到他们那里去的列国都喝下了。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “从雅威手中”是按希伯来文直译，表示这杯直接从他领受。
    reason: cultural_note
  - marker: b
    text: “叫……喝下”也可译作“使……喝”或“给……喝”；原文动词为使役形式，即“使其喝下”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶקַּח
  choice: 于是，我……接过
  rationale: 该词是לקח的Qal连续式，推进叙事中的下一步行动。“于是”自然体现承接关系；“接过”比单纯“拿”更清楚地表达从对方手中领受。
- source_word: הַכּוֹס
  choice: 那杯
  rationale: 保留定冠词所指的特定杯，即上文已经提到的杯，但不在正文中额外补入“愤怒”等解释。
- source_word: מִיַּד יְהוָה
  choice: 从雅威手中
  rationale: 保留希伯来文“从……手中”的鲜明意象，并将יהוה译作其专名“雅威”。
- source_word: וָאַשְׁקֶה
  choice: 叫……都喝了
  rationale: 该词是שׁקה的Hiphil使役式；“叫……喝”自然地保留“使其喝下”的使役含义。
- source_word: כָּל הַגּוֹיִם
  choice: 列国都
  rationale: גּוֹיִם在本段指先知信息所针对的各国；“列国”庄重、简洁，并由“都”表达כָּל的全称范围。
- source_word: אֲשֶׁר שְׁלָחַנִי יְהוָה אֲלֵיהֶם
  choice: 雅威差我去见的
  rationale: 关系从句修饰“列国”。אֲלֵיהֶם字面为“到他们那里”；“差我去见的”符合现代汉语，也避免误读为雅威把列国差来。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名。采用“雅威”保留其专名性质，而不以称号代替；本节两处保持一致。
- issue: 饮杯动作是象征叙事还是实际行动
  choice: 按原文直接陈述“叫……喝了”
  alternative: 解释为“向列国宣告审判”或“在异象中让列国喝”
  rationale: 本节没有明说动作实现的方式。译文保留先知叙述中的象征张力，不擅自说明这是异象、预言宣告或实际递杯。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“于是”承接上文，“列国”符合先知书语域。脚注标记均置于正文相关句末；正文不增添原文未明说的“愤怒之杯”或动作方式。
