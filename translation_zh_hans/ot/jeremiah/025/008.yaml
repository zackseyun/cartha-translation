  text: לָ/כֵ֕ן כֹּ֥ה אָמַ֖ר יְהוָ֣ה צְבָא֑וֹת יַ֕עַן אֲשֶׁ֥ר לֹֽא שְׁמַעְתֶּ֖ם אֶת דְּבָרָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/008.yaml
  text: 'Therefore[a], thus says Yahweh of hosts: Because you have not listened to my words[b],'
translation:
  language: zh_hans
  text: 因此，万军之雅威[a]这样说：因为你们没有听我的话[b]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “雅威”是希伯来语神名YHWH的音译，传统上也译作“耶和华”。
    reason: lexical_alternative
  - marker: b
    text: 或译“没有听从我的话”。希伯来语动词既可表示听、听取，也可含有顺从的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: 因此
  rationale: 承接上文的指控，引出随之而来的审判宣告；“因此”自然且保留明确的因果推进。
- source_word: כֹּה אָמַר
  choice: 如此说
  rationale: 保留先知传信公式的庄重语气，也符合现代汉语表达。
- source_word: יְהוָה צְבָאוֹת
  choice: 万军之雅威
  rationale: “雅威”音译上帝的专名；“万军”保留צְבָאוֹת所指受其统领的众军之广泛含义，并沿用庄重、易懂的汉语称号。
- source_word: יַעַן אֲשֶׁר
  choice: 因为
  rationale: 简明表达此复合连词引出审判理由的因果功能。
- source_word: לֹא שְׁמַעְתֶּם
  choice: 没有听
  rationale: “不听某人的话”在现代汉语中既可指未听取，也常暗含不听从，因而能较好保留希伯来语שׁמע在听与顺从之间的语义张力。
- source_word: אֶת דְּבָרָי
  choice: 我的话
  rationale: 直接对应דְּבָרָי，表达自然，并避免不必要的释义扩展。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；正文采用较贴近通常学术重构读音Yahweh的现代汉语音译“雅威”，不以称号替代专名，同时用脚注注明汉语传统译名。
- issue: שׁמע在此处是“听”还是“听从”
  choice: 听
  alternative: 听从
  rationale: “没有听我的话”在汉语里自然包含拒绝听取乃至不服从的意味，能保留原词的多义性；脚注明确另一可行译法。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。保留原文因果从句尚待下文完成的开放结构，以逗号结尾，不擅自补出审判内容；不加引号，以避免在单节排版中人为封闭尚未完成的宣告。
