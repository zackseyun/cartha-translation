base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/013.yaml
  text: And I will bring upon that land all my words that I have spoken against it—all that is written in this book[b][a], which Jeremiah prophesied against all the nations.
translation:
  language: zh_hans
  text: 我要使我曾针对那地所说的一切话，都临到那地；就是这书卷[a]上所写的一切——耶利米针对列国所说的预言[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “书卷”也可译为“书”。希伯来语词可指卷轴或书。
    reason: lexical_alternative
  - marker: b
    text: “针对列国”也可译为“论到列国”；在审判的语境中，也可理解为“攻击列国”。
    reason: alternative_reading
lexical_decisions:
- source_word: וְהֵבֵאתִי עַל הָאָרֶץ הַהִיא
  choice: 我要使……都临到那地
  rationale: הֵבֵאתִי是בוא的使役式，在本语境中指耶和华使已经宣告的审判临到该地；汉语用“使……临到”自然表达使役和审判降临之意。
- source_word: אֵת כָּל דְּבָרַי
  choice: 我……的一切话
  rationale: 保留דְּבָרַי的基本意义“我的话”，维系神先前所说之话与其实现之间的联系。
- source_word: אֲשֶׁר דִּבַּרְתִּי עָלֶיהָ
  choice: 我所说攻击那地的
  rationale: עַל在审判语境中具有敌对或司法意味；“攻击那地”比单纯“论到那地”更符合近文。
- source_word: אֵת כָּל הַכָּתוּב
  choice: 所写的一切
  rationale: 表达该结构所强调的全部书面内容，并保持现代汉语流畅。
- source_word: בַּסֵּפֶר הַזֶּה
  choice: 这书卷上
  rationale: סֵפֶר可指书或卷轴；“书卷”既符合古代书写载体，也适合圣经文本语域。
- source_word: אֲשֶׁר נִבָּא יִרְמְיָהוּ
  choice: 耶利米……所说的预言
  rationale: נִבָּא意为“说预言”；采用名词化表达，使整句在汉语中清楚自然。
- source_word: עַל כָּל הַגּוֹיִם
  choice: 针对列国
  rationale: עַל与נבא连用可表示“针对、论到”，上下文偏向审判；“针对”保留其方向性，却不把其语义完全限缩为敌对。
theological_decisions:
- issue: 末句预言与列国的关系
  choice: 针对列国
  alternative: 攻击列国／论到列国
  rationale: עַל可泛指“关于”，在审判预言的上下文中又带有敌对意味。“针对”兼顾两者，并以脚注说明可译作更广义的“论到”。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。以“临到”保留先知审判话语的传统力度；用“书卷”提示古代文本形态；末句用“针对”保留希伯来介词在“论到”与“攻击”之间的语义张力。
