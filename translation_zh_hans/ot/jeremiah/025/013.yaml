  rationale: 修订仅澄清首个关系从句的中文句法：以“曾针对那地所说的一切话”准确对应“我所说攻击那地的一切话”，并自然表达原文完成式所指的先前宣告。其余结构保留：神使这些话临到那地，书卷所写内容与耶利米关于／针对列国的预言形成同位说明。
