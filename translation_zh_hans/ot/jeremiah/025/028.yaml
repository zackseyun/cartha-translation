  text: וְ/הָיָ֗ה כִּ֧י יְמָאֲנ֛וּ לָ/קַֽחַת הַ/כּ֥וֹס מִ/יָּדְ/ךָ֖ לִ/שְׁתּ֑וֹת וְ/אָמַרְתָּ֣ אֲלֵי/הֶ֗ם כֹּ֥ה אָמַ֛ר יְהוָ֥ה צְבָא֖וֹת שָׁת֥וֹ תִשְׁתּֽוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/028.yaml
  text: 'And if they refuse to take the cup from your hand to drink[a], then you shall say to them, ‘Thus says Yahweh of hosts: You shall surely drink.’'
translation:
  language: zh_hans
  text: 如果他们不肯从你手中接过这杯来喝，你就要对他们说：‘万军之雅威如此说：你们一定要喝。[a]’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你们必定要喝。”希伯来文以不定式绝对形和限定动词连用，表示强调。
    reason: 说明שָׁתוֹ תִשְׁתּוּ的强调结构，并保留“必定要喝”这一侧重确定性的译法。
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: 如果
  rationale: 该结构在此引出将来可能出现的条件情形；现代汉语用“如果”自然保留条件意味。
- source_word: יְמָאֲנוּ
  choice: 他们不肯
  rationale: מאן 的加强词干表达拒绝、不愿；“不肯”准确传达主动抗拒的语气。
- source_word: לָקַחַת הַכּוֹס מִיָּדְךָ לִשְׁתּוֹת
  choice: 从你手中接过这杯来喝
  rationale: “接过”符合从某人手中取物的汉语表达，同时保留杯的比喻，不把它解释性扩写为忿怒之杯。
- source_word: וְאָמַרְתָּ אֲלֵיהֶם
  choice: 你就要对他们说
  rationale: 承接条件句，并体现先知受命传话的指令语气。
- source_word: כֹּה אָמַר
  choice: 如此说
  rationale: 保留希伯来先知信息中固定的使者宣告格式，庄重而简明。
- source_word: יְהוָה צְבָאוֹת
  choice: 万军之耶和华
  rationale: “耶和华”直接呈现神名；“万军之”透明保留 צבאות 的称号意义。
- source_word: שָׁתוֹ תִשְׁתּוּ
  choice: 你们非喝不可
  rationale: 不定式绝对形与限定动词连用表示强烈强调；“非……不可”在现代汉语中同时传达不可抗拒的要求和必然性。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 采用现代简体中文圣经读者最熟悉的专名形式，同时不以“主”替代原文中的专名。
- issue: 是否在正文中明说杯代表神的忿怒
  choice: 仅译作“这杯”
  alternative: “这忿怒之杯”
  rationale: 本节原文本身只说“杯”；保留比喻及其上下文张力，避免把解释加入正文。
- issue: 末句强调结构的语气
  choice: 你们非喝不可
  alternative: 你们必定要喝
  rationale: 原文的强调结构兼具强制和确定意味；所选译法不将其单纯化为命令或预言。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“这杯”承接具体语境；“非喝不可”有力度但并不文言化。脚注标记置于所解释的末句之后。
