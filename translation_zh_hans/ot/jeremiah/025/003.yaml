id: JER.25.3
reference: Jeremiah 25:3
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: מִן שְׁלֹ֣שׁ עֶשְׂרֵ֣ה שָׁנָ֡ה לְ/יֹאשִׁיָּ֣הוּ בֶן אָמוֹן֩ מֶ֨לֶךְ יְהוּדָ֜ה וְ/עַ֣ד הַ/יּ֣וֹם הַ/זֶּ֗ה זֶ֚ה שָׁלֹ֤שׁ וְ/עֶשְׂרִים֙ שָׁנָ֔ה הָיָ֥ה דְבַר יְהוָ֖ה אֵלָ֑/י וָ/אֲדַבֵּ֧ר אֲלֵי/כֶ֛ם אַשְׁכֵּ֥ים וְ/דַבֵּ֖ר וְ/לֹ֥א שְׁמַעְתֶּֽם־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/003.yaml
  text: From the thirteenth year of Josiah son of Amon[a], king of Judah, even to this day, these twenty-three years, the word of Yahweh has come to me, and I have spoken to you, rising early and speaking, but you have not listened.
translation:
  language: zh_hans
  text: 从犹大王亚们的儿子约西亚在位第十三年，直到今日，这二十三年来，雅威的话临到我；我早早起来，不断向你们说话[a]，你们却没有听。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “早早起来，不断……说话”对应希伯来语“早起并说话”的惯用表达，强调殷勤、持续而反复地行动，不一定专指清晨说话。
    reason: 说明原文惯用语的字面意象及其反复、坚持的语义。
lexical_decisions:
- source_word: מִן ... וְעַד
  choice: 从……直到
  rationale: 明确表达由起点延续至“今日”的时间跨度，符合现代汉语习惯。
- source_word: שְׁלֹשׁ עֶשְׂרֵה שָׁנָה לְיֹאשִׁיָּהוּ
  choice: 约西亚在位第十三年
  rationale: 这里指君王执政的纪年，而不是十三年的时长；补出“在位”可避免歧义。
- source_word: לְיֹאשִׁיָּהוּ בֶן אָמוֹן מֶלֶךְ יְהוּדָה
  choice: 犹大王亚们的儿子约西亚
  rationale: 保留王位、父子关系和人名，同时按自然汉语调整语序。
- source_word: זֶה שָׁלֹשׁ וְעֶשְׂרִים שָׁנָה
  choice: 这二十三年来
  rationale: 保留指示词的作用，并自然表达从过去延续到当前的时段。
- source_word: הָיָה דְבַר יְהוָה אֵלָי
  choice: 雅威的话一直临到我
  rationale: “临到”保留先知领受神谕的表达；“一直”由上下文所明示的二十三年时段支持，传达持续、反复发生的意义。
- source_word: יְהוָה
  choice: 雅威
  rationale: 采用神圣四字名的普通话音译，而不以称号替代其专名性质。
- source_word: וָאֲדַבֵּר אֲלֵיכֶם
  choice: 我也……向你们传讲
  rationale: 在先知话语语境中，“传讲”比单纯的“说”更自然，同时仍保持其向听众宣告信息的基本意义。
- source_word: אַשְׁכֵּים וְדַבֵּר
  choice: 早早起来，一再向你们传讲
  rationale: 兼顾原文“早起”的具体意象及该结构所表达的殷勤、反复行动；脚注说明其惯用含义。
- source_word: וְלֹא שְׁמַעְתֶּם
  choice: 你们却没有听
  rationale: 保留“听”的感官意象及其可能包含的听从含义，不直接窄化为“服从”。
theological_decisions:
- issue: 神圣四字名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用以色列之神的专名；音译“雅威”保留专名性质，避免以称号“主”取代。
- issue: אַשְׁכֵּים וְדַבֵּר 的先知性惯用表达
  choice: 正文保留“早早起来”的意象，并以“一再”显明反复性
  alternative: 只译作“一再传讲”；完全直译为“早起并说话”
  rationale: 原文既有早起的鲜明意象，又以惯用方式强调持续而殷勤的宣告；正文与脚注结合，可兼顾形式和实际语义。
- issue: שׁמע 在责备语境中的含义
  choice: 没有听
  alternative: 没有听从；没有服从
  rationale: “听”在此可能包含顺从之意，但原词的听觉意象仍然真实存在，因此不在正文中把含义限定为服从。
translation_notes:
  register: 采用庄重而易懂的现代标准普通话。“在位第十三年”明确君王纪年；分号呈现时间陈述与先知宣讲之间的结构关系。人名采用中文圣经通行形式，神名采用音译“雅威”。
