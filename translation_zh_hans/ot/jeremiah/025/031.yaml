id: JER.25.31
reference: Jeremiah 25:31
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: בָּ֤א שָׁאוֹן֙ עַד קְצֵ֣ה הָ/אָ֔רֶץ כִּ֣י רִ֤יב לַֽ/יהוָה֙ בַּ/גּוֹיִ֔ם נִשְׁפָּ֥ט ה֖וּא לְ/כָל בָּשָׂ֑ר הָ/רְשָׁעִ֛ים נְתָנָ֥/ם לַ/חֶ֖רֶב נְאֻם יְהוָֽה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/031.yaml
  text: An uproar has come to the end of the earth[a], for Yahweh has a case against the nations; he is entering into judgment with all flesh. He has given the wicked to the sword[d][c][b], declares Yahweh.
translation:
  language: zh_hans
  text: 喧嚣已达地极[a]，因为耶和华要控告列国；他要审判一切有血肉的。他已把恶人交给刀剑[b]。这是耶和华的宣告。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “喧嚣”也可译作“轰响”或“骚乱”。
    reason: lexical_alternative
  - marker: b
    text: “交给刀剑”意为交付他们，使他们死于战争；也可译作“把他们交在刀剑之下”。
    reason: idiom_explanation
lexical_decisions:
- source_word: שָׁאוֹן
  choice: 喧嚣
  rationale: 表达审判临到时嘈杂、混乱而震耳的声势；比泛指的“声音”更贴合语境，也保留“轰响、骚乱”的语义空间。
- source_word: בָּא
  choice: 已经传到
  rationale: 将完成式理解为先知话语中生动而确定的事件；“已经”保留其完成感，“传到”与声音扩及地极的中文表达自然衔接。
- source_word: עַד קְצֵה הָאָרֶץ
  choice: 传到地极
  rationale: “地极”简洁保留单数 קְצֵה 的形式，并在现代中文圣经语体中自然表达大地最远之处。
- source_word: רִיב לַיהוָה בַּגּוֹיִם
  choice: 耶和华要控告列国
  rationale: רִיב 在此具有司法争讼色彩；“控告”明确呈现耶和华对列国提出案件，同时避免引入更专门的宗派性“圣约诉讼”术语。
- source_word: נִשְׁפָּט הוּא לְכָל בָּשָׂר
  choice: 他要审判凡有血肉的
  rationale: נשפט 在司法语境中可指进入审理或争讼；中文“审判”自然保留法庭意象。“凡有血肉的”保留希伯来语意象及其普世范围。
- source_word: הָרְשָׁעִים נְתָנָם לַחֶרֶב
  choice: 他已把恶人交给刀剑
  rationale: “交给刀剑”保留原文战争与死亡的具象表达；“已”反映完成式在先知宣告中的确定性。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代简体中文读者熟悉的神名译写，而非以称号替代专名。
- source_word: נְאֻם יְהוָה
  choice: 这是耶和华的宣告
  rationale: 以庄重而清楚的现代中文再现先知书常见的权威宣告公式。
theological_decisions:
- issue: 司法意象中耶和华的角色
  choice: 以“控告列国；他要审判”并列呈现
  alternative: “耶和华与列国争辩；他要同凡有血肉的争讼”
  rationale: 原文 ריב 与 נשפט 都带司法色彩，并形成耶和华既提出案件又施行审判的张力；译文不将两词弱化为一般冲突，也不以系统神学消解这种张力。
- issue: כָל בָּשָׂר 的范围与意象
  choice: 凡有血肉的
  alternative: 全人类
  rationale: 保留希伯来语“所有肉身”的具象说法，同时在中文中用“凡……的”清楚表达其普遍范围，不把对象收窄为某一民族或群体。
- issue: 先知完成式所表达的确定性
  choice: “已经传到”“已把”
  alternative: “将传到”“将把”
  rationale: 完成式可在先知话语中把将临之事描绘为已经成就，从而突出其确定性；译文保留这一修辞力度，而不把它单纯处理为一般将来时。
translation_notes:
  register: 采用庄重、清晰的现代标准普通话。“喧嚣”“控告”“审判”“宣告”维持先知审判话语的力度；保留“地极”“凡有血肉的”“交给刀剑”等源文意象，同时通过句法使普通读者易于理解。所有脚注标记均已置于正文相应位置。
