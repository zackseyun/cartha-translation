base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/015.yaml
  text: 'For thus said Yahweh[a], the God of Israel, to me: “Take from my hand this cup of the wine of wrath, and make all the nations to whom I am sending you drink it.”'
translation:
  language: zh_hans
  text: 因为耶和华——以色列的上帝——这样对我说：“你要从我手中接过这杯震怒之酒[a]，使我差你前往的列国都喝这杯酒。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“烈怒之酒”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי כֹה אָמַר
  choice: 因为……这样说
  rationale: 保留כִּי与上文相连的因果或解释作用，并以现代汉语常用的神谕引介句“这样说”表达כֹה אָמַר。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代简体中文圣经传统中最通行、辨识度最高的神名译法。
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: 以色列的上帝
  rationale: 直接保留原文的属格关系，语言自然清楚。
- source_word: קַח ... מִיָּדִי
  choice: 从我手中接过
  rationale: “接过”自然表达从说话者手中取得某物，同时保留“手”的具体意象。
- source_word: כּוֹס הַיַּיִן הַחֵמָה הַזֹּאת
  choice: 这杯震怒之酒
  rationale: 保留杯、酒和神圣震怒交织的审判隐喻；“震怒”具有庄重的先知文学语体。
- source_word: וְהִשְׁקִיתָה אֹתוֹ אֶת כָּל הַגּוֹיִם
  choice: 让……列国都喝下去
  rationale: 表达使役动词的因果力度；“喝下去”在现代汉语中自然，并凸显必须饮尽审判之杯的图像。
- source_word: אֲשֶׁר אָנֹכִי שֹׁלֵחַ אוֹתְךָ אֲלֵיהֶם
  choice: 我差你去见的
  rationale: 自然表达上帝差遣耶利米前往各国的关系从句，不把差遣误解为仅仅把信息送达。
theological_decisions:
- issue: חֵמָה所表达的神圣审判
  choice: 震怒
  alternative: 烈怒；愤怒
  rationale: “震怒”保留上帝施行审判的强烈程度和庄重语感，却不把原文简化为普通人的情绪失控。
- issue: 耶利米使列国喝酒的使役意象
  choice: 让……都喝下去
  alternative: 给……喝；使……喝
  rationale: 保留先知在异象性行动中执行上帝审判命令的张力，不额外解释这是纯象征行为还是具体行动。
translation_notes:
  register: 采用现代、庄重而清楚的普通话书面语。“耶和华以色列的上帝”依原文同位结构排列；整句维持先知神谕的郑重语气，同时避免文言化。
