revisions:
- from: 因为耶和华以色列的上帝对我这样说：“你要从我手中接过这杯震怒之酒，让我差你去见的列国都喝下去。”
  to: 因为耶和华——以色列的上帝——这样对我说：“你要从我手中接过这杯震怒之酒[a]，使我差你前往的列国都喝这杯酒。”
  rationale: 修订同位语标点以符合现代汉语表达；将“去见”改为“前往”，准确表达上帝差遣耶利米到列国那里去；将使役命令调整为“使……都喝这杯酒”，保留原文的使役关系和所饮对象。
