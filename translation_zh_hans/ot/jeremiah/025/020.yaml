- from: 以及所有混杂的族群[a]、乌斯地的所有王、非利士人之地的所有王[b]，就是亚实基伦、迦萨、以革伦，以及亚实突的余民[c]；
  to: 以及所有混杂的民众[a]、乌斯地所有的王，以及非利士人之地所有的王[b]，又有亚实基伦、迦萨、以革伦和亚实突的残余[c]；
  rationale: 修订保留原文列举式语序和先知书的庄重语体，同时将非利士诸城恢复为与“诸王”并列的受列举项目。对“混杂的人”和“亚实突的残余”采用不预断其具体族群或所指范围的措辞；脚注继续说明可行替代译法。
