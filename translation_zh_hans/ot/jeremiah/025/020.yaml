base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/020.yaml
  text: and all the mixed people[a], and all the kings of the land of Uz, and all the kings of the land of the Philistines—Ashkelon, Gaza, Ekron, and the remnant of Ashdod[c][b];
translation:
  language: zh_hans
  text: 以及所有混杂的民众[a]、乌斯地所有的王，以及非利士人之地所有的王[b]，又有亚实基伦、迦萨、以革伦和亚实突的残余[c]；
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“混杂的民众”；可能指由不同外来人口组成的群体，而不是某个特定民族。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译“非利士人之地”；也可译“非利士地”。
    reason: lexical_alternative
  - marker: c
    text: 或译“亚实突所剩下的”或“亚实突的幸存者”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעֶרֶב
  choice: 混杂的族群
  rationale: 此处最自然地指由不同族裔构成的群体，而非明确的单一民族；“族群”在现代汉语中自然，也保留原词所指对象的不确定性。
- source_word: מַלְכֵי אֶרֶץ הָעוּץ
  choice: 乌斯地的所有王
  rationale: אֶרֶץ在这一列国名单中取地理政治意义“地”；“乌斯”按专名音译。
- source_word: מַלְכֵי אֶרֶץ פְּלִשְׁתִּים
  choice: 非利士人之地的所有王
  rationale: 贴近希伯来文“非利士人之地的王”，保留民族与地域相结合的表达，而不直接归并为专名“非利士地”。
- source_word: אַשְׁקְלוֹן
  choice: 亚实基伦
  rationale: 采用现代中文圣经读者熟悉的传统地名译法。
- source_word: עַזָּה
  choice: 迦萨
  rationale: 采用现代中文圣经读者熟悉的传统地名译法。
- source_word: עֶקְרוֹן
  choice: 以革伦
  rationale: 采用现代中文圣经读者熟悉的传统地名译法。
- source_word: שְׁאֵרִית אַשְׁדּוֹד
  choice: 亚实突的余民
  rationale: שְׁאֵרִית表示剩余者或残余；“余民”保留先知文学语体，但脚注说明也可能泛指亚实突所剩下的一切。
