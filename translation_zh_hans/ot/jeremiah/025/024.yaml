  text: and all the kings of Arabia[a], and all the kings of the mixed peoples who dwell in the wilderness[b];
translation:
  language: zh_hans
  text: 以及阿拉伯的众王，和住在旷野的所有混杂群体的众王[a][b]；
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “混杂群体”也可译为“混杂的一群人”或“混杂民众”。希伯来语此词与前面的“阿拉伯”不同。
    reason: lexical_alternative
  - marker: b
    text: “旷野”也可译作“沙漠”。
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְכֵי
  choice: ……的众王／……之王
  rationale: 这是“王”的复数构造形式，支配随后各群体名称；按现代汉语语序分别译为“阿拉伯的众王”和“各混杂族群之王”。
- source_word: עֲרָב
  choice: 阿拉伯
  rationale: 此处是专名，指阿拉伯地区或其诸族；在列举列国君王的语境中译作“阿拉伯”，并与下一词 הָעֶרֶב 明确区分。
- source_word: הָעֶרֶב
  choice: 各混杂族群
  rationale: 该词不同于前面的 עֲרָב，较自然地指成分混杂的人群；“各混杂族群”既保留两词的词义区别，也能自然承接后面的复数分词。
- source_word: הַשֹּׁכְנִים
  choice: 住在
  rationale: 这是 ישׁב 的阳性复数主动分词，在此修饰“混杂族群”；“住在”清楚自然。
- source_word: בַּמִּדְבָּר
  choice: 在旷野中
  rationale: מִדְבָּר 可指旷野或沙漠地带；“旷野”保留庄重的圣经语体，同时为现代读者所理解。
- source_word: וְאֵת ... וְאֵת
  choice: 以及……和……
  rationale: 两个带连词的直接宾语标记延续前文清单；汉语不译宾语标记，以“以及……和……”表达并列递加关系。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而自然的列举语体。“各混杂族群之王”略带正式色彩，以清楚表达复数群体及其诸王，并保留原文相邻两个近形词之间的区别。
