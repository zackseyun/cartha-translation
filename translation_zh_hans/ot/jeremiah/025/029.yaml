id: JER.25.29
reference: Jeremiah 25:29
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כִּי֩ הִנֵּ֨ה בָ/עִ֜יר אֲשֶׁ֧ר נִֽקְרָא שְׁמִ֣/י עָלֶ֗י/הָ אָֽנֹכִי֙ מֵחֵ֣ל לְ/הָרַ֔ע וְ/אַתֶּ֖ם הִנָּקֵ֣ה תִנָּק֑וּ לֹ֣א תִנָּק֔וּ כִּ֣י חֶ֗רֶב אֲנִ֤י קֹרֵא֙ עַל כָּל יֹשְׁבֵ֣י הָ/אָ֔רֶץ נְאֻ֖ם יְהוָ֥ה צְבָאֽוֹת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/029.yaml
  text: For behold[a], in the city over which my name is called, I am beginning to bring harm, and shall you indeed go unpunished? You shall not go unpunished, for I am calling for a sword against all the inhabitants of the earth[b], declares Yahweh of hosts.
translation:
  language: zh_hans
  text: 看哪，我既然在那座归于我名下的城中[a]开始降灾，你们岂能全然免受惩罚呢？你们必不能免受惩罚，因为我要召唤刀剑，攻击地上一切居民[b]。这是万军之耶和华的宣告。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在那座称为我名下的城中。”希伯来文直译为“在那座我的名被称在其上的城中”，表示这城带有他的名、归属于他。
    reason: lexical_alternative
  - marker: b
    text: “地上”也可译为“这片土地上”。希伯来词אֶרֶץ既可指某一片土地，也可指大地或全地。
    reason: alternative_reading
lexical_decisions:
- source_word: בָעִיר אֲשֶׁר נִקְרָא שְׁמִי עָלֶיהָ
  choice: 在那座归于我名下的城里
  rationale: 希伯来习语直译为“我的名被称在其上的城”，表示这城带有耶和华的名、归属于他。正文采用自然而仍保留归属含义的中文，脚注说明较直译的表达。
- source_word: מֵחֵל לְהָרַע
  choice: 尚且开始降下灾祸
  rationale: 该结构表示动作开始；הֵרַע在审判语境中指带来祸患，而非施行道德上的恶。“降下灾祸”符合现代汉语，也保留审判含义。加入“尚且”使本句与随后针对听众的反问关系清楚。
- source_word: הִנָּקֵה תִנָּקוּ
  choice: 你们难道真能免受惩罚吗
  rationale: 不定式绝对形与限定动词连用，加强反问语气；נקה的Niphal形式在此指不受惩罚、被免罪。“真能”体现强调。
- source_word: לֹא תִנָּקוּ
  choice: 你们绝不能免受惩罚
  rationale: 与前一反问保持同一措辞，并用“绝”传达断然否定。
- source_word: חֶרֶב אֲנִי קֹרֵא
  choice: 我要召唤刀剑
  rationale: 保留将刀剑人格化为受召执行审判者的意象，不将其泛化为“战争”。
- source_word: כָּל יֹשְׁבֵי הָאָרֶץ
  choice: 地上所有的居民
  rationale: אֶרֶץ既可指“地”也可指“全地/大地”。上下文涉及列国，正文采用较广的“地上”，同时以脚注保留地域性的“这片土地”这一可能。
- source_word: נְאֻם יְהוָה צְבָאוֹת
  choice: 这是万军之耶和华的宣告
  rationale: נְאֻם是先知性宣告公式；“万军之耶和华”保留神名和צְבָאוֹת这一称号的传统、庄重表达。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 正文以现代中文读者最熟悉且能作为专名辨识的“耶和华”音译四字神名；不以“主”替代，从而保留原文使用圣约之名这一事实。
- issue: לְהָרַע是否表示上帝施行道德上的恶
  choice: 降下灾祸
  alternative: 行恶；带来祸患
  rationale: 在此审判语境中，该动词指造成灾祸或伤害，并不必然带有道德邪恶的判断；译文避免将现代中文“作恶”的含义强加给原文。
- issue: אֶרֶץ的范围
  choice: 地上
  alternative: 这片土地上
  rationale: 本章的审判语境延伸到列国，较广义的理解更合适；但该词本身可指特定土地，因此用脚注保留歧义。
translation_notes:
  register: 采用现代、庄重而通顺的普通话书面语。“看哪”保留先知宣告的警示语气；反问与紧接的否定保持原文力度。脚注标记[a]、[b]均已置于正文对应位置。
