  to: 就是耶路撒冷、犹大的众城、她的君王和官长，使他们成为废墟、令人惊骇的对象、受人讥诮的对象[a]和受咒诅的对象，正如今日所见。
  rationale: 修订保持原文的名单次序及四项灾祸结果，并以平行的“对象”结构清楚表达这些地点和人物成为旁观者惊骇、讥诮和咒诅的对象。脚注移至所释词语之后，且将“咒诅”改为不预设其仅为言语形式的表达。
