base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/018.yaml
  text: Jerusalem[a], the cities of Judah, her kings, and her officials—to make them a ruin, a horror, a hissing, and a curse[b], as it is this day.
translation:
  language: zh_hans
  text: 就是耶路撒冷、犹大的众城、她的君王和官长，使他们成为废墟、令人惊骇的对象、受人讥诮的对象[a]和受咒诅的对象，正如今日所见。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “受人讥诮的对象”直译可作“成为嘘声”或“成为口哨声”，指旁观者看见荒废之地时发出讥诮的声音。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְרוּשָׁלִַם
  choice: 耶路撒冷
  rationale: 采用现代中文圣经及一般社会通行的标准地名译法。
- source_word: עָרֵי יְהוּדָה
  choice: 犹大的各城
  rationale: 自然表达希伯来语属格结构，并表明所指为犹大境内诸城。
- source_word: מְלָכֶיהָ
  choice: 她的君王
  rationale: 保留原文阴性单数后缀所体现的集体人格化；“君王”也适合可能涉及历任或多位统治者的语境。
- source_word: שָׂרֶיהָ
  choice: 她的官长
  rationale: 该词可指首领、官员或统治者；“官长”在此政治性列举中准确而庄重，也不误解为王室子嗣。
- source_word: לָתֵת אֹתָם
  choice: 使他们沦为
  rationale: נתן与连续的לְ名词在此表达造成的结果；“使……沦为”自然传达毁灭性的转变。
- source_word: לְחָרְבָּה
  choice: 废墟
  rationale: 具体、清楚地表现遭毁坏后的荒废状态。
- source_word: לְשַׁמָּה
  choice: 令人惊骇
  rationale: 该词既可指荒凉，也着重旁观者面对灾毁时的震惊与恐惧；此译保留反应层面的语义。
- source_word: לִשְׁרֵקָה
  choice: 受人嗤笑
  rationale: 原词指旁观者对废墟发出的嘘声或口哨声；正文译出其公开讥诮的功能，脚注保留具体声音意象。
- source_word: וְלִקְלָלָה
  choice: 成为咒诅的话
  rationale: 表达该地成为人们咒诅时援引的反面范例，较单说“成为咒诅”更符合现代汉语。
- source_word: כַּיּוֹם הַזֶּה
  choice: 正如今日一样
  rationale: 保留说话者以当下可见状况印证灾祸的指示意味。
