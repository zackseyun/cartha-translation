    issue: 脚注锚点置于“咒诅的话”之后，但注释实际解释“受人嗤笑／嘘声”。
    rationale: 脚注必须紧邻其所解释的“受人讥诮的对象”，以免读者误以为它说明“咒诅”。
  - severity: medium
    issue: “成为咒诅的话”过度解释וְלִקְלָלָה。
    rationale: 原文指成为咒诅或受咒诅的对象；虽可包含人以其为咒诅范例的含义，却不直接说“话”。
  - severity: low
    issue: “正如今日一样”表达略不自然。
    rationale: “正如今日所见”更符合现代书面普通话，并传达“如今日的情形所显示”的惯用语义。
