  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/אַל תֵּלְכ֗וּ אַֽחֲרֵי֙ אֱלֹהִ֣ים אֲחֵרִ֔ים לְ/עָבְדָ֖/ם וּ/לְ/הִשְׁתַּחֲוֺ֣ת לָ/הֶ֑ם וְ/לֹֽא תַכְעִ֤יסוּ אוֹתִ/י֙ בְּ/מַעֲשֵׂ֣ה יְדֵי/כֶ֔ם וְ/לֹ֥א אָרַ֖ע לָ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/006.yaml
  text: And do not go after other gods to serve them and to bow down to them[a], and do not provoke me to anger by the work of your hands[b], and I will do you no harm.
translation:
  language: zh_hans
  text: 不可跟随别神，侍奉它们，向它们下拜；也不可用你们手所造的惹我发怒；我也不降灾祸给你们。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我也不加害于你们。”
    reason: 原词可泛指伤害，也可在审判语境中指降下灾祸；连接词本身未明确标示条件、目的或结果关系。
lexical_decisions:
- source_word: תֵּלְכוּ אַחֲרֵי
  choice: 跟随
  rationale: 这一希伯来语习语字面为“走在……后面”，在此表示追随、效忠；现代汉语用“跟随”自然且准确。
- source_word: אֱלֹהִים אֲחֵרִים
  choice: 别神
  rationale: 指耶和华以外的神明；“别神”简洁直接，也符合庄重的经文语体，不额外加入“外邦”的含义。
- source_word: לְעָבְדָם
  choice: 侍奉它们
  rationale: עבד 的核心意义是服事；用于神明时含敬拜意味，但译作“侍奉”可保留其与下一动词“下拜”的区别。
- source_word: וּלְהִשְׁתַּחֲוֺת לָהֶם
  choice: 向它们下拜
  rationale: 该动词指俯伏、下拜，以身体动作表达尊崇；此译法避免与前面的“侍奉”合并。
- source_word: תַכְעִיסוּ אֹתִי
  choice: 惹我发怒
  rationale: 使役形式表示使某人恼怒；“惹我发怒”在现代汉语中自然，并保留其使役意义。
- source_word: בְּמַעֲשֵׂה יְדֵיכֶם
  choice: 用你们手所造的
  rationale: 原文直译为“借着你们双手的作品”，语境暗指人手所造的偶像；此译法保留含蓄表达，又比“你们手的工作”更自然。
- source_word: וְלֹא אָרַע לָכֶם
  choice: 我就不降灾祸给你们
  rationale: רעע 的使役式可指使受害、降祸；这里是上帝应许不使灾祸临到听命之民。“降灾祸”贴合先知语境，也避免“作恶”可能造成的道德误解。
theological_decisions:
- issue: 末句与前述禁令之间的逻辑关系
  choice: 这样，我就不降灾祸给你们
  alternative: 我也不加害于你们／好使我不降祸给你们
  rationale: 希伯来文以简单连接词接否定式第一人称动词，既可视为随禁令而来的保证，也可理解为目的或结果。正文以“这样……就……”清楚表达语境中的结果关系，但脚注保留较贴近形式的译法。
- issue: “你们手所造的”是否明说为偶像
  choice: 不在正文中补出“偶像”
  alternative: 用你们亲手造的偶像
  rationale: 上下文强烈暗示偶像，但原文只说“你们手的作品”。正文保留原文的含蓄性，避免把语境推论写成明说。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“别神、侍奉、下拜、降灾祸”保留先知劝诫的经文语感；以分号呈现两个并列禁令，再用“这样”自然连接末句的应许。
