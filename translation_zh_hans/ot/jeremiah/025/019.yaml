  yaml_path: translation/ot/jeremiah/025/019.yaml
  text: Pharaoh king of Egypt, his servants, his officials, and all his people;
translation:
  language: zh_hans
  text: 埃及王法老、他的臣仆、官长和全体百姓；
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פַּרְעֹה מֶלֶךְ מִצְרַיִם
  choice: 埃及王法老
  rationale: 将同位结构自然表达为“埃及王法老”，既保留法老的称号，也明确其王权所属。
- source_word: עֲבָדָיו
  choice: 他的臣仆
  rationale: עֶבֶד 可指奴仆、臣仆或王室侍从；此处位于王室与国家人员的清单中，“臣仆”既保留服事、隶属之意，又不武断限定为奴隶。
- source_word: שָׂרָיו
  choice: 官长
  rationale: שַׂר 可指首领、官员、统帅或权贵；“官长”在庄重的现代汉语中涵盖王室及国家领袖，不误解为王子。
- source_word: כָּל עַמּוֹ
  choice: 全体百姓
  rationale: 忠实表达 כָּל 的周全范围和 עַם 的集体含义；“百姓”在君王语境中自然。
- source_word: אֶת ... וְאֶת ... וְאֶת ... וְאֶת
  choice: 以顿号和连词组成并列清单
  rationale: אֶת 是宾语标记，汉语无需逐一明译；用现代汉语的并列方式保留所有清单成员，并使本节自然承接上文。
theological_decisions: []
