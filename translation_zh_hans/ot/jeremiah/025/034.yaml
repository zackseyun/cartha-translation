language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: הֵילִ֨ילוּ הָ/רֹעִ֜ים וְ/זַעֲק֗וּ וְ/הִֽתְפַּלְּשׁוּ֙ אַדִּירֵ֣י הַ/צֹּ֔אן כִּֽי מָלְא֥וּ יְמֵי/כֶ֖ם לִ/טְב֑וֹחַ וּ/תְפוֹצ֣וֹתִי/כֶ֔ם וּ/נְפַלְתֶּ֖ם כִּ/כְלִ֥י חֶמְדָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/034.yaml
  text: Wail[a], you shepherds, and cry out; roll in the dust, you lords of the flock, for the days of your slaughter are fulfilled[b], and your dispersions have come[e][d][c], and you will fall like a precious vessel.
translation:
  language: zh_hans
  text: 牧人哪，你们要哀号[a]，要呼喊；羊群的权贵啊，你们要在尘土中打滚[b]！因为你们被宰杀的日子已经满了；你们的驱散也已经来到[c]。你们必倒下，像珍贵的器皿[d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “哀号”也可译作“号啕”或“呼啸般地哀哭”；希伯来语动词指大声悲号。
    reason: lexical_alternative
  - marker: b
    text: 希伯来语直译为“翻滚”或“打滚”，没有明说尘土；这里很可能指在尘土或灰烬中翻滚的哀悼举动。
    reason: cultural_note
  - marker: c
    text: “你们的驱散也已经来到”所依据的希伯来语句法困难；也可理解为你们将被驱散，或与前句合译为“你们被宰杀、被驱散的时候已经满了”。
    reason: alternative_reading
  - marker: d
    text: “珍贵的器皿”也可译作“可喜爱的器皿”或“上好的器皿”；比喻突显贵重之物坠落后容易破碎。
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵילִילוּ
  choice: 哀号
  rationale: 该复数命令式表示大声悲号；“哀号”既保留声音强度和哀悼意味，也符合庄重的现代汉语。
- source_word: הָרֹעִים
  choice: 牧人哪
  rationale: 保留原文的牧羊隐喻，不在正文中直接解释为君王或领袖；“哪”明确表达呼语。
- source_word: וְזַעֲקוּ
  choice: 要呼喊
  rationale: זעק指因危难而大声呼叫；“呼喊”自然，并与“哀号”形成原文的并列。
- source_word: וְהִתְפַּלְּשׁוּ
  choice: 要在尘土中打滚
  rationale: 该反身形式在此描述哀悼或受辱时翻滚的动作；原文未明说尘土，正文补出文化语境，脚注予以说明。
- source_word: אַדִּירֵי הַצֹּאן
  choice: 羊群中有权势的啊
  rationale: אַדִּירֵי可指尊贵、强大或有权势者；此译保留其地位与权力色彩，同时维持羊群意象。
- source_word: כִּי מָלְאוּ יְמֵיכֶם לִטְבוֹחַ וּתְפוֹצוֹתִיכֶם
  choice: 因为你们被宰杀、被驱散的日子已经满了
  rationale: 将“你们的日子”和“你们的驱散”理解为共同受מָלְאוּ支配，译成自然汉语，同时以脚注保留这一困难短语的其他句法理解。
- source_word: וּנְפַלְתֶּם
  choice: 你们必跌落
  rationale: 在审判语境中，完成式表达确定将发生的结果；“必跌落”既传达确定性，也衔接器皿坠落的比喻。
- source_word: כִּכְלִי חֶמְדָּה
  choice: 像珍贵的器皿
  rationale: כְּלִי泛指器具或器皿，חֶמְדָּה指可喜爱、可珍视之物；“珍贵的器皿”保留其贵重而易碎的张力。
theological_decisions:
- issue: “牧人”和“羊群中有权势的”所指对象
  choice: 正文保留牧羊隐喻
  alternative: 直接译作“统治者”“领袖”或“权贵”
  rationale: 上下文可能以牧人指各国的统治者，但本节原文本身使用牧羊意象；保留该意象可避免把解释直接写入正文。
- issue: 审判中宰杀的暴烈意象
  choice: 译作“被宰杀”
  alternative: 弱化为“被毁灭”或“死亡”
  rationale: לִטְבוֹחַ明确含宰杀之意；保留强烈措辞，忠实呈现本节的审判图景。
- issue: “被驱散的日子”之困难句法
  choice: 把“宰杀、驱散”并列为这些人所面临的命运
  alternative: 直译为“你们的驱散已经满了”或另补“已经来到”
  rationale: 希伯来语形式和句法紧凑且有歧义；所选译法能以通顺汉语呈现最可能的协调结构，脚注则明确保留困难性。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。以“哪”“啊”再现两组呼语，以“要……”“必……”区分命令与确定的审判结果；保留牧人、羊群和器皿的连续意象，不在正文中解释其政治指向。
