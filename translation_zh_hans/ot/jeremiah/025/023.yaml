lexical_decisions:
- source_word: דְּדָן
  choice: 底但
  rationale: 专有地名或族名，采用现代中文圣经读者较熟悉的传统音译。
- source_word: תֵּימָא
  choice: 提玛
  rationale: 指阿拉伯的绿洲或相关族群，采用通行音译“提玛”。
- source_word: בּוּז
  choice: 布斯
  rationale: 专有族名或地名，按希伯来语音译，并沿用中文圣经常见形式。
- source_word: כָּל
  choice: 所有
  rationale: 表达完整、无遗漏的范围，在列举族群时自然清楚。
- source_word: קְצוּצֵי
  choice: 剃去
  rationale: 该词源于“剪断、割去”，在此修饰具有特定修饰毛发习俗的人；“剃去”符合中文表达，同时保留实际去除毛发的动作。
- source_word: פֵאָה
  choice: 鬓角
  rationale: 本义为“边缘、角落”，此处指头部侧边的毛发，也可能涉及胡须边缘；正文用“鬓角”形成自然且具体的中文，脚注保留指称范围的不确定性。
