  text: וְ/שָׁלַח֩ יְהוָ֨ה אֲלֵי/כֶ֜ם אֶֽת כָּל עֲבָדָ֧י/ו הַ/נְּבִאִ֛ים הַשְׁכֵּ֥ם וְ/שָׁלֹ֖חַ וְ/לֹ֣א שְׁמַעְתֶּ֑ם וְ/לֹֽא הִטִּיתֶ֥ם אֶֽת אָזְנְ/כֶ֖ם לִ/שְׁמֹֽעַ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/004.yaml
  text: And Yahweh sent to you all his servants the prophets[a], rising early and sending them, but you did not listen, nor did you incline your ear to hear.
translation:
  language: zh_hans
  text: 雅威把他所有的仆人，就是众先知，都差遣到你们那里；他早早地、一次又一次地差遣他们[a]，你们却不听，也不侧耳聆听。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“早起并差遣”；这是一个惯用语，表示雅威再三而殷切地差遣先知。
    reason: 解释希伯来惯用语及正文“一次又一次地”的依据。
lexical_decisions:
- source_word: וְשָׁלַח
  choice: 把……差到……这里来
  rationale: 这是带连接词的Qal完成式第三人称阳性单数。结合上下文译作过去发生的差遣；用“差到你们这里来”自然表达其方向。
- source_word: יְהוָה
  choice: 雅威
  rationale: 直接音译四字神名，区别于作为尊称的“主”，也避免采用源于另一种传统读法的译名。
- source_word: כָּל עֲבָדָיו הַנְּבִאִים
  choice: 他所有的仆人，就是众先知
  rationale: “众先知”与“他所有的仆人”构成同位关系；“仆人”在这里强调受神差遣、服事神的身份，并非着重奴役状态。
- source_word: הַשְׁכֵּם וְשָׁלֹחַ
  choice: 一次又一次早早地差遣他们
  rationale: 两个不定式绝对形构成惯用表达，既含“早起/早早”的意象，也强调殷切、反复的差遣。正文保留意象，并以“一次又一次”传达其惯用语效力。
- source_word: וְלֹא שְׁמַעְתֶּם
  choice: 你们却不听
  rationale: 此处שׁמע不只指听见声音，更指听从、理会；“却”自然呈现上下文中的转折责备。
- source_word: וְלֹא הִטִּיתֶם אֶת אָזְנְכֶם לִשְׁמֹעַ
  choice: 也不侧耳聆听
  rationale: 保留“使耳朵倾向”的身体意象，同时用现代汉语可理解的表达传达留心听取之意。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。译作“雅威”旨在保留专名性质并较贴近通常重构的读音；不以“主”替代，也不把历史形成的“耶和华”读法写入正文。
- issue: “听”的责任含义
  choice: 保留“听”，由语境表达听从之意
  alternative: 直接译作“顺从”
  rationale: שׁמע在先知责备中包含回应和服从，但本句又有“侧耳”意象；保留听觉措辞可维持原文修辞及“听见—听从”之间的张力。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。“就是”清楚标示同位关系；“侧耳聆听”保留原文意象而不显晦涩。脚注标记[a]已置于对应短语之后。
