  source_fidelity: 译文总体保留了列举结构、远近对举、示沙克的音译以及“在他们之后喝”的次序。惟“彼此相邻”较明确地限定为空间关系，而אִישׁ אֶל־אָחִיו在此列举中可指彼此相接/相连，宜稍作开放处理；“地面上世间所有的国”语序不够自然。
  naturalness: “以及”可保留以反映本节承接上文，但“地面上世间所有的国”不合现代汉语常用语序。将脚注标记紧随“示沙克”更准确地锚定注释对象。
  terminology: “示沙克”音译正确，且不应在正文改作“巴比伦”。脚注中“首尾字母互换”并非对atbash的准确说明；应说明为按字母表次序反转的替换密码。
