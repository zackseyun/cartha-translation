  text: וְ/אֵ֣ת כָּל מַלְכֵ֣י הַ/צָּפ֗וֹן הַ/קְּרֹבִ֤ים וְ/הָֽ/רְחֹקִים֙ אִ֣ישׁ אֶל אָחִ֔י/ו וְ/אֵת֙ כָּל הַ/מַּמְלְכ֣וֹת הָ/אָ֔רֶץ אֲשֶׁ֖ר עַל פְּנֵ֣י הָ/אֲדָמָ֑ה וּ/מֶ֥לֶךְ שֵׁשַׁ֖ךְ יִשְׁתֶּ֥ה אַחֲרֵי/הֶֽם׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/026.yaml
  text: and all the kings of the north[a], both near and far, each one with his brother, and all the kingdoms of the earth that are on the face of the ground. And the king of Sheshach will drink after them.
translation:
  language: zh_hans
  text: 以及北方所有的王，无论远近，彼此相接；还有地上一切在地面上的国度。示沙克[a]王要在他们之后喝。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “示沙克”通常被认为是“巴比伦”的隐语，很可能采用了按字母表顺序反转的替换密码（atbash）。
    reason: 说明该隐晦专名很可能所指的对象及其可能的文字密码形式，同时不以解释取代正文原词。
lexical_decisions:
- source_word: מַלְכֵי הַצָּפוֹן
  choice: 北方所有的王
  rationale: 保留希伯来语属格结构及其地缘含义，不限定为某个更具体的地区。
- source_word: הַקְּרֹבִים וְהָרְחֹקִים
  choice: 无论远近
  rationale: 自然表达这一涵盖整体的对举，同时保留距离上的两极。
- source_word: אִישׁ אֶל אָחִיו
  choice: 彼此相邻
  rationale: 该短语字面接近“各人与他的弟兄相对/相接”，在列举诸王的语境中可指彼此相邻；此译法避免将其过早确定为时间上的“一个接一个”，也不误导为亲属关系。
- source_word: כָּל הַמַּמְלְכוֹת הָאָרֶץ
  choice: 世间所有的国
  rationale: 这里范围普遍，译作“世间”自然体现超越一地的含义；“国”适合指诸王国。
- source_word: אֲשֶׁר עַל פְּנֵי הָאֲדָמָה
  choice: 地面上
  rationale: 以“地面”区别于前面的 אֶרֶץ，并自然表达遍布大地表面的惯用语。
- source_word: שֵׁשַׁךְ
  choice: 示沙克
  rationale: 正文音译原文专名，不直接用其很可能暗指的“巴比伦”取代，以保留原文刻意采用的隐晦形式。
- source_word: יִשְׁתֶּה אַחֲרֵיהֶם
  choice: 要在他们之后喝
  rationale: 延续上下文喝忿怒之杯的意象；“在他们之后”保留原文的时间顺序，不补入本节未明说的“杯”。
theological_decisions:
- issue: “示沙克”的身份
  choice: 正文保留音译“示沙克”，脚注说明通常认为它暗指巴比伦。
  alternative: 正文直接译作“巴比伦”。
  rationale: 马所拉文本写的是 שֵׁשַׁךְ，而不是 בָּבֶל。保留该名称可忠实呈现原文的隐晦表达，同时由脚注提供重要的历史语言学解释。
- issue: אִישׁ אֶל אָחִיו 的关系含义
  choice: 译为“彼此相邻”。
  alternative: “一个接一个”或“各人与他的弟兄”。
  rationale: 原短语可表达成员彼此相接或相对的关系；“彼此相邻”保留空间或关系上的开放性，避免把它确定为饮杯的先后次序，也避免现代读者按血缘弟兄理解。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“无论远近”表达希伯来语对举；“世间所有的国”与“地面上”兼顾普遍范围和 אֶרֶץ、אֲדָמָה 两词的区别。脚注标记置于“示沙克”之后，以准确对应注释对象。
