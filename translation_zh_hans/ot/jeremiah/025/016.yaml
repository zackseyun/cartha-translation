base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/016.yaml
  text: They will drink[a], and stagger, and act like madmen because of the sword that I am sending among them.
translation:
  language: zh_hans
  text: 他们必饮，踉跄，发狂[a]，因为我正把刀剑送到他们中间。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“举止癫狂”。希伯来语既可指发狂，也可指行为失常、如同疯癫。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁתוּ
  choice: 他们必喝下
  rationale: 该动词在先知性叙述中承接上文使列国喝杯中之物的命令，具有将来意义；“喝下”保留具体的饮杯意象。
- source_word: וְהִתְגֹּעֲשׁוּ
  choice: 踉跄摇晃
  rationale: 该词表示剧烈动荡、摇摆或步履不稳；结合饮杯的语境，此译既传达失去平衡，也不过度限定为普通醉态。
- source_word: וְהִתְהֹלָלוּ
  choice: 发狂[a]
  rationale: 该反身形态可指陷入疯狂，也可侧重举止癫狂、失去理性；正文采用简洁自然的“发狂”，脚注保留行为层面的另一种理解。
- source_word: מִפְּנֵי הַחֶרֶב
  choice: 因为……刀剑
  rationale: מִפְּנֵי 在这里最自然地表达原因：他们的踉跄和发狂是由所临到的刀剑引起的。
- source_word: הַחֶרֶב
  choice: 刀剑
  rationale: 保留原文具体意象，不将其解释性地改写为战争、杀戮或灾祸。
- source_word: אֲשֶׁר אָנֹכִי שֹׁלֵחַ
  choice: 我正把……送到
  rationale: 分词 שֹׁלֵחַ 表达正在施行或迫近的行动；“正把……送到”在现代汉语中自然地体现这一动态。
- source_word: בֵּינֹתָם
  choice: 他们中间
  rationale: 该形式表示在众人之中或进入其间；“送到他们中间”准确传达刀剑临到列国之中的意思。
theological_decisions:
- issue: 审判意象的性质
  choice: 保留喝下、踉跄、发狂以及刀剑等具体意象，呈现上帝借刀剑施行审判所造成的后果。
  alternative: 将这些意象抽象化为恐惧、社会失序或政治崩溃。
  rationale: 本节属于忿怒之杯的预言，并明确把列国的失常状态与上帝所差来的刀剑相连；具体译出原文意象可避免加入经文未明说的解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“踉跄摇晃”传达强烈失稳感；“发狂”简洁有力，并以脚注保留该词可能侧重外在行为的语义。
