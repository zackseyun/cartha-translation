id: JER.25.25
reference: Jeremiah 25:25
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/אֵ֣ת כָּל מַלְכֵ֣י זִמְרִ֗י וְ/אֵת֙ כָּל מַלְכֵ֣י עֵילָ֔ם וְ/אֵ֖ת כָּל מַלְכֵ֥י מָדָֽי׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/025.yaml
  text: and all the kings of Zimri[a], and all the kings of Elam, and all the kings of Media[b];
translation:
  language: zh_hans
  text: 还有心利的所有君王[a]、以拦的所有君王，以及玛代的所有君王[b]；
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “心利”所指不确定，可能是一个民族或地区，在其他资料中无法明确辨认。
    reason: cultural_note
  - marker: b
    text: “玛代”也可译作“玛代人”。希伯来语 מָדָי 既可指玛代地区，也可指玛代民族。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵת
  choice: 还有
  rationale: וְ 延续上一节的宾语清单，译作“还有”自然体现累加关系；宾格标记 אֵת 在汉语中不另译。
- source_word: כָּל
  choice: 所有
  rationale: כָּל 位于复数构词短语前，表示该群体的全体，译作“所有”比逐一性的“每一位”更贴切。
- source_word: מַלְכֵי
  choice: 君王
  rationale: 这是 מֶלֶךְ 的复数构词形式，意为“……的众王”；“君王”庄重且符合现代汉语经文语体。
- source_word: זִמְרִי
  choice: 心利
  rationale: 按希伯来语专名音译，并采用现代中文圣经中较熟悉的译名；其具体所指不明，故在正文中不擅自解释为某一已知民族或地区。
- source_word: עֵילָם
  choice: 以拦
  rationale: 采用该古代地区 עֵילָם 的通行中文音译。
- source_word: מָדָי
  choice: 玛代
  rationale: 采用 מָדָי 的通行中文音译，使正文保留它可指地区或民族的空间；具体歧义于脚注说明。
