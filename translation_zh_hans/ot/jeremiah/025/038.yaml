source:
  edition: WLC
  text: עָזַ֥ב כַּ/כְּפִ֖יר סֻכּ֑/וֹ כִּֽי הָיְתָ֤ה אַרְצָ/ם֙ לְ/שַׁמָּ֔ה מִ/פְּנֵי֙ חֲר֣וֹן הַ/יּוֹנָ֔ה וּ/מִ/פְּנֵ֖י חֲר֥וֹן אַפּֽ/וֹ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/038.yaml
  text: Like a young lion[a], he has left his den, for their land has become a desolation because of the burning anger of the oppressor[b], and because of his burning anger.
translation:
  language: zh_hans
  text: 他像一头幼狮，离开了自己的洞穴；因为他们的土地已成荒凉之地，是因欺压者[a]的烈怒，也因他的[b]烈怒。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因鸽子的烈怒。”希伯来文的书写形式可以这样理解，但上下文更支持“欺压者”之意。
    reason: alternative_reading
  - marker: b
    text: 末尾的“他的”按上下文很可能指耶和华；也有人认为是指前一句的“欺压者”。
    reason: alternative_reading
lexical_decisions:
- source_word: עָזַב
  choice: 离开了
  rationale: 这是עזב的Qal完成式第三人称阳性单数，表示已经发生的行动；“离开了”自然明确，又不加入“抛弃”所可能带有的更强意味。
- source_word: כַּכְּפִיר
  choice: 像少壮狮子一样
  rationale: כפיר通常指年轻而强健、具有威势的狮子；“少壮狮子”比“幼狮”更能避免让人误以为是尚弱小的狮崽。
- source_word: סֻכּוֹ
  choice: 自己的巢穴
  rationale: סֻכָּה本指棚子或藏身处，在狮子的比喻中指其栖身之所；“巢穴”在现代汉语中自然传达兽类的藏身处。
- source_word: כִּי
  choice: （以分号承接因果关系）
  rationale: 此处引出前句的原因。汉语用分号后直接陈述结果，随后以“因”说明缘由，比机械加入“因为”更流畅，同时保留逻辑联系。
- source_word: הָיְתָה אַרְצָם לְשַׁמָּה
  choice: 他们的土地已成荒场
  rationale: “已成”表达完成后形成的状态；“荒场”保留שַׁמָּה作为名词所表达的荒废、毁坏景象。
- source_word: מִפְּנֵי
  choice: 因
  rationale: 该介词结构在这里表示原因；“因”简洁庄重，并清楚连接土地荒废与烈怒。
- source_word: חֲרוֹן
  choice: 烈怒
  rationale: חֲרוֹן以灼热描写愤怒。“烈怒”在现代汉语中既自然又保留强烈、炽烈的语感。
- source_word: הַיּוֹנָה
  choice: 欺压者
  rationale: 按上下文及相关词源理解为施行欺压的人，符合土地因敌对力量而荒废的语境；希伯来文字形也可读作“鸽子”，故在脚注保留这一真实歧义。
- source_word: וּמִפְּנֵי חֲרוֹן אַפּוֹ
  choice: 也因他的烈怒
  rationale: אַף以“鼻子发热”表达愤怒，汉语自然译为“烈怒”；重复“烈怒”保留与前一短语的平行结构，“他的”则不在正文中强行消除指代歧义。
theological_decisions:
- issue: 狮子意象所指及末尾“他的”所指
  choice: 正文保留第三人称表达；按上下文，狮子意象及末尾代词很可能指耶和华。
  alternative: 狮子可指尼布甲尼撒或另一位施行毁灭的人，末尾代词也可承接前面的“欺压者”。
  rationale: 耶利米书25:30-38的主导行动者是耶和华，狮子意象与他施行审判相合；但“欺压者”夹在末尾代词之前，使希伯来文仍存在句法上的另一种理解。正文用“他的”保留张力，脚注说明主要理解和替代读法。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“少壮狮子”表达年轻而强健的狮子，“巢穴”和“荒场”保持诗性而不过分古奥。正文以相同的“烈怒”保留希伯来文平行结构，并以代词及脚注保存原文的指代张力。
