language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/הָיָ֣ה כִ/מְלֹ֣אות שִׁבְעִ֣ים שָׁנָ֡ה אֶפְקֹ֣ד עַל מֶֽלֶךְ בָּבֶל֩ וְ/עַל הַ/גּ֨וֹי הַ/ה֧וּא נְאֻם יְהוָ֛ה אֶת עֲוֺנָ֖/ם וְ/עַל אֶ֣רֶץ כַּשְׂדִּ֑ים וְ/שַׂמְתִּ֥י אֹת֖/וֹ לְ/שִֽׁמְמ֥וֹת עוֹלָֽם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/012.yaml
  text: And when seventy years are completed[a], I will punish the king of Babylon and that nation—oracle of Yahweh—for their iniquity, and the land of the Chaldeans[b], and I will make it an everlasting desolation.
translation:
  language: zh_hans
  text: “七十年期满后，我必惩罚巴比伦王和那国，因他们的罪孽——这是雅威的宣告——也必惩罚迦勒底人的地；我要使那地永远荒凉。[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “永远荒凉”：希伯来文直译为“成为永远的荒凉之处”；“荒凉之处”为复数，可能表达加强或概括的意义。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כִמְלֹאות שִׁבְעִים שָׁנָה
  choice: 七十年期满以后
  rationale: כִמְלֹאות 表示七十年走完、期满之时；用现代汉语的时间从句表达，比逐字译成“事情将是”自然，同时保留未来时序。
- source_word: אֶפְקֹד עַל
  choice: 追讨
  rationale: פקד 与 עַל 连用并处于审判语境时，表示追究责任、施行惩罚。“追讨”既保留问责意味，也能自然地同时支配人、国家和土地。
- source_word: מֶלֶךְ בָּבֶל וְעַל הַגּוֹי הַהוּא
  choice: 巴比伦王和那国
  rationale: 按原文分别保留君王与国家两个受审判对象；הַגּוֹי הַהוּא 在此是政治意义上的“那国”。
- source_word: נְאֻם יְהוָה
  choice: 这是雅威的宣告
  rationale: נְאֻם יְהוָה 是先知书中的正式宣告语。“这是雅威的宣告”兼顾其公式性和现代汉语的可读性，并直接呈现神名。
- source_word: אֶת עֲוֺנָם
  choice: 因……的罪孽追讨他们
  rationale: עָוֹן 可指罪孽、罪责，也可涉及其后果；本句审判语境首先指招致追讨的罪孽。汉语补出“因”，并以“他们”承接巴比伦王和那国。
- source_word: אֶרֶץ כַּשְׂדִּים
  choice: 迦勒底人之地
  rationale: 保留原文的族群历史名称“迦勒底人”，不将其直接同化为“巴比伦人”；“之地”保持庄重而清楚的书面语体。
- source_word: וְשַׂמְתִּי אֹתוֹ
  choice: 我要使那地
  rationale: שׂים 在此表示使某对象进入一种状态。阳性单数代词 אֹתוֹ 最自然地回指邻近的单数名词“地”，汉语明确译作“那地”，避免无性代词造成指代不清。
- source_word: לְשִׁמְמוֹת עוֹלָם
  choice: 永远荒凉
  rationale: שִׁמְמוֹת 是复数形式，可作抽象或加强语气的复数；汉语用“荒凉”自然传达持续毁坏的状态，עוֹלָם 在此译为“永远”，保留先知审判语言的力度。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。译作“雅威”以音译方式呈现该专名，而不以称号“主”替代；“耶和华”是传统音译，但较不贴近通常重建的读音。
- issue: אֹתוֹ 的所指
  choice: 主要回指“迦勒底人之地”
  alternative: 概括指巴比伦王、那国及其土地这一整体
  rationale: 最近且语法上合适的单数先行词是“地”，而“使那地永远荒凉”语义完整。原文的阳性单数代词也可能将整个受审判对象概括为一体，但正文采用最近先行词的理解。
- issue: עֲוֺנָם 的语义范围
  choice: 罪孽，即受追讨的过犯
  alternative: 罪责；罪孽所招致的刑罚
  rationale: עָוֹן 可涵盖行为、罪责及后果。本句中“追讨”已经表达刑罚行动，因此正文译作“罪孽”，但不否认其罪责含义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话书面语。“期满以后”“追讨”“宣告”保留先知审判话语的正式力度；以破折号标明插入的宣告公式，并避免过度古雅的句法。
