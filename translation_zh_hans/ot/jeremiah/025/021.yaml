  text: אֶת אֱד֥וֹם וְ/אֶת מוֹאָ֖ב וְ/אֶת בְּנֵ֥י עַמּֽוֹן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/021.yaml
  text: Edom[a], Moab, and the sons of Ammon;
translation:
  language: zh_hans
  text: 以东、摩押和亚扪人[a]；
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “亚扪人”直译为“亚扪之子”。
    reason: 保留 בְּנֵי עַמּוֹן 的字面亲属称谓，说明通顺译法背后的原文形式。
lexical_decisions:
- source_word: אֱדוֹם
  choice: 以东
  rationale: 按标准圣经专名译作“以东”。此处在受审判的国家名单中，可自然指以东这一国家或其人民，不必明确改写为“以东人”。
- source_word: מוֹאָב
  choice: 摩押
  rationale: 按标准圣经专名译作“摩押”，保留原文以国家名称列举对象的表达。
- source_word: בְּנֵי עַמּוֹן
  choice: 亚扪人
  rationale: 希伯来语字面为“亚扪之子”，是表示族群的亲属称谓；现代汉语以“亚扪人”表达最自然清楚，字面形式另收入脚注。
- source_word: אֶת ... וְאֶת ... וְאֶת
  choice: 以顿号和“和”连接的并列宾语
  rationale: 宾语标记 אֶת 在汉语中无须对应；重复的连接词按现代汉语列举习惯处理为顿号，并在末项前用“和”。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而简洁的名单体表达。经文是上一节动作所支配的宾语片段，因此保留分号，表示列举尚未结束。脚注标记置于所注释的“亚扪人”之后、分号之前。
