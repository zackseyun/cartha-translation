  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כֹּ֤ה אָמַר֙ יְהוָ֣ה צְבָא֔וֹת הִנֵּ֥ה רָעָ֛ה יֹצֵ֖את מִ/גּ֣וֹי אֶל גּ֑וֹי וְ/סַ֣עַר גָּד֔וֹל יֵע֖וֹר מִ/יַּרְכְּתֵי אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/032.yaml
  text: 'Thus says Yahweh of hosts: Behold[a], disaster is going out from nation to nation[c][b], and a great storm is being stirred up from the farthest parts of the earth.'
translation:
  language: zh_hans
  text: 万军之耶和华如此说：“看哪，灾祸[a]正从一国蔓延到另一国；一场大风暴正从大地最偏远之处[b]被激起[c]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “灾祸”也可译作“灾难”。原词也能表示“恶”，但本处指带来毁灭的审判，并非道德上的邪恶。
    reason: lexical_alternative
  - marker: b
    text: “大地最偏远之处”也可译作“地极”或“大地的尽头”。
    reason: lexical_alternative
  - marker: c
    text: “正被激起”也可译作“将被激起”。
    reason: aspectual_alternative
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: 如此说
  rationale: 保留先知传信公式的庄重语气，同时符合现代汉语表达。
- source_word: יְהוָה צְבָאוֹת
  choice: 万军之耶和华
  rationale: “耶和华”呈现神的专名；“万军”保留צְבָאוֹת可涵盖天上、地上众军的广义，也符合中文圣经语体。
- source_word: הִנֵּה
  choice: 看哪
  rationale: 传达指示、唤起注意和先知宣告的紧迫感，语体庄重而可懂。
- source_word: רָעָה
  choice: 灾祸
  rationale: 本处指临到列国的毁灭性灾难，而非道德意义上的邪恶；“灾祸”既准确又自然。
- source_word: יֹצֵאת
  choice: 正……蔓延
  rationale: 分词呈现正在展开或即将发生的生动画面；结合“一国到另一国”，“蔓延”自然表达灾祸连续扩展，但不加入列国彼此攻击的意思。
- source_word: מִגּוֹי אֶל גּוֹי
  choice: 从一国……到另一国
  rationale: 清楚表达灾祸逐国扩展；不译作“国攻打国”，以免给介词加入原文未明说的敌对含义。
- source_word: סַעַר גָּדוֹל
  choice: 一场大风暴
  rationale: 保留猛烈风暴的审判意象，用现代汉语中清楚有力的说法表达。
- source_word: יֵעוֹר
  choice: 正……被激起
  rationale: 保留尼法勒形态的被动意味和先知异象的进行感；未将未完成式仅限定为未来。
- source_word: מִיַּרְכְּתֵי אָרֶץ
  choice: 从大地最偏远之处
  rationale: יַרְכְּתֵי表示边远、极深或极尽之处；此译保留空间上的遥远极处，比单纯译作“地极”更明确。
theological_decisions:
- issue: 审判语境中רָעָה的性质
  choice: 译作“灾祸”
  alternative: “恶”或“灾难”
  rationale: 上下文所说的是耶和华的毁灭性审判。译作“恶”容易使现代读者误解为道德邪恶；“灾祸”保留该词在此语境中的灾难含义，而不额外化解审判的严厉性。
- issue: יֵעוֹר的时态与体貌
  choice: 译作“正……被激起”
  alternative: “将被激起”
  rationale: 希伯来语未完成式在先知宣告中可指将来，也可生动呈现正在展开的事件。正文采用进行式以呼应前面的分词，脚注保留未来译法。
translation_notes:
  register: 采用现代、庄重而易懂的先知宣告语体。“万军之耶和华如此说”和“看哪”保留原文的正式节奏；其余措辞避免不必要的古雅表达。
