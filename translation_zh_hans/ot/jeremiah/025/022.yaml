  source_fidelity: 译文准确保留了推罗、西顿及海那边地区的君王这一并列对象，也以脚注保留了אִי可指“岛”的词义。但前两处כָּל（“所有”）宜在中文正文中明确表达；末项原文没有כָּל，不宜以“众王”无差别地重复其全称范围。
