base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/022.yaml
  text: and all the kings of Tyre[a], and all the kings of Sidon, and the kings of the coastland that is across the sea;
translation:
  language: zh_hans
  text: 以及推罗所有的王、西顿所有的王，以及海那边那片沿海地区的王[a]；
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“海那边那座岛的王”。希伯来语“אִי”可以指“岛”，但在先知书中也常泛指沿海地区或海上地域。
    reason: 保留原词在“岛”与较广义“沿海地区”之间的词义可能。
lexical_decisions:
- source_word: כָּל
  choice: 众
  rationale: 在“众王”中自然表达“所有、全体”的范围，也符合连续列举君王群体的汉语习惯。
- source_word: מַלְכֵי
  choice: ……的众王
  rationale: 保留构造复数“诸王”的含义；译作“王”而非较宽泛的“统治者”，紧贴原文。
- source_word: צֹר
  choice: 推罗
  rationale: 采用该地名在现代中文圣经传统中的通行译名。
- source_word: צִידוֹן
  choice: 西顿
  rationale: 采用该地名在现代中文圣经传统中的通行译名。
- source_word: הָאִי
  choice: 沿海地区
  rationale: אִי既可指“岛”，也可在先知性地理表述中泛指海岛、沿海地带或海疆；此处译作“沿海地区”较符合语境，同时以脚注保留“岛”的可能。
- source_word: אֲשֶׁר בְּעֵבֶר הַיָּם
  choice: 海那边
  rationale: 自然表达“在海的另一边／越过海”的空间关系；汉语中直接置于“沿海地区”之前，已清楚呈现关系从句的修饰作用。
- source_word: וְאֵת ... וְאֵת ... וְאֵת
  choice: 以及……、……，和……
  rationale: 宾格标记无需另译，以并列结构体现原文连续列举；中文适度压缩重复连词，使句子庄重而自然。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“众王”保留原文复数及整体范围；不机械重复三个“所有”，以免中文累赘。脚注标记紧随存在词义歧义的“众王”短语。
