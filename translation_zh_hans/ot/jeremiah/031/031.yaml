  text: הִנֵּ֛ה יָמִ֥ים בָּאִ֖ים נְאֻם יְהוָ֑ה וְ/כָרַתִּ֗י אֶת בֵּ֧ית יִשְׂרָאֵ֛ל וְ/אֶת בֵּ֥ית יְהוּדָ֖ה בְּרִ֥ית חֲדָשָֽׁה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/031.yaml
  text: Look[a], days are coming, declares Yahweh, when I will make a new covenant with the house of Israel and the house of Judah.
translation:
  language: zh_hans
  text: 看哪[a]，日子将到——雅威宣告——我要与以色列家和犹大家立新约。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“更新的约”。希伯来语形容词最自然的意思是“新的”，但有些解释者强调约的连续性，将其理解为“更新的”。
    reason: 词义上的另一种理解
lexical_decisions:
- source_word: הִנֵּה
  choice: 看哪
  rationale: 这是引人注意、郑重引出宣告的用语。“看哪”在现代中文圣经语体中简洁而庄重，也保留了原文的指示和强调作用。
- source_word: יָמִים בָּאִים
  choice: 日子将到
  rationale: 保留先知书常见的未来宣告惯用语，也自然传达希伯来语分词所表达的临近感。
- source_word: נְאֻם יְהוָה
  choice: 雅威宣告
  rationale: נְאֻם是庄重的先知宣告公式；译作“宣告”比一般的“说”更贴切。יהוה采用神名音译“雅威”，不以称号代替。
- source_word: וְכָרַתִּי
  choice: 我要……立
  rationale: 原文字面为“切”，但“切约”是希伯来语习语；现代汉语以“立约”自然准确地表达其意义。
- source_word: בֵּית יִשְׂרָאֵל
  choice: 以色列家
  rationale: 保留“家”的集体与盟约性意象，不将其简化为“以色列人”或“以色列”。
- source_word: בֵּית יְהוּדָה
  choice: 犹大家
  rationale: 与“以色列家”保持平行，并保留原文的群体身份表达。
- source_word: בְּרִית חֲדָשָׁה
  choice: 新约
  rationale: בְּרִית是“约”，חֲדָשָׁה通常意为“新的”。“新约”简明、自然，并保留原文最直接的词义；“更新的约”作为解释性可能列入脚注。
theological_decisions:
- issue: חֲדָשָׁה应译为“新的”还是按盟约连续性理解为“更新的”
  choice: 新约
  alternative: 更新的约
  rationale: 该形容词最自然、直接的词义是“新的”。“更新的”虽反映部分解释者所强调的盟约连续性，却加入了语境和神学层面的解释，因此不置于正文；脚注保留这一理解的可能性。
translation_notes:
  register: 采用现代、庄重而易懂的普通话圣经语体。“看哪”保留先知宣告的郑重感；破折号清楚标示插入的宣告公式；“立新约”符合自然汉语，同时准确传达希伯来语盟约习语。
