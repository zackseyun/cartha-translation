  text: כִּ֥י הִרְוֵ֖יתִי נֶ֣פֶשׁ עֲיֵפָ֑ה וְ/כָל נֶ֥פֶשׁ דָּאֲבָ֖ה מִלֵּֽאתִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/025.yaml
  text: For I have satisfied the weary soul[b][a], and every faint soul I have filled.
translation:
  language: zh_hans
  text: 因为我使疲乏的人饱饮[a]，使一切憔悴的人饱足[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “饱饮”也可译作“充分滋润”；希伯来语动词的本义是让人喝得满足。
    reason: lexical_alternative
  - marker: b
    text: “憔悴的人”也可译作“衰弱的人”、“忧伤的人”或“悲苦的人”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上下文，为前述复兴的应许说明根据；“因为”自然保留希伯来语的连接和解释作用。
- source_word: הִרְוֵיתִי
  choice: 使……饱饮
  rationale: 该动词为 רוה 的使役形，基本意象是让人充分饮水、喝个满足；“饱饮”既保留水的具体意象，也传达充分滋润和恢复之意。
- source_word: נֶפֶשׁ עֲיֵפָה
  choice: 疲乏的人
  rationale: נֶפֶשׁ 在这里指整个有生命的人，并非专门界定与身体分离的“灵魂”；译作“人”在现代汉语中更自然，同时“疲乏”保留身体和内心都可能耗竭的宽泛含义。
- source_word: וְכָל נֶפֶשׁ
  choice: 使一切……的人
  rationale: 以“一切……的人”自然表达 וְכָל 的概括范围，并在汉语句法中承接前一个使役分句；第二个“使”是为清楚表达平行结构而补出。
- source_word: דָּאֲבָה
  choice: 憔悴
  rationale: דאב 可指衰弱、萎顿，也可带有忧伤、悲苦而消沉的意味。“憔悴”能涵盖身心两面的衰残，又不把意思限定为单纯悲伤。
- source_word: מִלֵּאתִי
  choice: 使……饱足
  rationale: 该词为 מלא 的加强形，意为使之充满。“饱足”与上句“饱饮”形成自然平行，并传达上帝充分供应、使人恢复的意象。
theological_decisions:
- issue: נֶפֶשׁ 的人论含义
  choice: 两处都按整体的人译为“人”
  alternative: 译作“心灵”或“灵魂”
  rationale: 此处 נֶפֶשׁ 指疲乏、憔悴而蒙恢复的生命主体；译作“人”避免无根据地引入灵魂与身体二分的技术性含义，同时保留经文所说整体生命得滋养的意义。
- issue: 两个完成式动词的时态和体貌
  choice: 采用不带显式时态标记的“我使……”，不加“已经”或“将要”
  alternative: “我已经使……”；“我必使……”
  rationale: 希伯来语完成式既可陈述完成之事，也可在先知应许中表达确定必成的行动。现代汉语动词本身不强制标明时态，省去“已经”或“将要”可保留这种语境张力，避免过度判定。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“饱饮／饱足”保留原文两行的诗意平行和充盈意象；用“人”而不用较技术性的“灵魂”，使普通读者自然理解为整个人得着恢复。
