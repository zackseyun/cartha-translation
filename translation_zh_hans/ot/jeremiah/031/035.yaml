base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/035.yaml
  text: 'Thus says Yahweh[a], who gives the sun for light by day, the fixed order of the moon and stars for light by night[b], who stirs up the sea so that its waves roar—Yahweh of hosts is his name:'
translation:
  language: zh_hans
  text: '雅威如此说：


    他赐下太阳，使白昼有光；


    又设立月亮和众星的定规，使黑夜有光；


    他搅动大海，使海浪咆哮[a]——


    他的名是万军之雅威。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他使大海平静。”这里译作“搅动”的希伯来语动词，在其他语境中也可表示“使平静”；但下文“海浪咆哮”较支持“搅动”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  choice: 雅威如此说
  rationale: 保留先知宣告的固定格式，并以“雅威”音译四字神名；语序庄重而符合现代汉语。
- source_word: נֹתֵן שֶׁמֶשׁ לְאוֹר יוֹמָם
  choice: 他赐下太阳，使白昼有光
  rationale: 将分词 נֹתֵן 译为持续描述神作为的“赐下”，并以“使……有光”清楚表达 לְ 的功用含义。
- source_word: חֻקֹּת יָרֵחַ וְכוֹכָבִים
  choice: 月亮和众星的定规
  rationale: חֻקֹּת 在宇宙语境中指既定的规律或秩序；“定规”既保留原词的法定意味，也不误解为给天体颁布的道德律法。
- source_word: לְאוֹר לָיְלָה
  choice: 使黑夜有光
  rationale: 与前句“使白昼有光”形成自然平行，并表达月亮和众星在夜间照明的功用。
- source_word: רֹגַע הַיָּם
  choice: 他搅动大海
  rationale: 虽然 רֹגַע 在某些语境可指平静或制伏，但紧接着的“海浪咆哮”支持此处译作激动、搅动海洋。
- source_word: וַיֶּהֱמוּ גַלָּיו
  choice: 使海浪咆哮
  rationale: 将 waw 加未完成式按前一动作的结果处理；“咆哮”传达 המה 所描绘的喧腾声势。
- source_word: יְהוָה צְבָאוֹת שְׁמוֹ
  choice: 他的名是万军之雅威
  rationale: “万军”保留 צְבָאוֹת 的广泛含义及传统圣经称号，不把它收窄为地上的军队；汉语句式自然。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用神的专名；“雅威”是较贴近学界通行复原读音 Yahweh 的现代汉语音译，避免以“主”这一称号代替专名。
- issue: רֹגַע 描述大海时的含义
  choice: 搅动大海
  alternative: 使大海平静／制伏大海
  rationale: 该动词的词义存在张力，但本句随后的结果是海浪咆哮，因此正文采用“搅动”；同时以脚注保留另一种真实可行的词义。
translation_notes:
  register: 采用现代、庄重而易懂的诗体汉语，按希伯来诗句分行。以“赐下／设立／搅动”呈现连续的分词性描述；不额外补入原文没有的神学解释。
