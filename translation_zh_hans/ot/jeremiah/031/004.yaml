  text: ע֤וֹד אֶבְנֵ/ךְ֙ וְֽ/נִבְנֵ֔ית בְּתוּלַ֖ת יִשְׂרָאֵ֑ל ע֚וֹד תַּעְדִּ֣י תֻפַּ֔יִ/ךְ וְ/יָצָ֖את בִּ/מְח֥וֹל מְשַׂחֲקִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/004.yaml
  text: Again I will build you[a], and you will be built, O virgin Israel[c][b]; again you will adorn yourself with your tambourines and go out in the dance of those who celebrate.
translation:
  language: zh_hans
  text: 我必再建造你，你必被建造[a]，以色列的童女啊[b]！你必再以手鼓装扮自己，出去与欢庆的人一同起舞[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你必被重建。”希伯来文前后两次使用同一个词根，直译为“我建造你，你被建造”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“以色列少女啊。”这是对以色列的隐喻性称呼，描绘她恢复青春、纯洁与喜乐的形象。
    reason: lexical_alternative
  - marker: c
    text: 或译：“出去，加入欢庆者的舞蹈。”
    reason: lexical_alternative
lexical_decisions:
- source_word: עוֹד
  choice: 还要
  rationale: 在复兴的语境中表示先前中断之事将重新发生；两处均译为“还要”，保留原文的重复与未来意味。
- source_word: אֶבְנֵךְ / וְנִבְנֵית
  choice: 建造你／你就必被建造
  rationale: 两个动词同出于בנה，前者为主动，后者为被动；采用同一汉语词根，保留“我建造—你被建造”的呼应，而不在正文中直接增译为“重建”。
- source_word: בְּתוּלַת יִשְׂרָאֵל
  choice: 以色列的童女啊
  rationale: 保留先知诗歌中的直接称呼和“童女”隐喻；“啊”自然表达呼格，不将其解释性展开为字面贞洁的论断。
- source_word: תַּעְדִּי
  choice: 装扮自己
  rationale: 该词表示装饰、打扮自己；如此翻译既保留节庆装束的画面，也不把动作窄化为单纯“拿起”乐器。
- source_word: תֻפַּיִךְ
  choice: 手鼓
  rationale: 指庆典和舞蹈中使用的小型击打乐器；“手鼓”是现代汉语中清楚、自然且不过分限定具体形制的对应词。
- source_word: בִּמְחוֹל מְשַׂחֲקִים
  choice: 与欢庆的人一同起舞
  rationale: מָחוֹל表示舞蹈，מְשַׂחֲקִים在此指喜乐欢庆的人；译文以自然汉语表达公共庆典的场景，同时用脚注保留较贴近形式的另一种表达。
theological_decisions:
- issue: 复兴预言中“以色列的童女”这一隐喻性称呼
  choice: 正文直译为“以色列的童女啊”
  alternative: “以色列少女啊”
  rationale: 保留原文有关以色列身份更新、青春与喜乐的先知性隐喻，不把它化解为关于实际贞洁状况的教义陈述。
- issue: “建造”与“被建造”的神学张力
  choice: 保留主动与被动的同根重复
  alternative: “我要重建你，你就必重新建立”
  rationale: 原文既突出上帝主动施行恢复，也陈述以色列确实被建立；不将被动句改成反身或自主行动，以免削弱这一张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留先知诗歌的第二人称呼告、两次“还要”的复沓，以及“建造／被建造”的同根平行；“手鼓”“起舞”传达公开欢庆的复兴场景。
