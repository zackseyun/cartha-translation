  text: וְ/יֵשׁ תִּקְוָ֥ה לְ/אַחֲרִיתֵ֖/ךְ נְאֻם יְהוָ֑ה וְ/שָׁ֥בוּ בָנִ֖ים לִ/גְבוּלָֽ/ם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/017.yaml
  text: There is hope for your future[a], declares Yahweh[b], and your children will return to their own territory.
translation:
  language: zh_hans
  text: 你的未来有盼望[a]；这是雅威的宣告；你的儿女必返回自己的疆土[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “未来”也可译作“结局”或“末后的景况”。
    reason: lexical_alternative
  - marker: b
    text: “儿女”原文直译为“儿子们”；“疆土”也可译作“领土”或“边界”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֵשׁ
  choice: 仍有
  rationale: 以自然汉语表达存在句，并用“仍”承接上文悲痛中的转折与保证；句首连词不机械译为“并且”。
- source_word: תִּקְוָה
  choice: 盼望
  rationale: 在复兴应许的语境中，“盼望”自然、庄重，也保留期待将来结局的含义。
- source_word: לְאַחֲרִיתֵךְ
  choice: 你的未来
  rationale: אַחֲרִית可指后来、结局或未来；此处“未来”清楚表达面向前方的复兴应许，同时在脚注保留其他可能。
- source_word: נְאֻם יְהוָה
  choice: 这是雅威的宣告
  rationale: 保留先知话语公式的正式分量，并在现代汉语中表达自然。
- source_word: יְהוָה
  choice: 雅威
  rationale: 直接音译四字神名，区别于称号“主”。
- source_word: וְשָׁבוּ
  choice: 必返回
  rationale: 此处完成式在预言语境中指将来确定发生之事；“必”兼顾未来性与应许的确定性。
- source_word: בָנִים
  choice: 你的儿女
  rationale: 原文为阳性复数“儿子们”，但语境指拉结的后代或被掳群体；“儿女”准确传达集合性所指。
- source_word: לִגְבוּלָם
  choice: 自己的疆土
  rationale: גְּבוּל可指边界或边界以内的领土；回归语境中“疆土”比“边界”更自然，并保留领土意味。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文明确使用四字神名；音译“雅威”保留其作为专名的性质，不将其改为称号。
- issue: 应许对象 בָנִים 的范围
  choice: 儿女
  alternative: 儿子们
  rationale: 不把复兴应许限制为男性后代；语境中的复数名词泛指拉结的后代和流亡者，同时脚注交代原文字面形式。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以破折号突出先知公式，保持应许语气；避免生硬照搬希伯来语语序。
