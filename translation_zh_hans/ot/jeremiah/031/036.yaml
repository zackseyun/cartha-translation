  text: אִם יָמֻ֜שׁוּ הַ/חֻקִּ֥ים הָ/אֵ֛לֶּה מִ/לְּ/פָנַ֖/י נְאֻם יְהוָ֑ה גַּם֩ זֶ֨רַע יִשְׂרָאֵ֜ל יִשְׁבְּת֗וּ מִֽ/הְי֥וֹת גּ֛וֹי לְ/פָנַ֖/י כָּל הַ/יָּמִֽים־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/036.yaml
  text: If these fixed ordinances depart from before me[a], declares Yahweh[c][b], then the offspring of Israel also will cease from being a nation before me forever.
translation:
  language: zh_hans
  text: 这些定例若离开我面前[a]——耶和华宣告说——以色列的后裔[b]也必不再在我面前成为一国，直到永远[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “定例”也可译作“律例”或“法则”；上下文所指的是为受造界设立的固定秩序。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译为“以色列的种子”，是集合性说法，指以色列的后裔。
    reason: lexical_alternative
  - marker: c
    text: 希伯来文直译为“所有的日子”，是表示长久持续的惯用语；也可译作“永远”。
    reason: lexical_alternative
lexical_decisions:
- source_word: יָמֻשׁוּ
  choice: 消失
  rationale: מוש在此表示从既定位置移去、不复存在于其位置；“消失”自然表达宇宙秩序从神面前撤离这一反事实条件，又不必解释其机制。
- source_word: הַחֻקִּים הָאֵלֶּה
  choice: 这些定例
  rationale: 上下文指日、月、星辰和海的固定秩序。“定例”既保留חק的规定性，也适用于创造秩序，不限于给人的律法。
- source_word: מִלְּפָנַי / לְפָנַי
  choice: 从我面前 / 在我面前
  rationale: 保留前后重复的空间—关系性表达，同时符合现代汉语的庄重语体。
- source_word: נְאֻם יְהוָה
  choice: 这是耶和华说的
  rationale: 以自然而庄重的汉语表达标准先知宣告公式。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者最熟悉的专名形式，明确呈现希伯来文神名，而非以“主”替代。
- source_word: זֶרַע יִשְׂרָאֵל
  choice: 以色列的后裔
  rationale: זרע是集合性单数；“后裔”在现代汉语中自然涵盖整体后代，并避免“种子”的误解。
- source_word: יִשְׁבְּתוּ מִהְיוֹת גּוֹי
  choice: 也必不再……作一国
  rationale: שבת מן表示停止某种状态；“不再作一国”简洁保留以色列持续作为国民共同体的含义。
- source_word: כָּל הַיָּמִים
  choice: 直到永远
  rationale: 字面为“所有的日子”，在此是持续不止的惯用表达；“直到永远”是自然、庄重的现代汉语对等表达。
theological_decisions:
- issue: 是否淡化以色列后裔持续作为一国的应许
  choice: 直译为“以色列的后裔也必不再在我面前作一国”
  alternative: 将其泛化为某种非民族性或纯属灵群体的延续
  rationale: 原文明确把“以色列的后裔”和“作一国”相连；译文保留这种群体与国民身份语言，不借后来的神学体系缩窄或转化其指向。
- issue: 条件句的修辞力度
  choice: 保留“若……也必……”的反事实式对照
  alternative: 直接改写为“以色列永不会灭亡”
  rationale: 原文借创造秩序若被挪去这一条件强化应许；保留条件结构可维持其修辞张力，而不把它化约为解释性陈述。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“定例”承接创造秩序语境；破折号标明先知宣告公式的插入语性质。全部脚注标记均置于相关词句之后。
