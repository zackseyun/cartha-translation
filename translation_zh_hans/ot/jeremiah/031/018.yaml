source:
  edition: WLC
  text: שָׁמ֣וֹעַ שָׁמַ֗עְתִּי אֶפְרַ֨יִם֙ מִתְנוֹדֵ֔ד יִסַּרְתַּ֨/נִי֙ וָֽ/אִוָּסֵ֔ר כְּ/עֵ֖גֶל לֹ֣א לֻמָּ֑ד הֲשִׁיבֵ֣/נִי וְ/אָשׁ֔וּבָה כִּ֥י אַתָּ֖ה יְהוָ֥ה אֱלֹהָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/018.yaml
  text: 'I have surely heard Ephraim grieving: ‘You disciplined me[a], and I was disciplined, like an untrained calf. Restore me, and I will return[b], for you are Yahweh my God.’'
translation:
  language: zh_hans
  text: '我确实听见以法莲在哀叹[a]：


    “你管教了我，我也受了管教，


    如同一头没有受过训练的牛犊。


    求你使我回转，我便回转[b]，


    因为你是雅威，我的上帝。”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在哀叹”也可译作“为自己哀号”或“来回不安”；希伯来语分词可描写出声的自我哀诉，也可带有摇动、来回移动之意。
    reason: lexical_alternative
  - marker: b
    text: “使我回转，我便回转”也可译作“使我归回，我就归回”。希伯来语两处使用同一个表示“回转、归回”的词根，前一处为使役式。
    reason: lexical_and_grammatical_clarification
lexical_decisions:
- source_word: שָׁמוֹעַ שָׁמַעְתִּי
  choice: 我确实听见
  rationale: 不定式绝对式与同根限定动词连用，强化“听见”的断言；用“确实”自然表达希伯来语的强调。
- source_word: אֶפְרַיִם
  choice: 以法莲
  rationale: 保留专名及其单数人格化表达；上下文中该名代表北方的百姓。
- source_word: מִתְנוֹדֵד
  choice: 在哀叹
  rationale: נוד 的 Hitpolel 分词可指哀叹、摇动或来回不安；悔罪语境支持“哀叹”，同时在脚注中保留其自我哀诉及身体摇动的语义空间。
- source_word: יִסַּרְתַּנִי וָאִוָּסֵר
  choice: 你管教了我，我也受了管教
  rationale: 前后复现 יסר 的词根，分别表达施行管教与承受管教。“管教”兼具纠正和训诫之意，不采用较古旧或偏重惩罚的措辞。
- source_word: כְּעֵגֶל לֹא לֻמָּד
  choice: 如同一头没有受过训练的牛犊
  rationale: 直陈牛犊尚未受训练的农牧意象，不额外补入原文未明说的“负轭”，也不将其过度解释为纯粹的野性。
- source_word: הֲשִׁיבֵנִי וְאָשׁוּבָה
  choice: 求你使我回转，我便回转
  rationale: 前一动词是 שוב 的使役命令式，后一动词是同根的主动意愿式；重复“回转”保留原文的词根呼应，并维持上帝使人回转与人真实回转之间的张力。
- source_word: כִּי אַתָּה יְהוָה אֱלֹהָי
  choice: 因为你是雅威我的上帝
  rationale: כִּי 引出祈求的理由；以“雅威”音译四字神名，并保留直接、认信式的“我的上帝”。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；“雅威”较直接地呈现其专名性质，同时避免以称号替代原文名字。
- issue: “使我回转／我便回转”中的神人行动关系
  choice: 保留使役式与主动式的并列
  alternative: 求你复兴我，我就归回
  rationale: 原文先求上帝使其回转，继而陈述自己的回转；译文不把这一张力系统化为某种教义结论，也不以“复兴”消除同根动词的重复。
- issue: וָאִוָּסֵר 的语态
  choice: 我也受了管教
  alternative: 我接受了管教
  rationale: 尼法勒式最自然地容许被动理解；“受了管教”不额外断言以法莲已经甘心接受管教，因而保留悔罪陈述中的语义张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。诗行保持简洁和希伯来语的平行结构；“我也受了管教”与“使我回转，我便回转”刻意保留原文重复，避免用解释性扩写削弱修辞和神学张力。
