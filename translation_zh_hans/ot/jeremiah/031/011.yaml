base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/011.yaml
  text: For Yahweh has redeemed Jacob and ransomed him from the hand of one stronger than he[a].
translation:
  language: zh_hans
  text: 因为雅威救赎了雅各，把他从比他更强者的手中赎回[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “赎回”也可译作“救赎”。这里的希伯来语动词 גאל 常用于指赎回者为亲属采取行动，或使人从困境中得以恢复。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 在上下文中引出前述应许的根据；现代汉语用“因为”自然清楚。
- source_word: פָדָה
  choice: 救赎了
  rationale: 表达从奴役或危难中解救、赎出的含义；完成体在此以“了”呈现为已经成就的行动。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按音译呈现四字神名，保留经文所用的上帝专名，而不以称号替代。
- source_word: יַעֲקֹב
  choice: 雅各
  rationale: 忠实保留原文所用的人名；其群体性指向由上下文体现。
- source_word: וּגְאָלוֹ
  choice: 把他……赎回
  rationale: גאל可指以赎回者身份使人脱离困境或重新归回。用“赎回”与前句“救赎”既保持语义关联，也保留两个希伯来动词的差别；“他”对应宾语后缀。
- source_word: מִיַּד
  choice: 从……的手中
  rationale: 保留希伯来语以“手”表示权势或控制的意象，同时现代汉语也能自然理解。
- source_word: חָזָק מִמֶּנּוּ
  choice: 比他强者
  rationale: 体现阳性单数形容词及比较结构，指比雅各更强的一个对手或势力承担者，同时不额外确定其身份。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；采用较贴近其通常重构发音的“雅威”，保留专名性质。
- issue: 如何处理 פדה 与 גאל 的平行救赎用语
  choice: 分别译为“救赎”和“赎回”
  alternative: 两者都译为“救赎”
  rationale: 两个动词语义相近却并不完全相同；差异化翻译保留诗性平行中的词汇层次，而不据此建立超出文本的神学区分。
- issue: “比他强者”的指向
  choice: 保留不明确的单数表述
  alternative: 明确译作某一帝国、敌人或强权
  rationale: 原文没有给出该强者的具体身份，因此不在正文中补充解释，以保存其概括性与歧义。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“从……的手中”保留原文权势意象；句式简洁，适合公开诵读。
