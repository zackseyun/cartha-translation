source:
  edition: WLC
  text: וְ/כָל הָ/עֵ֣מֶק הַ/פְּגָרִ֣ים וְ/הַ/דֶּ֡שֶׁן וְ/כָֽל ה/שרמות עַד נַ֨חַל קִדְר֜וֹן עַד פִּנַּ֨ת שַׁ֤עַר הַ/סּוּסִים֙ מִזְרָ֔חָ/ה קֹ֖דֶשׁ לַֽ/יהוָ֑ה לֹֽא יִנָּתֵ֧שׁ וְֽ/לֹא יֵהָרֵ֛ס ע֖וֹד לְ/עוֹלָֽם־׀־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/040.yaml
  text: And the whole valley of the corpses and the ashes[a], and all the terraces as far as the Kidron Valley, as far as the corner of the Horse Gate toward the east, shall be holy to Yahweh[c][b]. It shall not be uprooted or overthrown again forever.
translation:
  language: zh_hans
  text: 整个尸首和灰烬的山谷，以及所有的梯田[a]，直到汲沦谷[b]，又直到东边马门的拐角，都必归雅威为圣。那里必永不再被拔除或拆毁[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “梯田”所对应的希伯来词含义不确定，也可译作“田地”或“坡地”。
    reason: lexical_alternative
  - marker: b
    text: “汲沦谷”也可译作“汲沦溪”；原词既可指溪流，也可指溪谷或季节性水道。
    reason: lexical_alternative
  - marker: c
    text: 也可译作：“它必永不再被拔出或拆毁。”
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעֵמֶק
  choice: 山谷
  rationale: 该词通常指山谷或低洼地；此处是在描述耶路撒冷周围的地形和界线。
- source_word: הַפְּגָרִים
  choice: 尸首
  rationale: 直译死尸、尸体；“尸首”庄重而清楚，保留这片地方原有的污秽意象。
- source_word: הַדֶּשֶׁן
  choice: 灰烬
  rationale: 在这里很可能指祭物或废弃物焚烧后堆积的灰烬，而非字面的脂油。
- source_word: השרמות
  choice: 梯田
  rationale: 马所拉文本中的词形疑难；按传统理解，可能指耶路撒冷周围山坡上的梯田、田地或坡地。正文采用较可能的地形含义，并以脚注保留其他可能。
- source_word: נַחַל קִדְרוֹן
  choice: 汲沦谷
  rationale: נחל可指季节性溪流、河谷或干河谷；在此界线描述中，“汲沦谷”自然且符合通行地名。
- source_word: פִּנַּת שַׁעַר הַסּוּסִים
  choice: 马门的拐角
  rationale: פִּנָּה指角落或转角；此处是城市边界的地理标志。
- source_word: מִזְרָחָה
  choice: 东边
  rationale: 表达朝东或位于东面；结合中文语序译为“东边马门的拐角”。
- source_word: קֹדֶשׁ לַיהוָה
  choice: 归雅威为圣
  rationale: 该奉献用语同时表达圣洁和归属；“归……为圣”保留两层含义。
- source_word: לַיהוָה
  choice: 雅威
  rationale: 直接音译四字神名，区别于称号“主”。
- source_word: לֹא יִנָּתֵשׁ
  choice: 必不再被拔除
  rationale: נתשׁ在耶利米书中常用于“拔出、拔除”；保留先知书反复出现的拔除意象。
- source_word: וְלֹא יֵהָרֵס
  choice: 也不再被拆毁
  rationale: הרס意为拆毁、摧毁；“拆毁”与城市建筑语境相称，也与前一动词形成互补。
- source_word: עוֹד לְעוֹלָם
  choice: 直到永远
  rationale: 与前面的“不再”合起来表达永久不再发生；中文以“不再……直到永远”自然呈现其加强语气。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；采用“雅威”以保留其作为盟约之名的性质，而不改译为称号。
- issue: 成圣范围
  choice: 整个列举的区域都归雅威为圣
  alternative: 只有重建后的城本身为圣，外围地区只是界线标记
  rationale: 句法上，קֹדֶשׁ לַיהוָה统摄此前列出的整个区域；译文保留原文把昔日污秽之地转为圣地的强烈张力。
- issue: 末句动词的主语
  choice: 以“那里”概括整片所述区域
  alternative: 以“城”作为补出的主语
  rationale: 希伯来文没有明说主语；结合前句整体地理范围，用“那里”避免把含义不必要地限缩为城市本身。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留地形边界逐层推进的句式，并将艰涩词 השרמות 的不确定性放入脚注。正文以“尸首和灰烬的山谷”保持修饰关系清楚；末句用“那里”承接整片区域，避免擅自补定为“城”。
