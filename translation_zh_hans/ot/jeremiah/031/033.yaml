source:
  edition: WLC
  text: כִּ֣י זֹ֣את הַ/בְּרִ֡ית אֲשֶׁ֣ר אֶכְרֹת֩ אֶת בֵּ֨ית יִשְׂרָאֵ֜ל אַחֲרֵ֨י הַ/יָּמִ֤ים הָ/הֵם֙ נְאֻם יְהוָ֔ה נָתַ֤תִּי אֶת תּֽוֹרָתִ/י֙ בְּ/קִרְבָּ֔/ם וְ/עַל לִבָּ֖/ם אֶכְתֲּבֶ֑/נָּה וְ/הָיִ֤יתִי לָ/הֶם֙ לֵֽ/אלֹהִ֔ים וְ/הֵ֖מָּה יִֽהְיוּ לִ֥/י לְ/עָֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/033.yaml
  text: 'For this is the covenant that I will make with the house of Israel after those days[a], declares Yahweh: I will put my law within them, and I will write it on their hearts. And I will be their God[c][b], and they shall be my people.'
translation:
  language: zh_hans
  text: 因为这是我在那些日子以后要与以色列家立的约[a]——耶和华宣告：我要[b]把我的律法[c]放在他们里面，写在他们心上。我要作他们的上帝，他们要作我的子民。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “立约”的希伯来语字面意思是“切约”。
    reason: lexical_alternative
  - marker: b
    text: “我要……放”所译的希伯来语动词在形式上是完成式，可直译为“我已经……放”；在这里，它与上下文的一系列未来应许相连，因而译作将来意义。
    reason: source_form
  - marker: c
    text: “律法”也可译作“教导”。希伯来语 תּוֹרָה 可兼有这两层意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 在这里引出对前文应许的解释；“因为”自然保留其解释或因果作用。
- source_word: הַבְּרִית / אֶכְרֹת
  choice: 立的约
  rationale: “约”准确保留上帝与以色列关系中的盟约含义；希伯来语直译为“切约”，现代汉语用“立约”表达这一固定习语。
- source_word: בֵּית יִשְׂרָאֵל
  choice: 以色列家
  rationale: 保留希伯来语的群体性、盟约性称谓，而不简化为“以色列人”。
- source_word: אַחֲרֵי הַיָּמִים הָהֵם
  choice: 那些日子以后
  rationale: 贴近原文，并保留先知话语面向未来的时间表达。
- source_word: נְאֻם יְהוָה
  choice: 耶和华宣告
  rationale: 以庄重而自然的现代汉语表达先知书中常见的宣告公式，并明确保留神名。
- source_word: נָתַתִּי אֶת־תּוֹרָתִי בְּקִרְבָּם
  choice: 我要把我的律法放在他们里面
  rationale: נָתַתִּי 形式上是完成式，但在全句未来应许的语境中采用将来意义；“在他们里面”与下句“在他们心上”构成内在化的平行表达。
- source_word: תּוֹרָתִי
  choice: 我的律法
  rationale: “律法”保留盟约规范及其经文关联；脚注注明也可理解为“教导”。
- source_word: וְעַל־לִבָּם אֶכְתֲּבֶנָּה
  choice: 写在他们心上
  rationale: 保留“写”与“心”的原文意象，同时符合自然汉语。
- source_word: וְהָיִיתִי לָהֶם לֵאלֹהִים וְהֵמָּה יִהְיוּ־לִי לְעָם
  choice: 我要作他们的上帝，他们要作我的子民
  rationale: 直接保留盟约关系的双向表述，措辞庄重、清楚。
theological_decisions:
- issue: נָתַתִּי 在未来盟约应许中的时态意义
  choice: 译作将来意义“我要……放”
  alternative: 按形式译作“我已经……放”
  rationale: 本节由“我要立约”“我要写”“我要作”“他们要作”等未来应许构成；将该完成式理解为具有确定性的先知性未来用法，既保持语境连贯，也不另加神学解释。
- issue: 新约语境中 תּוֹרָה 的译法
  choice: 正文译作“律法”
  alternative: “教导”
  rationale: 该词语义可包括教导，但此处的立约语境突出了上帝盟约中的规范；正文采用“律法”，脚注保留较宽的词义。
- issue: “放在他们里面”所指的内在性
  choice: 保留“在他们里面”，并与“在他们心上”平行
  alternative: “放在他们中间”或“放在他们内心深处”
  rationale: בְּקִרְבָּם 本可指“在他们中间”或“在他们里面”，但与“写在他们心上”平行时，内在意义更合适；同时不扩写为带解释性的“内心深处”。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“乃是这样”保留宣告的郑重感；破折号自然引出“耶和华宣告”的直接话语。正文维持原文的盟约用语、内在书写意象及未来应许结构。
