  text: And Judah and all its cities will dwell there together[a], farmers and those who journey with the flock.
translation:
  language: zh_hans
  text: 犹大和其所有城邑都必一同住在其中：农夫和随畜群迁徙的人[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“和赶着畜群迁徙的牧人。”原文直译为“和随畜群迁徙的人”，很可能指迁徙放牧的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָשְׁבוּ בָהּ
  choice: 都必住在其中
  rationale: יָשַׁב在此复兴语境中表示居住；未完成式按上下文译为将来。“其中”保留בָהּ的阴性单数回指，不将所指对象另行明说。
- source_word: יְהוּדָה וְכָל עָרָיו
  choice: 犹大和属它的一切城邑
  rationale: “犹大”在这里具有地域及其居民的集合意义；עָרָיו的第三人称阳性单数后缀回指“犹大”。“属它的”在现代汉语中清楚表达这一关系，“城邑”则保持庄重而可懂的经文语体。
- source_word: יַחְדָּו
  choice: 一同
  rationale: 准确表达共同、一起居住之意，简洁自然。
- source_word: אִכָּרִים
  choice: 农夫
  rationale: 指耕种土地的人；“农夫”比“耕田者”更自然，也不带古奥色彩。
- source_word: וְנָסְעוּ בָּעֵדֶר
  choice: 和随羊群迁徙的人
  rationale: נָסַע表示拔营、出发或迁移，בָּעֵדֶר描写伴随牲畜群移动。原文未明说“牧人”，因此正文用“……的人”保留含蓄；עֵדֶר通常可译为“羊群”。
