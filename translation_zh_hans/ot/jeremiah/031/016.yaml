source:
  edition: WLC
  text: כֹּ֣ה אָמַ֣ר יְהוָ֗ה מִנְעִ֤י קוֹלֵ/ךְ֙ מִ/בֶּ֔כִי וְ/עֵינַ֖יִ/ךְ מִ/דִּמְעָ֑ה כִּי֩ יֵ֨שׁ שָׂכָ֤ר לִ/פְעֻלָּתֵ/ךְ֙ נְאֻם יְהוָ֔ה וְ/שָׁ֖בוּ מֵ/אֶ֥רֶץ אוֹיֵֽב׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/016.yaml
  text: 'Thus says Yahweh: Restrain your voice from weeping and your eyes from tears[a], for there is a reward for your work, declares Yahweh[b], and they will return from the land of the enemy.'
translation:
  language: zh_hans
  text: '雅威如此说：


    “你要止住哭声，

    使你的眼睛不再流泪[a]；

    因为你的劳作必有报偿——

    这是雅威的宣告；

    他们[b]必从仇敌之地归回。”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“抑制你哭泣的声音，使你的眼睛止住泪水。”
    reason: 词汇与句式的另一种较贴近原文结构的译法。
  - marker: b
    text: “他们”在上下文中指拉结的儿女，也就是流亡的人。
    reason: 说明希伯来文隐含的复数主语在上下文中的所指。
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  choice: 雅威如此说
  rationale: 保留先知传信公式的庄重和直接性；将神名 יְהוָה 音译为“雅威”。
- source_word: מִנְעִי קוֹלֵךְ מִבֶּכִי
  choice: 不要再发出哭泣的声音
  rationale: מִנְעִי 是阴性单数命令式，呼应上下文中拟人化的拉结；译文保留“声音”和“哭泣”的意象，同时采用自然的现代汉语表达。
- source_word: וְעֵינַיִךְ מִדִּמְעָה
  choice: 也不要再让泪水涌出眼眶
  rationale: 与前句构成身体意象上的平行；“眼眶”自然表达眼睛止住泪水之意，而不把整句简化为“不要哭”。
- source_word: כִּי יֵשׁ שָׂכָר
  choice: 因为……必有报偿
  rationale: שָׂכָר 可指工价、回报或报偿；“报偿”既保留所得回报的含义，也避免把应许局限为商业工资。
- source_word: לִפְעֻלָּתֵךְ
  choice: 你的劳作
  rationale: פְעֻלָּה 可指工作、劳作或行为；“劳作”在此庄重而自然，并保留原文未具体说明其所指的宽度。
- source_word: נְאֻם יְהוָה
  choice: 这是雅威的宣告
  rationale: 以独立短句呈现先知书中庄严的确认公式，保留 נְאֻם 的郑重语气。
- source_word: וְשָׁבוּ
  choice: 他们必……归回
  rationale: 该动词的主语是隐含的第三人称复数；正文只补出语法所需的“他们”，不把上下文所指明写成原文没有明说的主语。
- source_word: מֵאֶרֶץ אוֹיֵב
  choice: 从仇敌之地
  rationale: 保留单数 אוֹיֵב 的集合性或泛指用法，也保留流亡者从敌方地域归回的图景。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；音译“雅威”旨在保留其作为神圣专名的性质，而不是以称号代替。
- issue: וְשָׁבוּ 的隐含主语
  choice: 他们必归回
  alternative: 你的儿女必归回；流亡的人必归回
  rationale: 希伯来文只有隐含的复数主语。保留“他们”既符合汉语语法，也不在正文中把上下文解释直接写进原句。
- issue: “你的劳作”具体指什么
  choice: 不在正文中具体解释
  alternative: 解释为拉结的哀哭或为儿女所受的劳苦
  rationale: 原文 פְעֻלָּתֵךְ 本身含义宽泛；译文保留这一开放性，不把报偿与某一种特定行为作排他性绑定。
translation_notes:
  register: 采用庄重、清晰的现代标准汉语。诗行保留原文的平行结构和身体意象；不使用过度古雅的虚词，也不把隐含主语或“劳作”的具体含义直接解释进正文。
