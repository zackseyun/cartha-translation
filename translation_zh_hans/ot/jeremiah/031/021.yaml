id: JER.31.21
reference: Jeremiah 31:21
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: הַצִּ֧יבִי לָ֣/ךְ צִיֻּנִ֗ים שִׂ֤מִי לָ/ךְ֙ תַּמְרוּרִ֔ים שִׁ֣תִי לִבֵּ֔/ךְ לַֽ/מְסִלָּ֖ה דֶּ֣רֶךְ הלכתי שׁ֚וּבִי בְּתוּלַ֣ת יִשְׂרָאֵ֔ל שֻׁ֖בִי אֶל עָרַ֥יִ/ךְ אֵֽלֶּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/021.yaml
  text: Set up road markers for yourself[a]; place guideposts for yourself. Set your heart toward the highway, the way you went. Return, virgin Israel[c][b]; return to these your cities.
translation:
  language: zh_hans
  text: 你要为自己立下路标[a]，为自己设置指路标记[b]；要留心那条大道，就是你走过的路。童女以色列啊，回来吧[c]！回到你这些城邑来！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “路标”也可译作“标记”。
    reason: lexical_alternative
  - marker: b
    text: “指路标记”所译的希伯来词较罕见；按上下文，可能指沿途设置的导向标记。
    reason: lexical_alternative
  - marker: c
    text: “回来”既可指从流亡之地返回，也可含有回转、重新忠于圣约的意味。
    reason: alternative_reading
lexical_decisions:
- source_word: הַצִּיבִי לָךְ צִיֻּנִים
  choice: 为自己立下路标
  rationale: 保留第二人称阴性单数命令式和“为自己”的反身意味；“路标”自然表达沿途设置、供归程辨认的标记。
- source_word: שִׂמִי לָךְ תַּמְרוּרִים
  choice: 为自己设置指路标记
  rationale: תַּמְרוּרִים 是罕见词；与前句平行且处于道路语境中，最可能指沿途导向的标记。“指路标记”既清楚又不把其具体形制说得过死。
- source_word: שִׁתִי לִבֵּךְ
  choice: 要留心
  rationale: 字面为“把你的心放在……上”。希伯来语的“心”涵盖注意、意志和内在取向；汉语“留心”自然传达专注并记住归路之意。
- source_word: לַמְסִלָּה
  choice: 那条大道
  rationale: מְסִלָּה 通常指修筑或垫高的道路。“大道”简洁、庄重；指示语“那条”与后面的同位说明相衔接。
- source_word: דֶּרֶךְ הלכתי
  choice: 就是你走过的路
  rationale: 按马所拉诵读传统理解为第二人称阴性单数“你走过”；“就是”显明“路”对“大道”的同位解释。
- source_word: שׁוּבִי
  choice: 回来吧／回到……来
  rationale: שוב 可指实际返回，也可带有回转、恢复盟约忠诚的意味。译作“回来”贴合道路、城邑和流亡归回的图景，同时不排除属灵层面。
- source_word: בְּתוּלַת יִשְׂרָאֵל
  choice: 童女以色列
  rationale: 保留先知书把以色列人格化为童女的意象；“童女”比日常语“处女”更适合庄重的诗性呼语，也没有改写为专名。
- source_word: עָרַיִךְ אֵלֶּה
  choice: 你这些城邑
  rationale: 保留第二人称所属关系和指示词“这些”的强调；“城邑”较“城市”更适合古代聚落语境。
theological_decisions:
- issue: שוב 所命令的“归回”是地理性的还是盟约性的
  choice: 采用“回来”，不限定为仅从流亡之地返乡或仅指悔改归向上帝
  alternative: 译作“悔改”或“从流亡之地归来”
  rationale: 本节的道路、路标和城邑明显支持实际返乡，但耶利米书的归回语言也常带盟约更新意味；译文保留两者之间的张力。
- issue: “童女以色列”的人格化意象
  choice: 保留“童女”这一称呼
  alternative: 弱化为“以色列民”或仅译“以色列”
  rationale: 原文特意用阴性单数称呼整个民族，与全节阴性单数命令式一致；保留意象可呈现其诗性和神学修辞，而不额外赋予宗派性解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。前两句保留平行命令结构；“留心”避免生硬直译“把心放在”，但维持内在专注的含义；末句用两个感叹号呈现连续呼召的迫切语气。所有脚注标记均置于对应词语之后。
