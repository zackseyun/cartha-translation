source:
  edition: WLC
  text: וְ/לֹ֧א יְלַמְּד֣וּ ע֗וֹד אִ֣ישׁ אֶת רֵעֵ֜/הוּ וְ/אִ֤ישׁ אֶת אָחִי/ו֙ לֵ/אמֹ֔ר דְּע֖וּ אֶת יְהוָ֑ה כִּֽי כוּלָּ/ם֩ יֵדְע֨וּ אוֹתִ֜/י לְ/מִ/קְטַנָּ֤/ם וְ/עַד גְּדוֹלָ/ם֙ נְאֻם יְהוָ֔ה כִּ֤י אֶסְלַח֙ לַֽ/עֲוֺנָ֔/ם וּ/לְ/חַטָּאתָ֖/ם לֹ֥א אֶזְכָּר עֽוֹד־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/034.yaml
  text: And they will no longer teach[a], each man his neighbor and each man his brother, saying, ‘Know Yahweh,’ for they will all know me, from the least of them to the greatest of them, declares Yahweh. For I will forgive their iniquity[c][b], and I will remember their sin no more.
translation:
  language: zh_hans
  text: 他们各人不再教导自己的邻舍，也不再教导自己的弟兄，说：“你们要认识耶和华[a]！”因为他们都必认识我，从他们中最小的到最大的。这是耶和华的宣告。因为我要赦免他们的罪孽，不再记得他们的罪。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “耶和华”译自希伯来文神名 YHWH；也常音译作“雅威”。
    reason: alternative_reading
lexical_decisions:
- source_word: יְלַמְּדוּ
  choice: 教导
  rationale: 该词是 למד 的皮埃勒未完成式，直接表达“教导、训诲”；“教导”在现代汉语中自然且准确。
- source_word: אִישׁ אֶת־רֵעֵהוּ וְאִישׁ אֶת־אָחִיו
  choice: 彼此教导，也不再对自己的弟兄说
  rationale: 原文两次使用分配性的 אִישׁ，并分别搭配“邻舍”和“弟兄”。汉语用“彼此”自然传达群体成员相互之间的分配意义，同时保留第二项“自己的弟兄”，避免生硬重复“各人……各人……”。
- source_word: דְּעוּ אֶת־יְהוָה
  choice: 你们要认识耶和华
  rationale: דְּעוּ 是复数命令式；补出“你们”可在汉语中显明其复数对象。“认识”保留 ידע 兼具认知与关系性的丰富含义。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的专名形式“耶和华”，将四字神名作为名字而非头衔表达；脚注说明其希伯来文形式及另一常见音译。
- source_word: כּוּלָּם יֵדְעוּ אוֹתִי
  choice: 他们都必认识我
  rationale: 直译并保留“认识”在盟约语境中的关系性含义，不把它缩减为纯知识，也不扩写成特定教义术语。
- source_word: לְמִקְטַנָּם וְעַד־גְּדוֹלָם
  choice: 从他们当中最小的到最大的
  rationale: 此首尾表达涵盖整个群体；“最小的到最大的”保留原文的范围结构，而“他们当中”自然表达两个词上的复数属格后缀。
- source_word: נְאֻם־יְהוָה
  choice: 这是耶和华的宣告
  rationale: 这是庄严的先知公式；独立成句既清楚又保留“宣告”的正式力度。
- source_word: אֶסְלַח לַעֲוֺנָם
  choice: 我要赦免他们的罪孽
  rationale: סלח 常指上帝的赦免；עָוֹן 在此指人在上帝面前的罪责与悖逆，“罪孽”保留其道德和神学分量。
- source_word: וּלְחַטָּאתָם לֹא אֶזְכָּר־עוֹד
  choice: 不再记得他们的罪
  rationale: 按原文保留“记得”的拟人性表达和“不再”的终止含义，不解释性改写为“不再追究”。
theological_decisions:
- issue: 盟约语境中“认识”的性质
  choice: 保留“认识我”
  alternative: 承认我／与我建立救赎关系
  rationale: ידע 在此具有关系和盟约层面的深度，但译文不应把这种丰富含义限定为纯认知或某一系统神学公式。
- issue: 群体中的教导是否被绝对取消
  choice: 直译“不再……教导……说：‘你们要认识耶和华’”
  alternative: 解释为不再需要任何形式的宗教教导
  rationale: 原文特别说明教导的内容是“认识耶和华”；译文保留其措辞与张力，不替文本裁定此话是否排除一切教导。
- issue: 分配性阳性单数 אִישׁ 的表达
  choice: 用“彼此”表达群体成员间的分配关系，并保留“自己的弟兄”
  alternative: 各人教导自己的邻舍，各人教导自己的弟兄
  rationale: 现代汉语的“彼此”不标明自然性别，却准确表达原文在盟约群体内的分配性泛指；逐字重复“各人”会显得拗口，也可能不必要地把语法阳性理解为仅限男性。
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威／上主
  rationale: “耶和华”是现代中文圣经传统中最广为识别的神名形式，保留其专名功能；以脚注交代希伯来文及“雅威”音译，不把专名改成头衔。
- issue: “不再记得”的神学含义
  choice: 保留原文的“记得”措辞
  alternative: 不再追究／完全忘记
  rationale: 原文用 זכר 表达上帝不再记念其罪；直译可保留盟约与司法意味，同时避免把它解释成上帝认知能力上的遗忘。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“彼此教导”避免机械复制希伯来语分配结构；引语中补出“你们”以体现复数命令式。将先知宣告公式独立成句，增强清晰度和庄严感。全文仅设一个确有必要的神名脚注，且标记已在正文出现。
