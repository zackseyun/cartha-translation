revisions:
- from: 他们不再彼此教导，也不再对自己的弟兄说：“你们要认识耶和华[a]！”因为他们都必认识我，从他们当中最小的到最大的，都必如此。这是耶和华的宣告。因为我要赦免他们的罪孽，不再记得他们的罪。
  to: 他们各人不再教导自己的邻舍，也不再教导自己的弟兄，说：“你们要认识耶和华[a]！”因为他们都必认识我，从他们中最小的到最大的。这是耶和华的宣告。因为我要赦免他们的罪孽，不再记得他们的罪。
  rationale: 修订恢复了原文“邻舍”与“弟兄”两个平行、分配性的对象，并在汉语中重复“教导”以消除句法歧义。删除“都必如此”，使“从他们中最小的到最大的”直接修饰“都必认识我”。未对“认识”作教义性扩展，也保留神名、赦免及“不再记得”的原文措辞。
