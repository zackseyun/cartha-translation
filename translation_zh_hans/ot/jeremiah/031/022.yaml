  text: עַד מָתַי֙ תִּתְחַמָּקִ֔י/ן הַ/בַּ֖ת הַ/שּֽׁוֹבֵבָ֑ה כִּֽי בָרָ֨א יְהוָ֤ה חֲדָשָׁה֙ בָּ/אָ֔רֶץ נְקֵבָ֖ה תְּס֥וֹבֵֽב גָּֽבֶר־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/022.yaml
  text: 'How long will you waver[c][b][a], faithless daughter? For Yahweh has created a new thing in the land: a woman will surround a man.'
translation:
  language: zh_hans
  text: 你还要躲闪到几时呢，背道的女儿？[a] 因为耶和华在这地[b]创造了一件新事：女子要环绕男子。[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “背道的女儿”也可译作“任性的女儿”或“偏离正道的女儿”；原文含有背离盟约的意味。
    reason: lexical_alternative
  - marker: b
    text: “这地”也可译作“大地”；按上下文，这里较可能指以色列之地。
    reason: lexical_alternative
  - marker: c
    text: 末句含义难解，历来有多种解释。这里按字面译作“女子要环绕男子”。也有人理解为“女子要追求男子”、“弱者要胜过强者”，或把它看作复兴的以色列归向耶和华的象征。
    reason: alternative_reading
lexical_decisions:
- source_word: תִּתְחַמָּקִין
  choice: 躲闪
  rationale: 该动词含有转身避开、溜走或闪躲之意；“躲闪”既保留动作形象，也能表达对归回呼召的回避，不把意思局限为单纯的犹豫。
- source_word: הַבַּת הַשּׁוֹבֵבָה
  choice: 背道的女儿
  rationale: שׁוֹבֵבָה 在耶利米书中常指离弃盟约、偏离正道；“背道的女儿”保留阴性单数称呼及盟约语境。
- source_word: כִּי
  choice: 因为
  rationale: 此处引出前面问句所依据的理由。
- source_word: בָרָא
  choice: 创造了
  rationale: 保留 qatal 完成式的基本形态，同时不排除先知话语中带有确定性的未来指向。
- source_word: חֲדָשָׁה
  choice: 一件新事
  rationale: 该形容词在此作名词使用；此译法自然，并保留其开放而未具体说明的含义。
- source_word: בָּאָרֶץ
  choice: 在这地
  rationale: אֶרֶץ 可指“大地”或特定的“土地”；上下文较可能指以色列之地。“这地”符合现代汉语表达。
- source_word: נְקֵבָה
  choice: 女子
  rationale: 该词字面为“雌性”，但此处指人；“女子”自然、庄重，并保留与后面“男子”的性别对应。
- source_word: תְּסוֹבֵב
  choice: 要环绕
  rationale: סבב 的基本意义是绕行、环绕或围住。末句含义争议很大，因此正文保留其具体词义，不采用“追求”等解释性译法。
- source_word: גָּבֶר
  choice: 男子
  rationale: גֶּבֶר 指男人，有时隐含强健之意；“男子”与“女子”相对，也避免加入原句未明确表达的“强者”或“勇士”。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的神圣专名形式，以专名而非称号呈现四字神名。
theological_decisions:
- issue: 难解短语 נְקֵבָה תְּסוֹבֵב גָּבֶר 的解释
  choice: 正文保留“女子要环绕男子”这一贴近词面的意象。
  alternative: 可理解为女子追求男子、弱者胜过强者、女子保护男子，或以女子象征复兴的以色列归向耶和华。
  rationale: 各词的基本词义相对清楚，但整句所指历来争议很大。正文不选定某一种神学解释，而在注释中列出主要可能性，以保留原文张力。
- issue: 先知语境中 בָרָא 的时态力量
  choice: 译作“创造了”。
  alternative: 也可译作“将要创造”或“创造”。
  rationale: 原文是完成式；译作“创造了”较贴近其形态，同时仍可让读者体会先知宣告所表达的确定性。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“躲闪”保留呼召与归回语境中的回避动作；“女子／男子”维持原文明确的性别对举。全部注释标记均置于相关正文之后。
