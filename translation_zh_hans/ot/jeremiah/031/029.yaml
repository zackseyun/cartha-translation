  text: בַּ/יָּמִ֣ים הָ/הֵ֔ם לֹא יֹאמְר֣וּ ע֔וֹד אָב֖וֹת אָ֣כְלוּ בֹ֑סֶר וְ/שִׁנֵּ֥י בָנִ֖ים תִּקְהֶֽינָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/029.yaml
  text: In those days they will no longer say[a], ‘The fathers have eaten sour grapes, and the sons’ teeth are set on edge.’
translation:
  language: zh_hans
  text: 在那些日子，人不再说[a]：“父亲吃了酸葡萄，儿子的牙酸倒了。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“父亲吃了未熟的葡萄，儿子的牙酸倒了。”
    reason: “酸葡萄”译自בֹסֶר；该词也可较字面地译为“未熟的葡萄”。
lexical_decisions:
- source_word: בַּיָּמִים הָהֵם
  choice: 在那些日子
  rationale: 保留先知话语中常见的时间表达，现代汉语自然、庄重。
- source_word: לֹא יֹאמְרוּ עוֹד
  choice: 人不再说
  rationale: 保留希伯来文主动式、不定复数主语和停止之意；汉语用泛指的“人”表达自然。
- source_word: אָבוֹת
  choice: 父亲
  rationale: 原词明确为阳性复数“父亲们”；汉语谚语式表达用“父亲”作类称，既忠于词义，又避免生硬的复数形式。
- source_word: אָכְלוּ
  choice: 吃了
  rationale: 希伯来文完成式表示已经发生的动作；汉语“了”能自然表达其完成及后果。
- source_word: בֹסֶר
  choice: 酸葡萄
  rationale: 该词指未熟而发酸的葡萄；正文采用易懂且符合上下文效果的“酸葡萄”，脚注补明“未熟的葡萄”。
- source_word: וְשִׁנֵּי בָנִים
  choice: 儿子的牙齿
  rationale: 保留原文“儿子”的阳性亲属称谓，并以汉语领属结构准确表达。
- source_word: תִּקְהֶינָה
  choice: 酸倒了
  rationale: 该动词描述牙齿因酸涩而发麻、发钝的感觉；“牙齿酸倒了”是现代汉语清楚而具有谚语色彩的表达。
theological_decisions:
- issue: 谚语中亲属称谓的译法
  choice: 正文保留“父亲”和“儿子”
  alternative: 父母和儿女
  rationale: 希伯来文使用明确的阳性亲属词。保留这些词既忠实于文本，也不把其跨代后果的含义扩写进正文。
- issue: 父辈行为与后代后果之间的关系
  choice: 以“却”呈现谚语中的反差，不额外解释因果责任
  alternative: 以“所以”明确译成直接因果
  rationale: 本节引用的是将父亲的行为与儿子的感受并置的俗语；原文没有因果连词。用“却”保留其反常张力，避免在本节内先行裁定责任问题。
translation_notes:
  register: 采用现代、庄重而易懂的普通话，并保留原句的谚语节奏。正文中的“父亲”“儿子”按希伯来文作类称；“酸倒了”传达牙齿因未熟葡萄的酸涩而发麻、发钝的体验。
