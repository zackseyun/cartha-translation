id: JER.31.13
reference: Jeremiah 31:13
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: אָ֣ז תִּשְׂמַ֤ח בְּתוּלָה֙ בְּ/מָח֔וֹל וּ/בַחֻרִ֥ים וּ/זְקֵנִ֖ים יַחְדָּ֑ו וְ/הָפַכְתִּ֨י אֶבְלָ֤/ם לְ/שָׂשׂוֹן֙ וְ/נִ֣חַמְתִּ֔י/ם וְ/שִׂמַּחְתִּ֖י/ם מִ/יגוֹנָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/013.yaml
  text: Then the virgin will rejoice in the dance[a], and young men and old men together; and I will turn their mourning into gladness[c][b], and I will comfort them and make them rejoice from their sorrow.
translation:
  language: zh_hans
  text: 那时，少女要跳舞欢喜[a]，青年和老年人一同欢喜[b]。我要使他们的哀恸变为喜乐[c]；我要安慰他们，使他们脱离忧愁而欢喜。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “少女”也可译作“处女”或“年轻女子”。希伯来文为单数，很可能用一位少女代表群体中的年轻女子。
    reason: lexical_alternative
  - marker: b
    text: “老年人”也可译作“长老”；但这里与“青年”相对，较可能是指年龄。
    reason: lexical_alternative
  - marker: c
    text: “喜乐”也可译作“欢欣”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: 那时
  rationale: 作为时间副词，承接上下文复兴的应许；“那时”自然地指向应许实现之时。
- source_word: תִּשְׂמַח
  choice: 要……欢喜
  rationale: 未完成式在此表达将来的欢庆；“欢喜”既通俗庄重，也与后面的使役形式相呼应。
- source_word: בְּתוּלָה
  choice: 少女
  rationale: 该词可指处女或未婚少女；在群体欢庆的语境中，“少女”自然，并保留希伯来文单数所具有的代表性。
- source_word: בְּמָחוֹל
  choice: 在舞蹈中
  rationale: 介词加名词可表示欢喜发生或展现的领域；此译保留具体的舞蹈意象。
- source_word: וּבַחֻרִים וּזְקֵנִים יַחְדָּו
  choice: 青年和老年人也要一同欢乐
  rationale: 两类人以年龄形成对照；“一同”体现跨世代共同参与。原文前一动词为阴性单数，此处省略相应谓语，中文补出“欢乐”以使句意完整。
- source_word: וְהָפַכְתִּי אֶבְלָם לְשָׂשׂוֹן
  choice: 我要使他们的哀恸变为喜乐
  rationale: 保留由一种处境转变为另一种处境的意象；“哀恸”与“喜乐”形成鲜明对照。
- source_word: וְנִחַמְתִּים
  choice: 我要安慰他们
  rationale: נחם的加强词干在此表示对受苦者的安慰，译法直接、自然。
- source_word: וְשִׂמַּחְתִּים מִיגוֹנָם
  choice: 使他们不再忧愁，反而欢喜
  rationale: שׂמח的使役含义译为“使……欢喜”；מן可表达从忧愁中脱离，中文用“不再……反而……”自然呈现这一转折，同时不把“忧愁”误作使人欢喜的原因。
theological_decisions:
- issue: בְּתוּלָה的代表性单数
  choice: 保留单数，译作“少女”
  alternative: 按群体意义译作复数“少女们”或直译为“处女”
  rationale: 原文使用单数，在这里很可能以一位少女代表复兴群体中的年轻女子。保留单数较贴近原文形式；“少女”又避免在庆典语境中过度突出性经历。
- issue: זְקֵנִים的含义
  choice: 译作“老年人”
  alternative: 译作“长老”
  rationale: 该词与“青年”并列，重点是年龄层次而非群体职分，因此不引入制度性含义。
- issue: מִיגוֹנָם的句法关系
  choice: 表达为从忧愁中得释放而欢喜
  alternative: 较形式化地译作“使他们从忧愁中欢喜”
  rationale: 介词מן在此最自然地表示脱离或取代忧愁的状态。中文明确转折可避免将忧愁理解为欢喜的来源，同时保留上帝使他们欢喜的主语与使役意义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。前半句因希伯来文省略青年与老年人的谓语，中文补出“欢乐”；后半句以“不再忧愁，反而欢喜”自然表达מן所含的脱离与转折。所有脚注标记均置于相关正文之后。
