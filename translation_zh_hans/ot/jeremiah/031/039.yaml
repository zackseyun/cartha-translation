base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/039.yaml
  text: And the measuring line will go out farther[a], straight ahead to the hill of Gareb[b], and then it will turn toward Goah.
translation:
  language: zh_hans
  text: 量度的准绳还要再向前延伸[a][b]，直达迦立的山冈，然后转向歌亚。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“再次”。希伯来语“עוֹד”可表示“再次”，也可表示“仍然、更远”；在这里城界向外延展的语境中，译作“再”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来语可直译为“在它前面”或“与它相对”；“它”所指的具体地点需根据上下文的城界描述推断。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָצָא
  choice: 还要继续伸展
  rationale: 该动词本义为“出去”；在预言性的城界测量语境中，以将来意义译为“伸展”，既保留准绳向外延伸的具体图景，也符合现代汉语表达。
- source_word: עוֹד
  choice: 继续
  rationale: 此词可表示“再次”或“更远、继续”；上下文描写城界向外扩展，因此正文采用空间延续义，同时以脚注保留另一可能。
- source_word: קוה הַמִּדָּה
  choice: 量地的准绳
  rationale: 该结构指测量土地或界线所用的绳索。“量地的准绳”清楚保留古代勘测的具体意象。
- source_word: נֶגְדּוֹ
  choice: 直向它前方
  rationale: 该介词结构可指“在它面前、与它相对”；结合界线走向，译作“直向它前方”较自然，但代词所指并不完全明确，故加脚注说明。
- source_word: עַל
  choice: 向……的
  rationale: 与伸展动作和地形终点连用时，表达朝向或抵达；在汉语句式中并入“直向它前方的迦立山”。
- source_word: גִּבְעַת גָּרֵב
  choice: 迦立山
  rationale: גִּבְעַת意为“小山、山冈”，与地名גָּרֵב构成属格结构；采用传统且易辨识的汉语音译“迦立山”。
- source_word: וְנָסַב
  choice: 然后转向
  rationale: 该动词可指转弯、绕行；在边界走向的描述中，“转向”简洁自然，“然后”标明动作次序。
- source_word: גֹּעָתָה
  choice: 向歌亚
  rationale: 地名带方向词尾，故译为“向歌亚”，保留朝该处延伸的方向含义。
