  text: ע֚וֹד תִּטְּעִ֣י כְרָמִ֔ים בְּ/הָרֵ֖י שֹֽׁמְר֑וֹן נָטְע֥וּ נֹטְעִ֖ים וְ/חִלֵּֽלוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/005.yaml
  text: Again you will plant vineyards on the mountains of Samaria[a]; planters will plant and enjoy them.
translation:
  language: zh_hans
  text: 你必再在撒马利亚的山上栽种葡萄园；栽种的人必栽种，并享用园中的出产。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或较直译：“使其归于日常使用。”这是农业语境中的说法，指葡萄园的出产不再受限制，可以供人日常享用。
    reason: 说明 וְחִלֵּלוּ 的字面语义及其在此处指葡萄园出产可供日常使用的习语含义。
lexical_decisions:
- source_word: עוֹד
  choice: 还要
  rationale: 在复兴的语境中表示这事将重新发生；“还要”自然地传达再次恢复栽种的将来意义。
- source_word: תִּטְּעִי
  choice: 你……栽种
  rationale: Qal未完成式第二人称阴性单数，指向上文被人格化为女性的以色列；中文第二人称不标性别，保留直接称呼及将来语气。
- source_word: כְרָמִים
  choice: 葡萄园
  rationale: 这是该词常规且符合农业语境的译法。
- source_word: בְּהָרֵי שֹׁמְרוֹן
  choice: 在撒马利亚的群山上
  rationale: 保留 הָרִים 的基本意象“山”，同时使用自然的现代汉语表达。
- source_word: נָטְעוּ נֹטְעִים
  choice: 栽种的人必栽种
  rationale: 保留同根词重复所形成的强调和生动效果；完成式在预言语境中表达未来复兴的确定性。
- source_word: וְחִלֵּלוּ
  choice: 并享用园中的出产
  rationale: 此处Piel形式在葡萄园语境中指解除专用或禁用状态、投入日常使用，即开始享用葡萄园的出产；避免直译为“亵渎”造成误解。
theological_decisions:
- issue: 阴性单数动词所指的受话者
  choice: 保留“你”的直接称呼，不在本节补出名称
  alternative: 明确译作“以色列少女”或“童女以色列”
  rationale: 阴性单数形式承接上文人格化的以色列，但本节本身没有重述称号；中文可借上下文理解，不宜增补正文没有的名称。
- issue: וְחִלֵּלוּ 的农业语境含义
  choice: 译为“享用园中的出产”
  alternative: 较字面地译为“使其成为普通之物”或容易误导的“亵渎它们”
  rationale: 这里描绘复兴后恢复正常农业生活，重点是栽种者可以把葡萄园的产物用于日常享用，而非礼仪上的亵渎。脚注保留较字面的语义。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“群山”保留希伯来文的山地意象；“栽种的人必栽种”刻意保留原文同根重复。“园中的出产”属于为清楚传达农业习语所作的最小限度明示。
