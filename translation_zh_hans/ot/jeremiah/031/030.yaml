  text: כִּ֛י אִם אִ֥ישׁ בַּ/עֲוֺנ֖/וֹ יָמ֑וּת כָּל הָֽ/אָדָ֛ם הָ/אֹכֵ֥ל הַ/בֹּ֖סֶר תִּקְהֶ֥ינָה שִׁנָּֽי/ו־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/030.yaml
  text: But each man will die for his own iniquity; every person who eats the sour grapes[a], his teeth will be set on edge.
translation:
  language: zh_hans
  text: 但各人都要因自己的罪孽而死；凡吃酸葡萄[a]的，自己的牙齿必酸倒。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“未熟的葡萄”。希伯来语指尚未成熟、因而味酸的葡萄。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: 但
  rationale: 承接上一节并作纠正性转折：不是父亲吃酸葡萄而儿女受影响，而是各人亲自承担后果。
- source_word: אִישׁ
  choice: 各人
  rationale: 此处单数具有分配意义；“各人”自然表达个人责任，又不增加原文没有强调的性别限定。
- source_word: בַּעֲוֺנוֹ
  choice: 因自己的罪孽
  rationale: 介词短语说明死亡所基于的个人罪责；עָוֹן兼有罪恶、罪责或罪罚等语义，此处译为“罪孽”可保留其道德与责任意涵。
- source_word: יָמוּת
  choice: 都要……死
  rationale: 未完成式在预言性宣告中表达将发生的结果；与“各人”搭配时加入“都”使现代汉语更顺畅。
- source_word: כָּל הָאָדָם
  choice: 凡……的
  rationale: 原结构具有概括兼分配意义；汉语关系结构“凡……的”准确而自然。
- source_word: הָאֹכֵל
  choice: 吃
  rationale: 分词在此实词化，指具有该行为的人；置于“凡……的”结构中最符合现代汉语。
- source_word: הַבֹּסֶר
  choice: 酸葡萄
  rationale: בֹּסֶר指尚未成熟、因而味酸的葡萄；“酸葡萄”保留上下文中的谚语意象，脚注补充“未熟葡萄”这一词义。
- source_word: תִּקְהֶינָה שִׁנָּיו
  choice: 自己的牙齿必酸倒
  rationale: 该表达描述吃未熟酸葡萄后牙齿发涩发软的感受；“牙齿酸倒”是自然且形象的汉语说法，并保留身体反应的比喻。
theological_decisions:
- issue: 个人责任与群体、代际责任之间的关系
  choice: 译文明确表达各人因自己的罪孽而死，并由吃酸葡萄者自己的牙齿承受反应。
  alternative: 仅把本节视为一般谚语，不突出个人责任；或将其扩展为否定圣经其他经文中的一切群体及代际后果。
  rationale: 本节句法直接纠正上一节谚语所表达的代际代受观念，强调个人承担自己的罪责；译文不把这一处境中的宣告扩展为原文未明说的系统性教义。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“罪孽”保留先知书语体及עָוֹן的罪责色彩；“牙齿酸倒”以自然汉语传达希伯来习语，同时保留葡萄与牙齿之间的具体意象。
