source:
  edition: WLC
  text: כִּ֣י יֶשׁ י֔וֹם קָרְא֥וּ נֹצְרִ֖ים בְּ/הַ֣ר אֶפְרָ֑יִם ק֚וּמוּ וְ/נַעֲלֶ֣ה צִיּ֔וֹן אֶל יְהוָ֖ה אֱלֹהֵֽי/נוּ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/006.yaml
  text: For there will be a day when watchmen will call out on the hill country of Ephraim[a], ‘Rise up, and let us go up to Zion[b], to Yahweh our God.’
translation:
  language: zh_hans
  text: '因为日子将到，在以法莲山区，守望者必高声呼喊[a]：


    “起来吧！让我们上锡安，

    到雅威[b]——我们的上帝那里去。”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “守望者”也可译作“守卫”或“看守的人”。
    reason: lexical_alternative
  - marker: b
    text: “雅威”是希伯来文神名 YHWH 的音译；传统上也常译作“耶和华”或以“主”代称。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，为先前的应许提供依据，保留原文的连接作用。
- source_word: יֶשׁ יוֹם
  choice: 日子将到
  rationale: 原文直译可作“有一日”；上下文指向将来，译为“日子将到”符合现代汉语的先知性表达，同时不过度扩写。
- source_word: קָרְאוּ
  choice: 必高声呼喊
  rationale: 完成式在先知话语中可表达确定的将来；“高声呼喊”体现公开发出召唤的场景。
- source_word: נֹצְרִים
  choice: 守望的人
  rationale: 该分词指看守、警戒的人；此处采用自然且保留具体意象的表达，不把其身份进一步限定为某种制度性职务。
- source_word: בְּהַר אֶפְרָיִם
  choice: 在以法莲山区
  rationale: הַר 的单数在此可集合性地指山地地区；“以法莲山区”避免误解为一座名叫“以法莲山”的单独山峰。
- source_word: קוּמוּ
  choice: 起来吧
  rationale: 复数命令式，召唤众人启程；“吧”使现代汉语中的劝召语气自然，同时保持庄重。
- source_word: וְנַעֲלֶה
  choice: 让我们上……去
  rationale: 第一人称复数鼓励式包含说话者；“让我们”准确表达共同倡议，“上……去”保留前往锡安的地势和朝圣意味。
- source_word: צִיּוֹן
  choice: 锡安
  rationale: 采用现代中文圣经传统中通行的地名译法，保留其地理及神学关联。
- source_word: אֶל יְהוָה
  choice: 到雅威……那里去
  rationale: 介词 אֶל 表达趋向；“到……那里去”在中文中自然地表明前往上帝面前。神名按希伯来语四字神名音译为“雅威”。
- source_word: אֱלֹהֵינוּ
  choice: 我们的上帝
  rationale: 直接保留第一人称复数所属关系及群体性的信仰告白。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名 YHWH。音译“雅威”使读者看见这是上帝的专名，而不是普通称号；脚注说明其形式及常见传统译法。
- issue: נֹצְרִים 在本节中的身份
  choice: 守望的人
  alternative: 守卫；看守的人
  rationale: 保留“警醒看守者”的具体形象，却不把他们确定为城墙守卫、葡萄园看守者或先知，以保存词义及语境中的开放性。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“因为”明确承接上文；诗行断句突出守望者的公开召唤。“雅威——我们的上帝”以破折号保留神名与同位称谓之间的关系。所有脚注标记均置于其所说明的主文成分之后。
