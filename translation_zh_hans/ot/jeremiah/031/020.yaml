source:
  edition: WLC
  text: הֲ/בֵן֩ יַקִּ֨יר לִ֜/י אֶפְרַ֗יִם אִ֚ם יֶ֣לֶד שַׁעֲשֻׁעִ֔ים כִּֽי מִ/דֵּ֤י דַבְּרִ/י֙ בּ֔/וֹ זָכֹ֥ר אֶזְכְּרֶ֖/נּוּ ע֑וֹד עַל כֵּ֗ן הָמ֤וּ מֵעַ/י֙ ל֔/וֹ רַחֵ֥ם אֲֽרַחֲמֶ֖/נּוּ נְאֻם יְהוָֽה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/020.yaml
  text: Is Ephraim a precious son to me[a], a child of delight? For as often as I speak of him, I still surely remember him. Therefore my inward parts are stirred for him; I will surely have compassion on him[b], declares Yahweh.
translation:
  language: zh_hans
  text: 以法莲岂是我珍爱的儿子，是我所喜爱的孩子吗？每当我论到他[a]，我仍定会记念他。因此，我的心为他激荡[b]；我定要怜悯他。这是耶和华的宣告。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “论到他”也可译为“谈及他”或“说到他”。原文介词本身未明确表示敌对；不过结合审判的语境，也可理解为神在责备他时仍记念他。
    reason: 保留“论及”与由上下文引出的“责备”理解之间的歧义，并避免把后者当作直接词义。
  - marker: b
    text: 直译“我的内脏为他激动”。“内脏”是希伯来语表达深切怜爱和同情的身体意象；也可意译为“我的心切切挂念他”。
    reason: 说明原文身体隐喻，并提供自然的汉语意译；正文以“心为他激荡”传达其情感效果。
lexical_decisions:
- source_word: הֲבֵן יַקִּיר לִי
  choice: 岂是我珍爱的儿子
  rationale: יַקִּיר表示珍贵、亲爱；“珍爱的”自然传达父子关系中的深厚情感。疑问词הֲ译作“岂是”，保留修辞问句及其含蓄肯定。
- source_word: אִם יֶלֶד שַׁעֲשֻׁעִים
  choice: 岂是我所喜爱的孩子
  rationale: שַׁעֲשֻׁעִים指喜悦、欢愉；“所喜爱的孩子”既保留关系性含义，也比生硬直译“喜悦之子”更符合现代汉语。
- source_word: כִּי מִדֵּי דַבְּרִי בּוֹ
  choice: 我每逢提到他
  rationale: מִדֵּי表示“每当、每逢”，דבר בו可指谈到、论及他；上下文也容许“说话责备他”的理解，因此在脚注保留这一可能。
- source_word: זָכֹר אֶזְכְּרֶנּוּ עוֹד
  choice: 仍必记念他
  rationale: 动词不定式绝对式与限定动词连用表示强调，עוֹד表示持续；“仍必记念”兼顾强调和延续性。
- source_word: הָמוּ מֵעַי לוֹ
  choice: 我的心肠为他翻腾
  rationale: מֵעַי本指内脏、五内，是表达深切情感的身体隐喻；“心肠为他翻腾”保留意象，同时在现代汉语中仍可理解。
- source_word: רַחֵם אֲרַחֲמֶנּוּ
  choice: 我必怜悯他
  rationale: 同根不定式绝对式加强רחם的语气；“必怜悯”简洁表达确定而强烈的慈悲。
- source_word: נְאֻם יְהוָה
  choice: 这是耶和华的宣告
  rationale: 保留先知信息中庄严的宣告公式，并以“耶和华”直接呈现神名。
theological_decisions:
- issue: 以法莲的所指与经文语气
  choice: 将以法莲理解为被人格化的北方以色列民，以蒙爱的儿子形象呈现；保留责备背景与怜悯应许之间的张力。
  alternative: 仅指作为个人的支派祖先以法莲。
  rationale: 耶利米书31章的上下文以“以法莲”集体指称北方百姓；父子隐喻及后续的记念、怜悯均支持群体人格化的读法。
- issue: דַבְּרִי בּוֹ的方向性
  choice: 正文采用较中性的“提到他”。
  alternative: “责备他”或“说话攻击他”。
  rationale: 介词ב与דבר连用可表示论及某人，原文没有明确写出敌对含义；但审判语境使“责备”成为合理理解，故列入脚注而不在正文中消除歧义。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“岂是”保留修辞问句的 solemn tone；“心肠为他翻腾”保留原文具身体感的情感意象，脚注辅助普通读者理解。全句避免加入特定宗派术语。
