id: JER.31.8
reference: Jeremiah 31:8
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: הִנְ/נִי֩ מֵבִ֨יא אוֹתָ֜/ם מֵ/אֶ֣רֶץ צָפ֗וֹן וְ/קִבַּצְתִּי/ם֮ מִ/יַּרְכְּתֵי אָרֶץ֒ בָּ֚/ם עִוֵּ֣ר וּ/פִסֵּ֔חַ הָרָ֥ה וְ/יֹלֶ֖דֶת יַחְדָּ֑ו קָהָ֥ל גָּד֖וֹל יָשׁ֥וּבוּ הֵֽנָּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/008.yaml
  text: Behold[a], I am bringing them from the land of the north, and I will gather them from the farthest parts of the earth. Among them are the blind and the lame, the pregnant woman and the woman in labor, together; a great assembly will return here.
translation:
  language: zh_hans
  text: 看哪，我正从北方之地把他们带来，也要从大地最偏远的地方[a]聚集他们。其中有盲人、瘸腿的人、孕妇和正在分娩的妇人；一大群人必一同归回这里。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“那地最偏远的地方”。希伯来语 אֶרֶץ 按语境既可指“大地”，也可指“土地、地区”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנְנִי
  choice: 看哪，我正
  rationale: “看哪”保留先知话语中庄重的唤起注意功能；与“正”连用，也自然呈现 הִנְנִי 加分词所表达的临近性和确定性。
- source_word: מֵבִיא
  choice: 把他们带来
  rationale: 结合 הִנְנִי 译作“我正……带来”，保持原文行动正在展开或已确定将发生的鲜明语气。
- source_word: מֵאֶרֶץ צָפוֹן
  choice: 从北方之地
  rationale: 保留原文地理表达，不将其具体限定为巴比伦或其他单一地区。
- source_word: וְקִבַּצְתִּים
  choice: 也要……聚集他们
  rationale: “聚集”准确表达离散之民被重新招聚的动作，并与耶利米书的复兴语境相称。
- source_word: מִיַּרְכְּתֵי אָרֶץ
  choice: 从大地最偏远之处
  rationale: יַרְכְּתֵי 指遥远的边缘或深处；“最偏远之处”兼顾具体意象和现代汉语的自然表达。אֶרֶץ 在此正文取较广的“大地”，另一可能见脚注。
- source_word: בָּם
  choice: 他们中间有
  rationale: 自然表达这些人属于被聚集、归回的群体，而非仅仅与群体同行。
- source_word: עִוֵּר וּפִסֵּחַ
  choice: 盲人和瘸腿的人
  rationale: 直译这组名词，并以现代汉语清楚指称群体中的具体成员。
- source_word: הָרָה וְיֹלֶדֶת
  choice: 孕妇和临产的妇人
  rationale: 保留两个阴性单数称谓所代表的两类人；“临产”自然传达正在生产的含义。
- source_word: יַחְדָּו
  choice: 一同归来
  rationale: 将“一同”与归回动作相连，使汉语顺畅，同时保留全体共同归回的强调。
- source_word: קָהָל גָּדוֹל
  choice: 一大群人
  rationale: קָהָל 在这里指聚集起来的庞大群体；“一大群人”比带有特定宗教组织意味的词更自然且不过度解释。
- source_word: יָשׁוּבוּ הֵנָּה
  choice: 必回到这里
  rationale: “回到这里”保留 הֵנָּה 的向此地移动之意；“必”体现预告的确定性。
theological_decisions:
- issue: 归回群体明确包括行动不便者和孕产妇
  choice: 将盲人、瘸腿的人、孕妇和临产的妇人明确列为归回者
  alternative: 把这份名单仅理解为形容人数众多的修辞
  rationale: 原文用 בָּם 直接说明这些人就在归回群体之中，突显复兴行动对脆弱成员的包容；译文不作超出经文的教义延伸。
- issue: מִיַּרְכְּתֵי אָרֶץ 中 אֶרֶץ 的范围
  choice: 正文译为“大地最偏远之处”
  alternative: “那地最偏远之处”或“各地最偏远之处”
  rationale: אֶרֶץ 可指“大地”或特定“土地、地区”。正文采用较广的地理范围，同时以脚注保存原文真实存在的另一种理解。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“看哪”保留先知宣告的庄严语体；其余措辞避免古奥表达。句法按希伯来文推进：带来、聚集、列举群体成员，最后落在共同归回及其规模上。
