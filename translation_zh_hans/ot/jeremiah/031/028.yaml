  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/הָיָ֞ה כַּ/אֲשֶׁ֧ר שָׁקַ֣דְתִּי עֲלֵי/הֶ֗ם לִ/נְת֧וֹשׁ וְ/לִ/נְת֛וֹץ וְ/לַ/הֲרֹ֖ס וּ/לְ/הַאֲבִ֣יד וּ/לְ/הָרֵ֑עַ כֵּ֣ן אֶשְׁקֹ֧ד עֲלֵי/הֶ֛ם לִ/בְנ֥וֹת וְ/לִ/נְט֖וֹעַ נְאֻם יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/028.yaml
  text: And it shall be that[a], just as I watched over them to uproot and to tear down and to overthrow and to destroy and to bring harm, so I will watch over them to build and to plant, declares Yahweh.
translation:
  language: zh_hans
  text: 将来必有这样的事：正如我曾留意他们，去拔出、拆毁、推倒、毁灭、降灾；我也必照样留意他们，去建造、栽植。这是雅威的宣告。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָיָה
  choice: 事情将是这样
  rationale: 作为先知话语中承前启后的未来引语，译得自然庄重，同时保留前瞻性。
- source_word: כַּאֲשֶׁר ... כֵּן
  choice: 我怎样……也必怎样
  rationale: 清楚保留希伯来文“正如……也照样”的对应结构，突出审判与复兴之间的平行。
- source_word: שָׁקַדְתִּי / אֶשְׁקֹד
  choice: 留意……也必留意
  rationale: שׁקד表示警醒而持续地关注并付诸行动；“留意”既适用于施行审判，也适用于施行复兴，并保持同一动词的反复。
- source_word: עֲלֵיהֶם
  choice: 他们
  rationale: 汉语“留意他们”自然表达该介词结构；上下文分别显出这种关注带来审判和复兴。
- source_word: לִנְתוֹשׁ
  choice: 拔出
  rationale: 保留耶利米书常见的农耕意象，并与后文“栽植”对应。
- source_word: וְלִנְתּוֹץ
  choice: 拆毁
  rationale: 表达拆除建筑或结构，符合毁坏动词序列，并与其他动词有所区别。
- source_word: וְלַהֲרֹס
  choice: 推倒
  rationale: 保留连续累加的修辞，同时避免与后面的“毁灭”合并为同义重复。
- source_word: וּלְהַאֲבִיד
  choice: 毁灭
  rationale: 准确表达使之灭亡的使役含义，简洁有力。
- source_word: וּלְהָרֵעַ
  choice: 降灾
  rationale: 在审判语境中表示使灾祸临到，不把该词误解为上帝施行道德意义上的邪恶；另以脚注保留“加害”的词义幅度。
- source_word: לִבְנוֹת
  choice: 建造
  rationale: 保留与拆毁相对的复兴意象。
- source_word: וְלִנְטוֹעַ
  choice: 栽植
  rationale: 保留农业复兴意象，并与前文“拔出”形成鲜明对应。
- source_word: נְאֻם יְהוָה
  choice: 这是雅威的宣告
  rationale: 自然呈现先知书的神谕结束语，并直接音译圣名。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文明确使用四字神名；“雅威”较贴近通常重构的读音，并避免以称号取代专名。
- issue: וּלְהָרֵעַ 是否暗示上帝行道德之恶
  choice: 降灾
  alternative: 加害；行恶
  rationale: 此处处于盟约审判语境，指使灾祸或伤害临到，并不判定上帝实施道德邪恶；译文和脚注共同保留其语义张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“拔出、拆毁、推倒、毁灭、降灾”保留原文五个连续不定式的累积力度；“建造、栽植”则简明呈现复兴。重复“留意”以维持原文审判与复兴之间刻意的对称。
