  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כִּֽי אַחֲרֵ֤י שׁוּבִ/י֙ נִחַ֔מְתִּי וְ/אַֽחֲרֵי֙ הִוָּ֣דְעִ֔/י סָפַ֖קְתִּי עַל יָרֵ֑ךְ בֹּ֚שְׁתִּי וְ/גַם נִכְלַ֔מְתִּי כִּ֥י נָשָׂ֖אתִי חֶרְפַּ֥ת נְעוּרָֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/019.yaml
  text: For after I turned back[a], I repented; and after I was instructed, I struck my thigh. I was ashamed, and also humiliated[c][b], because I bore the disgrace of my youth.
translation:
  language: zh_hans
  text: 因为我回转后，便悔改；受教后，我拍打自己的大腿[b]。我感到羞愧，也蒙羞，因为我背负了年轻时的耻辱[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: “拍打自己的大腿”是希伯来人表达悲痛、震惊或懊悔的动作。
    reason: cultural_note
  - marker: c
    text: 或译“我青春时期的羞辱”或“我年轻时的耻辱”。
    reason: lexical_alternative
lexical_decisions:
- source_word: שׁוּבִי
  choice: 我回转
  rationale: שׁוב的基本意象是转回、归回。译作“回转”既保留动作意象，也避免与下句נחם所表达的悔改混为一谈。
- source_word: נִחַמְתִּי
  choice: 我悔改了
  rationale: 在以法莲认罪的语境中，该词表达因过往行为而懊悔并悔改；“悔改”比单纯“后悔”更能传达这里的道德与属灵分量。
- source_word: הִוָּדְעִי
  choice: 受教以后
  rationale: 这是ידע的尼法勒式，可指被使之明白、受到指教。译作“受教”保留被动含义，又符合现代汉语表达；“醒悟以后”则是可能的语境性理解。
- source_word: סָפַקְתִּי עַל יָרֵךְ
  choice: 我拍打大腿
  rationale: 直译这一身体动作，不把其哀痛、震惊或懊悔的文化含义直接写进正文。
- source_word: בֹּשְׁתִּי
  choice: 我感到羞愧
  rationale: 直接表达בושׁ的羞愧感，并与后面的近义词保持区别。
- source_word: נִכְלַמְתִּי
  choice: 也深感屈辱
  rationale: 该词比一般的羞愧更带有受辱、无地自容之感；加“深感”传达其加强的情绪力度。
- source_word: נָשָׂאתִי
  choice: 我承受了
  rationale: נשׂא在此指背负或承受羞辱；“承受”在现代汉语中自然，并保留负担感。
- source_word: חֶרְפַּת נְעוּרָי
  choice: 年轻时的耻辱
  rationale: חֶרְפָּה可指耻辱、羞辱或辱骂；此处“年轻时的耻辱”自然地保留属格关系，也不擅自限定它是当时所犯的罪还是因此所受的羞辱。
- source_word: כִּי
  choice: 因为
  rationale: 句首כִּי承接上文并作解释，汉语用“因为”能清楚显示因果或说明关系；句末同样按原因从句处理。
theological_decisions:
- issue: 以法莲认罪中“回转”与“悔改”的关系
  choice: 将שׁוב译为“回转”，将נחם译为“悔改”，保留两个不同动词及其先后推进。
  alternative: 可将前者译为“归回”，后者译为“后悔”；也有人可能把两者都理解为悔改语言。
  rationale: 原文有意使用两个不同词语。区分“回转”与“悔改”既呈现外在转向与内在懊悔之间的张力，也不把这种次序扩展为经文没有明说的系统教义。
- issue: “受教”所指的主体与方式
  choice: 保持被动而不说明是谁或以何种方式施教。
  alternative: 可按结果译为“醒悟以后”或“明白过来以后”。
  rationale: 原文形式允许“被使之知道、受到指教”的理解，但没有在本句明确说明施教方式；因此不补入特定的神学机制。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“回转—悔改”“羞愧—屈辱”分别保留原文近义词之间的差异；“拍打大腿”保留具体身体动作，并以脚注解释其文化含义。
