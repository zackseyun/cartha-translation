  text: וּ/בָאוּ֮ וְ/רִנְּנ֣וּ בִ/מְרוֹם צִיּוֹן֒ וְ/נָהֲר֞וּ אֶל ט֣וּב יְהוָ֗ה עַל דָּגָן֙ וְ/עַל תִּירֹ֣שׁ וְ/עַל יִצְהָ֔ר וְ/עַל בְּנֵי צֹ֖אן וּ/בָקָ֑ר וְ/הָיְתָ֤ה נַפְשָׁ/ם֙ כְּ/גַ֣ן רָוֶ֔ה וְ/לֹא יוֹסִ֥יפוּ לְ/דַאֲבָ֖ה עֽוֹד־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/012.yaml
  text: They will come and shout for joy on the height of Zion[a], and they will stream to the goodness of Yahweh, to the grain, the new wine, and the fresh oil, and to the young of the flock and the herd. Their life will be like a well-watered garden[d][c][b], and they will never again waste away.
translation:
  language: zh_hans
  text: 他们必来，在锡安高处欢呼；他们必涌向[a]耶和华所赐的丰盛[b]：五谷、新酒、新油，以及羊群和牛群的幼畜。他们的生命[c]必像被充分浇灌的园子，再也不会憔悴[d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们必如水流般奔向”。原文动词带有流动、汇聚的图像。
    reason: lexical_alternative
  - marker: b
    text: 或译：“耶和华的美善”或“耶和华的丰盛福分”。下文列举的物产和牲畜具体说明这里的“丰盛”。
    reason: lexical_alternative
  - marker: c
    text: 原文直译为“他们的魂（נֶפֶשׁ）”；这里指他们的生命或整个身心，并非只指人的非物质部分。
    reason: lexical_alternative
  - marker: d
    text: 或译：“再也不会悲伤”或“再也不会衰弱”。原文可指因愁苦而渐渐消损、憔悴。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָאוּ וְרִנְּנוּ
  choice: 他们必来……欢呼
  rationale: 在先知应许的语境中，连词连接的完成式表达将来的应验；“欢呼”自然传达 רנן 的喜乐呼喊。
- source_word: בִמְרוֹם צִיּוֹן
  choice: 在锡安高处
  rationale: מָרוֹם 为单数，指锡安所在的高处；译文保留其空间意象。
- source_word: וְנָהֲרוּ
  choice: 他们必涌向
  rationale: נהר 在这里描绘人群如水流一般奔赴某处；“涌向”既保留水流意象，也符合现代汉语表达。
- source_word: אֶל טוּב יְהוָה
  choice: 耶和华的美福
  rationale: טוּב 既可指耶和华的美善，也可指他赐下的丰富福分；“美福”兼顾这两层意义，并由下文的物产和牲畜具体说明。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文读者熟悉的专名“耶和华”直接表达四字神名，而不以一般性称号替代。
- source_word: עַל דָּגָן וְעַל תִּירֹשׁ וְעַל יִצְהָר
  choice: 就是五谷、新酒、新油
  rationale: 将重复的 עַל 按上下文处理为对“美福”的具体列举；תִּירוֹשׁ 指新酒，יִצְהָר 指新鲜的油，通常为橄榄油。
- source_word: בְּנֵי צֹאן וּבָקָר
  choice: 羊群和牛群所生的幼畜
  rationale: בְּנֵי 在此指羊群和牛群的后代；译作“所生的幼畜”避免把范围过度限定为特定种类。
- source_word: וְהָיְתָה נַפְשָׁם
  choice: 他们的生命必像
  rationale: נֶפֶשׁ 在这里指人的生命或整个身心，不仅指非物质的“灵魂”；“生命”较准确地保留整体性的含义。
- source_word: כְּגַן רָוֶה
  choice: 像水分充足的园子
  rationale: רָוֶה 描写充分得到浇灌的状态；“水分充足”自然呈现繁茂兴盛的图景。
- source_word: וְלֹא יוֹסִיפוּ לְדַאֲבָה עוֹד
  choice: 再也不会衰残
  rationale: “不再继续”这一结构表达永不再发生；דאב 可指因愁苦而憔悴、衰弱或悲伤，“衰残”保留身心消损的语义张力。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。正文采用现代简体中文圣经语境中最普遍、最易辨认的专名“耶和华”，同时不以“主”这一称号替代神名。
- issue: נֶפֶשׁ 的整体性含义
  choice: 生命
  alternative: 心灵／灵魂
  rationale: 此处的比喻涉及人整体恢复兴盛的状态；译作“生命”避免将原文限定为非物质部分，也不排除其内在感受。
- issue: דאב 所含的悲伤与衰弱
  choice: 衰残
  alternative: 悲伤
  rationale: 该词可以侧重悲伤，也可以指因悲伤而憔悴衰弱。正文选“衰残”呼应园子得到浇灌的生命意象，脚注保留“悲伤”的可能。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“必”维持先知应许的确定语气；分号区分归回欢呼与蒙福的两个并列画面。“美福”虽略带文学色彩，却能同时承载神的美善及其所赐福分，避免只保留抽象品格或只保留物质馈赠。
