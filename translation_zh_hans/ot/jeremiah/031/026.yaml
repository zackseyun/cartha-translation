  text: עַל זֹ֖את הֱקִיצֹ֣תִי וָ/אֶרְאֶ֑ה וּ/שְׁנָתִ֖/י עָ֥רְבָה לִּֽ/י־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/026.yaml
  text: At this I awoke and looked[a], and my sleep was pleasant to me.
translation:
  language: zh_hans
  text: 这时我醒来一看，觉得这一觉睡得很舒畅。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我的睡眠对我来说是甘甜的。”
    reason: 原文动词可表示“令人愉悦、甘甜”；直译保留希伯来语的味觉隐喻。
lexical_decisions:
- source_word: עַל זֹאת
  choice: 这时
  rationale: 该短语指向刚才所经历之事或当下契机；“这时”在现代汉语中自然，并保留指示作用，不把因果关系说得过强。
- source_word: הֱקִיצֹתִי
  choice: 我醒来
  rationale: 该词为第一人称单数，意为“醒来”；采用主动表达，不增添原文未明说的被动意味。
- source_word: וָאֶרְאֶה
  choice: 看了看
  rationale: ראה基本义为“看、看见”。这里紧接醒来，用“看了看”符合汉语习惯，也不具体说明看见了什么。
- source_word: וּשְׁנָתִי
  choice: 我这一觉
  rationale: שֵׁנָה意为“睡眠”。“我这一觉”比“我的睡眠”更符合现代汉语，同时保留第一人称所属关系。
- source_word: עָרְבָה לִּי
  choice: 睡得很舒畅
  rationale: 该表达表示这次睡眠令说话者感到愉悦、惬意。“舒畅”清楚自然；原词也可用味觉隐喻译为“甘甜”，故列入脚注。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“看了看”保留醒来后观看却未说明对象的含混性；分号呈现醒来观看与对睡眠的评价之间的停顿。
