language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כִּי כֹ֣ה אָמַ֣ר יְהוָ֗ה רָנּ֤וּ לְ/יַֽעֲקֹב֙ שִׂמְחָ֔ה וְ/צַהֲל֖וּ בְּ/רֹ֣אשׁ הַ/גּוֹיִ֑ם הַשְׁמִ֤יעוּ הַֽלְלוּ֙ וְ/אִמְר֔וּ הוֹשַׁ֤ע יְהוָה֙ אֶֽת עַמְּ/ךָ֔ אֵ֖ת שְׁאֵרִ֥ית יִשְׂרָאֵֽל־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/007.yaml
  text: 'For thus says Yahweh: Sing aloud with gladness for Jacob[a], and shout at the head of the nations; proclaim, praise, and say, “Save, Yahweh, your people, the remnant of Israel.”'
translation:
  language: zh_hans
  text: '耶和华如此说：

    “你们要为雅各欢喜歌唱，

    要在万国之首欢呼[a]；

    你们要传扬，要赞美，并且说：

    ‘耶和华啊，求你拯救你的子民，

    就是以色列的余民！’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在万国之首”所对应的希伯来语较难确定，也可理解为“在列国之首”或强调在列国面前公开欢呼；此处可能突出以色列的显要地位，也可能侧重宣告的公开场合。
    reason: 保留 בְּרֹאשׁ הַגּוֹיִם 的词汇与句法歧义。
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代汉语中广为人知的专名“耶和华”对应四字神名，保留其作为以色列之上帝圣约名字的性质，而不以头衔替代。
- source_word: רָנּוּ לְיַעֲקֹב שִׂמְחָה
  choice: 为雅各欢喜歌唱
  rationale: רנן表示高声而喜乐的歌唱或呼喊；לְיַעֲקֹב在复兴语境中自然理解为“为雅各”，שִׂמְחָה按状语功能译作“欢喜”。
- source_word: וְצַהֲלוּ
  choice: 欢呼
  rationale: 该命令式表示响亮、公开的喜乐呼喊；“欢呼”既保留声音强度，也符合汉语诗体。
- source_word: בְּרֹאשׁ הַגּוֹיִם
  choice: 在万国之首
  rationale: 贴近字面“在列国的头/首位”，保留它可能指显要位置、首位或公开场域的压缩表达，不在正文中擅自确定所指。
- source_word: הַשְׁמִיעוּ
  choice: 传扬
  rationale: 使役式命令意为“使人听见”；“传扬”自然表达公开发布信息的动作。
- source_word: הַלְלוּ
  choice: 赞美
  rationale: 直接保留הלל在敬拜和公开颂赞语境中的基本意义。
- source_word: הוֹשַׁע
  choice: 求你拯救
  rationale: 这是向耶和华发出的使役式命令/祈求；汉语用“求你”自然显示祈求语气，“拯救”准确表达ישׁע。
- source_word: עַמְּךָ
  choice: 你的子民
  rationale: “子民”在庄重现代汉语中自然表达属于上帝并与他有关系的群体。
- source_word: שְׁאֵרִית יִשְׂרָאֵל
  choice: 以色列的余民
  rationale: “余民”是先知文学中准确且通行的对应语，兼具幸存者与蒙保全群体的含义。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威；主
  rationale: 原文直接使用神的专名。中文正文采用读者熟悉的专名“耶和华”，不以“主”这一头衔替换；“雅威”则是另一种学术性较强的音译。
- issue: בְּרֹאשׁ הַגּוֹיִם 的解释
  choice: 在万国之首
  alternative: 在列国之首；向万国的首领；在列国中居首者之上
  rationale: 希伯来语短语高度凝练，既可能突出雅各/以色列在列国中的显要地位，也可能描写在列国面前公开欢呼的场景。正文采取接近形式的译法，并以脚注保留歧义，避免将其定为政治优越性的断言。
- issue: “以色列的余民”与“你的子民”的关系
  choice: 用“就是”表达同位说明
  alternative: 不用连接词，直接并列
  rationale: 原文以宾格标记引出“以色列的余民”，最自然可理解为对“你的子民”的同位说明；“就是”使现代汉语关系清楚，但不扩展余民概念的范围。
translation_notes:
  register: 采用现代、庄重而易懂的先知宣告体。以短行呈现希伯来诗歌的命令式层次；“欢喜歌唱—欢呼—传扬—赞美—说”保持原文递进。“余民”保留先知文学术语，同时用“就是”使同位关系符合现代汉语。
