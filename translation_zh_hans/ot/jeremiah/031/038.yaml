source:
  edition: WLC
  text: הִנֵּ֛ה יָמִ֥ים נְאֻם יְהוָ֑ה וְ/נִבְנְתָ֤ה הָ/עִיר֙ לַֽ/יהוָ֔ה מִ/מִּגְדַּ֥ל חֲנַנְאֵ֖ל שַׁ֥עַר הַ/פִּנָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/038.yaml
  text: Behold[a], days are coming, declares Yahweh, when the city will be rebuilt for Yahweh, from the Tower of Hananel to the Corner Gate.
translation:
  language: zh_hans
  text: “看哪，日子将到——这是雅威的宣告——那城必为雅威重建[a]，从哈楠业塔直到角门。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“建造”。希伯来语的被动形式本身既可指建造，也可在此语境中指重建；上下文谈到城的复兴，因此正文译作“重建”。
    reason: 保留动词在词汇层面的歧义，同时说明正文依据语境所作的选择。
lexical_decisions:
- source_word: הִנֵּה
  choice: 看哪
  rationale: 保留先知宣告开头引人注意的指示语气，也保持庄重感。
- source_word: יָמִים נְאֻם יְהוָה
  choice: 日子将到，雅威宣告
  rationale: 按希伯来语先知性惯用语自然表达将来的时刻，并以正式措辞体现 נְאֻם 的权威语气。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语音译上帝的专名，区别于“主”这一称号，并对应原文四字神名。
- source_word: וְנִבְנְתָה
  choice: 必……重建
  rationale: 该词为 Niphal 被动形式；结合耶路撒冷复兴的语境，正文采用“重建”，并用“必”表达预告的确定性。
- source_word: הָעִיר
  choice: 那城
  rationale: 原文只说“城”，上下文所指为耶路撒冷；“那城”在汉语中既自然承接语境，也不把城名增入正文。
- source_word: לַיהוָה
  choice: 为雅威
  rationale: 介词 ל 在此最自然地表达归属或奉献，说明重建后的城归雅威。
- source_word: מִמִּגְדַּל חֲנַנְאֵל
  choice: 从哈楠业塔
  rationale: מִן 标示范围的起点；专名按音译处理，מִגְדָּל 采用现代汉语常用的“塔”。
- source_word: שַׁעַר הַפִּנָּה
  choice: 直到角门
  rationale: 这是城门名称；汉语补出“直到”，使从起点到终点的范围表达完整自然。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文使用上帝的专名，而非“主”这一称号；“雅威”较直接地对应学界通常重构的读音 Yahweh，同时避免以称号替代专名。
- issue: לַיהוָה 所表达的关系
  choice: 为雅威
  alternative: 归雅威；给雅威
  rationale: 保留该城归属或奉献于雅威的含义，不进一步限定为某种特定的圣城神学解释。
- issue: נִבְנְתָה 是“建造”还是“重建”
  choice: 重建
  alternative: 建造
  rationale: 词形本身未明说“再次”，但本段的复兴语境明显指向一座遭毁之城的恢复；以脚注保留原文可作较宽理解的余地。
translation_notes:
  register: 采用现代、庄重而易懂的先知宣告体。“看哪”保留经文的郑重提示语气；引号和插入式的“雅威宣告”使汉语层次清楚。地名用“哈楠业塔”和“角门”，兼顾音译准确与现代可读性。
