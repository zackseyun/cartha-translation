  text: כֹּ֚ה אָמַ֣ר יְהוָ֔ה מָצָ֥א חֵן֙ בַּ/מִּדְבָּ֔ר עַ֖ם שְׂרִ֣ידֵי חָ֑רֶב הָל֥וֹךְ לְ/הַרְגִּיע֖/וֹ יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/002.yaml
  text: 'Thus says Yahweh: The people who survived the sword found favor in the wilderness; Israel[a], when it went to find rest for him.'
translation:
  language: zh_hans
  text: '耶和华如此说：


    “从刀剑下幸存的百姓在旷野蒙了恩；

    以色列前去，使他得安歇[a]。”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本句希伯来文句法较难。“以色列”可理解为前面“百姓”的同位语；“他”的所指也不明确。末句也可理解为：“我前去，使他安歇；以色列”，或“他前去，使以色列安歇”。
    reason: 保留 הָלוֹךְ、לְהַרְגִּיעוֹ 的主语与代词所指，以及句末“以色列”句法功能上的真实歧义。
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的神圣名译法，明确保留原文专名，而不以“主”这一称号代替。
- source_word: מָצָא חֵן
  choice: 蒙了恩
  rationale: 这是表示获得恩待或悦纳的常见希伯来语习语；“蒙了恩”自然、庄重，也不额外引入后期神学含义。
- source_word: בַּמִּדְבָּר
  choice: 在旷野
  rationale: מִדְבָּר可指荒野、旷野或草原地带；“旷野”既符合词义范围，也保留出埃及传统的呼应。
- source_word: עַם שְׂרִידֵי חָרֶב
  choice: 从刀剑下幸存的百姓
  rationale: 保留“刀剑”的战争与审判意象，同时用现代中文清楚表达“余民、幸存者”的含义。
- source_word: הָלוֹךְ
  choice: 前去
  rationale: 该绝对不定词在此处带有行进的动态含义；“前去”在不强行确定隐含主语时，仍能传达这一动作。
- source_word: לְהַרְגִּיעוֹ
  choice: 要为他寻得安歇
  rationale: 该短语含使某人安歇之意，并带第三人称阳性单数后缀。译文保留“他”，避免在正文中擅自确定其所指；“寻得安歇”也承接前去寻找安息之所的语境。
- source_word: יִשְׂרָאֵל
  choice: 以色列
  rationale: 采用标准中文专名；其位置可回指并说明前面的“百姓”，也可能参与末句的困难句法，故尽量贴近原文次序。
theological_decisions:
- issue: 末句 הָלוֹךְ לְהַרְגִּיעוֹ יִשְׂרָאֵל 的主语、宾语及句法关系
  choice: 译作“以色列前去，要为他寻得安歇”，保留第三人称代词和前往安歇之意，不在正文中明确“他”的所指。
  alternative: “我前去使以色列安歇”或“他前去使以色列安歇”。
  rationale: 原文的绝对不定词没有明确标示人称，לְהַרְגִּיעוֹ 又含第三人称阳性单数后缀，而“以色列”置于句末，既可能是前述百姓的同位语，也可能与末句构成其他句法关系。正文与脚注共同保存这种真实歧义，不把上帝或以色列强定为唯一可能的行动者。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“刀剑下幸存”“旷野”“安歇”等表达保留先知文学意象；末句刻意略显紧缩，以反映原文确有的句法困难，并用脚注提供主要异读。
