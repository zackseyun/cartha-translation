  rationale: 修订以“握住他们的手”准确对应原文的引导动作，以“他们的列祖”恢复所有关系并保留“父辈”用语；将违约分句改为汉语中更顺畅的直接陈述。最必要的修订是更正脚注对《希伯来书》8:9希腊文的描述，同时不抹除 בָּעַלְתִּי 的婚姻性与统治性双重词义可能。
