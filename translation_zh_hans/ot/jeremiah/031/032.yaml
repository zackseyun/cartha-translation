  text: לֹ֣א כַ/בְּרִ֗ית אֲשֶׁ֤ר כָּרַ֨תִּי֙ אֶת אֲבוֹתָ֔/ם בְּ/יוֹם֙ הֶחֱזִיקִ֣/י בְ/יָדָ֔/ם לְ/הוֹצִיאָ֖/ם מֵ/אֶ֖רֶץ מִצְרָ֑יִם אֲשֶׁר הֵ֜מָּה הֵפֵ֣רוּ אֶת בְּרִיתִ֗/י וְ/אָנֹכִ֛י בָּעַ֥לְתִּי בָ֖/ם נְאֻם יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/032.yaml
  text: not like the covenant that I made with their fathers on the day I took them by the hand to bring them out of the land of Egypt[a], my covenant that they themselves broke, though I was their husband, declares Yahweh.
translation:
  language: zh_hans
  text: 不像我在握住他们的手、领他们出埃及地的那日，与他们的列祖所立的约；他们自己违背了我的约，尽管我是他们的丈夫[a]。这是雅威的宣告。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“尽管我是他们的主”，或“尽管我管辖他们”。这个希伯来语动词既可表达婚姻关系，也可表达作主或管辖。《希伯来书》8:9所引的希腊文则作“我不再顾念他们”（或“我不理会他们”），与此处希伯来文的措辞不同。
    reason: alternative_reading
lexical_decisions:
- source_word: לֹא כַבְּרִית
  choice: 不像……所立的约
  rationale: כ 表示比较；译作“不像”自然地保留比较含义，而非否定约本身。
- source_word: כָּרַתִּי אֶת אֲבוֹתָם
  choice: 与他们祖先所立的约
  rationale: “立约”是现代汉语中对应希伯来语“切约”的惯用表达；אֲבוֹתָם 在历代群体语境中译为“他们祖先”，清楚且不过度限定为男性父辈。
- source_word: בְּיוֹם הֶחֱזִיקִי בְיָדָם
  choice: 我从前拉着……的手……时
  rationale: 保留“握住/拉着手”的具体引导意象；“从前……时”比逐字的“在那日”更符合此处 בְּיוֹם 表示事件发生之时的汉语表达。
- source_word: לְהוֹצִיאָם מֵאֶרֶץ מִצְרָיִם
  choice: 领他们出埃及地
  rationale: 使役式表达带出“使他们出去”的意义；“领……出”同时自然衔接拉手引导的图像。
- source_word: אֲשֶׁר הֵמָּה הֵפֵרוּ אֶת בְּרִיתִי
  choice: 我的约，是他们自己违背的
  rationale: “他们自己”体现独立代词 הֵמָּה 的强调；“违背约”准确表达 הפר 的破坏、废弃约之意。
- source_word: וְאָנֹכִי בָּעַלְתִּי בָם
  choice: 尽管我是他们的丈夫
  rationale: “尽管”表达前后反差；“丈夫”保留 בעל 在此约关系语境中的婚姻意象，同时将“作他们的主/管辖他们”的可能含义收入脚注。
- source_word: נְאֻם יְהוָה
  choice: 这是雅威的宣告
  rationale: 用庄重而自然的先知宣告公式，并按专名音译 יְהוָה 为“雅威”。
theological_decisions:
- issue: בָּעַלְתִּי בָם 的关系性或统治性含义
  choice: 尽管我是他们的丈夫
  alternative: 尽管我是他们的主；尽管我管辖他们
  rationale: 马所拉文本的动词可表达婚姻关系，也可带有作主、管辖之义。正文采用与耶利米书婚姻—盟约意象相契的读法，但以脚注明确保存另一种真实可能，也说明《希伯来书》8:9 所引希腊文本反映后者。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“拉着……的手”保留具体形象；分号和同位重述使长句层次清楚。神名 יְהוָה 译作“雅威”。
