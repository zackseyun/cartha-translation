  text: כֹּֽה אָמַ֞ר יְהוָ֤ה צְבָאוֹת֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל ע֣וֹד יֹאמְר֞וּ אֶת הַ/דָּבָ֣ר הַ/זֶּ֗ה בְּ/אֶ֤רֶץ יְהוּדָה֙ וּ/בְ/עָרָ֔י/ו בְּ/שׁוּבִ֖/י אֶת שְׁבוּתָ֑/ם יְבָרֶכְ/ךָ֧ יְהוָ֛ה נְוֵה צֶ֖דֶק הַ֥ר הַ/קֹּֽדֶשׁ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/023.yaml
  text: 'Thus says Yahweh of hosts[a], the God of Israel: They will yet say this word in the land of Judah and in its cities, when I restore their fortunes: “May Yahweh bless you, O habitation of righteousness[b], O holy mountain.”'
translation:
  language: zh_hans
  text: 万军之雅威、以色列的上帝如此说：“当我使他们的景况复原[a]时，在犹大地和其中的城邑，人们必再说这话：‘公义的居所[b]、圣山啊，愿雅威赐福给你！’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“当我使被掳的人归回时”或“当我使他们摆脱被掳的处境时”。这个希伯来语习语既可特指从流亡、被掳中归回，也可泛指恢复原有的福分和景况。
    reason: lexical_alternative
  - marker: b
    text: 或译“公义的住处”或“公义的牧场”。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה צְבָאוֹת
  choice: 万军之雅威
  rationale: “雅威”直接呈现神的圣名；“万军之”保留צְבָאוֹת所指天上、地上众军的宽广含义，并符合庄重的现代汉语圣经语体。
- source_word: עוֹד יֹאמְרוּ אֶת־הַדָּבָר הַזֶּה
  choice: 人们还要说这话
  rationale: עוֹד在复兴应许的语境中表示这句话将再次被听见；“还要”自然传达这种将来的恢复与重现。希伯来语未明说主语，汉语以泛指“人们”补足句法。
- source_word: בְּאֶרֶץ יְהוּדָה וּבְעָרָיו
  choice: 在犹大地和其中的城邑
  rationale: 后缀指向作为地域的犹大；“其中的城邑”既清楚又避免汉语中不自然的阳性代词。
- source_word: בְּשׁוּבִי אֶת־שְׁבוּתָם
  choice: 当我使他们的景况复原时
  rationale: שׁוּב שְׁבוּת是可指被掳者归回、也可泛指命运或整体处境恢复的习语。“使他们的景况复原”保留较宽的恢复意义，脚注交代被掳归回的具体可能。
- source_word: יְבָרֶכְךָ
  choice: 愿雅威赐福给你
  rationale: 此处未完成式具有祈愿语气；“愿……赐福”准确表达祝福用语。
- source_word: נְוֵה צֶדֶק
  choice: 公义的居所
  rationale: נָוֶה可指居所、住处或牧场；与“圣山”并列并作为锡安的称呼时，“居所”最自然，同时用脚注保留“牧场”的词义可能。
- source_word: הַר הַקֹּדֶשׁ
  choice: 圣山
  rationale: 简洁保留“山”与“圣”的名词结构，符合锡安作为神圣山岭的称谓。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；音译“雅威”较贴近学界通常重建的读音，也不以称号替代专名。
- issue: שׁוּב שְׁבוּת所指的恢复范围
  choice: 使他们的景况复原
  alternative: 使被掳的人归回／使他们摆脱被掳的处境
  rationale: 上下文包含被掳归回的历史背景，但该希伯来习语也可表达更广泛的处境逆转。正文不把含义限定为单一解释，脚注保留较具体的理解。
- issue: נְוֵה צֶדֶק对锡安的刻画
  choice: 公义的居所
  alternative: 公义的牧场
  rationale: 原词兼有居所和牧场之义；与“圣山”同位并列时采用较宽的“居所”，不额外规定其神学所指。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“城邑”略带书面色彩，但在先知书地理语境中清楚自然；引语次序稍作汉语化调整，将时间从句前置，同时保持原文各语义成分及“公义的居所／圣山”的呼语关系。
