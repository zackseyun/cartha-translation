base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/027.yaml
  text: Behold[a], days are coming, declares Yahweh, when I will sow the house of Israel and the house of Judah with the seed of man and the seed of beast.
translation:
  language: zh_hans
  text: “看哪，日子将要来到——这是耶和华的宣告：我要把人的种子[a]和牲畜的种子撒播在以色列家和犹大家。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “人的种子”指人的后代，或泛指人类；它与“牲畜的种子”并列。这里以撒种的图像表达以色列家和犹大家将有人和牲畜增添。
    reason: 说明אָדָם在此泛指人类，并解释与“牲畜的种子”相配的撒种图像；避免将“人”误解为仅指男性或将“种子”限于生理含义。
lexical_decisions:
- source_word: הִנֵּה
  choice: 看哪
  rationale: 保留先知宣告开头用于唤起注意的指示语气；在现代中文中庄重而易懂。
- source_word: יָמִים בָּאִים
  choice: 日子将到
  rationale: 沿用先知文学常见的未来公式，同时保持希伯来文简洁的表达。
- source_word: נְאֻם יְהוָה
  choice: 耶和华说
  rationale: 自然传达先知宣告公式；“说”比“宣告”更符合现代汉语，同时不削弱其神谕性质。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经传统中对神圣四字名的通行音译，明确保留专名指称。
- source_word: וְזָרַעְתִּי
  choice: 我要……撒下
  rationale: 保留זרע“撒种”的农业意象，而不将其直接释为“使……重新繁衍”。
- source_word: בֵּית יִשְׂרָאֵל ... בֵּית יְהוּדָה
  choice: 以色列家和犹大家
  rationale: 保留“家”所表达的群体与盟约共同体含义，不简化为地名“以色列和犹大”。
- source_word: זֶרַע אָדָם
  choice: 人的种子
  rationale: 保留“种子”意象及其与“牲畜的种子”的平行关系；“人”在此泛指人类，并非仅指男性。
- source_word: וְזֶרַע בְּהֵמָה
  choice: 和牲畜的种子
  rationale: 保留集合单数和与前一短语相称的撒种隐喻；“牲畜”也契合此处有关人口与家畜恢复的语境。
theological_decisions:
- issue: 如何表达复兴与重新繁衍的隐喻
  choice: 保留“撒下人的种子和牲畜的种子”的农业隐喻
  alternative: 译作“使以色列和犹大重新有人居住、牲畜繁多”
  rationale: 直译保留耶利米书中的撒种意象及其文学联系，又由脚注说明其所指，不把经文隐含的复兴意义改写成解释性陈述。
- issue: אָדָם的泛指范围
  choice: 译作“人”，泛指人类
  alternative: 译作“男人”或直接意译为“人口”
  rationale: 原词在这里不是男性专称；译作“人”既准确涵盖全人类，也能维持与“牲畜”的对举。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“看哪”和“以色列家、犹大家”保留先知文体及群体称谓；用“撒下……种子”保存原文意象，并以脚注帮助普通读者理解。
