source:
  edition: WLC
  text: שִׁמְע֤וּ דְבַר יְהוָה֙ גּוֹיִ֔ם וְ/הַגִּ֥ידוּ בָ/אִיִּ֖ים מִ/מֶּרְחָ֑ק וְ/אִמְר֗וּ מְזָרֵ֤ה יִשְׂרָאֵל֙ יְקַבְּצֶ֔/נּוּ וּ/שְׁמָר֖/וֹ כְּ/רֹעֶ֥ה עֶדְרֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/010.yaml
  text: Hear the word of the LORD, O nations, and declare it in the coastlands far away; say, “He who scattered Israel will gather him and will keep him as a shepherd keeps his flock.”
translation:
  language: zh_hans
  text: 列国啊，要听耶和华的话！要在远方的海岛上传扬，说：“那使以色列分散的，必将他聚集，又必看守他，如牧人看守自己的羊群。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: גּוֹיִם
  choice: 列国
  rationale: 该词为复数，指以色列以外的各国或万国；“列国”既准确又符合先知书的庄重语体。
- source_word: אִיִּים
  choice: 海岛
  rationale: 原词可指岛屿或沿海之地；此处保留其传统且具体的地理意象，不将范围缩限为某一地区。
- source_word: מִמֶּרְחָק
  choice: 远方的
  rationale: 与“海岛”结合，表达从遥远之地传扬信息；语序按现代汉语自然调整。
- source_word: מְזָרֵה
  choice: 那使……分散的
  rationale: 希伯来语为使役分词，兼有过去行为与施行者身份的意味；用名词化结构保留这种表达。
- source_word: יִשְׂרָאֵל
  choice: 以色列
  rationale: 此处可指作为整体的以色列民；后续阳性单数代词“他”承接这一集体人格。
- source_word: יְקַבְּצֶנּוּ
  choice: 必将他聚集
  rationale: 保留阳性单数宾语所体现的集体人格，也保留未完成体在预言语境中的将来含义。
- source_word: וּשְׁמָרוֹ
  choice: 又必看守他
  rationale: שׁמר可指守护、看守、保全；结合牧羊比喻，“看守”既贴近词义，也不额外限定为单纯保护。
- source_word: כְּרֹעֶה עֶדְרוֹ
  choice: 如牧人看守自己的羊群
  rationale: 原文直译近于“像牧人（看守）他的羊群”；补出由前一动词支配的“看守”，使汉语关系清楚，并以“自己的”准确表达所属。
theological_decisions:
- issue: 使以色列分散者的身份
  choice: 保留“那使以色列分散的”这一迂回称谓
  alternative: 直接译作“耶和华使以色列分散，也必聚集他”
  rationale: 上下文清楚暗示主语是耶和华，但本节希伯来文本刻意采用分词称谓；译文不把隐含身份改写成显明主语，以保存原文的修辞张力。
- issue: 以色列作为集体的代词
  choice: 用单数“他”
  alternative: 译作“他们”或重复“以色列民”
  rationale: 原文以阳性单数后缀指代作为整体的以色列。保留“他”可呈现集体人格，不把原文改成复数。
- issue: שׁמר在牧羊意象中的含义
  choice: 译为“看守”
  alternative: 译为“保护”或“照料”
  rationale: “保护”强调免受伤害，“照料”强调养育，二者都可能包含在牧者意象中；“看守”较宽，能保留原词在此处的语义张力。
translation_notes:
  register: 采用现代、庄重而易懂的先知宣告语体。以“列国啊”表达呼语，以两个感叹号后的祈使句呈现公开宣告的力度；引语内部保持简洁、平行。神名按现代中文圣经通行形式译为“耶和华”。
