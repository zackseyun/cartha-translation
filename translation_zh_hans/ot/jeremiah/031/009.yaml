id: JER.31.9
reference: Jeremiah 31:9
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: בִּ/בְכִ֣י יָבֹ֗אוּ וּֽ/בְ/תַחֲנוּנִים֮ אֽוֹבִילֵ/ם֒ אֽוֹלִיכֵ/ם֙ אֶל נַ֣חֲלֵי מַ֔יִם בְּ/דֶ֣רֶךְ יָשָׁ֔ר לֹ֥א יִכָּשְׁל֖וּ בָּ֑/הּ כִּֽי הָיִ֤יתִי לְ/יִשְׂרָאֵל֙ לְ/אָ֔ב וְ/אֶפְרַ֖יִם בְּכֹ֥רִ/י הֽוּא־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/009.yaml
  text: They will come with weeping, and with pleas for mercy[a] I will lead them; I will guide them to streams of water, on a straight path where they will not stumble. For I am a father to Israel, and Ephraim is my firstborn.
translation:
  language: zh_hans
  text: 他们必哭泣着前来；我要在他们的恳求中引领他们[a]。我要带领他们到水流旁，走平直的路；他们在这路上必不绊倒。因为我是以色列的父，以法莲是我的长子。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我要带着恳求引领他们。”
    reason: 希伯来语介词短语可按较形式对应的方式译为“带着恳求”；正文以自然中文表达恳求伴随上帝引领他们的关系，而不将其限定为时间或原因。
lexical_decisions:
- source_word: בִּבְכִי
  choice: 哭泣着
  rationale: בְּ表示伴随或方式；此译保留具体形象，不擅自判定哭泣出于悔罪、悲伤还是喜乐。
- source_word: יָבֹאוּ
  choice: 前来
  rationale: 准确表达בוא的简单来行动作，并适合归回语境。
- source_word: וּבְתַחֲנוּנִים
  choice: 他们恳求怜悯时
  rationale: תַּחֲנוּנִים通常指恳求恩惠或怜悯；中文以分句表达，既自然，也保留其祈求意味。
- source_word: אֹבִילֵם
  choice: 我要引领他们
  rationale: יבל的使役式表示领着、带领，适合上帝引导百姓的语境。
- source_word: אֹלִיכֵם
  choice: 我要带领他们
  rationale: הלך的使役式表示使之行走或带领；与前一动词语义重叠，中文用“带领”自然呈现移动含义。
- source_word: נַחֲלֵי מַיִם
  choice: 水溪旁
  rationale: 该组合词指有水的溪流或水道；“到水溪旁”符合现代汉语，也保存赐生命的意象。
- source_word: בְּדֶרֶךְ יָשָׁר
  choice: 走正直的路
  rationale: יָשָׁר可指笔直、平坦或不受阻碍；“正直的路”保留原文空间意象及其潜在道德回响，不将意义限缩为“平坦”。
- source_word: לֹא יִכָּשְׁלוּ בָּהּ
  choice: 在路上不致绊倒
  rationale: 阴性代词回指“路”；此译明确回指关系，并以自然中文表达安全行走。
- source_word: כִּי הָיִיתִי לְיִשְׂרָאֵל לְאָב
  choice: 因为我是以色列的父
  rationale: 状态性完成式在此申明既定关系；译作“我是”避免误添此时才成为父的起始含义。
- source_word: וְאֶפְרַיִם בְּכֹרִי הוּא
  choice: 以法莲是我的长子
  rationale: בְּכוֹר指长子及其身份地位；现代汉语无需另行直译强调代词הוּא。
theological_decisions:
- issue: 百姓哭泣和恳求的性质
  choice: 不说明眼泪具体出于悔罪、悲伤还是复兴的喜乐。
  alternative: 明确译为悔罪的哭泣，或因归回而喜极而泣。
  rationale: 希伯来文只说明他们前来的方式，没有交代其情绪或神学原因，故保留歧义。
- issue: 父亲陈述中הָיִיתִי的时态效力
  choice: 译为“我是以色列的父”。
  alternative: “我一直是以色列的父”或“我成了以色列的父”。
  rationale: 此处状态性完成式确认既定关系；“成了”会加入原文未明说的关系起点，“一直是”则强化了持续时间。
- issue: “以法莲是我的长子”的身份含义
  choice: 直译为“长子”，不在正文解释为生理出生次序或专指继承地位。
  alternative: 译作“首生子”或解释性译为“承受长子名分的儿子”。
  rationale: 原文使用亲属身份词，带有地位与继承意味，但本节未展开其具体机制，应保留经文张力。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“哭泣着前来”保留方式状语；分号和句号划分动作与原因。正文中的[a]紧接其所说明的“恳求怜悯时”。
