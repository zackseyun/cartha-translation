  to: 他们必哭泣着前来；我要在他们的恳求中引领他们[a]。我要带领他们到水流旁，走平直的路；他们在这路上必不绊倒。因为我是以色列的父，以法莲是我的长子。
  rationale: 修订恢复“恳求”与“引领”之间未被限定的伴随关系，避免“恳求时”所加入的时间含义。并将路线译为“平直的路”，将水的意象译为“水流旁”，使中文更自然且更贴近原文的复兴与安全引导图景。保留哭泣原因的未定性，以及“父”和“长子”的关系与地位语言。
