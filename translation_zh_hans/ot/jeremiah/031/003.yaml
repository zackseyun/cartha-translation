id: JER.31.3
reference: Jeremiah 31:3
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: מֵ/רָח֕וֹק יְהוָ֖ה נִרְאָ֣ה לִ֑/י וְ/אַהֲבַ֤ת עוֹלָם֙ אֲהַבְתִּ֔י/ךְ עַל כֵּ֖ן מְשַׁכְתִּ֥י/ךְ חָֽסֶד־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/003.yaml
  text: 'From far away Yahweh appeared to me: “I have loved you with an everlasting love[b][a]; therefore I have drawn you with steadfast love.”'
translation:
  language: zh_hans
  text: '雅威从远处向我显现[a]，说：


    “我以永恒的爱爱着你；


    因此，我以忠贞的爱吸引你[b]。”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “从远处”也可连于“显现”，译作“雅威从远处向我显现”；在此语境中也有人将其理解为“很久以前”。另有译法按上下文将受显现者译作“他”，但马所拉文本作“向我”。
    reason: 保留מֵרָחוֹק在句中的附着及空间／时间理解的可能性，并准确说明代词的语境性替代译法。
  - marker: b
    text: “以忠贞的爱吸引你”也可译作“继续以忠贞的爱待你”。“忠贞的爱”所译的希伯来词חֶסֶד，含有忠诚、坚定和施恩的意味，也可译作“慈爱”或“信实之爱”。
    reason: 说明משך与חֶסֶד的句法理解余地及חֶסֶד的丰富词义。
lexical_decisions:
- source_word: מֵרָחוֹק
  choice: 从远处
  rationale: 该词组通常表示空间上的遥远，译为“从远处”自然且保留原文意象；在本节中也可能表示时间上的久远，另在脚注说明。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常用音译呈现四字神名，保留其作为以色列之上帝专名的性质，而不以称号代替。
- source_word: נִרְאָה לִי
  choice: 向我显现
  rationale: ראה 的尼法勒式在这里自然表示“显现”，לִי 表示显现的对象是“我”。
- source_word: וְאַהֲבַת עוֹלָם
  choice: 以永恒的爱
  rationale: עוֹלָם 在这里主要表达绵延不尽、恒久不变；“永恒的爱”简洁庄重，也保留其持续性的力度。
- source_word: אֲהַבְתִּיךְ
  choice: 爱你
  rationale: 希伯来语完成式表达已经确立、并对现在仍有效的爱；汉语“我以永恒的爱爱你”借助“永恒”本身即可传达持续效力，无须生硬添加“已经”。阴性单数后缀在语境中指向被人格化为女子的以色列。
- source_word: עַל כֵּן
  choice: 因此
  rationale: 明确保留前后两句之间的推论或因果关系。
- source_word: מְשַׁכְתִּיךְ
  choice: 吸引你
  rationale: משך 的基本义是“拉、牵引”，在此可自然理解为以爱把对方吸引过来；同时该结构也可能表示向对方延续或施行慈爱，故以脚注保留另一理解。
- source_word: חָסֶד
  choice: 忠贞的爱
  rationale: חֶסֶד 常指坚定、忠诚并付诸行动的慈爱。“忠贞的爱”既区别于前句一般的“爱”，也保留其关系性和信实色彩，而不把词义限定为某一套神学术语。
theological_decisions:
- issue: “爱”（אַהֲבָה）与“忠贞的爱”（חֶסֶד）的关系
  choice: 以两个相关但有区别的表达分别译作“爱”和“忠贞的爱”。
  alternative: 两处都译作“爱”，或将 חֶסֶד 译作“盟约信实”。
  rationale: 原文使用两个不同而相关的词。区分翻译可保存其语义层次，同时避免把 חֶסֶד 过度收窄为一种特定的教义解释。
- issue: מֵרָחוֹק 的空间义与时间义
  choice: 正文采用“从远处”，保留空间图景。
  alternative: 译作“很久以前”或“古时”。
  rationale: 该词可描述距离，也可引申为久远的时间；本句语法容许两种理解，因此正文择一，脚注保存另一可能。
- issue: משך 与 חֶסֶד 的句法关系
  choice: 译作“以忠贞的爱吸引你”。
  alternative: 译作“继续以忠贞的爱待你”或“向你延续慈爱”。
  rationale: 正文保留 משך 的常见牵引义以及上帝以爱吸引人的意象，但不排除该短语表达延续、施行慈爱的惯用理解。
translation_notes:
  register: 采用现代、庄重而易懂的诗体汉语。保留原文两行神谕的平行结构；使用“雅威”呈现神名。“我以永恒的爱爱你”有意保留原文同根词形成的强调，虽略带重复，却在现代汉语中仍自然有力。
