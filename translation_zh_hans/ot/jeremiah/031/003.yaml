  to: '雅威从远处向我显现[a]，说：


    “我以永恒的爱爱着你；


    因此，我以忠贞的爱吸引你[b]。”'
  rationale: 仅作两项安全的小修：以“爱着你”改善现代汉语的自然度，同时保留原文同根强调和持续有效的语境；重写脚注a，使其准确区分短语附着、时间性理解和代词的语境性处理。
