source:
  edition: WLC
  text: כֹּ֣ה אָמַ֣ר יְהוָ֗ה ק֣וֹל בְּ/רָמָ֤ה נִשְׁמָע֙ נְהִי֙ בְּכִ֣י תַמְרוּרִ֔ים רָחֵ֖ל מְבַכָּ֣ה עַל בָּנֶ֑י/הָ מֵאֲנָ֛ה לְ/הִנָּחֵ֥ם עַל בָּנֶ֖י/הָ כִּ֥י אֵינֶֽ/נּוּ׀־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/015.yaml
  text: 'Thus says Yahweh: “A voice is heard in Ramah[a], lamentation and bitter weeping—Rachel weeping for her children. She refuses to be comforted for her children[b], because they are no more.”'
translation:
  language: zh_hans
  text: '耶和华如此说：


    “在拉玛[a]有声音传来，

    是哀号和悲痛的哭泣；

    拉结为她的儿女哀哭，

    不肯为她的儿女接受安慰，

    因为他们已经不在了[b]。”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 拉玛是与便雅悯支派地域有关的一座城；这里以诗歌笔法描绘先祖拉结为自己的后裔哀哭。
    reason: cultural_note
  - marker: b
    text: 或译：“因为他已经不在了。”希伯来文在这个惯用表达中使用单数形式，但上下文把拉结的儿女作为一个群体来讲。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经语境中最通行、庄重且易于辨识的神名译法。
- source_word: כֹּה אָמַר
  choice: 如此说
  rationale: 保留先知传信公式的正式语气，同时符合现代中文表达。
- source_word: קוֹל בְּרָמָה נִשְׁמָע
  choice: 在拉玛有声音传来
  rationale: 保留“声音”这一宽泛意象，并以“传来”自然表达希伯来文被动式“被听见”。
- source_word: נְהִי
  choice: 哀号
  rationale: 表达公开而强烈的哀悼之声，比泛称“悲哀”更贴近原词。
- source_word: בְּכִי תַמְרוּרִים
  choice: 痛哭
  rationale: 以自然凝练的中文表达充满苦楚的哭泣；与“哀号”并列，保留情感递进。
- source_word: רָחֵל מְבַכָּה עַל בָּנֶיהָ
  choice: 拉结为她的儿女哀哭
  rationale: 将 בנים 按集体后裔语境译为“儿女”，并以“为……哀哭”表达 עַל 所含的哀悼关系。
- source_word: מֵאֲנָה לְהִנָּחֵם
  choice: 不肯……接受安慰
  rationale: “不肯”保留主动拒绝之意；“接受安慰”自然呈现 Niphal 在此处的被动或反身语义。
- source_word: כִּי אֵינֶנּוּ
  choice: 因为他们已经不在了
  rationale: 按前文集合性的“儿女”采用复数表达，同时以脚注保留原文单数形式造成的歧义。
theological_decisions:
- issue: כִּי אֵינֶנּוּ 的数与所指对象
  choice: 正文译作“因为他们已经不在了”
  alternative: “因为他已经不在了”
  rationale: 原文使用单数形式，但直接语境中的“她的儿女”是集合性复数。中文正文依上下文采用复数，不将哀悼缩限为一个儿女；脚注说明原文形式，以保留语法和诗意上的张力。
- issue: 拉结形象与其儿女的范围
  choice: 保留“拉结为她的儿女哀哭”的诗性拟人表达
  alternative: 解释性改写为“拉结的后裔为被掳者哀哭”
  rationale: 原文直接描绘先祖拉结哀悼后裔，不宜在正文中把诗歌形象改写为历史解释；背景信息置于脚注。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。诗行分排以呈现哀歌节奏；避免文言化过重。脚注标记均置于正文对应位置，并按其实际内容校正了英文咨询层中似乎对调的脚注顺序。
