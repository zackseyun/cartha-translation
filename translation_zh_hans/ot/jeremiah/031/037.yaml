  to: 耶和华如此说：若能量度上面的诸天，又能探究下面大地的根基，那么我也会因他们所做的一切而弃绝以色列所有的后裔。这是耶和华的宣告。
  rationale: 修订仅调整汉语句法和受词位置：以“又能”明确两个平行的条件，以“那么我也会”对应原文的后件及גַּם אֲנִי，并直接保留“弃绝以色列所有的后裔”的受词结构。“因他们所做的一切”中的“他们”明确回指紧随其后的“以色列所有的后裔”，在中文中自然且不改变原意。删除仅为原译文代词改写而设的脚注。
