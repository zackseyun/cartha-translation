  terminology: “耶和华”“诸天”“大地的根基”“弃绝”“以色列的后裔”均合乎中文圣经语域，也忠实表达神名、宇宙图景、מאס及集合性的זרע。无需为“弃绝他们”设脚注；原文的受词并无需要以脚注交代的文本或词义歧义。
