base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/037.yaml
  text: 'Thus says Yahweh: If the heavens above can be measured[a], and the foundations of the earth below can be searched out, then I also will reject all the offspring of Israel for all that they have done, declares Yahweh.'
translation:
  language: zh_hans
  text: 耶和华如此说：若能量度上面的诸天，又能探究下面大地的根基，那么我也会因他们所做的一切而弃绝以色列所有的后裔。这是耶和华的宣告。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的专名形式，明确保留原文中的上帝之名。
- source_word: כֹּה אָמַר
  choice: 如此说
  rationale: 保留先知宣告公式的庄重和简洁；与句末“宣告”形成原文式框架。
- source_word: אִם יִמַּדּוּ
  choice: 若能量度
  rationale: 保留条件句形式，并以“能”表达上下文所指的假设可能性，不把其不可能性直接写进译文。
- source_word: שָׁמַיִם מִלְמַעְלָה
  choice: 上面的诸天
  rationale: “诸天”体现 שָׁמַיִם 的形式，并保留与“下面”相对的垂直宇宙图景。
- source_word: וְיֵחָקְרוּ
  choice: 也能探究
  rationale: חקר 指深入查考、彻底探明；“探究”自然且保留认知上的穷究意味。
- source_word: מוֹסְדֵי אֶרֶץ לְמָטָּה
  choice: 下面大地的根基
  rationale: 保留古代宇宙图景及“上面／下面”的平行结构；此处 אֶרֶץ 按普世语境译作“大地”。
- source_word: גַּם אֲנִי אֶמְאַס
  choice: 我才会……弃绝
  rationale: “才”自然标示后件只在前述条件成立时出现，也传达 גַּם 的对应强调；“弃绝”比一般的“拒绝”更适合关系与群体语境。
- source_word: בְּכָל זֶרַע יִשְׂרָאֵל
  choice: 以色列所有后裔……他们
  rationale: זֶרַע 是集合名词，现代中文以“所有后裔”表达最清楚；将受词提前为因果结构中的代词所回指，避免中文歧义。
- source_word: עַל כָּל אֲשֶׁר עָשׂוּ
  choice: 因……所做的一切
  rationale: עַל 在此表示弃绝的原因或根据；“因”简洁而准确，复数动词所指的主体由“他们”明确表达。
- source_word: נְאֻם יְהוָה
  choice: 这是耶和华的宣告
  rationale: 保留先知书常见的神谕收束语，并使用自然、庄重的现代汉语。
theological_decisions:
- issue: 关于以色列被弃绝之条件句的语力
  choice: 保留“若……才……”的条件形式，让天地不可测、地基不可穷究的上下文显出其反事实或不可能条件，从而强调耶和华不会弃绝以色列全部后裔。
  alternative: 直接意译为“我绝不会弃绝以色列的后裔”，或仅作不带修辞暗示的普通条件句。
  rationale: 原文并未直接使用“绝不”，而是借宇宙性的条件作保证。译文既不抹去条件形式，也以自然中文呈现前件与后件的严格关联，保留经文的修辞力量与神学张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。保留先知宣告的首尾公式、“诸天／大地根基”的宇宙图景及条件句的修辞结构；不用古奥的“测度”“穷察”，也不在正文中直接解释该条件为不可能。
