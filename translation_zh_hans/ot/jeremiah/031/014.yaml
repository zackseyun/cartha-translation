  text: וְ/רִוֵּיתִ֛י נֶ֥פֶשׁ הַ/כֹּהֲנִ֖ים דָּ֑שֶׁן וְ/עַמִּ֛/י אֶת טוּבִ֥/י יִשְׂבָּ֖עוּ נְאֻם יְהוָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/014.yaml
  text: I will satisfy the priests with abundance[a], and my people will be filled with my goodness[c][b], declares Yahweh.
translation:
  language: zh_hans
  text: 我要使祭司饱享丰盛的供应[a]；我的子民必饱享我的恩惠[b]。这是耶和华的宣告。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译可作“我要使祭司的生命（或欲求）因肥美而饱足”；“肥美”在这里指丰厚、上好的供应。
    reason: lexical_alternative
  - marker: b
    text: “我的恩惠”也可译作“我的美善”“我的福惠”，或“我所赐的美物”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרִוֵּיתִי
  choice: 我要使……饱享
  rationale: רוה 的 Piel 形表示使人充分饮用、得到饱足；“饱享”既保留充分满足之意，也自然衔接所赐的丰盛。
- source_word: נֶפֶשׁ הַכֹּהֲנִים
  choice: 祭司
  rationale: נפש 在这里指人的生命、欲求或整个人，置于供给充足的语境中，汉语直接说“使祭司饱享”最自然；脚注保留原文的表达。
- source_word: דָּשֶׁן
  choice: 丰盛
  rationale: 该词本义为肥美、肥沃，由此引申为丰厚的供应；“丰盛”在现代汉语中自然，并保留富足丰美的意象。
- source_word: וְעַמִּי
  choice: 我的子民
  rationale: 准确表达盟约性的所属关系；“子民”符合庄重的先知文体。
- source_word: אֶת־טוּבִי
  choice: 因我的美善
  rationale: טוב 可指美善、福惠或美物。“美善”保留抽象的神圣属性及其具体恩惠之间的语义宽度；“因”按汉语补出关系，同时不把它限定为单纯物质供应。
- source_word: יִשְׂבָּעוּ
  choice: 要……满足
  rationale: שׂבע 表示吃喝充足、得到满足。“满足”准确传达饱足之义，并与前半句的“饱享”形成自然平行。
- source_word: נְאֻם יְהוָה
  choice: 这是耶和华说的
  rationale: 这是标准的先知宣告公式；采用自然、庄重的现代汉语，并按项目惯例将圣名音译为“耶和华”。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 采用普通中文读者最熟悉且庄重的传统形式；不将神名泛化为称号“主”，同时承认“雅威”更接近学界常见的拟音。
- issue: טוּבִי 所指的范围
  choice: 我的美善
  alternative: 我的福惠／我所赐的美物
  rationale: 原词既可表达上帝的美善，也可指其所赐的福分或美物；正文保留这种神学与物质层面的张力，不把应许缩限为食物或财富。
translation_notes:
  register: 采用现代、庄重而易懂的普通话书面语。两分句保持希伯来诗句的平行结构；以“饱享／满足”体现重复而不机械复词。所有脚注标记均已置于正文对应位置。
