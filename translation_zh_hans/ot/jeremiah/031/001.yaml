  text: בָּ/עֵ֤ת הַ/הִיא֙ נְאֻם יְהוָ֔ה אֶֽהְיֶה֙ לֵֽ/אלֹהִ֔ים לְ/כֹ֖ל מִשְׁפְּח֣וֹת יִשְׂרָאֵ֑ל וְ/הֵ֖מָּה יִֽהְיוּ לִ֥/י לְ/עָֽם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/001.yaml
  text: At that time[a], declares Yahweh, I will be God to all the families of Israel, and they will be my people.
translation:
  language: zh_hans
  text: “那时，耶和华宣告说：‘我要作以色列各宗族[a]的上帝；他们要作我的子民。’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “宗族”也可译为“家族”。希伯来语此词可指以色列内部由亲属关系组成的扩大家族或氏族群体。
    reason: 保留 מִשְׁפְּחוֹת 的词义替代，并与英文审校轨迹的脚注焦点一致。
lexical_decisions:
- source_word: בָּעֵת הַהִיא
  choice: 到那时
  rationale: 自然、凝练地表达先知所指向的未来时段；希伯来语既可指某一时刻，也可指一段时期。
- source_word: נְאֻם יְהוָה
  choice: 耶和华宣告说
  rationale: 保留先知话语中正式的宣告公式，并以现代汉语通顺表达；将神名 יְהוָה 音译为传统且通行的“耶和华”。
- source_word: אֶהְיֶה לֵאלֹהִים
  choice: 我要作……的上帝
  rationale: 按汉语习惯表达盟约关系中的神圣承诺，比逐字译作“我要成为上帝给……”更自然。
- source_word: לְכֹל מִשְׁפְּחוֹת יִשְׂרָאֵל
  choice: 以色列各宗族
  rationale: מִשְׁפָּחוֹת 指以色列内部由亲属关系构成的扩大家族或氏族单位；“各宗族”在此比“所有家庭”更准确，也保留群体结构意味。
- source_word: וְהֵמָּה יִהְיוּ לִי לְעָם
  choice: 他们要作我的子民
  rationale: 采用自然庄重的汉语再现互属的盟约公式，并保留复数主语与集合名词“子民”之间的张力。
theological_decisions:
- issue: 盟约公式的表达
  choice: 我要作以色列各宗族的上帝，他们要作我的子民
  alternative: 我要给以色列所有宗族作上帝，他们也要给我作子民
  rationale: 所选译法忠实保留神与以色列彼此归属的盟约结构，同时符合现代汉语表达；不额外说明这一应许实现的方式或范围。
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威；主
  rationale: “耶和华”是简体中文圣经语境中最通行且可识别的专名形式，能保留原文使用神之专名而非普通称号这一特点。
translation_notes:
  register: 采用现代、庄重、易懂的标准普通话。引语格式清楚呈现耶和华的直接宣告；“作……的上帝／作我的子民”保留传统盟约措辞而不过度古雅。
