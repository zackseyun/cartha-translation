  text: וַֽ/יהוָ֥ה הֽוֹדִיעַ֖/נִי וָֽ/אֵדָ֑עָ/ה אָ֖ז הִרְאִיתַ֥/נִי מַעַלְלֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/011/018.yaml
  text: And Yahweh made it known to me[a], and I knew; then you showed me their deeds.
translation:
  language: zh_hans
  text: 雅威使我得知，我便明白了；随后，你让我看见[a]他们的所作所为。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文在这里从第三人称“雅威”转为第二人称“你让我看见”，很可能表示先知转而直接对雅威说话；有些译本将人称统一，译作“他让我看见”。
    reason: 说明原文的人称转换及另一种译法。
lexical_decisions:
- source_word: וַיהוָה
  choice: 雅威
  rationale: 以“雅威”音译上帝的立约之名，并在句中保留希伯来文直接使用神名的特点；句首连接词按现代汉语行文不另译。
- source_word: הוֹדִיעַנִי
  choice: 使我知道
  rationale: 保留ידע使役式“使某人知道”的含义；原文未明说所知道的宾语，中文也不擅自补明。
- source_word: וָאֵדָעָה
  choice: 我便知道了
  rationale: 既表达叙事上的承接与结果，也保留第一人称“知道”的陈述；“便”使现代汉语自然，但不把因果关系说得过强。
- source_word: אָז
  choice: 那时
  rationale: 准确表达时间副词“那时、然后”；此处用“那时”较自然，并避免把动作次序解释得过细。
- source_word: הִרְאִיתַנִי
  choice: 你让我看见
  rationale: 保留ראה使役式的意义及第二人称单数形式，使原文从第三人称提及雅威转为直接向他讲话的变化清楚可见。
- source_word: מַעַלְלֵיהֶם
  choice: 他们的所作所为
  rationale: מַעֲלָל指行为、作为，语境中常含道德色彩；“所作所为”自然庄重，同时不擅自加上“恶”等评价词。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名；采用“雅威”可将其作为专名呈现，不以称号“主”替代。
- issue: 从第三人称提及上帝转为第二人称称呼上帝
  choice: 保留“雅威……你让我看见”的人称转换
  alternative: 统一为第三人称：“雅威……他让我看见”
  rationale: 马所拉文本明确由神名作第三人称主语转为第二人称单数动词。保留这种转换，可呈现耶利米转而直接向雅威说话的修辞张力，不作平滑处理。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“使我知道”略带正式色彩，以贴近原文使役结构；“所作所为”符合先知文学语域。脚注标记置于整节末尾，所注内容涉及本节后半句的人称变化。
