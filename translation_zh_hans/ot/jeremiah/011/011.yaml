source:
  edition: WLC
  text: לָ/כֵ֗ן כֹּ֚ה אָמַ֣ר יְהוָ֔ה הִנְ/נִ֨י מֵבִ֤יא אֲלֵי/הֶם֙ רָעָ֔ה אֲשֶׁ֥ר לֹֽא יוּכְל֖וּ לָ/צֵ֣את מִמֶּ֑/נָּה וְ/זָעֲק֣וּ אֵלַ֔/י וְ/לֹ֥א אֶשְׁמַ֖ע אֲלֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/011/011.yaml
  text: 'Therefore thus says Yahweh: Behold[a], I am bringing on them a disaster from which they will not be able to escape; and they will cry out to me, but I will not listen to them.'
translation:
  language: zh_hans
  text: 所以，耶和华如此说：“看哪，我必使灾祸[a]临到他们；他们无法从这灾祸中逃脱。他们必向我呼求，我却不听他们。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“灾难”或“祸患”。原文 רָעָה 在这里指带来毁灭的审判，并非道德意义上的“恶”。
    reason: 说明审判语境中多义词 רָעָה 的含义，并列出可行译法。
lexical_decisions:
- source_word: לָכֵן
  choice: 所以
  rationale: 承接上文的控诉，表明以下审判是由此而来的结果；“所以”在现代汉语中自然清楚。
- source_word: כֹּה אָמַר יְהוָה
  choice: 耶和华如此说
  rationale: 保留先知宣告常用的使者公式及其庄重语气；“耶和华”作为专名指向原文的四字神名。
- source_word: הִנְנִי מֵבִיא
  choice: 看哪，我必使……临到
  rationale: הִנְנִי 加分词表达郑重、迫近且确定的行动；“看哪”保留宣告的强调，“必使……临到”则以自然汉语传达其确定性。
- source_word: רָעָה
  choice: 灾祸
  rationale: 此处指因审判而临到的毁灭性祸患，不是道德意义上的邪恶；“灾祸”兼具准确性和庄重感。
- source_word: אֲשֶׁר לֹא יוּכְלוּ לָצֵאת מִמֶּנָּה
  choice: 他们无法逃脱
  rationale: 原文直义为“他们不能从其中出来”，在此语境中指无法摆脱将临的灾祸；“无法逃脱”是自然且准确的现代汉语。
- source_word: וְזָעֲקוּ אֵלַי
  choice: 他们必向我呼求
  rationale: זעק 表示人在危难中迫切求助；“呼求”比一般的“呼叫”更能体现求救意味。
- source_word: וְלֹא אֶשְׁמַע אֲלֵיהֶם
  choice: 我却不听他们
  rationale: שׁמע 在这里不只是听见声音，也包含听取并回应；“却”自然呈现他们呼求与上帝拒绝垂听之间的转折。
theological_decisions:
- issue: 审判用语 רָעָה 的译法
  choice: 灾祸
  alternative: 祸患；灾难；恶
  rationale: 上下文所说的是圣约审判所带来的毁灭性灾害。译作“灾祸”既保留审判的严厉，也避免让人误解为上帝带来道德上的邪恶。
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威；上主
  rationale: 原文使用以色列上帝的专名，而非一般称号；采用现代中文读者最熟悉的专名形式“耶和华”，不以称号取代神名。
- issue: 上帝“不听”百姓呼求的含义
  choice: 我却不听他们
  alternative: 我却不应允他们
  rationale: 保留 שׁמע 的听取含义及审判语境中的拒绝回应，同时不把原文进一步明确化为只指“不应允”，从而保留其语义张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。保留先知宣告公式“耶和华如此说”和强调词“看哪”，同时避免过度古雅；句子结构清晰，适合普通现代读者朗读和理解。
