id: JER.11.9
reference: Jeremiah 11:9
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר יְהוָ֖ה אֵלָ֑/י נִֽמְצָא קֶ֨שֶׁר֙ בְּ/אִ֣ישׁ יְהוּדָ֔ה וּ/בְ/יֹשְׁבֵ֖י יְרוּשָׁלִָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/011/009.yaml
  text: And Yahweh said to me[b][a], “A conspiracy has been found among the men of Judah and among the inhabitants of Jerusalem.”
translation:
  language: zh_hans
  text: 雅威对我说：“在犹大人[b]和耶路撒冷居民中，发现了一个阴谋[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “阴谋”也可译作“密谋”或“叛逆的图谋”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译为“犹大之人”；“人”在这里是单数形式，却具有集合意义。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 对我说
  rationale: 该叙事性动词形式承接上文；现代汉语通常不必机械译出连接词，译为“对我说”自然且忠实。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来语四字神名的常见汉语音译处理，保留其专名性质，不以称号代替。
- source_word: נִמְצָא
  choice: 发现了
  rationale: 这是מצא的尼法勒完成式，表示某事已被发现或揭露；“发现了”在汉语中简明自然，并保留被动含义。
- source_word: קֶשֶׁר
  choice: 阴谋
  rationale: 该词在政治及先知语境中指密谋、叛逆性的图谋；“阴谋”既准确又为普通读者所熟悉。
- source_word: בְּאִישׁ יְהוּדָה
  choice: 在犹大人中
  rationale: אִישׁ虽为单数形式，在此具有集合意义；“犹大人”自然表达群体，又不将范围泛化为土地本身。
- source_word: וּבְיֹשְׁבֵי יְרוּשָׁלִָם
  choice: 和耶路撒冷居民中
  rationale: 分词יֹשְׁבֵי在此名词化，指住在耶路撒冷的人；“居民”准确而现代。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。译作“雅威”保留专名，并较贴近学界通常重构的读音；不以“主”这一称号替代。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“发现了一个阴谋”保留原文略显客观的发现表述，不进一步说明是谁发现或阴谋的具体性质。脚注标记分别紧随其所解释的词语。
