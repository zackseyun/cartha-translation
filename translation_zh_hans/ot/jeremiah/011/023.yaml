source:
  edition: WLC
  text: וּ/שְׁאֵרִ֕ית לֹ֥א תִֽהְיֶ֖ה לָ/הֶ֑ם כִּֽי אָבִ֥יא רָעָ֛ה אֶל אַנְשֵׁ֥י עֲנָת֖וֹת שְׁנַ֥ת פְּקֻדָּתָֽ/ם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/011/023.yaml
  text: And no remnant will remain for them[a], for I will bring disaster on the men of Anathoth in the year of their punishment.
translation:
  language: zh_hans
  text: 他们必没有余民留下；因为我必在他们受惩罚之年，使灾祸临到亚拿突的男子。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “他们受惩罚之年”或译“他们受察访之年”。原文用词可泛指察访或眷顾，但在此审判语境中指惩罚性的察访。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁאֵרִית לֹא תִהְיֶה לָהֶם
  choice: 他们必无一人存留
  rationale: שְׁאֵרִית 指剩余者或余民；结合否定存在句，译为“无一人存留”在现代汉语中自然清楚，并表达无人幸存的判断。
- source_word: כִּי
  choice: 因为
  rationale: 此处引出前一句审判结论的原因，“因为”准确呈现其因果功能。
- source_word: אָבִיא רָעָה
  choice: 我必使灾祸临到
  rationale: אָבִיא 是使役形式，意为“使……来到”；רָעָה 在审判语境中指灾祸而非道德上的邪恶。
- source_word: אַנְשֵׁי עֲנָתוֹת
  choice: 亚拿突人
  rationale: אַנְשֵׁי 字面为“……的男人/男子”，但汉语地名加“人”可自然指当地相关群体；上下文仍限定为谋害耶利米的人，并未刻意扩大范围。
- source_word: שְׁנַת פְּקֻדָּתָם
  choice: 到了惩罚他们的年头
  rationale: שְׁנַת 保留“年”的时间表达；פְּקֻדָּה 本可指察看、临到或惩罚，但在本节审判语境中具有惩罚意义。
theological_decisions:
- issue: 上帝带来的 רָעָה 的含义
  choice: 灾祸
  alternative: 邪恶；灾难
  rationale: 上下文描述上帝施行审判，所带来的是毁灭性的灾祸，并非说上帝施行道德上的邪恶。
- issue: פְּקֻדָּה 的审判含义
  choice: 惩罚
  alternative: 察访；临到
  rationale: 该词本身语义较宽，但本节明确处于审判宣告之中，因此正文采用“惩罚”，同时用脚注保留较中性的词义可能。
- issue: אַנְשֵׁי עֲנָתוֹת 的范围
  choice: 亚拿突人
  alternative: 亚拿突的男人
  rationale: 原文为阳性复数，近距离上下文指当地谋害耶利米的人；中文“亚拿突人”较自然，不额外断言全城每一名居民都包含在内。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“必”“临到”“年头”保留先知审判宣告的郑重语气；脚注标记置于全节末尾，但明确对应“惩罚他们的年头”。
