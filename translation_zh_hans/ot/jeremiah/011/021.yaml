source:
  edition: WLC
  text: לָ/כֵ֗ן כֹּֽה אָמַ֤ר יְהוָה֙ עַל אַנְשֵׁ֣י עֲנָת֔וֹת הַֽ/מְבַקְשִׁ֥ים אֶֽת נַפְשְׁ/ךָ֖ לֵ/אמֹ֑ר לֹ֤א תִנָּבֵא֙ בְּ/שֵׁ֣ם יְהוָ֔ה וְ/לֹ֥א תָמ֖וּת בְּ/יָדֵֽ/נוּ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/011/021.yaml
  text: Therefore[a], this is what Yahweh says concerning the men of Anathoth who are seeking your life, saying, “Do not prophesy in the name of Yahweh[c][b], lest you die by our hand.”
translation:
  language: zh_hans
  text: 所以，雅威这样说，论到那些企图取你性命的亚拿突人：“不可奉雅威的名说预言，否则你会死在我们手里。”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文形式上作“你不会死在我们手里”，但置于“不可……说预言”的禁令之后，在上下文中构成威胁：若仍说预言，就会死在他们手里。也可按其威胁语气译作“免得你死在我们手里”。
    reason: 说明וְלֹא תָמוּת的表层否定式及其在语境中的威胁性用法，避免将形式直译误解为不杀害的保证。
lexical_decisions:
- source_word: לָכֵן
  choice: 所以
  rationale: 表示本节承接上文所得出的结论；“所以”在现代汉语中自然、清楚。
- source_word: כֹּה אָמַר יְהוָה
  choice: 雅威……这样说
  rationale: 保留先知宣告所用的使者公式，同时按自然汉语调整语序。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以常见的现代汉语音译呈现四字神名，不以称号代替专名。
- source_word: עַל אַנְשֵׁי עֲנָתוֹת
  choice: 论到……亚拿突人
  rationale: עַל在此引出神谕所针对的对象；“论到”不把其语义过度限定为“攻击”。אַנְשֵׁי是阳性复数，但现代汉语“亚拿突人”已能自然指称这群当地人。
- source_word: הַמְבַקְשִׁים אֶת נַפְשְׁךָ
  choice: 那些企图取你性命的
  rationale: 这是表示意图杀人的希伯来语惯用语；译出实际含义，比直译“寻索你的性命”更符合现代汉语。
- source_word: לֹא תִנָּבֵא בְּשֵׁם יְהוָה
  choice: 不可奉雅威的名说预言
  rationale: 未完成式在直接引语中表达禁令；“奉……的名”传达凭其权柄说话的含义。
- source_word: וְלֹא תָמוּת בְּיָדֵנוּ
  choice: 否则你会死在我们手里
  rationale: 结合禁令语境，这句话是死亡威胁；“否则”在汉语中清楚表达其实际语用功能。脚注保留希伯来语表层否定式的另一种理解。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名；音译为“雅威”既保留专名性质，也避免以称号代替原文。
- issue: וְלֹא תָמוּת所表达的威胁方式
  choice: 否则你会死在我们手里
  alternative: 这样你就不会死在我们手里；免得你死在我们手里
  rationale: 原文形式上是否定句，但在禁止耶利米说预言的语境中构成明确威胁。正文译出语用意义，脚注说明其形式，从而不掩盖原文的表达张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“取你性命”清楚传达希伯来语惯用语；引语中的“不可”“奉……的名”保持先知文本的正式语体，又不显陈旧。
