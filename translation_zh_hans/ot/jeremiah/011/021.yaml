- from: 所以，雅威论到那些企图取你性命的亚拿突人这样说：“不可奉雅威的名说预言，否则你会死在我们手里。”[a]
  to: 所以，雅威这样说，论到那些企图取你性命的亚拿突人：“不可奉雅威的名说预言，否则你会死在我们手里。”[a]
  rationale: 修订神谕公式的语序，以提高现代汉语的自然度和修辞清晰度；并重写脚注，使之既如实提示原文否定形式，又准确说明该句在上下文中作为威胁的功能。其余译文忠实、自然，无须改动。
