language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כִּ֚י מִסְפַּ֣ר עָרֶ֔י/ךָ הָי֥וּ אֱלֹהֶ֖י/ךָ יְהוּדָ֑ה וּ/מִסְפַּ֞ר חֻצ֣וֹת יְרוּשָׁלִַ֗ם שַׂמְתֶּ֤ם מִזְבְּחוֹת֙ לַ/בֹּ֔שֶׁת מִזְבְּח֖וֹת לְ/קַטֵּ֥ר לַ/בָּֽעַל׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/011/013.yaml
  text: For your gods[a], O Judah, have become as numerous as your cities; and as numerous as the streets of Jerusalem, you have set up altars to Shame[b], altars to make offerings to Baal.
translation:
  language: zh_hans
  text: 因为犹大啊，你的神明和你的城邑一样多；你们为“羞耻”[a]设立的祭坛，也和耶路撒冷的街道一样多，就是向巴力烧香[b]的祭坛。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “羞耻”是带有蔑视意味的替代称呼，很可能指巴力。
    reason: lexical_alternative
  - marker: b
    text: “烧香”所译的希伯来语也可指焚烧祭物，使烟上腾。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，说明耶和华为何不应允百姓在患难中的呼求，保留原文的因果、解释作用。
- source_word: מִסְפַּר ... מִסְפַּר
  choice: 和……一样多
  rationale: 自然表达原文“数目与……相应”的两重比较，并保留城邑、街道与神明、祭坛之间的对应。
- source_word: עָרֶיךָ
  choice: 你的城邑
  rationale: 保留对犹大这一集体实体的第二人称单数称呼；“城邑”庄重而易懂，也兼顾城市和城镇。
- source_word: הָיוּ אֱלֹהֶיךָ יְהוּדָה
  choice: 犹大啊，你的神明……一样多
  rationale: 将“犹大”处理为呼语；“神明”清楚表明这里指犹大所敬奉的众多假神，而非独一的上帝。
- source_word: חֻצוֹת
  choice: 街道
  rationale: 在城市语境中指街道或公共通道；“街道”是最自然、普遍的现代汉语表达。
- source_word: שַׂמְתֶּם מִזְבְּחוֹת
  choice: 你们……设立的祭坛
  rationale: שׂים与“祭坛”连用表示安置、设立；同时用复数意义的“你们”反映原文由对犹大的单数称呼转向对其居民的复数称呼。
- source_word: לַבֹּשֶׁת
  choice: 给“羞耻”
  rationale: 直译בֹּשֶׁת的“羞耻”之义，并用引号体现其近似称号的讽刺用法，不在正文中直接把它消解为“巴力”。
- source_word: לְקַטֵּר
  choice: 烧香
  rationale: 该动词表示使祭物或香料冒烟，在先知书的偶像崇拜语境中常指烧香；脚注保留较宽的“焚烧祭物献祭”可能。
- source_word: לַבָּעַל
  choice: 向巴力
  rationale: 采用该迦南神祇名称的通行汉译；“向”表达敬拜行为所指向的对象。
theological_decisions:
- issue: 原文从对犹大的第二人称单数称呼转为第二人称复数动词
  choice: 先用“犹大啊，你的……”，后用“你们……”，保留数的转换
  alternative: 全文统一用单数“你”或复数“你们”
  rationale: 原文先把犹大人格化为一个整体，继而直接指责其中的百姓；保留转换可呈现先知话语的集体性张力。
- issue: לַבֹּשֶׁת所指为何
  choice: 正文译作“羞耻”，脚注说明很可能是对巴力的贬称
  alternative: 正文直接译作“巴力”或“可耻的偶像”
  rationale: 原文刻意使用意为“羞耻”的讽刺性替代称呼。直译能保留先知的修辞力度，同时不把可能的指涉当成词面本身。
- issue: לְקַטֵּר的祭祀动作
  choice: 正文译作“烧香”，脚注保留焚烧祭物使烟上腾的较宽含义
  alternative: 译作“献祭”或“焚烧祭物”
  rationale: 该词常专指烧香，但本身着眼于产生祭祀烟气；正文采用本语境中最常见的理解，脚注避免过度限定。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。“犹大啊”保留直接呼告；引号标示“羞耻”的讽刺性称号用法；分号呈现原文两组数量比较的平行结构。
