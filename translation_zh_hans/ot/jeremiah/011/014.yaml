  text: וְ/אַתָּ֗ה אַל תִּתְפַּלֵּל֙ בְּעַד הָ/עָ֣ם הַ/זֶּ֔ה וְ/אַל תִּשָּׂ֥א בַעֲדָ֖/ם רִנָּ֣ה וּ/תְפִלָּ֑ה כִּ֣י אֵינֶ֣/נִּי שֹׁמֵ֗עַ בְּ/עֵ֛ת קָרְאָ֥/ם אֵלַ֖/י בְּעַ֥ד רָעָתָֽ/ם־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/011/014.yaml
  text: But as for you[a], do not pray for this people, and do not lift up a cry or prayer on their behalf, for I am not listening at the time when they call to me because of their disaster.
translation:
  language: zh_hans
  text: 至于你，不要为这百姓祷告，也不要替他们扬声呼求或祈祷；因为在他们因灾祸[a]向我呼求的时候，我不垂听。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “灾祸”所译的希伯来语也可指“恶”；这里按上下文理解为临到他们的灾祸。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתָּה
  choice: 至于你
  rationale: 连词加独立人称代词构成强调性的转折称呼，突出耶和华转而直接吩咐耶利米。
- source_word: אַל תִּתְפַּלֵּל
  choice: 不要……祷告
  rationale: 否定词与未完成式构成禁令；“祷告”保留动词的一般意义，不将其窄化为“代求”。
- source_word: בְּעַד הָעָם הַזֶּה
  choice: 为这百姓
  rationale: בְּעַד 表示为了某人或代表某人，此处自然表达代求关系。
- source_word: וְאַל תִּשָּׂא בַעֲדָם רִנָּה וּתְפִלָּה
  choice: 也不要替他们扬声呼求或祈祷
  rationale: “扬声”保留 נָשָׂא 的举起意象，同时符合现代汉语习惯；רִנָּה 在此指迫切的呼声，而“或”自然表达否定句中并列的两类祈求。
- source_word: כִּי אֵינֶנִּי שֹׁמֵעַ
  choice: 因为……我不会垂听
  rationale: 否定词与分词表达耶和华拒绝听取、回应；“垂听”在庄重而通俗的经文语体中能体现这里并非听觉能力问题。
- source_word: בְּעֵת קָרְאָם אֵלַי
  choice: 他们……向我呼求时
  rationale: בְּעֵת 明确表示时间，“……时”在现代汉语中自然且完整地传达“在他们呼求的时候”。
- source_word: בְּעַד רָעָתָם
  choice: 因自己的灾祸
  rationale: רָעָה 可指道德上的恶，也可指灾祸；此处百姓在患难中呼求，语境较支持“灾祸”。“因”表达 בְּעַד 在这里的缘由意义。
theological_decisions:
- issue: 末句 רָעָתָם 的含义
  choice: 自己的灾祸
  alternative: 自己的恶行／罪恶
  rationale: 上下文描写百姓遭灾时向耶和华呼求，因此这里更可能指促使他们呼求的灾祸，而不是呼求的道德内容；脚注保留该词可指“恶”的词义张力。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“至于你”体现强调转折；“扬声呼求或祈祷”兼顾希伯来语意象与汉语自然表达；分号呈现禁令与理由之间的结构。
