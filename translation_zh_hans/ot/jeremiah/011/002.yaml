  text: שִׁמְע֕וּ אֶת דִּבְרֵ֖י הַ/בְּרִ֣ית הַ/זֹּ֑את וְ/דִבַּרְתָּ/ם֙ אֶל אִ֣ישׁ יְהוּדָ֔ה וְ/עַל יֹשְׁבֵ֖י יְרוּשָׁלִָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/011/002.yaml
  text: Hear the words of this covenant[a], and speak them to the men of Judah and to the inhabitants of Jerusalem.
translation:
  language: zh_hans
  text: “你们要听这约所说的话；你要把这些话告诉犹大人[a]和耶路撒冷的居民。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译可作“犹大每一个人”；这里的单数“人”具有集合或逐一分配的用法。
    reason: 说明אִישׁ יְהוּדָה的原文单数形式及集合／逐一含义。
lexical_decisions:
- source_word: שִׁמְעוּ
  choice: 你们要听
  rationale: 这是复数命令式。译作“你们要听”既保留命令语气，也容纳专心聆听乃至顺从的盟约语境，不在正文中直接收窄为“遵守”。
- source_word: דִּבְרֵי הַבְּרִית הַזֹּאת
  choice: 这约的话
  rationale: דִּבְרֵי直译为“话”，בְּרִית在此为圣经中的“约”；“这约的话”简洁地保留原文结构和指示词。
- source_word: וְדִבַּרְתָּם
  choice: 并把这些话告诉
  rationale: 这是第二人称阳性单数形式，带第三人称阳性复数后缀，后缀回指“话”。中文用“把这些话告诉”自然表达向指定对象传达这些话的命令。
- source_word: אִישׁ יְהוּדָה
  choice: 犹大人
  rationale: אִישׁ为单数，却在这里具有集合或逐一分配的用法。“犹大人”是自然的现代中文集体表达；脚注保留“犹大每一个人”这一较贴近形式的可能表达。
- source_word: וְעַל
  choice: 和
  rationale: עַל可表示“向、对、关于、攻击”等；这里与前面的אֶל平行，并受“告诉”统摄，指第二组受话者。中文不必重复介词，用“和”连接两个对象最自然。
- source_word: יֹשְׁבֵי יְרוּשָׁלִָם
  choice: 耶路撒冷的居民
  rationale: 分词实词化，指住在耶路撒冷的人；“居民”准确、简洁且符合现代中文。
theological_decisions:
- issue: אִישׁ יְהוּדָה的性别与集合／逐一含义
  choice: 犹大人
  alternative: 犹大每一个人；犹大的男子
  rationale: 原文阳性单数אִישׁ在这里可作集合或逐一分配表达。正文采用自然的中文集合称谓“犹大人”，不武断限定为仅指成年男性；脚注说明其字面形式，以保留原文特点。
- issue: “听”是否应直接译成“听从”或“遵守”
  choice: 听
  alternative: 听从；遵守
  rationale: שׁמע在盟约语境中可能含有顺从意味，但本节本身使用的是“听”。保留“听”可维持词义范围及其神学张力，避免在正文中过度解释。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“你们要听”保留复数命令；后半句虽然希伯来语动词为第二人称阳性单数，中文不显明单复数，因而不额外补出可能未明说的受命者。正文中的脚注标记[a]与脚注对应。
