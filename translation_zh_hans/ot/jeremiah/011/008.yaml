id: JER.11.8
reference: Jeremiah 11:8
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/לֹ֤א שָֽׁמְעוּ֙ וְ/לֹֽא הִטּ֣וּ אֶת אָזְנָ֔/ם וַ/יֵּ֣לְכ֔וּ אִ֕ישׁ בִּ/שְׁרִיר֖וּת לִבָּ֣/ם הָ/רָ֑ע וָ/אָבִ֨יא עֲלֵי/הֶ֜ם אֶֽת כָּל דִּבְרֵ֧י הַ/בְּרִית הַ/זֹּ֛את אֲשֶׁר צִוִּ֥יתִי לַ/עֲשׂ֖וֹת וְ/לֹ֥א עָשֽׂוּ־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/011/008.yaml
  text: Yet they did not listen or incline their ear[a], but each one walked in the stubbornness of his evil heart; so I brought upon them all the words of this covenant, which I commanded them to do[b], but they did not do them.
translation:
  language: zh_hans
  text: 然而，他们不听，也不侧耳倾听[a]，反而各人都照自己邪恶之心的顽梗行事。因此，我使这约的一切话都临到他们；这些话是我吩咐他们要实行的[b]，他们却没有实行。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “不听”也可理解为“不听从”；在这里，这个词含有拒绝顺服的意味。
    reason: lexical_alternative
  - marker: b
    text: “这约的一切话”可能也包括约中所警告的刑罚，而不只是其中的命令。
    reason: alternative_reading
lexical_decisions:
- source_word: שָׁמְעוּ
  choice: 不听
  rationale: שׁמע可表示听见、听从或顺服；此处与“侧耳”并列，译作“不听”既保留听觉意象，也含拒绝响应之意。
- source_word: הִטּוּ אֶת אָזְנָם
  choice: 侧耳倾听
  rationale: 保留希伯来语“倾斜耳朵”的意象，同时以现代汉语自然表达专心听取。
- source_word: וַיֵּלְכוּ אִישׁ
  choice: 各人都……行事
  rationale: אִישׁ在此作分配用法，指群体中的每一个人；“行事”自然传达“行走”作为生活行为的比喻。
- source_word: בִּשְׁרִירוּת לִבָּם הָרָע
  choice: 照自己邪恶之心的顽梗
  rationale: שׁרירות表示固执、任性或顽梗；“照……行事”准确表达介词结构，并保留“心”在希伯来语中作为意志与内在倾向中心的含义。
- source_word: וָאָבִיא עֲלֵיהֶם
  choice: 因此，我使……临到他们
  rationale: 该表达表示使某事落到某人身上；“临到”适合下文可能包含约之审判的语境，“因此”显明前后结果关系。
- source_word: כָּל דִּבְרֵי הַבְּרִית הַזֹּאת
  choice: 这约的一切话
  rationale: 直译דִּבְרֵי为“话”，不将其预先限定为条款或咒诅，从而保留原文涵盖命令与约中警告的宽度。
- source_word: אֲשֶׁר צִוִּיתִי לַעֲשׂוֹת
  choice: 这些话是我吩咐他们要实行的
  rationale: לַעֲשׂוֹת直指“去做”；补出语境所指的“他们”，并用“实行”自然表达遵行约中所命之事。
- source_word: וְלֹא עָשׂוּ
  choice: 他们却没有实行
  rationale: 原文宾语承接前面的约之话而省略；中文可自然省去重复宾语，“却”凸显命令与不履行之间的反差。
theological_decisions:
- issue: “这约的一切话”是否专指约的咒诅
  choice: 保留“这约的一切话”，并让“临到他们”表达其施行后果
  alternative: 这约的一切咒诅／这约的一切条款
  rationale: 上下文很可能着重约中所警告的审判，但原文使用宽泛的“话”，不宜在正文中将含义缩窄为咒诅；脚注说明其可能涵盖约中警告的刑罚。
- issue: אִישׁ的性别与分配意义
  choice: 各人
  alternative: 各个男人／每一个人
  rationale: 此处אִישׁ是分配性的，指全体成员各自的行为，并非特指成年男性；“各人”准确、简洁。
- issue: שׁמע中听与顺服的关系
  choice: 不听
  alternative: 不听从／不顺服
  rationale: “不听”保留与“侧耳”的修辞呼应，又不排除盟约语境下拒绝顺服的含义；不在正文中把多义词只解释为顺服。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“侧耳倾听”保留原文意象；“照……顽梗行事”传达希伯来语以“行走”比喻生活行为的用法；标点将审判结果与后面的关系从句清楚区分。
