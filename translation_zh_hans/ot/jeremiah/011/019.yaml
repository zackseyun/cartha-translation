source:
  edition: WLC
  text: וַ/אֲנִ֕י כְּ/כֶ֥בֶשׂ אַלּ֖וּף יוּבַ֣ל לִ/טְב֑וֹחַ וְ/לֹֽא יָדַ֜עְתִּי כִּֽי עָלַ֣/י חָשְׁב֣וּ מַחֲשָׁב֗וֹת נַשְׁחִ֨יתָה עֵ֤ץ בְּ/לַחְמ/וֹ֙ וְ/נִכְרְתֶ֨/נּוּ֙ מֵ/אֶ֣רֶץ חַיִּ֔ים וּ/שְׁמ֖/וֹ לֹֽא יִזָּכֵ֥ר עֽוֹד־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/011/019.yaml
  text: 'But I was like a gentle lamb led to the slaughter[a], and I did not know that they had devised plans against me: ‘Let us destroy the tree with its food, and let us cut him off from the land of the living[b], so that his name will be remembered no more.’'
translation:
  language: zh_hans
  text: 但我像一只驯顺的羊羔，被牵去宰杀[a]；我并不知道他们图谋害我，说：“让我们把树连同它的食物一并毁掉[b]，把他从活人之地剪除，使他的名不再被人记念。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “驯顺”也可译作“温顺”“驯养的”或“与人熟识的”；这里的希伯来语形容词含义不确定。
    reason: lexical_alternative
  - marker: b
    text: 希伯来原文“树连同它的饼／食物”含义晦涩。许多人理解为要把树及其果实或出产全部毁掉。
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּכֶבֶשׂ אַלּוּף
  choice: 像一只驯顺的羊羔
  rationale: כֶּבֶשׂ指“羊羔”；אַלּוּף在此含义不确定，较可能描写被驯养、温顺而毫无戒心的牲畜。“驯顺”既自然，也保留其易受伤害的形象；其他可能译法收入脚注。
- source_word: יוּבַל לִטְבוֹחַ
  choice: 被牵去宰杀
  rationale: 保留被动语态和“被带往宰杀”的具体图景；“牵去”也符合羊羔的意象。
- source_word: וְלֹא יָדַעְתִּי
  choice: 我并不知道
  rationale: 直接表达第一人称的无知与毫无防备，不增添解释。
- source_word: חָשְׁבוּ מַחֲשָׁבוֹת
  choice: 他们竟图谋害我
  rationale: 希伯来文以同根动词和名词强调蓄意谋划；现代汉语用“图谋”自然传达敌对阴谋，“害我”由“针对我”和下文谋杀内容共同限定。
- source_word: נַשְׁחִיתָה
  choice: 让我们……毁掉
  rationale: 以劝愿式表达第一人称复数意愿，符合密谋者彼此鼓动的直接引语。
- source_word: עֵץ בְּלַחְמוֹ
  choice: 把树连同它的食物一并毁掉
  rationale: לֶחֶם通常指“饼、食物”；原句十分晦涩。正文尽量保留“树”和“食物”这两个词，并以“连同……一并”呈现常见理解，即树及其所有的一同被毁；疑难和其他理解见脚注。
- source_word: וְנִכְרְתֶנּוּ
  choice: 把他……剪除
  rationale: כרת的核心意象是“砍下、剪除”。阳性单数后缀结合后文“他的名”，表明目标是耶利米本人；“剪除”兼顾树木比喻和杀害人的含义。
- source_word: מֵאֶרֶץ חַיִּים
  choice: 从活人之地
  rationale: 这是指现世活人领域的希伯来语惯用表达；该译法简洁并保留原文意象。
- source_word: וּשְׁמוֹ לֹא יִזָּכֵר עוֹד
  choice: 使他的名不再被人记念
  rationale: זכר的被动式可指“被记得”或“被提起”；“被人记念”在此自然表达密谋者企图彻底抹去其生命和名声。
theological_decisions:
- issue: 密谋者暴力话语的解释层次
  choice: 按直接语境译为针对耶利米性命的谋杀计划，同时保留羊羔、树和剪除的意象。
  alternative: 在正文中将本节直接处理为关于基督受难的预言或寓意。
  rationale: 本节在直接语境中是耶利米陈述针对自己的阴谋。基督教读者可能看见预表性的呼应，但译文不应把后来的神学解读写入希伯来文本身。
- issue: עֵץ בְּלַחְמוֹ的晦涩比喻
  choice: 正文保留“树”和“食物”，并用脚注说明原文疑难。
  alternative: 明确译成“连树带果子”或采用其他释义，使所指完全确定。
  rationale: 原文的לֶחֶם通常是“饼、食物”，并非通常表示“果子”的词。保留异常措辞，可避免无依据地消除文本的真实歧义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“宰杀”“剪除”“活人之地”保留原文强烈而具体的意象；脚注只解释真实的词义疑难，不引入宗派性释义。
