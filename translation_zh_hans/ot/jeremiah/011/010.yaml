source:
  edition: WLC
  text: שָׁ֩בוּ֩ עַל עֲוֺנֹ֨ת אֲבוֹתָ֜/ם הָ/רִֽאשֹׁנִ֗ים אֲשֶׁ֤ר מֵֽאֲנוּ֙ לִ/שְׁמ֣וֹעַ אֶת דְּבָרַ֔/י וְ/הֵ֣מָּה הָלְכ֗וּ אַחֲרֵ֛י אֱלֹהִ֥ים אֲחֵרִ֖ים לְ/עָבְדָ֑/ם הֵפֵ֤רוּ בֵֽית יִשְׂרָאֵל֙ וּ/בֵ֣ית יְהוּדָ֔ה אֶת בְּרִיתִ֕/י אֲשֶׁ֥ר כָּרַ֖תִּי אֶת אֲבוֹתָֽ/ם־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/011/010.yaml
  text: They have returned to the iniquities of their first fathers[a], who refused to hear my words, and they themselves have gone after other gods to serve them[c][b]. The house of Israel and the house of Judah have broken my covenant that I made with their fathers.
translation:
  language: zh_hans
  text: 他们又回到他们早先的祖先的罪孽中[a]；那些祖先不肯听我的话[b]，而他们自己也去追随别的神，侍奉它们。以色列家和犹大家违背了我与他们祖先所立的约[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “早先的祖先”也可译作“从前的祖先”；希伯来文直译近似“最初的父辈”，指较早的世代。
    reason: lexical_alternative
  - marker: b
    text: “听我的话”在这里也含有“听从、顺服我的话”的意思。
    reason: lexical_alternative
  - marker: c
    text: “立约”的希伯来文惯用语字面意思是“切约”。
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁבוּ עַל עֲוֺנֹת
  choice: 又回到……的罪孽中
  rationale: שׁוב עַל 在这里表示重蹈先人的恶行；“又回到……中”自然表达恢复旧有罪恶模式的意思。עָוֹן 译作“罪孽”，保留其道德罪责的分量。
- source_word: אֲבוֹתָם הָרִאשֹׁנִים
  choice: 早先祖先
  rationale: 原文直译近似“最初／从前的父辈”，指较早世代的祖先。“早先祖先”既保留时间上的强调，也避免“最初的祖先”在现代汉语中可能引起的误解。
- source_word: מֵאֲנוּ לִשְׁמוֹעַ אֶת דְּבָרַי
  choice: 不肯听我的话
  rationale: מָאֵן 表示拒绝、不肯；שׁמע 在此既可指听见，也蕴含听从之意。“听我的话”保留这种语义张力。
- source_word: וְהֵמָּה
  choice: 他们自己也
  rationale: 独立人称代词带有强调作用；“自己”体现强调，“也”表明现今这一代同样重蹈祖先的覆辙。
- source_word: הָלְכוּ אַחֲרֵי אֱלֹהִים אֲחֵרִים
  choice: 去追随别的神
  rationale: הלך אחרי 是表示跟随、效忠的惯用语；“追随”保留跟随的意象及宗教归属意味。
- source_word: לְעָבְדָם
  choice: 侍奉它们
  rationale: עבד 用于神明时包括敬拜性的服事。“侍奉”较直接，并保留服事与敬拜两方面的含义。
- source_word: בֵּית יִשְׂרָאֵל וּבֵית יְהוּדָה
  choice: 以色列家和犹大家
  rationale: 保留原文两次出现的“家”，体现其群体及盟约语境，不简化为单纯国名。
- source_word: הֵפֵרוּ אֶת בְּרִיתִי
  choice: 违背了我的约
  rationale: הפר 在盟约语境可指破坏、违背或废弃。“违背”在现代汉语中自然，也清楚表达破坏盟约义务。
- source_word: אֲשֶׁר כָּרַתִּי אֶת אֲבוֹתָם
  choice: 我与他们祖先所立的
  rationale: כרת ברית 字面为“切约”，实为“立约”的固定表达；אֵת 在这里表示“与”。“与……所立的约”符合现代汉语习惯。
theological_decisions:
- issue: 现今世代与祖先之间的盟约连续性
  choice: 明确说现今百姓重蹈早先祖先的罪，并违背上帝与他们祖先所立的约。
  alternative: 仅把祖先之约作为历史背景，不体现它对现今世代的约束。
  rationale: 原文直接把当代人的悖逆、祖先的罪和与祖先所立的约连在一起。译文保留这种连续性，但不引入任何后来的神学体系。
- issue: “听”是否直接译成“顺服”
  choice: 译作“听我的话”，让听见、听从两层含义并存。
  alternative: 译作“顺服我的话”。
  rationale: שׁמע 在语境中确有听从之意，但原词仍以“听”为基本意象；不直接改译“顺服”可避免消除原文的语义张力。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“早先祖先”保留原文对早期世代的强调；“他们自己也”体现独立代词的强调作用；“以色列家和犹大家”保留盟约群体称谓。
