  to: 他们又回到他们早先的祖先的罪孽中[a]；那些祖先不肯听我的话[b]，而他们自己也去追随别的神，侍奉它们。以色列家和犹大家违背了我与他们祖先所立的约[c]。
  rationale: 仅作安全的表达性修订：将“早先祖先”改为更自然的“早先的祖先”，并加入“而”以明确“他们自己也”指当前一代而非刚提到的祖先。未改变原文的时序、强调、盟约含义或脚注锚点。
