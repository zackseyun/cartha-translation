base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/011/005.yaml
  text: so that I may establish the oath that I swore to your fathers[a], to give them a land flowing with milk and honey, as it is this day.” And I answered and said, “Amen[b], Yahweh.”
translation:
  language: zh_hans
  text: 为要我履行向你们列祖所起的誓，把流奶与蜜之地赐给他们，如同今日的情形一样。”我就回答说：“阿们，耶和华！”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְמַעַן
  choice: 好使
  rationale: 保留目的含义，并自然承接上文的命令。
- source_word: הָקִים אֶת הַשְּׁבוּעָה
  choice: 实现……所起的誓
  rationale: קום的使役式与“誓”连用，表示使所起之誓生效、得以履行；“实现”兼顾原文意象与现代汉语表达。
- source_word: לַאֲבוֹתֵיכֶם
  choice: 向你们列祖
  rationale: “列祖”准确保留复数阳性所指及圣约历史语境；脚注补充更宽泛的可能表达。
- source_word: אֶרֶץ זָבַת חָלָב וּדְבַשׁ
  choice: 流奶与蜜之地
  rationale: 保留希伯来文的丰饶意象和汉语圣经传统中清楚、凝练的表达。
- source_word: כַּיּוֹם הַזֶּה
  choice: 正如今日一样
  rationale: 指出所应许之地在说话当下已成为现实，并保留“这日”的指示意味。
- source_word: וָאַעַן וָאֹמַר
  choice: 我就回答说
  rationale: 以自然汉语保留“回答并说”的叙事公式，不机械重复近义动词。
- source_word: אָמֵן
  choice: 阿们
  rationale: 采用通行音译，保留先知对神话语的确认和赞同。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 使用现代简体中文圣经语境中最通行、最易识别的神名译法，并直接呈现其专名性质。
theological_decisions:
- issue: הָקִים与誓言的关系
  choice: 实现……所起的誓
  alternative: 坚立……誓言／履行……誓言
  rationale: 原词可以表达使誓言成立、生效或得到履行；“实现”不把含义收窄为单纯确认，也清楚表达神使所应许之事成为现实。
- issue: לַאֲבוֹתֵיכֶם的所指
  choice: 你们列祖
  alternative: 你们的祖先
  rationale: “列祖”保留原文的阳性复数及其圣约历史色彩，同时脚注承认泛指祖先的译法。
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 两者都是对四字神名的处理；正文采用普通现代中文读者最熟悉的专名形式，不以“主”替代原文神名。
- issue: 末句是否为直接称呼
  choice: “阿们，耶和华！”
  alternative: “耶和华啊，阿们！”／“阿们。”
  rationale: 希伯来文将“阿们”与神名并列，最自然可理解为向耶和华作出的直接回应；不增添原文没有的称呼助词“啊”，同时保留紧凑表达。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“列祖”“流奶与蜜之地”“阿们”保留必要的圣经语域；其余句法尽量清晰流畅。
