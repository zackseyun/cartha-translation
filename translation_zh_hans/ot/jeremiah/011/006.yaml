source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֵלַ֔/י קְרָ֨א אֶת כָּל הַ/דְּבָרִ֤ים הָ/אֵ֨לֶּה֙ בְּ/עָרֵ֣י יְהוּדָ֔ה וּ/בְ/חֻצ֥וֹת יְרוּשָׁלִַ֖ם לֵ/אמֹ֑ר שִׁמְע֗וּ אֶת דִּבְרֵי֙ הַ/בְּרִ֣ית הַ/זֹּ֔את וַ/עֲשִׂיתֶ֖ם אוֹתָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/011/006.yaml
  text: 'And Yahweh said to me[a], “Proclaim all these words in the cities of Judah and in the streets of Jerusalem[b], saying: Hear the words of this covenant and do them.”'
translation:
  language: zh_hans
  text: 雅威对我说：“你要在犹大各城和耶路撒冷的街道[a]上宣告这一切话，说：‘你们要听[b]这约的话，并且照着去做。’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“广场”；希伯来语所指的是城中的户外公共场所。
    reason: lexical_alternative
  - marker: b
    text: “听”也可译作“聆听”。有些译本按语境译为“听从”，但下一分句已经明确要求“照着去做”。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: 雅威
  rationale: 采用神圣四字名的音译，保留以色列之神的立约之名，不以称号代替。
- source_word: קְרָא
  choice: 宣告
  rationale: 此处命令耶利米公开传讲信息；“宣告”既体现公开发布的语气，也符合现代汉语表达。
- source_word: כָּל הַדְּבָרִים הָאֵלֶּה
  choice: 这一切话
  rationale: דברים在先知言说的语境中指所传的信息或话语；下文的直接引语也支持“话”而非泛指“事情”。
- source_word: בְּעָרֵי יְהוּדָה
  choice: 在犹大各城
  rationale: “各城”自然表达复数及地域范围，同时保留原文的地理指向。
- source_word: וּבְחֻצוֹת יְרוּשָׁלִַם
  choice: 和耶路撒冷的街道上
  rationale: חֻצוֹת指城中的户外公共场所；“街道”是自然的现代汉语译法，但“广场”也有词义依据。
- source_word: לֵאמֹר
  choice: 说
  rationale: 用来引出所宣告的具体内容，简洁保留原文结构。
- source_word: שִׁמְעוּ
  choice: 听
  rationale: 保留其基本义“听”；虽然该词有时含有听从之意，但下一分句另行明确要求付诸行动。
- source_word: דִּבְרֵי הַבְּרִית הַזֹּאת
  choice: 这约的话
  rationale: 保留“话”与前文的词汇呼应，也保留原文以话语表述立约内容的形式，避免解释性地译作“条款”。
- source_word: וַעֲשִׂיתֶם אוֹתָם
  choice: 并且照着去做
  rationale: 表达把约中的话付诸实行，同时以自然汉语呈现原文“做它们”的具体说法。
theological_decisions:
- issue: 如何翻译立约之名 יְהוָה
  choice: 雅威
  alternative: 耶和华
  rationale: “雅威”较直接地音译该神名，避免用“主”等称号取代专名；“耶和华”是汉语传统形式，但其语音来源较间接。
- issue: שִׁמְעוּ是译为“听”还是解释为“听从”
  choice: 听……并且照着去做
  alternative: 听从这约的话
  rationale: 原文分别表达听与实行。译作“听”可保留这两个动作之间的修辞和神学张力，不把后一个动作预先并入前一个动词。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“宣告”体现公开传讲的场景；引语层次清楚。脚注标记均放在相应词语之后，以保存“街道／广场”及“听／听从”的真实词义空间。
