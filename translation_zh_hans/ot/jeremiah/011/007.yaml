  text: כִּי֩ הָעֵ֨ד הַעִדֹ֜תִי בַּ/אֲבֽוֹתֵי/כֶ֗ם בְּ/יוֹם֩ הַעֲלוֹתִ֨/י אוֹתָ֜/ם מֵ/אֶ֤רֶץ מִצְרַ֨יִם֙ וְ/עַד הַ/יּ֣וֹם הַ/זֶּ֔ה הַשְׁכֵּ֥ם וְ/הָעֵ֖ד לֵ/אמֹ֑ר שִׁמְע֖וּ בְּ/קוֹלִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/011/007.yaml
  text: For I solemnly warned your fathers in the day I brought them up from the land of Egypt[a], and to this day, rising early and warning them, saying, ‘Listen to my voice.’
translation:
  language: zh_hans
  text: 因为自从我把你们的祖先从埃及地领上来的那一天起，直到今日，我总是及早起来郑重警告，说：“要听从我的话[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“要听我的声音”；这里的希伯来语表达在盟约语境中也有服从之意。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，为先前的命令或指控说明理由；现代汉语用“因为”自然清楚。
- source_word: הָעֵד הַעִדֹתִי
  choice: 郑重警告
  rationale: 不定式绝对式与同根限定动词连用，加强语气；在本段盟约语境中兼有严肃作证和劝诫警告之意，“郑重警告”最能兼顾力度与可读性。
- source_word: בַּאֲבוֹתֵיכֶם
  choice: 你们的祖先
  rationale: 所指是出埃及时代的前人；“祖先”在现代普通话中比直译“父辈”更准确自然，也不改变其盟约历史指向。
- source_word: בְּיוֹם הַעֲלוֹתִי אוֹתָם מֵאֶרֶץ מִצְרַיִם
  choice: 我把他们从埃及地领上来的那一天
  rationale: 保留“领上来”这一常见的出埃及表达，也保留原文“那一天”的时间措辞。
- source_word: וְעַד הַיּוֹם הַזֶּה
  choice: 直到今天
  rationale: 准确表达从出埃及直到先知当下持续不断的行动。
- source_word: הַשְׁכֵּם וְהָעֵד
  choice: 我仍不断警告他们
  rationale: השכם加动词是表示殷勤、反复行动的惯用语；若逐字译作“清早起来警告”在现代汉语中容易被误解为仅说明时刻，因此以“不断”传达其持续、迫切的语用意义。宾语“他们”由上下文补出。
- source_word: לֵאמֹר
  choice: 说
  rationale: 作为引语标记，简洁自然。
- source_word: שִׁמְעוּ בְּקוֹלִי
  choice: 要听从我的话
  rationale: 该结构既含听见、聆听之义，也常在盟约语境中指顺从；“听从我的话”在汉语里自然保留听与服从的双重意味。
theological_decisions:
- issue: שִׁמְעוּ בְּקוֹלִי 的盟约性含义
  choice: 要听从我的话
  alternative: 要听我的声音；要服从我的话
  rationale: 原文以“听”为基本意象，却在盟约语境中包含顺服要求。“听从”不把它缩减为单纯听见，也不完全舍弃听觉意象；脚注说明还可直译为“听我的声音”，以保留词义张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“郑重警告”体现原文加强结构；“仍不断警告”以自然汉语传达“早起而警告”这一希伯来惯用语的殷勤和反复意味。
