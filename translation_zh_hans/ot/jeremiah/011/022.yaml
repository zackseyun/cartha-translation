source:
  edition: WLC
  text: לָ/כֵ֗ן כֹּ֤ה אָמַר֙ יְהוָ֣ה צְבָא֔וֹת הִנְ/נִ֥י פֹקֵ֖ד עֲלֵי/הֶ֑ם הַ/בַּֽחוּרִים֙ יָמֻ֣תוּ בַ/חֶ֔רֶב בְּנֵי/הֶם֙ וּ/בְנ֣וֹתֵי/הֶ֔ם יָמֻ֖תוּ בָּ/רָעָֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/011/022.yaml
  text: 'Therefore thus says Yahweh of hosts: Behold[a], I am about to punish them. The young men will die by the sword; their sons and their daughters will die by famine.'
translation:
  language: zh_hans
  text: 因此，万军之雅威如此说：“看哪，我必惩罚他们[a]。年轻男子必死于刀剑；他们的儿子和女儿必死于饥荒。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“我要向他们施行审判”。希伯来文此处的动词常用于审判语境，指追究罪责并施行惩罚。
    reason: 说明פֹקֵד עֲלֵיהֶם在本节中的审判性含义，并保留“施行审判”这一可行译法。
lexical_decisions:
- source_word: לָכֵן
  choice: 因此
  rationale: 承接上文并引出结论，准确表达推论关系。
- source_word: כֹּה אָמַר
  choice: 如此说
  rationale: 保留先知宣告中惯用的使者公式和庄重语气，同时符合现代汉语。
- source_word: יְהוָה צְבָאוֹת
  choice: 万军之雅威
  rationale: “雅威”音译上帝的专名；“万军之”保留צְבָאוֹת所涵盖的军旅、众军之意，不局限为人间军队。
- source_word: הִנְנִי
  choice: 看哪，我要
  rationale: “看哪”保留强调和警示语气；“我要”结合后面的分词，表达即将采取行动。
- source_word: פֹקֵד עֲלֵיהֶם
  choice: 追讨他们
  rationale: 在审判语境中，该短语表示临到某人并追究其罪责；“追讨”既传达司法性的惩治，也保留原词比单纯“惩罚”更宽的语义。
- source_word: הַבַּחוּרִים
  choice: 年轻人
  rationale: 指年轻男子，可能特别包括适于作战的青年；此处用自然简洁的“年轻人”。
- source_word: יָמֻתוּ בַחֶרֶב
  choice: 必死于刀剑
  rationale: 保留原文常见的审判表达，并传达战争或袭击所造成的暴力死亡。
- source_word: בְּנֵיהֶם וּבְנוֹתֵיהֶם
  choice: 他们的儿子和女儿
  rationale: 原文分别明说男性和女性后代，因此不合并为泛称“儿女”或“孩子”。
- source_word: יָמֻתוּ בָּרָעָב
  choice: 必死于饥荒
  rationale: רָעָב指饥荒而非一般饥饿；句式也与前面的“死于刀剑”形成平行。
theological_decisions:
- issue: 上帝专名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；采用“雅威”作为现代汉语音译，以明确保留专名性质。
- issue: הִנְנִי פֹקֵד עֲלֵיהֶם所表达的审判行动
  choice: 看哪，我要追讨他们
  alternative: 看哪，我要惩罚他们
  rationale: 该表达指迫近的神圣追责与审判。“追讨”保留司法性而不把原词的语义过度缩窄；脚注说明更直白的译法。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“看哪”保留先知宣告的警示力度；全句使用“必”呈现确定的审判结果，并以“刀剑／饥荒”的平行结构贴近原文。
