base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/011/003.yaml
  text: 'And you shall say to them, ‘Thus says the LORD, the God of Israel: Cursed is the man who does not listen to the words of this covenant,’'
translation:
  language: zh_hans
  text: 你要对他们说：“耶和华——以色列的上帝——如此说：受咒诅的是那不听从这约之话的人。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאָמַרְתָּ אֲלֵיהֶם
  choice: 你要对他们说
  rationale: 未完成式在命令语境中表达指示；保留第二人称单数及复数受话对象。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代简体中文圣经读者熟悉的专名译法，区别于一般称号“主”。
- source_word: אָרוּר
  choice: 必受咒诅
  rationale: 表达盟约宣告中处于咒诅之下的判语；“必”体现宣告效力，但不额外说明施咒者。
- source_word: הָאִישׁ
  choice: 人
  rationale: 此处泛指任何违背者，现代汉语用“人”自然且不必限定为男性。
- source_word: לֹא יִשְׁמַע
  choice: 不听从
  rationale: שמע 可兼具听见与顺从之义；“听从”在中文中保留听取并遵行的语义联系，符合盟约语境。
- source_word: דִּבְרֵי הַבְּרִית הַזֹּאת
  choice: 这约之话
  rationale: 紧贴“这约的话语”这一属格结构，同时以简洁庄重的中文表达。
theological_decisions:
- issue: שמע 在盟约语境中是单指聆听还是包含顺服
  choice: 不听从
  alternative: 不听
  rationale: 该动词本身可涵盖听取与服从；中文“听从”不把两者割裂，也比单纯“不听”更能传达盟约要求，同时未扩写为“遵守”。
- issue: אָרוּר 的宣告力度
  choice: 必受咒诅
  alternative: 是可咒诅的／受咒诅的是
  rationale: 译作明确的盟约判语，不解释咒诅具体如何实施，也不加入经文未明说的神学机制。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。句式保留先知传话公式与盟约宣告的力度；“这约之话”略带经文体色彩，但仍可为普通读者理解。
