  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: אֲשֶׁ֣ר צִוִּ֣יתִי אֶת אֲבֽוֹתֵי/כֶ֡ם בְּ/י֣וֹם הוֹצִיאִֽ/י אוֹתָ֣/ם מֵ/אֶֽרֶץ מִצְרַיִם֩ מִ/כּ֨וּר הַ/בַּרְזֶ֜ל לֵ/אמֹ֗ר שִׁמְע֤וּ בְ/קוֹלִ/י֙ וַ/עֲשִׂיתֶ֣ם אוֹתָ֔/ם כְּ/כֹ֥ל אֲשֶׁר אֲצַוֶּ֖ה אֶתְ/כֶ֑ם וִ/הְיִ֤יתֶם לִ/י֙ לְ/עָ֔ם וְ/אָ֣נֹכִ֔י אֶהְיֶ֥ה לָ/כֶ֖ם לֵ/אלֹהִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/011/004.yaml
  text: which I commanded your fathers on the day I brought them out from the land of Egypt[a], from the iron furnace, saying, ‘Listen to my voice and do them, according to all that I command you; and you shall be my people[c][b], and I will be your God,’
translation:
  language: zh_hans
  text: 就是我在把他们从埃及地、从铁炉中领出来的那日所吩咐你们列祖的，说：‘你们要听我的声音，并要照着我所吩咐你们的一切去遵行；你们就必作我的子民，我也必作你们的上帝。’
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲשֶׁר צִוִּיתִי
  choice: 就是……吩咐他们的
  rationale: 承接上一节的“约”，以汉语关系结构保留指代关系，并体现命令的权威性。
- source_word: אֲבוֹתֵיכֶם
  choice: 你们的列祖
  rationale: 希伯来语字面为“你们的父辈”；“列祖”既保留男性复数形式和以色列先辈的语境，也符合庄重而通行的中文圣经语体。
- source_word: בְּיוֹם הוֹצִיאִי אוֹתָם מֵאֶרֶץ מִצְרַיִם
  choice: 在领你们的列祖出埃及地……的那一天
  rationale: 保留具体的时间框架、使役者“我”以及“埃及地”这一出埃及传统中的正式地名表达。
- source_word: מִכּוּר הַבַּרְזֶל
  choice: 脱离铁炉
  rationale: 保留原文的凝练隐喻；“脱离”自然承接“领……出”，避免把比喻直接解释进正文。
- source_word: שִׁמְעוּ בְקוֹלִי
  choice: 听我的声音
  rationale: 保留“听—声音”的原文意象，不在正文中把它完全改写成“服从”；上下文的“遵行”清楚表达了顺服的含义。
- source_word: וַעֲשִׂיתֶם אוֹתָם
  choice: 遵行这些吩咐
  rationale: 复数宾语最自然地指向所吩咐的各项命令；中文明确补出“吩咐”，以免“做它们”生硬难懂。
- source_word: כְּכֹל אֲשֶׁר אֲצַוֶּה אֶתְכֶם
  choice: 完全照我所吩咐你们的去做
  rationale: “完全”表达 כְּכֹל 的全面性，“照……去做”自然呈现依照命令而行的要求。
- source_word: וִהְיִיתֶם לִי לְעָם
  choice: 你们就必作我的子民
  rationale: 采用清楚、通行的盟约公式表达，并以“就”呈现前后关系。
- source_word: וְאָנֹכִי אֶהְיֶה לָכֶם לֵאלֹהִים
  choice: 我也必作你们的上帝
  rationale: 自然呈现盟约关系的另一面，同时保留原文明确的第一人称强调。
theological_decisions:
- issue: 祖辈称谓中的性别形式
  choice: 你们的列祖
  alternative: 你们的祖先
  rationale: 原文使用阳性复数“父辈”。正文用“列祖”保留这一形式及以色列传统语境，脚注说明其含义可泛指先辈。
- issue: שִׁמְעוּ בְקוֹלִי 中“听”与“顺服”的关系
  choice: 听我的声音
  alternative: 听从我的话／服从我
  rationale: 该惯用语常包含顺服之意，但紧接着的“遵行”已经明说行动上的服从；保留“声音”可避免把原文意象和语义张力抹平。
- issue: 盟约公式的语气
  choice: 你们就必作我的子民，我也必作你们的上帝
  alternative: 你们将成为属我的子民，我也将成为你们的上帝
  rationale: 采用中文中自然且庄重的盟约公式，不把它额外解释成无条件宣告或仅仅法律交易。
translation_notes:
  register: 采用现代、庄重而可理解的普通话。“列祖”“子民”“上帝”维持盟约语境的正式感；“听我的声音”有意保留希伯来语的听觉意象，并由后文“遵行”补足顺服含义。
