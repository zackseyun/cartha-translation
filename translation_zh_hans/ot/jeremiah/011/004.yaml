revisions:
- from: 就是我在领你们的列祖[a]出埃及地、脱离铁炉[b]的那一天吩咐他们的。我说：‘你们要听我的声音[c]，遵行这些吩咐，完全照我所吩咐你们的去做。这样，你们就必作我的子民，我也必作你们的上帝。’
  to: 就是我在把他们从埃及地、从铁炉中领出来的那日所吩咐你们列祖的，说：‘你们要听我的声音，并要照着我所吩咐你们的一切去遵行；你们就必作我的子民，我也必作你们的上帝。’
  rationale: 修订使“从埃及地、从铁炉中”共同修饰“领出来”，更贴合希伯来文句法；并将“遵行”部分压缩为自然的中文表达，保留原文对全面遵行命令的要求。脚注内容无需改动，但锚点应分别置于“列祖”“铁炉”“听我的声音”之后。
