id: JER.11.17
reference: Jeremiah 11:17
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יהוָ֤ה צְבָאוֹת֙ הַ/נּוֹטֵ֣עַ אוֹתָ֔/ךְ דִּבֶּ֥ר עָלַ֖יִ/ךְ רָעָ֑ה בִּ֠/גְלַל רָעַ֨ת בֵּֽית יִשְׂרָאֵ֜ל וּ/בֵ֣ית יְהוּדָ֗ה אֲשֶׁ֨ר עָשׂ֥וּ לָ/הֶ֛ם לְ/הַכְעִסֵ֖/נִי לְ/קַטֵּ֥ר לַ/בָּֽעַל־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/011/017.yaml
  text: And Yahweh of Armies[a], who planted you, has spoken disaster against you because of the evil of the house of Israel and the house of Judah, which they have done to themselves, provoking me to anger by making offerings to Baal.
translation:
  language: zh_hans
  text: 栽种你的万军之耶和华已经宣告灾祸要临到你，因为以色列家和犹大家所行的恶；他们为自己行这恶，借着向巴力烧香[a]惹我发怒。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “烧香”也可译作“焚烧供物”。希伯来语这个动词指在礼仪中使供物冒烟，常用于指烧香。
    reason: 说明祭祀动词的具体含义及其可采用的较宽译法。
lexical_decisions:
- source_word: וַיהוָה צְבָאוֹת
  choice: 万军之耶和华
  rationale: “耶和华”采用现代中文圣经传统中通行的专名形式；“万军之”保留 צְבָאוֹת 所表达的统帅众军之称号。
- source_word: הַנּוֹטֵעַ אוֹתָךְ
  choice: 栽种你的
  rationale: 保留“栽种”的树木隐喻，并承接上文橄榄树的意象；中文定语结构简洁自然。
- source_word: דִּבֶּר עָלַיִךְ רָעָה
  choice: 已经宣告，要使灾祸临到你
  rationale: 此处 רָעָה 指审判性的灾祸，而非道德上的恶；“宣告”保留 דִּבֶּר 的言说含义。
- source_word: רָעַת בֵּית יִשְׂרָאֵל וּבֵית יְהוּדָה
  choice: 以色列家和犹大家所行的恶
  rationale: 此处同根词指道德上的恶，与前面的“灾祸”形成有意的意义对照；“家”保留群体和家族性的表达。
- source_word: אֲשֶׁר עָשׂוּ לָהֶם
  choice: 他们为自己行了这恶
  rationale: 保留 לָהֶם 的反身或利益关联色彩，不将其省略，也不进一步断定其仅指自我伤害。
- source_word: לְהַכְעִסֵנִי
  choice: 惹我发怒
  rationale: 自然表达使役动词所含的激怒、招惹发怒之意。
- source_word: לְקַטֵּר לַבָּעַל
  choice: 向巴力烧香
  rationale: קטר 在祭祀语境中特指使祭物发烟，常用于烧香；正文采用最自然且具体的中文表达，并以脚注保留较宽的祭献可能。
theological_decisions:
- issue: 神圣名称与称号 יהוה צבאות 的译法
  choice: 万军之耶和华
  alternative: 万军之主；雅威—万军之主
  rationale: 采用中文读者熟悉的“耶和华”，同时直译称号，不把“万军”缩减为仅指人间军队，也不引入特定宗派解释。
- issue: 同根词 רָעָה / רָעַת 在本节中的不同语义
  choice: 前者译“灾祸”，后者译“恶”
  alternative: 两处都译“恶”；分别译“灾难”和“邪恶”
  rationale: 上下文显示前者是上帝宣告的审判灾祸，后者是以色列家和犹大家的道德恶行。区别翻译既准确表达语义，又保留恶行与灾祸之间的张力。
- issue: אֲשֶׁר עָשׂוּ לָהֶם 中 לָהֶם 的处理
  choice: 他们为自己行了这恶
  alternative: 他们所行的恶；他们行这恶是为了惹我发怒
  rationale: 希伯来文保留了“为他们自己”的成分，其具体功能可理解为利益、结果或反身关联；正文保留这一含混性，不把它完全并入后面的目的结构。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“栽种”“万军之耶和华”“以色列家和犹大家”保留原文意象与群体称谓；句子适度拆分，以免多层从句妨碍普通读者理解。脚注标记[a]已置于相关词语之后。
