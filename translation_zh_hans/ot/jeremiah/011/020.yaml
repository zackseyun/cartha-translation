id: JER.11.20
reference: Jeremiah 11:20
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַֽ/יהוָ֤ה צְבָאוֹת֙ שֹׁפֵ֣ט צֶ֔דֶק בֹּחֵ֥ן כְּלָי֖וֹת וָ/לֵ֑ב אֶרְאֶ֤ה נִקְמָֽתְ/ךָ֙ מֵ/הֶ֔ם כִּ֥י אֵלֶ֖י/ךָ גִּלִּ֥יתִי אֶת רִיבִֽ/י־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/011/020.yaml
  text: But you[a], O Yahweh of hosts, who judge righteously, who test the kidneys and the heart, let me see your vengeance on them[c][b], for to you I have revealed my case.
translation:
  language: zh_hans
  text: 但，万军之雅威啊，你按公义审判，察验人的肾脏和心[a]；愿我看见你向他们施行报应[b]，因为我已向你陈明我的案件[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“肾脏和心”；在希伯来文化中，这两个器官可指人最深处的思想、感情和动机。
    reason: cultural_note
  - marker: b
    text: “报应”也可译作“报仇”或“伸冤”。
    reason: lexical_alternative
  - marker: c
    text: “案件”也可译作“争讼”或“诉讼”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיהוָה צְבָאוֹת
  choice: 但万军之雅威啊
  rationale: 连接词在上下文中带转折意味，译作“但”；将神名按其通常拟音译作“雅威”，并以“啊”体现直接呼告；“万军之”保留称号 צְבָאוֹת 的广泛含义。
- source_word: שֹׁפֵט צֶדֶק
  choice: 你按公义审判
  rationale: 分词表达雅威持续的行动与品格；“按公义”自然传达 צֶדֶק 所表示的审判准则和性质。
- source_word: בֹּחֵן כְּלָיוֹת וָלֵב
  choice: 察验人的肾脏和心
  rationale: “察验”体现深入检验之意；正文保留希伯来语“肾脏和心”的具体人体意象，并用脚注解释其文化含义。补出“人的”仅为汉语表达清楚，不改变所指。
- source_word: אֶרְאֶה
  choice: 愿我看见
  rationale: 该第一人称未完成式在祈求语境中具有愿望色彩；“愿我看见”既保留祈求语气，也不把它断定为单纯的将来陈述。
- source_word: נִקְמָתְךָ מֵהֶם
  choice: 你向他们施行报应
  rationale: נקמה 指报复、惩罚或伸冤性的追讨；“施行报应”在现代汉语中自然，并保留这是神公义行动的语境，同时以脚注列出其他可能译法。
- source_word: כִּי אֵלֶיךָ גִּלִּיתִי אֶת רִיבִי
  choice: 因为我已向你陈明我的案件
  rationale: כִּי 引出祈求的理由；“向你”保留原文强调。“陈明”表达 גלה 的揭开、显明之意；“案件”体现 ריב 的诉讼或争讼色彩。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 采用较贴近 יהוה 通常学术重构读音的现代汉语音译，以明确保留专名性质，不用称号取代神名。
- issue: “肾脏和心”的希伯来人观意象
  choice: 正文保留具体意象，并以脚注说明
  alternative: 内心深处；心思意念
  rationale: 原文以两个身体器官指向人的隐秘思想、感情和动机。直译可保持原文文化图像，脚注则帮助现代读者理解，而不在正文中把含义过早单一化。
- issue: נקמה 的神学语气
  choice: 报应
  alternative: 报仇；伸冤
  rationale: 该词可涉及对恶行的惩治，也可从受害者角度表示伸冤。“报应”保留审判语境而不过度限定为私人报复，脚注注明其语义范围。
translation_notes:
  register: 采用现代、庄重而可朗读的书面汉语。句式保持祷告中的直接呼告和司法语境；对陌生的“肾脏和心”意象不作正文释义化处理，而由脚注辅助理解。
