  text: הַ/דָּבָר֙ אֲשֶׁ֣ר הָיָ֣ה אֶֽל יִרְמְיָ֔הוּ מֵ/אֵ֥ת יְהוָ֖ה לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/011/001.yaml
  text: The word that came to Jeremiah from Yahweh[a], saying,
translation:
  language: zh_hans
  text: 雅威[a]的话临到耶利米，说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “雅威”是原文中神的专名。
    reason: 说明四字神名 יְהוָה 为专名，并与英语POB的“Yahweh”译法一致。
lexical_decisions:
- source_word: הַדָּבָר
  choice: 话
  rationale: דָּבָר可指“话、言语、信息”。在先知书的启示引言中译作“话”，既保留固定表达，也不把含义过早限定为一般性的“信息”或“消息”。
- source_word: הָיָה אֶל
  choice: 临到
  rationale: 字面上近于“向……而有”，但在先知书公式中表示神的话来到某位先知；“临到”是准确、庄重且为现代中文读者熟悉的对应表达。
- source_word: יִרְמְיָהוּ
  choice: 耶利米
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: מֵאֵת
  choice: 从……而来（由“耶和华的话临到”表达）
  rationale: מֵאֵת标明来源。中文“耶和华的话临到耶利米”的所属结构自然表明这话源自耶和华，无须生硬地另加“从”。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代简体中文中最通行、最易识别的四字神名音译；脚注同时说明原文为神的专名，并列出另一常见音译。
- source_word: לֵאמֹר
  choice: 说
  rationale: 该不定式引出下一节的直接话语。句末译作“说：”既保留衔接功能，也符合自然中文。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威；主
  rationale: 原文直接使用四字神名，而非“主”这一称号。正文采用中文读者最熟悉的专名形式“耶和华”，避免以称号取代专名；脚注保留“雅威”这一更接近学术重构读音的替代形式。
- issue: “话”与“信息”的取舍
  choice: 话
  alternative: 信息
  rationale: “话”保留先知启示公式的传统力度和 דָּבָר 的词义宽度，不把神的启示简化为抽象信息。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“耶和华的话临到……说”保留希伯来先知书的公式性结构；冒号表明神的话将在下一节继续。
