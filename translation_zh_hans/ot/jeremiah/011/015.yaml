id: JER.11.15
reference: Jeremiah 11:15
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: מֶ֣ה לִֽ/ידִידִ֞/י בְּ/בֵיתִ֗/י עֲשׂוֹתָ֤/הּ הַֽ/מְזִמָּ֨תָ/ה֙ הָֽ/רַבִּ֔ים וּ/בְשַׂר קֹ֖דֶשׁ יַעַבְר֣וּ מֵֽ/עָלָ֑יִ/ךְ כִּ֥י רָעָתֵ֖/כִי אָ֥ז תַּעֲלֹֽזִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/011/015.yaml
  text: What right has my beloved in my house[c][b][a], when she has done her many wicked schemes? Can holy flesh remove your evil from you? Then you rejoice!
translation:
  language: zh_hans
  text: 我所亲爱的既作了许多恶毒的计谋，在我家中还有什么权利呢[a]？圣肉[b]岂能使你的恶离开你呢[c]？那时，你还欢喜！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我所亲爱的在我家中有什么事呢？”“我家”在这里指耶和华的殿。
    reason: lexical_alternative
  - marker: b
    text: “圣肉”很可能指祭物的肉；这里的意思是，神圣的礼仪不能除去他们的罪恶。
    reason: cultural_note
  - marker: c
    text: 本句希伯来文艰涩。直译近于：“圣肉要从你身上过去；因你的恶——那时你就欢喜。”
    reason: alternative_reading
lexical_decisions:
- source_word: מֶה לִידִידִי בְּבֵיתִי
  choice: 我所爱的在我家中有什么权利呢
  rationale: מֶה לְ…בְּ…是带责问意味的习语，不只是询问“什么”，而是质问对方有何权利或资格身处此地。“我家”保留原文意象；在本书语境中指耶和华的殿。
- source_word: לִידִידִי
  choice: 我所爱的
  rationale: 保留יְדִיד所表达的亲爱、盟约关系及本节中的反讽意味，不将所指直接改写为“犹大”或“耶路撒冷”。
- source_word: עֲשׂוֹתָהּ הַמְזִמָּתָה הָרַבִּים
  choice: 她竟行了许多恶谋
  rationale: 原句句法和数的一致关系均有困难。מְזִמָּה可指计谋，并常带贬义；“恶谋”传达其道德色彩。“她”反映希伯来文阴性形式，所指很可能是犹大或耶路撒冷这一集合体。
- source_word: וּבְשַׂר קֹדֶשׁ
  choice: 圣肉
  rationale: 直译为“圣肉”，很可能指献祭后分别为圣的祭肉；正文保留祭祀用语，脚注说明文化背景。
- source_word: יַעַבְרוּ מֵעָלָיִךְ
  choice: 岂能除去你身上的恶吗
  rationale: עבר本义为“经过、离去”；结合“圣肉”和下文“你的恶”，译成反问句，使祭仪不能消除罪恶这一语境含义在中文中可懂，同时用脚注交代原文的艰涩与直译。
- source_word: רָעָתֵכִי
  choice: 你身上的恶
  rationale: 此处上下文针对百姓持续作恶，因此取道德意义的“恶”，而非“灾祸”。
- source_word: אָז תַּעֲלֹזִי
  choice: 到那时，你还欢喜
  rationale: עָלַז表示欢腾、喜乐；“还”传达责问中的反讽，但不改变其基本词义。
theological_decisions:
- issue: “我所爱的”所指为何
  choice: 保留“我所爱的”，并以阴性“她”反映犹大或耶路撒冷作为耶和华盟约子民的集合性称呼
  alternative: 泛指一名敬拜者，或不带反讽意味的圣殿群体
  rationale: 阴性的动词和代词支持阴性集合体这一理解；保留亲爱称谓，才能呈现盟约亲密关系遭背弃所产生的张力。
- issue: 祭肉与罪恶的关系
  choice: 将句子处理为反问：吃或持有圣肉不能除去持续的罪恶
  alternative: 仅泛指圣殿礼仪；或因文本艰涩而按直译保留“圣肉从你身上经过”
  rationale: “圣肉”与“你的恶”相邻，显示本节在抨击以宗教礼仪掩盖恶行；正文表达这一高度可能的语意，脚注则保留马所拉文本的困难和另一种直译可能。
- issue: 末句的语气
  choice: 以“到那时，你还欢喜！”表达带责备的反讽
  alternative: 中性陈述“那时你就欢喜”
  rationale: 上下文是严厉的责问，末句若作中性喜乐容易被误解为应许；加入“还”可自然表达讽刺语气，但不把喜乐的具体原因过度解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“有什么权利”保留责问力度；“我家”“圣肉”保留原文具体意象。正文以通顺的反问呈现最可能的语意，脚注明确标示文本困难，避免把不确定的句法解释伪装成唯一读法。所有脚注标记均在正文对应位置出现。
