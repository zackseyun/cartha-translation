base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/011/016.yaml
  text: The LORD called your name, ‘A green olive tree, beautiful with good fruit.’ At the sound of a great roar he set fire to it, and its branches are ruined.
translation:
  language: zh_hans
  text: 耶和华称你为：“一棵青翠的橄榄树，果实佳美，形态秀丽。”在巨大的喧嚣声中，他在树上点起火来，它的枝条就毁坏了。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: זַיִת רַעֲנָן
  choice: 青翠的橄榄树
  rationale: רַעֲנָן表示繁茂、青翠而有生机；此处保留先知诗歌中的树木意象。
- source_word: יְפֵה פְרִי תֹאַר
  choice: 果实佳美，形态秀丽
  rationale: 短语结构存在一定歧义：יְפֵה可与后续名词共同构成对果实和形态的赞美。译文保留“果实”与“形态”两个要素，避免仅译成“结着佳美果实”而遗漏תֹאַר。
- source_word: לְקוֹל הֲמוּלָּה גְדֹלָה
  choice: 伴着巨大的轰响
  rationale: הֲמוּלָּה可指喧嚣、骚动、轰鸣；上下文是烈火临到，以“轰响”自然呈现其听觉意象，同时不明确限定声响来源。
- source_word: וְרָעוּ דָּלִיּוֹתָיו
  choice: 树枝也被毁坏
  rationale: רָעַע在此形式和语境中表达遭毁坏、变坏；דָּלִיּוֹת指伸展的枝条。采用被动表达结果，并明确“树枝”以保持中文指代清楚。
theological_decisions:
- issue: 点火者的身份
  choice: 他点火焚烧这树
  alternative: 有人点火焚烧这树
  rationale: 希伯来文הִצִּית为第三人称阳性单数，最自然承接前句的耶和华；译作“他”保留原文语法关联，不额外添加解释。
- issue: 橄榄树比喻的对象
  choice: 保留第二人称“你”，不在正文补出“犹大”或“以色列”
  alternative: 耶和华曾称犹大为……
  rationale: 本节原文使用第二人称阴性单数后缀，具体对象由上下文确定；正文不把解释性身份直接写入，以保留篇章中的指称方式。
translation_notes:
  register: 采用现代、庄重而清晰的普通话。前半句保持赞美性的诗歌节奏，后半句用“如今”自然标示审判性的转折；神名按现代中文圣经传统译为“耶和华”。
