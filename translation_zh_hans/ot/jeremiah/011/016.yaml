revisions:
- from: 耶和华曾称你为“青翠的橄榄树，果实佳美，形态秀丽”。如今伴着巨大的轰响，他点火焚烧这树，树枝也被毁坏。
  to: 耶和华称你为：“一棵青翠的橄榄树，果实佳美，形态秀丽。”在巨大的喧嚣声中，他在树上点起火来，它的枝条就毁坏了。
