id: JER.11.12
reference: Jeremiah 11:12
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/הָֽלְכ֞וּ עָרֵ֣י יְהוּדָ֗ה וְ/יֹשְׁבֵי֙ יְר֣וּשָׁלִַ֔ם וְ/זָֽעֲקוּ֙ אֶל הָ֣/אֱלֹהִ֔ים אֲשֶׁ֛ר הֵ֥ם מְקַטְּרִ֖ים לָ/הֶ֑ם וְ/הוֹשֵׁ֛עַ לֹֽא יוֹשִׁ֥יעוּ לָ/הֶ֖ם בְּ/עֵ֥ת רָעָתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/011/012.yaml
  text: Then the cities of Judah and the inhabitants of Jerusalem will go and cry out to the gods to whom they burn incense[a], but they will certainly not save them in the time of their trouble.
translation:
  language: zh_hans
  text: 那时，犹大的各城和耶路撒冷的居民必去向那些向他们烧香的神明呼求；但在他们遭难的时候[a]，那些神明绝不能救他们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “遭难的时候”也可译作“灾祸临到的时候”或“遭灾的时候”。
    reason: 原文 רָעָה 可指祸患、灾难或困境；这些译法分别突出事件的灾祸性与当事人的受难处境。
lexical_decisions:
- source_word: וְהָלְכוּ
  choice: 那时……必去
  rationale: 此处带 וְ 的完成式处在预言性的叙事次序中，指随后将发生的行动；“那时”自然表达承接与结果关系，“必去”保留未来的确定性。
- source_word: עָרֵי יְהוּדָה
  choice: 犹大的各城
  rationale: 按构词关系直译，并以“各城”表达复数，符合现代汉语习惯。
- source_word: וְיֹשְׁבֵי יְרוּשָׁלִַם
  choice: 和耶路撒冷的居民
  rationale: 分词在此统指居住在耶路撒冷的人；“居民”简洁保留其集合意义。
- source_word: וְזָעֲקוּ אֶל
  choice: 向……呼求
  rationale: זעק 表示在危急中发出的求助呼喊；“呼求”既自然，也体现其迫切性和求援意味。
- source_word: הָאֱלֹהִים
  choice: 那些神明
  rationale: 上下文及后接的烧香关系从句表明，此处指犹大人敬拜的多个假神；“那些神明”在现代汉语中清楚表达复数指称，并与后文照应。
- source_word: אֲשֶׁר הֵם מְקַטְּרִים לָהֶם
  choice: 他们烧香供奉的
  rationale: 关系从句以敬拜行为辨明这些神；“烧香供奉”准确传达 קטר 的祭祀语境，又比单说“烧香”更清楚地表达行为对象。
- source_word: וְהוֹשֵׁעַ לֹא יוֹשִׁיעוּ לָהֶם
  choice: 但……绝不能救他们
  rationale: 动词不定式绝对形与限定动词连用，并受否定词修饰，形成强调；“绝不能救”以自然汉语保留强烈否定，同时避免机械重复。
- source_word: בְּעֵת רָעָתָם
  choice: 在他们遭难的时候
  rationale: רָעָה 在这里指人所经历的祸患或困境，而不是道德上的邪恶；“遭难”准确、凝练，并适合庄重经文语体。
theological_decisions:
- issue: אֱלֹהִים 的所指与数
  choice: 译作复数意义的“那些神明”，指犹大和耶路撒冷居民烧香供奉的神祇
  alternative: 泛指单数的“神”或形式上不标明单复数的“神明”
  rationale: 关系从句中的复数代词和动词，以及本段偶像崇拜的语境，都支持复数所指。译文不另加“假”或“偶像”，以免超出本节明说的内容，但以“那些神明”清楚呈现其复数指称。
- issue: הוֹשֵׁעַ לֹא יוֹשִׁיעוּ 的强调程度
  choice: 绝不能救他们
  alternative: 不能救他们；根本救不了他们
  rationale: 不定式绝对形与同根限定动词连用加强否定。“绝不能”保留原文强调且语体庄重；“根本救不了”虽自然，但较口语化。
translation_notes:
  register: 采用现代、庄重而通顺的普通话。“呼求”“遭难”保留先知书语体的凝练感；“那些神明”避免古奥，也不额外加入原文未明说的贬称。分号呈现求助与无法得救之间的强烈转折。
