base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/029.yaml
  text: Cut off your hair and throw it away[a], and raise a lament on the bare heights[b], for Yahweh has rejected and abandoned the generation of his wrath.
translation:
  language: zh_hans
  text: 你要剪下你的头发，把它丢弃[a]；要在光秃的高地上发出哀歌，因为雅威已经弃绝、离弃了他震怒的一代人。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “头发”或译“冠冕”。这个希伯来词可指分别为圣、冠冕，或与奉献身份有关的头发；这里“剪下”和“丢弃”的命令较支持“头发”。
    reason: lexical_alternative
  - marker: b
    text: 原文直译“他震怒的一代”，也可理解为“处在他震怒之下的一代”。
    reason: alternative_reading
lexical_decisions:
- source_word: גָּזִּי
  choice: 剪掉
  rationale: 阴性单数命令式，意为剪、剃；与头发搭配时，“剪掉”自然准确。
- source_word: נִזְרֵךְ
  choice: 你的头发
  rationale: 该词可指分别为圣、冠冕，或与奉献身份有关的头发；本节随后的“剪掉”和“丢弃”使“头发”最符合具体意象，同时以脚注保留词义上的歧义。
- source_word: וְהַשְׁלִיכִי
  choice: 把它丢弃
  rationale: 表达有意抛掉、不再保留；“丢弃”符合现代汉语，也保留审判和废弃的力度。
- source_word: וּשְׂאִי ... קִינָה
  choice: 唱起哀歌
  rationale: 原文直译为“举起哀歌”；汉语用“唱起哀歌”自然地表达发出哀悼之声。
- source_word: עַל שְׁפָיִם
  choice: 在光秃的高地上
  rationale: 指无树木、荒凉而暴露的高处；避免用可能专指祭祀场所的“丘坛”。
- source_word: כִּי מָאַס יְהוָה
  choice: 因为雅威已经弃绝
  rationale: מָאַס在此表达拒绝、弃绝；“弃绝”适合先知审判语境。神名四字母词按其专名音译为“雅威”。
- source_word: וַיִּטֹּשׁ
  choice: 离弃
  rationale: 表达撇下、遗弃；与“弃绝”并列，保留原文两个动词的累加强度。
- source_word: דּוֹר עֶבְרָתוֹ
  choice: 惹他震怒的这一代人
  rationale: 原文直译为“他震怒的一代”；汉语正文采用关系表达，使所指清楚而不减弱神审判的力度，并在脚注保留原文结构。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华／主
  rationale: 原文使用神的专名；“雅威”直接音译该名，避免以称号替代专名。
- issue: נִזְרֵךְ 的意象
  choice: 头发
  alternative: 冠冕／分别为圣的头发
  rationale: “剪掉、丢弃”明显支持头发意象，但词根仍带有分别为圣或冠冕的语义关联，因此不在正文中强行限定，改以脚注说明。
- issue: דּוֹר עֶבְרָתוֹ 的关系
  choice: 惹他震怒的这一代人
  alternative: 他震怒的一代／处在他震怒之下的一代
  rationale: 希伯来语属格关系本身简约而可能有多种解释；正文采用符合语境的现代汉语，脚注列出较直译的表达，以保存原文张力。
translation_notes:
  register: 采用现代、庄重而可朗读的标准普通话。三个阴性单数命令式所指向的是被人格化的耶路撒冷或犹大，中文以“你”保留这种直接呼告。
