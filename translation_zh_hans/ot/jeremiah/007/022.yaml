  text: כִּ֠י לֹֽא דִבַּ֤רְתִּי אֶת אֲבֽוֹתֵי/כֶם֙ וְ/לֹ֣א צִוִּיתִ֔י/ם בְּ/י֛וֹם הוציא אוֹתָ֖/ם מֵ/אֶ֣רֶץ מִצְרָ֑יִם עַל דִּבְרֵ֥י עוֹלָ֖ה וָ/זָֽבַח־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/022.yaml
  text: For I did not speak to your fathers or command them on the day I brought them out of the land of Egypt concerning burnt offering and sacrifice[a][b][c].
translation:
  language: zh_hans
  text: 因为在我把他们从埃及地领出来的那一天，我没有就燔祭和祭祀的事对你们的祖先说话，也没有吩咐他们[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “就燔祭和祭祀的事”也可译作“关于燔祭和献祭”。这里可能采用先知性的强烈说法，强调神所要求的是听从他，而不只是举行献祭礼仪；参下一节。
    reason: lexical_alternative
  - marker: b
    text: 这句话未必是在否认神曾颁布献祭条例，而是在本段语境中强烈对比顺服与祭祀；正文保留了希伯来原文直接的否定语气。
    reason: theological_tension
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，为先知的责备说明理由；保留原文的因果或解释作用。
- source_word: לֹא דִבַּרְתִּי אֶת אֲבוֹתֵיכֶם
  choice: 我……并没有对你们的祖先说过
  rationale: 直译否定陈述；“祖先”在现代汉语中自然，也准确指以色列人的先辈。
- source_word: וְלֹא צִוִּיתִים
  choice: 也没有吩咐过他们
  rationale: 保留与前句平行的否定结构；“吩咐”符合神向百姓发布命令的庄重语域。
- source_word: בְּיוֹם הוציא אוֹתָם מֵאֶרֶץ מִצְרָיִם
  choice: 我把你们的祖先从埃及地领出来的那一天
  rationale: 保留 בְּיוֹם 的“那一天”表达和出埃及事件的时间定位；依上下文将代词所指明示为“你们的祖先”，使汉语清楚。
- source_word: עַל דִּבְרֵי
  choice: 有关……的事
  rationale: 表达所谈论或吩咐的事项，既贴近原义，又符合现代汉语。
- source_word: עוֹלָה
  choice: 燔祭
  rationale: 这是该祭类的通行中文术语，指在坛上全部焚烧的祭物。
- source_word: וָזָבַח
  choice: 和祭牲
  rationale: זֶבַח 在此与燔祭并列，指宰献的祭物或祭类；“祭牲”既保留名词单数的类别性，也避免把它泛化成一切“献祭”。
theological_decisions:
- issue: 本节的否定是否应译成相对优先次序，以免看似与律法中的献祭条例冲突
  choice: 在正文中保留原文直截了当的否定：“并没有……说过，也没有……吩咐过”。
  alternative: 译为“我主要吩咐的并不是……”或在正文加入“起初”“首要”等限定语。
  rationale: 希伯来文本的否定十分强烈。翻译不应自行化解先知话语与献祭律例之间的张力；上下文所突出的顺服优先于礼仪，可在脚注中说明。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“燔祭”为必要的传统礼仪术语；“祭牲”明确表达 זבח 所指的宰献祭物。调整时间短语位置以符合自然汉语，同时保留原文的全部语义成分和强烈否定。
