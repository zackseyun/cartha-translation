  naturalness: 原稿虽可理解，但把长时间短语置于“因为”之后，继以“并没有对他们说过，也没有吩咐过他们有关……的事”，句法连接略显滞涩。“在……那一天，我没有就……对……说话，也没有吩咐他们”的结构在现代庄重汉语中更清楚，且“就……的事”自然统摄两个动词。
