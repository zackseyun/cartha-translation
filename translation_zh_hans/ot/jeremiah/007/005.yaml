source:
  edition: WLC
  text: כִּ֤י אִם הֵיטֵיב֙ תֵּיטִ֔יבוּ אֶת דַּרְכֵי/כֶ֖ם וְ/אֶת מַֽעַלְלֵי/כֶ֑ם אִם עָשׂ֤וֹ תַֽעֲשׂוּ֙ מִשְׁפָּ֔ט בֵּ֥ין אִ֖ישׁ וּ/בֵ֥ין רֵעֵֽ/הוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/005.yaml
  text: For if you truly make your ways and your deeds good[a], if you truly do justice between a man and his neighbor[b],
translation:
  language: zh_hans
  text: 你们若实实在在改正自己的道路和行为[a]，若实实在在在人与邻舍之间施行公正[b]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“彻底改正你们的道路和行为。”希伯来文在这两个分句中都以不定式绝对形配合限定动词，表示强调。
    reason: lexical_alternative
  - marker: b
    text: 或译：“若实实在在在一人与另一人之间施行公正。”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: 因为……若
  rationale: 保留כִּי的承接、说明作用和אִם的条件意义；本节句意延续到下文，因此以逗号收束。
- source_word: הֵיטֵיב תֵּיטִיבוּ
  choice: 真正改善
  rationale: 不定式绝对形与限定动词连用，强化动作；“真正”自然表达强调，“改善”适合以“道路和行为”为宾语。
- source_word: דַּרְכֵיכֶם
  choice: 自己的道路
  rationale: 保留“道路”这一生活方式的具体隐喻；“自己的”在现代汉语中自然指向复数的“你们”。
- source_word: מַעַלְלֵיכֶם
  choice: 行为
  rationale: 指人的所作所为；“行为”庄重而通俗，并能与“道路”自然并列。
- source_word: אִם עָשׂוֹ תַעֲשׂוּ
  choice: 若真正……行事
  rationale: 再次用“真正”体现不定式绝对形的强调；结合מִשְׁפָּט译作“秉公行事”，符合现代汉语搭配。
- source_word: מִשְׁפָּט
  choice: 秉公
  rationale: 此处指在人际或司法关系中实行公正，不仅是一次“审判”；“秉公行事”准确传达实践公平正义的含义。
- source_word: בֵּין אִישׁ וּבֵין רֵעֵהוּ
  choice: 在人与邻舍之间
  rationale: 保留אִישׁ的单数代表性以及רֵעַ的“邻舍”概念，同时用现代汉语可理解的表达呈现双方之间的公正裁断。
theological_decisions:
- issue: אִישׁ的阳性单数代表性语言
  choice: 人
  alternative: 一个男人／人与同伴
  rationale: 希伯来语אִישׁ在这一法律—社会公式中以阳性单数作代表性用法，并非强调男性身份；汉语“人”既能自然承载这种通称功能，也不增加原文没有的性别限制。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留“道路”的希伯来语生活隐喻；两次“真正”对应原文平行的强调结构。经文在本节末尚未完句，故以逗号结束。
