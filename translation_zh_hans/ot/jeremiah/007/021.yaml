id: JER.7.21
reference: Jeremiah 7:21
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כֹּ֥ה אָמַ֛ר יְהוָ֥ה צְבָא֖וֹת אֱלֹהֵ֣י יִשְׂרָאֵ֑ל עֹלוֹתֵי/כֶ֛ם סְפ֥וּ עַל זִבְחֵי/כֶ֖ם וְ/אִכְל֥וּ בָשָֽׂר־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/021.yaml
  text: 'Thus says Yahweh of hosts[a], the God of Israel: Add your burnt offerings to your sacrifices, and eat the flesh.'
translation:
  language: zh_hans
  text: 万军之耶和华——以色列的上帝如此说：“把你们的燔祭加在你们的祭物[a]上，吃肉吧！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“平安祭”；这个希伯来词在这里可能特指献祭者可以分食祭肉的祭。
    reason: 保留 זֶבַח 在本处可能具有的较具体祭祀含义，同时避免正文过度消除原文的语义幅度。
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: 如此说
  rationale: 这是先知传达神谕的固定引语格式；“如此说”既保留庄重语气，也符合现代汉语表达。
- source_word: יְהוָה צְבָאוֹת
  choice: 万军之耶和华
  rationale: 保留神的专名及这一完整称号；“万军”不把所指限于地上的军队，也是现代中文圣经语体中清楚、庄重的表达。
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: 以色列的上帝
  rationale: 直接表达原文的属格结构，说明说话者是以色列的上帝。
- source_word: עֹלוֹתֵיכֶם
  choice: 你们的燔祭
  rationale: עֹלָה指在坛上全部焚烧的祭物；“燔祭”是准确而通行的中文祭祀术语。
- source_word: סְפוּ עַל
  choice: 加在……上
  rationale: 保留命令式及其字面结构，也传达本句带有讽刺意味的吩咐。
- source_word: זִבְחֵיכֶם
  choice: 你们的祭物
  rationale: זֶבַח可泛指祭物；在与燔祭对举时也可能特指献祭者可以分食的祭。正文保留较宽泛的含义，较具体的可能性放入脚注。
- source_word: וְאִכְלוּ בָשָׂר
  choice: 吃肉吧
  rationale: בָשָׂר在献祭语境中指可吃的祭肉；现代汉语用“肉”比“肉体”或“血肉”自然准确。句末“吧”使并列命令在中文中自然，并能承载语境中的讽刺语气。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用四字神名而非“主”的称号。正文采用现代中文读者最熟悉、并明确作为专名使用的“耶和华”，不以“主”替代神名。
- issue: זִבְחֵיכֶם 与燔祭对举时的具体含义
  choice: 你们的祭物
  alternative: 你们的平安祭
  rationale: 该词本身可以泛指祭物，但此处与全部焚烧的燔祭对举，可能更具体地指献祭者可以吃祭肉的祭。正文不把这个可能含义定死，脚注保留较窄的译法。
- issue: 命令“加上……吃肉”的语气
  choice: 保留直接命令，不在正文解释其讽刺含义
  alternative: 加入“只管”或“索性”等显明讽刺的措辞
  rationale: 上下文显示这很可能是讽刺性的命令，但原文本句没有相当于“只管”或“索性”的词；因此让语境呈现讽刺，不在正文中额外解释。
translation_notes:
  register: 采用庄重而可懂的现代标准汉语。“万军之耶和华”和“燔祭”保留必要的圣经及祭祀术语；句法则按自然中文调整。破折号清楚标示“万军之耶和华”与同位语“以色列的上帝”的关系。
