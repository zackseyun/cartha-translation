base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/009.yaml
  text: Will you steal[a], murder, commit adultery, swear falsely, burn incense to Baal[b], and go after other gods that you have not known—
translation:
  language: zh_hans
  text: 难道你们要偷窃、杀人、通奸、起假誓、向巴力烧香，又去跟从[a]你们素不认识[b]的别神——
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“随从”。
    reason: lexical_alternative
  - marker: b
    text: “素不认识”也可译作“从未认识”或按含义译作“从未承认”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲ/גָנֹב
  choice: 难道你们要偷窃
  rationale: 疑问词 הֲ 引出一连串不定式形式的罪行，构成带责问意味的反问；“难道……要”在现代汉语中自然传达这种先向推进而未完结的语势。
- source_word: רָצֹחַ
  choice: 杀人
  rationale: רצח 通常指不法夺取人命；汉语“杀人”在此罪行清单中已具有明确的违法和道德谴责意味，比泛指死亡的表达准确。
- source_word: וְ/נָאֹף
  choice: 通奸
  rationale: נאף 是专指奸淫、违背婚约的常用词；“通奸”简洁而准确。
- source_word: וְ/הִשָּׁבֵעַ לַ/שֶּׁקֶר
  choice: 起假誓
  rationale: 该短语指虚假地起誓或以誓言支持虚假之事；“起假誓”保留其法律与伦理含义，并符合现代汉语习惯。
- source_word: וְ/קַטֵּר לַ/בָּעַל
  choice: 向巴力烧香
  rationale: קטר 在祭祀语境中指焚香或献上产生烟气的祭物；“烧香”直接而易懂。“巴力”采用该神名的通行汉译。
- source_word: וְ/הָלֹךְ אַחֲרֵי
  choice: 去随从
  rationale: 希伯来语字面为“走在……之后”，在此表示追随并效忠；“去随从”既保留行动意象，也符合先知责问的语势。
- source_word: אֱלֹהִים אֲחֵרִים
  choice: 别神
  rationale: 该词组直指其他的神明；“别神”是自然、庄重且简洁的汉语表达，不额外解释为外邦神。
- source_word: אֲשֶׁר לֹא יְדַעְתֶּם
  choice: 你们素不认识的
  rationale: ידע 可表示知道、认识，也可能含有承认或关系性的意味；“素不认识”保留较宽泛的原义，并体现此前没有相识或关系，而不把含义限定为“未曾承认”。
theological_decisions:
- issue: “不认识”别神的含义
  choice: 你们素不认识的
  alternative: 你们从未承认的；你们从前不知道的
  rationale: ידע 在盟约语境中可能不只是认知，也可涉及承认、关系或亲身经验。正文采用较直译且含义开放的“认识”，保留先知话语中的张力，不把它收窄为某一种神学解释。
translation_notes:
  register: 采用现代、庄重而易懂的责问语体；以“难道……要”统摄连续罪行，并用破折号保留原句向下一节延伸、尚未收束的结构。脚注标记按其实际所注释的词语放置。
