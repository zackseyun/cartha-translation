id: JER.7.11
reference: Jeremiah 7:11
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: הַ/מְעָרַ֣ת פָּרִצִ֗ים הָיָ֨ה הַ/בַּ֧יִת הַ/זֶּ֛ה אֲשֶׁר נִקְרָֽא שְׁמִ֥/י עָלָ֖י/ו בְּ/עֵינֵי/כֶ֑ם גַּ֧ם אָנֹכִ֛י הִנֵּ֥ה רָאִ֖יתִי נְאֻם יְהוָֽה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/011.yaml
  text: Has this house[a], which is called by my name, become a den of robbers in your eyes? Even I myself, look, I have seen it, declares Yahweh.
translation:
  language: zh_hans
  text: 这座奉我名而称的殿，在你们眼中竟成了强盗的巢穴[a]吗？看哪，我自己也已经看见了。这是雅威的宣告。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“暴徒的洞穴”或“匪徒的巢穴”。希伯来语既可特指强盗，也可泛指凶暴不法之徒。
    reason: 词义存在真实范围，需保留“强盗”“匪徒”及“凶暴不法之徒”等可能含义。
lexical_decisions:
- source_word: מְעָרַת
  choice: 巢穴
  rationale: 原词指洞穴、藏身之处；“巢穴”在现代汉语中自然地表达罪犯聚集和藏匿之所，同时保留先知话语中的形象。
- source_word: פָּרִצִים
  choice: 强盗
  rationale: 该词可指凶暴不法之徒、匪徒或强盗；“强盗”能传达掠夺性犯罪，也与“巢穴”构成自然搭配，但其较宽的语义范围以脚注保留。
- source_word: הָיָה
  choice: 成了
  rationale: 此处完成式在反问中可表达结果状态，即圣殿竟被人当作罪犯的藏身之所；“成了”比单纯的“是”更能呈现这种语气。
- source_word: הַבַּיִת הַזֶּה
  choice: 这座……殿
  rationale: 原文直译为“这房屋”，语境明确指圣殿；汉语用“殿”既自然清楚，也没有增添原文之外的解释。
- source_word: נִקְרָא שְׁמִי עָלָיו
  choice: 称为我名下
  rationale: 保留原文“我的名被称在其上”的立约及归属表达；“称为我名下”在汉语中凝练且可理解。
- source_word: בְּעֵינֵיכֶם
  choice: 在你们眼中
  rationale: 贴近原文，也自然表达百姓如何看待和使用这殿。
- source_word: גַּם אָנֹכִי
  choice: 我自己也
  rationale: “我自己”传达独立代词的强调，“也”保留 גַּם 的对照意味。
- source_word: הִנֵּה
  choice: 看哪
  rationale: 作为引人注意的语气词，“看哪”庄重而又为现代读者熟悉。
- source_word: רָאִיתִי
  choice: 已经看见了
  rationale: 以“已经……了”表达完成式；宾语由上文自然补足，不必另加解释。
- source_word: נְאֻם יְהוָה
  choice: 雅威宣告
  rationale: 简洁、庄重地呈现先知书常见的神谕结束语。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常用音译呈现四字神名，保留其作为专名的性质。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名；采用“雅威”保留专名，而不以称号替代。
- issue: 圣殿意象中的反问及 הָיָה 的语气
  choice: 竟成了……吗
  alternative: 是……吗
  rationale: 原文既可理解为状态，也可理解为形成的结果；“成了”贴合此处指控圣殿被当作罪犯避难所的语境，“竟”则自然传达反问中的震惊与责备，而不改变命题内容。
- issue: פָּרִצִים 的语义范围
  choice: 正文译“强盗”，脚注保留“暴徒／匪徒”
  alternative: 正文译“暴徒”或“匪徒”
  rationale: 该词既可着重抢掠，也可泛指凶暴不法之徒。正文选择自然且有传统互文辨识度的“强盗”，同时用脚注避免把语义范围缩窄为单一罪名。
translation_notes:
  register: 采用现代、庄重而清楚的先知性语体。“这座称为我名下的殿”保留原文归属公式；“看哪”维持警醒性的宣告语气。脚注标记[a]紧随相关短语。
