id: JER.7.20
reference: Jeremiah 7:20
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: לָ/כֵ֞ן כֹּה אָמַ֣ר אֲדֹנָ֣/י יְהֹוִ֗ה הִנֵּ֨ה אַפִּ֤/י וַֽ/חֲמָתִ/י֙ נִתֶּ֨כֶת֙ אֶל הַ/מָּק֣וֹם הַ/זֶּ֔ה עַל הָֽ/אָדָם֙ וְ/עַל הַ/בְּהֵמָ֔ה וְ/עַל עֵ֥ץ הַ/שָּׂדֶ֖ה וְ/עַל פְּרִ֣י הָֽ/אֲדָמָ֑ה וּ/בָעֲרָ֖ה וְ/לֹ֥א תִכְבֶּֽה־׀־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/020.yaml
  text: 'Therefore thus says the Lord GOD: Behold[a], my anger and my wrath are being poured out on this place, on man and on beast, on the trees of the field and on the fruit of the ground; it will burn and will not be quenched.'
translation:
  language: zh_hans
  text: 所以，主耶和华如此说：“看哪，我的怒气和烈怒正倾倒在这地方，临到人[a]和牲畜、田野的树木和地里的出产；必燃烧，不能熄灭。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “人”也可译作“人类”；希伯来语用单数，具有泛指意义。
    reason: 说明 הָאָדָם 的单数形式及集合性、泛指性。
lexical_decisions:
- source_word: לָכֵן
  choice: 所以
  rationale: 承接上文的指控并引出其后果；“所以”在现代汉语中自然、清楚。
- source_word: כֹּה אָמַר
  choice: 如此说
  rationale: 保留先知信息中惯用的使者宣告格式，同时符合庄重的现代汉语。
- source_word: אֲדֹנָי יְהוִה
  choice: 主耶和华
  rationale: 分别体现称号 אֲדֹנָי 与神名 יהוה，并避免译成不自然的“主主”。
- source_word: הִנֵּה
  choice: 看哪
  rationale: 保留郑重宣告和唤起注意的语气，比口语化的“你看”更符合先知文体。
- source_word: אַפִּי וַחֲמָתִי
  choice: 我的怒气和烈怒
  rationale: 用两个相关而强度有别的词保留希伯来语并列表达；“烈怒”体现 חֵמָה 的加强语气。
- source_word: נִתֶּכֶת
  choice: 正倾倒
  rationale: 保留分词所表达的正在发生或迫近当前的动态，不将其弱化为一般将来。
- source_word: אֶל הַמָּקוֹם הַזֶּה
  choice: 倾倒在这地方
  rationale: 在倾倒和审判的语境中，“在”自然表达怒气所临到的目标。
- source_word: הָאָדָם
  choice: 人
  rationale: 希伯来语为单数而具泛指作用；汉语“人”既简洁又能保留代表全人类的集合意义。
- source_word: הַבְּהֵמָה
  choice: 牲畜
  rationale: 此处与人、树木和地里出产并列，指受当地灾祸波及的走兽；“牲畜”符合农业语境，但不刻意扩展为一切动物。
- source_word: עֵץ הַשָּׂדֶה
  choice: 田野的树木
  rationale: 将单数集合名词按自然汉语译为复数概念，并保留“田野”的意象。
- source_word: פְּרִי הָאֲדָמָה
  choice: 地里的出产
  rationale: 表达土地所结的农产，比字面的“地的果子”更自然，同时不局限为树上果实。
- source_word: וּבָעֲרָה וְלֹא תִכְבֶּה
  choice: 必燃烧，不能熄灭
  rationale: 保留火焰持续、无法扑灭的审判图像；汉语省略主语，也保留希伯来文中所指是怒气、烈怒或其审判之火的关联张力。
theological_decisions:
- issue: 复合称号 אֲדֹנָי יְהוִה 中神名的译法
  choice: 主耶和华
  alternative: 主上帝
  rationale: “主耶和华”同时区分称号和神名，符合中文圣经语域，也不把专名完全改写为普通称谓。
- issue: הָאָדָם 的泛指意义
  choice: 人
  alternative: 人类
  rationale: “人”保留原文单数形式及其代表性，并与“牲畜”形成简洁对举；脚注说明其泛指意义，避免误解为某一名男子。
- issue: 末句阴性单数动词的所指
  choice: 省略明示主语：“必燃烧，不能熄灭”
  alternative: 这烈怒必燃烧，不能熄灭
  rationale: 原文语法可把动作与前面的怒气、烈怒及其倾倒联系起来；汉语零主语能自然保留这种指涉空间，避免擅自限定。
translation_notes:
  register: 采用庄重而可懂的现代标准汉语。“如此说”“看哪”保留先知宣告的正式语气；其余措辞避免生硬直译。并列项以顿号式节奏处理，末句不补出主语，以保存原文的简洁和指涉张力。
