  text: כִּ֣י לְכוּ נָ֗א אֶל מְקוֹמִ/י֙ אֲשֶׁ֣ר בְּ/שִׁיל֔וֹ אֲשֶׁ֨ר שִׁכַּ֧נְתִּֽי שְׁמִ֛/י שָׁ֖ם בָּ/רִֽאשׁוֹנָ֑ה וּ/רְאוּ֙ אֵ֣ת אֲשֶׁר עָשִׂ֣יתִי ל֔/וֹ מִ/פְּנֵ֕י רָעַ֖ת עַמִּ֥/י יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/012.yaml
  text: For go now to my place that was in Shiloh[a], where I made my name dwell at first, and see what I did to it because of the evil of my people Israel.
translation:
  language: zh_hans
  text: 你们现在去我在示罗的那地方，就是我起初使我的名居住之处[a]，察看我因我子民以色列的恶，对那地方做了什么。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “使我的名居住”也可译作“安置我的名”或传统上所说的“立我的名”。原文保留了神的名“居住”在那里的意象。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: （不单独译出）
  rationale: 本词承接上文，为随后的命令提供理由；中文若直译“因为”会形成不完整的句法，因此借整句与上文的衔接表达其因果作用。
- source_word: לְכוּ נָא
  choice: 你们现在去
  rationale: 复数命令式加 נָא 在此表达催促；“现在去”自然保留其紧迫语气，而非译成礼貌性的“请去”。
- source_word: מְקוֹמִי אֲשֶׁר בְּשִׁלוֹ
  choice: 我在示罗的地方
  rationale: 直接保留“我的地方”所表达的归属关系，并将地点关系自然地译入现代汉语。
- source_word: שִׁכַּנְתִּי שְׁמִי שָׁם
  choice: 我使我的名居住的地方
  rationale: 保留使役词形以及“名居住”的希伯来语意象，不将其弱化为单纯的“立名”或解释为神本体受地点限制。
- source_word: בָּרִאשׁוֹנָה
  choice: 起初
  rationale: 指示罗曾是较早设立的圣所所在地；“起初”简洁且符合上下文的历史对照。
- source_word: וּרְאוּ
  choice: 看看
  rationale: 延续前面的复数命令，呼吁听众察看并思想示罗的历史结局；“看看”在现代汉语中自然，同时仍具警告语气。
- source_word: אֵת אֲשֶׁר עָשִׂיתִי לוֹ
  choice: 对那地方做了什么
  rationale: 阳性单数后缀最自然地回指 מָקוֹם“地方”；明确译为“那地方”可避免中文代词指向不清。
- source_word: מִפְּנֵי רָעַת עַמִּי יִשְׂרָאֵל
  choice: 因我子民以色列的恶
  rationale: מִפְּנֵי 表示原因；רָעָה 在这里是招致审判的道德之恶，而不是临到以色列的灾祸。
theological_decisions:
- issue: שִׁכַּנְתִּי שְׁמִי שָׁם 中神同在的表达
  choice: 我使我的名居住的地方
  alternative: 我安置我名的地方／我立我名的地方
  rationale: 所述是神使自己的名与示罗相联，表达立约性的临在。“使我的名居住”保留原文意象，也不把神的本体局限于某一地点。
- issue: 示罗从句的时间含义
  choice: 我在示罗的地方
  alternative: 我从前在示罗的地方
  rationale: 希伯来语关系从句本身没有明示过去时；历史上的“较早”已由“起初”表达。正文不额外加入“从前”，从而保留原文形式，同时上下文仍清楚表明示罗是先前的圣所。
- issue: לוֹ 的所指
  choice: 那地方
  alternative: 它／那里
  rationale: 后缀在语法上最自然地回指“我的地方”；明确所指不改变经文的审判对象，也避免被误解为指某个人。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“你们”体现复数命令；“看看”虽较口语化，但准确传达先知催促众人亲自考察历史事实的语气。脚注标记紧接与其相关的“示罗的地方”，用于说明随后关于神之名居住的表达。
