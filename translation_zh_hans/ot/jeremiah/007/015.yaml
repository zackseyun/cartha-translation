base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/015.yaml
  text: And I will cast you out from before me[a], just as I cast out all your brothers[c][b], all the offspring of Ephraim.
translation:
  language: zh_hans
  text: 我要把你们从我面前赶出去[a]，正如我赶出了你们所有的弟兄[b]——以法莲所有的后裔[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “从我面前”较直译为“从我的面上”，也可理解为“离开我面前”或“离开我的同在”。
    reason: lexical_alternative
  - marker: b
    text: 这里的“弟兄”指犹大的同族以色列人，尤其是北国的百姓。
    reason: cultural_note
  - marker: c
    text: “以法莲”在这里代表北国以色列；“以法莲所有的后裔”与前面的“弟兄”构成同位说明。
    reason: cross_reference
lexical_decisions:
- source_word: וְהִשְׁלַכְתִּי
  choice: 我要……赶出去
  rationale: 使役形动词在这里表达强力的驱逐与弃绝；“赶出去”在现代汉语中自然，并保留审判语气。
- source_word: אֶתְכֶם
  choice: 你们
  rationale: 对应第二人称阳性复数直接宾语。
- source_word: מֵעַל פָּנָי
  choice: 从我面前
  rationale: 贴近原文“从我的脸面之上”，保留“离开我面前／同在”的空间与关系意象，不把含义收窄为单纯“看不见”。
- source_word: כַּאֲשֶׁר
  choice: 正如
  rationale: 清楚标明将临到犹大的审判与先前临到以法莲的审判之间的类比。
- source_word: הִשְׁלַכְתִּי
  choice: 我赶出了
  rationale: 与前半句重复同一动词，保持修辞呼应及驱逐的力度。
- source_word: כָּל אֲחֵיכֶם
  choice: 你们所有的弟兄
  rationale: 保留原文的亲属比喻；此处指犹大的同族以色列人，尤其是北国百姓。
- source_word: אֵת כָּל זֶרַע אֶפְרָיִם
  choice: 就是以法莲所有的后裔
  rationale: “后裔”自然表达 זֶרַע 的群体性含义；“就是”表明该短语进一步说明“弟兄”，同时保留专名“以法莲”。
theological_decisions:
- issue: 如何翻译神弃绝人的惯用语 מֵעַל פָּנָי
  choice: 从我面前
  alternative: 离开我的面／从我的视线中
  rationale: 原文描绘被逐离神面前，含有审判与关系性弃绝；直译式表达保留其意象，也避免引入关于神无所不在的额外解释。
- issue: 如何处理 אֲחֵיכֶם 的亲属称谓
  choice: 弟兄
  alternative: 同胞／亲族
  rationale: 原文使用阳性复数亲属词，并借此称呼同族以色列人；正文保留亲属意象，脚注说明其群体所指。
- issue: “以法莲”的转喻意义
  choice: 正文保留“以法莲”
  alternative: 北国以色列
  rationale: 希伯来文本直接使用以法莲之名；虽然此处以它代表北国以色列，正文不代为解释，脚注说明转喻。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“赶出去”比“抛出去”更符合汉语中的驱逐语境；“从我面前”保留希伯来原文的脸面／同在意象。脚注标记均置于相关词语之后。
