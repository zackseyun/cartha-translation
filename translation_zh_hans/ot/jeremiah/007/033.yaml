  text: וְֽ/הָ֨יְתָ֜ה נִבְלַ֨ת הָ/עָ֤ם הַ/זֶּה֙ לְ/מַֽאֲכָ֔ל לְ/ע֥וֹף הַ/שָּׁמַ֖יִם וּ/לְ/בֶהֱמַ֣ת הָ/אָ֑רֶץ וְ/אֵ֖ין מַחֲרִֽיד׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/033.yaml
  text: The corpses of this people will become food for the birds of the heavens and for the beasts of the earth[a], with no one to frighten them away.
translation:
  language: zh_hans
  text: 这百姓的尸首必成为空中飞鸟和地上走兽的食物[a]，无人把它们吓走。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “尸首”在希伯来原文中是单数形式，但可作集合用法；末句原文直译为“无人惊吓”，宾语没有明说。
    reason: 说明集合单数及原文末句宾语省略，以保留文本的语法含混。
lexical_decisions:
- source_word: וְהָיְתָה
  choice: 必成为
  rationale: 在先知审判宣告中，此形式自然表达将来的结果；与“成为……的食物”搭配也符合现代汉语。
- source_word: נִבְלַת
  choice: 尸首
  rationale: 该词指尸体或死兽；这里所指为百姓，译作“尸首”自然庄重，并保留不得安葬、任其暴露的羞辱意味。希伯来语为单数形式，但可作集合用法。
- source_word: הָעָם הַזֶּה
  choice: 这百姓
  rationale: עַם通常指“百姓、人民”；此处指犹大百姓。“这百姓”贴近原文，也符合先知书语体。
- source_word: לְמַאֲכָל
  choice: 食物
  rationale: 直指供吞食之物，简洁保留审判图景的强烈与冷峻。
- source_word: לְעוֹף הַשָּׁמַיִם
  choice: 空中飞鸟
  rationale: עוֹף为集合名词，指飞禽；“空中飞鸟”是自然且庄重的汉语圣经表达，也准确传达其栖息领域。
- source_word: וּלְבֶהֱמַת הָאָרֶץ
  choice: 和地上走兽
  rationale: בְּהֵמָה在此集合性地指地上的动物，语境中特别是吞食尸体的兽类；“走兽”与“飞鸟”形成自然对举。
- source_word: וְאֵין מַחֲרִיד
  choice: 无人把它们吓走
  rationale: 原文末句没有明说宾语；结合语境，所指最自然是前述飞鸟和走兽。正文为汉语清晰度补出“它们”，脚注保留原文省略宾语的特点。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“空中飞鸟”和“地上走兽”保留先知文体的平行结构；“尸首”比“尸体”更有经文语体色彩，但仍为当代读者熟悉。
