  text: וּ/בָנ֞וּ בָּמ֣וֹת הַ/תֹּ֗פֶת אֲשֶׁר֙ בְּ/גֵ֣יא בֶן הִנֹּ֔ם לִ/שְׂרֹ֛ף אֶת בְּנֵי/הֶ֥ם וְ/אֶת בְּנֹתֵי/הֶ֖ם בָּ/אֵ֑שׁ אֲשֶׁר֙ לֹ֣א צִוִּ֔יתִי וְ/לֹ֥א עָלְתָ֖ה עַל לִבִּֽ/י־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/031.yaml
  text: They have built the high places of Topheth[a], which is in the Valley of Ben-hinnom, to burn their sons and their daughters in the fire—something I did not command, nor did it come up in my heart.
translation:
  language: zh_hans
  text: 他们在欣嫩子谷建造了陀斐特的丘坛，要在火中焚烧自己的儿子和女儿；这事我没有吩咐过，也未曾浮现在我心中。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可较意译为“我也从未想过”。希伯来原文直译是“也未曾上到我心里”。
    reason: 说明希伯来语拟人化惯用语，并提供较自然的动态译法。
lexical_decisions:
- source_word: וּבָנוּ
  choice: 他们……建造了
  rationale: 这是בנה的Qal完成式第三人称复数，表示已经完成、并造成当前局面的行动；中文用“建造了”自然体现这一点。
- source_word: בָּמוֹת
  choice: 丘坛
  rationale: 该词指用于祭祀的高处或祭坛；“丘坛”简明保留其宗教场所含义，也避免把它泛化为普通高地。
- source_word: הַתֹּפֶת
  choice: 陀斐特
  rationale: 作为地点名称音译，不把其可能的词源意义带入正文。
- source_word: בְּגֵיא בֶן־הִנֹּם
  choice: 在欣嫩子谷
  rationale: גֵיא译为“谷”，בן־הִנֹּם按通行地名“欣嫩子谷”处理，符合现代中文圣经地名表达。
- source_word: לִשְׂרֹף
  choice: 要……焚烧
  rationale: 带ל的动词不定式表示建造丘坛的目的；“要……焚烧”直接呈现目的关系。
- source_word: אֶת־בְּנֵיהֶם וְאֶת־בְּנֹתֵיהֶם
  choice: 自己的儿子和女儿
  rationale: 保留原文分别点明儿子与女儿的表达，不笼统改作“儿女”或“孩子”。
- source_word: בָּאֵשׁ
  choice: 放在火中
  rationale: 介词ב在此表达火中的焚烧；补入“放”使中文句法顺畅，但没有减弱“焚烧”的动作。
- source_word: אֲשֶׁר לֹא צִוִּיתִי
  choice: 这事我没有吩咐过
  rationale: 关系代词所指的是刚描述的焚烧儿女之举；“这事”在中文中明确承接其内容。
- source_word: וְלֹא עָלְתָה עַל־לִבִּי
  choice: 也从未上到我心里
  rationale: 尽量保留“上到心里”的希伯来语意象和拟人表达；“从未”自然表达否定完成式在此的强烈否认语气。
theological_decisions:
- issue: 上帝对焚烧儿女之举的否认
  choice: 保留“也从未上到我心里”的拟人化措辞
  alternative: 译作“我也从未想过”或“这也从未进入我的意念”
  rationale: 原文强烈否认这种行为出于上帝的吩咐或心意，但其拟人化惯用语本身不应被扩展为关于上帝是否预知此事的教义断言。较贴近原文的表达保留了文本的神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“丘坛”为较凝练的宗教场所用语；末句刻意保留原文的心之意象，并以脚注解释。
