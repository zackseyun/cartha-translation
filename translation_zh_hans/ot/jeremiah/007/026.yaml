id: JER.7.26
reference: Jeremiah 7:26
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/ל֤וֹא שָׁמְעוּ֙ אֵלַ֔/י וְ/לֹ֥א הִטּ֖וּ אֶת אָזְנָ֑/ם וַ/יַּקְשׁוּ֙ אֶת עָרְפָּ֔/ם הֵרֵ֖עוּ מֵ/אֲבוֹתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/026.yaml
  text: Yet they did not listen to me[a], and they did not incline their ear, but they stiffened their neck[b]; they acted more wickedly than their fathers.
translation:
  language: zh_hans
  text: 然而，他们不听从我，也不侧耳倾听，反而硬着颈项[a]；他们所行的恶，比他们的父辈[b]更甚。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “硬着颈项”是比喻，指顽梗、抗拒，不肯听从。
    reason: cultural_note
  - marker: b
    text: “父辈”也可译作“祖先”。
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמְעוּ אֵלַי
  choice: 听从我
  rationale: שׁמע与אֶל连用，在这里不只是听见声音，更有留心、听取之意。“听从”保留其意志与关系层面的含义，同时不像“顺服”那样把隐含结果完全明说出来。
- source_word: הִטּוּ אֶת אָזְנָם
  choice: 侧耳倾听
  rationale: 原文直译为“使他们的耳朵倾斜”，是专心聆听的惯用表达。“侧耳倾听”在现代汉语中自然，也保留了希伯来语的身体意象和与前句的平行。
- source_word: וַיַּקְשׁוּ אֶת עָרְפָּם
  choice: 硬着颈项
  rationale: 这是希伯来语表示顽梗抗拒的惯用比喻。“硬着颈项”保留原文形象，脚注说明其含义。
- source_word: הֵרֵעוּ
  choice: 他们所行的恶……更甚
  rationale: רעע的使役式在此表示行恶；后接比较介词מִן，明确表达程度超过前人。“所行的恶……更甚”既显出行为层面，也自然呈现比较关系。
- source_word: מֵאֲבוֹתָם
  choice: 比他们的父辈
  rationale: אָבוֹת既可指父亲，也常指历代祖先。此处比较的是当代人与以往世代；“父辈”较贴近原文字面，同时容纳较广的先辈含义，脚注列出“祖先”这一译法。
- source_word: וְלֹא ... וְלֹא ... וַ
  choice: 然而……也不……反而……
  rationale: 连续连接词在上下文中带有转折和递进效果。这样译出与前文的反差，并使三个分句在现代汉语中衔接自然。
theological_decisions:
- issue: שׁמע所表达的回应程度
  choice: 听从我
  alternative: 顺服我
  rationale: 经文所说的是拒绝听取并理会上帝的话，其中包含不顺服，但原词本身仍以“听”为核心。“听从”保留这层张力，不把隐含的结果过度明确化。
- issue: אָבוֹת所指的世代范围
  choice: 父辈
  alternative: 祖先
  rationale: 这里可能指直接的上一代，也可能泛指以色列历代先人。“父辈”保留原文的亲属称谓及世代比较，脚注则保留更宽泛的理解。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“侧耳倾听”和“硬着颈项”保留原文平行结构及身体意象；用“更甚”维持先知性话语的凝练力度。
