base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/018.yaml
  text: The children gather wood[a], the fathers kindle the fire, and the women knead dough to make cakes for the Queen of Heaven and to pour out drink offerings to other gods, so as to provoke me to anger.
translation:
  language: zh_hans
  text: 孩子们捡柴，父亲们点火，妇女们揉面，做饼献给“天后”[a]，又向别的神倾倒酒祭，以此惹我发怒。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语 מְלֶכֶת הַשָּׁמַיִם 传统上理解为“天后”，很可能是犹大人所敬拜的一位女神的称号。也有人主张译作“天上的工作”，但本节向其献祭的语境更支持把它理解为一位神祇。
    reason: 保留有争议的另一种读法，并说明正文选择的语境依据。
lexical_decisions:
- source_word: מְלַקְּטִים עֵצִים
  choice: 捡柴
  rationale: 分词表示收集；עֵצִים 在生火的语境中指木柴。“捡柴”自然、具体，又不把原文限定为细树枝。
- source_word: מְבַעֲרִים אֶת הָאֵשׁ
  choice: 点火
  rationale: 该词组表示把火点起、使其燃烧；“点火”是简明自然的现代汉语。
- source_word: לָשׁוֹת בָּצֵק
  choice: 揉面
  rationale: 动词特指揉制面团；汉语“揉面”准确传达这一具体动作。
- source_word: כַּוָּנִים
  choice: 饼
  rationale: 指用于祭祀的成形饼食；上下文中的“献给”已显明其宗教用途，无须在名词本身加入解释。
- source_word: מְלֶכֶת הַשָּׁמַיִם
  choice: “天后”
  rationale: 按传统元音和上下文，这是受献祭的女性神祇称号。加引号表明是称号，也避免读者误以为译者认可其真实神格。
- source_word: וְהַסֵּךְ נְסָכִים
  choice: 又……浇奠祭
  rationale: 保留向神祇倾倒液体祭物的礼仪动作；“奠祭”在中文圣经语境中准确且较易理解。
- source_word: אֱלֹהִים אֲחֵרִים
  choice: 别的神
  rationale: 直译“其他的神”；不增添原文没有明确表达的“外邦”含义。
- source_word: לְמַעַן הַכְעִסֵנִי
  choice: 以此惹我发怒
  rationale: 保留使役含义及目的或结果的张力；“以此”自然承接全家参与的祭祀行为。
theological_decisions:
- issue: מְלֶכֶת הַשָּׁמַיִם 的所指
  choice: “天后”
  alternative: “天上的造物（或工作）”
  rationale: 马所拉元音、句法以及本节向其献饼的祭祀语境，都支持把它理解为女性神祇的称号。另一种词源或读法虽有人提出，但与这里接受祭物的对象较不相称，因此置于脚注，保留文本讨论中的真实歧义。
- issue: לְמַעַן 的目的与结果色彩
  choice: 以此惹我发怒
  alternative: 结果使我发怒
  rationale: 该结构可表达目的，也可在语境中带有结果意味。正文采用既可表示有意挑衅、也可描述行为后果的自然说法，不进一步判定所有参与者的主观动机。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。以“孩子们—父亲们—妇女们”的并列结构保留全家分工参与偶像祭祀的递进画面；“捡柴、点火、揉面”具体明快。“天后”保留为古代神祇称号，不引入后世宗教联想。
