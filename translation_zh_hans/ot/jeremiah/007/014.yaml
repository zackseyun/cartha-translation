language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/עָשִׂ֜יתִי לַ/בַּ֣יִת אֲשֶׁ֧ר נִֽקְרָא שְׁמִ֣/י עָלָ֗י/ו אֲשֶׁ֤ר אַתֶּם֙ בֹּטְחִ֣ים בּ֔/וֹ וְ/לַ֨/מָּק֔וֹם אֲשֶׁר נָתַ֥תִּי לָ/כֶ֖ם וְ/לַ/אֲבֽוֹתֵי/כֶ֑ם כַּ/אֲשֶׁ֥ר עָשִׂ֖יתִי לְ/שִׁלֽוֹ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/014.yaml
  text: So I will do to the house that is called by my name[a], in which you trust, and to the place that I gave to you and to your fathers[b], just as I did to Shiloh.
translation:
  language: zh_hans
  text: 因此，我要照我对待示罗的方式，对待那称为我名下、你们所倚靠的殿[a]，以及我赐给你们和你们列祖的地方[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译为“我的名被称在其上的殿”。这是希伯来语惯用语，表示这殿归属于耶和华，并以他的名为标识。
    reason: lexical_alternative
  - marker: b
    text: 示罗是较早的圣所所在地；它所受的审判构成警戒的先例。参看撒母耳记上4章和耶利米书7:12。
    reason: cross_reference
lexical_decisions:
- source_word: וְעָשִׂיתִי
  choice: 所以，我要怎样对待……也要怎样对待
  rationale: 连接上文的审判警告，并结合句末的比较结构在汉语中自然表达；希伯来文没有明说具体行动，译文也保留这种带有威胁意味的省略。
- source_word: לַבַּיִת
  choice: 这座……殿
  rationale: בַּיִת 字面为“房屋”，但此处明确指耶路撒冷圣殿；现代汉语用“殿”清楚自然，同时不与后面的“地方”混同。
- source_word: אֲשֶׁר נִקְרָא שְׁמִי עָלָיו
  choice: 称为我名下的
  rationale: 该希伯来语惯用语表示归属于耶和华、以他的名为标识；“称为我名下”既保留“名”的表达，也符合现代汉语。
- source_word: אֲשֶׁר אַתֶּם בֹּטְחִים בּוֹ
  choice: 就是你们所倚靠的
  rationale: 分词表示持续的信赖或倚仗；“所倚靠的”自然体现百姓把圣殿当作保障的态度。
- source_word: וְלַמָּקוֹם
  choice: 并且对待……这地方
  rationale: מָקוֹם 与“殿”有意区分，可能指更广的圣地或耶路撒冷所在地；译作“地方”保留其宽泛性。汉语补出“对待”以明确它与前面的并列关系。
- source_word: אֲשֶׁר נָתַתִּי לָכֶם וְלַאֲבוֹתֵיכֶם
  choice: 我赐给你们和你们列祖的
  rationale: “列祖”准确传达 אֲבוֹתֵיכֶם 在盟约历史语境中的先辈含义，也比现代汉语直译“父亲们”自然。
- source_word: כַּאֲשֶׁר עָשִׂיתִי לְשִׁלוֹ
  choice: 怎样对待示罗，也要怎样对待
  rationale: 比较结构译成对应的“怎样……也要怎样……”，自然传达同样的审判；“示罗”采用通行中文地名。
theological_decisions:
- issue: 如何表达圣所归于上帝之名的盟约性惯用语
  choice: 称为我名下的殿
  alternative: 我的名被称在其上的殿
  rationale: 所选译法保留“名”与归属意义，同时避免把惯用语误解为单纯命名，也不引入后来的教义解释。
- issue: 是否区分“殿”与“地方”
  choice: 保留“殿”和“地方”两个不同称呼
  alternative: 两处都译作“圣殿”或“圣所”
  rationale: 希伯来文分别使用 בַּיִת 和 מָקוֹם，可能涵盖圣殿建筑与更广的圣地；保留区分可维持审判范围的张力。
- issue: 如何呈现对示罗的审判内容
  choice: 不补明“毁灭”等具体行动
  alternative: 译作“毁灭这殿……正如毁灭示罗”
  rationale: 原文只说“我怎样做”，具体内容由上下文说明。保留省略可维持原文简短而不祥的力度，避免超出本节明说的内容。
- issue: אֲבוֹתֵיכֶם 的称谓
  choice: 你们列祖
  alternative: 你们的祖先
  rationale: “列祖”在现代宗教与历史语境中仍清楚可懂，并保留原词的父系形式及盟约历史色彩。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“殿”与“地方”分别对应两个希伯来词；以重组的比较句适应汉语语序，同时保留原文未明说审判行动的 ominous brevity。唯一脚注标记[a]已在正文中出现。
