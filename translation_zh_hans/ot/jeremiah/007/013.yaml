source:
  edition: WLC
  text: וְ/עַתָּ֗ה יַ֧עַן עֲשׂוֹתְ/כֶ֛ם אֶת כָּל הַ/מַּֽעֲשִׂ֥ים הָ/אֵ֖לֶּה נְאֻם יְהוָ֑ה וָ/אֲדַבֵּ֨ר אֲלֵי/כֶ֜ם הַשְׁכֵּ֤ם וְ/דַבֵּר֙ וְ/לֹ֣א שְׁמַעְתֶּ֔ם וָ/אֶקְרָ֥א אֶתְ/כֶ֖ם וְ/לֹ֥א עֲנִיתֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/013.yaml
  text: And now[a], because you have done all these deeds, declares Yahweh, and I spoke to you, rising early and speaking, but you did not listen, and I called to you, but you did not answer[b],
translation:
  language: zh_hans
  text: 现在，因你们做了这一切事，雅威宣告说：我屡次早早起来向你们说话[a]，你们却不听；我呼唤你们，你们却不回答。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “屡次早早起来向你们说话”是希伯来语习语，表示一再、持续而恳切地说话。
    reason: cultural_note
lexical_decisions:
- source_word: וְעַתָּה
  choice: 现在
  rationale: 承接上文并引出由此而来的结论；现代汉语用“现在”自然表达这一推进关系。
- source_word: יַעַן עֲשׂוֹתְכֶם אֶת כָּל הַמַּעֲשִׂים הָאֵלֶּה
  choice: 你们既然做了这一切恶事
  rationale: יַעַן引出审判的原因；上下文表明这些“行为”是恶行，译作“恶事”能自然传达先知谴责的语境。
- source_word: נְאֻם יְהוָה
  choice: 这是雅威的宣告
  rationale: 保留先知书中庄严的神谕公式，并以“雅威”音译四字神名。
- source_word: וָאֲדַבֵּר אֲלֵיכֶם הַשְׁכֵּם וְדַבֵּר
  choice: 我一次又一次早早起来向你们说话
  rationale: 保留“早早起来说话”的希伯来意象，同时用“一次又一次”传达该习语所含持续、反复的意味。
- source_word: וְלֹא שְׁמַעְתֶּם
  choice: 你们却不听
  rationale: “听”保留听闻与顺从之间的语义张力；“却”自然呈现前后反差。
- source_word: וָאֶקְרָא אֶתְכֶם
  choice: 我呼唤你们
  rationale: קרא在此是直接呼叫或召唤；“呼唤”符合现代汉语且保留恳切呼告的形象。
- source_word: וְלֹא עֲנִיתֶם
  choice: 你们却不回答
  rationale: 保留神呼唤、百姓不作答的对话意象。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名；“雅威”较直接地呈现其可能的古希伯来语读音，而不以称号替代专名。
- issue: הַשְׁכֵּם וְדַבֵּר 是否意译
  choice: 正文保留“早早起来”的意象，并补出反复性
  alternative: 不断地说；一再地说
  rationale: 原文习语兼有具象表达和持续、恳切的语用力量；正文保留意象，脚注说明其含义，避免完全抹平源语特色。
- issue: שׁמע 的语义范围
  choice: 听
  alternative: 听从；顺服
  rationale: 此处可能兼指听见和服从。译作“听”保留原文的语义张力，不把道德含义单独限定为“顺服”。
translation_notes:
  register: 采用庄重而清晰的现代标准汉语。句中用破折号标示先知宣告公式，用分号呈现“说话—不听、呼唤—不答”的平行结构；保留源语习语的形象，并以脚注解释。
