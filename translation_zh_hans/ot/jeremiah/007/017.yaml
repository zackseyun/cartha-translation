base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/017.yaml
  text: Do you not see what they are doing in the cities of Judah and in the streets of Jerusalem?[a]
translation:
  language: zh_hans
  text: 你没有看见他们在犹大的各城和耶路撒冷的街道上所做的事吗？[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “街道”或译“广场”或“空旷处”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַאֵינְךָ רֹאֶה
  choice: 你没有看见……吗
  rationale: 以现代汉语的否定反问句表达对第二人称阳性单数对象的直接质问，保留“看见”兼具目睹与察觉的宽泛含义。
- source_word: מָה הֵמָּה עֹשִׂים
  choice: 他们……所做的事
  rationale: מָה引出所看见的内容；独立代词הֵמָּה指“他们”，分词עֹשִׂים表示当下持续进行的行为。汉语用“他们所做的事”自然表达这一整体。
- source_word: בְּעָרֵי יְהוּדָה
  choice: 在犹大的各城
  rationale: 保留介词的地点含义及构造关系；复数עָרֵי译作“各城”，自然呈现犹大境内多个城邑。
- source_word: וּבְחֻצוֹת יְרוּשָׁלִָם
  choice: 和耶路撒冷的街道上
  rationale: חֻצוֹת可指街道、广场或城中的开放场所。正文采用现代城市语境中自然的“街道”，并以脚注保留其他可能。
