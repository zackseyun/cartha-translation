  text: וְ/אָמַרְתָּ֣ אֲלֵי/הֶ֗ם זֶ֤ה הַ/גּוֹי֙ אֲשֶׁ֣ר לֽוֹא שָׁמְע֗וּ בְּ/קוֹל֙ יְהוָ֣ה אֱלֹהָ֔י/ו וְ/לֹ֥א לָקְח֖וּ מוּסָ֑ר אָֽבְדָה֙ הָֽ/אֱמוּנָ֔ה וְ/נִכְרְתָ֖ה מִ/פִּי/הֶֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/028.yaml
  text: Then you shall say to them[a], ‘This is the nation that did not listen to the voice of Yahweh its God and did not accept correction. Faithfulness has perished; it has been cut off from their mouth.’
translation:
  language: zh_hans
  text: 你要对他们说：“这个国不听耶和华——他们的上帝——的声音，也不接受管教。忠信[a]已经消失，从他们口中断绝了。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“真实”。希伯来语אֱמוּנָה可指“忠信”“可靠”或“真实”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמַרְתָּ אֲלֵיהֶם
  choice: 你要对他们说
  rationale: 未完成式意义由连接词加完成式在先知话语中的承接用法表达；汉语用“要……说”自然传达接续的吩咐，无须机械译出“然后”。
- source_word: זֶה הַגּוֹי
  choice: 这就是……国民
  rationale: גּוֹי可指“国”或“国民”。此处后接复数动词，并聚焦人的不听从，因此译作“国民”较自然；“这就是”保留指示判断结构。
- source_word: לֹא שָׁמְעוּ בְּקוֹל
  choice: 不听……之声
  rationale: שׁמע בְּקוֹל兼有聆听与顺从之意；“不听……之声”保留原文听觉意象，也能由语境带出不服从。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代汉语圣经传统中对四字神名的通行音译，保留其专名性质，而不以头衔替代。
- source_word: אֱלֹהָיו
  choice: 他们的上帝
  rationale: 原文第三人称阳性单数后缀与集合名词גּוֹי语法一致；汉语按集合所指用复数“他们的”，避免不自然的“它的上帝”。
- source_word: וְלֹא לָקְחוּ מוּסָר
  choice: 不肯接受管教
  rationale: מוּסָר涵盖管教、纠正和训诲；“接受管教”符合责备语境。“不肯”自然表达拒绝接受的语用含义，但不额外指定管教形式。
- source_word: אָבְדָה הָאֱמוּנָה
  choice: 忠信已经消失
  rationale: אֱמוּנָה可指忠信、可靠或真实；在盟约责备语境中，“忠信”较能体现关系与伦理层面。“已经消失”自然表达完成状态。
- source_word: וְנִכְרְתָה מִפִּיהֶם
  choice: 也从他们口中断绝了
  rationale: נכרתה为כרת的Niphal完成式，意为“被剪除、断绝”；“断绝”保留强烈意象，且“从他们口中”忠实保留原文表达。
theological_decisions:
- issue: 盟约责备语境中אֱמוּנָה的译法
  choice: 忠信
  alternative: 真实（或：真理）
  rationale: 本节谴责国民不听上帝且拒绝管教，“忠信”能呈现其对上帝及言语行为上的不可靠；但该词也确可表示真实或真理，因此用脚注保留这一词义张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“耶和华”保留神名；“国民”兼顾集合名词与后续复数指称；整句保留原文责备语气和“口中断绝”的鲜明意象。
