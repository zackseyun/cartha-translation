  text: עֲמֹ֗ד בְּ/שַׁ֨עַר֙ בֵּ֣ית יְהוָ֔ה וְ/קָרָ֣אתָ שָּׁ֔ם אֶת הַ/דָּבָ֖ר הַ/זֶּ֑ה וְ/אָמַרְתָּ֞ שִׁמְע֣וּ דְבַר יְהוָ֗ה כָּל יְהוּדָה֙ הַ/בָּאִים֙ בַּ/שְּׁעָרִ֣ים הָ/אֵ֔לֶּה לְ/הִֽשְׁתַּחֲוֺ֖ת לַ/יהוָֽה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/002.yaml
  text: Stand in the gate of the house of Yahweh[a], and proclaim there this word, and say, “Hear the word of Yahweh, all Judah, who enter through these gates to worship Yahweh.”
translation:
  language: zh_hans
  text: 你要站在雅威殿的门口，在那里宣告这话，说：“全犹大的人哪，你们这些从这些门进来敬拜[a]雅威的人，都要听雅威的话。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“向雅威俯伏下拜”。这个希伯来语动词可指身体俯伏的动作，尤其用于敬拜的场合。
    reason: 保留 לְהִשְׁתַּחֲוֺת 既可概括为敬拜、又具体指俯伏下拜的词义范围。
lexical_decisions:
- source_word: עֲמֹד
  choice: 你要站
  rationale: 这是阳性单数命令式，吩咐耶利米站在指定地点；“你要站”在现代汉语中自然庄重。
- source_word: בְּשַׁעַר בֵּית יְהוָה
  choice: 在雅威殿的门口
  rationale: בְּשַׁעַר 可指在门内、门边或门口；“门口”既符合圣殿入口处的语境，也避免生硬的“在门里”。בֵּית 在此指圣殿，译作“殿”比字面的“房屋”更清楚。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语中常见的音译呈现四字神名，保留其作为专名的性质，不以称号替代。
- source_word: וְקָרָאתָ שָּׁם אֶת־הַדָּבָר הַזֶּה
  choice: 在那里宣告这话
  rationale: קרא 在先知公开传言的语境中是“宣告”；“这话”保留 דָּבָר 的单数形式和先知话语的表达。
- source_word: שִׁמְעוּ דְבַר יְהוָה
  choice: 都要听雅威的话
  rationale: שִׁמְעוּ 是复数命令式；汉语把命令置于称呼及修饰语之后更为自然，“听……的话”也保留了听从的语义可能。
- source_word: כָּל יְהוּדָה
  choice: 全犹大的人哪
  rationale: “犹大”在原文中是对全体百姓的集合称呼；补出“的人”使现代汉语清楚，“哪”标明直接呼语。
- source_word: הַבָּאִים בַּשְּׁעָרִים הָאֵלֶּה
  choice: 你们这些从这些门进来……的人
  rationale: 分词短语限定受话者；补出“你们”符合汉语直接称呼习惯，并保留“这些门”的复数。
- source_word: לְהִשְׁתַּחֲוֺת
  choice: 敬拜
  rationale: 该词在此表示来到圣殿向雅威俯伏敬拜；正文采用自然概括性的“敬拜”，脚注保留身体俯伏动作这一具体含义。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文三次使用四字神名。译作“雅威”保留专名性质，并较接近学界通常重构的读音；不以“上主”这一称号替代。
translation_notes:
  register: 采用现代、庄重而易懂的宣告语体。为符合汉语信息结构，将“都要听雅威的话”置于呼语和限定从句之后；没有改变原文的命令对象或范围。
