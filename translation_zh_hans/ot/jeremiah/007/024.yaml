  text: וְ/לֹ֤א שָֽׁמְעוּ֙ וְ/לֹֽא הִטּ֣וּ אֶת אָזְנָ֔/ם וַ/יֵּֽלְכוּ֙ בְּ/מֹ֣עֵצ֔וֹת בִּ/שְׁרִר֖וּת לִבָּ֣/ם הָ/רָ֑ע וַ/יִּהְי֥וּ לְ/אָח֖וֹר וְ/לֹ֥א לְ/פָנִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/024.yaml
  text: But they did not listen[a], and they did not incline their ear, but walked in their own counsels, in the stubbornness of their evil heart[c][b], and they went backward and not forward.
translation:
  language: zh_hans
  text: 可是，他们不听[a]，也不侧耳留心，反而随从自己的谋算，顺着自己邪恶之心的顽梗而行[b]；他们倒退，而不前进。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “听”也可理解为“听从”；这里指留心聆听，以致接受并照着去行。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“在自己邪恶之心的顽梗中”；希伯来语的“心”包括思想和意志，不仅指情感。
    reason: cultural_note
lexical_decisions:
- source_word: שָׁמְעוּ
  choice: 不听
  rationale: 该词可指听见、听从；这里与“侧耳”并列，重点是拒绝留心听从。“不听”保留了听见与听从之间的语义张力。
- source_word: הִטּוּ אֶת אָזְנָם
  choice: 不侧耳留心
  rationale: 保留“侧耳”的希伯来语意象，同时用“留心”清楚表达专心听取之意。
- source_word: וַיֵּלְכוּ בְּמֹעֵצוֹת
  choice: 随从自己的谋算……而行
  rationale: הלך搭配介词可表示依照某事而行；“而行”保留行为道路的隐喻，“随从自己的谋算”自然表达按自己的计策行事。
- source_word: בִּשְׁרִרוּת
  choice: 顺着……顽梗
  rationale: 该词在耶利米书中常指顽固任性；“顽梗”既庄重又能表达抗拒、不肯改变的内在意志。
- source_word: לִבָּם הָרָע
  choice: 自己邪恶的内心
  rationale: 希伯来语“心”涵盖思想、意志与欲望，不仅指情感；“内心”在现代汉语中可自然承载这一较广含义。
- source_word: וַיִּהְיוּ לְאָחוֹר וְלֹא לְפָנִים
  choice: 他们不断后退，毫无长进
  rationale: 原文以“向后而不向前”形成方向对比，表达倒退而非前进；此译保留对比并使汉语自然。未采用“转过背去”之类译法，因为那不是本节的实际措辞。
theological_decisions:
- issue: “邪恶内心”的道德人论含义
  choice: 直接保留对其内心邪恶、顽梗的道德判断
  alternative: 释为“罪性”，或扩展成关于其本性完全败坏、盟约身份的系统教义陈述
  rationale: 本节明确指责他们内心邪恶而顽梗，但没有在此展开更广泛的教义论断；译文不应增添经文未明说的体系化结论。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“侧耳留心”兼顾原文意象与汉语清晰度；“谋算”“顽梗”保留先知责备的力度。末句用“不断后退，毫无长进”表达原文“向后而不向前”的方向性对照。
