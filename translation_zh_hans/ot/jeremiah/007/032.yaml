id: JER.7.32
reference: Jeremiah 7:32
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: לָ/כֵ֞ן הִנֵּֽה יָמִ֤ים בָּאִים֙ נְאֻם יְהוָ֔ה וְ/לֹא יֵאָמֵ֨ר ע֤וֹד הַ/תֹּ֨פֶת֙ וְ/גֵ֣יא בֶן הִנֹּ֔ם כִּ֖י אִם גֵּ֣יא הַ/הֲרֵגָ֑ה וְ/קָבְר֥וּ בְ/תֹ֖פֶת מֵ/אֵ֥ין מָקֽוֹם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/032.yaml
  text: Therefore, look, days are coming, declares the LORD, when it will no longer be called Topheth and the Valley of Ben-hinnom, but the Valley of Slaughter; and they will bury in Topheth because there is no place left.
translation:
  language: zh_hans
  text: 所以，看哪，日子将到——这是耶和华的宣告——那地方将不再称为陀斐和欣嫩子谷，而要称为杀戮谷。人们将在陀斐埋葬尸体，因为再没有地方可埋了。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לָכֵן
  choice: 所以
  rationale: 自然表达本节与前文罪行及审判宣告之间的因果关系。
- source_word: הִנֵּה
  choice: 看哪
  rationale: 保留先知宣告中引人注意并强调事情迫近的语气。
- source_word: נְאֻם יְהוָה
  choice: 这是耶和华的宣告
  rationale: נְאֻם 表示庄严的神谕宣告；用“耶和华”传达圣名 יהוה。
- source_word: הַתֹּפֶת
  choice: 陀斐
  rationale: 作为地名音译，并采用中文圣经读者较熟悉的形式。
- source_word: גֵיא בֶן הִנֹּם
  choice: 欣嫩子谷
  rationale: 按专名结构译出，并采用通行中文名称。
- source_word: גֵיא הַהֲרֵגָה
  choice: 杀戮谷
  rationale: הֲרֵגָה 指杀戮、被杀之事；此译简洁保留地名改称所表达的审判。
- source_word: וְקָבְרוּ
  choice: 人们将……埋葬尸体
  rationale: 希伯来语为无明确主语的第三人称复数，可自然译作泛指“人们”；“尸体”由埋葬语境明确补出。
- source_word: מֵאֵין מָקוֹם
  choice: 因为再没有地方可埋了
  rationale: 表达因墓地不足而在陀斐埋葬的含义；补出“可埋”使现代汉语语义完整。
theological_decisions:
- issue: 地名改称中的并列关系
  choice: “陀斐和欣嫩子谷”作为同一地点的两个相关称谓，一并说将不再使用
  alternative: 译作“陀斐或欣嫩子谷”，突出两个称谓分别被废止
  rationale: 原文 וְ 可作连接词；直译为“和”既保留形式，也不强行判定两个名称的精确地理关系。
- issue: 审判宣告的确定性
  choice: 用“日子将到”和“要称为”表达确定将临的审判
  alternative: 用较弱的可能语气
  rationale: 原文先知公式和未完成体在此构成确定的未来宣告，不宜弱化。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。以破折号隔开神谕公式，使长句清楚；专名使用“陀斐、欣嫩子谷、耶和华”等通行译法。
