  text: לְ/מִן הַ/יּ֗וֹם אֲשֶׁ֨ר יָצְא֤וּ אֲבֽוֹתֵי/כֶם֙ מֵ/אֶ֣רֶץ מִצְרַ֔יִם עַ֖ד הַ/יּ֣וֹם הַ/זֶּ֑ה וָ/אֶשְׁלַ֤ח אֲלֵי/כֶם֙ אֶת כָּל עֲבָדַ֣/י הַ/נְּבִיאִ֔ים י֖וֹם הַשְׁכֵּ֥ם וְ/שָׁלֹֽחַ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/025.yaml
  text: From the day your fathers came out of the land of Egypt until this day[a], I have sent to you all my servants the prophets, day after day[b], rising early and sending them.
translation:
  language: zh_hans
  text: 自从你们的祖先从埃及地出来的那一天起，直到今日，我日复一日地早早起来，差遣我所有的仆人——众先知到你们那里。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “早早起来，差遣”是希伯来语惯用表达，表示上帝殷切而持续地一再差遣先知；“早早起来”保留了原文的形象性说法。
    reason: cultural_note
lexical_decisions:
- source_word: לְמִן הַיּוֹם אֲשֶׁר ... עַד הַיּוֹם הַזֶּה
  choice: 从……的那一天起，直到今天
  rationale: 准确表达从一个起点延续到说话当下的时间跨度，也符合现代汉语习惯。
- source_word: יָצְאוּ אֲבוֹתֵיכֶם
  choice: 你们祖先出
  rationale: אָבוֹת在出埃及的历史语境中指以色列人的先辈；“祖先”比字面的“父亲们”更自然、准确。
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: 出埃及地
  rationale: 保留“埃及地”这一在盟约历史叙述中反复出现的完整表达。
- source_word: אֶת כָּל עֲבָדַי הַנְּבִיאִים
  choice: 我的仆人众先知都
  rationale: 把“众先知”理解为“我的仆人”的同位说明，并以“都”体现כָּל的全称含义。
- source_word: יוֹם הַשְׁכֵּם וְשָׁלֹחַ
  choice: 日复一日，早早起来……差
  rationale: 保留耶利米书富有特色的希伯来语表达，同时用“日复一日”清楚传达持续、反复差遣之意。
theological_decisions:
- issue: 如何翻译称呼先知的עֲבָדַי
  choice: 我的仆人
  alternative: 我的奴仆
  rationale: 此处重点是先知受上帝委派、为他服事的身份，而不是其受奴役的社会地位；“仆人”既保留从属和使命意味，也更符合上下文。
- issue: 是否淡化“早早起来”对上帝的拟人表达
  choice: 在正文中保留“早早起来”
  alternative: 反复不断地差遣
  rationale: 原文有意使用拟人化惯用语；正文保留其形象和神学张力，脚注再说明其语用功能，避免把表达默默改写为抽象概念。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“祖先”“日复一日”自然明晰；保留“埃及地”“仆人众先知”和“早早起来”等原文色彩，并用脚注解释不易直接理解的希伯来语惯用表达。
