  - severity: low
    issue: “差到你们这里”在此处指向不够自然。
    rationale: 上帝向受话者差遣先知，现代汉语以“差遣……到你们那里”更顺畅，且不改变原文的向格意义。
  - severity: low
    issue: 脚注称该表达“并非着重说明起床的时间”，表述过于排除字面形象。
    rationale: 该惯用语的主要作用确实是表达殷切和持续的反复行动，但仍应承认“早早起来”是原文保留的形象性措辞。
