  text: וְ/שִׁכַּנְתִּ֤י אֶתְ/כֶם֙ בַּ/מָּק֣וֹם הַ/זֶּ֔ה בָּ/אָ֕רֶץ אֲשֶׁ֥ר נָתַ֖תִּי לַ/אֲבֽוֹתֵי/כֶ֑ם לְ/מִן עוֹלָ֖ם וְ/עַד עוֹלָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/007.yaml
  text: then I will let you dwell in this place[b][a], in the land that I gave to your fathers from of old and forever.
translation:
  language: zh_hans
  text: 那么，我就会让你们住在这地方，在我从古时直到永远赐给你们列祖[a]的土地上[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“你们的祖先”。希伯来文直译为“你们的父辈”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文的表达涵盖遥远的过去和无尽的将来；也可译作“从远古直到永远”。
    reason: temporal_ambiguity
lexical_decisions:
- source_word: וְשִׁכַּנְתִּי
  choice: 那么，我就会让你们住
  rationale: שׁכן 的使役式表达“使／让……居住”。结合上文的条件句，“让你们住”自然地保留了准许并维持其居住的含义；不译作“与​​你们同住”，因为希伯来文中的宾语是“你们”。
- source_word: בַּמָּקוֹם הַזֶּה
  choice: 在这地方
  rationale: 直接保留“地方”和近指代词“这”，不把所指范围擅自限定为圣殿、耶路撒冷或犹大。
- source_word: בָּאָרֶץ
  choice: 土地
  rationale: 此处指赐给列祖的特定地域，用“土地”比全球意义的“大地”更准确，也与前面的“地方”有所区分。
- source_word: אֲשֶׁר נָתַתִּי
  choice: 我赐给
  rationale: 用“赐给”自然表达上帝将土地给予列祖；关系从句以“也就是”衔接，使现代汉语清楚流畅。
- source_word: לַאֲבוֹתֵיכֶם
  choice: 你们列祖
  rationale: אָבוֹת 字面为“父辈”，在此指以色列人的历代先祖。“列祖”保留圣经语体和阳性原文形式，同时以脚注提供现代通用说法。
- source_word: לְמִן עוֹלָם וְעַד עוֹלָם
  choice: 从古时直到永远
  rationale: 第一个 עוֹלָם 回指遥远的过去，第二个则朝向无尽的将来；此译保留由远古延伸至未来的时间跨度，又避免“从永恒到永恒”可能带来的过强形而上含义。
theological_decisions:
- issue: 这项应许是否表示无条件且永久占有土地
  choice: 以“那么，我就会……”承接上文条件，表达在悔改顺服情况下继续居住的应许，同时保留土地确已赐给列祖的陈述。
  alternative: 把本节译成不受上文条件约束、无论是否顺服都永久占有土地的绝对应许。
  rationale: 本节在语篇上承接第5—6节的条件要求；译文不应割断这一关系，也不应借翻译裁定更广泛的圣约与土地神学争议。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“那么”明确承接上文条件；“列祖”保留适度的圣经语体，并用脚注解释。标点将“从古时直到永远”作为对整项土地之赐的时间性说明，同时不强行排除它与“赐给”之间的语法联系。
