source:
  edition: WLC
  text: וְ/אַתָּ֞ה אַל תִּתְפַּלֵּ֣ל בְּעַד הָ/עָ֣ם הַ/זֶּ֗ה וְ/אַל תִּשָּׂ֧א בַעֲדָ֛/ם רִנָּ֥ה וּ/תְפִלָּ֖ה וְ/אַל תִּפְגַּע בִּ֑/י כִּי אֵינֶ֥/נִּי שֹׁמֵ֖עַ אֹתָֽ/ךְ־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/016.yaml
  text: But as for you[a], do not pray for this people, and do not lift up a cry or prayer on their behalf, and do not intercede with me[b], for I am not listening to you.
translation:
  language: zh_hans
  text: 至于你，不要为这百姓祷告；也不要为他们扬声呼求或祷告；也不要向我代求[a]，因为我不听你[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “代求”也可译作“恳求我”或“强求我”；希伯来语动词可表示迫切恳求或代求。
    reason: lexical_alternative
  - marker: b
    text: “我不听你”也可译作“我现在不听你”或“我不会听你”；希伯来语分词可突出持续的拒绝，也可在语境中带有将来意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתָּה
  choice: 至于你
  rationale: 连词加独立代词突出对耶利米的转折性直接吩咐；“至于你”自然保留强调。
- source_word: אַל תִּתְפַּלֵּל בְּעַד הָעָם הַזֶּה
  choice: 不要为这百姓祷告
  rationale: אַל加未完成式构成禁令；בְּעַד表示“为、代表”，译文简洁保留代求含义。
- source_word: וְאַל תִּשָּׂא בַעֲדָם רִנָּה וּתְפִלָּה
  choice: 也不要为他们扬声呼求或祈祷
  rationale: נשא字面为“举起”，与呼求和祷告连用时，“扬声”在现代汉语中自然；רִנָּה在此指恳切发出的呼声，而וּ连接两个相近的祷告用语，中文用“或”表达两者均在禁令之内。
- source_word: וְאַל תִּפְגַּע בִּי
  choice: 更不要向我为他们求情
  rationale: פגע的Hiphil在祷告语境中可指恳求、代求，也可带有迫切催求之意；正文以自然的“求情”表达，脚注保留其他语义可能。
- source_word: כִּי אֵינֶנִּי שֹׁמֵעַ אֹתָךְ
  choice: 因为我不会听你
  rationale: 否定词加分词可表达持续的拒绝，也可在语境中呈现将来结果；“不会听你”在中文中兼具坚决拒绝与指向随后祈求的意味。
theological_decisions:
- issue: 禁止耶利米为百姓代求的性质
  choice: 这是在当前审判处境中，上帝直接而严厉地禁止先知为犹大百姓代求
  alternative: 将其理解为夸张的警告，而非真正的禁令
  rationale: 三个אַל禁令连续出现，末句又说明上帝不会听，表明此处确是郑重的禁止；译文不进一步推导其是否适用于其他处境，以保留经文张力。
- issue: 上帝“不听”的时态与含义
  choice: 译作“不会听你”，表达对这项代求的坚决拒绝
  alternative: 译作“现在不听你”或“我不听你”
  rationale: שֹׁמֵעַ是分词，既可突出正在持续的拒绝，也可结合语境理解为对将来祈求的拒绝；正文选择自然中文，脚注保留体貌上的另一译法。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“这百姓”保留先知书中带有审判意味的指称；用“扬声呼求”传达רִנָּה的出声、迫切性质。所有脚注标记均置于正文相应位置。
