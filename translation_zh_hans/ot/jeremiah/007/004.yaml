  text: אַל תִּבְטְח֣וּ לָ/כֶ֔ם אֶל דִּבְרֵ֥י הַ/שֶּׁ֖קֶר לֵ/אמֹ֑ר הֵיכַ֤ל יְהוָה֙ הֵיכַ֣ל יְהוָ֔ה הֵיכַ֥ל יְהוָ֖ה הֵֽמָּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/004.yaml
  text: Do not trust in deceptive words[a], saying, “The temple of Yahweh, the temple of Yahweh[b], the temple of Yahweh are these.”
translation:
  language: zh_hans
  text: 不要倚靠虚谎的话[a]，说：“雅威的殿，雅威的殿，雅威的殿，就是这些！”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“欺骗人的话”。希伯来语既可强调这些话本身虚假，也可强调其欺骗作用。
    reason: lexical_alternative
  - marker: b
    text: 原文直译：“雅威的殿，雅威的殿，雅威的殿，就是这些。”三次重复形成口号，表现百姓把圣殿本身当作安全保障的错误信心。句末“这些”为复数，其所指可能是眼前的圣殿或圣殿建筑群。
    reason: cultural_note
lexical_decisions:
- source_word: אַל תִּבְטְחוּ לָכֶם
  choice: 不要倚靠
  rationale: אַל加未完成式构成禁令；בטח意为信靠、倚赖。לָכֶם带有与主体相关的语气，在现代汉语中无需生硬地另译“为自己”。
- source_word: אֶל דִּבְרֵי הַשֶּׁקֶר
  choice: 欺骗人的话
  rationale: שׁקר既可强调话语虚假，也可强调其欺骗作用；正文采用自然汉语“欺骗人的话”，脚注保留“虚假的话”这一词义侧重。
- source_word: לֵאמֹר
  choice: 说
  rationale: 该不定式引出所倚靠之话的内容，直译为“说”简洁自然。
- source_word: הֵיכַל יְהוָה
  choice: 雅威的殿
  rationale: הֵיכַל在本语境指耶路撒冷圣殿；采用“殿”既准确又符合现代中文圣经语体。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以“雅威”音译四字神名，保留经文中的专名，而不以称号替代。
- source_word: הֵמָּה
  choice: 这是
  rationale: 希伯来语阳性复数代词可指向眼前的圣殿建筑或相关各部分。中文若机械译作“这些是”会晦涩；将指示语前置为“这是”，自然表达众人指着圣殿所喊的口号，同时由脚注说明原文形式。
theological_decisions:
- issue: 三次重复“雅威的殿”
  choice: 完整保留三次重复
  alternative: 合并为一次或改述为“这里有雅威的殿，所以我们安全”
  rationale: 三重重复是经文揭露错误安全感的关键修辞；完整保留可让先知的讽刺和批判自然呈现，而不把隐含意思写入正文。
- issue: 句末 הֵמָּה 的指向与句法
  choice: 译成“这是雅威的殿……”的指示性口号
  alternative: “雅威的殿……就是这些”
  rationale: 原文末尾代词的确切所指略有含混，可能指圣殿本身或其建筑群。中文采用口号式前置指示语以求通顺，脚注保留原文字面次序和可能的复数色彩。
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名；音译“雅威”保留专名性质，不用称号消解它。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“倚靠”适合先知警告的语域；三次重复原样保留。为避免“雅威的殿……就是这些”在中文中异常生硬，正文按汉语口号习惯将指示语前置，脚注交代原文句序及其含混性。
