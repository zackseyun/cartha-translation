  text: כִּֽי עָשׂ֨וּ בְנֵי יְהוּדָ֥ה הָ/רַ֛ע בְּ/עֵינַ֖/י נְאֻום יְהוָ֑ה שָׂ֣מוּ שִׁקּֽוּצֵי/הֶ֗ם בַּ/בַּ֛יִת אֲשֶׁר נִקְרָא שְׁמִ֥/י עָלָ֖י/ו לְ/טַמְּאֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/030.yaml
  text: For the sons of Judah have done what is evil in my sight[a], declares Yahweh. They have put their abominations in the house that is called by my name[c][b], to defile it.
translation:
  language: zh_hans
  text: 因为犹大人做了我眼中看为恶的事；这是雅威的宣告。他们把自己那些可憎之物放在那称为我名下的殿中[a][b]，以玷污它。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “可憎之物”常指令人厌恶的祭祀物件；这里很可能包括偶像。
    reason: lexical_alternative
  - marker: b
    text: “称为我名下的”直译为“我的名被称在其上”；这里所说的殿就是耶路撒冷圣殿。
    reason: lexical_alternative_and_cultural_note
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，为先前所宣告的审判说明缘由，保留希伯来语连接词的解释性作用。
- source_word: בְנֵי יְהוּדָה
  choice: 犹大人
  rationale: 字面为“犹大的众子”，在这里指犹大百姓；“犹大人”是现代汉语中自然、准确且不限定性别的表达。
- source_word: הָרַע בְּעֵינַי
  choice: 我眼中看为恶的事
  rationale: 保留“在我眼中”的希伯来语意象，同时以自然汉语表达上帝的道德判断。
- source_word: נְאֻם יְהוָה
  choice: 雅威宣告说
  rationale: נְאֻם是庄重的先知宣告公式；以“宣告说”传达其分量，并将神名直接译作“雅威”。
- source_word: שִׁקּוּצֵיהֶם
  choice: 自己那些可憎之物
  rationale: 该词常指宗教礼仪中令人憎恶的物件，此处很可能包括偶像；不直接窄化为“偶像”，以保留原词范围。
- source_word: בַּבַּיִת
  choice: 殿中
  rationale: 上下文明确指耶路撒冷圣殿；汉语“殿”既自然又保留其作为敬拜场所的含义。
- source_word: אֲשֶׁר נִקְרָא שְׁמִי עָלָיו
  choice: 称为我名下的
  rationale: 较贴近字面“我的名被称在其上”，表达这殿归属雅威并以他的名为标志。
- source_word: לְטַמְּאוֹ
  choice: 玷污了这殿
  rationale: 不定式可表达目的或结果；此处采用结果性的自然汉语，同时“玷污”兼具礼仪与道德污染之义。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名；音译“雅威”保留其作为以色列之神专名的性质，不以称号代替。
- issue: שִׁקּוּצֵיהֶם 是否明确译为偶像
  choice: 可憎之物
  alternative: 偶像；可憎的偶像
  rationale: 语境很可能涉及偶像，但该词本身范围较广，也可涵盖其他令人憎恶的祭祀物件；译文保留这一语义张力，脚注再作说明。
- issue: לְטַמְּאוֹ 的目的或结果关系
  choice: 结果性表达“玷污了这殿”
  alternative: 为要玷污这殿
  rationale: 希伯来语不定式可表示目的或结果。采用结果性表达可避免断言他们主观上以玷污圣殿为明确目的，同时保留其行为实际造成亵渎的含义。
translation_notes:
  register: 采用庄重而清晰的现代标准汉语。“雅威宣告说”保留先知话语的正式语气；“犹大人”避免生硬照译“犹大的众子”；“殿”在上下文中自然指圣殿。所有脚注标记均置于所说明短语之后。
