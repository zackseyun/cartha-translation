- source_word: הַדָּבָר
  choice: 话
  rationale: 在先知书的启示公式中，指从上帝而来的信息；译作“话”自然、庄重，并与“临到”搭配。
- source_word: הָיָה אֶל
  choice: 临到
  rationale: 保留希伯来语先知启示公式的传统表达，表示这话由上帝主动传达给先知。
- source_word: יִרְמְיָהוּ
  choice: 耶利米
  rationale: 采用现代简体中文圣经传统中通行的人名译法。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文读者熟悉的专名译法，明确对应原文的四字神名。
- source_word: לֵאמֹר
  choice: 说：
  rationale: 直译其引出下文言语的功能，并以冒号自然衔接后续内容。
theological_decisions:
- issue: יְהוָה 的呈现
  choice: 耶和华
  alternative: 主
  rationale: 原文使用的是上帝的专名而非称号 אֲדֹנָי；正文保留专名层面的区别，避免把两者无声合并。
translation_notes:
