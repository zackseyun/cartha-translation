base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/008.yaml
  text: Look[b][a], you are trusting in deceptive words to no benefit.
translation:
  language: zh_hans
  text: 看哪，你们正倚靠虚假的话[a]，结果毫无益处[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“骗人的话”或“谎话”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“全然无用”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: 看哪
  rationale: 这是强调并唤起注意的提示语；“看哪”保留其指示和警醒作用，也符合现代中文庄重的先知性语体。
- source_word: בֹּטְחִים
  choice: 正倚靠
  rationale: 分词表达正在持续或一贯发生的行为；“正倚靠”既体现这一层面，也自然表达把信心寄托于某事。
- source_word: לָכֶם
  choice: 不另行明译
  rationale: 这里的与格代词与“倚靠”紧密相连，带有涉及自身的语感；中文若硬译为“为自己”会显得生涩，并可能加入原文未明确表达的目的意味。
- source_word: עַל
  choice: 倚靠
  rationale: 该介词与 בטח 连用表示信赖、依靠的对象；中文可自然融入动词“倚靠”的及物结构，无须另译。
- source_word: דִּבְרֵי הַשָּׁקֶר
  choice: 虚假的话
  rationale: 该短语指带有虚假性质的话；“虚假的话”保留范围上的开放性，既可指谎话，也可指具有欺骗性的言辞。
- source_word: לְבִלְתִּי הוֹעִיל
  choice: 结果毫无益处
  rationale: 这一否定不定式结构表达不能带来益处的结果；此译避免把“话”明确设为“使人获益”的语法主语，同时保持中文顺畅。
