  text: וְ/הִשְׁבַּתִּ֣י מֵ/עָרֵ֣י יְהוּדָ֗ה וּ/מֵֽ/חֻצוֹת֙ יְר֣וּשָׁלִַ֔ם ק֤וֹל שָׂשׂוֹן֙ וְ/ק֣וֹל שִׂמְחָ֔ה ק֥וֹל חָתָ֖ן וְ/ק֣וֹל כַּלָּ֑ה כִּ֥י לְ/חָרְבָּ֖ה תִּהְיֶ֥ה הָ/אָֽרֶץ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/034.yaml
  text: And I will put an end[a], from the cities of Judah and from the streets of Jerusalem, to the sound of joy and the sound of gladness, the voice of the bridegroom and the voice of the bride[c][b], for the land will become a ruin.
translation:
  language: zh_hans
  text: 我要使犹大各城和耶路撒冷街道[a]上欢喜的声音、快乐的声音、新郎的声音和新娘的声音都止息，因为这地必成为废墟[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“广场”或“公共场所”。希伯来词可指街道或公共场所。
    reason: lexical_alternative
  - marker: b
    text: 或译：“因为这地必荒凉。”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִשְׁבַּתִּי
  choice: 我要使……都止息
  rationale: 该词是 שׁבת 的使役式，明确表达上帝主动使这些声音停止；“使……止息”既保留使役含义，也符合庄重的现代汉语。
- source_word: מֵעָרֵי יְהוּדָה
  choice: 犹大各城
  rationale: מִן 表示声音被从这些地方除去；汉语借助“上……都止息”自然表达其来源和范围，无须机械译出“从”。
- source_word: וּמֵחֻצוֹת יְרוּשָׁלִַם
  choice: 耶路撒冷街市上
  rationale: חֻצוֹת 可指街道或公共广场；“街市”能够涵盖城市中的街道和公共活动场所，脚注保留其他可能。
- source_word: קוֹל שָׂשׂוֹן וְקוֹל שִׂמְחָה
  choice: 欢喜快乐的声音
  rationale: 两个近义名词分别表达欢欣与喜乐。合译为常用的并列短语“欢喜快乐”，同时用“声音”保留反复出现的 קוֹל 和节庆声响的意象。
- source_word: קוֹל חָתָן וְקוֹל כַּלָּה
  choice: 新郎和新娘的声音
  rationale: 直译婚礼场景中的固定配对，保留人声以及婚庆生活将要消失的具体意象。
- source_word: כִּי
  choice: 因为
  rationale: 在此引出喜乐声止息的原因。
- source_word: לְחָרְבָּה תִּהְיֶה הָאָרֶץ
  choice: 这地必成为废墟
  rationale: היה 与 לְ 加名词表达成为某种状态；“成为废墟”保留变化和毁坏的具体力度，“这地”按语境指受审判之地。
theological_decisions:
- issue: 审判中的神圣行动主体
  choice: “我要使……都止息”明确保留上帝第一人称的主动作为
  alternative: 译成非人格性的“欢喜的声音将要止息”
  rationale: 希伯来文第一人称使役动词明确以上帝为行动主体，不应弱化为自然发生的结果。
- issue: 土地遭毁坏的程度与表达
  choice: “这地必成为废墟”
  alternative: “这地必荒凉”
  rationale: לְחָרְבָּה 是名词性表达，既可强调荒凉状态，也可呈现遭毁后的废墟；正文选择较具体的“废墟”，脚注保留“荒凉”的译法。
translation_notes:
  register: 采用庄重而通顺的现代标准普通话。“使……都止息”保持先知审判宣告的力度；“欢喜快乐”自然呈现希伯来文近义并列；脚注仅用于保留确有根据的词义幅度。
