source:
  edition: WLC
  text: כִּ֣י אִֽם אֶת הַ/דָּבָ֣ר הַ֠/זֶּה צִוִּ֨יתִי אוֹתָ֤/ם לֵ/אמֹר֙ שִׁמְע֣וּ בְ/קוֹלִ֔/י וְ/הָיִ֤יתִי לָ/כֶם֙ לֵֽ/אלֹהִ֔ים וְ/אַתֶּ֖ם תִּֽהְיוּ לִ֣/י לְ/עָ֑ם וַ/הֲלַכְתֶּ֗ם בְּ/כָל הַ/דֶּ֨רֶךְ֙ אֲשֶׁ֣ר אֲצַוֶּ֣ה אֶתְ/כֶ֔ם לְמַ֖עַן יִיטַ֥ב לָ/כֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/023.yaml
  text: 'But this command I gave them: ‘Listen to my voice[a], and I will be your God, and you shall be my people; and walk in all the way that I command you, so that it may go well with you.’'
translation:
  language: zh_hans
  text: 但我只吩咐他们这件事：‘你们要听我的声音[a]，我就作你们的上帝，你们也要作我的子民；你们要行在我所吩咐你们的一切道路上，好使你们得福。’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“听我的声音”；这个希伯来语说法通常也含有服从、遵行的意思。
    reason: 说明原文的字面意象及其惯用的顺服含义。
lexical_decisions:
- source_word: כִּי אִם
  choice: 但
  rationale: 承接第22节的否定并引出对比性的正面说明；“但”自然表达“不是前者，而是后者”的转折。
- source_word: הַדָּבָר הַזֶּה צִוִּיתִי אוֹתָם לֵאמֹר
  choice: 我吩咐他们的是这件事
  rationale: 保留 דָּבָר 的“事／话”宽泛性，同时由“吩咐”明确其命令语境；中文无需重复译作“我吩咐他们这命令说”。
- source_word: שִׁמְעוּ בְקוֹלִי
  choice: 听从我的声音
  rationale: “声音”保留希伯来语意象，“听从”则自然传达该盟约语境中听见并服从的惯用含义；脚注注明较直译的可能。
- source_word: וְהָיִיתִי לָכֶם לֵאלֹהִים
  choice: 我就作你们的上帝
  rationale: 自然呈现标准的盟约关系公式，不把它改写为抽象的本体陈述。
- source_word: וְאַתֶּם תִּהְיוּ לִי לְעָם
  choice: 你们也要作我的子民
  rationale: 与前句形成对应，保留盟约关系及郑重语气。
- source_word: וַהֲלַכְתֶּם בְּכָל הַדֶּרֶךְ
  choice: 你们要行在……一切道路上
  rationale: 保留“行走／道路”的伦理生活隐喻，并用“一切”表达 כָּל 的全面范围；中文采用复数“道路”较自然。
- source_word: אֲשֶׁר אֲצַוֶּה אֶתְכֶם
  choice: 我所吩咐你们的
  rationale: 未完成式在此可表达持续或概括性的命令；“所吩咐”在中文中不强行限定为现在或将来。
- source_word: לְמַעַן יִיטַב לָכֶם
  choice: 好使你们得福
  rationale: יִיטַב לָכֶם 是“使你们境况良好”的惯用语；“得福”简洁自然地表达福祉与顺遂，同时保留 לְמַעַן 的目的意味。
theological_decisions:
- issue: 盟约公式的译法
  choice: 我就作你们的上帝，你们也要作我的子民
  alternative: 我对你们作上帝，你们对我作子民
  rationale: 所表达的是上帝与子民之间的盟约关系；采用现代中文中清楚而庄重的固定表达，不增添经文以外的教义内容。
- issue: שִׁמְעוּ בְקוֹלִי 中听与顺服的关系
  choice: 听从我的声音
  alternative: 听我的声音
  rationale: 该希伯来语惯用语在此命令与盟约语境中包含服从的意味。“听从”在中文中可同时承载聆听与遵行，脚注则保留其字面形式。
- issue: 福祉语句的力度
  choice: 好使你们得福
  alternative: 好使你们凡事顺利
  rationale: 原文泛指处境良好，并不具体限定为物质成功；“得福”保留广义福祉，避免把应许窄化为世俗顺利。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。保留盟约公式以及“行在道路上”的圣经意象；引语内用分号呈现盟约关系与行为要求之间的结构。
