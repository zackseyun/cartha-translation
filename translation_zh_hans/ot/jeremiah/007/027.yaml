base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/027.yaml
  text: You shall speak all these words to them[a], but they will not listen to you; you shall call to them, but they will not answer you.
translation:
  language: zh_hans
  text: 你要向他们说这一切话，他们却不听你[a]；你要呼唤他们，他们却不回答你。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们却不听见你”或“他们却不听从你”。希伯来语动词 שׁמע 可按语境表示听见、听取或听从。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְדִבַּרְתָּ אֲלֵיהֶם
  choice: 你要……告诉他们
  rationale: 动词为第二人称单数完成式，带连接词，在先知受命的语境中表达将要执行的指示。“告诉他们”自然体现向特定对象说话；宾语“一切话”仍明确保留宣告内容。
- source_word: אֵת כָּל הַדְּבָרִים הָאֵלֶּה
  choice: 这一切话
  rationale: דְּבָרִים 可指“话”或“事情”；此处是先知传达信息的语境，译作“话”最贴切，也保留其言语性质。
- source_word: וְלֹא יִשְׁמְעוּ אֵלֶיךָ
  choice: 他们却不听你
  rationale: שׁמע 与 אֶל 连用可表示听、听从或理会。“不听你”在现代汉语中既保留听取的基本意义，也容纳拒绝听从的含义；“却”自然表达上下文中的转折。
- source_word: וְקָרָאתָ אֲלֵיהֶם
  choice: 你要呼唤他们
  rationale: קרא 在此表示向某人呼叫。“呼唤”保留直接呼叫的意味，又不额外限定为正式宣告或高声喊叫。
- source_word: וְלֹא יַעֲנוּכָה
  choice: 他们却不回应你
  rationale: ענה 的基本义为回答、回应。“回应你”适合“呼唤”的语境，并清楚表达原文第二人称宾语后缀。
