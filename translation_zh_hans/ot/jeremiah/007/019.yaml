  to: “他们惹怒的，是我吗？”雅威宣告，“岂不是他们自己，使自己脸上蒙羞吗？”
  rationale: 修订仅改善现代汉语句法与语气：首句以‘是我吗’明确前置宾语，后句以‘使’承接希伯来文省略的动作。两个反问、‘我／他们自己’的对照、雅威之名及‘脸上蒙羞’的意象均予保留。脚注继续标示反身性表达的较意译读法。
