  text: הַ/אֹתִ֛/י הֵ֥ם מַכְעִסִ֖ים נְאֻם יְהוָ֑ה הֲ/ל֣וֹא אֹתָ֔/ם לְמַ֖עַן בֹּ֥שֶׁת פְּנֵי/הֶֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/019.yaml
  text: Is it I whom they are provoking? declares Yahweh. Is it not themselves[a], to the shame of their own faces?
translation:
  language: zh_hans
  text: “他们惹怒的，是我吗？”雅威宣告，“岂不是他们自己，使自己脸上蒙羞吗？”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַאֹתִי
  choice: 真是我吗
  rationale: 疑问词与前置的第一人称宾语构成强调性的反问；“真是我吗”既保留宾语焦点，也符合现代汉语表达。
- source_word: מַכְעִסִים
  choice: 惹怒
  rationale: כעס 的使役形在此表示“激怒、惹怒”；该译法自然，并保留行为指向对象的含义。
- source_word: נְאֻם יְהוָה
  choice: 雅威宣告
  rationale: 保留先知话语中庄重的宣告公式，并将四字神名按专名译为“雅威”。
- source_word: הֲלוֹא אֹתָם
  choice: 岂不是他们自己
  rationale: הֲלוֹא 引出预期肯定回答的反问；אֹתָם 字面为“他们”，在与“我”对照的语境中用反身表达“他们自己”最为清楚。
- source_word: לְמַעַן
  choice: 以致
  rationale: 此处可表示行为产生的结果；“以致”使后半句与前面的自害含义自然衔接，同时不将其限定为主观目的。
- source_word: בֹּשֶׁת פְּנֵיהֶם
  choice: 自己脸上蒙羞
  rationale: 既保留“脸”的具体意象，也用现代汉语“脸上蒙羞”表达公开受辱、满面羞愧的含义。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用以色列上帝的专名；音译“雅威”保留其作为圣约之名的性质，而不以“主”这一称号代替。
- issue: 反问是否表示人的行为伤害自身而非上帝
  choice: 保留两个相对的反问，不另加解释
  alternative: 意译为“他们不是在惹祸上身吗”
  rationale: 原文以“我”与“他们”形成张力，强调悖逆最终使他们自己蒙羞；直译式反问可保留这一神学张力，避免扩写为上帝完全不受冒犯等原文未明说的命题。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。以引号呈现雅威的直接话语；保留两个反问的对称结构及“脸上蒙羞”的希伯来语意象。
