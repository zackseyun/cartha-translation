source:
  edition: WLC
  text: כֹּֽה אָמַ֞ר יְהוָ֤ה צְבָאוֹת֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל הֵיטִ֥יבוּ דַרְכֵי/כֶ֖ם וּ/מַֽעַלְלֵי/כֶ֑ם וַ/אֲשַׁכְּנָ֣ה אֶתְ/כֶ֔ם בַּ/מָּק֥וֹם הַ/זֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/003.yaml
  text: 'Thus says Yahweh of hosts[a], the God of Israel: Make your ways and your deeds good[b], and I will let you dwell in this place.'
translation:
  language: zh_hans
  text: 万军之雅威——以色列的上帝如此说：“你们要改正自己的道路和行为[a]，我就让你们住在这地方[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“使你们的道路和行为变好。”
    reason: 原文动词字面含义为“使……变好”，在这里要求人切实改变生活方式和所作所为。
  - marker: b
    text: 或译：“我就使你们住在这地方”，又或：“我就让你们继续留在这地方。”
    reason: 原文使役动词既可强调使人居住，也可在本语境中表示准许人继续居留。
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: 如此说
  rationale: 保留先知传递神谕的固定公式及庄重语气，同时符合现代汉语表达。
- source_word: יְהוָה צְבָאוֹת
  choice: 万军之雅威
  rationale: 将四字神名音译为“雅威”，并以“万军”保留צְבָאוֹת所表达的广阔统御与军旅意象，不将其窄化为地上的军队。
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: 以色列的上帝
  rationale: 直接呈现原文的领属结构和身份说明。
- source_word: הֵיטִיבוּ דַרְכֵיכֶם וּמַעַלְלֵיכֶם
  choice: 你们要改正自己的道路和行为
  rationale: “改正”自然表达Hiphil命令式所要求的主动革新；“道路”保留生活方式的希伯来语隐喻，“行为”则指具体所作之事。
- source_word: וַאֲשַׁכְּנָה אֶתְכֶם
  choice: 我就让你们住
  rationale: 在悔改与继续居住的语境中，“让……住”可表达准许继续居留，同时不排除使之居住的使役含义；其他可能含义列入脚注。
- source_word: בַּמָּקוֹם הַזֶּה
  choice: 在这地方
  rationale: 保留מָקוֹם的宽泛所指，使其仍可涵盖圣殿区域、耶路撒冷或更广的土地，不擅自限定。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 采用较直接反映YHWH读音的现代汉语音译，将其作为专名呈现，而不以“主”等称号替代。
- issue: וַאֲשַׁכְּנָה אֶתְכֶם在盟约警告语境中的含义
  choice: 我就让你们住
  alternative: 我就使你们住；我就让你们继续留在
  rationale: 正文保留神准许百姓居住与神使百姓居住之间的张力；脚注说明使役和继续居留两种可能，不将其单一化。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“万军之雅威”保留神圣称号的正式感；破折号将“以色列的上帝”清楚标作同位说明。正文中的[a]、[b]与脚注逐一对应，并纠正咨询层中脚注标记与内容错位的问题。
