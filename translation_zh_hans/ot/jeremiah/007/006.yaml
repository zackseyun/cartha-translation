id: JER.7.6
reference: Jeremiah 7:6
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: גֵּ֣ר יָת֤וֹם וְ/אַלְמָנָה֙ לֹ֣א תַֽעֲשֹׁ֔קוּ וְ/דָ֣ם נָקִ֔י אַֽל תִּשְׁפְּכ֖וּ בַּ/מָּק֣וֹם הַ/זֶּ֑ה וְ/אַחֲרֵ֨י אֱלֹהִ֧ים אֲחֵרִ֛ים לֹ֥א תֵלְכ֖וּ לְ/רַ֥ע לָ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/006.yaml
  text: Do not oppress the foreigner[a], the fatherless, and the widow; do not shed innocent blood in this place[c][b]; and do not go after other gods to your own harm.
translation:
  language: zh_hans
  text: 不可欺压寄居者[a]、孤儿[b]和寡妇；不可在这地方流无辜人的血；也不可随从[c]别神，使自己受害。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “寄居者”也可译作“外来居民”，指住在当地却没有本地宗族保障的人。
    reason: lexical_alternative
  - marker: b
    text: “孤儿”原文具体指失去父亲的人。
    reason: lexical_clarification
  - marker: c
    text: “随从”原文直译为“走在……后面”。
    reason: lexical_clarification
lexical_decisions:
- source_word: גֵּר
  choice: 寄居者
  rationale: 指住在以色列人中间、没有本地宗族保障的外来居民；“寄居者”既保留其居住状态，也体现其易受欺压的社会处境。
- source_word: יָתוֹם
  choice: 孤儿
  rationale: 本词特指失去父亲、因而缺少家庭保护的人；现代汉语以“孤儿”表达最自然，具体语义另以脚注说明。
- source_word: אַלְמָנָה
  choice: 寡妇
  rationale: 准确、自然地表达失去丈夫的妇女这一社会群体。
- source_word: תַעֲשֹׁקוּ
  choice: 欺压
  rationale: עָשַׁק在此指倚势压迫或剥削弱势者；“欺压”兼具社会与道德层面的力度。
- source_word: דָם נָקִי
  choice: 无辜人的血
  rationale: 这是指不公正杀害的固定表达；译出“人”使现代汉语自然，并保留法律和道德含义。
- source_word: תִּשְׁפְּכוּ
  choice: 流
  rationale: 与“血”搭配时意为使人流血、杀害；“流……的血”是庄重而自然的汉语表达。
- source_word: בַּמָּקוֹם הַזֶּה
  choice: 在这地方
  rationale: 直接保留指示语气，与耶利米在圣殿讲论的现场背景相合。
- source_word: אַחֲרֵי ... לֹא תֵלְכוּ
  choice: 不可随从
  rationale: 希伯来语字面为“不可走在……后面”，在此表示追随和效忠；“随从”自然地传达该惯用义，同时由脚注保留其字面意象。
- source_word: אֱלֹהִים אֲחֵרִים
  choice: 别神
  rationale: 简洁、准确地表达“其他的神”，不额外加入“外邦”等原文未明说的民族含义。
- source_word: לְרַע לָכֶם
  choice: 使自己受害
  rationale: 表达这种行为最终对听众自身造成损害；避免把רַע在此过度具体化为某一种灾祸。
theological_decisions:
- issue: 弱势群体三项并列的保留
  choice: 寄居者、孤儿和寡妇
  alternative: 弱势的人
  rationale: 保留盟约伦理中明确列出的三类人，不把他们概括成泛称，以免失去原文具体的社会关怀。
- issue: 随从别神所带来之害的表达
  choice: 使自己受害
  alternative: 给自己招来灾祸
  rationale: 原文לְרַע לָכֶם明确指出对听众自身有害，却未具体说明损害如何发生；采用较宽泛的表达，以保留因果方式上的开放性。
translation_notes:
  register: 采用现代、庄重而易懂的命令句式。“不可”保持先知宣告的严肃语气；三个分句以分号连接，清楚呈现原文并列的禁令。
