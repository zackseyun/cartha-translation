  to: 然后你们来到我面前，站在这座奉我名而称的殿[a]中，说：“我们获救了！[b]”——好让你们做这一切可憎之事。
  rationale: 修订去除了原文未明示的反问句式，以“好让你们……”保留目的结构及上下文中尖锐的讽刺。并将不自然的“称为我名下”改为“奉我名而称”，将“得救了”调整为较中性的“获救了”；脚注继续提供“得救了”和“安全了”的可行译法。
