source:
  edition: WLC
  text: וּ/בָאתֶ֞ם וַ/עֲמַדְתֶּ֣ם לְ/פָנַ֗/י בַּ/בַּ֤יִת הַ/זֶּה֙ אֲשֶׁ֣ר נִקְרָא שְׁמִ֣/י עָלָ֔י/ו וַ/אֲמַרְתֶּ֖ם נִצַּ֑לְנוּ לְמַ֣עַן עֲשׂ֔וֹת אֵ֥ת כָּל הַ/תּוֹעֵב֖וֹת הָ/אֵֽלֶּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/010.yaml
  text: Then you come and stand before me in this house[a], which is called by my name, and say[b], ‘We are delivered!’—so that you may do all these abominations.
translation:
  language: zh_hans
  text: 然后你们来到我面前，站在这座奉我名而称的殿[a]中，说：“我们获救了！[b]”——好让你们做这一切可憎之事。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译“这房屋”。这里指圣殿。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“我们得救了！”或“我们安全了！”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָאתֶם
  choice: 然后你们来到
  rationale: 承接上文的指控次序；用现代汉语现在时式的叙述保持先知话语的现场感。
- source_word: וַעֲמַדְתֶּם לְפָנַי
  choice: 站在我面前
  rationale: 直接表达“站立在某人面前、来到其临在中”的常见搭配。
- source_word: בַּבַּיִת הַזֶּה
  choice: 在这殿中
  rationale: בַּיִת字面为“房屋”，但此处明确指耶路撒冷圣殿；正文用自然清楚的“殿”，脚注保留字面形式。
- source_word: אֲשֶׁר נִקְרָא שְׁמִי עָלָיו
  choice: 这称为我名下的
  rationale: 保留希伯来语“名被称在其上”的归属表达，同时使现代汉语可懂。
- source_word: נִצַּלְנוּ
  choice: 我们得救了
  rationale: 该尼法勒完成式表示已经获救、脱险；“得救了”兼具获救与自以为安全的语气，而脚注提示其他可能理解。
- source_word: לְמַעַן עֲשׂוֹת
  choice: 难道是为了行
  rationale: לְמַעַן引出目的或结果，语境带强烈反讽；汉语反问能自然呈现这种责斥，同时不添加持续体意义。
- source_word: כָּל הַתּוֹעֵבוֹת הָאֵלֶּה
  choice: 这一切可憎之事
  rationale: “可憎之事”保持 תּוֹעֵבוֹת 的强烈道德和敬拜层面评价，又比“所有这些憎恶”更符合现代汉语。
theological_decisions:
- issue: 圣殿称谓
  choice: 殿
  alternative: 房屋
  rationale: 原文用“房屋”，实际所指是圣殿。正文优先采用现代汉语中明确自然的“殿”，并以脚注保存原文字面及“这座房屋”的神学意象。
- issue: נִצַּלְנוּ的语力
  choice: 我们得救了
  alternative: 我们脱险了／我们安全了
  rationale: 说话者宣称自己已获拯救或免遭灾祸；正文不限定究竟强调获救还是安全，脚注列出两种语境上成立的理解。
- issue: לְמַעַן所表达的反讽目的
  choice: 难道是为了行……吗
  alternative: 好让你们行……
  rationale: 原文形式上可直译为目的句，但语境是责问与讽刺。反问表达不把这种荒谬目的当作上帝认可的目的，也保留先知指控的张力。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“称为我名下”略带经文风格，以保存原文关于上帝之名与圣殿归属的表达；破折号与反问突出原句尖锐的讽刺责斥。
