  text: וַ/יַּ֥עַשׂ הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה כְּ/כֹ֥ל אֲשֶׁר עָשָׂ֖ה יְהוֹיָקִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/052/002.yaml
  text: And he did what was evil in the eyes of Yahweh[a], according to all that Jehoiakim had done.
translation:
  language: zh_hans
  text: 他做了雅威眼中看为恶的事[a]，完全照着约雅敬所行的一切。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “雅威眼中”是希伯来语的惯用表达，意思是“在雅威看来”。
    reason: 说明原文评价性惯用语，同时保留正文中的希伯来语意象。
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: 他行
  rationale: 以简洁的叙事表达承接上文；“行”也自然搭配道德行为。
- source_word: הָרַע
  choice: 看为恶的事
  rationale: 将希伯来语“行那恶”按现代汉语习惯译出，同时保留其道德评价。
- source_word: בְּעֵינֵי
  choice: 眼中看为
  rationale: 保留希伯来语“在……眼中”的评价性意象，又使中文句法自然。
- source_word: יְהוָה
  choice: 雅威
  rationale: 音译四字神名，保留其作为以色列之神专名的性质，不以称号替代。
- source_word: כְּכֹל אֲשֶׁר עָשָׂה
  choice: 凡……所行的，他都照样行
  rationale: 准确表达 כְּכֹל 所含的全面比较与效法关系，并以自然中文补出隐含的谓语。
- source_word: יְהוֹיָקִים
  choice: 约雅敬
  rationale: 采用现代中文圣经人名的通行译法。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文使用神的专名；“雅威”直接音译该名，避免以称号代替，也不对经文加入额外的宗派性解释。
- issue: “在雅威眼中”的评价含义
  choice: 保留“眼中”意象，并译作“眼中看为恶”
  alternative: 雅威视为恶；在雅威面前作恶
  rationale: 原文强调行为在雅威看来是恶的；保留身体意象，同时避免把它改写成仅指空间上的“面前”。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“凡……都……”清楚传达原文的全面比较；分号使两部分关系明确。
