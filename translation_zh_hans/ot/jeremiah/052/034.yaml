base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/052/034.yaml
  text: And his allowance[a], a continual allowance, was given to him from the king of Babylon, a daily portion day by day, until the day of his death, all the days of his life.
translation:
  language: zh_hans
  text: 至于他的供给[a]，即持续的供给，是巴比伦王赐给他的；每天按日供给一份，直到他死的那一天，终其一生。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “供给”也可译作“口粮”“给养”或“份额”（希伯来文：אֲרֻחָה）。这里指王指定给约雅斤、用以维持生活的供应。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲרֻחָה / אֲרֻחָתוֹ
  choice: 供给
  rationale: 此处指王为约雅斤指定的日常生活给养，不只是泛指一餐。“供给”既能表达所分配的维持生活之物，也适合现代汉语语境。
- source_word: תָּמִיד
  choice: 持续的
  rationale: 表达长期不断、经常维持的性质；与重复出现的“供给”搭配，保留原文的强调。
- source_word: נִתְּנָה
  choice: 赐给
  rationale: 保留 נתן 被动式所表达的给予关系；因施予者是君王，用“赐给”自然且庄重。
- source_word: מֵאֵת מֶלֶךְ בָּבֶל
  choice: 由巴比伦王
  rationale: מֵאֵת 表明供给的来源；汉语被动语境中“由巴比伦王赐给”同时清楚表达来源与施予者。
- source_word: דְּבַר יוֹם בְּיוֹמוֹ
  choice: 每日所需的份额，按日供给
  rationale: 该习语指每天指定或应得的分量。“每日所需的份额”表达内容，“按日供给”保留原文逐日分配的重复意味。
- source_word: עַד יוֹם מוֹתוֹ
  choice: 直到他死的那一天
  rationale: 对应原文完整结构，保留“日”这一名词及其庄重节奏，而不简化为“直到他死”。
- source_word: כֹּל יְמֵי חַיָּיו
  choice: 终其一生
  rationale: 自然凝练地表达“他一生所有的日子”，并与前面的死亡期限形成符合现代汉语的收束。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。保留原文两次使用 אֲרֻחָה 所形成的强调，并以“每日……按日……”再现希伯来文的逐日分配意味；末句“终其一生”避免生硬重复，同时保留全生命周期的范围。
