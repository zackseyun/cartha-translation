  rationale: 该词本义可指“生命、性命”，在人数统计中用作计数人的单位；现代中文直接译“人”最自然。
- source_word: שְׁמֹנֶה מֵאוֹת שְׁלֹשִׁים וּשְׁנָיִם
  choice: '832'
  rationale: 原文为800加30加2；统计清单中用阿拉伯数字清楚简明。
- source_word: '[implicit deportation verb from context]'
  choice: 掳走了
  rationale: 本节希伯来文是承接28节动词的省略句；为使中文句子完整，按上下文补出“掳走了”。
