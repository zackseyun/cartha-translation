  text: וַ/תִּבָּקַ֣ע הָ/עִ֗יר וְ/כָל אַנְשֵׁ֣י הַ/מִּלְחָמָ֡ה יִבְרְחוּ֩ וַ/יֵּצְא֨וּ מֵ/הָ/עִ֜יר לַ֗יְלָה דֶּ֜רֶךְ שַׁ֤עַר בֵּין הַ/חֹמֹתַ֨יִם֙ אֲשֶׁר֙ עַל גַּ֣ן הַ/מֶּ֔לֶךְ וְ/כַשְׂדִּ֥ים עַל הָ/עִ֖יר סָבִ֑יב וַ/יֵּלְכ֖וּ דֶּ֥רֶךְ הָ/עֲרָבָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/052/007.yaml
  text: Then the city was breached[a], and all the men of war fled and went out of the city by night by way of the gate between the two walls, which was by the king’s garden, while the Chaldeans were all around the city[c][b]; and they went by way of the Arabah.
translation:
  language: zh_hans
  text: 城被攻破，所有战士都逃走，趁夜从城中出来，经过两道城墙之间、靠近王家花园的门；当时迦勒底人[a]正四面围着那城。他们沿着亚拉巴[b]的路而去。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “迦勒底人”是希伯来文所用的族称，在这里指巴比伦的军队。
    reason: cultural_note
  - marker: b
    text: “亚拉巴”指约旦河谷地带；有些译本译作“平原”。
    reason: cultural_note
lexical_decisions:
- source_word: וַתִּבָּקַע הָעִיר
  choice: 城被攻破了
  rationale: נבקע为尼法勒式，在围城语境中表示城防被突破；现代汉语以“城被攻破”自然表达这一被动事件，而不把“城”误解为物理上裂开。
- source_word: אַנְשֵׁי הַמִּלְחָמָה
  choice: 战士
  rationale: 直译为“战争之人”；“战士”简洁保留其军事身份，比泛称“众人”准确，也比“军人”更适合古代叙事。
- source_word: יִבְרְחוּ וַיֵּצְאוּ מֵהָעִיר לַיְלָה
  choice: 都逃跑，趁夜从城里出去
  rationale: 未完成式יִבְרְחוּ在叙事序列中指过去发生的逃亡；לַיְלָה在此表示借夜色行动，译作“趁夜”符合语境。
- source_word: דֶּרֶךְ שַׁעַר בֵּין הַחֹמֹתַיִם
  choice: 从……两道城墙之间的门出城
  rationale: דֶּרֶךְ在此标示经过的路线；הַחֹמֹתַיִם为双数，明确译出“两道城墙”。
- source_word: אֲשֶׁר עַל גַּן הַמֶּלֶךְ
  choice: 王家花园旁边
  rationale: 介词עַל在此为邻近的方位用法，不宜机械译为“在……上面”；“王家花园”是自然且庄重的现代汉语。
- source_word: וְכַשְׂדִּים עַל הָעִיר סָבִיב
  choice: 当时迦勒底人正四面包围着城
  rationale: 该无动词分句交代逃亡时的背景状态；“当时……正……”体现其伴随情形，סָבִיב译为“四面”。
- source_word: וַיֵּלְכוּ דֶּרֶךְ הָעֲרָבָה
  choice: 他们沿着通往亚拉巴的路逃去
  rationale: דֶּרֶךְ可指所走的路线；结合前文逃亡语境补出“逃去”使汉语衔接自然。“亚拉巴”保留特定地理名称，不泛化为普通的“平原”。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。以短句理清逃亡路线和围城背景；保留“迦勒底人”和“亚拉巴”等历史地理称谓，并用脚注说明。未沿用英文咨询文本中与其标注位置及希伯来正文不相符的脚注a，因为原文此处清楚陈述城被攻破，并无“从两墙之间的门出去”作为该短语的词汇异读。
