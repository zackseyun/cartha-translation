revisions:
- from: 城被攻破了，所有战士都逃跑，趁夜从城里出去。他们从王家花园旁边、两道城墙之间的门出城；当时迦勒底人[a]正四面包围着城。他们沿着通往亚拉巴[b]的路逃去。
  to: 城被攻破，所有战士都逃走，趁夜从城中出来，经过两道城墙之间、靠近王家花园的门；当时迦勒底人[a]正四面围着那城。他们沿着亚拉巴[b]的路而去。
  rationale: 修订仅改善汉语句法和路线表达的精确度：将门的位置说明后置并明确修饰“门”，以“沿着亚拉巴的路而去”贴近原文的路线结构。保留原稿的历史族名、地名和脚注说明；不采纳英文审计文本中不适用于汉语的“经由该门”词汇异读脚注。
