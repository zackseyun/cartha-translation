  naturalness: 原句“巴比伦王以未米罗达登基的那一年，他……”中“他”的所指及时间短语的修饰关系略显滞涩。“巴比伦王以未米罗达在位的第一年，使……”句法清楚、庄重且符合现代汉语叙事表达。“使约雅斤抬头”也比“抬起约雅斤的头”更自然。
