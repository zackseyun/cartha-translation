source:
  edition: WLC
  text: וַ/יְהִי֩ בִ/שְׁלֹשִׁ֨ים וָ/שֶׁ֜בַע שָׁנָ֗ה לְ/גָלוּת֙ יְהוֹיָכִ֣ן מֶֽלֶךְ יְהוּדָ֔ה בִּ/שְׁנֵ֤ים עָשָׂר֙ חֹ֔דֶשׁ בְּ/עֶשְׂרִ֥ים וַ/חֲמִשָּׁ֖ה לַ/חֹ֑דֶשׁ נָשָׂ֡א אֱוִ֣יל מְרֹדַךְ֩ מֶ֨לֶךְ בָּבֶ֜ל בִּ/שְׁנַ֣ת מַלְכֻת֗/וֹ אֶת רֹאשׁ֙ יְהוֹיָכִ֣ין מֶֽלֶךְ יְהוּדָ֔ה וַ/יֹּצֵ֥א אוֹת֖/וֹ מִ/בֵּ֥ית ה/כליא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/052/031.yaml
  text: And it happened in the thirty-seventh year of the exile of Jehoiachin king of Judah[a], in the twelfth month, on the twenty-fifth day of the month, that Evil-merodach king of Babylon, in the first year of his reign[b], lifted up the head of Jehoiachin king of Judah and brought him out from the prison.
translation:
  language: zh_hans
  text: 犹大王约雅斤被掳第三十七年，十二月二十五日，巴比伦王以未米罗达[b]在位的第一年，使犹大王约雅斤抬头[a]，把他从监牢中带出来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “使……抬头”是希伯来语习语，可指向他施恩或提升、恢复他的地位。
    reason: lexical_alternative
  - marker: b
    text: “以未米罗达”在历史资料中也称“阿梅尔—马尔杜克”（Amel-Marduk）。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי
  choice: （以时间状语直接起句）
  rationale: 该叙事连接形式在此引入新事件；现代汉语不必机械译成“事情发生了”，直接用日期起句更自然，并保留叙事推进功能。
- source_word: לְגָלוּת
  choice: 被掳后
  rationale: 此词指约雅斤遭放逐、被迁离本土的状态或时期；“被掳后”符合本节纪年方式，也贴近常用圣经汉语。
- source_word: יְהוֹיָכִין
  choice: 约雅斤
  rationale: 采用现代中文圣经中通行的人名音译。
- source_word: בִּשְׁנֵים עָשָׂר חֹדֶשׁ
  choice: 十二月
  rationale: 按现代汉语日期表达自然翻译希伯来文的月份公式。
- source_word: בְּעֶשְׂרִים וַחֲמִשָּׁה לַחֹדֶשׁ
  choice: 二十五日
  rationale: 在“十二月”之后省去重复的“本月”，形成自然、明确的中文日期。
- source_word: אֱוִיל מְרֹדַךְ
  choice: 以未米罗达
  rationale: 采用中文圣经传统中较通行的音译；其阿卡德语名的历史形式另见脚注。
- source_word: בִּשְׁנַת מַלְכֻתוֹ
  choice: 登基的那一年
  rationale: 该短语指他开始作王的年份；如此翻译既符合上下文及平行经文，也避免用生硬的“在他王权之年”。
- source_word: נָשָׂא אֶת־רֹאשׁ
  choice: 抬起……的头
  rationale: 保留原文形象鲜明但含义可能多层的习语，不在正文中把它完全解释为“施恩”或“恢复地位”；脚注说明其语用含义。
- source_word: וַיֹּצֵא אֹתוֹ
  choice: 把他……带了出来
  rationale: 使役词形直译为“使他出来／带他出来”；较“释放”少一层解释，同时上下文仍清楚表明获释。
- source_word: מִבֵּית הַכליא
  choice: 从监牢里
  rationale: 原义为“拘禁之所”；“监牢”是准确、自然且庄重的现代汉语表达。
theological_decisions:
- issue: “抬起……的头”这一习语的具体含义
  choice: 正文保留字面意象，并以脚注说明可表示施恩、提升地位
  alternative: 正文直接译为“恩待”或“恢复……的地位”
  rationale: 原文习语兼有抬头、蒙恩及地位提升的意涵；保留意象可避免只选定其中一种解释，且随后的出狱行动提供了语境。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。日期置于句首，以符合中文行文习惯；保留“抬起……的头”的原文意象，并借脚注帮助普通读者理解。所有脚注标记均紧随其所注释的词语或短语。
