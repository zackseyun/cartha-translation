revisions:
- from: 犹大王约雅斤被掳后第三十七年，十二月二十五日，巴比伦王以未米罗达[b]登基的那一年，他抬起犹大王约雅斤的头[a]，把他从监牢里带了出来。
  to: 犹大王约雅斤被掳第三十七年，十二月二十五日，巴比伦王以未米罗达[b]在位的第一年，使犹大王约雅斤抬头[a]，把他从监牢中带出来。
  rationale: 修订消除了中文逐字直译造成的身体动作误解，并改善王名、王位年份与后续行动之间的句法衔接。“使约雅斤抬头”保留原文习语及其未完全限定的含义，脚注提供必要说明；“在位的第一年”遵循英文审校轨迹所采纳的平行经文语境判断。脚注锚点仍分别紧随所注的习语和人名。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T07:29:48Z'
