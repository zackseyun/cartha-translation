base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/052/022.yaml
  text: And on it was a bronze capital[a], and the height of the one capital was five cubits, with latticework and pomegranates on the capital all around, all of bronze. And the second pillar had the same[b], with pomegranates.
translation:
  language: zh_hans
  text: 柱上有一个铜柱头；其中一个柱头高五肘。柱头四周有网状装饰[a]和石榴[b]，全都是铜制的。第二根柱子也有同样的装饰和石榴。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “网状装饰”也可译作“网子”。
    reason: lexical_alternative
  - marker: b
    text: 这里的“石榴”指装饰柱头的石榴形饰物。
    reason: cultural_note
lexical_decisions:
- source_word: כֹתֶרֶת
  choice: 柱头
  rationale: 该词在此指柱子顶端的装饰性构件；“柱头”是现代汉语中准确而简明的建筑术语。
- source_word: עָלָיו
  choice: 柱上
  rationale: 代词指向上文的柱子；明说“柱上”可使现代读者清楚理解所指，同时保留其空间关系。
- source_word: נְחֹשֶׁת
  choice: 铜／铜制
  rationale: 该词可指铜或青铜；原文未明确合金成分，故正文用较宽泛的“铜”，避免作超出文本的材料学限定。
- source_word: קוֹמַת
  choice: 高
  rationale: 此处表示柱头的垂直高度，用“高”符合现代汉语度量表达。
- source_word: הָאַחַת
  choice: 其中一个
  rationale: 原文是在两个柱头中指一个，并不必然表示先后次序；“其中一个”保留这一点。
- source_word: חָמֵשׁ אַמּוֹת
  choice: 五肘
  rationale: 保留原文的古代长度单位，不擅自换算为现代单位。
- source_word: שְׂבָכָה
  choice: 网状装饰
  rationale: 该词指网格或网状构件；结合柱头装饰的语境译为“网状装饰”，既具体又自然。
- source_word: רִמּוֹנִים
  choice: 石榴
  rationale: 原义为“石榴”，在建筑语境中指石榴形饰物；正文保留原文形象，并用脚注说明。
- source_word: סָבִיב
  choice: 四周
  rationale: 表达装饰环绕柱头分布，简洁而符合现代汉语习惯。
- source_word: הַכֹּל נְחֹשֶׁת
  choice: 全都是铜制的
  rationale: 概括上述柱头装饰的材质，语义清楚自然。
- source_word: וְכָאֵלֶּה לָעַמּוּד הַשֵּׁנִי
  choice: 第二根柱子也有同样的装饰
  rationale: 希伯来文表达较为省略；补出“有”和“装饰”，使汉语完整，同时保留第二根柱子与前者相同之意。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。保留“五肘”这一古代单位，并以“柱头”准确表达建筑构件。句子适当分开，以清楚呈现柱头的高度、装饰和材质；不把“铜”进一步限定为“青铜”，以保留 נְחֹשֶׁת 在材质上的语义范围。
