base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/052/030.yaml
  text: In the twenty-third year of Nebuchadnezzar[a], Nebuzaradan the captain of the guard carried away 745 Judeans[c][b]. All the persons were 4,600.
translation:
  language: zh_hans
  text: 尼布甲尼撒在位第二十三年，护卫长尼布撒拉旦将745名犹大人[b]掳走[a]。总计有4,600人[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“掳去”或“放逐”。原文动词指使人离乡流亡。
    reason: lexical_alternative
  - marker: b
    text: “犹大人”在这里主要指犹大地区和犹大国的人，也常译作“犹太人”。原文在本节两处人数统计中都使用“人”（נֶפֶשׁ）一词；该词在这里用于计算人数。
    reason: lexical_alternative
  - marker: c
    text: 4,600人是第28—30节所列被掳人数的总和。
    reason: cross_reference
lexical_decisions:
- source_word: בִּשְׁנַת שָׁלֹשׁ וְעֶשְׂרִים לִנְבוּכַדְרֶאצַּר
  choice: 尼布甲尼撒在位第二十三年
  rationale: 按现代汉语的王年纪年习惯表达；介词לְ表明年份以尼布甲尼撒的统治年数计算。
- source_word: הֶגְלָה
  choice: 掳走
  rationale: 该词是גלה的使役式，指使人离乡流亡；“掳走”符合本段战争与流放的历史语境，也比行政色彩较强的“遣送”自然。
- source_word: נְבוּזַרְאֲדָן
  choice: 尼布撒拉旦
  rationale: 按现代中文圣经人名的常见音译处理。
- source_word: רַב טַבָּחִים
  choice: 护卫长
  rationale: 这是巴比伦官职；字面与行刑者或宰杀者有关，但在叙事语境中指宫廷或军事护卫的长官。
- source_word: יְהוּדִים
  choice: 犹大人
  rationale: 此处主要指来自犹大、隶属犹大的人群；“犹大人”保留其地域和族群含义，避免过早突出后世宗教身份。
- source_word: נֶפֶשׁ
  choice: 人
  rationale: 在两处人数统计中，该词是计算个体的用语，译作“人”符合现代汉语，不引入“灵魂”的形而上含义。
- source_word: שְׁבַע מֵאוֹת אַרְבָּעִים וַחֲמִשָּׁה
  choice: 745名
  rationale: 使用阿拉伯数字便于阅读，并准确保留原文数目。
- source_word: כָּל נֶפֶשׁ אַרְבַּעַת אֲלָפִים וְשֵׁשׁ מֵאוֹת
  choice: 总计4,600人
  rationale: 将希伯来文的总结公式自然地译成现代汉语，同时准确保留总数。
