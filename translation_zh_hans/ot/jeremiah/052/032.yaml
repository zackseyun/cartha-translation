lexical_decisions:
- source_word: וַיְדַבֵּר אִתּוֹ טֹבוֹת
  choice: 他对他说了好话
  rationale: דבר אתו意为“对他说话”；טֹבוֹת字面为“好事、好话”，在此指说有利、友善的话。正文保留原文较具体的表达，并以脚注说明其语用含义。
- source_word: וַיִּתֵּן אֶת־כִּסְאוֹ
  choice: 把他的座位安置
  rationale: נתן在宫廷座次语境中表示安排、设置；这里的כִּסֵּא既可指实际座位，也承载地位含义。
- source_word: כִּסְאוֹ
  choice: 他的座位
  rationale: 虽然כִּסֵּא可译“宝座”，但此处比较众王在巴比伦王廷中的座次和等级；“座位”自然地保留实际席位与身份高低的双重含义，也避免让人误以为约雅斤获赐独立王权。
- source_word: מִמַּעַל לְכִסֵּא מְלָכִים
  choice: 在众王的座位之上
  rationale: מִמַּעַל לְ表达高于、在……之上；此处既可能描述席位安排，也表示等级提升，译文保留这种具体与象征并存的张力。
- source_word: אֲשֶׁר אִתּוֹ בְּבָבֶל
  choice: 同他一起住在巴比伦的
  rationale: אִתּוֹ直译“与他同在”；结合宫廷背景，指与巴比伦王同在巴比伦的诸王。“住”使现代汉语通顺，但不把关系进一步解释为被囚、臣服或侍奉。
