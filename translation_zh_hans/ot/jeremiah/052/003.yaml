  text: כִּ֣י עַל אַ֣ף יְהוָ֗ה הָֽיְתָה֙ בִּ/ירוּשָׁלִַ֣ם וִֽ/יהוּדָ֔ה עַד הִשְׁלִיכ֥/וֹ אוֹתָ֖/ם מֵ/עַ֣ל פָּנָ֑י/ו וַ/יִּמְרֹ֥ד צִדְקִיָּ֖הוּ בְּ/מֶ֥לֶךְ בָּבֶֽל׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/052/003.yaml
  text: For because of the anger of Yahweh it came to pass in Jerusalem and Judah[a], until he cast them out from before his face[b]; and Zedekiah rebelled against the king of Babylon.
translation:
  language: zh_hans
  text: 因为耶和华的怒气，这事发生在耶路撒冷和犹大，直到他把他们从自己面前赶出去。西底家背叛了巴比伦王。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 引出对前文事件的解释，表明本节所述是前文情势的原因说明；现代汉语用“因为”自然清楚。
- source_word: עַל אַף יְהוָה
  choice: 因为耶和华发怒
  rationale: עַל אַף 表示由耶和华的怒气所导致；译作“发怒”既符合现代汉语，也不削弱原文的审判意味。神名 יְהוָה 采用通行的“耶和华”。
- source_word: הָיְתָה
  choice: 这一切才临到
  rationale: 原文动词为阴性单数，主语未明说，回指上文所述局势。汉语补出“这一切”，使句意完整；“临到”保留事件发生于耶路撒冷和犹大的意味，“才”连接其原因，但不另加具体事件。
- source_word: בִּירוּשָׁלִַם וִיהוּדָה
  choice: 临到耶路撒冷和犹大
  rationale: 保留城市与地区两个地名，并按汉语习惯与“临到”搭配。
- source_word: עַד הִשְׁלִיכוֹ אוֹתָם
  choice: 直到他把他们……赶出去
  rationale: שלך 的使役形式表达强制驱逐；“赶出去”自然且保留动作的严厉性。עַד 直译为“直到”，不将其含义限定为单纯结果关系。
- source_word: מֵעַל פָּנָיו
  choice: 从自己面前
  rationale: 较直接地保留“从他的面前”的希伯来语形象，同时在汉语中明确反身指向耶和华。
- source_word: וַיִּמְרֹד
  choice: 背叛了
  rationale: מרד 在此指政治上的反叛；“背叛”准确、自然，并保留其负面分量。
- source_word: בְּמֶלֶךְ בָּבֶל
  choice: 巴比伦王
  rationale: 介词 ב 与 מרד 连用表示反抗的对象；汉语“背叛巴比伦王”已自然表达“反抗……王”的关系。
theological_decisions:
- issue: 耶和华的怒气与耶路撒冷、犹大遭遇之间的因果关系
  choice: 明确译为“因为耶和华发怒，这一切才临到……”
  alternative: 弱化为仅仅并列神的怒气与历史事件
  rationale: כִּי עַל אַף יְהוָה 明确说明神的怒气是事件发生的原因；译文保留这一神学因果关系，不改成泛泛的“不悦”，也不补充原文未明说的解释。
- issue: עַד 所表达的关系
  choice: 保留为“直到”
  alternative: 译为“以致”或“结果”
  rationale: 上下文确有结果意味，但 עַד 的基本形式是界限性的“直到”。保留“直到”可避免过早消除原文在时间进程与结果关系之间的张力。
- issue: “从他面前”所表达的神圣临在意象
  choice: 译为“从自己面前赶出去”
  alternative: 解释性译为“从他的同在中赶出去”
  rationale: 原文使用“面”这一具体意象。直译在汉语中可以理解，也避免把隐喻完全抽象化；同时不额外界定这种被逐离开的神学性质。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“这一切”用于承接前文并补足原文隐含主语；分号划分神圣审判的说明与西底家背叛巴比伦王的叙事动作。
