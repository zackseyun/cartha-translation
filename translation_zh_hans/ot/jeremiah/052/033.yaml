base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/052/033.yaml
  text: And he changed out of his prison clothes and ate bread before him continually all the days of his life[a][b].
translation:
  language: zh_hans
  text: 他换下囚服，终身常在王面前用饭[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或较直译：“他更换了自己被囚时的衣服。”
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“在他面前吃饼”；这里可能是指在王面前用饭。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשִׁנָּה אֵת בִּגְדֵי כִלְאוֹ
  choice: 他换下囚服
  rationale: שׁנה在此以“他受囚禁的衣服”为宾语，表示更换、换下；“换下囚服”用现代汉语自然表达脱去囚衣、改穿别的衣服的意思。
- source_word: וְאָכַל לֶחֶם
  choice: 用饭
  rationale: 字面为“吃饼/吃食物”，在此是进餐的惯用表达；“用饭”既自然庄重，也适合宫廷同席的语境。
- source_word: לְפָנָיו
  choice: 在王面前
  rationale: 字面为“在他面前”。根据上文，代词所指是巴比伦王；译作“王”可避免汉语代词指向不清，同时保留原文所表达的临在含义，不进一步解释为“在王席上”。
- source_word: תָּמִיד
  choice: 常
  rationale: 表示持续或有规律地发生；在进餐语境中，“常”比“不断”自然，并保留经常如此的含义。
- source_word: כָּל יְמֵי חַיָּו
  choice: 终身
  rationale: 对应“他一生所有的日子”，简洁自然地表达此后余生始终如此。
