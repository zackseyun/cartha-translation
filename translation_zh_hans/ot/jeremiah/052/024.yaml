base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/052/024.yaml
  text: And the captain of the guard took Seraiah the chief priest[a], and Zephaniah the second priest[c][b], and the three keepers of the threshold.
translation:
  language: zh_hans
  text: 护卫长带走了首席祭司[a]西莱雅、副祭司[b]西番雅，以及三名守门人[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“大祭司”。原文直译为“为首的祭司”或“首席祭司”。
    reason: lexical_alternative
  - marker: b
    text: 或译“第二祭司”，即位居第二的祭司。
    reason: lexical_alternative
  - marker: c
    text: 原文直译为“看守门槛的人”。
    reason: lexical_alternative
lexical_decisions:
- source_word: רַב טַבָּחִים
  choice: 护卫长
  rationale: 该称谓字面涉及“屠宰者之首”，但在新巴比伦王室语境中指统领王室卫队的官员；“护卫长”自然且符合职务含义。
- source_word: וַיִּקַּח
  choice: 拿住了
  rationale: לקח基本义为“拿、取”；此处对象是被拘押的人，“拿住”既体现叙事情境，又不过度强化为“逮捕”或“抓获”。
- source_word: שְׂרָיָה
  choice: 西莱雅
  rationale: 按现代普通话常用圣经人名音译处理。
- source_word: כֹּהֵן הָרֹאשׁ
  choice: 大祭司
  rationale: 希伯来语直译为“为首的祭司”；在本节历史和职务语境中，“大祭司”是现代中文最自然、明确的对应，同时以脚注保留字面表达。
- source_word: צְפַנְיָה
  choice: 西番雅
  rationale: 按现代普通话常用圣经人名音译处理。
- source_word: כֹּהֵן הַמִּשְׁנֶה
  choice: 副祭司
  rationale: מִשְׁנֶה表示居第二位或副职；“副祭司”自然表达其职级，脚注保留“第二祭司”的直译可能。
- source_word: שְׁלֹשֶׁת
  choice: 三名
  rationale: 与表示职务人员的复数短语搭配时，“三名”符合现代汉语表达。
- source_word: שֹׁמְרֵי הַסַּף
  choice: 守门人
  rationale: 该短语字面为“看守门槛的人”，在圣殿职务语境中指守门者；正文采用自然的“守门人”，脚注说明更贴近字面的译法。
theological_decisions:
- issue: כֹּהֵן הָרֹאשׁ的职衔表达
  choice: 大祭司
  alternative: 首席祭司／为首的祭司
  rationale: “大祭司”在此最符合现代中文对该首要祭司职务的称呼；但原文使用“头、首”而非另一个专门术语，故以脚注保存其字面层次。
- issue: כֹּהֵן הַמִּשְׁנֶה的等级含义
  choice: 副祭司
  alternative: 第二祭司／位居第二的祭司
  rationale: 原文可指副职或等级第二者；正文不把具体职责说得过细，并以脚注保留形式上的歧义。
translation_notes:
  register: 采用庄重、清晰的现代标准汉语。句式按中文信息结构排列，将职衔置于人名前；对古代官职采用普通读者易懂的表达，并用脚注保存希伯来语的字面形象和职级歧义。
