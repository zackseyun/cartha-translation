base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/052/004.yaml
  text: And in the ninth year of his reign[a], in the tenth month, on the tenth day of the month, Nebuchadnezzar king of Babylon came—he and all his army—against Jerusalem[b], and they encamped against it and built a siege wall around it.
translation:
  language: zh_hans
  text: 他作王第九年十月初十日，巴比伦王尼布甲尼撒[a]率领全军来攻打耶路撒冷。他们在城外安营，并在城的四周筑起围城工事[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节希伯来文中的王名拼写更接近“尼布甲利撒”；正文采用中文传统上通行的“尼布甲尼撒”。
    reason: lexical_alternative
  - marker: b
    text: “围城工事”所译的希伯来词，也可理解为“围城墙”或“土垒”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: （融入时间句，不单独译出）
  rationale: 此处用于推进叙事并引出事件；现代汉语直接以时间状语起句更自然，也不损失叙事关系。
- source_word: בַשָּׁנָה הַתְּשִׁעִית לְמָלְכוֹ
  choice: 他作王第九年
  rationale: 这是君王纪年惯用语；保留代词“他”，不擅自补明本节希伯来文本未重述的人名。
- source_word: בַחֹדֶשׁ הָעֲשִׂירִי בֶּעָשׂוֹר לַחֹדֶשׁ
  choice: 十月初十日
  rationale: 准确表达“第十月、该月第十日”，采用现代汉语简洁自然的日期说法，不另加希伯来原文没有的月份名称。
- source_word: נְבוּכַדְרֶאצַּר
  choice: 尼布甲尼撒
  rationale: 采用现代中文圣经和一般中文语境中辨识度较高的传统译名，同时以脚注说明本节希伯来文拼写的差异。
- source_word: הוּא וְכָל חֵילוֹ
  choice: 率领全军
  rationale: 希伯来文直译为“他和他的全军”；在汉语军事叙事中，“率领全军”自然清楚，并保留君王本人随军而来的含义。
- source_word: עַל יְרוּשָׁלַםִ
  choice: 来攻打耶路撒冷
  rationale: 在军队进逼和围城的语境中，עַל表示敌对行动；“攻打”比中性的“来到”更准确。
- source_word: וַיַּחֲנוּ עָלֶיהָ
  choice: 他们在城外安营
  rationale: “安营”保留军事驻扎之意；“在城外”以自然汉语表达军队针对耶路撒冷扎营的空间与敌对关系。
- source_word: וַיִּבְנוּ עָלֶיהָ דָּיֵק סָבִיב
  choice: 在城的四周筑起围城工事
  rationale: דָּיֵק可指围城墙、土垒或较广义的围城设施；“围城工事”避免过度限定其具体形制，סָבִיב则译为“四周”。
theological_decisions: []
