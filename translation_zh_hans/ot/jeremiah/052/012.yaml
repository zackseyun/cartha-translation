  text: וּ/בַ/חֹ֤דֶשׁ הַֽ/חֲמִישִׁי֙ בֶּ/עָשׂ֣וֹר לַ/חֹ֔דֶשׁ הִ֗יא שְׁנַת֙ תְּשַֽׁע עֶשְׂרֵ֣ה שָׁנָ֔ה לַ/מֶּ֖לֶךְ נְבוּכַדְרֶאצַּ֣ר מֶֽלֶךְ בָּבֶ֑ל בָּ֗א נְבֽוּזַרְאֲדָן֙ רַב טַבָּחִ֔ים עָמַ֛ד לִ/פְנֵ֥י מֶֽלֶךְ בָּבֶ֖ל בִּ/ירוּשָׁלִָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/052/012.yaml
  text: In the fifth month[a], on the tenth day of the month—which was the nineteenth year of King Nebuchadnezzar, king of Babylon—Nebuzaradan the captain of the guard, who stood before the king of Babylon[c][b], came to Jerusalem.
translation:
  language: zh_hans
  text: 五月初十，也就是巴比伦王尼布甲尼撒在位第十九年，侍立在巴比伦王面前的护卫长[a]尼布撒拉旦来到耶路撒冷[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “护卫长”按字面也可译作“行刑者之长”或“屠夫长”；这里大概是主管王室卫队的一名高级官员。
    reason: lexical_alternative
  - marker: b
    text: 原文形式为“在耶路撒冷”；与“来”连用，中文自然译作“来到耶路撒冷”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַחֹדֶשׁ הַחֲמִישִׁי
  choice: 五月
  rationale: 保留希伯来历法的序数月份表达；中文圣经文体中“五月”自然简洁。句首 וּ־ 在此承接上文，不必机械译作“并且”。
- source_word: בֶּעָשׂוֹר לַחֹדֶשׁ
  choice: 初十
  rationale: 这是中文表达阴历或古代历法日期的自然说法，准确对应“本月第十日”。
- source_word: הִיא שְׁנַת תְּשַׁע עֶשְׂרֵה שָׁנָה לַמֶּלֶךְ נְבוּכַדְרֶאצַּר
  choice: 也就是巴比伦王尼布甲尼撒在位第十九年
  rationale: הִיא 回指日期并作说明；“在位第十九年”自然表达 לַמֶּלֶךְ 的王年纪年含义。
- source_word: רַב טַבָּחִים
  choice: 护卫长
  rationale: 该宫廷官衔字面涉及屠宰者或行刑者之长，但历史语境中指高级王室官员；正文采用通顺而常见的“护卫长”，字面含义置于脚注。
- source_word: עָמַד לִפְנֵי מֶלֶךְ בָּבֶל
  choice: 侍立在巴比伦王面前
  rationale: 保留“站在……面前”的源语意象，同时用“侍立”显明这是在君王面前供职的宫廷表达，而不将其简化为泛泛的“服侍”。
- source_word: בָּא ... בִּירוּשָׁלִָם
  choice: 来到耶路撒冷
  rationale: 原文介词形式字面为“在耶路撒冷”，但与运动动词 בָּא 连用时，中文自然表达为“来到耶路撒冷”；此处在脚注中保留形式差异。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。以“初十”和“在位第十九年”自然呈现古代日期公式；“侍立在……面前”保留宫廷语气。所有脚注标记均已置入正文。
