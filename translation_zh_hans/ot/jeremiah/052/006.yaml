base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/052/006.yaml
  text: In the fourth month[a], on the ninth day of the month, the famine became severe in the city, and there was no bread for the people of the land.
translation:
  language: zh_hans
  text: 四月九日，城中的饥荒越发严重，这地的百姓[a]没有饼可吃。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“平民”。原文“这地的百姓”在某些语境中可较具体地指一般民众或平民。
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּחֹדֶשׁ הָרְבִיעִי
  choice: 四月
  rationale: 原文是带定冠词的序数月份日期表达；汉语用“四月”自然简洁，不补入原文未明说的“那年”。
- source_word: בְּתִשְׁעָה לַחֹדֶשׁ
  choice: 初九
  rationale: 这是标准的希伯来语日期格式；“初九”是现代汉语表达农历式月份日期的自然说法。
- source_word: וַיֶּחֱזַק הָרָעָב
  choice: 饥荒越发严重
  rationale: חזק本义与“强盛”有关，以“饥荒”为主语时表示加剧；此译既自然，又保留过程性的强化含义。
- source_word: בָּעִיר
  choice: 城里
  rationale: 按原文保留“城”而不直接补明为耶路撒冷；所指可由上下文确定。
- source_word: וְלֹא הָיָה לֶחֶם
  choice: 都没有饼可吃
  rationale: לֶחֶם直译为“饼、面饼”，没有泛化为“食物”；补出“可吃”使汉语句意完整自然。
- source_word: לְעַם הָאָרֶץ
  choice: 境内的百姓
  rationale: 保留“地上的民”这一结构的地域含义，同时用现代汉语较自然的“境内的百姓”表达；该短语也可能特指普通民众，故加脚注说明。
