  text: וּ/מִ/דַּלּ֣וֹת הָ/אָ֔רֶץ הִשְׁאִ֕יר נְבוּזַרְאֲדָ֖ן רַב טַבָּחִ֑ים לְ/כֹרְמִ֖ים וּ/לְ/יֹגְבִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/052/016.yaml
  text: But some of the poorest of the land Nebuzaradan[a], the captain of the guard[b], left as vinedressers and farmers.
translation:
  language: zh_hans
  text: 但尼布撒拉旦——护卫长[a]——留下当地一些最贫穷的人，让他们料理葡萄园、耕种田地[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “护卫长”原文直译为“宰杀者之长”或“行刑者之长”，很可能是宫廷或军队中的正式官衔。
    reason: lexical_alternative
  - marker: b
    text: “耕种田地”也可译作“犁地”或“做田间劳作”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִדַּלּוֹת הָאָרֶץ
  choice: 但……当地一些最贫穷的人
  rationale: 介词 מִן 表示从一群人中取出一部分；结合上文掳掠的语境，用“但”表达转折。“当地”指犹大境内，不泛指全地。
- source_word: הִשְׁאִיר
  choice: 留下
  rationale: 使役词形在这里表示使人留下、留在原地；“留下”简洁且不额外推断其动机。
- source_word: נְבוּזַרְאֲדָן
  choice: 尼布撒拉旦
  rationale: 按现代中文圣经人名的通行音译处理。
- source_word: רַב טַבָּחִים
  choice: 护卫长
  rationale: 这是巴比伦宫廷或军政官衔；“护卫长”自然地表达其职务，较字面译法“宰杀者之长”不易引起误解，同时以脚注保留字面含义。
- source_word: לְכֹרְמִים
  choice: 让他们料理葡萄园
  rationale: 介词 לְ 表示受指派的职分；כֹרְמִים 指从事葡萄园劳动的人。动词化表达符合现代汉语。
- source_word: וּלְיֹגְבִים
  choice: 耕种田地
  rationale: 该词指耕作土地的农业劳动，可能特别涉及犁地；正文采用自然而不过窄的表达，脚注保留词义范围。
