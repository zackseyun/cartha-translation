  text: וַ/יַּכֶּ֣ה אוֹתָ/ם֩ מֶ֨לֶךְ בָּבֶ֧ל וַ/יְמִתֵ֛/ם בְּ/רִבְלָ֖ה בְּ/אֶ֣רֶץ חֲמָ֑ת וַ/יִּ֥גֶל יְהוּדָ֖ה מֵ/עַ֥ל אַדְמָתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/052/027.yaml
  text: And the king of Babylon struck them down and put them to death at Riblah in the land of Hamath[a]. So Judah was taken into exile from its land.
translation:
  language: zh_hans
  text: 巴比伦王在哈马地的利比拉击打他们，把他们处死。这样，犹大就从自己的土地上被掳去了。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“犹大就从自己的土地上流亡了。”希伯来语动词形式为主动，但这里所说的是犹大遭强制迁离。
    reason: 保留גלה在语法形式与语境意义之间的翻译选择。
lexical_decisions:
- source_word: וַיַּכֶּה אוֹתָם
  choice: 击打他们
  rationale: 保留נכה与随后“把他们处死”之间的动作次序，不把两个动词合并为单一的“杀死”。在本语境中，“击打”带有暴力惩处之意。
- source_word: מֶלֶךְ בָּבֶל
  choice: 巴比伦王
  rationale: 以现代汉语中自然、庄重的结构表达希伯来语属格关系。
- source_word: וַיְמִתֵם
  choice: 把他们处死
  rationale: מות的使役式意为“使之死亡”；“处死”既体现使役与惩处语境，也不额外断定正式司法程序。
- source_word: בְּרִבְלָה בְּאֶרֶץ חֲמָת
  choice: 在哈马地的利比拉
  rationale: 清楚保留利比拉位于哈马地域之内的地理关系，并符合现代汉语语序。
- source_word: וַיִּגֶל
  choice: 被掳去了
  rationale: 本处גלה指强制迁离、流放；“被掳去”自然传达巴比伦强制放逐犹大的历史语境。
- source_word: יְהוּדָה
  choice: 犹大
  rationale: 保留专名及其对国家或人民的转喻，不擅自扩写为“犹大人”。
- source_word: מֵעַל אַדְמָתוֹ
  choice: 从自己的土地上
  rationale: מֵעַל保留“从……上”的空间色彩；אַדָמָה译作“土地”。反身领属“自己的”自然指回“犹大”，同时避免汉语不必要的性别标记。
theological_decisions:
- issue: “犹大”及其阳性单数领属后缀的表达
  choice: 从自己的土地上
  alternative: 从他的土地上；从其土地上
  rationale: 希伯来语阳性单数后缀与专名“犹大”的语法形式相应，并不要求汉语把国家人格化为男性。“自己的”保留明确的同指领属关系，又符合现代汉语表达。
- issue: וַיִּגֶל的语态与被掳性质
  choice: 犹大就……被掳去了
  alternative: 犹大就离开本地流亡了
  rationale: 希伯来语形式虽为主动，但上下文描述的是巴比伦造成的强制放逐；汉语被动表达能准确传达事件性质，而不把它误解为自愿迁离。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“击打他们，把他们处死”保留原文两个连续动词；“被掳去了”沿用普通读者熟悉的圣经历史用语。脚注标记置于相关分句之后。
