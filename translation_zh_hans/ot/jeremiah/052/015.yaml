base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/052/015.yaml
  text: And some of the poorest of the people[a], and the rest of the people who remained in the city, and the deserters who had defected to the king of Babylon, and the rest of the craftsmen—Nebuzaradan, the captain of the guard[c][b], carried into exile.
translation:
  language: zh_hans
  text: 百姓中最贫穷的一些人[a]、城中其余留下的百姓、那些已经投奔[b]巴比伦王的人，以及其余的工匠[c]，护卫长尼布撒拉旦都掳到异地去了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“百姓中的一些贫苦人”。原文表示从贫穷、卑微的百姓中取出一部分。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“倒向巴比伦王”；这是表示归顺或转投对方的说法。
    reason: idiom_explanation
  - marker: c
    text: “工匠”所据的希伯来词含义不确定；也可理解为“民众”，译作“其余的民众”。参列王纪下25:11的平行记载。
    reason: textual_lexical_ambiguity
lexical_decisions:
- source_word: וּמִדַּלּוֹת הָעָם
  choice: 百姓中最贫穷的一些人
  rationale: מִן 表示从整体中取出一部分；דַּלּוֹת 指贫穷、卑微者。译文用“一些人”表达部分义，并以自然现代汉语传达其社会处境。
- source_word: יֶתֶר הָעָם הַנִּשְׁאָרִים בָּעִיר
  choice: 城里其余留下的人
  rationale: 兼顾 יֶתֶר“其余”和 נִשְׁאָרִים“留下”的重复层次，同时避免汉语过度累赘。
- source_word: הַנֹּפְלִים אֲשֶׁר נָפְלוּ אֶל מֶלֶךְ בָּבֶל
  choice: 那些已经投奔巴比伦王的人
  rationale: נפל אל 在军事政治语境中是“倒向、投奔”某一方；“投奔”比逐字译作“倒下”更准确，也不过度断定其主观动机。
- source_word: יֶתֶר הָאָמֹון
  choice: 其余的工匠
  rationale: אָמֹון 在此含义困难；可理解为工匠或匠人群体，而平行经文的用词又支持“其余的民众”这一读法。正文采用语境上较具体的“工匠”，脚注保留另一可能。
- source_word: הֶגְלָה
  choice: 掳去，使他们流亡
  rationale: 该词为 גלה 的使役形，意为使人离开本地、放逐异乡；此译既保留被强制带走的动作，也明确其流亡结果。
- source_word: רַב טַבָּחִים
  choice: 护卫长
  rationale: 该王室职衔字面涉及屠宰或处决者，但在此指统领护卫并执行王命的高级官员；“护卫长”是简洁而合乎历史叙事语体的功能性翻译。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。保留原文末置主语的叙事张力，同时用“都掳去，使他们流亡”使长串宾语后的谓语关系清楚。脚注按正文出现顺序排列，并明确保留 אָמֹון 的真实词义歧义。
