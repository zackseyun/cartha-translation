id: JER.52.17
reference: Jeremiah 52:17
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/אֶת עַמּוּדֵ֨י הַ/נְּחֹ֜שֶׁת אֲשֶׁ֣ר לְ/בֵית יְהוָ֗ה וְֽ/אֶת הַ/מְּכֹנ֞וֹת וְ/אֶת יָ֧ם הַ/נְּחֹ֛שֶׁת אֲשֶׁ֥ר בְּ/בֵית יְהוָ֖ה שִׁבְּר֣וּ כַשְׂדִּ֑ים וַ/יִּשְׂא֥וּ אֶת כָּל נְחֻשְׁתָּ֖/ם בָּבֶֽלָ/ה־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/052/017.yaml
  text: And the Chaldeans broke in pieces the bronze pillars that were in the house of Yahweh[a], and the stands, and the bronze Sea that was in the house of Yahweh[b], and carried all their bronze to Babylon.
translation:
  language: zh_hans
  text: 那些属于雅威的殿的铜柱、支架[a]和在雅威的殿里的铜海，迦勒底人[b]都打碎了，又把它们所有的铜运到巴比伦。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “支架”也可译作“底座”，指承托圣殿器物的架座。
    reason: lexical_alternative
  - marker: b
    text: “迦勒底人”在这里指巴比伦军队。
    reason: historical_clarification
lexical_decisions:
- source_word: עַמּוּדֵי הַנְּחֹשֶׁת
  choice: 铜柱
  rationale: עַמּוּדֵי意为柱子，נְחֹשֶׁת在圣殿器物语境中通常指青铜；现代中文圣经用语中“铜柱”简洁自然。
- source_word: אֲשֶׁר לְבֵית יְהוָה
  choice: 属于雅威殿的
  rationale: לְ在这里宜理解为归属或关联，而非单纯表示位置；这样也保留了它与后文בְּבֵית“在殿里”的区别。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以常见的现代汉语音译呈现四字神名，保留其作为专名的性质，而不以称号替代。
- source_word: הַמְּכֹנוֹת
  choice: 支架
  rationale: 指承托圣殿器物的活动式架座；“支架”比“底座”更直观，但后者也是可行译法。
- source_word: יָם הַנְּחֹשֶׁת
  choice: 铜海
  rationale: 这是圣殿中大型铜盆的专称；“铜海”保留原文形象和传统名称。
- source_word: אֲשֶׁר בְּבֵית יְהוָה
  choice: 雅威殿里的
  rationale: בְּ明确表示所在位置；按紧邻的单数先行词理解，修饰“铜海”，不把范围无根据地扩展至整个清单。
- source_word: שִׁבְּרוּ
  choice: 打碎了
  rationale: 这里指将大型铜器拆毁成碎块以便搬运；“打碎”准确表达实际动作。
- source_word: כַשְׂדִּים
  choice: 迦勒底人
  rationale: 保留原文的族群称谓及历史色彩；在本语境中指攻占耶路撒冷的巴比伦军队。
- source_word: וַיִּשְׂאוּ
  choice: 运到
  rationale: נשא在掠物语境中表示搬走、运走；与目的地“巴比伦”连用时，“运到”自然明确。
- source_word: כָּל נְחֻשְׁתָּם
  choice: 这些器物的铜全都
  rationale: 复数后缀指前述各件器物；此译避免让中文读者误以为铜属于迦勒底人，并完整表达כָּל“全部”。
- source_word: בָּבֶלָה
  choice: 到巴比伦
  rationale: 方向词尾表示朝向巴比伦，在此语境中自然译为目的地“到巴比伦”。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文使用四字神名；音译“雅威”直接保留其专名性质，不以称号代替，也不把可能的传统读音视为确定无疑。
- issue: 两个关系从句的范围与差别
  choice: 前一处译为“属于雅威殿的”，后一处译为“雅威殿里的”，并让后一处紧接“铜海”
  alternative: 两处都译为“在雅威殿里的”，或让后一从句统摄全部器物
  rationale: 原文分别使用לְ和בְּ，存在有意义的关系与位置差别；后一从句中的表达紧邻单数“铜海”，因此正文采用最直接的句法关联，同时不将神学或历史推断加入文本。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。以话题前置结构保留原文先列受事、后出现施事的强调次序；“属于……的”与“……里的”刻意区分לְ和בְּ。所有脚注标记均置于其所解释的词语之后。
