  text: וְ/אֶת הַ֠/סִּפִּים וְ/אֶת הַ/מַּחְתּ֨וֹת וְ/אֶת הַ/מִּזְרָק֜וֹת וְ/אֶת הַ/סִּיר֣וֹת וְ/אֶת הַ/מְּנֹר֗וֹת וְ/אֶת הַ/כַּפּוֹת֙ וְ/אֶת הַ/מְּנַקִי֔וֹת אֲשֶׁ֤ר זָהָב֙ זָהָ֔ב וַ/אֲשֶׁר כֶּ֖סֶף כָּ֑סֶף לָקַ֖ח רַב טַבָּחִֽים־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/052/019.yaml
  text: And the bowls[a], the firepans, the basins, the pots, the lampstands, the cups, and the vessels for pouring—whatever was gold, gold, and whatever was silver[d][c][b], silver—the captain of the guard took.
translation:
  language: zh_hans
  text: 那些盆[a]、火盘[b]、碗、锅、灯台、杯和倾倒用的器皿[e]，凡属金的，金的；凡属银的，银的[c]，护卫长[d]都拿走了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “盆”也可译作“杯”；本节几种圣殿器皿的确切区别并不确定。
    reason: lexical_alternative
  - marker: b
    text: “火盘”也可译作“香炉”。
    reason: lexical_alternative
  - marker: c
    text: 希伯来文重复“金……金”和“银……银”，形成强调性的清单表达。
    reason: source_form
  - marker: d
    text: “护卫长”直译可作“行刑者之长”，也可能指王室卫队的统领。
    reason: lexical_alternative
  - marker: e
    text: 此词罕见，具体器形和用途不确定；也可译作“瓶”“奠酒器”或“烛剪”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַסִּפִּים
  choice: 盆
  rationale: 指圣殿器具中的盆或杯；译作“盆”符合器皿清单的语境，并与后面的“小杯”有所区别。
- source_word: הַמַּחְתּוֹת
  choice: 火盘
  rationale: 通常指在圣所礼仪中盛放或搬运炭火、香料的盘；“火盘”具体而不过度限定其用途。
- source_word: הַמִּזְרָקוֹת
  choice: 碗
  rationale: 指祭祀所用的盆碗类器皿；“碗”自然易懂，也与前面的“盆”保持词汇区别。
- source_word: הַסִּירוֹת
  choice: 锅
  rationale: 该词泛指锅或容器；“锅”保留其基本具体含义，不额外限定为烹煮之用。
- source_word: הַמְּנֹרוֹת
  choice: 灯台
  rationale: מְנוֹרָה通常指承托灯盏的灯台，而非仅指灯本身。
- source_word: הַכַּפּוֹת
  choice: 小杯
  rationale: 在圣殿器具清单中可指小型容器，也可能是匙；“小杯”既符合器皿语境，也避免与前面的盆、碗混同。
- source_word: הַמְּנַקִיּוֹת
  choice: 浇奠用的器皿
  rationale: 这是罕见词，确切器形不明；其礼仪语境很可能与倾倒祭酒有关，采用功能性表达，同时在注释中保留不确定性。
- source_word: אֲשֶׁר זָהָב זָהָב וַאֲשֶׁר כֶּסֶף כָּסֶף
  choice: 凡属金的，金的；凡属银的，银的
  rationale: 保留希伯来文“金……金”“银……银”的重复和清单式强调，不将其完全顺译为“所有金器和银器”。
- source_word: לָקַח
  choice: 拿走了
  rationale: 基本义为“拿、取”；结合掳掠语境，“拿走了”在现代汉语中自然，又不过度强化为“抢走”。
- source_word: רַב טַבָּחִים
  choice: 护卫长
  rationale: 这是尼布撒拉旦的官衔；“护卫长”符合巴比伦军事行政语境，也比直译“行刑者之长”更自然。
