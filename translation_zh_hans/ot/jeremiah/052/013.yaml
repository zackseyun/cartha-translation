id: JER.52.13
reference: Jeremiah 52:13
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יִּשְׂרֹ֥ף אֶת בֵּית יְהוָ֖ה וְ/אֶת בֵּ֣ית הַ/מֶּ֑לֶךְ וְ/אֵ֨ת כָּל בָּתֵּ֧י יְרוּשָׁלִַ֛ם וְ/אֶת כָּל בֵּ֥ית הַ/גָּד֖וֹל שָׂרַ֥ף בָּ/אֵֽשׁ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/052/013.yaml
  text: He burned the house of Yahweh[a], the house of the king, and all the houses of Jerusalem[c][b]; every great house he burned with fire.
translation:
  language: zh_hans
  text: 他焚烧了耶和华的殿[a]、王宫[b]和耶路撒冷所有的房屋；凡高大的房屋[c]，他都放火焚烧。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“耶和华的家”，即圣殿。
    reason: lexical_alternative
  - marker: b
    text: 直译“王的家”。
    reason: lexical_alternative
  - marker: c
    text: “高大的”也可理解为“重要的”，可能指重要人物或显贵的房屋。
    reason: lexical_ambiguity
lexical_decisions:
- source_word: וַיִּשְׂרֹף
  choice: 他焚烧了
  rationale: 这是שׂרף的Qal叙事过去式，直接陈述接续发生的行动；汉语不必机械译出句首连接词。
- source_word: בֵּית יְהוָה
  choice: 耶和华的殿
  rationale: בַּיִת在此指供敬拜耶和华的圣殿；“殿”在现代汉语中自然明确，脚注保留直译“耶和华的家”。神名יְהוָה译作汉语传统且通行的“耶和华”。
- source_word: בֵּית הַמֶּלֶךְ
  choice: 王宫
  rationale: 字面为“王的家”，在此实际指君王的宫殿；“王宫”简洁自然，脚注注明字面形式。
- source_word: כָּל בָּתֵּי יְרוּשָׁלִַם
  choice: 耶路撒冷所有的房屋
  rationale: 忠实表达城中房屋的总体范围，并保留原文“房屋”的具体意象。
- source_word: כָּל בֵּית הַגָּדוֹל
  choice: 凡高大的房屋
  rationale: 单数בֵּית受כָּל支配可作逐一、分配性表达。“高大的”保留גָּדוֹל可能指规模宏大的基本义，同时以脚注说明也可能指重要、显贵的房屋。
- source_word: שָׂרַף בָּאֵשׁ
  choice: 放火焚烧
  rationale: 原文重复“焚烧”并明确“用火”，带有强调作用；“放火焚烧”在汉语中自然地保留这一力度。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。现代简体中文圣经语境中“耶和华”辨识度最高，也明确将其作为专名，而非以“主”替代；“雅威”是较接近学术重构读音的可行译法。
- issue: “大房屋”所指的性质
  choice: 高大的房屋
  alternative: 重要人物的房屋
  rationale: גָּדוֹל兼有体量大和地位重要之义，语境不足以唯一确定。正文采用较直接的空间、规模义，脚注保留社会地位义，避免把歧义静默消解。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。正文以“殿”和“王宫”清楚传达所指建筑，同时用脚注保存原文反复使用בֵּית（家、房屋）的修辞形式。分号体现后半句对前述焚毁行动的概括和强调。
