base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/052/018.yaml
  text: They took away the pots[a], the shovels, the snuffers, the basins, the dishes[c][b], and all the bronze vessels with which they ministered.
translation:
  language: zh_hans
  text: 他们把锅、铲子、灯芯剪[a]、盆、盘子，以及所有供服事使用的青铜器皿，都拿走了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“修剪刀”。这里所指器具的确切形制不能确定，可能是修剪灯芯的工具。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַסִּרוֹת
  choice: 锅
  rationale: 该词通常指锅或烹煮用的器皿；在圣殿器具清单中，“锅”自然、明确，又不把具体用途限定过细。
- source_word: הַיָּעִים
  choice: 铲子
  rationale: 指清除灰烬或炭火的器具；“铲子”符合祭祀器具的语境，也便于现代读者理解。
- source_word: הַמְזַמְּרוֹת
  choice: 剪灯芯的剪子
  rationale: 词形本身涉及修剪或切割；在圣殿灯具语境中，很可能指修剪灯芯的工具。正文采用功能明确的表达，同时以脚注保留“修剪刀”的词义可能。
- source_word: הַמִּזְרָקֹת
  choice: 盆
  rationale: 指承接或洒祭牲之血等液体的礼仪器皿；“盆”比泛称“碗”更能传达其器形和礼仪用途。
- source_word: הַכַּפּוֹת
  choice: 盘子
  rationale: 该词可指小碗、盘、匙状器皿等，具体形制不确定；“盘子”保留宽泛的器皿含义，避免武断译为香炉或杯。
- source_word: כָּל כְּלֵי הַנְּחֹשֶׁת
  choice: 一切……铜器皿
  rationale: 在圣殿陈设语境中，נְחֹשֶׁת宜译为“铜”；כְּלֵי在器具清单中译为“器皿”恰当。
- source_word: אֲשֶׁר יְשָׁרְתוּ בָהֶם
  choice: 供他们服事用的
  rationale: שרת在礼仪语境中有履行圣职、服事之意。“服事”保留宗教礼仪色彩；介词所表达的工具关系用“供……用”自然呈现。
- source_word: לָקָחוּ
  choice: 都拿走了
  rationale: 基本义是“拿取”；在圣殿遭掠夺的叙事中，“拿走”自然体现这些器具被移走，而不额外强化为暴力抢夺。
theological_decisions:
- issue: שרת的礼仪含义
  choice: 服事
  alternative: 供职；使用
  rationale: “服事”既保留该动词在圣殿礼仪中的神圣职事色彩，又不指定执行者的身份或具体仪式，以免超出希伯来文。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。器具名称力求简洁；对形制不确定的 הַמְזַמְּרוֹת 在正文给出符合圣殿语境的功能性译法，并用脚注保留较宽泛的词义。原文句末动词在中文中依自然语序置于末尾，以“都”统摄整份清单。
