base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/052/014.yaml
  text: And all the walls around Jerusalem were broken down by all the army of the Chaldeans that was with the captain of the guard[a][b].
translation:
  language: zh_hans
  text: 与护卫长[b]在一起的迦勒底人[a]全军拆毁了耶路撒冷四围所有的城墙。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “迦勒底人”也可译作“巴比伦人”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译“行刑者之长”；这个职衔可能是指王室卫队或侍卫的统领。
    reason: lexical_alternative
lexical_decisions:
- source_word: חֹמוֹת
  choice: 城墙
  rationale: 该词复数指防御性的墙垣；结合“耶路撒冷”，译作“城墙”最自然明确。
- source_word: סָבִיב
  choice: 四周
  rationale: 表达环绕全城的范围，与“所有的城墙”搭配，保留原文周围各处之意。
- source_word: נָתְצוּ
  choice: 拆毁了
  rationale: נתץ用于拆除或摧毁建筑；“拆毁”准确传达军队毁坏城墙的具体动作。
- source_word: חֵיל
  choice: 全军
  rationale: 此处指军事部队；原文前有כָּל，合译为“全军”简洁自然。
- source_word: כַּשְׂדִּים
  choice: 迦勒底人
  rationale: 直译希伯来文族名；语境中指巴比伦帝国的军队，脚注保留“巴比伦人”这一语境译法。
- source_word: אֲשֶׁר אֶת
  choice: 所率领的
  rationale: 原文直陈军队“与”该官长同在；在军事叙事中自然表达为由该官长率领，不改变其隶属同行关系。
- source_word: רַב טַבָּחִים
  choice: 护卫长
  rationale: 这是巴比伦高级官员的职衔，通常指王室卫队的长官；“护卫长”较字面的“行刑者之长”更符合其职务语境。
