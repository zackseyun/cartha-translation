base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/052/028.yaml
  text: 'These are the people whom Nebuchadnezzar carried away captive: in the seventh year[b][a], 3,023 Judeans.'
translation:
  language: zh_hans
  text: 尼布甲尼撒掳走的人数如下：第七年，犹大人[a]三千零二十三名。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “犹大人”指犹大国或犹大地区的人；传统译作“犹太人”。
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶה הָעָם
  choice: 人数如下
  rationale: 原文直译为“这就是那些人/这百姓”，在引出人数清单时，译作“人数如下”既自然，也保留其总括和列举功能。
- source_word: אֲשֶׁר הֶגְלָה
  choice: 掳走
  rationale: הֶגְלָה 是 גלה 的使役式，表示使人离乡、被迁往异地；“掳走”简洁体现强制迁移，并符合本节历史语境。
- source_word: נְבוּכַדְרֶאצַּר
  choice: 尼布甲尼撒
  rationale: 采用现代中文圣经及历史叙述中通行的巴比伦王名译法。
- source_word: בִּשְׁנַת שֶׁבַע
  choice: 第七年
  rationale: 原文用基数词表达序数意义；“第七年”是自然准确的中文表达。上下文表明是尼布甲尼撒在位第七年，因此正文无需增补原文未明说的所属语。
- source_word: יְהוּדִים
  choice: 犹大人
  rationale: 此处指来自犹大国或犹大地区的人；“犹大人”比可能偏重后期宗教族群含义的“犹太人”更贴合流亡时期的地理—政治语境。
- source_word: שְׁלֹשֶׁת אֲלָפִים וְעֶשְׂרִים וּשְׁלֹשָׁה
  choice: 三千零二十三名
  rationale: 准确表达原文相加式数字，并用“名”自然计数人员。
