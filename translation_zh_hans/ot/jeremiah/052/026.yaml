  yaml_path: translation/ot/jeremiah/052/026.yaml
  text: Nebuzaradan[a], the captain of the guard[b], took them and brought them to the king of Babylon at Riblah.
translation:
  language: zh_hans
  text: 护卫长尼布撒拉旦带走了他们，又领他们到利比拉的巴比伦王那里。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקַּח
  choice: 拿住
  rationale: לקח在叙事中基本义为“拿、带走”；此处对象是被拘押的官员，用“拿住”既符合语境，也不额外强化为“逮捕”或“掳走”。
- source_word: אוֹתָם
  choice: 他们
  rationale: 直接宾语代词，回指上一节所列的人物。
- source_word: נְבוּזַרְאֲדָן
  choice: 尼布撒拉旦
  rationale: 采用现代中文圣经中通行且易于辨认的人名音译。
- source_word: רַב טַבָּחִים
  choice: 护卫长
  rationale: 字面涉及“屠宰者／行刑者之长”，但在王室语境中是官衔，指王室护卫的统领，也可能兼有执行死刑的职责；“护卫长”自然、简洁且不过度收窄含义。
- source_word: וַיֹּלֶךְ
  choice: 带到
  rationale: הלך的使役形式在“宾语＋目的地”结构中表示使其前往，即“带领／带到”；此处“带到”适合押送人员去见君王的语境。
- source_word: אֶל מֶלֶךְ בָּבֶל
  choice: 到……巴比伦王那里
  rationale: אֶל直接表达朝向或目的地；译为“到……那里”保留原文关系，不增添“带到王面前”的解释。
- source_word: רִבְלָתָה
  choice: 在利比拉
  rationale: 地名带方向词尾，但在句法和叙事语境中可自然理解为说明巴比伦王所在之处；中文译作“在利比拉的巴比伦王”清楚而自然。
