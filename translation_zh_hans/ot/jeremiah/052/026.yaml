- from: 护卫长尼布撒拉旦把他们拿住，带到在利比拉的巴比伦王那里。
  to: 护卫长尼布撒拉旦带走了他们，又领他们到利比拉的巴比伦王那里。
  rationale: 修订以“带走了……又领……到……”分别对应“取了他们”和“使他们前往／带他们到”，避免“拿住”的额外逮捕意味。将地点置于“巴比伦王”前的属地结构中，使中文更顺畅，同时不必在正文中判定地点词尾究竟只表示方向还是兼表君王所在之处。
