translation_notes:
  register: 采用庄重而通顺的现代标准汉语。以“护卫长”表达王室官衔，以免字面译作“屠夫长”造成误解；句子保持简洁的历史叙事风格。原文无须借助脚注才能保留的关键歧义，因此正文未设脚注。
