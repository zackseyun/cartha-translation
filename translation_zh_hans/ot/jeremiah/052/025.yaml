  text: וּ/מִן הָ/עִ֡יר לָקַח֩ סָרִ֨יס אֶחָ֜ד אֲֽשֶׁר הָיָ֥ה פָקִ֣יד עַל אַנְשֵׁ֣י הַ/מִּלְחָמָ֗ה וְ/שִׁבְעָ֨ה אֲנָשִׁ֜ים מֵ/רֹאֵ֤י פְנֵי הַ/מֶּ֨לֶךְ֙ אֲשֶׁ֣ר נִמְצְא֣וּ בָ/עִ֔יר וְ/אֵ֗ת סֹפֵר֙ שַׂ֣ר הַ/צָּבָ֔א הַ/מַּצְבִּ֖א אֶת עַ֣ם הָ/אָ֑רֶץ וְ/שִׁשִּׁ֥ים אִישׁ֙ מֵ/עַ֣ם הָ/אָ֔רֶץ הַֽ/נִּמְצְאִ֖ים בְּ/ת֥וֹךְ הָ/עִֽיר־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/052/025.yaml
  text: And from the city he took one court official who had been appointed over the men of war[a], and seven men from those who saw the king’s face, who were found in the city, and the scribe of the commander of the army, who mustered the people of the land, and sixty men from the people of the land who were found within the city.
translation:
  language: zh_hans
  text: 他从城中带走一名宫廷官员[a]，这人负责管理作战人员；又带走七名得见王面的人[b]，他们当时都在城里；还带走军队统帅的文书官，就是征集当地民众的那人，以及当时在城中的六十名当地民众。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “宫廷官员”也可译作“宦官”；原词既可指宦官，也可泛指王室官员。
    reason: 保留סָרִיס所指身份的词义歧义，避免正文武断认定其身体状况。
  - marker: b
    text: “得见王面的人”是宫廷用语，指有资格直接觐见君王、在王身边任职的人。
    reason: 解释希伯来语宫廷惯用语，同时在正文中保留其原有形象。
lexical_decisions:
- source_word: סָרִיס
  choice: 宫廷官员
  rationale: 该词既可特指宦官，也可泛指王室官员。此处重在其军事管理职务，正文采用不武断认定其身体身份的“宫廷官员”，并以脚注保留另一可能。
- source_word: פָקִיד
  choice: 负责统领
  rationale: 该词指受委派管理或监督的人；“负责统领”自然表达其受命管辖作战人员的职权。
- source_word: אַנְשֵׁי הַמִּלְחָמָה
  choice: 作战的人员
  rationale: 保留“战争之人”的军事含义，同时采用现代汉语中清楚自然的表达，避免把其组织身份过度限定为职业士兵。
- source_word: מֵרֹאֵי פְנֵי הַמֶּלֶךְ
  choice: 得见王面的人
  rationale: 正文保留“见王的面”这一宫廷惯用语及其庄重色彩，脚注说明它指有资格直接觐见君王、亲近侍奉的人。
- source_word: סֹפֵר שַׂר הַצָּבָא
  choice: 军队统帅的书记
  rationale: 按希伯来语属格结构，指隶属于军队统帅的书记或文书官；此译保留原文职称关系。
- source_word: הַמַּצְבִּא
  choice: 征召……入伍
  rationale: 使役分词在此指召集或征募人员服军役；“征召入伍”明确传达军事行政语境。
- source_word: עַם הָאָרֶץ
  choice: 本地百姓
  rationale: 该固定表达可指该地民众，并可能带有社会政治含义；“本地百姓”在现代汉语中自然，又不过度限定为某一阶层。
- source_word: בְּתוֹךְ הָעִיר
  choice: 在城中
  rationale: 简洁自然地表达原文“在城里面”的地点强调。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。并列结构以分号分隔，使被带走的各组人员层次清楚；避免使用过度古雅的“战士”“王前侍臣”等表达，也不把含义可能较广的职称和社会称谓过度具体化。
