  text: וְ/הָ/עַמּוּדִ֗ים שְׁמֹנֶ֨ה עֶשְׂרֵ֤ה אַמָּה֙ קומה הָ/עַמֻּ֣ד הָ/אֶחָ֔ד וְ/ח֛וּט שְׁתֵּים עֶשְׂרֵ֥ה אַמָּ֖ה יְסֻבֶּ֑/נּוּ וְ/עָבְי֛/וֹ אַרְבַּ֥ע אַצְבָּע֖וֹת נָבֽוּב־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/052/021.yaml
  text: As for the pillars[a], the height of each pillar was eighteen cubits, and a line of twelve cubits would go around it; its thickness was four fingers, and it was hollow.
translation:
  language: zh_hans
  text: 至于这些柱子，每根柱子高十八肘；用一条十二肘长的绳子可绕柱子一周。柱壁厚四指[a]，里面是空的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“四指宽”。希伯来文直译为“四指”，这里以手指的宽度作为长度单位。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָעַמּוּדִים
  choice: 至于这些柱子
  rationale: 在器物清单和描写语境中，以“至于”自然引出两根柱子的尺寸；“这些柱子”保留定冠词和复数所指。
- source_word: שְׁמֹנֶה עֶשְׂרֵה אַמָּה קומה הָעַמֻּד הָאֶחָד
  choice: 每根柱子高十八肘
  rationale: 希伯来文直译为“一根柱子的高度是十八肘”；上下文谈两根柱子共有的规格，现代汉语用“每根”简洁自然。
- source_word: חוּט
  choice: 绳子
  rationale: חוּט指绳、线；在环绕测量柱子周长的语境中，“绳子”具体而自然，又不必额外加入原文没有明说的“测量”。
- source_word: שְׁתֵּים עֶשְׂרֵה אַמָּה יְסֻבֶּנּוּ
  choice: 用一条十二肘长的绳子可绕柱子一周
  rationale: 保留“绳子环绕它”的形象，并清楚表达周长为十二肘；“可绕……一周”符合尺寸说明的汉语表达。
- source_word: עָבְיוֹ
  choice: 柱壁厚
  rationale: 柱子既被说明为空心，此处指构成柱身之材料的厚度；译作“柱壁厚”比笼统的“厚度”更清楚，同时不改变实物描述。
- source_word: אַרְבַּע אַצְבָּעוֹת
  choice: 四指
  rationale: 直译希伯来文以人体为基础的长度单位“指”，并以脚注说明现代读者可能需要的计量含义。
- source_word: נָבוּב
  choice: 里面是空的
  rationale: 准确表达柱子为空心；现代汉语自然明白，且与前面的柱壁厚度相呼应。
theological_decisions: []
