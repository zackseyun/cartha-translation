base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/052/001.yaml
  text: Zedekiah was twenty-one years old when he became king[a], and he reigned eleven years in Jerusalem[b]. His mother’s name was Hamutal the daughter of Jeremiah of Libnah.
translation:
  language: zh_hans
  text: 西底家登基[a]时二十一岁，在耶路撒冷作王十一年。他母亲名叫哈慕她，是立拿人[b]耶利米的女儿。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“开始作王时”。
    reason: lexical_alternative
  - marker: b
    text: “立拿人”也可译作“来自立拿的”。
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן עֶשְׂרִים וְאַחַת שָׁנָה
  choice: 二十一岁
  rationale: 这是希伯来语表达年龄的惯用语；译为现代汉语“二十一岁”自然且准确。
- source_word: בְמָלְכוֹ
  choice: 登基时
  rationale: 介词 בְּ 加动词 מָלַךְ 的不定式附属形，在此标明开始作王的时间；“登基时”简洁地表达即位之际。
- source_word: מָלַךְ
  choice: 作王
  rationale: 该动词表示执掌王权、统治；“作王”符合中文圣经历史叙事的庄重语体。
- source_word: בִּירוּשָׁלִָם
  choice: 在耶路撒冷
  rationale: 介词 בְּ 在此为地点用法，直接译作“在”。
- source_word: וְשֵׁם אִמּוֹ
  choice: 他母亲名叫
  rationale: 以自然的现代汉语表达原文的家谱式身份说明，并由句间衔接承载原文的连接词。
- source_word: חמיטל
  choice: 哈慕她
  rationale: 按中文圣经中通行的人名译法音译该希伯来名字。
- source_word: בַּת יִרְמְיָהוּ
  choice: 耶利米的女儿
  rationale: 准确表达希伯来语标准的父女关系结构。
- source_word: מִלִּבְנָה
  choice: 立拿人
  rationale: 介词 מִן 加地名指出耶利米的来源地；中文以“立拿人”自然表达其籍贯，同时保留“来自立拿”的可能理解于注释中。
