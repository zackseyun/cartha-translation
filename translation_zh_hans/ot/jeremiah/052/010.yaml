  text: וַ/יִּשְׁחַ֧ט מֶֽלֶךְ בָּבֶ֛ל אֶת בְּנֵ֥י צִדְקִיָּ֖הוּ לְ/עֵינָ֑י/ו וְ/גַ֛ם אֶת כָּל שָׂרֵ֥י יְהוּדָ֖ה שָׁחַ֥ט בְּ/רִבְלָֽתָ/ה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/052/010.yaml
  text: Then the king of Babylon slaughtered the sons of Zedekiah before his eyes[a], and he also slaughtered all the officials of Judah at Riblah.
translation:
  language: zh_hans
  text: 巴比伦王当着西底家的面杀了他的众子，又在利比拉杀了犹大所有的官员[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“首领”。希伯来语 שָׂרֵי 可指高级统治者、官员或首领。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁחַט / שָׁחַט
  choice: 杀了
  rationale: 该动词表示宰杀或杀死，此处指残酷处决。现代汉语用“杀了”自然、直接，并在两处重复，以保留原文的用词呼应；上下文本身充分传达其残酷性。
- source_word: מֶלֶךְ בָּבֶל
  choice: 巴比伦王
  rationale: 准确表达属格结构，简洁而符合现代汉语的历史叙事用语。
- source_word: בְּנֵי צִדְקִיָּהוּ
  choice: 西底家的众子
  rationale: בְּנֵי明确指儿子；“众子”既保留复数，也比泛称“孩子”更准确。
- source_word: לְעֵינָיו
  choice: 当着西底家的面
  rationale: 希伯来语字面为“在他眼前”，强调西底家亲眼目睹。汉语明确说出所指对象，避免代词歧义，同时保留现场目睹的含义。
- source_word: וְגַם
  choice: 又
  rationale: “又”自然表达原文的连接和递加强调。
- source_word: כָּל שָׂרֵי יְהוּדָה
  choice: 犹大所有的官员
  rationale: שָׂרֵי可指高阶统治者、官员或首领；“官员”在现代汉语中清楚表达犹大掌权阶层，又不限定为世袭王族。
- source_word: בְּרִבְלָתָה
  choice: 在利比拉
  rationale: 按地名音译，并用“在”自然表达处所。
theological_decisions: []
