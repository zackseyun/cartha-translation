base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/052/011.yaml
  text: Then he blinded Zedekiah’s eyes[a], bound him with bronze shackles, and the king of Babylon brought him to Babylon and put him in the house of custody until the day of his death.
translation:
  language: zh_hans
  text: 巴比伦王弄瞎了西底家的眼睛，用铜镣锁住他，又把他带到巴比伦，关在拘禁所[a]里，直到他死的那一天。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“监牢”。原文直译为“看守之屋”。
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵינֵי צִדְקִיָּהוּ עִוֵּר
  choice: 挖瞎了西底家的双眼
  rationale: 原文明确说到西底家的“双眼”，动词意为“使失明”。“挖瞎”在现代汉语中自然、具体，也保留了原文所呈现的残酷行动。
- source_word: וַיַּאַסְרֵהוּ
  choice: 锁住他
  rationale: 动词基本义为“捆绑、束缚”；结合后面的铜制刑具，译作“锁住他”符合现代汉语表达。
- source_word: בַנְחֻשְׁתַּיִם
  choice: 用铜镣
  rationale: 该词指铜制的成对或复数拘束刑具。“铜镣”既保留材质，也清楚表达囚犯所戴的刑具。
- source_word: וַיְבִאֵהוּ ... בָּבֶלָה
  choice: 把他带到巴比伦
  rationale: 使役形式表示“带来、带去”，地名带方向词尾；译文用“带到巴比伦”准确而自然。
- source_word: בֵּית הַפְּקֻדֹּת
  choice: 拘禁所
  rationale: 此短语字面近于“看管之所”，指受看守、拘禁的地方。“拘禁所”保留其功能含义，又避免武断地把具体设施限定为通常意义上的监狱。
- source_word: עַד יוֹם מוֹתוֹ
  choice: 直到他死的那一天
  rationale: 保留原文“直到他死亡之日”的明确、庄重表达，比单纯译作“直到他死”更贴近原文节奏。
