  - severity: low
    issue: 脚注中的词义替代稍宽泛
    rationale: עֲרָבוֹת此处指平原、荒原或草原性地带；单说“旷野”容易偏向一般荒野。改作“草原地带”较能作为“平原”的有效词汇替代。
