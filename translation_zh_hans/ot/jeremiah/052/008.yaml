base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/052/008.yaml
  text: But the army of the Chaldeans pursued the king and overtook Zedekiah in the plains of Jericho[b][a], and all his army was scattered from him.
translation:
  language: zh_hans
  text: 迦勒底人的军队追赶王，在耶利哥平原[a]追上了西底家；他的全军都四散，离开了他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “平原”或译“草原地带”。
    reason: lexical_alternative
lexical_decisions:
- source_word: חֵיל כַּשְׂדִּים
  choice: 迦勒底人的军队
  rationale: חֵיל在此指军队；כַּשְׂדִּים按希伯来文本保留族群—政治称谓“迦勒底人”，不以语境性较强的“巴比伦人”替代。
- source_word: וַיִּרְדְּפוּ אַחֲרֵי הַמֶּלֶךְ
  choice: 追赶王
  rationale: רדף在军事叙事中表示追击；现代汉语可将אַחֲרֵי的方向关系自然融入“追赶”的宾语结构。
- source_word: וַיַּשִּׂיגוּ אֶת צִדְקִיָּהוּ
  choice: 追上了西底家
  rationale: נשׂג在追逐语境中意为赶上、追上；“追上”与前句衔接自然，也不额外明说抓获。
- source_word: בְּעַרְבֹת יְרֵחוֹ
  choice: 在耶利哥平原
  rationale: עֲרָבוֹת指平坦而较干旱的旷野或草原地带；正文用通俗的“平原”，脚注保留“旷野”的可能译法。
- source_word: וְכָל חֵילוֹ
  choice: 他的全军
  rationale: 后缀指西底家，חֵיל在此为集合名词，译作“全军”简洁且符合汉语军事叙事。
- source_word: נָפֹצוּ מֵעָלָיו
  choice: 都离开他，四散了
  rationale: נפץ在此表达军队溃散；מֵעָלָיו强调与西底家分离。“离开他，四散了”同时保留两层意义及原文复数谓语所呈现的众人分散感。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的历史叙事语体。“迦勒底人”保留原文称谓；“追上”不擅自扩充为“抓住”；末句以“离开他，四散了”体现军队成员各自溃散以及与王分离。
