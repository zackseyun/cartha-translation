  text: There were ninety-six pomegranates toward the outside[a]; all the pomegranates on the lattice all around were one hundred.
translation:
  language: zh_hans
  text: 朝外的一面有九十六个石榴[a]；格网四围的石榴总共有一百个。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “朝外的一面”：或译“朝外”“朝一个方向”，也可能是“迎风的一面”。此处希伯来文含义较难确定；经文似乎是说，从一面数有九十六个，而格网四围总共有一百个。
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרִמֹּנִים
  choice: 石榴
  rationale: 原词直指“石榴”，本节语境中是柱顶装饰上的石榴形饰物；正文保留原有形象，不扩译为“石榴形装饰”。
- source_word: תִּשְׁעִים וְשִׁשָּׁה
  choice: 九十六个
  rationale: 按希伯来文基数准确翻译，并加量词使现代汉语自然。
- source_word: רוּחָה
  choice: 朝外的一面
  rationale: 该词在这里含义困难，可能表示朝外、一个方向或迎风的一面；结合建筑物计数语境，“朝外的一面”较自然，也保留其方向性，具体歧义见脚注。
- source_word: כָּל הָרִמּוֹנִים מֵאָה
  choice: 所有的石榴，共有一百个
  rationale: 保留“所有”所表达的总数概念，同时用“共有”清楚呈现一百这一总计。
- source_word: הַשְּׂבָכָה
  choice: 格网
  rationale: 此词指柱顶的网状或格状装饰；“格网”简洁、具体，并适合建筑装饰语境。
- source_word: סָבִיב
  choice: 四围
  rationale: 表达环绕整个格网的空间意义，语言庄重而易懂。
