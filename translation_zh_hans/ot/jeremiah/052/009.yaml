base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/052/009.yaml
  text: They captured the king and brought him up to the king of Babylon at Riblah in the land of Hamath[a], and he passed sentence on him.
translation:
  language: zh_hans
  text: 他们抓住王，把他带到哈马地的利比拉、巴比伦王那里；巴比伦王就向他宣告判决[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“向他讲判决”，也可译作“向他宣布判决”。这是作出并宣布司法裁决的说法。
    reason: 说明希伯来语司法惯用语，并保留מִשְׁפָּטִים的字面表达。
lexical_decisions:
- source_word: וַיִּתְפְּשׂוּ
  choice: 抓住
  rationale: תפשׂ在此指军队擒获、抓住逃亡的王；“抓住”自然清楚，也保留原文动作的直接性。
- source_word: הַמֶּלֶךְ
  choice: 王
  rationale: 原文用定冠词指上文已经明确的犹大王，不补出专名，以保留原文的指称方式。
- source_word: וַיַּעֲלוּ אֹתוֹ אֶל
  choice: 把他押到……带到
  rationale: עלה使役式本有“使上去、带上去”之意；在押解俘虏的语境中，“押到……带到”符合现代汉语，并以地点结构清楚表达目的地。
- source_word: מֶלֶךְ בָּבֶל
  choice: 巴比伦王
  rationale: 准确表达希伯来语属格结构，也是现代汉语中自然、庄重的称谓。
- source_word: רִבְלָתָה
  choice: 利比拉
  rationale: 按地名音译；词尾的趋向形式通过“到”表达。
- source_word: בְּאֶרֶץ חֲמָת
  choice: 哈马地
  rationale: אֶרֶץ在这里指哈马所属的地域；“哈马地”简洁地保留地理名称及其区域含义。
- source_word: וַיְדַבֵּר אִתּוֹ מִשְׁפָּטִים
  choice: 对他宣判
  rationale: 字面为“与／向他讲判决”，是司法语境中的惯用表达。“对他宣判”在现代汉语中准确自然；脚注保留原文字面形式及复数色彩。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“押到”体现被俘后受押解的语境；后半句明确以“巴比伦王”为主语，避免汉语中连续两个“王”造成指代不清。脚注标记紧随其所解释的“宣判”。
