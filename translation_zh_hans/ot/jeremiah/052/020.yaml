id: JER.52.20
reference: Jeremiah 52:20
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: הָ/עַמּוּדִ֣ים שְׁנַ֗יִם הַ/יָּ֤ם אֶחָד֙ וְ/הַ/בָּקָ֞ר שְׁנֵים עָשָׂ֤ר נְחֹ֨שֶׁת֙ אֲשֶׁר תַּ֣חַת הַ/מְּכֹנ֔וֹת אֲשֶׁ֥ר עָשָׂ֛ה הַ/מֶּ֥לֶךְ שְׁלֹמֹ֖ה לְ/בֵ֣ית יְהוָ֑ה לֹא הָיָ֣ה מִשְׁקָ֔ל לִ/נְחֻשְׁתָּ֖/ם כָּל הַ/כֵּלִ֥ים הָ/אֵֽלֶּה׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/052/020.yaml
  text: As for the two pillars[a], the one Sea, and the twelve bronze oxen that were under the stands[b], which King Solomon had made for the house of Yahweh—there was no weighing the bronze of all these vessels.
translation:
  language: zh_hans
  text: 至于那两根柱子、一个“海”，以及十二只在座架下面的铜牛[a]，都是所罗门王为雅威的殿所造的。这一切器物的铜，重量没有计量[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “铜牛”也可译作“铜公牛”；这里的希伯来语可泛指牛类。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译为“它们的铜没有重量”。这可指这些铜没有称量，也可能指数量多得难以计量。
    reason: preserve_ambiguity
lexical_decisions:
- source_word: הָעַמּוּדִים שְׁנַיִם
  choice: 两根柱子
  rationale: עַמּוּדִים指建筑性的柱子；“柱子”符合现代汉语，也与圣殿陈设的语境相称。
- source_word: הַיָּם אֶחָד
  choice: 一个“海”
  rationale: 这里的יָם是圣殿中大型铜盆的专名；用引号标明其专名性质，并保留原文盘点式的“一个”。
- source_word: וְהַבָּקָר שְׁנֵים עָשָׂר נְחֹשֶׁת
  choice: 十二只铜牛
  rationale: בָּקָר可泛指牛或公牛；在圣殿器物语境中译作“铜牛”自然，并保留动物性别未必明确的空间。נְחֹשֶׁת按古代器物语境译为“铜”。
- source_word: אֲשֶׁר תַּחַת הַמְּכֹנוֹת
  choice: 在盆座下面
  rationale: מְכֹנוֹת指承托圣殿盆具的座架；“盆座”比单纯的“底座”更能交代其用途，同时忠实保留本节所述位置关系。
- source_word: אֲשֶׁר עָשָׂה הַמֶּלֶךְ שְׁלֹמֹה
  choice: 都是所罗门王……所造的
  rationale: 关系从句统摄前述器物；采用“所造的”使汉语句法清楚、庄重。
- source_word: לְבֵית יְהוָה
  choice: 为雅威的殿
  rationale: בֵית在此指圣殿，译作“殿”比直译“家”自然；神名יְהוָה音译为“雅威”，保留专名性质。
- source_word: לֹא הָיָה מִשְׁקָל לִנְחֻשְׁתָּם
  choice: 这一切器物的铜，无法称出重量
  rationale: 原文直译近于“它们的铜没有重量”，可表示未曾称量或多得难以计量；正文采用不武断限定原因的表达，并在脚注说明歧义。
- source_word: כָּל הַכֵּלִים הָאֵלֶּה
  choice: 这一切器物
  rationale: כֵּלִים在圣殿清单中泛指各样器具或物件；“器物”既自然又能涵盖柱子、铜海和铜牛。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文使用四字神名；正文以现代汉语音译“雅威”保留其作为专有圣名的性质，不以称号替代。
- issue: “没有重量”所表达的程度
  choice: 无法称出重量，并以脚注保留“未称量”或“难以计量”两种理解
  alternative: 没有称量；多得无法计算
  rationale: 希伯来语措辞本身并未明确说明是实际未称，还是数量庞大到难以计量；不应在正文中把其中一种解释定为唯一含义。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。以“至于”承接上下文的清单叙述；“海”加引号，提示它是圣殿大型铜盆的名称。脚注标记均置于其实际说明的词句之后。
