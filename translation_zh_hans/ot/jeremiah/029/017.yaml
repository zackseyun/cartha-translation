base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/029/017.yaml
  text: 'Thus says Yahweh of hosts: Behold[a], I am sending against them the sword, the famine, and the pestilence, and I will make them like rotten figs that cannot be eaten because of their badness.'
translation:
  language: zh_hans
  text: 万军之耶和华如此说：“看哪，我要使刀剑、饥荒和瘟疫临到他们；我要使他们像坏透了的无花果，坏得不能吃。[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “坏透了的无花果”也可译作“极坏的无花果”或“腐坏的无花果”；希伯来语形容这些果子坏到不能食用。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה צְבָאוֹת
  choice: 万军之耶和华
  rationale: 以“耶和华”音译圣名，以“万军之”保留称号的广度和庄严，不局限于地上的军队。
- source_word: הִנְנִי
  choice: 看哪
  rationale: 保留先知宣告中引人注意、强调行动迫近的指示语气。
- source_word: מְשַׁלֵּחַ בָּם
  choice: 我要使……临到他们
  rationale: 体现הִנְנִי加分词所表达的迫近行动，并按审判语境将介词ב理解为灾祸针对并临到他们。
- source_word: הַחֶרֶב אֶת הָרָעָב וְאֶת הַדָּבֶר
  choice: 刀剑、饥荒和瘟疫
  rationale: 保留先知书常见的三重审判公式；“刀剑”保存具体意象，“瘟疫”准确表达流行性灾病。
- source_word: וְנָתַתִּי אוֹתָם
  choice: 我要使他们像
  rationale: נתן与比较结构连用，在此表示使他们成为某种可鄙之物的样子；此译符合现代汉语。
- source_word: הַשֹּׁעָרִים
  choice: 坏透了的
  rationale: 该词表示极坏、令人厌恶；用于无花果时，“坏透了”自然地传达其败坏到不可食用的程度，同时避免把具体状态限定为仅仅“腐烂”。
- source_word: לֹא תֵאָכַלְנָה מֵרֹעַ
  choice: 坏得不能吃
  rationale: 将被动形式表达为实际不可食用，并保留מֵרֹעַ所说明的原因，即因其坏劣状态而不能吃。
theological_decisions:
- issue: 神圣名号יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 采用现代中文圣经读者最熟悉的传统音译“耶和华”，明确保留专名性质，不以“主”替代；原文的专名仍得到呈现。
- issue: 审判行动的时态与施事者
  choice: 我要使……临到他们
  alternative: 我正差遣……攻击他们
  rationale: 保留上帝亲自发动审判及行动迫近的意味，同时不把介词ב在“攻击”与“临到”之间的语义张力过度收窄。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“万军之耶和华如此说”保留先知宣告的正式语体；“看哪”略带庄严色彩，但在本段审判语境中清楚有力。脚注标记置于所解释的无花果比喻句末。
