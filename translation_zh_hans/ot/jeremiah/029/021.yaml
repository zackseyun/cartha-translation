revisions:
- from: 以色列的上帝、万军之雅威论到哥赖雅的儿子亚哈和玛西雅的儿子西底家，如此说：“他们奉我的名向你们预言谎言。看哪，我要把他们交在巴比伦王尼布甲尼撒[a]手中，他必当着你们的面击杀他们。”
  to: 万军之雅威、以色列的上帝论到哥赖雅的儿子亚哈和玛西雅的儿子西底家，如此说：“他们奉我的名向你们说虚假的预言。看哪，我要把他们交在巴比伦王尼布甲尼撒[a]手中；他必在你们眼前击打他们。”
  rationale: 修订依照希伯来文调整神名与称号的次序，将较不自然的“预言谎言”改为“说虚假的预言”，并把“击杀”收回为不预断死亡结果的“击打”。同时校正脚注对希伯来王名拼写的说明。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T07:28:58Z'
review_pass:
  verdict: revise
  source_fidelity: 译文整体准确传达了针对两名假先知的神谕、交付给巴比伦王及在收信人眼前施行惩罚的内容。但“击杀”把 וְהִכָּם（击打、打击）明确化为死亡，超过本节动词本身所表达的程度；虽然后文语境显示严厉审判，本节宜保留其较宽的措辞。神谕公式中的称号次序也宜按原文调整。
  naturalness: 原文“他们奉我的名向你们预言谎言”可以理解，但“说虚假的预言”在现代书面汉语中更自然，同时仍保留其虚假宣称神授权的意思。调整称号次序后，句首也更符合汉语圣经文体。
  terminology: “雅威”“万军之”“以色列的上帝”、人名的通行译法及“交在……手中”均可保留。脚注所列的希伯来名字拼写应改为更准确对应 Nebuchadrezzar 的“尼布甲尼列撒”，而非“尼布甲尼利撒”。
  issues:
  - severity: medium
    issue: “击杀他们”将 וְהִכָּם 限定为杀死。
    rationale: נכה 的基本意义是击打、打击；本节未由该动词本身明说杀死。应避免因邻近语境而在本节预先加入致死的明确断言。
  - severity: low
    issue: 神谕公式中“万军之雅威”与“以色列的上帝”的次序和停顿不够贴合原文。
    rationale: 原文先称“万军之雅威”，后加“以色列的上帝”；按此顺序译出更清晰庄重。
  - severity: medium
    issue: 脚注中的“尼布甲尼利撒”未准确对应希伯来文所反映的 Nebuchadrezzar 拼写。
    rationale: 应使用“尼布甲尼列撒”（或直接注明 Nebuchadrezzar）来说明与通行名“尼布甲尼撒”的拼写差异。
  revised_text: 万军之雅威、以色列的上帝论到哥赖雅的儿子亚哈和玛西雅的儿子西底家，如此说：“他们奉我的名向你们说虚假的预言。看哪，我要把他们交在巴比伦王尼布甲尼撒[a]手中；他必在你们眼前击打他们。”
  revised_footnotes:
