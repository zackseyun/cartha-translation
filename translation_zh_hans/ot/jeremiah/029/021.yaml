source:
  edition: WLC
  text: כֹּֽה אָמַר֩ יְהוָ֨ה צְבָא֜וֹת אֱלֹהֵ֣י יִשְׂרָאֵ֗ל אֶל אַחְאָ֤ב בֶּן קֽוֹלָיָה֙ וְ/אֶל צִדְקִיָּ֣הוּ בֶן מַֽעֲשֵׂיָ֔ה הַֽ/נִּבְּאִ֥ים לָ/כֶ֛ם בִּ/שְׁמִ֖/י שָׁ֑קֶר הִנְ/נִ֣י נֹתֵ֣ן אֹתָ֗/ם בְּ/יַד֙ נְבֽוּכַדְרֶאצַּ֣ר מֶֽלֶךְ בָּבֶ֔ל וְ/הִכָּ֖/ם לְ/עֵינֵי/כֶֽם־־־־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/029/021.yaml
  text: 'Thus says Yahweh of hosts[a], the God of Israel, concerning Ahab son of Kolaiah and Zedekiah son of Maaseiah, who are prophesying a lie to you in my name: Behold, I am giving them into the hand of Nebuchadnezzar king of Babylon, and he will strike them down before your eyes.'
translation:
  language: zh_hans
  text: 万军之雅威、以色列的上帝论到哥赖雅的儿子亚哈和玛西雅的儿子西底家，如此说：“他们奉我的名向你们说虚假的预言。看哪，我要把他们交在巴比伦王尼布甲尼撒[a]手中；他必在你们眼前击打他们。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文的拼写相当于“尼布甲尼列撒”（Nebuchadrezzar）；“尼布甲尼撒”是中文圣经中通行的译名。
    reason: 说明希伯来文本中该王名的拼写与中文通行译名之间的差异。
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: 如此说
  rationale: 保留先知传信公式的庄重语气，同时符合现代汉语表达。
- source_word: יְהוָה צְבָאוֹת
  choice: 万军之雅威
  rationale: 以“雅威”音译上帝的专名，以“万军之”保留其统领天上众军并拥有至高权能的称号含义，不将其局限为人间军队。
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: 以色列的上帝
  rationale: 直接呈现原文的属格结构与身份说明。
- source_word: אֶל
  choice: 论到
  rationale: 此处引出神谕所针对的人，而不是向二人直接说话；“论到”自然地表达这一关系。
- source_word: הַנִּבְּאִים לָכֶם בִּשְׁמִי שָׁקֶר
  choice: 他们奉我的名向你们预言谎言
  rationale: 分词表示持续进行的活动；“奉我的名”表达声称得到神授权，“预言谎言”则保留原文将 שָׁקֶר 作为所预言内容的鲜明措辞。
- source_word: הִנְנִי
  choice: 看哪，我要
  rationale: “看哪”保留郑重而强调的宣告公式；结合后续分词，以“我要”表达即将施行的行动。
- source_word: נֹתֵן אֹתָם בְּיַד
  choice: 把他们交在……手中
  rationale: 保留希伯来语“交在某人手中”的权力意象，同时在现代汉语中清楚可懂。
- source_word: וְהִכָּם
  choice: 他必……击杀他们
  rationale: נכה 在此语境中指巴比伦王对二人施加致命打击；“击杀”保持审判的严重性，又不额外说明具体处刑方式。
- source_word: לְעֵינֵיכֶם
  choice: 当着你们的面
  rationale: 自然表达“在你们眼前”，突出收信群体将亲眼见证此事。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 采用较贴近学界通常重构读音 Yahweh 的现代汉语音译，明确保留神的专名，而不以“主”等称号替代。
- issue: 称号 צְבָאוֹת 的范围
  choice: 万军之
  alternative: 万军的／天军之
  rationale: 保留传统且庄重的表达，不把“众军”的所指单独限定为以色列军队、列国军队或天上军队。
- issue: 审判动词 וְהִכָּם 的力度
  choice: 击杀他们
  alternative: 击打他们／杀死他们
  rationale: 上下文所预告的是借巴比伦王施行的严厉乃至致命审判；“击杀”传达这一力度，同时不添加原文没有交代的处刑细节。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。保留“如此说”“看哪”“交在……手中”等先知文体和希伯来意象；人名沿用中文圣经常见译法。脚注标记置于其实际说明的“尼布甲尼撒”之后。
