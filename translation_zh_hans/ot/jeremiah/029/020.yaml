revisions:
- from: 但你们所有被我从耶路撒冷遣送到巴比伦的流亡者，要听耶和华的话。
  to: 但你们，就是我从耶路撒冷送到巴比伦去的所有流亡者，要听耶和华的话。
  rationale: 修订仅将可能过强的“遣送”改为中性的“送到”，并调整语序以提升现代汉语的清晰度。保留转折、命令语气、集合性受众、第一人称施事者、地点方向和“耶和华的话”。
