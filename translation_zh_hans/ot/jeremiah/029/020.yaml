  text: וְ/אַתֶּ֖ם שִׁמְע֣וּ דְבַר יְהוָ֑ה כָּל הַ֨/גּוֹלָ֔ה אֲשֶׁר שִׁלַּ֥חְתִּי מִ/ירוּשָׁלִַ֖ם בָּבֶֽלָ/ה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/029/020.yaml
  text: But you, all the exiles whom I sent from Jerusalem to Babylon, hear the word of Yahweh.
translation:
  language: zh_hans
  text: 但你们，就是我从耶路撒冷送到巴比伦去的所有流亡者，要听耶和华的话。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאַתֶּם
  choice: 但你们
  rationale: 连词与独立代词合用，在这里标示话语对象的转折；“但你们”既自然，也保留与上文的对比。
- source_word: שִׁמְעוּ
  choice: 要听
  rationale: 该命令式首先表示“听”；中文“要听耶和华的话”保留先知宣告的固定语感，也不把其中可能含有的顺服意味直接明说。
- source_word: דְבַר יְהוָה
  choice: 耶和华的话
  rationale: 保留“话”这一先知传统中的核心表达，并将四字神名按现代中文圣经中通行而庄重的形式译作“耶和华”。
- source_word: כָּל הַגּוֹלָה
  choice: 所有……流亡者
  rationale: 原文使用单数形式的集合名词，指整个被掳群体；“所有……流亡者”在现代汉语中自然清楚，并体现集合意义。
- source_word: אֲשֶׁר שִׁלַּחְתִּי
  choice: 被我……遣送
  rationale: שׁלח 的基本义是“差遣、送走”；在流亡语境中，“遣送”表达被送往异地的事实，同时避免强化为原文未明说的“驱逐”。
- source_word: מִירוּשָׁלִַם בָּבֶלָה
  choice: 从耶路撒冷……到巴比伦
  rationale: 分别准确表达起点介词与指向巴比伦的方向词尾。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。中文正文采用读者最熟悉、庄重且明确作为专名的“耶和华”，而不以“主”这一称号替代；“雅威”是较贴近学术重构读音的另一译法。
- issue: 流亡是由谁施行
  choice: 被我……遣送
  alternative: 被人……掳走
  rationale: 原文第一人称动词明确把这一行动归于说话的耶和华，形成重要的神学张力；译文不将施事者改为巴比伦人，也不淡化神的主权。
translation_notes:
  register: 采用现代、庄重、易懂的标准普通话。保留命令语气及“耶和华的话”这一先知性表达；关系从句前置修饰“流亡者”，符合自然汉语句法。
