  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כִּי֩ כֹ֨ה אָמַ֜ר יְהוָ֤ה צְבָאוֹת֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל אַל יַשִּׁ֧יאוּ לָ/כֶ֛ם נְבִֽיאֵי/כֶ֥ם אֲשֶׁר בְּ/קִרְבְּ/כֶ֖ם וְ/קֹֽסְמֵי/כֶ֑ם וְ/אַֽל תִּשְׁמְעוּ֙ אֶל חֲלֹמֹ֣תֵי/כֶ֔ם אֲשֶׁ֥ר אַתֶּ֖ם מַחְלְמִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/029/008.yaml
  text: 'For thus says Yahweh of hosts[a], the God of Israel: Do not let your prophets who are among you and your diviners deceive you, and do not listen to your dreams that you are causing to be dreamed.'
translation:
  language: zh_hans
  text: 因为以色列的上帝、万军之耶和华如此说：“不要让你们中间的先知和你们的占卜者欺骗你们，也不要听信你们所促成的梦[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“你们所做的梦”。希伯来语的表达较难确定，既可能指他们自己所做的梦，也可能指他们在某种意义上促成或使其出现的梦。
    reason: 保留 חלם 使役式罕见用法所产生的词义与句法歧义，避免将未明示的受使役者具体化。
lexical_decisions:
- source_word: יְהוָה צְבָאוֹת
  choice: 万军之耶和华
  rationale: 以“耶和华”音译神的专名，并用汉语圣经语体中清楚而庄重的“万军之”表达 צְבָאוֹת；不将其限缩为地上的军队。
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: 以色列的上帝
  rationale: 直接保留原文的属格结构和上帝与以色列的关系性称谓。
- source_word: אַל יַשִּׁיאוּ לָכֶם
  choice: 不要让……欺骗你们
  rationale: 表达 נשׁא 的使役式在此使人受骗、被误导之意，同时保留原句“不要让”的劝禁结构。
- source_word: נְבִיאֵיכֶם אֲשֶׁר בְּקִרְבְּכֶם
  choice: 你们中间的先知
  rationale: 自然简洁地表达这些先知身处被掳群体内部；“你们的”已由“你们中间的”充分体现。
- source_word: קֹסְמֵיכֶם
  choice: 占卜者
  rationale: 准确指从事占卜的人，现代读者容易理解，也避免较古旧或范围过宽的称呼。
- source_word: וְאַל תִּשְׁמְעוּ אֶל
  choice: 也不要听信
  rationale: 此处不只是听见，而是听从、信从；“听信”在现代汉语中自然传达这一语用含义。
- source_word: חֲלֹמֹתֵיכֶם אֲשֶׁר אַתֶּם מַחְלְמִים
  choice: 你们使人梦见的梦
  rationale: מַחְלְמִים 是 חלם 的使役式分词，措辞罕见。“使人梦见”保留可能的使役意味，但不擅自断定受使役者是谁；另在脚注保留非使役理解。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 采用现代中文读者最熟悉的专名音译“耶和华”，不以“主”这一称号替代原文神名；“雅威”是较接近学术重构读音的可行替代。
- issue: 末句使役式的理解
  choice: 你们使人梦见的梦
  alternative: 你们所做的梦
  rationale: 原文使用罕见的使役式，可能表示百姓在某种意义上促成、滋养或使这些梦出现；正文保留这一张力，同时以脚注说明它也可能是较普通的“做梦”表达，不确定具体受使役对象。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。神谕引语使用自然标点；“万军之耶和华”保留传统圣经语体的庄严感。“使人梦见的梦”略带不寻常感，是为忠实呈现原文罕见使役式，而非将其顺滑化。
