  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: תַּ֛חַת אֲשֶֽׁר לֹא שָׁמְע֥וּ אֶל דְּבָרַ֖/י נְאֻם יְהוָ֑ה אֲשֶׁר֩ שָׁלַ֨חְתִּי אֲלֵי/הֶ֜ם אֶת עֲבָדַ֤/י הַ/נְּבִאִים֙ הַשְׁכֵּ֣ם וְ/שָׁלֹ֔חַ וְ/לֹ֥א שְׁמַעְתֶּ֖ם נְאֻם יְהוָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/029/019.yaml
  text: because they did not listen to my words[a], declares Yahweh, which I sent to them by my servants the prophets, rising early and sending them, and you did not listen[b], declares Yahweh.
translation:
  language: zh_hans
  text: 因为他们没有听从我的话——这是雅威的宣告——我不断地差遣我的仆人众先知到他们那里去传达这些话，你们却没有听从——这是雅威的宣告。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תַּחַת אֲשֶׁר
  choice: 因为
  rationale: 该结构承接上一节，说明审判的原因；“因为”自然、准确地保留因果关系。
- source_word: שָׁמְעוּ / שְׁמַעְתֶּם
  choice: 不听 / 不听
  rationale: שׁמע与אֶל连用，不只是听见，更有听从、理会之意；“不听”既保留听觉意象，也不把含义收窄为单纯的“不顺从”。
- source_word: אֶל דְּבָרַי
  choice: 我的话
  rationale: 中文“我的话”可自然涵盖希伯来文复数“我的言语”，避免生硬的“我的话语们”，同时保留具体言说的含义。
- source_word: נְאֻם יְהוָה
  choice: 雅威宣告 / 这是雅威的宣告
  rationale: 保留庄严的先知性宣告公式；按原文直接译出神名יְהוָה为“雅威”。第二处调整语序，使现代汉语自然。
- source_word: שָׁלַחְתִּי אֲלֵיהֶם אֶת עֲבָדַי הַנְּבִאִים
  choice: 我借着我的仆人众先知传给他们的话
  rationale: 原文直陈差派先知到他们那里；结合“我的话”的关系从句，中文用“借着……传给”清楚表达神的话由受差遣的先知传达。“众先知”保留复数和同位关系。
- source_word: הַשְׁכֵּם וְשָׁלֹחַ
  choice: 我一次又一次地差派他们
  rationale: 这是“早起并差派”的希伯来习语，强调殷切而反复地差派。正文采用清楚的现代汉语表达其语用意义，脚注保留字面意象。
- source_word: וְלֹא שְׁמַעְתֶּם
  choice: 你们却不听
  rationale: 保留马所拉文本由第三人称“他们”转为第二人称复数“你们”的突变；“却”自然体现上下文中的转折和责备。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文使用四字神名；“雅威”直接音译该专名，不以称号代替，也不引入“耶和华”这一较晚形成的混合读法。
- issue: 从第三人称转为第二人称
  choice: 保留“他们不听……你们却不听”
  alternative: 统一译成“他们”或统一译成“你们”
  rationale: 原文确有这一人称转换，可能具有直接质问听众的修辞作用；保留转换，避免擅自消除文本张力。
- issue: “早起并差派”的表达
  choice: 正文译出习语意义，脚注保留字面形式
  alternative: 正文直译“早早起来差派”
  rationale: 若在中文正文中照字面翻译，容易被理解为描述神每天清晨起床；采用“反复差派”的意义，并以脚注呈现原有意象，兼顾可懂性和源文本透明度。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。破折号标示插入的宣告公式，分号呈现句内推进。正文优先传达希伯来习语的实际意义，脚注补充其字面形式；不消除第三人称到第二人称的突变。
