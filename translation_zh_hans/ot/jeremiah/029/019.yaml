revisions:
- from: 因为他们不听我的话——雅威宣告——就是我借着我的仆人众先知传给他们的话；我一次又一次地差派他们[a]，你们却不听[b]。这是雅威的宣告。
  to: 因为他们没有听从我的话——这是雅威的宣告——我不断地差遣我的仆人众先知到他们那里去传达这些话，你们却没有听从——这是雅威的宣告。
  rationale: 修订恢复“不断地差遣”所指向的对象，即“我的仆人众先知”，并明确先知被差到“他们那里”传达雅威的话。两处宣告公式和第三人称转第二人称的张力均予以保留。脚注a继续提供习语的字面译法，脚注b继续说明人称转换。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T07:28:55Z'
review_pass:
  verdict: revise
  source_fidelity: 草稿正确保留了因果关系、两处“雅威宣告”公式，以及从“他们”转为“你们”的人称突变。但“我一次又一次地差派他们”将“他们”误指为前面的受话者；按希伯来文，受差遣的是“我的仆人众先知”，他们是被差到“他们那里”的。此外，原文的“我差遣……先知”应与前面的“我的话”相连，说明这些话借先知被传达给他们。
  naturalness: “就是我借着我的仆人众先知传给他们的话；我一次又一次地差派他们”句法衔接较绕，且“他们”的指代含混。改为“我不断地差遣我的仆人众先知到他们那里去传达这些话”，在现代庄重汉语中更清楚自然。
  terminology: “雅威”“我的仆人众先知”“不听从”均适切。“不听从”比单独的“不听”更明确传达 שׁמע אל 所含的留心、听从意味，仍未把它过度限定为技术性的“顺服”。保留“雅威的宣告”作为 נְאֻם יְהוָה 的公式译法。
  issues:
  - severity: high
    issue: “我一次又一次地差派他们”误置了“差派”的对象。
    rationale: הַשְׁכֵּם וְשָׁלֹחַ 延续“我差遣我的仆人众先知到他们那里”的行动；“他们”是先知被差往的对象/受话群体，而不是被反复差派的人。现译会使中文读者理解为雅威反复差派“他们”（受审判者）。
  - severity: medium
    issue: 关系从句与后续分句的连接使“我的话”经由先知传达的关系不够清晰。
    rationale: אֲשֶׁר 可引出与“我的话”相关的说明；中文宜明确雅威差遣先知到他们那里传达这些话，同时不额外断言原文未明说的细节。
  revised_text: 因为他们没有听从我的话——这是雅威的宣告——我不断地差遣我的仆人众先知到他们那里去传达这些话，你们却没有听从——这是雅威的宣告。
  revised_footnotes:
  - marker: a
    text: 希伯来文直译为“早起并差遣”，这是表示殷切而不断重复行动的习语；也可译作“不断地差遣”或“一再差遣”。
    reason: 说明希伯来习语的字面意象及其在上下文中强调持续、殷切差遣先知的含义。
  - marker: b
    text: 希伯来文先说“他们没有听从”，随后转为直接对听众说“你们却没有听从”；本译保留了这一人称转换。
    reason: 提示原文显著的人称转换及其可能的修辞作用。
  revision_rationale: 修订恢复“不断地差遣”所指向的对象，即“我的仆人众先知”，并明确先知被差到“他们那里”传达雅威的话。两处宣告公式和第三人称转第二人称的张力均予以保留。脚注a继续提供习语的字面译法，脚注b继续说明人称转换。
