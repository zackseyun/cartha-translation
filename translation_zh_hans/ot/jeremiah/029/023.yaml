  text: יַ֡עַן אֲשֶׁר֩ עָשׂ֨וּ נְבָלָ֜ה בְּ/יִשְׂרָאֵ֗ל וַ/יְנַֽאֲפוּ֙ אֶת נְשֵׁ֣י רֵֽעֵי/הֶ֔ם וַ/יְדַבְּר֨וּ דָבָ֤ר בִּ/שְׁמִ/י֙ שֶׁ֔קֶר אֲשֶׁ֖ר ל֣וֹא צִוִּיתִ֑/ם וְ/אָנֹכִ֛י הו ידע וָ/עֵ֖ד נְאֻם יְהוָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/029/023.yaml
  text: because they have committed an outrageous act in Israel[a], and have committed adultery with their neighbors’ wives, and have spoken in my name a lie that I did not command them. And I am the one who knows and is a witness[c][b], declares Yahweh.
translation:
  language: zh_hans
  text: 因为他们在以色列中做了可耻的事[a]，与同伴的妻子通奸，又奉我的名说我没有吩咐他们说的谎话。我就是那位知道、又作见证的[b]。这是雅威的宣告。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “可耻的事”也可译作“可憎的事”或“愚妄的恶行”。希伯来语 נְבָלָה 指在道德上严重可耻、可憎的行为。
    reason: lexical_alternative
  - marker: b
    text: 也可译作：“我知道，我是见证者。”原文以强调式表达突出“我”，并将“知道”与“见证者”并列。
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעַן אֲשֶׁר
  choice: 因为
  rationale: 承接上一节的审判，明确表达原因，符合现代汉语习惯。
- source_word: עָשׂוּ נְבָלָה
  choice: 做了可耻的事
  rationale: נְבָלָה指严重违背道德、令人羞耻愤慨的行为；“可耻的事”自然庄重，并保留其强烈贬义。
- source_word: בְּיִשְׂרָאֵל
  choice: 在以色列中
  rationale: 保留介词的处所或群体范围含义，不限定为地理位置或单纯族群。
- source_word: וַיְנַאֲפוּ אֶת נְשֵׁי רֵעֵיהֶם
  choice: 与邻舍的妻子通奸
  rationale: נאף明确指通奸；רֵעַ在此指共同体中的同伴或邻舍，而不必是亲密朋友。
- source_word: וַיְדַבְּרוּ דָבָר בִּשְׁמִי שֶׁקֶר
  choice: 又奉我的名说谎话
  rationale: “奉我的名”表达声称得到神的授权；“说谎话”直接保留שֶׁקֶר的指控。
- source_word: אֲשֶׁר לֹא צִוִּיתִם
  choice: 就是我没有吩咐他们说的
  rationale: 补出汉语语境中自然的“说”，清楚表明这些言论没有来自神的命令。
- source_word: וְאָנֹכִי הוּא יֹדֵעַ וָעֵד
  choice: 我就是那知道这一切、又作见证的
  rationale: “我就是”体现אָנֹכִי הוּא的强调；“知道……又作见证”保留知识与司法见证并列的语气。“这一切”为汉语所需的语境性补足。
- source_word: נְאֻם יְהוָה
  choice: 这是雅威的宣告
  rationale: נְאֻם是庄严的先知宣告公式；按所给神学决策，将יהוה音译为“雅威”。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名；“雅威”较贴近通常重构的读音，并依照所提供的神学决策保留其专名性质。
- issue: 神作为知情者与见证者的表述
  choice: 我就是那知道这一切、又作见证的
  alternative: 我知道，我也是见证者
  rationale: 保留原文אָנֹכִי הוּא的强调和יֹדֵעַ וָעֵד的法庭性张力，不将“见证”改释为仅仅“作证”。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“通奸”准确而直接；“这是雅威的宣告”保留先知宣告公式的肃穆感。主文脚注按出现顺序标为[a]、[b]。
