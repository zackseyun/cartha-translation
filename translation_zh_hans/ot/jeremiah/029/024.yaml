  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שְׁמַעְיָהוּ
  choice: 示玛雅
  rationale: 按希伯来人名的通行汉语音译处理。
- source_word: הַנֶּחֱלָמִי
  choice: 尼希兰人
  rationale: 该称谓的确切含义不明，可能表示籍贯、家族归属或绰号；采用音译以保留原文的不确定性。
- source_word: תֹּאמַר לֵאמֹר
  choice: 你要……说
  rationale: 希伯来语“说……说”是引出下文直接引语的惯用结构；现代汉语用冒号自然表达其功能，避免生硬重复，同时不增添原文未明说的对象。
theological_decisions:
- issue: הַנֶּחֱלָמִי 的身份含义
  choice: 音译为“尼希兰人”
  alternative: 译作“做梦者”或某地居民名称
  rationale: 词形虽可能使人联想到“梦”，但其作为称谓的具体来源无法确定；音译不把有争议的词源解释写入正文。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。以冒号承接下一节的信息内容；本节原文没有明确说出受话对象，因此不擅自补出“他们”或其他对象。
