id: JER.29.10
reference: Jeremiah 29:10
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כִּֽי כֹה֙ אָמַ֣ר יְהוָ֔ה כִּ֠י לְ/פִ֞י מְלֹ֧את לְ/בָבֶ֛ל שִׁבְעִ֥ים שָׁנָ֖ה אֶפְקֹ֣ד אֶתְ/כֶ֑ם וַ/הֲקִמֹתִ֤י עֲלֵי/כֶם֙ אֶת דְּבָרִ֣/י הַ/טּ֔וֹב לְ/הָשִׁ֣יב אֶתְ/כֶ֔ם אֶל הַ/מָּק֖וֹם הַ/זֶּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/029/010.yaml
  text: 'For this is what Yahweh says: When seventy years for Babylon are completed[a], I will attend to you and fulfill my good word to you[c][b], to bring you back to this place.'
translation:
  language: zh_hans
  text: 耶和华如此说：“为巴比伦所定的七十年期满以后[a]，我必眷顾你们[b]，向你们成就我美好的话[c]，把你们带回这地方。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“为巴比伦的七十年期满时”。这可能指与巴比伦相关、所定的那段时期。
    reason: alternative_reading
  - marker: b
    text: 或译“看顾你们”或“临到你们”。原文动词可指转而关注某人，或为审判，或为施恩；本处语境是施恩。
    reason: lexical_alternative
  - marker: c
    text: 或译“使我向你们所说的美好话成立”。这里指耶和华实行他所应许的。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经传统中广为人知的神圣名译法，明确保留立约之名，而不以“主”替代。
- source_word: כִּי כֹה אָמַר
  choice: 如此说
  rationale: 自然、庄重地保留先知宣告的固定引介语；句首的 כִּי 在上下文中具有承接和说明作用，中文不必机械译出“因为”。
- source_word: כִּי לְפִי מְלֹאת לְבָבֶל שִׁבְעִים שָׁנָה
  choice: 为巴比伦所定的七十年期满以后
  rationale: לְבָבֶל 表明七十年与巴比伦相关；“为巴比伦所定”避免将其直接解释成被掳者“在巴比伦住满”七十年，也不限定为某一种历史年表。לְפִי מְלֹאת 的重点是期限达到满数。
- source_word: אֶפְקֹד אֶתְכֶם
  choice: 我必眷顾你们
  rationale: פקד 可表示转而关注、察看或介入，既可施行审判，也可施恩；本节语境明显有利于受话者，“眷顾”自然表达带来复兴的关注。
- source_word: וַהֲקִמֹתִי עֲלֵיכֶם אֶת דְּבָרִי הַטּוֹב
  choice: 向你们成就我美好的话
  rationale: הקים 与 דבר 连用表示使所说的话成立、实现。“成就”传达履行之意，同时保留“话”，不直接改译为“应许”；עֲלֵיכֶם 按关系自然译为“向你们”。
- source_word: לְהָשִׁיב אֶתְכֶם
  choice: 把你们带回
  rationale: שוב 的使役形表示使人返回；“带回”准确而自然地呈现使役意义。
- source_word: אֶל הַמָּקוֹם הַזֶּה
  choice: 这地方
  rationale: מקום 本义为“地方”；不扩译成“这地”或明确指定耶路撒冷、犹大，以免超出原文。
theological_decisions:
- issue: 与巴比伦相关的七十年具体指什么
  choice: 译作“为巴比伦所定的七十年”，不在正文中限定其为巴比伦统治期或被掳居留期。
  alternative: 可译“在巴比伦的七十年”或“巴比伦的七十年”。
  rationale: 希伯来文 לְבָבֶל 只明确这段时期与巴比伦相关；中性译法保留其历史和年代解释上的张力。
- issue: “美好的话”是宣告还是应许
  choice: 保留“我美好的话”，并以“成就”表达其应许性质。
  alternative: 可译“我美好的应许”。
  rationale: 原文使用 דָּבָר“话”，而上下文表明这话具有应许功能；正文保留原词意象，不将其完全解释化。
translation_notes:
  register: 采用现代、庄重且便于普通读者理解的书面语。神谕引介保留简洁庄严的语气；“眷顾”“成就”等词兼顾传统可识别性与现代可懂度。所有脚注标记均置于相应正文表达之后。
