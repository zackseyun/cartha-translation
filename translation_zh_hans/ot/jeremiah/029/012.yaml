  yaml_path: translation/ot/jeremiah/029/012.yaml
  text: Then you will call on me and come and pray to me[b][a], and I will hear you.
translation:
  language: zh_hans
  text: 你们会呼求我，前来向我祷告[b]，我就会听你们[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“我就会倾听你们”或“我就会垂听你们”。
    reason: lexical_alternative
  - marker: b
    text: 或译“去向我祷告”；这里的希伯来语动词字面意思是“去、行走”，在此很可能指前来祷告。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/קְרָאתֶם אֹתִי
  choice: 你们会呼求我
  rationale: קרא 后接指人的直接宾语，在这里表示向上帝呼喊、求告。“呼求我”既保留直接对象，也自然表达祷告语境中的求告。
- source_word: וַהֲלַכְתֶּם
  choice: 前来
  rationale: הלך 字面为“去、行走”，但与随后“向我祷告”连用时，很可能表示前来亲近上帝并祷告。“前来”符合说话者为上帝的视角，同时用脚注保留字面译法。
- source_word: וְהִתְפַּלַּלְתֶּם אֵלָי
  choice: 向我祷告
  rationale: פלל 的 Hitpael 形在此指祷告，אֵלַי 表明祷告所朝向的对象；“向我祷告”是现代汉语中清楚自然的表达。
- source_word: וְשָׁמַעְתִּי אֲלֵיכֶם
  choice: 我就会听你们
  rationale: שמע 与 אֶל 连用可表示听、倾听或听从。“听你们”在汉语中可表达听取对方的话，同时避免用“垂听”过早限定为带有恩允意味的回应。
theological_decisions:
- issue: 上帝对祷告的回应
  choice: 我就会听你们
  alternative: 我就会垂听你们／我就会听从你们
  rationale: 原文 שמע 可涵盖听见、倾听和听取。“听你们”保留其语义幅度；上下文暗示上帝会作出回应，但正文不进一步断定回应的具体性质。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“那时”承接上下文的未来时序；“呼求”保留祷告语境中的恳求意味。正文中的脚注标记按其所解释的词语就近放置。
