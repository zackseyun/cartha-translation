  source_fidelity: 译文准确保留了上帝第一人称的追赶、使之成为羞辱对象及赶散行动，也正确呈现“刀剑、饥荒、瘟疫”的审判三联语。不过，原稿末句改为“他们必受人羞辱”，把与前列名词同等并列的“羞辱/凌辱”处理成独立的未来结果，并使“在……各国中”的范围显得只修饰末项；应调整以保留原文整个耻辱清单的句法关系。
  naturalness: 原稿整体庄重清晰。“地上万国中”可改为“地上的万国所……”以更自然地表达其为惊骇对象的关系；“成为……荒凉”在中文中略显突兀，但在先知性审判清单中可以保留。
