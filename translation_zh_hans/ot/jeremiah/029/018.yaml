revisions:
- from: 我要用刀剑、饥荒和瘟疫追赶他们；我要使他们在地上万国中成为令人惊骇的对象[a]，成为咒诅、荒凉和嗤笑的对象[b]；在我把他们赶到的各国中，他们必受人羞辱。
  to: 我要用刀剑、饥荒和瘟疫追赶他们；我要使他们在我赶散他们到的各国中，成为地上的万国所惊骇的对象、咒诅、荒凉、受人以嘘声讥笑的对象和羞辱。[a][b]
  rationale: 修订将“羞辱”恢复为“我要使他们成为”所支配的并列名词，并把“在我赶散他们到的各国中”前置，使其自然涵盖整组公开蒙羞的结果。措辞也在正文中保留了“嘘声/口哨”所体现的讥诮意象。
