  text: וְ/רָֽדַפְתִּי֙ אַֽחֲרֵי/הֶ֔ם בַּ/חֶ֖רֶב בָּ/רָעָ֣ב וּ/בַ/דָּ֑בֶר וּ/נְתַתִּ֨י/ם ל/זועה לְ/כֹ֣ל מַמְלְכ֣וֹת הָ/אָ֗רֶץ לְ/אָלָ֤ה וּ/לְ/שַׁמָּה֙ וְ/לִ/שְׁרֵקָ֣ה וּ/לְ/חֶרְפָּ֔ה בְּ/כָל הַ/גּוֹיִ֖ם אֲשֶׁר הִדַּחְתִּ֥י/ם שָֽׁם׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/029/018.yaml
  text: And I will pursue them with the sword[a], with famine, and with pestilence, and I will make them a horror to all the kingdoms of the earth, a curse, a desolation, an object of hissing[b], and a reproach among all the nations where I have driven them.
translation:
  language: zh_hans
  text: 我要用刀剑、饥荒和瘟疫追赶他们；我要使他们在我赶散他们到的各国中，成为地上的万国所惊骇的对象、咒诅、荒凉、受人以嘘声讥笑的对象和羞辱。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “惊骇的对象”也可译作“恐惧的对象”或“使人战栗的对象”。希伯来词可表达惊骇、恐惧或战栗；这里指他们成为万国眼中可怕的对象。
    reason: lexical_alternative
  - marker: b
    text: “受人以嘘声讥笑的对象”直译为“嘘声的对象”；也可理解为人们以轻蔑的嘘声或口哨讥诮的对象。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָדַפְתִּי אַחֲרֵיהֶם
  choice: 我要……追赶他们
  rationale: רָדַף与אַחֲרֵי连用表示追赶、追击；“追赶”保留持续而主动的迫逼意味，又不引入“迫害”的较窄含义。
- source_word: בַּחֶרֶב בָּרָעָב וּבַדָּבֶר
  choice: 用刀剑、饥荒和瘟疫
  rationale: 保留耶利米书中常见的审判三联语；“瘟疫”准确表达דֶּבֶר所指的流行性灾病，也符合庄重的先知文体。
- source_word: וּנְתַתִּים לְזַוֲעָה
  choice: 使他们……成为令人惊骇的对象
  rationale: זַוֲעָה可指惊骇、恐惧或战栗。这里与后续一系列公开蒙羞的词并列，宜理解为他们成为万国眼中令人惊骇的对象，同时以脚注保留词义幅度。
- source_word: לְכֹל מַמְלְכוֹת הָאָרֶץ
  choice: 在地上万国中
  rationale: לְ在此表示他们相对于地上各王国所成为的对象；中文用“在……中”自然表达其范围。“万国”凝练地传达“所有王国”。
- source_word: לְאָלָה
  choice: 成为咒诅
  rationale: אָלָה指咒诅，也可能带有誓言性咒诅的含义；本句处于羞辱名词的并列清单中，译作“咒诅”简明且不过度限定。
- source_word: וּלְשַׁמָּה
  choice: 成为……荒凉
  rationale: שַׁמָּה可指荒凉或令人震惊之物；因זַוֲעָה已译出惊骇，采用“荒凉”以保留并列词之间的区别。
- source_word: וְלִשְׁרֵקָה
  choice: 成为……嗤笑的对象
  rationale: שְׁרֵקָה指旁观者以嘘声或口哨表达讥诮。“嗤笑的对象”自然传达他们是受嘲弄者，而不是发声者；脚注补明原有意象。
- source_word: וּלְחֶרְפָּה
  choice: 受人羞辱
  rationale: חֶרְפָּה表示公开的羞耻、辱骂或责难；“受人羞辱”在现代中文中清楚表达其社会性蒙羞含义。
- source_word: בְּכָל הַגּוֹיִם אֲשֶׁר הִדַּחְתִּים שָׁם
  choice: 在我把他们赶到的各国中
  rationale: נדח的使役形表示赶散、驱逐；“赶到”保留上帝主动使他们离散的语义，同时使中文地点从句流畅。
theological_decisions:
- issue: 审判与流散中的神圣主动性
  choice: 明确保留第一人称行动：“我要……追赶”“我要使”“我把他们赶到”。
  alternative: 改用被动句或非人格化表达，以弱化行动主体。
  rationale: 希伯来文明确把追赶、使之成为惊骇对象以及驱散都归于说话者上帝。译文不淡化这一关于神在审判中主动作为的神学张力。
translation_notes:
  register: 采用现代、庄重而清楚的先知性语言。“刀剑、饥荒和瘟疫”保留固定审判三联语；后半句以“成为……对象”统摄较抽象的并列名词，兼顾希伯来文结构与现代中文可读性。所有神圣行动均以主动句表达。
