base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/029/001.yaml
  text: These are the words of the letter that Jeremiah the prophet sent from Jerusalem to the remaining elders of the exiles[a], and to the priests, the prophets[d][c][b], and all the people whom Nebuchadnezzar had carried away from Jerusalem to Babylon.
translation:
  language: zh_hans
  text: 以下是先知耶利米从耶路撒冷寄给被掳之民中其余的长老[b]、祭司、先知，以及尼布甲尼撒从耶路撒冷掳到巴比伦的全体百姓的信[a]中的话：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “信”也可译作“文书”或“书卷”。希伯来语סֵפֶר可泛指书面文件；这里因这份文书被寄给特定对象，正文译作“信”。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“被掳群体中剩下的长老”。希伯来语可指被掳群体中其余的长老；“被掳”也可较抽象地指被掳的处境。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: 以下是
  rationale: 承接上文并引出下文；“以下是”符合现代汉语篇章表达，也不加入时间意义。
- source_word: דִּבְרֵי הַסֵּפֶר
  choice: 那封信上的话
  rationale: סֵפֶר泛指书面文书、卷册或书信；本句明确说这份文书被寄给特定收信人，因此正文采用“信”，同时保留“话”来对应דִּבְרֵי。
- source_word: שָׁלַח
  choice: 寄给
  rationale: 在书信语境中，“寄给”比泛称“送出”更自然，并清楚表达收信对象。
- source_word: יִרְמְיָה הַנָּבִיא
  choice: 先知耶利米
  rationale: 按现代汉语习惯将身份称号置于人名前。
- source_word: מִירוּשָׁלִָם
  choice: 从耶路撒冷
  rationale: 直接表达寄信的起点。
- source_word: יֶתֶר זִקְנֵי הַגּוֹלָה
  choice: 被掳之民中其余的长老
  rationale: יֶתֶר表示剩余或其余，הַגּוֹלָה可指被掳状态，也可指被掳群体；正文采用指人的自然表达，并以脚注保留短语关系上的歧义。
- source_word: הַכֹּהֲנִים
  choice: 祭司
  rationale: 该职分的标准汉语译法。
- source_word: הַנְּבִיאִים
  choice: 先知
  rationale: 该身份的标准汉语译法，指被掳群体中的先知。
- source_word: כָּל הָעָם
  choice: 所有……之人
  rationale: 结合后接关系从句译成“所有……之人”，涵盖领袖以外的全体百姓。
- source_word: אֲשֶׁר הֶגְלָה
  choice: 被……掳到
  rationale: גלה的使役形表示使人流亡、将人掳走或迁徙；被动式汉语准确表达这些人遭强制迁移。
- source_word: נְבוּכַדְנֶאצַּר
  choice: 尼布甲尼撒
  rationale: 采用现代中文圣经及一般中文语境中通行的人名音译。
- source_word: בָּבֶלָה
  choice: 到巴比伦
  rationale: 地名后的方向词尾表示朝向巴比伦，故译为“到巴比伦”。
