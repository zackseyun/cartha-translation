revisions:
- from: 以色列的上帝、万军之耶和华如此说：“我使所有从耶路撒冷被掳到巴比伦的人[a]，都要听这话：
  to: 万军之耶和华、以色列的上帝如此对所有我从耶路撒冷掳到巴比伦去的被掳者[a]说：
  rationale: 修订恢复原文的完整使者宣告结构：说话者是“万军之耶和华、以色列的上帝”，受话者是全体被掳者，冒号用于引出下一节的直接宣告。删除无依据的“都要听这话”，并保留“我”作为使役动词的施事者、耶路撒冷作为起点以及巴比伦作为目的地。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T07:28:54Z'
review_pass:
  verdict: revise
  source_fidelity: 草稿保留了神名、万军称号、以色列的上帝以及神对被掳者的第一人称施事性；但它把原文的受话人结构“对所有……被掳者”改成了“我使……的人，都要听这话”，无根据地加入命令“都要听这话”，并将本节结尾本应引出后文的冒号误作引语内容。因此未能忠实呈现原文句法和话语功能。
  naturalness: “万军之耶和华、以色列的上帝如此对……说”是庄重、自然的现代中文书面表达。“被掳者”准确且在本段历史语境中清楚；用“我从耶路撒冷掳到巴比伦去的”直接表达使役性及迁移方向。
  terminology: “耶和华”“万军之耶和华”“以色列的上帝”“被掳者”均适切。保留“掳到”体现 הִגְלֵיתִי 的使役性，不弱化原文所表达的神圣施事性。
  issues:
  - severity: high
    issue: 无原文依据地加入“都要听这话”
    rationale: 希伯来文只有“万军之耶和华、以色列的上帝，对所有……被掳者如此说：”，并没有“听”的命令。该增译改变了本节内容及其作为后续话语引介的功能。
  - severity: high
    issue: 误处理引语边界和句法结构
    rationale: 本节以冒号结束，引出29:5及以下的宣告；草稿在“如此说”后开启引号，并把受话人定语置入引号内，造成结构错误且未闭合引号。
  - severity: medium
    issue: “我使所有从……被掳到……的人”语序不够清晰
    rationale: 该表述使“我使”与“被掳”的施事关系略显拗口。改为“所有我从……掳到……去的被掳者”可清楚保留第一人称神圣施事和起讫地点。
