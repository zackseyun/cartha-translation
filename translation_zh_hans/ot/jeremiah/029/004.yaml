base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/029/004.yaml
  text: 'Thus says Yahweh of hosts[a], the God of Israel, to all the exiles whom I have sent into exile from Jerusalem to Babylon:'
translation:
  language: zh_hans
  text: 万军之耶和华、以色列的上帝如此对所有我从耶路撒冷掳到巴比伦去的被掳者[a]说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “我从耶路撒冷掳到巴比伦去的被掳者”也可译作“我使从耶路撒冷被掳到巴比伦去的人”。原文动词为使役形式，意为“使人流亡／放逐”或“把人掳走”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: 如此说
  rationale: 这是先知书常见的使者宣告公式；“如此说”既保留庄重语气，也符合现代汉语表达。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的专名形式音译四字神名，保留其作为以色列之上帝名字的性质，而不以头衔代替。
- source_word: צְבָאוֹת
  choice: 万军之
  rationale: 在固定称号“万军之耶和华”中采用中文传统且可理解的译法；不将其缩窄为地上的军队，也不意译为“全能者”。
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: 以色列的上帝
  rationale: 直接表达原文的属格结构，并使用现代标准汉语常用的“上帝”。
- source_word: לְכָל הַגּוֹלָה
  choice: 所有……被掳……的人
  rationale: 原文“被掳者／流亡群体”为集合名词；汉语以“所有……的人”自然呈现全体受信者。
- source_word: הִגְלֵיתִי
  choice: 我使……被掳
  rationale: 保留使役词形和上帝第一人称的主动施事角色；“被掳”也符合耶路撒冷居民遭强制迁徙的历史语境。
- source_word: מִירוּשָׁלִַם בָּבֶלָה
  choice: 从耶路撒冷……到巴比伦
  rationale: 分别保留起点介词和指向巴比伦的方向词尾。
theological_decisions:
- issue: 被掳事件中的神圣主权
  choice: 我使……被掳
  alternative: 我容许……被掳；尼布甲尼撒掳走的
  rationale: 希伯来文明确以上帝为使役动词的第一人称主语；译文不弱化为单纯许可，也不把施事完全转移给巴比伦。
- issue: 四字神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威；主
  rationale: “耶和华”是现代中文基督教语境中最广为识别的专名形式，能够区别于普通头衔“主”；原文的专名性质得到保留。
- issue: 称号 יְהוָה צְבָאוֹת 的含义范围
  choice: 万军之耶和华
  alternative: 军队之雅威；全能的主
  rationale: 保留原称号的字面意象及其传统庄重感，不限定“军队”只指某一种受造军旅，也不以解释性的“全能”替代原词。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。为避免长定语造成歧义，将希伯来文的致意结构重组为“我使……的人，都要听这话”，同时保留冒号所引出的后续信息。
