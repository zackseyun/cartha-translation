  yaml_path: translation/ot/jeremiah/029/029.yaml
  text: Then Zephaniah the priest read this scroll in the hearing of Jeremiah the prophet[a].
translation:
  language: zh_hans
  text: 祭司西番雅就把这封信[a]念给先知耶利米听。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “信”：希伯来文סֵפֶר也可译作“书卷”或“文书”；这里按上下文指示玛雅所写的信。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: 就……念给……听
  rationale: קרא在这里以书面文件为宾语，意思是“朗读”。“就”自然表达叙事中连续发生的动作。
- source_word: צְפַנְיָה
  choice: 西番雅
  rationale: 采用现代中文圣经中通行的人名译法。
- source_word: הַכֹּהֵן
  choice: 祭司
  rationale: 保留原文明确指出的职分。
- source_word: הַסֵּפֶר הַזֶּה
  choice: 这封信
  rationale: סֵפֶר可指书卷、文书或书信；根据本章上下文，此处所指是示玛雅寄来的信，因此译作“这封信”最为自然，同时以脚注保留原词较宽的词义。
- source_word: בְּאָזְנֵי
  choice: 念给……听
  rationale: 这是“在……耳中”的希伯来语表达，表示当着某人的面朗读，使其听见；中文用“念给……听”简洁自然。
- source_word: יִרְמְיָהוּ
  choice: 耶利米
  rationale: 采用现代中文圣经中通行的人名译法。
- source_word: הַנָּבִיא
  choice: 先知
  rationale: 明确保留原文中耶利米的称号。
