  text: וְ/נִמְצֵ֣אתִי לָ/כֶם֮ נְאֻם יְהוָה֒ וְ/שַׁבְתִּ֣י אֶת שבית/כם וְ/קִבַּצְתִּ֣י אֶ֠תְ/כֶם מִֽ/כָּל הַ/גּוֹיִ֞ם וּ/מִ/כָּל הַ/מְּקוֹמ֗וֹת אֲשֶׁ֨ר הִדַּ֧חְתִּי אֶתְ/כֶ֛ם שָׁ֖ם נְאֻם יְהוָ֑ה וַ/הֲשִׁבֹתִ֣י אֶתְ/כֶ֔ם אֶל הַ֨/מָּק֔וֹם אֲשֶׁר הִגְלֵ֥יתִי אֶתְ/כֶ֖ם מִ/שָּֽׁם־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/029/014.yaml
  text: And I will let myself be found by you[a], declares Yahweh, and I will restore your fortunes and gather you from all the nations and from all the places where I have driven you, declares Yahweh, and I will bring you back to the place from which I sent you into exile.
translation:
  language: zh_hans
  text: “我必让你们寻见我。”雅威宣告：“我必扭转你们的境况[a]，从万国和我驱逐你们所到的各处把你们聚集起来。”雅威宣告：“我必带你们回到我把你们从那里掳离的地方。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我必使你们从被掳中归回”；也可理解为“我必带回你们中间被掳的人”。这里的希伯来语惯用表达指被掳、苦难的处境得到逆转。
    reason: 保留复兴惯用语的较字面译法及其真实词义幅度。
lexical_decisions:
- source_word: וְנִמְצֵאתִי לָכֶם
  choice: 我必让你们寻见我
  rationale: 原文是מצא的尼受动态，直译为“我必被你们寻见”。中文用“让你们寻见我”较自然，同时保留上帝主动使自己可被寻见的意味；不译作“向你们显现”，以免加入原文未明说的启示概念。
- source_word: נְאֻם יְהוָה
  choice: 这是雅威的宣告
  rationale: 这是先知书中庄严的神谕公式；“宣告”比一般的“说”更能保留其郑重语气。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来语四字神名的通行学术拟音译出其专名，不以“主”这一称号替代，也不采用源于另一套元音传统的译形。
- source_word: וְשַׁבְתִּי אֶת שביתכם
  choice: 我必扭转你们的境况
  rationale: שוב את־שבות/שבית是表示逆转被掳、困苦或灾祸处境的惯用语。“扭转你们的境况”在现代中文中自然，并能涵盖上下文所说的归回与复兴；较直译的可能性列入脚注。
- source_word: וְקִבַּצְתִּי אֶתְכֶם
  choice: 把你们……聚集起来
  rationale: קבץ在流散者归回的语境中指把分散的人重新聚拢；“聚集起来”准确且自然。
- source_word: מִכָּל הַגּוֹיִם וּמִכָּל הַמְּקוֹמוֹת
  choice: 从万国、从……各处
  rationale: 保留“各国／各处”的平行结构和流散范围的全面性；“万国”是简洁庄重的现代圣经语体。
- source_word: אֲשֶׁר הִדַּחְתִּי אֶתְכֶם שָׁם
  choice: 我驱逐你们去的
  rationale: נדח的使役态表达驱赶或放逐，而不只是中性的“分散”；“驱逐”保留了神施行审判的力度。
- source_word: וַהֲשִׁבֹתִי אֶתְכֶם
  choice: 我必带你们回到
  rationale: שוב的使役态指使他们返回；“带你们回到”在中文中清楚表达这一使役意义。
- source_word: אֲשֶׁר הִגְלֵיתִי אֶתְכֶם מִשָּׁם
  choice: 我使你们被掳离开的地方
  rationale: גלה的使役态在这里指使人离乡被掳、流亡。“使你们被掳离开”明确表达被掳语境，也保留行动者是雅威。
theological_decisions:
- issue: 如何表达שוב את־שבות/שבית这一复兴惯用语
  choice: 我必扭转你们的境况
  alternative: 我必使你们从被掳中归回／我必带回你们中间被掳的人
  rationale: 该短语既可按字面联系“被掳者”或“被掳状态”，也常作为逆转灾祸处境的惯用表达。下文已经具体说明从列国聚集并返回原地，因此正文采用涵盖面更广的惯用义，同时以脚注保留较字面的理解。
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华／上主
  rationale: 原文使用的是以色列上帝的专名。译作“雅威”旨在保留专名性质，并避免把专名无说明地改成称号；这项选择不对任何宗派性的神名用法作判断。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。两次נְאֻם יְהוָה均完整保留，以呈现原文的重复和先知宣告语气；句式适度分开，便于普通读者朗读和理解。脚注标记置于其实际解释的“扭转你们的境况”之后。
