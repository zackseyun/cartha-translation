base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/029/028.yaml
  text: For this reason he sent to us in Babylon[a], saying, ‘It will be a long time. Build houses and live in them[b], and plant gardens and eat their fruit.’
translation:
  language: zh_hans
  text: 因为他为此给我们这些在巴比伦的人送信，说：“日子还长[a]。你们要建造房屋，住在那里[b]；栽种园子，吃园中的果子。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“它是长的”，是省略式说法，意思是他们在巴比伦居留或被掳的时期还会持续很久。
    reason: lexical_alternative
  - marker: b
    text: 原文作“居住”；因这个动词紧接“建造房屋”，这里译为“住在那里”，所指地点是按上下文补出的。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי עַל כֵּן
  choice: 因为他曾为此
  rationale: 保留因果关系，使本节自然承接上文对先知耶利米所传信息的申诉；“为此”贴近原文复合表达。
- source_word: שָׁלַח אֵלֵינוּ בָּבֶל
  choice: 捎信给我们这些在巴比伦的人
  rationale: 原文直译近于“派送给我们，巴比伦”；语境表明所送的是信息，且“巴比伦”说明收信人的所在地。译文将隐含关系明说，以符合现代汉语。
- source_word: לֵאמֹר
  choice: 说
  rationale: 用现代汉语中引出直接引语的常见表达。
- source_word: אֲרֻכָּה הִיא
  choice: 日子还长
  rationale: 希伯来文为省略式表达，字面近于“它是长的”，阴性主语所指可能是居留或被掳时期。“日子还长”既自然简洁，也不把隐含所指过度限定为某一名词。
- source_word: בְּנוּ בָתִּים
  choice: 建造房屋
  rationale: 直接保留命令语气和宾语。
- source_word: וְשֵׁבוּ
  choice: 住在其中
  rationale: 动词可指坐下、居留或居住；承接“建造房屋”时，“住在其中”最符合汉语习惯，其中宾语由上下文补足。
- source_word: וְנִטְעוּ גַנּוֹת
  choice: 栽种园子
  rationale: גַנּוֹת 泛指园圃；“园子”不将其过窄地限定为果园。
- source_word: וְאִכְלוּ אֶת פְּרִיהֶן
  choice: 吃园中所出的果子
  rationale: 明确阴性复数代词所指的是园子，并自然表达“吃其果实”的含义。
