base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/029/002.yaml
  text: after King Jeconiah[a], the queen mother, the court officials, the officials of Judah and Jerusalem[c][b], and the craftsmen and the metalworkers had gone out from Jerusalem—
translation:
  language: zh_hans
  text: 在耶哥尼雅王、王太后、宫廷官员[a]、犹大和耶路撒冷的官长[b]，以及工匠和金属工匠[c]离开耶路撒冷之后——
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“宦官”；希伯来语这个词既可特指宦官，也可泛指王宫官员。
    reason: lexical_alternative
  - marker: b
    text: 或译“犹大和耶路撒冷的首领”。
    reason: lexical_alternative
  - marker: c
    text: 或译“铁匠”；这个希伯来语词所指的具体工种不能完全确定。
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחֲרֵי צֵאת
  choice: 那时……已经离开
  rationale: 该结构以时间介词和“出去”的不定式引出本句时间背景；结合上文书信寄出这一事件，用“那时……已经离开”自然表达先于该事件发生的动作。
- source_word: יְכָנְיָה הַמֶּלֶךְ
  choice: 耶哥尼雅王
  rationale: 按此处希伯来名字形式音译为“耶哥尼雅”，不与其他名字变体强行统一；“王”作为称号置于姓名之后，符合现代汉语习惯。
- source_word: הַגְּבִירָה
  choice: 太后
  rationale: 在王室语境中，此词通常是指国王母亲的正式身份；“太后”简明自然地表达这一宫廷地位。
- source_word: הַסָּרִיסִים
  choice: 宫廷官员
  rationale: 该词既可特指宦官，也可泛指王宫官员；正文采用较宽泛且适合行政语境的译法，并以脚注保留另一可能。
- source_word: שָׂרֵי יְהוּדָה וִירוּשָׁלַם
  choice: 犹大和耶路撒冷的官长
  rationale: שׂרים 指掌权者或官员；“官长”既保留治理身份，也避免现代汉语中“王子”所造成的误解。
- source_word: הֶחָרָשׁ
  choice: 工匠
  rationale: 此词可泛指从事手工业的匠人；采用较宽泛的“工匠”，以便与后一个较具体的行业称呼并列。
- source_word: הַמַּסְגֵּר
  choice: 铁匠
  rationale: 该词的确切工种有争议，通常理解为从事锻造或金属加工的人；“铁匠”符合传统并列用语，脚注说明较宽的译法。
- source_word: מִירוּשָׁלָם
  choice: 离开耶路撒冷
  rationale: 介词标明出发之地；与“出去”合译为自然的现代汉语“离开耶路撒冷”。
