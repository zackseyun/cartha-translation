id: JER.29.15
reference: Jeremiah 29:15
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כִּ֖י אֲמַרְתֶּ֑ם הֵקִ֨ים לָ֧/נוּ יְהוָ֛ה נְבִאִ֖ים בָּבֶֽלָ/ה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/029/015.yaml
  text: Because you have said[b][a], “Yahweh has raised up prophets for us in Babylon,”
translation:
  language: zh_hans
  text: 因为你们说[a]：“耶和华在巴比伦为我们兴起了先知。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“原来你们说。”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 本词在上下文中引出后续神谕所回应的缘由；译作“因为”能清楚表达因果关系。也可理解为承接说明的“原来”。
- source_word: אֲמַרְתֶּם
  choice: 你们说
  rationale: 第二人称阳性复数完成式指受众已经说过的话；现代汉语用“你们说”自然涵盖这一先前言说，无须机械添加“已经”。
- source_word: הֵקִים
  choice: 兴起了
  rationale: קום的使役式用于神赐下或设立先知时，常有“兴起”的含义；此译保留圣经中神兴起先知的表达，也不排除“设立”的职分意味。
- source_word: לָנוּ
  choice: 为我们
  rationale: 介词ל在此表示受益或供应对象，“为我们”最符合汉语习惯。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的专名“耶和华”对应四字神名，保留其专名性质，而不以头衔替代。
- source_word: נְבִאִים
  choice: 先知
  rationale: 直接对应复数名词；汉语名词通常不以形态标示复数，数量由“为我们兴起”及上下文表达。
- source_word: בָּבֶלָה
  choice: 在巴比伦
  rationale: 此处带方向词尾的地名在语境中表达所在地，现代汉语自然译为“在巴比伦”。
theological_decisions:
- issue: 四字神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用神的专名。中文正文采用长期通行且普通读者易懂的“耶和华”，同时保持专名而非“主”这一称号；“雅威”是较接近学界重构读音的另一译法。
- issue: “兴起”是否等同于正式任命
  choice: 兴起了
  alternative: 设立了
  rationale: 使役式הֵקִים既可表达使之出现、赐下，也可能包含设立职分的意味。“兴起”较少把原文限定为正式任命，并保留这些“先知”之真实性将在后文受到检验的张力。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。保留本节作为未完因果从句、与后文神谕相连的结构；引号明确标示被引述的话。
