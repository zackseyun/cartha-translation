  yaml_path: translation/ot/jeremiah/029/013.yaml
  text: You will seek me and find me[a], when you seek me with all your heart.
translation:
  language: zh_hans
  text: 你们若全心寻求我，就必寻见我[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你们必寻求我，也必寻见我，因为你们必全心寻求我。”希伯来语连接词 כִּי 在这里可表达几种彼此相关的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבִקַּשְׁתֶּם
  choice: 你们寻求
  rationale: 此处带连接词的加强词干完成式处于面向未来的应许语境中；汉语可由后句“必”自然表达未来及确定性。“寻求”保留有意追寻之意。
- source_word: אֹתִי
  choice: 我
  rationale: 直接宾语标记附第一人称单数词尾，直译为“我”。
- source_word: וּמְצָאתֶם
  choice: 就必寻见
  rationale: 此动词承接前面的未来应许。“寻见”与“寻求”形成自然呼应；“必”表达结果的确定性，“就”呈现上下句的逻辑联系。
- source_word: כִּי
  choice: 因为……若
  rationale: כִּי 在此可作原因、条件或情境连接词。正文采用“因为……若”，既保留较直接的因果意味，也用“若”清楚表达全心寻求这一条件；其他理解列于脚注。
- source_word: תִדְרְשֻׁנִי
  choice: 你们……寻求我
  rationale: דרשׁ 可指切切寻求或探求，尤其用于寻求上帝。译作“寻求我”自然清楚，并保留与前一动词的语义呼应，不人为夸大两词差异。
- source_word: בְּכָל
  choice: 全
  rationale: 介词 בְּ 与 כָּל 修饰“心”，合起来自然译为“全心”，表达内在投入的完整性。
- source_word: לְבַבְכֶם
  choice: 心
  rationale: לֵבָב 涵盖思想、意志和情感等内在生命；现代汉语圣经语体中的“心”简洁自然，也保留其丰富含义。复数领属由主语“你们”清楚体现。
theological_decisions:
- issue: 寻求上帝与寻见上帝的关系
  choice: 译文表达一个真实应许：全心寻求便会寻见上帝，但不进一步说明恩典、人之能力或救恩次序等教义机制。
  alternative: 可侧重人的责任，也可置于上帝使人能够寻求他的更广泛神学框架中理解。
  rationale: 紧贴希伯来文中的应许与条件，不引入宗派性结论，并保留经文本身的神学张力。
- issue: כִּי 所表达的逻辑关系
  choice: 正文译作“因为……若”，呈现原因与条件相连的理解。
  alternative: 也可译作“当你们全心寻求我时”，把它理解为时间或情境关系。
  rationale: 希伯来语 כִּי 在这里允许数种彼此相关的理解，因此以脚注明确保留歧义，不将其强行限定为单一逻辑关系。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“全心”比“用你们全部的心”更自然；分号使应许与其条件或理由之间的关系清楚。正文保留逗号，以配合本节与下一节连续的希伯来句法。
