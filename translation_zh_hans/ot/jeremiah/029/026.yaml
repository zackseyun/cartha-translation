  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: יְהוָ֞ה נְתָנְ/ךָ֣ כֹהֵ֗ן תַּ֚חַת יְהוֹיָדָ֣ע הַ/כֹּהֵ֔ן לִֽ/הְי֤וֹת פְּקִדִים֙ בֵּ֣ית יְהוָ֔ה לְ/כָל אִ֥ישׁ מְשֻׁגָּ֖ע וּ/מִתְנַבֵּ֑א וְ/נָתַתָּ֥ה אֹת֛/וֹ אֶל הַ/מַּהְפֶּ֖כֶת וְ/אֶל הַ/צִּינֹֽק־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/029/026.yaml
  text: Yahweh has made you priest in place of Jehoiada the priest[a], to be overseers in the house of Yahweh over every man who is mad and acts as a prophet[c][b], and you should put him into the stocks and the neck iron.
translation:
  language: zh_hans
  text: 雅威已经立你接替祭司耶何耶大作祭司，使你在雅威的殿中担任监管者[a]，管束一切癫狂而作先知的人[b]；你要把这样的人置于枷具和颈铁之中[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “监管者”所译的希伯来语名词是复数形式，尽管这里受话者“你”是单数；也可译作“官员”或“监督人员”。
    reason: lexical_alternative
  - marker: b
    text: “作先知”也可较具体地译作“说预言”。这里的措辞出自写信者的敌对口吻，并非判定此人的预言是真是假。
    reason: alternative_reading
  - marker: c
    text: “颈铁”所指器具的确切形制不能确定，可能是与枷具配合使用的铁制颈部拘束器或铁圈。
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常用音译保留四字神名，避免用称号替代专名。
- source_word: נְתָנְךָ כֹהֵן
  choice: 立你……作祭司
  rationale: נתן 与职分连用时表示任命；“立……作”既自然，也保留其任职含义。
- source_word: תַּחַת יְהוֹיָדָע הַכֹּהֵן
  choice: 接替祭司耶何耶大
  rationale: תחת 在这里表示职位上的替代或继任，而非居于其下。
- source_word: לִהְיוֹת פְּקִדִים
  choice: 担任监管者
  rationale: פקידים 表示负责监督、管束的人员；原文虽用复数名词，受话者却是单数，汉语以不标数的“监管者”自然保留这种功能而不强行解释语法张力。
- source_word: בֵּית יְהוָה
  choice: 雅威的殿
  rationale: 所指为圣殿；“殿”在现代汉语中比直译“家”更清楚，同时保持庄重。
- source_word: לְכָל אִישׁ מְשֻׁגָּע
  choice: 管束一切癫狂……的人
  rationale: 结合监管职分表达 לְ 的管辖范围；“癫狂”保留说话者带敌意的贬斥语气。
- source_word: וּמִתְנַבֵּא
  choice: 而自称先知
  rationale: 该 hitpael 分词可表示作先知、说预言；在敌对语境中，“自称先知”传达说话者的轻蔑立场，但不由译者裁定其预言真假。
- source_word: וְנָתַתָּה אֹתוֹ
  choice: 你要把这样的人关进
  rationale: 连续叙述中的形式在此表达受话者应采取的职务行动；“你要”简洁明确。
- source_word: הַמַּהְפֶּכֶת
  choice: 枷具
  rationale: 指用于拘禁或惩罚的固定装置；“枷具”避免过度限定为某一种具体形制。
- source_word: הַצִּינֹק
  choice: 颈铁
  rationale: 该器具的确切形制不明，可能是铁制颈部拘束器；“颈铁”保留不确定性，脚注加以说明。
theological_decisions:
- issue: 如何表达对先知行为的敌意描述
  choice: 自称先知
  alternative: 说预言／作先知
  rationale: 上下文是示玛雅要求惩治耶利米的敌对话语。主文反映其贬斥视角，却不据此断言耶利米并非真先知；脚注明示较中性的译法。
- issue: אִישׁ 的性别与范围
  choice: 一切……的人
  alternative: 每个男人
  rationale: 这里 איש 在量词结构中泛指受管束的个体，重点不是性别对比。现代汉语“一切……的人”准确表达其普遍范围，并不增添性别主张。
- issue: 受话者单数与 פקידים 复数之间的张力
  choice: 担任监管者
  alternative: 作监管官员们
  rationale: 汉语名词通常不标单复数，因而无需用不自然的复数强解原文；脚注保留这一文本现象。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“立你……作祭司”“接替”“管束”使职分和行动关系清楚；“癫狂”“自称先知”保留原说话者的敌意，但通过脚注避免把其评价变成译者的神学裁断。所有脚注标记均置于相关词语之后。
