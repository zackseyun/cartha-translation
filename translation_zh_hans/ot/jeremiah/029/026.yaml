revisions:
- from: 雅威已经立你接替祭司耶何耶大作祭司，使你在雅威的殿中担任监管者[a]，管束一切癫狂而自称先知的人[b]；你要把这样的人关进枷具，套上颈铁[c]。
  to: 雅威已经立你接替祭司耶何耶大作祭司，使你在雅威的殿中担任监管者[a]，管束一切癫狂而作先知的人[b]；你要把这样的人置于枷具和颈铁之中[c]。
  rationale: 修订避免以“自称先知”超出原文所表达的含义，同时保留写信者将对象称为“癫狂”的敌对语气。末句改为以一个动作支配两项拘束器，改善汉语搭配，并避免对器具形制和使用方式作不必要的具体化。脚注标记均仍紧邻相应词语。
  reviewer_model: gpt-5.6-terra
