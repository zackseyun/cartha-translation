  text: בְּ/יַד֙ אֶלְעָשָׂ֣ה בֶן שָׁפָ֔ן וּ/גְמַרְיָ֖ה בֶּן חִלְקִיָּ֑ה אֲשֶׁ֨ר שָׁלַ֜ח צִדְקִיָּ֣ה מֶֽלֶךְ יְהוּדָ֗ה אֶל נְבוּכַדְנֶאצַּ֛ר מֶ֥לֶךְ בָּבֶ֖ל בָּבֶ֥לָ/ה לֵ/אמֹֽר־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/029/003.yaml
  text: 'by the hand of Elasah son of Shaphan and Gemariah son of Hilkiah[a], whom Zedekiah king of Judah sent to Nebuchadnezzar king of Babylon in Babylon[b], saying:'
translation:
  language: zh_hans
  text: 这封信托沙番的儿子以利亚萨和希勒家的儿子基玛利雅带去[a]；犹大王西底家派他们前往巴比伦，去见巴比伦王尼布甲尼撒。信上说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“借着……的手”，意思是由这两位使者带去。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּיַד
  choice: 托……带去
  rationale: 该介词短语直译为“借……的手”，在这里表示由使者转交；“托……带去”既准确表达媒介或代理关系，也符合现代汉语习惯。
- source_word: אֶלְעָשָׂה בֶן־שָׁפָן
  choice: 沙番的儿子以利亚萨
  rationale: 按现代中文圣经人名的通行音译处理，并保留父子关系。
- source_word: וּגְמַרְיָה בֶּן־חִלְקִיָּה
  choice: 和希勒家的儿子基玛利雅
  rationale: 保留连接词、专名及谱系表达，采用通行中文音译。
- source_word: אֲשֶׁר שָׁלַח
  choice: 派他们
  rationale: 关系代词所指为前述两位使者；汉语用另起分句并补出“他们”，使指代清楚而不改变意义。
- source_word: צִדְקִיָּה מֶלֶךְ יְהוּדָה
  choice: 犹大王西底家
  rationale: 按自然汉语次序表达君王的辖地与姓名。
- source_word: אֶל נְבוּכַדְנֶאצַּר מֶלֶךְ בָּבֶל
  choice: 去见巴比伦王尼布甲尼撒
  rationale: 介词 אֶל 表示行动所指向的对象；“去见”在使者受派的语境中自然明确，又不额外规定会面的具体性质。
- source_word: בָּבֶלָה
  choice: 前往巴比伦
  rationale: 词尾方向词素 ה 表示朝向巴比伦。将地点置于“去见巴比伦王”之前，可避免中文中“到巴比伦王那里去巴比伦”的拗口重复。
- source_word: לֵאמֹר
  choice: 信上说：
  rationale: 该引语公式引出下文；结合上文明确的书信语境，译为“信上说”比机械直译“说”更符合现代汉语。
theological_decisions: []
