  - severity: medium
    issue: 引号在“这是雅威的宣告”前结束，导致末句原因从神谕引语中脱离。
    rationale: 原文从“雅威如此说”起至末尾均属直接神谕；נְאֻם יְהוָה是其中的宣告公式，之后的“因为”仍在同一神谕内。
