language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: לָ/כֵ֞ן כֹּֽה אָמַ֣ר יְהוָ֗ה הִנְ/נִ֨י פֹקֵ֜ד עַל שְׁמַעְיָ֣ה הַ/נֶּחֱלָמִי֮ וְ/עַל זַרְע/וֹ֒ לֹא יִהְיֶ֨ה ל֜/וֹ אִ֣ישׁ יוֹשֵׁ֣ב בְּ/תוֹךְ הָ/עָ֣ם הַ/זֶּ֗ה וְ/לֹֽא יִרְאֶ֥ה בַ/טּ֛וֹב אֲשֶׁר אֲנִ֥י עֹשֶֽׂה לְ/עַמִּ֖/י נְאֻם יְהוָ֑ה כִּֽי סָרָ֥ה דִבֶּ֖ר עַל יְהוָֽה־־־־׀׀־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/029/032.yaml
  text: 'Therefore thus says Yahweh: Behold[a], I am about to punish Shemaiah the Nehelamite and his offspring. He will not have a man dwelling among this people, nor will he see the good that I am doing for my people, declares Yahweh[b], because he has spoken rebellion against Yahweh.'
translation:
  language: zh_hans
  text: 因此，雅威如此说：“看哪，我必惩罚尼希兰人示玛雅[a]和他的后裔；他必没有一个男子住在这民中，也必不得见我为我子民所施行的福乐——这是雅威的宣告——因为他发表了背叛雅威的言论。[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “尼希兰人”也可能意为“做梦者”；希伯来语 הַנֶּחֱלָמִי 可能与“做梦”有关，但这里的确切含义不能确定，因此正文将它作为称号音译。
    reason: lexical_alternative
  - marker: b
    text: “背叛”也可译作“背道”或“反叛”。
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: 因此
  rationale: 保留该连接词承接上文、引出审判后果的推论作用。
- source_word: כֹּה אָמַר יְהוָה
  choice: 雅威如此说
  rationale: 采用自然庄重的先知传信公式，并直接音译神的圣名。
- source_word: הִנְנִי פֹקֵד עַל
  choice: 看哪，我必惩罚
  rationale: “看哪”保留 הִנְנִי 的提示与强调作用；פקד על 在审判语境中指追讨、惩罚。
- source_word: שְׁמַעְיָה הַנֶּחֱלָמִי
  choice: 尼希兰人示玛雅
  rationale: 将人名与称号音译；称号词源及确切含义不确定，故不在正文中释作“做梦者”。
- source_word: וְעַל זַרְעוֹ
  choice: 和他的后裔
  rationale: זֶרַע 在此为集合意义，指其子孙后代。
- source_word: לֹא יִהְיֶה לוֹ אִישׁ יוֹשֵׁב
  choice: 他必没有一个男丁住在
  rationale: 保留 אִישׁ 的阳性单数形式，以及没有男性后裔存留于民中的审判含义。
- source_word: בְּתוֹךְ הָעָם הַזֶּה
  choice: 在这民中
  rationale: 简洁表达处于这一群体之中的空间和社会关系。
- source_word: וְלֹא יִרְאֶה בַטּוֹב
  choice: 也看不见……的福
  rationale: 保留希伯来语“看见福”的意象；中文可自然理解为亲历、享受福分。
- source_word: אֲשֶׁר אֲנִי עֹשֶׂה לְעַמִּי
  choice: 我要赐给我子民的
  rationale: 分词可表达正在或即将施行的行动；依预言语境译作将要赐福，同时“赐给”自然传达为子民成就美善之事。
- source_word: נְאֻם יְהוָה
  choice: 这是雅威的宣告
  rationale: 采用庄重而清楚的先知性定式。
- source_word: כִּי סָרָה דִבֶּר עַל יְהוָה
  choice: 因为他说了悖逆雅威的话
  rationale: סָרָה 可指悖逆、背道或反叛；此译保留其宽广的盟约性反叛含义，不进一步限定具体方式。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；音译“雅威”较贴近其通行学术重构，也使经文中的圣约之名清楚可见。
- issue: סָרָה 的神学语义
  choice: 悖逆
  alternative: 背道／反叛
  rationale: “悖逆”既可涵盖对雅威的反抗，也不把该词过度限定为正式离教或政治叛乱。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。保留“看哪”“这是雅威的宣告”等先知文体特征；正文维持称号和关键词的真实不确定性，并以脚注交代可能译法。
