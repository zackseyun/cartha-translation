source:
  edition: WLC
  text: כִּ֣י בְ/שֶׁ֔קֶר הֵ֛ם נִבְּאִ֥ים לָ/כֶ֖ם בִּ/שְׁמִ֑/י לֹ֥א שְׁלַחְתִּ֖י/ם נְאֻם יְהוָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/029/009.yaml
  text: For they are prophesying falsely to you in my name[a]; I did not send them[c][b], declares Yahweh.
translation:
  language: zh_hans
  text: 因为他们奉我的名向你们说假预言[a]；我没有差遣他们——这是雅威的宣告。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “说假预言”原文直译为“在虚假中说预言”或“以谎言说预言”。
    reason: lexical_alternative
  - marker: b
    text: “雅威”是希伯来文神名 YHWH 的音译；传统上也译作“耶和华”或以“上主”代称。
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上一节的警告并说明原因，保留原文的因果关系。
- source_word: בְשֶׁקֶר
  choice: 说假预言
  rationale: 原意为“在虚假中／以谎言”；结合 נִבְּאִים 译为“说假预言”，符合现代汉语表达，也明确指出其预言具有虚假性质。
- source_word: נִבְּאִים
  choice: 说预言
  rationale: 该分词表示正在进行或惯常发生的行动；汉语在上下文中无需另加进行体标记。
- source_word: לָכֶם
  choice: 向你们
  rationale: 此处介词 לְ 标示预言话语的对象，“向你们”自然、准确。
- source_word: בִּשְׁמִי
  choice: 奉我的名
  rationale: 保留以神之名说话、声称具有神圣授权的惯用含义。
- source_word: לֹא שְׁלַחְתִּים
  choice: 我并没有差遣他们
  rationale: 否定完成式表达雅威明确否认曾授予他们使命；“并没有”也突显这与他们声称奉神之名之间的对照。
- source_word: נְאֻם יְהוָה
  choice: 这是雅威说的
  rationale: 以自然而庄重的现代汉语表达先知书常见的神谕公式。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以通行的汉语音译呈现四字神名，保留其作为专名的性质。
theological_decisions:
- issue: 预言的神圣授权
  choice: 他们虽然奉神的名说预言，雅威却明确否认差遣过他们。
  alternative: 将重点弱化为他们的信息不准确，而不涉及授权真伪。
  rationale: 原文把“奉我的名”与“我并没有差遣他们”直接并置；译文保留虚假宣称与神否认授权之间的张力。
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；“雅威”以现代汉语常见音译保留专名，脚注说明其他传统译法。
translation_notes:
  register: 采用自然、庄重且易懂的现代标准汉语。“奉我的名”保留原文的宗教与授权含义；分号后的独立句突出雅威对这些先知的明确否认。
