source:
  edition: WLC
  text: וְ/דִרְשׁ֞וּ אֶת שְׁל֣וֹם הָ/עִ֗יר אֲשֶׁ֨ר הִגְלֵ֤יתִי אֶתְ/כֶם֙ שָׁ֔מָּ/ה וְ/הִתְפַּֽלְל֥וּ בַעֲדָ֖/הּ אֶל יְהוָ֑ה כִּ֣י בִ/שְׁלוֹמָ֔/הּ יִהְיֶ֥ה לָ/כֶ֖ם שָׁלֽוֹם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/029/007.yaml
  text: Seek the welfare of the city where I have sent you into exile[a], and pray to Yahweh on its behalf, for in its welfare you will have welfare.
translation:
  language: zh_hans
  text: 你们要为我使你们流亡到的那座城寻求平安[a]，也要为那城向耶和华祷告；因为那城得平安，你们也必得平安。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “平安”也可译作“福祉”或“安宁”。本节三次使用同一个希伯来词，分别指那座城和流亡者的整体安好。
    reason: 说明שָׁלוֹם的宽广语义，并指出正文以同一译词保留原文重复。
lexical_decisions:
- source_word: דִרְשׁוּ
  choice: 寻求
  rationale: 此处意为积极谋求、致力于某事；“寻求”既保留命令语气和广泛含义，也不把具体行动解释得过窄。
- source_word: שְׁלוֹם
  choice: 平安
  rationale: שָׁלוֹם涵盖和平、安稳、福祉和兴盛；“平安”在现代中文圣经语体中自然庄重，并可在全节重复使用，以保留原文的关键词复现和城与流亡者命运相连的表达。脚注说明其广义。
- source_word: הָעִיר
  choice: 那城
  rationale: 定冠词所指的是流亡者所在的特定城市；中文用“那城”自然地承接后面的关系分句。
- source_word: הִגְלֵיתִי אֶתְכֶם שָׁמָּה
  choice: 我使你们流亡所到的
  rationale: הִגְלֵיתִי是使役形，明确保留上帝使他们流亡的施事角色；将שָׁמָּה融入“所到的”，符合现代汉语表达。
- source_word: הִתְפַּלְלוּ
  choice: 祷告
  rationale: 原词直接表示祷告；不译作“代求”，以免把词义收窄，代求方向已由בַעֲדָהּ表达。
- source_word: בַעֲדָהּ
  choice: 为那城
  rationale: 表示为了那城、代表那城向上帝祷告；重复“那城”比代词更清楚自然。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文读者最熟悉的四字神名音译，明确将יהוה作为专名而非以“主”这一称号替代。
- source_word: כִּי
  choice: 因为
  rationale: 引出前述命令的理由，现代汉语以“因为”表达清楚直接。
- source_word: בִשְׁלוֹמָהּ יִהְיֶה לָכֶם שָׁלוֹם
  choice: 那城平安，你们也会平安
  rationale: 前后两次均以“平安”翻译שָׁלוֹם，保留原文重复及彼此关联；“也会”自然表达城的平安与流亡者平安之间的关系，而不将其限缩为经济繁荣。
theological_decisions:
- issue: 如何翻译神名יהוה
  choice: 耶和华
  alternative: 雅威；主
  rationale: “耶和华”是现代标准汉语中广为人知且庄重的专名形式，可使读者看出原文使用的是神名，而不是普通称号；“雅威”较贴近学术重构的读音，也属可行选择，但正文采用中文传统通行形式。
- issue: 城的שָׁלוֹם与流亡者的שָׁלוֹם之间的关系
  choice: 用同一词“平安”保留对应关系
  alternative: 分别译作“福祉”和“安好”，或将后半句解释为“你们就会兴旺”
  rationale: 原文有意重复同一名词，既包含和平也包含整体安康。统一译词可保留其神学张力：被掳者要谋求异邦城市的好处，而他们自身的好处也与该城相连；不把它单独解释为政治顺服或物质繁荣。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“流亡”准确表达被迫离乡的状态；“寻求平安”保留原文开放而积极的命令，不额外指定政治、经济或宗教行动。
