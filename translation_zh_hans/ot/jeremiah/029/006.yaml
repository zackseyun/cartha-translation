  text: קְח֣וּ נָשִׁ֗ים וְ/הוֹלִידוּ֮ בָּנִ֣ים וּ/בָנוֹת֒ וּ/קְח֨וּ לִ/בְנֵי/כֶ֜ם נָשִׁ֗ים וְ/אֶת בְּנֽוֹתֵי/כֶם֙ תְּנ֣וּ לַֽ/אֲנָשִׁ֔ים וְ/תֵלַ֖דְנָה בָּנִ֣ים וּ/בָנ֑וֹת וּ/רְבוּ שָׁ֖ם וְ/אַל תִּמְעָֽטוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/029/006.yaml
  text: Take wives and father sons and daughters[a]; and take wives for your sons, and give your daughters to men, so that they may bear sons and daughters; multiply there[c][b], and do not decrease.
translation:
  language: zh_hans
  text: 你们要娶妻，生儿生女；要为你们的儿子娶妻，把你们的女儿嫁给男子[a]，好让她们生儿生女。你们要在那里增多，不可减少[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“把你们的女儿给男人”；这里指把她们嫁出去。
    reason: lexical_alternative
  - marker: b
    text: 或译：“不可成为少数。”
    reason: lexical_alternative
lexical_decisions:
- source_word: קְחוּ נָשִׁים
  choice: 娶妻
  rationale: 这是表示缔结婚姻的希伯来语惯用语；“娶妻”简洁自然，并保留命令语气。
- source_word: וְהוֹלִידוּ בָּנִים וּבָנוֹת
  choice: 生儿养女
  rationale: 使役词形在男性主语下有“生育、成为父亲”之意；“生儿养女”是现代汉语中自然庄重的表达，也保留了原文明确列举儿女的特点。
- source_word: וּקְחוּ לִבְנֵיכֶם נָשִׁים
  choice: 要为你们的儿子娶妻
  rationale: 按原文保留父母为儿子安排婚姻的表达；“为……娶妻”符合汉语习惯。
- source_word: וְאֶת בְּנוֹתֵיכֶם תְּנוּ לַאֲנָשִׁים
  choice: 把你们的女儿嫁给人
  rationale: 原文字面是“把你们的女儿给男人”；婚姻语境清楚，译作“嫁给人”既自然，又通过脚注保留字面信息。
- source_word: וְתֵלַדְנָה
  choice: 使她们生儿养女
  rationale: 承接前面的命令，可表达预期结果或目的；“使”自然呈现这一关系，而不将其硬性限定为单纯将来时。
- source_word: וּרְבוּ שָׁם
  choice: 你们要在那里增多
  rationale: רבה在此指人口数量增长；“增多”清楚自然，“在那里”指前文所说的流亡之地。
- source_word: וְאַל תִּמְעָטוּ
  choice: 不可减少
  rationale: מעט在这里与“增多”相对，指人数变少；“不可减少”保留简洁的命令形式。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而通顺的普通话。“生儿养女”按汉语习惯表达生育儿女，并未把“养育”另立为原文之外的命令；人口增减的对照则以“增多／减少”直接呈现。
