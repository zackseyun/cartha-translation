source:
  edition: WLC
  text: כֹּֽה אָמַ֞ר יְהוָ֧ה צְבָא֛וֹת אֱלֹהֵ֥י יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר יַ֡עַן אֲשֶׁ֣ר אַתָּה֩ שָׁלַ֨חְתָּ בְ/שִׁמְ/כָ֜ה סְפָרִ֗ים אֶל כָּל הָ/עָם֙ אֲשֶׁ֣ר בִּ/ירוּשָׁלִַ֔ם וְ/אֶל צְפַנְיָ֤ה בֶן מַֽעֲשֵׂיָה֙ הַ/כֹּהֵ֔ן וְ/אֶ֥ל כָּל הַ/כֹּהֲנִ֖ים לֵ/אמֹֽר־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/029/025.yaml
  text: 'Thus says Yahweh of hosts[a], the God of Israel: Because you have sent letters in your own name to all the people who are in Jerusalem, and to Zephaniah son of Maaseiah the priest, and to all the priests, saying,'
translation:
  language: zh_hans
  text: 万军之雅威—以色列的上帝如此说：“因为你以自己的名义[a]寄信给所有住在耶路撒冷的民众，寄给祭司西番雅（玛西雅的儿子），以及所有祭司，说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“以你的名”。这里可能强调示玛雅凭自己的权柄行事，而不是奉雅威的权柄行事。
    reason: 保留 בְּשִׁמְךָ 的较形式对应译法，并说明上下文可能包含的权威对比。
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: 如此说
  rationale: 保留先知传信公式的庄重语气，同时符合现代汉语表达。
- source_word: יְהוָה צְבָאוֹת
  choice: 万军之雅威
  rationale: 将神名 יְהוָה 音译为“雅威”，并以传统而宽泛的“万军”表达 צְבָאוֹת，避免限定为仅指地上的军队。
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: 以色列的上帝
  rationale: 直接表达原文的属格结构和身份说明。
- source_word: יַעַן אֲשֶׁר
  choice: 因为
  rationale: 自然表达因果关系；本句的结果或审判内容由后文继续说明。
- source_word: שָׁלַחְתָּ ... סְפָרִים
  choice: 你……写信给
  rationale: סְפָרִים 在此指寄给多位收信人的书信；汉语用“写信给”比直译“发送书卷”自然。
- source_word: בְשִׁמְךָ
  choice: 以自己的名义
  rationale: 既表达“以你的名”，也体现示玛雅凭自身名义行事的语境；脚注保留较形式对应的译法及其权威层面的含义。
- source_word: כָּל הָעָם אֲשֶׁר בִּירוּשָׁלִַם
  choice: 所有住在耶路撒冷的民众
  rationale: 保留关系从句，并用现代汉语清楚表达所指群体。
- source_word: צְפַנְיָה בֶן מַעֲשֵׂיָה הַכֹּהֵן
  choice: 玛西雅的儿子西番雅祭司
  rationale: 按原文次序呈现父名和祭司身份，并采用常见中文圣经人名。
- source_word: וְאֶל כָּל הַכֹּהֲנִים
  choice: 和所有祭司
  rationale: 直接对应原文，并与前面的收信对象并列。
- source_word: לֵאמֹר
  choice: 说：
  rationale: 引出下一节书信的内容；冒号显示句意尚未结束。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名；音译“雅威”保留其作为以色列上帝专名的性质，而不以称号替代。
- issue: בְשִׁמְךָ 是否明示擅自授权的意味
  choice: 正文译“以自己的名义”，脚注保留“以你的名”
  alternative: 仅译“以你的名”
  rationale: “以自己的名义”符合上下文中与奉雅威之名说话的潜在对照，但原短语本身也可较中性地理解，因此以脚注保留其形式和语义张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“万军之雅威—以色列的上帝”用破折号清楚标示同位关系；句末用冒号承接下一节。脚注标记置于实际涉及的“以自己的名义”之后，而非神的称号之后。
