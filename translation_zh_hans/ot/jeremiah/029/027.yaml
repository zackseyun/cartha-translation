base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/029/027.yaml
  text: And now[a], why have you not rebuked Jeremiah the Anathothite, who is prophesying to you?
translation:
  language: zh_hans
  text: 现在，你为什么不斥责那个正在向你们说预言的亚拿突人耶利米呢？
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַתָּה
  choice: 现在
  rationale: 作为话语标记，引出申诉的下一点；现代汉语中省去生硬的“而”更自然，语境仍保留承接意味。
- source_word: לָמָּה לֹא גָעַרְתָּ
  choice: 你为什么不斥责……呢
  rationale: לָמָּה与否定词及完成式动词构成责问；“斥责”体现גער所含严厉责备、制止的语气。汉语用“呢”加强质问语势。
- source_word: בְּיִרְמְיָהוּ
  choice: 耶利米
  rationale: 按现代简体中文圣经人名的通行译法音译。
- source_word: הָעֲנְּתֹתִי
  choice: 亚拿突人
  rationale: 这是由地名“亚拿突”构成的居民称谓；译作“亚拿突人”既保留希伯来语形式，也自然简洁。
- source_word: הַמִּתְנַבֵּא
  choice: 正在……说预言的
  rationale: 带冠词的分词作定语，描述当时持续进行的先知活动；“正在”体现其进行性。
- source_word: לָכֶם
  choice: 向你们
  rationale: 介词ל在此最自然地标明预言所面向的听众；复数“你们”保留原文数的信息。
theological_decisions:
- issue: הַמִּתְנַבֵּא是否暗示虚假或僭称先知
  choice: 正在……说预言的
  alternative: 冒充先知的／妄自说预言的
  rationale: 该动词形式本身可描述进行先知活动，并不必然判定真假；译文不把上下文中的敌意或指控提前写入词义，以保留原文张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。句序略作汉语化处理，将“亚拿突人耶利米”置于关系性定语之后；保留质问语气和复数受话者。原文没有需要另列脚注才能表达的关键歧义。
