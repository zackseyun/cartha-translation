base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/029/022.yaml
  text: And from them a curse will be taken up by all the exiles of Judah who are in Babylon[a], saying, “May Yahweh make you like Zedekiah and like Ahab, whom the king of Babylon roasted in the fire.”
translation:
  language: zh_hans
  text: 犹大所有在巴比伦的流亡者都必以他们为例，说出这样的咒诅：“愿雅威使你像西底家，又像亚哈；巴比伦王在火中烤了他们[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在火中烧了他们。”这里的希伯来语动词可泛指“烧”；译作“烤”则保留其鲜明、强烈的意味。
    reason: 词义存在较宽泛与较具体两种合理表达。
lexical_decisions:
- source_word: וְלֻקַּח מֵהֶם קְלָלָה
  choice: 都必拿他们作咒诅的话
  rationale: 被动式“必被取来”在这里表示以二人的遭遇形成并采用一句咒诅语。中文用“拿他们作咒诅的话”自然表达这一惯用意义，同时保留“从他们而来”的关联。
- source_word: לְכֹל גָּלוּת יְהוּדָה אֲשֶׁר בְּבָבֶל
  choice: 犹大所有住在巴比伦的流亡者
  rationale: גָּלוּת在此指被掳离乡的群体，而非抽象的“被掳”状态；“流亡者”是清楚、现代的表达。介词短语按语境处理为采用该咒诅语的群体。
- source_word: יְשִׂמְךָ יְהוָה
  choice: 愿雅威使你
  rationale: 未完成式在咒诅公式中表达愿望，“愿……使你”准确传达其祈愿兼诅咒的语气。
- source_word: כְּצִדְקִיָּהוּ וּכְאֶחָב
  choice: 像西底家和亚哈一样
  rationale: 两个כְּ均表示比较；中文以“像……和……一样”自然呈现二人并列作为受咒诅的先例。
- source_word: קָלָם
  choice: 把他们……烤了
  rationale: קלה的Piel形可指烘烤、烤灼；“烤”保留原文强烈而具体的意象，未将其弱化为较宽泛的“烧”。
- source_word: בָּאֵשׁ
  choice: 放在火中
  rationale: בְּ在此表达处所或方式；“在火中”贴近原文，配合中文句法增补“放”使表达顺畅。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名。译作“雅威”以音译保留其专名性质，而不以“主”等称号替代。
- issue: 咒诅语的祈愿语气
  choice: 愿雅威使你
  alternative: 雅威必使你
  rationale: 语境中的יִשִׂמְךָ表达对受咒诅者的愿望，而非单纯预告；用“愿”保留咒诅公式的语用力量。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“流亡者”避免抽象或古旧的“被掳之民”；“咒诅的话”清楚表明这里指一句会被人沿用的诅咒公式。保留“烤”的刺目意象，并以脚注注明较宽泛的译法。
