base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/029/016.yaml
  text: For thus says Yahweh concerning the king who sits on the throne of David[a], and concerning all the people who dwell in this city—your brothers who did not go out with you into exile—
translation:
  language: zh_hans
  text: 因为耶和华如此说：论到那坐在大卫宝座上的王，也论到住在这城里的众民，就是你们那些没有随你们一同被掳去的弟兄[a]——
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “弟兄”也可译作“同胞”；希伯来文是阳性复数亲属称谓，在这里可广指同属犹大群体的人。
    reason: 说明原文的性别形式及其可能具有的较广语境范围。
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文并引出说明，保留其因果或解释作用。
- source_word: כֹה אָמַר
  choice: 如此说
  rationale: 保留先知宣告公式的庄重感；置于句末符合现代汉语引出后续话语的习惯。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经语境中对四字神名最通行且可辨识的音译。
- source_word: אֶל
  choice: 论到
  rationale: 这里引出宣告所针对或涉及的对象，并非直接向王和百姓说话。
- source_word: הַיּוֹשֵׁב אֶל כִּסֵּא דָוִד
  choice: 那坐在大卫宝座上的
  rationale: 保留在位状态及大卫王朝的指涉；汉语表达自然而贴近原文。
- source_word: כָּל הָעָם הַיּוֹשֵׁב בָּעִיר הַזֹּאת
  choice: 住在这城里的众民
  rationale: 以集合名词“众民”表达 כָּל הָעָם，并自然呈现其居住地点。
- source_word: אֲחֵיכֶם
  choice: 你们……的弟兄
  rationale: 保留原文阳性复数亲属称谓，同时用脚注说明在语境中可广指同胞。
- source_word: אֲשֶׁר לֹא יָצְאוּ אִתְּכֶם בַּגּוֹלָה
  choice: 那些没有和你们一同被掳离去的
  rationale: גּוֹלָה 表示被掳或流亡；“被掳离去”清楚传达历史处境。原文 יָצְאוּ 是主动形式，但中文直译“出去被掳”生硬，故按语境表达。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: “耶和华”是现代普通中文读者最熟悉的专名形式；保留其为专名，而不以“主”这一称号替代。
- issue: אֲחֵיכֶם 的范围
  choice: 弟兄
  alternative: 同胞
  rationale: 正文保留希伯来文阳性复数亲属称谓，不将其范围在正文中预先限定；脚注提示它在此可能广指同属犹大群体的人。
- issue: 流亡表达的语态
  choice: 被掳离去
  alternative: 出去流亡
  rationale: 原文动词形式为主动，但 בַּגּוֹלָה 指被掳的处境。中文采用被动式更自然，也符合历史语境，不据此断定他们是否自愿离开。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“如此说”保留先知宣告公式，并以冒号显示本节句法延续到后文；破折式插入语改用“就是”连接，使普通读者易于理解。
