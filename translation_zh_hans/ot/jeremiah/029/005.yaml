  text: Build houses and live in them[a]; plant gardens and eat their fruit.
translation:
  language: zh_hans
  text: 你们要建造房屋，住在其中〔a〕；栽种园子，吃其中的果子。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנוּ בָתִּים
  choice: 建造房屋
  rationale: בנה的复数祈使式直接表达建造，בָּתִּים指具体的房屋；此译法准确、自然，不额外加入“为自己”等原文未明说的成分。
- source_word: וְשֵׁבוּ
  choice: 住在其中
  rationale: ישב在此处指居住、定居；与“房屋”搭配时，“住在其中”是现代汉语最自然的表达，也保留持续安居的语意。
- source_word: וְנִטְעוּ גַנּוֹת
  choice: 栽种园子
  rationale: נטע是栽种，גַּנּוֹת泛指园子。下句虽提到其出产，但不宜把它限定为“果园”。
- source_word: וְאִכְלוּ אֶת־פִּרְיָן
  choice: 吃园中所出产的
  rationale: פְּרִי可指果实或出产；阴性复数后缀回指“园子”。“园中所出产的”在汉语中自然，并避免“吃园子的果子”可能造成的生硬感。
