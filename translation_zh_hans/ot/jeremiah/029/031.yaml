  text: שְׁלַ֤ח עַל כָּל הַ/גּוֹלָה֙ לֵ/אמֹ֔ר כֹּ֚ה אָמַ֣ר יְהוָ֔ה אֶל שְׁמַעְיָ֖ה הַ/נֶּחֱלָמִ֑י יַ֡עַן אֲשֶׁר֩ נִבָּ֨א לָ/כֶ֜ם שְׁמַעְיָ֗ה וַֽ/אֲנִי֙ לֹ֣א שְׁלַחְתִּ֔י/ו וַ/יַּבְטַ֥ח אֶתְ/כֶ֖ם עַל שָֽׁקֶר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/029/031.yaml
  text: 'Send to all the exiles[a], saying, ‘Thus says Yahweh concerning Shemaiah the Nehelamite: Because Shemaiah has prophesied to you, though I did not send him, and has made you trust in a lie,’'
translation:
  language: zh_hans
  text: 你要传话给所有被掳的人，说：“雅威论到尼希兰人[a]示玛雅如此说：因为示玛雅向你们说预言，我却没有差遣他；他竟使你们信靠谎言，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “尼希兰人”也可能译作“做梦者”；这个称号的词源并不确定，可能与“做梦”一词有关，也可能来自地名或宗族名称。
    reason: 保留הַנֶּחֱלָמִי的词源与身份指称歧义。
lexical_decisions:
- source_word: שְׁלַח עַל כָּל הַגּוֹלָה
  choice: 你要传话给所有被掳的人
  rationale: שְׁלַח是阳性单数命令式，语境中是吩咐耶利米传送信息；עַל与“差送”类动词连用时可指向收信人，הַגּוֹלָה则指被掳群体。译作“传话给所有被掳的人”自然，并补明汉语所需的隐含宾语。
- source_word: לֵאמֹר
  choice: 说
  rationale: 这是常见的引语引介式，用“说”简洁地引出信息内容。
- source_word: כֹּה אָמַר יְהוָה
  choice: 雅威……如此说
  rationale: 保留先知性的使者宣告格式，同时按希伯来文直接呈现神的专名。
- source_word: אֶל שְׁמַעְיָה הַנֶּחֱלָמִי
  choice: 论到尼希兰人示玛雅
  rationale: 此处אֶל在宣告公式后引出神谕所针对的对象，而不是信息的收信人；הַנֶּחֱלָמִי词源不确定，因此正文采用较少解释性的音译称号。
- source_word: יַעַן אֲשֶׁר
  choice: 因为
  rationale: 准确表达引出审判理由的因果关系。
- source_word: נִבָּא לָכֶם
  choice: 向你们说了预言
  rationale: נבא的Niphal形式在此表示以先知身份说预言；“向你们”保留לָכֶם所标明的对象。
- source_word: וַאֲנִי לֹא שְׁלַחְתִּיו
  choice: 我却没有差遣他
  rationale: 连词在此形成鲜明对比；“却”自然表达示玛雅自称说预言、实际并未受神差遣之间的张力。
- source_word: וַיַּבְטַח אֶתְכֶם עַל שָׁקֶר
  choice: 他还使你们信靠谎言
  rationale: בטח的Hiphil形式具有使役含义；“使你们信靠”保留这一语法作用，עַל שָׁקֶר则表示错误信靠的对象或基础。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名יהוה。译作“雅威”以专名形式呈现，不以称号代替，也不在本节中加入额外的神学解释。
- issue: הַנֶּחֱלָמִי的身份含义
  choice: 尼希兰人
  alternative: 做梦者
  rationale: 该词可能是地名或宗族称谓，也可能与“做梦”一词有关。正文采用音译以保存歧义，并在脚注列出另一可能。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“传话”比生硬的“发送”更符合本节的信息传递语境；“被掳的人”清楚指向流亡群体。原句的审判理由延续到下一节，因此末尾保留未完结的逗号与引语开放状态。
