reference: Jeremiah 29:11
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כִּי֩ אָנֹכִ֨י יָדַ֜עְתִּי אֶת הַ/מַּחֲשָׁבֹ֗ת אֲשֶׁ֧ר אָנֹכִ֛י חֹשֵׁ֥ב עֲלֵי/כֶ֖ם נְאֻם יְהוָ֑ה מַחְשְׁב֤וֹת שָׁלוֹם֙ וְ/לֹ֣א לְ/רָעָ֔ה לָ/תֵ֥ת לָ/כֶ֖ם אַחֲרִ֥ית וְ/תִקְוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/029/011.yaml
  text: For I know the plans that I have for you[a], declares Yahweh, plans for peace and not for harm[b], to give you a future and a hope.
translation:
  language: zh_hans
  text: 雅威宣告说：“因为我知道我为你们所筹划的计划，是关乎平安而不是灾祸[a][b]，要赐给你们未来和盼望。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “平安”也可译作“福祉”或“安康”；希伯来语 שָׁלוֹם 还可包含完整、健全和兴盛之意。
    reason: lexical_alternative
  - marker: b
    text: “灾祸”也可译作“伤害”或“祸患”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，为先前的劝勉和应许说明根据，保留原文的连接作用。
- source_word: יָדַעְתִּי
  choice: 我知道
  rationale: 完成式在此表达稳定、确定的认识或意向；现代汉语用现在时最自然。
- source_word: הַמַּחֲשָׁבוֹת / חֹשֵׁב
  choice: 筹划 / 所作的筹划
  rationale: מַחֲשָׁבוֹת 可指思想、意图或计划；结合后文目的表达，译作“筹划”能体现有意向的安排，并保留名词与同根动词的呼应。
- source_word: עֲלֵיכֶם
  choice: 为你们
  rationale: 介词可表示朝向、关乎；语境显示这些筹划以被掳群体为对象，译作“为你们”自然且不额外扩张含义。
- source_word: נְאֻם יְהוָה
  choice: 这是雅威的宣告
  rationale: 保留庄严的先知宣告公式，并将四字神名按其专名音译。
- source_word: מַחְשְׁבוֹת שָׁלוֹם
  choice: 赐平安的筹划
  rationale: שָׁלוֹם 的直接对应是“平安”，同时可涵盖安康、完整和兴盛；较宽的语义范围在脚注说明。
- source_word: וְלֹא לְרָעָה
  choice: 不降灾祸
  rationale: רָעָה 可指恶、伤害或灾祸；与 שָׁלוֹם 对举并结合耶利米书的灾难语境，“灾祸”比道德性的“邪恶”更合适。
- source_word: לָתֵת לָכֶם
  choice: 要给你们
  rationale: 准确表达目的或结果，并符合现代汉语表达。
- source_word: אַחֲרִית
  choice: 未来
  rationale: 该词可指末后、结局或将来的结果；在应许语境中，“未来”自然表达其向前展望的意义，同时脚注说明其本义范围。
- source_word: תִקְוָה
  choice: 盼望
  rationale: 表达有根据的期待，与“未来”并列，保留原文两个名词的结构。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；“雅威”按现代常见学术读音音译，保留其作为以色列之神专名的性质，而不以称号替代。
- issue: שָׁלוֹם 在应许语境中的范围
  choice: 平安
  alternative: 福祉；安康
  rationale: 正文采用直接而传统的词义，同时以脚注保留其包含完整、安康与兴盛的较广范围，避免把它缩减为仅仅没有冲突。
- issue: רָעָה 的道德义与灾祸义
  choice: 灾祸
  alternative: 伤害；祸患；恶
  rationale: 这里与“平安”对举，重点是所遭遇的不幸或灾难，而非道德邪恶；但脚注保留“伤害”等可能译法。
- issue: אַחֲרִית 的时间与结果含义
  choice: 未来
  alternative: 结局；末后
  rationale: “未来”符合本节正面应许的语境，但原词也可侧重最终结局，故不把这一层含义视为被排除。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。破折号标出先知宣告插语；重复“筹划”以保留原文名词与同根动词的修辞联系。正文中的“你们”为复数，指向被掳群体，未改写为个人化的单数应许。
