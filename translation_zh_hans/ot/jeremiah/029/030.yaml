  text: וַֽ/יְהִי֙ דְּבַר יְהוָ֔ה אֶֽל יִרְמְיָ֖הוּ לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/029/030.yaml
  text: Then the word of Yahweh came to Jeremiah[a], saying,
translation:
  language: zh_hans
  text: 于是，雅威[a]的话临到耶利米，说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文为“YHWH”（四字神名）；传统上常译作“耶和华”或“主”。
    reason: 说明神名的原文形式，并保留传统译法及读音重构所涉及的文本与翻译差异。
lexical_decisions:
- source_word: וַיְהִי
  choice: 于是……临到
  rationale: 此处的叙事性连接形式推进下一事件；用“于是”自然表达先后衔接，并与“临到”共同构成现代汉语先知书中清楚、庄重的叙述。
- source_word: דְּבַר
  choice: 话
  rationale: 在“雅威的话”这一先知性惯用语中，“话”既贴近原文，又比“信息”更能保留该固定表达。
- source_word: יְהוָה
  choice: 雅威
  rationale: 原文使用以色列上帝的专名四字神名 YHWH；“雅威”按较通行的学术重构音译，保留其专名性质，不以称号代替。
- source_word: אֶל
  choice: 临到
  rationale: 虽然介词本身表示“向、到”，但与“话”搭配时，现代汉语用“话临到某人”最自然，也保留先知领受启示的传统表达。
- source_word: יִרְמְיָהוּ
  choice: 耶利米
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: לֵאמֹר
  choice: 说
  rationale: 该不定式用于引出随后直接话语；译作“说”简洁自然，并提示下一节是话语内容。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用神的专名。正文音译为“雅威”，避免以“主”这一称号取代专名；脚注同时说明原文形式及传统译法，不把有争议的读音重构说成绝对确定。
translation_notes:
  register: 采用现代、简洁而庄重的先知书语体。“于是”承接叙事，“话临到……说”保留原文公式化结构，又符合普通现代读者的阅读习惯。脚注标记紧随其所解释的神名。
