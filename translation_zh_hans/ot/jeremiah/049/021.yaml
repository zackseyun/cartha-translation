  text: מִ/קּ֣וֹל נִפְלָ֔/ם רָעֲשָׁ֖ה הָ/אָ֑רֶץ צְעָקָ֕ה בְּ/יַם ס֖וּף נִשְׁמַ֥ע קוֹלָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/021.yaml
  text: At the sound of their fall the earth quakes[a]; their cry is heard at the Red Sea.
translation:
  language: zh_hans
  text: 因他们倒下的响声，大地震动；他们的呼喊声在红海[a]也能听见。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文作“芦苇海”；传统译作“红海”。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקּוֹל
  choice: 因……的响声
  rationale: 介词 מִן 在这里可表示来源或缘由；结合大地震动的结果，译作“因……的响声”自然地保留因果或触发关系。
- source_word: נִפְלָם
  choice: 他们倒下
  rationale: 源自动词 נפל，直指倒下或倾覆；不译作“覆灭”，以免把形象过度解释为抽象的败亡。
- source_word: רָעֲשָׁה
  choice: 震动
  rationale: רעשׁ 表示摇撼、震颤；“大地震动”既符合汉语表达，也保留灾变性意象。
- source_word: הָאָרֶץ
  choice: 大地
  rationale: אֶרֶץ 可指土地或大地；此处夸张而宏阔的审判图景适合译作“大地”，同时不像“全世界”那样扩大语义。
- source_word: צְעָקָה
  choice: 呼喊声
  rationale: 该词指呼喊、哀号或呼救之声；上下文未明确限定其情感性质，因此用较宽泛的“呼喊声”。
- source_word: בְּיַם סוּף
  choice: 在红海
  rationale: יַם־סוּף 是传统上称为“红海”的地名；介词 בְּ 在此表示声音传到并可在该处听见。正文采用通行名称，脚注保留其较贴近字面的译法。
- source_word: נִשְׁמַע
  choice: 也能听见
  rationale: שׁמע 的尼法勒式在此表达被动可闻；“也能听见”自然传达声音远播至该地。
- source_word: קוֹלָהּ
  choice: 他们的呼喊声
  rationale: 阴性单数后缀最自然地回指阴性名词 צְעָקָה。汉语将“它的声音”合并为“他们的呼喊声”，避免生硬重复，并借前文复数对象明确呼喊者。
theological_decisions: []
