base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/027.yaml
  text: And I will kindle a fire in the wall of Damascus[a], and it will consume the palaces of Ben-hadad.
translation:
  language: zh_hans
  text: 我要在大马士革的城墙上点火[a]，火必烧毁便哈达的宫殿。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我要向大马士革的城墙放火。”这里的介词所表达的具体空间关系可以有不同理解。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִצַּתִּי
  choice: 我要……点火
  rationale: 这是 יצת 的使役式完成时第一人称单数，带连接词；在先知审判宣告中表达上帝亲自使火燃起。译作“我要……点火”自然、直接，并保留使役含义。
- source_word: אֵשׁ
  choice: 火
  rationale: 希伯来语为单数名词；现代汉语在“点火”这一搭配中无需添加数量词。后句重复“火”，可清楚标明动词的主语。
- source_word: בְּחוֹמַת
  choice: 在……的城墙上
  rationale: 介词 בְּ 在此可表达位于、进入或针对城墙的空间关系。“在……城墙上”保留火燃于城防设施的意象，同时以脚注说明也可理解为“向……的城墙放火”。
- source_word: דַּמָּשֶׂק
  choice: 大马士革
  rationale: 采用现代汉语通行地名译法。
- source_word: וְאָכְלָה
  choice: 火必烧毁
  rationale: 这是阴性单数动词，与“火”呼应，字面有“吞吃、吞噬”之意；“烧毁”在汉语火灾与审判语境中自然有力，并明确火是施事者。“必”体现先知性宣告的确定性。
- source_word: אַרְמְנוֹת
  choice: 宫殿
  rationale: אַרְמוֹן 可指宫殿、堡垒或设防的王室建筑；与便哈达这一王名相连时，“宫殿”最贴合语境，同时不排除建筑具有防御性质。
- source_word: בֶּן הֲדָד
  choice: 便哈达
  rationale: 采用中文圣经传统中广为人知的音译，作为亚兰君王的名号处理。
theological_decisions:
- issue: 隐含的神圣说话者与审判施行者
  choice: 直接保留第一人称“我要”，不补出“耶和华说”等字样
  alternative: 补译为“耶和华要”或“耶和华说：我要”
  rationale: 本节承接上文，上帝是说话者；原文只用第一人称动词。直接翻译既呈现上帝亲自施行审判，也不增添原文没有的称谓。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“点火—烧毁”清楚传达原文的因果推进；保留大马士革城墙与便哈达宫殿的具体审判意象。脚注标记[a]已置于对应短语之后。
