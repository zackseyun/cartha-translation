base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/006.yaml
  text: But afterward I will restore the fortunes of the people of Ammon[a], declares Yahweh.
translation:
  language: zh_hans
  text: 但在这以后，我必使亚扪人的境况恢复[a]。——这是雅威的宣告。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“恢复亚扪人的被掳境况”，或“带回被掳的亚扪人”。这个希伯来语惯用表达既可指被掳状态的逆转，也可较广泛地指境况的恢复。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַחֲרֵי כֵן
  choice: 但此后
  rationale: אַחֲרֵי כֵן表示“此后、后来”；前缀连词结合上下文从审判转向复兴的语篇转折，译作“但”，同时保留时间次序。
- source_word: אָשִׁיב
  choice: 我必使……复原
  rationale: שוב的使役式表示“使返回、恢复”。与שְׁבוּת构成复兴惯用语时，译为“使……复原”自然且贴合语义。
- source_word: אֶת שְׁבוּת
  choice: 境况
  rationale: שְׁבוּת在这一固定表达中既可指被掳状态或被掳者，也可较广泛地指遭逆转的境况；正文采用“使……境况复原”表达该惯用语的宽泛含义，并以脚注保留“结束被掳、带回被掳之人”的可能性。
- source_word: בְּנֵי עַמּוֹן
  choice: 亚扪人
  rationale: 字面为“亚扪之子”，实际是民族共同体称谓；现代汉语以“亚扪人”表达最自然清楚。
- source_word: נְאֻם יְהוָה
  choice: 这是雅威的宣告
  rationale: נְאֻם是先知话语中庄重的神谕公式；“这是……的宣告”比一般的“说”更能体现其固定公式性质。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以音译呈现神的专名，而不以称号替代。
theological_decisions:
- issue: 审判之后给亚扪人的复兴应许
  choice: 将其译为真实的未来复原应许，但不限定复原的方式、范围或性质。
  alternative: 将其仅解释为政治复国，或脱离亚扪民族所指而完全属灵化。
  rationale: 希伯来文明确宣告雅威将来会使亚扪人的境况复原，却没有说明这复原如何实现或涵盖哪些层面；译文保留这种开放性和神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“境况复原”避免把原文惯用语仅限于政治复国或字面回归，同时脚注交代较直译的被掳含义。
