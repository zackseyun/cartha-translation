  text: לָ/כֵ֛ן יִפְּל֥וּ בַחוּרֶ֖י/הָ בִּ/רְחֹבֹתֶ֑י/הָ וְ/כָל אַנְשֵׁ֨י הַ/מִּלְחָמָ֤ה יִדַּ֨מּוּ֙ בַּ/יּ֣וֹם הַ/ה֔וּא נְאֻ֖ם יְהוָ֥ה צְבָאֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/026.yaml
  text: Therefore her young men will fall in her streets[a], and all the men of war will be silenced on that day[c][b], declares Yahweh of Armies.
translation:
  language: zh_hans
  text: 因此，她的青年必倒在她的街道上[a]；在那日，所有的战士都必归于沉寂[b]。这是万军之耶和华的宣告。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“广场上”或“空旷处”。
    reason: lexical_alternative
  - marker: b
    text: “归于沉寂”也可译作“灭亡”或“被剪除”；原文动词可指静默、止息，也可指遭到毁灭。
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: 因此
  rationale: 表示前述审判所导致的结果；“因此”简洁、自然，并保留推论关系。
- source_word: יִפְּלוּ
  choice: 必倒下
  rationale: 在战争审判语境中通常指战死；译作“倒下”保留希伯来语意象，不把死亡含义说得过满。
- source_word: בַחוּרֶיהָ
  choice: 她的青年
  rationale: 指正值壮年、适合参战的年轻男子；“青年”自然且保留年龄重点。
- source_word: בִּרְחֹבֹתֶיהָ
  choice: 在她的街道上
  rationale: רְחוֹב可指宽街、广场或公共空地；正文采用现代汉语中适合城市战乱场景的“街道”，脚注保留其他可能。
- source_word: אַנְשֵׁי הַמִּלְחָמָה
  choice: 战士
  rationale: 该词组直指参与战争的人；“战士”比逐字的“战争之人”更符合现代汉语。
- source_word: יִדַּמּוּ
  choice: 必归于沉寂
  rationale: 该动词可表示静默、止息，也可在审判语境中暗指灭亡；“归于沉寂”保留意象及其含蓄的毁灭意味。
- source_word: בַּיּוֹם הַהוּא
  choice: 到那日
  rationale: 先知话语中的常见时间表达；“到那日”符合现代汉语，并带出所预告审判来临之意。
- source_word: נְאֻם
  choice: 这是……说的
  rationale: 清楚传达认证神谕的先知公式，语言庄重而易懂。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者普遍熟悉的神名音译，不以一般称号替代专名。
- source_word: צְבָאוֹת
  choice: 万军
  rationale: 与יהוה构成传统且简洁的中文称号“万军之耶和华”；“军”保留其统帅众军的意味。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用四字神名。中文正文采用广为人知且具专名功能的“耶和华”；“雅威”是较接近现代学术重构读音的另一译法。
- issue: 称号יהוה צבאות的译法
  choice: 万军之耶和华
  alternative: 众军之耶和华
  rationale: “万军之耶和华”在现代中文中庄重、易于识别，也保留称号的军事色彩；“众军之耶和华”较透明，但不如前者自然。
- issue: יִדַּמּוּ在审判语境中的力度
  choice: 归于沉寂
  alternative: 灭亡／被剪除
  rationale: 原词可表达静默、止息或遭毁灭。正文保留其修辞意象与语义张力，脚注说明语境中较强的死亡或毁灭含义。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“她”承接城邑大马士革的阴性拟人指称。分号呈现两个平行的审判结果；末句保留先知神谕公式。所有脚注标记均已在正文出现。
