  text: לֶ/אֱד֗וֹם כֹּ֤ה אָמַר֙ יְהוָ֣ה צְבָא֔וֹת הַ/אֵ֥ין ע֛וֹד חָכְמָ֖ה בְּ/תֵימָ֑ן אָבְדָ֤ה עֵצָה֙ מִ/בָּנִ֔ים נִסְרְחָ֖ה חָכְמָתָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/007.yaml
  text: 'Concerning Edom: Thus says Yahweh of hosts: Is there no longer wisdom in Teman? Has counsel perished from the prudent? Has their wisdom become corrupted?[a][b]'
translation:
  language: zh_hans
  text: '论以东。万军之耶和华如此说：

    “提幔不再有智慧了吗？

    明达人的谋略已经消失了吗？[a]

    他们的智慧已经败坏了吗？[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “明达人”也可译作“有见识的人”；原文并不是指血缘意义上的“儿子”。
    reason: lexical_alternative
  - marker: b
    text: “败坏”也可译作“变坏”或“腐坏”；原文动词带有东西变质、败坏的意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: לֶאֱדוֹם
  choice: 论以东
  rationale: 介词 לְ 在民族名之前引出预言的对象或主题；“论以东”符合中文先知书的庄重标题体，也不强行解释为“攻击以东”或“给以东”。
- source_word: יְהוָה צְבָאוֹת
  choice: 万军之耶和华
  rationale: “耶和华”保留圣名的传统汉语形式，“万军”直接呈现 צְבָאוֹת 的军旅及天上众军意象。
- source_word: הַאֵין עוֹד חָכְמָה בְּתֵימָן
  choice: 提幔不再有智慧了吗
  rationale: הַאֵין עוֹד 表示追问某物是否已不复存在；“不再有”自然地传达其终止意味。提幔是以东境内地名。
- source_word: אָבְדָה עֵצָה מִבָּנִים
  choice: 明达人的谋略已经消失了吗
  rationale: מִבָּנִים 在此来自表示理解、辨识的词根 בין，指有见识的人，并非“儿子”；עֵצָה 译作“谋略”，与智慧语境相合。
- source_word: נִסְרְחָה חָכְמָתָם
  choice: 他们的智慧已经败坏了吗
  rationale: נִסְרְחָה 含变坏、腐败、走味之意；“败坏”既保留恶化的形象，又比“腐烂”更适合修饰抽象的“智慧”。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 采用现代中文圣经读者熟悉且庄重的传统译名；不以“主”取代专名，同时承认“雅威”更接近常见学术拟音。
- issue: 三个问句的修辞力度
  choice: 均保留疑问形式
  alternative: 改译为断言，如“提幔已没有智慧”
  rationale: 希伯来文本连续使用疑问表达讥讽与哀叹；保留问句可避免替原文消解其修辞张力。
translation_notes:
  register: 采用现代、庄重而易懂的先知书语体。以“论以东”作简洁标题，以三个平行问句保留原文的节奏、讥诮和神学张力；避免古奥的“岂无”句式，同时保留“万军”这一重要意象。
