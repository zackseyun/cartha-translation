language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: לָ/כֵ֞ן שִׁמְע֣וּ עֲצַת יְהוָ֗ה אֲשֶׁ֤ר יָעַץ֙ אֶל אֱד֔וֹם וּ/מַ֨חְשְׁבוֹתָ֔י/ו אֲשֶׁ֥ר חָשַׁ֖ב אֶל יֹשְׁבֵ֣י תֵימָ֑ן אִם לֹ֤א יִסְחָבוּ/ם֙ צְעִירֵ֣י הַ/צֹּ֔אן אִם לֹ֥א יַשִּׁ֛ים עֲלֵי/הֶ֖ם נְוֵ/הֶֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/020.yaml
  text: 'Therefore hear the counsel of Yahweh that he has planned against Edom[a], and his thoughts that he has devised against the inhabitants of Teman: Surely the little ones of the flock will drag them away[b]; surely he will make their pasture desolate over them.'
translation:
  language: zh_hans
  text: 所以，你们要听耶和华对以东所定的谋略，和他对提幔居民所筹划的意念：羊群中弱小的，必把他们拖走[a]；他必使他们的居所成为荒凉，临到他们身上[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “羊群中弱小的”也可译作“羊群中年幼的”或“羊群中最小的”。这可能比喻最弱小或最不起眼的攻击者。
    reason: 保留צְעִירֵי הַצֹּאן在年龄、体量和地位方面的词义弹性及其比喻可能。
  - marker: b
    text: “居所”也可译作“牧场”或“羊圈”。“临到他们身上”对应原文较字面的“在他们之上”；该短语的确切句法关系有歧义。
    reason: 说明נָוֶה可指住处、牧场或羊圈，并保留עֲלֵיהֶם的空间性／灾祸临到之义，避免加入原文未明示的因果关系。
lexical_decisions:
- source_word: לָכֵן
  choice: 所以
  rationale: 自然表达承接上文的推论关系。
- source_word: שִׁמְעוּ
  choice: 你们要听
  rationale: 保留复数命令语气，也符合先知宣告的庄重风格。
- source_word: עֲצַת יְהוָה
  choice: 耶和华所定的谋略
  rationale: עֵצָה可指谋略、计划或旨意；“谋略”保留神圣筹议的意味，并与下句用词有所区别。神名按希伯来文音译为“耶和华”。
- source_word: יָעַץ אֶל אֱדוֹם
  choice: 对以东所定
  rationale: 结合敌对审判的语境，以“对以东所定”自然表达计划所针对的对象，同时不过度解释介词。
- source_word: מַחְשְׁבוֹתָיו אֲשֶׁר חָשַׁב
  choice: 他……所筹划的意念
  rationale: 保留名词“意念”与动词“筹划”的词根呼应和有意谋定之义。
- source_word: יֹשְׁבֵי תֵימָן
  choice: 提幔居民
  rationale: 直接、简洁地表达当地居住者。
- source_word: אִם לֹא
  choice: 必
  rationale: 此处是誓言式的强调结构，并非普通条件句；汉语用“必”传达断然肯定。
- source_word: יִסְחָבוּם
  choice: 必把他们拖走
  rationale: 保留סחב所呈现的强力拖曳意象。
- source_word: צְעִירֵי הַצֹּאן
  choice: 羊群中弱小的
  rationale: צָעִיר可指年幼、微小或卑微者；译文保留羊群比喻，同时不武断限定为“幼羊”。
- source_word: נְוֵהֶם
  choice: 他们的居所
  rationale: נָוֶה可指住处、牧场或羊圈；“居所”适合指以东人的住地，同时由脚注保留牧场意象的可能。
- source_word: עֲלֵיהֶם
  choice: 因他们而
  rationale: 在使某处荒凉的结构中表达灾祸临到他们并造成其住地荒废；希伯来语也可较形式地理解为“在他们之上”，故以脚注说明。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 采用现代中文圣经读者最熟悉、庄重且可辨识的专名“耶和华”，不以称号“主”替代原文专名。
- issue: צְעִירֵי הַצֹּאן 的比喻所指
  choice: 保留“羊群中弱小的”这一比喻
  alternative: 解释为最弱小或最不起眼的攻击者
  rationale: 原文没有明确说这些是谁；正文保留意象及其含混性，避免把可能的修辞含义写成确定解释。
- issue: 末句主语与荒凉结果
  choice: 延续上文单数主语“他”，译为“他必使”
  alternative: 无主句“他们的居所必荒凉”
  rationale: יַשִּׁים是第三人称阳性单数，使役意义清楚，最自然地回指耶和华。
translation_notes:
  register: 采用现代、庄重而易懂的先知宣告体。以两个“必”再现誓言式强调；保留羊群意象，并用脚注呈现原文末句的真实歧义。
