id: JER.49.17
reference: Jeremiah 49:17
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/הָיְתָ֥ה אֱד֖וֹם לְ/שַׁמָּ֑ה כֹּ֚ל עֹבֵ֣ר עָלֶ֔י/הָ יִשֹּׁ֥ם וְ/יִשְׁרֹ֖ק עַל כָּל מַכּוֹתֶֽ/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/017.yaml
  text: Edom will become a desolation[b][a]; everyone who passes by her will be appalled and will whistle at all her wounds.
translation:
  language: zh_hans
  text: 以东必变成一片荒凉[a]；凡从那里经过的人，都必惊骇，并因她所受的一切创伤而发出嘘声[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “荒凉”也可译作“令人惊骇之地”。希伯来语原词既指毁坏后的荒凉，也含这景象令人震骇的意味。
    reason: lexical_alternative
  - marker: b
    text: “发出嘘声”也可译作“吹口哨”。希伯来语动词指发出尖锐的声音，可表示惊异或讥诮。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיְתָה
  choice: 必变成
  rationale: 该完成式在先知性语境中表达将来的结果状态；“必变成”既体现未来，也传达进入荒凉状态的意思。
- source_word: אֱדוֹם
  choice: 以东
  rationale: 采用现代中文圣经传统通行的专名译法。
- source_word: לְשַׁמָּה
  choice: 一片荒凉
  rationale: שַׁמָּה既可指毁坏荒凉的状态，也可包含这景象令人震骇的意味；正文以自然中文突出实际的荒凉，反应层面的含义由下文“惊骇”表达，并在脚注保留词义张力。
- source_word: כָּל עֹבֵר עָלֶיהָ
  choice: 凡从那里经过的人
  rationale: 希伯来文为集合性单数。中文以“凡……的人”自然表达全称；地点代词用“那里”，避免中文中把土地拟人化为“她”所造成的不自然。
- source_word: יִשֹּׁם
  choice: 都必惊骇
  rationale: 此处 שמם 描写过路人面对毁灭景象时震惊骇异的反应；“惊骇”兼具震惊和恐惧色彩。
- source_word: וְיִשְׁרֹק
  choice: 并……发出嘘声
  rationale: 该动词指发出尖锐声响，可表达惊异或讥诮。“发出嘘声”较“吹口哨”更能避免现代中文中轻快或赞赏的联想，同时不强行限定其究竟是惊叹还是嘲弄。
- source_word: עַל כָּל מַכּוֹתֶיהָ
  choice: 因她所受的一切创伤
  rationale: מַכּוֹת本指击打，也可指由此造成的伤害、灾祸；“创伤”保留击打后的结果意象。עַל按原因关系译作“因”。此处保留“她”，承接希伯来文把以东之地视为阴性对象的表达。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“必”体现先知宣告的确定性；分号保留原句两部分的推进关系。脚注标记均置于其所解释的词语之后。
