  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: שְׁמוּעָ֤ה שָׁמַ֨עְתִּי֙ מֵ/אֵ֣ת יְהוָ֔ה וְ/צִ֖יר בַּ/גּוֹיִ֣ם שָׁל֑וּחַ הִֽתְקַבְּצוּ֙ וּ/בֹ֣אוּ עָלֶ֔י/הָ וְ/ק֖וּמוּ לַ/מִּלְחָמָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/014.yaml
  text: 'I have heard a report from Yahweh[a], and a messenger has been sent among the nations: “Gather yourselves, and come against her[b], and rise up for battle.”'
translation:
  language: zh_hans
  text: '我从雅威那里听见了消息；有一位使者[a]奉差遣到列国中，说：

    “你们要聚集起来，前来攻击她[b]！

    起来争战吧！”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “使者”也可译作“特使”或“使节”。
    reason: lexical_alternative
  - marker: b
    text: “她”指上下文中被拟人化为女性的以东。
    reason: cross_reference
lexical_decisions:
- source_word: שְׁמוּעָה שָׁמַעְתִּי
  choice: 我……听见了消息
  rationale: 保留希伯来文“听见消息”的表达，并以现代汉语自然呈现完成动作；“消息”符合先知宣告的语境。
- source_word: מֵאֵת יְהוָה
  choice: 从雅威那里
  rationale: מֵאֵת 表明消息的来源；将四字神名 יְהוָה 音译为“雅威”，保留其专名性质。
- source_word: צִיר
  choice: 使者
  rationale: 该词可指使者、特使或使节；“使者”涵盖面较广，清楚自然，同时在脚注保留外交使节的可能含义。
- source_word: בַּגּוֹיִם שָׁלוּחַ
  choice: 奉差遣到列国中
  rationale: שָׁלוּחַ 是被动分词，表示此人受命被派出；בַּגּוֹיִם 可理解为在列国中或到列国中，在此召集各国出战的语境里译作“到列国中”更自然。
- source_word: הִתְקַבְּצוּ
  choice: 你们要聚集起来
  rationale: 准确表达复数命令及集结军队的含义，符合现代汉语。
- source_word: וּבֹאוּ עָלֶיהָ
  choice: 前来攻击她
  rationale: בוא על 在军事语境中表示向目标进军、攻击；保留阴性单数代词“她”，不在正文中消解其拟人表达。
- source_word: וְקוּמוּ לַמִּלְחָמָה
  choice: 起来争战吧
  rationale: 保留 קום“起来”的动作力度，并用“争战”传达 לַמִּלְחָמָה 的军事号召。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名，音译“雅威”保留其作为立约之神专名的性质，而不以称号替代。
- issue: 阴性代词 עָלֶיהָ 的所指
  choice: 正文保留“她”，脚注说明指以女性形象拟人化的以东
  alternative: 正文直接译为“以东”
  rationale: 保留原文的语法形式和拟人修辞，同时借脚注消除现代读者可能产生的指代疑惑。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。以分号区分先知所听见的消息与使者发出的引语，并用短句和感叹号呈现军事召集令的紧迫感。脚注标记均放在其实际说明的词语之后；原英文咨询层将[a]置于神名之后，但其脚注内容实际解释 צִיר，因此中文稿将[a]置于“使者”之后。
