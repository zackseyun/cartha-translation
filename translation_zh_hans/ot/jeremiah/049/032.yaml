  text: וְ/הָי֨וּ גְמַלֵּי/הֶ֜ם לָ/בַ֗ז וַ/הֲמ֤וֹן מִקְנֵי/הֶם֙ לְ/שָׁלָ֔ל וְ/זֵרִתִ֥י/ם לְ/כָל ר֖וּחַ קְצוּצֵ֣י פֵאָ֑ה וּ/מִ/כָּל עֲבָרָ֛י/ו אָבִ֥יא אֶת אֵידָ֖/ם נְאֻם יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/032.yaml
  text: Their camels will become plunder[a], and their many livestock spoil. I will scatter to every wind those who cut the corners of their hair, and from all sides of them I will bring their disaster[b], declares Yahweh.
translation:
  language: zh_hans
  text: 他们的骆驼必成为掠物，众多的牲畜必成为战利品。我要把那些剪短鬓发的人[a]驱散到四面八方[b]；我要从他们周围各处使灾祸临到他们。这是雅威的宣告。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “剪短鬓发的人”原文也可译作“剪去头发边角的人”，指一种具有辨识度的修剪习俗。
    reason: 原文短语的具体部位和习俗细节并不完全确定。
  - marker: b
    text: 原文直译为“散到各风”，意思是驱散到各个方向。
    reason: 保留希伯来语意象，并说明中文正文的习语化表达。
lexical_decisions:
- source_word: גְמַלֵּיהֶם לָבַז
  choice: 他们的骆驼必成为掠物
  rationale: גָּמָל明确指骆驼；לָבַז表示被敌人掳掠所得之物。“掠物”保留军事审判语境，且与后面的“战利品”有所区分。
- source_word: הֲמוֹן מִקְנֵיהֶם לְשָׁלָל
  choice: 众多的牲畜必成为战利品
  rationale: הֲמוֹן表达数量众多，מִקְנֶה在此指牲畜，שָׁלָל指战争中夺取的战利品。
- source_word: וְזֵרִתִים לְכָל רוּחַ
  choice: 我要把……吹散到四面八方
  rationale: 动词表示驱散；“到各风”是向各方向分散的形象。“吹散到四面八方”在现代汉语中自然，并保留“风”的隐含意象。
- source_word: קְצוּצֵי פֵאָה
  choice: 那些剪短鬓发的人
  rationale: 该短语字面涉及剪去头发边缘或角落，可能指太阳穴两侧的特殊修剪习俗。“剪短鬓发”比“剪去头发的角”自然，同时不把所指武断限定为胡须。
- source_word: וּמִכָּל עֲבָרָיו אָבִיא אֶת אֵידָם
  choice: 我要从他们周围各处使灾祸临到他们
  rationale: מִכָּל עֲבָרָיו表示从其四边或周围各处；אֵידָם是他们的灾祸。此译法自然表达灾祸从各方临到他们，并保留复数宾语所指。
- source_word: נְאֻם יְהוָה
  choice: 这是雅威的宣告
  rationale: נְאֻם是庄严的先知宣告公式；יְהוָה按其专名译作“雅威”。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；采用“雅威”作为较贴近学界通常重构读音的现代中文音译，不以称号取代专名。
- issue: קְצוּצֵי פֵאָה 所指的修剪部位
  choice: 剪短鬓发的人
  alternative: 剪去头发边角的人；剪短太阳穴两侧头发的人
  rationale: 原文保留一定习俗性含义，未明确说明是头发还是胡须；正文采用可懂而不过度具体的表达，脚注说明字面与可能含义。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。以“掠物／战利品”呈现两个近义希伯来词的差别；句式保持先知审判宣告的力度。正文脚注标记均与脚注内容对应。
