base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/024.yaml
  text: Damascus has become feeble[a]; she has turned to flee, and trembling has seized her. Distress and labor pains have taken hold of her[c][b], like a woman giving birth.
translation:
  language: zh_hans
  text: 大马士革已经衰弱[a]；她转身逃跑，战栗攫住了她[b]。她被患难和产痛攫住[c]，如同临产的妇人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “衰弱”也可译作“软弱无力”或“丧胆”；希伯来语动词既可表示力量衰退，也可表示勇气丧失。
    reason: lexical_alternative
  - marker: b
    text: “战栗”也可译作“颤抖”或“恐惧”；原词较直接地指身体震颤，语境中很可能是因恐惧而发。
    reason: lexical_alternative
  - marker: c
    text: “产痛”也可译作“阵痛”或“生产之痛”；下一句以临产妇人为喻，支持这里的生产语境。
    reason: lexical_alternative
lexical_decisions:
- source_word: רָפְתָה
  choice: 已经软弱无力
  rationale: 该动词表示松弛、衰弱或丧失勇气；此译保留力量与胆气衰退的双重可能，也符合现代汉语表达。
- source_word: דַמֶּשֶׂק
  choice: 大马士革
  rationale: 采用现代汉语通行地名。
- source_word: הִפְנְתָה לָנוּס
  choice: 她转身逃跑
  rationale: 贴近“转向／转身”加“逃跑”的希伯来语结构，并延续对城邑的阴性拟人。
- source_word: וְרֶטֶט
  choice: 战栗
  rationale: 原词指颤抖、震颤，通常源于恐惧；“战栗”兼具身体反应和惧怕意味，而不直接将其抽象化为“恐惧”。
- source_word: הֶחֱזִיקָה
  choice: 抓住了她
  rationale: 此处使役词形表达牢牢抓住；直译可保留战栗仿佛主动擒住大马士革的生动形象。
- source_word: צָרָה
  choice: 患难
  rationale: 该词可指困苦、危难或痛苦；“患难”保留较宽泛的灾难语义，并与下文产痛并列。
- source_word: וַחֲבָלִים
  choice: 和产痛
  rationale: 该词可指绳索或阵痛；紧接着的临产比喻明确支持“产痛”这一语境义。
- source_word: אֲחָזַתָּה
  choice: 临到她
  rationale: 原义为抓住、攫住；汉语中“患难和产痛临到她”自然庄重，同时表达这些痛苦突然控制她的情景。
- source_word: כַּיּוֹלֵדָה
  choice: 仿佛临产的妇人
  rationale: 分词表示正在生产的女性；“临产的妇人”在现代汉语中简洁清楚，并与“产痛”呼应。
