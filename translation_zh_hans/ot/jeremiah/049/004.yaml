base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/004.yaml
  text: Why do you boast in the valleys[a], your valley flowing away, O faithless daughter, who trusts in her treasures, saying, ‘Who will come against me?’
translation:
  language: zh_hans
  text: 你为什么夸耀山谷呢？你那流淌的山谷啊，背信的女儿！你倚靠自己的财宝，说：‘谁会来攻击我呢？’
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תִּתְהַֽלְלִי
  choice: 夸耀
  rationale: 该词为 הלל 的 Hitpael 形式，在此表示自我夸耀；“夸耀”自然地保留了先知责问的语气。
- source_word: בָּעֲמָקִים
  choice: 那些山谷
  rationale: 按复数名词 עֵמֶק 直译为“山谷”，保留地理意象；结合随后单数“你那……山谷”，用“那些”使汉语衔接自然，但不将其抽象化为防御或实力。
- source_word: זָב עִמְקֵךְ
  choice: 你那水流充盈的山谷
  rationale: זָב 基本义为“流淌”；与“你的山谷”连用时语义困难，可能描写水源丰沛、满溢或肥沃。正文采用“水流充盈”保留流动与富饶的意象，并以脚注呈现不确定性。
- source_word: הַבַּת הַשּׁוֹבֵבָה
  choice: 背信的女子啊
  rationale: 保留 בַּת 的阴性人格化意象；שׁוֹבֵבָה 可表达离弃、反叛或不忠，“背信”在现代汉语中自然，并保留其关系性和责备意味。
- source_word: הַבֹּטְחָה בְּאֹצְרֹתֶיהָ
  choice: 你倚靠自己的财宝
  rationale: בּטח 表示信赖或倚靠，אֹצָר 可指财宝、宝库或储藏；此处重点是假安全感，故译作“倚靠自己的财宝”。
- source_word: מִי יָבֹוא אֵלַי
  choice: 谁会来攻击我呢？
  rationale: אֶל 字面为“向、到”，但在敌对语境中可表示“来对付”；“攻击”清楚传达此处自以为无人敢来犯的夸口。
theological_decisions:
- issue: 将亚扪人格化为阴性单数
  choice: 保留“女子”以及第二人称阴性所体现的人格化表达
  alternative: 解释性地译为“背叛的民族”或“背逆的百姓”
  rationale: 原文直接以“女儿/女子”的形象称呼受话者。汉语译文保留这一先知性修辞，不把它中性化或抽象化。
- issue: שׁוֹבֵבָה 的关系性含义
  choice: 背信
  alternative: 背道、反叛、任性
  rationale: “背信”既能体现不忠和离弃，也不预先断定这里专指某种完整的宗教背道概念，从而保留原词的语义张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以破折号承接复数“山谷”和单数“你的山谷”，保留原文突兀有力的责问；用“背信的女子啊”保存阴性人格化和先知责备语气。
