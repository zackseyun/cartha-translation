  rationale: 将“国民”改为“民族”，以准确表达 גּוֹי 的集体、地缘政治指称；将后半句改为与“民族”一致的单数指称，并补全“门闩”。“这是雅威的宣告”更自然地再现先知公式。脚注 b 已保留，故将其锚点置于“门闩”后，确保脚注锚点明确对应所注短语。
