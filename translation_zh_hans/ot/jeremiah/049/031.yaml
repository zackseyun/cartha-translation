base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/031.yaml
  text: Rise up[a], go up against a nation at ease, dwelling securely, declares Yahweh, that has no doors or bars[b]; they dwell alone.
translation:
  language: zh_hans
  text: “起来，去攻打那安逸[a]、安然居住的民族；这是雅威的宣告。它没有门和门闩，独自居住。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “安逸”也可译作“安宁”或“自满”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ק֣וּמוּ עֲל֗וּ
  choice: 起来，去攻打
  rationale: 两个复数命令式构成军事号召。将 עלה אֶל 译为“去攻打”，表达在战争预言中向目标进军的语义，同时保持现代汉语自然。
- source_word: גּ֥וֹי
  choice: 国民
  rationale: 此处指作为攻击对象的一个民族群体；“国民”比现代政治实体意味较强的“国家”更贴合语境。
- source_word: שְׁלֵ֛יו
  choice: 安逸
  rationale: 该词可表示宁静安适，也可能含有自满意味；正文用“安逸”保留这种语义张力，并以脚注列出可能理解。
- source_word: יוֹשֵׁ֥ב לָבֶ֖טַח
  choice: 安然居住
  rationale: 保留分词所描写的持续居住状态，并表达 לָבֶטַח 所含的安全无忧之感。
- source_word: נְאֻם יְהוָ֑ה
  choice: 雅威宣告说
  rationale: נְאֻם 是庄重的先知宣告公式；用“宣告说”适合现代汉语经文语体，并将神名按源文直接音译为“雅威”。
- source_word: לֹא דְלָתַ֧יִם וְלֹֽא בְרִ֛יחַ ל֖וֹ
  choice: 他们无门无闩
  rationale: 紧贴“没有门，也没有门闩”的字面意象；中文以“无门无闩”简洁呈现其缺乏防御设施的状态。
- source_word: בָּדָ֥ד יִשְׁכֹּֽנוּ
  choice: 独自居住
  rationale: 保留 בדד 的隔离、独处含义和 שכן 的居住意象，不额外判定这是地理隔绝还是政治上无援。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 源文明确使用四字神名。采用“雅威”以直接保留专名性质，不以称号替代，也不引入特定宗派解释。
- issue: “安逸”的道德色彩
  choice: 正文保留中性的“安逸”，脚注提示也可含“自满”意味
  alternative: 直接译为“自满”
  rationale: שְׁלֵוַ 可表示平静安适，也可能在审判语境中暗含自满；不在正文中把潜在语气固定为明确的道德定罪。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。引号区分雅威所发的命令和宣告公式；后半句延续神谕内容。保留“门、闩”的源文意象，并以脚注说明古代防御背景。
