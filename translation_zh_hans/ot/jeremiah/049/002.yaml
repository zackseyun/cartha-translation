source:
  edition: WLC
  text: לָ/כֵ֡ן הִנֵּה֩ יָמִ֨ים בָּאִ֜ים נְאֻם יְהוָ֗ה וְ֠/הִשְׁמַעְתִּי אֶל רַבַּ֨ת בְּנֵי עַמּ֜וֹן תְּרוּעַ֣ת מִלְחָמָ֗ה וְ/הָֽיְתָה֙ לְ/תֵ֣ל שְׁמָמָ֔ה וּ/בְנֹתֶ֖י/הָ בָּ/אֵ֣שׁ תִּצַּ֑תְנָה וְ/יָרַ֧שׁ יִשְׂרָאֵ֛ל אֶת יֹרְשָׁ֖י/ו אָמַ֥ר יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/002.yaml
  text: Therefore[a], behold, days are coming, declares Yahweh, when I will cause the battle cry to be heard against Rabbah of the Ammonites, and it will become a desolate mound, and its daughter towns will be set on fire. Then Israel will dispossess those who dispossessed him[c][b], says Yahweh.
translation:
  language: zh_hans
  text: 因此，看哪，日子将到——这是雅威的宣告——我要使战争的呐喊在亚扪人的拉巴响起[a]。拉巴必成为荒凉的废墟堆；它的附属城镇[b]必被火焚烧。那时，以色列必从那些曾侵占他的人手中夺回所占之地[c]。雅威说。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “战争的呐喊”也可译作“战争的警报”或“战吼”。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“它的女儿们”，是指隶属于主要城市的周边小城或村镇。
    reason: cultural_note
  - marker: c
    text: 原文前后使用同一个动词，形成文字呼应：以色列必从那些曾“侵占”他的人手中夺回所占之地。该动词可含“占有、继承、夺取”或“赶逐而占有”之意。
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: 因此
  rationale: 承接上一节的控诉，引出审判的结论，保留明确的推论关系。
- source_word: הִנֵּה
  choice: 看哪
  rationale: 保留先知宣告中引人注意的指示和庄重语气；在现代中文中虽较庄严，却仍为普通读者所理解。
- source_word: יָמִים בָּאִים
  choice: 日子将到
  rationale: 直接呈现常见的先知性未来宣告用语。
- source_word: נְאֻם יְהוָה
  choice: 这是雅威的宣告
  rationale: 体现 נְאֻם 的正式神谕语气，并将神名 יְהוָה 音译为“雅威”。
- source_word: וְהִשְׁמַעְתִּי
  choice: 我要使……响起
  rationale: 以自然中文表达使役形的含义，即雅威使战争的呐喊被人听见。
- source_word: רַבַּת בְּנֵי עַמּוֹן
  choice: 亚扪人的拉巴
  rationale: 准确表达构造关系，并清楚指出拉巴属于亚扪人。
- source_word: תְּרוּעַת מִלְחָמָה
  choice: 战争的呐喊
  rationale: תְּרוּעָה 可指战吼或战争警报；正文采用直观而保留声音意象的译法，脚注列出另一可能。
- source_word: וְהָיְתָה לְתֵל שְׁמָמָה
  choice: 拉巴必成为荒凉的废墟
  rationale: תֵל 在此指毁城后留下的废墟堆；中文用“废墟”自然传达审判后的荒凉景象。
- source_word: וּבְנֹתֶיהָ
  choice: 属它的城镇
  rationale: 将希伯来语“它的女儿们”这一附属聚落习语清楚译出，并以脚注说明原有比喻。
- source_word: בָּאֵשׁ תִּצַּתְנָה
  choice: 必被火焚烧
  rationale: 以自然、庄重的中文表达这些附属城镇遭火毁灭的结果。
- source_word: וְיָרַשׁ יִשְׂרָאֵל אֶת יֹרְשָׁיו
  choice: 以色列必夺取那些曾夺取他土地之人的产业
  rationale: 兼顾 ירש 的双关及其可表示占有、夺取产业或土地的语义，并保留以色列作为集合单数的“他”。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；“雅威”较贴近学界通行的拟音，同时不以称号替代专名。
- issue: יֹרְשָׁיו 的集合单数后缀
  choice: 他
  alternative: 他们
  rationale: 希伯来语把“以色列”视为集合单数，后缀也是阳性单数；中文保留“他”以反映原文语法。
- issue: ירש 重复形成的审判反转
  choice: 夺取那些曾夺取他土地之人的产业
  alternative: 赶走那些曾赶走他的人；占有那些占有他的人
  rationale: 原文以同一词根描述以色列与其侵占者，形成反转。正文通过重复“夺取”保留呼应，并补出土地、产业这一语义范围，避免误解为夺取人的身体。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。保留“因此”“看哪”等先知宣告的逻辑与修辞力度；用破折号标示插入的宣告公式。正文中的脚注标记依次为[a]、[b]、[c]，并均有对应脚注。
