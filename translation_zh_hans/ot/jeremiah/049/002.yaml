revisions:
- from: 因此，看哪，日子将到——这是雅威的宣告——我要使战争的呐喊在亚扪人的拉巴响起[a]。拉巴必成为荒凉的废墟，属它的城镇[b]必被火焚烧。那时，以色列必夺取那些曾夺取他土地之人的产业[c]。这是雅威说的。
  to: 因此，看哪，日子将到——这是雅威的宣告——我要使战争的呐喊在亚扪人的拉巴响起[a]。拉巴必成为荒凉的废墟堆；它的附属城镇[b]必被火焚烧。那时，以色列必从那些曾侵占他的人手中夺回所占之地[c]。雅威说。
  rationale: 修订末句以避免把“土地”和“产业”误作原文逐字明示的内容，同时用“侵占／夺回所占之地”在自然现代汉语中呈现同词根造成的审判反转。将“属它的城镇”改为“它的附属城镇”，并以“废墟堆”保留原文的丘堆意象；结尾改为较庄重的先知公式。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T07:29:35Z'
review_pass:
  verdict: revise
  source_fidelity: 译文整体准确传达了审判宣告、拉巴的毁灭及其附属城镇被焚的内容，也保留了神名和先知性语气。但末句将原文简洁的“以色列必夺取/赶逐其夺取者（或侵占者）”扩展为“曾夺取他土地之人的产业”，正文及脚注都补入了原文未明说的“土地”和“产业”，且使原文同词根的文字呼应变得不够严谨。
  naturalness: “属它的城镇”不合现代汉语的常用搭配，宜改为“它的附属城镇”。“这是雅威说的”略显口语，改为“雅威说”更符合庄重的先知书体。其余措辞总体自然。
  terminology: “雅威”“亚扪人的拉巴”“战争的呐喊”均可接受。“荒凉的废墟堆”比单称“废墟”更能反映תל（废墟丘、堆）的形象。末句宜以“夺回……所占之地”表达审判中的反转；这虽为汉语清晰度补足“地”，但不应声称该词明载于原文，脚注须说明原文的同词根双关。
  issues:
  - severity: medium
    issue: 末句及脚注加入“土地”“产业”作为原文明确表达。
    rationale: 希伯来文只说“以色列必ירש其ירש者”，以同一词根构成反转；“土地/产业”是语境中可理解的对象，却并未在该句明说。现译“夺取……之人的产业”也改变了直接对象的句法关系。
  - severity: low
    issue: “属它的城镇”表达不够自然。
    rationale: 中文通常说“它的附属城镇”或“周边附属城镇”，既自然也准确表达“女儿们”的城市习语。
  - severity: low
    issue: 末尾公式“这是雅威说的”略口语化。
    rationale: “雅威说”更简洁庄重，并与前面的“这是雅威的宣告”协调。
