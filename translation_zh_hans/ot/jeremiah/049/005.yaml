  naturalness: “看哪……这是……的宣告”庄重可懂，但“主万军之耶和华”不够自然；“无人聚拢逃亡的人”也略显生硬。改为“主耶和华—万军之主—宣告说”及“没有人招聚逃亡者”更符合现代庄重汉语。
