id: JER.49.5
reference: Jeremiah 49:5
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: הִנְ/נִי֩ מֵבִ֨יא עָלַ֜יִ/ךְ פַּ֗חַד נְאֻם אֲדֹנָ֧/י יְהוִ֛ה צְבָא֖וֹת מִ/כָּל סְבִיבָ֑יִ/ךְ וְ/נִדַּחְתֶּם֙ אִ֣ישׁ לְ/פָנָ֔י/ו וְ/אֵ֥ין מְקַבֵּ֖ץ לַ/נֹּדֵֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/005.yaml
  text: Behold[a], I am bringing terror upon you from all around you, declares the Lord GOD of hosts, and each man will be driven out before him[b], with no one to gather the fugitive.
translation:
  language: zh_hans
  text: 看哪，我要使惊恐从你四面临到你；主耶和华—万军之主—宣告说。你们必被驱散，各人各自向前[a]；没有人招聚逃亡者[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“各人在自己面前”，也可理解为“各人径直逃去”。希伯来语非常简略，可能描写众人在惊慌中各自奔逃、无暇顾及别人。
    reason: 词义及句法存在歧义
  - marker: b
    text: 或译：“流离的人”或“漂泊的人”。
    reason: 分词נֹדֵד可指逃亡、流离或漂泊的人。
lexical_decisions:
- source_word: הִנְנִי מֵבִיא
  choice: 看哪，我要使……临到
  rationale: הִנְנִי引出郑重而迫近的神谕，分词מֵבִיא在此表达即将实施的行动；“看哪，我要使……临到”兼顾先知宣告的力度和现代汉语的自然表达。
- source_word: פַּחַד
  choice: 惊恐
  rationale: 该词在审判语境中不只是一般的害怕，而是压倒性的恐慌；“惊恐”比“惧怕”更能体现其强度。
- source_word: נְאֻם אֲדֹנָי יְהוִה צְבָאוֹת
  choice: 这是主万军之耶和华的宣告
  rationale: “宣告”体现נְאֻם的神谕用法；“主万军之耶和华”分别保留אֲדֹנָי、יהוה及צְבָאוֹת，而不另行加入原文没有的称谓。
- source_word: מִכָּל סְבִיבַיִךְ
  choice: 从你四面
  rationale: 简洁保留威胁从四周包围而来的空间意象。
- source_word: וְנִדַּחְתֶּם
  choice: 你们必被驱散
  rationale: נדח的Niphal形表示被赶散、被迫离开；“被驱散”既保留被动意味，也与随后各自逃离的场景衔接。
- source_word: אִישׁ לְפָנָיו
  choice: 各人只顾向前
  rationale: 原短语高度凝练，可直解为“各人在自己前面”，在语境中很可能描写人人径直逃命、彼此不顾；正文采用自然汉语，同时以脚注保留字面理解。
- source_word: וְאֵין מְקַבֵּץ לַנֹּדֵד
  choice: 无人聚拢逃亡的人
  rationale: מְקַבֵּץ指重新聚集四散者，נֹּדֵד可指流离、逃亡或被迫漂泊的人；此处“逃亡的人”最贴合审判和溃散的语境。
theological_decisions:
- issue: 神名יהוה及完整称号אֲדֹנָי יְהוִה צְבָאוֹת的译法
  choice: 主万军之耶和华
  alternative: 主雅威—万军之主
  rationale: 正文以现代中文读者熟悉的“耶和华”音译神名，并保留“主”和“万军”的完整称号；不把该称号扩写为带有额外神学解释的表述。
- issue: אִישׁ לְפָנָיו所描写的逃散方式
  choice: 各人只顾向前
  alternative: 各人在自己面前／各人径直逃去
  rationale: 原文存在真实的句法和语义张力。正文表达恐慌中各自奔逃的可能含义，脚注同时保存较字面的译法，避免把不确定解释写成唯一结论。
- issue: נֹּדֵד的身份描述
  choice: 逃亡的人
  alternative: 流离的人／漂泊的人
  rationale: 上下文支持因驱散而逃亡，但该分词本身也可强调流离漂泊，因此将其他可能译法列入脚注。
translation_notes:
  register: 采用现代、庄重而易懂的先知性语体。“看哪”和“宣告”保留神谕的郑重感；其余句式尽量简洁自然。正文中的[a]、[b]均与相应脚注准确对应。
