source:
  edition: WLC
  text: לְ/קֵדָ֣ר וּֽ/לְ/מַמְלְכ֣וֹת חָצ֗וֹר אֲשֶׁ֤ר הִכָּה֙ נבוכדראצור מֶֽלֶךְ בָּבֶ֔ל כֹּ֖ה אָמַ֣ר יְהוָ֑ה ק֚וּמוּ עֲל֣וּ אֶל קֵדָ֔ר וְ/שָׁדְד֖וּ אֶת בְּנֵי קֶֽדֶם׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/028.yaml
  text: 'Concerning Kedar and the kingdoms of Hazor[a], which Nebuchadnezzar king of Babylon struck down: Thus says Yahweh: Rise up, go up against Kedar[b], and plunder the people of the east.'
translation:
  language: zh_hans
  text: '论基达和夏琐诸国，就是巴比伦王尼布甲尼撒[a]所攻打的。雅威如此说：


    “起来，上去攻打基达，

    掠夺东方人[b]！”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节希伯来文的名字拼写更接近“尼布甲利撒”；“尼布甲尼撒”是通行的中文译名。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译为“东方之子”，是指东方地区或东部旷野诸民族的习语。
    reason: lexical_alternative
lexical_decisions:
- source_word: לְקֵדָר וּלְמַמְלְכוֹת חָצוֹר
  choice: 论基达和夏琐诸国
  rationale: 预言标题中的介词 לְ 引出宣告所针对或涉及的对象，译作“论”自然明确；מַמְלְכוֹת 是复数，保留为“诸国”，不把“夏琐”武断限定为迦南的同名城市。
- source_word: אֲשֶׁר הִכָּה
  choice: 所攻打的
  rationale: נכה 在军事语境中表示击打、攻击；“攻打”既符合上下文，也避免把结果过度明确为已经彻底击败。
- source_word: נבוכדראצור
  choice: 尼布甲尼撒
  rationale: 采用现代中文圣经及一般中文读者熟悉的通行译名；马所拉文本此处的拼写更接近“尼布甲利撒”，以脚注说明。
- source_word: כֹּה אָמַר יְהוָה
  choice: 雅威如此说
  rationale: 保留先知传信公式的庄重语气，并把四字神名 יְהוָה 作为专名音译为“雅威”。
- source_word: קוּמוּ עֲלוּ אֶל קֵדָר
  choice: 起来，上去攻打基达
  rationale: 保留两个复数命令式；鉴于紧接着命令掠夺，עלה אל 在此具有军事进攻含义，译作“上去攻打”。
- source_word: וְשָׁדְדוּ
  choice: 掠夺
  rationale: שׁדד 在战争语境中指抢掠、劫夺；“掠夺”是清楚而有力度的现代汉语。
- source_word: בְּנֵי קֶדֶם
  choice: 东方人
  rationale: 字面为“东方之子”，是指东方地区或东部旷野诸民族的习语；“东方人”简洁自然，并以脚注保留字面信息。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用以色列上帝的立约之名。音译“雅威”比以称号“主”替代更能保留专名性质，也比传统形式“耶和华”更接近该名通常推定的读音。
- issue: אֲשֶׁר הִכָּה 所述行动的结果程度
  choice: 所攻打的
  alternative: 所击败的；所击杀的
  rationale: 动词 נכה 可涵盖攻击、击打或击败；本节本身没有明确说明毁灭程度，因此不把军事行动的结果限定为彻底击败。
translation_notes:
  register: 采用现代、庄重而易懂的普通话书面语。开头按先知书宣告标题处理；诗行保留连续命令的力度。脚注标记均置于正文相应词语之后，并纠正了英文咨询层中脚注标记与内容错配的问题。
