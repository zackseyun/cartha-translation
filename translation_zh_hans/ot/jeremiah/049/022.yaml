  text: הִנֵּ֤ה כַ/נֶּ֨שֶׁר֙ יַעֲלֶ֣ה וְ/יִדְאֶ֔ה וְ/יִפְרֹ֥שׂ כְּנָפָ֖י/ו עַל בָּצְרָ֑ה וְֽ֠/הָיָה לֵ֞ב גִּבּוֹרֵ֤י אֱדוֹם֙ בַּ/יּ֣וֹם הַ/ה֔וּא כְּ/לֵ֖ב אִשָּׁ֥ה מְצֵרָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/022.yaml
  text: Behold[a], like an eagle he will rise up and swoop down and spread his wings over Bozrah, and the heart of Edom’s warriors on that day will become like the heart of a woman in labor.
translation:
  language: zh_hans
  text: 看哪[a]！他必如鹰升起、飞翔，在波斯拉上空展开翅膀；到那日，以东勇士的心必像正在分娩的妇人的心。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “鹰”所译的希伯来词也可泛指大型猛禽；也可译作“秃鹫”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: 看哪
  rationale: 保留先知宣告中唤起注意的语气；“看哪”庄重而仍为现代读者所理解。
- source_word: כַנֶּשֶׁר
  choice: 如鹰
  rationale: נֶשֶׁר可泛指大型猛禽，也可能理解为秃鹫；正文采用中文圣经语境中自然且传统的“鹰”，并以脚注保留词义范围。
- source_word: יַעֲלֶה וְיִדְאֶה
  choice: 升起，疾飞而来
  rationale: יַעֲלֶה表达上升，יִדְאֶה表达迅疾飞行；译文保持两项动作，并未加入原文不明确的向下俯冲。结合敌军临近的语境，以“而来”自然呈现威胁趋近。
- source_word: וְיִפְרֹשׂ כְּנָפָיו
  choice: 张开翅膀
  rationale: 直接保留猛禽展开双翼的形象。
- source_word: עַל בָּצְרָה
  choice: 遮临波斯拉
  rationale: עַל基本意为“在……之上”；“遮临”既保留翅膀覆盖城上的空间图景，也传达迫近的威胁，而不将介词径直解释为“攻击”。
- source_word: לֵב גִּבּוֹרֵי אֱדוֹם
  choice: 以东勇士的心
  rationale: 保留希伯来文“心”的身体—心理表达，不提前解释为“勇气”；גִּבּוֹרֵי在军事语境中译作“勇士”。
- source_word: בַּיּוֹם הַהוּא
  choice: 到那日
  rationale: 自然保留先知话语中的时间指示。
- source_word: וְהָיָה
  choice: 必……一样
  rationale: 原文形式上为“将是”；中文以“必像……一样”自然表达届时出现的状态，避免过度强调词汇本身未明说的渐变过程。
- source_word: כְּלֵב אִשָּׁה מְצֵרָה
  choice: 像临产妇人的心一样
  rationale: מְצֵרָה指正遭受产痛的妇人；“临产妇人”简洁保留恐惧、痛苦与无力的比喻。
theological_decisions:
- issue: 鹰一般的攻击者所指为何
  choice: 保留单数男性代词“他”，不在正文中指明身份
  alternative: 明确译为巴比伦王、尼布甲尼撒、耶和华，或某支入侵军队
  rationale: 上下文可使人联想到巴比伦的入侵者，但本节本身没有明说主语身份；译文保留这一文学与神学上的开放性。
translation_notes:
  register: 采用现代、庄重而可朗读的普通话。“看哪”“到那日”等表达保留先知宣告的肃穆感；句式尽量清楚，不以解释性词语消除原文中攻击者身份及猛禽名称的含混。
