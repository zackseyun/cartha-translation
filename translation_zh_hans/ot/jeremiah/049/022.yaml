revisions:
- from: 看哪[a]！他必如鹰升起，疾飞而来，张开翅膀遮临波斯拉。到那日，以东勇士的心必像临产妇人的心一样。
  to: 看哪[a]！他必如鹰升起、飞翔，在波斯拉上空展开翅膀；到那日，以东勇士的心必像正在分娩的妇人的心。
  rationale: 修订删除原文未明示的“而来”，以自然明确的“在波斯拉上空展开翅膀”保留עַל的空间图像，并将分娩比喻调整为明确表示正在经历产痛的中文表达。正文继续保留攻击者身份和鸟类名称的原有含混。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T07:29:27Z'
review_pass:
  verdict: revise
  source_fidelity: “疾飞而来”中的“而来”给原文未明说的飞行方向增加了趋近说话者/观察者的意味；“遮临”虽试图表达“在……之上”，但现代普通话中较生僻，且不如明确的空间表达自然。其余主要语义、未指明攻击者身份的单数“他”、以及以东勇士心灵惊惧的比喻均得到保留。
  naturalness: “看哪”与“到那日”适合庄重的先知语体。“在波斯拉上空展开翅膀”比“张开翅膀遮临波斯拉”更合现代标准普通话，也更清楚地呈现原文的空间意象。“正在分娩的妇人”比“临产妇人”更准确指向正在经历产痛的状态。
  terminology: “波斯拉”“以东”“勇士”“心”均合适。“鹰”可保留为正文传统译法；脚注宜明确说明“秃鹫”是可行的另一译法，而非仅含糊说“可能包括”。
  issues:
  - severity: medium
    issue: “疾飞而来”增加方向性。
    rationale: וְיִדְאֶה表达飞行，原文没有“向这里来”或其他明确趋近方向；删去“而来”可避免不必要的语义添加。
  - severity: medium
    issue: “遮临波斯拉”不够自然且空间关系不够明确。
    rationale: 原文是在波斯拉“之上”展开翅膀。译作“在波斯拉上空展开翅膀”既自然又保留形象，且不直接解释成攻击。
  - severity: low
    issue: “临产妇人”可能仅指即将生产，而未明确正在承受产痛。
    rationale: מְצֵרָה指处于分娩痛苦/困苦中的妇人；“正在分娩的妇人”更准确，仍不扩展比喻意义。
  revised_text: 看哪[a]！他必如鹰升起、飞翔，在波斯拉上空展开翅膀；到那日，以东勇士的心必像正在分娩的妇人的心。
  revised_footnotes:
