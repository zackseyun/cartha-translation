id: JER.49.3
reference: Jeremiah 49:3
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: הֵילִ֨ילִי חֶשְׁבּ֜וֹן כִּ֣י שֻׁדְּדָה עַ֗י צְעַקְנָה֮ בְּנ֣וֹת רַבָּה֒ חֲגֹ֣רְנָה שַׂקִּ֔ים סְפֹ֕דְנָה וְ/הִתְשׁוֹטַ֖טְנָה בַּ/גְּדֵר֑וֹת כִּ֤י מַלְכָּ/ם֙ בַּ/גּוֹלָ֣ה יֵלֵ֔ךְ כֹּהֲנָ֥י/ו וְ/שָׂרָ֖י/ו יַחְדָּֽיו־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/003.yaml
  text: Wail[a], Heshbon, for Ai is devastated! Cry out, daughters of Rabbah! Put on sackcloth, mourn, and wander about among the walls, for their king will go into exile, together with his priests and his officials.
translation:
  language: zh_hans
  text: 希实本啊，要哀号，因为艾城已遭毁坏！拉巴的女子啊，要呼喊！你们要披上麻布，哀哭，在围墙之间徘徊；因为他们的王[a]必被掳去，他的祭司和官长也必一同被掳去。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“米勒公必被掳去。”这里的希伯来语辅音也可读作亚扪人的神米勒公之名，而不是“他们的王”。
    reason: 保留马所拉读法与神名读法之间真实且具有神学意义的歧义。
lexical_decisions:
- source_word: הֵילִילִי
  choice: 要哀号
  rationale: 阴性单数命令式，指因灾祸发出悲痛的哭号；“哀号”自然、庄重，并保留强烈的哀恸语气。
- source_word: חֶשְׁבּוֹן
  choice: 希实本
  rationale: 地名，采用现代中文圣经语境中通行且易辨识的音译。
- source_word: שֻׁדְּדָה
  choice: 已遭毁坏
  rationale: שׁדד 的被动式可包含劫掠和蹂躏造成的毁坏；此译保留结果状态，不限定为彻底摧毁或仅仅抢掠。
- source_word: עַי
  choice: 艾城
  rationale: 马所拉文本作地名 עַי；译作“艾城”以明确其为城市，同时不采纳改读为亚珥等文本修订。
- source_word: צְעַקְנָה
  choice: 要呼喊
  rationale: 阴性复数命令式，表示在灾难中高声呼叫；“呼喊”符合现代汉语，也与哀号语境协调。
- source_word: בְּנוֹת רַבָּה
  choice: 拉巴的女子
  rationale: 直译为“拉巴的女儿们”，可指女性居民，也可能以拟人方式指附属城镇；上下文连续使用阴性复数命令式，正文译作“女子”较自然，同时保留群体称呼。
- source_word: חֲגֹרְנָה שַׂקִּים
  choice: 披上麻布
  rationale: 这是表示哀悼的固定动作；“披上麻布”比逐字的“以麻布束腰”更自然，又保留礼仪性意象。
- source_word: סְפֹדְנָה
  choice: 哀哭
  rationale: ספד 指为死亡或灾祸举哀、哀悼；“哀哭”在此命令句列中简洁有力。
- source_word: וְהִתְשׁוֹטַטְנָה
  choice: 来回奔走
  rationale: 该动词形式表达四处、反复移动，且此处带有悲惶不安的意味；“来回奔走”比中性的“游荡”更符合灾难场景。
- source_word: בַּגְּדֵרוֹת
  choice: 在围墙间
  rationale: גדרות 可指墙、篱笆或围护之处；城市哀歌语境中“围墙”较合适，但原词具体所指仍有一定不确定性。
- source_word: מַלְכָּם
  choice: 他们的王
  rationale: 按马所拉元音读作“他们的王”；辅音也可理解为亚扪神名“米勒公”，故在脚注保留另一读法。
- source_word: בַּגּוֹלָה יֵלֵךְ
  choice: 必被掳去
  rationale: 这是流亡、被放逐的表达；“被掳去”在现代中文中简明地传达强制迁离，并与祭司、官长一同遭遇的命运相连。
theological_decisions:
- issue: מַלְכָּם 是指人的“他们的王”，还是亚扪神祇米勒公
  choice: 正文采用“他们的王”
  alternative: 也可译作“米勒公必被掳去”
  rationale: 马所拉元音支持“他们的王”，并可自然衔接“他的祭司和官长”；但无元音辅音文本也容许读作亚扪神名，且在亚扪审判的上下文中具有充分依据，因此不在正文中消除这一张力，而以脚注明示。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。命令句以“要……”保持先知宣告的紧迫感；地名使用通行音译。正文保留城市哀歌的排比节奏，并通过脚注呈现“王／米勒公”的文本歧义。
