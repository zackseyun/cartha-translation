  - severity: low
    issue: “稳固的草场”在现代汉语中搭配稍显生硬。
    rationale: 此处的אֵיתָן表达坚实、长久或安稳；“安稳的牧场”更符合中文，并保留נָוֶה的牧养意象。
  - severity: low
    issue: 脚注a的“威荣之地／骄傲之地”加入了“之地”。
    rationale: 替代义应尽量贴近“约旦河的威荣／骄傲”；再说明这很可能是指沿岸繁茂林丛即可。
