  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: הִ֠נֵּה כְּ/אַרְיֵ֞ה יַעֲלֶ֨ה מִ/גְּא֣וֹן הַ/יַּרְדֵּן֮ אֶל נְוֵ֣ה אֵיתָן֒ כִּֽי אַרְגִּ֤יעָה אֲרִיצֶ֨/נּוּ מֵֽ/עָלֶ֔י/הָ וּ/מִ֥י בָח֖וּר אֵלֶ֣י/הָ אֶפְקֹ֑ד כִּ֣י מִ֤י כָמ֨וֹ/נִי֙ וּ/מִ֣י יֹעִידֶ֔/נִּי וּ/מִי זֶ֣ה רֹעֶ֔ה אֲשֶׁ֥ר יַעֲמֹ֖ד לְ/פָנָֽ/י־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/019.yaml
  text: Look[a], like a lion he will come up from the thicket of the Jordan against a secure pasture; for in an instant I will make him run from it, and I will appoint over it whomever is chosen. For who is like me[b], and who will summon me? And who is the shepherd who can stand before me?
translation:
  language: zh_hans
  text: 看哪，他必像狮子从约旦河边的密林[a]上来，直奔安稳的牧场；因为转眼之间，我要使他逃离它，并要派所拣选的人管理它。谁能与我相比？谁能传唤我[b]？有哪个牧人能在我面前站立？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“从约旦河的威荣中”或“从约旦河的骄傲中”；这句希伯来习语很可能指约旦河沿岸繁茂的林丛。
    reason: lexical_alternative
  - marker: b
    text: 或译“谁能给我定下时间？”也可能带有司法意味：“谁能传唤我出庭？”
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: 看哪
  rationale: 保留引人注意和增强现场感的功能；“看哪”在现代庄重经文语体中自然可懂。
- source_word: כְּאַרְיֵה יַעֲלֶה
  choice: 他必像狮子……上来
  rationale: 直接保留明喻及上行、进逼的动态意象，不补明攻击者身份。
- source_word: מִגְּאוֹן הַיַּרְדֵּן
  choice: 从约旦河边的密林
  rationale: גאון通常可指“威荣、骄傲”，但在这一固定地理表达中很可能指约旦河沿岸繁茂、可供狮子藏身的林丛；直译可能性收入脚注。
- source_word: אֶל נְוֵה אֵיתָן
  choice: 攻击稳固的草场
  rationale: נוה保留牧场意象，איתן表达坚固、安稳；介词在运动语境中表示朝向，结合狮子意象译作“攻击”使中文自然。
- source_word: כִּי אַרְגִּיעָה
  choice: 因为转眼之间
  rationale: 此处形式和句法有压缩感，表达骤然、片刻之间；避免生硬地逐字重现第一人称动词形式。
- source_word: אֲרִיצֶנּוּ מֵעָלֶיהָ
  choice: 我要使他从那里逃走
  rationale: 保留使役意义；阳性宾语指狮子般的攻击者，阴性后缀所指可理解为草场或土地，中文以“那里”避免过度限定。
- source_word: וּמִי בָחוּר אֵלֶיהָ אֶפְקֹד
  choice: 并要派所拣选的人管理那里
  rationale: 希伯来文高度凝缩；בָחוּר表达被选中者，פקד在此有委派、立为管理者之意。译文保留神所作的委任，不指明具体人物。
- source_word: מִי כָמוֹנִי
  choice: 谁能与我相比
  rationale: 保留不可比拟的反问语气；“能”自然呈现修辞挑战。
- source_word: וּמִי יוֹעִידֶנִּי
  choice: 谁能传唤我
  rationale: Hiphil形式可指约定时间、召集或在司法语境中传唤；正文采用适合挑战语境的“传唤”，其他可能见脚注。
- source_word: רֹעֶה אֲשֶׁר יַעֲמֹד לְפָנָי
  choice: 有哪个牧人能在我面前站立
  rationale: 保留“牧人”这一统治者隐喻，也以“能……站立”传达无人足以抗衡的反问。
theological_decisions:
- issue: 第一人称“我”的身份
  choice: 按原文只译“我”，由语境表明是上帝发言，不在本节补入“耶和华”。
  alternative: 在正文中明确译作“耶和华说”或“我耶和华”。
  rationale: 本节本身使用第一人称神谕，却没有出现神名；不增添原文未明说的称谓。
- issue: “牧人”的所指
  choice: 保留“牧人”，让其统治者或领袖的隐喻意义由上下文呈现。
  alternative: 直接译为“君王”或“领袖”。
  rationale: 原词为“牧人”，且本节已有草场意象；直译既保留文学连贯性，也避免将隐喻所指限定得过窄。
translation_notes:
  register: 采用现代、庄重而可朗读的普通话。保留狮子、草场、牧人等相互呼应的意象；对压缩且有歧义的希伯来句法作最低限度的自然化，并用脚注保存重要词义可能。
