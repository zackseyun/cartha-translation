  text: כִּי כֹ֣ה אָמַ֣ר יְהוָ֗ה הִ֠נֵּה אֲשֶׁר אֵ֨ין מִשְׁפָּטָ֜/ם לִ/שְׁתּ֤וֹת הַ/כּוֹס֙ שָׁת֣וֹ יִשְׁתּ֔וּ וְ/אַתָּ֣ה ה֔וּא נָקֹ֖ה תִּנָּקֶ֑ה לֹ֣א תִנָּקֶ֔ה כִּ֥י שָׁתֹ֖ה תִּשְׁתֶּֽה־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/012.yaml
  text: 'For thus says Yahweh: Behold[a], those who were not sentenced to drink the cup will surely drink, and are you the one who will go unpunished? You will not go unpunished[c][b], for you will surely drink.'
translation:
  language: zh_hans
  text: 因为耶和华如此说：“看哪，那些本不该喝这杯的，尚且必定喝；而你岂能免受惩罚？你绝不能免受惩罚[a]，因为你必定要喝。”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “免受惩罚”也可译作“获判无罪”。
    reason: lexical_alternative
  - marker: b
    text: “杯”是先知书中常用的意象，表示上帝使列国承受的审判。
    reason: cross_reference
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经传统中最通行的专名译法，明确保留立约之神的名字。
- source_word: הִנֵּה
  choice: 看哪
  rationale: 保留先知宣告中引人注意并加强庄严语气的指示词。
- source_word: אֲשֶׁר אֵין מִשְׁפָּטָם לִשְׁתּוֹת הַכּוֹס
  choice: 那些本不该喝这杯的
  rationale: מִשְׁפָּטָם 可指判决、公正或依法应得之分；“本不该”以自然中文保留其规范和司法意味，又不把含义收窄为已正式宣判。
- source_word: הַכּוֹס
  choice: 这杯
  rationale: 保留原文的杯之意象；中文加指示词使语流自然，但不在正文中明说“愤怒”或“审判”。
- source_word: שָׁתוֹ יִשְׁתּוּ
  choice: 尚且必喝
  rationale: 以“必”表达不定式绝对形配限定动词所传达的强调和确定性；“尚且”配合后句反问，显出论证力度。
- source_word: נָקֹה תִּנָּקֶה ... לֹא תִנָּקֶה
  choice: 岂能免受惩罚吗？你必不能免受惩罚
  rationale: נקה 在此可指被判无罪、得以清白或免受刑罚；正文采用符合审判语境且自然的“免受惩罚”，脚注保留司法性的另一译法。
- source_word: כִּי שָׁתֹה תִּשְׁתֶּה
  choice: 因为你必喝这杯
  rationale: “必”传达强调结构所表示的确定性；补出“这杯”使中文宾语明确，并与前文意象连贯。
theological_decisions:
- issue: “杯”的隐喻意义
  choice: 正文保留“这杯”，不展开为“愤怒之杯”或“审判之杯”
  alternative: 将其明译为“愤怒之杯”或“审判之杯”
  rationale: 原文只说“杯”；上下文显示它象征上帝施行的审判，但正文不应加入原文未明说的限定。
- issue: מִשְׁפָּטָם 的司法与规范含义
  choice: 译为“本不该”，脚注说明“本不当受判喝这杯”
  alternative: 正文译为“没有被判定要喝这杯”
  rationale: 希伯来语可涉及判决、公正或应得之分。正文保留一定宽度，脚注呈现更明确的司法理解。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“因为耶和华如此说”保留先知宣告的正式语体；反问句保持对以东直接、强烈的质问。正文中的脚注标记均按出现顺序安置。
