  text: נֻסוּ֩ נֻּ֨דוּ מְאֹ֜ד הֶעְמִ֧יקוּ לָ/שֶׁ֛בֶת יֹשְׁבֵ֥י חָצ֖וֹר נְאֻם יְהוָ֑ה כִּֽי יָעַ֨ץ עֲלֵי/כֶ֜ם נְבוּכַדְרֶאצַּ֤ר מֶֽלֶךְ בָּבֶל֙ עֵצָ֔ה וְ/חָשַׁ֥ב עלי/הם מַחֲשָׁבָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/030.yaml
  text: Flee! Wander far away! Dwell deep[a], inhabitants of Hazor, declares Yahweh[b], for Nebuchadnezzar king of Babylon has taken counsel against you and devised a plan against you.
translation:
  language: zh_hans
  text: “逃走吧！远远地离去吧！夏琐的居民啊，退到深处居住吧！”这是雅威的宣告；“因为巴比伦王尼布甲尼撒已经设谋攻击你们，又筹划计策攻击他们。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נֻסוּ
  choice: 你们要逃跑
  rationale: 这是 נוס 的复数命令式，直接发出逃离危险的命令；“逃跑”简洁自然，也符合先知警告的语境。
- source_word: נֻּדוּ מְאֹד
  choice: 要远远离去
  rationale: נוד 表示迁移、离去或飘流，מְאֹד 加强程度；此处重点是尽可能远离危险，因此译为“远远离去”，并与前面的“逃跑”保持词义区别。
- source_word: הֶעְמִיקוּ לָשֶׁבֶת
  choice: 要住到隐深之处
  rationale: 字面为“使居住深入”，意指退到深远、隐蔽而不易到达的地方。“隐深之处”保留“深”的意象，同时让现代汉语读者容易理解。
- source_word: יֹשְׁבֵי חָצוֹר
  choice: 夏琐的居民
  rationale: 分词构造自然译为“居民”；地名 חָצוֹר 音译为“夏琐”。本节语境所指可能是阿拉伯地区的聚落或居民群体，但正文保留地名，不作解释性改写。
- source_word: נְאֻם יְהוָה
  choice: 雅威宣告说
  rationale: 这是庄严的先知宣告公式；以“宣告说”体现 נְאֻם 的权威语气，并将神名 יְהוָה 译为“雅威”。
- source_word: יָעַץ ... עֵצָה
  choice: 已经设谋
  rationale: 同根动词和名词连用，强调有意策划；汉语“设谋”简明地传达蓄意谋划及敌对色彩。
- source_word: עֲלֵיכֶם
  choice: 攻击你们
  rationale: 在军事敌对语境中，介词短语表达针对、敌对之意；译作“攻击你们”比抽象的“关于你们”更符合上下文。
- source_word: וְחָשַׁב ... מַחֲשָׁבָה
  choice: 又筹划计策
  rationale: 另一组同根动词名词结构，突出审慎策划；“筹划计策”既保留重复强化的效果，也符合自然汉语。
- source_word: עליהם
  choice: 攻击他们
  rationale: 马所拉文本末尾确为第三人称复数“他们”，与前面的第二人称“你们”形成转换；正文予以保留，不擅自协调。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华／主
  rationale: 原文直接使用四字神名；“雅威”较直接地呈现其专名性质，不以称号取代。
- issue: 经文末尾人称由“你们”转为“他们”
  choice: 保留“攻击他们”
  alternative: 协调为“攻击你们”
  rationale: 马所拉文本先用 עֲלֵיכֶם“攻击你们”，末尾却用 עליהם“攻击他们”。这种人称张力属于现存希伯来文本，应保留并以脚注提示，而不为行文顺畅加以消除。
translation_notes:
  register: 采用现代、庄重而清楚的普通话。连续命令用短句和感叹号呈现紧迫感；“隐深之处”保留原文空间隐喻，并由脚注解释。引语划分使“雅威宣告说”自然连接命令和理由。
