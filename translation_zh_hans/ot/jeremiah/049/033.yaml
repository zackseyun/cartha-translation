  text: וְ/הָיְתָ֨ה חָצ֜וֹר לִ/מְע֥וֹן תַּנִּ֛ים שְׁמָמָ֖ה עַד עוֹלָ֑ם לֹֽא יֵשֵׁ֥ב שָׁם֙ אִ֔ישׁ וְ/לֹֽא יָג֥וּר בָּ֖/הּ בֶּן אָדָֽם־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/033.yaml
  text: Hazor will become a haunt of jackals[a], a desolation forever; no man will dwell there[b], and no son of man will sojourn in it.
translation:
  language: zh_hans
  text: 夏琐必成为豺狼的住处[a]，永远荒凉；无人住在那里，也没有人寄居其中[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“豺狼栖居之地”。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为：“没有男子住在那里，也没有人子寄居其中”；这是两个平行说法，泛指没有任何人会在那里居住或寄居。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיְתָה
  choice: 必成为
  rationale: 先知审判话语中的完成式带连接词，表达将要实现的结果；“成为”体现状态的转变，“必”传达宣告的确定性。
- source_word: חָצוֹר
  choice: 夏琐
  rationale: 采用现代中文圣经中较通行的地名音译。
- source_word: לִמְעוֹן
  choice: 住处
  rationale: מָעוֹן指居所、栖居之处；“住处”自然清楚，并与豺狼占据废城的图景相符。
- source_word: תַּנִּים
  choice: 豺狼
  rationale: 该词在先知书废墟意象中通常指栖息荒地的豺狼，而非神话性的“龙”。
- source_word: שְׁמָמָה
  choice: 荒凉
  rationale: 保留名词所表达的毁坏、无人居住状态；中文用“荒凉”作表语简洁自然。
- source_word: עַד עוֹלָם
  choice: 永远
  rationale: 这是审判语境中表达长久持续的标准自然译法。
- source_word: לֹא יֵשֵׁב שָׁם אִישׁ
  choice: 无人住在那里
  rationale: יָשַׁב在此指居住；אִישׁ虽为阳性单数，语境中泛指任何人，现代汉语“无人”准确传达其范围。
- source_word: וְלֹא יָגוּר בָּהּ בֶּן אָדָם
  choice: 也没有人寄居其中
  rationale: גוּר含寄居、暂住之意，宜与前句“住”区分；בֶּן אָדָם在这里与אִישׁ平行，泛指人类个体，译作“人”符合现代汉语表达，脚注说明原文形式。
theological_decisions:
- issue: 审判公式中阳性人称词的表达
  choice: 正文译作“无人……也没有人”，脚注保留原文“男人……人的儿子”的形式信息
  alternative: 正文直译为“没有男人……也没有人的儿子”
  rationale: אִישׁ与בֶּן אָדָם在此构成平行表达，语用上排除任何人居住或寄居，并不特别限定男性。中文若逐字译出“人的儿子”容易被误解为专称或基督论称号，因此正文传达其通用人类指称，脚注保留希伯来语措辞及修辞关系。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。“必成为……永远荒凉”保留先知性审判宣告的力度；“住”与“寄居”对应两个不同的希伯来语动词。所有脚注标记均已置于正文。
