revisions:
- from: 他们要夺走他们的帐棚和羊群，掳去他们的帐幕幔子、所有财物和骆驼；人要向他们呼喊[a]：“四面尽是惊恐！”
  to: 敌人必夺取他们的帐棚和羊群，掠走他们帐棚的帷幔、所有财物和骆驼；又要向他们呼喊[a]：“周围都是惊恐！”
  rationale: 修订明确了掠夺者与失去财物者并非同一指代对象，避免现代汉语中的实质性误读；同时将“帐幕幔子”调整为更自然的“帐棚的帷幔”。脚注保留קרא על的介词关系可作“向、针对或论及”的歧义，未强加单一解释。
