base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/029.yaml
  text: They will take their tents and their flocks; they will carry off their tent curtains and all their goods and their camels[a], and they will cry out against them, “Terror on every side!”
translation:
  language: zh_hans
  text: 敌人必夺取他们的帐棚和羊群，掠走他们帐棚的帷幔、所有财物和骆驼；又要向他们呼喊[a]：“周围都是惊恐！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“敌人要针对他们呼喊：‘周围都是惊恐！’”希伯来语这一结构可理解为向他们、针对他们，或论及他们发出呼喊。
    reason: lexical_alternative
lexical_decisions:
- source_word: אָהֳלֵיהֶם
  choice: 他们的帐棚
  rationale: אֹהֶל在基达人与夏琐游牧群体的语境中指居住用的帐棚；“帐棚”自然且保留具体生活图景。
- source_word: צֹאנָם
  choice: 他们的羊群
  rationale: צֹאן统指绵羊、山羊等小型牲畜；“羊群”符合现代汉语的集合表达。
- source_word: יִקָּחוּ
  choice: 夺走
  rationale: לקח基本义为“拿、取”，但本节处于军事劫掠语境；“夺走”既体现敌对行动，又不过度扩大词义。
- source_word: יְרִיעוֹתֵיהֶם
  choice: 他们的帐幕幔子
  rationale: יְרִיעָה可指幔子、帐棚布幅或覆盖物；结合帐棚语境，“帐幕幔子”明确其用途。
- source_word: כָּל־כְּלֵיהֶם
  choice: 所有财物
  rationale: כְּלִי涵盖器皿、用具、物件等；在战利品清单中，“财物”自然表达其集合意义，避免误限为器皿。
- source_word: גְּמַלֵּיהֶם
  choice: 骆驼
  rationale: 直接对应גָּמָל的复数附属形式。
- source_word: יִשְׂאוּ לָהֶם
  choice: 掳去
  rationale: נשא在此表示把财物带走，לָהֶם可含归自己所有或为自己牟利之意；“掳去”在劫掠语境中简洁传达带走并占有的含义。
- source_word: וְקָרְאוּ עֲלֵיהֶם
  choice: 人要向他们呼喊
  rationale: קרא על可表示向某人、针对某人或论及某人呼喊。“向他们呼喊”保留呼喊指向，同时不把介词关系限定为纯粹敌对。以泛指“人”承接希伯来语未明说身份的复数主语，使汉语更自然。
- source_word: מָגוֹר מִסָּבִיב
  choice: 四面尽是惊恐！
  rationale: 这是耶利米书反复出现的固定语句，描述惊恐从四周包围而来；此译简洁有力，并保留其公式化特征。
theological_decisions: []
