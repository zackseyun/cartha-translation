  yaml_path: translation/ot/jeremiah/049/039.yaml
  text: But in the latter days I will restore the fortunes of Elam[a], declares Yahweh.
translation:
  language: zh_hans
  text: 但在末后的日子，我必恢复以拦的境况[a]。这是耶和华的宣告。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我必扭转以拦被掳的境况”，或“我必使以拦被掳的人归回。”这里的希伯来语恢复公式可特指从被掳状态中得释放或被掳者归回，也可泛指境况得到恢复。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: 但
  rationale: 承接前文对以拦的审判，并引出将来的逆转；用“但”自然表达语篇中的转折，不拘泥于直译“事情将会发生”。
- source_word: בְּאַחֲרִית הַיָּמִים
  choice: 在末后的日子
  rationale: 保留先知性惯用语的庄重感及其可能具有的末世意味，同时不限定具体的末世时间表。
- source_word: אשוב אֶת שבית
  choice: 我必使……的境况复原
  rationale: 这是希伯来语的复兴公式，可指被掳者归回，也可广指受审判后时运或境况的恢复；正文采用自然且较宽泛的表达，并在脚注保留较窄的可能译法。
- source_word: עֵילָם
  choice: 以拦
  rationale: 采用现代中文圣经读者熟悉的专名译法。
- source_word: נְאֻם יְהוָה
  choice: 这是耶和华的宣告
  rationale: 体现先知话语公式的郑重语气，并将神的专名译作“耶和华”。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 在简体中文圣经语境中，以通行音译“耶和华”表达四字神名，而不以一般称号替代。
theological_decisions:
- issue: בְּאַחֲרִית הַיָּמִים 的先知性及末世意味
  choice: 译作“在末后的日子”，保留其可能的末世意味，但不设定具体时间框架。
  alternative: 可译作“在将来的日子”或“在末日”。
  rationale: 原文所指是将来的时期，并可能带有末世色彩，但本节没有提供足够依据来确定特定的末世论方案。
- issue: אשוב אֶת שבית עֵילָם 的复兴范围
  choice: 正文理解为使以拦的整体境况复原。
  alternative: 也可较具体地理解为使以拦被掳的人归回，或扭转其被掳状态。
  rationale: 该希伯来语公式兼有归回被掳者和广义恢复景况的可能，故正文保持宽度，脚注说明具体替代译法。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“境况复原”比“转回命运”更自然，也避免把含义限缩为物质兴盛；句末独立译出宣告公式，以保持先知话语的郑重感。
