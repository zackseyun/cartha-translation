base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/018.yaml
  text: As when Sodom and Gomorrah and their neighboring towns were overthrown[a], says Yahweh, no man will dwell there[b], and no son of man will sojourn in her.
translation:
  language: zh_hans
  text: 雅威说：正如所多玛、蛾摩拉和周围的城镇倾覆时一样[a]，那里必无人居住，也没有人[b]寄居其中。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“如同所多玛、蛾摩拉和其邻近城镇的倾覆。”
    reason: 保留כְּמַהְפֵּכַת名词结构的直译可能。
  - marker: b
    text: “人”原文直译为“人之子”，在这里是希伯来语中指人或凡人的惯用说法，并非弥赛亚称号。
    reason: 说明בֶּן־אָדָם在本节中的普通人类含义。
lexical_decisions:
- source_word: כְּמַהְפֵּכַת
  choice: 正如……倾覆时一样
  rationale: 前缀כְּ表示比较，מַהְפֵּכָה指灾难性的倾覆或毁灭；译作比较性分句，既自然，也保留原文的明喻。
- source_word: סְדֹם וַעֲמֹרָה וּשְׁכֵנֶיהָ
  choice: 所多玛、蛾摩拉和周围的城镇
  rationale: שְׁכֵנֶיהָ字面指“她的邻近者”；上下文所指是与所多玛、蛾摩拉相邻的聚落，故明确译为“周围的城镇”。
- source_word: אָמַר יְהוָה
  choice: 这是雅威说的
  rationale: 保留先知宣告公式，并将神名יהוה音译为“雅威”。
- source_word: יֵשֵׁב שָׁם אִישׁ
  choice: 必无人住在那里
  rationale: ישׁב在此表示居住；אישׁ虽为阳性单数，却具有泛指作用，现代汉语以“无人”自然准确地表达。
- source_word: יָגוּר בָּהּ בֶּן אָדָם
  choice: 也没有人寄居其中
  rationale: גור表示以外来者或暂居者身份居留，故译“寄居”，与前面的“住”保持语义区别；בן־אדם在此是普通人类称谓，并非弥赛亚头衔。
- source_word: בָּהּ
  choice: 其中
  rationale: 阴性单数后缀回指被宣告荒废的地方；汉语不用语法阴性，译作“其中”比“在她里面”自然。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；音译“雅威”保留其专名性质，且不以称号替代。
- issue: אִישׁ与בֶּן־אָדָם的人类称谓
  choice: 无人……也没有人
  alternative: 没有男人……也没有人子
  rationale: 两者在荒凉宣告中都泛指任何人。现代汉语若直译“男人”会错误限缩为男性，直译“人子”又容易被误认为特定弥赛亚称号；故正文按语义译为“人”，并以脚注说明后者的希伯来表达。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“倾覆”保持审判意象；“住”与“寄居”对应两个不同的希伯来动词。破折号标示插入的神谕公式，使长句层次清楚。
