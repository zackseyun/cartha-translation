source:
  edition: WLC
  text: וְ/הַחְתַּתִּ֣י אֶת עֵ֠ילָם לִ/פְנֵ֨י אֹיְבֵי/הֶ֜ם וְ/לִ/פְנֵ֣י מְבַקְשֵׁ֣י נַפְשָׁ֗/ם וְ/הֵבֵאתִ֨י עֲלֵי/הֶ֧ם רָעָ֛ה אֶת חֲר֥וֹן אַפִּ֖/י נְאֻם יְהוָ֑ה וְ/שִׁלַּחְתִּ֤י אַֽחֲרֵי/הֶם֙ אֶת הַ/חֶ֔רֶב עַ֥ד כַּלּוֹתִ֖/י אוֹתָֽ/ם־׀׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/037.yaml
  text: I will shatter Elam before their enemies and before those who seek their life[a]. I will bring disaster on them, my burning anger, declares Yahweh[c][b], and I will send the sword after them until I have consumed them.
translation:
  language: zh_hans
  text: “我要使以拦在仇敌和寻索他们性命的人面前惊惶溃败[a]；我要把灾祸[b]，就是我的烈怒，降在他们身上——这是雅威的宣告。我要使刀剑追赶他们，直到将他们灭尽。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “惊惶溃败”也可译作“惊恐”“丧胆”或“崩溃”；原文动词既可侧重恐慌，也可侧重受挫瓦解。
    reason: lexical_alternative
  - marker: b
    text: “灾祸”也可译作“灾难”；这里指审判所带来的祸患，并非道德意义上的邪恶。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַחְתַּתִּי
  choice: 我要使……惊惶溃败
  rationale: 使役形可表达使人惊恐、挫败或崩溃；“惊惶溃败”兼顾心理恐慌与军事崩溃，不把语义局限于单一层面。
- source_word: עֵילָם
  choice: 以拦
  rationale: 采用该古代民族及地域名称在现代中文圣经语境中的通行译名。
- source_word: לִפְנֵי אֹיְבֵיהֶם וְלִפְנֵי מְבַקְשֵׁי נַפְשָׁם
  choice: 在仇敌和寻索他们性命的人面前
  rationale: 保留 לִפְנֵי 的“在……面前”以及“寻索性命”这一希伯来习语；后者在语境中指企图杀害他们的人。
- source_word: וְהֵבֵאתִי עֲלֵיהֶם רָעָה
  choice: 我要把灾祸……降在他们身上
  rationale: רָעָה 在先知审判语境中指灾难或祸患，而非道德意义上的邪恶。
- source_word: אֶת חֲרוֹן אַפִּי
  choice: 就是我的烈怒
  rationale: 同位结构说明所降的灾祸体现雅威炽烈的怒气；“烈怒”自然凝练，并保留强烈程度。
- source_word: נְאֻם יְהוָה
  choice: 这是雅威说的
  rationale: 以自然、庄重的现代汉语表达先知书中的神谕公式，并将四字神名直接译作“雅威”。
- source_word: וְשִׁלַּחְתִּי אַחֲרֵיהֶם אֶת הַחֶרֶב
  choice: 我要使刀剑追赶他们
  rationale: 保留“差遣刀剑跟在他们后面”的拟人追击意象，同时符合现代汉语表达。
- source_word: עַד כַּלּוֹתִי אוֹתָם
  choice: 直到将他们灭尽
  rationale: כלה 在此表达彻底终结、消灭；“灭尽”保留审判的彻底性，且比直译“耗尽”更自然。
theological_decisions:
- issue: רָעָה 用于神施行审判时的含义
  choice: 灾祸
  alternative: 邪恶；灾难
  rationale: 本处指临到以拦的审判性灾祸，不是在断言神施行道德上的邪恶。
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文明确使用四字神名；音译“雅威”直接呈现专名，不以称号替代。
- issue: אֶת חֲרוֹן אַפִּי 与 רָעָה 的关系
  choice: 以“就是”表达同位说明
  alternative: 并列为“灾祸和我的烈怒”
  rationale: 第二个 אֶת 最自然地将“我的烈怒”作为“灾祸”的同位说明；译文保留二者紧密关系，不将其拆成两项彼此独立的对象。
translation_notes:
  register: 采用庄重而清晰的现代标准汉语。主句保留希伯来文的第一人称审判宣告和刀剑追赶的生动意象；“寻索他们性命”略带经文体色彩，但普通读者可从语境理解，也较忠实地保存原文习语。
