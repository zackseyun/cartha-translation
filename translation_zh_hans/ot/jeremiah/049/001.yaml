source:
  edition: WLC
  text: לִ/בְנֵ֣י עַמּ֗וֹן כֹּ֚ה אָמַ֣ר יְהוָ֔ה הֲ/בָנִ֥ים אֵין֙ לְ/יִשְׂרָאֵ֔ל אִם יוֹרֵ֖שׁ אֵ֣ין ל֑/וֹ מַדּ֗וּעַ יָרַ֤שׁ מַלְכָּ/ם֙ אֶת גָּ֔ד וְ/עַמּ֖/וֹ בְּ/עָרָ֥י/ו יָשָֽׁב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/001.yaml
  text: 'Concerning the sons of Ammon[a], thus says Yahweh: Does Israel have no sons? Does he have no heir? Why then has Milcom taken possession of Gad, and his people settled in its cities?'
translation:
  language: zh_hans
  text: '论亚扪人。耶和华如此说：


    “以色列没有儿子吗？


    他没有继承人吗？


    玛勒堪[a]为什么占据了迦得，


    他的百姓为什么住在其中的城邑？”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “玛勒堪”所对应的希伯来语也可读作“他们的王”，即：“他们的王为什么占据了迦得……？”
    reason: alternative_reading
lexical_decisions:
- source_word: לִבְנֵי עַמּוֹן
  choice: 论亚扪人
  rationale: 介词 לְ 在此引出预言的对象或主题。“论”符合中文先知性宣告的标题语体；“亚扪人”比直译“亚扪的子孙”更自然，也准确指向该族群。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经语境中对四字神名的通行音译，保留其专名性质，而不以称号替代。
- source_word: הֲבָנִים אֵין לְיִשְׂרָאֵל
  choice: 以色列没有儿子吗？
  rationale: 保留 בָנִים 的“儿子”含义，因为上下文以土地继承权为论证核心；拟人化的“以色列”在下一句以“他”承接。
- source_word: אִם יוֹרֵשׁ אֵין לוֹ
  choice: 他没有继承人吗？
  rationale: 此处 אִם 延续反问，而非表达真实条件；יוֹרֵשׁ 为单数，译作“继承人”可清楚呈现继承权的逻辑。
- source_word: מַדּוּעַ יָרַשׁ
  choice: 为什么占据了
  rationale: ירש 在领土语境中表示取得并占有土地；“占据”自然简洁，同时保留侵占产业的语意。
- source_word: מַלְכָּם
  choice: 米勒公
  rationale: 按马所拉元音将其理解为亚扪人的神祇米勒公；但辅音形式也可理解为“他们的王”，故在脚注保留另一读法。
- source_word: אֶת גָּד
  choice: 迦得
  rationale: 原文直接使用专名“迦得”，在语境中指迦得支派的地域；正文不增补解释性名词。
- source_word: וְעַמּוֹ בְּעָרָיו יָשָׁב
  choice: 他的百姓为什么住进了其中的城邑
  rationale: “他的百姓”按语法承接米勒公；בְעָרָיו 的后缀形式虽为阳性单数，语义上指迦得地域中的城邑。以“其中”避免误解为米勒公原有的城邑。补出第二个“为什么”使并列反问在现代汉语中清楚自然。
theological_decisions:
- issue: מַלְכָּם 的读法
  choice: 米勒公（亚扪人的神祇）
  alternative: 他们的王
  rationale: 马所拉文本的元音支持神名“米勒公”，且先知文学可将异族神祇描写为占有土地；但无元音的辅音形式同样容许“他们的王”，因此不在正文中混合两义，而以脚注保存真实歧义。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。标题简洁，反问句保留原文的继承权论证和修辞力度；诗行排列呈现三个相连的问题。正文使用“城邑”以保持先知书语体，但避免过度古雅。
