  text: אֵ֥יךְ לֹֽא עֻזְּבָ֖ה עִ֣יר תהלה קִרְיַ֖ת מְשׂוֹשִֽׂ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/025.yaml
  text: How is the city of praise not abandoned[b][a], the city of my joy?
translation:
  language: zh_hans
  text: 受赞美的城，我的喜乐之城[a]，怎么竟没有被遗弃呢？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “我的喜乐之城”也可译作“我所喜爱的城”。原文保留第一人称“我的”，但这里说话者是谁，解释不一。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵיךְ
  choice: 怎么……呢
  rationale: 该疑问兼感叹词在这里表达惊讶或哀叹；译为“怎么……呢”保留修辞力度，不把它限定为单纯询问原因的“为什么”。
- source_word: לֹא
  choice: 没有
  rationale: 直接保留对被动动词的否定，并与完成体表达“被遗弃”自然搭配。
- source_word: עֻזְּבָה
  choice: 被遗弃
  rationale: 该词是עזב的阴性单数被动完成式，与“城”一致。“被遗弃”是现代汉语中自然清楚的说法，也传达城被离弃、无人留守的意味。
- source_word: עִיר תהלה
  choice: 受赞美的城
  rationale: 既保留תהלה“赞美”的基本词义，也自然表达这是一座备受称誉的城；不直接改译为“名城”，以免失去原文的诗性措辞。
- source_word: קִרְיַת
  choice: ……之城
  rationale: 保留与前一“城”平行的同位诗句结构，而不把两个称谓合并。
- source_word: מְשׂוֹשִׂי
  choice: 我的喜乐
  rationale: 直接保留名词“喜乐”和第一人称单数后缀“我的”；不擅自判定哀歌中说话者的身份。
theological_decisions:
- issue: “我的喜乐”中第一人称所指
  choice: 保留“我的”，不说明说话者是谁
  alternative: 译作“令人喜爱的”或直接认定为某一位说话者的喜乐
  rationale: 原文明确有第一人称单数后缀，但哀叹声音的归属并不完全明确；正文应保留这种张力。
translation_notes:
  register: 采用现代、庄重而可朗读的汉语。为使中文诗句自然，将两个同位称谓置于疑问句前，并用“竟”传达אֵיךְ在语境中的惊讶和哀叹；没有改动原文“没有被遗弃”这一看似反常却刻意保留的修辞表达。
