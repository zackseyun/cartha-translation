source:
  edition: WLC
  text: נֻ֤סוּ הָפְנוּ֙ הֶעְמִ֣יקוּ לָ/שֶׁ֔בֶת יֹשְׁבֵ֖י דְּדָ֑ן כִּ֣י אֵ֥יד עֵשָׂ֛ו הֵבֵ֥אתִי עָלָ֖י/ו עֵ֥ת פְּקַדְתִּֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/008.yaml
  text: Flee[a], turn back, dwell deep, inhabitants of Dedan, for I have brought Esau’s calamity upon him[c][b], the time when I punish him.
translation:
  language: zh_hans
  text: 底但的居民哪，你们要逃跑，转身退去，深入偏远隐蔽之处居住[a]！因为我已经使以扫遭遇灾祸[b]；这正是我惩罚他的时候[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“深入居住。”原文用“深入”这一习语，指退到偏远、隐蔽或难以到达之处。
    reason: lexical_alternative
  - marker: b
    text: “以扫”在这里代表他的后裔以东。
    reason: cultural_note
  - marker: c
    text: “惩罚”也可译作“追讨”或“察访”；原词在这里指施行审判。
    reason: lexical_alternative
lexical_decisions:
- source_word: נֻסוּ
  choice: 逃跑
  rationale: 复数命令式，直接命令底但居民逃离危险；“逃跑”是现代汉语中清楚自然的表达。
- source_word: הָפְנוּ
  choice: 转身退去
  rationale: פנה在此与“逃跑”连用，表示转身撤离；加入“退去”可自然传达远离危险的方向感。
- source_word: הֶעְמִיקוּ לָשֶׁבֶת
  choice: 藏到深处居住
  rationale: 直译有“深入居住”之意，语境中指退到偏远、隐蔽或难以到达之处；此译保留“深处”的意象，同时使汉语含义明确。
- source_word: יֹשְׁבֵי דְּדָן
  choice: 底但的居民
  rationale: 按原文呼格结构翻译，地名音译为“底但”，表达庄重而自然。
- source_word: אֵיד עֵשָׂו
  choice: 使以扫遭遇灾祸
  rationale: אֵיד表示灾难、祸患；保留原文“以扫”，不在正文中直接替换为“以东”，并用脚注说明其转喻。
- source_word: הֵבֵאתִי עָלָיו
  choice: 我必使……遭遇
  rationale: 希伯来语完成式在先知宣告中可表达确定将临之事；汉语用“必”体现其确定性，避免误解为灾祸已经发生。
- source_word: עֵת פְּקַדְתִּיו
  choice: 到了我惩罚他的时候
  rationale: פקד在审判语境中表示追讨、惩罚；“到了……的时候”自然传达时间结构。
theological_decisions:
- issue: 审判语境中פקד的译法
  choice: 惩罚
  alternative: 察访；追讨
  rationale: 上下文明显指上帝施行审判，因此“惩罚”清楚表达语境意义；脚注保留“追讨”这一较贴近希伯来语多义性的译法。
- issue: 先知性完成式הֵבֵאתִי的时间表达
  choice: 我必使……遭遇
  alternative: 我已经使……临到他
  rationale: 完成式可将未来审判表述为确定之事；“必”在现代汉语中兼顾未来指向与事件的确定性，而不强行解释为已经发生。
- issue: “以扫”的指代
  choice: 正文保留“以扫”
  alternative: 译为“以东”
  rationale: 原文明确使用“以扫”；保留该名可维持文本的历史与修辞形式，脚注说明这里代表其后裔以东。
translation_notes:
  register: 采用现代、庄重而易懂的先知性语言。用“哪”标明呼语，以连续命令保持原文的急迫感；保留“深处”和“以扫”等原文意象，并以脚注解释习语与转喻。
