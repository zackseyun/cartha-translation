  to: 底但的居民哪，你们要逃跑，转身退去，深入偏远隐蔽之处居住[a]！因为我已经使以扫遭遇灾祸[b]；这正是我惩罚他的时候[c]。
  rationale: 修订保留三个急迫的复数命令、底但与以扫的专名、以扫所受灾祸，以及审判性“追讨”的含义。“已经使”对应希伯来语完成式，不将其预言性用法单向固定为未来；“这正是……”以自然汉语呈现末尾短语对灾祸的说明关系。
