  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כִּֽי אֲנִ֞י חָשַׂ֣פְתִּי אֶת עֵשָׂ֗ו גִּלֵּ֨יתִי֙ אֶת מִסְתָּרָ֔י/ו וְ/נֶחְבָּ֖ה לֹ֣א יוּכָ֑ל שֻׁדַּ֥ד זַרְע֛/וֹ וְ/אֶחָ֥י/ו וּ/שְׁכֵנָ֖י/ו וְ/אֵינֶֽ/נּוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/010.yaml
  text: For I have stripped Esau bare[a]; I have uncovered his hiding places, and he will not be able to hide himself. His offspring, his brothers, and his neighbors are destroyed[b], and he is no more.
translation:
  language: zh_hans
  text: 因为我已使以扫暴露无遗，也揭开了他的藏身之处；他无法藏身。他的后代、弟兄和邻舍都遭到毁灭[b]，他也不复存在。
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: “遭到毁灭”也可译作“遭劫掠”或“遭蹂躏”。
    reason: lexical_alternative
lexical_decisions:
- source_word: חָשַׂפְתִּי
  choice: 使……暴露无遗
  rationale: 该动词含有剥去遮蔽、使之完全显露的具体意象。“暴露无遗”在现代汉语中自然地表达彻底显露，也与下句揭开藏身之处相呼应。
- source_word: עֵשָׂו
  choice: 以扫
  rationale: 原文使用人名“以扫”，在本段预言中借指其后裔之国以东；正文保留原文名称，并以脚注说明。
- source_word: גִּלֵּיתִי
  choice: 揭开
  rationale: 保留“揭去遮盖”的具体意象，适合与实际的藏身之处搭配。
- source_word: מִסְתָּרָיו
  choice: 他的藏身之处
  rationale: 该名词指隐蔽、藏匿的地点，不只是抽象的秘密；此译法准确且通顺。
- source_word: וְנֶחְבָּה לֹא יוּכָל
  choice: 使他无法躲藏
  rationale: 原文表达以扫不能把自己隐藏起来；汉语用结果性衔接自然呈现其与前两分句的关系。
- source_word: שֻׁדַּד
  choice: 都遭毁灭
  rationale: 该动词可指遭劫掠、蹂躏或毁坏。这里统摄后代、弟兄和邻舍，译为“遭毁灭”体现审判造成的彻底败亡，同时用脚注保留较具体的词义选项。
- source_word: זַרְעוֹ
  choice: 他的后代
  rationale: “后代”自然表达集合意义，避免将希伯来语“种子”的比喻生硬直译。
- source_word: אֶחָיו
  choice: 弟兄
  rationale: 保留原文亲属称谓；在民族性语境中也可包含有亲缘关系的族群。
- source_word: שְׁכֵנָיו
  choice: 邻舍
  rationale: 保留“居住在附近者”的基本词义，在本段中可指周边民族或邻近盟友。
- source_word: וְאֵינֶנּוּ
  choice: 他也不复存在
  rationale: 简洁表达原文“不再有他”的终局性，并保留以扫这一单数拟人化指称。
- source_word: כִּי
  choice: 因为
  rationale: 此处引出前文审判宣告的理由或说明，“因为”清楚呈现逻辑联系。
theological_decisions:
- issue: 在针对以东的预言中“以扫”的所指
  choice: 正文译作人名“以扫”，让其代表以东民族的转喻用法由上下文和脚注说明。
  alternative: 在正文中直接意译为“以东”。
  rationale: 希伯来文本明确使用“以扫”。保留人名既忠于原文，也保留先祖与民族之间的修辞联系，且不额外引入教派性解释。
- issue: שֻׁדַּד与后列三个群体的句法关系
  choice: 将“遭毁灭”理解为统摄“后代、弟兄和邻舍”，以“都”明确共同遭遇。
  alternative: 仅将单数动词直接连接“后代”，把“弟兄和邻舍”处理为省略谓语的追加成分。
  rationale: 原文动词虽为阳性单数，可与最邻近的集合名词“后代”一致，但其后并列成分自然共享该谓语。汉语合并表达清楚，也不改变各群体共同败亡的语义。
translation_notes:
  register: 采用庄重而清晰的现代标准汉语。“暴露无遗”传达剥去遮蔽后的彻底显露，避免生硬或容易误解为单纯身体裸露的直译；全节保持先祖名代表民族的拟人化表达。
