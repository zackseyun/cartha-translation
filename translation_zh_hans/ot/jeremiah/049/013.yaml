base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/013.yaml
  text: For I have sworn by myself, declares the LORD, that Bozrah will become a horror, a reproach, a ruin, and a curse, and all her cities will become everlasting ruins.
translation:
  language: zh_hans
  text: 耶和华宣告：“我指着自己起誓：波斯拉必成为令人惊骇的景象，遭人讥诮，化为废墟，成为咒诅；她所有的城邑都必成为永远的废墟。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שַׁמָּה
  choice: 令人惊骇之地
  rationale: 该词表示因灾毁而令人震惊、惊骇的景象；用此表达保留结果与观者反应两层含义。
- source_word: חֶרְפָּה
  choice: 受人羞辱
  rationale: 表达公开蒙羞、被人讥辱的状态，比单用抽象名词更符合现代汉语。
- source_word: חֹרֶב
  choice: 废墟
  rationale: 此处指毁坏荒废后的状态或地方；译作“废墟”自然，并与下文复数“荒废”有所呼应而不机械重复。
- source_word: קְלָלָה
  choice: 咒诅
  rationale: 保留该词可指受咒诅之地，也可指人们咒骂时所援引对象的语义张力。
- source_word: חָרְבוֹת עוֹלָם
  choice: 永远荒废
  rationale: 自然表达长期、永久成为废墟的意思；“永远”直接对应 עוֹלָם。
- source_word: בָצְרָה
  choice: 波斯拉
  rationale: 采用该以东城名常见的现代汉语音译。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 耶和华
  alternative: 雅威／上主
  rationale: 采用普通简体中文读者熟悉的传统专名，同时明确这是发言者的神名。
- issue: בִי נִשְׁבַּעְתִּי 的起誓对象
  choice: 我指着自己起誓
  alternative: 我凭自己起誓
  rationale: 清楚保留神以自己为誓的强调，不增添经文未明说的神学解释。
- issue: קְלָלָה 的语义范围
  choice: 成为咒诅
  alternative: 受咒诅／成为人咒骂的话柄
  rationale: 保持希伯来文简洁且具有张力的表述，不单方面限定为受罚状态或咒语范例。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。“耶和华说”前置，使引语结构清楚；四项审判结果保持并列节奏。“她”承接城名波斯拉，并与原文阴性代词一致。
