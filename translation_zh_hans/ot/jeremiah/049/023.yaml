    rationale: שְׁמֻעָה רָעָה 是不祥、坏的报告，原文没有限定为死亡消息；现代汉语“凶讯”常有死讯义。
  - severity: medium
    issue: “吓得瘫软”过度具体化 נָמֹגוּ。
    rationale: 该动词以“融化”比喻消沉、失去勇气；译文补入明确的惊吓原因和身体瘫倒，缩窄了原有的比喻表达。
  - severity: low
    issue: 脚注把地点解读说成“海边”。
    rationale: בַּיָּם 的直观地点义是“在海中／海上”，并非“海边”；应避免无依据地改换地点。
