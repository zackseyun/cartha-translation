    哈马和亚珥拔蒙了羞，

    因为他们听见了坏消息；

    他们都丧胆了。


    忧虑如海，无法平静。[a]'
  rationale: 修订仅消除不必要的语义具体化，并更正脚注中的地点义。“坏消息”和“丧胆”分别保留原文的宽泛灾祸报告与“融化”式的失去勇气之意；末句及脚注继续保留困难希伯来文的两种主要理解。
