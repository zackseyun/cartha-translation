base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/023.yaml
  text: 'Concerning Damascus: Hamath and Arpad are put to shame[a], for they have heard bad news; they melt away. There is anxiety like the sea; it cannot be quiet.'
translation:
  language: zh_hans
  text: '论大马士革：


    哈马和亚珥拔蒙了羞，

    因为他们听见了坏消息；

    他们都丧胆了。


    忧虑如海，无法平静。[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文较难理解，直译近似“在海中（或：如海一般），有忧虑；它不能平静”。这句话既可能是说他们的忧虑像无法平静的海，也可能是说海中有忧虑，且不能平静。
    reason: lexical_alternative
lexical_decisions:
- source_word: לְדַמֶּשֶׂק
  choice: 论大马士革
  rationale: 先知书神谕标题中的 לְ 表示所论及的对象。“论”既符合现代中文标题习惯，也不像“攻击”那样把该介词的含义限定得过窄。
- source_word: בּוֹשָׁה
  choice: 蒙了羞
  rationale: 该词虽为阴性单数形式，却在这里以哈马和亚珥拔为复合对象，采用神谕诗歌中的集合表达。“蒙了羞”传达公开受辱、惊惶失措的意味。
- source_word: חֲמָת וְאַרְפָּד
  choice: 哈马和亚珥拔
  rationale: 按现代中文圣经地名的通行音译处理这两个地名。
- source_word: שְׁמֻעָה רָעָה
  choice: 凶讯
  rationale: 该短语指带来灾祸消息的报告。“凶讯”简洁自然，比一般性的“坏消息”更贴合审判神谕的语境，又不具体断定消息内容。
- source_word: נָמֹגוּ
  choice: 吓得瘫软
  rationale: 原词本义有融化、消解之意，在此比喻勇气消失。中文“吓得瘫软”自然地表达其结果；若直译为“融化”，在现代中文中容易产生不合语境的实体意象。
- source_word: בַּיָּם דְּאָגָה
  choice: 忧虑如海
  rationale: 希伯来文结构艰涩。正文采用较合上下文的比较义，把 בַּיָּם 理解为海的比喻，表现忧虑如海一般动荡；同时用脚注保留地点义等其他可能。
- source_word: הַשְׁקֵט לֹא יוּכָל
  choice: 无法平静
  rationale: 不明确补出主语，从而保留“不能平静”究竟描述海、忧虑，还是忧虑中的人这一诗意张力。
