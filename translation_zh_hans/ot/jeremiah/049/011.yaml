  text: עָזְבָ֥/ה יְתֹמֶ֖י/ךָ אֲנִ֣י אֲחַיֶּ֑ה וְ/אַלְמְנֹתֶ֖י/ךָ עָלַ֥/י תִּבְטָֽחוּ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/011.yaml
  text: Leave your fatherless children; I will keep them alive[a]. And let your widows trust in me.
translation:
  language: zh_hans
  text: '留下你那些失去父亲的孩子[a]吧；

    我必使他们存活。

    你的寡妇要倚靠我。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“孤儿”；原文用词特指失去父亲的孩子。
    reason: 说明希伯来词的具体社会含义，并提供常见而较宽泛的汉语译法。
lexical_decisions:
- source_word: עָזְבָה
  choice: 留下……吧
  rationale: 这是עָזַב的命令形式；在本语境中可指把人留下、交托，而不必带有“狠心遗弃”的强烈贬义。“留下……吧”既保留命令语气，也符合现代汉语。
- source_word: יְתֹמֶיךָ
  choice: 你那些失去父亲的孩子
  rationale: יָתוֹם所指的社会身份核心是丧父者；这样翻译比单用“孤儿”更准确，避免让读者必然理解为父母双亡。
- source_word: אֲנִי אֲחַיֶּה
  choice: 我必使他们存活
  rationale: 独立代词אֲנִי强调由“我”亲自施行；חיה的Piel形式具有使之活着、保全性命的使役意味。
- source_word: וְאַלְמְנֹתֶיךָ
  choice: 你的寡妇
  rationale: אַלְמָנָה直指寡妇；物主后缀保留为“你的”，与前句“你的孩子”对应。
- source_word: עָלַי תִּבְטָחוּ
  choice: 要倚靠我
  rationale: בטח与עַל连用表示以某者为信赖、倚靠的对象。“要倚靠我”自然庄重，并可保留未完成式在此既可带劝告色彩、也可带应许意味的张力。
theological_decisions:
- issue: 说话者身份与对弱势幸存者的眷顾
  choice: 保留第一人称直接应许，不在正文另加“耶和华说”
  alternative: 在正文明确补出“耶和华说”
  rationale: 上下文表明说话者是耶和华，但本节希伯来文本没有再次写出神名。译文保留直接神谕及其怜悯应许，同时不把上下文信息增补进正文。
- issue: תִּבְטָחוּ的语气
  choice: 译作“要倚靠我”
  alternative: 译作“可以倚靠我”或“必倚靠我”
  rationale: 希伯来未完成式在此可能表达劝告、准许或带应许色彩的陈述。“要”在现代汉语中兼具劝告和前瞻意味，较少把原文张力单向解释为命令或预告。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“留下”避免“抛弃”所带来的过度负面色彩；三行短句保留神谕的节奏和两个并列应许之间的力度。
