source:
  edition: WLC
  text: וְ/שַׂמְתִּ֥י כִסְאִ֖/י בְּ/עֵילָ֑ם וְ/הַאֲבַדְתִּ֥י מִ/שָּׁ֛ם מֶ֥לֶךְ וְ/שָׂרִ֖ים נְאֻם יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/038.yaml
  text: And I will set my throne in Elam[a], and I will destroy from there king and officials[b], declares Yahweh.
translation:
  language: zh_hans
  text: 我要在以拦设立我的宝座[a]，从那里除灭君王和首领[b]。这是雅威的宣告。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “设立”也可译作“安放”或“设置”。希伯来语动词可表示放置、安设或设立。
    reason: lexical_alternative
  - marker: b
    text: “首领”也可译作“官长”或“统治者”。希伯来语词可指高级官员、领袖或贵族。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׂמְתִּי
  choice: 我要……设立
  rationale: שׂוּם的基本义为“放置、安设、设立”。与“我的宝座”搭配时，“设立”在现代汉语中自然庄重，并保留建立王权与施行审判的意象，而不把含义扩展为永久统治。
- source_word: כִסְאִי
  choice: 我的宝座
  rationale: כִּסֵּא在君王和审判语境中通常指宝座；直译可保留雅威以主权者身份临到以拦的具体意象。
- source_word: בְּעֵילָם
  choice: 在以拦
  rationale: 介词בְּ在此自然表示地点，指宝座设在以拦境内；不译作“攻击以拦”，以免加入原文没有明说的敌对介词意义。
- source_word: וְהַאֲבַדְתִּי
  choice: 除灭
  rationale: אבד的使役式表示使之灭亡、毁灭。“除灭”符合汉语先知审判宣告的语体，也与后面的“从那里”自然衔接。
- source_word: מִשָּׁם
  choice: 从那里
  rationale: 准确保留מִן与地点副词组合所表达的来源或移除地点。
- source_word: מֶלֶךְ
  choice: 君王
  rationale: 原文无冠词，可泛指以拦的王权代表。“君王”庄重且不强行限定为某一位特定君王。
- source_word: וְשָׂרִים
  choice: 和首领
  rationale: שָׂרִים可指统治者、高官、贵族或领袖。“首领”既通俗又能涵盖政治统治阶层，并避免把它限缩为现代官僚意义上的“官员”。
- source_word: נְאֻם יְהוָה
  choice: 这是雅威的宣告
  rationale: נְאֻם是庄严的先知性宣告公式；译作“这是……的宣告”自然保留其神谕语气。神名יְהוָה按本项目规范音译为“雅威”。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名。音译“雅威”保留其专名性质，不以称号代替，也符合所给项目规范。
- issue: “我的宝座”的含义
  choice: 保留具体的王权意象“我的宝座”
  alternative: 我的统治；我的审判座
  rationale: 经文可能同时传达统治、临在与审判。保留宝座这一隐喻，避免只选定其中一种神学功能。
- issue: 除灭对象的范围
  choice: 君王和首领
  alternative: 那君王和众官长；王与诸侯
  rationale: 原文以无冠词的מֶלֶךְ和复数שָׂרִים指向以拦的王权及统治阶层。译文不补入定冠意义，也不把שָׂרִים限定为王族。
translation_notes:
  register: 采用现代、庄重而清晰的普通话书面语。“设立我的宝座”保留先知文学中的王权和审判图像；“除灭”维持审判宣告的力度。“这是雅威的宣告”以自然汉语再现经文末尾的固定神谕公式。所有脚注标记均已置于正文相应词语之后。
