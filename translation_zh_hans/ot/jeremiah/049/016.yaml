  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: תִּֽפְלַצְתְּ/ךָ֞ הִשִּׁ֤יא אֹתָ/ךְ֙ זְד֣וֹן לִבֶּ֔/ךָ שֹֽׁכְנִי֙ בְּ/חַגְוֵ֣י הַ/סֶּ֔לַע תֹּפְשִׂ֖י מְר֣וֹם גִּבְעָ֑ה כִּֽי תַגְבִּ֤יהַ כַּ/נֶּ֨שֶׁר֙ קִנֶּ֔/ךָ מִ/שָּׁ֥ם אֽוֹרִידְ/ךָ֖ נְאֻם יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/016.yaml
  text: The terror you inspire has deceived you[a], the arrogance of your heart— you who dwell in the clefts of the rock, who occupy the height of the hill. Though you make your nest as high as the eagle, from there I will bring you down[c][b], declares Yahweh.
translation:
  language: zh_hans
  text: 你令人生畏的声势[a]和你心中的狂傲欺骗了你——你这住在岩石裂缝中、占据山冈高处的啊！即使你像鹰一样把巢筑得高高的，我也要从那里使你降下来。这是雅威的宣告。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“你的恐怖”或“你的可怕之处”；希伯来语既可能指以东使人畏惧的声势，也可能指它的恐怖或骇人名声。
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּפְלַצְתְּךָ
  choice: 你所造成的恐怖
  rationale: 该词可指恐怖、可怕之处或令人畏惧的声势；结合以东凭险自恃的语境，正文采用使役关系较明确的表达，同时以脚注保留其他可能。
- source_word: הִשִּׁיא אֹתָךְ
  choice: 欺骗了你
  rationale: נשׁא 的使役式在此表示使人受骗、误入歧途；“欺骗了你”直接自然。
- source_word: זְדוֹן לִבֶּךָ
  choice: 你心中的狂傲
  rationale: זָדוֹן 含狂妄、傲慢和僭越之意；“狂傲”既保留道德色彩，也符合现代汉语表达。
- source_word: שֹׁכְנִי בְּחַגְוֵי הַסֶּלַע
  choice: 你这住在岩石裂缝中的啊
  rationale: 保留分词短语的呼语功能和以东山地堡垒的具体意象。
- source_word: תֹּפְשִׂי מְרוֹם גִּבְעָה
  choice: 占据山冈高处
  rationale: תפשׂ 本义为抓住、取得，在据守地势的语境中译为“占据”更自然，并保留主动把持高处的意味。
- source_word: כִּי תַגְבִּיהַ כַּנֶּשֶׁר קִנֶּךָ
  choice: 即使你像鹰一样把巢筑得高高的
  rationale: כִּי 在上下文中具有让步作用；使役式 גבה 表示使巢升高，中文以“筑得高高的”自然呈现鹰巢意象。
- source_word: מִשָּׁם אוֹרִידְךָ
  choice: 我也要从那里把你拉下来
  rationale: ירד 的使役式表示使之下降；“拉下来”与前面的高处形成鲜明逆转，也保留神主动降卑以东的力度。
- source_word: נְאֻם יְהוָה
  choice: 雅威如此宣告
  rationale: נְאֻם 是先知宣告公式；יהוה 按所给神学决策音译为“雅威”，不用称号替代其专名。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；采用“雅威”以保留专名性质，并与所提供的最新规范一致。
- issue: תִּפְלַצְתְּךָ 所指的恐怖
  choice: 正文理解为以东令他人恐惧的声势
  alternative: 以东自身的恐惧；以东的可怕名声或骇人之处
  rationale: 语境将欺骗与狂傲、险要地势相连，较支持以东因自己造成的威慑而自欺；但词义存在真实歧义，故在脚注中保留。
- issue: 以东安全感意象的解释范围
  choice: 保留凭险自恃并遭雅威降卑的历史性审判图景
  alternative: 仅作内在心理描写；脱离以东历史语境作扩展性末世解释
  rationale: 岩缝、山冈高处和鹰巢共同指向难以攻取的山地据点；译文不加入原文未明说的教派性或末世性解释。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。以破折号和呼语“啊”呈现希伯来语分词短语对以东的直接称呼；重复“欺骗了你”以免汉语中把“你心中的狂傲”误读成前一短语的同位说明。正文所有脚注标记均已对应。
