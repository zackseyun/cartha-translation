  naturalness: “来自天之四极的四风刮向以拦”略显拗口；改为“从天的四极带来四风攻击以拦”更合乎现代庄重汉语，并保留审判临到的语境。
  terminology: “以拦”恰当。“天的四极”“四风”可保留原文的宇宙性及风的意象。将第二次“风”自然译作“这四方”，表达其方向性而不误用“风向”。
