base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/036.yaml
  text: I will bring against Elam the four winds from the four ends of the heavens[a], and I will scatter them to all these winds[b]. There will be no nation to which the outcasts of Elam will not go.
translation:
  language: zh_hans
  text: 我要从天的四极[a]带来四风攻击以拦；我要把他们驱散到这四方。以拦被赶散的人[b]无论到哪里，没有一个国家是他们不到的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“天的四方”。
    reason: lexical_alternative
  - marker: b
    text: 也可译为“以拦被驱逐的人”或“以拦流散的人”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵבֵאתִי אֶל עֵילָם
  choice: 我要使……刮向以拦
  rationale: הֵבִיא与אֶל在审判语境中表示使某物临到、朝向某地；结合宾语“四风”，译为“使……刮向”既体现敌对临到，也符合现代汉语中风的自然搭配。
- source_word: אַרְבַּע רוּחוֹת
  choice: 四风
  rationale: 上下文以“天之四极”和后文的各个风向说明רוּחוֹת指从四方而来的风，而非灵。保留“四风”的先知性意象。
- source_word: מֵאַרְבַּע קְצוֹת הַשָּׁמַיִם
  choice: 来自天之四极
  rationale: קְצוֹת表示边缘、尽头或极处；“天之四极”简洁庄重，并保留原文宇宙空间意象。脚注列出较通俗的替代译法。
- source_word: וְזֵרִתִים
  choice: 把他们吹散
  rationale: זרה可指扬散、簸散或驱散。这里与“四风”相连，“吹散”自然地保留风吹扬散的形象；代词“他们”指以拦人。
- source_word: לְכֹל הָרֻחוֹת הָאֵלֶּה
  choice: 到这一切风向
  rationale: רוּחוֹת既承接前面的“风”，又具有方向含义。“风向”在汉语中兼顾两层意义，避免生硬的“到这些风”。
- source_word: נִדְּחֵי עֵילָם
  choice: 以拦被赶散的人
  rationale: נִדְּחֵי指被驱赶、赶逐或分散的人。“被赶散的人”保留其被动受迫和流散之意，且比单纯“流亡者”更贴近词形。
- source_word: וְלֹא יִהְיֶה הַגּוֹי אֲשֶׁר לֹא יָבוֹא שָׁם
  choice: 无论到哪里，没有一个国家是他们不到的
  rationale: 以自然汉语表达希伯来文双重否定所强调的遍及性，同时保留“到达”这一移动概念。
theological_decisions: []
