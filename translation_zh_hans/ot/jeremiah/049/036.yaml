  to: 我要从天的四极[a]带来四风攻击以拦；我要把他们驱散到这四方。以拦被赶散的人[b]无论到哪里，没有一个国家是他们不到的。
  rationale: 修订恢复“我必驱散他们”的神为施事者，并以“这四方”自然表达“到所有这些风”的方向性。重组首句以减少“风刮向”造成的施事混淆。脚注b移至其实际说明的“以拦被赶散的人”之后；a仍紧随“天的四极”。
