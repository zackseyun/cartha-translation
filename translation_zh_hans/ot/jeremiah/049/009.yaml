  text: אִם בֹּֽצְרִים֙ בָּ֣אוּ לָ֔/ךְ לֹ֥א יַשְׁאִ֖רוּ עֽוֹלֵל֑וֹת אִם גַּנָּבִ֥ים בַּ/לַּ֖יְלָה הִשְׁחִ֥יתוּ דַיָּֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/009.yaml
  text: If grape gatherers came to you[a], would they not leave gleanings? If thieves came by night, they would destroy only enough for themselves.
translation:
  language: zh_hans
  text: 如果摘葡萄的人来到你这里，难道不会留下一些可供拾取的葡萄吗？如果盗贼夜里来到，他们只会毁坏到够了为止。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语末尾直译为“他们的足够”，是一个凝练的习语，意为“到他们所需的程度”。也可理解为：“如果盗贼夜里来到，难道不会只偷到够了为止吗？”
    reason: 说明דַיָּם的字面形式及其习语含义，并保留末句可作反问、且可按“偷取”理解的译法。
lexical_decisions:
- source_word: אִם
  choice: 如果
  rationale: 两次均引出假设性的比较；“如果”保留条件和反问语气。
- source_word: בֹּצְרִים
  choice: 摘葡萄的人
  rationale: 特指采摘葡萄者；此译自然、明确，并保留葡萄园意象。
- source_word: בָּאוּ לָךְ
  choice: 来到你这里
  rationale: 保留介词结构“来到你/临到你”的宽度；敌对意味由上下文表达，不强行译入。
- source_word: לֹא יַשְׁאִירוּ עוֹלֵלוֹת
  choice: 难道不会留下一些葡萄让人拾取吗
  rationale: 以反问表达希伯来文所期待的肯定回答；“让人拾取”传达 עוֹלֵלוֹת 所指收割后留下的零星葡萄。
- source_word: גַּנָּבִים בַּלַּיְלָה
  choice: 盗贼夜间来袭
  rationale: “盗贼”准确对应偷窃者；“夜间来袭”自然表达夜里潜入并造成损失的语境。
- source_word: הִשְׁחִיתוּ
  choice: 毁坏
  rationale: 保留 שׁחת Hiphil 的强烈语义，不弱化为单纯“拿走”。
- source_word: דַיָּם
  choice: 到自己够了为止
  rationale: 直面“他们的足够”这一凝缩习语，表达盗贼造成破坏直到所得足够，而非彻底扫荡。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“留下一些葡萄让人拾取”比术语化的“遗穗”更符合葡萄采收场景；末句保留原文“毁坏”的力度，并用脚注说明其凝练和歧义。
