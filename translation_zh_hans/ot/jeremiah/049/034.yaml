base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/034.yaml
  text: 'The word of Yahweh that came to Jeremiah the prophet concerning Elam[a], at the beginning of the reign of Zedekiah king of Judah, saying:'
translation:
  language: zh_hans
  text: 在犹大王西底家在位之初，雅威的话临到先知耶利米，是关于以拦的[a]，说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“针对以拦”。希伯来语介词可引出指向某国的神谕，依上下文既可译作“关于”，也可译作“针对”。
    reason: 保留אֶל在列国神谕标题中可表示主题或敌对指向的歧义。
lexical_decisions:
- source_word: דְבַר יְהוָה
  choice: 雅威的话
  rationale: 保留先知书中“雅威的话临到……”这一启示公式；דָּבָר译为“话”，既贴近原文，又符合现代汉语圣经文体。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来语四字神名的常见学术拟音译出其专名性质，不以“主”这一称号替代。
- source_word: הָיָה ... אֶל
  choice: 临到
  rationale: 该结构在先知蒙受启示的公式中表示神的话来到先知；“临到”自然、庄重，也明确耶利米是启示的领受者。
- source_word: אֶל עֵילָם
  choice: 关于以拦
  rationale: אֶל在针对列国的神谕标题中可表示神谕所涉及或所指向的对象；正文采用较中性的“关于”，避免在标题中提前将其限定为敌对宣告。
- source_word: בְּרֵאשִׁית מַלְכוּת
  choice: 执政初期
  rationale: מַלְכוּת在此指君王统治的时期；“执政初期”准确表达时间范围，并符合现代汉语习惯。
- source_word: צִדְקִיָּה מֶלֶךְ יְהוּדָה
  choice: 犹大王西底家
  rationale: 采用现代汉语常用的身份在前、姓名在后的表达，完整保留其王位与所属国。
- source_word: לֵאמֹר
  choice: 说：
  rationale: 该不定式引出下一节的直接神谕；以“说：”并加冒号清楚承接后文。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用以色列上帝的四字神名。译作“雅威”旨在保留专名，并采用较接近YHWH通常复原读音的现代汉语音译；不以称号“主”取代。
- issue: אֶל עֵילָם所表达的神谕方向
  choice: 关于以拦
  alternative: 攻击以拦；针对以拦
  rationale: 介词אֶל在列国神谕标题中既可中性地指“关于”，也可依审判语境理解为“针对”。正文保留中性表达，并在脚注说明敌对方向的可能性，以保存原文张力。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“雅威的话临到……”保留先知书标题的传统庄严感；调整为汉语自然语序，将时间状语置于句首，并用“是关于……”清楚标明神谕主题。
