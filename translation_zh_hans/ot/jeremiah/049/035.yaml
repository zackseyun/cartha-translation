  text: כֹּ֤ה אָמַר֙ יְהוָ֣ה צְבָא֔וֹת הִנְ/נִ֥י שֹׁבֵ֖ר אֶת קֶ֣שֶׁת עֵילָ֑ם רֵאשִׁ֖ית גְּבוּרָתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/035.yaml
  text: 'Thus says Yahweh of hosts: Behold[a], I am breaking the bow of Elam, the chief of their might.'
translation:
  language: zh_hans
  text: 万军之耶和华如此说：“看哪，我必折断以拦的弓，就是他们力量的首要部分[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “他们力量的首要部分”也可译作“他们实力中最强的部分”或“他们武力的主要支柱”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה
  choice: 如此
  rationale: 这是先知宣告中引出神谕的惯用语；“如此说”庄重自然，并保留原文句式。
- source_word: יְהוָה צְבָאוֹת
  choice: 万军之耶和华
  rationale: “耶和华”按现代汉语圣经传统音译神的专名；“万军之”保留 צְבָאוֹת 的广泛含义及该复合称号的庄重语感。
- source_word: הִנְנִי
  choice: 看哪，我必
  rationale: “看哪”保留引人注意和强调神亲自行动的作用；与后面的分词合译为“我必折断”，自然表达行动的迫近与确定。
- source_word: שֹׁבֵר
  choice: 折断
  rationale: 该分词在 הִנְנִי 之后表示神即将并确定施行的行动；弓可被“折断”，既贴近字义，也符合汉语搭配。
- source_word: קֶשֶׁת עֵילָם
  choice: 以拦的弓
  rationale: 保留单数的具体军事意象，不把其象征的军事实力直接写入正文。
- source_word: רֵאשִׁית גְּבוּרָתָם
  choice: 他们力量的首要部分
  rationale: רֵאשִׁית 在此说明弓是以拦力量中居首要地位的部分；此译保留“首要部分”与“主要依靠”之间的语义张力，避免过度解释。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。中文正文采用广为人知的传统音译“耶和华”，将其作为专名而非用“主”替代；“雅威”是较接近学术重构读音的另一种音译。
- issue: 弓与以拦军力的关系
  choice: 保留同位说明：“就是他们力量的首要部分”
  alternative: 译为“他们武力的主要支柱”
  rationale: 原文既可指弓是其力量中最重要的部分，也可引申为其军力的主要依靠。正文保留较贴近词形的说法，不把隐喻完全释明。
translation_notes:
  register: 采用现代、庄重且易懂的先知宣告体。“万军之耶和华如此说”保留传统经文节奏；“看哪”保存原文的强调语气。正文中的脚注标记紧接相关短语之后。
