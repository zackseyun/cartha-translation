  text: כִּֽי הִנֵּ֥ה קָטֹ֛ן נְתַתִּ֖י/ךָ בַּ/גּוֹיִ֑ם בָּז֖וּי בָּ/אָדָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/015.yaml
  text: For look, I have made you small among the nations, despised among men.
translation:
  language: zh_hans
  text: 看哪，我已使你在列国中成为微小，在世人中受藐视。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי הִנֵּה
  choice: 看哪
  rationale: הִנֵּה是引人注意的宣告语，译作“看哪”庄重而简洁；כִּי在此与其连用，承接上文并加强宣告，不宜机械另译为“因为”。
- source_word: קָטֹן
  choice: 弱小
  rationale: 该词可指“小、微不足道、地位低微”；语境涉及以东在列国中的卑微处境，“弱小”兼顾势力与地位，且避免误解为仅指体量小。
- source_word: נְתַתִּיךָ
  choice: 我使你……成为
  rationale: נתן在此为带宾语补语的使役性用法，直译“我把你置为弱小”不自然，故译作“使你成为弱小”。
- source_word: בָּזוּי
  choice: 被人藐视
  rationale: 被动分词表示受轻看、受鄙弃的状态；译作“被人藐视”保留其被动含义。
- source_word: בָּאָדָם
  choice: 在世人中
  rationale: אָדָם此处是集合性的人类称谓，与“列国中”平行；“世人”自然表达广泛的人群，而非限定男性。
theological_decisions:
- issue: 上帝行动与以东卑微地位的关系
  choice: 保留第一人称主动表达“我使你……成为”
  alternative: 译作状态性的“你在列国中很弱小”
  rationale: 希伯来文明确以说话者为主语，用完成式נְתַתִּיךָ陈述其行动；不应弱化为单纯现状描述。
- issue: 完成式所表达的时间与确定性
  choice: 译为“我使你……成为”
  alternative: “我要使你……成为”
  rationale: 原文使用完成式，可指已经施行或以确定发生的方式宣告；本节单独成句时宜保留完成式的直接陈述，不擅自限定为纯将来。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“看哪”保留先知宣告的修辞力度；句式维持“在列国中／在世人中”的平行结构。
