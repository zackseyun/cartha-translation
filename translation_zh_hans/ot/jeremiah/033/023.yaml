  text: וַֽ/יְהִי֙ דְּבַר יְהוָ֔ה אֶֽל יִרְמְיָ֖הוּ לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/033/023.yaml
  text: And the word of Yahweh came to Jeremiah[a], saying,
translation:
  language: zh_hans
  text: 雅威的话临到耶利米，说：
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: 临到
  rationale: 这里是先知叙事中常见的承接表达，与“话”合译为“话临到”，既准确表达事件的发生，也符合现代汉语圣经语体。
- source_word: דְּבַר
  choice: 话
  rationale: 在“耶和华的话”这一先知公式中，“话”直接保留神圣言说和启示的分量；“信息”虽可理解，但解释性更强。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 这是四字神名יהוה；“耶和华”是现代中文读者最熟悉的专名形式，并在正文中将其作为名字而非普通称号处理。
- source_word: אֶל
  choice: 临到
  rationale: 该介词标明神的话所达到的对象；在汉语固定搭配“话临到某人”中自然融入谓语。
- source_word: יִרְמְיָהוּ
  choice: 耶利米
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: לֵאמֹר
  choice: 说
  rationale: 该不定式引出随后直接宣告的内容；译作“说”简洁自然，并保留引语导入功能。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文明确使用四字神名。正文采用中文最通行且易于普通读者识别的专名“耶和华”，不以“主”这一称号替代；“雅威”是较接近学界常见拟音的另一译法。
translation_notes:
  register: 采用庄重而自然的现代标准汉语，并保留先知书中惯用的启示公式“耶和华的话临到……说”。本节不需脚注；英文层的脚注内容实际说明的是神名יהוה，而其标记位置似附在人名Jeremiah之后，故未照搬该错位标记。
