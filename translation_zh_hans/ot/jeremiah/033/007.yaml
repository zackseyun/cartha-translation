  text: וַ/הֲשִֽׁבֹתִי֙ אֶת שְׁב֣וּת יְהוּדָ֔ה וְ/אֵ֖ת שְׁב֣וּת יִשְׂרָאֵ֑ל וּ/בְנִתִ֖י/ם כְּ/בָ/רִֽאשֹׁנָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/033/007.yaml
  text: And I will restore the fortunes of Judah and the fortunes of Israel[a], and I will rebuild them as at the first.
translation:
  language: zh_hans
  text: 我要复兴犹大和以色列[a]，重建他们，如同起初一样。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“我要恢复犹大和以色列被掳的境况”，或“使犹大和以色列被掳的人归回”。
    reason: 保留“使恢复／归回”与 שְׁבוּת 构成的惯用语所含的被掳、归回意象，同时正文以“复兴”表达其较广的整体恢复含义。
lexical_decisions:
- source_word: וַהֲשִׁבֹתִי
  choice: 我要使……重得
  rationale: 这是שׁוב的使役式，与שְׁבוּת构成恢复性表达，表示使先前失去的境况得到扭转；“使……重得”既体现使役含义，也符合现代汉语表达。
- source_word: שְׁבוּת
  choice: 福分
  rationale: 在הֵשִׁיב שְׁבוּת这一惯用语中，此词可广指命运或景况的复兴，不必局限于被掳者的地理归回。“重得福分”自然地表达全面恢复，同时以脚注保留“被掳归回”的字面可能。
- source_word: יְהוּדָה
  choice: 犹大
  rationale: 采用现代中文圣经及历史文献中通行的专名译法。
- source_word: יִשְׂרָאֵל
  choice: 以色列
  rationale: 采用现代中文通行的专名译法；本节与“犹大”并列，指向整个立约群体。
- source_word: וּבְנִתִים
  choice: 重新建立他们
  rationale: בנה可指建造或重建；在灾后复兴的语境中，“重新建立”体现恢复之意。复数宾语后缀指前述犹大和以色列，中文保留“他们”而不擅自把所指限定为城邑。
- source_word: כְּבָרִאשֹׁנָה
  choice: 像起初一样
  rationale: 该短语将未来的恢复与先前或原初的状态相比；“像起初一样”保留比较意味，语言庄重而自然。
theological_decisions:
- issue: 复兴预言中שְׁבוּת的范围
  choice: 重得福分
  alternative: 使被掳者归回／使被掳的景况逆转
  rationale: 该惯用语可涵盖民族整体的复兴，而不仅是返回故土；正文采用较宽广的表达，脚注则保留与被掳处境直接相关的字面理解，避免排除任何一层含义。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“重得福分”避免生硬的“恢复命运”，又保留全面复兴的正面含义；“重新建立他们”忠实保留复数宾语所指，不把对象缩窄为城市或建筑。脚注标记[a]已置于正文相应位置。
