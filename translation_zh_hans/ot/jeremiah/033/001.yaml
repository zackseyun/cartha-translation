source:
  edition: WLC
  text: וַ/יְהִ֧י דְבַר יְהוָ֛ה אֶֽל יִרְמְיָ֖הוּ שֵׁנִ֑ית וְ/הוּא֙ עוֹדֶ֣/נּוּ עָצ֔וּר בַּ/חֲצַ֥ר הַ/מַּטָּרָ֖ה לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/033/001.yaml
  text: And the word of Yahweh came to Jeremiah a second time while he was still confined in the court of the guard[a], saying,
translation:
  language: zh_hans
  text: 耶和华的话第二次临到耶利米。那时，他仍被拘禁在护卫兵的院中[a]。耶和华说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“监狱的院子”。原文可能指有人看守、用于拘押的院落，或护卫所的围院。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי דְבַר יְהוָה
  choice: 耶和华的话……临到
  rationale: 采用先知书中自然且庄重的启示公式；不生硬直译 וַיְהִי，同时保留“话”的形式与神学分量。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的专名形式表达四字神名，区别于作为称号的“主”。
- source_word: שֵׁנִית
  choice: 第二次
  rationale: 明确保留原文所指的次数，比“再次”更精确。
- source_word: וְהוּא עוֹדֶנּוּ עָצוּר
  choice: 那时，他仍被拘禁
  rationale: 以时间状语自然表达伴随情境；“拘禁”保留受限制、被看管之意，又不武断界定其法律身份。
- source_word: בַּחֲצַר הַמַּטָּרָה
  choice: 在护卫院中
  rationale: חָצֵר 指院落，מַטָּרָה 在此指与看守、拘押有关的场所；“护卫院”简洁保留制度性场景。
- source_word: לֵאמֹר
  choice: 耶和华说
  rationale: 按现代汉语将引语公式转换为明确的发言引介，避免句末“说”显得生硬；主语由前文清楚补出。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用神的专名而非一般称号；“耶和华”是现代简体中文圣经语境中最通行、最易识别的专名形式，同时不将其替换为“主”。
- issue: דְבַר יְהוָה 的表达
  choice: 耶和华的话
  alternative: 耶和华的信息
  rationale: “话”直接保留先知启示公式的形式和神学张力，不把它解释性地缩减为一般“信息”。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。为避免中文长句拖沓，将原文单句分为两句；结尾以“耶和华说”承接下一节的直接引语。
