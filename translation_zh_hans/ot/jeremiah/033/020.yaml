base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/033/020.yaml
  text: 'Thus says Yahweh: If you can break my covenant with the day and my covenant with the night[a], so that day and night will not be at their appointed time[b],'
translation:
  language: zh_hans
  text: 耶和华如此说：“如果你们能废掉我与白日所立的约和我与黑夜所立的约[a]，使白日和黑夜不在各自的定时出现[b]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“如果你们废掉我与白日所立的约和我与黑夜所立的约。”希伯来文的条件句没有明说“能”；正文根据上下文表达其不可能条件的修辞意味。
    reason: lexical_alternative
  - marker: b
    text: 或译：“使白日和黑夜不在各自的定时存在。”
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  choice: 耶和华如此说
  rationale: 保留先知书典型的使者宣告格式，并直接译出神名。
- source_word: אִם תָּפֵרוּ
  choice: 如果你们能废掉
  rationale: הפר 的使役词干在约的语境中指废除、破坏；加入“能”体现上下文中反问式的不可能条件，同时以脚注保留更形式对应的译法。
- source_word: בְּרִיתִי
  choice: 我的约
  rationale: “约”是现代汉语圣经语境中自然且准确的 ברית 对应词，也保留其盟约含义。
- source_word: הַיּוֹם / הַלָּיְלָה
  choice: 白日／黑夜
  rationale: 二者平行，指受造秩序中规律交替的昼夜；“白日、黑夜”在此比单用“日、夜”更清楚。
- source_word: וּלְבִלְתִּי הֱיוֹת יוֹמָם וָלַיְלָה
  choice: 使白日和黑夜不……出现
  rationale: 希伯来文直译为“不再有白日和黑夜”；“出现”在汉语中自然表达昼夜按时发生，脚注保留存在句式。
- source_word: בְּעִתָּם
  choice: 按各自指定的时间
  rationale: 后缀为复数“它们的”，分别指白日与黑夜；עֵת 表示规定或合宜的时间。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: “耶和华”是现代简体中文读者最熟悉的专名形式，明确呈现四字神名，而不是以“主”替代；不据此引入额外神学解释。
- issue: 条件句 אִם תָּפֵרוּ 的语气
  choice: 如果你们能废掉
  alternative: 如果你们废掉
  rationale: 上下文以人无法破坏昼夜秩序来强调应许的可靠性；“能”自然呈现这一修辞力量，但脚注保留希伯来文较形式化的条件句。
- issue: “我与白日／黑夜所立的约”的受造秩序意象
  choice: 保留“约”的拟人化表达
  alternative: 意译为“我为昼夜所定的规律”
  rationale: 原文明确重复 בְּרִיתִי，保留“约”可维持本段将受造秩序与上帝应许相互类比的神学张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“耶和华如此说”保留先知宣告的正式语体；“废掉……约”较“打破”更符合现代汉语搭配。经文在后句尚未结束，末尾保留逗号，以衔接下一节。
