base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/033/006.yaml
  text: Behold[a], I am bringing her healing and cure, and I will heal them, and I will reveal to them an abundance of peace and truth.
translation:
  language: zh_hans
  text: 看哪，我要给她带来医治和痊愈；我要医治他们，并向他们显明丰盛的平安与真实。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “真实”或译“信实”或“可靠”；原文一词可表示真实、可靠或信实。
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנְנִי
  choice: 看哪，我要
  rationale: הִנְנִי用于庄严宣告；“看哪”保留先知话语的郑重语气，“我要”结合后面的分词表达即将施行的神圣行动。
- source_word: מַעֲלֶה לָּהּ אֲרֻכָה וּמַרְפֵּא
  choice: 使她的伤口愈合，使她得医治
  rationale: מַעֲלֶה为使役分词，אֲרֻכָה与מַרְפֵּא是关于创伤复原和医治的近义词组。此译保留医疗意象及两个词的并列，又避免生硬直译。
- source_word: לָּהּ
  choice: 她
  rationale: 阴性单数代词指拟人化的耶路撒冷城或共同体；保留“她”以呈现原文形象。
- source_word: וּרְפָאתִים
  choice: 我要医治他们
  rationale: 原文从阴性单数的城转为阳性复数的居民或百姓；中文保留这一代词变化。完成式在先知性应许中具有将来指向。
- source_word: וְגִלֵּיתִי
  choice: 并向他们显明
  rationale: גלה在此表示揭示、显露；因宾语是抽象的“丰盛的平安与信实”，“显明”自然且庄重。
- source_word: עֲתֶרֶת
  choice: 丰盛的
  rationale: 该名词表示丰富、充盈，而非“冠冕”；中文用“丰盛的”清楚表达其程度。
- source_word: שָׁלוֹם
  choice: 平安
  rationale: שָׁלוֹם涵盖和平、安康与完整；“平安”既是自然的圣经语体，也保留较宽的福祉含义。
- source_word: וֶאֱמֶת
  choice: 信实
  rationale: אֱמֶת可指真实、可靠或信实。与“平安”并列且由上帝向百姓显明时，“信实”在现代中文中更自然；脚注保留“真实”的可能译法。
theological_decisions:
- issue: 阴性单数与复数指称的转换
  choice: 先以“她”指拟人化的城，后以“他们”指城中的百姓。
  alternative: 将两处代词统一处理为同一共同体，以使中文更平顺。
  rationale: 原文明确从לָּהּ的阴性单数转到־ם的复数。保留转换可维持城与居民之间的群体—个体张力。
- issue: אֱמֶת的语义范围
  choice: 正文译作“信实”。
  alternative: 真实；真理；可靠。
  rationale: 该词在这里既可能强调真实，也可能强调可靠、信实。正文选择与应许语境相称的“信实”，同时用脚注保存“真实”这一可行理解，不把歧义完全消解。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“看哪”保留先知宣告的力度；“伤口愈合、得医治”呈现原文成对的医疗意象。刻意保留“她”到“他们”的转换。
