  yaml_path: translation/ot/jeremiah/033/019.yaml
  text: And the word of Yahweh came to Jeremiah, saying,
translation:
  language: zh_hans
  text: 雅威的话临到耶利米，说：
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: 又临到
  rationale: וַיְהִי在这里引出叙事中的下一次启示；结合“耶和华的话”，汉语用“又临到”自然表达承接和发生之意。
- source_word: דְּבַר
  choice: 话
  rationale: 在先知书固定表达דְּבַר יְהוָה中译作“耶和华的话”，既保留启示公式，也符合现代中文圣经语体。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文读者熟悉的神名固定译法“耶和华”，将其作为专名呈现，而不改译为称号。
- source_word: אֶל
  choice: 临到
  rationale: 该介词标明神谕的领受者；在中文启示公式中与动词合译为“临到耶利米”最自然。
- source_word: יִרְמְיָהוּ
  choice: 耶利米
  rationale: 采用该先知名字在现代简体中文中的通行译名。
- source_word: לֵאמֹר
  choice: 说
  rationale: 该不定式用于引出下文直接引语；译作“说”简洁自然，并保留下文即将出现神谕的功能。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用四字神名。中文正文采用广为人知且可辨识为专名的“耶和华”；“雅威”更接近一种学术重构读音，但在普通现代中文读者中通行度较低。
translation_notes:
  register: 采用自然、庄重而简洁的现代标准汉语，并保留先知书反复出现的启示公式。“又”承接前文，“说”引出下一节的直接话语。
