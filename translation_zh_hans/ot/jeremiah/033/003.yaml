  to: 你要呼求我，我必回应你；我要把伟大而隐秘的事[a]告诉你，就是你从未知道的事。
  rationale: 修订明确原文的祈使和应许语气，并以现代汉语中更自然的“隐秘的事”呈现启示语境下的主要意思。脚注保留该希伯来词“难以接近／坚固设防”的词汇张力及解释空间。
