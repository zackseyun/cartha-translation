base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/033/003.yaml
  text: Call to me[a], and I will answer you, and I will tell you great and hidden things that you have not known.
translation:
  language: zh_hans
  text: 你要呼求我，我必回应你；我要把伟大而隐秘的事[a]告诉你，就是你从未知道的事。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“无法接近的事”；也可按字面译为“坚固设防的事”。该词指人通常无法获得或知晓的事。
    reason: lexical_alternative
lexical_decisions:
- source_word: קְרָא אֵלַי
  choice: 你呼求我
  rationale: 祈使式 קְרָא 在这里是直接召唤耶利米向上帝呼求；“呼求我”自然、庄重，也保留了动作的指向。
- source_word: וְאֶעֱנֶךָ
  choice: 我就应允你
  rationale: ענה 在此表示回答或回应。“应允”符合向上帝呼求的语境，同时没有具体规定回应的方式或内容。
- source_word: וְאַגִּידָה לְּךָ
  choice: 我要……告诉你
  rationale: נגד 的使役形表示告诉、宣告或使人知道；“告诉你”清楚而直接，保留了上帝亲自启示的语气。
- source_word: גְּדֹלוֹת
  choice: 伟大……的事
  rationale: 阴性复数形容词在此作名词用，泛指重大的事；“伟大的事”保留其宽泛范围。
- source_word: וּבְצֻרוֹת
  choice: 而难以企及的事
  rationale: בצר 可指设防、隔绝或不可接近之物。“难以企及”保留受阻、不能凭通常途径接触的意象，比单纯译作“隐藏”更贴近该词的具体语义。
- source_word: לֹא יְדַעְתָּם
  choice: 就是你从未知道的事
  rationale: 完成式第二人称阳性单数配第三人称阳性复数后缀，指受话者此前未曾知道的那些事；“从未知道”自然表达这种既往未知。
theological_decisions:
- issue: וּבְצֻרוֹת 在上帝启示语境中的语义
  choice: 正文译为“难以企及的事”
  alternative: “隐藏的事”或“坚固设防的事”
  rationale: 原词的核心意象涉及设防、隔绝和无法接近；上下文则表明，这些事唯有上帝告知才可知道。正文保留“难以企及”的张力，脚注列出较字面的意象和语境化译法，避免把它仅解释为抽象的奥秘。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“你”与希伯来文阳性单数受话形式一致；分号呈现呼求与应允、启示之间的平行推进。
