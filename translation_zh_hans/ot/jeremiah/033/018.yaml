  text: וְ/לַ/כֹּהֲנִים֙ הַ/לְוִיִּ֔ם לֹֽא יִכָּרֵ֥ת אִ֖ישׁ מִ/לְּ/פָנָ֑/י מַעֲלֶ֨ה עוֹלָ֜ה וּ/מַקְטִ֥יר מִנְחָ֛ה וְ/עֹ֥שֶׂה זֶּ֖בַח כָּל הַ/יָּמִֽים־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/033/018.yaml
  text: And the Levitical priests will never lack a man before me to offer burnt offerings, burn grain offerings, and make sacrifices continually[a].
translation:
  language: zh_hans
  text: 利未祭司也永不会缺少人在我面前献燔祭、焚烧素祭和献祭，持续不断[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 耶利米书33:14–26在古代希腊文《耶利米书》中没有出现。
    reason: textual_variant
lexical_decisions:
- source_word: וְלַכֹּהֲנִים הַלְוִיִּם
  choice: 利未祭司……也
  rationale: 前缀介词引出承受应许的群体；中文用主题结构自然表达，并以“也”承接上一节关于大卫家的平行应许。
- source_word: לֹא יִכָּרֵת אִישׁ
  choice: 永不会少了人
  rationale: 这里的习语表示祭司群体不会缺少履行职分的代表，并非保证某一个人永不被剪除；“永不会少了人”保留群体延续之意。
- source_word: מִלְּפָנָי
  choice: 在我面前
  rationale: 表示在上帝面前供职；省去希伯来语中不宜直译的来源介词，更合现代汉语。
- source_word: מַעֲלֶה עוֹלָה
  choice: 献燔祭
  rationale: 分词描述该祭司持续履行的职能；“献燔祭”准确而简洁。
- source_word: וּמַקְטִיר מִנְחָה
  choice: 焚烧素祭
  rationale: קטיר指使祭物在坛上焚烧冒烟；“焚烧”保留其具体动作，מִנְחָה在祭祀语境中译为“素祭”。
- source_word: וְעֹשֶׂה זֶּבַח
  choice: 并……献祭
  rationale: עשה זבח是举行、献上祭牲的常用表达；现代汉语以“献祭”最自然，不强加特定祭类。
- source_word: כָּל הַיָּמִים
  choice: 日日
  rationale: 表达持续不断、历久不绝的祭司服事，同时保留原文“所有日子”的时间意象。
theological_decisions:
- issue: כרת在祭司延续应许中应按字面译为“被剪除”，还是按习语译为“不缺少”
  choice: 永不会少了人
  alternative: 必不断有人／不会有人从我面前被剪除
  rationale: 句子的主旨是利未祭司群体持续有代表在上帝面前供职。按习语翻译避免误解为某个祭司个体永不死亡，同时仍保留应许的永久性。
- issue: הַכֹּהֲנִים הַלְוִיִּם的群体身份
  choice: 利未祭司
  alternative: 祭司利未人／祭司，就是利未人
  rationale: “利未祭司”既保留两个名词的关联，也不预设更狭窄的宗派性祭司制度解释。
- issue: 祭祀分词所表达的持续职分
  choice: 以“献……、焚烧……、献……”描述不会缺少之人的职能
  alternative: 译作目的结构“为要献……”
  rationale: 希伯来语三个分词描写该人的祭司活动；中文直接串联动作，既自然，也避免把它们误解成“不缺少人”的目的或结果。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“燔祭”“素祭”沿用普通中文圣经读者熟悉的祭祀术语；“日日”简洁表达持续性。脚注只说明重要的古译本文本差异，不据此裁定经文真伪。
