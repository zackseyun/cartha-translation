revisions:
- from: 利未祭司在我面前也永不会少了人献燔祭、焚烧素祭，并日日献祭[a]。
  to: 利未祭司也永不会缺少人在我面前献燔祭、焚烧素祭和献祭，持续不断[a]。
  rationale: 修订仅调整汉语语序并将时间短语改为“持续不断”。这使“不缺少人”的习语、该人的祭司职能，以及原文的持续时间更清楚自然；不改变其群体延续的含义，也不对文本变体作超出脚注的判断。
