base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/033/017.yaml
  text: 'For thus says Yahweh: David shall never lack a man to sit on the throne of the house of Israel[a][b].'
translation:
  language: zh_hans
  text: 因为耶和华如此说：“大卫必不断绝有一人坐在以色列家的宝座上。”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“必不给大卫断绝一人坐在以色列家的宝座上。”
    reason: lexical_alternative
  - marker: b
    text: 也可简译为“坐在以色列的宝座上”。希伯来文作“以色列家”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 在上下文中引出支撑前述应许的理由；“因为”自然表达这一承接关系。
- source_word: כֹה אָמַר יְהוָה
  choice: 耶和华如此说
  rationale: 保留先知宣告的使者公式，并以“耶和华”音译神的专名。
- source_word: לֹא יִכָּרֵת לְדָוִד
  choice: 大卫永不断有人
  rationale: כרת 的尼法勒形式本义为“被剪除、断绝”，但此处与间接受词和“人”连用，表达大卫不会没有继承王位之人；“永不断有人”既自然，也保留“断绝”的词义意象。
- source_word: אִישׁ יֹשֵׁב
  choice: 有人坐
  rationale: אִישׁ 是单数阳性“人、男子”，分词 יֹשֵׁב 描写其持续承担王权职分；汉语用“有人坐”简洁自然，且不额外限定为“后裔”。
- source_word: עַל כִּסֵּא
  choice: 坐在……宝座上
  rationale: 按王权语境将 כִּסֵּא 译为“宝座”，介词 עַל 译作“在……上”。
- source_word: בֵית יִשְׂרָאֵל
  choice: 以色列家
  rationale: 直译该结构短语，保留其民族与盟约群体意味，而不简化为“以色列”。
theological_decisions:
- issue: 赐给大卫的王朝应许
  choice: 译文表达大卫将持续有人坐上以色列家的宝座，但不说明这一应许实现的具体历史或弥赛亚机制。
  alternative: 可将其解释为纯粹指近期历史中的王位延续，或专指最终一位大卫后裔弥赛亚。
  rationale: 希伯来文本本身采用王朝延续的表述；译文保留这种神学张力，不把经文限定为某一种实现方式。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“大卫永不断有人”较贴近原文“不断绝”的意象，同时在汉语中清楚表达王位继承不断；“以色列家”有意保留原文的盟约群体称谓。
