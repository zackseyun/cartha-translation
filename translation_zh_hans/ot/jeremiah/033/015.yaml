base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/033/015.yaml
  text: In those days and at that time I will cause a righteous Branch to sprout for David[b][a], and he will execute justice and righteousness in the land.
translation:
  language: zh_hans
  text: 在那些日子和那时候，我必为大卫使一根公义的枝子生长出来[b][a]；他必在这地施行公平和公义。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“一根公义之枝”；也可理解为“一根公正的枝子”。
    reason: lexical_alternative
  - marker: b
    text: “枝子”很可能呼应耶利米书23:5所应许的那位大卫后裔君王。
    reason: cross_reference
lexical_decisions:
- source_word: בַּיָּמִים הָהֵם וּבָעֵת הַהִיא
  choice: 在那些日子、那时候
  rationale: 保留原文两个并列的时间短语，同时用自然、庄重的现代汉语表达。
- source_word: אַצְמִיחַ
  choice: 我必使……发芽
  rationale: 体现צמח使役式的含义，并保留植物生长的意象，避免释义为“兴起”。
- source_word: לְדָוִד
  choice: 为大卫
  rationale: 直接保留介词ל的受益或关联含义，不擅自扩写为“大卫家”。
- source_word: צֶמַח צְדָקָה
  choice: 一根公义的枝子
  rationale: 以“枝子”保留植物隐喻及可能的王室称谓意味；“公义的”是自然的定语表达，同时在脚注中保留“公义之枝”等结构上的可能性。
- source_word: וְעָשָׂה
  choice: 他必……施行
  rationale: 在预言语境中承接未来应许；“施行”适合与“公平和公义”搭配。
- source_word: מִשְׁפָּט וּצְדָקָה
  choice: 公平和公义
  rationale: 区分两个并列词：מִשְׁפָּט侧重公正判断与治理，צְדָקָה侧重合乎正义；该搭配也符合庄重的现代汉语。
- source_word: בָּאָרֶץ
  choice: 在这地
  rationale: 定冠词所指在本语境中较自然地理解为应许之地，而非泛指全世界；“这地”简洁并符合先知书语体。
theological_decisions:
- issue: “枝子”的弥赛亚及王室称谓意味
  choice: 正文保留“枝子”，以脚注指出与耶利米书23:5所应许的大卫后裔君王相呼应。
  alternative: 仅按普通植物意象译作“嫩芽”，或直接释义为“君王”。
  rationale: 原文צֶמַח既是植物隐喻，在耶利米书语境中又很可能指大卫家的应许君王；保留隐喻并以互文脚注说明，可避免过度解释。
- issue: וְעָשָׂה的时态
  choice: 译作未来意义“他必……施行”。
  alternative: 形式化地译成过去式“他施行了”。
  rationale: 该动词在预言话语中延续前面的未来应许，现代汉语用“必”能准确传达语境意义。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“发芽”刻意保留原文使役动词与“枝子”之间的植物意象；脚注标记按正文相关词后的既定次序置为[b][a]。
