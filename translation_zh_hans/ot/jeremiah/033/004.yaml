  text: כִּי֩ כֹ֨ה אָמַ֤ר יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל עַל בָּתֵּי֙ הָ/עִ֣יר הַ/זֹּ֔את וְ/עַל בָּתֵּ֖י מַלְכֵ֣י יְהוּדָ֑ה הַ/נְּתֻצִ֕ים אֶל הַ/סֹּלְל֖וֹת וְ/אֶל הֶ/חָֽרֶב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/033/004.yaml
  text: 'For thus says Yahweh, the God of Israel, concerning the houses of this city and the houses of the kings of Judah that are being torn down for the siege ramps and for the sword:'
translation:
  language: zh_hans
  text: 因为以色列的神雅威如此说，论到这城的房屋和犹大诸王的房屋[a]，就是那些为抵挡攻城坡[b]和刀剑[c]而拆毁的房屋：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“犹大诸王的宫殿”。
    reason: lexical_alternative
  - marker: b
    text: 或译“攻城土堆”或“攻城工事”。
    reason: lexical_alternative
  - marker: c
    text: “刀剑”是希伯来文的形象说法，可指战争或杀戮。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，为接下来的话提供解释，保留原文的因果或说明作用。
- source_word: כֹה אָמַר
  choice: 如此说
  rationale: 保留先知信息中固定的传信公式，同时符合庄重的现代汉语表达。
- source_word: יְהוָה
  choice: 雅威
  rationale: 直接音译四字神名，保留其作为以色列之神专名的作用。
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: 以色列的神
  rationale: 按原文附属结构直译，清楚自然。
- source_word: עַל
  choice: 论到
  rationale: 此处引出神谕所涉及的对象，而非表达敌对方向。
- source_word: בָּתֵּי הָעִיר הַזֹּאת
  choice: 这城的房屋
  rationale: 贴近原文结构；上下文所指是耶路撒冷，但本节没有明说城名。
- source_word: בָּתֵּי מַלְכֵי יְהוּדָה
  choice: 犹大诸王的房屋
  rationale: 保留与前一短语中“房屋”的词语重复；王室语境下也可能指宫殿，列入脚注。
- source_word: הַנְּתֻצִים
  choice: 拆毁的
  rationale: 被动分词可描述正遭拆除或处于已拆毁状态的房屋；汉语“拆毁的”不强行限定过程阶段。
- source_word: אֶל
  choice: 为抵挡
  rationale: 结合围城语境，将房屋拆毁理解为应对攻城设施和战事之举；原介词的方向性在此具有功能或目的意味。
- source_word: הַסֹּלְלוֹת
  choice: 攻城坡
  rationale: 指围城军队堆筑、用于进攻城墙的土坡或斜坡，表达具体且易懂。
- source_word: הֶחָרֶב
  choice: 刀剑
  rationale: 保留希伯来文以武器代指战争或杀戮的形象，不将其直接释为“战争”。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；正文采用较贴近学界常见重构读音的“雅威”，避免以称号取代专名。
- issue: “刀剑”的指涉范围
  choice: 保留“刀剑”的形象
  alternative: 译作“战争”或“杀戮”
  rationale: 此处可能借刀剑转指战争、攻击或杀戮；直译可保留原文意象及其语义张力，并以脚注说明。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。保留先知传信公式和“房屋”的词语重复；用“就是那些……”理顺原文较长的修饰结构，并以冒号表明神谕将在下一节继续。
