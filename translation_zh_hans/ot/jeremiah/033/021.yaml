revisions:
- from: 那么，我与我仆人大卫所立的约也能被废弃，使他没有儿子坐在他的宝座上作王；我与利未祭司[a]——事奉我的人——所立的约也同样能被废弃。
  to: 那么，我与我仆人大卫所立的约也可被废除，以致不再有儿子坐在他的宝座上作王；以及我与利未祭司[a]——事奉我的人——所立的约。
  rationale: 修订将“不再有儿子……作王”作为约被废除的明确结果，避免误解为大卫没有儿子；并将与利未祭司所立的约恢复为共享前述谓语的并列对象，更贴近希伯来语句法和本段不可能条件的论证。脚注改以较字面的并列形式呈现原文构造。
