source:
  edition: WLC
  text: גַּם בְּרִיתִ֤/י תֻפַר֙ אֶת דָּוִ֣ד עַבְדִּ֔/י מִ/הְיֽוֹת ל֥/וֹ בֵ֖ן מֹלֵ֣ךְ עַל כִּסְא֑/וֹ וְ/אֶת הַ/לְוִיִּ֥ם הַ/כֹּהֲנִ֖ים מְשָׁרְתָֽ/י־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/033/021.yaml
  text: then my covenant with David my servant may also be broken[a], so that he would not have a son reigning on his throne, and with the Levitical priests, my ministers.
translation:
  language: zh_hans
  text: 那么，我与我仆人大卫所立的约也可被废除，以致不再有儿子坐在他的宝座上作王；以及我与利未祭司[a]——事奉我的人——所立的约。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或较直译为“利未人，祭司，就是事奉我的人”。
    reason: 保留הַלְוִיִּם הַכֹּהֲנִים מְשָׁרְתָי可能呈现的并列或同位结构，避免将“利未人”与“祭司”作不加限定的完全等同。
lexical_decisions:
- source_word: גַּם
  choice: 那么……也
  rationale: 承接上一节不可能实现的条件，并保留“也”的附加、对应作用。
- source_word: בְּרִיתִי
  choice: 我……所立的约
  rationale: “约”保留בְּרִית的法律与神学分量；汉语用“与……所立的约”自然表达关系。
- source_word: תֻפַר
  choice: 能被废弃
  rationale: 该词是פרר的Hophal形式，表示约被破坏、废除或使之失效；“被废弃”保留被动语态和立约语境。
- source_word: אֶת דָּוִד עַבְדִּי
  choice: 与我仆人大卫
  rationale: 在“约”的语境中，אֶת表示立约关系；“我仆人”作为大卫的立约称号予以保留。
- source_word: מִהְיוֹת לוֹ
  choice: 使他没有
  rationale: מִן加不定式在此表达结果：若约被废弃，结果便是大卫不再有承继王位的儿子。
- source_word: בֵן
  choice: 儿子
  rationale: 直译具体的阳性亲属称谓，不先行抽象化为“后裔”或“继承人”，从而保留王朝应许的原文措辞。
- source_word: מֹלֵךְ עַל כִּסְאוֹ
  choice: 坐在他的宝座上作王
  rationale: 用现代汉语的王权惯用表达传达分词所表示的持续掌权状态。
- source_word: הַלְוִיִּם הַכֹּהֲנִים
  choice: 利未祭司
  rationale: 简洁表达“属于利未支派的祭司”；原文也可按同位结构直译，故在脚注中保留。
- source_word: מְשָׁרְתָי
  choice: 事奉我的人
  rationale: שרת在此指向上帝履行礼仪职分；“事奉我的人”比泛称“仆人”更准确，也比“我的执事”更自然。
theological_decisions:
- issue: 大卫王朝的应许
  choice: 保留“儿子坐在他的宝座上作王”的具体措辞
  alternative: 译作“后裔继承他的王位”
  rationale: 原文使用“儿子”及“宝座”的具体王朝语言；不在本节中预先将其抽象化或加入后来的弥赛亚解释。
- issue: 利未祭司群体的界定
  choice: 正文译作“利未祭司”，脚注保留同位结构
  alternative: 译作“利未人，就是祭司”
  rationale: 前者符合现代汉语并清楚指向利未支派中的祭司群体；脚注保留希伯来语结构本身可能呈现的同位关系。
- issue: 第二个约及谓语的省略
  choice: 补出“所立的约也同样能被废弃”
  alternative: 按原文省略，仅译作“以及利未人……事奉我的人”
  rationale: 希伯来语由וְאֶת连接第二个对象，并省略可由前文恢复的成分；汉语若不补出会形成残句。补译仅显明原有平行关系，不改变断约这一不可能条件的论证。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“那么……也”使本节与上文的条件句衔接清楚；分号呈现大卫之约与祭司职分之约的平行关系。脚注标记紧随其所说明的“利未祭司”。
