base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/033/016.yaml
  text: 'In those days Judah will be saved[a], and Jerusalem will dwell securely[b]; and this is what she will be called: ‘Yahweh is our righteousness.’'
translation:
  language: zh_hans
  text: 在那些日子，犹大必得拯救，耶路撒冷必安然居住；耶路撒冷将被称为[a]：“雅威是我们的义。”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或较直译：“这就是人要称呼她的名。”
    reason: lexical_alternative
  - marker: b
    text: 耶利米书23:6把相近的称号“雅威是我们的义”用于将要来到的大卫家君王；本节的语法则把这称号用于耶路撒冷，可能是在呼应先前的应许。
    reason: cross_reference
lexical_decisions:
- source_word: בַּיָּמִים הָהֵם
  choice: 在那些日子
  rationale: 这是引出将来复兴应许的标准先知性时间用语；译文自然，并保留原文的时间指向。
- source_word: תִּוָּשַׁע
  choice: 必得拯救
  rationale: ישׁע 的尼法勒式表达被动的蒙救、获救；“必得拯救”既保留被动含义，也传达预言应许的确定性。
- source_word: יְהוּדָה
  choice: 犹大
  rationale: 采用该民族及国度名称的通行中文译名。
- source_word: וִירוּשָׁלִַם
  choice: 耶路撒冷
  rationale: 采用该城名称的通行中文译名；与前句并列的关系由中文标点和语序自然表达。
- source_word: תִּשְׁכּוֹן לָבֶטַח
  choice: 必安然居住
  rationale: שׁכן 指居住、定居，לָבֶטַח 指安全无惧的状态；“安然居住”兼顾定居和安全两层意思。
- source_word: וְזֶה אֲשֶׁר יִקְרָא לָהּ
  choice: 她将被称为
  rationale: 原文是带阴性单数代词后缀的命名表达，所指为阴性名词“耶路撒冷”。中文用“她”明确承接该城，并自然表达命名公式；原文较形式化的表达另见脚注。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以中文音译保留四字神名，而不以称号替代。
- source_word: צִדְקֵנוּ
  choice: 是我们的义
  rationale: 该词由“义”与第一人称复数后缀组成，即“我们的义”；在命名公式中补出“是”，清楚表达其谓语关系，同时保留“义”的盟约与神学内涵。
theological_decisions:
- issue: 四字神名 יְהוָה 在命名公式中的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用神的专名。译作“雅威”以音译保留此名，不用“主”这一称号代替，也避免在正文中改用另一传统音译。
- issue: 命名公式所指对象及其与耶利米书23:6的关系
  choice: 本节按语法将名称用于耶路撒冷，以“她将被称为”表达
  alternative: 因耶利米书23:6的相近称号而将其直接理解为大卫王或弥赛亚的称号
  rationale: לָהּ 是阴性单数后缀，语法上回指耶路撒冷。耶利米书23:6的互文呼应具有神学意义，但不应凌驾于本节语法之上，因此放入脚注，保留经文间的张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话书面语。“必得拯救”“安然居住”保留先知应许的语气和原文的定居意象；以“她”承接耶路撒冷，使命名对象清楚。脚注标记均置于正文相应位置。
