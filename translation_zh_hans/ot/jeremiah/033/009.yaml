reference: Jeremiah 33:9
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/הָ֣יְתָה לִּ֗/י לְ/שֵׁ֤ם שָׂשׂוֹן֙ לִ/תְהִלָּ֣ה וּ/לְ/תִפְאֶ֔רֶת לְ/כֹ֖ל גּוֹיֵ֣י הָ/אָ֑רֶץ אֲשֶׁ֨ר יִשְׁמְע֜וּ אֶת כָּל הַ/טּוֹבָ֗ה אֲשֶׁ֤ר אָֽנֹכִי֙ עֹשֶׂ֣ה אֹתָ֔/ם וּ/פָחֲד֣וּ וְ/רָֽגְז֗וּ עַ֤ל כָּל הַ/טּוֹבָה֙ וְ/עַ֣ל כָּל הַ/שָּׁל֔וֹם אֲשֶׁ֥ר אָֽנֹכִ֖י עֹ֥שֶׂה לָּֽ/הּ־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/033/009.yaml
  text: And she will be to me a name of joy[a], a praise and a glory before all the nations of the earth, who will hear of all the good that I am doing for them. And they will fear and tremble because of all the good and because of all the peace that I am bringing to her.
translation:
  language: zh_hans
  text: 这城必使我在地上万国面前得享喜乐的美名、赞美和荣耀。万国听见我为他们所做的一切美事，就必因我赐给这城的一切福分和一切平安[a]而惧怕战兢。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “平安”也可译作“安康”“福祉”；希伯来语“沙龙”包含和平、安稳、兴盛和完整之意。
    reason: 说明 שָׁלוֹם 的宽广语义范围，避免汉语“平安”被狭义理解为没有冲突。
lexical_decisions:
- source_word: וְהָיְתָה לִּי
  choice: 这城必……使我得
  rationale: 阴性单数动词以及末句“赐给她”表明所指最自然是上下文中的城。现代汉语以“这城”明确承接对象，同时避免强行使用不自然的阴性代词。
- source_word: לְשֵׁם שָׂשׂוֹן
  choice: 得欢喜的名声
  rationale: שֵׁם 在此有名声、声誉之意；“欢喜的名声”保留希伯来语意象，也表达这城使上帝的名声成为欢喜之源。
- source_word: לִתְהִלָּה וּלְתִפְאֶרֶת
  choice: 赞美和荣耀
  rationale: תְהִלָּה 指赞美或美名，תִפְאֶרֶת 指荣耀、光彩；此译保持先知话语庄重而公开的荣誉意味。
- source_word: לְכֹל גּוֹיֵי הָאָרֶץ
  choice: 在地上万国面前
  rationale: 介词 ל 在此表达关系或呈现在……面前；该译清楚传达万国共同见证的公开性。
- source_word: אֲשֶׁר יִשְׁמְעוּ
  choice: 万国听见
  rationale: 关系从句在汉语中改作后续分句更自然，所听见的是上帝施行美事的消息。
- source_word: אֶת כָּל הַטּוֹבָה אֲשֶׁר אָנֹכִי עֹשֶׂה אֹתָם
  choice: 我为他们所做的一切美事
  rationale: עשה אֹתָם 在此表示为他们行事；“美事”比抽象的“良善”更能表现具体恩惠，并保留复数“他们”，不与后面的阴性单数“她”混同。
- source_word: וּפָחֲדוּ וְרָגְזוּ
  choice: 惧怕战兢
  rationale: 分别表达 פחד 的惧怕与 רגז 的震动、战兢；不额外限定为敬畏或恐慌，从而保留反应性质的张力。
- source_word: עַל כָּל הַטּוֹבָה
  choice: 因……一切福分
  rationale: עַל 在此具有原因意义；הַטּוֹבָה 指上帝所赐的好处和福祉，“福分”适合其具体恩惠语境。
- source_word: וְעַל כָּל הַשָּׁלוֹם
  choice: 和一切平安[a]
  rationale: שָׁלוֹם 的基本译法是“平安”，同时可涵盖安康、福祉和完整；以脚注说明其宽广语义。
- source_word: אֲשֶׁר אָנֹכִי עֹשֶׂה לָּהּ
  choice: 我赐给她的
  rationale: 直译近于“我为她成就的”；与“福分和平安”搭配时，“赐给”是自然汉语，并以“她”保留原文对城的阴性拟人。
theological_decisions:
- issue: 万国因上帝复兴这城而产生的反应性质
  choice: 译作“惧怕战兢”，不加解释性修饰
  alternative: 因敬畏而战兢；惊恐震动；政治上的不安
  rationale: 两个动词可以表示敬畏、恐惧或震动；上下文虽以福分和平安为原因，却没有把万国的反应明确限定为纯粹敬虔或敌对。直译保留这种先知性张力。
- issue: 阴性单数所指及其拟人表达
  choice: 主语用“这城”，末句用“她”
  alternative: 全用“它”；直接补出“耶路撒冷”
  rationale: 原文语法明确为阴性单数，最自然承接上下文中的城；“这城”既避免加入本节未明说的专名，也让末句的拟人“她”有所指。
translation_notes:
  register: 采用现代、庄重而通顺的先知书语体。“这城必……使我得”重组希伯来语名词链，使普通读者容易理解；“惧怕战兢”保留传统圣经语感与原文的语义张力。脚注标记置于其实际解释的“平安”之后。
