base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/033/010.yaml
  text: 'Thus says the LORD: Yet in this place, of which you say, ‘It is a waste, without man or beast,’ in the cities of Judah and in the streets of Jerusalem that are desolate, without man or inhabitant or beast, there shall again be heard'
translation:
  language: zh_hans
  text: 耶和华如此说：“在这地方，就是你们所说‘荒废了，无人也无牲畜’的地方，在犹大各城和耶路撒冷的街道上——这些地方荒凉，无人、无居民，也无牲畜——还必听见……
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的专名译法，明确呈现以色列上帝的盟约之名。
- source_word: חָרֵב
  choice: 荒废
  rationale: 该词在此描述因毁坏而成为废墟、无人畜的状态；“荒废”自然且与下文“荒凉”有所呼应而不机械重复。
- source_word: חֻצוֹת
  choice: 街道
  rationale: 此处指耶路撒冷城中的公共街巷；“街道”符合现代汉语表达。
- source_word: יִשָּׁמַע
  choice: 还必听见
  rationale: 保留未明确说出的被听见之声音，并保留本节延续到下一节的悬接句式；“还”表达恢复，“必”体现未完成式在预言语境中的确定将来意义。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 耶和华
  alternative: 上主
  rationale: “耶和华”在简体中文圣经传统中可辨识度高，并以专名形式区别于普通称谓“主”，不额外引入宗派性解释。
- issue: 恢复应许的确定性
  choice: 还必听见
  alternative: 还会听见
  rationale: 上下文是耶和华宣告将来的恢复；“必”自然表达神谕中的确定性，同时不擅自补出下一节才说明的具体声音。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。以分号和破折号梳理希伯来文较长的嵌套结构，同时保留本节在“还必听见”处悬而未完、须接续第11节的修辞效果。
