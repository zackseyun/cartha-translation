source:
  edition: WLC
  text: אֲשֶׁ֤ר לֹֽא יִסָּפֵר֙ צְבָ֣א הַ/שָּׁמַ֔יִם וְ/לֹ֥א יִמַּ֖ד ח֣וֹל הַ/יָּ֑ם כֵּ֣ן אַרְבֶּ֗ה אֶת זֶ֨רַע֙ דָּוִ֣ד עַבְדִּ֔/י וְ/אֶת הַ/לְוִיִּ֖ם מְשָׁרְתֵ֥י אֹתִֽ/י־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/033/022.yaml
  text: As the host of heaven cannot be counted and the sand of the sea cannot be measured[d][c][b][a], so I will multiply the offspring of David my servant and the Levites who minister to me.
translation:
  language: zh_hans
  text: 正如天上的万军数不尽[a][b]，海沙无法量度，我也必照样使我仆人大卫的后裔[c]和侍奉我的利未人[d]增多。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “数不尽”也可译作“无法数算”。
    reason: lexical_alternative
  - marker: b
    text: “天上的万军”是希伯来语习语，指天上的众多群体，通常包括星辰。
    reason: cultural_note
  - marker: c
    text: “后裔”原文直译为“种子”，也可译作“子孙”。
    reason: lexical_alternative
  - marker: d
    text: “侍奉我的”也可译作“服事我的”；原文可指持续进行的礼仪或圣所职事。
    reason: lexical_alternative
lexical_decisions:
- source_word: צְבָא הַשָּׁמַיִם
  choice: 天上的万象
  rationale: 保留“天上众多群体”的希伯来表达，并避免将所指过早限定为星辰；在现代汉语中，“万象”自然地表达天上不可胜数的众多事物。
- source_word: יִסָּפֵר
  choice: 数不尽
  rationale: 该词为ספר的Nifal未完成式，表示“被数算”；结合否定词译为“数不尽”，自然呈现无法计数之意。
- source_word: חוֹל הַיָּם
  choice: 海边的沙
  rationale: 该希伯来固定表达描绘数量浩繁；“海边的沙”符合现代汉语习惯，也保留原有意象。
- source_word: יִמַּד
  choice: 量不完
  rationale: 该词为מדד的Nifal，意为“被量度”；“量不完”与前句“数不尽”形成自然平行。
- source_word: כֵּן אַרְבֶּה
  choice: 我也必照样使……增多
  rationale: “照样”明确表达כֵּן所承接的比较关系；使役形式אַרְבֶּה译作“使……增多”。
- source_word: זֶרַע דָּוִד
  choice: 大卫的后裔
  rationale: זֶרַע在此为集合意义，指大卫的子孙后代；“后裔”比字面的“种子”自然，同时不限定人数或世代。
- source_word: עַבְדִּי
  choice: 我仆人
  rationale: 在大卫的王权与盟约语境中，עֶבֶד强调他是耶和华所任命的仆人，译作“仆人”最合适。
- source_word: הַלְוִיִּם
  choice: 利未人
  rationale: 采用这一支派名称的标准中文译法。
- source_word: מְשָׁרְתֵי אֹתִי
  choice: 侍奉我的
  rationale: 分词表示持续履行礼仪或圣所职分；“侍奉”既能体现宗教服事语境，也保持现代汉语的可读性。
theological_decisions:
- issue: 大卫后裔与利未人在应许中的关系
  choice: 将两者并列为“使……增多”的对象，表明应许同时涉及大卫的后裔和侍奉上帝的利未人。
  alternative: 可将利未人较狭义地理解为耶利米历史处境中的圣殿服事者，或在正典脉络中联系后来的弥赛亚应验。
  rationale: 希伯来文在אַרְבֶּה之后以两个由אֶת标示的直接宾语并列。译文保留这一结构，不在本节中解决应许后来如何实现的神学问题。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。以“正如……我也必照样……”保留原文比喻结构；“数不尽／量不完”形成平行节奏。“侍奉”体现利未人的礼仪职分，但脚注保留较宽泛的译法。
