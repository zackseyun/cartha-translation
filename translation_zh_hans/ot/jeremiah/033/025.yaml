base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/033/025.yaml
  text: 'Thus says Yahweh: If I have not established my covenant with day and night[a], the fixed order of heaven and earth—'
translation:
  language: zh_hans
  text: 雅威如此说：“若我没有立定昼夜之约，也没有设定天地的定例[a]——”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “定例”也可译作“定律”“律例”或“条例”；此处指天地受设定而恒常运行的秩序。
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  choice: 雅威如此说
  rationale: 保留先知信息常用的传话公式，并将四字神名 יְהוָה 音译为“雅威”。
- source_word: אִם לֹא
  choice: 如果……没有
  rationale: 保留希伯来文条件句的形式和反事实式修辞力度；本节的条件句在下一节才得到完整结论。
- source_word: בְרִיתִי יוֹמָם וָלָיְלָה
  choice: 我与昼夜所立的约
  rationale: בְּרִיתִי 直译为“我的约”；中文用“我与昼夜所立的约”明确其关系，同时保留上下文反复使用的“约”这一神学关键词。
- source_word: חֻקּוֹת שָׁמַיִם וָאָרֶץ
  choice: 天地的定律
  rationale: חֻקּוֹת 在这里指受规定、恒定的宇宙秩序；“定律”比法律语境中的“律例”更自然，并保留“被设定的规则”这一含义。
- source_word: לֹא שָׂמְתִּי
  choice: 没有立定……没有设立
  rationale: שׂוּם 基本义为“放置、设定”。译文按中文表达分别与“约”和“定律”搭配；希伯来文的单一动词可理解为统摄相关成分。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”较贴近通常重建的读音，也避免以称号代替专名。
- issue: 本节未完条件句的处理
  choice: 以破折号收束，保留悬而未决的句法
  alternative: 在本节补出“那么……”等结论
  rationale: 第25节只有条件前件，结论延至第26节；不在本节擅自补足，以保留原文的修辞张力。
- issue: “约”与宇宙秩序的关系
  choice: 保留“约”，并另译“天地的定律”
  alternative: 把“约”意译为“自然秩序”
  rationale: 本段借昼夜与受造秩序论证雅威之约的可靠性；保留“约”可维持上下文刻意形成的神学对应。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“立定……所立的约”略带经文语体，用来保留盟约措辞；“设立天地的定律”则清楚表达宇宙秩序。句末破折号提示本节语意延续至下一节。
