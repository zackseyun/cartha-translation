  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: גַּם זֶ֣רַע יַעֲקוֹב֩ וְ/דָוִ֨ד עַבְדִּ֜/י אֶמְאַ֗ס מִ/קַּ֤חַת מִ/זַּרְע/וֹ֙ מֹֽשְׁלִ֔ים אֶל זֶ֥רַע אַבְרָהָ֖ם יִשְׂחָ֣ק וְ/יַעֲקֹ֑ב כִּֽי אשוב אֶת שְׁבוּתָ֖/ם וְ/רִחַמְתִּֽי/ם־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/033/026.yaml
  text: then I would also reject the offspring of Jacob and of David my servant[a], not taking from his offspring rulers over the offspring of Abraham, Isaac, and Jacob[b]. For I will restore their fortunes and have compassion on them.
translation:
  language: zh_hans
  text: 那么，我也会弃绝雅各的后代[a]和我仆人大卫的后代，不从大卫的后代中选立统治亚伯拉罕、以撒和雅各的后代的统治者。因为我必使他们的境况复兴[b]，并怜悯他们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “后代”原文为集合单数，也可译作“后裔”或“种子”；本节其他几处“后代”同。
    reason: lexical_alternative
  - marker: b
    text: 或译：“使他们从被掳之地归回”或“扭转他们被掳的处境”。原文惯用语既可特指流亡者归回，也可广指恢复他们的境况。
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: 那么，我也
  rationale: 本节承接上一节的条件句，既表达推论关系，也保留“也”的附加意义。
- source_word: זֶרַע
  choice: 后代
  rationale: 这是集合单数，可指一个家系的众多后裔；“后代”在现代汉语中自然，也能贯穿本节多次出现的用法。
- source_word: וְדָוִד עַבְדִּי
  choice: 和我仆人大卫的后代
  rationale: “大卫”与“雅各”共同受前面的“后代”支配；汉语补出第二个“的后代”，以清楚表达希伯来语的省略结构，同时保留“大卫是我的仆人”这一称号。
- source_word: אֶמְאַס
  choice: 我也会弃绝
  rationale: 动词承接上一节不可能成立的条件，译作“会弃绝”体现条件句结果，而不是孤立的简单将来时；“弃绝”符合盟约语境。
- source_word: מִקַּחַת מִזַּרְעוֹ מֹשְׁלִים
  choice: 不从他的后代中选取……的人
  rationale: לקח在此指从某家系中取用或选立人作统治者；“选取”既保留动作含义，也符合汉语表达。代词“他的”保留原文，并自然指向最近的大卫。
- source_word: אֶל זֶרַע אַבְרָהָם יִשְׂחָק וְיַעֲקֹב
  choice: 治理亚伯拉罕、以撒和雅各后代
  rationale: 介词与“统治”类动词连用，标明治理的对象；译为“治理”比直译介词更自然。
- source_word: כִּי
  choice: 因为
  rationale: 引出上帝不会弃绝其民的理由。
- source_word: אשוב אֶת שְׁבוּתָם
  choice: 我必使他们恢复原有的景况
  rationale: 这是一个可指被掳者归回、也可广指命运或处境复原的惯用语；正文采用较宽泛的表达，并在脚注保留较具体的可能含义。
- source_word: וְרִחַמְתִּים
  choice: 并怜悯他们
  rationale: רחם兼有慈爱、同情与施怜悯之意；“怜悯”简洁庄重，并保留情感色彩。
theological_decisions:
- issue: 本节是否承接上一节的条件句
  choice: 以“那么，我也会弃绝”表达条件句的结果，并显示这是一种反事实或不可能成立的推论。
  alternative: 译作独立的简单将来时：“我也必弃绝”。
  rationale: 本节在句法和论证上承接前文；若译成无条件的将来陈述，会使上帝否定弃绝雅各和大卫家系的论证变成宣告将要弃绝。
- issue: “他的后代”所指为何
  choice: 保留“他的”，并按最近且符合上下文的先行词理解为大卫。
  alternative: 理解为雅各或以色列整体的后代。
  rationale: 大卫是最近的阳性单数先行词，而且从大卫家系中兴起治理列祖后代的统治者，符合本段对大卫之约的关注。
- issue: 亚伯拉罕、以撒和雅各的“后代”是否分别指不同群体
  choice: 按一个共同的盟约群体表达，保留原文集合单数的张力。
  alternative: 改写为三个彼此有别的后裔群体。
  rationale: 三位列祖在此共同界定同一盟约家系，不应因汉语复数化而人为拆分。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以“弃绝”“怜悯”保留经文的盟约语体；避免过度古雅。正文保持原文条件关系，并借脚注保存“后代”集合单数及“恢复景况／被掳归回”的语义幅度。
