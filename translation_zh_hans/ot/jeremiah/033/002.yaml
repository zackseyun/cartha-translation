  text: כֹּֽה אָמַ֥ר יְהוָ֖ה עֹשָׂ֑/הּ יְהוָ֗ה יוֹצֵ֥ר אוֹתָ֛/הּ לַ/הֲכִינָ֖/הּ יְהוָ֥ה שְׁמֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/033/002.yaml
  text: 'Thus says Yahweh[a], who made it[c][b], Yahweh who formed it to establish it—Yahweh is his name:'
translation:
  language: zh_hans
  text: 雅威[b]如此说：作成它的雅威[a][c]，塑造它、为要使它坚立的雅威——雅威是他的名：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “作成它……塑造它……”也可译作“施行它……塑造它……”。原文使用分词，可带有当前或持续进行的意味。
    reason: lexical_alternative
  - marker: b
    text: 本节三次出现“雅威”，原文每次都是神名 יהוה；另有译本按传统译作“耶和华”或“上主”。
    reason: alternative_reading
  - marker: c
    text: “作成它……塑造它……使它坚立”中的代词在原文都是阴性单数，也可直译为“她”；本节并未明说所指对象。
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: 如此说
  rationale: 采用现代中文圣经语体中自然而庄重的先知宣告公式，并以现在时表达此话当下生效的宣告性质。
- source_word: יְהוָה
  choice: 雅威
  rationale: 直接音译四字神名，保留其作为以色列之神专名的功能，而不以称号代替。
- source_word: עֹשָׂהּ
  choice: 那造作它的
  rationale: עֹשֶׂה为分词，带第三人称阴性单数后缀；“造作”保留创造、成就之意，“它”不擅自指明所指对象。
- source_word: יוֹצֵר אוֹתָהּ
  choice: 那塑造它
  rationale: יָצַר强调有意地塑造、形成；“塑造”与前面的“造作”构成自然平行。
- source_word: לַהֲכִינָהּ
  choice: 使它立定
  rationale: כון的使役形在此有使之稳固、确立之意；“立定”既保留结果性，也与造作、塑造的次序相称。
- source_word: שְׁמוֹ
  choice: 是他的名
  rationale: 按希伯来文的判断句结构，庄重地确认“雅威”是他的名。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华／上主
  rationale: 原文三次直接使用四字神名；音译可保留专名性质及原文的重复，而不将其改成称号。
- issue: 三个阴性单数后缀的所指
  choice: 均译为“它”，不补出具体对象
  alternative: 译为“她”，或补作“这城”“大地”等
  rationale: 本节没有明说所指对象；现代中文以“它”指未明事物较自然，也避免把某一解释写入正文。脚注说明原文的语法性别。
- issue: 分词的时间与体貌
  choice: 正文采用可兼具特征性与当前性的“造作／塑造”结构
  alternative: 明确译成过去时“造了／塑成了”，或持续时“正在造作／正在塑造”
  rationale: 希伯来分词本身可表达持续行动或行动者的特征；正文不把这种开放性限定为单一时态。
translation_notes:
  register: 采用现代、庄重而易懂的先知书语体。保留原文三次神名的重复及破折号所表达的郑重自我宣告；句末用冒号，因为本节引出下一节的宣告内容。
