source:
  edition: WLC
  text: הֲ/ל֣וֹא רָאִ֗יתָ מָֽה הָ/עָ֤ם הַ/זֶּה֙ דִּבְּר֣וּ לֵ/אמֹ֔ר שְׁתֵּ֣י הַ/מִּשְׁפָּח֗וֹת אֲשֶׁ֨ר בָּחַ֧ר יְהוָ֛ה בָּ/הֶ֖ם וַ/יִּמְאָסֵ֑/ם וְ/אֶת עַמִּ/י֙ יִנְאָצ֔וּ/ן מִֽ/הְי֥וֹת ע֖וֹד גּ֥וֹי לִ/פְנֵי/הֶֽם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/033/024.yaml
  text: Have you not seen what this people have spoken[a], saying, ‘The two families that Yahweh chose—he has rejected them’? Thus they despise my people[c][b], so that they should no longer be a nation before them.
translation:
  language: zh_hans
  text: 你没有看见这百姓所说的话吗？他们说：“耶和华所拣选的两个家族[a]，他已经弃绝了。”他们就这样藐视我的百姓，以致他们不再在这些人面前成为一国。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “家族”也可译作“宗族”。原文没有明确指出这两个家族具体是谁。
    reason: lexical_alternative
  - marker: b
    text: 末句较直译为“从（或以致）不再在他们面前成为一国”。“在他们面前”也可理解为“在他们眼中”；原文未明确限定为主观评价。
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלוֹא רָאִיתָ
  choice: 你没有留意……吗
  rationale: 保留期待肯定回答的反问语气；“留意”在现代汉语中比直译“看见”更能表达此处察觉、注意之意。
- source_word: הָעָם הַזֶּה
  choice: 这百姓
  rationale: 保留希伯来语集合单数以及略带疏离感的指称。
- source_word: דִּבְּרוּ לֵאמֹר
  choice: 所说的话吗？他们说
  rationale: 用自然汉语呈现有限动词加“说”的引语结构，不机械重复“说话说”。
- source_word: שְׁתֵּי הַמִּשְׁפָּחוֹת
  choice: 两个家族
  rationale: מִשְׁפָּחוֹת可指家族、宗族；正文采用宽泛的“家族”，不擅自确定其具体所指。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经语境中对神名四字母的通行音译，作为专名而非称号。
- source_word: אֲשֶׁר בָּחַר יְהוָה בָּהֶם
  choice: 耶和华所拣选的
  rationale: 希伯来语中的介词ב在此随“拣选”自然处理，不在中文中生硬补出。
- source_word: וַיִּמְאָסֵם
  choice: 他已经弃绝了
  rationale: מָאַס表达拒绝、厌弃；“弃绝”保留其强烈语气，并适合引语中的完成性行动。
- source_word: וְאֶת עַמִּי יִנְאָצוּן
  choice: 他们就这样藐视我的百姓
  rationale: נָאַץ意为轻蔑、藐视；“就这样”体现连接词在上下文中的结果或方式关系。
- source_word: מִהְיוֹת עוֹד גּוֹי לִפְנֵיהֶם
  choice: 不再把他们看作自己眼中的一个民族
  rationale: 将字面“使之不再在他们面前为一国”表达为敌对说话者的看法，避免断言神的百姓在客观上已不再成国；“自己眼中”体现לִפְנֵיהֶם在此可能表示其观感或判断。
theological_decisions:
- issue: “两个家族”的所指
  choice: 正文仅译作“两个家族”，不加说明具体身份。
  alternative: 明确译为以色列和犹大，或大卫家和利未祭司家。
  rationale: 本节自身没有明说是哪两个家族；紧邻语境虽可支持不同理解，但译文应保留原文的含混，不代替读者作神学判定。
- issue: 末句所表达的是客观地位还是敌对者的评价
  choice: 译为“不再把他们看作自己眼中的一个民族”，使之落在藐视者的判断上。
  alternative: 译为“使他们不再成为一个民族”，理解为客观事实或意愿。
  rationale: לִפְנֵיהֶם可表示“在他们面前、在他们眼中”；结合“藐视”，这里较自然地指这些人对神百姓的评价，同时承认希伯来语句法较为压缩。
- issue: 神名的译法
  choice: 耶和华
  alternative: 雅威
  rationale: “耶和华”是简体中文普通读者最熟悉、最易识别的神名专称；不以“主”取代原文专名。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“这百姓”“拣选”“弃绝”“藐视”等词保留先知书语体的力度；末句稍作意合，以清楚传达其可能指向敌对者眼中的评价。所有脚注标记均已置于正文。
