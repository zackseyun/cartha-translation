source:
  edition: WLC
  text: כֹּֽה אָמַר֮ יְהוָ֣ה צְבָאוֹת֒ ע֞וֹד יִֽהְיֶ֣ה בַּ/מָּק֣וֹם הַ/זֶּ֗ה הֶ/חָרֵ֛ב מֵֽ/אֵין אָדָ֥ם וְ/עַד בְּהֵמָ֖ה וּ/בְ/כָל עָרָ֑י/ו נְוֵ֣ה רֹעִ֔ים מַרְבִּצִ֖ים צֹֽאן־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/033/012.yaml
  text: 'Thus says Yahweh of hosts: Yet again there will be in this place[a], which is desolate, without man or beast, and in all its cities, a pasture of shepherds[c][b], where they make flocks lie down.'
translation:
  language: zh_hans
  text: 万军之耶和华如此说：“这地方荒凉，无人也无牲畜[b]；将来在这里和其中所有的城镇，必再有[a]牧人的草场[c]，牧人在那里使羊群躺卧。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “必再有”也可译作“还会有”或“又会有”。
    reason: lexical_alternative
  - marker: b
    text: “无人也无牲畜”是表示完全荒凉的常见表达。
    reason: cultural_note
  - marker: c
    text: “草场”也可译作“牧人的居所”或“牧人的羊圈”。希伯来词可指牧放、栖居或安置羊群之处。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה צְבָאוֹת
  choice: 万军之耶和华
  rationale: 保留圣约之名“耶和华”，并以中文圣经传统且仍可理解的“万军之”表达 צְבָאוֹת，避免把所指范围限于地上的军队。
- source_word: עוֹד יִהְיֶה
  choice: 但将来……必再有
  rationale: עוֹד 在此兼有“再度”与灾后复兴的意味；加入“将来”自然表达未然性，“但”突显荒凉与恢复之间的转折。
- source_word: בַּמָּקוֹם הַזֶּה הֶחָרֵב
  choice: 这地方如今荒凉……但将来在这里
  rationale: 按希伯来语关系，将“荒凉”修饰“这地方”；中文调整语序以避免冗长，同时保留指示语气及现状与未来的对照。
- source_word: מֵאֵין אָדָם וְעַד בְּהֵמָה
  choice: 无人也无牲畜
  rationale: 这是表示彻底荒废的固定搭配；译文简明保留人和牲畜两方面皆不存在的意思。
- source_word: וּבְכָל עָרָיו
  choice: 和其中所有的城镇
  rationale: 第三人称阳性单数后缀回指作为地域整体的“这地方”；“其中”在现代汉语中明确这种领属关系。
- source_word: נְוֵה רֹעִים
  choice: 牧人的草场
  rationale: נְוֵה 可指居所、牧场或羊圈；结合下文使羊群躺卧，正文采用自然且合乎场景的“草场”，脚注保留词义歧义。
- source_word: מַרְבִּצִים צֹאן
  choice: 让羊群躺卧
  rationale: 保留 רבץ 的使役分词意义，即牧人使羊群安卧；צֹאן 是集合名词，译为“羊群”自然准确。
theological_decisions:
- issue: 神名与 צְבָאוֹת 这一称号的译法
  choice: 万军之耶和华
  alternative: 万军之主／雅威—万军的统帅
  rationale: 采用现代中文读者熟悉、又能区分专名与称号的表达；不把“万军”解释为仅指天军或仅指以色列军队，以保留其范围。
- issue: 荒凉公式中 אָדָם 的表达
  choice: 无人也无牲畜
  alternative: 没有人，也没有走兽／没有人类或牲畜
  rationale: 此处重点是全然无人畜的荒凉，不涉及性别区分；“无人”准确表达 אָדָם 的泛指意义。
- issue: 恢复应许的力度
  choice: 必再有
  alternative: 还会有／仍将有
  rationale: יִהְיֶה 是陈述性的未完成式，在先知宣告中表达将来的恢复；“必再有”保留肯定语气，但不额外说明实现方式或时间。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。把希伯来语较长的地点修饰结构重组为“如今……但将来……”的对照句，以提高可读性；保留“耶和华”“万军”“羊群躺卧”等经文意象，不加入具体教派解释。
