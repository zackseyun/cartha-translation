  to: 万军之耶和华如此说：“这地方荒凉，无人也无牲畜[b]；将来在这里和其中所有的城镇，必再有[a]牧人的草场[c]，牧人在那里使羊群躺卧。”
  rationale: 将脚注a移至“必再有”之后，使锚点与所释短语一致；为荒凉公式补上说明性脚注；并明确“牧人”是使羊群躺卧的施事者。修订不改变经文的时间、地点或复兴应许的含义，并保留נְוֵה的词义余地。
