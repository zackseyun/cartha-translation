  text: וְ/טִ֣הַרְתִּ֔י/ם מִ/כָּל עֲוֺנָ֖/ם אֲשֶׁ֣ר חָֽטְאוּ לִ֑/י וְ/סָלַחְתִּ֗י ל/כול עֲוֺנֽוֹתֵי/הֶם֙ אֲשֶׁ֣ר חָֽטְאוּ לִ֔/י וַ/אֲשֶׁ֖ר פָּ֥שְׁעוּ בִֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/033/008.yaml
  text: And I will cleanse them from all their guilt by which they have sinned against me[b][a], and I will forgive all their guilty deeds by which they have sinned against me and by which they have rebelled against me.
translation:
  language: zh_hans
  text: 我要洁净他们，除去他们因得罪我而招致的一切罪责[a]；我要赦免他们一切因得罪我、背叛我所犯的罪孽[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“他们的一切罪孽”。希伯来语 עָוֹן 既可指所犯的恶行，也可指恶行所带来的罪责。
    reason: lexical_alternative
  - marker: b
    text: 或译“他们的一切罪责”。原文此处再次使用 עָוֹן，但采用复数形式，强调他们许多应承担罪责的过犯。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְטִהַרְתִּים
  choice: 我要洁净他们
  rationale: טהר 的皮埃勒词干表示使之洁净、除去污秽。“洁净”既可承载道德与盟约恢复的含义，也保留上帝主动施行洁净的语气。
- source_word: מִכָּל עֲוֺנָם
  choice: 除去他们因得罪我而招致的一切罪责
  rationale: 介词 מִן 与“洁净”连用，表达从某种污秽或罪责中洁净。עָוֹן 可指罪行，也可指罪所带来的责任；此处译作“罪责”，并以脚注保留“罪孽”的可能。
- source_word: אֲשֶׁר חָטְאוּ לִי
  choice: 因得罪我而招致
  rationale: חטא 与 לִי 连用，表示犯罪得罪上帝。这样处理使关系代词 אֲשֶׁר 与前面的“罪责”自然衔接，说明罪责源于他们得罪上帝。
- source_word: וְסָלַחְתִּי
  choice: 我要赦免
  rationale: סלח 是表示上帝赦罪的常用动词；“赦免”在现代汉语中庄重、清楚，并适合此处宾语为罪孽的结构。
- source_word: לְכָל עֲוֺנוֹתֵיהֶם
  choice: 他们……所犯的一切罪孽
  rationale: 这里 עָוֹן 为复数，突出他们多项应受责罚的恶行。“罪孽”既保留具体罪行的复数意味，也避免把 עון、חטא、פשע 三个词全部压平为同一个“罪”字。
- source_word: וַאֲשֶׁר פָּשְׁעוּ בִי
  choice: 背叛我所犯的
  rationale: פשע 常表示对合法权威的反叛或悖逆。“背叛我”清楚传达其关系性和盟约性的严重程度，同时是普通读者易懂的现代汉语。
theological_decisions:
- issue: 如何呈现 עון、חטא、פשע 三组彼此重叠的罪恶词汇
  choice: 分别使用“罪责／罪孽”“得罪”和“背叛”
  alternative: 全部统一译为“罪”或“犯罪”
  rationale: 原文叠用相关但不完全相同的词，涵盖罪所带来的责任、具体恶行以及对上帝的反叛。保留适度差异可呈现原文的道德与关系张力，而不把它们纳入某一特定教义体系。
- issue: עָוֹן 在本节中指罪行还是罪责
  choice: 首次译为“罪责”，复数处译为“罪孽”，并用脚注说明两者的语义可能
  alternative: 两处都译为“罪孽”或两处都译为“罪责”
  rationale: 该词本身可兼指过犯及其所产生的罪责。首次与“洁净、除去”相连，罪责义较自然；第二次为复数且与“赦免”相连，具体罪孽义较自然。脚注避免把原文的真实歧义封闭起来。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“洁净、赦免、罪孽”保留经文语体，但句法力求普通读者容易理解；分号对应原文两个并列的上帝行动。
