source:
  edition: WLC
  text: בָּאִ֗ים לְ/הִלָּחֵם֙ אֶת הַ/כַּשְׂדִּ֔ים וּ/לְ/מַלְאָ/ם֙ אֶת פִּגְרֵ֣י הָ/אָדָ֔ם אֲשֶׁר הִכֵּ֥יתִי בְ/אַפִּ֖/י וּ/בַ/חֲמָתִ֑/י וַ/אֲשֶׁ֨ר הִסְתַּ֤רְתִּי פָנַ/י֙ מֵ/הָ/עִ֣יר הַ/זֹּ֔את עַ֖ל כָּל רָעָתָֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/033/005.yaml
  text: They are coming to fight against the Chaldeans but only to fill them with the corpses of the men whom I struck down in my anger and in my wrath[c][b][a], and from this city I have hidden my face because of all their evil.
translation:
  language: zh_hans
  text: 他们来与迦勒底人[a]争战，并使其中[b]充满人的尸体[c]；这些人是我在怒气和烈怒中击杀的。我因他们所行的一切恶，向这城掩面。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“巴比伦人”。希伯来文作“迦勒底人”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译“并使它们充满”；“它们”很可能指上一节提到的房屋或防御设施。
    reason: cross_reference
  - marker: c
    text: 也可译“人类的尸体”。这里的希伯来词 אָדָם 可按语境指人或人类。
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּאִים
  choice: 他们前来
  rationale: 该词是阳性复数主动分词，在这里表达正在发生或迫近的行动；按上下文补出复数代词，使现代汉语完整自然。
- source_word: לְהִלָּחֵם אֶת הַכַּשְׂדִּים
  choice: 与迦勒底人争战
  rationale: 不定式表达敌对交战；“与……争战”既准确又符合庄重的现代汉语。
- source_word: הַכַּשְׂדִּים
  choice: 迦勒底人
  rationale: 保留希伯来文的族名称谓，不直接以相关的政治地理名称“巴比伦人”替代。
- source_word: וּלְמַלְאָם
  choice: 结果却只使那些地方充满
  rationale: 形式上是“并使它们充满”，但上下文呈现守城者迎战反而使前文所说的房屋或防御设施堆满尸体的惨烈结果；“结果却只”传达这一结果意味。所指对象在注释中说明，以免把解释伪装成无歧义的原文。
- source_word: פִּגְרֵי הָאָדָם
  choice: 人的尸体
  rationale: פֶּגֶר指暴死者的尸身；אָדָם在此为集合性用法。“人的尸体”保留其概括性和原文的强烈画面。
- source_word: אֲשֶׁר הִכֵּיתִי
  choice: 这些人是我……击杀的
  rationale: נכה本义为击打，在尸体这一语境中明确含致死结果；“击杀”兼顾动作意象与死亡结果。
- source_word: בְאַפִּי וּבַחֲמָתִי
  choice: 在怒气和烈怒中
  rationale: 分别呈现两个彼此重叠而递进的审判用语，不将其合并为单一情绪词。
- source_word: הִסְתַּרְתִּי פָנַי מֵהָעִיר הַזֹּאת
  choice: 向这城掩面
  rationale: 保留“掩面”这一重要的圣经拟人性表达，表示上帝收回眷顾和临在；“向这城”自然表达希伯来介词所标明的对象。
- source_word: עַל כָּל רָעָתָם
  choice: 因他们所行的一切恶
  rationale: עַל在此表原因；补入“所行的”使汉语清楚指向他们的恶行，同时不削弱道德判断。
theological_decisions:
- issue: 上帝施行审判及“掩面”的拟人表达
  choice: 保留第一人称的“我……击杀”以及“我……向这城掩面”
  alternative: 改写为非人格化的灾祸，或直接释义为上帝不再保护这城
  rationale: 原文直接把审判归于说话的上帝，并以“掩面”表达撤回眷顾。直译这些核心意象可保留经文的神学力度，而不以解释取代原文。
- issue: 两个目的不定式之间的逻辑关系
  choice: 译为“前来……结果却只使……”
  alternative: 形式直译为“前来……并使……”
  rationale: 希伯来文以连词并列两个不定式，形式本身可直译为“并”；但语境显示迎战产生了堆满尸体的反向结果。正文采用合乎汉语语境的结果式表达，脚注同时保留形式直译，避免掩盖语法张力。
- issue: אָדָם的范围
  choice: 人的尸体
  alternative: 男人的尸体；人类的尸体
  rationale: 这里指城中战死的人，但希伯来词本身是集合性称呼，并不明确限定为成年男性。“人的尸体”既具体又保留范围上的开放性。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“争战”“击杀”“掩面”保留经文的严肃语体和关键意象；通过分号拆开较长的关系从句，使朗读清楚。所有脚注标记均置于正文相应词语之后。
