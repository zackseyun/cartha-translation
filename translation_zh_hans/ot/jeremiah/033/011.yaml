source:
  edition: WLC
  text: ק֣וֹל שָׂשׂ֞וֹן וְ/ק֣וֹל שִׂמְחָ֗ה ק֣וֹל חָתָן֮ וְ/ק֣וֹל כַּלָּה֒ ק֣וֹל אֹמְרִ֡ים הוֹדוּ֩ אֶת יְהוָ֨ה צְבָא֜וֹת כִּֽי ט֤וֹב יְהוָה֙ כִּֽי לְ/עוֹלָ֣ם חַסְדּ֔/וֹ מְבִאִ֥ים תּוֹדָ֖ה בֵּ֣ית יְהוָ֑ה כִּֽי אָשִׁ֧יב אֶת שְׁבוּת הָ/אָ֛רֶץ כְּ/בָ/רִאשֹׁנָ֖ה אָמַ֥ר יְהוָֽה־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/033/011.yaml
  text: the sound of joy and the sound of gladness[a], the sound of the bridegroom and the sound of the bride, the sound of those saying, ‘Give thanks to Yahweh of hosts, for Yahweh is good, for his steadfast love endures forever,’ and of those bringing a thank offering into the house of Yahweh. For I will restore the fortunes of the land as at first[b], says Yahweh.
translation:
  language: zh_hans
  text: 欢喜的声音、快乐的声音[a]，新郎的声音、新娘的声音，说：“你们要感谢万军之耶和华，因为耶和华本为善；他的慈爱永远长存。”的人们的声音，以及把感恩祭带进耶和华殿中的人们的声音。因为我必使这地恢复从前的景况[b]。耶和华说。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “欢喜”和“快乐”原文是两个意义相近的词，也可译作“喜乐”和“欢欣”。
    reason: lexical_alternative
  - marker: b
    text: “使这地恢复从前的景况”也可译作“使这地被掳的人归回”。原文是一个恢复性的惯用语，既可指被掳者归回，也可更广泛地指命运或景况复原。
    reason: alternative_reading
lexical_decisions:
- source_word: קוֹל
  choice: 声音
  rationale: 该词可指声音、嗓音或声响；这里反复引出欢庆、婚礼及敬拜中可听见的声音，译为“声音”既保留诗歌复沓，也符合现代汉语。
- source_word: שָׂשׂוֹן וְשִׂמְחָה
  choice: 欢喜……快乐
  rationale: 两个近义词共同描写热烈的喜悦。分别译为“欢喜”和“快乐”，保留词语差异及排比，而不夸大二者语义区别。
- source_word: חָתָן וְכַלָּה
  choice: 新郎……新娘
  rationale: 这是婚礼场景中的标准配对，现代汉语自然且庄重。
- source_word: הוֹדוּ
  choice: 感谢
  rationale: ידה的使役式在此礼仪公式中表示向上帝献上感谢或赞美；“感谢”也与后文תּוֹדָה的感恩祭形成词义呼应。
- source_word: יְהוָה צְבָאוֹת
  choice: 万军之耶和华
  rationale: “万军”直接保留צְבָאוֹת的群军意象；“耶和华”在现代中文圣经语境中是神圣四字名的通行音译。
- source_word: לְעוֹלָם חַסְדּוֹ
  choice: 他的慈爱永远长存
  rationale: חֶסֶד涵盖坚定之爱、恩慈、怜悯及盟约忠诚。“慈爱”简洁自然，动词“长存”依汉语需要补出，表达无动词分句的持续意义。
- source_word: תּוֹדָה
  choice: 感恩祭
  rationale: 该物被带进耶和华的殿，语境指向祭献，而非仅指口头感谢；“感恩祭”准确体现其礼仪含义。
- source_word: אָשִׁיב אֶת שְׁבוּת הָאָרֶץ
  choice: 使这地恢复从前的景况
  rationale: 这是恢复命运或归回被掳者的惯用表达；上下文涵盖婚礼、敬拜和社会生活复兴，正文采用较宽广的恢复含义，同时以脚注保留被掳者归回的可能。
- source_word: כְּבָרִאשֹׁנָה
  choice: 从前的景况
  rationale: 该短语意为“如起初、如从前”；与恢复公式结合译作“恢复从前的景况”，在汉语中自然并完整表达比较关系。
theological_decisions:
- issue: 神圣四字名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用神圣名。正文采用现代中文圣经传统中最通行、普通读者最易识别的“耶和华”，不以“主”取代专名；“雅威”是较接近学术重构读音的可行替代。
- issue: חֶסֶד的神学与语义幅度
  choice: 慈爱
  alternative: 信实的爱；怜悯；盟约之爱
  rationale: 该词兼有恩慈、忠诚、怜悯和坚定之爱的色彩。正文用自然而宽广的“慈爱”，脚注明确其他可能，避免把它限缩为单一神学概念。
- issue: שְׁבוּת恢复公式的范围
  choice: 使这地恢复从前的景况
  alternative: 使这地被掳的人归回；扭转这地的被掳状态
  rationale: 该希伯来惯用语既可与被掳者归回有关，也可广指命运和整体景况的复兴。本节所描写的婚庆与圣殿敬拜支持较宽泛的正文译法，但不排除被掳含义。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。以“声音”贯穿排比，保留希伯来诗句的复沓节奏；引语使用自然的礼仪措辞。正文不添加原文没有的宗派性解释，并通过脚注保留חֶסֶד及שְׁבוּת的真实语义幅度。
