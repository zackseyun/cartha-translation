id: JER.33.14
reference: Jeremiah 33:14
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: הִנֵּ֛ה יָמִ֥ים בָּאִ֖ים נְאֻם יְהוָ֑ה וַ/הֲקִֽמֹתִי֙ אֶת הַ/דָּבָ֣ר הַ/טּ֔וֹב אֲשֶׁ֥ר דִּבַּ֛רְתִּי אֶל בֵּ֥ית יִשְׂרָאֵ֖ל וְ/עַל בֵּ֥ית יְהוּדָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/033/014.yaml
  text: Look[a], days are coming, declares Yahweh, when I will fulfill the good word that I spoke to the house of Israel and the house of Judah.
translation:
  language: zh_hans
  text: “看哪，日子将到——雅威宣告——那时，我必使我向以色列家和犹大家所说的那美好的话实现[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“使我所应许的美好之事实现。”原文直译为“使那美好的话立定（或成就）”。
    reason: 说明דָּבָר兼有“话／事情”的语义范围，以及קום使役形在这里可表达“使之成立、成就”；同时保留“应许”这一符合语境但较具解释性的译法。
lexical_decisions:
- source_word: הִנֵּה
  choice: 看哪
  rationale: 作为先知宣告中的引人注意语，保留其指示和强调作用；“看哪”庄重、简洁，也为现代中文读者所熟悉。
- source_word: יָמִים בָּאִים
  choice: 日子将到
  rationale: 贴近希伯来语常见的先知性未来公式，同时符合自然、庄重的现代汉语表达。
- source_word: נְאֻם יְהוָה
  choice: 雅威宣告
  rationale: נְאֻם是郑重的神谕宣告公式；“宣告”较“说”更能体现其分量。神名יהוה音译为“雅威”。
- source_word: וַהֲקִמֹתִי
  choice: 我必使……实现
  rationale: קום的使役形在以“话”为宾语时，表示使所说的话成立、成就或应验；“使……实现”既传达这一语义，又能与“那美好的话”自然搭配。
- source_word: הַדָּבָר הַטּוֹב
  choice: 那美好的话
  rationale: דָּבָר可指话、事情或事物；此处由后面的“所说的”限定，译作“话”可保留原文词汇联系，不直接将其解释为“应许”。
- source_word: דִּבַּרְתִּי
  choice: 我……所说的
  rationale: 按基本义译为“说”，避免在正文中用“应许”预先解释其言语行为。
- source_word: אֶל בֵּית יִשְׂרָאֵל וְעַל בֵּית יְהוּדָה
  choice: 向以色列家和犹大家
  rationale: 原文对两者分别使用אֶל与עַל；在此语境中都关联神所说之话的对象。中文统一用“向”可避免生硬，但“家”予以保留，以保存其民族—盟约性称谓。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；音译“雅威”较贴近学界通行的拟音，并保留其作为专名的性质。
- issue: הַדָּבָר הַטּוֹב应译为“美好的话”还是“美好的应许”
  choice: 那美好的话
  alternative: 那美好的应许
  rationale: “话”更直接对应דָּבָר，并与דִּבַּרְתִּי“我所说的”形成词义呼应；上下文确有应许含义，但正文不将这种含义解释得过满。
- issue: אֶל与עַל两个不同介词的处理
  choice: 均以“向”表达
  alternative: 分别译为“向以色列家、论到犹大家”
  rationale: 分别直译会使中文看似刻意区分神的话对两个群体具有不同关系，而本句未必要求这种神学差异；统一表达较自然，同时不改变两个家都在话语范围内这一点。
translation_notes:
  register: 采用庄重而可懂的现代标准汉语。“看哪”“日子将到”“雅威宣告”保留先知话语的郑重节奏；破折号标明插入的宣告公式，避免句法含混。正文尽量贴近原文的“话／说”词汇联系，脚注补充更具解释性的“应许”译法。
