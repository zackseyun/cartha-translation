  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: בְּ/עָרֵ֨י הָ/הָ֜ר בְּ/עָרֵ֤י הַ/שְּׁפֵלָה֙ וּ/בְ/עָרֵ֣י הַ/נֶּ֔גֶב וּ/בְ/אֶ֧רֶץ בִּנְיָמִ֛ן וּ/בִ/סְבִיבֵ֥י יְרוּשָׁלִַ֖ם וּ/בְ/עָרֵ֣י יְהוּדָ֑ה עֹ֣ד תַּעֲבֹ֧רְנָה הַ/צֹּ֛אן עַל יְדֵ֥י מוֹנֶ֖ה אָמַ֥ר יְהוָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/033/013.yaml
  text: In the cities of the hill country[a], in the cities of the lowland, and in the cities of the Negeb, and in the land of Benjamin, and around Jerusalem, and in the cities of Judah, the flocks will again pass under the hands of the one who counts them[c][b], says Yahweh.
translation:
  language: zh_hans
  text: 在山区的各城、低地[a]的各城、南地[b]的各城、便雅悯境内、耶路撒冷周围以及犹大的各城，羊群必再次在数点者手下经过[c]。这是雅威说的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “低地”指犹大山地西侧的示非拉地区；也可译作“示非拉”。
    reason: lexical_alternative
  - marker: b
    text: “南地”原文为“内盖夫”，既可指“南方”，也用作犹大南部地区的名称。
    reason: lexical_alternative
  - marker: c
    text: 原文直译为“羊群必再次在数点者的手下经过”，描绘牧人让羊群逐一经过手下，以便数点。
    reason: cultural_note
lexical_decisions:
- source_word: בְּעָרֵי הָהָר
  choice: 在山区的各城
  rationale: הָהָר在此指犹大的山地或高地区域，并非一座山；“山区”自然清楚，“各城”保留重复的地理句式。
- source_word: הַשְּׁפֵלָה
  choice: 低地
  rationale: 指犹大山地以西的示非拉丘陵地带；正文采用易懂的地貌名称，并以脚注补充专名。
- source_word: הַנֶּגֶב
  choice: 南地
  rationale: 此处是犹大南部的特定区域名称；“南地”兼具专名感和可理解性，脚注说明其音译及普通词义。
- source_word: אֶרֶץ בִּנְיָמִן
  choice: 便雅悯境内
  rationale: אֶרֶץ在地理列举中指便雅悯的领地；“境内”比直译“土地”更符合现代汉语。
- source_word: סְבִיבֵי יְרוּשָׁלִַם
  choice: 耶路撒冷周围
  rationale: 直接表达耶路撒冷四周的地区，简洁自然。
- source_word: עָרֵי יְהוּדָה
  choice: 犹大的各城
  rationale: 保留与本节前文重复的“各城”结构。
- source_word: עֹד
  choice: 再次
  rationale: 在复兴语境中表示中断后的恢复，即此事将重新发生。
- source_word: תַּעֲבֹרְנָה הַצֹּאן
  choice: 羊群必再次……经过
  rationale: צֹאן是绵羊、山羊等小型牲畜的集合名词；汉语“羊群”自然涵盖此意。阴性复数动词与集合性群体相应。
- source_word: עַל יְדֵי מוֹנֶה
  choice: 从数点的人手下经过
  rationale: 尽量保留希伯来文“在数点者手下经过”的具体牧羊图景，不将其泛化为“受照管”。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以通行的汉语音译呈现四字神名，保留其作为专名的性质，而不以称号替代。
theological_decisions:
- issue: 复兴应许中的牧羊和数点图景
  choice: 保留羊群从数点者手下经过的具体意象
  alternative: 意译为羊群再次受到细心照管或牧养
  rationale: 原文描绘正常牧业生活得以恢复；保留数点动作既忠于文本，也不替读者预先界定其神学含义。
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名；音译可保留专名性质，而“主”会将专名改成称号。“雅威”较贴近学界通常重构的读音。
translation_notes:
  register: 采用现代、庄重而易懂的普通话书面语。地理列举保留原文的重复节奏；“必再次”传达复兴应许的未来确定性。“从……手下经过”略带具体形象感，脚注辅助现代读者理解古代牧羊场景。
