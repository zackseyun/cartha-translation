  text: כִּֽי כֹ֣ה אָמַ֣ר יְהוָ֗ה אַל תָּבוֹא֙ בֵּ֣ית מַרְזֵ֔חַ וְ/אַל תֵּלֵ֣ךְ לִ/סְפּ֔וֹד וְ/אַל תָּנֹ֖ד לָ/הֶ֑ם כִּֽי אָסַ֨פְתִּי אֶת שְׁלוֹמִ֜/י מֵ/אֵ֨ת הָ/עָ֤ם הַ/זֶּה֙ נְאֻם יְהוָ֔ה אֶת הַ/חֶ֖סֶד וְ/אֶת הָֽ/רַחֲמִֽים־׀־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/016/005.yaml
  text: 'For thus says Yahweh: Do not enter a house of mourning[a], and do not go to mourn or show sympathy for them, for I have taken away my peace from this people[c][b], declares Yahweh—steadfast love and compassion.'
translation:
  language: zh_hans
  text: 因为耶和华如此说：“不要进入丧家[a]，不要去哀悼，也不要向他们表示慰问[b]；因为我已经从这百姓中收去了我的平安[c]、慈爱和怜悯。这是耶和华的宣告。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“宴饮之家”。希伯来语 מַרְזֵחַ 在某些语境可指宴饮聚会，但本节提到哀悼和慰问，因此正文采用“丧家”。
    reason: lexical_alternative
  - marker: b
    text: 或译“向他们表示哀痛”或“安慰他们”。这里的希伯来语动词可指在丧事中以言语或举动表达同情、慰问。
    reason: lexical_alternative
  - marker: c
    text: 这里的“平安”也包含安康、完好和福祉，并不只是没有冲突。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的专名形式，明确保留原文中的神名。
- source_word: בֵּית מַרְזֵחַ
  choice: 丧家
  rationale: מַרְזֵחַ 在某些语境可指宴饮场所，但本节紧接着提到哀悼和慰问，因此这里以治丧、举哀的场所为宜；“丧家”简洁自然。
- source_word: לִסְפּוֹד
  choice: 哀悼
  rationale: 该词在这里特指为死者举哀；“哀悼”准确且符合现代汉语表达。
- source_word: תָּנֹד לָהֶם
  choice: 向他们表示哀痛
  rationale: נוד 在丧葬语境中可指以言语或举动表达哀伤、慰问；此译保留共同哀痛的意味，又不把动作具体化。
- source_word: אָסַפְתִּי אֶת שְׁלוֹמִי
  choice: 我已经……收回我的平安
  rationale: אָסַף 在此表示撤去、收回；“收回”能自然表达神不再把这福分赐给百姓。
- source_word: שְׁלוֹמִי
  choice: 我的平安
  rationale: שָׁלוֹם 不仅指没有冲突，也涵盖安康、完好和福祉；正文保留核心词“平安”，并以脚注说明其宽广含义。
- source_word: נְאֻם יְהוָה
  choice: 这是耶和华的宣告
  rationale: 以庄重而通顺的现代中文表达先知书中常见的神谕公式。
- source_word: הַחֶסֶד
  choice: 慈爱
  rationale: חֶסֶד 包含坚定的爱、恩慈和忠信；“慈爱”是自然、凝练且具有圣经语体的中文表达。
- source_word: הָרַחֲמִים
  choice: 怜悯
  rationale: 复数形式在这里表达抽象而充分的怜恤；“怜悯”准确且与“慈爱”搭配自然。
theological_decisions:
- issue: 末尾“慈爱和怜悯”与“我的平安”的句法关系
  choice: 用破折号将“慈爱和怜悯”作为对“我的平安”的补充说明
  alternative: 补出重复的谓语，译作“我也收回了慈爱和怜悯”
  rationale: 原文在“我的平安”及末尾两个名词前都使用宾格标记，既可视为同一动词统领的并列宾语，也可理解为后者阐明前者。破折号既呈现解释关系，也避免过度排除并列理解。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。“丧家”“哀悼”“表示哀痛”共同建立明确的治丧语境；末句用破折号保留原文中“平安”与“慈爱和怜悯”之间的句法张力。
