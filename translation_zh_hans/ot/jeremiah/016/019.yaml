id: JER.16.19
reference: Jeremiah 16:19
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: יְהוָ֞ה עֻזִּ֧/י וּ/מָעֻזִּ֛/י וּ/מְנוּסִ֖/י בְּ/י֣וֹם צָרָ֑ה אֵלֶ֗י/ךָ גּוֹיִ֤ם יָבֹ֨אוּ֙ מֵֽ/אַפְסֵי אָ֔רֶץ וְ/יֹאמְר֗וּ אַךְ שֶׁ֨קֶר֙ נָחֲל֣וּ אֲבוֹתֵ֔י/נוּ הֶ֖בֶל וְ/אֵֽין בָּ֥/ם מוֹעִֽיל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/016/019.yaml
  text: O Yahweh[a], my strength and my stronghold, my refuge in the day of distress, to you the nations will come from the ends of the earth and say, “Surely our fathers inherited only lies[b], worthless things in which there is no profit.”
translation:
  language: zh_hans
  text: 耶和华[a]啊，你是我的力量、我的保障，是我在患难之日的避难所。列国必从地极来到你这里，说：“我们的祖先所承受的，实在只是虚假，是虚空而毫无益处的东西[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “耶和华”对应希伯来文神名 יהוה（YHWH）；也常拟音作“雅威”。
    reason: divine_name
  - marker: b
    text: “虚空”所译的希伯来词也可表达“虚妄”“空幻”或“徒然”；在本节的宗教语境中，可能暗指无用的偶像，但原词并不只限于偶像。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的专名“耶和华”，在正文中保留此处直接呼求的神圣名字；脚注说明其对应希伯来文四字神名。
- source_word: עֻזִּי
  choice: 我的力量
  rationale: 准确表达能力、力量之义，并在直接呼求中保持自然。
- source_word: מָעֻזִּי
  choice: 我的保障
  rationale: 该词指坚固、安全的庇护之处；“保障”既保留防护意味，也避免与下一词“避难所”重复。
- source_word: מְנוּסִי
  choice: 我的避难所
  rationale: 表现人在危险中逃往安全之处的意象，是现代中文自然而庄重的说法。
- source_word: בְּיוֹם צָרָה
  choice: 在患难之日
  rationale: 保留原文“日”的时间表达，同时用“患难”传达困苦、危急之意。
- source_word: גּוֹיִם
  choice: 列国
  rationale: 表达多个民族或国家的国际范围，不额外突出犹太人与外邦人的神学分类。
- source_word: מֵאַפְסֵי אָרֶץ
  choice: 从地极
  rationale: 这是指大地最遥远之处的惯用表达；“地极”简洁、庄重且为现代中文读者熟悉。
- source_word: אַךְ
  choice: 实在只是
  rationale: “实在”表达强调和确认，“只是”同时保留该粒子可能具有的限制意味，适合后续并列内容。
- source_word: שֶׁקֶר
  choice: 虚假
  rationale: 希伯来文为集合性单数，指虚假的事物或谬妄；中文用“虚假”既自然，也不必强行复数化。
- source_word: נָחֲלוּ
  choice: 所承受的
  rationale: 保留从先辈承接产业或传统的继承含义，又比“继承了”更自然地统摄后面的并列宾语。
- source_word: אֲבוֹתֵינוּ
  choice: 我们的祖先
  rationale: 此处泛指列国的先辈；“祖先”在现代中文中自然准确，也不把所指不必要地限于男性父辈。
- source_word: הֶבֶל
  choice: 虚空
  rationale: 该词表示气息般的空幻、虚妄或徒然；保留宽泛语义，不在正文中直接缩窄为“偶像”。
- source_word: וְאֵין בָּם מוֹעִיל
  choice: 毫无益处的东西
  rationale: 自然表达这些承袭之物不能带来任何实际益处；复数代词所指在中文中以“东西”显明。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。正文采用中文传统且广为人知的专名“耶和华”，而以脚注交代原文形式及另一常见拟音，避免改译为称号“主”。
- issue: הֶבֶל 是否明确译作偶像
  choice: 虚空
  alternative: 虚妄的偶像
  rationale: 上下文确实涉及祖传的虚假宗教，因而可能暗指偶像；但该词本身范围较广，可指空幻、虚妄或徒然。正文保留这种开放性，脚注再提示语义范围。
- issue: אַךְ 在此强调还是限制
  choice: 实在只是
  alternative: 确实
  rationale: 该粒子可以表示强调，也可以含“只有”的限制作用；组合译法保留两方面，不把经文过早限定为单一理解。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。开头以三个同位称谓形成祷告式节奏；后半句保留列国从地极归向神并承认祖传虚妄的张力。正文所有脚注标记均已对应列出。
