  text: 你也不可进入宴饮的场所，与他们同坐，一同吃喝。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “宴饮的场所”也可译作“宴会场所”或“欢庆的场所”。这个希伯来语表达指人们聚集欢宴、吃喝的地方。
