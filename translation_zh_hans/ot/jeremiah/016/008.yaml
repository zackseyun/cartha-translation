lexical_decisions:
- source_word: וּבֵית מִשְׁתֶּה
  choice: 宴饮之家
  rationale: 保留“家/场所”的具体意象，并用“宴饮”表达 מִשְׁתֶּה 所指欢宴中的吃喝；句首 וּ 依上下文译为“也”，承接前面的禁令。
- source_word: לֹא תָבוֹא
  choice: 不可进入
  rationale: 未完成式第二人称阳性单数在此表达禁令；“不可”保持庄重而自然的训令语气。
- source_word: לָשֶׁבֶת אוֹתָם
  choice: 与他们同坐
  rationale: לָשֶׁבֶת 表目的，即入内就座；אוֹתָם 在这一搭配中表达共同参与，译为“与他们”，而“同坐”自然呈现宴席中的社交参与。
- source_word: לֶאֱכֹל וְלִשְׁתּוֹת
  choice: 吃喝
  rationale: 两个并列不定式说明入席的目的；汉语惯用并列的“吃喝”，简洁保留两项行动及原文节奏。
