  text: וּ/מֵ֨תוּ גְדֹלִ֧ים וּ/קְטַנִּ֛ים בָּ/אָ֥רֶץ הַ/זֹּ֖את לֹ֣א יִקָּבֵ֑רוּ וְ/לֹֽא יִסְפְּד֣וּ לָ/הֶ֔ם וְ/לֹ֣א יִתְגֹּדַ֔ד וְ/לֹ֥א יִקָּרֵ֖חַ לָ/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/016/006.yaml
  text: Both great and small will die in this land[a]. They will not be buried, and no one will mourn for them, or cut himself[b], or make himself bald for them.
translation:
  language: zh_hans
  text: 无论大小[a]，都必死在这地。他们不会被埋葬，也没有人为他们哀悼；也没有人为了他们割伤自己或剃光头[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“大者和小者”；可指社会地位的高低，也可泛指各类人，包括年龄上的大小。
    reason: lexical_alternative
  - marker: b
    text: 割伤身体和剃光头都是古代为死者哀悼的习俗。
    reason: cultural_note
lexical_decisions:
- source_word: וּמֵתוּ
  choice: 都必死
  rationale: מות的基本义是“死”；在先知宣告的语境中，连词加完成式指向将来必然发生的事，用“必死”自然表达其预告和确定性。
- source_word: גְדֹלִים וּקְטַנִּים
  choice: 无论尊贵的还是卑微的
  rationale: 这组对举涵盖不同地位的人；此处译出社会身份层面的含义，同时保留其概括所有人的修辞作用。
- source_word: בָּאָרֶץ הַזֹּאת
  choice: 在这地
  rationale: אֶרֶץ在此指当下所说的地域；“这地”简洁庄重，也符合耶利米书的地理与盟约语境。
- source_word: לֹא יִקָּבֵרוּ
  choice: 无人埋葬
  rationale: 原文为קבר的被动式，直指死者得不到安葬；中文以“无人埋葬”自然承接复数死者，并显出无人施行葬礼。
- source_word: וְלֹא יִסְפְּדוּ לָהֶם
  choice: 也无人为他们哀悼
  rationale: 第三人称复数动词可作不定主语，中文用“无人”准确表达没有人为死者举行哀悼。
- source_word: וְלֹא יִתְגֹּדַד
  choice: 无人为他们割伤自己
  rationale: התגדד在此指丧俗中的自割身体；“割伤自己”保留反身动作和具体文化行为。
- source_word: וְלֹא יִקָּרֵחַ לָהֶם
  choice: 也无人为他们剃成光头
  rationale: 该词指为哀悼而使自己秃头；“剃成光头”在现代汉语中清楚表达这一具体丧俗，而不泛化为一般哀礼。
theological_decisions:
- issue: 是否在正文中保留具体的哀丧习俗
  choice: 明确译出割伤自己和剃成光头
  alternative: 概括译为“举行哀悼仪式”
  rationale: 原文刻意列举具体身体行为，以加强审判宣告中无人哀悼的惨烈程度；概括处理会削弱其文化具体性和修辞力度。
- issue: גְדֹלִים וּקְטַנִּים所指是身份还是年龄
  choice: 正文译作“尊贵的……卑微的”，按社会地位理解
  alternative: 译作“大人和小孩”，按年龄理解
  rationale: 该固定对举常表示社会地位高低；不过词语本身可有年龄含义，因此以脚注保留另一种可能。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。以“无人”处理希伯来语不定复数主语，使四项否定在中文中结构清楚；保留自割和剃秃等具体丧俗，不作神学化或委婉化处理。
