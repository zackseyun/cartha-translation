  rationale: 修订仅处理汉语表达和空间结构：以“渔夫”替换较迂回的“打鱼的人”，以“捕获”避免无根据的“上来”，以“猎捕”保留狩猎动作，并使三个地点的介词结构一致。对象仍保留为“他们”，不判定其身份或行动的具体历史指向。
