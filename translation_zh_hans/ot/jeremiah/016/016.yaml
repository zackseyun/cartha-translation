source:
  edition: WLC
  text: הִנְ/נִ֨י שֹׁלֵ֜חַ ל/דוגים רַבִּ֛ים נְאֻם יְהוָ֖ה וְ/דִיג֑וּ/ם וְ/אַֽחֲרֵי כֵ֗ן אֶשְׁלַח֙ לְ/רַבִּ֣ים צַיָּדִ֔ים וְ/צָד֞וּ/ם מֵ/עַ֤ל כָּל הַר֙ וּ/מֵ/עַ֣ל כָּל גִּבְעָ֔ה וּ/מִ/נְּקִיקֵ֖י הַ/סְּלָעִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/016/016.yaml
  text: Look[a], I am sending for many fishermen, declares Yahweh, and they will catch them; and after that I will send for many hunters[b], and they will hunt them from every mountain and from every hill and from the clefts of the rocks.
translation:
  language: zh_hans
  text: 看哪，我要召来许多渔夫[a]——雅威宣告——他们要捕获他们。此后，我要召来许多猎人；他们要从每一座山、每一座山冈和岩石的缝隙中猎捕他们。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “渔夫”也可译作“捕鱼的人”。
    reason: lexical_alternative
  - marker: b
    text: 渔夫和猎人的图像描绘人从每一处藏身之地被搜寻并抓获；本节本身没有明确说明这些由雅威差遣之人的身份。
    reason: cultural_note
lexical_decisions:
- source_word: הִנְנִי
  choice: 看哪，我要
  rationale: 引出庄严的神谕，并与分词“差遣”结合表达迫近的行动；“看哪”保留指示和唤起注意的力量。
- source_word: שֹׁלֵחַ לְדוגים רַבִּים
  choice: 我要召来许多打鱼的人
  rationale: לְ与差遣动词在此可表达召集、差来执行任务；“打鱼的人”保留具体职业意象，也避免“渔夫”可能带来的性别限定。
- source_word: נְאֻם יְהוָה
  choice: 雅威宣告
  rationale: 保留先知书惯用宣告公式的庄重感，并直接音译神名。
- source_word: וְדִיגוּם
  choice: 他们要把他们捕捉上来
  rationale: 保留דוג的捕鱼动作及宾语复数后缀；“捕捉上来”使捕鱼意象比单说“抓住”更清楚。
- source_word: וְאַחֲרֵי כֵן
  choice: 此后
  rationale: 自然、简洁地标明打鱼者与猎人行动的先后次序。
- source_word: אֶשְׁלַח לְרַבִּים צַיָּדִים
  choice: 我要召来许多猎人
  rationale: 与前半句形成平行，并保留צַיָּדִים的具体狩猎意象。
- source_word: וְצָדוּם
  choice: 他们要……猎取他们
  rationale: 以“猎取”对应狩猎动词及其复数宾语，保持原文猎人／猎取的词根呼应。
- source_word: מֵעַל כָּל הַר וּמֵעַל כָּל גִּבְעָה
  choice: 从各山上、各冈上
  rationale: “从……上”体现מֵעַל的空间关系；重复“各”传达无一遗漏的范围。
- source_word: וּמִנְּקִיקֵי הַסְּלָעִים
  choice: 和岩石缝中
  rationale: 以自然现代汉语表达岩石的裂缝、罅隙，并保留藏匿处的具体图景。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名；“雅威”以现代汉语音译保留其专名性质。
- issue: 打鱼和打猎意象所指的行动者与对象
  choice: 保留具体意象及复数代词“他们”，不在正文中明定身份
  alternative: 明译为敌军搜捕百姓；明译为使者招聚流亡者
  rationale: 本节明确说这些人由雅威召来，并描绘其从各处捕捉、猎取对象，却没有在本节内直接给行动者命名；不补出身份可保存原文的解释张力。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。“看哪”保留先知宣告的醒目语气；破折号标出插入的神谕公式。正文重复“他们”以保存希伯来语宾语指向的开放性，不擅自补明被捕者或受差者的身份。
