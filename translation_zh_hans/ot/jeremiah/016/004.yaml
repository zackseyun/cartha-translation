  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: מְמוֹתֵ֨י תַחֲלֻאִ֜ים יָמֻ֗תוּ לֹ֤א יִסָּֽפְדוּ֙ וְ/לֹ֣א יִקָּבֵ֔רוּ לְ/דֹ֛מֶן עַל פְּנֵ֥י הָ/אֲדָמָ֖ה יִֽהְי֑וּ וּ/בַ/חֶ֤רֶב וּ/בָֽ/רָעָב֙ יִכְל֔וּ וְ/הָיְתָ֤ה נִבְלָתָ/ם֙ לְ/מַאֲכָ֔ל לְ/ע֥וֹף הַ/שָּׁמַ֖יִם וּ/לְ/בֶהֱמַ֥ת הָ/אָֽרֶץ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/016/004.yaml
  text: They will die of deadly diseases[a]. They will not be mourned or buried. They will become dung on the surface of the ground. They will be consumed by the sword and by famine[c][b], and their carcasses will become food for the birds of the heavens and for the beasts of the earth.
translation:
  language: zh_hans
  text: 他们必死于恶疾[a]，无人为他们哀悼，也无人埋葬。他们必成为地面上的粪土；他们必被刀剑和饥荒灭尽，他们的尸首必成为天上飞鸟和地上走兽的食物。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译近似“死于疾病之死”，意思是因严重、致命的疾病而死。
    reason: lexical_alternative
lexical_decisions:
- source_word: מְמוֹתֵי תַחֲלֻאִים יָמֻתוּ
  choice: 他们必死于恶疾
  rationale: מְמוֹתֵי תַחֲלֻאִים直译近似“疾病之死”，是强调因严重疾病而死的希伯来语表达；“死于恶疾”既自然，也保留其严厉意味。
- source_word: לֹא יִסָּפְדוּ וְלֹא יִקָּבֵרוּ
  choice: 无人为他们哀悼，也无人埋葬
  rationale: 两个被动式分别指死者得不到哀悼仪式和安葬；转为现代汉语的无主句，清楚表达同一含义。
- source_word: לְדֹמֶן עַל פְּנֵי הָאֲדָמָה יִהְיוּ
  choice: 他们必成为地面上的粪土
  rationale: דֹמֶן指粪便或粪土，带有强烈的羞辱和弃置意象；“地面上”自然传达עַל פְּנֵי הָאֲדָמָה的表面含义。
- source_word: וּבַחֶרֶב וּבָרָעָב יִכְלוּ
  choice: 他们必被刀剑和饥荒灭尽
  rationale: כלה在此表示耗尽、除灭；被动表达保留刀剑与饥荒作为毁灭手段的结构，“灭尽”也符合审判语境。
- source_word: נִבְלָתָם
  choice: 他们的尸首
  rationale: נְבֵלָה指死尸或尸体，在暴露给食腐动物的语境中含有受辱意味；“尸首”庄重而不弱化原文。
- source_word: לְעוֹף הַשָּׁמַיִם וּלְבֶהֱמַת הָאָרֶץ
  choice: 天上飞鸟和地上走兽
  rationale: 采用现代汉语中自然且具有经文庄重感的对应表达，并保留“天上／地上”的平行结构。
theological_decisions: []
