base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/016/017.yaml
  text: For my eyes are on all their ways[a]; they are not hidden from me[c][b], and their iniquity is not concealed from before my eyes.
translation:
  language: zh_hans
  text: 因为我的眼目注视着他们的一切道路[a]；这些道路在我面前无一隐藏，他们的罪孽[b]也没有在我眼前隐藏。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “道路”在这里指他们的行为和生活方式。
    reason: lexical_alternative
  - marker: b
    text: “罪孽”所译的希伯来词既可指邪恶的行为，也可指由此产生的罪责。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 在上下文中引出前述宣告的理由；“因为”自然保留其因果、解释作用。
- source_word: עֵינַי עַל
  choice: 我的眼目注视着
  rationale: 保留“我的眼目”这一拟人化意象，同时以“注视着”自然表达介词 עַל 所表示的定向关注。
- source_word: כָּל דַּרְכֵיהֶם
  choice: 他们的一切道路
  rationale: 保留 דֶּרֶךְ 的“道路”隐喻；这里所指包括人的行为和生活方式，不直接释译为“所做的一切”。
- source_word: לֹא נִסְתְּרוּ מִלְּפָנָי
  choice: 这些道路在我面前无一隐藏
  rationale: 复数表述与“道路”呼应，并保留 מִלְּפָנָי 所含“在我面前”的空间性、临在性意象。
- source_word: עֲוֹנָם
  choice: 他们的罪孽
  rationale: עָוֹן 可指邪恶行为，也可指由此产生的罪责；“罪孽”保留其道德分量，同时不把含义限缩为单纯的“罪责”。
- source_word: וְלֹא נִצְפַּן ... מִנֶּגֶד עֵינָי
  choice: 也没有藏在我眼前
  rationale: 保留单数被动意义及“我眼前”的具体意象，以自然汉语再现与前半句相呼应的隐藏主题。
theological_decisions:
- issue: 用身体意象表达上帝的全知与鉴察
  choice: 保留“我的眼目注视着”及“藏在我眼前”的具体意象
  alternative: 意译为“他们所做的一切我都知道”或“没有什么能逃过我的注意”
  rationale: 原文借“眼目”表达上帝对人行为的完全鉴察；保留意象可维持先知话语的修辞力度，又不额外抽象化其神学表达。
- issue: עָוֹן 的语义范围
  choice: 罪孽
  alternative: 罪责；罪恶；罪
  rationale: 上下文强调人的不义在上帝面前完全显露。“罪孽”既可指有罪的行为，也不排除其所带来的罪责，较能保存原词在此处的语义张力。
translation_notes:
  register: 采用现代、庄重而清楚的普通话。“眼目”“罪孽”保留经文的诗性与道德分量；句法以两个平行分句呈现原文反复出现的“隐藏”意象。
