  text: וְ/לֹֽא יִפְרְס֥וּ לָ/הֶ֛ם עַל אֵ֖בֶל לְ/נַחֲמ֣/וֹ עַל מֵ֑ת וְ/לֹֽא יַשְׁק֤וּ אוֹתָ/ם֙ כּ֣וֹס תַּנְחוּמִ֔ים עַל אָבִ֖י/ו וְ/עַל אִמּֽ/וֹ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/016/007.yaml
  text: No one will break bread for them in mourning[a], to comfort him for the dead[b], and no one will give them the cup of consolation to drink for his father or for his mother.
translation:
  language: zh_hans
  text: 没有人会在哀悼中为他们掰饼[a]，以安慰那人因死者而有的伤痛；也没有人会因他的父亲或母亲去世，给他们喝安慰之杯[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“与他们分食食物”。希伯来语动词的字面意思是“分开、掰开”；这里很可能指哀丧期间按习俗供应或分享食物。
    reason: lexical_alternative
  - marker: b
    text: “安慰之杯”很可能指有人去世后，为安慰哀悼者而按习俗递上的饮品。
    reason: cultural_note
lexical_decisions:
- source_word: יִפְרְסוּ
  choice: 掰饼
  rationale: פרס的基本意思是“分开、掰开”。本处没有明说宾语，但哀丧语境表明这是指丧葬期间的分食习俗。“掰饼”既保留希伯来的具体意象，也可由脚注说明其文化含义。
- source_word: עַל אֵבֶל
  choice: 在哀悼时
  rationale: 介词עַל在这里标明哀丧这一场合或处境；译成“在哀悼时”符合现代汉语表达。
- source_word: לְנַחֲמוֹ
  choice: 安慰那人
  rationale: נחם的Piel形式表示“安慰、劝慰”。原文后缀为第三人称阳性单数，因此用“那人”保留它与前文复数“他们”的数差异，避免擅自统一。
- source_word: עַל מֵת
  choice: 为死者
  rationale: 该短语指出安慰所针对的丧亡缘由；“为死者”简洁地保留原文表达，未擅自补定死者身份。
- source_word: יַשְׁקוּ אוֹתָם
  choice: 递给他们……喝
  rationale: שקה的Hiphil形式意为“使喝、给……喝”。“递给他们……喝”在汉语中自然地表达了使役含义，也与后面的“杯”搭配。
- source_word: כּוֹס תַּנְחוּמִים
  choice: 安慰之杯
  rationale: 直译为“安慰之杯”，很可能指丧礼中给哀伤者饮用、以示慰问的饮品。此译保留原文文化意象，并由脚注加以解释。
- source_word: עַל אָבִיו וְעַל אִמּוֹ
  choice: 因他父亲或母亲去世
  rationale: 重复的עַל表示哀悼的缘由，两个第三人称阳性单数后缀均译为“他”。上下文表明是在父亲或母亲死亡的情形下；汉语用“或”自然表达任一父母去世的分举意义。
theological_decisions:
- issue: 原文复数与单数代词的交替
  choice: 保留“他们／那人／他父亲或母亲”的交替
  alternative: 为行文一致而全部译成复数
  rationale: לָהֶם、אוֹתָם是复数，而לְנַחֲמוֹ、אָבִיו、אִמּוֹ是明确的阳性单数。保留这一张力忠于马所拉文本，不以文体整齐为由改写其指称。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“掰饼”和“安慰之杯”保留原文的具体文化意象，脚注帮助普通读者理解；同时刻意保留希伯来文复数与单数指称之间的转换。
