  to: “我要先加倍追讨他们的罪孽和罪恶，因为他们用自己可憎之物的尸骸[a]玷污了我的土地；他们的可憎之物又充满了我的基业。”
  rationale: 修订避免将“尸骸”的归属表达为不自然的“偶像的尸骸”，在正文保留原文的语义宽度，并以脚注呈现偶像这一常见语境性理解。另将惩罚表达改为更合乎汉语搭配的“加倍追讨”，并用“基业”传达神对土地的所属与继承意象。
