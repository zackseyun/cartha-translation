id: JER.16.18
reference: Jeremiah 16:18
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/שִׁלַּמְתִּ֣י רִֽאשׁוֹנָ֗ה מִשְׁנֵ֤ה עֲוֺנָ/ם֙ וְ/חַטָּאתָ֔/ם עַ֖ל חַלְּלָ֣/ם אֶת אַרְצִ֑/י בְּ/נִבְלַ֤ת שִׁקּֽוּצֵי/הֶם֙ וְ/תוֹעֲב֣וֹתֵי/הֶ֔ם מָלְא֖וּ אֶת נַחֲלָתִֽ/י־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/016/018.yaml
  text: And first I will repay double their iniquity and their sin[a], because they have defiled my land with the carcasses of their detestable idols and have filled my inheritance with their abominations.
translation:
  language: zh_hans
  text: “我要先加倍追讨他们的罪孽和罪恶，因为他们用自己可憎之物的尸骸[a]玷污了我的土地；他们的可憎之物又充满了我的基业。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“可憎偶像的尸骸”。这里的希伯来语“可憎之物”在先知书的语境中常指偶像。
    reason: 保留שִׁקּוּצִים较宽泛、较字面的所指，同时说明其在本段语境中可能指偶像。
lexical_decisions:
- source_word: וְשִׁלַּמְתִּי
  choice: 我要……报应
  rationale: 此处 piel 词形表达按行为施行偿还或惩罚；“报应”自然地保留了司法性的追讨含义。
- source_word: רִאשׁוֹנָה
  choice: 首先
  rationale: 按副词理解，表示上帝先施行报应；“首先”简洁清楚，同时不把后续内容明说出来。
- source_word: מִשְׁנֵה
  choice: 加倍
  rationale: 该词表示双倍或双重的分量；“加倍报应”在现代汉语中自然，并保留惩罚加重的力度。
- source_word: עֲוֺנָם וְחַטָּאתָם
  choice: 他们的罪孽和罪恶
  rationale: 分别译出两个近义而不完全相同的罪责词，保留希伯来语的并列与道德、罪责含义；后者虽为单数形式，在此具有集合意义。
- source_word: עַל
  choice: 因为
  rationale: 此处引出施行报应的原因，译为“因为”最符合现代汉语因果表达。
- source_word: חַלְּלָם אֶת־אַרְצִי
  choice: 他们……玷污了我的土地
  rationale: 该动词在这里表示使神的土地受到礼仪和道德上的亵渎；“玷污”兼顾土地污染的意象与宗教含义。
- source_word: בְּנִבְלַת שִׁקּוּצֵיהֶם
  choice: 用可憎偶像的尸骸
  rationale: נִבְלָה 指尸体或尸骸；שִׁקּוּצִים 在先知性反偶像语境中常指可憎的偶像。“可憎偶像的尸骸”保留强烈的死亡、污秽意象，并在脚注注明较字面的译法。
- source_word: וְתוֹעֲבוֹתֵיהֶם
  choice: 他们的可憎之物
  rationale: 该词可指令人憎恶的宗教物件或行为；采用“可憎之物”保留其所指范围，不将这里进一步限定为偶像或仪式。
- source_word: מָלְאוּ אֶת־נַחֲלָתִי
  choice: 让……充满了我的产业
  rationale: נַחֲלָה 在此指这地是上帝所属的产业；“我的产业”保留圣约和土地归属的意味。
theological_decisions:
- issue: שִׁקּוּצֵיהֶם 是否应在正文明确指偶像
  choice: 正文译作“可憎偶像”
  alternative: 可憎之物
  rationale: 在耶利米书的先知性论述中，该词常指偶像；明确译出“偶像”可帮助现代读者把握这里最可能的所指，但脚注保留较宽泛、较字面的理解。
- issue: מִשְׁנֵה 所表达的惩罚力度
  choice: 加倍报应
  alternative: 报应两次／双重报应
  rationale: 原文表达双倍的偿还或惩罚，不说明其计算方式；“加倍报应”保留力度，也避免引入两次分开的惩罚这一额外解释。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“罪孽和罪恶”保留原文近义并列；“尸骸”维持原文尖锐的污秽意象；“我的土地／我的产业”的重复则保留上帝对这地的所有权与关系性表达。
