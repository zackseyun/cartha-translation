  text: וְ/הֵטַלְתִּ֣י אֶתְ/כֶ֗ם מֵ/עַל֙ הָ/אָ֣רֶץ הַ/זֹּ֔את עַל הָ/אָ֕רֶץ אֲשֶׁר֙ לֹ֣א יְדַעְתֶּ֔ם אַתֶּ֖ם וַ/אֲבֽוֹתֵי/כֶ֑ם וַ/עֲבַדְתֶּם שָׁ֞ם אֶת אֱלֹהִ֤ים אֲחֵרִים֙ יוֹמָ֣ם וָ/לַ֔יְלָה אֲשֶׁ֛ר לֹֽא אֶתֵּ֥ן לָ/כֶ֖ם חֲנִינָֽה־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/016/013.yaml
  text: So I will cast you out from this land onto a land that neither you nor your fathers have known[a], and there you will serve other gods day and night[d][c][b], for I will show you no favor.
translation:
  language: zh_hans
  text: 我要把你们从这片土地上抛到一片你们和你们的父辈[b]都不认识的土地上[a]。在那里，你们要昼夜侍奉别的神[c]，因为我不会恩待你们[d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “抛到”也可按其逐出之意译作“扔出去”或“赶出去”。原文动词语气强烈，描写他们被强行逐出这地。
    reason: lexical_alternative
  - marker: b
    text: “父辈”也可译作“祖先”。原文直译为“父亲们”。
    reason: lexical_alternative
  - marker: c
    text: “侍奉别的神”也可译作“敬拜别的神”。原文动词通常指服事，在这里也包含敬拜性的服事。
    reason: lexical_alternative
  - marker: d
    text: “恩待”也可译作“施恩”或“怜悯”。原文名词指恩惠、眷顾或恩慈；此处的连接关系也可理解为与前句紧密相连。
    reason: lexical_and_syntactic_alternative
lexical_decisions:
- source_word: וְהֵטַלְתִּי
  choice: 我要把……抛出去
  rationale: 使役形表达强力使之被抛出；“抛出去”既保留暴力驱逐的力度，也符合现代汉语表达。
- source_word: מֵעַל הָאָרֶץ הַזֹּאת עַל הָאָרֶץ
  choice: 从这片土地上……到一片……土地上
  rationale: 保留原文“从这地之上”到“另一地之上”的方向对照，同时使汉语自然。
- source_word: אֲשֶׁר לֹא יְדַעְתֶּם אַתֶּם וַאֲבוֹתֵיכֶם
  choice: 你们和你们的父辈都不认识
  rationale: 按 ידע 的通常含义译为“认识”；“都不”自然表达你们与父辈均未认识那地。
- source_word: וַעֲבַדְתֶּם
  choice: 你们要……侍奉
  rationale: עבד 在以神为宾语时可兼有服事和敬拜之意；“侍奉”保留这一区间，不限定其出于自愿还是受流亡环境所迫。
- source_word: יוֹמָם וָלַיְלָה
  choice: 昼夜
  rationale: 简洁保留原文“白日和夜晚”的持续性惯用语。
- source_word: חֲנִינָה
  choice: 恩待
  rationale: 该名词表示恩惠、眷顾或施恩；“恩待”自然传达上帝不再赐予眷顾，且不引入后期技术性术语。
theological_decisions:
- issue: וַאֲבוֹתֵיכֶם 的亲属范围
  choice: 父辈
  alternative: 祖先
  rationale: 原文采用阳性亲属词“父亲们”；“父辈”保留其字面形象，而脚注说明在语境中也可泛指祖先。
- issue: 流亡中对别神的 עבד
  choice: 侍奉别的神
  alternative: 敬拜别的神
  rationale: “侍奉”保存原词较宽的语义以及经文的神学张力，不武断判定这种行为完全是主动敬拜还是受异地环境驱使。
- issue: 末句 אֲשֶׁר 的逻辑关系
  choice: 因为我不会恩待你们
  alternative: 以致我不会恩待你们
  rationale: 结合上下文，取因果解释最为通顺；但该关系词本身可有关系性或结果性色彩，故在脚注保留可能性。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“抛出去”保留审判与强制驱逐的力度；重复“土地”以呈现原文从本地到异地的对照。“昼夜侍奉”简洁且具有经文语体，但普通读者仍易理解。
