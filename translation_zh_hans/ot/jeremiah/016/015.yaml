source:
  edition: WLC
  text: כִּ֣י אִם חַי יְהוָ֗ה אֲשֶׁ֨ר הֶעֱלָ֜ה אֶת בְּנֵ֤י יִשְׂרָאֵל֙ מֵ/אֶ֣רֶץ צָפ֔וֹן וּ/מִ/כֹּל֙ הָֽ/אֲרָצ֔וֹת אֲשֶׁ֥ר הִדִּיחָ֖/ם שָׁ֑מָּ/ה וַ/הֲשִֽׁבֹתִי/ם֙ עַל אַדְמָתָ֔/ם אֲשֶׁ֥ר נָתַ֖תִּי לַ/אֲבוֹתָֽ/ם־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/016/015.yaml
  text: but[a], ‘As Yahweh lives[b], who brought up the children of Israel from the land of the north and from all the lands where he had driven them.’ For I will bring them back to their own land that I gave to their fathers.
translation:
  language: zh_hans
  text: 而要说[a]：“雅威是永活的；他曾把以色列人从北方之地和从他赶逐他们所到的各地领上来。”因为我要把他们带回自己的土地，就是我赐给他们列祖[b]的土地。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “而要说”也可译作“而是要说”。原文承接上一节“不再说……而要说……”的对比结构。
    reason: 说明跨节省略及对比语气。
  - marker: b
    text: “列祖”也可译作“祖先”；原文直译为“父辈”或“父亲们”。
    reason: 说明原文的阳性亲属用语及现代汉语可选译法。
lexical_decisions:
- source_word: כִּי אִם
  choice: 而要说
  rationale: 该短语承接上一节“不再说……而要说……”的对比结构；补出由上文省略的“说”，使中文在单节呈现时仍自然清楚。
- source_word: חַי יְהוָה
  choice: 我指着永活的雅威起誓
  rationale: 这是希伯来语常见的起誓公式。中文补出“起誓”，明确其语用功能，同时保留“永活”与神名“雅威”。
- source_word: הֶעֱלָה
  choice: 领上来
  rationale: 保留 עלה“上来”的方向意象及其与出埃及、归回叙事的呼应；“领”表达使役意义。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 现代汉语中自然地指以色列群体，不把“众子”误解为仅限男性。
- source_word: מֵאֶרֶץ צָפוֹן
  choice: 从北方之地
  rationale: 贴近原文的地理表达，不擅自认定具体的现代地域。
- source_word: וּמִכֹּל הָאֲרָצוֹת אֲשֶׁר הִדִּיחָם שָׁמָּה
  choice: 以及从他赶逐他们所到的各地
  rationale: 保留“各地”、强制驱逐的力度和神作为行动者的含义，也自然体现 שָׁמָּה“到那里”的方向意义。
- source_word: וַהֲשִׁבֹתִים
  choice: 我要把他们带回
  rationale: 该使役形式表示使他们归回；“带回”比抽象的“恢复”更直接，也保留实际归返的意义。
- source_word: עַל אַדְמָתָם
  choice: 回自己的土地
  rationale: אַדָמָה 可指土地或土壤；此处关乎归回故土，“自己的土地”自然表达归属关系。
- source_word: לַאֲבוֹתָם
  choice: 给他们列祖
  rationale: “列祖”保留原文阳性复数及其圣约历史色彩；同时用脚注说明较通俗的可选译法。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；音译“雅威”明确保留专名性质，不以称号代替。
- issue: 起誓公式 חַי יְהוָה 的表达
  choice: 我指着永活的雅威起誓
  alternative: 雅威是永活的
  rationale: 选择能让现代读者明确识别为誓言的译法，同时不削弱“雅威活着”这一公式本身的神学内容。
- issue: לַאֲבוֹתָם 的性别与圣约含义
  choice: 他们列祖
  alternative: 他们祖先
  rationale: 原文明确使用“父亲”一词的复数形式，且语境指向承受应许的先祖；“列祖”保留这一历史与圣约色彩，而脚注承认“祖先”这一自然译法。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“北方之地”“列祖”略带经文语体，但仍易于普通读者理解；破折号用于清楚衔接起誓公式与修饰雅威的关系从句。
