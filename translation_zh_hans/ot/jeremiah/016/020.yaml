base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/016/020.yaml
  text: Can a man make gods for himself? Yet they are not gods[a].
translation:
  language: zh_hans
  text: 人岂能为自己造神明呢？但它们并不是神明。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“人会为自己造神明吗？但它们并不是神明。”
    reason: 保留 הֲיַעֲשֶׂה 可作一般疑问，以及 וְ 可直接译作转折连词的表达可能。
lexical_decisions:
- source_word: הֲ/יַעֲשֶׂה
  choice: 岂能……造……呢
  rationale: 疑问词 הֲ 与未完成式 יַעֲשֶׂה 构成反问；“岂能……呢”自然传达不可置信和否定意味，同时不将其处理为单纯的现在或将来疑问。
- source_word: לּוֹ
  choice: 为自己
  rationale: 介词 ל 加第三人称阳性单数后缀在本语境中具有反身意味，指人为自己制造并拥有所敬奉的神明。
- source_word: אָדָם
  choice: 人
  rationale: 此处是单数泛指，现代汉语用“人”既保留普遍指称，也避免不必要地限定为男性。
- source_word: אֱלֹהִים
  choice: 神明
  rationale: 复数形式在此指人所制造的诸神或偶像所代表的神祇。“神明”能自然表达这类所谓的神，并与下句对其神性身份的否定相呼应。
- source_word: וְ/הֵמָּה
  choice: 其实它们
  rationale: וְ 加独立代词 הֵמָּה 引出强调性的对比。“其实”凸显反问之后的事实性否定；“它们”对应所造之物。
- source_word: לֹא אֱלֹהִים
  choice: 并不是神明
  rationale: 原文直接否定人造之物具有真正的神明身份。“并不是神明”清楚保留其论战力度，又不误译成单数的“不是上帝”。
theological_decisions:
- issue: 对人造偶像之神性地位的否定
  choice: 译文明确说人所造的所谓神明并不是真正的神明。
  alternative: 仅理解为嘲讽制造偶像的行为，而不涉及其是否为神。
  rationale: 末句 לֹא אֱלֹהִים 明确否定这些人造对象的神性身份。译文保留先知性反偶像崇拜的力度，但不加入原文没有的哲学术语。
translation_notes:
  register: 采用现代、庄重而通俗的普通话。“岂能……呢”具有适度的经文修辞感但仍属现代用法；“神明”避免将复数 אֱלֹהִים 与专指独一上帝的“上帝”混淆。脚注标记已在正文中以 [a] 标出。
