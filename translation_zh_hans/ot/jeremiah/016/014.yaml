  text: לָ/כֵ֛ן הִנֵּֽה יָמִ֥ים בָּאִ֖ים נְאֻם יְהוָ֑ה וְ/לֹֽא יֵאָמֵ֥ר עוֹד֙ חַי יְהוָ֔ה אֲשֶׁ֧ר הֶעֱלָ֛ה אֶת בְּנֵ֥י יִשְׂרָאֵ֖ל מֵ/אֶ֥רֶץ מִצְרָֽיִם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/016/014.yaml
  text: Therefore[a], behold, days are coming, declares Yahweh, when it will no longer be said, ‘As Yahweh lives[b], who brought up the sons of Israel from the land of Egypt,’
translation:
  language: zh_hans
  text: 因此，看哪，日子将到——这是雅威的宣告——人不再指着那领以色列子孙[a]从埃及地上来[b]的永生的雅威起誓[c]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语直译为“以色列的众子”；也可译作“以色列人”。
    reason: lexical_alternative
  - marker: b
    text: “领上来”也可译作“领出来”，指从埃及出来的事件。
    reason: lexical_alternative
  - marker: c
    text: 希伯来语这里是起誓公式，字面为“雅威是活的”；本译文按其起誓用法表达。
    reason: idiom_explanation
lexical_decisions:
- source_word: לָכֵן
  choice: 因此
  rationale: 保留与上文之间的推论关系，并符合先知宣告的庄重语体。
- source_word: הִנֵּה
  choice: 看哪
  rationale: 保留原文唤起听者注意、强调即将发生之事的功能。
- source_word: יָמִים בָּאִים
  choice: 日子将到
  rationale: 采用自然而庄重的汉语先知性表达，传达未来时刻即将来临。
- source_word: נְאֻם יְהוָה
  choice: 雅威宣告
  rationale: 传达先知书中正式的神谕公式，同时直接音译神名。
- source_word: וְלֹא יֵאָמֵר עוֹד
  choice: 那时，人不再说
  rationale: 将希伯来语无人称被动自然地转为汉语泛指主动句，不指定说话者。
- source_word: חַי יְהוָה
  choice: 我指着……永活的雅威起誓
  rationale: 这是固定的希伯来语起誓公式；在正文中表达其实际语用功能，同时以脚注保留字面形式。
- source_word: אֲשֶׁר הֶעֱלָה
  choice: 那位把……领上来
  rationale: 贴近עלה使役式“使上来、领上来”的空间意象；“领出来”也是符合出埃及语境的译法。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列子孙
  rationale: 保留原文“以色列之子”的亲属称谓，同时采用现代汉语圣经语境中可理解的集体表达。
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: 从埃及地
  rationale: 同时保留介词“从”和名词“地”，呼应出埃及叙事中的固定说法。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名；“雅威”较直接地呈现这一专名，而不以称号替代。
- issue: בְּנֵי יִשְׂרָאֵל的性别与集体含义
  choice: 以色列子孙
  alternative: 以色列人；以色列的众子
  rationale: “以色列子孙”既保留原文的亲属意象，也可自然指整个以色列群体；脚注给出更惯用的集体译法。
- issue: חַי יְהוָה作为起誓公式
  choice: 按起誓功能译为“我指着……永活的雅威起誓”
  alternative: 较字面译为“雅威是活的”或“永活的雅威”
  rationale: 该短语在此不是单纯陈述神活着，而是引出誓言的固定公式；功能性译法使现代读者不致误解，脚注同时保留其字面结构。
translation_notes:
  register: 采用现代、庄重而易懂的先知性语体。“看哪”保留原文的提示与强调作用；破折号标示插入的神谕公式。末尾用逗号，因为本节的对比句在下一节继续。
