  text: וְ/אָמַרְתָּ֣ אֲלֵי/הֶ֗ם עַל֩ אֲשֶׁר עָזְב֨וּ אֲבוֹתֵי/כֶ֤ם אוֹתִ/י֙ נְאֻם יְהוָ֔ה וַ/יֵּלְכ֗וּ אַֽחֲרֵי֙ אֱלֹהִ֣ים אֲחֵרִ֔ים וַ/יַּעַבְד֖וּ/ם וַ/יִּשְׁתַּחֲו֣וּ לָ/הֶ֑ם וְ/אֹתִ֣/י עָזָ֔בוּ וְ/אֶת תּוֹרָתִ֖/י לֹ֥א שָׁמָֽרוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/016/011.yaml
  text: Then you shall say to them, ‘Because your fathers abandoned me,’ declares the LORD, ‘and went after other gods, and served them, and bowed down to them. But me they abandoned, and my law they did not keep.’
translation:
  language: zh_hans
  text: 你要对他们说：‘耶和华宣告：这是因为你们的祖先离弃了我，去追随别的神明，侍奉它们，向它们下拜。他们离弃了我，也没有遵守我的律法。’
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲבוֹתֵיכֶם
  choice: 你们的祖先
  rationale: 此处泛指前代先祖；现代汉语用“祖先”比仅指父亲的“父辈”更清楚。
- source_word: נְאֻם יְהוָה
  choice: 耶和华宣告
  rationale: 保留先知书常见的神谕公式，并以传统、易识别的中文专名呈现四字神名。
- source_word: וַיֵּלְכוּ אַחֲרֵי
  choice: 去追随
  rationale: 既保留“走在……之后”的源语意象，也自然表达转而归从别神。
- source_word: וַיַּעַבְדוּם
  choice: 侍奉它们
  rationale: “侍奉”在敬拜语境中可表达对神明的宗教性服事；代词的无生命形式符合现代汉语对假神的贬抑性指称。
- source_word: וַיִּשְׁתַּחֲווּ לָהֶם
  choice: 向它们下拜
  rationale: 具体保留俯伏敬拜的动作，不笼统合并为“敬拜”。
- source_word: תּוֹרָתִי
  choice: 我的律法
  rationale: 在此指耶和华所赐、要求遵守的训诲和律法；“律法”符合耶利米书语境及中文圣经通用表达。
- source_word: שָׁמָרוּ
  choice: 遵守
  rationale: 在“律法”这一宾语下，“遵守”自然表达谨守、实行之义。
theological_decisions:
- issue: 末句重复“离弃我”的强调
  choice: 他们离弃了我，也没有遵守我的律法
  alternative: 至于我，他们却离弃了；我的律法，他们也没有遵守
  rationale: 保留源文对离弃耶和华和不守律法的并列控诉，同时避免现代汉语中过度生硬的宾语前置；不把两项罪行解释性地合并。
- issue: 别神代词的处理
  choice: 它们
  alternative: 他们
  rationale: 源文使用语法上的阳性复数代词，但现代汉语通常以“它们”指虚假神明；此选择不否认叙述中这些对象被人当作神来敬奉。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。句法保留因果关系、神谕公式，以及“追随—侍奉—下拜”的递进动作；以句号凸显后半句对离弃耶和华、不守律法的总结性控诉。
