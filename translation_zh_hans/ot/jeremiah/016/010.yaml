id: JER.16.10
reference: Jeremiah 16:10
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/הָיָ֗ה כִּ֤י תַגִּיד֙ לָ/עָ֣ם הַ/זֶּ֔ה אֵ֥ת כָּל הַ/דְּבָרִ֖ים הָ/אֵ֑לֶּה וְ/אָמְר֣וּ אֵלֶ֗י/ךָ עַל מֶה֩ דִבֶּ֨ר יְהוָ֤ה עָלֵ֨י/נוּ֙ אֵ֣ת כָּל הָ/רָעָ֤ה הַ/גְּדוֹלָה֙ הַ/זֹּ֔את וּ/מֶ֤ה עֲוֺנֵ֨/נוּ֙ וּ/מֶ֣ה חַטָּאתֵ֔/נוּ אֲשֶׁ֥ר חָטָ֖אנוּ לַֽ/יהוָ֥ה אֱלֹהֵֽי/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/016/010.yaml
  text: And when you tell this people all these words[a], and they say to you, ‘Why has Yahweh spoken against us all this great disaster? And what is our iniquity, and what is our sin that we have sinned against Yahweh our God?’
translation:
  language: zh_hans
  text: “当你把这一切话告诉这百姓时，他们会对你说：‘雅威为什么宣告这一切大灾祸要临到我们？我们的罪孽是什么？我们得罪雅威我们上帝，犯了什么罪？’”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: 当……时
  rationale: 这一习语引出将来会发生的情形；用“当……时”既保留时间含义，也符合现代汉语表达。
- source_word: תַגִּיד
  choice: 告诉
  rationale: נגד 的使役式在此指使人知道、告知；“告诉”自然清楚，适合先知向百姓传达信息的语境。
- source_word: לָעָם הַזֶּה
  choice: 这百姓
  rationale: 保留 עָם 的集合单数和先知话语中的指称方式；“这百姓”在庄重的现代汉语中自然。
- source_word: אֵת כָּל הַדְּבָרִים הָאֵלֶּה
  choice: 这一切话
  rationale: דְּבָרִים 在此指此前传达的先知信息；译作“话”比“事情”更能保留其言语性质。
- source_word: דִבֶּר יְהוָה עָלֵינוּ אֵת כָּל הָרָעָה הַגְּדוֹלָה הַזֹּאת
  choice: 雅威为什么宣告要使这一切大灾祸临到我们
  rationale: דבר על 在审判语境中带有针对某人宣告的含义；汉语补出“要使……临到”，清楚表达所宣告的灾祸以百姓为对象，同时不把 רָעָה 误解为上帝的道德邪恶。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见音译呈现四字神名，保留其专名性质，不以称号替代。
- source_word: כָּל הָרָעָה הַגְּדוֹלָה הַזֹּאת
  choice: 这一切大灾祸
  rationale: רָעָה 在本节审判语境中指严重的灾难或祸患，而非道德上的恶；“大灾祸”保留程度和审判意味。
- source_word: עֲוֺנֵנוּ
  choice: 我们的罪孽
  rationale: עָוֹן 可指罪孽或罪责；“罪孽”保留其道德和神学分量，并与后面的 חַטָּאת 有一定词汇区别。
- source_word: וּמֶה חַטָּאתֵנוּ אֲשֶׁר חָטָאנוּ
  choice: 我们犯了什么罪
  rationale: 将同根名词和动词自然地表达为“犯了什么罪”，既保留原文强调，也避免生硬重复。
- source_word: לַיהוָה אֱלֹהֵינוּ
  choice: 得罪了雅威我们的上帝
  rationale: לְ 与 חטא 连用时表示犯罪所冒犯的对象；汉语“得罪了”自然传达关系性的冒犯。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。采用“雅威”保留专名性质，并避免用称号取代；“耶和华”是传统形式，但较不贴近通常重建的读音。
- issue: 审判语境中 רָעָה 的含义
  choice: 灾祸
  alternative: 恶；灾难
  rationale: 上下文所指是将临到百姓的审判性祸患，不是说雅威具有道德上的恶；“灾祸”准确保留负面后果和审判意味。
- issue: דִבֶּר ... עָלֵינוּ 的表达
  choice: 宣告要使……临到我们
  alternative: 向我们说；宣告攻击我们
  rationale: 介词 עַל 在此使宣告带有针对百姓的不利方向。译文明确呈现灾祸临到他们，但不额外判定执行方式。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留先知语境中的“这百姓”和“这一切话”，并以直接问句呈现百姓对审判缘由的质询。
