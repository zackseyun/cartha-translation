revisions:
- from: “当你把这一切话告诉这百姓时，他们会问你：‘雅威为什么宣告要使这一切大灾祸临到我们？我们有什么罪孽？我们犯了什么罪，得罪了雅威我们的上帝？’”
  to: “当你把这一切话告诉这百姓时，他们会对你说：‘雅威为什么宣告这一切大灾祸要临到我们？我们的罪孽是什么？我们得罪雅威我们上帝，犯了什么罪？’”
  rationale: 修订避免将“宣告”扩展为明确的使役行动，同时保留灾祸将临到百姓的原文语境；并调整说话引介和末句语序，以更清楚、自然地对应希伯来文的问句结构及“罪／得罪”的关联。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T07:28:43Z'
review_pass:
  verdict: revise
  source_fidelity: 译文整体准确传达了将来的情境、向“这百姓”传告信息、雅威所宣告的大灾祸，以及百姓对自身罪责的追问。惟“宣告要使……临到我们”将原文“雅威向/针对我们宣告这一切大灾祸”的说话行为明确扩展为使役行动；虽然符合语境，却比原文更具体。并且“他们会问你”可更贴近原文作“他们会对你说”。
  naturalness: 整体庄重、清楚，符合现代标准汉语。将末句改为“我们得罪雅威我们上帝，犯了什么罪？”可更自然地保留原文“罪”与“得罪”的关联，而不造成两个并列谓语的轻微歧义。
  terminology: “雅威”一致对应 יהוה；“上帝”适合 אֱלֹהֵינוּ；“罪孽”与“罪”保留了 עָוֹן 和 חַטָּאת 的区分；“大灾祸”准确表达审判语境中的 רָעָה。
  issues:
  - severity: medium
    issue: “宣告要使这一切大灾祸临到我们”加入了“使……临到”的明确使役表达。
    rationale: 原文动词是“说/宣告”，配合“针对我们”和灾祸宾语；语境确实指宣告的灾祸会临到百姓，但不必在译文中把宣告直接表述为“使其临到”。改作“宣告这一切大灾祸要临到我们”既自然又更贴近句法。
  - severity: low
    issue: “他们会问你”未明示原文的“对你说”。
    rationale: “问你”在汉语中可成立，但“他们会对你说”更完整保留原文的言说引介，且下文包含连续的反问。
  - severity: low
    issue: 末句“我们犯了什么罪，得罪了雅威我们的上帝”中“得罪了”与前句的关系略显并列。
    rationale: 原文以同根结构说明“我们所犯、即得罪雅威我们上帝的罪”。调整语序可更清楚地保留这一修饰关系。
  revised_text: “当你把这一切话告诉这百姓时，他们会对你说：‘雅威为什么宣告这一切大灾祸要临到我们？我们的罪孽是什么？我们得罪雅威我们上帝，犯了什么罪？’”
