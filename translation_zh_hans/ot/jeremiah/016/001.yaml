  yaml_path: translation/ot/jeremiah/016/001.yaml
  text: And the word of Yahweh came to me[a], saying,
translation:
  language: zh_hans
  text: 雅威[a]的话临到我，说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文为 YHWH，即神的名字；传统译作“耶和华”。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי
  choice: 临到
  rationale: 这里的叙事形式与后面的“耶和华的话”共同构成先知书常见的启示引入语；汉语用“临到”自然表达事件的发生和叙事推进，无须直译为“事情发生了”。
- source_word: דְבַר
  choice: 话
  rationale: 在“耶和华的话”这一先知性固定表达中，“话”既保留原文的形式，也比解释性的“信息”更少增添含义。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的神名音译“耶和华”，而不以“主”这一称号代替原文中的专名。
- source_word: אֵלַי
  choice: 我
  rationale: 原文介词加第一人称单数后缀意为“向我／到我这里”；在汉语固定搭配“临到我”中准确而自然。
- source_word: לֵאמֹר
  choice: 说
  rationale: 该不定式用于引出随后直接传达的话；译作“说”简洁、庄重，并明确提示下文是话语内容。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威；上主
  rationale: 原文使用四字神名而非称号。正文保留专名；选用汉语传统且广为人知的音译“耶和华”，同时不把它替换为“主／上主”。
translation_notes:
  register: 采用现代、庄重而通顺的书面普通话，并保留先知书惯用句式“耶和华的话临到我，说”。本节无需脚注。
