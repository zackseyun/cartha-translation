id: JER.16.2
reference: Jeremiah 16:2
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: לֹֽא תִקַּ֥ח לְ/ךָ֖ אִשָּׁ֑ה וְ/לֹֽא יִהְי֤וּ לְ/ךָ֙ בָּנִ֣ים וּ/בָנ֔וֹת בַּ/מָּק֖וֹם הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/016/002.yaml
  text: You shall not take a wife for yourself[a], nor shall you have sons or daughters in this place.
translation:
  language: zh_hans
  text: “你不可娶妻[a]，在这地方也不可有儿女。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“为自己娶一个妻子。”
    reason: 原文לקח לְךָ אשה字面带有“为自己取妻”的表达；正文采用现代汉语自然的婚姻习语“娶妻”。
lexical_decisions:
- source_word: תִקַּח לְךָ אִשָּׁה
  choice: 娶妻
  rationale: לקח אשה是希伯来语婚姻习语，字面为“取一个女人为自己”，现代汉语自然表达为“娶妻”；“娶”已包含婚姻和以其为妻的意思，无须生硬补出“为自己”。
- source_word: וְלֹא יִהְיוּ לְךָ
  choice: 也不可有
  rationale: היה加לְ表示存在或领有，直译近于“也不可有归于你的”；在此与前面的禁令并列，译作“也不可有”既自然又保留禁止的语气。
- source_word: בָּנִים וּבָנוֹת
  choice: 儿女
  rationale: 原文明确并列“儿子和女儿”。现代汉语“儿女”自然涵盖二者，且在否定句中避免不自然的“儿子和女儿”；并未泛化为不标明亲子关系的词。
- source_word: בַּמָּקוֹם הַזֶּה
  choice: 在这地方
  rationale: מָקוֹם基本义为“地方”。此译保留指示性和地点范围，不扩大解释为“这地”或整个国土。
theological_decisions:
- issue: 对耶利米禁令的性质与范围
  choice: 译为直接禁止他娶妻，并禁止他在这地方有儿女
  alternative: 理解为他将保持未婚无子女的预告，或将地点扩大为整个国土
  rationale: 两个第二人称单数形式连同לֹא在语境中构成直接禁令，而不是单纯预言；“这地方”照原文保留其局部指向，不替读者确定更广的地理范围。
translation_notes:
  register: 采用庄重、简洁的现代标准汉语。“不可……也不可……”保留神谕中直接而严肃的禁止语气；“这地方”比“这里”更贴近原文的正式表达。
