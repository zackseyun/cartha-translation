  text: לָ/כֵן֙ הִנְ/נִ֣י מֽוֹדִיעָ֔/ם בַּ/פַּ֣עַם הַ/זֹּ֔את אוֹדִיעֵ֥/ם אֶת יָדִ֖/י וְ/אֶת גְּבֽוּרָתִ֑/י וְ/יָדְע֖וּ כִּֽי שְׁמִ֥/י יְהוָֽה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/016/021.yaml
  text: Therefore[a], behold, I am making them know—this time I will make them know my hand and my might[c][b], and they will know that my name is Yahweh.
translation:
  language: zh_hans
  text: 因此，看哪，我要使他们知道[a]：这一次，我要使他们知道我的手[b]和我的大能；他们就会知道，我的名为雅威[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“我要向他们显明……这一次，我要向他们显明”。希伯来文动词是使役形式，直译为“使他们知道”。
    reason: lexical_alternative
  - marker: b
    text: “手”在这里是实际施展能力的形象说法。
    reason: cultural_note
  - marker: c
    text: 希伯来文为YHWH，即四字神名；汉语传统常译作“耶和华”。
    reason: alternative_reading
lexical_decisions:
- source_word: לָכֵן
  choice: 因此
  rationale: 承接上文，表明由前文引出的结果或结论；“因此”庄重而自然。
- source_word: הִנְנִי
  choice: 看哪，我要
  rationale: 保留神谕宣告中的强调和引人注意的语气；“看哪”符合庄重的经文语体。
- source_word: מוֹדִיעָם / אוֹדִיעֵם
  choice: 我要使他们知道……我要使他们认识
  rationale: 两个动词都是ידע的使役形，且都带“他们”这一受事；译文保留原文的重复。后一句以“认识”搭配“我的手和我的大能”，使现代汉语较为自然，同时仍表达被迫认清、亲自领会之意。
- source_word: בַּפַּעַם הַזֹּאת
  choice: 这一次
  rationale: 直接保留时间短语及指示语的强调，简洁自然。
- source_word: יָדִי
  choice: 我的手
  rationale: 保留希伯来语以“手”象征实际施展之能力的意象；下文“大能”有助于读者理解。
- source_word: גְּבוּרָתִי
  choice: 我的大能
  rationale: 表达强力、威能，并与“我的手”构成有区别而相互加强的并列。
- source_word: וְיָדְעוּ
  choice: 他们就会知道
  rationale: “就”自然表达前述显明所产生的结果，但不增加超出上下文的因果解释。
- source_word: שְׁמִי
  choice: 我的名
  rationale: 直译以保留神自我启示和身份宣告的分量。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文四字神名YHWH音译，保留这里明确出现的专名，而不以称号替代。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名。正文采用较贴近学界通常重构读音的“雅威”，脚注同时说明汉语传统译名“耶和华”，不把专名改译为“主”。
- issue: “我的手”是否意译为“我的能力”
  choice: 保留“我的手”
  alternative: 我的能力
  rationale: 原文将“我的手”和“我的大能”并列；保留“手”的意象可避免把两个不同用语合并，并维持其修辞张力。
- issue: 使役动词的宾语如何表达
  choice: 使他们知道／使他们认识
  alternative: 向他们显明
  rationale: 原文的词形明确带有复数第三人称宾语“他们”，正文予以保留；但在汉语中也可按所显明之事来表达，因此在脚注列出自然的替代译法。
translation_notes:
  register: 采用现代、庄重而可懂的普通话。保留“看哪”的神谕语气、两个使役动词的重复，以及“手／大能”的并列意象；用冒号和分号呈现原句的推进关系，避免把其强调结构改写得过于解释化。
