source:
  edition: WLC
  text: וְ/אַתֶּ֛ם הֲרֵעֹתֶ֥ם לַ/עֲשׂ֖וֹת מֵ/אֲבֽוֹתֵי/כֶ֑ם וְ/הִנְּ/כֶ֣ם הֹלְכִ֗ים אִ֚ישׁ אַֽחֲרֵי֙ שְׁרִר֣וּת לִבּֽ/וֹ הָ/רָ֔ע לְ/בִלְתִּ֖י שְׁמֹ֥עַ אֵלָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/016/012.yaml
  text: But you have done worse than your fathers[a], and look, each of you is walking after the stubbornness of his evil heart[c][b], refusing to listen to me.
translation:
  language: zh_hans
  text: 但你们比你们的祖先行得更恶[a]。看哪，你们各人[b]都随从自己邪恶之心的顽梗[c]而行，不听从我。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“你们行恶，比你们的祖先更甚”。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“各人”，在这里逐一指全体百姓中的每一个人。
    reason: lexical_alternative
  - marker: c
    text: “顽梗”也可译作“刚愎”或“任性固执”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲרֵעֹתֶם לַעֲשׂוֹת מֵאֲבוֹתֵיכֶם
  choice: 你们所行的，比你们的祖先更恶
  rationale: 该结构带有比较意味；译文既保留“行恶”的道德含义，也用自然汉语明确其较前代更甚。
- source_word: מֵאֲבוֹתֵיכֶם
  choice: 你们的祖先
  rationale: 此处指先前世代；现代汉语“祖先”比直译“父辈”更准确地涵盖历代先人。
- source_word: וְהִנְכֶם
  choice: 看哪
  rationale: 保留 הִנֵּה 引人注意和加强语气的功能，同时符合庄重的经文语体。
- source_word: הֹלְכִים אִישׁ אַחֲרֵי
  choice: 你们各人都随着……而行
  rationale: 保留“行走/跟随”的行为隐喻，并以“各人”表达 אִישׁ 在此对全体听众的逐一分配用法。
- source_word: שְׁרִרוּת
  choice: 顽梗
  rationale: 该词在耶利米书中表示执拗、自我意志和拒不顺服；“顽梗”简洁地保留其道德与意志色彩。
- source_word: לִבּוֹ הָרָע
  choice: 自己邪恶之心
  rationale: 保留“心”作为思想、意志与欲望中心的希伯来表达，并明确其负面的道德评价。
- source_word: לְבִלְתִּי שְׁמֹעַ אֵלָי
  choice: 不听从我
  rationale: שׁמע 后接对象时在此不只是听见，而是听从、顺服；简洁译法保留原文结果或目的关系的开放性，避免过度明确为主观“拒绝”。
theological_decisions:
- issue: אִישׁ 对全体百姓的阳性单数分配式表达
  choice: 你们各人
  alternative: 各个男人
  rationale: 上下文面向全体百姓，אִישׁ 在这里逐一指向群体成员，并非把对象限定为男性；“你们各人”兼顾分配性与现代汉语自然度。
- issue: “心的顽梗”与“邪恶”之间的修饰关系
  choice: 自己邪恶之心的顽梗
  alternative: 自己心中邪恶的顽梗
  rationale: 按马所拉文本的常见句法，הָרָע 修饰 לִבּוֹ，即“他的邪恶之心”；正文保留这一关系，不把“邪恶”改作“顽梗”的修饰语。
- issue: לְבִלְתִּי 的目的、结果及意志色彩
  choice: 不听从我
  alternative: 拒绝听从我／以致不听从我
  rationale: 原结构可表达目的或结果，语境也含故意悖逆，但正文不额外锁定为纯目的或显式拒绝，以保存原文张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“看哪”保留先知宣告的强调语气；“随着……而行”保留原文行为道路的隐喻。“祖先”表达历代先人；脚注标记均置于正文相应词组之后。
