base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/016/003.yaml
  text: 'For thus says Yahweh concerning the sons and the daughters born in this place[a], and concerning their mothers who bear them[c][b], and their fathers who father them in this land:'
translation:
  language: zh_hans
  text: 因为耶和华如此说：论到在这地方出生的儿子和女儿[a]，以及生下他们的母亲[b]和在这地使他们得生的父亲[c]：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文明确说“儿子和女儿”，分别点出男性和女性后代，并非只用泛称“孩子”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“生育他们的母亲”。
    reason: lexical_alternative
  - marker: c
    text: 原文使用“生”的使役形式，指父亲使他们得生，即生育他们；也可译作“生他们的父亲”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上一节禁止耶利米娶妻生子的命令，引出其原因；用“因为”清楚保留篇章逻辑。
- source_word: כֹה אָמַר יְהוָה
  choice: 耶和华……如此说
  rationale: 保留先知宣告的使者公式及其庄重语气；按希伯来文直译神名为“耶和华”。
- source_word: עַל
  choice: 论到
  rationale: 此处引出神谕所针对或涉及的人，译作“论到”既自然，也不预先把语气限定为敌对。
- source_word: הַבָּנִים וְהַבָּנוֹת
  choice: 儿子和女儿
  rationale: 保留原文明确并列男性与女性后代的表达，不笼统合并为“孩子”。
- source_word: הַיִּלּוֹדִים בַּמָּקוֹם הַזֶּה
  choice: 在这地方出生的
  rationale: 准确表达被动分词和地点短语，并采用自然的现代汉语定语结构。
- source_word: הַיֹּלְדוֹת אוֹתָם
  choice: 生下他们的
  rationale: 该阴性复数主动分词指母亲生育孩子；“生下”比“生他们”更自然明确。
- source_word: הַמּוֹלִדִים אוֹתָם
  choice: 使他们出生的
  rationale: 保留 ילד 的使役形含义，并在现代汉语中表达父亲使其得生的父系角色，避免使用可能过于生物学化或古奥的措辞。
- source_word: בָּאָרֶץ הַזֹּאת
  choice: 在这地
  rationale: 保留 אֶרֶץ 与前文“这地方”的用词差异；此处指当前所说的地域。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: “耶和华”是现代简体中文圣经语境中最广为人知且庄重的专名形式；正文保留专名，不以“主”替代，因而仍体现原文使用四字神名。
- issue: 父亲与出生关系的表达
  choice: 使他们出生的父亲
  alternative: 生他们的父亲
  rationale: 原文对父亲使用 ילד 的使役分词，对母亲则使用普通主动分词；译文保留这一形态与语义差别，同时不加入关于受孕机制的额外解释。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。保留先知公式“如此说”的正式节奏，并维持“这地方”与“这地”的原文差异。句末冒号表示神谕内容延续至下一节。
