base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/016/009.yaml
  text: 'For thus says Yahweh of Armies[a], the God of Israel: Behold, I am about to put an end, from this place before your eyes and in your days, to the sound of joy and the sound of gladness, the voice of the bridegroom and the voice of the bride.'
translation:
  language: zh_hans
  text: 因为万军之耶和华、以色列的上帝如此说：“看哪，我要在你们眼前、在你们有生之日，使欢喜的声音、快乐的声音、新郎的声音和新娘的声音从这地方止息。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה צְבָאוֹת
  choice: 万军之耶和华
  rationale: 将圣名 יְהוָה 音译为“耶和华”，并以现代中文仍通行且庄重的传统称号“万军之”表达 צְבָאוֹת；脚注补充更直译的可能。
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: 以色列的上帝
  rationale: 直接表达原文的构造关系，语言自然清楚。
- source_word: הִנְנִי מַשְׁבִּית
  choice: 看哪，我必……使……止息
  rationale: “看哪”保留 הִנְנִי 的提示和宣告作用；“使……止息”保留 מַשְׁבִּית 的使役意义，未来措辞传达即将施行的行动。
- source_word: מִן הַמָּקוֹם הַזֶּה
  choice: 从这地方
  rationale: 贴近原文介词结构，指声音将从受审判之地消失。
- source_word: לְעֵינֵיכֶם
  choice: 在你们眼前
  rationale: 保留审判将由听众亲眼见证的公开性。
- source_word: וּבִימֵיכֶם
  choice: 在你们有生之日
  rationale: 用自然现代中文说明事件将在听众尚在世时发生，同时保留“你们的日子”的时间含义。
- source_word: קוֹל שָׂשׂוֹן וְקוֹל שִׂמְחָה
  choice: 欢喜和快乐的声音
  rationale: 以两个近义而不完全相同的词对应 שָׂשׂוֹן 与 שִׂמְחָה，并保留可听见的喜庆氛围。
- source_word: קוֹל חָתָן וְקוֹל כַּלָּה
  choice: 新郎和新娘的声音
  rationale: 自然表达婚礼庆典中的人声；共用一次“声音”避免中文累赘，同时保留原文并列意象。
theological_decisions:
- issue: 神圣名号 יְהוָה צְבָאוֹת 的译法
  choice: 万军之耶和华
  alternative: 万军之雅威；耶和华军队之主
  rationale: “耶和华”是普通中文读者熟悉的圣名形式，“万军之耶和华”庄重且有深厚中文圣经传统；脚注指出 צְבָאוֹת 可更具体地理解为“军队”，避免将称号的具体含义完全隐藏。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。保留先知宣告的正式语气和原文喜庆声音逐项消失的节奏；标点仅为中文可读性服务。
