revisions:
- from: 因为以色列的上帝、万军之耶和华[a]如此说：“看哪，我必在你们眼前、在你们有生之日，使欢喜和快乐的声音、新郎和新娘的声音从这地方止息。”
  to: 因为万军之耶和华、以色列的上帝如此说：“看哪，我要在你们眼前、在你们有生之日，使欢喜的声音、快乐的声音、新郎的声音和新娘的声音从这地方止息。”
  rationale: 调整神名短语与“以色列的上帝”的次序，以贴近希伯来文的称号顺序；逐项重现四个“声音”，保留原文的重复与节奏；并将脚注替代译法改为更自然且较少歧义的中文表述。其余内容忠实且适合现代庄重语体。
  reviewer_model: gpt-5.6-terra
