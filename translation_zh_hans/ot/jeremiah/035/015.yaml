reference: Jeremiah 35:15
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וָ/אֶשְׁלַ֣ח אֲלֵי/כֶ֣ם אֶת כָּל עֲבָדַ֣/י הַ/נְּבִאִ֣ים הַשְׁכֵּ֣ים וְ/שָׁלֹ֣חַ לֵ/אמֹ֡ר שֻׁבוּ נָ֡א אִישׁ֩ מִ/דַּרְכּ֨/וֹ הָ/רָעָ֜ה וְ/הֵיטִ֣יבוּ מַֽעַלְלֵי/כֶ֗ם וְ/אַל תֵּ֨לְכ֜וּ אַחֲרֵ֨י אֱלֹהִ֤ים אֲחֵרִים֙ לְ/עָבְדָ֔/ם וּ/שְׁבוּ֙ אֶל הָ֣/אֲדָמָ֔ה אֲשֶׁר נָתַ֥תִּי לָ/כֶ֖ם וְ/לַ/אֲבֹֽתֵי/כֶ֑ם וְ/לֹ֤א הִטִּיתֶם֙ אֶֽת אָזְנְ/כֶ֔ם וְ/לֹ֥א שְׁמַעְתֶּ֖ם אֵלָֽ/י־־׀׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/035/015.yaml
  text: And I sent to you all my servants the prophets[a], rising early and sending them, saying, ‘Please turn back, each man from his evil way, and make your deeds good, and do not go after other gods to serve them[d][c][b]. Then dwell in the land that I gave to you and to your fathers.’ But you did not incline your ear or listen to me.
translation:
  language: zh_hans
  text: 我一再殷勤地差遣我所有的仆人，就是众先知，到你们那里，说：‘请你们回转，各人离开自己的恶道[a]，改正你们的行为[b]；不要跟随别的神去事奉它们。你们就住在我赐给你们和你们祖先的土地上。’可是，你们没有侧耳，也没有听从我。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “回转”也可译作“归回”；在这里是指各人离开自己的恶道。
    reason: lexical_alternative
  - marker: b
    text: “改正你们的行为”直译为“使你们的行为变好”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶשְׁלַח
  choice: 我差遣
  rationale: 叙事性 wayyiqtol 延续耶和华对往事的陈述；汉语无需另加时态标记。
- source_word: עֲבָדַי הַנְּבִאִים
  choice: 我所有的仆人众先知
  rationale: 保留“我的仆人”与“众先知”的同位关系，也自然表达 כָּל 的整体范围。
- source_word: הַשְׁכֵּים וְשָׁלֹחַ
  choice: 一再殷勤地差遣他们
  rationale: 这是希伯来语惯用表达，字面涉及“早起”，在此强调持续、热切地差遣；正文传达其语用意义，避免现代读者误解为仅说明时间。
- source_word: שֻׁבוּ נָא
  choice: 请你们回转
  rationale: “回转”保留 שׁוב 的空间隐喻及其道德含义，נָא 以“请”表达，不直接收窄为系统化术语“悔改”。
- source_word: אִישׁ מִדַּרְכּוֹ הָרָעָה
  choice: 各人离开自己的恶道
  rationale: “各人”准确传达 אִישׁ 的逐一、分配意义；“恶道”保留先知文献中以道路喻行为方式的表达。
- source_word: וְהֵיטִיבוּ מַעַלְלֵיכֶם
  choice: 改正你们的行为
  rationale: 自然表达使行为变好的使役含义；“行为”比直译为“作为”更符合现代汉语。
- source_word: וְאַל תֵּלְכוּ אַחֲרֵי אֱלֹהִים אֲחֵרִים לְעָבְדָם
  choice: 不要跟随别的神去事奉它们
  rationale: “跟随”保留随从别神的意象；עבד 译为“事奉”，既涵盖敬拜，也保留服事、效忠的词义范围。
- source_word: וּשְׁבוּ אֶל הָאֲדָמָה
  choice: 这样，你们就可以住在……土地上
  rationale: 此处 וּשְׁבוּ 来自 ישׁב（居住），与前面的 שֻׁבוּ（回转）不同；语境显示居住是顺服所带来的结果，译文明确这一逻辑但不强化为无条件保证。
- source_word: אֲשֶׁר נָתַתִּי לָכֶם וְלַאֲבֹתֵיכֶם
  choice: 我赐给你们和你们祖先的
  rationale: “祖先”自然传达 אָבוֹת 的历代先祖含义，避免现代汉语将“父亲”误解为直接父辈。
- source_word: וְלֹא הִטִּיתֶם אֶת אָזְנְכֶם וְלֹא שְׁמַעְתֶּם אֵלָי
  choice: 可是，你们没有侧耳，也没有听从我
  rationale: “侧耳”保留原文生动的身体隐喻；末句的 שׁמע 在此不仅指听见，也指响应、顺从，故译“听从”。
theological_decisions:
- issue: שׁוב 的先知性呼召
  choice: 回转
  alternative: 悔改；归回
  rationale: “回转”同时容纳离开恶道与转向上帝的方向性，不把原词提前限定为后来的专门神学术语。
- issue: 顺服与居住应许之关系
  choice: 这样，你们就可以住在……土地上
  alternative: 你们要住在……土地上；好使你们住在……土地上
  rationale: 命令序列在语境中具有结果或目的意味；“可以住”保留这层关联，又不将经文扩展为更完整的条件契约公式。
- issue: עבד 别神的含义
  choice: 事奉
  alternative: 敬拜
  rationale: 在涉及神明时该词包含敬拜，但也涉及服役与效忠；“事奉”保留较宽的神学张力。
translation_notes:
  register: 采用庄重而现代的标准普通话。“一再殷勤地差遣”以自然汉语传达希伯来语“早起并差遣”的惯用含义；句法保持先知宣告的力度，同时避免过度古雅。所有脚注标记均已置于正文对应位置。
