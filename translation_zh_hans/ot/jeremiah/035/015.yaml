revisions:
- from: 我差遣我所有的仆人众先知到你们那里，一再殷勤地差遣他们，说：‘请你们回转，各人离开自己的恶道[a]，改正你们的行为[b]；不要跟随别的神去事奉它们。这样，你们就可以住在我赐给你们和你们祖先的土地上。’可是，你们没有侧耳，也没有听从我。
  to: 我一再殷勤地差遣我所有的仆人，就是众先知，到你们那里，说：‘请你们回转，各人离开自己的恶道[a]，改正你们的行为[b]；不要跟随别的神去事奉它们。你们就住在我赐给你们和你们祖先的土地上。’可是，你们没有侧耳，也没有听从我。
  rationale: 修订仅澄清“我的仆人，众先知”的同位关系，并将“居住”恢复为与原文相应的祈使表达。保留原译对希伯来语惯用语的语义翻译、既有脚注及其锚点，也未引入额外神学解释。
