review_pass:
  verdict: revise
  source_fidelity: 译文整体忠实呈现了差遣众先知、离开恶道、改善行为、不随从别神、居住在所赐之地，以及拒绝聆听的主线。“事奉”“恶道”“侧耳”等选择也保留了原文的重要意象。惟“这样，你们就可以住”把原文与前列命令并列的祈使语气较明显地转成了可能性陈述；宜保留命令式，同时不否认其在语境中的结果意味。
  naturalness: “我所有的仆人众先知”在现代汉语中同位关系不够清晰，读起来也不顺畅。用“我所有的仆人，就是众先知”可明确原文“我的仆人，众先知”的同位结构。其余行文庄重、现代，适合先知宣告的语域。
  terminology: “回转”恰当保留שׁוב的具体隐喻；“改正你们的行为”准确自然；“事奉别的神”没有不必要地窄化为单指敬拜；“祖先”自然表达“列祖”。脚注a、b均与正文锚点相符。
