base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/035/010.yaml
  text: So we have lived in tents[b][a], and we have obeyed and done all that Jonadab our father commanded us.
translation:
  language: zh_hans
  text: 我们住在帐篷里，听从并遵行我们祖先约拿达所吩咐的一切。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “祖先”原文直译为“父亲”，这里指本族的先祖。
    reason: literal_alternative
lexical_decisions:
- source_word: וַנֵּשֶׁב בָּאֳהָלִים
  choice: 我们就住在帐篷里
  rationale: ישׁב 在此指居住而非坐下；“住在帐篷里”自然表达他们持续遵守的生活方式。连接词译作“就”，承接上文命令及其回应。
- source_word: וַנִּשְׁמַע
  choice: 听从
  rationale: שׁמע 在命令语境中不仅指听见，也包含留心接受、服从之意；“听从”既保留“听”的词义形象，也传达顺服回应。
- source_word: וַנַּעַשׂ
  choice: 并照着……去做
  rationale: עשה 表明实际履行命令；与“听从”并列，保留原文“听从—实行”的结构。
- source_word: כְּכֹל אֲשֶׁר צִוָּנוּ
  choice: 照着……所吩咐的一切
  rationale: כְּכֹל אֲשֶׁר 表示完全依照全部内容；“所吩咐”准确体现 צוה 的权威语气。
- source_word: יוֹנָדָב
  choice: 约拿达
  rationale: 采用现代中文圣经人名的通行音译；此处希伯来文本为 יוֹנָדָב。
- source_word: אָבִינוּ
  choice: 我们的祖先
  rationale: 字面为“我们的父亲”，但本章语境所指是利甲族先祖；现代汉语用“祖先”可避免误解为说话者各自的直接父亲。该解释性选择以脚注保留字面形式。
theological_decisions:
- issue: שׁמע 对命令的回应含义
  choice: 听从
  alternative: 听见／听了
  rationale: 上下文强调对约拿达命令的实际遵行。“听从”保留希伯来语听觉意象，同时表达该动词在此处的服从含义，不额外引入教派性解释。
- issue: אָבִינוּ 的亲属范围
  choice: 我们的祖先
  alternative: 我们的父亲
  rationale: 约拿达是利甲族的先祖，译作“祖先”符合叙事语境；脚注说明字面形式，以保留原文的家族权威表达。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“听从并照着……去做”有意保留原文两个并列动词，避免将“听”与“行”合并；“帐篷”采用简体中文常用写法。
