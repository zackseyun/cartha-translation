  text: וָ/אֶקַּ֞ח אֶת יַאֲזַנְיָ֤ה בֶֽן יִרְמְיָ֨הוּ֙ בֶּן חֲבַצִּנְיָ֔ה וְ/אֶת אֶחָ֖י/ו וְ/אֶת כָּל בָּנָ֑י/ו וְ/אֵ֖ת כָּל בֵּ֥ית הָ/רֵכָבִֽים־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/035/003.yaml
  text: So I took Jaazaniah son of Jeremiah[a], son of Habazziniah, and his brothers, and all his sons[b], and the whole house of the Rechabites.
translation:
  language: zh_hans
  text: 于是[a]我带了雅撒尼雅——他是耶利米的儿子、哈巴洗尼雅的孙子——又带了他的弟兄、他所有的儿子，以及利甲全族[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “于是”也可译作“然后”或“我就”。希伯来文的叙事形式表示行动接续发生，中文可有不同的自然表达。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“利甲人的全家”；这里的“家”指整个家族或宗族，不只是同住一所房屋的人。
    reason: cultural_note
lexical_decisions:
- source_word: וָאֶקַּח
  choice: 于是我带上
  rationale: 这是 לקח 的 Qal 连续式未完成时，叙述接续发生的行动。“于是”自然表达叙事推进，“带上”符合本段把人带到某处的语境。
- source_word: יַאֲזַנְיָה
  choice: 雅撒尼亚
  rationale: 按现代中文圣经人名的通行音译处理希伯来人名。
- source_word: בֶן יִרְמְיָהוּ בֶן חֲבַצִּנְיָה
  choice: 他是耶利米的儿子、哈巴洗尼雅的孙子
  rationale: 希伯来文逐级以“儿子”串联家系；中文用“儿子、孙子”清楚呈现雅撒尼亚与两代先祖的关系，并避免人名链造成误读。
- source_word: אֶחָיו
  choice: 他的弟兄
  rationale: אח 的通常含义是亲兄弟；上下文没有充分理由将其泛化为亲族。“弟兄”保持庄重且可涵盖兄或弟。
- source_word: כָּל בָּנָיו
  choice: 他所有的儿子
  rationale: בנים 为阳性复数，本处直译为“儿子”比泛化成“儿女”或“后代”更准确。
- source_word: כָּל בֵּית הָרֵכָבִים
  choice: 利甲全族
  rationale: בֵּית 在这里指家族或宗族，不是建筑物；“利甲全族”自然表达其群体性的含义，同时体现 כָּל。
