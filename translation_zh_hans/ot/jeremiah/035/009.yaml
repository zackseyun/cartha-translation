  text: 也不建造房屋供自己居住；我们没有葡萄园、田地和种子。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּלְבִלְתִּי בְּנוֹת
  choice: 也不可建造
  rationale: 承接上文的禁戒事项，以“也不可”自然表达否定的不定式结构；“建造”准确对应 בנה。
- source_word: בָּתִּים לְשִׁבְתֵּנוּ
  choice: 房屋居住
  rationale: 保留“房屋”这一具体名词，并用简洁的目的结构表达“供我们居住”。
- source_word: וְכֶרֶם וְשָׂדֶה וָזֶרַע
  choice: 葡萄园、田地和种子
  rationale: 逐项保留希伯来文的农业财产类别；זֶרַע 译为“种子”，不扩展解释为庄稼或农作物。
- source_word: לֹא יִהְיֶה לָּנוּ
  choice: 我们都不可拥有
  rationale: 希伯来文的“没有归于我们”是表达所有关系的存在句；结合上文祖先命令的管辖范围，译作“不可拥有”使汉语自然，也保持持续禁令的语境。
