base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/035/011.yaml
  text: But when Nebuchadnezzar king of Babylon came up against the land[a], we said, ‘Come[b], and let us go to Jerusalem because of the army of the Chaldeans and because of the army of Aram.’ So we settled in Jerusalem.
translation:
  language: zh_hans
  text: 当巴比伦王尼布甲尼撒上来攻打这地的时候，我们说：“来吧，我们进耶路撒冷去，躲避迦勒底人的军队[a]和亚兰人的军队[b]。”于是，我们住在耶路撒冷。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “迦勒底人”也可译作“巴比伦人”。
    reason: lexical_alternative
  - marker: b
    text: “亚兰”传统上也译作“叙利亚”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַּעֲלוֹת
  choice: 后来……上来攻打
  rationale: וַיְהִי引入新的叙事情境，בַּעֲלוֹת在军事语境中表示向某地进军；“上来攻打”自然传达敌对行动，又保留“上来”的空间表达。
- source_word: נְבוּכַדְרֶאצַּר מֶלֶךְ בָּבֶל
  choice: 巴比伦王尼布甲尼撒
  rationale: 采用现代中文圣经语境中通行的人名、国名形式，并保留原文的王号结构。
- source_word: הָאָרֶץ
  choice: 这地
  rationale: 定冠词所指由上下文确定为犹大境内；“这地”符合先知书叙事中的自然中文表达，不额外补明“犹大”。
- source_word: בֹּאוּ וְנָבוֹא
  choice: 来吧，我们进……去
  rationale: 保留祈使式加鼓励式所表达的共同决意；בוא在此处以“进……去”表达进入耶路撒冷避难。
- source_word: מִפְּנֵי
  choice: 躲避
  rationale: 该介词说明他们因两支军队逼近而前往耶路撒冷；“躲避”在中文中准确而自然地表达避开威胁的语境含义。
- source_word: חֵיל הַכַּשְׂדִּים
  choice: 迦勒底人的军队
  rationale: חֵיל指武装力量；保留原文的民族—政治称谓“迦勒底人”，不直接以“巴比伦人”替代。
- source_word: חֵיל אֲרָם
  choice: 亚兰人的军队
  rationale: אֲרָם是专名“亚兰”；中文补出“人”以自然修饰“军队”，同时避免采用后世地名“叙利亚”作为正文。
- source_word: וַנֵּשֶׁב
  choice: 于是，我们住在了
  rationale: 采用简单叙事结果表达，既可表示他们在耶路撒冷居住下来，也不强化为永久“定居”。
theological_decisions: []
