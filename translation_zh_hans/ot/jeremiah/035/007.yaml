source:
  edition: WLC
  text: וּ/בַ֣יִת לֹֽא תִבְנ֗וּ וְ/זֶ֤רַע לֹֽא תִזְרָ֨עוּ֙ וְ/כֶ֣רֶם לֹֽא תִטָּ֔עוּ וְ/לֹ֥א יִֽהְיֶ֖ה לָ/כֶ֑ם כִּ֠י בָּ/אֳהָלִ֤ים תֵּֽשְׁבוּ֙ כָּל יְמֵי/כֶ֔ם לְמַ֨עַן תִּֽחְי֜וּ יָמִ֤ים רַבִּים֙ עַל פְּנֵ֣י הָ/אֲדָמָ֔ה אֲשֶׁ֥ר אַתֶּ֖ם גָּרִ֥ים שָֽׁם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/035/007.yaml
  text: You must not build a house[a], and you must not sow seed, and you must not plant a vineyard, nor shall you have one; but you shall live in tents all your days, so that you may live many days on the face of the land where you are residing there.
translation:
  language: zh_hans
  text: 你们不可建造房屋，不可撒种，也不可种植葡萄园，也不可有葡萄园；你们却要一生住在帐篷里，好使你们在所寄居[a]的土地上长久生活。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “寄居”指以非永久居民的身份居住，也可译作“暂住”。
    reason: 保留希伯来语גור所含的临时居留身份意味。
lexical_decisions:
- source_word: וּבַיִת לֹא תִבְנוּ
  choice: 不可建造房屋
  rationale: בַּיִת在这里指实体房屋，与后文住帐篷形成对照；לֹא加未完成式在训令语境中表达禁止。
- source_word: וְזֶרַע לֹא תִזְרָעוּ
  choice: 不可撒种
  rationale: 按农业语境直接表达“播撒种子”；现代汉语用“撒种”既简洁又保留原文的具体意象。
- source_word: וְכֶרֶם לֹא תִטָּעוּ
  choice: 不可栽种葡萄园
  rationale: כֶּרֶם通常指葡萄园，נטע指栽种；不泛化为一般农作物。
- source_word: וְלֹא יִהְיֶה לָכֶם
  choice: 这些你们都不可拥有
  rationale: 该短语字面为“也不可归你们所有／你们也不可有”；汉语以“这些”承接前述定居性产业，同时不把所指范围硬性限定为葡萄园一项。
- source_word: בָּאֳהָלִים תֵּשְׁבוּ כָּל יְמֵיכֶם
  choice: 要一生住在帐篷里
  rationale: ישב在居住语境中意为居住；“一生”自然传达“你们所有的日子”，语体现代而庄重。
- source_word: לְמַעַן תִּחְיוּ יָמִים רַבִּים
  choice: 好使你们……长久生活
  rationale: לְמַעַן表达目的；“长久生活”自然传达“活许多日子”，不缩减为仅仅存活。
- source_word: גָּרִים שָׁם
  choice: 所寄居的
  rationale: גור表示以非永久居民身份居住；“寄居”在现代圣经语体中可懂，也保留暂居的社会身份含义。
theological_decisions:
- issue: 利甲族在土地上的居住身份（גָּרִים）
  choice: 寄居
  alternative: 居住
  rationale: “寄居”保留原文非永久定居者的意味，与不可建房、耕种及拥有产业的命令相呼应；不进一步解释其圣约身份，以免加入原文未明说的神学结论。
- issue: וְלֹא יִהְיֶה לָכֶם的指代范围
  choice: 这些你们都不可拥有
  alternative: 也不可拥有葡萄园
  rationale: 原文没有明示主语，语法上可能回指最近的“葡萄园”，也可能概括前述定居性产业；译文用“这些”保留较宽的承接空间，避免只锁定葡萄园。
translation_notes:
  register: 采用现代、庄重而易懂的训令语体；以“不可……却要……”呈现原文从禁止到正面命令的转折，并将希伯来语较生硬的“在地面上活许多日子”自然表达为“在……土地上长久生活”。
