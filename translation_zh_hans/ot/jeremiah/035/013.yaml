base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/035/013.yaml
  text: 'Thus says the LORD of hosts, the God of Israel: Go and say to the men of Judah and to the inhabitants of Jerusalem, ‘Will you not receive instruction by listening to my words? declares the LORD.’'
translation:
  language: zh_hans
  text: 万军之耶和华——以色列的神如此说：“你去对犹大人和耶路撒冷的居民说：‘你们难道不肯领受训诲，听从我的话吗？’这是耶和华的宣告。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה צְבָאוֹת
  choice: 万军之耶和华
  rationale: 沿用中文圣经中庄重而通行的表达；“万军”保留 צְבָאוֹת 所体现的众军、天军或军旅意象，不将其范围过度限定。
- source_word: לְאִישׁ יְהוּדָה
  choice: 告诉犹大人
  rationale: אִישׁ 为单数形式，但在此可作集合性表达，所指与后面的耶路撒冷居民相对应；“犹大人”自然地传达这一群体含义。
- source_word: מוּסָר
  choice: 管教
  rationale: 该词兼有训诲、纠正和纪律管束之意；“管教”保留先知责备语境中的力度，也不排除受教的含义。
- source_word: לִשְׁמֹעַ אֶל דְּבָרַי
  choice: 听从我的话
  rationale: שׁמע 与 אֶל 连用不只是听见，也含留心并顺从之意；“听从”符合此处的劝诫语境。
- source_word: נְאֻם יְהוָה
  choice: 这是耶和华说的
  rationale: 以现代而庄重的中文表达先知书常见的神谕公式，清楚标明话语的神圣来源。
theological_decisions:
- issue: 接受管教与听从话语之间的关系
  choice: “接受管教，听从我的话”
  alternative: “借着听从我的话接受管教”
  rationale: 希伯来文不定式 לִשְׁמֹעַ 可表示目的、结果或具体说明。正文保留两者的紧密联系，但不强行限定为单一的工具关系。
- issue: 反问句的语气
  choice: “你们还不肯……吗？”
  alternative: “难道你们不……吗？”
  rationale: 上下文是持续拒绝受教的责问；“还不肯”自然传达预期肯定回答以及对顽梗态度的责备，同时不增添特定宗派解释。
translation_notes:
  register: 采用现代标准普通话的书面表达，保持先知宣告的庄重和责问力度。使用“耶和华”呈现神名，以“万军之耶和华”保留传统且易懂的称号；标点和引号层级清楚区分神对先知的命令与所传达的话。
