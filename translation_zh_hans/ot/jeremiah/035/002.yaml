  text: הָלוֹךְ֮ אֶל בֵּ֣ית הָ/רֵכָבִים֒ וְ/דִבַּרְתָּ֣ אוֹתָ֔/ם וַ/הֲבִֽאוֹתָ/ם֙ בֵּ֣ית יְהוָ֔ה אֶל אַחַ֖ת הַ/לְּשָׁכ֑וֹת וְ/הִשְׁקִיתָ֥ אוֹתָ֖/ם יָֽיִן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/035/002.yaml
  text: Go to the house of the Rechabites[a], and speak to them, and bring them to the house of Yahweh, into one of the chambers, and give them wine to drink.
translation:
  language: zh_hans
  text: 你到利甲族人那里去，跟他们说话，把他们带进雅威的殿内一间房，给他们酒喝。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָלוֹךְ
  choice: 你到……去
  rationale: 此处是不定式绝对式独立用于命令，现代汉语用“你到……去”自然、直接。
- source_word: בֵּית הָרֵכָבִים
  choice: 利甲族那里
  rationale: בֵּית在这里指利甲人的家族或群体，而非一座房屋；下文又说要把“他们”带走，因此译作“利甲族那里”避免误解，同时保留其社会群体含义。
- source_word: וְדִבַּרְתָּ אֹתָם
  choice: 跟他们说话
  rationale: דבר与宾语标记连用可表示向某人或同某人说话；“跟他们说话”自然，也不擅自补出原文未交代的谈话内容。
- source_word: וַהֲבִיאוֹתָם
  choice: 把他们带到
  rationale: בוא的使役形表达使人来到某处；“把他们带到”准确体现使役意义。
- source_word: בֵּית יְהוָה
  choice: 雅威的殿
  rationale: 该短语字面为“雅威的房屋”，语境指圣殿；“殿”既符合中文建筑称谓，又比直接增译“圣殿”更贴近原文形式。
- source_word: אַחַת הַלְּשָׁכוֹת
  choice: 其中一间房
  rationale: לִשְׁכָּה指圣殿建筑群内的房间或厢房；现代汉语“其中一间房”清楚自然。
- source_word: וְהִשְׁקִיתָ אֹתָם יָיִן
  choice: 给他们酒喝
  rationale: שקה的使役形可指给人饮用；此译不额外暗示强迫他们喝酒。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以常见的现代汉语音译呈现四字神名，保留其专名性质，而不以称号替代。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文使用以色列之神的四字神名。译作“雅威”保留专名性质，不把它改成“主”这一称号；“耶和华”则属于另一种传统音译。
- issue: בֵּית יְהוָה是按字面还是按所指翻译
  choice: 雅威的殿
  alternative: 雅威的圣殿；雅威的家
  rationale: “殿”既让现代读者明白这里是敬拜建筑，又保留בֵּית“房屋”的基本意象；脚注说明更直译和更明确的译法。
translation_notes:
  register: 采用庄重而明白的现代标准汉语。句式保留连续命令的推进感；“利甲族”体现家族群体，“房”避免过度古雅，“给他们酒喝”不预先判断是否强迫饮用。
