  text: כִּ֣י הֵקִ֗ימוּ בְּנֵי֙ יְהוֹנָדָ֣ב בֶּן רֵכָ֔ב אֶת מִצְוַ֥ת אֲבִי/הֶ֖ם אֲשֶׁ֣ר צִוָּ֑/ם וְ/הָ/עָ֣ם הַ/זֶּ֔ה לֹ֥א שָׁמְע֖וּ אֵלָֽ/י־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/035/016.yaml
  text: For the sons of Jehonadab son of Rechab have kept the command of their father that he commanded them[b][a], but this people have not listened to me.
translation:
  language: zh_hans
  text: 因为利甲的儿子约拿达的子孙遵守了他们的父亲[a]所吩咐他们遵守的命令，这百姓却不听从我[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“他们的先祖”；原文直译“他们的父亲”。
    reason: lexical_alternative
  - marker: b
    text: “不听从我”也可译作“没有听我的话”；原文兼有听取和服从的意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 引出前文所述宣告的理由或根据；“因为”自然保留原文的解释性关联。
- source_word: הֵקִימוּ
  choice: 遵守了
  rationale: קום的使役式在这里与“命令”连用，意为使命令成立、予以实行，即遵守或持守。
- source_word: בְּנֵי יְהוֹנָדָב בֶּן רֵכָב
  choice: 利甲的儿子约拿达的子孙
  rationale: בְּנֵי在本章宗族语境中指后裔；“子孙”符合现代汉语，也避免误解为约拿达仍在世的亲生儿子，同时保留“利甲的儿子约拿达”这一谱系称谓。
- source_word: מִצְוַת
  choice: 命令
  rationale: מִצְוָה指具有约束力的吩咐或命令；“命令”清楚、庄重，并保留其权威性。
- source_word: אֲבִיהֶם
  choice: 他们父亲
  rationale: 原文直译为“他们的父亲”。虽在历史语境中指先祖约拿达，正文保留亲属称谓，以维持人听从父亲而百姓不听从上帝的修辞对照。
- source_word: אֲשֶׁר צִוָּם
  choice: 吩咐他们的
  rationale: 作为关系从句修饰“命令”；汉语调整语序为“父亲吩咐他们的命令”，准确而自然。
- source_word: וְהָעָם הַזֶּה
  choice: 这百姓却
  rationale: וְ在此表达鲜明对比，“却”自然呈现约拿达子孙的顺服与这百姓的不顺服之间的反差；“这百姓”保留指示语的距离感。
- source_word: לֹא שָׁמְעוּ אֵלָי
  choice: 不听从我
  rationale: שׁמע与אֶל连用既有听取之意，也常包含服从之意；“听从”在汉语中兼顾这两层含义。
theological_decisions:
- issue: 利甲族的亲属称谓
  choice: 他们父亲
  alternative: 他们的先祖
  rationale: 正文保留希伯来文直接使用的“父亲”，使听从人间父亲与不听从上帝的神学和修辞对照保持鲜明；脚注说明在本处所指的是先祖。
- issue: שׁמע所表达的回应
  choice: 不听从我
  alternative: 没有听我的话／不服从我
  rationale: “听从”同时保留听取与服从的语义，不把原文蕴含的双重意味缩减为单纯听见或单纯服从。
translation_notes:
  register: 采用现代、庄重而通顺的书面汉语。“利甲的儿子约拿达”保留希伯来谱系表达；“约拿达的子孙”则按本章宗族语境清楚表达后裔身份。用“却”凸显全节核心对照，不添加宗派性解释。
