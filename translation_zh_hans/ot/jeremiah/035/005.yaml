  yaml_path: translation/ot/jeremiah/035/005.yaml
  text: Then I set before the sons of the house of the Rekabites bowls full of wine and cups[a], and I said to them, “Drink wine.”
translation:
  language: zh_hans
  text: 于是，我把盛满酒的碗和杯子摆在利甲家的人面前，对他们说：“喝酒。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וָאֶתֵּן לִפְנֵי
  choice: 于是，我把……摆在……面前
  rationale: נתן与לִפְנֵי连用，在此指把器皿陈放在某人面前；“摆在……面前”自然准确。“于是”顺畅体现叙事中的连续动作。
- source_word: בְּנֵי בֵית הָרֵכָבִים
  choice: 利甲族人
  rationale: 希伯来语直译为“利甲家之子”，实际指属于利甲家族或群体的人；“利甲族人”既符合现代汉语，也保留其家族群体含义。
- source_word: גְּבִעִים
  choice: 碗
  rationale: 该词指碗状器皿；译作“碗”可与后面的“杯子”区分，也不额外限定器皿的材质或华贵程度。
- source_word: מְלֵאִים יַיִן
  choice: 盛满酒的
  rationale: 准确表达器皿中装满酒的状态，并符合现代汉语修饰语序。
- source_word: וְכֹסוֹת
  choice: 和杯子
  rationale: כּוֹס指饮用的杯；保留“碗”和“杯子”两类器皿。
- source_word: וָאֹמַר אֲלֵיהֶם
  choice: 对他们说
  rationale: 直接对应“向他们说”，简洁自然。
- source_word: שְׁתוּ יָיִן
  choice: 喝酒吧
  rationale: 保留复数命令的直接性；现代汉语无法在动词形态上表示复数，“吧”使直接命令在语境中自然，但不加入“喝一点”等原文没有的数量含义。
