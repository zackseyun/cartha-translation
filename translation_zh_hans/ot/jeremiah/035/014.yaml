source:
  edition: WLC
  text: הוּקַ֡ם אֶת דִּבְרֵ֣י יְהוֹנָדָ֣ב בֶּן רֵ֠כָב אֲשֶׁר צִוָּ֨ה אֶת בָּנָ֜י/ו לְ/בִלְתִּ֣י שְׁתֽוֹת יַ֗יִן וְ/לֹ֤א שָׁתוּ֙ עַד הַ/יּ֣וֹם הַ/זֶּ֔ה כִּ֣י שָֽׁמְע֔וּ אֵ֖ת מִצְוַ֣ת אֲבִי/הֶ֑ם וְ/אָ֨נֹכִ֜י דִּבַּ֤רְתִּי אֲלֵי/כֶם֙ הַשְׁכֵּ֣ם וְ/דַבֵּ֔ר וְ/לֹ֥א שְׁמַעְתֶּ֖ם אֵלָֽ/י־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/035/014.yaml
  text: The words of Jehonadab son of Rechab[a], which he commanded his sons—not to drink wine—have been upheld, and they have not drunk wine to this day, because they have obeyed the command of their father. But I have spoken to you, rising early and speaking[b], and you have not listened to me.
translation:
  language: zh_hans
  text: 利甲的儿子约拿达吩咐他儿子不可喝酒的话，已经得以遵守；他们直到今日仍没有喝酒，因为他们听从了他们父亲的命令。然而，我一再早起对你们说话[a]，你们却没有听从我。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “一再早起对你们说话”直译为“早起并说话”，是希伯来语惯用表达，指殷勤、持续地说话。
    reason: 说明“早起并说话”的习语意义，并保留原文意象，避免将其内容限定为“劝告”。
lexical_decisions:
- source_word: הוּקַם אֶת דִּבְרֵי
  choice: 他的话得到了遵守
  rationale: 被动式 הוּקַם 在此表示约拿达的话被实行、持守；此译保留被动语态，并自然表达命令得到遵行。
- source_word: יְהוֹנָדָב בֶּן רֵכָב
  choice: 利甲的儿子约拿达
  rationale: 按希伯来语全名音译 יְהוֹנָדָב 为“约拿达”，并依中文圣经人名惯例音译 רֵכָב 为“利甲”。
- source_word: אֶת בָּנָיו
  choice: 他子孙
  rationale: בנים 可指儿子，也可按上下文泛指后代；本章所述是利甲族跨世代遵守祖训，故译作“子孙”。
- source_word: לְבִלְתִּי שְׁתוֹת יַיִן
  choice: 不可喝酒
  rationale: 直接表达该结构的禁止意义，不额外限定酒的种类或禁戒原因。
- source_word: עַד הַיּוֹם הַזֶּה
  choice: 直到今日
  rationale: 保留原文从过去延续至说话当日的时间意义。
- source_word: שָׁמְעוּ אֵת מִצְוַת
  choice: 听从了……命令
  rationale: שמע 与“命令”连用时含遵从之意；“听从”既保留听的词义联系，也明确其顺服含义。
- source_word: מִצְוַת אֲבִיהֶם
  choice: 先祖的命令
  rationale: 字面为“他们父亲的命令”，但这里所指约拿达是当代利甲族人的祖先；“先祖”在中文中避免误解为其直接父亲。
- source_word: וְאָנֹכִי
  choice: 然而，我却
  rationale: 明确表现利甲族顺服与犹大人不听从之间的强烈对比。
- source_word: הַשְׁכֵּם וְדַבֵּר
  choice: 早早起来，不断地对你们说话
  rationale: 保留“早起”的原文意象，同时用“不断地”传达这一希伯来惯用语所表达的殷勤、反复劝告。
- source_word: וְלֹא שְׁמַעְתֶּם אֵלָי
  choice: 你们还是不听从我
  rationale: שמע 在此不只是听见，而是听从；“还是”体现持续劝说与持续拒绝之间的反差。
theological_decisions:
- issue: 神不断说话与利甲族听从先祖之间的对比
  choice: 保留顺服人间先祖与不听从神的直接对照，不扩写为盟约背叛等术语
  alternative: 将后半句解释性译为“你们却悖逆我的约”
  rationale: 原文的神学力度来自叙事对比本身；加入“盟约背叛”虽可能符合更广语境，却超出本节明说的内容。
- issue: שמע 在两处的对应关系
  choice: 两处均译作“听从”
  alternative: 前处译“服从”，后处译“听”
  rationale: 相同译法保留原文刻意形成的词语呼应：利甲族听从先祖，百姓却不听从神。
translation_notes:
  register: 采用庄重而现代的普通话。句式保持先叙利甲族持守祖训、后转向神责备百姓的修辞结构；用“然而，我却”突出对照。人名采用中文圣经传统中易辨认的译法，脚注交代名称变体和希伯来习语。
