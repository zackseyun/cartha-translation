  terminology: “利甲的儿子约拿达”符合中文圣经常用人名形式。原脚注将“约纳达”称为“约拿达”的简称，既不准确也不能有效对应希伯来文全名与短式名的差别，宜删除。保留“听从”以对应两处שמע，维持修辞呼应。
