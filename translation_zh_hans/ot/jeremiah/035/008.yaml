base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/035/008.yaml
  text: 'So we have obeyed the voice of Jehonadab son of Rechab[a], our father, in everything that he commanded us: not to drink wine all our days—we, our wives, our sons[b], and our daughters.'
translation:
  language: zh_hans
  text: 我们听从了我们的先祖[c]、利甲的儿子耶何拿达[b]的话[a]；凡他吩咐我们的，我们都照着做：我们、我们的妻子、儿子和女儿，一生都不喝酒。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “听从……的话”原文直译为“听从……的声音”，是指听从或服从某人的命令。
    reason: lexical_alternative
  - marker: b
    text: “耶何拿达”是本节希伯来文名字的完整形式；有些译本采用其简称“约拿达”。
    reason: alternative_reading
  - marker: c
    text: “先祖”原文直译为“我们的父亲”；这里指利甲族的祖先。
    reason: clarification
lexical_decisions:
- source_word: וַנִּשְׁמַע בְּקוֹל
  choice: 一直听从……的话
  rationale: שׁמע与בְּקוֹל连用，意为听从、服从，而不只是听见。“一直”体现这段回顾性见证所描述的持续遵行；“听从……的话”是自然的现代汉语，也保留了希伯来语“声音/话语”的表达痕迹。
- source_word: יְהוֹנָדָב בֶּן־רֵכָב
  choice: 利甲的儿子耶何拿达
  rationale: 按本节马所拉文本中的完整名字יְהוֹנָדָב音译为“耶何拿达”；“利甲的儿子”保留希伯来语家系结构。
- source_word: אָבִינוּ
  choice: 我们的先祖
  rationale: 字面是“我们的父亲”，但在本段中耶何拿达是说话者群体的祖先；译作“先祖”可避免现代读者误以为是他们各自的亲生父亲，同时以脚注保留字面形式。
- source_word: לְכֹל אֲשֶׁר צִוָּנוּ
  choice: 凡他吩咐我们的，我们都照着做
  rationale: 传达לְכֹל的全面范围和צוה的命令含义，并用自然汉语明确其完全遵行。
- source_word: לְבִלְתִּי שְׁתוֹת יַיִן כָּל יָמֵינוּ
  choice: 我们一生都不喝酒
  rationale: 该不定式结构说明命令的内容；“一生”自然地表达“我们所有的日子”的终身范围。
- source_word: אֲנַחְנוּ נָשֵׁינוּ בָּנֵינוּ וּבְנֹתֵינוּ
  choice: 我们……我们的妻子、儿子和女儿也都不喝
  rationale: 逐项保留全家各群体，并借“也都不喝”使希伯来语并列附加成分在现代汉语中清楚自然。
theological_decisions: []
