id: JER.35.6
reference: Jeremiah 35:6
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יֹּאמְר֖וּ לֹ֣א נִשְׁתֶּה יָּ֑יִן כִּי֩ יוֹנָדָ֨ב בֶּן רֵכָ֜ב אָבִ֗י/נוּ צִוָּ֤ה עָלֵ֨י/נוּ֙ לֵ/אמֹ֔ר לֹ֧א תִשְׁתּוּ יַ֛יִן אַתֶּ֥ם וּ/בְנֵי/כֶ֖ם עַד עוֹלָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/035/006.yaml
  text: But they said[a], “We will not drink wine, for Jonadab son of Rechab, our father, commanded us, saying, ‘You shall not drink wine, you or your sons[c][b], forever.’”
translation:
  language: zh_hans
  text: 他们却说[a]：“我们不喝酒，因为利甲的儿子约拿达——我们的先祖[b]——曾吩咐我们说：‘你们和你们的儿子[c]永远都不可喝酒。’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们说。”希伯来文的叙事连接词可以这样译；正文用“却”来表达他们拒绝上文喝酒邀请的转折。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译“我们的父亲”；这里指他们的先祖约拿达。
    reason: cultural_note
  - marker: c
    text: 希伯来文是“儿子”，特指男性后代，并非泛指“儿女”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: 他们却说
  rationale: וַ־承接叙事；结合上节请他们喝酒的语境，“却”自然表达拒绝所形成的转折。[a]注明也可译作“他们说”。
- source_word: לֹא נִשְׁתֶּה יָּיִן
  choice: 我们不喝酒
  rationale: 未完成体在直接引语中表达坚定拒绝；现代汉语以“不喝”同时自然涵盖当前拒绝和持续立场。
- source_word: כִּי
  choice: 因为
  rationale: 引出他们拒绝喝酒的原因。
- source_word: יוֹנָדָב בֶּן רֵכָב
  choice: 利甲的儿子约拿达
  rationale: 按希伯来文父名结构直译，并采用现代中文圣经人名的通行音译。
- source_word: אָבִינוּ
  choice: 我们的先祖
  rationale: אָב字面为“父亲”，但这里的约拿达是说话者所属族群的祖先；正文用“先祖”避免现代读者误解为亲生父亲，同时以脚注保留原文措辞。
- source_word: צִוָּה עָלֵינוּ
  choice: 吩咐我们
  rationale: 自然表达该希伯来语结构所含的权威命令语气。
- source_word: לֵאמֹר
  choice: 说
  rationale: 作为引出直接引语的引述公式，现代汉语译作“说”简洁自然。
- source_word: לֹא תִשְׁתּוּ יַיִן
  choice: 不可喝酒
  rationale: 否定未完成体用于禁令，译作“不可”保留明确而庄重的规范性语气。
- source_word: אַתֶּם וּבְנֵיכֶם
  choice: 你们和你们的儿子
  rationale: 明确保留אַתֶּם和בְנֵיכֶם两个对象；“儿子”准确反映原文的男性后代用语，不泛化为“儿女”。
- source_word: עַד עוֹלָם
  choice: 永远都
  rationale: 表达延续至不定将来的持久禁令；“永远都不可”符合现代汉语语序。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的普通话。正文以破折号标明“我们的先祖”是对约拿达身份的同位说明；保留直接引语的层次和禁令语气。所有脚注标记均置于其所说明的正文词语之后。
