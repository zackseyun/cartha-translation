id: JER.35.1
reference: Jeremiah 35:1
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: הַ/דָּבָ֛ר אֲשֶׁר הָיָ֥ה אֶֽל יִרְמְיָ֖הוּ מֵ/אֵ֣ת יְהוָ֑ה בִּ/ימֵ֨י יְהוֹיָקִ֧ים בֶּן יֹאשִׁיָּ֛הוּ מֶ֥לֶךְ יְהוּדָ֖ה לֵ/אמֹֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/035/001.yaml
  text: The word that came to Jeremiah from Yahweh in the days of Jehoiakim son of Josiah[a], king of Judah, saying,
translation:
  language: zh_hans
  text: 犹大王约西亚的儿子约雅敬在位期间，雅威[a]的话临到耶利米，说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文为上帝的名字YHWH，通常音译作“雅威”，也有译作“耶和华”的。
    reason: 说明神名的原文形式及中文常见译法。
lexical_decisions:
- source_word: הַדָּבָר
  choice: 话
  rationale: 在先知书启示公式中，דָּבָר指从上帝而来的言语或信息；译作“话”既保留公式性，也符合现代汉语表达。
- source_word: אֲשֶׁר הָיָה אֶל
  choice: 临到
  rationale: 这是先知领受启示的固定表达；“临到”准确传达信息来到先知那里，并保留庄重的先知书语体。
- source_word: יִרְמְיָהוּ
  choice: 耶利米
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: מֵאֵת
  choice: 从……而来（由“雅威的话临到”体现）
  rationale: מֵאֵת标明来源。汉语以“雅威的话临到耶利米”的所属结构自然表达这话源自雅威，无须生硬加入“从”。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文四字神名YHWH作音译，以区别于“主”等称号，并用脚注说明。
- source_word: בִּימֵי
  choice: 在位期间
  rationale: 字面为“在……的日子”；因对象是犹大王约雅敬，此处指其统治时期，译作“在位期间”在现代汉语中清楚自然。
- source_word: יְהוֹיָקִים
  choice: 约雅敬
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: בֶּן יֹאשִׁיָּהוּ
  choice: 约西亚的儿子
  rationale: 直接保留希伯来文的父子关系表达。
- source_word: מֶלֶךְ יְהוּדָה
  choice: 犹大王
  rationale: 以自然的现代汉语称谓表达其“犹大之王”的身份。
- source_word: לֵאמֹר
  choice: 说：
  rationale: 该词引出下一节的神谕内容；“说：”既保留与下文的衔接，也比孤立的分词形式更符合中文标点和句法。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名YHWH。正文音译为“雅威”，保留其作为专名的性质；脚注交代希伯来文形式，避免将专名无说明地改作称号。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“雅威的话临到耶利米”保留先知书的固定启示公式；将时间状语置于句首，并把王号、父名和人名组合为符合汉语习惯的结构。
