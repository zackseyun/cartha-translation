  text: לָ/כֵ֗ן כֹּ֥ה אָמַ֛ר יְהוָ֥ה צְבָא֖וֹת אֱלֹהֵ֣י יִשְׂרָאֵ֑ל לֹֽא יִכָּרֵ֨ת אִ֜ישׁ לְ/יוֹנָדָ֧ב בֶּן רֵכָ֛ב עֹמֵ֥ד לְ/פָנַ֖/י כָּל הַ/יָּמִֽים־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/035/019.yaml
  text: 'Therefore thus says Yahweh of hosts[b][a], the God of Israel: Jonadab the son of Rechab shall never lack a man standing before me all the days.'
translation:
  language: zh_hans
  text: 因此，万军之耶和华——以色列的神如此说：“利甲的儿子约拿达的后裔中，必不断有人[a]站在我面前，直到永远[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文近直译：“必不从利甲的儿子约拿达断绝一个人。”此处“断绝”用于家系延续的表达。
    reason: 说明 כרת 的“断绝、剪除”意象及其有关家系持续存在的习语用法。
  - marker: b
    text: “站在我面前”可表示在神面前服事，也可泛指在神面前；本节没有说明某种特定职分。
    reason: 保留该短语在神的临在与服事之间的开放性，避免限定为祭司或圣殿职务。
lexical_decisions:
- source_word: לָכֵן
  choice: 因此
  rationale: 保留推论关系，表明以下应许是基于上文利甲族人的顺服而作出的结论。
- source_word: כֹּה אָמַר
  choice: 如此说
  rationale: 沿用先知宣告的使者公式，庄重而不晦涩。
- source_word: יְהוָה צְבָאוֹת
  choice: 万军之耶和华
  rationale: 以“耶和华”音译神名，以“万军”保留 צְבָאוֹת 所涵盖的众军之意，不限缩为地上的军队。
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: 以色列的神
  rationale: 直接表达原文的属格结构及身份说明。
- source_word: לֹא יִכָּרֵת אִישׁ לְיוֹנָדָב
  choice: 约拿达，必永不断绝有人
  rationale: כרת 的字面义为“剪除、断绝”；此处用于家系中有人持续存在的习语。“不断绝有人”兼顾字面意象与现代汉语可懂度。
- source_word: לְיוֹנָדָב בֶּן־רֵכָב
  choice: 利甲的儿子约拿达
  rationale: 采用现代中文圣经人名的通行译法，并清楚保留父子关系。
- source_word: עֹמֵד לְפָנַי
  choice: 在我面前侍立
  rationale: 保留分词“站立”的持续状态；“侍立”可表达在尊者面前站立并服事的含义，同时不明确指定祭司或圣殿职分。
- source_word: כָּל הַיָּמִים
  choice: 永
  rationale: 该时间短语字面为“所有的日子”，在此具有持续不绝的习语意义；以“永不断绝”自然传达其延续性，而不另行界定具体期限。
theological_decisions:
- issue: “在我面前侍立”所指的身份或职分
  choice: 保留为在神面前侍立，不指明特定制度性职分
  alternative: 解释为利甲族永远担任祭司或圣殿职务；或仅解释为后裔存续
  rationale: 原文可带有在神面前服事之意，却没有说明祭司、利未人或其他具体职分。保留“侍立”既不把应许缩减为单纯繁衍，也不把它限定为祭司制度。
- issue: 应许持续的范围
  choice: 译作“永不断绝”，表达持续性的家系应许
  alternative: 严格直译为“所有的日子都不被剪除一个人”
  rationale: 原文以“不被剪除”与“所有的日子”共同表达延续不绝；中文采用自然习语，但不进一步断言其实现方式。
translation_notes:
  register: 采用现代、庄重、可朗读的标准普通话书面语。“万军之耶和华”保留先知宣告的传统力度；破折号将“以色列的神”作为同位说明。正文中的[a]、[b]分别紧随其所注释的表达。
