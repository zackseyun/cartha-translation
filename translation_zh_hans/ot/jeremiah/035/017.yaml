  text: לָ֠/כֵן כֹּֽה אָמַ֨ר יְהוָ֜ה אֱלֹהֵ֤י צְבָאוֹת֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל הִנְ/נִ֧י מֵבִ֣יא אֶל יְהוּדָ֗ה וְ/אֶ֤ל כָּל יֽוֹשְׁבֵי֙ יְר֣וּשָׁלִַ֔ם אֵ֚ת כָּל הָ֣/רָעָ֔ה אֲשֶׁ֥ר דִּבַּ֖רְתִּי עֲלֵי/הֶ֑ם יַ֣עַן דִּבַּ֤רְתִּי אֲלֵי/הֶם֙ וְ/לֹ֣א שָׁמֵ֔עוּ וָ/אֶקְרָ֥א לָ/הֶ֖ם וְ/לֹ֥א עָנֽוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/035/017.yaml
  text: 'Therefore[a], thus says Yahweh, the God of hosts, the God of Israel: Behold, I am bringing on Judah and on all the inhabitants of Jerusalem all the disaster that I have spoken against them, because I spoke to them and they did not listen, and I called to them and they did not answer.'
translation:
  language: zh_hans
  text: 所以，万军之上帝、以色列的上帝耶和华如此说：“看哪，我必使一切我所宣告要降在犹大和耶路撒冷所有居民身上的灾祸[a]临到他们；因为我向他们说话，他们却不听；我呼唤他们，他们却不回答。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“一切灾难”。这里的希伯来词在其他语境中也可译为“恶”，但本节指上帝所宣告、将临到犹大和耶路撒冷的审判。
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: 所以
  rationale: 承接上文利甲族顺从与犹大不顺从的对比，表达由此得出的结论；“所以”在现代汉语中自然清楚。
- source_word: כֹּה אָמַר
  choice: 如此说
  rationale: 保留先知信息中庄重而固定的使者公式。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 直接音译圣名，符合现代简体中文圣经读者熟悉的表达，并区别于称号“主”。
- source_word: אֱלֹהֵי צְבָאוֹת
  choice: 万军之上帝
  rationale: 保留“军队／众军”的广泛意象，不限定为地上或天上的军队；原文结构为“万军的上帝”。
- source_word: הִנְנִי
  choice: 看哪，我必
  rationale: “看哪”保留郑重宣告和强调功能；未机械译出进行体，而以“必”自然表达即将施行且确定的行动。
- source_word: מֵבִיא אֶל
  choice: 降在……身上／降给
  rationale: 在审判语境中表示使灾祸临到对象；中文采用搭配自然的“降在……身上”并以“降给他们”完成主句。
- source_word: כָּל הָרָעָה
  choice: 一切灾祸
  rationale: רָעָה在此指预告的惩罚性灾难，而非道德上的邪恶；“灾祸”兼具庄重和清晰。
- source_word: אֲשֶׁר דִּבַּרְתִּי עֲלֵיהֶם
  choice: 我所说要降在……身上的
  rationale: 按审判宣告的语义译出“针对他们所说的灾祸”，避免生硬的“对他们说”。
- source_word: יַעַן
  choice: 因为
  rationale: 直接引出施行审判的原因。
- source_word: וְלֹא שָׁמֵעוּ
  choice: 他们却不听
  rationale: שׁמע在此不只是听见，也含听从之意；“不听”保留中文中同样可兼指拒绝听从的语义张力。
- source_word: וָאֶקְרָא לָהֶם וְלֹא עָנוּ
  choice: 我呼唤他们，他们却不回答
  rationale: 贴近原文的呼唤—回应关系，并自然呈现他们拒绝回应上帝。
theological_decisions:
- issue: 神圣四字名 יהוה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用神的专名；译文保留专名而不改作“主”。“耶和华”是现代中文圣经传统中最广为人知且可辨识的形式。
- issue: הָרָעָה 与上帝审判的关系
  choice: 灾祸
  alternative: 恶／灾难
  rationale: 此处所指是上帝先前宣告、将临到犹大和耶路撒冷的审判性灾害，不是说道德之恶；“灾祸”保留伤害与惩罚的力度。
- issue: שׁמע 是否明确译作“听从”
  choice: 不听
  alternative: 不听从
  rationale: 原词在语境中包含服从的要求，但其基本听觉意象与后面的“呼唤／回答”相呼应；“不听”在中文中也可自然表示不肯听从，因而保留双重意味。
translation_notes:
  register: 采用现代、庄重而易懂的先知宣告体。“如此说”“看哪”保留原文公式和郑重语气；其余句法按现代汉语调整，避免欧化。所有脚注标记均已置于正文对应词后。
