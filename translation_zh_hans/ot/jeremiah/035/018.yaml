source:
  edition: WLC
  text: וּ/לְ/בֵ֨ית הָ/רֵכָבִ֜ים אָמַ֣ר יִרְמְיָ֗הוּ כֹּֽה אָמַ֞ר יְהוָ֤ה צְבָאוֹת֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל יַ֚עַן אֲשֶׁ֣ר שְׁמַעְתֶּ֔ם עַל מִצְוַ֖ת יְהוֹנָדָ֣ב אֲבִי/כֶ֑ם וַֽ/תִּשְׁמְרוּ֙ אֶת כָּל מִצְוֺתָ֔י/ו וַֽ/תַּעֲשׂ֔וּ כְּ/כֹ֥ל אֲשֶׁר צִוָּ֖ה אֶתְ/כֶֽם־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/035/018.yaml
  text: 'And to the house of the Rechabites Jeremiah said[a], “Thus says Yahweh of hosts, the God of Israel: Because you have obeyed the command of Jehonadab your father, and have kept all his commands, and have done according to all that he commanded you,”'
translation:
  language: zh_hans
  text: 耶利米对利甲家族说：“万军之雅威——以色列的上帝如此说：因为你们听从了你们祖先耶何拿达[a]的命令，遵守了他的一切吩咐，并照他所吩咐你们的一切去做，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 传统中译通常作“约拿达”；本节希伯来文使用较完整的名字形式“耶何拿达”。
    reason: 说明原文名字形式及常见中译的差异。
lexical_decisions:
- source_word: וּלְבֵית הָרֵכָבִים
  choice: 对利甲家族
  rationale: בֵּית在这里指利甲的家系或宗族；译作“家族”比字面的“家”更符合现代汉语，同时保留群体与血脉传承之意。
- source_word: כֹּה אָמַר
  choice: 如此说
  rationale: 保留先知传信公式的庄重语体，并与现代汉语表达相容。
- source_word: יְהוָה צְבָאוֹת
  choice: 万军之雅威
  rationale: “雅威”直接音译神名יהוה；“万军”简洁保留צְבָאוֹת所指天上、地上众军的宽广含义。
- source_word: שְׁמַעְתֶּם עַל מִצְוַת
  choice: 听从了……的命令
  rationale: שׁמע与עַל连用在此不只是听见，而是听从、顺服；“听从”兼顾听与行的语义。
- source_word: יְהוֹנָדָב אֲבִיכֶם
  choice: 你们祖先耶何拿达
  rationale: אָב可指父亲或宗族祖先；此处面对利甲后裔，译为“祖先”更符合语境。“耶何拿达”反映本节较完整的希伯来名字形式。
- source_word: וַתִּשְׁמְרוּ אֶת כָּל מִצְוֺתָיו
  choice: 遵守了他的一切吩咐
  rationale: שׁמר用于命令时表示谨守、遵行；“遵守”是自然准确的现代汉语。
- source_word: וַתַּעֲשׂוּ כְּכֹל אֲשֶׁר צִוָּה אֶתְכֶם
  choice: 照他所吩咐你们的一切去做
  rationale: “照”明确保留כְּ的“按照、依照”之意，而不把原文简化为仅仅“做了一切”。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”按其较普遍认可的发音音译，保留其作为专名而非头衔的性质。
- issue: אָבִיכֶם所指的亲属关系
  choice: 你们祖先
  alternative: 你们的父亲
  rationale: 说话对象是利甲家族的后代，约拿达是其先祖；希伯来语אָב本可涵盖祖先，因此此译不把语境误解为直接生父。
- issue: 保留因果句的未完结构
  choice: 以逗号收束本节
  alternative: 补出“所以”或改为句号
  rationale: יַעַן אֲשֶׁר引出的原因从句要到下一节才得到主句回应；本节不擅自补足，以保留原文跨节延续的句法张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“如此说”保留先知宣告公式；破折号标明“万军之雅威”与“以色列的上帝”是同一位的并列称号。末尾保留逗号，因为本节的“因为”从句在下一节才完成。
