id: JER.35.12
reference: Jeremiah 35:12
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַֽ/יְהִי֙ דְּבַר יְהוָ֔ה אֶֽל יִרְמְיָ֖הוּ לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/035/012.yaml
  text: Then the word of Yahweh came to Yirmeyahu[a], saying[b],
translation:
  language: zh_hans
  text: 那时，耶和华[a]的话临到耶利米[b]，说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文为 יהוה（YHWH），是以色列上帝的名字；此处译作“耶和华”，也常拟音作“雅威”。
    reason: 说明神名的源语形式及中文译写选择。
  - marker: b
    text: “耶利米”的希伯来文形式为 Yirmeyahu（יִרְמְיָהוּ）。
    reason: 说明人名的希伯来文形式。
lexical_decisions:
- source_word: וַיְהִי
  choice: 那时……临到
  rationale: 这里的叙事性连接形式用于推进事件；结合后面的“耶和华的话”，译为“那时……临到”既符合现代汉语，也保留先知书惯用的启示公式。
- source_word: דְּבַר
  choice: 话
  rationale: 在“耶和华的话”这一固定先知性表达中，“话”准确指来自上帝的言语或信息，并与原文措辞保持紧密对应。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的神名译写“耶和华”，而不以“主”这一称号代替原文中的专名。
- source_word: אֶל
  choice: 临到
  rationale: 原文介词本义为“向、到”，但在“耶和华的话……到某人”这一希伯来语公式中，现代汉语自然表达为“临到某人”。
- source_word: יִרְמְיָהוּ
  choice: 耶利米
  rationale: 采用该先知姓名在现代中文中的通行译名；脚注说明其希伯来语形式，以保留源语信息。
- source_word: לֵאמֹר
  choice: 说
  rationale: 该不定式用于引出随后讲话的内容；汉语以“说”接冒号，简洁自然，并保留原文的引语导入功能。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 耶和华
  alternative: 雅威；主
  rationale: 原文明确使用四字神名，而非“主”这一称号，因此正文保留专名。中文采用广为人知的“耶和华”，并在脚注交代希伯来文形式及另一常见拟音“雅威”，避免把拟音选择本身绝对化。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“耶和华的话临到……说”保留先知书反复出现的启示公式；以“那时”承接上下文，避免古雅的“事情发生了”或“于是有……”。
