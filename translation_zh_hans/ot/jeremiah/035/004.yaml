id: JER.35.4
reference: Jeremiah 35:4
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וָ/אָבִ֤א אֹתָ/ם֙ בֵּ֣ית יְהוָ֔ה אֶל לִשְׁכַּ֗ת בְּנֵ֛י חָנָ֥ן בֶּן יִגְדַּלְיָ֖הוּ אִ֣ישׁ הָ/אֱלֹהִ֑ים אֲשֶׁר אֵ֨צֶל֙ לִשְׁכַּ֣ת הַ/שָּׂרִ֔ים אֲשֶׁ֣ר מִ/מַּ֗עַל לְ/לִשְׁכַּ֛ת מַעֲשֵׂיָ֥הוּ בֶן שַׁלֻּ֖ם שֹׁמֵ֥ר הַ/סַּֽף־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/035/004.yaml
  text: So I brought them into the house of Yahweh[a], into the chamber of the sons of Hanan son of Igdaliah, the man of God, which was beside the chamber of the officials, which was above the chamber of Maaseiah son of Shallum[c][b], the keeper of the threshold.
translation:
  language: zh_hans
  text: 于是，我把他们带进雅威的殿[a]，带到哈难众子[b]的房间；哈难是神人伊基大利雅的儿子。这房间在官长们的房间旁边；官长们的房间在守门人[c]沙龙的儿子玛西雅的房间上方。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“雅威的家”，即雅威的殿。
    reason: 说明原文的字面表达及其语境含义。
  - marker: b
    text: “哈难众子”也可能指哈难的后裔、家族成员，或与他有关的群体。
    reason: 保留 בְּנֵי 在群体称谓中的语义范围。
  - marker: c
    text: 直译“看守门槛的人”，即负责门户的守门人。
    reason: 说明职衔的字面意象及通常含义。
lexical_decisions:
- source_word: וָאָבִא
  choice: 于是，我把他们带进
  rationale: 该第一人称单数叙事形式承接前文，表示随后发生的行动；“于是”自然体现事件次序。
- source_word: בֵּית יְהוָה
  choice: 雅威的殿
  rationale: בֵּית 字面为“房屋”，在此指圣殿；译作“殿”符合现代汉语圣殿语境，并以“雅威”直接呈现神名。
- source_word: לִשְׁכַּת
  choice: 房间
  rationale: 该词指圣殿建筑中的房室；“房间”比“内室”更通俗，也不额外限定其用途。
- source_word: בְּנֵי חָנָן
  choice: 哈难众子
  rationale: 保留“儿子们”的字面表达，同时用脚注说明它也可能泛指后裔、家族或所属群体。
- source_word: אִישׁ הָאֱלֹהִים
  choice: 神人
  rationale: 这是希伯来圣经中常见的尊称；“神人”简洁、庄重，并保留其称号性质。
- source_word: אֵצֶל
  choice: 旁边
  rationale: 准确表达两个房间彼此相邻的空间关系。
- source_word: הַשָּׂרִים
  choice: 众官长
  rationale: שׂרים 在此更可能指有职权的官员；“官长”保留古代职衔的庄重感，又不误解为王子。
- source_word: מִמַּעַל לְ
  choice: 在……上面
  rationale: 保留原文所述的垂直建筑位置关系。
- source_word: שֹׁמֵר הַסַּף
  choice: 守门人
  rationale: 字面为“看守门槛者”，在圣殿语境中指负责门户的职员；“守门人”是自然且明确的现代汉语表达。
- source_word: חָנָן ... יִגְדַּלְיָהוּ ... מַעֲשֵׂיָהוּ ... שַׁלֻּם
  choice: 哈难……伊基大利雅……玛西雅……沙龙
  rationale: 按现代中文圣经人名音译惯例处理专名。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；“雅威”较直接地音译该盟约之名，避免以称号替代专名。
- issue: אִישׁ הָאֱלֹהִים 的称号性质
  choice: 神人
  alternative: 属神的人；一位神人
  rationale: 原文是固定称号，且“神”带定冠词；译作“神人”保留其传统称号性质，不进一步断定哈难的具体职分。
translation_notes:
  register: 采用现代、庄重而通俗的叙事文体。空间关系拆成两句，以免多层关系从句造成歧义；专名采用常见中文音译。所有脚注标记均置于相应正文词语之后。
