  text: וַ/יִּקְצְפ֧וּ הַ/שָּׂרִ֛ים עַֽל יִרְמְיָ֖הוּ וְ/הִכּ֣וּ אֹת֑/וֹ וְ/נָתְנ֨וּ אוֹת֜/וֹ בֵּ֣ית הָ/אֵס֗וּר בֵּ֚ית יְהוֹנָתָ֣ן הַ/סֹּפֵ֔ר כִּֽי אֹת֥/וֹ עָשׂ֖וּ לְ/בֵ֥ית הַ/כֶּֽלֶא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/037/015.yaml
  text: And the officials were enraged at Jeremiah[a], and they beat him and put him in the prison house, in the house of Jehonathan the scribe[b], for they had made it a prison.
translation:
  language: zh_hans
  text: 官长们对耶利米大为恼怒[a]，把他打了一顿，关进文士约拿单家里的监牢[b]，因为他们已经把那房子改作监牢。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“首领们向耶利米发怒。”
    reason: lexical_alternative
  - marker: b
    text: “文士”也可指书记或文书官。原文为“拘禁之所”，指设在文士约拿单家中的监牢。
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּקְצְפוּ
  choice: 大发怒气
  rationale: קצף表示强烈的愤怒或恼怒；“大发怒气”既体现强度，也符合现代汉语的庄重叙事语体。
- source_word: הַשָּׂרִים
  choice: 官长们
  rationale: שׂרים在本段指掌权的官员，而非王子；“官长”保留其治理权柄的含义，也符合先知书语境。
- source_word: וְהִכּוּ אֹתוֹ
  choice: 把他打了一顿
  rationale: נכה可指击打；此处是敌意拘押中的身体虐待，“打了一顿”比单次性的“打了他”更自然地表达殴打。
- source_word: וְנָתְנוּ אֹתוֹ
  choice: 关进
  rationale: נתן本义为放置，但与监牢地点连用时，汉语自然表达为“关进”，清楚传达拘禁动作。
- source_word: בֵּית הָאֵסוּר
  choice: 监牢
  rationale: 该短语直译为“拘禁之所”；现代汉语用“监牢”简洁准确，并与后文כלא形成自然呼应。
- source_word: בֵּית יְהוֹנָתָן הַסֹּפֵר
  choice: 文士约拿单家里
  rationale: 重复的בֵּית表明拘禁处设在约拿单的房屋中；סֹפֵר可指文书官或书记，“文士”较贴近原词，同时脚注说明其职务可能。
- source_word: כִּי
  choice: 因为
  rationale: כִּי在这里引出解释，说明为何约拿单的家可作为监牢；“因为”清楚保留因由关系。
- source_word: עָשׂוּ לְבֵית הַכֶּלֶא
  choice: 已经把那房子改作监牢
  rationale: עשה + לְ表达将某物用作或改作某物；补出由语境明确的“那房子”，使汉语指代清楚，“改作”也体现房屋用途的转变。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。“官长”避免将שׂרים误解为王子；“大发怒气”保留原文愤怒的强度；末句明确是把约拿单的房屋改作监牢。所有脚注标记均已置于正文相应位置。
