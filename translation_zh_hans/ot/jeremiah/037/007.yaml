base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/037/007.yaml
  text: 'Thus says Yahweh[a], the God of Israel: Thus you shall say to the king of Judah, who sent you to me to inquire of me, ‘Behold, Pharaoh’s army, which came out to help you, has returned to its own land[c][b], Egypt.’'
translation:
  language: zh_hans
  text: 耶和华[a]，以色列的上帝，如此说：“你们要对那差你们到我这里来求问我的犹大王这样说：‘看哪，前来帮助你们的法老军队[b]已经返回自己的国土埃及[c]。’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “耶和华”译自希伯来文的上帝之名 יהוה（YHWH）。
    reason: divine_name
  - marker: b
    text: “前来帮助你们的”也可译作“正出动来帮助你们的”。希伯来文使用分词，具体时态须由上下文判断。
    reason: lexical_alternative
  - marker: c
    text: “已经返回自己的国土埃及”也可译作“已经转回埃及地”。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文中通行且可辨识的专名“耶和华”译出四字神名，不以称号替代。
- source_word: כֹּה אָמַר
  choice: 如此说
  rationale: 保留先知传信公式的庄重和公式性，同时符合现代中文表达。
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: 以色列的上帝
  rationale: 直接表达希伯来语属格结构，所指明确。
- source_word: כֹּה תֹאמְרוּ
  choice: 你们要……这样说
  rationale: 自然表达指令语气，也与前面的传信公式形成呼应。
- source_word: הַשֹּׁלֵחַ אֶתְכֶם אֵלַי
  choice: 那差你们到我这里……的
  rationale: 按叙事处境将分词理解为已经发生的差遣，并保留关系从句结构。
- source_word: לְדָרְשֵׁנִי
  choice: 求问我
  rationale: דרשׁ在此指借先知寻求神谕或答复；“求问我”保留第一人称，也符合中文宗教语境。
- source_word: הִנֵּה
  choice: 看哪
  rationale: 保留引人注意和强调宣告的功能，并维持先知话语的庄重语体。
- source_word: חֵיל פַּרְעֹה
  choice: 法老军队
  rationale: חֵיל在这里明确指军事力量，译作“军队”简洁自然。
- source_word: הַיֹּצֵא לָכֶם לְעֶזְרָה
  choice: 前来帮助你们的
  rationale: 分词本身可表达正在出动或已经出动；正文按上下文采用自然的概括表达，并在脚注保留时态体貌上的歧义。
- source_word: שָׁב
  choice: 已经返回
  rationale: 完成式表示军队已经回转；“已经返回”清楚传达行动的完成及其现实结果。
- source_word: לְאַרְצוֹ מִצְרָיִם
  choice: 本国埃及
  rationale: 既体现“它的国土”这一代词关系，也将“埃及”自然处理为同位说明。
