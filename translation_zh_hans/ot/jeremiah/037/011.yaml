  text: When the army of the Chaldeans had gone up from Jerusalem because of Pharaoh’s army,[a]
translation:
  language: zh_hans
  text: 迦勒底人的军队因法老的军队而从耶路撒冷撤走时，[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文也可直译为“从耶路撒冷上去”；按上下文，这是指迦勒底军队因法老的军队而解除围城、撤离耶路撒冷。
    reason: 保留 עלה 的字面表达及其在围城语境中的可能含义。
lexical_decisions:
- source_word: וְהָיָה
  choice: （不另译）
  rationale: 这是叙事衔接结构，与后面的时间从句共同引出下一节的主句。现代汉语无需加“现在”或采用古雅的“事情发生了”之类套语。
- source_word: בְּהֵעָלוֹת
  choice: ……撤走时
  rationale: בְּ 加不定式构成时间背景；עלה 的基本义是“上去”，但与 מֵעַל（从……之上／从针对……的位置）连用，并处于围城的军事语境中，表示军队解除行动、撤离。
- source_word: חֵיל
  choice: 军队
  rationale: 此处指有组织的军事力量；“军队”自然、准确。
- source_word: הַכַּשְׂדִּים
  choice: 迦勒底人的
  rationale: 保留希伯来文的族名，而不直接解释为“巴比伦人的”。
- source_word: מֵעַל יְרוּשָׁלִָם
  choice: 从耶路撒冷
  rationale: 字面近于“从耶路撒冷之上／从针对耶路撒冷的位置”；结合围城语境，自然汉语表达为从耶路撒冷撤走。
- source_word: מִפְּנֵי
  choice: 因
  rationale: 这里表示面对法老军队而采取撤军行动的原因；“因”简洁地传达因果关系。
- source_word: חֵיל פַּרְעֹה
  choice: 法老的军队
  rationale: 准确表达希伯来文的属格结构，符合现代汉语习惯。
