base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/037/018.yaml
  text: Then Jeremiah said to King Zedekiah, “What have I sinned against you, against your servants, and against this people, that you have put me into the prison?”
translation:
  language: zh_hans
  text: 耶利米对西底家王说：“我究竟得罪了你、你的臣仆和这百姓什么，你们竟把我关进监牢？”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מֶה חָטָאתִי לְךָ
  choice: 我究竟得罪了你什么
  rationale: חטא ל־在此表示“得罪、冒犯某人”；用“究竟……什么”自然表达申辩语气，同时保留疑问的力度。
- source_word: עֲבָדֶיךָ
  choice: 你的臣仆
  rationale: 语境涉及君王的下属官员；“臣仆”既保留“仆人”的字面色彩，也符合宫廷语境。
- source_word: נְתַתֶּם אֹתִי אֶל־בֵּית הַכֶּלֶא
  choice: 你们竟把我关进监牢
  rationale: 字面为“你们把我交到监禁之所”；现代汉语以“关进监牢”清楚表达实际动作，“竟”传达כִּי在反问结果句中的责问语气。
theological_decisions:
- issue: 耶利米是否承认自己犯罪
  choice: 译作反问“我究竟得罪了……什么”
  alternative: 我犯了什么罪得罪你们
  rationale: 原文חטא可指犯罪或得罪；此处是耶利米质问被囚的依据，并非承认有罪。译文保留其申辩性质，不额外作神学判断。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“西底家王”依汉语称谓习惯排列；引语简洁有力，适合叙事中的当面申辩。
