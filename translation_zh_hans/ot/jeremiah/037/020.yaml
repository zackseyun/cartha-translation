  text: וְ/עַתָּ֕ה שְֽׁמַֽע נָ֖א אֲדֹנִ֣/י הַ/מֶּ֑לֶךְ תִּפָּל נָ֤א תְחִנָּתִ/י֙ לְ/פָנֶ֔י/ךָ וְ/אַל תְּשִׁבֵ֗/נִי בֵּ֚ית יְהוֹנָתָ֣ן הַ/סֹּפֵ֔ר וְ/לֹ֥א אָמ֖וּת שָֽׁם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/037/020.yaml
  text: So now[a], please hear, my lord the king; please let my plea fall before you, and do not send me back to the house of Jehonathan the scribe, lest I die there.
translation:
  language: zh_hans
  text: 如今，我主、我王啊，求你听我说；求你让我的恳求[a]呈到你面前。不要把我送回书记官约拿单的房子，免得我死在那里。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“让我的恳求落在你面前”。这是向上位者呈递请求的惯用表达。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: 现在
  rationale: 这是引出紧急请求的话语标记；现代汉语用“现在”自然明白，其承接语气可由上下文体现。
- source_word: שְׁמַע נָא
  choice: 求你听我说
  rationale: שׁמע是“听”，נָא使命令带有恳请语气；“求你听我说”既保留急切请求，也符合现代汉语表达。
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: 我主我王啊
  rationale: 保留“我主”这一敬称和“王”的身份称谓，并用“啊”表现当面呼告的宫廷语气。
- source_word: תִּפָּל נָא תְחִנָּתִי לְפָנֶיךָ
  choice: 让我的恳求呈到你面前
  rationale: 原文直译为“让我的恳求落在你面前”，是向上位者呈递请求的惯用说法；汉语以“呈到你面前”传达该习语的实际含义，同时保留“在你面前”的意象。
- source_word: תְחִנָּתִי
  choice: 我的恳求
  rationale: “恳求”兼具请求内容与恳切语气，比“祈求”更不易使读者误解为专指向神祷告。
- source_word: וְאַל תְּשִׁיבֵנִי
  choice: 不要把我送回
  rationale: שוב的使役形表示“使我返回”；在拘押语境中，“把我送回”准确而自然。
- source_word: בֵּית יְהוֹנָתָן הַסֹּפֵר
  choice: 书记约拿单的房子
  rationale: בֵּית直译为“房子”，此处虽用作拘禁地点，仍保留原文称法；הַסֹּפֵר按其官职译为“书记”。יְהוֹנָתָן采用现代中文圣经人名的通行形式“约拿单”。
- source_word: וְלֹא אָמוּת שָׁם
  choice: 免得我死在那里
  rationale: 形式上由“并且不”连接，语义上表达所害怕的结果；“免得”清楚保留目的与结果之间的张力。
