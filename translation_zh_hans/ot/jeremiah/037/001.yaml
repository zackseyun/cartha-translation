base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/037/001.yaml
  text: And King Zedekiah son of Josiah reigned in place of Coniah son of Jehoiakim[b][a], whom Nebuchadnezzar king of Babylon had made king in the land of Judah.
translation:
  language: zh_hans
  text: 约西亚的儿子西底家王接替约雅敬的儿子哥尼雅[a]作王；巴比伦王尼布甲尼撒[b]立西底家在犹大地作王。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “哥尼雅”在其他经文中也称“耶哥尼雅”。
    reason: alternative_reading
  - marker: b
    text: 本节希伯来文的名字拼写更接近“尼布甲利撒”；“尼布甲尼撒”是中文译本中通行的形式。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמְלָךְ
  choice: 作王
  rationale: 该叙事动词表示登位并执掌王权；“作王”自然、庄重，也与后半句使役形“立……作王”形成对应。
- source_word: תַּחַת
  choice: 接替
  rationale: 在王位承继的语境中表示取代某人；“接替”清楚表达继位关系。
- source_word: כָּנְיָהוּ
  choice: 哥尼雅
  rationale: 按本节希伯来文的实际名字形式音译，不在正文中统一改成较常见的“耶哥尼雅”；异名见脚注。
- source_word: אֲשֶׁר הִמְלִיךְ
  choice: 立他……作王
  rationale: 希伯来语使役形直指使某人成为王；关系代词所指为西底家，中文补出“他”以避免误解。
- source_word: נְבוּכַדְרֶאצַּר
  choice: 尼布甲尼撒
  rationale: 采用现代中文圣经读者较熟悉的标准译名，同时以脚注说明本节希伯来文拼写所反映的形式。
- source_word: בְּאֶרֶץ יְהוּדָה
  choice: 在犹大地
  rationale: 直接保留介词“在”和“地”的表达，不增添原文未明说的“统治全地”之类含义。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事文体。前句以分号连接继位与巴比伦王册立两项紧密相关的信息；保留“犹大地”，并避免为王权关系添加原文没有明示的解释。
