base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/037/002.yaml
  text: But he and his servants and the people of the land did not listen to the words of Yahweh that he spoke through Jeremiah the prophet[a][b][c].
translation:
  language: zh_hans
  text: 可是，他、他的臣仆和这地的百姓[b]，都不听[a]雅威借先知耶利米[c]所说的话。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“不听从（或不顺服）。”希伯来语动词可表示“听见”或“听从”，并可进而含有“顺服”的意思。
    reason: lexical_alternative
  - marker: b
    text: 希伯来语直译为“这地的百姓”；这个说法可以泛指当地民众，也可指普通百姓。
    reason: cultural_note
  - marker: c
    text: 希伯来语直译为“借先知耶利米的手”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/לֹא שָׁמַע
  choice: 可是……都不听
  rationale: וְ 在上下文中带有转折性的承接作用，译作“可是”自然呈现对比；שׁמע 在这里既可指听见、听从，也可蕴含顺服，正文用“不听”保留其听觉意象和回应含义。
- source_word: וַ/עֲבָדָיו
  choice: 和他的臣仆
  rationale: עֲבָדִים 在王室语境中可指仆人或臣属官员；“臣仆”兼顾其服事君王的身份与宫廷背景。
- source_word: וְ/עַם הָ/אָרֶץ
  choice: 以及当地的百姓
  rationale: 该短语直译为“那地的人民”，可泛指当地民众或普通百姓；“当地的百姓”在现代汉语中自然，又不过度限定其社会阶层。
- source_word: דִּבְרֵי יְהוָה
  choice: 雅威……所说的话
  rationale: דִּבְרֵי 为复数，译作“话”；יהוה 按其专名译作“雅威”，而不以称号替代。
- source_word: בְּ/יַד יִרְמְיָהוּ הַ/נָּבִיא
  choice: 借先知耶利米
  rationale: ביד 字面为“借……的手”，在此表达先知作为传话媒介；“借先知耶利米”准确传达工具或中介含义，并符合现代汉语表达。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名；“雅威”以音译保留其作为以色列之神专名的性质，不以称号“主”代替。
- issue: שׁמע 是否明确译为“顺服”
  choice: 不听
  alternative: 不听从；不顺服
  rationale: 该动词在语境中包含听从和顺服的意味，但正文采用“不听”以保留希伯来语在“听”与“顺服”之间的语义张力，脚注说明较强的可能含义。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。“臣仆”保留王室语境，“当地的百姓”使希伯来习语易于普通读者理解；句法保持原文三组主体并列及先知传话的中介关系。
