id: JER.37.10
reference: Jeremiah 37:10
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כִּ֣י אִם הִכִּיתֶ֞ם כָּל חֵ֤יל כַּשְׂדִּים֙ הַ/נִּלְחָמִ֣ים אִתְּ/כֶ֔ם וְ/נִ֨שְׁאֲרוּ בָ֔/ם אֲנָשִׁ֖ים מְדֻקָּרִ֑ים אִ֤ישׁ בְּ/אָהֳל/וֹ֙ יָק֔וּמוּ וְ/שָֽׂרְפ֛וּ אֶת הָ/עִ֥יר הַ/זֹּ֖את בָּ/אֵֽשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/037/010.yaml
  text: For even if you were to strike down the whole army of the Chaldeans who are fighting against you[a], and only wounded men remained among them, each in his tent[b], they would rise up and burn this city with fire.
translation:
  language: zh_hans
  text: 因为，即使你们击溃了正在与你们交战的迦勒底全军[a]，他们中间只剩下一些被刺伤的人[b]，各自在自己的帐篷里，他们也必起来，放火烧毁这城。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“巴比伦全军”。希伯来文作“迦勒底人”；在《耶利米书》中，这个族名称通常用来指巴比伦军队。
    reason: lexical_alternative
  - marker: b
    text: 直译“被刺的人”或“被刺穿的人”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: 因为，即使
  rationale: 兼顾כִּי承接上文的解释作用和אִם所引出的强烈让步假设；现代汉语以“因为，即使”自然表达。
- source_word: הִכִּיתֶם
  choice: 你们击溃了
  rationale: נכה在军事语境中指击打、击败；“击溃”既体现全军遭到重创，也符合假设句语境。
- source_word: כָּל חֵיל כַּשְׂדִּים
  choice: 迦勒底全军
  rationale: חֵיל在此指军队，“全军”简洁保留כָּל与集合名词的整体含义。
- source_word: כַּשְׂדִּים
  choice: 迦勒底
  rationale: 直接保留希伯来文族名；在耶利米书中通常指巴比伦方面的军队，另义置于脚注。
- source_word: הַנִּלְחָמִים אִתְּכֶם
  choice: 正在与你们交战的
  rationale: 此军事敌对语境中的אֵת表示交战对象；“与你们交战”在汉语中已清楚表达敌对关系。
- source_word: וְנִשְׁאֲרוּ בָם
  choice: 他们中间只剩下
  rationale: נשׁאר表示剩下；“只”明确呈现极端假设中仅有少数余者的限制意味。
- source_word: אֲנָשִׁים מְדֻקָּרִים
  choice: 一些被刺伤的人
  rationale: מְדֻקָּרִים本义为被刺、被戳穿；正文采用自然且较贴近原文的“被刺伤”，不擅自断定伤势必然致命。
- source_word: אִישׁ בְּאָהֳלוֹ
  choice: 各自在自己的帐篷里
  rationale: 以“各自”表达אִישׁ的逐一分配含义，并自然体现第三人称单数所属关系。
- source_word: יָקֻמוּ
  choice: 他们也必起来
  rationale: 未完成式在假设结果中表达必然会发生的行动；“也必”传达即便只剩伤员仍会起来的反常强调。
- source_word: וְשָׂרְפוּ אֶת הָעִיר הַזֹּאת בָּאֵשׁ
  choice: 放火烧毁这城
  rationale: 以自然现代汉语表达“用火烧这城”；“烧毁”保留行动的毁灭性结果，避免生硬重复“用火焚烧”。
