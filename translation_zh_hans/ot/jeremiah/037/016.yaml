  text: For Jeremiah had come into the dungeon house and into the cells[a], and Jeremiah remained there many days.
translation:
  language: zh_hans
  text: 原来，耶利米进到地牢，进入囚室[a]，在那里停留了许多日子。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“拱顶房间”或“隔间”。这个希伯来词很少见，可能指监牢内封闭的小室。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 原来
  rationale: 此处引出对耶利米受囚处境的补充说明；“原来”在现代汉语叙事中自然表达解释性语气，同时不把它限定为纯时间从句。
- source_word: בָא
  choice: 进了／到了
  rationale: בוא 与 אֶל 连用表示进入或来到某处；按两个地点在汉语中的自然搭配分别译为“进了”和“到了”。
- source_word: בֵּית הַבּוֹר
  choice: 地牢
  rationale: 字面为“坑（或蓄水池）之屋”；在监禁语境中，“地牢”既传达地下囚禁场所的意象，也比生硬的“坑屋”自然。
- source_word: הַחֲנֻיוֹת
  choice: 囚室[a]
  rationale: 这是罕见词，可能指监牢内封闭的隔间、拱顶房间或类似小室；正文用清楚自然的“囚室”，并以脚注保留建筑形态上的不确定性。
- source_word: וַיֵּשֶׁב שָׁם
  choice: 并在那里待了
  rationale: ישׁב 可指坐、居住或停留；此处重点是持续受囚，而非身体姿势，因此译作“待了”。
- source_word: יָמִים רַבִּים
  choice: 许多天
  rationale: 贴近希伯来语的时间表达，明确保留按日计的较长时段。
