id: JER.37.14
reference: Jeremiah 37:14
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יִרְמְיָ֜הוּ שֶׁ֗קֶר אֵינֶ֤/נִּי נֹפֵל֙ עַל הַ/כַּשְׂדִּ֔ים וְ/לֹ֥א שָׁמַ֖ע אֵלָ֑י/ו וַ/יִּתְפֹּ֤שׂ יִרְאִיָּיה֙ בְּ/יִרְמְיָ֔הוּ וַ/יְבִאֵ֖/הוּ אֶל הַ/שָּׂרִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/037/014.yaml
  text: But Jeremiah said[a], “That is a lie; I am not defecting to the Chaldeans.” But he would not listen to him[c][b], and Irijah seized Jeremiah and brought him to the officials.
translation:
  language: zh_hans
  text: 耶利米说：“这是谎话！我不是要投奔迦勒底人[a][b]。”伊利雅却不听他，就抓住耶利米，把他带到官员[c]那里。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我不是要转投迦勒底人”或“我不是要归降迦勒底人”。
    reason: lexical_alternative
  - marker: b
    text: “迦勒底人”在这里指巴比伦军队。
    reason: cultural_note
  - marker: c
    text: 或译：“首领”；希伯来语这个词可指身居高位的统治者或官员。
    reason: lexical_alternative
lexical_decisions:
- source_word: שֶׁקֶר
  choice: 这是谎话
  rationale: 该词在这里是对指控的强烈反驳；“这是谎话”自然、直接，保留了原文的力度。
- source_word: אֵינֶנִּי נֹפֵל עַל הַכַּשְׂדִּים
  choice: 我不是要投奔迦勒底人
  rationale: נֹפֵל עַל 在此军事政治语境中指转到敌方阵营，并非字面上的“倒下”；“投奔”准确表达这一含义，同时不强行判定其具体动机。
- source_word: הַכַּשְׂדִּים
  choice: 迦勒底人
  rationale: 保留希伯来文的族群政治称谓；本章语境中指巴比伦军队。
- source_word: וְלֹא שָׁמַע אֵלָיו
  choice: 却不听他
  rationale: 表达伊利雅不接受耶利米的申辩，而不只是没有听见。
- source_word: וַיִּתְפֹּשׂ
  choice: 抓住
  rationale: 保留动词所表达的强制拘拿动作，避免用“逮捕”额外加入更明确的法律程序含义。
- source_word: הַשָּׂרִים
  choice: 官员
  rationale: 该词在此指掌权的高级人物；“官员”是清楚、现代且不过度限定身份的译法。
- source_word: וַיְבִאֵהוּ אֶל
  choice: 把他带到……那里
  rationale: 自然表达使役形式的“带去”，符合连续叙事。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“投奔”传达转到敌方阵营的语境义；“抓住”保留原文动作感；“官员”避免“王子”等可能引起误解的身份限定。
