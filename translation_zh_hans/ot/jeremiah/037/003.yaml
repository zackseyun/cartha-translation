  text: וַ/יִּשְׁלַח֩ הַ/מֶּ֨לֶךְ צִדְקִיָּ֜הוּ אֶת יְהוּכַ֣ל בֶּן שֶֽׁלֶמְיָ֗ה וְ/אֶת צְפַנְיָ֤הוּ בֶן מַֽעֲשֵׂיָה֙ הַ/כֹּהֵ֔ן אֶל יִרְמְיָ֥הוּ הַ/נָּבִ֖יא לֵ/אמֹ֑ר הִתְפַּלֶּל נָ֣א בַעֲדֵ֔/נוּ אֶל יְהוָ֖ה אֱלֹהֵֽי/נוּ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/037/003.yaml
  text: Then King Zedekiah sent Jehucal son of Shelemiah and Zephaniah son of Maaseiah the priest to Jeremiah the prophet[a], saying, “Please pray to Yahweh our God for us.”
translation:
  language: zh_hans
  text: 西底家王派示利米雅的儿子犹甲和玛西雅的儿子、祭司西番雅去见先知耶利米[a]，对他说：“请你为我们向我们的上帝雅威祷告。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文“祭司”的修饰范围可有歧义：通常理解为指西番雅；也可能指他的父亲玛西雅。
    reason: 保留希伯来语中“祭司”归属的句法歧义，同时说明正文采用的较通常理解。
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: 派……去见
  rationale: 该叙事形式推进事件；中文无需机械添加“然后”，“派……去见”自然表达差遣到某人那里。
- source_word: הַמֶּלֶךְ צִדְקִיָּהוּ
  choice: 西底家王
  rationale: 按现代汉语习惯将君王名置于称号之前。
- source_word: יְהוּכַל בֶּן שֶׁלֶמְיָה
  choice: 示利米雅的儿子犹甲
  rationale: 保留父子关系，并采用常见、简洁的汉语圣经人名译法；本节希伯来文本使用全名 יְהוּכַל。
- source_word: צְפַנְיָהוּ בֶן מַעֲשֵׂיָה הַכֹּהֵן
  choice: 祭司玛西雅的儿子西番雅
  rationale: 希伯来语末尾“祭司”的修饰对象在句法上可有歧义；无标点辅音文本中，它也可理解为玛西雅的称号。此译法采用自然的汉语表达，同时以脚注保留另一种理解。
- source_word: אֶל יִרְמְיָהוּ הַנָּבִיא
  choice: 去见先知耶利米
  rationale: 自然表达差遣使者到某人那里，并保留耶利米的先知身份。
- source_word: לֵאמֹר
  choice: 对他说
  rationale: 以自然汉语引出直接引语；单数“他”指耶利米。
- source_word: הִתְפַּלֶּל נָא בַעֲדֵנוּ
  choice: 请你为我们……祷告
  rationale: 祈使式表达“祷告”，נָא 表示恳请，בַעֲדֵנוּ 表示代求的对象。
- source_word: יְהוָה אֱלֹהֵינוּ
  choice: 雅威我们的上帝
  rationale: 将四字神名音译为“雅威”，并完整保留“我们的上帝”；词序贴近原文而在汉语中仍可理解。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用以色列上帝的专名；音译“雅威”避免以称号代替专名，也不将传统的另一种发音形式写入正文。
- issue: “祭司”所修饰的对象
  choice: 理解为玛西雅
  alternative: 理解为西番雅，即“玛西雅的儿子、祭司西番雅”
  rationale: הַכֹּהֵן 紧接在“玛西雅”之后，形式上可修饰玛西雅；但同一人物西番雅在耶利米书其他经文中被称为祭司，因此另一理解也很有根据。正文采用一种可行读法，脚注明确保留歧义。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“请你……祷告”保留恳求语气；人名采用通行汉语圣经译名。正文不以标点武断消除“祭司”修饰对象的真实歧义，而用脚注呈现另一读法。
