  text: וְ/שָׁ֨בוּ֙ הַ/כַּשְׂדִּ֔ים וְ/נִלְחֲמ֖וּ עַל הָ/עִ֣יר הַ/זֹּ֑את וּ/לְכָדֻ֖/הָ וּ/שְׂרָפֻ֥/הָ בָ/אֵֽשׁ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/037/008.yaml
  text: Then the Chaldeans will return and fight against this city[a], and they will capture it and burn it with fire.
translation:
  language: zh_hans
  text: 迦勒底人[a]必回来攻打这城；他们必攻取这城，放火焚烧。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“巴比伦人”。希伯来文作“迦勒底人”，这是本段上下文所用的历史称谓。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁבוּ
  choice: 必回来
  rationale: שׁוּב在此表示军队撤离后“回来”；结合预言语境，用“必”自然表达未完成式所指的确定将来行动。
- source_word: הַכַּשְׂדִּים
  choice: 迦勒底人
  rationale: 保留希伯来文中的族群兼政治称谓；“巴比伦人”是合乎语境的解释性对应词，列入脚注。
- source_word: וְנִלְחֲמוּ עַל
  choice: 攻打
  rationale: נלחם与עַל连用表示与某对象交战；对军队针对城池的行动而言，“攻打”比直译“与……争战”更自然准确。
- source_word: הָעִיר הַזֹּאת
  choice: 这城
  rationale: 忠实体现近指代词זֹאת，并采用现代中文圣经叙事中简洁自然的表达。
- source_word: וּלְכָדֻהָ
  choice: 攻取这城
  rationale: לכד用于城池时表示以军事行动夺取；明确重复“这城”，避免连续代词在中文中指向不清。
- source_word: וּשְׂרָפֻהָ בָאֵשׁ
  choice: 放火焚烧
  rationale: 希伯来语字面为“用火烧它”；“放火焚烧”保留火烧的强调，同时符合现代汉语习惯。
