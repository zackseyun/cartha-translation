base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/037/013.yaml
  text: And when he was at the Benjamin Gate[a], there was a captain of the guard there whose name was Irijah son of Shelemiah, son of Hananiah, and he seized Jeremiah the prophet, saying, “You are deserting to the Chaldeans!”
translation:
  language: zh_hans
  text: 耶利米在便雅悯门那里时，有一名负责守卫的官员在那里，名叫伊利雅，是示利米雅的儿子、哈拿尼雅的孙子。他抓住先知耶利米，说：“你是投奔迦勒底人去的！[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你是在倒向迦勒底人！”、“你是在投降迦勒底人！”希伯来文直译为“你正倒向迦勒底人”。
    reason: 保留希伯来习语“倒向”的字面形象，并说明其在军事政治语境中“投奔、倒向或投降敌方”的译法范围。
lexical_decisions:
- source_word: בְּשַׁעַר בִּנְיָמִן
  choice: 便雅悯门
  rationale: שַׁעַר与地名连用，指城门；采用现代中文圣经语境中自然、明确的专名表达。
- source_word: בַּעַל פְּקִדֻת
  choice: 值勤官
  rationale: 该短语字面指负有监管或当值职责的人；结合城门场景译为“值勤官”，既说明其职务，又不把具体军阶规定得超过原文。
- source_word: יִרְאִיָּה
  choice: 伊利雅
  rationale: 按希伯来人名音译，并采用中文圣经传统中通行、易辨认的形式。
- source_word: וַיִּתְפֹּשׂ
  choice: 抓住
  rationale: 动词表示强行拿住；“抓住”保留实际且敌对的动作，不额外引入原文未明说的正式司法程序。
- source_word: יִרְמְיָהוּ הַנָּבִיא
  choice: 先知耶利米
  rationale: 以自然现代中文表达希伯来文中人名与身份称谓的同位关系。
- source_word: אֶל הַכַּשְׂדִּים אַתָּה נֹפֵל
  choice: 你要投奔迦勒底人
  rationale: נפל与אֶל在军事政治语境中是倒向、转投对方之意；“投奔”清楚传达指控，同时保留“迦勒底人”这一族群政治称谓。
theological_decisions: []
