base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/037/009.yaml
  text: 'Thus says Yahweh: Do not deceive yourselves[a], saying[c][b], ‘The Chaldeans will surely go away from us,’ for they will not go away.'
translation:
  language: zh_hans
  text: 耶和华如此说：“不要自欺[a]，说：‘迦勒底人[c]必定[b]会离开我们’，因为他们不会离开。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“不要自己迷惑自己”。原文直译含“你们的性命（自身）”；这是一个习语，在这里警告人不可自我欺骗或抱有虚假的把握。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“必定会从我们这里撤走”。原文用不定式绝对形与同一动词的限定形式连用，以加强语气。
    reason: lexical_alternative
  - marker: c
    text: “迦勒底人”在这里指巴比伦军队。
    reason: cultural_note
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  choice: 耶和华如此说
  rationale: 保留先知传达神谕的固定格式；语序庄重而符合现代汉语。
- source_word: אַל תַּשִּׁיאוּ נַפְשֹׁתֵיכֶם
  choice: 不要自欺
  rationale: 这是涉及“你们自己/你们的性命”的希伯来语习语，在本语境中指自我欺骗或抱有虚假把握，不宜按字面译成“抬起你们的心”。
- source_word: לֵאמֹר
  choice: 说
  rationale: 直接引出他们用来自欺的话，既贴近原文，也符合自然汉语。
- source_word: הָלֹךְ יֵלְכוּ
  choice: 必定会离开
  rationale: 不定式绝对形与限定动词连用，加强“去、离开”的语气；“必定”体现这种强调。
- source_word: מֵעָלֵינוּ
  choice: 离开我们
  rationale: 表达敌军从压境或攻击犹大的位置离去；用简洁现代汉语保留基本空间关系。
- source_word: הַכַּשְׂדִּים
  choice: 迦勒底人
  rationale: 保留原文的历史族称，而不直接改为较宽泛的“巴比伦人”。
- source_word: כִּי לֹא יֵלֵכוּ
  choice: 因为他们不会离开
  rationale: כִּי说明不可自欺的理由；重复“离开”保留前后鲜明的反驳关系。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威；主
  rationale: 采用现代中文圣经读者最熟悉的专名形式，表明原文是神的专名，而非仅仅一个称号；不以“主”取代原文专名。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。引语层级明确；“自欺”简练自然，“必定”保留原文的强调形式。保留“迦勒底人”这一历史称谓，并以脚注说明其所指。
