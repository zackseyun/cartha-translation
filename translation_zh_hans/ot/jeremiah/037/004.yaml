base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/037/004.yaml
  text: Jeremiah was coming and going among the people[a], for they had not yet put him in the prison house.
translation:
  language: zh_hans
  text: 耶利米在百姓中来来往往，因为他们还没有把他关进监牢[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “监牢”原文直译为“拘禁之所”。
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּא וְיֹצֵא
  choice: 来来往往
  rationale: 这一对动词在此表示可以照常走动、出入；“来来往往”既保留希伯来语的成对表达，也符合现代汉语习惯。
- source_word: בְּתוֹךְ הָעָם
  choice: 在百姓中
  rationale: 准确表达“在……中间”的空间和社会范围，同时保持简洁自然。
- source_word: וְלֹא נָתְנוּ אֹתוֹ
  choice: 因为他们还没有把他关进
  rationale: 上下文表明后一分句解释耶利米为何仍能在人群中来往，因此将连接词译作“因为”；“还没有”自然表达此前尚未发生的拘禁。
- source_word: בֵּית הַכְּלִיא
  choice: 监牢
  rationale: 原文直译为“拘禁之所／拘禁的房屋”；“监牢”在现代汉语中清楚、庄重，并准确传达实际所指。
- source_word: וְיִרְמְיָהוּ
  choice: 耶利米
  rationale: 句首的连接词承担叙事衔接作用，汉语无需另加“现在”等原文没有的时间副词。
theological_decisions: []
