  text: Jeremiah went out from Jerusalem to go to the land of Benjamin[a], to receive his portion there among the people.
translation:
  language: zh_hans
  text: 耶利米离开耶路撒冷，前往便雅悯地，要在那里的百姓中领取一份产业[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在那里的百姓中认领一份产业。”希伯来语“领取”（לַחֲלִק）的含义较难确定，也可能指分取、分配财产或认领一份。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: 出了
  rationale: יצא通常表示“出去、离开”；“出了耶路撒冷”既保留方向感，也符合现代汉语表达。
- source_word: מִירוּשָׁלִַם
  choice: 耶路撒冷
  rationale: 介词מִן表示离开某地；汉语在“出了耶路撒冷”中已自然体现“从……出来”的关系，无须另加“从”。
- source_word: לָלֶכֶת
  choice: 要往……去
  rationale: 不定式在此表达目的；“要往……去”自然体现耶利米出城的目的。
- source_word: אֶרֶץ בִּנְיָמִן
  choice: 便雅悯地
  rationale: אֶרֶץ在此指便雅悯支派所属的地域；“便雅悯地”简洁保留其地域和支派含义。
- source_word: לַחֲלִק
  choice: 领取自己的那一份
  rationale: 此词在本节含义疑难，可能涉及分取、领取或认领一份产业；正文采用较克制且符合语境的“领取自己的那一份”，不把后文的指控带入本节。
- source_word: מִשָּׁם
  choice: 在那里
  rationale: 该形式字面可涉及“从那里”，但与疑难动词连用时，译为“在那里”更符合汉语，也不强行限定所领份额的来源关系。
- source_word: בְּתוֹךְ הָעָם
  choice: 在……百姓中
  rationale: 字面义为“在百姓中间”；“在那里的百姓中”自然且不将עָם过度具体化为军队。
