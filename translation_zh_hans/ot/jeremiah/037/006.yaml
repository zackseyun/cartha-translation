  text: וַֽ/יְהִי֙ דְּבַר יְהוָ֔ה אֶל יִרְמְיָ֥הוּ הַ/נָּבִ֖יא לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/037/006.yaml
  text: Then the word of Yahweh came to Jeremiah the prophet[a], saying,
translation:
  language: zh_hans
  text: 随后[a]，雅威的话临到先知耶利米，说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译：“事情发生了，雅威的话临到……”
    reason: 说明 וַיְהִי 的字面形式；正文以“随后”表达其在叙事中的承接作用。
lexical_decisions:
- source_word: וַיְהִי
  choice: 随后……临到
  rationale: 该叙事形式承接上文并引出下一事件；用“随后”自然表达事件推进，同时避免古雅而生硬的“事情发生了”。
- source_word: דְּבַר
  choice: 话
  rationale: 在“雅威的话”这一先知性固定表达中，“话”既贴近原文，又清楚表明这是来自上帝的启示。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文四字神名的通行拟音译出其专名性质，不以称号代替。
- source_word: אֶל
  choice: 临到
  rationale: 与“话”搭配时，“临到”是现代中文圣经语体中自然、庄重的表达，也准确传达启示来到耶利米的方向关系。
- source_word: יִרְמְיָהוּ
  choice: 耶利米
  rationale: 采用现代中文中通行的人名译法。
- source_word: הַנָּבִיא
  choice: 先知
  rationale: 准确表达 נָבִיא 的职分含义；中文无需另加定冠词。
- source_word: לֵאמֹר
  choice: 说
  rationale: 该不定式引出下一节神谕的具体内容；“说”简洁自然，并保留原文的引语导入功能。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用以色列上帝的专名。译作“雅威”保留其专名性质，并避免用“主”这一称号取代原文神名。
translation_notes:
  register: 采用自然、庄重的现代标准普通话。“随后”承接前文叙事，“雅威的话临到先知耶利米”保留先知书常见的启示公式；句末用冒号引出下一节的神谕内容。
