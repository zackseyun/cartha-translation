base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/037/005.yaml
  text: Pharaoh’s army had come out from Egypt[a], and when the Chaldeans who were besieging Jerusalem heard the report about them[c][b], they withdrew from Jerusalem.
translation:
  language: zh_hans
  text: 法老的军队已经从埃及出动；围困耶路撒冷的迦勒底人[a]听见了关于他们的消息[b]，就从耶路撒冷撤军了[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “迦勒底人”也可按本处语境译作“巴比伦人”。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“听见他们的消息”，意思是听见关于法老军队的消息。
    reason: lexical_alternative
  - marker: c
    text: 原文直译近似“从耶路撒冷之上上去”，在这里是指他们撤离围城阵地。
    reason: lexical_alternative
lexical_decisions:
- source_word: חֵיל
  choice: 军队
  rationale: 在法老及军事行动的语境中，此词指军事实力或部队；“军队”自然、明确。
- source_word: פַּרְעֹה
  choice: 法老
  rationale: 采用现代中文圣经及一般中文中通行的埃及君王称号。
- source_word: יָצָא מִמִּצְרָיִם
  choice: 已经从埃及出动
  rationale: 动词表示法老军队从埃及出来；“出动”符合军事语境，“已经”体现此事先于迦勒底人听见消息。
- source_word: הַכַּשְׂדִּים
  choice: 迦勒底人
  rationale: 直接对应希伯来语族名；“巴比伦人”虽在本语境中可作解释性替代，但正文保留较贴近原文的称呼。
- source_word: הַצָּרִים עַל יְרוּשָׁלַם
  choice: 围困耶路撒冷的
  rationale: צור 的分词在军事语境中表示持续围城，“围困”准确而自然。
- source_word: אֶת שִׁמְעָם
  choice: 关于他们的消息
  rationale: שֵׁמַע 指消息或传闻，复数后缀在此最自然地理解为消息所涉及的对象，即法老的军队。
- source_word: וַיֵּעָלוּ מֵעַל יְרוּשָׁלָם
  choice: 就从耶路撒冷撤军了
  rationale: 字面结构是“从耶路撒冷之上/那里上去”，在围城语境中是撤离围城阵地；“撤军”清楚表达该军事动作，又不进一步断定撤往何处。
- source_word: וְ
  choice: 以分号承接上文
  rationale: 句首连接词承接叙事；现代中文可借标点与上下文自然表达连续关系，无须增添“那时”或“现在”等原文没有的时间词。
