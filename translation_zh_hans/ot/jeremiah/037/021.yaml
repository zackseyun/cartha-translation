  text: וַ/יְצַוֶּ֞ה הַ/מֶּ֣לֶךְ צִדְקִיָּ֗הוּ וַ/יַּפְקִ֣דוּ אֶֽת יִרְמְיָהוּ֮ בַּ/חֲצַ֣ר הַ/מַּטָּרָה֒ וְ/נָתֹן֩ ל֨/וֹ כִכַּר לֶ֤חֶם לַ/יּוֹם֙ מִ/ח֣וּץ הָ/אֹפִ֔ים עַד תֹּ֥ם כָּל הַ/לֶּ֖חֶם מִן הָ/עִ֑יר וַ/יֵּ֣שֶׁב יִרְמְיָ֔הוּ בַּ/חֲצַ֖ר הַ/מַּטָּרָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/037/021.yaml
  text: So King Zedekiah gave orders[a], and they committed Jeremiah to the court of the guard, and gave him a loaf of bread daily from the bakers’ street, until all the bread from the city was gone. So Jeremiah remained in the court of the guard.
translation:
  language: zh_hans
  text: 西底家王就下令，他们便把耶利米关在护卫院里，每天从做饼人的街上[a]给他一个饼，直到城中所有的饼都用尽了。耶利米就留在护卫院里。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译可作“从做饼人的外面”；此处可能指做饼人制作、售卖饼的一条街或一个区域。
    reason: 说明古代城市地点称谓，并保留חוּץ在此处可指“外面”、街道或街区的词义不确定性。
lexical_decisions:
- source_word: וַיְצַוֶּה
  choice: 下令
  rationale: צוה表示发出命令；“下令”自然简洁，也符合君王发令的语境。
- source_word: וַיַּפְקִדוּ
  choice: 把……关在
  rationale: פקד在此指把耶利米置于指定地点看管。结合护卫院的拘押语境，“关在”比单纯的“安置在”更清楚，但不把该处解释成普通监狱建筑。
- source_word: חֲצַר הַמַּטָּרָה
  choice: 护卫院
  rationale: 该固定短语在《耶利米书》中指由卫兵看守、兼作拘押处的院落。“护卫院”简洁保留其机构与院落双重色彩。
- source_word: וְנָתוֹן לוֹ
  choice: 拿……给他
  rationale: 此处非限定动词形式承接王的命令，表达持续供应的安排；译成自然的汉语动词结构，不强行保留希伯来语形式。
- source_word: כִכַּר לֶחֶם
  choice: 一个饼
  rationale: ככר在此指一只圆形或饼状的面包；“一个饼”符合古代食物形态，也比现代汉语中的“一条面包”更贴近原文。
- source_word: לַיּוֹם
  choice: 每天
  rationale: 该短语表示每日固定供应，“每天”是准确自然的现代汉语。
- source_word: מִחוּץ הָאֹפִים
  choice: 从烤饼人的街市
  rationale: חוּץ可指外面、街道或露天街市；此处很可能是烤饼人集中制作、售卖食物的街道或区域。正文采用通顺的“街市”，脚注保留词义与地点性质的不确定性。
- source_word: עַד תֹּם כָּל הַלֶּחֶם מִן הָעִיר
  choice: 直到城里的饼全都没有了
  rationale: 该句说明供给持续到城内粮食耗尽之时；“全都没有了”自然传达耗尽，不额外说明耗尽的原因。
- source_word: וַיֵּשֶׁב
  choice: 留在
  rationale: ישב在此表示继续住在或停留于该处；“留在”准确表达持续受拘押的状态。
- source_word: יִרְמְיָהוּ
  choice: 耶利米
  rationale: 采用现代简体中文《圣经》中通行的人名译法。
- source_word: צִדְקִיָּהוּ
  choice: 西底家
  rationale: 采用现代简体中文《圣经》中通行的人名译法。
