  yaml_path: translation/ot/jeremiah/037/019.yaml
  text: And where are your prophets who prophesied to you[a], saying, ‘The king of Babylon will not come against you or against this land’?”
translation:
  language: zh_hans
  text: 你们的先知——那些曾向你们预言说‘巴比伦王必不来攻击你们和这地’的——如今在哪里呢？
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאַיּוֹ
  choice: 如今在哪里呢
  rationale: 该复合疑问词承接上文，构成尖锐的反问；“如今”体现语境中的对照意味，“呢”使现代汉语问句自然庄重。
- source_word: נְבִיאֵיכֶם
  choice: 你们那些……先知
  rationale: 保留复数及第二人称复数所属关系；加入“那些”便于自然引出后面的关系从句。
- source_word: אֲשֶׁר נִבְּאוּ לָכֶם
  choice: 曾向你们预言的
  rationale: 关系从句限定这些先知，“曾”表明其预言发生在先；“向你们预言”准确传达 לָכֶם。
- source_word: לֵאמֹר
  choice: 他们曾说
  rationale: 这是引出直接引语的惯用形式；汉语用独立分句比直译为“说”更清楚。
- source_word: לֹא יָבֹא
  choice: 必不会来
  rationale: 否定式未完成体在所引预言中指将来；“必不会”保留先知断言的确定语气。
- source_word: מֶלֶךְ בָּבֶל
  choice: 巴比伦王
  rationale: 这是希伯来语属格结构在现代汉语中的标准、简洁表达。
- source_word: עֲלֵיכֶם
  choice: 来攻击你们
  rationale: עַל 与“来”连用时在此军事语境中表达敌对进犯；“来攻击”比字面“临到”更清楚。
- source_word: וְעַל הָאָרֶץ הַזֹּאת
  choice: 和这地
  rationale: 在共同受“来攻击”支配的并列宾语中，汉语可省略重复动词；“和”保留希伯来语连接词，“这地”保留指示强调。
