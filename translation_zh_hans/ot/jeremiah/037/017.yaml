base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/037/017.yaml
  text: Then King Zedekiah sent and had him brought[a], and the king questioned him privately in his house, and said, “Is there any word from Yahweh?” Jeremiah said, “There is.” Then he said[b], “You will be given into the hand of the king of Babylon.”
translation:
  language: zh_hans
  text: 西底家王派人把耶利米带来，在自己的住处私下问他：“有从雅威而来的话吗？”耶利米说：“有。”接着又说：“你必被交在巴比伦王手中[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “交在……手中”是希伯来语惯用语，意思是落入某人的权势之下。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח ... וַיִּקָּחֵהוּ
  choice: 派人把耶利米带来
  rationale: 两个连续动词直译为“派遣……带走他”，但语境表明王差人把耶利米带到自己那里；此译法自然表达使役含义，同时保留动作次序。为避免单节中代词指向不明，以“耶利米”明确所指。
- source_word: וַיִּשְׁאָלֵהוּ
  choice: 问他
  rationale: שׁאל在此表示询问；后面紧接直接问话，简洁的“问他”最自然。
- source_word: בְּבֵיתוֹ
  choice: 在宫中
  rationale: 字面为“在他的房屋中”；所指是王的居所，现代汉语用“宫中”更自然，并未扩大为特定建筑细节。
- source_word: בַּסֵּתֶר
  choice: 暗中
  rationale: 该词表示隐秘、秘密状态；“暗中”准确传达王避开他人私下询问的情形。
- source_word: הֲיֵשׁ דָּבָר מֵאֵת יְהוָה
  choice: 有从雅威而来的话吗？
  rationale: 保留先知语境中“从雅威而来的话”这一表达，不把דָּבָר窄化为一般“消息”或擅自解释其具体内容。
- source_word: יֵשׁ
  choice: 有
  rationale: 希伯来文回答极为简短；汉语用“有”保留其直接而有力的语气。
- source_word: בְּיַד מֶלֶךְ בָּבֶל
  choice: 交在巴比伦王手中
  rationale: 保留希伯来语“在……手中”的形象表达，并以脚注说明其惯用含义。
- source_word: תִּנָּתֵן
  choice: 你必被交
  rationale: 该动词为被动形式，行动者没有明说；译文保留被动和未明说行动者的张力。“必”表达此处预告性的未完成式。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语音译呈现四字神名，而不以称号替代专名。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。译作“雅威”保留其作为以色列之神专名的性质，不以“主”这一称号替代。
- issue: תִּנָּתֵן的隐含行动者
  choice: 保留无行动者的被动句“你必被交”
  alternative: “雅威必把你交出”或“巴比伦王必抓住你”
  rationale: 希伯来文没有明说是谁实施交付；不补出神或巴比伦王，以免消除原文保留的神学和叙事张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“暗中问他”比“秘密地询问他”更自然；“从雅威而来的话”保留先知性用语。“交在……手中”有意保留原文意象，并用脚注帮助普通读者理解。
