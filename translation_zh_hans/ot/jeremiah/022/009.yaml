source:
  edition: WLC
  text: וְ/אָ֣מְר֔וּ עַ֚ל אֲשֶׁ֣ר עָֽזְב֔וּ אֶת בְּרִ֥ית יְהוָ֖ה אֱלֹֽהֵי/הֶ֑ם וַ/יִּֽשְׁתַּחֲו֛וּ לֵ/אלֹהִ֥ים אֲחֵרִ֖ים וַ/יַּעַבְדֽוּ/ם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/022/009.yaml
  text: And they will say[b][a], ‘Because they abandoned the covenant of Yahweh their God and bowed down to other gods and served them.’
translation:
  language: zh_hans
  text: 他们必说：“因为他们离弃了耶和华——他们的上帝——的约，向别的神下拜，又事奉这些神。”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “下拜”和“事奉”这两个动词合在一起，描述对别神的敬拜。
    reason: 说明原文保留两个不同动词，而二者在本句中共同表达偶像崇拜。
lexical_decisions:
- source_word: וְאָמְרוּ
  choice: 他们必回答说
  rationale: 承接上一节“人必问”的语境，אָמְרוּ在此是对问题作答；“必”保留将来指向，“回答说”在现代汉语中自然地表达对话关系。
- source_word: עַל אֲשֶׁר
  choice: 因为
  rationale: 该组合引出审判临到的原因，译作“因为”准确而自然。
- source_word: עָזְבוּ
  choice: 离弃了
  rationale: “离弃”既表达离开，也传达对盟约关系的不忠，语体庄重而不古奥。
- source_word: בְּרִית
  choice: 约
  rationale: 此处指耶和华与其子民之间的盟约关系；“约”是中文圣经语境中清楚、凝练的对应词。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文读者最熟悉的专名形式音译四字神名，保留其作为以色列之上帝盟约名字的性质，而不以称号替代。
- source_word: אֱלֹהֵיהֶם
  choice: 他们上帝
  rationale: 虽然אֱלֹהִים形式上为复数，此处在盟约表达中明确指以色列独一的上帝；省略“的”使“耶和华他们上帝”保持庄重、紧凑。
- source_word: וַיִּשְׁתַּחֲווּ
  choice: 向……下拜
  rationale: 保留俯伏敬拜的具体动作，并由宾语“别的神明”和后续“事奉”共同显明其偶像崇拜含义。
- source_word: לֵאלֹהִים אֲחֵרִים
  choice: 向别的神明
  rationale: 介词ל标示下拜的对象。“别的神明”与指独一真神的“上帝”形成清楚区别，也符合现代汉语习惯。
- source_word: וַיַּעַבְדוּם
  choice: 又事奉它们
  rationale: “事奉”保留עבד所表达的宗教服事，并与前一动词“下拜”有所区别；代词使用“它们”，避免在译文中暗示这些神明真实具有神格。
theological_decisions:
- issue: 四字神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用以色列上帝的专名。中文采用广为人知的“耶和华”，保留专名而不替换为“主”；“雅威”则较接近当代学界常见的拟音。
- issue: 两个敬拜动词的关系
  choice: 向别的神明下拜，又事奉它们
  alternative: 敬拜并事奉别的神明
  rationale: 分别翻译השתחוה与עבד，既保留俯伏下拜和宗教服事两个动作，也不削弱二者合起来所描述的偶像崇拜。
- issue: אֱלֹהִים用于真神与假神时的中文区分
  choice: 上帝／神明
  alternative: 上帝／诸神
  rationale: “上帝”清楚指耶和华，“神明”则自然指受人崇拜的其他神祇；这种语体区分不否认原文同用אֱלֹהִים，也不暗示别神真实存在为神。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“离弃”“约”“事奉”保留经文的盟约和敬拜语域；句式顺畅，不用生僻古语。脚注标记置于整句之后。
