base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/022/013.yaml
  text: Woe to him who builds his house without righteousness[a], and his upper rooms without justice[c][b], who makes his neighbor work for nothing and does not give him his wages.
translation:
  language: zh_hans
  text: 祸哉！那不按公义建造自己的房屋、不按公平建造自己楼上房间的人！他让邻人白白为他做工，却不给他工钱。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “工钱”原文作“他的工作／劳作”；按上下文指工人劳动后应得的报酬。
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹי
  choice: 祸哉
  rationale: 此词在这里引出先知对恶行的谴责与审判宣告；“祸哉”简洁庄重，也保留了原文强烈的警告语气。
- source_word: בֹּנֶה בֵיתוֹ
  choice: 建造自己的房屋
  rationale: 分词描写此人的典型行为；בַּיִת 的基本义是“房屋”。上下文虽涉及君王的大型建筑，仍不直接译作“宫殿”，以免超出本节措辞。
- source_word: בְּלֹא צֶדֶק
  choice: 以不义
  rationale: צֶדֶק 涵盖正直、公义和合乎正当秩序；此处指建造行为在道德上不正当。“以不义”既贴近原文，也与下一分句的“不公”形成相关而不完全相同的表达。
- source_word: וַעֲלִיּוֹתָיו
  choice: 楼房
  rationale: עֲלִיּוֹת 指房屋上层的房间或建筑部分。现代汉语“楼房”在此可自然表达其上层建筑，又避免生硬的“楼上的房间”。
- source_word: בְּלֹא מִשְׁפָּט
  choice: 以不公
  rationale: מִשְׁפָּט 在此侧重公正和人应得的权利；“不公”与克扣工钱的社会伦理语境吻合，并保留它与 צֶדֶק 的词义区别。
- source_word: בְּרֵעֵהוּ
  choice: 同胞
  rationale: רֵעַ 指与自己处于社会关系中的他人、同伴或邻舍。此处是雇工受同族人剥削的语境，“同胞”比现代汉语中常指住处相邻者的“邻舍”更自然。
- source_word: יַעֲבֹד חִנָּם
  choice: 叫同胞白白做工
  rationale: 动词在此结构中表示使他人为自己劳作；חִנָּם 表示无偿、得不到报酬。“白白做工”自然清楚，并为下句不给工钱作铺垫。
- source_word: וּפֹעֲלוֹ לֹא יִתֶּן לוֹ
  choice: 却不给他工钱
  rationale: פֹּעַל 可指工作，也可在此指劳动所得；与“给他”连用时，语境明确指应付的报酬。“工钱”准确表现受雇劳动者应得之物。
theological_decisions:
- issue: צֶדֶק / מִשְׁפָּט 这一伦理词组的译法
  choice: 以不义……以不公
  alternative: 不按公义……不按公平
  rationale: 两个希伯来词意义相近且有所重叠。分别译为“不义”和“不公”，既保留平行结构与细微区别，也不把先知的谴责缩减为单一法律或宗教概念。
translation_notes:
  register: 采用现代、庄重而易懂的先知宣告语体。“祸哉”保留谴责力度；后文用自然的现代汉语呈现剥削劳工的具体恶行。脚注标记置于相关句末。
