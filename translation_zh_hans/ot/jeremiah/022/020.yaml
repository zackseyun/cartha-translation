  text: עֲלִ֤י הַ/לְּבָנוֹן֙ וּֽ/צְעָ֔קִי וּ/בַ/בָּשָׁ֖ן תְּנִ֣י קוֹלֵ֑/ךְ וְ/צַֽעֲקִי֙ מֵֽ/עֲבָרִ֔ים כִּ֥י נִשְׁבְּר֖וּ כָּל מְאַהֲבָֽיִ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/022/020.yaml
  text: Go up to Lebanon and cry out[a]; raise your voice in Bashan; cry out from Abarim[b], for all your lovers are shattered.
translation:
  language: zh_hans
  text: 你要登上黎巴嫩呼喊，在巴珊扬声，从亚巴琳[a]呼喊；因为你所有的情人[b]都被击垮了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“从各渡口”或“从彼岸各地”。这里与黎巴嫩、巴珊并列，可能是指约旦河东的亚巴琳山区。
    reason: lexical_alternative
  - marker: b
    text: “情人”是先知性的比喻，在这里指犹大或耶路撒冷所倚赖的外国盟友、政治伙伴。
    reason: cultural_note
lexical_decisions:
- source_word: עֲלִי
  choice: 你要登上
  rationale: 这是阴性单数祈使式，向拟人化的耶路撒冷或犹大发出命令；“登上”自然保留向高处去的方向感。
- source_word: וּצְעָקִי / וְצַעֲקִי
  choice: 呼喊
  rationale: 两处均译为“呼喊”，保留原文重复、急迫而带哀告色彩的修辞结构，又不把情绪过度限定为哀号。
- source_word: תְּנִי קוֹלֵךְ
  choice: 扬声
  rationale: 原文直译近于“发出你的声音”；“扬声”是简洁自然的汉语表达，也适合诗体平行句。
- source_word: מֵעֲבָרִים
  choice: 从亚巴琳
  rationale: 在黎巴嫩、巴珊并列的地理语境中，较可能是地名亚巴琳；其普通名词含义仍保留在脚注中。
- source_word: נִשְׁבְּרוּ
  choice: 都被击垮了
  rationale: 该词基本义为“被打破、折断”，此处用于政治伙伴的覆灭；“被击垮”既保留受破坏的意象，也符合现代汉语。
- source_word: מְאַהֲבָיִךְ
  choice: 你的情人
  rationale: 保留先知文学中带有讽刺和盟约不忠意味的爱情隐喻，不在正文中直接改写为“盟友”。
theological_decisions:
- issue: “情人”所指的隐喻意义
  choice: 正文保留“情人”，脚注说明在本段语境中指犹大或耶路撒冷倚赖的外国盟友、政治伙伴。
  alternative: 正文直接译作“盟友”。
  rationale: 保留原文的爱情隐喻，才能呈现先知话语对政治依附与盟约不忠的双重批判；脚注提供语境说明而不替正文消解隐喻。
translation_notes:
  register: 采用现代、庄重而易懂的诗性汉语。三个地理短语保持平行，两个“呼喊”保留原文重复形成的急迫感；分号划分命令与原因。
