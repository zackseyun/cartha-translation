  text: אֶ֥רֶץ אֶ֖רֶץ אָ֑רֶץ שִׁמְעִ֖י דְּבַר יְהוָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/022/029.yaml
  text: Land[a], land, land, hear the word of Yahweh.
translation:
  language: zh_hans
  text: 地啊[a]，地啊，地啊！要听耶和华的话。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“大地啊，大地啊，大地啊！”希伯来语 אֶרֶץ 既可指某一片土地或国土，也可指大地。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶרֶץ / אָרֶץ
  choice: 地
  rationale: 该词既可指特定的“土地、国土”，也可泛指“大地”。上下文很可能是在呼唤犹大之地，但原文仍保留一定范围上的含混；译作“地”既自然地承接三重呼语，也不把所指限定得过窄。
- source_word: שִׁמְעִי
  choice: 要听
  rationale: 这是阴性单数祈使式，与阴性名词 אֶרֶץ 呼应；“要听”直接表达听取、留心领受的命令，同时避免在正文中把含义进一步解释为“顺服”。
- source_word: דְּבַר
  choice: 话
  rationale: 在“耶和华的话”这一先知性表达中，“话”庄重而自然，保留了 דָּבָר 的直接意义；“信息”则解释性更强。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代简体中文读者熟悉的专名“耶和华”呈现四字神名，而不以“主”这一称号替代。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用的是以色列上帝的专名。中文正文采用通行且易识别的“耶和华”，既保留专名性质，也避免用“主”替代；“雅威”是较贴近学界重构发音的可行译法。
- issue: 三次呼唤 אֶרֶץ 的所指范围
  choice: 正文译作“地”，脚注说明也可理解为“大地”
  alternative: 犹大地；大地
  rationale: 上下文支持所指为犹大之地，但单节原文本身没有明说“犹大”；采用较开放的“地”并加注，可保留地域性与普遍性之间的真实含混。
translation_notes:
  register: 采用现代、庄重而易懂的先知宣告语体。保留原文三重呼唤，以感叹号体现强烈呼告；随后用“要听”表达命令。脚注标记[a]置于首次出现的“地啊”之后。
