base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/022/021.yaml
  text: I spoke to you in your prosperity[a], but you said, ‘I will not listen.’ This has been your way from your youth[b], for you have not listened to my voice.
translation:
  language: zh_hans
  text: 我曾在你安逸之时[a]对你说话，你却说：“我不听。”这就是你自幼以来的行径，因为你一直不听我的声音[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “安逸”也可译作“安稳”或“兴盛”。希伯来语这个词可指平静安逸、安全无忧或生活兴盛的处境。
    reason: lexical_alternative
  - marker: b
    text: 本节两处的“听”也可含有“听从、顺服”的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: דִּבַּרְתִּי אֵלַיִךְ
  choice: 我……对你说话
  rationale: 直接保留“说话”及其朝向受话者的结构，清楚表达耶和华先前向受话者发言。
- source_word: בְּשַׁלְוֺתַיִךְ
  choice: 在你安稳的时候
  rationale: שַׁלְוָה可指安宁、安逸、安全或兴盛。“安稳”兼顾平静与有保障的处境，又不额外加入“自满”的贬义。
- source_word: לֹא אֶשְׁמָע / לֹא שָׁמַעַתְּ
  choice: 我不听 / 你不听
  rationale: 两处均重复使用“听”，对应希伯来文שׁמע的重复，保留听见、听从乃至顺服之间的语义张力。
- source_word: זֶה דַרְכֵּךְ מִנְּעוּרַיִךְ
  choice: 你从幼年起一向如此
  rationale: 以自然现代汉语表达“这就是你从幼年起的道路（惯常行为）”，突出长期不变的行为模式，而不生硬直译“你的道路”。
- source_word: בְּקוֹלִי
  choice: 我的声音
  rationale: 保留希伯来文“听我的声音”的意象，不将其直接化约为“顺服我”。
theological_decisions:
- issue: 阴性单数受话者的身份
  choice: 正文只用第二人称“你”，不明确补出耶路撒冷或犹大
  alternative: 在正文中明确译作“耶路撒冷”或“犹大”
  rationale: 原文以阴性单数直接称呼拟人化的受话者；保留“你”可维持上下文中的指向，而不在本节内替原文作出更具体的身份判定。
- issue: שׁמע所含的听从与顺服意味
  choice: 正文译作“听”，脚注说明也可理解为“听从、顺服”
  alternative: 正文直接译作“不顺服”
  rationale: “听”保留原文声音意象和两处用词的呼应，同时不抹去盟约语境中行为回应的含义。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。用“安稳”避免把原词过度解释为“自满”；用两次“不听”再现原文重复，并借脚注保留其“听从、顺服”的盟约语义。
