id: JER.22.3
reference: Jeremiah 22:3
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כֹּ֣ה אָמַ֣ר יְהוָ֗ה עֲשׂ֤וּ מִשְׁפָּט֙ וּ/צְדָקָ֔ה וְ/הַצִּ֥ילוּ גָז֖וּל מִ/יַּ֣ד עָשׁ֑וֹק וְ/גֵר֩ יָת֨וֹם וְ/אַלְמָנָ֤ה אַל תֹּנוּ֙ אַל תַּחְמֹ֔סוּ וְ/דָ֣ם נָקִ֔י אַֽל תִּשְׁפְּכ֖וּ בַּ/מָּק֥וֹם הַ/זֶּֽה׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/022/003.yaml
  text: 'Thus says Yahweh: Do justice and righteousness[a], and deliver the robbed person from the hand of the oppressor. Do not oppress the resident foreigner, the fatherless, or the widow, and do not do violence[c][b], and do not shed innocent blood in this place.'
translation:
  language: zh_hans
  text: 雅威如此说：“你们要伸张公平，施行公义[a]；要从欺压者手中解救被抢夺的人。不可欺压寄居的外族人[b]、孤儿和寡妇，也不可向他们施暴[c]；不可在这地方使无辜人的血流出。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“你们要做公平正直的事”。原文用了“公平”和“公义”两个词，合起来指忠信、公正的公共及道德行为。
    reason: lexical_alternative
  - marker: b
    text: “寄居的外族人”指住在以色列人中间的外来居民；他们通常缺乏土地、宗族等社会保障，处境容易受欺压。传统上也译作“寄居者”。
    reason: cultural_note
  - marker: c
    text: 原文也可理解为：“不可欺压寄居的外族人、孤儿和寡妇，也不可侵害他们。”两个否定动词都以这三类人为对象。
    reason: alternative_reading
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  choice: 雅威如此说
  rationale: 保留先知宣告的使者公式，并将四字神名直接音译为“雅威”。
- source_word: עֲשׂוּ מִשְׁפָּט וּצְדָקָה
  choice: 伸张公平，施行公义
  rationale: 分别保留“公平”和“公义”两个相互关联而不完全相同的伦理概念；动词搭配符合现代汉语。
- source_word: וְהַצִּילוּ גָזוּל מִיַּד עָשׁוֹק
  choice: 要从欺压者手中解救被抢夺的人
  rationale: 保留“从……手中”这一权势意象，并把被动形式 גָזוּל 明确译为受害者“被抢夺的人”。
- source_word: גֵר
  choice: 寄居的外族人
  rationale: 该词指居住在以色列人中、并非本地族群且社会地位脆弱的人；此译比单说“外人”更准确。
- source_word: יָתוֹם וְאַלְמָנָה
  choice: 孤儿和寡妇
  rationale: 采用现代汉语中清楚自然的弱势群体称谓；יָתוֹם 在此强调失去父亲或父母庇护者的社会处境。
- source_word: אַל תֹּנוּ אַל תַּחְמֹסוּ
  choice: 不可欺压……也不可向他们施暴
  rationale: 分别呈现两个相近却不等同的禁令，保留原文从压迫到暴力侵害的修辞加强。
- source_word: וְדָם נָקִי אַל תִּשְׁפְּכוּ
  choice: 不可……使无辜人的血流出
  rationale: 保留“流无辜人的血”的具体意象，同时用自然汉语表达禁止杀害无辜者。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；“雅威”较贴近其通行学术拟音，也避免用头衔代替专名。
- issue: 是否把 מִשְׁפָּט וּצְדָקָה 合并为单一概念
  choice: 伸张公平，施行公义
  alternative: 行公平正直的事
  rationale: 原文并列两个伦理词，分别译出可保留先知话语的强调和概念张力。
- issue: 两个禁令 אַל תֹּנוּ 与 אַל תַּחְמֹסוּ 的关系
  choice: 不可欺压……也不可向他们施暴
  alternative: 不可欺压或伤害他们
  rationale: 原文两动词彼此重叠但不相同；分开翻译既不合并，也让前置的三类对象自然成为两项禁令的共同对象。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。以“你们”呈现复数命令；保留先知宣告语气、两个伦理名词、两项禁止行为及“从……手中”“无辜人的血”等原文意象。
