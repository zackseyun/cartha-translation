base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/022/025.yaml
  text: And I will give you into the hand of those who seek your life[a], into the hand of those before whom you are afraid, into the hand of Nebuchadnezzar king of Babylon[b], and into the hand of the Chaldeans.
translation:
  language: zh_hans
  text: 我必把你交在那些寻索你性命的人手中，交在那些你所惧怕的人手中，交在巴比伦王尼布甲尼撒[a]手中，也交在迦勒底人[b]手中。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “尼布甲尼撒”所对应的名字，按此处希伯来文形式也常转写为“Nebuchadrezzar”。
    reason: lexical_alternative
  - marker: b
    text: “迦勒底人”在这里也可译作“巴比伦人”，因为这个称呼在上下文中可泛指巴比伦的军队。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּנְתַתִּיךָ
  choice: 我必把你交在
  rationale: נתן与“在……手中”连用，表示把人交到他者权势之下；“交在”既符合现代汉语，也保留原文的交付含义。
- source_word: בְּיַד
  choice: 在……手中
  rationale: 保留希伯来语“手”的具体意象，并在全节中重复，以体现原文层层推进的修辞。
- source_word: מְבַקְשֵׁי נַפְשֶׁךָ
  choice: 那些想要你性命的人
  rationale: נפש在敌对语境中指人的性命；此译清楚表达对方意图置其于死地，同时保留“性命”这一语义核心。
- source_word: אֲשֶׁר אַתָּה יָגוֹר מִפְּנֵיהֶם
  choice: 那些你所惧怕的人
  rationale: יגור在此表示害怕、畏惧；“你所惧怕的人”自然简洁，准确传达关系从句。
- source_word: נְבוּכַדְרֶאצַּר
  choice: 尼布甲尼撒
  rationale: 采用现代中文圣经及一般读者较熟悉的标准译名；原文此处的拼写更接近另一种音译，列于脚注。
- source_word: מֶלֶךְ בָּבֶל
  choice: 巴比伦王
  rationale: 自然、直接地表达希伯来语属格结构。
- source_word: הַכַּשְׂדִּים
  choice: 迦勒底人
  rationale: 直接保留族称；在本段历史语境中也可泛指巴比伦军队或巴比伦人，因此在脚注说明。
