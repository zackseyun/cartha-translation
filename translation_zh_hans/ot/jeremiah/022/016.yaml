source:
  edition: WLC
  text: דָּ֛ן דִּין עָנִ֥י וְ/אֶבְי֖וֹן אָ֣ז ט֑וֹב הֲ/לוֹא הִ֛יא הַ/דַּ֥עַת אֹתִ֖/י נְאֻם יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/022/016.yaml
  text: He defended the cause of the poor and needy[a]; then it was well[b]. Is not that what it means to know me? declares Yahweh.
translation:
  language: zh_hans
  text: 他为困苦和贫穷的人伸张正义[a]，那时就好了[b]。这不就是认识我吗？雅威说。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“审理困苦和贫穷之人的案件”；原文是司法用语，指公正处理并维护他们的诉求。
    reason: lexical_alternative
  - marker: b
    text: 原文简作“那时就好”，没有明说是谁或什么处于良好境况。
    reason: source_ambiguity
lexical_decisions:
- source_word: דָּן דִּין
  choice: 伸张正义
  rationale: 这是动词与同源名词构成的司法用语，指审理并维护弱势者的案件或权益。“伸张正义”既保留法律语境，也避免让现代读者误解为仅仅作出判断。
- source_word: עָנִי וְאֶבְיוֹן
  choice: 困苦和贫穷的人
  rationale: עָנִי 可兼有困苦、受压和贫穷之意，אֶבְיוֹן 着重贫乏、缺乏所需；并列翻译保留两词的区别与社会处境。
- source_word: אָז טוֹב
  choice: 那时就安好
  rationale: אָז 带有时间兼结果意味；טוֹב 在此作无明确主语的述语。“安好”自然表达良好处境，同时脚注说明原文的简略性。
- source_word: הֲלוֹא הִיא הַדַּעַת אֹתִי
  choice: 这不就是认识我吗
  rationale: 保留期待肯定回答的反问，并直接呈现“认识我”，不把它缩减为纯粹的知识认知，也不额外解释其全部内涵。
- source_word: נְאֻם יְהוָה
  choice: 雅威说
  rationale: נְאֻם 是庄重的先知宣告公式；“雅威”音译四字神名 יְהוָה，保留其作为专名的功能。
theological_decisions:
- issue: “认识我”与为穷困者伸张正义的关系
  choice: 以反问直接把公正对待穷困者视为认识雅威的具体表现
  alternative: 译成“这就是认识我的全部含义”，或仅理解为关于上帝的理性知识
  rationale: 原文有力地把行公义与认识雅威联系起来，却没有说这种行动穷尽了“认识”的全部内容；直译式反问保留这种关系与张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“伸张正义”传达司法语境；“那时就安好”保留原文省略主语的简练；全句不加入宗派性解释。
