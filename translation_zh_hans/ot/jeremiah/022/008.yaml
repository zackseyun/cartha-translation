source:
  edition: WLC
  text: וְ/עָֽבְרוּ֙ גּוֹיִ֣ם רַבִּ֔ים עַ֖ל הָ/עִ֣יר הַ/זֹּ֑את וְ/אָֽמְרוּ֙ אִ֣ישׁ אֶל רֵעֵ֔/הוּ עַל מֶ֨ה עָשָׂ֤ה יְהוָה֙ כָּ֔כָה לָ/עִ֥יר הַ/גְּדוֹלָ֖ה הַ/זֹּֽאת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/022/008.yaml
  text: And many nations will pass by this city[a], and each man will say to his neighbor[b], ‘Why has Yahweh done thus to this great city?’
translation:
  language: zh_hans
  text: 许多国家的人必从这城旁经过[a]，各人要对同伴说[b]：“雅威为什么这样对待这座大城？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “从这城旁经过”也可译作“经过这城”；这里的希伯来介词可以表示从城旁走过，而不一定是穿城而行。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“各人对他的同伴说”，是表示人们一个对一个交谈的分配式说法。
    reason: idiom_explanation
lexical_decisions:
- source_word: וְעָבְרוּ
  choice: 必……经过
  rationale: 该完成式在预言语境中承接前文，表达将来必然发生之事；“必”既自然，又传达预告的确定性。
- source_word: גּוֹיִם רַבִּים
  choice: 许多国的民
  rationale: גּוֹיִם 指许多国家或民族群体；汉语若直说“许多国经过”不自然，因此用“许多国的民”表达这些国家的人，同时保留其群体意义。
- source_word: עַל הָעִיר הַזֹּאת
  choice: 从这城旁
  rationale: עבר 与 עַל 连用时可表示从某处旁边或经过某处；“从这城旁经过”符合目睹城中景况并议论的语境，也避免误解为从城内穿行。
- source_word: אִישׁ אֶל־רֵעֵהוּ
  choice: 各人要对同伴说
  rationale: 这是逐一分配、彼此交谈的惯用表达。“各人……同伴”保留单数形式与人际关系，又比单纯译作“彼此”更贴近原文。
- source_word: עַל־מֶה
  choice: 为什么
  rationale: 这是询问原因的常用结构，现代汉语以“为什么”最自然准确。
- source_word: עָשָׂה יְהוָה כָּכָה
  choice: 雅威为什么这样对待
  rationale: כָּכָה 表示“这样、如此”，而 לָעִיר 表明行为所临到的对象；“这样对待”自然传达城所遭遇的结果，并保留问题本身未明说具体灾祸的含蓄。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见音译呈现四字神名，保留经文直接使用上帝专名这一特点。
- source_word: לָעִיר הַגְּדוֹלָה הַזֹּאת
  choice: 这座大城
  rationale: גָּדוֹל 可兼指规模与地位；“大城”保留这种简洁而可能多义的表达。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华／上主
  rationale: 原文使用的是神的专名，而非“主”的称号；采用“雅威”可直接呈现专名，并避免以称号代替原文。
- issue: אִישׁ אֶל־רֵעֵהוּ 的性别与分配意义
  choice: 各人要对同伴说
  alternative: 彼此说／每个男人都对邻舍说
  rationale: 此处阳性单数构成分配式惯用语，重点是人们逐一相互交谈，并不必然限定只有男性；“各人……同伴”既保留句法轮廓，也不额外加入原文未强调的性别限制。
- issue: 灾难与雅威行动之间的关系
  choice: 雅威为什么这样对待这座大城
  alternative: 这座大城为什么落到这般地步
  rationale: 原文明确以雅威为 עָשָׂה 的主语，因此译文保留他作为行动者，不把神的作为弱化成无人称的遭遇。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“必”体现预言语气；“大城”保持简练和原文可能兼指规模、地位的张力。引语使用现代中文全角标点。
