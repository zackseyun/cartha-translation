base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/022/028.yaml
  text: Is this man Coniah a despised[a], broken vessel[b], or a vessel in which there is no delight? Why have he and his offspring been hurled out and cast into a land that they did not know?
translation:
  language: zh_hans
  text: 这人哥尼雅岂是一个被人鄙弃、打碎的器物[a]，或是一件无人喜爱的器皿？为什么他和他的后裔竟被抛出去，扔到他们不认识的土地上？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “器物”所译的希伯来词也可指“偶像”或“雕像”。这里紧接着提到“器皿”，可能是在描绘一件被鄙弃、打碎的制成物。
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעֶצֶב
  choice: 器物
  rationale: 该词可指人工制成的物件，包括偶像或像；上下文紧接“器皿”，因此正文采用较宽泛的“器物”，既保留制造物的意象，也不把有歧义的词过早限定为陶器或偶像。
- source_word: נִבְזֶה
  choice: 被人鄙弃
  rationale: 保留被动含义以及哥尼雅遭拒斥、受羞辱的意味。
- source_word: נָפוּץ
  choice: 打碎的
  rationale: 在器物、器皿的意象中，此词自然表示破碎；“打碎”也传达其受外力毁坏的被动语义。
- source_word: הָאִישׁ הַזֶּה
  choice: 这人
  rationale: 简洁、自然地对应指示性短语，并明确所指的是哥尼雅。
- source_word: כָּנְיָהוּ
  choice: 哥尼雅
  rationale: 按本节实际出现的希伯来文简称音译，不以其较长名字约雅斤替代。
- source_word: אִם
  choice: 或是
  rationale: 在修辞问句中引出另一个比拟，中文用“或是”自然呈现选择关系。
- source_word: כְּלִי אֵין חֵפֶץ בּוֹ
  choice: 一件无人喜爱的器皿
  rationale: 以自然中文表达“其中没有喜悦／不为人所喜爱”，避免增译为“毫无价值”。
- source_word: הוּטֲלוּ
  choice: 被抛出去
  rationale: 体现使役被动和强力驱逐的含义。
- source_word: הוּא וְזַרְעוֹ
  choice: 他和他的后裔
  rationale: זֶרַע在此指家族后代；“后裔”庄重而清楚。
- source_word: וְהֻשְׁלְכוּ
  choice: 扔到
  rationale: 保留第二个被动投掷动词，加强被驱逐的力度；与“抛出去”搭配而不显生硬重复。
- source_word: עַל הָאָרֶץ אֲשֶׁר לֹא יָדָעוּ
  choice: 到他们素不相识的土地上
  rationale: 结合投掷动词和关系从句，表达被放逐至陌生土地；“素不相识”自然传达他们从未认识、经历过那地。
theological_decisions:
- issue: הָעֶצֶב所指物件的性质
  choice: 正文译作“器物”，脚注保留“偶像／雕像”的可能
  alternative: 碎罐、偶像、雕像
  rationale: 原词语义范围有真实歧义；随后出现“器皿”使器物意象突出，但不足以完全排除偶像或雕像之义，故不在正文中武断定论。
- issue: “无人喜爱”是否等于“毫无价值”
  choice: 保留喜爱／中意的表述
  alternative: 毫无价值的器皿
  rationale: חֵפֶץ表达喜悦、喜爱或中意；译成“毫无价值”会加入原文未明说的价值判断。
translation_notes:
  register: 采用现代、庄重且普通读者易懂的书面语。以“岂是……或是……”保留修辞问句，以两个投掷动词呈现原文重复加强的驱逐意味。
