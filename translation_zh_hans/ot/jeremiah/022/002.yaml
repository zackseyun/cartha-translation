id: JER.22.2
reference: Jeremiah 22:2
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/אָֽמַרְתָּ֙ שְׁמַ֣ע דְּבַר יְהוָ֔ה מֶ֣לֶךְ יְהוּדָ֔ה הַ/יֹּשֵׁ֖ב עַל כִּסֵּ֣א דָוִ֑ד אַתָּ֤ה וַ/עֲבָדֶ֨י/ךָ֙ וְ/עַמְּ/ךָ֔ הַ/בָּאִ֖ים בַּ/שְּׁעָרִ֥ים הָ/אֵֽלֶּה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/022/002.yaml
  text: and say[a], ‘Hear the word of Yahweh, O king of Judah, who sits on the throne of David—you, your servants, and your people who enter through these gates.’
translation:
  language: zh_hans
  text: 你要说：“坐在大卫宝座上的犹大王啊，你、你的臣仆[a]和从这些门进来的百姓，都要听耶和华的话。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “臣仆”或译“官员”。
    reason: עֲבָדֶיךָ 本义为“你的仆人”，在王室语境中也可指王的官员；正文用“臣仆”保留较宽泛的含义。
lexical_decisions:
- source_word: וְאָמַרְתָּ
  choice: 你要说
  rationale: 承接上一节的命令，以现代汉语明确表达先知所领受的指示；“要”保留其命令语气。
- source_word: שְׁמַע
  choice: 要听
  rationale: 既保留先知宣告中郑重的召唤，也不把词义限定为单纯听见或直接释为顺服。
- source_word: דְּבַר יְהוָה
  choice: 耶和华的话
  rationale: 保留先知书中常见的“耶和华的话”这一公式及其启示性分量。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代简体中文圣经语境中最通行、可辨识的四字神名音译，而不以“主”替代原文专名。
- source_word: מֶלֶךְ יְהוּדָה
  choice: 犹大王啊
  rationale: 原文在直接呼语中称呼犹大王；句末“啊”自然体现现代汉语的呼语功能。
- source_word: הַיֹּשֵׁב עַל כִּסֵּא דָוִד
  choice: 坐在大卫宝座上的
  rationale: 按原文单数分词修饰犹大王，并保留“大卫宝座”的王朝含义。
- source_word: אַתָּה וַעֲבָדֶיךָ וְעַמְּךָ
  choice: 你、你的臣仆和……百姓
  rationale: 保留强调性的“你”及三方受话者。王宫语境下“臣仆”兼顾服事关系与宫廷身份，又不把范围收窄为正式官员。
- source_word: הַבָּאִים
  choice: 进来的
  rationale: 用定语形式自然表达分词所描述的经常或实际进入者，不强加进行时含义。
- source_word: בַּשְּׁעָרִים הָאֵלֶּה
  choice: 从这些门
  rationale: 与“进来”搭配，符合现代汉语表达路径的习惯，并保留复数“门”。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威；主
  rationale: 原文直接使用四字神名。正文采用中文读者最熟悉的专名形式“耶和华”，不以称号“主”取代神名；“雅威”则是另一种较接近学术重构读音的音译。
- issue: שְׁמַע 是否直接译为“顺服”
  choice: 听
  alternative: 听从；顺服
  rationale: 该命令在先知宣告中可含认真领受并回应的意味，但本节没有必要把其语义明确收窄为“顺服”，故保留原文张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。为使长呼语在中文中清楚顺畅，将主要命令“都要听耶和华的话”置于受话者列举之后。脚注标记紧随其所说明的“臣仆”。
