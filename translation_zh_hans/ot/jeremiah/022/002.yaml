  terminology: “耶和华”作为中文圣经传统中稳定、可辨识的神名译法，保留了原文专名而未泛化为称号。“大卫宝座”“犹大王”“臣仆”等术语均忠实且符合经文庄重语域。脚注准确说明 עֲבָדֶיךָ 在王室语境中可涵盖“官员”，同时正文不将其范围不当窄化。
