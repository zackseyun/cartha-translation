  source_fidelity: 译文准确传达了连续命令“你要说”、先知性命令“听”、对“坐在大卫宝座上的犹大王”的呼语，以及受话者扩展为王、其臣仆和经由这些门进入的百姓。将最后的分词性短语自然地连于“百姓”，与原文及英语审校轨迹一致；“从这些门进来”也恰当表达了带动作动词时 בְּ 的路径/处所含义。
