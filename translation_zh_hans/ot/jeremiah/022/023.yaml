  text: ישבתי בַּ/לְּבָנ֔וֹן מקננתי בָּֽ/אֲרָזִ֑ים מַה נֵּחַנְתְּ֙ בְּ/בֹא לָ֣/ךְ חֲבָלִ֔ים חִ֖יל כַּ/יֹּלֵדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/022/023.yaml
  text: You who dwell in Lebanon[a], who nest in the cedars, how you will groan when pangs come upon you[b], pain like that of a woman giving birth.
translation:
  language: zh_hans
  text: 你这住在黎巴嫩[a]、在香柏树间筑巢的啊，当产痛临到你时，你将何等呻吟[b]，像临产的妇人一样！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “黎巴嫩”和“香柏树”可能让人想到以黎巴嫩香柏木建造的王宫，借此描绘犹大统治者身居高处、自以为安稳。
    reason: cultural_note
  - marker: b
    text: “你将何等呻吟”或译“你将何等受人怜悯”。此处希伯来语动词较难确定；有人认为它指受人怜悯，而不是发出呻吟。
    reason: lexical_alternative
lexical_decisions:
- source_word: ישבתי
  choice: 住
  rationale: 按上下文理解为对阴性单数对象的称呼，指居住而非字面上的坐着；中文用“住”自然地表达其居处状态。
- source_word: בַּלְּבָנוֹן
  choice: 在黎巴嫩
  rationale: 保留直接的地点表达，不在正文中限定为宫殿或纯粹比喻。
- source_word: מקננתי
  choice: 筑巢
  rationale: 保留קנן所呈现的巢居意象，也传达身居高处、自以为安稳的意味，但不将后者明说。
- source_word: בארזים
  choice: 在香柏树中
  rationale: 保留复数树木意象；“香柏树”是现代中文圣经语境中清楚而庄重的称呼。
- source_word: מַה
  choice: 何等
  rationale: 这里是感叹用法，译作“何等”比疑问词“什么”更符合句法和语气。
- source_word: נֵּחַנְתְּ
  choice: 呻吟
  rationale: 该词形和词义较难确定；在产痛语境中，“呻吟”较贴切，同时以脚注保留“受人怜悯”的另一种理解。
- source_word: בְּבֹא לָךְ
  choice: 当……临到你
  rationale: 将介词加不定词结构表达为时间从句，准确呈现痛苦来临。
- source_word: חֲבָלִים
  choice: 产痛
  rationale: 结合随后临产妇人的明喻，此处指生产般的阵痛，而非“绳索”。
- source_word: חִיל
  choice: 痛苦
  rationale: 该词可指战栗、扭动和剧烈痛楚；“痛苦”在中文中自然，并由后面的临产比喻具体说明。
- source_word: כַּיֹּלֵדָה
  choice: 如临产的妇人
  rationale: 简洁、清楚地保留分娩的明喻及其剧烈痛楚。
theological_decisions:
- issue: “黎巴嫩”和“香柏树”的指向
  choice: 正文保留地理和树木意象，脚注说明可能暗指王宫及统治者的高位安稳
  alternative: 在正文中直接译成“香柏木王宫”
  rationale: 原文意象可能唤起用黎巴嫩香柏木建造的王宫，但没有明说“王宫”；保留意象可避免把合理的历史解释变成唯一释义。
- issue: 难解动词נֵּחַנְתְּ的含义
  choice: 正文译为“呻吟”
  alternative: 译为“受人怜悯”
  rationale: 紧接着的产痛和临产妇人意象支持发出呻吟的理解，但另一词义分析确有文本依据，故列入脚注而不消除歧义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以“住在……、在……筑巢”保留希伯来诗句的平行意象；后半句调整为自然中文语序，并以“何等……！”呈现原文的强烈感叹。脚注标记均在正文出现，且文化说明紧随相关意象、词义异读紧随难解动词。
