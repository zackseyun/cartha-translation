source:
  edition: WLC
  text: כָּל רֹעַ֨יִ/ךְ֙ תִּרְעֶה ר֔וּחַ וּֽ/מְאַהֲבַ֖יִ/ךְ בַּ/שְּׁבִ֣י יֵלֵ֑כוּ כִּ֣י אָ֤ז תֵּבֹ֨שִׁי֙ וְ/נִכְלַ֔מְתְּ מִ/כֹּ֖ל רָעָתֵֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/022/022.yaml
  text: All your shepherds the wind will shepherd[a], and your lovers will go into captivity[b]; then you will surely be ashamed and humiliated because of all your evil.
translation:
  language: zh_hans
  text: 风要放牧你所有的牧人[a]，你的情人都要被掳而去[b]；到那时，你必因自己的一切恶行蒙羞受辱。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“风要吹散你所有的领袖”。原文“牧人”和“放牧”出自同一词根，形成反讽性的双关。
    reason: lexical_alternative
  - marker: b
    text: “情人”是先知性的比喻，指犹大所依恋的不正当政治盟友和其他依附对象。
    reason: cultural_note
lexical_decisions:
- source_word: רֹעַיִךְ
  choice: 你的牧人
  rationale: 该词是רעה的分词形式，字面义为“你的牧人”，在耶利米书中常比喻统治者或领袖。正文保留先知性的牧人意象。
- source_word: תִּרְעֶה רוּחַ
  choice: 风要放牧
  rationale: 动词תִּרְעֶה与前面的“牧人”同根，形成尖锐的反讽双关。译作“放牧”保留词根呼应；其具体结果可能是被风驱散，故在脚注说明。
- source_word: מְאַהֲבַיִךְ
  choice: 你的情人
  rationale: 字面为“爱你的人／你的情人”，在先知语境中可指犹大所依恋的政治盟友，并带有不忠的隐喻色彩；不直接改译为“盟友”，以保留原文张力。
- source_word: בַּשְּׁבִי יֵלֵכוּ
  choice: 都要被掳而去
  rationale: 原短语直译为“进入被掳之中”。“被掳而去”在现代汉语中自然地表达遭俘虏并被带走，同时不把它窄化为单纯的流亡。
- source_word: כִּי אָז
  choice: 到那时
  rationale: 此处承接前述审判并引出其结果；“到那时”符合汉语叙述，也保留时间推进。
- source_word: תֵּבֹשִׁי וְנִכְלַמְתְּ
  choice: 蒙羞受辱
  rationale: 两个近义动词并列，分别表达羞耻和受辱。用并列四字结构保留加强语气，又符合庄重自然的现代汉语。
- source_word: מִכֹּל רָעָתֵךְ
  choice: 因自己的一切恶行
  rationale: 介词מִן在此表示导致羞辱的原因。“恶行”比笼统的“邪恶”更自然地指向对方所行的一切恶事。
theological_decisions:
- issue: 犹大政治与属灵不忠的隐喻表达
  choice: 正文保留“牧人”和“情人”两个隐喻
  alternative: 将其明说为“领袖”和“盟友”
  rationale: 原文借牧人意象指涉治理者，并以情爱语言刻画犹大不正当的政治依附。保留隐喻可维持先知话语的道德力度，又不把可能的指涉解释写死。
- issue: “风放牧牧人”的反讽双关
  choice: 保留为“风要放牧你所有的牧人”
  alternative: 译为“风要吹散你所有的领袖”
  rationale: 原文重复רעה词根，含义虽可指向驱散，却刻意让牧人反过来受风“牧放”。正文保留这一神学审判中的角色倒置，脚注交代通顺的意义译法。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“风要放牧你所有的牧人”有意保留原文突兀的双关和反讽；其意义由脚注辅助说明。“蒙羞受辱”以自然汉语保留两个近义词的叠加强调。
