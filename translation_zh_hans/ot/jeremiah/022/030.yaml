base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/022/030.yaml
  text: 'Thus says Yahweh: Write this man down as childless[a], a man who will not prosper in his days; for none of his offspring will prosper[b] to sit on the throne of David and rule again in Judah.'
translation:
  language: zh_hans
  text: 耶和华如此说：“你们要把这人登记为无儿女的[a]，是个一生不得亨通的人；因为他的后裔中，必没有一人能成功地坐在大卫的宝座上，并再次在犹大执政[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“登记这人为没有继承人的”。希伯来文直说“无儿女的”，但下文表明重点在王朝承继：他的后裔中没有人会成功作为大卫王朝的君王在犹大执政。
    reason: lexical_alternative
  - marker: b
    text: 意思是：他的后裔中，不会有人能成功地坐在大卫的宝座上，并在犹大执政。
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的专名形式来译四字神名，不以“主”替代原文专名。
- source_word: כִּתְבוּ
  choice: 你们要把……登记为
  rationale: 复数命令式在此带有记载、列入记录的行政意味；“登记为”比单说“写下”更自然地表达这一语用功能。
- source_word: עֲרִירִי
  choice: 无儿女的
  rationale: 保留该词“无子女、无后”的直接词义；下文则说明本节关注的是王位继承，而非断言他没有任何亲生后代。
- source_word: לֹא יִצְלַח בְּיָמָיו
  choice: 一生不得亨通
  rationale: צלח表示顺利、成功或亨通；“一生”自然传达字面的“在他的日子里”，同时保持庄重简洁。
- source_word: מִזַּרְעוֹ
  choice: 他的后裔中
  rationale: זרע在这里是集合意义，指其后代；“后裔”准确而符合王朝语境。
- source_word: אִישׁ יֹשֵׁב עַל כִּסֵּא דָוִד וּמֹשֵׁל עוֹד בִּיהוּדָה
  choice: 没有一人能亨通，坐在大卫的宝座上，再治理犹大
  rationale: 保留原文中“亨通”与“坐在宝座上、治理”之间略显压缩的句法关系，不把它过度拆解成彼此独立的断言；“再”表达 עוֹד 的继续或再度发生之意。
theological_decisions:
- issue: 约雅斤明有后裔，却被记为“无儿女的”
  choice: 正文直译为“无儿女的”，由下文和脚注指出其王朝继承层面的焦点。
  alternative: 直接译为“没有继承人的”或把它解释为夸张的咒诅用语。
  rationale: עֲרִירִי 的直接词义不应在正文中被解释性改写；紧接的理由明确谈到后裔不能在大卫宝座上治理犹大，因此审判重点是王位承继。
- issue: 末句是否绝对否定其后裔的一切成就
  choice: 将“亨通”置于坐大卫宝座、治理犹大的王权语境中理解。
  alternative: 理解为其所有后裔在人生各方面都绝不会成功，或拆成“无人坐宝座”和“无人治理”两个完全独立的断言。
  rationale: 原文由“他的后裔中”引出一人，并用两个分词描写其王者身份；语境所否定的是其后裔作为犹大王成功执政。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“耶和华如此说”保留先知宣告的固定庄严语气；“无儿女的”保留原文张力，以脚注说明其王朝语境。
