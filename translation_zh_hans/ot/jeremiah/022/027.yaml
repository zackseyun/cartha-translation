  text: But to the land to which they lift up their soul to return[a], there they will not return.
translation:
  language: zh_hans
  text: 但他们一心渴望回去的那片土地[a]，他们却不会回到那里。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “一心渴望”直译为“举起他们的心”，是表示强烈愿望或向往的希伯来语习语。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל הָאָרֶץ
  choice: 但……那片土地
  rationale: וְ在上下文中有转折作用，עַל引出本句的话题；中文以“但”配合前置的“那片土地”自然表达。הָאָרֶץ在归回故土的语境中指特定地域，故译作“那片土地”。
- source_word: אֲשֶר הֵם מְנַשְּׂאִים אֶת־נַפְשָׁם לָשׁוּב שָׁם
  choice: 他们一心渴望回去的
  rationale: מְנַשְּׂאִים אֶת־נַפְשָׁם直译为“举起自己的心魂”，是表达强烈愿望的习语；“一心渴望”既传达强度，也符合现代汉语。שָׁם的地点意义由“回去”和先行词“那片土地”自然包含。
- source_word: שָׁמָּה לֹא יָשׁוּבוּ
  choice: 他们却不得回到那里
  rationale: 保留שָׁמָּה“那里”的强调，并用“回到”再现שׁוּב的重复。“不得”表达预告性的否定结局，不额外加强为“永远不能”。
