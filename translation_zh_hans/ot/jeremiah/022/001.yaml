base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/022/001.yaml
  text: 'Thus says Yahweh: Go down to the house of the king of Judah[c][b][a], and speak there this word:'
translation:
  language: zh_hans
  text: 雅威如此说[a]：“你下到犹大王宫[b]去，在那里说这话[c]：”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“雅威这样说。”
    reason: lexical_alternative
  - marker: b
    text: 希伯来语直译“犹大王的家”，这里很可能指王宫。
    reason: cultural_note
  - marker: c
    text: 或译：“这信息。”
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  choice: 雅威如此说
  rationale: 保留先知传信公式的庄重语气；用“如此说”对应כֹּה אָמַר，并将神名יהוה音译为“雅威”。
- source_word: רֵד
  choice: 下到……去
  rationale: 这是ירד的命令式；“下到……去”既保留方向含义，也符合现代汉语表达。
- source_word: בֵּית מֶלֶךְ יְהוּדָה
  choice: 犹大王宫
  rationale: 希伯来语直译为“犹大王的家”；在本语境中指君王所在的宫殿，译作“王宫”自然明确，同时以脚注保留原文形式。
- source_word: וְדִבַּרְתָּ שָׁם
  choice: 在那里说
  rationale: 承接前面的命令，具有命令语气；“说”不额外加入“宣告”可能带有的强化意味。
- source_word: אֶת־הַדָּבָר הַזֶּה
  choice: 这话
  rationale: דָּבָר为单数，在这里指即将说出的先知话语；“这话”简洁并保留希伯来语的先知性惯用表达。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名יהוה；采用较贴近YHWH通常重建读音的“雅威”，以保留其作为立约神名的性质。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“如此说”保留先知公式的节奏；“下到……去”保留原文的方向性；结尾用冒号引出下一节的直接话语。
