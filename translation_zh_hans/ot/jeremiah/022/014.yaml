base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/022/014.yaml
  text: who says[a], ‘I will build myself a spacious house with roomy upper chambers,’ and cuts out windows for it, paneling it with cedar and painting it red.
translation:
  language: zh_hans
  text: 那说：“我要为自己建造宽敞的房屋和宽大的楼上房间”，又为房屋开窗、用香柏木镶板，并把它涂成红色的人。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“把它涂上朱红色。”这里可能指辰砂制成的昂贵红色颜料。
    reason: 保留שָׁשַׁר可能特指朱红色或辰砂颜料的词义，同时不在正文中把具体材质定死。
lexical_decisions:
- source_word: הָאֹמֵר
  choice: 他说
  rationale: 定冠词加分词在此承接上一节所责备之人的描述；汉语用“他说”自然地延续句意。
- source_word: אֶבְנֶה לִּי
  choice: 我要为自己建造
  rationale: 介词ל加第一人称后缀表示为自身利益；“为自己建造”准确保留自利意味。
- source_word: בֵּית מִדּוֹת
  choice: 宽敞的房屋
  rationale: 该短语指房屋规模宏大、尺寸可观；“宽敞”比直译“有尺寸的”自然，也避免用“豪宅”作过度诠释。
- source_word: וַעֲלִיּוֹת מְרֻוָּחִים
  choice: 宽大的楼房
  rationale: עֲלִיּוֹת指楼上的房间，מְרֻוָּחִים表示宽阔或宽敞；“楼房”在此按上层房间理解，表达简洁庄重。
- source_word: וְקָרַע לוֹ חַלּוֹנָי
  choice: 他为房屋开出窗户
  rationale: קָרַע本义为撕开、劈开，在建筑语境中指开出窗洞；“开出窗户”保留动作的鲜明感，并将לוֹ自然理解为指房屋。
- source_word: וְסָפוּן בָּאָרֶז
  choice: 用香柏木镶板
  rationale: סָפוּן表示覆盖或镶板；建筑语境下“镶板”明确传达以贵重香柏木作内装的意思。
- source_word: וּמָשׁוֹחַ בַּשָּׁשַׁר
  choice: 把它涂成红色
  rationale: שָׁשַׁר指一种红色颜料，具体材质不能完全确定；正文采用清楚而不过度具体化的“红色”，专名可能性置于脚注。
theological_decisions: []
