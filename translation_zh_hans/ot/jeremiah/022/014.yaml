  naturalness: “楼上房间”是现代普通话中清楚自然的说法。将本节组织为“那说……、又……的人”，虽因承接上节而带有悬置感，却准确反映原文句法及先知宣告的上下文。
  terminology: “香柏木镶板”准确传达以香柏木覆盖／装饰。“涂成红色”保留שָׁשַׁר所指红色颜料的不确定性；脚注以“朱红色（可能为辰砂）”说明可能的较具体含义，不把推测写死在正文。
