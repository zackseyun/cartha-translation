source:
  edition: WLC
  text: לָ/כֵ֞ן כֹּֽה אָמַ֣ר יְהוָ֗ה אֶל יְהוֹיָקִ֤ים בֶּן יֹאשִׁיָּ֨הוּ֙ מֶ֣לֶךְ יְהוּדָ֔ה לֹא יִסְפְּד֣וּ ל֔/וֹ ה֥וֹי אָחִ֖/י וְ/ה֣וֹי אָח֑וֹת לֹא יִסְפְּד֣וּ ל֔/וֹ ה֥וֹי אָד֖וֹן וְ/ה֥וֹי הֹדֹֽ/ה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/022/018.yaml
  text: 'Therefore thus says Yahweh concerning Jehoiakim son of Josiah[a], king of Judah: They will not lament for him, saying, “Alas, my brother!” or “Alas, sister!” They will not lament for him, saying, “Alas, lord!” or “Alas[d][c][b], his majesty!”'
translation:
  language: zh_hans
  text: 因此，耶和华论到犹大王约西亚的儿子约雅敬这样说：人必不为他举哀[a]，说：“哀哉，我兄！”或“哀哉，这位姊妹！”人也不为他举哀，说：“哀哉，主上！”或“哀哉，他的威荣！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “举哀”也可译作“哀悼”。原文动词尤其指为死者作正式的丧礼哀歌。
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: 因此
  rationale: 承接前文审判信息，保留推论关系和先知话语的推进。
- source_word: כֹּה אָמַר יְהוָה
  choice: 耶和华……这样说
  rationale: 以自然的现代汉语呈现标准先知传信公式，同时保留神名。
- source_word: אֶל
  choice: 论到
  rationale: 此处引出神谕所针对的人，而非单纯表示向约雅敬直接说话。
- source_word: יְהוֹיָקִים בֶּן יֹאשִׁיָּהוּ מֶלֶךְ יְהוּדָה
  choice: 犹大王约西亚的儿子约雅敬
  rationale: 完整保留父名与王位身份，并按自然汉语调整语序。
- source_word: לֹא יִסְפְּדוּ לוֹ
  choice: 人必不为他举哀
  rationale: ספד特指以哀歌等形式进行的丧葬哀悼；“举哀”比宽泛的“哀伤”更能体现公开、礼仪性的含义。
- source_word: הוֹי
  choice: 哀哉
  rationale: 这里是丧礼哀歌中的感叹词；“哀哉”庄重而清楚地表达哀叹。
- source_word: אָחִי
  choice: 我兄
  rationale: 保留希伯来语第一人称单数后缀；简洁地呈现直接哀号。
- source_word: אָחוֹת
  choice: 姊妹
  rationale: 原文此词没有“我的”这一后缀，因此不为与上句对称而擅自补入。
- source_word: אָדוֹן
  choice: 主上
  rationale: 表达对君王或尊长的称呼，又避免与神名的译法混淆；符合此处宫廷哀歌语境。
- source_word: הֹדֹה
  choice: 他的威荣
  rationale: הוֹד可指威严、荣美或尊荣，且带第三人称单数后缀；“他的威荣”保留代词与王者威仪的含义。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 采用现代中文读者最熟悉且可识别为专名的传统音译；不以“主”替代原文的专有神名。
- issue: אָדוֹן 是否译成可能与神称号重叠的“主”
  choice: 主上
  alternative: 主人／主
  rationale: 上下文是为君王所作的哀歌，称谓指人的尊位；“主上”保留尊称性质，又不把它误解为对神的称呼。
- issue: הֹדֹה 所指为何
  choice: 他的威荣
  alternative: 陛下／他的荣美
  rationale: 保留第三人称后缀及“威严、荣美”的词义，不把原文进一步解释成固定的直接称呼；由此保留哀歌措辞本身略显突兀的张力。
translation_notes:
  register: 采用庄重而可懂的现代标准汉语。“我兄”“姊妹”“主上”“威荣”略带哀歌和宫廷色彩，以对应原文的正式丧葬呼号；没有为平行整齐而在“姊妹”前补入原文没有的“我的”。
