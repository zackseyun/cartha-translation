source:
  edition: WLC
  text: חַי אָנִי֮ נְאֻם יְהוָה֒ כִּ֣י אִם יִהְיֶ֞ה כָּנְיָ֤הוּ בֶן יְהֽוֹיָקִים֙ מֶ֣לֶךְ יְהוּדָ֔ה חוֹתָ֖ם עַל יַ֣ד יְמִינִ֑/י כִּ֥י מִ/שָּׁ֖ם אֶתְּקֶֽ/נְךָּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/022/024.yaml
  text: As I live[a], declares Yahweh, even if Coniah son of Jehoiakim, king of Judah, were a signet ring on my right hand[b], even from there I would tear you off.
translation:
  language: zh_hans
  text: 雅威宣告：“我指着我的永生起誓：即使犹大王约雅敬的儿子哥尼雅[a]是我右手上的印戒[b]，我也要从那里把你扯下来。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “哥尼雅”是本节所用的希伯来名字形式；这位王在别处也称为“耶哥尼雅”。
    reason: alternative_reading
  - marker: b
    text: 或译“印章”“图章”。这里描绘的可能是戴在手上的印戒，既用于盖印，也象征权柄和珍贵。
    reason: lexical_alternative
lexical_decisions:
- source_word: חַי אָנִי
  choice: 我指着我的永生起誓
  rationale: 这是庄严的自我起誓公式。中文用“指着我的永生起誓”自然传达誓言的郑重和确定性，而不是将其误解为单纯陈述“我活着”。
- source_word: נְאֻם יְהוָה
  choice: 雅威宣告
  rationale: 保留先知书中神谕公式的庄重语气，并按原文直接译出神名。
- source_word: כִּי אִם
  choice: 即使
  rationale: 此处引出强烈的让步假设：纵然哥尼雅处在极尊贵、亲近的位置，审判仍不改变。
- source_word: כָּנְיָהוּ
  choice: 哥尼雅
  rationale: 按本节实际出现的较短名字形式音译，不与别处的“耶哥尼雅”强行统一。
- source_word: חוֹתָם
  choice: 印戒
  rationale: 该词指用于盖印的印章；“在右手上”的语境表明这里很可能描绘佩戴在手上的印戒。脚注保留“印章”等词义范围。
- source_word: עַל יַד יְמִינִי
  choice: 我右手上的
  rationale: 自然保留原文关于尊贵、亲近和权柄的空间意象。
- source_word: מִשָּׁם
  choice: 从那里
  rationale: 明确回指假设中的位置，即雅威的右手上。
- source_word: אֶתְּקֶנְךָּ
  choice: 把你扯下来
  rationale: נתק表达用力拉开、扯下。保留原文从第三人称提及哥尼雅转为第二人称直接斥责“你”的突变。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文使用四字神名，正文以“雅威”音译，保留其作为盟约之神专名的功能。
- issue: כָּנְיָהוּ 的名字形式
  choice: 哥尼雅
  alternative: 耶哥尼雅
  rationale: 本节采用短式 כָּנְיָהוּ；不以其他经文中的较长形式代换，以保留本处措辞。
- issue: 第三人称转为第二人称
  choice: 先称“哥尼雅”，后直接说“你”
  alternative: 全句统一为第三人称“他”
  rationale: 原文末尾后缀为第二人称单数，突然转为直接对哥尼雅说话；保留这一转换可呈现审判话语的直接性和张力。
- issue: 右手上 חוֹתָם 的比喻
  choice: 印戒
  alternative: 印章；图章
  rationale: 比喻表达亲近、珍贵和权柄，但正文不额外解释这些神学含义；以脚注说明实物及词义范围。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“我指着我的永生起誓”传达神圣誓言公式；“扯下来”保留审判动作的力度。标点将神谕公式置于引语前，同时不消除原文由第三人称转向第二人称的修辞张力。
