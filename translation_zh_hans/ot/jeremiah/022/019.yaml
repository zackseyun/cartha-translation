base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/022/019.yaml
  text: He will be buried with the burial of a donkey—dragged off and thrown out beyond the gates of Jerusalem[a][b].
translation:
  language: zh_hans
  text: 他必像埋葬驴那样被埋葬——被拖走，抛到耶路撒冷的城门外[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他必按埋葬驴的方式被埋葬”，或“他必遭受如同驴的埋葬”。
    reason: lexical_alternative
  - marker: b
    text: 这里描绘的是尸身被弃置在城外、得不到体面安葬的羞辱景象。
    reason: cultural_note
lexical_decisions:
- source_word: קְבוּרַת חֲמוֹר
  choice: 像驴一样被埋葬
  rationale: 原文为“驴的埋葬”这一领属结构，在本句中表达埋葬方式的比较。译文用现代汉语自然表达其比较含义，同时在脚注保留较直译的说法。
- source_word: יִקָּבֵר
  choice: 他必……被埋葬
  rationale: קבר 的尼法勒未完成式，表示被动及将来、必然的语气；“必被埋葬”既保留预言语气，也符合中文经文体。
- source_word: סָחוֹב
  choice: 被拖走
  rationale: 不定式绝对形在此与后续动作相连，生动描写尸体遭拖曳处置；“被拖走”保留动作方向和受辱意味。
- source_word: וְהַשְׁלֵךְ
  choice: 扔到
  rationale: 源自动词 שלך 的使役形式，意为“扔、抛”；“扔到”与后面的地点短语自然衔接，并保留粗暴处置的语感。
- source_word: מֵהָלְאָה לְשַׁעֲרֵי
  choice: 城门以外
  rationale: 该空间表达指越过、远在城门之外；“城门以外”简洁清楚地表明尸体被弃置在城外。
- source_word: יְרוּשָׁלִָם
  choice: 耶路撒冷
  rationale: 采用现代中文圣经及一般读者熟悉的标准地名译法。
theological_decisions:
- issue: “驴的埋葬”这一比喻的性质
  choice: 表达像处置驴尸一样受辱地被拖出并弃置，而不是得到体面的安葬
  alternative: 仅按字面陈述一种埋葬方式，不突出羞辱意味
  rationale: 紧接着的“被拖走，扔到……城门以外”明确表现弃尸和受辱的图景。不过正文不额外加入“尸体”“不得安葬”等原文未明说的词，而将文化含义放入脚注。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“必”体现预言的确定语气；破折号承接后面两个动作，呈现原文紧凑而强烈的画面。正文中的[a][b]与脚注逐一对应。
