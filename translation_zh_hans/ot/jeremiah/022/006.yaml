language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כִּֽי כֹ֣ה אָמַ֣ר יְהוָ֗ה עַל בֵּית֙ מֶ֣לֶךְ יְהוּדָ֔ה גִּלְעָ֥ד אַתָּ֛ה לִ֖/י רֹ֣אשׁ הַ/לְּבָנ֑וֹן אִם לֹ֤א אֲשִֽׁיתְ/ךָ֙ מִדְבָּ֔ר עָרִ֖ים לֹ֥א נושבה־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/022/006.yaml
  text: 'For thus says Yahweh concerning the house of the king of Judah: You are Gilead to me[a], the summit of Lebanon; surely I will make you a wilderness[c][b], cities not inhabited.'
translation:
  language: zh_hans
  text: '因为雅威论到犹大王的家如此说：


    “你在我眼中如基列，

    如黎巴嫩的峰顶[a]；


    我必定[b]使你成为旷野，

    城邑无人居住[c]。”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “峰顶”原文直译为“头”；这里可指黎巴嫩的最高处或显要之处。
    reason: lexical_alternative
  - marker: b
    text: “必定”译自希伯来语的誓言式表达，字面是“如果我不使你……”，借省略誓言的后果来强调事情一定成就。
    reason: lexical_alternative
  - marker: c
    text: 原文此处可直译为“旷野，城邑无人居住”，是略显突兀的并置表达；它描写审判的结果，即城邑荒废、无人居住。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: 雅威
  rationale: 以常见的中文音译保留上帝的专名，不以称号代替原文的盟约之名。
- source_word: עַל
  choice: 论到
  rationale: 这里引出针对某一对象的先知性宣告；“论到”自然且不预先把介词解释成敌对性的“攻击”。
- source_word: בֵּית מֶלֶךְ יְהוּדָה
  choice: 犹大王的家
  rationale: 保留“家”的广度，既可指王宫，也可能涵盖王室及其统治机构；不在正文中将其缩限为单一含义。
- source_word: גִּלְעָד
  choice: 基列
  rationale: 采用现代中文圣经地名的通行译名；此处用作比喻，表达珍贵、壮美或繁盛的形象。
- source_word: רֹאשׁ הַלְּבָנוֹן
  choice: 黎巴嫩的峰顶
  rationale: רֹאשׁ 字面为“头”，用于地貌时“峰顶”更符合现代汉语，同时保留高耸显要的意象。
- source_word: לִי
  choice: 在我眼中
  rationale: 该与格表示关系或评价；“在我眼中”自然传达王家在雅威看来如基列和黎巴嫩峰顶一般。
- source_word: אִם לֹא
  choice: 必定
  rationale: 此处不是普通条件句，而是省略咒诅后果的誓言式强调；“必定”表达审判宣告的确定性。
- source_word: אֲשִׁיתְךָ
  choice: 使你变为
  rationale: שׂים 在此带表语，表示使对象进入某种状态；“使你变为”清楚表达从显赫之地沦为荒凉之地的结果。
- source_word: מִדְבָּר
  choice: 旷野
  rationale: 该词指荒芜、无人之地，并不必然是沙漠；“旷野”既准确又保留庄重的经文语体。
- source_word: עָרִים לֹא נוֹשָׁבָה
  choice: 无人居住的城邑
  rationale: 将略显突兀的希伯来语并置结构理解为审判后的景象：城邑被弃置，无人居住；“城邑”保持庄重而可懂。
theological_decisions:
- issue: 尊荣意象与毁灭宣告的并置
  choice: 先将王家比作基列和黎巴嫩峰顶，随即宣告它必沦为旷野和无人居住的城邑。
  alternative: 把基列和黎巴嫩主要理解为盛产木材、与王宫建筑有关的地域指称。
  rationale: 原文没有解释比喻的具体着眼点，却鲜明并置了壮美、显要的地理意象与确定的审判。译文保留这种张力，不把它限定为一般赞美或木材来源。
- issue: 誓言式 אִם לֹא 的表达
  choice: 在正文译为“必定”，并以脚注说明其字面形式。
  alternative: 直译为“如果我不使你……”，留下未说出的自我咒诅。
  rationale: 中文若直译为未完成的条件句会造成误解；“必定”传达其语用功能，脚注则保留原文誓言结构及神圣宣告的力度。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“论到”“旷野”“城邑”维持先知宣告的经文语感；分行呈现原文由尊荣意象骤转为荒凉审判的节奏。所有脚注标记均已置于正文相应位置。
