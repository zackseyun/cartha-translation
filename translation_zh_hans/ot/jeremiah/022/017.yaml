base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/022/017.yaml
  text: But your eyes and your heart are set on nothing except your dishonest gain[a], on shedding innocent blood, and on practicing oppression and extortion.
translation:
  language: zh_hans
  text: 但你的眼目和心，只顾自己的不义之财，只顾流无辜人的血，只顾施行欺压和暴行[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “暴行”所对应的希伯来词十分罕见，也可理解为“勒索”或更广义的残酷恶行。因此，末句也可译作“施行欺压和勒索”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵין ... כִּי אִם
  choice: 只顾
  rationale: 这一排他结构表示目光和心思专注于某事；“只顾”在现代汉语中自然地表达“除……以外别无所顾”的强烈排他意味。
- source_word: עֵינֶיךָ וְלִבְּךָ
  choice: 你的眼和你的心
  rationale: 保留原文并列的身体隐喻；“眼”指注意与欲求，“心”涵盖思想、意志和意图。
- source_word: בִּצְעֶךָ
  choice: 自己的不义之财
  rationale: 该词通常指以不正当手段取得的利益；“不义之财”兼顾所得之利及其道德败坏，比单译“贪心”更具体。
- source_word: דַּם הַנָּקִי לִשְׁפּוֹךְ
  choice: 流无辜人的血
  rationale: 采用自然且庄重的汉语圣经表达，准确指杀害无罪之人。
- source_word: הָעֹשֶׁק
  choice: 欺压
  rationale: 该名词可指压迫、剥削或讹诈；“欺压”在先知性谴责的社会语境中简洁而宽广。
- source_word: הַמְּרוּצָה
  choice: 暴行
  rationale: 这是罕见且释义不确定的词，在本语境中可能指暴力、横暴或残酷的恶行；正文采用较宽泛的“暴行”，避免过度限定为牟利性的“勒索”。
- source_word: לַעֲשׂוֹת
  choice: 施行
  rationale: 此不定式统摄末尾所列行为；“施行”既符合庄重语体，也表达实际做出这些恶事。
theological_decisions:
- issue: 眼与心的关系
  choice: 保留“你的眼和你的心”的并列表述
  alternative: 意译为“你一心只顾”
  rationale: 直译保留希伯来文关于注意、欲望、意志和内在意图的复合描写，避免把其神学人观缩减为单一心理状态。
- issue: הַמְּרוּצָה 的含义
  choice: 正文译作“暴行”，脚注说明也可理解为勒索或残酷恶行
  alternative: 正文直接译作“勒索”
  rationale: 该罕见词的确切意义存在真实的词汇不确定性；采用较宽的译法并以脚注保留较窄解释，不把经文的谴责局限为某一种罪行。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“只顾”形成三项排比，传达原文排他性的专注；保留“眼”和“心”的希伯来隐喻。脚注标记置于“不义之财”之后，作为本节唯一脚注入口，但内容明确说明其所讨论的是后文罕见词“暴行”，以与所提供的标记体系一致。
