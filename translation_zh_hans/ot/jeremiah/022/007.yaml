  text: וְ/קִדַּשְׁתִּ֥י עָלֶ֛י/ךָ מַשְׁחִתִ֖ים אִ֣ישׁ וְ/כֵלָ֑י/ו וְ/כָֽרְתוּ֙ מִבְחַ֣ר אֲרָזֶ֔י/ךָ וְ/הִפִּ֖ילוּ עַל הָ/אֵֽשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/022/007.yaml
  text: And I will set apart destroyers against you[a], each with his weapons[c][b]; they will cut down the choicest of your cedars and cast them into the fire.
translation:
  language: zh_hans
  text: 我要派定毁灭者来攻击你[a]，各人带着自己的兵器[b]；他们要砍下你最好的香柏树，把它们扔进火里[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我要使毁灭者分别为圣来攻击你。”原文动词常译为“使成圣”或“分别为圣”；此处指神把执行审判的人分别出来、派定承担这项任务。
    reason: lexical_alternative
  - marker: b
    text: 或译：“各人带着自己的器具（装备）。”原词可泛指器皿、器具、装备或兵器；在这里很可能指兵器或用于毁坏的工具。
    reason: lexical_alternative
  - marker: c
    text: 原文直译“在火上”；按上下文所表达的结果，译作“扔进火里”较为自然。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקִדַּשְׁתִּי
  choice: 我要使……分别出来
  rationale: קדשׁ的基本含义是“使成圣、分别出来”。此处指耶和华把执行审判的人指定出来；这一译法保留原文的分别为圣用语，又不暗示这些毁灭者在道德上圣洁。
- source_word: מַשְׁחִתִים
  choice: 行毁灭的人
  rationale: 该分词在此用作名词，指实施毁灭的行动者；译为“行毁灭的人”自然清楚，也保留其行动性质。
- source_word: עָלֶיךָ
  choice: 攻击你
  rationale: 介词עַל在敌对行动的语境中表示“针对、攻击”，此译明确表达其敌对方向。
- source_word: אִישׁ וְכֵלָיו
  choice: 各人带着自己的兵器
  rationale: אִישׁ在复数主体之后具有逐一分配的意思。כְּלִי可泛指器具、装备或兵器；在军事审判语境中，“兵器”最为贴切，但脚注保留较宽泛的可能。
- source_word: וְכָרְתוּ
  choice: 他们要砍下
  rationale: כרת用于树木时表示砍伐、砍倒；“砍下”与后续投入火中衔接自然。
- source_word: מִבְחַר אֲרָזֶיךָ
  choice: 你最好的香柏树
  rationale: מִבְחַר指精选或上好的部分；“最好的”以现代汉语自然表达其优选、上乘之意。
- source_word: וְהִפִּילוּ עַל הָאֵשׁ
  choice: 把它们扔在火上
  rationale: 原文直译为使其落在火上。“扔在火上”既符合汉语习惯，也保留עַל的表面空间意象；脚注说明也可按目的结果理解为扔进火里。
theological_decisions:
- issue: 审判宣告中的分别为圣用语
  choice: 译作“我要使行毁灭的人分别出来”
  alternative: “我要指定行毁灭的人”或“我要使行毁灭的人成圣”
  rationale: 原文以קדשׁ描述耶和华将审判执行者分别出来承担任务。“指定”会削弱原文的神圣分别色彩，而直译“成圣”容易使现代读者误以为这些人具有道德圣洁；所选译法保留了原文张力而不作过度解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以“分别出来”保留审判语境中的圣别用语；句式维持先指定毁灭者、后描述砍伐焚烧的推进结构。
