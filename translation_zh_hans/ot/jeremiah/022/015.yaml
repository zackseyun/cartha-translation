  text: הֲ/תִֽמְלֹ֔ךְ כִּ֥י אַתָּ֖ה מְתַחֲרֶ֣ה בָ/אָ֑רֶז אָבִ֜י/ךָ הֲ/ל֧וֹא אָכַ֣ל וְ/שָׁתָ֗ה וְ/עָשָׂ֤ה מִשְׁפָּט֙ וּ/צְדָקָ֔ה אָ֖ז ט֥וֹב לֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/022/015.yaml
  text: Do you reign because you compete in cedar? Did not your father eat and drink and do justice and righteousness? Then it was well with him[a][b].
translation:
  language: zh_hans
  text: 难道你作王，是因为你以香柏木争竞吗？你父亲不也吃喝，施行公平和公义吗？那时，他就过得安好。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “以香柏木争竞”也可译作“在香柏木上争胜”“为香柏木争竞”或“热衷于香柏木”。这句希伯来语较罕见，很可能指君王借香柏木装饰的建筑彼此竞逐、炫耀。
    reason: lexical_alternative
  - marker: b
    text: “公平和公义”也可译作“公平和正直”。
    reason: alternative_reading
lexical_decisions:
- source_word: הֲתִמְלֹךְ
  choice: 难道你作王
  rationale: 未完成式置于反问句中，重点不是单纯询问将来是否登基，而是质疑其作王的根据；“难道你作王”保留责问语气。
- source_word: כִּי
  choice: 是因为
  rationale: 引出对方自以为能够作王的根据，使反问的逻辑清楚。
- source_word: מְתַחֲרֶה בָאָרֶז
  choice: 在香柏木上争胜
  rationale: 罕见表达可能指借香柏木建造豪华宫室、彼此竞逐炫耀。“争胜”保留竞争和自我夸示之意，“在香柏木上”则保留原文介词结构及其含混性。
- source_word: אָבִיךָ
  choice: 你父亲
  rationale: 直接保留亲属称谓；上下文很可能指约西亚，但正文不补出名字。
- source_word: הֲלוֹא אָכַל וְשָׁתָה
  choice: 你父亲不也吃喝
  rationale: הֲלוֹא引出预期肯定回答的反问；“吃喝”指正常生活享用，不暗示放纵。
- source_word: וְעָשָׂה מִשְׁפָּט וּצְדָקָה
  choice: 却施行公平和公义
  rationale: “施行”自然表达王履行治理责任；“公平和公义”保留这组先知书中的重要伦理—盟约用语。“却”传达父亲虽正常享用生活，却仍秉公而行的语境对比。
- source_word: אָז טוֹב לוֹ
  choice: 那时，他就过得安好
  rationale: אָז指明随之而来的结果或处境；“过得安好”自然表达טוֹב לוֹ，避免将其过度解释为物质兴盛。
theological_decisions:
- issue: מִשְׁפָּט וּצְדָקָה中צְדָקָה的译法
  choice: 公平和公义
  alternative: 公平和正直
  rationale: “公义”保留צְדָקָה的道德及盟约内涵，并与מִשְׁפָּט“公平”区分；“正直”较口语化，但会弱化这一固定先知性表达的术语关联。
- issue: 王权与香柏木竞逐之间的关系
  choice: 以反问质疑香柏木豪华建造是作王的根据
  alternative: 理解为仅仅热衷香柏木
  rationale: כִּי最自然地引出所谓作王的理由；但罕见动词及介词组合仍有歧义，因此正文不明确补入“宫殿”，并用脚注保存其他可能。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“难道……吗”呈现先知责问的力度；保留“香柏木”意象及表达本身的歧义，不在正文擅自补明“宫殿”。两个脚注标记均置于相关句末。
