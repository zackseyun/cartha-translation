base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/022/026.yaml
  text: And I will hurl you and your mother who gave birth to you into another land[a], where you were not born, and there you will die.
translation:
  language: zh_hans
  text: 我要把你和生下你的母亲抛到另一片土地上；你们都不是在那里出生的，也必死在那里。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文先用单数“你”，随后在“你们不是在那里出生的”和“你们必死”中改用复数，表明此处把君王和他的母亲一同包括在内。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵטַלְתִּי
  choice: 我要……抛到
  rationale: 希非勒形态表达使某人被投掷、被抛出的强制动作；“抛到”自然地保留审判和强行放逐的力度。
- source_word: אֹתְךָ וְאֶת אִמְּךָ
  choice: 你和……你的母亲一起
  rationale: 忠实呈现两个并列宾语，并用“一起”使后文希伯来文复数动词所涵盖的两人清楚可辨。
- source_word: אֲשֶׁר יְלָדַתְךָ
  choice: 生你的母亲
  rationale: 关系从句修饰“母亲”；“生你的”简洁、自然，也准确表达母亲生下受话者。
- source_word: עַל הָאָרֶץ אַחֶרֶת
  choice: 到另一个地方
  rationale: 原文直译近于“到另一片土地上”；在抛掷和流放语境中，“到另一个地方”符合现代汉语，同时避免把 הָאָרֶץ 过度限定为现代民族国家。
- source_word: אֲשֶׁר לֹא יֻלַּדְתֶּם שָׁם
  choice: 就是你们并非出生之地
  rationale: 保留复数受话对象，即君王和他的母亲；以“之地”自然承接前面的地点表达，并呈现原文关系从句。
- source_word: וְשָׁם תָּמֽוּתוּ
  choice: 你们也必死在那里
  rationale: 复数动词继续同时指君王和他的母亲；“必死”传达先知宣告的确定性。
