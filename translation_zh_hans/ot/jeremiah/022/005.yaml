  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/אִם֙ לֹ֣א תִשְׁמְע֔וּ אֶת הַ/דְּבָרִ֖ים הָ/אֵ֑לֶּה בִּ֤/י נִשְׁבַּ֨עְתִּי֙ נְאֻם יְהוָ֔ה כִּי לְ/חָרְבָּ֥ה יִֽהְיֶ֖ה הַ/בַּ֥יִת הַ/זֶּֽה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/022/005.yaml
  text: But if you do not listen to these words[a], I swear by myself, declares Yahweh, that this house will become a ruin.
translation:
  language: zh_hans
  text: 但你们若不听这些话，我就指着自己起誓——这是雅威的宣告：这座房屋[a]必成为废墟。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“这座王宫”。按上下文，“这座房屋”很可能指犹大王的王宫。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: 但你们若
  rationale: 承接上文并引出相反条件；“但……若”既保留转折意味，也符合现代汉语的庄重表达。
- source_word: תִשְׁמְעוּ
  choice: 不听
  rationale: שׁמע可指听见、听从或顺服；此处以“这些话”为宾语，“听”保留原词的听觉意象，同时在语境中自然包含听从之意。
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: 这些话
  rationale: 对应先知所传达的话语，直接而自然。
- source_word: בִּי נִשְׁבַּעְתִּי
  choice: 我就指着自己起誓
  rationale: 这是神圣誓言的惯用表达；“指着自己”准确传达 בִּי，“起誓”体现完成式在直接宣告中所具有的郑重、施行性语气。
- source_word: נְאֻם יְהוָה
  choice: 这是雅威的宣告
  rationale: 保留先知宣告公式的正式语体，并按项目惯例将神名译作“雅威”。
- source_word: לְחָרְבָּה
  choice: 成为废墟
  rationale: חָרְבָּה表示荒废、毁坏后的状态；“成为废墟”在汉语中自然，并清楚表达结果。
- source_word: הַבַּיִת הַזֶּה
  choice: 这座房屋
  rationale: 保留原文“房屋”的词义，不在正文中直接解释为王宫；量词“座”符合建筑物语境。
theological_decisions:
- issue: 神以自己起誓的公式
  choice: 我就指着自己起誓
  alternative: 我已经指着自己起誓
  rationale: 希伯来语完成式在神直接发出的誓言中可有施行性。正文采用自然、即时的汉语表达，同时不削弱誓言的庄严性。
- issue: “这座房屋”的所指
  choice: 这座房屋
  alternative: 这座王宫
  rationale: 上下文指向犹大王的宫室，但原文使用一般名词 בַּיִת。正文保留其词汇开放性，脚注说明语境中很可能特指王宫。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“这是雅威的宣告”保留先知公式的正式感；破折号和冒号帮助呈现誓言公式与其内容之间的结构。正文保留“房屋”的字面表达，并以脚注交代“王宫”的语境可能性。
