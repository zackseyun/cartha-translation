  text: כִּ֤י אִם עָשׂוֹ֙ תַּֽעֲשׂ֔וּ אֶת הַ/דָּבָ֖ר הַ/זֶּ֑ה וּ/בָ֣אוּ בְ/שַׁעֲרֵ֣י הַ/בַּ֣יִת הַ/זֶּ֡ה מְלָכִים֩ יֹשְׁבִ֨ים לְ/דָוִ֜ד עַל כִּסְא֗/וֹ רֹֽכְבִים֙ בָּ/רֶ֣כֶב וּ/בַ/סּוּסִ֔ים ה֥וּא ו/עבד/ו וְ/עַמּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/022/004.yaml
  text: For if you truly do this thing[a], then kings sitting on David’s throne will enter through the gates of this house, riding in chariots and on horses—he, his servants[b], and his people.
translation:
  language: zh_hans
  text: 因为你们若切实遵行这事[a]，坐在大卫宝座上的君王必乘着战车和马匹，连同各自的臣仆和百姓[b]，从这宫的各门进入。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “这事”也可译作“这话”或“这件事”。希伯来语 דָּבָר 可指话、事情或事项。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译为“他和他的臣仆、百姓”。前面虽说“君王”，这里却用单数代词，是逐一指每一位君王。
    reason: source_number_ambiguity
lexical_decisions:
- source_word: כִּי אִם
  choice: 因为……若
  rationale: 承接上文并引出带有应许结果的条件句；既保留 כִּי 的逻辑联系，也自然表达 אִם 的条件义。
- source_word: עָשׂוֹ תַּעֲשׂוּ
  choice: 切实遵行
  rationale: 不定式绝对式与限定动词连用以加强语气。“切实”传达强调，“遵行”符合所指向的命令性行动。
- source_word: הַדָּבָר הַזֶּה
  choice: 这事
  rationale: דָּבָר 可指话、事情或事项；此处回指上文要求实行的事，因此正文用自然且宽泛的“这事”，并以脚注保留词义范围。
- source_word: וּבָאוּ בְשַׁעֲרֵי הַבַּיִת הַזֶּה
  choice: 就必有……从这宫的各门进入
  rationale: וּבָאוּ 在条件结果中表达将发生的进入；בְשַׁעֲרֵי 表示经由各门。“宫”依上下文指王宫，比孤立的“房屋”自然，同时不增加原文没有的专名。
- source_word: מְלָכִים יֹשְׁבִים לְדָוִד עַל כִּסְאוֹ
  choice: 坐大卫宝座的君王
  rationale: 保留大卫王位及其继承者的王朝表达，不扩写为“大卫后裔”，也不把经文本身未明说的弥赛亚解释写入正文。
- source_word: רֹכְבִים בָּרֶכֶב וּבַסּוּסִים
  choice: 乘着战车和马匹
  rationale: 符合王室出行的场景；רֶכֶב 在此可作集合性用语，中文用“战车和马匹”自然表达。
- source_word: הוּא וַעֲבָדָיו וְעַמּוֹ
  choice: 他和他的臣仆、百姓
  rationale: 按马所拉文本保留单数代词，并将其理解为承接复数“君王”的逐一分配用法；脚注说明数的一致关系，避免静默改成复数。
theological_decisions:
- issue: “坐大卫宝座的君王”的王朝应许语言
  choice: 译作“坐大卫宝座的君王”，保留持续的大卫王朝继承含义
  alternative: 译作“大卫后裔中的君王”，或直接作弥赛亚化表述
  rationale: 本节直接语境是顺服与大卫王朝延续之间的条件性关系。译文不排除更广的正典意义，但不把后来的神学解释强加于本节措辞。
- issue: 条件句与结果句的力度
  choice: “若切实遵行……就必有……”
  alternative: 弱化为一般可能性：“如果……就会有……”
  rationale: 原文以强调式动词表达条件，并以完成时连接所保证的结果；“就必有”体现应许的确定性，同时保留其条件性质。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“切实遵行”传达希伯来语加强结构；“这宫”依耶利米书22章的王宫语境处理。标点调整语序，使“他和他的臣仆、百姓”明确属于进入者，同时尽量保留原文单复数张力。
