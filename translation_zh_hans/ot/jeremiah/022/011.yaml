base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/022/011.yaml
  text: 'For thus says Yahweh concerning Shallum son of Josiah[a], king of Judah, who reigned in place of Josiah his father, who went out from this place: He shall never return there again.'
translation:
  language: zh_hans
  text: 因为雅威论到约西亚的儿子沙龙，就是接替他父亲约西亚作犹大王、离开这地方的那一位，如此说：“他必不再回到那里。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי כֹה אָמַר
  choice: 因为……如此说
  rationale: כִּי承接上文，说明前述宣告的根据，译作“因为”；כֹה אָמַר保留先知宣告的固定格式“如此说”。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见音译呈现四字神名，保留其专名性质，不以称号替代。
- source_word: אֶל
  choice: 论到
  rationale: 在宣告公式后接人物名时，此处自然理解为引出神谕所针对的对象；“论到”既符合汉语，也不将整句话处理成直接对沙龙讲话。
- source_word: שַׁלֻּם בֶּן יֹאשִׁיָּהוּ
  choice: 约西亚的儿子沙龙
  rationale: 按现代中文圣经人名惯例音译，并保留父子关系。
- source_word: מֶלֶךְ יְהוּדָה הַמֹּלֵךְ תַּחַת יֹאשִׁיָּהוּ אָבִיו
  choice: 他接替父亲约西亚作犹大王
  rationale: תַּחַת表示代替某人居其位；“接替……作王”准确表达王位承继，并使现代汉语顺畅。
- source_word: אֲשֶׁר יָצָא מִן הַמָּקוֹם הַזֶּה
  choice: 后来离开了这地方
  rationale: יָצָא מִן字面为“从……出去”；此处说沙龙离开本地，“离开了”是自然而准确的现代汉语。“后来”只显明关系从句中事件的推进，不改变事件内容。
- source_word: לֹא יָשׁוּב שָׁם עוֹד
  choice: 他必不再回到这里
  rationale: 否定式与עוֹד共同表达此后不再返回；“必不再”保留预言的确定语气。汉语以“这里”顺应说话者以“这地方”为参照的视角。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文使用神的专名；“雅威”按较通行的学术重构音译，保留专名而不改译为“主”。
- issue: אֶל所引出的关系
  choice: 论到沙龙
  alternative: 对沙龙说
  rationale: 两种句法理解在希伯来语中均有可能；上下文更像引出关于沙龙的神谕，因此正文采用“论到”，并以脚注保存直接受话者的可能性。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。以破折号界定较长的身份说明，避免多重关系从句造成歧义；神谕正文用引号标示。
