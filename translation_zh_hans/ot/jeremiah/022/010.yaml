base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/022/010.yaml
  text: Do not weep for the dead[a], and do not mourn for him. Weep bitterly for the one going away[b], for he will never return or see the land of his birth.
translation:
  language: zh_hans
  text: 不要为死人哭泣，也不要为他哀悼；却要为那离去的人痛哭[a]，因为他必不再回来，也再看不见自己的故乡[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “痛哭”直译为“哭，务要哭”；希伯来文用命令式配合绝对不定式加强语气。
    reason: lexical_alternative
  - marker: b
    text: “故乡”原文为“他出生之地”；按上下文，那离去的人指被掳离国的君王。
    reason: cultural_note
lexical_decisions:
- source_word: תִּבְכּוּ
  choice: 哭泣
  rationale: בכה通常指哭泣；此处用于庄重的哀歌语境，“哭泣”自然且准确。
- source_word: לְמֵת
  choice: 为死人
  rationale: מֵת是单数形式，可指特定的死者；结合上下文，此处译作“死人”简洁，并保留原文与“离去的人”的对照。
- source_word: תָּנֻדוּ לוֹ
  choice: 为他哀悼
  rationale: נוד在丧悼语境中可指表示哀伤、慰唁或作出哀恸姿态；“哀悼”传达其语境意义而不限定具体动作。
- source_word: בְּכוּ בָכוֹ
  choice: 痛哭
  rationale: 命令式加独立不定式构成强调；“痛哭”以自然汉语表达强烈、恳切地哭泣。
- source_word: לַהֹלֵךְ
  choice: 为那离去的人
  rationale: 该表达直译为“那走去的人”；“离去的人”保留动作意象，未在正文中提前解释为被掳或流亡。
- source_word: לֹא יָשׁוּב עוֹד
  choice: 必不再回来
  rationale: עוֹד与否定式连用表示不再发生；“必不再回来”自然地传达永久不能返回的语气。
- source_word: וְרָאָה
  choice: 也再看不见
  rationale: 此动词由前面的否定支配，表示另一项不会实现的事；汉语以“也再看不见”清楚承接否定。
- source_word: אֶרֶץ מוֹלַדְתּוֹ
  choice: 自己的故乡
  rationale: מוֹלֶדֶת指出生地或本乡本土；“故乡”是现代汉语中自然庄重的表达，并包含出生和本土的含义。
theological_decisions:
- issue: “死人”与“离去的人”的身份
  choice: 正文不点明具体君王，仅保留两者的对照
  alternative: 将“离去的人”直接译为“被掳流亡的人”或注明具体君王
  rationale: 原句本身只说“死者”和“离去者”；具体所指由上下文确定。为保留原文表达的含蓄性，身份说明置于脚注。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。以“却要”突出不可为死者哭、反要为离去者哭的鲜明对照；保留“离去的人”这一含蓄说法，并以脚注交代流亡背景。
