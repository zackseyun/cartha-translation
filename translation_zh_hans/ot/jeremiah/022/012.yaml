  text: כִּ֗י בִּ/מְק֛וֹם אֲשֶׁר הִגְל֥וּ אֹת֖/וֹ שָׁ֣ם יָמ֑וּת וְ/אֶת הָ/אָ֥רֶץ הַ/זֹּ֖את לֹֽא יִרְאֶ֥ה עֽוֹד־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/022/012.yaml
  text: For in the place where they have exiled him[a], there he will die, and he will never see this land again.
translation:
  language: zh_hans
  text: 因为他们把他流放到哪里[a]，他必死在那里，再也见不到这地。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “流放”也可译作“掳走”或“带去流亡”。希伯来文这个动词特指使人离开故土、进入流亡。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，为为何应当为被掳离去者哀哭说明原因；现代汉语中“因为”清楚表达此处的解释关系。
- source_word: בִּמְקוֹם אֲשֶׁר
  choice: 到哪里
  rationale: 结合使役动词“掳走”的方向含义，以“把他掳到哪里”自然表达其被带往的地点；后面的“在那里”保留希伯来文地点的重复强调。
- source_word: הִגְלוּ אֹתוֹ
  choice: 他们把他掳到
  rationale: גלה 的使役形表示使某人离乡、流亡；“掳到”既体现强制迁移，也保留复数不定主语“他们”。脚注列出更明确的“流放”译法。
- source_word: שָׁם
  choice: 在那里
  rationale: 保留原文对地点的重复强调：被掳去的地方正是他将死之处。
- source_word: יָמוּת
  choice: 他就要死
  rationale: 以现代汉语自然表达未完成式在预言语境中的将来含义。
- source_word: וְאֶת־הָאָרֶץ הַזֹּאת
  choice: 这地
  rationale: 此处指犹大故土，并非泛指大地；“这地”简洁且符合圣经叙事语境。
- source_word: לֹא יִרְאֶה עוֹד
  choice: 再也见不到
  rationale: 自然传达否定词与 עוֹד 结合所表达的永久终止和不可返回。
