  text: שׁ֚וּבוּ בָּנִ֣ים שׁוֹבָבִ֔ים אֶרְפָּ֖ה מְשׁוּבֹֽתֵי/כֶ֑ם הִנְ/נוּ֙ אָתָ֣נוּ לָ֔/ךְ כִּ֥י אַתָּ֖ה יְהֹוָ֥ה אֱלֹהֵֽי/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/003/022.yaml
  text: Return[a], O backsliding children; I will heal your backslidings. Behold, we come to you[b], for you are Yahweh our God.
translation:
  language: zh_hans
  text: “回转吧，背道的儿女！[a] 我要医治你们的背道。[b] 看哪，我们来到你这里，因为你是耶和华——我们的上帝。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “背道的”也可译作“任性偏离的”或“不忠的”。原文的“回转”和“背道的”出自相关词根，形成“转回”与“转离”的呼应。
    reason: 说明 שׁוּבוּ 与 שׁוֹבָבִים 的词根关联和可选译法。
  - marker: b
    text: “背道”也可译作“转离”或“背离”。原文为复数，指他们多次或多方面的转离；其词根与前面的“回转”和“背道的”相关。
    reason: 说明 מְשׁוּבֹתֵיכֶם 的词义、复数形式及全节的词根呼应，不添加原文没有的“病”。
lexical_decisions:
- source_word: שׁוּבוּ
  choice: 回转吧
  rationale: 这是复数命令式，呼召百姓转身归向耶和华；“回转”既保留方向性的动作，也包含关系上的归回，不把意思局限为内心懊悔。
- source_word: בָּנִים שׁוֹבָבִים
  choice: 背道的儿女
  rationale: בָּנִים 在这里是对圣约群体的集体称呼，“儿女”符合现代汉语用法；שׁוֹבָבִים 指离开正道、转离上帝的人，译作“背道”并保留先知话语的分量。
- source_word: אֶרְפָּה
  choice: 我要医治
  rationale: רפא 的基本义是“医治”。直译保留以疾病比喻属灵和关系破裂的具体意象。
- source_word: מְשׁוּבֹתֵיכֶם
  choice: 你们背道的病
  rationale: 该复数名词与“回转”和“背道”属于同一词根语义场，指转离、背道的行为或状态。汉语补出“病”，使“医治”的隐喻自然连贯；脚注保留较直译的表达。
- source_word: הִנְנוּ אָתָנוּ לָךְ
  choice: 看哪，我们来到你这里
  rationale: הִנְנוּ 表示“看哪／我们在这里”，随后动词表达来到对方那里；合译为即时而明确的回应，保留百姓转向上帝的动态。
- source_word: יְהֹוָה
  choice: 耶和华
  rationale: 原文直接使用四字神名；采用现代中文圣经读者熟悉的专名“耶和华”，而不以称号替代。
- source_word: אֱלֹהֵינוּ
  choice: 我们的上帝
  rationale: 准确表达第一人称复数所属关系及圣约性的认信。
theological_decisions:
- issue: “医治背道”究竟指赦免、改变还是复兴
  choice: 保留“医治”隐喻，不具体限定医治的方式
  alternative: 译成“我要使你们不再背道”
  rationale: 原文以医治来描述上帝对百姓背道状态的处理，可能涵盖赦免、纠正与复兴；不应在译文中缩窄为其中一项。
- issue: 对 בָּנִים 的性别与群体范围处理
  choice: 儿女
  alternative: 众子
  rationale: 该阳性复数在语境中集体指向被呼召归回的圣约百姓，并非只强调男性后裔；“儿女”在现代汉语中准确而自然。
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威／主
  rationale: 使用中文传统中广为人知的专名，明确保留原文的圣约神名，而非改作普通称号。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。用两组引号区分耶和华的呼召与百姓的回应；“回转”“背道”“医治”保留原文反复转向的语义关联及医疗隐喻。
