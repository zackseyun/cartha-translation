  source_fidelity: “你们背道的病”在译文正文中增添了原文没有的名词“病”。אֶרְפָּה（我必医治）本身已建立医疗隐喻，其宾语 מְשׁוּבֹתֵיכֶם 是“你们的背道／转离”，不应把该隐喻实体化为“病”。删去“病”可保留原文的有意张力和隐喻。其余主要内容——归回的命令、对背道者的称呼、医治的应许、以及百姓来到耶和华面前的回应——均与希伯来文相符。
  naturalness: “我要医治你们的背道”虽带有先知文学特有的隐喻性，却在庄重现代汉语中清楚自然，也比“医治你们背道的病”更简洁。将引语连贯呈现可避免原文未明示的过强断句，同时仍可通过语义看出后半是群体的回应。
