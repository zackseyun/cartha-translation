  text: שׁ֣וּבוּ בָנִ֤ים שׁוֹבָבִים֙ נְאֻם יְהוָ֔ה כִּ֥י אָנֹכִ֖י בָּעַ֣לְתִּי בָ/כֶ֑ם וְ/לָקַחְתִּ֨י אֶתְ/כֶ֜ם אֶחָ֣ד מֵ/עִ֗יר וּ/שְׁנַ֨יִם֙ מִ/מִּשְׁפָּחָ֔ה וְ/הֵבֵאתִ֥י אֶתְ/כֶ֖ם צִיּֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/003/014.yaml
  text: Return[a], O faithless children, declares Yahweh, for I am your master; and I will take you, one from a city and two from a clan, and I will bring you to Zion.
translation:
  language: zh_hans
  text: 雅威宣告：“背道的儿女啊，回转吧！因为我是你们的主[a]；我要从一城取一人，从一宗族取二人，把你们带到锡安。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我是你们的丈夫”，或“我娶了你们为妻”。希伯来语动词既可表示作主，也可表示婚姻关系。
    reason: 保留בָּעַלְתִּי的主权义与婚姻义双关，避免由正文单独确定其含义。
lexical_decisions:
- source_word: שׁוּבוּ
  choice: 回转吧
  rationale: 保留 שוב 所表达的归回意象，既可指方向上的返回，也包含重归雅威及盟约关系之意；比直接译作“悔改”少一层解释。
- source_word: בָנִים שׁוֹבָבִים
  choice: 背道的儿女
  rationale: בנים 在此指作为雅威子民的群体，现代汉语以“儿女”自然涵盖整体；שובבים 指离正道而去、对盟约不忠，“背道”兼顾其动态意象和属灵关系。
- source_word: נְאֻם יְהוָה
  choice: 雅威宣告
  rationale: 采用庄重而自然的先知宣告公式，并以“雅威”呈现四字神名。
- source_word: כִּי אָנֹכִי בָּעַלְתִּי בָכֶם
  choice: 因为我是你们的主
  rationale: בעל 可表达作主、掌权，也可表达婚姻关系。正文用“主”保留权柄含义，婚姻含义则列入脚注，以免消除原文的双重意味。
- source_word: וְלָקַחְתִּי אֶתְכֶם
  choice: 我要把你们领来
  rationale: לקח 基本义为“取、带领”。结合下文从各地聚集并带到锡安的图景，“领来”在汉语中比生硬的“取你们”自然，同时仍保留主动招聚之意。
- source_word: אֶחָד מֵעִיר וּשְׁנַיִם מִמִּשְׁפָּחָה
  choice: 从一座城领一个，从一个宗族领两个
  rationale: 不擅自加入原文未明说的“每”；משפחה 在此较可能指扩大的亲属群体，故译作“宗族”而非现代核心家庭意义的“家庭”。
- source_word: וְהֵבֵאתִי אֶתְכֶם צִיּוֹן
  choice: 我要把你们带到锡安
  rationale: 按 בוא 的使役形式和目的地结构自然译为“带到锡安”，保留锡安作为具体地点及其神学意涵。
theological_decisions:
- issue: בָּעַלְתִּי 的主权含义与婚姻含义
  choice: 正文译作“我是你们的主”，脚注注明“我是你们的丈夫”或“我娶了你们”
  alternative: 正文直接译作“我是你们的丈夫”或“我娶了你们”
  rationale: 该动词在希伯来语中可同时涉及作主和婚姻关系，本章上下文也有婚姻意象。正文突出权柄含义，脚注保留婚姻含义，使原文的神学张力不被单一化。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。引语按中文标点分层处理；“回转”“背道”“宗族”“锡安”兼顾经文语体与当代可读性。
