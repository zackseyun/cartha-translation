source:
  edition: WLC
  text: שְׂאִֽי עֵינַ֨יִ/ךְ עַל שְׁפָיִ֜ם וּ/רְאִ֗י אֵיפֹה֙ לֹ֣א שגלת עַל דְּרָכִים֙ יָשַׁ֣בְתְּ לָ/הֶ֔ם כַּ/עֲרָבִ֖י בַּ/מִּדְבָּ֑ר וַ/תַּחֲנִ֣יפִי אֶ֔רֶץ בִּ/זְנוּתַ֖יִ/ךְ וּ/בְ/רָעָתֵֽ/ךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/003/002.yaml
  text: 'Lift up your eyes to the bare heights and see: where have you not been lain with? By the roads you sat waiting for them[a], like an Arab in the wilderness[b], and you have polluted the land with your prostitution and with your wickedness.'
translation:
  language: zh_hans
  text: 你举目望向光秃秃的高地，看看吧：哪里没有人与你交合过？你坐在路旁等候他们[a]，像旷野中的阿拉伯人[b]；你以你的淫行和邪恶玷污了这地。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “等候他们”直译为“为他们坐着”，意思是在路旁坐候他们。
    reason: 说明原文简略表达中由语境补出的含义。
  - marker: b
    text: “像旷野中的阿拉伯人”可能是指在荒野道路旁守候、伺机而动的人；比喻的重点是刻意守候，并非针对某一族群。
    reason: 交代古代旷野行旅背景，避免把比喻误解为族群评价。
lexical_decisions:
- source_word: שְׂאִי עֵינַיִךְ
  choice: 你举目
  rationale: 这是“举起眼睛”的自然汉语表达，保留阴性单数命令所针对的拟人化对象。
- source_word: עַל שְׁפָיִם
  choice: 望向光秃的高处
  rationale: שְׁפָיִם 指无树、裸露的高地；此译既保留地貌，也不直接把它解释成宗教性的“邱坛”。
- source_word: וּרְאִי
  choice: 看看吧
  rationale: 保留命令语气，并使先知的反诘在现代汉语中自然有力。
- source_word: אֵיפֹה לֹא שגלת
  choice: 哪里没有人与你交合？
  rationale: שׁגל 是粗直的性交用语；采用直接但不额外引入强迫含义的表达，并保留希伯来文的被动结构所呈现的受事视角。
- source_word: עַל דְּרָכִים יָשַׁבְתְּ לָהֶם
  choice: 你坐在路旁等候他们
  rationale: לָהֶם 在此语境表示以坐候的方式等他们；补出“等候”使现代汉语意思完整。
- source_word: כַּעֲרָבִי בַּמִּדְבָּר
  choice: 像旷野中的阿拉伯人
  rationale: עֲרָבִי 通常指阿拉伯人或沙漠居民；正文保留直接词义，脚注说明比喻所着重的是在荒野道路旁伺机守候。
- source_word: וַתַּחֲנִיפִי אֶרֶץ
  choice: 你……玷污了这地
  rationale: חנף 的使役形在此指使土地受到道德和礼仪性的污染；“玷污”符合先知文体。
- source_word: בִּזְנוּתַיִךְ
  choice: 以你的卖淫
  rationale: זְנוּת 保留鲜明的性交易意象，在本节中也承载对盟约不忠的比喻。
- source_word: וּבְרָעָתֵךְ
  choice: 和邪恶
  rationale: רָעָה 是概括性的道德恶；“邪恶”保留其广泛而严肃的谴责意味。
theological_decisions:
- issue: 以性行为比喻盟约不忠
  choice: 正文保留“交合”和“卖淫”等性意象
  alternative: 直接译为“拜偶像”或“背叛上帝”
  rationale: 原文有意使用尖锐、令人不适的性语言谴责犹大的不忠；若直接改写成偶像崇拜，会削弱先知修辞并消除原文张力。
- issue: שגל 是否含有强迫或侵犯之意
  choice: 译为“有人与你交合”
  alternative: 译为“你遭人蹂躏”或“你被侵犯”
  rationale: 该词粗俗而贬抑，但本身并不明确表达强迫；上下文又说她主动坐候，因此不把原文未明说的性暴力含义加入正文。
translation_notes:
  register: 采用庄重而可懂的现代标准汉语。保留先知原文刺耳的性比喻，但避免用“被侵犯”等词额外加入强迫意味；标点强化命令、反问与结论之间的推进。
