  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: לֵ/אמֹ֡ר הֵ֣ן יְשַׁלַּ֣ח אִ֣ישׁ אֶת אִשְׁתּ/וֹ֩ וְ/הָלְכָ֨ה מֵ/אִתּ֜/וֹ וְ/הָיְתָ֣ה לְ/אִישׁ אַחֵ֗ר הֲ/יָשׁ֤וּב אֵלֶ֨י/הָ֙ ע֔וֹד הֲ/ל֛וֹא חָנ֥וֹף תֶּחֱנַ֖ף הָ/אָ֣רֶץ הַ/הִ֑יא וְ/אַ֗תְּ זָנִית֙ רֵעִ֣ים רַבִּ֔ים וְ/שׁ֥וֹב אֵלַ֖/י נְאֻם יְהֹוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/003/001.yaml
  text: It is said[a], ‘If a man sends away his wife, and she goes from him and becomes another man’s, will he return to her again? Would not that land be utterly polluted? But you have prostituted yourself with many lovers[b], and would you return to me?’ declares Yahweh.
translation:
  language: zh_hans
  text: 有人说：“一个人若休了妻子，她离开他，归了另一个男人[a]，他还能再回到她那里吗？那片土地岂不就彻底被玷污了吗？可是，你却与许多情人行淫，还要回到我这里吗？[b]”这是耶和华的宣告。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“成为另一个男人的”，意思是成为另一个男人的妻子。
    reason: lexical_alternative
  - marker: b
    text: 本句也可译作：“然而，你要回到我这里来。”即把末句理解为命令式的邀请，而不是反问。
    reason: alternative_reading
lexical_decisions:
- source_word: לֵאמֹר
  choice: 有人说
  rationale: 该不定式在这里引出一个带有法律色彩的假设性说法；译为“有人说”既保留其引述功能，也符合现代汉语表达。
- source_word: הֵן
  choice: 若
  rationale: 这里不是单纯的“看哪”，而是引出法律性的假设情形；“若”简洁而庄重。
- source_word: יְשַׁלַּח ... אֶת אִשְׁתּוֹ
  choice: 休了妻子
  rationale: 在婚姻语境中，שׁלח 指把妻子遣走，即休妻。“休了妻子”既表达法律含义，又保留原文“送走”的背景。
- source_word: וְהָלְכָה מֵאִתּוֹ
  choice: 她离开他
  rationale: 直接表达原文的移动和关系断离，现代读者容易理解。
- source_word: וְהָיְתָה לְאִישׁ אַחֵר
  choice: 归了另一个男人
  rationale: 原文是省略式表达，字面近于“成为另一个男人的”；“归了另一个男人”自然地传达她成为另一男子之妻的意思，同时用脚注说明原文形式。
- source_word: הֲיָשׁוּב אֵלֶיהָ עוֹד
  choice: 他还能再回到她那里吗
  rationale: 保留 שׁוב“返回”的用词及反问语气，也呈现与后半节“回到我这里”的呼应。
- source_word: הֲלוֹא חָנוֹף תֶּחֱנַף הָאָרֶץ הַהִיא
  choice: 那片土地岂不就彻底被玷污了吗
  rationale: 原文以不定式绝对形配合限定动词加强语气；“彻底被玷污”表达这种强烈的污秽、亵渎含义。
- source_word: וְאַתְּ זָנִית
  choice: 可是，你却……行淫
  rationale: זנה 在先知性言论中以性不忠比喻盟约不忠。“行淫”保持原文尖锐的控诉力度，又属于庄重、通行的圣经汉语。
- source_word: רֵעִים רַבִּים
  choice: 许多情人
  rationale: רֵעִים 通常可指朋友或同伴，但在 זנה 所形成的性与婚姻隐喻中，“情人”最能表达语境含义。
- source_word: וְשׁוֹב אֵלַי
  choice: 还要回到我这里吗
  rationale: 将其理解为承接前文的一连串反问，保留震惊和责问的语气；同时以脚注注明也可读作命令式邀请。
- source_word: נְאֻם יְהוָה
  choice: 这是耶和华的宣告
  rationale: 采用庄重而自然的先知宣告格式，明确保留原文公式化表达。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代简体中文圣经传统中通行的专名表达四字神名。
theological_decisions:
- issue: וְשׁוֹב אֵלַי 应理解为命令式邀请，还是延续上文的反问
  choice: 反问：“还要回到我这里吗？”
  alternative: 命令式邀请：“然而，你要回到我这里来。”
  rationale: 紧接申命记式休妻比喻的一连串反问，将此句译作反问最符合眼前的句法和控诉走势；但命令式读法在形态和语境上仍有可能，并带出意外的恩典邀请，因此在脚注中保留，不将神学张力消除。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以“若”“岂不”“宣告”维持先知话语和法律假设的庄严感，同时避免过度古雅；“行淫”保留原文刻意尖锐的婚姻与盟约不忠隐喻。
