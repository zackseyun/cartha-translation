base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/003/015.yaml
  text: And I will give you shepherds after my own heart[c][b][a], and they will shepherd you with knowledge and understanding.
translation:
  language: zh_hans
  text: 我必赐给你们合我心意[a]的牧人[b]；他们必以知识和洞见[c]牧养你们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“按照我的心”，意思是符合上帝自己的心意或旨意。
    reason: lexical_alternative
  - marker: b
    text: “牧人”也可译作“牧者”；原文采用照管羊群的比喻，泛指照管上帝子民的人，并不特指后来的某一种教会职分。
    reason: lexical_alternative
  - marker: c
    text: “洞见”也可译作“悟性”或“见识”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי
  choice: 我必赐给
  rationale: 该形式在先知应许语境中表达将来的确定行动；“必”体现应许的确定性，“赐给”自然表达给予。句首连接词不机械译作“并且”，以符合现代汉语篇章衔接。
- source_word: לָכֶם
  choice: 你们
  rationale: 介词加第二人称复数后缀，作间接宾语；汉语“赐给你们”直接而自然。
- source_word: רֹעִים
  choice: 牧人
  rationale: 保留 רעה 的牧羊隐喻，并避免用“牧师”把后来的特定教会职分带入经文；在本语境中指上帝赐下、照管其子民的领袖。
- source_word: כְּלִבִּי
  choice: 合我心意
  rationale: 希伯来语字面为“按照我的心”，表示符合上帝的心意、旨意；“合我心意”是自然且庄重的现代汉语，同时保留“心”的意象。
- source_word: וְרָעוּ
  choice: 牧养
  rationale: 该动词可指放牧、照料或喂养；“牧养”延续前面的牧人隐喻，又不把意义缩窄为单纯喂食。
- source_word: אֶתְכֶם
  choice: 你们
  rationale: 直接宾语标记加第二人称复数后缀，直译为“你们”。
- source_word: דֵּעָה
  choice: 知识
  rationale: 该名词通常表示知识；与后一词区分翻译，保留两个并列概念。
- source_word: וְהַשְׂכֵּיל
  choice: 和洞见
  rationale: 此处表达明辨、通达或有见识；“洞见”与“知识”搭配自然，也保留其侧重深入理解和明智判断的含义。
theological_decisions:
- issue: 所应许之牧人的身份与性质
  choice: 以“牧人”指上帝所赐、负责照管其子民的人间领袖
  alternative: 译作特指教会职分的“牧师”，或更狭义地限定为君王、统治者
  rationale: 耶利米书语境中的牧人比后来的特定教会职分更宽泛。保留牧羊隐喻，既符合原文，也不预先限定这些领袖的制度性身份。
- issue: “合我心意”的含义
  choice: 这些领袖符合上帝的心意和旨意
  alternative: 仅理解为这些领袖深受上帝喜爱
  rationale: כְּלִבִּי 的重点是与上帝的“心”相符，即依照他的意愿，而不只是表达情感上的喜爱。译文保留原文的心之意象，同时避免误解。
translation_notes:
  register: 采用现代、庄重而通顺的普通话。“我必赐给”体现应许语气；“牧人—牧养”保持原文反复出现的牧羊意象；“以知识和洞见”以简洁的方式表达牧养所凭借或呈现的智慧品质。
