source:
  edition: WLC
  text: וְ/אָנֹכִ֣י אָמַ֗רְתִּי אֵ֚יךְ אֲשִׁיתֵ֣/ךְ בַּ/בָּנִ֔ים וְ/אֶתֶּן לָ/ךְ֙ אֶ֣רֶץ חֶמְדָּ֔ה נַחֲלַ֥ת צְבִ֖י צִבְא֣וֹת גּוֹיִ֑ם וָ/אֹמַ֗ר אָבִ/י֙ תקראו לִ֔/י וּ/מֵ/אַחֲרַ֖/י לֹ֥א תשובו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/003/019.yaml
  text: And I said[a], ‘How I would set you among the sons and give you a desirable land, the most beautiful inheritance of the nations' armies.’ And I said, ‘You will call me[b], “My Father,” and you will not turn away from following me.’
translation:
  language: zh_hans
  text: 我曾说：“我该怎样把你安置在众子[a]之中，又赐给你一片令人喜爱的土地，就是列国中极其华美的产业[b]！”我又说：“你必称我为‘我的父亲’，不再转身离开我。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “众子”也可按广义理解为“儿女”或“孩子”；希伯来语字面作“儿子们”。
    reason: lexical_alternative
  - marker: b
    text: 这句希伯来语结构紧缩，修饰关系不易确定；也可译作“列国最华美的产业”。其中一个词可指“众军／万军”，但其在本句中的具体作用仍有争议。
    reason: alternative_reading
lexical_decisions:
- source_word: אֵיךְ
  choice: 我要怎样
  rationale: 保留希伯来语中商议式或感叹式问句的语气；上下文表达上帝原先对以色列的心意，而不把它明确限定为疑问、不能实现或单纯感叹。
- source_word: אֲשִׁיתֵךְ בַּבָּנִים
  choice: 把你列在众儿子之中
  rationale: שׁית意为“安置、列入”；בנים字面为“儿子们”。译文保留阴性单数受话者与阳性复数“儿子”之间刻意形成的亲子身份意象。
- source_word: אֶרֶץ חֶמְדָּה
  choice: 一片可喜爱之地
  rationale: חמדה包含可喜爱、令人向往、珍贵之意；“可喜爱之地”既保留其语义，也符合庄重的约土语境。
- source_word: נַחֲלַת צְבִי צִבְאוֹת גּוֹיִם
  choice: 列国中极其华美的产业
  rationale: 该短语结构紧缩且释义有争议。נחלה为“产业”，צבי可指华美、荣耀；צבאות גוים可理解为列国的群体或众多列国。正文采用通顺而不过度具体化的表达，并以脚注保留字面结构及其他可能理解。
- source_word: אָבִי תקראו לִי
  choice: 你必称我为“我的父”
  rationale: קרא与ל连用可表示呼叫或称呼；在亲子语境中，理解为直接称上帝为父最自然。“我的父”保留אָבִי的第一人称领属形式。
- source_word: וּמֵאַחֲרַי לֹא תשובו
  choice: 不再转离我
  rationale: “从我后面转回”是停止跟随的方向性表达；“转离我”在现代汉语中自然，也保留背离的意象。
theological_decisions:
- issue: בַּבָּנִים的性别化亲子用语
  choice: 众儿子之中
  alternative: 众儿女之中／众孩子之中
  rationale: 原文使用阳性复数“儿子”，而受话者为阴性单数，重点在于她被赋予儿子的家族身份和产业地位。正文保留原文性别形式，脚注说明其广义可指儿女。
- issue: נַחֲלַת צְבִי צִבְאוֹת גּוֹיִם的解释
  choice: 列国中极其华美的产业
  alternative: 列国众军中一份华美的产业／列国最壮美的基业
  rationale: 原文在句法和词义上都高度凝缩。正文呈现“产业”“华美”“列国”等核心成分，但不把צבאות狭义定为军事性的“军队”；脚注保留较字面的可能读法。
- issue: 应许中亲子关系的称谓
  choice: 我的父
  alternative: 父啊
  rationale: אָבִי字面是“我的父”。采用领属形式可保存原文，同时不额外引入特定宗派对这一关系的系统化解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“我要怎样”刻意保留原文既像商议又像感叹的张力；“产业”延续土地作为承受之业的圣经语域。正文引号与脚注标记均按简体中文出版习惯处理。
