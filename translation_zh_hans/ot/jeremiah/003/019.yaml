revisions:
- from: 我曾说：“我要怎样把你列在众儿子[a]之中，赐给你一片可喜爱之地，就是列国中极其华美的产业[b]！”我又说：“你必称我为‘我的父’，不再转离我。”
  to: 我曾说：“我该怎样把你安置在众子[a]之中，又赐给你一片令人喜爱的土地，就是列国中极其华美的产业[b]！”我又说：“你必称我为‘我的父亲’，不再转身离开我。”
  rationale: 修订使汉语更自然，并更贴近原文审思式句法和“安置”的动词义。保留“众子”的性别化形式及“产业、华美、列国”等关键成分；对困难短语仅在脚注说明可能的词义，不把有争议的“众军”解释强加为句子的确定结构。
