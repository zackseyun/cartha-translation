  text: וְ/הַ/בֹּ֗שֶׁת אָֽכְלָ֛ה אֶת יְגִ֥יעַ אֲבוֹתֵ֖י/נוּ מִ/נְּעוּרֵ֑י/נוּ אֶת צֹאנָ/ם֙ וְ/אֶת בְּקָרָ֔/ם אֶת בְּנֵי/הֶ֖ם וְ/אֶת בְּנוֹתֵי/הֶֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/003/024.yaml
  text: But shame has devoured the labor of our fathers from our youth—their flocks and their herds[a], their sons and their daughters.
translation:
  language: zh_hans
  text: 然而，自我们年幼以来，羞耻[a]吞噬了我们祖先劳碌所得：他们的羊群和牛群，他们的儿子和女儿。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“那可耻之物”；这可能是对巴力或偶像崇拜的蔑称。
    reason: 保留הַבֹּשֶׁת作为人格化抽象名词或偶像蔑称的双重可能。
lexical_decisions:
- source_word: וְהַבֹּשֶׁת
  choice: 然而……那可耻之物
  rationale: בֹּשֶׁת本义为“羞耻”，在耶利米书中也可作为对巴力或偶像的蔑称。译作“那可耻之物”既保留其贬斥意味，也使其作为“吞吃”的主语在现代汉语中自然；“然而”按上下文表达וְ的转折承接作用。
- source_word: אָכְלָה
  choice: 吞吃了
  rationale: 保留אכל“吃”的鲜明比喻；此处以产业和儿女为宾语，表示吞噬、耗尽。
- source_word: יְגִיעַ
  choice: 劳碌所得的一切
  rationale: יְגִיעַ指劳苦所得或劳作成果；“劳碌所得的一切”既呈现劳苦，也能统摄后列的牲畜和儿女。
- source_word: אֲבוֹתֵינוּ
  choice: 我们的祖先
  rationale: 此处指以色列群体先前的世代；现代汉语用“祖先”比“父亲们”更自然，也不误解为仅指直接生父。
- source_word: מִנְּעוּרֵינוּ
  choice: 从我们年幼时起
  rationale: 直译时间起点，保留说话群体自幼以来的持续经历。
- source_word: צֹאנָם
  choice: 他们的羊群
  rationale: צֹאן是绵羊、山羊等小型牲畜的集合称谓；“羊群”简洁自然。
- source_word: בְּקָרָם
  choice: 牛群
  rationale: בָּקָר指牛类大型牲畜；与“羊群”形成自然对举。
- source_word: בְּנֵיהֶם וְאֶת־בְּנוֹתֵיהֶם
  choice: 他们的儿子和女儿
  rationale: 分别保留阳性与阴性名词，呈现原文刻意列举的完整范围。
theological_decisions:
- issue: הַבֹּשֶׁת可能借指巴力或偶像崇拜
  choice: 正文译为“那可耻之物”，不直接点明巴力
  alternative: “羞耻”或“巴力”
  rationale: 该词既可理解为人格化的羞耻，也可能是对巴力或偶像的蔑称。正文保留原文的贬称和指涉张力，脚注说明可能所指，避免把解释直接写入经文。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“吞吃”保留原文拟人化意象；冒号清楚引出“劳碌所得”的具体内容。
