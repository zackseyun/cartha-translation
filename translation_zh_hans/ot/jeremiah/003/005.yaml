  text: הֲ/יִנְטֹ֣ר לְ/עוֹלָ֔ם אִם יִשְׁמֹ֖ר לָ/נֶ֑צַח הִנֵּ֥ה דברתי וַ/תַּעֲשִׂ֥י הָ/רָע֖וֹת וַ/תּוּכָֽל־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/003/005.yaml
  text: Will he be angry forever? Will he keep it to the end? Look[a], you have spoken, and you have done evil things[c][b], and you have prevailed.
translation:
  language: zh_hans
  text: 他岂会永远怀着怒气？岂会一直怀着怒气？看哪[a]，你已经这样说了[b]，又做了那些恶事，并且得逞了[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译可作：“他岂会永远保留怒气？岂会永远守住怒气？”
    reason: lexical_alternative
  - marker: b
    text: 此处的希伯来文辅音也可读作“我已经说了”；马所拉传统读作“你已经说了”。本译按上下文理解为犹大所说的话。
    reason: textual_variant
  - marker: c
    text: 或译：“并且你有能力（这样做）。”此词也可指得胜或成功；这里可能指犹大一再行恶而且得以遂行。
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲיִנְטֹר לְעוֹלָם
  choice: 他岂会永远怀怒
  rationale: נטר在此指持续怀有怒气或怨愤；“怀怒”既保留“存留”的意味，也符合现代汉语反问句。
- source_word: אִם יִשְׁמֹר לָנֶצַח
  choice: 岂会一直存留怒气
  rationale: שׁמר本义为“守、保留”，此处承接上句所隐含的“怒气”；明说宾语使汉语清楚，同时保留与前句的平行。
- source_word: הִנֵּה
  choice: 看哪
  rationale: 作为引人注意的语篇标记，“看哪”庄重而易懂，也凸显下文对犹大的指控。
- source_word: דברתי
  choice: 你已经这样说了
  rationale: 无元音辅音文本可读作第一人称“我说了”，但马所拉读法及上下文支持阴性第二人称“你说了”，指犹大在前文所说的话；“这样”自然回指上文。
- source_word: וַתַּעֲשִׂי הָרָעוֹת
  choice: 又做了那些恶事
  rationale: 保留连接词的递进关系；定冠词及复数形式指向具体恶行，因此译作“那些恶事”。
- source_word: וַתּוּכָל
  choice: 并且得逞了
  rationale: יכל可指“能够”或“胜过、得逞”；在持续作恶的语境中，“得逞”传达其成功施行恶事的意味，同时脚注保留较直译的可能。
theological_decisions:
- issue: 指控句中说话者与受话者的转换
  choice: 末句继续直接对阴性单数的犹大说：“你已经这样说了……又做了……并且得逞了。”
  alternative: 将דברתי读作“我已经说了”，理解为耶和华的话。
  rationale: 前文正引述犹大的话，马所拉读法也支持第二人称阴性；此读法保留其言语与行为之间的张力，但不把辅音文本的另一可能性隐去。
- issue: 末词所表达的行为结果
  choice: 译作“得逞了”，表示犹大在所行恶事上达成了目的。
  alternative: 译作“你有能力”或“你仍能如此”。
  rationale: יכל本身兼有“能够”和“胜过、成功”的语义；上下文倾向成功施恶，但该词的开放性应在脚注中保留。
translation_notes:
  register: 采用现代、庄重而口语可懂的标准普通话。“岂会”保留连续反问的力度；“看哪”承接先知文学的郑重语气。“这样”回指上一节的话；“那些恶事”体现希伯来文定冠词和复数。
