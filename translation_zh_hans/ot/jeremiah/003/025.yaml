reference: Jeremiah 3:25
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: נִשְׁכְּבָ֣ה בְּ/בָשְׁתֵּ֗/נוּ וּֽ/תְכַסֵּ/נוּ֮ כְּלִמָּתֵ/נוּ֒ כִּי֩ לַ/יהוָ֨ה אֱלֹהֵ֜י/נוּ חָטָ֗אנוּ אֲנַ֨חְנוּ֙ וַ/אֲבוֹתֵ֔י/נוּ מִ/נְּעוּרֵ֖י/נוּ וְ/עַד הַ/יּ֣וֹם הַ/זֶּ֑ה וְ/לֹ֣א שָׁמַ֔עְנוּ בְּ/ק֖וֹל יְהֹוָ֥ה אֱלֹהֵֽי/נוּ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/003/025.yaml
  text: Let us lie down in our shame[a], and let our disgrace cover us, for we have sinned against Yahweh our God—we and our fathers—from our youth even to this day, and we have not obeyed the voice of Yahweh our God.
translation:
  language: zh_hans
  text: 让我们躺卧在自己的羞耻中，让我们的耻辱遮盖我们；因为我们和我们的父辈[a]，从幼年直到今日，都得罪了耶和华我们的上帝，也没有听从耶和华我们上帝的话。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“祖先”。希伯来文直译为“我们的父亲／父辈”。
    reason: lexical_alternative
lexical_decisions:
- source_word: נִשְׁכְּבָה
  choice: 让我们躺卧
  rationale: 该词是第一人称复数祈愿式，表达自愿伏卧、承受羞耻的意思；“让我们躺卧”保留其意愿语气和具体意象。
- source_word: בְּבָשְׁתֵּנוּ
  choice: 在自己的羞耻中
  rationale: 介词与名词共同表示所处的状态或境况；此译自然地表达他们被羞耻包围的处境。
- source_word: וּתְכַסֵּנוּ
  choice: 让……遮盖我们
  rationale: 未完成式在前一祈愿式的平行结构中带有祈愿意味，因此用“让”保留这种语气。
- source_word: כְּלִמָּתֵנוּ
  choice: 我们的耻辱
  rationale: 此词与前面的“羞耻”意义相近却不完全相同；“耻辱”既维持平行，也避免把两个希伯来词合并为同一中文词。
- source_word: לַיהוָה ... חָטָאנוּ
  choice: 得罪了耶和华
  rationale: חטא 与 ל 连用时可指向犯罪所冒犯的对象；中文“得罪”准确而自然。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的神名音译“耶和华”，而非以称号“主”代替专名。
- source_word: אֲנַחְנוּ וַאֲבוֹתֵינוּ
  choice: 我们和我们的祖先
  rationale: אָבוֹת 字面为“父辈”，在跨世代认罪的语境中指历代先人；“祖先”以自然中文表达其集体历史含义。
- source_word: מִנְּעוּרֵינוּ וְעַד הַיּוֹם הַזֶּה
  choice: 从幼年直到今日
  rationale: 保留从早期起延续至当下的时间跨度；“幼年”也容许指民族历史早期的集体隐喻。
- source_word: וְלֹא שָׁמַעְנוּ בְּקוֹל
  choice: 没有听从……的话
  rationale: “听声音”在此含有顺服之意；中文“听从……的话”兼顾习语含义与自然表达。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用四字神名而非称号；译文保留专名。中文传统音译“耶和华”最便于普通现代读者识别，同时不以“主”取代原文神名。
- issue: “从幼年”所指的是个人还是民族历史
  choice: 保留“从幼年”的原有意象，不在正文中明确解释
  alternative: 从我们民族的早期
  rationale: 原文可借人的幼年表达以色列民族早期，也可作为群体成员的概括性认罪；直译能保留这种张力。
- issue: אָבוֹתֵינוּ 的范围
  choice: 我们的祖先
  alternative: 我们的父辈
  rationale: 上下文是跨世代的集体认罪，“祖先”自然涵盖历代先人；这不是免除当代人的责任，因为正文仍明确说“我们和我们的祖先”。
translation_notes:
  register: 采用庄重而明白的现代标准普通话。“羞耻／耻辱”保留近义平行；分号划分受辱意象与认罪缘由。正文没有添加原文所无的神学解释。
