  text: אָכֵ֥ן לַ/שֶּׁ֛קֶר מִ/גְּבָע֖וֹת הָמ֣וֹן הָרִ֑ים אָכֵן֙ בַּ/יהֹוָ֣ה אֱלֹהֵ֔י/נוּ תְּשׁוּעַ֖ת יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/003/023.yaml
  text: Surely[a], from the hills comes only falsehood, the tumult on the mountains; surely in Yahweh our God is the salvation of Israel.
translation:
  language: zh_hans
  text: 诚然，来自山冈的只是虚假，群山上的喧嚷[a]也是虚假；诚然，以色列的拯救在雅威——我们的上帝——那里。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “喧嚷”也可译作“喧声”；希伯来文直译为“群山的喧嚷”。
    reason: 保留הָמוֹן的词义幅度，以及希伯来文简约构造关系所具有的歧义。
lexical_decisions:
- source_word: אָכֵן
  choice: 诚然
  rationale: 这是表示强调和确认的语篇词；两处均译为“诚然”，保留本节认信式的语气及平行结构。
- source_word: לַשֶּׁקֶר
  choice: 不过是虚假
  rationale: שֶׁקֶר指虚假、虚妄或欺骗；结合省略性的希伯来语句法，“不过是虚假”自然表达从山冈寻求帮助终属虚妄，同时不把经文未明说的对象直接译成“偶像”。
- source_word: מִגְּבָעוֹת
  choice: 从山冈而来的
  rationale: 保留介词所表达的来源及גְּבָעוֹת的山冈意象；这意象在耶利米书语境中可令人联想到山冈上的背道敬拜，但正文不将该含义明说。
- source_word: הָמוֹן הָרִים
  choice: 群山上的喧嚷
  rationale: הָמוֹן可指喧声、骚动、人群或众多；“喧嚷”适合此处可能涉及山上祭祀活动的语境，脚注保留“喧声”等可能译法。
- source_word: בַּיהוָה
  choice: 在于雅威
  rationale: 介词ב在此与前面的虚假来源构成对照，表示真正拯救之所在；“在于”比生硬的“在……里面”更符合现代汉语，又保留这一对照。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以常见的现代汉语音译呈现四字神名，而不以称号替代专名。
- source_word: אֱלֹהֵינוּ
  choice: 我们的上帝
  rationale: 直接保留第一人称复数所属关系和群体认信色彩。
- source_word: תְּשׁוּעַת יִשְׂרָאֵל
  choice: 以色列的拯救
  rationale: 按构造链直译，保留其可表示以色列所得或以色列所需之拯救的关系，不额外限定为政治、军事或属灵层面。
theological_decisions:
- issue: 山冈、群山与虚假敬拜的隐含联系
  choice: 将山冈所来的事物和群山上的喧嚷一并判为虚假，并与雅威所赐的真正拯救对照。
  alternative: 将הָמוֹן הָרִים理解为“群山之众多”，不突出山上敬拜的喧声。
  rationale: 耶利米书上下文常把山冈和群山与背道敬拜联系起来，但本节没有明说“偶像”或“邱坛”。译文保留意象和对照，不把语境推论直接写入正文。
- issue: 拯救与雅威的关系
  choice: 译作“拯救在于雅威我们的上帝”。
  alternative: 译作“拯救来自雅威我们的上帝”。
  rationale: “来自”突出来源，“在于”更贴近介词ב，同时可自然表达唯有雅威才是真正拯救之所在；不进一步界定拯救的方式或范围。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“也是如此”补足汉语所需的判断关系，使“群山上的喧嚷”明确承接“不过是虚假”，但没有增加新的神学对象。分号保留原文前后鲜明的真假对照。
