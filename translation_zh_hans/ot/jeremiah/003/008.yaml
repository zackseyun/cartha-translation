source:
  edition: WLC
  text: וָ/אֵ֗רֶא כִּ֤י עַל כָּל אֹדוֹת֙ אֲשֶׁ֤ר נִֽאֲפָה֙ מְשֻׁבָ֣ה יִשְׂרָאֵ֔ל שִׁלַּחְתִּ֕י/הָ וָ/אֶתֵּ֛ן אֶת סֵ֥פֶר כְּרִיתֻתֶ֖י/הָ אֵלֶ֑י/הָ וְ/לֹ֨א יָֽרְאָ֜ה בֹּֽגֵדָ֤ה יְהוּדָה֙ אֲחוֹתָ֔/הּ וַ/תֵּ֖לֶךְ וַ/תִּ֥זֶן גַּם הִֽיא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/003/008.yaml
  text: And I saw that because backsliding Israel had committed adultery in all these matters[a], I had sent her away and given her a certificate of divorce. Yet her treacherous sister Judah did not fear[c][b], but she too went and prostituted herself.
translation:
  language: zh_hans
  text: 我看见：因背道的以色列[a]所犯的一切奸淫，我把她休了，把休书[b]交给她；可是，她那背信的妹妹犹大并不惧怕，竟也去卖淫[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “背道的”也可译作“背离的”或“叛离的”；原文着重表示转身离去、离弃正道。
    reason: lexical_alternative
  - marker: b
    text: “休书”指正式解除婚姻关系的法律文书。
    reason: historical_legal_clarification
  - marker: c
    text: “卖淫”也可译作“行淫”或“去作娼妓”。这里延续全章的比喻，以性关系上的不忠描写对盟约的不忠。
    reason: metaphor_clarification
lexical_decisions:
- source_word: וָאֵרֶא
  choice: 我看见
  rationale: 保留第一人称叙述和“看见、察知”的直接表达，并自然承接上下文。
- source_word: כִּי עַל כָּל אֹדוֹת אֲשֶׁר
  choice: 因这一切事
  rationale: 原文结构紧缩，כִּי与עַל־כָּל־אֹדוֹת共同表达所见事实及其缘由；中文以“因这一切事”自然呈现因果和总体范围，不强行拆解为两个从句。
- source_word: נִאֲפָה
  choice: 犯了奸淫
  rationale: 保留本章以婚姻不忠描写背约的核心隐喻，不弱化为泛指的“不忠”。
- source_word: מְשֻׁבָה יִשְׂרָאֵל
  choice: 背道的以色列
  rationale: מְשֻׁבָה强调转离、背离；“背道”既保留这一语义，也能与本章“回转”的呼吁形成词义关联。
- source_word: שִׁלַּחְתִּיהָ
  choice: 把她休了
  rationale: 在婚姻和休书的语境中，此词指把妻子遣离、离弃；“休了”简洁保留古代婚姻法律语境，且与后文“休书”搭配自然。
- source_word: סֵפֶר כְּרִיתֻתֶיהָ
  choice: 休书
  rationale: 指正式解除婚姻关系的法律文书；“休书”是简明而广为理解的中文对应，并由脚注说明其法律性质。
- source_word: וְלֹא יָרְאָה
  choice: 并不惧怕
  rationale: 按字面保留ירא的“惧怕”，不将其限定解释为“没有引以为戒”；这样也保留其可能包含的敬畏与警戒意味。
- source_word: בֹּגֵדָה יְהוּדָה
  choice: 诡诈的……犹大
  rationale: בגד表示背信、行事诡诈；与形容以色列的מְשֻׁבָה区别翻译，保留原文刻意使用的不同指控。
- source_word: אֲחוֹתָהּ
  choice: 她那……妹妹
  rationale: 保留以色列和犹大被人格化为姐妹的比喻；按上下文关系译作“妹妹”自然明确。
- source_word: וַתֵּלֶךְ וַתִּזֶן
  choice: 竟也去行淫
  rationale: 保留הלך与זנה的连续动作及语势；“竟也”传达犹大见到以色列受罚后仍作同样选择的反衬，“行淫”延续全节的性与盟约不忠隐喻。
theological_decisions:
- issue: 是否保留以婚姻、奸淫和离婚描写盟约不忠的隐喻
  choice: 完整保留“犯奸淫—休了—休书—行淫”的意象链
  alternative: 改译为一般性的“不忠”“离弃”或直接解释为“拜偶像”
  rationale: 希伯来文本明确采用婚姻、性不忠和法律离婚的连贯意象。直接解释或弱化会削减先知责备的力度，并遮蔽本节内部的修辞联系。
- issue: 如何处理מְשֻׁבָה与בֹּגֵדָה的区别
  choice: 分别译为“背道的”和“诡诈的”
  alternative: 两者都译为“不忠的”或“背信的”
  rationale: 原文以不同词语描述以色列和犹大。区别翻译可保留“转离”与“背信诡诈”之间的语义差异，不把先知的措辞压平。
- issue: וְלֹא יָרְאָה所指的惧怕对象和含义
  choice: 译作“并不惧怕”，不补出对象
  alternative: 译作“并没有引以为戒”或“并不敬畏我”
  rationale: 原文没有明说惧怕谁，也可能兼有害怕惩罚、受到警戒和敬畏上帝等意味；保持简洁可保存这种开放性。
translation_notes:
  register: 采用现代、庄重而通顺的普通话。“背道”“休书”“行淫”略带经文语体，但在现代中文中仍可理解，并能准确维持原文的先知性控诉、婚姻隐喻和法律背景。句法以分号区分以色列受休与犹大仍不惧怕的对照，避免照搬希伯来语紧缩结构而造成中文晦涩。
