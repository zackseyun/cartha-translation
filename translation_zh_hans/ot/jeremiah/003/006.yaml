  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֵלַ֗/י בִּ/ימֵי֙ יֹאשִׁיָּ֣הוּ הַ/מֶּ֔לֶךְ הֲֽ/רָאִ֔יתָ אֲשֶׁ֥ר עָשְׂתָ֖ה מְשֻׁבָ֣ה יִשְׂרָאֵ֑ל הֹלְכָ֨ה הִ֜יא עַל כָּל הַ֣ר גָּבֹ֗הַּ וְ/אֶל תַּ֛חַת כָּל עֵ֥ץ רַעֲנָ֖ן וַ/תִּזְנִי שָֽׁם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/003/006.yaml
  text: And the LORD said to me in the days of King Josiah, “Have you seen what faithless Israel has done? She went up on every high hill and under every green tree, and there she prostituted herself.”
translation:
  language: zh_hans
  text: 约西亚王在位的日子，耶和华对我说：“你看见背信的以色列所做的事了吗？她走上每一座高山，到每一棵青翠的树下，在那里行淫。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经传统中广为人知的专名译法，明确对应神的圣名。
- source_word: מְשֻׁבָה יִשְׂרָאֵל
  choice: 背信的以色列
  rationale: מְשֻׁבָה在本段拟人化的婚约语境中指离弃、变节；“背信”既表达关系上的不忠，也避免仅译作一般性的“退后”。
- source_word: הַר גָּבֹהַּ
  choice: 高山
  rationale: 直译其地形意象；在先知书语境中也可暗示祭祀场所，但正文不将隐含意义明说。
- source_word: עֵץ רַעֲנָן
  choice: 青翠的树
  rationale: רַעֲנָן表示繁茂、青绿；保留原文常见的地点公式及其偶像崇拜背景。
- source_word: וַתִּזְנִי
  choice: 行淫
  rationale: 保留先知婚姻隐喻的强烈措辞及其宗教不忠与性行为之间的双重张力，不弱化为笼统的“犯罪”。
theological_decisions:
- issue: 以色列的阴性拟人化
  choice: 用“她”指称以色列
  alternative: 重复“以色列”或使用“它”
  rationale: 原文动词为阴性单数，并以不忠妻子的形象描写以色列；“她”能自然保留婚姻隐喻。
- issue: 行淫是否直接解释为偶像崇拜
  choice: 保留“行淫”的隐喻表达
  alternative: 译为“拜偶像”或“向别神卖淫”
  rationale: 上下文确实涉及宗教背叛，但本节原文使用行淫隐喻而未在此处直接补出对象；译文不应消除其有意保留的双重含义。
- issue: 地点介词的空间关系
  choice: “走上……到……树下”
  alternative: “在每一座高山上和每一棵青翠的树下”
  rationale: 分别反映原文עַל与אֶל־תַּחַת的表达，同时使现代汉语流畅。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。句序基本贴近希伯来文，同时将时间短语处理为“约西亚王在位的日子”，避免生硬直译。保留“背信—行淫”的婚约意象，不额外解释为特定宗派教义。
