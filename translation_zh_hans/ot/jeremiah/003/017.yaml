  to: 那时，人们要称耶路撒冷为“雅威的宝座”；万国都要为着雅威的名聚集到那里[a]，就是耶路撒冷。他们不再随从自己邪恶之心的顽梗。
  rationale: 调整正文中万国朝向耶路撒冷的表达，使其符合自然现代汉语，同时保留原文重复提到耶路撒冷的效果。脚注a相应将“她那里”改为“那里”。原稿的b脚注锚点位于“雅威的名”之后，但其内容实际说明前面的“雅威的宝座”；在修订正文中移除该不对应的锚点，并保留为独立的完整脚注资料，供版面编辑按“雅威的宝座”处重新锚定。
