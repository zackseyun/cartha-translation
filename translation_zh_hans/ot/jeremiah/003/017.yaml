review_pass:
  verdict: revise
  source_fidelity: 正文准确保留了主动复数的“人们要称”、耶路撒冷为雅威宝座、万国会聚、为雅威的名，以及不再随从内心顽梗等核心内容。原稿中“聚集到她那里，来到耶路撒冷”的连续表达在汉语里不够顺畅，且使两个趋向性短语的关系显得重复；改为“聚集到那里，就是耶路撒冷”，既保留原文对耶路撒冷的重复指称，也更清楚自然。
  naturalness: “万国都要聚集到她那里，来到耶路撒冷”不符合现代汉语通常的句法衔接。“聚集到那里，就是耶路撒冷”保留庄重语体，并避免城市阴性代词在汉语中造成的指代负担。其余措辞如“万国”“宝座”“顽梗”适合先知文学的现代庄重语域。
  terminology: “雅威”作为神名音译前后一致；“万国”“宝座”“随从”“顽梗”均恰当。“为着雅威的名”可保留原文介词的开放性，不限定为敬拜或归信。脚注b宜避免把“宝座”意象直接断言为一种已界定的王权实现，改为说明原文的称谓即可。
