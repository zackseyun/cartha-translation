  text: בָּ/עֵ֣ת הַ/הִ֗יא יִקְרְא֤וּ לִ/ירוּשָׁלִַ֨ם֙ כִּסֵּ֣א יְהוָ֔ה וְ/נִקְוּ֨וּ אֵלֶ֧י/הָ כָֽל הַ/גּוֹיִ֛ם לְ/שֵׁ֥ם יְהוָ֖ה לִ/ירוּשָׁלִָ֑ם וְ/לֹא יֵלְכ֣וּ ע֔וֹד אַחֲרֵ֕י שְׁרִר֖וּת לִבָּ֥/ם הָ/רָֽע־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/003/017.yaml
  text: At that time they will call Jerusalem ‘the throne of Yahweh,’ and all the nations will gather to it[a], to Jerusalem, for the name of Yahweh[b]. They will no longer walk after the stubbornness of their evil heart.
translation:
  language: zh_hans
  text: 那时，人们要称耶路撒冷为“雅威的宝座”；万国都要为着雅威的名聚集到那里[a]，就是耶路撒冷。他们不再随从自己邪恶之心的顽梗。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“都要被聚集到那里”，也可能译“都要涌向那里”。这里的希伯来语动词较难确定；按上下文，是描写万国向耶路撒冷会聚。
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּעֵת הַהִיא
  choice: 那时
  rationale: 这是先知书中引出未来复兴景象的常见时间表达；“那时”简洁自然。
- source_word: יִקְרְאוּ לִירוּשָׁלַם כִּסֵּא יְהוָה
  choice: 人们要称耶路撒冷为“雅威的宝座”
  rationale: 保留希伯来文主动复数动词和“宝座”的直接意象，不改写为被动句，也不预先解释其末世含义。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以通行的现代汉语音译呈现四字神名，保留其作为专名的性质。
- source_word: וְנִקְוּוּ אֵלֶיהָ
  choice: 都要聚集到她那里
  rationale: 此处尼法勒形态的动词较难确定；上下文指万国向耶路撒冷会聚。“她”保留希伯来文指向耶路撒冷的阴性代词。
- source_word: כָל הַגּוֹיִם
  choice: 万国
  rationale: 这里泛指列国；“万国”符合先知文学语体，也比“外邦人”更少加入族群对立色彩。
- source_word: לְשֵׁם יְהוָה
  choice: 为着雅威的名
  rationale: 保留介词所含的趋向、归属或尊崇意味，不将其限定解释为敬拜、归信或政治臣服。
- source_word: לִירוּשָׁלָם
  choice: 来到耶路撒冷
  rationale: 保留原文第二次明确提到耶路撒冷的重复，并以汉语自然表达其趋向意义。
- source_word: וְלֹא יֵלְכוּ עוֹד אַחֲרֵי
  choice: 他们不再随从
  rationale: הלך אחרי是“跟随、照着……而行”的惯用表达；“随从”自然传达行为与 allegiance 的含义。
- source_word: שְׁרִרוּת לִבָּם הָרָע
  choice: 自己邪恶之心的顽梗
  rationale: שְׁרִרוּת表示顽梗、固执；保留原文集合性单数“心”，并以“邪恶”直译הָרָע。
theological_decisions:
- issue: 耶路撒冷被称为“雅威的宝座”的末世意象
  choice: 直接保留宝座意象，不在正文中说明它是象征性的还是字面的未来场景。
  alternative: 解释为上帝在耶路撒冷施行王权的象征，或解释为将来实际设立宝座。
  rationale: 原文把耶路撒冷与雅威的王权所在联系起来，却没有在本节内界定这一意象的具体实现方式。
- issue: 万国向耶路撒冷聚集的性质
  choice: 只表达万国共同向耶路撒冷会聚。
  alternative: 明确解释为朝圣敬拜、归信雅威或政治臣服。
  rationale: 经文表达了朝向耶路撒冷和雅威之名的行动，但不足以限定为某一种神学或政治模式。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“她”承接耶路撒冷，刻意保留希伯来文阴性代词及城市人格化；“万国”“宝座”“顽梗”维持先知文学的庄重语域。
