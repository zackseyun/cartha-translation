base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/003/010.yaml
  text: Yet in spite of all this[a], faithless Judah, her sister did not return to me with all her heart, but only in falsehood[b], declares Yahweh.
translation:
  language: zh_hans
  text: 然而，尽管这一切，她那背信的姐妹犹大仍未全心归向我，只是虚情假意。这是雅威的宣告。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְגַם בְּכָל זֹאת
  choice: 尽管发生了这一切
  rationale: 结合上下文表达让步和转折意味，指犹大虽看见此前的警戒与审判，仍未真诚回转。
- source_word: שָׁבָה אֵלַי
  choice: 归向我
  rationale: 既保留“返回、回转”的基本含义，也自然传达关系和圣约语境中的悔改意味，而不将其扩展成经文未明说的完整教义表述。
- source_word: בָּגוֹדָה
  choice: 背信的
  rationale: 该词强调关系中的不忠和背叛；“背信”在现代中文中简明、庄重，并适合本段的婚姻及姐妹比喻。
- source_word: אֲחוֹתָהּ יְהוּדָה
  choice: 她那……姐妹犹大
  rationale: 保留犹大与前文以色列之间的女性亲属意象；“姐妹”不擅自判定姐姐或妹妹。
- source_word: בְּכָל לִבָּהּ
  choice: 全心
  rationale: 自然表达希伯来语“以全部的心”，指真诚、毫无保留的归向。
- source_word: כִּי אִם בְּשֶׁקֶר
  choice: 只是假意归向我
  rationale: כִּי אִם表达限制和对比，בְּשֶׁקֶר表示虚假或欺骗；此译清楚说明犹大的回转只是表面的，并通过补出中文所需的谓语保持语意连贯。
- source_word: נְאֻם יְהוָה
  choice: 这是雅威的宣告
  rationale: 以庄重而自然的现代中文保留先知宣告公式，并将神名יהוה音译为“雅威”。
theological_decisions:
- issue: 犹大“归向”雅威的圣约含义
  choice: 译作“归向我”，让悔改和关系恢复的意味由上下文呈现
  alternative: 译作“回到我这里”或明确扩译为“悔改归向我”
  rationale: “归向”同时保留方向性和关系性，又不把שׁוב所蕴含但未完全明说的悔改概念过度解释出来。
- issue: 犹大作为以色列“姐妹”的先知性比喻
  choice: 明确保留“她那……姐妹犹大”
  alternative: 删去女性亲属意象，只称“背信的犹大”
  rationale: 原文把两个国家人格化为姐妹；保留这一意象有助于维持上下文关于共同不忠的修辞和神学张力。
- issue: 犹大回转的真实性
  choice: 译作“只是假意归向我”
  alternative: 较直译为“而是在虚假中”
  rationale: 原文并未否认存在某种外在回转，却断定它不是全心的；“假意”保留了外在行为与内在真实之间的张力。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“姐妹”避免无依据地指定长幼；“这是雅威的宣告”保留先知公式的郑重语气。
