  text: הֲ/ל֣וֹא מֵ/עַ֔תָּה קראתי לִ֖/י אָבִ֑/י אַלּ֥וּף נְעֻרַ֖/י אָֽתָּה׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/003/004.yaml
  text: Have you not just now called to me[a], ‘My Father[b], you are the friend of my youth’?”
translation:
  language: zh_hans
  text: 你不是刚才[a]向我呼求说：“我的父亲啊，你是我青年时代的密友[b]”吗？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“从今以后”。这里译作“刚才”，理解为近期发出的呼求。
    reason: lexical_alternative
  - marker: b
    text: 或译“我青年时代的引导者”。希伯来语 אַלּוּף 可按语境指亲近的伙伴、密友或引导者。
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלוֹא
  choice: 不是……吗
  rationale: 用现代汉语的反问结构表达原文预期肯定回答的疑问语气。
- source_word: מֵעַתָּה
  choice: 刚刚
  rationale: 结合本节语境，理解为犹大方才发出的呼求；原词组也可表示“从今以后”，故加注保留歧义。
- source_word: קראתי
  choice: 呼求说
  rationale: 按上下文及阴性单数受话者理解为“你呼求”；“呼求说”既表达向上帝发声，也自然引出后面的直接引语。
- source_word: לִי
  choice: 向我
  rationale: 保留介词所标示的言语对象，即向耶和华发出呼求。
- source_word: אָבִי
  choice: 我的父亲啊
  rationale: 保留直接称呼及第一人称所属关系；语气词“啊”使现代汉语呼语自然，不额外增添神学含义。
- source_word: אַלּוּף
  choice: 密友
  rationale: 此处与“青年时代”连用，关系性的“密友”较自然地表达亲近同伴之义，同时以脚注注明“引导者”等可能含义。
- source_word: נְעֻרַי
  choice: 我青年时代的
  rationale: 以自然汉语保留该构造关系，表示从年轻时期便有的关系。
- source_word: אָתָּה
  choice: 你是
  rationale: 用汉语系词句明确表达原文无动词判断句及独立代词所带的强调。
theological_decisions:
- issue: 反问句的说话者和受话者
  choice: 耶和华向拟人化为女子的犹大说话，并引述她刚发出的呼求。
  alternative: 可将这句话理解为揭露一种表面或不真诚的悔改，而不仅是记录真诚祷告。
  rationale: 阴性单数形式和耶利米书第3章的上下文支持拟人化的犹大为受话者；译文只呈现她所说的话，不替上下文裁定其呼求是否真诚。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。“不是……吗”保留反问力度；“父亲啊”适合直接呼语；脚注标记放在各自所解释的词语之后，以避免英文咨询层中标记位置与脚注内容错配。
