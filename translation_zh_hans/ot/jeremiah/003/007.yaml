id: JER.3.7
reference: Jeremiah 3:7
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וָ/אֹמַ֗ר אַחֲרֵ֨י עֲשׂוֹתָ֧/הּ אֶת כָּל אֵ֛לֶּה אֵלַ֥/י תָּשׁ֖וּב וְ/לֹא שָׁ֑בָה ו/תראה בָּגוֹדָ֥ה אֲחוֹתָ֖/הּ יְהוּדָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/003/007.yaml
  text: And I said[a], ‘After she had done all these things, she will return to me,’ but she did not return[c][b]; and her treacherous sister Judah saw it.
translation:
  language: zh_hans
  text: 我说：“她做了这一切以后，会回到我这里来[a]。”她却没有回来[b]；她那背信的[c]姐妹犹大看见了这一切。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “会回到”也可译为“本会回到”。希伯来语未完成式在这里可表示从过去的时点所预期的将来。
    reason: lexical_alternative
  - marker: b
    text: “回来”也可译为“回转”；在盟约语境中，也含有“悔改、归向”的意味。
    reason: lexical_alternative
  - marker: c
    text: “背信的”也可译为“行诡诈的”或“不忠的”；原词强调背叛。
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמַר
  choice: 我说
  rationale: 保留叙事中的简单过去陈述，不将其解释性地改成“我想”或“我以为”。
- source_word: אַחֲרֵי עֲשׂוֹתָהּ אֶת כָּל אֵלֶּה
  choice: 她做了这一切以后
  rationale: 将介词加不定式结构自然地译成现代汉语时间从句，并保留“这一切”的概括表达。
- source_word: אֵלַי תָּשׁוּב
  choice: 会回到我这里来
  rationale: שׁוּב兼有返回及回转归向之意；“回到我这里来”既符合汉语表达，也不把盟约语境中的含义单一化为“悔改”。“会”表达从过去时点所作的预期。
- source_word: וְלֹא שָׁבָה
  choice: 她却没有回来
  rationale: “却”清楚呈现预期与事实之间的转折；重复“回来”以保留原文同一词根形成的呼应。
- source_word: וַתֵּרֶא
  choice: 看见了这一切
  rationale: ראה直译为“看见”；汉语补出由上文可知的宾语“这一切”，使句子自然完整，而不改变所指事件。
- source_word: בָּגוֹדָה
  choice: 背信的
  rationale: 该词源于בגד，强调背叛和不忠；“背信”比泛指缺乏信心的说法更能保留盟约背叛的力度。
- source_word: אֲחוֹתָהּ יְהוּדָה
  choice: 她那……姐妹犹大
  rationale: “姐妹”不擅自判定长幼，保留以家庭关系比喻以色列与犹大的表达。
theological_decisions:
- issue: שׁוּב的盟约含义
  choice: 回来
  alternative: 回转；悔改
  rationale: 本词在耶利米书中常同时具有返回和在盟约关系中回转的意味。“回来”保留这种张力，不把经文本身直接收窄为“悔改”。
- issue: בָּגוֹדָה对犹大的定性
  choice: 背信的
  alternative: 行诡诈的；不忠的
  rationale: “背信”凸显关系和盟约中的背叛，同时避免仅仅理解为一般性的欺骗行为。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“姐妹”避免为希伯来语未注明的长幼关系作出判断；分号保持后半句与前述事件的紧密联系。
