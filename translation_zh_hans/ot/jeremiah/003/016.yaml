  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/הָיָ֡ה כִּ֣י תִרְבּוּ֩ וּ/פְרִיתֶ֨ם בָּ/אָ֜רֶץ בַּ/יָּמִ֤ים הָ/הֵ֨מָּה֙ נְאֻם יְהוָ֔ה לֹא יֹ֣אמְרוּ ע֗וֹד אֲרוֹן֙ בְּרִית יְהוָ֔ה וְ/לֹ֥א יַעֲלֶ֖ה עַל לֵ֑ב וְ/לֹ֤א יִזְכְּרוּ ב/וֹ֙ וְ/לֹ֣א יִפְקֹ֔דוּ וְ/לֹ֥א יֵעָשֶׂ֖ה עֽוֹד־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/003/016.yaml
  text: And it shall be[a], when you have multiplied and been fruitful in the land in those days, declares Yahweh, they will no longer say, ‘The ark of the covenant of Yahweh.’ It will not come to mind, and they will not remember it or miss it[b], nor will it be made again.
translation:
  language: zh_hans
  text: 到那些日子，你们在这地繁衍增多时——这是雅威的宣告——人必不再说：“雅威的约柜。”约柜不会再被人想起；他们不会记念它，也不会寻求它[a]；它也不会再被制造[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“也不会顾念它”“也不会探问它”。希伯来语动词可表示留意、探问、寻找等；这里可能指人不再感到需要约柜，也不再在意它的缺失。
    reason: lexical_alternative
  - marker: b
    text: 或意译：“也不会再造另一个约柜。”希伯来语采用被动形式，没有明说被造之物；上下文表明不会制造替代的约柜。
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: ……的时候
  rationale: 该组合引出将来的时间情境；汉语用“……的时候”自然表达预言中的未来条件，无须机械译出句首连接词。
- source_word: תִרְבּוּ וּפְרִיתֶם
  choice: 繁衍增多
  rationale: 保留“结果实／生养”与“增多”这一常见搭配的含义，同时以现代汉语概括人口兴旺的语境。
- source_word: בָּאָרֶץ
  choice: 在这地
  rationale: 此处指上下文所说的应许之地，而非全世界；“这地”在汉语中简洁明确。
- source_word: נְאֻם יְהוָה
  choice: 这是雅威的宣告
  rationale: 保留先知书庄严的神谕公式，并将神名 יְהוָה 音译为“雅威”。
- source_word: אֲרוֹן בְּרִית יְהוָה
  choice: 雅威的约柜
  rationale: 这是该器物在现代中文圣经语域中的自然名称，准确表达“雅威之约的柜”。
- source_word: וְלֹא יַעֲלֶה עַל־לֵב
  choice: 约柜不会再被人想起
  rationale: 希伯来语直译为“不再上到心里”，是“进入念头、被想起”的习语；补明“约柜”可避免汉语指代不清。
- source_word: וְלֹא יִזְכְּרוּ בוֹ
  choice: 他们不会记念它
  rationale: 按上下文将代词所指译为约柜；“记念”兼具记起与郑重关注之意。
- source_word: וְלֹא יִפְקֹדוּ
  choice: 也不会寻求它
  rationale: פקד 在此可表示留意、探问、顾念或因缺失而寻找；正文采用语义较宽且符合语境的“寻求”，并以脚注保留其他可能。
- source_word: וְלֹא יֵעָשֶׂה עוֹד
  choice: 它也不会再被制造
  rationale: 保留希伯来语被动形式及隐含主语，让上下文自然指向约柜，不擅自添加“另一个”。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；音译“雅威”较贴近其通行学术重构，也保留其作为专名的功能。
- issue: 未来约柜的地位
  choice: 只陈述人不再提说、想起、记念、寻求或制造约柜
  alternative: 将本节解释为废除整个先前之约，或仅预言约柜遗失
  rationale: 原文聚焦于约柜本身及人对它的态度；译文不把这一具体预言扩展为原文没有明说的神学结论。
- issue: 末句隐含主语
  choice: 以“它”回指约柜
  alternative: “也不会再造另一个约柜”
  rationale: 上下文强烈支持所指为约柜，但希伯来语被动句没有明说“另一个”；正文保留其简约与一定程度的含混。
translation_notes:
  register: 采用现代、庄重而易懂的先知书语体。“——这是雅威的宣告——”保留神谕插入语的强调作用；分号清楚呈现原文连续的否定句。所有脚注标记均置于其实际对应的短语之后。
