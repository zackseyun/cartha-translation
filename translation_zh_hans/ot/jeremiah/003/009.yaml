  text: וְ/הָיָה֙ מִ/קֹּ֣ל זְנוּתָ֔/הּ וַ/תֶּחֱנַ֖ף אֶת הָ/אָ֑רֶץ וַ/תִּנְאַ֥ף אֶת הָ/אֶ֖בֶן וְ/אֶת הָ/עֵֽץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/003/009.yaml
  text: And because of the lightness of her prostitution[b][a], she polluted the land and committed adultery with stone and wood.
translation:
  language: zh_hans
  text: 因她轻看淫乱[a]，她玷污了这地，又与石头和木头[b]通奸。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因她淫乱的声名（或传闻）。”这里的希伯来表达较难确定；也可能表示她的淫乱声名远扬，或她把淫乱看作轻率的小事。
    reason: lexical_alternative
  - marker: b
    text: “石头和木头”指用这些材料制成的偶像。
    reason: cultural_note
lexical_decisions:
- source_word: מִקֹּל
  choice: 因轻率地
  rationale: 该希伯来表达较难确定；קֹול通常指“声音、喧声、消息”，但此处传统上也常按淫乱被轻忽、视为轻率之事来理解。正文采用通顺的因果表达“因轻率地”，同时以脚注保留“因她淫乱的喧声／传闻”等可能。
- source_word: זְנוּתָהּ
  choice: 她……淫乱
  rationale: 保留先知书以性方面的不忠比喻背约和拜偶像的强烈措辞；“淫乱”在现代汉语中清楚而不古奥。
- source_word: וַתֶּחֱנַף
  choice: 玷污了
  rationale: חנף以“这地”为宾语时，表示使其污秽、亵渎；“玷污”既自然，也符合此处土地因偶像崇拜而受污的语境。
- source_word: הָאָרֶץ
  choice: 这地
  rationale: 语境所指很可能是犹大／以色列之地，而非全世界；“这地”保留其具体语境。
- source_word: וַתִּנְאַף
  choice: 通奸
  rationale: נאף是表示奸淫、通奸的常用词；此处保留婚约不忠的隐喻，并与前面的“淫乱”形成呼应。
- source_word: אֶת־הָאֶבֶן וְאֶת־הָעֵץ
  choice: 与石头和木头
  rationale: 按原文直译材料名称，不在正文中明加“偶像”，以保留先知话语中尖锐的转喻。
theological_decisions:
- issue: 以性不忠比喻拜偶像和背约
  choice: 正文保留“淫乱”和“通奸”的意象。
  alternative: 弱化为“不忠”“背叛”或“离弃信仰”。
  rationale: 耶利米刻意用婚姻和性方面的不忠描写百姓对耶和华之约的背叛；弱化措辞会削减原文的神学张力。
- issue: “石头和木头”的隐含所指
  choice: 正文只写“石头和木头”，脚注说明指以这些材料制成的偶像。
  alternative: 正文直接译作“石头和木头制成的偶像”。
  rationale: 原文只点出材料，让读者领会其所指；正文保留这一转喻，脚注提供必要的文化说明。
- issue: מִקֹּל זְנוּתָהּ的歧义
  choice: 正文采用“因轻率地淫乱”，脚注保留“喧声／传闻”的词面可能。
  alternative: 正文译作“因她淫乱的喧声”或“因她淫乱的传闻”。
  rationale: 该短语的希伯来语义不易确定。正文需要自然表达上下文的因果关系，但不应把词面上“声音、消息”的可能性静默排除。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“淫乱”“通奸”保留原文强烈的婚约不忠意象；句式简洁，脚注明示关键词语的真实歧义。
