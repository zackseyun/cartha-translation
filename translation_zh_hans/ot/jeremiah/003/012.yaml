  text: הָלֹ֡ךְ וְ/קָֽרָאתָ֩ אֶת הַ/דְּבָרִ֨ים הָ/אֵ֜לֶּה צָפ֗וֹנָ/ה וְ֠/אָמַרְתָּ שׁ֣וּבָ/ה מְשֻׁבָ֤ה יִשְׂרָאֵל֙ נְאֻם יְהוָ֔ה לֽוֹא אַפִּ֥יל פָּנַ֖/י בָּ/כֶ֑ם כִּֽי חָסִ֤יד אֲנִי֙ נְאֻם יְהוָ֔ה לֹ֥א אֶטּ֖וֹר לְ/עוֹלָֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/003/012.yaml
  text: 'Go and proclaim these words toward the north[a], and say: Return, faithless Israel, declares Yahweh. I will not look on you in anger, for I am faithful, declares Yahweh; I will not stay angry forever.'
translation:
  language: zh_hans
  text: '你去，向北方宣告这些话，说：


    “背信的以色列啊，回来吧！这是雅威的宣告。


    我必不以怒容相向，


    因为我是信实的[a]。这是雅威的宣告。


    我必不永远怀怒。”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“怜悯的”。这个希伯来词可表示盟约中的忠贞、慈爱或怜悯。
    reason: 保留חָסִיד在本句中的词义范围，不把“信实”与“怜悯”之间的张力静默消解。
lexical_decisions:
- source_word: הָלֹךְ וְקָרָאתָ
  choice: 你去，……宣告
  rationale: הָלֹךְ在此加强命令语气；קרא在先知受命的语境中指公开宣告。译文以自然、庄重的现代汉语表达。
- source_word: צָפוֹנָה
  choice: 向北方
  rationale: 保留带方向词尾的方位意义，也让经文可能指向北方之地或流亡者的空间含义保持开放。
- source_word: שׁוּבָה מְשֻׁבָה יִשְׂרָאֵל
  choice: 背信的以色列啊，回来吧
  rationale: שׁוב兼具归回和回转的关系性含义；מְשֻׁבָה指背离、叛离，以“背信的”突出盟约关系中的不忠。
- source_word: נְאֻם יְהוָה
  choice: 这是雅威的宣告
  rationale: נְאֻם是庄严的先知宣告公式；יְהוָה按其专名译为“雅威”。
- source_word: לֹא אַפִּיל פָּנַי בָּכֶם
  choice: 我必不怒容相向
  rationale: 原文直译近于“不使我的脸落向你们”，是表达敌意或怒气的面容习语。“怒容相向”既保留面容意象，也使现代读者明白其含义。
- source_word: חָסִיד אֲנִי
  choice: 因为我是信实的
  rationale: חָסִיד用于雅威时可表达忠贞、慈爱或怜悯。“信实”突出盟约忠诚，同时以脚注保留“怜悯”的合理理解。
- source_word: לֹא אֶטּוֹר לְעוֹלָם
  choice: 我必不永远怀怒
  rationale: נטר在此指持续保留怒气或怨恨。“怀怒”准确表达持续不放的动态，并保留“永远”的范围。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文明确使用四字神名；“雅威”以现代汉语音译保留其作为盟约专名的性质。
- issue: חָסִיד 描述雅威时的语义
  choice: 信实的
  alternative: 怜悯的；慈爱的；忠贞的
  rationale: 该词可指忠贞慈爱，也可在此语境中强调怜悯。正文采用“信实”呈现盟约忠诚，脚注保存“怜悯”的真实歧义。
- issue: לֹא אַפִּיל פָּנַי בָּכֶם 的神学与修辞张力
  choice: 我必不怒容相向
  alternative: 我必不向你们板起脸来；我必不以怒目看你们
  rationale: 不将面容习语完全抽象化为“惩罚”，以保留神亲自转向百姓时的关系性意象，同时清楚表达怒意。
translation_notes:
  register: 采用现代、庄重而可朗读的标准普通话。“背信”比“退后”更清楚表达盟约不忠；“怒容相向”保留希伯来语的面容意象而避免生硬直译。诗行分排呈现宣告节奏。
