  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֵלַ֔/י צִדְּקָ֥ה נַפְשָׁ֖/הּ מְשֻׁבָ֣ה יִשְׂרָאֵ֑ל מִ/בֹּגֵדָ֖ה יְהוּדָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/003/011.yaml
  text: And Yahweh said to me[a], “Faithless Israel has shown herself more righteous than treacherous Judah.”
translation:
  language: zh_hans
  text: 耶和华对我说：“背道的[a]以色列，倒显得比背信的犹大更公义。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “背道的”也可译作“不忠的”或“转离的”。
    reason: 希伯来语מְשֻׁבָה既可突出从正道转离，也可突出立约关系上的不忠。
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的上帝立约之名译法，区别于一般称谓“主”。
- source_word: וַיֹּאמֶר אֵלַי
  choice: 对我说
  rationale: 按希伯来叙事句式自然译出אמר及其第一人称间接宾语。
- source_word: צִדְּקָה נַפְשָׁהּ
  choice: 倒显得……更公义
  rationale: 该表达直指“她自己显为公义”，在比较结构中表示相对而言更站得住脚，并不宣告以色列绝对无罪；“倒”传达上下文中出人意料的对比。
- source_word: מְשֻׁבָה
  choice: 背道的
  rationale: 该词描述转离、悖逆的状态；“背道”既保留方向转离的意象，也符合立约关系语境。
- source_word: יִשְׂרָאֵל
  choice: 以色列
  rationale: 采用通行中文专名；上下文将北国人格化为女性，中文无需另加阴性标记。
- source_word: מִבֹּגֵדָה
  choice: 比背信的
  rationale: 介词מִן表达比较；בגד强调对关系与盟约的背叛，“背信”比笼统的“不忠”更鲜明，同时适合修饰人格化的犹大。
- source_word: יְהוּדָה
  choice: 犹大
  rationale: 采用南国名称的通行中文译法。
theological_decisions:
- issue: 以色列相对于犹大的“公义”
  choice: 译为“倒显得比……更公义”，保留比较性判断
  alternative: “以色列证明自己是公义的”或“以色列得称为义”
  rationale: 希伯来文在מִן引出的比较结构中使用צדק；这里是在两个有罪群体之间作相对判断，不表示以色列在上帝面前绝对无罪。译文保留这种令人震惊的张力，而不将其改写为无罪宣告。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“背道”与“背信”形成清楚但不过度整齐化的对照；逗号突出人格化的以色列这一主题，“倒显得”传达比较判断的反常与修辞力度。
