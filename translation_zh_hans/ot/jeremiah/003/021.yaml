id: JER.3.21
reference: Jeremiah 3:21
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: ק֚וֹל עַל שְׁפָיִ֣ים נִשְׁמָ֔ע בְּכִ֥י תַחֲנוּנֵ֖י בְּנֵ֣י יִשְׂרָאֵ֑ל כִּ֤י הֶעֱוּוּ֙ אֶת דַּרְכָּ֔/ם שָׁכְח֖וּ אֶת יְהֹוָ֥ה אֱלֹהֵי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/003/021.yaml
  text: A voice is heard on the bare heights[a], the weeping and pleas for mercy of the sons of Israel, because they have made their way crooked[c][b]; they have forgotten Yahweh their God.
translation:
  language: zh_hans
  text: 在光秃的高地上，听见了声音：那是以色列子孙[a]的哭泣和恳求；因为他们使自己的道路弯曲了[b]，忘记了雅威[c]——他们的上帝。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “以色列子孙”直译可作“以色列的儿子们”；这里是对以色列百姓的集合称呼。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“把自己的道路走歪了”或“败坏了自己的行径”。
    reason: lexical_alternative
  - marker: c
    text: 希伯来文是神名YHWH，其古代准确读音不能完全确定；“雅威”是常见拟音，中文传统常译“耶和华”，也常按犹太诵读传统译作“主”。
    reason: alternative_reading
lexical_decisions:
- source_word: ק֚וֹל
  choice: 声音
  rationale: קול可指声音、呼声；此处随后说明声音的内容是哭泣与哀求，因此用宽泛而生动的“声音”。
- source_word: עַל שְׁפָיִ֣ים
  choice: 在光秃的高地上
  rationale: שְׁפָיִים指无遮蔽、荒秃的高处；“光秃的高地”同时保留地势与荒凉感，也避免把它直接解释为祭祀用的“邱坛”。
- source_word: נִשְׁמָ֔ע
  choice: 有……传来
  rationale: 希伯来文为被动式“被听见”。汉语用“有声音传来”更自然，同时保留声音为人所听见的场景。
- source_word: בְּכִ֥י תַחֲנוּנֵ֖י
  choice: 哭声和哀求声
  rationale: בכי是哭泣，תחנונים是求恩、求怜悯的恳切祈求；“哭声和哀求声”清楚表达这声音的两重内容。
- source_word: בְּנֵ֣י יִשְׂרָאֵ֑ל
  choice: 以色列子孙
  rationale: 直译为“以色列的儿子们”，但在民族共同体语境中是集合称呼；“以色列子孙”既保留传统亲缘意象，也能自然指全体百姓。
- source_word: הֶעֱוּוּ֙ אֶת דַּרְכָּ֔ם
  choice: 把自己的道路走歪了
  rationale: הֶעֱוּוּ是使之弯曲、扭曲，דרך既可指道路，也比喻生活行为。“把自己的道路走歪了”在现代汉语中自然，并保留具体的道路隐喻及道德含义。
- source_word: שָׁכְח֖וּ
  choice: 忘记了
  rationale: 准确表达完成式动作；在本语境中不仅是记忆失误，也含有不再顾念、不再忠于的关系意味，但不在正文中额外解释。
- source_word: יְהֹוָ֥ה
  choice: 雅威
  rationale: 原文直接使用四字神名YHWH。正文采用现代学界常见的拟音“雅威”，以显示这是专名，而非普通称号。
- source_word: אֱלֹהֵי/הֶֽם
  choice: 他们的上帝
  rationale: 直接表达带第三人称复数后缀的构造形式，并保留神与以色列之间的关系意味。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文使用四字神名而不是“主”这一称号。采用“雅威”可保留专名性质；脚注说明其读音不能完全确定，并列出中文传统译名，避免把拟定读音说成无争议的结论。
- issue: בְּנֵי יִשְׂרָאֵל的群体范围
  choice: 以色列子孙
  alternative: 以色列的儿子们；以色列人
  rationale: 该短语语法上是阳性复数，但在这里作为民族共同体的集合称呼。正文保留“子孙”的亲缘和盟约色彩，脚注说明其可自然理解为以色列百姓，避免将经文限定为成年男性。
- issue: “使道路弯曲”的道德隐喻
  choice: 把自己的道路走歪了
  alternative: 使自己的道路弯曲；败坏了自己的行径
  rationale: 保留道路隐喻及主动偏离的意味，不将其抽象化为某一种特定罪行，也不削弱原文的道德责备。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“有声音传来——是……”重现原文先引出声音、再说明其内容的结构；“光秃的高地”营造公开、荒凉的哀哭场景；“把自己的道路走歪了”用自然汉语保留原文具体的道路隐喻。
