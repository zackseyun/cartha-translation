  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: אָכֵ֛ן בָּגְדָ֥ה אִשָּׁ֖ה מֵ/רֵעָ֑/הּ כֵּ֣ן בְּגַדְתֶּ֥ם בִּ֛/י בֵּ֥ית יִשְׂרָאֵ֖ל נְאֻם יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/003/020.yaml
  text: Surely[a], as a woman betrays her companion, so you have betrayed me, O house of Israel, declares Yahweh.
translation:
  language: zh_hans
  text: “确实，正如一个女人背叛她的同伴[a]，以色列家啊，你们也照样背叛了我。”这是耶和华的宣告。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“妻子背叛丈夫。”希伯来文直译为“一个女人”和“她的同伴”，但本章上下文用婚姻意象描绘以色列的不忠。
    reason: alternative_reading
lexical_decisions:
- source_word: אָכֵן
  choice: 确实
  rationale: 表达郑重而强调的肯定语气，同时在现代汉语中自然简洁。
- source_word: בָּגְדָה / בְּגַדְתֶּם
  choice: 背叛／背叛了
  rationale: בגד表示以诡诈、不忠的方式破坏关系；“背叛”既保留关系破裂和道德过错，也适合本节的对应结构。比较句采用一般性表述，向以色列发言时用“背叛了”体现希伯来语完成式所指的既成行为。
- source_word: אִשָּׁה
  choice: 妇人
  rationale: 该词可指“女人”或“妻子”；“妇人”保留性别与成年身份，却不在正文中擅自确定婚姻关系。
- source_word: מֵרֵעָהּ
  choice: 她的同伴
  rationale: רֵעַ可指同伴、朋友或关系密切者。“同伴”保留词义宽度，不把上下文中的婚姻意象直接写成原文未明说的“丈夫”。
- source_word: כֵּן
  choice: 也照样
  rationale: 清楚标示比喻与以色列行为之间的对应，符合现代汉语表达。
- source_word: בִּי
  choice: 背叛了我
  rationale: 介词ב在בגד之后标示背叛所针对的对象；汉语直接以“我”作宾语最自然。
- source_word: בֵּית יִשְׂרָאֵל
  choice: 以色列家啊
  rationale: 保留“家”这一集体和盟约性称谓，并以“啊”明确直接呼语。
- source_word: נְאֻם יְהוָה
  choice: 这是耶和华的宣告
  rationale: 保留先知书中庄重的宣告公式，并直接译出神名יהוה。
theological_decisions:
- issue: 比较句中的关系是否明确为婚姻关系
  choice: 正文译作“妇人背叛她的同伴”
  alternative: “妻子背叛丈夫”
  rationale: 本章整体以婚姻描写以色列对耶和华的不忠，因此婚姻理解很有可能；但本节使用אִשָּׁה和רֵעַ，并未采用明确表示“丈夫”的词。正文保留原文的词义宽度，脚注说明符合上下文的婚姻性理解。
translation_notes:
  register: 采用现代、庄重而易懂的先知性语言。以“正如……也照样……”呈现希伯来文的比较结构；保留“以色列家”这一集体称谓。脚注标记[a]已置于正文相关词语之后。
