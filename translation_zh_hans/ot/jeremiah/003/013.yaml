source:
  edition: WLC
  text: אַ֚ךְ דְּעִ֣י עֲוֺנֵ֔/ךְ כִּ֛י בַּ/יהוָ֥ה אֱלֹהַ֖יִ/ךְ פָּשָׁ֑עַתְּ וַ/תְּפַזְּרִ֨י אֶת דְּרָכַ֜יִ/ךְ לַ/זָּרִ֗ים תַּ֚חַת כָּל עֵ֣ץ רַעֲנָ֔ן וּ/בְ/קוֹלִ֥/י לֹא שְׁמַעְתֶּ֖ם נְאֻם יְהֹוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/003/013.yaml
  text: Only acknowledge your guilt[a], that you have rebelled against Yahweh your God and scattered your ways among strangers under every green tree, and you have not obeyed my voice[b], declares Yahweh.
translation:
  language: zh_hans
  text: 只须承认你的罪责：你背叛了耶和华你的上帝，在每棵青翠树下[b]把你的行径四散给外人[a]；你们没有听从我的话。这是耶和华的宣告。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “外人”也可理解为“外邦神”。原文只说“外人”，很可能在延续淫乱与拜偶像的隐喻，却没有明说“神”。
    reason: alternative_reading
  - marker: b
    text: “在每棵青翠树下”是先知书中反复出现的说法，常指不正当敬拜的地点。
    reason: cultural_note
lexical_decisions:
- source_word: אַךְ דְּעִי עֲוֺנֵךְ
  choice: 只要承认你的罪责
  rationale: אַךְ在此限定并聚焦于所要求的事；ידע与“罪责”连用，表达认识并承认，而עָוֹן在本语境兼有罪行与罪责的道德分量。
- source_word: כִּי בַּיהוָה אֱלֹהַיִךְ פָּשָׁעַתְּ
  choice: 你背叛了耶和华你的上帝
  rationale: פשע指对合法权柄的反叛；介词ב在此有敌对意味。将יהוה译为“耶和华”，保留经文中的神圣名。
- source_word: וַתְּפַזְּרִי אֶת דְּרָכַיִךְ לַזָּרִים
  choice: 四处奔向外人
  rationale: 原文直译近于“把你的道路分散到外人那里”。中文用“四处奔向”自然表达分散行径的意象，同时保留זָרִים为“外人”，不擅自补出“神明”。
- source_word: תַּחַת כָּל עֵץ רַעֲנָן
  choice: 在每棵青翠树下
  rationale: 保留先知书反复使用的固定意象；“青翠”兼顾树木繁茂与作为非法敬拜地点的语境。
- source_word: וּבְקוֹלִי לֹא שְׁמַעְתֶּם
  choice: 你们没有听从我的声音
  rationale: “听声音”在希伯来语中常含顺服之意，故译“听从”；并以“你们”保留原文由阴性单数突然转为复数的变化。
- source_word: נְאֻם יְהוָה
  choice: 这是耶和华说的
  rationale: 以自然、庄重的现代汉语表达先知宣告公式。
theological_decisions:
- issue: 神圣名יהוה的译法
  choice: 耶和华
  alternative: 雅威；主
  rationale: 原文直接使用四字神名；采用普通中文读者熟悉的专名“耶和华”，而不以称号“主”取代。
- issue: לַזָּרִים是否应明确译成偶像或外邦神
  choice: 外人
  alternative: 外邦神；陌生人
  rationale: 上下文确有婚姻不忠与偶像崇拜的双重隐喻，但希伯来文只说“外人”。正文保留这种含混，不把所指限定为神明。
- issue: 末句人称数的变化
  choice: 前文用“你”，末句用“你们”
  alternative: 全节统一译为“你”
  rationale: 原文先以阴性单数称呼拟人化的以色列，末句却使用第二人称复数。保留转换，避免悄然消除文本张力。
translation_notes:
  register: 采用现代、庄重且便于普通读者理解的书面汉语。用“四处奔向外人”避免生硬直译“把你的道路散开”，同时保留背约不忠的空间与关系意象；标点凸显先承认罪责、再列明罪状的结构。
