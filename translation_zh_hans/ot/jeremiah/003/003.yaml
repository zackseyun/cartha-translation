  text: וַ/יִּמָּנְע֣וּ רְבִבִ֔ים וּ/מַלְק֖וֹשׁ ל֣וֹא הָיָ֑ה וּ/מֵ֨צַח אִשָּׁ֤ה זוֹנָה֙ הָ֣יָה לָ֔/ךְ מֵאַ֖נְתְּ הִכָּלֵֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/003/003.yaml
  text: Therefore the showers were withheld[a], and there was no spring rain; yet you had the forehead of a prostitute—you refused to be ashamed.
translation:
  language: zh_hans
  text: 因此，雨水被拦阻，春雨没有降下[a]；你却有妓女的额头，拒绝感到羞愧。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“晚雨”。希伯来语指农业季节后期的雨；这里译为“春雨”，以明确其季节含义。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמָּנְעוּ
  choice: 被止住
  rationale: 该动词为尼法勒形态，在此表达雨水被拦阻、不得降下；“被止住”简洁自然，也符合审判语境。
- source_word: רְבִבִים
  choice: 甘霖
  rationale: 此复数名词指阵雨或充沛的雨水；“甘霖”在现代汉语中庄重易懂，并适合农业降雨的语境。
- source_word: מַלְקוֹשׁ
  choice: 春雨
  rationale: 该词指农时后期、春季降下并帮助作物成熟的雨；“春雨”比“晚雨”更能让现代读者直接理解其季节意义。
- source_word: מֵצַח
  choice: 额头
  rationale: 保留原文具体的身体意象，不将其概括为“厚颜”或“无耻”。
- source_word: אִשָּׁה זוֹנָה
  choice: 娼妓般的
  rationale: 原文直指从事淫乱或卖淫的女子；用“娼妓般的额头”保留先知话语中性不忠的比喻，同时避免过度粗俗或古奥。
- source_word: הָיָה לָךְ
  choice: 你却有
  rationale: 原文以“为你所有”的结构表达拥有；汉语译作“你有”最自然。“却”呈现上下文中的反差。
- source_word: מֵאַנְתְּ
  choice: 拒不
  rationale: 该动词表达明确拒绝；“拒不”比单纯“不肯”更凝练有力。
- source_word: הִכָּלֵם
  choice: 羞愧
  rationale: 此处指感到羞耻；“羞愧”准确、自然，并与前面的额头意象共同传达厚颜无耻。
theological_decisions:
- issue: 以性不忠比喻圣约不忠
  choice: 保留“娼妓般的额头”这一直接而具体的比喻
  alternative: 译成“你却厚颜无耻”或“你竟毫无羞耻”
  rationale: 原文有意借娼妓形象指斥犹大的不忠。保留这一比喻，可维持先知话语的力度及偶像崇拜与淫乱之间的神学联系，而不替读者消解其张力。
translation_notes:
  register: 采用现代、庄重而可懂的普通话。“甘霖”略具文学色彩，但仍属通行词，可与“春雨”形成自然搭配；后半句保留原文突兀而强烈的身体与性不忠意象。
