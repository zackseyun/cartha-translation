  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: בַּ/יָּמִ֣ים הָ/הֵ֔מָּה יֵלְכ֥וּ בֵית יְהוּדָ֖ה עַל בֵּ֣ית יִשְׂרָאֵ֑ל וְ/יָבֹ֤אוּ יַחְדָּו֙ מֵ/אֶ֣רֶץ צָפ֔וֹן עַל הָ/אָ֕רֶץ אֲשֶׁ֥ר הִנְחַ֖לְתִּי אֶת אֲבוֹתֵי/כֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/003/018.yaml
  text: In those days the house of Judah will go with the house of Israel[b][a], and they will come together from the land of the north to the land that I gave as an inheritance to your fathers.
translation:
  language: zh_hans
  text: 在那些日子，犹大家必与以色列家同行[a]；他们必一同从北方之地来到我赐给你们的祖先[b]为产业的土地。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“犹大家必前往以色列家。”希伯来语介词可表达方向；但结合下文“一同”，这里更可能指犹大与以色列重新联合。
    reason: alternative_reading
  - marker: b
    text: 或译：“你们的列祖。”
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיָּמִים הָהֵמָּה
  choice: 在那些日子
  rationale: 保留先知话语中常见的未来时间表达，庄重而自然。
- source_word: יֵלְכוּ ... עַל בֵּית יִשְׂרָאֵל
  choice: 必与以色列家同行
  rationale: הלך的基本义是“行走、前往”；结合介词עַל及下文“一同”，此处表达犹大家与以色列家联合行动。“同行”既保留行走意象，也体现复合统一；“前往以色列家”作为可能的较直译理解列入脚注。
- source_word: בֵית יְהוּדָה / בֵית יִשְׂרָאֵל
  choice: 犹大家 / 以色列家
  rationale: 保留“家”这一群体性、盟约性的先知用语。
- source_word: וְיָבֹאוּ יַחְדָּו
  choice: 他们必一同……来到
  rationale: 分别体现动词“来到”和副词“共同、一同”，中文语序自然。
- source_word: מֵאֶרֶץ צָפוֹן
  choice: 从北方之地
  rationale: 保留“地”以及北方这一流亡归回的地理—先知意象。
- source_word: עַל הָאָרֶץ
  choice: 来到……土地
  rationale: 此处עַל随移动动词表示趋向目的地，译为“来到……土地”符合现代汉语。
- source_word: אֲשֶׁר הִנְחַלְתִּי
  choice: 我赐给……为产业的
  rationale: נחל的使役式表达使人承受产业、分赐为业；此译同时保留赐予和产业两层含义。
- source_word: אֶת אֲבוֹתֵיכֶם
  choice: 你们祖先
  rationale: אָבוֹת字面为“父辈、列祖”，在此指全体百姓的先祖；“祖先”在现代中文中准确自然，脚注保留较传统的“列祖”。
theological_decisions:
- issue: 犹大家与以色列家的复合图景
  choice: 译作“犹大家必与以色列家同行”
  alternative: “犹大家必前往以色列家”
  rationale: 耶利米书第三章的复兴语境及紧接的“一同”支持联合而非敌对或征服之意；同时以脚注保存介词结构可能容许的方向性理解。
- issue: אֲבוֹתֵיכֶם的性别与群体指称
  choice: 你们祖先
  alternative: 你们列祖
  rationale: 希伯来语形式为阳性复数，但语境指受赐土地的先辈群体。“祖先”不改变所指，且比“父亲们”更符合现代汉语；传统表达列入脚注。
translation_notes:
  register: 采用现代、庄重而易懂的普通话书面语。“家”“产业”“在那些日子”保留先知文本的群体性与盟约色彩；“同行”“一同”避免生硬，也不消除原文介词结构的真实歧义。
