  text: נִגְדְּעָה֙ קֶ֣רֶן מוֹאָ֔ב וּ/זְרֹע֖/וֹ נִשְׁבָּ֑רָה נְאֻ֖ם יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/025.yaml
  text: The horn of Moab is cut off[a], and his arm is broken, declares Yahweh.
translation:
  language: zh_hans
  text: 摩押的角被砍断了[a]，他的膀臂也折断了。这是雅威的宣告。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文的“角”和“膀臂”都是力量和权势的比喻。
    reason: 说明正文所保留的希伯来诗歌意象，帮助现代读者理解。
lexical_decisions:
- source_word: נִגְדְּעָה
  choice: 被砍断了
  rationale: גדע的尼法勒式表示“被砍断、被砍下”；此处与“角”的意象相配，并保留完成性语气。
- source_word: קֶרֶן
  choice: 角
  rationale: 原文直译为“角”，在先知诗歌中象征力量或权势；正文保留比喻，不直接释作“力量”。
- source_word: מוֹאָב
  choice: 摩押
  rationale: 采用现代中文圣经及历史地名的通行译名。
- source_word: וּזְרֹעוֹ
  choice: 他的膀臂也
  rationale: זְרוֹעַ直指手臂，也常喻指力量或军事能力；“他的”保留原文阳性单数后缀，并体现摩押被人格化。
- source_word: נִשְׁבָּרָה
  choice: 折断了
  rationale: שבר的尼法勒式表示“被折断”；与上句的被动结构和身体意象形成平行。
- source_word: נְאֻם יְהוָה
  choice: 这是雅威的宣告
  rationale: נְאֻם是庄严的先知宣告公式；采用“这是……的宣告”保留其名词性和郑重语气，并将神名译为“雅威”。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；“雅威”较贴近学界通常重构的读音，并明确保留专名性质。
- issue: “角”和“膀臂”的比喻
  choice: 在正文中保留具体意象
  alternative: 译为“力量”和“权势”
  rationale: 两种身体意象彼此平行，均象征摩押的力量；保留原文意象可避免把诗性表达过早化约为单一解释，脚注则说明其含义。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。保留“角／膀臂”的平行诗歌意象；“膀臂”比“手臂”略具文学色彩，但仍为普通读者所理解。“这是雅威的宣告”传达先知公式的郑重感。
