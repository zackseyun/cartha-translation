id: JER.48.11
reference: Jeremiah 48:11
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: שַׁאֲנַ֨ן מוֹאָ֜ב מִ/נְּעוּרָ֗י/ו וְ/שֹׁקֵ֥ט הוּא֙ אֶל שְׁמָרָ֔י/ו וְ/לֹֽא הוּרַ֤ק מִ/כְּלִי֙ אֶל כֶּ֔לִי וּ/בַ/גּוֹלָ֖ה לֹ֣א הָלָ֑ךְ עַל כֵּ֗ן עָמַ֤ד טַעְמ/וֹ֙ בּ֔/וֹ וְ/רֵיח֖/וֹ לֹ֥א נָמָֽר־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/011.yaml
  text: Moab has been at ease from his youth[a], and he has been undisturbed on his dregs; he has not been poured from vessel to vessel, and he has not gone into exile. Therefore his taste has remained in him, and his scent has not changed.
translation:
  language: zh_hans
  text: 摩押自幼安逸，一直静置在酒渣上[a]；他没有被从一个器皿倒进另一个器皿，也未曾流亡。因此，他的滋味仍旧，他的香气未变。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文采用酿酒的比喻：酒若长期留在沉渣上，没有倒入别的器皿，滋味和香气就不会改变。“酒渣”也可译作“酒脚”。
    reason: 说明古代酿酒意象及词义备选，帮助现代读者理解后文倒换器皿的说法。
lexical_decisions:
- source_word: שַׁאֲנַן
  choice: 安逸
  rationale: 表达长期安稳、未受扰动的状态，同时保留先知话语中对摩押安逸处境的批判意味。
- source_word: מִנְּעוּרָיו
  choice: 自幼
  rationale: 自然、简洁地表达“从幼年起”，并延续把摩押人格化的写法。
- source_word: שֹׁקֵט ... אֶל שְׁמָרָיו
  choice: 一直静置在酒渣上
  rationale: 结合酿酒语境理解为酒液未被搅动、长期留在沉渣之上；“静置”既体现安静未动，也自然引出后面的倒换器皿意象。
- source_word: הוּרַק מִכְּלִי אֶל כֶּלִי
  choice: 被从一个器皿倒进另一个器皿
  rationale: 保留希伯来文的被动形式和具体酿酒图景；“器皿”庄重且为现代读者所熟悉。
- source_word: וּבַגּוֹלָה לֹא הָלָךְ
  choice: 也未曾流亡
  rationale: 直接表达未进入被迁徙、流亡的境况，不把酿酒比喻与历史处境割裂。
- source_word: טַעְמוֹ
  choice: 他的滋味
  rationale: “滋味”在中文中适合酒的感官意象，也可保留其延伸含义，不提前解释为性情或本质。
- source_word: עָמַד ... בּוֹ
  choice: 仍旧
  rationale: 以简洁自然的中文表达持续不变的结果；与下句“未变”形成平行。
- source_word: רֵיחוֹ
  choice: 他的香气
  rationale: 在酒的语境中，“香气”比“气味”更自然，同时保留嗅觉意象。
- source_word: נָמָר
  choice: 未变
  rationale: 准确表达改变、变异之意，并与“滋味仍旧”相呼应。
theological_decisions:
- issue: 摩押的人格化及阳性单数表达
  choice: 以“他／他的”指称摩押
  alternative: 省略代词，或以“它／其”指称国家
  rationale: 希伯来文持续以阳性单数形式人格化摩押；中文采用“他”能保存这一文学效果，又不额外引入教义解释。
- issue: 酒的比喻与流亡历史之间的张力
  choice: 正文保留两层图景的并置，不将“滋味”和“香气”解释为摩押的性情或文化
  alternative: 将比喻意译为“性情未改”或“本性不变”
  rationale: 原文让酒的酿制图景与国家未曾流亡的历史处境彼此映照；直译关键意象可保留其开放性和先知话语的张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“安逸—静置—倒进—滋味—香气”贯穿同一比喻链；分号呈现酿酒图景与流亡处境的紧密联系。
