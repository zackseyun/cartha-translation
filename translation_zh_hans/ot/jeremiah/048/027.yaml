base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/027.yaml
  text: Was Israel not a laughingstock to you? Was he found among thieves[a], that whenever you spoke of him, you shook your head?
translation:
  language: zh_hans
  text: 以色列岂不是成了你的笑柄吗？难道他是在盗贼中间被发现的，以至于你每逢提到他就摇头[a]吗？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“晃动身体”。原文动词可指摇动、摆动或晃动；这里很可能是表示讥笑、轻蔑的动作。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשְּׂחֹק
  choice: 笑柄
  rationale: 该名词表示受人讥笑、嘲弄的对象；“笑柄”在现代汉语中自然、凝练，并保留被蔑视的意味。
- source_word: הָיָה לְךָ
  choice: 成了你的
  rationale: 介词 לְ 表明以色列在摩押眼中所处的地位；“成了你的笑柄”符合汉语表达，也传达原文的关系意味。
- source_word: אִם בְּגַנָּבִים נִמְצָאָה
  choice: 难道他被发现在盗贼中间
  rationale: 保留原文反问及“在盗贼中间被发现”的意象，不擅自解释为已经被捕或确属罪犯。
- source_word: כִּי מִדֵּי דְבָרֶיךָ בּוֹ
  choice: 以致你每逢提到他
  rationale: מִדֵּי 表示反复发生的情形，以“每逢”表达；דבר...בו 译作“提到他”，保留谈论对象的基本含义，不强行译成“攻击他”。כִּי 在此连接前面的反问与随后的惯常反应，译作“以致”使汉语关系清楚，同时不改变讥诮语境。
- source_word: תִּתְנוֹדָד
  choice: 摇头
  rationale: 该动词可表示摇动、摆动或晃动；在嘲讽语境中，“摇头”最自然地表现轻蔑动作，但其较宽泛的词义另收入脚注。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的反问句式。“笑柄”“每逢提到他”符合当代普通话；以“他”人格化指称以色列，与上下文对民族的拟人表达一致。脚注标记置于实际存在词义歧义的“摇头”之后。
