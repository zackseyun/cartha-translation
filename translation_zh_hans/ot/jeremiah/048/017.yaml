  text: נֻ֤דוּ ל/וֹ֙ כָּל סְבִיבָ֔י/ו וְ/כֹ֖ל יֹדְעֵ֣י שְׁמ֑/וֹ אִמְר֗וּ אֵיכָ֤ה נִשְׁבַּר֙ מַטֵּה עֹ֔ז מַקֵּ֖ל תִּפְאָרָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/017.yaml
  text: 'Mourn for him[a], all you around him, and all who know his name, say: “How the mighty scepter is broken[c][b], the staff of splendor!”'
translation:
  language: zh_hans
  text: '你们所有在他周围的人，都要为他哀悼[a]；所有知道他的名的人[b]，都要说：


    “强盛的权杖、荣耀的杖，竟然折断了！”[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “哀悼”也可译作“为他摇头叹息”或“哀号”；原文动词可表示哀悼，并常伴随身体动作。
    reason: lexical_alternative
  - marker: b
    text: “知道他的名”也可指熟知他的名声或声誉。
    reason: lexical_alternative
  - marker: c
    text: 原文“权杖”和“杖”所用的两个词都可指杖或棍；这里的意象很可能表示摩押已经折断的力量和荣耀。
    reason: lexical_alternative
lexical_decisions:
- source_word: נֻדוּ לֹו
  choice: 为他哀悼
  rationale: נוד在此为复数命令式，可指带有身体动作的同情哀悼。译作“为他哀悼”自然地衔接后面的挽歌，也不把可能伴随的摇头动作写死。
- source_word: כָּל סְבִיבָיו
  choice: 所有在他周围的人
  rationale: 保留“周围”的空间及群体含义，并以“他”承接被拟人化的摩押。
- source_word: וְכֹל יֹדְעֵי שְׁמוֹ
  choice: 所有知道他名声的人
  rationale: שֵׁם本义为“名”，在这里可兼指名望或声誉；上下文说的是认识摩押威势的周边群体，因此“名声”在现代汉语中更自然，同时用脚注保留直译可能。
- source_word: אֵיכָה
  choice: 竟然
  rationale: 该词引出哀歌式惊叹。汉语用“竟然”表现震惊和哀叹，比机械译作“如何”更符合此处感叹句功能。
- source_word: נִשְׁבַּר
  choice: 折断了
  rationale: Nifal完成式表达已经发生并形成结果的断裂；“折断了”准确、自然，并保留被动意义。
- source_word: מַטֵּה עֹז
  choice: 强有力的权杖
  rationale: מַטֶּה可指杖、棍或权杖；与עֹז搭配且处于国家覆亡语境中，“权杖”能传达统治与力量的象征，但不排除一般“杖”的词义。
- source_word: מַקֵּל תִּפְאָרָה
  choice: 荣耀的杖
  rationale: מַקֵּל为杖或棍，תִּפְאָרָה可指荣耀、华美或威荣；“荣耀的杖”保留诗歌平行结构及与前句用词的细微差异。
theological_decisions:
- issue: 两根杖的意象是否专指王权
  choice: 首句译“权杖”，次句译“杖”，并以脚注说明整体象征摩押的力量与荣耀
  alternative: 两处都译作普通的“杖”或都明确译成王权象征
  rationale: 原文两个名词均有“杖、棍”语义，מַטֶּה尤其可有权杖色彩。上下文支持国家权势的象征义，但未要求把两者都限定为君王权柄。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以分行保留挽歌的诗体和平行结构；“他”维持原文对摩押的拟人化。所有脚注标记均置于正文相应位置。
