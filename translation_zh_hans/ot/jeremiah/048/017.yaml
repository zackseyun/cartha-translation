  to: '你们所有在他周围的人，都要为他哀悼[a]；所有知道他的名的人[b]，都要说：


    “强盛的权杖、荣耀的杖，竟然折断了！”[c]'
  rationale: 修订保留摩押的男性拟人化、命令式的呼吁、哀歌式“竟然”，以及两个杖语的诗性并列。将两个名词短语置于同一“折断了”之下，避免添加“也”所造成的过度句法解释；并使措辞和脚注更贴近原文的具体意象。
