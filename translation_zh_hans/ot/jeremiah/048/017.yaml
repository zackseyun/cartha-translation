  terminology: “权杖／杖”妥善保留两个希伯来名词的差别及其可能的权势意象；“荣耀”也适合译出תפארה。脚注c的“已被摧毁”比原文“折断”的形象更宽泛，宜改为“已经折断的力量和荣耀”。
