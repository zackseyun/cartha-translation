source:
  edition: WLC
  text: וּ/בֹ֥שׁ מוֹאָ֖ב מִ/כְּמ֑וֹשׁ כַּ/אֲשֶׁר בֹּ֨שׁוּ֙ בֵּ֣ית יִשְׂרָאֵ֔ל מִ/בֵּ֥ית אֵ֖ל מִבְטֶחָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/013.yaml
  text: And Moab will be put to shame because of Chemosh[a], just as the house of Israel was put to shame because of Bethel[b], their confidence.
translation:
  language: zh_hans
  text: 摩押必因基抹[a]蒙羞，正如以色列家因他们所倚靠的伯特利[b]蒙羞一样。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“必以基抹为耻。”希伯来语较直译可表达对基抹感到羞耻；这里的意思是，摩押倚赖基抹，最终却因此蒙羞。
    reason: lexical_alternative
  - marker: b
    text: 伯特利是北国以色列与牛犊敬拜有关的圣所。原文较直译为：“因伯特利——他们所倚靠的——蒙羞。”
    reason: cultural_note
lexical_decisions:
- source_word: וּבֹשׁ
  choice: 必……蒙羞
  rationale: בוש在审判语境中表示落得羞耻、遭受公开羞辱；“蒙羞”既自然又保留结果性的含义。“必”体现先知话语所指向的将来结果。
- source_word: מוֹאָב
  choice: 摩押
  rationale: 采用现代中文圣经及历史地理语境中通行的国名译法。
- source_word: מִכְּמוֹשׁ
  choice: 因基抹
  rationale: בוש后的介词מִן可表示羞耻所关涉的对象或缘由；这里与下半句平行，意为摩押因倚赖基抹而落得羞耻，同时脚注保留“以基抹为耻”的较直译可能。
- source_word: כַּאֲשֶׁר
  choice: 正如……一样
  rationale: 清楚表达摩押将来的羞辱与以色列家先前遭遇之间的比较。
- source_word: בֹּשׁוּ
  choice: 蒙羞
  rationale: 与前一处בוש采用相同措辞，以保留原文的词语呼应；中文不必显明区分单复数。
- source_word: בֵּית יִשְׂרָאֵל
  choice: 以色列家
  rationale: 保留“家”的集体性和民族—圣约色彩，不简化为“以色列”。
- source_word: מִבֵּית אֵל
  choice: 因……伯特利
  rationale: בֵּית אֵל在此是北国的敬拜中心伯特利，而非普通名词“神的殿”；“因”自然表达其作为以色列倚靠对象而导致羞辱的关系。
- source_word: מִבְטֶחָם
  choice: 他们所倚靠的
  rationale: 该词指信赖或安全感的对象。改用定语结构修饰“伯特利”，比直译“他们的倚靠”更符合现代汉语，也保留原文的讽刺意味。
theological_decisions:
- issue: 伯特利的所指
  choice: 将“伯特利”理解并译作北国以色列所倚靠的敬拜中心。
  alternative: 按名称字面译作“神的殿”。
  rationale: 上下文把摩押倚赖基抹与以色列倚赖伯特利相比较。译作地名能保存历史性的偶像敬拜指涉，避免使读者误以为这里谴责的是对真神的信靠。
- issue: מִן与בוש搭配所表达的关系
  choice: 正文译为“因……蒙羞”，表达倚赖对象使其最终受辱。
  alternative: 译为“以……为耻”或“离开……而羞愧”。
  rationale: 希伯来语容许以相关对象或来源理解该介词。语境强调错误倚赖导致羞辱，但这种语法歧义是真实的，因此正文采用较合语境的因果表达，并在脚注中保留另一译法。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“蒙羞”保留先知审判话语的力度；“他们所倚靠的伯特利”以自然汉语呈现同位关系。正文中的[a]、[b]均与脚注对应。
