base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/002.yaml
  text: 'There is no more praise for Moab[a]. In Heshbon they have devised evil against her: ‘Come, let us cut her off from being a nation.’ You too, Madmen, will be silenced[b]; the sword will go after you.'
translation:
  language: zh_hans
  text: 摩押不再受人称颂[a]。在希实本，人们谋划要加害她，说：“来吧，我们把她剪除，使她不再成为国家。”玛得缅哪，你也必沉寂无声[b]；刀剑必追赶你。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “希实本”和“谋划”在希伯来语中读音相近，形成城名与“谋划”一词之间的双关。
    reason: lexical_alternative
  - marker: b
    text: “玛得缅”很可能是地名；它与紧随其后的希伯来语动词“沉寂／止息”读音相近，借双关加强审判的信息。
    reason: cultural_note
lexical_decisions:
- source_word: תְּהִלַּת
  choice: 受人称颂
  rationale: 该名词可指赞美、声誉或荣名。此处表达摩押昔日受人称道的地位终止；译作“受人称颂”既贴近词义，也符合现代汉语。
- source_word: בְּחֶשְׁבּוֹן
  choice: 在希实本
  rationale: 介词 ב 在此最自然地作地点解，表明计谋是在希实本策划的，并保留该城名与后面动词 חָשְׁבוּ 的希伯来语双关。
- source_word: חָשְׁבוּ עָלֶיהָ רָעָה
  choice: 人们谋划要加害她
  rationale: חשׁב 表示筹划、谋算；רָעָה 在这里可兼有恶意、祸害之意。“谋划要加害她”自然地表达敌对计谋，同时不把含义限定为单纯的道德邪恶或抽象灾祸。
- source_word: לְכוּ וְנַכְרִיתֶנָּה מִגּוֹי
  choice: 来吧，我们把她剪除，使她不再成国
  rationale: 命令式与意愿式构成敌人的直接引语。Hiphil 词形的 כרת 有“剪除、除灭”之意；מִגּוֹי 表明目的在于使摩押失去国家身份。
- source_word: מַדְמֵן
  choice: 玛得缅
  rationale: 在摩押审判预言的地名序列中，最宜视为地名。采用音译，并由脚注说明它与后面“沉寂无声”的语音双关。
- source_word: תִּדֹּמִּי
  choice: 必沉寂无声
  rationale: דמם 的基本意思是静默、止息；在审判语境中也暗示遭毁灭后的寂静。“沉寂无声”保留这种含蓄而 ominous 的张力。
- source_word: אַחֲרַיִךְ תֵּלֶךְ חָרֶב
  choice: 刀剑必追赶你
  rationale: 原文将刀剑拟人化，直译为“刀剑要在你后面行走”。“追赶你”以自然汉语保留军事毁灭紧随其后的生动画面。
- source_word: אֵין עוֹד
  choice: 不再
  rationale: 该表达表示某种状态已经终止。“不再”简洁自然，准确引出摩押声誉的消逝。
theological_decisions: []
