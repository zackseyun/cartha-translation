  source_fidelity: 译文忠实呈现了希伯来文的解释性连接词 כִּי，以及四项哀悼标志：剃头、剪除胡须、手上有割痕、腰间有麻布。 “剃光了头”在哀悼语境中可恰当表达 קָרְחָה 的结果状态；“剪去了胡须”也保留了 גְּרֻעָה 所指削减／剪除之意，未不当地加入神学或历史性解释。
