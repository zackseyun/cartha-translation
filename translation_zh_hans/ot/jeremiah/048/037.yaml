  text: כִּ֤י כָל רֹאשׁ֙ קָרְחָ֔ה וְ/כָל זָקָ֖ן גְּרֻעָ֑ה עַ֤ל כָּל יָדַ֨יִם֙ גְּדֻדֹ֔ת וְ/עַל מָתְנַ֖יִם שָֽׂק־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/037.yaml
  text: For every head is bald[a], and every beard is cut off; on all the hands are gashes[b], and on the waist is sackcloth.
translation:
  language: zh_hans
  text: 因为人人都剃光了头，人人都剪去了胡须；人人手上都有割痕，腰间都围着麻布。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，为哀哭景象说明缘由，保留希伯来语的解释或因果作用。
- source_word: כָל רֹאשׁ קָרְחָה
  choice: 人人都剃光了头
  rationale: קָרְחָה表示秃头或剃发；本节列举哀悼习俗，译为“剃光了头”比静态的“头都秃了”更自然，也符合语境。
- source_word: וְכָל זָקָן גְּרֻעָה
  choice: 人人都剪去了胡须
  rationale: גְּרֻעָה源于表示减少、削去的词根；这里指为哀悼而剪除胡须。“剪去了”既保留动作结果，也不强行限定是否完全剃净。
- source_word: עַל כָּל יָדַיִם גְּדֻדֹת
  choice: 人人手上都有割痕
  rationale: גְּדֻדֹת指哀悼时划出的伤口或割痕；“割痕”准确且自然。יָדַיִם直译为“手”，在此也可能宽泛包括手臂，但正文保留原文表达。
- source_word: וְעַל מָתְנַיִם שָׂק
  choice: 腰间都围着麻布
  rationale: מָתְנַיִם指腰胯部位；“腰间”是现代汉语自然说法。שָׂק是哀悼所穿的粗麻布，“围着”清楚呈现其穿在腰身的图像。
