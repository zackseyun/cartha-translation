  text: and against Kerioth[a], and against Bozrah, and against all the cities of the land of Moab, far and near.
translation:
  language: zh_hans
  text: 又攻击基略，攻击波斯拉，攻击摩押地所有的城，无论远近。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַל
  choice: 又攻击／攻击
  rationale: 本节承接审判名单；反复出现的介词 עַל 表示敌对行动所针对的对象。中文用“攻击”自然传达其方向与语境，首处以“又”承接上文，其后省去重复的连接词以保持流畅。
- source_word: קְרִיּוֹת
  choice: 基略
  rationale: 此处是摩押城名，虽词形呈复数形态，仍按专名音译，不按普通名词译作“城邑”。
- source_word: בָּצְרָה
  choice: 波斯拉
  rationale: 此处是摩押境内的城名，按专名音译，不译作普通名词。
- source_word: כָּל עָרֵי אֶרֶץ מוֹאָב
  choice: 摩押地所有的城
  rationale: 忠实表达该结构链，同时采用自然的现代汉语语序；“所有的城”保留 כָּל 所表达的全体范围。
- source_word: הָרְחֹקוֹת וְהַקְּרֹבוֹת
  choice: 无论远近
  rationale: 两个带定冠词的阴性复数形容词修饰前面的“城”，构成涵盖全部的两极表达。“无论远近”在现代汉语中简洁自然，并保留所有远近城邑无一例外的含义。
theological_decisions: []
