  text: וְ/יָבֹ֨א שֹׁדֵ֜ד אֶל כָּל עִ֗יר וְ/עִיר֙ לֹ֣א תִמָּלֵ֔ט וְ/אָבַ֥ד הָ/עֵ֖מֶק וְ/נִשְׁמַ֣ד הַ/מִּישֹׁ֑ר אֲשֶׁ֖ר אָמַ֥ר יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/008.yaml
  text: And the destroyer will come against every city[a], and no city will escape; the valley will perish, and the plain will be destroyed, as Yahweh has said.
translation:
  language: zh_hans
  text: 毁灭者必来攻击每一座城，没有一城能够逃脱；谷地必灭亡，高原[a]必被毁灭，正如雅威所说。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“平原”或“台地”。希伯来语指平坦之地；在摩押，这个词可能特指地势较高的台地区域。
    reason: lexical_alternative
lexical_decisions:
- source_word: שֹׁדֵד
  choice: 毁灭者
  rationale: 该分词名词指实施毁坏或掠夺的人；“毁灭者”符合审判语境，也比“劫掠者”更能涵盖此处的全面毁坏。
- source_word: וְיָבֹא אֶל כָּל עִיר
  choice: 必来攻击每一座城
  rationale: 未完成式在预言语境中具有将来意味；אֶל本义表示趋向，但与“毁灭者”连用时含敌对行动，“来攻击”自然地传达这一含义。
- source_word: וְעִיר לֹא תִמָּלֵט
  choice: 没有一城能够逃脱
  rationale: 单数“城”承接前面的周遍表达，意思是无一例外；此译既自然又保留审判的彻底性。
- source_word: הָעֵמֶק
  choice: 谷地
  rationale: עֵמֶק通常指山谷或谷地区域；定冠词在这里可能特指摩押的谷地区域，“谷地”兼顾地貌与地域含义。
- source_word: וְאָבַד
  choice: 必灭亡
  rationale: אבד在此表示遭受毁灭、归于败亡；“灭亡”符合先知审判语言。
- source_word: הַמִּישֹׁר
  choice: 高原
  rationale: מִישׁוֹר可指平地、台地；在摩押地理语境中常指地势较高而平坦的区域。“高原”能与前面的“谷地”形成清楚对照。
- source_word: וְנִשְׁמַד
  choice: 必被毁灭
  rationale: שׁמד的尼法勒式表示遭到毁灭；被动表达忠实呈现语态，又不过度强化为“被彻底消灭”。
- source_word: אֲשֶׁר אָמַר יְהוָה
  choice: 正如雅威所说的
  rationale: 该关系从句表明预言按照雅威已经说出的话实现；译文保留神圣宣告的权威性。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；“雅威”以现代汉语音译呈现这一专名，不将其改写为称号。
- issue: 地貌 הַמִּישֹׁר 的具体所指
  choice: 高原
  alternative: 平原；台地
  rationale: 该词本身可泛指平坦之地，但在摩押语境中可能专指高处的平坦地区；正文采用“高原”，脚注保留词义与地理所指的可能范围。
translation_notes:
  register: 采用庄重而清晰的现代标准汉语。“必”体现预言性的将来语气；分号呈现城市与两类地貌之间并列而递进的审判结构。
