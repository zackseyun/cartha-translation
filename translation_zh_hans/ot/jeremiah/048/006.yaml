base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/006.yaml
  text: Flee! Escape with your lives[b][a], and be like a juniper in the wilderness.
translation:
  language: zh_hans
  text: 你们要逃走！保全自己的性命，要像旷野中的一棵杜松[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里所指的植物不能确定，也可能译作“柽柳”或笼统译作“荒漠灌木”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“要像旷野中的亚罗珥。”希伯来语עֲרוֹעֵר既可理解为地名，也可理解为一种荒漠灌木；这里的比喻和“旷野中”较支持植物的解释。
    reason: alternative_reading
lexical_decisions:
- source_word: נֻסוּ
  choice: 逃走
  rationale: 这是复数命令式，直接命令众人逃离；“逃走”简洁自然，并保留原文的紧迫感。
- source_word: מַלְּטוּ נַפְשְׁכֶם
  choice: 保全自己的性命
  rationale: מלט与נפש连用，在此指逃脱而保存生命，并非抽象地拯救“灵魂”；此译符合现代汉语表达。
- source_word: וְתִהְיֶינָה
  choice: 要像
  rationale: 该未完成式承接前面的命令，具有命令或劝令语气；汉语以“要像”自然地延续命令序列。
- source_word: כַּעֲרוֹעֵר
  choice: 像……一棵杜松
  rationale: עֲרוֹעֵר在此可能指一种荒漠灌木，也可能是地名“亚罗珥”。上下文“旷野中”较支持植物比喻，但具体树种不能确定，因此正文采用传统且易懂的“杜松”，并以脚注保留两层不确定性。
- source_word: בַּמִּדְבָּר
  choice: 旷野中
  rationale: “旷野”兼顾荒凉地带的含义与庄重的圣经语体，在现代汉语中也清楚自然。
