base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/009.yaml
  text: Give a wing to Moab[a], for she will surely flee away; and her cities will become a desolation[b], with no inhabitant in them.
translation:
  language: zh_hans
  text: 给摩押一只翅膀吧[a]，因为她必定飞走[b]；她的城邑必成为荒凉之地，其中无人居住。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “翅膀”所译的希伯来词通常指“花”“花饰”或“饰片”，也可译作“给摩押花饰吧”。但鉴于下句的离去意象，正文采用“翅膀”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译为“出去，她必出去”；不定式绝对式与动词连用，表示强调，可译为“她必定离去”。正文的“飞走”承接前句“翅膀”的意象。
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּנוּ
  choice: 给……吧
  rationale: 复数祈使式；用“给……吧”保留先知诗歌中带有催促或讥讽意味的号召，中文也自然。
- source_word: צִיץ
  choice: 翅膀
  rationale: 该词通常可指花、花饰或饰片，但本节紧接“必飞去”的意象，因此正文采用“翅膀”；其罕见性与另一可能释义在脚注说明。
- source_word: לְמוֹאָב
  choice: 给摩押
  rationale: לְ在此作与格；与“给”搭配译为“给摩押”最自然。
- source_word: כִּי
  choice: 因为
  rationale: 引出前一祈使句的理由，现代汉语用“因为”清楚自然。
- source_word: נָצֹא תֵּצֵא
  choice: 她必飞去
  rationale: 不定式绝对形与限定动词连用表示加强，故用“必”；基本动词义为“出去、离去”，但受前句翅膀意象影响译作“飞去”，同时在脚注保留直译可能。
- source_word: וְעָרֶיהָ
  choice: 她的城邑
  rationale: 阴性单数后缀指摩押；“城邑”符合庄重的先知书语体。
- source_word: לְשַׁמָּה תִהְיֶינָה
  choice: 必变为荒场
  rationale: לְ与“成为”结构表达结果；שַׁמָּה指荒废、毁坏之地，“荒场”简洁而有审判语气。
- source_word: מֵאֵין יוֹשֵׁב בָּהֵן
  choice: 无人居住
  rationale: 表达城中完全没有居民；中文不必重复“在其中”，即可准确清楚地传达意思。
