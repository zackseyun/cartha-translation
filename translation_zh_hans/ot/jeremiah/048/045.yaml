base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/045.yaml
  text: In the shadow of Heshbon the fugitives stand without strength[a], for a fire has gone out from Heshbon, and a flame from the midst of Sihon[d][c][b]; it has consumed the corner of Moab and the crown of the head of the sons of tumult.
translation:
  language: zh_hans
  text: 逃亡者无力地站在希实本的阴影下[a]；因为有火从希实本发出，有火焰从西宏中间发出[b]，烧尽了摩押的一角[c]和喧嚷之子的头顶[d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“逃亡者因无力站在希实本的阴影下。”希伯来语完成式动词可随上下文译作过去时，如“站住了”；מִכֹּחַ也可译为“因乏力”或“因缺乏力量”。
    reason: lexical_alternative
  - marker: b
    text: 直译“从西宏中间”，也可译“从西宏那里”或“从西宏之间”。“西宏”可能借代与他相关的城或国土。
    reason: lexical_alternative
  - marker: c
    text: 或译：“摩押的边缘”。希伯来语“一角”是诗歌意象，可指边缘或极处。
    reason: lexical_alternative
  - marker: d
    text: 或译：“喧闹者的头顶”或“喧嚷之人的头顶”。原文直译为“喧嚷之子的头顶”；其具体所指并不完全确定。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּצֵל חֶשְׁבּוֹן
  choice: 在希实本的荫下
  rationale: 保留צֵל“荫、阴影”的具体意象及בְּ的处所意义；“荫下”在现代汉语中自然且具有诗意。
- source_word: עָמְדוּ מִכֹּחַ נָסִים
  choice: 逃亡的人因无力，只得站着
  rationale: נָסִים是נוס的分词，指正在逃亡的人；מִכֹּחַ在此可表示因力气不足。加入“只得”自然表达逃亡者无力再走、停立不前的语境含义，但不把动作改译为坐下或倒下。
- source_word: אֵשׁ יָצָא מֵחֶשְׁבּוֹן
  choice: 有火从希实本发出
  rationale: 直接保留“火出来”的毁灭性意象，同时采用自然、庄重的现代汉语表达。
- source_word: מִבֵּין סִיחוֹן
  choice: 从西宏中间
  rationale: מִבֵּין字面为“从……中间”；西宏可能借代与他相关的城或领域，正文保留原文较难解的表达，不擅自明确所指。
- source_word: וַתֹּאכַל
  choice: 烧尽了
  rationale: 动词本义为“吞吃”，以火为主语时译作“烧尽”自然准确，也保留彻底毁灭的力度。
- source_word: פְּאַת מוֹאָב
  choice: 摩押的一角
  rationale: פֵּאָה可指角、边缘或极处；“一角”保留原文诗歌性的身体或地理隐喻，不直接限定为边境。
- source_word: וְקָדְקֹד בְּנֵי שָׁאוֹן
  choice: 喧嚷之子们的头顶
  rationale: קָדְקֹד指头顶；בְּנֵי שָׁאוֹן字面为“喧嚷之子”，其确切指涉具有诗性歧义，正文保留这一表达。
