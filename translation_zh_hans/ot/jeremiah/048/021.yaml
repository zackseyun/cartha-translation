id: JER.48.21
reference: Jeremiah 48:21
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וּ/מִשְׁפָּ֥ט בָּ֖א אֶל אֶ֣רֶץ הַ/מִּישֹׁ֑ר אֶל חֹל֥וֹן וְ/אֶל יַ֖הְצָ/ה וְ/עַל מופעת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/021.yaml
  text: And judgment has come upon the land of the plateau—upon Holon[a], and upon Jahzah[b], and upon Mephaath—
translation:
  language: zh_hans
  text: 审判已临到高原之地[a]，临到何伦，临到雅杂[b]，也临到米法押——
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“平原之地”或“台地”。希伯来语所指的是地势平坦的高地。
    reason: lexical_alternative
  - marker: b
    text: “雅杂”也可译作“雅哈斯”。
    reason: alternative_reading
lexical_decisions:
- source_word: וּמִשְׁפָּט
  choice: 审判
  rationale: מִשְׁפָּט可指审判、公正或判罚；在针对摩押的灾祸宣告中，这里指已经施行的司法性裁决。“审判”既保留法律意涵，也不把词义过早收窄为“刑罚”。
- source_word: בָּא
  choice: 已临到
  rationale: 完成式在先知话语中可用确定、鲜明的方式宣告审判。“已临到”保留这种仿佛已经实现的确定性。
- source_word: אֶל אֶרֶץ הַמִּישֹׁר
  choice: 临到高原之地
  rationale: מִישֹׁר指平坦的高地、台地或高原；结合外约旦地形，“高原之地”比容易让人联想到低洼地带的“平原”更准确。此处אֶל与בוא连用，译作“临到”符合现代汉语。
- source_word: חֹלוֹן
  choice: 何伦
  rationale: 地名按现代中文圣经传统音译。
- source_word: יַהְצָה
  choice: 雅杂
  rationale: 地名采用简洁且已有中文传统的音译；脚注列出另一常见形式“雅哈斯”。
- source_word: מופעת
  choice: 米法押
  rationale: 摩押城邑名，采用通行的中文音译。
- source_word: וְעַל
  choice: 也临到
  rationale: 列表中介词由אֶל转为עַל，但语义差别很小；“也临到”保持审判逐城落下的节奏，同时使中文自然。
theological_decisions:
- issue: מִשְׁפָּט在灾祸宣告中是“审判”还是“刑罚”
  choice: 审判
  alternative: 刑罚
  rationale: 上下文确实包含惩罚性后果，但原词仍带有司法裁决的广义色彩；译作“审判”可保留其神学与法律张力，而不把结果与裁决本身完全等同。
translation_notes:
  register: 采用庄重而清晰的现代标准汉语。重复“临到”以保留原文列举各地时的宣告节奏；句末破折号表明城邑名单在下一节继续。
