  text: וְ/שַׁבְתִּ֧י שְׁבוּת מוֹאָ֛ב בְּ/אַחֲרִ֥ית הַ/יָּמִ֖ים נְאֻם יְהוָ֑ה עַד הֵ֖נָּה מִשְׁפַּ֥ט מוֹאָֽב־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/047.yaml
  text: Yet I will restore the fortunes of Moab in the latter days[a], declares Yahweh. Thus far is the judgment of Moab.
translation:
  language: zh_hans
  text: '“但在末后的日子，我必扭转摩押的境况[a]。”这是耶和华的宣告。


    对摩押的审判，到此为止。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“使摩押被掳的人归回”；希伯来语这一习语既可指从被掳之地归回，也可较广泛地指境况得到恢复。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׁבְתִּי
  choice: 但……我必扭转
  rationale: 在连续的审判宣告之后，וְ 在此带出转折；“但”自然呈现这一语境作用。与 שְׁבוּת 连用时，שוב 表示使原有困境发生逆转。
- source_word: שְׁבוּת
  choice: 境况
  rationale: שוב שׁבות 是一个可指被掳者归回、也可泛指命运或境况恢复的习语。“扭转……的境况”在现代汉语中自然，并保留其较宽泛的含义；较具体的“被掳者归回”列入脚注。
- source_word: מוֹאָב
  choice: 摩押
  rationale: 采用现代中文圣经传统中通行的国名译法。
- source_word: בְּאַחֲרִית הַיָּמִים
  choice: 在末后的日子
  rationale: 既可指从先知视角所见的未来时期，也可能带有末世意味；“末后的日子”保留这两者之间的张力，不将其平化为单纯的“将来”。
- source_word: נְאֻם יְהוָה
  choice: 这是耶和华的宣告
  rationale: 庄重而清楚地再现先知书中常见的神谕公式，并按专名译出 יְהוָה。
- source_word: עַד הֵנָּה
  choice: 到此为止
  rationale: 自然表达该短语标示本段神谕结束的功能。
- source_word: מִשְׁפַּט
  choice: 审判
  rationale: 此处指针对摩押的司法性判决或审判宣告，而非抽象的“公义”；“审判”最贴合上下文，同时保留所指究竟是判决内容还是整段审判之言的空间。
theological_decisions:
- issue: 摩押未来复兴的范围与性质
  choice: 按经文直译为在“末后的日子”扭转摩押的境况，不进一步说明实现方式。
  alternative: 将其限定为政治复国、被掳者归回，或解释为末世中列国蒙怜悯。
  rationale: 希伯来文明确应许摩押将来得到恢复，却没有界定这是近期历史事件、末世事件还是具有预表意义的事件；译文因此保留应许及时间表达本身的开放性。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“扭转……的境况”避免过度口语化的“时来运转”，也不把恢复范围收窄为政治复国或被掳者归回。分行处理使结尾公式“对摩押的审判，到此为止”清楚标示摩押神谕的结束。
