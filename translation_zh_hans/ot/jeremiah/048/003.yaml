lexical_decisions:
- source_word: קוֹל צְעָקָה
  choice: 哀号声
  rationale: קוֹל引出可听见的声音，צְעָקָה指在灾难中的呼喊或哀号；合译为“哀号声”符合现代汉语，也保留强烈的悲痛语气。
- source_word: מֵחֹרוֹנָיִם
  choice: 从何罗念传来
  rationale: מִן表示声音的来源；“传来”自然表达声音从该地发出。地名按常见中文圣经音译作“何罗念”。
- source_word: שֹׁד
  choice: 毁灭
  rationale: 该词可指蹂躏、毁坏或灾祸；此处作为惊呼，译作“毁灭”简洁有力。
- source_word: שֶׁבֶר גָּדוֹל
  choice: 大破坏
  rationale: שֶׁבֶר可指破碎、崩溃或毁坏，גָּדוֹל加强程度；译作“大破坏”保留与前词近义并列的递进冲击。
