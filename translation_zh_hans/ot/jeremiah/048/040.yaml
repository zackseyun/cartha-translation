base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/040.yaml
  text: 'For thus says the LORD: Look, like an eagle he swoops down and spreads his wings over Moab.'
translation:
  language: zh_hans
  text: '耶和华如此说：


    “看哪，他必像鹰一样飞来，


    向摩押展开翅膀。”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי כֹה אָמַר יְהוָה
  choice: 耶和华如此说
  rationale: 按先知宣告的常用句式直译；כִּי 在此引出或承接宣告，中文无需另译“因为”，以免句意生硬。
- source_word: הִנֵּה
  choice: 看哪
  rationale: 保留原文唤起注意、增强现场感的功能，并采用庄重而易懂的先知文学用语。
- source_word: כַנֶּשֶׁר
  choice: 如鹰
  rationale: נֶשֶׁר 可指鹰或大型兀鹫类猛禽；此处强调迅猛飞袭的形象，译作“鹰”最自然，也保留传统意象。
- source_word: יִדְאֶה
  choice: 必……飞扑而下
  rationale: 该动词描述迅疾飞翔、俯冲或猛扑；结合审判语境，译为“飞扑而下”表达猛禽袭来的动态。未明说主语身份，照原文保留“他”。
- source_word: וּפָרַשׂ כְּנָפָיו אֶל מוֹאָב
  choice: 向摩押展开翅膀
  rationale: 保留介词 אֶל 的方向意味“向”，不将其过度解释为“覆盖”或“攻击”，让上下文决定意象的具体含义。
theological_decisions:
- issue: 猛禽形象中“他”的指代
  choice: 保留第三人称“他”，不明确补作巴比伦王、敌军或耶和华
  alternative: 译为“敌人”或“巴比伦必如鹰……”
  rationale: 希伯来文本只有阳性单数动词，并未在本节明说所指；保留代词可维持原文的指代张力，避免把上下文推断写入正文。
- issue: “向摩押展开翅膀”的审判含义
  choice: 按意象直译，不直接释为攻占或毁灭
  alternative: 译为“张开翅膀攻击摩押”或“覆盖摩押”
  rationale: 本节借猛禽动作描绘临到摩押的威胁；原文未直接使用“攻击”或“毁灭”，故不在正文中补足解释。
translation_notes:
  register: 采用现代、庄重、可朗读的先知宣告体。“看哪”保留警示力度；分行呈现诗性意象。用“耶和华”对应神名 יהוה；语言避免古奥，同时不淡化审判场景的迅猛感。
