  text: עַל כֵּ֞ן לִבִּ֤/י לְ/מוֹאָב֙ כַּ/חֲלִלִ֣ים יֶהֱמֶ֔ה וְ/לִבִּ/י֙ אֶל אַנְשֵׁ֣י קִֽיר חֶ֔רֶשׂ כַּ/חֲלִילִ֖ים יֶהֱמֶ֑ה עַל כֵּ֛ן יִתְרַ֥ת עָשָׂ֖ה אָבָֽדוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/036.yaml
  text: Therefore my heart moans for Moab like flutes, and my heart moans like flutes for the men of Kir-heres, because the abundance he made has perished.
translation:
  language: zh_hans
  text: 因此，我的心为摩押像笛声一样哀鸣；我的心为吉珥—哈列设的人也像笛声一样哀鸣；因为他所得的财富都毁灭了。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “他”可理解为把摩押作为一个整体来指称。末句直译可作：“因为他所造就的丰盛都毁灭了。”
    reason: 说明希伯来文阳性单数主语可能指集体性的摩押，并保留עָשָׂה可表示“作成、造就”而不只表示“获得”的语义幅度。
lexical_decisions:
- source_word: יֶהֱמֶה
  choice: 哀鸣
  rationale: 该动词表示发出低沉、骚动的声响；在哀悼语境中译为“哀鸣”，既传达声音意象，也符合心中悲痛的语境。
- source_word: כַחֲלִלִים
  choice: 如同吹奏的笛声
  rationale: חֲלִילִים 是复数“笛子、管乐器”；此处比拟哀鸣之声，补出“吹奏的……声”使现代汉语自然，同时保留乐器意象。
- source_word: קִיר חֶרֶשׂ
  choice: 吉珥—哈列设
  rationale: 按希伯来地名音译，并用连接号表明它是一个复合地名。
- source_word: יִתְרַת עָשָׂה
  choice: 他所积攒的余财
  rationale: יִתְרַת 指剩余、盈余或富余之物；עָשָׂה 字面为“他做成/取得”，在财富语境中自然译作“所积攒的”，并保留阳性单数主语“他”。
- source_word: אָבָדוּ
  choice: 都消失了
  rationale: 该复数动词表示灭亡、失去或不复存在；以“都消失了”表达财富尽失，并反映复数形式的总体性。
theological_decisions:
- issue: “我的心”所指的说话者
  choice: 保留第一人称，不明确指定为耶利米或耶和华
  alternative: 译成“我的心（耶和华的心）”或在正文中说明说话者
  rationale: 本节自身没有显式标明说话者；保留原文的人称可维持先知话语中真实的指涉张力。
- issue: 末句阳性单数“他”的所指
  choice: 正文保留“他”，以脚注说明通常可理解为集体性的摩押
  alternative: 直接改译为“他们所积攒的”或“摩押所积攒的”
  rationale: 马所拉文本为阳性单数“他所做/所得的”，不宜无提示地改成复数或补明专名。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“哀鸣”与两次“如同吹奏的笛声”保留原文的重复和哀歌节奏；地名依常见圣经音译处理。
