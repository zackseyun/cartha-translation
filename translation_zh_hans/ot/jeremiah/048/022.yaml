  text: 也临到底本，也临到尼波，也临到伯·低比拉太音——
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/עַל
  choice: 也临到
  rationale: 本节接续上一节“审判临到……”的地名清单；重复译为“也临到”，既体现 וְ/עַל 的并列与指向，也用自然的现代汉语保留审判逐处临到的语势。
- source_word: דִּיבוֹן
  choice: 底本
  rationale: 摩押地名，采用现代中文圣经读者较熟悉的传统音译。
- source_word: נְבוֹ
  choice: 尼波
  rationale: 此处作地名，不按其可能关联的神名或山名加以解释，采用通行音译。
- source_word: בֵּית דִּבְלָתַיִם
  choice: 伯·低比拉太音
  rationale: 复合地名整体音译；间隔号提示其复合结构，同时避免把 בֵּית 直译成“家”而使读者误以为是普通名词短语。末尾“太音”近似保留希伯来语双数形式 -ַיִם 的读音。
