  yaml_path: translation/ot/jeremiah/048/014.yaml
  text: How can you say[a], ‘We are mighty men, men of valor for battle’?”
translation:
  language: zh_hans
  text: 你们怎能说：“我们是勇士，是善战的壮士[a]”？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “勇士”也可译作“大能者”；“善战的壮士”直译作“有勇力的人，为作战而有勇力的人”。
    reason: 保留 גִּבּוֹרִים 与 אַנְשֵׁי חַיִל 在军事语境中的可选译法，并说明后者与“作战”的关联。
lexical_decisions:
- source_word: אֵיךְ
  choice: 怎能
  rationale: 这里引出带有责问和不信意味的反问；“怎能”比单纯的“怎样”更自然地传达这种语气。
- source_word: תֹּאמְרוּ
  choice: 你们说
  rationale: 这是אמר的Qal未完成式第二人称阳性复数；与“怎能”连用，构成自然的现代汉语反问。
- source_word: גִּבּוֹרִים
  choice: 勇士
  rationale: 该词在军事语境中指强有力、善战的人；“勇士”简洁、自然，并保留其褒扬武力的色彩。
- source_word: אֲנָחְנוּ
  choice: 我们是
  rationale: 独立人称代词在自我夸示的话中有强调作用；汉语补出判断词“是”，表达自然。
- source_word: וְאַנְשֵׁי חַיִל
  choice: 是……英勇的人
  rationale: 构造短语指有力量、勇武或才干的人；结合战争语境译为“英勇的人”，但不把חַיִל的宽广语义缩减为单一技术性军衔。
- source_word: לַמִּלְחָמָה
  choice: 上阵
  rationale: 介词ל表示与作战有关的用途或适任性；“上阵”自然地表达“为战事、适于作战”，并与“英勇的人”合成流畅短语。
