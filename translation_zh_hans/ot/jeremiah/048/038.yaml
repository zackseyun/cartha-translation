revisions:
- from: 摩押所有的房顶和城中广场上，到处都是哀哭；因为我打碎了摩押，好像打碎一件不讨人喜爱的器皿[a]。这是雅威的宣告。
  to: 在摩押所有的房顶上和各处广场上，处处都有哀号；因为我已使摩押破碎，如同一件不再受人喜爱的器皿[a]。这是雅威的宣告。
  rationale: 修订只调整汉语范围、哀悼用语及核心比喻的句法关系。“已使……破碎”表达完成的神圣审判行动；“如同一件不再受人喜爱的器皿”保留 אֵין חֵפֶץ בּוֹ 的“没有喜悦／喜爱”意象，脚注提供“无人想要”的自然替代译法，而不武断扩展为“毫无用处”。
