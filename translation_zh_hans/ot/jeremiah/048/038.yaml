base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/038.yaml
  text: On all the rooftops of Moab and in her squares[a], everywhere there is mourning; for I have broken Moab like a vessel in which there is no delight, declares Yahweh.
translation:
  language: zh_hans
  text: 在摩押所有的房顶上和各处广场上，处处都有哀号；因为我已使摩押破碎，如同一件不再受人喜爱的器皿[a]。这是雅威的宣告。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“一件无人想要的器皿。”希伯来文直译为“一件其中没有喜悦的器皿”。
    reason: 说明 אֵין חֵפֶץ בּוֹ 可指无人喜爱或想要，并保留原文较为字面的表达及其歧义。
lexical_decisions:
- source_word: גַּגּוֹת
  choice: 房顶
  rationale: 指古代房屋可供活动的平顶；“房顶”具体、自然，并保留哀哭发生地点的画面。
- source_word: רְחֹבֹתֶיהָ
  choice: 城中广场
  rationale: רְחוֹב常指城内宽阔的公共空间或广场，而非狭窄街道；补出“城中”使现代汉语表达清楚。
- source_word: כֻּלֹּה מִסְפֵּד
  choice: 到处都是哀哭
  rationale: 以自然汉语表达“全都是哀悼”的总括含义，同时体现公开哀悼的声音与行动。
- source_word: שָׁבַרְתִּי
  choice: 我打碎了
  rationale: 完成式表明行动已经成就；“打碎”也与器皿的比喻自然衔接。
- source_word: כִּכְלִי
  choice: 好像打碎一件……器皿
  rationale: כְּלִי可泛指器具或容器；“器皿”保持其宽泛性。汉语中重复“打碎”可清楚呈现摩押与器皿之间的比喻关系。
- source_word: אֵין חֵפֶץ בּוֹ
  choice: 不讨人喜爱的
  rationale: חֵפֶץ可表达喜悦、喜爱或想要；正文采用自然且较贴近原文的说法，不把含义完全收窄为价值判断。
- source_word: נְאֻם יְהוָה
  choice: 这是雅威的宣告
  rationale: 保留先知宣告公式的庄重语气，并将神名作为专名表达。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按四字神名的通行学术拟音译作“雅威”，保留原文使用的神圣专名。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”较接近其通行拟音，也避免以头衔代替专名。
- issue: אֵין חֵפֶץ בּוֹ 所表达的是喜爱还是实用价值
  choice: 不讨人喜爱的
  alternative: 无人想要的／毫无用处的
  rationale: 原文可指没有人喜爱或想要，并可能暗含失去价值；正文保留“喜爱”这一较直接含义，不径自解释为“毫无用处”。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“房顶—城中广场”保留私人及公共空间遍布哀声的画面；分号连接普遍哀哭与雅威施行审判的原因。
