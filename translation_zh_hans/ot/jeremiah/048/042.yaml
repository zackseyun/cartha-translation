  text: וְ/נִשְׁמַ֥ד מוֹאָ֖ב מֵ/עָ֑ם כִּ֥י עַל יְהוָ֖ה הִגְדִּֽיל־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/042.yaml
  text: And Moab will be destroyed as a people[a], because he magnified himself against Yahweh.
translation:
  language: zh_hans
  text: 摩押必被毁灭，不再成为一个民族，因为它向雅威自高自大[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“使自己为大”，即狂傲地抬高自己，与雅威对抗。
    reason: 说明 הִגְדִּיל 的较直译表达及其在本语境中的自高、对抗含义。
lexical_decisions:
- source_word: וְנִשְׁמַד
  choice: 必被毁灭
  rationale: 这是 שׁמד 的尼法勒完成式；在先知性宣告中表达确定将临的结果。“必被毁灭”保留被动语态和预言的确定性，同时不夸大为形而上的彻底消灭。
- source_word: מוֹאָב
  choice: 摩押
  rationale: 采用现代中文圣经传统中通行的地名译法。
- source_word: מֵעָם
  choice: 不再成为一个民族
  rationale: 介词 מִן 与单数不定名词 עַם 连用，表示从“作为一个民族”的身份或状态中被除去；此译法清楚表达摩押将不再作为独立民族存续，而不是从众民族中迁离。
- source_word: כִּי
  choice: 因为
  rationale: 引出摩押受审判的原因；“因为”在现代汉语中直接、自然。
- source_word: עַל
  choice: 向……
  rationale: 在 הִגְדִּיל 的敌对语境中，עַל 表示自高行为所针对的对象。“向雅威妄自尊大”在汉语中自然地传达对抗意味。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文直接出现的四字神名，以现代汉语中较通行的音译“雅威”呈现，而不以称号替代。
- source_word: הִגְדִּיל
  choice: 妄自尊大
  rationale: גדל 的使役式在此表示自我抬高、狂傲自大。“妄自尊大”既传达隐含的反身意义和负面语气，也符合现代庄重汉语。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文使用神的专名而非称号；音译“雅威”保留专名性质，也较贴近通常重构的读音。
- issue: הִגְדִּיל 的自高含义
  choice: 妄自尊大
  alternative: 使自己为大；夸口
  rationale: 本句没有另列反身代词，但该动词与 עַל 连用时表达针对雅威的狂傲自高。“妄自尊大”保留这种神学上的悖逆意味，而脚注列出更贴近字面的表达。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“不再成为一个民族”明确呈现 מֵעָם 所指的民族身份消亡；以“他”承接作为民族实体的“摩押”。脚注标记紧随其实际说明的“妄自尊大”，避免误附于前一分句。
