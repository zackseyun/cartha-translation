  yaml_path: translation/ot/jeremiah/048/004.yaml
  text: Moab is shattered; her little ones have made a cry heard.
translation:
  language: zh_hans
  text: 摩押被击碎了；她的幼童[a]放声哀号。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “幼童”也可译作“年幼者”。希伯来文本此处的写法和传读有疑难，古代译本及译者对此词的理解不一。
    reason: 提示末词的文本/传读难点，并说明译文采用“幼童”而未将其解释得过于具体。
lexical_decisions:
- source_word: נִשְׁבְּרָה
  choice: 被击碎了
  rationale: 该词为“破碎、粉碎”的被动式，描写摩押遭毁灭；“被击碎”既保留强烈意象，也符合现代汉语。
- source_word: הִשְׁמִיעוּ זְּעָקָה
  choice: 放声哀号
  rationale: 字面义为“使哀号被听见”。“放声哀号”自然传达高声发出悲痛呼喊的使役含义，而不把它弱化为普通哭泣。
- source_word: צעורי/ה
  choice: 她的幼小者
  rationale: 马所拉文本所指为摩押的“小者/年幼者”。采用“幼小者”以保留年龄或弱小身份上的一定含混，不武断限定为婴孩。
theological_decisions:
- issue: 摩押的阴性代词
  choice: 保留“她的”
  alternative: 省略代词，译作“其中的幼小者”
  rationale: 原文以阴性形式将摩押人格化，并以所有格指向其幼小者；保留这一表达有助于呈现原文意象。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“被击碎”保留审判场景的力度；“放声哀号”避免生硬直译“使哀号被听见”。
