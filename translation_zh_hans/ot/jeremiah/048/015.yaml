  text: שֻׁדַּ֤ד מוֹאָב֙ וְ/עָרֶ֣י/הָ עָלָ֔ה וּ/מִבְחַ֥ר בַּֽחוּרָ֖י/ו יָרְד֣וּ לַ/טָּ֑בַח נְאֻ֨ם הַ/מֶּ֔לֶךְ יְהוָ֥ה צְבָא֖וֹת שְׁמֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/015.yaml
  text: Moab is devastated[a], and her cities have gone up; the choicest of her young men have gone down to the slaughter, declares the King[b], whose name is Yahweh of Armies.
translation:
  language: zh_hans
  text: 摩押遭毁灭；她的城邑上去了[a]；她最精锐的青年人下去受屠杀。这是王的宣告——他的名是万军之耶和华[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“有人上去攻打她的城邑。”希伯来原文在此十分简略，句法也有困难；这句话可能指进攻者上去攻打摩押的城邑。
    reason: alternative_reading
  - marker: b
    text: “耶和华”音译希伯来文所记的上帝之名；“万军之耶和华”也常译作“万军之主”。
    reason: lexical_alternative
lexical_decisions:
- source_word: שֻׁדַּד
  choice: 被摧毁了
  rationale: 该词为שׁדד的Pual形式，表示遭受暴力劫掠、破坏。译作“被摧毁了”既保留被动结果，也不把含义局限于财物被抢。
- source_word: וְעָרֶיהָ עָלָה
  choice: 有人上去攻打她的城邑
  rationale: 原文结构简短突兀，动词为阳性单数，而“她的城邑”为复数，因此较可能省略了发动攻击的单数主语。“上去攻打”保留עלה的上行动势及其军事语境；另一种理解收入脚注。
- source_word: מִבְחַר בַּחוּרָיו
  choice: 她最精锐的青年人
  rationale: מִבְחַר指经挑选、上等或最优秀者；在战争语境中，“最精锐”自然表达这些青年人的优选地位。代词所指为摩押，中文依国家拟人化的上下文用“她”。
- source_word: יָרְדוּ לַטָּבַח
  choice: 都下到屠杀之地
  rationale: 保留ירד“下去”的鲜明运动意象，并将לַטָּבַח表达为他们最终被带往的屠杀之地。
- source_word: נְאֻם
  choice: 这是……的宣告
  rationale: 这是先知文本中常见的神谕公式；“宣告”庄重而符合现代汉语。
- source_word: הַמֶּלֶךְ
  choice: 王
  rationale: 定冠词及其后的神名表明这是对上帝的称号；中文以“王”表达，不另加原文没有的限定语。
- source_word: יְהוָה צְבָאוֹת
  choice: 万军之耶和华
  rationale: “耶和华”保留四字神名的专名性质；“万军”概括צְבָאוֹת所指的众军、天上军旅或受其统辖的军队，也保留称号的宏大与军事色彩。
- source_word: שְׁמוֹ
  choice: 他的名是
  rationale: 按原文名词句直译，同时以自然的现代汉语衔接“王”与神圣称号。
theological_decisions:
- issue: 四字神名יְהוָה及称号יְהוָה צְבָאוֹת的译法
  choice: 万军之耶和华
  alternative: 万军之主
  rationale: 原文直接使用上帝的专名יְהוָה，不只是“主”这一称号，因此正文保留“耶和华”；צְבָאוֹת译为“万军”，不限定为单纯的人间军队。
- issue: “她的城邑上去”这一困难句式所描写的事件
  choice: 有人上去攻打她的城邑
  alternative: 她的城邑升上去了
  rationale: 阳性单数动词与复数的“城邑”不一致，支持将未明说的攻击者视为主语；但原文确实高度压缩，可能有别的句法或意象，故在脚注中保留较字面的替代读法。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“城邑”“宣告”略带经文语体，但普通读者容易理解。正文避免用不自然的复数主语搭配单数动词，同时借脚注保留原文的句法困难与歧义。
