  text: אוֹי לְ/ךָ֣ מוֹאָ֔ב אָבַ֖ד עַם כְּמ֑וֹשׁ כִּֽי לֻקְּח֤וּ בָנֶ֨י/ךָ֙ בַּ/שֶּׁ֔בִי וּ/בְנֹתֶ֖י/ךָ בַּ/שִּׁבְיָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/046.yaml
  text: Woe to you[a], Moab! The people of Chemosh have perished, for your sons have been taken captive, and your daughters into captivity.
translation:
  language: zh_hans
  text: '摩押啊，你有祸了！

    基抹的民灭亡了；

    因为你的儿子被掳走，

    你的女儿也被掳去。[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “被掳去”也可译作“被带去作俘虏”。本句表示“被掳”的两个希伯来语词意义相近，构成诗意平行。
    reason: 说明两个近义词的词义范围及诗歌平行结构，避免把中文措辞差异理解为实质性的不同遭遇。
lexical_decisions:
- source_word: אוֹי לְךָ מוֹאָב
  choice: 摩押啊，你有祸了
  rationale: אוֹי兼有哀叹与宣告灾祸的语气；“你有祸了”保留先知性审判的力度，并以呼语自然表达לְךָ מוֹאָב。
- source_word: אָבַד
  choice: 灭亡了
  rationale: 该动词表示灭亡、毁灭；用“灭亡了”保留完成性，也不额外指定施事者。
- source_word: עַם כְּמוֹשׁ
  choice: 基抹的民
  rationale: 按希伯来语构造关系直译，表达摩押人与其民族神基抹的归属关系，不添加解释。
- source_word: כִּי
  choice: 因为
  rationale: 此处引出哀叹和灭亡宣告的依据。
- source_word: לֻקְּחוּ בָנֶיךָ בַּשֶּׁבִי
  choice: 你的儿子被掳走
  rationale: 保留לֻקְּחוּ的被动意义；“被掳走”自然表达进入俘虏状态及被带离之意。
- source_word: וּבְנֹתֶיךָ בַּשִּׁבְיָה
  choice: 你的女儿也被掳去
  rationale: 保留儿子与女儿的性别对应和诗意平行；“也”自然承接并列关系，“被掳去”表达俘虏或被迁离的状态。
theological_decisions:
- issue: 基抹与摩押人的关系
  choice: 基抹的民
  alternative: 属基抹的人民
  rationale: “基抹的民”直接保留עַם כְּמוֹשׁ的构造关系及其神学张力，既不淡化摩押与基抹的关联，也不进一步说明这种归属的性质。
translation_notes:
  register: 采用现代、庄重而易懂的先知性语言；以四行排列表现原文的呼告、灭亡宣告及儿女平行结构。专名כְּמוֹשׁ按中文圣经惯用形式译为“基抹”。
