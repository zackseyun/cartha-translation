  text: מִ/זַּעֲקַ֨ת חֶשְׁבּ֜וֹן עַד אֶלְעָלֵ֗ה עַד יַ֨הַץ֙ נָתְנ֣וּ קוֹלָ֔/ם מִ/צֹּ֨עַר֙ עַד חֹ֣רֹנַ֔יִם עֶגְלַ֖ת שְׁלִֽשִׁיָּ֑ה כִּ֚י גַּם מֵ֣י נִמְרִ֔ים לִ/מְשַׁמּ֖וֹת יִהְיֽוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/034.yaml
  text: From the cry of Heshbon to Elealeh[a], as far as Jahaz, they raise their voice; from Zoar to Horonaim, to Eglath-shelishiyah. For even the waters of Nimrim will become desolations.
translation:
  language: zh_hans
  text: 希实本的哀号传到以利亚利，远至雅杂；他们扬声呼喊，从琐珥直到何罗念，直到伊基拉施利施亚[a]。因为连宁林的水也必变为荒凉。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“三岁的母牛”。希伯来语עֶגְלַת שְׁלִשִׁיָּה可理解为描述性短语；但在这里连续列举地名的语境中，更可能是一个地名。
    reason: 保留该希伯来语短语可作地名或描述性短语理解的词义歧义。
lexical_decisions:
- source_word: מִזַּעֲקַת
  choice: 从……发出的哀号
  rationale: זַעֲקָה指人在患难中的呼号、哀号；מִן在此配合地名，标明声音传出的起点。
- source_word: עַד
  choice: 传到／远至／直到
  rationale: 重复的עַד勾勒呼声所及的地理范围；按现代汉语语境灵活表达，同时保留层层延伸的效果。
- source_word: נָתְנוּ קוֹלָם
  choice: 他们扬声呼喊
  rationale: 原文直译为“发出他们的声音”，是主动发声的习语；“扬声呼喊”自然地保留其主动性和哀恸语境。
- source_word: עֶגְלַת שְׁלִשִׁיָּה
  choice: 伊基拉·施利施亚
  rationale: 在连续列举地点的上下文中较可能是地名，因此正文音译；该短语也可作描述性短语理解，另在脚注注明。
- source_word: כִּי גַּם
  choice: 因为连……也
  rationale: כִּי引出解释，גַּם带有递进强调；“因为连……也”兼顾两者。
- source_word: מֵי נִמְרִים
  choice: 宁林的水
  rationale: 按原文领属结构直译，不擅自判定它具体是河流、泉水还是其他水源。
- source_word: לִמְשַׁמּוֹת יִהְיוּ
  choice: 必变得荒凉
  rationale: היה与לְ所构成的结果表达宜译为“变得”；中文不宜生硬照译复数名词“荒凉之处”，故以状态表达其成为废墟、荒芜的含义。
