  to: 希实本的哀号传到以利亚利，远至雅杂；他们扬声呼喊，从琐珥直到何罗念，直到伊基拉施利施亚[a]。因为连宁林的水也必变为荒凉。
  rationale: 修订统一采用通行中文圣经地名，改善首句的汉语衔接，并校正脚注的描述性替代译法。地理范围、主动发声、未指明的复数主体，以及“宁林的水”成为荒凉的结果意义均予保留。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T07:29:36Z'
