  text: וְ/נֶאֶסְפָ֨ה שִׂמְחָ֥ה וָ/גִ֛יל מִ/כַּרְמֶ֖ל וּ/מֵ/אֶ֣רֶץ מוֹאָ֑ב וְ/יַ֨יִן֙ מִ/יקָבִ֣ים הִשְׁבַּ֔תִּי לֹֽא יִדְרֹ֣ךְ הֵידָ֔ד הֵידָ֖ד לֹ֥א הֵידָֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/033.yaml
  text: Joy and gladness have been gathered from the orchard land and from the land of Moab[a]; I have made wine cease from the winepresses. No one will tread with a shout[c][b]; the shout is no shout.
translation:
  language: zh_hans
  text: 欢喜和快乐从肥沃的田野和摩押地被收去了[a]；我使酒从榨酒池中断绝。无人再踩踏葡萄时欢呼[b]；有喊声，却不是欢呼[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “肥沃的田野”所译的希伯来语在这里指肥沃、经耕作的土地，不是专名“迦密”。“被收去了”也可译作“被聚拢”，在本句中表示欢喜快乐已被除去。
    reason: lexical_alternative
  - marker: b
    text: 这里的“欢呼”指踩葡萄、庆祝收成时发出的喊声。
    reason: cultural_note
  - marker: c
    text: 本句希伯来文十分简略，直译近于“喊声，喊声——不是喊声”。意思是：虽有喊声，却不是往日收获、踩榨时的欢乐呼声。
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶאֶסְפָה
  choice: 被收走了
  rationale: 该词是 אסף 的尼法勒式，可指“被聚拢”，也可在语境中表示“被收去、除去”。此处欢喜快乐从当地消失，译作“被收走了”既保留“收拢”的意象，也清楚表达除去之意。
- source_word: שִׂמְחָה וָגִיל
  choice: 欢喜和快乐
  rationale: 两个近义词共同描写庆收与酿酒时的喜悦；用两个常见而庄重的中文词保留并列结构。
- source_word: כַּרְמֶל
  choice: 肥沃的田野
  rationale: 此处是普通名词，指肥沃、经耕作的土地，并非专名“迦密”。“肥沃的田野”自然清楚，也符合农业语境。
- source_word: וְיַיִן מִיקָבִים הִשְׁבַּתִּי
  choice: 我使榨酒池不再出酒
  rationale: 原文直译近于“我使酒从榨酒池止息”。中文以“不再出酒”自然表达使役和止息，同时保留第一人称神谕口吻。
- source_word: יִדְרֹךְ
  choice: 踩榨
  rationale: דרך 在本语境指用脚踩压葡萄。原文宾语省略；“踩榨”在中文中简洁地点明榨酒场景。
- source_word: הֵידָד
  choice: 呼喊／欢呼
  rationale: 该词指高声呼喊，在这里尤其与踩葡萄时的庆贺喊声有关。前句译“呼喊”保留一般意义，末句译“欢呼”呈现所期待的喜庆性质已经消失。
theological_decisions:
- issue: הִשְׁבַּתִּי 中第一人称单数说话者的身份
  choice: 保留“我”，按上下文理解为耶和华在审判神谕中说话
  alternative: 理解为未明确身份的先知或叙述者
  rationale: 本节所在的审判神谕以神的行动为语境，第一人称最自然地指耶和华；正文只保留原文明确的“我”，不另加称谓或神学解释。
- issue: 末句 הֵידָד הֵידָד לֹא הֵידָד 的省略和反复
  choice: 译为“那呼喊已不是欢呼”
  alternative: 形式上直译为“呼喊，呼喊，不是呼喊”
  rationale: 原文刻意形成悖论式反复：仍可能有喊声，却不再是踩榨时喜庆的喊声。中文正文以最少补足呈现这一对比，并在脚注中保留原文形式。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“踩榨”简洁保留古代脚踩葡萄的场景；末句避免生硬照搬希伯来语反复，同时用脚注说明其省略和文字张力。
