source:
  edition: WLC
  text: הֹבִ֥ישׁ מוֹאָ֛ב כִּֽי חַ֖תָּה הילילי ו/זעקי הַגִּ֣ידוּ בְ/אַרְנ֔וֹן כִּ֥י שֻׁדַּ֖ד מוֹאָֽב־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/020.yaml
  text: 'Moab is put to shame[a], for she is shattered[c][b]. Wail and cry out! Declare it by the Arnon: Moab is devastated.'
translation:
  language: zh_hans
  text: 摩押蒙羞了，因为她已被击垮[a]。哀号吧，呼喊吧！你们要在亚嫩河边[b]宣告：摩押已遭蹂躏[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “被击垮”也可译作“崩溃了”或“惊惶失措”。
    reason: lexical_alternative
  - marker: b
    text: “在亚嫩河边”也可译作“在亚嫩”或“亚嫩那里”。
    reason: lexical_alternative
  - marker: c
    text: “遭蹂躏”也可译作“遭劫掠”或“沦为废墟”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הֹבִישׁ
  choice: 蒙羞了
  rationale: 该词在此表达陷入羞辱、受辱的结果。“蒙羞了”既保留结果意味，也符合现代汉语的庄重语体。
- source_word: מוֹאָב
  choice: 摩押
  rationale: 采用现代中文圣经传统中通行的地名译法。
- source_word: כִּי
  choice: 因为
  rationale: 在此引出摩押蒙羞的原因，译作“因为”清楚自然。
- source_word: חַתָּה
  choice: 已被击垮
  rationale: חתת可指破碎、崩溃或惊惶；审判语境侧重摩押遭受重创而崩溃。“被击垮”兼顾外在毁坏与整体溃败，同时以脚注保留其他可能。
- source_word: הילילי
  choice: 哀号吧
  rationale: 阴性单数祈使式，表示因灾难而大声悲号。“哀号”自然、鲜明，也符合先知性哀歌语体。
- source_word: ו/זעקי
  choice: 呼喊吧
  rationale: 与“哀号”并列，表达在苦难中高声喊叫；汉语用两个祈使短句保持原文急促的呼告。
- source_word: הַגִּידוּ
  choice: 你们要……宣告
  rationale: 复数祈使式，要求公开传报摩押覆亡的消息。明示“你们”有助于反映原文从阴性单数呼告转为复数命令。
- source_word: בְ/אַרְנֹון
  choice: 在亚嫩河边
  rationale: ב在此可表示在、于或靠近；亚嫩通常指河流或河谷。“在亚嫩河边”是自然的地理表达，但其具体关系仍有歧义，故加脚注。
- source_word: שֻׁדַּד
  choice: 已遭蹂躏
  rationale: שדד的Pual形式可涵盖被劫掠、摧毁和荒废。“遭蹂躏”保留其遭受暴力破坏的宽广含义，不将其限缩为单纯抢掠。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的先知宣告语体。以短促祈使句传达哀号与呼喊的紧迫感；通过“你们”体现后一个命令的复数形式。对חתת、בְּאַרְנוֹן和שׁדד的真实语义幅度不作过度限定，分别用脚注保留可能译法。
