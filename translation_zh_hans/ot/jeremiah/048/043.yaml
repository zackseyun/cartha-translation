base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/043.yaml
  text: Terror and the pit and the snare are upon you[a], inhabitant of Moab[b], declares Yahweh.
translation:
  language: zh_hans
  text: 恐惧[a]、陷坑和网罗[b]临到你，住在摩押的居民啊——这是耶和华的宣告。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “恐惧”也可译作“惊恐”或“战栗”。
    reason: lexical_alternative
  - marker: b
    text: “恐惧、陷坑、网罗”这一三联语与以赛亚书24:17相呼应。
    reason: cross_reference
lexical_decisions:
- source_word: פַּחַד
  choice: 恐惧
  rationale: 该词表示令人战栗的恐惧或惊恐；译作“恐惧”既自然，又保留与后两项组成的审判三联语。也可理解为“惊恐”。
- source_word: פַחַת
  choice: 深坑
  rationale: 指供猎物坠入的坑阱；“深坑”清楚呈现坠落的危险，并与“网罗”有别。
- source_word: פָח
  choice: 网罗
  rationale: 指捕捉猎物的罗网或圈套；“网罗”符合庄重的先知文体，也保持三联语的节奏。
- source_word: עָלֶיךָ
  choice: 都临到你了
  rationale: עַל加第二人称单数词尾直译为“在你之上”；此处表达审判临及受话者，译为“临到你了”符合现代汉语。
- source_word: יוֹשֵׁב מוֹאָב
  choice: 摩押的居民啊
  rationale: 单数分词以代表性单数呼告摩押境内的居民；中文用集合意义的“居民”既保留呼告，也不必强行改为复数。
- source_word: נְאֻם יְהוָה
  choice: 这是耶和华的宣告
  rationale: 这是庄严的先知宣告公式；此译保持其名词性和权威语气。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的专名“耶和华”呈现四字神名，而非以称号替代。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。中文正文采用广为人知且具有专名功能的“耶和华”；“雅威”是较贴近学术重构发音的另一种译写，但原始发音不能完全确定。
- issue: יוֹשֵׁב מוֹאָב 的数与指称
  choice: 保留代表性单数式呼告：“摩押的居民啊”
  alternative: “住在摩押的人哪”或复数化为“摩押的居民们啊”
  rationale: 希伯来文形式为阳性单数，可代表当地人口整体。中文“居民”本身可作集合名词，因此不必消除这种张力。
translation_notes:
  register: 采用现代、庄重而易懂的先知宣告语体。“恐惧、深坑、网罗”保持原文的头韵式三联结构所形成的急促节奏；感叹号体现呼告，末句则保留宣告公式的肃穆感。
