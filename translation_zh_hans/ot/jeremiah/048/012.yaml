base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/012.yaml
  text: Therefore behold[a], days are coming, declares Yahweh, when I will send to him pourers, and they will pour him out[c][b]; they will empty his vessels and shatter their jars.
translation:
  language: zh_hans
  text: 所以，看哪，日子将到——这是雅威的宣告——那时，我要差遣倒酒的人到他那里；他们必把他倾倒出来[a]，倒空他的器皿，打碎他们的皮袋[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “倒酒的人”和“把他倾倒出来”所依据的希伯来词较罕见，也可理解为“使他漂泊的人”和“他们必使他漂泊”；上下文关于酒、器皿和倾倒的意象支持正文译法。
    reason: lexical_alternative
  - marker: b
    text: 原文作“他们的皮袋”。此词可指盛酒用的皮袋或其他容器。有些人按语意认为应是“他的皮袋”，指摩押；正文保留传承文本的读法。
    reason: textual_variant
lexical_decisions:
- source_word: לָכֵן
  choice: 所以
  rationale: 承接上一节摩押安逸、未被倒换的酒喻，引出相应的审判结果。
- source_word: הִנֵּה
  choice: 看哪
  rationale: 保留先知话语中唤起注意的标记及庄严语气。
- source_word: יָמִים בָּאִים
  choice: 日子将到
  rationale: 贴近常见的先知性宣告公式，同时符合现代汉语表达。
- source_word: נְאֻם יְהוָה
  choice: 这是雅威的宣告
  rationale: 以庄严而自然的汉语表达先知书中标明神谕来源的固定公式。
- source_word: וְשִׁלַּחְתִּי לוֹ
  choice: 我要差遣……到他那里
  rationale: 保留介词所表达的趋向；敌对含义由后续行动自然显明。
- source_word: צֹעִים
  choice: 倒酒的人
  rationale: 该词罕见，但上下文连续使用酒、器皿、倒空和打碎容器的意象，因此采用与斟倒或倾倒酒相关的含义。
- source_word: וְצֵעֻהוּ
  choice: 他们必把他倒空
  rationale: 承接上一节酒未从器皿倒入另一器皿的比喻，并与下句倒空器皿呼应；同时以脚注保留另一种词义分析。
- source_word: וְכֵלָיו יָרִיקוּ
  choice: 倒空他的器皿
  rationale: 准确表达使役形态“使空、倒空”，并维持酒器意象。
- source_word: וְנִבְלֵיהֶם יְנַפֵּצוּ
  choice: 打碎他们的坛子
  rationale: 保留马所拉文本第三人称复数“他们的”，不按语意擅改为“他的”；“坛子”自然体现盛酒容器的意象。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华／主
  rationale: 采用对四字神名的音译，明确保留专名性质，不以称号替代。
- issue: 审判行动的酒器隐喻
  choice: 保留“倒酒的人”“倒空”“器皿”“坛子”的连续意象
  alternative: 概括译为使摩押流亡或毁灭
  rationale: 原文借上一节陈酒的比喻描绘对摩押的审判；直保意象可避免把有争议的动词解释直接定为流亡。
translation_notes:
  register: 采用现代、庄重、易懂的先知书语体。“看哪”保留宣告力度；破折号清楚标示插入的神谕公式。以“他”承接拟人化的摩押，并保留末句代词由“他的”转为“他们的”所造成的原文张力。
