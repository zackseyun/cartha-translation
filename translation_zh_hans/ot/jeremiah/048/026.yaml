base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/026.yaml
  text: Make him drunk[a], because he has magnified himself against Yahweh; and Moab shall wallow in his vomit, and he too shall become a laughingstock.
translation:
  language: zh_hans
  text: 你们要使摩押喝醉，因为他向雅威妄自尊大。摩押必在自己的呕吐物中打滚[a]，也必成为笑柄。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “打滚”或可译作“拍手”或“击打”。这个希伯来动词可表示拍打；但在本句中，它与“在自己的呕吐物中”连用，可能描写醉后在秽物中翻滚、挣扎的狼狈景象。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשְׁכִּירֻהוּ
  choice: 你们要使摩押喝醉
  rationale: 该词是使役式复数命令，带第三人称阳性单数宾语；结合上下文，宾语指摩押。译出“你们”保留复数命令的语气，以“摩押”明确汉语中的指代。
- source_word: כִּי
  choice: 因为
  rationale: 引出使摩押喝醉的原因，现代汉语用“因为”清楚自然。
- source_word: עַל יְהוָה
  choice: 向雅威
  rationale: 介词 עַל 与“自大”一类表达连用，在此表示狂妄所针对的对象；“向雅威妄自尊大”体现敌对和冒犯之意。
- source_word: הִגְדִּיל
  choice: 妄自尊大
  rationale: 使役式在此表达抬高自己、狂妄自大的意思；“妄自尊大”既保留自我高举的含义，也符合庄重的现代汉语。
- source_word: וְסָפַק
  choice: 必……打滚
  rationale: 该动词通常可与拍打、击打有关，但与“在自己的呕吐物中”连用时，理解为醉后在其中翻滚或挣扎，画面更连贯；脚注保留字面上的其他可能。
- source_word: בְּקִיאוֹ
  choice: 在自己的呕吐物中
  rationale: 具体保留醉酒受辱的强烈意象；物主后缀译作“自己的”。
- source_word: וְהָיָה לִשְׂחֹק
  choice: 也必成为笑柄
  rationale: 表达摩押将成为众人讥笑的对象；“成为笑柄”是自然、凝练的现代汉语。
- source_word: גַּם הוּא
  choice: 也
  rationale: 保留附加和强调意味，表明摩押同样要落到被讥笑的地步。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；采用“雅威”作为较贴近该神名常见学术重构读音的中文音译，不以称号替代专名。
- issue: 摩押“向雅威妄自尊大”的含义
  choice: 保留自我高举并敌对雅威的表达
  alternative: 概括译为“得罪雅威”或“藐视雅威”
  rationale: 原文使用“使自己为大”的表达，重点不仅是一般性的犯罪或藐视，也包含狂妄地抬高自己；译文不把这一神学张力弱化为泛称。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“喝醉”“呕吐物”“笑柄”直接保留审判、羞辱和讥笑的鲜明意象；不以委婉语淡化原文。脚注标记紧随存在词义歧义的“打滚”。
