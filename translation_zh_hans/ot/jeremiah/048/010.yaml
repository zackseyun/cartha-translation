source:
  edition: WLC
  text: אָר֗וּר עֹשֶׂ֛ה מְלֶ֥אכֶת יְהוָ֖ה רְמִיָּ֑ה וְ/אָר֕וּר מֹנֵ֥עַ חַרְבּ֖/וֹ מִ/דָּֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/010.yaml
  text: Cursed is the one who does the work of Yahweh negligently[a], and cursed is the one who holds back his sword from blood.
translation:
  language: zh_hans
  text: 懈怠地做雅威的工作的人受诅咒[a]；不使自己的刀剑沾血的人也受诅咒。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“诡诈地。”希伯来词 רְמִיָּה 可指欺骗或诡诈；在这里也可能指做事松懈、不尽力。
    reason: 保留原词在“懈怠”与“诡诈”之间的词义可能。
lexical_decisions:
- source_word: אָרוּר
  choice: 受诅咒
  rationale: 这是宣告咒诅或审判的谓语用语；“受诅咒”在现代汉语中自然、庄重，也保留了原文的强烈语气。
- source_word: עֹשֶׂה
  choice: 做……的人
  rationale: 分词在此作实体化、泛指用法；译作“做……的人”清楚表达这一类人，而不局限于某个特定个体。
- source_word: מְלֶאכֶת יְהוָה
  choice: 雅威工作
  rationale: מְלָאכָה 指工作或任务；此处语境是执行对摩押的审判。“雅威工作”保留原文表达，不额外说明任务性质。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语音译呈现四字神名，保留其专名性质，不以称号替代。
- source_word: רְמִיָּה
  choice: 懈怠地
  rationale: 该词可指诡诈、欺骗，也可在执行任务的语境中表示松懈、不尽力。这里“懈怠地”最符合上下文，但脚注保留另一词义。
- source_word: מֹנֵעַ
  choice: 不让……沾
  rationale: 该分词表示阻止、扣留或抑制；结合“刀剑”和“血”，译法自然表达了刻意使刀剑避开血的动作。
- source_word: חַרְבּוֹ
  choice: 自己的刀剑
  rationale: 保留单数名词及第三人称阳性单数所属关系；“自己的”在汉语泛指结构中指向句中所说的人。
- source_word: מִדָּם
  choice: 沾血
  rationale: 希伯来文直译为“离开血”或“免于血”。“沾血”在现代汉语中保留刀剑与血的具体、强烈意象，同时避免抽象化为“杀戮”。
theological_decisions:
- issue: 如何译出神名 יְהוָה
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。译作“雅威”保留专名，并避免以“主”这一称号替代。
- issue: 是否弱化审判中的暴力意象
  choice: 保留“刀剑沾血”的明确表达
  alternative: 不让自己的刀剑杀人；不执行审判
  rationale: 原文以刀剑和血构成刻意而强烈的审判图像。译文不将其淡化，也不加入原文没有明说的伦理解释。
- issue: רְמִיָּה 在此是懈怠还是诡诈
  choice: 正文采用“懈怠地”，脚注保留“诡诈地”
  alternative: 正文译作“诡诈地”
  rationale: 在执行受托任务的语境中，松懈、不尽力较为贴切；但该词确有欺骗、诡诈的常见含义，因此不应消除这一真实的词义可能。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“受诅咒”保留审判公式的力度；“刀剑沾血”保持原文具体而尖锐的战争意象。分号对应两个平行的咒诅宣告。
