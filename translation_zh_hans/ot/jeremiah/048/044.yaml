reference: Jeremiah 48:44
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: ה/ניס מִ/פְּנֵ֤י הַ/פַּ֨חַד֙ יִפֹּ֣ל אֶל הַ/פַּ֔חַת וְ/הָֽ/עֹלֶה֙ מִן הַ/פַּ֔חַת יִלָּכֵ֖ד בַּ/פָּ֑ח כִּֽי אָבִ֨יא אֵלֶ֧י/הָ אֶל מוֹאָ֛ב שְׁנַ֥ת פְּקֻדָּתָ֖/ם נְאֻם יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/044.yaml
  text: He who flees from the terror will fall into the pit[a], and he who comes up from the pit will be caught in the snare; for I will bring upon her, upon Moab, the year of their punishment, declares Yahweh.
translation:
  language: zh_hans
  text: 逃离惊恐的人必掉进陷坑；从陷坑上来的人必被网罗捕获。因为我必使她，就是摩押，遭逢他们受惩罚的那一年[a]。这是雅威的宣告。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “他们受惩罚的那一年”也可译作“察访他们的那一年”或“追讨他们的那一年”。
    reason: פְּקֻדָּה 可指察访、过问，并在审判语境中引申为追讨或惩罚；正文依上下文采用“惩罚”，脚注保留较宽的语义范围。
lexical_decisions:
- source_word: הניס מִפְּנֵי הַפַּחַד
  choice: 逃避惊恐的
  rationale: 分词作名词用，泛指任何逃跑的人；“惊恐”体现 פַּחַד 的强烈程度，也保留灾祸逼近的语境。
- source_word: יִפֹּל אֶל הַפַּחַת
  choice: 必掉进陷坑
  rationale: פַּחַת 指坑或捕捉猎物的陷坑；译作“陷坑”兼顾实体坑穴和设伏捕捉的意味。
- source_word: וְהָעֹלֶה מִן הַפַּחַת
  choice: 从陷坑里爬上来的
  rationale: עלה 表示从坑中上来；汉语“爬上来”自然呈现脱离坑穴的动作，但不额外断定此人已经成功逃脱。
- source_word: יִלָּכֵד בַּפָּח
  choice: 必被网罗抓住
  rationale: פַּח 是网罗或圈套；与前面的“陷坑”区分，并保留连续落入捕具、无可逃脱的意象。
- source_word: כִּי אָבִיא אֵלֶיהָ אֶל מוֹאָב
  choice: 因为我必使惩罚临到她，临到摩押
  rationale: אֵלֶיהָ 的阴性单数后缀回指作为地域或政治实体的摩押，后面的 אֶל מוֹאָב 是同位说明；汉语保留“她”及重复结构。宾语“惩罚”由后续“受惩罚之年”补足，符合该审判语境。
- source_word: שְׁנַת פְּקֻדָּתָם
  choice: 他们受惩罚之年
  rationale: פְּקֻדָּה 在本段审判语境中指追讨、惩处；“受惩罚之年”自然明确，同时以脚注保留“被察访／追讨”的语义余地。
- source_word: נְאֻם יְהוָה
  choice: 这是雅威的宣告
  rationale: נְאֻם 是庄重的先知宣告公式；将四字神名 יְהוָה 音译为“雅威”，直接保留专名。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华／上主
  rationale: 原文直接使用四字神名。音译“雅威”将其作为专名呈现，不以称号代替。
- issue: פְּקֻדָּה 在审判预言中的含义
  choice: 惩罚
  alternative: 察访／追讨／清算
  rationale: 上下文描写摩押无法逃避的灾祸，因此正文采用明确的惩罚义；脚注保留该词由“察访、过问”延伸至“追讨”的语义张力。
- issue: אֵלֶיהָ 的阴性指称
  choice: 她，临到摩押
  alternative: 它，临到摩押／直接省略代词
  rationale: 保留原文阴性单数代词及其后的同位语“摩押”，使原文把摩押人格化或视作地域实体的表达不被抹平。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。以“惊恐—陷坑—网罗”形成紧凑的灾祸链条；保留摩押的阴性代词和先知宣告公式。脚注标记置于其所解释的“受惩罚之年必会来到”之后。
