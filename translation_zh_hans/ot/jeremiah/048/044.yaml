  to: 逃离惊恐的人必掉进陷坑；从陷坑上来的人必被网罗捕获。因为我必使她，就是摩押，遭逢他们受惩罚的那一年[a]。这是雅威的宣告。
  rationale: 修订避免将“上来”限定为“爬上来”，恢复“我必使……之年临到她，就是摩押”的原文主从与宾语关系，并以更自然的现代汉语表达泛指分词。保留摩押作为阴性单数“她”与复数“他们”之间的原文视角差异：前者指人格化的国家／地域实体，后者指其居民。
