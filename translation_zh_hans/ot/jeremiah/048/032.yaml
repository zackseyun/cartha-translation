base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/032.yaml
  text: With the weeping of Jazer I weep for you[a], vine of Sibmah; your branches crossed the sea; they reached as far as Jazer[c][b]. Upon your summer fruit and upon your grape harvest the destroyer has fallen.
translation:
  language: zh_hans
  text: 我要随着雅谢的哀哭，为你哀哭[a]，西比玛的葡萄树啊！你的枝条[b]越过了海，伸展到雅谢海[c]。毁灭者已经临到你夏熟的果子和葡萄收成上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我为你哀哭，胜过雅谢的哀哭。”原文开头的介词可能含有比较意味。
    reason: lexical_alternative
  - marker: b
    text: “枝条”也可译作“嫩枝”或“藤蔓”。
    reason: lexical_alternative
  - marker: c
    text: 原文作“雅谢海”。雅谢位于内陆，因此有人把这看作诗歌中的夸张说法；也有人主张调整文本，译作“伸展到雅谢”。
    reason: textual_variant
lexical_decisions:
- source_word: מִבְּכִי
  choice: 同……一同哀哭
  rationale: 介词结构含义较难确定，可表示与雅谢的哭泣相伴，也可能带比较意味。正文采用关联义，使中文自然，同时以脚注保留比较义。
- source_word: אֶבְכֶּה לָּךְ
  choice: 我要……为你哭泣
  rationale: 未完成式可表达将来、意愿或持续行动；“我要……哭泣”既保留其形式色彩，也适合先知哀歌语境。
- source_word: הַגֶּפֶן שִׂבְמָה
  choice: 西比玛的葡萄树啊
  rationale: 将该短语理解为呼格，以葡萄树比喻西比玛，并用“啊”清楚呈现直接呼唤。
- source_word: נְטִישֹׁתַיִךְ
  choice: 你的枝条
  rationale: 该词指葡萄树向外伸展的嫩枝、蔓或枝条；“枝条”通俗清楚，其他可能义见脚注。
- source_word: עָבְרוּ יָם
  choice: 越过了海
  rationale: 直译动词与宾语，保留葡萄枝蔓跨海伸展的强烈诗歌意象。
- source_word: עַד יָם יַעְזֵר נָגָעוּ
  choice: 伸展到雅谢海
  rationale: 按马所拉文本保留“海”和“雅谢”的组合，不在正文中以推测性校订消除其地理难点。
- source_word: קֵיץ
  choice: 夏熟的果子
  rationale: 指夏季成熟、收取的果实；“夏熟的果子”比“夏果”更易为现代读者理解。
- source_word: בָּצִיר
  choice: 葡萄收成
  rationale: 在葡萄园语境中特指葡萄的采收；此处用“葡萄收成”与前面的果子形成自然并列。
- source_word: שֹׁדֵד נָפָל
  choice: 毁灭者已经扑到……之上
  rationale: שֹׁדֵד可指蹂躏者、抢掠者或毁灭者；נָפָל עַל描写灾祸突然临到。“扑到”在中文中保留突然而猛烈的动态。
theological_decisions:
- issue: 是否修订或意译“雅谢海”这一困难地名短语
  choice: 正文保留马所拉文本的“雅谢海”
  alternative: 译作“伸展到雅谢”，将“海”视为文本问题或加以省略
  rationale: 这里主要是文本与地理解释问题。保留现存希伯来文本可避免把推测性校订直接写入正文，并以脚注说明困难和另一种理解。
- issue: 开头介词是否明确译为比较义
  choice: 正文采用伴随/关联义“同雅谢一同哀哭”
  alternative: 译作“我要比雅谢哭得更哀痛”
  rationale: 希伯来语介词可能带比较意味，但并不确定。正文不强行消除歧义，脚注保留比较译法。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。以“葡萄树啊”保留哀歌中的直接呼唤，以“扑到……之上”呈现毁灭突然临到的诗意；三处脚注明确对应正文标记[a]、[b]、[c]。
