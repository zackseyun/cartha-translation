  text: אֶל דֶּ֛רֶךְ עִמְדִ֥י וְ/צַפִּ֖י יוֹשֶׁ֣בֶת עֲרוֹעֵ֑ר שַׁאֲלִי נָ֣ס וְ/נִמְלָ֔טָה אִמְרִ֖י מַה נִּֽהְיָֽתָה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/019.yaml
  text: Stand by the road and watch, inhabitant of Aroer; ask the man who flees and the woman who escapes, “What has happened?”
translation:
  language: zh_hans
  text: 亚罗珥的居民啊，站在路旁守望吧；问问逃跑的男人和逃脱的女人：“发生了什么事？”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֶל־דֶּרֶךְ
  choice: 在路旁
  rationale: 此处介词短语与“站立”连用，表达站到路边察看的意思；现代汉语用“在路旁”自然清楚。
- source_word: וְצַפִּי
  choice: 观望
  rationale: צפה表示留意观看、守望；“观望”既保留持续察看的意味，也符合此处等候逃难者经过的场景。
- source_word: יוֹשֶׁבֶת עֲרוֹעֵר
  choice: 亚罗珥的居民啊
  rationale: 阴性单数分词与本节一系列阴性单数命令式呼应，是对亚罗珥居民的直接呼告；汉语不强行标出语法阴性。
- source_word: נָס וְנִמְלָטָה
  choice: 那逃跑的男人和逃脱的女人
  rationale: 前一分词为阳性单数，后一形式为阴性单数；译文明示男女之别，保留原文刻意转换的性别形式。
- source_word: מַה נִּהְיָתָה
  choice: 发生了什么事
  rationale: 这是询问已经发生之事的常用问句，译法自然，并准确传达原文。
theological_decisions:
- issue: 阳性“逃跑者”与阴性“逃脱者”是否应概括为不分性别的难民
  choice: 译作“逃跑的男人和逃脱的女人”
  alternative: 译作“逃跑的人和逃脱的人”
  rationale: 原文相邻形式明确采用阳性单数和阴性单数。虽然语法性别未必在所有语境中都要求明示生理性别，但这里的并列转换具有可感知的修辞作用，因此不将其抹平。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“啊”标明直接呼告；“要……；问问……”保留连续命令的语气。引号内问句简洁口语化，适合现场询问的语境。
