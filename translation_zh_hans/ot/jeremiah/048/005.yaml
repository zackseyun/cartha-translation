- from: 因为在上鲁希坡的路上，人哭着上去，哭泣不止[a]；因为在下何罗念的路上，人们听见了毁灭的凄厉呼喊[b]。
  to: 因为在鲁希的上坡路上，人哭着上去，哭泣[a]；因为在何罗念的下坡路上，听见了因毁灭而发出的凄厉呼号[b]。
  rationale: 修正两处地形短语，使其成为现代标准汉语中明确的“上坡路／下坡路”，并以不添加“持续不停”含义的重复来反映希伯来文对“哭泣”的强调。第二行不指定未明的复数主体，因而不在正文中裁定困难的צָרֵי应作“敌人”还是表痛苦的修饰语；替代读法仍由脚注说明。
