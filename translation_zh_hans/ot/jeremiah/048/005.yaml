base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/005.yaml
  text: For on the ascent of Luhith they go up with weeping[b][a]; for on the descent of Horonaim they have heard the distressing cry of destruction.
translation:
  language: zh_hans
  text: 因为在鲁希的上坡路上，人哭着上去，哭泣[a]；因为在何罗念的下坡路上，听见了因毁灭而发出的凄厉呼号[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文在本句两次使用“哭泣”一词以示强调，直译近似：“人带着哭泣上去——哭泣。”
    reason: lexical_alternative
  - marker: b
    text: 本句的希伯来文较难解释。另一种较直译的理解是：“敌人听见了毁灭的呼喊。”
    reason: alternative_reading
lexical_decisions:
- source_word: מַעֲלֵה הַלֻּחוֹת
  choice: 上鲁希坡的路上
  rationale: מַעֲלֵה 指向上的坡道或上坡路；הַלֻּחוֹת 在此是地名“鲁希”。此译既保留地形含义，也与后半句的“下……的路上”形成对应。
- source_word: בִּבְכִי ... בֶּכִי
  choice: 哭着……哭泣不止
  rationale: 原文两次使用名词“哭泣”以加强哀恸。中文采用自然的动词表达，同时通过重复“哭”保留强调作用。
- source_word: יַעֲלֶה
  choice: 人……上去
  rationale: 形式上是第三人称阳性单数，但语境中可作不定或集合性用法，指逃难者；用泛指的“人”既不强行指定单一人物，也符合现代汉语。
- source_word: בְּמוֹרַד חוֹרֹנַיִם
  choice: 在下何罗念的路上
  rationale: מוֹרַד 指下坡、下行之路，与前句的 מַעֲלֵה 构成地形上的对照；חוֹרֹנַיִם 是地名“何罗念”。
- source_word: צָרֵי
  choice: 凄厉
  rationale: 此词形式和句法较难确定。正文按修饰“呼喊”的理解，表达痛苦、危急的声音；另一个可能的分析“敌人”列入脚注，以保留原文歧义。
- source_word: צַעֲקַת שֶׁבֶר
  choice: 毁灭的……呼喊
  rationale: צַעֲקָה 是大声呼喊或哀号；שֶׁבֶר 在审判语境中指破败、毁灭。此译清楚表达灾难中的呼声。
- source_word: שָׁמֵעוּ
  choice: 人们听见了
  rationale: 原文为第三人称复数完成式，主语未明说。译作“人们”保留不定的复数主体，不把它擅自认定为某一群体。
