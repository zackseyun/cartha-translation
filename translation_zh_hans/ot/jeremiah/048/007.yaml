  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כִּ֠י יַ֣עַן בִּטְחֵ֤/ךְ בְּ/מַעֲשַׂ֨יִ/ךְ֙ וּ/בְ/א֣וֹצְרוֹתַ֔יִ/ךְ גַּם אַ֖תְּ תִּלָּכֵ֑דִי וְ/יָצָ֤א כמיש בַּ/גּוֹלָ֔ה כֹּהֲנָ֥י/ו וְ/שָׂרָ֖י/ו יחד־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/007.yaml
  text: Because you trusted in your works and in your treasures[a], you also will be captured; and Chemosh will go out into exile[e][d][c][b], his priests and his officials together.
translation:
  language: zh_hans
  text: 因为你倚靠自己的作为和财宝[a]，你也必被攻取。基抹[b]必被掳去[c]，他的祭司和首领[d]也必一同被掳。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “作为”也可译作“行为”或“所造的”；“财宝”也可译作“财富”或“库藏”。
    reason: lexical_alternative
  - marker: b
    text: 基抹是摩押人所敬奉的神。
    reason: cultural_note
  - marker: c
    text: “被掳去”也可译作“流亡”或“被带去作俘虏”。
    reason: lexical_alternative
  - marker: d
    text: “首领”也可译作“官长”或“王公”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי יַעַן
  choice: 因为
  rationale: 该组合加强因果语气；现代汉语用“因为”已能自然、明确地表达审判的缘由，无须生硬叠加连接词。
- source_word: בִּטְחֵךְ
  choice: 你倚靠
  rationale: בטח 的 Qal 完成式第二人称阴性单数表示摩押已经把信心寄托于某物；“倚靠”既自然，也保留依赖、信赖之意。
- source_word: בְּמַעֲשַׂיִךְ
  choice: 自己的作为
  rationale: מַעֲשֶׂה 可指工作、行为或所造之物；“作为”保持较宽的语义范围，不限定为军事、宗教或工程成就。
- source_word: וּבְאֹצְרוֹתַיִךְ
  choice: 和财宝
  rationale: אֹצָר 可指财宝、财富、库房；在“倚靠”的语境中，“财宝”最自然地表达积存的财富资源，同时以脚注保留其他可能。
- source_word: גַּם אַתְּ
  choice: 你也
  rationale: 保留 גַּם 的强调兼包含作用，指出摩押也不能逃过被攻取的结局。
- source_word: תִּלָּכֵדִי
  choice: 必被攻取
  rationale: לכד 的 Niphal 未完成式在此是预言性的被动表达；“被攻取”贴合城邦或国家陷落的军事语境，也不把对象缩窄为个人被捕。
- source_word: וְיָצָא
  choice: 必被掳去
  rationale: 字面为“出去”，但与 בַּגּוֹלָה 连用表示被带走流亡；汉语合译为“被掳去”能自然呈现强制迁徙。
- source_word: כמיש
  choice: 基抹
  rationale: 采用现代中文圣经语境中通行的摩押神名音译，不将其解释为地名或王朝称号。
- source_word: בַּגּוֹלָה
  choice: 被掳去
  rationale: גּוֹלָה 表示被迁徙、流亡或被掳；与 וְיָצָא 合译，以避免不自然的“出去进入流亡”。
- source_word: כֹּהֲנָיו
  choice: 他的祭司
  rationale: 第三人称阳性单数后缀以基抹为先行词；“他的”保留经文对该神祇的拟人化叙述。
- source_word: וְשָׂרָיו
  choice: 和首领
  rationale: שַׂר 可指首领、官长、统治者或王公；“首领”范围较宽，并以脚注提示其他译法。
- source_word: יַחַד
  choice: 一同
  rationale: 准确表达基抹、祭司与首领共同遭到放逐。
theological_decisions:
- issue: 基抹的所指与身份
  choice: 将基抹译为摩押神祇的专名，并按经文拟人化地描述他被掳去。
  alternative: 把“基抹”理解为地名或王朝称号。
  rationale: 上下文及已知古代摩押背景支持其为摩押的神；直译专名可保留预言中神祇随其敬拜者一同败亡流放的讽刺与论战意味，而不加入额外的教义解释。
- issue: “他的首领”与基抹的关系
  choice: 依语法将第三人称后缀指向基抹，译作“他的……首领”。
  alternative: 把首领理解为摩押的首领，并译成“摩押的首领”。
  rationale: 希伯来文两个阳性单数后缀平行出现，最直接的先行词都是基抹；保留这种表达，避免替原文消解神庙与国家体制之间可能存在的张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“你”按希伯来文阴性单数，指向被拟人化的摩押；用“必”体现预言性审判的确定语气。后半句为避免中文歧义而重复“被掳”，同时保留原文中基抹、祭司和首领一同遭放逐的整体结构。
