base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/030.yaml
  text: I know his wrath[a], declares Yahweh, and it is not so; his boasts have accomplished nothing.
translation:
  language: zh_hans
  text: “我知道他的盛怒，”耶和华宣告，“但并非如此；他的夸口毫无成就。[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “他的夸口毫无成就”所译的末句希伯来文十分简练，含义不易确定。也可理解为：他的虚言或空话并没有产生所夸称的结果。
    reason: 说明 בַּדָּיו 可指虚言、空话或夸口，并保留 לֹא כֵן עָשׂוּ 这一压缩短语的解释不确定性。
lexical_decisions:
- source_word: יָדַעְתִּי
  choice: 我知道
  rationale: Qal完成式第一人称单数在此表达耶和华确定、持续的认识，现代汉语用现在时“我知道”自然准确。
- source_word: נְאֻם יְהוָה
  choice: 耶和华宣告
  rationale: 保留庄严的先知宣告公式，并以“耶和华”音译四字神名。
- source_word: עֶבְרָתוֹ
  choice: 他的狂妄
  rationale: עֶבְרָה基本含有越界、激烈迸发之意，可指盛怒，也可在骄傲语境中指狂妄、傲慢；本节紧接上文对摩押骄傲自大的列举，因此正文取“狂妄”，另一词义在脚注说明。
- source_word: וְלֹא כֵן
  choice: 但实情并非如此
  rationale: 保留原文简短的否定反驳；“实情”使现代汉语通顺，同时不明确补出原文省略的具体对象。
- source_word: בַּדָּיו
  choice: 他的夸口
  rationale: 该复数名词可指虚言、谎话或空洞的夸耀；结合摩押骄傲的上下文，“夸口”最贴切。
- source_word: לֹא כֵן עָשׂוּ
  choice: 一事无成
  rationale: 原文直译近于“它们并没有如此行成”，措辞压缩且所指不明；按“夸口”为主语表达这些话未能造成所声称的现实。脚注保留较直译的可能。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 采用简体中文圣经读者最熟悉、庄重且可辨识的专名形式；不以“主”替代原文专名。
- issue: עֶבְרָתוֹ 在本段是“狂妄”还是“盛怒”
  choice: 狂妄
  alternative: 盛怒
  rationale: 上文集中指责摩押的骄傲、自高和狂傲，故语境支持“狂妄”；但“盛怒”是该词真实且常见的词义，故列入脚注，不把词义张力隐藏起来。
- issue: 压缩短语 בַּדָּיו לֹא כֵן עָשׂוּ 的理解
  choice: 他的夸口一事无成
  alternative: 他的虚言并非如此；它们没有这样成就
  rationale: 正文传达摩押夸口落空的语境意义，同时以脚注明示原文的困难、复数动词及其他可行理解，避免把不确定解释成唯一答案。
