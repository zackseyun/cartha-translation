source:
  edition: WLC
  text: קָר֥וֹב אֵיד מוֹאָ֖ב לָ/ב֑וֹא וְ/רָ֣עָת֔/וֹ מִהֲרָ֖ה מְאֹֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/016.yaml
  text: The disaster of Moab is near to come[b][a], and his calamity is hurrying very quickly.
translation:
  language: zh_hans
  text: 摩押的灾难快要临到[a]；他的灾祸[b]正飞速逼近。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“摩押的灾难临近了；他的灾祸迅速逼近。”
    reason: 句法上，קָרוֹב 可单独表达“临近”，也可与 לָבוֹא 连读为“快要临到”。
  - marker: b
    text: 或译“它的灾祸”。原文后缀为阳性单数，把摩押作为人格化的国家来指称。
    reason: 说明原文代词的语法形式及汉语可采用的非人格化译法。
lexical_decisions:
- source_word: קָרוֹב
  choice: 快要
  rationale: 作谓语形容词，表达事情迫近、即将发生；与“临到”连用，符合现代汉语表达。
- source_word: אֵיד
  choice: 灾难
  rationale: 指毁灭性的祸患或灾变；“灾难”清楚自然，也符合先知宣告审判的语境。
- source_word: מוֹאָב
  choice: 摩押
  rationale: 采用该地名和民族名的通行中文译名。
- source_word: לָבוֹא
  choice: 临到
  rationale: ל 加不定式表示即将来临；“临到”保留灾难到来的动态，又符合庄重的经文语体。
- source_word: רָעָתוֹ
  choice: 他的灾祸
  rationale: 此处 רָעָה 指临到的祸患，并非道德意义上的“邪恶”。阳性单数后缀把摩押作为人格化的国家来指称；正文用“他的”保留这一修辞。
- source_word: מִהֲרָה
  choice: 正飞速逼近
  rationale: 该动词表达迅速行动或赶来；结合灾祸来临的语境译作“逼近”，比直译“赶快”更自然，并保留动态感。
- source_word: מְאֹד
  choice: 飞速
  rationale: 这是加强速度的程度副词；“飞速”简洁地传达“极其迅速”的强调语气。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的先知书语体。“快要临到”传达迫切性，“飞速逼近”保留后半句的强烈动态。正文以“他的”呈现摩押被人格化的效果，并用脚注交代“它的”这一自然替代译法。
