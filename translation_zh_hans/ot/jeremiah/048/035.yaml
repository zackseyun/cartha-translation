base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/035.yaml
  text: And I will put an end in Moab—oracle of Yahweh—to the one who goes up to the high place and burns incense to his god[a].
translation:
  language: zh_hans
  text: 我要使摩押不再有人登上丘坛、向自己的神烧香——这是雅威的宣告。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我要使摩押境内丘坛上的敬拜止息……”原文用两个阳性单数分词（“登上……的人”和“烧香的人”），可能以单数代表所有这类敬拜者。
    reason: alternative_reading
lexical_decisions:
- source_word: וְהִשְׁבַּתִּי
  choice: 我要使……绝迹
  rationale: שׁבת 的使役式表达“使停止、使不复存在”。此处宾语由后面的两个阳性单数分词构成，译作“使……的人绝迹”既保留使役语气，也符合现代汉语。
- source_word: לְמוֹאָב
  choice: 摩押境内
  rationale: 这里的 לְ 表示事情发生或被终止的范围；“摩押境内”自然地说明这种敬拜活动将在摩押被除去。
- source_word: נְאֻם יְהוָה
  choice: 这是雅威的宣告
  rationale: נְאֻם 是庄重的先知宣告公式；译为“这是……的宣告”保留其名词性和郑重语体。יהוה 按其专名音译为“雅威”。
- source_word: מַעֲלֶה בָמָה
  choice: 那登上丘坛的人
  rationale: מַעֲלֶה 是“上去、登上”的阳性单数分词，בָמָה 指用于祭祀的高处或丘坛。“登上丘坛”保留原文的空间意象，没有把动词解释性改译为“献祭”。
- source_word: וּמַקְטִיר
  choice: 烧香
  rationale: קטר 的使役式在祭祀语境中可指焚香或使祭物冒烟；“烧香”简洁自然，并保留常见的礼仪含义。
- source_word: לֵאלֹהָיו
  choice: 向自己的神
  rationale: אֱלֹהִים 虽具复数形态，此处带第三人称阳性单数后缀，语境中自然理解为单数。“自己的神”清楚传达所属关系。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名，音译“雅威”保留其作为以色列之神专名的功能，不以称号替代。
- issue: 被终止的是敬拜者还是丘坛敬拜活动
  choice: 保留阳性单数分词，译为“那……的人”
  alternative: “使摩押的丘坛敬拜止息”
  rationale: 原文 מַעֲלֶה 与 מַקְטִיר 都是阳性单数分词，句法上直接指向一个代表性的敬拜者；正文保留这一形式，同时用脚注说明它也可能泛指整类敬拜者及其活动。
- issue: קטר 所指的祭祀行为
  choice: 烧香
  alternative: 焚烧祭物；使祭物冒烟
  rationale: 该词在礼仪语境中有一定语义宽度。“烧香”是最自然的正文表达，但不应据此断定这里只排除其他焚烧祭物的可能。
translation_notes:
  register: 采用现代、庄重而易懂的先知宣告语体。“丘坛”比直译“高处”更清楚地指向祭祀场所；破折号突出“这是雅威的宣告”这一公式。正文保留原文单数代表性敬拜者的句法，脚注交代概括为敬拜活动的可行译法。
