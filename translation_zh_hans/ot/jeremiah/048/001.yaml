  rationale: 仅作保守的措辞与语序修订：“论摩押”保持标题介词的语义宽度并更贴合汉语经文体；将“万军之雅威、以色列的神”按希伯来文称号顺序排列。其余译文和脚注均可保留，尤其保留 הַמִּשְׂגָּב 的普通名词与地名两种可能，避免消除文本歧义。
