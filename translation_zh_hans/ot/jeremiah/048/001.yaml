source:
  edition: WLC
  text: לְ/מוֹאָ֡ב כֹּֽה אָמַר֩ יְהוָ֨ה צְבָא֜וֹת אֱלֹהֵ֣י יִשְׂרָאֵ֗ל ה֤וֹי אֶל נְבוֹ֙ כִּ֣י שֻׁדָּ֔דָה הֹבִ֥ישָׁה נִלְכְּדָ֖ה קִרְיָתָ֑יִם הֹבִ֥ישָׁה הַ/מִּשְׂגָּ֖ב וָ/חָֽתָּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/001.yaml
  text: 'Concerning Moab: Thus says Yahweh of hosts[a], the God of Israel: Woe to Nebo, for it is devastated. Kiriathaim is put to shame; it is captured[b]. The stronghold is put to shame and shattered.'
translation:
  language: zh_hans
  text: '论摩押[a]。


    万军之雅威、以色列的神如此说：


    “尼波有祸了！因为它已被毁坏。


    基列亭蒙羞，被攻取；


    堡垒[b]蒙羞，崩毁了。”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 标题也可译作“攻击摩押的话”。
    reason: alternative_reading
  - marker: b
    text: “堡垒”也可理解为地名“米斯迦”。
    reason: alternative_reading
lexical_decisions:
- source_word: לְמוֹאָב
  choice: 关于摩押
  rationale: 介词 לְ 用在先知宣告的标题中，范围较广；“关于”自然地引出针对摩押的宣告，又不把介词本身过度解释为敌对含义。
- source_word: יְהוָה צְבָאוֹת
  choice: 万军之雅威
  rationale: “雅威”音译神的专名；“万军”保留 צְבָאוֹת 的传统且可理解的表达，传达他统管天上和地上一切军旅。
- source_word: הוֹי אֶל נְבוֹ
  choice: 尼波有祸了
  rationale: הוֹי 在审判宣告中兼有哀叹和谴责意味；“有祸了”符合现代汉语先知性警告的语气。
- source_word: כִּי שֻׁדָּדָה
  choice: 因为它已被毁坏
  rationale: שׁדד 的被动形式表示因劫掠而遭到毁坏；“被毁坏”传达结果，同时不限定为彻底毁灭或单纯抢掠。
- source_word: הֹבִישָׁה
  choice: 蒙羞
  rationale: 使役词形在此表示被置于羞辱之中；“蒙羞”比单纯的内心“羞愧”更贴切，也保持诗行凝练。
- source_word: נִלְכְּדָה
  choice: 被攻取
  rationale: 该词在军事语境中表示城邑被夺取；“被攻取”自然明确。
- source_word: הַמִּשְׂגָּב
  choice: 堡垒
  rationale: 定冠词及该名词的一般词义支持将其理解为普通名词，指坚固的防御高地或堡垒；地名读法保留在脚注。
- source_word: וָחָתָּה
  choice: 崩毁了
  rationale: חתת 可表示破碎、崩溃或惊惶；以堡垒为主语并与毁坏、攻取平行时，“崩毁”最自然，同时保留其遭彻底击垮的力度。
theological_decisions:
- issue: 审判语境中标题介词 לְ 的译法
  choice: 关于摩押
  alternative: 攻击摩押；论到摩押
  rationale: 全章内容明显针对摩押施行审判，但 לְ 本身并非明确表示敌对的介词。“关于”保留其较宽泛的语义，让下文呈现审判性质。
- issue: הַמִּשְׂגָּב 是普通名词还是地名
  choice: 普通名词“堡垒”
  alternative: 地名“米斯迦”
  rationale: 定冠词和常见词义较支持普通名词读法；因地名读法具有历史翻译依据，故在脚注中保留。
- issue: 神名 יְהוָה 的呈现
  choice: 雅威
  alternative: 耶和华；主
  rationale: 音译神名可区分专名与称号，并直接反映希伯来文本；不借此引入任何宗派性解释。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。保留先知宣告的短促诗行和审判力度；地名依通行中文音译处理。脚注标记分别置于其实际所说明的“摩押”和“堡垒”之后，避免英文咨询层中标记位置造成的歧义。
