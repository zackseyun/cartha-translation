base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/028.yaml
  text: Leave the cities and dwell in the rock[a], inhabitants of Moab, and be like a dove that nests on the sides of the mouth of a pit.
translation:
  language: zh_hans
  text: 摩押的居民哪，要离开城邑，住在岩石间；要像鸽子，在坑[a]口两侧筑巢。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “坑”也可译作“陷阱坑”或“捕兽坑”；希伯来词可指用作陷阱的坑，使这幅避难图景更显危险。
    reason: lexical_alternative
lexical_decisions:
- source_word: עִזְבוּ עָרִים
  choice: 离开城邑
  rationale: 复数命令式要求摩押居民离开其城市；“城邑”既准确又符合庄重的先知文体。
- source_word: וְשִׁכְנוּ בַּסֶּלַע
  choice: 住在岩间
  rationale: שׁכן表示居住、栖身，סלע表示岩石或峭壁；“住在岩间”自然地传达在岩石地带避难，而不额外限定为洞穴。
- source_word: יֹשְׁבֵי מוֹאָב
  choice: 摩押的居民哪
  rationale: 这是呼语；加“哪”清楚表达直接呼告，并保持先知话语的庄重感。
- source_word: וִהְיוּ כְיוֹנָה
  choice: 要像鸽子
  rationale: 保留命令语气及明示的比喻，不把“成为”和“像”之间的关系过度解释。
- source_word: תְּקַנֵּן
  choice: 筑巢
  rationale: 该阴性单数动词与“鸽子”呼应；中文用“筑巢”简洁自然。
- source_word: בְּעֶבְרֵי פִי פָחַת
  choice: 在坑口两侧
  rationale: פִּי直译为“口”，用于坑的开口；עֶבְרֵי在此指两边或侧面。“坑口两侧”保留空间意象，并符合现代汉语。
theological_decisions: []
