base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/018.yaml
  text: Come down from your glory and sit in thirst[a], O inhabitant, daughter of Dibon, for the destroyer of Moab has come up against you[b]; he has destroyed your fortresses.
translation:
  language: zh_hans
  text: 底本的女居民啊[b]，要从荣耀中下来，坐在干渴之地[a]！因为那毁灭摩押的已经上来攻击你，摧毁了你的堡垒。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“坐在干渴中”。希伯来语既可指干渴本身，也可指干旱、荒芜之地。
    reason: lexical_alternative
  - marker: b
    text: 原文把底本城及其居民人格化为女子，直译近于“住在底本的女儿”。
    reason: cultural_note
lexical_decisions:
- source_word: רְדִי מִכָּבוֹד
  choice: 要从荣耀中下来
  rationale: 阴性单数祈使式呼告被拟人化的城市；“从荣耀中下来”保留由尊荣地位降卑的空间意象，不把“荣耀”限缩为财富或舒适。
- source_word: ישבי בַצָּמָא
  choice: 坐在干渴之地
  rationale: 将 ישבי 按阴性单数祈使式“坐下”理解，并把 בַצָּמָא 译为处境或地点性的“干渴之地”；原文也可能指“坐在干渴中”，故以脚注保留歧义。
- source_word: יֹשֶׁבֶת בַּת דִּיבוֹן
  choice: 住在底本城的居民啊
  rationale: 原文直译近于“住在底本的女儿”；这是先知文学将城市及其居民女性化、人格化的表达。正文用自然中文表达呼告对象，文化意象在脚注说明。
- source_word: שֹׁדֵד מוֹאָב
  choice: 毁灭摩押的
  rationale: שֹׁדֵד 可指毁坏者、劫掠者或蹂躏者；此处以分词短语表达来犯之敌，并避免生硬的名词化。
- source_word: עָלָה בָךְ
  choice: 已经上来攻击你
  rationale: 保留 עָלָה 的“上来”这一进军方向，同时用“攻击”自然表达 בָךְ 在军事语境中的敌对含义。
- source_word: שִׁחֵת מִבְצָרָיִךְ
  choice: 摧毁了你的堡垒
  rationale: שִׁחֵת 表示毁坏、破坏；מִבְצָרָיִךְ 指设防之地或堡垒。该译法清楚传达军事毁灭。
