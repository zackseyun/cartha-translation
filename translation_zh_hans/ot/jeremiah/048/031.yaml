  text: עַל כֵּן֙ עַל מוֹאָ֣ב אֲיֵלִ֔יל וּ/לְ/מוֹאָ֥ב כֻּלֹּ֖/ה אֶזְעָ֑ק אֶל אַנְשֵׁ֥י קִֽיר חֶ֖רֶשׂ יֶהְגֶּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/031.yaml
  text: Therefore I will wail over Moab[a], and I will cry out for all Moab[b]; for the men of Kir-heres one moans.
translation:
  language: zh_hans
  text: 因此，我要为摩押哀号，为整个摩押呼喊；有人为基珥·赫列斯[b]的男子悲吟[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 末句的希伯来文较难确定，也可译作：“我为基珥·赫列斯的男子悲吟”，或“他为基珥·赫列斯的男子悲吟。”
    reason: lexical_alternative
  - marker: b
    text: “基珥·赫列斯”是此处希伯来地名的音译；平行经文中还出现相关的较长形式“基珥·哈列设”。
    reason: alternative_reading
lexical_decisions:
- source_word: אֲיֵלִיל
  choice: 哀号
  rationale: 该词是 ילל 的使役形，在这里表示发出响亮而强烈的哀声。“哀号”既保留声音和悲痛的强度，也符合现代汉语的哀歌语境。
- source_word: אֶזְעָק
  choice: 呼喊
  rationale: זעק 常指因痛苦或危难而大声呼叫。“呼喊”与“哀号”有所区别，保留了原文两个动词的层次。
- source_word: כֻּלֹּה
  choice: 整个
  rationale: 阴性单数形式回指摩押，意为摩押全境或全体。“整个摩押”在汉语中自然，并保留整体含义。
- source_word: אֶל
  choice: 为
  rationale: אֶל 通常表示“向、到”，但在本句的哀悼语境中可标明悲吟所关涉的对象。译作“为”使汉语通顺，又不改变其哀悼指向。
- source_word: אַנְשֵׁי קִיר חֶרֶשׂ
  choice: 基珥·赫列斯的男子
  rationale: אַנְשֵׁי 字面指“男子们”。此处保留其阳性群体指称，不泛化为“居民”；地名按本节的希伯来语形式音译为“基珥·赫列斯”。
- source_word: יֶהְגֶּה
  choice: 有人……悲吟
  rationale: הגה 可指低声发言、喃喃或悲吟；在挽歌语境中，“悲吟”较贴切。动词为第三人称阳性单数，但主语不明确，译作“有人”避免武断指定所指，同时保留原文的含混。
theological_decisions:
- issue: 末句悲吟者的身份
  choice: 用“有人”保留未明确的第三人称主语
  alternative: 译作“我为基珥·赫列斯的男子悲吟”或“他为基珥·赫列斯的男子悲吟”
  rationale: 马所拉文本的 יֶהְגֶּה 是第三人称阳性单数，与前面两个第一人称动词之间存在张力。经文本身没有清楚交代主语，因此正文不将其改成第一人称，也不指定“他”所指何人。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“哀号—呼喊—悲吟”分别呈现原文三个发声词的力度与音色；末句保持简短，并以脚注说明其句法歧义。
