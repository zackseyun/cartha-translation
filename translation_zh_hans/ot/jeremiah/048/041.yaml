base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/041.yaml
  text: Kerioth has been captured[a], and the strongholds have been seized; and the heart of Moab’s warriors will be on that day like the heart of a woman in labor.
translation:
  language: zh_hans
  text: 加略被攻取，堡垒也被占领；到那日，摩押勇士的心必像临产妇人的心。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַקְּרִיּוֹת
  choice: 加略
  rationale: 该形式既可能是专名“加略”，也可能是普通名词“城邑”。本章多处列举摩押城镇，故正文采用摩押城名“加略”，并以脚注保留另一种读法。
- source_word: נִלְכְּדָה
  choice: 被攻取
  rationale: לכד 的尼法勒式表示被捕获、被夺取；“被攻取”自然呈现城邑陷落的军事语境和被动意义。
- source_word: הַמְּצָדוֹת
  choice: 堡垒
  rationale: 该词指设防之地或要塞；“堡垒”简洁、现代，也不额外限定其地形。
- source_word: נִתְפָּשָׂה
  choice: 被占领
  rationale: תפשׂ 的被动式表示被抓住、夺取；用于堡垒时译作“被占领”合乎汉语军事语境，并与前句“被攻取”略作区分。
- source_word: לֵב
  choice: 心
  rationale: “心”在希伯来语中可指内在状态、勇气或意志。保留“心”的意象，不将其单一解释为“胆量”。
- source_word: גִּבּוֹרֵי מוֹאָב
  choice: 摩押勇士
  rationale: גִּבּוֹרֵי 在此为军事用语，指英勇善战之人；“勇士”庄重自然，并保留原文的军事色彩。
- source_word: בַּיּוֹם הַהוּא
  choice: 到那日
  rationale: 这是先知文学常见的时间表达；“到那日”符合现代汉语，也保留预告性。
- source_word: כְּלֵב אִשָּׁה מְצֵרָה
  choice: 像临产妇人的心一样
  rationale: מְצֵרָה 在此描写临产中的妇人。直译其比喻，保留恐惧、痛苦和无力感的复合意象，而不将其释义化。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。保留两个被动分句和“心”的希伯来意象；末句用“临产妇人”准确表达分娩中的痛苦与惊惧。
