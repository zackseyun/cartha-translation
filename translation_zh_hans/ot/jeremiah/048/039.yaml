base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/039.yaml
  text: How shattered she is! Wail! How Moab has turned her back in shame! So Moab has become a laughingstock and a horror to all around her[a][b].
translation:
  language: zh_hans
  text: 摩押何等破败！你们要哀号！摩押何等羞愧地转身退去[b]！摩押成了四围众人的笑柄和令人惊骇的对象[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “令人惊骇的对象”或译“恐怖”或“令人惊骇之物”。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“转过颈背（或背）”；这是形容因羞愧而退却或逃离的说法。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵיךְ
  choice: 何等
  rationale: 保留哀歌中强烈的感叹语气，不将其平化为一般陈述。
- source_word: חַתָּה
  choice: 破败
  rationale: 此处描写摩押遭受打击、国家崩溃的状态；“破败”既传达破碎、败落之意，又符合现代汉语对国族覆亡的表达。
- source_word: הֵילִילוּ
  choice: 你们要哀号
  rationale: 保留复数命令语气及原文强烈的哀恸呼喊。
- source_word: הִפְנָה עֹרֶף
  choice: 转身退去
  rationale: 原文直译为“转过后颈/背”，是退却、逃离的形象说法；正文采用自然汉语表达，脚注保留字面意象。
- source_word: מוֹאָב
  choice: 摩押
  rationale: 采用现代中文圣经传统通行的专名译法。
- source_word: בּוֹשׁ
  choice: 羞愧地
  rationale: 在句中表达摩押带着羞耻退却的状态，保留受辱主题。
- source_word: וְהָיָה
  choice: 成了
  rationale: 将完成式理解为审判所造成的结果状态，与本节生动呈现灾祸已经临到的语境相符。
- source_word: לִשְׂחֹק
  choice: 笑柄
  rationale: 准确表达成为他人讥笑对象之意，也是自然、鲜明的现代汉语。
- source_word: לִמְחִתָּה
  choice: 可怕的景象
  rationale: 该词可指恐怖、惊骇或令人惊骇之物；此译在汉语中自然地表达摩押成为四围之人惊骇对象的含义，同时以脚注保留词义范围。
- source_word: לְכָל סְבִיבָיו
  choice: 四围众人的
  rationale: 保留“所有在其周围者”的宽泛含义，不擅自限缩为邻国或邻舍。
