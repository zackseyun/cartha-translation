  text: 又临到基列亭，又临到伯迦末，又临到伯米恩——
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַל
  choice: 又临到
  rationale: 介词עַל在审判宣告的语境中表示灾祸或审判所临及的对象。译为“临到”既符合现代汉语先知性宣告的表达，也保留其方向性；三次重复则再现希伯来文的节奏。
- source_word: קִרְיָתַיִם
  choice: 基列亭
  rationale: 这是摩押地名，按希伯来语音译；词形虽看似双数，句中作为专名使用，不按普通名词意译。
- source_word: בֵּית גָּמוּל
  choice: 伯迦末
  rationale: 这是以בֵּית开头的复合地名，采用简洁、可读的传统式汉语音译，不意译为“迦末之家”。
- source_word: בֵּית מְעוֹן
  choice: 伯米安
  rationale: 这是复合地名，采用汉语音译，不将בֵּית拆译为“家”或“殿”，以保持其专名性质。
theological_decisions:
- issue: עַל在审判清单中的语义
  choice: 译作“临到”
  alternative: 译作“攻击”或“反对”
  rationale: 本节承接上文列举审判所临到的摩押城邑；原文只用介词，并未在本节明说攻击者或具体行动。译作“临到”保留省略和审判语境，避免过度明确化。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。保留三次“又临到”，对应原文三次וְעַל的排比和审判宣告节奏；句末破折号表示名单仍向下延续。
