  text: שָׁמַ֥עְנוּ גְאוֹן מוֹאָ֖ב גֵּאֶ֣ה מְאֹ֑ד גָּבְה֧/וֹ וּ/גְאוֹנ֛/וֹ וְ/גַאֲוָת֖/וֹ וְ/רֻ֥ם לִבּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/029.yaml
  text: We have heard of the pride of Moab—he is exceedingly proud—of his haughtiness[a], his pride, his arrogance, and the loftiness of his heart.
translation:
  language: zh_hans
  text: 我们听说摩押的骄傲——他极其骄傲——他的高傲[a]、骄矜、狂妄，以及他内心的自高。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“高大”。该词本指高度；在此连续谴责骄傲的语境中，也可指比喻性的高傲。
    reason: 词义与表达方式的另一种可能译法；相关词语兼有“高”与比喻性的“高傲”之意。
lexical_decisions:
- source_word: שָׁמַעְנוּ
  choice: 我们听说
  rationale: Qal完成式第一人称复数；汉语“听说”自然表达已经获悉且广为人知的事实，无须机械标示英语式现在完成时。
- source_word: גְאוֹן מוֹאָב
  choice: 摩押的骄傲
  rationale: 审判语境中 גְאוֹן 指负面的骄傲而非中性的威荣；“摩押”采用通行译名。
- source_word: גֵּאֶה מְאֹד
  choice: 他极其骄傲
  rationale: 保留 מְאֹד 的强烈程度，并将拟人化的摩押以“他”承接，使插入语在现代汉语中自然。
- source_word: גָּבְהוֹ
  choice: 他的高傲
  rationale: 该词本义涉及高度，在此连续谴责骄傲的语境中具有道德性的傲慢含义；“高傲”兼顾高度隐喻和负面语义。
- source_word: וּגְאוֹנוֹ
  choice: 骄矜
  rationale: 保留希伯来文近义词的层叠修辞，不把各项合并；“骄矜”与前文“骄傲”同属语义场而略有变化。
- source_word: וְגַאֲוָתוֹ
  choice: 狂妄
  rationale: 以“狂妄”表达傲慢、妄自尊大的贬义，并与相邻近义词形成累积效果。
- source_word: וְרֻם לִבּוֹ
  choice: 内心的自高
  rationale: רֻם 是“高、升高”，לֵב 是“心”；“内心的自高”既保留心的表达和升高隐喻，也清楚传达骄傲之意。
