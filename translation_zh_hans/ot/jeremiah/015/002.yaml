revisions:
- from: 事情将是这样：他们问你：“我们要往哪里去？”你就对他们说：“雅威如此说：该死的，归于死亡；该受刀剑的，归于刀剑；该遭饥荒的，归于饥荒；该被掳的，归于被掳[a]。”
  to: 当他们问你：“我们要往哪里去？”你就对他们说：“雅威如此说：归于死亡的，归于死亡；归于刀剑的，归于刀剑；归于饥荒的，归于饥荒；归于被掳的，归于被掳[a]。”
  rationale: 修订消除了“该死的”及三个“该……”所加入的道德和应受惩罚意味，以“归于……的，归于……”再现原文四组平行、简略且冷峻的判断公式。开头改为“当……时”，自然表达 וְהָיָה כִּי 所引出的将临情形，不增添具体时间或条件。
