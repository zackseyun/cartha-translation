source:
  edition: WLC
  text: וְ/הָיָ֛ה כִּֽי יֹאמְר֥וּ אֵלֶ֖י/ךָ אָ֣נָה נֵצֵ֑א וְ/אָמַרְתָּ֨ אֲלֵי/הֶ֜ם כֹּֽה אָמַ֣ר יְהוָ֗ה אֲשֶׁ֨ר לַ/מָּ֤וֶת לַ/מָּ֨וֶת֙ וַ/אֲשֶׁ֤ר לַ/חֶ֨רֶב֙ לַ/חֶ֔רֶב וַ/אֲשֶׁ֤ר לָֽ/רָעָב֙ לָֽ/רָעָ֔ב וַ/אֲשֶׁ֥ר לַ/שְּׁבִ֖י לַ/שֶּֽׁבִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/015/002.yaml
  text: 'And it shall be[a], when they say to you, ‘Where shall we go?’ then you shall say to them, ‘Thus says Yahweh: Those for death, to death; and those for the sword, to the sword; and those for famine, to famine; and those for captivity[b], to captivity.’'
translation:
  language: zh_hans
  text: 当他们问你：“我们要往哪里去？”你就对他们说：“雅威如此说：归于死亡的，归于死亡；归于刀剑的，归于刀剑；归于饥荒的，归于饥荒；归于被掳的，归于被掳[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “被掳”也可按语境译作“流亡”；原词指被掳、受囚禁的处境或命运。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: 事情将是这样：……
  rationale: 该组合引出预期将发生的情形。译文保留预言性的将来语气，同时用现代汉语自然衔接下文。
- source_word: יֹאמְרוּ אֵלֶיךָ
  choice: 他们问你
  rationale: 原词直译为“对你说”，但其后直接引出疑问句；汉语用“问你”准确表达话语功能，不增加实质内容。
- source_word: אָנָה נֵצֵא
  choice: 我们要往哪里去？
  rationale: אָנָה询问方向或目的地，יצא本义为“出去、离开”。此处不强加具体离开何处，现代汉语以“往哪里去”自然保留方向含义。
- source_word: כֹּה אָמַר יְהוָה
  choice: 雅威如此说
  rationale: 保留先知传信公式的庄重和直接性，并以“雅威”音译神的专名。
- source_word: אֲשֶׁר לַמָּוֶת לַמָּוֶת
  choice: 该死的，归于死亡
  rationale: 希伯来文简短而重复，表示人被分别归入审判的各类结局。“该……的，归于……”既保留固定类别和严厉节奏，也避免加入“注定”或“指定”等原文未明说的解释。
- source_word: חֶרֶב
  choice: 刀剑
  rationale: 保留具体意象；在先知语境中可指战争或被刀剑杀害，但不将其抽象化为“战争”。
- source_word: רָעָב
  choice: 饥荒
  rationale: 这里指群体性的灾荒和审判类别，并非仅指个人饥饿。
- source_word: שְׁבִי / שֶּׁבִי
  choice: 被掳
  rationale: 该词表示被俘、被掳的处境或命运。采用“被掳”既符合先知书常用语，也与上下文所列结局保持平行。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华／上主
  rationale: 原文直接使用四字神名。译作“雅威”保留其专名性质，而不以称号代替。
- issue: 是否把四类结局解释为神预定或任命
  choice: 保留“该……的，归于……”的简约分类句式
  alternative: “注定要……的，就……”或“被指定要……的，就……”
  rationale: אֲשֶׁר לַ־ 的表达极其简练，语境显出审判的确定性，却没有明确使用“预定”或“任命”的动词；译文不额外解决这一神学张力。
- issue: 重复审判公式的处理
  choice: 逐项保留死亡、刀剑、饥荒、被掳及其重复结构
  alternative: 合并为解释性散文
  rationale: 重复造成冷峻、不可回避的审判节奏，是本句重要修辞和神学效果，不宜软化。
translation_notes:
  register: 采用现代、庄重、可朗读的普通话。审判清单刻意保持短促重复；“该死的”在此按字面表示“归于死亡这一类的人”，不是现代口语中的咒骂。
