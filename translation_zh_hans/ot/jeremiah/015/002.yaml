review_pass:
  verdict: revise
  source_fidelity: “该死的”在现代汉语中通常表示应受死刑者或咒骂语，给原文简略的“归于死亡那一类的人”加入了道德定罪和惩罚意味，不能准确对应 אֲשֶׁר לַמָּוֶת。其余三项以“该受／该遭／该被掳”表达，也相应将原文的分类性短语解释为‘应当承受’。应改为较中性的“归于……的，归于……”，保留原文未明说的归属／命定关系及重复节奏。
  naturalness: 原译整体可读，但“事情将是这样”略显生硬；“当……时”引出预期情形更自然。修订后的审判清单虽有意保留希伯来文的短促和重复，仍符合庄重的现代汉语先知文体。
  terminology: “雅威”恰当保留 יהוה 的专名性质。“刀剑”“饥荒”准确。“被掳”适合表达 שְׁבִי／שֶׁבִי 所指的被掳状态；脚注可将“流亡”明确为语境性替代译法，避免把它当作该词的无条件同义词。
  issues:
  - severity: high
    issue: “该死的”带有原文没有的道德定罪和现代汉语咒骂／刑罚含义。
    rationale: אֲשֶׁר לַמָּוֶת 是与后面各项平行的简略分类语，并未使用表示‘该死’、有罪或应受刑罚的词。译为“归于死亡的”可保留其刻意的简略与歧义。
  - severity: medium
    issue: “该受刀剑的”“该遭饥荒的”“该被掳的”把各项统一解释为‘应当遭受’。
    rationale: 这种解释虽能表达审判语境，却比原文的介词式归类更明确。改用“归于……的”可保持四项形式平行，并避免额外阐释。
