  text: לָ֣/מָּה הָיָ֤ה כְאֵבִ/י֙ נֶ֔צַח וּ/מַכָּתִ֖/י אֲנוּשָׁ֑ה֙ מֵֽאֲנָה֙ הֵֽרָפֵ֔א הָי֨וֹ תִֽהְיֶ֥ה לִ/י֙ כְּמ֣וֹ אַכְזָ֔ב מַ֖יִם לֹ֥א נֶאֱמָֽנוּ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/015/018.yaml
  text: Why has my pain become perpetual[a], and my wound incurable, refusing to be healed? Will you indeed be to me like a deceptive brook, like waters that are not reliable?
translation:
  language: zh_hans
  text: 我的痛苦为何长久不止？我的伤口为何无可医治，怎么也不肯痊愈？难道你对我真会像一条骗人的溪流[a]，像靠不住的水吗？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“会断流的溪流”。这里的希伯来语指令人失望、无法信赖之物；所用意象是溪流看似有水，但人在需要时却可能干涸。
    reason: 说明אַכְזָב的“欺骗／令人失望”语义及不可靠溪流的具体意象，并使替代译法与正文的“溪流”保持一致。
lexical_decisions:
- source_word: כְאֵבִי
  choice: 我的痛苦
  rationale: כאב可指身体或内心的疼痛、苦楚；“痛苦”在现代汉语中自然地涵盖耶利米哀诉中的双重意味。
- source_word: נֶצַח
  choice: 长久不止
  rationale: 此处强调痛苦持续不断，而非抽象的永恒；“长久不止”保留持续性，也符合现代汉语表达。
- source_word: מַכָּתִי
  choice: 我的伤口
  rationale: מכה可指击打或创伤；下文谈到医治和痊愈，因此译作“伤口”最能延续医疗意象。
- source_word: אֲנוּשָׁה
  choice: 无可医治
  rationale: 该词表示伤势严重、难以挽救；结合紧接着的医治用语，“无可医治”准确呈现语境中的绝望程度。
- source_word: מֵאֲנָה הֵרָפֵא
  choice: 怎么也不肯痊愈
  rationale: 原文把伤口人格化，直译为“拒绝被医治”；“怎么也不肯痊愈”既保留这一鲜明修辞，又是自然的现代汉语。
- source_word: הָיוֹ תִהְיֶה לִי
  choice: 难道你对我真要
  rationale: 不定式绝对式与限定动词连用形成强调，并带出质问语气；“难道……真要”保留先知向上帝发出的尖锐反问。
- source_word: אַכְזָב
  choice: 骗人的溪流
  rationale: 该词含欺骗、令人失望或不能信赖之意；在水的意象中，指看似可供水、实际却会断流的溪流。“骗人的溪流”保留原文大胆的拟人化指控。
- source_word: מַיִם לֹא נֶאֱמָנוּ
  choice: 靠不住的水
  rationale: 原文直指不能信赖、无法倚靠的水；“靠不住”是清楚自然的现代汉语，同时与前句的欺骗意象呼应。
theological_decisions:
- issue: 哀歌中直接质问上帝
  choice: 保留第二人称的直接、尖锐反问：“难道你对我真要像……吗？”
  alternative: 弱化为对处境的一般感叹，避免直接说上帝像不可靠的溪流
  rationale: 原文明确以第二人称阳性单数向上帝发问，并使用“欺骗、靠不住”的水流意象。译文不应消解这段哀诉本身保留的神学张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“长久不止”“无可医治”保持哀诉的严肃语气；“怎么也不肯痊愈”自然呈现伤口被人格化的表达；末句保留对上帝毫不缓和的质问。
