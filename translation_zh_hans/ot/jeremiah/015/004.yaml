  text: וּ/נְתַתִּ֣י/ם ל/זועה לְ/כֹ֖ל מַמְלְכ֣וֹת הָ/אָ֑רֶץ בִּ֠/גְלַל מְנַשֶּׁ֤ה בֶן יְחִזְקִיָּ֨הוּ֙ מֶ֣לֶךְ יְהוּדָ֔ה עַ֥ל אֲשֶׁר עָשָׂ֖ה בִּ/ירוּשָׁלִָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/015/004.yaml
  text: And I will make them a horror to all the kingdoms of the earth[a], because of Manasseh son of Hezekiah, king of Judah, because of what he did in Jerusalem.
translation:
  language: zh_hans
  text: 我必使他们成为地上万国惊骇的对象[a]；这是因犹大王、希西家的儿子玛拿西在耶路撒冷所做的事。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“令人战栗之物”或“可怕的对象”。希伯来语这个名词指使人战栗、畏惧或惊骇的人或事物。
    reason: 说明לְזַוֲעָה的词义范围及可行译法。
lexical_decisions:
- source_word: וּנְתַתִּים
  choice: 我必使他们成为
  rationale: נתן与结果性补语和ל连用，在此表示“使……成为”，不是单纯的“给予”；“必”自然表达未完成式在审判宣告中的将来语气。
- source_word: לְזַוֲעָה
  choice: 惊骇的对象
  rationale: 该名词指引起战栗、恐惧或惊骇的人或事物；译作“惊骇的对象”既保留其使旁观者恐惧的作用，也避免误解为他们自己感到惊骇。
- source_word: לְכֹל מַמְלְכוֹת הָאָרֶץ
  choice: 地上万国
  rationale: ל表示他们与观看之列国的关系；“地上万国”是简洁、庄重且符合现代汉语圣经语体的表达。
- source_word: בִּגְלַל
  choice: 这是因为
  rationale: 明确保留原文的因果关系，并使后接较长的身份说明在汉语中清楚自然。
- source_word: מְנַשֶּׁה בֶן יְחִזְקִיָּהוּ
  choice: 希西家的儿子玛拿西
  rationale: 采用汉语圣经中通行的人名译法，并直接表达父子关系。
- source_word: מֶלֶךְ יְהוּדָה
  choice: 犹大王
  rationale: 按现代汉语习惯将王号置于身份短语前，含义与原文一致。
- source_word: עַל אֲשֶׁר עָשָׂה
  choice: 因为他所做的事
  rationale: 保留第二重因果表述，具体说明审判与玛拿西行为之间的关联，不将其弱化为单纯的历史背景。
- source_word: בִּירוּשָׁלִָם
  choice: 在耶路撒冷
  rationale: 直接表达地点，采用通行地名译法。
theological_decisions:
- issue: 犹大所受的群体性审判与玛拿西罪行之间的因果联系
  choice: 明确保留原文两次表达的因果关系
  alternative: 将玛拿西及其行为仅处理为审判的历史背景，或在译文中解释个人与群体责任的关系
  rationale: 原文直言这事是因玛拿西以及他在耶路撒冷所做的事而发生。译文不淡化这种联系，也不添加解释来消除其中关于君王罪行与国家审判的神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“惊骇的对象”略带正式色彩，但能准确呈现他们成为列国所惧怕、战栗之对象的含义。分号帮助区分审判宣告与其因由，同时保留重复的因果结构。
