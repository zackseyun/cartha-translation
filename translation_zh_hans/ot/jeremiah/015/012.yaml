  yaml_path: translation/ot/jeremiah/015/012.yaml
  text: Can iron break iron from the north[b][a], and bronze?
translation:
  language: zh_hans
  text: 铁岂能折断北方的铁和青铜[a][b]？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“铁岂能击碎北方的铁和青铜？”希伯来文表达简略；“北方的铁”也可能是一个整体说法，指格外坚硬的铁。
    reason: lexical_alternative
  - marker: b
    text: “青铜”也可译作“铜”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲיָרֹעַ
  choice: 岂能折断
  rationale: 疑问词 הֲ 与动词 רעע 构成反问；这里谈论金属，表示物理上的折断或击碎。“岂能折断”既自然，也保留了反问语气。
- source_word: בַּרְזֶל
  choice: 铁
  rationale: 该词通常指金属“铁”。
- source_word: בַּרְזֶל מִצָּפוֹן
  choice: 北方的铁
  rationale: 按希伯来语结构直译，保留其可能指来自北方、格外坚硬之铁的含义，同时不把这一解释写死在正文中。
- source_word: וּנְחֹשֶׁת
  choice: 和青铜
  rationale: נְחֹשֶׁת 可指铜或青铜；在金属并列及坚硬材料的语境中，“青铜”较为合适。连接词“和”也予以保留。
theological_decisions: []
