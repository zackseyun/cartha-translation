base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/015/011.yaml
  text: Yahweh said[a], “Surely I have set you free for good[b]; surely I have made the enemy plead with you in a time of disaster and in a time of distress.”
translation:
  language: zh_hans
  text: 耶和华说：“我确实已经为你的益处释放了你[a]；在灾祸之时、患难之际，我确实使仇敌向你恳求[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本句首个动词的希伯来语词形和词义不确定；若对该词形作另一种理解，也可译：“我确实使余民刚强，使他们得益。”
    reason: textual_variant
  - marker: b
    text: 或译：“在灾祸之时、患难之际，我确实在仇敌面前为你求情。”
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代简体中文圣经语境中最通行的上帝圣名译法，明确保留专名性质。
- source_word: אִם לֹא ... אִם ל֣וֹא
  choice: 我确实……我确实
  rationale: 此处并非普通条件句，而是加强语气的断言；“确实”自然传达郑重肯定的语气，并保留两句的平行结构。
- source_word: שרותך
  choice: 已经释放了你
  rationale: 这一形式在文本和词义上都很难确定。正文采用“释放”这一较可能且符合上下文中耶利米蒙保全、得解脱之意的理解，同时在脚注保留主要异读。
- source_word: לְטוֹב
  choice: 使你得益
  rationale: 表达有益的目的或结果；比直译“为好”更符合现代汉语，同时不把益处具体化。
- source_word: הִפְגַּעְתִּי בְךָ ... אֶת הָאֹיֵב
  choice: 使仇敌向你恳求
  rationale: 使役式可表示使某人求告或恳求；结合“仇敌”作受使者，译文表达仇敌在灾难中转而向耶利米求助的意思。另一种句法理解保留在脚注。
- source_word: בְּעֵת רָעָה
  choice: 在灾祸之时
  rationale: 这里的רָעָה指不利处境或灾难，而非道德上的邪恶；“灾祸”庄重且清楚。
- source_word: וּבְעֵת צָרָה
  choice: 患难之际
  rationale: צָרָה表示困厄、患难；与“灾祸之时”构成自然的同义平行。
theological_decisions:
- issue: 对给耶利米之应许中疑难希伯来语的解释
  choice: 译为上帝已经为耶利米的益处释放他，并使仇敌在灾祸中向他恳求。
  alternative: 首句也可能意为“我确实使余民刚强，使他们得益”；次句也可能意为上帝在仇敌面前为耶利米求情。
  rationale: 正文所选读法较符合上下文中耶利米将蒙保全并在敌对者面前得伸张的主题，但原文确有实质性的文本与句法歧义，因此不在正文中武断消除，而以脚注保留主要可能。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“灾祸之时、患难之际”保留原文平行节奏；正文避免加入“你的仇敌”等原文未明说的领属成分。
