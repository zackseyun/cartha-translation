  text: וּ/פָקַדְתִּ֨י עֲלֵי/הֶ֜ם אַרְבַּ֤ע מִשְׁפָּחוֹת֙ נְאֻם יְהוָ֔ה אֶת הַ/חֶ֣רֶב לַֽ/הֲרֹ֔ג וְ/אֶת הַ/כְּלָבִ֖ים לִ/סְחֹ֑ב וְ/אֶת ע֧וֹף הַ/שָּׁמַ֛יִם וְ/אֶת בֶּהֱמַ֥ת הָ/אָ֖רֶץ לֶ/אֱכֹ֥ל וּ/לְ/הַשְׁחִֽית־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/015/003.yaml
  text: 'And I will appoint over them four kinds[a], declares Yahweh: the sword to kill, the dogs to drag away[b], and the birds of the heavens and the beasts of the earth to devour and destroy.'
translation:
  language: zh_hans
  text: 耶和华宣告：“我要派四类[a]来对付他们：刀剑来杀戮，狗来拖走，天空的飞鸟和地上的野兽来吞吃、毁坏。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“四个家族（或宗族）”；这里比喻四类施行审判的力量。
    reason: 说明词语的字面意义及其语境用法。
lexical_decisions:
- source_word: וּפָקַדְתִּי עֲלֵיהֶם
  choice: 我要派……来对付他们
  rationale: פָּקַד与עַל连用时可表达委派敌对力量临到某人。“派……来对付”既保留委派之意，也自然显明这些力量的敌对作用，而不直接把动词缩减为“惩罚”。
- source_word: אַרְבַּע מִשְׁפָּחוֹת
  choice: 四类
  rationale: מִשְׁפָּחוֹת通常指“家族、宗族”，此处比喻性地把刀剑、狗、飞鸟和野兽归为四组施行审判的力量；“四类”在现代汉语中简明自然，并以脚注保留字面信息。
- source_word: נְאֻם יְהוָה
  choice: 耶和华宣告
  rationale: נְאֻם是庄严的先知宣告格式；“宣告”保留其郑重语气。יהוה采用现代简体中文读者熟悉的专名“耶和华”。
- source_word: הַחֶרֶב לַהֲרֹג
  choice: 刀剑来杀戮
  rationale: 保留目的不定式的结构。“杀戮”符合审判语境和先知文学的庄重语域。
- source_word: הַכְּלָבִים לִסְחֹב
  choice: 狗来拖走尸首
  rationale: סחב意为拖、拉走。原文没有明说宾语，但上下文显然涉及被杀者的尸体；正文补出“尸首”使汉语完整，并用脚注说明。
- source_word: עוֹף הַשָּׁמַיִם
  choice: 天空的飞鸟
  rationale: 直译为“诸天的飞鸟”；“天空的飞鸟”是自然现代汉语，也保留其空间意象。
- source_word: בֶּהֱמַת הָאָרֶץ
  choice: 地上的野兽
  rationale: 该词组可泛指地上的兽类；在吞吃尸体的语境中，“野兽”比“牲畜”或一般的“动物”更贴切。
- source_word: לֶאֱכֹל וּלְהַשְׁחִית
  choice: 来吞吃、毁坏
  rationale: 两个并列不定式分别保留为两个动作。אכל在此不是普通进食，而是吞食死者；השחית保留较宽的“毁坏”含义，避免过度限定毁坏的具体方式。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用四字神名。正文用现代中文圣经传统中最广为普通读者识别的专名“耶和华”，而不是以“主”这一称号替代；“雅威”是较贴近学界拟音的另一可行译法。
- issue: “四类”的性质
  choice: 不在正文补出“刑罚”或“毁灭者”
  alternative: 四类刑罚／四类毁灭者
  rationale: 原文只说“四个家族／四类”，随后列出刀剑、狗、飞鸟和野兽。正文保留这一省略和形象张力，不把四类统一解释成抽象刑罚或具人格的毁灭者。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。保留先知宣告的节奏，以“刀剑……狗……飞鸟和野兽……”形成递进式审判图景；避免文言化表达，也不弱化原文中尸体遭弃置吞食的强烈意象。
