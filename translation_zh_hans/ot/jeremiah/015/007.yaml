  text: וָ/אֶזְרֵ֥/ם בְּ/מִזְרֶ֖ה בְּ/שַׁעֲרֵ֣י הָ/אָ֑רֶץ שִׁכַּ֤לְתִּי אִבַּ֨דְתִּי֙ אֶת עַמִּ֔/י מִ/דַּרְכֵי/הֶ֖ם לוֹא שָֽׁבוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/015/007.yaml
  text: I winnowed them with a winnowing fork at the gates of the land[a]; I bereaved, I destroyed my people[b]; they did not turn back from their ways.
translation:
  language: zh_hans
  text: 我用扬谷叉，在这地的城门口簸扬他们[a]；我使我的子民丧子，毁灭他们；他们不回头离开自己的道路[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “这地”也可译作“大地”。这里的上下文是对犹大境内的审判，所以正文译作“这地”。
    reason: lexical_alternative
  - marker: b
    text: “回头”也可译作“悔改”。希伯来语原意是“返回、回转”，在先知书的语境中常含悔改之意。
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶזְרֵם
  choice: 簸扬他们
  rationale: 该动词在这里描写扬谷、簸扬的动作，也可引申为吹散。译作“簸扬”保留农业审判意象，并以“他们”对应第三人称复数宾语后缀。
- source_word: בְּמִזְרֶה
  choice: 用扬谷叉
  rationale: מִזְרֶה指扬谷所用的器具。“扬谷叉”在现代汉语中具体而易懂，也与动词“簸扬”形成清楚连贯的图景。
- source_word: בְּשַׁעֲרֵי הָאָרֶץ
  choice: 在这地的各城门
  rationale: שַׁעֲרֵי为复数“门”，在语境中自然指境内各城的城门；הָאָרֶץ既可指“地”也可指“大地”，此处犹大受审判的上下文支持“这地”。
- source_word: שִׁכַּלְתִּי
  choice: 我使我的子民丧子
  rationale: 该词常指使人失去儿女、遭受丧子之痛。汉语须补明受事者，因而与后面的“我的子民”连读，既自然又保留严厉含义。
- source_word: אִבַּדְתִּי
  choice: 毁灭他们
  rationale: 该词在此为使其灭亡、毁坏之意；“毁灭”直接表达审判力度，补出“他们”使汉语句法完整。
- source_word: עַמִּי
  choice: 我的子民
  rationale: “子民”自然保留该词所含的归属及立约关系色彩，同时适合庄重的先知文体。
- source_word: מִדַּרְכֵיהֶם
  choice: 离开自己的道路
  rationale: דֶּרֶךְ可指实际道路，也可比喻生活方式和行径。“道路”保留希伯来语意象，语境则显明其道德含义。
- source_word: לֹא שָׁבוּ
  choice: 他们仍不回头
  rationale: שׁוּב本义为返回、回转，在先知语境中常带悔改意味。“回头”保留动作意象，不把潜在的悔改含义改写成单一的神学术语；“仍”传达持续不肯转回的语气。
theological_decisions:
- issue: 是否把שׁוּב明确译为“悔改”
  choice: 他们仍不回头离开自己的道路
  alternative: 他们仍不悔改自己的行径
  rationale: 原文使用范围较广的“返回、回转”，虽在先知语境中明显具有悔改意味，却没有采用只能理解为技术性“悔改”的措辞。正文保留“回头”的形象，并在脚注说明其道德含义。
- issue: “我的子民”在审判宣告中的张力
  choice: 保留“我的子民”
  alternative: 我的百姓／这民
  rationale: 原文在毁灭性审判中仍称他们为“我的子民”，形成归属关系与审判之间的神学张力；不应因审判语境而弱化或改写这种称谓。
translation_notes:
  register: 采用现代、庄重而可朗读的普通话。“扬谷叉／簸扬”保留原文具体的农业意象；三个分句以分号连接，再现连续而沉重的审判宣告。正文脚注标记与脚注内容一一对应。
