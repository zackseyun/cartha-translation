  to: 那生过七个孩子的妇人衰败了[a]，她已气绝[b]；她的太阳尚在白昼就落下了[c]。她蒙羞受辱。至于他们剩下的人，我必在他们仇敌面前把他们交给刀剑。这是雅威的宣告。
