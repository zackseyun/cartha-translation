id: JER.15.9
reference: Jeremiah 15:9
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: אֻמְלְלָ֞ה יֹלֶ֣דֶת הַ/שִּׁבְעָ֗ה נָפְחָ֥ה נַפְשָׁ֛/הּ באה שִׁמְשָׁ֛/הּ בְּ/עֹ֥ד יוֹמָ֖ם בּ֣וֹשָׁה וְ/חָפֵ֑רָה וּ/שְׁאֵֽרִיתָ֗/ם לַ/חֶ֧רֶב אֶתֵּ֛ן לִ/פְנֵ֥י אֹיְבֵי/הֶ֖ם נְאֻם יְהוָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/015/009.yaml
  text: She who bore seven has withered away[a]; she has breathed out her life. Her sun has gone down while it was still day. She is ashamed and humiliated. And the remnant of them I will give to the sword before their enemies[c][b], declares Yahweh.
translation:
  language: zh_hans
  text: 那生过七个孩子的妇人衰败了[a]，她已气绝[b]；她的太阳尚在白昼就落下了[c]。她蒙羞受辱。至于他们剩下的人，我必在他们仇敌面前把他们交给刀剑。这是雅威的宣告。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“那七个孩子的母亲衰弱了。”原文表达一位曾被视为儿女众多、福分丰盛的妇人如今凋残。
    reason: lexical_alternative
  - marker: b
    text: 直译：“她呼出了自己的生命（或灵魂）。”意思是她已经死去。
    reason: lexical_alternative
  - marker: c
    text: “白昼中太阳落下”是诗歌意象，表示结局在意料之外过早临到。
    reason: cultural_note
lexical_decisions:
- source_word: אֻמְלְלָה
  choice: 衰败了
  rationale: 该动词表示衰弱、凋残或困顿；“衰败了”既保留崩落之感，也适合此处诗性的哀歌语境。
- source_word: יֹלֶדֶת הַשִּׁבְעָה
  choice: 那生过七个孩子的妇人
  rationale: 直译为“生七个的（妇人）”；补出“孩子”使现代汉语自然，同时保留“七”所表现的丰盛生育与昔日福分。
- source_word: נָפְחָה נַפְשָׁהּ
  choice: 她已气绝
  rationale: 此短语字面涉及把生命之气呼出；“气绝”简洁自然地表达死亡，具体意象另由脚注保留。
- source_word: באה שִׁמְשָׁהּ בְּעוֹד יוֹמָם
  choice: 日头尚在白昼，她的太阳却已落下
  rationale: 保留原文“她的太阳”这一诗歌隐喻，并以“尚……却……”清楚传达结局过早临到。
- source_word: בּוֹשָׁה וְחָפֵרָה
  choice: 她蒙羞受辱
  rationale: 两个近义动词共同加强公开蒙羞与屈辱之意；四字并列简洁庄重。
- source_word: וּשְׁאֵרִיתָם
  choice: 他们剩下的人
  rationale: 指审判后仍存留的人；该译法比术语化的“余民”更易为普通读者理解，也不预先赋予正面神学含义。
- source_word: לַחֶרֶב אֶתֵּן
  choice: 我必把他们交给刀剑
  rationale: 保留希伯来语审判公式中的“交给刀剑”，表达被交付于暴力死亡。
- source_word: לִפְנֵי אֹיְבֵיהֶם
  choice: 使他们落在仇敌面前
  rationale: 保留 לִפְנֵי 的“在……面前”含义，并用“落在”使中文清楚表达暴露于仇敌权势之下。
- source_word: נְאֻם יְהוָה
  choice: 这是雅威的宣告
  rationale: 将预言公式译为庄重自然的现代汉语，并按所给神学决策音译神名 יְהוָה。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；“雅威”较接近学界通行的拟定读音，并保留其作为专名的性质。
- issue: “剩下的人”的神学色彩
  choice: 采用中性的“他们剩下的人”
  alternative: 余民
  rationale: 此处所指的人仍要遭受刀剑审判；译作“余民”可能让现代读者自动联想到蒙拯救的信仰群体，因此保留原词在本节中的中性、悲剧性含义。
translation_notes:
  register: 采用现代、庄重而可朗读的标准普通话。前半节保留“她的太阳”这一突出的希伯来诗歌隐喻；“气绝”传达死亡而不过度解释 נֶפֶשׁ。所有脚注标记均置于相应正文之后。
