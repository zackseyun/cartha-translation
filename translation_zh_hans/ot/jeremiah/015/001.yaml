id: JER.15.1
reference: Jeremiah 15:1
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֵלַ֔/י אִם יַעֲמֹ֨ד מֹשֶׁ֤ה וּ/שְׁמוּאֵל֙ לְ/פָנַ֔/י אֵ֥ין נַפְשִׁ֖/י אֶל הָ/עָ֣ם הַ/זֶּ֑ה שַׁלַּ֥ח מֵֽ/עַל פָּנַ֖/י וְ/יֵצֵֽאוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/015/001.yaml
  text: Then Yahweh said to me[a], “Even if Moses and Samuel were to stand before me, my soul would not be toward this people. Send them away from before me[b], and let them go out.”
translation:
  language: zh_hans
  text: 耶和华对我说：“即使摩西和撒母耳站在我面前，我的心也不会向着这百姓[a]。把他们从我面前赶走[b]，让他们出去！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “我的心也不会向着这百姓”也可译作“我也不会眷顾这百姓”。原文直译近于“我的魂不向着这百姓”。
    reason: 说明 נַפְשִׁי 的拟人化措辞、方向性意象及较通顺的语义选择。
  - marker: b
    text: “从我面前”即“离开我的临在”。
    reason: 说明希伯来语空间性习语 מֵעַל פָּנַי 的含义。
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的神名音译“耶和华”，以专名呈现四字神名，而不以“主”这一称号替代。
- source_word: וַיֹּאמֶר ... אֵלַי
  choice: 对我说
  rationale: 中文叙事无需机械译出连接词 וַ；“对我说”自然、准确地表达动作及其对象。
- source_word: אִם יַעֲמֹד
  choice: 即使……站
  rationale: 此处 אִם 在语境中带让步假设意味；“即使”准确传达无论这两位典范人物出面，判决也不会改变。
- source_word: יַעֲמֹד ... לְפָנַי
  choice: 站在我面前
  rationale: 保留希伯来语的具体意象及潜在的代求意味，不直接增译为“为他们代求”。
- source_word: מֹשֶׁה וּשְׁמוּאֵל
  choice: 摩西和撒母耳
  rationale: 采用现代中文圣经中通行的人名译法。
- source_word: אֵין נַפְשִׁי אֶל־הָעָם הַזֶּה
  choice: 我的心也不会向着这百姓
  rationale: נֶפֶשׁ 在此表示内在意向或眷顾；“我的心……向着”既保留拟人化和方向性意象，又比“我的魂不向着”更符合现代汉语。
- source_word: הָעָם הַזֶּה
  choice: 这百姓
  rationale: 保留集合名词及其民族、盟约群体色彩；“百姓”在庄重现代汉语中自然。
- source_word: שַׁלַּח
  choice: 赶走
  rationale: 命令语境中的 שׁלח 表示打发离开；“赶走”比单独的“打发”更清楚地传达拒绝和驱离，同时不额外指定去处。
- source_word: מֵעַל פָּנַי
  choice: 从我面前
  rationale: 保留原文“从我面前”的空间性表达；脚注说明其含义为离开神的临在。
- source_word: וְיֵצֵאוּ
  choice: 让他们出去
  rationale: 保留承接命令的祈使／愿望语气及“出去”的动作意象，不限定究竟是离开圣所、神的临在还是土地。
theological_decisions:
- issue: 将 נַפְשִׁי 用于耶和华的拟人化表达
  choice: 我的心也不会向着这百姓
  alternative: 我不会眷顾这百姓；我的魂不向着这百姓
  rationale: “我的心……向着”保留神具有个人意向的拟人化修辞和原文的方向性，同时避免生硬的“我的魂”，也不把含义收窄为怜悯、悦纳或眷顾中的某一种。
- issue: 摩西和撒母耳“站在我面前”的作用
  choice: 保留“站在我面前”
  alternative: 在我面前代求；向我恳求
  rationale: 两人在传统中确是典范代求者，但本句动词只明确说“站”；正文保留原文含蓄性，不将代求解释直接写入。
- issue: 命令百姓离开神面前的范围
  choice: “从我面前赶走，让他们出去”而不具体说明去处
  alternative: 把他们逐出我的临在；让他们离开这地
  rationale: 原文明确表达从神面前离开，却未在本句中清楚限定“出去”的目的地；译文保留审判话语的开放性。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“我的心……向着”有意保留原文的拟人化和方向意象；“站在我面前”保留潜在代求意味而不明说；两个脚注标记均已置入正文。
