base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/015/013.yaml
  text: Your wealth and your treasures I will give as plunder[a], without price, because of all your sins[b], throughout all your territory.
translation:
  language: zh_hans
  text: 你的财富和珍宝，我必白白地交作掠物；这是因你的一切罪，这事必遍及你全境。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语末尾可直译为“在（或因）你一切的罪中，并在你一切的边界内”。这里按审判语境将前者译为原因，后者译为范围。“白白地”指不按价钱、没有补偿。
    reason: lexical_alternative
lexical_decisions:
- source_word: חֵילְךָ
  choice: 你的财富
  rationale: חַיִל／חֵיל 可指力量、军队或财富；这里与“珍宝”并列，又处于财物被夺的语境中，因此采用经济意义的“财富”。
- source_word: וְאוֹצְרוֹתֶיךָ
  choice: 和珍宝
  rationale: 该词可指储存的贵重物品或宝库；作为被交出掳掠的对象，“珍宝”在现代汉语中自然贴切。
- source_word: לָבַז אֶתֵּן
  choice: 我要交出去作掠物
  rationale: נתן 与 לָבַז 连用，表示把某物交出去供人掳掠；此译既保留“交出”的动作，也表达其成为战利品的结果。
- source_word: לֹא בִמְחִיר
  choice: 不收分文
  rationale: 直译为“不按价钱”或“不是为价款”，语境含义是无偿交出、得不到任何补偿；“不收分文”简洁而有力度。
- source_word: וּבְכָל חַטֹּאותֶיךָ
  choice: 这是因你的一切罪
  rationale: 审判宣告的语境支持将介词 ב 理解为原因，译作“因”；כָל 由“一切”明确表达。
- source_word: וּבְכָל גְּבוּלֶיךָ
  choice: 并要遍及你的全境
  rationale: גְּבוּל 可指边界或边界以内的疆域；这里表达审判范围覆盖全地，因此译作“遍及你的全境”。
theological_decisions:
- issue: 审判宣告末尾两个介词短语的关系
  choice: 把“你的一切罪”理解为财富被交出掳掠的原因，把“你的全境”理解为其遍及的范围。
  alternative: 较为逐字地译成“在你一切的罪中，并在你一切的边界内”，不明确说明因果关系。
  rationale: 上下文是对犹大的审判宣告，介词 ב 在此可自然表达原因和范围。正文采用通顺的因果及范围表述，脚注同时保留希伯来语结构上的歧义，避免把解释绝对化。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“交出去作掠物”保留先知审判宣告的力度；“不收分文”自然表达无价款、无补偿之意。句末借助“这是……并要……”使因果与地域范围清楚，同时用脚注保留原文介词结构的张力。
