base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/015/021.yaml
  text: And I will deliver you from the hand of evil men[c][b][a], and I will redeem you from the grasp of the ruthless.
translation:
  language: zh_hans
  text: 我要救你脱离恶人的手，也要把你从残暴之人的掌中赎回。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “残暴之人”或译“强横的人”、“暴虐之人”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִצַּלְתִּיךָ
  choice: 我要救你脱离
  rationale: נצל 的使役式在此表示从危险或敌对势力中搭救、解救；“救你脱离”自然明确，并与后面的介词短语顺畅衔接。
- source_word: מִיַּד
  choice: 脱离……的手
  rationale: יָד 本义为“手”，在此也指权势或控制；保留“手”的具体意象，现代汉语仍可自然理解。
- source_word: רָעִים
  choice: 恶人
  rationale: 形容词阳性复数在此作名词，指品行邪恶的人；“恶人”简洁、庄重，不必在汉语中另行标示语法性别。
- source_word: וּפְדִתִיךָ
  choice: 也要救赎你
  rationale: פדה 表示付代价赎回、解救或使人脱离辖制；“救赎”保留其赎回意味及神学分量，同时适合本节平行句式。
- source_word: מִכַּף
  choice: 脱离……的掌握
  rationale: כַּף 本义为手掌，在此喻指抓牢和控制；“掌握”兼顾手掌意象与敌对控制的含义。
- source_word: עָרִצִים
  choice: 强暴之人
  rationale: עָרִיץ 可指凶暴、残酷、令人畏惧的压迫者；“强暴之人”保留暴力和压迫色彩，又避免把词义限定为政治性的“暴君”。
theological_decisions:
- issue: פדה 在即时搭救语境中的表达
  choice: 救赎
  alternative: 解救／赎回
  rationale: 上下文强调耶和华使先知脱离敌人的控制，但 פדה 本身带有赎回、释放的语义厚度；采用“救赎”而不把它缩减为一般性的“解救”。
- issue: רָעִים 的阳性复数
  choice: 恶人
  alternative: 邪恶的人／恶者
  rationale: 该词在希伯来语中为阳性复数并指人类敌手；汉语“恶人”准确表达所指，且不额外断定这些敌手全为男性。
translation_notes:
  register: 采用现代、庄重而易懂的先知文学语体。两分句以“救……脱离／救赎……脱离”形成平行，并分别保留“手”和“掌握”的身体意象；末尾脚注标记已在正文中出现。
