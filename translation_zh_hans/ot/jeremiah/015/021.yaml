revisions:
- from: 我要救你脱离恶人的手，也要救赎你脱离强暴之人的掌握。[a]
  to: 我要救你脱离恶人的手，也要把你从残暴之人的掌中赎回。[a]
  rationale: 修订仅消除“强暴之人”的现代歧义，并将第二分句调整为现代汉语中自然的“从……掌中赎回”结构；不改变原文的平行句法、敌对控制意象或 פדה 所含的赎回语义。
