  text: אַ֣תְּ נָטַ֥שְׁתְּ אֹתִ֛/י נְאֻם יְהוָ֖ה אָח֣וֹר תֵּלֵ֑כִי וָ/אַ֨ט אֶת יָדִ֤/י עָלַ֨יִ/ךְ֙ וָֽ/אַשְׁחִיתֵ֔/ךְ נִלְאֵ֖יתִי הִנָּחֵֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/015/006.yaml
  text: You have forsaken me[a], declares Yahweh; you keep going backward. So I have stretched out my hand against you and destroyed you[b]; I am weary of relenting.
translation:
  language: zh_hans
  text: “你离弃了我，”雅威宣告，“你不断后退[a]。因此，我伸手攻击你，毁灭你；我已厌倦再收回惩罚[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “不断后退”原文直译为“向后走”，以行走的意象描写背离神。
    reason: lexical_alternative
  - marker: b
    text: “收回惩罚”也可译作“改变心意”或“转意不降罚”。原词在这里指不再施行所宣告的审判，并非因道德过错而悔改。
    reason: alternative_reading
lexical_decisions:
- source_word: נָטַשְׁתְּ
  choice: 离弃了
  rationale: “离弃”既表达离开、抛弃，也保留先知责备中关系与盟约破裂的意味。
- source_word: נְאֻם יְהוָה
  choice: 雅威宣告
  rationale: נְאֻם是标明神谕来源的先知性套语；译作“宣告”自然庄重。יהוה按专名译为“雅威”。
- source_word: אָחוֹר תֵּלֵכִי
  choice: 不断后退
  rationale: 原文直译为“向后走”，未完成式在语境中表示持续或惯常行为；保留以行走描写背道的空间意象。
- source_word: וָאַט אֶת יָדִי עָלַיִךְ
  choice: 因此，我伸手攻击你
  rationale: נטה意为伸展；“手攻击你”传达עַל在审判语境中的敌对意味。“因此”体现上下句的结果关系。
- source_word: וָאַשְׁחִיתֵךְ
  choice: 毁灭你
  rationale: שׁחת的使役形在这里表示毁坏或毁灭，符合严厉审判的语境。
- source_word: נִלְאֵיתִי
  choice: 我已厌倦
  rationale: לאה表达疲乏、厌倦；“已厌倦”简洁而有分量。
- source_word: הִנָּחֵם
  choice: 再收回惩罚
  rationale: נחם在本处指不再施行或撤回所宣告的审判；结合语境译出“收回惩罚”，避免让现代读者误以为神因道德过错而悔改。补入“再”自然表达反复宽免后如今不再宽免的语气。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；音译“雅威”保留其作为以色列之神专名的性质，而不以称号替代。
- issue: 用于神的הִנָּחֵם如何理解
  choice: 收回惩罚
  alternative: 后悔；改变心意；回心转意
  rationale: 这里的对象虽未明说，但上下文明确涉及审判。此译法呈现神曾止息惩罚、如今厌倦再如此行的张力，同时避免暗示神为道德错误悔改。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“雅威宣告”保留先知神谕的正式语气；两个第二人称阴性单数指向被人格化的犹大或耶路撒冷，中文无需显明语法性别。
