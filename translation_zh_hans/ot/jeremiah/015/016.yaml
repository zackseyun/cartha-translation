  to: 你的话被寻得，我就吃了它们；你的话成了我心中的欢喜和快乐，因为你的名被称在我身上[a]。雅威——万军之神啊！
  rationale: 修订仅改善汉语表达并校正脚注：以“被寻得”保留被动而符合庄重语体；删去原文未必要求的“已”；将喜乐短语调整为自然的“我心中的欢喜和快乐”；脚注改为准确、可读的惯用语释义。保留“吃了它们”以及“名被称在我身上”的原文意象，未把归属含义直接替换进正文。
