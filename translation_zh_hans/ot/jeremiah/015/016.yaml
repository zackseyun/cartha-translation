  text: נִמְצְא֤וּ דְבָרֶ֨י/ךָ֙ וָ/אֹ֣כְלֵ֔/ם וַ/יְהִ֤י דברי/ך לִ֔/י לְ/שָׂשׂ֖וֹן וּ/לְ/שִׂמְחַ֣ת לְבָבִ֑/י כִּֽי נִקְרָ֤א שִׁמְ/ךָ֙ עָלַ֔/י יְהוָ֖ה אֱלֹהֵ֥י צְבָאֽוֹת־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/015/016.yaml
  text: Your words were found[a], and I ate them, and your words became for me a joy and the delight of my heart, for your name is called over me, O Yahweh, God of hosts.
translation:
  language: zh_hans
  text: 你的话被寻得，我就吃了它们；你的话成了我心中的欢喜和快乐，因为你的名被称在我身上[a]。雅威——万军之神啊！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可意译为“我是奉你的名被称的人”或“我是归在你名下的人”。这是希伯来语惯用表达，表示归属并带有其名。
    reason: 解释 נִקְרָא שִׁמְךָ עָלַי 的惯用含义，同时保留正文“名被称在我身上”的直译意象。
lexical_decisions:
- source_word: נִמְצְאוּ
  choice: 被找到了
  rationale: 保留尼斐勒式的被动形态，不擅自说明是谁寻找或发现了这些话；“找到了”也比生硬的“被发现了”更贴近日常现代汉语。
- source_word: דְבָרֶיךָ
  choice: 你的话
  rationale: 希伯来语为复数；汉语“话”本身可作集合表达，后文用“它们”显出复数指向。
- source_word: וָאֹכְלֵם
  choice: 我就把它们吃了
  rationale: 保留“吃”的鲜明摄取隐喻，并用“就”自然表达叙事上的承接。
- source_word: וַיְהִי דְבָרֶיךָ לִי
  choice: 你的话成了我的
  rationale: “成了”保留结果和转变意味；“我的”自然表达 לִי 所指的个人体验。
- source_word: לְשָׂשׂוֹן וּלְשִׂמְחַת לְבָבִי
  choice: 欢喜和我心中的快乐
  rationale: 分别用“欢喜”和“快乐”表达两个相近的喜乐词，既保留并列强化，也避免机械重复同一个词。
- source_word: נִקְרָא שִׁמְךָ עָלַי
  choice: 你的名已称在我身上
  rationale: 尽量保留“名被称在某人身上”的希伯来语空间性表达，使归属和认同的含义不被正文中的解释完全取代。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见音译呈现四字神名，不以“主”这一称号代替专名。
- source_word: אֱלֹהֵי צְבָאוֹת
  choice: 万军之神
  rationale: 采用清楚而庄重的传统汉语称谓；“万军”保留 צְבָאוֹת 的广度，不局限为地上的军队。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名，正文以音译保留其专名性质，不用称号替代。
- issue: “你的名已称在我身上”的归属惯用语
  choice: 正文保留较直译的表达，并在脚注说明其惯用含义
  alternative: 我是称为你名下的人；我属于你
  rationale: 原文既表达神名与先知的联系，也暗示归属关系。直译可保存其意象和神学张力，脚注则帮助普通读者理解。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。保留“吃话”的原文隐喻和“名称在身上”的特殊表达；以脚注辅助理解，不在正文中消解其意象。
