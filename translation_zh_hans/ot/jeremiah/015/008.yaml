  text: עָֽצְמוּ לִ֤/י אַלְמְנֹתָ/ו֙ מֵ/ח֣וֹל יַמִּ֔ים הֵבֵ֨אתִי לָ/הֶ֥ם עַל אֵ֛ם בָּח֖וּר שֹׁדֵ֣ד בַּֽ/צָּהֳרָ֑יִם הִפַּ֤לְתִּי עָלֶ֨י/הָ֙ פִּתְאֹ֔ם עִ֖יר וּ/בֶהָלֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/015/008.yaml
  text: Their widows have become more numerous to me than the sand of the seas. I have brought against them, against the mother of a young man, a destroyer at noon; I have suddenly made city and terrors fall upon her.
translation:
  language: zh_hans
  text: 她们的寡妇在我面前增多，胜过海沙。我在正午使毁灭者临到她们，临到年轻人的母亲；我使城邑[a]和惊恐骤然临到她。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “城邑”：希伯来文本如此；本句措辞艰涩。有人根据其他读法或释义理解为“痛苦”等。
    reason: 说明马所拉文本的字面读法及其公认的文本／语义困难，同时不在正文中擅自改写。
lexical_decisions:
- source_word: עָצְמוּ לִי
  choice: 在我面前增多
  rationale: עָצְמוּ表示数量增多、变得众多；לִי直译为“对我／在我看来”，这里用“在我面前”保留上帝作为说话者和施行审判者的视角。
- source_word: מֵחוֹל יַמִּים
  choice: 胜过海沙
  rationale: 保留希伯来语的比较意象；יַמִּים为复数“海”，汉语惯用“海沙”，不必机械译作“众海之沙”。
- source_word: שֹׁדֵד
  choice: 毁灭者
  rationale: 该词可指劫掠者或毁灭者；本节语境强调上帝带来的致命审判，“毁灭者”较贴切，同时不限定其具体身份。
- source_word: בַּצָּהֳרָיִם
  choice: 在正午
  rationale: 按字面保留时间表达，也传达袭击发生在意想不到、毫无遮掩的时刻。
- source_word: עַל אֵם בָּחוּר
  choice: 袭击年轻人的母亲
  rationale: 原文直译为“临到／攻击年轻人的母亲”；不把בָּחוּר擅自限定为“战士”或“独子”，保留其一般意义。
- source_word: עִיר וּבֶהָלוֹת
  choice: 城邑和惊恐
  rationale: 马所拉文本明确读作“城邑和惊恐”；虽然搭配和句意艰涩，正文仍遵从所给WLC文本，并以脚注说明文本难点。
theological_decisions:
- issue: 审判行动的主语
  choice: 保留第一人称“我使……”，指向耶和华亲自使毁灭临到
  alternative: 改为较弱的许可性表达，如“我任凭毁灭者来”
  rationale: 原文两次使用第一人称使役形式（הֵבֵאתִי、הִפַּלְתִּי），直接陈述上帝带来并使灾祸临到；译文不应削弱这一神学张力。
- issue: “年轻人的母亲”的所指
  choice: 保持单数和概括性表达
  alternative: 解释为每一位战士的母亲、寡妇或耶路撒冷
  rationale: 原文本身没有明确说明她的身份；避免加入特定解释，让上下文的集体与个体意象并存。
translation_notes:
  register: 采用庄重而自然的现代普通话。“在我面前”“临到”等表达保留先知书的审判语气；句法适度调整以符合汉语，但不消除原文末句和“年轻人的母亲”所具有的歧义。
