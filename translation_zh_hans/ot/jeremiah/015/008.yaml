  rationale: 仅调整第二句的动词表达，以恢复הֵבֵאתִי“带来／使临到”的使役意义，并保留原文对“她们”和“年轻人的母亲”的重复指向。其余文字与脚注可保留：首句的“在我面前”可表达לִי所带的说话者视角；末句仍按WLC保留“城邑和惊恐”的艰涩组合，不以推测性释义取代正文。
