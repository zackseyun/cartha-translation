  terminology: “雅威”一致呈现יהוה这一专名；“拯救／解救”恰当地保留两个近义动词。脚注原有“坚不可摧”带有绝对化色彩，且将形容语改成断言；宜仅提示“铜／青铜”的词汇可能性。
