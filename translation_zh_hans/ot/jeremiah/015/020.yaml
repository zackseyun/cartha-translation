id: JER.15.20
reference: Jeremiah 15:20
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וּ/נְתַתִּ֜י/ךָ לָ/עָ֣ם הַ/זֶּ֗ה לְ/חוֹמַ֤ת נְחֹ֨שֶׁת֙ בְּצוּרָ֔ה וְ/נִלְחֲמ֥וּ אֵלֶ֖י/ךָ וְ/לֹא י֣וּכְלוּ לָ֑/ךְ כִּֽי אִתְּ/ךָ֥ אֲנִ֛י לְ/הוֹשִֽׁיעֲ/ךָ֥ וּ/לְ/הַצִּילֶ֖/ךָ נְאֻם יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/015/020.yaml
  text: And I will make you to this people a fortified wall of bronze; they will fight against you[a], but they will not prevail over you, for I am with you to save you and to deliver you, declares Yahweh.
translation:
  language: zh_hans
  text: 我必使你成为这百姓面前一道坚固的铜墙[a]。他们必与你争战，却不能胜过你，因为我与你同在，要拯救你、解救你。这是雅威的宣告。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“一道坚固的青铜墙”。
    reason: נְחֹשֶׁת可指铜或青铜；此处保留原文所述墙的坚固、防御性质，避免把其含义绝对化为“坚不可摧”。
lexical_decisions:
- source_word: וּנְתַתִּיךָ
  choice: 我必使你……成为
  rationale: נתן在“לְ＋表语名词”结构中表示使某人成为或设立某人为某种身份；此译既表达结果，也符合现代汉语。
- source_word: לָעָם הַזֶּה
  choice: 面对这百姓
  rationale: לְ在此表示耶利米与这百姓之间的关系；“面对”在汉语中自然，并由下文“与你争战”显示其敌对处境，而不把介词本身过度限定为“敌对”。
- source_word: לְחוֹמַת נְחֹשֶׁת בְּצוּרָה
  choice: 一道坚固的铜墙
  rationale: חוֹמָה是城墙或墙，נְחֹשֶׁת可指铜或青铜，בְּצוּרָה表示坚固设防、难以攻破；“坚固的铜墙”简洁保留其强韧而不可攻克的比喻。
- source_word: וְנִלְחֲמוּ אֵלֶיךָ
  choice: 他们必与你争战
  rationale: לחם与אֶל连用表示向某人争战；此译保留争战意象和明确的敌对方向。
- source_word: וְלֹא יוּכְלוּ לָךְ
  choice: 却不能胜过你
  rationale: יכל基本义为“能够”，与לְ连用在此指无法成功对付或压倒耶利米；“不能胜过你”准确表达其惯用含义。
- source_word: כִּי אִתְּךָ אֲנִי
  choice: 因为我与你同在
  rationale: כִּי引出敌人不能得胜的原因；译文保留神同在这一核心应许。
- source_word: לְהוֹשִׁיעֲךָ
  choice: 要拯救你
  rationale: ישע表示拯救、使人脱离危难；“拯救”保留该词广泛的圣经语义。
- source_word: וּלְהַצִּילֶךָ
  choice: 解救你
  rationale: נצל强调夺回、救出或使人脱离危险；与“拯救”并列为“拯救你、解救你”，保留原文两个近义而不完全相同的动词。
- source_word: נְאֻם יְהוָה
  choice: 这是雅威的宣告
  rationale: נְאֻם是庄重的先知宣告公式；“这是……的宣告”自然且有权威感，יְהוָה按其专名译为“雅威”。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华／主
  rationale: 原文直接使用四字神名；“雅威”以现代汉语音译呈现其专名性质，不以称号“主”替代，也不采用较晚形成的“耶和华”读音。
- issue: 神的保护是否意味着耶利米免遭一切攻击
  choice: 保留“他们必与你争战，却不能胜过你”之间的张力
  alternative: 解释为耶利米不会受苦或不会受到任何伤害
  rationale: 原文明说攻击确会发生，同时应许敌人不能最终胜过他；译文不把得救过度解释为免除一切冲突或苦难。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“一道……墙”符合汉语量词习惯；“与你争战”“这是雅威的宣告”保留先知文体的力度。脚注标记紧随其所说明的“铜墙”短语。
