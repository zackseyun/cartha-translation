id: JER.15.19
reference: Jeremiah 15:19
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: לָ/כֵ֞ן כֹּֽה אָמַ֣ר יְהוָ֗ה אִם תָּשׁ֤וּב וַ/אֲשִֽׁיבְ/ךָ֙ לְ/פָנַ֣/י תַּֽעֲמֹ֔ד וְ/אִם תּוֹצִ֥יא יָקָ֛ר מִ/זּוֹלֵ֖ל כְּ/פִ֣/י תִֽהְיֶ֑ה יָשֻׁ֤בוּ הֵ֨מָּה֙ אֵלֶ֔י/ךָ וְ/אַתָּ֖ה לֹֽא תָשׁ֥וּב אֲלֵי/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/015/019.yaml
  text: 'Therefore[a], this is what Yahweh says: If you return, I will restore you, and you will stand before me. If you bring out the precious from the worthless, you will be as my mouth. They will turn to you[c][b], but you must not turn to them.'
translation:
  language: zh_hans
  text: '因此，耶和华如此说：


    “如果你回转，

    我就恢复你；

    你必站立在我面前。


    如果你从卑贱的中取出宝贵的，

    你就要作我的口[a]。


    他们必转向你，

    你却不可转向他们。”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “作我的口”意思是代表我发言，或作我的代言人。“从卑贱的中取出宝贵的”很可能是指从不当的话语中分辨并说出宝贵的话；但原文保留较宽泛的含义。
    reason: 说明希伯来文“作我的口”的隐喻，以及“从卑贱的中取出宝贵的”在言语语境中可能的含义，同时保留原文的开放性。
lexical_decisions:
- source_word: לָכֵן
  choice: 因此
  rationale: 保留推论关系，并自然承接耶利米先前的申诉。
- source_word: כֹּה אָמַר יְהוָה
  choice: 耶和华如此说
  rationale: 保留先知宣告的使者公式；以“耶和华”呈现神的专名。
- source_word: אִם תָּשׁוּב וַאֲשִׁיבְךָ
  choice: 如果你回转，我就使你复原
  rationale: 前后都保留שׁוב的转回意象，同时用“使你复原”表达使役形式所含的恢复意义，而不限定为单纯空间上的带回。
- source_word: לְפָנַי תַּעֲמֹד
  choice: 你必侍立在我面前
  rationale: “侍立”既保留站立在面前的具体图像，也自然传达在君王面前任职、服事的语境。
- source_word: וְאִם תּוֹצִיא יָקָר מִזּוֹלֵל
  choice: 如果你从卑劣的事物中提炼出宝贵的
  rationale: “提炼出”自然表达从一种事物中取出、分离的图像；“卑劣”与“宝贵”形成鲜明对比，同时不把所指仅限于言语。
- source_word: כְּפִי תִהְיֶה
  choice: 你就要作我的口
  rationale: 保留希伯来文生动的“作我的口”隐喻，不直接释为“代言人”。
- source_word: יָשֻׁבוּ הֵמָּה אֵלֶיךָ
  choice: 他们必转向你
  rationale: 将未完成式理解为应许性的陈述，并保留שׁוב的转向意象。
- source_word: וְאַתָּה לֹא תָשׁוּב אֲלֵיהֶם
  choice: 你却不可转向他们
  rationale: 以“不可”表达禁令，并与前句“他们必转向你”形成原文所强调的对照。
theological_decisions:
- issue: 耶利米“回转”与蒙恢复的含义
  choice: 保留“回转”与“使你复原”的措辞，使经文可同时涵盖心态、言语上的归正以及先知职分的恢复。
  alternative: 明确译成“如果你悔改，我就恢复你的职分”。
  rationale: 原文连续使用שׁוב，并提到侍立在神面前和作神的口；它可能包含悔改，也可能侧重重新确认先知使命，因此不宜在正文中只确定一种。
- issue: “从卑劣中提炼出宝贵”的所指
  choice: 正文保留分离、提取的隐喻，不明说对象仅为言语。
  alternative: 译为“如果你只说宝贵的话，不说卑劣的话”，或理解为区分敬虔者与不敬虔者。
  rationale: 下文“作我的口”使言语层面的理解很可能正确，但原文图像较宽，正文应保留其张力。
- issue: “作我的口”的意义
  choice: 保留神授权先知发言的口之隐喻。
  alternative: 直接译为“作我的代言人”。
  rationale: 直译既自然可懂，也保留先知代表神发言的强烈图像；脚注说明其含义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以“侍立”体现宫廷与先知服事语境；以“回转／转向”重现本节שׁוב的反复。正文采用诗行格式呈现神谕的平行与对照结构。
