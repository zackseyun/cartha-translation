id: JER.15.15
reference: Jeremiah 15:15
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: אַתָּ֧ה יָדַ֣עְתָּ יְהוָ֗ה זָכְרֵ֤/נִי וּ/פָקְדֵ֨/נִי֙ וְ/הִנָּ֤קֶם לִ/י֙ מֵ/רֹ֣דְפַ֔/י אַל לְ/אֶ֥רֶךְ אַפְּ/ךָ֖ תִּקָּחֵ֑/נִי דַּ֕ע שְׂאֵתִ֥/י עָלֶ֖י/ךָ חֶרְפָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/015/015.yaml
  text: You know[a], O Yahweh; remember me and attend to me, and take vengeance for me on my persecutors. In your patience do not take me away[d][c][b]; know that for your sake I bear reproach.
translation:
  language: zh_hans
  text: 耶和华啊，你知道。求你记念我，眷顾我[a]，为我向逼迫我的人报仇[b]。不要因你长久忍耐而把我取去[c]；要知道，我是为你的缘故忍受羞辱[d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “眷顾我”也可译作“临到我”、“留意我”或“看顾我”。
    reason: lexical_alternative
  - marker: b
    text: “为我向逼迫我的人报仇”也可译作“替我向追赶我的人伸冤”。
    reason: lexical_alternative
  - marker: c
    text: 原文直译近似“不要在你长久忍耐中把我取去”；“长久忍耐”原是“不轻易发怒”的习语。“取去”可能暗指死亡或被除掉，但原文没有明说。
    reason: idiom_and_ambiguity
  - marker: d
    text: “为你的缘故”也可译作“因你的缘故”、“因你的名”或“因与你有关而受羞辱”。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的专名译法，明确呈现以色列上帝的专名，而不以泛称“主”替代。
- source_word: זָכְרֵנִי
  choice: 记念我
  rationale: 既保留“记得”的基本意义，也符合祷告语境中求上帝顾念并采取行动的含义。
- source_word: וּפָקְדֵנִי
  choice: 眷顾我
  rationale: פקד在此表示留意、临到并介入；“眷顾”与“记念”并列自然，又不把含义缩减为单纯看见。
- source_word: וְהִנָּקֶם לִי מֵרֹדְפַי
  choice: 为我向逼迫我的人报仇
  rationale: 保留נקם所含的报仇、施行公正报应之力度，并清楚表达先知求上帝代他行动，而非自行复仇。
- source_word: מֵרֹדְפַי
  choice: 逼迫我的人
  rationale: רדף本义为追赶；在本哀诉语境中是敌意追逼，“逼迫我的人”兼顾动作感与受迫害处境。
- source_word: אַל לְאֶרֶךְ אַפְּךָ תִּקָּחֵנִי
  choice: 不要因你长久忍耐，就把我取去
  rationale: “长久忍耐”传达“不轻易发怒”的希伯来习语；“取去”保留לקח的含蓄性，不擅自断定具体指死亡、被除灭或其他结局。
- source_word: דַּע
  choice: 要知道
  rationale: 保留直接命令式，并与开头“你知道”形成首尾呼应。
- source_word: שְׂאֵתִי
  choice: 我……忍受
  rationale: נשׂא在这里指承受、担当羞辱；“忍受”符合现代汉语表达。
- source_word: עָלֶיךָ חֶרְפָּה
  choice: 为你的缘故忍受羞辱
  rationale: 表达先知所受羞辱是因他与耶和华的关系及使命而来，同时保留介词短语可能具有的关联或缘由色彩。
theological_decisions:
- issue: 耶利米求上帝报仇的性质
  choice: 直译为“为我……报仇”，将执行报应的主体明确保留为上帝
  alternative: 为我伸冤；替我惩罚逼迫我的人
  rationale: נקם明确带有报仇或施行报应的司法力度。译文不把这一祈求淡化为内心安慰，也不扩展成关于私人复仇的教义判断，从而保留经文的神学张力。
- issue: “把我取去”所指的结局
  choice: 保留含蓄的“取去”
  alternative: 使我死亡；除灭我；让他们把我除掉
  rationale: 原文只用לקח，没有明说死亡或由敌人杀害。保留其开放性，避免把一种可能解释写进正文。
- issue: 上帝“长久忍耐”与先知安危之间的张力
  choice: 保留“不要因你长久忍耐，就把我取去”的悖论式表达
  alternative: 你向他们忍耐的时候，不要让他们取我的命
  rationale: 原文措辞紧凑且关系略含混；译文使基本逻辑可懂，却不擅自补出“他们”作行动主体。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。“你知道”刻意保留原文突然而省略宾语的呼告；“报仇”不予弱化，以保存哀诉中的力度；“取去”则保留原文未明说具体结局的含蓄。所有脚注标记均置于其所说明的正文词句之后。
