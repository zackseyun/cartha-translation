source:
  edition: WLC
  text: לֹֽא יָשַׁ֥בְתִּי בְ/סוֹד מְשַׂחֲקִ֖ים וָֽ/אֶעְלֹ֑ז מִ/פְּנֵ֤י יָֽדְ/ךָ֙ בָּדָ֣ד יָשַׁ֔בְתִּי כִּֽי זַ֖עַם מִלֵּאתָֽ/נִי־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/015/017.yaml
  text: I did not sit in the company of those who laugh[a], nor did I rejoice; because of your hand I sat alone[c][b], for you filled me with indignation.
translation:
  language: zh_hans
  text: 我没有坐在欢笑之人的圈子里[a]，也没有欢喜；因着你的手[b]，我独自而坐，因为你使我充满忿怒[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“作乐之人的会中”，或“嬉笑之人的群体中”。
    reason: lexical_alternative
  - marker: b
    text: 字面为“从你手面前”；这里也可理解为“由于你的手”或“在你手的重压之下”。
    reason: lexical_alternative
  - marker: c
    text: “忿怒”也可译作“愤怒”或“烈怒”。
    reason: lexical_alternative
lexical_decisions:
- source_word: יָשַׁבְתִּי
  choice: 坐在／坐着
  rationale: ישׁב可指“坐、居住、停留”。本节前后两次出现，保留具体的“坐”既呈现原文的重复，也自然表达参与群体和独处的对照。
- source_word: בְסוֹד
  choice: 在……的圈子里
  rationale: סוֹד可指亲密圈子、议会或群体；此处侧重社交相聚，而非正式议事机构。“圈子”保留亲近群体的意味，并符合现代汉语。
- source_word: מְשַׂחֲקִים
  choice: 欢笑之人
  rationale: 该分词可指发笑、嬉戏或作乐的人。上下文将他们与耶利米的不欢喜和独处相对照，因此译为“欢笑之人”，不收窄为“讥笑者”。
- source_word: וָאֶעְלֹז
  choice: 也没有欢喜
  rationale: עלז表示欢喜、欢跃。希伯来文后句承接前句的否定，汉语明确补出“没有”，使逻辑自然清楚。
- source_word: מִפְּנֵי יָדְךָ
  choice: 因着你的手
  rationale: 字面与“在你手面前／由于你的手”有关。“因着”表达原因，同时保留“你的手”这一象征上帝力量或重压的意象，不将其释义化。
- source_word: בָּדָד
  choice: 独自
  rationale: בָּדָד表示孤单、分离或独处。“独自”简洁地传达先知与欢乐群体隔绝的状态。
- source_word: כִּי
  choice: 因为
  rationale: 此处引出独处的原因，译为“因为”明确呈现解释关系。
- source_word: זַעַם
  choice: 愤慨
  rationale: זַעַם可指愤怒、烈怒或义愤，常与上帝的忿怒有关。“愤慨”保留其严厉性，同时不预先判定这里专指情绪、审判性忿怒，还是先知所承受的审判信息。
- source_word: מִלֵּאתָנִי
  choice: 你使我充满
  rationale: מלא意为“充满”。译为“使我充满”保留上帝为施事者及先知被充满的直接关系。
theological_decisions:
- issue: “你的手”与耶利米独处之间的关系
  choice: 保留“你的手”的意象，并以“因着”表达其与独处的因果关系。
  alternative: 释为上帝的催逼、重压、保护或同在。
  rationale: 上下文很可能指上帝之手所带来的先知性催逼或压力，但原文没有把这一意象完全解释开。直译核心意象可保留神学张力，避免限定为保护或某一种特定经历。
- issue: זַעַם的性质
  choice: 主文译为“愤慨”。
  alternative: “忿怒”“烈怒”或“愤怒”。
  rationale: 该词可以指强烈的怒气，尤其是上帝的忿怒；但句法表达的是上帝使耶利米充满这种זַעַם。“愤慨”既保持严肃力度，也容许读者理解为先知承受并表达上帝对罪恶和审判的怒气，而不把细微含义过早固定。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“坐在……圈子里”与“独自坐着”保留原文两次יָשַׁבְתִּי的呼应；分号呈现欢乐群体与先知孤独之间的转折。“因着你的手”略带经文语体，但在现代汉语中仍清楚自然，并能保留原文意象。
