base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/015/014.yaml
  text: And I will make your enemies pass into a land you have not known[a], for a fire has been kindled in my anger; it will burn against you.
translation:
  language: zh_hans
  text: 我要使你的仇敌进入你所不认识之地[a]；因为有火在我的怒气中燃起，必向你们燃烧。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我要使你在不认识之地服事你的仇敌。”一些古代译本及耶利米书17:4的平行句支持这一读法。这里的希伯来辅音文本作“你的仇敌”；另一译法可能源于不同的元音读法或不同的底本。
    reason: textual_variant
lexical_decisions:
- source_word: וְהַעֲבַרְתִּי
  choice: 我要使……进入
  rationale: 该词为עבר的使役式，表达“使……经过、进入”。结合后面的地点短语，译为“使……进入”既保留使役意义，也符合现代汉语表达。
- source_word: אֶת אֹיְבֶיךָ
  choice: 你的仇敌
  rationale: 希伯来辅音文本明确作“你的仇敌”，为复数名词加第二人称阳性单数后缀；正文据此直译。
- source_word: בְּאֶרֶץ לֹא יָדָעְתָּ
  choice: 进入你所不认识的地方
  rationale: 介词ב与移动动词连用时可表达进入某处；אֶרֶץ可指“地、地方、国土”。这里采用自然而不过度限定政治含义的“地方”，并以“所不认识”保留经验性的意味。
- source_word: כִּי
  choice: 因为
  rationale: 引出上述审判宣告的原因，现代汉语用“因为”清楚自然。
- source_word: אֵשׁ קָדְחָה בְאַפִּי
  choice: 我的怒气中已有火燃起
  rationale: 保留“火”与“怒气”的原文意象，同时以“已有……燃起”表达完成态所呈现的已然状态，避免将两者完全合并为惯用语“怒火”而损失句法张力。
- source_word: עֲלֵיכֶם תּוּקָד
  choice: 必向你们燃烧
  rationale: תּוּקָד表示火将继续燃烧；עֲלֵיכֶם为第二人称阳性复数，译作“向你们”以保留其针对群体的审判意味。
theological_decisions:
- issue: 前半节第二人称单数与末句第二人称复数之间的转换
  choice: 前半节译作“你的、你所”，末句译作“你们”
  alternative: 将全节统一为单数“你”或复数“你们”
  rationale: 原文从单数转为复数，可能由对耶利米个人或代表性个体的称呼转向对群体的宣告。译文保留这一转换，不作解释性统一。
- issue: “使你的仇敌进入”与古代译本所见“使你服事仇敌”的差异
  choice: 正文依马所拉辅音文本译作“使你的仇敌进入”
  alternative: “使你在不认识的地方服事你的仇敌”
  rationale: 现存希伯来辅音文本的直接宾语是“你的仇敌”；但若采用不同元音读法或不同底本，并参考耶利米书17:4的平行表达，则可形成另一读法。正文保留WLC读法，异文列入脚注。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。“我的怒气中已有火燃起”有意保留原文火与怒气的双重意象；“必向你们燃烧”保留末句复数称呼，并与前文单数形成原有的人称张力。
