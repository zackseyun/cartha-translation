base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/015/005.yaml
  text: For who will have compassion on you[a], Jerusalem? And who will mourn for you? And who will turn aside to ask about your welfare?
translation:
  language: zh_hans
  text: 因为谁会怜悯你，耶路撒冷？谁会为你悲叹？谁会停下脚步来询问你的安好？
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文的审判宣告，保留其解释或因果作用。
- source_word: מִי
  choice: 谁
  rationale: 原文连续三次使用疑问代词，译文也重复“谁”，保留反问的力度和节奏。
- source_word: יַחְמֹל עָלַיִךְ
  choice: 会怜悯你
  rationale: חמל 在此表达怜惜、同情，而不是直接指免除惩罚；“怜悯你”自然且符合语境。
- source_word: יְרוּשָׁלִַם
  choice: 耶路撒冷
  rationale: 采用现代中文圣经传统中通行的专名译法。
- source_word: יָנוּד לָךְ
  choice: 会为你悲叹
  rationale: נוד 可指以动作表达同情、哀悼；“悲叹”既传达哀恸与同情，也避免将可能的姿态过度具体化。
- source_word: יָסוּר
  choice: 会转过来
  rationale: סור 描绘人从原本的行程转向或停下来；“转过来”在中文中保留这一动作意象。
- source_word: לִשְׁאֹל לְשָׁלֹם לָךְ
  choice: 问候你是否平安
  rationale: 这是询问某人平安或境况的惯用表达；译法既保留 שָׁלוֹם 的“平安”用语，也使现代读者容易理解。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准普通话。三个“谁会”形成递进式反问，保留原文的修辞结构；末句保留“平安”这一核心词，同时用“是否”明确其询问含义。
