  source_fidelity: “因为”“谁会怜悯你”和“谁会为你悲叹”准确保留了原文的因果引入、三重反问及怜悯／哀悼之意。末句“转过来”在现代汉语中通常表示转身或回头，未能清楚表达 יָסוּר 从原路径转开、停步的动作；改为“停下脚步来”能自然呈现此处语境中的‘转到一旁／驻足’。
