  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: אֽוֹי לִ֣/י אִמִּ֔/י כִּ֣י יְלִדְתִּ֗/נִי אִ֥ישׁ רִ֛יב וְ/אִ֥ישׁ מָד֖וֹן לְ/כָל הָ/אָ֑רֶץ לֹֽא נָשִׁ֥יתִי וְ/לֹא נָֽשׁוּ בִ֖/י כֻּלֹּ֥/ה מְקַלְלַֽו/נִי־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/015/010.yaml
  text: Woe to me[a], my mother, because you bore me, a man of strife and a man of contention to all the land. I have not lent, nor have they lent to me[b], yet every one of them curses me.
translation:
  language: zh_hans
  text: 我母亲哪，我有祸了！因为你生了我，我成了与全地[a]争讼、相争的人。我没有借钱给人，也没有向人借钱[b]，他们却个个都咒骂我。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “全地”也可译作“全世界”。此处在耶利米书的语境中较可能指犹大全地。
    reason: alternative_reading
  - marker: b
    text: 原文指借贷所形成的债务关系。耶利米的意思是，他既没有放债给人，也没有向人借债，并无这种通常会招致敌意的缘由。
    reason: cultural_note
lexical_decisions:
- source_word: אֽוֹי לִי
  choice: 我有祸了
  rationale: אוי是强烈的哀叹语；译作“我有祸了”既保留灾祸与痛苦的力度，也符合现代汉语的庄重表达。
- source_word: אִמִּי
  choice: 我的母亲啊
  rationale: 保留直接呼语及其感情色彩；“啊”自然呈现先知向母亲发出的哀诉。
- source_word: כִּי יְלִדְתִּנִי
  choice: 你为何生下我
  rationale: כִּי在哀叹语境中可引出导致哀叹的缘由；汉语用反问形式自然表达“我有祸了……因为你生了我”的痛苦，并未改变其因果关系。
- source_word: אִישׁ רִיב וְאִישׁ מָדוֹן
  choice: 与……争讼、与……相争的人
  rationale: ריב与מדון语义相近而有叠加强调作用；“争讼”保留争端乃至诉讼色彩，“相争”呈现更广义的冲突，避免把先知简单定性为好争吵的人。
- source_word: לְכָל הָאָרֶץ
  choice: 与全地
  rationale: 介词ל在这里表达关系对象；הארץ在耶利米书语境中较可能指本地或犹大全地，而非全球，因此译“全地”，并以脚注保留“全世界”的可能。
- source_word: לֹא נָשִׁיתִי וְלֹא נָשׁוּ בִי
  choice: 我没有借钱给人，也没有向人借钱
  rationale: 两句构成对称，指放债与负债关系；加入宾语“钱”和方向成分，使现代读者清楚理解，同时不擅自加入“取利”。
- source_word: כֻּלֹּה מְקַלְלַוּנִי
  choice: 他们却个个都咒骂我
  rationale: כֻּלֹּה表达整体中的每一个人，分词体现持续或惯常行为；“个个都咒骂我”自然传达普遍敌意，“却”显明与前句无债务纠葛之间的反差。
theological_decisions:
- issue: הָאָרֶץ的范围
  choice: 全地
  alternative: 全世界
  rationale: 上下文更自然地指犹大境内或全国的人；正文避免无根据地扩大为全球，同时以脚注保存该词可指“全世界”的词义可能。
- issue: 先知是争端的主动制造者还是众人争执的对象
  choice: 与全地争讼、与全地相争的人
  alternative: 好争讼、好争吵的人
  rationale: 原文结构可描述一个置身于普遍争端中的人，并不明确断言耶利米性格好斗；采用关系性表达，保留张力而不把责任单方面归给先知。
- issue: 债务用语是否明确包含利息
  choice: 借钱给人／向人借钱
  alternative: 放债取利／向人借高利贷
  rationale: נשה涉及债权债务，但本节未明说利息；正文不加入“取利”或“高利贷”，避免超出原文。
translation_notes:
  register: 采用现代、庄重而易懂的哀歌语体。以“我的母亲啊”保留直接哀诉，以两个“与全地”再现平行结构；债务句则用日常汉语清楚表达。所有脚注标记均已置于正文。
