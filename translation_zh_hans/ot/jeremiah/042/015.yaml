  text: וְ/עַתָּ֕ה לָ/כֵ֛ן שִׁמְע֥וּ דְבַר יְהוָ֖ה שְׁאֵרִ֣ית יְהוּדָ֑ה כֹּֽה אָמַר֩ יְהוָ֨ה צְבָא֜וֹת אֱלֹהֵ֣י יִשְׂרָאֵ֗ל אִם אַ֠תֶּם שׂ֣וֹם תְּשִׂמ֤וּ/ן פְּנֵי/כֶם֙ לָ/בֹ֣א מִצְרַ֔יִם וּ/בָאתֶ֖ם לָ/ג֥וּר שָֽׁם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/042/015.yaml
  text: 'Now therefore hear the word of Yahweh[a], O remnant of Judah. Thus says Yahweh of hosts, the God of Israel: If you are determined to go to Egypt and to go to sojourn there,'
translation:
  language: zh_hans
  text: 因此，现在，犹大的余民哪，要听雅威的话。万军之雅威、以色列的上帝如此说：如果你们执意[a]前往埃及，去那里寄居，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“如果你们确实把脸朝向埃及去”；这是表示下定决心的说法。
    reason: 说明原文不定式绝对式与限定动词构成的加强结构，以及“把脸朝向”的习语性身体意象；正文以“执意”作自然表达。
lexical_decisions:
- source_word: וְעַתָּה לָכֵן
  choice: 所以现在
  rationale: 同时保留时间推进和承接上文所得结论的语气，符合现代汉语表达。
- source_word: שִׁמְעוּ דְבַר יְהוָה
  choice: 要听雅威的话
  rationale: “听”保留先知宣告中要求听从的庄重意味；“雅威的话”对应固定的先知用语。
- source_word: שְׁאֵרִית יְהוּדָה
  choice: 犹大的余民哪
  rationale: “余民”准确表达灾难后存留下来的群体，“哪”清楚标示直接呼语。
- source_word: כֹּה אָמַר
  choice: 如此说
  rationale: 采用庄重而通行的先知使者公式，不把其宣告效力弱化为一般叙述。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按较可能的读音音译四字神名，保留其作为上帝专名的性质，而不以头衔替代。
- source_word: יְהוָה צְבָאוֹת
  choice: 万军之雅威
  rationale: “万军”保留该称号所含的军事及天上众军意象；“之”使称号在庄重中文中自然紧凑。
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: 以色列的上帝
  rationale: 直接传达原文的属格结构，不作神学扩充。
- source_word: אִם אַתֶּם שׂוֹם תְּשִׂימוּן פְּנֵיכֶם
  choice: 如果你们执意
  rationale: 原文以独立不定式配合限定动词加强语气，并用“把脸朝向”表示坚定意向；“执意”自然传达这种坚决程度。
- source_word: לָבֹא מִצְרַיִם
  choice: 前往埃及
  rationale: בוא与目的地连用时可指前往或进入；此处“前往”符合说话者与听者当前所在位置的叙事视角。
- source_word: וּבָאתֶם לָגוּר שָׁם
  choice: 去那里寄居
  rationale: 连续表达条件中的下一行动；“寄居”保留גור所指作为外来者居住、并非本土定居的意味。
theological_decisions:
- issue: 四字神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文使用上帝的专名；“雅威”按其较可能的古代读音音译，既不采用源于较晚元音组合的“耶和华”，也不以“主”这一头衔取代专名。
- issue: “万军”所指范围
  choice: 保留“万军”而不具体限定
  alternative: 天军；万军之主；军队的雅威
  rationale: צְבָאוֹת可能唤起以色列军队、天上众军或更广的宇宙统御意象；译文保留原文张力，不限定为其中一种。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。保留先知宣告公式、直接呼语以及未在本节结束的条件句结构；末尾逗号表明句意延续到下一节。
