source:
  edition: WLC
  text: וְ/הֵ֨מָּה֙ אָמְר֣וּ אֶֽל יִרְמְיָ֔הוּ יְהִ֤י יְהוָה֙ בָּ֔/נוּ לְ/עֵ֖ד אֱמֶ֣ת וְ/נֶאֱמָ֑ן אִם לֹ֡א כְּֽ/כָל הַ֠/דָּבָר אֲשֶׁ֨ר יִֽשְׁלָחֲ/ךָ֜ יְהוָ֧ה אֱלֹהֶ֛י/ךָ אֵלֵ֖י/נוּ כֵּ֥ן נַעֲשֶֽׂה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/042/005.yaml
  text: And they said to Jeremiah[b][a], “May Yahweh be a true and faithful witness against us if we do not act according to all the word that Yahweh your God sends to us through you.”
translation:
  language: zh_hans
  text: 他们对耶利米说：“如果我们不照耶和华—你的上帝—差你传给我们的一切话去做，愿耶和华作真实可信的见证人，指证我们。[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“愿耶和华在我们中间作真实可信的见证人。”原文可直译为“在我们中间”，但在这里的起誓语境中，很可能表示：如果他们不服从，耶和华就作证指控他们。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהִי
  choice: 愿……作
  rationale: 未完成式在此有祈愿语气，用于庄严起誓；“愿……作”符合现代汉语表达。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代汉语圣经语境中通行的神名译写，并保留专名性质，不以称号替代。
- source_word: בָּנוּ לְעֵד
  choice: 作……见证人，指证我们
  rationale: בָּנוּ 字面可作“在我们中间”，但结合起誓和司法见证语境，主要含义是他们若不履行承诺，耶和华便作证指控他们；在正文中明示这一语用力量，并以脚注保留字面可能。
- source_word: אֱמֶת וְנֶאֱמָן
  choice: 真实可信的
  rationale: 分别传达“真实”与“可靠、忠信”的含义，作为“见证人”的并列修饰语，在现代汉语中自然凝练。
- source_word: אִם לֹא
  choice: 如果……不
  rationale: 按誓言公式中的条件结构直译，表达若不遵行就接受神作证指控的承诺。
- source_word: כְּכָל הַדָּבָר
  choice: 照……一切话
  rationale: דָּבָר 在此指神所传的信息；“一切话”既保留整体性，也适合汉语圣经体。
- source_word: יִשְׁלָחֲךָ ... אֵלֵינוּ
  choice: 差你传给我们
  rationale: 希伯来文直译为“差你到我们这里”，信息内容由上下文隐含；“差你传给我们”自然表达耶利米奉差传话的角色。
- source_word: אֱלֹהֶיךָ
  choice: 你的上帝
  rationale: 保留第二人称单数后缀，不改成“我们的上帝”，从而忠实呈现众人对耶利米的原话。
- source_word: כֵּן נַעֲשֶׂה
  choice: 照……去做
  rationale: 表达他们承诺按所领受的全部信息行事；置于“如果不”条件句中符合自然汉语。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: “耶和华”是现代标准汉语中广为识别的专名形式，可直接呈现神名；不以“主”这一称号代替原文专名。
- issue: בָּנוּ 在誓言中的方向性
  choice: 指证我们
  alternative: 在我们中间
  rationale: 司法性誓言语境支持“作证指控我们”的理解，但原介词本身确可较字面地理解为“在我们中间”，故以脚注保存歧义。
- issue: 说话者称耶和华为“你的上帝”
  choice: 你的上帝
  alternative: 我们的上帝
  rationale: 原文明确使用第二人称单数，指耶利米的上帝；不将潜在的关系张力和谐化。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“差你传给我们”明示原文所隐含的传信功能；以破折号突出“你的上帝”，保留说话者对耶利米所用的第二人称措辞。脚注标记置于相关誓言句末。
