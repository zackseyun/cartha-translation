  text: וַ/יִּקְרָ֗א אֶל יֽוֹחָנָן֙ בֶּן קָרֵ֔חַ וְ/אֶ֛ל כָּל שָׂרֵ֥י הַ/חֲיָלִ֖ים אֲשֶׁ֣ר אִתּ֑/וֹ וּ/לְ/כָ֨ל הָ/עָ֔ם לְ/מִ/קָּטֹ֥ן וְ/עַד גָּדֽוֹל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/042/008.yaml
  text: Then he called Johanan son of Kareah, all the commanders of the forces who were with him, and all the people, from the least to the greatest,
translation:
  language: zh_hans
  text: 于是，他叫来加利亚的儿子约哈难、所有跟他在一起的军队首领，以及全体百姓，无论尊卑，
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: 于是，他叫来
  rationale: 连续式叙事形式推动情节向前；“于是”自然表达承接关系。“叫来”在本处说明召集听众，又不采用语气较强的“传召”。
- source_word: יוֹחָנָן בֶּן קָרֵחַ
  choice: 加利亚的儿子约哈难
  rationale: 按现代中文圣经人名的通行音译处理，并保留希伯来文父子关系的表达。
- source_word: כָּל שָׂרֵי הַחֲיָלִים
  choice: 所有……军队首领
  rationale: שָׂרֵי 在军事语境中指领袖或长官；הַחֲיָלִים 指武装力量。“军队首领”准确、清楚，也比“军长”更少引入现代军制色彩。
- source_word: אֲשֶׁר אִתּוֹ
  choice: 跟他在一起的
  rationale: 关系从句最自然地修饰前面的军队首领；“他”依上下文指约哈难。
- source_word: וּלְכָל הָעָם
  choice: 以及全体百姓
  rationale: לְ 标示另一个被召集、受话的群体；中文在“叫来”后直接并列宾语最自然。הָעָם 在此指整个聚集的民众群体。
- source_word: לְמִקָּטֹן וְעַד גָּדוֹל
  choice: 无论尊卑
  rationale: 这是涵盖所有社会层级的惯用语。中文“无论尊卑”简洁自然，传达从地位最低到最高、无一例外的意思，而不误作体格大小。
