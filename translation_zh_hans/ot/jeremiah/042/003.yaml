  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/יַגֶּד לָ֨/נוּ֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ אֶת הַ/דֶּ֖רֶךְ אֲשֶׁ֣ר נֵֽלֶךְ בָּ֑/הּ וְ/אֶת הַ/דָּבָ֖ר אֲשֶׁ֥ר נַעֲשֶֽׂה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/042/003.yaml
  text: that Yahweh your God may tell us the way in which we should walk[a], and the thing that we should do.
translation:
  language: zh_hans
  text: 愿雅威你的神指示我们该走哪条路、该做什么事[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “事”也可译作“事情”或“事务”。
    reason: 希伯来语 דָּבָר 语义宽泛，在这里指他们应当采取或办理的事。
lexical_decisions:
- source_word: וְיַגֶּד
  choice: 愿……指示我们
  rationale: 这是 נגד 的使役未完成式；承接上文的请求，带有祈愿语气。“指示”自然表达求神告知并引导的意思。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常用音译呈现四字神名，保留其作为以色列之神专名的性质，而不以称号替代。
- source_word: אֱלֹהֶיךָ
  choice: 你的神
  rationale: 第二人称阳性单数后缀表明众人正在对耶利米说话。
- source_word: הַדֶּרֶךְ אֲשֶׁר נֵלֶךְ בָּהּ
  choice: 我们该走哪条路
  rationale: 保留“路／走”的希伯来语意象，同时用现代汉语疑问式关系结构自然表达他们求问应采取的方向。
- source_word: הַדָּבָר אֲשֶׁר נַעֲשֶׂה
  choice: 该做什么事
  rationale: דבר 在此与“路”平行，泛指应采取的行动；“事”既自然又保留原词较宽的语义范围。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名。正文采用较贴近学界通行重构读音的“雅威”，不以“主”等称号代替；“耶和华”是汉语传统音译，但较不贴近该重构读音。
- issue: 请求语气与人的责任
  choice: “愿……指示”与两个“该”
  alternative: “让……告诉”或“必须”
  rationale: 这样既体现众人向神求指引的祈愿语气，也表达所求的是应当采取的道路和行动；不把原文强化为绝对命令，也不弱化成单纯预测。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“该走哪条路、该做什么事”清楚易懂，并保留原文“路／走”的隐喻和平行结构。脚注标记放在其所说明的“事”之后。
