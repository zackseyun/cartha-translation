  text: דִּבֶּ֨ר יְהוָ֤ה עֲלֵי/כֶם֙ שְׁאֵרִ֣ית יְהוּדָ֔ה אַל תָּבֹ֖אוּ מִצְרָ֑יִם יָדֹ֨עַ֙ תֵּֽדְע֔וּ כִּי הַעִידֹ֥תִי בָ/כֶ֖ם הַ/יּֽוֹם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/042/019.yaml
  text: 'Yahweh has spoken concerning you[a], remnant of Judah: Do not go to Egypt. Know for certain that I have warned you today.'
translation:
  language: zh_hans
  text: 犹大的余民啊，耶和华已经向你们宣告：不要去埃及。你们务要确知，我今天已经郑重地警告过你们[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我今天已经郑重地作不利见证，警告你们。”希伯来语动词既可指正式作证，也可指郑重警告。
    reason: 保留 הַעִידֹתִי בָכֶם 在正式见证（可带不利意味）与郑重警告之间的词义可能性，避免把该词固定解释为法律上的“指控”。
lexical_decisions:
- source_word: דִּבֶּר יְהוָה עֲלֵיכֶם
  choice: 耶和华已经论到你们
  rationale: 完成式表达已经发出的神谕，并带有当前效力；“论到你们”保留 עַל 在此处“关于、涉及”的意思，不擅自强化为“攻击你们”。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的神圣名字形式，保留专名性质，而不以“主”这一称号代替。
- source_word: שְׁאֵרִית יְהוּדָה
  choice: 犹大的余民
  rationale: “余民”既表达灾后存留下来的人，也保留先知书中该词的历史与神学张力。
- source_word: אַל תָּבֹאוּ מִצְרָיִם
  choice: 不要进入埃及
  rationale: 直译否定命令及 בוא 的“进入”义；在这里指进入埃及境内，中文清楚自然。
- source_word: יָדֹעַ תֵּדְעוּ
  choice: 务要确知
  rationale: 以“务要”和“确知”共同传达不定式绝对形与限定动词连用所形成的强调语气。
- source_word: הַעִידֹתִי בָכֶם
  choice: 我已经郑重警告你们
  rationale: עוּד 的使役形在语境中具有严肃警戒的言语功能；“郑重”保留正式作证的色彩，脚注同时保留“作证指控”的可能译法。
- source_word: הַיּוֹם
  choice: 今日
  rationale: 准确表达时间指示；“今日”庄重而仍为现代中文普遍可懂。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 正文采用中文读者最熟悉、且作为专名使用的“耶和华”，不以称号“主”替换原文神名；“雅威”是按学界常见拟音的另一选择。
- issue: שְׁאֵרִית 的历史与神学含义
  choice: 余民
  alternative: 幸存者
  rationale: “余民”既能指犹大灾后剩下的群体，也保留先知文学中的神学共鸣；“幸存者”虽更直白，却会削弱这一层张力。
- issue: הַעִידֹתִי בָכֶם 是警告还是作证指控
  choice: 郑重警告你们
  alternative: 郑重作证指控你们
  rationale: 上下文的主要交际功能是阻止他们前往埃及，因此正文译作警告；但动词和介词也容许正式作证乃至不利指证的意味，故用脚注保留。
translation_notes:
  register: 采用现代、庄重且易懂的普通话书面语。“犹大的余民啊”明确呼语；正文不加引号，以免把后半句中先知自称的“我”误解为耶和华。脚注标记 [a] 已置于相关短语之后。
