base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/042/020.yaml
  text: For you have deceived yourselves[a], because you sent me to Yahweh your God, saying, ‘Pray for us to Yahweh our God, and whatever Yahweh our God says, tell us, and we will do it.’
translation:
  language: zh_hans
  text: 你们实在是自欺[a]，因为你们曾差我去见雅威你们的上帝，说：‘请为我们向雅威我们的上帝祷告；雅威我们的上帝无论说什么，你都要告诉我们，我们一定照着做。’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你们走入歧途，以致赔上自己的性命。”原文的表达既可强调自欺，也可能突出这种选择会危及他们的性命。
    reason: 保留 התעיתם בנפשותיכם 这一困难短语在“自我欺骗”与“自取灭亡”之间的词义张力。
lexical_decisions:
- source_word: התעיתם בְּנַפְשׁוֹתֵיכֶם
  choice: 你们欺骗了自己
  rationale: 使役形动词与“你们自己／你们的性命”这一短语搭配，含义较难确定。结合上下文中百姓口称愿意顺服、实际却不肯听从的情形，译为“欺骗了自己”最自然，也保留了他们应为自欺负责的责备意味；危及性命的可能含义收入脚注。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语中可辨识的音译呈现四字神名，不用称号替代专名。
- source_word: אֱלֹהֵיכֶם / אֱלֹהֵינוּ
  choice: 你们的上帝／我们的上帝
  rationale: 分别保留第二人称复数和第一人称复数所属关系，也呈现耶利米复述百姓原话时人称的转换。
- source_word: הִתְפַּלֵּל בַּעֲדֵנוּ
  choice: 请为我们……祷告
  rationale: 准确表达代求之意，同时采用普通读者容易理解的现代汉语。
- source_word: וּכְכֹל אֲשֶׁר יֹאמַר
  choice: 无论说什么
  rationale: 自然表达原文“照着他所说的一切”的全面范围。
- source_word: הַגֶּד לָנוּ
  choice: 告诉我们
  rationale: 以自然的现代汉语表达命令式“向我们报告／宣告”。
- source_word: וְעָשִׂינוּ
  choice: 我们一定照着做
  rationale: 原文宾语承接前文所传达的话；“照着做”明确表达百姓承诺遵行，并以“一定”传达其郑重语气。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用以色列上帝的专名；主文采用“雅威”音译，以区别于“主”等称号。
- issue: התעיתם בנפשותיכם 所指的责备
  choice: 你们欺骗了自己
  alternative: 你们走入歧途，以致赔上自己的性命
  rationale: 上下文着重揭露百姓表面求问、实则无意顺服的自欺；但 נֶפֶשׁ 也可指“性命”，整个表达可能强调这种错误将危及他们的生命，因此在脚注保留这一张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“你们曾差我”承接先前发生的差遣，“我们一定照着做”呈现引语中的郑重承诺。主文不将较难的希伯来语表达过度解释，脚注交代其可能涉及性命的另一层含义。
