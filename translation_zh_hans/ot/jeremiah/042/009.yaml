  yaml_path: translation/ot/jeremiah/042/009.yaml
  text: And he said to them, “Thus says the LORD, the God of Israel, to whom you sent me to lay your plea before him:”
translation:
  language: zh_hans
  text: 他对他们说：“以色列的上帝耶和华如此说：你们派我到他那里，把你们的恳求呈在他面前：”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: 如此说
  rationale: 保留先知宣告公式的庄重和固定语气。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的专名对应四字神名，与“上帝”相区别。
- source_word: לְהַפִּיל תְּחִנַּתְכֶם לְפָנָיו
  choice: 把你们的恳求陈在他面前
  rationale: “陈在……面前”自然表达向上帝呈上祈求；“恳求”体现 תְּחִנָּה 的迫切请求含义，而不把它窄化为一般陈情。
theological_decisions:
- issue: אֱלֹהֵי יִשְׂרָאֵל 的称谓表达
  choice: 以色列的上帝
  alternative: 以色列的神
  rationale: 采用庄重、通行且不偏向特定宗派的现代中文称谓。
- issue: אֵלָיו 与 לְפָנָיו 的指代
  choice: 均译作“他”，并在句末接“耶和华说”
  alternative: 明说“耶和华”以消除代词
  rationale: 原文使用第三人称代词，保留其行文结构；补出原文省略但语义必需的引语主语会越过本节边界，故不应添加。
translation_notes:
  register: 采用现代、庄重而易懂的普通话书面语；保留先知宣告公式。注意：经复核，本节希伯来文以冒号式引出下一节内容，中文应止于冒号，不应增添“耶和华说”。
