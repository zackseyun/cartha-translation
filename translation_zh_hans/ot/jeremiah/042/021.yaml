source:
  edition: WLC
  text: וָ/אַגִּ֥ד לָ/כֶ֖ם הַ/יּ֑וֹם וְ/לֹ֣א שְׁמַעְתֶּ֗ם בְּ/קוֹל֙ יְהוָ֣ה אֱלֹֽהֵי/כֶ֔ם וּ/לְ/כֹ֖ל אֲשֶׁר שְׁלָחַ֥/נִי אֲלֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/042/021.yaml
  text: I have told you today[a], but you have not obeyed the voice of Yahweh your God or anything for which he sent me to you.
translation:
  language: zh_hans
  text: 今天我已经告诉你们了[a]，但你们没有听从雅威你们的上帝的话，也没有听从他差我向你们传达的一切。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “我已经告诉你们了”也可译为“今天我告诉了你们”。
    reason: 希伯来语完成式在这里既可侧重当天已经完成的行动，也可用汉语一般过去表达；两种译法不改变责备的核心意思。
lexical_decisions:
- source_word: וָאַגִּד
  choice: 我已经告诉
  rationale: נגד的使役式在此指“告诉、告知”。结合הַיּוֹם和当前语境，用“已经告诉”自然表达当天已经完成、此刻仍具现实效力的传达。
- source_word: הַיּוֹם
  choice: 今天
  rationale: 作时间状语，直译为“今天”，符合现代汉语。
- source_word: וְלֹא שְׁמַעְתֶּם בְּקוֹל
  choice: 但你们没有听从……的话
  rationale: שׁמע בְּקוֹל是“听从、顺服”的惯用表达，不只是听见声音；“听从……的话”既保留言语意象，也传达服从的含义。
- source_word: יְהוָה אֱלֹהֵיכֶם
  choice: 你们的上帝雅威
  rationale: 将四字神名音译为“雅威”，并按自然汉语语序把“你们的上帝”作为同位说明。
- source_word: וּלְכֹל אֲשֶׁר
  choice: 也没有听从……一切
  rationale: 介词לְ承接前面的“听从”，כֹל אֲשֶׁר涵盖雅威托付先知传达的全部内容；在汉语中补出第二个“听从”，使句法关系清楚。
- source_word: שְׁלָחַנִי אֲלֵיכֶם
  choice: 他差我向你们传达
  rationale: 字面是“他差我到你们这里”；此处先知受差遣所带来的内容由上下文明确，译作“差我向你们传达”能在自然汉语中显明所指而不增加新的信息。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。音译“雅威”保留其专名性质，避免以称号“主”替代；“耶和华”是传统音译，但较不贴近通常重建的读音。
- issue: “听”的顺服含义
  choice: 听从
  alternative: 听见；听
  rationale: שׁמע与בְּקוֹל搭配时包含遵从之意。“听从”表达原文对百姓不顺服的责备，同时保留他们拒绝先知信息与拒绝上帝话语之间的张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“你们的上帝雅威”比“雅威你们的上帝”更符合汉语同位结构；末句重复“没有听从”，以清楚呈现原文介词结构所表达的并列范围。
