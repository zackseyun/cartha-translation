reference: Jeremiah 42:10
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: אִם שׁ֤וֹב תֵּֽשְׁבוּ֙ בָּ/אָ֣רֶץ הַ/זֹּ֔את וּ/בָנִ֤יתִי אֶתְ/כֶם֙ וְ/לֹ֣א אֶהֱרֹ֔ס וְ/נָטַעְתִּ֥י אֶתְ/כֶ֖ם וְ/לֹ֣א אֶתּ֑וֹשׁ כִּ֤י נִחַ֨מְתִּי֙ אֶל הָ֣/רָעָ֔ה אֲשֶׁ֥ר עָשִׂ֖יתִי לָ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/042/010.yaml
  text: If you will indeed remain in this land[a], then I will build you up and not tear you down, and I will plant you and not uproot you[c][b]; for I relent concerning the harm that I did to you.
translation:
  language: zh_hans
  text: 你们若确实留在这地[a]，我就建立你们，不拆毁你们；栽植你们，不拔出你们[b]；因为我已就我降给你们的灾祸改变心意[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“你们若真的住在这地”。希伯来文在“居住”的动词前加上一个表示“再、仍”的词，加强继续留在当地的意思。
    reason: lexical_alternative
  - marker: b
    text: “拔出”也可译作“拔除”。原文保留“栽植”与“拔出”的农耕比喻。
    reason: lexical_alternative
  - marker: c
    text: “改变心意”也可较直译为“后悔了”。这里是说上帝就所降的灾祸改变处置，并非说他犯了道德上的恶事。
    reason: theological_clarity
lexical_decisions:
- source_word: אִם שׁוֹב תֵּשְׁבוּ
  choice: 你们若确实留在
  rationale: אִם引出条件；动词不定式绝对式שׁוֹב置于限定动词תֵּשְׁבוּ之前，强化“居住、留下”的意思。上下文关乎是否留在犹大而不去埃及，因此译作“确实留在”，不误解为“返回并居住”。
- source_word: בָּאָרֶץ הַזֹּאת
  choice: 这地
  rationale: 保留“地”的地理及盟约语境，也符合现代汉语圣经文体。
- source_word: וּבָנִיתִי אֶתְכֶם וְלֹא אֶהֱרֹס
  choice: 我就要建立你们，不拆毁你们
  rationale: 保留“建造／拆毁”这一组相反的先知性意象；“建立你们”比直译“建造你们”更合乎现代汉语，同时没有具体化为“重建”。
- source_word: וְנָטַעְתִּי אֶתְכֶם וְלֹא אֶתּוֹשׁ
  choice: 栽植你们，不拔出你们
  rationale: 保留耶利米书常见的农耕比喻及两个动词之间的鲜明对照；不将其抽象化为“使你们安定”。
- source_word: כִּי נִחַמְתִּי
  choice: 因为我……已经转意
  rationale: כִּי说明应许的理由。נחם在此表示对所施行之灾祸转变处置，不必然表示承认道德过错；“转意”既表达方向改变，也保留经文以人的情态描述上帝的张力。
- source_word: אֶל הָרָעָה
  choice: 对……灾祸
  rationale: רָעָה在本语境指审判所带来的灾难，而非道德上的邪恶。“灾祸”既准确又能避免把经文误读为上帝行了恶事。
- source_word: אֲשֶׁר עָשִׂיתִי לָכֶם
  choice: 降给你们的
  rationale: 希伯来文直译为“我向你们所做的”。汉语用“降给”自然表达灾祸由上帝施行，同时不削弱上帝在审判中的主动性。
theological_decisions:
- issue: 上帝作主语时נחם的译法
  choice: 我对降给你们的灾祸已经转意
  alternative: 我为向你们所行的灾祸后悔了
  rationale: 原文确实以人的情态描述上帝对先前审判的转意，应保留这种神学张力；但现代汉语“后悔”容易被理解为承认自己犯了道德错误，这是本句并未要求的含义。“转意”表达不再照先前方向继续施灾，同时脚注列出较直译的可能。
- issue: רָעָה是否指道德之恶
  choice: 灾祸
  alternative: 恶事
  rationale: 上下文所指是上帝在审判中施行的灾难，不是道德邪恶；译作“灾祸”避免无根据地赋予上帝道德过错。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“建立／拆毁”和“栽植／拔出”保留原文两组平行意象；避免过度古雅的“栽种尔等”等表达，也避免用抽象释义抹平先知语言。
