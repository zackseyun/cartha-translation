  text: וַ/יֹּאמְר֞וּ אֶֽל יִרְמְיָ֣הוּ הַ/נָּבִ֗יא תִּפָּל נָ֤א תְחִנָּתֵ֨/נוּ֙ לְ/פָנֶ֔י/ךָ וְ/הִתְפַּלֵּ֤ל בַּעֲדֵ֨/נוּ֙ אֶל יְהוָ֣ה אֱלֹהֶ֔י/ךָ בְּעַ֖ד כָּל הַ/שְּׁאֵרִ֣ית הַ/זֹּ֑את כִּֽי נִשְׁאַ֤רְנוּ מְעַט֙ מֵֽ/הַרְבֵּ֔ה כַּ/אֲשֶׁ֥ר עֵינֶ֖י/ךָ רֹא֥וֹת אֹתָֽ/נוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/042/002.yaml
  text: And they said to Jeremiah the prophet[a], “Please let our plea come before you, and pray for us to Yahweh your God, for all this remnant, for we are left as few out of many[b], as your eyes see us.”
translation:
  language: zh_hans
  text: 他们对耶利米先知说：“愿我们的恳求呈到你面前[a]；请你为我们、为这全体余民，向雅威你的上帝祷告，因为我们从许多人中只剩下少数，正如你亲眼所见。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“愿我们的恳求落在你面前”，是把郑重的恳求呈到人面前的说法。
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּפָּל נָא תְחִנָּתֵנוּ לְפָנֶיךָ
  choice: 求你垂听我们的恳求
  rationale: 原文直译为“愿我们的恳求落在你面前”，是郑重呈上请求的习语。中文用“垂听……恳求”自然表达请求获接纳和听取的意思，并以脚注保留原文意象。
- source_word: וְהִתְפַּלֵּל בַּעֲדֵנוּ
  choice: 为我们……祷告
  rationale: 准确表达这里“为某人祷告、代求”的含义；采用普通现代读者熟悉的“祷告”，不额外强化为专门神学术语。
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: 雅威你的上帝
  rationale: 以“雅威”音译四字神名，保留其专名性质；“你的上帝”也保留说话者将雅威称为耶利米之上帝的措辞。
- source_word: בְּעַד כָּל הַשְּׁאֵרִית הַזֹּאת
  choice: 为这所有的余民
  rationale: “余民”保留שְׁאֵרִית在耶利米书中的关键词意义；“这所有的”贴近原文范围表达，虽可理解为“这全体余民”。
- source_word: נִשְׁאַרְנוּ מְעַט מֵהַרְבֵּה
  choice: 我们从许多人中只剩下这一点人
  rationale: 自然表达现今人数稀少与原先人数众多之间的强烈对比，同时保留“剩下”的被存留状态。
- source_word: כַּאֲשֶׁר עֵינֶיךָ רֹאוֹת אֹתָנוּ
  choice: 正如你亲眼所见
  rationale: 用现代汉语惯用表达保留原文诉诸耶利米亲眼观察的强调。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。音译“雅威”保留其作为以色列之上帝专名的性质，不以称号替代。
- issue: שְׁאֵרִית的译法
  choice: 余民
  alternative: 幸存者；剩下的人
  rationale: “余民”既符合基本词义，也保留该词在先知书中的反复用语及神学张力，不把它单纯解释为灾难幸存者。
- issue: “你的上帝”中的关系措辞
  choice: 保留“你的上帝”
  alternative: 我们的上帝
  rationale: 说话者原话是“雅威你的上帝”。译文不把它改成更具共同认信色彩的“我们的上帝”，以免消除叙事中的距离感。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“求你垂听我们的恳求”避免生硬直译，同时以脚注保存希伯来语意象；“余民”“雅威”保留经文的重要词汇与神名。
