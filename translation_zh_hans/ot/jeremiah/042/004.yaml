  text: וַ/יֹּ֨אמֶר אֲלֵי/הֶ֜ם יִרְמְיָ֤הוּ הַ/נָּבִיא֙ שָׁמַ֔עְתִּי הִנְ/נִ֧י מִתְפַּלֵּ֛ל אֶל יְהוָ֥ה אֱלֹהֵי/כֶ֖ם כְּ/דִבְרֵי/כֶ֑ם וְֽ/הָיָ֡ה כָּֽל הַ/דָּבָר֩ אֲשֶׁר יַעֲנֶ֨ה יְהוָ֤ה אֶתְ/כֶם֙ אַגִּ֣יד לָ/כֶ֔ם לֹֽא אֶמְנַ֥ע מִ/כֶּ֖ם דָּבָֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/042/004.yaml
  text: Then Jeremiah the prophet said to them[a], “I have heard. Behold, I am praying to Yahweh your God according to your words, and whatever Yahweh answers you, I will tell you[b]. I will not withhold a word from you.”
translation:
  language: zh_hans
  text: 耶利米先知对他们说：“我听见了。看哪，我要照你们所说的，向雅威你们的上帝祷告；无论雅威回答你们什么，我都必告诉你们。我绝不向你们隐瞒一句话。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: 承接上文推进叙事；现代汉语通常无须另加“于是”也能自然表达顺序。
- source_word: שָׁמַעְתִּי
  choice: 我听见了
  rationale: 完成式在回应请求时表示已经听到并接受对方所说的话；保留原文简洁而略带正式的回应。
- source_word: הִנְנִי מִתְפַּלֵּל
  choice: 看哪，我要……祷告
  rationale: הִנְנִי 加分词表示引人注意的即时或即将采取的行动；“看哪”保留话语标记，“我要”在中文中自然表达当下承诺，同时不把动作说成惯常行为。
- source_word: אֶל יְהוָה אֱלֹהֵיכֶם
  choice: 向雅威你们的上帝
  rationale: 以“雅威”音译四字神名，并保留第二人称复数所属关系“你们的上帝”。
- source_word: כְּדִבְרֵיכֶם
  choice: 照你们所说的
  rationale: 贴近字面“按照你们的话”，同时以自然现代汉语指向他们刚才提出的请求。
- source_word: כָּל הַדָּבָר אֲשֶׁר יַעֲנֶה יְהוָה אֶתְכֶם
  choice: 雅威无论怎样回答你们
  rationale: 该结构整体表达雅威回答的全部内容；“无论怎样回答”自然传达 כָּל...אֲשֶׁר，又避免在中文中生硬重复“话”。
- source_word: אַגִּיד לָכֶם
  choice: 我都必告诉你们
  rationale: נגד 的使役式意为告知、宣布；“都必告诉”既承接“无论怎样”，也体现郑重承诺。
- source_word: לֹא אֶמְנַע מִכֶּם דָּבָר
  choice: 我绝不向你们隐瞒一句话
  rationale: 保留 דָּבָר 的“一句话”，并以“绝不……隐瞒”自然表达“不扣留”的意思及完整传达信息的承诺。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；音译“雅威”保留其专名性质，不以称号替代，也不采用较晚形成的混合读音。
- issue: “你们的上帝”的关系表达
  choice: 保留“你们的上帝”
  alternative: 我们的上帝
  rationale: 原文明确使用第二人称复数后缀。虽然耶利米自己也敬拜雅威，译文不应为缓和潜在张力而改成人称共享表达。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“看哪”保留原文醒目的话语标记；其余句法适度汉语化，避免过度古雅。“一句话”与前文的回答相呼应，突出耶利米将完整传达神谕。
