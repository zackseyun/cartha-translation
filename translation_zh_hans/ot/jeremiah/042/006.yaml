base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/042/006.yaml
  text: Whether it is good or whether it is bad, we will obey the voice of the LORD our God, to whom we are sending you, so that it may go well with us when we obey the voice of the LORD our God.
translation:
  language: zh_hans
  text: 无论是好是坏，我们都必听从耶和华我们上帝的话，就是我们差你到他那里去见的那一位；好叫我们在听从耶和华我们上帝的话时得好处。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִם טוֹב וְאִם רָע
  choice: 无论是好是坏
  rationale: 保留原文对称结构，指所得答复无论合意与否，都愿意顺从。
- source_word: בְּקוֹל ... נִשְׁמָע
  choice: 听从……的话
  rationale: 希伯来语“听声音”在此包含顺从之意；现代汉语以“听从……的话”自然表达。
- source_word: יְהוָה אֱלֹהֵינוּ
  choice: 耶和华我们上帝
  rationale: 以“耶和华”译四字神名，以“上帝”译 אֱלֹהִים，保持称谓重复。
- source_word: אֲשֶׁר אֲנַחְנוּ שֹׁלְחִים אֹתְךָ אֵלָיו
  choice: 我们派你到他那里去求问
  rationale: “求问”由语境明确：众人差耶利米到耶和华那里代为祈求并领受指示；补出目的使汉语自然。
- source_word: לְמַעַן אֲשֶׁר יִיטַב לָנוּ
  choice: 这样……就可以得福
  rationale: יִיטַב לָנוּ 字面为“使我们得好处／情况顺利”；“得福”简洁表达蒙恩而境况良好，但不限定为物质利益。
- source_word: כִּי
  choice: （由‘这样……就’所连接的）听从条件
  rationale: כִּי 可表原因或时间、条件关系；结合语境译成“我们听从……就”，保留顺从与得福之间的联系，避免硬定为单一因果义。
theological_decisions:
- issue: 顺从与得福之间的关系
  choice: “我们听从……的话，就可以得福”
  alternative: “因为我们听从……的话，便可顺利”
  rationale: 原文 כִּי 有语义弹性。此译不把人的顺从表述为向上帝换取福分，却保留经文所宣称的顺从与蒙福之间的关联。
- issue: 神名的翻译
  choice: 耶和华
  alternative: 雅威／上主
  rationale: “耶和华”是简体中文普通读者最熟悉的专名形式，能够区别于称号“主”，且不引入宗派性解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以分号拆开较长句子，清楚呈现承诺、差遣和结果三层关系；保留“耶和华我们上帝”的两次重复，以体现原文的郑重强调。
