revisions:
- from: 无论是好是坏，我们都必听从耶和华我们上帝的话；我们派你到他那里去求问。这样，我们听从耶和华我们上帝的话，就可以得福。
  to: 无论是好是坏，我们都必听从耶和华我们上帝的话，就是我们差你到他那里去见的那一位；好叫我们在听从耶和华我们上帝的话时得好处。
  rationale: 删去原文未明说的“求问”，并以“就是……那一位”清楚保留“我们差你到他那里去”对“耶和华我们上帝”的修饰关系。末句以“在……时”对应英文审校轨迹所采用的“when”，同时不排除原文 כִּי 所带的关联意味；“得好处”贴近原文字义。
