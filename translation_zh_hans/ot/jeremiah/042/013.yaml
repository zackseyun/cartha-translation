  text: וְ/אִם אֹמְרִ֣ים אַתֶּ֔ם לֹ֥א נֵשֵׁ֖ב בָּ/אָ֣רֶץ הַ/זֹּ֑את לְ/בִלְתִּ֣י שְׁמֹ֔עַ בְּ/ק֖וֹל יְהוָ֥ה אֱלֹהֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/042/013.yaml
  text: But if you say[a], ‘We will not stay in this land,’ not obeying the voice of Yahweh your God—
translation:
  language: zh_hans
  text: 但如果你们说：“我们不住在这地”，为了不听从耶和华你们的上帝的话——
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאִם
  choice: 但如果
  rationale: 承接上文并引出与先前应许相反的条件，译为“但如果”自然体现转折。
- source_word: אֹמְרִים אַתֶּם
  choice: 你们说
  rationale: 希伯来文分词加显明代词在此条件句中表达“你们说”；现代汉语无需保留分词形态。
- source_word: לֹא נֵשֵׁב
  choice: 我们不住
  rationale: יָשַׁב 在此指留居、定居于犹大；“不住”简洁自然，也保留居住之意。
- source_word: בָּאָרֶץ הַזֹּאת
  choice: 在这地
  rationale: “这地”保留 אֶרֶץ 的地理和圣约语境，也符合中文圣经体裁。
- source_word: לְבִלְתִּי שְׁמֹעַ בְּקוֹל
  choice: 不听从……的话
  rationale: 该结构表达拒绝听从的目的或结果；“听从……的话”同时保留听闻意象及顺服含义，较单译“服从”更贴近希伯来习语。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文读者最熟悉的神圣名音译“耶和华”，将其作为专名而非用称号替代。
- source_word: אֱלֹהֵיכֶם
  choice: 你们的上帝
  rationale: 准确表达第二人称复数所属关系，并保留圣约性的直接称呼。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。中文正文以广为通行且可辨识为专名的“耶和华”音译，不以“主”这一称号替代。
- issue: שׁמע בקול 的含义
  choice: 听从……的话
  alternative: 服从……的声音；听……的声音
  rationale: 先知性圣约语境中的短语不只是听见声音，也包含以行动回应、顺服之意。“听从……的话”在现代汉语中自然兼具聆听与遵行两层含义，避免把原文意象完全抽象化。
- issue: לְבִלְתִּי 的句法关系
  choice: 不听从
  alternative: 为了不听从
  rationale: 该不定式结构可带目的或结果色彩。正文用“不听从”保持关系适度开放，避免武断判定他们留地与不顺服之间只能是明确目的关系。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。保留未完句末的破折号，因为本节条件句在下一节继续。引语中的“我们”对应说话者自称；叙述中的“你们”对应先知所面对的群体。
