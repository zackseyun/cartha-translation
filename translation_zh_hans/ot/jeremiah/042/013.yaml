  naturalness: “耶和华你们上帝的话”在现代标准汉语中缺少所属结构的标记，读起来不够顺畅。改为“耶和华你们的上帝的话”清楚自然，也维持庄重语体。
  terminology: 保留“耶和华”“上帝”“听从……的话”。“听从……的话”既保留“声音／话语”的表达，也传达此处并非单指听见。
