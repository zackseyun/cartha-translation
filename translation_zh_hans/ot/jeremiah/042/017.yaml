reference: Jeremiah 42:17
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/יִֽהְי֣וּ כָל הָ/אֲנָשִׁ֗ים אֲשֶׁר שָׂ֨מוּ אֶת פְּנֵי/הֶ֜ם לָ/ב֤וֹא מִצְרַ֨יִם֙ לָ/ג֣וּר שָׁ֔ם יָמ֕וּתוּ בַּ/חֶ֖רֶב בָּ/רָעָ֣ב וּ/בַ/דָּ֑בֶר וְ/לֹֽא יִהְיֶ֤ה לָ/הֶם֙ שָׂרִ֣יד וּ/פָלִ֔יט מִ/פְּנֵי֙ הָֽ/רָעָ֔ה אֲשֶׁ֥ר אֲנִ֖י מֵבִ֥יא עֲלֵי/הֶֽם־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/042/017.yaml
  text: Then all the men who have set their faces to go to Egypt to sojourn there shall die by the sword[a], by famine, and by pestilence[b]. None of them shall have a survivor or an escapee from the disaster that I am bringing on them.
translation:
  language: zh_hans
  text: 所有定意要到埃及去、寄居在那里的男人，都必死于刀剑、饥荒和瘟疫[a]。他们中必没有一个存留者，也没有一个逃脱者，能逃过我将要加在他们身上的灾祸[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “瘟疫”也可译作“疫病”。这里与“刀剑、饥荒”构成耶利米书中常见的三重灾难用语。
    reason: lexical_alternative
  - marker: b
    text: “存留者……逃脱者”直译为“存留者和逃亡者”，两个词连用强调无人剩下，也无人逃走。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִהְיוּ
  choice: 都必
  rationale: 该形式承接上文警告并引出其后果；汉语以“都必”自然表达预告与审判的确定性，不机械译出系词。
- source_word: כָל הָאֲנָשִׁים
  choice: 所有……男人
  rationale: אֲנָשִׁים 为阳性复数，在此指正在商议前往埃及的男子群体；保留原文明确的性别指称。
- source_word: אֲשֶׁר שָׂמוּ אֶת־פְּנֵיהֶם
  choice: 定意
  rationale: 希伯来语字面为“把脸转向／定向”，表达坚定的决意；“定意”在现代汉语中凝练、庄重且清楚。
- source_word: לָבוֹא מִצְרַיִם
  choice: 到埃及去
  rationale: בוא 可依叙述视角译为来、去或进入；此处从犹大前往埃及，译作“到埃及去”最自然。
- source_word: לָגוּר שָׁם
  choice: 寄居在那里
  rationale: גור 指以外来者身份居住；“寄居”保留这种非本地居民的语义，比泛泛的“居住”更贴近原文。
- source_word: יָמוּתוּ
  choice: 必死
  rationale: 表达确定的将来审判；“必”保留预言语气的确定性与庄重感。
- source_word: בַּחֶרֶב בָּרָעָב וּבַדָּבֶר
  choice: 死于刀剑、饥荒和瘟疫
  rationale: 保留耶利米书中常见的三重审判用语；“刀剑”指暴力或战争造成的死亡，“瘟疫”准确传达 דֶּבֶר。
- source_word: שָׂרִיד וּפָלִיט
  choice: 一个存留的，也没有一个逃脱的
  rationale: 以两个并列称谓保留原文的语义加强：无人剩存，也无人逃脱；避免将 שָׂרִיד 固定译为可能带入额外神学含义的“余民”。
- source_word: מִפְּנֵי הָרָעָה
  choice: 面对……灾祸
  rationale: רָעָה 在审判语境中指灾祸而非道德上的邪恶；מִפְּנֵי 在此表达从临到的灾祸面前逃脱。
- source_word: אֲשֶׁר אֲנִי מֵבִיא עֲלֵיהֶם
  choice: 我将要降在他们身上的
  rationale: 保留上帝直接施行审判的主体性；分词 מֵבִיא 带有迫近之意，故译“将要降在”。
theological_decisions:
- issue: 是否弱化上帝在灾祸中的直接施行者身份
  choice: 我将要降在他们身上的灾祸
  alternative: 将要临到他们的灾祸
  rationale: 原文明确以“我”为 מֵבִיא 的主语；译文保留直接的神圣主体性，不将其改写为无主体的事件。
- issue: שָׂרִיד 是否译作具有神学术语色彩的“余民”
  choice: 存留的
  alternative: 余民
  rationale: 本节与 פָלִיט 并列，重点是无人幸存、无人逃脱；“存留的”保留具体语义而不额外导入系统神学用法。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“定意”传达希伯来习语“把脸转向”的坚决意味；“寄居”保留在异地以外来者身份居住的含义。第二句调整为自然汉语句式，同时保留“无人存留、无人逃脱”的双重强调及上帝直接降灾的表述。
