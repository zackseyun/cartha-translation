source:
  edition: WLC
  text: וַ/יְהִ֕י מִ/קֵּ֖ץ עֲשֶׂ֣רֶת יָמִ֑ים וַ/יְהִ֥י דְבַר יְהוָ֖ה אֶֽל יִרְמְיָֽהוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/042/007.yaml
  text: And it happened[a], at the end of ten days, that the word of Yahweh came to Jeremiah.
translation:
  language: zh_hans
  text: 十天期满[a]，耶和华的话临到耶利米。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译可作“从十天的尽头”；意思是十天结束以后。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: （不单独译出）
  rationale: 句首的叙事推进公式在现代汉语中可由时间状语后直接进入主句自然表达；若硬译为“事情是这样”，会显得冗赘。
- source_word: מִקֵּץ עֲשֶׂרֶת יָמִים
  choice: 十天期满
  rationale: מִקֵּץ表示一段时间达到终点；“十天期满”简洁保留了完成界点的含义。
- source_word: וַיְהִי דְבַר יְהוָה אֶל
  choice: 耶和华的话临到
  rationale: 第二个וַיְהִי与后续成分构成先知叙事中的固定启示公式；“……的话临到……”既忠实，也符合中文圣经语体。
- source_word: דְבַר יְהוָה
  choice: 耶和华的话
  rationale: 保留“话”这一先知性启示用语，不将其解释性地改写为“信息”。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文读者最熟悉且约定俗成的神名音译，明确其为专名，而非以“主”这一称号代替。
- source_word: יִרְמְיָהוּ
  choice: 耶利米
  rationale: 采用现代中文圣经中通行、易于辨识的人名译法。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名，应以专名呈现；中文正文采用约定俗成且普通读者最熟悉的“耶和华”，不以称号“主”替代。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。“临到”保留先知启示公式的传统庄严感，且普通中文圣经读者容易理解。
