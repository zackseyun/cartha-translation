source:
  edition: WLC
  text: וַֽ/יִּגְּשׁוּ֙ כָּל שָׂרֵ֣י הַ/חֲיָלִ֔ים וְ/יֽוֹחָנָן֙ בֶּן קָרֵ֔חַ וִֽ/יזַנְיָ֖ה בֶּן הוֹשַֽׁעְיָ֑ה וְ/כָל הָ/עָ֖ם מִ/קָּטֹ֥ן וְ/עַד גָּדֽוֹל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/042/001.yaml
  text: Then all the commanders of the forces approached[a], along with Yohanan son of Kareah and Yizaniah son of Hoshaiah[b], and all the people from the least to the greatest.
translation:
  language: zh_hans
  text: 众军长[a]、加利亚的儿子约哈难、何沙雅的儿子耶撒尼亚，以及从最小的到最大的全体百姓[b]，都上前来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“众军队长官”或“众部队统领”。
    reason: lexical_alternative
  - marker: b
    text: “从最小的到最大的”是以两端概括全体的说法，表示整个群体中的所有人。
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּגְּשׁוּ
  choice: 都上前来
  rationale: נגשׁ在叙事中表示走近、上前；“上前来”自然地保留了朝向某人而来的动作，又未把上下文中未明说的对象补入正文。
- source_word: כָּל שָׂרֵי הַחֲיָלִים
  choice: 众军长
  rationale: שָׂרֵי指首领、长官，חֲיָלִים在此指军队或武装部队；“众军长”简洁、庄重，并保留军事领导者的含义。
- source_word: וְיוֹחָנָן בֶּן־קָרֵחַ
  choice: 加利亚的儿子约哈难
  rationale: 采用现代中文圣经人名的通行音译形式，并保留“某人的儿子”这一谱系表达。
- source_word: וִיזַנְיָה בֶּן־הוֹשַׁעְיָה
  choice: 何沙雅的儿子耶撒尼亚
  rationale: 按希伯来文人名音译，并以自然的中文次序表达父子关系。
- source_word: וְכָל הָעָם
  choice: 全体百姓
  rationale: הָעָם指作为整体的民众；“全体百姓”与后面的首尾概括语相配，清楚表达群体的完整性。
- source_word: מִקָּטֹן וְעַד־גָּדוֹל
  choice: 从最小的到最大的
  rationale: 保留希伯来文的两极概括表达，不擅自限定为年龄、身材或社会地位。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“都上前来”置于句末，使多项并列主语清晰；保留“从最小的到最大的”这一希伯来语修辞，并用脚注说明其整体性含义。
