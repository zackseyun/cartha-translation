base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/042/022.yaml
  text: Now therefore[a], know for certain that you will die by the sword, by famine, and by pestilence in the place where you desired to go to sojourn there.
translation:
  language: zh_hans
  text: 所以，现在你们要确实知道：你们必死于刀剑、饥荒和瘟疫[a]，在你们想要去寄居的地方。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“疫病”。希伯来词也可泛指流行性疾病。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: 所以现在
  rationale: 承接上文的警告并引出结论；“所以”体现语境中的推论关系，“现在”保留时间与话语转折。
- source_word: יָדֹעַ תֵּדְעוּ
  choice: 要确实知道
  rationale: 不定式绝对式与限定动词连用以加强语气；此译法用自然现代汉语保留“务必、确知”的强调。
- source_word: כִּי
  choice: （冒号引出所知内容）
  rationale: 该词引出“知道”的内容；汉语以冒号衔接更自然，无须机械译作“就是”。
- source_word: בַּחֶרֶב בָּרָעָב וּבַדֶּבֶר
  choice: 死于刀剑、饥荒和瘟疫
  rationale: 保留先知书中反复出现的审判三联语及其并列结构；“死于”自然统摄三项。
- source_word: תָּמ֑וּתוּ
  choice: 你们必死
  rationale: 表达预告的确定性和郑重语气，同时避免古奥的文言形式。
- source_word: בַּמָּקוֹם
  choice: 就在……的地方
  rationale: “在……的地方”准确表达处所；“就”使汉语句子自然，并凸显所选择的目的地正是死亡发生之处。
- source_word: אֲשֶׁר חֲפַצְתֶּם
  choice: 你们一心想
  rationale: חפץ表示意愿、渴望；“一心想”在现代汉语中自然表达其强烈而主动的选择，也保留语境中的反讽意味。
- source_word: לָבוֹא
  choice: 去
  rationale: 按叙述视点，百姓是前往另一个地方；汉语用“去”比“来”自然。
- source_word: לָגוּר
  choice: 寄居
  rationale: גור指以外来者或暂住者身份居住；“寄居”简洁保留这一身份和暂居色彩。
- source_word: שָׁם
  choice: （由“就在……的地方”表达）
  rationale: 末尾处所副词与前面的“地方”在汉语中合并表达，可避免“在那里”的累赘，同时不丢失意义。
theological_decisions:
- issue: חרב／רעב／דבר这一审判三联语的译法
  choice: 刀剑、饥荒和瘟疫
  alternative: 刀剑、饥荒和疫病
  rationale: 保留先知传统中可辨识的审判三联语，不添加其经文本身未明说的教义解释；“瘟疫”庄重且通常指流行性传染病。
- issue: 预告死亡的确定语气
  choice: 你们必死
  alternative: 你们将死
  rationale: 与前面的强调结构相呼应，传达判语的确定性，但不进一步解释其神学机制或条件性。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。保留先知性警告的强烈语气和“刀剑、饥荒、瘟疫”的平行结构；“寄居”准确呈现暂住或以外来者身份居住的含义。脚注标记置于“瘟疫”之后，直接对应词义替代说明。
