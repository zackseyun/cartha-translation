  text: וְ/הָיְתָ֣ה הַ/חֶ֗רֶב אֲשֶׁ֤ר אַתֶּם֙ יְרֵאִ֣ים מִמֶּ֔/נָּה שָׁ֛ם תַּשִּׂ֥יג אֶתְ/כֶ֖ם בְּ/אֶ֣רֶץ מִצְרָ֑יִם וְ/הָ/רָעָ֞ב אֲשֶׁר אַתֶּ֣ם דֹּאֲגִ֣ים מִמֶּ֗/נּוּ שָׁ֣ם יִדְבַּ֧ק אַחֲרֵי/כֶ֛ם מִצְרַ֖יִם וְ/שָׁ֥ם תָּמֻֽתוּ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/042/016.yaml
  text: Then the sword that you fear will overtake you there in the land of Egypt[a], and the famine that you dread will follow close after you there in Egypt[b], and there you will die.
translation:
  language: zh_hans
  text: 那么，你们所惧怕的刀剑必在那里，就是在埃及地，追上你们；你们所担忧的饥荒必在那里，在埃及紧随你们不舍[a]；你们必死在那里。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“黏附在你们后面”，描绘紧追不舍的景象。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיְתָה
  choice: 那么……必
  rationale: 承接上文，引出警告的后果；用“那么……必”既自然，也保留预告的确定语气。
- source_word: הַחֶרֶב
  choice: 刀剑
  rationale: 保留希伯来文具体的先知性审判意象，不抽象改写为“战争”或“暴力死亡”。
- source_word: יְרֵאִים מִמֶּנָּה
  choice: 你们所惧怕的
  rationale: 直接表达 ירא 加 מן 的含义，与后半句的“所担忧的”形成有差别的平行。
- source_word: תַּשִּׂיג אֶתְכֶם
  choice: 追上你们
  rationale: 准确传达 נשׂג 的使役形在此处“赶上、追及”的含义，并保留追逐意象。
- source_word: בְּאֶרֶץ מִצְרָיִם
  choice: 在那里、在埃及地
  rationale: 同时保留“那里”和完整地名“埃及地”，突出他们寻求避难之处反成审判之地。
- source_word: הָרָעָב
  choice: 饥荒
  rationale: 上下文指群体性的灾荒，而非个人感到饥饿。
- source_word: דֹּאֲגִים מִמֶּנּוּ
  choice: 你们所担忧的
  rationale: דאג 表示忧虑、挂心；“担忧”较“惧怕”更贴近其词义，并保留平行句中的细微差别。
- source_word: יִדְבַּק אַחֲרֵיכֶם
  choice: 紧追着你们
  rationale: 按汉语习惯表达“黏附在后、紧随不舍”的持续追逼意象；字面形象见脚注。
- source_word: מִצְרַיִם
  choice: 在那里、在埃及
  rationale: 保留原文再次点明地点的强调，同时以现代汉语可读的方式排列。
- source_word: וְשָׁם תָּמֻתוּ
  choice: 你们也必死在那里
  rationale: 保留“那里”的重复强调，并用“必”表达预告的确定性。
theological_decisions:
- issue: “刀剑”和“饥荒”作为审判用语的性质
  choice: 保留具体意象“刀剑”和“饥荒”
  alternative: 译作“战争和饥饿”或解释为“暴力死亡和饿死”
  rationale: 原文以具体而鲜明的先知性审判用语表达灾祸；保留这些意象可避免替文本作神学解释。
- issue: 预言后果的确定语气
  choice: 用“必”表达
  alternative: 用中性的“会”
  rationale: 上下文是耶和华借先知发出的确定警告；“必”传达希伯来语未完成体在预告语境中的确定性，而不额外说明因果机制。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留三次地点强调，并以分号呈现两个平行的灾祸分句；避免古奥的“临到”“尾随”及过度解释性的措辞。
