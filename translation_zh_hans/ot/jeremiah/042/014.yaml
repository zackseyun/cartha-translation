  text: לֵ/אמֹ֗ר לֹ֚א כִּ֣י אֶ֤רֶץ מִצְרַ֨יִם֙ נָב֔וֹא אֲשֶׁ֤ר לֹֽא נִרְאֶה֙ מִלְחָמָ֔ה וְ/ק֥וֹל שׁוֹפָ֖ר לֹ֣א נִשְׁמָ֑ע וְ/לַ/לֶּ֥חֶם לֹֽא נִרְעָ֖ב וְ/שָׁ֥ם נֵשֵֽׁב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/042/014.yaml
  text: saying[a], ‘No, but we will go into the land of Egypt, where we will not see war, and we will not hear the sound of the trumpet, and we will not be hungry for bread; and there we will live.’
translation:
  language: zh_hans
  text: 说：‘不，我们要进入埃及地；在那里，我们看不见战争，听不见号角声，也不会因缺粮挨饿；我们要住在那里[a]。’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我们要留在那里。”希伯来语动词既可指在某地居住，也可指留在那里。
    reason: lexical_alternative
lexical_decisions:
- source_word: לֵאמֹר
  choice: 说
  rationale: 承接上一节并引出百姓所说的内容；现代汉语用“说”自然简洁。
- source_word: לֹא כִּי
  choice: 不，我们要
  rationale: 表达先强烈否定、继而提出相反打算的转折语气；汉语以“不”配合后句即可自然呈现。
- source_word: אֶרֶץ מִצְרַיִם
  choice: 埃及地
  rationale: 保留原文明确出现的“地”，同时符合中文圣经语体。
- source_word: נָבוֹא
  choice: 进入
  rationale: בוא接目的地时表示进入或前往；“进入埃及地”准确而自然。
- source_word: אֲשֶׁר
  choice: 在那里
  rationale: 关系词所指为埃及地，译作地点性的“在那里”符合现代汉语表达。
- source_word: לֹא נִרְאֶה מִלְחָמָה
  choice: 我们看不见战争
  rationale: 保留原文“看见战争”的具体意象，不将其解释性改写为“经历战争”。
- source_word: קוֹל שׁוֹפָר
  choice: 号角声
  rationale: שׁוֹפָר指用于报警等用途的角号；“号角声”简洁准确，也适合战争语境。
- source_word: לֹא נִשְׁמָע
  choice: 听不见
  rationale: 按上下文第一人称复数译为主动感知表达，在中文中自然，并与“看不见”形成对应。
- source_word: וְלַלֶּחֶם לֹא נִרְעָב
  choice: 也不会缺粮挨饿
  rationale: לֶחֶם可具体指饼，也可在此表示赖以充饥的粮食；“缺粮挨饿”自然传达因缺少食物而饥饿的含义，同时保留粮食意象。
- source_word: וְשָׁם נֵשֵׁב
  choice: 我们要住在那里
  rationale: ישׁב在迁往某地的语境中可指居住、定居或停留；正文采用自然的“住”，脚注保留“留在那里”的可能性。
