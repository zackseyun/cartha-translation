source:
  edition: WLC
  text: כִּי֩ כֹ֨ה אָמַ֜ר יְהוָ֣ה צְבָאוֹת֮ אֱלֹהֵ֣י יִשְׂרָאֵל֒ כַּ/אֲשֶׁר֩ נִתַּ֨ךְ אַפִּ֜/י וַ/חֲמָתִ֗/י עַל יֹֽשְׁבֵי֙ יְר֣וּשָׁלִַ֔ם כֵּ֣ן תִּתַּ֤ךְ חֲמָתִ/י֙ עֲלֵי/כֶ֔ם בְּ/בֹאֲ/כֶ֖ם מִצְרָ֑יִם וִ/הְיִיתֶ֞ם לְ/אָלָ֤ה וּ/לְ/שַׁמָּה֙ וְ/לִ/קְלָלָ֣ה וּ/לְ/חֶרְפָּ֔ה וְ/לֹֽא תִרְא֣וּ ע֔וֹד אֶת הַ/מָּק֖וֹם הַ/זֶּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/042/018.yaml
  text: 'For thus says Yahweh of hosts[a], the God of Israel: Just as my anger and my wrath were poured out on the inhabitants of Jerusalem, so my wrath will be poured out on you when you enter Egypt, and you will become an oath, a horror, a curse, and a reproach, and you will never again see this place.'
translation:
  language: zh_hans
  text: 因为万军之耶和华以色列的神如此说：“我的怒气和烈怒怎样倾倒在耶路撒冷的居民身上，我的烈怒也必照样倾倒在你们身上，当你们进入埃及时。你们必成为咒誓、惊骇、咒诅和羞辱的对象[a]；你们再也见不到这地方。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “咒誓”：原文也可指“咒诅的对象”，或指带有咒诅内容的誓言。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה צְבָאוֹת
  choice: 万军之耶和华
  rationale: 用“耶和华”音译神名，并以汉语圣经语域中通行的“万军之”表达 צְבָאוֹת，保留其涵盖天上与地上众军的宽广含义。
- source_word: נִתַּךְ ... תִּתַּךְ
  choice: 倾倒……必……倾倒
  rationale: 保留把烈怒描绘为液体倾泻而出的隐喻，也再现过去与将来两句之间的平行。
- source_word: אַפִּי וַחֲמָתִי
  choice: 我的怒气和烈怒
  rationale: 分别表达两个近义词，不将其合并，以保存原文叠加强调审判之严厉的修辞。
- source_word: יֹשְׁבֵי יְרוּשָׁלִַם
  choice: 耶路撒冷的居民
  rationale: 自然、准确地表达住在耶路撒冷的人。
- source_word: בְּבֹאֲכֶם מִצְרָיִם
  choice: 那时你们已经进入埃及
  rationale: ב 加不定式结构在此表示时间；结合全段警告语境，表达烈怒临到之时他们已进入埃及，同时不增添离开原文的因果解释。
- source_word: לְאָלָה
  choice: 成为人指着起誓咒诅的对象
  rationale: אָלָה 可指带有咒诅内容的誓言；此译法使现代读者明白他们将成为咒誓中援引的反面对象，又避免与后面的“受人咒诅”完全重复。
- source_word: לְשַׁמָּה
  choice: 令人惊骇
  rationale: 表达旁观者面对灾祸而惊骇的反应，比单译“荒凉”更贴近此处名词的语境功能。
- source_word: לִקְלָלָה
  choice: 受人咒诅
  rationale: 表达他们将成为咒诅对象或咒语中的反面典型，汉语自然且区别于前面的咒誓用语。
- source_word: לְחֶרְפָּה
  choice: 遭人羞辱
  rationale: 涵盖公开蒙羞、受鄙视和被讥刺的含义，不限缩为单纯言语嘲弄。
- source_word: וְלֹא תִרְאוּ עוֹד אֶת הַמָּקוֹם הַזֶּה
  choice: 你们再也见不到这地方
  rationale: 以自然现代汉语直接传达永不再见此地的警告。
theological_decisions:
- issue: 神审判用语 אַף 与 חֵמָה 的并列表达
  choice: 怒气和烈怒
  alternative: 愤怒和忿怒；鼻息和烈怒
  rationale: 保留两个词及其递增强度，不把它们压缩成一个概念；אַף 在此显然是“怒气”的惯用义，无须机械保留“鼻子”的人体意象。
- issue: 神名与称号 יְהוָה צְבָאוֹת
  choice: 万军之耶和华
  alternative: 万军之主；军队之耶和华
  rationale: “耶和华”保留专名性质，“万军之”则保存传统且宽广的称号含义，不将其仅解释为人间军队。
translation_notes:
  register: 采用庄重而可懂的现代标准汉语。“倾倒”保留原文意象；四项灾祸结果以自然汉语并列，并用脚注保存 אָלָה 在“誓言”与“咒诅”之间的词义张力。
