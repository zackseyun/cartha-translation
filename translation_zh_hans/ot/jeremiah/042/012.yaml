  text: וְ/אֶתֵּ֥ן לָ/כֶ֛ם רַחֲמִ֖ים וְ/רִחַ֣ם אֶתְ/כֶ֑ם וְ/הֵשִׁ֥יב אֶתְ/כֶ֖ם אֶל אַדְמַתְ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/042/012.yaml
  text: And I will show you mercy[a], and he will have mercy on you and restore you to your own land.
translation:
  language: zh_hans
  text: 我必赐给你们怜悯[a]；他必怜悯你们，并使你们回到你们的土地。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我必给你们怜悯。”
    reason: 保留נתן（给、赐）的较字面译法；原文随后转为第三人称“他”，按上下文可指巴比伦王。
lexical_decisions:
- source_word: וְ/אֶתֵּן לָ/כֶם רַחֲמִים
  choice: 我必使你们得到怜悯
  rationale: נתן本义为“给”，与לָכֶם和抽象名词רַחֲמִים连用，直译近于“把怜悯给你们”。这里的意思也可能是使他们从巴比伦王那里蒙怜悯；译作“使你们得到怜悯”既自然，也保留其来源未明说的特点。
- source_word: וְ/רִחַם אֶתְ/כֶם
  choice: 他也会怜悯你们
  rationale: 保留第三人称阳性单数；按上下文，“他”指巴比伦王。רִחַם与前面的רַחֲמִים同源，均译为“怜悯”，再现原文的词根呼应。
- source_word: וְ/הֵשִׁיב אֶתְ/כֶם
  choice: 使你们回到
  rationale: הֵשִׁיב是שוב的使役式，表示“使返回、带回”；“使你们回到”清楚保留使役含义。
- source_word: אֶל אַדְמַתְ/כֶם
  choice: 自己的土地
  rationale: אדמה在此指他们所属的土地；“自己的土地”自然表达第二人称复数所有关系，不将其窄化为泥土或土壤。
theological_decisions:
- issue: 神的第一人称与随后第三人称阳性单数之间的主语转换
  choice: 保留“我……他……”的转换
  alternative: 将后两个动词都顺译为神的第一人称行动
  rationale: 希伯来文先用第一人称单数אֶתֵּן，随后明确改用第三人称阳性单数רִחַם、הֵשִׁיב。按上下文，“他”指巴比伦王，是神促使其怜悯并让百姓返回的人间施行者；不应在翻译中消除这一转换。
- issue: “给你们怜悯”的语义关系
  choice: 译为“使你们得到怜悯”，并以脚注保留较形式对应的译法
  alternative: 译为“向你们施怜悯”
  rationale: 原文不是“我怜悯你们”，而是“我给你们怜悯”；结合后句，更可能表示神使他们在巴比伦王面前蒙怜悯。所选译文避免把神与王的行动合并。
translation_notes:
  register: 采用现代、庄重而通俗的普通话。“怜悯”连续出现是有意保留希伯来文名词רַחֲמִים与动词רחם的同源呼应；“我”与“他”的主语变化也按原文保留。
