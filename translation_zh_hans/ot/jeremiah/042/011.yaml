source:
  edition: WLC
  text: אַל תִּֽירְא֗וּ מִ/פְּנֵי֙ מֶ֣לֶךְ בָּבֶ֔ל אֲשֶׁר אַתֶּ֥ם יְרֵאִ֖ים מִ/פָּנָ֑י/ו אַל תִּֽירְא֤וּ מִמֶּ֨/נּוּ֙ נְאֻם יְהוָ֔ה כִּֽי אִתְּ/כֶ֣ם אָ֔נִי לְ/הוֹשִׁ֧יעַ אֶתְ/כֶ֛ם וּ/לְ/הַצִּ֥יל אֶתְ/כֶ֖ם מִ/יָּדֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/042/011.yaml
  text: Do not fear the king of Babylon[a], before whom you are afraid. Do not fear him, declares Yahweh[b], for I am with you to save you and to deliver you from his hand.
translation:
  language: zh_hans
  text: 不要怕你们所惧怕的巴比伦王；不要怕他——这是雅威[a]的宣告——因为我与你们同在，要拯救你们，把你们从他手中解救出来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “雅威”是希伯来文神名 יהוה 的音译；传统中文常译作“耶和华”。其古代准确读音不能完全确定。
    reason: 说明神名的原文形式、传统译法及读音上的真实不确定性。
lexical_decisions:
- source_word: תִּירְאוּ / יְרֵאִים
  choice: 怕／所惧怕的
  rationale: 两个词形均出自 ירא，译文保留词义上的重复；“所惧怕的”自然表达分词所指的持续现实状态。
- source_word: מִפְּנֵי ... מִפָּנָיו
  choice: 怕巴比伦王，就是你们所惧怕的那一位
  rationale: 在 ירא 之后，מִן + פָּנִים 是表示惧怕某人的惯用结构。中文不直译“从……面前”，以免产生空间移动的误解，同时保留原文重复强调的语气。
- source_word: מֶלֶךְ בָּבֶל
  choice: 巴比伦王
  rationale: 符合希伯来语领属结构，也是在现代汉语中最自然简洁的表达。
- source_word: מִמֶּנּוּ
  choice: 他
  rationale: 介词在 ירא 之后属希伯来语惯用搭配；中文自然表达为“不要怕他”。
- source_word: נְאֻם יְהוָה
  choice: 这是雅威的宣告
  rationale: 将先知性公式独立成句，既保留其庄重和权威语气，也避免汉语中插入语过长。
- source_word: יְהוָה
  choice: 雅威
  rationale: 直接音译四字神名，表明原文使用的是专名，而非普通称号“主”。
- source_word: כִּי אִתְּכֶם אָנִי
  choice: 因为我与你们同在
  rationale: כִּי 在此说明不可惧怕的理由；译文也保留原文“与你们同在”的应许。
- source_word: לְהוֹשִׁיעַ
  choice: 拯救你们
  rationale: 使役词形在此表达施行拯救；“拯救”准确、庄重且通俗。
- source_word: וּלְהַצִּיל
  choice: 把你们……解救出来
  rationale: 用“解救”与前面的“拯救”区分，以反映原文使用两个不同动词，同时构成自然的现代汉语。
- source_word: מִיָּדוֹ
  choice: 从他手中
  rationale: 保留希伯来语以“手”表示权势、控制的形象；该表达在中文中同样清楚自然。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华／上主
  rationale: 原文直接使用四字神名。正文采用“雅威”，既区别于称号“主”，也较接近该名通常重构的读音；脚注交代传统中文译名，避免把读音重构说成毫无争议。
- issue: 两项拯救动词的关系
  choice: 拯救……解救
  alternative: 两处都译为“拯救”或“救”
  rationale: 原文的 לְהוֹשִׁיעַ 与 לְהַצִּיל 意义相近却并不相同。分别译出可保留其平行强化，而不把两者解释成不同阶段或不同种类的救恩。
translation_notes:
  register: 采用现代、庄重而清楚的普通话。“就是你们所惧怕的那一位”保留原文对现实恐惧的重复强调；分号和短句呈现先知宣告的节奏。保留“从他手中”的圣经意象，但整体句法避免生硬仿译。
