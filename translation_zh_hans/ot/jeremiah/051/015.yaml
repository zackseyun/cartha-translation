id: JER.51.15
reference: Jeremiah 51:15
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: עֹשֵׂ֥ה אֶ֨רֶץ֙ בְּ/כֹח֔/וֹ מֵכִ֥ין תֵּבֵ֖ל בְּ/חָכְמָת֑/וֹ וּ/בִ/תְבוּנָת֖/וֹ נָטָ֥ה שָׁמָֽיִם׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/015.yaml
  text: He made the earth by his power[a], he established the world by his wisdom, and by his understanding he stretched out the heavens.
translation:
  language: zh_hans
  text: 他以能力创造大地，以智慧奠定世界[a]，又以聪明铺展诸天。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “世界”也可译作“人居住的世界”。
    reason: תֵּבֵל 可指有秩序、有人居住的世界；脚注保留这一较具体的词义可能。
lexical_decisions:
- source_word: עֹשֵׂה
  choice: 创造
  rationale: 该分词在这里描述上帝的创造作为；汉语“创造”自然庄重，而且不强行标出过去或现在时态，保留希伯来语分词的时态弹性。
- source_word: אֶרֶץ
  choice: 大地
  rationale: 本节是宇宙创造语境，并与“世界”和“诸天”相对，因此译作“大地”而不是某一片“土地”。
- source_word: בְּכֹחוֹ
  choice: 以能力
  rationale: 介词 בְּ 在此表工具或凭借；“以能力”简洁表达“凭他的力量”，上下文已清楚表明能力属于主语。
- source_word: מֵכִין
  choice: 奠定
  rationale: כון 的使役形有使之稳固、建立之意；“奠定”保留使世界安定稳固的色彩，也符合诗体。
- source_word: תֵּבֵל
  choice: 世界
  rationale: תֵּבֵל 常指有秩序、有人居住的世界；正文用现代汉语自然的“世界”，并以脚注保留“人居住的世界”这一较具体的可能译法。
- source_word: בְּחָכְמָתוֹ
  choice: 以智慧
  rationale: 介词表示凭借，“智慧”是 חָכְמָה 在创造语境中的直接、自然对应。
- source_word: וּבִתְבוּנָתוֹ
  choice: 又以聪明
  rationale: תְּבוּנָה 指理解、明辨的能力；译作“聪明”以区别于前面的“智慧”，同时保持简洁和诗意。
- source_word: נָטָה
  choice: 铺展
  rationale: נָטָה 在创造语境中描写把诸天伸展、展开；“铺展”自然地传达这一空间意象。
- source_word: שָׁמָיִם
  choice: 诸天
  rationale: 该词形态为复数，并处于宇宙性语境；“诸天”比“天空”涵盖更广，也保留原文的复数色彩。
theological_decisions:
- issue: 希伯来语分词与完成式并列时，创造行动应按过去事件还是持续性宣告理解
  choice: 采用不标时态的汉语动词“创造、奠定、铺展”
  alternative: 加入“曾”或“了”，统一明确译为过去发生的创造行动
  rationale: 希伯来语前两项是分词，末项是完成式；现代汉语动词本身不强制标明时态，因此可自然陈述上帝的创造作为，同时不把分词潜在的特征性、持续性意味完全排除，也不额外加入教义性解释。
translation_notes:
  register: 采用现代、庄重而易懂的诗体表达；三个“以”形成平行结构。“大地—世界—诸天”保留宇宙创造的层次；不添加“了”或“曾”，以免过度限定希伯来语的体貌。
