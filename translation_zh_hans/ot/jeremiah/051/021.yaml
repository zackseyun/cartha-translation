  yaml_path: translation/ot/jeremiah/051/021.yaml
  text: And with you I shattered horse and rider[c][b][a]; and with you I shattered chariot and rider.
translation:
  language: zh_hans
  text: 我借着你击碎马和骑马者；我借着你击碎战车和驾车者。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נִפַּצְתִּי
  choice: 我……击碎
  rationale: 此动词的加强语态表达猛烈打碎、摧毁；“击碎”既保留强烈的战争意象，又符合现代汉语，并在两处保持一致。
- source_word: בְךָ
  choice: 用你
  rationale: 介词在这里表示工具或手段；“用你”清楚保留上帝为行动主体、受话者为执行手段的语法关系。
- source_word: סוּס
  choice: 战马
  rationale: 该词本义为“马”，但与骑乘者、战车并列的军事语境明确；“战马”在汉语中自然，也避免被理解为普通役用牲畜。
- source_word: רֹכְבוֹ（第一处）
  choice: 骑兵
  rationale: 字面为“骑它的人”。与“战马”搭配时，“骑兵”简洁自然，表达骑马作战者；脚注保留较形式对应的译法。
- source_word: רֶכֶב
  choice: 战车
  rationale: 该词可指单辆战车或集合意义的战车部队；此处为单数，并与其驾乘者成对，故译作“战车”。
- source_word: רֹכְבוֹ（第二处）
  choice: 驾车的人
  rationale: 字面仍为“骑它的人”，但汉语通常不说“骑战车”；“驾车的人”在语境中自然，又不采用过度专门化的称谓。
theological_decisions:
- issue: 受话者在神施行审判时的工具性
  choice: “我用你击碎”
  alternative: “我借着你击碎”或“你替我击碎”
  rationale: 希伯来文以第一人称动词突出“我”为行动主体，并以第二人称介词短语表示手段。“我用你”保留这一关系，而不在本节中进一步断定受话者身份。
translation_notes:
  register: 采用庄重而易懂的现代标准普通话。重复“我用你击碎”以保留原文的平行结构和强调；在军事语境中使用“战马、战车”，并用“驾车的人”形成自然汉语。
