base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/024.yaml
  text: And I will repay Babylon and all the inhabitants of Chaldea for all their evil that they have done in Zion before your eyes[a], declares Yahweh.
translation:
  language: zh_hans
  text: 我要报应巴比伦和所有迦勒底的居民，因他们在锡安、在你们眼前所行的一切恶[a]；这是耶和华的宣告。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们所造成的一切祸害。”希伯来语这个词既可强调道德上的恶，也可指恶行造成的伤害。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשִׁלַּמְתִּי
  choice: 我要……报还
  rationale: 此处 שׁלם 的皮埃勒词干表示按所行的予以回报，带有审判和报应意味；“报还”既贴近原文，也保持庄重。
- source_word: לְבָבֶל
  choice: 向巴比伦
  rationale: 采用现代汉语中通行的地名译法；介词“向”配合“报还”，自然表达受报对象。
- source_word: וּלְכֹל יוֹשְׁבֵי כַשְׂדִּים
  choice: 和所有迦勒底的居民
  rationale: יוֹשְׁבֵי 是“居住者、居民”；כַשְׂדִּים 在这里可指迦勒底地区或其人民，“迦勒底的居民”保留这种地域—族群表达。
- source_word: אֵת כָּל רָעָתָם
  choice: 他们……所行的一切恶
  rationale: רָעָה 既可指道德上的恶，也可指恶行造成的伤害；正文用“恶”保留其道德分量，脚注说明另一层含义。
- source_word: אֲשֶׁר עָשׂוּ בְצִיּוֹן
  choice: 他们在锡安所行的
  rationale: בְּ 的通常意义是“在”；译为“在锡安所行”不把它过度解释为“攻击锡安”，同时上下文仍清楚表明其敌对恶行。
- source_word: לְעֵינֵיכֶם
  choice: 这是你们亲眼看见的
  rationale: 希伯来习语直译为“在你们眼前”；这里用现代汉语自然表达“亲眼看见”，强调听众是公开恶行的见证者。
- source_word: נְאֻם יְהוָה
  choice: 这是耶和华的宣告
  rationale: 保留先知宣告公式的庄严和权威性，并明确发言者。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代简体中文圣经语境中最通行、最易识别的神名音译，对应四字神名 יהוה。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用神的专名而非一般称号；正文保留专名形式。中文目标读者中“耶和华”通行且明确，不以“主”替代专名。
- issue: רָעָה 的道德与伤害含义
  choice: 正文译作“一切恶”
  alternative: 他们所造成的一切祸害／伤害
  rationale: 审判语境包含道德定罪，因此正文保留“恶”；同时不排除该词指实际伤害的语义，以脚注呈现这一真实的词义张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话书面语。“报还”保留司法性回报的力度；将“你们亲眼看见”单列为分句，避免汉语误读为“我要在你们眼前报还”，并准确连接到他们在锡安所行的恶。
