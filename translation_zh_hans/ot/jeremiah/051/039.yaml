source:
  edition: WLC
  text: בְּ/חֻמָּ֞/ם אָשִׁ֣ית אֶת מִשְׁתֵּי/הֶ֗ם וְ/הִשְׁכַּרְתִּי/ם֙ לְמַ֣עַן יַעֲלֹ֔זוּ וְ/יָשְׁנ֥וּ שְׁנַת עוֹלָ֖ם וְ/לֹ֣א יָקִ֑יצוּ נְאֻ֖ם יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/039.yaml
  text: When they are heated, I will set out their drink and make them drunk, so that they may exult, then sleep an everlasting sleep and not wake up, declares Yahweh.
translation:
  language: zh_hans
  text: 他们发热的时候，我必为他们摆设酒宴[a]，使他们喝醉，好叫他们欢腾，陷入永远的长眠[b]，永不醒来；这是雅威所说的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “酒宴”或译“饮品”或“饮酒”；希伯来词可指以饮酒为主的宴席。
    reason: lexical_alternative
  - marker: b
    text: “永远的长眠”直译为“永久的睡眠”；在这里是审判之下不可逆转的死亡隐喻。
    reason: cultural_note
lexical_decisions:
- source_word: בְּחֻמָּם
  choice: 他们发热的时候
  rationale: 该短语由介词 בְּ、表示“热”的名词及第三人称阳性复数后缀构成，可作时间或伴随情状理解。“发热”保留原文可能兼有燥热、情绪激昂或宴饮兴奋的含混性，不限定为发烧或醉酒。
- source_word: אָשִׁית אֶת־מִשְׁתֵּיהֶם
  choice: 我必为他们摆设酒宴
  rationale: אָשִׁית意为“放置、摆设”；מִשְׁתֶּה既可指饮品，也常指饮酒的宴席。“摆设酒宴”在中文中自然，并与下文“使他们喝醉”衔接，同时以脚注保留“饮品”的可能译法。
- source_word: וְהִשְׁכַּרְתִּים
  choice: 使他们喝醉
  rationale: שׁכר的使役式明确表示使人醉酒；此译直接保留上帝在审判行动中的主动性。
- source_word: לְמַעַן יַעֲלֹזוּ
  choice: 好叫他们欢腾
  rationale: לְמַעַן表达目的或结果；יַעֲלֹזוּ表示欢喜、欢腾。此处保留宴饮欢腾与随即毁灭之间的反讽张力。
- source_word: וְיָשְׁנוּ שְׁנַת עוֹלָם
  choice: 陷入永远的长眠
  rationale: 原文以“睡”与“睡眠”构成同根表达，直译在中文中累赘。“陷入永远的长眠”自然传达其加强语气，并保留睡眠这一死亡隐喻。
- source_word: וְלֹא יָקִיצוּ
  choice: 不再醒来
  rationale: קיץ意为醒来；“不再醒来”在现代中文中自然，并与“永远的长眠”共同表达审判的不可逆性。
- source_word: נְאֻם יְהוָה
  choice: 这是雅威的宣告
  rationale: נְאֻם是庄重的先知宣告公式；将יהוה音译为“雅威”，保留经文中的神圣名字。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。音译“雅威”使读者看见这是专名，而不是普通称号，也不把元音传统固定为“耶和华”。
- issue: שְׁנַת עוֹלָם在审判语境中的含义
  choice: 永远的长眠
  alternative: 永久的睡眠；死亡后永不醒来
  rationale: 保留原文的睡眠隐喻及其不可逆的审判含义，不直接改写成“死亡”，也不借此加入经文本身没有展开的来世教义。
- issue: 欢腾与长眠之间的关系
  choice: 以并列结果呈现，不加入明确的“然后”
  alternative: 欢腾，然后长眠
  rationale: 希伯来文以连接词 וְ衔接两个动词，语境虽暗示进程，却没有专门的时间副词；中文不加入“然后”，避免把隐含顺序强化为明说。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留“发热”的意象性和含混性，以“酒宴”自然连接醉酒语境；结尾使用“这是雅威的宣告”，呈现先知公式的郑重语气。
