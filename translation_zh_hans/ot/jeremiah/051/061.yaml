base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/061.yaml
  text: And Jeremiah said to Seraiah[a], “When you come to Babylon, see that you read all these words.”
translation:
  language: zh_hans
  text: 耶利米对西莱雅说：“你到了巴比伦，务要留意宣读这一切话。[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “务要留意宣读”按希伯来文较直译为“你要看，并要宣读”；这里的“看”很可能表示“留意”或“务必做到”。
    reason: 保留 וְרָאִיתָ 的字面表达及其在本语境中的惯用含义。
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: 以现代汉语自然的叙事表达承接上下文；希伯来语的叙事连接形式不必机械译出“并且”。
- source_word: יִרְמְיָהוּ
  choice: 耶利米
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: אֶל שְׂרָיָה
  choice: 对西莱雅
  rationale: 介词 אֶל 标明说话对象；“西莱雅”采用通行音译。
- source_word: כְּבֹאֲךָ בָבֶל
  choice: 你到了巴比伦
  rationale: כְּ 加不定词构式在此表示时间，即“当你来到／抵达巴比伦时”；“到了”符合自然现代汉语。
- source_word: וְרָאִיתָ
  choice: 务要留意
  rationale: 字面为“你要看”，但与后面的“宣读”连用时，很可能具有“留意去做／务必做到”的嘱咐意味；译文表达其语用功能，同时用脚注保留字面结构。
- source_word: וְקָרָאתָ
  choice: 宣读
  rationale: קרא 在书卷及书面预言的语境中指读出、诵读；“宣读”比单纯“阅读”更能体现可听见地读出这些话。
- source_word: אֵת כָּל הַדְּבָרִים הָאֵלֶּה
  choice: 这一切话
  rationale: דברים 在此指写在书卷中的预言之言；“这一切话”保留文本与先知话语的重点。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“务要留意”传达郑重嘱咐，“宣读”体现书卷语境中的出声诵读；不将希伯来语并列结构机械化，但以脚注保留其形式上的歧义。
