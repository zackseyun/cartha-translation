  text: וְ/אָמַרְתָּ֗ כָּ֠כָה תִּשְׁקַ֨ע בָּבֶ֤ל וְ/לֹֽא תָקוּם֙ מִ/פְּנֵ֣י הָ/רָעָ֗ה אֲשֶׁ֧ר אָנֹכִ֛י מֵבִ֥יא עָלֶ֖י/הָ וְ/יָעֵ֑פוּ עַד הֵ֖נָּה דִּבְרֵ֥י יִרְמְיָֽהוּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/064.yaml
  text: And you shall say[a], ‘Thus Babylon will sink and will not rise because of the disaster that I am bringing upon her, and they will grow weary.’ Up to this point are the words of Jeremiah.
translation:
  language: zh_hans
  text: 你要说：“巴比伦必这样沉下去，不再起来，因为我要使灾祸临到她；他们必疲乏[a]。”耶利米的话到此为止。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “疲乏”也可译作“疲惫不堪”或“昏倒”。希伯来语在这里突然转为复数，却没有明说“他们”是谁；很可能是指巴比伦的人。
    reason: 说明词义范围，并保留原文复数主语所指的含蓄。
lexical_decisions:
- source_word: וְאָמַרְתָּ
  choice: 你要说
  rationale: 该形式在一连串指示中具有命令意味；“你要说”既自然，也保留吩咐的语气。
- source_word: כָּכָה
  choice: 也必这样
  rationale: 指向上文把书卷沉入幼发拉底河的象征行动；加入“也”可自然表达巴比伦将照样沉下去。
- source_word: תִּשְׁקַע
  choice: 沉下去
  rationale: שקע描写向下沉没，与上文书卷沉入河中的动作相呼应。
- source_word: בָּבֶל
  choice: 巴比伦
  rationale: 采用现代汉语通行地名。
- source_word: וְלֹא תָקוּם
  choice: 不再起来
  rationale: קום与“沉下去”构成鲜明对照；“不再起来”表达其无法复起。
- source_word: מִפְּנֵי הָרָעָה
  choice: 因为……灾祸
  rationale: מִפְּנֵי在此表示原因；הָרָעָה在审判语境中指所临到的灾难，而非道德意义上的邪恶。
- source_word: אֲשֶׁר אָנֹכִי מֵבִיא עָלֶיהָ
  choice: 我要使灾祸临到她
  rationale: 希伯来语分词可表达即将发生的行动；“使……临到她”符合现代汉语的审判宣告语体。
- source_word: וְיָעֵפוּ
  choice: 他们必疲乏
  rationale: יעף可指疲乏、困倦无力；保留复数“他们”，不在正文中补定其具体所指。
- source_word: עַד הֵנָּה
  choice: 到此为止
  rationale: 这是标示一个文集或段落结束的结语，现代汉语以“到此为止”最清楚自然。
- source_word: דִּבְרֵי יִרְמְיָהוּ
  choice: 耶利米的话
  rationale: 按希伯来语名词短语直译，并与“到此为止”组成自然的中文结句。
theological_decisions:
- issue: 神所带来的הָרָעָה之性质
  choice: 译作“灾祸”
  alternative: “恶”或“灾难”
  rationale: 在本节审判语境中，这个词指临到巴比伦的灾变，而不是道德意义上的恶；“灾祸”保留审判的严厉性，又不添加原文没有作出的神学断言。
- issue: וְיָעֵפוּ复数主语的所指
  choice: 保留“他们”，不在正文中明确补作“巴比伦的居民”
  alternative: “她的居民必疲乏”
  rationale: 原文从阴性单数的巴比伦转为阳性复数，却未明说所指；很可能指巴比伦的人，但正文保留这一语法转折和指代上的含蓄。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“沉下去／起来”保留象征动作的对照；末句以“耶利米的话到此为止”呈现原文类似卷末题记的简洁语气。
