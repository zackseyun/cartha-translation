source:
  edition: WLC
  text: וְ/אָמַרְתָּ֗ יְהוָה֙ אַתָּ֨ה דִבַּ֜רְתָּ אֶל הַ/מָּק֤וֹם הַ/זֶּה֙ לְ/הַכְרִית֔/וֹ לְ/בִלְתִּ֤י הֱיֽוֹת בּ/וֹ֙ יוֹשֵׁ֔ב לְ/מֵ/אָדָ֖ם וְ/עַד בְּהֵמָ֑ה כִּֽי שִׁמְמ֥וֹת עוֹלָ֖ם תִּֽהְיֶֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/062.yaml
  text: and say[a], ‘O Yahweh, you yourself have spoken concerning this place, to cut it off so that no inhabitant will be in it, from man to beast[c][b]; for it will become everlasting desolations.’
translation:
  language: zh_hans
  text: 你要说：“耶和华[a]啊，你亲自说过，要除灭这地方[b]，使那里不再有居住的，无论人或牲畜[c]；因为它必成为永远荒凉之地[d]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “耶和华”译自希伯来文的神名 יהוה；“雅威”是现代学界常见的拟音。
    reason: divine_name
  - marker: b
    text: “除灭”原文有“剪除、断绝”的意思，也可译作“毁灭”。
    reason: lexical_alternative
  - marker: c
    text: 原文直译为“从人直到牲畜”，是表示人和动物全都不再居留的说法。
    reason: cultural_note
  - marker: d
    text: 也可译作“永久荒废”；原文“荒凉”为复数形式，用以加强荒废景象。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמַרְתָּ
  choice: 你要说
  rationale: 连词加第二人称阳性单数完成式承接上文的指示，在此自然表达为命令性的“你要说”。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代汉语圣经传统中对四字神名的通行音译，保留其作为专名的功能，而不以“主”这一称号代替。
- source_word: אַתָּה דִבַּרְתָּ
  choice: 你亲自宣告
  rationale: 独立人称代词 אַתָּה 带有强调作用；“亲自”保留这一强调。“宣告”符合此处神宣布审判的语境。
- source_word: אֶל הַמָּקוֹם הַזֶּה
  choice: 要……这地方
  rationale: אֶל 与“说”连用时通常可作“向、对”，但此处后接针对该地的审判内容；汉语以“宣告要除灭这地方”自然表达，且不额外断定其语义必为“攻击”。
- source_word: לְהַכְרִיתוֹ
  choice: 除灭这地方
  rationale: כרת 的使役式在此表示彻底剪除或毁灭；“除灭”既保留“剪除”的语义色彩，也符合庄重的审判语境。
- source_word: לְבִלְתִּי הֱיוֹת בּוֹ יוֹשֵׁב
  choice: 使其中无人居住
  rationale: 该结构表达目的或结果，即那里不再有居住者；此译简明自然。
- source_word: לְמֵאָדָם וְעַד בְּהֵמָה
  choice: 无论人或牲畜都没有
  rationale: 这是涵盖人和动物的范围表达，强调完全无人畜居留；译文传达其总体性而不拘泥于生硬的“从人到牲畜”。
- source_word: שִׁמְמוֹת עוֹלָם
  choice: 永远荒凉
  rationale: שִׁמְמוֹת 为复数，表示荒废、荒凉的状态或景象；汉语用单数状态词“荒凉”更自然。עוֹלָם 在此表示长久、永久。
- source_word: תִּהְיֶה
  choice: 它必……
  rationale: 未完成式在预告中表达将来的确定结果；“必”体现预言性的确定语气，而“荒凉”本身已能表达结果状态，无须另加“成为”。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用四字神名而非一般称号。简体中文读者最熟悉且最具经文传统连续性的专名形式是“耶和华”；脚注说明“雅威”是学界常见的拟音，既保留专名，也不把拟定读音说成毫无争议。
- issue: אֶל 在审判宣告中的关系
  choice: 以“宣告要除灭这地方”表达
  alternative: 向这地方说话／论到这地方说话／宣告攻击这地方
  rationale: 原文介词本身可作“向、对”，上下文却显示话语内容是该地遭除灭。译文保留审判指向，同时避免将介词过度定为敌对意义。
- issue: “永远”所表达的持续性
  choice: 永远荒凉
  alternative: 长久荒凉／永久荒废
  rationale: עוֹלָם 强调不见尽头或持久的状态；按原文直译为“永远”，不在正文中预先限定其哲学或末世论含义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“你亲自”保留希伯来文独立代词的强调；“除灭”较“剪除”自然，又保留 כרת 的审判力度。标点将整句话作为先知受命说出的引语。
