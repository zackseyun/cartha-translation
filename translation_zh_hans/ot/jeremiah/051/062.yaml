- from: 你要说：“耶和华[a]啊，你亲自宣告要除灭这地方[b]，使其中无人居住，无论人或牲畜都没有[c]；因为它必永远荒凉[d]。”
  to: 你要说：“耶和华[a]啊，你亲自说过，要除灭这地方[b]，使那里不再有居住的，无论人或牲畜[c]；因为它必成为永远荒凉之地[d]。”
  rationale: 修订将“从人到牲畜”与“不再有居住的”连结，解决原译的句法悬空和重复，同时保留原文对该地彻底无人畜的范围强调。将“宣告”收敛为“说过”，避免为普通“说”添加不必要的语气强度；“成为永远荒凉之地”则清楚表达未来结果。
