  to: 耶利米把将要临到巴比伦的一切灾祸，就是这一切针对巴比伦写下的话，都写在一卷书上[a]。
  rationale: 仅作安全的汉语表达修订：将不自然的“一个书卷”改为“一卷书”，并简化“也就是”为“就是”。保留原文的灾祸、书写、同一书卷及对/论及巴比伦的语义，并保留脚注以反映末句介词在语境中的可争议幅度。
