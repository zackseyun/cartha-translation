base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/060.yaml
  text: And Jeremiah wrote in a single scroll all the disaster that would come upon Babylon—all these words written against Babylon[a].
translation:
  language: zh_hans
  text: 耶利米把将要临到巴比伦的一切灾祸，就是这一切针对巴比伦写下的话，都写在一卷书上[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “针对巴比伦”也可译作“论到巴比伦”。原文介词表示这些先知话语所指的方向或对象；在本节审判语境中，也含有不利于巴比伦的意味。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּכְתֹּב
  choice: 写在
  rationale: 这是כתב的叙事性未完成式连续形式，表示耶利米把内容写入书卷；结合后面的介词结构，译作“写在……上”符合现代汉语。
- source_word: אֵת כָּל הָרָעָה
  choice: 一切灾祸
  rationale: רָעָה在先知宣告审判的语境中指将临到的灾难、祸患，而非道德意义上的“邪恶”；“灾祸”庄重且自然。
- source_word: אֲשֶׁר תָּבוֹא אֶל בָּבֶל
  choice: 将要临到巴比伦
  rationale: בוא与אֶל本义为“来到、向着”，这里描述审判造成的不利后果；“临到”既保留方向感，也符合汉语先知文学表达。
- source_word: אֶל סֵפֶר אֶחָד
  choice: 在一个书卷上
  rationale: סֵפֶר在此历史背景下指供书写的卷轴或文书；“书卷”比现代意义的“书”更准确。אֶחָד按字面保留为“一个”。
- source_word: אֵת כָּל הַדְּבָרִים הָאֵלֶּה
  choice: 这一切……话
  rationale: דְּבָרִים在这里指前文关于巴比伦的先知话语；译作“话”保留文本与宣告的重点。
- source_word: הַכְּתֻבִים
  choice: 写下的
  rationale: 这是כתב的被动分词，修饰“话”；汉语用“写下的”自然表达其已被书写的性质。
- source_word: אֶל בָּבֶל
  choice: 针对巴比伦
  rationale: 介词אֶל可表示方向或指向；鉴于上下文是对巴比伦的审判宣告，“针对”传达话语所指及其不利性质，同时以脚注保留较宽泛的理解。
theological_decisions:
- issue: 末句אֶל־בָּבֶל是否明确表示敌对含义
  choice: 正文译作“针对巴比伦”
  alternative: “论到巴比伦”或“关于巴比伦”
  rationale: 上下文中的话语宣告巴比伦所受的灾祸，因此具有明显的审判指向；但介词本身并不必然等于“攻击”，故不把敌对含义绝对化，并在脚注保留较宽的译法。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“也就是”明确后半句与“一切灾祸”之间的解释关系；保留“书卷”以符合古代书写媒介。脚注标记置于整句末尾，说明末句介词的语义幅度。
