base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/042.yaml
  text: The sea has come up against Babylon[b][a]; she is covered with the multitude of its waves.
translation:
  language: zh_hans
  text: 海水涌上巴比伦[a]；她被众多的波浪淹没了。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里的“海水”是比喻，描绘一种势不可挡、涌向巴比伦的力量；正文保留原文意象，没有直接解释为敌军。
    reason: cultural_note
  - marker: b
    text: “众多的波浪”也可译作“波涛的轰鸣”或“波涛的喧嚣”；原词既可表示众多，也可表示喧嚣、轰鸣。
    reason: lexical_alternative
lexical_decisions:
- source_word: עָלָה עַל
  choice: 涌来，淹向
  rationale: עלה描写水势上升、涌来；על在此表示冲向并压过目标。译文保留动态与敌对意味，同时符合现代汉语对洪水的自然表达。
- source_word: בָּבֶל
  choice: 巴比伦
  rationale: 采用该地名的现代汉语标准译名。
- source_word: הַיָּם
  choice: 海水
  rationale: 原文有定冠词，直指“海”；汉语用“海水”作涌来、淹没的主语更自然，并保留原文的海洋意象，不把它直接解释为军队。
- source_word: בַּהֲמוֹן
  choice: 汹涌的
  rationale: המון可表示众多、喧嚣或轰鸣。与波涛连用时，“汹涌”可兼顾声势浩大和数量众多的意象，而不将词义限于其中一面。
- source_word: גַּלָּיו
  choice: 波涛
  rationale: גל指波浪，三单阳性后缀回指“海”。汉语“波涛”适合宏大的审判图景；所属关系在本句中不言自明，无须生硬译出“它的”。
- source_word: נִכְסָתָה
  choice: 她被……淹没了
  rationale: 该词为כסָה的Niphal完成式阴性单数，表示巴比伦已被覆盖。以“她”承接城市的阴性拟人，并用“淹没”切合波涛意象和完成状态。
theological_decisions:
- issue: “海”的所指
  choice: 正文保留“海水”的比喻意象
  alternative: 直接译作压倒巴比伦的敌军
  rationale: 上下文可能借海潮描绘来袭的强大势力，但本节原文本身没有明说敌军；保留比喻可避免把解释写入正文。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。分号保留希伯来诗句的两分结构；“她”维持巴比伦城的拟人表达。脚注标记均置于正文中，且紧随相关意象或分句。
