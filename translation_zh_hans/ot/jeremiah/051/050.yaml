id: JER.51.50
reference: Jeremiah 51:50
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: פְּלֵטִ֣ים מֵ/חֶ֔רֶב הִלְכ֖וּ אַֽל תַּעֲמֹ֑דוּ זִכְר֤וּ מֵֽ/רָחוֹק֙ אֶת יְהוָ֔ה וִ/ירֽוּשָׁלִַ֖ם תַּעֲלֶ֥ה עַל לְבַבְ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/050.yaml
  text: You who have escaped the sword[a], go; do not stand still. Remember Yahweh from far away, and let Jerusalem come upon your heart.
translation:
  language: zh_hans
  text: 你们这些逃过刀剑的人，走吧，不要停留！你们要从远方记念雅威，让耶路撒冷浮上你们心头。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“让耶路撒冷升到你们心上”，意思是要在心里记念、牵挂耶路撒冷。
    reason: 说明原文隐喻及其含义，同时避免正文表达显得生硬。
lexical_decisions:
- source_word: פְּלֵטִים מֵחֶרֶב
  choice: 你们这些逃过刀剑的人
  rationale: פְּלֵטִים是复数被动分词，在此作呼语；与מֵחֶרֶב连用，指从刀剑和战争杀戮中逃生的人。此译明确表达直接称呼，也符合现代汉语习惯。
- source_word: הִלְכוּ אַל תַּעֲמֹדוּ
  choice: 走吧，不要停留
  rationale: 两个复数命令式要求幸存者继续离开，不可站住或逗留。“停留”比字面的“站立”更清楚地传达语境中的实际含义。
- source_word: זִכְרוּ מֵרָחוֹק אֶת יְהוָה
  choice: 要从远方记念雅威
  rationale: 按希伯来语词序，将“从远方”与“记念”相连，保留身处远地仍记念神的空间意味。“记念”兼具内心回想和盟约性的语感。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以“雅威”音译四字神名，表明这里使用的是神的专名，而非一般称号。
- source_word: וִירוּשָׁלִַם תַּעֲלֶה עַל לְבַבְכֶם
  choice: 让耶路撒冷浮上你们心头
  rationale: 原文直译为“让耶路撒冷升到你们心上”。“浮上心头”保留“上升”的意象，同时以自然现代汉语表达内心的记挂和关切。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；音译“雅威”保留其作为以色列之神盟约专名的性质，不以称号代替。
- issue: “耶路撒冷升到心上”的含义
  choice: 让耶路撒冷浮上你们心头
  alternative: 要把耶路撒冷放在心上；要想起耶路撒冷
  rationale: 选择保留原文“上升”的隐喻，同时不把其中可能包含的记念、挂怀和关切缩减为单一心理动作。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“走吧，不要停留”保持命令的紧迫感；“浮上你们心头”既自然，又保留希伯来语的上升意象。
