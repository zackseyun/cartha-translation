base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/037.yaml
  text: And Babylon will become heaps[a], a haunt of jackals, a horror and a hissing[c][b], with no inhabitant.
translation:
  language: zh_hans
  text: 巴比伦必变成一堆堆废墟[a]，成为胡狼出没之地[b]，令人惊骇，受人嗤笑[c]，没有人居住。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“一堆堆土石”；原文名词为复数。
    reason: lexical_alternative
  - marker: b
    text: 或译“野狗”；这里的希伯来词在描写荒凉之地时通常指胡狼。
    reason: lexical_alternative
  - marker: c
    text: 原文直译涉及“发嘘声”或“吹口哨”，指把它当作讥嘲的对象。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיְתָה
  choice: 必变成
  rationale: 连词加完成式用于先知性宣告，表达将来的结果；“变成”也保留从繁盛转为荒凉的动态。
- source_word: בָבֶל
  choice: 巴比伦
  rationale: 该地名在现代汉语圣经及一般用语中的标准译名。
- source_word: לְגַלִּים
  choice: 一堆堆废墟
  rationale: גַּלִּים是复数，指成堆的土石或废墟；此译既保留复数意象，也符合城邑毁坏的语境。
- source_word: מְעוֹן תַּנִּים
  choice: 胡狼出没之地
  rationale: מְעוֹן意为居所；在荒城被野兽占据的语境中，“出没之地”比中性的“住所”更自然。תַּנִּים在此类荒凉经文中通常指胡狼。
- source_word: שַׁמָּה
  choice: 令人惊骇
  rationale: 该词既可指毁灭的惨状，也可指这种惨状引起的惊骇；用结果性表达自然传达其意。
- source_word: וּשְׁרֵקָה
  choice: 受人嗤笑
  rationale: 字面涉及发嘘声或吹口哨，在先知性审判语境中表示遭人讥嘲；意译为“受人嗤笑”可清楚传达其社会含义。
- source_word: מֵאֵין יוֹשֵׁב
  choice: 没有人居住
  rationale: 直接表达完全没有居民，不额外加入“再也”等原文未明说的时间成分。
