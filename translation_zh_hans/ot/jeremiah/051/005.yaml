  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כִּ֠י לֹֽא אַלְמָ֨ן יִשְׂרָאֵ֤ל וִֽ/יהוּדָה֙ מֵֽ/אֱלֹהָ֔י/ו מֵֽ/יְהוָ֖ה צְבָא֑וֹת כִּ֤י אַרְצָ/ם֙ מָלְאָ֣ה אָשָׁ֔ם מִ/קְּד֖וֹשׁ יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/005.yaml
  text: For Israel and Judah are not widowed from their God[a], from Yahweh of Armies[b], though their land is full of guilt against the Holy One of Israel.
translation:
  language: zh_hans
  text: 因为以色列和犹大并未被他们的上帝[a]——万军之耶和华[b]——遗弃，如同丧偶者一样；尽管他们的国土在以色列的圣者面前充满罪责[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译作“并未与他们的上帝丧偶”。这是一个婚姻／丧偶的比喻，表示他们并未被上帝遗弃。
    reason: 保留 אַלְמָן 的丧偶意象，并说明正文为使现代汉语自然而作的表达。
  - marker: b
    text: “万军之耶和华”对应希伯来文的神圣称号；“万军”可指天上和地上的众军。
    reason: 说明神名称号及其语义范围，避免与正文重复地称为“传统译法”。
  - marker: c
    text: 或译：“充满得罪以色列的圣者的罪责。”这里的希伯来介词关系可有不止一种理解。
    reason: 保留 מִן 在此处可理解为“在……面前”或“得罪／针对”的真实歧义。
lexical_decisions:
- source_word: אַלְמָן
  choice: 丧偶
  rationale: 保留原文婚姻关系的比喻，表达以色列和犹大并未被他们的上帝撇弃；单译“被离弃”会削弱这一意象。
- source_word: מֵאֱלֹהָיו מֵיְהוָה צְבָאוֹת
  choice: 没有失去他们的上帝——万军之耶和华
  rationale: 重复的介词 מִן 与“丧偶”连用，表示分离。希伯来文代词形式为单数，但复合主语在现代汉语中自然译作“他们的”。“万军之耶和华”兼顾传统辨识度与 צְבָאוֹת 的军旅含义。
- source_word: כִּי（句首）
  choice: 因为
  rationale: 承接上文，为逃离巴比伦的呼吁说明理由。
- source_word: כִּי（第二处）
  choice: 尽管
  rationale: 在语境中作让步理解，凸显上帝持续的关系与百姓真实罪责之间的张力。
- source_word: אַרְצָם
  choice: 他们的国土
  rationale: 指以色列和犹大的地域；“国土”在此比泛指土地的“地”更清楚。
- source_word: מָלְאָה אָשָׁם
  choice: 满有罪责
  rationale: אָשָׁם 在此指罪咎、应负的罪责，而非赎愆祭或刑罚。
- source_word: מִקְּדוֹשׁ יִשְׂרָאֵל
  choice: 在以色列的圣者面前
  rationale: 介词 מִן 此处关系较含混，可表达相对于或针对圣者的罪责；正文用“在……面前”呈现问责关系，并以脚注保留“得罪”的可能。
- source_word: קְדוֹשׁ יִשְׂרָאֵל
  choice: 以色列的圣者
  rationale: 保留这一固定的先知性神圣称号，措辞简洁庄重。
theological_decisions:
- issue: 第二个 כִּי 是让步还是因果
  choice: 让步：“尽管他们的国土……满有罪责”
  alternative: 因果：“因为他们的国土……满有罪责”
  rationale: 因果译法容易使罪责听起来成了他们没有丧偶的原因；让步译法更自然地保留上帝信实与人有罪之间的张力。
- issue: מִקְּדוֹשׁ יִשְׂרָאֵל 的关系含义
  choice: 在以色列的圣者面前
  alternative: 得罪以色列的圣者／因以色列的圣者而有罪责
  rationale: 原介词的具体关系并不完全明确，正文避免把敌对指向说得过死，脚注保留更直接的“得罪”理解。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“丧偶”刻意保留原文鲜明的婚姻比喻，随后以“没有失去”帮助读者理解。神名译作“耶和华”，称号采用汉语圣经传统中辨识度较高的“万军之耶和华”。
