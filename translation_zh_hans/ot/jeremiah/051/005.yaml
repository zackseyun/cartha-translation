revisions:
- from: 因为以色列和犹大并没有丧偶，没有失去他们的上帝[a]——万军之耶和华[b]；尽管他们的国土在以色列的圣者面前满有罪责[c]。
  to: 因为以色列和犹大并未被他们的上帝[a]——万军之耶和华[b]——遗弃，如同丧偶者一样；尽管他们的国土在以色列的圣者面前充满罪责[c]。
  rationale: 修订只处理汉语表达与脚注一致性：以“未被……遗弃，如同丧偶者一样”传达原文未与神分离的婚姻比喻，避免“丧偶”在汉语中暗示上帝死亡；保留让步关系、国土的罪责，以及“在以色列的圣者面前”这一不强加单一介词解释的译法。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T07:31:32Z'
review_pass:
  verdict: revise
  source_fidelity: 译文正确把第二个 כִּי 处理为让步，也保留了“以色列的圣者”及介词关系的歧义。不过，“并没有丧偶”在现代汉语通常明确指配偶死亡；用于上帝时容易造成不必要且不符合原文重点的联想，并且与后面的“没有失去他们的上帝”重复而不自然。
  naturalness: “以色列和犹大并没有丧偶，没有失去他们的上帝”搭配生硬，且“丧偶”的常规用法不适合直接套在复合民族主语上。改为“并未被……遗弃，如同丧偶者一样”能保留婚姻／丧偶意象，同时清楚表达原文“没有与其神分离”的比喻意义。
  terminology: “万军之耶和华”“以色列的圣者”均庄重、通行且忠实。“罪责”可保留；“在……面前”对 מִן 的关系性理解较为克制，脚注应继续列出“得罪／敌对”的可能。
  issues:
  - severity: medium
    issue: “并没有丧偶”被直接用于以色列和犹大，并紧接“没有失去他们的上帝”。
    rationale: 汉语“丧偶”通常意味着配偶死亡，容易将比喻误解为上帝死亡；同时该结构语义重复且不符合现代普通话的自然表达。应在正文以“未被遗弃”表达关系未断，并以“如同丧偶者一样”保留原文的比喻。
  - severity: low
    issue: 脚注 b 称“传统译法作‘万军之耶和华’”，但正文已经正是此译法。
    rationale: 这会使脚注显得重复。可改为简要说明此称号所对应的希伯来文及“万军”的语义范围。
