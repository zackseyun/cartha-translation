base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/031.yaml
  text: Runner runs to meet runner[a], and messenger to meet messenger[b], to tell the king of Babylon that his city has been captured from end to end.
translation:
  language: zh_hans
  text: 一名信使跑去迎接另一名信使[a]，传信者也去迎接传信者，要向巴比伦王报告：他的城已从一端被攻占了[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或较直译：“跑者跑去迎接跑者。”希伯来文把“跑者”与同根的“奔跑”动词连用，并重复有关称谓，营造急报接连而至的紧迫感；此处“跑者”可指急行传递消息的人。
    reason: lexical_alternative
  - marker: b
    text: 或译“他的城已经从这一头到那一头全被攻占了”。希伯来文直译为“从一端”，可能指攻占从城的一端开始；结合上下文，也可能表示全城各处都已陷落。
    reason: lexical_alternative
lexical_decisions:
- source_word: רָץ / יָרוּץ
  choice: 跑信的……奔来
  rationale: רָץ可指奔跑传信的人，יַרוּץ则明确表达“奔跑”。译文保留同根词形成的重复，以呈现消息接连急报的紧迫场面。
- source_word: לִקְרַאת
  choice: 迎着
  rationale: 该表达指朝向某人而去、与之相遇；“迎着”既保留方向感，也适合这里两名传信者相继相逢的画面。
- source_word: וּמַגִּיד ... מַגִּיד
  choice: 报信的也迎着报信的而来
  rationale: מַגִּיד指传报消息的人。“报信的”比“宣告者”自然，并保留原文重复及第二分句省略奔跑动词的结构。
- source_word: לְהַגִּיד
  choice: 要告诉
  rationale: 不定式说明这些人前来的目的；“要告诉”是现代汉语中自然清楚的表达。
- source_word: לְמֶלֶךְ בָּבֶל
  choice: 巴比伦王
  rationale: 直接表达属格关系，符合现代汉语惯用称谓。
- source_word: נִלְכְּדָה
  choice: 已……被攻陷了
  rationale: לכד的尼斐尔式表示城被夺取、被攻占；“被攻陷”贴合城市陷落的军事语境，并表达动作已经完成。
- source_word: עִירוֹ
  choice: 他的城
  rationale: 保留原文第三人称单数所属后缀，不擅自明确为“都城”或改作泛称。
- source_word: מִקָּצֶה
  choice: 从一端
  rationale: 原文单数קָצֶה直指一个边端。“从一端”保留其形式与可能的空间起点含义；上下文所暗示的全城陷落则列入脚注，避免在正文中消除歧义。
