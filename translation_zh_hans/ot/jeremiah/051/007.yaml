  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כּוֹס זָהָ֤ב בָּבֶל֙ בְּ/יַד יְהוָ֔ה מְשַׁכֶּ֖רֶת כָּל הָ/אָ֑רֶץ מִ/יֵּינָ/הּ֙ שָׁת֣וּ גוֹיִ֔ם עַל כֵּ֖ן יִתְהֹלְל֥וּ גוֹיִֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/007.yaml
  text: Babylon was a golden cup in the hand of Yahweh[a], making all the earth drunk. Nations drank from her wine[b]; therefore the nations have gone mad.
translation:
  language: zh_hans
  text: 巴比伦是雅威[a]手中的金杯，使全地喝醉。列国喝了她的酒，因此列国都发狂了[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “雅威”是希伯来神名 יהוה（YHWH）的音译；传统上也译作“耶和华”，或以“主”代称。
    reason: alternative_reading
  - marker: b
    text: 也可译作“行为狂乱”或“被弄得发狂”。这里的希伯来语动词在醉酒的语境中很可能指疯狂、失常。
    reason: lexical_alternative
lexical_decisions:
- source_word: כּוֹס זָהָב
  choice: 金杯
  rationale: 直译为“金杯”，自然保留巴比伦作为贵重而致醉之器皿的比喻。
- source_word: בָּבֶל
  choice: 巴比伦
  rationale: 采用现代汉语中通行的地名译法。
- source_word: בְּיַד יְהוָה
  choice: 雅威手中的
  rationale: “在……手中”既表达掌有，也暗示被用作工具；此处保留原文意象，不另加解释。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来神名 YHWH 的常见拟音译出专名，而不以称号代替。
- source_word: מְשַׁכֶּרֶת
  choice: 使……喝醉
  rationale: 该分词表达持续的使役作用；“使全地喝醉”清楚保留上下文中的醉酒隐喻。
- source_word: כָּל הָאָרֶץ
  choice: 全地
  rationale: 后文提到列国，语境范围广于一片特定土地；“全地”简洁贴近原文。
- source_word: מִיֵּינָהּ
  choice: 她的酒
  rationale: 阴性后缀指回拟人化的巴比伦；汉语“喝了她的酒”已自然表达希伯来语介词 מִן 所指的取饮来源。
- source_word: שָׁתוּ גוֹיִם
  choice: 列国喝了
  rationale: “列国”符合先知文学语体，也保留复数民族实体的含义。
- source_word: עַל כֵּן
  choice: 因此
  rationale: 准确表达前因后果，语言简明庄重。
- source_word: יִתְהֹלְלוּ
  choice: 发狂了
  rationale: 在饮酒致醉的语境中，该 Hitpolel 形式最可能表示狂乱、失常；“发狂了”保留结果意味，同时以脚注呈现可能的语态和行为侧重。
- source_word: גוֹיִם
  choice: 列国
  rationale: 与前一处保持一致，清楚表明仍指那些饮酒的列国。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名 YHWH；正文以“雅威”音译，保留其作为专名的性质，脚注说明原文形式。
- issue: 巴比伦醉酒隐喻中的主权与工具性
  choice: 保留“雅威手中的金杯”及其使全地喝醉的意象
  alternative: 解释性译为巴比伦是雅威施行审判的工具
  rationale: 原文既将巴比伦置于雅威手中，又说她使全地喝醉；译文保留双方层面，不把隐喻扩写成特定神学解释。
- issue: יִתְהֹלְלוּ 所表达的狂乱
  choice: 发狂了
  alternative: 行为狂乱；被弄得发狂
  rationale: 原文形态与语境可容纳状态、行为或受影响后的结果等侧重；正文采用自然的结果表达，脚注保留这些真实可能性。
translation_notes:
  register: 采用现代、庄重而易懂的普通话书面语。“金杯”“全地”“列国”保留先知文学的凝练意象；“喝醉”“发狂”则避免生僻措辞，使因果关系直接清楚。所有脚注标记均已置于正文相应位置。
