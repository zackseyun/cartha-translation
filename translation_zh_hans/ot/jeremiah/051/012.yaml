language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: אֶל חוֹמֹ֨ת בָּבֶ֜ל שְׂאוּ נֵ֗ס הַחֲזִ֨יקוּ֙ הַ/מִּשְׁמָ֔ר הָקִ֨ימוּ֙ שֹֽׁמְרִ֔ים הָכִ֖ינוּ הָ/אֹֽרְבִ֑ים כִּ֚י גַּם זָמַ֣ם יְהוָ֔ה גַּם עָשָׂ֕ה אֵ֥ת אֲשֶׁר דִּבֶּ֖ר אֶל יֹשְׁבֵ֥י בָבֶֽל־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/012.yaml
  text: Against the walls of Babylon[a], lift up a signal; strengthen the watch; station watchmen; prepare the ambushes[c][b]. For Yahweh has both planned and done what he spoke against the inhabitants of Babylon.
translation:
  language: zh_hans
  text: 向巴比伦的城墙竖起军旗[a]！加强警戒，部署守卫，预备伏兵[b]！因为雅威既已定意，也已成就他对巴比伦居民所说的话[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“竖起信号旗”或“举起旗号”。希伯来语נֵס指高举起来、供人看见的旗帜或军事信号。
    reason: lexical_alternative
  - marker: b
    text: 或译“布置伏击”。希伯来语可指埋伏的人，也可指伏击的部署或地点。
    reason: lexical_alternative
  - marker: c
    text: 原文直译为“他向巴比伦居民所说的话”；从上下文看，这是向他们宣告的审判之言。
    reason: contextual_clarification
lexical_decisions:
- source_word: אֶל חוֹמֹת בָּבֶל
  choice: 向巴比伦的城墙
  rationale: אֶל的基本方向义是“向、朝着”；本节处于军事语境，中文“向……城墙”既保留原文的方向性，也自然带出进攻态势，不把敌对含义直接写死。
- source_word: שְׂאוּ נֵס
  choice: 竖起军旗
  rationale: נֵס指高举、可见的旗帜或信号，常用于军事集结或传令。“军旗”在本节语境中清楚自然；脚注保留“信号旗”等可能表达。
- source_word: הַחֲזִיקוּ הַמִּשְׁמָר
  choice: 加强警戒
  rationale: חזק的使役式表达加强、巩固，מִשְׁמָר可指警戒或守卫任务。“加强警戒”符合连续军事命令的语体。
- source_word: הָקִימוּ שֹׁמְרִים
  choice: 部署守卫
  rationale: קום的使役式在此意为设立、安置，שֹׁמְרִים是看守者。“部署守卫”准确表达把守卫安置到岗位上的动作。
- source_word: הָכִינוּ הָאֹרְבִים
  choice: 预备伏兵
  rationale: אֹרְבִים形式上可指埋伏的人，也可在语境中指伏击部署；正文采用自然且贴近参与者意义的“伏兵”，脚注注明另一可能。
- source_word: כִּי גַּם זָמַם יְהוָה גַּם עָשָׂה
  choice: 因为雅威既已定意，也已成就
  rationale: 重复的גַּם形成“既……也……”结构；זמם表示筹划、定意，עשה在这里表示付诸实行、成就。译文保留神的计划与执行两方面。
- source_word: אֵת אֲשֶׁר דִּבֶּר אֶל יֹשְׁבֵי בָבֶל
  choice: 他对巴比伦居民所说的话
  rationale: 原文介词אֶל通常是“对、向”；正文保留其表层方向义，不直接改成“攻击、针对”，而由审判语境显明其不利含义。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常用音译“雅威”呈现四字神名，区别于称号“主”，并保持庄重、可读。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文使用以色列神的专名，而非一般称号；正文采用较贴近YHWH传统读音的现代汉语音译“雅威”，不以“主”替代专名。
- issue: 雅威所说之话的方向
  choice: 对巴比伦居民所说的话
  alternative: 攻击巴比伦居民所说的话
  rationale: אֶל本身通常表示“向、对”，但上下文表明这是审判之言。正文保留介词的真实宽度，让语境承担敌对含义；脚注予以说明，避免把解释无声写入正文。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。连续使用“竖起、加强、部署、预备”保留原文紧凑有力的军事命令节奏；后半句用“既……也……”对应两个גַּם，并以“定意／成就”呈现计划与实行之间的张力。
