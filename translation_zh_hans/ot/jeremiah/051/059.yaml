base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/059.yaml
  text: This is the word that Jeremiah the prophet commanded Seraiah son of Neriah[a], son of Mahseiah, when he went with Zedekiah king of Judah to Babylon, in the fourth year of his reign. Now Seraiah was the quartermaster.
translation:
  language: zh_hans
  text: 这是耶利米先知吩咐尼利亚的儿子西莱雅的话；尼利亚是玛西雅的儿子。当犹大王西底家在位第四年，西莱雅随西底家前往巴比伦时，耶利米吩咐了他。西莱雅是负责歇宿事务的官员[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “负责歇宿事务的官员”所译的希伯来语官衔十分罕见，确切职责不明。这个官衔可能指负责住宿、休息处或行程安排的官员；也有人译作“内廷总管”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַדָּבָר אֲשֶׁר צִוָּה
  choice: 吩咐……以下这话
  rationale: דָּבָר可指“话、事情、信息”，此处引出耶利米交付给西莱雅的内容；保留“话”与先知言语的联系。צוה语气较强，译为“吩咐”，比“嘱咐”更能体现命令或委派之意。
- source_word: שְׂרָיָה בֶן־נֵרִיָּה בֶּן־מַחְסֵיָה
  choice: 尼利亚的儿子、玛西雅的孙子西莱雅
  rationale: 第二个“儿子”在汉语谱系表达中自然译为“孙子”，既明确代际关系，也避免误读为西莱雅有两个父亲。
- source_word: בְּלֶכְתּוֹ אֶת־צִדְקִיָּהוּ
  choice: 西莱雅随西底家前往
  rationale: בְּלֶכְתּוֹ表示“当他去时”；此处אֶת作伴随标记，因此译作“随……前往”，而非直接宾语。
- source_word: בִּשְׁנַת הָרְבִעִית לְמָלְכוֹ
  choice: 西底家在位第四年
  rationale: 采用现代汉语常见的君王纪年表达；“他”所指为西底家，明说姓名可避免歧义。
- source_word: שַׂר מְנוּחָה
  choice: 掌管沿途住宿的官员
  rationale: 这是罕见且含义不确定的官衔。שַׂר指官员，מְנוּחָה与休息、歇宿之处有关；结合出行情境，此译法清楚表达较可能的职责，同时借脚注保留不确定性。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。谱系按汉语习惯表达为“儿子、孙子”；难解官衔不以生僻的单一对应词强行定论，而在正文给出可理解的职责性译法，并用脚注保留原文的不确定性。
