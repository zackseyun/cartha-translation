  terminology: 人名“耶利米、尼利亚、玛西雅、西莱雅、西底家、巴比伦”均可保留。שַׂר מְנוּחָה为罕见且意义未定的官衔，正文宜使用较宽泛的“负责歇宿事务的官员”，并在脚注说明其不确定性及其他可能理解，避免把“沿途”或具体职责当作定论。
