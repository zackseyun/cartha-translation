revisions:
- from: 先知耶利米吩咐尼利亚的儿子、玛西雅的孙子西莱雅以下这话：犹大王西底家在位第四年，西莱雅随西底家前往巴比伦。西莱雅是掌管沿途住宿的官员[a]。
  to: 这是耶利米先知吩咐尼利亚的儿子西莱雅的话；尼利亚是玛西雅的儿子。当犹大王西底家在位第四年，西莱雅随西底家前往巴比伦时，耶利米吩咐了他。西莱雅是负责歇宿事务的官员[a]。
  rationale: 修订恢复了原文以“这话”引介耶利米吩咐的句法关系，将时间状语和随行信息连贯地置于同一从句，并以自然中文明确两代谱系。对罕见官衔采用保留性较强的职责译法，脚注保留词义与传统译法的不确定性。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T07:29:41Z'
