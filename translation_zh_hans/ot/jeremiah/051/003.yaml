source:
  edition: WLC
  text: אֶֽל יִדְרֹ֤ךְ ידרך הַ/דֹּרֵךְ֙ קַשְׁתּ֔/וֹ וְ/אֶל יִתְעַ֖ל בְּ/סִרְיֹנ֑/וֹ וְ/אַֽל תַּחְמְלוּ֙ אֶל בַּ֣חֻרֶ֔י/הָ הַחֲרִ֖ימוּ כָּל צְבָאָֽ/הּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/003.yaml
  text: Let not the archer bend his bow[a], and let him not rise up in his armor. Do not spare her young men[c][b]; devote all her army to destruction.
translation:
  language: zh_hans
  text: 弓箭手不要张弓[a]，也不要披甲挺身而起[b]。不要怜惜她的年轻人；要使她的全军归于毁灭[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节开头的希伯来语文本重复且句法困难。马所拉文本前两处作“向着／攻击”（而非“不要”），表面可理解为：“拉弓的要攻击拉弓的人。”正文按古代译本所反映的禁令读法译为“不要张弓”。“张弓”也可译作“拉开弓”。
    reason: 文本与译法异读
  - marker: b
    text: “铠甲”也可译作“锁子甲”或“胸甲”。若按马所拉文本前两处“攻击”的表面读法，本句可理解为攻击那披甲挺身而起的人。
    reason: 词义及句法异读
  - marker: c
    text: “归于毁灭”所译的希伯来语指将人或物置于禁令之下，在神圣审判中归于毁灭；也可译作“彻底消灭”。
    reason: 关键神学词语说明
lexical_decisions:
- source_word: אֶל / וְאֶל / וְאַל
  choice: 不要／也不要／不要
  rationale: 前两处的马所拉读法字面可作“向着／攻击”，但本句措辞重复且文本困难；结合若干文本见证和上下文，正文按禁令理解。末一处 וְאַל 明确表示禁止。异读保留在脚注中。
- source_word: יִדְרֹךְ ... הַדֹּרֵךְ קַשְׁתּוֹ
  choice: 弓箭手……拉开他的弓
  rationale: דרך 与“弓”连用，指拉弓、张弓。译作“拉开弓”是现代汉语中自然清楚的军事表达；“弓箭手”表达分词所指的人。
- source_word: יִתְעַל
  choice: 挺身而起
  rationale: 该词在这里表示抬起自己、起身或迎战；“挺身而起”保留动作意象，并适合军事语境而不过度限定。
- source_word: בְּסִרְיֹנוֹ
  choice: 穿着铠甲
  rationale: סִרְיוֹן 指护身甲胄，可能特指锁子甲或胸甲；“铠甲”在现代汉语中清楚而庄重，同时不作过细判断。
- source_word: תַּחְמְלוּ
  choice: 怜惜
  rationale: חמל 可指怜悯或因怜悯而饶过。在战争审判语境中，“怜惜”兼顾内在怜悯与不忍杀灭的实际含义。
- source_word: בַּחֻרֶיהָ
  choice: 她的年轻人
  rationale: בָּחוּר 通常指年轻力壮的男子，语境暗含适合作战，但原词并不必然等同“战士”，故保留较直接的译法。
- source_word: הַחֲרִימוּ
  choice: 献作毁灭之物
  rationale: חרם 的使役形表示将人或物置于禁令之下、献出以毁灭。此译法保留其不只是一般“消灭”的礼仪和审判色彩，脚注进一步说明。
- source_word: כָּל צְבָאָהּ
  choice: 她的全军
  rationale: צָבָא 在此指军队或全部军事力量；“全军”简洁自然，并保持集合意义。
theological_decisions:
- issue: 审判宣告中 חרם 的译法
  choice: 把她的全军都献作毁灭之物
  alternative: 把她的全军尽都消灭／把她的全军置于禁令之下
  rationale: 正文保留该词“被分别出来而毁灭”的特殊分量，又不额外说明献给谁或引入经文未明说的教义；脚注解释其在神圣审判语境中的用法。
- issue: 本节开头究竟是禁令还是向敌人进攻的命令
  choice: 正文按禁令译出
  alternative: “拉弓的要向拉弓的人拉弓；要攻击那穿着铠甲挺身而起的人”一类译法
  rationale: 马所拉辅音和元音传统容许把 אֶל 理解为“向着／攻击”，但句首重复、句法异常；若干文本见证及上下文支持 אַל“不要”的理解。正文采用较连贯的禁令读法，同时在脚注中明确保留马所拉文本的另一可能，不消除真实的文本张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“拉开他的弓”“穿着铠甲挺身而起”保留军事画面；“献作毁灭之物”刻意略显郑重，以承载 חרם 的专门含义，并由脚注帮助普通读者理解。所有脚注标记均置于正文相应词句之后。
