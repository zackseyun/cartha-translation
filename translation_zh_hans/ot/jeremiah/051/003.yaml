review_pass:
  verdict: revise
  source_fidelity: 正文采用将开头两处 אֶל 按否定词（אַל）的理解，与后文明确的 וְאַל 构成三重禁令；这是一种有文本依据但非马所拉元音传统唯一所指的处理。必须以脚注保留：马所拉文本前两处写作/读作通常表示“向着、攻击”的 אֶל，因此也可理解为向敌方弓手和披甲者发动攻击。末句 הַחֲרִימוּ 应保留“交付于毁灭／置于禁令下”的特殊审判语义，而不宜译成含混且不自然的“献作毁灭之物”。
  naturalness: “拉开他的弓”尚可，但“让他穿着铠甲挺身而起”在现代汉语中主语和使役关系不清。“弓箭手不可张弓，也不可披甲挺立”更简洁自然。 “交付毁灭”在庄重的审判语境中比“献作毁灭之物”更合乎现代汉语。
  terminology: 将 סִרְיוֹן 译为“铠甲”合适；בַּחוּרִים 译为“青年人”可保留原词的年龄含义。对 חרם 采用“交付毁灭”，并在脚注说明“置于禁令之下”，既保留关键词，也不把经文未明说的献奉对象加入正文。
  issues:
  - severity: medium
    issue: 脚注[a]错误地称“马所拉文本也可译作……即命令进攻敌方弓箭手；正文按另一种古老读法理解为禁令”。
    rationale: 马所拉文本前两处的 אֶל 确实通常可按“向着／攻击”理解，但禁令读法不应不加限定地说成“另一种古老读法”；这里涉及文本和语法争议。脚注应准确说明正文按将其理解为否定词的读法翻译，同时保留马所拉文本的可能理解。
  - severity: medium
    issue: “让他穿着铠甲挺身而起”造成不必要的使役歧义。
    rationale: 原文的动词是对同一战士的禁止/命令，并非“让某人”执行动作；改为“不可披甲挺立”可忠实而清楚地表达。
  - severity: medium
    issue: “献作毁灭之物”不够自然，并可能暗示原文未说明的献奉对象。
    rationale: חרם 的核心是交付于毁灭、置于禁令之下；“将……交付毁灭”保留其特殊审判含义且符合现代汉语。
  revised_text: 弓箭手不可张弓[a]，也不可披甲挺立[b]。不可怜惜她的青年人；要将她的全军交付毁灭[c]。
  revised_footnotes:
  - marker: a
    text: 本节开头的希伯来文本困难且有重复。正文将前两处“向着／攻击”的写法理解为否定词，故译作“不可”。按马所拉文本通常的理解，也可译作“拉弓的要向拉弓的人拉弓”，即向敌方弓箭手发动攻击。“张弓”也可译作“拉弓”。
    reason: 文本与译法异读
  - marker: b
    text: “铠甲”也可译作“锁子甲”或“胸甲”。若按脚注[a]所述的理解，本句可指攻击那披甲挺立的人。
    reason: 词义及句法异读
  - marker: c
    text: “交付毁灭”所译的希伯来语，指将人或物置于禁令之下，在神圣审判中交付毁灭；也可译作“彻底消灭”。
    reason: 关键神学词语说明
  revision_rationale: 修订消除了“让他……”的语法歧义，并以“交付毁灭”替换不自然、且可能误添献奉对象的“献作毁灭之物”。脚注重新表述开头的文本问题：既说明正文为何采用禁令，也不将该读法断言为确定的“古老读法”，并保留马所拉文本按介词理解时的攻击性译法。所有脚注标记均仍锚定于相应词句。
