source:
  edition: WLC
  text: כִּי֩ בָ֨א עָלֶ֤י/הָ עַל בָּבֶל֙ שׁוֹדֵ֔ד וְ/נִלְכְּדוּ֙ גִּבּוֹרֶ֔י/הָ חִתְּתָ֖ה קַשְּׁתוֹתָ֑/ם כִּ֣י אֵ֧ל גְּמֻל֛וֹת יְהוָ֖ה שַׁלֵּ֥ם יְשַׁלֵּֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/056.yaml
  text: For a destroyer has come against her[a], against Babylon, and her warriors have been captured; their bows are shattered. For Yahweh is a God of recompense[c][b]; he will surely repay.
translation:
  language: zh_hans
  text: 因为有毁灭者[a]来攻击她——巴比伦；她的勇士[b]被擒，他们的弓被折断了。因为雅威是施行报偿的上帝[c]，他必定报还。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“劫掠者”或“蹂躏者”。
    reason: lexical_alternative
  - marker: b
    text: 原文直译“有能力的人”；这里指巴比伦的战士。
    reason: lexical_alternative
  - marker: c
    text: 或译“报仇的上帝”。原文强调公正的回报或报应。
    reason: alternative_reading
lexical_decisions:
- source_word: שׁוֹדֵד
  choice: 毁灭者
  rationale: 该分词指实施毁坏或掠夺的人；在军事审判的语境中，“毁灭者”自然且不把含义局限于劫掠财物。
- source_word: בָא עָלֶיהָ עַל בָּבֶל
  choice: 上来攻击她，就是巴比伦
  rationale: 保留两个 עַל 所形成的强调和同位说明；“她”随后明确指巴比伦。中文以“就是”自然表达这一澄清关系。
- source_word: וְנִלְכְּדוּ
  choice: 被擒
  rationale: Niphal 形态表达被动，指在战争中被抓获；“被擒”简洁地保留了这一军事含义。
- source_word: גִּבּוֹרֶיהָ
  choice: 她的勇士
  rationale: 该词本义为有力量、英勇的人，在此具体指巴比伦的战士；“勇士”既保留原词色彩，也符合战场语境。
- source_word: חִתְּתָה קַשְּׁתוֹתָם
  choice: 他们的弓都折断了
  rationale: 动词表达打碎、折断；“折断”适合弓这一具体物件，“都”传达复数武器被彻底废除的画面。
- source_word: אֵל גְּמֻלוֹת
  choice: 施行报偿的上帝
  rationale: גְּמֻלוֹת 指按行为作出回报或报应。“施行报偿”保留公正偿还的含义，而不把它收窄为带情绪色彩的复仇。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以“雅威”音译四字神名，保留经文中的专有名，而不以称号替代。
- source_word: שַׁלֵּם יְשַׁלֵּם
  choice: 他必定报还
  rationale: 不定式绝对式与限定动词连用，加强动作的确定性；“必定”传达强调，“报还”与前面的“报偿”形成词义呼应。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；采用现代汉语中较贴近学术重构读音的“雅威”，保留其作为专名的性质。
- issue: אֵל גְּמֻלוֹת 所表达的神圣审判
  choice: 施行报偿的上帝
  alternative: 报仇的上帝
  rationale: 原词强调按行为回报、偿还，可以包含惩罚，却不必仅指情绪性的复仇；正文保留较宽广的司法与道德含义，脚注列出另一可能译法。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。用分号保留前半节同一战败场景的推进，以“因为”重复原文两个 כִּי 的因果结构；脚注标记均放在相关词语之后。
