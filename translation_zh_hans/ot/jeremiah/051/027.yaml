base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/027.yaml
  text: Raise a banner in the land[a]; blow a trumpet among the nations. Consecrate nations against her; summon against her the kingdoms of Ararat, Minni, and Ashkenaz. Appoint a marshal against her[d][c][b]; bring up horses like bristling locusts.
translation:
  language: zh_hans
  text: 你们要在境内竖起旗号[a]，在列国中吹响号角。要把列国分别为圣，来攻击她[b]；要召集亚拉腊、米尼和亚实基拿诸王国来攻击她。要派一名统帅攻击她[c]；调来战马，如同鬃毛竖立的蝗虫[d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “旗号”也可译作“旗帜”或“信号旗”；原词指竖起来供人看见、用于发出信号或召集众人的标志。
    reason: lexical_alternative
  - marker: b
    text: “把列国分别为圣”是战争用语，指把军队分别出来投入战斗，也可能含有为神圣战争作准备的意味。
    reason: cultural_note
  - marker: c
    text: “统帅”所译的希伯来词十分罕见，可能指某类官员、军官或征募官，确切职衔不能确定。
    reason: lexical_alternative
  - marker: d
    text: 原文这个形容蝗虫的说法罕见，也可理解为“毛茸茸的蝗虫”或“粗糙的蝗虫”。
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂאוּ נֵס בָּאָרֶץ
  choice: 在这地竖起旗号
  rationale: נֵס指公开竖起、用于传递信号或召集军队的旗号；בָּאָרֶץ在本节军事语境中取“在这地”，同时不把范围扩写为“全地”。
- source_word: תִּקְעוּ שׁוֹפָר בַּגּוֹיִם
  choice: 在列国中吹响号角
  rationale: שׁוֹפָר本指用于报警或召集的角；“吹响号角”既符合古代器物，也自然传达军事号令。
- source_word: קַדְּשׁוּ עָלֶיהָ גּוֹיִם
  choice: 把列国分别为圣，来攻击她
  rationale: קדשׁ在战争语境中仍带有使之成圣、分别出来执行战争使命的意味；保留“分别为圣”可避免把祭仪和神圣战争色彩淡化为一般的“预备”。
- source_word: הַשְׁמִיעוּ עָלֶיהָ מַמְלְכוֹת
  choice: 召集……诸国来攻击她
  rationale: שמע的使役式字面为“使听见、宣告”，在此引出受召参战的诸国；“召集”自然呈现其军事号召功能。
- source_word: מַמְלְכוֹת אֲרָרַט מִנִּי וְאַשְׁכְּנָז
  choice: 亚拉腊、米尼和亚实基拿诸国
  rationale: 按专名音译，并以“诸国”体现复数מַמְלְכוֹת及其与三个地域名称的结构关系。
- source_word: פִּקְדוּ עָלֶיהָ טִפְסָר
  choice: 派一名统帅攻击她
  rationale: פקד在这里表示委派或任命；罕见词טִפְסָר指某类官员，在军事上下文中译作“统帅”，其具体职衔的不确定性由脚注保留。
- source_word: הַעֲלוּ סוּס
  choice: 使战马上来
  rationale: עלה的使役式在调动军队的语境中指使马匹上前或进军；补出“战”字可明确这里不是一般运输用马，而不改变原句意象。
- source_word: כְּיֶלֶק סָמָר
  choice: 如同刚毛竖立的蝗虫
  rationale: יֶלֶק是一类蝗虫，סָמָר含粗糙、毛发竖立之意；译文保留罕见而鲜明的外观比喻，不将其简化为“成群的蝗虫”。
theological_decisions:
- issue: קדשׁ在战争命令中的神圣含义
  choice: 把列国分别为圣，来攻击她
  alternative: 预备列国攻击她
  rationale: 原文刻意使用通常与成圣、分别有关的动词；保留这一张力，让读者看见战争行动带有祭仪或神圣战争色彩，但不进一步断言这些列国自身在道德上圣洁。
translation_notes:
  register: 采用现代、庄重而清楚的命令句式，以连续的“要”呈现原文一连串复数祈使语气。“她”承接上下文所指的巴比伦，不在本节擅自补明。专名采用现代中文圣经中通行的译名；对神圣战争用语、罕见官职和蝗虫意象的歧义均以正文加脚注保留。
