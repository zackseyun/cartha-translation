source:
  edition: WLC
  text: כֹּֽה אָמַ֞ר יְהוָ֣ה צְבָא֗וֹת חֹ֠מוֹת בָּבֶ֤ל הָֽ/רְחָבָה֙ עַרְעֵ֣ר תִּתְעַרְעָ֔ר וּ/שְׁעָרֶ֥י/הָ הַ/גְּבֹהִ֖ים בָּ/אֵ֣שׁ יִצַּ֑תּוּ וְ/יִֽגְע֨וּ עַמִּ֧ים בְּ/דֵי רִ֛יק וּ/לְאֻמִּ֥ים בְּ/דֵי אֵ֖שׁ וְ/יָעֵֽפוּ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/058.yaml
  text: 'Thus says Yahweh of hosts: Babylon’s broad wall shall be utterly razed[a], and her high gates shall be burned with fire. Peoples labor for emptiness, and nations for the fire[b], and they grow weary.'
translation:
  language: zh_hans
  text: '万军之耶和华如此说：


    巴比伦宽阔的城墙必被彻底夷平[a]；

    她高大的城门必被火焚烧。


    众民为虚空劳碌；

    列国为火辛劳；

    他们便疲乏了。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “城墙”原文为复数，也可译作“巴比伦宽阔的城墙群”；这里可能集合性地指整套城防。“彻底夷平”表达原文加强语气下城墙被完全毁坏的意思。
    reason: 保留名词数及加强语气，并说明“夷平”是结合城墙语境所作的自然译法。
lexical_decisions:
- source_word: יְהוָה צְבָאוֹת
  choice: 万军之耶和华
  rationale: “耶和华”沿用现代汉语圣经传统中对神圣四字名的通行音译；“万军之”保留 צְבָאוֹת 的广义军旅意象，不限定为地上或天上的军队。
- source_word: חֹמוֹת בָּבֶל הָרְחָבָה
  choice: 巴比伦宽阔的城墙
  rationale: חֹמוֹת 在形态上是复数，但此处可集合性地指巴比伦的整套城防；汉语“城墙”自然容纳这一集合意义，而“宽阔”直接对应 הָרְחָבָה。
- source_word: עַרְעֵר תִּתְעַרְעָר
  choice: 必被彻底夷平
  rationale: 不定式绝对形与限定动词同用，强化动作；该词根有剥光、暴露之意，用于城墙时，“彻底夷平”自然表达其被拆毁至裸露无存的语境含义。
- source_word: שְׁעָרֶיהָ הַגְּבֹהִים
  choice: 她高大的城门
  rationale: 保留阴性单数后缀所体现的城市拟人，并以“高大的”自然表达城门的高度和宏伟。
- source_word: בָּאֵשׁ יִצַּתּוּ
  choice: 必被火焚烧
  rationale: 兼顾被动语态及“用火/在火中”的希伯来语搭配，措辞庄重而清楚。
- source_word: וְיִגְעוּ עַמִּים בְּדֵי רִיק
  choice: 众民劳碌，所得的尽是虚空
  rationale: יִגְעוּ 表示辛苦劳作；בְּדֵי רִיק 表明劳作只落得虚空无益的结果。补出“所得的”使汉语通顺，同时保留徒劳之义。
- source_word: וּלְאֻמִּים בְּדֵי אֵשׁ
  choice: 列国辛劳，所成的只归于火
  rationale: 保留与上一分句的诗歌平行，也保留原文省略而凝练的火焰意象：列国建造、劳作的成果最终成为火的对象。
- source_word: וְיָעֵפוּ
  choice: 他们都疲惫不堪
  rationale: 表达因持续劳碌而陷入疲乏的结果；“不堪”符合庄重而易懂的现代汉语。
theological_decisions:
- issue: 神圣四字名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: “耶和华”是简体中文圣经传统中最广为普通读者识别的专名形式，并明确保留其为专有名；“雅威”较接近学界常见的拟音，但在普通现代汉语教会语境中通行度较低。
- issue: בְּדֵי אֵשׁ 所表达的毁灭关系
  choice: 所成的只归于火
  alternative: 只为火劳碌
  rationale: 原文短语凝练且略有歧义，可指列国的劳作成果最终被火吞灭或成为火的燃料。正文避免把它具体化为“燃料”，脚注保留这一可能。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语，并以分行呈现原文的宣告与诗歌平行。保留“众民／列国”“虚空／火”的对应关系及巴比伦的阴性拟人；避免古奥虚词和宗派化术语。
