  naturalness: 修订后的措辞在现代标准汉语中清楚、庄重，并保留诗行的平行节奏。“为火劳碌”略带诗歌性，但在此预言体裁中自然且比补足“所成的”更忠实。
  terminology: “万军之耶和华”“巴比伦”“众民／列国”“虚空”等用语恰当，且避免了宗派化的解释。
