  text: נִשְׁבַּ֛ע יְהוָ֥ה צְבָא֖וֹת בְּ/נַפְשׁ֑/וֹ כִּ֣י אִם מִלֵּאתִ֤י/ךְ אָדָם֙ כַּ/יֶּ֔לֶק וְ/עָנ֥וּ עָלַ֖יִ/ךְ הֵידָֽד־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/014.yaml
  text: 'Yahweh of hosts has sworn by himself: Surely I will fill you with men[a], like locusts[c][b], and they will raise over you a shout.'
translation:
  language: zh_hans
  text: 万军之耶和华指着自己[a]起誓：“我必使你充满人，如同蝗虫[b]；他们必向你发出呐喊[c]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “指着自己”也可译作“指着自己的生命”。原文直译为“以他的生命”；在起誓用语中，指以自己为凭。
    reason: lexical_alternative
  - marker: b
    text: “蝗虫”也可译作“幼蝗”或“蝗群”；原词可指蝗虫的一种或某一生长阶段。
    reason: lexical_alternative
  - marker: c
    text: 这里的“呐喊”很可能是攻击巴比伦时的战吼或得胜欢呼。
    reason: cultural_note
lexical_decisions:
- source_word: נִשְׁבַּע
  choice: 起誓
  rationale: שׁבע 的尼法勒词干是常见的起誓表达；中文用“起誓”自然而庄重，并保留誓言已经确立、现今仍有效的语气。
- source_word: יְהוָה צְבָאוֹת
  choice: 万军之耶和华
  rationale: 保留神名“耶和华”，并以传统而易懂的“万军”表达 צְבָאוֹת 所涵盖的军事与天上众军意象。
- source_word: בְּנַפְשׁוֹ
  choice: 指着自己
  rationale: 原文直译为“指着他的 נפש”，在起誓套语中指以自己或自己的生命为凭；“指着自己”是自然的中文誓言表达。
- source_word: כִּי אִם
  choice: 必
  rationale: 在誓言语境中是强调确实性的断言，不宜译成条件句；“必”简洁体现誓言保证的确定性。
- source_word: מִלֵּאתִיךְ אָדָם
  choice: 使人遍满你
  rationale: מלא 的皮勒形式表达使某处充满；阴性单数宾语指巴比伦城。“人”保留 אָדָם 的集合意义，不额外限定其身份。
- source_word: כַּיֶּלֶק
  choice: 如同蝗虫
  rationale: יֶלֶק 可指某种蝗虫或其生长阶段；正文用现代读者清楚的“蝗虫”保留成群密布的比喻，较细的词义可能性收入脚注。
- source_word: וְעָנוּ עָלַיִךְ הֵידָד
  choice: 他们必向你发出呐喊
  rationale: ענה 在这里指发声、呼喊，הֵידָד 是响亮的喊声，可用于战争、得胜或收获场景；“呐喊”保留其响亮而未完全限定的性质，“向你”体现 עַל 的敌对指向。
theological_decisions:
- issue: 神自我起誓的表达
  choice: 万军之耶和华指着自己起誓
  alternative: 万军之耶和华指着自己的生命起誓
  rationale: בְּנַפְשׁוֹ 可按字面理解为“以自己的生命”，也可按希伯来誓言惯用语理解为“以自己”。正文采用自然且不过度解释的“指着自己”，没有引入额外教义，同时保留神亲自担保誓言的力度。
- issue: 呐喊的具体性质
  choice: 呐喊
  alternative: 战斗的呼喊／胜利的欢呼
  rationale: הֵידָד 的语义可涉及战斗、得胜或收获呼声。上下文很可能是攻击巴比伦时的战吼或胜利呼声，但正文保留原词的宽度，以脚注说明语境。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“万军之耶和华”延续汉语圣经语体中的神圣称号；其余句法尽量自然简洁。正文保留“蝗虫”和“呐喊”的词义宽度，不将可能的幼蝗阶段或战吼性质绝对化。
