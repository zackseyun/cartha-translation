source:
  edition: WLC
  text: כֹּ֚ה אָמַ֣ר יְהוָ֔ה הִנְ/נִי֙ מֵעִ֣יר עַל בָּבֶ֔ל וְ/אֶל יֹשְׁבֵ֖י לֵ֣ב קָמָ֑י ר֖וּחַ מַשְׁחִֽית־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/001.yaml
  text: 'Thus says Yahweh: Behold[a], I am stirring up against Babylon, and against the inhabitants of Leb-kamai[b], a destroying wind.'
translation:
  language: zh_hans
  text: '耶和华如此说：


    “看哪，我必兴起毁灭之风[b]，攻击巴比伦和住在立加米[a]的人。”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “立加米”很可能是以埃特巴什式字母替换密码构成的名称，指迦勒底（巴比伦）；也可按字面理解为“我仇敌的心”。
    reason: alternative_reading
  - marker: b
    text: “毁灭之风”也可译作“毁灭之灵”；原文这个词可表示“风”“灵”或“气息”。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的神圣名译法，明确保留原文专名的圣约色彩。
- source_word: הִנְנִי
  choice: 看哪，我必
  rationale: “看哪”保留先知宣告中唤起注意的庄重语气；结合后续分词所指的即将行动，用“我必”自然表达临近而确定的行动。
- source_word: מֵעִיר
  choice: 激起
  rationale: 使役分词在此指使某种审判力量发动起来；“激起”既可自然搭配“风”，也保留使之兴起、行动的含义。
- source_word: עַל
  choice: 攻击
  rationale: 在审判语境中，该介词表示敌对方向；中文用“攻击”清楚传达这种敌对作用。
- source_word: בָּבֶל
  choice: 巴比伦
  rationale: 采用该地名通行的现代中文译名。
- source_word: יֹשְׁבֵי
  choice: 住在……的人
  rationale: 直接表达分词的居住者含义，语言自然，并保留群体意义。
- source_word: לֵב קָמָי
  choice: 立加米
  rationale: 此语很可能是以字母倒置法暗指迦勒底的密码名称；正文音译可保留原文的隐语性质，直译可能则收入脚注。
- source_word: רוּחַ
  choice: 风
  rationale: 在巴比伦受审判的语境中，与“毁灭”连用时，“风”的灾难性意象最为自然；“灵”的词义可能性在脚注中保留。
- source_word: מַשְׁחִית
  choice: 毁灭之
  rationale: 该使役分词修饰“风”，强调其造成毁灭的作用；“毁灭之风”庄重、凝练，并保留主动施行毁灭的力量感。
theological_decisions:
- issue: רוּחַ在此应理解为自然界的“风”，还是较具人格或属灵含义的“灵”
  choice: 风
  alternative: 毁灭之灵
  rationale: 紧邻语境描述耶和华兴起审判巴比伦的力量，“毁灭之风”较切合先知性的灾难与审判意象；但原词确有“灵、风、气息”的语义范围，因此不排除“灵”的理解，并以脚注保存这项真实歧义。
- issue: לֵב קָמָי是密码地名还是普通名词短语
  choice: 作为密码名称音译为“立加米”
  alternative: 我敌对者的心脏／腹地
  rationale: 该表达通常被视为字母倒置密码，所指为迦勒底，与前面的巴比伦形成平行；正文保留其隐语形式，不把仍有争议的解释直接写入正文。
translation_notes:
  register: 采用庄重而清楚的现代标准普通话。“耶和华如此说”保留先知宣告的固定语体；“看哪”维持原文的强调功能。正文保留“立加米”的密码地名性质，并用脚注说明；第二个脚注标记紧接整句末尾，说明“风／灵”的词义歧义。
