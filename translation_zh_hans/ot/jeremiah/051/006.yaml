id: JER.51.6
reference: Jeremiah 51:6
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: נֻ֣סוּ מִ/תּ֣וֹךְ בָּבֶ֗ל וּ/מַלְּטוּ֙ אִ֣ישׁ נַפְשׁ֔/וֹ אַל תִּדַּ֖מּוּ בַּ/עֲוֺנָ֑/הּ כִּי֩ עֵ֨ת נְקָמָ֥ה הִיא֙ לַֽ/יהוָ֔ה גְּמ֕וּל ה֥וּא מְשַׁלֵּ֖ם לָֽ/הּ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/006.yaml
  text: Flee from the midst of Babylon[a], and let each man save his life. Do not be cut off in her iniquity, for this is the time of Yahweh's vengeance; he is repaying her what she deserves.
translation:
  language: zh_hans
  text: 你们要从巴比伦中逃走，各自救自己的性命！不要在她的罪孽中灭亡[a]，因为这是雅威施行报应的时候；他正在向她施行她所应得的报应。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“不要因她的罪孽而灭亡”，又或：“不要在她所受的刑罚中灭亡。”原文既可指卷入巴比伦的罪，也可指因她的罪而遭受审判。
    reason: 希伯来语 בַּעֲוֺנָהּ 中的 עָוֹן 可表示罪孽、罪责或罪所招致的刑罚；介词关系容许不止一种理解。
lexical_decisions:
- source_word: נֻסוּ מִתּוֹךְ בָּבֶל
  choice: 你们要从巴比伦中间逃走
  rationale: 复数命令式 נֻסוּ 表达紧迫的逃离命令；“从……中间”保留 תּוֹךְ 所描绘的从内部离开的意味。
- source_word: וּמַלְּטוּ אִישׁ נַפְשׁוֹ
  choice: 各自救自己的性命
  rationale: מלט 的使役式与 נֶפֶשׁ 构成保全性命的表达；אִישׁ 在这里具有逐一分配的作用，译为“各自”符合现代汉语。
- source_word: אַל תִּדַּמּוּ בַּעֲוֺנָהּ
  choice: 不要因她的罪孽而一同灭亡
  rationale: דמה 的尼פעל式在审判语境中指被毁灭；עָוֹן 可指罪孽、罪责或罪所招致的惩罚。正文采用自然汉语表达因巴比伦罪孽而遭受共同毁灭，并以脚注保留其他可能理解。
- source_word: עֵת נְקָמָה הִיא לַיהוָה
  choice: 这是雅威施行报应的时候
  rationale: נְקָמָה 在此表示上帝公义的追讨和惩治；לַיהוָה 表明这报应属于雅威并由他施行。用“施行报应”比“复仇”更能避免现代汉语中私怨报复的联想。
- source_word: גְּמוּל הוּא מְשַׁלֵּם לָהּ
  choice: 他正照她应得的报应她
  rationale: גְּמוּל 指按行为给予的回报，מְשַׁלֵּם 为分词，表达正在发生或迫近且确定的偿还行动；译文保留原文“报应/报应她”的修辞呼应。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名，译作“雅威”以保留其专名性质，不以称号替代。
- issue: נְקָמָה 的神学语气
  choice: 报应
  alternative: 复仇；惩罚
  rationale: 上下文强调按巴比伦所行施以公义回报。“报应”既保留追讨之义，也与后句 גְּמוּל 和 מְשַׁלֵּם 的偿还观念相连，避免将上帝的行动理解为出于私怨。
- issue: בַּעֲוֺנָהּ 中罪与审判的关系
  choice: 因她的罪孽而一同灭亡
  alternative: 陷在她的罪孽中而灭亡；在她所受的刑罚中灭亡
  rationale: 介词 בְּ 与 עָוֹן 的语义范围容许参与其罪、因其罪受审判以及陷入罪责等相互关联的理解。正文突出同受审判，同时借脚注保留原文的张力。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。以“各自”自然表达希伯来语分配式单数 אִישׁ；保留“从巴比伦中间”的空间意象。正文节奏紧迫，适合先知性警告；脚注承载无法在单一译文中完全呈现的词义歧义。
