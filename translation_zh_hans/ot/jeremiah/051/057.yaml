  text: וְ֠/הִשְׁכַּרְתִּי שָׂרֶ֨י/הָ וַ/חֲכָמֶ֜י/הָ פַּחוֹתֶ֤י/הָ וּ/סְגָנֶ֨י/הָ֙ וְ/גִבּוֹרֶ֔י/הָ וְ/יָשְׁנ֥וּ שְׁנַת עוֹלָ֖ם וְ/לֹ֣א יָקִ֑יצוּ נְאֻ֨ם הַ/מֶּ֔לֶךְ יְהוָ֥ה צְבָא֖וֹת שְׁמֽ/וֹ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/057.yaml
  text: And I will make her officials drunk—her wise men[a], her governors, her deputies, and her warriors—and they will sleep an everlasting sleep and not wake up, declares the King[b], whose name is Yahweh of Armies.
translation:
  language: zh_hans
  text: “我要使她的官长、智者、省长、属官和勇士都喝醉；他们必永远长眠，永不醒来。”这是王——万军之耶和华是他的名——的宣告。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִשְׁכַּרְתִּי
  choice: 我要使……喝醉
  rationale: 使役形明确表达“使其醉”，既保留施行审判的主动性，也符合现代汉语表达。
- source_word: שָׂרֶיהָ
  choice: 她的官长
  rationale: שׂר在此指巴比伦的统治阶层或高级官员；“官长”较“王子”宽泛，不误指王室子弟。
- source_word: חֲכָמֶיהָ
  choice: 她的智者
  rationale: 直译其“有智慧之人”的含义，并适合宫廷谋士或顾问的语境。
- source_word: פַּחוֹתֶיהָ
  choice: 省长
  rationale: פּחה指行政长官，常带地方或行省治理色彩；“省长”在帝国行政语境中清楚自然。
- source_word: סְגָנֶיהָ
  choice: 副官
  rationale: סגן指居次位的官员或统治者；“副官”体现其从属层级，并与前面的省长相区别。
- source_word: גִבּוֹרֶיהָ
  choice: 勇士
  rationale: 保留גבור所表达的勇猛、强悍及军事意味。
- source_word: וְיָשְׁנוּ שְׁנַת עוֹלָם
  choice: 他们必……永远沉睡
  rationale: 保留原文以睡眠喻死亡的意象，并表达עוֹלָם在此所具有的永久性。
- source_word: וְלֹא יָקִיצוּ
  choice: 长睡不醒
  rationale: 直接延续睡眠隐喻，以自然汉语表达“不会醒来”。
- source_word: נְאֻם
  choice: 这是……的宣告
  rationale: 体现先知宣告公式的权威语气，同时避免生硬逐词翻译。
- source_word: הַמֶּלֶךְ
  choice: 王
  rationale: 原文以定冠词标明称号，语境中指上帝；中文“王”已能表达这一神圣称号。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代简体中文圣经语境中最通行、最易辨识的上帝专名译法。
- source_word: צְבָאוֹת
  choice: 万军之
  rationale: “万军之耶和华”是中文中清楚且庄重的固定表达，传达天上和地上众军之统帅的称号。
theological_decisions:
- issue: יהוה这一神名的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 两者均用于表达四字神名；正文采用现代中文读者最熟悉的“耶和华”，不以“主”替代专名，也不借此裁定古代确切读音。
- issue: “永远沉睡”的含义
  choice: 保留死亡如沉睡的隐喻
  alternative: 他们必死亡，永不复起
  rationale: 原文说“睡永远之睡，不醒来”，正文不将其解释性改写为关于复活或灭绝的特定教义。
- issue: “王”的指称
  choice: 按神圣称号译作“王”
  alternative: 君王
  rationale: 紧接着的神名表明“王”指耶和华；保留简洁称号，不额外加入原文没有的神学限定语。
translation_notes:
  register: 采用现代、庄重而易懂的普通话书面语。以“就是”引出同位列举，说明官长所涵盖的各类领袖；“长睡不醒，永远沉睡”保留希伯来语睡眠与不醒的双重表达和诗性力度。
