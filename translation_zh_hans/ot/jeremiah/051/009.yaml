  text: רפאנו אֶת בָּבֶל֙ וְ/לֹ֣א נִרְפָּ֔תָה עִזְב֕וּ/הָ וְ/נֵלֵ֖ךְ אִ֣ישׁ לְ/אַרְצ֑/וֹ כִּֽי נָגַ֤ע אֶל הַ/שָּׁמַ֨יִם֙ מִשְׁפָּטָ֔/הּ וְ/נִשָּׂ֖א עַד שְׁחָקִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/009.yaml
  text: We tried to heal Babylon[a], but she was not healed. Leave her, and let each one go to his own land[c][b], for her judgment has reached to heaven and has been lifted up to the skies.
translation:
  language: zh_hans
  text: 我们曾医治巴比伦，她却没有痊愈。离开她吧！让我们各自回本国去，因为对她的判决[a]已经上达诸天，并被举到云霄[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “判决”也可译作“审判”或“刑罚”；原词兼有司法裁决和惩处的意味。
    reason: lexical_alternative
  - marker: b
    text: “云霄”所译的希伯来词可指高空或高处的云层。
    reason: cultural_note
lexical_decisions:
- source_word: רפאנו אֶת בָּבֶל
  choice: 我们曾医治巴比伦
  rationale: רפאנו是רפא的Qal完成式第一人称复数，直译为“我们医治了”。下句“她却没有治好”表明医治并未奏效；中文无需在动词中明加“试图”，仍能自然表达曾作医治的努力，并保留原文形式。
- source_word: וְלֹא נִרְפָּתָה
  choice: 她却没有治好
  rationale: נִרְפָּתָה是Niphal完成式阴性单数，表示“未被治愈/没有痊愈”。“没有治好”以自然现代汉语保留被动结果，并与前句“医治”呼应。
- source_word: עִזְבוּהָ
  choice: 离开她吧
  rationale: 复数命令式加阴性单数宾语后缀，指离开拟人化的巴比伦。“离开”比“遗弃”更贴合随后的归乡行动。
- source_word: וְנֵלֵךְ אִישׁ לְאַרְצוֹ
  choice: 让我们各自回本国去
  rationale: וְנֵלֵךְ是第一人称复数鼓励式，应保留“让我们……去”，不可改成第三人称命令。אִישׁ לְאַרְצוֹ字面为“各人到自己的国土”，具有逐一分配的意思；“各自回本国去”符合现代汉语，也表达归返各自故土。
- source_word: מִשְׁפָּטָהּ
  choice: 对她的判决
  rationale: מִשְׁפָּט可指审判、裁决或惩罚。此处用“对她的判决”明确阴性后缀指向巴比伦，同时保留司法含义，不把它直接限定为罪行或刑罚。
- source_word: נָגַע אֶל הַשָּׁמַיִם
  choice: 已经上达诸天
  rationale: נגע与אֶל连用表示达到、触及；“上达诸天”保留向天而升的意象，并与后句形成诗性平行。
- source_word: וְנִשָּׂא עַד שְׁחָקִים
  choice: 高入云霄
  rationale: נִשָּׂא是Niphal完成式，表示被举起或升高；שְׁחָקִים指高空、云层。“高入云霄”自然凝练，保存高度意象和完成后的状态。
theological_decisions:
- issue: 巴比伦的מִשְׁפָּט上达诸天所指为何
  choice: 译作“对她的判决”，表达针对巴比伦的司法裁决上达天庭
  alternative: “她的审判”“她的刑罚”或“她的罪状”
  rationale: 上下文关乎巴比伦不可逆转的毁灭，但מִשְׁפָּט本身仍有裁决与惩处之间的语义张力。“对她的判决”保留司法神学意象，又不将原词径直等同于罪行或执行中的刑罚。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。保留巴比伦的阴性拟人称呼“她”，保留第一人称复数鼓励式“让我们”，并以“诸天／云霄”再现原文两行递进的高空意象。所有脚注标记均置于相应正文词语之后。
