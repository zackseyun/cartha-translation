source:
  edition: WLC
  text: פִּתְאֹ֛ם נָפְלָ֥ה בָבֶ֖ל וַ/תִּשָּׁבֵ֑ר הֵילִ֣ילוּ עָלֶ֗י/הָ קְח֤וּ צֳרִי֙ לְ/מַכְאוֹבָ֔/הּ אוּלַ֖י תֵּרָפֵֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/008.yaml
  text: Suddenly Babylon has fallen and been shattered[a]. Wail over her! Take balm for her pain; perhaps she may be healed.
translation:
  language: zh_hans
  text: 巴比伦忽然倾覆，被摧毁了。你们要为她哀号！拿药膏[a]来医治她的痛苦；她或许能痊愈。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “药膏”也可译为“香脂”或“香膏”；希伯来文指一种用于治疗的药用树脂。
    reason: 说明צֳרִי的词义范围及实物性质，并保留“香脂／香膏”这一词汇替代译法。
lexical_decisions:
- source_word: פִּתְאֹם
  choice: 忽然
  rationale: 准确表达事情发生得突然而出人意料，也自然保留宣告中的震撼感。
- source_word: נָפְלָה
  choice: 倾覆
  rationale: 此处描写巴比伦的败亡；“倾覆”既保留“倒下”的意象，也适合城邦覆灭的语境。
- source_word: בָבֶל
  choice: 巴比伦
  rationale: 采用现代汉语中通行的地名译法。
- source_word: וַתִּשָּׁבֵר
  choice: 摔得粉碎
  rationale: 希伯来文为שׁבר的Nifal形态，表示遭到破坏、被打碎；该译法与前面的“倾覆”衔接自然，并体现灾难性的毁灭。
- source_word: הֵילִילוּ
  choice: 哀号
  rationale: 复数命令式，要求人们发出响亮的悲哭；“哀号”比“哀悼”更能传达声音和强烈情绪。
- source_word: עָלֶיהָ
  choice: 为她
  rationale: 与哀号用语连用时，עַל可表示为某人或某事哀哭；“她”保留巴比伦作为女性形象的人格化表达。
- source_word: קְחוּ
  choice: 拿
  rationale: 直接表达复数命令式的动作，在“拿香膏来治……”这一结构中自然清楚。
- source_word: צֳרִי
  choice: 香膏
  rationale: 指可供治疗使用的芳香药用树脂。“香膏”在现代汉语中较为自然，脚注补充“香脂”这一译法及其物质性质。
- source_word: לְמַכְאוֹבָהּ
  choice: 来治她的疼痛
  rationale: מַכְאוֹב主要表示疼痛、痛苦或伤痛；这里以香膏治疗，译成“来治她的疼痛”既忠实又符合汉语表达。
- source_word: אוּלַי
  choice: 或许
  rationale: 明确保留不确定和试探性的语气，不把医治说成必然结果。
- source_word: תֵּרָפֵא
  choice: 她可以痊愈
  rationale: רפא的Nifal未完成式表示得到医治；在אוּלַי之后，“可以痊愈”自然表达可能性，同时保留被医治、恢复健康的含义。
theological_decisions:
- issue: 巴比伦的阴性人格化
  choice: 用“她”指称巴比伦
  alternative: 把巴比伦作为无生命的城市，用“它”指称
  rationale: 原文以阴性单数形式持续指称巴比伦，把这座城人格化。使用“她”可保留先知话语中的形象和修辞张力，避免将其淡化为纯粹地理实体。
- issue: 巴比伦是否可能得到医治
  choice: 保留“或许”所表达的开放而不确定的可能性
  alternative: 按审判语境将其处理成明确不可能痊愈或纯粹讽刺
  rationale: 本节原文本身说“或许她可以痊愈”，没有在此句内明确界定其为真诚提议还是反讽。译文不替读者消解这种神学和修辞张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“倾覆，摔得粉碎”保留原文两个连续动词的力度；“哀号”体现复数命令式的强烈语气。脚注标记紧接其所解释的“香膏”，并在正文中明确出现。
