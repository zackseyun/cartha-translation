- from: 巴比伦忽然倾覆，摔得粉碎。你们要为她哀号！拿香膏[a]来治她的疼痛，或许她可以痊愈。
  to: 巴比伦忽然倾覆，被摧毁了。你们要为她哀号！拿药膏[a]来医治她的痛苦；她或许能痊愈。
  rationale: 修订仅处理两处可安全改进之处：以“被摧毁了”准确而自然地表达原文受动的“被打碎／毁坏”，并以“药膏”明确其治疗功能。保留“忽然”“倾覆”“为她哀号”“或许”及“她”的人格化，不预断医治的修辞性质或结果。脚注标记仍紧随所注释的词语，且无结构性错误。
