source:
  edition: WLC
  text: כִּי֩ כֹ֨ה אָמַ֜ר יְהוָ֤ה צְבָאוֹת֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל בַּת בָּבֶ֕ל כְּ/גֹ֖רֶן עֵ֣ת הִדְרִיכָ֑/הּ ע֣וֹד מְעַ֔ט וּ/בָ֥אָה עֵֽת הַ/קָּצִ֖יר לָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/033.yaml
  text: 'For thus says Yahweh of hosts[a], the God of Israel: The daughter of Babylon is like a threshing floor at the time it is trodden; yet a little while, and the time of harvest will come for her.'
translation:
  language: zh_hans
  text: '因为万军之耶和华——以色列的上帝如此说：


    “巴比伦女子像一块打谷场，

    正当它被踩踏的时候[a]；

    再过不久，

    她的收割时节就要到了。”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“正当人踩踏她的时候”；希伯来语没有明确说出动作的主体。
    reason: 保留希伯来语未明示施动者的特点；“她”可延续巴比伦的拟人化，也与打谷场比喻交叠。
lexical_decisions:
- source_word: יְהוָה צְבָאוֹת
  choice: 万军之耶和华
  rationale: 采用现代中文圣经语域中通行的神圣称号；“万军”保留צְבָאוֹת所含天上与地上众军的广度，而不限定为某一类军队。
- source_word: בַּת בָּבֶל
  choice: 巴比伦女子
  rationale: 保留先知文学将巴比伦拟人化为女子的表达，不简化成单纯的地名“巴比伦”。
- source_word: כְּגֹרֶן
  choice: 好像打谷场
  rationale: 保留כְ的明喻和具体的农业意象；“打谷场”是普通现代读者易懂的自然说法。
- source_word: עֵת הִדְרִיכָהּ
  choice: 到了被踩踏的时候
  rationale: דרך的使役形在打谷场语境中指踩踏、践踏；被动表达在中文里自然，也保留巴比伦与打谷场意象的重叠。
- source_word: עוֹד מְעַט
  choice: 再过不久
  rationale: 自然表达剩余时间短暂和事件迫近的意味，同时保持庄重的预言语气。
- source_word: וּבָאָה עֵת הַקָּצִיר לָהּ
  choice: 她的收割时节就要到了
  rationale: 保留“收割”的农业隐喻及阴性代词所延续的拟人化；“就要到了”清楚传达临近之意。
theological_decisions:
- issue: 打谷与收割意象的神学含义
  choice: 在正文中保留农业意象，让上下文显明这是巴比伦将受审判的图景
  alternative: 直接意译为巴比伦即将受惩罚
  rationale: 本节所在的审判语境使其威胁意味明确，但直说“惩罚”会消除原文有力的隐喻，故不在正文中展开解释。
- issue: 阴性后缀所承接的对象
  choice: 用“被踩踏”保留其既可联于拟人化的巴比伦、又可融入打谷场比喻的张力
  alternative: 明确译为“人踩踏她”或“人踩踏打谷场”
  rationale: 希伯来语没有明说动作主体，且阴性后缀与“巴比伦女子”和阴性名词“打谷场”形成交叠；不宜在正文中强行排除其中一层。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“巴比伦女子”保留先知文学的拟人化，“打谷场—踩踏—收割”的连续农业图景完整呈现。诗行分排用于显出神谕的节奏，不增添原文没有的解释。
