  text: וּ/פֶן יֵרַ֤ךְ לְבַבְ/כֶם֙ וְ/תִֽירְא֔וּ בַּ/שְּׁמוּעָ֖ה הַ/נִּשְׁמַ֣עַת בָּ/אָ֑רֶץ וּ/בָ֧א בַ/שָּׁנָ֣ה הַ/שְּׁמוּעָ֗ה וְ/אַחֲרָ֤י/ו בַּ/שָּׁנָה֙ הַ/שְּׁמוּעָ֔ה וְ/חָמָ֣ס בָּ/אָ֔רֶץ וּ/מֹשֵׁ֖ל עַל מֹשֵֽׁל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/046.yaml
  text: And do not let your heart grow faint[a], and do not fear the report heard in the land; a report will come in one year, and after it in the next year another report, and violence in the land[c][b], ruler against ruler.
translation:
  language: zh_hans
  text: 你们不要心里发软[b]，也不要因境内所听见的消息[a]而害怕。一年有消息传来，下一年又有消息传来；境内有暴力，统治者对抗统治者[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “消息”也可译作“传闻”或“风声”。希伯来语שְׁמוּעָה泛指流传或听到的音讯，不一定表示未经证实的谣言。
    reason: lexical_alternative
  - marker: b
    text: 直译为“你们的心变软”，意思是丧失勇气、心里胆怯。
    reason: lexical_alternative
  - marker: c
    text: 也可译作“统治者凌驾于统治者之上”。这句话既可能指统治者彼此争斗，也可能指政权接连更替。
    reason: alternative_reading
lexical_decisions:
- source_word: וּפֶן
  choice: 不要
  rationale: פֶּן通常引出“免得……”的警告；结合后续两个未完成式，汉语以直接劝诫“不要……也不要……”表达其警戒语气，更自然清楚。
- source_word: יֵרַךְ לְבַבְכֶם
  choice: 你们心里发软
  rationale: רכך本义为“变软、变弱”，与“心”连用表示丧失勇气；“心里发软”既保留原有意象，也符合现代汉语习惯。
- source_word: בַּשְּׁמוּעָה הַנִּשְׁמַעַת בָּאָרֶץ
  choice: 境内所听见的消息
  rationale: שְׁמוּעָה可指消息、传闻或风声，不必然暗示内容虚假；“消息”最为中性，并以“所听见的”保留נִשְׁמַעַת的听闻含义。
- source_word: וּבָא בַשָּׁנָה הַשְּׁמוּעָה וְאַחֲרָיו בַּשָּׁנָה הַשְּׁמוּעָה
  choice: 一年有消息传来，下一年又有消息传来
  rationale: 原文呈现接连两年传来消息的情形。“下一年”和“又”自然表达אַחֲרָיו所含的先后与重复关系，同时不具体断定年份。
- source_word: וְחָמָס בָּאָרֶץ
  choice: 境内有暴力
  rationale: חָמָס可指暴力、强暴或不义；在政治动荡的语境中，“暴力”直接而宽广。
- source_word: וּמֹשֵׁל עַל מֹשֵׁל
  choice: 统治者对抗统治者
  rationale: עַל本可表示“在……之上”，但在动乱语境中也可表达彼此对立；正文采用较贴合上下文的“对抗”，脚注保留政治更替或一人凌驾另一人的可能。
theological_decisions:
- issue: “统治者对抗统治者”所描述的政治局势
  choice: 正文表达统治者之间的对抗
  alternative: 统治者取代统治者，或一个统治者凌驾于另一个统治者之上
  rationale: 原文介词עַל具有多义性，上下文支持冲突，却不能完全排除接连更替或支配关系，因此以脚注保留歧义，不作教义化解释。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“境内”比“地上”更清楚地表达此处政治地域中的动乱；分号连接连续传闻与暴力、统治冲突的场景。所有脚注标记均置于正文相应词句之后。
