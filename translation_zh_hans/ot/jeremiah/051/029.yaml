  text: וַ/תִּרְעַ֥שׁ הָ/אָ֖רֶץ וַ/תָּחֹ֑ל כִּ֣י קָ֤מָה עַל בָּבֶל֙ מַחְשְׁב֣וֹת יְהוָ֔ה לָ/שׂ֞וּם אֶת אֶ֧רֶץ בָּבֶ֛ל לְ/שַׁמָּ֖ה מֵ/אֵ֥ין יוֹשֵֽׁב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/029.yaml
  text: And the earth quakes and writhes, for the plans of Yahweh have arisen against Babylon, to make the land of Babylon a desolation, without inhabitant.
translation:
  language: zh_hans
  text: 大地震动、翻腾，因为雅威反对巴比伦的计划已经兴起，要使巴比伦之地成为荒凉，无人居住。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתִּרְעַשׁ
  choice: 震动
  rationale: רעשׁ表示震动、摇撼；“震动”自然凝练，也符合审判语境中的大地异动。
- source_word: וַתָּחֹל
  choice: 翻腾不安
  rationale: חול在此描写如产痛般扭动、战栗；“翻腾不安”保留大地仿佛身体痛苦翻动的意象，又比直译“生产”更合现代汉语。
- source_word: הָאָרֶץ
  choice: 大地
  rationale: 这里与“震动、翻腾”连用，呈现广阔乃至宇宙性的反应；“大地”比局部性的“土地”更贴切。
- source_word: כִּי
  choice: 因为
  rationale: 明确引出大地震动的原因，符合该连词在本句中的因果功能。
- source_word: קָמָה
  choice: 已经定意施行
  rationale: 字面有“起来、立起”之意，与“计划”搭配时指计划已被确立并开始生效；汉语若直译“起来”不自然，故以“定意施行”表达其进入执行状态的动态。
- source_word: מַחְשְׁבוֹת
  choice: 计划
  rationale: 在审判语境中指经过筹划的意图或谋划；“计划”比“思想”更能体现将要执行的旨意。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语音译呈现四字神名，保留其专名性质，不以称号替代。
- source_word: עַל בָּבֶל
  choice: 攻击巴比伦
  rationale: עַל在敌对审判语境中表示“针对、敌对”；译作“攻击”清楚呈现计划所指向的审判行动。
- source_word: לָשׂוּם
  choice: 要使
  rationale: שׂים接宾语和结果补语时表示“使……成为……”；“要使”准确连接目的与结果。
- source_word: אֶרֶץ בָּבֶל
  choice: 巴比伦之地
  rationale: 此处אֶרֶץ特指巴比伦境内的土地，与句首范围较广的“大地”区别开来。
- source_word: לְשַׁמָּה
  choice: 荒凉
  rationale: שַׁמָּה指遭毁坏后的荒废、凄凉状态；“荒凉”是庄重而通顺的先知审判用语。
- source_word: מֵאֵין יוֹשֵׁב
  choice: 无人居住
  rationale: 自然表达“没有居民／居住者”的结果，保留原文彻底荒废的意味。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文使用以色列之神的专名，而非一般称号；采用“雅威”音译，保留专名性质并贴近通行的学术复原读音。
- issue: 耶和华的“计划”如何成为现实
  choice: 已经定意施行
  alternative: 已经兴起
  rationale: קָמָה字面意象是“起来”，但这里主语为“计划”，语义指神针对巴比伦的谋划已经确立并进入实施；译文保留确定性和行动性，不额外说明其实现机制。
translation_notes:
  register: 采用现代、庄重且易懂的书面汉语。“大地震动，翻腾不安”保持诗性和拟人化意象；后半句以清楚的因果和目的结构传达先知性审判宣告。
