  verdict: revise
  source_fidelity: 前半句基本忠实地呈现了“我们羞愧／听见辱骂（羞辱）”及“耻辱遮盖我们的脸”。但“闯入了”将 בָּאוּ עַל（来……攻击／临到……之上）的对象行动明确化为进入，且与英文审校轨迹所保留的“against”不符；原文并未直接断言进入圣所内部。
  naturalness: “羞耻遮满了我们的脸”可懂，但“耻辱遮住了我们的脸”更符合现代汉语固定搭配，也更自然地表达“遮盖面容”。
  terminology: “耶和华殿”“外族人”及“圣所”均适合本段庄重语体。“圣所”可作为集合性名词承载 מִקְדְּשֵׁי 的复数／集合用法，不强行界定具体数目或区域。
  issues:
  - severity: medium
    issue: “闯入了”把外族人的行动译为进入圣所。
    rationale: 希伯来文 בָּאוּ עַל 更直接表示“来攻击／来临到……之上”，本节及英文审校轨迹均保留对圣所的敌对行动，而不明说侵入内部。应避免将有争议的空间动作具体化。
  - severity: low
