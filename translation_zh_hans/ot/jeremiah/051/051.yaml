  text: בֹּ֚שְׁנוּ כִּֽי שָׁמַ֣עְנוּ חֶרְפָּ֔ה כִּסְּתָ֥ה כְלִמָּ֖ה פָּנֵ֑י/נוּ כִּ֚י בָּ֣אוּ זָרִ֔ים עַֽל מִקְדְּשֵׁ֖י בֵּ֥ית יְהוָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/051.yaml
  text: We are ashamed, for we have heard reproach; disgrace has covered our faces, for foreigners have come against the holy places of the house of the LORD.
translation:
  language: zh_hans
  text: 我们感到羞愧，因为我们听见了羞辱；耻辱遮住了我们的脸，因为外族人来攻击耶和华殿的圣所。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֹּשְׁנוּ
  choice: 我们蒙羞
  rationale: 该词表示因受辱而感到羞耻；“蒙羞”既保留被羞辱的意味，也符合庄重的现代汉语。
- source_word: חֶרְפָּה
  choice: 辱骂
  rationale: 此处指听见的凌辱、讥刺或责骂；“辱骂”能自然地与“听见”搭配，并保留公开羞辱的语义。
- source_word: כְלִמָּה
  choice: 羞耻
  rationale: 与前面的“蒙羞”形成希伯来文的同义强化，同时避免使用过于生僻的词。
- source_word: זָרִים
  choice: 外族人
  rationale: 在敌人侵犯圣殿的语境中，指不属于以色列群体的外来者；“外族人”比笼统的“陌生人”更贴合语境。
- source_word: בָּאוּ ... עַל
  choice: 闯入了
  rationale: 字面结构可表示“来到……之上/攻击……”。结合圣所受外族人侵犯的语境，“闯入”自然表达敌对侵入，又不额外限定破坏方式。
- source_word: מִקְדְּשֵׁי
  choice: 圣所
  rationale: 复数形式可指圣殿中的各处圣地或整体圣域；汉语用集合意义的“圣所”表达自然，同时不武断细分具体区域。
- source_word: בֵּית יְהוָה
  choice: 耶和华殿
  rationale: 保留神名“耶和华”，并按现代中文圣经语体简洁表达“耶和华的殿”。
theological_decisions:
- issue: 外族人对圣所的行动是“攻击”还是“进入”
  choice: 闯入了
  alternative: 攻击了／来到……之上
  rationale: 介词 עַל 本身容许“攻击、临到”之意，而本节所强调的羞辱也来自外族人侵犯神圣空间。“闯入”保留敌意及越界意味，但不把动作仅解释为军事攻击。
- issue: מִקְדְּשֵׁי 的复数如何呈现
  choice: 圣所
  alternative: 各处圣所／圣地
  rationale: 复数可能指圣殿内多个神圣区域，也可能是强调性或集合性表达。中文单数集合名词“圣所”避免凭空指定数量，同时保持圣殿语境。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语；保留原文两组羞耻词汇的递进，句式按希伯来文因果结构展开。
