language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: חָדְלוּ֩ גִבּוֹרֵ֨י בָבֶ֜ל לְ/הִלָּחֵ֗ם יָֽשְׁבוּ֙ בַּ/מְּצָד֔וֹת נָשְׁתָ֥ה גְבוּרָתָ֖/ם הָי֣וּ לְ/נָשִׁ֑ים הִצִּ֥יתוּ מִשְׁכְּנֹתֶ֖י/הָ נִשְׁבְּר֥וּ בְרִיחֶֽי/הָ׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/030.yaml
  text: The warriors of Babylon have stopped fighting; they sit in the strongholds[a]. Their strength has failed; they have become like women. Her dwellings are set on fire; her bars are broken.
translation:
  language: zh_hans
  text: 巴比伦的勇士不再争战，坐在堡垒里；他们的力量已经耗尽，成了妇人[a]。她的居所被放火焚烧，门闩也折断了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“成了妇人”。这是古代战争语境中的讥讽，表示他们已经丧失作战的力量和勇气。
    reason: 说明原文的字面措辞及其古代修辞含义，避免误解为字面上的性别改变。
lexical_decisions:
- source_word: חָדְלוּ גִבּוֹרֵי בָבֶל לְהִלָּחֵם
  choice: 巴比伦的勇士不再争战
  rationale: חדל与不定式连用表示停止某项行动；“不再争战”自然、庄重，并保留军事语境。גִבּוֹרֵי在此指作战的勇士。
- source_word: יָשְׁבוּ בַּמְּצָדוֹת
  choice: 坐在堡垒里
  rationale: יָשְׁבוּ基本义为“坐、居留”，此处描写勇士退守不出；מְצָדוֹת指设防的坚固处，译作“堡垒”。
- source_word: נָשְׁתָה גְבוּרָתָם
  choice: 他们的力量已经耗尽
  rationale: נָשְׁתָה表达枯竭、衰竭之意；“耗尽”与“力量”搭配自然，也保留彻底失去战力的图景。
- source_word: הָיוּ לְנָשִׁים
  choice: 成了妇人
  rationale: 按希伯来语的直陈形式翻译，保留先知话语中以古代战争性别观念作出的讥讽；其修辞含义由脚注说明，不在正文中淡化为一般性的“胆怯”。
- source_word: הִצִּיתוּ מִשְׁכְּנֹתֶיהָ
  choice: 她的居所被放火焚烧
  rationale: 希伯来语为第三人称复数主动式，但施事者没有明说。汉语采用被动表达，既不误把前句的巴比伦勇士当作纵火者，也不擅自补出敌军。
- source_word: נִשְׁבְּרוּ בְרִיחֶיהָ
  choice: 门闩也折断了
  rationale: בְרִיחִים指固定城门或门户的闩杆；在城防语境中译为“门闩”比泛称“闩”更清楚。נִשְׁבְּרוּ为完成的被动事件，译作“折断了”。
theological_decisions:
- issue: הָיוּ לְנָשִׁים所含的古代性别化战争讥讽
  choice: 正文译作“成了妇人”，并用脚注解释其修辞功能
  alternative: 译作“变得像妇人一样”或直接意译为“失去了勇气”
  rationale: 原文不是在陈述字面上的性别改变，而是借古代战争文化中的性别观念讥讽他们丧失战斗的力量和勇气。直译并加注既保留原文尖锐而令人不适的历史修辞，也避免读者将其误解为本体变化；同时不把“妇人”直接等同于抽象的懦弱判断。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“争战”“勇士”保持先知文学的肃穆感；句式简洁有力，以分号呈现战士溃败与城防毁坏的推进。代词“她”承接拟人化的巴比伦。
