  text: לָ/כֵן֙ הִנֵּ֣ה יָמִ֣ים בָּאִ֔ים וּ/פָקַדְתִּי֙ עַל פְּסִילֵ֣י בָבֶ֔ל וְ/כָל אַרְצָ֖/הּ תֵּב֑וֹשׁ וְ/כָל חֲלָלֶ֖י/הָ יִפְּל֥וּ בְ/תוֹכָֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/047.yaml
  text: Therefore, look, days are coming when I will punish the carved images of Babylon, and all her land will be put to shame, and all her slain will fall in her midst.
translation:
  language: zh_hans
  text: 所以，看哪，日子将到，我必惩罚巴比伦雕刻的偶像；巴比伦全地必蒙羞，她所有被杀的人都必倒在其中。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לָכֵן
  choice: 所以
  rationale: 承接前文并引出由此而来的审判宣告，准确表达因果关系。
- source_word: הִנֵּה
  choice: 看哪
  rationale: 保留先知宣告中引人注意、强调即将发生之事的语气，且符合中文圣经庄重语域。
- source_word: וּפָקַדְתִּי עַל
  choice: 我必惩罚
  rationale: פקד与עַל连用在此表示追讨、施行刑罚；译作“惩罚”自然清楚。
- source_word: פְּסִילֵי בָבֶל
  choice: 巴比伦的雕像
  rationale: פְּסִילִים指雕刻而成、作为崇拜对象的像；“雕像”保留物质形态，语境自然表明其偶像性质。
- source_word: תֵּבוֹשׁ
  choice: 必蒙羞
  rationale: 此动词表达因败亡而受羞辱；“蒙羞”既保留被动处境，也符合庄重中文。
- source_word: חֲלָלֶיהָ
  choice: 她所有被杀的人
  rationale: חָלָל通常指遭杀戮者、阵亡者；如此翻译比泛称“死者”更准确。
- source_word: בְתוֹכָהּ
  choice: 在她中间
  rationale: 保留巴比伦被拟人化为阴性单数的表达，并传达死者倒毙于其境内。
theological_decisions:
- issue: “巴比伦的雕像”是否应明确译为“偶像”
  choice: 雕像
  alternative: 偶像
  rationale: 原词突出雕刻之像，语境已显示它们是受审判的敬拜对象；保留原词的具体意象，避免把解释直接代入正文。
- issue: “她全地”中的阴性拟人
  choice: 她全地
  alternative: 巴比伦全境
  rationale: 保留原文以阴性代词指巴比伦的拟人结构，并与后文“她中间”形成呼应。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。句式保留先知宣告的节奏和平行结构；“看哪”略带经典庄严色彩，但在此适合传达הִנֵּה的强调功能。
