  text: נִבְעַ֤ר כָּל אָדָם֙ מִ/דַּ֔עַת הֹבִ֥ישׁ כָּל צֹרֵ֖ף מִ/פָּ֑סֶל כִּ֛י שֶׁ֥קֶר נִסְכּ֖/וֹ וְ/לֹא ר֥וּחַ בָּֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/017.yaml
  text: Every man is made brutish[a], without knowledge; every metalworker is put to shame by his idol, for his cast image is falsehood, and there is no breath in them.
translation:
  language: zh_hans
  text: 人人都愚昧无知；每个金属匠都因偶像蒙羞，因为他的铸像是虚假的，其中毫无气息[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “气息”或译“灵”。希伯来语 רוּחַ 可指“气息”、“风”或“灵”；此处译作“气息”，因为上下文强调偶像没有生命。
    reason: lexical_alternative
lexical_decisions:
- source_word: נִבְעַר
  choice: 愚昧
  rationale: 该词是 בער 的尼法勒形式，表达变得迟钝、愚蠢或如牲畜般没有理性；“愚昧”保留先知责斥的力度，又符合现代汉语表达。
- source_word: כָּל אָדָם
  choice: 人人
  rationale: אָדָם 在此泛指人类个体；“人人”既体现 כָּל 的周遍、分配意义，也自然传达这句话适用于所有人。
- source_word: מִדַּעַת
  choice: 无知
  rationale: 介词 מִן 与抽象名词 דַּעַת 在此有缺失、匮乏之意；与“愚昧”并列译为“无知”，简洁地表达缺乏知识。
- source_word: הֹבִישׁ
  choice: 蒙羞
  rationale: בוש 的使役式在此表示使人受羞辱或显为可耻；“蒙羞”自然保留这种结果意义。
- source_word: צֹרֵף
  choice: 金属匠
  rationale: 该分词可指熔炼、精炼或加工金属的人；偶像制造的语境并未限定为金银中的某一种，因此采用范围较广的“金属匠”。
- source_word: מִפָּסֶל
  choice: 因偶像
  rationale: פֶּסֶל 指雕刻的像或偶像，前置词 מִן 在此表示导致蒙羞的缘由；“因偶像”清楚表达这种关系。
- source_word: שֶׁקֶר
  choice: 虚假的
  rationale: 该名词意为虚假、谎言或欺骗；在谓语位置译作“是虚假的”，既自然，也保留对偶像虚妄本质的谴责。
- source_word: נִסְכּוֹ
  choice: 他铸造的像
  rationale: 该词指以熔融材料浇铸而成的像，并带第三人称阳性单数所属后缀；“他铸造的像”同时交代制作方式及其与金属匠的关系。
- source_word: וְלֹא רוּחַ בָּם
  choice: 其中毫无气息
  rationale: רוּחַ 可指气息、风或灵；此处强调偶像没有生命，“气息”最直接地呈现这一对比。复数后缀 בָּם 将所指扩展到这些偶像或铸像。
theological_decisions:
- issue: אָדָם 在普遍性陈述中的译法
  choice: 人人
  alternative: 每个人；世人
  rationale: 希伯来语虽用语法上的阳性单数形式，语义上却泛指所有人。“人人”保留周遍和分配意义，不把经文误限于男性。
- issue: 偶像语境中 רוּחַ 的译法
  choice: 气息
  alternative: 灵
  rationale: 上下文的重点是人手所造的偶像没有生命，因此正文采用“气息”；但 רוּחַ 本身也可译作“灵”，故以脚注保留这一词义可能。
translation_notes:
  register: 采用现代、庄重而易懂的普通话书面语。分号保留前后两项先知式断言的紧密并列；“金属匠”避免把原词过度限定为金匠或银匠；“他铸造的像”明确区分前面的泛称“偶像”与后面的铸像用语。
