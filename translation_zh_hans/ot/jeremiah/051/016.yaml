source:
  edition: WLC
  text: לְ/ק֨וֹל תִּתּ֜/וֹ הֲמ֥וֹן מַ֨יִם֙ בַּ/שָּׁמַ֔יִם וַ/יַּ֥עַל נְשִׂאִ֖ים מִ/קְצֵה אָ֑רֶץ בְּרָקִ֤ים לַ/מָּטָר֙ עָשָׂ֔ה וַ/יֹּ֥צֵא ר֖וּחַ מֵ/אֹצְרֹתָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/016.yaml
  text: At the sound of his voice, a multitude of waters is in the heavens; he makes clouds rise from the ends of the earth; he makes lightning for the rain, and brings out the wind from his storehouses.
translation:
  language: zh_hans
  text: 他一发声，天上就有众水喧腾；他使云雾[a]从地极升起，为降雨造出闪电，又从他的库房[b]放出风来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “云雾”或译“水汽”。
    reason: lexical_alternative
  - marker: b
    text: “库房”或译“宝库”。
    reason: lexical_alternative
lexical_decisions:
- source_word: לְקוֹל תִּתּוֹ
  choice: 他一发声
  rationale: 原文直译近于“在他发出声音时”。此处用简洁自然的汉语表达时间与随即发生的关系，并保留“声音”所呈现的神显意象，不径直解释为雷声。
- source_word: הֲמוֹן מַיִם
  choice: 众水喧腾
  rationale: הֲמוֹן兼有众多、涌动和喧响之意；“众水喧腾”既保留水的复数集合意象，也传达风暴语境中的声势，避免只译成数量或只译成响声。
- source_word: בַּשָּׁמַיִם
  choice: 天上
  rationale: 在气象语境中指天空或诸天；“天上”既自然易懂，也保留经文较高雅的宇宙图景。
- source_word: נְשִׂאִים
  choice: 云雾
  rationale: 该词可指云、雾气或蒸气；正文采用涵盖性较强且符合现代汉语的“云雾”，脚注保留“水汽”这一可能译法。
- source_word: מִקְצֵה אָרֶץ
  choice: 从地极
  rationale: 这是常见的圣经空间表达，指大地遥远的边缘；“地极”凝练、庄重，并不把意象扁平化为一般的“远方”。
- source_word: בְּרָקִים לַמָּטָר
  choice: 为降雨造出闪电
  rationale: 保留介词ל所表达的关联或目的色彩，使闪电与降雨相连，同时不强行判定为严格的目的关系。
- source_word: וַיֹּצֵא רוּחַ
  choice: 放出风来
  rationale: 上下文全是气象现象，因此רוּחַ在此译作“风”；“放出”自然呈现风从贮藏之处被带出的诗性图景。
- source_word: מֵאֹצְרֹתָיו
  choice: 从他的库房
  rationale: אֹצָר可指仓库、库房或宝库；“库房”保留具体的贮藏意象，又不暗示其中必为财宝。
theological_decisions:
- issue: 如何呈现神掌管天气的宇宙性诗歌意象
  choice: 保留天上的众水、从地极升起的云雾、为雨而有的闪电，以及收藏风的库房等具体意象。
  alternative: 将全句概括为神引发并掌管风暴。
  rationale: 原文借宏大的气象图景宣告神对受造界的主权；保留这些意象既忠于诗体，也避免把经文改写成抽象的教义陈述。
- issue: “声音”是否明确译为雷声
  choice: 译作“发声”，不明说“雷声”。
  alternative: 译作“他雷声一响”。
  rationale: 风暴语境确实使雷声成为可能理解，但原文使用一般的“声音”表达；正文保留神声音与雷鸣之间的诗性张力，不把暗示变成明说。
translation_notes:
  register: 采用现代、庄重而易懂的普通话；以分号划分连续的诗性动作。“众水喧腾”兼顾הֲמוֹן的数量与声势，“发声”则保留原文未明确说成雷声的含蓄性。所有脚注标记均已置于正文对应词后。
