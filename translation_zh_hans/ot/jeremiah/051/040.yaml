  text: I will bring them down like lambs to the slaughter[a], like rams with male goats.
translation:
  language: zh_hans
  text: 我要把他们带下去，像被带去宰杀的羊羔一样，又像公绵羊和公山羊一样。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֽוֹרִידֵם
  choice: 我要把他们带下去
  rationale: 使役式表达“使下去、带下去”。“带下去”保留方向和使役含义，也与牲畜被带去宰杀的图景自然衔接，不额外规定具体方式。
- source_word: כְּכָרִים
  choice: 如同羊羔
  rationale: כָּרִים可指羊羔或年轻的公绵羊；正文采用现代汉语自然的“羊羔”，其年龄或性别上的另一可能含义收入脚注。
- source_word: לִטְבֹחַ
  choice: 去宰杀
  rationale: 该不定式源自טבח，表示宰杀；与“带下去”连用，译为“带下去宰杀”，清楚保留目的或结果意味。
- source_word: כְּאֵילִים
  choice: 如公绵羊
  rationale: אֵילִים在此直接指公绵羊；不把可能伴随的强壮联想加入正文。
- source_word: עִם עַתּוּדִים
  choice: 和公山羊
  rationale: עַתּוּדִים指雄性山羊；“公山羊”是清楚、自然且保留性别区分的现代汉语表达。
