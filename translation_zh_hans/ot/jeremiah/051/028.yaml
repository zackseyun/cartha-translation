base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/028.yaml
  text: Consecrate the nations against her—the kings of Media[a], her governors and all her prefects[c][b], and every land of his dominion.
translation:
  language: zh_hans
  text: 要使列国分别为圣[a]，来攻打她——就是米底的众王[b]、她的总督和所有副长官，以及他所管辖的各地。[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “分别为圣”在这里指为作战而分别、预备或召集，带有神圣战争的意味。
    reason: cultural_note
  - marker: b
    text: “米底的众王”也可译作“米底人的众王”。
    reason: lexical_alternative
  - marker: c
    text: 希伯来文先说“她的总督……她的副长官”，随后转为“他所管辖的”。末尾的“他”可能指代表米底的君王；有些译本则把这种转换统一处理。
    reason: alternative_reading
lexical_decisions:
- source_word: קַדְּשׁוּ
  choice: 分别出来
  rationale: 该命令在战争语境中指为神圣战争分别、预备或召集。“分别出来”保留其宗教意味，又避免正文使用现代读者难以自然理解的“使……成圣”；脚注补明其战争语境。
- source_word: עָלֶיהָ
  choice: 攻击她
  rationale: 介词 עַל 在此表达敌对方向，所指为对巴比伦发动攻击；“她”也保留原文对城邦的阴性拟人称呼。
- source_word: גּוֹיִם
  choice: 列国
  rationale: 指受召参与战争的多个政治民族实体；“列国”简洁、庄重，符合先知书语体。
- source_word: מַלְכֵי מָדַי
  choice: 米底的众王
  rationale: 构造短语可指米底地区或米底人的诸王；正文采用自然的地缘表达，脚注保留族群表达的可能。
- source_word: פַּחוֹתֶיהָ
  choice: 她的总督
  rationale: פֶּחָה 指治理省区的高级地方官；“总督”适合古代帝国行政语境，并保留阴性单数后缀“她的”。
- source_word: סְגָנֶיהָ
  choice: 她的所有副长官
  rationale: סְגָן 指地位较次的官员或副手；“副长官”与“总督”有所区别，又不把该词限定为纯军事职衔。
- source_word: כָּל אֶרֶץ מֶמְשַׁלְתּוֹ
  choice: 他所管辖的各地
  rationale: 表达其统治权所及的全部地域，并明确保留 מֶמְשַׁלְתּוֹ 的阳性单数后缀“他”。
theological_decisions:
- issue: 代词后缀所指对象的转换
  choice: 在“她的总督和所有副长官”中保留阴性“她”，在“他所管辖的各地”中转为阳性“他”。
  alternative: 将所有代词统一译为“米底的”或“他们的”，使所指保持一致。
  rationale: 希伯来文先以阴性单数后缀指向米底，末句却使用阳性单数后缀。译文不擅自消除这一转换；末尾的“他”可能指作为代表首领的米底王，也可能是政治集合体的阳性单数用法。
translation_notes:
  register: 采用现代、庄重而易懂的先知书命令语气。“列国”“众王”“总督”保持历史政治语境；正文保留原文阴性到阳性代词的突变，并用脚注说明，而不在译文中强行统一。
