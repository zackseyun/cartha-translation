  text: אכל/נו הממ/נו נְבוּכַדְרֶאצַּר֮ מֶ֣לֶךְ בָּבֶל֒ הציג/נו כְּלִ֣י רִ֔יק בלע/נו כַּ/תַּנִּ֔ין מִלָּ֥א כְרֵשׂ֖/וֹ מֵֽ/עֲדָנָ֑/י הדיח/נו׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/034.yaml
  text: Nebuchadnezzar king of Babylon has devoured me[a]; he has crushed me. He has set me down like an empty vessel; he has swallowed me like a sea monster; he has filled his belly with my delicacies[c][b]; he has cast me out.
translation:
  language: zh_hans
  text: 巴比伦王尼布甲尼撒吞吃了我[c]，又把我摧毁了；他把我放下，像空器皿一样；他像海怪[a]一样吞下我，用我的佳肴[b]填满肚腹，又把我丢弃。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “海怪”或译“巨蛇”或“龙形怪物”。希伯来语תנין可指巨大的蛇类、龙形生物或海中巨兽；此处的吞食意象较适合译作“海怪”。
    reason: lexical_alternative
  - marker: b
    text: “佳肴”也可译作“珍品”或“美物”。
    reason: lexical_alternative
  - marker: c
    text: 这里的说话者是拟人化的锡安／耶路撒冷。希伯来语中几个宾语后缀在形式上呈现复数，但结合上下文，通常按这座城的单数拟人化译作“我”。
    reason: textual_ambiguity
lexical_decisions:
- source_word: אכלנו
  choice: 吞吃了我
  rationale: אכל本义为“吃”，在此征服与毁灭的诗歌意象中译作“吞吃”，既保留进食隐喻，也传达暴力意味。后缀形式与上下文中的单数拟人化之间存在张力，另以脚注说明。
- source_word: הממנו
  choice: 把我摧毁
  rationale: המם可表示使混乱、击溃或毁坏；此处与“吞吃”、空器皿等意象并列，“摧毁”自然地表达彻底破坏，同时不限定具体手段。
- source_word: הציגנו
  choice: 把我撂在一旁
  rationale: יצג的使役式有放置、安置之意；“撂在一旁”保留具体的放置动作，并与“如同空器皿”共同呈现被掏空后弃置的图景，避免直接改写为“使我成为”。
- source_word: כלי ריק
  choice: 如同空器皿
  rationale: כלי泛指器皿、容器或用具；“空器皿”简洁而有诗意，也维持原文意象的宽泛性。
- source_word: בלענו
  choice: 吞下我
  rationale: בלע直接表示吞咽；译文保留鲜明的吞食画面，不抽象化为“消灭”或“吞没”。
- source_word: כתנין
  choice: 像海怪一样
  rationale: תנין可指巨蛇、龙形怪物或海中巨兽；此处配合吞食意象，“海怪”自然传达巨大可怖的生物形象，同时以脚注保留其他可能。
- source_word: מלא כרשו
  choice: 填满肚腹
  rationale: כרש指腹部、肚腹；“填满肚腹”保留征服者饕餮般吞食的粗粝意象，并符合现代汉语诗体。
- source_word: מעדני
  choice: 我的佳肴
  rationale: מעדנים可指美味、珍品或令人喜悦之物；在持续的进食隐喻中，“佳肴”最为贴切，脚注保留“珍品”等较宽泛理解。
- source_word: הדיחנו
  choice: 把我丢弃
  rationale: דוח/נדח的使役式在此可指排出、赶走或丢弃；“丢弃”承接被掏空后弃置的图景，又不强行将其具体化为生理性的“吐出”。
theological_decisions:
- issue: 受害者的数与身份
  choice: 正文采用单数“我”，将说话者理解为拟人化的锡安／耶路撒冷，但以脚注指出希伯来语形式呈现的复数表象。
  alternative: 按后缀表面形式译作复数“我们”。
  rationale: 下节明确让“锡安的居民”和“耶路撒冷”发言，支持本节以城为单数拟人化说话者；然而本节数个宾语后缀呈现复数形式，因此不应把这一语言张力隐去。
translation_notes:
  register: 采用现代、庄重而具象的普通话。分号维持原诗连续推进的吞食与弃置意象；“撂在一旁”较口语但不轻佻，能具体表达空器皿被放下弃用的画面。神名、人名采用通行中文圣经译名“尼布甲尼撒”。
