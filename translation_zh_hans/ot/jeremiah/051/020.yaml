  text: מַפֵּץ אַתָּ֣ה לִ֔/י כְּלֵ֖י מִלְחָמָ֑ה וְ/נִפַּצְתִּ֤י בְ/ךָ֙ גּוֹיִ֔ם וְ/הִשְׁחַתִּ֥י בְ/ךָ֖ מַמְלָכֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/020.yaml
  text: You are my war club[a], my weapon of battle; with you I shatter nations[b], and with you I destroy kingdoms.
translation:
  language: zh_hans
  text: 你是我用来击碎的器具，是争战的兵器；我用你击碎列国，用你毁灭各王国。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַפֵּץ
  choice: 战锤
  rationale: 该词指用来砸碎、击破的器具；“战锤”既保留击碎的核心意象，也符合本节的战争语境，同时避免把器具过度限定为斧。
- source_word: לִי
  choice: 我的
  rationale: 原文形式上是“对我／为我”，在这里表达所属和供神使用的关系；现代汉语用“我的”最自然。
- source_word: כְּלֵי מִלְחָמָה
  choice: 作战的兵器
  rationale: כְּלֵי 可指器具或装备；结合单数称呼“你”，译为单数性的“兵器”，使表达自然，并保留军事含义。
- source_word: וְנִפַּצְתִּי בְךָ
  choice: 我用你击碎
  rationale: נפץ 的加强词干表达猛烈砸碎；בְךָ 表示工具或媒介。“用你击碎”保留神以受话者为施行审判之工具的意象。原文完成式在先知宣告中可表达确定、鲜明的行动，中文不强加明确的过去时或将来时。
- source_word: גּוֹיִם
  choice: 列国
  rationale: 此处指各政治民族或国家；“列国”庄重、清楚，也适合先知文学语体。
- source_word: וְהִשְׁחַתִּי בְךָ
  choice: 用你毁灭
  rationale: שׁחת 的使役词干在此表示使之败坏、毁灭；“毁灭”与上句“击碎”构成有力平行。
- source_word: מַמְלָכוֹת
  choice: 众王国
  rationale: 该词明确指王国或王权统治的疆域；“众王国”保留复数，并与“列国”形成平行而不混同。
theological_decisions:
- issue: 单数第二人称“你”所指的对象
  choice: 正文只保留“你”，不指明其身份。
  alternative: 可按不同的上下文理解为巴比伦、居鲁士／玛代波斯，或以色列／雅各。
  rationale: 本节希伯来文本本身没有点明受话者；直接加入某一身份会消除原文真实存在的解释张力。脚注说明其单数形式及主要理解。
- issue: 动词完成式的时间指向
  choice: 中文采用不标明明确时态的“我用你击碎／毁灭”。
  alternative: 也可按语境译为过去行动“我曾用你”，或确定的将来行动“我要用你”。
  rationale: 希伯来语完成式在先知话语中可能强调行动的确定性，单凭本节不宜将时间关系限定得过死；现代汉语的无标记形式能保留这种开放性。
translation_notes:
  register: 采用现代、庄重而易懂的先知文学语体。“战锤—兵器”“击碎—毁灭”“列国—众王国”保留原文的意象和对仗；不补出受话者身份，也不以中文时态词消除原文完成式在语境中的张力。
