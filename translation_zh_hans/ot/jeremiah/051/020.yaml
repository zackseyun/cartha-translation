  rationale: 修订避免把 מַפֵּץ 专指为“战锤”，改以“用来击碎的器具”保留原文较宽的武器／器具范围；同时保留第二人称单数的未指明对象、两次“用你”的工具性，以及两组政治实体的平行。将“众王国”改为“各王国”仅为现代汉语自然度，不改变意义。
