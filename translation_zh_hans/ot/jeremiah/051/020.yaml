    rationale: “玛代—波斯”能清楚表示一个复合称谓；并应说明这些是不同释经认定，而非正文所明说的身份。
  revised_text: 你是我用来击碎的器具，是争战的兵器；我用你击碎列国，用你毁灭各王国。
