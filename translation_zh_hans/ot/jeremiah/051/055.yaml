  text: כִּֽי שֹׁדֵ֤ד יְהוָה֙ אֶת בָּבֶ֔ל וְ/אִבַּ֥ד מִמֶּ֖/נָּה ק֣וֹל גָּד֑וֹל וְ/הָמ֤וּ גַלֵּי/הֶם֙ כְּ/מַ֣יִם רַבִּ֔ים נִתַּ֥ן שְׁא֖וֹן קוֹלָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/055.yaml
  text: For Yahweh is devastating Babylon and destroying from her the great sound[a]. Their waves roar like many waters[b]; the noise of their voice is given.
translation:
  language: zh_hans
  text: 因为耶和华正在摧毁巴比伦，使城中的喧嚣止息。他们的波涛如滔滔众水般轰鸣；他们声音的喧响响起。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שֹׁדֵד
  choice: 正在摧毁
  rationale: 分词表达正在发生或迫近的行动；“摧毁”自然传达שׁדד对城市施行毁灭性审判的力度，同时不局限于劫掠。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代汉语读者熟悉的专名“耶和华”呈现四字神名，避免以称号“主”代替原文中的专名。
- source_word: וְאִבַּד מִמֶּנָּה קוֹל גָּדוֹל
  choice: 使城中的喧嚣止息
  rationale: אבד在使役词形中表示使之消失或除去；קוֹל גָּדוֹל在此宜理解为巴比伦宏大而嘈杂的声响。“城中”自然传达阴性代词所指的巴比伦，避免中文生硬的“从她那里”。
- source_word: וְהָמוּ
  choice: 轰鸣
  rationale: 该动词兼有喧腾与巨响之意；以波涛为主语时，“轰鸣”自然保留听觉和动态意象。
- source_word: גַלֵּיהֶם
  choice: 他们的波涛
  rationale: 依照马所拉文本的第三人称阳性复数后缀直译为“他们的”，不擅自改成指巴比伦的“她的”；所指可能是进攻者。
- source_word: כְּמַיִם רַבִּים
  choice: 如滔滔洪水般
  rationale: רַבִּים可表达水量浩大；“滔滔洪水”以自然汉语传达众水汹涌、压倒性的比喻，而非机械译成“许多水”。
- source_word: נִתַּן שְׁאוֹן קוֹלָם
  choice: 他们发出震耳的吼声
  rationale: 原文被动式字面为“他们声音的喧响被发出”，是表示声音响起的习语；转为自然汉语主动句，同时保留强烈的听觉效果。
theological_decisions:
- issue: 四字神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用神的专名而非“主”这一称号；“耶和华”是现代中文圣经传统中最通行、普通读者最易识别的专名形式。
- issue: “他们的波涛”所指
  choice: 保留“他们的”，不明确指定所指
  alternative: 译为“敌军如波涛”或“她的波涛”
  rationale: 阳性复数后缀可能承接上下文中的攻击者，但本节自身没有明说；保留代词可维护原文的指称张力，避免把解释写入正文。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。以“喧嚣止息”“波涛轰鸣”“震耳的吼声”维持本节连续的声音意象；对希伯来语习语作适度动态转换，同时保留“他们”这一真实但指向略含混的代词。
