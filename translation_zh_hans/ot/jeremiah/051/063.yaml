base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/063.yaml
  text: And when you finish reading this scroll[a], tie a stone to it and throw it into the midst of the Euphrates[b],
translation:
  language: zh_hans
  text: 你读完这卷书[a]后，要把一块石头绑在这卷书上，再把这卷书扔进幼发拉底河中[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“这文书”。希伯来语סֵפֶר可泛指书写成的文献；这里按当时的书写形式译作“卷书”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来语作“伯拉”（Pərat），即幼发拉底河。
    reason: geographical_clarification
lexical_decisions:
- source_word: וְהָיָה כְּכַלֹּתְךָ לִקְרֹא
  choice: 你读完……后
  rationale: “וְהָיָה”与כְ加不定式结构共同引出将来的时间情境。译为“……后”符合现代汉语习惯，同时准确表达“当你读完时”。
- source_word: אֶת־הַסֵּפֶר הַזֶּה
  choice: 这卷书
  rationale: סֵפֶר泛指书写成的文献；本段语境是可捆上石头并投入河中的书卷，因此“卷书”兼顾历史形态和现代可读性。
- source_word: תִּקְשֹׁר עָלָיו אֶבֶן
  choice: 把一块石头绑在上面
  rationale: קשר表示“捆、绑”，עָלָיו表示石头附着在该书卷上。“绑在上面”自然清楚，也保留原文的空间表达。
- source_word: וְהִשְׁלַכְתּוֹ
  choice: 再把它扔进
  rationale: שלך的使役形表示“扔、抛”。“扔进”是自然的现代汉语，并与后面的方向短语衔接。
- source_word: אֶל־תּוֹךְ
  choice: 进……中
  rationale: תּוֹךְ指内部或当中；“进……中”保留了书卷被投入河流内部的意象，避免仅仅理解为扔向河边。
- source_word: פְּרָת
  choice: 幼发拉底河
  rationale: פְּרָת是该河的希伯来名称，现代汉语通行地名为“幼发拉底河”。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“要……再……”清楚呈现连续指令；保留句末承接下文的语势，但按中文标点独立成句。
