  source_fidelity: 主译准确反映马所文本的主要理解：巴比伦也将因以色列的死者而倾覆，并与巴比伦所牵连的“全地的死者”相对应。以“必”表达 לִנְפֹּל 在此预言语境中的必然性是稳妥的；第二分句的“因巴比伦而”适当地表达 לְבָבֶל 的关联／归因。脚注也保留了首句压缩句法的另一种可能划分，未将争议消除。
