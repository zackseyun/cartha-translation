id: JER.51.49
reference: Jeremiah 51:49
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: גַּם בָּבֶ֕ל לִ/נְפֹּ֖ל חַֽלְלֵ֣י יִשְׂרָאֵ֑ל גַּם לְ/בָבֶ֥ל נָפְל֖וּ חַֽלְלֵ֥י כָל הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/049.yaml
  text: Babylon also must fall for the slain of Israel[a], just as the slain of all the earth have fallen for Babylon.
translation:
  language: zh_hans
  text: 巴比伦也必因以色列被杀的人而倾覆[a]，正如全地被杀的人因巴比伦而倒下。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“巴比伦也倒下了，以色列被杀的人哪。”希伯来文首句的句法十分凝缩，可以有不止一种理解。
    reason: alternative_reading
lexical_decisions:
- source_word: גַּם
  choice: 也／正如
  rationale: 两个 גַּם 使前后分句彼此对应；首处译“也”，次处按汉语平行关系译“正如”。
- source_word: בָּבֶל
  choice: 巴比伦
  rationale: 该地名在现代汉语圣经语境中的标准译名。
- source_word: לִנְפֹּל
  choice: 必……倾覆
  rationale: 带 ל 的不定式结构高度凝缩；在此审判预言中可表达注定临到的倾覆。“必”体现预言的确定性，“倾覆”也适合以城邦为对象。
- source_word: חַלְלֵי
  choice: 被杀的人
  rationale: 指在战争或审判中遭杀戮者；此译自然清楚，并保留其受害者含义。
- source_word: יִשְׂרָאֵל
  choice: 以色列
  rationale: 该民族名称的标准汉语译名。
- source_word: לְבָבֶל
  choice: 因巴比伦
  rationale: 这里的 ל 表明这些死者的倒下与巴比伦有关，可理解为巴比伦造成；译为“因巴比伦”保留关系而不过度具体化施事方式。
- source_word: נָפְלוּ
  choice: 倒下
  rationale: 完成式描写已经发生的死亡；“倒下”在汉语中保留了希伯来文“坠落／倒下”的战争意象。
- source_word: חַלְלֵי כָל הָאָרֶץ
  choice: 全地被杀的人
  rationale: 上下文聚焦巴比伦广泛的帝国暴力，כָל הָאָרֶץ 宜取广义“全地”，而非仅指某一局部土地。
theological_decisions:
- issue: אָֽרֶץ 的范围
  choice: 全地
  alternative: 全境／整个地区
  rationale: 本段谕旨将以色列的死者与巴比伦在广泛范围内造成的死者并列；“全地”较能保留其普世性的修辞范围。
- issue: 首句凝缩句法
  choice: 巴比伦也必因以色列被杀的人而倾覆
  alternative: 巴比伦也倒下了，以色列被杀的人哪
  rationale: 主译将 לִנְפֹּל 理解为巴比伦注定受报应而倾覆，并使两句形成因果对应；但希伯来语句法压缩，另一种划分亦有可能，故列入脚注而不将歧义静默消除。
translation_notes:
  register: 采用现代、庄重而清楚的标准普通话。“倾覆”用于巴比伦所受的审判，“倒下”用于被杀者，既保持自然表达，也尽量呈现原文 נפל 在两句中的呼应。
