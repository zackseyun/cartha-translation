id: JER.51.11
reference: Jeremiah 51:11
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: הָבֵ֣רוּ הַ/חִצִּים֮ מִלְא֣וּ הַ/שְּׁלָטִים֒ הֵעִ֣יר יְהוָ֗ה אֶת ר֨וּחַ֙ מַלְכֵ֣י מָדַ֔י כִּֽי עַל בָּבֶ֥ל מְזִמָּת֖/וֹ לְ/הַשְׁחִיתָ֑/הּ כִּֽי נִקְמַ֤ת יְהוָה֙ הִ֔יא נִקְמַ֖ת הֵיכָלֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/011.yaml
  text: Sharpen the arrows[a]; fill the shields. Yahweh has stirred up the spirit of the kings of Media, because his plan is against Babylon, to destroy her; for it is the vengeance of Yahweh[b], vengeance for his temple.
translation:
  language: zh_hans
  text: 磨利箭矢[a]，备足盾牌！耶和华已经激起玛代诸王的心志，因为他定意攻击巴比伦，要毁灭她；这是耶和华的复仇，是为他的殿所作的复仇。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “备足盾牌”所对应的希伯来语直译为“装满盾牌”，搭配的含义不完全明确。末词通常可指“盾牌”，但也有人因上下文提到箭而理解为“箭袋”，译作“装满箭袋”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הָבֵרוּ
  choice: 磨利
  rationale: 该复数命令式在兵器语境中表示整理、擦亮或磨利箭；“磨利”自然表达临战预备，同时不把动作弱化为单纯擦亮。
- source_word: הַחִצִּים
  choice: 箭头
  rationale: 指箭这一类武器；现代汉语“磨利箭头”比“磨利箭”更自然，也准确指出受磨利的部位。
- source_word: מִלְאוּ הַשְּׁלָטִים
  choice: 拿起盾牌
  rationale: מִלְאוּ 的基本义是“装满”，但与通常指“盾牌”的 הַשְּׁלָטִים 搭配较为困难。部分传统理解据语境取“箭袋”，则可译为“装满箭袋”；正文保留名词较有根据的“盾牌”，并以符合整装出战语境的“拿起”表达。
- source_word: הֵעִיר
  choice: 已经激起
  rationale: 使役完成式表示耶和华已经唤起并推动其采取行动。
- source_word: רוּחַ
  choice: 心志
  rationale: 此处指诸王内在的意向、动力或精神状态；“心志”在现代汉语中比直译“灵”更清楚，又保留内在驱动力的含义。
- source_word: מַלְכֵי מָדַי
  choice: 玛代诸王
  rationale: 准确保留复数“诸王”，并采用中文圣经及历史语境中通行的地名“玛代”。
- source_word: מְזִמָּתוֹ
  choice: 他定意
  rationale: 表示耶和华既定的谋划或意图；“定意”简洁庄重，并与后面的行动目标自然衔接。
- source_word: עַל בָּבֶל
  choice: 攻击巴比伦
  rationale: 介词 עַל 表明计划针对巴比伦；结合毁灭语境，译作“攻击”比生硬的“在巴比伦之上”清楚。
- source_word: לְהַשְׁחִיתָהּ
  choice: 要毁灭她
  rationale: 阴性后缀回指巴比伦；以“她”保留城市拟人化表达。
- source_word: נִקְמַת יְהוָה
  choice: 耶和华的报仇
  rationale: 保留原文“耶和华的报仇”这一所属及施行关系，以及审判语气。
- source_word: נִקְמַת הֵיכָלוֹ
  choice: 为他的殿报仇
  rationale: 第二个“报仇”说明缘由，即为耶和华的殿遭受毁坏而施行报复；汉语补出“为”可明确该关系。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 采用现代中文读者最熟悉且能明确作为专名识别的“耶和华”；不以“主”替代原文中的神名。
- issue: 巴比伦覆亡中的神圣能动性
  choice: 耶和华已经激起玛代诸王的心志
  alternative: 耶和华容许玛代诸王兴起
  rationale: 原文以使役动词明确把诸王受到推动归于耶和华，不能弱化为单纯许可。
- issue: 报仇与圣殿之间的关系
  choice: 这是耶和华的报仇，是为他的殿报仇
  alternative: 这是耶和华为他的殿所行的报应
  rationale: 重复“报仇”以保留原文的强调和庄严节奏，不把审判概念抽象化。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。用两个简短命令句营造临战号令的力度；后半句保留巴比伦作为女性城市的拟人化表达，并重复“报仇”以再现希伯来文的强调。脚注标记置于相关命令之后，说明原文词语搭配的真实难点。
