  text: הֶ֣בֶל הֵ֔מָּה מַעֲשֵׂ֖ה תַּעְתֻּעִ֑ים בְּ/עֵ֥ת פְּקֻדָּתָ֖/ם יֹאבֵֽדוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/018.yaml
  text: They are vanity[a], a work of delusion[b]; at the time of their punishment they will perish.
translation:
  language: zh_hans
  text: 它们不过是虚空[a]，是迷惑人的制成品[b]；到它们遭惩罚的时候[c]，它们必灭亡。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “虚空”也可译作“虚妄”、“徒然”或“毫无价值”。
    reason: lexical_alternative
  - marker: b
    text: “迷惑人的制成品”也可译作“迷误之作”或“可笑之作”。
    reason: lexical_alternative
  - marker: c
    text: “遭惩罚的时候”直译也可作“它们被追究的时候”或“它们被察访的时候”；这里指审判临到它们的时候。
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶבֶל
  choice: 虚空
  rationale: 此词可指气息般的短暂无实、徒然或毫无价值；在斥责偶像的语境中，“虚空”既保留其形象与传统表达，也传达偶像空洞无用的含义。
- source_word: הֵמָּה
  choice: 它们尽是
  rationale: 独立第三人称复数代词带有强调作用；“它们尽是”在现代汉语中自然地体现这一强调。
- source_word: מַעֲשֵׂה תַּעְתֻּעִים
  choice: 骗人的作品
  rationale: מַעֲשֵׂה 是单数“作品、制成之物”，后面的 תַּעְתֻּעִים 可表达欺骗、迷误或嘲弄。“骗人的作品”适合偶像论战的语境，同时不把它仅限于人的主观幻觉。
- source_word: בְּעֵת פְּקֻדָּתָם
  choice: 到了它们受惩罚的时候
  rationale: פְּקֻדָּה 可指察访、追究或惩罚；在审判语境中译为“受惩罚的时候”清楚自然，并用脚注保留“被追究／被察访”的词义空间。
- source_word: יֹאבֵדוּ
  choice: 它们必灭亡
  rationale: אבד 在此为未完成式，表示将来的灭亡；“必灭亡”保留不及物语气，并传达预言中的确定性。
theological_decisions:
- issue: 偶像论战的重点
  choice: 本节把偶像说成空洞无实、具有欺骗性的制成品，并宣告它们在受审判时必灭亡。
  alternative: תַּעְתֻּעִים 也可能侧重偶像是“可笑的作品”或“迷误的作品”。
  rationale: 上下文与耶利米书10:15的平行表述兼有偶像虚妄及其在审判中败亡的含义；正文采用合乎语境的“骗人”，脚注则保留词义上的真实歧义。
- issue: פְּקֻדָּה 的审判含义
  choice: 正文明确译作“受惩罚的时候”。
  alternative: 较形式对应的译法是“被追究的时候”或“被察访的时候”。
  rationale: 该词本身可表示察访或追究，但本节结果是“灭亡”，显示这里的察访带有惩罚性的审判含义；脚注保留较宽的译法。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“尽是虚空”保留先知性斥责的力度；“作品”对应原文单数名词，也适合指人手制成的偶像。分号呈现原文前后两部分由定性转向结局的结构。
