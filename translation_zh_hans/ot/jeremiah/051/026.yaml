  text: וְ/לֹֽא יִקְח֤וּ מִמְּ/ךָ֙ אֶ֣בֶן לְ/פִנָּ֔ה וְ/אֶ֖בֶן לְ/מֽוֹסָד֑וֹת כִּֽי שִׁמְמ֥וֹת עוֹלָ֛ם תִּֽהְיֶ֖ה נְאֻם יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/026.yaml
  text: And they will not take from you a stone for a corner or a stone for foundations[a], for you will be everlasting desolations[b], declares Yahweh.
translation:
  language: zh_hans
  text: 没有人会从你那里取石头作为房角石，也不会取石头作为根基[a]；因为你必永远荒凉[b]。这是雅威的宣告。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “房角石”原文直译为“作角的石头”；“根基”原文为复数。
    reason: lexical_alternative
  - marker: b
    text: 或译：“永远成为一片片废墟。”原文“荒凉之处／废墟”为复数。
    reason: lexical_alternative
lexical_decisions:
- source_word: יִקְחוּ
  choice: 人必……取
  rationale: 该词为לקח的Qal未完成式第三人称阳性复数；与否定词连用，在预言语境中表达将来必不发生之事。中文以泛指的“人”自然传达未明说的复数主语。
- source_word: מִמְּךָ
  choice: 从你那里
  rationale: 第二人称阳性单数后缀指向被人格化、受直接称呼的巴比伦；保留第二人称可维持原文的直接宣判语气。
- source_word: אֶבֶן לְפִנָּה
  choice: 石头作房角石
  rationale: 原文直译为“作角的石头”。“房角石”是现代中文可理解的建筑用语，同时保留其建筑意象；脚注注明较字面的译法。
- source_word: וְאֶבֶן לְמוֹסָדוֹת
  choice: 也不取石头作根基
  rationale: מוֹסָדוֹת为复数“根基、基础”。中文“作根基”自然地表达石料用于基础工程，并与前面的房角石形成对应。
- source_word: כִּי
  choice: 因为
  rationale: 在此引出前述无人取石作建筑材料的原因。
- source_word: שִׁמְמוֹת עוֹלָם
  choice: 永远荒凉
  rationale: שִׁמְמוֹת是复数，可加强彻底荒废的意味；汉语通常以状态表达“荒凉”，配合“永远”自然传达עוֹלָם所表示的持久性。脚注保留“永远成为一片片废墟”这一较贴近复数形式的可能译法。
- source_word: תִּהְיֶה
  choice: 你必……荒凉
  rationale: היה未完成式在审判预言中表示未来状态。译作“必……荒凉”比机械译为“必成为”更符合现代汉语，同时不排除结果状态的含义。
- source_word: נְאֻם יְהוָה
  choice: 这是雅威的宣告
  rationale: 保留先知书中庄严的宣告公式，并以“雅威”音译四字神名。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名。采用“雅威”以呈现其专名性质，不以称号替代；同时避免将某一传统读法当作唯一确定的古代发音。
- issue: שִׁמְמוֹת的复数强度
  choice: 正文译为“荒凉”，脚注保留复数意象
  alternative: 永远成为一片片废墟
  rationale: 中文状态词通常不标复数，正文以自然表达为先；脚注提示原文复数可能带有多处废墟或彻底荒废的加强意味，不把该语法形式过度教义化。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“人必不……”保留预言宣判的确定语气；分号将建筑石料意象与其原因清楚连接。所有脚注标记均置于正文相应位置。
