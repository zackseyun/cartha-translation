base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/032.yaml
  text: The crossings have been seized[a], the marshes have been burned with fire[c][b], and the men of war are terrified.
translation:
  language: zh_hans
  text: 渡口已被夺取[a]，池沼被火焚烧[b]，战士们惊惶失措。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“过河处”或“通道”。
    reason: lexical_alternative
  - marker: b
    text: “池沼”也可译作“沼泽”或“水池”；希伯来语这个词可指沼泽、水池或湿地区域。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּעְבָּרוֹת
  choice: 渡口
  rationale: 该词指可供通过或渡越之处；在攻取巴比伦的军事语境中，很可能指河流渡口。“渡口”自然明确，同时保留战略要地的含义。
- source_word: נִתְפָּשׂוּ
  choice: 被占领了
  rationale: Nifal形式表达被夺取、被控制；“被占领了”保留被动及行动已经完成的意味，也符合军事语境。
- source_word: הָאֲגַמִּים
  choice: 沼泽
  rationale: 该词可指池沼、湿地或长芦苇的水泽；“沼泽”最符合巴比伦周边地貌，也与可燃的水泽植物相协调，同时不把所指限缩为芦苇。
- source_word: שָׂרְפוּ בָאֵשׁ
  choice: 被放火焚烧
  rationale: 希伯来文直译为“他们用火烧了”，主语未明；中文用无施事被动式自然地承接前句灾情，并以“放火焚烧”传达 בָאֵשׁ 的强调。
- source_word: אַנְשֵׁי הַמִּלְחָמָה
  choice: 战士们
  rationale: 原文直译为“战争之人”，即参战的男子或战士；“战士们”在现代中文中简洁、庄重，准确表达其军事身份。
- source_word: נִבְהָלוּ
  choice: 惊慌失措
  rationale: 该动词表示受惊、惶恐或陷入慌乱；“惊慌失措”既传达强烈程度，也符合军队在败局中的状态。
theological_decisions: []
