lexical_decisions:
- source_word: יַחְדָּו
  choice: 一同
  rationale: 表示集体一致的行动；“一同”简洁自然，也保留众者共同发声的意味。
- source_word: כְּפִרִים
  choice: 少壮狮子
  rationale: 通常指已具力量、能够吼叫或捕猎的年轻狮子；译作“少壮狮子”，既表达其年轻而强健，也与后面的“幼狮”有所区别。
- source_word: יִשְׁאָגוּ
  choice: 吼叫
  rationale: שאג是狮子发出吼声的常用动词；“吼叫”直接对应原文，且不额外增添强度。
- source_word: נָעֲרוּ
  choice: 低吼
  rationale: 此处指动物发出的粗厉声音，具体声态并不完全确定；“低吼”符合狮类意象，也与前句的“吼叫”形成自然的诗歌对应。
- source_word: גֹרֵי אֲרָיוֹת
  choice: 幼狮
  rationale: 该组合词指狮子的幼崽；“幼狮”是现代汉语中清楚自然的表达，并保留它与כְּפִרִים在平行结构中既相近又有区别的关系。
