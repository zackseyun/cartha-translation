base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/043.yaml
  text: Her cities have become a desolation[a], a dry land and a desert, a land where no one lives[c][b], and through which no son of man passes.
translation:
  language: zh_hans
  text: 她的城邑[a]都成了荒凉之地、干旱之地和荒漠[b]；其中无人居住，也无人经过[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文“她的城邑”中的后缀为阴性单数，指把巴比伦拟人化为女性；也可译作“它的城邑”。
    reason: lexical_alternative
  - marker: b
    text: “干旱之地和荒漠”也可译作“焦旱之地和荒原”。
    reason: lexical_alternative
  - marker: c
    text: 原文先后使用“任何人”和“人之子”，都是泛指人；前者指居民，后者指经过的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: עָרֶיהָ
  choice: 她的城邑
  rationale: 阴性单数后缀指向上下文中被拟人化为女性的巴比伦；用“她的”保留这一拟人表达，“城邑”则符合先知书的庄重语体。
- source_word: לְשַׁמָּה
  choice: 沦为废墟
  rationale: שַׁמָּה在此表示遭毁坏后的荒凉状态；“沦为废墟”既表达结果，也保留הָיוּ所含的状态转变。
- source_word: אֶרֶץ צִיָּה
  choice: 干旱之地
  rationale: צִיָּה指干燥、焦旱之地；此译准确、自然，并与下文“荒漠”区分。
- source_word: וַעֲרָבָה
  choice: 和荒漠
  rationale: עֲרָבָה可指干旱的平原、荒原或旷野；“荒漠”通俗而能体现其干旱荒芜的地貌。
- source_word: לֹא יֵשֵׁב בָּהֵן כָּל אִישׁ
  choice: 那里无人居住
  rationale: אִישׁ在否定结构中泛指任何人；“无人居住”是现代汉语中自然、准确的表达。
- source_word: וְלֹא יַעֲבֹר בָּהֵן בֶּן־אָדָם
  choice: 也无人经过
  rationale: בֶּן־אָדָם在此是泛指人类个体，并非专称；译作“无人”避免在中文中产生基督论专名的误读，“经过”准确表达עבר的穿行含义。
- source_word: הָיוּ
  choice: 已沦为
  rationale: 完成式在预言审判语境中突出所形成的结果状态；“已沦为”兼顾转变与结果。
theological_decisions:
- issue: בֶּן־אָדָם是否直译为“人子”
  choice: 无人
  alternative: 没有人子经过
  rationale: 本节的בֶּן־אָדָם是与אִישׁ平行的通用人类表达，并非称号；直译“人子”在现代中文圣经语境中容易被理解为特定的基督论称谓，因此正文按其语用意义译出，并在脚注说明原文形式。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“城邑”保留先知文学语感；“沦为废墟”表达审判造成的结果。末句将两个希伯来语泛称都自然译为“无人”，并以脚注保留其措辞差异。
