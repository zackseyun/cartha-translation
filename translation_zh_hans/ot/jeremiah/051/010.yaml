  text: הוֹצִ֥יא יְהוָ֖ה אֶת צִדְקֹתֵ֑י/נוּ בֹּ֚אוּ וּ/נְסַפְּרָ֣ה בְ/צִיּ֔וֹן אֶֽת מַעֲשֵׂ֖ה יְהוָ֥ה אֱלֹהֵֽי/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/010.yaml
  text: Yahweh has brought forth our vindication. Come[a], and let us recount in Zion the work of Yahweh our God.
translation:
  language: zh_hans
  text: 雅威已经为我们伸张了公道[a]。来吧，让我们在锡安述说我们上帝雅威的作为。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我们的公义”“我们的义行”或“我们的正义”。希伯来语原文为复数；它可指公义的行为，也可指一方正当的理由得到公开承认和昭雪。
    reason: 保留 צִדְקֹתֵינוּ 在公义行为、正义与公开昭雪之间的词义幅度。
lexical_decisions:
- source_word: הוֹצִיא
  choice: 伸张了
  rationale: 这是 יצא 的使役式，基本意象是“使出来、使显明”。与“公道”搭配译作“伸张”，自然表达雅威使其子民的正当理由公开显明。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语音译保留四字神名，将其作为专名呈现，而不以称号替代。
- source_word: צִדְקֹתֵינוּ
  choice: 为我们……公道
  rationale: 该词为复数，语义可涉及公义之举、正当理由或公开的裁断。结合巴比伦受审判、上帝子民获解救的语境，“为我们伸张了公道”最自然地表达公开昭雪之意，同时避免让读者误以为这里是在夸耀以色列的道德功绩。
- source_word: בֹּאוּ
  choice: 来吧
  rationale: 复数命令式，在此是号召众人一同参与；“来吧”保留劝勉语气。
- source_word: וּנְסַפְּרָה
  choice: 让我们……述说
  rationale: 第一人称复数鼓励式表达共同意愿；“让我们述说”既准确传达语气，也适合公开宣告上帝作为的场景。
- source_word: בְצִיּוֹן
  choice: 在锡安
  rationale: 介词 ב 在此作地点用法，“在锡安”直接保留其地理与圣约背景。
- source_word: מַעֲשֵׂה
  choice: 作为
  rationale: 单数名词意为行动、工作或所做之事；“作为”庄重自然，并保留所指范围的宽度。
- source_word: אֱלֹהֵינוּ
  choice: 我们的上帝
  rationale: 直接表达第一人称复数所属关系，保留群体与上帝之间的关系性表述。
theological_decisions:
- issue: צִדְקֹתֵינוּ 在本节中的含义
  choice: 为我们伸张了公道
  alternative: 使我们的公义／义行显明
  rationale: 上下文重在雅威为其子民采取公开行动，审判巴比伦并使子民的案件得到昭雪。因此正文采用法庭性、关系性的表达；脚注保留该复数名词也可能指公义或义行的语义张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“伸张公道”符合汉语习惯，并传达使正当理由公开显明的语境意义；“述说”和“作为”维持经文宣告性的文体。破折号突出“我们的上帝”是对雅威的同位说明。
