revisions:
- from: 示沙克竟被攻取了[a]，全地所赞美的竟被擒住了[b]！巴比伦竟在列国中沦为荒场[c]！
  to: 示沙克何竟被攻陷，全地所夸耀的何竟被夺取！巴比伦何竟成了列国中的荒凉之地！
  rationale: 将两个 אֵיךְ 明确译为“何竟”，以保留哀叹、惊愕的语气；将“被擒住”改为“被夺取”，避免抽象对象在汉语中被“擒”的不自然搭配；将“荒场”改为“荒凉之地”，更准确自然地表达 שַׁמָּה。脚注标记应分别紧随“示沙克”“全地所夸耀的”“荒凉之地”。
