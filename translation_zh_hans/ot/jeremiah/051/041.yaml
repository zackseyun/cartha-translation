review_pass:
  verdict: revise
  source_fidelity: 译文总体准确保留了“示沙克”与“巴比伦”并置、两次哀叹性 אֵיךְ，以及巴比伦由受赞誉转为荒废的反转。不过，“全地所赞美的竟被擒住了”把抽象的“受赞美者”译作人被擒，汉语搭配生硬；“荒场”也较少用于城市沦毁的语境。
  naturalness: “何竟”能在现代庄重汉语中自然表达哀叹和惊愕，且较“竟”更明确体现 אֵיךְ 的感叹功能。“全地所夸耀的何竟被夺取”保留原文拟人化的被动语态，同时比“被擒住”自然。“荒凉之地”清楚、现代，也适合先知性审判语境。
  terminology: “示沙克”作为专名音译可保留；脚注宜称其为指巴比伦的“暗号名称”，避免“密写名称”这一不够通行的说法。“列国”符合此处 גּוֹיִם 的广义和段落的庄重语体。
  issues:
  - severity: medium
    issue: “全地所赞美的竟被擒住了”搭配不自然。
    rationale: תְּהִלַּת כָּל־הָאָרֶץ 指“全地所赞美／夸耀的（对象）”，而 תפש 的被动在此是对巴比伦陷落的诗性描写。汉语“擒住”通常以人或动物为对象，改为“被夺取”既保留被动和反转，也更自然。
  - severity: low
    issue: “荒场”不够符合现代标准汉语中城市毁灭的通常表达。
    rationale: לְשַׁמָּה 表示荒废、毁灭并带有惊骇意味；“荒凉之地”更清楚自然，脚注可保留“惊骇”的附加语义。
  - severity: low
    issue: “密写名称”表述不够通行。
    rationale: 示沙克通常被理解为以字母替换形成、指向巴比伦的暗号名称；采用“暗号名称”更易懂，且不在正文替换专名。
  revised_text: 示沙克何竟被攻陷，全地所夸耀的何竟被夺取！巴比伦何竟成了列国中的荒凉之地！
  revised_footnotes:
