base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/041.yaml
  text: How Sheshak has been captured[c][b][a], and the praise of the whole earth seized! How Babylon has become a desolation among the nations!
translation:
  language: zh_hans
  text: 示沙克何竟被攻陷，全地所夸耀的何竟被夺取！巴比伦何竟成了列国中的荒凉之地！
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵיךְ
  choice: 竟
  rationale: 这里不是询问方式，而是表达震惊与哀叹；用“竟”自然传达感叹性的反问语气。
- source_word: נִלְכְּדָה
  choice: 被攻取了
  rationale: לכד 的尼法勒完成式表示城邑或势力被攻陷、夺取；“被攻取了”符合巴比伦陷落的语境。
- source_word: שֵׁשַׁךְ
  choice: 示沙克
  rationale: 按原文保留并音译这个名称，不在正文中直接替换为“巴比伦”；其通常被理解为巴比伦的密写名称，另加脚注说明。
- source_word: וַתִּתָּפֵשׂ
  choice: 竟被擒住了
  rationale: תפשׂ 表示抓住、擒获，与前句“被攻取”形成平行；被赞誉的巴比伦在此被拟人化为遭擒者。
- source_word: תְּהִלַּת כָּל הָאָרֶץ
  choice: 全地所赞美的
  rationale: תְּהִלָּה 可指“赞美”，也可转指受赞美者；译作“全地所赞美的”在现代汉语中通顺，并保留该短语对巴比伦声望的强调。
- source_word: הָיְתָה לְשַׁמָּה
  choice: 沦为荒场
  rationale: שַׁמָּה 描写毁灭后的荒凉，也可包含目睹者惊骇的意味；正文采用自然凝练的“沦为荒场”，并在脚注保留另一层语义。
- source_word: בַּגּוֹיִם
  choice: 在列国中
  rationale: גּוֹיִם 在此泛指各国、各民族；“列国”符合先知文学的庄重语体，也不引入后来的宗教分类。
