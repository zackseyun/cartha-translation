  yaml_path: translation/ot/jeremiah/051/054.yaml
  text: The sound of a cry comes from Babylon[a], and great destruction from the land of the Chaldeans.
translation:
  language: zh_hans
  text: 巴比伦传来哀号声，迦勒底人之地发生巨大的毁灭。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“从巴比伦传来呼喊声；迦勒底人之地发生巨大的崩毁。”
    reason: 原文为省略动词的平行结构；שֶׁבֶר也可较具体地译为“崩毁、破碎”。
lexical_decisions:
- source_word: ק֥וֹל זְעָקָ֖ה
  choice: 哀号声
  rationale: קוֹל与זְעָקָה构成听觉意象，指人在苦难中发出的呼喊；“哀号声”自然、凝练，并保留灾祸场景中的悲痛语气。
- source_word: מִ/בָּבֶ֑ל
  choice: 从巴比伦传来
  rationale: מִן表示声音的来源。原文是无动词结构，汉语补出“传来”，使句子自然完整而不改变意义。
- source_word: וְ/שֶׁ֥בֶר גָּד֖וֹל
  choice: 大毁灭的声响
  rationale: שֶׁבֶר可指破裂、崩毁或毁灭；此处在审判语境中表示规模巨大的毁灭。平行结构承接前面的קוֹל，译出“声响”以显明从当地传来的也是灾难造成的响动。
- source_word: מֵ/אֶ֥רֶץ כַּשְׂדִּֽים
  choice: 从迦勒底人之地
  rationale: אֶרֶץ指地域，כַּשְׂדִּים在形式上指迦勒底人；“迦勒底人之地”保留原文的族群—地域表达。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“哀号声”呈现קוֹל זְעָקָה的听觉与苦难色彩；正文适度补足“传来”和第二分句的“声响”，使希伯来语无动词结构在汉语中通顺，同时用脚注保留更贴近原文形式及שֶׁבֶר词义范围的译法。
