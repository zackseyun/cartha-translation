base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/023.yaml
  text: And with you I shattered the shepherd and his flock[a]; and with you I shattered the farmer and his team[c][b]; and with you I shattered governors and deputies.
translation:
  language: zh_hans
  text: 我借着你击碎[a]了牧人和他的羊群；我借着你击碎了农夫和他的一对耕畜[b]；我借着你击碎了总督和属官[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “击碎”也可译作“打得粉碎”；原文中的这个动词在本节重复三次。
    reason: lexical_alternative
  - marker: b
    text: “一对耕畜”也可译作“他的轭”或“他的一对牲畜”，指套轭耕作的一对牲畜。
    reason: lexical_alternative
  - marker: c
    text: “属官”也可泛译作“官员”。
    reason: lexical_alternative
lexical_decisions:
- source_word: נִפַּצְתִּי
  choice: 我……击碎了
  rationale: 该动词表示猛烈地打碎、砸碎。译作“击碎”既保留审判意象的力度，也适合本节三次重复所形成的节奏；汉语中的“了”对应希伯来语完成式，但不排除上下文中带有预告性或确定性的表达作用。
- source_word: בְךָ
  choice: 用你
  rationale: 介词在此表示工具或手段，巴比伦在上下文中是施行击打的工具。“用你”简洁自然，并保留原文反复出现的结构。
- source_word: רֹעֶה
  choice: 牧人
  rationale: 这里列举社会身份及其所属对象，普通的字面意义“牧人”最合适；不译作“牧者”，以免引入宗教职分的联想。
- source_word: עֶדְרוֹ
  choice: 他的羊群
  rationale: עֵדֶר可指羊群或畜群；与“牧人”搭配时，“羊群”是自然且具体的现代汉语表达。
- source_word: אִכָּר
  choice: 农夫
  rationale: 该词指耕种土地的人。“农夫”准确、简明，也比范围较窄的“耕田者”更自然。
- source_word: צִמְדּוֹ
  choice: 他的一对耕畜
  rationale: 该词可指成对套轭的牲畜，也可转指轭或一对之物。译文用“一对耕畜”清楚呈现农业场景，同时以注释保留词义歧义。
- source_word: פַּחוֹת
  choice: 省长
  rationale: פַּחָה指治理一省或一地区的长官。“省长”简洁地保留其行政层级。
- source_word: סְגָנִים
  choice: 副官
  rationale: 该词指地位次于主要长官的官员或代理者。“副官”体现其从属层级；注释列出较宽泛的“官员”，避免把古代职位过度具体化。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准汉语，保留原文三次“我用你击碎了”的排比。人物与其所属对象之间使用自然的汉语搭配，不引入后期宗教职分或现代行政制度之外的额外解释。
