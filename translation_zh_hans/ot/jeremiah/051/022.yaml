  text: וְ/נִפַּצְתִּ֤י בְ/ךָ֙ אִ֣ישׁ וְ/אִשָּׁ֔ה וְ/נִפַּצְתִּ֥י בְ/ךָ֖ זָקֵ֣ן וָ/נָ֑עַר וְ/נִפַּצְתִּ֣י בְ/ךָ֔ בָּח֖וּר וּ/בְתוּלָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/022.yaml
  text: And with you I will shatter man and woman; and with you I will shatter old man and youth; and with you I will shatter young man and virgin.
translation:
  language: zh_hans
  text: 我要用你击碎男人和女人，用你击碎老人和少年，用你击碎年轻男子和处女。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְנִפַּצְתִּי בְךָ
  choice: 我要用你击碎
  rationale: נפץ在此表示猛烈打碎、击碎；בְךָ具有工具性，译为“用你”，保留上文把巴比伦视为耶和华战争器械的意象。重复三次，以传达原文的排比和强调。
- source_word: אִישׁ וְאִשָּׁה
  choice: 男人和女人
  rationale: 直接表达性别成对的全称范围，语言自然清楚。
- source_word: זָקֵן וָנָעַר
  choice: 老人和少年
  rationale: זקן指年老者；נער可指男孩或年轻人，此处与老人相对，译“少年”既保留年龄对举，也避免与下一组בחור完全重合。
- source_word: בָּחוּר וּבְתוּלָה
  choice: 青年和少女
  rationale: בחור通常指年轻男子；בתולה通常指未婚年轻女子或处女。这里两者构成男女青年对举，正文译作自然的“青年和少女”，不额外强化婚姻或性经验含义。
theological_decisions:
- issue: 施行动作的主体与工具
  choice: 保留第一人称“我”和工具性“用你”
  alternative: 译成被动式，或把“你”处理为受击碎者
  rationale: 希伯来文第一人称动词明确指说话者执行行动，而בְךָ在上下文中最自然地表示借着“你”施行击碎；这种译法保留神作为行动主体、巴比伦作为工具的张力。
- issue: 成对列举的范围
  choice: 按原文逐组保留，不解释为特定社会阶层或象征群体
  alternative: 概括为“所有人”
  rationale: 三组对举共同表达全面性，但具体列举本身具有修辞力量，应予保留，不把其神学含义扩写进正文。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语；完整保留三次“用你击碎”的排比。用“少年”与“青年”分别对应נער和בחור，以反映原文词汇差异。
