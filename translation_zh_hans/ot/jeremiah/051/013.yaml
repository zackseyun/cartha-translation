  text: שכנתי עַל מַ֣יִם רַבִּ֔ים רַבַּ֖ת אֽוֹצָרֹ֑ת בָּ֥א קִצֵּ֖/ךְ אַמַּ֥ת בִּצְעֵֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/013.yaml
  text: You who dwell by many waters[a], rich in treasures, your end has come[b], the measure of your greed.
translation:
  language: zh_hans
  text: 你这住在众水之旁[a]、财宝丰厚的城啊，你的结局已经来到；你贪得不义之财的限度也已到了[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“住在众水之上”。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“你不义获利的肘尺”；“肘尺”在这里可能指量度或界限。
    reason: lexical_alternative
lexical_decisions:
- source_word: שכנתי
  choice: 你这住……的城啊
  rationale: 阴性单数分词在此呼语式地指向巴比伦这座被人格化的城；补出“城”可使现代汉语自然，并保留直接称呼。
- source_word: עַל מַיִם רַבִּים
  choice: 在众水之旁
  rationale: עַל 可表示“在……上、临、靠近”；巴比伦处于河流与水道之间，“在众水之旁”既自然又保留地理意象。
- source_word: רַבַּת אֹצָרוֹת
  choice: 财宝丰厚
  rationale: רַבַּת 表示众多、丰盛；“财宝丰厚”以简明庄重的现代汉语表达其富足。
- source_word: בָּא קִצֵּךְ
  choice: 你的结局已经来到
  rationale: 完成式在审判宣告中强调结局已确定并临到；“已经来到”保留其确定性。
- source_word: אַמַּת
  choice: 限度已到
  rationale: 字面为“肘尺”，在这里可引申为量度或界限；结合前句的“结局已经来到”，译为“限度已到”传达恶利已达所定界限。
- source_word: בִּצְעֵךְ
  choice: 你不义之财
  rationale: בצע 常指由贪婪、暴力或不公所得的利益；“不义之财”兼顾所得之物与负面的道德含义，避免仅译“贪心”而丢失“所得”的语义。
theological_decisions:
- issue: 人格化的受话者
  choice: 把巴比伦作为阴性单数、人格化的城直接称呼
  alternative: 泛指一名女性居民，或集体指居民
  rationale: 阴性单数形式及上下文符合先知文学将城市人格化为女性并直接发言的惯例；补出“城”只是明确语法所指，不添加宗派性解释。
- issue: אַמַּת בִּצְעֵךְ 的句法与意义
  choice: 理解为不义所得已达到所定限度
  alternative: 直译为“你不义之财的肘尺”或理解为所得的长度/数量
  rationale: 原文短语高度凝练，“肘尺”可能比喻量度、界限；正文用自然汉语表达最可能的语境意义，脚注保留字面形象与歧义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“众水”保留先知文学意象；“财宝丰厚”自然表达财富众多；分号后的短句保持审判宣告的力度。所有脚注标记均已置于正文相应位置。
