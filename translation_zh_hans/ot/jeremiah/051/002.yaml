base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/002.yaml
  text: And I will send strangers against Babylon, and they will winnow her and empty her land, for they will be against her from every side in the day of disaster.
translation:
  language: zh_hans
  text: 我要差遣外族人[a]往巴比伦去；他们要簸扬她[b]，掏空她的土地。因为在她遭灾的日子[c]，他们必从四面八方攻击她。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “外族人”也可译作“外来人”，指奉差遣来到巴比伦、敌对巴比伦的人。
    reason: lexical_alternative
  - marker: b
    text: “簸扬”也可理解为“扬散”；这里很可能有簸扬谷物的比喻。
    reason: lexical_alternative
  - marker: c
    text: “遭灾的日子”指灾祸临到巴比伦的时候；这里的“灾”不是指道德上的邪恶。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשִׁלַּחְתִּי
  choice: 我要差遣
  rationale: 连词加第一人称单数完成式处于先知审判宣告中，表达将来且确定的行动；译为“我要差遣”自然清楚。
- source_word: לְבָבֶל
  choice: 去攻击巴比伦
  rationale: לְ本身可表示趋向或目的地；结合受差遣者随后敌对巴比伦的语境，用“去攻击”明确其敌对使命，而不误解为受益关系。
- source_word: זָרִים
  choice: 外族人
  rationale: זָרִים指本族以外的人或外来者；“外族人”在现代汉语中自然，也符合外来军队攻击巴比伦的语境。
- source_word: וְזֵרוּהָ
  choice: 他们要簸扬她
  rationale: זרה具有簸扬、扬散谷物的意象；保留“簸扬”可呈现原文农业隐喻，而不把它仅概括为“驱散”。
- source_word: וִיבֹקְקוּ אֶת־אַרְצָהּ
  choice: 使她的土地空无一物
  rationale: בקק的核心意象是倒空、使空虚，在此指因毁坏而使土地荒空；该译法保留具体的“空”意象，并符合现代汉语。
- source_word: כִּי
  choice: 因为
  rationale: 引出前述审判行动的说明或理由；“因为”清楚表达句间关系。
- source_word: הָיוּ עָלֶיהָ
  choice: 他们必……攻击她
  rationale: 完成式在先知性语境中强调将来事件的确定性；עַל在敌对军事语境中表示临到并攻击，译为“必……攻击她”自然明确。
- source_word: מִסָּבִיב
  choice: 从四面八方
  rationale: 表达四周包围、各面受敌；“从四面八方”是自然的现代汉语军事图景。
- source_word: בְּיוֹם רָעָה
  choice: 在她遭灾的日子
  rationale: רָעָה在这里指灾祸而非道德上的邪恶；补出“她遭灾”使所指清楚，同时保留“日子”的审判表达。
