base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/004.yaml
  text: And the slain will fall in the land of the Chaldeans[b][a], and the pierced in her streets.
translation:
  language: zh_hans
  text: 被杀的人必倒在迦勒底人之地[a]，被刺透的人必倒在她的街道上[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“在迦勒底”，或“在巴比伦人之地”。希伯来文直译为“在迦勒底人之地”。
    reason: lexical_alternative
  - marker: b
    text: 或译“在她的广场上”或“在她的空旷处”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָפְלוּ
  choice: 必倒下
  rationale: 该动词为完成式，但在这段预告审判的先知话语中指将要发生的结果；“必”既表达预告的确定性，也符合现代汉语表达。为使两个并列群体的关系清楚，第二分句补出“必倒下”。
- source_word: חֲלָלִים
  choice: 被杀的人
  rationale: 该名词指遭杀害或受致命伤的人。“被杀的人”自然、庄重，并保留集合意义。
- source_word: בְּאֶרֶץ כַּשְׂדִּים
  choice: 在迦勒底人之地
  rationale: 原文明确使用族名“迦勒底人”；正文保留这一形式，不直接以解释性的“巴比伦人”替换。
- source_word: וּמְדֻקָּרִים
  choice: 被刺透的人
  rationale: 该被动分词指被武器刺穿的人。“被刺透”保留原文鲜明的暴力意象，比泛称“受伤的人”更准确。
- source_word: בְּחוּצוֹתֶיהָ
  choice: 在她的街道上
  rationale: חוּצוֹת可指街道、广场或城中的公共空地；此处“街道”最自然。阴性代词“她”保留原文对该地的拟人化指称。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重且易懂的书面普通话。保留“迦勒底人”这一原文族名，并以脚注提供地名及解释性译法；两个并列分句都明说“必倒下”，避免中文中第二项被误读为仅与地点短语连接。
