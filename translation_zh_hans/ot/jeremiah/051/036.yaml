id: JER.51.36
reference: Jeremiah 51:36
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: לָ/כֵ֗ן כֹּ֚ה אָמַ֣ר יְהוָ֔ה הִנְ/נִי רָב֙ אֶת רִיבֵ֔/ךְ וְ/נִקַּמְתִּ֖י אֶת נִקְמָתֵ֑/ךְ וְ/הַחֲרַבְתִּי֙ אֶת יַמָּ֔/הּ וְ/הֹבַשְׁתִּ֖י אֶת מְקוֹרָֽ/הּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/036.yaml
  text: 'Therefore thus says Yahweh: Behold[a], I am about to plead your case and take vengeance for you[c][b]; I will dry up her sea and make her spring dry.'
translation:
  language: zh_hans
  text: '所以，雅威如此说：

    “看哪，我要为你争讼[a]，

    替你报仇；

    我要使她的海干涸[b]，

    使她的泉源枯竭[c]。”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “为你争讼”也可译作“为你的案件申辩”或“为你的冤屈抗争”。原文采用动词与同根名词连用的法律争端用语。
    reason: lexical_alternative
  - marker: b
    text: 原文作“她的海”，把巴比伦拟人化为女性；也可按汉语非人格指称译作“它的海”。
    reason: personification
  - marker: c
    text: “泉源”也可译作“泉”或“水源”。
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: 所以
  rationale: 承接上文并引出推论；“所以”是现代汉语中自然、清楚的因果连接语。
- source_word: כֹּה אָמַר יְהוָה
  choice: 雅威如此说
  rationale: 保留先知宣告的使者公式，并以“雅威”直接呈现神圣四字名。
- source_word: הִנְנִי רָב
  choice: 看哪，我要……争讼
  rationale: הִנְנִי 配合分词突出说话者亲自介入并即将行动；“看哪，我要”在汉语中兼顾强调与临近行动的语气。
- source_word: רָב אֶת רִיבֵךְ
  choice: 为你争讼
  rationale: 动词 ריב 与同根名词 ריב 构成法律争讼用语；“为你争讼”保留法庭或争端语境，同时表达雅威接手对方的案件。
- source_word: וְנִקַּמְתִּי אֶת נִקְמָתֵךְ
  choice: 替你报仇
  rationale: 同根动词与名词强调施行报应；汉语用“替你报仇”自然表达代受害者执行公正报复，而不作生硬重复。
- source_word: וְהַחֲרַבְתִּי אֶת יַמָּהּ
  choice: 我要使她的海干涸
  rationale: 在“海”为宾语且与下一句平行时，חרב 的使役形式指使水域干涸；“她”保留巴比伦城的阴性拟人。
- source_word: וְהֹבַשְׁתִּי אֶת מְקוֹרָהּ
  choice: 使她的泉源枯竭
  rationale: יבש 的使役形式表示使之干枯；מָקוֹר 可指泉、泉眼或水源，“泉源枯竭”自然保留水源意象。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名；“雅威”以现代汉语音译呈现这一专名，不以称号代替。
- issue: 报仇语言的司法与个人维度
  choice: 替你报仇
  alternative: 为你伸冤；施行你的报应
  rationale: 原文兼有受害者得申雪与神执行报应的张力；正文保留“报仇”的强度，并由前句法律争讼语境约束其意义，不将其弱化为一般帮助。
- issue: 巴比伦的阴性拟人
  choice: 她的海／她的泉源
  alternative: 它的海／它的泉源
  rationale: 阴性单数后缀与城邑巴比伦的拟人相符；采用“她”保留原文形象，而不判断“海”和“泉源”究竟是字面水域还是象征性资源。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语，保留先知宣告公式、法律争讼意象、报仇措辞和巴比伦的阴性拟人。诗行分行呈现平行结构；避免把“海”和“泉源”限定为纯字面或纯隐喻。
