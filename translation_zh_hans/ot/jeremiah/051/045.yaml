source:
  edition: WLC
  text: צְא֤וּ מִ/תּוֹכָ/הּ֙ עַמִּ֔/י וּ/מַלְּט֖וּ אִ֣ישׁ אֶת נַפְשׁ֑/וֹ מֵ/חֲר֖וֹן אַף יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/045.yaml
  text: Come out from her midst[a], my people, and let each man save his life from the burning anger of Yahweh.
translation:
  language: zh_hans
  text: “我的子民啊，你们要从她中间出来！各人要保全自己的性命，脱离雅威的烈怒。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: צְאוּ
  choice: 要……出来
  rationale: 复数祈使式，表达紧迫的离开命令；现代汉语用“要……出来”自然而庄重。
- source_word: מִתּוֹכָהּ
  choice: 从她中间
  rationale: 保留阴性单数后缀所体现的城市拟人意象；上下文所指为巴比伦。
- source_word: עַמִּי
  choice: 我的子民哪
  rationale: 保留第一人称所属关系及立约语气；“哪”自然呈现呼语。
- source_word: וּמַלְּטוּ אִישׁ אֶת־נַפְשׁוֹ
  choice: 你们各人要救自己的性命
  rationale: מלט为复数祈使式，איש具有逐一分配的作用；נפש在审判与逃生语境中指人的性命，而非抽象的灵魂。
- source_word: מֵחֲרוֹן אַף
  choice: 逃离……的烈怒
  rationale: 介词מן表示避开或脱离；חרון אף是强烈愤怒的固定表达。“烈怒”简洁保留怒气炽烈的意味。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的专名形式，明确呈现四字神名，而不以“主”这一称号代替。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。中文正文采用广为人知且仍作专名使用的“耶和华”，不以称号“主”取代；“雅威”是较接近学术重构读音的可选译法。
- issue: 分配用法 אִישׁ 是否保留男性措辞
  choice: 你们各人
  alternative: 各人要救他自己的性命
  rationale: 此处איש主要承担“逐一、每一个”的分配功能；现代汉语“你们各人”准确涵盖受命群体，又避免生硬且不必要地限定男性。
- issue: נפש 的语境含义
  choice: 性命
  alternative: 自己／灵魂
  rationale: 在逃离即将临到的审判这一语境中，נפש指活着的生命或本人；译作“性命”最清楚，不引入身心二分的教义含义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以直接引语式呼告和感叹号传达两个复数祈使式的急迫性；保留“她”对巴比伦的拟人化指称。原文没有需要脚注才能保存的实质歧义，因此不设脚注。
