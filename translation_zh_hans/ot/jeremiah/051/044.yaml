  text: וּ/פָקַדְתִּ֨י עַל בֵּ֜ל בְּ/בָבֶ֗ל וְ/הֹצֵאתִ֤י אֶת בִּלְע/וֹ֙ מִ/פִּ֔י/ו וְ/לֹֽא יִנְהֲר֥וּ אֵלָ֛י/ו ע֖וֹד גּוֹיִ֑ם גַּם חוֹמַ֥ת בָּבֶ֖ל נָפָֽלָה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/044.yaml
  text: And I will punish Bel in Babylon[a], and I will bring out of his mouth what he has swallowed; nations will no longer stream to him[b]. Even the wall of Babylon has fallen.
translation:
  language: zh_hans
  text: “我要惩罚在巴比伦的彼勒，也要从他口中取出他所吞下的；列国必不再如水流般涌向他[a]。连巴比伦的城墙也已经倒塌了[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文动词描绘列国像水流一样汇聚；也可译作“列国必不再流向他”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“巴比伦的城墙也必倒塌。”原文可用完成式描述将来必然发生的事，仿佛它已经发生。
    reason: alternative_reading
lexical_decisions:
- source_word: וּפָקַדְתִּי עַל
  choice: 我要惩罚
  rationale: פָקַד 与 עַל 连用，在审判语境中表示追讨罪责、施行惩罚；“惩罚”在现代汉语中清楚传达其审判含义。
- source_word: בֵּל בְּבָבֶל
  choice: 在巴比伦的彼勒
  rationale: “彼勒”按专名音译；בְ 取地点义，说明彼勒受崇拜和受审判的所在，同时避免把地点关系悄然改成单纯的所属关系。
- source_word: וְהוֹצֵאתִי אֶת בִּלְעוֹ מִפִּיו
  choice: 也要从他口中取出他所吞下的
  rationale: 保留“吞下—从口中取出”的具体意象；הוֹצֵאתִי 是使役形，由上帝作主语，因此不改写成由彼勒主动“吐出”。
- source_word: וְלֹא יִנְהֲרוּ אֵלָיו עוֹד גּוֹיִם
  choice: 列国必不再如水流般涌向他
  rationale: נהר 描绘众民像水流一样汇聚；译文保留流动意象，并让“他”自然承接前面的彼勒。
- source_word: גַּם חוֹמַת בָּבֶל
  choice: 连巴比伦的城墙也
  rationale: גַּם 在此引出进一步且具高潮性的审判；“连……也”自然表达这种递进和强调。
- source_word: נָפָלָה
  choice: 已经倒塌了
  rationale: 保留希伯来语完成式的表达力度，将尚待发生却被视为确定的事件说成已经成就。
theological_decisions:
- issue: “他／他的”所指
  choice: 指彼勒，即巴比伦的神祇
  alternative: 可从更宽泛的修辞层面理解为人格化的巴比伦
  rationale: 最近的先行词是彼勒，“口中”和“涌向他”的连续意象也自然延续对彼勒的审判；同时，这一审判也关联巴比伦宗教与权势的崩溃。
- issue: נָפָלָה 的时态体貌
  choice: 按带预言力度的完成式译为“已经倒塌了”
  alternative: 按预告将来的事件译为“必倒塌”或“将要倒塌”
  rationale: 先知话语可用完成式把未来必然发生之事描写为已经发生；正文保留这种修辞张力，脚注说明未来式译法。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“彼勒”为神名音译；保留吞咽、口和水流等先知性意象。正文中的[a]、[b]分别紧随其所说明的语句，以避免脚注指向含混。
