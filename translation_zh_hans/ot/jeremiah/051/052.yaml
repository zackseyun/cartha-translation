id: JER.51.52
reference: Jeremiah 51:52
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: לָ/כֵ֞ן הִנֵּֽה יָמִ֤ים בָּאִים֙ נְאֻם יְהוָ֔ה וּ/פָקַדְתִּ֖י עַל פְּסִילֶ֑י/הָ וּ/בְ/כָל אַרְצָ֖/הּ יֶאֱנֹ֥ק חָלָֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/052.yaml
  text: Therefore[a], behold, days are coming, declares Yahweh, when I will punish her carved images, and throughout all her land the wounded will groan.
translation:
  language: zh_hans
  text: 所以，看哪，日子将到——这是雅威的宣告——那时，我必惩罚她雕刻的神像[a]；在她全境，受伤的人[b]都必呻吟。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“她的偶像”。原文特指雕刻而成、用于敬拜的神像。
    reason: 说明具体词义及较概括的译法。
  - marker: b
    text: 或译“被杀的人”。原词可指被刺伤、受重伤或被杀的人。
    reason: 保留 חָלָל 在战争语境中的词义幅度。
lexical_decisions:
- source_word: לָכֵן
  choice: 所以
  rationale: 承接上文的审判宣告，表达推论关系；“所以”自然清楚，同时保留原文连接作用。
- source_word: הִנֵּה
  choice: 看哪
  rationale: 保留先知话语中引人注意、郑重宣告的指示语气。
- source_word: יָמִים בָּאִים
  choice: 日子将到
  rationale: 采用简洁庄重的先知性表达，不额外限定具体日期。
- source_word: נְאֻם יְהוָה
  choice: 这是雅威的宣告
  rationale: 体现 נְאֻם 的权威性宣告功能，并直接音译神名 יהוה。
- source_word: וּפָקַדְתִּי עַל
  choice: 我必惩罚
  rationale: 在审判语境中，פקד על 表示追究、施罚；“惩罚”准确且通顺。
- source_word: פְּסִילֶיהָ
  choice: 她雕刻的神像
  rationale: 保留 פסיל 所指雕刻而成的祭祀形像这一具体含义，同时以脚注提示较概括的译法“偶像”。
- source_word: וּבְכָל אַרְצָהּ
  choice: 在她全境
  rationale: 简明表达审判遍及巴比伦全部疆域的范围。
- source_word: יֶאֱנֹק
  choice: 都必呻吟
  rationale: 表达人在痛苦中发出的呻吟；“都”使原文在全境中的分布性含义在中文中更自然。
- source_word: חָלָל
  choice: 受伤的人
  rationale: 该词可指被刺伤者或被杀者；与“呻吟”搭配时，“受伤的人”在语义上最连贯，同时以脚注保留另一常见理解。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”较贴近学界通常采用的拟音，也不以称号替代专名。
- issue: חָלָל 在本节是“受伤者”还是“被杀者”
  choice: 正文译“受伤的人”，脚注保留“被杀的人”
  alternative: 被杀的人
  rationale: חָלָל 在战争语境中常指被杀者，也可指被刺伤、受重伤者。因本句说他们“呻吟”，正文采用仍能发声的“受伤的人”，但不消除原词可能指阵亡者的张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“看哪”和“这是雅威的宣告”保留先知宣告的郑重语体；破折号划出插入的宣告公式，分号呈现审判偶像与全境伤亡两个彼此关联的结果。
