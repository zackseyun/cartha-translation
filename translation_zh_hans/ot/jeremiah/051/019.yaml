source:
  edition: WLC
  text: לֹֽא כְ/אֵ֜לֶּה חֵ֣לֶק יַעֲק֗וֹב כִּֽי יוֹצֵ֤ר הַ/כֹּל֙ ה֔וּא וְ/שֵׁ֖בֶט נַחֲלָת֑/וֹ יְהוָ֥ה צְבָא֖וֹת שְׁמֽ/וֹ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/019.yaml
  text: Not like these is the Portion of Jacob[a], for he is the one who formed everything, and Israel is the tribe of his inheritance[c][b]; Yahweh of Armies is his name.
translation:
  language: zh_hans
  text: 雅各所得的份不像这些[a]，因为他是塑造万有的主；他产业的支派也不像这些[b]。万军之耶和华是他的名[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译可作“雅各的份”。在上下文中，这主要指耶和华是雅各所得的份，与偶像形成对比。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“他产业的支派”，未明载其所指，也未重复“不像这些”。这里按上下文补出比较关系。耶利米书10:16的平行经文作“以色列是他产业的支派”。
    reason: alternative_reading
  - marker: c
    text: “耶和华”是神名 יהוה 的传统中文译法，也常音译为“雅威”；“万军”也可理解为“众军”。
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא כְאֵלֶּה
  choice: 不像这些
  rationale: 直译指示代词复数，承接上下文所说的偶像，保留原文鲜明的对比。
- source_word: חֵלֶק יַעֲקֹב
  choice: 雅各的分
  rationale: 保留构造短语的简洁和一定歧义；结合上下文，主要指耶和华是雅各所得的分，而不是偶像。
- source_word: יוֹצֵר הַכֹּל
  choice: 塑造万有的
  rationale: “塑造”贴近 יוצר 所表达的塑成、造作之意；“万有”自然地涵盖 הַכֹּל，凸显创造主与人手所造偶像的反差。
- source_word: וְשֵׁבֶט נַחֲלָתוֹ
  choice: 而雅各是他产业的支派
  rationale: שבט 在此按“支派、族群”理解，而非“权杖”。希伯来文本没有“以色列”一词；从前句的“雅各”承接主语，可使中文清楚，又不从平行经文增补“以色列”。
- source_word: יְהוָה צְבָאוֹת
  choice: 万军之耶和华
  rationale: 以现代中文圣经语体中清楚而庄重的表达翻译称号；“万军”保留 צבאות 的军旅及天上众军含义，“耶和华”直接标示专名。
- source_word: שְׁמוֹ
  choice: 是他的名
  rationale: 为希伯来语无系词句补出中文所需的“是”，同时保持原文措辞。
theological_decisions:
- issue: “雅各的分”所指为何
  choice: 保留“雅各的分”，让上下文表明它主要指耶和华是雅各所得的分
  alternative: 译作“雅各所得的分”或“雅各所拥有的产业”
  rationale: 原文构造短语本身简洁，语法上容许不同关系；上下文强烈支持耶和华作为雅各所得之分，但正文不必把这一关系完全解释化。
- issue: וְשֵׁבֶט נַחֲלָתוֹ 的隐含主语
  choice: 由前文补明为“雅各”，不增添马所拉文本没有的“以色列”
  alternative: 依据耶利米书10:16的平行句补作“以色列是他产业的支派”
  rationale: “雅各”与“以色列”在所指上相同，但本节所给希伯来文本没有 יִשְׂרָאֵל；采用前文已有名称可兼顾中文连贯和文本忠实。
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: “耶和华”是现代简体中文读者最普遍识别的专名形式，正文明确将四字神名作为名字而非普通称号呈现；脚注说明另一种常见音译。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“塑造万有”保留造物主与偶像制造者之间的关键词呼应；分号呈现两个彼此对应的身份陈述。所有解释性补足均在脚注中交代，正文不从平行经文增补“以色列”。
