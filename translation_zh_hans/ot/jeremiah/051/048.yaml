source:
  edition: WLC
  text: וְ/רִנְּנ֤וּ עַל בָּבֶל֙ שָׁמַ֣יִם וָ/אָ֔רֶץ וְ/כֹ֖ל אֲשֶׁ֣ר בָּ/הֶ֑ם כִּ֧י מִ/צָּפ֛וֹן יָבוֹא לָ֥/הּ הַ/שּׁוֹדְדִ֖ים נְאֻם יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/048.yaml
  text: Then heaven and earth[a], and all that is in them, will shout for joy over Babylon, for from the north destroyers will come against her[c][b], declares Yahweh.
translation:
  language: zh_hans
  text: 那时，天、地和其中的一切，都要因巴比伦欢呼[a]；因为毁灭者必从北方来攻击她[b]。这是雅威的宣告。[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “欢呼”也可译作“欢然歌唱”。
    reason: lexical_alternative
  - marker: b
    text: “来攻击她”，希伯来文直译为“来到她那里”；这里按毁灭者来临的敌对语境翻译。
    reason: lexical_alternative
  - marker: c
    text: “雅威”是希伯来文神名יהוה的音译；传统上也译作“耶和华”或以“主”代称。
    reason: alternative_reading
lexical_decisions:
- source_word: וְרִנְּנוּ
  choice: 都要……欢呼
  rationale: רנן表示发出喜乐、得胜的呼声。“欢呼”既保留声音和庆贺的意味，也符合现代汉语表达；句首的连接词结合上下文译为“那时”以推进预言结果。
- source_word: עַל בָּבֶל
  choice: 因巴比伦
  rationale: עַל与欢呼类动词连用时，可指欢喜的对象或缘由。这里的欢呼是因巴比伦受审判而起；“因巴比伦”保留这种关系，同时不把介词过度限定为某一种解释。
- source_word: שָׁמַיִם וָאָרֶץ וְכֹל אֲשֶׁר בָּהֶם
  choice: 天、地和其中的一切
  rationale: 这是涵盖整个受造界的并称。“天、地”简洁庄重，“其中的一切”贴近希伯来语关系从句。
- source_word: כִּי
  choice: 因为
  rationale: כִּי在此引出天地欢呼的原因，用“因为”清楚表达解释关系。
- source_word: מִצָּפוֹן
  choice: 从北方
  rationale: 直接保留方向含义，也呼应耶利米书中审判从北方临到的反复主题。
- source_word: יָבוֹא לָהּ
  choice: 来攻击她
  rationale: 字面为“来到她那里”，但主语是毁灭者，语境明显带敌对意味。“来攻击她”自然表达其军事性的来临；脚注保留较直译的形式。
- source_word: הַשּׁוֹדְדִים
  choice: 毁灭者
  rationale: שׁדד可指毁坏、蹂躏或掳掠；“毁灭者”最适合巴比伦遭毁灭的整体语境，同时不把含义缩窄为抢掠财物。
- source_word: נְאֻם יְהוָה
  choice: 这是雅威的宣告
  rationale: נְאֻם是庄严的先知宣告公式；译为“这是……的宣告”保留其神谕性质。יהוה以“雅威”呈现其专名性质。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名יהוה。“雅威”较直接呈现其专名性质；不以“主”替代，从而避免掩盖原文在此使用圣约之名的事实。
- issue: 受造界因巴比伦受审判而欢呼
  choice: 保留“因巴比伦欢呼”的张力
  alternative: 解释为“因巴比伦灭亡而欢呼”
  rationale: 原文只说עַל בָּבֶל，随后以毁灭者来临说明背景。正文不额外补入“灭亡”，让上下文说明欢呼的缘由，避免把介词关系解释得过满。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“那时”承接上文审判结果；分号区分受造界的欢呼与其原因。“这是雅威的宣告”作为独立短句，保留先知公式的郑重语气。所有脚注标记均在正文出现。
