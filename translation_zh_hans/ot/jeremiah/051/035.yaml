base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/035.yaml
  text: “My violence and my flesh be upon Babylon,” says the inhabitant of Zion[b][a]. “And my blood be upon the inhabitants of Chaldea,” says Jerusalem.
translation:
  language: zh_hans
  text: “愿我所受的暴行和我的肉身[a]都归到巴比伦头上！”锡安的居民要说；“愿我的血归到迦勒底居民头上[b]！”耶路撒冷要说。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“和我的身体”。这里的希伯来词传统上理解为“肉身”，也有人提出其他词源解释。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译为“我的血，向迦勒底居民”；这里依照与上句的平行关系，补出“愿……归到……头上”的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲמָסִי
  choice: 我所受的残暴
  rationale: חָמָס可指暴力、残暴或侵害；在锡安控诉巴比伦的语境中，第一人称后缀表示临到她身上的暴行，而非她施行的暴力。
- source_word: וּשְׁאֵרִי
  choice: 和我受伤的肉身
  rationale: 传统读法将שְׁאֵר理解为“肉身、身体”，并与下句“我流的血”平行；补出“受伤的”使现代汉语意义连贯，同时保留肉身意象。
- source_word: עַל בָּבֶל
  choice: 都归到巴比伦头上
  rationale: עַל在这一诅咒式名词句中表达让罪责及其后果落在巴比伦身上；“归到……头上”是自然且有司法色彩的汉语表达。
- source_word: תֹּאמַר
  choice: 要说
  rationale: 未完成式在先知话语中引出人物宣告；“要说”既保留形式，也适合此处的预告语气。
- source_word: יֹשֶׁבֶת צִיּוֹן
  choice: 住在锡安的女子
  rationale: 阴性单数分词将锡安人格化为一位女性居民；此译法保留其阴性单数形象，又不引入原文没有的“锡安女子”固定称谓。
- source_word: וְדָמִי
  choice: 我流的血
  rationale: דָּם带第一人称后缀，指耶路撒冷遭杀戮而流的血；“我流的血”在汉语中比生硬的“我的血”更清楚，并保持与肉身受害的平行。
- source_word: אֶל יֹשְׁבֵי כַשְׂדִּים
  choice: 归到迦勒底居民头上
  rationale: 原文用אֶל“向、到”，且省略了与上句平行的谓语；译文按平行关系补出“归到……头上”，同时以脚注注明字面形式。
- source_word: כַשְׂדִּים
  choice: 迦勒底
  rationale: 在“居民”之后按地域名称处理，译作“迦勒底居民”，符合希伯来语结构及现代汉语习惯。
- source_word: יְרוּשָׁלִָם
  choice: 耶路撒冷
  rationale: 采用现代中文圣经传统通行的专名译法。
theological_decisions:
- issue: 控诉是否表达愿罪责及报应临到巴比伦
  choice: 以“归到……头上”和“愿”呈现诅咒式诉求
  alternative: 仅直译为“在巴比伦之上／向迦勒底居民”
  rationale: 原文两个省略谓语的名词结构带有控诉和求报的效力；汉语若只保留介词会意义残缺。译文呈现其司法与祈愿色彩，但不进一步界定报应的具体方式。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。直接引语保留锡安与耶路撒冷的人格化声音；用“住在锡安的女子”体现原文阴性单数，用“归到……头上”传达诅咒式司法语气。
