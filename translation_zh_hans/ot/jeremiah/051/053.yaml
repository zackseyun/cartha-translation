  text: כִּֽי תַעֲלֶ֤ה בָבֶל֙ הַ/שָּׁמַ֔יִם וְ/כִ֥י תְבַצֵּ֖ר מְר֣וֹם עֻזָּ֑/הּ מֵ/אִתִּ֗/י יָבֹ֧אוּ שֹׁדְדִ֛ים לָ֖/הּ נְאֻם יְהוָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/053.yaml
  text: Though Babylon should ascend to the heavens[a], and though she should fortify her lofty stronghold, destroyers will come to her from me[b], declares Yahweh.
translation:
  language: zh_hans
  text: 巴比伦即使升到天上，即使她加固自己高耸的堡垒[b]，毁灭者[a]仍必从我而来，临到她。这是雅威的宣告。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“劫掠者”。这个希伯来词既可指毁坏者，也可指以劫掠施行毁坏的人。
    reason: lexical_alternative
  - marker: b
    text: 直译“她力量的高处”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי ... וְכִי
  choice: 即使……即使……
  rationale: 两个平行小句在语境中表达让步：无论巴比伦升得多高、防御多强，都不能逃避审判。
- source_word: תַעֲלֶה ... הַשָּׁמַיִם
  choice: 升到天上
  rationale: 保留עלה“上升”与שמים“天、诸天”的夸张性高处意象，并采用自然的现代汉语表达。
- source_word: תְבַצֵּר
  choice: 筑成堡垒
  rationale: Piel词形表示加固、使难以攻取；此译保留军事防御意味。
- source_word: מְרוֹם עֻזָּהּ
  choice: 她坚固的高处
  rationale: 该短语直译为“她力量的高处”。正文以自然汉语表达其高踞而坚固的防御位置，脚注保留原文结构。
- source_word: שֹׁדְדִים
  choice: 毁灭者
  rationale: 该词可指施行毁坏、劫掠的人；“毁灭者”符合审判语境，同时以脚注注明“劫掠者”这一真实词义选项。
- source_word: מֵאִתִּי יָבֹאוּ ... לָהּ
  choice: 仍要从我这里来到她那里
  rationale: 保留“从我而来”的来源含义和לָהּ“到她那里”的指向；“仍要”凸显前面让步条件不能阻止结果。
- source_word: נְאֻם
  choice: 这是……的宣告
  rationale: 采用庄重而清楚的先知宣告公式。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”较贴近学界通常重构的读音，也避免以称号替代专名。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。以两个“即使”保留原文平行的让步结构；用“她”延续巴比伦在希伯来语中的阴性指称和拟人表达。脚注标记均置于各自所说明的词语之后。
