  to: 巴比伦即使升到天上，即使她加固自己高耸的堡垒[b]，毁灭者[a]仍必从我而来，临到她。这是雅威的宣告。
  rationale: 修订以“加固”准确对应Piel形式的“设防、使坚固”，并以“高耸的堡垒”在上下文中自然表达高处的防御保障。将结果句调整为“从我而来，临到她”，保留雅威差遣毁灭者攻击巴比伦的含义，同时改善现代汉语流畅度。脚注锚点继续分别置于“毁灭者”和“堡垒”之后，与其说明对象一致。
