id: JER.51.25
reference: Jeremiah 51:25
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: הִנְ/נִ֨י אֵלֶ֜י/ךָ הַ֤ר הַ/מַּשְׁחִית֙ נְאֻם יְהוָ֔ה הַ/מַּשְׁחִ֖ית אֶת כָּל הָ/אָ֑רֶץ וְ/נָטִ֨יתִי אֶת יָדִ֜/י עָלֶ֗י/ךָ וְ/גִלְגַּלְתִּ֨י/ךָ֙ מִן הַ/סְּלָעִ֔ים וּ/נְתַתִּ֖י/ךָ לְ/הַ֥ר שְׂרֵפָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/025.yaml
  text: Behold, I am against you, O destroying mountain, declares Yahweh, which destroys the whole earth. I will stretch out my hand against you, and roll you down from the crags, and make you a burned mountain.
translation:
  language: zh_hans
  text: “看哪，毁灭之山，我与你为敌！这是雅威的宣告。你这毁灭全地[a]的山，我要伸手攻击你，把你从岩崖上滚下去，使你成为一座烧毁的山[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “全地”也可理解为“全世界”或“全境”。希伯来语 אֶרֶץ 可按语境指一片土地，也可指大地、世界。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“焚烧之山”或“一座被烧焦的山”。希伯来语短语十分凝练，既可能着重于焚烧的过程，也可能着重于烧毁后的状态。
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנְנִי אֵלֶיךָ
  choice: 看哪，我与你为敌
  rationale: 保留 הִנְנִי 的先知性提示语气，并将 אֵלֶיךָ 在审判语境中的敌对含义明确表达出来。
- source_word: הַר הַמַּשְׁחִית
  choice: 毁灭之山
  rationale: 保留“山”的隐喻，不直接释为巴比伦；“毁灭之山”也保留分词的主动、持续意味。
- source_word: נְאֻם יְהוָה
  choice: 这是雅威的宣告
  rationale: 以自然庄重的现代汉语表达先知书常见的宣告公式，并直接音译神名 יְהוָה。
- source_word: הַמַּשְׁחִית אֶת כָּל הָאָרֶץ
  choice: 你这毁灭全地的山
  rationale: 将重复的主动分词作为同位性称呼处理，既承接“毁灭之山”，也保留原文的修辞重复。
- source_word: וְנָטִיתִי אֶת יָדִי עָלֶיךָ
  choice: 我要伸手攻击你
  rationale: 保留神伸手施行审判的意象；“攻击你”清楚传达 עָלֶיךָ 在此处的敌对方向。
- source_word: וְגִלְגַּלְתִּיךָ מִן הַסְּלָעִים
  choice: 把你从岩崖上滚下去
  rationale: גּלל 表示滚动；סְלָעִים 可指岩石、峭壁或岩崖。“岩崖”与山的意象相合，“滚下去”体现语境中的向下运动。
- source_word: וּנְתַתִּיךָ לְהַר שְׂרֵפָה
  choice: 使你成为一座烧毁的山
  rationale: 将 נָתַן לְ 的结果义译为“使……成为”，并以“烧毁的山”表达 שְׂרֵפָה 可能指向的焚烧结果，同时用脚注保留过程性理解。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；采用“雅威”以体现其作为专名的性质，而不以称号替代。
- issue: הָאָרֶץ 的范围
  choice: 全地
  alternative: 全世界
  rationale: אֶרֶץ 既可指土地、地域，也可指大地或世界；正文用汉语中同样具有一定范围弹性的“全地”，脚注说明两种可能，避免过度限定。
- issue: 巴比伦与“山”的隐喻
  choice: 保留“毁灭之山”
  alternative: 释译为“毁灭者巴比伦”
  rationale: 经文以山称呼审判对象；不在正文中把隐喻解释掉，以保留其诗性张力及可能关联的高大、强权意象。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“看哪”保留先知宣告的肃穆力度；两次“毁灭”对应原文重复的分词。“岩崖”维持山体意象，整体避免文言化过重，也不将“山”直接解释为巴比伦。
