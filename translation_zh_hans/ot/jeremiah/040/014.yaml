  text: וַ/יֹּאמְר֣וּ אֵלָ֗י/ו הֲ/יָדֹ֤עַ תֵּדַע֙ כִּ֞י בַּעֲלִ֣יס מֶ֣לֶךְ בְּנֵֽי עַמּ֗וֹן שָׁלַח֙ אֶת יִשְׁמָעֵ֣אל בֶּן נְתַנְיָ֔ה לְ/הַכֹּתְ/ךָ֖ נָ֑פֶשׁ וְ/לֹא הֶאֱמִ֣ין לָ/הֶ֔ם גְּדַלְיָ֖הוּ בֶּן אֲחִיקָֽם׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/040/014.yaml
  text: And they said to him[b][a], “Do you really know that Baalis king of the Ammonites has sent Ishmael son of Nethaniah to strike you down?” But Gedaliah son of Ahikam did not believe them.
translation:
  language: zh_hans
  text: 他们对他说：“你真的知道[a]亚扪人的王巴利斯已经派尼探雅的儿子以实玛利来取你的性命[b]吗？”可是亚希甘的儿子基大利不相信他们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你确实知道……吗？”希伯来文用绝对不定式和同词根的限定动词连用，以加强语气。
    reason: lexical_alternative
  - marker: b
    text: 原文直译近于“在性命上击打你”，是指杀死或夺取性命的惯用语。
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲיָדֹעַ תֵּדַע
  choice: 你真的知道
  rationale: 希伯来文以绝对不定式配合同词根的限定动词，加强“知道”的语气；“真的”在现代汉语中自然地表达这种强调，同时不把问题过度限定为某一种确定性。
- source_word: בַּעֲלִיס
  choice: 巴利斯
  rationale: 按现代中文圣经人名的通行音译处理该专名。
- source_word: מֶלֶךְ בְּנֵי עַמּוֹן
  choice: 亚扪人的王
  rationale: 将字面上的“亚扪子孙之王”按现代汉语习惯译为族群称谓，准确而简洁。
- source_word: שָׁלַח
  choice: 已经派
  rationale: “已经”体现这一差遣先于当前警告，并与眼前危险密切相关；“派”自然对应派遣某人执行任务。
- source_word: יִשְׁמָעֵאל בֶּן נְתַנְיָה
  choice: 尼探雅的儿子以实玛利
  rationale: 采用中文圣经中通行的人名音译，并以自然汉语表达父子关系。
- source_word: לְהַכֹּתְךָ נָפֶשׁ
  choice: 来取你的性命
  rationale: 原文近于“在性命上击打你”，是指杀害的惯用表达；“取你的性命”既明确传达致死含义，也保留 נֶפֶשׁ 所带出的个人生命色彩。
- source_word: הֶאֱמִין לָהֶם
  choice: 不相信他们
  rationale: 此处指基大利不采信他们所报告的警告；“不相信他们”比“不信任他们”更准确地聚焦于信息是否可信。
- source_word: גְּדַלְיָהוּ בֶּן אֲחִיקָם
  choice: 亚希甘的儿子基大利
  rationale: 采用中文圣经中通行的人名音译，并清楚表达父子关系。
theological_decisions: []
