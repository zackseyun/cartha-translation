base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/040/012.yaml
  text: Then all the Judeans returned from all the places where they had been driven[a], and they came to the land of Judah, to Gedaliah at Mizpah[c][b], and gathered a very great abundance of wine and summer fruit.
translation:
  language: zh_hans
  text: 于是，所有犹大人[a]都从他们被赶逐[b]到的各处回来，来到犹大地，到米斯巴的基大利那里；他们收聚了极多的酒和夏季果实[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“所有犹太人”。原文称呼既可指犹大地的居民，也可引申指犹太人；这里译作“犹大人”，以突出当时犹大地的历史背景。
    reason: lexical_alternative
  - marker: b
    text: 或译“被放逐”或“被驱散”。
    reason: lexical_alternative
  - marker: c
    text: “夏季果实”指夏末或收获季节采集的当季果实或农产。
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּשֻׁבוּ
  choice: 回来
  rationale: שוב在连续叙事中表示实际返回原先所在之地；“回来”自然地传达这一方向和动作。
- source_word: כָל הַיְּהוּדִים
  choice: 所有犹大人
  rationale: 此处历史语境指犹大国之民，兼有地域和族群含义；“犹大人”比泛称“犹太人”更突出当时的历史背景。
- source_word: מִכָּל הַמְּקֹמוֹת
  choice: 从……各处
  rationale: 直接保留介词短语的来源意义，并以现代汉语自然表达复数地点。
- source_word: אֲשֶׁר נִדְּחוּ שָׁם
  choice: 他们被赶逐到的
  rationale: נדח的Niphal形式表达被动的驱离或放逐；“被赶逐”保留其被迫离散的语气，שָׁם依汉语句法融入“到的各处”。
- source_word: וַיָּבֹאוּ אֶרֶץ יְהוּדָה
  choice: 来到犹大地
  rationale: 自然表达进入并抵达犹大地域的动作，不额外强化原文未明确区分的“进入”语义。
- source_word: אֶל גְּדַלְיָהוּ הַמִּצְפָּתָה
  choice: 到米斯巴的基大利那里
  rationale: 方向词尾表明米斯巴是前往之处；这一译法清楚说明基大利位于米斯巴，同时保留“到他那里”的人际指向。
- source_word: וַיַּאַסְפוּ
  choice: 收聚
  rationale: אסף意为聚集、收集；“收聚”既适用于酒，也与当季农产的采收语境相合，而不把动作限定为狭义的“收割”。
- source_word: יַיִן
  choice: 酒
  rationale: יין通常指葡萄酒；在本节农产并列语境中译作简洁自然的“酒”。
- source_word: וָקַיִץ
  choice: 夏熟果子
  rationale: קיץ在此指夏季成熟并采收的果实或农产；“夏熟果子”既保留季节含义，也比字面“夏天的果子”更自然准确。
- source_word: הַרְבֵּה מְאֹד
  choice: 极多
  rationale: 两个词共同强化数量；“极多”简洁保留“非常多”的强调。
