  text: וַ/אֲנִ֗י הִנְ/נִ֤י יֹשֵׁב֙ בַּ/מִּצְפָּ֔ה לַֽ/עֲמֹד֙ לִ/פְנֵ֣י הַ/כַּשְׂדִּ֔ים אֲשֶׁ֥ר יָבֹ֖אוּ אֵלֵ֑י/נוּ וְ/אַתֶּ֡ם אִסְפוּ֩ יַ֨יִן וְ/קַ֜יִץ וְ/שֶׁ֗מֶן וְ/שִׂ֨מוּ֙ בִּ/כְלֵי/כֶ֔ם וּ/שְׁב֖וּ בְּ/עָרֵי/כֶ֥ם אֲשֶׁר תְּפַשְׂתֶּֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/040/010.yaml
  text: As for me[a], behold, I am staying at Mizpah to stand before the Chaldeans who come to us. But you, gather wine, summer fruit, and oil, put them in your containers[b], and dwell in your cities that you have taken.
translation:
  language: zh_hans
  text: 至于我，我就在米斯巴留守，站在那些来到我们这里的迦勒底人[a]面前[b]。你们却要收集葡萄酒、夏天的果子和油，装在你们的器皿里，并住在你们所占据的城中。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “迦勒底人”在这里也可译作“巴比伦人”。
    reason: lexical_alternative
  - marker: b
    text: “站在……面前”也可能含有以官员身份接待、应对或代表众人的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנְנִי
  choice: 我会
  rationale: הִנְנִי带有强调说话者当前承担之事的指示意味；结合后面的分词，在现代汉语中以“至于我，我会……”自然表达，而不生硬译作“看哪，我”。
- source_word: יֹשֵׁב
  choice: 留在
  rationale: 此处分词表示停留、驻留在米斯巴，并非字面上的坐着；“留在”符合基大利驻守并处理政务的语境。
- source_word: לַעֲמֹד לִפְנֵי
  choice: 站在……面前
  rationale: 保留希伯来语的形象和可能的官署语义，不在正文中单方面限定为“侍候”“代表”或“应对”；以脚注说明其职务性含义。
- source_word: הַכַּשְׂדִּים
  choice: 迦勒底人
  rationale: 直接译出希伯来语族名；在本语境中通常指巴比伦帝国人员，另以脚注说明。
- source_word: יָבֹאוּ אֵלֵינוּ
  choice: 到我们这里来的
  rationale: 自然涵盖未完成式所表达的预期或反复来到，不强行限定为一次性的将来事件。
- source_word: אִסְפוּ
  choice: 收集
  rationale: 命令式要求众人收取并聚拢所列物产；“收集”涵盖采收和储集，不把动作过度具体化。
- source_word: קַיִץ
  choice: 夏季果物
  rationale: 该词指夏季收获的果实或农产，常包括无花果；“夏季果物”保留季节含义，又不缩窄为某一种水果。
- source_word: שִׂימוּ בִּכְלֵיכֶם
  choice: 装在你们的器皿里
  rationale: כְּלִי泛指盛装物品的器具；“器皿”庄重且不限定材质、形状或具体种类。
- source_word: וּשְׁבוּ
  choice: 住在
  rationale: 此处ישב表示居住、定居，而非坐下；“住在”是自然清楚的现代汉语。
- source_word: תְּפַשְׂתֶּם
  choice: 所占领的
  rationale: 该动词表示取得并控制这些城；“占领”比泛泛的“取得”更清楚地传达战后控制的语境，同时不额外描写暴力过程。
theological_decisions:
- issue: לַעֲמֹד לִפְנֵי的职务性含义
  choice: 正文保留“站在……面前”
  alternative: 译作“出面应对”或“代表众人交涉”
  rationale: 原语习语可能包含侍立、履职或代表众人的意味，但并未明确限定具体职责；正文保留其开放性，脚注提示可能含义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“至于我……你们却……”保留原文对比结构；“留在”“住在”避免把ישב误解为字面坐姿。脚注标记已放在各自所解释的词语之后。
