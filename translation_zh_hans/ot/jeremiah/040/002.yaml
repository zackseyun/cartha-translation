base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/040/002.yaml
  text: Then the captain of the guard took Jeremiah and said to him[b][a], “Yahweh your God spoke this disaster against this place.”
translation:
  language: zh_hans
  text: 护卫长[b]把耶利米带来，对他说：“雅威——你的上帝——曾宣告这场灾祸[a]要临到这地方。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “灾祸”也可译作“灾难”或“祸患”；希伯来语 רָעָה 可按上下文指邪恶、伤害或灾祸。
    reason: lexical_alternative
  - marker: b
    text: “护卫长”所对应的希伯来语字面意思是“行刑者之首”，在这里是一个官职称谓。
    reason: cultural_note
lexical_decisions:
- source_word: רַב טַבָּחִים
  choice: 护卫长
  rationale: 这是巴比伦宫廷或军职称谓；字面与“行刑者之首”有关，但上下文指尼布撒拉旦所任的护卫长。
- source_word: וַיִּקַּח
  choice: 把……带来
  rationale: לקח基本义为“取、带”；此处表示护卫长将耶利米带到面前或置于自己看管之下，不额外限定具体动作。
- source_word: לְיִרְמְיָהוּ
  choice: 耶利米
  rationale: 采用现代中文圣经中通行的人名译法。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以音译呈现四字神名，保留其作为以色列上帝专名的性质，而不以称号替代。
- source_word: אֱלֹהֶיךָ
  choice: 你的上帝
  rationale: 保留第二人称阳性单数后缀，呈现护卫长对耶利米的直接称呼。
- source_word: דִּבֶּר
  choice: 曾宣告
  rationale: דבר基本义为“说”；在灾祸判语的语境中，“宣告”自然表达上帝先前所说的审判，同时不将其强化为经文未明说的技术性术语。
- source_word: הָרָעָה הַזֹּאת
  choice: 这场灾祸
  rationale: רָעָה可指邪恶、祸患或灾难；此处指临到耶路撒冷的毁灭性审判，“灾祸”既合语境，也保留其负面灾害含义。
- source_word: אֶל הַמָּקוֹם הַזֶּה
  choice: 要降……在这地方
  rationale: אֶל表达话语所指向的对象；中文以“降……在”自然传达灾祸针对并临到此地，未将其仅弱化为“论到”。
theological_decisions:
- issue: 上帝所说的 רָעָה 应理解为道德之恶还是灾难性审判
  choice: 这场灾祸
  alternative: 这恶事；这场灾难
  rationale: 上下文指耶路撒冷所遭的审判与毁灭，并非说雅威行了道德上的恶；“灾祸”准确表达语境，同时脚注保留该词的语义幅度。
- issue: דִּבֶּר אֶת הָרָעָה 的时间与施行关系
  choice: 曾宣告，要降这场灾祸
  alternative: 说过这场灾祸；宣告这场灾祸必临到
  rationale: 本节直接陈述雅威先前说出灾祸；中文补出“要降”使搭配自然，但不超出预告审判将针对该地的语境。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“把耶利米带来”保持动作含义的宽度；“雅威你的上帝”保留原文直接、略显突出的称呼方式。脚注标记均置于正文相关词语之后。
