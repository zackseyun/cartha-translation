source:
  edition: WLC
  text: וְ/יוֹחָנָ֣ן בֶּן קָרֵ֡חַ אָמַ֣ר אֶל גְּדַלְיָהוּ֩ בַ/סֵּ֨תֶר בַּ/מִּצְפָּ֜ה לֵ/אמֹ֗ר אֵ֤לְכָה נָּא֙ וְ/אַכֶּה֙ אֶת יִשְׁמָעֵ֣אל בֶּן נְתַנְיָ֔ה וְ/אִ֖ישׁ לֹ֣א יֵדָ֑ע לָ֧/מָּה יַכֶּ֣/כָּה נֶּ֗פֶשׁ וְ/נָפֹ֨צוּ֙ כָּל יְהוּדָ֔ה הַ/נִּקְבָּצִ֣ים אֵלֶ֔י/ךָ וְ/אָבְדָ֖ה שְׁאֵרִ֥ית יְהוּדָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/040/015.yaml
  text: Then Johanan son of Kareah said privately to Gedaliah at Mizpah[a], saying, “Please let me go and strike down Ishmael son of Nethaniah, and no one will know. Why should he take your life, so that all the Judahites who are gathered to you would be scattered[c][b], and the remnant of Judah would perish?”
translation:
  language: zh_hans
  text: 加利亚的儿子约哈难在米斯巴私下[a]对基大利说：“请让我去击杀尼探雅的儿子以实玛利，没有人会知道。他为什么要取你的性命[b]，使所有聚集到你这里的犹大人四散，犹大的余民灭亡呢？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“暗中”。
    reason: בַסֵּתֶר既可强调私下交谈，也可强调秘密行事。
  - marker: b
    text: 原文直译近于“他击打你——性命”。
    reason: 希伯来语表达凝缩；正文按语境译出“取你的性命”，脚注保留其特殊字面结构。
lexical_decisions:
- source_word: בַסֵּתֶר
  choice: 私下
  rationale: 该词可指隐秘处或秘密状态；在说话场景中作副词理解，译为“私下”自然地表达约哈难避开旁人进言。
- source_word: אֵלְכָה נָּא
  choice: 请让我去
  rationale: 意愿式配合נָא，表达带有恳求意味的提议；“请让我去”兼顾其意愿和礼貌语气。
- source_word: וְאַכֶּה
  choice: 杀掉
  rationale: נכה本义为“击打”，但这里所提议的是秘密除掉以实玛利，语境明确指致死；“杀掉”在现代汉语中比“击杀”自然，也不弱化行动性质。
- source_word: וְאִישׁ לֹא יֵדָע
  choice: 绝不会有人知道
  rationale: אִישׁ在否定句中泛指任何人；译作“不会有人”符合现代汉语，“绝”传达约哈难所作保证的确定语气。
- source_word: לָמָּה יַכֶּכָּה נֶּפֶשׁ
  choice: 何必让他取你的性命
  rationale: 原文结构凝缩，נֶפֶשׁ在此指人的性命；“取你的性命”清楚表达杀害之意，同时用脚注保留原文较生硬的字面形式。
- source_word: וְנָפֹצוּ
  choice: 四散
  rationale: 该动词表示被分散、离散；“四散”简洁自然，并准确呈现基大利遇害后群体离散的后果。
- source_word: כָּל יְהוּדָה הַנִּקְבָּצִים אֵלֶיךָ
  choice: 所有聚集到你这里的犹大人
  rationale: 这里的“犹大”指犹大群体而非单指地域；分词描述已经聚集并归附基大利的人，“聚集到你这里”保留אֵלֶיךָ的方向含义。
- source_word: שְׁאֵרִית יְהוּדָה
  choice: 犹大的余民
  rationale: שְׁאֵרִית指灾难后存留下来的群体；“余民”是简洁、庄重且符合先知书语境的译法。
- source_word: וְאָבְדָה
  choice: 灭亡
  rationale: אבד在此表示群体败亡、毁灭；“灭亡”与“余民”搭配自然，并传达结局的严重性。
theological_decisions:
- issue: “犹大的余民”的表达
  choice: 保留“余民”这一群体称谓
  alternative: 犹大剩下的人
  rationale: “余民”在本节首先是历史处境中的幸存群体，不额外加入任何特定神学解释；保留该词也维持其在先知书中的语义关联。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。人名地名沿用常见中文圣经译名；引语中的“何必……呢”保留原文劝阻性的反问语气，“使……四散，……灭亡”呈现基大利遇害可能引发的连锁后果。
