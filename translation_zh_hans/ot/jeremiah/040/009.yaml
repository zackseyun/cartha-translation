  register: 采用现代、庄重而易懂的叙事语言。亲属关系按汉语习惯明确译为“亚希甘的儿子、沙番的孙子”，避免连续“儿子”造成歧义；保留“迦勒底人”这一历史称谓，并用脚注说明。
