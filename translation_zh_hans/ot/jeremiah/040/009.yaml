base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/040/009.yaml
  text: Gedaliah son of Ahikam[a], son of Shaphan, swore to them and to their men, saying, “Do not be afraid to serve the Chaldeans. Live in the land and serve the king of Babylon, and it will go well for you.”
translation:
  language: zh_hans
  text: 亚希甘的儿子、沙番的孙子基大利向他们和他们的人起誓说：“不要怕服事迦勒底人[a]。你们要住在这地，服事巴比伦王，你们就必得福。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“巴比伦人”。希伯来原文作“迦勒底人”，这个称呼常用来指巴比伦的统治势力。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׁבַע
  choice: 起誓
  rationale: 该词为 שׁבע 的尼法勒式，在这里表示郑重起誓；“起誓”既保留正式语气，也符合现代汉语表达。
- source_word: לָהֶם ... וּלְאַנְשֵׁיהֶם
  choice: 向他们和他们的人
  rationale: אַנְשֵׁיהֶם 可指与他们一同的人、部属或随从；译作“他们的人”保留原文宽泛含义，不限定为士兵。
- source_word: מֵעֲבוֹד הַכַּשְׂדִּים
  choice: 怕服事迦勒底人
  rationale: 介词 מִן 接在“怕”之后，引出所惧怕之事；עבד 在此为政治上的臣服、效力。“不要怕服事”自然表达原文的劝告。
- source_word: הַכַּשְׂדִּים
  choice: 迦勒底人
  rationale: 原文使用具体的历史族群兼政治称谓“迦勒底人”；正文保留该称谓，并以脚注说明其常指巴比伦统治者。
- source_word: שְׁבוּ בָאָרֶץ
  choice: 住在这地
  rationale: ישׁב 可表示居住、停留；“住在这地”简洁自然，也保留安居当地的劝告。
- source_word: וְעִבְדוּ אֶת מֶלֶךְ בָּבֶל
  choice: 服事巴比伦王
  rationale: עבד 在政治语境中表示臣服并为统治者效力；“服事”与前一句呼应，保留其从属含义。
- source_word: וְיִיטַב לָכֶם
  choice: 就必平安无事
  rationale: 该希伯来语习语表示处境顺利、结果良好；“平安无事”在本段政治与生存语境中自然传达蒙受善待、境况安稳之意。
