  text: וְ/עוֹדֶ֣/נּוּ לֹֽא יָשׁ֗וּב וְ/שֻׁ֡בָ/ה אֶל גְּדַלְיָ֣ה בֶן אֲחִיקָ֣ם בֶּן שָׁפָ֡ן אֲשֶׁר֩ הִפְקִ֨יד מֶֽלֶךְ בָּבֶ֜ל בְּ/עָרֵ֣י יְהוּדָ֗ה וְ/שֵׁ֤ב אִתּ/וֹ֙ בְּ/ת֣וֹךְ הָ/עָ֔ם א֠וֹ אֶל כָּל הַ/יָּשָׁ֧ר בְּ/עֵינֶ֛י/ךָ לָ/לֶ֖כֶת לֵ֑ךְ וַ/יִּתֶּן ל֧/וֹ רַב טַבָּחִ֛ים אֲרֻחָ֥ה וּ/מַשְׂאֵ֖ת וַֽ/יְשַׁלְּחֵֽ/הוּ־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/040/005.yaml
  text: But since he still had not gone back[a], he said, “Go back to Gedaliah son of Ahikam, son of Shaphan, whom the king of Babylon has appointed over the cities of Judah, and live with him among the people[c][b]; or go wherever it seems right in your eyes to go.” Then the captain of the guard gave him provisions and a gift and sent him away.
translation:
  language: zh_hans
  text: '耶利米还没有回去[a]，护卫长便对他说：“你回到亚希甘的儿子、沙番的孙子基大利那里去吧。巴比伦王已经委派他管理犹大各城。你可以和他一起住在百姓中间；或者到你眼中看为合适的任何地方去吧。”于是，护卫长给了他口粮[b]和一份礼物[c]，送他离去。


    [a] 本节开头的希伯来文较难理解；也可理解为：“当他还没有回去时，〔护卫长对他说：〕‘你回到基大利那里去……’”


    [b] “口粮”也可译作“食物供应”。


    [c] “一份礼物”也可译作“一份赠礼”“津贴”或“份额”。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节开头的希伯来文较难理解；也可理解为：“当他还没有回去时，〔护卫长对他说：〕‘你回到基大利那里去……’”
    reason: alternative_reading
  - marker: b
    text: “口粮”也可译作“食物供应”。
    reason: lexical_alternative
  - marker: c
    text: “一份礼物”也可译作“一份赠礼”“津贴”或“份额”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעוֹדֶנּוּ לֹא יָשׁוּב
  choice: 耶利米还没有回去
  rationale: 原文句法困难且有所省略；此译保留“尚未回去”的核心含义，并在注释中列出另一种句法理解。为避免现代汉语代词指向不明，明示承接上下文的“耶利米”。
- source_word: וְשֻׁבָה
  choice: 你回到……那里去吧
  rationale: שוב的祈使形式表示返回；此处用现代汉语自然表达，同时保留行动方向。
- source_word: אֶל גְּדַלְיָה בֶן אֲחִיקָם בֶּן שָׁפָן
  choice: 到沙番的孙子、亚希甘的儿子基大利那里
  rationale: 按希伯来家谱关系清楚表达两代父系关系，并采用中文圣经传统中通行的人名音译。
- source_word: אֲשֶׁר הִפְקִיד מֶלֶךְ בָּבֶל בְּעָרֵי יְהוּדָה
  choice: 巴比伦王已经委派他管理犹大各城
  rationale: הִפְקִיד在此表示委派并赋予管理责任；“管理”自然传达其行政职权，而非单指所在地。
- source_word: וְשֵׁב אִתּוֹ בְּתוֹךְ הָעָם
  choice: 和他一起住在百姓中间
  rationale: ישב在此指居住、停留；译文保留“与他一起”和“在百姓中间”两个关系。
- source_word: אוֹ אֶל כָּל הַיָּשָׁר בְּעֵינֶיךָ לָלֶכֶת לֵךְ
  choice: 也可以到你眼中看为合适的任何地方去
  rationale: 保留“在你眼中看为合适”这一希伯来惯用语的形象，同时使现代中文通顺。
- source_word: רַב טַבָּחִים
  choice: 护卫长
  rationale: 这是尼布撒拉旦的官衔；“护卫长”在耶利米书语境中简洁准确，避免把职务仅限缩为行刑者。
- source_word: אֲרֻחָה
  choice: 口粮
  rationale: 该词指所供应的食物或定额粮食；此处处于获释离行的场景，“口粮”简明贴切，并以注释保留“食物供应”的可能。
- source_word: וּמַשְׂאֵת
  choice: 一份礼物
  rationale: 该词可指所给予的一份物品、份额或礼物；与口粮并列时，“一份礼物”最符合送行赠予的语境，同时用注释保留其他词义。
- source_word: וַיְשַׁלְּחֵהוּ
  choice: 送他离去
  rationale: 表达“送走、放行”的叙事动作，不额外限定其法律性质。
