source:
  edition: WLC
  text: וְ/גַ֣ם כָּֽל הַ/יְּהוּדִ֡ים אֲשֶׁר בְּ/מוֹאָ֣ב וּ/בִ/בְנֵֽי עַמּ֨וֹן וּ/בֶ/אֱד֜וֹם וַ/אֲשֶׁ֤ר בְּ/כָל הָֽ/אֲרָצוֹת֙ שָֽׁמְע֔וּ כִּֽי נָתַ֧ן מֶֽלֶךְ בָּבֶ֛ל שְׁאֵרִ֖ית לִֽ/יהוּדָ֑ה וְ/כִי֙ הִפְקִ֣יד עֲלֵי/הֶ֔ם אֶת גְּדַלְיָ֖הוּ בֶּן אֲחִיקָ֥ם בֶּן שָׁפָֽן־־׀־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/040/011.yaml
  text: Also[a], all the Judeans who were in Moab, among the Ammonites, in Edom, and in all the other lands heard that the king of Babylon had left a remnant for Judah and had appointed Gedaliah son of Ahikam, son of Shaphan, over them.
translation:
  language: zh_hans
  text: 此外，所有在摩押、亚扪人中、以东和各地的犹大人，都听说巴比伦王为犹大留下余民[a]，并委任沙番的儿子亚希甘的儿子基大利管理他们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “余民”也可译作“幸存者”；希伯来语这个词也可泛指灾难过后存留下来的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: 此外
  rationale: 承接上文并增添另一群人的消息；“此外”自然保留连接和递加作用。
- source_word: כָּל הַיְּהוּדִים
  choice: 所有……犹大人
  rationale: 此处处于犹大亡国及地域身份的语境，“犹大人”比后期宗教民族意义较强的“犹太人”更贴切，并保留 כָּל 的全称意味。
- source_word: אֲשֶׁר בְּמוֹאָב וּבִבְנֵי עַמּוֹן וּבֶאֱדוֹם
  choice: 住在摩押、亚扪人中、以东
  rationale: 按地理及族群表达分别处理；בְנֵי עַמּוֹן 在此自然译作“亚扪人”，介词关系译为“亚扪人中”。
- source_word: וַאֲשֶׁר בְּכָל הָאֲרָצוֹת
  choice: 以及其他各地
  rationale: 该短语把范围从已列举地区扩展至各处；“其他”为汉语语境中自然的隐含补足，不改变所指。
- source_word: שָׁמְעוּ
  choice: 听说
  rationale: 后接两个 כִּי 内容从句，汉语用“听说”自然表达获悉消息。
- source_word: כִּי נָתַן מֶלֶךְ בָּבֶל שְׁאֵרִית לִיהוּדָה
  choice: 巴比伦王给犹大留下一些余民
  rationale: נָתַן 在灾后语境中表达使人留下；“余民”保留 שְׁאֵרִית 的先知文学用语及潜在神学回响，“一些”使现代汉语顺畅而不限定具体数量。
- source_word: וְכִי הִפְקִיד עֲלֵיהֶם
  choice: 并且委派了……管理他们
  rationale: הִפְקִיד 的使役式在此指任命掌权；“委派……管理”清楚表达行政职权，同时避免生硬的“立在他们之上”。
- source_word: אֶת גְּדַלְיָהוּ בֶּן אֲחִיקָם בֶּן שָׁפָן
  choice: 沙番的孙子、亚希甘的儿子基大利
  rationale: 保留完整父系关系，并按现代汉语从远至近说明亲属关系，使长串谱系清晰易懂。
theological_decisions:
- issue: שְׁאֵרִית 的译法
  choice: 余民
  alternative: 幸存者；存留的人
  rationale: 该词可泛指灾难后存活下来的人，也在先知书中具有稳定的“余民”语汇回响。正文采用“余民”以保持关键词连续性，但以脚注说明其一般历史含义，不把本节的神学意义解释过度。
translation_notes:
  register: 采用现代、庄重且易懂的叙事体。“犹大人”体现亡国时期的地域与政治身份；地名采用通行圣经译名。正文中的脚注标记与脚注完全对应。
