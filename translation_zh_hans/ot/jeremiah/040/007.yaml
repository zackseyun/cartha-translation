source:
  edition: WLC
  text: וַ/יִּשְׁמְעוּ֩ כָל שָׂרֵ֨י הַ/חֲיָלִ֜ים אֲשֶׁ֣ר בַּ/שָּׂדֶ֗ה הֵ֚מָּה וְ/אַנְשֵׁי/הֶ֔ם כִּֽי הִפְקִ֧יד מֶֽלֶךְ בָּבֶ֛ל אֶת גְּדַלְיָ֥הוּ בֶן אֲחִיקָ֖ם בָּ/אָ֑רֶץ וְ/כִ֣י הִפְקִ֣יד אִתּ֗/וֹ אֲנָשִׁ֤ים וְ/נָשִׁים֙ וָ/טָ֔ף וּ/מִ/דַּלַּ֣ת הָ/אָ֔רֶץ מֵ/אֲשֶׁ֥ר לֹֽא הָגְל֖וּ בָּבֶֽלָ/ה־־־־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/040/007.yaml
  text: When all the commanders of the forces who were in the open country[a], they and their men, heard that the king of Babylon had appointed Gedaliah son of Ahikam over the land, and that he had entrusted to him men, women, children, and some of the poorest of the land, from those who had not been exiled to Babylon[c][b],
translation:
  language: zh_hans
  text: 在野外的所有军队首领和他们的部下，听说巴比伦王已经委任亚希甘的儿子基大利治理这地，又把没有被掳到巴比伦去的男人、女人、孩童和当地一些贫苦的人交给他管理[a]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节的句子在下一节继续。
    reason: 说明原文第7节是以“听见……”引出的未完从句，避免读者误以为本节自身构成完整句子。
lexical_decisions:
- source_word: שָׂרֵי הַחֲיָלִים
  choice: 军队首领
  rationale: שָׂרֵי 表示首领或长官，הַחֲיָלִים 在此指军事力量；“军队首领”自然且不强行限定具体军阶。
- source_word: בַּשָּׂדֶה
  choice: 在野外
  rationale: 字面为“在田野中”，本叙事语境指城镇之外的野外地区；“在野外”简洁并保留地点意味。
- source_word: וְאַנְשֵׁיהֶם
  choice: 和他们的部下
  rationale: 字面为“和他们的人”；军事语境中的“部下”既自然，也避免把所有人进一步明确为某一兵种。
- source_word: הִפְקִיד ... בָּאָרֶץ
  choice: 委任……治理这地
  rationale: 第一次 הִפְקִיד 表示正式委派权柄；结合 בָּאָרֶץ，译为“委任……治理这地”清楚表达管辖关系。
- source_word: הִפְקִיד אִתּוֹ
  choice: 交给他管理
  rationale: 第二次 הִפְקִיד 所涉及的是被安置在基大利权责之下的人；“交给他管理”保留托付和监管的含义。
- source_word: אֲנָשִׁים וְנָשִׁים וָטָף
  choice: 男人、女人、孩童
  rationale: טָף 指幼小的孩子或孩童；“孩童”庄重清楚，也保留其年龄较小的语感。
- source_word: מִדַּלַּת הָאָרֶץ
  choice: 当地一些贫苦的人
  rationale: מִן 具有部分义，דַּלַּת 指社会经济地位低下的人群；此译同时体现“一些”和贫苦卑微的处境。
- source_word: מֵאֲשֶׁר לֹא הָגְלוּ בָּבֶלָה
  choice: 没有被掳到巴比伦去的
  rationale: 原文为复数主动式但施事者未明说，汉语用“被掳”自然地保留受事焦点，并符合被迫迁移的历史语境。
- source_word: וַיִּשְׁמְעוּ
  choice: 听说
  rationale: 叙事性的 waw 推进事件；本节在句法上通向下一节，中文以“听说……”开头并以逗号收束，可保留未完待续的从句结构，无须增添“那时”等原文没有的明确时间词。
theological_decisions: []
