source:
  edition: WLC
  text: וַ/יָּבֵ֥א וַ/יַּ֛עַשׂ יְהוָ֖ה כַּ/אֲשֶׁ֣ר דִּבֵּ֑ר כִּֽי חֲטָאתֶ֤ם לַֽ/יהוָה֙ וְ/לֹֽא שְׁמַעְתֶּ֣ם בְּ/קוֹל֔/וֹ וְ/הָיָ֥ה לָ/כֶ֖ם דבר הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/040/003.yaml
  text: And Yahweh has brought it about and has done just as he said[a], because you sinned against Yahweh and did not listen to his voice[b]; therefore this thing has happened to you.
translation:
  language: zh_hans
  text: 雅威使这事临到，也照他所说的做了；因为你们得罪了雅威，不听从他的声音[a]，所以这事临到了你们[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“不服从他。”希伯来语“听从某人的声音”常含有顺服、听命的意思。
    reason: lexical_alternative
  - marker: b
    text: 或译：“这场灾祸临到了你们。”原文“这事”在这里可具体指刚才所说的灾祸。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֵא
  choice: 使这事临到
  rationale: 此处是 בוא 的使役形式，指雅威使先前宣告的灾祸成为现实。原文宾语未明说，中文按上下文补出“这事”，以使句意完整。
- source_word: וַיַּעַשׂ
  choice: 做了
  rationale: 保留 עשה“做、行”的基本意义，并与“照他所说的”连用，表达雅威执行了先前宣告的审判。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常用音译呈现四字神名，而不以称号代替。
- source_word: כַּאֲשֶׁר דִּבֵּר
  choice: 照他所说的
  rationale: 自然地表达事件与雅威先前话语之间的应验关系。
- source_word: כִּי
  choice: 因为
  rationale: 这里引出审判临到的原因。
- source_word: חֲטָאתֶם לַיהוָה
  choice: 你们得罪了雅威
  rationale: “得罪”符合现代汉语习惯，也准确表达向雅威犯罪、冒犯雅威之意。
- source_word: וְלֹא שְׁמַעְתֶּם בְּקוֹלוֹ
  choice: 不听从他的声音
  rationale: 既保留原文“听……声音”的意象，又用“听从”传达该希伯来语习语所含的顺服意味。
- source_word: וְהָיָה לָכֶם דבר הַזֶּה
  choice: 所以这事临到了你们
  rationale: 以自然中文表达这种局面或事件落到听者身上，同时保留 דבר הַזֶּה 较宽泛的“这事”。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；正文采用“雅威”这一较贴近 Yahweh 的现代汉语音译，不用“主”等称号替代。
- issue: שׁמע בקולו 是否明确译成“服从”
  choice: 不听从他的声音
  alternative: 不服从他
  rationale: “听从”呈现顺服的含义，同时保留原文关于“声音”的具体意象，避免把习语完全抽象化。
- issue: דבר הזה 是否明确译为“这场灾祸”
  choice: 这事
  alternative: 这场灾祸
  rationale: 上下文确实指灾祸，但原词 דבר 本身较宽泛；正文保留这种宽度，在脚注说明具体化的可能译法。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“使这事临到……这事临到了你们”的重复有意对应原文首尾呼应；分号清楚呈现宣告、原因和结果之间的关系。
