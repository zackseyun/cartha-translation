  text: וַ/יָּבֹ֥אוּ אֶל גְּדַלְיָ֖ה הַ/מִּצְפָּ֑תָ/ה וְ/יִשְׁמָעֵ֣אל בֶּן נְתַנְיָ֡הוּ וְ/יוֹחָנָ֣ן וְ/יוֹנָתָ֣ן בְּנֵֽי קָ֠רֵחַ וּ/שְׂרָיָ֨ה בֶן תַּנְחֻ֜מֶת וּ/בְנֵ֣י עופי הַ/נְּטֹפָתִ֗י וִֽ/יזַנְיָ֨הוּ֙ בֶּן הַ/מַּ֣עֲכָתִ֔י הֵ֖מָּה וְ/אַנְשֵׁי/הֶֽם־־־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/040/008.yaml
  text: Then Ishmael son of Nethaniah[a], and Johanan and Jonathan the sons of Kareah, and Seraiah son of Tanhumeth, and the sons of Ephai the Netophathite[b], and Jezaniah son of the Maacathite—they and their men—came to Gedaliah at Mizpah.
translation:
  language: zh_hans
  text: 于是，尼探雅的儿子以实玛利、加利亚的儿子约哈难和约拿单、单户篾的儿子西莱雅、尼陀法人以斐[a]的儿子们，以及玛迦人的儿子耶撒尼亚[b]，他们和他们的人都到米斯巴去见基大利。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “以斐”也可音译为“俄斐”；这个希伯来人名的音译并不完全确定。
    reason: lexical_alternative
  - marker: b
    text: “耶撒尼亚”也可按较完整的希伯来语形式音译为“耶撒尼雅胡”；有人认为此名与别处译作“雅撒尼亚”的名字属于同一形式。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: 来到
  rationale: בוא在连续叙事中表示发生的简单动作；以基大利为叙述落点，译作“来到”自然准确。
- source_word: אֶל גְּדַלְיָה הַמִּצְפָּתָה
  choice: 来到米斯巴的基大利那里
  rationale: 地点名带方向词尾־ָה，表明朝米斯巴而去；现代汉语把地点作为基大利所在之处来表达，既自然，也保留移动方向。
- source_word: וְיִשְׁמָעֵאל בֶּן נְתַנְיָהוּ
  choice: 尼探雅的儿子以实玛利
  rationale: 按现代汉语习惯先交代父名关系，再列本人姓名。
- source_word: וְיוֹחָנָן וְיוֹנָתָן בְּנֵי קָרֵחַ
  choice: 加利亚的儿子约哈难和约拿单
  rationale: 复数“儿子”同时统摄约哈难和约拿单；译文明确保留二人同为加利亚之子的关系。
- source_word: וּשְׂרָיָה בֶן תַּנְחֻמֶת
  choice: 单户篾的儿子西莱雅
  rationale: 保留原文明确的父子关系，并采用通行、可辨识的中文圣经人名形式。
- source_word: וּבְנֵי עופי הַנְּטֹפָתִי
  choice: 尼陀法人以斐的儿子们
  rationale: 单数族属称谓“尼陀法人”最自然地修饰以斐，复数בְנֵי明确译为“儿子们”。
- source_word: וִיזַנְיָהוּ בֶּן הַמַּעֲכָתִי
  choice: 一个玛迦人的儿子耶撒尼亚
  rationale: 原文有定冠词的族属称谓而未给出父亲姓名；译作“一个玛迦人的儿子”避免误把“玛迦人”当作专名。
- source_word: הֵמָּה וְאַנְשֵׁיהֶם
  choice: 都带着各自的人
  rationale: 强调所列首领本人及其随从一同前来；“各自的人”准确反映复数领属后缀。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事体。为符合汉语姓名表达习惯，将各组父子关系置于本人姓名之前；结尾集中表达众首领及其随从前往基大利处。英文咨询层的脚注标记位置与脚注内容不相符，故依据实际所注词项，将[a]置于“以斐”后、[b]置于“耶撒尼亚”后。
