  text: But Gedaliah son of Ahikam said to Johanan son of Kareah, “Do not do this thing, for you are speaking a lie about Ishmael.”
translation:
  language: zh_hans
  text: 亚希甘的儿子基大利却对加利亚的儿子约哈难说：“你不可做这事，因为你所说有关以实玛利的话是谎话。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַל תעש אֶת־הַדָּבָר הַזֶּה
  choice: 你不可做这事
  rationale: 按上下文指约哈难所提议的行动；保留希伯来文简洁而强烈的禁止语气。马所拉文本中的 תעש 按传统读法理解为 תַּעֲשֶׂה。
- source_word: כִּי שֶׁקֶר אַתָּה דֹבֵר אֶל־יִשְׁמָעֵאל
  choice: 因为你论到以实玛利所说的是谎话
  rationale: שֶׁקֶר 是名词“谎话、虚假之言”；此处介词 אֶל 结合语境自然表达为“论到、关于”，即基大利认定约哈难针对以实玛利的指控不实。
theological_decisions:
- issue: 基大利对约哈难指控的判断强度
  choice: 所说的是谎话
  alternative: 你说的并不属实
  rationale: 原文使用名词 שֶׁקֶר，措辞直接强烈；译作“谎话”保留这一力度，但不额外断定约哈难是否蓄意欺骗。
translation_notes:
