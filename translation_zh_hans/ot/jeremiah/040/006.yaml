revisions:
- from: 于是，耶利米到米斯巴的亚希甘之子基大利那里去，和他一起住在仍留在这地的百姓中间。
  to: 于是，耶利米到米斯巴去见亚希甘的儿子基大利，并与他一同住在留在这地的百姓中间。
  rationale: 修订将“米斯巴”明确为耶利米前往基大利所在之处，避免原译中地点定语修饰人名造成的生硬与歧义。保留叙事承接、父名结构、与基大利同住，以及留在当地的百姓这一全部信息；未将“留下的人”神学化为“余民”。
