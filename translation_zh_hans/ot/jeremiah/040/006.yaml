source:
  edition: WLC
  text: וַ/יָּבֹ֧א יִרְמְיָ֛הוּ אֶל גְּדַלְיָ֥ה בֶן אֲחִיקָ֖ם הַ/מִּצְפָּ֑תָ/ה וַ/יֵּ֤שֶׁב אִתּ/וֹ֙ בְּ/ת֣וֹךְ הָ/עָ֔ם הַ/נִּשְׁאָרִ֖ים בָּ/אָֽרֶץ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/040/006.yaml
  text: So Jeremiah went to Gedaliah son of Ahikam at Mizpah[a], and he lived with him among the people who were left in the land.
translation:
  language: zh_hans
  text: 于是，耶利米到米斯巴去见亚希甘的儿子基大利，并与他一同住在留在这地的百姓中间。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹא
  choice: 到……那里去
  rationale: בוא在叙事中可按视角译为“来”或“去”；此处描述耶利米前往基大利所在之处，用“到……那里去”自然表达移动及抵达。
- source_word: גְּדַלְיָה בֶן אֲחִיקָם
  choice: 亚希甘之子基大利
  rationale: 保留希伯来语父名结构，同时采用现代中文圣经人名的通行音译。
- source_word: הַמִּצְפָּתָה
  choice: 米斯巴的
  rationale: 地名带方向词尾，表明目的地；结合前面的“到基大利那里去”，译作“米斯巴的……那里”既说明基大利所在地点，也避免重复使用“到”。
- source_word: וַיֵּשֶׁב
  choice: 住
  rationale: ישב在定居语境中表示居住、停留；“住”比字面的“坐”准确，也不限定停留时间长短。
- source_word: אִתּוֹ
  choice: 和他一起
  rationale: 自然表达与基大利同住的伴随关系。
- source_word: בְּתוֹךְ הָעָם
  choice: 在……百姓中间
  rationale: 准确保留“处于群体之中”的社会性和空间性含义，语言自然庄重。
- source_word: הַנִּשְׁאָרִים
  choice: 仍留……的
  rationale: 该词是שׁאר的尼法勒分词，描述那些被留下或继续留下的人；用“仍留”保留状态含义，不将其名词化为带有较强神学色彩的“余民”。
- source_word: בָּאָרֶץ
  choice: 在这地
  rationale: 原文直译为“在那地/这地”；上下文所指为犹大地，但本节没有明说“犹大”，故不增补专名。
theological_decisions:
- issue: 是否将הַנִּשְׁאָרִים译为神学术语“余民”
  choice: 仍留在这地的百姓
  alternative: 这地的余民；留在这地的百姓
  rationale: 原文使用分词性描述，而非明确的技术性名词。译成“仍留在这地的百姓”保留其直接语义，也避免加入经文本身未明确表达的神学定位。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“于是”承接希伯来叙事链；句序略作中文化调整，但保留地点、同住关系及百姓仍留在当地等全部信息。
