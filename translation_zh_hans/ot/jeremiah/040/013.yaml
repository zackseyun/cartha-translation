base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/040/013.yaml
  text: And Johanan son of Kareah[a], and all the commanders of the forces who were in the open country, came to Gedaliah at Mizpah.
translation:
  language: zh_hans
  text: 加利亚的儿子约哈难和所有在乡野[a]的军队首领，都来到米斯巴的基大利那里。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“田野”。这里的希伯来语既可较具体地指田野，也可较广泛地指野外或乡间地区。
    reason: 保留 אֲשֶׁר בַּשָּׂדֶה 的词义范围，不把其地理含义限定得过窄。
lexical_decisions:
- source_word: וְ/יֽוֹחָנָן בֶּן קָרֵחַ
  choice: 加利亚的儿子约哈难
  rationale: 按希伯来语父名结构自然表达；句首连接词 וְ 不机械译出，以现代汉语的并列结构承接上下文，避免擅自限定为“于是”或“后来”。
- source_word: וְ/כָל שָׂרֵי הַ/חֲיָלִים
  choice: 以及所有……军队首领
  rationale: שָׂרֵי 指军事领袖或指挥官，הַחֲיָלִים 在本段语境中指军队或武装力量；“军队首领”庄重自然，也不额外规定具体军衔。
- source_word: אֲשֶׁר בַּ/שָּׂדֶה
  choice: 在乡野[a]的
  rationale: שָׂדֶה 可指田地、野外或较广义的乡间地区；正文采用自然且符合地理语境的“乡野”，脚注保留较字面的译法。
- source_word: בָּ֥אוּ אֶל גְּדַלְיָהוּ
  choice: 来到……基大利那里
  rationale: בוא 在此表示朝向所述目的地而来，אֶל 表示趋向基大利；“来到……那里”符合现代汉语叙事习惯。
- source_word: הַ/מִּצְפָּתָ/ה
  choice: 米斯巴的
  rationale: 地名后的方向词尾表明朝米斯巴而去；结合 אֶל גְּדַלְיָהוּ，译为“来到米斯巴的基大利那里”，既保留目的地含义，又避免汉语中连续重复“到”。
theological_decisions: []
