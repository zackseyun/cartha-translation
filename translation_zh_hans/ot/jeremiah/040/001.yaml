source:
  edition: WLC
  text: הַ/דָּבָ֞ר אֲשֶׁר הָיָ֤ה אֶֽל יִרְמְיָ֨הוּ֙ מֵ/אֵ֣ת יְהוָ֔ה אַחַ֣ר שַׁלַּ֣ח אֹת֗/וֹ נְבוּזַרְאֲדָ֛ן רַב טַבָּחִ֖ים מִן הָֽ/רָמָ֑ה בְּ/קַחְתּ֣/וֹ אֹת֗/וֹ וְ/הֽוּא אָס֤וּר בָּֽ/אזִקִּים֙ בְּ/ת֨וֹךְ כָּל גָּל֤וּת יְרוּשָׁלִַ֨ם֙ וִֽ/יהוּדָ֔ה הַ/מֻּגְלִ֖ים בָּבֶֽלָ/ה־־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/040/001.yaml
  text: 'The word that came to Jeremiah from Yahweh after Nebuzaradan[a], the captain of the guard, had sent him away from Ramah, when he had taken him while he was bound in chains among all the exiles of Jerusalem and Judah who were being exiled to Babylon:'
translation:
  language: zh_hans
  text: 耶和华的话临到耶利米，是在护卫长尼布撒拉旦[a]从拉玛释放他以后；尼布撒拉旦带走他时，他正戴着镣铐，混在所有从耶路撒冷和犹大被掳往巴比伦的人中间。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “护卫长”也可译作“行刑官长”；希伯来语字面意为“宰杀者之长”，所指可能是兼负行刑职责的王室卫队长官。
    reason: 保留 רַב טַבָּחִים 这一官衔的字面含义及职能上的不确定性。
lexical_decisions:
- source_word: הַדָּבָר אֲשֶׁר הָיָה אֶל יִרְמְיָהוּ מֵאֵת יְהוָה
  choice: 耶和华的话临到耶利米
  rationale: 采用先知书中自然庄重的启示公式；“话”保留 דָּבָר 的传统表达，“临到”对应 הָיָה אֶל，神名按现代中文圣经惯例译作“耶和华”。
- source_word: אַחַר שַׁלַּח אֹתוֹ ... מִן הָרָמָה
  choice: 在……从拉玛放他走以后
  rationale: שׁלח 在此语境指从拘押状态中放行；“放他走”比“打发他”更清楚，又不额外说明正式释放程序。
- source_word: נְבוּזַרְאֲדָן
  choice: 尼布撒拉旦
  rationale: 采用现代中文圣经中通行的人名音译。
- source_word: רַב טַבָּחִים
  choice: 护卫长
  rationale: 这是巴比伦宫廷高级官衔，可能兼有处决职责；正文采用读者易懂的职务名称，较字面的译法置于脚注。
- source_word: בְּקַחְתּוֹ אֹתוֹ
  choice: 当时，尼布撒拉旦带走了他
  rationale: בְּ 加不定词结构表示时间或伴随情形。“带走”保留 לקח 的基本动作，并以专名消除连续代词可能造成的中文歧义。
- source_word: וְהוּא אָסוּר בָּאזִקִּים
  choice: 他戴着锁链
  rationale: 以自然中文表达耶利米被束缚的状态；“锁链”准确涵盖 אזקים 所指的镣铐或链具。
- source_word: בְּתוֹךְ כָּל גָּלוּת יְרוּשָׁלִַם וִיהוּדָה
  choice: 夹在所有从耶路撒冷和犹大被掳……的人中间
  rationale: גָּלוּת 在此是集合用法，指被掳群体；“夹在……人中间”传达 בְּתוֹךְ 及耶利米当时身处俘虏队伍中的情形。
- source_word: הַמֻּגְלִים בָּבֶלָה
  choice: 被掳往巴比伦
  rationale: 分词表达正在被迁徙的群体；“往”保留方向词尾所表示的目的地意义。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文明确使用四字神名。正文采用现代中文读者最熟悉且具有专名功能的“耶和华”；“雅威”是较接近学术重构读音的可行替代，但原始发音并非完全确定。
- issue: 本节与下一节之间的句法关系
  choice: 将本节处理为完整的场景引介
  alternative: 以冒号结尾，把“耶和华的话”直接连接到第2节以下护卫长的话
  rationale: 希伯来文第1节以“耶和华的话临到”开头，却未在本节给出话语内容，形成篇章张力。中文采用句号避免把护卫长的话无提示地等同于耶和华的话，同时保留后文展开其内容或情境的可能。
translation_notes:
  register: 采用现代、庄重而清晰的叙事语言。为避免希伯来语连续男性代词在中文中产生指代不明，第二句重复“尼布撒拉旦”。本节原文是较长的引介结构；译文分为两句以提高可读性，同时不补入原文未明说的话语内容。
