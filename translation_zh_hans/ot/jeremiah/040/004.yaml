  register: 采用现代、庄重而易懂的普通话。“看”保留הִנֵּה和רְאֵה的提示作用，避免使用偏古雅的“看哪”。整体按最优对等处理习语，同时用脚注保留“眼目”和“在你眼中”等原文意象。
