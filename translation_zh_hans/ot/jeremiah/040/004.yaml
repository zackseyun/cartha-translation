source:
  edition: WLC
  text: וְ/עַתָּ֞ה הִנֵּ֧ה פִתַּחְתִּ֣י/ךָ הַ/יּ֗וֹם מִֽן הָ/אזִקִּים֮ אֲשֶׁ֣ר עַל יָדֶ/ךָ֒ אִם ט֨וֹב בְּ/עֵינֶ֜י/ךָ לָ/ב֧וֹא אִתִּ֣/י בָבֶ֗ל בֹּ֚א וְ/אָשִׂ֤ים אֶת עֵינִ/י֙ עָלֶ֔י/ךָ וְ/אִם רַ֧ע בְּ/עֵינֶ֛י/ךָ לָ/בֽוֹא אִתִּ֥/י בָבֶ֖ל חֲדָ֑ל רְאֵה֙ כָּל הָ/אָ֣רֶץ לְ/פָנֶ֔י/ךָ אֶל ט֨וֹב וְ/אֶל הַ/יָּשָׁ֧ר בְּ/עֵינֶ֛י/ךָ לָ/לֶ֥כֶת שָׁ֖מָּ/ה לֵֽךְ־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/040/004.yaml
  text: And now, look, today I have freed you from the chains on your hands. If you want to come with me to Babylon, come, and I will look after you[a]. But if you do not want to come with me to Babylon, do not. Look, the whole land is before you; go wherever seems good and right to you[b][c].
translation:
  language: zh_hans
  text: 现在，看，我今天已经给你解开手上的锁链，放了你。你若愿意跟我到巴比伦去，就来吧，我会照顾你[a]；你若不愿意跟我到巴比伦去，就不要去。看，整个国土都在你面前；你看哪里好、哪里合宜，就到那里去吧[b][c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“我会把我的眼目放在你身上”，这里是善意看顾或保护的说法。
    reason: lexical_alternative
  - marker: b
    text: 原文几次使用“在你眼中是好／坏的”这一说法，意思是“你愿意／不愿意”，或“你看为好／不好”。
    reason: lexical_alternative
  - marker: c
    text: 希伯来文结尾直译为“要往那里去，就去”，强调准许他自行选择去处。
    reason: lexical_alternative
lexical_decisions:
- source_word: פִתַּחְתִּיךָ
  choice: 给你解开……锁链，放了你
  rationale: פתח本义为“打开、解开”；在“从手上的锁链”这一语境中，表示解除束缚、释放。译文兼顾了具体动作与释放的结果，也符合现代汉语表达。
- source_word: הָאזִקִּים אֲשֶׁר עַל יָדֶךָ
  choice: 你手上的锁链
  rationale: אזקים指囚犯所受的锁链或镣铐；יד可指手，也可涵盖手臂。译作“手上的锁链”保留原文的身体部位，又不过度限定为手腕。
- source_word: אִם טוֹב בְּעֵינֶיךָ
  choice: 你若愿意
  rationale: 原文直译为“若在你眼中是好的”，在此表达个人意愿和选择；“你若愿意”自然清楚。
- source_word: וְאָשִׂים אֶת־עֵינִי עָלֶיךָ
  choice: 我会照顾你
  rationale: 原文直译为“我会把我的眼目放在你身上”，本语境指善意的看顾和保护，而非监视。
- source_word: וְאִם רַע בְּעֵינֶיךָ
  choice: 你若不愿意
  rationale: 原文直译为“若在你眼中是坏的”，与前句相对，表示不愿作此选择，并非对前往巴比伦作道德判断。
- source_word: חֲדָל
  choice: 就不要去
  rationale: 该命令式表示停止或不做前述行动；汉语补出“去”，使所指明确。
- source_word: כָּל־הָאָרֶץ לְפָנֶיךָ
  choice: 整个国土都在你面前
  rationale: 保留原文“全地在你面前”的空间意象，并传达可以自由选择去处。此处“国土”比可能指全世界的“全地”更贴合当地疆域语境。
- source_word: אֶל־טוֹב וְאֶל־הַיָּשָׁר בְּעֵינֶיךָ
  choice: 你看哪里好、哪里合宜
  rationale: 保留“在你眼中”的主观判断，并分别表达טוב的“好”与ישר的“正当、合宜”；此处是对去处的选择。
- source_word: לָלֶכֶת שָׁמָּה לֵךְ
  choice: 就到那里去吧
  rationale: 原文以不定式加命令式“要往那里去，就去”加强准许语气；句末“吧”在现代汉语中自然表达允许其自行前往。
