id: JER.12.12
reference: Jeremiah 12:12
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: עַֽל כָּל שְׁפָיִ֣ם בַּ/מִּדְבָּ֗ר בָּ֚אוּ שֹֽׁדְדִ֔ים כִּ֣י חֶ֤רֶב לַֽ/יהוָה֙ אֹֽכְלָ֔ה מִ/קְצֵה אֶ֖רֶץ וְ/עַד קְצֵ֣ה הָ/אָ֑רֶץ אֵ֥ין שָׁל֖וֹם לְ/כָל בָּשָֽׂר־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/012/012.yaml
  text: Upon all the bare heights in the wilderness destroyers have come[a], for the sword of Yahweh is devouring from one end of the land to the other end of the land[c][b]; there is no peace for any flesh.
translation:
  language: zh_hans
  text: 荒野中所有光秃的高地[a]上，毁灭者已经来到；因为雅威的刀正在吞噬，从这地的一端直到这地的另一端[b]；凡有血肉的，都没有平安[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“光秃的山冈”或“无树的高地”。
    reason: lexical_alternative
  - marker: b
    text: 或译“从大地的一端直到大地的另一端”。希伯来语 אֶרֶץ 既可指一片土地，也可指大地。
    reason: alternative_reading
  - marker: c
    text: 希伯来语直译为“所有血肉”；这是泛指一切有生命的人或受造物的表达。
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁפָיִם
  choice: 光秃的高地
  rationale: 指暴露、没有植被遮蔽的高处；“光秃的高地”保留地貌意象，又避免让“高处”被误解为祭祀场所。
- source_word: בַּמִּדְבָּר
  choice: 荒野中
  rationale: מִדְבָּר 可指荒野、旷野或干旱草原；此处用“荒野”较自然，也不过度限定为沙漠。
- source_word: שֹׁדְדִים
  choice: 毁灭者
  rationale: 该词指施行劫掠和破坏的人；“毁灭者”在本节军事审判的语境中涵盖其强烈破坏性。
- source_word: חֶרֶב לַיהוָה
  choice: 雅威的刀
  rationale: 介词短语表达这刀属于雅威、由雅威施行审判；“刀”也能自然承接后面的拟人化“吞噬”。
- source_word: אֹכְלָה
  choice: 正在吞噬
  rationale: 原文以阴性单数形式与“刀”呼应，描绘持续进行的吞噬；“正在吞噬”保留鲜明的拟人效果。
- source_word: מִקְצֵה אֶרֶץ וְעַד קְצֵה הָאָרֶץ
  choice: 从这地的一端直到另一端
  rationale: 上下文主要指犹大遭受毁坏，故以“这地”表达；同时保留从一端到另一端的全面性。
- source_word: אֵין שָׁלוֹם
  choice: 不得平安
  rationale: שָׁלוֹם 包含平安、安全和福祉；战争与审判语境中，“平安”既常用又保有较宽含义。
- source_word: לְכָל בָּשָׂר
  choice: 凡有血肉的都
  rationale: בָּשָׂר 字面为“肉身、血肉”，此处泛指有生命者；译文保留原文的身体性意象，并以“凡……都不得”自然表达全称否定。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；“雅威”以音译呈现这一盟约之名，不以称号替代。
- issue: אֶרֶץ 的范围
  choice: 这地
  alternative: 全地；大地
  rationale: 本章近距离语境聚焦于犹大土地遭受蹂躏，因此正文采用地域性理解；但该词本身也可指“大地”，故以脚注保留范围上的歧义。
- issue: לְכָל בָּשָׂר 所指范围
  choice: 凡有血肉的
  alternative: 任何人；一切活物
  rationale: 原文表达可泛指人类或有生命者；正文不把范围收窄为仅仅“人”，脚注说明其可能涵盖的对象。
translation_notes:
  register: 采用现代、庄重而易懂的书面语。以分号保持希伯来诗句的三段推进；保留“刀正在吞噬”的拟人化审判意象，并在正文相应位置完整标注[a]、[b]、[c]。
