source:
  edition: WLC
  text: זָרְע֤וּ חִטִּים֙ וְ/קֹצִ֣ים קָצָ֔רוּ נֶחְל֖וּ לֹ֣א יוֹעִ֑לוּ וּ/בֹ֨שׁוּ֙ מִ/תְּבוּאֹ֣תֵי/כֶ֔ם מֵ/חֲר֖וֹן אַף יְהוָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/012/013.yaml
  text: They have sown wheat[a], but they have reaped thorns; they have exhausted themselves, but they profit nothing. Be ashamed of your produce because of the burning anger of Yahweh.
translation:
  language: zh_hans
  text: 他们播种麦子，收割的却是荆棘；他们劳苦至筋疲力尽，却毫无益处。你们要因你们的出产蒙羞[a]，因为雅威炽烈的怒气。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你们必因你们的出产蒙羞。”这是把 וּבֹשׁוּ 理解为预告，而不是命令。
    reason: 保留希伯来文 וּבֹשׁוּ 可理解为第二人称复数命令式或预告性表达的歧义。
lexical_decisions:
- source_word: זָרְעוּ חִטִּים
  choice: 他们种的是麦子
  rationale: זָרְעוּ是Qal完成式第三人称复数，חִטִּים明确指“麦子”。用“种的是”与下句“收割的却是”形成自然鲜明的对照。
- source_word: וְקֹצִים קָצָרוּ
  choice: 收割的却是荆棘
  rationale: קֹצִים意为荆棘、蒺藜一类带刺植物；连接词在此具有反差意味，因此译作“却”。
- source_word: נֶחְלוּ
  choice: 他们劳苦到筋疲力尽
  rationale: 此处宜理解为因劳作而衰弱、疲惫，并非“承受产业”。加入“劳苦到”使汉语清楚表达耗尽精力的语境。
- source_word: לֹא יוֹעִלוּ
  choice: 却毫无收获
  rationale: יעל的Hiphil表达获益、奏效。结合农耕意象，“毫无收获”既自然，又表达劳作没有带来益处；“却”显明与劳苦之间的反差。
- source_word: וּבֹשׁוּ
  choice: 你们要……蒙羞
  rationale: 按第二人称阳性复数命令式理解，与随后“你们的”一致，并保留先叙述、后直接斥责的先知性转折。
- source_word: מִתְּבוּאֹתֵיכֶם
  choice: 因自己的出产
  rationale: תְּבוּאָה可指土地的出产、收成；复数附第二人称复数词尾。译作“自己的出产”简洁自然，并与直接称呼相配。
- source_word: מֵחֲרוֹן אַף
  choice: 因为……怒火燃烧
  rationale: חֲרוֹן אַף是表示烈怒的习语，字面包含怒气灼热、燃烧的意象；此译保留该比喻。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见音译呈现四字神名，保留其专名性质，而不以称号替代。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用以色列上帝的专名。采用“雅威”以保留专名，并符合较通行的学术重构读音。
- issue: וּבֹשׁוּ的语气与人称
  choice: 命令式：“你们要……蒙羞”
  alternative: 预告式：“你们必因自己的收成蒙羞”
  rationale: 该形式可按第二人称复数命令式理解，且与“你们的出产”衔接自然；不过它也可作预告性陈述，因此在脚注中保留另一种理解。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。前两分句以“种的是……收割的却是……”重现农业意象和平行反差；后半保留从第三人称叙述转为第二人称直斥的修辞变化。
