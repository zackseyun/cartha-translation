id: JER.12.3
reference: Jeremiah 12:3
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/אַתָּ֤ה יְהוָה֙ יְדַעְתָּ֔/נִי תִּרְאֵ֕/נִי וּ/בָחַנְתָּ֥ לִבִּ֖/י אִתָּ֑/ךְ הַתִּקֵ/ם֙ כְּ/צֹ֣אן לְ/טִבְחָ֔ה וְ/הַקְדִּשֵׁ֖/ם לְ/י֥וֹם הֲרֵגָֽה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/012/003.yaml
  text: But you[a], O Yahweh, know me; you see me, and you test my heart toward you. Pull them out like sheep for slaughter[c][b], and set them apart for the day of killing.
translation:
  language: zh_hans
  text: 但耶和华啊，你认识我；你看见我，察验我那向着你的心[a]。求你把他们拉出来，如同把羊带去宰杀；使他们分别出来[b]，留待杀戮之日[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我的心与你同在。”希伯来语表达十分紧凑，可能指耶利米的内心朝向耶和华，或他对耶和华的忠诚。
    reason: alternative_reading
  - marker: b
    text: 或译：“使他们分别为圣。”原文直译为“使他们分别出来”；这里是为受审判而分别，并非为蒙福。
    reason: lexical_alternative
  - marker: c
    text: 或译：“宰杀之日。”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的神名音译“耶和华”，使专名与一般称号“主”有所区别。
- source_word: יְדַעְתָּנִי
  choice: 你认识我
  rationale: 完成式在此表达持续有效的认识；“认识我”自然地呈现耶和华对先知真实而深入的了解。
- source_word: תִּרְאֵנִי
  choice: 你察看我
  rationale: 此处不只是肉眼看见，而有洞察、审视之意；“察看”与上下文的“认识”“考验”相称。
- source_word: וּבָחַנְתָּ לִבִּי
  choice: 考验我的心
  rationale: 保留“心”的希伯来语意象，并用“考验”表达对内在品格的检验。为使אִתָּךְ的关联清楚，正文组合为“考验我对你的心”。
- source_word: אִתָּךְ
  choice: 对你的
  rationale: 该紧凑短语可表示先知内心朝向耶和华或对他的忠诚；“我对你的心”保留关系方向，同时以脚注注明更直译的可能。
- source_word: הַתִּקֵם
  choice: 把他们拉出来
  rationale: נתק的使役式表示拉出、扯离；“拉出来”既贴近词义，也配合将羊拉去宰杀的图像。
- source_word: כְּצֹאן לְטִבְחָה
  choice: 像把羊拉去宰杀一样
  rationale: 将希伯来文简洁的明喻自然展开，明确承接前面的动作，又不削弱宰杀意象。
- source_word: וְהַקְדִּשֵׁם
  choice: 把他们分别出来
  rationale: קדש使役式本义为使之分别、划定；这里是为审判而分别，并非赋予正面的圣洁含义。
- source_word: לְיוֹם הֲרֵגָה
  choice: 留到杀戮之日
  rationale: “杀戮之日”直接保留הרגה的暴力与审判色彩；补入“留到”使中文自然，并表达为该日划定他们。
theological_decisions:
- issue: 先知求神审判恶人时所用的宰杀意象
  choice: 直接保留“宰杀”和“杀戮之日”的措辞
  alternative: 弱化为“预备他们受审判”或把暴力理解为单纯比喻
  rationale: 原文明确使用羊被宰杀及杀戮之日的图像。译文不应淡化这项严厉的祈求，也不额外为其提供原文未明说的神学解释。
- issue: אִתָּךְ与“我的心”的关系
  choice: 译作“我对你的心”，表达内心朝向耶和华
  alternative: 译作“我的心与你同在”
  rationale: 原文句法紧凑，可能着重内在取向或忠诚。正文采用自然且关系明确的中文，同时用脚注保留较直译的理解。
- issue: קדש用于审判对象
  choice: 译作“分别出来”，保留分别归定的核心意思
  alternative: 译作“使他们成圣”或“把他们奉献出来”
  rationale: 这里的分别是为杀戮之日而划定，不宜让现代读者误以为这是赐福或道德洁净；但仍须保留该词带有“分别”的语义张力。
translation_notes:
  register: 采用现代、庄重且易懂的普通话书面语。保留先知祈求中的直接命令语气和严厉暴力意象；神名译为“耶和华”。脚注标记均置于相应正文词组之后。
