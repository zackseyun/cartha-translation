id: JER.12.11
reference: Jeremiah 12:11
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: שָׂמָ/הּ֙ לִ/שְׁמָמָ֔ה אָבְלָ֥ה עָלַ֖/י שְׁמֵמָ֑ה נָשַׁ֨מָּה֙ כָּל הָ/אָ֔רֶץ כִּ֛י אֵ֥ין אִ֖ישׁ שָׂ֥ם עַל לֵֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/012/011.yaml
  text: They have made it a desolation[a]; it mourns before me, desolate. The whole land is laid waste[c][b], because no one takes it to heart.
translation:
  language: zh_hans
  text: 他们使它荒凉[a]；它在我面前哀伤，荒凉不堪。全地都荒废了[b]，因为没有人把它放在心上[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文动词为单数，也可译作“他使它荒凉”；正文“他们”按上文毁坏者的语境理解。
    reason: alternative_reading
  - marker: b
    text: “地”也可译作“大地”；这里很可能特指遭毁坏的犹大土地。
    reason: alternative_reading
  - marker: c
    text: 希伯来文直译为“没有人把它放在心上”，意思是没有人认真留意或郑重看待。
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂמָהּ
  choice: 他们使它
  rationale: 动词形式严格说是第三人称阳性单数“他使它”，但上文的掠夺者很可能是语境中的主语；正文用“他们”使衔接自然，同时以脚注保留希伯来文单数形式。
- source_word: לִשְׁמָמָה
  choice: 荒凉
  rationale: 保留שְׁמָמָה所表达的荒芜、毁坏状态；“使它荒凉”在现代汉语中自然，并维持主动致使含义。
- source_word: אָבְלָה
  choice: 哀哭
  rationale: אבל表示哀悼、悲 mourn；将土地拟人化为“哀哭”，保留原文鲜明的诗性意象。
- source_word: עָלַי
  choice: 在我面前
  rationale: 这里指土地在说话者上帝面前、在其眼前哀哭；“在我面前”比直译“在我之上”更符合语境。
- source_word: שְׁמֵמָה
  choice: 一片荒凉
  rationale: 作为简短的状态描写，承接“哀哭”；“一片荒凉”自然地表达其荒废状态，并保留原文重复荒凉词根所形成的强调。
- source_word: נָשַׁמָּה
  choice: 荒废了
  rationale: 表达土地已经成为荒凉之地的完成性、结果性状态，符合中文习惯。
- source_word: כָּל הָאָרֶץ
  choice: 全地
  rationale: אֶרֶץ可指“地”或“大地”；本段主要指犹大境内受毁坏的土地。“全地”既简练，又避免扩大为整个世界。
- source_word: כִּי אֵין אִישׁ
  choice: 因为没有人
  rationale: אִישׁ虽为阳性单数形式，在此具有泛指功能；现代汉语“没有人”准确自然，不暗示仅限男性。
- source_word: שָׂם עַל לֵב
  choice: 把这事放在心上
  rationale: 原文直译为“放在心上”，表示认真留意、郑重看待；中文恰有相近惯用语，可同时保留“心”的意象。
theological_decisions:
- issue: אֶרֶץ的指涉范围
  choice: 全地
  alternative: 整个大地
  rationale: 近处语境谈耶和华的产业和遭毁坏的犹大土地，因此采用地方性指涉，不把审判无根据地普世化。
- issue: שָׂמָהּ的主语
  choice: 他们
  alternative: 他
  rationale: 希伯来文动词是单数，但语境很可能承接上文施行毁坏者。正文采用语境通顺的复数，脚注明示形式上的歧义，不武断消除另一种可能。
- issue: 土地的拟人化
  choice: 它在我面前哀哭
  alternative: 它在我面前哀伤
  rationale: 保留土地如同哀悼者的诗性形象，也不将“我”以解释性称谓直接替换，从而维持神谕话语的第一人称力度。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留“荒凉／荒废”的词义呼应和土地“哀哭”的拟人化；标点呈现原文短促、沉重的诗性节奏。所有脚注标记均置于相关正文之后。
