source:
  edition: WLC
  text: כֹּ֣ה אָמַ֣ר יְהוָ֗ה עַל כָּל שְׁכֵנַ/י֙ הָֽ/רָעִ֔ים הַ/נֹּֽגְעִים֙ בַּֽ/נַּחֲלָ֔ה אֲשֶׁר הִנְחַ֥לְתִּי אֶת עַמִּ֖/י אֶת יִשְׂרָאֵ֑ל הִנְ/נִ֤י נֹֽתְשָׁ/ם֙ מֵ/עַ֣ל אַדְמָתָ֔/ם וְ/אֶת בֵּ֥ית יְהוּדָ֖ה אֶתּ֥וֹשׁ מִ/תּוֹכָֽ/ם׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/012/014.yaml
  text: 'Thus says Yahweh concerning all my wicked neighbors who touch the inheritance that I caused my people Israel to inherit: behold[a], I am about to uproot them from upon their land[b], and I will uproot the house of Judah from among them.'
translation:
  language: zh_hans
  text: 耶和华如此说：“至于我一切邪恶的邻邦，就是那些触碰[a]我赐给我子民以色列为产业之地的，看哪，我要把他们从他们的土地上连根拔起[b]；我也要把犹大家从他们中间拔出。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “触碰”所译的希伯来语字面意思是“触碰”；在这里，语境表明这是带敌意的侵犯或干犯。
    reason: lexical_alternative
  - marker: b
    text: “连根拔起”也可译作“拔除”。这个希伯来语动词是《耶利米书》中反复出现的审判意象。
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  choice: 耶和华如此说
  rationale: 保留先知传信公式的庄重语气，并以“耶和华”音译四字神名。
- source_word: שְׁכֵנַי הָרָעִים
  choice: 我所有邪恶的邻邦
  rationale: 上下文所指是以色列周边敌对民族，不只是住在附近的个人；“邪恶”表达其道德与敌对含义。
- source_word: הַנֹּגְעִים בַּנַּחֲלָה
  choice: 侵扰……作产业之地
  rationale: נגע字面为“触碰”，此处语境含敌意侵犯；“侵扰”在现代汉语中自然地传达这一含义。“产业之地”同时说明产业在此涉及土地。
- source_word: אֲשֶׁר הִנְחַלְתִּי אֶת עַמִּי אֶת יִשְׂרָאֵל
  choice: 我赐给我子民以色列作产业之地
  rationale: 使役形表达赐予承受产业；译文保留“产业”词根联系，又避免生硬的“使……承受”。
- source_word: הִנְנִי נֹתְשָׁם
  choice: 看哪，我要把他们……拔除
  rationale: הִנְנִי带出强调性的临近行动；“看哪”保存先知语势，“拔除”保存耶利米书反复出现的审判意象。
- source_word: מֵעַל אַדְמָתָם
  choice: 从自己的土地上
  rationale: 自然表达“从他们土地之上”，代词指邻邦自身，避免误解为以色列之地。
- source_word: וְאֶת בֵּית יְהוּדָה אֶתּוֹשׁ מִתּוֹכָם
  choice: 也要把犹大家从他们中间拔出来
  rationale: “犹大家”保留集体、国族性的“家”意象；再次使用“拔”以呈现原文重复，同时“拔出来”符合汉语搭配。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 采用现代中文圣经读者最熟悉的专名形式，明确译作神的名字，而非以“主”替代；不据此加入额外神学解释。
- issue: הִנְנִי 加分词所表达的时态力量
  choice: 看哪，我要……拔除
  alternative: 看哪，我正要……拔除
  rationale: 该结构可表达强调且临近的行动；中文“看哪，我要”保留宣告力度，却不把临近程度规定得过细。
- issue: 同一“拔除”意象用于邻邦和犹大
  choice: 前句“拔除”，后句“拔出来”
  alternative: 两处均译“拔除”
  rationale: 保留 נתש 的重复和审判张力，同时用补语“出来”清楚表达犹大是从邻邦中间被移出；不擅自将后者解释为纯粹拯救或纯粹审判。
translation_notes:
  register: 采用现代、庄重而易懂的普通话书面语。以“邻邦”明确国家群体，以“产业之地”兼顾土地所指和承受产业的神学语汇；保留“看哪”与“拔除”等先知性表达。所有脚注标记均置于正文相应位置。
