  rationale: 修订将脚注 a 移至所注释的“触碰”之后，并在正文恢复该词的基本义，以脚注交代语境中的敌意干犯。将“自己的土地”改为“他们的土地”以消除指代歧义，并用“连根拔起／拔出”保留原文两次 נתש 的重复及其土地、植物性的审判意象。分号使第二个独立的神谕动作在中文中更清楚。
