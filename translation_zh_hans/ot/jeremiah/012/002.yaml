id: JER.12.2
reference: Jeremiah 12:2
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: נְטַעְתָּ/ם֙ גַּם שֹׁרָ֔שׁוּ יֵלְכ֖וּ גַּם עָ֣שׂוּ פֶ֑רִי קָר֤וֹב אַתָּה֙ בְּ/פִי/הֶ֔ם וְ/רָח֖וֹק מִ/כִּלְיוֹתֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/012/002.yaml
  text: You planted them; they have even taken root. They grow; they even produce fruit. You are near in their mouth[a], but far from their innermost being.
translation:
  language: zh_hans
  text: 你栽种了他们；他们也扎了根；他们不断生长，也结出果实。你在他们口中很近，离他们的内心[a]却很远。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“离他们的肾脏很远”。“肾脏”在这里指人隐秘的内在，包括深处的情感和动机。
    reason: 说明原文的人体意象及其惯用含义。
lexical_decisions:
- source_word: נְטַעְתָּם
  choice: 你栽种了他们
  rationale: 该词为נטע的Qal完成式第二人称阳性单数，带第三人称阳性复数后缀，直接称呼上帝并明确以他为栽种者。
- source_word: גַּם שֹׁרָשׁוּ
  choice: 他们也扎了根
  rationale: שׁרשׁ在此意为“扎根”；“也”体现גַּם，并保留植物意象及恶人已经稳固生长的语意。
- source_word: יֵלְכוּ
  choice: 他们不断生长
  rationale: הלך本义为“行、前进”，在扎根与结果的农业语境中表示继续向前发展；“不断生长”既符合上下文，又避免把它直接释为物质上的“兴旺”。
- source_word: גַּם עָשׂוּ פֶרִי
  choice: 也结出了果实
  rationale: עשה פרי是“结果、产生果实”的惯用搭配；“也”再次体现גַּם，完成栽种、扎根、生长、结果的连续意象。
- source_word: קָרוֹב אַתָּה בְּפִיהֶם
  choice: 你在他们口中很近
  rationale: 较贴近原文保留“口中”以及“近”的空间性比喻，表达他们口头上常提到上帝，而未将其明确解释为真诚敬拜。
- source_word: וְרָחוֹק מִכִּלְיוֹתֵיהֶם
  choice: 离他们的内心却很远
  rationale: כִּלְיוֹת字面为“肾脏”，在希伯来语人体意象中可指人隐秘的内在、情感或动机。“内心”以现代汉语自然传达其语境意义，字面意象则收入脚注。
theological_decisions:
- issue: כִּלְיוֹתֵיהֶם的人体意象
  choice: 正文译作“他们的内心”，脚注说明字面为“他们的肾脏”
  alternative: 正文直译“他们的肾脏”或译作“他们的肺腑”
  rationale: 经文将口头上的亲近与真实内在的疏远相对照。“内心”便于现代读者理解，又不把内在层面限定为思想、情感或动机中的某一项；脚注保留原文独特的人体意象。
translation_notes:
  register: 采用现代、庄重而通顺的普通话。前半句保留农业意象的递进节奏；后半句尽量保留“口中—内心”和“近—远”的双重对照。脚注标记置于“内心很远”之后，因为脚注所解释的是כִּלְיוֹתֵיהֶם，而不是“口中”。
