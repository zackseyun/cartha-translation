id: JER.12.10
reference: Jeremiah 12:10
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: רֹעִ֤ים רַבִּים֙ שִֽׁחֲת֣וּ כַרְמִ֔/י בֹּסְס֖וּ אֶת חֶלְקָתִ֑/י נָֽתְנ֛וּ אֶת חֶלְקַ֥ת חֶמְדָּתִ֖/י לְ/מִדְבַּ֥ר שְׁמָמָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/012/010.yaml
  text: Many shepherds have ruined my vineyard[a]; they have trampled my portion[b]; they have made my pleasant portion a desolate wilderness.
translation:
  language: zh_hans
  text: 许多牧人[a]毁坏了我的葡萄园，践踏了我的田地；他们使我所珍爱的田地变成荒凉的旷野。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “牧人”在先知书中常用来比喻统治者或领袖。
    reason: 说明原文隐喻的常见指向，同时保留正文意象。
lexical_decisions:
- source_word: רֹעִים רַבִּים
  choice: 许多牧人
  rationale: 直译“许多牧人”，保留先知文学中以牧人喻指治理者或带领者的意象，不在正文中将其限定为某一类领袖。
- source_word: שִׁחֲתוּ
  choice: 毁坏了
  rationale: 该动词可指败坏、损坏或毁坏；“毁坏”符合葡萄园遭破坏的语境，又不必然表示彻底消灭。
- source_word: כַרְמִי
  choice: 我的葡萄园
  rationale: 直接保留原文的葡萄园意象及第一人称所有关系。
- source_word: בֹּסְסוּ
  choice: 践踏了
  rationale: 准确传达踩踏、蹂躏的动作，也保留土地遭亵损和破坏的具体画面。
- source_word: חֶלְקָתִי
  choice: 我的田地
  rationale: חֶלְקָה在此可指一块划分出来的土地；结合葡萄园与践踏的农业语境，“田地”比抽象的“分”更自然，同时保留其属于说话者的含义。
- source_word: נָתְנוּ ... לְ
  choice: 使……变成
  rationale: 原文“放置／给为”的结构在此表达结果，“使……变成”是自然且准确的现代汉语。
- source_word: חֶלְקַת חֶמְדָּתִי
  choice: 我所珍爱的田地
  rationale: חֶמְדָּה含可喜爱、宝贵、令人向往之意；“我所珍爱的”自然表达说话者对这片土地的珍视，也避免生硬的名词叠加。
- source_word: לְמִדְבַּר שְׁמָמָה
  choice: 荒凉的旷野
  rationale: 分别体现מִדְבָּר的旷野意象与שְׁמָמָה的荒凉、废弃状态。
theological_decisions:
- issue: 是否在正文中把“牧人”解释为君王、统治者或宗教领袖
  choice: 保留“牧人”这一隐喻
  alternative: 许多统治者／许多领袖
  rationale: 希伯来文直接使用“牧人”。保留原有意象可避免把其指涉范围缩窄到某一类政治或宗教人物。
- issue: 是否把葡萄园和田地直接解释为犹大、以色列或上主的产业
  choice: 保留葡萄园和田地的土地意象
  alternative: 我的国土／我的产业／犹大
  rationale: 原文通过层叠的土地意象表达归属、珍爱与毁坏；正文不应替读者消解这种文学和神学张力。
- issue: חֶלְקָה应译为抽象的“分”还是具体的土地
  choice: 按语境译为“田地”
  alternative: 我的分／我的产业
  rationale: 葡萄园、践踏和旷野共同构成明确的土地语境；“田地”体现该词可指地块的本义，但不在正文中进一步指定其象征对象。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。以“田地”承接葡萄园、践踏和旷野的土地语义场；末句用“我所珍爱的田地”传达情感价值，避免“可喜爱的分”等不自然表达。
