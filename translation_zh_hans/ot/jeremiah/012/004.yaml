id: JER.12.4
reference: Jeremiah 12:4
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: עַד מָתַי֙ תֶּאֱבַ֣ל הָ/אָ֔רֶץ וְ/עֵ֥שֶׂב כָּל הַ/שָּׂדֶ֖ה יִיבָ֑שׁ מֵ/רָעַ֣ת יֹֽשְׁבֵי בָ֗/הּ סָפְתָ֤ה בְהֵמוֹת֙ וָ/ע֔וֹף כִּ֣י אָמְר֔וּ לֹ֥א יִרְאֶ֖ה אֶת אַחֲרִיתֵֽ/נוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/012/004.yaml
  text: How long will the land mourn, and the grass of every field dry up? Because of the evil of those who dwell in it, beasts and birds are swept away, for they say, “He will not see our end.”
translation:
  language: zh_hans
  text: 这地悲哀，遍野的青草枯干，要到几时呢？因其中居民的恶，牲畜和飞鸟都被除尽了；因为他们说：“他看不见我们的结局。”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “他”所指不明，可能指耶和华，也可能指先知耶利米；“我们的结局”也可译作“我们的末后”。
    reason: 原文第三人称主语没有明说所指，而 אַחֲרִיתֵנוּ 具有“结局、末后、将来”等语义范围，脚注保存两处真实歧义。
lexical_decisions:
- source_word: תֶּאֱבַל
  choice: 悲哀
  rationale: 保留土地拟人化的诗性表达；此动词可指哀悼、衰败，结合土地受灾的语境译作“悲哀”自然且忠实。
- source_word: עֵשֶׂב כָּל־הַשָּׂדֶה
  choice: 遍野的青草
  rationale: 以自然汉语表达“所有田野的草”，既保留范围的全面性，也避免生硬直译。
- source_word: סָפְתָה
  choice: 灭绝了
  rationale: 该词表示被除灭、消灭；与走兽和飞鸟作主语时，“灭绝”准确体现灾祸造成的毁灭。
- source_word: אַחֲרִיתֵנוּ
  choice: 我们的结局
  rationale: אַחֲרִית 可指结局、末后或将来；此处保留“结局”的宽度，不将其限定为死亡或某一种未来。
theological_decisions:
- issue: “他”所指为何
  choice: 正文保留小写语义的“他”，不明确补作“耶和华”或“先知”
  alternative: 译作“耶和华看不见我们的结局”或“他看不到我们最终会怎样”
  rationale: 希伯来文本只有第三人称单数代词，所指存在解释空间；不在正文中替原文消除歧义。
- issue: לֹא יִרְאֶה 的含义
  choice: “看不见”
  alternative: “不会看到”或“不会顾念”
  rationale: 直译保留它既可能表示看不到，也可能在语境中暗含不会察看、不会见证的张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。首句保持希伯来诗歌的反问语气和土地拟人化；后半句保留因果层次，并避免用解释性措辞过早确定代词所指。
