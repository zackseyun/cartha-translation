id: JER.12.17
reference: Jeremiah 12:17
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/אִ֖ם לֹ֣א יִשְׁמָ֑עוּ וְ/נָ֨תַשְׁתִּ֜י אֶת הַ/גּ֥וֹי הַ/ה֛וּא נָת֥וֹשׁ וְ/אַבֵּ֖ד נְאֻם יְהוָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/012/017.yaml
  text: But if they do not listen[a], then I will uproot that nation, uprooting and destroying it, declares Yahweh.
translation:
  language: zh_hans
  text: 但他们若不听[a]，我就必把那一国连根拔起，彻底拔除并毁灭。这是雅威的宣告。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“不听从”或“不顺服”。希伯来语这个动词可表示“听”，也可按语境表示“听从、顺服”。
    reason: 保留“听”与“顺服”之间的词义幅度，避免将原文未明说的主观拒绝意味加入正文或注释。
lexical_decisions:
- source_word: וְאִם
  choice: 但……若
  rationale: 承接上文构成条件性的转折；“但……若”比单纯的“若”更能体现语境中的对照。
- source_word: לֹא יִשְׁמָעוּ
  choice: 不听从
  rationale: שׁמע 可指听、听从，并可延伸为顺服；“听从”在现代汉语中自然，也保留了听取与服从之间的语义联系。
- source_word: וְנָתַשְׁתִּי
  choice: 我就要拔出
  rationale: נתשׁ 描写从根部拔起，是《耶利米书》中具有审判意味的重要意象；“拔出”保留农业隐喻。
- source_word: הַגּוֹי הַהוּא
  choice: 那一国
  rationale: גּוֹי 在此指周边民族所构成的国家或国族实体；“那一国”简洁明确。
- source_word: נָתוֹשׁ
  choice: 彻底拔除
  rationale: 同根不定式绝对式强化前面的动词；以“彻底”表达强调，同时用“拔出／拔除”的重复尽量再现希伯来文的同根复沓。
- source_word: וְאַבֵּד
  choice: 并毁灭它
  rationale: 此处 אבד 为使役意义，即使之灭亡；“毁灭”力度恰当，并与“拔除”并列。
- source_word: נְאֻם יְהוָה
  choice: 这是雅威的宣告
  rationale: 以庄重而自然的汉语表达先知性宣告公式，并明确保留神的专名。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来四字神名的通行学术重构音译为“雅威”，不以称号替代其专名。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名；“雅威”以现代汉语音译保留其专名性质，避免用称号“主”取代。
- issue: שׁמע 所含“听”与“顺服”的张力
  choice: 正文译作“不听从”，并加注说明
  alternative: 不听；不顺服
  rationale: “听从”符合现代汉语，又能兼顾听取和服从；脚注保留原词在本处可能偏向“听”或“顺服”的语义幅度。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“拔出……彻底拔除”刻意保留原文同根词的重复和加强语气；末句使用独立宣告公式，保持先知话语的肃穆感。
