  naturalness: 原译自然庄重，但“把他们带回来，各人回到自己的产业，各人回到自己的土地”在句法上略显松散，且“带回来”后的分句容易读作附加说明。改为“使他们各人回到……”更紧凑，并清楚表达使役语气。
  terminology: “连根拔起”“怜悯”“产业”“土地”均合适。以“再施怜悯”表达“转回并怜悯”，在现代标准汉语中自然，同时避免把神“回来”作空间移动理解。
