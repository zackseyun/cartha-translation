  text: וְ/הָיָ֗ה אַֽחֲרֵי֙ נָתְשִׁ֣/י אוֹתָ֔/ם אָשׁ֖וּב וְ/רִֽחַמְתִּ֑י/ם וַ/הֲשִׁבֹתִ֛י/ם אִ֥ישׁ לְ/נַחֲלָת֖/וֹ וְ/אִ֥ישׁ לְ/אַרְצֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/012/015.yaml
  text: And it will happen[a], after I have uprooted them, that I will return and have compassion on them, and I will bring them back[c][b], each man to his inheritance and each man to his land.
translation:
  language: zh_hans
  text: 我把他们连根拔起以后，必再施怜悯于他们，使他们各人[a]回到自己的产业，各人回到自己的土地。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “各人……各人”是希伯来语的分配式说法，指被带回之人中的每一个。
    reason: 说明原文重复单数名词的语法作用，避免将“各人”误读为仅指男性。
lexical_decisions:
- source_word: וְהָיָה
  choice: 将来
  rationale: 在现代汉语中自然地引出未来将发生的情形，避免使用生硬的“事情将是”。
- source_word: נָתְשִׁי
  choice: 我把他们连根拔起
  rationale: 保留נתש在耶利米书中常见的植物隐喻，表达审判中彻底拔除、迁离的形象。
- source_word: אָשׁוּב וְרִחַמְתִּים
  choice: 还要转而怜悯他们
  rationale: 将שׁוב理解为上帝重新转向这些民族，并与随后“怜悯”紧密相连；“还要”也表达再次采取行动的语气。
- source_word: וַהֲשִׁבֹתִים
  choice: 把他们带回来
  rationale: 使役形明确表示上帝使他们返回；“带回来”保留具体的移动和归回意象。
- source_word: אִישׁ ... וְאִישׁ
  choice: 各人……各人
  rationale: 保留希伯来语单数分配式结构，指被恢复的各民族中的每一个人，而不限定为仅指男性。
- source_word: לְנַחֲלָתוֹ
  choice: 回到自己的产业
  rationale: “产业”保留נחלה作为承受所得之地业的含义及其立约土地色彩。
- source_word: לְאַרְצוֹ
  choice: 回到自己的土地
  rationale: 直接表达אֶרֶץ在本语境中的地域、国土含义。
theological_decisions:
- issue: 审判之后所应许之恢复的性质
  choice: 译文明确呈现：上帝拔除他们之后，又怜悯他们，并使他们回到各自的产业和土地。
  alternative: 将此理解并翻译为不强调地域归回的普遍属灵恢复。
  rationale: “产业”和“土地”都是具体的地域词语，正文应保留实际归回的意义，同时不添加本节未明说的进一步教义结论。
- issue: אָשׁוּב的句法与语义
  choice: 译为“还要转而”，指上帝再次转向他们施怜悯。
  alternative: 独立译为“我必回来”。
  rationale: 原文可直译为“我将转回/再次”，在此与“怜悯他们”相连。汉语“转而怜悯”自然表达行动方向的改变，同时避免把“回来”误解为上帝从某一地点返回。
translation_notes:
  register: 采用庄重、自然的现代标准汉语。“连根拔起”保存耶利米书鲜明的审判隐喻；“转而怜悯”保留上帝行动由审判转向怜悯的张力；句末重复“各人”以体现原文平行结构。
