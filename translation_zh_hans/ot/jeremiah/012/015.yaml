revisions:
- from: 将来，我把他们连根拔起以后，还要转而怜悯他们，把他们带回来[a]，各人回到自己的产业，各人回到自己的土地。
  to: 我把他们连根拔起以后，必再施怜悯于他们，使他们各人[a]回到自己的产业，各人回到自己的土地。
  rationale: 修订使“再施怜悯”更明确对应原文“转回／再次”并与“怜悯”相连；以“使他们各人回到”直接表达“使其归回”的使役意义。脚注内容不变，但将锚点移至所注释的“各人”。
