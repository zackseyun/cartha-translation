  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: הַ/עַ֨יִט צָב֤וּעַ נַחֲלָתִ/י֙ לִ֔/י הַ/עַ֖יִט סָבִ֣יב עָלֶ֑י/הָ לְכ֗וּ אִסְפ֛וּ כָּל חַיַּ֥ת הַ/שָּׂדֶ֖ה הֵתָ֥יוּ לְ/אָכְלָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/012/009.yaml
  text: Is my inheritance to me a speckled bird of prey? Are the birds of prey against her all around? Go[a], gather all the beasts of the field[b]; bring them to devour.
translation:
  language: zh_hans
  text: 我的产业对我来说，难道像一只斑驳的猛禽[b]吗？她四周的猛禽都来攻击她吗？你们去[a]，聚集田野的一切野兽，带它们来吞吃吧！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“来”。
    reason: lexical_alternative
  - marker: b
    text: “猛禽”也有人解释为“鬣狗”，第一句因而可译作：“我的产业对我来说，难道像一只斑驳的鬣狗吗？”本译文采用希伯来文 עַיִט 较常见的意思“猛禽”。原文第二处“猛禽”为单数形式，可能用作集合名词。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַעַיִט
  choice: 猛禽
  rationale: עַיִט在圣经希伯来语中通常指猛禽或食腐鸟。“猛禽”自然、准确，又不限定具体鸟种；另有“鬣狗”的词义提议，收入脚注。
- source_word: צָבוּעַ
  choice: 斑驳的
  rationale: 该词表示颜色杂陈或带有斑纹；“斑驳的”保留其醒目、异样的外观，也符合此处引来周围猛禽敌视的意象。
- source_word: נַחֲלָתִי
  choice: 我的产业
  rationale: נַחֲלָה指承受或分得的产业。“我的产业”既符合现代中文圣经语体，也保留上帝之民或土地属于他的盟约意味，而不在正文中限定所指。
- source_word: לִי
  choice: 对我来说
  rationale: 明确保留希伯来文与格结构及其反问语气：我的产业在我看来难道像某种猎物吗？
- source_word: הַעַיִט סָבִיב עָלֶיהָ
  choice: 四周的猛禽都来攻击她
  rationale: 形式上为单数的עַיִט可作集合名词理解；译为复数“猛禽”更符合群鸟包围的画面。“攻击她”体现עָלֶיהָ在语境中的敌对意味，同时“四周”对应סָבִיב。
- source_word: לְכוּ אִסְפוּ
  choice: 你们去，聚集
  rationale: 两个复数命令式构成直接召唤；“你们去，聚集”保留人称、数和连续动作。
- source_word: כָּל חַיַּת הַשָּׂדֶה
  choice: 田野的一切野兽
  rationale: 这是指野生动物的常见圣经用语；此译兼顾传统语体、互文联系和现代可懂度。
- source_word: הֵתָיוּ לְאָכְלָה
  choice: 带它们来吞吃吧
  rationale: 命令式加表示进食目的的形式，意为把野兽带来吞食猎物；“吞吃”传达捕食和审判的力度。
theological_decisions:
- issue: “我的产业”所指为何
  choice: 正文仅译作“我的产业”，不具体指明
  alternative: 犹大、耶路撒冷、土地或立约之民
  rationale: 上下文虽指向耶和华受审判的百姓或土地，但本节措辞没有明说；保留泛指可避免把一种较窄的解释写入正文。
- issue: 猛禽与产业之间的关系
  choice: 保留双重反问，并将周围猛禽呈现为攻击者
  alternative: 把第一句解释为产业本身已经成为食腐猛禽，或把第二句仅译为中性的环绕
  rationale: 原文意象具有张力：产业像异常斑驳的猛禽，却又遭周围猛禽敌对。译文不消解这一张力，同时以“攻击”表达עָלֶיהָ在语境中的敌意。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“产业”“猛禽”“吞吃”等词保留先知审判话语的力度；反问结构和阴性代词“她”忠实再现原文拟人化表达。所有脚注标记均已置于正文。
