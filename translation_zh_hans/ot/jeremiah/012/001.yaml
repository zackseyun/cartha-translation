  text: צַדִּ֤יק אַתָּה֙ יְהוָ֔ה כִּ֥י אָרִ֖יב אֵלֶ֑י/ךָ אַ֤ךְ מִשְׁפָּטִים֙ אֲדַבֵּ֣ר אוֹתָ֔/ךְ מַדּ֗וּעַ דֶּ֤רֶךְ רְשָׁעִים֙ צָלֵ֔חָה שָׁל֖וּ כָּל בֹּ֥גְדֵי בָֽגֶד־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/012/001.yaml
  text: 'You are righteous[a], O Yahweh, when I bring a case before you[c][b]; yet I would speak with you about matters of justice: Why does the way of the wicked prosper? Why are all who deal treacherously at ease?'
translation:
  language: zh_hans
  text: 雅威啊，我虽与你争辩，你仍是公义的；然而，我要同你谈论有关公正的事：[b]恶人的道路为什么亨通？所有背信行诈的人为什么都安逸自在？[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: “有关公正的事”原文直译为“审判”或“公正之事”，且为复数。
    reason: lexical_alternative
  - marker: c
    text: “背信行诈的人”原文采用同根词重复的强化表达，意为那些极其诡诈、背信的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: צַדִּיק
  choice: 公义
  rationale: 作表语形容雅威在道德和审判上的正直；“公义”既保留神学分量，也契合法庭语境。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来语四字神名的通行学术拟音直接译出上帝的圣名。
- source_word: כִּי אָרִיב אֵלֶיךָ
  choice: 我若与你争辩
  rationale: ריב可指争辩、申诉或提出诉讼；这里与后文“公正的问题”相呼应。“若”使中文自然，同时没有消除条件、时间或让步关系上的歧义，另以脚注说明。
- source_word: מִשְׁפָּטִים
  choice: 公正的问题
  rationale: 复数形式在此较可能指关乎审判和正义的事项；译文兼顾法律与道德层面。
- source_word: דֶּרֶךְ רְשָׁעִים
  choice: 恶人的道路
  rationale: 保留希伯来语以“道路”表示生活道路和行为方式的常见意象。
- source_word: צָלֵחָה
  choice: 亨通
  rationale: 表达成功、兴旺之意，并保留本节对恶人表面顺遂的质问。
- source_word: שָׁלוּ
  choice: 安逸自在
  rationale: 该词表示安静、无忧或安稳；这一译法适合先知对奸恶者不受搅扰之处境的质问。
- source_word: בֹּגְדֵי בָגֶד
  choice: 背信行诈的人
  rationale: 兼顾参与式的行为含义和词根所表达的背信、诡诈；其强化结构在脚注中说明。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名；“雅威”以现代普通话音译保留其专名性质，不以称号代替。
- issue: 先知向上帝争辩的语气
  choice: 我若与你争辩，你总是公义的
  alternative: 虽然我与你争辩；我向你申诉时
  rationale: 译文同时保留先知对上帝公义的确认和他大胆提出公正问题的张力，既不把争辩弱化为一般谈话，也不暗示上帝可能理亏。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。保留“道路”的圣经意象和整节的法律语境；两个直接问句维持先知大胆质问与承认上帝公义并存的张力。
