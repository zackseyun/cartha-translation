base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/012/007.yaml
  text: I have forsaken my house[a]; I have abandoned my inheritance[c][b]; I have given the beloved of my soul into the hand of her enemies.
translation:
  language: zh_hans
  text: '我离弃了我的家，

    撇下了我的产业；

    我把我心所爱的[a]

    交在她的仇敌手中。[b][c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “我心所爱的”也可译作“我灵魂所爱的”或“我深爱的那一位”。希伯来语原句表达亲密而深切的爱。
    reason: lexical_alternative
  - marker: b
    text: “手中”直译可作“掌中”，这里指落入仇敌的权势或控制之下。
    reason: lexical_alternative
  - marker: c
    text: 原文“她的仇敌”使用阴性单数后缀；“她”可能指产业、人格化的犹大或耶路撒冷，也可能指“我心所爱的”。原文没有更明确地指定。
    reason: alternative_reading
lexical_decisions:
- source_word: עָזַבְתִּי
  choice: 我离弃了
  rationale: 该词是动词 עזב 的 Qal 完成式第一人称单数，表示说话者视为已经实施的行动。“离弃”既保留庄重语气，也不把含义缩减为普通的“离开”。
- source_word: בֵּיתִי
  choice: 我的家
  rationale: בַּיִת 基本义为“房屋、家”。上下文可能使人联想到圣殿或属神的家，但原文没有在此明确限定；“我的家”保留这种开放性，且符合现代汉语。
- source_word: נָטַשְׁתִּי
  choice: 撇下了
  rationale: נָטַשׁ 与前句 עזב 意义相近而并非完全相同。“撇下”维持平行关系，又避免机械重复“离弃”。
- source_word: נַחֲלָתִי
  choice: 我的产业
  rationale: נַחֲלָה 可指承受所得之物，也常用于圣约语境中的土地或子民。“产业”简洁保留其所有权及承受之业的色彩，而不把所指限定为土地或人民。
- source_word: נָתַתִּי
  choice: 我把……交在
  rationale: נתן 的基本义是“给、交出”。结合后面的“在……手中”，汉语用“把……交在”能自然表达移交控制权，同时仍贴近原文。
- source_word: יְדִדוּת נַפְשִׁי
  choice: 我心所爱的
  rationale: 这是带有深切亲爱情感的结构，直译近于“我性命所爱的／我灵魂所爱的”。“我心所爱的”在现代汉语中自然、庄重，并保留对象未明说的诗性表达。
- source_word: בְּכַף
  choice: 在……手中
  rationale: כַּף 字面可指“手掌”，这里构成落入某人权势或控制之下的惯用表达。汉语“在……手中”同时保留身体意象和惯用意义。
- source_word: אֹיְבֶיהָ
  choice: 她仇敌
  rationale: 该词带第三人称阴性单数后缀。用“她”显出原文的阴性人格化表达，不擅自将其改成中性的“它”或明定为犹大、耶路撒冷。
theological_decisions:
- issue: “她仇敌”中阴性代词的所指
  choice: 保留“她”，不明确指定其先行对象
  alternative: 译作“它的仇敌”，或直接说明为“犹大／耶路撒冷的仇敌”
  rationale: 希伯来文使用阴性单数后缀，但没有进一步说明它具体回指“产业”、人格化的犹大／耶路撒冷，还是“我心所爱的”。保留阴性人格化和指代上的开放性，避免替原文消除其诗性与神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。以四行诗体呈现三个平行分句；“离弃／撇下”保留近义变化，“家／产业／我心所爱的”保留原文逐步增强的亲密感。标点和代词按现代简体中文规范处理。
