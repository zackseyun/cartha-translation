  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כִּ֧י גַם אַחֶ֣י/ךָ וּ/בֵית אָבִ֗י/ךָ גַּם הֵ֨מָּה֙ בָּ֣גְדוּ בָ֔/ךְ גַּם הֵ֛מָּה קָרְא֥וּ אַחֲרֶ֖י/ךָ מָלֵ֑א אַל תַּאֲמֵ֣ן בָּ֔/ם כִּֽי יְדַבְּר֥וּ אֵלֶ֖י/ךָ טוֹבֽוֹת־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/012/006.yaml
  text: For even your brothers and your father’s house—even they have dealt treacherously with you[a]; even they have called out loudly after you. Do not trust them[b], though they speak good things to you.
translation:
  language: zh_hans
  text: 因为连你的弟兄和你父家的人也背叛了你；他们也在你身后放声喊叫。[a] 即使他们对你说好话，也不要信任他们。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在你身后放声喊叫”也可译作“在你后面大声呼喊”；这句话可能暗示公开的敌意叫喊或追赶。
    reason: lexical_alternative
  - marker: b
    text: 原文“弟兄”在语法上是阳性复数；在这里指耶利米亲近的男性亲属，“父家的人”则包括较广的家族成员。
    reason: cultural_note
lexical_decisions:
- source_word: אַחֶיךָ
  choice: 你的弟兄
  rationale: 原文是“弟兄”的阳性复数形式，带第二人称阳性单数后缀。译作“你的弟兄”保留其性别和近亲关系；这里也可能泛指男性近亲。
- source_word: וּבֵית אָבִיךָ
  choice: 和你父家的人
  rationale: “父家”是古代家庭或宗族单位的固定表达。补出“的人”，使现代汉语自然，同时保留原文的社会结构意象。
- source_word: בָּגְדוּ בָךְ
  choice: 背叛了你
  rationale: בגד表示以诡诈或不忠对待某人；“背叛”简洁地传达这里严重的亲族不忠。
- source_word: קָרְאוּ אַחֲרֶיךָ מָלֵא
  choice: 在你身后放声喊叫
  rationale: קרא意为呼喊，אַחֲרֵי表示在后面或向着离去者，מָלֵא在此加强声音，意为全力或高声。“在你身后放声喊叫”保留可能的敌意呼喊或追赶场景，而不把含义限定得过死。
- source_word: אַל תַּאֲמֵן בָּם
  choice: 不要信任他们
  rationale: אמן的使役式在此指信赖、信任。上下文警告他们的话与真实意图不符，因此“信任”比单纯“相信某句话”更贴切。
- source_word: כִּי יְדַבְּרוּ אֵלֶיךָ טוֹבוֹת
  choice: 即使他们对你说好话
  rationale: טוֹבוֹת指好听、友善或有利的话；结合前面的禁令，כִּי具有让步意味。“即使……也……”自然表达这种反差。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“父家”保留古代家族单位的表达，并补“的人”以符合现代汉语习惯；“放声喊叫”保留原文动作的强度及其可能的敌意，但用脚注说明其语义空间。
