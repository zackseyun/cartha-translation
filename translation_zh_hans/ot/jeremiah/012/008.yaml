  text: הָיְתָה לִּ֥/י נַחֲלָתִ֖/י כְּ/אַרְיֵ֣ה בַ/יָּ֑עַר נָתְנָ֥ה עָלַ֛/י בְּ/קוֹלָ֖/הּ עַל כֵּ֥ן שְׂנֵאתִֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/012/008.yaml
  text: My inheritance has become to me like a lion in the forest[a]; she has lifted up her voice against me[c][b]; therefore I hate her.
translation:
  language: zh_hans
  text: 我的基业竟变得像林中的狮子一样；她向我高声叫喊[a][b]，因此我恨她[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“她向我吼叫。”希伯来文直译近于“她向我发出声音”；因上文以狮子作比喻，“吼叫”是贴合语境的译法。
    reason: lexical_alternative
  - marker: b
    text: 原文用阴性“她”，回指“我的基业”；“基业”在希伯来语中是阴性名词，本句也将其人格化。
    reason: cultural_note
  - marker: c
    text: 或译：“因此我已经恨她。”希伯来文动词为完成式；按语境可指已发生的行动，或表达现今的状态。
    reason: lexical_alternative
lexical_decisions:
- source_word: נַחֲלָתִי
  choice: 我的产业
  rationale: נַחֲלָה可指继承所得、基业或所分得的产业；在耶和华谈及属他的百姓或土地时，“我的产业”既自然，也保留归属与盟约意味。
- source_word: כְּאַרְיֵה בַיָּעַר
  choice: 像林中的狮子
  rationale: כְּ明确引出比喻；אַרְיֵה通常指“狮子”，יַעַר指树林或森林。“林中的狮子”简洁保留原有意象。
- source_word: נָתְנָה עָלַי בְּקוֹלָהּ
  choice: 她向我吼叫
  rationale: 字面近于“她向我发出声音”。在紧接“狮子”的语境中，“吼叫”自然呈现敌对发声，并以脚注保留较一般的译法“向我高声叫喊”。
- source_word: עַל כֵּן
  choice: 因此
  rationale: 这是常见的推论连接语，指出下句是前述敌对行为的结果。
- source_word: שְׂנֵאתִיהָ
  choice: 我恨她
  rationale: שׂנא的完成式在此可表达已发生的态度，也可在语境中陈述当前状态；正文用简洁直接的“我恨她”，不弱化原文的严厉措辞。
- source_word: ־הּ / ־הָ（阴性代词后缀）
  choice: 她
  rationale: 这些阴性后缀回指阴性名词נַחֲלָה。汉语虽无语法性别要求，但用“她”可保留这里对“我的产业”的人格化描写。
theological_decisions:
- issue: שְׂנֵאתִיהָ所表达的神的态度
  choice: 直译为“我恨她”
  alternative: “我厌弃她”或“我已经恨她”
  rationale: 原文采用强烈的“恨”字，呈现盟约审判中的尖锐张力；不将其缓和为行政性的“弃绝”，也不以解释性措辞消解其冲击力。
- issue: “我的产业”的人格化
  choice: 以“她”回指
  alternative: 以“它”回指
  rationale: 阴性形式本可仅属希伯来语语法现象，但本句赋予“产业”主动敌对的声音；保留“她”有助于呈现人格化，同时脚注说明其语法背景，避免把性别含义过度实体化。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“产业”保留经文语境中的归属及盟约色彩；“竟像”传达关系反转所带来的惊异与痛切。“吼叫”顺承狮子意象，但以脚注保留较字面的开放译法。标点以分号呈现三个紧密相连的分句。
