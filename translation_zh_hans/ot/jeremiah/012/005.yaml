id: JER.12.5
reference: Jeremiah 12:5
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כִּ֣י אֶת רַגְלִ֥ים רַ֨צְתָּה֙ וַ/יַּלְא֔וּ/ךָ וְ/אֵ֥יךְ תְּתַֽחֲרֶ֖ה אֶת הַ/סּוּסִ֑ים וּ/בְ/אֶ֤רֶץ שָׁלוֹם֙ אַתָּ֣ה בוֹטֵ֔חַ וְ/אֵ֥יךְ תַּעֲשֶׂ֖ה בִּ/גְא֥וֹן הַ/יַּרְדֵּֽן־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/012/005.yaml
  text: If you have run with footmen and they have worn you out[a], then how will you compete with horses? And if in a land of peace you feel secure, then what will you do in the thicket of the Jordan?
translation:
  language: zh_hans
  text: “你若跟步行的人赛跑，尚且被他们累垮，怎能跟马匹竞赛呢？你在太平之地尚且安然无忧，到了约旦河边的密林[a]，又会怎么办呢？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“约旦河的威荣”或“约旦河的涨溢”。希伯来语“约旦河的威荣”含义有争议，可能指约旦河岸茂密的丛林，也可能较为字面地指河的“威荣”，或河水涨溢的景象。
    reason: 保留גְּאוֹן הַיַּרְדֵּן的多种可能解释。
lexical_decisions:
- source_word: רַגְלִים
  choice: 步行的人
  rationale: 字面指“用脚的人”，在与马匹的对比中指徒步奔跑者；译作“步行的人”自然清楚，也不强行限定为军队中的步兵。
- source_word: רַצְתָּה
  choice: 赛跑
  rationale: 该动词基本义为“跑”；上下文紧接“竞赛”，故用“赛跑”呈现与人、马较量的意象。
- source_word: וַיַּלְאוּךָ
  choice: 被他们累垮
  rationale: לאה表示使人疲乏、筋疲力尽；“累垮”符合现代汉语，并保留已不堪应付的强烈语气。
- source_word: תְּתַחֲרֶה
  choice: 竞赛
  rationale: 该词表示参与竞争或较量；“竞赛”承接奔跑意象，同时不把含义过度收窄。
- source_word: הַסּוּסִים
  choice: 马匹
  rationale: 直接对应原文，并鲜明呈现徒步者与马之间递进的对比。
- source_word: בְאֶרֶץ שָׁלוֹם
  choice: 在太平之地
  rationale: 保留“地”和“平安、太平”的名词结构，表达安宁而没有扰乱的环境。
- source_word: בּוֹטֵחַ
  choice: 只觉安稳
  rationale: בטח可指信靠，也可指安稳无惧；此处与太平环境相连，重点是处境上的安全感。“只觉安稳”也使前后两个“尚且”结构更自然。
- source_word: תַּעֲשֶׂה
  choice: 会怎么办
  rationale: עשה含义宽泛；疑问语境中“会怎么办”是自然、直接的现代汉语表达。
- source_word: גְּאוֹן הַיַּרְדֵּן
  choice: 约旦河边的密林
  rationale: 该短语字面可指“约旦河的威荣/骄傲”，也可能与河水涨溢有关；结合经文用法，主文采用可能所指的河岸茂密丛林，同时以脚注保留争议。
theological_decisions:
- issue: בּוֹטֵחַ在本节中的含义
  choice: 处境上觉得安稳
  alternative: 信靠
  rationale: 本节将较轻的困难与更大的危险对比，焦点是在太平处境中的安全感，并非明确谈论对上帝的信靠；因此避免加入原文未明说的神学对象。
- issue: גְּאוֹן הַיַּרְדֵּן的解释
  choice: 约旦河岸危险的密林
  alternative: 约旦河的威荣；约旦河涨溢之处
  rationale: 此希伯来短语含义有争议。主文采用上下文中较易理解的具体所指，脚注则保留较直译的可能性，不将歧义完全消除。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语，以两个递进的反问保留原文的警策力量；“尚且……怎能……”和“尚且……又会……”呈现由较轻处境到更严峻处境的平行结构。
