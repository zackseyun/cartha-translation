  rationale: 仅作两项安全修订：以“确实学习”避免将语法强调解释为“真心”的内在动机；以“雅威永活！”更直接对应固定的希伯来语誓言公式。其余措辞、条件—结果结构、比较关系和建造隐喻均可保留。
