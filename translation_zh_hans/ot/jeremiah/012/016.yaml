id: JER.12.16
reference: Jeremiah 12:16
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/הָיָ֡ה אִם לָמֹ֣ד יִלְמְדוּ֩ אֶת דַּֽרְכֵ֨י עַמִּ֜/י לְ/הִשָּׁבֵ֤עַ בִּ/שְׁמִ/י֙ חַי יְהוָ֔ה כַּ/אֲשֶׁ֤ר לִמְּדוּ֙ אֶת עַמִּ֔/י לְ/הִשָּׁבֵ֖עַ בַּ/בָּ֑עַל וְ/נִבְנ֖וּ בְּ/ת֥וֹךְ עַמִּֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/012/016.yaml
  text: And it will happen that if they indeed learn the ways of my people[a], to swear by my name, ‘As Yahweh lives,’ just as they taught my people to swear by Baal[c][b], then they will be built up in the midst of my people.
translation:
  language: zh_hans
  text: 如果他们确实学习我子民的道路[a]，奉我的名起誓说：“雅威永活！”[b]——正如他们曾教我的子民奉巴力起誓——那么，他们就必在我子民中被建立起来。[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “确实学习”：原文把同一词根的不定式绝对形与限定动词连用，以加强语气；也可译作“切实学习”或“务必学习”。
    reason: 说明原文的强调结构及可能译法。
  - marker: b
    text: 直译“雅威活着”；这是希伯来语的起誓公式，也可译作“我指着永生的雅威起誓”。
    reason: 交代誓言公式的字面形式与语用功能。
  - marker: c
    text: “被建立起来”原文直译为“被建造”；也可理解为“在我子民中得以立足”。
    reason: 保留建造隐喻，并提示其可能表示确立或接纳。
lexical_decisions:
- source_word: וְהָיָה אִם
  choice: 如果……那么
  rationale: 该结构引出未来条件及其结果；现代汉语用“如果……那么”自然表达，不必机械译出“事情将会发生”。
- source_word: לָמֹד יִלְמְדוּ
  choice: 真心学习
  rationale: 同根不定式绝对形与限定动词连用具有强调作用。“真心学习”传达切实、认真的学习，又避免把强调过度限定为勤奋程度。
- source_word: דַּרְכֵי עַמִּי
  choice: 我子民的道路
  rationale: 保留“道路”的比喻及其行为、敬拜和生活方式等宽广含义。
- source_word: לְהִשָּׁבֵעַ בִּשְׁמִי
  choice: 奉我的名起誓
  rationale: 准确表达以某一名字作为誓言凭据的含义，并保留与“奉巴力起誓”的平行。
- source_word: חַי יְהוָה
  choice: 永生的雅威作证
  rationale: 这是希伯来语誓言公式；此译法在现代汉语中明确表现其起誓功能，同时保留“雅威是活着的”这一语义核心。
- source_word: יְהוָה
  choice: 雅威
  rationale: 直接音译四字神名，避免以称号取代专名。
- source_word: כַּאֲשֶׁר לִמְּדוּ אֶת עַמִּי
  choice: 正如他们曾教我的子民
  rationale: “正如”保留比较关系，“曾”表明这里回顾这些民族以往造成的影响。
- source_word: לְהִשָּׁבֵעַ בַּבָּעַל
  choice: 奉巴力起誓
  rationale: 保持与“奉我的名起誓”的结构对应，突出敬拜对象的对比。
- source_word: וְנִבְנוּ
  choice: 就必……被建立起来
  rationale: 保留בנה被动式的建造隐喻及未来结果，不把它单一解释为物质重建、兴盛或归化。
- source_word: בְּתוֹךְ עַמִּי
  choice: 在我子民中
  rationale: 自然表达“在……中间、内部”的意义，并呈现这些民族被纳入或确立于群体之中的图景。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名，因此采用现代汉语常见的学术性音译“雅威”，保留其作为专名的性质。
- issue: חַי יְהוָה 的誓言功能
  choice: 永生的雅威作证
  alternative: 雅威永活；我指着永生的雅威起誓
  rationale: 选择能让普通读者辨明这是誓言公式的表达；脚注同时提供较贴近字面的译法，以免遮蔽原文形式。
- issue: וְנִבְנוּ בְּתוֹךְ עַמִּי 的含义
  choice: 在我子民中被建立起来
  alternative: 在我子民中得以立足；在我子民中被建造
  rationale: 保留被动的建造隐喻和神学开放性，既可指稳固、恢复，也暗示进入神子民群体，却不具体规定其方式。
translation_notes:
  register: 采用现代、庄重而清楚的书面汉语。“我子民”保留圣经语体但不过分古雅；破折号标明比较插入语，使条件句主干清晰。所有脚注标记均置于相关正文之后。
