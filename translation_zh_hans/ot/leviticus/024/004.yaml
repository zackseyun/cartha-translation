  text: עַ֚ל הַ/מְּנֹרָ֣ה הַ/טְּהֹרָ֔ה יַעֲרֹ֖ךְ אֶת הַ/נֵּר֑וֹת לִ/פְנֵ֥י יְהוָ֖ה תָּמִֽיד־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/004.yaml
  text: On the pure lampstand he shall arrange the lamps before Yahweh continually[a].
translation:
  language: zh_hans
  text: 他要在洁净的灯台上，把灯盏常常摆列在雅威面前。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “雅威”是希伯来文神名 יהוה（YHWH）的音译。
    reason: 说明原文使用的是神的专名，而非“主”等称号。
lexical_decisions:
- source_word: עַל הַמְּנֹרָה
  choice: 在灯台上
  rationale: 介词 עַל 在此表示灯盏相对于灯台的位置；מְנוֹרָה 指圣所中承托多个灯盏的灯台。
- source_word: הַטְּהֹרָה
  choice: 洁净的
  rationale: טָהוֹר 在祭司礼仪语境中可指礼仪上的洁净，也可能涉及器物材质的纯净；正文采用“洁净的”，不擅自增补原文未明说的“纯金”。
- source_word: יַעֲרֹךְ
  choice: 摆列
  rationale: ערך 表示按次序安放、陈列；“摆列”既保留有序安排之意，也符合礼仪语境。
- source_word: הַנֵּרוֹת
  choice: 灯盏
  rationale: נֵרוֹת 指灯台上的各个盛油灯具；“灯盏”比泛称“灯”更能显出具体器物。
- source_word: לִפְנֵי יְהוָה
  choice: 在雅威面前
  rationale: לִפְנֵי 是礼仪语境中的固定表达，意为在某位面前或其临在之处；יְהוָה 按其专名译为“雅威”。
- source_word: תָּמִיד
  choice: 常常
  rationale: תָּמִיד 在祭司文献中可表示持续不断或按规定经常进行；“常常”保留这种范围，不把它限定为绝无间断。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四辅音神名 YHWH；采用“雅威”作为其通行的现代汉语音译，以保留专名而不以称号替代。
- issue: תָּמִיד 所表达的时间性质
  choice: 常常
  alternative: 不断地；定期
  rationale: 该词在礼仪法规中兼有持续性和按例反复实行的可能；“常常”避免将经文过度解释为绝对连续或仅仅定期。
translation_notes:
  register: 采用现代、庄重而易懂的礼仪用语。“灯盏”与“灯台”明确区分器具层级；语序尽量贴近希伯来文，同时保持自然汉语表达。
