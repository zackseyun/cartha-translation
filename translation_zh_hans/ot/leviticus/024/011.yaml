  to: 那以色列妇人的儿子直呼那名，又咒骂[a]；人们把他带到摩西面前。他母亲名叫示罗密，是底伯利的女儿，属于但支派。
  rationale: 修订仅改善现代普通话的自然度和句法清晰度。“直呼那名，又咒骂”继续将两个希伯来动词分别表达；脚注保留将第一个动词理解为“亵渎”的可行读法，不在正文中替读者裁定争议。末句改写后，示罗密为底伯利之女及其但支派归属均清晰可见。
