  text: וַ֠/יִּקֹּב בֶּן הָֽ/אִשָּׁ֨ה הַ/יִּשְׂרְאֵלִ֤ית אֶת הַ/שֵּׁם֙ וַ/יְקַלֵּ֔ל וַ/יָּבִ֥יאוּ אֹת֖/וֹ אֶל מֹשֶׁ֑ה וְ/שֵׁ֥ם אִמּ֛/וֹ שְׁלֹמִ֥ית בַּת דִּבְרִ֖י לְ/מַטֵּה דָֽן־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/011.yaml
  text: The son of the Israelite woman blasphemed the Name and cursed[a], and they brought him to Moses. Now his mother's name was Shelomith daughter of Dibri, of the tribe of Dan.
translation:
  language: zh_hans
  text: 那以色列妇人的儿子直呼那名，又咒骂[a]；人们把他带到摩西面前。他母亲名叫示罗密，是底伯利的女儿，属于但支派。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“亵渎了那名”；下文仍接“又咒骂”。这里译作“直呼”的希伯来动词也可指“明确说出”或“指明”；在本语境中，也可能被理解为亵渎行为的一部分。
    reason: 保留נקב在此处“明确说出／指明”与“亵渎”之间的语义歧义，并明确该替代释义只对应第一个动词。
lexical_decisions:
- source_word: וַיִּקֹּב
  choice: 说出了
  rationale: נקב的基本语义可涉及明确指出、清楚说出；与“那名”连用，且后面另有“咒骂”，译作“说出了”可保留两个动词的先后与区别，不把二者合并为一个意思。
- source_word: בֶּן הָאִשָּׁה הַיִּשְׂרְאֵלִית
  choice: 那以色列妇人的儿子
  rationale: 直译这一结构，并自然承接上下文对该人的身份说明。
- source_word: אֶת הַשֵּׁם
  choice: 那名
  rationale: 定冠词表明这里不是泛指任何名字，而是以敬称指上帝的名；“那名”既保留原文含蓄的表达，也不擅自补入四字神名。
- source_word: וַיְקַלֵּל
  choice: 并且咒骂
  rationale: קלל的加强词干在此通常意为咒诅、咒骂；“咒骂”直接表达动作，同时不预先限定咒骂的具体措辞。
- source_word: וַיָּבִיאוּ אֹתוֹ אֶל־מֹשֶׁה
  choice: 众人就把他带到摩西那里
  rationale: 原文是主语未明的第三人称复数主动式；“众人”在中文中自然表达这种未具体点名的群体。
- source_word: וְשֵׁם אִמּוֹ
  choice: 他母亲名叫
  rationale: 简洁自然地引入补充性的家世资料。
- source_word: שְׁלֹמִית בַּת־דִּבְרִי
  choice: 示罗密，是……底伯利的女儿
  rationale: 按现代普通话常见圣经音译处理人名，并清楚表达父女关系。
- source_word: לְמַטֵּה דָן
  choice: 但支派
  rationale: 该惯用语表示支派归属；中文以“但支派”简洁准确地表达。
theological_decisions:
- issue: נקב与“那名”连用时的含义
  choice: 理解为明确说出上帝的名，随后另有咒骂的行为
  alternative: 将该动词本身理解为“亵渎”，译作“亵渎了那名，并且咒骂”
  rationale: 原文连续使用נקב和קלל两个动词。正文区分“说出”与“咒骂”，可保存原文的词汇结构和法律叙事中的张力；脚注则注明“亵渎”的语境性理解，不排除这一真实可能。
translation_notes:
  register: 采用庄重而通顺的现代标准普通话。“那名”保留原文对上帝之名的敬称和含蓄表达；“众人”自然呈现原文未指明主语的复数动词。正文中的脚注标记[a]与脚注完全对应。
