  text: וַ/יְדַבֵּ֣ר מֹשֶׁה֮ אֶל בְּנֵ֣י יִשְׂרָאֵל֒ וַ/יּוֹצִ֣יאוּ אֶת הַֽ/מְקַלֵּ֗ל אֶל מִ/חוּץ֙ לַֽ/מַּחֲנֶ֔ה וַ/יִּרְגְּמ֥וּ אֹת֖/וֹ אָ֑בֶן וּ/בְנֵֽי יִשְׂרָאֵ֣ל עָשׂ֔וּ כַּֽ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/023.yaml
  text: So Moses spoke to the sons of Israel[a], and they brought the one who had cursed outside the camp and stoned him with stones. Thus the sons of Israel did as Yahweh had commanded Moses.
translation:
  language: zh_hans
  text: 于是，摩西告诉以色列人，他们就把那曾咒诅的人[a]带到营外，用石头打死他。以色列人照耶和华吩咐摩西的做了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“那亵渎者”。希伯来语分词直译为“那咒诅的人”，指上文咒诅神圣之名的那个人。
    reason: 说明词语的直译与上下文中较具解释性的译法。
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: 说了
  rationale: דבר 的皮耶勒词干常指“说、讲话”；此处承接上文神给摩西的命令，译为“说了”自然，并保留经文未复述话语内容的简洁。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 希伯来语字面为“以色列的众子”，在现代汉语中“以色列人”准确、自然地指以色列共同体，也避免“以色列的儿子们”可能造成的血缘或性别误解。
- source_word: וַיּוֹצִיאוּ
  choice: 带到……外
  rationale: יצא 的使役式表示“使出去、带出去”。与目的地“营外”搭配，译作“带到营外”符合现代汉语运动表达。
- source_word: הַמְקַלֵּל
  choice: 那咒诅的人
  rationale: 这是 קלל（“咒诅”）的带冠词分词，回指上文咒诅圣名的那个人。正文保留直接词义，不以解释性更强的“亵渎者”取代。
- source_word: מִחוּץ לַמַּחֲנֶה
  choice: 营外
  rationale: 该短语表示营地范围之外；配合“带到”，简洁译为“营外”自然准确。
- source_word: וַיִּרְגְּמוּ אֹתוֹ אָבֶן
  choice: 用石头打死他
  rationale: רגם 表示以石头击打，司法处刑语境明确指用石头处死。汉语“用石头打死”既保留明说的 אָבֶן（石头），也自然传达动作结果。
- source_word: עָשׂוּ כַּאֲשֶׁר צִוָּה
  choice: 照……吩咐……的做了
  rationale: 这是表示遵照先前命令而行的总结公式；此译法保留行动与命令之间的对应关系。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文读者熟悉的专名“耶和华”呈现四字神名，而不以“主”这一称号替代。
theological_decisions:
- issue: 是否把 הַמְקַלֵּל 解释性地译为“亵渎者”
  choice: 那咒诅的人
  alternative: 那亵渎者
  rationale: 上下文确实涉及对神圣之名的亵渎，但本节所用的是 קלל（“咒诅”）的分词。正文保留其直接词义，并在脚注说明上下文所指，以免消除词汇层面的差别。
- issue: 如何呈现四字神名 יְהוָה
  choice: 耶和华
  alternative: 雅威；上主
  rationale: “耶和华”是现代中文圣经语境中广为识别的神名形式，能把专名与称号“主”区分开；原始读音并非完全确定，因此不声称此形式精确复原古代发音。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“于是……就……”体现叙事推进；“用石头打死”比生硬的“用石头石击”自然，同时保留原文明确提到石头。所有脚注标记均已置于正文相应位置。
