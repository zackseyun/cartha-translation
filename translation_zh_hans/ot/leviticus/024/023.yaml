  source_fidelity: 译文整体准确地呈现了摩西向以色列人传话、众人把那咒诅者带到营外并以石头处死他，以及他们遵行耶和华吩咐摩西之事。惟“对以色列人说了”在汉语中缺少可承接的内容，且与后句以分号连接不够合乎叙事表达；改为“告诉以色列人”可自然表达此处向会众传达命令的动作，未增添实质意义。
  naturalness: “摩西对以色列人说了；他们就……”不自然：“说了”通常需要引出所说内容，分号也不适于连接此处紧密的叙事动作。以逗号连接并采用“告诉”更符合现代标准汉语。将“那咒诅的人”调整为“那曾咒诅的人”，可清楚体现该分词回指前文已发生的行为，避免名词短语生硬。
  terminology: “以色列人”“营外”“耶和华”均恰当。“用石头打死他”在此司法处刑语境中自然地表达了“用石头砸/石刑”的含义，并保留原文明确的“石头”。脚注保留“亵渎者”为上下文性的替代译法，且不将其强加于正文，处理妥当。
