  text: וּ/מַכֵּ֥ה בְהֵמָ֖ה יְשַׁלְּמֶ֑/נָּה וּ/מַכֵּ֥ה אָדָ֖ם יוּמָֽת׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/021.yaml
  text: And whoever strikes down an animal shall make restitution for it[a], but whoever strikes down a man shall be put to death.
translation:
  language: zh_hans
  text: 打死牲畜的，必须赔偿；打死人的，必须被处死。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַכֵּה
  choice: 打死
  rationale: 这是 נכה 的使役主动分词。在本节的法律语境中，后果分别是赔偿和处死，表明所说的是致命击打；“打死”以自然、简明的现代汉语准确表达其含义。
- source_word: בְהֵמָה
  choice: 牲畜
  rationale: 此词可泛指兽类，常特别指家养牲畜；赔偿的法律语境使“牲畜”比宽泛的“动物”更贴切。
- source_word: יְשַׁלְּמֶנָּה
  choice: 必须赔偿
  rationale: שלם 的加强词干在此表示作出补偿；阴性单数后缀回指 בְהֵמָה。“赔偿”自然传达法律上的偿付义。
- source_word: אָדָם
  choice: 人
  rationale: 此处与牲畜相对，指个别的人，而非抽象的人类整体。现代汉语“人”既准确又不必引入原文没有明示的性别限制。
- source_word: יוּמָת
  choice: 必须处死
  rationale: 使役被动式表示使犯罪者死亡，即依法处死。“必须处死”保留法律规定的强制性和被动结果。
theological_decisions:
- issue: 法律语境中 אָדָם 的所指
  choice: 人
  alternative: 男人
  rationale: 希伯来语 אָדָם 在此虽以阳性单数形式出现，却与牲畜相对，语义是一个人。译作“人”保留其广泛适用性，也符合现代汉语法律表述；译作“男人”可能误导读者，以为该规定只适用于男性。
- issue: מַכֵּה 是否明确译出致死含义
  choice: 打死
  alternative: 击打
  rationale: 本节以赔偿牲畜和处死人为对应后果，上下文表明击打是致命的。译作“打死”使汉语读者清楚理解案件性质，但不另行添加谋杀、误杀等原文未区分的法律类别。
translation_notes:
  register: 采用简洁、庄重的现代法律句式，以“……的，必须……”对应希伯来语分词式案例法规。两分句结构平行，保留原文牲畜与人的鲜明对照。
