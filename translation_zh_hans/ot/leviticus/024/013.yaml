  text: 耶和华对摩西说：
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: 说
  rationale: 该动词连同前置的叙事连接形式推进叙事；现代汉语用“说”自然引出下文的话语，无须机械译出“然后”。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代简体中文圣经读者熟悉的神名传统音译“耶和华”，将其作为专名，而非以称号替代。
- source_word: אֶל מֹשֶׁה
  choice: 对摩西
  rationale: 介词 אֶל 在言说结构中自然译为“对”；מֹשֶׁה 按现代汉语通行译名作“摩西”。
- source_word: לֵאמֹר
  choice: 说：
  rationale: 这是引出直接话语的惯用公式；汉语以“说：”及冒号自然表达，并提示话语内容见下节。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用四字神名。正文保留为专名；“耶和华”是现代汉语圣经语境中最广为识别且庄重的形式，同时不把它改译为“主”这一称号。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。希伯来语的叙事连接词不单独译出，以免中文生硬；“说：”兼顾 דבר 与 לֵאמֹר 构成的引语公式。
