  text: וַ/יַּנִּיחֻ֖/הוּ בַּ/מִּשְׁמָ֑ר לִ/פְרֹ֥שׁ לָ/הֶ֖ם עַל פִּ֥י יְהוָֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/012.yaml
  text: So they put him in custody[a], to clarify for them according to the word of Yahweh.
translation:
  language: zh_hans
  text: 他们把他拘押起来，等候雅威向他们清楚指示[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “清楚指示”也可译作“明确宣告”或“说明清楚”。原文没有说明指示的具体内容；按上下文，是等候雅威对此事作出指示。
    reason: 说明希伯来动词的词义范围，并交代原文省略的宾语而不把解释写入正文。
lexical_decisions:
- source_word: וַיַּנִּיחֻהוּ
  choice: 他们把他……起来
  rationale: 该使役形式在这里表示“安置、放置”。结合后面的拘押语境，译成“把他……起来”符合现代汉语叙事表达。
- source_word: בַּמִּשְׁמָר
  choice: 拘押
  rationale: מִשְׁמָר在此指受看守的羁押状态，而非一般的“看守”或“守望”；“拘押”简洁清楚，也符合本节的司法语境。
- source_word: לִפְרֹשׁ
  choice: 明确说明
  rationale: פרשׁ可表示“使清楚、解释、明确宣告”。原文没有明说所说明的内容，因此正文不补入“判决”或“该怎样处置他”，以保留原文的省略与开放性。
- source_word: לָהֶם
  choice: 向他们
  rationale: 介词加代词表示说明所面向的人；“向他们”与“明确说明”搭配自然。
- source_word: עַל־פִּי
  choice: 照……的话
  rationale: 该习语字面为“按……的口”，表示以权威话语为依据。“照……的话”既保留言说色彩，也不过早限定为具体命令。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以“雅威”音译四字神名，保留其作为以色列之神专名的性质，而不以称号替代。
theological_decisions:
- issue: 如何译出神名יְהוָה
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名；“雅威”是现代汉语中较贴近通行学术重构的音译，并避免把专名改成称号。
- issue: 是否补明待澄清的是判决或处置方式
  choice: 不在正文补明，保留“明确说明”的未明宾语
  alternative: 明确说明该怎样处置他；把判决指示清楚
  rationale: 司法语境确实暗示所求的是对此案的裁定，但本节原文没有明说宾语。保留省略可避免把上下文推断写进正文。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“拘押起来”清楚表达受看守的羁押状态；“好照雅威的话向他们明确说明”尽量保持原文目的结构及未明说的内容，不擅自补成具体判决。
