id: LEV.24.7
reference: Leviticus 24:7
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/נָתַתָּ֥ עַל הַֽ/מַּעֲרֶ֖כֶת לְבֹנָ֣ה זַכָּ֑ה וְ/הָיְתָ֤ה לַ/לֶּ֨חֶם֙ לְ/אַזְכָּרָ֔ה אִשֶּׁ֖ה לַֽ/יהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/007.yaml
  text: And you shall put pure frankincense on each row[a], and it shall be for the bread as a memorial portion[b], a food offering to Yahweh.
translation:
  language: zh_hans
  text: 要把纯净的乳香放在每一行[a]上；这乳香要为饼作记念之份，成为献给雅威的火祭[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“陈列的一组”；这里按上一节所说两行陈设的饼理解。
    reason: lexical_alternative
  - marker: b
    text: 或译“献给雅威的食物祭”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתָּ
  choice: 要把……放在
  rationale: 带连接词的完成式在祭祀条例中表达命令；用“要把……放在”符合现代汉语律例文体。
- source_word: עַל הַמַּעֲרֶכֶת
  choice: 放在每一行上
  rationale: מַעֲרֶכֶת 指有次序的排列；结合上一节两行陈设饼的语境，单数在此可作逐一分配理解，译作“每一行”清楚自然，同时以脚注保留较形式对应的译法。
- source_word: לְבֹנָה זַכָּה
  choice: 纯净的乳香
  rationale: לְבֹנָה 是乳香，זַכָּה 表示纯净，适合祭仪语境。
- source_word: וְהָיְתָה לַלֶּחֶם לְאַזְכָּרָה
  choice: 这乳香要为饼作记念之份
  rationale: 阴性代词所指为乳香；לְאַזְכָּרָה 是祭祀术语，指献上的代表性部分。“为饼作记念之份”既说明乳香与饼的关系，也避免额外断定“记念”具体作用于谁。
- source_word: אִשֶּׁה
  choice: 火祭
  rationale: 祭司文献中的固定祭祀用语，通常指以火献上的祭物；“火祭”简洁并贴近原文，另一种功能性译法列于脚注。
- source_word: לַיהוָה
  choice: 献给雅威
  rationale: 介词 לְ 在献祭语境中表示祭物的归向；专名 יְהוָה 音译为“雅威”，保留盟约之名。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；音译“雅威”较能保留其专名性质，不以称号取代，也不采用较晚形成的混合读音。
- issue: לְאַזְכָּרָה 所表达的记念功能
  choice: 为饼作记念之份
  alternative: 为饼作记念祭；使饼蒙记念
  rationale: 原文没有明说谁记念谁；所选译法保留祭祀术语及其关系，同时不把神学含义解释得过满。
- issue: אִשֶּׁה 的祭祀性质
  choice: 火祭
  alternative: 食物祭
  rationale: “火祭”直接反映该词在祭司文献中的传统理解；“食物祭”强调献给神的祭物功能，但可能弱化以火献上的含义，故置于脚注。
translation_notes:
  register: 采用现代、庄重而易懂的律例语体。“记念之份”保留祭祀术语色彩；分号呈现后半句对乳香功用的说明。所有代词指向均按希伯来语阴性形式明确为“乳香”。
