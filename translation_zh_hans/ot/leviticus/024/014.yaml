  text: הוֹצֵ֣א אֶת הַֽ/מְקַלֵּ֗ל אֶל מִ/חוּץ֙ לַֽ/מַּחֲנֶ֔ה וְ/סָמְכ֧וּ כָֽל הַ/שֹּׁמְעִ֛ים אֶת יְדֵי/הֶ֖ם עַל רֹאשׁ֑/וֹ וְ/רָגְמ֥וּ אֹת֖/וֹ כָּל הָ/עֵדָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/014.yaml
  text: Bring the one who cursed outside the camp[a], and let all who heard lay their hands on his head[b], and let all the congregation stone him.
translation:
  language: zh_hans
  text: “把那咒诅者带到营外[a]。凡听见的人都要把手按在他头上[b]，全会众要用石头打死他。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“那亵渎者”或“那亵渎的人”。希伯来文直译为“那咒诅者”。
    reason: alternative_reading
  - marker: b
    text: 这里的按手很可能表示听见者正式指认此人；也有人认为这一动作还带有象征意义。
    reason: cultural_note
lexical_decisions:
- source_word: הוֹצֵא
  choice: 带到……外
  rationale: 这是יצא使役词干的命令式，意思是使某人出去；“带到营外”既准确表达动作及目的地，也符合现代汉语习惯。
- source_word: הַמְקַלֵּל
  choice: 那咒诅的人
  rationale: 该词是קלל的带冠词分词，指上下文中特定的犯事者。“那咒诅的人”保留“咒诅”的直接词义，不在正文中先行解释为“亵渎者”。
- source_word: מִחוּץ לַמַּחֲנֶה
  choice: 营外
  rationale: 这是表示营地以外的惯用空间表达；“营外”简洁自然，并保留从群体所在空间移出的司法场景。
- source_word: וְסָמְכוּ
  choice: 都要……按
  rationale: סמך与手和头连用时表示把手按在某人头上。这里承接开头的命令，译作“都要”自然传达指令语气。
- source_word: כָל הַשֹּׁמְעִים
  choice: 所有听见的人
  rationale: 分词指听见那次言语行为的人，即见证人。原文未明说所听见的宾语，因此中文也不补入“他”或“这话”。
- source_word: יְדֵיהֶם עַל רֹאשׁוֹ
  choice: 把手按在他头上
  rationale: 准确保留按手这一动作。希伯来语“他们的手”为复数；汉语集合性表达中“所有……的人都把手”已经自然涵盖各人的手，无须生硬译成“他们的双手”。
- source_word: וְרָגְמוּ אֹתוֹ
  choice: 用石头打死他
  rationale: רגם在此指以石头执行死刑。“用石头打死”比单说“拿石头打”更明确表达该司法处决，同时是现代汉语的自然说法。
- source_word: כָל הָעֵדָה
  choice: 全会众
  rationale: עֵדָה指聚集的群体或共同体。“全会众”保留正式、共同参与的群体含义，也符合《利未记》的语域。
theological_decisions:
- issue: 应将犯事者译为“那咒诅的人”还是“亵渎者”
  choice: 那咒诅的人
  alternative: 亵渎者／那亵渎的人
  rationale: 此处直接使用קלל“咒诅”的分词；虽然上下文表明所涉及的是上帝的名，因而“亵渎者”是合理解释，但正文保留原词的直接意义，并在脚注列出解释性译法。
- issue: 按手动作的含义
  choice: 正文只陈述把手按在他头上的动作
  alternative: 在正文中解释为见证人正式指认犯事者，或解释为象征性转移罪责
  rationale: 本节命令这一动作，却没有明说其象征意义。为避免把某一种神学解释写入正文，译文保留动作本身，并在脚注审慎说明可能的司法辨认作用及其他理解。
translation_notes:
  register: 采用现代、庄重而易懂的叙事—律法语体。“营外”“全会众”保留经文的群体和司法背景；句式直接有力，符合神谕中命令的语气。脚注标记[a]、[b]均已在正文相应位置出现。
