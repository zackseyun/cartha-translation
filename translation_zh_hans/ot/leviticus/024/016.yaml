  text: וְ/נֹקֵ֤ב שֵׁם יְהוָה֙ מ֣וֹת יוּמָ֔ת רָג֥וֹם יִרְגְּמוּ ב֖/וֹ כָּל הָ/עֵדָ֑ה כַּ/גֵּר֙ כָּֽ/אֶזְרָ֔ח בְּ/נָקְב/וֹ שֵׁ֖ם יוּמָֽת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/016.yaml
  text: Whoever blasphemes the name of Yahweh shall surely be put to death[a]; all the congregation shall certainly stone him[b]. The sojourner as well as the native-born—when he blasphemes the Name—shall be put to death.
translation:
  language: zh_hans
  text: 凡亵渎[a]耶和华之名的，必被处死；全会众都要用石头打死他。无论是寄居者还是本地人，亵渎这名的，必被处死[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “亵渎”所译的希伯来语动词也可表示“明确说出”或“指名”，在这里也可能有“咒诅”的意思。
    reason: lexical_alternative
  - marker: b
    text: 原文这里仅作“名”，没有重述“耶和华”；此处以回指方式指上文的神名。
    reason: cultural_note
lexical_decisions:
- source_word: וְנֹקֵב / בְּנָקְבוֹ
  choice: 亵渎
  rationale: נקב可指清楚说出、指名，也可在此语境中表示辱骂或亵渎。结合前文实际发生的咒诅行为及本节死刑条款，“亵渎”最自然地表达犯罪性质，同时以脚注保留词义上的争议。
- source_word: שֵׁם יְהוָה
  choice: 耶和华之名
  rationale: שֵׁם意为“名”；יְהוָה是神的专名。采用现代中文圣经语体中广为人知的“耶和华”，而不以“主”替代原文专名。
- source_word: מוֹת יוּמָת
  choice: 必被处死
  rationale: 不定式绝对式与同根限定动词连用，强化司法判决的确定性；“必被处死”保留被动和法律语气。
- source_word: רָגוֹם יִרְגְּמוּ בוֹ
  choice: 都要用石头打死他
  rationale: 同根不定式绝对式强化动作；中文“都要”结合主语“全会众”自然传达全体执行和命令的确定性。
- source_word: כָּל הָעֵדָה
  choice: 全会众
  rationale: עֵדָה指以色列集体或聚集的群体；“全会众”兼具共同体和正式宗教法律语域。
- source_word: כַּגֵּר כָּאֶזְרָח
  choice: 无论是寄居者还是本地人
  rationale: גֵּר指居住在以色列人中间的外来居民，אֶזְרָח指本地成员；此译清楚表达二者在该法律下同等受约束。
- source_word: שֵׁם（第二次出现）
  choice: 那名
  rationale: 原文第二处仅有“名”，省略יְהוָה，具有敬称性回指。“那名”既回指前文，又保留原文省略神名的表达特点。
theological_decisions:
- issue: נקב与神名连用时的含义
  choice: 亵渎
  alternative: 说出／明确说出；咒诅
  rationale: 该词本身可有“指名、清楚说出”之义，但上下文涉及对神名的咒诅和亵慢。正文用“亵渎”避免将禁令武断地理解为禁止任何发音，同时脚注说明其他可能。
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威；上主
  rationale: 原文直接使用四字神名，而非אֲדֹנָי“主”。“耶和华”在现代汉语基督教传统中辨识度高，并保留其作为专名的功能。
- issue: 第二处שֵׁם是否补出神名
  choice: 那名
  alternative: 耶和华之名／圣名
  rationale: 原文第二处绝对使用“名”，通过上下文指向神名。译作“那名”保留敬称性省略，不额外加入原文没有的“圣”。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“必被处死”保留法律判词语气；“全会众”“寄居者”“本地人”维持利未记共同体法规的正式语域。正文中每个脚注标记均已对应列出。
