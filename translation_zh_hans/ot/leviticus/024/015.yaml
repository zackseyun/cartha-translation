  text: וְ/אֶל בְּנֵ֥י יִשְׂרָאֵ֖ל תְּדַבֵּ֣ר לֵ/אמֹ֑ר אִ֥ישׁ אִ֛ישׁ כִּֽי יְקַלֵּ֥ל אֱלֹהָ֖י/ו וְ/נָשָׂ֥א חֶטְאֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/015.yaml
  text: And you shall speak to the sons of Israel, saying, ‘If any man curses his God, then he shall bear his sin.
translation:
  language: zh_hans
  text: 你要对以色列人[a]说：“任何人[b]若咒骂他的神，就要担当自己的罪[c]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语直译为“以色列的众子”，这里集体指以色列民。
    reason: lexical_alternative
  - marker: b
    text: 希伯来语重复“人”这个词，即“人，人”，用来表示逐一适用，可译作“无论谁”或“任何人”。
    reason: lexical_alternative
  - marker: c
    text: “担当自己的罪”是希伯来语惯用说法，指承担这项罪的罪责或相应责任。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֶל
  choice: 对
  rationale: 介词指明说话的对象；句首的连接词在中文中若译作“并且”会显得生硬，因此不另行明译。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 原文直译为“以色列的众子”，在这里集体指以色列民；“以色列人”是自然、准确的现代汉语表达，直译形式在脚注说明。
- source_word: תְּדַבֵּר לֵ/אמֹר
  choice: 说
  rationale: 法律指令中的未完成式表达命令语气，结合引语式不定词，在中文中用“你要……说”自然传达。
- source_word: אִישׁ אִישׁ
  choice: 任何人
  rationale: “人”重复使用，具有逐一分配、无一例外的强调作用；“任何人”在现代汉语中准确传达这一语用功能。
- source_word: כִּי
  choice: 若
  rationale: 在条例的个案条件句中引出假设情形；“若”简洁而庄重。
- source_word: יְקַלֵּל
  choice: 咒骂
  rationale: 该词在此意为咒诅、辱骂或轻蔑对待；“咒骂”保留咒诅与辱骂的语义范围，又不预先等同于下一节更具体的亵渎圣名之罪。
- source_word: אֱלֹהָיו
  choice: 他的神
  rationale: 保留第三人称单数所属关系，也不擅自把原文收窄为“耶和华”；“神”在此保留原词可能涉及其所敬奉之神的表述张力。
- source_word: וְ/נָשָׂא חֶטְאוֹ
  choice: 就要担当自己的罪
  rationale: 连接词在条件句后译为“就”，明确法律后果；“担当……罪”保留希伯来语惯用表达，不直接扩译为刑罚。
theological_decisions:
- issue: אֱלֹהָיו所指的范围
  choice: 他的神
  alternative: 耶和华；上帝；他的诸神
  rationale: 原文有单数所属后缀，并未在本节使用耶和华之名。保留“他的神”可避免把本节与下一节关于圣名的具体罪行完全合并，也不消除原文措辞的开放性。
- issue: 法律主体אִישׁ אִישׁ的性别与分配意义
  choice: 任何人
  alternative: 任何男子；人，人；凡人
  rationale: 希伯来语形式为阳性单数重复，但在条例中承担分配性功能。现代汉语“任何人”最自然地表达凡属此情形者，不额外断定该条例只适用于男性。
- issue: “担当自己的罪”的含义
  choice: 保留希伯来语惯用表达
  alternative: 承担罪责；承受犯罪的刑罚
  rationale: 该表达可涉及罪责及由此而来的责任或后果；主文保留其张力，脚注予以解释，而不把含义单独限定为内在罪疚或外在刑罚。
translation_notes:
  register: 采用现代、庄重而易懂的法律条文语体。“若……就要……”清楚呈现条件与后果；引号内保持简洁。用“以色列人”而非生硬的“以色列的众子”，并以脚注保留原文形式。
