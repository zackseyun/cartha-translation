base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/002.yaml
  text: Command the sons of Israel that they bring to you pure oil of beaten olives for the light[b][a], to keep a lamp burning continually.
translation:
  language: zh_hans
  text: “你要吩咐以色列人[a]，把用捣碎的橄榄制成的纯油[b]拿来给你，用来照明，使灯持续燃着。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语字面为“以色列的众子”，这是对以色列全体子民的惯用称谓。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“纯净的、由捣碎橄榄制取的橄榄油”。原文说明这种油以橄榄制成，品质纯净，并采用捣碎的方法制取。
    reason: lexical_alternative
lexical_decisions:
- source_word: צַו
  choice: 吩咐
  rationale: 这是动词 צוה 的命令式，表达直接而有权威的指示；“吩咐”在现代汉语中庄重自然，又不显得无端严厉。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 希伯来语字面为“以色列的众子”，是指以色列全体子民的约民称谓；汉语用“以色列人”最自然，字面形式则在脚注中说明。
- source_word: וְיִקְחוּ אֵלֶיךָ
  choice: 把……拿来给你
  rationale: לקח 通常意为“拿、取”，与“到你这里”连用时表示拿来或带来；此译法兼顾词义和汉语表达。
- source_word: שֶׁמֶן זַיִת זָךְ כָּתִית
  choice: 用捣碎的橄榄制成的纯油
  rationale: 该短语说明油以橄榄为原料、品质纯净，并由捣碎的橄榄制得；这样译可避免误解为把油本身捣碎。
- source_word: לַמָּאוֹר
  choice: 用来照明
  rationale: מָאוֹר 在此指光照或照明用途；“用来照明”比字面的“为了光”更符合现代汉语。
- source_word: לְהַעֲלֹת נֵר
  choice: 使灯……燃着
  rationale: 字面是“使灯上升”，属于点灯并维持其燃烧的惯用表达；“使灯燃着”保留使役意味而表达自然。
- source_word: תָּמִיד
  choice: 常常
  rationale: 在祭司文献中可表示持续或按常规反复进行；“常常”保留其范围上的一定弹性，避免擅自限定为绝不中断。
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל 的性别化约民称谓
  choice: 正文译为“以色列人”，脚注注明字面为“以色列的众子”
  alternative: 正文译为“以色列的众子”
  rationale: 该短语虽采用阳性复数形式，却是指以色列共同体的惯用称谓。现代汉语“以色列人”准确传达所指，脚注同时保留原文形式，避免把称谓中的源语言特征完全隐去。
- issue: תָּמִיד 所表达的持续性
  choice: 常常燃着
  alternative: 永远燃着；持续不断地燃着；定期点灯
  rationale: 此词在礼仪语境中可能表示持续维持，也可能强调恒常、例行的职责。“常常”不把它过度限定为绝无间断，也不削弱其恒常性。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“拿来给你”“用来照明”保持口吻自然；“使灯常常燃着”既体现希伯来语使役结构，也保留 תָּמִיד 在礼仪语境中可能兼有持续和恒常例行的含义。
