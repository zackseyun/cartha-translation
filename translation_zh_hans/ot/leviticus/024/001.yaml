base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/001.yaml
  text: Then Yahweh spoke to Moses[a], saying,
translation:
  language: zh_hans
  text: 耶和华对摩西说：
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: 说
  rationale: 该动词形式承接并推进叙事；现代汉语通常无需另译连接词，直接用“说”自然引出话语。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经传统中对四字神名最通行、最易识别的音译，保留其作为专名的性质，而不以“主”这一称号替代。
- source_word: אֶל מֹשֶׁה
  choice: 对摩西
  rationale: 介词 אֶל 在言说结构中表示话语所指向的对象，汉语自然表达为“对摩西”。
- source_word: לֵאמֹר
  choice: 说
  rationale: 该不定式用于引出随后直接话语。汉语以“说：”即可表达这一功能；若逐字重复为“说……说道”会显得累赘。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威；上主
  rationale: 原文直接使用四字神名。译作“耶和华”既将其保留为专名，也符合普通现代中文读者最熟悉的圣经用语；不以称号“上主”替代。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。希伯来语的叙事连接形式不机械译作“然后”；引语公式合并为汉语惯用的“对摩西说：”。本节本身只构成下文话语的引入。
