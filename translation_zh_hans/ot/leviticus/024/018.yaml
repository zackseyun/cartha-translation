  yaml_path: translation/ot/leviticus/024/018.yaml
  text: 'And whoever strikes down an animal shall make restitution for it: life for life[a].'
translation:
  language: zh_hans
  text: 凡击杀动物的，必须赔偿：以生命偿还生命[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“生命代替生命”。在这里赔偿动物的语境中，这句话表示作出与所损失生命相当的补偿。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמַכֵּה נֶפֶשׁ בְּהֵמָה
  choice: 击杀牲畜的
  rationale: נכה 的使役分词在此引出一般性案例法；与 נֶפֶשׁ בְּהֵמָה 连用，表示导致牲畜死亡。“击杀”既保留击打致死的含义，也符合简洁的现代汉语法律表述。בְּהֵמָה 在本段涉及归人所有、可予赔偿的动物，译作“牲畜”比宽泛的“动物”更贴合语境。
- source_word: יְשַׁלְּמֶנָּה
  choice: 必须赔偿
  rationale: שלם 的 Piel 形式表示补偿或偿还；阴性单数后缀回指 בְּהֵמָה。汉语“赔偿”已自然包含为被杀牲畜作出补偿之意。
- source_word: נֶפֶשׁ תַּחַת נָפֶשׁ
  choice: 以命偿命
  rationale: 保留希伯来文“生命代替生命”的对等补偿公式；现代汉语用“以命偿命”简洁有力，但脚注说明在本节牲畜赔偿语境中，它表达等值补偿，避免将具体执行方式规定得超过原文。
theological_decisions:
- issue: 牲畜律例中“נֶפֶשׁ תַּחַת נָפֶשׁ”的补偿含义
  choice: 正文保留“以命偿命”的对等公式，并由“必须赔偿”及脚注限定其在本节中为牲畜生命的等值补偿。
  alternative: 可直译为“生命代替生命”，或明确译成“要照价赔偿”，但前者汉语较生硬，后者又会抹去原文的重复公式并加入“价格”这一未明说的机制。
  rationale: 支配句的动词 יְשַׁלְּמֶנָּה 明确指向赔偿；同时，原文没有具体说明必须交付另一头牲畜还是采用其他物质补偿，因此既保留公式，也不擅自限定执行办法。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语，保持案例法条文的概括性。“必须”体现未完成式在法律规定中的义务语气；正文中的脚注标记与脚注完全对应。
