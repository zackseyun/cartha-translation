  text: וְ/שַׂמְתָּ֥ אוֹתָ֛/ם שְׁתַּ֥יִם מַֽעֲרָכ֖וֹת שֵׁ֣שׁ הַֽ/מַּעֲרָ֑כֶת עַ֛ל הַ/שֻּׁלְחָ֥ן הַ/טָּהֹ֖ר לִ/פְנֵ֥י יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/006.yaml
  text: And you shall place them in two rows[a], six in each row[b], on the pure table before Yahweh.
translation:
  language: zh_hans
  text: 要把这些饼摆在耶和华面前的洁净桌子[b]上，分成两排[a]，每排六个。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“两组”或“两叠”；希伯来语指按次序摆放成的组合。
    reason: lexical_alternative
  - marker: b
    text: “洁净”在这里主要指礼仪上的洁净，也可译作“纯净”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׂמְתָּ
  choice: 要把……摆
  rationale: שׂוּם意为“放、安置、摆放”；本节是对单数第二人称的指示，用“要把……摆”自然传达其命令意味，并切合陈设饼的语境。
- source_word: אוֹתָם
  choice: 这些饼
  rationale: 原文为阳性复数直接宾语代词“它们”，回指上一节的十二个饼；汉语明说“这些饼”可避免指代含混。
- source_word: שְׁתַּיִם מַעֲרָכוֹת
  choice: 摆成两排
  rationale: מַעֲרָכָה指有秩序的排列或陈设；在桌上摆饼的语境中，“两排”自然明确，同时以脚注保留“两组／两叠”等可能理解。
- source_word: שֵׁשׁ הַמַּעֲרָכֶת
  choice: 每排六个
  rationale: 希伯来文直译近于“六个一排”，具有分配含义；译作“每排六个”符合现代汉语，并清楚表达两排各有六饼。
- source_word: עַל הַשֻּׁלְחָן
  choice: 放在……桌子上
  rationale: עַל在这里表示位于桌面之上；“在……桌子上”是现代汉语最自然的表达。
- source_word: הַטָּהֹר
  choice: 洁净的
  rationale: טָהוֹר在圣所礼仪语境中表示礼仪上的洁净或纯净；“洁净”既自然，也保留其礼仪含义，而不只指表面干净。
- source_word: לִפְנֵי יְהוָה
  choice: 在耶和华面前
  rationale: לִפְנֵי意为“在……面前／临在中”；译作“在耶和华面前”简洁，并保留圣所陈设于神面前的空间与礼仪意味。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 原文直接使用四字神名；“耶和华”是现代中文圣经读者熟悉的专名形式，区别于称号“主”。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用神的专名而非“主”的称号。正文采用中文传统且广为人知的“耶和华”，同时不把它替换为泛称“主”。
- issue: הַטָּהֹר在圣所语境中的含义
  choice: 洁净的桌子
  alternative: 纯净的桌子
  rationale: 这里的形容词涉及礼仪上的洁净，不应仅理解为物理上的干净。“洁净”能保持礼仪意味，又不额外引入特定宗派解释。
translation_notes:
  register: 采用现代、庄重而易懂的指令语体。“这些饼”明确承接上一节；“摆成两排，每排六个”以自然汉语表达原文的有序陈设和分配结构。脚注标记均置于与其说明直接相关的正文位置。
