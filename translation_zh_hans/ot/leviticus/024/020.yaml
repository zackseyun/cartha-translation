base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/020.yaml
  text: fracture for fracture[a], eye for eye, tooth for tooth; as he inflicts an injury on a person[b], so it shall be inflicted on him.
translation:
  language: zh_hans
  text: 以骨折还骨折[a]，以眼还眼，以牙还牙；他怎样使人伤残[b]，也要照样使他伤残。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “还”在这里表示与所造成的伤害相对应；原文直译为“骨折代替骨折”。
    reason: lexical_alternative
  - marker: b
    text: 原文直译近于“在人的身上造成残损”；“使人伤残”是符合现代汉语的表达。“人”在这里是案例法中的泛称。
    reason: lexical_and_cultural_note
lexical_decisions:
- source_word: שֶׁבֶר
  choice: 骨折
  rationale: 此处列举身体伤害，“骨折”比宽泛的“折断”更准确，也符合现代法律语境。
- source_word: תַּחַת
  choice: 以……还……
  rationale: 在同态报偿的固定句式中表示对应、等同的回报；此译保留原文具体而对称的法律表达。
- source_word: עַיִן / שֵׁן
  choice: 眼 / 牙
  rationale: 均为直接的身体部位名称，按原文保留简洁的对应句式。
- source_word: יִתֵּן מוּם
  choice: 使……身体残损
  rationale: נתן字面为“给、置”，与מוּם连用时是“造成残损”的习语；מוּם可指身体上的缺损、残损或伤害。“身体残损”既保留其结果性，也比“瑕疵”更适合伤害案件。
- source_word: אָדָם
  choice: 人
  rationale: 这里是案例法中的泛指单数，指任何一个人；现代汉语用“人”自然准确，无须标明性别。
- source_word: יִנָּתֶן בּוֹ
  choice: 使他身体残损
  rationale: 希伯来语为被动形式，字面近于“也要给在他身上”；汉语若机械保留被动会生硬，因此沿用前句使役结构，同时保留伤害对应落在行为人身上的含义。
theological_decisions:
- issue: 同态报偿公式的性质
  choice: 保留“以骨折还骨折，以眼还眼，以牙还牙”的具体对称表达
  alternative: 译成“按伤害程度给予相应赔偿”
  rationale: 原文使用具体的身体伤害公式，并未在本节明说实施方式。译文不把它预先限定为金钱赔偿，也不额外断定必须如何执行，从而保留文本本身的法律力度与解释空间。
- issue: מוּם的范围
  choice: 身体残损
  alternative: 伤害；缺陷；毁容
  rationale: 该词强调造成的身体缺损或残损；“身体残损”保留结果性的意味，又不把范围缩窄为毁容或一般疼痛。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。前三项保持简短、平行的法律格言节奏；后半句保留原文“怎样……也照样……”的对称关系。
