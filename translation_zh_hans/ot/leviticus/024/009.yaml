base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/009.yaml
  text: It shall belong to Aaron and to his sons[a], and they shall eat it in a holy place, because it is most holy to him from the food offerings of Yahweh, a permanent statute.
translation:
  language: zh_hans
  text: 这饼要归亚伦和他的儿子；他们要在圣洁的地方吃，因为这是从献给耶和华的火祭[a]中归给他的至圣之物。这是一条永远的定例。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“献给耶和华的食物祭”。这里的希伯来语通常指经火献上的祭物。
    reason: 说明אִשֶּׁה可按献祭方式译为“火祭”，也可按祭物的礼仪功能译为“食物祭”。
lexical_decisions:
- source_word: וְהָיְתָה לְאַהֲרֹן וּלְבָנָיו
  choice: 这饼要归亚伦和他的儿子们
  rationale: היה与表示领受者的ל连用，在此表达归属或分配，而非单纯的存在。“这饼”承接上文，并以自然中文说明祭司所得的份。בָנָיו具体指亚伦的儿子们，故保留男性亲属称谓。
- source_word: וַאֲכָלֻהוּ
  choice: 他们要……吃
  rationale: 该形式延续律法规定，兼有将来和规范意味；“要”在现代中文中自然表达此处的规定性。宾语由“这饼”承接，不必重复代词。
- source_word: בְּמָקוֹם קָדֹשׁ
  choice: 在圣洁的地方
  rationale: 原文无定冠词，并未明确限定为圣所中某个名为“圣所”的特定房间；“圣洁的地方”保留其非特指表达。
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: 至圣之物
  rationale: 这是希伯来语最高级惯用语，表示具有最高程度的圣洁；加“之物”可避免读者误解为至圣所这一空间。
- source_word: הוּא לוֹ
  choice: 归给他的至圣之物
  rationale: 保留לֹו的单数形式“他”，没有按上下文中的亚伦及其众子将其顺译为复数；中文语序则调整为自然的归属结构。
- source_word: מֵאִשֵּׁי יְהוָה
  choice: 从献给耶和华的火祭中
  rationale: אִשֶּׁה传统上指经火献上的祭物。“火祭”简洁保留献祭方式，前加“献给”说明其对象；יהוה按项目原则音译为“耶和华”。
- source_word: חָק עוֹלָם
  choice: 永远的定例
  rationale: 该词组指持续有效、世代遵守的法定规例；这是现代中文圣经语域中清楚而庄重的表达。
theological_decisions:
- issue: 在提到亚伦和他儿子们的语境中，单数לֹו所指为何
  choice: 译作单数“他”，让亚伦作为祭司家族代表的可能性由上下文呈现
  alternative: 按共同领受祭物的群体译作“他们”
  rationale: 原文明确使用单数。保留单数可避免为求流畅而消除语法上的张力，也不强行断定其代表性关系的具体神学含义。
- issue: אִשֶּׁה的祭祀含义
  choice: 正文译作“火祭”
  alternative: 译作“食物祭”或“献给耶和华的祭物”
  rationale: 词源及传统用法与经火献祭密切相关；“火祭”不暗示上帝实际进食，并借脚注提示该词也可按祭物作为献给上帝之“食物”的功能来理解。
translation_notes:
  register: 采用现代、庄重而易懂的律法语体。“要归”“要……吃”清楚表达分配与规范；保留“他”的单数和“圣洁的地方”的非特指形式，以免把原文未明确之处具体化。
