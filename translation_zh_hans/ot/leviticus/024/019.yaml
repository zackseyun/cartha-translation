  text: וְ/אִ֕ישׁ כִּֽי יִתֵּ֥ן מ֖וּם בַּ/עֲמִית֑/וֹ כַּ/אֲשֶׁ֣ר עָשָׂ֔ה כֵּ֖ן יֵעָ֥שֶׂה לּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/019.yaml
  text: And if a man inflicts an injury on his fellow[a], just as he has done[b], so it shall be done to him.
translation:
  language: zh_hans
  text: 人若使同伴身体受损[a]，他怎样做，也必怎样加在他身上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“使同伴有残缺（或缺损）”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ כִּי
  choice: 人若
  rationale: 这是判例法常用的条件句式；用“人若”自然表达条件关系，也保留单数泛指的法律语气。
- source_word: יִתֵּן מוּם
  choice: 使……身体受伤
  rationale: 字面是“使……有残缺／瑕疵”。本节论及对他人身体造成损害，“使身体受伤”既符合现代汉语，也保留身体损伤这一具体含义。
- source_word: בַּעֲמִיתוֹ
  choice: 同伴
  rationale: עָמִית指共同体中的同侪、同伴或邻舍。“同伴”简洁自然，不把范围擅自限定为亲属，也不采用较具传统译经色彩的“邻舍”。
- source_word: כַּאֲשֶׁר עָשָׂה
  choice: 他怎样待人
  rationale: 比较从句规定相称报偿的尺度。“怎样待人”在汉语中补出原文语境所含的受事对象，避免“怎样做”过于含混。
- source_word: כֵּן יֵעָשֶׂה לּוֹ
  choice: 也要照样待他
  rationale: 原文尼法勒式不明说执行者，带有法律处置的客观语气；此译不指定个人执行，也避免把条文表述成私人报复。
theological_decisions:
- issue: 同态报偿原则的法律性质
  choice: 以相称处置的法律原则表达，不指定私人实施报复
  alternative: 译成个人必须亲自以同样方式报复伤害者
  rationale: 原文“要……施于他”采用不明说施事者的被动表达，重点是处罚与所造成的损害相称，并未明言由受害者私人复仇。
- issue: מוּם在本节中的具体程度
  choice: 正文译作较宽泛的“身体受伤”，脚注保留“残缺／缺损”的字面色彩
  alternative: 正文直接译作“使身体残缺”
  rationale: מוּם可指身体瑕疵或缺损；上下文说明其涉及身体伤害，但本节本身未限定每次伤害都造成永久残缺，因此不宜在正文中过度收窄。
translation_notes:
  register: 采用简洁、庄重的现代法律语体。“人若……也要……”清楚呈现判例法结构；避免古奥的“施于”及容易被理解为私人报复的措辞。
