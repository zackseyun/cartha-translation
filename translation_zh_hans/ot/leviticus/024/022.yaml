  text: מִשְׁפַּ֤ט אֶחָד֙ יִהְיֶ֣ה לָ/כֶ֔ם כַּ/גֵּ֥ר כָּ/אֶזְרָ֖ח יִהְיֶ֑ה כִּ֛י אֲנִ֥י יְהוָ֖ה אֱלֹהֵי/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/022.yaml
  text: There shall be one standard of judgment for you, for the sojourner as for the native, for I am the LORD your God.
translation:
  language: zh_hans
  text: 无论是寄居者还是本地人，你们都要按同一标准裁判，因为我是耶和华你们的神。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִשְׁפָּט אֶחָד
  choice: 同一判决标准
  rationale: מִשְׁפָּט在本章司法语境中指判决或裁断；加上“标准”可自然表达“一种/同一判决”所强调的一体适用原则，同时不把含义泛化为所有法律。
- source_word: גֵּר
  choice: 寄居者
  rationale: 指居住在以色列群体中的外来居民；“寄居者”保留其社会法律身份，不简单等同于短期旅客。
- source_word: אֶזְרָח
  choice: 本地人
  rationale: 指本地出生或本族共同体成员，与“寄居者”形成对照；采用普通读者易懂的现代说法。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以中文圣经传统中广为人知的专名译法呈现四字神名，并与“你们的神”区分。
theological_decisions:
- issue: 寄居者与本地人在司法判决上的关系
  choice: 译作“寄居者和本地人都一样”
  alternative: “对寄居者怎样，对本地人也要怎样”
  rationale: 保留原文כַּגֵּר כָּאֶזְרָח的对等结构，明确同一标准适用于两者，不额外扩展为现代意义上一切领域的普遍平等命题。
- issue: 神名的呈现
  choice: 耶和华
  alternative: 上主／雅威
  rationale: 原文使用神的专名יהוה；译文保留专名性质，不以头衔完全替代。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“你们要采用”表达יִהְיֶה לָכֶם在律法语境中的规范性；分号清楚连接原则与适用对象，末句保留立法依据。
