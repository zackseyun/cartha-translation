  text: וַ/יֵּצֵא֙ בֶּן אִשָּׁ֣ה יִשְׂרְאֵלִ֔ית וְ/הוּא֙ בֶּן אִ֣ישׁ מִצְרִ֔י בְּ/ת֖וֹךְ בְּנֵ֣י יִשְׂרָאֵ֑ל וַ/יִּנָּצוּ֙ בַּֽ/מַּחֲנֶ֔ה בֶּ֚ן הַ/יִּשְׂרְאֵלִ֔ית וְ/אִ֖ישׁ הַ/יִּשְׂרְאֵלִֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/010.yaml
  text: The son of an Israelite woman[a], and he was the son of an Egyptian man, went out among the sons of Israel[b]; and in the camp the son of the Israelite woman and an Israelite man fought.
translation:
  language: zh_hans
  text: 有一个以色列妇人的儿子，父亲是埃及人；他出来，来到以色列人中间[a]。在营中，这以色列妇人的儿子和一个以色列男子争斗起来[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“在以色列的众子中间”；这是对以色列人的惯用称呼。
    reason: 说明民族称谓的字面形式。
  - marker: b
    text: 或译“争吵起来”或“打了起来”；原词可指争执或打斗。
    reason: 保留原动词所指冲突性质的语义范围。
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: 走到
  rationale: יצא表示出去、出来或走出；这里与“在以色列人中间”连用。“走到”在现代汉语中自然地表达叙事中的移动，同时不擅自说明他从哪里出来。
- source_word: בֶּן אִשָּׁה יִשְׂרְאֵלִית
  choice: 一个以色列妇人的儿子
  rationale: 按母系身份来介绍此人；使用“一个”符合首次引入人物时的现代汉语表达。
- source_word: וְהוּא בֶּן אִישׁ מִצְרִי
  choice: 父亲是埃及人
  rationale: 希伯来文直译为“他是一个埃及男子的儿子”。汉语用“父亲是埃及人”更自然，并准确表达父系身份。
- source_word: בְּתוֹךְ בְּנֵי יִשְׂרָאֵל
  choice: 在以色列人中间
  rationale: בְּתוֹךְ意为“在……中间”；בְּנֵי יִשְׂרָאֵל在这里是民族称谓，译作“以色列人”清楚自然，字面形式另见脚注。
- source_word: וַיִּנָּצוּ
  choice: 争斗起来
  rationale: נצה的尼法勒式可指争吵、争执或打斗。“争斗起来”保留事件可能涉及言语和肢体冲突的幅度，不把含义过早限定为纯粹口角或肢体搏斗。
- source_word: בַּמַּחֲנֶה
  choice: 在营里
  rationale: 直接表达事件发生在以色列营地之内，简洁自然。
- source_word: בֶּן הַיִּשְׂרְאֵלִית
  choice: 这以色列妇人的儿子
  rationale: 保留原文重复的称呼，以维持叙事的辨识和强调作用；“这”承接前文已介绍的人物。
- source_word: וְאִישׁ הַיִּשְׂרְאֵלִי
  choice: 和一个以色列男子
  rationale: אִישׁ明确为男子，族称将他与前述父亲为埃及人的男子形成对照；不定表达符合首次提及此人的语境。
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל的性别形式与民族称谓功能
  choice: 以色列人
  alternative: 以色列的子孙
  rationale: 该短语字面为“以色列的众子”，但在这里作为全体民族的惯用称谓。正文采用现代汉语通常的“以色列人”，避免让读者误以为仅特指男性后裔；脚注保留字面信息。
- issue: וַיִּנָּצוּ所描述冲突的性质
  choice: 争斗起来
  alternative: 打了起来；争吵起来
  rationale: 上下文表明冲突随后升级，但本节动词本身可涵盖争执和打斗。译文不把它专限定为言语争吵或肢体冲突，以保留原文的语义张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。分为两句，以免希伯来文连续并列结构在汉语中显得拖沓；重复“这以色列妇人的儿子”，保留原文的叙事强调。
