  text: וְ/אִ֕ישׁ כִּ֥י יַכֶּ֖ה כָּל נֶ֣פֶשׁ אָדָ֑ם מ֖וֹת יוּמָֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/017.yaml
  text: And if a man strikes down any human being[b][a], he shall surely be put to death.
translation:
  language: zh_hans
  text: 人若打死任何人[a]，必被处死[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译近于“任何一个人的性命（生命）”；这里指人本身或人的生命，并非特指非物质的“灵魂”。
    reason: lexical_alternative
  - marker: b
    text: 原文以不定式绝对形加强被动表达，意为“必定被处死”或“务要被处死”。
    reason: translation_clarity
lexical_decisions:
- source_word: וְ/אִישׁ כִּי
  choice: 人若
  rationale: אִישׁ在法律条文中以阳性单数表述行为人；现代汉语“人若”既自然，又没有擅自把适用范围限定为男性。וְ承接上下文，在单节中文中不必生硬译作“并且”；כִּי表达条件。
- source_word: יַכֶּה
  choice: 打死
  rationale: נכה的希斐勒形式本义为“击打”，但本句宾语和死刑判语表明这里是致命击打。“打死”同时保留击打意象并明确其致死结果。
- source_word: כָּל נֶפֶשׁ אָדָם
  choice: 任何人
  rationale: נֶפֶשׁ אָדָם在这里指人或人的生命，并非特指与身体分离的“灵魂”。“任何人”准确指向遇害者，也符合现代汉语习惯。
- source_word: מוֹת יוּמָת
  choice: 必须处死
  rationale: 不定式绝对形与被动未完成式连用，强化死刑判语。中文“必须处死”保留其确定性和法律语气；句式不明说执行者，与希伯来语被动表达相称。
theological_decisions:
- issue: נֶפֶשׁ אָדָם的所指
  choice: 任何人
  alternative: 任何人的性命／任何人的生命
  rationale: 此处所指是遭致命击打的人，而不是现代意义上的非物质“灵魂”。正文采用自然的人称表达，脚注保留“性命/生命”这一较贴近字面的可能译法。
- issue: אִישׁ的阳性形式
  choice: 人若
  alternative: 男人若
  rationale: אִישׁ为阳性单数，但在本法律句式中具有一般代表作用。汉语“人若”不制造原文没有明确强调的男性限定，同时仍保留单数、条件性的法律表达。
- issue: מוֹת יוּמָת的强制性
  choice: 必须处死
  alternative: 必要把他治死／他必被处死
  rationale: 该结构是强化的被动死刑公式。“必须处死”清楚表达法律判罚，不额外指定执行者或解释执行方式。
translation_notes:
  register: 采用简洁、庄重的现代汉语法律语体。“打死”比单纯“杀”更能保留原文“击打”的具体意象；“必须处死”清楚传达强化的法定刑语气。所有脚注标记均置于正文相应位置。
