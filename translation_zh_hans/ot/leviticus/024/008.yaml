  source_fidelity: “每逢安息日”准确表达重复的时间短语；“在雅威面前把它陈列好”也忠实反映יַעַרְכֶנּוּ和לִפְנֵי יְהוָה。可是“这饼要由以色列人供献”把原文简略的来源/关联短语מֵאֵת בְּנֵי יִשְׂרָאֵל明确化为一次“供献”行为，并把“作为永远的约”改系于该供献行为；这属于不必要的解释性扩充。
