source:
  edition: WLC
  text: בְּ/י֨וֹם הַ/שַּׁבָּ֜ת בְּ/י֣וֹם הַ/שַּׁבָּ֗ת יַֽעַרְכֶ֛/נּוּ לִ/פְנֵ֥י יְהוָ֖ה תָּמִ֑יד מֵ/אֵ֥ת בְּנֵֽי יִשְׂרָאֵ֖ל בְּרִ֥ית עוֹלָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/008.yaml
  text: Every Sabbath day he shall arrange it before Yahweh continually[c][b][a], from the sons of Israel as an everlasting covenant.
translation:
  language: zh_hans
  text: 每逢安息日[a]，他要在雅威面前把它陈列好，作为出于以色列子民的永远之约，常常如此。[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“在安息日，在安息日”，是表示每逢安息日或一个安息日接一个安息日的说法。
    reason: 说明希伯来语重复结构及其分配性含义。
  - marker: b
    text: 原文为单数“把它陈列好”，指前文所说整组饼，视为一个整体；也可译作“把它按次序摆好”。
    reason: 说明单数宾语后缀的集合用法及动词的可选译法。
  - marker: c
    text: “出于以色列子民的永远之约”保留原文“从/出于以色列子民”与“永远的约”的简略连接；在此礼仪语境中可指与以色列子民有关、持续有效的约，却未明说“义务”或“供献”这一动作。
    reason: 避免将来源性介词短语扩写为明确的供献行为，并保留原文句法关系的简练与一定含混性。
lexical_decisions:
- source_word: בְּיוֹם הַשַּׁבָּת בְּיוֹם הַשַּׁבָּת
  choice: 每逢安息日
  rationale: 原文重复“在安息日，在安息日”，具有逐次、分配的语气，表示每一个安息日；译文用现代汉语自然表达这种每周重复性。
- source_word: יַעַרְכֶנּוּ
  choice: 他都要把饼陈列
  rationale: 动词 ערך 表示按次序摆放、陈列。阳性单数宾语后缀把前文所说的饼视为一个整体；为使汉语指代清楚，明说“饼”。
- source_word: לִפְנֵי יְהוָה
  choice: 在雅威面前
  rationale: 保留祭仪语境中“在……面前”的空间及临在含义，并以“雅威”音译神的专名。
- source_word: תָּמִיד
  choice: 常常如此
  rationale: 在祭司礼仪语境中，此词通常表示持续而有规律地遵行，并非不间断地进行同一个动作；本节已经明确其周期为每个安息日。
- source_word: מֵאֵת בְּנֵי יִשְׂרָאֵל
  choice: 由以色列人供献
  rationale: מֵאֵת 表示来源；结合供饼的礼仪语境，译作“由……供献”比生硬的“来自以色列人”更自然，同时不改变来源关系。בְּנֵי יִשְׂרָאֵל 是对以色列群体的通常称呼，译作“以色列人”。
- source_word: בְּרִית עוֹלָם
  choice: 作为永远的约
  rationale: 直译并保留“约”的神学与法律含义；不扩写为“永远的约定义务”，以免把原文的简练表达解释得过窄。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名。译作“雅威”较贴近其通行学术复原读音，也避免用称号取代专名。
- issue: בְּרִית עוֹלָם 的所指和效力
  choice: 作为永远的约
  alternative: 作为永久的约定义务
  rationale: 原文明确使用“约”，却没有另加“义务”一词。正文保留原有神学张力，不把这里的约完全等同于一项礼仪义务。
- issue: 以色列人在供饼安排中的关系
  choice: 这饼要由以色列人供献
  alternative: 这来自以色列人；代表以色列人
  rationale: 介词结构最直接表示来源；“代表”虽在礼仪神学上可能成立，却不是该介词在此处最直接的意思。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“每逢……都……”清楚表达每周规律；“常常如此”避免把 תָּמִיד 误解为动作从不间断。“供献”符合祭仪语境，但仍是普通读者容易理解的词。
