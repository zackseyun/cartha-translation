- from: 每逢安息日[a]，他都要把饼[b]陈列在雅威面前，常常如此；这饼要由以色列人供献，作为永远的约。[c]
  to: 每逢安息日[a]，他要在雅威面前把它陈列好，作为出于以色列子民的永远之约，常常如此。[b][c]
