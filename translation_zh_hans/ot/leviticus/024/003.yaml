id: LEV.24.3
reference: Leviticus 24:3
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: מִ/חוּץ֩ לְ/פָרֹ֨כֶת הָ/עֵדֻ֜ת בְּ/אֹ֣הֶל מוֹעֵ֗ד יַעֲרֹךְ֩ אֹת֨/וֹ אַהֲרֹ֜ן מֵ/עֶ֧רֶב עַד בֹּ֛קֶר לִ/פְנֵ֥י יְהוָ֖ה תָּמִ֑יד חֻקַּ֥ת עוֹלָ֖ם לְ/דֹרֹֽתֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/003.yaml
  text: Outside the veil of the testimony[a], in the tent of meeting, Aaron shall arrange it from evening until morning before Yahweh continually[c][b]. It is a permanent statute throughout your generations.
translation:
  language: zh_hans
  text: 在会幕内、见证的幔子外，亚伦要从晚上到早晨，在耶和华面前常常整理灯盏。[a]这是你们世世代代永远的律例。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “见证的幔子”也可译作“见证幔子”；这是会幕中约柜前的幔子。“常常”指这项礼仪按常例持续履行；本节所述的时段是“从晚上到早晨”。
    reason: 保留הָעֵדֻת的属格表达，并说明תמיד在本节时间限定下的礼仪性含义。
  - marker: b
    text: “永远的律例”也可译作“永久的律例”或“长久的律例”。
    reason: 保留עוֹלָם在持续时效上的词义幅度。
lexical_decisions:
- source_word: מִחוּץ לְפָרֹכֶת הָעֵדֻת
  choice: 见证柜幔子外面
  rationale: מִחוּץ表示所在位置“在……外面”；פָרֹכֶת是隔开至圣所的幔子。הָעֵדֻת在会幕语境中与存放见证版的约柜密切相关；译作“见证柜幔子”既符合现代汉语圣经语境，也避免让“见证的幔子”产生幔子本身作见证的误解。
- source_word: בְּאֹהֶל מוֹעֵד
  choice: 在会幕里
  rationale: 这是以色列圣所帐幕的固定称谓；“会幕”是简洁、清楚且通行的中文译法。
- source_word: יַעֲרֹךְ אֹתוֹ
  choice: 料理这灯
  rationale: ערך在祭司礼仪语境中表示安排、整理或照管。宾语代词承接上节的灯；“料理这灯”自然表达使灯按规定燃点的职责，同时不把动作窄化为单纯点燃。
- source_word: מֵעֶרֶב עַד בֹּקֶר
  choice: 从晚上到早晨
  rationale: 直接保留原文所规定的时间范围，并紧接祭司的动作。
- source_word: לִפְנֵי יְהוָה
  choice: 在耶和华面前
  rationale: לִפְנֵי在礼仪语境中表达处于神面前；依现代标准普通话的传统形式音译神名为“耶和华”。
- source_word: תָּמִיד
  choice: 常常
  rationale: 此词在祭司法例中可指持续而有规律地履行礼仪；“常常”与“从晚上到早晨”并列时，保留这种规律持续性，而不暗示灯昼夜每刻都燃烧。
- source_word: חֻקַּת עוֹלָם
  choice: 永远的律例
  rationale: 该短语指长期有效、持续约束历代群体的规定。“永远的律例”保留עוֹלָם的强度，也符合庄重而易懂的中文表达。
- source_word: לְדֹרֹתֵיכֶם
  choice: 你们世世代代
  rationale: 准确表达这项规定适用于相继各代，且是自然的现代汉语习语。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用四字神名。中文正文采用广为读者熟悉的“耶和华”，以人名形式呈现，而不以“主”这一称号代替。
- issue: תמיד与夜间时间范围的关系
  choice: 从晚上到早晨……常常料理
  alternative: 不断料理／经常料理
  rationale: 经文本身把执行时段限定为晚上到早晨，因此“常常”理解为这一礼仪按规定持续、反复实行，而不强行解释为昼夜不间断。
- issue: העדת所修饰或关联的对象
  choice: 见证柜幔子
  alternative: 见证的幔子
  rationale: 希伯来语短语字面可理解为“见证的幔子”，但在会幕布局中指约柜（存放见证版之处）前的幔子。正文用清楚的关联表达，脚注保留较贴近形式的译法。
- issue: חקת עולם的时效语气
  choice: 永远的律例
  alternative: 永久的律例
  rationale: עוֹלָם可表达长久、历代持续或永远。正文保留较强而传统的“永远”，不在翻译中预先限定其神学时效。
translation_notes:
  register: 采用现代、庄重而易懂的礼仪法规文体。“要”表达未完成式在法规中的义务语气；使用“料理”涵盖整理、照管并维持灯火的动作。正文按希伯来语信息次序，先交代地点，再说明执行者、时段、神面前的礼仪性质与历代效力。
