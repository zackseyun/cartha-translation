  text: וְ/לָקַחְתָּ֣ סֹ֔לֶת וְ/אָפִיתָ֣ אֹתָ֔/הּ שְׁתֵּ֥ים עֶשְׂרֵ֖ה חַלּ֑וֹת שְׁנֵי֙ עֶשְׂרֹנִ֔ים יִהְיֶ֖ה הַֽ/חַלָּ֥ה הָ/אֶחָֽת׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/005.yaml
  text: And you shall take fine flour and bake it into twelve loaves[b][a]; each loaf shall be of two-tenths of an ephah.
translation:
  language: zh_hans
  text: 你要取细面，用它烤成十二个饼[a]；每个饼要用十分之二伊法的细面[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“十二个饼块”。希伯来语词可指一个个烤成的饼食，常见于礼仪用饼的语境。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“两个十分之一”；在祭司文献的度量用语中，指每个饼使用十分之二伊法的细面。
    reason: cultural_note
lexical_decisions:
- source_word: וְלָקַחְתָּ
  choice: 你要取
  rationale: 连词加完成式在祭司条例的连续指令中表达命令；译为“你要取”自然地保留程序性语气。
- source_word: סֹלֶת
  choice: 细面
  rationale: 这是祭献和圣所用饼语境中表示精制面粉的常用词；原文未明说谷物种类，因此不增译“麦”。
- source_word: וְאָפִיתָ אֹתָהּ
  choice: 用它烤成
  rationale: 阴性宾语指回“细面”；“用它烤成”既交代原料，也自然引出烤制所得的十二个饼。
- source_word: שְׁתֵּים עֶשְׂרֵה חַלּוֹת
  choice: 十二个饼
  rationale: חַלּוֹת 指一个个烤成的饼食，在礼仪语境可理解为饼或饼块；“饼”符合现代汉语且不过度限定其形状。
- source_word: שְׁנֵי עֶשְׂרֹנִים
  choice: 十分之二伊法
  rationale: 字面为“两个十分之一”；祭司文献中所据的容量单位是伊法。正文明确单位以便现代读者理解，同时用脚注说明原文字面形式。
- source_word: יִהְיֶה הַחַלָּה הָאֶחָת
  choice: 每个饼要用
  rationale: 字面近于“一个饼应为”，这里具有逐个分配的意思；汉语用“每个饼”准确表达所列用量适用于每一个饼。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而清楚的条例用语。“你要……；每个……要……”保留原文连续指令及逐个计量的结构。正文使用“伊法”这一传统音译，并由脚注解释原文省略单位的表达。
