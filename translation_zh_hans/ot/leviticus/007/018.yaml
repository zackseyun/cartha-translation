reference: Leviticus 7:18
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/אִ֣ם הֵאָכֹ֣ל יֵ֠אָכֵל מִ/בְּשַׂר זֶ֨בַח שְׁלָמָ֜י/ו בַּ/יּ֣וֹם הַ/שְּׁלִישִׁי֮ לֹ֣א יֵרָצֶה֒ הַ/מַּקְרִ֣יב אֹת֗/וֹ לֹ֧א יֵחָשֵׁ֛ב ל֖/וֹ פִּגּ֣וּל יִהְיֶ֑ה וְ/הַ/נֶּ֛פֶשׁ הָ/אֹכֶ֥לֶת מִמֶּ֖/נּוּ עֲוֺנָ֥/הּ תִּשָּֽׂא־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/018.yaml
  text: But if any of the flesh of his peace offering is eaten on the third day[a], it will not be accepted; it will not be credited to the one who offers it. It will be an abhorrent thing[b], and the person who eats from it will bear his guilt.
translation:
  language: zh_hans
  text: 但如果平安祭的肉在第三天有任何一部分被吃了，这祭就不蒙悦纳，也不得归算给献祭者；这祭必成为可憎之物[a]，吃这肉的人必担当自己的罪责。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “可憎之物”所译的希伯来语是献祭法规中的专门用语，指祭物因违规而变得不可接受、可厌；也可译作“污秽之物”或“令人厌恶之物”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: 但如果
  rationale: 承接前文并引出与规定相反的条件情形，保留连接词的转折意味。
- source_word: הֵאָכֹל יֵאָכֵל
  choice: 被吃了
  rationale: 希伯来语不定式绝对式加未完成式带有强调作用；中文用自然的被动表达，条件本身已足以传达其确定性。
- source_word: מִבְּשַׂר זֶבַח שְׁלָמָיו
  choice: 他所献的平安祭中有任何肉
  rationale: “任何肉”体现介词 מִן 的部分意义；“平安祭”沿用这一祭类的通行名称，并保留 שְׁלָמִים 所关联的平安、完整语义。
- source_word: לֹא יֵרָצֶה
  choice: 不蒙悦纳
  rationale: רצה 的尼法勒式在献祭语境中指祭物不被接纳；“蒙悦纳”自然且保留宗教语域。
- source_word: לֹא יֵחָשֵׁב לוֹ
  choice: 不算在献祭者的账上
  rationale: 保留 חשב 与 ל 所具有的计算、记账意味，同时用现代中文清楚表达该祭不能归算给献祭者。
- source_word: פִּגּוּל
  choice: 可憎之物
  rationale: 这是献祭法规中的专门词，表示因违规而成为不可接受、令人厌恶之物；正文采用可懂而庄重的表达，并以脚注说明其技术含义。
- source_word: וְהַנֶּפֶשׁ הָאֹכֶלֶת מִמֶּנּוּ
  choice: 吃这肉的人
  rationale: נפש 在此指一个人，而非与身体相对的灵魂；中文无需标示其希伯来语语法阴性。
- source_word: עֲוֺנָהּ תִּשָּׂא
  choice: 必担当自己的罪责
  rationale: 保留“担当罪责”这一习语的故意开放性，既含有负罪，也可能包含承担相应后果，不把它单一释为惩罚。
theological_decisions:
- issue: זֶבַח שְׁלָמִים 的祭类名称
  choice: 平安祭
  alternative: 团契祭；福祉祭
  rationale: “平安祭”简明、通行，并接近词根所含平安与完整的语义；其他译法分别突出共享团契或福祉层面，但不宜在正文中限定其意义。
- issue: לֹא יֵחָשֵׁב לוֹ 的归算含义
  choice: 不算在献祭者的账上
  alternative: 不算为献祭者所献；不归给献祭者
  rationale: 采用记账式表达以保存原文的计算或归算意象，但不进一步赋予此处超出献祭法规语境的教义含义。
- issue: עֲוֺן 与 נשא 的关系
  choice: 担当自己的罪责
  alternative: 承担自己的罪孽；承担罪的惩罚
  rationale: 原文可同时涉及罪责及其后果；正文不把含义缩窄为仅仅受罚，从而保留神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的法规语体。“蒙悦纳”“献祭者”“担当罪责”保留利未记献祭语境的正式色彩；避免以“灵魂”误译泛指人的 נֶפֶשׁ。脚注标记置于所解释的“可憎之物”之后。
