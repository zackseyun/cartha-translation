source:
  edition: WLC
  text: אִ֣ם עַל תּוֹדָה֮ יַקְרִיבֶ/נּוּ֒ וְ/הִקְרִ֣יב עַל זֶ֣בַח הַ/תּוֹדָ֗ה חַלּ֤וֹת מַצּוֹת֙ בְּלוּלֹ֣ת בַּ/שֶּׁ֔מֶן וּ/רְקִיקֵ֥י מַצּ֖וֹת מְשֻׁחִ֣ים בַּ/שָּׁ֑מֶן וְ/סֹ֣לֶת מֻרְבֶּ֔כֶת חַלֹּ֖ת בְּלוּלֹ֥ת בַּ/שָּֽׁמֶן־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/012.yaml
  text: If he offers it as a thanksgiving offering[a], then with the sacrifice of thanksgiving he shall offer unleavened loaves mixed with oil, unleavened wafers anointed with oil[c][b], and cakes of fine flour well mixed with oil.
translation:
  language: zh_hans
  text: 如果他献这祭是为感谢[a]，就要和感谢祭一同献上调油的无酵饼、抹油的无酵薄饼，以及用细面调油做成的饼[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“把它献作感谢祭”。希伯来语“感谢”在这里指因感谢而献的祭。
    reason: lexical_alternative
  - marker: b
    text: 译作“做成”的希伯来词所指的具体制作方法不能确定，可能指将细面与油充分搅拌、揉和，或作其他加工。
    reason: cultural_note
lexical_decisions:
- source_word: תּוֹדָה
  choice: 感谢
  rationale: 此词基本义为感谢、称谢；在本节中说明平安祭的献祭缘由。译作“为感谢”自然明确，并与下文“感谢祭”相呼应。
- source_word: יַקְרִיבֶנּוּ
  choice: 他献这祭
  rationale: קרב 的使役式在献祭语境中指呈献祭物；“献这祭”既自然，也明确承接上一节的祭。
- source_word: זֶבַח הַתּוֹדָה
  choice: 感谢祭
  rationale: 以简洁的汉语表达“为感谢而献的祭”；“祭”保留 זֶבַח 的献祭含义。
- source_word: חַלּוֹת מַצּוֹת
  choice: 无酵饼
  rationale: חַלּוֹת 指饼或饼状食物，מַצּוֹת 表明不含酵；“无酵饼”是现代汉语中清楚而通行的表达。
- source_word: בְּלוּלֹת בַּשֶּׁמֶן
  choice: 调油的
  rationale: בלל 表示把材料混合；“调油”简洁地表达油掺入面饼原料之中。
- source_word: רְקִיקֵי מַצּוֹת
  choice: 无酵薄饼
  rationale: רְקִיקִים 指薄的饼类；“薄饼”比“薄片”更明确保留其食物性质。
- source_word: מְשֻׁחִים בַּשָּׁמֶן
  choice: 抹油的
  rationale: משׁח 在此指把油涂抹在食物上；“抹油”保留动作含义，又避免“膏抹”在中文中可能引发的礼仪性联想。
- source_word: סֹלֶת
  choice: 细面
  rationale: סֹלֶת 是精细筛制的面粉；“细面”是献祭法规语境中准确而简洁的译法。
- source_word: מֻרְבֶּכֶת
  choice: 做成的
  rationale: 该词所指的具体烹调方法不确定，可能涉及充分搅拌、揉和或烫制。正文采用不过度具体化的“做成”，并以脚注说明其不确定性。
- source_word: חַלֹּת
  choice: 饼
  rationale: 此处仍指由细面制成的饼类食品；译作“饼”与前列供物保持语义关联。
theological_decisions:
- issue: תּוֹדָה 在条件句中是祭物类别还是献祭缘由
  choice: 译作“献这祭是为感谢”
  alternative: 译作“把它献作感谢祭”
  rationale: עַל תּוֹדָה 可表达基于感谢或作为感谢祭而献；正文保留献祭缘由的自然表达，不将语法关系限定得过窄，下文“感谢祭”则明确其祭祀类别。
translation_notes:
  register: 采用现代、庄重而易懂的祭祀法规文体。以“调油”与“抹油”区分油混入原料和油涂在表面的两种制作动作；对 מֻרְבֶּכֶת 不作超出原文证据的精确化。
