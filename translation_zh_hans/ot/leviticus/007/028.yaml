lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: 说
  rationale: דבר在此引出新的神谕段落。现代汉语用“对……说”自然表达其言说动作；句首连接词וַ在本段开头无需机械译成“又”或“然后”。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 这是四字神名YHWH；“耶和华”是现代中文圣经语境中广为人知的专名形式，区别于称号“主”。
- source_word: אֶל מֹשֶׁה
  choice: 对摩西
  rationale: 介词אֶל标明言说的对象；“对摩西”符合现代汉语表达。
- source_word: לֵאמֹר
  choice: 说：
  rationale: 该不定式是引出直接引语的固定公式。中文以“说：”及冒号自然承接下一节内容，无需重复译作“说着”。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用神的专名而非“主”这一称号。正文采用中文读者最熟悉且仍作为专名使用的“耶和华”；“雅威”更接近学界常见的拟音，但希伯来语原有读音并不能完全确定。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。此句是承接下文直接话语的引言，因此句末用冒号。未机械保留希伯来语叙事连接词，以避免中文生硬。
