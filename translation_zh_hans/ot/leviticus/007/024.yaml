id: LEV.7.24
reference: Leviticus 7:24
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/חֵ֤לֶב נְבֵלָה֙ וְ/חֵ֣לֶב טְרֵפָ֔ה יֵעָשֶׂ֖ה לְ/כָל מְלָאכָ֑ה וְ/אָכֹ֖ל לֹ֥א תֹאכְלֻֽ/הוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/024.yaml
  text: But the fat of an animal that dies naturally[a], and the fat of one torn by beasts, may be used for any work[b]; but you must certainly not eat it.
translation:
  language: zh_hans
  text: 但自死牲畜的脂肪[a]，以及被野兽撕裂的牲畜的脂肪[b]，都可以作各种用途；只是你们绝不可吃这些脂肪。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “自死牲畜”指未经适当宰杀便死去的牲畜；也可译作“死去的牲畜”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“被撕裂的牲畜”。
    reason: lexical_alternative
lexical_decisions:
- source_word: חֵלֶב
  choice: 脂肪
  rationale: 这是献祭和食物条例语境中的常用对应词，准确且比技术性较强的“板油”更易懂。
- source_word: נְבֵלָה
  choice: 自死牲畜
  rationale: 该词在律法语境中指未经适当宰杀便死去的牲畜；“自死牲畜”简洁表达这一法律类别，同时不局限于尸体被人发现的情形。
- source_word: טְרֵפָה
  choice: 被野兽撕裂的牲畜
  rationale: 该词指遭捕食兽撕裂的牲畜；此译保留受害情形及语境中隐含的施害者。
- source_word: יֵעָשֶׂה לְכָל מְלָאכָה
  choice: 可以作各种用途
  rationale: 这里的被动式表达许可，范围是食用以外的实际用途；此译比直译“可以用于一切工作”更符合现代汉语。
- source_word: וְאָכֹל לֹא תֹאכְלֻהוּ
  choice: 只是你们绝不可吃这些脂肪
  rationale: 同源不定式与限定动词连用加强禁令语气；“绝不可”传达这一强调。末尾明确重提“这些脂肪”，避免汉语代词所指不清。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而清楚的律法文体。“都可以……；只是……绝不可……”既保留许可与严禁之间的对照，也自然传达希伯来文末句的强调语气。
