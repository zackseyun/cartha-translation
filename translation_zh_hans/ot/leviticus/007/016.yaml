source:
  edition: WLC
  text: וְ/אִם נֶ֣דֶר א֣וֹ נְדָבָ֗ה זֶ֚בַח קָרְבָּנ֔/וֹ בְּ/י֛וֹם הַקְרִיב֥/וֹ אֶת זִבְח֖/וֹ יֵאָכֵ֑ל וּ/מִֽ/מָּחֳרָ֔ת וְ/הַ/נּוֹתָ֥ר מִמֶּ֖/נּוּ יֵאָכֵֽל־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/016.yaml
  text: But if the sacrifice of his offering is a vow or a freewill offering[a], it shall be eaten on the day he presents his sacrifice, and on the next day what remains of it may be eaten.
translation:
  language: zh_hans
  text: 但若他所献的是为还愿或甘心献上的祭物，这祭物要在献上的当天吃；剩下的祭物，第二天也可以吃。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נֶדֶר
  choice: 还愿
  rationale: 此处与“自愿献的”并列，指因所许之愿而献祭；译作“还愿”自然地表达履行誓愿的祭献动机。
- source_word: נְדָבָה
  choice: 自愿献的
  rationale: 指并非出于义务、而是甘心自愿献上的祭，与因许愿而献的祭相区别。
- source_word: זֶבַח קָרְבָּנוֹ
  choice: 他所献的祭
  rationale: זֶבַח与קָרְבָּן在此共同指所呈献的祭牲；中文若机械叠译为“供物的祭”不自然，故以“所献的祭”兼顾两词的献祭含义。
- source_word: בְּיוֹם הַקְרִיבוֹ אֶת זִבְחוֹ
  choice: 在献祭的当天
  rationale: קרב的使役形在祭祀语境中指把祭物呈献上去；“献祭”简洁而符合现代汉语礼仪语境。
- source_word: יֵאָכֵל
  choice: 就要……吃；也可以吃
  rationale: 同一被动未完成式在法规语境中表达规定或许可。首处强调当天食用的规则，译为“就要……吃”；次处说明次日仍获准食用余物，译为“也可以吃”。
- source_word: וּמִמָּחֳרָת
  choice: 第二天
  rationale: 指紧接献祭日的次日；“第二天”是清楚自然的现代汉语表达。
- source_word: וְהַנּוֹתָר מִמֶּנּוּ
  choice: 剩下的
  rationale: 分词נוֹתָר指从祭物中留下的部分；上下文已明确所指，中文省去重复代词更自然。
theological_decisions:
- issue: נֶדֶר所指的是誓愿本身还是因誓愿所献的祭
  choice: 正文译为“为还愿”
  alternative: “许愿祭”或“誓愿”
  rationale: 上下文的中心名词是“祭”，נֶדֶר说明献祭类别或动机。译为“为还愿”既避免把抽象的誓愿直接等同祭物，也保留它与自愿祭的区别。
translation_notes:
  register: 采用现代、庄重而易懂的法规语体。“就要”体现首项规定，“可以”体现次日食用余物的许可；不以生硬的被动结构复制希伯来文。
