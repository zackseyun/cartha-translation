  yaml_path: translation/ot/leviticus/007/027.yaml
  text: Every person who eats any blood—that person shall be cut off from his people[a][b].
translation:
  language: zh_hans
  text: 凡吃任何血的人[a]，那人必从自己的族人中被剪除[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “人”所译的希伯来语也可译作“生命”或“魂”；这里指一个具体的人。
    reason: lexical_alternative
  - marker: b
    text: “被剪除”是盟约律法中常见的惩罚用语，可能指从群体中除去，也可能涉及上帝的审判；本节希伯来文没有说明具体方式。
    reason: alternative_reading
lexical_decisions:
- source_word: נֶפֶשׁ
  choice: 人
  rationale: 在本节律法语境中，נֶפֶשׁ 指一个具体的人，并非专指与身体相对的“灵魂”；译作“人”自然准确。
- source_word: תֹּאכַל
  choice: 吃
  rationale: 未完成式用于关系从句，表达一般性、涵盖各种事例的律法规定；现代汉语用“吃”即可传达此义。
- source_word: כָּל דָּם
  choice: 任何血
  rationale: כָּל 修饰不可数名词 דָּם，在此具有周遍、分配意义，指任何种类或形式的血，而非强调数量总和。
- source_word: וְנִכְרְתָה
  choice: 必……被剪除
  rationale: 尼法勒形式表达被动结果；“被剪除”保留 כרת 作为盟约惩罚用语的形象及其对具体执行方式的含混性，“必”体现律法制裁的确定语气。
- source_word: הַנֶּפֶשׁ הַהִוא
  choice: 那人
  rationale: 名词加指示词重新指明并强调前述违法者，译作“那人”符合现代汉语法律陈述。
- source_word: מֵעַמֶּיהָ
  choice: 从自己的族人中
  rationale: 希伯来语阴性后缀与阴性名词 נֶפֶשׁ 保持语法一致，并不限定违法者的性别；“自己的族人”既避免误加性别，也保留其所属群体的关系。
theological_decisions:
- issue: 盟约惩罚公式“被剪除”的确切含义
  choice: 保留“必从自己的族人中被剪除”的正式表达，不明确说明执行方式
  alternative: 处死、逐出群体，或由上帝施行毁灭
  rationale: 希伯来文措辞简短，并未在本节说明“剪除”的具体方式；译文应保留可能涉及群体性排除或神圣审判的张力，不替原文裁定。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“凡……那人必……”保留律法条文的一般适用性和强调结构；“族人”对应 עַם 在所属共同体语境中的群体含义，同时避免把惩罚方式解释得过窄。
