base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/008.yaml
  text: And the priest who presents a man's burnt offering shall have for himself the skin of the burnt offering that he has presented[a][b].
translation:
  language: zh_hans
  text: 为某人献上燔祭的祭司，所献燔祭的皮[a]要归他自己所有。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “皮”也可译作“兽皮”或“皮张”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכֹּהֵן
  choice: 祭司
  rationale: 祭祀律例中的标准译法；汉语无需用冠词另行标明其定指性。
- source_word: הַמַּקְרִיב / הִקְרִיב
  choice: 献上／所献
  rationale: 使役形在礼仪语境中指把祭物献上；译为“献上”既自然，也保留祭祀动作的含义。后一个完成式按已完成的动作译作“所献”。
- source_word: עֹלַת אִישׁ
  choice: 某人的燔祭
  rationale: עֹלָה译作利未记中通行的“燔祭”。אִישׁ在这里可指一位献祭者；现代汉语用“某人”自然表达不特定的单数个体，而不额外断定其性别。
- source_word: עֹור
  choice: 皮
  rationale: 指祭牲剥下的皮；“皮”在现代汉语中简洁自然，语境已明确是动物的皮。
- source_word: הָעֹלָה
  choice: 那燔祭
  rationale: 定冠词和关系从句共同指明前述特定燔祭，故用“那燔祭”。
- source_word: אֲשֶׁר הִקְרִיב
  choice: 他所献
  rationale: 关系从句最自然地修饰“燔祭”，说明这是该祭司亲自献上的那一祭物。
- source_word: לַכֹּהֵן לוֹ יִהְיֶה
  choice: 要得到……归他自己所有
  rationale: 原文直译近于“要归祭司，归他”；此译明确皮归主持献祭的祭司个人所有，并保留 לוֹ 的强调意味。
theological_decisions:
- issue: אִישׁ的性别与泛指范围
  choice: 某人的燔祭
  alternative: 一个男人的燔祭
  rationale: אִישׁ为阳性单数，但在律法表述中也可表示不特定的个体或献祭者。译作“某人”保留单数与不特定性，不把语法性别过度解释为经文明示献祭者必为男性。
- issue: עֹלָה的祭祀术语
  choice: 燔祭
  alternative: 升献祭
  rationale: “燔祭”是中文圣经与现代宗教语境中清楚、稳定的祭类名称；“升献祭”虽能体现词源上“上升”的意象，却不如“燔祭”易懂。
- issue: 祭牲之皮的归属
  choice: 归献上该燔祭的祭司自己所有
  alternative: 笼统地归祭司群体所有
  rationale: 句首分词短语限定具体主持献祭的祭司，末尾“归他”也采用单数强调，因此译文指向该祭司本人，而非泛指祭司群体。
translation_notes:
  register: 采用现代、庄重而易懂的律例文体。“要得到……归他自己所有”稍作汉语重组，以清楚表达祭牲之皮的具体归属；正文保留原文中祭司、献祭动作、燔祭及其皮等全部要素。
