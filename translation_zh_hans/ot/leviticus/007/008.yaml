revisions:
- from: 献上某人燔祭的祭司，要得到他所献那燔祭的皮[a]，归他自己所有。
  to: 为某人献上燔祭的祭司，所献燔祭的皮[a]要归他自己所有。
  rationale: 修订以“要归他自己所有”对应לַכֹּהֵן לוֹ יִהְיֶה，清楚表明皮归具体献祭的祭司，而非祭司群体。“为某人献上燔祭”自然表达עֹלַת אִישׁ；“某人”保留其不特定单数用法，不在中文中作超出语境所需的性别断言。脚注删除不等值的“皮革”。
  reviewer_model: gpt-5.6-terra
