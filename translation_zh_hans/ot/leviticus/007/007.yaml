  text: כַּֽ/חַטָּאת֙ כָּֽ/אָשָׁ֔ם תּוֹרָ֥ה אַחַ֖ת לָ/הֶ֑ם הַ/כֹּהֵ֛ן אֲשֶׁ֥ר יְכַפֶּר בּ֖/וֹ ל֥/וֹ יִהְיֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/007.yaml
  text: 'Like the sin offering[a], so the guilt offering: there is one law for them[c][b]. The priest who makes atonement with it shall have it.'
translation:
  language: zh_hans
  text: “赎罪祭怎样，赎愆祭也怎样；二者的条例相同[a]。用这祭物行赎罪礼的祭司，这祭物要归他[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “条例”原文为“妥拉”，也可译作“训诲”或“律法”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“借着它赎罪的祭司，要得这祭物。”原文指这祭物归执行赎罪礼的祭司。
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּחַטָּאת
  choice: 赎罪祭怎样
  rationale: 前缀 כ 表示比较；חַטָּאת 在献祭语境中指“赎罪祭”。“怎样”与下句“也怎样”构成自然的汉语对应结构。
- source_word: כָּאָשָׁם
  choice: 赎愆祭也怎样
  rationale: אָשָׁם 在利未记的献祭法规中指因过犯并涉及补偿而献的祭；采用现代中文圣经语汇中明确而简洁的“赎愆祭”。
- source_word: תּוֹרָה אַחַת לָהֶם
  choice: 两者适用同一条例
  rationale: תּוֹרָה 在此指规范献祭程序的规定；“条例”保留法律和礼仪规程的意味。“两者”明确 לָהֶם 回指前述两种祭。
- source_word: הַכֹּהֵן אֲשֶׁר יְכַפֵּר בּוֹ
  choice: 借着赎愆祭赎罪的祭司
  rationale: יְכַפֵּר 保留为“赎罪”，不将其缩减为一般礼仪动作；בּוֹ 表示以该祭物为媒介或凭借，译作“借着”。按最近的先行词，明确为赎愆祭，以免汉语代词指向含混。
- source_word: לוֹ יִהְיֶה
  choice: 要得到这祭物
  rationale: 这一所有权惯用语表示祭物归主持赎罪礼的祭司；“要得到”在现代汉语中自然，并保留法规所规定的应得份。
theological_decisions:
- issue: 祭司法中 כפר 的表达
  choice: 赎罪
  alternative: 行洁净礼；施行遮盖
  rationale: כפר 在祭司献祭语境中具有礼仪与神学分量。“赎罪”是宽广且通行的对应语，不限定某一种赎罪理论，也不把经文仅解释为洁净程序。
- issue: 祭物归属的对象
  choice: 归借着该祭物赎罪的祭司
  alternative: 泛指归祭司群体
  rationale: 单数 הַכֹּהֵן 及关系从句指向实际主持该项赎罪礼的祭司；译文保留这一具体归属，不扩大为祭司群体共有。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“赎罪祭”和“赎愆祭”保留利未记中两类祭的传统区分；以“同一条例”清楚传达两者遵循相同规程。所有脚注标记均置于正文相关词句之后。
