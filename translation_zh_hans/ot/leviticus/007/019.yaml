source:
  edition: WLC
  text: וְ/הַ/בָּשָׂ֞ר אֲשֶׁר יִגַּ֤ע בְּ/כָל טָמֵא֙ לֹ֣א יֵֽאָכֵ֔ל בָּ/אֵ֖שׁ יִשָּׂרֵ֑ף וְ/הַ֨/בָּשָׂ֔ר כָּל טָה֖וֹר יֹאכַ֥ל בָּשָֽׂר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/019.yaml
  text: But the meat that touches anything unclean must not be eaten; it must be burned in the fire. And as for the meat, anyone who is clean may eat meat.
translation:
  language: zh_hans
  text: 但祭肉若接触了任何不洁之物[a]，就不可吃，必须用火焚烧。至于祭肉，凡洁净的人都可以吃。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“若与任何不洁之物有接触。”希伯来语涵盖范围较广，所说的“不洁”是礼仪上的不洁。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַבָּשָׂר
  choice: 但祭肉
  rationale: בָּשָׂר在本段指献祭所得的肉；译作“祭肉”比单说“肉”更清楚，也避免被理解为泛指普通肉食。句首וְ依上下文译为“但”，显出与可食用之祭肉的对比。
- source_word: אֲשֶׁר יִגַּע בְּכָל טָמֵא
  choice: 若接触了任何不洁之物
  rationale: יִגַּע表示接触；כָּל טָמֵא所指范围宽泛，宜译作“任何不洁之物”，不限定为某一种物件。“不洁”在此指礼仪状态。
- source_word: לֹא יֵאָכֵל
  choice: 就不可吃
  rationale: 尼法勒未完成式在法规语境中表达被动禁令；“不可吃”简明自然，并保留法律约束力。
- source_word: בָּאֵשׁ יִשָּׂרֵף
  choice: 必须用火焚烧
  rationale: 表达受玷污祭肉所规定的处理方式；“用火焚烧”贴近希伯来语，同时符合现代汉语法规语体。
- source_word: וְהַבָּשָׂר
  choice: 至于祭肉
  rationale: 重复名词开启与前句受污祭肉相对的新陈述；“至于”自然标示话题转换。
- source_word: כָּל טָהוֹר
  choice: 凡洁净的人
  rationale: 形容词טָהוֹר在这里名词化，指处于礼仪洁净状态的人；“凡……的人”保留普遍涵盖之意。
- source_word: יֹאכַל בָּשָׂר
  choice: 都可以吃
  rationale: 未完成式在这里表示许可而非命令。汉语承接前面的“至于祭肉”后省略重复宾语，意思清楚且避免累赘。
theological_decisions:
- issue: 祭祀法规中טָמֵא与טָהוֹר的性质
  choice: 译作“不洁”与“洁净”，按礼仪状态理解
  alternative: 污秽／纯洁
  rationale: 在利未记的献祭条例中，这两个词主要表示礼仪身份，不必然指道德罪恶或内在品格。译文不把礼仪类别转化为道德评价。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“祭肉”补明上下文所指；法规用语以“不可”“必须”“可以”清楚区分禁令、处置要求与许可。
