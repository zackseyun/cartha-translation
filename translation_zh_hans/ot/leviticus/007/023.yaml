  text: דַּבֵּ֛ר אֶל בְּנֵ֥י יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר כָּל חֵ֜לֶב שׁ֥וֹר וְ/כֶ֛שֶׂב וָ/עֵ֖ז לֹ֥א תֹאכֵֽלוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/023.yaml
  text: 'Speak to the sons of Israel[a], saying: You shall not eat any fat of an ox, a sheep, or a goat.'
translation:
  language: zh_hans
  text: “你要对以色列人[a]说：‘凡牛、绵羊或山羊的脂肪，你们都不可吃。’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语字面为“以色列的众子”。
    reason: 保留原文的字面表达，同时让正文采用现代汉语中自然的集体称谓。
lexical_decisions:
- source_word: דַּבֵּר
  choice: 你要对……说
  rationale: 该词是皮耶勒词干第二人称阳性单数命令式，是上帝向摩西发出的直接命令；译法既保留命令语气，也符合现代汉语表达。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 希伯来语字面为“以色列的众子”，在这里整体指以色列民；正文采用自然、准确的现代汉语，并以脚注保留原文形式。
- source_word: לֵאמֹר
  choice: 说
  rationale: 这是引出所传话语的常用不定式，与前面的“对……说”共同构成利未记常见的传令公式。
- source_word: כָּל חֵלֶב
  choice: 凡……的脂肪……都
  rationale: כָּל与物质名词连用并处于禁令中，表示无一例外；“凡……都不可”在现代汉语中自然地表达其完整范围。
- source_word: חֵלֶב
  choice: 脂肪
  rationale: 指动物的脂肪，尤其与献祭条例有关的脂肪部分；“脂肪”清楚通行，又不把含义过度收窄为某一种油脂。
- source_word: שׁוֹר
  choice: 牛
  rationale: 该词指牛类牲畜；此处是在法律条文的牲畜类别清单中，译作泛指的“牛”最为恰当。
- source_word: כֶשֶׂב
  choice: 绵羊
  rationale: 该词泛指羊群中的绵羊，并未限定为羊羔或公羊；“绵羊”也可与下文的山羊清楚区分。
- source_word: עֵז
  choice: 山羊
  rationale: 该词在牲畜清单中泛指山羊；虽然语法形式为阴性，此处不宜额外限定为母山羊。
- source_word: לֹא תֹאכֵלוּ
  choice: 你们都不可吃
  rationale: 否定词加第二人称复数未完成式在法律语境中表达禁令；“不可吃”保留庄重明确的规范语气。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的法律训令语体。“凡……都不可”准确传达禁令的周全范围；正文以“以色列人”避免生硬直译，脚注则说明原文措辞。
