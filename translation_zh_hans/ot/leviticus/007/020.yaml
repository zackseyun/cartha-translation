base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/020.yaml
  text: But the person who eats meat from the sacrifice of peace offerings that belongs to Yahweh while his uncleanness is on him—that person shall be cut off from his people[a].
translation:
  language: zh_hans
  text: 但若有人身上仍有不洁，却从归耶和华的平安祭中吃了肉，那人必从本民中被剪除[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“必从本民中被除去”。“被剪除”可能指被逐出群体，也可能指死亡；这里的希伯来文没有说明具体方式。
    reason: alternative_reading
lexical_decisions:
- source_word: הַנֶּפֶשׁ
  choice: 有人／这人
  rationale: 在律法条文中，נֶפֶשׁ通常指具体的个人，并非特指与身体相对的“灵魂”。译作“人”既准确，也符合现代汉语法律条件句的表达。
- source_word: תֹּאכַל
  choice: 吃了
  rationale: 这里的未完成式用于陈述个案律法中的一般条件；汉语以“若有人……吃了”自然地表达这一条件关系。
- source_word: בָּשָׂר
  choice: 肉
  rationale: בָּשָׂר字面可指“肉体”，但此处所指是祭物中供人食用的肉，译作“肉”清楚自然。
- source_word: מִזֶּבַח הַשְּׁלָמִים
  choice: 平安祭的肉
  rationale: זֶבַח הַשְּׁלָמִים是特定祭类，采用中文圣经传统且易辨识的“平安祭”；介词מִן表示所吃的肉取自该祭物。
- source_word: אֲשֶׁר לַיהוָה
  choice: 归耶和华的
  rationale: לַיהוָה表明祭物归属或奉献给耶和华；“归耶和华的”保留这种神圣归属，且不把关系限定为单一解释。
- source_word: טֻמְאָתוֹ עָלָיו
  choice: 不洁仍留在身上
  rationale: 原文直陈“他的不洁在他身上”。译文保留“不洁在身上”的意象，同时用“仍留”表达当事人尚处于礼仪不洁状态。
- source_word: וְנִכְרְתָה
  choice: 必被剪除
  rationale: כרת的被动式是盟约及律法语境中的严厉惩罚公式。“被剪除”保留原文比喻，也不擅自判定惩罚是逐出还是死亡。
- source_word: מֵעַמֶּיהָ
  choice: 从自己的族人中
  rationale: 阴性后缀与语法上为阴性的נֶפֶשׁ呼应，并不限定当事人的生理性别。“自己的族人”避免不必要的性别标示，也表达从所属群体中被除去。
theological_decisions:
- issue: וְנִכְרְתָה ... מֵעַמֶּיהָ这一惩罚公式的具体含义
  choice: 必从自己的族人中被剪除
  alternative: 被逐出族群，或遭受死亡
  rationale: 原文明确表达从群体中受到严厉除去，却没有在本节说明实施方式。正文保留“剪除”的表达，脚注说明可能范围，以免把经文本身的含混强行解释为逐出或处死。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“平安祭”“不洁”“剪除”保留祭祀律法的关键术语；句式按汉语习惯整理为“若有人……这人必……”，同时保留原文的条件、神圣归属及惩罚含混性。
