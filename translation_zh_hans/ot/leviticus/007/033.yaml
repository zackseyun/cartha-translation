base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/033.yaml
  text: The one from among the sons of Aaron who presents the blood of the peace offerings and the fat—to him the right thigh shall belong as his portion.
translation:
  language: zh_hans
  text: 亚伦的子孙中，谁献上平安祭[a]的血和脂油，右腿就要归给谁，作为他的份。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“团契祭”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּקְרִיב
  choice: 谁献上
  rationale: 希伯来语使役分词表示在礼仪中呈献祭物；用“谁献上”自然保留分词所指的执行者及祭祀语境。
- source_word: דַּם
  choice: 血
  rationale: 祭祀条例中的直接、标准译法。
- source_word: הַשְּׁלָמִים
  choice: 平安祭
  rationale: 保留该祭类与完整、平安这一词义范围的传统联系；“团契祭”较具解释性，列入脚注作为另一译法。
- source_word: הַחֵלֶב
  choice: 脂肪
  rationale: 按祭祀语境直译，所指为规定献上的肥脂部分。
- source_word: מִבְּנֵי אַהֲרֹן
  choice: 亚伦的子孙中
  rationale: 表达从亚伦男性后裔这一祭司群体中选出实际献祭者；“子孙”在现代汉语中比“儿子们”更符合此处延续性祭司制度的语境。
- source_word: לוֹ תִהְיֶה
  choice: 就要归给谁
  rationale: 清楚表达法律性的归属和领受权，并与前面的“谁”自然呼应。
- source_word: שׁוֹק הַיָּמִין
  choice: 右腿
  rationale: שׁוֹק 指牲畜的腿部祭肉；“右腿”在中文祭祀条例中自然且避免把解剖范围过度限定为人的“大腿”。
- source_word: לְמָנָה
  choice: 作为他的份
  rationale: 表达获分配的份额；“他的”明确指实际献血和脂肪的祭司。
theological_decisions:
- issue: 祭司群体中 בְּנֵי אַהֲרֹן 的表达
  choice: 亚伦的子孙
  alternative: 亚伦的儿子们
  rationale: 原文为明确的阳性复数亲属称谓，指亚伦家系中的男性祭司。“子孙”保留男性后裔含义，也适合跨世代施行的律例，不改写成性别中性的“家族成员”。
- issue: שְׁלָמִים 的祭类名称
  choice: 平安祭
  alternative: 团契祭
  rationale: 词义可关联完整、福祉或和好，也因共享祭肉而带有团契层面；正文采用传统且较贴近词根联系的“平安祭”，脚注保留另一种理解，不把其神学内涵单一化。
translation_notes:
  register: 采用现代、庄重而易懂的律例文体。以“谁……就……谁”重现希伯来语分词主语与后续归属结构；正文中的脚注标记[a]紧接“平安祭”。
