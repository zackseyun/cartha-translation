  naturalness: 原句的“凡吃……，而这种……是人取来……”在现代汉语中显得拖沓，逻辑关系也略不清晰。改为“凡吃从……牲畜所出的脂肪的人”更符合庄重、清楚的律例文体。
  terminology: “脂肪”“火祭”“耶和华”“被剪除”均可接受，并与本段祭祀及法律语域相称。“被剪除”脚注适当保留该惩罚公式的解释争议；不应在正文中将其具体化。
