revisions:
- from: 因为，凡吃牲畜的脂肪，而这种牲畜是人取来向耶和华献火祭的[a]，吃的人必从自己的民中被剪除[b]。
  to: 因为，凡吃从可取来向耶和华献火祭[a]的牲畜所出的脂肪的人，必从自己的民中被剪除[b]。
  rationale: 重组前半句，使“从可取来向耶和华献火祭的牲畜所出的”直接限定“脂肪”，从而更准确、自然地表达原文关系。保留“人”所体现的泛指法律主体、“自己的民”所避免的性别误指，以及“被剪除”的原文法律意象与脚注歧义说明。
