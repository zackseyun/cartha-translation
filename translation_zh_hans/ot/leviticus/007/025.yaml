  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כִּ֚י כָּל אֹכֵ֣ל חֵ֔לֶב מִן הַ֨/בְּהֵמָ֔ה אֲשֶׁ֨ר יַקְרִ֥יב מִמֶּ֛/נָּה אִשֶּׁ֖ה לַ/יהוָ֑ה וְ/נִכְרְתָ֛ה הַ/נֶּ֥פֶשׁ הָ/אֹכֶ֖לֶת מֵֽ/עַמֶּֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/025.yaml
  text: For anyone who eats fat from an animal from which an offering made by fire is presented to Yahweh[b][a], the person who eats it shall be cut off from his people.
translation:
  language: zh_hans
  text: 因为，凡吃从可取来向耶和华献火祭[a]的牲畜所出的脂肪的人，必从自己的民中被剪除[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “火祭”或译“食物祭”。这个希伯来语祭祀术语指在祭坛上用火焚烧献上的祭物。
    reason: lexical_alternative
  - marker: b
    text: “被剪除”保留了希伯来语的法律固定用语。其具体惩罚为何尚有争议，可能指被逐出群体、死亡或神的审判。
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上一节的禁令，引出理由；“因为”自然保留了经文的论证关系。
- source_word: כָּל אֹכֵל
  choice: 凡吃……的
  rationale: 表达不限定对象的普遍法律情形，既保留“所有、任何”的范围，也符合现代汉语法规式表达。
- source_word: חֵלֶב
  choice: 脂肪
  rationale: 这里指牲畜的脂肪，尤其是在献祭条例中归给祭坛的脂肪部分；“脂肪”清楚、通用，且不额外缩窄所指。
- source_word: מִן הַבְּהֵמָה
  choice: 牲畜的
  rationale: בְּהֵמָה 在献祭语境中指可作祭牲的家畜；“牲畜”比泛称“动物”更贴合本段语境。
- source_word: אֲשֶׁר יַקְרִיב מִמֶּנָּה
  choice: 这种牲畜是人取来……献……的
  rationale: 希伯来文使用第三人称单数动词，但主语未明确，具有泛指作用；用“人”保留这种不定主语，同时表达祭物从该牲畜中取用。
- source_word: אִשֶּׁה
  choice: 火祭
  rationale: 这是祭祀术语，指在祭坛火中焚烧、化为烟气献上的祭物。“火祭”简洁，并以脚注说明另一种可能译法。
- source_word: לַיהוָה
  choice: 向耶和华
  rationale: 介词表示祭物献给的对象；“耶和华”以现代中文圣经读者熟悉的形式呈现神名四字母 YHWH。
- source_word: וְנִכְרְתָה
  choice: 必……被剪除
  rationale: 保留妥拉中具有法律和盟约色彩的固定惩罚用语，不把其具体执行方式预先解释为驱逐、处死或某一种神圣审判。
- source_word: הַנֶּפֶשׁ הָאֹכֶלֶת
  choice: 吃的人
  rationale: נֶפֶשׁ 在此指承担法律责任的个人；译作“人”比字面上的“灵魂”更符合现代汉语，也不改变其法律主体。
- source_word: מֵעַמֶּיהָ
  choice: 从自己的民中
  rationale: 阴性后缀在语法上与阴性名词 נֶפֶשׁ 一致，并不专指女性；“自己的”准确保持泛指，不强加性别。
theological_decisions:
- issue: 盟约惩罚公式 וְנִכְרְתָה ... מֵעַמֶּיהָ 的含义
  choice: 必从自己的民中被剪除
  alternative: 必从自己的民中被逐出；必被处死
  rationale: 此公式的具体机制存在争议，可能涉及群体排除、死亡、神的审判，或这些含义的某种结合。正文保留希伯来语意象，并以脚注提示歧义，不替经文作单一裁定。
- issue: 违法者的性别表达
  choice: 吃的人……自己的民
  alternative: 她的民；他的民
  rationale: 希伯来语后缀的阴性源于它与 נֶפֶשׁ 的语法一致，整条律例所指是任何违法者。中文用“人”和“自己的”既保留单数个体责任，也避免误指特定性别。
- issue: 神名 יהוה 的呈现
  choice: 耶和华
  alternative: 上主；雅威
  rationale: 正文以中文读者广泛熟悉的专名形式保留这是神的名字，而不是普通称号；不借此引入额外的宗派解释。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“凡……的……必……”保留律例文体；以“自己的”自然处理希伯来语语法阴性而不指定违法者性别。两个脚注标记均紧随其所解释的正文用语。
