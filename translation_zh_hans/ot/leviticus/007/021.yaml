id: LEV.7.21
reference: Leviticus 7:21
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/נֶ֜פֶשׁ כִּֽי תִגַּ֣ע בְּ/כָל טָמֵ֗א בְּ/טֻמְאַ֤ת אָדָם֙ א֣וֹ בִּ/בְהֵמָ֣ה טְמֵאָ֗ה א֚וֹ בְּ/כָל שֶׁ֣קֶץ טָמֵ֔א וְ/אָכַ֛ל מִ/בְּשַׂר זֶ֥בַח הַ/שְּׁלָמִ֖ים אֲשֶׁ֣ר לַ/יהוָ֑ה וְ/נִכְרְתָ֛ה הַ/נֶּ֥פֶשׁ הַ/הִ֖וא מֵ/עַמֶּֽי/הָ־־׀־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/021.yaml
  text: And if a person touches anything unclean—whether human uncleanness[a], or an unclean animal, or any unclean detestable thing—and eats some of the flesh of the sacrifice of peace offerings that belongs to Yahweh[b], that person shall be cut off from his people.
translation:
  language: zh_hans
  text: 人若接触任何不洁净之物，无论是人的污秽、不洁净的动物，还是任何不洁净的可憎之物，又吃了属于耶和华的平安祭祭肉，那人就要从自己的族人中被剪除。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “被剪除”是盟约惩罚的用语，可能涉及被排除在群体之外或遭受上帝的审判；本节希伯来原文没有说明具体方式。
    reason: alternative_reading
lexical_decisions:
- source_word: נֶפֶשׁ
  choice: 人
  rationale: 在本段律法语境中，נֶפֶשׁ指一个具体的人，并非专指非物质的“灵魂”或“魂”。
- source_word: תִגַּע
  choice: 接触
  rationale: נגע可指触摸或接触；“接触”自然地表达礼仪上因碰触而沾染不洁的含义。
- source_word: בְּכָל טָמֵא
  choice: 任何不洁净之物
  rationale: 保留原文宽泛、不限定具体类别的表达，并以“不洁净”标示礼仪范畴。
- source_word: טֻמְאַת אָדָם
  choice: 人的污秽
  rationale: 指与人有关的礼仪性污秽；“人”不限定性别，“污秽”则与上下文的不洁主题相符。
- source_word: בִּבְהֵמָה טְמֵאָה
  choice: 不洁净的动物
  rationale: בְּהֵמָה在这里泛指动物；译作“动物”比限定为牲畜更稳妥。
- source_word: שֶׁקֶץ טָמֵא
  choice: 不洁净的可憎之物
  rationale: שֶׁקֶץ带有厌恶、禁忌之意；“可憎之物”保留其强烈色彩，又不将范围缩窄为某一种动物。
- source_word: וְאָכַל מִבְּשַׂר
  choice: 又吃了……祭肉
  rationale: מִן在此具有部分意义；汉语中的“吃了……祭肉”已可自然表达吃取其中一部分，无须生硬补出“一些”。
- source_word: זֶבַח הַשְּׁלָמִים
  choice: 平安祭祭肉
  rationale: “平安祭”保留שְׁלָמִים的传统祭礼名称；后加“祭肉”明确所吃的是祭牲之肉。
- source_word: אֲשֶׁר לַיהוָה
  choice: 属于耶和华的
  rationale: לַיהוָה表明该祭物归耶和华所有或专为他而献；“属于”贴近原文，同时保留献祭归属的观念。
- source_word: יהוה
  choice: 耶和华
  rationale: 以现代中文读者熟悉的专名译出四字神名，在此处清楚区别于一般称号“主”。
- source_word: וְנִכְרְתָה
  choice: 就要……被剪除
  rationale: 保留כרת这一庄严的盟约惩罚用语，不把它具体解释为处死、逐出或某一种神圣审判。
- source_word: מֵעַמֶּיהָ
  choice: 从自己的族人中
  rationale: 原文阴性代词与语法上为阴性的נֶפֶשׁ呼应，并不表示此律法只针对女性；中文用“自己的”自然涵盖男女。
theological_decisions:
- issue: וְנִכְרְתָה ... מֵעַמֶּיהָ所指惩罚的具体方式
  choice: 从自己的族人中被剪除
  alternative: 被逐出族人／被处死
  rationale: 原文采用盟约惩罚的固定表达，却未在本节说明执行方式。译文保留“剪除”，不擅自断定是社群驱逐、死亡还是上帝直接施行的审判。
translation_notes:
  register: 采用现代、庄重而易懂的律法文体。“人若……那人就要……”清楚呈现条件与后果；重复“不洁净”以维持本节礼仪术语的一致性。未保留英文资料中关于阴性代词的脚注，因为现代汉语“自己的”不产生只适用于女性的误解；同时将惩罚说明的脚注标在“被剪除”之后，使标记与内容准确对应。
