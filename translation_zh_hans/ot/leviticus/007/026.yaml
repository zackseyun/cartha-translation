base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/026.yaml
  text: And you shall not eat any blood in any of your dwellings[b][a], whether from bird or from animal.
translation:
  language: zh_hans
  text: 在你们所有的住处[a]，无论是鸟的血还是牲畜的血[b]，你们都不可吃。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在你们各处的定居点。”
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译为“对于鸟和牲畜”；这里指属于或来自鸟和牲畜的血。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כָל
  choice: 任何
  rationale: וְ承接上文；כָּל与否定词连用时具有周遍性的否定含义，现代汉语自然表达为“任何……都不”。句首不另译“并且”，以免中文生硬，但承接关系仍由上下文体现。
- source_word: דָּם
  choice: 血
  rationale: 直接对应希伯来语דָּם，简洁明确，无须增释。
- source_word: לֹא תֹאכְלוּ
  choice: 都不可吃
  rationale: 这是对复数听众发出的律法性禁令；“不可吃”既保留规范力度，也符合现代庄重汉语。与“任何”搭配成“任何血都不可吃”。
- source_word: בְּ/כֹל מוֹשְׁבֹתֵי/כֶם
  choice: 在你们所有的住处
  rationale: מוֹשָׁב可指居住之处或定居点；此译保留“所有”的范围，并表达禁令适用于以色列人各处居所。
- source_word: לָ/עוֹף
  choice: 鸟的
  rationale: 前缀ל在此标明血所属或来源的类别。汉语用领属结构“鸟的”自然简洁，同时在脚注保留希伯来语较直译的形式。
- source_word: וְ/לַ/בְּהֵמָה
  choice: 还是牲畜的
  rationale: בְּהֵמָה通常指陆生牲畜或兽类；在本节与鸟并列时，“牲畜”保持祭祀和饮食法规语境中的常用类别。“无论……还是……”自然表达两类均包括在禁令内。
theological_decisions:
- issue: 禁食血之命令的范围
  choice: 禁令涵盖以色列人所有住处，并适用于鸟和牲畜的血。
  alternative: 末句可更形式化地译作“对于鸟和牲畜”，不明确说明血与这些动物之间是所属或来源关系。
  rationale: 希伯来语最自然地把鸟和牲畜列为所禁之血的动物类别。正文澄清汉语句法所需的领属关系，但不加入本节未陈明的后续神学解释。
translation_notes:
  register: 采用现代、庄重而易懂的律法文体。“任何……都不可……”清楚表达全面禁令；“所有的住处”保留原文范围。脚注标记均置于所说明的词组之后。
