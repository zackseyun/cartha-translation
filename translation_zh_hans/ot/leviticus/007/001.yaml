base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/001.yaml
  text: 'This is the law of the guilt offering: it is most holy[a].'
translation:
  language: zh_hans
  text: 这是赎愆祭的条例；这祭是至圣的。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “赎愆祭”也可译作“赔偿祭”或“补偿祭”。希伯来语 אָשָׁם 所指的祭与罪责及偿还有关。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/זֹאת
  choice: 这是
  rationale: וְ在此承接上下文并引出新的条例；现代汉语无需机械译出“和”，用“这是”自然开启本段，同时不加入原文没有的时间副词。
- source_word: תּוֹרַת
  choice: ……的条例
  rationale: תּוֹרָה在祭祀语境中指规定的礼仪规程。“条例”既贴近制度性含义，也比笼统的“律法”更适合具体祭例。
- source_word: הָ/אָשָׁם
  choice: 赎愆祭
  rationale: אָשָׁם是利未记中特定的祭类，兼有关乎罪责与偿还的含义。“赎愆祭”是简洁、庄重且较为通行的中文祭名；其他侧重补偿的译法收入脚注。
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: 至圣的
  rationale: 该重叠属最高级表达，表示最高等级的圣洁。“至圣”自然准确，也避免把它误解为圣所中的“至圣所”。
- source_word: הוּא
  choice: 这祭是
  rationale: 阳性代词回指赎愆祭；汉语补出“祭”可清楚表达其所指，并自然构成判断句。
theological_decisions:
- issue: 祭名אָשָׁם的译法
  choice: 赎愆祭
  alternative: 赔偿祭；补偿祭
  rationale: 本节所指是利未礼制中的特定祭类。“赎愆祭”保留其与罪责相关的传统祭名，同时不把意义缩减为经济赔偿；脚注说明其也带有偿还、补偿的关联。
translation_notes:
  register: 采用现代、庄重而易懂的礼仪法规语体。“条例”体现具体祭祀规程；分号保留原文先命名条例、再作圣洁等级判断的两部分结构。脚注标记[a]已置于正文对应句末。
