id: LEV.7.15
reference: Leviticus 7:15
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וּ/בְשַׂ֗ר זֶ֚בַח תּוֹדַ֣ת שְׁלָמָ֔י/ו בְּ/י֥וֹם קָרְבָּנ֖/וֹ יֵאָכֵ֑ל לֹֽא יַנִּ֥יחַ מִמֶּ֖/נּוּ עַד בֹּֽקֶר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/015.yaml
  text: And the flesh of the sacrifice of his thanksgiving peace offering shall be eaten on the day of his offering[b][a]; he shall not leave any of it until morning.
translation:
  language: zh_hans
  text: 他所献的感恩平安祭[a]，祭肉要在献祭的当天吃；一点也不可留到早晨。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “平安祭”或译“团契祭”；“感恩平安祭”也可译作“为感恩所献的平安祭”。
    reason: 保留שְׁלָמִים的常见词义选择，并说明希伯来语密集组合结构的另一种自然展开方式。
lexical_decisions:
- source_word: וּבְשַׂר זֶבַח
  choice: 祭肉
  rationale: בשר指肉，זבח指宰献的祭牲或祭；合译为“祭肉”既准确表达祭牲的肉，也符合现代汉语的祭祀语境。
- source_word: תּוֹדַת שְׁלָמָיו
  choice: 他所献的感恩平安祭
  rationale: 该结构指平安祭中为感恩而献的一类。“感恩平安祭”简洁保留“感恩”与“平安祭”两个要素；“他所献的”表达第三人称阳性单数后缀与献祭者的关系。
- source_word: בְּיוֹם קָרְבָּנוֹ
  choice: 在献祭的当天
  rationale: 直译为“在他献祭的日子”；现代汉语用“在献祭的当天”更自然，同时保留祭物须当日吃完的时间限定。
- source_word: יֵאָכֵל
  choice: 要……吃
  rationale: 希伯来语为被动式未完成体，在律法语境中表达规定。汉语用“祭肉要……吃”自然传达规范性，不必机械保留被动句式。
- source_word: לֹא יַנִּיחַ מִמֶּנּוּ
  choice: 一点也不可留
  rationale: 动词意为“留下”，介词短语表示其中任何一部分；“一点也不可留”清楚传达绝对禁止，并保留单数施事者所承担的责任。
- source_word: עַד בֹּקֶר
  choice: 到早晨
  rationale: 准确表达以次日早晨为界限的时间短语，与“留到早晨”构成自然现代汉语。
theological_decisions:
- issue: שְׁלָמִים这一祭类名称的译法
  choice: 平安祭
  alternative: 团契祭
  rationale: “平安祭”是较少解释性的固定祭祀术语，并可在《利未记》中保持前后一致；“团契祭”强调共享或相交的功能，但比原词本身更具解释性。
- issue: תּוֹדָה与שְׁלָמִים的关系
  choice: 感恩平安祭
  alternative: 为感恩所献的平安祭
  rationale: 原文将“感恩”与“平安祭”紧密结合，表示平安祭的一个感恩类别。“感恩平安祭”保留这种紧密关系而不进一步界定其神学意义。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“祭肉”“平安祭”“献祭”保持利未记祭祀法规的术语一致性；“要……吃”“不可留”清楚呈现律法规定，又避免生硬仿照希伯来语句法。
