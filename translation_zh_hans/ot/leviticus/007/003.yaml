  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/אֵ֥ת כָּל חֶלְבּ֖/וֹ יַקְרִ֣יב מִמֶּ֑/נּוּ אֵ֚ת הָֽ/אַלְיָ֔ה וְ/אֶת הַ/חֵ֖לֶב הַֽ/מְכַסֶּ֥ה אֶת הַ/קֶּֽרֶב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/003.yaml
  text: 'And from it he shall present all its fat: the fat tail and the fat that covers the entrails[a][b].'
translation:
  language: zh_hans
  text: 要从祭牲中献上它所有的脂肪：肥尾[a]和遮盖内脏的脂肪。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 指绵羊富含脂肪的尾部，是献祭时特定献上的脂肪部分。
    reason: cultural_note
lexical_decisions:
- source_word: חֶלְבּוֹ / הַחֵלֶב
  choice: 它所有的脂肪／脂肪
  rationale: 在献祭法规中，חֵלֶב特指规定献上的脂肪部分；译作“脂肪”直接、自然，也保留其礼仪语境。
- source_word: יַקְרִיב
  choice: 献上
  rationale: קרב的使役式在献祭语境中可指把祭物呈到上帝面前或作为祭物献上；“献上”在现代汉语中兼顾呈献和献祭之意，不必进一步限定仪式阶段。
- source_word: מִמֶּנּוּ
  choice: 从祭牲中
  rationale: 后缀最自然地回指上下文中的祭牲，而非献祭者；明确译出“祭牲”可消除汉语代词可能造成的歧义。
- source_word: הָאַלְיָה
  choice: 肥尾
  rationale: אַלְיָה指绵羊富含脂肪的尾部，是特定的献祭脂肪部分；“肥尾”简洁而准确。
- source_word: הַמְכַסֶּה אֶת־הַקֶּרֶב
  choice: 遮盖内脏的
  rationale: קֶרֶב在这里指祭牲腹腔内的脏器；“遮盖内脏的脂肪”是清楚、具体且自然的现代汉语表达。
- source_word: כָּל
  choice: 所有的
  rationale: 保留原文对规定脂肪部分之整体性的强调。
theological_decisions: []
