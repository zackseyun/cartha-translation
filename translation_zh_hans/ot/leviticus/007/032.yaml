  text: וְ/אֵת֙ שׁ֣וֹק הַ/יָּמִ֔ין תִּתְּנ֥וּ תְרוּמָ֖ה לַ/כֹּהֵ֑ן מִ/זִּבְחֵ֖י שַׁלְמֵי/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/032.yaml
  text: And you shall give the right thigh as a contribution to the priest from your sacrifices of peace offerings[a][b][c].
translation:
  language: zh_hans
  text: 你们要从平安祭中取出右后腿，作为献给祭司的礼物[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “右后腿”也可译作“右腿”。
    reason: lexical_alternative
  - marker: b
    text: “礼物”也可译作“供物”；传统译作“举祭”。“平安祭”也可译作“团契祭”或“福祉祭”。
    reason: lexical_alternative
lexical_decisions:
- source_word: שׁוֹק
  choice: 后腿
  rationale: 该词指动物腿部的指定部位；在祭牲语境中，现代汉语用“后腿”比单说“腿”更明确，也比“腿股”自然。
- source_word: הַיָּמִין
  choice: 右
  rationale: 明确保留原文所指定的右侧部位。
- source_word: תִּתְּנוּ
  choice: 你们要……献给
  rationale: 以“要”表达第二人称复数未完成式在律法条文中的指令语气，庄重而不古奥。
- source_word: תְרוּמָה
  choice: 作为……礼物
  rationale: 此词指分别出来、交付给指定对象的一份；“礼物”在本句中自然传达献交之物，同时用脚注保留“举祭”的传统祭仪译法。
- source_word: לַכֹּהֵן
  choice: 给祭司
  rationale: 按原文保留单数受领者“祭司”。
- source_word: מִזִּבְחֵי
  choice: 从……祭中取出
  rationale: 介词 מִן 表示来源；补出“取出”使中文清楚表达这一份来自所献的祭。
- source_word: שַׁלְמֵיכֶם
  choice: 你们的平安祭
  rationale: שְׁלָמִים 是特定祭名；“平安祭”沿用清楚而广为人知的汉语称呼，并在脚注列出可体现团契或福祉含义的译法。
- source_word: וְאֵת
  choice: （不另译“和”）
  rationale: וְ 承接上文，אֵת 是直接宾语标记；本节独立呈现时，现代汉语无需机械译出句首连接词，关系仍由句法自然体现。
theological_decisions:
- issue: שְׁלָמִים 的祭名含义
  choice: 平安祭
  alternative: 团契祭；福祉祭
  rationale: 原词可关联完整、安宁、福祉，也可能凸显共享祭物所表达的团契；正文采用通行祭名，但以脚注保留其语义宽度，避免把含义限定为某一种神学解释。
translation_notes:
  register: 采用现代、简洁而庄重的律法条文语体。“从……取出”明确来源关系；不用较生硬的“腿股”和容易令人误解为必须实际举起的“举祭”作正文，但在脚注中保留传统术语及祭名的其他合理译法。
