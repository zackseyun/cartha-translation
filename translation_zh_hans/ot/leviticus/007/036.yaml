  text: אֲשֶׁר֩ צִוָּ֨ה יְהוָ֜ה לָ/תֵ֣ת לָ/הֶ֗ם בְּ/יוֹם֙ מָשְׁח֣/וֹ אֹתָ֔/ם מֵ/אֵ֖ת בְּנֵ֣י יִשְׂרָאֵ֑ל חֻקַּ֥ת עוֹלָ֖ם לְ/דֹרֹתָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/036.yaml
  text: which Yahweh commanded to be given to them from the sons of Israel on the day he anointed them—an everlasting statute throughout their generations[a][b].
translation:
  language: zh_hans
  text: 这是雅威在膏立他们的那日，吩咐以色列人给他们的；并且是他们世世代代永远的条例。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “以色列人”直译为“以色列的子孙”。
    reason: lexical_alternative
  - marker: b
    text: “永远的条例”也可译作“永久的条例”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר
  choice: 这是……的
  rationale: 承接上文祭司所得的份，并以自然的现代汉语构成关系分句。
- source_word: צִוָּה
  choice: 吩咐
  rationale: 保留神圣命令的权威性，也符合汉语律法叙述的庄重语体。
- source_word: יְהוָה
  choice: 雅威
  rationale: 直接音译四字神名，保留其作为以色列之神专名的性质，不以称号替代。
- source_word: לָתֵת לָהֶם
  choice: 给他们
  rationale: 希伯来文形式为“给他们”；汉语结合“吩咐以色列人”即可自然表达受命交付之意。
- source_word: בְּיוֹם מָשְׁחוֹ אֹתָם
  choice: 在膏立他们的日子
  rationale: 保留具体的受膏动作及时间表达；“膏立”比泛化的“分别为圣”更贴近 משׁח。
- source_word: מֵאֵת בְּנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 按现代汉语将来源方自然处理为“给”的执行者；字面形式“以色列的子孙”在脚注中保留。
- source_word: חֻקַּת עוֹלָם
  choice: 永远的条例
  rationale: 保留祭司律法中固定法律用语的持久效力，同时不将 עוֹלָם 解释成超出上下文的哲学性永恒。
- source_word: לְדֹרֹתָם
  choice: 他们世世代代
  rationale: 自然表达该条例在连续各代中的持续适用。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 采用较贴近 YHWH 学术重构读音的中文音译，明确保留神的专名，而不替换为“主”等称号。
- issue: עֹולָם 在祭司律法中的语力
  choice: 永远的条例
  alternative: 永久的条例
  rationale: 保留盟约律法公式的强度，并由“世世代代”限定其经文中的延续语境，不额外裁定后续神学问题。
translation_notes:
  register: 采用现代、庄重而易懂的律法叙述语体。“膏立”保留礼仪动作，“条例”体现法律语境；分号使上文所指的祭司份额与后半句的持续性规定关系清楚。
