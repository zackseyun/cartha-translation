  yaml_path: translation/ot/leviticus/007/022.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: zh_hans
  text: 耶和华对摩西说：
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: 说
  rationale: 该动词配合叙事性的连接形式，引出新的神谕段落；现代汉语以“说”最自然，而“晓谕”较为古旧。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 这是四字神名；“耶和华”是现代中文圣经语境中通行且可辨识的专名形式，并非以“主”这一称号替代。
- source_word: אֶל־מֹשֶׁה
  choice: 对摩西
  rationale: 介词 אֶל 标示说话的对象，汉语自然表达为“对摩西”。
- source_word: לֵאמֹר
  choice: 说
  rationale: 该不定式构成引述公式，表明下文是话语内容；中文用句末“说：”自然传达其功能，无须机械重复为“说话……说”。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威；上主
  rationale: 原文使用神的专名。译作“耶和华”保留专名性质，也符合普通现代中文读者较熟悉的形式；不以称号“上主”取代。原文并不能确定古代元音，故“雅威”也是可能的音译。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。希伯来语“说话……说”的公式化结构在中文中整合为“对摩西说：”，冒号提示神谕内容接续于下一节。
