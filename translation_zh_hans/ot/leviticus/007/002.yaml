  text: בִּ/מְק֗וֹם אֲשֶׁ֤ר יִשְׁחֲטוּ֙ אֶת הָ֣/עֹלָ֔ה יִשְׁחֲט֖וּ אֶת הָ/אָשָׁ֑ם וְ/אֶת דָּמ֛/וֹ יִזְרֹ֥ק עַל הַ/מִּזְבֵּ֖חַ סָבִֽיב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/002.yaml
  text: In the place where they slaughter the burnt offering[a], they shall slaughter the guilt offering, and he shall splash its blood against the altar all around.
translation:
  language: zh_hans
  text: 他们宰燔祭牲的地方，赎愆祭牲也要在那里宰；并把它的血泼洒在祭坛四周。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּמְקוֹם אֲשֶׁר
  choice: ……的地方
  rationale: 以自然的现代汉语表达具体的礼仪地点关系，同时保留原文关系从句的定位作用。
- source_word: יִשְׁחֲטוּ
  choice: 宰
  rationale: 该动词在献祭语境中指宰杀祭牲；“宰”准确、简洁，也符合中文祭祀法规的语体。
- source_word: הָעֹלָה
  choice: 燔祭牲
  rationale: עֹלָה是整只焚烧献上的祭，传统术语“燔祭”辨识度高；加“牲”明确此处所宰的是祭牲。
- source_word: הָאָשָׁם
  choice: 赎愆祭牲
  rationale: אָשָׁם既涉及罪责，也常涉及赔偿或补偿。“赎愆祭”保留这一独立献祭类别，加“牲”与宰杀动作自然搭配；脚注说明其他可译法及语义张力。
- source_word: דָּמוֹ
  choice: 它的血
  rationale: 第三人称单数后缀指赎愆祭牲；“它的血”是清楚自然的现代汉语。
- source_word: יִזְרֹק
  choice: 泼洒
  rationale: זָרַק在祭司礼仪中指将血抛洒、泼洒到祭坛上，并非轻微喷撒；“泼洒”较准确地表现该动作。
- source_word: עַל הַמִּזְבֵּחַ סָבִיב
  choice: 在祭坛四周
  rationale: 表达血被施于祭坛周围各面；“在祭坛四周”自然地涵盖介词עַל与סָבִיב在此礼仪语境中的组合意义。
- source_word: יִזְרֹק（单数）
  choice: 祭司要……
  rationale: 原文前半的复数“他们宰”转为后半的单数“他泼洒”。中文若只写“他”指代不够清楚，因此依祭司礼仪的语境明示为“祭司”，同时保留数的转换。
theological_decisions:
- issue: אָשָׁם这一祭名的翻译
  choice: 赎愆祭
  alternative: 赎罪祭、赔偿祭、补偿祭
  rationale: “赎愆祭”能与常译为“赎罪祭”的חַטָּאת区分，也保留罪责及补偿之间的语义张力；脚注列出更直观的替代译法，不把该术语缩减为单一教义解释。
- issue: 后半句单数施事者的身份
  choice: 祭司
  alternative: 他
  rationale: 希伯来文只用阳性单数动词，并未再次明说名词；利未记献祭程序的语境指向执行洒血礼的祭司。正文为现代读者明示施事者，但不扩展其神学意义。
translation_notes:
  register: 采用现代、庄重而易懂的法规性语体。保留“燔祭”“祭坛”等通行圣经术语；用“宰”“泼洒”具体呈现献祭动作，避免文言化表达。
