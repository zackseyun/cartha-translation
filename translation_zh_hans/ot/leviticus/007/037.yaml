  text: זֹ֣את הַ/תּוֹרָ֗ה לָֽ/עֹלָה֙ לַ/מִּנְחָ֔ה וְ/לַֽ/חַטָּ֖את וְ/לָ/אָשָׁ֑ם וְ/לַ֨/מִּלּוּאִ֔ים וּ/לְ/זֶ֖בַח הַ/שְּׁלָמִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/037.yaml
  text: This is the law for the burnt offering[a], the grain offering, the sin offering, the guilt offering, the ordination offering[d][c][b], and the sacrifice of peace offerings.
translation:
  language: zh_hans
  text: 这是关于燔祭、素祭、赎罪祭[a]、赎愆祭[b]、承接圣职礼[c]和平安祭[d]的条例。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “赎罪祭”也可译作“洁净祭”；希伯来语名称既可强调处理罪，也可强调除去不洁。
    reason: lexical_alternative
  - marker: b
    text: “赎愆祭”也可译作“赔偿祭”；这个名称可强调所负的罪责以及应作的赔偿。
    reason: lexical_alternative
  - marker: c
    text: 或译“承接圣职的礼仪”或“分别为圣礼”。希伯来语为复数，指祭司受职的一系列程序。
    reason: lexical_alternative
  - marker: d
    text: “平安祭”也可译作“团契祭”或“福祉祭”。
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת הַתּוֹרָה
  choice: 这是……的条例
  rationale: זֹאת引出总结，הַתּוֹרָה在祭祀法规语境中指规范这些祭礼的条例或指示；“条例”比抽象的“律法”更自然贴合本节。
- source_word: לָעֹלָה
  choice: 关于燔祭
  rationale: 前缀ל־表示条例所涉及的对象；עֹלָה指整祭物焚烧献上的燔祭。
- source_word: לַמִּנְחָה
  choice: 素祭
  rationale: מִנְחָה在利未记祭祀语境中特指以谷物等为主的祭物；“素祭”是简洁且通行的中文名称。
- source_word: וְלַחַטָּאת
  choice: 赎罪祭
  rationale: חַטָּאת可指罪，也可指处理罪与不洁的祭；正文采用通行的“赎罪祭”，脚注保留“洁净祭”的语义可能。
- source_word: וְלָאָשָׁם
  choice: 赎愆祭
  rationale: אָשָׁם涉及罪责、亏欠及相应赔偿；“赎愆祭”保留传统辨识度，脚注说明“赔偿祭”这一强调补偿责任的译法。
- source_word: וְלַמִּלּוּאִים
  choice: 承接圣职礼
  rationale: מִלּוּאִים为复数，字面与“充满（手）”有关，在此指祭司受职、被立的整套礼仪，而不必限缩为单一祭物。
- source_word: וּלְזֶבַח הַשְּׁלָמִים
  choice: 平安祭
  rationale: זֶבַח明确含献祭之意，שְׁלָמִים所指祭类可关联平安、福祉和团契；中文用通行的“平安祭”，并以脚注保存其他语义侧重。
theological_decisions:
- issue: חַטָּאת所指是“罪”还是“洁净”功能
  choice: 正文译“赎罪祭”，并加脚注
  alternative: 洁净祭
  rationale: 原词兼有处理罪与除去礼仪不洁的功能，正文不以单一解释抹去其语义张力。
- issue: אָשָׁם的主要侧重
  choice: 正文译“赎愆祭”，并加脚注
  alternative: 赔偿祭
  rationale: 原词既关乎罪责，也常关乎赔补责任；脚注保留后者，避免只作内在罪疚理解。
- issue: מִלּוּאִים是祭物还是整套受职礼
  choice: 承接圣职礼
  alternative: 承接圣职祭；分别为圣礼
  rationale: 希伯来文为复数，且上下文指祭司就职程序；采用“礼”可避免无根据地限缩为单一祭物。
- issue: שְׁלָמִים的祭祀含义
  choice: 正文译“平安祭”，并加脚注
  alternative: 团契祭；福祉祭
  rationale: 原词语义可涉及完整、安康及共享团契，传统译名不能穷尽这些侧面，故在脚注中保留。
translation_notes:
  register: 采用现代、庄重而易懂的祭祀术语。“燔祭、素祭、赎罪祭、赎愆祭、平安祭”保留中文读者熟悉的名称；对原文中较宽的语义以脚注说明。调整英文咨询层脚注所附位置，使各标记紧随对应术语。
