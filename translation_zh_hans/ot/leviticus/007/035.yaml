  text: זֹ֣את מִשְׁחַ֤ת אַהֲרֹן֙ וּ/מִשְׁחַ֣ת בָּנָ֔י/ו מֵ/אִשֵּׁ֖י יְהוָ֑ה בְּ/יוֹם֙ הִקְרִ֣יב אֹתָ֔/ם לְ/כַהֵ֖ן לַ/יהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/035.yaml
  text: This is the anointed portion of Aaron and the anointed portion of his sons from the food offerings of Yahweh[b][a], on the day when he presented them to serve as priests to Yahweh.
translation:
  language: zh_hans
  text: 这是亚伦受膏所得的份[a]，也是他儿子们受膏所得的份，取自献给耶和华的火祭[b]，是在他使他们近前来作祭司侍奉耶和华的那一天定下的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “受膏所得的份”也可译作“受膏之份”或“膏立所得的份”。原词与“膏立”同源；在这里很可能指与祭司膏立、承接圣职相关的指定份额。
    reason: lexical_alternative
  - marker: b
    text: “火祭”也可译作“献给耶和华的食物祭”；传统译法为“献给耶和华的火祭”。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁחַת
  choice: 受膏所得的份
  rationale: 该词与“膏立”同源，但本节处于祭司所得祭物份额的语境中，所指很可能是与膏立、承接圣职相联系的指定份额。译文同时保留“受膏”的词源联系和“份”的实际含义。
- source_word: מִשְׁחַת אַהֲרֹן וּמִשְׁחַת בָּנָיו
  choice: 亚伦受膏所得的份，也是他儿子们受膏所得的份
  rationale: 依照希伯来文保留名词的重复，不将亚伦与众子所得的份压缩成一个合并表述。
- source_word: מֵאִשֵּׁי יְהוָה
  choice: 取自献给耶和华的火祭
  rationale: אִשֶּׁה传统上指经火献上的祭物。“火祭”简洁且符合利未记的祭祀语境；用“献给”说明祭物的归向，避免理解为火本身所有的祭。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的专名形式呈现四字神名，而不以普通称号替代。
- source_word: בְּיוֹם
  choice: 在……的那一天
  rationale: 保留原文明确的时间结构，同时符合现代汉语表达。
- source_word: הִקְרִיב אֹתָם
  choice: 他使他们近前来
  rationale: קרב的使役形表示使人靠近或呈到面前；这里宾语是亚伦和他的儿子们，因此不译作容易使人误以为将他们当祭物献上的“献上他们”。原文未明说主语是谁，译文也只保留“他”。
- source_word: לְכַהֵן לַיהוָה
  choice: 作祭司侍奉耶和华
  rationale: כהן表示履行祭司职分；该译法自然表达他们为耶和华从事祭司服侍。
theological_decisions:
- issue: 祭司条例中מִשְׁחַת的含义
  choice: 受膏所得的份
  alternative: 膏立；受膏之份；指定份额
  rationale: 上下文总结祭司从祭物中所得的权利，但词本身与膏立密切相关。译文不把它单纯化为“份额”，也不把它仅仅理解为膏油仪式，而是保留两方面的联系。
- issue: הִקְרִיב的未明主语
  choice: 保留为“他”
  alternative: 明确译作“摩西”或改为无主句
  rationale: 原文动词是阳性单数，却未在本节明说主语。虽然上下文可使人推知所指，正文不额外补入名字，以保存原文的指代方式。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“使他们近前来”略带礼仪语域，用以保留原文动词的接近、呈到面前之意；末尾补出“所给的”，使希伯来文名词句及时间短语在中文中关系清楚，但不改变份额是在承接祭司职分之日确立或给予的语义。
