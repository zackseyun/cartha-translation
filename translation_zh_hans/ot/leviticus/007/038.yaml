  text: אֲשֶׁ֨ר צִוָּ֧ה יְהוָ֛ה אֶת מֹשֶׁ֖ה בְּ/הַ֣ר סִינָ֑י בְּ/י֨וֹם צַוֺּת֜/וֹ אֶת בְּנֵ֣י יִשְׂרָאֵ֗ל לְ/הַקְרִ֧יב אֶת קָרְבְּנֵי/הֶ֛ם לַ/יהוָ֖ה בְּ/מִדְבַּ֥ר סִינָֽי־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/038.yaml
  text: which Yahweh commanded Moses on Mount Sinai[a], on the day when he commanded the sons of Israel to present their offerings to Yahweh in the wilderness of Sinai.
translation:
  language: zh_hans
  text: 这是耶和华在西奈山、在他吩咐以色列人[a]在西奈旷野把他们的祭物献给耶和华的那一天，吩咐摩西的条例。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“以色列的众子”，是对以色列民的称呼。
    reason: 说明原文固定称谓的字面形式及其群体含义。
lexical_decisions:
- source_word: אֲשֶׁר
  choice: 这是……的
  rationale: 承接上文所列献祭条例，并以自然的现代汉语保留关系从句的总结作用。
- source_word: צִוָּה
  choice: 吩咐
  rationale: 在律法语境中表达权威命令；较“命令”更符合汉语圣经叙述的庄重语体。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 直接译出四字神名，而不以称号替代；“耶和华”是现代汉语中通行且易识别的音译。
- source_word: בְּהַר סִינָי
  choice: 在西奈山
  rationale: בְ 在此可表达事件发生地点；“在西奈山”自然且不额外限定为山顶。
- source_word: בְּיוֹם צַוֺּתוֹ
  choice: 那一天，他吩咐
  rationale: 保留原文明确的时间短语，并将带后缀的不定式结构转换为流畅的汉语分句。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 这是该希伯来固定族群称谓在现代汉语中的准确自然表达；字面为“以色列的众子”，另以脚注说明。
- source_word: לְהַקְרִיב
  choice: 把……献给
  rationale: קרב 的使役式在祭祀语境中指带来并奉献；“献给”清楚表达礼仪行为及其对象。
- source_word: קָרְבְּנֵיהֶם
  choice: 他们的供物
  rationale: קָרְבָּן 是涵盖多类祭物的广义术语；“供物”比“祭牲”范围更广，也避免与动词重复。
- source_word: בְּמִדְבַּר סִינָי
  choice: 在西奈旷野
  rationale: 准确表达地理名称与 מִדְבָּר 的荒野含义，符合现代汉语习惯。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 保留原文专名而非以“主”替代；采用现代简体中文读者最熟悉的通行音译，同时承认“雅威”较贴近学界常见的拟音。
- issue: בְּנֵי יִשְׂרָאֵל 的表达
  choice: 以色列人
  alternative: 以色列的众子
  rationale: 此处是对整个约民群体的固定称呼。“以色列人”在汉语中准确、自然，并不排除女性；脚注保留原文字面形式，避免隐藏其家族性意象。
- issue: בְּהַר סִינָי 与 בְּמִדְבַּר סִינָי 的地点关系
  choice: 在西奈山……在西奈旷野
  alternative: 在西奈山那里……在西奈旷野
  rationale: 依原文分别保留两个地点短语，不尝试调和或解释二者的空间关系。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“这是……的”承接7:37的条例清单；分号划分颁令地点与颁令当日的内容，使长句易读。
