  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: דַּבֵּ֛ר אֶל בְּנֵ֥י יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר הַ/מַּקְרִ֞יב אֶת זֶ֤בַח שְׁלָמָי/ו֙ לַ/יהוָ֔ה יָבִ֧יא אֶת קָרְבָּנ֛/וֹ לַ/יהוָ֖ה מִ/זֶּ֥בַח שְׁלָמָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/029.yaml
  text: 'Speak to the sons of Israel[b][a], saying: The one who presents his peace sacrifice to Yahweh shall bring his offering to Yahweh from his peace sacrifice.'
translation:
  language: zh_hans
  text: “你要告诉以色列人说：‘凡把平安祭献给耶和华的，都要从自己的平安祭中，把供物带来献给耶和华。’”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “平安祭”也可译作“和平祭”或“团契祭”；希伯来语是这一祭类的专门名称，与“完整、安好、和平”一组词相关。
    reason: 说明祭祀术语的词义范围和常见替代译法，避免把它仅理解为寻求和平的祭。
lexical_decisions:
- source_word: דַּבֵּר אֶל־בְּנֵי יִשְׂרָאֵל
  choice: 你要告诉以色列人
  rationale: דַּבֵּר是命令式；现代汉语中“告诉……说”自然、清楚。בְּנֵי יִשְׂרָאֵל字面为“以色列的众子”，在此是全体以色列民的惯用称呼，译作“以色列人”可准确表达其群体意义。
- source_word: הַמַּקְרִיב
  choice: 凡……献……的
  rationale: קרב的使役词干在祭祀语境中指把祭物带近、呈献；“献”符合现代汉语礼仪用语，“凡……的”表达带冠词分词所指的一般性主体。
- source_word: זֶבַח שְׁלָמָיו
  choice: 自己的平安祭
  rationale: זֶבַח明确指祭牲或祭祀，שְׁלָמִים是专门的祭类名称。采用中文圣经传统且易懂的“平安祭”，并以“自己的”体现第三人称单数所属关系。
- source_word: לַיהוָה
  choice: 献给耶和华
  rationale: 介词ל表示对象或方向；יהוה在中文正文中采用通行且明确的专名“耶和华”。首处结合动词译为“献给”，次处同样保留奉献对象。
- source_word: יָבִיא אֶת־קָרְבָּנוֹ
  choice: 都要……把供物带来
  rationale: 未完成式在律法语境中具有规定、义务意味，译作“要”；קָרְבָּן是带近献上的礼物或祭物，“供物”可与本句特定的“平安祭”区分。
- source_word: מִזֶּבַח שְׁלָמָיו
  choice: 从自己的平安祭中
  rationale: מִן表示来源或取出关系，说明要带来的供物取自所献的平安祭；“从……中”保留这一结构。
theological_decisions:
- issue: יהוה的译法
  choice: 耶和华
  alternative: 雅威；上主
  rationale: “耶和华”是现代中文读者广泛识别的圣经专名，可在不以普通称号替代的情况下清楚标示原文的神圣名号。
- issue: שְׁלָמִים祭类术语
  choice: 平安祭
  alternative: 酬恩祭；团契祭；和平祭
  rationale: “平安祭”保留与שׁלם所含完整、安好和平语义的联系，也是简体中文圣经语境中清楚而通行的祭祀术语；不把其意义限定为团契或感恩。
- issue: בְּנֵי יִשְׂרָאֵל的群体范围
  choice: 以色列人
  alternative: 以色列的众子；以色列子民
  rationale: 此希伯来惯用语在律法训令中指以色列群体，并非意在排除女性；译作“以色列人”保留集体指称，也避免现代汉语将“众子”误解为仅限男性。
- issue: קָרְבָּנוֹ与זֶבַח שְׁלָמָיו的关系
  choice: 从自己的平安祭中，把供物带来
  alternative: 把自己的祭物，就是平安祭，带来
  rationale: 保留מִן的来源关系，不把“供物”和“平安祭”强行解释为完全同位；下一节将具体说明从祭牲中带来的部分。
translation_notes:
  register: 采用现代、庄重而易懂的律法体。以“凡……的，都要……”表达一般性规定；保留“献给耶和华”的重复，以反映原文强调。脚注标记置于整节之后。
