  text: וְ/כָל מִנְחָ֗ה אֲשֶׁ֤ר תֵּֽאָפֶה֙ בַּ/תַּנּ֔וּר וְ/כָל נַעֲשָׂ֥ה בַ/מַּרְחֶ֖שֶׁת וְ/עַֽל מַחֲבַ֑ת לַ/כֹּהֵ֛ן הַ/מַּקְרִ֥יב אֹתָ֖/הּ ל֥/וֹ תִֽהְיֶֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/009.yaml
  text: And every grain offering that is baked in the oven[a], and everything prepared in a pan or on a griddle, shall belong to the priest who presents it.
translation:
  language: zh_hans
  text: 凡在炉中烤的素祭，以及在锅里或煎盘上做的[a]，都要归给献这祭的祭司。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “锅”和“煎盘”所译的两个希伯来词可能分别指较深的锅和较平的盘，但这两种器具的确切形制不能完全确定。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִנְחָה
  choice: 素祭
  rationale: 在利未记的祭祀语境中，此词特指以谷物为主要材料的祭物。“素祭”是现代中文圣经语体中简洁而明确的通行名称，并非泛指任何礼物或供物。
- source_word: תֵּאָפֶה בַּתַּנּוּר
  choice: 在炉中烤
  rationale: תֵּאָפֶה 是“烤”的被动形式；中文用“在炉中烤的”自然表达制作方式，不必生硬保留被动句式。
- source_word: נַעֲשָׂה
  choice: 做的
  rationale: עשה 本义宽泛，为“做、制成”；此处指用器具制作素祭。“做的”既自然，又不擅自限定为煎、炸或烘焙。
- source_word: מַרְחֶשֶׁת
  choice: 锅
  rationale: 此词指一种烹调用具，通常被认为比 מַחֲבַת 深；正文采用普通读者易懂的“锅”，并在脚注说明可能的形制差异。
- source_word: מַחֲבַת
  choice: 煎盘
  rationale: 此词一般被理解为较平的烹调器具。“煎盘”既与前面的“锅”有所区别，也保留了器具具体形制仍不完全确定的余地。
- source_word: לַכֹּהֵן הַמַּקְרִיב אֹתָהּ
  choice: 归给献这祭的祭司
  rationale: ל־ 与 לוֹ תִהְיֶה 共同表达归属；הַמַּקְרִיב 是祭祀语境中的“献上者”。中文整合为“归给献这祭的祭司”，清楚表达该份祭物归实际献祭的祭司所有。
- source_word: לוֹ תִהְיֶה
  choice: 都要归给
  rationale: 此结构表达法律性的分配与所有权。“要归给”比直译“要成为他的”更符合现代中文，同时保留规定性的语气。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的律法条文语体。“凡……都要……”保留原文的总括性和规定性；避免使用过于古雅的“炉内”“归于”等表达。脚注标记置于两个有词义不确定性的器具名称之后。
