base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/017.yaml
  text: But what remains of the meat of the sacrifice on the third day shall be burned in the fire[a].
translation:
  language: zh_hans
  text: 祭肉若有剩下的，第三天要用火焚烧。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהַנּוֹתָר
  choice: 若有剩下的
  rationale: 将带冠词的被动分词按名词性用法译出，指前文所说祭肉中剩余的部分；用“若有”使现代汉语自然，同时不改变这是对余物的处置规定。句首连接词承接上文，汉语中不必机械译为“而”。
- source_word: מִבְּשַׂר הַזָּבַח
  choice: 祭肉
  rationale: בָּשָׂר在献祭并食用的语境中指肉，זֶבַח限定其为祭牲或祭物；合译“祭肉”简明自然，保留具体所指。
- source_word: בַּיּוֹם הַשְּׁלִישִׁי
  choice: 第三天
  rationale: 直译其时间表达，指到第三日时对剩余祭肉的处置，不译成“第三天以前”，以免加入原文没有明说的期限解释。
- source_word: בָּאֵשׁ
  choice: 用火
  rationale: 此处介词ב表示焚毁的方式或媒介；现代汉语“用火焚烧”比“在火中焚烧”更顺畅，意义等同。
- source_word: יִשָּׂרֵף
  choice: 要……焚烧
  rationale: Niphal未完成式在律例中表达规范性要求；“要……焚烧”保持被处置的含义和律法语气，又符合现代汉语表达。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的律例语体。“祭肉”凝练表达“祭牲之肉”；句法紧凑，承接上一节关于食用期限的规定。
