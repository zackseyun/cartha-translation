- from: 他要亲手把献给耶和华的火祭带来；他要把脂肪连同胸肉带来，把胸肉作为摇祭，在耶和华面前摇一摇。
  to: 他要亲手把献给耶和华的火祭带来；他要把脂肪和胸肉带来，在耶和华面前将胸肉作为摇祭摇献。
  rationale: 修订仅提升礼仪术语的庄重性和中文表达的准确度：以“摇献”对应摇祭的礼仪动作，并以并列方式呈现脂肪与胸肉，保留原文关系的适当开放性。
