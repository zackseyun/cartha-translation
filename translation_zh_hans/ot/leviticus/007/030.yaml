base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/030.yaml
  text: 'His own hands shall bring the food offerings of the LORD: he shall bring the fat with the breast, to wave the breast as a wave offering before the LORD.'
translation:
  language: zh_hans
  text: 他要亲手把献给耶和华的火祭带来；他要把脂肪和胸肉带来，在耶和华面前将胸肉作为摇祭摇献。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יָדָיו
  choice: 他要亲手
  rationale: 直译为“他的双手”，在此强调献祭者本人带来祭物；现代汉语用“亲手”自然传达这一强调。
- source_word: אִשֵּׁי יְהוָה
  choice: 献给耶和华的火祭
  rationale: אִשֶּׁה 指在坛火中献上的祭物或部分；“火祭”保留利未记中的祭祀术语，并用“献给”明确所属关系。
- source_word: הַחֵלֶב עַל־הֶחָזֶה
  choice: 脂肪连同胸肉
  rationale: 介词 עַל 在此描述两部分一同带来，而非脂肪在空间上位于胸肉之上；“连同”符合祭礼步骤及上下文。
- source_word: תְּנוּפָה
  choice: 摇祭
  rationale: 采用简明而稳定的礼仪术语，指在耶和华面前作摇献的祭物。
- source_word: לְהָנִיף אֹתוֹ
  choice: 把胸肉……摇一摇
  rationale: 保留动作含义，并按现代汉语调整语序；宾语由紧邻的“胸肉”明确指出。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经传统中广为人知的专名形式。
theological_decisions:
- issue: 献祭者亲自呈上祭物的强调
  choice: 译作“他要亲手……带来”
  alternative: “他的双手要带来”
  rationale: 既保留原文对本人参与的强调，又避免生硬的身体部位主语。
- issue: 脂肪与胸肉的关系
  choice: “脂肪连同胸肉”
  alternative: “胸肉上面的脂肪”
  rationale: 本节随后单独说明摇胸肉，而上下文也将脂肪和胸肉视为一同呈上的不同部分；因此不把 עַל 限定为空间位置。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。“火祭”“摇祭”保留利未记礼仪体系所需的术语一致性；分号呈现原文先总述、后具体说明的结构。
