  text: וְ/זֹ֥את תּוֹרַ֖ת זֶ֣בַח הַ/שְּׁלָמִ֑ים אֲשֶׁ֥ר יַקְרִ֖יב לַ/יהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/011.yaml
  text: This is the law of the sacrifice of peace offerings that one shall present to Yahweh:[a]
translation:
  language: zh_hans
  text: 这是人献给耶和华的平安祭[a]的条例：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“福祉祭”。
    reason: 保留שְׁלָמִים所含完整、安康和福祉的语义范围。
lexical_decisions:
- source_word: וְזֹאת
  choice: 如下
  rationale: וְ衔接上下文，זֹאת引出新的礼仪条例。汉语用句末“如下”自然地标示新段落，也避免添加原文没有的时间性“现在”。
- source_word: תּוֹרַת
  choice: 条例
  rationale: תּוֹרָה在祭司礼仪语境中指规定性的律例或指示；“条例”既保留规范意味，又符合现代汉语礼仪法规的表达。
- source_word: זֶבַח הַשְּׁלָמִים
  choice: 平安祭
  rationale: זֶבַח指宰献的祭，שְׁלָמִים是专门的祭祀术语。“平安祭”是简明且沿用已久的中文名称；该词也包含完整、安康、福祉等意涵，另以脚注说明。
- source_word: אֲשֶׁר יַקְרִיב
  choice: 人献给
  rationale: יַקְרִיב是使役词形，在献祭语境中表示把祭物带近、呈献；第三人称阳性单数在律法中泛指献祭者，故译作不限定性别的“人献给”。
- source_word: לַיהוָה
  choice: 给耶和华
  rationale: 介词ל表示呈献的对象；神名יהוה按其专名译作“耶和华”。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。中文正文采用读者熟悉的专名“耶和华”，不以“主”替代，从而保留其作为盟约之神专名的性质。
- issue: 祭名שְׁלָמִים的语义范围
  choice: 平安祭
  alternative: 福祉祭
  rationale: “平安祭”保留传统术语并能表达平安之意；原词还涉及完整、安康和福祉，因此用脚注保留另一种可能译法，不把其意义收窄为单一的团契观念。
translation_notes:
  register: 采用现代、庄重而简洁的礼仪法规标题句式。“人”表达法律条文中第三人称阳性单数的泛指功能；冒号承接下文具体条例。
