  text: כָּל זָכָ֥ר בַּ/כֹּהֲנִ֖ים יֹאכְלֶ֑/נּוּ בְּ/מָק֤וֹם קָדוֹשׁ֙ יֵאָכֵ֔ל קֹ֥דֶשׁ קָֽדָשִׁ֖ים הֽוּא־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/006.yaml
  text: Every male among the priests may eat it[a]; it shall be eaten in a holy place[b]. It is most holy.
translation:
  language: zh_hans
  text: 祭司中的男子都可以吃这祭物[a]；要在圣洁的地方吃。它是至圣的[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“祭司中的男子都要吃这祭物。”希伯来语形式既可按法规命令理解，也可在本语境中理解为准许享用。
    reason: lexical_alternative
  - marker: b
    text: “至圣的”原文直译为“圣中之圣”，是表示最高圣洁等级的说法。
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל זָכָר בַּכֹּהֲנִים
  choice: 祭司中的男子都
  rationale: 保留כָּל的全称范围、זָכָר所明确表达的男性身份，以及בַּכֹּהֲנִים所表示的群体归属；不将其笼统译为“所有祭司”。
- source_word: יֹאכְלֶנּוּ
  choice: 都可以吃这祭物
  rationale: 此处未完成式用于祭司法中获准享用祭物的规定；“可以吃”自然表达合法资格。“这祭物”明确中性代词所回指的祭物。
- source_word: בְּמָקוֹם קָדוֹשׁ
  choice: 在圣洁的地方
  rationale: 原文“地方”没有冠词，因此不将范围缩窄为某个特定的“圣所”；“圣洁的地方”兼顾准确与现代汉语表达。
- source_word: יֵאָכֵל
  choice: 要……吃
  rationale: 尼法勒式是被动规定，直译为“要被吃”在汉语中生硬；转换成无主语的主动句，仍保留法规所要求的地点限制。
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: 至圣的
  rationale: 这是希伯来语表示最高程度的叠加属格结构，指祭物的最高圣洁等级；“至圣”简洁清楚，也避免把它误解为会幕内的“至圣所”。
- source_word: הוּא
  choice: 它是
  rationale: 该代词回指上文所论的祭物；译出“它”可保留原文独立的判断句。
theological_decisions:
- issue: 食用祭物的资格限于祭司群体中的男性
  choice: 祭司中的男子都可以吃这祭物
  alternative: 所有祭司都可以吃这祭物
  rationale: 原文明说זָכָר“男性”，不可将这项礼仪规定泛化为不分性别的全体祭司。
- issue: יֹאכְלֶנּוּ表达许可还是命令
  choice: 可以吃
  alternative: 要吃／必吃
  rationale: 上下文主要规定谁有资格享用赎愆祭；译作许可较符合其法律功能，同时以脚注保留形式上可作命令理解的可能。
translation_notes:
  register: 采用现代、庄重而易懂的法规语体。“男子”准确表达生理性别而不限定成年身份；“这祭物”使代词指向清楚。“要在圣洁的地方吃”以自然汉语表达原文被动命令。脚注标记均置于其实际所解释的词句之后。
