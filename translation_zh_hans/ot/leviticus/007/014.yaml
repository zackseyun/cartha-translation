  text: וְ/הִקְרִ֨יב מִמֶּ֤/נּוּ אֶחָד֙ מִ/כָּל קָרְבָּ֔ן תְּרוּמָ֖ה לַ/יהוָ֑ה לַ/כֹּהֵ֗ן הַ/זֹּרֵ֛ק אֶת דַּ֥ם הַ/שְּׁלָמִ֖ים ל֥/וֹ יִהְיֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/014.yaml
  text: And from it he shall present one from each offering as a contribution to Yahweh[c][b][a]; it shall belong to the priest who sprinkles the blood of the peace offerings.
translation:
  language: zh_hans
  text: 他要从其中的每样供物取一个，作为献给耶和华的奉献[a]；这要归给那泼洒[b]平安祭[c]牲之血的祭司。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “奉献”或译“举祭”，指从供物中分别出来归给耶和华、并分给祭司的一份。
    reason: lexical_alternative
  - marker: b
    text: “泼洒”也可译作“洒”或“泼”。这里指献祭礼仪中处理祭牲血的动作。
    reason: lexical_alternative
  - marker: c
    text: “平安祭”也可译作“团契祭”或“福祉祭”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרִיב
  choice: 献给
  rationale: 使役形在献祭语境中表示“使之靠近、呈献”；“献给”符合现代汉语表达，并保留礼仪含义。
- source_word: מִמֶּנּוּ
  choice: 从其中
  rationale: 单数代词回指前文作为整体提到的感恩祭及其所带的各类饼；“从其中”在汉语中自然，也不强行判定具体先行词。
- source_word: אֶחָד מִכָּל קָרְבָּן
  choice: 从其中各样供物取一个
  rationale: מִכָּל 在此具有逐类分取的意味，即从前文各类供物中各取一个；补出“取”使汉语句法完整。
- source_word: תְּרוּמָה
  choice: 一份奉献
  rationale: 该词指从整体中分别出来归给上帝、随后分配给祭司的一份；“一份奉献”通俗清楚，脚注保留传统术语“举祭”。
- source_word: לַיהוָה
  choice: 献给耶和华
  rationale: 介词 לְ 在这里标明奉献的归属对象；以“献给”自然表达其奉献方向。
- source_word: הַזֹּרֵק
  choice: 泼洒在坛上
  rationale: זרק 指将祭牲的血抛洒、泼洒于祭坛，不只是细微地喷洒；“泼洒”兼顾动作力度与现代汉语的礼仪表达。“在坛上”由献祭语境明确补出。
- source_word: דַּם הַשְּׁלָמִים
  choice: 平安祭牲的血
  rationale: “平安祭”保留这一传统且可辨识的献祭类别；加“牲”明确这里所说的是祭牲之血。
- source_word: לוֹ יִהְיֶה
  choice: 这要归给……祭司
  rationale: 该结构表达法定归属或份额；“归给”准确而自然。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 耶和华
  alternative: 上主
  rationale: “耶和华”是现代简体中文圣经语境中广为人知的专名译法，能让读者看出原文使用的是神的专名，而非普通称号。
- issue: שְׁלָמִים 的祭类名称
  choice: 平安祭
  alternative: 团契祭；福祉祭
  rationale: “平安祭”是中文读者熟悉的传统祭礼名称，同时不把该祭的含义单独限定为团契或福祉；其他可能含义列入脚注。
- issue: זרק 所描述的血祭动作
  choice: 泼洒在坛上
  alternative: 洒；泼
  rationale: 原词可描述将血抛洒或泼在祭坛上的动作；正文采用“泼洒”以避免把动作理解为轻微点洒，同时不对具体手势作过度规定。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“各样供物取一个”承接上一节所列各类饼；“一份奉献”避免正文使用普通读者难懂的专门术语，同时由脚注保留“举祭”。脚注标记均紧随相关词语。
