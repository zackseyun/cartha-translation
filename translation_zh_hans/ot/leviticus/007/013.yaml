  text: עַל חַלֹּת֙ לֶ֣חֶם חָמֵ֔ץ יַקְרִ֖יב קָרְבָּנ֑/וֹ עַל זֶ֖בַח תּוֹדַ֥ת שְׁלָמָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/013.yaml
  text: Along with cakes of leavened bread[a], he shall present his offering with the sacrifice of his peace offerings of thanksgiving.
translation:
  language: zh_hans
  text: 他要把有酵的饼连同他的供物一同献上，作为他为感谢而献的平安祭[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “平安祭”也可译作“团契祭”或“带来福祉的祭”。
    reason: 保留 שְׁלָמִים 这一祭祀术语的主要译法，并将标记准确置于所说明的术语之后。
lexical_decisions:
- source_word: עַל חַלֹּת לֶחֶם חָמֵץ
  choice: 在……之外……有酵的饼
  rationale: 句首 עַל 在此承接上文，表示这些有酵饼与前述无酵饼一同献上；中文用“在……之外”自然表达附加关系。חַלֹּת לֶחֶם 指饼或饼形食物，חָמֵץ 表示经过发酵，译作“有酵的饼”符合祭祀术语习惯。
- source_word: יַקְרִיב קָרְבָּנוֹ
  choice: 献上……作为他的供物
  rationale: יַקְרִיב 是使之近前、呈献的祭祀用语，קָרְבָּנוֹ 是“他的供物”。此译既保留两词关系，也避免中文重复说“献上他的供物”。
- source_word: זֶבַח
  choice: 祭牲
  rationale: זֶבַח 指经宰杀献上的祭物；“祭牲”在此比泛称“祭”更具体，也能与 קָרְבָּן“供物”区分。
- source_word: תּוֹדַת
  choice: 感谢祭的
  rationale: תּוֹדָה 在这里限定献祭的性质，表示因感谢而献的祭；译作“感谢祭”简洁自然，并与本段祭例相符。
- source_word: שְׁלָמָיו
  choice: 他的平安祭牲
  rationale: שְׁלָמִים 是专门的祭祀类别，含平安、完好及共享筵席等关联。“平安祭”保持关键词的传统连续性；结合 זֶבַח 译为“平安祭牲”。
theological_decisions:
- issue: שְׁלָמִים 的祭祀类别名称
  choice: 平安祭
  alternative: 团契祭；酬恩祭；共享祭
  rationale: 该词的准确侧重点存在讨论。“平安祭”保留其与平安、完整的词源联系，也是在中文圣经语境中易识别的名称；脚注列出其他可行理解，避免把某一神学解释绝对化。
- issue: תּוֹדַת שְׁלָמָיו 的关系
  choice: 感谢祭的平安祭牲
  alternative: 作为感谢祭献上的平安祭牲；感恩性质的平安祭牲
  rationale: 希伯来语连续属格结构较紧凑，表达属于感谢祭这一类型的平安祭牲。正文保留这种修饰关系，不将感谢明确解释为目的、原因或结果。
translation_notes:
  register: 采用现代、庄重而易懂的祭祀法规文体。“有酵的饼”“供物”“祭牲”“平安祭”保持术语清晰；调整语序，使句首的附加关系在中文中自然，同时保留原文“感谢祭—平安祭牲”的紧密关系。
