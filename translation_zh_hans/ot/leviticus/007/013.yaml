    rationale: “他要在感谢祭的平安祭牲之外，献上有酵的饼……作为他的供物”容易把平安祭理解为另一项被排除在外、再加上的祭牲；原文则说有酵饼的供物是连同／附于为感谢而献的平安祭呈献。
  - severity: medium
    issue: 脚注锚点与脚注内容不一致
    rationale: '[a] 置于“有酵的饼”后，但脚注实际讨论 שְׁלָמִים（“平安祭”）的译法。应将标记移至“平安祭”后。'
  - severity: low
    issue: “祭牲”与“平安祭”术语重叠
    rationale: זֶבַח שְׁלָמָיו 在此指“他的平安祭／平安祭祭牲”；中文采用“平安祭”即可，避免“感谢祭的平安祭牲”造成不必要的嵌套和生硬感。
  revised_text: 他要把有酵的饼连同他的供物一同献上，作为他为感谢而献的平安祭[a]。
