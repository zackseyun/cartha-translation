revisions:
- from: 他要在感谢祭的平安祭牲之外，献上有酵的饼[a]作为他的供物。
  to: 他要把有酵的饼连同他的供物一同献上，作为他为感谢而献的平安祭[a]。
  rationale: 修订以“连同……一同献上”对应首个 עַל 的伴随关系，并以“作为他为感谢而献的平安祭”表达第二个 עַל 与 תּוֹדַת שְׁלָמָיו 的关系。此译不把“感谢”过度解释为神学术语层级，同时保留“平安祭”作为一致的技术性祭名。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T04:50:34Z'
review_pass:
  verdict: revise
  source_fidelity: 原文两个 עַל 都表示与感谢平安祭相伴、附属的献上关系。草稿的“在……之外”可勉强表达附加，但将“感谢祭的平安祭牲”前置为参照物，且把“有酵的饼”说成单独“作为他的供物”，弱化了其作为感谢平安祭所附带供物的关系。
  naturalness: “感谢祭的平安祭牲”在现代中文中层层修饰且不够自然；“为感谢而献的平安祭”更清楚、庄重，也较准确地表达 תודה 对平安祭的限定。
  terminology: 保留“有酵的饼”“供物”“平安祭”。זֶבַח 在此不宜另译“祭牲”并与“平安祭”重叠；“平安祭”已足以传达该祭祀类别。脚注须锚定“平安祭”，而不是“有酵的饼”。
