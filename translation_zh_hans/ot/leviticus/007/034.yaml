  terminology: “平安祭”“摇祭”“举祭”均为可辨识且彼此区分的祭祀术语，宜保留。“腿”不擅自补作“右腿”，符合本节希伯来文。“以色列人”作为固定群体称谓自然，脚注说明其字面形式即可。
