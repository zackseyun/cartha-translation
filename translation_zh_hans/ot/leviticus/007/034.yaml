source:
  edition: WLC
  text: כִּי֩ אֶת חֲזֵ֨ה הַ/תְּנוּפָ֜ה וְ/אֵ֣ת שׁ֣וֹק הַ/תְּרוּמָ֗ה לָקַ֨חְתִּי֙ מֵ/אֵ֣ת בְּנֵֽי יִשְׂרָאֵ֔ל מִ/זִּבְחֵ֖י שַׁלְמֵי/הֶ֑ם וָ/אֶתֵּ֣ן אֹ֠תָ/ם לְ/אַהֲרֹ֨ן הַ/כֹּהֵ֤ן וּ/לְ/בָנָי/ו֙ לְ/חָק עוֹלָ֔ם מֵ/אֵ֖ת בְּנֵ֥י יִשְׂרָאֵֽל־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/034.yaml
  text: For I have taken the breast of the wave offering and the thigh of the contribution from the sons of Israel[a], from their sacrifices of peace offerings[c][b], and I have given them to Aaron the priest and to his sons as a permanent statute from the sons of Israel.
translation:
  language: zh_hans
  text: 因为我已从以色列人[a]所献的平安祭[c]中，取了摇祭的胸脯和举祭[b]的腿，赐给祭司亚伦和他的众子，作为从以色列人所得的永远定例。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “以色列人”原文直译为“以色列的众子”，是对以色列群体的常用称呼。
    reason: lexical_alternative
  - marker: b
    text: “举祭”也可译作“奉献物”或“提献”。原词指分别出来献上的一份，也可能带有举起献呈的含义。
    reason: lexical_alternative
  - marker: c
    text: “平安祭”也可译作“团契祭”。
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲזֵה הַתְּנוּפָה
  choice: 作摇祭的胸
  rationale: חֲזֵה指祭牲的胸部，תְּנוּפָה指以摇动方式呈献的特定礼仪；采用简明而沿用已久的祭祀用语，保留两者的关系。
- source_word: שׁוֹק הַתְּרוּמָה
  choice: 作举祭的腿
  rationale: שׁוֹק指祭牲的腿部，可能侧重上腿，但汉语“腿”自然且不作过度解剖限定；תְּרוּמָה在此是分别出来献上的祭物部分，译作传统且易辨识的“举祭”。原文此节没有“右”字，因此不从上下文补入。
- source_word: לָקַחְתִּי
  choice: 我已……取了
  rationale: 完成式在这项法令的说明中表示已经确立的取用，译为“已……取了”保留完成及当前有效的意味。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 这是希伯来语常见的盟约群体称谓；现代汉语用“以色列人”最自然，并以脚注注明字面形式。
- source_word: זִבְחֵי שַׁלְמֵיהֶם
  choice: 所献的平安祭
  rationale: זֶבַח本身含献祭之意，汉语“所献的平安祭”既表达祭献行为，也避免生硬重复为“平安祭的祭物”。
- source_word: וָאֶתֵּן אֹתָם
  choice: 赐给
  rationale: 主语是上帝，法令语境中“赐给”自然表达这些祭物部分被指定归给祭司；宾语由前文直接承接，无须另加代词。
- source_word: לְחָק עוֹלָם
  choice: 作为……永远当守的定例
  rationale: חֹק是法定规例，עוֹלָם表示持续无定期终止；此译兼顾法律效力、持久性和现代汉语可读性。
- source_word: מֵאֵת בְּנֵי יִשְׂרָאֵל
  choice: 作为以色列人永远当守的定例
  rationale: 句末介词短语表示这项供应出自或由以色列人承担；汉语将其自然纳入定例的承担者关系，同时不重复笨拙的“从以色列人”。
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל的群体称谓
  choice: 以色列人
  alternative: 以色列的众子
  rationale: 字面形式是阳性复数“以色列的众子”，但在此作为全体盟约群体的固定称谓，并非特意排除女性；正文采用现代汉语自然称法，脚注保留形式信息。
- issue: שְׁלָמִים这一祭类名称
  choice: 平安祭
  alternative: 团契祭
  rationale: 该词所指祭类的确切名称含义具有讨论空间。“平安祭”保留与שׁלום相关的词义联系和汉语传统术语；脚注列出强调共享与相交层面的另一译法，而不在正文中锁定该解释。
- issue: תְּרוּמָה的礼仪含义
  choice: 举祭
  alternative: 奉献物
  rationale: 该词可泛指分别献上的贡物，在本祭仪语境中又与特定献呈动作相关。“举祭”维持它与“摇祭”的术语区别，脚注说明较宽泛的可能译法。
translation_notes:
  register: 采用现代、庄重而易懂的法律祭仪语体。保留“摇祭、举祭、平安祭”等可辨识的专门术语，但调整希伯来语词序，使中文句子先交代来源，再列明祭司所得部分。未把上下文中的“右腿”补进本节，因为本节原文仅作“腿”。
