revisions:
- from: 因为我已从以色列人[a]所献的平安祭[c]中，取了作摇祭的胸和作举祭[b]的腿，赐给祭司亚伦和他的儿子，作为以色列人永远当守的定例。
  to: 因为我已从以色列人[a]所献的平安祭[c]中，取了摇祭的胸脯和举祭[b]的腿，赐给祭司亚伦和他的众子，作为从以色列人所得的永远定例。
  rationale: 修订恢复句末介词短语的来源意义，表明这些祭司份额是从以色列人而得，而非仅将其表述为以色列人须遵守的条例；并以“胸脯”改善祭牲部位称呼的自然度。“他的众子”明确对应希伯来文复数，未改变其作为祭司家族后裔的通常指称。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T04:51:04Z'
