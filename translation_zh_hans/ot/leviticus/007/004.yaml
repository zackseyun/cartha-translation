base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/004.yaml
  text: and the two kidneys[a], and the fat that is on them, which is on the loins, and the appendage on the liver, which he shall remove with the kidneys.
translation:
  language: zh_hans
  text: 还有两只肾，以及附在其上、位于腰部的脂肪，和肝上的附属物[a]；要把这附属物连同两只肾一起取下。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“肝叶”。这里的希伯来语是一个解剖学术语，确切指什么仍有争议。
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁתֵּי הַכְּלָיֹת
  choice: 两只肾
  rationale: 该词组在献祭解剖语境中明确指动物的两个肾脏；“两只肾”准确而自然。
- source_word: הַחֵלֶב
  choice: 脂肪
  rationale: 在利未记的献祭条例中，该词指献上的特定肥脂部分；“脂肪”是现代汉语中清楚且不过度限定的表达。
- source_word: אֲשֶׁר עֲלֵיהֶן אֲשֶׁר עַל הַכְּסָלִים
  choice: 肾上靠近腰部的
  rationale: 保留两个关系表达的空间含义，同时以自然汉语说明这些脂肪位于肾上、腰部一带，避免把 עַל 过度解释为“覆盖”。
- source_word: הַיֹּתֶרֶת עַל הַכָּבֵד
  choice: 肝上的附属物
  rationale: יֹתֶרֶת 是献祭法规中的技术性解剖词，确切所指仍有争议；“附属物”保留其具体性，又不武断认定为某一肝叶。
- source_word: עַל הַכְּלָיֹת יְסִירֶנָּה
  choice: 要把这附属物连同两只肾一起取下
  rationale: 动词的阴性单数宾语后缀在语法上与“附属物”相应；“连同两只肾一起取下”自然表达该部分与肾一并移除的程序关系。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而清楚的祭祀法规用语。经文承接上一节，故以“还有”起句；分号后的重复指称用于保留希伯来语中阴性单数宾语所指，避免把“取下”不加区分地理解为只支配全部并列成分。
