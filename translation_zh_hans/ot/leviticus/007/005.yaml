base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/005.yaml
  text: The priest shall burn them on the altar as a food offering to Yahweh[b][a]; it is a guilt offering.
translation:
  language: zh_hans
  text: 祭司要把这些放在祭坛上焚烧，作为献给雅威的火祭[a]；这是赎愆祭[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“用火献给雅威的祭物”。原文是献祭术语，指用火献上的祭物。
    reason: lexical_alternative
  - marker: b
    text: 或译“赔偿祭”；传统也称“赎愆祭”。该祭常涉及罪责及相应的补偿。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְטִיר
  choice: 焚烧
  rationale: 该词是קטר的使役形，在献祭语境中指使祭物在坛上焚烧、化为烟气上腾。“焚烧”自然清楚，且祭坛语境已表明这是献祭行为。
- source_word: אֹתָם
  choice: 这些
  rationale: 阳性复数直接宾语代词，回指上文指定的祭物部分；现代汉语用“这些”比孤立的“它们”更自然。
- source_word: הַכֹּהֵן
  choice: 祭司
  rationale: 定冠词加单数名词，指执行礼仪的祭司；中文在法规体中无需另加“那位”。
- source_word: הַמִּזְבֵּחָה
  choice: 放在祭坛上
  rationale: 原文带方向词尾，字面可理解为“向祭坛”，但实际动作是在坛上焚烧；译为“放在祭坛上”符合中文献祭语境。
- source_word: אִשֶּׁה
  choice: 火祭
  rationale: 这是利未记献祭术语，指用火献上的祭物或祭礼。“火祭”简洁保留火的要素；脚注说明其语义，避免把它误解为某一独立祭种。
- source_word: לַיהוָה
  choice: 献给雅威
  rationale: 介词ל表示祭物归献于雅威；“献给”在中文中自然表达奉献和归属。
- source_word: אָשָׁם
  choice: 赎愆祭
  rationale: 该词在利未记中是特定祭类名称，须与חטאת（赎罪祭）区分。“赎愆祭”是较稳定的中文术语，并以脚注补充其赔偿含义及其他译法。
- source_word: הוּא
  choice: 这是
  rationale: 该代词构成判断句，将上述祭物归类为赎愆祭；“这是”符合现代汉语表达。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名יהוה；“雅威”较直接地音译其通常重构的读音，不以称号“主”替代圣约之名。
- issue: 祭祀术语אָשָׁם的译法
  choice: 赎愆祭
  alternative: 赔偿祭
  rationale: “赎愆祭”保留其作为利未记正式祭类的传统名称，并与“赎罪祭”明确区分；“赔偿祭”能凸显相关礼仪中的补偿层面，但可能把该词的含义限缩为赔偿。
translation_notes:
  register: 采用现代、庄重而简洁的法规体。“火祭”和“赎愆祭”保留利未记中的技术术语，并以脚注帮助普通读者理解；分号对应原文后半句的类别判定。
