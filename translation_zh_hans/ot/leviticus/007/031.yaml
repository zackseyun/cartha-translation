  yaml_path: translation/ot/leviticus/007/031.yaml
  text: The priest shall burn the fat on the altar[a], and the breast shall belong to Aaron and to his sons.
translation:
  language: zh_hans
  text: 祭司要把脂肪焚烧在祭坛上[a]；胸肉要归亚伦和他的儿子。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“把脂肪在祭坛上焚烧，使其化为烟。”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְטִיר
  choice: 要……焚烧
  rationale: 希伯来语קטר的使役式在献祭语境中指把祭物焚烧，使其化为烟上升；“焚烧”既自然庄重，也准确表达祭坛上的礼仪行动，烟气含义收入脚注。
- source_word: הַכֹּהֵן
  choice: 祭司
  rationale: כֹּהֵן在祭祀语境中的标准译法；原文为单数。
- source_word: הַחֵלֶב
  choice: 脂肪
  rationale: חֵלֶב在利未记献祭条例中指献在祭坛上的特定脂肪部分；“脂肪”比口语性的“肥油”更准确、稳妥。
- source_word: הַמִּזְבֵּחָה
  choice: 在祭坛上
  rationale: 该词带方向词尾，形式上可理解为“到祭坛那里”；但与הִקְטִיר连用时，实际礼仪动作是在祭坛上焚烧，故译为自然的汉语表达。
- source_word: וְהָיָה
  choice: 要归
  rationale: 字面为“要成为／要是”，在此法律分配语境中表示归属；“要归”清楚传达所分配的祭司份。
- source_word: הֶחָזֶה
  choice: 胸肉
  rationale: חָזֶה在献祭条例中指牲畜划给祭司的胸部肉块；“胸肉”比单说“胸”更清楚地表明祭肉部位。
- source_word: לְאַהֲרֹן וּלְבָנָיו
  choice: 归亚伦和他的子孙
  rationale: 介词ל在此标示归属或分配对象；“归”符合现代汉语法律与礼仪条例的表达。“子孙”在祭司制度语境中自然涵盖亚伦的后裔。
theological_decisions: []
