  yaml_path: translation/ot/leviticus/007/010.yaml
  text: And every grain offering mixed with oil[a], or dry, shall belong to all the sons of Aaron, each alike with his brother.
translation:
  language: zh_hans
  text: 凡用油调和的素祭，或干的素祭，都要归给亚伦的众子；各人所得与弟兄相同。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“各人如同自己的弟兄。”这句希伯来惯用语表示亚伦的众子各人所得相同。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִנְחָה
  choice: 素祭
  rationale: 在利未记的献祭语境中，该词特指以谷物为主要祭物的祭，而非泛指礼物或供物；“素祭”是现代中文圣经语境中通行且简明的名称。
- source_word: בְלוּלָה בַשֶּׁמֶן
  choice: 调油的
  rationale: 被动分词与介词短语说明祭物的制备方式；“调油”自然地表达谷物与油混合，且符合祭礼语体。
- source_word: חֲרֵבָה
  choice: 干的
  rationale: 该形容词与“调油的”形成直接对照；译作“干的”保留原文的简洁和词义空间，不将其明确解释为“没有油的”。
- source_word: לְכָל בְּנֵי אַהֲרֹן תִּהְיֶה
  choice: 都要归给亚伦的众子
  rationale: 介词לְ与动词היה在这里表达归属或分配；“归给”清楚传达祭司所得的份，同时保留“亚伦的众子”这一男性亲属称谓。
- source_word: אִישׁ כְּאָחִיו
  choice: 各人与自己的弟兄均分
  rationale: 该希伯来语分配惯用语强调亚伦众子彼此所得相同；“均分”自然表达法律条文中的平均分配，同时用脚注保留其较直译的比较形式。
theological_decisions:
- issue: 祭司群体的男性亲属称谓
  choice: 亚伦的众子……自己的弟兄
  alternative: 亚伦的后裔……彼此
  rationale: 原文在祭司法规中明确使用阳性亲属词“众子”和“弟兄”；译文保留这一性别明确的措辞，不将其泛化为中性称呼。
- issue: אִישׁ כְּאָחִיו所表达的分配关系
  choice: 均分
  alternative: 各人都和自己的弟兄一样
  rationale: 上下文涉及祭司对素祭的归属，希伯来惯用语在此表达每人所得相同；正文采用自然中文“均分”，脚注列出较贴近字面的译法，避免掩盖原文表达方式。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语，保持祭司法条的简洁句式。“素祭”为中文圣经传统中易于理解的礼仪术语；“干的”保留原文与“调油的”之间的对照；脚注标记置于其所解释的均分语句之后。
