base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/023.yaml
  text: But any sin offering from whose blood some is brought into the tent of meeting to make atonement in the holy place shall not be eaten[a]; it shall be burned with fire.
translation:
  language: zh_hans
  text: 凡赎罪祭[a]，若有一部分血被带进会幕，为要在圣所赎罪，就不可吃，必须用火焚烧。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “赎罪祭”也可译作“洁净祭”；希伯来语 חַטָּאת 在《利未记》中可指处理不洁和罪的祭物。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָל
  choice: 凡
  rationale: 在承接上文的法规中，“凡”自然表达 כָל 的周遍范围；不另译连接词，以符合现代汉语法条式表达。
- source_word: חַטָּאת
  choice: 赎罪祭
  rationale: 此处指祭物而非抽象的“罪”。“赎罪祭”是现代中文读者熟悉的祭祀术语，同时脚注保留“洁净祭”这一可辩护的译法。
- source_word: אֲשֶׁר יוּבָא מִדָּמָהּ
  choice: 若有一些祭牲的血被带进
  rationale: מִן 具有部分义，表明被带进去的是祭牲血中的一部分；补出“祭牲”可避免中文误将代词所指理解为别物。
- source_word: אֶל אֹהֶל מוֹעֵד
  choice: 进会幕
  rationale: “会幕”是 אֹהֶל מוֹעֵד 的通行中文名称，“进”准确表达血被带入其中。
- source_word: לְכַפֵּר
  choice: 为要……赎罪
  rationale: 保留 כפר 在祭司法规中的传统核心术语，又不在译文中限定其作用机制。
- source_word: בַּקֹּדֶשׁ
  choice: 在圣所
  rationale: 指神圣的礼仪空间；“圣所”比抽象的“圣洁之处”自然、明确。
- source_word: לֹא תֵאָכֵל
  choice: 不可吃
  rationale: 简洁保留被动含义及禁令语气，即该祭物不得被食用。
- source_word: בָּאֵשׁ תִּשָּׂרֵף
  choice: 必须用火焚烧
  rationale: “用火焚烧”对应希伯来语的明确表达，“必须”传达法规中的强制语气。
theological_decisions:
- issue: חַטָּאת 在祭司法规中的含义
  choice: 译作“赎罪祭”
  alternative: 洁净祭
  rationale: 上下文清楚表明该词指祭物。“赎罪祭”通行易懂，但“洁净祭”能突出处理礼仪不洁的一面，因此在脚注中保留这一词义选择。
- issue: 被带进圣所之血的范围
  choice: 明确译出“一些……血”
  alternative: 祭牲的血被带进
  rationale: מִדָּמָהּ 中的 מִן 表明部分关系；明确译出可避免让读者误以为全部血都被带入。
- issue: כפר 的礼仪与神学张力
  choice: 译作“赎罪”
  alternative: 除污／施行洁净
  rationale: “赎罪”延续关键术语，并可涵盖此处祭仪功能；不在正文中把该词收窄为某一种特定赎罪理论。
translation_notes:
  register: 采用简洁、庄重的现代标准汉语，保持祭司法规的命令语气；以“凡……若……就……”清楚呈现条件与禁令，并保留关键祭祀术语。
