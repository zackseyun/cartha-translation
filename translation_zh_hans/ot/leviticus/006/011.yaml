  text: כָּל זָכָ֞ר בִּ/בְנֵ֤י אַהֲרֹן֙ יֹֽאכֲלֶ֔/נָּה חָק עוֹלָם֙ לְ/דֹרֹ֣תֵי/כֶ֔ם מֵ/אִשֵּׁ֖י יְהוָ֑ה כֹּ֛ל אֲשֶׁר יִגַּ֥ע בָּ/הֶ֖ם יִקְדָּֽשׁ־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/011.yaml
  text: Every male among the sons of Aaron may eat of it[a]. It is a permanent statute throughout your generations from the food offerings of Yahweh. Whatever touches them shall become holy.
translation:
  language: zh_hans
  text: 亚伦子孙中的一切男丁都可以吃这祭物。这是你们世世代代关于献给耶和华的火祭的永远定例。凡触碰这些祭物的，都必成为圣。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “都必成为圣”也可译作“都必被分别为圣”。希伯来语可表示因接触而进入圣的状态；也有人较严格地理解为，只有已经分别为圣的才可触碰这些祭物。
    reason: 保留末句有关圣洁传递或接触资格的解释张力。
lexical_decisions:
- source_word: כָּל זָכָר
  choice: 一切男丁
  rationale: 准确表达祭司家族中按性别规定的资格；“男丁”比泛称“男人”更符合礼仪法规语境。
- source_word: בִּבְנֵי אַהֲרֹן
  choice: 亚伦子孙中的
  rationale: 保留祭司群体的家族称谓；现代汉语中“子孙”可自然表达由亚伦而出的祭司后裔。
- source_word: יֹאכֲלֶנָּה
  choice: 都可以吃这祭物
  rationale: 在法规语境中表达获准享用祭物的权利；代词所指承接上文，译作“这祭物”以便读者理解。
- source_word: חָק עוֹלָם
  choice: 永远的定例
  rationale: 采用庄重而通行的律法用语，同时保留其持续有效的含义。
- source_word: לְדֹרֹתֵיכֶם
  choice: 你们世世代代
  rationale: 自然表达该规定延续于连续各代。
- source_word: מֵאִשֵּׁי יְהוָה
  choice: 从献给耶和华的火祭中所得的
  rationale: אִשִּׁים 指经火献上的祭物；“火祭”简洁保留祭祀方式，“所得的”使其与祭司可吃的份相衔接，但不额外限定具体份额。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代简体中文圣经读者最熟悉的神名音译。
- source_word: כֹּל אֲשֶׁר יִגַּע בָּהֶם
  choice: 凡触碰这些祭物的
  rationale: 希伯来语未限定触碰者是人还是物；汉语“凡……的”同样保留这种广泛性，“这些祭物”说明复数代词的所指。
- source_word: יִקְדָּשׁ
  choice: 都必成为圣
  rationale: 将动词理解为接触之后进入圣的状态，保留结果性语义，而不把它弱化为单纯许可。
theological_decisions:
- issue: 末句中圣洁是否因接触而传递
  choice: 译作“凡触碰这些祭物的，都必成为圣”，按字面表达接触所带来的成圣结果。
  alternative: 也可能理解为只有已经分别为圣的事物才可接触这些祭物，或接触者因此负有归圣的义务。
  rationale: יִקְדָּשׁ 最自然地表示成为圣，但经文未明说这种圣洁状态在实际礼仪中的全部后果，因此正文保留简洁陈述，并用脚注交代较严格的另一种理解。
translation_notes:
  register: 采用现代、庄重而易懂的律法体中文。“定例”“火祭”“成为圣”保留利未记祭祀法规的关键术语；句式尽量简明，不把末句的人或物范围缩窄。
