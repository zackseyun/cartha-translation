revisions:
- from: 亚伦子孙中的一切男丁都可以吃这祭物。这是你们世世代代永远的定例，是从献给耶和华的火祭中所得的。凡触碰这些祭物的，都必成为圣。[a]
  to: 亚伦子孙中的一切男丁都可以吃这祭物。这是你们世世代代关于献给耶和华的火祭的永远定例。凡触碰这些祭物的，都必成为圣。[a]
  rationale: 修订仅处理第二句的中文句法与原文关系表达：将不完整的“是从……所得的”改为“关于……火祭的”，使其作为持续有效的祭祀条例自然成立，同时不擅自界定可食部分的具体取得方式。其余译文准确、自然，脚注也恰当保留末句的解释歧义。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T04:51:03Z'
review_pass:
  verdict: revise
  source_fidelity: 末句“凡触碰……的，都必成为圣”恰当保留了כֹּל的广泛指涉及יִקְדָּשׁ所表达的接触后成为圣的结果。首句也准确保留亚伦家男性成员享用祭物的资格。原稿中“这是……，是从……所得的”的句法却把“从献给耶和华的火祭中所得的”悬置为对“定例”的说明，不能清楚对应מֵאִשֵּׁי יְהוָה与本条祭祀规定的关联。
  naturalness: 原文整体庄重自然，但“这是你们世世代代永远的定例，是从献给耶和华的火祭中所得的”在现代汉语中结构不顺，且“这是……是……”重复。改为“这是……关于……的永远定例”更清晰、合乎法规文体。
  terminology: “男丁”“定例”“火祭”“耶和华”均符合中文圣经及祭司法规语域。“成为圣”较“成圣”更能避免引入后世神学术语，也忠实呈现状态变化。“触碰”自然且不将触碰者限为人或物。
