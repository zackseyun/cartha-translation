  yaml_path: translation/ot/leviticus/006/004.yaml
  text: Then he shall take off his garments and put on other garments[b][a], and carry the ashes outside the camp to a clean place.
translation:
  language: zh_hans
  text: 随后，他要脱下自己的衣服，穿上别的衣服，把灰烬带到营外洁净的地方。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里的“洁净”是指符合利未记礼仪规定的洁净。
    reason: cultural_note
lexical_decisions:
- source_word: וּפָשַׁט אֶת־בְּגָדָיו
  choice: 然后，他要脱下身上的衣服
  rationale: פשט 在衣着语境中指脱下；用“脱下身上的衣服”自然清楚。句首“然后”表达程序中承接前一步的顺序。
- source_word: וְלָבַשׁ בְּגָדִים אֲחֵרִים
  choice: 换上别的衣服
  rationale: 原文直译为“穿上别的衣服”；“换上”在现代汉语中简洁地涵盖脱下原衣后穿另一套衣服的动作，而“别的衣服”保留 אֲחֵרִים 所表达的区别。
- source_word: וְהוֹצִיא
  choice: 把……搬到
  rationale: יצא 的使役式表示使某物出去，即带出、搬出。因宾语是祭坛灰烬且终点明确，“搬到”自然表达实际移送，不限定具体运载方式。
- source_word: הַדֶּשֶׁן
  choice: 灰烬
  rationale: 此处指燔祭焚烧后从坛上收起的灰烬或残余物；“灰烬”符合上下文，也避免把词源上的肥脂含义过度带入译文。
- source_word: אֶל־מִחוּץ לַמַּחֲנֶה
  choice: 到营外
  rationale: 该短语表示移动至营地范围之外；“到营外”准确而符合现代汉语习惯。
- source_word: אֶל־מָקוֹם טָהוֹר
  choice: 洁净的地方
  rationale: טָהוֹר 在利未记语境中属于礼仪洁净范畴；正文用“洁净”保留原有术语，由脚注提示其礼仪含义。
theological_decisions:
- issue: טָהוֹר 的礼仪洁净含义
  choice: 洁净的地方
  alternative: 礼仪上洁净的地方／清洁的地方
  rationale: “洁净”既直接对应原词，也延续利未记中洁净与不洁净的核心分类；不在正文加入“礼仪上”，以免将解释性限定写入经文，同时用脚注帮助普通读者理解。
translation_notes:
  register: 采用现代、庄重而易懂的程序性表述。“换上”比逐字的“穿上别的衣服”更合乎汉语，但没有增加更换衣服之外的含义。脚注标记置于相关分句之后。
