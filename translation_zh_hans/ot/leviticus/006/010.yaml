    rationale: חֶלְקָם 是“他们的份额”，并由 מֵאִשָּׁי 限定。原译“把它从……中赐给他们作份额”虽可理解，却没有清楚表现“作为他们从我火祭中所得的份额”。
  - severity: low
    issue: “这是至圣的”缺少祭物分类名词
    rationale: קֹדֶשׁ קָדָשִׁים 是最高圣洁等级的祭物分类；“这是至圣之物”在现代汉语中更完整，也避免将“至圣”仅理解为抽象性质。
  - severity: low
    issue: 脚注a的替代译法未充分保留火祭术语的传统表达
    rationale: “献给我的祭物”可以作为宽泛解释，但应同时明确“经火献上的祭物”是与 אִשֶּׁה 对应的传统译法。
