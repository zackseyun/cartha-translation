  to: 不可加酵烘烤。我已把它赐给他们，作为他们从我火祭[a]中所得的份额。这是至圣之物，像赎罪祭和赎愆祭[b]一样。
  rationale: 修订将“他们的份额”及其“从我火祭中”所得的关系明确表达出来，并以“至圣之物”反映祭物的技术性圣洁等级。“火祭”保留正文中的简洁术语，脚注呈现食物祭与经火献上两种译法取向；“赎愆祭”采用较稳定的中文祭祀术语，同时保留现代化及强调赔偿性质的替代译法。
