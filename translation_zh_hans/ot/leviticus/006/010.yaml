  text: לֹ֤א תֵאָפֶה֙ חָמֵ֔ץ חֶלְקָ֛/ם נָתַ֥תִּי אֹתָ֖/הּ מֵ/אִשָּׁ֑/י קֹ֤דֶשׁ קָֽדָשִׁים֙ הִ֔וא כַּ/חַטָּ֖את וְ/כָ/אָשָֽׁם׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/010.yaml
  text: It shall not be baked with leaven[a]. I have given it as their portion from my food offerings. It is most holy[b], like the sin offering and the guilt offering.
translation:
  language: zh_hans
  text: 不可加酵烘烤。我已把它赐给他们，作为他们从我火祭[a]中所得的份额。这是至圣之物，像赎罪祭和赎愆祭[b]一样。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“我的食物祭”；传统译“我经火献上的祭物”。
    reason: lexical_alternative
  - marker: b
    text: 或译“赎过祭”或“赔偿祭”。
    reason: lexical_alternative
lexical_decisions:
- source_word: תֵאָפֶה חָמֵץ
  choice: 加酵烘烤
  rationale: 被动式动词与“酵”连用，表达祭物不得烤成发酵之物；中文用“不可加酵烘烤”既保留律法语气，也不额外限定为某种饼。
- source_word: חֶלְקָם
  choice: 他们的份额
  rationale: 指祭司所得的指定份额；“份额”自然表达所分得的一份，并保留复数所属关系。
- source_word: נָתַתִּי אֹתָהּ
  choice: 我已把它……赐给
  rationale: 完成式表示上帝已经确立、持续有效的赐予；“已……赐给”保留这一法律性授予的语气。
- source_word: מֵאִשָּׁי
  choice: 从献给我的火祭中
  rationale: אִשֶּׁה是献祭术语，通常指经火献上的祭物；译为“火祭”简洁并保留其技术含义，而“献给我的”明确保留第一人称所属。
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: 至圣的
  rationale: 希伯来语叠加强调最高程度的圣洁；“至圣”是简洁、庄重且适合祭物分类的现代汉语表达。
- source_word: כַּחַטָּאת
  choice: 像赎罪祭一样
  rationale: 前缀כ表示比较或同类归属，说明该份祭物与赎罪祭具有相同的至圣等级。
- source_word: וְכָאָשָׁם
  choice: 和赎过祭一样
  rationale: אָשָׁם在此指特定祭类；“赎过祭”比传统“赎愆祭”更易为现代读者理解，同时不把该祭的意义局限于某一理论。
theological_decisions:
- issue: 祭祀术语 אִשֶּׁה 的译法
  choice: 火祭
  alternative: 献给我的祭物／食物祭
  rationale: 该词可能着重祭物经火献上，也可泛指献给上帝的祭物。正文采用较贴近希伯来祭祀术语的“火祭”，脚注保留不突出焚烧方式的译法。
- issue: 祭祀术语 אָשָׁם 的译法
  choice: 赎过祭
  alternative: 赎愆祭／赔偿祭
  rationale: 正文选择现代读者较容易理解的祭名；脚注保留传统名称和突出补偿性质的可能译法，不据此断定单一神学解释。
translation_notes:
  register: 采用现代、庄重的律法体。以“不可”表达禁令，以“至圣”保留祭司制度中的圣洁等级；祭名力求清楚，同时用脚注呈现术语的真实译法差异。
