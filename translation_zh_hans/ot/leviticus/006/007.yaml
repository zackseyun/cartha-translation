  text: וְ/זֹ֥את תּוֹרַ֖ת הַ/מִּנְחָ֑ה הַקְרֵ֨ב אֹתָ֤/הּ בְּנֵֽי אַהֲרֹן֙ לִ/פְנֵ֣י יְהוָ֔ה אֶל פְּנֵ֖י הַ/מִּזְבֵּֽחַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/007.yaml
  text: 'And this is the law of the grain offering: the sons of Aaron shall present it before Yahweh[a], in front of the altar.'
translation:
  language: zh_hans
  text: 这是谷物祭的条例[a]：亚伦的子孙要把它呈献在雅威面前，在祭坛前。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “条例”也可译作“指示”或“规程”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזֹאת
  choice: 这是
  rationale: 此处引出新的礼仪规定；现代汉语不必机械译出句首连接词“和”，用“这是”自然承接上下文。
- source_word: תּוֹרַת
  choice: 关于……的条例
  rationale: 在祭祀律例中，תּוֹרָה指规定具体礼仪程序的训令。“条例”既保留规范性，也比单用“律法”更准确地表达本节语境；其他可能含义以脚注保留。
- source_word: הַמִּנְחָה
  choice: 谷物祭
  rationale: מִנְחָה在利未记的祭祀语境中特指以细面等谷物为主的祭物。“谷物祭”对现代普通读者比传统术语“素祭”更直观，也避免被误解为泛指素食祭品。
- source_word: הַקְרֵב אֹתָהּ
  choice: 要……把它呈献
  rationale: קרב的使役形式在此指把祭物带近并正式呈到祭坛处。“呈献”兼顾接近祭坛与礼仪献呈的含义，同时保留命令性语气。
- source_word: בְּנֵי אַהֲרֹן
  choice: 亚伦的子孙
  rationale: 保留原文以家族身份指称祭司群体的表达；“子孙”在中文中可涵盖亚伦后裔，而不局限于其第一代儿子。
- source_word: לִפְנֵי יְהוָה
  choice: 在雅威面前
  rationale: לִפְנֵי表示处于神的临在中；“在……面前”简洁保留这一礼仪和神学意涵。
- source_word: יְהוָה
  choice: 雅威
  rationale: 原文直接使用四字神名；采用现代中文中通行的音译“雅威”，不以称号替换专名。
- source_word: אֶל־פְּנֵי הַמִּזְבֵּחַ
  choice: 在祭坛前
  rationale: 此语说明呈献祭物的具体空间位置。译作“在祭坛前”，并与“在雅威面前”的临在表达保持区分。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文使用神的专名而非称号。译作“雅威”直接反映该名较普遍接受的发音，也避免用“上主”消除专名性质。
- issue: 祭祀律例中 תּוֹרָה 的语义
  choice: 条例
  alternative: 律法；指示；规程
  rationale: 这里不是泛论整套律法，而是引出谷物祭的规定程序。“条例”保留其权威和规范性质，脚注同时提示“指示”或“规程”的语义可能。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。以“谷物祭”代替容易被当代读者误解的传统术语“素祭”；句式保持简洁，并清楚区分“在雅威面前”与“在祭坛前”两个介词短语。
