  yaml_path: translation/ot/leviticus/006/012.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: zh_hans
  text: 雅威[a]对摩西说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文为“YHWH”（יהוה），是以四个辅音写成的神名；其古代确切读音不能完全确定，常拟读作“雅威”，中文传统多译作“耶和华”，也有译作“耶和华（上主）”或以“主”代称。
    reason: 说明神名的原文形式、读音的不确定性及主要传统译法。
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: 说
  rationale: 该动词在叙事中引出一次发言；现代汉语以“对……说”自然表达这一公式。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文四字神名 YHWH 的常见学术拟音翻译，保留其作为专名的性质，而不以称号替代。
- source_word: אֶל
  choice: 对
  rationale: 在言说结构中标示说话对象，译作“对”符合现代汉语习惯。
- source_word: מֹשֶׁה
  choice: 摩西
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: לֵאמֹר
  choice: 说：
  rationale: 该不定式构成引出直接引语的固定公式；汉语用句末“说：”即可自然承载其功能，无须重复译为“说话，说”。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。译作“雅威”较直接地呈现专名；脚注同时说明其希伯来文形式及中文传统译法，不把有争议的读音说成完全确定。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。把希伯来语“讲话……说”的引语公式合并为汉语常用的“对……说：”，既保留叙事功能，也避免生硬重复。
