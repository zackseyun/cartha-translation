  yaml_path: translation/ot/leviticus/006/016.yaml
  text: And every grain offering of a priest shall be wholly burned[a]; it shall not be eaten.
translation:
  language: zh_hans
  text: 凡祭司所献的素祭，都要全然焚烧[a]，不可吃。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “全然焚烧”所译的希伯来词也可指“全然、完整地归献”；在这里，其实际含义是祭物不可留作食用，而要全数献在坛上。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כָל
  choice: 每一份
  rationale: כָּל与单数名词连用，在这里有逐一分配的含义；中文用“每一份”自然表达“每一个”。句首连接词וְ在本条连续法规中无需机械译作“并且”。
- source_word: מִנְחַת
  choice: 素祭
  rationale: מִנְחָה在《利未记》的祭祀语境中是专门术语，指以细面等为主要祭物的祭，现代中文圣经语体通常称“素祭”。
- source_word: כֹּהֵן
  choice: 祭司所献的
  rationale: 原文构词关系直译为“祭司的素祭”；结合献祭语境译作“祭司所献的”，清楚说明这是祭司献上的素祭，而非祭司所得的份。
- source_word: כָּלִיל תִּהְיֶה
  choice: 都要全部焚烧
  rationale: כָּלִיל表示完整、全然归献，在祭物语境中具有全数焚献的实际含义；תִּהְיֶה在法规中表达规定。此译文既自然，也与下句“不可吃”形成明确对应。
- source_word: לֹא תֵאָכֵל
  choice: 不可吃
  rationale: Nifal未完成式为被动“不可被吃”；现代中文法规表达用“不可吃”简洁自然，仍明确表示禁止食用该祭物。
theological_decisions:
- issue: כָּלִיל是否明说焚烧
  choice: 正文译作“全部焚烧”，并以脚注说明原词首先表示完整、全然归献
  alternative: 都要作为全献
  rationale: 在祭坛献祭的上下文中，כָּלִיל通常指整份祭物全然焚献；下句禁止食用也支持这一实际含义。但希伯来文此处没有另用“焚烧”动词，因此脚注保留其形式上的含蓄和词义幅度。
translation_notes:
  register: 采用现代、庄重而易懂的祭祀法规语体。“素祭”保留《利未记》的传统专门术语；“都要……不可……”体现法律规定的语气。
