  source_fidelity: 草稿正确传达了亚伦及其儿子食用余下祭物、须无酵食用、地点为会幕院子的主要内容。但“剩下的”未明示“其中/它的”这一代词关系；“不可有酵”虽大致表达无酵要求，却较易被理解为地点或过程不得有酵，而非祭物须以无酵状态食用。
  naturalness: “要在圣洁的地方吃，不可有酵”在现代汉语中略显断裂，且“不可有酵”的修饰范围不够清楚。改为“要在圣洁的地方把它作为无酵的吃”可保留原文的被动规定及无酵状态，同时维持律法文本庄重简洁的语体。
  terminology: “亚伦”“会幕”“院子”均合适。“圣洁的地方”可接受，并避免将无冠词的מָקוֹם译成特指“圣所”。应补足说明该短语并非“圣所”的脚注；无酵脚注也应锚定在相应词语上。
