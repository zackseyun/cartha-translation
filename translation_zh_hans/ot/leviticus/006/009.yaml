revisions:
- from: 剩下的，亚伦和他的儿子们要吃[a]。要在圣洁的地方吃，不可有酵[b]；他们要在会幕的院子里吃。
  to: 其中剩下的部分，亚伦和他的儿子要吃[a]。要在圣洁的地方把它作为无酵的吃[b][c]；他们要在会幕的院子里吃它。
  rationale: 修订明示“其中”以对应מִמֶּנָּה，并将无酵要求直接关联到祭物的食用状态，而不把它宽泛地表述为“不可有酵”。末句保留希伯来文重复的“吃它”，并补足有关“圣洁的地方”的必要词汇脚注。
