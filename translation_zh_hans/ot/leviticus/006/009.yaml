  text: וְ/הַ/נּוֹתֶ֣רֶת מִמֶּ֔/נָּה יֹאכְל֖וּ אַהֲרֹ֣ן וּ/בָנָ֑י/ו מַצּ֤וֹת תֵּֽאָכֵל֙ בְּ/מָק֣וֹם קָדֹ֔שׁ בַּ/חֲצַ֥ר אֹֽהֶל מוֹעֵ֖ד יֹאכְלֽוּ/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/009.yaml
  text: What is left of it Aaron and his sons shall eat[a]. It shall be eaten unleavened in a holy place[c][b]; they shall eat it in the court of the tent of meeting.
translation:
  language: zh_hans
  text: 其中剩下的部分，亚伦和他的儿子要吃[a]。要在圣洁的地方把它作为无酵的吃[b][c]；他们要在会幕的院子里吃它。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“余下的部分”或“所剩的”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“作为无酵饼吃”。希伯来文说明祭物须以无酵的状态食用，并未明确限定其形状。
    reason: lexical_alternative
  - marker: c
    text: 希伯来文是“在圣洁的地方”，不是“在圣所”；下一句将该地点具体说明为会幕的院子。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַנּוֹתֶרֶת מִמֶּנָּה
  choice: 剩下的
  rationale: 带冠词的阴性单数分词作名词用，指素祭中余下的部分；“剩下的”自然简洁，而上下文已清楚表明是该祭物所余之物。
- source_word: יֹאכְלוּ
  choice: 要吃
  rationale: 未完成式在律法语境中表达规定；“要吃”保留指令性，也符合现代汉语。
- source_word: אַהֲרֹן וּבָנָיו
  choice: 亚伦和他的儿子们
  rationale: בנים在此指亚伦参与祭司职分的男性后裔，译作“儿子们”比泛指的“儿女”准确。
- source_word: מַצּוֹת תֵּאָכֵל
  choice: 要……吃，不可有酵
  rationale: מַצּוֹת说明祭物须以无酵状态食用；以“不可有酵”表达这一规定，不额外限定为饼、饼块或某种形状。
- source_word: בְּמָקוֹם קָדֹשׁ
  choice: 在圣洁的地方
  rationale: מָקוֹם没有冠词，故不译成特指的“圣所”；后句进一步明确地点为会幕的院子。
- source_word: בַּחֲצַר אֹהֶל מוֹעֵד
  choice: 在会幕的院子里
  rationale: חצר指圣所范围内的院子；“会幕”是现代中文圣经语境中对אֹהֶל מוֹעֵד自然且通行的名称。
- source_word: יֹאכְלוּהָ
  choice: 他们要……吃
  rationale: 保留原文末句对食用规定的重复，不将其合并省略。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的律法文体。“要”传达规定性；用“圣洁的地方”避免把原文无冠词的地点误解为特指的“圣所”，并由后句具体说明为会幕的院子。所有脚注标记均置于正文相应位置。
