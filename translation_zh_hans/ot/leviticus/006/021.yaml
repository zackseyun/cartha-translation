base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/021.yaml
  text: And an earthenware vessel in which it is boiled must be broken; but if it is boiled in a bronze vessel[a], it must be scoured and rinsed with water.
translation:
  language: zh_hans
  text: 煮过祭肉的陶器必须打破；如果是在铜器[a]里煮的，就必须把器皿擦洗干净，再用水冲洗。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“青铜器”。希伯来语 נְחֹשֶׁת 按语境可指铜或青铜。
    reason: lexical_alternative
lexical_decisions:
- source_word: כְלִי חֶרֶשׂ
  choice: 陶器
  rationale: 指陶土制成的器皿；“陶器”简洁自然，并保留与金属器皿在材质上的对比。
- source_word: תְּבֻשַּׁל / בֻּשָּׁלָה
  choice: 煮过／煮的
  rationale: בשׁל在献祭条例中指烹煮，通常尤指水煮；中文用“煮”准确而自然。
- source_word: בּוֹ
  choice: 在……里
  rationale: 保留介词的处所关系，说明祭肉是在该器皿中煮的。
- source_word: יִשָּׁבֵר
  choice: 必须打破
  rationale: 该未完成式在律法语境中表达强制性规定；“必须”清楚传达义务。
- source_word: כְלִי נְחֹשֶׁת
  choice: 铜器
  rationale: נְחֹשֶׁת可指铜或青铜；正文采用较宽泛、自然的“铜器”，脚注保留“青铜器”的可能。
- source_word: וּמֹרַק
  choice: 把器皿擦洗干净
  rationale: מרק表示通过擦洗使其洁净；此译法既体现用力擦洗的动作，也表达彻底清洁的结果。
- source_word: וְשֻׁטַּף בַּמָּיִם
  choice: 再用水冲洗
  rationale: שטף有以水冲洗、漂洗之意；“再”自然显示这是擦洗之后的第二道清洁动作。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的律法用语。“煮过祭肉的陶器”按本段语境补出“祭肉”，使中文所指清楚；原文宾语因上文已知而省略。用“必须”传达条例的约束力，并以“擦洗干净，再用水冲洗”清楚区分连续的两项清洁动作。
