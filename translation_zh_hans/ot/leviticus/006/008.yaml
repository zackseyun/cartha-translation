source:
  edition: WLC
  text: וְ/הֵרִ֨ים מִמֶּ֜/נּוּ בְּ/קֻמְצ֗/וֹ מִ/סֹּ֤לֶת הַ/מִּנְחָה֙ וּ/מִ/שַּׁמְנָ֔/הּ וְ/אֵת֙ כָּל הַ/לְּבֹנָ֔ה אֲשֶׁ֖ר עַל הַ/מִּנְחָ֑ה וְ/הִקְטִ֣יר הַ/מִּזְבֵּ֗חַ רֵ֧יחַ נִיחֹ֛חַ אַזְכָּרָתָ֖/הּ לַ/יהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/008.yaml
  text: And he shall take up from it a handful of the fine flour of the grain offering and some of its oil[a], with all the frankincense that is on the grain offering[b], and he shall burn its memorial portion on the altar as a pleasing aroma to Yahweh.
translation:
  language: zh_hans
  text: 他要从素祭的细面中取出一把[a]，又取一些油，并取素祭上所有的乳香；要把这些作为素祭的记念部分，焚烧在祭坛上，作为献给耶和华、蒙悦纳的香气。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译可作“用他的一把，从其中取出”。原文的动词和名词共同强调从祭物中取出规定的一把。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵרִים מִמֶּנּוּ בְּקֻמְצוֹ
  choice: 他要从素祭中取出一把
  rationale: הֵרִים在此指从祭物中取出指定部分；בְּקֻמְצוֹ表示一手所抓取的量。合译为“取出一把”，自然且保留礼仪动作与分量。
- source_word: מִסֹּלֶת הַמִּנְחָה
  choice: 细面
  rationale: סֹלֶת是用于献祭的精细面粉；上下文已明确所取部分来自素祭，译文以“细面”保持准确而避免累赘。
- source_word: הַמִּנְחָה
  choice: 素祭
  rationale: 在利未记的祭祀语境中，מִנְחָה是以谷物为主要材料的祭，中文传统且简明的术语“素祭”适合此处。
- source_word: וּמִשַּׁמְנָהּ
  choice: 和一些油
  rationale: 重复的介词מִן具有部分义，表示从祭物的油中取一部分，并非取尽全部，因此明确译作“一些油”。
- source_word: וְאֵת כָּל הַלְּבֹנָה אֲשֶׁר עַל הַמִּנְחָה
  choice: 连同素祭上所有的乳香
  rationale: לְבֹנָה特指乳香；כָּל表明乳香要全部包括在焚烧的部分内，与细面和油只取一部分形成对照。
- source_word: וְהִקְטִיר הַמִּזְבֵּחַ
  choice: 焚烧在祭坛上
  rationale: קט״ר在献祭语境中指在坛上焚烧使之成为烟祭；“焚烧在祭坛上”简洁呈现献祭含义。
- source_word: אַזְכָּרָתָהּ
  choice: 素祭的记念部分
  rationale: 这是献祭专门用语，指从整个素祭中取出、在坛上焚烧的代表性部分；“记念部分”既保留词义联系，也表明它只是祭物的一部分。
- source_word: רֵיחַ נִיחֹחַ
  choice: 蒙悦纳的香气
  rationale: 固定祭祀用语表达祭物为上帝所喜悦、接纳；此译避免把重点仅理解为气味本身，同时保留“香气”的原文意象。
- source_word: לַיהוָה
  choice: 献给耶和华
  rationale: 介词לְ表示献祭的对象或方向；“献给”符合本句祭祀语境。יהוה音义传统采用现代中文圣经通行的“耶和华”。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。正文采用普通中文读者熟悉的专名“耶和华”，而不以“主”替代，从而保留其作为立约神名的性质；“雅威”是可能的学术拟音。
- issue: 祭祀用语 רֵיחַ נִיחֹחַ 的含义
  choice: 蒙悦纳的香气
  alternative: 馨香之气
  rationale: 该短语既保留香气意象，也在祭祀语境中传达祭物蒙上帝悦纳；不把它解释成关于献祭机制的特定神学主张。
- issue: אַזְכָּרָתָהּ 的礼仪功能
  choice: 素祭的记念部分
  alternative: 素祭中作为记念的部分
  rationale: 保留“记念”这一词义及其技术性，但不进一步断定这“记念”是使谁记念谁，从而保存原文可能具有的语义张力。
translation_notes:
  register: 采用现代、庄重而易懂的礼仪叙述。“素祭”“祭坛”“乳香”等保留利未记所需的祭祀术语；句法按中文习惯重组，同时保留细面和油取部分、乳香取全部的对比。所有脚注标记均已置于正文对应位置。
