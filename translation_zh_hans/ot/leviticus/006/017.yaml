base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/017.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: zh_hans
  text: 雅威[a]对摩西说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文作“YHWH”（四字神名）；传统常译作“耶和华”。
    reason: 说明神名的原文形式及传统译法。
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: 说
  rationale: 该形式在这里引出一个新的神谕段落。现代汉语用“说”自然准确；句首的连接词不必机械译出，以免造成生硬或过度强调时间先后。
- source_word: יְהוָה
  choice: 雅威
  rationale: 这是上帝名字四字神名 YHWH 的音译，保留原文所用的专名，而不以称号替代。
- source_word: אֶל
  choice: 对
  rationale: 在“对某人说”的结构中，“对”是自然的现代汉语表达。
- source_word: מֹשֶׁה
  choice: 摩西
  rationale: 采用该人名通行的现代汉语译名。
- source_word: לֵאמֹר
  choice: 说：
  rationale: 该词用于引出随后直接引语。汉语以“说：”即可自然表达，无须重复译作“说道”。
theological_decisions:
- issue: 如何翻译神名 יְהוָה
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名 YHWH。“雅威”较贴近其通常拟定的读音，并保留这是专名这一点；脚注说明传统译法，以免读者混淆。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。将神名置于句首，并用冒号承接后续直接引语。
