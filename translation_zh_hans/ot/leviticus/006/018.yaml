base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/018.yaml
  text: 'Speak to Aaron and to his sons[a], saying, ‘This is the law of the sin offering: in the place where the burnt offering is slaughtered, the sin offering shall be slaughtered before Yahweh. It is most holy.’'
translation:
  language: zh_hans
  text: “你要对亚伦和他的儿子们说：‘赎罪祭[a]的条例是这样：在宰燔祭牲的地方，要在雅威面前宰杀赎罪祭牲；这祭是至圣的。’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“洁净祭”。希伯来语 חַטָּאת 既可指罪，也可指为除去罪污、使人或物得洁净而献的祭。
    reason: 保留该祭名在罪与礼仪洁净之间的词义幅度。
lexical_decisions:
- source_word: דַּבֵּר אֶל אַהֲרֹן וְאֶל בָּנָיו לֵאמֹר
  choice: 你要对亚伦和他的儿子们说
  rationale: 以自然的现代汉语保留命令式和引出直接引语的立法公式；“你要……说”体现 דַּבֵּר 的指令语气。
- source_word: זֹאת תּוֹרַת הַחַטָּאת
  choice: 赎罪祭的条例如下
  rationale: 在祭祀法规中，תּוֹרָה 指具体的礼仪条例或规章；“条例如下”比逐字译作“这是……的律法”更符合现代汉语，同时保留正式法令语体。חַטָּאת 在此指祭物，译作传统且易懂的“赎罪祭”。
- source_word: בִּמְקוֹם אֲשֶׁר תִּשָּׁחֵט הָעֹלָה
  choice: 在宰燔祭牲的地方
  rationale: שׁחט 是祭祀语境中的宰杀；补出“牲”使“宰燔祭牲”在汉语中清楚自然，也表明所宰的是祭牲。
- source_word: תִּשָּׁחֵט הַחַטָּאת
  choice: 要……宰赎罪祭牲
  rationale: 未完成式在法规语境中表达规定或义务，以“要”传达规范性；再次补出“牲”，避免把抽象祭礼本身说成被宰。
- source_word: לִפְנֵי יְהוָה
  choice: 在雅威面前
  rationale: לִפְנֵי 表示在某位面前或临在之中；“在雅威面前”保留祭仪和盟约语境，并直接音译神名 יְהוָה。
- source_word: קֹדֶשׁ קָדָשִׁים הִוא
  choice: 这祭是至圣的
  rationale: קֹדֶשׁ קָדָשִׁים 是希伯来语最高级表达，指祭物的最高神圣等级；“至圣”简洁、庄重。“这祭”明确阴性代词 הִוא 所指的是赎罪祭。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名。采用“雅威”以呈现其专名性质，而不以称号替代；这也符合所给审校层的决定。
- issue: חַטָּאת 的祭祀含义
  choice: 赎罪祭
  alternative: 洁净祭
  rationale: 该词既关联罪，也可突出除污、洁净的礼仪功能。“赎罪祭”是现代中文读者较熟悉的祭名，但用脚注保留“洁净祭”这一有根据的译法，以免消除原词的语义张力。
translation_notes:
  register: 采用现代、庄重而易懂的法规语体。保留祭祀专门用语“燔祭”“赎罪祭”“至圣”，并用“祭牲”澄清被宰杀的是祭物。
