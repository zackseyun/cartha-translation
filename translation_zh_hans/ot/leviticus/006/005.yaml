revisions:
- from: 坛上的火要在坛上持续燃烧，不可熄灭。祭司每天早晨[a]都要往火上添柴，把燔祭摆在火上，并把平安祭[b]的脂肪烧在火上。
  to: 坛上的火要持续燃烧，不可熄灭。祭司每天早晨[a]都要在坛上添柴，把燔祭摆在坛上，并在坛上焚烧平安祭[b]的脂肪部分。
  rationale: 修正三个地点短语的所指，使其一致回指“祭坛”，并将“脂肪”明确为祭祀语境中的“脂肪部分”。保留原有祭礼术语、每日重复的时间意义及明确的禁令语气。
