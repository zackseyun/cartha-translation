review_pass:
  verdict: revise
  source_fidelity: 草稿将后文三次指向祭坛的介词短语处理为“火上”。希伯来文的 עָלֶיהָ 均以阴性代词指向 מִזְבֵּחַ（祭坛），而非阴性的“火”；因此燔祭和脂肪部分应摆放、焚烧在坛上。首句“坛上的火……在坛上”虽可理解，但重复且不够自然。
  naturalness: “添柴”“燔祭”“平安祭”均自然且符合庄重的祭礼法规语体。改为反复使用“在坛上”，既消除指代歧义，也准确表达动作地点。
  terminology: “燔祭”对应 עֹלָה，“平安祭”对应 שְׁלָמִים，均为通行、稳定的中文祭礼术语。“脂肪部分”比单数泛称“脂肪”更明确对应 חֶלְבֵי 所指献于坛上的脂肪部分。
  issues:
  - severity: high
    issue: “把燔祭摆在火上，并把平安祭的脂肪烧在火上”误译动作地点。
    rationale: 原文中“在其上”的三个阴性代词均回指阴性名词“祭坛”（מִזְבֵּחַ），不是阳性名词“火”（אֵשׁ）。这不是仅仅文体问题，而是原文指代和礼仪动作地点的偏移。
  - severity: low
    issue: 首句“坛上的火要在坛上持续燃烧”重复使用“坛上”。
    rationale: 可保留原文强调坛火持续燃烧的意义，同时以“坛上的火要持续燃烧”表达得更符合现代汉语。
