source:
  edition: WLC
  text: וְ/הָ/אֵ֨שׁ עַל הַ/מִּזְבֵּ֤חַ תּֽוּקַד בּ/וֹ֙ לֹ֣א תִכְבֶּ֔ה וּ/בִעֵ֨ר עָלֶ֧י/הָ הַ/כֹּהֵ֛ן עֵצִ֖ים בַּ/בֹּ֣קֶר בַּ/בֹּ֑קֶר וְ/עָרַ֤ךְ עָלֶ֨י/הָ֙ הָֽ/עֹלָ֔ה וְ/הִקְטִ֥יר עָלֶ֖י/הָ חֶלְבֵ֥י הַ/שְּׁלָמִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/005.yaml
  text: And the fire on the altar shall be kept burning on it[a]; it shall not go out. The priest shall burn wood on it every morning[b], and he shall arrange the burnt offering on it and burn up on it the fat portions of the peace offerings.
translation:
  language: zh_hans
  text: 坛上的火要持续燃烧，不可熄灭。祭司每天早晨[a]都要在坛上添柴，把燔祭摆在坛上，并在坛上焚烧平安祭[b]的脂肪部分。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“早晨又早晨”，表示“每天早晨”或“逐日清晨”。
    reason: 说明希伯来语重复形式所表达的分配意义。
  - marker: b
    text: “平安祭”也可译作“福祉祭”或“团契祭”。
    reason: 保留 שְׁלָמִים 在平安、福祉和共同分享方面的词义幅度。
lexical_decisions:
- source_word: תּוּקַד
  choice: 持续燃烧
  rationale: 该词为 יקד 的使役被动式，语境强调坛火须维持在燃烧状态；“持续燃烧”自然地表达这一持续性要求。
- source_word: בּוֹ
  choice: 在坛上
  rationale: 所指为祭坛；汉语用“在坛上”比机械直译为“在其中”更符合献祭场景。
- source_word: לֹא תִכְבֶּה
  choice: 不可熄灭
  rationale: 既保留律法指令的语气，也明确说明坛火不得中断。
- source_word: וּבִעֵר ... עֵצִים
  choice: 往火上添柴
  rationale: 按上下文，祭司不是重新点火，而是每日加柴维持坛火；此译法比“焚烧木柴”更自然、准确。
- source_word: בַּבֹּקֶר בַּבֹּקֶר
  choice: 每天早晨
  rationale: “早晨”重复使用，表达逐日、反复的分配意义；“每天早晨”是现代汉语的自然说法。
- source_word: וְעָרַךְ
  choice: 摆在
  rationale: 该动词在献祭语境中表示按次序安放祭物；“摆在”简洁自然，而既定的礼仪秩序由语境体现。
- source_word: הָעֹלָה
  choice: 燔祭
  rationale: “燔祭”是现代中文圣经及宗教语境中辨识度高的固定祭礼名称，能清楚区别这一祭类。
- source_word: וְהִקְטִיר
  choice: 烧
  rationale: 该使役式在祭祀语境中指使祭物焚烧而化为烟；正文以自然的“烧”表达，避免加入原文未明说的解释性措辞。
- source_word: חֶלְבֵי
  choice: 脂肪
  rationale: 这里特指献祭时焚烧的脂肪部分，并非泛指“上好部分”；“脂肪”准确而易懂。
- source_word: הַשְּׁלָמִים
  choice: 平安祭
  rationale: 这是中文中通行且易识别的祭礼名称；词义亦可从福祉或团契角度表达，故以脚注保留其他可能译法。
theological_decisions:
- issue: 献祭专用术语的译法
  choice: 采用通行的“燔祭”和“平安祭”
  alternative: 采用较贴近词源的“升献祭”及“福祉祭／团契祭”
  rationale: 本节属于祭礼法规，清楚区分祭物类别十分重要。采用通行术语可保持可读性与类别连续性，同时用脚注保留 שְׁלָמִים 的其他语义侧面，不把某一种神学解释定为唯一含义。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。保留律法指令的明确语气，以“添柴”呈现维持坛火的实际动作；避免古奥句式和宗派化解释。
