base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/019.yaml
  text: The priest who makes atonement with it shall eat it. It shall be eaten in a holy place[a], in the court of the tent of meeting.
translation:
  language: zh_hans
  text: 献这赎罪祭的祭司[a]要吃这祭物。这祭物要在圣处吃，就是在会幕的院子里。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“主持这赎罪祭礼仪的祭司”。这里的希伯来语分词可专指办理赎罪祭的礼仪，也带有“除罪／洁净”的词义色彩。
    reason: 保留该祭祀专门用语在“献作赎罪祭”与主持除罪／洁净礼仪之间的词义张力，同时维持原文中动词与“这祭物”的直接关系。
lexical_decisions:
- source_word: הַכֹּהֵן
  choice: 祭司
  rationale: כֹּהֵן在利未记祭祀条例中通常指履行礼仪职责的祭司；定冠词所表达的特指由上下文和“的”字结构自然体现。
- source_word: הַמְחַטֵּא אֹתָהּ
  choice: 献这赎罪祭的
  rationale: חטא的Piel分词在祭祀语境中可指主持赎罪祭、把祭物献作赎罪祭。“献这赎罪祭”在现代汉语中清楚自然，同时以脚注保留“用它除罪”的词义可能。
- source_word: יֹאכֲלֶנָּה
  choice: 要吃这祭物
  rationale: 未完成式在律法条文中表达规定。“要”自然传达规范语气；宾语按语境译为“这祭物”，避免汉语代词指向含混。
- source_word: בְּמָקוֹם קָדֹשׁ
  choice: 在圣处
  rationale: 直译为“在一个圣洁的地方”不合现代汉语祭祀语域；“圣处”简洁庄重，也未把它专名化为至圣所或圣所。
- source_word: תֵּאָכֵל
  choice: 这祭物要……吃
  rationale: 尼法勒未完成式是被动规定。汉语用受事主语“这祭物”保留原文焦点，而不采用生硬的“被吃”。
- source_word: בַּחֲצַר אֹהֶל מוֹעֵד
  choice: 在会幕的院子里
  rationale: “会幕”是אֹהֶל מוֹעֵד通行且准确的中文译法；“院子”自然表达חָצֵר所指的围院。
theological_decisions:
- issue: חטא的Piel分词在祭祀条例中的含义
  choice: 正文译为“献这赎罪祭的祭司”
  alternative: “用这祭物除罪的祭司”或“用它行洁净礼的祭司”
  rationale: 此处专门语义可指祭司主持赎罪祭礼仪，也保留“除罪／洁净”的词源色彩。正文采用较易懂的祭祀义，脚注说明另一可能，以免把词义限缩为某一种赎罪理论。
- issue: 阴性代词的所指
  choice: 按语境译为“这祭物”
  alternative: 形式上重复为“它”
  rationale: 希伯来语阴性代词回指阴性名词所代表的祭牲或祭物。现代汉语不需复制语法性别；明说“这祭物”更清楚，也不改变其所指。
- issue: “圣处”与会幕院子的关系
  choice: 用“就是”说明圣处在本条中具体指会幕院子
  alternative: 仅以逗号并列两个地点短语
  rationale: 后一个地点短语具体说明规定的进食地点，并非另加第二个地点；“就是”使现代读者容易把握这一关系，又不将“圣处”扩大为特定殿室。
translation_notes:
  register: 采用现代、庄重而易懂的律法条文语体。“要”表达规范性要求；“圣处”“会幕”沿用读者熟悉的祭祀术语。避免生硬复制希伯来语被动式，同时保留祭物作为句子焦点。
