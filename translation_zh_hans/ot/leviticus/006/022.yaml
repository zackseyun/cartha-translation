  text: כָּל זָכָ֥ר בַּ/כֹּהֲנִ֖ים יֹאכַ֣ל אֹתָ֑/הּ קֹ֥דֶשׁ קָֽדָשִׁ֖ים הִֽוא־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/022.yaml
  text: Every male among the priests may eat it[a]; it is most holy.
translation:
  language: zh_hans
  text: 祭司中的每个男子都可以吃它；它是至圣之物[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“圣中之圣”，是表示最高程度的惯用说法。
    reason: 说明希伯来语的最高级惯用结构，并保留原文措辞信息。
lexical_decisions:
- source_word: כָּל
  choice: 每个
  rationale: 与单数名词“男子”连用时表达逐一分配的意义，即祭司群体中的每一个男子。
- source_word: זָכָר
  choice: 男子
  rationale: 原词明确指男性；“男子”在礼仪资格语境中准确而自然，也不把含义泛化为一般的“人”。
- source_word: בַּכֹּהֲנִים
  choice: 祭司中的
  rationale: 介词在这里表示属于祭司群体，译为“祭司中的”自然地保留群体成员关系。
- source_word: יֹאכַל
  choice: 可以吃
  rationale: 未完成式在这段律法语境中表示获准进行的行为；“可以吃”强调许可，不误解为每位祭司都必须吃。
- source_word: אֹתָהּ
  choice: 它
  rationale: 阴性代词回指上文所说的祭物；现代汉语用“它”即可，无须在正文中补出原文未重复的“祭物”。
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: 至圣的
  rationale: 这是希伯来语以重复名词表达最高程度的惯用结构；“至圣的”准确传达最高等级的圣洁，并避免使人误以为指一个称为“至圣所”的空间。
- source_word: הִוא
  choice: 这是
  rationale: 该阴性代词与所指对象在希伯来语中保持性别一致；汉语用“这是”引出判断句，表达自然。
theological_decisions:
- issue: יֹאכַל在祭司法例中的情态
  choice: 译作“可以吃”，理解为许可
  alternative: 译作“要吃”或“必吃”，理解为命令
  rationale: 上下文规定谁有资格食用至圣祭物，重点是准许范围，而不是要求每一个合资格者都实际食用。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“祭司中的每个男子”保留原文逐一分配的表达；“至圣的”符合现代中文宗教语境，同时脚注交代希伯来语原有的强调结构。
