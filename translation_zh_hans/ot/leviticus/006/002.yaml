  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: צַ֤ו אֶֽת אַהֲרֹן֙ וְ/אֶת בָּנָ֣י/ו לֵ/אמֹ֔ר זֹ֥את תּוֹרַ֖ת הָ/עֹלָ֑ה הִ֣וא הָ/עֹלָ֡ה עַל֩ מוֹקְדָ֨ה עַל הַ/מִּזְבֵּ֤חַ כָּל הַ/לַּ֨יְלָה֙ עַד הַ/בֹּ֔קֶר וְ/אֵ֥שׁ הַ/מִּזְבֵּ֖חַ תּ֥וּקַד בּֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/002.yaml
  text: 'Command Aaron and his sons[a], saying, This is the law of the burnt offering: the burnt offering itself shall remain on its hearth on the altar all night until the morning[b], and the fire of the altar shall be kept burning on it.'
translation:
  language: zh_hans
  text: 你要吩咐亚伦和他的儿子们说：“燔祭的条例[a]如下：燔祭要在祭坛的焚烧处[b]整夜留到早晨；祭坛的火要持续燃烧。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “条例”也可译作“指示”或“规例”。
    reason: lexical_alternative
  - marker: b
    text: “焚烧处”指祭坛上燃烧祭物的地方或火床。
    reason: lexical_clarification
lexical_decisions:
- source_word: צַו
  choice: 吩咐
  rationale: 这是צוה的命令式，表示直接下令。“吩咐”在现代汉语中既保留权威性，也适合上帝向摩西颁布祭司礼仪命令的语境。
- source_word: אַהֲרֹן וְאֶת־בָּנָיו
  choice: 亚伦和他的儿子们
  rationale: 按祭司语境具体译出בנים为“儿子们”，不泛化为“子女”。
- source_word: זֹאת תּוֹרַת הָעֹלָה
  choice: 燔祭的条例如下
  rationale: תּוֹרָה在此指规范某项祭礼的正式规章；“条例”自然、庄重，也避免让读者误以为这里专指整部摩西律法。
- source_word: הָעֹלָה
  choice: 燔祭
  rationale: 这是עֹלָה在汉语圣经及祭祀语境中的通行术语，指祭物全部焚烧献上的祭。
- source_word: הִוא הָעֹלָה
  choice: 燔祭
  rationale: 希伯来语以代词加重复名词突出本祭物。汉语若直译为“它就是燔祭”容易误解，因此在条例标题之后重复“燔祭”，保留指称并使行文自然。
- source_word: עַל מוֹקְדָה עַל הַמִּזְבֵּחַ
  choice: 在祭坛的焚烧处
  rationale: מוֹקְדָה指燃烧之处或火床；“焚烧处”保留具体空间意象，也不擅自将其解释为柴堆。
- source_word: כָּל הַלַּיְלָה עַד הַבֹּקֶר
  choice: 整夜留到早晨
  rationale: 忠实表达祭物从夜间一直留置至早晨的持续时段。
- source_word: וְאֵשׁ הַמִּזְבֵּחַ תּוּקַד בּוֹ
  choice: 祭坛上的火要在坛上保持燃烧
  rationale: תּוּקַד的使役被动形态表示火须被维持，而不只是陈述火正在燃烧。בּוֹ最自然地回指阳性名词“祭坛”，故明确译作“在坛上”。
theological_decisions:
- issue: 祭祀法规中תּוֹרָה的译法
  choice: 条例
  alternative: 律法；指示；规例
  rationale: 此处是针对燔祭的具体祭礼规范。“条例”保留法律和礼仪的正式语气，同时不把该词扩大解释为整部律法。
- issue: 祭坛之火的命令性质
  choice: 要在坛上保持燃烧
  alternative: 要在坛上燃烧
  rationale: 希伯来语动词形态强调火应当受到维持；译出“保持”可保留祭司持续照管祭坛之火的规范性含义。
- issue: בּוֹ所指对象
  choice: 明确回指祭坛
  alternative: 含混译作“在其上”，或理解为焚烧处
  rationale: 后缀为阳性单数，与阳性的“祭坛”相符，而“焚烧处”在现有形态下为阴性，因此正文采用最自然的语法回指。
translation_notes:
  register: 采用现代、庄重而清楚的祭礼法规文体。“吩咐”保留命令力度；“条例如下”符合现代汉语规范文本的表达。正文避免生硬照搬希伯来语名词句，同时未补入原文没有明说的“柴”或“不断”等细节。
