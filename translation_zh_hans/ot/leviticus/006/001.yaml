base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/001.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: zh_hans
  text: 雅威[a]对摩西说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文为“YHWH”（四字神名）；传统上也译作“耶和华”，或以“主”代称。
    reason: 说明神名的原文形式及传统译法。
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: 对……说
  rationale: 该动词连同叙事性连接形式引出下一段话。现代汉语以“对……说”自然表达发言事件；不另译“于是”，以免过度强调时间顺序。
- source_word: יְהוָה
  choice: 雅威
  rationale: 这是以色列上帝的四字神名 YHWH。采用现代汉语中较接近通常学术重构读音 Yahweh 的音译“雅威”，保留其作为专名的性质，不以称号替代。
- source_word: אֶל
  choice: 对
  rationale: 在言说结构中标明话语所指向的对象；“对摩西说”符合现代汉语习惯。
- source_word: מֹשֶׁה
  choice: 摩西
  rationale: 采用现代汉语中通行的人名译法。
- source_word: לֵאמֹר
  choice: 说：
  rationale: 这是引出随后直接引语的固定表达。汉语用“说：”并以冒号承接下一节的话，既自然又保留其篇章功能。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名，而非表示“主”的称号。正文以“雅威”音译，保留专名；脚注交代传统译法和代称，避免把文本中的神名无声地改为称号。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。“雅威对摩西说”避免了“吩咐”可能附加的命令意味；句末冒号表明讲话内容将在下一节继续。
