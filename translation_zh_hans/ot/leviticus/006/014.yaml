  - severity: low
    issue: “使香气蒙雅威喜悦”不够自然，并稍微扩展了固定祭祀语的句法关系。
    rationale: “献给雅威，作怡人的香气”更贴近לַיהוה与ריח ניחח的排列，并保持中文祭祀语体。
