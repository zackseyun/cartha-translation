id: LEV.6.14
reference: Leviticus 6:14
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: עַֽל מַחֲבַ֗ת בַּ/שֶּׁ֛מֶן תֵּעָשֶׂ֖ה מֻרְבֶּ֣כֶת תְּבִיאֶ֑/נָּה תֻּפִינֵי֙ מִנְחַ֣ת פִּתִּ֔ים תַּקְרִ֥יב רֵֽיחַ נִיחֹ֖חַ לַ/יהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/014.yaml
  text: On a griddle with oil it shall be made[a], well mixed; you shall bring it in baked pieces, a grain offering broken into pieces[c][b], and present it as a pleasing aroma to Yahweh.
translation:
  language: zh_hans
  text: 这祭物要在煎盘上用油调制，调和后带来；你要把烤制成块的素祭献给雅威，作怡人的香气。[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “用油”也可译作“在油中”。
    reason: lexical_alternative
  - marker: b
    text: 译作“烤制的”的希伯来词十分罕见，可能指烤制的祭物，或指在煎盘上烤制的制法。
    reason: lexical_alternative
  - marker: c
    text: “怡人的香气”是祭祀中的固定表达，表示所献的祭物蒙雅威悦纳。
    reason: cultural_note
lexical_decisions:
- source_word: מַחֲבַת
  choice: 煎盘
  rationale: 指制作素祭所用的平底烹饪器具；“煎盘”比泛称的“锅”更具体，也适合现代汉语。
- source_word: בַּשֶּׁמֶן
  choice: 用油
  rationale: 介词可表示“在油中”或“用油”；正文采用自然的工具性表达，并以脚注保留另一种理解。
- source_word: תֵּעָשֶׂה
  choice: 调制
  rationale: 此处是עשה的被动式，描述祭物的制作；汉语祭物制作语境中，“调制”比直译“被做成”自然。
- source_word: מֻרְבֶּכֶת
  choice: 充分搅匀
  rationale: 该词描述面与油混合调和的状态；译法保持烹调语境，同时避免断定更具体但不确定的工序。
- source_word: תְּבִיאֶנָּה
  choice: 拿来
  rationale: 动词意为“带来”，阴性后缀所指为祭物；“拿来”在中文指令中清楚自然。
- source_word: תֻּפִינֵי
  choice: 烤熟的碎块
  rationale: 这是罕见的烹饪用语，大概与烘烤后的成品或份块有关；正文结合后面的פִּתִּים译出，并用脚注说明不确定性。
- source_word: מִנְחַת פִּתִּים
  choice: 这素祭做成……碎块
  rationale: מִנְחָה在本段指谷物类祭物，按惯用译作“素祭”；פִּתִּים表示分成的块，中文重组语序以免生硬。
- source_word: תַּקְרִיב
  choice: 献上
  rationale: קרב的使役式在祭祀语境中指把祭物呈献到神面前；“献上”兼具准确性与庄重感。
- source_word: רֵיחַ נִיחֹחַ
  choice: 使香气蒙……喜悦
  rationale: 这是祭祀中的固定表达，表明祭物的香气令神喜悦；此译自然传达其功能，同时由脚注说明礼仪含义。
- source_word: לַיהוָה
  choice: 雅威
  rationale: 按希伯来语专名יהוה音译为“雅威”，保留经文中的盟约之名。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；音译“雅威”保留其专名性质，不把它改成称号。
- issue: 祭祀套语רֵיחַ נִיחֹחַ的含义
  choice: 使香气蒙雅威喜悦
  alternative: 献给雅威的馨香；安抚的香气
  rationale: 译文保留“香气”和“喜悦”两层含义，不把该表达粗陋地理解为神只是在享受气味；脚注说明它也传达祭物蒙悦纳的礼仪含义。
- issue: 罕见词תֻּפִינֵי的具体所指
  choice: 烤熟的碎块
  alternative: 烤熟的份；烘烤之物
  rationale: 上下文明确涉及烹制及分块，但该词本身罕见；正文给出最可能且可读的表达，脚注保留词义的不确定性。
translation_notes:
  register: 采用现代、庄重而易懂的祭祀指令语体。“素祭”为利未记中מִנְחָה的通行中文术语；语序按汉语重组，但保留制作、拿来、献上以及蒙神喜悦的动作层次。
