revisions:
- from: 要在煎盘上用油[a]调制，充分搅匀后拿来；要把这素祭做成烤熟的碎块[b]献上，使香气蒙雅威喜悦[c]。
  to: 这祭物要在煎盘上用油调制，调和后带来；你要把烤制成块的素祭献给雅威，作怡人的香气。[a][b][c]
  rationale: 修订将罕见词תֻּפִינֵי所表达的烹制概念与פִּתִּים的“成块”分开，避免词义重叠和不当确定；同时调整语序及祭祀套语，使现代标准汉语更自然庄重，并保留原文的歧义与脚注锚点。
