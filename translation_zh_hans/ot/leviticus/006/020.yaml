  text: כֹּ֛ל אֲשֶׁר יִגַּ֥ע בִּ/בְשָׂרָ֖/הּ יִקְדָּ֑שׁ וַ/אֲשֶׁ֨ר יִזֶּ֤ה מִ/דָּמָ/הּ֙ עַל הַ/בֶּ֔גֶד אֲשֶׁר֙ יִזֶּ֣ה עָלֶ֔י/הָ תְּכַבֵּ֖ס בְּ/מָק֥וֹם קָדֹֽשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/020.yaml
  text: Anything that touches its flesh shall become holy[a], and if any of its blood is spattered on a garment, you shall wash that on which it was spattered in a holy place.
translation:
  language: zh_hans
  text: 凡接触祭牲的肉的，都将成为圣；若有它的血溅[a]在衣服上，你要在圣处洗那件被血溅到的衣服。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“洒”。希伯来语动词可指礼仪性地洒血；这里因血落在衣服上，并须随后洗衣，正文译作“溅”。
    reason: 保留נזה在此处可作礼仪性“洒血”理解的词义选择。
lexical_decisions:
- source_word: כֹּל אֲשֶׁר
  choice: 凡……的，都
  rationale: 这是概括一切相关对象的不定表达；汉语“凡……的，都”自然保留其广泛范围，不擅自限定为人或物。
- source_word: יִגַּע בִּבְשָׂרָהּ
  choice: 接触这祭牲之肉
  rationale: בָּשָׂר直指祭物的肉体；“祭牲之肉”既保留祭祀语境，也比单说“肉”更清楚。
- source_word: יִקְדָּשׁ
  choice: 将成为圣
  rationale: 该动词在此表示因接触而进入圣的状态；“成为圣”保留状态变化，不增添正文未明说的正式奉献礼。
- source_word: וַאֲשֶׁר יִזֶּה מִדָּמָהּ
  choice: 它的血若溅
  rationale: נזה可指血被洒出或溅出。此处血落到衣服上，随后须洗，因此正文用自然的“溅”，并以脚注保留“洒”的可能。
- source_word: עַל הַבֶּגֶד
  choice: 在衣服上
  rationale: 按律例式泛指处理，不把定冠词机械译成特定的“那件衣服”。
- source_word: אֲשֶׁר יִזֶּה עָלֶיהָ
  choice: 那件被血溅到的衣服
  rationale: 阴性代词回指衣服；译文明确须洗的是血所落到的衣服，同时保留原句的关系从句意义。
- source_word: תְּכַבֵּס
  choice: 你要……洗
  rationale: 保留第二人称阳性单数的直接律例命令；“洗”在衣物语境中自然表达כּבס的含义。
- source_word: בְּמָקוֹם קָדֹשׁ
  choice: 在圣洁之处
  rationale: 原文没有把此短语明确限定为内层圣所；“圣洁之处”保留经分别为圣的地点这一宽度。
theological_decisions:
- issue: 接触赎罪祭祭肉所带来的“圣”
  choice: 译作“成为圣”，表达接触后进入礼仪上的圣洁状态
  alternative: 译作“归为圣用”或“必须分别为圣”
  rationale: 上下文所说的是祭祀礼仪中的圣，而不是内在道德转变；直译“成为圣”既忠于原文，也不把其具体后果解释得过窄。
translation_notes:
  register: 采用现代、庄重而易懂的律例文体。“祭牲之肉”“成为圣”“圣洁之处”保留祭祀语汇及原文的神学张力；不将“圣”解释成道德完善，也不把地点过度限定为至圣所或内层圣所。
