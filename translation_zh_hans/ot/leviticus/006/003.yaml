  text: And the priest shall put on his linen garment, and he shall put linen undergarments on his body, and he shall remove the ashes to which the fire has reduced the burnt offering on the altar, and he shall place them beside the altar.
translation:
  language: zh_hans
  text: 祭司要穿上细麻布衣服，也要把细麻布裤穿在身上；然后取走坛上火烧燔祭所留下的灰[a]，放在祭坛旁边。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文表达紧凑，直译近于“火吞吃燔祭的灰”；也可按上下文译作“火烧燔祭所留下的灰”。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִדּוֹ בַד
  choice: 细麻布衣服
  rationale: מִדּוֹ指祭司所穿的衣服，בַד说明材质为细麻布；用“衣服”可避免无根据地限定具体款式。
- source_word: מִכְנְסֵי בַד
  choice: 细麻布裤
  rationale: 指贴身穿着、遮盖下身的祭司服装；“裤”在现代汉语中自然清楚，也比“内衣”更能保留其衣物形制。
- source_word: עַל בְּשָׂרוֹ
  choice: 穿在身上
  rationale: 字面为“在他的肉身上”，在穿衣语境中译作“穿在身上”自然，并表达贴身穿着。
- source_word: וְהֵרִים
  choice: 收起
  rationale: 动词基本义为“举起、拿起”，在此指从坛上取走灰；“收起”兼顾动作和礼仪程序。
- source_word: הַדֶּשֶׁן
  choice: 灰
  rationale: 在献祭语境中指火焚烧祭物后留下的灰烬或残余；“灰”简洁自然。
- source_word: אֲשֶׁר תֹּאכַל הָאֵשׁ אֶת הָעֹלָה
  choice: 焚烧燔祭后留下的
  rationale: 希伯来语结构紧凑，字面近于“火吞吃燔祭所成的灰”；此译明确表达灰是火焚烧燔祭后的残余，同时用脚注保留原文表达方式。
- source_word: הָעֹלָה
  choice: 燔祭
  rationale: עֹלָה指全然焚烧献上的祭，在中文圣经及宗教语境中“燔祭”准确、凝练且已广为使用。
- source_word: אֵצֶל הַמִּזְבֵּחַ
  choice: 祭坛旁边
  rationale: אֵצֶל表示在某物近旁；“祭坛旁边”符合现代汉语。
