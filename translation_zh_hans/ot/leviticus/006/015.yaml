base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/015.yaml
  text: 'And the anointed priest from among his sons[a], who succeeds him, shall prepare it[c][b]. It is a permanent statute for Yahweh: it shall be completely turned into smoke.'
translation:
  language: zh_hans
  text: 在他众子中接替他的那位受膏祭司[a]要制备这祭物。这是为耶和华所定的永远定例[b]：整份祭物都要焚烧成烟[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “接替他的”也可译作“代替他”或“在他的位置上”；原文直译为“在他之下”。
    reason: lexical_alternative
  - marker: b
    text: “永远定例”也可译作“永久的定例”或“恒久的条例”。
    reason: lexical_alternative
  - marker: c
    text: 原文直译为“要使它全然化为烟”，意思是整份祭物都在坛上烧尽，不留下供人食用的部分。
    reason: lexical_clarification
lexical_decisions:
- source_word: הַכֹּהֵן הַמָּשִׁיחַ
  choice: 受膏祭司
  rationale: 在利未记的祭祀语境中，指为祭司职分受膏的人；这里不是弥赛亚称号。
- source_word: תַּחְתָּיו מִבָּנָיו
  choice: 他儿子中接替他的
  rationale: תַּחְתָּיו 字面为“在他之下／代替他”，与“他儿子中”连用时自然表示祭司职分的承继；脚注保留较直译的可能。
- source_word: יַעֲשֶׂה אֹתָהּ
  choice: 要制备这祭物
  rationale: עָשָׂה 的含义宽泛，可指做、办理或预备；“制备”符合祭祀程序，又不把动作过度限定为单纯献上。代词所指的祭物由上文确定。
- source_word: חָק עוֹלָם
  choice: 永远定例
  rationale: 保留该短语所表达的持续、恒久法律效力，并采用现代中文圣经语体中清楚而庄重的表达。
- source_word: לַיהוָה
  choice: 归耶和华
  rationale: 介词 ל־ 在这里表达归属或奉献对象；“归”适合定例和祭物献给耶和华的语境。
- source_word: כָּלִיל תָּקְטָר
  choice: 整份祭物都要焚烧成烟
  rationale: כָּלִיל 强调整体、毫无保留；קטר 的使役式特指使祭物在坛上化为烟，比笼统的“烧掉”更贴近祭祀含义。
theological_decisions:
- issue: “受膏祭司”的身份
  choice: 承继前任职分的受膏祭司
  alternative: 泛指任何受膏的祭司；或理解为弥赛亚性称号
  rationale: “他儿子中接替他的”表明这里说的是世袭祭司职分的承继者，而非弥赛亚称号；译文不额外加入原文未明说的“最高祭司”。
- issue: 神名 יהוה 的译法
  choice: 耶和华
  alternative: 雅威；主
  rationale: “耶和华”是现代简体中文读者熟悉且能明确呈现专名功能的传统译法。
- issue: חָק עוֹלָם 的时间范围
  choice: 永远定例
  alternative: 永久的定例；世世代代的条例
  rationale: 沿用原文的恒久措辞，不在正文中预先限定其神学或历史适用范围。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“制备”保持祭祀语境中的正式感；“整份祭物”明确 כָּלִיל 所表达的完全性。正文保留“永远定例”的张力，不用解释性措辞缩窄其范围。
