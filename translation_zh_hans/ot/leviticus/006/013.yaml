  text: זֶ֡ה קָרְבַּן֩ אַהֲרֹ֨ן וּ/בָנָ֜י/ו אֲשֶׁר יַקְרִ֣יבוּ לַֽ/יהוָ֗ה בְּ/יוֹם֙ הִמָּשַׁ֣ח אֹת֔/וֹ עֲשִׂירִ֨ת הָ/אֵפָ֥ה סֹ֛לֶת מִנְחָ֖ה תָּמִ֑יד מַחֲצִיתָ֣/הּ בַּ/בֹּ֔קֶר וּ/מַחֲצִיתָ֖/הּ בָּ/עָֽרֶב־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/013.yaml
  text: 'This is the offering of Aaron and his sons[a], which they shall present to Yahweh on the day he is anointed: a tenth of an ephah of fine flour as a regular grain offering, half of it in the morning and half of it in the evening.'
translation:
  language: zh_hans
  text: 这是亚伦和他儿子们在他受膏的日子[a]要献给耶和华的供物：一伊法的十分之一细面，作为常献的素祭；早晨一半，晚上也一半。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文作“在膏他的日子”，其中“他”是单数；本句前面却提到“亚伦和他儿子们”。这可能特指亚伦，也可能逐一指每位受膏的祭司。
    reason: 保留原文单数代词与复数先行成分之间的歧义。
lexical_decisions:
- source_word: קָרְבַּן
  choice: 供物
  rationale: 这是献祭语境中的宽泛用语；“供物”既保留献给上帝之物的含义，又避免与本句较具体的“素祭”混同。
- source_word: יַקְרִיבוּ
  choice: 献给
  rationale: קרב的使役式在献祭语境中指把供物带到上帝面前献上；“献给”在现代汉语中自然明确。
- source_word: לַיהוָה
  choice: 给耶和华
  rationale: 以“耶和华”译出四字神名 יהוה，保留原文专名性质。
- source_word: בְּיוֹם הִמָּשַׁח אֹתוֹ
  choice: 在他受膏的日子
  rationale: 保留原文单数宾格代词所表达的单数指称，并自然传达该短语的时间意义，不擅自改成复数。
- source_word: עֲשִׂירִת הָאֵפָה
  choice: 一伊法的十分之一
  rationale: 准确保留原文的古代容量单位及其十分之一的数量关系。
- source_word: סֹלֶת
  choice: 细面
  rationale: 这是利未记献祭条例中对精制面粉的惯常而清楚的中文表达。
- source_word: מִנְחָה
  choice: 素祭
  rationale: 在利未记献祭制度中，此词特指以谷物为主的祭物；“素祭”是简洁、通行且与上下文吻合的称呼。
- source_word: תָּמִיד
  choice: 常献的
  rationale: 表达按规定持续、定期献上的意思，同时避免让人误解为物质上毫无间断地焚烧。
- source_word: מַחֲצִיתָהּ ... וּמַחֲצִיתָהּ
  choice: 一半……一半
  rationale: 直接保留供物分成两个相等部分的结构。
- source_word: בַּבֹּקֶר ... בָּעָרֶב
  choice: 早晨……晚上
  rationale: 以自然现代汉语准确表达两个规定的献祭时段。
theological_decisions:
- issue: “亚伦和他儿子们”之后，受膏者却使用单数代词
  choice: 正文保留单数“他”，不把原文改写成“他们”
  alternative: 按集合或分配意义译为“在他们受膏的日子”
  rationale: 马所拉文本明确使用单数宾格代词 אֹתוֹ。其所指可能是亚伦，也可能是以单数方式逐一指受膏的祭司；译文保留这一张力，并用脚注说明，而不在正文中替读者裁定。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“供物”与“素祭”分别对应宽泛祭物术语和具体祭类；保留“伊法”这一古代单位，并以分数明确数量。句式按汉语习惯重组，但维持原文的献祭对象、时间、材料、频率和早晚分配。
