  text: אֵ֗שׁ תָּמִ֛יד תּוּקַ֥ד עַל הַ/מִּזְבֵּ֖חַ לֹ֥א תִכְבֶֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/006.yaml
  text: A continual fire shall be kept burning on the altar[a]; it shall not go out.
translation:
  language: zh_hans
  text: 坛上的火要不断燃烧，不可熄灭。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“坛上的火要不间断地保持燃烧，不可熄灭。”
    reason: 词形 תּוּקַד 带有使火被维持燃烧的意味；正文较简洁，替代译法更明确地呈现这一语法特点。
lexical_decisions:
- source_word: אֵשׁ
  choice: 火
  rationale: 采用最直接、自然的字面对应，符合献祭礼仪中祭坛之火的语境。
- source_word: תָּמִיד
  choice: 不断
  rationale: 表达持续不止的状态；现代汉语自然清楚，又不弱化为仅仅“经常”或“定期”。
- source_word: תּוּקַד
  choice: 要……燃烧
  rationale: 该词是 יקד 的使役被动形态，语境中含有使火持续燃烧、加以维持之意；正文以自然汉语表达命令性规定，并由“不间断地保持燃烧”这一脚注译法显明其被动维持意味。
- source_word: עַל הַמִּזְבֵּחַ
  choice: 坛上
  rationale: 准确保留空间关系；本节承接上下文所指的特定祭坛，现代汉语中可自然简称“坛”。
- source_word: לֹא תִכְבֶה
  choice: 不可熄灭
  rationale: 既保留否定禁令，也保存希伯来语可理解为火不熄灭或不被扑灭的语义张力。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的礼仪法规语体。“要……不可……”体现规定性质；避免使用较古雅的“常燃不熄”。脚注标记置于整节末，所说明的是前半句的译法。
