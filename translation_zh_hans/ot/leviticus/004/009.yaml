- from: 两只腰子、腰子上靠近腰部的脂肪，以及肝上的附属部分[a]，他都要连同腰子一起取下。
  to: 他要取下两只腰子、腰子上在腰部的脂肪，以及肝脏上的附属部分[a]；这附属部分要连同腰子一并取下。
  rationale: 修订保留所有原文列项、程序性语气和肝部结构的词义不确定性。用分号后的复指句明确句末“连同腰子”的关系是指肝脏上的附属部分，而非把整组项目（包括腰子本身）再“连同腰子”取下；脚注锚点及内容维持不变。
