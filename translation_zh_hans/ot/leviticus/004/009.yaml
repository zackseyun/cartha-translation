base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/009.yaml
  text: and the two kidneys[a], and the fat that is on them, which is on the loins, and the appendage on the liver, along with the kidneys, he shall remove it.
translation:
  language: zh_hans
  text: 他要取下两只腰子、腰子上在腰部的脂肪，以及肝脏上的附属部分[a]；这附属部分要连同腰子一并取下。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“肝叶”。原文所指的确切解剖部位不能确定。
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁתֵּי הַכְּלָיֹת
  choice: 两只腰子
  rationale: 指祭牲的两个肾脏；“腰子”是现代汉语中描述动物内脏时自然易懂的说法，也保留了原文明确的数量。
- source_word: הַחֵלֶב אֲשֶׁר עֲלֵיהֶן
  choice: 腰子上的脂肪
  rationale: 在献祭条例中，חֵלֶב指分别出来焚献的脂肪部分；译作“脂肪”清楚而不过分技术化。
- source_word: אֲשֶׁר עַל הַכְּסָלִים
  choice: 靠近腰部的
  rationale: כְּסָלִים指腰部或腰侧区域；结合动物解剖位置，译为“靠近腰部”比生硬的“在腰上”更自然，同时不作过度精确的解剖判断。
- source_word: הַיֹּתֶרֶת עַל הַכָּבֵד
  choice: 肝上的附属部分
  rationale: יוֹתֶרֶת所指的确切解剖结构有争议。“附属部分”保留这种不确定性，“肝上”也对应原文介词表达，避免武断地确定为某一肝叶。
- source_word: עַל הַכְּלָיוֹת
  choice: 连同腰子一起
  rationale: 此处属于反复出现的献祭程式，表示该部分与腰子一并取下；这样译能自然表达操作关系，同时保留其礼仪组合。
- source_word: יְסִירֶנָּה
  choice: 他都要……取下
  rationale: 使役词干在此表示从祭牲身上除下所列部分。原文单数后缀把所列部分视为一个整体；“都要……取下”在中文中自然涵盖整组对象，并保持条例语气。
theological_decisions: []
translation_notes:
  register: 采用庄重而易懂的现代标准汉语，保留献祭条例的程序性语气。用“腰子”指祭牲的肾脏，符合动物内脏语境；对有争议的肝部结构采用审慎措辞，并以脚注列出常见替代译法。
