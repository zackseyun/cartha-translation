  text: וְ/הוֹצִ֣יא אֶת כָּל הַ֠/פָּר אֶל מִ/ח֨וּץ לַֽ/מַּחֲנֶ֜ה אֶל מָק֤וֹם טָהוֹר֙ אֶל שֶׁ֣פֶךְ הַ/דֶּ֔שֶׁן וְ/שָׂרַ֥ף אֹת֛/וֹ עַל עֵצִ֖ים בָּ/אֵ֑שׁ עַל שֶׁ֥פֶךְ הַ/דֶּ֖שֶׁן יִשָּׂרֵֽף־־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/012.yaml
  text: He shall bring out the whole bull to a clean place[a] outside the camp, to the ash dump, and burn it on wood in the fire[b]; it shall be burned at the ash dump.
translation:
  language: zh_hans
  text: 他要把整头公牛带到营外一处洁净的地方[a]，即倒灰处[b]，放在木柴上，在火中焚烧它。整头公牛要在倒灰处被焚烧。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里的“洁净”指礼仪上洁净。
    reason: 说明 טָהוֹר 在利未记祭祀语境中的含义。
  - marker: b
    text: “倒灰处”原文直译为“倾倒灰烬的地方”，即指定用来处置祭坛灰烬的地点。
    reason: 解释 שֶׁפֶךְ הַדֶּשֶׁן 的字面构成和具体所指。
lexical_decisions:
- source_word: וְהוֹצִיא
  choice: 要……运到营外
  rationale: 这是 יצא 的使役形，表示把某物带出或运出。结合公牛尸体的处置场景，“运到营外”自然地表达了方向和搬运的动作。
- source_word: כָּל הַפָּר
  choice: 整头公牛
  rationale: כָּל 与定冠词名词连用，强调公牛整体；“整头公牛”在现代汉语中自然且准确。
- source_word: מִחוּץ לַמַּחֲנֶה
  choice: 营外
  rationale: 指营地边界以外，简洁保留原文的空间意义。
- source_word: מָקוֹם טָהוֹר
  choice: 洁净的地方
  rationale: טָהוֹר 在利未记的礼仪语境中常涉及礼仪上的洁净；正文采用自然的“洁净”，脚注说明其礼仪含义。
- source_word: שֶׁפֶךְ הַדֶּשֶׁן
  choice: 倒灰处
  rationale: שֶׁפֶךְ 指倾倒之处，דֶּשֶׁן 在此指祭坛的灰。“倒灰处”既简明，也表明这是指定倾倒灰烬的地点，而非泛指灰堆。
- source_word: וְשָׂרַף אֹתוֹ
  choice: 焚烧
  rationale: שׂרף 意为烧毁；“焚烧”符合祭牲处置的庄重程序性语体。
- source_word: עַל עֵצִים בָּאֵשׁ
  choice: 放在柴上用火焚烧
  rationale: 分别保留柴作为承托物或燃料以及火作为焚烧手段，中文表达自然。
- source_word: עַל שֶׁפֶךְ הַדֶּשֶׁן יִשָּׂרֵף
  choice: 公牛要在倒灰处焚烧
  rationale: 保留原文末句对指定地点的重复强调；补出“公牛”以避免中文代词指向含混。
theological_decisions:
- issue: טָהוֹר 的礼仪洁净含义
  choice: 洁净的地方
  alternative: 礼仪上洁净的地方；清洁的地方
  rationale: 上下文很可能指礼仪上的洁净，但正文不把语义扩写得过满；脚注保留并说明这一语境含义。
- issue: שֶׁפֶךְ הַדֶּשֶׁן 所指的祭祀灰烬处置地点
  choice: 倒灰处
  alternative: 灰堆；倾倒灰烬的地方
  rationale: 该词组指倾倒祭坛灰烬的指定地点。“倒灰处”比“灰堆”更能体现其功能，又比完整解释简洁。
- issue: 末句地点短语的重复
  choice: 保留“在倒灰处焚烧”
  alternative: 省略为“在那里焚烧”
  rationale: 原文以重复突出祭牲必须在指定地点焚烧；保留重复可维持律法指令的强调，不作神学性弱化。
translation_notes:
  register: 采用现代、庄重而易懂的律法程序语体。“运到营外”清楚表达使役和方向；“倒灰处”简洁具体。保留末句的重复，以再现希伯来文的法律性强调。所有脚注标记均置于正文相应词语之后。
