base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/008.yaml
  text: 'And he shall remove from it all the fat of the sin offering bull: the fat that covers the entrails and all the fat that is on the entrails,[a]'
translation:
  language: zh_hans
  text: 他要从赎罪祭的公牛身上取下所有的脂肪，就是遮盖内脏的脂肪和内脏上所有的脂肪。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“洁净祭的公牛”。希伯来语 חַטָּאת 既可表示“罪”，也可指与除去罪或不洁有关的祭。
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל
  choice: 所有的
  rationale: 保留希伯来文的全面性，表明指定的脂肪都要取下。
- source_word: חֵלֶב
  choice: 脂肪
  rationale: 在献祭语境中指特定的祭牲脂肪；后面的解剖位置进一步限定其所指。
- source_word: פַּר הַחַטָּאת
  choice: 赎罪祭的公牛
  rationale: 自然表达结构关系，说明这头公牛是用作该祭的祭牲。
- source_word: יָרִים
  choice: 取下
  rationale: 该动词本义涉及举起，在此献祭操作中表示把指定部分从祭牲身上分离、移除；“取下”具体而自然。
- source_word: מִמֶּנּוּ
  choice: 从……身上
  rationale: 所指为公牛；汉语以“从公牛身上”表达从祭牲取下相应部分，清楚自然。
- source_word: הַמְכַסֶּה
  choice: 遮盖
  rationale: 保留分词的修饰功能，描述脂肪覆盖内脏的状态。
- source_word: קֶרֶב
  choice: 内脏
  rationale: 符合献祭解剖语境，也比“内部”具体、比专业医学术语易懂。
- source_word: אֲשֶׁר עַל הַקֶּרֶב
  choice: 内脏上
  rationale: 保留 עַל 的空间意义，并与“遮盖内脏的脂肪”并列表达。
theological_decisions:
- issue: 献祭语境中 חַטָּאת 的译法
  choice: 赎罪祭
  alternative: 洁净祭
  rationale: חַטָּאת 既可关联罪，也可指处理罪与不洁的祭。正文采用现代汉语读者较熟悉的“赎罪祭”，脚注保留“洁净祭”这一真实的词义与功能取向，避免把术语的含义收窄为单一解释。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。以“取下”呈现献祭程序动作，用“内脏”保持具体而通俗的解剖表达；保留原文两组脂肪位置描述及“所有”的全面语气。
