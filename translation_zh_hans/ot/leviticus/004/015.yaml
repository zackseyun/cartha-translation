source:
  edition: WLC
  text: וְ֠/סָמְכוּ זִקְנֵ֨י הָ/עֵדָ֧ה אֶת יְדֵי/הֶ֛ם עַל רֹ֥אשׁ הַ/פָּ֖ר לִ/פְנֵ֣י יְהוָ֑ה וְ/שָׁחַ֥ט אֶת הַ/פָּ֖ר לִ/פְנֵ֥י יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/015.yaml
  text: And the elders of the congregation shall lay their hands on the head of the bull before Yahweh[a], and the bull shall be slaughtered before Yahweh.
translation:
  language: zh_hans
  text: 会众的长老要在雅威面前把双手按在公牛头上；他要在雅威面前宰杀那公牛。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文在这里从复数的“长老”转用单数动词，但没有明说“他”是谁；也可译作“要有人在雅威面前宰杀那公牛”或“那公牛要在雅威面前被宰杀”。
    reason: 保留原文由复数转为单数所造成的指代不确定性。
lexical_decisions:
- source_word: וְסָמְכוּ
  choice: 要……按
  rationale: סמך在献祭礼仪中指把手按在祭牲上；“按”简洁自然，也保留了实际接触和施力的意味。
- source_word: זִקְנֵי הָעֵדָה
  choice: 会众的长老
  rationale: זִקְנֵי意为“长老”，עֵדָה指聚集的群体；“会众”适合利未记的正式群体语境。
- source_word: אֶת יְדֵיהֶם
  choice: 双手
  rationale: 原文为复数“他们的手”。汉语在此用“把双手按在”最自然，并明确保留复数形式。
- source_word: עַל רֹאשׁ הַפָּר
  choice: 在公牛头上
  rationale: 直接表达献祭动作的位置；פַּר译为“公牛”，不额外添加原文在本节未明确要求的年龄信息。
- source_word: לִפְנֵי יְהוָה
  choice: 在雅威面前
  rationale: לִפְנֵי表示“在……面前／临在中”；“在雅威面前”准确而符合现代汉语礼仪语体。
- source_word: יְהוָה
  choice: 雅威
  rationale: 采用神圣四字名的常见现代汉语音译，保留其作为以色列之神专名的性质，而不以称号替代。
- source_word: וְשָׁחַט
  choice: 他要……宰杀
  rationale: 原文动词由前句的复数转为第三人称阳性单数。“他要”保留这一数的转换；“宰杀”准确表达献祭语境中的杀牲动作。
- source_word: הַפָּר
  choice: 那公牛
  rationale: 定冠词指回前面已经提到的公牛；“那公牛”在汉语中清楚自然。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华／上主
  rationale: 原文直接使用神的专名；译作“雅威”保留专名性质，避免以称号取代。
- issue: וְשָׁחַט由复数主语后转为单数动词
  choice: 保留为“他要宰杀”并加注说明指代未明
  alternative: 译作“他们要宰杀”或“公牛要被宰杀”
  rationale: 原文确实使用单数动词，却没有明说该单数执行者是谁。正文保留单数可呈现原文形式，脚注则避免读者误以为其指代已经确定。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“会众”“长老”“宰杀”等词符合利未记礼仪法规的正式语域；句法不过度古雅，并以分号清楚呈现两个连续动作。
