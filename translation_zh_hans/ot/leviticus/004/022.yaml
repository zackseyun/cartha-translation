  text: אֲשֶׁ֥ר נָשִׂ֖יא יֶֽחֱטָ֑א וְ/עָשָׂ֡ה אַחַ֣ת מִ/כָּל מִצְוֺת֩ יְהוָ֨ה אֱלֹהָ֜י/ו אֲשֶׁ֧ר לֹא תֵעָשֶׂ֛ינָה בִּ/שְׁגָגָ֖ה וְ/אָשֵֽׁם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/022.yaml
  text: When a leader sins and unintentionally does one of any of the things that Yahweh his God has commanded not to be done[a], and becomes guilty[b],
translation:
  language: zh_hans
  text: “若首领犯罪，无意中做了雅威——他的上帝——所吩咐不可做的事中的一件，以致负有罪责，”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נָשִׂיא
  choice: 首领
  rationale: 该词指公认的群体领袖或主管者，并不必然表示君王之子；“首领”既保留其身份分量，也符合本段祭祀法规的语境。
- source_word: יֶחֱטָא
  choice: 犯了罪
  rationale: חטא是表示犯罪的常用动词；“犯了罪”直接、自然，并保留原文的宗教与道德含义。
- source_word: וְעָשָׂה אַחַת מִכָּל
  choice: 做了……任何一件事
  rationale: 此处分举整体中的一项，意为触犯全部禁令中的任何一条；该译法在现代汉语中自然地表达了这种部分关系。
- source_word: מִצְוֺת יְהוָה אֱלֹהָיו אֲשֶׁר לֹא תֵעָשֶׂינָה
  choice: 雅威他的上帝所吩咐不可做的
  rationale: 把“诫命”和随后“不可做”的关系自然展开，同时保留אֱלֹהָיו的第三人称领属成分“他的上帝”。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语中对YHWH的常见音译呈现上帝的专名，而不以“主”这一称号替代。
- source_word: בִּשְׁגָגָה
  choice: 无意中
  rationale: 在利未记的献祭法规中，该词指非蓄意、因疏忽或误失而犯的过错；“无意中”准确且易懂。
- source_word: וְאָשֵׁם
  choice: 因而负有罪责
  rationale: אשם在此表示行为所造成的有罪状态；“负有罪责”比字面化的“成为有罪”更符合现代汉语，“因而”表达上下文中的结果关系。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。译作“雅威”保留其专名性质，并避免用称号“主”取代神名。
- issue: וְאָשֵׁם所表达的罪责状态
  choice: 因而负有罪责
  alternative: 就成为有罪；就自觉有罪
  rationale: 该动词可表示处于有罪或承担罪责的状态；这里不加入“自觉”或“发现”等原文没有明说的心理含义，以保留其客观罪责的表达。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“如果有首领……”适合本段条例式语体；句末保留逗号，因为本节语法和意义延续到下一节。脚注标记分别紧跟其实际解释的词语，避免错位。
