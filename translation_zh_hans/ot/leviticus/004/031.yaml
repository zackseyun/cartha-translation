reference: Leviticus 4:31
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/אֶת כָּל חֶלְבָּ֣/הּ יָסִ֗יר כַּ/אֲשֶׁ֨ר הוּסַ֣ר חֵלֶב֮ מֵ/עַ֣ל זֶ֣בַח הַ/שְּׁלָמִים֒ וְ/הִקְטִ֤יר הַ/כֹּהֵן֙ הַ/מִּזְבֵּ֔חָ/ה לְ/רֵ֥יחַ נִיחֹ֖חַ לַ/יהוָ֑ה וְ/כִפֶּ֥ר עָלָ֛י/ו הַ/כֹּהֵ֖ן וְ/נִסְלַ֥ח לֽ/וֹ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/031.yaml
  text: And he shall remove all its fat[a], just as the fat is removed from the sacrifice of peace offerings, and the priest shall burn it on the altar as a pleasing aroma to Yahweh. And the priest shall make atonement for him[b], and he will be forgiven.
translation:
  language: zh_hans
  text: 他要取下它所有的脂油，正如从平安祭[a]的祭牲上取下脂油一样。祭司要把脂油烧在祭坛上，献给耶和华，成为蒙悦纳的馨香[b]。祭司要为他赎罪，他就必蒙赦免。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “平安祭”也可译作“团契祭”。
    reason: lexical_alternative
  - marker: b
    text: “蒙悦纳的馨香”是固定的祭祀用语，表示所献的祭蒙耶和华接纳。
    reason: cultural_note
lexical_decisions:
- source_word: חֶלְבָּהּ / חֵלֶב
  choice: 它所有的脂油／脂油
  rationale: 这里指从祭牲取下并焚烧献上的脂肪；“脂油”符合现代中文圣经祭祀语境，也不额外加入“特定部位”的解释。
- source_word: יָסִיר
  choice: 要取下
  rationale: 使役形在此表示将脂油从祭牲上除下；“取下”自然地保留祭祀规程的语气。
- source_word: כַּאֲשֶׁר הוּסַר
  choice: 正如……取下……一样
  rationale: 保留原文对既定平安祭处理方式的比较，不增添时间或因果含义。
- source_word: זֶבַח הַשְּׁלָמִים
  choice: 平安祭牲
  rationale: “平安祭”是该祭类在中文中的通行称呼，“祭牲”对应 זֶבַח 在此所指被献的牲畜；脚注保留“团契祭”的可能理解。
- source_word: וְהִקְטִיר
  choice: 要把脂油烧
  rationale: 该动词在祭祀语境中指在祭坛上焚烧使之成为烟气；中文用“烧”简洁自然，祭坛语境已表明其献祭性质。
- source_word: הַמִּזְבֵּחָה
  choice: 在祭坛上
  rationale: 准确表达带方向性的祭坛用语，并符合现代汉语习惯。
- source_word: לְרֵיחַ נִיחֹחַ
  choice: 成为蒙悦纳的馨香
  rationale: 既保留“香气”的祭祀比喻，也表达 נִיחֹחַ 所含的悦纳意味；脚注说明这是固定祭祀用语。
- source_word: לַיהוָה
  choice: 献给耶和华
  rationale: 介词表达祭物所归向的对象；“献给”在中文中自然呈现祭祀方向，“耶和华”对应神名 יהוה。
- source_word: וְכִפֶּר עָלָיו
  choice: 祭司要为他赎罪
  rationale: 保留祭司礼仪行动及其为献祭者施行的指向，不将 כפר 限缩为某一种后世教义解释。
- source_word: וְנִסְלַח לוֹ
  choice: 他就必蒙赦免
  rationale: “蒙赦免”保留希伯来文被动结果，也以“必”呈现法规语境中所应许的确定结果。
theological_decisions:
- issue: 祭司赎罪与赦免的关系
  choice: 祭司要为他赎罪，他就必蒙赦免。
  alternative: 祭司要替他行赎罪礼，他的罪就必蒙赦免。
  rationale: 译文保留原文从祭司施行赎罪到献祭者蒙赦免的陈述，不进一步规定其神学机制，也不把原文未明说的“罪”补作语法主语。
- issue: לְרֵיחַ נִיחֹחַ 的祭祀意涵
  choice: 献给耶和华，成为蒙悦纳的馨香
  alternative: 作为使耶和华舒畅的香气
  rationale: “蒙悦纳”传达祭物被神接纳的传统祭祀语义，同时保留“馨香”这一原文比喻，避免将其粗直地理解为神在生理上因气味而舒畅。
translation_notes:
  register: 采用现代、庄重而易懂的祭祀法规语体。“脂油”“祭坛”“赎罪”“蒙赦免”等保留利未记所需的礼仪术语；句法按希伯来文推进，以两个“祭司要……”清楚呈现连续程序。脚注标记均置于其实际说明的词语之后。
