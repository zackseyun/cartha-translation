  text: וְ/טָבַ֧ל הַ/כֹּהֵ֛ן אֶת אֶצְבָּע֖/וֹ בַּ/דָּ֑ם וְ/הִזָּ֨ה מִן הַ/דָּ֜ם שֶׁ֤בַע פְּעָמִים֙ לִ/פְנֵ֣י יְהוָ֔ה אֶת פְּנֵ֖י פָּרֹ֥כֶת הַ/קֹּֽדֶשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/006.yaml
  text: The priest shall dip his finger in the blood and sprinkle some of the blood seven times before Yahweh[a], in front of the curtain of the sanctuary.
translation:
  language: zh_hans
  text: 祭司要用手指蘸血，在雅威面前，向着圣所的幔子[a]弹血七次。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在圣所的幔子前”。
    reason: 原文“幔子的前面”可表示朝向幔子正面，也可按空间位置译为“在幔子前”；正文保留其朝向意味。
lexical_decisions:
- source_word: וְטָבַל
  choice: 要……蘸
  rationale: 在祭祀条例的连续指令中，ו连接的完成式承接前文，表达应当执行的动作；“蘸”自然准确。
- source_word: הַכֹּהֵן
  choice: 祭司
  rationale: 定冠词加单数名词，指本礼仪中负责执行仪式的祭司；汉语无需另加定指词。
- source_word: אֶצְבָּעוֹ
  choice: 手指
  rationale: 单数名词带第三人称阳性单数后缀；主语明确时，现代汉语可自然省略“他的”。
- source_word: בַּדָּם
  choice: 在血里
  rationale: 介词ב表示手指蘸入其中的物质；“在血里”符合现代汉语表达。
- source_word: וְהִזָּה
  choice: 弹
  rationale: נזה的使役式在祭司礼仪语境中指用手指弹洒液体；“弹”比泛指的“洒”更具体地呈现此处动作。
- source_word: מִן־הַדָּם
  choice: 一些血
  rationale: מן在此可作部分用法，表示从血中取一部分来弹洒。
- source_word: שֶׁבַע פְּעָמִים
  choice: 七次
  rationale: 直接保留数词状语的意义。
- source_word: לִפְנֵי יְהוָה
  choice: 在雅威面前
  rationale: לִפְנֵי表达空间及礼仪上的朝向或临在；神名יהוה音译为“雅威”。
- source_word: אֶת־פְּנֵי פָּרֹכֶת הַקֹּדֶשׁ
  choice: 朝着圣所的幔子
  rationale: פְּנֵי在此表示朝向幔子的正面；פָּרֹכֶת是隔开圣区的幔子，הַקֹּדֶשׁ说明它与圣所有关。“朝着圣所的幔子”自然且不过度限定建筑细节。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”较贴近学界普遍采用的读音，同时保留其作为专名的性质。
- issue: פָּרֹכֶת הַקֹּדֶשׁ所指的礼仪设施
  choice: 圣所的幔子
  alternative: 圣处的幔子
  rationale: 该短语可理解为与圣所或圣区相关的内幔。“圣所的幔子”清楚易懂，又不在本节中强行确定更细的建筑分区。
- issue: 句末两个方位短语的关系
  choice: 在雅威面前，朝着圣所的幔子
  alternative: 在圣所的幔子前，在雅威面前
  rationale: 原文依次保留“在雅威面前”和“朝着幔子正面”两个表达。正文不把二者合并为同一个方位，以保留其句法张力；脚注列出可将末语理解为“在幔子前”的译法。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“把手指蘸在血里”与“弹一些血七次”保持礼仪动作的具体性；语序尽量自然，同时保留原文两个方位表达。
