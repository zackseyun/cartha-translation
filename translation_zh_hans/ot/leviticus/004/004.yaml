  text: וְ/הֵבִ֣יא אֶת הַ/פָּ֗ר אֶל פֶּ֛תַח אֹ֥הֶל מוֹעֵ֖ד לִ/פְנֵ֣י יְהוָ֑ה וְ/סָמַ֤ךְ אֶת יָד/וֹ֙ עַל רֹ֣אשׁ הַ/פָּ֔ר וְ/שָׁחַ֥ט אֶת הַ/פָּ֖ר לִ/פְנֵ֥י יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/004.yaml
  text: He shall bring the bull to the entrance of the tent of meeting before Yahweh[b][a], and he shall lay his hand on the head of the bull and slaughter the bull before Yahweh.
translation:
  language: zh_hans
  text: 他要把公牛带到雅威面前[b]的会幕门口[a]；他要把手按在公牛头上，并在雅威面前宰杀公牛。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“会幕入口”。
    reason: lexical_alternative
  - marker: b
    text: 原文直译“在雅威面前”；这是祭礼用语，也含有处于雅威临在中的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵבִיא
  choice: 他要把……牵到
  rationale: 这是祭礼条例中的指令；希伯来语使役形表示把牲畜带来。中文用“要”体现规定语气，用“牵到”自然地表达带来公牛。
- source_word: הַפָּר
  choice: 公牛
  rationale: פַּר指公牛，在献祭语境中也可能是较年轻的公牛，但本节没有明说年龄，因此不增译“幼”或“年轻”。
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: 会幕门口
  rationale: פֶּתַח指开口、入口或门口；“会幕”是אֹהֶל מוֹעֵד在现代中文圣经语体中简洁且易懂的对应表达。
- source_word: לִפְנֵי יְהוָה
  choice: 在雅威面前
  rationale: לִפְנֵי既可表示“在……前面”，也可表示“在……面前／临在中”。保留祭礼用语“在……面前”，不把其含义缩减为单纯的空间方位。
- source_word: וְסָמַךְ אֶת יָדוֹ עַל רֹאשׁ הַפָּר
  choice: 他要把手按在公牛头上
  rationale: סמך在献祭语境中指把手放在或按在祭牲头上的礼仪动作；“按在”既自然，也保留动作本身而不预先解释其象征意义。
- source_word: וְשָׁחַט
  choice: 并……宰杀
  rationale: שׁחט是宰杀祭牲的专门动词；“宰杀”比笼统的“杀死”更能体现祭礼语境。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名。译作“雅威”以保留其专名性质，而不以称号代替；这是现代汉语中对YHWH常见的音译之一。
- issue: 按手礼的意义
  choice: 只翻译礼仪动作，不增添神学解释
  alternative: 明确解释为认同、代表或罪责转移
  rationale: 本节只陈述献祭者按手的动作，没有说明其完整意义；直译动作可避免把某一种后来的解释写进正文。
translation_notes:
  register: 采用现代、庄重而易懂的条例语体。“会幕门口”简洁自然；分号划分带来祭牲与按手、宰杀两组连续动作。神名统一音译为“雅威”。
