  text: וְ/אֶת כָּל חֶלְבּ/וֹ֙ יַקְטִ֣יר הַ/מִּזְבֵּ֔חָ/ה כְּ/חֵ֖לֶב זֶ֣בַח הַ/שְּׁלָמִ֑ים וְ/כִפֶּ֨ר עָלָ֧י/ו הַ/כֹּהֵ֛ן מֵ/חַטָּאת֖/וֹ וְ/נִסְלַ֥ח לֽ/וֹ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/026.yaml
  text: And he shall burn all its fat on the altar[a], like the fat of the sacrifice of peace offerings. Thus the priest shall make atonement for him for his sin[b], and he shall be forgiven.
translation:
  language: zh_hans
  text: 他要把这只祭牲所有的脂油都烧在祭坛上，正如烧平安祭牲[a]的脂油一样。祭司要为他所犯的罪赎罪[b]，他就必蒙赦免。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “平安祭”也可译作“团契祭”或“福祉祭”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来语 חַטָּאת 既可指“罪”，也可指“赎罪祭”；此处较可能是指这个人所犯的罪。
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶלְבּוֹ
  choice: 这只祭牲所有的脂油
  rationale: חֵלֶב在献祭规程中指指定焚烧的脂油部分；后缀表示属于前述祭牲。补出“这只祭牲”使现代汉语指代清楚，并保留“所有的”（כָּל）。
- source_word: יַקְטִיר
  choice: 烧
  rationale: קטר的Hiphil形在祭坛语境中指把祭物焚烧、使其化为烟。“烧在祭坛上”自然清楚，祭祀语境也充分表达其礼仪含义。
- source_word: הַמִּזְבֵּחָה
  choice: 在祭坛上
  rationale: 原文带方向词尾，字面有“向祭坛”的意味；按汉语献祭表达，译作“烧在祭坛上”最自然。
- source_word: כְּחֵלֶב זֶבַח הַשְּׁלָמִים
  choice: 正如烧平安祭祭牲的脂油一样
  rationale: 该短语把本祭牲脂油的处理方式与שְׁלָמִים祭的惯常做法相比较。“平安祭”是通行且可识别的祭名，脚注保留其他可能表达。
- source_word: וְכִפֶּר עָלָיו
  choice: 祭司要……替他赎罪
  rationale: כפר在祭司献祭语境中表示施行赎罪之礼；“替他赎罪”保留代为办理及礼仪性的含义，而不限定某一种赎罪理论。
- source_word: מֵחַטָּאתוֹ
  choice: 为他的罪
  rationale: חַטָּאת既可指“罪”，也可指“赎罪祭”。此处与“他就必蒙赦免”相连，较自然地指当事人所犯的罪；脚注保留另一可能。
- source_word: וְנִסְלַח לוֹ
  choice: 他就必蒙赦免
  rationale: סלח的Niphal形配לְ表示此人得到赦免。“蒙赦免”自然保留被动含义，也不明说句中未明示的施事者。
theological_decisions:
- issue: 祭名 שְׁלָמִים 的译法
  choice: 平安祭
  alternative: 团契祭；福祉祭
  rationale: 该词可关联完整、安好以及共享祭筵所体现的团契。“平安祭”沿用广为人知的祭名，同时以脚注呈现其较宽的语义范围。
- issue: מֵחַטָּאתוֹ 中 חַטָּאת 的所指
  choice: 他的罪
  alternative: 他的赎罪祭
  rationale: 本节先说祭司为此人赎罪，继而说此人蒙赦免，因此上下文更支持“罪”；但该名词在《利未记》中也常指“赎罪祭”，故不应隐藏词义上的可能性。
- issue: וְנִסְלַח לוֹ 的被动表达
  choice: 他就必蒙赦免
  alternative: 他的罪就必得赦免
  rationale: 原文使用不明说施事者的被动形式。主译保留这种含蓄，不额外加入“上帝必赦免他”，从而避免超出本句形式所明说的内容。
translation_notes:
  register: 采用现代、庄重而易懂的祭祀用语。“祭坛”“脂油”“平安祭”“赎罪”“蒙赦免”保持《利未记》关键术语的一致性；句式尽量自然，同时保留原文的被动表达及 חַטָּאת 的词义张力。
