  text: וְ/נֽוֹדְעָה֙ הַֽ/חַטָּ֔את אֲשֶׁ֥ר חָטְא֖וּ עָלֶ֑י/הָ וְ/הִקְרִ֨יבוּ הַ/קָּהָ֜ל פַּ֤ר בֶּן בָּקָר֙ לְ/חַטָּ֔את וְ/הֵבִ֣יאוּ אֹת֔/וֹ לִ/פְנֵ֖י אֹ֥הֶל מוֹעֵֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/014.yaml
  text: and the sin that they committed becomes known[a], then the assembly shall present a bull, a son of the herd, as a sin offering and bring it before the tent of meeting.
translation:
  language: zh_hans
  text: 他们所犯的罪一旦被发现[a]，会众就要献上一头公牛作赎罪祭，并把它带到会幕前。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语 חַטָּאת（ḥaṭṭā’t）在本节出现两次：第一次指“罪”，第二次指“赎罪祭”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנֽוֹדְעָה
  choice: 一被发现
  rationale: ידע的尼法勒式在此表示这罪进入人的认知，即被发现或为人所知；“一被发现”自然表达其条件与起始意味，同时不指明发现者。
- source_word: הַחַטָּאת
  choice: 罪
  rationale: 后接“他们所犯的”，表明此处指所犯的罪，而非祭物。
- source_word: אֲשֶׁר חָטְאוּ עָלֶיהָ
  choice: 他们所犯的
  rationale: 按现代汉语与“罪”的自然搭配译为“所犯的”，不生硬直译介词עַל。
- source_word: הַקָּהָל
  choice: 会众
  rationale: 在以色列礼仪与法律语境中，“会众”清楚表达作为整体的聚集群体，也符合现代中文圣经语域。
- source_word: וְהִקְרִיבוּ
  choice: 献上
  rationale: קרב的使役式在献祭语境中指把祭牲带近并呈献；“献上”兼顾礼仪含义与自然中文。
- source_word: פַּר בֶּן בָּקָר
  choice: 一头公牛犊
  rationale: 该短语逐字为“牛群之子的一头公牛”，指牛类中的雄性幼牛；“公牛犊”自然涵盖性别和类别，避免不自然的“牛群之子”。
- source_word: לְחַטָּאת
  choice: 作赎罪祭
  rationale: 此处חַטָּאת指规定的祭物类别；“赎罪祭”是现代中文中清楚且通行的礼仪术语。
- source_word: וְהֵבִיאוּ אֹתוֹ
  choice: 并把它牵到
  rationale: 宾语代词指公牛；牲畜通常被牵到某处，“牵到”比泛称“带到”更具体自然，未改变动作对象。
- source_word: לִפְנֵי אֹהֶל מוֹעֵד
  choice: 会幕前
  rationale: אֹהֶל מוֹעֵד直译为“相会之帐幕”；“会幕”是简洁、通行的中文名称，“前”准确表达לִפְנֵי。
theological_decisions:
- issue: 同一节中חַטָּאת的两种语境义
  choice: 首次译为“罪”，第二次译为“赎罪祭”
  alternative: 两处统一译作“赎罪祭”，或第二处译作“洁净祭”
  rationale: 首次后接“他们所犯的”，明确指过犯；第二次由介词לְ引出祭牲用途，明确指祭物类别。依语境分别翻译可保留希伯来词的一词多义，又不把两者混淆。“洁净祭”能突出部分礼仪功能，但在此会比原文更明确地选择一种解释。
- issue: 群体献祭责任的表达
  choice: 保留“会众”作单数集体主体，并译作“就要献上”
  alternative: 译作“全体会众”或明确加上代表会众献祭的人
  rationale: 原文以הַקָּהָל为集体主体，并未在本节说明具体执行者；译文不擅自补入长老或祭司，以保留经文本身的表达范围。
translation_notes:
  register: 采用庄重而通顺的现代标准普通话。“一被发现……就要……”自然呈现希伯来语句法中的条件关系；保留祭祀语境中的“会众、献上、赎罪祭、会幕”等通行术语。
