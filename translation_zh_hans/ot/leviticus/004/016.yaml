base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/016.yaml
  text: Then the anointed priest shall bring some of the bull's blood into the tent of meeting[a][b].
translation:
  language: zh_hans
  text: 随后，受膏的祭司要把公牛的一些血[a]带进会幕[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或较直译作“从公牛的血中”。希伯来语此处很可能有部分意义，指只把部分血带进去。
    reason: lexical_alternative
  - marker: b
    text: 希伯来语直译为“会面的帐幕”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/הֵבִיא
  choice: 随后……要把……带进
  rationale: 该形式承接礼仪程序的先后次序；“随后……要”以自然的现代汉语表达连续命令。
- source_word: הַ/כֹּהֵן הַ/מָּשִׁיחַ
  choice: 受膏的祭司
  rationale: 这里指因受膏而就任的祭司，并非弥赛亚称号；直译为“受膏的”既保留原文意象，也符合祭司语境。
- source_word: מִ/דַּם
  choice: 一些血
  rationale: 介词 מִן 在这里很可能表示部分，即带进去的只是公牛血的一部分；正文采用自然清楚的部分表达，并以脚注保留较字面的译法。
- source_word: הַ/פָּר
  choice: 公牛
  rationale: פַּר 在献祭语境中指公牛；本节本身无需进一步限定为“牛犊”。
- source_word: אֶל
  choice: 进
  rationale: 结合“带”和目的地“会幕”，此处动作包含进入圣所空间；“带进”比单说“带到”更准确自然。
- source_word: אֹהֶל מוֹעֵד
  choice: 会幕
  rationale: “会幕”是现代中文圣经语境中简洁且广为理解的对应语；脚注补出较直译的“相会之帐幕”，以显明希伯来词组的构成。
theological_decisions:
- issue: 祭司语境中 הַמָּשִׁיחַ 的译法
  choice: 受膏的
  alternative: 被分别为圣的；弥赛亚
  rationale: 该词在此描述按礼仪受膏就任的祭司，不是基督论或弥赛亚称号。“被分别为圣的”解释性较强，而“弥赛亚”会误导读者。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“随后”标示礼仪步骤的推进，“要”表达律法程序要求；句式简明，适合普通读者阅读。
