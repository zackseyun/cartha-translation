  text: And he shall remove all its fat from it and burn it on the altar[a].
translation:
  language: zh_hans
  text: 祭司要从公牛身上取下所有的脂肪，在祭坛上焚烧献上。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “焚烧献上”原文特指在献祭中使祭物在祭坛上化为烟。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵת
  choice: 要
  rationale: 希伯来语连词承接上一节的礼仪步骤；中文以“要”自然延续指令，不另译直接宾语标记。
- source_word: כָּל חֶלְבּוֹ
  choice: 公牛所有的脂肪
  rationale: כָּל 表示全部；阳性单数后缀所指是前文作赎罪祭的公牛，明说“公牛”可避免中文“它的……取出来”的生硬表达。
- source_word: יָרִים מִמֶּנּוּ
  choice: 取出来
  rationale: רום 的使役式在此指把脂肪从祭牲身上取出；“取出来”兼顾分离动作和现代中文的自然表达。
- source_word: וְהִקְטִיר
  choice: 焚烧献上
  rationale: הקטיר 是祭祀术语，指使祭物在坛上化为烟而献上；“焚烧献上”既自然，又区别于一般的烧毁。
- source_word: הַמִּזְבֵּחָה
  choice: 在祭坛上
  rationale: 方向词尾在该祭祀搭配中表示祭物被带到坛上焚献；中文惯用“在祭坛上”。
theological_decisions:
- issue: הקטיר 的祭祀含义
  choice: 焚烧献上
  alternative: 烧掉；使之化为烟
  rationale: 避免把动作弱化为普通焚烧，也不采用不自然的直译；保留这是献给上帝的坛上礼仪行为这一语义。
translation_notes:
  register: 采用现代、庄重而易懂的礼仪叙述。“公牛”承接4:14所献的公牛；原文代词本身只表达阳性单数。脚注标记置于正文句末。
