source:
  edition: WLC
  text: וְ/אִם כֶּ֛בֶשׂ יָבִ֥יא קָרְבָּנ֖/וֹ לְ/חַטָּ֑את נְקֵבָ֥ה תְמִימָ֖ה יְבִיאֶֽ/נָּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/032.yaml
  text: And if he brings a lamb as his offering for a sin offering[a], he shall bring a female without blemish.
translation:
  language: zh_hans
  text: 如果他献一只羊羔作赎罪祭[a]，就要献一只没有残疾的母羊羔。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“洁净祭”。希伯来语 חַטָּאת 可指处理罪和礼仪污秽的祭。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: 如果
  rationale: 承接上文并引入另一种可供选择的祭牲；现代汉语中用“如果”即可自然表达这一条件关系，无须生硬译出连接词。
- source_word: כֶּבֶשׂ
  choice: 一只羊羔
  rationale: 此处指羊群中的绵羊；结合后文阴性限定，译作“羊羔”符合祭祀语境，也与上下文通常译法协调。
- source_word: יָבִיא
  choice: 献
  rationale: בוא的使役式本义为“带来”，但在献祭语境中译作“献”更自然，同时保留把祭牲带到耶和华面前的实际行动含义。
- source_word: קָרְבָּנוֹ
  choice: （包含在“献一只羊羔”中）
  rationale: 原文直译为“把一只羊羔作为他的供物带来”。汉语若另译“作为他的供物”显得重复；用“献一只羊羔”自然涵盖קָרְבָּנוֹ的献物含义。
- source_word: לְחַטָּאת
  choice: 作赎罪祭
  rationale: חַטָּאת在利未记祭祀法规中是特定祭类名称。“赎罪祭”是现代中文圣经读者熟悉的称谓；脚注保留“洁净祭”这一有根据的替代译法。
- source_word: נְקֵבָה
  choice: 母羊羔
  rationale: 明确祭牲必须为雌性。汉语以“母羊羔”比“雌性的羊羔”简洁自然。
- source_word: תְמִימָה
  choice: 没有残疾的
  rationale: 祭祀法规中的תמים指没有身体缺陷、适合作祭牲，并非泛指道德或抽象意义上的“完美”。
- source_word: יְבִיאֶנָּה
  choice: 就要献一只
  rationale: 该动词带阴性单数宾语后缀，回指母羊羔；“就要献一只”既体现法规的要求，也在自然汉语中明确回指祭牲。
theological_decisions:
- issue: 祭祀法规中חַטָּאת的译法
  choice: 赎罪祭
  alternative: 洁净祭
  rationale: 该词既与罪的处理有关，也可突出除去礼仪污秽、恢复洁净的作用。正文采用中文传统且易懂的祭名“赎罪祭”，但不据此排除“洁净祭”所表达的真实语义侧重，故以脚注保存这一张力。
translation_notes:
  register: 采用现代、庄重而易懂的法规体。“如果……就要……”清楚呈现条件与义务；避免逐词硬译“他的供物”造成汉语重复。脚注标记[a]已置于正文“赎罪祭”之后。
