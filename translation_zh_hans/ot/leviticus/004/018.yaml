source:
  edition: WLC
  text: וּ/מִן הַ/דָּ֞ם יִתֵּ֣ן עַל קַרְנֹ֣ת הַ/מִּזְבֵּ֗חַ אֲשֶׁר֙ לִ/פְנֵ֣י יְהוָ֔ה אֲשֶׁ֖ר בְּ/אֹ֣הֶל מוֹעֵ֑ד וְ/אֵ֣ת כָּל הַ/דָּ֗ם יִשְׁפֹּךְ֙ אֶל יְסוֹד֙ מִזְבַּ֣ח הָ/עֹלָ֔ה אֲשֶׁר פֶּ֖תַח אֹ֥הֶל מוֹעֵֽד־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/018.yaml
  text: And from the blood he shall put some on the horns of the altar that is before Yahweh[a], which is in the tent of meeting, and all the blood he shall pour out at the base of the altar of burnt offering, which is at the entrance of the tent of meeting.
translation:
  language: zh_hans
  text: 他要把一些血抹在会幕内、耶和华面前那座坛的坛角上；又要把所有的血倒在位于会幕入口处的那座燔祭坛的坛脚那里。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּמִן הַדָּם
  choice: 取一些血
  rationale: 希伯来文直译为“从血中”，在此具有部分义；译出“一些”，并与后文“所有的血”形成原文所含的对照。
- source_word: יִתֵּן
  choice: 抹在
  rationale: נתן 基本义为“放、置”。在把血置于坛角这一祭礼语境中，“抹在”是自然且明确的汉语表达，同时不过度技术化。
- source_word: קַרְנֹת הַמִּזְבֵּחַ
  choice: 坛角
  rationale: 保留祭坛四角突起部分的传统、准确称谓，不泛化为“凸起”。
- source_word: אֲשֶׁר לִפְנֵי יְהוָה
  choice: 耶和华面前
  rationale: 保留 לִפְנֵי 的空间意义，也不排除“在其临在中”的礼仪含义。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的专名“耶和华”呈现四字神名，而不以称号“主”代替。
- source_word: אֹהֶל מוֹעֵד
  choice: 会幕
  rationale: 这是现代中文中对以色列圣所帐幕的通行称谓，简洁自然；其会见功能已约定俗成地包含在该术语中。
- source_word: וְאֵת כָּל הַדָּם
  choice: 又要把所有的血
  rationale: 原文明确说“所有的血”，故不改写为解释性的“剩下的血”，即使语境表明这是抹坛角之后所余的血。
- source_word: יִשְׁפֹּךְ
  choice: 倒
  rationale: 准确表达 שׁפך 的“倾倒”动作，符合现代汉语祭礼叙述。
- source_word: אֶל יְסוֹד
  choice: 在……坛脚那里
  rationale: יְסוֹד 指祭坛的基部；“坛脚”在汉语中具体、自然，并传达血倒向祭坛底部的位置。
- source_word: מִזְבַּח הָעֹלָה
  choice: 燔祭坛
  rationale: 保留 עֹלָה 的标准祭祀术语“燔祭”，并采用简洁的复合称谓。
- source_word: אֲשֶׁר פֶּתַח אֹהֶל מוֹעֵד
  choice: 会幕入口处的
  rationale: 将关系从句自然地前置为汉语定语，准确表达祭坛位于会幕入口处。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用四字神名。简体中文正文采用广为人知且具有专名功能的“耶和华”；“雅威”更接近常见学术重构的读音，但在普通中文读者中较不通行。
- issue: “所有的血”是否解释为“剩下的血”
  choice: 所有的血
  alternative: 剩下的血
  rationale: 尽管礼仪顺序显示所倒的是抹坛角之后所余的血，原文仍使用 כָּל“所有的”；正文保留其措辞和表面张力，不以解释替代原文。
translation_notes:
  register: 采用现代、庄重而易懂的礼仪叙事语体。句式依照汉语习惯重组两个地点修饰语，同时保留先抹坛角、后倒血的动作顺序。无脚注，因此正文不设脚注标记。
