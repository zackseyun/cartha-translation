base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/024.yaml
  text: And he shall lay his hand on the head of the goat and slaughter it in the place where they slaughter the burnt offering before Yahweh[a]. It is a sin offering.
translation:
  language: zh_hans
  text: 他要在雅威面前、宰燔祭牲的地方宰这只公山羊。这是赎罪祭[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“洁净祭”。希伯来语 חַטָּאת 既可指“罪”，也可指为除去罪或不洁而献的祭。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְסָמַךְ יָדוֹ
  choice: 他要把手按在
  rationale: 献祭语境中的固定动作；“按在”自然清楚，并保留原文单数“手”。
- source_word: עַל רֹאשׁ הַשָּׂעִיר
  choice: 公山羊的头上
  rationale: שָׂעִיר在此指作为祭牲的公山羊；明确译出性别比泛称“山羊”更贴近词义。
- source_word: וְשָׁחַט אֹתוֹ
  choice: 把它宰了
  rationale: שׁחט指宰杀祭牲；“宰”既自然，又保留礼仪语境。
- source_word: בִּמְקוֹם אֲשֶׁר יִשְׁחַט אֶת הָעֹלָה
  choice: 宰燔祭牲的地方
  rationale: 保留原文以主动形式描述指定地点的含义；汉语无需补出不定主语。“燔祭牲”清楚表明这里所宰的是祭牲。
- source_word: לִפְנֵי יְהוָה
  choice: 在雅威面前
  rationale: 直译方位及礼仪表达，并以“雅威”呈现四字神名。
- source_word: חַטָּאת
  choice: 赎罪祭
  rationale: 这是现代中文中对该利未记祭类的通行、易懂名称；原词也可从洁净功能理解，故在脚注保留另一译法。
- source_word: הוּא
  choice: 这是
  rationale: 作为系词性判断，给前述祭牲定类；“这是”在中文律例文体中自然明确。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”较接近学界通常采用的拟音，同时不以称号代替专名。
- issue: חַטָּאת 的祭仪含义
  choice: 赎罪祭
  alternative: 洁净祭
  rationale: 该词可指罪，也可指处理罪与不洁的祭物或祭仪。“赎罪祭”作为主文译名通行且清楚，但脚注保留“洁净祭”，避免消除其功能上的语义张力。
translation_notes:
  register: 采用现代、庄重而易懂的律例文体。以“他要”表达未完成式在法规语境中的指令性；调整地点短语次序，使中文流畅，同时保持“在雅威面前”与宰祭地点的关联。
