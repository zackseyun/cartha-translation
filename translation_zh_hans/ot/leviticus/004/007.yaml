  text: וְ/נָתַן֩ הַ/כֹּהֵ֨ן מִן הַ/דָּ֜ם עַל קַ֠רְנוֹת מִזְבַּ֨ח קְטֹ֤רֶת הַ/סַּמִּים֙ לִ/פְנֵ֣י יְהוָ֔ה אֲשֶׁ֖ר בְּ/אֹ֣הֶל מוֹעֵ֑ד וְ/אֵ֣ת כָּל דַּ֣ם הַ/פָּ֗ר יִשְׁפֹּךְ֙ אֶל יְסוֹד֙ מִזְבַּ֣ח הָ/עֹלָ֔ה אֲשֶׁר פֶּ֖תַח אֹ֥הֶל מוֹעֵֽד־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/007.yaml
  text: And the priest shall put some of the blood on the horns of the altar of fragrant incense before Yahweh[a], which is in the tent of meeting, and he shall pour out all the bull’s blood at the base of the altar of burnt offering[b], which is at the entrance of the tent of meeting.
translation:
  language: zh_hans
  text: 祭司要把一些血抹在会幕内、雅威面前那座香坛的坛角上；又要把公牛所有的血倒在会幕门口燔祭坛的坛基上。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְנָתַן
  choice: 抹在
  rationale: נתן本义宽泛，可指“放、置”。这里血被施于坛角，“抹在”自然呈现具体礼仪动作，又不过度说明手段。
- source_word: מִן הַדָּם
  choice: 一些血
  rationale: 介词מִן在此表示部分，说明祭司从公牛的血中取一部分用于坛角。
- source_word: קַרְנוֹת
  choice: 坛角
  rationale: 指祭坛四角向上突出的角状部分；“坛角”是准确而简明的礼仪用语。
- source_word: מִזְבַּח קְטֹרֶת הַסַּמִּים
  choice: 焚烧芬芳香料的坛
  rationale: 该结构指用于焚香料之香的祭坛。此译保留“香料”的描述性含义，同时比生硬的“香料香坛”更符合现代汉语。
- source_word: לִפְנֵי יְהוָה
  choice: 雅威面前
  rationale: 保留空间与礼仪上的“在……面前”之意，并将神名直接音译为“雅威”。
- source_word: אֹהֶל מוֹעֵד
  choice: 会幕
  rationale: 这是该礼仪场所的通行中文名称，简洁且为普通读者熟悉。
- source_word: כָּל דַּם הַפָּר
  choice: 公牛所有的血
  rationale: 严格保留希伯来文“公牛所有的血”，不在正文中擅自补入“剩下的”；上下文所蕴含的剩余之意在脚注说明。
- source_word: יִשְׁפֹּךְ
  choice: 倒
  rationale: שפך在此表示把血倾倒出来；“倒”是现代汉语中自然、准确的动作表达。
- source_word: אֶל יְסוֹד
  choice: 在……坛基处
  rationale: יְסוֹד指基础或底座。“坛基处”清楚表达血被倒在祭坛底部的位置。
- source_word: מִזְבַּח הָעֹלָה
  choice: 燔祭坛
  rationale: 指献燔祭所用的祭坛；“燔祭坛”准确、凝练，并保留传统礼仪术语。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名。译作“雅威”保留其作为以色列之神专名的性质，而不以称号代替。
- issue: 前面已取部分血之后，כָּל דַּם הַפָּר如何表达
  choice: 正文直译“公牛所有的血”，脚注说明按上下文指余下的血
  alternative: 公牛剩下的所有血
  rationale: 原文没有明说“剩下的”，但礼仪次序显然已先使用了一部分。正文保留原文形式，脚注交代语境，既不制造表面矛盾，也不把解释直接写入经文。
translation_notes:
  register: 采用现代、庄重而清楚的礼仪叙述。“会幕”“坛角”“燔祭坛”等保留已广为理解的经文术语；句子分为两句，使连续动作更易阅读。
