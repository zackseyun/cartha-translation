  text: וְ/טָבַ֧ל הַ/כֹּהֵ֛ן אֶצְבָּע֖/וֹ מִן הַ/דָּ֑ם וְ/הִזָּ֞ה שֶׁ֤בַע פְּעָמִים֙ לִ/פְנֵ֣י יְהוָ֔ה אֵ֖ת פְּנֵ֥י הַ/פָּרֹֽכֶת־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/017.yaml
  text: Then the priest shall dip his finger in some of the blood and sprinkle some of the blood seven times before Yahweh[a], in front of the curtain.
translation:
  language: zh_hans
  text: 祭司要把手指蘸在血里，在雅威面前，朝着圣所的幔子[a]洒血七次。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “幔子”指圣所中用来分隔神圣空间的帘幕。
    reason: 说明礼仪建筑术语 פָּרֹכֶת 的具体所指。
lexical_decisions:
- source_word: וְטָבַל
  choice: 要……蘸
  rationale: 该动词表示“蘸、浸入”；在连续的礼仪指令中，用“要”自然表达程序性的后续动作。
- source_word: הַכֹּהֵן
  choice: 祭司
  rationale: כהן在献祭律例中的标准对应词，定指意义由上下文自然体现。
- source_word: אֶצְבָּעוֹ
  choice: 他的手指
  rationale: 保留原文单数及第三人称所属关系；在正文中因“祭司”已明确，译作“手指”即可自然承接。
- source_word: מִן הַדָּם
  choice: 在一些血里
  rationale: מן在这里具有部分意义，表示从这些血中取用一部分；“在一些血里”既保留部分性，也符合“蘸”的汉语搭配。
- source_word: וְהִזָּה
  choice: 洒血
  rationale: הזה在祭司礼仪语境中指洒出液体，尤其是血；汉语补出由上下文明确的宾语“血”，避免代词指向含混。
- source_word: שֶׁבַע פְּעָמִים
  choice: 七次
  rationale: 直接保留原文数目和动作次数。
- source_word: לִפְנֵי יְהוָה
  choice: 在雅威面前
  rationale: לִפְנֵי表示“在……面前／临在中”；此处采用自然且庄重的“在雅威面前”。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见音译呈现四字神名，保留其专名性质，不以称号替代。
- source_word: אֵת פְּנֵי הַפָּרֹכֶת
  choice: 朝着幔子
  rationale: 原短语涉及幔子的正面或前方；在洒血动作之后，“朝着幔子”较自然地表达方向，同时不强断血是否直接落在幔子上。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。译作“雅威”保留其作为以色列之神专名的功能，也不把专名改成称号。
- issue: 洒血与幔子的空间关系
  choice: 朝着幔子
  alternative: 在幔子前；洒在幔子前面
  rationale: אֵת פְּנֵי הַפָּרֹכֶת 的句法可表达面向幔子正面的方向。采用“朝着”保留礼仪动作的方向性，避免额外断定血落在幔子上或地面上。
- issue: פָּרֹכֶת 的译法
  choice: 幔子
  alternative: 帘子；幔
  rationale: 该词指圣所中分隔神圣空间的内幔。“幔子”在现代汉语中可懂，同时保留礼仪建筑语境。
translation_notes:
  register: 采用现代、庄重而易懂的律法叙述语体。“祭司要……”体现礼仪程序；“蘸”“洒血”简洁明确。“在雅威面前，朝着幔子”保留原文两个空间表达之间的张力。脚注标记置于整句末，正文中的“幔子”与脚注直接对应。
