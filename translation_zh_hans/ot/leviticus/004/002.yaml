revisions:
- from: “你要告诉以色列人[a]说：如果有人无意中犯了罪，违背了耶和华的任何一条禁令，做了其中一件不可做的事[b]，”
  to: “你要对以色列人[a]说：若有人无意中犯罪，违背耶和华的一条诫命，就是不可做的事，做了其中一件[b]，”
  rationale: 修订正式传话公式，并重组后半句以清楚对应希伯来语：所违背的是耶和华的一条“不可做的”诫命，而“其中一件”指这些被禁止的事项之一。保留原有神名、条件句未完成式的法律语气，以及“无意中”的宽泛含义。脚注锚点及内容均予保留。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T04:50:31Z'
