  text: דַּבֵּ֞ר אֶל בְּנֵ֣י יִשְׂרָאֵ֘ל לֵ/אמֹר֒ נֶ֗פֶשׁ כִּֽי תֶחֱטָ֤א בִ/שְׁגָגָה֙ מִ/כֹּל֙ מִצְוֺ֣ת יְהוָ֔ה אֲשֶׁ֖ר לֹ֣א תֵעָשֶׂ֑ינָה וְ/עָשָׂ֕ה מֵ/אַחַ֖ת מֵ/הֵֽנָּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/002.yaml
  text: 'Speak to the sons of Israel[a], saying: If a person sins unintentionally in regard to any of the commandments of Yahweh concerning things that should not be done, and does one of them[b],'
translation:
  language: zh_hans
  text: “你要对以色列人[a]说：若有人无意中犯罪，违背耶和华的一条诫命，就是不可做的事，做了其中一件[b]，”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语直译为“以色列的众子”，这里指以色列人。
    reason: lexical_alternative
  - marker: b
    text: “无意中”也可译作“误犯”或“因过失”；指并非公然、蓄意悖逆而犯的罪。
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר
  choice: 你要告诉
  rationale: 这是向摩西发出的命令；现代汉语法律宣告语境中，“你要告诉”自然、直接。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 希伯来语直译为“以色列的众子”，在此泛指以色列全体民众；“以色列人”准确且符合现代汉语习惯。
- source_word: נֶפֶשׁ
  choice: 有人
  rationale: 此处指一个人，并非特指非物质的“灵魂”；条件句中译为“有人”最自然。
- source_word: בִשְׁגָגָה
  choice: 无意中
  rationale: 表示出于疏忽或不知情而犯错，与公然、故意悖逆相对；“无意中”不额外断定具体成因。
- source_word: מִכֹּל מִצְוֺת יְהוָה
  choice: 违背了耶和华的任何一条禁令
  rationale: מן结构在这里表达针对诫命的越犯；结合后面的否定关系从句，这些具体指不可做之事的禁令。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的神圣四字名音译，而不以“主”替代专名。
- source_word: אֲשֶׁר לֹא תֵעָשֶׂינָה
  choice: 不可做的事
  rationale: 保留希伯来语非人称、被动式的禁止含义，同时使中文简洁自然。
- source_word: וְעָשָׂה מֵאַחַת מֵהֵנָּה
  choice: 做了其中一件
  rationale: 指实际做出前述禁令所禁止的事项；保持原文条件句的连续结构。
theological_decisions:
- issue: 无意之罪的性质
  choice: 无意中犯了罪
  alternative: 误犯了罪
  rationale: בִשְׁגָגָה指非蓄意、因疏忽或错误而犯的罪；“无意中”保留范围，不把它缩限为单纯误操作。
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用神的专名而非称号；中文采用广为人知的“耶和华”，同时保留其专名性质。
- issue: מִצְוֺת 在本句中的范围
  choice: 禁令
  alternative: 诫命
  rationale: 后置关系从句明确限定为“不可做”的命令，因此译作“禁令”能准确表达此处所指，又不把全部诫命都等同于禁令。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语，保留法律条文式条件句。用“以色列人”避免生硬的字面表达；用“禁令”承接“不可做”的限定。
