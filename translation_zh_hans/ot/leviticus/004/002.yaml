  naturalness: “你要告诉……说”可懂，但在庄重的经文及法律式宣告中，“你要对……说”更自然、凝练。改为“若有人……”也更符合现代汉语书面条件句。
  terminology: “耶和华”恰当地保留了 יהוה 这一专名。“以色列人”自然准确。将 מִצְוֺת 译作“诫命”，并以“就是不可做的事”表达后置限定，可避免将其先行窄化为“禁令”，同时忠实保留原文的限定。
