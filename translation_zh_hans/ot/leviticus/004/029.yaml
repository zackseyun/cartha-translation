  text: וְ/סָמַךְ֙ אֶת יָד֔/וֹ עַ֖ל רֹ֣אשׁ הַֽ/חַטָּ֑את וְ/שָׁחַט֙ אֶת הַ֣/חַטָּ֔את בִּ/מְק֖וֹם הָ/עֹלָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/029.yaml
  text: And he shall lay his hand on the head of the sin offering and slaughter the sin offering in the place of the burnt offering[a].
translation:
  language: zh_hans
  text: 他要把他的手按在赎罪祭牲的头上，在宰杀燔祭牲的地方宰杀这赎罪祭牲[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“洁净祭牲”。希伯来语“חטאת”可指与罪及洁净有关的祭。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְסָמַךְ אֶת יָדוֹ
  choice: 他要把手按在
  rationale: סמך在献祭礼仪中指把手放在或按在祭牲上；原文“手”为单数，因此保留单数，不泛化为双手。
- source_word: עַל רֹאשׁ
  choice: 头上
  rationale: 直接、自然地表达手与祭牲头部的空间关系，并保留礼仪动作的具体性。
- source_word: הַחַטָּאת
  choice: 赎罪祭牲
  rationale: חטאת在此指为罪及洁净而献的祭牲；“赎罪祭牲”既保留传统祭名，又明确此处所按、所宰的是祭牲。其“洁净祭”理解在脚注中保留。
- source_word: וְשָׁחַט
  choice: 宰杀
  rationale: שחט是宰杀祭牲的礼仪用语；“宰杀”比一般的“杀”更准确，也符合现代汉语表达。
- source_word: בִּמְקוֹם הָעֹלָה
  choice: 在宰燔祭牲的地方
  rationale: מקום表示指定地点；补出汉语所需的“宰”和“祭牲”，清楚表明这里是宰杀燔祭牲的地点，而不是以赎罪祭取代燔祭。
- source_word: הָעֹלָה
  choice: 燔祭牲
  rationale: עלה是全烧献上的祭；“燔祭”是准确而通行的礼仪术语，此处因涉及宰杀地点而用“燔祭牲”。
theological_decisions:
- issue: חטאת在献祭条例中的译法
  choice: 赎罪祭牲
  alternative: 洁净祭牲
  rationale: 该词既与罪有关，也可突出礼仪洁净的功用。正文采用现代中文读者较熟悉的“赎罪祭牲”，但以脚注保留“洁净祭牲”的真实词义可能性，不把两者的张力消除。
- issue: 礼仪条例中连续动词的汉语时体
  choice: 他要……宰杀……
  alternative: 他就……宰杀了……
  rationale: 虽然希伯来语形式可有叙事色彩，本节处于规范性礼仪程序中；用“要”自然表达规定和指令，同时不增加超出原文的情态。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“赎罪祭牲”与“燔祭牲”使动作对象清楚；句式按汉语习惯整合，同时保留原文手为单数、礼仪动作和指定地点。
