  yaml_path: translation/ot/leviticus/004/011.yaml
  text: But the hide of the bull[a], and all its flesh[c][b], with its head and with its legs and its entrails and its dung—
translation:
  language: zh_hans
  text: 公牛[a]的皮[b]和所有的肉，连同它的头、腿、内脏[c]和粪——
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “公牛”或译“公牛犊”。
    reason: lexical_alternative
  - marker: b
    text: “皮”或译“皮张”。
    reason: lexical_alternative
  - marker: c
    text: “内脏”也可译作“内部器官”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַפָּר
  choice: 公牛
  rationale: פַּר指公牛，也可特指较年轻的公牛；此处上下文已明确祭牲，译作“公牛”自然且准确。
- source_word: עוֹר
  choice: 皮
  rationale: 指被宰祭牲的皮；现代汉语用“皮”简明自然，不必添加原文没有的处置含义。
- source_word: כָּל בְּשָׂרוֹ
  choice: 全部的肉
  rationale: בָּשָׂר在这里具体指祭牲的肉体；“肉”保留其具体解剖意义，比笼统的“身体”更贴近原文。
- source_word: עַל רֹאשׁוֹ וְעַל כְּרָעָיו
  choice: 包括它的头、腿
  rationale: 此处עַל用于列举一并处理的部分，译作“包括”符合汉语表达；כְּרָעַיִם指牲畜的腿或小腿。
- source_word: קִרְבּוֹ
  choice: 内脏
  rationale: קֶרֶב本义为内部、里面的部分，在祭牲解剖语境中译作“内脏”最清楚。
- source_word: פִרְשׁוֹ
  choice: 粪
  rationale: פֶּרֶשׁ指排泄物或粪便；“粪”直接准确，也避免与“内脏”混淆。
