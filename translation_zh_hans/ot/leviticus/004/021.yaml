base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/021.yaml
  text: He shall bring the bull outside the camp and burn it[a], just as he burned the first bull. It is the sin offering for the assembly.
translation:
  language: zh_hans
  text: 他要把公牛带到营外焚烧[a]，像焚烧先前那头公牛一样；这是会众的赎罪祭。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “赎罪祭”也可译作“洁净祭”。希伯来语原词既可强调处理罪，也可强调除去污秽。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוֹצִיא
  choice: 牵到……外
  rationale: 使役式在此表示把祭牲带出营地；“牵到”符合公牛仍作为整体被移送的语境，也比笼统的“带到”更具体自然。
- source_word: הַפָּר
  choice: 公牛
  rationale: פַּר指公牛或年轻公牛；“公牛”准确、简洁，并与上下文祭牲一致。
- source_word: אֶל מִחוּץ לַמַּחֲנֶה
  choice: 到营外
  rationale: 该介词组合表示移往营地界线之外；“到营外”是自然的现代汉语。
- source_word: וְשָׂרַף אֹתוֹ
  choice: 焚烧
  rationale: שׂרף意为烧、焚烧；“焚烧”庄重且适合祭祀法规语体。
- source_word: כַּאֲשֶׁר שָׂרַף
  choice: 像……一样
  rationale: כַּאֲשֶׁר在此引出方式上的比较，表明处理方法与前一头公牛相同。
- source_word: הַפָּר הָרִאשׁוֹן
  choice: 先前那头公牛
  rationale: רִאשׁוֹן在此回指前文已处理的公牛；“先前那头”比“第一头”更自然地表达篇章回指。
- source_word: חַטַּאת
  choice: 赎罪祭
  rationale: 在利未记的祭祀法规中，该词指针对罪并处理相关不洁的祭物或祭礼；“赎罪祭”是普通中文读者较易识别的传统术语，脚注保留“洁净祭”的词义可能。
- source_word: הַקָּהָל
  choice: 会众
  rationale: קָהָל指聚集的以色列共同体；“会众”简洁地保留其群体性和礼仪语境。
- source_word: הוּא
  choice: 这是
  rationale: 该代词构成判断句，将这头公牛认定为会众的赎罪祭；译作“这是”符合现代汉语表达。
theological_decisions:
- issue: 祭祀语境中חַטַּאת的译法
  choice: 赎罪祭
  alternative: 洁净祭
  rationale: 该词既与罪有关，也可突出祭礼除去污秽的功能。本节明确指祭牲，因此正文采用读者熟悉的“赎罪祭”，但以脚注保留“洁净祭”这一不应被抹去的词义侧重。
translation_notes:
  register: 采用现代、庄重而易懂的祭祀法规语体。“先前那头公牛”清楚回指前文；分号保留末句对祭牲身份的概括判断。
