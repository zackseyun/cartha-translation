lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: 说
  rationale: 该动词在此引出新的神谕段落。现代汉语以“对……说”自然、准确地表达这一固定叙事公式，无须机械区分英语的 spoke 与 said。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 这是四字神名 YHWH；“耶和华”是现代中文圣经语境中通行且可辨识的音译，保留其作为专名的性质，而不以“主”这一称号替代。
- source_word: אֶל־מֹשֶׁה
  choice: 对摩西
  rationale: 介词 אֶל 标明言说所指向的对象；“对摩西”符合现代汉语表达。人名 מֹשֶׁה 采用通行译名“摩西”。
- source_word: לֵאמֹר
  choice: 说：
  rationale: 该不定式用于引出随后话语的内容。中文用“说：”及冒号即可自然体现其功能，避免重复译成“说道”。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文明确使用四字神名，而非“主”的称号。正文采用中文读者最熟悉的专名形式“耶和华”，脚注注明其希伯来文字母及另一常见音译“雅威”，不把对具体发音的判断绝对化。
translation_notes:
  register: 采用现代、庄重而简洁的叙事语言。“耶和华对摩西说：”既保留希伯来文神谕引言的正式感，也符合自然的现代汉语；脚注标记置于引言末尾、冒号之前。
