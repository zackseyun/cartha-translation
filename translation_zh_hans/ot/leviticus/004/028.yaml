  text: א֚וֹ הוֹדַ֣ע אֵלָ֔י/ו חַטָּאת֖/וֹ אֲשֶׁ֣ר חָטָ֑א וְ/הֵבִ֨יא קָרְבָּנ֜/וֹ שְׂעִירַ֤ת עִזִּים֙ תְּמִימָ֣ה נְקֵבָ֔ה עַל חַטָּאת֖/וֹ אֲשֶׁ֥ר חָטָֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/028.yaml
  text: Or if the sin that he has committed is made known to him[b][a], then he shall bring as his offering for the sin that he has committed a female goat without blemish.
translation:
  language: zh_hans
  text: 或是他得知自己所犯的罪[a]，就要为自己所犯的罪献上一只没有残疾的母山羊作供物。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文为被动式，意为“那罪被带到他的知悉中”；既可能指有人把这罪告诉他，也可能指他后来察觉了这罪。
    reason: 说明希伯来语被动形式所保留的词义范围。
lexical_decisions:
- source_word: א֚וֹ
  choice: 或是
  rationale: 承接前文律例中的另一种情形；汉语用“或是”自然表达并列的备选情况。
- source_word: הוֹדַ֣ע אֵלָ֔יו
  choice: 他得知
  rationale: 希伯来语是使役被动，表示这罪进入他的认知。正文采用自然的现代汉语“他得知”，既可涵盖别人告知，也可涵盖事情变得为他所知；脚注说明原文的被动语气和可能范围。
- source_word: חַטָּאתוֹ אֲשֶׁר חָטָא
  choice: 自己所犯的罪
  rationale: 此处 חַטָּאת 指犯罪行为，不是赎罪祭；“自己所犯的罪”准确而符合现代汉语表达。
- source_word: וְהֵבִיא
  choice: 就要……献上
  rationale: 在律法条文中表达随后必须采取的规定性行动；“就要”清楚呈现条件与后果的衔接。
- source_word: קָרְבָּנוֹ
  choice: 作供物
  rationale: קָרְבָּן 是带来献给上帝的供物；“作供物”保留献祭语境，同时避免误将本节的 חַטָּאת 译作某一种祭物名称。
- source_word: שְׂעִירַת עִזִּים נְקֵבָה
  choice: 一只母山羊
  rationale: 原文以阴性形式并另用 נְקֵבָה 明说性别。汉语“母山羊”已明确表达，不作生硬重复。
- source_word: תְּמִימָה
  choice: 没有残疾的
  rationale: 在献祭牲畜的语境中指没有身体缺陷；“没有残疾”是清楚、庄重且易懂的固定表达。
- source_word: עַל חַטָּאתוֹ אֲשֶׁר חָטָא
  choice: 为自己所犯的罪
  rationale: עַל 在此说明供物与罪的关系；“为……罪”不把介词过度限定为单一的因果或目的含义。
theological_decisions:
- issue: 本节两处 חַטָּאת 的含义
  choice: 均译为“罪”
  alternative: 把后一处译为“赎罪祭”
  rationale: 本节以 קָרְבָּנוֹ 指称所献的供物，并具体说明为母山羊；两处 חַטָּאתוֹ 都由 אֲשֶׁר חָטָא 修饰，所指是献祭者犯下的罪，而不是祭物名称。
- issue: 得知犯罪的方式
  choice: 正文用含义较宽的“他得知”，脚注保留被动语气所容纳的不同可能
  alternative: 明确译成“有人把他的罪告诉他”或“他自己意识到”
  rationale: 原文只说这罪被带入他的认知，并未确定是别人告知还是本人察觉；不应在译文中排除其中一种可能。
translation_notes:
  register: 采用现代、庄重而易懂的律法条文语体。“供物”保持祭祀语境中的术语感；句式简洁，并保留原文重复“自己所犯的罪”的强调。
