  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: אֽוֹ הוֹדַ֤ע אֵלָי/ו֙ חַטָּאת֔/וֹ אֲשֶׁ֥ר חָטָ֖א בָּ֑/הּ וְ/הֵבִ֧יא אֶת קָרְבָּנ֛/וֹ שְׂעִ֥יר עִזִּ֖ים זָכָ֥ר תָּמִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/023.yaml
  text: or if the sin that he has committed is made known to him[a], then he shall bring as his offering a male goat without blemish.
translation:
  language: zh_hans
  text: 或是他得知自己所犯的罪[a]，他就要献上一只没有残疾的公山羊作供物。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或较直译：“或是他所犯的罪被告知他。”
    reason: 保留希伯来语使役被动结构的形式备选译法。
lexical_decisions:
- source_word: אֽוֹ
  choice: 或是
  rationale: 承接上一节的律例条件，保留其选择或补充关系。
- source_word: הוֹדַע אֵלָיו
  choice: 有人把……告诉他
  rationale: Hophal 形态表达使役被动含义，即有关罪的信息被传达给他；汉语用不定施事者主动句更自然，同时没有暗示他只是自行察觉。
- source_word: חַטָּאתוֹ
  choice: 他所犯的罪
  rationale: 此处指过犯而非赎罪祭；后接关系从句说明这是他犯下的罪。
- source_word: אֲשֶׁר חָטָא בָּהּ
  choice: 所犯的
  rationale: 希伯来语介词 בָּהּ 与 חטא 连用具有习语性；现代汉语以“所犯的罪”自然表达，不机械译出介词。
- source_word: וְהֵבִיא
  choice: 他就要献上
  rationale: 律例语境中的连接词加完成式表达条件成立后的规定结果；“就要”兼顾承接和义务语气。
- source_word: קָרְבָּנוֹ
  choice: 作供物
  rationale: 指带到上帝面前献上的供物；“作供物”与“献上”搭配自然，并区别于本句中的罪。
- source_word: שְׂעִיר עִזִּים זָכָר
  choice: 一只公山羊
  rationale: שְׂעִיר עִזִּים 指山羊，זָכָר 明确为雄性；汉语“公山羊”简洁而准确。
- source_word: תָּמִים
  choice: 没有残疾的
  rationale: 祭牲语境中指没有身体缺陷；这是现代汉语清楚且庄重的表达。
theological_decisions:
- issue: חַטָּאת 在本节中的含义
  choice: 罪／过犯
  alternative: 赎罪祭
  rationale: 虽然该词在利未记中也可指赎罪祭，但“他所犯的”这一从句表明此处所指是过犯；祭物随后另以 קָרְבָּנוֹ 表示。
- issue: הוֹדַע אֵלָיו 的认识来源
  choice: 罪被别人告知他
  alternative: 他自己意识到所犯的罪
  rationale: Hophal 形态侧重这事被使他知道，而非明确描述他独自醒悟；译文保留信息从外而来的被动／使役被动含义。
translation_notes:
  register: 采用现代、庄重而易懂的律例语言。“公山羊”“没有残疾”符合普通读者的自然表达；脚注保留原文较形式对应的被动措辞。
