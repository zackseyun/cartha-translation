    rationale: וְאֶת כָּל־דָּמָהּ直译为“它所有的血”。上下文确实意味着施抹后所余的血，但原文未用“其余”；应避免在正文中消除这一表述层面的张力。
  - severity: low
    issue: “赎罪祭牲的血”增加“牲”
    rationale: הַחַטָּאת在此指赎罪祭／洁净祭这一祭物；虽本段的祭物为牲畜，但“祭牲”不是本节名词本身所明说的限定，译作“赎罪祭的血”更贴近原文。
  - severity: low
    issue: “祭坛脚那里”措辞口语且不精确
    rationale: יְסוֹד指坛的基部或坛基；“祭坛的坛基”更自然、庄重，并保留其祭仪建筑含义。
  revised_text: 祭司要用指头蘸些赎罪祭[a]的血，抹在燔祭坛的角上；又要把它所有的血倒在祭坛的坛基。
