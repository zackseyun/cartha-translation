revisions:
- from: 祭司要用指头蘸些赎罪祭[a]牲的血，抹在燔祭坛的角上；其余的血都要倒在祭坛脚那里。
  to: 祭司要用指头蘸些赎罪祭[a]的血，抹在燔祭坛的角上；又要把它所有的血倒在祭坛的坛基。
  rationale: 修订恢复“所有的血”这一原文总括表述，删去正文中并非必要的“牲”字，并以“坛基”准确自然地翻译祭坛的基部；保留既有术语及词义脚注。
