base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/034.yaml
  text: Then the priest shall take some of the blood of the sin offering with his finger and put it on the horns of the altar of burnt offering[a], and he shall pour out all its blood at the base of the altar.
translation:
  language: zh_hans
  text: 祭司要用指头蘸些赎罪祭[a]的血，抹在燔祭坛的角上；又要把它所有的血倒在祭坛的坛基。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“洁净祭”。希伯来语这个词可指与罪及礼仪洁净有关的祭。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַח
  choice: 要……蘸些
  rationale: 此处的 waw + qatal 延续祭仪指令的步骤。结合“用指头”和部分血液，现代汉语用“蘸些”自然表达取血并施抹的动作。
- source_word: הַכֹּהֵן
  choice: 祭司
  rationale: 准确对应执行礼仪的特定祭司。
- source_word: מִדַּם הַחַטָּאת
  choice: 些赎罪祭牲的血
  rationale: מִן 在此具有部分义；חַטָּאת 在祭祀语境中指祭物。“祭牲”明确代词所指是献上的牲畜，并避免把“赎罪祭的血”误解为抽象事物。
- source_word: בְּאֶצְבָּעוֹ
  choice: 用指头
  rationale: 介词 בְּ 表示工具或方式。
- source_word: וְנָתַן
  choice: 抹
  rationale: נתן 基本义为放、置；在把血施于坛角的礼仪语境中，“抹”是自然且具体的汉语表达。
- source_word: עַל קַרְנֹת מִזְבַּח הָעֹלָה
  choice: 在燔祭坛的角上
  rationale: 保留坛的凸起部分“角”这一祭仪形象，并自然表达该坛与燔祭的关系。
- source_word: וְאֶת כָּל דָּמָהּ
  choice: 其余的血都
  rationale: 希伯来文直译为“它全部的血”；由于前面已取用一部分，汉语用“其余的血都”清楚传达程序关系和总括含义。
- source_word: יִשְׁפֹּךְ
  choice: 要倒
  rationale: 表达有意进行的祭仪动作，不带意外泼洒之意。
- source_word: אֶל יְסוֹד הַמִּזְבֵּחַ
  choice: 在祭坛脚那里
  rationale: יְסוֹד 指祭坛的基部；“祭坛脚那里”是清楚、具体且易懂的现代汉语。
theological_decisions:
- issue: 祭祀律例中 חַטָּאת 的译法
  choice: 赎罪祭
  alternative: 洁净祭
  rationale: 这里确定是指与罪和礼仪洁净有关的祭物，而非抽象的“罪”。“赎罪祭”是中文读者熟悉且符合上下文的名称；“洁净祭”能凸显洁净功能，作为脚注保留，以免消除原词的语义张力。
translation_notes:
  register: 采用现代、庄重而易懂的祭仪叙述。“蘸些……血，抹在……”符合汉语动作顺序；分号区分施血与倒血两个连续步骤。
