base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/005.yaml
  text: And the anointed priest shall take some of the bull's blood and bring it into the tent of meeting[a][b].
translation:
  language: zh_hans
  text: 受膏的祭司要取些公牛的血，带进会幕[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 较直译：“取公牛血中的一部分。”这里的希伯来语介词很可能表示从整体中取一部分。
    reason: lexical_alternative
  - marker: b
    text: 希伯来语直译为“带到会幕”；根据接下来的礼仪是在会幕内进行，正文译作“带进会幕”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַח
  choice: 要取
  rationale: 在献祭规程中，连词加完成式承接前文并表达下一步指令；汉语用“要取”自然体现程序性要求，无须机械译出句首连接词。
- source_word: הַכֹּהֵן הַמָּשִׁיחַ
  choice: 受膏的祭司
  rationale: 贴近希伯来语“被膏抹的祭司”，保留其受膏身份，不以解释性的“大祭司”取代原文，也不引入后来的弥赛亚含义。
- source_word: מִדַּם הַפָּר
  choice: 些公牛的血
  rationale: 介词מִן在此很可能具有部分义，指取公牛血中的一部分；“取些……血”符合现代汉语习惯。
- source_word: וְהֵבִיא אֹתוֹ
  choice: 带进
  rationale: 宾语后缀所指是前述的血；汉语中不必重复“它”。“带”可自然表示祭司将血携往指定地点。
- source_word: אֶל אֹהֶל מוֹעֵד
  choice: 进会幕
  rationale: אֶל本身通常表示“到、向”，但随后礼仪在幕内进行，故正文用“进”表达语境所指的进入，同时以脚注保留较直译的可能。
theological_decisions:
- issue: הַכֹּהֵן הַמָּשִׁיחַ的职衔表达
  choice: 受膏的祭司
  alternative: 大祭司；承接圣职的祭司
  rationale: 正文保留מָשִׁיחַ“受膏”的词义，而不直接换成由语境推定的职衔“大祭司”；这样既忠于利未记中的制度用语，也避免赋予该短语原文未明说的基督论含义。
- issue: אֶל是否明确表示进入会幕
  choice: 进会幕
  alternative: 到会幕
  rationale: 原介词在词汇层面可仅指趋向，但后续动作表明血被带入圣所。正文采用符合仪式场景的“进”，脚注则保留形式上较宽泛的“到”。
translation_notes:
  register: 采用现代、庄重而易懂的礼仪规程文体。“会幕”为现代中文圣经读者熟悉且准确的固定译名；句式简洁，保留原文程序性语气与必要的词义张力。
