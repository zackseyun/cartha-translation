base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/033.yaml
  text: And he shall lay his hand on the head of the sin offering and slaughter it for a sin offering in the place where the burnt offering is slaughtered[a].
translation:
  language: zh_hans
  text: 他要把手按在赎罪祭牲的头上，在宰燔祭牲的地方把它宰了，作赎罪祭。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “赎罪祭牲”和“赎罪祭”也可译作“洁净祭牲”和“洁净祭”；希伯来语这个词可指处理罪和礼仪污秽的祭。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְסָמַךְ אֶת־יָדוֹ עַל־רֹאשׁ
  choice: 他要把手按在……的头上
  rationale: סמך在献祭礼仪中指把手放在或按在祭牲头上；译作“按在”自然地保留了动作力度，又不额外断定其象征意义。יָדוֹ是单数，故保留“手”而不改为“ 双手”。
- source_word: הַחַטָּאת
  choice: 赎罪祭牲
  rationale: חטאת在本节首先指作为赎罪祭献上的动物；加“牲”可使“头”和后文“宰”所指明确，同时保留传统且易懂的祭名“赎罪祭”。其也可理解为“洁净祭”，以脚注说明。
- source_word: וְשָׁחַט אֹתָהּ
  choice: 把它宰了
  rationale: שׁחט是宰杀祭牲的礼仪用语，“宰”比泛指的“杀”更准确；“它”回指祭牲。
- source_word: לְחַטָּאת
  choice: 作赎罪祭
  rationale: 介词לְ在此表示用途或身份，译作“作赎罪祭”符合现代汉语礼仪规条的表达。
- source_word: בִּמְקוֹם אֲשֶׁר יִשְׁחַט אֶת־הָעֹלָה
  choice: 在宰燔祭牲的地方
  rationale: 简洁保留指定地点的含义。希伯来文יִשְׁחַט为第三人称阳性单数，但在法规中可作泛指，汉语无需补出特定执行者。עֹלָה采用通行祭名“燔祭”，加“牲”与“宰”自然搭配。
theological_decisions:
- issue: 献祭法规中חטאת的译法
  choice: 正文采用“赎罪祭”
  alternative: “洁净祭”
  rationale: 该词既与罪有关，也可强调除去礼仪污秽、恢复洁净的作用。“赎罪祭”是现代中文读者较熟悉的名称，但不能穷尽其语义，因此保留“洁净祭”这一重要备选译法于脚注中。
translation_notes:
  register: 采用现代、庄重而易懂的法规体。用“他要……”表达希伯来语连续完成式在礼仪指令中的规定语气；以“祭牲”明确动物所指，避免把祭名本身说成有“头”并被宰。
