base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/020.yaml
  text: He shall do with the bull just as he did with the bull of the sin offering; so he shall do with it. And the priest shall make atonement for them[a], and they shall be forgiven.
translation:
  language: zh_hans
  text: 他怎样处置那头赎罪祭[a]的公牛，也要照样处置这头公牛。祭司要为他们赎罪，他们就必蒙赦免。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “赎罪祭”也可译作“洁净祭”。希伯来语这个词可指为处理罪而施行洁净的祭物。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשָׂה לַפָּר
  choice: 他要……处置这头公牛
  rationale: עשה与介词ל在此指按礼仪对祭牲所作的处理；“处置”比直译“向公牛行”更符合现代汉语，同时保留程序性语气。
- source_word: כַּאֲשֶׁר עָשָׂה לְפַר הַחַטָּאת
  choice: 怎样处置赎罪祭的公牛
  rationale: כַּאֲשֶׁר引出与前述仪式的明确比较；用“怎样……也照样……”自然表达对应关系。
- source_word: הַחַטָּאת
  choice: 赎罪祭
  rationale: 该词在祭祀语境中指处理罪并带来洁净的祭物；“赎罪祭”在中文圣经语体中清楚且通行，另以脚注保留“洁净祭”的合理译法。
- source_word: כֵּן יַעֲשֶׂה לּוֹ
  choice: 也要照样处置这头公牛
  rationale: כֵּן表示方式上的对应；将代词所指明示为“这头公牛”，可避免中文中的指代含混。
- source_word: וְכִפֶּר עֲלֵהֶם הַכֹּהֵן
  choice: 祭司要为他们赎罪
  rationale: כפר是利未记祭祀体系的核心用语；“为他们赎罪”保留祭司代表群体施行赎罪礼的含义。
- source_word: וְנִסְלַח לָהֶם
  choice: 他们就必蒙赦免
  rationale: סלח的尼法勒式表达获赦免的结果；“蒙赦免”自然、庄重，并保留被动含义。
theological_decisions:
- issue: 祭祀语境中חטאת的译法
  choice: 赎罪祭
  alternative: 洁净祭
  rationale: 此词既可从所处理的罪来命名，也可从礼仪所实现的洁净来理解。正文采用较通行且易懂的“赎罪祭”，脚注保留“洁净祭”，不排除其净化层面的含义。
translation_notes:
  register: 采用现代、庄重而易懂的礼仪叙述。“怎样……也照样……”再现希伯来文的比较结构；避免过度解释赎罪的具体机制。脚注标记置于整节末尾，所注释的核心术语已在正文出现。
