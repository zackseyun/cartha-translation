id: LEV.4.13
reference: Leviticus 4:13
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/אִ֨ם כָּל עֲדַ֤ת יִשְׂרָאֵל֙ יִשְׁגּ֔וּ וְ/נֶעְלַ֣ם דָּבָ֔ר מֵ/עֵינֵ֖י הַ/קָּהָ֑ל וְ֠/עָשׂוּ אַחַ֨ת מִ/כָּל מִצְוֺ֧ת יְהוָ֛ה אֲשֶׁ֥ר לֹא תֵעָשֶׂ֖ינָה וְ/אָשֵֽׁמוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/013.yaml
  text: And if the whole congregation of Israel sins unintentionally[a], and the matter is hidden from the eyes of the assembly, and they do one of all the things that Yahweh has commanded not to be done, and they become guilty[d][c][b],
translation:
  language: zh_hans
  text: “如果以色列全体会众误犯了罪[a]，这事没有被会众察觉[b]，他们做了耶和华一切诫命所禁止做的事中的一件，因而有了罪责，”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “误犯了罪”指因错误而犯罪，不是公然故意违抗。
    reason: 说明本章祭司法例中שׁגה所表达的非故意性质。
  - marker: b
    text: 原文直译：“这事从会众眼前隐藏。”意思是会众没有察觉这事。
    reason: 保留并解释希伯来语以“眼目”表示察觉、知晓的习语。
lexical_decisions:
- source_word: עֲדַת יִשְׂרָאֵל
  choice: 以色列全体会众
  rationale: עֵדָה在此指以色列共同体；译作“全体会众”既符合祭司法例语境，也与后文הַקָּהָל有所区分。
- source_word: יִשְׁגּוּ
  choice: 误犯了罪
  rationale: שׁגה在利未记第4章指因疏忽或错误而犯的罪，不是公然故意违抗；“误犯了罪”自然地表达这一法律类别。
- source_word: וְנֶעְלַם דָּבָר מֵעֵינֵי הַקָּהָל
  choice: 这事没有被会众察觉
  rationale: 原文直译为“这事从会众眼前隐藏”；中文用“没有被……察觉”传达其被动含义和感知习语，且避免被误解为有人蓄意隐瞒。
- source_word: וְעָשׂוּ אַחַת מִכָּל מִצְוֺת יְהוָה אֲשֶׁר לֹא תֵעָשֶׂינָה
  choice: 他们做了耶和华的一切诫命中吩咐不可做的任何一件事
  rationale: 保留“从一切诫命中取一件”的结构，并清楚表达这里所说的是受禁行为。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的神名音译“耶和华”，作为四字神名的专名表达，而不以称号替代。
- source_word: וְאָשֵׁמוּ
  choice: 因而有了罪责
  rationale: 该动词表示因所犯之事进入有罪、负有责任的状态；“有了罪责”保留结果与责任含义，不预先引入后续赎罪程序。
theological_decisions:
- issue: 献祭律法中שׁגה所指罪的性质
  choice: 误犯了罪
  alternative: 犯错／走迷了
  rationale: 本章处理非故意、因错误而犯的罪；译文明确这一点，同时不把罪责淡化为一般失误。
- issue: וְאָשֵׁמוּ表达的法律—神学状态
  choice: 有了罪责
  alternative: 成为有罪／担当罪责
  rationale: 原文强调犯罪之后形成的罪责状态；此译法不把它误解为主观罪疚感，也不提前说明如何赎罪。
- issue: 神名יְהוָה的处理
  choice: 耶和华
  alternative: 雅威／上主
  rationale: 使用现代简体中文圣经传统中最通行、辨识度最高的专名形式，同时保留其为神名而非普通称号的性质。
translation_notes:
  register: 采用庄重而清楚的现代标准普通话。以“全体会众”和“会众”适度呈现עֵדָה与קָהָל的差别；将希伯来语感知习语自然化，但在脚注中保留其原有意象。句末逗号表明本节句法延续至下一节。
