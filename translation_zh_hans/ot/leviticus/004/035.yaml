source:
  edition: WLC
  text: וְ/אֶת כָּל חֶלְבָּ֣/ה יָסִ֗יר כַּ/אֲשֶׁ֨ר יוּסַ֥ר חֵֽלֶב הַ/כֶּשֶׂב֮ מִ/זֶּ֣בַח הַ/שְּׁלָמִים֒ וְ/הִקְטִ֨יר הַ/כֹּהֵ֤ן אֹתָ/ם֙ הַ/מִּזְבֵּ֔חָ/ה עַ֖ל אִשֵּׁ֣י יְהוָ֑ה וְ/כִפֶּ֨ר עָלָ֧י/ו הַ/כֹּהֵ֛ן עַל חַטָּאת֥/וֹ אֲשֶׁר חָטָ֖א וְ/נִסְלַ֥ח לֽ/וֹ־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/035.yaml
  text: And he shall remove all its fat[a], just as the fat of the lamb is removed from the sacrifice of peace offerings, and the priest shall burn them on the altar, on the food offerings of Yahweh. Thus the priest shall make atonement for him concerning the sin that he committed, and he shall be forgiven.
translation:
  language: zh_hans
  text: 他要取下这只羊羔所有的脂油，正如取下作平安祭的羊羔的脂油一样。祭司要把这些脂油放在祭坛上，在献给耶和华的火祭之上焚烧[a]。祭司要就他所犯的罪为他赎罪，他就必蒙赦免。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “火祭”是希伯来语的献祭术语，也可译作“经火献给耶和华的祭物”或“献给耶和华的食物祭物”；这里的“在……之上”也可能表示“连同……一起”。
    reason: 说明技术性祭祀术语 אִשֵּׁי 以及介词 עַל 在本句中的真实语义歧义。
lexical_decisions:
- source_word: כָּל חֶלְבָּהּ / חֵלֶב
  choice: 这只羊羔所有的脂油 / 脂油
  rationale: חֵלֶב指献祭时按规定取下并焚烧的动物脂油。“脂油”既保留祭祀语境中的具体所指，也符合现代汉语表达。
- source_word: יָסִיר / יוּסַר
  choice: 取下 / 取下……一样
  rationale: 这里的סור使役式表示按献祭程序从牲畜身上除去脂油；“取下”比泛泛的“除去”更具体自然。
- source_word: הַכֶּשֶׂב
  choice: 羊羔
  rationale: כֶּשֶׂב在此献祭语境中指羊羔；结合上文所献的是一只母羊羔，译作“羊羔”准确而不必重复性别。
- source_word: זֶבַח הַשְּׁלָמִים
  choice: 平安祭
  rationale: 这是利未记中固定的祭类名称。采用通行、简洁的“平安祭”，不把该名称进一步解释成某一种特定神学含义。
- source_word: וְהִקְטִיר
  choice: 焚烧
  rationale: 该动词在祭祀语境中指在祭坛上焚烧，使祭物化为烟气；“焚烧”庄重、清楚，并由上下文保留其专门含义。
- source_word: אֹתָם
  choice: 这些脂油
  rationale: 希伯来语代词为阳性复数，所指是取下来的各块脂油。汉语明确译为“这些脂油”，既反映复数，也避免代词指向不清。
- source_word: עַל אִשֵּׁי יְהוָה
  choice: 在献给耶和华的火祭之上
  rationale: עַל基本义为“在……之上”，אִשֵּׁי יְהוָה是献给耶和华、经火焚烧之祭物的技术用语。正文保留空间或程序关系，脚注说明该术语及其他可能理解。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代汉语圣经读者熟悉的专名“耶和华”直接表达四字神名，而不以“主”这一称号替代。
- source_word: וְכִפֶּר עָלָיו
  choice: 替他赎罪
  rationale: כפר在祭司礼仪中表示借献祭施行赎罪。“替他赎罪”保留经文的祭祀与神学范畴，不限定其作用机制。
- source_word: עַל חַטָּאתוֹ אֲשֶׁר חָטָא
  choice: 为他所犯的罪
  rationale: 此短语说明赎罪所针对的罪。“为他所犯的罪”自然地传达原文，而不生硬重复“他所犯的罪、就是他犯的”。
- source_word: וְנִסְלַח לוֹ
  choice: 他就必蒙赦免
  rationale: 被动式表达罪人获得赦免这一结果；“蒙赦免”自然、庄重，也不擅自补出施事者。
theological_decisions:
- issue: 祭祀性赎罪用语的表达
  choice: 祭司要为他所犯的罪替他赎罪
  alternative: 祭司要为他所犯的罪替他除罪／施行洁净
  rationale: 原文כפר具有宽广的祭祀—神学含义。“赎罪”保留这一传统范畴，同时不把经文限定为某一种后世的赎罪理论。
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威／上主
  rationale: 原文使用神的专名而非普通称号。正文采用现代简体中文圣经语境中最通行、最易识别的音译“耶和华”，以专名对专名。
- issue: עַל אִשֵּׁי יְהוָה 的关系
  choice: 在献给耶和华的火祭之上
  alternative: 连同献给耶和华的火祭一起／作为献给耶和华的食物祭物
  rationale: עַל可表达位置、附加或关联，אִשֵּׁי又是技术性祭祀用语。正文较形式地保留“在……之上”，脚注提示术语和关系的可能译法，避免无根据地消除歧义。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“取下”“焚烧”“蒙赦免”清楚表达礼仪动作和结果；“平安祭”“火祭”“赎罪”作为必要的祭祀术语予以保留，并用脚注解释较不透明之处。
