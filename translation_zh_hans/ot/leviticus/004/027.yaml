  text: וְ/אִם נֶ֧פֶשׁ אַחַ֛ת תֶּחֱטָ֥א בִ/שְׁגָגָ֖ה מֵ/עַ֣ם הָ/אָ֑רֶץ בַּ֠/עֲשֹׂתָ/הּ אַחַ֨ת מִ/מִּצְוֺ֧ת יְהוָ֛ה אֲשֶׁ֥ר לֹא תֵעָשֶׂ֖ינָה וְ/אָשֵֽׁם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/027.yaml
  text: And if one person from the common people sins unintentionally by doing one of Yahweh’s commandments that must not be done, and becomes guilty,
translation:
  language: zh_hans
  text: 如果民众中有一个人[a]无意中犯罪，做了雅威诫命中一件不可做的事，以致有了罪责[b]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “民众中”直译为“这地的百姓中”；这里指群体中的普通成员，与上下文所说的祭司或首领相区别。
    reason: lexical_alternative
  - marker: b
    text: 或译：“因而算为有罪”或“因而担当罪责”。原文动词可以表示进入有罪的状态或承担罪责。
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶפֶשׁ אַחַת
  choice: 有一个人
  rationale: 这里是法律用语，指单个的人；译为“有一个人”既保留单数，也符合现代汉语表达。
- source_word: בִּשְׁגָגָה
  choice: 无意中
  rationale: 在献祭律例中表示非故意、出于疏忽的过犯；“无意中”准确而自然。
- source_word: מֵעַם הָאָרֶץ
  choice: 民众中
  rationale: 本段以此指有别于受膏祭司、全会众和首领的普通群体成员。“民众中”在汉语中简洁地表达这一法律类别，同时脚注保留较直译的可能。
- source_word: בַּעֲשֹׂתָהּ אַחַת מִמִּצְוֺת יְהוָה אֲשֶׁר לֹא תֵעָשֶׂינָה
  choice: 做了雅威所吩咐不可做的任何一件事
  rationale: 希伯来文从字面说“做了雅威诫命中不可做的一件”；汉译重组为自然句式，并以“任何一件事”体现部分结构的泛指作用。
- source_word: יְהוָה
  choice: 雅威
  rationale: 采用神圣四字名的通行汉语音译，保留原文中的专名，而不以称号替代。
- source_word: וְאָשֵׁם
  choice: 因而有了罪责
  rationale: 该动词可表示进入有罪状态或承担罪责；“因而有了罪责”保留行为所产生的法律后果，并避免把含义限定为单纯主观感受。
theological_decisions:
- issue: “地上的民”在献祭律例中的身份范围
  choice: 民众中
  alternative: 这地的百姓中／普通民众中
  rationale: 上下文将该类人同祭司、全会众和首领区分开来，因此这里是群体中的普通成员，而非后世政治或族群术语。正文采用自然表达，脚注说明其字面形式和语境功能。
- issue: וְאָשֵׁם所表达的罪责状态
  choice: 因而有了罪责
  alternative: 就算为有罪／就担当罪责
  rationale: 原词兼有成为有罪和承担罪责的语义空间。正文表达由违禁行为产生罪责的结果，不进一步界定其系统神学含义。
translation_notes:
  register: 采用现代、庄重而易懂的法律叙述语体。经文在本节末尾仍属未完条件句，因此以逗号收束，承接下一节。
