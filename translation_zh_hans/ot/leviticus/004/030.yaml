id: LEV.4.30
reference: Leviticus 4:30
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/לָקַ֨ח הַ/כֹּהֵ֤ן מִ/דָּמָ/הּ֙ בְּ/אֶצְבָּע֔/וֹ וְ/נָתַ֕ן עַל קַרְנֹ֖ת מִזְבַּ֣ח הָ/עֹלָ֑ה וְ/אֶת כָּל דָּמָ֣/הּ יִשְׁפֹּ֔ךְ אֶל יְס֖וֹד הַ/מִּזְבֵּֽחַ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/030.yaml
  text: And the priest shall take some of its blood with his finger and put it on the horns of the altar of burnt offering[c][b][a], and he shall pour out all its blood at the base of the altar.
translation:
  language: zh_hans
  text: 祭司要用手指蘸取它的一些血[a]，抹在燔祭坛的角[b]上；又要把它的血全都[c]倒在祭坛的底座处。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“从它的血中取”。希伯来语直译为“从它的血”；这里很可能表示取其中一部分，用来抹在祭坛上。
    reason: lexical_alternative
  - marker: b
    text: “坛的角”指祭坛四角角状的凸起。
    reason: cultural_note
  - marker: c
    text: 原文说“全部的血”；但按这里的步骤，所倾倒的是先用手指蘸血抹在坛角之后其余的血。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַח
  choice: 要……取
  rationale: 本节属于献祭礼仪的规程；带连接词的完成式在这一语境中表达规定的步骤，而非叙述一次已经发生的事件。
- source_word: הַכֹּהֵן
  choice: 祭司
  rationale: 保留定指职分；现代汉语在此无需另加“那位”。
- source_word: מִדָּמָהּ
  choice: 它的一些血
  rationale: 介词 מִן 在此最自然地表示部分关系，即从祭牲的血中取一部分；“一些”清楚传达此义。
- source_word: בְּאֶצְבָּעוֹ
  choice: 用指头
  rationale: בְּ 表示方式或工具，译作“用”；“指头”既自然，也准确保留礼仪动作。
- source_word: וְנָתַן
  choice: 抹在
  rationale: נתן 基本义为“放、置”；结合用指头把血置于坛角的动作，汉语“抹在”自然且没有增添额外的礼仪含义。
- source_word: עַל קַרְנֹת מִזְבַּח הָעֹלָה
  choice: 在燔祭坛的角上
  rationale: 保留 קֶרֶן 的礼仪专名“角”，并以“燔祭坛”自然表达该组合结构。
- source_word: וְאֶת כָּל דָּמָהּ
  choice: 然后把它全部的血
  rationale: 正文保留 כָּל 的全面说法“全部”，不擅自改成“剩下的”；上下文所暗示的先后关系在脚注说明。
- source_word: יִשְׁפֹּךְ
  choice: 倒
  rationale: שׁפך 在献祭语境中指把血倾倒出来；“倒”是现代汉语最清楚自然的表达。
- source_word: אֶל יְסוֹד הַמִּזְבֵּחַ
  choice: 在祭坛脚旁
  rationale: יְסוֹד 本义为根基、底部；“坛脚”是简明且形象的现代汉语表达，אֶל 在这里表示血被倒向并落在坛底处。
theological_decisions:
- issue: 礼仪指令中的动词时态与语气
  choice: 译为规定性的“要……然后……”
  alternative: 按简单过去时译为“取了……抹了……倒了”
  rationale: 本节处于法律与礼仪程序之中，动词描述应当执行的步骤，不是一次性的历史叙事。
- issue: 祭坛附属部分的礼仪术语
  choice: 保留字面的“角”
  alternative: 意译为“角落”或“角上的凸起”
  rationale: 原文的 קַרְנוֹת 是明确的礼仪用语；正文保留其具体形象，脚注补充形制说明，避免削平原文意象。
- issue: “全部的血”与先前所取之血的关系
  choice: 正文保留“全部的血”，脚注说明按步骤指其余的血
  alternative: 正文直接译作“剩下的血”
  rationale: 原文明确使用 כָּל（全部），但礼仪顺序显示已有少量血先被抹在坛角上；这样处理同时保留原文措辞及其语境张力。
translation_notes:
  register: 采用庄重而易懂的现代标准普通话。“燔祭坛”“祭司”“坛角”等保留必要的礼仪术语；句法按祭礼步骤展开，以分号清楚区分抹血与倒血两个动作。所有脚注标记均置于正文相关词语之后。
