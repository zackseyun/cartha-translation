  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: אִ֣ם הַ/כֹּהֵ֧ן הַ/מָּשִׁ֛יחַ יֶחֱטָ֖א לְ/אַשְׁמַ֣ת הָ/עָ֑ם וְ/הִקְרִ֡יב עַ֣ל חַטָּאת/וֹ֩ אֲשֶׁ֨ר חָטָ֜א פַּ֣ר בֶּן בָּקָ֥ר תָּמִ֛ים לַ/יהוָ֖ה לְ/חַטָּֽאת־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/003.yaml
  text: If the anointed priest sins[a], bringing guilt on the people, then he shall present for the sin that he has committed a bull, a son of the herd, without blemish[b], to Yahweh as a sin offering.
translation:
  language: zh_hans
  text: 如果受膏的祭司[a]犯罪，使百姓陷入罪责[b]，他就要为自己所犯的罪，把一头没有残疾的公牛献给耶和华，作赎罪祭。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可理解为“受膏的大祭司”。原文直译为“受膏的祭司”。
    reason: alternative_reading
  - marker: b
    text: 原文这一短语十分凝缩，也可译作“以致百姓有罪责”或“归为百姓的罪责”；重点在于祭司的罪使百姓也受到罪责的牵连。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכֹּהֵן הַמָּשִׁיחַ
  choice: 受膏的祭司
  rationale: 直译为“受膏的祭司”。上下文所指可能是大祭司，但希伯来文本身没有使用“大祭司”这一称号，因此正文保留原文措辞。
- source_word: יֶחֱטָא
  choice: 犯罪
  rationale: 在אִם引导的律法条件句中，未完成式自然表达“如果……犯罪”，无需另加推测或意愿色彩。
- source_word: לְאַשְׁמַת הָעָם
  choice: 使百姓陷入罪责
  rationale: 该短语高度凝缩，表示祭司的罪给百姓带来或造成罪责；此译法表达群体后果，同时不进一步界定其机制。
- source_word: וְהִקְרִיב
  choice: 献给
  rationale: 在献祭语境中，הקריב指把祭物带近、呈献；“献给”在现代汉语中自然，并准确传达礼仪行为。
- source_word: עַל חַטָּאתוֹ אֲשֶׁר חָטָא
  choice: 为自己所犯的罪
  rationale: 保留献祭与具体罪行之间的关系，并以自然汉语表达希伯来文“他的罪，就是他所犯的”这一重复结构。
- source_word: פַּר בֶּן בָּקָר
  choice: 一头公牛
  rationale: 该短语指牛群中的公牛。“公牛”准确表达祭牲的种类和性别，又避免把בֶּן过度限定为特定幼龄。
- source_word: תָּמִים
  choice: 没有残疾
  rationale: 这是献祭法规中表示祭牲完整、无缺陷的常用语；“没有残疾”清楚而庄重。
- source_word: לַיהוָה
  choice: 献给耶和华
  rationale: 保留神圣名יהוה，以现代中文通行的音译“耶和华”表达。
- source_word: לְחַטָּאת
  choice: 作赎罪祭
  rationale: חַטָּאת在祭祀法规中可指处理罪的祭物，而不只是“罪”本身；“赎罪祭”是清楚且通行的中文礼仪术语。
theological_decisions:
- issue: הַכֹּהֵן הַמָּשִׁיחַ是否应解释性地译为“大祭司”
  choice: 受膏的祭司
  alternative: 受膏的大祭司
  rationale: 虽然语境可能指当时居首位的祭司，但原文只说“受膏的祭司”。正文不补入原文未明说的职衔，另以脚注保留语境性理解。
- issue: לְאַשְׁמַת הָעָם所表达的群体后果
  choice: 使百姓陷入罪责
  alternative: 以致百姓有罪责；归为百姓的罪责
  rationale: 原文表明受膏祭司的罪牵涉百姓，却未详述这种牵涉如何发生。译文保留这一神学张力，不引入额外解释。
- issue: חַטָּאת在本节中指罪还是祭物
  choice: 赎罪祭
  alternative: 罪祭；为罪所献的祭
  rationale: 句末介词结构描述公牛的祭祀用途，因此这里以祭物或祭类为主要含义；译作“赎罪祭”可避免误解为公牛本身是“罪”。
translation_notes:
  register: 采用现代、庄重而易懂的律法文体。条件句用“如果……就……”，使结构清晰；保留“受膏的祭司”及群体罪责措辞中的原文张力，不用解释性语言替代正文。
