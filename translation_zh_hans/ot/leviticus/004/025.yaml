base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/025.yaml
  text: Then the priest shall take some of the blood of the sin offering with his finger and put it on the horns of the altar of burnt offering[a], and he shall pour out the rest of its blood at the base of the altar of burnt offering.
translation:
  language: zh_hans
  text: 祭司要用指头蘸取赎罪祭[a]的一些血，抹在燔祭坛的角上，再把其余的血倒在燔祭坛的坛基旁。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“洁净祭”。希伯来语这一词可指为除去礼仪不洁和罪而献的祭。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַח
  choice: 要……蘸取
  rationale: 该形式承接祭礼程序中的下一步；结合“用指头”和部分血液，汉语用“蘸取”自然、具体地表达祭司取血的动作。
- source_word: מִדַּם
  choice: 一些血
  rationale: 介词 מִן 在此具有部分义，表明祭司只取其中一部分血抹坛角。
- source_word: הַחַטָּאת
  choice: 赎罪祭
  rationale: 此处指与罪及洁净有关的祭物或祭礼，而非抽象的“罪”；“赎罪祭”是现代中文圣经语境中清楚而通行的祭类名称。
- source_word: בְּאֶצְבָּעוֹ
  choice: 用指头
  rationale: 介词 בְּ 在此表示工具或方式，即祭司以自己的指头取血并抹血。
- source_word: וְנָתַן עַל
  choice: 抹在……上
  rationale: 按具体礼仪动作译为“抹在”，比泛泛的“放在”更符合以指头施血的语境。
- source_word: קַרְנוֹת
  choice: 角
  rationale: 指祭坛四角突起、形似角的部分；“坛角”是准确且通行的表达。
- source_word: מִזְבַּח הָעֹלָה
  choice: 燔祭坛
  rationale: 该短语指与燔祭相关的祭坛；合译为“燔祭坛”简洁自然。
- source_word: וְאֶת דָּמוֹ יִשְׁפֹּךְ
  choice: 再把其余的血倒
  rationale: 前文已说明只取“一些血”，因此“其余的血”明确表达上下文蕴含，而不增添新的礼仪内容；“再”体现程序推进。
- source_word: אֶל יְסוֹד
  choice: 在……坛脚那里
  rationale: יְסוֹד 指祭坛底部或基部；“坛脚”是普通读者容易理解的具体表达，“那里”自然呈现倾倒的位置。
theological_decisions:
- issue: 祭祀法规中 חַטָּאת 的译法
  choice: 赎罪祭
  alternative: 洁净祭
  rationale: 该词在本节明确指祭物或祭礼，可与罪及除去不洁相关。“赎罪祭”保留传统且广为理解的祭类名称，同时以脚注保留“洁净祭”这一强调礼仪洁净功能的可能译法，避免把词义限缩为单一理论。
translation_notes:
  register: 采用现代、庄重而清楚的礼仪叙述。“蘸取—抹在—倒在”呈现具体动作和先后次序；保留“燔祭坛”“坛角”等必要的祭祀术语，并用脚注呈现 חַטָּאת 的真实词义张力。
