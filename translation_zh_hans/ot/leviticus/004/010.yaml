  source_fidelity: 正文准确保留了比较结构、从祭牲取下供献部分的动作、祭司焚烧及燔祭坛。将“作平安祭祭牲的牛”调整为更自然且不重复的“献作平安祭的牛”；“这些脂肪”根据上一节所列脂肪部分及本节复数后缀补足，指代清楚。
  naturalness: 原文“就像……一样；祭司要……”的分号使比较关系略显断裂。“正如……，祭司也要……”更符合现代汉语，也明确表达希伯来语比较所连接的两项礼仪程序。
  terminology: “平安祭”“祭司”“焚烧”“燔祭坛”均为准确、通行且庄重的祭祀术语。脚注须把“举起”改为被动的“被举起”，以对应 יוּרַם（Hophal）。
  issues:
