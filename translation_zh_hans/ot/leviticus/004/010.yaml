  text: כַּ/אֲשֶׁ֣ר יוּרַ֔ם מִ/שּׁ֖וֹר זֶ֣בַח הַ/שְּׁלָמִ֑ים וְ/הִקְטִירָ/ם֙ הַ/כֹּהֵ֔ן עַ֖ל מִזְבַּ֥ח הָ/עֹלָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/010.yaml
  text: just as it is removed from the ox of the sacrifice of peace offerings[a], and the priest shall burn them on the altar of burnt offering.
translation:
  language: zh_hans
  text: 正如从献作平安祭的牛身上取下这些脂肪，祭司也要把它们焚烧在燔祭坛上。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כַּאֲשֶׁר
  choice: 就像……一样
  rationale: 引出与平安祭处理程序的比较，符合现代汉语表达，并清楚保留比较关系。
- source_word: יוּרַם
  choice: 取下
  rationale: רום 的使役被动式本义涉及“被举起”，但在这里指把将要献上的脂肪部分从祭牲身上取下；正文采用自然的祭祀语境表达，并以脚注保留其字面意象。
- source_word: מִשּׁוֹר
  choice: 从……牛身上
  rationale: שׁוֹר 泛指牛类；上下文已说明祭牲，译作“牛”既准确又避免在本节中加入原词未明确表达的性别限定。
- source_word: זֶבַח הַשְּׁלָמִים
  choice: 作平安祭祭牲的
  rationale: 保留 זֶבַח“祭牲／祭物”与 שְׁלָמִים“平安祭”的双重信息，同时使汉语结构自然。
- source_word: וְהִקְטִירָם
  choice: 祭司要把它们焚烧
  rationale: קטר 的使役式在祭祀语境中指在坛上焚烧献物；“它们”对应复数宾语后缀，回指前文所列的脂肪部分。
- source_word: הַכֹּהֵן
  choice: 祭司
  rationale: 该词指执行献祭礼仪的祭司，采用现代中文圣经语境中的通行称谓。
- source_word: עַל מִזְבַּח הָעֹלָה
  choice: 在燔祭坛上
  rationale: 准确表达与燔祭相关的祭坛；“燔祭坛”简洁、庄重，也是易懂的固定祭祀术语。
theological_decisions:
- issue: זֶבַח הַשְּׁלָמִים 的祭名
  choice: 平安祭
  alternative: 团契祭
  rationale: “平安祭”保留 שְׁלָמִים 与完整、平安这一词族的联系，也是中文传统中清楚而通行的名称；“团契祭”较多突出某一种解释，故不在正文采用。
translation_notes:
  register: 采用现代、庄重而易懂的礼仪叙述语体。“这些脂肪”承接上一节所列各部分，使本节在汉语中指代清楚；分号保留比较说明与祭司行动之间的结构区分。
