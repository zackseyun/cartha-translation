  text: וְ/כִֽי יִטְהַ֤ר הַ/זָּב֙ מִ/זּוֹב֔/וֹ וְ/סָ֨פַר ל֜/וֹ שִׁבְעַ֥ת יָמִ֛ים לְ/טָהֳרָת֖/וֹ וְ/כִבֶּ֣ס בְּגָדָ֑י/ו וְ/רָחַ֧ץ בְּשָׂר֛/וֹ בְּ/מַ֥יִם חַיִּ֖ים וְ/טָהֵֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/013.yaml
  text: And when the man with the discharge is cleansed from his discharge[a], then he shall count seven days for his cleansing, and wash his clothes and bathe his body in living water; then he shall be clean.
translation:
  language: zh_hans
  text: 患漏症的男子不再有漏症时，要为自己的洁净数算七天；他要洗衣服，用活水[a]洗身，之后就洁净了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “活水”指新鲜或流动的水。
    reason: 说明希伯来语字面表达及其在洁净条例中的实际含义。
lexical_decisions:
- source_word: הַזָּב
  choice: 患漏症的人
  rationale: 该词指本章所述有异常身体流出物的男性；“患漏症的人”符合《利未记》传统术语，也自然明确。
- source_word: יִטְהַר מִזּוֹבוֹ
  choice: 不再有漏症
  rationale: 这里指漏症停止，使患者进入洁净程序，而不是已经完成全部礼仪洁净；这样也保留后文七天和洗濯程序的顺序。
- source_word: וְסָפַר לוֹ שִׁבְעַת יָמִים לְטָהֳרָתוֹ
  choice: 就要为自己的洁净计算七天
  rationale: 保留“计算七天”的法律程序语气，并把洁净理解为礼仪层面的洁净。
- source_word: וְכִבֶּס בְּגָדָיו
  choice: 他要洗净衣服
  rationale: כבס专指洗衣物；“洗净衣服”简明自然。
- source_word: וְרָחַץ בְּשָׂרוֹ
  choice: 洗身
  rationale: בשר在此指身体；“洗身”比直译“洗肉体”自然，又符合礼仪法规的庄重语体。
- source_word: בְּמַיִם חַיִּים
  choice: 用活水
  rationale: 直译“活水”，在此指新鲜、流动的水。正文保留希伯来语形象，以脚注说明实际含义。
- source_word: וְטָהֵר
  choice: 之后就洁净了
  rationale: 表达完成上述程序后所得的礼仪洁净状态，并以“之后”清楚呈现程序结果。
theological_decisions:
- issue: 洁净术语是否含有道德罪责
  choice: 按礼仪洁净理解“洁净”
  alternative: 译作带有道德意味的“除罪”或“洗清罪污”
  rationale: 本节讨论身体漏症引起的礼仪不洁及恢复程序，并未把漏症本身等同于个人犯罪。
- issue: יִטְהַר מִזּוֹבוֹ的阶段含义
  choice: 译为漏症停止，而非完整洁净已经完成
  alternative: “从漏症中洁净了”
  rationale: 后面仍规定计算七天、洗衣和洗身，故此处最自然地指从漏症状态中恢复，即流出已经停止；最终的礼仪洁净由末句说明。
translation_notes:
  register: 采用现代、庄重而易懂的法规语体；保留“漏症”“洁净”“活水”等具有文本特色的用语，同时用脚注避免误解。
