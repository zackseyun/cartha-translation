  text: וְ/אִשָּׁ֕ה אֲשֶׁ֨ר יִשְׁכַּ֥ב אִ֛ישׁ אֹתָ֖/הּ שִׁכְבַת זָ֑רַע וְ/רָחֲצ֣וּ בַ/מַּ֔יִם וְ/טָמְא֖וּ עַד הָ/עָֽרֶב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/018.yaml
  text: If a man lies with a woman and has an emission of semen[b][a], both of them shall wash in water and be unclean until the evening.
translation:
  language: zh_hans
  text: 若男人与女人同房，有精液排出[a]，两人都要用水洗身，并且不洁净[b]到晚上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文为特指精液排出的短语，也可较直译为“精液的排出”。
    reason: lexical_alternative
  - marker: b
    text: 这里指礼仪上不洁净，直到晚上为止，并非说两人因此犯了道德上的罪。
    reason: cultural_note
lexical_decisions:
- source_word: וְאִשָּׁה אֲשֶׁר
  choice: 若……女人
  rationale: 在本段律例语境中，这一“连词＋女人＋关系从句”的结构具有条件性质；译作“若”符合现代汉语律例表达，同时保留女性所指。
- source_word: יִשְׁכַּב אִישׁ אֹתָהּ
  choice: 男人与女人同房
  rationale: שׁכב 在此是指性交的惯用语。“同房”在现代汉语中庄重、清楚，也适合律法文本的语体。
- source_word: שִׁכְבַת זָרַע
  choice: 有精液排出
  rationale: 该短语在此特指精液排出。此译准确自然，避免将 זֶרַע 机械译为容易引起歧义的“种子”或“后裔”。
- source_word: וְרָחֲצוּ בַמַּיִם
  choice: 两人都要用水洗身
  rationale: 复数动词指双方；“两人都”明确其共同义务。“用水洗身”自然表达以水洗涤身体，而不额外限定浸浴方式。
- source_word: וְטָמְאוּ
  choice: 不洁净
  rationale: 保留利未记中 טמא 的礼仪状态用语，不译成“有罪”或其他道德评价。
- source_word: עַד הָעָרֶב
  choice: 到晚上
  rationale: 忠实表达这类洁净条例中持续至傍晚的时间界限，不将其进一步解释为某个精确时刻。
theological_decisions:
- issue: 利未记洁净条例中“不洁净”的性质
  choice: 正文只译作“不洁净”，脚注说明这里指礼仪上的不洁净。
  alternative: 在正文译作“礼仪上不洁净”或误解为道德罪责。
  rationale: 本节规定性交并有精液排出之后暂时的礼仪状态，并未宣告该行为本身有罪。简洁正文保留原文措辞，脚注则帮助现代读者避免把礼仪不洁等同于道德过犯。
translation_notes:
  register: 采用现代、庄重而易懂的律例语体。“同房”避免露骨，也准确传达性关系；“精液排出”保持身体层面的明确性。“都要”表达律例要求，但不使用过度古雅的“必”。
