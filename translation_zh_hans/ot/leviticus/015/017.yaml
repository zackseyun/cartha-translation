base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/017.yaml
  text: And every garment and every skin on which there is an emission of semen shall be washed with water and be unclean until the evening[a][b].
translation:
  language: zh_hans
  text: 凡沾有精液的衣服或皮制物品，都要用水洗涤，并且不洁净直到晚上。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “皮制物品”原文直译为“皮”或“兽皮”。
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּגֶד
  choice: 衣服
  rationale: 该词广泛指衣物；“衣服”是现代汉语中自然、明确的对应表达。
- source_word: עוֹר
  choice: 皮革制品
  rationale: 该词本义为皮或兽皮；在此与衣服并列，并且涉及清洗，语境很可能指兽皮制成的物件。“皮革制品”比单说“皮”更自然，但保留脚注说明直译。
- source_word: אֲשֶׁר יִהְיֶה עָלָיו
  choice: 沾有
  rationale: 原文直意为“其上有”。“沾有”自然表达精液位于物件表面的意思，未增加清洗以外的含义。
- source_word: שִׁכְבַת זָרַע
  choice: 精液
  rationale: 这一固定用语在本章指射出的精液；中文直接译作“精液”准确、清楚，也避免不自然的“精液的排出物”。
- source_word: וְכֻבַּס בַּמַּיִם
  choice: 都要用水洗净
  rationale: 被动法律用语在现代汉语中自然转为义务表达。“用水”体现手段；“洗净”指实际洗涤，不表示礼仪上的洁净状态已立即恢复。
- source_word: וְטָמֵא עַד הָעָרֶב
  choice: 并且不洁净到晚上
  rationale: 保留利未记礼仪状态的术语和时间界限；即使洗过，该物仍处于不洁净状态直到晚上。
theological_decisions:
- issue: 利未记洁净条例中“不洁净”的性质
  choice: 译为“不洁净”，按礼仪状态理解，不加入道德罪责。
  alternative: 污秽；不纯洁
  rationale: טָמֵא 在本段标示礼仪上的不洁净，并不必然断言当事人犯了罪。“不洁净”能较稳定地保留这一类别。
- issue: 不洁净状态所指的对象
  choice: 让语法承接前述衣服或皮革制品，即物件要洗且不洁净到晚上。
  alternative: 将后半句理解为处理该物件的人不洁净到晚上
  rationale: 原文连续使用单数形式，最直接的语法承接是前述每件衣服或皮革物件；本节没有明说处理者。
translation_notes:
  register: 采用现代、庄重而易懂的法规体。“凡……都要……”自然呈现希伯来文的概括性法律表述；避免以“污秽”造成道德谴责的联想。
