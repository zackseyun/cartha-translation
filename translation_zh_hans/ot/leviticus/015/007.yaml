base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/007.yaml
  text: Whoever touches the flesh of the man with the discharge shall wash his clothes and bathe in water[a], and he shall be unclean until the evening.
translation:
  language: zh_hans
  text: 凡触摸患漏症之人身体[a]的人，都要洗净衣服，用水洗澡；他必不洁净，直到晚上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “身体”原文直译“肉身”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַנֹּגֵעַ
  choice: 凡……的
  rationale: 带定冠词的分词在此作泛指实体用语，表达适用于任何人的律法条件；“凡……的”自然且保留一般法律效力。
- source_word: בִּבְשַׂר
  choice: 身体
  rationale: בָּשָׂר字面可指“肉身、肉”，在本条接触语境中实际指人的身体；译作“身体”符合现代汉语，同时未改变所指。
- source_word: הַזָּב
  choice: 那患漏症之人
  rationale: 该阳性单数分词指本章所述身体有异常流出的人；“患漏症”简洁承接上下文，“之人”保留人的指称而不额外限定为道德状态。
- source_word: יְכַבֵּס בְּגָדָיו
  choice: 都要洗净衣服
  rationale: כִּבֵּס常指洗涤衣物；“要”体现律法要求，“洗净衣服”是自然、明确的现代汉语。
- source_word: וְרָחַץ בַּמַּיִם
  choice: 用水洗澡
  rationale: רָחַץ在此指清洗身体；“用水洗澡”准确表达工具性用水及全身洗涤，符合现代汉语习惯。
- source_word: וְטָמֵא
  choice: 并且不洁净
  rationale: טָמֵא在利未记洁净条例中表示礼仪状态；“不洁净”沿用清楚的经文术语，不暗示接触本身构成道德罪责。
- source_word: עַד הָעָרֶב
  choice: 到晚上
  rationale: 该短语表示不洁状态持续至当日晚间；“到晚上”简明自然，并准确保留时间界限。
theological_decisions:
- issue: 不洁净的性质
  choice: 以“不洁净”表达礼仪上的不洁状态，不加入道德罪责用语。
  alternative: 玷污；不纯洁
  rationale: 本节属于利未记十五章的洁净制度，טָמֵא描述礼仪身份与参与群体生活的状态，而非断言接触者犯了道德上的罪。
- issue: בָּשָׂר在本节的指称
  choice: 正文译作“身体”。
  alternative: 肉身；肉
  rationale: 希伯来词可直译为“肉身/肉”，但在“触碰某人的……”这一条例中指其身体。“身体”既准确又避免现代汉语中“肉”可能造成的误解；该选择不改变任何神学主张。
translation_notes:
  register: 采用现代、庄重而易懂的律法语体。“凡……的，都要……”清楚呈现条件与义务；保留“不洁净”这一利未记核心礼仪术语。原文在בָּשָׂר上存在“肉身/身体”的词汇幅度，但正文“身体”已自然承载语境意义，无需设置会干扰阅读的脚注。
