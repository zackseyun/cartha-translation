  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/אִשָּׁ֡ה כִּֽי יָזוּב֩ ז֨וֹב דָּמָ֜/הּ יָמִ֣ים רַבִּ֗ים בְּ/לֹא֙ עֶת נִדָּתָ֔/הּ א֥וֹ כִֽי תָז֖וּב עַל נִדָּתָ֑/הּ כָּל יְמֵ֞י ז֣וֹב טֻמְאָתָ֗/הּ כִּ/ימֵ֧י נִדָּתָ֛/הּ תִּהְיֶ֖ה טְמֵאָ֥ה הִֽוא־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/025.yaml
  text: If a woman has a discharge of blood for many days[a], not at the time of her menstrual impurity, or if she has a discharge beyond her menstrual impurity, all the days of her unclean discharge she shall be unclean[b], as in the days of her menstrual impurity.
translation:
  language: zh_hans
  text: 女人若多日流血，不在她经期不洁的期间[a]，或在她经期不洁之后仍流血[b]，她在因流血而不洁的一切日子都不洁净，如同她经期不洁的日子一样。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“在她月经期以外”。希伯来语所指的不只是月经出血，也包括与经期相连的礼仪性不洁状态。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“在经期不洁之外又流血”，即流血超过正常经期。
    reason: lexical_alternative
lexical_decisions:
- source_word: יָזוּב / תָזוּב + זוֹב
  choice: 流血／流血延续
  rationale: 该动词与名词的组合表示身体异常流出液体；本节明确所流的是血，因此译作“流血”自然清楚。第二处加“延续”，表达 עַל 在此可能具有超过正常经期、继续下去的含义。
- source_word: דָּמָהּ
  choice: 血
  rationale: 原文直指“她的血”；汉语用“流血”即可自然表达该动词与宾语的关系。
- source_word: יָמִים רַבִּים
  choice: 多日
  rationale: 按原文保留持续许多日子的时间含义，简洁而自然。
- source_word: בְּלֹא עֶת נִדָּתָהּ
  choice: 不是在她经期不洁的时候
  rationale: עֵת 表示“时候”，נִדָּה 在利未记的律法语境中既涉及月经，也涉及与之相连的礼仪性不洁状态；“经期不洁”保留这两层含义。
- source_word: נִדָּה
  choice: 经期不洁
  rationale: 既避免只译作生理上的“月经”，也清楚表明这里所说的是礼仪身份，而非道德过错。
- source_word: עַל נִדָּתָהּ
  choice: 延续到经期不洁之后
  rationale: עַל 在本语境中可表示在正常经期之外仍继续流血；正文采用自然的延续义，脚注保留“在……之外又……”这一可行表达。
- source_word: כָּל יְמֵי זֹב טֻמְאָתָהּ
  choice: 在她因流血而不洁的所有日子
  rationale: 原文组合了流出、污秽和持续日数；汉语这样表达可清楚传达：流血持续期间，她处于礼仪性不洁状态。
- source_word: טְמֵאָה
  choice: 不洁净
  rationale: 这是利未记礼仪洁净制度中的身份用语；“不洁净”符合现代汉语圣经语域，又不暗示她犯了道德上的罪。
- source_word: כִּימֵי נִדָּתָהּ
  choice: 正如她经期不洁的日子一样
  rationale: 保留原文的明确比较：异常流血期间的礼仪状态，与正常经期的不洁状态相同。
theological_decisions:
- issue: 如何表达礼仪性不洁而不使人误以为是道德罪责
  choice: 采用“经期不洁”和“不洁净”作为礼仪身份用语
  alternative: 仅译作“月经／经期”，或统一译作“污秽”
  rationale: 本节规定的是利未律法中的礼仪洁净状态，并未断言妇女因流血而犯了道德上的罪。“经期不洁”保留礼仪含义，“不洁净”也比可能带有道德贬义的“污秽”更妥当。
translation_notes:
  register: 采用现代、庄重而易懂的律法文体。以“经期不洁”表达 נִדָּה 的生理与礼仪双重语义，并用“因流血而不洁”避免生硬的名词连缀。脚注标记紧接各自所解释的短语。
