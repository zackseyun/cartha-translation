base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/011.yaml
  text: And everyone whom the man with the discharge touches[a], without having washed his hands in water, shall wash his clothes and bathe in water, and be unclean until the evening.
translation:
  language: zh_hans
  text: 凡被患漏症的人触碰的人，若患漏症者的双手没有用水冲洗，就要洗衣服，用水洗身，并且不洁净到晚上。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“凡被患漏症的人触碰的人——而患漏症者的双手没有用水冲洗——，就要洗衣服，用水洗身，并且不洁净到晚上。”希伯来语这一分句也可理解为并列陈述，或说明这种触碰使人不洁净的条件。
    reason: 保留וְיָדָיו לֹא שָׁטַף בַּמָּיִם与前后分句的句法关系可作并列陈述、条件或伴随状况的歧义，同时明确“他的手”通常指患漏症者。
lexical_decisions:
- source_word: הַזָּב
  choice: 患漏症的人
  rationale: 这是由זוּב构成的阳性分词名词，在本段洁净条例中指身体有异常流出物的男性。“患漏症的人”既保留病症背景，也符合现代中文表达。
- source_word: יִגַּע בּוֹ
  choice: 所触碰的人
  rationale: נגע与介词ב连用表示身体接触；这里是患漏症者触碰别人。用“所触碰的人”清楚标明受接触者。
- source_word: וְיָדָיו לֹא שָׁטַף בַּמָּיִם
  choice: 如果他还没有用水冲洗双手
  rationale: שטף有冲洗、冲净之意；条件式表达自然呈现该分句可能说明接触传递不洁的条件，同时以“他”指患漏症者。
- source_word: שָׁטַף
  choice: 冲洗
  rationale: “冲洗”保留שטף的冲淋、洗净意味，并与后文洗衣服的כבס及洗身体的רחץ有所区分。
- source_word: וְכִבֶּס בְּגָדָיו
  choice: 就要洗净衣服
  rationale: כבס通常指洗涤衣物；“洗净衣服”自然且准确地表达条例要求。
- source_word: וְרָחַץ בַּמָּיִם
  choice: 用水洗身
  rationale: רחץ在洁净条例中指清洗身体；“洗身”比单说“洗”更明确，并与洗衣服区分。
- source_word: וְטָמֵא עַד הָעָרֶב
  choice: 并且不洁净到晚上
  rationale: טמא在这里表示礼仪或祭祀制度上的不洁净，并非道德罪恶；“到晚上”自然传达时限。
- source_word: כֹל אֲשֶׁר
  choice: 凡……的人
  rationale: 该结构在此具有逐一涵盖人的分配意义；中文用“凡……的人”最为自然。
theological_decisions:
- issue: 利未记洁净条例中“不洁净”的性质
  choice: 将טמא译为“不洁净”，按礼仪与洁净制度理解
  alternative: 污秽、被玷污
  rationale: 本节所说的不洁由身体流出及接触而来，并通过洗涤和时间期限处理，不应译成暗示道德罪责的词语。
- issue: 未冲洗双手这一分句的句法关系
  choice: 将其译为患漏症者触碰他人时的条件
  alternative: 按并列句直译为“他的手没有用水冲洗”
  rationale: 希伯来语允许将该分句理解为伴随或条件状况。正文采用自然的条件表达，但以脚注保留较贴近原语并列结构的可能性。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“漏症”承接本章术语；通过补出“被触碰的人”，避免中文代词指向含混。正文保持法律条文的规范语气，并用脚注保存原文句法上的真实歧义。
