  text: וְ/הַ/יֹּשֵׁב֙ עַֽל הַ/כְּלִ֔י אֲשֶׁר יֵשֵׁ֥ב עָלָ֖י/ו הַ/זָּ֑ב יְכַבֵּ֧ס בְּגָדָ֛י/ו וְ/רָחַ֥ץ בַּ/מַּ֖יִם וְ/טָמֵ֥א עַד הָ/עָֽרֶב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/006.yaml
  text: Whoever sits on the object on which the man with the discharge sat shall wash his clothes and bathe in water[a], and he shall be unclean until the evening.
translation:
  language: zh_hans
  text: 凡坐在患漏症男子坐过的物件[a]上的人，都要洗衣服，用水洗身，并且要不洁净直到晚上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “物件”也可译作“器皿”或“用具”；希伯来语原词可泛指各种器物或物品。
    reason: 说明希伯来语 כְּלִי 的广泛词义，并避免读者误以为这里只指某一种容器。
lexical_decisions:
- source_word: וְהַיֹּשֵׁב
  choice: 凡坐在……上的
  rationale: 这是带冠词的名词化分词，前有连接词，直译为“那坐着的人”。在法规语境中，“凡……的”自然地表达其泛指效力。
- source_word: הַכְּלִי
  choice: 物件
  rationale: כְּלִי 可泛指器皿、用具或物品；这里指可供人坐卧或接触的某样东西，不宜限缩为容器，因此译作范围较广的“物件”。
- source_word: אֲשֶׁר יֵשֵׁב עָלָיו
  choice: 坐过的
  rationale: 关系从句说明该物件曾被患漏症者坐过；“坐过”在现代汉语中自然表达先前发生并留下相关接触后果的动作。
- source_word: הַזָּב
  choice: 患漏症的男子
  rationale: 本词是名词化分词，在本段指有身体流出症状的男性。译出“男子”保留本段明确的男性所指；“漏症”则与利未记十五章的洁净条例相符而不过度规定病理诊断。
- source_word: יְכַבֵּס בְּגָדָיו
  choice: 要洗衣服
  rationale: כִּבֵּס 常指洗涤衣物；“要洗衣服”以自然现代汉语保留法规性的要求。
- source_word: וְרָחַץ בַּמַּיִם
  choice: 用水洗澡
  rationale: רָחַץ 在洁净条例中表示洗净身体；“用水洗澡”清楚区别于前面的洗衣服，并保留 בַּמַּיִם 的用水含义。
- source_word: וְטָמֵא עַד הָעָרֶב
  choice: 并且不洁净到晚上
  rationale: טָמֵא 描述接触后持续至晚上的礼仪状态；“不洁净到晚上”简洁保留状态及其时限。
theological_decisions:
- issue: 不洁净语言的性质
  choice: 直译为“不洁净”，不增添道德罪责的含义
  alternative: 译为“礼仪上不洁净”或“被玷污”
  rationale: 上下文讨论利未记的洁净条例，并不必然表示道德过犯。加上“礼仪上”会把语境解释写进正文，而“被玷污”可能加重原意。
- issue: הַזָּב 的性别所指
  choice: 译为“患漏症的男子”
  alternative: 译为性别中性的“患漏症的人”
  rationale: 本段承接15:2起对男性漏症的规定，希伯来语形式也是阳性单数；明确译出“男子”保留原文所指。
- issue: 接触不洁的持续时间
  choice: 保留“不洁净到晚上”这一状态陈述
  alternative: 改写为“到晚上才洁净”
  rationale: 原文直接陈述不洁净状态延续至晚上；不进一步说明何时或如何恢复洁净，以免补入本节没有明说的程序。
translation_notes:
  register: 采用现代、庄重而易懂的法规语体。“凡……的，都要……”表达普遍适用的条例；“坐过”比生硬的“曾坐于其上”更符合现代汉语，同时保留动作先后关系。脚注标记置于“物件”之后，使其与所解释的词直接对应。
