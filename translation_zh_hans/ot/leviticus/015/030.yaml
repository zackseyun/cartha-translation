  text: וְ/עָשָׂ֤ה הַ/כֹּהֵן֙ אֶת הָ/אֶחָ֣ד חַטָּ֔את וְ/אֶת הָ/אֶחָ֖ד עֹלָ֑ה וְ/כִפֶּ֨ר עָלֶ֤י/הָ הַ/כֹּהֵן֙ לִ/פְנֵ֣י יְהוָ֔ה מִ/זּ֖וֹב טֻמְאָתָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/030.yaml
  text: Then the priest shall offer one as a sin offering and the other as a burnt offering, and the priest shall make atonement for her before Yahweh because of her unclean discharge.
translation:
  language: zh_hans
  text: 祭司要献上一只作赎罪祭[a]，另一只作燔祭；祭司要在雅威面前，为她因不洁的流出行赎罪礼。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “赎罪祭”也可译作“洁净祭”；希伯来语חַטָּאת在利未记的礼仪语境中可着重表示这祭的洁净功能。
    reason: 词义替代译法
lexical_decisions:
- source_word: וְעָשָׂה
  choice: 要献上
  rationale: 该动词本义宽泛，可指“做、制作”；在祭牲及祭类作宾语的献祭语境中，译作“献上”符合现代汉语习惯，也准确表达礼仪行动。
- source_word: הָאֶחָד ... חַטָּאת
  choice: 一只作赎罪祭
  rationale: חַטָּאת在此指祭物类别。沿用通行且易懂的“赎罪祭”，同时以脚注保留“洁净祭”这一能凸显利未记礼仪洁净功能的译法。
- source_word: וְאֶת־הָאֶחָד עֹלָה
  choice: 另一只作燔祭
  rationale: 重复的הָאֶחָד在两只鸟之间具有分配意味，汉语自然表达为“一只……另一只”；עֹלָה为全烧献上的燔祭。
- source_word: וְכִפֶּר עָלֶיהָ
  choice: 为她……行赎罪礼
  rationale: כפר在祭司礼仪语境中表示借献祭施行赎罪；“行赎罪礼”既保留其神学和礼仪意义，又避免让读者误以为妇人的生理排出本身等同道德犯罪。
- source_word: לִפְנֵי יְהוָה
  choice: 在雅威面前
  rationale: לִפְנֵי直译为“在……面前”，保留礼仪场景；神名יהוה音译为“雅威”，呈现原文的专名。
- source_word: מִזּוֹב טֻמְאָתָהּ
  choice: 因不洁的流血所染的不洁
  rationale: זוֹב在本段具体指妇人的血液流出，טֻמְאָה指由此涉及的礼仪性不洁。此译法保留原文“不洁”这一名词概念及מִן的缘由/所涉范围，同时以自然汉语交代两者关系。
theological_decisions:
- issue: יהוה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名。采用“雅威”音译，以保留西奈之约语境中的专名身份，而不以称号替代。
- issue: חַטָּאת在祭祀律例中的含义
  choice: 赎罪祭
  alternative: 洁净祭
  rationale: 该词明确指一种祭类；“赎罪祭”是现代中文圣经读者较熟悉的名称，但其礼仪洁净侧重确实存在，故以脚注保留“洁净祭”。
- issue: 妇人流血与赎罪的关系
  choice: 明确表达礼仪性不洁，不把流血本身定性为道德罪过
  alternative: 为她的不洁流血赎罪
  rationale: 上下文处理的是由身体排出所产生的礼仪不洁。原文保留כפר的赎罪语言，却没有把这种生理状况直接称作个人道德犯罪；译文应维持这一张力。
translation_notes:
  register: 采用庄重而通顺的现代标准普通话。“一只……另一只”承接本节所指的两只鸟；“行赎罪礼”保留祭司礼仪用语。“不洁的流血所染的不洁”有意保留原文זוֹב与טֻמְאָה的区分，并避免把礼仪不洁误解为妇人的道德罪责。
