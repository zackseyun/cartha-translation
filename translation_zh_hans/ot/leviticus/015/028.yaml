base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/028.yaml
  text: But if she is cleansed from her discharge[a], then she shall count seven days for herself, and after that she shall be clean.
translation:
  language: zh_hans
  text: 但她若从血漏中洁净了[a]，就要为自己数算七天；七天以后，她就洁净了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“她的血漏若止住了……七天以后，她就洁净了。”希伯来文两个分句使用同一词根：第一处指她脱离血漏所造成的状况，第二处指她在礼仪上成为洁净。
    reason: 词义选择及原文同词根在两个分句中的语义差别
lexical_decisions:
- source_word: וְאִם
  choice: 但……若
  rationale: 承接并转入与前述情形相对的条件，既保留连词和条件义，也符合现代汉语法规性叙述。
- source_word: טָהֲרָה מִזּוֹבָהּ
  choice: 她若从血漏中洁净了
  rationale: טהר在此为完成式不及物用法，表示脱离血漏所造成的状态；מִן表示从该状况中分离。译文保留“洁净”这一礼仪用语及原文与末句相同的词根联系，不把它解释成道德洁白。
- source_word: מִזּוֹבָהּ
  choice: 从血漏中
  rationale: זוֹב在本段指女性异常而持续的血性排出；“血漏”简洁、明确，也符合本章礼仪条例的语境。
- source_word: וְסָפְרָה לָּהּ
  choice: 就要为自己数算
  rationale: 连续式动词推进规定的程序；“要”传达法律指令语气，并以“为自己”明确保留לָּהּ。
- source_word: שִׁבְעַת יָמִים
  choice: 七天
  rationale: 按原文直接翻译数词与时间名词。
- source_word: וְאַחַר
  choice: 之后
  rationale: 表示数满七天后的下一阶段，现代汉语中简洁自然。
- source_word: תִּטְהָר
  choice: 才算洁净
  rationale: 再次使用“洁净”以保留טהר的重复；“才算”清楚表达完成七天后才取得礼仪上洁净的身份，而非道德评价。
theological_decisions:
- issue: 礼仪洁净术语
  choice: 以“洁净”表达טהר所指的礼仪身份
  alternative: 译作“纯洁”或按道德意义理解为无罪
  rationale: 本节讨论身体排出物所涉及的礼仪状态，并未判断当事人的道德或罪责；“洁净”能保留《利未记》的祭礼范畴。
- issue: 同一词根在两处的不同语境功能
  choice: 两处都保留“洁净”，并由“从血漏中”和“才算”显示先后层次
  alternative: 首处明确译成“血漏止住”，末处译成“洁净”
  rationale: 原文两处均用טהר：首处与מִן连用，侧重脱离血漏状态；末处侧重七天后的礼仪身份。保留相同措辞可呈现原文的词汇联系与一定的语义张力。
translation_notes:
  register: 采用现代、庄重而易懂的法规性语体。“血漏”依本段上下文指异常的血性排出；“洁净”始终按礼仪意义使用。脚注标记[a]已置于正文相应位置。
