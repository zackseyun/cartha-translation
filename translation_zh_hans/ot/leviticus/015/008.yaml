  text: וְ/כִֽי יָרֹ֛ק הַ/זָּ֖ב בַּ/טָּה֑וֹר וְ/כִבֶּ֧ס בְּגָדָ֛י/ו וְ/רָחַ֥ץ בַּ/מַּ֖יִם וְ/טָמֵ֥א עַד הָ/עָֽרֶב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/008.yaml
  text: And if the man with the discharge spits on a clean person[a], he shall wash his clothes and bathe in water[b], and he shall be unclean until the evening.
translation:
  language: zh_hans
  text: 如果那患漏症的人吐唾沫在洁净的人身上[a]，那人就要洗衣服，用水洗澡，并且要不洁净直到晚上[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “洁净的人”指在礼仪上洁净的人。原文直译为“那洁净的”。
    reason: lexical_alternative
  - marker: b
    text: 这里的“不洁净”是指礼仪上的不洁净，并不必然表示道德上受了玷污。
    reason: cultural_note
lexical_decisions:
- source_word: וְ/כִֽי
  choice: 如果
  rationale: 在连续的律例条款中引出条件情形；中文用“如果”已能自然表达连接与条件关系，无须生硬增译“并且”。
- source_word: יָרֹק
  choice: 吐唾沫在……身上
  rationale: 该动词意为“吐唾沫”；介词 בְּ 在此表达唾沫落在某人身上，故按现代汉语习惯译出“在……身上”。
- source_word: הַ/זָּב
  choice: 那患漏症的人
  rationale: 原文为阳性单数，指有异常流出者；结合本章上文所指男性，以“患漏症的人”准确而自然地承接语境。
- source_word: בַּ/טָּהוֹר
  choice: 在洁净的人身上
  rationale: טָהוֹר 是名词化形容词，指礼仪上洁净的人；补出“人”以合乎现代汉语表达。
- source_word: וְ/כִבֶּס בְּגָדָי/ו
  choice: 那人就要洗衣服
  rationale: כִּבֶּס 在此指洗涤衣物。主语按语境是被吐唾沫的洁净者；用“那人”避免中文误读为患漏症者。
- source_word: וְ/רָחַץ בַּ/מַּיִם
  choice: 用水洗澡
  rationale: רָחַץ 在此指身体洗浴；“用水洗澡”既保留 בַּמַּיִם，也比泛称“洗”更清楚。
- source_word: וְ/טָמֵא
  choice: 并且不洁净
  rationale: 指礼仪状态上的不洁净，而非道德污秽；保留利未记洁净法规的核心术语。
- source_word: עַד הָ/עָרֶב
  choice: 到晚上
  rationale: 这是利未记中表示礼仪不洁持续期限的固定时间语，现代汉语自然表达为“到晚上”。
theological_decisions:
- issue: 洁净与不洁净的性质
  choice: 用“洁净／不洁净”表达礼仪身份
  alternative: 纯洁／污秽；干净／不干净
  rationale: 本节讨论以色列礼仪制度中的状态，并非直接判定道德罪责；“洁净／不洁净”既符合汉语圣经语域，也避免误解为单纯的卫生状况。
- issue: 洗衣和洗澡之人的指代
  choice: 明确为被吐唾沫的洁净者，译作“那人”
  alternative: 沿用省略主语，可能被理解为患漏症者
  rationale: 希伯来语连续动词的主语由情境确定，法规后果落在前述“洁净的人”身上；中文补出“那人”可消除非原文意图的指代歧义。
translation_notes:
  register: 采用现代、庄重而易懂的律例语体。“患漏症的人”承接本章术语；“那人”明确后半句的主语。“吐唾沫”较“吐口水”更适合经文语体，又不显古奥。
