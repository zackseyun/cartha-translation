  text: And an earthen vessel that the one with the discharge touches shall be broken[c][b][a], and every wooden vessel shall be rinsed with water.
translation:
  language: zh_hans
  text: 患漏症的人触碰过的陶器[a]，必须打碎；所有木器都必须用水冲洗[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“陶土器皿”或“瓦器”。
    reason: lexical_alternative
  - marker: c
    text: 或译“在水中洗涤”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כְלִי חֶרֶשׂ
  choice: 陶器
  rationale: 该词组指用陶土烧制的器具；“陶器”在现代汉语中自然简洁，也保留了本节洁净条例所看重的材质区别。
- source_word: אֲשֶׁר יִגַּע בּוֹ
  choice: 所触碰的
  rationale: נגע 的基本义是“触碰”；用“所触碰的”直接表达希伯来文关系从句，不扩展为较含混的“接触”。
- source_word: הַזָּב
  choice: 患漏症的人
  rationale: 这是洁净条例中指身体有异常流出物之人的术语；“患漏症的人”既说明其状态，也避免使用普通读者难懂的专门称谓。上下文指男性，但本节的表达着重于其所处状态。
- source_word: יִשָּׁבֵר
  choice: 必须打碎
  rationale: 该被动形式在法律语境中表达有约束力的处置要求；现代汉语用“必须打碎”比机械仿照将来时更自然明确。
- source_word: כָל כְּלִי עֵץ
  choice: 所有木器
  rationale: כְּלִי 可泛指器具，并不只限于容器；“所有木器”准确涵盖木制器具，也与“陶器”形成材质上的对应。
- source_word: יִשָּׁטֵף בַּמָּיִם
  choice: 用水冲洗
  rationale: שטף 在这里指以水冲洗或洗净器物；“用水冲洗”自然表达动作及所用媒介，同时保留与一般“洗涤”之间可能存在的语义差别。
