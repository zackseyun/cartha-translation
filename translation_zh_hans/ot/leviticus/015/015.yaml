  text: וְ/עָשָׂ֤ה אֹתָ/ם֙ הַ/כֹּהֵ֔ן אֶחָ֣ד חַטָּ֔את וְ/הָ/אֶחָ֖ד עֹלָ֑ה וְ/כִפֶּ֨ר עָלָ֧י/ו הַ/כֹּהֵ֛ן לִ/פְנֵ֥י יְהוָ֖ה מִ/זּוֹבֽ/וֹ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/015.yaml
  text: The priest shall offer them[a], one as a sin offering and the other as a burnt offering, and the priest shall make atonement for him before Yahweh because of his discharge.
translation:
  language: zh_hans
  text: 祭司要献上这两只鸟，一只作赎罪祭[a]，另一只作燔祭。祭司要因那人的漏症，在耶和华面前为他赎罪。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“洁净祭”。希伯来语חַטָּאת在这里可指用来除去礼仪性不洁的祭，并不只指为道德罪过所献的祭。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשָׂה אֹתָם
  choice: 要献上这两只鸟
  rationale: 在献祭语境中，עשה指按礼仪献上祭物；אֹתָם回指上一节的两只鸟。译出“这两只鸟”比单用“它们”更自然清楚。
- source_word: הַכֹּהֵן
  choice: 祭司
  rationale: כהן在祭司礼仪法规中的标准对应词。
- source_word: אֶחָד חַטָּאת
  choice: 一只作赎罪祭
  rationale: חטאת是传统且广为理解的“赎罪祭”，但在本段洁净条例中也可强调除去礼仪性不洁，因此以脚注保留“洁净祭”的可能译法。
- source_word: וְהָאֶחָד עֹלָה
  choice: 另一只作燔祭
  rationale: עלה指全牲焚烧的祭，现代中文圣经惯用“燔祭”；הָאֶחָד在两者对举中自然译作“另一只”。
- source_word: וְכִפֶּר עָלָיו
  choice: 为他赎罪
  rationale: כפר在祭司礼仪语境中表示施行遮盖、洁除或赎罪的礼仪行动。“为他赎罪”保留其传统神学分量，而不限定具体机制。
- source_word: לִפְנֵי יְהוָה
  choice: 在耶和华面前
  rationale: 直译且自然地表达祭祀行动是在יהוה面前进行；神名按项目惯例译为“耶和华”。
- source_word: מִזּוֹבוֹ
  choice: 因那人的漏症
  rationale: מן在此表示赎罪礼仪所针对的缘由或不洁来源；“因……漏症”既自然，也避免暗示漏症本身必然是道德罪过。
theological_decisions:
- issue: 礼仪洁净语境中חַטָּאת的译法
  choice: 赎罪祭
  alternative: 洁净祭
  rationale: “赎罪祭”是中文读者熟悉的祭名，但此处所处理的是漏症造成的礼仪性不洁，不应把它直接等同于道德犯罪。脚注保留“洁净祭”，以呈现该词在祭司文献中的礼仪功能。
- issue: כפר的译法
  choice: 赎罪
  alternative: 施行洁除／遮盖
  rationale: “赎罪”保留该词既有的祭祀与神学内涵；同时借助“因那人的漏症”维持经文本身的张力，不把其作用窄化为某一种赎罪理论，也不将疾病道德化。
translation_notes:
  register: 采用现代、庄重而易懂的祭祀法规语体。“这两只鸟”明确承接上一节；分成两句以保持中文清晰。保留传统术语“赎罪祭”“燔祭”“赎罪”，并用脚注说明礼仪洁净层面的词义。
