  text: וְ/אִ֨ם עַֽל הַ/מִּשְׁכָּ֜ב ה֗וּא א֧וֹ עַֽל הַ/כְּלִ֛י אֲשֶׁר הִ֥וא יֹשֶֽׁבֶת עָלָ֖י/ו בְּ/נָגְע/וֹ ב֑/וֹ יִטְמָ֖א עַד הָ/עָֽרֶב־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/023.yaml
  text: And if it is on the bed or on the item on which she sits[a], when he touches it he shall be unclean until the evening.
translation:
  language: zh_hans
  text: 若有某物在床上，或在她所坐的物件[a]上，谁碰到它，就不洁净直到傍晚。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “物件”也可译作“器具”或“器皿”；希伯来语 כְּלִי 含义较广，可指物品、器具或容器。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: 若
  rationale: 以自然的现代汉语引出与上文相连的条件条款；汉语无需机械补出“并且”。
- source_word: עַל הַמִּשְׁכָּב
  choice: 在床上
  rationale: מִשְׁכָּב在此洁净条例中指床或躺卧之处，“床”最简明自然。
- source_word: הוּא
  choice: 它
  rationale: 保留希伯来语阳性单数代词所指的事物，不擅自明确其身份；具体所指须由上下文判断。
- source_word: עַל הַכְּלִי
  choice: 在……物件上
  rationale: כְּלִי是范围较广的名词，可指物件、器具或器皿；“物件”在此最能避免不必要的限缩。
- source_word: אֲשֶׁר הִוא יֹשֶׁבֶת עָלָיו
  choice: 她所坐的
  rationale: 直接表达关系从句及持续或惯常的坐姿含义，符合汉语法律条文的简洁风格。
- source_word: בְּנָגְעוֹ בוֹ
  choice: 谁碰到它
  rationale: 希伯来语为第三人称阳性单数，在律法案例中可作通用个体；汉语用“谁”自然表达泛指而不额外限定性别。
- source_word: יִטְמָא
  choice: 就不洁净
  rationale: 在条件句中表达触碰所导致的礼仪状态；“不洁净”沿用利未记洁净条例中的核心术语。
- source_word: עַד הָעָרֶב
  choice: 到晚上
  rationale: 准确表达该不洁净状态持续至傍晚的固定时限，现代汉语简洁自然。
theological_decisions:
- issue: טָמֵא在利未记洁净条例中的性质
  choice: 译作“不洁净”，指礼仪层面的不洁状态
  alternative: 译作“在礼仪上不洁净”或“被玷污”
  rationale: 原文只陈述洁净状态，并不在本节断定道德罪责；正文保留简明术语，避免加入解释性或宗派性措辞。
- issue: הוּא所指对象的含混性
  choice: 保留代词“它”，让上下文确定所指
  alternative: 明确补作“那不洁之物”或其他具体名词
  rationale: 本节语法中的所指并非完全明说，翻译不宜擅自消除原文的指代含混。
translation_notes:
  register: 采用现代、庄重而易懂的律法条文语体。“谁……谁就……”使泛指条件关系清楚自然；脚注标记[a]已置于相应词后。
