revisions:
- from: 若它在床上，或在她所坐的物件[a]上，谁碰到它，谁就不洁净到晚上。
  to: 若有某物在床上，或在她所坐的物件[a]上，谁碰到它，就不洁净直到傍晚。
  rationale: 以“某物”解决汉语中无先行词的“它”所造成的断裂，同时不将原文未明确的对象解释为特定物品或人物。保留“物件”及其词汇脚注，并将时间表达调整为更贴近 עֶרֶב 的“直到傍晚”。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T04:50:52Z'
