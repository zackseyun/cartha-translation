base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/003.yaml
  text: 'And this shall be his uncleanness in his discharge: whether his body runs with his discharge[a], or his body is stopped up from his discharge, it is his uncleanness.'
translation:
  language: zh_hans
  text: 他因流液而有的不洁是这样：无论他的身体流出流液[a]，还是他的身体因流液而闭塞，这都是他的不洁。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译为“他的肉身流出他的流液……他的肉身因他的流液而闭塞”。希伯来语用“肉身”；在此处指与流液有关的身体状况或部位。
    reason: lexical_alternative
lexical_decisions:
- source_word: טֻמְאָתוֹ
  choice: 他的不洁
  rationale: 在利未记洁净条例中指礼仪上的不洁状态；“不洁”自然、简明，也保留其律法范畴。
- source_word: זוֹב
  choice: 流液
  rationale: 此处指男性生殖部位异常流出的液体。“流液”既保留该词与“流”的词义联系，也符合现代中文的庄重、临床语域。
- source_word: רָר
  choice: 仍在流液
  rationale: 该动词表示液体正在流出；“仍在流液”清楚呈现持续流出的状态，并与后面的闭塞形成对照。
- source_word: בְּשָׂרוֹ
  choice: 他的下体
  rationale: 字面为“他的肉身”，但本段语境具体涉及男性生殖部位；“下体”比泛称“身体”更清楚，也不作过度具体的解剖限定。
- source_word: הֶחְתִּים
  choice: 闭塞
  rationale: 该形式表达关闭、堵住而使流液不能排出的状态。“闭塞”准确保留与流出相反的身体状况。
- source_word: מִזּוֹבוֹ
  choice: 因流液而
  rationale: 介词短语可理解为闭塞与流液之间的来源或原因关系；自然中文以“因……而”表达，同时不额外解释具体生理机制。
- source_word: וְזֹאת תִּהְיֶה
  choice: 是这样
  rationale: 这是引出法律判定的公式；结合中文句序译为“……是这样”，自然且保留规定性语气。
- source_word: אוֹ
  choice: 无论……还是……
  rationale: 原文列举两种都导致同一判定的情形；此结构明确呈现法律上的二择并列。
theological_decisions: []
