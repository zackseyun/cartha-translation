  text: וְ/אִ֡ם שָׁכֹב֩ יִשְׁכַּ֨ב אִ֜ישׁ אֹתָ֗/הּ וּ/תְהִ֤י נִדָּתָ/הּ֙ עָלָ֔י/ו וְ/טָמֵ֖א שִׁבְעַ֣ת יָמִ֑ים וְ/כָל הַ/מִּשְׁכָּ֛ב אֲשֶׁר יִשְׁכַּ֥ב עָלָ֖י/ו יִטְמָֽא־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/024.yaml
  text: If a man indeed lies with her[a], and her menstrual impurity comes upon him, he shall be unclean seven days, and every bed on which he lies shall be unclean.
translation:
  language: zh_hans
  text: 如果有男人确实与她同寝[a]，她经期的不洁就临到他身上；他要不洁净七天，凡他躺在上面的床也都要不洁净。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可更明确地译作“如果男人确实与她发生性关系”。希伯来语的惯用说法直译为“如果男人确实与她躺卧”。
    reason: 说明原文“躺卧”的委婉语实际指性关系，并保留不定式绝对形加强的语气。
lexical_decisions:
- source_word: שָׁכֹב יִשְׁכַּב
  choice: 确实与她同寝
  rationale: 希伯来语以不定式绝对形配合未完成式来加强动词语意；“确实”保留强调，“与她同寝”既保留原文委婉说法，也依上下文指向性关系。
- source_word: אִישׁ
  choice: 男人
  rationale: 该词为阳性单数，在此指成年男性；“男人”是自然且性别准确的现代汉语表达。
- source_word: אֹתָהּ
  choice: 她
  rationale: 直接宾语代词，指上文处于经期的妇人。
- source_word: נִדָּתָהּ
  choice: 她经期的不洁
  rationale: נִדָּה 在利未记的洁净条例中不只指生理月经，也指与经期相关的礼仪性不洁状态；此译兼顾生理背景和礼仪范畴。
- source_word: וּתְהִי ... עָלָיו
  choice: 临到他身上
  rationale: 原文直译近于“在他身上”；“临到他身上”保留不洁转及男子的意象，同时符合现代汉语。
- source_word: וְטָמֵא
  choice: 他就不洁净
  rationale: 条件句之后表明结果；“就不洁净”自然呈现法律条例中的结果关系，而不暗示道德罪责。
- source_word: שִׁבְעַת יָמִים
  choice: 七天
  rationale: 按原文直接翻译。
- source_word: הַמִּשְׁכָּב
  choice: 床
  rationale: 该词指躺卧之处；在本节语境中译作日常用语“床”最为清楚。
- source_word: אֲשֶׁר יִשְׁכַּב עָלָיו
  choice: 他所躺的
  rationale: 以自然的汉语关系结构修饰“床”，准确表达“他躺在其上”。
- source_word: יִטְמָא
  choice: 也都不洁净
  rationale: 未完成式在条例结果中表示该床进入不洁状态；“也都”承接“每一张”，使汉语表达完整自然。
theological_decisions:
- issue: 如何翻译礼仪性不洁而不引入道德罪责
  choice: 采用“不洁”“不洁净”和“经期的不洁”等礼仪洁净用语
  alternative: 译为“玷污”“污秽”，使人可能理解为道德败坏
  rationale: 利未记十五章讨论的是礼仪洁净状态；本节本身并未把这种状态等同于个人的道德罪责。
- issue: 是否把 שָׁכֹב יִשְׁכַּב 直接明说为性交
  choice: 正文保留委婉语“确实与她同寝”，脚注说明其所指
  alternative: 正文译作“确实与她发生性关系”
  rationale: 原文用“躺卧”这一委婉表达，同时上下文清楚指向性关系；正文与脚注的安排既保留原文修辞，也避免读者误解为普通睡卧。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。“同寝”略带经文式的委婉色彩，但普通读者仍可理解；脚注进一步消除歧义。“不洁净”在全节中作为礼仪洁净术语使用，不表示道德定罪。
