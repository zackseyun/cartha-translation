  text: וְ/כֹל֩ אֲשֶׁ֨ר תִּשְׁכַּ֥ב עָלָ֛י/ו בְּ/נִדָּתָ֖/הּ יִטְמָ֑א וְ/כֹ֛ל אֲשֶׁר תֵּשֵׁ֥ב עָלָ֖י/ו יִטְמָֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/020.yaml
  text: And everything on which she lies during her menstrual impurity shall be unclean[a], and everything on which she sits shall be unclean.
translation:
  language: zh_hans
  text: 她在经期不洁时所躺过的一切，都不洁；她所坐过的一切，也都不洁。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נִדָּה
  choice: 经期不洁
  rationale: 本节处于利未记的洁净条例中，此词不仅指月经这一生理现象，也指与之相关的礼仪性不洁状态；“经期不洁”兼顾了两层含义。
- source_word: תִּשְׁכַּב
  choice: 躺过
  rationale: שׁכב在此指躺卧在某物上，并不必然含有睡觉之意；“躺过”自然表达该动作及其对物品所产生的后续洁净状态。
- source_word: תֵּשֵׁב
  choice: 坐过
  rationale: ישׁב在此直接表示坐在某物上；“坐过”与前句“躺过”平行，也符合中文对已接触物品的自然表达。
- source_word: עָלָיו
  choice: ……过的……东西
  rationale: 该介词短语表示她躺或坐在某物之上；中文用关系结构“躺过的任何东西／坐过的任何东西”自然保留其空间关系。
- source_word: יִטְמָא
  choice: 都不洁
  rationale: טמא在本段指礼仪制度中的不洁状态，而非道德罪责；“不洁”是简洁且符合上下文的法律用语。
- source_word: וְכֹל אֲשֶׁר
  choice: 任何东西
  rationale: 此结构具有周遍、概括之意；“任何东西”准确传达凡符合所述条件之物皆包括在内。
theological_decisions:
- issue: 利未记洁净条例中“不洁”的性质
  choice: 用“不洁”表达礼仪性洁净状态，不暗示月经本身构成道德过犯
  alternative: 采用可能令人理解为道德污秽或罪恶的措辞
  rationale: 本节规定的是以色列洁净制度中的状态及其传递，并未宣称月经本身具有道德罪责。
- issue: נִדָּה兼具生理与礼仪含义
  choice: 正文译作“经期不洁”，同时以脚注保留“月经期间”的较简译法
  alternative: 正文仅译作“月经期间”或仅译作“不洁期间”
  rationale: “经期不洁”保留原词在本语境中的双重指向，脚注则让读者看见较贴近生理时间表达的可能译法。
translation_notes:
  register: 采用现代、庄重而易懂的法规体中文。以“躺过／坐过”形成清楚平行，并用“任何东西……都……”传达希伯来文的周遍语气；避免把礼仪性不洁误写成道德罪责。
