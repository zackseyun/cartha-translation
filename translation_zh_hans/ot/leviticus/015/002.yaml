base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/002.yaml
  text: 'Speak to the sons of Israel and say to them: When any man has a discharge from his body[b][a], his discharge is unclean.'
translation:
  language: zh_hans
  text: 你们要向以色列人[a]讲话，并告诉他们：任何男人若身体[b]有分泌物流出，他所流出的分泌物就是不洁净的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“以色列的众子”。
    reason: lexical_alternative
  - marker: b
    text: 或译“肉体”。
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבְּרוּ ... וַאֲמַרְתֶּם אֲלֵהֶם
  choice: 你们要……讲话，告诉他们
  rationale: 保留原文两个言说动词及复数命令的正式语气，同时使中文衔接自然。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 这是现代中文对该群体最自然、明确的称呼；脚注注明其字面形式。
- source_word: אִישׁ אִישׁ
  choice: 任何男人
  rationale: 重复的 אִישׁ 表示逐一、任指；本段所述为男性身体排出物，因此保留男性指称。
- source_word: זָב מִבְּשָׂרוֹ
  choice: 有液体从身体流出
  rationale: 以自然中文表达持续流出或排出液体的状态，不擅自将其限定为某一种具体分泌物；בָּשָׂר 的字面义另见脚注。
- source_word: זוֹבוֹ
  choice: 他流出的液体
  rationale: 与前面的 זָב 保持词义关联，也明确末句所判定为不洁净的是流出物。
- source_word: טָמֵא
  choice: 不洁净
  rationale: 采用利未记礼仪法规中的通行术语，表达礼仪上的不洁，而非自动判定为道德罪恶。
theological_decisions:
- issue: 末句不洁净所指
  choice: 他流出的液体是不洁净的
  alternative: 他是不洁净的
  rationale: זוֹבוֹ（他所流出的）为紧邻的阳性名词，הוּא 可与之呼应；因此正文保留原句最直接的语法关系，不把不洁净的判定改指向该男子本人。
- issue: 礼仪不洁术语
  choice: 不洁净
  alternative: 不纯洁
  rationale: “不洁净”能较稳定地表达利未记中的礼仪状态，并避免“纯洁”可能带来的主要是道德层面的理解。
translation_notes:
  register: 采用现代、庄重而易懂的法规语体。“任何男人”准确体现本节对象；“液体”保持原文对排出物种类的未限定状态。
