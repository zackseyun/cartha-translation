- from: 你们要对以色列人[a]讲话，告诉他们：任何男人若有液体从身体[b]流出，他流出的液体是不洁净的。
  to: 你们要向以色列人[a]讲话，并告诉他们：任何男人若身体[b]有分泌物流出，他所流出的分泌物就是不洁净的。
  rationale: 修订仅将过于宽泛的“液体”改为“分泌物”，并微调前半句连接；保留男性任指、身体／肉体的词汇脚注，以及末句将礼仪不洁的判定表述为指向“所流出的分泌物”。
