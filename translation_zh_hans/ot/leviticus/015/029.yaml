base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/029.yaml
  text: And on the eighth day she shall take for herself two turtledoves or two young pigeons[a], and bring them to the priest at the entrance of the tent of meeting.
translation:
  language: zh_hans
  text: 第八天，她要为自己取两只斑鸠或两只雏鸽，把它们带到会幕门口的祭司那里[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文在“祭司”和“会幕门口”前都用了“到”；也可较直译为：“把它们带到祭司那里，到会幕门口。”
    reason: 保留原文重复介词所呈现的句法形式及较直译的译法。
lexical_decisions:
- source_word: וּבַיּוֹם הַשְּׁמִינִי
  choice: 第八天
  rationale: בַּיּוֹם构成时间短语；句首的ו承接前文法令，在现代汉语中无需机械译作“并且”。
- source_word: תִּקַּח לָהּ
  choice: 她要为自己取
  rationale: 未完成式在律法条文中表达规定；לָהּ具有受益、反身意味，译作“为自己”予以保留。
- source_word: שְׁתֵּי תֹרִים
  choice: 两只斑鸠
  rationale: תֹרִים指祭祀用的斑鸠；量词“只”符合现代汉语习惯。
- source_word: שְׁנֵי בְּנֵי יוֹנָה
  choice: 两只雏鸽
  rationale: 字面为“鸽子的幼鸟”，在祭祀语境中自然译作“雏鸽”。
- source_word: וְהֵבִיאָה אוֹתָם
  choice: 把它们带到
  rationale: 该形式在连续的律法指令中承接前一动词，表达应当执行的动作；“把”字句清楚自然。
- source_word: אֶל הַכֹּהֵן
  choice: 到祭司那里
  rationale: 定冠词指执行该礼仪的祭司；“到……那里”自然表达趋向目标。
- source_word: אֶל פֶּתַח אֹהֶל מוֹעֵד
  choice: 也就是会幕门口
  rationale: 第二个אֶל短语说明祭司所在或交付祭物的地点；“也就是”保留其与前一目标短语的并列、补充关系。אֹהֶל מוֹעֵד按通行且准确的圣经用语译作“会幕”。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的律法条文语体。“她要”表达规定性而不过度强化为命令；“也就是”使两个连续的目标短语在汉语中清楚，同时不把地点关系解释得过死。
