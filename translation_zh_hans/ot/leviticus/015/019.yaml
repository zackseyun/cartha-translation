  text: וְ/אִשָּׁה֙ כִּֽי תִהְיֶ֣ה זָבָ֔ה דָּ֛ם יִהְיֶ֥ה זֹבָ֖/הּ בִּ/בְשָׂרָ֑/הּ שִׁבְעַ֤ת יָמִים֙ תִּהְיֶ֣ה בְ/נִדָּתָ֔/הּ וְ/כָל הַ/נֹּגֵ֥עַ בָּ֖/הּ יִטְמָ֥א עַד הָ/עָֽרֶב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/019.yaml
  text: When a woman has a discharge[a], and her discharge in her body is blood, she shall remain in her menstrual impurity seven days[b], and everyone who touches her shall be unclean until evening.
translation:
  language: zh_hans
  text: 女人若有流出物，而她体内所流出的是血，她要处于月经不洁状态[a]七天；凡触摸她的，直到晚上都不洁净。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “月经不洁状态”指利未律法所规定的礼仪状态，并不一定表示道德上的过错。
    reason: cultural_note
lexical_decisions:
- source_word: זָבָה / זֹבָהּ
  choice: 有血液流出／所流的
  rationale: זוּב表示身体液体流出；结合下文“是血”，译为“有血液流出”自然清楚，并以“所流的”保留原文词根呼应。
- source_word: בִּבְשָׂרָהּ
  choice: 她体内的
  rationale: בשר可指肉身或身体，介词ב本义为“在……里面”；“她体内的血”既贴近原文，也符合现代汉语表达。
- source_word: בְנִדָּתָהּ
  choice: 处在经期的不洁中
  rationale: נִדָּה在利未记礼仪条例中指与月经相关的不洁状态；此译保留礼仪状态的含义，而不把它说成道德罪责。
- source_word: הַנֹּגֵעַ בָּהּ
  choice: 凡触碰她的
  rationale: כל加分词表示泛指；“凡……的”简洁保留法律条文语气。
- source_word: יִטְמָא עַד הָעָרֶב
  choice: 都不洁净到晚上
  rationale: טמא在洁净条例中指礼仪上的不洁净；“到晚上”自然表达该状态持续至晚间。
theological_decisions:
- issue: 如何表达礼仪性不洁而不引入道德定罪
  choice: 使用“经期的不洁”和“不洁净”作为礼仪身份用语
  alternative: 译为“污秽”“玷污”或只译作“月经期”
  rationale: 本节规定的是利未律法中的礼仪状态，并未说月经本身构成道德过犯；“不洁”既保留法律术语，也避免“污秽”可能带来的道德贬义。
translation_notes:
  register: 采用现代、庄重且易懂的法律条文语体。“血液流出”避免生硬直译，“处在……中”保留希伯来语状态表达；分号呈现前后规定的结构。
