  yaml_path: translation/ot/leviticus/015/001.yaml
  text: Then Yahweh spoke to Moses and to Aaron[a], saying,
translation:
  language: zh_hans
  text: 耶和华对摩西和亚伦说：
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: 说
  rationale: 该叙事性动词形式承接上下文并推进叙述；现代汉语通常无需另加“然后”。“说”与后面的 לֵאמֹר 共同构成自然的引语引介公式。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的神名音译“耶和华”，不以“主”这一称号替代原文专名。
- source_word: אֶל מֹשֶׁה וְאֶל אַהֲרֹן
  choice: 对摩西和亚伦
  rationale: 自然表达说话的对象；中文不必机械重复介词，也能清楚保留两位受话者。
- source_word: לֵאמֹר
  choice: 说：
  rationale: 该不定式用于引出随后直接话语；中文以“说：”准确而自然地表示其功能。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威；主
  rationale: 原文使用四字神名而非称号；“耶和华”是现代中文传统中广为人知的专名形式，既保留其专名性质，也避免以“主”消解原文区别。由于具体古代读音不能完全确定，不在正文中改用争议较明显的重构音“雅威”。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。冒号表明发言内容将在下一节出现；不另加“然后”，以免在缺少所示上文时造成不必要的显性时间关系。
