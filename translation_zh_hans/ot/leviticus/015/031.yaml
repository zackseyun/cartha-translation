  text: וְ/הִזַּרְתֶּ֥ם אֶת בְּנֵי יִשְׂרָאֵ֖ל מִ/טֻּמְאָתָ֑/ם וְ/לֹ֤א יָמֻ֨תוּ֙ בְּ/טֻמְאָתָ֔/ם בְּ/טַמְּאָ֥/ם אֶת מִשְׁכָּנִ֖/י אֲשֶׁ֥ר בְּ/תוֹכָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/031.yaml
  text: Thus you shall warn the sons of Israel about their uncleanness[a], so that they may not die in their uncleanness by defiling my tabernacle, which is among them.
translation:
  language: zh_hans
  text: 你们要警告以色列人，叫他们提防自己的不洁，免得他们在不洁之中玷污我在他们中间的帐幕而死亡。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִזַּרְתֶּם
  choice: 你们要警告……使他们远离
  rationale: 此处是זהר的使役形，基本语义是警戒、告诫；与מן连用也含有使人避开危险之意。译文同时保留“警告”的言语行为和“远离”的预防目的。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 这是希伯来语对以色列民的惯常群体称谓；现代汉语用“以色列人”自然、准确，也不把经文对象误限于男性。
- source_word: מִטֻּמְאָתָם / בְּטֻמְאָתָם
  choice: 远离自己的不洁 / 因不洁
  rationale: טֻמְאָה在本章指礼仪范畴的不洁，并非泛指道德罪恶。“不洁”是《利未记》语境中清楚而稳妥的对应词。前一处的מן与使役动词连用，译作“远离”；后一处的ב保留其与死亡相关的原因或处境张力，译作“因不洁”。
- source_word: בְּטַמְּאָם
  choice: 因……而玷污
  rationale: 这是טמא的使役不定式结构，表示他们使帐幕成为不洁，即“玷污”帐幕；同时承接死亡后果的具体缘由。
- source_word: מִשְׁכָּנִי
  choice: 我的帐幕
  rationale: מִשְׁכָּן在五经中具体指神居于以色列人中间的会幕性居所；“帐幕”既保留具体所指，也符合现代中文圣经语域。
- source_word: אֲשֶׁר בְּתוֹכָם
  choice: 在他们中间的
  rationale: 自然表达神的帐幕位于百姓中间，并保留神临在于群体之中的重点。
theological_decisions:
- issue: 礼仪不洁与道德罪恶的区分
  choice: 统一使用“不洁”，不译成“罪”或“邪恶”
  alternative: 污秽、 impurity所对应的“杂质”式表达
  rationale: 本节警告的是礼仪不洁对神帐幕造成的污染及其致命危险，不应将这一范畴直接道德化。
- issue: 死亡与不洁、玷污帐幕之间的关系
  choice: 译为“免得他们因不洁而玷污……以致死亡”
  alternative: “免得他们在不洁中死亡，因为他们玷污……”
  rationale: 希伯来文连续使用两个带ב的结构，可分别理解为死亡时的处境、原因或导致死亡的手段。中文译文清楚呈现玷污帐幕与死亡的因果联系，同时不额外说明死亡机制。
- issue: בְּנֵי יִשְׂרָאֵל的群体范围
  choice: 以色列人
  alternative: 以色列的儿子们、以色列子民
  rationale: 这是涵盖整个盟约群体的惯用称谓；译为“以色列人”避免现代汉语将其误解为仅指男性。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“警告……使他们远离”略作展开，以呈现使役动词与מן结构兼具告诫和隔离不洁的语义；句末“以致死亡”使希伯来文的预防目的在中文中清晰可读。
