revisions:
- from: 你们要警告以色列人，使他们远离自己的不洁，免得他们因不洁而玷污我在他们中间的帐幕，以致死亡。
  to: 你们要警告以色列人，叫他们提防自己的不洁，免得他们在不洁之中玷污我在他们中间的帐幕而死亡。
  rationale: 修订保留“警告”的使役语气，并以“提防自己的不洁”自然表达警告所针对的事项，避免把原文扩展成明确的“远离”命令。后半句按原文次序保留“在不洁之中”“玷污我的帐幕”“死亡”三者的关联，而不将其解释为单一、确定的因果链。
