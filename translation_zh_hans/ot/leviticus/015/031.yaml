  - severity: high
    issue: “免得他们因不洁而玷污……，以致死亡”重组了后半句的逻辑关系。
    rationale: 原文是“免得他们在他们的不洁中、因玷污我的帐幕而死亡”；草稿把“玷污”置于死亡之前并将其表达为由“不洁”导致的结果，弱化了玷污帐幕与死亡的直接关联。
  revised_text: 你们要警告以色列人，叫他们提防自己的不洁，免得他们在不洁之中玷污我在他们中间的帐幕而死亡。
