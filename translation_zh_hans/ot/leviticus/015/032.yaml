  text: זֹ֥את תּוֹרַ֖ת הַ/זָּ֑ב וַ/אֲשֶׁ֨ר תֵּצֵ֥א מִמֶּ֛/נּוּ שִׁכְבַת זֶ֖רַע לְ/טָמְאָה בָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/032.yaml
  text: 'This is the law for the one with a discharge[a], and for him from whom an emission of semen goes out, making him unclean by it:'
translation:
  language: zh_hans
  text: 这是关于患漏症者[a]，以及精液从他身上流出、因这精液成为不洁的人的条例：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “患漏症者”原文直译为“流出者”；在本章指身体有异常流液的人。
    reason: 说明原文称谓的字面形式及其在本章语境中的含义，避免将“漏症”当作现代医学上的特定诊断。
lexical_decisions:
- source_word: זֹאת תּוֹרַת
  choice: 这是关于……的条例
  rationale: 这是法律段落的总结公式。תּוֹרָה在此指针对特定情形所定的规范；译作“条例”既符合利未记的律例语境，也比“教导”更自然。
- source_word: הַזָּב
  choice: 患漏症者
  rationale: 原文是由分词构成的身份称谓，字面为“流出者”，在本章指有异常身体流液的人。“患漏症者”简洁地表达其病症性和持续性，同时不把本词本身过度限定为某一种具体分泌物。
- source_word: וַאֲשֶׁר תֵּצֵא מִמֶּנּוּ
  choice: 以及……从身上流出……之人
  rationale: 保留希伯来文“从他出来”的具体表达和第二类对象的关系从句结构；“身上”在现代汉语中比直译“从他出来”更清楚。
- source_word: שִׁכְבַת זֶרַע
  choice: 精液
  rationale: 该固定语表达精液或精液的排出。句中的动词“流出”已传达排出的动作，因此不重复译作“精液排出物”。
- source_word: לְטָמְאָה בָהּ
  choice: 因而成为不洁
  rationale: 不定式可表达结果或目的；此处译为结果关系较合语境。“不洁”保留利未记礼仪状态的专门用语，并未改写成道德上的有罪。
theological_decisions:
- issue: “不洁”的性质
  choice: 采用礼仪法规中的专门表述“成为不洁”
  alternative: 译为“被玷污”或暗示道德罪责
  rationale: 上下文论及身体流液所造成的礼仪状态，并非直接判定当事人犯了道德上的罪；因此应保留“不洁”而不添加罪责含义。
- issue: לְטָמְאָה所表达的目的或结果
  choice: 译作结果性的“因而”
  alternative: 译作目的性的“为要使他成为不洁”
  rationale: 希伯来文形式容许目的或结果的理解；在此，精液流出导致礼仪不洁，结果义在汉语中更自然，也避免暗示流出是为了使人不洁。
translation_notes:
  register: 采用现代、庄重而易懂的法规体。“这是关于……的条例”体现总结句式；保留“不洁”这一利未记中的礼仪术语。句末使用冒号，因为本节引出后续总结内容。
