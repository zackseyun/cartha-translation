  to: 这是关于患漏症者[a]，以及精液从他身上流出、因这精液成为不洁的人的条例：
  rationale: 修订仅澄清第二类人的关系从句：补出“他”以对应原文的人称指向，并以“因这精液”表达不洁是借该流出物而发生。保留“条例”“患漏症者”和“成为不洁”等既有术语与礼仪法规语域；冒号保留，以反映本节的总结句式及其与后文的连接。
