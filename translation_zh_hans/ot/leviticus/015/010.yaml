  text: וְ/כָל הַ/נֹּגֵ֗עַ בְּ/כֹל֙ אֲשֶׁ֣ר יִהְיֶ֣ה תַחְתָּ֔י/ו יִטְמָ֖א עַד הָ/עָ֑רֶב וְ/הַ/נּוֹשֵׂ֣א אוֹתָ֔/ם יְכַבֵּ֧ס בְּגָדָ֛י/ו וְ/רָחַ֥ץ בַּ/מַּ֖יִם וְ/טָמֵ֥א עַד הָ/עָֽרֶב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/010.yaml
  text: And everyone who touches anything that was under him shall be unclean until the evening[a], and whoever carries them shall wash his clothes and bathe in water[b], and be unclean until the evening.
translation:
  language: zh_hans
  text: 凡接触曾在他身下的任何物件的人，都不洁净到晚上[a]；搬动这些物件的人，要洗衣服，用水洗身[b]，并且不洁净到晚上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“凡接触在他身下的任何物件的人”。希伯来文采用未完成式，形式本身未明确区分现在或过去；按本段条例的语境，正文译作“曾在他身下”。
    reason: lexical_alternative
  - marker: b
    text: “这些物件”按希伯来文的复数代词，概括指前面所说、曾在那人身下的相关物件。
    reason: cross_reference
lexical_decisions:
- source_word: הַנֹּגֵעַ
  choice: 凡接触……的人
  rationale: נגע在此指身体接触；“接触”比单用“摸”更适合礼仪洁净法规，也自然涵盖有意或无意的接触。
- source_word: בְּכֹל אֲשֶׁר יִהְיֶה תַחְתָּיו
  choice: 他身下任何物件
  rationale: 直译为“在他下面的任何东西”。结合上文，这是指曾在患漏症者身下的物件；正文采用简洁自然的汉语措辞，时间关系保留在脚注中说明。
- source_word: יִטְמָא
  choice: 不洁净
  rationale: טמא在祭司礼仪法规中表示礼仪上的不洁；“不洁净”沿用清楚而庄重的中文圣经用语，不暗示一般性的道德罪责。
- source_word: עַד הָעָרֶב
  choice: 到晚上
  rationale: 准确表达不洁状态持续至当日晚间，符合现代汉语习惯。
- source_word: הַנּוֹשֵׂא אֹתָם
  choice: 搬动这些物件的人
  rationale: נשא可指拿起、携带或搬运；此处“搬动”自然表达对受沾染物件的实际拿取。希伯来文复数代词אֹתָם概括指前述相关物件。
- source_word: יְכַבֵּס בְּגָדָיו
  choice: 要洗衣服
  rationale: כבס בגדים是洁净条例中的固定表达；“洗衣服”准确、现代且易懂。
- source_word: וְרָחַץ בַּמַּיִם
  choice: 用水洗身
  rationale: רחץ במים在此表示以水清洗身体；“洗身”比“洗澡”更庄重，也避免加入浸泡方式等原文未说明的细节。
- source_word: וְטָמֵא עַד הָעָרֶב
  choice: 并且不洁净到晚上
  rationale: 保留洗衣、洗身之后仍持续不洁净到晚上的法律结果，不把清洗误解为立即恢复洁净。
theological_decisions:
- issue: “不洁净”的性质
  choice: 保留礼仪法规术语“不洁净”，不增译为犯罪或道德污秽
  alternative: 译作“有罪”或“污秽”
  rationale: 本节的טמא描述礼仪状态及其期限，原文没有直接判定道德罪责。
- issue: 清洗与恢复洁净的时间关系
  choice: 明确清洗后仍“不洁净到晚上”
  alternative: 把清洗表述为立即使人洁净
  rationale: 希伯来文末句明确保留不洁状态直到晚上，必须维持这一礼仪程序。
translation_notes:
  register: 采用现代、庄重而易懂的法规体。以“凡……的人……；……的人，要……”呈现希伯来文两个分句的平行结构；保留“不洁净到晚上”的重复，以维持原文的法律强调。
