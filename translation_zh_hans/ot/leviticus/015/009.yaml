  yaml_path: translation/ot/leviticus/015/009.yaml
  text: And every saddle on which the man with the discharge rides shall be unclean[a].
translation:
  language: zh_hans
  text: 患漏症的男子所骑的每件鞍具，都不洁净。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“所骑的任何东西”。希伯来语所指可比狭义的鞍具更广，泛指供人骑乘之物。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כָל
  choice: 任何……都
  rationale: וְ承接上文；כָּל在这里具有周遍、分配意义。汉语以“任何……都”自然表达该范围，句间承接则由上下文体现，避免生硬添加“并且”。
- source_word: הַ/מֶּרְכָּב
  choice: 鞍具
  rationale: מֶרְכָּב指供人骑乘之物；本洁净条例的语境更可能是坐骑上的鞍座或相关骑具，而非战车。“鞍具”既自然具体，又比单说“鞍”略宽。
- source_word: אֲשֶׁר יִרְכַּב עָלָיו
  choice: 所骑的
  rationale: 简洁表达关系从句“他骑在其上”，保留骑乘关系而符合现代汉语习惯。
- source_word: הַ/זָּב
  choice: 患漏症的人
  rationale: 该阳性实词化分词在本章指患有造成礼仪不洁之身体排出症状的男性。“患漏症的人”沿用本章术语并清楚说明其状态；原文的男性所指可由上下文确定，不必在本句生硬加“男人”。
- source_word: יִטְמָא
  choice: 不洁净
  rationale: 该词陈述礼仪法规中的不洁状态。“不洁净”不暗示道德罪责，也不额外判定重点是进入还是持续处于该状态。
theological_decisions:
- issue: 利未记中不洁语言的性质
  choice: 将טמא译为“不洁净”，按礼仪和法律状态理解
  alternative: “被玷污”或“污秽”
  rationale: 本节论及身体漏症造成的礼仪不洁，并不等同于个人犯罪或道德败坏；“不洁净”最能避免加入原文未表达的道德判断。
translation_notes:
  register: 采用现代、庄重而易懂的法规语体。“鞍具”使正文清楚自然，脚注保留מֶרְכָּב较宽的词义范围。
