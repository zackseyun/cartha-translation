  text: וּ/בַ/יּ֣וֹם הַ/שְּׁמִינִ֗י יִֽקַּֽח ל/וֹ֙ שְׁתֵּ֣י תֹרִ֔ים א֥וֹ שְׁנֵ֖י בְּנֵ֣י יוֹנָ֑ה וּ/בָ֣א לִ/פְנֵ֣י יְהוָ֗ה אֶל פֶּ֨תַח֙ אֹ֣הֶל מוֹעֵ֔ד וּ/נְתָנָ֖/ם אֶל הַ/כֹּהֵֽן־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/014.yaml
  text: And on the eighth day he shall take for himself two turtledoves or two young pigeons[a], and he shall come before Yahweh at the entrance of the tent of meeting and give them to the priest.
translation:
  language: zh_hans
  text: 第八天，他要为自己取两只斑鸠或两只雏鸽，到会幕门口，在雅威面前[a]把它们交给祭司。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文为“YHWH”（יהוה）；此处译作“雅威”，传统常译“耶和华”或“上主”。
    reason: 说明神名原文及主要中文译法，保留读音与翻译传统上的不确定性。
lexical_decisions:
- source_word: וּבַיּוֹם הַשְּׁמִינִי
  choice: 第八天
  rationale: 承接上一节的礼仪程序；现代汉语无需机械译出句首连接词，也能清楚保留先后次序。
- source_word: יִקַּח לוֹ
  choice: 他要为自己取
  rationale: “要”体现律法指令；“为自己”保留 לוֹ，说明由当事人为本人的礼仪预备祭鸟。
- source_word: שְׁתֵּי תֹרִים
  choice: 两只斑鸠
  rationale: תֹרִים 通常指可作祭物的斑鸠，这是现代中文圣经语境中准确且自然的鸟名。
- source_word: אוֹ שְׁנֵי בְּנֵי יוֹנָה
  choice: 或两只雏鸽
  rationale: 字面为“鸽子的幼鸟”；“雏鸽”简洁保留其幼龄含义。
- source_word: וּבָא לִפְנֵי יְהוָה אֶל פֶּתַח אֹהֶל מוֹעֵד
  choice: 来到会幕门口，来到雅威面前
  rationale: אֶל 表示朝向或到达会幕入口；לִפְנֵי יְהוָה 表示来到雅威面前。调整中文语序，避免误解为人进入会幕内部，同时保留两个空间与礼仪关系。
- source_word: וּנְתָנָם אֶל הַכֹּהֵן
  choice: 把鸟交给祭司
  rationale: נתן 在此指交付；明确“鸟”比单用“它们”更自然，也不增加源文没有的信息。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 源文直接使用四字神名。译作“雅威”较贴近其通行学术拟音，也保留其作为专名的性质；脚注说明传统译法，避免把有争议的读音处理成毫无疑问。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“会幕”沿用成熟、易懂的礼仪术语；句式按中文表达重组，但保留第八天、两类祭鸟、会幕门口、雅威面前及交给祭司等全部信息。
