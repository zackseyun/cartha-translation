  text: כָּל הַ/מִּשְׁכָּ֗ב אֲשֶׁ֨ר יִשְׁכַּ֥ב עָלָ֛י/ו הַ/זָּ֖ב יִטְמָ֑א וְ/כָֽל הַ/כְּלִ֛י אֲשֶׁר יֵשֵׁ֥ב עָלָ֖י/ו יִטְמָֽא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/004.yaml
  text: Every bed on which the man with the discharge lies shall be unclean[a], and every vessel on which he sits shall be unclean.
translation:
  language: zh_hans
  text: 患漏症的男子所躺的每张床，都不洁净；他所坐的每件器物[a]，也都不洁净。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “器物”所译的希伯来词含义宽泛，也可指物件、用具或器皿。
    reason: 说明כְּלִי不限于容器，并保留原词的词义范围。
lexical_decisions:
- source_word: הַמִּשְׁכָּב
  choice: 床
  rationale: מִשְׁכָּב指供人躺卧之处；本处译作“床”自然明确，也符合上下文所说因接触而产生的礼仪性不洁。
- source_word: הַזָּב
  choice: 患漏症的男子
  rationale: זָב是זוּב的实词化分词，本段特指身体有异常流液的男性；“患漏症的男子”既保留男性指向，也采用简明的现代汉语表达。
- source_word: יִשְׁכַּב עָלָיו
  choice: 躺过的
  rationale: 原文意为“他躺在其上”；在本条律例中，“躺过的”用自然汉语表达接触及其后果，不改变泛指效力。
- source_word: יִטְמָא
  choice: 不洁净
  rationale: 该动词在此表示律法规定的礼仪性不洁状态。“不洁净”保留《利未记》的核心洁净类别，又不额外加入“礼仪上”等解释性词语。
- source_word: הַכְּלִי
  choice: 器物
  rationale: כְּלִי可泛指器具、物件或用具，并不限于容器；“器物”比“器皿”更适合本处可供人坐在其上的对象，同时脚注保留其宽泛词义。
- source_word: יֵשֵׁב עָלָיו
  choice: 坐过的
  rationale: יָשַׁב与עַל连用表示“坐在……上面”；译作“坐过的”符合现代汉语习惯，并与前半句形成清楚的平行结构。
theological_decisions:
- issue: 不洁的性质
  choice: 译作“不洁净”，表达律法中的礼仪性状态
  alternative: 译作“在礼仪上不洁净”或“被玷污”
  rationale: 原文只陈述“不洁”的法律后果，没有明说“礼仪上”；加入该修饰虽可澄清，却超出原文字面。“被玷污”又可能使读者误解为道德败坏。
- issue: 主体的性别
  choice: 明确译作“患漏症的男子”
  alternative: 译作中性的“患漏症的人”
  rationale: 原文使用阳性单数形式，且紧接上文所述男性的身体流液，因此保留男性指向，不将其性别中和。
- issue: 不洁是状态还是过程
  choice: 译作“都不洁净”
  alternative: 译作“都成为不洁净”
  rationale: יִטְמָא可表达进入或处于不洁状态；本处汉语以“都不洁净”简洁陈述律法结果，同时不刻意限定状态变化的过程。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语，并以“……都不洁净；……也都不洁净”的平行句式体现希伯来律例文体。用“躺过”“坐过”避免生硬直译，同时保持行为与不洁后果之间的关系。
