base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/022.yaml
  text: And everyone who touches any object on which she sits shall wash his clothes and bathe in water[a], and he shall be unclean until the evening.
translation:
  language: zh_hans
  text: 凡触碰她所坐的任何物件[a]的人，都要洗衣服，用水洗身，并且不洁净直到晚上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “物件”也可译作“器具”或“器皿”。希伯来语 כְּלִי 是广义词，可指各种物品或用具。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָל הַנֹּגֵעַ
  choice: 凡触碰……的人
  rationale: 分词作名词性用法，指任何符合条件的人；“凡……的人”自然地保留了全面、概括的范围。
- source_word: בְּכָל כְּלִי
  choice: 任何物件
  rationale: כְּלִי 可泛指器具、器皿或物品；这里所指之物可供人坐，故用范围较宽的“物件”，避免限缩为容器。
- source_word: אֲשֶׁר תֵּשֵׁב עָלָיו
  choice: 她坐过的
  rationale: 关系从句修饰“物件”，“她”承接上文所述的妇人；汉语用“坐过的”自然表达接触已经发生且该物件因此处于相关状态。
- source_word: יְכַבֵּס בְּגָדָיו
  choice: 要洗净衣服
  rationale: כִּבֵּס 与衣服连用指洗涤衣物；“要”保留律法规定的义务语气，“洗净”清楚表达洗衣。
- source_word: וְרָחַץ בַּמַּיִם
  choice: 用水洗身
  rationale: 利未记洁净条例中 רָחַץ 通常指用水洗身体；“洗身”比单说“洗”更明确，又不额外规定具体沐浴方式。
- source_word: וְטָמֵא עַד הָעָרֶב
  choice: 并且不洁净到晚上
  rationale: טָמֵא 表示礼仪上的不洁净，并非道德罪责；“到晚上”保留其持续期限。
theological_decisions:
- issue: 利未记洁净条例中 טָמֵא 的性质
  choice: 译为“不洁净”，作为礼仪状态表达
  alternative: 污秽；有罪
  rationale: 本节描述因接触而产生、持续到晚上的礼仪不洁，不应加入道德败坏或个人罪责的含义。
translation_notes:
  register: 采用现代、庄重且易懂的律法体汉语。“凡……的人，都要……”清楚呈现普遍适用的规定；保留“不洁净”这一利未记中的礼仪术语。脚注标记置于全节末尾，所注释的词“物件”已明确出现在正文中。
