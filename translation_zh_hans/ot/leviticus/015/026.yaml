base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/026.yaml
  text: Every bed on which she lies during all the days of her discharge shall be to her like the bed of her menstruation[a], and every vessel on which she sits shall be unclean[b], like the uncleanness of her menstruation.
translation:
  language: zh_hans
  text: 在她流血的日子里，她所躺的每一张床，都要像她月经期间所躺的床一样[a]；她所坐的每一件物品[b]都要成为不洁净的，就像她月经期间的不洁净一样。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“都要像她经期不洁净时所躺的床一样。”希伯来语词“尼达”（נִדָּה）可指月经状态及其所伴随的礼仪隔离或不洁净状态。
    reason: lexical_alternative
  - marker: b
    text: “物品”原文是一个含义宽泛的词，指器具、用品或其他物件，并非只指容器。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁכָּב
  choice: 床
  rationale: 该词指躺卧之处；本节与礼仪条例的具体场景相符，译作“床”自然清楚。
- source_word: כָּל יְמֵי זוֹבָהּ
  choice: 在她流血的所有日子
  rationale: זוֹב在本段指持续的异常血性排出；结合15:25的语境译作“流血”，比笼统的“排出物”更明确，同时保留持续时段。
- source_word: כְּמִשְׁכַּב נִדָּתָהּ
  choice: 像她月经期间所躺的床一样
  rationale: נִדָּה在此指月经状态及其相关礼仪隔离；正文用现代读者易懂的“月经期间”，脚注补充其礼仪含义。
- source_word: יִהְיֶה לָּהּ
  choice: 都要像……一样
  rationale: 该结构表示对她而言具有相同的礼仪地位；中文以比较结构自然表达，不机械保留“对她成为”。
- source_word: כְּלִי
  choice: 物品
  rationale: כְּלִי范围广，可指器具、用品或其他物件；因这里是她坐在其上之物，“物品”比容易被理解为容器的“器皿”更准确。
- source_word: טָמֵא / טֻמְאָה
  choice: 不洁净 / 不洁净
  rationale: 在利未记洁净条例中，这些词表示礼仪身份，并非道德罪责；“不洁净”是清楚而惯常的中文表达。
theological_decisions:
- issue: 本节不洁净语言的性质
  choice: 使用“不洁净”表达礼仪状态
  alternative: 使用“不纯洁”或带有道德贬义的措辞
  rationale: 经文讨论以色列礼仪制度中的洁净身份，并非宣告妇女在道德上有罪。
- issue: נִדָּה的表达
  choice: 正文译作“月经期间”，脚注说明相关礼仪状态
  alternative: 正文直接译作“经期的不洁净状态”
  rationale: 具体译出月经使正文清楚自然；脚注保留该希伯来词包含礼仪隔离或不洁净状态的语义，不把解释过度塞入正文。
- issue: זוֹבָהּ所指的排出
  choice: 依上下文译作“流血”
  alternative: “排出物”或“流液”
  rationale: 15:25明确描述超出正常经期的血流；“流血”既符合近邻语境，也避免含糊成其他体液。
translation_notes:
  register: 采用现代、庄重而清楚的法规语体。“流血”承接15:25的异常血流语境；“床”和“物品”保持具体可懂。“都要成为不洁净的”保留法律宣告色彩，并以脚注交代נִדָּה的礼仪语义。
