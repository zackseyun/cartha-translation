  text: וְ/כָל הַ/נּוֹגֵ֥עַ בָּ֖/ם יִטְמָ֑א וְ/כִבֶּ֧ס בְּגָדָ֛י/ו וְ/רָחַ֥ץ בַּ/מַּ֖יִם וְ/טָמֵ֥א עַד הָ/עָֽרֶב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/027.yaml
  text: And everyone who touches them shall be unclean[a], and he shall wash his clothes and bathe in water, and be unclean until the evening.
translation:
  language: zh_hans
  text: 凡接触那些东西的，都不洁净；要洗衣服，用水洗身，并且不洁净到晚上。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/כָל הַ/נּוֹגֵעַ
  choice: 凡触碰……的人
  rationale: כָּל加实体化分词表达无定的全称范围；“凡……的人”自然、庄重，并保留涵盖所有人的语气。
- source_word: בָּ/ם
  choice: 那些东西
  rationale: 阳性复数代词回指上文与妇人不洁有关、供她躺卧或坐过的物件。正文不进一步点明具体所指，以免过度解释；“那些东西”比单说“它们”在现代汉语中更清楚。
- source_word: יִטְמָא
  choice: 都不洁
  rationale: טמא在本段指礼仪层面的不洁，而非道德罪恶；“不洁”保留利未记洁净条例的专门范畴。
- source_word: וְ/כִבֶּס בְּגָדָי/ו
  choice: 他要洗净衣服
  rationale: כבס指洗涤衣物；“洗净衣服”符合现代汉语习惯，并准确表达规定的动作。
- source_word: וְ/רָחַץ בַּ/מַּיִם
  choice: 用水洗身
  rationale: רחץ在此礼仪语境中指清洗身体；“用水洗身”比泛称“用水洗”更明确，又不添加原文没有的方式细节。
- source_word: וְ/טָמֵא עַד הָ/עָרֶב
  choice: 并且不洁净到晚上
  rationale: 该分句说明礼仪不洁持续的时限；“到晚上”自然对应עַד הָעָרֶב。此处用“不洁净”描述持续状态，与前面的“不洁”意义一致。
theological_decisions:
- issue: 利未记中不洁用语的性质
  choice: 按礼仪洁净范畴译为“不洁／不洁净”
  alternative: 译为“玷污”或理解为道德上的罪污
  rationale: 上下文是礼仪洁净条例。接触所导致的是规定期限内的不洁状态，原文并未将接触本身说成道德犯罪。
translation_notes:
  register: 采用现代、清楚而庄重的法规语体。“凡……的人”“要……”体现普遍适用的规定；保留“不洁”的礼仪术语，并用脚注说明复数代词的上文所指。
