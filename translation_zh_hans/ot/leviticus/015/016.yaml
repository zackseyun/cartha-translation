  text: וְ/אִ֕ישׁ כִּֽי תֵצֵ֥א מִמֶּ֖/נּוּ שִׁכְבַת זָ֑רַע וְ/רָחַ֥ץ בַּ/מַּ֛יִם אֶת כָּל בְּשָׂר֖/וֹ וְ/טָמֵ֥א עַד הָ/עָֽרֶב־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/016.yaml
  text: And if a man has an emission of semen[b][a], he shall wash all his flesh in water and be unclean until the evening.
translation:
  language: zh_hans
  text: 若有男子排出精液[a]，他就要用水洗遍全身；他就不洁净[b]到晚上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“流出精液”；原文直译近于“流出种子”。
    reason: lexical_alternative
  - marker: b
    text: 这里的“不洁净”指利未记洁净条例中的礼仪上的不洁净状态，并非对当事人道德罪责的判定。
    reason: cultural_note
lexical_decisions:
- source_word: אִישׁ
  choice: 男子
  rationale: 本节明确涉及男性的精液排出，译作“男子”既准确又自然。
- source_word: כִּי
  choice: 若
  rationale: 在条例体裁中引出假设情形，译作“若”符合现代汉语法律式表达。
- source_word: תֵצֵא מִמֶּנּוּ
  choice: 排出
  rationale: 原文直译为“从他出来”；“排出”在身体分泌物的语境中自然清楚，又不限定具体原因。
- source_word: שִׁכְבַת זָרַע
  choice: 精液
  rationale: 该词组指精液或精液的排出；正文用“排出精液”准确表达其意义，同时避免把范围缩窄为睡眠中的“遗精”。
- source_word: וְרָחַץ בַּמַּיִם
  choice: 就要用水洗
  rationale: 在条例的连续结构中表达应当采取的行动；“用水洗”是自然的现代汉语。
- source_word: אֶת כָּל בְּשָׂרוֹ
  choice: 遍全身
  rationale: 希伯来文直译为“他全部的肉身”，语境中指整个身体；“洗遍全身”自然且保留范围完整的强调。
- source_word: וְטָמֵא
  choice: 并且不洁净
  rationale: “不洁净”保留利未记洁净条例的核心术语，不把礼仪状态误译成道德罪责。
- source_word: עַד הָעָרֶב
  choice: 到晚上
  rationale: 准确表达这种不洁净状态持续至晚上的时间界限。
theological_decisions:
- issue: 洁净条例中 טָמֵא 的性质
  choice: 正文译作“不洁净”，脚注说明这是礼仪上的状态
  alternative: 译作“在礼仪上不洁净”或“被玷污”
  rationale: 正文保留简洁而传统的洁净术语，不在译文中加入原文没有明说的解释；脚注则防止读者误以为经文必然是在判定道德罪责。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。“排出精液”比“遗精”涵盖面更广，避免把原文限定为睡眠中的自然排精；“洗遍全身”自然传达“洗他全部肉身”的完整范围。
