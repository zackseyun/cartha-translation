base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/033.yaml
  text: and for the woman who is sick in her menstrual impurity, and for the one who has a discharge, whether male or female, and for a man who lies with an unclean woman.
translation:
  language: zh_hans
  text: 以及经期不洁而身体不适的妇女[a]，患漏症的人，无论男女，还有与不洁净[b]的妇女同房的男人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “身体不适”所译的希伯来词也可理解为“患病的”或“受苦的”；此处与“经期不洁”相连，指处于经期状态的妇女，并不把经期本身界定为疾病。
    reason: lexical_alternative
  - marker: b
    text: 本节的“不洁净”是利未记律法所说的礼仪性不洁，并不是指道德污秽。
    reason: cultural_note
lexical_decisions:
- source_word: הַדָּוָה בְּנִדָּתָהּ
  choice: 在经期不洁中的妇女
  rationale: הַדָּוָה 可指因经血而身体不适或处于经期的妇女，בְּנִדָּתָהּ 则明确限定为她经期所处的礼仪性不洁状态。译文以自然中文表达其整体含义，并用脚注保留前一词所含的身体不适色彩。
- source_word: הַזָּב אֶת־זוֹבוֹ
  choice: 患漏症的人
  rationale: 希伯来语以同源词组合描述有持续性身体流液的人；“患漏症的人”简洁保留利未记中的病例类别，又不预先限定性别。
- source_word: לַזָּכָר וְלַנְּקֵבָה
  choice: 无论男女
  rationale: 此语说明前述漏症条例同时适用于男性和女性；这样翻译符合现代汉语，也保留其范围。
- source_word: אֲשֶׁר יִשְׁכַּב עִם
  choice: 与……同房
  rationale: 该表达在此指性关系。“同房”保留原文委婉而庄重的语气，同时让现代读者清楚理解。
- source_word: טְמֵאָה
  choice: 不洁净的妇女
  rationale: 该阴性形容词指处于礼仪性不洁状态的妇女。“不洁净”与利未记的洁净条例用语一致，并不暗示其道德品格污秽。
theological_decisions:
- issue: 礼仪性不洁与道德污秽的区分
  choice: 用“不洁”“不洁净”表达利未记律法规定的礼仪状态，并加脚注说明
  alternative: 译作“肮脏”“有罪”或其他带有道德谴责意味的说法
  rationale: 本节总结的是身体流液及经期所涉及的洁净条例；原文没有宣告这些人的人格或道德本身污秽。
- issue: הַדָּוָה 的语义呈现
  choice: 正文按上下文译为“在经期不洁中的妇女”，脚注保留“身体不适”这一词义色彩
  alternative: 正文译作“因经期而患病的妇女”
  rationale: 原词可带有虚弱或不适之意，但后接 בְּנִדָּתָהּ 已明确说明经期状态。正文若直加“患病”容易使现代读者误以为经期本身被界定为疾病；脚注更适合保存这一词义张力。
translation_notes:
  register: 采用现代、庄重且易懂的法律条文式表达。保留本节作为前文条例总结句的并列结构；“漏症”“同房”“不洁净”与利未记的身体流液、性关系及礼仪洁净语境相称。
