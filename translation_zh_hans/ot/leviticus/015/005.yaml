  text: וְ/אִ֕ישׁ אֲשֶׁ֥ר יִגַּ֖ע בְּ/מִשְׁכָּב֑/וֹ יְכַבֵּ֧ס בְּגָדָ֛י/ו וְ/רָחַ֥ץ בַּ/מַּ֖יִם וְ/טָמֵ֥א עַד הָ/עָֽרֶב־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/005.yaml
  text: And a man who touches his bed shall wash his clothes and bathe in water[b][a], and he shall be unclean until the evening.
translation:
  language: zh_hans
  text: 若有男子触碰他的床铺[a]，他要洗自己的衣服，用水洗身；他将不洁净，直到晚上[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “床铺”也可译作“躺卧之处”。希伯来语所指可比固定的床更广，包括他躺过的地方。
    reason: lexical_alternative
  - marker: b
    text: 这里指按照洁净条例处于礼仪上的不洁净状态。
    reason: cultural_note
lexical_decisions:
- source_word: וְ/אִישׁ אֲשֶׁר
  choice: 若有人
  rationale: 在本条律例中，אִישׁ引出一个不特定的个体；现代汉语用“若有人”自然、准确，也不额外限定身份。
- source_word: יִגַּע
  choice: 触碰
  rationale: נגע在这里指因接触而产生礼仪后果；“触碰”简明地保留实际接触之意。
- source_word: בְּ/מִשְׁכָּב/וֹ
  choice: 他的床铺
  rationale: מִשְׁכָּב指躺卧之处，常指床或铺设的卧具；“床铺”比单用“床”略宽，又保持自然。第三人称所属关系依原文保留。
- source_word: יְכַבֵּס בְּגָדָי/ו
  choice: 要洗净衣服
  rationale: כּבס在此特指洗衣物；“要”表达律例要求，“洗净衣服”符合现代汉语。
- source_word: וְ/רָחַץ בַּ/מַּיִם
  choice: 用水沐浴
  rationale: רחץ在这里指清洗身体；“用水沐浴”清楚区别于前面的洗衣服。ב与“水”连用可表示以水清洗。
- source_word: וְ/טָמֵא עַד הָ/עָרֶב
  choice: 并且不洁净到晚上
  rationale: טָמֵא描述礼仪上的不洁净状态，并非直接指道德罪责；“到晚上”准确表达该状态持续的期限。
theological_decisions:
- issue: “不洁净”的性质
  choice: 正文保留利未记礼仪制度中的“不洁净”，并用脚注说明其范围
  alternative: 在正文扩译为“在礼仪上不洁净”
  rationale: 原文只用טָמֵא。正文保留其经文术语和简洁性，不把解释性限定直接加入正文；脚注可避免现代读者误解为身体肮脏或道德有罪。
translation_notes:
  register: 采用现代、庄重而易懂的律例语体。“若有人……就要……”呈现条件与义务；避免古奥的“沐身”“必不洁”等措辞，同时保留“不洁净”这一利未记的核心礼仪术语。
