base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/021.yaml
  text: And everyone who touches her bed shall wash his clothes and bathe in water[a], and he shall be unclean until the evening.
translation:
  language: zh_hans
  text: 凡触碰她的床铺[a]的人，都要洗衣服，用水洗身，并且一直不洁净到晚上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “床铺”也可译作“躺卧之处”或“卧具”；希伯来语指她躺卧的地方。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָל הַנֹּגֵעַ
  choice: 凡触碰……的人
  rationale: כָּל与作名词用的分词 הַנֹּגֵעַ 构成泛指，译作“凡……的人”自然、庄重，也保留普遍适用的法律表述。
- source_word: בְּמִשְׁכָּבָהּ
  choice: 她床铺
  rationale: מִשְׁכָּב指躺卧之处，在本节具体语境中译作“床铺”清楚自然，同时脚注保留“躺卧之处”等较宽泛含义。
- source_word: יְכַבֵּס בְּגָדָיו
  choice: 要洗净衣服
  rationale: כבס专指洗涤衣物；“要”体现法规要求，“洗净衣服”符合现代汉语表达。希伯来语阳性单数领属形式在泛指句中不必机械译成“他的”。
- source_word: וְרָחַץ בַּמַּיִם
  choice: 用水洗身
  rationale: רחץ在此指清洗身体，与前面的洗衣有别；“用水洗身”明确表达身体洁洗，也贴近介词短语 בַּמַּיִם。
- source_word: וְטָמֵא עַד הָעָרֶב
  choice: 并且不洁净到晚上
  rationale: טמא表示礼仪上的不洁净状态；“到晚上”准确表达 עַד הָעָרֶב 所标示的持续期限。
theological_decisions:
- issue: 不洁净的性质
  choice: 译为“不洁净”，按上下文保留礼仪状态的含义
  alternative: “污秽”或“有罪”
  rationale: 利未记15章论述礼仪洁净条例；原文并未在本节断言道德罪责，因此不把该状态解释成个人犯罪或道德污秽。
translation_notes:
  register: 采用现代、清楚而庄重的法规语体。“凡……的人，都要……”体现普遍适用性；“洗净衣服”与“用水洗身”清楚区分洗衣和身体洁洗。脚注标记置于整节末尾，所释词“床铺”已明确出现在正文中。
