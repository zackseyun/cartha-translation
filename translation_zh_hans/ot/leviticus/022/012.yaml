  text: וּ/בַת כֹּהֵ֔ן כִּ֥י תִהְיֶ֖ה לְ/אִ֣ישׁ זָ֑ר הִ֕וא בִּ/תְרוּמַ֥ת הַ/קֳּדָשִׁ֖ים לֹ֥א תֹאכֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/012.yaml
  text: But if a priest’s daughter becomes the wife of an outsider[b][a], she shall not eat from the contribution of the holy things.
translation:
  language: zh_hans
  text: 但祭司的女儿若嫁给祭司家族以外的人[a]，就不可吃圣物中的举祭[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“归于一个外人（男子）”；这里指嫁给祭司家族以外、没有资格吃祭司圣物的人，不一定指外族人。
    reason: lexical_alternative
  - marker: b
    text: “举祭”也可译作“供物”或“神圣礼物”，指从圣物中分别出来归给祭司的部分。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בַת כֹּהֵן
  choice: 但祭司的女儿
  rationale: וְ在此承接并对照上文，译为“但”；构造关系直译为“祭司的女儿”。
- source_word: כִּי תִהְיֶה לְ/אִישׁ זָר
  choice: 若嫁给祭司家族以外的人
  rationale: כִּי在此引出条件；“成为某男子的”表达婚姻关系。זָר在本段指不属于祭司家族及其圣物食用资格范围的人，并不必然指外族人。
- source_word: הִוא
  choice: 就
  rationale: 希伯来文独立代词重申主语；中文条件句以“就”自然衔接结果，不另加生硬的强调代词。
- source_word: בִּ/תְרוּמַת הַ/קֳּדָשִׁים
  choice: 圣物中的举祭
  rationale: תְּרוּמָה指分别出来献上并归给祭司的供物，传统且较准确地译为“举祭”；הַקֳּדָשִׁים保留为广义的“圣物”。介词בְּ与“吃”连用，在中文中按部分关系译作“……中的”。
- source_word: לֹא תֹאכֵל
  choice: 不可吃
  rationale: 否定未完成式用于律法条文，表达持续有效的禁令；“不可”兼具规范性与现代可读性。
theological_decisions:
- issue: 祭司条例中זָר的所指
  choice: 祭司家族以外的人
  alternative: 外人／外族人／非祭司
  rationale: 上下文讨论谁有资格吃祭司所得的圣物，重点在是否属于祭司家庭及其资格范围，而非族裔身份。“祭司家族以外的人”避免把该词误解为外邦人，也不把含义过度收窄为职业意义上的“非祭司”。
- issue: תְּרוּמַת הַקֳּדָשִׁים的关系
  choice: 圣物中的举祭
  alternative: 圣物的供物／神圣礼物
  rationale: 保留תְּרוּמָה作为特定祭物类别，同时以“圣物中的”表达其属于分别为圣之物的范围；脚注提供更通俗的表达。
translation_notes:
  register: 采用现代、庄重而易懂的律法体。“不可”保留禁令语气；正文明确婚姻关系与祭司家族范围，脚注则保存זָר和תְּרוּמָה的字面及词义选择。
