reference: Leviticus 22:3
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: אֱמֹ֣ר אֲלֵ/הֶ֗ם לְ/דֹרֹ֨תֵי/כֶ֜ם כָּל אִ֣ישׁ אֲשֶׁר יִקְרַ֣ב מִ/כָּל זַרְעֲ/כֶ֗ם אֶל הַ/קֳּדָשִׁים֙ אֲשֶׁ֨ר יַקְדִּ֤ישׁוּ בְנֵֽי יִשְׂרָאֵל֙ לַֽ/יהוָ֔ה וְ/טֻמְאָת֖/וֹ עָלָ֑י/ו וְ/נִכְרְתָ֞ה הַ/נֶּ֧פֶשׁ הַ/הִ֛וא מִ/לְּ/פָנַ֖/י אֲנִ֥י יְהוָֽה־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/003.yaml
  text: 'Say to them[a], throughout your generations: Any man from any of your offspring who comes near the holy things that the sons of Israel consecrate to Yahweh while his uncleanness is on him—that person shall be cut off from before me[c][b]. I am Yahweh.'
translation:
  language: zh_hans
  text: 你要对他们说：你们世世代代中，你们后裔的任何男子，若身上仍有不洁而接近以色列人分别为圣、献给雅威的圣物，那人必从我面前被剪除。[a][b]我是雅威。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “从我面前”也可译作“从我的临在中”。
    reason: lexical_alternative
  - marker: b
    text: “被剪除”是律法和圣约语境中的固定惩罚用语；具体指怎样被除去，学者有不同理解。
    reason: alternative_reading
lexical_decisions:
- source_word: אֱמֹר אֲלֵהֶם
  choice: 你要对他们说
  rationale: 以自然的现代汉语表达对摩西所用的阳性单数命令式，并保留受话对象“他们”。
- source_word: לְדֹרֹתֵיכֶם
  choice: 世世代代
  rationale: 这是律法和圣约语境中的持续性表达，指规定适用于以后各代。
- source_word: כָּל אִישׁ אֲשֶׁר ... מִכָּל זַרְעֲכֶם
  choice: 你们后裔中的任何男子
  rationale: 上下文指亚伦家族的男性后裔；“任何男子”保留 אִישׁ 的阳性法律个案形式，“后裔”自然表达 זֶרַע 的谱系含义。
- source_word: יִקְרַב
  choice: 接近
  rationale: 保留祭司礼仪语境中 קרב 的空间和礼仪双重意味，不进一步限定为触摸、领用或食用。
- source_word: הַקֳּדָשִׁים
  choice: 圣物
  rationale: 复数名词在此泛指奉献为圣之物或祭物；“圣物”简洁且不把所指范围缩窄为某一种供物。
- source_word: יַקְדִּישׁוּ ... לַיהוָה
  choice: 分别为圣、献给雅威
  rationale: “分别为圣”体现 קדשׁ 的使役含义，补以“献给”使 לַיהוָה 在汉语中自然明确。
- source_word: בְנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 这是现代汉语对该民族称谓最自然的表达，也准确涵盖“以色列的子孙”。
- source_word: וְטֻמְאָתוֹ עָלָיו
  choice: 身上带着不洁
  rationale: 保留希伯来文“不洁在他身上”的状态意象，同时避免生硬直译。
- source_word: וְנִכְרְתָה הַנֶּפֶשׁ הַהִוא
  choice: 那人就要……被剪除
  rationale: הַנֶּפֶשׁ 在法律公式中指那个人；“被剪除”保留 כרת 被动式惩罚公式，不擅自指定执行方式。
- source_word: מִלְּפָנַי
  choice: 从我面前
  rationale: 近形式地保留“从我面前／从我的临在中”的表达及其神学力度。
- source_word: יְהוָה
  choice: 雅威
  rationale: 直接音译四字神名，以区别于称号“主”。
theological_decisions:
- issue: “被剪除”这一惩罚公式的具体含义
  choice: 保留“被剪除”，不说明具体机制
  alternative: 处死、逐出群体，或从圣约群体中除名
  rationale: נכרתה 的标准律法公式在具体执行方式上存在争议，本节本身没有界定；译文应保存这种张力。
- issue: מִלְּפָנַי 与惩罚公式的关系
  choice: 译作“从我面前被剪除”
  alternative: 译作“从我的临在中被剪除”
  rationale: “从我面前”既贴近原文，也保留可能涉及神之临在的含义，不将其抽象化或过度解释。
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 采用对四字神名的直接音译，保留其作为专名而非称号的性质。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。句法保持法律宣告的严肃感；用“圣物”“不洁”“被剪除”等礼仪与圣约词汇，但避免不必要的古奥措辞。脚注标记均置于所解释的惩罚短语之后。
