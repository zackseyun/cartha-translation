  text: וְ/כָל זָ֖ר לֹא יֹ֣אכַל קֹ֑דֶשׁ תּוֹשַׁ֥ב כֹּהֵ֛ן וְ/שָׂכִ֖יר לֹא יֹ֥אכַל קֹֽדֶשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/010.yaml
  text: No outsider may eat the holy thing[b][a]; a sojourner of a priest or a hired worker may not eat the holy thing.
translation:
  language: zh_hans
  text: 凡外人都不可吃圣物；寄居在祭司家中的人或雇工，也不可吃圣物。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “圣物”也可译作“圣食”或“神圣的份额”。这里指从祭物中分别出来、留给祭司食用的食物。
    reason: lexical_alternative
lexical_decisions:
- source_word: זָר
  choice: 外人
  rationale: 在祭司与圣物的语境中，指不属于获准领受祭司圣物之范围的人，并非主要强调族裔上的外国人；“外人”简洁保留这种身份界限。
- source_word: קֹדֶשׁ
  choice: 圣物
  rationale: 希伯来文为单数，字面指“圣洁之物”，本节具体指供祭司食用的神圣祭物份额；“圣物”既贴近原文，也避免在正文中过度解释。
- source_word: תּוֹשַׁב כֹּהֵן
  choice: 寄居在祭司家中的人
  rationale: 表达一个依附或居住于祭司家中的非家庭成员；此译法交代其与祭司家庭的关系，同时不武断限定其族裔或法律身份。
- source_word: שָׂכִיר
  choice: 雇工
  rationale: 指领取工价受雇做工的人；“雇工”是现代汉语中简明准确的对应词。
- source_word: לֹא יֹאכַל
  choice: 不可吃
  rationale: 否定未完成式在律法语境中表达禁令；“不可吃”自然、庄重，并清楚传达禁止。
- source_word: וְכָל
  choice: 凡……都
  rationale: 结合后面的否定禁令，汉语用“凡……都不可”能自然表达涵盖所有此类人的普遍禁令。
theological_decisions:
- issue: 谁可吃祭司的圣物
  choice: 按本节身份界限直译为外人、寄居者和雇工不可吃
  alternative: 将“外人”具体解释为所有非祭司或所有非以色列人
  rationale: 原文在祭司家庭与圣物的法规语境中划定资格，却未在本节把 זָר 明确等同于某一族裔类别；译文不扩大或缩小其范围。
translation_notes:
  register: 采用现代、庄重而易懂的律法语体。“寄居在祭司家中的人”比单说“寄居者”更清楚地呈现 כֹּהֵן 所表达的关联；分号保留两组禁令的平行关系。
