base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/033.yaml
  text: who brought you out of the land of Egypt to be your God[a]. I am Yahweh.
translation:
  language: zh_hans
  text: 就是那位把你们从埃及地领出来，为要作你们上帝的。我是耶和华。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “耶和华”对应希伯来文四字神名 YHWH；也有译作“雅威”或“上主”的。
    reason: 说明神名的原文形式及常见译法。
lexical_decisions:
- source_word: הַמּוֹצִיא
  choice: 就是……领出来……的那一位
  rationale: 希伯来语使役分词在此描述耶和华，并承接上文；译成关系性表达，既保留“那一位”的持续身份意味，也符合现代汉语。
- source_word: אֶתְכֶם
  choice: 你们
  rationale: 二人称阳性复数后缀明确指复数对象；汉语以“你们”直接表达。
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: 从埃及地
  rationale: 保留“埃及地”这一五经中常见的出埃及公式，同时用“从……领出来”自然表达来源与脱离。
- source_word: לִהְיוֹת לָכֶם לֵאלֹהִים
  choice: 要作你们的上帝
  rationale: 准确传达 היה + ל 的目的及立约关系；“作你们的上帝”在现代汉语中庄重自然。
- source_word: אֲנִי יְהוָה
  choice: 我是耶和华
  rationale: 将无系词的希伯来语身份宣告自然译为“我是”，并按中文传统音译四字神名。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威；耶和华上主
  rationale: 正文直接呈现专名，不以称号代替；“耶和华”是普通现代中文读者最熟悉的专名形式。脚注说明其对应希伯来文 YHWH 及常见替代译法，避免把发音问题绝对化。
- issue: לִהְיוֹת לָכֶם לֵאלֹהִים 的立约关系
  choice: 要作你们的上帝
  alternative: 要成为你们的上帝；要给你们作上帝
  rationale: “作你们的上帝”保留目的关系与归属关系，不额外断定这是关系的首次开始，因此避免“成为”可能带来的过度解释。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“领出来”比“带出来”更符合出埃及叙事的正式语域；“上帝”用于 אֱלֹהִים，“耶和华”用于专名 יְהוָה，以保持名称与称谓的区分。段末脚注标记置于相关神名之后。
