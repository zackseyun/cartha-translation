reference: Leviticus 22:27
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: שׁ֣וֹר אוֹ כֶ֤שֶׂב אוֹ עֵז֙ כִּ֣י יִוָּלֵ֔ד וְ/הָיָ֛ה שִׁבְעַ֥ת יָמִ֖ים תַּ֣חַת אִמּ֑/וֹ וּ/מִ/יּ֤וֹם הַ/שְּׁמִינִי֙ וָ/הָ֔לְאָה יֵרָצֶ֕ה לְ/קָרְבַּ֥ן אִשֶּׁ֖ה לַ/יהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/027.yaml
  text: When an ox or a sheep or a goat is born[a], it shall remain seven days under its mother, and from the eighth day onward it shall be accepted as a food offering to Yahweh.
translation:
  language: zh_hans
  text: “牛、绵羊或山羊一出生，就要在母畜身边留七天；从第八天起，才可蒙悦纳，作为献给耶和华的火祭。[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “火祭”指用火献上的祭物。
    reason: 说明 אִשֶּׁה 的祭祀含义，同时避免把有争议的“食物祭”解释直接写入正文。
lexical_decisions:
- source_word: שׁוֹר
  choice: 牛
  rationale: 这里指牛类牲畜这一类别，并未限定性别；“牛”最自然，也避免误解为专指公牛或役牛。
- source_word: כֶשֶׂב
  choice: 绵羊
  rationale: 此处列举可献祭的牲畜类别，不一定专指幼羊；“绵羊”可与“山羊”清楚区分。
- source_word: עֵז
  choice: 山羊
  rationale: 虽然希伯来语名词在语法上为阴性，这里却是物种类别名称，不宜限定为母山羊。
- source_word: כִּי יִוָּלֵד
  choice: 生下来以后
  rationale: כִּי 在律例的个案条件中相当于“当……时”；יִוָּלֵד 是被动形式，意为“出生”。结合后文的时间规定，译作“生下来以后”自然清楚。
- source_word: וְהָיָה שִׁבְעַת יָמִים תַּחַת אִמּוֹ
  choice: 要在母畜身边七天
  rationale: תַּחַת 字面为“在……下面”，此处按幼畜依偎、哺乳于母畜的情境表达为“在母畜身边”；“母畜”也比单说“母亲”更符合现代汉语畜牧语境。
- source_word: וּמִיּוֹם הַשְּׁמִינִי וָהָלְאָה
  choice: 从第八天起
  rationale: 准确表达从第八日开始并持续往后的时间界线。
- source_word: יֵרָצֶה
  choice: 就可以蒙悦纳
  rationale: 该动词的被动式在献祭语境中表示祭物获得接纳。“蒙悦纳”保留礼仪与神学色彩，“可以”则传达从第八日起具备献祭资格。
- source_word: לְקָרְבַּן אִשֶּׁה
  choice: 作为……火祭
  rationale: קָרְבָּן 是献上的供物；אִשֶּׁה 指以火献上的祭物。汉语“火祭”简明保留献火的祭祀方式，不采用争议较大的“食物祭”。
- source_word: לַיהוָה
  choice: 献给耶和华
  rationale: 介词 לְ 表明祭物献呈的对象；יהוה 按其专名译作“耶和华”，为现代中文圣经读者熟悉的形式。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。中文正文采用广为普通读者熟悉的专名“耶和华”，而不以“主”替代，从而保留其作为盟约神名的性质。
- issue: יֵרָצֶה 所表达的是祭物蒙接纳还是仅具备客观资格
  choice: 可以蒙悦纳
  alternative: 可以被接纳／可算合宜
  rationale: 被动形式既涉及献祭资格，也表达在耶和华面前获得接纳；译文保留两者之间的张力，不将其缩减为单纯法规上的“合格”。
- issue: אִשֶּׁה 的含义
  choice: 火祭
  alternative: 食物祭／经火献上的祭物
  rationale: 该词与献火密切相关，但词源和具体语义存在讨论。“火祭”沿用清楚的祭祀表达，并以脚注说明其所指，避免径直采用带有解释性的“食物祭”。
translation_notes:
  register: 采用现代、庄重而易懂的律例体。“母畜身边”自然表达幼畜留在母体附近的含义；分号清楚标出七天等候期与第八天起可献祭之间的界线。
