revisions:
- from: 免得使他们因吃自己的圣物[b]而担当赎愆的罪责[a]；因为我是使他们分别为圣的雅威[c]。
  to: 免得使他们因吃他们的圣物[b]而担当愆罪之责[a]；因为我是使他们分别为圣的雅威[c]。
  rationale: 仅将“赎愆的罪责”改为“愆罪之责”，以避免将原文未明确说出的赎愆祭或补偿程序写入正文；将“自己的圣物”改为“他们的圣物”，更贴近原文所属代词，且避免“自己”在汉语中可能造成的强调或所有权语感。末句脚注的替代译文微调为“使他们成圣”，更准确对应“分别为圣”。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T04:51:21Z'
