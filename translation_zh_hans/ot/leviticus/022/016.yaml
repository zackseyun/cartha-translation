source:
  edition: WLC
  text: וְ/הִשִּׂ֤יאוּ אוֹתָ/ם֙ עֲוֺ֣ן אַשְׁמָ֔ה בְּ/אָכְלָ֖/ם אֶת קָדְשֵׁי/הֶ֑ם כִּ֛י אֲנִ֥י יְהוָ֖ה מְקַדְּשָֽׁ/ם־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/016.yaml
  text: and so cause them to bear guilt requiring restitution by eating their holy things[c][b][a], for I am Yahweh who sanctifies them.
translation:
  language: zh_hans
  text: 免得使他们因吃他们的圣物[b]而担当愆罪之责[a]；因为我是使他们分别为圣的雅威[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“使他们承担愆责”。希伯来语的这个说法较难确定，可能着重指因所犯之愆而负有责任。
    reason: lexical_alternative
  - marker: b
    text: “圣物”指分别为圣的份或供物。
    reason: cultural_note
  - marker: c
    text: “使他们分别为圣”也可译作“使他们成为圣洁”或“使他们成圣”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִשִּׂיאוּ
  choice: 免得使……担当
  rationale: 这是נשׂא的使役形，表示“使某人承担”；结合上一节的禁令，用“免得”自然表达警告所要避免的后果，同时保留使役关系。
- source_word: אוֹתָם
  choice: 他们
  rationale: 保留阳性复数宾语代词，不在正文中强行限定其具体所指。
- source_word: עֲוֺן אַשְׁמָה
  choice: 赎愆的罪责
  rationale: עָוֹן表达罪责，אַשְׁמָה带有礼仪法规中愆责及补偿责任的意味；此译既保留利未记的祭祀法律语域，也避免把它简化为一般性的“罪”。
- source_word: בְּאָכְלָם
  choice: 因吃
  rationale: 介词ב与不定词组合在此可表示原因或途径；“因吃”在现代汉语中简洁地呈现这种关系。
- source_word: קָדְשֵׁיהֶם
  choice: 自己的圣物
  rationale: 直译为“他们的圣物”，指分别为圣的份或供物；“自己的”清楚呈现第三人称复数所属关系，又不在正文中把范围限死。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语中常见的音译呈现四字神名，而不以称号代替其专名。
- source_word: מְקַדְּשָׁם
  choice: 使他们分别为圣
  rationale: קדשׁ的Piel分词表示使之成为圣洁、分别为圣；此译自然清楚，并保留持续施行者的语气。
theological_decisions:
- issue: 末句“他们”的所指
  choice: 正文保留“使他们分别为圣”，不明确补出所指
  alternative: 明确译作“使祭司分别为圣”或“使圣物成为圣”
  rationale: 阳性复数后缀最自然地回指上下文中的人，但句法容许读者追问其所指；保留代词可避免把一种解释写进正文。
- issue: עֲוֺן אַשְׁמָה的礼仪法律含义
  choice: 译作“赎愆的罪责”
  alternative: 译作“罪孽”“愆罚”或“须赔偿的罪责”
  rationale: 该搭配兼有罪责与赎愆责任的色彩。“赎愆”保留祭祀法律背景，但不武断补入正文未明说的具体祭物或赔偿程序。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“赎愆”保留利未记祭祀法规的专门语感；“雅威”作为神名音译。正文依照汉语逻辑放置脚注标记，并保留两个“他们”在希伯来文中的指代张力。
