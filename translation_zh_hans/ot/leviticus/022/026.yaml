  yaml_path: translation/ot/leviticus/022/026.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: zh_hans
  text: 耶和华对摩西说：
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: 说
  rationale: 该形式在叙事中引出新的发言事件；在汉语固定的神谕引介语中，“对……说”自然、准确，无须机械区分英语的“spoke”和“said”。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的专名形式呈现四字神名，避免用“主”这一称号取代原文中的名字。
- source_word: אֶל מֹשֶׁה
  choice: 对摩西
  rationale: 介词 אֶל 标明说话所指向的对象；“对摩西”是现代汉语最自然的表达。
- source_word: לֵאמֹר
  choice: 说
  rationale: 该不定式属于引出下文直接话语的惯用公式；中文用“说：”简洁地保留其功能，并由冒号连接下一节内容。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威；上主
  rationale: 原文直接使用神的专名而非称号。正文采用中文传统且广为人知的专名“耶和华”，既保留专名性质，也便于普通现代读者理解；不以“上主”替代原名。本节不另加脚注，因为“耶和华”本身已明确作为专名呈现。
translation_notes:
  register: 采用庄重而自然的现代标准普通话，并保留利未记反复出现的神谕引介公式。冒号表明话语内容接续于下一节。
