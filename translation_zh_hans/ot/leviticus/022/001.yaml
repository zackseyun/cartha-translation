base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/001.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: zh_hans
  text: 雅威对摩西说[a]：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文为“YHWH”（四字神名）。传统中文音译作“耶和华”；也译作“雅威”。
    reason: 说明神名的原文形式及不同音译。
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: 说
  rationale: 该动词形式在此引出新的神谕段落；现代汉语用“说”自然表达正式发言公式，无须机械重复为“讲话……说”。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的专名“耶和华”对应四字神名，保留其作为上帝专名的性质，而不改作称号“主”。
- source_word: אֶל
  choice: 对
  rationale: 在“对某人说”的汉语结构中，自然标明发言对象。
- source_word: מֹשֶׁה
  choice: 摩西
  rationale: 采用该希伯来人名在现代汉语中的标准译名。
- source_word: לֵאמֹר
  choice: 说（融入引语公式）
  rationale: 希伯来语不定式用于引出随后话语的内容；汉语以“对摩西说：”完整而自然地表达此功能，不另译成重复的“说道”。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威；主
  rationale: 原文直接使用四字神名。正文采用中文传统且广为人知的专名“耶和华”，并以脚注说明原文形式及其他译法，既保留专名性质，也不把有争议的发音重建当作唯一确定形式。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。“耶和华对摩西说：”符合利未记神谕引言的固定语体；冒号承担希伯来语 לֵאמֹר 引出下文的功能。
