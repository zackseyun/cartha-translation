  text: וְ/שׁ֥וֹר וָ/שֶׂ֖ה שָׂר֣וּעַ וְ/קָל֑וּט נְדָבָה֙ תַּעֲשֶׂ֣ה אֹת֔/וֹ וּ/לְ/נֵ֖דֶר לֹ֥א יֵרָצֶֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/023.yaml
  text: But an ox or a sheep that has a limb too long or too short—you may make it a freewill offering[a], but for a vow it will not be accepted.
translation:
  language: zh_hans
  text: 至于肢体过长或过短的牛或羊，你可以把它献作甘心祭[a]；但作为还愿祭，它不会蒙悦纳。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可较宽泛地译作“有畸形或发育不全”。这两个希伯来词很可能描述两种相反的身体比例异常。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשׁוֹר
  choice: 牛
  rationale: שׁוֹר 指牛类牲畜；在祭牲条例中用“牛”自然、准确，也无需限定为阉牛或公牛。
- source_word: וָשֶׂה
  choice: 或羊
  rationale: שֶׂה 泛指羊群中的小牲畜，可包括绵羊或山羊；正文用概括性的“羊”，不额外限定种类或年龄。
- source_word: שָׂרוּעַ וְקָלוּט
  choice: 肢体过长或过短
  rationale: 这两个词在此似乎表示相反的身体比例异常，可能特指肢体伸长与短缩；正文保留这一具体对举，并以脚注说明更宽泛的可能译法。
- source_word: נְדָבָה
  choice: 甘心祭
  rationale: נְדָבָה 指并非履行强制义务、而是自愿献上的祭物；“甘心祭”是简洁且通行的礼仪用语。
- source_word: תַּעֲשֶׂה אֹתוֹ
  choice: 你可以把它献作
  rationale: 字面为“你可以作它”，在献祭语境中意为把该牲畜作为某种祭献上；如此译法兼顾语义与现代汉语自然度。
- source_word: וּלְנֵדֶר
  choice: 但作为还愿祭
  rationale: נֵדֶר 指因所许之愿而承担的祭献义务；“还愿祭”清楚表达与甘心祭相对的礼仪类别。
- source_word: לֹא יֵרָצֶה
  choice: 它不会蒙悦纳
  rationale: רצה 的被动式在祭祀语境中表示祭物得到有利接纳；“蒙悦纳”既保留神学语域，也没有补出原文未明说的主语。
theological_decisions:
- issue: שָׂרוּעַ 与 קָלוּט 所指缺陷的性质
  choice: 译为相对具体的“肢体过长或过短”
  alternative: “畸形或发育不全”或“身体某部分过大或过小”
  rationale: 两词很可能描述相反的身体比例异常，但确切解剖含义并不完全确定；正文呈现较可能的具体图像，脚注保存更宽泛的理解。
- issue: לֹא יֵרָצֶה 的隐含施事者
  choice: 译为“不会蒙悦纳”，不在正文补出“被上帝”
  alternative: “不会被上帝悦纳”或“不可蒙悦纳”
  rationale: 原文是无人称被动表达。译文保留祭祀中的神圣接纳含义，同时不把隐含主语明文化，以免超出原文。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“甘心祭”“还愿祭”“蒙悦纳”保留利未记祭祀条例所需的礼仪语域；句式简洁，适合普通读者。
