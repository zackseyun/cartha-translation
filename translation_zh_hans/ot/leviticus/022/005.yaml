  yaml_path: translation/ot/leviticus/022/005.yaml
  text: or a man who touches any swarming thing by which he becomes unclean[a], or a person by whom he becomes unclean[b], whatever his uncleanness.
translation:
  language: zh_hans
  text: 或有人触摸任何会使他不洁的爬行小动物[a]，或触摸一个使他不洁的人，不论那人有哪一种不洁[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “爬行小动物”也可译作“群集生物”或“爬行之物”。希伯来语指一类成群活动或贴近地面移动的小生物，并不限于现代动物学分类中的“爬行动物”。
    reason: lexical_alternative
  - marker: b
    text: 原文采用阳性单数形式，在这条法律中具有泛指意义；末句直译近似“不论他的任何不洁”。
    reason: source_form_and_ambiguity
lexical_decisions:
- source_word: אוֹ אִישׁ אֲשֶׁר יִגַּע
  choice: 或有人触摸
  rationale: אוֹ承接上一节的列举；אִישׁ虽为阳性单数，在此法律条文中泛指任何人，译作“有人”既自然又不改变适用范围；יִגַּע直译为“触摸”。
- source_word: בְּכָל שֶׁרֶץ
  choice: 任何……群行之物
  rationale: שֶׁרֶץ指成群活动或贴近地面移动的小生物类别；“群行之物”保留其类别性，不擅自限定为某一种动物，并以脚注说明常见译法。
- source_word: אֲשֶׁר יִטְמָא לוֹ
  choice: 使他不洁的
  rationale: 该结构表明所接触之物是成为不洁的媒介或来源；汉语采用结果性表达，清楚保留礼仪状态的变化。
- source_word: בְאָדָם
  choice: 触摸一个……人
  rationale: אָדָם在此指作为不洁来源的人；介词ב与前面的יִגַּע相连，汉语补出“触摸”，使并列结构自然清楚。
- source_word: לְכֹל טֻמְאָתוֹ
  choice: 不论那人有哪一种不洁
  rationale: 保留“各种/任何不洁”的宽泛范围，并把第三人称后缀自然理解为前述作为不洁来源的人；脚注交代原文表达的紧凑性。
- source_word: טמא / טֻמְאָה
  choice: 不洁
  rationale: 本段属于祭司礼仪洁净条例；“不洁”准确表达礼仪状态，且使动词与名词保持词根上的对应，不将其道德化为罪恶。
theological_decisions:
- issue: 不洁语言的性质
  choice: 译作礼仪意义的“不洁”
  alternative: “污秽”或带有道德谴责意味的措辞
  rationale: 上下文讨论祭司礼仪上的洁净资格，并不必然判定当事人有道德罪责，因此避免采用容易道德化的用语。
- issue: לְכֹל טֻמְאָתוֹ中物主后缀的所指
  choice: 译为“不论那人有哪一种不洁”，指向作为接触对象的人
  alternative: “不论他有哪一种不洁”，保留汉语代词歧义
  rationale: 语法与语境最自然地把后缀联系到紧邻的אָדָם，即传递不洁的人；同时脚注保留原文措辞紧凑的特点，避免过度展开其传递机制。
translation_notes:
  register: 采用现代、庄重而易懂的法律条文语体。句式保持原文两个“或”项的并列关系；用“有人”表达泛指，不把希伯来语语法阳性误解为只适用于男性。
