  text: וּ/מָע֤וּךְ וְ/כָתוּת֙ וְ/נָת֣וּק וְ/כָר֔וּת לֹ֥א תַקְרִ֖יבוּ לַֽ/יהוָ֑ה וּֽ/בְ/אַרְצְ/כֶ֖ם לֹ֥א תַעֲשֽׂוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/024.yaml
  text: You shall not present to Yahweh anything with bruised[a], crushed, torn, or cut testicles, and in your land you shall not do this.
translation:
  language: zh_hans
  text: 睾丸被压伤、压碎、扯脱或割除的牲畜[a]，你们不可献给雅威；在你们的地上，也不可这样做。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“压伤的、压碎的、扯脱的或割除的”，没有明说受损部位；上下文表明这是指牲畜的雄性生殖器官，具体为睾丸。
    reason: 说明原文四个被动分词的省略结构，以及译文补出“睾丸”和“牲畜”的依据。
lexical_decisions:
- source_word: מָעוּךְ
  choice: 压伤
  rationale: 该被动分词指因挤压而受损；译作“压伤”既保留具体伤害，也与下一项“砸碎”相区别。
- source_word: כָתוּת
  choice: 砸碎
  rationale: 该词表示被击打、捣碎；“砸碎”准确传达严重的挤碎性损伤。
- source_word: נָתוּק
  choice: 扯掉
  rationale: 该词指因拉扯而断离；“扯掉”保留其动作方式，并与一般的切割相区别。
- source_word: כָרוּת
  choice: 割掉
  rationale: 源自动词“切断”；此处描述被切除的状态，“割掉”直接而自然。
- source_word: תַקְרִיבוּ
  choice: 献给
  rationale: 该词在献祭语境中指把祭牲带近并呈献；“献给”符合现代汉语，也不把含义局限于焚烧。
- source_word: לַיהוָה
  choice: 给雅威
  rationale: 以“雅威”音译神名 יהוה，保留原文专名的性质。
- source_word: בְאַרְצְכֶם
  choice: 在你们的地上
  rationale: 直译并保留圣约语境中“你们的地”这一表达。
- source_word: תַעֲשׂוּ
  choice: 不可这样做
  rationale: 原文“做”没有明说宾语，回指前述行为；“这样做”保持其省略性和宽泛范围。
- source_word: 四个被动分词所隐含的受词
  choice: 睾丸……的牲畜
  rationale: 希伯来文未明说受损部位和动物，但上下文清楚指祭牲的雄性生殖器官。现代汉语若完全省略会晦涩，因此明确为“睾丸”，并补出“牲畜”。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 采用直接音译，表明原文使用的是神的专名，而非普通称谓。
- issue: 末句 וּבְאַרְצְכֶם לֹא תַעֲשׂוּ 的禁令范围
  choice: 在你们的地上，也不可这样做
  alternative: 在你们的地上，也不可献这样的牲畜
  rationale: 原文使用宽泛而省略宾语的“做”，很可能禁止实施前述阉割或毁损，而不只是禁止献祭；译文不把范围收窄，保留原文张力。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。“睾丸”用语准确，不采用古老委婉语；四项损伤以平行短语排列，尽量保留希伯来文的法律条文节奏。
