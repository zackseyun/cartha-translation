revisions:
- from: 凡是瞎眼、骨折、残缺，或长疣、患疥疮或皮肤病的，你们都不可献给雅威；也不可把其中任何一只作为献给雅威的火祭[a]，放在祭坛上。
  to: 凡瞎眼的、折断的、残缺的，或有疣、有疮痂或患皮肤病的牲畜，你们不可把这些献给雅威；也不可从其中取任何一只放在祭坛上，作为献给雅威的火祭[a]。
  rationale: 修订避免将两项不确定的缺陷术语作过度医学化的限定，并使第二禁令的现代汉语句法更清晰。保留原文的缺陷清单、两次禁令、祭坛意象、神名及אִשֶּׁה的脚注歧义。
