id: LEV.22.22
reference: Leviticus 22:22
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: עַוֶּרֶת֩ א֨וֹ שָׁב֜וּר אוֹ חָר֣וּץ אֽוֹ יַבֶּ֗לֶת א֤וֹ גָרָב֙ א֣וֹ יַלֶּ֔פֶת לֹא תַקְרִ֥יבוּ אֵ֖לֶּה לַ/יהוָ֑ה וְ/אִשֶּׁ֗ה לֹא תִתְּנ֥וּ מֵ/הֶ֛ם עַל הַ/מִּזְבֵּ֖חַ לַ/יהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/022.yaml
  text: Anything blind[a], broken, mutilated, or with a wart, scab, or skin disease, these you shall not present to Yahweh; and you shall not place any of them on the altar as a food offering to Yahweh.
translation:
  language: zh_hans
  text: 凡瞎眼的、折断的、残缺的，或有疣、有疮痂或患皮肤病的牲畜，你们不可把这些献给雅威；也不可从其中取任何一只放在祭坛上，作为献给雅威的火祭[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“食物祭”。
    reason: אִשֶּׁה传统上可译为“火祭”或“火献祭”；其在祭司文献中的用法也支持“食物祭”这一替代译法。
lexical_decisions:
- source_word: עַוֶּרֶת
  choice: 瞎眼
  rationale: 此处是献祭牲畜残疾的清单；用“瞎眼”直接、自然地描述失明的牲畜。
- source_word: שָׁבוּר
  choice: 骨折
  rationale: 该被动形式表示身体某处折断；在牲畜缺陷的语境中，“骨折”比笼统的“破损”更清楚。
- source_word: חָרוּץ
  choice: 残缺
  rationale: 原词有被割伤、割裂或肢体受损之意；“残缺”传达严重的身体损伤，同时避免对具体伤处作无根据的限定。
- source_word: יַבֶּלֶת
  choice: 长疣
  rationale: 指异常的皮肤赘生物；“长疣”是现代汉语中清楚易懂的表达。
- source_word: גָרָב
  choice: 疥疮
  rationale: 指一种可见的皮肤疾患；“疥疮”保留其较具体的病症色彩，但不把它解释为某种现代诊断。
- source_word: יַלֶּפֶת
  choice: 皮肤病
  rationale: 其确切的皮肤病种类不明；采用概括性的“皮肤病”，避免误作精确诊断。
- source_word: תַקְרִיבוּ
  choice: 献
  rationale: 使役式קרב在献祭语境中指把祭物带近并呈献；汉语“献”简洁自然，也保留礼仪含义。
- source_word: אֵלֶּה
  choice: 都
  rationale: 指回前列各类有缺陷的牲畜；汉语用“凡是……的，你们都……”自然地表达这一总括指示。
- source_word: אִשֶּׁה
  choice: 火祭
  rationale: 该祭祀术语与祭坛之火密切相关；“火祭”简洁并保留传统理解，而“食物祭”作为重要的另一种理解列入脚注。
- source_word: תִתְּנוּ מֵהֶם עַל הַמִּזְבֵּחַ
  choice: 把其中任何一只……放在祭坛上
  rationale: 明确表达מֵהֶם的部分、分配含义，并以自然汉语保留“放在祭坛上”的具体动作。
- source_word: לַיהוָה
  choice: 献给雅威
  rationale: 介词ל在献祭语境中表示祭物的归属或对象；“献给”符合汉语习惯，神名יהוה音译为“雅威”。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；音译“雅威”较贴近学界通常重构的读音，并保留其作为专有名的性质。
- issue: 祭祀术语אִשֶּׁה的译法
  choice: 火祭
  alternative: 食物祭
  rationale: 该词通常指在火上献给神的祭物，但其构词及祭司文献中的功能也可支持“食物祭”这一译法。正文采用通顺而传统的“火祭”，脚注保留另一种重要理解，不消除原词的词义张力。
translation_notes:
  register: 采用庄重、现代而易懂的书面汉语；以“凡是……的，你们都……”重现原文先列缺陷、再下禁令的结构。用“任何一只”明示所指为牲畜，并避免使用生僻的古代皮肤病名称。
