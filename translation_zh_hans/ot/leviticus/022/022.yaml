  source_fidelity: 原文先列举不合格的祭牲缺陷，继而两次禁止献给雅威或置于坛上。草稿总体保留了这一结构和“雅威”的专名译法；但“疥疮”指向较明确的特定皮肤病，超过了גָרָב所能安全确定的范围。改为“疮痂”较能保留可见皮肤损害的概括性，并与后一术语的广义“皮肤病”相区别。
  naturalness: 草稿基本通顺，但“把其中任何一只作为……放在祭坛上”中“作为”修饰关系略显滞后。将祭坛动作与其作为火祭的功能分开，语序更合现代书面汉语。补出“牲畜”也使缺陷清单的指称更清楚。
