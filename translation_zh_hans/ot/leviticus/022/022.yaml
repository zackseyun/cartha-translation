  - severity: low
    issue: 第二禁令的汉语语序稍不顺。
    rationale: “把其中任何一只作为……放在祭坛上”可理解，但“作为”夹在宾语与动作之间。重排后能更清楚地区分“放在祭坛上”和“作为火祭”的关系。
