base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/017.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: zh_hans
  text: 雅威[a]对摩西说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文为 YHWH；也译作“耶和华”。
    reason: 说明四字神名的原文形式及通行的另一译法。
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: 说
  rationale: 该叙事性动词引出一段新的神谕；现代汉语用“对……说”自然、准确。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文四字神名 YHWH 的通常拟音译出其专名性质，不以“主”这一称号代替。
- source_word: אֶל מֹשֶׁה
  choice: 对摩西
  rationale: 介词 אֶל 在言说结构中标明受话者；“对摩西”符合现代汉语表达。
- source_word: לֵאמֹר
  choice: 说：
  rationale: 该不定式用于引出随后直接引语。汉语将 וַיְדַבֵּר 与 לֵאמֹר 合并为一次“说”，并以冒号提示下文，可避免生硬重复，同时保留其话语引介功能。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名。正文采用较接近“Yahweh”的现代汉语拟音“雅威”，保留专名；脚注注明传统译名“耶和华”，不以称号“主”取代原文神名。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。以“对摩西说：”承载希伯来语固定引语公式，避免逐词直译成“讲话……说”所造成的汉语赘复。
