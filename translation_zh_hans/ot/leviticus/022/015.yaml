id: LEV.22.15
reference: Leviticus 22:15
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/לֹ֣א יְחַלְּל֔וּ אֶת קָדְשֵׁ֖י בְּנֵ֣י יִשְׂרָאֵ֑ל אֵ֥ת אֲשֶׁר יָרִ֖ימוּ לַ/יהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/015.yaml
  text: They shall not profane the holy things of the sons of Israel[b][a], which they lift up to Yahweh.
translation:
  language: zh_hans
  text: 他们不可亵渎以色列人献给雅威的圣物[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “圣物”也可译作“圣洁的供物”。
    reason: lexical_alternative
  - marker: b
    text: “献给”原文含“举起”的意思，也可译作“举献给”或“呈献给”。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְחַלְּלוּ
  choice: 亵渎
  rationale: 此处是 חלל 的 Piel 形式，用于礼仪语境，指使圣物失去其当受的圣洁尊荣；“亵渎”准确保留圣与俗的对照。
- source_word: קָדְשֵׁי
  choice: 圣物
  rationale: 该词为复数构造式，字面指“……的圣物”。上下文涉及奉献之物，但译作“圣物”可避免将所指过早限定为某一类祭物。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 这是希伯来语常见的民族与盟约群体称谓；现代汉语以“以色列人”表达最自然，并不改变其群体所指。
- source_word: אֲשֶׁר יָרִימוּ
  choice: 献给
  rationale: רום 的 Hiphil 在献祭语境中可指举起、呈献或奉献。“献给”在汉语中自然表达其礼仪功能；脚注保留“举献”的具体动作意象。
- source_word: לַיהוָה
  choice: 给雅威
  rationale: 原文直接使用四字神名 יהוה；译作“雅威”以保留其作为上帝盟约之名的性质。
- source_word: וְלֹא
  choice: 不可
  rationale: 否定未完成式在律法语境中表达禁令；“不可”符合现代汉语庄重、简洁的律例文体。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文使用四字神名，正文音译为“雅威”，既呈现专名，也避免以称号代替原文的盟约之名。
- issue: “圣物”的范围
  choice: 保留概括性的“圣物”
  alternative: 圣洁的供物；圣物祭品
  rationale: קָדְשֵׁי 本身是概括性用语，虽在上下文中特别涉及以色列人所献之物，仍不宜在正文中将其范围收窄为某一特定祭物。
translation_notes:
  register: 采用现代、庄重而简洁的律法文体。“他们”承接上下文中的祭司；不在本节内增补“祭司”，以免加入原文未明说的名词。汉语语序将关系从句前置，使“以色列人献给雅威的”清楚修饰“圣物”。
