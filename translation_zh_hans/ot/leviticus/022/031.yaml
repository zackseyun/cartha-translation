  text: וּ/שְׁמַרְתֶּם֙ מִצְוֺתַ֔/י וַ/עֲשִׂיתֶ֖ם אֹתָ֑/ם אֲנִ֖י יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/031.yaml
  text: So you shall keep my commandments and do them[a]; I am Yahweh.
translation:
  language: zh_hans
  text: 所以，你们要谨守我的诫命，照着去行。我是雅威[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文为“YHWH”（四字神名）；中文传统常译作“耶和华”，也音译为“雅威”。
    reason: 说明原文神名及中文常见译法。
lexical_decisions:
- source_word: וּשְׁמַרְתֶּם
  choice: 所以，你们要谨守
  rationale: שׁמר在盟约和律法语境中表示谨慎持守、遵守；“谨守”保留其郑重的律法语气。“所以”体现ו与上文的承接关系，而不只作简单并列。
- source_word: מִצְוֺתַי
  choice: 我的诫命
  rationale: מִצְוָה指命令、诫命；“诫命”符合《利未记》的律法语域，也保留复数形式和第一人称所属关系。
- source_word: וַעֲשִׂיתֶם אֹתָם
  choice: 照着去行
  rationale: 原文直译为“实行它们”。“照着去行”在现代汉语中自然，并保留“谨守”与实际施行之间的双重表达，未将两者合并为单一的“服从”。
- source_word: אֲנִי יְהוָה
  choice: 我是耶和华
  rationale: 保留利未记中反复出现的神圣自我宣告公式。“耶和华”是现代中文圣经读者熟悉的专名形式，并以脚注说明其所对应的希伯来文四字神名。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威；上主
  rationale: 原文直接使用四字神名YHWH，而非普通称谓。“耶和华”在简体中文圣经传统中最为人熟悉，并保持专名性质；脚注同时注明“雅威”这一音译选择，避免掩盖原文形式及其读音问题。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“谨守……照着去行”既贴近希伯来文的成对动词，也适合普通读者理解；句式简洁，符合律法宣告的语气。
