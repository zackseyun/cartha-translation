  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/אִ֕ישׁ כִּֽי יֹאכַ֥ל קֹ֖דֶשׁ בִּ/שְׁגָגָ֑ה וְ/יָסַ֤ף חֲמִֽשִׁית/וֹ֙ עָלָ֔י/ו וְ/נָתַ֥ן לַ/כֹּהֵ֖ן אֶת הַ/קֹּֽדֶשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/014.yaml
  text: And if a man eats a holy thing unintentionally[d][c][b][a], then he shall add a fifth to it and give the holy thing to the priest.
translation:
  language: zh_hans
  text: 如果有人因疏忽吃了圣物[a][b]，就要在原物之外加上五分之一[c]，把圣物交给祭司。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “圣物”指分别为圣、归祭司使用的食物或物品。
    reason: cultural_note
  - marker: b
    text: “因疏忽”也可译作“无意中”或“误食”。
    reason: lexical_alternative
  - marker: c
    text: 直译为“把它的五分之一加在它上面”，意思是在应偿还的本额之外再加五分之一。
    reason: translation_clarity
lexical_decisions:
- source_word: וְאִישׁ
  choice: 如果有人
  rationale: אִישׁ虽为阳性单数，但在个案律法的表述中可泛指任何人；现代汉语用“有人”自然、准确，不必强行标明男性。
- source_word: כִּי
  choice: 如果
  rationale: 在个案律法中引出条件，译作“如果”最符合现代汉语。
- source_word: יֹאכַל
  choice: 吃了
  rationale: 该动词描述条件所设定的行为；“吃了”清楚表达误食已经发生。
- source_word: קֹדֶשׁ
  choice: 圣物
  rationale: קֹדֶשׁ在此指分别为圣、归祭司使用的食物或物品；“圣物”保留原词的广度，避免缩窄为“圣食”。
- source_word: בִּשְׁגָגָה
  choice: 因疏忽
  rationale: 该词表示非故意、出于过失的行为；“因疏忽”既自然，也保留律法上与蓄意行为的区别。
- source_word: וְיָסַף חֲמִשִׁיתוֹ עָלָיו
  choice: 就要在原物之外加上五分之一
  rationale: 这一短语要求在应偿还的本额之外另加其五分之一；此译法消除汉语代词指向不明，同时保留附加赔偿的含义。
- source_word: וְנָתַן
  choice: 把……交给
  rationale: 基本义为“给”；结合归还圣物的语境，“交给”比“支付”更贴近原文且自然。
- source_word: לַכֹּהֵן
  choice: 给祭司
  rationale: 定冠词在此可指适当的祭司或祭司这一职分类别；汉语通常无需另加对应冠词。
- source_word: אֶת הַקֹּדֶשׁ
  choice: 圣物
  rationale: 重复“圣物”以保留原文两处קֹדֶשׁ的词汇呼应；在赔偿语境中可涵盖所恢复的圣物或其等值本额。
theological_decisions:
- issue: 个案律法中的阳性单数是否限定男性
  choice: 译作“有人”
  alternative: 译作“一个男人”或“某人”
  rationale: אִישׁ是阳性单数，但此处属于可泛指人的律法公式。汉语“有人”既不排除其语法形式，也不把适用对象无根据地限定为男性。
- issue: קֹדֶשׁ所指范围
  choice: 两处均译作“圣物”
  alternative: “圣食”“圣份”或“分别为圣的供物”
  rationale: 上下文涉及可被吃下的祭司圣物，但本节用词本身较宽。译作“圣物”保留这一范围，不额外限定具体种类。
- issue: 五分之一的计算与归还对象
  choice: 译作“在原物之外加上五分之一”
  alternative: “把它的五分之一加在它上面”
  rationale: חֲמִשִׁיתוֹ עָלָיו表示在本额之上另加本额的五分之一。译文明确其为附加赔偿，但不进一步断定必须以实物还是等值方式偿还。
translation_notes:
  register: 采用现代、庄重而易懂的律法文体。“就要”表达规定性义务；避免古雅的“若”“必”，也避免会把圣物范围缩窄的“圣食”。
