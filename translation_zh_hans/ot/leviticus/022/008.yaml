source:
  edition: WLC
  text: נְבֵלָ֧ה וּ/טְרֵפָ֛ה לֹ֥א יֹאכַ֖ל לְ/טָמְאָה בָ֑/הּ אֲנִ֖י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/008.yaml
  text: He shall not eat an animal found dead or torn by beasts[a], making himself unclean by it. I am Yahweh.
translation:
  language: zh_hans
  text: 他不可吃自然死亡的动物或被野兽撕裂的动物[a]，使自己因这些而成为不洁净。我是雅威。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“动物尸体或被撕裂的动物。”
    reason: נְבֵלָה可概括指动物尸体，טְרֵפָה字面强调被撕裂的动物；此译保留原文较凝练的名词表达。
lexical_decisions:
- source_word: נְבֵלָה
  choice: 自死的动物
  rationale: 该词指动物尸体，在食物条例的语境中尤其指未经合规宰杀而自行死亡的动物。“自死的动物”既明确死因，也比单说“尸体”更自然。
- source_word: וּטְרֵפָה
  choice: 或被野兽撕裂的动物
  rationale: טְרֵפָה指被捕食动物撕咬、撕裂的牲畜；原文省略施事者，中文补出“野兽”可清楚表达该词在律法语境中的通常含义。
- source_word: לֹא יֹאכַל
  choice: 他不可吃
  rationale: 否定词加未完成式在律法条文中表达禁令；“不可吃”简洁而保留规范性语气。
- source_word: לְטָמְאָה בָהּ
  choice: 免得因此成为不洁净
  rationale: ל加不定式可表达目的或结果。此译在现代中文中自然地表明食用这类动物会导致礼仪上的不洁净，同时不采用道德色彩较强的“玷污”。
- source_word: אֲנִי יְהוָה
  choice: 我是雅威
  rationale: 原文直接使用神的专名יהוה；音译为“雅威”，保留其作为盟约之名的性质。
theological_decisions:
- issue: יהוה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 这里是神的专名，而非称号；采用“雅威”直接音译该名，避免以称号替代。
- issue: טמא的性质
  choice: 成为不洁净
  alternative: 玷污自己
  rationale: 本节处于祭司与礼仪洁净条例之中，因此使用“不洁净”准确表达礼仪状态，不把它无端改写为一般道德污秽。
- issue: לְטָמְאָה所表达的关系
  choice: 免得因此成为不洁净
  alternative: 以致因此成为不洁净
  rationale: 希伯来语结构可理解为目的或结果；正文采用符合禁令语气的“免得”，但不把不洁净解释成与进食无关的独立罪责。
translation_notes:
  register: 采用现代、庄重而清楚的律法语体。“不可”保留禁令力度；“自死的”“被野兽撕裂的”便于普通读者理解食物条例所指；“不洁净”维持利未记礼仪洁净术语的一致性。
