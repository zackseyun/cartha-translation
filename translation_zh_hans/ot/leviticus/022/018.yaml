id: LEV.22.18
reference: Leviticus 22:18
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: דַּבֵּ֨ר אֶֽל אַהֲרֹ֜ן וְ/אֶל בָּנָ֗י/ו וְ/אֶל֙ כָּל בְּנֵ֣י יִשְׂרָאֵ֔ל וְ/אָמַרְתָּ֖ אֲלֵ/הֶ֑ם אִ֣ישׁ אִישׁ֩ מִ/בֵּ֨ית יִשְׂרָאֵ֜ל וּ/מִן הַ/גֵּ֣ר בְּ/יִשְׂרָאֵ֗ל אֲשֶׁ֨ר יַקְרִ֤יב קָרְבָּנ/וֹ֙ לְ/כָל נִדְרֵי/הֶם֙ וּ/לְ/כָל נִדְבוֹתָ֔/ם אֲשֶׁר יַקְרִ֥יבוּ לַ/יהוָ֖ה לְ/עֹלָֽה־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/018.yaml
  text: 'Speak to Aaron and to his sons and to all the sons of Israel[a], and say to them: Any man from the house of Israel, or from the sojourners in Israel, who presents his offering for any of their vows or any of their freewill offerings[c][b], which they present to Yahweh as a burnt offering—'
translation:
  language: zh_hans
  text: “你要对亚伦、他的儿子和以色列众子[a]说，告诉他们：以色列家中任何人，或在以色列寄居的人[b]，若献上供物，为他们所许的任何愿，或为任何甘心祭[c]，献给雅威作燔祭——”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“所有以色列人”。原文直译为“以色列众子”。
    reason: lexical_alternative
  - marker: b
    text: “寄居的人”指住在以色列人中间、处于其共同体秩序之下的非以色列人。
    reason: lexical_clarification
  - marker: c
    text: 原文也可较贴字译作：“为他们所许的任何愿和任何甘心奉献。”在本段献祭语境中，“甘心奉献”通常指甘心献上的祭；“为所许的愿”也可指为履行誓愿而献。
    reason: alternative_reading
lexical_decisions:
- source_word: דַּבֵּר ... וְאָמַרְתָּ אֲלֵהֶם
  choice: 你要……说，告诉他们
  rationale: 保留原文两个言说动词及正式命令语气，同时使现代汉语通顺。
- source_word: כָּל בְּנֵי יִשְׂרָאֵל
  choice: 以色列众子
  rationale: 保留原文的亲属称谓和盟约群体色彩；脚注补充较自然的汉语表达。
- source_word: אִישׁ אִישׁ
  choice: 任何人
  rationale: 希伯来语重复表示逐一分配意义，即“任何一个人”；汉语“任何人”自然表达其代表性范围，不额外限定性别。
- source_word: מִבֵּית יִשְׂרָאֵל
  choice: 以色列家中
  rationale: 保留“家”这一具有群体和盟约意味的原文表达。
- source_word: הַגֵּר בְּיִשְׂרָאֵל
  choice: 在以色列寄居的人
  rationale: גֵּר 指住在以色列群体中、受其共同体秩序约束的非本族居民；“寄居的人”兼顾传统术语和可懂度。
- source_word: יַקְרִיב קָרְבָּנוֹ
  choice: 献上供物
  rationale: קרב 的使役形在祭祀语境中指带来或呈献，קָרְבָּן 是广义供物；此译避免把它过早限定为某一种祭牲。
- source_word: לְכָל נִדְרֵיהֶם וּלְכָל נִדְבוֹתָם
  choice: 作为他们所许之愿的祭或甘心祭
  rationale: 在汉语中明确这是与许愿相关的祭和自愿献上的祭，同时保留两类献祭的区别。
- source_word: לַיהוָה
  choice: 献给雅威
  rationale: 以“雅威”音译四字神名，体现原文使用的是上帝的专名，而非一般称号。
- source_word: לְעֹלָה
  choice: 作燔祭
  rationale: “燔祭”是该整烧献祭类别在现代中文圣经语域中清楚而稳定的术语。
theological_decisions:
- issue: 法律条文中 אִישׁ אִישׁ 的阳性代表语言
  choice: 任何人
  alternative: 任何男子
  rationale: 此处重复形式强调“任何一个”，适用范围包括以色列家和寄居群体；汉语“任何人”准确传达分配意义，不把语法阳性误解为条文明确排除女性。
- issue: 四字神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用神的专名；“雅威”较贴近学界通行的古代读音重建，也与咨询层的 Yahweh 对应。
- issue: נדרים 与 נדבות 的祭祀关系
  choice: 所许之愿的祭或甘心祭
  alternative: 为了他们所许的任何愿或任何甘心奉献
  rationale: 上下文谈献上的供物，故译出“祭”能自然呈现两类献祭；脚注保留原文也可较贴字理解为“为所许的愿和甘心奉献”。
translation_notes:
  register: 采用现代、庄重而易懂的律法语体。“以色列众子”“以色列家”“燔祭”保留利未记的盟约及祭祀术语；句末破折号保留原文句法尚未完结、内容延续至下一节的特点。
