    text: 原文也可较贴字译作：“为他们所许的任何愿和任何甘心奉献。”在本段献祭语境中，“甘心奉献”通常指甘心献上的祭；“为所许的愿”也可指为履行誓愿而献。
    reason: alternative_reading
  revision_rationale: 修订仅调整有关许愿与甘心献祭的短语。这样保留了希伯来文“为一切他们所许的愿和一切他们的甘心奉献”的关系与歧义，不把“愿”在正文中预先固定为一个技术性祭名；其余译文无需改动。
