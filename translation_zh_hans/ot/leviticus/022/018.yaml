revisions:
- from: “你要对亚伦、他的儿子和以色列众子[a]说，告诉他们：以色列家中任何人，或在以色列寄居的人[b]，若献上供物，作为他们所许之愿的祭或甘心祭[c]，献给雅威作燔祭——”
  to: “你要对亚伦、他的儿子和以色列众子[a]说，告诉他们：以色列家中任何人，或在以色列寄居的人[b]，若献上供物，为他们所许的任何愿，或为任何甘心祭[c]，献给雅威作燔祭——”
  rationale: 修订仅调整有关许愿与甘心献祭的短语。这样保留了希伯来文“为一切他们所许的愿和一切他们的甘心奉献”的关系与歧义，不把“愿”在正文中预先固定为一个技术性祭名；其余译文无需改动。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T04:51:27Z'
review_pass:
  verdict: revise
  source_fidelity: 译文总体准确传达了对亚伦、其子和以色列全体的训令，以及以色列家与在以色列寄居者均可献供物的范围；“雅威”“燔祭”等关键术语也与原文相符。不过，“作为他们所许之愿的祭”将“愿”直接定为“愿祭”，比原文措辞更明确；原文可指为履行所许的愿而献的供物，宜保留这一关系的开放性。
  naturalness: 整体庄重、清楚，适合律法文本。“以色列众子”虽带有刻意的直译色彩，仍可在此语域中成立；“若献上供物，为……”比“作为……的祭”更合乎现代汉语句法，也更贴近原文。
  terminology: “供物”对应 קָרְבָּן，“寄居的人”对应 גֵּר，“甘心祭”对应 נְדָבוֹת，“燔祭”对应 עֹלָה，均恰当。“雅威”一致反映四字神名。
  issues:
  - severity: medium
    issue: “作为他们所许之愿的祭或甘心祭”把“愿”明确处理为一种“愿祭”。
    rationale: לְכָל נִדְרֵיהֶם 可理解为“为他们所许的一切愿”，在本上下文当然与献祭有关，但原文的表达仍可保留为履行誓愿而献。改为“为他们所许的任何愿，或为任何甘心祭”既自然又不预断较具体的句法分析。
  - severity: low
    issue: 原脚注 c 的“任何甘心奉献”与正文术语“甘心祭”不完全一致。
    rationale: 保留“甘心奉献”作为较贴字的替代读法可以，但应说明正文的“甘心祭”是语境化译法，避免术语层次混杂。
  revised_text: “你要对亚伦、他的儿子和以色列众子[a]说，告诉他们：以色列家中任何人，或在以色列寄居的人[b]，若献上供物，为他们所许的任何愿，或为任何甘心祭[c]，献给雅威作燔祭——”
