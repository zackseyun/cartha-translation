  text: וְ/כִֽי תִזְבְּח֥וּ זֶֽבַח תּוֹדָ֖ה לַ/יהוָ֑ה לִֽ/רְצֹנְ/כֶ֖ם תִּזְבָּֽחוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/029.yaml
  text: And when you sacrifice a thank offering to Yahweh[a], you shall sacrifice it for your acceptance.
translation:
  language: zh_hans
  text: 你们向雅威献感恩祭[a]时，要为使你们蒙悦纳而献。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“感谢祭”或“感恩的祭”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: 你们……时
  rationale: 在本段律法语境中引出时间兼条件性的情形；汉语用“……时”自然衔接上下文，不把献祭说成纯属假设。句首的连接意味可由上下文自然承接，无须硬译“并且”。
- source_word: תִזְבְּחוּ / תִּזְבָּחוּ
  choice: 献……祭／献
  rationale: זבח是祭祀语境中的标准动词。首处与宾语合译为“献……祭”，末处保留重复为“献”，既符合现代汉语，也体现原文重复所带出的强调。
- source_word: זֶבַח תּוֹדָה
  choice: 感恩祭
  rationale: 该结构表示以感谢、感恩为特征的一类祭。“感恩祭”简洁、自然，并保留其特定祭物类别；其他可行译法列入脚注。
- source_word: לַיהוָה
  choice: 向雅威
  rationale: 介词ל在献祭语境中表示对象或归献方向，译作“向”；神名יהוה按其专名译作“雅威”。
- source_word: לִרְצֹנְכֶם
  choice: 为使你们蒙悦纳
  rationale: רָצוֹן在祭祀律例中主要指在神面前获悦纳，而非献祭者随自己的意愿行事。此译明确复数后缀“你们”，同时保留悦纳究竟怎样实现由相邻条例说明。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华／上主
  rationale: 原文直接使用四字神名；“雅威”以现代汉语音译其专名，避免将专名改作称号，也不采用较晚形成的“耶和华”读音。
- issue: לִרְצֹנְכֶם所指的悦纳
  choice: 使献祭者蒙悦纳
  alternative: 祭物被悦纳／按你们的意愿
  rationale: 复数第二人称后缀直接关联“你们”，且利未记祭祀语境支持“为你们得蒙悦纳”的含义；不将其解释为人的主观意愿。译文不进一步界定悦纳的神学机制。
translation_notes:
  register: 采用现代、庄重而易懂的律法体汉语。保留原文献祭动词的重复；将脚注标记紧随其实际说明的“感恩祭”，避免误以为脚注解释神名。
