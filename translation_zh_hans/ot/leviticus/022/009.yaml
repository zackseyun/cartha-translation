  text: וְ/שָׁמְר֣וּ אֶת מִשְׁמַרְתִּ֗/י וְ/לֹֽא יִשְׂא֤וּ עָלָי/ו֙ חֵ֔טְא וּ/מֵ֥תוּ ב֖/וֹ כִּ֣י יְחַלְּלֻ֑/הוּ אֲנִ֥י יְהוָ֖ה מְקַדְּשָֽׁ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/009.yaml
  text: They shall keep my charge[a], so that they do not bear sin because of it and die by it when they profane it[d][c][b]. I am Yahweh who sanctifies them.
translation:
  language: zh_hans
  text: 他们要谨守我的吩咐，免得因这事担当罪责[a]，又因亵渎它而死亡。[b]我是使他们成圣的耶和华。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “担当罪责”也可译作“招致罪责”或“负上罪责”。
    reason: lexical_alternative
  - marker: b
    text: “这事／它”原文均为代词，所指未明；可指上下文中的圣物或相关的圣洁之事。“因亵渎它而死亡”也可译作“因这事而死亡”。
    reason: referential_ambiguity
lexical_decisions:
- source_word: וְשָׁמְרוּ אֶת־מִשְׁמַרְתִּי
  choice: 他们要谨守我所托付的职守
  rationale: שׁמר在律法语境中表示遵守、谨守；מִשְׁמֶרֶת指受托看守或履行的职责。译作“我所托付的职守”，既表达受托责任，也比生硬的“守我的守卫”自然。
- source_word: וְלֹא יִשְׂאוּ עָלָיו חֵטְא
  choice: 免得因此担当罪责
  rationale: נשׂא חטא是“担当罪/罪责”的惯用表达，也可含“招致罪责”之意；“因此”保留עָלָיו所表达的关联或缘由，同时不强行确定代词的具体所指。
- source_word: וּמֵתוּ בוֹ
  choice: 又……而死亡
  rationale: 介词בּ可表达因由，即因与该罪行相联而死。中文以因果结构自然表达，同时避免将死因解释得超出原文。
- source_word: כִּי יְחַלְּלֻהוּ
  choice: 因亵渎这职守
  rationale: חלל在祭司圣洁语境中指亵渎、使圣物沦为凡俗。“亵渎”保留圣与俗的对照；正文用“这职守”承接最近的单数名词，但以脚注保留代词也可能指相关圣物或圣职之事。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代简体中文圣经读者最熟悉的专名“耶和华”对应四字神名，作为名字而非头衔处理。
- source_word: מְקַדְּשָׁם
  choice: 使他们成圣
  rationale: קדשׁ的使役意义是使之成为圣、分别为圣。“使他们成圣”兼顾原文形态、利未记的圣洁主题和现代中文可懂度。
theological_decisions:
- issue: עָלָיו、בוֹ及־הוּ所指为何
  choice: 正文将末一代词就近译为“这职守”，并以“因此”表达前两个代词的关联；脚注说明也可能指上下文中的圣物或相关圣职之事。
  alternative: 将所有代词明确解释为圣物（尤其圣食），或一律解释为耶和华所托付的职守。
  rationale: 希伯来文连续使用阳性单数代词，却未重述名词。最近的显式先行词是מִשְׁמֶרֶת，但上下文谈及圣物和祭司职责，因此不宜完全排除更宽或更具体的所指。
- issue: נשׂא חטא的法律与神学含义
  choice: 担当罪责
  alternative: 招致罪责
  rationale: “担当罪责”较贴近希伯来惯用语，并保留承担罪及其后果的张力；脚注提示其也可理解为招致或负上罪责。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。“谨守”“职守”“亵渎”“成圣”维持利未记祭司律例的礼仪与圣洁语域；句法尽量清楚，不以教派术语扩展原文。所有脚注标记均置于正文相关句末。
