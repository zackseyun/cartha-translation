  text: וְ/שׁ֖וֹר אוֹ שֶׂ֑ה אֹת֣/וֹ וְ/אֶת בְּנ֔/וֹ לֹ֥א תִשְׁחֲט֖וּ בְּ/י֥וֹם אֶחָֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/028.yaml
  text: Whether an ox or a sheep, you shall not slaughter it and its young on one day.
translation:
  language: zh_hans
  text: 牛或羊，你们不可在同一天宰杀它和它的幼崽。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“它和它的儿子”；这里指一只牲畜和它的后代。
    reason: lexical_alternative
lexical_decisions:
- source_word: שׁוֹר
  choice: 牛
  rationale: 该词指牛类牲畜；中文“牛”既自然简洁，又不把性别限定为公牛。
- source_word: שֶׂה
  choice: 羊
  rationale: 该词指羊群中的个体，依语境可包括绵羊或山羊；“羊”在中文中保留这种较宽的指称，也避免误限定为幼羊。
- source_word: אֹתוֹ וְאֶת־בְּנוֹ
  choice: 它和它的崽
  rationale: 原文直译为“它和它的儿子”；用于牲畜时，“崽”是自然的现代汉语表达，又不额外断定前一只一定是母畜。
- source_word: תִשְׁחֲטוּ
  choice: 你们不可……宰杀
  rationale: 该动词是宰杀牲畜的常用词，尤其适合献祭和律法语境；复数第二人称用“你们”明确表达。
- source_word: בְּיוֹם אֶחָד
  choice: 在同一天
  rationale: 字面为“在一天之内／在一个日子里”，此处禁令的自然中文含义是不得在同一天宰杀两者。
- source_word: אוֹ
  choice: 或
  rationale: 直接保留牛与羊之间的选择关系。
theological_decisions:
- issue: 是否把亲子关系明确为母畜与后代
  choice: 保留为“它和它的崽”
  alternative: “母畜和它的崽”
  rationale: 本节原文的代词和“儿子”本身没有明说前者为母畜；不根据相关经文或解释传统在正文中增添性别限定。
translation_notes:
  register: 采用简明、庄重的现代律法语体。“在同一天”比机械直译“一日之内”更自然，同时准确表达禁令；“崽”通俗易懂，但不显轻佻。
