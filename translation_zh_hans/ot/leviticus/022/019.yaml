  text: for your acceptance, it must be a sound male from the cattle, the sheep, or the goats.
translation:
  language: zh_hans
  text: 为使你们蒙悦纳，必须献上没有残疾的公畜，出自牛、绵羊或山羊。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִרְצֹנְכֶם
  choice: 为使你们蒙悦纳
  rationale: 该词组在献祭语境中表示祭物使献祭者获得接纳或悦纳；译为目的结构，既保留礼仪含义，也符合现代汉语表达。
- source_word: תָּמִים
  choice: 没有残疾的
  rationale: 在祭牲语境中指身体完整、无缺陷，未必泛指健康强壮；“没有残疾”比“健全”更直接准确。
- source_word: זָכָר
  choice: 公畜
  rationale: 指雄性的祭牲；结合后列牛、绵羊和山羊，用“公畜”自然且明确。
- source_word: בַּבָּקָר בַּכְּשָׂבִים וּבָעִזִּים
  choice: 从牛、绵羊或山羊中选取
  rationale: 三个介词短语列明可选牲畜类别；中文补出“选取”，使句法完整，并以“或”表达类别间的选择关系。
theological_decisions:
- issue: לִרְצֹנְכֶם所指的是献祭者被悦纳，还是祭物本身合乎悦纳
  choice: 译作“为使你们蒙悦纳”
  alternative: “要献上蒙悦纳的”或“使祭物蒙悦纳”
  rationale: 第二人称复数后缀更自然地关联献祭者；本章相关礼仪措辞也着眼于献祭者藉合宜祭物获得接纳。译文保留目的意义，不进一步说明悦纳的机制。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“所献的”承接上下文中的供物，避免重复；“可以从……中选取”自然呈现希伯来文所列三类牲畜。
