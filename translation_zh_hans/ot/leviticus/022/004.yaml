language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: אִ֣ישׁ אִ֞ישׁ מִ/זֶּ֣רַע אַהֲרֹ֗ן וְ/ה֤וּא צָר֨וּעַ֙ א֣וֹ זָ֔ב בַּ/קֳּדָשִׁים֙ לֹ֣א יֹאכַ֔ל עַ֖ד אֲשֶׁ֣ר יִטְהָ֑ר וְ/הַ/נֹּגֵ֨עַ֙ בְּ/כָל טְמֵא נֶ֔פֶשׁ א֣וֹ אִ֔ישׁ אֲשֶׁר תֵּצֵ֥א מִמֶּ֖/נּוּ שִׁכְבַת זָֽרַע־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/004.yaml
  text: Any man from the offspring of Aaron[a], if he is afflicted with a skin disease or has a discharge, shall not eat from the holy things until he becomes clean. And whoever touches anything unclean by a dead person, or a man from whom an emission of semen comes out[b],
translation:
  language: zh_hans
  text: 亚伦的后裔中，任何患有皮肤病[a]或患漏症的男子，都不可吃圣物，直到他洁净。凡接触任何因接触死者而不洁净的人[b]，或遗精的男子，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 传统译作“患麻风病”。这里的希伯来词泛指会造成礼仪不洁的皮肤病，并不一定是现代所说的麻风病（汉森病）。
    reason: lexical_alternative
  - marker: b
    text: 原文是浓缩表达，或可译作“任何因尸体而不洁净的东西”，指与死者有关的礼仪不洁。
    reason: textual_ambiguity
lexical_decisions:
- source_word: אִישׁ אִישׁ מִזֶּרַע אַהֲרֹן
  choice: 亚伦的后裔中，任何……男子
  rationale: אִישׁ אִישׁ是分配性表达，意为“任何男子”；本处具体涉及亚伦家系中的男性祭司后裔。זֶרַע在这里指家系或后裔，并非字面意义的“种子”。
- source_word: צָרוּעַ
  choice: 患有严重皮肤病
  rationale: 该词指造成礼仪不洁的皮肤病症，不能直接等同于现代医学所说的麻风病（汉森病）。“严重皮肤病”既避免错误的医学限定，也能自然表达其显著病症。
- source_word: זָב
  choice: 有漏症
  rationale: 该词指使人礼仪上不洁净的身体排出病症。“漏症”简洁地保留了利未记相关法规中的术语关联。
- source_word: בַּקֳּדָשִׁים לֹא יֹאכַל
  choice: 不可吃圣物
  rationale: קֳדָשִׁים在此指分别为圣、可供祭司食用的祭物份额；否定未完成式在律法语境中表达禁令。
- source_word: עַד אֲשֶׁר יִטְהָר
  choice: 直到他洁净
  rationale: יִטְהָר指进入礼仪洁净的状态；“洁净”保留礼仪范畴，不误解为单纯康复或道德净化。
- source_word: וְהַנֹּגֵעַ בְּכָל טְמֵא נֶפֶשׁ
  choice: 凡接触任何因死人而不洁净的人
  rationale: טְמֵא נֶפֶשׁ是与死者所致不洁有关的浓缩表达；把所接触的对象理解为因接触死者而不洁净的人，符合句法上阳性形式的自然读法，同时用脚注保留其表达上的歧义。
- source_word: אִישׁ אֲשֶׁר תֵּצֵא מִמֶּנּוּ שִׁכְבַת זָרַע
  choice: 遗精的男子
  rationale: 希伯来语直译为“精液从他出来的男子”。“遗精”是现代汉语中简明、端庄的对应说法，表达精液排出所造成的礼仪不洁。
theological_decisions:
- issue: 皮肤病与礼仪不洁的关系
  choice: 采用“严重皮肤病”和“洁净”，不把病症直接称为现代麻风病，也不把洁净改写为医治
  alternative: 患麻风病；直到痊愈或得洁净
  rationale: 本节规范的是祭司在礼仪不洁期间能否吃圣物，而非作现代医学诊断或道德评判。译文保留疾病与礼仪状态之间的区别。
- issue: 因死人所致不洁的句法对象
  choice: 正文译为接触因死人而不洁净的人
  alternative: 接触任何因尸体而不洁净的东西；接触死者所造成的任何不洁
  rationale: 原文是高度浓缩的礼仪用语，可能着重于因死者而不洁的人，也可较宽泛地理解为与死人有关的不洁之物。正文采用句法上较具体的读法，脚注保留另一可能。
- issue: 法律主体的性别指向
  choice: 保留“男子”
  alternative: 任何人；有人
  rationale: 原文使用阳性名词，语境又是亚伦家系中有资格吃祭司圣物的男性后裔；明确译出“男子”避免模糊本节的具体法律对象。
translation_notes:
  register: 采用现代、庄重而清楚的律法文体。“不可”“圣物”“洁净”维持利未记礼仪法规的术语连贯性。原文及本节在此处尚未完句，因此译文末尾保留逗号，与下一节衔接。
