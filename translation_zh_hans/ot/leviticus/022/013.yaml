  text: וּ/בַת כֹּהֵן֩ כִּ֨י תִהְיֶ֜ה אַלְמָנָ֣ה וּ/גְרוּשָׁ֗ה וְ/זֶרַע֮ אֵ֣ין לָ/הּ֒ וְ/שָׁבָ֞ה אֶל בֵּ֤ית אָבִ֨י/הָ֙ כִּ/נְעוּרֶ֔י/הָ מִ/לֶּ֥חֶם אָבִ֖י/הָ תֹּאכֵ֑ל וְ/כָל זָ֖ר לֹא יֹ֥אכַל בּֽ/וֹ־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/013.yaml
  text: But if a priest’s daughter becomes a widow or divorced[a], and has no offspring, and returns to her father’s house as in her youth, she may eat from her father’s food[b]; but no outsider may eat of it.
translation:
  language: zh_hans
  text: 但祭司的女儿若成了寡妇或离了婚，又没有后代，回到父家，像年轻时一样，就可以吃她父亲的食物[a]；任何外人[b]都不可吃这食物。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “食物”直译为“饼”；这里很可能泛指祭司家庭所得的食物供给。
    reason: lexical_alternative
  - marker: b
    text: “外人”指不在获准食用范围内的人，并不一定是族裔上的外国人。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בַת כֹּהֵן֩ כִּ֨י תִהְיֶ֜ה
  choice: 但祭司的女儿若成为
  rationale: וּ承接上文并形成对比，译作“但”符合本条法规的语流；כִּי与未完成式构成条件情形，译作“若成为”。
- source_word: אַלְמָנָ֣ה וּ/גְרוּשָׁ֗ה
  choice: 寡妇或被休
  rationale: 希伯来文并列两种可替代的身份状况；中文以“或”避免误解为必须同时兼具两种身份。“被休”保留גְרוּשָׁה所含被丈夫遣离的被动意味。
- source_word: וְ/זֶרַע֮ אֵ֣ין לָ/הּ֒
  choice: 又没有后代
  rationale: זֶרַע字面为“种子”，在亲属法规中泛指子女或后裔；“后代”比“孩子”更能保留其范围。
- source_word: וְ/שָׁבָ֞ה אֶל בֵּ֤ית אָבִ֨י/הָ֙
  choice: 回到父家
  rationale: שׁוב表示返回；“父家”自然简洁，也保留重返原生家庭及其户籍生活圈的法律社会含义。
- source_word: כִּ/נְעוּרֶ֔י/הָ
  choice: 像年轻时一样
  rationale: 直译为“如她年轻的时候”，指她婚前在父家的原有处境；此译不额外限定为童年或少女身份。
- source_word: מִ/לֶּ֥חֶם אָבִ֖י/הָ תֹּאכֵ֑ל
  choice: 就可以吃她父亲的食物
  rationale: לֶחֶם字面是“饼、食物”，此处在祭司家庭供给的语境中可泛指食物；未完成式在法规中表达许可，译作“可以吃”。
- source_word: וְ/כָל זָ֖ר
  choice: 任何外人
  rationale: זָר在祭司法规中指许可范围以外的人，并非按族裔定义的外国人；“外人”保留这种圈内与圈外的关系。
- source_word: לֹא יֹ֥אכַל בּֽ/וֹ
  choice: 都不可吃这食物
  rationale: 否定未完成式表达法律禁令；将代词明确为“这食物”，使现代中文指代清楚而不改变所指。
theological_decisions:
- issue: “她父亲的食物”所指的范围
  choice: 正文译לֶחֶם为“食物”，脚注说明其字面义为“饼”
  alternative: 正文直译为“她父亲的饼”
  rationale: 本章讨论祭司家庭成员食用圣物或祭司所得食物的资格。“食物”能自然表达集合性的家庭供给，又不把经文限定为普通面饼；脚注保留原词的具体意象与可能范围。
- issue: זָר的身份性质
  choice: 译为“外人”，并以脚注说明是许可范围以外的人
  alternative: 译为“陌生人”或“外国人”
  rationale: 这里的区别属于祭司食物的准入资格，而非族裔或熟识程度；脚注避免读者把“外人”误解成外国人。
translation_notes:
  register: 采用现代、庄重而易懂的法规语体。“被休”准确表达婚姻被解除的被动状态；“父家”“后代”“不可”保持经文的简洁与法律庄重感。所有脚注标记均已置入正文。
