  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: נֶ֚פֶשׁ אֲשֶׁ֣ר תִּגַּע בּ֔/וֹ וְ/טָמְאָ֖ה עַד הָ/עָ֑רֶב וְ/לֹ֤א יֹאכַל֙ מִן הַ/קֳּדָשִׁ֔ים כִּ֛י אִם רָחַ֥ץ בְּשָׂר֖/וֹ בַּ/מָּֽיִם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/006.yaml
  text: The person who touches it shall be unclean until the evening[b][a], and shall not eat any of the holy things unless he has washed his body with water.
translation:
  language: zh_hans
  text: 凡接触它的人，必成为不洁净，直到晚上；他不可吃圣物[a]，除非已经用水洗过身体[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “圣物”也可译作“神圣的供物”或“分别为圣之物”。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“用水洗过他的肉身”。
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶפֶשׁ
  choice: 人
  rationale: 在律法语境中指具体的个人，并非非物质意义的“灵魂”；“人”自然且保留单数法律主体的含义。
- source_word: אֲשֶׁר תִּגַּע בּוֹ
  choice: 接触了它的
  rationale: 阴性动词与语法上为阴性的 נֶפֶשׁ 呼应，并不表明当事人的生理性别；“它”承接上文所说导致不洁的对象，同时保留原文代词的概括性。
- source_word: וְטָמְאָה
  choice: 必不洁净
  rationale: 表示接触之后所处的礼仪状态；“必”符合律法陈述的语气，同时不把礼仪不洁误作道德罪责。
- source_word: עַד הָעָרֶב
  choice: 到晚上
  rationale: 简洁自然地表达不洁状态持续的时限。
- source_word: וְלֹא יֹאכַל
  choice: 不可吃
  rationale: 在律法语境中表达禁止或资格限制，现代汉语清楚而庄重。
- source_word: מִן הַקֳּדָשִׁים
  choice: 圣物
  rationale: 该复数名词指分别为圣、可供祭司食用之物；“圣物”简洁保留其范围，部分义由动词“吃”的宾语关系自然体现。
- source_word: כִּי אִם
  choice: 除非
  rationale: 引出获准进食前必须满足的条件，是原文习语自然简洁的汉语对应。
- source_word: רָחַץ בְּשָׂרוֹ בַּמָּיִם
  choice: 用水洗过身体
  rationale: בָּשָׂר 字面为“肉身”，此处指人的身体；该译法清楚表达具体的洁净行动，并以“洗过”体现条件达成。
theological_decisions:
- issue: 不洁语言的性质
  choice: 礼仪上的不洁
  alternative: 道德上的污秽或罪责
  rationale: 上下文讨论因接触而失去吃圣物资格，并以水洗和时间恢复礼仪资格；译文使用“不洁净”，不加入原文未明说的道德定罪。
- issue: 清洗与不洁时限的关系
  choice: 保留“到晚上”与“除非洗过身体”两个陈述，不把两者合并为单一条件
  alternative: 译成洗过后立刻洁净，或仅到晚上便可吃
  rationale: 本节同时陈述不洁持续到晚上及进食前须洗身；下一节进一步说明日落后的资格。译文保留原文张力，不擅自改写两者关系。
translation_notes:
  register: 采用现代、庄重而易懂的律法语体。“必不洁净”表达规定性的礼仪状态，“不可吃”表达资格限制。代词不标示性别，以免把 נֶפֶשׁ 的语法阴性或后续阳性形式误解为生理性别。脚注标记均置于对应词语之后。
