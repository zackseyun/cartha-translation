base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/025.yaml
  text: And from the hand of a foreigner you shall not present any of these as the food of your God[a], because their corruption is in them; a defect is in them[b]. They shall not be accepted for you.
translation:
  language: zh_hans
  text: 你们也不可从外族人手中献上这些牲畜中的任何一只，作为你们上帝的食物[a]，因为它们有损伤，身上有缺陷[b]；它们不会为你们蒙悦纳。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“你们上帝的饼”。“饼”在这里是希伯来文献祭用语，泛指献给上帝的食物。
    reason: lexical_alternative
  - marker: b
    text: 或译“瑕疵”。希伯来词指使祭牲不合资格的身体缺陷。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִיַּד
  choice: 也不可从……手中
  rationale: מִיַּד直译为“从……手中”，在这里表示祭牲的来源；中文保留“手中”既能体现原文表达，也自然易懂。连接词וּ结合否定句译作“也不可”。
- source_word: בֶּן נֵכָר
  choice: 外族人
  rationale: 该短语字面为“外族之子”，实际指以色列群体之外的人。“外族人”符合现代中文的社会与法律语境，又避免“外国人”可能带来的现代国籍概念。
- source_word: תַקְרִיבוּ
  choice: 献作
  rationale: קרב的使役式在献祭语境中指把祭物呈献给上帝。这里与“上帝的食物”连用，译作“献作”简洁自然。
- source_word: לֶחֶם אֱלֹהֵיכֶם
  choice: 你们上帝的食物
  rationale: לֶחֶם本义为“饼、食物”，在祭司礼仪用语中泛指献给上帝的祭物。正文用“食物”避免让读者误以为这里只谈饼，同时脚注保留字面译法。
- source_word: מִכָּל אֵלֶּה
  choice: 这些牲畜中的任何一只
  rationale: 该短语回指上文所说不合格的祭牲。译出“牲畜”和量词“一只”，使中文指代清楚；“任何”体现מִן与כָּל结合后的分指含义。
- source_word: מָשְׁחָתָם
  choice: 它们身上有损伤
  rationale: 该词可表示损坏、败坏或毁损。在有缺陷祭牲的语境中，“损伤”自然地表达其不适合作祭物的状态，同时不与下句的מוּם完全合并。
- source_word: מוּם
  choice: 残疾
  rationale: מוּם是利未记21—22章中表示使人或祭牲失去礼仪资格之身体缺陷的常用词。“残疾”明确表达较实质的身体缺陷；脚注列出“瑕疵”这一传统译法。
- source_word: לֹא יֵרָצוּ לָכֶם
  choice: 它们不能为你们蒙悦纳
  rationale: רצה的被动式在献祭语境中表示祭物受到悦纳。译文保留לָכֶם的“为你们”，表明这里说的是祭物代表献祭者是否被接纳。
theological_decisions:
- issue: 献祭礼仪中“上帝的食物”这一表达
  choice: 你们上帝的食物
  alternative: 你们上帝的饼
  rationale: 原文לֶחֶם在这里是祭司礼仪用语，所指包括献上的牲畜，并非仅指日常食用的饼。正文译“食物”传达其语境含义，脚注保留字面形式，不对这一拟人化礼仪表达作神学化解释。
- issue: 祭物与献祭者的蒙悦纳关系
  choice: 它们不能为你们蒙悦纳
  alternative: 它们不会被接纳
  rationale: 保留“为你们”可忠实表达לָכֶם，说明祭物的悦纳与献祭者相关；译文不进一步解释这种代表关系的神学机制。
translation_notes:
  register: 采用现代、庄重而易懂的祭司礼仪语体。“献作”“蒙悦纳”保留经文的礼仪色彩，但句法按现代汉语组织。正文中的[a]、[b]均与脚注对应。
