  text: בַּ/יּ֤וֹם הַ/הוּא֙ יֵאָכֵ֔ל לֹֽא תוֹתִ֥ירוּ מִמֶּ֖/נּוּ עַד בֹּ֑קֶר אֲנִ֖י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/030.yaml
  text: It shall be eaten on that same day[a]; you shall leave none of it until morning[b]. I am Yahweh.
translation:
  language: zh_hans
  text: 要在当天吃完[a]，一点也不可留到早晨。我是雅威。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“在那日。”
    reason: 保留 בַּיּוֹם הַהוּא 的字面表达，以及它可理解为“那日”或按上下文理解为“当天”的差别。
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: 在当天
  rationale: 原文直译为“在那日”。结合祭物须在献祭当日吃完的规例，“在当天”以自然现代汉语表达其即时性，同时用脚注保留较字面的译法。
- source_word: יֵאָכֵל
  choice: 要……吃掉
  rationale: אכל 的尼法勒未完成式在此表达被动、非人称的规定。“要……吃掉”符合现代汉语法规语气，也清楚传达祭物必须被吃完。
- source_word: לֹא תוֹתִירוּ מִמֶּנּוּ
  choice: 一点也不可留
  rationale: יתר 的使役词干意为“留下、使剩余”；第二人称复数构成禁令。“一点也不可留”简洁地表达不得留下其中任何部分。
- source_word: עַד בֹּקֶר
  choice: 到早晨
  rationale: 这是常见的时间表达，指不得将祭物留过夜，直到次日早晨。
- source_word: אֲנִי יְהוָה
  choice: 我是雅威
  rationale: 保留希伯来文的盟约之名 יְהוָה，并以普通话中通行的音译“雅威”呈现；“我是”自然表达原文无系词的自我宣告。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华／上主
  rationale: 原文直接使用四字神名。音译为“雅威”保留其专名性质，不以称号替代，也不引入特定宗派解释。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准普通话。“要……吃掉”与“不可”共同保持祭司法令的规定性；不为原文补出“祭物”等显明但未明说的名词。
