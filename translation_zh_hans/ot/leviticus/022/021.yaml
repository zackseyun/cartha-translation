id: LEV.22.21
reference: Leviticus 22:21
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/אִ֗ישׁ כִּֽי יַקְרִ֤יב זֶֽבַח שְׁלָמִים֙ לַ/יהוָ֔ה לְ/פַלֵּא נֶ֨דֶר֙ א֣וֹ לִ/נְדָבָ֔ה בַּ/בָּקָ֖ר א֣וֹ בַ/צֹּ֑אן תָּמִ֤ים יִֽהְיֶה֙ לְ/רָצ֔וֹן כָּל מ֖וּם לֹ֥א יִהְיֶה בּֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/021.yaml
  text: And if a man presents a sacrifice of peace offerings to Yahweh[a], to fulfill a vow or as a freewill offering, from the herd or from the flock, it shall be without blemish to be accepted[b]; there shall be no defect in it.
translation:
  language: zh_hans
  text: 若有人献平安祭牲[b]给耶和华，为履行誓愿[a]，或作甘心祭；无论祭牲出自牛群或羊群，都必须没有残缺，才蒙悦纳；它身上不可有任何缺陷。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “履行誓愿”也可译作“还愿”或“实行所许的愿”。
    reason: 保留 לְפַלֵּא נֶדֶר 在此处“实行、完成所许之愿”的词义范围。
  - marker: b
    text: “平安祭”也常按其礼仪功能译作“团契祭”。
    reason: 说明 שְׁלָמִים 的传统直译与较具解释性的功能译法。
lexical_decisions:
- source_word: וְאִישׁ כִּי
  choice: 若有人
  rationale: 这是律法条文中引出个案的条件句。虽然 אִישׁ 是阳性单数，但现代汉语“有人”可自然表达代表性法律主体，并不抹去原文的个体性。
- source_word: יַקְרִיב
  choice: 献
  rationale: קרב 的使役形在献祭语境中指把祭物呈献给上帝；“献”简洁、自然，并保留礼仪含义。
- source_word: זֶבַח שְׁלָמִים
  choice: 平安祭牲
  rationale: זֶבַח 指所宰献的祭牲，שְׁלָמִים 指祭物类别。“平安祭牲”既保留与 שׁלם 的词源联系，也明确这里所说的是献上的牲畜。
- source_word: לַיהוָה
  choice: 给耶和华
  rationale: 将四字神名 יְהוָה 音译为“耶和华”，在简体中文圣经语域中清楚、庄重，并把它作为专名呈现。
- source_word: לְפַלֵּא נֶדֶר
  choice: 为要履行誓愿
  rationale: 此处 פלא 与 נדר 连用，指实行、偿还或完成所许的愿；“履行誓愿”准确表达献祭是兑现先前所许之愿。
- source_word: אוֹ לִנְדָבָה
  choice: 或作甘心祭
  rationale: נְדָבָה 指非因誓愿约束而自愿献上的祭物；“甘心祭”是清楚而凝练的礼仪用语。
- source_word: בַּבָּקָר אוֹ בַצֹּאן
  choice: 从牛群或羊群中
  rationale: בקר 与 צאן 分别是大牲畜群和包括绵羊、山羊的小牲畜群；“牛群或羊群”符合现代中文习惯。
- source_word: תָּמִים
  choice: 没有残缺
  rationale: 在献祭律例中指祭牲身体完整、没有使其不合格的瑕疵；“没有残缺”比抽象的“完全”更明确。
- source_word: לְרָצוֹן
  choice: 才会蒙悦纳
  rationale: 该短语表达祭牲要达到可被接纳的状态；译文不额外说明悦纳者，以保留原文的简练表达。
- source_word: כָּל מוּם לֹא יִהְיֶה בּוֹ
  choice: 它身上不可有任何缺陷
  rationale: מוּם 是使祭牲不合格的身体缺陷；此译保留绝对性的 כָּל 与律法禁令的语气。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用上帝的专名。采用中文读者熟悉的专名“耶和华”，而不以“主”替代，从而保留专名性质；“雅威”是较接近学术重构发音的可行异译。
- issue: לְרָצוֹן 所表达的悦纳
  choice: 才会蒙悦纳
  alternative: 才可被接纳
  rationale: 原文说明祭牲无残缺是获得悦纳的条件，但没有在本短语内明说主语或进一步解释悦纳机制；译文保持这种神学张力，不补入超出经文的说明。
- issue: 法律主体 אִישׁ 的性别表达
  choice: 有人
  alternative: 一个男人
  rationale: 这里是代表性的祭祀律例，并非论述该人的性别；现代汉语“有人”是自然的条件句表达，不把原文扩展为所有身份类别，也避免产生只强调成年男性的额外含义。
translation_notes:
  register: 采用现代、庄重而易懂的律法文体。“祭牲”“誓愿”“蒙悦纳”等词保留利未记的礼仪语域，同时避免古奥句式。脚注标记紧接各自所解释的词语，以免与神名或其他成分误配。
