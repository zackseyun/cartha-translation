  to: 若有人献平安祭牲[b]给耶和华，为履行誓愿[a]，或作甘心祭；无论祭牲出自牛群或羊群，都必须没有残缺，才蒙悦纳；它身上不可有任何缺陷。
  rationale: 修订仅调整牲畜来源短语的位置，并将“才会蒙悦纳”简化为“才蒙悦纳”。这使译文更顺畅地对应原文的句法推进：献平安祭给耶和华——为还愿或甘心献——祭牲取自牛群或羊群——必须无残缺，方蒙悦纳。未增添原文未明言的礼仪或神学解释，脚注锚点及内容均予保留。
