  text: וְ/כֹהֵ֗ן כִּֽי יִקְנֶ֥ה נֶ֨פֶשׁ֙ קִנְיַ֣ן כַּסְפּ֔/וֹ ה֖וּא יֹ֣אכַל בּ֑/וֹ וִ/ילִ֣יד בֵּית֔/וֹ הֵ֖ם יֹאכְל֥וּ בְ/לַחְמֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/011.yaml
  text: But if a priest buys a person as his property with his money[a], he may eat of it[b], and those born in his house may eat of his food.
translation:
  language: zh_hans
  text: 但祭司若用自己的银钱买一个人作产业[a]，那人可以吃这圣物[b]；生在他家里的人也可以吃祭司的食物。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“一个人，是他用银钱购得的产业。”
    reason: lexical_alternative
  - marker: b
    text: 原文为“可以吃它（或：吃其中的）”，所指是上下文中的圣物。句末“食物”一词也可直译为“饼”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כֹהֵן כִּי
  choice: 但祭司若
  rationale: 承接上一节的法律条款并形成对照；כִּי在此引入条件情形，因此译作“若”。
- source_word: יִקְנֶה נֶפֶשׁ
  choice: 买了一个人
  rationale: קנה在这里由银钱交易的语境限定为购买；נֶפֶשׁ指一个人，而非非物质意义的“灵魂”。
- source_word: קִנְיַן כַּסְפּוֹ
  choice: 用自己的银钱……作产业
  rationale: 既表达以银钱购得，也保留原文所明确含有的财产归属含义，不将其弱化为一般雇佣或服侍关系。
- source_word: הוּא יֹאכַל בּוֹ
  choice: 那人可以吃这圣物
  rationale: הוּא回指被买的人，译作“那人”可避免误指祭司；בּוֹ所指由上下文补明为祭司的圣物。
- source_word: וִילִיד בֵּיתוֹ
  choice: 生在他家里的人
  rationale: 保留“家中出生”的字面关系；后接复数代词和动词，故按集合意义表达为多人，而不额外加入“奴仆”等原文此处未明说的称谓。
- source_word: הֵם יֹאכְלוּ
  choice: 也可以吃
  rationale: 法律语境中的未完成式表达准许，现代汉语以“可以”自然传达。
- source_word: בְלַחְמוֹ
  choice: 他的食物
  rationale: לֶחֶם字面为“饼”或“食物”，此处按祭司所得食物的广义用法译为“食物”，同时保留属格关系。
theological_decisions:
- issue: 涉及人口买卖及财产身份的法律措辞
  choice: 用自己的银钱买了一个人作产业
  alternative: 用自己的银钱买了一个人
  rationale: 保留קִנְיַן כַּסְפּוֹ中的财产含义，以忠实呈现文本所述的古代法律身份；这是翻译上的透明处理，并非对该制度作道德认可。
- issue: 被买之人获准吃什么
  choice: 这圣物
  alternative: 它／其中的食物
  rationale: בּוֹ本身仅为代词，但上下文谈论祭司家庭可否吃圣物；正文适度补明所指，同时以脚注交代原文形式及另一种表达，避免把解释伪装成逐字对应。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“作产业”保留原文令人不适但真实存在的财产关系；“那人”明确代词所指。“圣物”为上下文补明，脚注保留原文代词的简约性。
