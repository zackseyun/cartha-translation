id: LEV.22.7
reference: Leviticus 22:7
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וּ/בָ֥א הַ/שֶּׁ֖מֶשׁ וְ/טָהֵ֑ר וְ/אַחַר֙ יֹאכַ֣ל מִן הַ/קֳּדָשִׁ֔ים כִּ֥י לַחְמ֖/וֹ הֽוּא־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/007.yaml
  text: When the sun has set, he will be clean; and afterward he may eat from the holy things, because they are his food.
translation:
  language: zh_hans
  text: 太阳落山以后，他就洁净了；随后可以吃圣物[a]，因为这是他的食物[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“神圣的祭物”。这里指祭司可以食用的神圣份额。
    reason: lexical_alternative
  - marker: b
    text: “食物”原文直译为“饼”；这里泛指供他食用的食物。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָא הַשֶּׁמֶשׁ
  choice: 太阳落山以后
  rationale: 希伯来语字面为“太阳进来”，是表示日落的习语；译为“太阳落山以后”既传达习语含义，也自然体现本节的时间顺序。
- source_word: וְטָהֵר
  choice: 他就洁净了
  rationale: 此处指不洁状态结束后恢复礼仪上的洁净；“就洁净了”保留连续叙事和律例语境，并不擅自引入道德意义。
- source_word: וְאַחַר
  choice: 随后
  rationale: 简洁自然地表达下一步的时间顺序。
- source_word: יֹאכַל
  choice: 可以吃
  rationale: 在律例语境中，这一未完成式表示恢复洁净后获得许可，故译作“可以吃”。
- source_word: מִן הַקֳּדָשִׁים
  choice: 吃圣物
  rationale: קֳדָשִׁים 指分别为圣之物或神圣份额；“圣物”直接保留原文较宽泛的称谓，不把它限定为某一种祭物。中文“吃圣物”已自然表达介词 מִן 的部分性。
- source_word: כִּי
  choice: 因为
  rationale: 在此引出准许他吃圣物的理由。
- source_word: לַחְמוֹ הוּא
  choice: 这是他的食物
  rationale: 原文为单数结构，字面近于“这是他的饼”；此处 לֶחֶם 泛指供养祭司的食物。“这是他的食物”既保持单数指称，也符合现代汉语。
theological_decisions:
- issue: “洁净”的性质
  choice: 保留礼仪洁净的表达
  alternative: 译成道德或属灵上的纯洁
  rationale: 利未记22章的上下文涉及祭司从不洁状态恢复后食用圣物的资格；原文没有把这里的洁净界定为道德悔改，因此译文不加入这种解释。
- issue: “圣物”的具体范围
  choice: 采用较宽泛的“圣物”
  alternative: 明确译为“神圣祭物”或“祭物中分别出来的份”
  rationale: 原文复数 הַקֳּדָשִׁים 本身可泛指神圣之物；上下文虽指祭司可食用的神圣份额，但正文保留原文的概括性，并以脚注说明可能含义。
translation_notes:
  register: 采用现代、庄重而易懂的律例文体。“太阳落山以后……随后……”清楚呈现程序次序；“洁净”“圣物”保留利未记的祭司礼仪用语，同时避免过度解释。
