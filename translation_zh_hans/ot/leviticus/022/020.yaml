  text: כֹּ֛ל אֲשֶׁר בּ֥/וֹ מ֖וּם לֹ֣א תַקְרִ֑יבוּ כִּי לֹ֥א לְ/רָצ֖וֹן יִהְיֶ֥ה לָ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/020.yaml
  text: You shall not present anything that has a blemish[b][a], for it will not be accepted for you.
translation:
  language: zh_hans
  text: 凡有残疾的，你们不可献上[a]，因为这不能为你们蒙悦纳[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “残疾”或译“缺陷”，这里指使祭物不合格的身体缺陷。
    reason: lexical_alternative
  - marker: b
    text: 或译：“因为这祭物不会为你们蒙悦纳。”
    reason: alternative_reading
lexical_decisions:
- source_word: כֹּל אֲשֶׁר בּוֹ מוּם
  choice: 凡有残疾的
  rationale: 这是概括性的表达，指一切带有使祭物不合格之缺陷的对象。“凡……的”保留全面禁止的语气，也符合现代汉语法律条文的表达。
- source_word: מוּם
  choice: 残疾
  rationale: 该词在祭祀条例中通常指可辨认的身体缺陷。“残疾”在上下文中自然明确，又保留其使祭牲不合格的专门含义。
- source_word: לֹא תַקְרִיבוּ
  choice: 你们都不可献上
  rationale: קרב 的使役词干在献祭语境中指把祭物带到上帝面前献上。“献上”自然传达祭祀行为；“都”呼应前面的概括性 כֹּל。
- source_word: כִּי
  choice: 因为
  rationale: 此处引出禁止这样做的理由，现代汉语用“因为”清楚自然。
- source_word: לֹא לְרָצוֹן יִהְיֶה לָכֶם
  choice: 这不能使你们蒙悦纳
  rationale: לְרָצוֹן 表示祭物在上帝面前获得悦纳，לָכֶם 又带有“为你们、使你们受益”的关系意义。此译法保留祭物是否使献祭者蒙悦纳的含义，同时不把隐含的施动者明说出来。
theological_decisions:
- issue: 祭祀语境中的悦纳及 לָכֶם 的关系意义
  choice: 这不能使你们蒙悦纳
  alternative: 这不会为你们蒙悦纳／这不会代表你们蒙悦纳
  rationale: 原文既可侧重祭物“不蒙悦纳”，也可理解为祭物不能使献祭者获得悦纳。“使你们蒙悦纳”在自然汉语中体现 לָכֶם 的受益或代表关系；脚注保留以祭物为语法焦点的译法，避免消除原文张力。
translation_notes:
  register: 采用现代、庄重而易懂的法律—祭祀语体。“献上”明确祭祀场景；“蒙悦纳”保留礼仪性用语，但在现代普通读者中仍可理解。所有脚注标记均已置于正文相应位置。
