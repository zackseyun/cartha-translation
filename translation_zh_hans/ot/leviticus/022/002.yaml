  text: דַּבֵּ֨ר אֶֽל אַהֲרֹ֜ן וְ/אֶל בָּנָ֗י/ו וְ/יִנָּֽזְרוּ֙ מִ/קָּדְשֵׁ֣י בְנֵֽי יִשְׂרָאֵ֔ל וְ/לֹ֥א יְחַלְּל֖וּ אֶת שֵׁ֣ם קָדְשִׁ֑/י אֲשֶׁ֨ר הֵ֧ם מַקְדִּשִׁ֛ים לִ֖/י אֲנִ֥י יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/002.yaml
  text: Speak to Aaron and to his sons[a], that they keep themselves from the holy things of the sons of Israel, and not profane my holy name, which they sanctify for me[c][b]. I am Yahweh.
translation:
  language: zh_hans
  text: “你要告诉亚伦和他的儿子们：他们要远离以色列人的圣物[a]，不可亵渎我的圣名；这些圣物是以色列人分别为圣、献给我的[b]。我是雅威。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “远离”也可译作“自守，不接触”或“禁戒”。这里是吩咐祭司在不合资格时避免接触或取用圣物。
    reason: lexical_alternative
  - marker: b
    text: 本句按上下文理解为修饰“圣物”：这些是以色列人分别为圣、献给雅威的圣物。若按紧邻的“我的圣名”理解，则可指以色列人尊雅威的名为圣。
    reason: textual_ambiguity
lexical_decisions:
- source_word: דַּבֵּר
  choice: 告诉
  rationale: 这是 דבר 的 Piel 祈使式，用于引出上帝吩咐摩西传达的话；现代汉语中“告诉”比直译为“说话”更自然，同时保留命令传达的功能。
- source_word: וְיִנָּזְרוּ
  choice: 要避开
  rationale: נזר 的 Niphal 在这里表示与圣物保持距离或禁戒接触；“避开”简明自然，并由脚注保留“远离、禁戒”的词义幅度。
- source_word: מִקָּדְשֵׁי בְנֵי יִשְׂרָאֵל
  choice: 以色列人所献的圣物
  rationale: קָדְשֵׁי 泛指分别为圣之物，不限于某一种祭物；补出“所献的”表达这些圣物由以色列人奉献的关系，同时不将其过度限定为祭牲。
- source_word: בְנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 这是指以色列民族的惯用表达；译作“以色列人”符合现代标准汉语，也避免“以色列的儿子们”可能造成的字面误解。
- source_word: יְחַלְּלוּ
  choice: 亵渎
  rationale: חלל 的 Piel 在圣洁语境中指使神圣之物受亵慢、被当作俗物；“亵渎”保持庄重的礼仪与神学语域。
- source_word: שֵׁם קָדְשִׁי
  choice: 我的圣名
  rationale: 自然、凝练地表达“我圣洁的名”，并保留上帝之名的盟约意义。
- source_word: אֲשֶׁר הֵם מַקְדִּשִׁים לִי
  choice: 这些圣物是以色列人分别为圣、献给我的
  rationale: 按上下文将关系从句理解为修饰前面的“圣物”；“分别为圣、献给”既保留 קדש 的圣洁词汇联系，也自然表达 לִי 的归属方向。
- source_word: יְהוָה
  choice: 雅威
  rationale: 采用上帝名字的现代汉语音译，而不是以“主”这一称号替代四字神名。
theological_decisions:
- issue: 关系从句 אֲשֶׁר הֵם מַקְדִּשִׁים לִי 的所指
  choice: 理解为以色列人分别为圣、献给雅威的“圣物”
  alternative: 理解为以色列人尊上帝的“圣名”为圣
  rationale: 上下文正在论及以色列人献上的圣物，而“献给我”也更自然地描述圣物；不过，关系从句紧随“我的圣名”之后，形式上也可能与圣名相连，因此在脚注中保留这一较少采用的理解。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。正文以“圣物”“亵渎”“圣名”“分别为圣”等词保留利未记的礼仪与圣洁语域；句法适度显明关系从句的主要所指，并用脚注保存原文可能存在的歧义。
