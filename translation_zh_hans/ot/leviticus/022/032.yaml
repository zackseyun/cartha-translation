source:
  edition: WLC
  text: וְ/לֹ֤א תְחַלְּלוּ֙ אֶת שֵׁ֣ם קָדְשִׁ֔/י וְ/נִ֨קְדַּשְׁתִּ֔י בְּ/ת֖וֹךְ בְּנֵ֣י יִשְׂרָאֵ֑ל אֲנִ֥י יְהוָ֖ה מְקַדִּשְׁ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/032.yaml
  text: And you shall not profane my holy name[a], and I will be sanctified among the sons of Israel. I am Yahweh[b], who sanctifies you.
translation:
  language: zh_hans
  text: 你们不可亵渎我的圣名；我要在以色列人[a]中显为圣[b]。我是使你们成圣的雅威。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语字面为“以色列的众子”，是对以色列民的固定称呼。
    reason: lexical_alternative
  - marker: b
    text: 或译“被尊为圣”或“被视为圣”。
    reason: lexical_alternative
lexical_decisions:
- source_word: תְחַלְּלוּ
  choice: 亵渎
  rationale: 该词为 חלל 的 Piel 形，在此指把圣洁之物当作俗物、损害其神圣性；“亵渎”简洁保留了礼仪和神学语力。
- source_word: שֵׁם קָדְשִׁי
  choice: 我的圣名
  rationale: 自然表达“我圣洁的名”，同时保留“名”与“圣”的核心概念。
- source_word: וְנִקְדַּשְׁתִּי
  choice: 我要被尊为圣
  rationale: Niphal 形式在此可表达被动或显明意义；“被尊为圣”保留他者承认并对待上帝为圣的含义，也与下文“使……成圣”保持词根呼应。
- source_word: בְּתוֹךְ
  choice: 在……中
  rationale: 直接保留处于群体之中的方位和关系含义，且符合现代汉语。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 该固定表达字面为“以色列的众子”，在上下文中指整个以色列群体；“以色列人”在现代汉语中准确、自然。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以常见汉语音译呈现四字神名，而不以称号替代。
- source_word: מְקַדִּשְׁכֶם
  choice: 使你们成圣
  rationale: Piel 分词表示雅威使其百姓成为圣洁者；此译法自然，并保留 קדשׁ 与本节前半句的词汇联系。
theological_decisions:
- issue: וְנִקְדַּשְׁתִּי 的被动、反身或显明语义
  choice: 我要被尊为圣
  alternative: 我要显为圣；人要以我为圣
  rationale: 原文 Niphal 可侧重上帝被承认为圣，也可侧重其圣洁得到显明；正文采用自然的被动表达，脚注保留其他可能。
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文使用上帝的专名；采用“雅威”以音译方式保留专名，不改作普通称号。
- issue: בְּנֵי יִשְׂרָאֵל 的群体指称
  choice: 以色列人
  alternative: 以色列的众子；以色列子民
  rationale: 虽字面为阳性复数“以色列的众子”，该固定称谓在此指整个圣约群体；正文使用现代汉语通行表达，脚注说明其形式。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“亵渎—被尊为圣—使……成圣”保留本节围绕圣洁展开的词义联系；分号呈现两个并列而关系紧密的分句。
