  text: נֶ֚פֶשׁ כִּֽי תִמְעֹ֣ל מַ֔עַל וְ/חָֽטְאָה֙ בִּ/שְׁגָגָ֔ה מִ/קָּדְשֵׁ֖י יְהוָ֑ה וְ/הֵבִיא֩ אֶת אֲשָׁמ֨/וֹ לַֽ/יהוָ֜ה אַ֧יִל תָּמִ֣ים מִן הַ/צֹּ֗אן בְּ/עֶרְכְּ/ךָ֛ כֶּֽסֶף שְׁקָלִ֥ים בְּ/שֶֽׁקֶל הַ/קֹּ֖דֶשׁ לְ/אָשָֽׁם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/015.yaml
  text: 'If a person acts unfaithfully and sins unintentionally in regard to the holy things of Yahweh[a], he shall bring his compensation offering to Yahweh: an unblemished ram from the flock, according to your valuation in silver shekels, by the sanctuary shekel[b], for a guilt offering.'
translation:
  language: zh_hans
  text: “若有人行事不忠，在涉及雅威的圣物的事上无意中犯罪，就要把他的赔偿祭带给雅威：从羊群中带来一只没有残疾的公绵羊，按你所估定的价值，价值为银舍客勒，按圣所的舍客勒[a]，作为赔偿祭[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “圣所的舍客勒”指圣所采用的标准重量；“舍客勒”既是重量单位，也用于衡量银子的价值。
    reason: cultural_note
  - marker: b
    text: “赔偿祭”也可译作“赎愆祭”或“罪责祭”。希伯来语 אָשָׁם 既可指所负的罪责或赔偿责任，也可指为处理这种责任而献的祭。
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶפֶשׁ
  choice: 有人
  rationale: 在律法条文中指一个人；“若有人”符合现代汉语法律条件句，也保留泛指单数。
- source_word: תִמְעֹל מַעַל
  choice: 行事不忠
  rationale: 动词与同根名词连用，强调违背信托或神圣义务；此译法清楚保留其关系性和道德分量。
- source_word: וְחָטְאָה בִשְׁגָגָה
  choice: 无意中犯了罪
  rationale: בִשְׁגָגָה表示出于疏忽、误失而非蓄意悖逆；“无意中”自然且准确。
- source_word: מִקָּדְשֵׁי יְהוָה
  choice: 在雅威的圣物上
  rationale: מִן在此标示犯罪所涉及的领域或对象；“圣物”涵盖归圣的物品、供物或应缴之物，不擅自缩窄范围。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见音译呈现神的专名，区别于作为称号的“主”。
- source_word: אֲשָׁמוֹ / לְאָשָׁם
  choice: 他的赔偿祭／作为赔偿祭
  rationale: אָשָׁם兼有罪责、赔偿责任及处理该责任之祭物的语义；本段涉及圣物损失和估价，“赔偿祭”突出修复与偿还层面，同时以脚注保留“赎愆祭”等传统选择。
- source_word: אַיִל תָּמִים מִן הַצֹּאן
  choice: 从羊群中选一只没有残疾的公绵羊
  rationale: אַיִל明确指公绵羊，תָּמִים在献祭语境指无残疾；补出“选”使汉语流畅而不增加实质内容。
- source_word: בְּעֶרְכְּךָ כֶּסֶף שְׁקָלִים
  choice: 按你所估定的价值……折合若干银舍客勒
  rationale: 保留第二人称单数“你”和估价公式；希伯来文本没有明列具体数目，“若干”反映复数舍客勒而不补定金额。
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: 以圣所的舍客勒
  rationale: 指圣所采用的标准重量；音译“舍客勒”保留古代计量单位。
theological_decisions:
- issue: אָשָׁם的祭名及其罪责—赔偿双重含义
  choice: 赔偿祭
  alternative: 赎愆祭；罪责祭
  rationale: 本节针对侵害雅威圣物的过失，并紧接估价及后文偿还规定，因此修复、赔偿意味突出。但原词也可指罪责本身及处理罪责的祭，故脚注保留传统祭名，避免把语义限定为纯经济赔偿。
- issue: מִקָּדְשֵׁי יְהוָה所指范围
  choice: 雅威的圣物
  alternative: 献给雅威的圣物；雅威神圣之物
  rationale: 原文可涵盖多类归圣物或神圣权益；采用较宽的“圣物”，不把它限定为某一种供物或财产。
- issue: 估价执行者的身份
  choice: 按你所估定的价值
  alternative: 按祭司估定的价值
  rationale: 原文只有第二人称单数“你的估价”，没有在本节明说“祭司”；正文保留语法形式，不把上下文推定直接写入。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“若有人……就要……”符合律法条文语体；“雅威”呈现神的专名；祭名以较易理解的“赔偿祭”为正文，并用脚注保存原词的多义性和传统译法。所有脚注标记均已置于正文相应位置。
