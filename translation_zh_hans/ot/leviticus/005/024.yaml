  to: 或是就任何事起了假誓，他都要如数赔还，并另加五分之一；在他献赎愆祭的日子[a]，要把这笔赔偿交给物主。
  rationale: 修订以“就任何事起了假誓”准确而自然地表达就某事项作虚假誓言；以“如数赔还，并另加五分之一”保留本金加五分之一的赔偿规定；以“这笔赔偿”明确所交付的是原数及附加额。鉴于紧邻的祭祀语境及英语审计轨迹，正文采用“献赎愆祭的日子”，并在脚注中保留“罪责／获罪”读法，避免将有争议的语义当作唯一解释。
