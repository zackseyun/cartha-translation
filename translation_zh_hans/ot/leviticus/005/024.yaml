base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/024.yaml
  text: or anything about which he swore falsely—he shall repay it in full[a], and shall add a fifth to it. He shall give it to the one to whom it belongs on the day of his guilt offering.
translation:
  language: zh_hans
  text: 或是就任何事起了假誓，他都要如数赔还，并另加五分之一；在他献赎愆祭的日子[a]，要把这笔赔偿交给物主。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在他负罪的日子”或“在他获罪的日子”。希伯来词可指罪责，也可在此祭祀语境中指赎愆祭。
    reason: 保留אַשְׁמָתוֹ可指罪责或赎愆祭的语义弹性。
lexical_decisions:
- source_word: א֠וֹ מִכֹּל אֲשֶׁר
  choice: 或是为任何事情
  rationale: 承接上文所列各种违法情形；“任何事情”保留 כֹּל אֲשֶׁר 的广泛范围，并使汉语衔接自然。
- source_word: יִשָּׁבַע עָלָיו לַשֶּׁקֶר
  choice: 起了假誓
  rationale: 该短语指就某事虚假起誓；所涉及的事情已由前文表达，无须在汉语中重复宾语。
- source_word: וְשִׁלַּם אֹתוֹ בְּרֹאשׁוֹ
  choice: 如数赔还
  rationale: 字面为按“本金”偿还，法律语境指足额归还原物或原值；“如数赔还”简洁地传达完整赔偿。
- source_word: וַחֲמִשִׁתָיו יֹסֵף עָלָיו
  choice: 并另外加上五分之一
  rationale: 准确表达在原数额之外再加百分之二十的赔偿要求。
- source_word: לַאֲשֶׁר הוּא לוֹ
  choice: 交给物主
  rationale: 希伯来语意为“交给它所属的人”；“物主”在现代汉语中简明表达合法所有人。
- source_word: בְּיוֹם אַשְׁמָתוֹ
  choice: 在他承担罪责的那天
  rationale: WLC 的元音形式 אַשְׁמָתוֹ 首先表示“他的罪责”；译文保留法律责任的含义，同时以脚注交代祭祀语境中的另一种理解。
- source_word: יִתְּנֶנּוּ
  choice: 要把这一切交给
  rationale: 动词基本义为“给”；此处指向物主交付原数及附加的五分之一。“这一切”自然概括全部赔偿。
theological_decisions:
- issue: בְּיוֹם אַשְׁמָתוֹ 中“罪责”与“赎愆祭”的关系
  choice: 正文译作“在他承担罪责的那天”
  alternative: “在他献赎愆祭的那天”
  rationale: WLC 所标元音的 אַשְׁמָה 直接表示罪责或负罪状态，因此正文不把祭物含义强加于词本身；不过上下文紧接赎愆祭条例，传统上也可能按祭祀语境理解，故在脚注中保留这一解释。
translation_notes:
  register: 采用现代、庄重而清楚的法律性措辞。“如数赔还”“另外加上五分之一”“物主”准确表达赔偿条例；避免古奥的“本数”“负愆”等说法。
