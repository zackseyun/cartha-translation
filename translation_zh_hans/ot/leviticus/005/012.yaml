  text: וֶ/הֱבִיאָ/הּ֮ אֶל הַ/כֹּהֵן֒ וְ/קָמַ֣ץ הַ/כֹּהֵ֣ן מִ֠מֶּ/נָּה מְל֨וֹא קֻמְצ֜/וֹ אֶת אַזְכָּרָתָ/ה֙ וְ/הִקְטִ֣יר הַ/מִּזְבֵּ֔חָ/ה עַ֖ל אִשֵּׁ֣י יְהוָ֑ה חַטָּ֖את הִֽוא־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/012.yaml
  text: Then he shall bring it to the priest[a], and the priest shall take from it a handful as its memorial portion and burn it on the altar, in addition to the food offerings of Yahweh[b]. It is a sin offering.
translation:
  language: zh_hans
  text: 他要把这供物带到祭司那里；祭司要从中取出一把，作为这供物的纪念份，放在祭坛上，在献给耶和华的火祭之上焚烧。这是赎罪祭。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “赎罪祭”也可译作“洁净祭”。这个希伯来语祭名也可强调祭礼借着洁净处理罪及其污秽的作用。
    reason: 保留 חַטָּאת 在祭司文献中可译为“赎罪祭”或“洁净祭”的重要词义与神学张力。
lexical_decisions:
- source_word: וֶהֱבִיאָהּ
  choice: 他要把这供物带到
  rationale: 第三人称阴性单数后缀承接上文作为供物的细面；明说“这供物”比汉语中的孤立代词更清楚，同时不添加新的所指。
- source_word: וְקָמַץ ... מְלֹא קֻמְצוֹ
  choice: 抓取满满一把
  rationale: 这是祭司从素祭中取出一把的礼仪动作；“满满一把”保留字面上的“手所能握满的量”，又符合现代汉语。
- source_word: אֶת אַזְכָּרָתָהּ
  choice: 作为它的纪念份
  rationale: אַזְכָּרָה是献在坛上的特定代表部分；“纪念份”既保留“纪念”的词义，也表明它是整份供物中的一部分。
- source_word: וְהִקְטִיר
  choice: 焚烧
  rationale: 在献祭语境中指把供物放在坛上烧献；“焚烧”庄重、清楚，不必把结果过度解释为“化为烟气”。
- source_word: עַל אִשֵּׁי יְהוָה
  choice: 在献给耶和华的火祭之上
  rationale: 保留עַל较直接的空间关系“在……之上”，并将אִשֶּׁה译作礼仪用语“火祭”，避免把原文未明说的关系解释成“此外”或“连同”。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代简体中文圣经语域中广为人知的神名译法，明确这是专名而非一般称号。
- source_word: חַטָּאת הִוא
  choice: 这是赎罪祭
  rationale: 在祭司法例中，חַטָּאת在此指处理罪的祭物类别；“赎罪祭”是中文读者熟悉且自然的传统名称。
theological_decisions:
- issue: 祭司法例中חַטָּאת的祭名
  choice: 赎罪祭
  alternative: 洁净祭
  rationale: 此处明确是在给祭物分类，常规中文名称“赎罪祭”最易辨认；但该希伯来词也可突出祭礼洁净、除污的功能，因此以脚注保留“洁净祭”，不把其神学功能单一化。
- issue: עַל אִשֵּׁי יְהוָה所表达的关系
  choice: 在献给耶和华的火祭之上
  alternative: 连同献给耶和华的火祭／在献给耶和华的火祭之外
  rationale: 原文介词עַל在这里可能被理解为空间上的“在……之上”，也可能在礼仪安排中表示附加或伴随。正文采用较贴近形式的译法，避免无依据地消除歧义。
translation_notes:
  register: 采用现代、庄重而易懂的祭祀法例语体。“这供物”衔接上文的细面；“纪念份”“火祭”“赎罪祭”为必要的礼仪术语。所有脚注标记均已置于正文。
