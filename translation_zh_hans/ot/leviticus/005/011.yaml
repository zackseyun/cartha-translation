id: LEV.5.11
reference: Leviticus 5:11
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/אִם לֹא֩ תַשִּׂ֨יג יָד֜/וֹ לִ/שְׁתֵּ֣י תֹרִ֗ים אוֹ֮ לִ/שְׁנֵ֣י בְנֵי יוֹנָה֒ וְ/הֵבִ֨יא אֶת קָרְבָּנ֜/וֹ אֲשֶׁ֣ר חָטָ֗א עֲשִׂירִ֧ת הָ/אֵפָ֛ה סֹ֖לֶת לְ/חַטָּ֑את לֹא יָשִׂ֨ים עָלֶ֜י/הָ שֶׁ֗מֶן וְ/לֹא יִתֵּ֤ן עָלֶ֨י/הָ֙ לְבֹנָ֔ה כִּ֥י חַטָּ֖את הִֽיא־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/011.yaml
  text: But if his means are not sufficient for two turtledoves or two young pigeons[a], then he shall bring as his offering for the sin that he has committed a tenth of an ephah of fine flour for a sin offering. He shall put no oil on it and place no frankincense on it, because it is a sin offering.
translation:
  language: zh_hans
  text: “如果他无力献上[a]两只斑鸠或两只雏鸽，他就要为自己所犯的罪带来一伊法的十分之一细面，作为赎罪祭。不可在上面加油，也不可放乳香，因为这是赎罪祭。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “无力献上”原文直译为“手够不到”，是指经济能力不足。
    reason: 保留希伯来语习语的字面意象及其在献祭条例中的实际含义。
lexical_decisions:
- source_word: תַשִּׂיג יָדוֹ
  choice: 他的能力不够献
  rationale: 希伯来语字面为“他的手够不到”，在献祭条例中指经济能力不足。译为“能力不够献”既表达实际含义，也与后面的祭物自然衔接；脚注保留原文意象。
- source_word: תֹרִים
  choice: 斑鸠
  rationale: 该词在献祭语境中特指斑鸠，比泛称“鸽子”更准确。
- source_word: בְנֵי יוֹנָה
  choice: 雏鸽
  rationale: 字面为“鸽子的幼雏”，指幼鸽；“雏鸽”简洁、自然，并与“斑鸠”有清楚区别。
- source_word: קָרְבָּנוֹ
  choice: 供物
  rationale: 该词泛指带到上帝面前献上的东西。本节所献的是细面，不宜狭义译成“牺牲”；“供物”可涵盖这种献物。
- source_word: אֲשֶׁר חָטָא
  choice: 因自己所犯的罪
  rationale: 原文将供物与献祭者所犯的罪相连；此译符合现代汉语句法，同时不具体限定罪的性质。
- source_word: עֲשִׂירִת הָאֵפָה
  choice: 十分之一伊法
  rationale: 保留古代干量单位“伊法”，避免以不确定的现代容量近似值替代原文。
- source_word: סֹלֶת
  choice: 细面
  rationale: 指献祭用的精细面粉；“细面”是简洁、庄重且易懂的礼仪用语。
- source_word: לְחַטָּאת
  choice: 献作赎罪祭
  rationale: 在本节献祭条例中，חַטָּאת 指祭物类别。译为“赎罪祭”明确其礼仪功能，并与本句的“罪”相区别。
- source_word: לֹא יָשִׂים עָלֶיהָ שֶׁמֶן
  choice: 不可在面上加油
  rationale: 直接表达对细面制备方式的禁令；补出“面”使代词所指在汉语中清楚。
- source_word: וְלֹא יִתֵּן עָלֶיהָ לְבֹנָה
  choice: 也不可放乳香
  rationale: לְבֹנָה 是献祭使用的乳香树脂；“放乳香”自然地传达将其置于细面之上的动作。
- source_word: כִּי חַטָּאת הִיא
  choice: 因为这是赎罪祭
  rationale: 原句说明不得加油和乳香的理由，即这供物属于 חַטָּאת 这一祭物类别。
theological_decisions:
- issue: 献祭语境中 חַטָּאת 的含义
  choice: 赎罪祭
  alternative: 罪
  rationale: 该词本可指“罪”或处理罪的祭物，但本节的句法和具体礼仪指示都以所献之物为对象，因此应译作祭物类别“赎罪祭”，不引入超出本节的后期教义解释。
- issue: 贫困条件的希伯来语习语
  choice: 他的能力不够献
  alternative: 他的手够不到；他买不起
  rationale: 原文以“手够不到”表示资源不足。“能力不够献”保留法律条款的庄重语气和经济含义，而脚注呈现字面意象，避免将其过度口语化。
- issue: 细面作为 חַטָּאת 的祭物身份
  choice: 供物……献作赎罪祭
  alternative: 素祭；赎罪祭牲
  rationale: 本节明确容许细面代替鸟类作为贫困者的祭物。称其为“供物”避免误归入通常加油、加乳香的素祭，也避免用“祭牲”暗示动物祭物。
translation_notes:
  register: 采用现代、庄重而易懂的法律礼仪语体。“他”依原文阳性单数作通称，不额外限定仅适用于男性；“伊法”保留古代度量单位。脚注标记[a]置于相关贫困条件之后。
