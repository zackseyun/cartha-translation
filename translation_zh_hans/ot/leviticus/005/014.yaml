  yaml_path: translation/ot/leviticus/005/014.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: zh_hans
  text: 耶和华对摩西说：
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: 说
  rationale: 该形式引出新的叙事性发言事件；在现代汉语中，“对摩西说”是自然、庄重且适合反复出现的神谕引言的表达。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的专名“耶和华”对应四字神名，保留其作为名字而非称号的性质。
- source_word: אֶל
  choice: 对
  rationale: 在“说话”结构中标明言语所指向的对象，现代汉语自然表达为“对”。
- source_word: מֹשֶׁה
  choice: 摩西
  rationale: 采用该希伯来人名通行的现代中文译名。
- source_word: לֵאמֹר
  choice: 说
  rationale: 该不定式是引出下文直接话语的惯用公式；汉语通常将其与前面的动词合并为“对……说”，无需机械重复为“说着”。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。正文采用中文传统且广为人知的专名“耶和华”，既不以“主”这一称号替代，也避免正文中使用对普通读者较陌生的学术拟音；“雅威”可视为另一种拟音。
translation_notes:
  register: 采用自然、简洁而庄重的现代标准汉语。原文的 וַיְדַבֵּר 与 לֵאמֹר 构成固定引语公式，译为“对摩西说：”，用冒号明确其话语内容接续于下一节。
