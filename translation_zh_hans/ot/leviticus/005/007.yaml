  text: וְ/אִם לֹ֨א תַגִּ֣יע יָד/וֹ֮ דֵּ֣י שֶׂה֒ וְ/הֵבִ֨יא אֶת אֲשָׁמ֜/וֹ אֲשֶׁ֣ר חָטָ֗א שְׁתֵּ֥י תֹרִ֛ים אֽוֹ שְׁנֵ֥י בְנֵֽי יוֹנָ֖ה לַֽ/יהוָ֑ה אֶחָ֥ד לְ/חַטָּ֖את וְ/אֶחָ֥ד לְ/עֹלָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/007.yaml
  text: But if his means do not suffice for a sheep[a], then he shall bring as his guilt offering for the sin that he committed two turtledoves or two young pigeons to Yahweh, one for a sin offering and one for a burnt offering.
translation:
  language: zh_hans
  text: 如果他的财力不够献一只羊，就要为自己所犯的罪，把两只斑鸠或两只雏鸽带到耶和华面前，作为他的赎愆祭：一只作赎罪祭[a]，一只作燔祭。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“洁净祭”。希伯来语חַטָּאת既可表示“罪”，在献祭语境中也可指除去不洁或罪的祭物。
    reason: 保留该祭祀术语的重要词义选择及其功能上的歧义。
lexical_decisions:
- source_word: תַגִּיע יָדוֹ דֵּי שֶׂה
  choice: 他的财力不够献一只羊
  rationale: 希伯来语直译为“他的手达不到足够的一只羊”，是表示经济能力不足的习语；“财力不够”自然清楚，又保留原文的经济含义。
- source_word: אֲשָׁמוֹ
  choice: 他的赎愆祭
  rationale: אָשָׁם既可指罪责，也可指因罪责而献的祭物；本节说的是献到耶和华面前的祭物，故采用传统而明确的祭祀用语“赎愆祭”。
- source_word: אֲשֶׁר חָטָא
  choice: 为自己所犯的罪
  rationale: 该关系从句说明祭物所对应的过犯；中文补出“罪”，可自然表达原意。
- source_word: שְׁתֵּי תֹרִים
  choice: 两只斑鸠
  rationale: “斑鸠”是תֹרִים在献祭条例中的常用且易懂的中文名称。
- source_word: שְׁנֵי בְנֵי יוֹנָה
  choice: 两只雏鸽
  rationale: 原文直译为“鸽子的两个儿子”，是指幼鸽；“雏鸽”简洁地传达种类和年龄。
- source_word: לַיהוָה
  choice: 到耶和华面前
  rationale: 介词指祭物被带来献给耶和华；中文用“带到耶和华面前”符合献祭场景，也明确呈现神名。
- source_word: לְחַטָּאת
  choice: 作赎罪祭
  rationale: 在本节祭祀语境中，חַטָּאת指一种祭物；“赎罪祭”是通行译法，同时以脚注保留“洁净祭”这一重要解释。
- source_word: לְעֹלָה
  choice: 作燔祭
  rationale: עֹלָה指全牲焚烧献上的祭；“燔祭”是现代中文圣经语境中确立且简明的名称。
theological_decisions:
- issue: 祭祀术语חַטָּאת的译法
  choice: 赎罪祭
  alternative: 洁净祭
  rationale: 该词既与罪有关，也可强调借祭礼除去不洁。在本节中，它与燔祭并列，明显指祭物类别；正文采用通行的“赎罪祭”，脚注保留“洁净祭”，不消除其功能上的解释张力。
- issue: אָשָׁם在本节中的所指
  choice: 赎愆祭
  alternative: 因罪责而献的祭物
  rationale: 原词可指罪责，也可指因罪责而献上的祭物。本节的动词“带到”及随后列出的鸟类表明这里侧重祭物，但这些鸟中一只实际作赎罪祭、一只作燔祭，因此“赎愆祭”在此可理解为因罪责而带来的整体祭礼，不强行把它与后面的具体祭类等同。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“财力不够”解释希伯来习语但不过度口语化；“赎愆祭、赎罪祭、燔祭”保留利未记中关键祭祀术语的一致性。脚注标记[a]紧随其所说明的“赎罪祭”，避免误指前面的“羊”。
