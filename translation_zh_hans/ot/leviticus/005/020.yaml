  yaml_path: translation/ot/leviticus/005/020.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: zh_hans
  text: 耶和华[a]对摩西说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文为 יהוה（YHWH），是神的专名；也常译作“雅威”，或按传统以“上主”代称。
    reason: 说明神名的原文形式及常见译法。
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: 说
  rationale: 该动词在叙事中引出新的神谕段落；现代汉语用“说”自然庄重，并与后接的直接引语相衔接。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 这是四字神名 יהוה；采用现代中文圣经读者熟悉的专名形式“耶和华”，不以一般称号替代。
- source_word: אֶל־מֹשֶׁה
  choice: 对摩西
  rationale: 介词 אֶל 标明说话的对象；“对摩西”符合现代汉语表达。
- source_word: לֵאמֹר
  choice: 说：
  rationale: 该不定式构成引出后续话语的固定公式。汉语以“说：”合并表达，避免生硬重复，并清楚表明下文是直接引语。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 耶和华
  alternative: 雅威；上主
  rationale: 原文使用神的专名而非称号。正文保留专名性质，采用中文读者广泛熟悉的“耶和华”；脚注说明其希伯来文字形及其他常见译法，不据此加入额外神学解释。
translation_notes:
  register: 采用简洁、庄重的现代标准汉语。以冒号承接下一节的神谕内容；不机械复现希伯来语“讲话……说”的重复公式。
