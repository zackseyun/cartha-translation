source:
  edition: WLC
  text: וְ/אִם נֶ֨פֶשׁ֙ כִּ֣י תֶֽחֱטָ֔א וְ/עָֽשְׂתָ֗ה אַחַת֙ מִ/כָּל מִצְוֺ֣ת יְהוָ֔ה אֲשֶׁ֖ר לֹ֣א תֵעָשֶׂ֑ינָה וְ/לֹֽא יָדַ֥ע וְ/אָשֵׁ֖ם וְ/נָשָׂ֥א עֲוֺנֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/017.yaml
  text: And if a person sins and does any one of all the things that by Yahweh’s commandments must not be done[a], though he did not know it[b], then he is guilty and shall bear his iniquity.
translation:
  language: zh_hans
  text: “如果有人犯罪，做了雅威诫命中任何一件不可做的事，即使自己并不知道，仍有罪责[a]，要担当自己的罪孽[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “有罪责”也可译作“成为有罪”或“招致罪责”；原文所用的词可以表示因过犯而负有罪责。
    reason: lexical_alternative
  - marker: b
    text: “担当自己的罪孽”也可译作“承担自己的罪责”；这个希伯来语惯用语可以指承担过错所带来的责任或后果。
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶפֶשׁ
  choice: 有人
  rationale: 这里指一个人，而非专指非物质的“灵魂”；汉语法律条文用“有人”自然简洁。
- source_word: תֶחֱטָא
  choice: 犯罪
  rationale: חטא 在祭司法律语境中直接表示犯罪、犯了罪。
- source_word: וְעָשְׂתָה אַחַת מִכָּל מִצְוֺת יְהוָה אֲשֶׁר לֹא תֵעָשֶׂינָה
  choice: 做了雅威所吩咐不可做的任何一件事
  rationale: 保留“从一切禁令中犯了其中一件”的分配意义，并以自然现代汉语表达禁令的法律效力。
- source_word: וְלֹא יָדַע
  choice: 即使自己并不知道
  rationale: 语境表明当事人并不知道自己触犯了禁令；“即使”清楚呈现无知并不消除责任这一让步关系。
- source_word: וְאָשֵׁם
  choice: 也有了罪责
  rationale: 此词可指处于有罪状态或因过犯而承担罪责；“有了罪责”兼顾结果与法律责任。
- source_word: וְנָשָׂא עֲוֺנוֹ
  choice: 必须担当自己的罪孽
  rationale: 保留“担当罪孽”这一庄重的希伯来法律和盟约用语，不把它单一化为刑罚或内在罪疚感。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；“雅威”较直接地音译其通常拟定的读音，避免以称号替代专名。
- issue: 无知犯罪与罪责的关系
  choice: 即使自己并不知道，也有了罪责
  alternative: 他不知道，仍算为有罪
  rationale: 原文同时保留行为人的不知情和其罪责，不解释其无知的具体对象，也不消解两者之间的神学张力。
- issue: “担当罪孽”的含义
  choice: 担当自己的罪孽
  alternative: 承担自己的罪责；承受罪的后果
  rationale: 原文惯用语可涵盖罪责及其后果；正文采用较形式对应的表达，脚注说明其语义范围。
translation_notes:
  register: 采用现代、庄重而易懂的法律叙述语体。“自己”避免在汉语中反复使用性别代词，同时仍维持单数个体的指称。脚注标记置于其实际说明的词组之后。
