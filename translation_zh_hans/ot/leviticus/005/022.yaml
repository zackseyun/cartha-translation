  text: אֽוֹ מָצָ֧א אֲבֵדָ֛ה וְ/כִ֥חֶשׁ בָּ֖/הּ וְ/נִשְׁבַּ֣ע עַל שָׁ֑קֶר עַל אַחַ֗ת מִ/כֹּ֛ל אֲשֶׁר יַעֲשֶׂ֥ה הָ/אָדָ֖ם לַ/חֲטֹ֥א בָ/הֵֽנָּה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/022.yaml
  text: or he finds lost property and lies about it and swears falsely—about any one of all the things that a man may do to sin by them—
translation:
  language: zh_hans
  text: 或是找到失物，却对此说谎，并且起假誓——无论人做了哪一件这样的事，因而犯罪——
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מָצָא אֲבֵדָה
  choice: 捡到别人遗失的物品
  rationale: 准确表达“找到失物”，并以“别人”自然点明该物属于失主，而非无主之物。
- source_word: וְכִחֶשׁ בָּהּ
  choice: 却谎称没有
  rationale: כחש 在此指否认、说谎；结合失物语境，译作“谎称没有”比笼统的“对此说谎”更自然，同时不额外断定具体说辞。
- source_word: וְנִשְׁבַּע עַל־שָׁקֶר
  choice: 并且起假誓
  rationale: 保留法律与宗教语境中的宣誓含义；“起假誓”简洁、庄重。
- source_word: הָאָדָם
  choice: 人
  rationale: 此处泛指任何人；现代汉语以“人”表达普遍所指最自然，无须限定男性。
- source_word: לַחֲטֹא בָהֵנָּה
  choice: 因而犯罪
  rationale: בָהֵנָּה 回指前述各类行为；“因而犯罪”自然传达借这些行为陷入罪责的意思。
theological_decisions:
- issue: הָאָדָם 的性别与普遍指称
  choice: 人
  alternative: 男人
  rationale: 该法律条文泛论人可能实施的犯罪，并非特别强调男性身份；“人”既忠实于集合性用法，也符合现代普通话。
- issue: כחש 的具体化程度
  choice: 谎称没有
  alternative: 对此撒谎／否认这事
  rationale: 上下文所指是捡到失物后拒不承认；当前译法清楚呈现行为，却不加入关于占有方式或失主询问过程的额外细节。
translation_notes:
  register: 采用现代、庄重而易懂的法律叙述语体。本节在希伯来文本中承接前文，句末也继续悬接下文，因此保留破折号，不将其改写为独立完整句。
