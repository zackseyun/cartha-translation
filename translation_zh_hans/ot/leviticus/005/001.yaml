id: LEV.5.1
reference: Leviticus 5:1
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/נֶ֣פֶשׁ כִּֽי תֶחֱטָ֗א וְ/שָֽׁמְעָה֙ ק֣וֹל אָלָ֔ה וְ/ה֣וּא עֵ֔ד א֥וֹ רָאָ֖ה א֣וֹ יָדָ֑ע אִם ל֥וֹא יַגִּ֖יד וְ/נָשָׂ֥א עֲוֺנֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/001.yaml
  text: If a person sins[a] because he hears a public adjuration and he is a witness—whether he has seen or otherwise knows—and he does not report it[b], then he shall bear his guilt.
translation:
  language: zh_hans
  text: “如果有人犯罪，听见公开的起誓传唤，而他是证人——无论是看见了，还是以别的方式知道此事——却不陈明，就要担当自己的罪责[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: “担当自己的罪责”也可译作“担当自己的罪孽”；意思是他因隐瞒所知之事而仍须承担罪责。
    reason: 保留 עָוֹן 兼有罪孽、罪责及其后果的语义范围。
lexical_decisions:
- source_word: נֶפֶשׁ
  choice: 有人
  rationale: 在律法案例中指一个人；“有人”符合现代汉语条件句的自然表达，也避免把 נֶפֶשׁ 误解为形而上的“灵魂”。
- source_word: תֶחֱטָא
  choice: 犯罪
  rationale: 保留 חטא 在此处兼具道德与法律责任的含义。
- source_word: וְשָׁמְעָה קוֹל אָלָה
  choice: 听见公开的起誓传唤
  rationale: קוֹל אָלָה 字面为“誓言的声音”，在此法律语境中指以誓言公开传唤知情者作证；正文采用可理解的功能性表达，脚注保留字面形式。
- source_word: וְהוּא עֵד
  choice: 而他是证人
  rationale: 直接保留当事人作为证人的法律身份。
- source_word: אוֹ רָאָה אוֹ יָדָע
  choice: 无论是亲眼看见，还是知道这事
  rationale: 保留两种获得证据的方式：亲见，或以其他方式知情；不把“知道”限制为视觉见证。
- source_word: אִם לֹא יַגִּיד
  choice: 却不把它说出来
  rationale: נגד 的使役形表示使人知道、陈明；此处包含作证之意，但原文没有使用更专门的“作证”动词，因此不宜过度限定。
- source_word: וְנָשָׂא עֲוֺנוֹ
  choice: 就要担当自己的罪责
  rationale: 保留“担当罪孽/罪责”的希伯来法律—神学习语，既包括罪责，也暗含由此承担后果，而不将其窄化为刑罚。
theological_decisions:
- issue: 隐瞒证言所产生的责任
  choice: 译为“担当自己的罪责”
  alternative: 译为“承担惩罚”
  rationale: 原文 עָוֹן 可指罪孽、罪责及其后果；“罪责”保留这种张力，不把经文仅解释为受罚。
- issue: 法律案例中的性别表达
  choice: 以“有人”引入，后文用单数“他”承接
  alternative: 全句改用复数或完全省略代词
  rationale: נֶפֶשׁ 泛指任何人，而后续语法为单数；现代汉语以“有人……他……”可保持个体法律责任，又不把适用范围限定为男性。
- issue: קוֹל אָלָה 的法律语境
  choice: 正文译“公开的起誓传唤”，脚注保留“誓言的声音”
  alternative: 正文直译“听见誓言的声音”
  rationale: 该短语很可能指以誓言要求知情者出面作证；正文传达其法律功能，同时用脚注保存原文意象与一定程度的语义开放性。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。用冒号展开“犯罪”的具体情形，并以“却”清楚呈现知情而不陈明的违责关系；避免生硬直译“灵魂”和过度专门化的现代法庭术语。
