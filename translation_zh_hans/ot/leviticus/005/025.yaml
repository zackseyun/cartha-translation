  text: וְ/אֶת אֲשָׁמ֥/וֹ יָבִ֖יא לַ/יהוָ֑ה אַ֣יִל תָּמִ֧ים מִן הַ/צֹּ֛אן בְּ/עֶרְכְּ/ךָ֥ לְ/אָשָׁ֖ם אֶל הַ/כֹּהֵֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/025.yaml
  text: 'And he shall bring his guilt offering to Yahweh: a flawless ram from the flock[a], according to your valuation, as a guilt offering[b], to the priest.'
translation:
  language: zh_hans
  text: 他要把他的赎愆祭[a]带到雅威面前：从羊群中取一只无瑕疵[b]的公绵羊，照你的估价，作为赎愆祭，交给祭司。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “赎愆祭”所译的希伯来语词既可指罪责或应作的赔偿，也可指为此献上的特定祭物。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“没有残疾”。这里指祭牲没有任何使其不合献祭资格的身体缺陷。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשָׁמוֹ
  choice: 他的赎愆祭
  rationale: אָשָׁם既可指罪责或赔偿，也可指相应的赎愆祭；本句随后明确指定公绵羊为祭牲，因此此处采用自然且与祭祀语境相符的“赎愆祭”，并以脚注保留词义的宽度。
- source_word: יָבִיא
  choice: 要……带到
  rationale: 使役词干未完成式在律法条文中具有规定性；“要……带到”既表达义务，也符合现代汉语。
- source_word: לַיהוָה
  choice: 到雅威面前
  rationale: 介词表示献给或带到雅威那里；“到雅威面前”在中文祭祀语境中自然，并保留神的专名。
- source_word: אַיִל תָּמִים
  choice: 一只没有残疾的公绵羊
  rationale: אַיִל准确指公绵羊；תָּמִים在献祭法规中指祭牲完整、没有身体缺陷。
- source_word: מִן הַצֹּאן
  choice: 从羊群中选
  rationale: צֹאן泛指羊群或小型牲畜，但前面的אַיִל已限定为公绵羊；补出“选”使中文流畅，不改变来源含义。
- source_word: בְּעֶרְכְּךָ
  choice: 照你的估价
  rationale: 保留第二人称单数后缀及法律上的估价含义；语境中的“你”指负责评估的人，通常是祭司。
- source_word: לְאָשָׁם
  choice: 作为赎愆祭
  rationale: 这里明确说明公绵羊的祭祀类别或用途，采用传统且清楚的祭名“赎愆祭”。
- source_word: אֶל הַכֹּהֵן
  choice: 交给祭司
  rationale: 方向介词表示把祭牲带到祭司那里；中文用“交给”清楚表达呈交祭司办理献祭。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；“雅威”以现代汉语常用音译保留其作为立约之神专名的性质。
- issue: אָשָׁם在同一节中两次出现的处理
  choice: 两处均译作“赎愆祭”，首处加注说明其兼有罪责和赔偿的语义
  alternative: 首处译作“赔偿祭”，第二处译作“赎愆祭”
  rationale: 两处都处于明确的祭牲语境，统一译名有助于读者辨认祭祀类别；脚注则保留首处可能带有的罪责与赔偿意味，避免把原词的语义张力抹平。
- issue: תָּמִים在献祭语境中的含义
  choice: 没有残疾
  alternative: 无瑕疵；完全
  rationale: 这里所说的是祭牲在身体上没有使其不合献祭资格的缺陷，而非抽象的道德完美。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“赎愆祭”保留通行的圣经祭祀术语，并借脚注解释普通读者可能不熟悉的含义；句式按中文顺序重组，但保留原文的规定性、第二人称“你的估价”以及两次אָשָׁם之间的呼应。
