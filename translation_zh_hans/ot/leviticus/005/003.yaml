reference: Leviticus 5:3
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: א֣וֹ כִ֤י יִגַּע֙ בְּ/טֻמְאַ֣ת אָדָ֔ם לְ/כֹל֙ טֻמְאָת֔/וֹ אֲשֶׁ֥ר יִטְמָ֖א בָּ֑/הּ וְ/נֶעְלַ֣ם מִמֶּ֔/נּוּ וְ/ה֥וּא יָדַ֖ע וְ/אָשֵֽׁם׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/003.yaml
  text: Or if he touches human uncleanness—any uncleanness by which one becomes unclean—and it is hidden from him, and then he comes to know it, he is guilty.
translation:
  language: zh_hans
  text: 或是有人接触了人的不洁[a]，无论是哪一种会使人沾染不洁的污秽，当时他没有察觉[b]，后来知道了，就有罪责。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“人的污秽”。这里的希伯来语在律法语境中指礼仪上的不洁。
    reason: lexical_alternative
  - marker: b
    text: 直译“这事向他隐藏”，意思是他当时并未察觉。
    reason: lexical_alternative
lexical_decisions:
- source_word: יִגַּע בְּ
  choice: 接触了
  rationale: נגע 与介词 ב 连用表示身体上的接触；“接触”在现代汉语中自然、准确，也适合法律条文的语体。
- source_word: טֻמְאַת אָדָם
  choice: 人的不洁
  rationale: טֻמְאָה 在利未记的语境中指礼仪上的不洁；אָדָם 泛指人，而非特指男性。
- source_word: לְכֹל טֻמְאָתוֹ
  choice: 无论是哪一种……污秽
  rationale: 此短语涵盖来自人的各种不洁状态；译文以概括性表达保留“任何一种”的范围，并避免汉语中重复“不洁”造成的生硬。
- source_word: אֲשֶׁר יִטְמָא בָּהּ
  choice: 会使人沾染不洁的
  rationale: 关系从句说明这种污秽所产生的礼仪后果；“使人沾染不洁”既保留因果关系，也符合汉语表达。
- source_word: וְנֶעְלַם מִמֶּנּוּ
  choice: 当时他没有察觉
  rationale: 希伯来语字面为“这事向他隐藏”；此处指当事人在接触发生时并不知情，以自然汉语表达其认知状态，并在脚注保留字面形式。
- source_word: וְהוּא יָדַע
  choice: 后来知道了
  rationale: 与先前未察觉形成时间上的转折，表示事后得知；“后来”使原文语境中的先后关系清楚。
- source_word: וְאָשֵׁם
  choice: 就有罪责
  rationale: אָשֵׁם 在此法律和献祭语境中表示已经承担罪责或法律责任；“有罪责”比单纯“有罪”更能传达责任含义，同时不把礼仪不洁本身道德化。
theological_decisions:
- issue: טֻמְאָה 的性质
  choice: 译作“不洁”，并以“污秽”避免近距离重复
  alternative: 罪恶；道德败坏；不纯洁
  rationale: 本节论及因接触而产生的礼仪不洁，不宜将该术语直接道德化。“污秽”在从句中仍指同一礼仪类别，不表示一般卫生状况。
- issue: אָדָם 的所指
  choice: 译作泛指的“人”
  alternative: 男人；人类
  rationale: 此处指作为不洁来源的人，并不限定性别；“人”保留泛指意义，也符合中文法律条文的表达。
- issue: וְאָשֵׁם 所表达的责任
  choice: 译作“有罪责”
  alternative: 有罪；成为有罪的；承担罪孽
  rationale: 原文表达因所述情况而产生的罪责或责任，但没有在本节内进一步界定其道德与礼仪层面的关系；“有罪责”保留这一法律—献祭张力。
translation_notes:
  register: 采用现代、庄重而易懂的律法语体。主句以“有人”表达希伯来语法律个案中的泛指主体；破折性说明改用逗号衔接，使中文朗读自然。脚注标记均置于对应词句之后。
