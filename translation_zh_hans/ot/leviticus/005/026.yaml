- from: 祭司要在雅威面前为他赎罪；他无论因做了这些事中的哪一件而负罪，都必蒙赦免。[a]
  to: 祭司要在雅威面前为他赎罪；无论他做了什么使自己负罪的事，他都必蒙赦免。[a]
