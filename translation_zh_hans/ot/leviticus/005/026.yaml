base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/026.yaml
  text: And the priest shall make atonement for him before Yahweh[a], and he will be forgiven for any one of all the things by which one may incur guilt.
translation:
  language: zh_hans
  text: 祭司要在雅威面前为他赎罪；无论他做了什么使自己负罪的事，他都必蒙赦免。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“关于他所做的一切、借此负罪的事中的一件。”
    reason: 原文末句以“所有……中的一件”表达周遍、分指的范围；正文按现代汉语译为“无论……什么……事”。
lexical_decisions:
- source_word: וְכִפֶּר עָלָיו הַכֹּהֵן
  choice: 祭司要为他赎罪
  rationale: כפר 的皮勒式在献祭语境中表示施行赎罪；על 标明赎罪所为之人。此译法自然保留礼仪含义，不限定具体赎罪理论。
- source_word: לִפְנֵי יְהוָה
  choice: 在雅威面前
  rationale: לִפְנֵי 表示在神面前或临在之中；יְהוָה 作为神的专名译作“雅威”。
- source_word: וְנִסְלַח לוֹ
  choice: 都必蒙赦免
  rationale: סלח 的尼法勒式表达罪人得到赦免的结果；“蒙赦免”保留被动意义，也不把经文隐含的施赦者明说出来。
- source_word: עַל אַחַת מִכֹּל אֲשֶׁר יַעֲשֶׂה
  choice: 无论因做了这些事中的哪一件
  rationale: עַל אַחַת מִכֹּל 具有从全部事项中逐一分指的含义；“哪一件”在现代汉语中清楚传达这种周遍、分配意味。
- source_word: לְאַשְׁמָה בָהּ
  choice: 而负罪
  rationale: 此结构表示因该行为成为有罪或承担罪责；这里不是指“赎愆祭”，故译作“负罪”。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；采用“雅威”作为其通行学术音译，以专名形式保留圣约之名。
- issue: 赦免者是否明说
  choice: 保留被动式“蒙赦免”
  alternative: 神必赦免他
  rationale: 原文用被动式而未明说施赦者；译文保留这一表达，既让语境指向神，又不增加原文未明说的主语。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“赎罪”“蒙赦免”“负罪”保留祭祀与法律语境，同时避免古奥句式。分号呈现赎罪与获赦之间的结果关系，但不额外说明其机制。
