  text: וְ/אֶת הַ/שֵּׁנִ֛י יַעֲשֶׂ֥ה עֹלָ֖ה כַּ/מִּשְׁפָּ֑ט וְ/כִפֶּ֨ר עָלָ֧י/ו הַ/כֹּהֵ֛ן מֵ/חַטָּאת֥/וֹ אֲשֶׁר חָטָ֖א וְ/נִסְלַ֥ח לֽ/וֹ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/010.yaml
  text: And he shall prepare the second as a burnt offering according to the ordinance[a], and the priest shall make atonement for him for the sin that he committed[b], and he shall be forgiven.
translation:
  language: zh_hans
  text: 第二只鸟，他要按规定[a]献作燔祭。祭司要因他所犯的罪为他赎罪，他就必蒙赦免[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“按规定的程序。”
    reason: מִשְׁפָּט在这里既可侧重既定规范，也可侧重规定的礼仪程序。
  - marker: b
    text: 希伯来文为被动表达，未明说施行赦免者。
    reason: 说明原文的被动赦免公式，以及正文保留其未明说施事者的特点。
lexical_decisions:
- source_word: הַשֵּׁנִי
  choice: 第二只鸟
  rationale: 序数词回指上文献祭所用的两只鸟；补出“鸟”使现代汉语指代清楚，并未增加新的所指。
- source_word: יַעֲשֶׂה עֹלָה
  choice: 献作燔祭
  rationale: עָשָׂה本义宽泛，在献祭语境中译为“献作”自然准确；“燔祭”是利未记中עֹלָה的通行礼仪术语。
- source_word: כַּמִּשְׁפָּט
  choice: 按规定
  rationale: 此处מִשְׁפָּט指既定的礼仪规范或程序；“按规定”简明庄重，脚注保留程序性译法。
- source_word: וְכִפֶּר עָלָיו
  choice: 为他赎罪
  rationale: 保留祭司礼仪语境中כפר的核心赎罪含义，不把它缩减为洁净，也不引入后期教义上的进一步界定。
- source_word: מֵחַטָּאתוֹ אֲשֶׁר חָטָא
  choice: 因他所犯的罪
  rationale: 自然表达介词מִן在此所标明的相关缘由，并保留原文“罪／犯罪”的语义联系。
- source_word: וְנִסְלַח לוֹ
  choice: 他就必蒙赦免
  rationale: 以自然现代汉语保留被动赦免公式，不明说施行赦免者；“必”表达该礼仪规定所宣告的确定结果。
theological_decisions:
- issue: 祭司赎罪用语是否应作教义性展开
  choice: 为他赎罪
  alternative: 使他洁净；为他取得赦免
  rationale: כפר是祭司文献中的标准献祭术语。“赎罪”既保留礼仪和神学张力，也不把它限定为单纯洁净或解释为祭司直接授予赦免。
- issue: 是否明确指出赦免者是上帝
  choice: 他就必蒙赦免
  alternative: 耶和华就必赦免他；他的罪就必得赦免
  rationale: 希伯来文采用被动公式，将神圣施事者隐含不说；正文沿用这种克制，不擅自补明主语。
translation_notes:
  register: 采用现代、庄重而易懂的礼仪语体。“燔祭”“赎罪”“蒙赦免”与利未记的祭司术语体系一致；句法经过汉语化处理，同时保留原文被动赦免公式中未明说神圣施事者的特点。
