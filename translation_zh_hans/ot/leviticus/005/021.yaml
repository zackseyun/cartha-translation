  text: נֶ֚פֶשׁ כִּ֣י תֶחֱטָ֔א וּ/מָעֲלָ֥ה מַ֖עַל בַּ/יהוָ֑ה וְ/כִחֵ֨שׁ בַּ/עֲמִית֜/וֹ בְּ/פִקָּד֗וֹן אֽוֹ בִ/תְשׂ֤וּמֶת יָד֙ א֣וֹ בְ/גָזֵ֔ל א֖וֹ עָשַׁ֥ק אֶת עֲמִיתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/021.yaml
  text: If a person sins and commits a breach of faith against Yahweh by deceiving his neighbor about a security entrusted to him[a], or a pledge, or through robbery, or if he has oppressed his neighbor,
translation:
  language: zh_hans
  text: 如果有人犯罪，对雅威不忠，在受托保管之物[a]、交到他手中之物[b]或抢夺的事上对同伴行诈，或欺压同伴，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“寄存物”或“交托保管之物”。
    reason: פִּקָּדוֹן指交付他人保管的财物；脚注说明该法律用语，避免误解为现代银行存款。
  - marker: b
    text: 本句也可理解为“担保物”或“放在手中之物”。
    reason: תְּשׂוּמֶת יָד字面为“放置手中”，其具体法律含义有争议，可能涉及交付之物或担保物。
lexical_decisions:
- source_word: נֶפֶשׁ
  choice: 有人
  rationale: 在法律条文中指某个个体；“有人”符合现代汉语条件句的自然表达。
- source_word: כִּי תֶחֱטָא
  choice: 如果……犯罪
  rationale: כִּי与未完成式在此引出案例法的条件从句。
- source_word: וּמָעֲלָה מַעַל בַּיהוָה
  choice: 对雅威不忠
  rationale: 以简洁自然的汉语表达同根词结构所强调的失信，并保留这种行为直接冒犯雅威的垂直维度。
- source_word: וְכִחֵשׁ בַּעֲמִיתוֹ
  choice: 欺骗同伴
  rationale: 动词可指否认、说谎或虚假对待；这里概括财产纠纷中的欺诈行为。עָמִית指共同体中的同伴。
- source_word: בְּפִקָּדוֹן
  choice: 在受托保管的物品上
  rationale: 指交托某人保管的财物；该译法比单独使用“押金”或“存款”更准确。
- source_word: בִתְשׂוּמֶת יָד
  choice: 交到他手里的财物
  rationale: 较贴近“放在手中”的字面构造，同时保留其可能指委托物、担保物或其他经手财物的不确定性。
- source_word: בְגָזֵל
  choice: 抢来的东西
  rationale: 名词既可表示抢夺行为，也可表示抢来的财物；在与两类财物并列的结构中，译作物品较顺畅，同时以脚注保留事件性理解。
- source_word: עָשַׁק אֶת עֲמִיתוֹ
  choice: 欺压同伴
  rationale: 保留该动词涵盖剥削、勒索、克扣等经济压迫行为的宽广语义。
theological_decisions:
- issue: 如何表达对同伴的经济罪行同时是对神的不忠
  choice: 对雅威不忠
  alternative: 在雅威面前犯下不忠之罪
  rationale: 原文明确把针对同伴的欺诈定性为对雅威的背信；译文保留这一张力，不另加解释。
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 采用对希伯来神名的直接音译，与提供的审定咨询文本一致。
translation_notes:
  register: 采用现代、庄重而易懂的法律叙述。经文在本节末仍未完句，因此保留句末逗号，与后续经文衔接。
