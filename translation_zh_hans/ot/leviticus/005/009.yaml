base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/009.yaml
  text: And he shall sprinkle some of the blood of the sin offering on the side of the altar[a], and the rest of the blood shall be drained out at the base of the altar; it is a sin offering.
translation:
  language: zh_hans
  text: 祭司要把赎罪祭的一些血弹在祭坛的侧面[a]，其余的血要挤出，流在祭坛底座处。这是赎罪祭。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节两处“赎罪祭”也可译作“洁净祭”。希伯来语 חַטָּאת 可指为罪所献的祭，也可着重其洁净的功用。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִזָּה
  choice: 要……弹
  rationale: 该词在献祭礼仪中指将血弹洒到指定表面；“弹”能自然、具体地表达祭司施血的动作，又不把它泛化为倾倒。
- source_word: מִדַּם
  choice: 一些血
  rationale: 介词 מִן 在这里具有部分义，表示取祭牲之血的一部分来施用，并非此时使用全部的血。
- source_word: הַחַטָּאת
  choice: 赎罪祭
  rationale: 此处指与罪有关的祭物类别，而非抽象的“罪”。“赎罪祭”是现代中文读者较熟悉的利未记术语；其洁净功能方面的可能含义保留在脚注中。
- source_word: עַל קִיר הַמִּזְבֵּחַ
  choice: 在祭坛的侧面
  rationale: קִיר 字面为“墙壁”，用于祭坛时指其竖直侧面；译作“侧面”比“墙”更符合现代汉语，同时保留具体空间所指。
- source_word: וְהַנִּשְׁאָר בַּדָּם
  choice: 剩下的血
  rationale: 准确表达 Niphal 分词“所剩下的”，中文简洁自然。
- source_word: יִמָּצֶה
  choice: 要挤流
  rationale: 该动词在此表示使余血因挤压而流尽，不只是自由倾倒。“挤流”保留了挤压、排尽的动作特征。
- source_word: אֶל יְסוֹד הַמִּזְבֵּחַ
  choice: 到祭坛脚那里
  rationale: יְסוֹד 指祭坛底部或基部；“祭坛脚”是自然、具体的中文礼仪表达，“那里”也符合方向介词 אֶל。
- source_word: חַטָּאת הוּא
  choice: 这是赎罪祭
  rationale: 该句将此祭明确归类为 חַטָּאת；“这是……”简洁保留希伯来文的判断句结构。
theological_decisions:
- issue: 献祭律例中 חַטָּאת 的译法
  choice: 赎罪祭
  alternative: 洁净祭
  rationale: 该词既可突出祭物与罪的关系，也可突出礼仪洁净的功用。正文采用通行且易懂的“赎罪祭”，但以脚注保留“洁净祭”这一有充分词义依据的译法，避免消除原词的神学张力。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。以“祭司”补明希伯来语动词中承接上文的第三人称施事，使单节朗读自然；“弹”“侧面”“挤流”“祭坛脚”保留礼仪动作的具体性。
