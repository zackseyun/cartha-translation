revisions:
- from: 他要为自己所犯的罪，把他的赎愆祭带给耶和华[a]：从羊群中取一只母羊羔或一只母山羊，作赎罪祭；祭司要为他所犯的罪替他赎罪[b]。
  to: 他要为自己所犯的罪，把他的赎愆祭带到耶和华面前[a]，就是从羊群中带来一只母绵羊或一只母山羊，作赎罪祭；祭司就要为他赎罪，使他脱离所犯的罪[b]。
  rationale: 修订仅处理较安全的词义和汉语表达问题：以“母绵羊”避免将雌羊不必要地限定为幼羊；重组献祭动物的同位说明；并使末句清楚对应祭司为献祭者施行赎罪及“从其罪”这一可能的除罪含义。保留“赎愆祭／赎罪祭”的词汇张力，不将两种术语调和为同一名称。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T04:51:00Z'
review_pass:
  verdict: revise
  source_fidelity: 译文整体正确保留了律法性语气、神名、以及אשם与חטאת在同一节中的术语区别。但“母羊羔”把כִּשְׂבָּה所指的雌性绵羊较明确地限为幼羊，较稳妥的译法是“母绵羊”。末句“为他所犯的罪替他赎罪”在汉语中重复且关系不清；应更清楚地对应“祭司为他施行赎罪／从他的罪而得洁净（或脱离）”的结构，并以脚注保存מן的可能除罪意味。
  naturalness: “把……带给耶和华：从羊群中取……”略显断裂，改为“带到耶和华面前……，就是从羊群中带来……”更符合现代汉语，也更准确显示该母牲畜是所带祭物的具体内容。末句改后可避免“为……替……”的语义重复。
  terminology: “赎愆祭”与“赎罪祭”可保留，恰当反映原文术语并置；“耶和华”也与项目既定神名处理一致。采用“母绵羊”既明确羊的种类及雌性，也避免“母羊羔”在现代汉语中不够自然且可能过度限定年龄。
  issues:
  - severity: medium
    issue: “母羊羔”可能过度限定כִּשְׂבָּה的年龄，且现代汉语搭配不够自然。
    rationale: 该词指雌性绵羊，可在不同词典传统中译作母羊或母羊羔；原文的重点明确在雌性。译作“母绵羊”是较安全、自然的对应，不强加幼龄含义。
  - severity: medium
    issue: “祭司要为他所犯的罪替他赎罪”表达重复且句法关系含混。
    rationale: עָלָיו指为那人施行赎罪，מֵחַטָּאתוֹ可带有“脱离／除去其罪”的意味。改为“祭司就要为他赎罪，使他脱离所犯的罪”可清楚表达，并通过脚注保留该介词的解释空间。
  - severity: low
    issue: “从羊群中取”未直接表明该动物是献到耶和华面前的祭物。
    rationale: 原文将“带来他的赎愆祭”与其具体动物同位说明；“就是从羊群中带来……”能更好地连结两部分。
