id: LEV.5.6
reference: Leviticus 5:6
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/הֵבִ֣יא אֶת אֲשָׁמ֣/וֹ לַ/יהוָ֡ה עַ֣ל חַטָּאת/וֹ֩ אֲשֶׁ֨ר חָטָ֜א נְקֵבָ֨ה מִן הַ/צֹּ֥אן כִּשְׂבָּ֛ה אֽוֹ שְׂעִירַ֥ת עִזִּ֖ים לְ/חַטָּ֑את וְ/כִפֶּ֥ר עָלָ֛י/ו הַ/כֹּהֵ֖ן מֵ/חַטָּאתֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/006.yaml
  text: 'and he shall bring his guilt offering to Yahweh for his sin that he has committed: a female from the flock[a], a lamb or a female goat, for a sin offering[b]; and the priest shall make atonement for him for his sin.'
translation:
  language: zh_hans
  text: 他要为自己所犯的罪，把他的赎愆祭带到耶和华面前[a]，就是从羊群中带来一只母绵羊或一只母山羊，作赎罪祭；祭司就要为他赎罪，使他脱离所犯的罪[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “赎愆祭”也可译作“为罪责所献的祭物”或“补偿祭”。原文使用与罪责、补偿有关的词 אשם；但本节随后又称这牲畜为“赎罪祭”。
    reason: lexical_alternative
  - marker: b
    text: 直译为“从他的罪”；此处的介词可强调赎罪所带来的除罪或脱离罪责的结果。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵבִיא
  choice: 他要……带给
  rationale: 在律法条文中表达规定和义务；现代汉语用“要”自然清楚。
- source_word: אֲשָׁמוֹ
  choice: 他的赎愆祭
  rationale: 保留 אשם 与罪责、补偿相关的祭祀术语，并与本节稍后的“赎罪祭”保持词汇区别，不消解原文张力。
- source_word: לַיהוָה
  choice: 给耶和华
  rationale: 以“耶和华”译出神名 יהוה；与“带”搭配时，“带给”符合自然汉语。
- source_word: עַל חַטָּאתוֹ אֲשֶׁר חָטָא
  choice: 为自己所犯的罪
  rationale: 准确表达献祭的缘由，并以简洁自然的汉语保留“犯罪／罪”的同源含义。
- source_word: נְקֵבָה מִן הַצֹּאן
  choice: 从羊群中取一只母……
  rationale: 明确牲畜为雌性；“羊群”在下文由母羊羔或母山羊具体说明。
- source_word: כִּשְׂבָּה
  choice: 母羊羔
  rationale: 该词指雌性绵羊；译文明确其性别，避免仅用“羊羔”造成信息弱化。
- source_word: אוֹ שְׂעִירַת עִזִּים
  choice: 或一只母山羊
  rationale: 保留原文明确的雌性特征，采用现代通行称呼。
- source_word: לְחַטָּאת
  choice: 作赎罪祭
  rationale: 在祭祀语境中 חטאת 指赎罪祭（亦可理解为洁净祭）；“作”自然表达 לְ 的用途含义。
- source_word: וְכִפֶּר עָלָיו
  choice: 祭司要……替他赎罪
  rationale: 保留 כפר 的祭祀性赎罪含义，不限定其后来的具体神学机制。
- source_word: מֵחַטָּאתוֹ
  choice: 为他所犯的罪
  rationale: 在汉语中与“替他赎罪”顺畅衔接；脚注说明 מן 也可突出从罪中得解脱或罪被除去的意味。
theological_decisions:
- issue: 同一节并用 אשם 与 חטאת 两种祭祀术语
  choice: 分别译作“赎愆祭”和“赎罪祭”
  alternative: 将 אשם 泛译为“为罪责所献的祭物”，或将 חטאת 译作“洁净祭”
  rationale: 原文有意并列两个不同词语。分别翻译可保存其词汇差异和神学张力，不把两者暗中合并。
- issue: 神名 יהוה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: “耶和华”是现代简体中文圣经语境中广为人知的专名形式；正文直接呈现神名，而非以“主”替代。
- issue: כפר 的含义
  choice: 赎罪
  alternative: 施行洁净；成就遮罪
  rationale: “赎罪”是汉语祭祀语境中清楚而庄重的对应，同时不在本节中加入某一种特定赎罪理论。
translation_notes:
  register: 采用现代、庄重而易懂的律法文体。保留“赎愆祭／赎罪祭”的术语区别；避免古奥的“牝”“愆尤”等表达。所有脚注标记均置于正文相关位置。
