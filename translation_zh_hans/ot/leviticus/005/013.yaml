  text: וְ/כִפֶּר֩ עָלָ֨י/ו הַ/כֹּהֵ֜ן עַל חַטָּאת֧/וֹ אֲשֶׁר חָטָ֛א מֵֽ/אַחַ֥ת מֵ/אֵ֖לֶּה וְ/נִסְלַ֣ח ל֑/וֹ וְ/הָיְתָ֥ה לַ/כֹּהֵ֖ן כַּ/מִּנְחָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/013.yaml
  text: Thus the priest shall make atonement for him for his sin that he committed in any one of these matters[a], and he shall be forgiven. And it shall belong to the priest, like the grain offering.
translation:
  language: zh_hans
  text: 祭司要为他在这些事中的一件上所犯的罪赎罪，他就必蒙赦免。这祭物要归给祭司，和素祭一样。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְכִפֶּר עָלָיו
  choice: 要为他赎罪
  rationale: כפר在祭司献祭的语境中指借礼仪施行赎罪；“为他赎罪”既符合利未记的祭祀用语，也自然表达עַל所指的代求对象。
- source_word: הַכֹּהֵן
  choice: 祭司
  rationale: כֹּהֵן在利未记礼仪律例中的标准对应词。
- source_word: עַל חַטָּאתוֹ אֲשֶׁר חָטָא
  choice: 就是……所犯的罪
  rationale: חַטָּאת虽也可指赎罪祭，但后接“他所犯的”表明此处主要指罪过；用“所犯的罪”准确而自然。
- source_word: מֵאַחַת מֵאֵלֶּה
  choice: 在这些事中的任何一件上
  rationale: 保留介词短语的部分关系，并清楚回指上文列举的各种情形。
- source_word: וְנִסְלַח לוֹ
  choice: 他就必蒙赦免
  rationale: 保留Nifal被动语态，不明说赦免者，同时以现代汉语自然表达其结果。
- source_word: וְהָיְתָה לַכֹּהֵן
  choice: 这祭物要归给祭司
  rationale: 阴性动词所指的是所献之物；汉语补出“这祭物”以明确指代，并表达祭司对它的权利。
- source_word: כַּמִּנְחָה
  choice: 和素祭一样
  rationale: מִנְחָה在利未记的祭祀语境中特指谷物祭；“素祭”是简明且通行的中文圣经礼仪术语。
theological_decisions:
- issue: 献祭赦罪公式中的施事者
  choice: 他就必蒙赦免
  alternative: 他的罪就必蒙赦免
  rationale: 希伯来文使用被动式，未明说赦免者。“蒙赦免”保留这种神学上的含蓄，也自然地以犯罪者为受益者。
- issue: חַטָּאת在本节中的含义
  choice: 罪
  alternative: 赎罪祭
  rationale: 紧接的关系从句“他所犯的”更自然地限定罪过，而非祭物，因此不把该词解释为赎罪祭。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。“赎罪”“蒙赦免”“素祭”保留利未记礼仪律例所需的术语一致性；在不增加神学施事者的前提下，使句法适合普通现代读者。
