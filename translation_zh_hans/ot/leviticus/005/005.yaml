source:
  edition: WLC
  text: וְ/הָיָ֥ה כִֽי יֶאְשַׁ֖ם לְ/אַחַ֣ת מֵ/אֵ֑לֶּה וְ/הִ֨תְוַדָּ֔ה אֲשֶׁ֥ר חָטָ֖א עָלֶֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/005.yaml
  text: And it shall be[a], when he becomes guilty in one of these matters[b], that he shall confess what he has sinned in regard to it.
translation:
  language: zh_hans
  text: 他若因这些事中的任何一件而负罪，就要承认自己在那件事上所犯的罪。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “负罪”也可译作“担当罪责”或“成为有罪”。这里的希伯来语着重客观的罪责，并不只指内心意识到自己做错了事。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כִי
  choice: 他若……就
  rationale: 这是律法条文中引出情形及其后果的惯用结构。汉语用“若……就……”自然表达这一法律条件关系，无须生硬保留“事情将是”。
- source_word: יֶאְשַׁם
  choice: 负罪
  rationale: אשם在此强调客观的罪责或法律责任，不仅是当事人内心意识到自己有罪；“负罪”较简洁地保留了这一法律含义。
- source_word: לְאַחַת מֵאֵלֶּה
  choice: 因这些事中的任何一件
  rationale: 该短语回指前文列举的各类案件。“任何一件”符合单数אַחַת在此处的分配意义，“因”表达其与负罪之间的关联。
- source_word: וְהִתְוַדָּה
  choice: 就要承认
  rationale: ידה的Hitpael词形在此表示承认或告认所犯之罪；“要”保留律法规定的义务语气。
- source_word: אֲשֶׁר חָטָא עָלֶיהָ
  choice: 自己在那件事上所犯的罪
  rationale: 此译既以自然汉语说明认罪的内容，又保留阴性单数后缀עָלֶיהָ对前述某一件事的回指。
theological_decisions:
- issue: יֶאְשַׁם是否包含“意识到罪责”的主观含义
  choice: 译为“负罪”，表达客观罪责
  alternative: 译为“发觉自己有罪”或“意识到有罪”
  rationale: 原动词本身主要表示陷入或承担罪责；上下文可能涉及后来获知，但本节不宜把这种心理过程直接加入译文。
- issue: 承认的对象是笼统的罪，还是与前述案件相关的具体罪
  choice: 译明“在那件事上所犯的罪”
  alternative: 仅译“承认自己的罪”
  rationale: עָלֶיהָ明确回指前文所列情形中的一件，保留这一回指可避免抹去原文的具体关联。
translation_notes:
  register: 采用现代、庄重而易懂的律法文体。“他若……就要……”符合现代汉语法规式表达；“负罪”保留法律和礼仪语境中的客观责任含义。脚注标记置于整句末，说明该节最关键的词义张力。
