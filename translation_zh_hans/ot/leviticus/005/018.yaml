  to: 他要把一只从羊群中来的、没有残疾的公绵羊，按你所估定的价值，作为赎愆祭带到祭司那里。祭司要为他无意中所犯、自己却不知道的过错赎罪，他就会蒙赦免。
  rationale: 仅将“牵”改为语义更宽、与原文相称的“带”，并调整前半句语序以使“作为赎愆祭带到祭司那里”的关系明确自然。其余译文及脚注充分保留原文的祭仪术语、第二人称估价表达，以及无意且不知情的双重说明。
