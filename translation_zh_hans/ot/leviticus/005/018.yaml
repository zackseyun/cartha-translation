source:
  edition: WLC
  text: וְ֠/הֵבִיא אַ֣יִל תָּמִ֧ים מִן הַ/צֹּ֛אן בְּ/עֶרְכְּ/ךָ֥ לְ/אָשָׁ֖ם אֶל הַ/כֹּהֵ֑ן וְ/כִפֶּר֩ עָלָ֨י/ו הַ/כֹּהֵ֜ן עַ֣ל שִׁגְגָת֧/וֹ אֲשֶׁר שָׁגָ֛ג וְ/ה֥וּא לֹֽא יָדַ֖ע וְ/נִסְלַ֥ח לֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/018.yaml
  text: He shall bring to the priest a ram without blemish from the flock[a], according to your valuation, for a guilt offering; and the priest shall make atonement for him concerning the error that he committed unintentionally, though he did not know it[b], and he shall be forgiven.
translation:
  language: zh_hans
  text: 他要把一只从羊群中来的、没有残疾的公绵羊，按你所估定的价值，作为赎愆祭带到祭司那里。祭司要为他无意中所犯、自己却不知道的过错赎罪，他就会蒙赦免。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהֵבִיא
  choice: 他要……带到
  rationale: 在律法条文中表达规定性的行动；调整汉语语序，将目的地“祭司那里”置于动词之后，使句子自然。
- source_word: אַיִל תָּמִים
  choice: 一只没有残疾的公绵羊
  rationale: אַיִל指成年公绵羊；תָּמִים在献祭语境中指没有缺陷，译为“没有残疾”清楚而庄重。
- source_word: מִן הַצֹּאן
  choice: 从羊群中
  rationale: צֹאן泛指羊群或小型牲畜；本句已有אַיִל限定为公绵羊，因此“羊群”准确简洁。
- source_word: בְּעֶרְכְּךָ
  choice: 按你所估定的价值
  rationale: 保留第二人称单数“你”和估价程序的含义，不擅自明确估价者的身份。
- source_word: לְאָשָׁם
  choice: 作为赎愆祭
  rationale: אָשָׁם在利未记中是特定祭类；“赎愆祭”是中文圣经语境中较可识别且能区别于赎罪祭的名称。
- source_word: וְכִפֶּר עָלָיו
  choice: 祭司要为他……赎罪
  rationale: כפר在祭司献祭语境中表示施行赎罪；“为他赎罪”自然保留עָלָיו的代求指向。
- source_word: עַל שִׁגְגָתוֹ אֲשֶׁר שָׁגָג
  choice: 为他无意中所犯……的过错
  rationale: 以“过错”对应שִׁגְגָה，并以“无意中所犯”表达同根动词שָׁגַג所强调的非故意性质。
- source_word: וְהוּא לֹא יָדַע
  choice: 自己却不知道
  rationale: 保留当事人不知情的陈述及原文中可能带有的转折张力，不将其扩写为后来才发现。
- source_word: וְנִסְלַח לוֹ
  choice: 他就会蒙赦免
  rationale: 反映סלח的被动结果，并以“蒙赦免”保留未明说施赦者的神圣被动意味。
theological_decisions:
- issue: 祭名אָשָׁם的翻译
  choice: 赎愆祭
  alternative: 补偿祭；赎罪责祭
  rationale: 原词既可涉及罪责或赔补，也在此作为特定献祭类别。正文采用可识别的专名“赎愆祭”，脚注提示其类别性质及可能译法，避免把词义局限为主观罪疚。
- issue: כפר的翻译
  choice: 赎罪
  alternative: 遮罪；施行洁净礼
  rationale: 本节把祭司的献祭行动与蒙赦免相连；“赎罪”既保留神学分量，也不额外规定其机制。
- issue: וְנִסְלַח לוֹ中的隐含施事者
  choice: 他就会蒙赦免
  alternative: 他就会得到赦免；他的罪就会得赦免
  rationale: 原文未明说施赦者。采用“蒙赦免”保留这一神圣被动，也避免额外补出“罪”作为语法主语。
translation_notes:
  register: 采用现代、庄重而易懂的律法文体。以“他要”“祭司要”表达规范性语气；保留“按你所估定的价值”中的第二人称，不擅自解释其指向。祭名使用“赎愆祭”，并借脚注呈现其罪责与补偿层面的词义张力。
