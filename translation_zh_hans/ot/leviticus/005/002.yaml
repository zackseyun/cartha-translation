id: LEV.5.2
reference: Leviticus 5:2
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: א֣וֹ נֶ֗פֶשׁ אֲשֶׁ֣ר תִּגַּע֮ בְּ/כָל דָּבָ֣ר טָמֵא֒ אוֹ֩ בְ/נִבְלַ֨ת חַיָּ֜ה טְמֵאָ֗ה א֤וֹ בְּ/נִבְלַת֙ בְּהֵמָ֣ה טְמֵאָ֔ה א֕וֹ בְּ/נִבְלַ֖ת שֶׁ֣רֶץ טָמֵ֑א וְ/נֶעְלַ֣ם מִמֶּ֔/נּוּ וְ/ה֥וּא טָמֵ֖א וְ/אָשֵֽׁם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/002.yaml
  text: Or if a person touches any unclean thing—whether the carcass of an unclean wild animal[a], or the carcass of unclean livestock, or the carcass of an unclean swarming creature—and it is hidden from him, and he is unclean and becomes guilty[b],
translation:
  language: zh_hans
  text: 若有人接触任何不洁之物——无论是不洁野生动物的尸体，还是不洁牲畜的尸体，或是不洁爬物的尸体——而未察觉[a]，他就不洁，并负有罪责[b]；
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“这事向他隐藏。”即他未察觉这不洁的情形。
    reason: lexical_alternative
  - marker: b
    text: 这里的“罪责”是利未记洁净条例下所负的责任；经文并非说接触尸体本身必然与故意作恶具有同样的道德性质。
    reason: cultural_note
lexical_decisions:
- source_word: נֶפֶשׁ
  choice: 有人
  rationale: 在律法语境中指某个人，而非非物质意义的“灵魂”；“有人”自然地表达泛指个体。
- source_word: תִּגַּע בְּ
  choice: 接触了
  rationale: נגע与介词ב连用表示身体上的接触；“接触”比“摸”更适合庄重的律法语体，也不限定接触方式。
- source_word: כָל דָּבָר טָמֵא
  choice: 任何不洁之物
  rationale: 保留דָּבָר的宽泛范围，并以“不洁”准确表达利未记礼仪洁净范畴。
- source_word: נִבְלַת
  choice: ……的尸体
  rationale: 指动物死尸；现代汉语中“尸体”准确自然，较“尸首”更中性庄重。
- source_word: חַיָּה טְמֵאָה
  choice: 不洁野兽
  rationale: חַיָּה在此与בְּהֵמָה相对，指野生陆生动物；“野兽”简洁保留这种对照。
- source_word: בְּהֵמָה טְמֵאָה
  choice: 不洁牲畜
  rationale: בְּהֵמָה在此指家养四足动物；“牲畜”与“野兽”形成清楚对照。
- source_word: שֶׁרֶץ טָמֵא
  choice: 不洁爬物
  rationale: שֶׁרֶץ是利未记中成群滋生、爬行的小动物类别；“爬物”简洁且保留律法分类色彩，不把范围缩窄为现代生物学的昆虫。
- source_word: וְנֶעְלַם מִמֶּנּוּ
  choice: 却没有察觉
  rationale: 该短语字面为“这事向他隐藏”，实际表示当事人未意识到；正文采用自然汉语，脚注保留字面表达。
- source_word: וְהוּא טָמֵא
  choice: 他已经不洁
  rationale: 陈述接触所形成的礼仪状态；“已经”呈现此时实际处于不洁状态，但不将其解释成道德败坏。
- source_word: וְאָשֵׁם
  choice: 并且负有罪责
  rationale: אָשֵׁם在律法语境中可指处于有罪责、须承担责任的状态；此译法保留法律责任意味，不把它等同于故意作恶。
theological_decisions:
- issue: 不洁的性质
  choice: 将טָמֵא/טְמֵאָה译为“不洁”
  alternative: 污秽；被玷污；有罪
  rationale: 本节涉及接触动物尸体所造成的礼仪不洁，不宜把该状态本身直接等同于道德邪恶。
- issue: אָשֵׁם所表达的责任
  choice: 译为“负有罪责”，并以脚注说明其律法语境
  alternative: 有罪；成为罪人；应受刑罚
  rationale: 原文确实表达罪责或责任，却没有在此详述其与无意、不洁持续时间或后续行为的全部关系；译文保留这种张力，避免把触尸本身说成与故意犯罪完全同类。
- issue: 泛指个体与语法性别
  choice: 以“有人”起句，后用“他”承接
  alternative: 某个灵魂；人若……这人
  rationale: נֶפֶשׁ在此泛指个人；现代汉语用“有人”自然清楚，而“他”可明确承接单数主体，不表示律法只适用于男性。
translation_notes:
  register: 采用现代、庄重而易懂的律法语体。以破折号组织三个并列例项；“不洁”作为利未记礼仪类别的核心术语保持一致。“爬物”略带经书语体，但可避免将שֶׁרֶץ误限于昆虫或现代动物分类。所有脚注标记均已置于正文。
