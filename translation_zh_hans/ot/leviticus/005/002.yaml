    rationale: וְנֶעְלַם מִמֶּנּוּ字面是“这事向他隐藏”，可指相关的不洁情形未被他察觉，不宜限定为只是不知道自己曾接触。
  revised_text: 若有人接触任何不洁之物——无论是不洁野生动物的尸体，还是不洁牲畜的尸体，或是不洁爬物的尸体——而未察觉[a]，他就不洁，并负有罪责[b]；
