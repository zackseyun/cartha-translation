    issue: 条件句开头及句末标点不够准确自然
    rationale: “或者，有人”不是自然的现代汉语律例条件句；本节在希伯来文及段落结构中仍接续后文，宜用“若有人／或是有人”并以分号保留未完结感。
  - severity: low
    issue: “已经不洁”加入了原文未明说的时间强调
    rationale: וְהוּא טָמֵא是“他是不洁的／他成为不洁”的协调陈述；“已经”虽可推知，却不必置入正文。
