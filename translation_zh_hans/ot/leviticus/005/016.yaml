  naturalness: “自己在圣物上所亏欠的”在现代汉语中搭配稍显生硬，且“在……上亏欠”容易误解。改为“自己从圣物中亏欠的数额”更通顺，且与“另加五分之一”这一按数额加成的规定衔接自然。
