  text: וְ/אֵ֣ת אֲשֶׁר֩ חָטָ֨א מִן הַ/קֹּ֜דֶשׁ יְשַׁלֵּ֗ם וְ/אֶת חֲמִֽישִׁת/וֹ֙ יוֹסֵ֣ף עָלָ֔י/ו וְ/נָתַ֥ן אֹת֖/וֹ לַ/כֹּהֵ֑ן וְ/הַ/כֹּהֵ֗ן יְכַפֵּ֥ר עָלָ֛י/ו בְּ/אֵ֥יל הָ/אָשָׁ֖ם וְ/נִסְלַ֥ח לֽ/וֹ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/016.yaml
  text: He shall make restitution for what he sinned against from the holy thing[a], and he shall add a fifth to it and give it to the priest. Then the priest shall make atonement for him with the ram of the guilt offering[b], and he shall be forgiven.
translation:
  language: zh_hans
  text: 他要赔还自己从圣物中亏欠的数额[a]，另加五分之一，交给祭司。祭司要用那作赎愆祭的公绵羊[b]为他赎罪，他就必蒙赦免。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他从圣物中不当扣留的数额。”希伯来文所指的是涉及圣物或神圣份额的过犯，需要为此赔偿。
    reason: lexical_alternative
  - marker: b
    text: 或译：“用那只作赎愆祭的公绵羊”；也可译为“赔偿祭”。
    reason: alternative_reading
lexical_decisions:
- source_word: חָטָא מִן הַקֹּדֶשׁ
  choice: 在圣物上所亏欠的
  rationale: 此结构指涉及分别为圣之物或神圣份额的过犯；结合下文的赔偿，译作“所亏欠的”自然地表达取用或扣留圣物所造成的亏欠，同时不把“圣物”具体化为原文未明说的“圣所”。
- source_word: יְשַׁלֵּם
  choice: 赔偿
  rationale: 在这一法律与献祭语境中，Piel词形表示偿还、补足损失，而非一般性的付款。
- source_word: חֲמִישִׁתוֹ
  choice: 五分之一
  rationale: 准确表达“它的第五部分”；汉语中无需重复所有格，也能清楚指向应赔偿数额。
- source_word: יוֹסֵף עָלָיו
  choice: 另加
  rationale: 该短语表示在本金之外加上附加额；“另加”简洁、自然，并保留附加的法律含义。
- source_word: לַכֹּהֵן
  choice: 交给祭司
  rationale: 介词标明祭司是赔偿款的接受者；“交给”符合现代汉语表达。
- source_word: יְכַפֵּר עָלָיו
  choice: 为他赎罪
  rationale: 这是献祭语境中כפר的通行且易懂的对应语，表达祭司为犯罪者施行赎罪礼。
- source_word: בְּאֵיל הָאָשָׁם
  choice: 用那作赎愆祭的公绵羊
  rationale: 保留公绵羊作为施行赎罪所用祭牲的工具关系；“赎愆祭”兼顾אָשָׁם所含的罪责与补偿意味。
- source_word: וְנִסְלַח לוֹ
  choice: 他就必蒙赦免
  rationale: Niphal形式表示他得到赦免；“蒙赦免”自然保留被动含义，而不擅自补出施行赦免者。
theological_decisions:
- issue: 献祭术语אָשָׁם的译法
  choice: 赎愆祭
  alternative: 赎罪责祭；赔偿祭
  rationale: 该词兼有罪责与赔偿的意味。“赎愆祭”是中文圣经传统中较易识别的专门术语，而本节的“赔偿”已清楚呈现其补偿层面。
- issue: 赦免的施行者是否明说
  choice: 采用被动式“蒙赦免”，不补出主语
  alternative: 上帝就必赦免他
  rationale: 希伯来文采用被动表达，没有在本句明说施行赦免者；译文保留这种表达，避免增添原文未明示的成分。
translation_notes:
  register: 采用现代、庄重而通顺的法律—祭祀语体。“赔偿”“另加五分之一”清楚传达补偿规定；保留“祭司”“赎罪”“蒙赦免”等普通读者可理解的圣经核心用语。脚注标记均已置入正文。
