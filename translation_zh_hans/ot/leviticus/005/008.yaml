base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/008.yaml
  text: And he shall bring them to the priest[a], and he shall present first the one for the sin offering, and he shall pinch off its head from the front of its neck[c][b], but he shall not sever it.
translation:
  language: zh_hans
  text: 他要把这两只鸟带到祭司那里；祭司要先献上作赎罪祭[a]的那一只，从颈项处拧断它的头[b]，却不可把头完全拧下来[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “赎罪祭”也可译作“洁净祭”；希伯来语חַטָּאת在利未记的献祭条例中兼有处理罪与洁净的含义。
    reason: lexical_alternative
  - marker: b
    text: “拧断”所译的希伯来语，是祭司处理鸟祭头颈的专门用语；具体动作难以完全确定。
    reason: lexical_alternative
  - marker: c
    text: 意思是不可使鸟头与身体完全分离。
    reason: cultural_note
lexical_decisions:
- source_word: וְהֵבִיא אֹתָם אֶל הַכֹּהֵן
  choice: 他要把这两只鸟带到祭司那里
  rationale: אֹתָם指上文的两只鸟，译出“两只鸟”可使中文指代清楚；法律条文中的未完成式译为“要”。
- source_word: וְהִקְרִיב
  choice: 祭司要……献上
  rationale: 使役式קרב在献祭语境中指把祭物呈献、献上。根据后续动作及祭礼流程，主语自然转为祭司；中文明示主语以免歧义。
- source_word: אֶת אֲשֶׁר לַחַטָּאת רִאשׁוֹנָה
  choice: 先献上作赎罪祭的那一只
  rationale: 保留רִאשׁוֹנָה的先后次序，并以“那一只”表达从两只鸟中选定供赎罪祭的一只。
- source_word: חַטָּאת
  choice: 赎罪祭
  rationale: 这是现代中文圣经及祭祀语境中较通行、易懂的名称；其更具体的洁净祭含义以脚注保留。
- source_word: וּמָלַק
  choice: 掐破
  rationale: מלק是处理鸟祭头颈的专门动作；结合“不可分离”的限制，译作“掐破”比“掐断”更能避免暗示头已完全脱离。
- source_word: מִמּוּל עָרְפּוֹ
  choice: 从颈项处
  rationale: 该短语所指的具体部位有解释困难；采用不武断指定颈前或颈后的自然表达，保留原文的不确定性。
- source_word: וְלֹא יַבְדִּיל
  choice: 却不可把头完全掐断
  rationale: בדל意为分开、分离；在此指不可使鸟头与身体彻底分离。补出“完全”清楚传达仪式限制。
