base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/019.yaml
  text: It is a guilt offering[a]; he has indeed incurred guilt against Yahweh.
translation:
  language: zh_hans
  text: 这是赎愆祭[a]；他确实得罪了耶和华。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“这是赎愆祭；他在耶和华面前确实有罪。”希伯来文连续使用 אשם 这一词根，兼有“赎愆祭”和“有罪、负罪责”的含义，以此加强语气。
    reason: 保留介词短语的译法差异，并说明原文同根词反复所形成的强调与文字呼应。
lexical_decisions:
- source_word: אָשָׁם
  choice: 赎愆祭
  rationale: 在本段献祭语境中，该名词指为所负罪责而献的特定祭物。“赎愆祭”是简体中文圣经用语中通行且能与上下文相衔接的译法。
- source_word: הוּא
  choice: 这是
  rationale: 代词在此作判断句的主语，确认所述祭物的性质；译作“这是”符合现代汉语表达。
- source_word: אָשֹׁם אָשַׁם
  choice: 确实得罪了
  rationale: 同一词根的不定式绝对形与限定动词连用，强化有罪或负罪的事实。“确实”体现强调，“得罪了”自然表达其对耶和华所负的罪责。
- source_word: לַיהוָה
  choice: 得罪了耶和华
  rationale: 介词 ל־与 אשם 连用，可表示相对于耶和华而有罪或负有罪责。将其并入“得罪了耶和华”，简洁呈现这种关系，同时在脚注保留“在……面前有罪”的可能表达。
- source_word: יהוה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的专名译法，明确呈现希伯来文本中的神名。
theological_decisions:
- issue: לַיהוָה 与 אשם 的关系
  choice: 将末句理解为此人确实得罪了耶和华
  alternative: 此人在耶和华面前确实有罪；或祭物是献给耶和华的赎愆祭
  rationale: 句法上 לַיהוָה 最自然地与动词 אָשַׁם 相连，说明罪责与耶和华相关；但介词的关系可有不同措辞，因此在脚注中保留较少指明方向性的译法。
- issue: אָשָׁם 的祭祀含义与一般“罪责”含义
  choice: 在首句译为“赎愆祭”
  alternative: 这是罪责
  rationale: 利未记5章的献祭法规支持祭名含义；同时，后半句以同根动词解释献祭缘由，形成“赎愆祭—得罪”的词根呼应。
translation_notes:
  register: 采用庄重、简明的现代标准汉语。“赎愆祭”为既有祭祀术语；“确实得罪了”既传达原文的强调，也避免生硬复制希伯来语重复结构。
