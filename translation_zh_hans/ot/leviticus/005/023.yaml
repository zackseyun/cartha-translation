base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/023.yaml
  text: And it shall be[a], when he sins and becomes guilty, that he shall restore what he took by robbery, or what he extorted, or the deposit that was entrusted to him, or the lost thing that he found[c][b],
translation:
  language: zh_hans
  text: 他若犯罪而负有罪责[a]，就要归还他所抢夺的，或所勒索的[b]，或别人托付给他的财物，或他捡到的失物[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“当他犯罪而负有罪责时”。原文的律法案例格式可译作“当……时”或“如果／若……”；“负有罪责”也可译作“担负罪责”。
    reason: lexical_alternative
  - marker: b
    text: “所勒索的”也可译作“借欺压所得的”或“所骗取的”。原词可指以压迫、欺诈等方式侵占他人的财物。
    reason: lexical_alternative
  - marker: c
    text: 也可译作“他发现的遗失财物”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: 既……就……
  rationale: 这是引入律法案例及其后果的希伯来语格式；汉语用“既……就……”自然表达事情成立后应履行的义务，同时把“当/若”的形式差异留在脚注中。
- source_word: יֶחֱטָא וְאָשֵׁם
  choice: 犯了罪，担了罪责
  rationale: 保留“犯罪”与“负有罪责”两个相连但不完全相同的概念；“担了罪责”侧重客观有罪和责任，不限定为主观意识到罪。
- source_word: וְהֵשִׁיב
  choice: 就要归还
  rationale: 在财产赔偿的法律语境中表示必须交还原物；“要”体现规范性要求，且适合本节所列具体财物。
- source_word: הַגְּזֵלָה אֲשֶׁר גָּזָל
  choice: 他所抢夺的
  rationale: 希伯来语同源名词与动词强调非法夺取；“所抢夺的”在现代汉语中简洁自然，并保留较强的侵夺意味。
- source_word: הָעֹשֶׁק אֲשֶׁר עָשָׁק
  choice: 所勒索的
  rationale: 该词组可指借压迫、欺诈或强势扣取他人财物；“勒索”适合财产语境，但其较宽范围以脚注说明。
- source_word: הַפִּקָּדוֹן אֲשֶׁר הָפְקַד אִתּוֹ
  choice: 别人托付给他的财物
  rationale: 明确指交由此人保管的财物；此译比单说“存放物”更符合普通现代汉语。
- source_word: הָאֲבֵדָה אֲשֶׁר מָצָא
  choice: 他捡到的失物
  rationale: 直接表达所发现的遗失财物，保持法律清单的简洁性。
theological_decisions:
- issue: וְאָשֵׁם 表示客观归罪还是主观知罪
  choice: 担了罪责
  alternative: 意识到自己有罪
  rationale: 该动词在此可关乎有罪和承担责任；译文不把它收窄为内在心理上的觉察，以免消除原文张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。以“既……就要……”呈现律法案例及义务；各项用平行结构排列。所有脚注标记均置于其所说明的词句之后。
