  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: א֣וֹ נֶ֡פֶשׁ כִּ֣י תִשָּׁבַע֩ לְ/בַטֵּ֨א בִ/שְׂפָתַ֜יִם לְ/הָרַ֣ע א֣וֹ לְ/הֵיטִ֗יב לְ֠/כֹל אֲשֶׁ֨ר יְבַטֵּ֧א הָ/אָדָ֛ם בִּ/שְׁבֻעָ֖ה וְ/נֶעְלַ֣ם מִמֶּ֑/נּוּ וְ/הוּא יָדַ֥ע וְ/אָשֵׁ֖ם לְ/אַחַ֥ת מֵ/אֵֽלֶּה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/004.yaml
  text: Or if a person swears rashly with his lips to do evil or to do good—whatever a man may utter in an oath—and it is hidden from him[a], and then he comes to know it and becomes guilty in one of these matters[b],
translation:
  language: zh_hans
  text: 或有人轻率地亲口起誓[a]，说要行恶或行善——无论人在誓言中说出什么话——这事却没有被他察觉[b]；后来他发觉了，就在这些事中的一件上有了罪责，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “轻率地亲口起誓”：原文也可较直译为“用嘴唇说出”；这个词本身着重实际说出口，语境则可能含有轻率、未经慎思的意味。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“这事向他隐藏”。原文没有明说他未察觉的是誓言本身、誓言的后果，还是已经违背誓言这件事。
    reason: ambiguity
lexical_decisions:
- source_word: נֶפֶשׁ
  choice: 人
  rationale: 在利未记的法律条文中，此词指一个人或个体，并非特指非物质的“灵魂”。
- source_word: תִשָּׁבַע
  choice: 起誓
  rationale: 该词在此表示立誓、发誓；“起誓”自然简洁，也与后文的“誓言”呼应。
- source_word: לְבַטֵּא בִשְׂפָתַיִם
  choice: 冒失地亲口起誓
  rationale: ביטא 的基本含义是用言语说出；结合此处涉及罪责的语境，“冒失地”表达未经慎思便出口立誓的意味，“亲口”保留“用嘴唇”的具体表达。脚注保留其较中性的词义可能。
- source_word: לְהָרַע אוֹ לְהֵיטִיב
  choice: 要行恶或行善
  rationale: 保留原文“恶／善”的宽泛两极表达，不将其缩窄为某一种具体的伤害或帮助。
- source_word: לְכֹל אֲשֶׁר יְבַטֵּא הָאָדָם בִּשְׁבֻעָה
  choice: 无论人在誓言中说出什么话
  rationale: 此语概括各种誓言内容。האדם 在这里是泛指人类个体，现代汉语用“人”既准确又不暗示只适用于男性。
- source_word: וְנֶעְלַם מִמֶּנּוּ
  choice: 这事自己却没有察觉
  rationale: 以自然汉语表达原文“向他隐藏”的被动观念，同时保留对象未被明确限定的含混性。
- source_word: וְהוּא יָדַע
  choice: 后来他发觉了
  rationale: “后来”体现先未察觉、继而知道的时间推进。
- source_word: וְאָשֵׁם
  choice: 有了罪责
  rationale: 该动词表示处于有罪、负有罪责的状态；“有了罪责”符合本段法律语体。
- source_word: לְאַחַת מֵאֵלֶּה
  choice: 在其中一件事上
  rationale: 指向本段此前列举的各种情形，保留原文的回指功能。
theological_decisions:
- issue: 未察觉的对象
  choice: 以“这事自己却没有察觉”保留概括表达
  alternative: “他忘记了所起的誓”或“他没有察觉自己违背了誓言”
  rationale: 原文没有明确说明隐藏或未被察觉的究竟是誓言本身、誓言的后果，还是已经发生的违背；译文不替原文消除这种含混。
- issue: 泛指人的表达
  choice: 将 האדם 译为“人”
  alternative: “男人”
  rationale: 这里是法律条文中的代表性单数，适用于任何人。现代汉语“人”直接对应这种泛指功能，无须引入男性限定。
translation_notes:
  register: 采用现代、庄重而易懂的法律条文语体。“亲口”“罪责”等词保留原文的身体性表达和司法色彩；破折号呈现原句插入性的概括说明，句末逗号表明本节语法上接续下一节。
