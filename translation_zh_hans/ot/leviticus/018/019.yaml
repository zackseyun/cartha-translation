  text: וְ/אֶל אִשָּׁ֖ה בְּ/נִדַּ֣ת טֻמְאָתָ֑/הּ לֹ֣א תִקְרַ֔ב לְ/גַלּ֖וֹת עֶרְוָתָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/019.yaml
  text: You shall not approach a woman during her menstrual uncleanness to uncover her nakedness[a].
translation:
  language: zh_hans
  text: 不可亲近在月经不洁期间的妇人，而与她发生性关系[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文作“揭露她的赤身”，是指发生性关系的委婉说法。这里的“不洁”是礼仪洁净用语。
    reason: 说明希伯来语“揭露赤身”的固定委婉表达，并澄清“月经不洁”属于礼仪性范畴。
lexical_decisions:
- source_word: וְ/אֶל אִשָּׁה
  choice: 女人……她
  rationale: אִשָּׁה在这里是不定指的“女人”，并非明确指“妻子”；中文先提出“女人”，再以“她”承接，表达自然。
- source_word: בְּ/נִדַּת טֻמְאָתָהּ
  choice: 在月经不洁期间
  rationale: נִדָּה指与月经有关的状态，טֻמְאָה是《利未记》的礼仪洁净范畴；“月经不洁期间”既通顺，又保留原文的礼仪性用语。
- source_word: לֹא תִקְרַב
  choice: 不可亲近她
  rationale: קָרַב与אֶל构成“走近、亲近”的表达；在本章性禁令的语境中带有为发生性关系而亲近的含义，但正文仍保留其委婉表达。
- source_word: לְ/גַלּוֹת עֶרְוָתָהּ
  choice: 与她性交
  rationale: 直译为“露她的下体”，是本章指性关系的固定委婉语。现代中文若机械直译容易被理解为仅仅使身体裸露，因此正文传达其语境义，并以脚注保留原文措辞。
theological_decisions:
- issue: “不洁”应理解为礼仪性范畴，还是纯粹的卫生或医疗状况
  choice: 保留“月经不洁”这一礼仪洁净用语
  alternative: 月经期间
  rationale: טֻמְאָה在《利未记》中属于礼仪洁净语言；保留“不洁”可避免把经文改写成纯粹的生理或卫生陈述，也不额外赋予道德判断。
- issue: 是否将“露她的下体”明确译为性交
  choice: 正文译为“与她性交”，脚注说明原文的委婉说法
  alternative: 露她的下体
  rationale: 上下文表明该固定表达指性关系；明确译出可避免现代读者误解，同时脚注保存原文意象与措辞。
translation_notes:
  register: 采用现代、庄重而易懂的律法语体。“不可”保持禁令的正式语气；“月经不洁”保留《利未记》的礼仪洁净范畴，不把它改写为医学或道德评语。
