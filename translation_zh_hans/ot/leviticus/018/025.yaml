  text: וַ/תִּטְמָ֣א הָ/אָ֔רֶץ וָ/אֶפְקֹ֥ד עֲוֺנָ֖/הּ עָלֶ֑י/הָ וַ/תָּקִ֥א הָ/אָ֖רֶץ אֶת יֹשְׁבֶֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/025.yaml
  text: So the land became unclean[a], and I punished its iniquity upon it[c][b], and the land vomited out its inhabitants.
translation:
  language: zh_hans
  text: 于是，那地被玷污了[a]；我就向那地追究它的罪孽[b]，那地便把其中的居民吐了出去[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“变得不洁了”。希伯来语动词在这里既可表达进入不洁状态，也可表达“被玷污”。
    reason: lexical_alternative
  - marker: b
    text: 直译近于“我把它的罪孽追究在它身上”；这是指追究罪责、施行审判的说法。
    reason: lexical_alternative
  - marker: c
    text: 也可译“呕吐出去”。希伯来语保留了呕吐的强烈图像，以描写那地因受玷污而排斥其中的居民。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּטְמָא
  choice: 被玷污了
  rationale: טמא在此表示那地因上下文所说的可憎之事而陷入不洁状态。“被玷污了”自然、庄重，并保留其被污染的结果含义。
- source_word: הָאָרֶץ
  choice: 那地
  rationale: אֶרֶץ可指“地”或“大地”；本章语境特指以色列人将要进入的迦南地，因此译作“那地”。
- source_word: וָאֶפְקֹד
  choice: 我就追讨
  rationale: פקד与עון连用时表示察究罪责并施行审判。“追讨”既传达审判含义，也保留该词“查究、使之承担后果”的意象，避免把具体惩罚方式说死。
- source_word: עֲוֺנָהּ
  choice: 那地的罪孽
  rationale: עון可涵盖罪孽、罪责及其后果。“罪孽”保留其道德分量；原文以阴性单数代词回指“地”，汉语重复“那地”更清楚。
- source_word: עָלֶיהָ
  choice: （包含在“追讨那地的罪孽”中）
  rationale: על与פקד עון构成习语，表示向某对象追究罪责。若逐字译为“在它身上”会使现代汉语生硬，因此将其关系融入“追讨”一语，并在脚注说明。
- source_word: וַתָּקִא
  choice: 吐了出去
  rationale: קיא本义为“呕吐”。译文保留土地将居民吐出的强烈拟人化图像，而不弱化为一般的“驱逐”。
- source_word: יֹשְׁבֶיהָ
  choice: 其中的居民
  rationale: ישב的分词形式指居住在那地的人。“其中的居民”简洁自然，并清楚表明居民与土地的关系。
theological_decisions:
- issue: 土地因罪恶而受玷污的表达
  choice: 保留“那地被玷污了”，让土地本身成为受污染的对象。
  alternative: 那地变得不洁了
  rationale: 原文把居民的可憎行为、土地的污秽和随后的审判连在一起；译文不把这种污秽仅解释为礼仪性或仅解释为道德性。
- issue: וָאֶפְקֹד עֲוֺנָהּ עָלֶיהָ中的神圣审判
  choice: 译为“我就追讨那地的罪孽”。
  alternative: 我就惩罚那地的罪孽／我就向那地追究罪责
  rationale: “追讨”明确保留上帝主动施行审判，同时也承认עון可指罪孽、罪责或相应后果，不把其语义范围过度缩窄。
- issue: 土地吐出居民的拟人化图像
  choice: 保留“那地便把其中的居民吐了出去”。
  alternative: 那地便驱逐其中的居民
  rationale: 原文有意使用呕吐的强烈图像，表现土地因玷污而排斥其居民；保留这一比喻可维持罪、污秽、审判与逐离之间的联系。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“罪孽”“追讨”保留经文的审判语域，但句法按现代汉语调整；“吐了出去”有意保留原文鲜明而令人不适的拟人化意象。所有脚注标记均置于所解释的词句之后。
