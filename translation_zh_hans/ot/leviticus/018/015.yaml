  yaml_path: translation/ot/leviticus/018/015.yaml
  text: You shall not uncover the nakedness of your daughter-in-law[a]; she is your son's wife; you shall not uncover her nakedness.
translation:
  language: zh_hans
  text: 不可露你儿媳的下体[a]；她是你儿子的妻子，不可露她的下体。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“露……的下体”；这是《利未记》中反复使用的法律委婉语，指被禁止的性关系。
    reason: 说明原文固定委婉语的字面意象及其语境含义。
lexical_decisions:
- source_word: עֶרְוַת
  choice: ……的下体
  rationale: עֶרְוָה可指赤身、羞处或私处；在“露……的下体”这一固定法律委婉语中，译作“下体”既保留身体性意象，也能让现代读者识别其关于禁忌性关系的语境。
- source_word: כַּלָּתְךָ
  choice: 你儿媳
  rationale: 该词带第二人称阳性单数后缀，直接指受话者的儿媳；“儿媳”是现代普通话中自然明确的亲属称谓。
- source_word: תְגַלֵּה / תְגַלֶּה
  choice: 不可露
  rationale: גלה的Piel形式与עֶרְוָה构成本章反复出现的禁令公式。“不可露”保留原文简洁的法律语气及委婉表达，不直接释写为“不可与……发生性关系”。
- source_word: אֵשֶׁת בִּנְךָ
  choice: 你儿子的妻子
  rationale: 按原文保留解释性的同位陈述，说明前述女子与受话者之子的婚姻关系。
- source_word: הִוא
  choice: 她是
  rationale: 独立代词承接前述“儿媳”，带有确认、说明作用；“她是”在汉语中自然表达这一功能。
- source_word: עֶרְוָתָהּ
  choice: 她的下体
  rationale: 照原文重复关键词和禁令句式，维持本章法律条文的反复节奏与互文一致性。
theological_decisions:
- issue: 如何处理“露下体”这一性禁令中的固定委婉语
  choice: 保留“不可露……的下体”的委婉表达，并用脚注说明其含义。
  alternative: 直接译为“不可与……发生性关系”。
  rationale: 原文在利未记18章反复使用稳定的法律委婉语。保留其身体意象和重复格式，可避免把原文的表达方式完全解释化，同时脚注保障现代读者能理解这里所禁止的是性关系。
translation_notes:
  register: 采用现代、简明而庄重的法律禁令语体。“儿媳”取代较旧的“儿妇”；保留两次“不可露……的下体”，以呈现希伯来文刻意的重复。
