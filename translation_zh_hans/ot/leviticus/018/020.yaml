  text: You shall not have sexual relations[a] with your neighbor’s wife and so defile yourself with her.
translation:
  language: zh_hans
  text: 不可与邻舍的妻子发生性关系[a]，以致使自己因她而成为污秽。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译：“不可将你的精液给你邻舍的妻子作种子。”
    reason: 保留原文以“给……作种子”表达性行为的委婉说法及其生殖意象，供读者核查。
lexical_decisions:
- source_word: אֵשֶׁת עֲמִיתְךָ
  choice: 邻舍的妻子
  rationale: עָמִית在此法律语境中指共同体中的同伴；“邻舍的妻子”自然、明确，也符合本段对他人妻子的称呼。
- source_word: לֹא תִתֵּן שְׁכָבְתְּךָ לְזָרַע
  choice: 不可……发生性关系
  rationale: 这一肖像化表达字面涉及将交合所得作为种子给予，实际指性交；正文传达其法律含义，脚注保留希伯来语的具体意象。
- source_word: לְטָמְאָה בָהּ
  choice: 因她玷污自己
  rationale: לְטָמְאָה表示使自己陷入污秽；בָהּ可表达与她相关或以她为媒介。此译保留污秽用语，并自然呈现性交所导致的结果。
theological_decisions:
- issue: 禁令的性质及污秽语言
  choice: 禁止与邻舍的妻子性交，并指出这会使受命者玷污自己。
  alternative: 在正文中直译精液／种子的意象，或明确译作礼仪上的不洁。
  rationale: 希伯来语习语清楚指向性交，而末句明确使用污秽词汇。译作“玷污”既不把概念局限为礼仪不洁，也不排除本章语境中的宗教与道德内涵。
translation_notes:
  register: 采用现代、庄重而易懂的法律禁令语体。“发生性关系”清楚但不过分粗俗；“不可”与利未记律法语境相称。
