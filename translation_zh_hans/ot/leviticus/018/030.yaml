id: LEV.18.30
reference: Leviticus 18:30
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וּ/שְׁמַרְתֶּ֣ם אֶת מִשְׁמַרְתִּ֗/י לְ/בִלְתִּ֨י עֲשׂ֜וֹת מֵ/חֻקּ֤וֹת הַ/תּֽוֹעֵבֹת֙ אֲשֶׁ֣ר נַעֲשׂ֣וּ לִ/פְנֵי/כֶ֔ם וְ/לֹ֥א תִֽטַּמְּא֖וּ בָּ/הֶ֑ם אֲנִ֖י יְהוָ֥ה אֱלֹהֵי/כֶֽם־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/030.yaml
  text: So you shall keep my charge[a], so as not to practice any of the abominable statutes that were practiced before you, and you shall not make yourselves unclean by them. I am Yahweh your God.
translation:
  language: zh_hans
  text: 因此，你们要谨守我所吩咐的，不可实行在你们之前所实行的任何可憎习俗[a]，也不可因这些习俗玷污自己。我是雅威——你们的上帝。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “可憎习俗”也可译作“可憎的规例”或“可憎的惯例”。原文所用的词可指规定下来的做法或社会习俗，不一定只指正式法规。
    reason: 保留 חֻקּוֹת 的词义范围及其与 תּוֹעֵבֹת 的结合方式。
lexical_decisions:
- source_word: וּשְׁמַרְתֶּם אֶת־מִשְׁמַרְתִּי
  choice: 你们要谨守我所吩咐的
  rationale: 同根词 שׁמר／מִשְׁמֶרֶת 构成“守我的守令”一类表达，指忠实履行上帝交托的责任；“谨守我所吩咐的”在现代汉语中自然，同时保留郑重的命令语气。
- source_word: לְבִלְתִּי עֲשׂוֹת
  choice: 不可效法
  rationale: 该结构表示否定目的或防止某种行为。结合后面的既有习俗，译作“不可效法”比机械的“不可做”更清楚地表达不要沿袭前人的做法。
- source_word: מֵחֻקּוֹת הַתּוֹעֵבֹת
  choice: 那些……可憎习俗
  rationale: חֻקּוֹת 可指规例，也可指固定、通行的习俗；此处是前人实行的可憎行为模式，译作“习俗”较合语境。“可憎”保留 תּוֹעֵבֹת 强烈的道德及礼仪评价。
- source_word: אֲשֶׁר נַעֲשׂוּ לִפְנֵיכֶם
  choice: 在你们以前盛行的
  rationale: 被动式直译为“在你们以前被实行的”；“盛行”自然表达这些是先前居民通行的做法，而“在你们以前”保留时间意义。
- source_word: וְלֹא תִטַּמְּאוּ בָּהֶם
  choice: 免得因这些事玷污自己
  rationale: 动词具有反身意义，בָּהֶם 表示致污的媒介或原因；“因这些事玷污自己”同时保留反身和工具意义，并与前面的防止性命令顺畅衔接。
- source_word: אֲנִי יְהוָה אֱלֹהֵיכֶם
  choice: 我是雅威—你们的上帝
  rationale: 直接音译圣名 יְהוָה 为“雅威”；破折号使汉语中的身份宣告清楚有力，并保留原文盟约性自我宣告的结构。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文明确使用四字神名。译作“雅威”直接呈现其专名性质，避免以称号替代；不据此增添任何宗派性解释。
- issue: תּוֹעֵבֹת 的道德与礼仪力度
  choice: 可憎
  alternative: 令人厌恶；可恶
  rationale: “可憎”保留原词强烈的否定评价，也不额外限定这些行为究竟只是礼仪禁忌还是纯粹道德罪行，从而保存上下文中的双重张力。
- issue: חֻקּוֹת 在此处是法规还是习俗
  choice: 正文译“习俗”，脚注保留“规例／惯例”的可能
  alternative: 可憎的规例
  rationale: 上下文侧重先前居民反复实行的行为，故“习俗”更符合语境；但原词也可指固定规例，因此用脚注保留其词义范围。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“谨守”“可憎”“玷污”保留律法文本的郑重感；句法经适度调整，以“不可……免得……”自然呈现原文的预防目的。
