  text: וּ/מִֽ/זַּרְעֲ/ךָ֥ לֹא תִתֵּ֖ן לְ/הַעֲבִ֣יר לַ/מֹּ֑לֶךְ וְ/לֹ֧א תְחַלֵּ֛ל אֶת שֵׁ֥ם אֱלֹהֶ֖י/ךָ אֲנִ֥י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/021.yaml
  text: And you shall not give any of your offspring to make them pass over to Molech, and you shall not profane the name of your God. I am Yahweh.
translation:
  language: zh_hans
  text: 不可把你的任何后代交给摩洛，使他们经过[a]；也不可亵渎你上帝的名。我是耶和华。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“使他们经过，归给摩洛”。这指与摩洛有关的一种仪式；许多人理解为献儿童为祭，其他经文常将这种做法描述为使儿女“经火”。但本节原文没有明确提到火。
    reason: alternative_reading
lexical_decisions:
- source_word: וּמִזַּרְעֲךָ
  choice: 你的任何后代
  rationale: זֶרַע本义为“种子”，此处指人的后裔；“后代”保留其范围，并以“任何”体现介词מִן的部分含义。
- source_word: תִתֵּן
  choice: 不可……交出去
  rationale: נתן通常意为“给、交出”；在禁令语境中译为“不可交出去”，既自然又保留将后代交付于某种仪式的含义。
- source_word: לְהַעֲבִיר
  choice: 使其归给
  rationale: 这是עבר的使役式不定词，直译为“使之经过”。此处与לַמֹּלֶךְ连用，其确切仪式方式有争议；正文采用较自然而不过度具体化的表达，脚注保留字面措辞及可能的祭仪背景。
- source_word: לַמֹּלֶךְ
  choice: 归给摩洛
  rationale: 马所拉读音传统支持将מֹּלֶךְ视为专名；采用现代中文圣经语境中可辨识的音译“摩洛”。
- source_word: תְחַלֵּל
  choice: 亵渎
  rationale: חלל的Piel词干常指使神圣之物成为俗物，即“亵渎”；与“上帝的名”搭配自然且庄重。
- source_word: שֵׁם אֱלֹהֶיךָ
  choice: 你上帝的名
  rationale: 保留“名”的盟约与神学分量，同时使用简洁自然的现代汉语所有格结构。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代简体中文读者最熟悉的专名“耶和华”译出四字神名，而不以“主”这一称号替代。
theological_decisions:
- issue: 献给摩洛之禁令的具体性质
  choice: 正文不明确加入“火祭”或“献为祭物”，并以脚注说明原文直译及通常理解。
  alternative: 译为“不可把儿女焚烧献给摩洛”或“不可使儿女经火归给摩洛”。
  rationale: 本节原文只有“交出……使之经过，归给摩洛”，没有明确出现“火”；其他经文及历史背景虽支持儿童献祭或经火仪式的理解，却不宜无标记地加入正文。
- issue: זֶרַע在本法令中的所指
  choice: 后代
  alternative: 儿女；种子
  rationale: “后代”既符合该词在此处指人的后裔，也避免把范围限定于特定年龄，同时比字面的“种子”更符合现代汉语。
- issue: “使之经过”这一希伯来习语的中文呈现
  choice: 正文译为“使其归给”，脚注保留“使其经过”的字面形式。
  alternative: 正文直译为“使其经过，归给摩洛”。
  rationale: 逐字译法在现代汉语中语义残缺，容易被误解为空间移动；正文需可理解，但脚注保留原文的含混及其祭仪关联。
translation_notes:
  register: 采用现代、庄重而易懂的律法语体。“不可”体现明确禁令；分号呈现两个并列禁令，末句简洁保留神圣宣告。
