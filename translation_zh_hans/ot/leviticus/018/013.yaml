base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/013.yaml
  text: You shall not uncover the nakedness of your mother's sister[b][a], for she is your mother's close relative.
translation:
  language: zh_hans
  text: 不可揭露你母亲的姐妹的下体[a]，因为她是你母亲的近亲[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或较意译为：“不可与你母亲的姐妹发生性关系。”希伯来文直译为“不可揭露你母亲的姐妹的下体”。
    reason: lexical_alternative
  - marker: b
    text: “近亲”所译的希伯来语 שְׁאֵר 是亲属用语，指血肉相连的亲族。
    reason: cultural_note
lexical_decisions:
- source_word: עֶרְוַת ... לֹא תְגַלֵּה
  choice: 不可揭露……的下体
  rationale: 保留希伯来语“揭露下体”这一贯穿利未记18章的法律委婉语，同时用现代汉语中可理解而庄重的表达呈现；其整体语义指被禁止的性关系。
- source_word: אֲחוֹת אִמְּךָ
  choice: 你母亲的姐妹
  rationale: 直接呈现原文的亲属关系，不改写成范围可能较宽的“姨母”。希伯来语单数形式不要求汉语在“姐姐/妹妹”之间作原文未作的区分。
- source_word: שְׁאֵר אִמְּךָ
  choice: 你母亲的近亲
  rationale: שְׁאֵר在亲属律例中表示血肉相连的近亲；“近亲”自然清楚，并避免把原文进一步限定为现代法律意义上的特定亲属类别。
- source_word: כִּי
  choice: 因为
  rationale: 明确引出禁令的理由，符合现代汉语的法律说明语气。
- source_word: הִוא
  choice: 她是
  rationale: 按原文保留女性单数主语，指你母亲的姐妹。
theological_decisions:
- issue: 如何呈现乱伦禁令中的法律委婉语
  choice: 正文保留“揭露……的下体”
  alternative: 译为“与……发生性关系”
  rationale: 原文反复使用固定委婉语，保留它可维持本章的文学一致性与法律语体；脚注说明其实际含义，以免现代读者误解为仅仅看见裸体。
translation_notes:
  register: 采用现代、庄重且可理解的法律语体。“不可”体现禁令；保留原文委婉语，并用脚注解释。正文脚注标记按相关词语依次排列。
