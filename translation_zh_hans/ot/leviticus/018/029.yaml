  naturalness: 原句“凡行这一切可憎之事中任何一件的人”中“这一切”与“任何一件”并置略显拗口，且“行……中任何一件”搭配不够顺畅。改为“凡做了这些可憎之事中任何一件的人”更符合现代庄重汉语，同时不损失原文的部分性与总体范围。
  terminology: “可憎之事”适合翻译 תּוֹעֵבוֹת；“被剪除”应予保留，不应在正文中擅译为死刑或逐出群体。“本民”是与原文“他们的民”相称的简洁法律—群体用语。
