revisions:
- from: 因为，凡行这一切可憎之事中任何一件的人，都必从自己的民中被剪除[a]。
  to: 因为凡做了这些可憎之事中任何一件的人，都必从本民中被剪除[a]。
  rationale: 仅作汉语句法与措辞润色：以“做了这些可憎之事中任何一件”替换较生硬的“行这一切可憎之事中任何一件”。修订仍保留 כִּי 的说明性“因为”、מִכֹּל 的“……中任何一件”、תּוֹעֵבוֹת 的价值判断，以及“被剪除”这一不应被具体化的法律术语。
