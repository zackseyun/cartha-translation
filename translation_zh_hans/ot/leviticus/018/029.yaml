source:
  edition: WLC
  text: כִּ֚י כָּל אֲשֶׁ֣ר יַעֲשֶׂ֔ה מִ/כֹּ֥ל הַ/תּוֹעֵב֖וֹת הָ/אֵ֑לֶּה וְ/נִכְרְת֛וּ הַ/נְּפָשׁ֥וֹת הָ/עֹשֹׂ֖ת מִ/קֶּ֥רֶב עַמָּֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/029.yaml
  text: For whoever does any of all these abominations[a], the persons who do them shall be cut off from among their people.
translation:
  language: zh_hans
  text: 因为凡做了这些可憎之事中任何一件的人，都必从本民中被剪除[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“被处死”，或“被逐出群体”。希伯来文直译为“被剪除”，没有明确说明审判的具体方式。
    reason: 保留惩罚公式在原文中的语义开放性，并列出主要可能解释。
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，为这些禁令及其后果作解释；“因为”自然保留其因由、说明作用。
- source_word: כָּל אֲשֶׁר
  choice: 凡……的人
  rationale: 表达不定而周全的关系范围，即“每一个这样做的人”，符合现代汉语法律性表述。
- source_word: יַעֲשֶׂה
  choice: 行
  rationale: 对应基本义“做、行”，在此道德与律法语境中，“行”庄重自然，又不额外限定为某种专门罪名。
- source_word: מִכֹּל הַתּוֹעֵבוֹת הָאֵלֶּה
  choice: 这一切可憎之事中任何一件
  rationale: 既保留 מִן 的部分关系，也保留 כֹּל 的总体范围；“可憎之事”传达 תּוֹעֵבוֹת 在圣洁律例语境中的强烈道德与礼仪评价。
- source_word: וְנִכְרְתוּ
  choice: 都必……被剪除
  rationale: 保留 כרת 被动式在盟约和律法语境中的传统意象，不擅自断定具体执行方式；“必”体现法律后果的确定性。
- source_word: הַנְּפָשׁוֹת הָעֹשֹׂת
  choice: 行……的人
  rationale: נֶפֶשׁ 在此指具体的人，而非与身体相对的“灵魂”；汉语用关系结构避免生硬重复，同时涵盖原文复数所指的所有犯者。
- source_word: מִקֶּרֶב עַמָּם
  choice: 从自己的民中
  rationale: 保留“从其人民中间”的群体性、盟约性表达；“自己的民”在现代汉语中清楚指向犯者所属的群体。
theological_decisions:
- issue: וְנִכְרְתוּ ... מִקֶּרֶב עַמָּם 所指惩罚的具体方式
  choice: 必从自己的民中被剪除
  alternative: 被处死；或被逐出群体
  rationale: 希伯来文采用“剪除”的法律—盟约惯用语，本节本身没有明确说明这是上帝直接施行的死亡、由人执行的死刑，还是逐出群体。正文保留该意象，并以脚注呈现主要解释，避免消除原文的张力。
translation_notes:
  register: 采用现代、庄重而易懂的律法文体。“可憎之事”保留原文的强烈评价；“被剪除”保留盟约法律术语的意象，并借脚注说明其未明确的执行方式。
