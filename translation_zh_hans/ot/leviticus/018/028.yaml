  to: 免得你们玷污这地时，这地把你们吐出去[a]，像它吐出先前的那一国民一样。
  rationale: 仅作安全的汉语措辞调整：将“在你们以前的那一国”改为“先前的那一国民”，使集合性的“国/族群”在现代汉语中更明确、自然。其余译文和脚注忠实保留原文的土地拟人化及强烈的“吐出”意象。
