  naturalness: “在你们以前的那一国”虽可理解，但现代汉语较生硬，且“国”容易主要指地域或政体。改为“先前在你们之前的那一国民”仍略显重复；采用“先前的那一国民”更自然，并在本节上下文中清楚指以色列人之前的族群。
