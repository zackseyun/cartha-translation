  yaml_path: translation/ot/leviticus/018/028.yaml
  text: so that the land will not vomit you out when you defile it[a], as it vomited out the nation that was before you.
translation:
  language: zh_hans
  text: 免得你们玷污这地时，这地把你们吐出去[a]，像它吐出先前的那一国民一样。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文采用生动的“呕吐”意象，描写这地因受玷污而把居民排斥、驱逐出去。
    reason: lexical_alternative
lexical_decisions:
- source_word: תָקִיא / קָאָה
  choice: 吐出去 / 吐出
  rationale: 原文以“呕吐”为喻，生动描写土地因受玷污而排斥其居民。“吐出去”在现代汉语中既自然，也保留了这一强烈意象及驱逐含义。
- source_word: הָאָרֶץ
  choice: 这地
  rationale: 上下文特指迦南地，而非整个大地；“这地”符合本段明确的地域指向。
- source_word: בְּטַמַּאֲכֶם אֹתָהּ
  choice: 你们玷污这地时
  rationale: 介词 בְּ 加不定词结构可表达时间或伴随情形；译作“……时”符合警告语境，同时保留 טמא 的使役含义，即使土地成为不洁。
- source_word: הַגּוֹי
  choice: 那一国
  rationale: גּוֹי 为单数集合名词，指先前居住在当地的族群；“那一国”保留单数形式，也不加入原文没有明说的后期宗教含义。
- source_word: אֲשֶׁר לִפְנֵיכֶם
  choice: 在你们以前的
  rationale: 此处表示在以色列人之前已经居住于当地，采用时间意义的表达简洁而准确。
- source_word: וְלֹא
  choice: 免得
  rationale: 字面为“而不”，在前文禁令和警告之后具有否定目的或警戒意味；“免得”在现代汉语中自然地传达这种语篇功能。
theological_decisions:
- issue: 土地作为施行驱逐的拟人化主体
  choice: 保留“这地把你们吐出去”的拟人表达
  alternative: 抽象地译成上帝借土地把居民赶出去
  rationale: 希伯来文明确以土地为主语，并用“吐出”描绘土地对玷污的反应。保留这一意象，可呈现《利未记》中污秽玷污土地并导致居民被逐的神学张力，同时不额外解释上帝如何施行审判。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“吐出去”保留原文刻意强烈的身体意象；重复“这地”以避免代词所指含混，并凸显土地被拟人化为行动主体。
