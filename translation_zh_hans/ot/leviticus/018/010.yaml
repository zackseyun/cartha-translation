  text: עֶרְוַ֤ת בַּת בִּנְ/ךָ֙ א֣וֹ בַֽת בִּתְּ/ךָ֔ לֹ֥א תְגַלֶּ֖ה עֶרְוָתָ֑/ן כִּ֥י עֶרְוָתְ/ךָ֖ הֵֽנָּה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/010.yaml
  text: You shall not uncover the nakedness of your son's daughter or of your daughter's daughter[b][a], for their nakedness is your own.
translation:
  language: zh_hans
  text: 无论是你儿子的女儿，还是你女儿的女儿，你都不可露她们的下体[a]，因为她们就是你的下体[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “露……的下体”是希伯来语的委婉说法，指与对方发生性关系。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“因为她们就是你的下体”。这句话把这些近亲后代视为与本人相连，说明与她们发生性关系为何受禁。
    reason: cultural_note
lexical_decisions:
- source_word: עֶרְוַת / עֶרְוָתָן / עֶרְוָתְךָ
  choice: 下体
  rationale: עֶרְוָה可指赤身、羞处或生殖部位；在利未记18章的固定法律用语גלה ערוה中，“露……的下体”既保留原文反复出现的委婉表达，也能让现代汉语读者理解其性禁令含义。末句同样保留“你的下体”，以呈现原文刻意而突兀的亲属认同表达。
- source_word: בַּת בִּנְךָ
  choice: 你儿子的女儿
  rationale: 贴近希伯来语亲属称谓，明确指出经由儿子一系的孙女，并与下句形成对称。
- source_word: בַת בִּתְּךָ
  choice: 你女儿的女儿
  rationale: 贴近原文，明确指出经由女儿一系的外孙女；不笼统合并为“孙女”，从而保留法律条文的双系范围。
- source_word: לֹא תְגַלֶּה
  choice: 你都不可露
  rationale: 保留גלה ערוה的法律公式及本章内部一致性；“都”配合“无论……还是……”自然表达两个对象均受禁令约束。
- source_word: כִּי
  choice: 因为
  rationale: 清楚表达原文的因果关系。
- source_word: הֵנָּה
  choice: 她们就是
  rationale: 阴性复数代词回指两类孙女；“就是”保留原文直接断言的力度，不将其解释性改写为“如同”或“属于”。
theological_decisions:
- issue: 末句“כִּי עֶרְוָתְךָ הֵנָּה”的含义
  choice: 因为她们就是你的下体
  alternative: 因为她们的下体就是你自己的下体；因为她们是你的骨肉
  rationale: 原文直译为“因为她们是你的下体”，以亲属身份的延伸说明乱伦禁令。正文保留这一不寻常的表达，避免把“下体”改写成“骨肉”而消除原文的意象与张力；脚注提供必要说明。
translation_notes:
  register: 采用现代、庄重的法律语体。“你儿子的女儿／你女儿的女儿”虽比“孙女／外孙女”稍长，却准确保留父系与母系的对称结构。“露……的下体”承接本章反复出现的希伯来语法律公式；末句有意保留原文的陌生感，并由脚注释义。
