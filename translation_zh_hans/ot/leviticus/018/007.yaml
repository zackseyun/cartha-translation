  text: עֶרְוַ֥ת אָבִ֛י/ךָ וְ/עֶרְוַ֥ת אִמְּ/ךָ֖ לֹ֣א תְגַלֵּ֑ה אִמְּ/ךָ֣ הִ֔וא לֹ֥א תְגַלֶּ֖ה עֶרְוָתָֽ/הּ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/007.yaml
  text: You shall not uncover the nakedness of your father[a], that is, the nakedness of your mother. She is your mother; you shall not uncover her nakedness.
translation:
  language: zh_hans
  text: 不可露你父亲的下体，也就是你母亲的下体。[a]她是你的母亲；不可露她的下体。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或较直译：“不可露你父亲的下体和你母亲的下体。”本节随后以“她是你的母亲”作出说明。
    reason: 保留希伯来语连接词可能表达并列的读法，以及正文所采用的解释性读法之间的真实歧义。
  - marker: b
    text: “露下体”是本章用于指发生性关系的委婉说法。
    reason: 帮助现代读者理解希伯来语固定法律用语，同时不在正文中将其完全释义化。
lexical_decisions:
- source_word: עֶרְוַת / עֶרְוָתָהּ
  choice: ……的下体
  rationale: עֶרְוָה在本章的法律禁令中与“揭露”构成固定的委婉表达。“下体”既保留身体意象和委婉性质，也比直译为“赤身”更能传达此处涉及性关系的含义。
- source_word: תְגַלֵּה / תְגַלֶּה
  choice: 不可揭露
  rationale: 保留גלה（揭开、显露）的重复用语及法律禁令语气，不直接改写为“不可发生性关系”，以免抹去原文的意象。
- source_word: עֶרְוַת אָבִיךָ
  choice: 你父亲的下体
  rationale: 按原文保留亲属关系和所有格表达；下文说明这与母亲的下体相关。
- source_word: וְעֶרְוַת אִמְּךָ
  choice: 也就是你母亲的下体
  rationale: 结合后句“她是你的母亲”，将וְ理解为具有解释作用的连接；同时用脚注保留其通常可译为“和”的可能性。
- source_word: אִמְּךָ הִוא
  choice: 她是你的母亲
  rationale: 保留阴性单数代词所带出的强调和法律上的明确指认。
theological_decisions:
- issue: “你父亲的下体”和“你母亲的下体”之间的关系
  choice: 正文采用解释性关系：“也就是你母亲的下体”。
  alternative: 按连接词的常见意义译为“你父亲的下体和你母亲的下体”。
  rationale: 后续分句“她是你的母亲”支持第二短语是在说明第一短语的具体所指，即侵犯母亲也构成揭露父亲的下体；但希伯来语וְ本身通常表示并列，因此在脚注中保留较直译的读法。
- issue: “揭露下体”的法律含义
  choice: 正文保留委婉表达“揭露……的下体”。
  alternative: 明说为“与……发生性关系”。
  rationale: 该搭配在利未记18章指被禁止的性关系，但保留原有委婉语可呈现本章反复出现的法律措辞和身体意象；脚注说明其语用含义。
translation_notes:
  register: 采用庄重而易懂的现代法律禁令语气。“不可”简洁明确；“揭露……的下体”保留原文反复出现的委婉表达。正文不使用古奥的“露……下体”句式，以“揭露”使现代读者更容易理解其动作意象。
