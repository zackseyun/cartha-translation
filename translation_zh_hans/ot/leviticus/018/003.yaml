id: LEV.18.3
reference: Leviticus 18:3
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כְּ/מַעֲשֵׂ֧ה אֶֽרֶץ מִצְרַ֛יִם אֲשֶׁ֥ר יְשַׁבְתֶּם בָּ֖/הּ לֹ֣א תַעֲשׂ֑וּ וּ/כְ/מַעֲשֵׂ֣ה אֶֽרֶץ כְּנַ֡עַן אֲשֶׁ֣ר אֲנִי֩ מֵבִ֨יא אֶתְ/כֶ֥ם שָׁ֨מָּ/ה֙ לֹ֣א תַעֲשׂ֔וּ וּ/בְ/חֻקֹּתֵי/הֶ֖ם לֹ֥א תֵלֵֽכוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/003.yaml
  text: You shall not do as they do in the land of Egypt[a], where you lived, and you shall not do as they do in the land of Canaan, where I am bringing you[b]. You shall not walk in their statutes.
translation:
  language: zh_hans
  text: 你们不可照你们曾住过的埃及地的做法行事，也不可照我正领你们进入的迦南地的做法行事；不可遵行他们的规条。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “遵行他们的规条”直译为“行走在他们的规条中”；“规条”也可译作“习俗”或“律例”。
    reason: 保留הלך的行为隐喻及חֻקּוֹת的词义范围。
lexical_decisions:
- source_word: כְּמַעֲשֵׂה
  choice: 照……地的做法行
  rationale: מַעֲשֶׂה可指行为、作为或惯常做法；配合比较介词כְּ和禁令，译为“照……的做法行”既保留原文把做法归于“地”的表达，又符合现代汉语。
- source_word: אֶרֶץ מִצְרַיִם / אֶרֶץ כְּנַעַן
  choice: 埃及地／迦南地
  rationale: 保留原文两处“地”，突出以色列人从先前居住之地迁往目的地的地理对照。
- source_word: אֲשֶׁר יְשַׁבְתֶּם בָּהּ
  choice: 你们曾住在那里
  rationale: 完成式指向以色列人在埃及的既往居住经历；“曾住”自然清楚。
- source_word: לֹא תַעֲשׂוּ
  choice: 不可……行
  rationale: 否定未完成式在律法语境中表达持续有效的禁令；“不可”符合庄重而通俗的现代汉语律法文体。
- source_word: אֲשֶׁר אֲנִי מֵבִיא אֶתְכֶם שָׁמָּה
  choice: 我正领你们到那里去
  rationale: 分词מֵבִיא带有正在进行并指向即将实现之目的地的意味；“正领……去”保留上帝主动带领的动态。
- source_word: וּבְחֻקֹּתֵיהֶם
  choice: 他们的规条
  rationale: חֻקּוֹת可指成文规定、固定规范或习俗；“规条”保留其规范性，也避免把含义限定为国家成文法。
- source_word: לֹא תֵלֵכוּ
  choice: 不可遵行
  rationale: הלך与בְ连用在此比喻按某种规范生活或行事；汉语“遵行”自然表达“按其规范而行”，而直译“行走在……中”会造成误解。
theological_decisions:
- issue: “埃及地／迦南地的做法”是否应明确改成当地居民的做法
  choice: 正文保留“埃及地／迦南地的做法”这一拟人化表达
  alternative: 译作“不可像埃及地／迦南地的人那样行”
  rationale: 原文以“地”为מַעֲשֵׂה的属格，不明说居民。现代汉语能够理解为当地通行的做法，因此不必在正文补入“人”，从而保留原文修辞与概括范围。
- issue: חֻקֹּתֵיהֶם应译为具有法律色彩的“律例”，还是较宽的“规条／习俗”
  choice: 规条
  alternative: 律例；习俗
  rationale: 该词在上下文与耶和华的律例形成对照，具有规范约束力；但这里也可能涵盖固定习俗。“规条”兼顾两面，不把异族规范说成仅仅无关道德的风俗，也不暗示其必为正式法典。
- issue: 是否保留“行走”这一行为隐喻
  choice: 译为“遵行”
  alternative: 不可行在他们的规条中
  rationale: 原文确有“行走”的隐喻，但直译在现代汉语中生硬且意义不明。“遵行”准确呈现按某套规范生活的含义，并未改变禁令的神学力度。
translation_notes:
  register: 采用现代、庄重而易懂的律法文体。三个禁令均用“不可”，并通过分号分开地点说明，使原文平行结构清晰。正文中的脚注标记[a]置于相关末句之后。
