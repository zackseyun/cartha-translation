  terminology: “耶和华”一致地作为神名处理，而非以称号替代；“神”准确对应אֱלֹהֵיכֶם。“典章／律例”及“遵行／谨守”的配对恰当，既避免不必要地把两个希伯来法律术语混同，也不作过度术语化处理。脚注的替代译法和“行走”隐喻说明与正文相符。
