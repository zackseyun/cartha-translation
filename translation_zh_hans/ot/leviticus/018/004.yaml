base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/004.yaml
  text: You shall do my judgments[a], and you shall keep my statutes, to walk in them. I am Yahweh your God.
translation:
  language: zh_hans
  text: 你们要遵行我的典章，谨守我的律例，行在其中。[a]我是耶和华你们的神。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“照着它们生活”。原文直译为“行在其中”，是指按照上帝的命令安排自己的生活。
    reason: 说明希伯来语的行走隐喻及其可能的解释性译法。
lexical_decisions:
- source_word: מִשְׁפָּטַי
  choice: 我的典章
  rationale: מִשְׁפָּט在律法语境中指裁断、法规或法令。“典章”保留其法律色彩，也与חֻקֹּתַי所译的“律例”有所区别。
- source_word: תַּעֲשׂוּ
  choice: 遵行
  rationale: עשה本义为“做、实行”；与律法名词连用时，“遵行”自然表达把规定付诸实践，同时贴合本节命令语气。
- source_word: חֻקֹּתַי
  choice: 我的律例
  rationale: חֻקָּה指制定并颁行的规条。“律例”是现代中文圣经语体中清楚、庄重的对应词，并保留与“典章”的词义区分。
- source_word: תִּשְׁמְרוּ
  choice: 谨守
  rationale: שׁמר有看守、持守、遵守之意；“谨守”既传达认真守护，也符合盟约律法语境中的切实遵守。
- source_word: לָלֶכֶת בָּהֶם
  choice: 行在其中
  rationale: הלך加ב在这里以“行走”比喻生活行为。“行在其中”保留原文意象及其持续按这些法度生活的含义，不在正文中将其完全解释化。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 原文使用上帝的专名四字神名；“耶和华”是现代汉语中通行且可辨识的专名音译，未以“主”这一称号代替。
- source_word: אֱלֹהֵיכֶם
  choice: 你们的神
  rationale: 该词带第二人称阳性复数后缀，直译为“你们的神”，表达上帝与以色列群体的盟约关系。
theological_decisions:
- issue: 四字神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 两者都是汉语中的专名转写；正文采用读者最熟悉且明确作为名字使用的“耶和华”，避免用“主”取代原文专名。
- issue: לָלֶכֶת בָּהֶם的含义
  choice: 行在其中
  alternative: 照着它们生活
  rationale: 原文以“行走”表达人的行为方式。正文保留这一隐喻，脚注则说明其自然含义，以免把它缩减为单一的解释性表述。
translation_notes:
  register: 采用现代、庄重而易懂的律法语体。“典章／律例”和“遵行／谨守”形成对应，并保留原文的平行结构；“行在其中”刻意保留希伯来语隐喻，由脚注辅助普通读者理解。
