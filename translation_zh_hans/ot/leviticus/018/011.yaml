  text: עֶרְוַ֨ת בַּת אֵ֤שֶׁת אָבִ֨י/ךָ֙ מוֹלֶ֣דֶת אָבִ֔י/ךָ אֲחוֹתְ/ךָ֖ הִ֑וא לֹ֥א תְגַלֶּ֖ה עֶרְוָתָֽ/הּ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/011.yaml
  text: You shall not uncover the nakedness of your father's wife's daughter[a], born to your father; she is your sister.
translation:
  language: zh_hans
  text: 不可揭露你父亲的妻子的女儿的下体；她是你父亲亲生的女儿，是你的姐妹[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“她是你同父的姐妹。”希伯来文直译为“她是你的姐妹”；前面的描述说明她是你父亲所生的女儿。
    reason: 说明可作的亲属关系表达，同时不把原文未明说的母系关系限定为“异母”。
lexical_decisions:
- source_word: עֶרְוַת / עֶרְוָתָהּ
  choice: 下体
  rationale: 在利未记18章的性禁令套语中，עֶרְוָה指人的裸露私处。“下体”比直译“赤身”更符合现代汉语表达，也保留法律条文的庄重和含蓄；前置宾语在汉语中整合到末句，避免生硬重复。
- source_word: בַּת אֵשֶׁת אָבִיךָ
  choice: 你父亲妻子的女儿
  rationale: 依照希伯来文的关系表述直译，不压缩成“继母的女儿”，以免加入原文未明说的家庭身份推断。
- source_word: מוֹלֶדֶת אָבִיךָ
  choice: 是你父亲所生的
  rationale: 表达与父亲之间的生物血缘关系；现代汉语自然清楚，同时不误说成由父亲分娩。
- source_word: אֲחוֹתְךָ הִוא
  choice: 她是你的姐妹
  rationale: 保留原文直接使用的广义亲属称谓，不在正文中擅加“同父异母”。
- source_word: לֹא תְגַלֶּה
  choice: 不可揭露
  rationale: “不可”符合律法禁令的庄重语体；“揭露下体”保留 גלה ערוה 的固定性禁令用语，且避免将其解释性扩写为具体性行为。
theological_decisions:
- issue: 是否在正文中把亲属关系明确写成“同父异母的姐妹”
  choice: 保留“她是你的姐妹”，由前面的亲属描述限定关系。
  alternative: 她是你同父异母的姐妹
  rationale: 希伯来文结语只说“她是你的姐妹”。“同父异母”虽可能概括此处关系，却比原文明说的内容更具解释性，因此放入脚注而不写入正文。
- issue: 是否把“揭露下体”直接解释为发生性关系
  choice: 保留原文的委婉法律套语“揭露她的下体”。
  alternative: 不可与她发生性关系
  rationale: 原文使用本章反复出现的固定表达；保留该表达可维持篇章一致性，也避免消除其修辞与法律语义的范围。
translation_notes:
  register: 采用现代、庄重而易懂的律法语体。“不可”体现禁令性质；分成两句，以自然汉语呈现希伯来文先提出亲属对象、后以代词重述禁令的结构。
