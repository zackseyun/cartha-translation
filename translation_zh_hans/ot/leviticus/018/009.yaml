  text: עֶרְוַ֨ת אֲחֽוֹתְ/ךָ֤ בַת אָבִ֨י/ךָ֙ א֣וֹ בַת אִמֶּ֔/ךָ מוֹלֶ֣דֶת בַּ֔יִת א֖וֹ מוֹלֶ֣דֶת ח֑וּץ לֹ֥א תְגַלֶּ֖ה עֶרְוָתָֽ/ן־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/009.yaml
  text: You shall not uncover the nakedness of your sister[a], whether your father's daughter or your mother's daughter, born in the household or born outside it.
translation:
  language: zh_hans
  text: 你不可揭露你的姐妹的下体：无论是你父亲的女儿，还是你母亲的女儿；无论生在家中，还是生在外面[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “家中”也可理解为“家户之内”。希伯来文把“生在家中”与“生在外面”相对。
    reason: 说明בַּיִת在这里可指居所，也可指家庭或家户范围，并保留该短语的语义幅度。
lexical_decisions:
- source_word: עֶרְוַת / עֶרְוָתָן
  choice: 下体
  rationale: עֶרְוָה在利未记18章的禁令中指涉性方面的赤裸。“揭露……的下体”保留希伯来文的法律性惯用表达，同时在现代汉语中清楚可懂。
- source_word: אֲחוֹתְךָ
  choice: 你姐妹
  rationale: 这是直接的单数亲属称谓。现代汉语通常以“姐妹”概括姐姐或妹妹；后文用“她”保持单数指称。
- source_word: בַת אָבִיךָ / בַת אִמֶּךָ
  choice: 你父亲的女儿 / 你母亲的女儿
  rationale: 保留原文平行结构及法律条文对父系或母系姐妹的明确分类，不擅自改写为同父异母或同母异父。
- source_word: מוֹלֶדֶת
  choice: 生在
  rationale: 此处说明出生的处境或范围；“生在”比“所生的”更自然，也能与后面的地点语形成清楚搭配。
- source_word: בַּיִת / חוּץ
  choice: 家中 / 外面
  rationale: 保留原文“家／家户之内”与“外面”的对照；正文采用简明自然的“家中”，并用脚注提示“家”也可能侧重家户范围。
- source_word: לֹא תְגַלֶּה
  choice: 你不可揭露
  rationale: 以“不可”体现法律禁令的语气；“揭露”保留与עֶרְוָה构成的希伯来语惯用表达。
- source_word: אוֹ ... אוֹ
  choice: 无论……还是……
  rationale: 自然呈现原文列举的两组选择，并表明禁令涵盖各项情形。
theological_decisions:
- issue: 受禁亲属关系的范围
  choice: 禁令涵盖父亲所生或母亲所生的姐妹，也不因其生在家中或外面而有例外。
  alternative: 末尾的限定语可被理解为区分在家内与家外出生的姐妹，或间接涉及不同类型的姐妹。
  rationale: 原文主要是在展开“你姐妹”这一类别。译文保留父系、母系以及家中、外面的各项对照，但不加入原文没有明说的同父异母、同母异父或婚生、非婚生等法律分类。
- issue: 末尾阴性复数代词עֶרְוָתָן
  choice: 中文不另译复数代词，而将禁令置于全句开头，统摄后面列出的各类姐妹。
  alternative: 直译为“你不可揭露她们的下体”。
  rationale: 希伯来文先以单数“你姐妹”提出类别，末尾却用阴性复数“她们的下体”回指所列类别。中文若直译为“她们”容易使读者误以为同时涉及多人；调整语序可保留禁令的整体范围，而不抹去分类结构。
translation_notes:
  register: 采用现代、庄重而易懂的法律语体。“不可”维持禁令力度；分号和两组“无论……还是……”使原文层层分类的结构清楚。正文保留“揭露……的下体”这一贯穿本章的法律性惯用语，避免把它弱化为一般羞耻，也不额外解释为某一特定性行为。
