  terminology: “律例”和“典章”妥当地分别对应 חֻקּוֹת 与 מִשְׁפָּטִים；“遵守／遵行”也保留了 שמר 与 עשה 的区别。“耶和华”是现代中文圣经中通行的神名译法，可接受。
