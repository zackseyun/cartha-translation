  text: וּ/שְׁמַרְתֶּ֤ם אֶת חֻקֹּתַ/י֙ וְ/אֶת מִשְׁפָּטַ֔/י אֲשֶׁ֨ר יַעֲשֶׂ֥ה אֹתָ֛/ם הָ/אָדָ֖ם וָ/חַ֣י בָּ/הֶ֑ם אֲנִ֖י יְהוָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/005.yaml
  text: So you shall keep my statutes and my judgments[a], which if a man does them, he shall live by them[b]. I am Yahweh.
translation:
  language: zh_hans
  text: 所以，你们要遵守我的律例和典章；人若遵行这些，就必藉着这些而活[a]。我是耶和华。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “藉着这些而活”也可译作“在其中活着”。希伯来文介词可表示凭借，也可表示所处的范围。
    reason: alternative_reading
lexical_decisions:
- source_word: וּשְׁמַרְתֶּם
  choice: 所以，你们要遵守
  rationale: 连接词承接上文；完成式在律法训令中具有命令意味。“遵守”自然表达 שמר 的守约、谨守含义。
- source_word: חֻקֹּתַי
  choice: 我的律例
  rationale: חֻקּוֹת 指制定的法令；“律例”保留正式法律语域，并与“典章”形成传统而清楚的区别。
- source_word: מִשְׁפָּטַי
  choice: 我的典章
  rationale: מִשְׁפָּטִים 在此指法律裁定或规条；“典章”既庄重自然，也不与 חֻקּוֹת 合并为同一概念。
- source_word: אֲשֶׁר יַעֲשֶׂה אֹתָם הָאָדָם
  choice: 人若遵行
  rationale: 原文是单数 הָאָדָם，具有泛指、代表性用法。“人”在现代汉语中自然保留这一范围；“遵行”表达 עשה 对律法采取实际行动的含义。
- source_word: וָחַי בָּהֶם
  choice: 就必因它们而活
  rationale: וָחַי 表明遵行之后的生命结果；בָּהֶם 可有工具性的“因/借着”或范围性的“在其中”之意。正文采用自然的“因它们而活”，脚注保留另一读法。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代简体中文读者熟悉的专名“耶和华”对应四字神名，而不以称号“主”替代。
theological_decisions:
- issue: “因它们而活”的生命范围
  choice: 保留宽泛表述“就必因它们而活”
  alternative: 就必在其中活着；就必借着它们得生命
  rationale: 原文没有明确限定这是今世存活、约中的生命，还是更广泛的神学意义。译文不替原文消除这一张力。
- issue: הָאָדָם 的代表性单数
  choice: 译为“人”
  alternative: 一个人；任何人；世人
  rationale: 希伯来文采用阳性单数作泛指。汉语“人”无需标明性别，且能自然表达任何个体的代表性意义，不把它误解为某一特定男子。
translation_notes:
  register: 采用现代、庄重而易懂的法律—圣约语体。“律例和典章”保留原文两个法律术语的并列；句式简洁，适合公开诵读。
