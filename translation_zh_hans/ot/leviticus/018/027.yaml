  text: כִּ֚י אֶת כָּל הַ/תּוֹעֵבֹ֣ת הָ/אֵ֔ל עָשׂ֥וּ אַנְשֵֽׁי הָ/אָ֖רֶץ אֲשֶׁ֣ר לִ/פְנֵי/כֶ֑ם וַ/תִּטְמָ֖א הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/027.yaml
  text: For the men of the land who were before you did all these abominations[a], and the land became unclean.
translation:
  language: zh_hans
  text: 因为在你们以前住在这地的人行了这一切可憎之事，这地就被玷污了。〔a〕
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，为禁令和警告说明缘由；现代汉语中“因为”自然保留其因果连接作用。
- source_word: כָּל הַתּוֹעֵבֹת הָאֵל
  choice: 这一切可憎之事
  rationale: “可憎之事”保留 תּוֹעֵבָה 强烈的道德与礼仪厌恶色彩；“这一切”对应复数及指示强调。
- source_word: עָשׂוּ
  choice: 行了
  rationale: 对应常用动词 עשה“做、行”；与“可憎之事”搭配时，“行了”庄重自然，又不把它专门化为法律或祭仪术语。
- source_word: אַנְשֵׁי הָאָרֶץ
  choice: 住在这地的人
  rationale: 该短语虽字面为“这地的男人”，在此集体指先前的当地居民；汉语“住在这地的人”准确表达其语境功能，也避免误解为仅指男性。
- source_word: אֲשֶׁר לִפְנֵיכֶם
  choice: 在你们以前
  rationale: 表达这些居民在时间上先于受话者；结合“住在这地的人”，形成自然清楚的现代汉语。
- source_word: וַתִּטְמָא
  choice: 就被玷污了
  rationale: טמא 在此表示因人的行为而成为不洁或遭到污秽；“被玷污了”兼顾结果及受作用的意味，并保留道德与礼仪层面的张力。
- source_word: הָאָרֶץ
  choice: 这地
  rationale: 上下文所指是以色列人将进入的特定地域，而非整个世界；“这地”明确其地域和篇章指向。
theological_decisions:
- issue: 土地不洁的性质
  choice: 这地就被玷污了
  alternative: 这地就变得不洁净了
  rationale: 原文把先前居民的行为与土地所受的污秽联系起来。“被玷污”不把这种污秽限定为纯礼仪性或纯比喻性，保留经文中的神学—道德张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“因为”保留与上文的逻辑联系；句式按汉语习惯重组，但保持原文的行为主体、时间关系以及土地受玷污的结果。
