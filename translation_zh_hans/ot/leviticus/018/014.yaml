  text: עֶרְוַ֥ת אֲחִֽי אָבִ֖י/ךָ לֹ֣א תְגַלֵּ֑ה אֶל אִשְׁתּ/וֹ֙ לֹ֣א תִקְרָ֔ב דֹּדָֽתְ/ךָ֖ הִֽוא־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/014.yaml
  text: You shall not uncover the nakedness of your father's brother; you shall not approach his wife[a]. She is your aunt.
translation:
  language: zh_hans
  text: 不可揭露你父亲兄弟的下体；不可亲近他的妻子[a]；她是你的叔伯母。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “亲近”在这里含有发生性关系的意思。
    reason: 说明希伯来文קרב在乱伦禁令语境中的性意味，同时保留正文的含蓄措辞。
lexical_decisions:
- source_word: עֶרְוַת
  choice: 下体
  rationale: 在“露……的下体”这一固定法律表达中，עֶרְוָה含蓄地指向性关系。译作“下体”既保留原文具体而委婉的措辞，也比直译为“赤身”更符合现代汉语表达。
- source_word: אֲחִי אָבִיךָ
  choice: 你父亲兄弟
  rationale: 直接保留原文“父亲的兄弟”这一亲属关系，不预先用“伯父/叔父”区分长幼，因为希伯来文未作此区分。
- source_word: לֹא תְגַלֵּה
  choice: 不可露
  rationale: 保留利未记第18章反复出现的禁令形式及“揭露下体”的法律惯用语，同时采用简洁庄重的现代汉语。
- source_word: אֶל אִשְׁתּוֹ לֹא תִקְרָב
  choice: 不可亲近他的妻子
  rationale: קרב字面为“靠近、亲近”，此处在乱伦禁令中带有性意味。正文保留原文含蓄表达，并以脚注说明语境含义。
- source_word: דֹּדָתְךָ
  choice: 你的姑母
  rationale: 上下文明确指父亲兄弟的妻子。现代普通话通常称其为“伯母”或“婶母”，但原文不区分父亲兄弟的长幼；“姑母”在此依照较宽泛的古代亲属称谓使用，脚注相关说明可避免误解。
- source_word: הִוא
  choice: 她是
  rationale: 按原文保留简洁的判断句，不擅自加入“因为”或“因为她是”等因果连接。
theological_decisions:
- issue: 是否将“露下体”直接解释为发生性关系
  choice: 正文保留“露……的下体”这一法律惯用语
  alternative: 译作“与……发生性关系”
  rationale: 原文使用具体而含蓄的固定表达。保留该表达可维持本章各条禁令的一致性，也避免把含蓄法律语言完全改写成解释性说法。
- issue: “亲近”在本节中的性含义
  choice: 正文保留“亲近”，脚注说明其在本语境中的性意味
  alternative: 正文直接译作“不可与他的妻子发生性关系”
  rationale: 这样既忠实呈现קרב的词面意义，也让普通读者不会把禁令误解为禁止一般社交接触。
- issue: 父亲兄弟之妻的亲属称谓
  choice: 采用“姑母”，同时依靠前句明确其为父亲兄弟的妻子
  alternative: 译作“伯母或婶母”
  rationale: 希伯来文不说明父亲兄弟的长幼；若只选“伯母”或“婶母”会增加原文没有的信息，而并列两称又会扩写正文。前句已准确界定关系。
translation_notes:
  register: 采用简洁、庄重的禁令体，以“不可”对应法律禁止语气。保留本章“露……的下体”这一重复公式。亲属名称须避免加入希伯来文没有的长幼区别；不过现代汉语通常不把父亲兄弟的妻子称为“姑母”，出版审校时可考虑将末句处理为“她是你的伯母或婶母”，以自然度换取必要的解释性展开。
