  text: אַל תִּֽטַּמְּא֖וּ בְּ/כָל אֵ֑לֶּה כִּ֤י בְ/כָל אֵ֨לֶּה֙ נִטְמְא֣וּ הַ/גּוֹיִ֔ם אֲשֶׁר אֲנִ֥י מְשַׁלֵּ֖חַ מִ/פְּנֵי/כֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/024.yaml
  text: Do not make yourselves unclean by any of these things[a], for by all these things the nations that I am driving out before you became unclean.
translation:
  language: zh_hans
  text: 你们不可因这些事而玷污自己[a]，因为我正从你们面前赶出去的列国，已经因这些事而变得不洁净。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你们不可因这些事使自己不洁净……列国……因这些事被玷污了。”
    reason: 说明“玷污自己”可译为“使自己不洁净”，并保留后句Niphal可按被动理解的译法。
lexical_decisions:
- source_word: אַל תִּטַּמְּאוּ
  choice: 不可……玷污自己
  rationale: אַל加未完成时表达禁止；טמא的Hitpael形态带有反身意味。“玷污自己”在现代汉语中自然地体现主体使自身陷入不洁的行动，并保留利未记中礼仪与道德相连的污秽概念。
- source_word: בְּכָל אֵלֶּה
  choice: 因这一切事
  rationale: 介词ב在此可表示手段或缘由；在否定句中，“因这一切事”自然涵盖前文列举的任何一种行为，同时与后半句形成词语呼应。
- source_word: כִּי
  choice: 因为
  rationale: כִּי引出禁令的理由；“因为”准确而清楚。
- source_word: נִטְמְאוּ
  choice: 已经……变得不洁净
  rationale: טמא的Niphal形态在此表达进入或处于不洁状态。“变得不洁净”保留结果状态，并避免把被动施事者说得过于明确；“已经”符合这些国族在被赶出前已受玷污的语境。
- source_word: הַגּוֹיִם
  choice: 那些国族
  rationale: 此处指当地非以色列的各族。“国族”比“外邦人”较少带入后期宗教分类，也比现代政治意义浓厚的“国家”更贴合古代族群。
- source_word: אֲשֶׁר אֲנִי מְשַׁלֵּחַ
  choice: 我正……赶出去的
  rationale: שלח基本义为“差遣、送走”，但在土地审判与驱逐的语境中是赶逐之意。“正……赶出去”既表达进行中的神圣行动，也符合现代汉语。
- source_word: מִפְּנֵיכֶם
  choice: 从你们面前
  rationale: 较贴近字面空间表达，也自然传达这些国族将从以色列人进展的道路和所在之地被除去。
theological_decisions:
- issue: 利未记18章中礼仪—道德污秽的术语
  choice: 前句用“玷污自己”，后句用“变得不洁净”
  alternative: 前后均译作“使自己不洁净／变得不洁净”，或“污辱自己／被玷污”
  rationale: 希伯来文前句为反身形态，后句为Niphal状态／被动形态。分别译作“玷污自己”和“变得不洁净”，可反映形态差异，并保留טמא所表达的真实污秽范畴，而不把它缩减为仅仅礼仪性或仅仅修辞性的概念。脚注说明也可采用较一致的“不洁净”措辞。
- issue: 国族被赶逐的施事者与时态
  choice: “我正……赶出去”
  alternative: “我要……赶出去”或“我……赶走了”
  rationale: מְשַׁלֵּחַ为分词，由第一人称代词强调施事者。译为“正……赶出去”保留其进行性，不把行动完全限定为将来或已然完成。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“不可”保留律法禁令的力度；“这一切事”承接前文所列行为；“国族”避免“国家”的现代政治含义，也避免“外邦人”可能带入的后期分类。主文中的[a]与脚注对应。
