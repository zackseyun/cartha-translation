  yaml_path: translation/ot/leviticus/018/012.yaml
  text: You shall not uncover the nakedness of your father's sister[b][a]; she is your father's flesh.
translation:
  language: zh_hans
  text: 不可揭露你父亲的姐妹的下体[a]；她是你父亲的骨肉[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “揭露……的下体”是本章法律禁令中的固定说法，指被禁止的性方面的暴露或性关系。
    reason: lexical_alternative
  - marker: b
    text: “骨肉”也可译作“近亲”或“血亲”。
    reason: alternative_reading
lexical_decisions:
- source_word: עֶרְוַת
  choice: 下体
  rationale: עֶרְוָה在本章的禁令套语中指裸体或私处；“下体”比直译“赤身”更自然明确，同时仍保留身体性的原文表达。
- source_word: תְגַלֵּה
  choice: 不可揭露
  rationale: 保留גלה的“揭露”意象及本章反复出现的法律套语，不在正文中直接扩写为“发生性关系”。
- source_word: אֲחוֹת אָבִיךָ
  choice: 你父亲的姐妹
  rationale: 直接呈现希伯来语亲属关系；“姐妹”不额外限定年龄，避免“姑母”在现代汉语中可能附带的辈分称谓色彩。
- source_word: שְׁאֵר
  choice: 骨肉
  rationale: שְׁאֵר在亲属语境中兼有“肉身”与血缘近亲之意；“骨肉”是自然而庄重的汉语亲属表达，也保留原文的身体隐喻。
- source_word: הִוא
  choice: 她是
  rationale: 按原文明确指认该女子与父亲的亲缘关系，简洁自然。
theological_decisions:
- issue: 如何翻译利未记十八章关于乱伦禁令的固定用语
  choice: 正文保留“揭露……的下体”这一身体性法律套语
  alternative: 意译为“不可与……发生性关系”
  rationale: 原文使用“揭露下体”的固定表达。保留该表达可维持全章用语的一致性，并避免把其所涵盖的禁忌行为静默收窄为单一释义；脚注说明其法律语境中的性含义。
- issue: שְׁאֵר的亲属含义
  choice: 译作“骨肉”
  alternative: 译作“近亲”或“血亲”
  rationale: “骨肉”兼顾原文“肉身”意象和近亲关系；脚注列出较解释性的关系义，以保存词义张力。
translation_notes:
  register: 采用现代、庄重而清楚的法律语体。正文保留希伯来语的身体性套语与亲属隐喻，借脚注解释其惯用含义；标点依照中文规范处理。
