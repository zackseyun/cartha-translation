revisions:
- from: 你不可在妻子还活着的时候，另娶她的姐妹，使她们彼此争竞[a]，露她姐妹的下体。
  to: 你不可在妻子还活着的时候，另娶她的姐妹为妻，使她成为妻子的对头[a]，露那姐妹的下体。
  rationale: 修订明确区分第一位妻子和所另娶的姐妹，并将“竞争/敌对”关系按原文的句法表达为后者成为前者的对头。保留时间限制、婚姻追加关系及“露下体”的原文委婉语，且不扩展禁令范围。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T04:50:53Z'
