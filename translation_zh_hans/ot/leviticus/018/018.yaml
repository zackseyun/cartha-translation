  verdict: revise
  source_fidelity: 译文正确表达了禁令所涉的两姐妹、第一位妻子在世的时间限制，以及“露下体”这一利未记惯用委婉语。但“使她们彼此争竞”把原文较具体的“使所娶的姐妹成为（第一位妻子的）对头/竞争者”改写为双方互相争竞；而“露她姐妹的下体”的指代在中文中不够清楚，可能误解为露第一位妻子的下体。
  naturalness: “你不可在妻子还活着的时候，另娶她的姐妹”自然庄重。修订后以“使她成为妻子的对头”和“那姐妹的下体”明确代词所指，仍保持现代普通话中适合律法文本的简洁语体。
  terminology: “不可”“另娶……为妻”“露……的下体”恰当地保留法律禁令、婚姻关系和利未记的委婉固定表达。“对头”在此表示因同嫁而形成的敌对/竞争关系，不预设超出经文的婚姻制度结论。
  issues:
  - severity: medium
    issue: “使她们彼此争竞”弱化并改写了לִצְרֹר的关系方向。
    rationale: 该不定式在此是指另娶的姐妹成为第一位妻子的竞争者/对头。虽然竞争关系当然涉及二人，但“彼此争竞”较像描述双方的相互行为，未清楚保留原文所指的“使她成为其对头”的结构。
  - severity: medium
    issue: “露她姐妹的下体”的中文代词指代不清。
    rationale: 原文“她的下体”指所另娶的那位姐妹，随后“在她活着的时候”则指第一位妻子。现有中文的“她姐妹”容易产生歧义；改为“那姐妹的下体”可准确区分两位女性。
  revised_text: 你不可在妻子还活着的时候，另娶她的姐妹为妻，使她成为妻子的对头[a]，露那姐妹的下体。
