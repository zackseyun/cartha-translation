base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/018.yaml
  text: And you shall not take a woman in addition to her sister as a rival wife[a], to uncover her nakedness while her sister is still alive.
translation:
  language: zh_hans
  text: 你不可在妻子还活着的时候，另娶她的姐妹为妻，使她成为妻子的对头[a]，露那姐妹的下体。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“不可另娶妻子的姐妹，使她成为妻子的对头。”希伯来文十分简练；这里禁止人在妻子仍活着时再娶她的姐妹，使所娶的姐妹成为妻子的竞争者。
    reason: 说明לִצְרֹר的词义和紧凑句法所容许的另一种表达。
lexical_decisions:
- source_word: וְאִשָּׁה אֶל אֲחֹתָהּ
  choice: 另娶她的姐妹
  rationale: אִשָּׁה可指“女人”或“妻子”；在“娶”的婚姻语境中译作“妻子”较自然。אֶל אֲחֹתָהּ表达在已有一位女子之外再娶她的姐妹，中文用“另娶”传达这种追加关系。
- source_word: לֹא תִקָּח
  choice: 你不可……娶
  rationale: תִּקָּח在这里指娶为妻；“不可”保留律法禁令的庄重、直接语气。
- source_word: לִצְרֹר
  choice: 使她们彼此争竞
  rationale: 该词在此表示造成敌对、竞争的关系。译文不把重点缩减为主观嫉妒，也不额外断定具体的家庭角色，而以“彼此争竞”表达结果。
- source_word: לְגַלּוֹת עֶרְוָתָהּ
  choice: 露她姐妹的下体
  rationale: 保留利未记中“露下体”这一固定委婉语，使读者仍能看见原文措辞；此语在上下文中指发生性关系。
- source_word: עָלֶיהָ בְּחַיֶּיהָ
  choice: 在妻子还活着的时候
  rationale: בְּחַיֶּיהָ意为“在她一生之中”。结合עָלֶיהָ所表达的在原有女子之外追加另一人的关系，中文将时间限制前置，清楚说明禁令适用于第一位姐妹仍在世时。
theological_decisions:
- issue: 禁令的范围：姐妹同嫁与多妻关系
  choice: 本节禁止在妻子仍活着时另娶她的姐妹，使二人成为竞争者。
  alternative: 把本节扩大为无论第一位姐妹是否仍活着，都绝对禁止娶其姐妹；或把本节泛化为禁止一切会产生争竞的婚姻。
  rationale: לִצְרֹר与בְּחַיֶּיהָ共同限定了姐妹之间的竞争关系及第一位姐妹在世的时段。译文只陈明经文明说的范围，不据此对所有多妻关系作额外裁断，也不把禁令扩大到第一位姐妹去世以后。
- issue: “露下体”的含义
  choice: 保留原文委婉语，按上下文理解为发生性关系。
  alternative: 直接译成“与她发生性关系”。
  rationale: 保留利未记反复使用的法律措辞有助于呈现文本内部的一致性，同时不消除其委婉表达。
translation_notes:
  register: 采用现代、庄重而易懂的律法语体。“另娶”“不可”符合普通话法律禁令的表达；保留“露下体”这一利未记特有的委婉语。脚注标记[a]已置于正文相应位置。
