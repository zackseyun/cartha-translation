  text: וּ/שְׁמַרְתֶּ֣ם אַתֶּ֗ם אֶת חֻקֹּתַ/י֙ וְ/אֶת מִשְׁפָּטַ֔/י וְ/לֹ֣א תַעֲשׂ֔וּ מִ/כֹּ֥ל הַ/תּוֹעֵבֹ֖ת הָ/אֵ֑לֶּה הָֽ/אֶזְרָ֔ח וְ/הַ/גֵּ֖ר הַ/גָּ֥ר בְּ/תוֹכְ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/026.yaml
  text: But you yourselves shall keep my statutes and my judgments[a], and you shall not do any of these abominations, neither the native-born nor the sojourner who sojourns among you.
translation:
  language: zh_hans
  text: 但你们自己要遵守我的律例和典章，不可做这些可憎之事中的任何一件；无论是本地出生的人，还是寄居在你们中间的寄居者[a]，都不可做。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “寄居者”也可译作“外来居民”。
    reason: 说明גֵּר指居住在以色列共同体中的非本地居民；该词并不必然指定其族裔。
lexical_decisions:
- source_word: וּשְׁמַרְתֶּם אַתֶּם
  choice: 但你们自己要遵守
  rationale: שׁמר在律法语境中表示“遵守、谨守”；独立代词אַתֶּם加强“你们”的语气，因此译作“你们自己”。句首“但”承接上文的对比。
- source_word: חֻקֹּתַי
  choice: 我的律例
  rationale: חֹק指立定的规范或法令；“律例”既保留法律语域，也符合现代中文圣经文体。
- source_word: מִשְׁפָּטַי
  choice: 我的典章
  rationale: מִשְׁפָּט可指判例、裁决或法规；“典章”与“律例”搭配自然，并保留其法律性质。
- source_word: וְלֹא תַעֲשׂוּ מִכֹּל הַתּוֹעֵבֹת הָאֵלֶּה
  choice: 不可行这一切可憎之事
  rationale: 否定词与מִן־כֹּל合用，表达全面禁止；“行”直接对应עשה，“可憎之事”保留תּוֹעֵבָה强烈的道德与宗教评价。
- source_word: הָאֶזְרָח
  choice: 本地人
  rationale: אֶזְרָח指本地出生、属于当地共同体的人；“本地人”清楚呈现其与寄居者的对比。
- source_word: הַגֵּר הַגָּר בְּתוֹכְכֶם
  choice: 住在你们中间的寄居者
  rationale: גֵּר指居住在以色列共同体中的非本地人，后面的分词短语再次说明其居住状态；此译法兼顾术语性与自然中文。
theological_decisions:
- issue: 禁令是否同时适用于本地人和寄居者
  choice: 明确表明本地人和住在共同体中的寄居者都受此禁令约束
  alternative: 将末句仅作为受命群体的同位说明，不特别凸显两者同等受约束
  rationale: 希伯来文并列הָאֶזְרָח与הַגֵּר，并使二者共同承接“不可行”的禁令；“无论……还是……都……”准确表达这一范围，而不添加额外教义判断。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“律例和典章”保留律法文本的正式语域；末句补出“都不可行”，使希伯来文并列主语与禁令的关系在中文中清晰，同时不改变原意。
