  yaml_path: translation/ot/leviticus/018/016.yaml
  text: You shall not uncover the nakedness of your brother’s wife[a]; it is your brother’s nakedness.
translation:
  language: zh_hans
  text: 不可露你兄弟妻子的下体[a]；那是你兄弟的下体。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可更明确地译作：“不可与你兄弟的妻子发生性关系。”希伯来文采用“露……的下体”这一委婉表达。
    reason: 词义替代译法；说明希伯来法律委婉语的通常含义。
lexical_decisions:
- source_word: עֶרְוַת
  choice: ……的下体
  rationale: 这里的עֶרְוָה是《利未记》18章法律委婉语“揭露……的下体”的组成部分，指向被禁止的性接触或性关系。“下体”既保留原文具体而委婉的身体意象，也能承载本节重复用词的法律逻辑。
- source_word: אֵשֶׁת אָחִיךָ
  choice: 你兄弟的妻子
  rationale: אֵשֶׁת是אִשָּׁה的构造形式，与“你兄弟”连用，明确表示婚姻关系，宜译为“你兄弟的妻子”。
- source_word: לֹא תְגַלֵּה
  choice: 不可揭露
  rationale: לֹא加未完成式在法律语境中表达禁令。“不可”符合现代中文法规式语体；“揭露”保留גלה的基本意象，并与“下体”构成源文的法律委婉表达。
- source_word: עֶרְוַת אָחִיךָ הִוא
  choice: 这是你兄弟的下体
  rationale: 保留עֶרְוָה的重复以及הִוא所作的断定，不把这句话改写为所有权陈述，从而保存原文把兄弟之妻的下体认定为兄弟下体的性与法律关联。
theological_decisions:
- issue: 是否在正文中把“揭露下体”直接解释为发生性关系
  choice: 正文保留“揭露……的下体”这一希伯来法律委婉语
  alternative: 不可与你兄弟的妻子发生性关系
  rationale: 原文没有使用直白的性交用语。保留委婉语可维持《利未记》18章关键表达的一致性，也避免把其可能涵盖的非法性暴露或性接触过度收窄；脚注说明通常所指。
- issue: 如何理解“这是你兄弟的下体”
  choice: 保留原文的身份认定式表述，不加以神学化解释
  alternative: 她的下体属于你兄弟
  rationale: 原句以הִוא断定“这是你兄弟的下体”，其法律与亲属关系逻辑具有张力。译文不擅自改成财产归属或更具体的婚姻神学命题。
translation_notes:
  register: 采用庄重、简洁的现代标准汉语法律语体。“不可”适合连续禁令；“兄弟”比“弟兄”更自然地表达具体亲属关系。正文保留原文两次“下体”的重复，并在相应位置标出脚注[a]。
