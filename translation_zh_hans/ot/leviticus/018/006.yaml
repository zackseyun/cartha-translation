  text: אִ֥ישׁ אִישׁ֙ אֶל כָּל שְׁאֵ֣ר בְּשָׂר֔/וֹ לֹ֥א תִקְרְב֖וּ לְ/גַלּ֣וֹת עֶרְוָ֑ה אֲנִ֖י יְהוָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/006.yaml
  text: No man among you shall approach any close relative of his flesh to uncover nakedness[a]; I am Yahweh.
translation:
  language: zh_hans
  text: 你们任何人都不可亲近自己的骨肉至亲，露其下体[a]。我是雅威。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “露下体”是本章的法律惯用语，指与近亲有关的禁忌性暴露或性关系。
    reason: 说明原文法律惯用语的性含义，同时避免在正文中将其范围过度限定。
lexical_decisions:
- source_word: אִישׁ אִישׁ
  choice: 你们任何人
  rationale: 名词重叠在此具有逐一、分配的作用；结合第二人称复数动词，译为“你们任何人”，自然表达这项禁令适用于群体中的每一个人。
- source_word: שְׁאֵר בְּשָׂרוֹ
  choice: 自己的骨肉至亲
  rationale: “骨肉”保留希伯来文以肉身关系表达血缘亲属的意象，“至亲”则传达 שְׁאֵר 所指的近亲关系，合乎现代汉语。
- source_word: לֹא תִקְרְבוּ
  choice: 都不可亲近
  rationale: 否定词与未完成式在律法语境中构成禁令；“亲近”保留 קָרַב 的委婉法律措辞，并与下文目的短语连用。
- source_word: לְגַלּוֹת עֶרְוָה
  choice: 露其下体
  rationale: 保留本章反复出现的“露下体”法律惯用语，不直接改写为“发生性关系”；“其”明确所露的是前述近亲的下体，而脚注说明该表达在本章中的性含义。
- source_word: אֲנִי יְהוָה
  choice: 我是雅威
  rationale: 保留神圣名号的自我宣告；“雅威”按 יְהוָה 的通常学术拟音译出，不以称号替代专名。
theological_decisions:
- issue: 是否在正文中明确改写性含义
  choice: 保留“露其下体”的法律惯用语
  alternative: 与近亲发生性关系
  rationale: 原文的委婉表达在本章反复出现，具有文学和法律上的连贯性；正文保留其意象，同时由脚注说明其所涵盖的禁忌性暴露或性关系。
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；采用“雅威”以专名形式传达，而不把它改成称号，也避免采用源自较晚混合读法的“耶和华”。
translation_notes:
  register: 采用现代、庄重而简明的律法语体。“骨肉至亲”兼顾希伯来文的肉身意象与现代汉语可懂度；“不可亲近……露其下体”保留原文的委婉结构和神学张力。
