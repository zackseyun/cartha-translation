source:
  edition: WLC
  text: דַּבֵּר֙ אֶל בְּנֵ֣י יִשְׂרָאֵ֔ל וְ/אָמַרְתָּ֖ אֲלֵ/הֶ֑ם אֲנִ֖י יְהוָ֥ה אֱלֹהֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/002.yaml
  text: Speak to the sons of Israel and say to them[b][a], ‘I am Yahweh your God.’
translation:
  language: zh_hans
  text: 你要向以色列子孙[a]讲话，告诉他们：‘我是雅威[b]，你们的上帝。’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“以色列的众子”；也可译作“以色列人”。这是对以色列民族的家族性、立约性称呼。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文为YHWH，传统上译作“耶和华”。
    reason: alternative_reading
lexical_decisions:
- source_word: דַּבֵּר
  choice: 讲话
  rationale: 这是命令式，用来引出上帝吩咐摩西向百姓传达的话；“讲话”与后面的“告诉他们”共同保留原文两个言说动词，同时使现代汉语自然。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列子孙
  rationale: 保留原文“以色列的众子”这一家族性、立约性的群体称呼；在汉语中，“子孙”可自然指整个以色列民族。
- source_word: וְאָמַרְתָּ אֲלֵהֶם
  choice: 告诉他们
  rationale: 准确传达连续命令的意思，避免生硬重复“说……对他们说”，同时保留摩西须直接向百姓宣告的语气。
- source_word: אֲנִי
  choice: 我是
  rationale: 独立人称代词用于身份宣告；汉语以“我是”自然表达这一认定句式。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常用的近似音译呈现四字神名YHWH，而不以称号代替其专名。
- source_word: אֱלֹהֵיכֶם
  choice: 你们的上帝
  rationale: 此处指与以色列立约的独一上帝；第二人称阳性复数后缀译为“你们的”。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名YHWH。“雅威”保留其专名性质；脚注说明传统译名，正文不以“上主”这一称号取代神名。
- issue: בְּנֵי יִשְׂרָאֵל的群体范围
  choice: 以色列子孙
  alternative: 以色列众子；以色列人
  rationale: “以色列子孙”既保留原文的家族与立约意象，也能在现代汉语中指整个以色列群体，不把它缩窄为仅限男性。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“向……讲话，告诉他们”保留希伯来文两个言说动词，又避免机械重复；神谕正文用全角引号呈现。
