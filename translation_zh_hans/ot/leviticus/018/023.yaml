base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/023.yaml
  text: And with any animal you shall not give your lying[a] to become unclean with it, and a woman shall not stand before an animal to mate with it[c][b]; it is a perversion.
translation:
  language: zh_hans
  text: 你不可与任何牲畜交合，使自己因它成为不洁净[a]；女人也不可站在牲畜面前，让它与她交合[b]。这是悖乱之事[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译近于“不可把你的交合给任何牲畜，使自己因它成为不洁净”；也可理解为“从而因它玷污自己”。
    reason: lexical_alternative
  - marker: b
    text: 原文所用动词指躺卧或骑跨，在这里是指牲畜与女人性交；阴性词尾表明女人是动作的承受者。
    reason: lexical_alternative
  - marker: c
    text: “悖乱之事”也可译作“混乱之事”或“败坏之事”；原词指违反正当秩序的行为，在这里用于性行为语境。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְכָל בְּהֵמָה
  choice: 与任何牲畜
  rationale: בְּהֵמָה泛指兽类，常用于家畜；“任何牲畜”在本节语境中自然，并保留כָּל的全面含义。
- source_word: לֹא תִתֵּן שְׁכָבְתְּךָ
  choice: 不可……交合
  rationale: 希伯来语直译近于“不可把你的交合给……”，是指性交的习语。中文若照字面译会晦涩，因此在正文中明确译出行为，并在脚注交代原文表达。
- source_word: לְטָמְאָה בָהּ
  choice: 因而玷污自己
  rationale: 该不定式可表达目的或结果；“因而”保留两者之间的语义张力，而“玷污自己”传达טמא所含的不洁与污秽概念，不把它限制为纯礼仪范畴。
- source_word: וְאִשָּׁה
  choice: 女人
  rationale: אִשָּׁה在此泛指女人，并非特指妻子。
- source_word: לֹא תַעֲמֹד לִפְנֵי בְהֵמָה
  choice: 不可站在牲畜面前
  rationale: 保留原文“站在……面前”的具体说法，后面的目的短语说明其性行为含义。
- source_word: לְרִבְעָהּ
  choice: 让它与她交合
  rationale: רבע在此指牲畜骑跨、性交；阴性宾语后缀表明女人是动作承受者。“让它与她交合”自然地保留这一方向。
- source_word: תֶּבֶל
  choice: 悖乱之事
  rationale: תֶּבֶל指违反正当秩序的行为，尤其可用于性行为语境。“悖乱之事”既表达道德上的错乱，又避免把它弱化为心理上的困惑。
- source_word: הוּא
  choice: 这是
  rationale: 指回前述行为并对其作出定性判断。
theological_decisions:
- issue: 性行为与不洁语言的关系
  choice: 因而玷污自己
  alternative: 为要因它成为不洁净
  rationale: 原文将该行为与טמא所表达的不洁紧密相连；译文保留这种圣经范畴，不将其仅仅解释为礼仪不洁，也不另行加入后来的教义术语。
- issue: תֶּבֶל的道德与秩序含义
  choice: 悖乱之事
  alternative: 混乱之事／败坏之事
  rationale: 该词对行为作出强烈的负面定性，并含有违背正当秩序的意味。“悖乱”保留这种力度；“混乱”在现代汉语中容易被误解为单纯杂乱或困惑。
translation_notes:
  register: 采用现代、庄重而直接的法律禁令语体。“交合”清楚但不粗俗；保留“站在牲畜面前”的原文形象，并用后句说明其目的。标点将两项禁令和最后的定性判断清楚分开。
