  text: You shall not uncover the nakedness of your father's wife[a]; it is your father's nakedness.
translation:
  language: zh_hans
  text: 不可露你父亲妻子的下体[a]；那是你父亲的下体。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或更明确地译作：“不可与你父亲的妻子发生性关系。”希伯来文直译为“不可露你父亲妻子的下体”。
    reason: 说明希伯来语法律委婉语所指的禁止性关系，同时保留正文中重复出现的原文意象和法律公式。
lexical_decisions:
- source_word: עֶרְוַת
  choice: 下体
  rationale: 这里的名词用于固定法律委婉语“揭露……的下体”，指发生被禁止的性关系。“下体”既保留身体意象和委婉语气，也比直译为“赤身”更自然地表达本章语境中的含义。
- source_word: אֵשֶׁת אָבִיךָ
  choice: 你父亲的妻子
  rationale: אֵשֶׁת 是 אִשָּׁה 的构造形式，与“你父亲”连用，明确表示婚姻关系，即“你父亲的妻子”。
- source_word: לֹא תְגַלֵּה
  choice: 不可揭露
  rationale: 否定词与未完成式在法律条文中表达禁令。“不可”符合现代汉语律法文体；“揭露”保留希伯来语反复出现的动词和隐喻。
- source_word: עֶרְוַת אָבִיךָ הִוא
  choice: 这是你父亲的下体
  rationale: 阴性代词 הִוא 回指阴性名词 עֶרְוָה，而不是把妇人认作父亲；用“这”自然承接前述“下体”，并保留原文把父亲妻子的下体视为父亲下体的表达。
theological_decisions:
- issue: 是否在正文中把“揭露下体”的委婉法律用语明说为发生性关系
  choice: 正文保留“揭露……的下体”
  alternative: 不可与你父亲的妻子发生性关系
  rationale: 原文使用本章反复出现的法律公式。保留该委婉语可维持篇章一致性和原文的修辞张力；脚注则说明其实际所指，避免现代读者误解。
- issue: 末句“这是你父亲的下体”的所指
  choice: 按原文保留父亲与其妻子之间的关系性表述
  alternative: 她属于你父亲，因此不可侵犯
  rationale: 替代译法会加入原文未明说的解释。直译保留原句简洁而富有法律与关系含义的表述。
translation_notes:
  register: 采用庄重、简明的现代汉语法律语体。“不可”传达禁令；“父亲的妻子”避免仅用“继母”而缩窄原文适用范围。正文保留本章关键委婉公式，脚注提供明确释义。
