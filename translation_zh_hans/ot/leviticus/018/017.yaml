id: LEV.18.17
reference: Leviticus 18:17
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: עֶרְוַ֥ת אִשָּׁ֛ה וּ/בִתָּ֖/הּ לֹ֣א תְגַלֵּ֑ה אֶֽת בַּת בְּנָ֞/הּ וְ/אֶת בַּת בִּתָּ֗/הּ לֹ֤א תִקַּח֙ לְ/גַלּ֣וֹת עֶרְוָתָ֔/הּ שַׁאֲרָ֥ה הֵ֖נָּה זִמָּ֥ה הִֽוא־־־־
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/017.yaml
  text: You shall not uncover the nakedness of a woman and her daughter[a]. You shall not take her son's daughter or her daughter's daughter to uncover her nakedness; they are close relatives[c][b]. It is depravity.
translation:
  language: zh_hans
  text: 不可揭露一个女人和她女儿的下体[a]。不可娶她的孙女或外孙女为妻，以揭露她的下体[b]；她们都是她的骨肉至亲[c]。这是可耻的恶行[d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “揭露……的下体”是希伯来语的委婉说法，在这里指发生被禁止的性关系。
    reason: cultural_note
  - marker: b
    text: 原文“她”是阴性单数，最自然可指本节开头的女人；也可理解为与所娶的女性后代有关。正文保留原文的指代形式。原文“娶”为较宽泛的“取”，在此语境中不应只理解为正式婚姻。
    reason: textual_ambiguity
  - marker: c
    text: “骨肉至亲”原文直译为“她的肉”，指有血缘关系的近亲。
    reason: lexical_alternative
  - marker: d
    text: “可耻的恶行”也可译为“邪恶”“无耻之举”或“淫乱的恶行”。
    reason: lexical_alternative
lexical_decisions:
- source_word: עֶרְוַת ... תְגַלֵּה / לְגַלּוֹת עֶרְוָתָהּ
  choice: 揭露……的下体
  rationale: 保留利未记中反复出现的法律性委婉语及其经文内部联系；脚注说明其所指的是被禁止的性关系，避免读者仅按身体暴露来理解。
- source_word: אִשָּׁה
  choice: 一个女人
  rationale: 该词可指“女人”或“妻子”；本节重点是这女人与其女性后代的亲属关系，并未明确限定为婚姻身份，因此采用范围较宽的“女人”。
- source_word: וּבִתָּהּ
  choice: 和她女儿
  rationale: 如实表达所有格结构，代词指前述女人。
- source_word: תִקַּח
  choice: 取
  rationale: 原词基本义为“取”，在此可涉及娶为妻或建立性结合。译作“取”保留其较宽的含义，不把禁令缩限为正式婚姻。
- source_word: בַּת בְּנָהּ
  choice: 她儿子的女儿
  rationale: 直接保留希伯来语明确的亲属链条，即经儿子所生的外孙辈女性。
- source_word: בַּת בִּתָּהּ
  choice: 她女儿的女儿
  rationale: 直接保留希伯来语明确的亲属链条，即经女儿所生的外孙辈女性。
- source_word: שַׁאֲרָה הֵנָּה
  choice: 她们都是她的骨肉至亲
  rationale: שְׁאֵר 表示血肉、骨肉或近亲，且带有指向原先那女人的第三人称阴性单数词尾；“骨肉至亲”既保留肉身亲缘意象，也自然表达近亲关系。
- source_word: זִמָּה
  choice: 淫乱的恶行
  rationale: 该词在此指性质严重、可耻而邪恶的性行为；此译既呈现性方面的语境，也保留明确的道德谴责。
theological_decisions:
- issue: “来揭露她的下体”中阴性单数词尾的所指
  choice: 保留“她”的单数形式，不在正文中明确补成某一个所指
  alternative: 明确解释为原先的女人，或分别指所取的每一位女性后代
  rationale: 希伯来语使用阴性单数词尾；原先的女人是最自然的语法关联，但也有人按具体性行为理解为所取的后代。直译“她”保存了原文的衔接与一定程度的指代张力。
- issue: תִקַּח 在本条近亲禁令中的范围
  choice: 译作较宽泛的“取”
  alternative: 译作“娶”或“娶为妻”
  rationale: 本节所禁止的不仅可涉及正式婚约，也涉及性结合。采用“取”可避免把法律范围无根据地缩限于婚姻手续。
- issue: “揭露下体”的法律性委婉语
  choice: 正文保留原有身体意象，并以脚注解释其性含义
  alternative: 正文直接意译为“发生性关系”
  rationale: 保留这一表达有助于维持利未记第十八章反复用语的一致性，同时脚注可防止现代读者误解为单纯裸体暴露。
translation_notes:
  register: 采用现代、庄重的法律条文语体。“不可”维持本章禁令的统一节奏；“取”略带书面色彩，但可理解，并能保留原文比“娶”更宽的语义。“骨肉至亲”兼具自然度与亲缘意象。
