revisions:
- from: 不可揭露一个女人和她女儿的下体[a]。不可取她儿子的女儿或她女儿的女儿，来揭露她的下体[b]；她们都是她的骨肉至亲[c]。这是淫乱的恶行[d]。
  to: 不可揭露一个女人和她女儿的下体[a]。不可娶她的孙女或外孙女为妻，以揭露她的下体[b]；她们都是她的骨肉至亲[c]。这是可耻的恶行[d]。
  rationale: 修订仅为消除现代汉语中“取”的不自然与歧义，并避免以“淫乱”过窄地界定 זִמָּה。保留了原文的禁令语气、亲属关系、单数代词的歧义及“揭露下体”的习语表达。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T04:51:03Z'
review_pass:
  verdict: revise
  source_fidelity: 译文总体准确保留了禁令的结构、亲属链条和“揭露下体”这一法律性委婉语。惟“淫乱”通常指放荡或不正当的多重性关系，较可能把 זִמָּה 所谴责的严重、可耻的性伦理恶行窄化；宜采用不预设该特定含义的表达。
  naturalness: “取她儿子的女儿或她女儿的女儿”在现代汉语中略显生硬，且“取”容易被理解为拿取。用“娶……为妻”在此法律语境中更自然；后接“以揭露她的下体”及脚注仍表明禁令不只限于婚姻手续。“孙女或外孙女”是现代汉语中清楚且自然的对应说法。
  terminology: “揭露……的下体”及其脚注适当地保留并解释了希伯来语习语。“骨肉至亲”能表达 שַׁאֲרָה 的血缘近亲含义；“她的”与原文阴性单数后缀相合。“可耻的恶行”比“淫乱的恶行”更稳妥地涵盖 זִמָּה 的严重谴责，且不强加特定性行为类别。
  issues:
