  text: וְ/אֶ֨ת זָכָ֔ר לֹ֥א תִשְׁכַּ֖ב מִשְׁכְּבֵ֣י אִשָּׁ֑ה תּוֹעֵבָ֖ה הִֽוא־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/022.yaml
  text: You shall not lie with a male as with a woman[a]; it is an abomination.
translation:
  language: zh_hans
  text: 不可与男性发生性关系，如同与女人发生性关系一样[a]；这是可憎的事。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“女人的躺卧”（复数），是指与女人发生性关系的惯用说法。
    reason: 说明“女人的躺卧”这一特殊复数构式及其惯用含义，并支持正文中自然表达的比较结构。
lexical_decisions:
- source_word: זָכָר
  choice: 男性
  rationale: 该词指性别为男的人；译作“男性”直接保留其范围，不擅自限定为成年男子。
- source_word: תִשְׁכַּב
  choice: 同寝
  rationale: שׁכב 在本条禁令中是指性行为的委婉语。“同寝”既保留原文含蓄的躺卧意象，也能在上下文中传达其性含义。
- source_word: מִשְׁכְּבֵי אִשָּׁה
  choice: 像与女人同寝一样
  rationale: 原文直译近似“女人的躺卧”，是指与女人性交的惯用表达。此译法以自然中文保留比较结构，并用脚注说明原文形式。
- source_word: תּוֹעֵבָה
  choice: 可憎的事
  rationale: 该词表示在圣洁条例中被视为强烈可厌、不可接受之事；“可憎的事”语气庄重有力，又比生僻或过度解释性的措辞更易懂。
- source_word: הִוא
  choice: 这是
  rationale: 阴性代词承接前述受禁行为，并与 תּוֹעֵבָה 构成判断句；现代中文自然译作“这是”。
theological_decisions:
- issue: 圣洁条例语境中禁令的范围
  choice: 按原文直接表述与男性进行如同与女人同寝的行为，不加入原文没有的限制条件。
  alternative: 将禁令限定为特定的祭祀性、剥削性或其他特定情形，或直接扩写成涵盖更广的现代分类。
  rationale: 希伯来文直接禁止“与男性同寝，像与女人同寝一样”，并称该行为为 תּוֹעֵבָה。译文既不应加入经文未明说的限定，也不应以现代概念扩大原句措辞。
translation_notes:
  register: 采用现代、庄重而易懂的法律禁令语体。“不可”体现明确禁令；“同寝”保留希伯来文的委婉表达，脚注则补足其性行为含义。正文中的脚注标记与脚注条目一致。
