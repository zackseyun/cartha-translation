  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/001.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: zh_hans
  text: 雅威对摩西说[a]：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“雅威向摩西讲话，说。”
    reason: 说明原文分别使用“讲话”和“说”两个词；正文按现代汉语习惯合并表达。
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: 说
  rationale: 该动词在叙事中引出雅威接下来的话；现代汉语用“对……说”自然、准确。句首的 וַ 表示叙事推进，在本节作为新段开头时不必机械译成“于是”或“又”。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文四字神名作音译，保留其作为上帝专名的性质，而不以称号替代。
- source_word: אֶל־מֹשֶׁה
  choice: 对摩西
  rationale: 介词 אֶל 标明说话的对象；“对摩西”符合现代汉语表达。
- source_word: לֵאמֹר
  choice: 说：
  rationale: 该不定式用于引出随后直接引语。汉语以“说”配合冒号自然表达这一功能，无须重复译成“说……说道”。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”较贴近其通行学术重构的读音，并明确保留专名。
- issue: וַיְדַבֵּר 与 לֵאמֹר 的表达
  choice: 合并为自然的汉语引语公式“对摩西说：”
  alternative: “向摩西讲话，说：”
  rationale: 希伯来语公式若逐词搬入汉语会显得重复；合并表达完整保留了说话行为、对象及引出下文的功能，不额外赋予“命令”或“晓谕”等语义。
translation_notes:
  register: 采用现代、庄重而清楚的叙事语言。“雅威”保留神的专名；冒号表明话语内容见下节。避免使用较古雅的“晓谕”。
