base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/017.yaml
  text: And the priest shall examine it[a], and behold, the diseased spot has turned white; then the priest shall pronounce the spot clean[c][b]; it is clean.
translation:
  language: zh_hans
  text: 祭司要察看他[a]。看哪，患处已经变白；祭司就要宣告那患处为洁净[b]；他是洁净的[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语为阳性单数宾语代词；按本节上下文，指受祭司察看的人。
    reason: 说明“他”的语法形式及上下文所指。
  - marker: b
    text: 或译“判定那患处为洁净”。祭司在察看之后作出礼仪上的判定，并不是医治患处。
    reason: 说明טהר在本段程序中的宣告性含义。
  - marker: c
    text: 希伯来语直译为“洁净的，是他”。此处确认受察看之人的礼仪状态。
    reason: 说明原文强调性的判语及其上下文所指。
lexical_decisions:
- source_word: וְרָאָהוּ
  choice: 祭司要察看他
  rationale: ראה在祭司检验的语境中不只是“看见”，而是仔细察看。宾语后缀是阳性单数，正文译作“他”，与受检验的人相符，同时用脚注保留其也可按上下文理解为患处的可能性。
- source_word: הַנֶּגַע
  choice: 患处
  rationale: נֶגַע在本章指祭司所察看的可见异常部位，并不等同于某种现代医学诊断。“患处”具体、自然，也避免过度确定病因。
- source_word: נֶהְפַּךְ ... לְלָבָן
  choice: 已经变白
  rationale: Nifal形式表达状态发生变化；“已经变白”准确传达察看时所见的结果。
- source_word: וְטִהַר ... אֶת הַנֶּגַע
  choice: 宣布这患处为洁净
  rationale: 在利未记十三章的检验程序中，祭司作出洁净与否的权威判定，并非施行医治。“宣布……为洁净”清楚表达这一功能。
- source_word: טָהוֹר הוּא
  choice: 这是洁净的
  rationale: 保留原文简短、强调性的判语。用“这”避免在正文中过度限定阳性代词究竟回指受检验的人还是患处，并在脚注中说明歧义。
theological_decisions:
- issue: 祭司行动的性质
  choice: 祭司宣布患处为洁净，即作出礼仪状态的判定
  alternative: 祭司使患处洁净或医治患处
  rationale: טהר在此处结合察看程序，表示宣告或判定为洁净；经文没有说祭司医治了病症。
- issue: 末句洁净判语的所指
  choice: 正文用“这是洁净的”保留所指的开放性
  alternative: 明确译为“这人是洁净的”或“这患处是洁净的”
  rationale: הוּא是阳性单数，语法上既可联系受检验的人，也可联系同为阳性名词的נֶגַע。上下文表达整体洁净判定，但原句没有用名词明确重述所指，因此不宜在正文中强行消除歧义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“看哪”保留וְהִנֵּה引人注意的叙事功能；分号呈现察看结果、祭司判定和末句确认之间的层次。
