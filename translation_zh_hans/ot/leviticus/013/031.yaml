base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/031.yaml
  text: And if the priest examines the diseased area of the scaly outbreak[a], and indeed its appearance is not deeper than the skin and there is no black hair in it, then the priest shall isolate the diseased area of the scaly outbreak for seven days.
translation:
  language: zh_hans
  text: 祭司若查看这癣疥[a]的患处，见其外观不深于皮肤，其中没有黑毛，祭司就要将这癣疥的患处隔离七天。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “癣疥”原文指本章所说的一种特定皮肤或头皮病症，确切所指不详；也可译作“痒疹”或沿用传统译名“头疥”。
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶגַע
  choice: 患处
  rationale: 在本章的查验语境中，指可观察到的病变部位；“患处”简洁自然，也避免把它误解为瘟疫。
- source_word: נֶתֶק
  choice: 癣疥
  rationale: 该词指本章所述发生于头部或胡须部位、与毛发脱落相关的一种特定病症，但确切病名不明。“癣疥”保留皮肤病的广义表达，并以脚注说明其不确定性。
- source_word: מַרְאֵהוּ
  choice: 患处看起来
  rationale: 将“它的外观”译成自然的现代汉语，同时保留这是视觉查验的意思。
- source_word: עָמֹק מִן־הָעוֹר
  choice: 深于皮肤
  rationale: 保留原文的比较表达，不进一步解释为凹陷或下陷，以免消除原文可能保有的视觉判断意味。
- source_word: שֵׂעָר שָׁחֹר
  choice: 黑毛
  rationale: 准确保留颜色这一诊断标准；此处涉及头发或胡须，用“毛”比单说“头发”涵盖更广。
- source_word: וְהִסְגִּיר
  choice: 把有这患处的人隔离
  rationale: 原文语法上以患处为宾语，但实际程序是将患者暂时隔离以便观察；译文明确其自然所指，避免“隔离患处”在现代汉语中的误解。
- source_word: שִׁבְעַת יָמִים
  choice: 七天
  rationale: 与“隔离”搭配时，现代汉语无需另加“达”或“为期”，即可清楚表达持续时间。
- source_word: וְכִי יִרְאֶה
  choice: 祭司若查看
  rationale: 既保留条件句结构，也体现祭司按条例进行查验，而不只是偶然看见。
theological_decisions: []
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“见”承接祭司查看后的观察结果，使法律条文的条件与处置关系明晰；避免使用现代医学诊断名，以免赋予古代术语过度确定的含义。
