  verdict: revise
  source_fidelity: 译文准确传达了查验、外观不深于皮肤、无黑毛及七天处置等条件。惟原文在“隔离”的直接宾语上明确为“这癣疥的患处”（אֶת־נֶגַע הַנֶּתֶק），而草稿改为“有这患处的人”；虽合乎实际程序，却把原文的表述重心由病患处改为患者。
  naturalness: 整体为自然、庄重的现代汉语。“其外观”较“患处看起来”更简洁，也更贴近原文的名词表达。
  terminology: “患处”“黑毛”“隔离”均合适。“癣疥”可作为传统且简明的暂定译名；脚注应保留该病症的具体医学所指未定这一点，避免把它当作现代确定病名。
