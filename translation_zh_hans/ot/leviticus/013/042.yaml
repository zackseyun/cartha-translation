  yaml_path: translation/ot/leviticus/013/042.yaml
  text: But if there is on the bald head or on the bald forehead a white-reddish diseased spot[b][a], it is a spreading skin disease on his bald head or on his bald forehead.
translation:
  language: zh_hans
  text: 但如果后脑的秃处或前额的秃处[b]出现白中带红的病斑，这就是在他后脑或前额的秃处蔓延的皮肤病[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“麻风病”。希伯来语所指范围较广，包括多种皮肤病或皮肤状况，不能严格等同于现代所说的汉森病。
    reason: lexical_alternative
  - marker: b
    text: 这里两个不同的希伯来语词，分别指头部后方的秃处和头部前方的秃处。
    reason: cultural_note
lexical_decisions:
- source_word: וְכִי
  choice: 但如果
  rationale: 承接上文关于普通秃头不算不洁的规定，引出与之相对的条件情形，同时保留法律条文的假设语气。
- source_word: יִהְיֶה
  choice: 出现
  rationale: 此处表达某处有病斑；汉语用“出现”比直译为“有”更自然，也没有额外断定病程。
- source_word: בַקָּרַחַת
  choice: 后脑的秃处
  rationale: קָרַחַת在与גַּבַּחַת对举时，通常指头部后方的秃处；译文直接显明二者的空间区别。
- source_word: בַגַּבַּחַת
  choice: 前额的秃处
  rationale: גַּבַּחַת与קָרַחַת相对，通常指头部前方的秃处；“前额的秃处”符合现代汉语表达。
- source_word: נֶגַע
  choice: 病斑
  rationale: 在本章语境中指接受察验的可见异常斑块；“病斑”简明自然，又避免赋予现代医学的精确诊断。
- source_word: לָבָן אֲדַמְדָּם
  choice: 白中带红
  rationale: 保留先白后红的希伯来语描述次序，并以自然汉语表达其混合或带色的外观，不武断限定具体色调。
- source_word: צָרַעַת
  choice: 皮肤病
  rationale: 该词涵盖的病况比现代汉森病更广，不能简单等同于现代所谓麻风病；正文采用普通读者易懂且较中性的说法，传统译法收入脚注。
- source_word: פֹּרַחַת
  choice: 发作
  rationale: 该分词源于“萌发、开出”之意，在病症语境中描写病变冒出或发作；“发作”比“扩散”更少预设其必然向外蔓延。
- source_word: בְּקָרַחְתּוֹ אוֹ בְגַבַּחְתּוֹ
  choice: 在他后脑或前额的秃处
  rationale: 保留第三人称所属关系，并以简洁方式重复诊断所在的两个部位。
theological_decisions:
- issue: צָרַעַת是否译作“麻风病”
  choice: 正文译作“皮肤病”，脚注保留传统译法
  alternative: 麻风病
  rationale: 经文所指类别不能严格等同于现代汉森病。采用宽泛译名可避免错误的医学等同，也不削弱本章关于礼仪洁净判定的作用。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语，保持祭司法条的条件句结构。以“后脑的秃处／前额的秃处”清楚呈现原文成对术语的区别；医学用语保持非技术性，不作超出原文的现代诊断。
