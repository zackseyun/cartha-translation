revisions:
- from: 他要把那衣物，或羊毛、麻料中的经线或纬线[a]，或任何带有病斑的皮制品烧掉，因为这是侵蚀性的灾病[b]；那物件必须用火焚烧。
  to: 他要把那件衣物，或羊毛或亚麻制的经线或纬线[a]，或任何带有病斑的皮制品烧掉；因为这是有破坏性的灾病[b]，必须用火焚烧。
  rationale: 修订明确了“亚麻”的材料指称，调整经纬线短语的汉语语序，并以“有破坏性的”较稳妥地表达 מַמְאֶרֶת，避免把原文未明示的侵蚀机制具体化。其余保留原稿对 צָרַעַת 的非现代医学化处理及脚注说明。
