  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/שָׂרַ֨ף אֶת הַ/בֶּ֜גֶד א֥וֹ אֶֽת הַ/שְּׁתִ֣י א֣וֹ אֶת הָ/עֵ֗רֶב בַּ/צֶּ֨מֶר֙ א֣וֹ בַ/פִּשְׁתִּ֔ים א֚וֹ אֶת כָּל כְּלִ֣י הָ/ע֔וֹר אֲשֶׁר יִהְיֶ֥ה ב֖/וֹ הַ/נָּ֑גַע כִּֽי צָרַ֤עַת מַמְאֶ֨רֶת֙ הִ֔וא בָּ/אֵ֖שׁ תִּשָּׂרֵֽף־־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/052.yaml
  text: He shall burn the garment[a], or the warp or the woof in wool or in linen, or any article of leather in which the infection is, for it is a destructive skin disease[b]; it shall be burned in the fire.
translation:
  language: zh_hans
  text: 他要把那件衣物，或羊毛或亚麻制的经线或纬线[a]，或任何带有病斑的皮制品烧掉；因为这是有破坏性的灾病[b]，必须用火焚烧。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “经线”指织物纵向的纱线，“纬线”指横向交织的纱线。希伯来文在此使用一对纺织术语。
    reason: 说明希伯来文中成对出现的纺织技术术语。
  - marker: b
    text: 这里译作“灾病”的希伯来词 צָרַעַת，传统上常译作“麻风病”，但它所涵盖的礼仪不洁状况比现代麻风病更广，也可用于衣物和房屋。
    reason: 避免把古代礼仪分类误认作一种确定的现代医学疾病，同时保留本章在人体、衣物和房屋之间使用同一术语的联系。
lexical_decisions:
- source_word: וְשָׂרַף
  choice: 他要……烧掉
  rationale: 该动词在连续的律例程序中表达规定性的行动；译为“要……烧掉”自然地体现命令要求。
- source_word: הַבֶּגֶד
  choice: 那衣物
  rationale: בגד泛指衣服或织物制成的物件；“衣物”比单指一件成衣更宽泛，也符合本章语境。
- source_word: הַשְּׁתִי א֣וֹ אֶת הָעֵרֶב
  choice: 经线或纬线
  rationale: 两词是成对的纺织术语，分别指织物纵向和横向的纱线；采用现代汉语标准名称。
- source_word: בַּצֶּמֶר א֣וֹ בַפִּשְׁתִּים
  choice: 羊毛、麻料中的
  rationale: 这里说明经纬线所属的材料类别。פשתים可指亚麻及其织物；“麻料”既自然，又避免把尚在纱线状态的材料限定为成品麻布。
- source_word: כָּל כְּלִי הָעוֹר
  choice: 任何……皮制品
  rationale: כלי可泛指器具、物件或制品，并不限于容器；“皮制品”简洁涵盖各类皮革物件。
- source_word: אֲשֶׁר יִהְיֶה בוֹ הַנָּגַע
  choice: 带有病斑的
  rationale: נגע在本章指可察验的患处、斑痕或灾病现象。“病斑”保留可观察的标记含义，同时不武断对应某种现代微生物感染。
- source_word: צָרַעַת מַמְאֶרֶת
  choice: 侵蚀性的灾病
  rationale: צָרַעַת在利未记中可临到人体、衣物和房屋，并不等同现代麻风病；ממארת含恶性、耗损或侵蚀之意。“侵蚀性的灾病”适合物件语境，并保留其严重和毁坏性。
- source_word: בָּאֵשׁ תִּשָּׂרֵף
  choice: 那物件必须用火焚烧
  rationale: 被动式表达规定的处置结果。“必须”体现律例的强制性；补出“那物件”使中文指代清楚，并避免误解为焚烧病斑本身。
theological_decisions:
- issue: צָרַעַת在礼仪洁净条例中的译法
  choice: 灾病
  alternative: 麻风病；癞病；察拉阿特
  rationale: 该希伯来词所指的礼仪不洁类别比现代麻风病更广，而且本节明确用于衣物和皮制品。译作“灾病”保留其异常、危害和礼仪判定的性质，又不作不合时代的医学诊断；脚注说明其传统译法及范围。
- issue: מַמְאֶרֶת所表达的严重性质
  choice: 侵蚀性的
  alternative: 恶性的；蔓延的；毁坏性的
  rationale: 词义可包含持续耗损、恶化或毁坏，具体机制并不确定。“侵蚀性的”适合受损织物和皮革，但不把它解释成现代医学意义上的恶性疾病，也不确定断言它必然蔓延。
translation_notes:
  register: 采用现代、庄重而易懂的律例文体。“他要……”“必须……”体现程序性命令；使用“衣物、经线、纬线、皮制品”等普通读者可理解的词语。对难以用单一现代病名对应的 צָרַעַת 不作过度医学化处理，并以脚注交代传统译法和语义范围。
