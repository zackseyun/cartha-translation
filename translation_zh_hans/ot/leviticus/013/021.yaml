  text: וְ/אִ֣ם יִרְאֶ֣/נָּה הַ/כֹּהֵ֗ן וְ/הִנֵּ֤ה אֵֽין בָּ/הּ֙ שֵׂעָ֣ר לָבָ֔ן וּ/שְׁפָלָ֥ה אֵינֶ֛/נָּה מִן הָ/ע֖וֹר וְ/הִ֣יא כֵהָ֑ה וְ/הִסְגִּיר֥/וֹ הַ/כֹּהֵ֖ן שִׁבְעַ֥ת יָמִֽים׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/021.yaml
  text: But if the priest examines it[a], and behold, there is no white hair in it, and it is not deeper than the skin, but it is dim, then the priest shall isolate him for seven days.
translation:
  language: zh_hans
  text: 但祭司若察看那患处，见其中没有白毛，也不比皮肤深，只是颜色暗淡，祭司就要把那人隔离七天。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“把那人关起来七天。”希伯来语动词指将受检者单独安置，以便观察。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם יִרְאֶנָּה הַכֹּהֵן
  choice: 但祭司若察看那患处
  rationale: וְאִם承接上文，引出与前一种诊断相对的条件；ראה在祭司检验皮肤病的语境中不只是“看见”，而是“察看”。宾语为阴性单数，按上下文明示为“那患处”，使现代汉语指代清楚。
- source_word: וְהִנֵּה אֵין בָּהּ שֵׂעָר לָבָן
  choice: 见其中没有白毛
  rationale: הִנֵּה引出察看所得的结果，汉语用“见”自然表达这一检验公式；“其中”保留白毛位于患处之内的意思。
- source_word: וּשְׁפָלָה אֵינֶנָּה מִן הָעוֹר
  choice: 也不比皮肤深
  rationale: שְׁפָלָה字面有“低、下陷”之意；在皮肤检验语境中，“不比皮肤深”准确表达肉眼所见的凹陷程度，也与相邻经文的诊断用语一致。
- source_word: וְהִיא כֵהָה
  choice: 只是颜色暗淡
  rationale: כֵהָה表示外观变淡、不鲜明；补出“颜色”符合汉语表达，并避免误解为患处本身昏暗。转折词“只是”呈现该项虽仍可见却不鲜明的诊断特征。
- source_word: וְהִסְגִּירוֹ הַכֹּהֵן
  choice: 祭司就要把那人隔离
  rationale: סגר在此指将受检者置于隔离状态以便继续观察；阳性单数后缀指那个人，而非阴性的患处。“隔离”既准确又避免把该措施过度现代医学化为特定意义的“检疫”。
- source_word: שִׁבְעַת יָמִים
  choice: 七天
  rationale: 直接表达规定的隔离期限。
