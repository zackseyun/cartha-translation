  text: וְ/אִם תֵּרָאֶ֨ה ע֜וֹד בַּ֠/בֶּגֶד אֽוֹ בַ/שְּׁתִ֤י אֽוֹ בָ/עֵ֨רֶב֙ א֣וֹ בְ/כָל כְּלִי ע֔וֹר פֹּרַ֖חַת הִ֑וא בָּ/אֵ֣שׁ תִּשְׂרְפֶ֔/נּוּ אֵ֥ת אֲשֶׁר בּ֖/וֹ הַ/נָּֽגַע־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/057.yaml
  text: But if it appears again in the garment[a], or in the warp, or in the woof, or in any article of leather, it is a spreading outbreak[b]; you shall burn in the fire whatever has the infection in it.
translation:
  language: zh_hans
  text: 但若斑痕再次出现在衣物上，或经线、纬线[a]上，或任何皮革制品上，这就是扩散的斑痕[b]。凡有这种斑痕的物件，都要用火烧掉。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “经线”指织物纵向的线，“纬线”指横向交织的线。
    reason: 说明成对的古代纺织术语。
  - marker: b
    text: “斑痕”所译的希伯来词נגע是本章察验程序中的技术用语，指受影响的部位或痕迹；传统上也译作“灾病”“患处”。“扩散”对应原文所指斑痕重新显现并蔓延的状态。
    reason: 保留נגע的术语性及פֹּרַחַת所表达的扩展含义，避免作现代医学诊断。
lexical_decisions:
- source_word: תֵּרָאֶה עוֹד
  choice: 再次出现
  rationale: נפעל形式在此表示斑痕重新显现；“再次出现”既自然，也符合洗净后继续察看的程序语境。
- source_word: בֶּגֶד
  choice: 衣物
  rationale: 该词可指衣服或布料制品；“衣物”在本章语境中简明而宽泛。
- source_word: שְׁתִי ... עֵרֶב
  choice: 经线、纬线
  rationale: 这是织物的成对术语，分别指纵向和横向的纱线；采用现代汉语通行名称。
- source_word: כְּלִי עוֹר
  choice: 皮制物件
  rationale: כְּלִי含义宽泛，指器具或物件；该译法不把对象限制为容器，并明确其为皮革制品。
- source_word: פֹּרַחַת הִוא
  choice: 这斑痕就是在蔓延
  rationale: פרח本义为发芽、绽出，在此比喻斑痕扩展；译作“在蔓延”清楚表达其持续发展的状态，同时避免按字面译成不自然的“发芽”。
- source_word: בָּאֵשׁ תִּשְׂרְפֶנּוּ
  choice: 都要用火烧掉
  rationale: 保留法律指令的明确语气；“用火烧掉”是现代汉语自然表达。
- source_word: אֵת אֲשֶׁר בּוֹ הַנָּגַע
  choice: 凡有这斑痕的物件
  rationale: 相对结构所指的是其中带有该斑痕的物件；此译法清楚保留其概括范围。
- source_word: הַנָּגַע
  choice: 斑痕
  rationale: נגע是《利未记》13章察验程序中的技术用语，指受侵染或异常的部位；“斑痕”保留可观察的外在特征，不强行赋予现代医学诊断。
theological_decisions:
- issue: נגע是否应被具体解释为现代意义的传染病或霉菌
  choice: 译作“斑痕”，不作现代病理诊断
  alternative: 感染、霉斑、灾病
  rationale: 原文关注祭司可察验的异常斑痕及其礼仪处理，并未提供足以确定现代病因的资料；保持宽泛可避免把后世诊断读入经文。
translation_notes:
  register: 采用现代、庄重而易懂的法规叙述语体。“衣物—经线—纬线—皮制物件”保持原文逐项列举；末句将希伯来语单数宾语按汉语习惯概括为“凡有这斑痕的物件”，未改变处置范围。
