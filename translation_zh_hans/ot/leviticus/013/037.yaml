base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/037.yaml
  text: But if in his sight the scaly eruption has remained unchanged[a], and black hair has grown in it, the scaly eruption is healed; he is clean, and the priest shall pronounce him clean.
translation:
  language: zh_hans
  text: 但如果祭司察看，见这癣患仍没有变化，其中长出了黑色毛发，这癣患就已经痊愈；那人是洁净的，祭司要宣布他为洁净。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “宣布他为洁净”或译“定他为洁净”。希伯来语动词也可直译为“洁净他”；但在这里，指患处痊愈后祭司所作的正式裁定。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּעֵינָיו
  choice: 祭司看见
  rationale: 这是从检验者视角作判断的希伯来表达。上下文中的检验者是祭司；译为“祭司看见”既自然，也保留现场察看的含义。
- source_word: עָמַד
  choice: 仍停在原处
  rationale: 在本章诊断语境中，指患处保持原状、没有扩散；“仍停在原处”比字面的“站立”更符合现代汉语。
- source_word: הַנֶּתֶק
  choice: 癣患
  rationale: 该词专指头部或胡须部位的一种皮肤患处。“癣患”简洁易懂，并以“患”避免将其与现代医学上的某一确切癣病完全等同。
- source_word: שֵׂעָר שָׁחֹר
  choice: 黑毛
  rationale: 直译颜色与毛发；在头皮或胡须患处的语境中，“黑毛”比“黑色头发”涵盖面更合适。
- source_word: צָמַח בּוֹ
  choice: 其中长出了
  rationale: 保留毛发从患处之中长出的空间关系，并用完成体“长出了”表达可观察到的新迹象。
- source_word: נִרְפָּא
  choice: 已经痊愈了
  rationale: 表达患处已恢复的被动或状态意义，并与祭司随后作出的洁净裁定区分开来。
- source_word: טָהוֹר הוּא
  choice: 那人是洁净的
  rationale: 阳性代词在此最自然地指受检者，而非阴性名词“癣患”；“洁净”也是利未记礼仪状态的标准用语。
- source_word: וְטִהֲרוֹ הַכֹּהֵן
  choice: 祭司要宣布他为洁净
  rationale: 此处是祭司在患处痊愈后作出的正式洁净裁定，不是祭司使其身体痊愈。
theological_decisions:
- issue: 祭司行为的性质
  choice: 祭司要宣布他为洁净
  alternative: 祭司要洁净他
  rationale: 经文本身先说癣患已经痊愈，随后才提祭司的行动，因此这里宜表达正式判定，而不暗示祭司施行身体医治。
translation_notes:
  register: 采用现代、庄重而易懂的法规叙述。“癣患”与本段上下文协调；“那人”明确洁净状态所指，避免误读为仅指患处。脚注标记置于其所说明的末句之后。
