  text: וְ/הַ/בֶּ֕גֶד כִּֽי יִהְיֶ֥ה ב֖/וֹ נֶ֣גַע צָרָ֑עַת בְּ/בֶ֣גֶד צֶ֔מֶר א֖וֹ בְּ/בֶ֥גֶד פִּשְׁתִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/047.yaml
  text: And if a garment has in it an outbreak of leprosy[a], in a wool garment or in a linen garment,
translation:
  language: zh_hans
  text: 衣物上若出现麻风病变[a]，不论是羊毛衣物还是亚麻衣物，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语 tsara‘at（צָרָעַת）传统上译作“麻风”，在这里指一类范围更广、可使人或物不洁的异常状况，包括出现在衣物上的病变或污染，并非专指现代所说的汉森病。
    reason: 说明传统译名与原词范围之间的差异，避免读者把衣物上的现象误解为现代医学意义上的麻风病。
lexical_decisions:
- source_word: הַבֶּגֶד
  choice: 衣物
  rationale: בגד指衣服或衣物。此处定冠词用于律法中的一般情形，汉语用“衣物”自然地表达泛指，也能涵盖下文所列不同材料。
- source_word: כִּי יִהְיֶה בוֹ
  choice: 上若出现
  rationale: כִּי配未完成式在律法条款中引出假设情形；בוֹ表示病斑位于衣物上。汉语“上若出现”既自然，也保留位置关系。
- source_word: נֶגַע צָרָעַת
  choice: 麻风病斑
  rationale: נגע在本章指可观察、须受检验的患处或斑痕，צָרָעַת则是传统上译作“麻风”的较广泛类别。“病斑”适合衣物语境，并以脚注说明这并非专指现代汉森病。
- source_word: בְּבֶגֶד צֶמֶר
  choice: 羊毛衣物
  rationale: צמר指羊毛；该短语说明受检衣物的材料。汉语列举时无需机械重复处所介词，仍保留原文所指。
- source_word: אוֹ בְּבֶגֶד פִּשְׁתִּים
  choice: 还是细麻衣物
  rationale: פשתים指亚麻及其织物；在成衣语境中译为“细麻”符合圣经用语且清楚。“不论……还是……”自然呈现两类材料的并列选择。
theological_decisions:
- issue: צָרָעַת是否等同于现代麻风病（汉森病）
  choice: 正文保留传统称谓“麻风”，并用“病斑”体现本节可见的衣物异常，脚注界定其广义用法
  alternative: 直接译作“汉森病”或笼统改作“霉斑”
  rationale: 本节对象是衣物，表明צָרָעַת在利未记中的范围不限于现代医学所称的汉森病；但原文也未在此明确把它限定为普通霉菌，因此不应过度具体化。
translation_notes:
  register: 采用现代、庄重而易懂的律法文体。“衣物”比“衣服”更适合涵盖本段后续涉及的织物材料；“不论……还是……”使汉语列举自然，同时不改变原文两类材料的范围。句末保留逗号，以衔接下一节尚未完结的条件条款。
