translation:
  language: zh_hans
  text: 如果一个男人头上的头发脱落了[a]，他秃头了；他是洁净的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“如果一个男人的头变秃了。”希伯来语动词可指变得光秃或毛发被除去；正文保留它与下文“他秃头了”之间的动词区别。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ
  choice: 一个男人
  rationale: 原文为阳性单数，在这项身体症状的条例中指男性个案；译作“一个男人”准确保留其形式和所指。
- source_word: כִּי
  choice: 如果
  rationale: 在法律和诊断语境中引出条件性个案，现代汉语用“如果”自然清楚。
- source_word: יִמָּרֵט
  choice: 头发脱落了
  rationale: מרט 的尼法勒形可指变得光秃或毛发被除去；此处译作“脱落了”不限定原因，并保留它与下文“秃头”之间的动词—状态区别。
- source_word: רֹאשׁוֹ
  choice: 头上的
  rationale: 明确表示脱落的是头部的毛发，符合中文惯用表达。
- source_word: קֵרֵחַ
  choice: 秃头的
  rationale: 表达脱发后的状态，并与前面的过程性动词保持区别。
- source_word: טָהוֹר
  choice: 洁净的
  rationale: 在利未记第13章的检验条例中表示礼仪身份，不表示道德上的无罪；“洁净”是准确且一致的术语。
- source_word: הוּא ... הוּא
  choice: 他是……；他是……
  rationale: 保留原文两个独立的强调性判断：秃头这一事实本身不使他成为不洁净。
theological_decisions:
- issue: 利未记不洁条例中的礼仪身份术语
  choice: 洁净的
  alternative: 纯洁的
  rationale: 本节判定的是礼仪上的洁净状态，而不是品格或道德意义上的纯洁。
- issue: 秃头与不洁净之间的关系
  choice: 保留“他是秃头的；他是洁净的”两个判断
  alternative: 意译为“他虽然秃头，仍是洁净的”
  rationale: 原文并未明说让步关系；分句直陈既保留强调，也避免添加原文未显式表达的逻辑连接。
translation_notes:
  register: 采用现代、庄重而易懂的条例语言。“头上的头发脱落”自然表达原文含义；“洁净”保持利未记礼仪术语的一致性。
