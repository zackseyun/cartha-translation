base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/006.yaml
  text: Then the priest shall examine him again on the seventh day[a], and if the infection has faded and the infection has not spread in the skin, the priest shall pronounce him clean; it is a scaly eruption. He shall wash his clothes and be clean.
translation:
  language: zh_hans
  text: 到第七天，祭司要再次察看他；如果患处已经变淡，也没有在皮肤上扩散，祭司就要宣布他洁净；这是皮疹[a]。他要洗衣服，就洁净了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “皮疹”所译的希伯来语，指一种相对轻微的皮疹，与会继续扩散的较严重患处有别；也可译作“鳞屑性皮疹”。
    reason: 说明罕见皮肤病名称的词义范围及可采用的较具体译法。
lexical_decisions:
- source_word: וְרָאָה
  choice: 察看
  rationale: 这里是祭司依礼仪条例进行正式检查，不只是一般的“看”；“察看”既自然，也保留审查意味。
- source_word: שֵׁנִית
  choice: 再次
  rationale: 该词作副词，表示祭司重复先前的检查；“再次”简洁自然。
- source_word: כֵּהָה
  choice: 已经变淡
  rationale: 形容患处的颜色或显著程度减弱；“变淡”符合肉眼观察的语境，又不暗示已经痊愈。
- source_word: הַנֶּגַע
  choice: 患处
  rationale: נגע在本章指受祭司检查的皮肤病变或异常部位。“患处”便于现代读者理解，也避免“感染”所带来的现代病原学判断。
- source_word: פָשָׂה
  choice: 扩散
  rationale: 在皮肤病诊察语境中指患处向外蔓延；“扩散”准确而通俗。
- source_word: בָּעוֹר
  choice: 在皮肤上
  rationale: עור意为“皮肤”；汉语描述皮肤表面病变时，“在皮肤上”最自然。
- source_word: וְטִהֲרוֹ הַכֹּהֵן
  choice: 祭司就要宣布他洁净
  rationale: 使役式在此表示祭司作出礼仪洁净的正式判定，并非祭司亲自医治或洗净此人。
- source_word: מִסְפַּחַת
  choice: 皮疹
  rationale: 该词指相对轻微、未扩散的皮肤疹症。“皮疹”是清楚自然的现代汉语，并以脚注说明其词义范围。
- source_word: וְכִבֶּס בְּגָדָיו
  choice: 他要洗净衣服
  rationale: 忠实表达洗涤其衣物的要求；“衣服”比“衣裳”更符合现代标准汉语。
- source_word: וְטָהֵר
  choice: 就洁净了
  rationale: 表示洗衣之后所具有的礼仪身份；不将其误解为身体已经痊愈。
theological_decisions:
- issue: 礼仪洁净的判定与身体医治的区别
  choice: 将祭司的行动译为“宣布他洁净”，并将结尾译为“就洁净了”。
  alternative: 译为“祭司要洁净他”或“他就痊愈了”。
  rationale: 上下文所论的是祭司对礼仪身份的判断，并不必然表示身体疾病已获医治。此译法保留律法和礼仪层面的含义，不加入医学或宗派性解释。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“察看”“宣布洁净”保留祭司诊察和礼仪裁定的正式语气；“患处”避免引入现代医学上未经原文确认的“感染”概念。脚注标记置于“皮疹”之后，与其实际说明对象对应。
