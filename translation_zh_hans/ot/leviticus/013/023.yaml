base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/023.yaml
  text: But if the bright spot remains in its place and has not spread[a], it is the scar of the boil, and the priest shall pronounce him clean.
translation:
  language: zh_hans
  text: 但如果亮斑仍在原处[a]，没有扩散，这就是疖疮的疤痕；祭司要宣布他为洁净。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“在其下站立”；这里的空间表达指亮斑仍在原处，没有扩散。
    reason: 说明希伯来语空间表达在本诊察语境中的惯用含义。
lexical_decisions:
- source_word: וְאִם
  choice: 但如果
  rationale: 承接上一种情形并引出相反的诊断条件，现代汉语用“但如果”自然清楚。
- source_word: תַּחְתֶּיהָ תַּעֲמֹד
  choice: 停留在原处
  rationale: 字面近于“立在其下”，在本章查验皮肤病状的语境中，表示斑点保持原位而未向外扩展；此译保留其语境意义。
- source_word: הַבַּהֶרֶת
  choice: 亮斑
  rationale: 指皮肤上肉眼可见的明亮或发白斑点；“亮斑”简洁且不引入特定现代医学诊断。
- source_word: לֹא פָשָׂתָה
  choice: 没有扩散
  rationale: 该动词在本章反复用于病状在皮肤上蔓延，“扩散”符合现代汉语诊察语境。
- source_word: צָרֶבֶת הַשְּׁחִין
  choice: 疖疮留下的疤痕
  rationale: צָרֶבֶת表示炎症或灼伤留下的痕迹；与שְׁחִין连用时，译作“疖疮留下的疤痕”自然明确。
- source_word: וְטִהֲרוֹ הַכֹּהֵן
  choice: 祭司要宣布他为洁净
  rationale: 这里是祭司依据查验结果判定礼仪身份，并非施行医治或使其身体洁净；“宣布……为洁净”准确表达宣告义。
theological_decisions:
- issue: 礼仪洁净与身体医治的区别
  choice: 祭司要宣布他为洁净
  alternative: 祭司要洁净他
  rationale: טהר在此处描述祭司对礼仪身份的判定，而不是祭司亲自清除病症；译文保留利未记洁净制度中的法律—礼仪含义。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“亮斑”“疖疮”“疤痕”保持可观察的病状描述，避免套用现代医学病名；分号清楚区分诊断与祭司的礼仪判定。
