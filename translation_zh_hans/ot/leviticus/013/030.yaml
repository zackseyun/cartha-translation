base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/030.yaml
  text: And the priest shall examine the diseased area[a], and behold, its appearance is deeper than the skin, and in it is thin yellow hair, then the priest shall pronounce him unclean; it is an itch[b], a skin disease of the head or of the beard.
translation:
  language: zh_hans
  text: 祭司要察看患处；见其外观看来比皮肤深，且其中有细黄毛，祭司就要宣布那人不洁净。这是癣患[a]，是头部或胡须的皮肤病[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “癣患”所译的希伯来语 נֶתֶק，指头部或胡须所生的一类病患；其确切的现代医学病名无法确定。传统译法有“头疥”或“秃疮”。
    reason: lexical_alternative
  - marker: b
    text: 这里译作“皮肤病”的希伯来语 צָרַעַת 是范围较广的病症类别，不一定指现代医学所说的麻风病（汉森病）。
    reason: cultural_note
lexical_decisions:
- source_word: נֶגַע
  choice: 患处
  rationale: 本节指祭司所察看的可见异常部位。“患处”简洁自然，既不预断具体病名，也避免把该词误解为瘟疫或伤口。
- source_word: מַרְאֵהוּ עָמֹק מִן־הָעוֹר
  choice: 患处看起来比皮肤深
  rationale: 保留原文关于外观的诊断性表述，不将其过度具体化为凹陷或侵入皮下。
- source_word: שֵׂעָר צָהֹב דַּק
  choice: 细黄毛
  rationale: 同时表达 צָהֹב 的黄色和 דַּק 的细幼；“毛”比“头发”更适合兼指头部及胡须部位的毛发。
- source_word: וְטִמֵּא אֹתוֹ
  choice: 宣布那人不洁净
  rationale: 祭司在此作出礼仪上的判定，并非使当事人变得不洁净；“宣布”清楚表达其裁定功能。
- source_word: נֶתֶק
  choice: 癣患
  rationale: 该词指头部或胡须部位的一类特定病患，但准确的现代医学对应不明。“癣患”较通俗，又以脚注防止读者将其等同于某一种已知真菌病。
- source_word: צָרַעַת
  choice: 严重皮肤病
  rationale: 该希伯来词涵盖多种严重皮肤病变，并不必然等于现代汉语通常所说的麻风病；加“严重”可传达它在本章分类中的重大性质。
- source_word: הָרֹאשׁ אוֹ הַזָּקָן
  choice: 头部或胡须部位
  rationale: 忠实保留两个患病部位；“胡须部位”比单说“胡须”更清楚地表明所指是生长胡须处的皮肤。
- source_word: וְהִנֵּה
  choice: 如果发现
  rationale: 在本条诊断法规中，该表达引出祭司察看所得的情形；译作“如果发现”比直译“看哪”更符合现代汉语法律性叙述，同时保留条件与发现的语用作用。
theological_decisions:
- issue: 不洁净的性质
  choice: 译为祭司“宣布”那人不洁净
  alternative: 祭司“使”那人不洁净
  rationale: 原文在祭司法规语境中表示礼仪裁定。此译法不把不洁净误解为祭司造成的身体疾病，也不将其直接等同于道德罪责。
translation_notes:
  register: 采用现代、庄重而易懂的法规叙述。“如果发现”使希伯来语的察看—判定结构在汉语中自然清楚；保留“比皮肤深”“细黄毛”等诊断细节。脚注标记均在正文相应术语后出现。
