base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/032.yaml
  text: And the priest shall examine the diseased area on the seventh day[a], and behold, if the scaly infection has not spread, and there is no yellow hair in it, and the appearance of the scaly infection is not deeper than the skin,
translation:
  language: zh_hans
  text: 第七天，祭司要察看患处；若见这鳞屑斑没有扩散，其中也没有黄色的毛，且这鳞屑斑的外观不显得低于皮肤，
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְרָאָה
  choice: 要察看
  rationale: 在祭司执行辨察程序的语境中，此词不只是“看见”，而是仔细察验；“察看”自然且保留程序意味。
- source_word: הַנֶּגַע
  choice: 患处
  rationale: נֶגַע泛指受病变影响的部位；“患处”简洁明白，也避免套用现代医学上过于具体的诊断名称。
- source_word: וְהִנֵּה
  choice: 若见
  rationale: 该词在此引出察看所得的情形，并与后续判断构成条件关系；“若见”比直译“看哪”更符合现代汉语律例文体。
- source_word: הַנֶּתֶק
  choice: 鳞屑斑
  rationale: 此词指本段所论头皮或胡须部位的一种特定病变；“鳞屑斑”表达其可见形态，同时避免武断地等同于某种现代感染性疾病。
- source_word: לֹא פָשָׂה
  choice: 没有扩散
  rationale: פשה在皮肤病变语境中表示向周围蔓延，“扩散”准确而自然。
- source_word: שֵׂעָר צָהֹב
  choice: 黄色的毛
  rationale: 直译其颜色和毛发这一诊断特征；用“毛”可同时适用于头皮和胡须部位。
- source_word: אֵין עָמֹק מִן הָעוֹר
  choice: 看起来并不比皮肤低陷
  rationale: מַרְאֵה表明这是外观判断；“低陷”清楚表达病变相对皮肤显得更深，而不把视觉观察说成组织深度的现代医学测量。
