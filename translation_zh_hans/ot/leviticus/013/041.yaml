  yaml_path: translation/ot/leviticus/013/041.yaml
  text: And if the front of his head becomes bald[a], he is bald on the forehead; he is clean.
translation:
  language: zh_hans
  text: 如果他头的前部脱发[a]，他是前额秃发的人；他是洁净的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“头前秃发”或“头的前部出现秃发”。希伯来语在此所用的词，与上一节表示头后部或顶部秃发的词不同。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִפְּאַת פָּנָיו
  choice: 头的前部
  rationale: 该短语字面涉及“脸的边缘／前侧”，但在上下文中指头皮前部；译为“头的前部”既自然，也与上一节所述另一部位的秃发相区别。
- source_word: יִמָּרֵט
  choice: 脱了发
  rationale: 该词为尼法勒形式，表示毛发脱落、该处变得光秃；“脱了发”符合现代汉语的诊断语境。
- source_word: רֹאשׁוֹ
  choice: 他的头
  rationale: 按其身体部位的通常含义翻译；与前面的方位短语合译为“他头的前部”。
- source_word: גִּבֵּחַ
  choice: 前额秃
  rationale: 此词专指头部前方的秃发，有别于上一节表示后部或顶部秃发的词；“前额秃”简明地保留这一区别。
- source_word: טָהוֹר
  choice: 洁净
  rationale: 本章讨论祭司对身体状况的判定及其礼仪身份；“洁净”准确保留利未记的礼仪类别，而非泛指身体卫生或道德纯洁。
theological_decisions:
- issue: 洁净条例中的礼仪身份术语
  choice: 洁净
  alternative: 纯洁
  rationale: 本节所判定的是人在礼仪上的身份，不是道德品质；采用“洁净”可避免引入伦理含义。
translation_notes:
  register: 采用现代、庄重而易懂的法律诊断语体；保留原文“他是……”的重复判断结构，并用“前额秃”呈现希伯来语与上一节术语之间的部位区别。
