  text: וְ/הָיָ֞ה בִּ/מְק֤וֹם הַ/שְּׁחִין֙ שְׂאֵ֣ת לְבָנָ֔ה א֥וֹ בַהֶ֖רֶת לְבָנָ֣ה אֲדַמְדָּ֑מֶת וְ/נִרְאָ֖ה אֶל הַ/כֹּהֵֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/019.yaml
  text: and in the place of the boil there develops a white swelling or a reddish-white bright spot[a], then it shall be shown to the priest.
translation:
  language: zh_hans
  text: 原来长疮的地方若出现白色肿胀，或白中带红的亮斑，就要给祭司察看。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“就要被祭司看见。”希伯来语此词字面可指“被看见”或“显现”；在本段关于祭司诊察皮肤病征的条例中，通常理解为把患处呈交祭司察看。
    reason: 保留וְנִרְאָה的被动／显现语义，并说明其在本段诊察程序中的惯常理解。
lexical_decisions:
- source_word: וְהָיָה
  choice: 若出现
  rationale: 这里引出先前疮患所在之处新出现的症状；“若出现”既符合诊断条例的条件语境，也自然表达症状的发生。
- source_word: בִּמְקוֹם הַשְּׁחִין
  choice: 原来长疮的地方
  rationale: שְׁחִין指疮、疖或发炎的疮患；此处说的是该疮患原先所在的部位。
- source_word: שְׂאֵת לְבָנָה
  choice: 白色的肿块
  rationale: שְׂאֵת在本章指皮肤上隆起的病变；“肿块”保留其隆起、肿胀之意，并与בַהֶרֶת区分。
- source_word: בַהֶרֶת לְבָנָה אֲדַמְדָּמֶת
  choice: 白中带红的亮斑
  rationale: בַהֶרֶת指明亮或显眼的斑；לְבָנָה与אֲדַמְדָּמֶת共同描述其白而带红的颜色。
- source_word: וְנִרְאָה אֶל הַכֹּהֵן
  choice: 就要给祭司察看
  rationale: נראה字面可表示“被看见”或“显现”，在本段祭司检验皮肤病变的程序中，自然指把病处交由祭司检查。
