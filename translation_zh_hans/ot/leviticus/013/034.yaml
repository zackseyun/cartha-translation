base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/034.yaml
  text: Then the priest shall examine the scaly infection on the seventh day[a], and if the scaly infection has not spread in the skin and its appearance is not deeper than the skin, the priest shall pronounce him clean[c][b]. He shall wash his clothes and be clean.
translation:
  language: zh_hans
  text: 第七天，祭司要检查那鳞屑患处[a]；如果患处没有在皮肤上扩散，外观也不低于皮肤[b]，祭司就要定他为洁净[c]。他要洗衣服，便为洁净。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “鳞屑患处”所译的希伯来语指一种受祭司检验的特定皮肤病变；也可按传统译作“癣”，但无法确定它相当于哪一种现代医学所定义的疾病。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“它的外观不深于皮肤”，指患处看起来没有低于周围皮肤表面。
    reason: cultural_note
  - marker: c
    text: “定他为洁净”指祭司正式判定那人的礼仪身份，并不是说祭司医好了他的病。
    reason: alternative_reading
lexical_decisions:
- source_word: נֶתֶק
  choice: 脱发患处
  rationale: 该词在利未记13章特指头部或胡须部位伴随毛发脱落、受祭司检验的病变；此译避免套用现代医学诊断，也比泛称“皮肤病”更具体。
- source_word: פָשָׂה
  choice: 扩散
  rationale: 在本章检验语境中，指患处在皮肤范围内向外蔓延。
- source_word: בָּעוֹר
  choice: 在皮肤上
  rationale: 现代汉语以“在皮肤上扩散”自然表达病变在皮肤区域蔓延；不暗示其深入皮下组织。
- source_word: מַרְאֵהוּ אֵינֶנּוּ עָמֹק מִן־הָעוֹר
  choice: 看起来也不比皮肤低陷
  rationale: מַרְאֵהוּ 强调可见外观；“低陷”表达病变未显得低于周围皮肤，而非断言其实际解剖深度。
- source_word: וְטִהַר אֹתוֹ הַכֹּהֵן
  choice: 祭司就要宣布那人为洁净
  rationale: 此处是祭司对礼仪洁净身份作出正式判定，并非祭司医治病症或亲自使人洁净。
- source_word: וְכִבֶּס בְּגָדָיו
  choice: 那人要洗净衣服
  rationale: 明确主语为受检者，并以自然现代汉语保留规定的洗衣行动。
- source_word: וְטָהֵר
  choice: 便为洁净
  rationale: 表达洗衣之后所得的礼仪洁净状态，同时保留法律条文的简洁语气。
- source_word: וְרָאָה
  choice: 检查
  rationale: 在祭司执行规定程序的语境中，不只是“看见”，而是正式察看。
- source_word: וְהִנֵּה
  choice: 如果
  rationale: 该词在检验公式中引出所观察到的情况；汉语用条件句自然呈现其逻辑功能。
theological_decisions:
- issue: 祭司在洁净条例中的行为性质
  choice: 祭司正式宣布受检者为洁净
  alternative: 祭司使他洁净／洁净他
  rationale: 希伯来语 טהר 在此法律与礼仪语境中指对洁净身份作出裁定；这样翻译避免暗示祭司施行医治或以某种仪式能力造成洁净。
translation_notes:
  register: 采用现代、庄重而易懂的法规叙述语体。“脱发患处”结合本段头部或胡须部位的语境传达 נֶתֶק 的特指性；脚注保留词义及医学对应上的不确定性。主文依希伯来语次序呈现第七日检查、未扩散与未低陷的标准、祭司判定、洗衣及最终洁净状态。
