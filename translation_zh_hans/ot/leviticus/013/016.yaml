  text: א֣וֹ כִ֥י יָשׁ֛וּב הַ/בָּשָׂ֥ר הַ/חַ֖י וְ/נֶהְפַּ֣ךְ לְ/לָבָ֑ן וּ/בָ֖א אֶל הַ/כֹּהֵֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/016.yaml
  text: Or if the raw flesh turns back and becomes white[a], then he shall come to the priest.
translation:
  language: zh_hans
  text: 或者，若活肉重新变白，他就要到祭司那里。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: א֣וֹ כִ֥י
  choice: 或者，若
  rationale: אוֹ引出诊断程序中的另一种情形，כִּי在此构成条件句；译为“或者，若”既保留选择关系，也清楚表达条件。
- source_word: יָשׁ֛וּב
  choice: 恢复
  rationale: שׁוב表示返回先前状态；结合下文“变成白色”，译为“恢复”自然地表达患处状况的逆转，同时不额外判定其医学性质。
- source_word: הַבָּשָׂר הַחַי
  choice: 那鲜肉
  rationale: 字面为“活的肉”，在本章语境中指皮肤病患处可见的鲜活、未被白色覆盖的肉。“鲜肉”比字面直译更符合现代汉语，但以脚注保留原文字面信息。
- source_word: וְנֶהְפַּךְ לְלָבָן
  choice: 变成白色
  rationale: הפך的Nifal形式表示状态发生改变，לבן是白色；“变成白色”简洁保留结果性含义。
- source_word: וּבָא אֶל הַכֹּהֵן
  choice: 他就要到祭司那里
  rationale: 表达条件成立后诊断程序中的下一步；“就要”体现承接和规范性，又不把动作强化为原文未明说的严厉命令。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的法规叙述语体。“鲜肉”依上下文指患处显露的鲜活组织，并非日常所说供食用的新鲜肉类；脚注保留希伯来语的字面表达。
