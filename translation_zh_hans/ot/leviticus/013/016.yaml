  source_fidelity: “恢复”未说明恢复到何种状态，且与随后“变成白色”衔接不够清楚。יַשׁוּב与“重新”相配，可表达患处状态的回转；נֶהְפַּךְ לְלָבָן则明确译为“变白”。
  naturalness: “那鲜肉恢复，变成白色”在现代汉语中略显生硬，“鲜肉”也容易首先令人联想到食物。采用本章诊断语境中较为稳妥的“活肉”，并以“重新变白”使句子简洁自然。
  terminology: “活肉”保留该段落的技术性皮肤病诊断用语，避免把原文含义过度医学化；脚注保留“活的肉”这一字面表达。 “祭司”准确。
