  rationale: 修订删除正文中原文未明说的“若”，并将“全都变白”的主体明确为“他的全身”，以贴近希伯来文与本段的身体检查语境。保留“判定患病的人为洁净”的自然汉语表达，并把脚注标记移至该意译短语之后，说明原文宾语的字面形式。
