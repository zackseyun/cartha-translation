  text: וְ/רָאָ֣ה הַ/כֹּהֵ֗ן וְ/הִנֵּ֨ה כִסְּתָ֤ה הַ/צָּרַ֨עַת֙ אֶת כָּל בְּשָׂר֔/וֹ וְ/טִהַ֖ר אֶת הַ/נָּ֑גַע כֻּלּ֛/וֹ הָפַ֥ךְ לָבָ֖ן טָה֥וֹר הֽוּא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/013.yaml
  text: and the priest examines him[a], and behold, the skin disease has covered all his flesh, then he shall pronounce the affected person clean; all of it has turned white[b]; he is clean.
translation:
  language: zh_hans
  text: 祭司察看，看哪，皮肤病已经遍满他的全身，他就要判定患病的人[a]为洁净；他的全身都变白了，他是洁净的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “患病的人”：原文直译为“病症”或“患处”；这里的洁净判定适用于带有该病症的人。
    reason: alternative_reading
lexical_decisions:
- source_word: וְרָאָה
  choice: 要察看
  rationale: 在祭司检验皮肤病的律法语境中，该动词不只是“看见”，而是作出仔细察验；“察看”自然保留其程序性含义。
- source_word: הַצָּרַעַת
  choice: 皮肤病
  rationale: צָרַעַת 在利未记中涵盖多种皮肤病症，不能直接等同于现代所说的麻风病；“皮肤病”避免不当的医学限定。
- source_word: אֶת כָּל בְּשָׂרוֹ
  choice: 他的全身
  rationale: בָּשָׂר 字面为“肉身”，此处指身体表面；现代汉语用“全身”更自然，并准确表达覆盖范围。
- source_word: וְטִהַר
  choice: 就要判定……为洁净
  rationale: 该词在祭司洁净条例中表示作出洁净裁定，并非通过某种行动使人得到洁净；“判定……为洁净”体现其宣告和司法性质。
- source_word: אֶת הַנָּגַע
  choice: 患病的人
  rationale: 希伯来语字面宾语是“病症、患处”，但洁净裁定落实在带有病症的人身上。正文采用自然汉语表达，并以脚注保留原文形式。
- source_word: כֻּלּוֹ הָפַךְ לָבָן
  choice: 那病已全都变白了
  rationale: 保留“全部”这一强调及变白的结果状态；“那病”承接前述皮肤病，使代词所指在汉语中清楚。
- source_word: טָהוֹר הוּא
  choice: 他是洁净的
  rationale: “洁净”是利未记礼仪洁净术语的标准译法；不额外加入“礼仪上”，以免把解释写入正文。
theological_decisions:
- issue: צָרַעַת 的译法
  choice: 皮肤病
  alternative: 麻风病；恶性皮肤病；音译“察拉阿特”
  rationale: 原词所指比现代汉森病更广。采用“皮肤病”既符合本段身体检验的语境，又不造成虚假的医学精确性。
- issue: 祭司在 וְטִהַר 中所作的行为
  choice: 判定患病的人为洁净
  alternative: 使他洁净；判定病症为洁净
  rationale: 祭司在此作出洁净身份的裁决，而不是医治或施行洁净。译文明确其宣告性质，同时脚注交代原文宾语的表达。
- issue: 全面变白与洁净结论之间的张力
  choice: 直接保留“全都变白了；他是洁净的”
  alternative: 补充其医学或礼仪原因
  rationale: 经文给出看似反直觉的律法判准，却没有解释原因；译文不替原文补充医学推断或神学说明。
translation_notes:
  register: 采用现代、庄重而易懂的律法体。“看哪”保留 וְהִנֵּה 指向祭司所见结果的提示作用。正文只设一个脚注，并已在相关句末标出 [a]。
