  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: אָדָ֗ם כִּֽי יִהְיֶ֤ה בְ/עוֹר בְּשָׂר/וֹ֙ שְׂאֵ֤ת אֽוֹ סַפַּ֨חַת֙ א֣וֹ בַהֶ֔רֶת וְ/הָיָ֥ה בְ/עוֹר בְּשָׂר֖/וֹ לְ/נֶ֣גַע צָרָ֑עַת וְ/הוּבָא֙ אֶל אַהֲרֹ֣ן הַ/כֹּהֵ֔ן א֛וֹ אֶל אַחַ֥ד מִ/בָּנָ֖י/ו הַ/כֹּהֲנִֽים־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/002.yaml
  text: When a man has on the skin of his body a swelling[a], or a scab, or a bright spot, and it becomes on the skin of his body an infection of skin disease, then he shall be brought to Aaron the priest, or to one of his sons the priests.
translation:
  language: zh_hans
  text: “人身上的皮肤若出现肿块、疹子或亮斑，而在他身上的皮肤上成了皮肤病的病斑[a]，就要把他带到祭司亚伦或亚伦的一个担任祭司的儿子那里。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 传统译作“麻风病”或“大麻风”。希伯来语“צָרָעַת”（察拉阿特）所指的范围更广，不应自动等同于现代所说的汉森病。
    reason: 说明传统译法，并避免读者误作特定的现代医学诊断。
lexical_decisions:
- source_word: אָדָם
  choice: 人
  rationale: 这是个案律例中泛指的单数，现代汉语用“人”自然、准确，不限定性别。
- source_word: בְּעוֹר בְּשָׂרוֹ
  choice: 身上的皮肤
  rationale: 保留“皮肤”与身体的具体关系，同时避免生硬直译为“肉体的皮”。原文重复此短语，译文也予以保留。
- source_word: שְׂאֵת
  choice: 肿块
  rationale: 表达皮肤隆起之处；“肿块”具体易懂，又不强行作现代医学诊断。
- source_word: סַפַּחַת
  choice: 疹子
  rationale: 该词所指的具体皮损并不确定；“疹子”比“痂”涵盖面稍广，可自然表示皮肤上出现的病变。
- source_word: בַּהֶרֶת
  choice: 亮斑
  rationale: 保留词根所表达的明亮、发亮特征，不擅自限定为白色斑块。
- source_word: לְנֶגַע צָרָעַת
  choice: 形成皮肤病的病斑
  rationale: “病斑”表达 נֶגַע 在本语境中的受损部位；“皮肤病”表达 צָרָעַת 在本节中的病症类别，同时避免把它直接等同于现代汉森病。
- source_word: וְהוּבָא
  choice: 就要把他带到
  rationale: 用自然的汉语处置式表达希伯来语被动形式及律例中的程序要求。
- source_word: אַהֲרֹן הַכֹּהֵן
  choice: 祭司亚伦
  rationale: 按现代汉语习惯将职衔置于人名前。
- source_word: אַחַד מִבָּנָיו הַכֹּהֲנִים
  choice: 亚伦作祭司的一个儿子
  rationale: 清楚保留亲属关系，并表明所指的儿子具有祭司身份。
theological_decisions:
- issue: צָרָעַת 的译法
  choice: 皮肤病
  alternative: 麻风病／大麻风
  rationale: 该希伯来词在祭司条例中指一类需要辨察的病症或灾患，范围不能自动等同于现代汉森病。本节所述对象是人体皮肤，因此正文采用“皮肤病”，传统译法则在脚注中说明。
translation_notes:
  register: 采用现代、庄重而易懂的律例语言。保留原文两次提到“身上的皮肤”的重复；不用过度专业化的现代皮肤科术语，也不以传统“麻风病”缩窄原词含义。
