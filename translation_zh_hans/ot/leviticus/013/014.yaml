id: LEV.13.14
reference: Leviticus 13:14
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וּ/בְ/י֨וֹם הֵרָא֥וֹת בּ֛/וֹ בָּשָׂ֥ר חַ֖י יִטְמָֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/014.yaml
  text: But on the day living flesh appears in it, he shall be unclean.
translation:
  language: zh_hans
  text: 但活肉在患处显露的那一天，他就不洁净。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְיוֹם
  choice: 但……的那一天
  rationale: וְ在本段语境中表示转折，בְיוֹם直译为“在……的日子”，用“……的那一天”符合现代汉语表达。
- source_word: הֵרָאוֹת
  choice: 显露
  rationale: 尼法勒不定式表示“被看见、显现”；“显露”既自然，也保留该处自行出现、可被观察到的含义。
- source_word: בּוֹ
  choice: 在患处
  rationale: 代词所指是前文所述病变或患处，而非患者本人；明示为“患处”可避免中文误解，并与最新修订所强调的“in it”一致。
- source_word: בָּשָׂר חַי
  choice: 活肉
  rationale: 指显露出来的活的、生嫩的肉；采用利未记皮肤病检验语境中简洁而具体的“活肉”。
- source_word: יִטְמָא
  choice: 他就不洁净
  rationale: 未完成式在此表达判定结果；主语是受检者。“不洁净”保留礼仪状态含义，不改写成一般卫生意义的“不干净”。
theological_decisions:
- issue: 不洁净的性质
  choice: 不洁净
  alternative: 有罪／不干净
  rationale: טמא在此指律法规定的礼仪性不洁状态，并不等同于道德犯罪或普通卫生问题。
- issue: בּוֹ的指代
  choice: 在患处
  alternative: 在他身上
  rationale: 上下文描述病变中出现活肉，故将代词理解为指向病变或患处；此译法避免把活肉仅泛化为出现在患者身体上。
translation_notes:
  register: 采用现代、庄重且易懂的法规叙述语体；句式简洁，保留原文由征象直接导向不洁判定的结构。
