base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/027.yaml
  text: And the priest shall examine him on the seventh day. If it has indeed spread in the skin, the priest shall pronounce him unclean; it is an infection of skin disease.
translation:
  language: zh_hans
  text: 到第七天，祭司要察看他。若患处确实在皮肤上扩散，祭司就要宣布他为不洁净；这是皮肤病[a]的病变。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 传统译作“麻风病”。这里的希伯来词所指范围较广，是以色列洁净条例中所界定的一类皮肤病症，并不一定是现代医学所说的麻风病（汉森病）。
    reason: 说明传统译法，并避免把古代礼仪分类误认为现代医学上的单一疾病。
lexical_decisions:
- source_word: וְרָאָהוּ
  choice: 要察看他
  rationale: רָאָה字面义为“看”，但在祭司查验病症的程序中指仔细察看；“察看”既保留视觉查验之意，也符合现代汉语。
- source_word: בַּיּוֹם הַשְּׁבִיעִי
  choice: 到第七天
  rationale: 准确表达规定的第七日复查时间；结合前文隔离期，“到第七天”比孤立的“在第七天”更自然。
- source_word: אִם פָּשֹׂה תִפְשֶׂה
  choice: 若……确实……扩散
  rationale: 以“确实”体现不定式绝对形与限定动词连用所带的强调语气。
- source_word: בָּעוֹר
  choice: 在皮肤上
  rationale: עוֹר指皮肤；汉语描述患处蔓延时，“在皮肤上扩散”自然清楚。
- source_word: וְטִמֵּא ... אֹתוֹ
  choice: 祭司就要宣布他为不洁净
  rationale: 此处是祭司作出礼仪洁净方面的判定，并非使当事人变得不洁净；“宣布……为”准确表达裁定功能。
- source_word: נֶגַע
  choice: 患处
  rationale: 本词在利未记13章指可观察、须查验的病变或斑痕；“患处”具体且不强加现代医学诊断。
- source_word: צָרַעַת
  choice: 皮肤病
  rationale: 该希伯来词涵盖的病症比现代医学所谓麻风病更广；“皮肤病”适合本节的人体皮肤语境，并以脚注说明传统译法及语义范围。
- source_word: הִוא
  choice: 这是
  rationale: 阴性代词回指前述病症，用“这是”自然地作出识别判断。
theological_decisions:
- issue: 礼仪条例中צָרַעַת的译法
  choice: 皮肤病
  alternative: 麻风病
  rationale: 原词不能与现代汉语中专指汉森病的“麻风病”完全等同。正文避免作时代错置的医学诊断，脚注则保留传统译法，说明其范围。
- issue: 祭司使人“不洁净”还是判定人为“不洁净”
  choice: 宣布他为不洁净
  alternative: 使他不洁净
  rationale: 上下文描述祭司查验后作出礼仪身份判定；采用“宣布”避免暗示祭司本身造成不洁净。
translation_notes:
  register: 采用现代、庄重而易懂的法规叙述语体。“察看”“宣布……为不洁净”体现祭司查验和裁定的程序；保留原文强调语气，并避免使用会造成现代医学误解的专名。
