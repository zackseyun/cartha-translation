id: LEV.13.3
reference: Leviticus 13:3
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/רָאָ֣ה הַ/כֹּהֵ֣ן אֶת הַ/נֶּ֣גַע בְּ/עֽוֹר הַ֠/בָּשָׂר וְ/שֵׂעָ֨ר בַּ/נֶּ֜גַע הָפַ֣ךְ לָבָ֗ן וּ/מַרְאֵ֤ה הַ/נֶּ֨גַע֙ עָמֹק֙ מֵ/ע֣וֹר בְּשָׂר֔/וֹ נֶ֥גַע צָרַ֖עַת ה֑וּא וְ/רָאָ֥/הוּ הַ/כֹּהֵ֖ן וְ/טִמֵּ֥א אֹתֽ/וֹ־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/003.yaml
  text: And the priest shall examine the diseased spot on the skin of the body[a], and if the hair in the spot has turned white and the appearance of the spot is deeper than the skin of his body, it is a diseased spot of skin disease; when the priest has examined him, he shall pronounce him unclean.
translation:
  language: zh_hans
  text: 祭司要察看他皮肤上的患处。若患处的毛已经变白，患处看起来比周围皮肤凹陷，这就是皮肤病[a]的患处。祭司察看那人后，要宣布他不洁净。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“麻风病”或“大麻风”。希伯来语צָרַעַת指古代以色列礼仪条例中的一类状况，范围比现代所说的麻风病（汉森病）更广。
    reason: 说明传统译法，并避免将希伯来语术语无保留地等同于现代医学诊断。
lexical_decisions:
- source_word: נֶגַע
  choice: 患处
  rationale: 本节指祭司所察看的可见皮肤异常区域。“患处”自然、准确，也避免把该词过度限定为现代医学意义上的感染或某一种疾病。
- source_word: בְּעוֹר הַבָּשָׂר
  choice: 身上皮肤
  rationale: עוֹר意为“皮肤”，בָּשָׂר在此指人的身体。“身上皮肤”符合现代汉语表达，并保留解剖意义。
- source_word: שֵׂעָר
  choice: 毛
  rationale: 此处指患处皮肤上可观察到的体毛；汉语用“毛”比泛指头发的“头发”准确。
- source_word: הָפַךְ לָבָן
  choice: 已经变白
  rationale: 表达完成动词所呈现的结果状态：祭司察看时，毛已发生颜色变化。
- source_word: מַרְאֵה הַנֶּגַע עָמֹק מֵעוֹר בְּשָׂרוֹ
  choice: 患处看起来深于皮肤
  rationale: 保留מַרְאֵה的视觉判断性质，不把表象直接断定为实际组织深度；“深于皮肤”也保留原文比较结构。
- source_word: נֶגַע צָרַעַת
  choice: “察拉病”的患处
  rationale: 用音译“察拉病”保留古代以色列洁净条例中特有的诊断类别，避免将其误等同于现代汉森病，也避免“皮肤病的患处”在汉语中的含混和重复。脚注说明传统译法与词义范围。
- source_word: וְרָאָהוּ
  choice: 祭司察看那人后
  rationale: 后缀可依语境理解为受检者；用时间顺序表达察看之后作出判定，避免汉语中的生硬重复。
- source_word: וְטִמֵּא אֹתוֹ
  choice: 要宣布他不洁净
  rationale: 在祭司条例中，这是对礼仪状态作出的权威判定，而不是祭司使那人变得不洁净。“宣布”准确表达其宣告性质。
theological_decisions:
- issue: צָרַעַת在利未记洁净条例中的译法
  choice: “察拉病”
  alternative: 麻风病；皮肤病
  rationale: 该希伯来词所指范围比现代汉森病更广，也可用于衣物和房屋，不能无保留地等同于“麻风病”。音译并加脚注既保留古代礼仪分类，也不强加现代医学诊断。
- issue: 祭司在וְטִמֵּא אֹתוֹ中的作用
  choice: 宣布他不洁净
  alternative: 使他不洁净；判定他不洁净
  rationale: 上下文描述察看和裁定。祭司宣告受检者的礼仪状态，并非造成其不洁净；“宣布”保留法律和礼仪上的权威宣告。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“患处”“察看”“宣布不洁净”适合祭司检验和礼仪裁定的语境；以音译加脚注处理无精确现代对应词的צָרַעַת。
