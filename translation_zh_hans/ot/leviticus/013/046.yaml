  text: כָּל יְמֵ֞י אֲשֶׁ֨ר הַ/נֶּ֥גַע בּ֛/וֹ יִטְמָ֖א טָמֵ֣א ה֑וּא בָּדָ֣ד יֵשֵׁ֔ב מִ/ח֥וּץ לַֽ/מַּחֲנֶ֖ה מוֹשָׁבֽ/וֹ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/046.yaml
  text: All the days that the disease is in him[a], he shall be unclean. He is unclean. He shall live alone[b]; his dwelling shall be outside the camp.
translation:
  language: zh_hans
  text: 在他身上有这病状的一切日子，他就不洁净；他是不洁净的[a]。他要独自居住；他的住处要在营外[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里的“不洁净”是利未记律法所规定的身份，并不必然表示这个人在道德上有罪。
    reason: cultural_note
  - marker: b
    text: “病状”也可译作“病患”或“病变”。希伯来语原词含义较广；在本章指经察验确认、并带来不洁净身份的病状。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנֶּגַע
  choice: 灾病
  rationale: נֶגַע泛指击打、灾患或病变；在利未记13章指经察验确认、并带来不洁净身份的病状。“灾病”既保留词义的广度，也避免把它限定为现代医学所说的某一种疾病。
- source_word: בּוֹ
  choice: 在他身上
  rationale: 介词ב可表示“在……里面／上面”。此处所指病状显现在人的身体上，译作“在他身上”自然，也保留原文可能涵盖的空间关系。
- source_word: יִטְמָא
  choice: 他是不洁净的
  rationale: טמא的Qal未完成式在法规语境中陈述持续有效的身份；中文用“是不洁净的”自然表达此法律状态，不额外加入“礼仪上”等解释词。
- source_word: טָמֵא הוּא
  choice: 他是不洁净的
  rationale: 原文以独立的无动词分句强调并重申其不洁净身份；保留为单独一句，以呈现重复和强调。
- source_word: בָּדָד
  choice: 独自
  rationale: בָּדָד表示单独、与人分离；“独自”直接而庄重，不将原文进一步解释为现代临床意义上的“隔离”。
- source_word: יֵשֵׁב
  choice: 居住
  rationale: ישב可指坐、停留或居住；此处与住处及营外的位置相连，“居住”准确表达持续居留。
- source_word: מִחוּץ לַמַּחֲנֶה
  choice: 在营外
  rationale: 该短语指以色列营地之外；“在营外”简洁、自然，并保留旷野营地背景。
- source_word: מוֹשָׁבוֹ
  choice: 他的住处
  rationale: מוֹשָׁב指居住之处；“他的住处”具体清楚，也与前面的“居住”形成自然呼应。
theological_decisions:
- issue: 利未记13章中“不洁净”的性质
  choice: 正文译作“不洁净”，不添加“礼仪上”或“道德上”的限定。
  alternative: 礼仪上不洁净／宗教礼仪上不洁净
  rationale: 原文只陈述טמא所表示的不洁净身份。上下文属于利未记律法体系，但正文若添加限定会缩窄原文；注释可说明这并不必然表示道德罪责。
- issue: 重复句טָמֵא הוּא的强调作用
  choice: 保留“他是不洁净的”这一独立重复句。
  alternative: 合并为“他一直是不洁净的”
  rationale: 合并虽较简练，却会消除希伯来文刻意的重申和强调；保留重复更忠实于原文结构与法律宣告的力度。
translation_notes:
  register: 采用现代、庄重而易懂的法规语体。保留原文对“不洁净”的重复强调；用“灾病”呈现נֶגַע的宽泛含义，用“独自居住”避免过度医学化。脚注标记置于全节末尾，涵盖正文中的词义及文化背景说明。
