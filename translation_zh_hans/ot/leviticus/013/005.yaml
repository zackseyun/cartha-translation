base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/005.yaml
  text: And the priest shall examine him on the seventh day[a], and behold, if the spot has remained unchanged in his sight and the spot has not spread in the skin[c][b], then the priest shall isolate him for seven days a second time.
translation:
  language: zh_hans
  text: 第七天，祭司要察看他。看哪，患处[a]在祭司看来仍旧没有变化[b]，也没有在皮肤上扩散，祭司就要把他隔离[c]，再隔离七天。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “患处”也可译作“灾病处”或“斑痕”。希伯来语נגע在这里指祭司所察看的可见异常，不一定对应现代医学所界定的某种疾病。
    reason: lexical_alternative
  - marker: b
    text: 直译：“患处站在他眼中”，意思是祭司看来患处没有变化。
    reason: lexical_alternative
  - marker: c
    text: “隔离”也可译作“拘禁”；原文较直译为“把他关起来”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאָהוּ
  choice: 祭司要察看他
  rationale: ראה本义为“看”，但在本章祭司进行礼仪性查验的程序中，译作“察看”既体现检验含义，又不赋予现代医学诊断的意味。
- source_word: הַנֶּגַע
  choice: 患处
  rationale: נגע在此指祭司所察看的可见皮肤异常。“患处”具体自然，同时避免把它直接等同于某种现代医学疾病。
- source_word: עָמַד בְּעֵינָיו
  choice: 在祭司看来仍旧没有变化
  rationale: 希伯来语直译为“站在他眼中”，是指祭司复查时所见的状况保持不变；明说“祭司”可消除中文代词所指不清。
- source_word: לֹא פָשָׂה הַנֶּגַע בָּעוֹר
  choice: 也没有在皮肤上扩散
  rationale: פשׂה在本段表示患处向外扩展；“在皮肤上扩散”符合现代汉语表达。
- source_word: וְהִסְגִּירוֹ
  choice: 把他隔离
  rationale: סגר的使役式表示关起来或限制其接触范围。“隔离”准确传达程序性分开，又不像“检疫”那样过度引入现代公共卫生制度。
- source_word: שִׁבְעַת יָמִים שֵׁנִית
  choice: 再隔离七天
  rationale: שֵׁנִית表明这是第二个七天的隔离期；此译简洁地保留重复之意。
theological_decisions:
- issue: 本节所述皮肤状况的性质
  choice: 采用“患处”，不将其认定为特定疾病
  alternative: 译作“疾病”“麻风病”或具体医学病名
  rationale: 原文נגע是礼仪查验中的广义可见异常，本节本身没有提供足以确诊现代疾病的证据；保留其范围可避免把礼仪分类误作现代医学诊断。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“看哪”保留וְהִנֵּה提示读者注意查验结果的语篇功能；“察看”“患处”“隔离”适合普通读者理解，同时避免过度医学化。
