revisions:
- from: 或者，人的肉体[a]若在皮肤上被火烧伤，而烧伤处的活肉[b]变成亮斑，白中带红或呈白色，
  to: 或者，若有人皮肤上有火烧的伤，而烧伤处的活肉[a]变成白中带红或白色的亮斑，
  rationale: 修订消除了“肉体”与“皮肤”之间不自然且可能误导的句法关系，改以“有人皮肤上有火烧的伤”准确表达原文病例条件。其余关键术语和本节承接下文的未完句式均予保留。原草稿的 a 注释是对英译“body／flesh”取舍的说明；修订正文不再使用“肉体”，故不保留该注释。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T04:50:45Z'
review_pass:
  verdict: revise
  source_fidelity: 原文以“或者，若……”引出另一种诊断情形：人的皮肤上有火烧伤，烧伤处的“活肉／活组织”呈现为亮斑，其颜色或白中带红，或为白色。草稿基本传达了这些要素，但“人的肉体若在皮肤上被火烧伤”将“肉体”作“被烧伤”的主语，修饰关系不够清楚；原文所指是皮肤上有火烧伤。
  naturalness: “人的肉体若在皮肤上被火烧伤”在现代汉语中略显别扭，容易令人理解为肉体在皮肤之上被烧伤。改为“若有人皮肤上有火烧的伤”更自然、清楚，也保持条例式语气。颜色描述宜直接修饰“亮斑”，使句法关系明确。
  terminology: “活肉”可保留，既对应本章诊断语境中的 מִחְיָה，也避免以特定现代医学病名或病理判断替代原文。“亮斑”适合对应 בַּהֶרֶת。“白中带红”准确表达以白为主而带红的混合色；“或白色”保留另一种可能。
  issues:
  - severity: medium
    issue: “人的肉体若在皮肤上被火烧伤”句法关系含混。
    rationale: 希伯来文的“肉／身体”与“其皮肤”构成所属关系，描述的是皮肤上有火烧伤；中文现译容易把“肉体”理解为在皮肤表面被烧伤，表达不自然且不够准确。
  - severity: low
    issue: 颜色短语与“亮斑”的修饰关系可更明确。
    rationale: 将“白中带红或呈白色”直接置于“亮斑”之前，可清楚反映原文中颜色对亮斑的描述。
  revised_text: 或者，若有人皮肤上有火烧的伤，而烧伤处的活肉[a]变成白中带红或白色的亮斑，
  revised_footnotes:
