base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/024.yaml
  text: Or if the body has on its skin a burn from fire[a], and the raw flesh of the burn becomes a bright spot, reddish-white or white[b],
translation:
  language: zh_hans
  text: 或者，若有人皮肤上有火烧的伤，而烧伤处的活肉[a]变成白中带红或白色的亮斑，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “活肉”所译的希伯来语表达，指烧伤处显露的活组织。
    reason: cultural_note
lexical_decisions:
- source_word: אוֹ
  choice: 或者……若
  rationale: 引出诊断条例中的另一种情形；把转折选择词与条件句式结合，符合现代汉语法律叙述。
- source_word: בָשָׂר
  choice: 人的肉体
  rationale: 本词通常指“肉、肉体”，此处指人的身体组织；译作“人的肉体”既保留原词的具体性，也避免把它误解为泛指尸肉或食用肉。
- source_word: בְּעֹרוֹ
  choice: 在皮肤上
  rationale: 介词结构描述烧伤所在的位置；现代汉语用“在皮肤上”自然清楚，无须沿用希伯来语的阳性代词。
- source_word: מִכְוַת אֵשׁ
  choice: 被火烧伤
  rationale: 该结构指火造成的烧伤；用动词性表达与“若”构成自然的病例条件句。
- source_word: וְהָיְתָה
  choice: 变成
  rationale: 在程序性病例描述中表示随之出现的状态变化，译作“变成”准确而顺畅。
- source_word: מִחְיַת הַמִּכְוָה
  choice: 烧伤处的活肉
  rationale: מִחְיָה在本章皮肤病诊断语境中指伤处显露的活组织；“活肉”保留原文措辞，并以脚注说明其医学语境。
- source_word: בַּהֶרֶת
  choice: 亮斑
  rationale: 指皮肤上明显发亮的斑点或斑块；“亮斑”简洁，并便于在本章相关诊断术语中保持一致。
- source_word: לְבָנָה אֲדַמְדֶּמֶת
  choice: 白中带红
  rationale: 两个形容词共同描述混合色泽；“白中带红”比生硬的“红白色”更符合现代汉语，同时保留白色为主要特征。
- source_word: אוֹ לְבָנָה
  choice: 或呈白色
  rationale: 如实保留另一种颜色表现，并用“呈”使医学观察语气自然。
theological_decisions: []
translation_notes:
  register: 采用庄重而清楚的现代标准汉语，保留条例式条件结构及本节未完句的逗号结尾，以便与下一节衔接；医学术语不过度现代化，也不把原文“活肉”的含义收窄为某一种特定病理状态。
