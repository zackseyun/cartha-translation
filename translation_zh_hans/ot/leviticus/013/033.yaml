base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/033.yaml
  text: then he shall shave himself[a], but he shall not shave the scaly spot[b]; and the priest shall isolate the scaly spot for seven days a second time.
translation:
  language: zh_hans
  text: 那人要剃去毛发[a]，但不可剃这脱发性患处[b]；祭司要把有这患处的人再隔离七天。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文形式可指那人自己剃，也可包括让别人替他剃。
    reason: lexical_alternative
  - marker: b
    text: “脱发性患处”原文指头部或胡须部位一种伴随脱发的病变。经文直说不可剃这患处，可能是要保留患处的毛发，以便祭司复查。后半句原文在语法上以“这患处”为宾语；正文按该诊察程序的实际对象，译作隔离有这患处的人。
    reason: lexical_and_cultural_note
lexical_decisions:
- source_word: וְהִתְגַּלָּח
  choice: 那人要剃去毛发
  rationale: התגלח是גלח的Hitpael形式，表示当事人剃毛发，也可包括使人替他剃；中文不必强行说明由谁动手。“要”符合礼仪条例的程序性语气。
- source_word: הַנֶּתֶק
  choice: 脱发性患处
  rationale: נתק在本章特指头部或胡须部位的一类病变，并与脱发有关；“脱发性患处”比“痒处”准确，也避免把它武断诊断为现代医学所说的某一种癣病。
- source_word: וְאֶת הַנֶּתֶק לֹא יְגַלֵּחַ
  choice: 但不可剃脱发性患处
  rationale: 希伯来文以直接宾语标记明确说不可剃该患处；译文保留这一直接表达，不在正文中改成“不可剃患处周围”。
- source_word: וְהִסְגִּיר
  choice: 隔离
  rationale: 在利未记13章的诊察程序中，这个动词指暂时分隔以待复查；“隔离”现代、清楚，又不像“检疫”那样带入过强的现代公共卫生含义。
- source_word: שֵׁנִית
  choice: 第二次
  rationale: 明确指出这是第二个七天的隔离观察期，比单译“再”更精确。
theological_decisions:
- issue: 隔离的语法宾语
  choice: 正文译作“把有这患处的人……隔离”
  alternative: 直译为“把这脱发性患处隔离”
  rationale: 希伯来文在语法上以“脱发性患处”为宾语，但实际执行隔离的是患病者；中文若说隔离患处容易被理解为只遮盖身体局部。正文表达程序的实际对象，脚注保留原文形式。
translation_notes:
  register: 采用现代、庄重而易懂的法规语体。“脱发性患处”是描述性译法，保留古代病症与现代医学诊断之间的不确定性；语序将“第二次”置于“隔离”前，使中文自然，并清楚表明这是第二轮七天隔离。
