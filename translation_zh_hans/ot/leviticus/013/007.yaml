base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/007.yaml
  text: But if the scaly eruption indeed spreads on the skin after he has shown himself to the priest for his cleansing[c][b][a], then he shall appear before the priest a second time.
translation:
  language: zh_hans
  text: 但在他为了得洁净[c]到祭司面前受察看之后，若那皮疹[a]确实[b]在皮肤上扩散，他就要再次到祭司面前受察看。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“疹子”“皮肤病变”，传统上也有译作“痂”的。希伯来词指正在接受察验的一种表浅皮肤症状。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文用重复词根的结构加强语气，直译近于“果真扩散”或“一再扩散”。
    reason: lexical_alternative
  - marker: c
    text: “为了得洁净”指接受察验，以便被判定为洁净的过程或目的。
    reason: cultural_note
lexical_decisions:
- source_word: פָּשֹׂה תִפְשֶׂה
  choice: 确实扩散开来
  rationale: 不定式绝对式与未完成式连用，强化“扩散”的语气；“确实”保留这一强调，又符合现代汉语表达。
- source_word: הַמִּסְפַּחַת
  choice: 皮疹
  rationale: 本词指祭司正在察验的一种表浅皮肤病变。“皮疹”较为宽泛，不把它武断限定为真菌性癣病或伤口结成的痂。
- source_word: בָּעוֹר
  choice: 在皮肤上
  rationale: 准确表达病变所在部位；原文没有明示所属关系，因此不增译为“他的皮肤”。
- source_word: אַחֲרֵי הֵרָאֹתוֹ
  choice: 在他……让祭司察看之后
  rationale: ראה的尼法勒式在此祭司检验程序中带有被察看或使自己受察看的意味；此译清楚表达当事人接受检查的行动。
- source_word: אֶל הַכֹּהֵן
  choice: 让祭司察看／到祭司面前
  rationale: 介词表示来到祭司那里接受检验；按两处上下文分别采用自然的汉语措辞，同时保留同一程序含义。
- source_word: לְטָהֳרָתוֹ
  choice: 为求洁净
  rationale: 这里涉及礼仪上的洁净状态及祭司的判定；“为求洁净”保留目的或程序含义，不把它缩减为身体治疗。
- source_word: וְנִרְאָה שֵׁנִית
  choice: 就要再次到祭司面前受察看
  rationale: 在律法条文中，此结构表达随后的规定或要求；“受察看”也保留尼法勒式的被动含义。
theological_decisions:
- issue: “洁净”是治疗过程还是礼仪判定
  choice: 译作“为求洁净”，并以脚注说明其包括接受察验、以便被判定为洁净
  alternative: 为使他被宣告洁净
  rationale: 原文措辞简洁，可兼含目的和程序；正文不应过度限定为祭司宣告这一单一层面，也不应让人误解为医学治疗。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。“察看”突出祭司检验皮肤状况的程序；避免使用可能被理解为特定现代疾病诊断的“癣”，也避免用“痂”暗示正在愈合的伤口。
