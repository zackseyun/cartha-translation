  text: צָרַ֨עַת נוֹשֶׁ֤נֶת הִוא֙ בְּ/ע֣וֹר בְּשָׂר֔/וֹ וְ/טִמְּא֖/וֹ הַ/כֹּהֵ֑ן לֹ֣א יַסְגִּרֶ֔/נּוּ כִּ֥י טָמֵ֖א הֽוּא׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/011.yaml
  text: it is a chronic skin disease in the skin of his body[a], and the priest shall pronounce him unclean; he shall not isolate him, for he is unclean.
translation:
  language: zh_hans
  text: 这是他身体皮肤上长期存在的皮肤病[a]。祭司要宣布他为不洁净；不可把他隔离，因为他是不洁净的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“陈旧的皮肤病。”传统译本常把 צָרַעַת 译作“麻风病”，但这个希伯来词在《利未记》中所涵盖的病症比现代医学所说的麻风病更广。
    reason: 说明צָרַעַת的词义范围，并保留נוֹשֶׁנֶת“陈旧／长期存在”的替代译法。
lexical_decisions:
- source_word: צָרַעַת
  choice: 严重皮肤病
  rationale: 此词在《利未记》中涵盖多种严重的皮肤病变，并非专指现代所谓的麻风病；译作“严重皮肤病”既避免错误的医学限定，也保留本段所指病症的严重性。
- source_word: נוֹשֶׁנֶת
  choice: 长期存在的
  rationale: 该词表示陈旧、持续已久；“长期存在的”比“慢性的”较少带入现代医学诊断色彩，也自然准确。
- source_word: בְּעוֹר בְּשָׂרוֹ
  choice: 在他身体皮肤上
  rationale: 按上下文，בשר指人的身体；现代汉语用“身体皮肤”比“肉的皮肤”自然。介词在汉语中用“上”表达皮肤表面的病症。
- source_word: וְטִמְּאוֹ
  choice: 宣布他为不洁净
  rationale: 祭司是在检验后正式判定并宣告其礼仪身份，并非使他变得不洁净。
- source_word: הַכֹּהֵן
  choice: 祭司
  rationale: 直接对应以色列礼仪制度中的职分。
- source_word: לֹא יַסְגִּרֶנּוּ
  choice: 不必把他隔离
  rationale: 此动词在本章指为观察病情而暂时隔离。“隔离”符合现代汉语，又避免“检疫”所带来的过强现代公共卫生色彩；结合原因从句，中文用“不必”自然表达无需再隔离观察。
- source_word: כִּי טָמֵא הוּא
  choice: 因为他是不洁净的
  rationale: 直译因果从句，说明病情已经明确，故无需继续隔离观察。
theological_decisions:
- issue: 礼仪不洁术语 טמא 的译法
  choice: 不洁净
  alternative: 不洁
  rationale: 这里指礼仪—法律身份，并不表示当事人犯了道德罪。“不洁净”保留圣经中的关键术语，并与一般卫生意义上的“不干净”有所区别。
- issue: 祭司对不洁身份的作用
  choice: 宣布他为不洁净
  alternative: 使他不洁净
  rationale: 希伯来语形式可作使役表达，但本段语境显示祭司负责鉴定和宣告既有的礼仪状态；译文避免暗示祭司造成这种状态。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。以“严重皮肤病”避免把古代礼仪诊断错误等同于现代麻风病；以“长期存在的”传达病症已久而不过度医学化。分号保留后半句判定与无需隔离之间的紧密逻辑。
