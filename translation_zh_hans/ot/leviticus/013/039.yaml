  to: 祭司察看，见他们身体的皮肤上有暗淡的白色斑点，这是一种长在皮肤上的斑疹[a]；这人是洁净的。
  rationale: 修订以“察看，见”对应祭司检视后的观察结果，避免将提示语强制改作条件句。将“白斑疹”改为“一种长在皮肤上的斑疹”，使中文更自然，避免与“白色斑点”重复，并将罕见词的词义范围和非不洁的语境信息保留在脚注中。其余关键要素，包括复数“他们”与末句单数判定“这人”，均予保留。
