  text: וְ/רָאָ֣ה הַ/כֹּהֵ֗ן וְ/הִנֵּ֧ה בְ/עוֹר בְּשָׂרָ֛/ם בֶּהָרֹ֖ת כֵּה֣וֹת לְבָנֹ֑ת בֹּ֥הַק ה֛וּא פָּרַ֥ח בָּ/ע֖וֹר טָה֥וֹר הֽוּא־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/039.yaml
  text: and the priest examines, and behold, on the skin of their flesh there are dull white spots, it is a harmless rash that has broken out on the skin; he is clean.
translation:
  language: zh_hans
  text: 祭司察看，见他们身体的皮肤上有暗淡的白色斑点，这是一种长在皮肤上的斑疹[a]；这人是洁净的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “斑疹”也可译作“皮肤斑疹”或“浅色斑”。希伯来语此罕见词指本章中一种不导致不洁的皮肤症状；不宜确定它对应某一种现代皮肤病。
    reason: 说明罕见词בֹּהַק的可能译法及其在本章的礼仪语境，同时避免作出不受原文支持的现代医学诊断。
lexical_decisions:
- source_word: וְרָאָה
  choice: 要察看
  rationale: 在利未记十三章祭司鉴察皮肤症状的程序中，ראה不只是“看见”，而是察看、检验；“要”符合律法程序的中文表达。
- source_word: וְהִנֵּה
  choice: 如果……有
  rationale: 此处引出察看所得的情形。译成条件式程序用语比直译“看哪”更符合现代中文，同时保留其指示诊断结果的功能。
- source_word: בְעוֹר בְּשָׂרָם
  choice: 他们身上的皮肤
  rationale: 保留第三人称复数后缀，并以自然中文表达“肉身的皮肤”，避免生硬的“他们肉体的皮肤”。
- source_word: בֶּהָרֹת כֵּהוֹת לְבָנֹת
  choice: 暗淡的白斑
  rationale: בֶּהָרֹת指可见的斑点或斑块，כֵּהוֹת说明其颜色或光泽较淡，与较鲜明的白色病变有别。
- source_word: בֹּהַק
  choice: 白斑疹
  rationale: 这是罕见的皮肤病变术语，指本章中不导致不洁的浅色皮肤症状。采用描述性名称，但不把它等同于某一现代医学诊断。
- source_word: פָּרַח
  choice: 长出
  rationale: 该动词用于皮肤症状时表示发出、出现或长出；“长出”自然地传达病变显现在皮肤上的意思。
- source_word: טָהוֹר הוּא
  choice: 这人是洁净的
  rationale: 这是祭司在礼仪法律范畴内作出的洁净判定，并非宣告道德纯洁或医学痊愈。
theological_decisions:
- issue: 祭司判定的性质
  choice: 译为“这人是洁净的”，保留礼仪与法律意义
  alternative: 这人在礼仪上是洁净的；这人是纯洁的
  rationale: 上下文处理因皮肤症状而产生的洁净或不洁净身份。“洁净”是此类经文的标准术语；正文不额外加入“礼仪上”，以免过度解释。
- issue: בֹּהַק是否意味着医学上的无害
  choice: 正文采用中性的“白斑疹”，不明说“无害”
  alternative: 无害的皮疹
  rationale: 经文明确判定其不造成礼仪上的不洁，却没有作出现代医学意义上的安全性判断；中性译法可避免把礼仪判定改写成医学结论。
translation_notes:
  register: 采用现代、庄重且易懂的律法程序语体。“察看”体现祭司检验的职责；以分号划分观察、诊断和判定三个层次。保留“他们”这一原文复数指称，末句按希伯来语阳性单数判词译为“这人”。
