base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/036.yaml
  text: And if the priest examines him[a], and behold, the scaly infection has spread in the skin, the priest need not look for the yellow hair; he is unclean.
translation:
  language: zh_hans
  text: 若祭司察看他，发现这鳞屑性患处[a]已在皮肤上扩散，就不必检查是否有黄毛；那人是不洁净的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “鳞屑性患处”所译的希伯来语词，指本章所述头部或胡须部位的一种鳞屑性皮肤患处；其确切性质未能确定。传统上也译作“头疥”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאָהוּ
  choice: 如果祭司察看他
  rationale: ראה在祭司检验的语境中不只是“看见”，而是作出检查；结合上下文，以“如果”表达条例中的条件关系。
- source_word: וְהִנֵּה
  choice: 发现
  rationale: הִנֵּה引出祭司观察到的情况；“发现”在现代汉语中自然地保留其指示和确认作用。
- source_word: פָּשָׂה
  choice: 已经……扩散
  rationale: 准确表达患处范围扩大，也体现希伯来语完成式在检查时所见的结果。
- source_word: הַנֶּתֶק
  choice: 癣疥
  rationale: 此词指头部或胡须部位一种伴随脱毛、鳞屑或毛色变化的特定皮肤患处；“癣疥”简洁，并避免把它误解为仅仅发痒。
- source_word: בָּעוֹר
  choice: 在皮肤上
  rationale: 符合现代汉语描述皮肤患处扩散的习惯，同时准确传达其发生范围。
- source_word: לֹא יְבַקֵּר
  choice: 不必检查有没有
  rationale: בקר表示查验或细察；否定式在此说明患处一旦扩散，就无需再寻找另一项诊断征象。
- source_word: לַשֵּׂעָר הַצָּהֹב
  choice: 黄色的毛
  rationale: 直译该诊断征象，并与本章前文关于患处毛发的描述保持一致。
- source_word: טָמֵא הוּא
  choice: 那人是不洁净的
  rationale: 阳性代词指受检者；明确补出“那人”，避免误以为只是患处本身被判定不洁净。
theological_decisions:
- issue: טָמֵא在利未记洁净条例中的性质
  choice: 不洁净
  alternative: 污秽；不纯洁
  rationale: 这里指礼仪和群体生活中的洁净状态，并不必然表示道德罪责；“不洁净”准确且符合中文圣经语域。
translation_notes:
  register: 采用现代、庄重而清楚的条例语言。“察看”“不洁净”保留祭司律法语域；将直译式“看哪”自然化为“发现”。脚注标记紧随其实际说明的词“癣疥”。
