  text: וְ/הַ/בֶּ֡גֶד אֽוֹ הַ/שְּׁתִ֨י אוֹ הָ/עֵ֜רֶב אֽוֹ כָל כְּלִ֤י הָ/עוֹר֙ אֲשֶׁ֣ר תְּכַבֵּ֔ס וְ/סָ֥ר מֵ/הֶ֖ם הַ/נָּ֑גַע וְ/כֻבַּ֥ס שֵׁנִ֖ית וְ/טָהֵֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/058.yaml
  text: But the garment[a], or the warp, or the woof, or any article of leather that you wash, and the infection departs from them, shall be washed a second time and be clean.
translation:
  language: zh_hans
  text: 至于你洗的衣服、经线、纬线[a]，或任何皮制物件，灾斑若从其上消失，就要再洗一次，便洁净了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “纬线”指织物中横向穿织的线。
    reason: 说明纺织术语，避免以通常不指织线的“横线”作为替代说法。
lexical_decisions:
- source_word: הַבֶּגֶד
  choice: 衣服
  rationale: בגד泛指衣服或布制服饰；“衣服”是现代汉语中自然、宽泛的对应词，也适合本段礼仪条例的语境。
- source_word: הַשְּׁתִי
  choice: 经线
  rationale: 指织物中纵向排列的线，与“纬线”构成标准的现代汉语纺织术语。
- source_word: הָעֵרֶב
  choice: 纬线
  rationale: 指织物中横向穿织的线；“纬线”与“经线”配对，准确而简洁。脚注保留较通俗的释义。
- source_word: כָל כְּלִי הָעוֹר
  choice: 任何皮制物件
  rationale: כְּלִי可泛指器具、用品或物件，并不限于容器；“皮制物件”既保留范围，也避免误译为狭义的“皮囊”或“皮器皿”。
- source_word: תְּכַבֵּס
  choice: 你洗过的
  rationale: 保留第二人称单数的指令语气，并以汉语定语结构自然连接后续条件。כבס在此指洗涤衣物或材料。
- source_word: הַנָּגַע
  choice: 灾斑
  rationale: נגע在本章指可见的异常侵染或斑痕，同时属于礼仪判定的范畴。“灾斑”保留其负面和礼仪色彩，又不武断地认定为某种现代医学感染或特定霉菌。
- source_word: וְסָר מֵהֶם
  choice: 若灾斑从上面消失
  rationale: 希伯来文以连接词承接洗涤后的结果；在程序性上下文中，汉语用“若”清楚表达只有斑痕消失时才执行下一步，同时不改变其实际条件关系。“从上面”自然涵盖前列各物件。
- source_word: וְכֻבַּס שֵׁנִית
  choice: 就要再洗一次
  rationale: 被动式配合“第二次”表达规定性的重复洗涤；汉语用“要再洗一次”自然传达程序要求。
- source_word: וְטָהֵר
  choice: 它就洁净了
  rationale: טהר在此主要指礼仪上的洁净。“洁净”保留利未记的核心术语及礼仪意义，而不缩减为一般的物理清洁。
theological_decisions:
- issue: וְסָר מֵהֶם的条件性
  choice: 译作“若灾斑从上面消失”
  alternative: 译作“灾斑也从上面消失”
  rationale: 原文虽用连接词וְ，整句在洁净条例中描述洗后斑痕已经消失这一情形，并据此规定再次洗涤。汉语若只用“也”，容易使句法关系含混；“若”明确程序条件，却不对灾斑性质作额外解释。
- issue: וְטָהֵר所指的洁净
  choice: 保留“洁净”这一礼仪术语
  alternative: 译作“就干净了”
  rationale: 本章的טהר涉及礼仪身份判定，不只是肉眼可见的清洁程度；“洁净”既准确，也不加入任何宗派性解释。
translation_notes:
  register: 采用现代、庄重而易懂的法规体。以“至于”承接前文分类条例；列举时保留“衣服、经线、纬线、皮制物件”的并列结构。“灾斑”避免把古代礼仪类别直接等同于现代医学感染或特定霉变；“洁净”则维持利未记中的礼仪术语一致性。
