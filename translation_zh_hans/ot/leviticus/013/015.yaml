base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/015.yaml
  text: When the priest sees the raw flesh[a], he shall pronounce him unclean. The raw flesh is unclean[c][b]; it is a skin disease.
translation:
  language: zh_hans
  text: 祭司看见露出的鲜肉[a]，就要宣布那人不洁[b]。露出的鲜肉是不洁的；这是一种皮肤病[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译“活的肉”；传统上常译作“生肉”或“红肉”。这里指显露出来的鲜活组织。
    reason: lexical_alternative
  - marker: b
    text: 或译“判定他不洁”。祭司是在作出正式的礼仪洁净判定。
    reason: lexical_alternative
  - marker: c
    text: 传统上译作“麻风病”，但这里的希伯来词涵盖范围更广，并非专指现代医学所说的麻风病（汉森病）。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאָה
  choice: 看见……就
  rationale: 和字首加完成式在本段律法程序中承接前文，表示出现相应情况后所采取的行动；用“看见……就”自然呈现这一时序关系。
- source_word: הַכֹּהֵן
  choice: 祭司
  rationale: 这是《利未记》中对执行察验与礼仪判定者的标准称呼。
- source_word: הַבָּשָׂר הַחַי
  choice: 鲜露的肉
  rationale: 字面为“活的肉”，在皮肤察验语境中指显露出来的鲜活组织；“鲜露的肉”既避免把它误解为健康皮肉，也比生硬的“活肉”更符合现代汉语。
- source_word: וְטִמְּאוֹ
  choice: 宣布他不洁
  rationale: 此处 piel 词形描述祭司作出正式的礼仪洁净判定，并非祭司使当事人变得不洁；“宣布”明确表达其判定职能。
- source_word: טָמֵא הוּא
  choice: 是不洁的
  rationale: “不洁”保留 טָמֵא 在《利未记》礼仪律例中的专门范畴，不泛化为一般卫生或道德意义上的“不干净”。
- source_word: צָרַעַת
  choice: 皮肤病
  rationale: 该希伯来词并不精确等同现代医学所说的麻风病（汉森病）；本节谈论人体症状，译作“皮肤病”可避免错误的医学限定。
theological_decisions:
- issue: 利未记洁净律中 צָרַעַת 的译法
  choice: 皮肤病
  alternative: 麻风病；导致不洁的皮肤病
  rationale: 采用较宽泛的病症名称，不把后世或现代医学诊断强加于经文，同时保留本节所述礼仪不洁的判断。
- issue: 祭司在 וְטִמְּאוֹ 中所起的作用
  choice: 宣布他不洁
  alternative: 使他不洁；判定他不洁
  rationale: 祭司作出具有礼仪效力的正式判定，而不是造成其病症或不洁状态；“宣布”既表达官方判定，也不过度解释其机制。
translation_notes:
  register: 采用现代、庄重而易懂的律法条文语体。“看见……就要”体现程序性；“不洁”保留礼仪术语的一致性。脚注依正文出现顺序标为[a]、[b]、[c]。
