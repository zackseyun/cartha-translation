base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/012.yaml
  text: And if the skin disease breaks out all over the skin[a], and the skin disease covers all the skin of the affected person from his head to his feet, as far as the priest can see[b],
translation:
  language: zh_hans
  text: 如果这种皮肤病在皮肤上大面积发作[a]，覆盖了患者全身的皮肤[b]，从头到脚，在祭司眼所能看见的一切范围内，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语 צָרַעַת（察拉阿特）在《利未记》中指一系列涉及礼仪洁净的皮肤病症，不宜狭义地等同于现代所说的麻风病（汉森病）。
    reason: cultural_note
  - marker: b
    text: “患者全身的皮肤”较直译为“患处的全部皮肤”，是指这种病症发作所涉及的皮肤。
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּרוֹחַ תִּפְרַח
  choice: 大面积发作
  rationale: 不定式绝对形与限定动词连用，加强“发出、扩散”的意思；结合皮肤病语境，译作“大面积发作”既体现广泛蔓延，也符合现代汉语表达。
- source_word: הַצָּרַעַת
  choice: 这种皮肤病
  rationale: צָרַעַת 在《利未记》中涵盖多种礼仪上受关注的皮肤病症，不能简单等同于现代医学所说的麻风病；“这种皮肤病”清楚自然，并承接上文所述病症。
- source_word: בָּעוֹר
  choice: 在皮肤上
  rationale: 介词 בְּ 在此指病症出现并扩散的身体表面；“在皮肤上”自然且贴近原文。
- source_word: וְכִסְּתָה
  choice: 覆盖了
  rationale: 该动词表示遮盖、覆盖；在条件句所描述的检查情形中，“覆盖了”自然表达病症已经遍及皮肤。
- source_word: אֵת כָּל עוֹר הַנֶּגַע
  choice: 患病者全身的皮肤
  rationale: 原文较直译为“患处／病症的全部皮肤”，所指是受这种病症影响之人的全身皮肤。正文用自然汉语表达其语境所指，脚注保留字面结构的可能性。
- source_word: מֵרֹאשׁוֹ וְעַד רַגְלָיו
  choice: 从头到脚
  rationale: 这是表示全身范围的首尾概括；“从头到脚”简洁、自然，并保留原文的整体性。
- source_word: לְכָל מַרְאֵה עֵינֵי הַכֹּהֵן
  choice: 凡祭司眼睛所能看见的地方
  rationale: 原文强调祭司检查时目力所见的全部范围；此译法保留“眼睛”和可见范围，比单纯译作“祭司看来”更具体。
