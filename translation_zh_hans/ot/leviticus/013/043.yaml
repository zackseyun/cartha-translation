base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/043.yaml
  text: and the priest examines him, and behold, the swelling of the disease is whitish-red on his bald head or on his bald forehead, like the appearance of a skin disease on the flesh,
translation:
  language: zh_hans
  text: 祭司察看他，见患处的隆起在他后部的秃处或前额的秃处[b]呈白中带红，外观如同人体皮肤上的皮肤病[a]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语“צָרַעַת”传统上常译作“麻风病”，但在《利未记》中它涵盖多种皮肤病症，并非专指现代医学所说的汉森病。
    reason: lexical_alternative
  - marker: b
    text: 这两个希伯来词很可能分别指头部后方和前方的秃发部位；其精确解剖范围并不完全确定。
    reason: cultural_note
lexical_decisions:
- source_word: וְרָאָה
  choice: 要察看
  rationale: 在利未记第13章祭司诊察的法律语境中，ראה不只是一般的“看见”，而是仔细察看；“要”体现程序性规定。
- source_word: וְהִנֵּה
  choice: 如果……呈
  rationale: הִנֵּה引出察看所得的情况。中文法律叙述用“如果”自然表达条件性的观察结果，而不生硬直译为“看哪”。
- source_word: שְׂאֵת הַנֶּגַע
  choice: 患处的肿块
  rationale: שְׂאֵת指隆起或肿块，הַנֶּגַע指受侵患处；此译保留病变及其隆起特征，避免把两词合并成笼统的“疾病”。
- source_word: לְבָנָה אֲדַמְדֶּמֶת
  choice: 白中带红
  rationale: 保留“白”与“发红”两种颜色特征，并以自然现代汉语表达混合色泽，不把次序倒置为“红中带白”。
- source_word: בְּקָרַחְתּוֹ אוֹ בְגַבַּחְתּוֹ
  choice: 在他后脑或前额的秃处
  rationale: 两词大概分别指后部与前部的秃处；正文明确保留其对比，同时不把这种可能的部位区分说得过度技术化。
- source_word: כְּמַרְאֵה
  choice: 外观像
  rationale: 自然保留诊断性比较用语。
- source_word: צָרַעַת עוֹר בָּשָׂר
  choice: 身体皮肤上的严重皮肤病
  rationale: צָרַעַת在本章所指范围广于现代医学的汉森病；“严重皮肤病”避免误译为特定疾病，并保留עוֹר בָּשָׂר的身体皮肤范围。
