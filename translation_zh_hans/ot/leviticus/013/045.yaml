  text: וְ/הַ/צָּר֜וּעַ אֲשֶׁר בּ֣/וֹ הַ/נֶּ֗גַע בְּגָדָ֞י/ו יִהְי֤וּ פְרֻמִים֙ וְ/רֹאשׁ/וֹ֙ יִהְיֶ֣ה פָר֔וּעַ וְ/עַל שָׂפָ֖ם יַעְטֶ֑ה וְ/טָמֵ֥א טָמֵ֖א יִקְרָֽא־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/045.yaml
  text: As for the one with the skin disease[a], in whom the infection is, his clothes shall be torn, his head shall be left unkempt, he shall cover his mustache, and he shall cry out, ‘Unclean, unclean!’
translation:
  language: zh_hans
  text: “患皮肤病、身上有这病患的人，他的衣服要撕裂，头发要蓬散，遮住上唇[a]，并要喊叫：‘不洁净！不洁净！’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“遮住上唇的胡须”。希伯来语指遮住上唇或上唇胡须一带；这是哀恸的表示，在这里也起公开警示的作用。
    reason: 保留 שָׂפָם 所指部位的词义幅度，并说明这一动作在语境中的功能。
lexical_decisions:
- source_word: הַצָּרוּעַ
  choice: 患皮肤病的人
  rationale: 避免传统译名使现代读者误以为这里只特指汉森病；本章所述是范围更广、须由祭司察验的皮肤病症。
- source_word: הַנֶּגַע
  choice: 患处
  rationale: 在本章语境中指显在身上的病变或灾病征象；“患处”自然且不引入现代细菌感染理论。
- source_word: בְּגָדָיו יִהְיוּ פְרֻמִים
  choice: 他的衣服要撕裂
  rationale: 保留衣服被撕开的具体动作及其公开表示哀恸、困苦的作用。
- source_word: וְרֹאשׁוֹ יִהְיֶה פָרוּעַ
  choice: 头发要蓬散
  rationale: פָרוּעַ 表示头发散开、未加整理，并非剃光或露出头部；“蓬散”简明地传达这种状态。
- source_word: וְעַל שָׂפָם יַעְטֶה
  choice: 遮住上唇
  rationale: שָׂפָם 可指上唇或唇髭一带；正文采用较贴近字面的“上唇”，脚注说明其范围。
- source_word: וְטָמֵא טָמֵא יִקְרָא
  choice: 并要喊叫：‘不洁净！不洁净！’
  rationale: 重复的形容词构成公开而强调的宣告；“喊叫”体现让旁人听见的警示功能。
theological_decisions:
- issue: 利未记十三章中 טָמֵא 的性质
  choice: 译作“不洁净”，表达礼仪和群体身份上的状态
  alternative: 污秽；不洁
  rationale: 此处所说的是律法规定的礼仪状态及其公开标识，不应被译成必然涉及个人道德罪责的说法，也不宜套用现代医学分类。
translation_notes:
  register: 采用现代、庄重而易懂的法规语体，以“要”表达条文要求。保留“不洁净”的礼仪用语及原文重复的公开宣告。脚注标记置于实际存在词义歧义的“上唇”之后。
