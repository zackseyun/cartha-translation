  text: 无论男人或女人，若头上[a]或胡须上有病变[b]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“头皮上”；希伯来文直译为“头上”。
    reason: lexical_alternative
  - marker: b
    text: 或译“病症”“疾病”或“斑痕”。希伯来文 נגע 是《利未记》中一个含义较广的词，指由祭司察看的可见病变或异常症状。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אִישׁ ... אִשָּׁה
  choice: 无论男人或女人
  rationale: 希伯来文明确并列男人和女人；译文保留两者，并以现代汉语自然的条件句式表达。
- source_word: כִּי
  choice: 若
  rationale: 在律法案例中引出条件情形；“若”简洁、庄重，也保留其条件意义。
- source_word: יִהְיֶה בּוֹ
  choice: 有
  rationale: 原文直译近于“在他里面／身上有”；诊察语境下用“有”最符合现代汉语。
- source_word: נָגַע
  choice: 病变
  rationale: נגע 在利未记13章泛指由祭司察看的可见异常或患处，未必是现代医学意义上的感染；“病变”既易懂，又避免过度确诊。
- source_word: בְּ/רֹאשׁ
  choice: 头上
  rationale: 忠实保留 רֹאשׁ 的一般含义“头”；本语境可能特指头皮，故以脚注说明。
- source_word: בְ/זָקָן
  choice: 胡须部位
  rationale: זָקָן 是“胡须”。译作“胡须部位”可自然表达病变所在区域，也避免把病变说成发生在毛发本身。
