  yaml_path: translation/ot/leviticus/013/022.yaml
  text: But if it does spread in the skin[a], the priest shall pronounce him unclean[b]; it is an infection.
translation:
  language: zh_hans
  text: 但若患处在皮肤上扩散开来，祭司就要宣布他为不洁[a]；这是病症[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“判定他为不洁”。这里指祭司正式确认并宣告其礼仪上的不洁状态。
    reason: lexical_alternative
  - marker: b
    text: 或译“病患”或“患处”。原词含义宽泛，并不确指现代医学所说的某一种疾病。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: 但……若
  rationale: 承接上一种情形并引出相反条件；“但……若”自然表达此处带转折意味的条件关系。
- source_word: פָּשֹׂה תִפְשֶׂה
  choice: 若果真……扩散
  rationale: 原文以同根不定式绝对形加强未完成式；“果真”保留强调语气，又不把它过度限定为持续或大幅扩散。
- source_word: בָּעוֹר
  choice: 在皮肤上
  rationale: עוֹר指皮肤；现代汉语描述皮肤病变扩散时通常说“在皮肤上”。
- source_word: וְטִמֵּא הַכֹּהֵן אֹתוֹ
  choice: 祭司就要宣布他为不洁
  rationale: 祭司在此作出礼仪身份的权威判定，并非借宣告使人变得不洁；“宣布……为不洁”清楚传达这一法律—礼仪语境。
- source_word: נֶגַע הִוא
  choice: 这是灾病
  rationale: נֶגַע在本章是涵盖面较广的病患或受灾斑痕用语；“灾病”保留其严重性和古代祭司法例色彩，同时以脚注避免与现代特定疾病等同。
theological_decisions:
- issue: 祭司宣告与不洁状态的关系
  choice: 祭司宣布受检者为不洁
  alternative: 祭司使他成为不洁
  rationale: 祭司法例的语境表明，此动作是正式诊断并宣告礼仪状态，而不是祭司的话语造成不洁。
- issue: נֶגַע的医学性质
  choice: 采用宽泛的“灾病”，不指定现代疾病
  alternative: 明确译为“感染”或某种具体皮肤病
  rationale: 原词可指病患、灾害性斑痕或患处，不能稳妥对应某一现代医学类别。
translation_notes:
  register: 采用现代、庄重而易懂的祭司法例语体。“患处”承接上下文所检查的皮肤病变；“果真”传达希伯来语同根结构的强调。脚注标记均紧随所说明的词语，避免沿用英文咨询层中错置的标记。
