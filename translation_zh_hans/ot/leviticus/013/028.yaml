  text: וְ/אִם תַּחְתֶּי/הָ֩ תַעֲמֹ֨ד הַ/בַּהֶ֜רֶת לֹא פָשְׂתָ֤ה בָ/עוֹר֙ וְ/הִ֣וא כֵהָ֔ה שְׂאֵ֥ת הַ/מִּכְוָ֖ה הִ֑וא וְ/טִֽהֲר/וֹ֙ הַ/כֹּהֵ֔ן כִּֽי צָרֶ֥בֶת הַ/מִּכְוָ֖ה הִֽוא־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/028.yaml
  text: But if the bright spot remains in its place and has not spread in the skin[a], and it is faded, it is the swelling from the burn, and the priest shall pronounce him clean, for it is the scar of the burn.
translation:
  language: zh_hans
  text: 但如果亮斑停留在原处[a]，没有在皮肤上扩散，并且颜色变淡了，那就是烧伤引起的肿起。祭司要宣布他洁净，因为这是烧伤留下的疤痕。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “停留在原处”也可译作“停在它下面”；希伯来语字面意思是亮斑“停在它下面”，在这里是指亮斑保持不变，没有扩散。
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּחְתֶּיהָ תַעֲמֹד
  choice: 停留在原处
  rationale: 这一搭配字面可理解为“停在它下面”，但在本段察看患处是否扩散的语境中，表示亮斑维持原状、没有蔓延；译作“停留在原处”自然清楚，同时用脚注保留字面可能。
- source_word: הַבַּהֶרֶת
  choice: 亮斑
  rationale: 指皮肤上可见的明亮变色区域；“亮斑”简洁，并符合本章诊察皮肤病灶的语境。
- source_word: פָשְׂתָה בָעוֹר
  choice: 在皮肤上扩散
  rationale: פׂשה 是本章描述患处蔓延的诊断用语；介词 ב 在现代汉语中译作“在……上”较自然。
- source_word: כֵהָה
  choice: 颜色变淡了
  rationale: 该词表示亮度或显眼程度减弱；补出“颜色”能使现代汉语读者清楚理解所观察的是斑痕外观。
- source_word: שְׂאֵת הַמִּכְוָה
  choice: 烧伤所引起的肿块
  rationale: שׂאת 指皮肤隆起或肿块；属格关系可自然表达为由烧伤引起。
- source_word: וְטִהֲרוֹ הַכֹּהֵן
  choice: 祭司要宣布他洁净
  rationale: 在祭司诊察法规中，这一使役形式表示判定或宣布为礼仪上洁净，并非实际施行清洗。
- source_word: צָרֶבֶת הַמִּכְוָה
  choice: 烧伤留下的疤痕
  rationale: צָרֶבֶת 指烧伤愈合后留下的痕迹或疤；“疤痕”准确而通俗。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的诊察用语；保留“洁净”这一利未记礼仪分类术语，并以“宣布”明确祭司的判定职能。
