  text: זֹ֠את תּוֹרַ֨ת נֶֽגַע צָרַ֜עַת בֶּ֥גֶד הַ/צֶּ֣מֶר א֣וֹ הַ/פִּשְׁתִּ֗ים א֤וֹ הַ/שְּׁתִי֙ א֣וֹ הָ/עֵ֔רֶב א֖וֹ כָּל כְּלִי ע֑וֹר לְ/טַהֲר֖/וֹ א֥וֹ לְ/טַמְּאֽ/וֹ־׀־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/059.yaml
  text: This is the law for an outbreak of leprous disease in a wool garment or a linen garment[a], or in the warp or the woof, or in any leather article, for pronouncing it clean or pronouncing it unclean.
translation:
  language: zh_hans
  text: 这是关于羊毛衣物或麻布衣物、经线或纬线，或任何皮制品上出现察拉阿特病变[a]的条例，用来判定它是洁净还是不洁净。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “察拉阿特”是希伯来语术语，传统上常译为“大麻风”或“麻风”。其范围并不等同于现代医学所说的麻风病；本章也将它用于衣物和皮制品。其具体性质无法确定。
    reason: 说明古代术语的语义范围及传统译名关联，避免将其误解为现代医学上的麻风病，或武断认定为霉变。
lexical_decisions:
- source_word: תּוֹרַת
  choice: 所适用的条例
  rationale: 这里的 תּוֹרָה 总结前述案例所遵循的规则和程序；“条例”在现代中文中自然、庄重，也符合祭司律例的语境。
- source_word: נֶגַע צָרַעַת
  choice: 麻风灾病
  rationale: 保留 צָרַעַת 的传统术语关联，同时用“灾病”表明这里所指范围超出现代医学上的麻风病，并可用于衣物和皮制品；不将其具体解释为霉菌或某种已知物质变化。
- source_word: בֶּגֶד הַצֶּמֶר א֣וֹ הַפִּשְׁתִּים
  choice: 羊毛衣物或麻布衣物
  rationale: 按平行结构理解为羊毛制成的衣物或麻布制成的衣物；中文补出第二个“衣物”，使表达清楚自然。
- source_word: הַשְּׁתִי ... הָעֵרֶב
  choice: 经线或纬线
  rationale: 采用现代中文通行的纺织术语，准确表达织物的纵向线和横向线。
- source_word: כָּל כְּלִי עוֹר
  choice: 任何皮制品
  rationale: כְּלִי 在此泛指物件或用品，“皮制品”既自然又能保持其广泛含义。
- source_word: לְטַהֲרוֹ אוֹ לְטַמְּאוֹ
  choice: 据此可宣布它洁净或不洁净
  rationale: 祭司语境中的两个动词指对礼仪身份作出判定，而非实际洗净或使之污秽；“宣布”保留这种裁定性质。
theological_decisions:
- issue: צָרַעַת 用于衣物和皮制品时的译法
  choice: 麻风灾病
  alternative: 皮肤病；霉变；侵蚀性灾病
  rationale: 同一希伯来词也用于人，但其古代范围不能与现代汉森病完全等同，并且本节明确用于物品。“皮肤病”不适合物品，“霉变”又加入了原文没有明确说明的病因；“麻风灾病”兼顾术语连续性与范围上的不确定性，并以脚注防止现代医学上的误解。
translation_notes:
  register: 采用现代、庄重而易懂的法规性表达。“经线、纬线”为通行技术词；句末用“宣布……洁净或不洁净”体现祭司对礼仪状态的裁定。
