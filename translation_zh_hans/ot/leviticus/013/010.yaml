  yaml_path: translation/ot/leviticus/013/010.yaml
  text: and the priest examines him[a], and behold, there is a white swelling in the skin, and it has turned the hair white, and there is raw flesh in the swelling[b],
translation:
  language: zh_hans
  text: 祭司察看，若见皮肤上有白色的隆起[a]，使毛发变白，并且隆起中有活肉露出[b]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“肿块”。希伯来语 שְׂאֵת 是本章描述高起皮肤病灶的专门用语。
    reason: lexical_alternative
  - marker: b
    text: 直译“活的肉”；指病灶中显露的鲜活组织。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאָה
  choice: 察看
  rationale: 在祭司鉴定皮肤病症的律例语境中，该动词表示有目的的查看、检验，不只是一般的“看见”。
- source_word: הַכֹּהֵן
  choice: 祭司
  rationale: 这是利未记礼仪洁净条例中对获授权鉴定病症者的标准称谓。
- source_word: וְהִנֵּה
  choice: 若见
  rationale: 结合希伯来律例的条件式行文，用“若见”自然表达祭司察看后发现下述症状；其引人注意的功能由“见”体现。
- source_word: שְׂאֵת
  choice: 隆起
  rationale: 本章中这是皮肤病灶的技术性用语，指皮肤上高起之处；“隆起”比泛称“肿块”更贴近其形态，也不预断病因。
- source_word: לְבָנָה
  choice: 白色的
  rationale: 直接表达病灶的颜色。
- source_word: בָּעוֹר
  choice: 皮肤上
  rationale: 现代汉语描述可见皮损时通常说“皮肤上”，自然传达病灶所在的位置。
- source_word: וְהִיא הָפְכָה שֵׂעָר לָבָן
  choice: 使毛发变白
  rationale: 阴性代词回指“隆起”；此译保留病灶导致毛发变白的语法关系，同时符合现代汉语。
- source_word: וּמִחְיַת בָּשָׂר חַי
  choice: 有一处裸露的活肉
  rationale: 该词组描述病灶中可见的鲜活组织。“裸露的活肉”用通俗而庄重的语言表达诊断所见，并以脚注保留其直译。
- source_word: בַּשְׂאֵת
  choice: 隆起中
  rationale: 明确活肉位于隆起的病灶内部，并与前文术语保持一致。
