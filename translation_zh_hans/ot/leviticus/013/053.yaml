  text: וְ/אִם֮ יִרְאֶ֣ה הַ/כֹּהֵן֒ וְ/הִנֵּה֙ לֹא פָשָׂ֣ה הַ/נֶּ֔גַע בַּ/בֶּ֕גֶד א֥וֹ בַ/שְּׁתִ֖י א֣וֹ בָ/עֵ֑רֶב א֖וֹ בְּ/כָל כְּלִי עֽוֹר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/053.yaml
  text: But if the priest examines it[a], and behold, the infection has not spread in the garment, or in the warp, or in the woof, or in any article of leather,
translation:
  language: zh_hans
  text: 但祭司若察看，见患处没有在衣服、经线、纬线[a]或任何皮制品上扩散，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “纬线”指织物中横向穿织的线，与纵向的“经线”相对。
    reason: 说明纺织术语，并呈现בָעֵרֶב所指的横向织线。
lexical_decisions:
- source_word: וְאִם
  choice: 但……若
  rationale: 承接上文的处理程序，并引出与前一种情形略有对比的条件句。
- source_word: יִרְאֶה
  choice: 察看
  rationale: 该动词本义为“看见”，但在祭司执行检验的语境中，“察看”既自然，也能表达正式查验而不过度释义。
- source_word: הַכֹּהֵן
  choice: 祭司
  rationale: 符合《利未记》中负责礼仪查验者的通常称谓。
- source_word: וְהִנֵּה
  choice: 见
  rationale: 用现代汉语的“见”体现提示查验结果的语篇功能，避免使用较古雅的“看哪”破坏条件句的流畅度。
- source_word: לֹא פָשָׂה
  choice: 没有……扩散
  rationale: פשה在本章皮肤和织物患处的语境中表示范围蔓延或扩大；“扩散”准确而易懂。
- source_word: הַנֶּגַע
  choice: 患处
  rationale: נגע在此可指受影响的斑痕、部位或灾患现象。“患处”保留其可见部位的含义，又不武断认定为某种现代医学感染。
- source_word: בַּבֶּגֶד
  choice: 在衣服……上
  rationale: בגד指衣服或衣料；本段语境列举受查验的织物，“衣服”简明自然。汉语以“在……上扩散”表达材料表面的蔓延。
- source_word: בַשְּׁתִי
  choice: 经线
  rationale: 指织物纵向排列的线，是准确且通行的现代纺织术语。
- source_word: בָעֵרֶב
  choice: 纬线
  rationale: 指织物横向穿织的线；“纬线”与“经线”配对自然，也比罕见的旧式称法更易懂。
- source_word: בְּכָל כְּלִי עוֹר
  choice: 任何皮制品
  rationale: כְּלִי泛指器具或物件，עוֹר指皮革材料；“皮制品”既涵盖面广，又符合现代汉语习惯。
