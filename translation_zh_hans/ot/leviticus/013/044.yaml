  text: אִישׁ צָר֥וּעַ ה֖וּא טָמֵ֣א ה֑וּא טַמֵּ֧א יְטַמְּאֶ֛/נּוּ הַ/כֹּהֵ֖ן בְּ/רֹאשׁ֥/וֹ נִגְעֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/044.yaml
  text: He is a leprous man; he is unclean[a]. The priest shall surely pronounce him unclean; his disease is on his head.
translation:
  language: zh_hans
  text: 这人患有皮肤病，是不洁净的[a]。祭司必定判定他为不洁净；他的病患在头上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 传统译作“大麻风”。这里的希伯来语指本章所论的一类皮肤病，不一定就是现代医学所说的麻风病（汉森病）。
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ צָרוּעַ
  choice: 这人患有严重皮肤病
  rationale: אִישׁ指法律案例中的男性个体；צָרוּעַ指本章所处理的皮肤病患者，不宜等同于现代医学所说的麻风病。合译为“这人患有严重皮肤病”，自然且保留诊断语境。
- source_word: טָמֵא הוּא
  choice: 是不洁净的
  rationale: 在利未记的祭仪语境中，טָמֵא表示礼仪上的不洁净，并非一般卫生评价或道德定罪。
- source_word: טַמֵּא יְטַמְּאֶנּוּ
  choice: 必须判定他为不洁净
  rationale: 不定式绝对式与未完成式连用加强语气；祭司是在正式判定其状态，并不是使他变得不洁净。“必须”体现强调和法律义务。
- source_word: הַכֹּהֵן
  choice: 祭司
  rationale: 准确指负责察验并作出礼仪判定的祭仪职分。
- source_word: בְּרֹאשׁוֹ
  choice: 在头上
  rationale: 紧贴希伯来文的位置表达，不把范围擅自缩小为头皮。
- source_word: נִגְעוֹ
  choice: 他的患处
  rationale: נֶגַע在本章可指病症、病灶或患处；此处与“在头上”搭配时，“患处”比“疾病”更自然，也避免“灾病”的疫病联想。
theological_decisions:
- issue: “不洁净”的性质
  choice: 保留祭仪术语“不洁净”
  alternative: 不纯洁／有罪
  rationale: 经文作出的是祭仪身份判定，不能将其改写为道德有罪或一般卫生意义上的不干净。
- issue: 祭司宣告的作用
  choice: 判定他为不洁净
  alternative: 使他成为不洁净
  rationale: 上下文描写祭司察验并确认既有状态；采用“判定”避免暗示祭司的话本身造成不洁净。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“严重皮肤病”避免不准确地对应现代麻风病；“判定”体现祭司在律法程序中的正式诊断职能。脚注标记置于“不洁净的”之后，与所需词义说明相连。
