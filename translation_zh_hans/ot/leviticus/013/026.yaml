  text: וְ/אִ֣ם יִרְאֶ֣/נָּה הַ/כֹּהֵ֗ן וְ/הִנֵּ֤ה אֵֽין בַּ/בֶּהֶ֨רֶת֙ שֵׂעָ֣ר לָבָ֔ן וּ/שְׁפָלָ֥ה אֵינֶ֛/נָּה מִן הָ/ע֖וֹר וְ/הִ֣וא כֵהָ֑ה וְ/הִסְגִּיר֥/וֹ הַ/כֹּהֵ֖ן שִׁבְעַ֥ת יָמִֽים׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/026.yaml
  text: But if the priest examines it[a], and behold, there is no white hair in the bright spot, and it is not deeper than the skin, but it is faded[b], then the priest shall isolate him seven days.
translation:
  language: zh_hans
  text: 但祭司若察看这斑，见亮斑中没有白毛，这斑并不低于皮肤表面[a]，而且颜色暗淡，祭司就要将那人隔离[b]七天。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“这斑没有凹陷到皮肤以下。”
    reason: 原词强调位置较低或下陷；两种译法都表达该斑没有低于周围皮肤。
  - marker: b
    text: 或译：“禁闭”或“拘禁”。
    reason: 原动词可指关起来或限制行动；这里是祭司为观察病情而采取的暂时措施。
lexical_decisions:
- source_word: יִרְאֶנָּה
  choice: 察看它
  rationale: 该动词本义为“看”，在祭司检验皮肤病变的语境中译作“察看”更能表达正式检查的动作；“它”保留希伯来文的阴性宾语，指前文所述病变。
- source_word: בַּבֶּהֶרֶת
  choice: 亮斑中
  rationale: בַּהֶרֶת 指皮肤上发亮或发白的斑状病变；“亮斑”保留其视觉特征，又避免套用现代医学诊断名称。
- source_word: שֵׂעָר לָבָן
  choice: 白毛
  rationale: 原文为单数集合表达；现代汉语用“白毛”即可自然概括这一检验征象。
- source_word: וּשְׁפָלָה אֵינֶנָּה מִן הָעוֹר
  choice: 斑也不低于皮肤
  rationale: שָׁפָל 的核心意思是“低、下陷”；此译保留可见的高低关系，同时不把它解释成特定医学症状。
- source_word: כֵהָה
  choice: 斑色暗淡
  rationale: 该词表示外观不鲜明、变淡或黯淡；“斑色暗淡”在皮肤斑痕语境中清楚自然。
- source_word: וְהִסְגִּירוֹ
  choice: 把那人隔离
  rationale: 该动词表示将人关闭或限制起来，以便继续观察；“隔离”准确表达此处程序，同时比现代术语“检疫”更少时代限定。
- source_word: שִׁבְעַת יָמִים
  choice: 七天
  rationale: 按原文直接翻译。
- source_word: וְהִנֵּה
  choice: 见
  rationale: 此处是引出察看所得结果的提示语；汉语以“见”自然传达“看哪／果然看见”的观察意味，避免生硬直译。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“亮斑”“白毛”“斑色暗淡”保留原文的可见诊断特征，不引入现代疾病名称；句式依照希伯来文的条件—观察结果—处置结构，同时调整为自然汉语。
