base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/051.yaml
  text: On the seventh day he shall examine the infection[a], and if the infection has spread in the garment, or in the warp, or in the woof, or in the leather, in anything for which leather is made for work, the infection is a destructive skin disease[c][b]; it is unclean.
translation:
  language: zh_hans
  text: 第七天，他要察看病斑；如果病斑在衣服上、经线或纬线中、皮革上，或任何用皮革制成的器物上蔓延，这就是侵蚀性的灾病[a]，是不洁净的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “灾病”译自希伯来语 tsaraʿat。这个词传统上常译作“麻风病”，但在《利未记》中所指范围更广，也可用于衣物、皮革和房屋，并不等同于现代医学所说的麻风病。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאָה
  choice: 察看
  rationale: 在祭司执行检验的律例语境中，此词不只是“看见”，而是仔细查看并作出判断。
- source_word: הַנֶּגַע
  choice: 病斑
  rationale: 此处指衣物或皮革上可观察、会蔓延的异常斑处；“病斑”既具体可感，又避免把它径直等同于现代医学上的感染。
- source_word: פָשָׂה
  choice: 蔓延
  rationale: 准确表达斑处扩展、散开的动态，也符合本章反复检验其是否扩散的语境。
- source_word: בֶּגֶד
  choice: 衣服
  rationale: 采用普通现代汉语；在本段语境中也可涵盖作为衣料的织物制品。
- source_word: שְׁתִי / עֵרֶב
  choice: 经线、纬线
  rationale: 分别对应织物纵向和横向的线，是现代汉语中清楚、标准的纺织术语。
- source_word: עוֹר
  choice: 皮革
  rationale: 上下文谈到用这种材料制作用品，故“皮革”比未经加工意味较强的“皮”或“兽皮”更贴切。
- source_word: לְכֹל אֲשֶׁר יֵעָשֶׂה הָעוֹר לִמְלָאכָה
  choice: 任何皮革制成的用品
  rationale: 自然表达该短语所涵盖的一切皮革制品，同时保留律例范围的周全性。
- source_word: צָרַעַת מַמְאֶרֶת
  choice: 侵蚀性的灾病
  rationale: צָרַעַת在本章不仅涉及人体，也涉及衣物和房屋，不能简单等同于现代麻风病；מַמְאֶרֶת带有损坏、侵蚀或恶化的含义。
- source_word: טָמֵא הוּא
  choice: 是不洁净的
  rationale: 保留利未记礼仪律例中的“不洁净”这一核心身份判定，不将其缩减为卫生意义。
theological_decisions:
- issue: 如何翻译利未记洁净条例中的צָרַעַת
  choice: 灾病
  alternative: 麻风病；癞病；皮肤病
  rationale: 该希伯来词的范围比现代汉森病广，并且本节明确用于衣服和皮革。“灾病”保留其异常、损害及礼仪不洁的性质，而不作过度具体的医学诊断。
- issue: טָמֵא所表达的不洁性质
  choice: 不洁净
  alternative: 在礼仪上不洁净；污秽
  rationale: “不洁净”沿用本书清楚而简洁的律例用语；其礼仪含义由上下文确定，无须在正文中添加解释性限定。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。句式保留第七日检验、发现蔓延、判定性质与宣布不洁净的律例程序；术语力求普通读者易懂，同时避免将古代洁净分类现代医学化。
