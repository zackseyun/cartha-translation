  text: 但若他被宣告为洁净以后，那患处[a]果真在皮肤上蔓延，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “患处”所译的希伯来语，是本章用来指头部或胡须部位一种特定皮肤病变的词，描述涉及鳞屑和毛发脱落；其确切性质不明，并非现代医学上的精确病名。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: 但……若
  rationale: 在检验规程中引出与前述洁净判定相反的后续情形；“但……若”既保留条件含义，也自然表达转折。
- source_word: פָּשֹׂה יִפְשֶׂה
  choice: 若果真……扩散
  rationale: 原文以同词根的不定式绝对形配合限定动词，加强“扩散”的语气；“果真”以自然汉语体现强调，而不夸大为大范围扩散。
- source_word: הַנֶּתֶק
  choice: 癣患
  rationale: 此词在利未记13章指头部或胡须部位一种涉及毛发异常的特定皮肤患处。“癣患”简洁易懂，同时用脚注说明它不是现代医学上的精确诊断。
- source_word: בָּעוֹר
  choice: 在皮肤上
  rationale: עוֹר意为“皮肤”；汉语描述皮损蔓延时通常说“在皮肤上扩散”，比直译“在皮肤里”自然。
- source_word: אַחֲרֵי טָהֳרָתוֹ
  choice: 他被宣告为洁净以后
  rationale: 结合祭司检验的上下文，指此人先前被判定为礼仪上洁净；如此翻译可避免让“洁净”被误解为道德净化或已经治愈。
theological_decisions:
- issue: טָהֳרָתוֹ所指的洁净性质
  choice: 译为“被宣告为洁净”，表明这是祭司检验后的礼仪身份判定
  alternative: 译为“洁净以后”或“洁净礼以后”
  rationale: 上文的直接语境是祭司判定此人为洁净；原文并未说他经历了道德净化，也不宜暗示某种特定宗派的洁净观。
translation_notes:
  register: 采用现代、庄重而易懂的法规叙述语体。“若果真”保留原文动词加强结构的语气；句末逗号反映本节句意在下一节继续。
