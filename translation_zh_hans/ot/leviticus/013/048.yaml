  yaml_path: translation/ot/leviticus/013/048.yaml
  text: or in the warp or in the woof of the linen or of the wool[a], or in leather[c][b], or in any article made of leather—
translation:
  language: zh_hans
  text: 或是在亚麻织物或羊毛织物的经线或纬线中[a]，或是在皮革上，或是在任何皮革制品上[b]——
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “亚麻织物”所译的词也可直译为“亚麻”；这里很可能指亚麻制成的织物。
    reason: lexical_alternative
  - marker: b
    text: “皮革制品”直译为“皮革的任何制成物”。
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁתִי
  choice: 经线
  rationale: 指织物中纵向排列的线；“经线”是现代汉语标准纺织术语，并与“纬线”自然配对。
- source_word: עֵרֶב
  choice: 纬线
  rationale: 指穿过经线的横向线；“纬线”准确、通行，无须采用较生僻的表达。
- source_word: לַפִּשְׁתִּים
  choice: 麻布
  rationale: פִּשְׁתִּים本义可指亚麻；在经纬线和材料受检的语境中，指由亚麻制成的织物。中文以“麻布”表达材料类别较自然，脚注保留“亚麻”的字面信息。
- source_word: וְלַצָּמֶר
  choice: 或羊毛织物
  rationale: צֶמֶר意为羊毛；经线、纬线属于织物结构，因此补出“织物”以使中文语义完整，并将连接关系按本节列举结构译作“或”。
- source_word: עוֹר
  choice: 皮革
  rationale: 此处指可用于制作物品的动物皮材料；“皮革”比“皮”更明确地传达加工后材料的语境。
- source_word: בְּכָל מְלֶאכֶת עוֹר
  choice: 在任何皮革制品上
  rationale: מְלָאכָה在此指做成的物件或加工品，而非抽象的工作；“皮革制品”是清楚自然的现代汉语。
- source_word: אוֹ ... אוֹ
  choice: 或……或……
  rationale: 保留希伯来文反复列举不同所在或材料的结构，避免把各项误解为同时成立。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的法规性表述。以“经线、纬线”使用标准纺织术语；为避免“麻或羊毛的经纬线”在中文中产生修饰歧义，译作“麻布或羊毛织物的经线或纬线”。破折号保留原节未完、承接下文的句法状态。
