  text: וְ/אִישׁ֙ אֽוֹ אִשָּׁ֔ה כִּֽי יִהְיֶ֥ה בְ/עוֹר בְּשָׂרָ֖/ם בֶּהָרֹ֑ת בֶּהָרֹ֖ת לְבָנֹֽת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/038.yaml
  text: And if a man or a woman has bright spots on the skin of the body[a], white bright spots,
translation:
  language: zh_hans
  text: 无论男女，若身上的皮肤出现亮斑，就是白色的亮斑，
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/אִישׁ ... אִשָּׁה
  choice: 无论男女
  rationale: 原文明确并列“男人或女人”。在汉语律例语境中，“无论男女”自然简洁，并完整涵盖两者。
- source_word: כִּי יִהְיֶה
  choice: 若……出现
  rationale: כִּי在此引入待查验的情形，译作“若”；יִהְיֶה结合皮肤上的症状，译作“出现”比直译“有”更符合现代汉语。
- source_word: בְּעוֹר בְּשָׂרָם
  choice: 身上的皮肤
  rationale: עוֹר意为“皮肤”，בָּשָׂר在此指人的身体；“身上的皮肤”准确而自然，也避免把“肉”误解为皮下组织。
- source_word: בֶּהָרֹת
  choice: 亮斑
  rationale: 该词指皮肤上颜色明亮或浅淡的斑块。“亮斑”简明，并保留其可见、发亮或浅色的特征。
- source_word: בֶּהָרֹת לְבָנֹת
  choice: 白色的亮斑
  rationale: לְבָנֹת明确说明这些亮斑是白色的；重复“亮斑”保留希伯来文的复述和诊断式表达。
theological_decisions: []
