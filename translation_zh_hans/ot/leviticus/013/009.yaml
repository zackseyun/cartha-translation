  text: When an infection of leprosy is in a person[a], then he shall be brought to the priest.
translation:
  language: zh_hans
  text: 人身上若有麻风病症[a]，这人就应被带到祭司面前。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “麻风病症”所译的希伯来词传统上常译为“麻风”，但它可能泛指多种皮肤病症，并不只指现代医学所说的麻风病（汉森病）。
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶגַע
  choice: 病症
  rationale: 本词在利未记13章指可观察、须由祭司检验的患处或病变；译作“病症”既符合诊察语境，也避免“灾病”等词在现代汉语中可能产生的泛化理解。
- source_word: צָרַעַת
  choice: 麻风
  rationale: “麻风”保留这一希伯来术语的传统译法及其经文辨识度；脚注说明其范围可能广于现代医学所谓的麻风病，以免造成错误的医学等同。
- source_word: כִּי
  choice: 若
  rationale: 此处引出律例中的条件情形；“若”简洁、庄重，符合现代汉语法律式表述。
- source_word: תִהְיֶה
  choice: 有
  rationale: 希伯来文为简单的“存在、发生”；结合בְאָדָם，汉语自然表达为“人身上有”，不额外加入“出现”等未明说的动态含义。
- source_word: בְּאָדָם
  choice: 人身上
  rationale: אָדָם在此泛指一个人，并非专指男性；现代汉语“人”能自然保留其通称意义。“身上”也切合皮肤病变的语境。
- source_word: וְהוּבָא
  choice: 这人就要被带到
  rationale: 保留希伯来文的被动形式和后续程序关系；“就要”表达律例规定的结果，而不擅自明确是谁带他去。
- source_word: אֶל הַכֹּהֵן
  choice: 祭司那里
  rationale: 定冠词所指的是负责检验的祭司；“到祭司那里”是现代汉语表达被带往某人面前的自然说法。
theological_decisions:
- issue: צָרַעַת是否等同现代医学的麻风病
  choice: 正文采用传统称呼“麻风”，并以“病症”表明这是经文中的诊断类别；脚注说明其含义更广
  alternative: 直接译作“皮肤病”或不加说明地译作“麻风病”
  rationale: 原词所涵盖的病况可能不止现代汉森病。正文保留传统术语便于识别，脚注则防止将古代礼仪诊断类别与单一现代疾病完全等同。
- issue: אָדָם在本条律例中的性别与指称范围
  choice: 译作“人”，并以“这人”回指
  alternative: 译作“男人”或以男性代词“他”回指
  rationale: 此处אָדָם是泛指受检者，没有证据把规定限于男性；汉语“人”准确保留通称范围，同时不增加原文未强调的性别限定。
translation_notes:
  register: 采用简洁、庄重而易懂的现代标准汉语，保留律例的条件—结果结构及原文被动语态。正文中的“麻风病症”兼顾传统术语和诊察语境，并用脚注交代其古代语义范围。
