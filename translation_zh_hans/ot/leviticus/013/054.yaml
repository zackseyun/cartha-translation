  yaml_path: translation/ot/leviticus/013/054.yaml
  text: Then the priest shall command them to wash the thing in which the infection is[b][a], and he shall quarantine it for seven days a second time.
translation:
  language: zh_hans
  text: 于是，祭司要吩咐人洗涤那受灾患影响的物件[a]，再把它隔离七天[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“洗涤那灾患在其中的物件”。原文措辞宽泛，指当时正在检验的受影响物件。
    reason: lexical_alternative
  - marker: b
    text: “隔离”也可译作“封存”或较直译为“关起来”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְצִוָּה הַכֹּהֵן
  choice: 于是，祭司要吩咐
  rationale: 法律程序中的连接词加完成式表示下一步应采取的行动；“于是……要吩咐”自然体现顺序和规范语气。
- source_word: וְכִבְּסוּ
  choice: 人把……洗净
  rationale: 第三人称复数的执行者没有明说；用泛指的“人”保留这一点，并以“洗净”表达对受检物件进行洗涤。
- source_word: אֵת אֲשֶׁר בּוֹ הַנָּגַע
  choice: 有灾病的物件
  rationale: 原文是宽泛的关系结构，指上下文中受检的衣物、皮制品或织物；“物件”不把所指限于某一种材料。
- source_word: הַנֶּגַע
  choice: 灾病
  rationale: 该词在利未记13章指需要祭司检验的异常灾患，可涉及人体或物件；“灾病”比单说“污点”更能保留其严重性，又避免把现代微生物意义的“感染”强加于物件。
- source_word: וְהִסְגִּירוֹ
  choice: 把它……隔离
  rationale: 该动词字面上指关闭、禁闭，在本段表示将物件留置以便观察；“隔离”清楚表达程序功能。
- source_word: שִׁבְעַת יָמִים שֵׁנִית
  choice: 再隔离七天
  rationale: “再”自然表达这是第二个七天的隔离期。
