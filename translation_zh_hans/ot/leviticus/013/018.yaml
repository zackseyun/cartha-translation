  yaml_path: translation/ot/leviticus/013/018.yaml
  text: And when the body has a boil in its skin[a], and it heals[c][b],
translation:
  language: zh_hans
  text: 人身上的皮肤若长了疖，并且已经好了，
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבָשָׂר
  choice: 人身上
  rationale: בָשָׂר本义为“肉、身体”；在此诊察条例中指人的身体。译作“人身上”既自然，也与后面的“皮肤”衔接清楚。
- source_word: כִּי
  choice: 若
  rationale: כִּי在此引出个案法规的条件，现代汉语法律式叙述用“若”简洁得体，同时保留条件意味。
- source_word: יִהְיֶה בּוֹ בְעֹרוֹ
  choice: 身上的皮肤……长了
  rationale: 原文直译近于“在他里面、在他的皮肤上有”；汉语重组为“人身上的皮肤若长了”，准确表达病灶所在而避免生硬重复。
- source_word: שְׁחִין
  choice: 疖
  rationale: שְׁחִין指皮肤上的疖肿或炎性疮患；“疖”是简洁、通行且符合诊察语境的现代汉语医学用词。
- source_word: וְנִרְפָּא
  choice: 并且已经好了
  rationale: רפא的Nifal形式在此可表达痊愈或被治愈。上下文关注疖的状态而非施治者，因此译为自然的不及物表达“已经好了”。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的条例语体。“若”引出祭司法规中的案例；“已经好了”交代后续皮肤症状出现前的既成状态。原文的“身体/肉体”在汉语中融入“人身上的皮肤”，避免把“肉”误解为肌肉或肉类。
