  text: וְ/אִם֮ רָאָ֣ה הַ/כֹּהֵן֒ וְ/הִנֵּה֙ כֵּהָ֣ה הַ/נֶּ֔גַע אַחֲרֵ֖י הֻכַּבֵּ֣ס אֹת֑/וֹ וְ/קָרַ֣ע אֹת֗/וֹ מִן הַ/בֶּ֨גֶד֙ א֣וֹ מִן הָ/ע֔וֹר א֥וֹ מִן הַ/שְּׁתִ֖י א֥וֹ מִן הָ/עֵֽרֶב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/056.yaml
  text: But if the priest examines it[a], and behold, the spot has faded after it was washed, then he shall tear it out of the garment, or out of the leather, or out of the warp, or out of the woof.
translation:
  language: zh_hans
  text: 但祭司若察看，发现那患处洗过以后已经变淡，就要把那一块从衣服、皮革、经线或纬线中撕掉。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאִם
  choice: 但……若
  rationale: 承接上一条处置程序并引出有对比意味的条件情形，符合希伯来语连接词与条件词的作用。
- source_word: רָאָה הַכֹּהֵן
  choice: 祭司若察看
  rationale: רָאָה本义为“看见”，在祭司法定检验的语境中译作“察看”，既自然又保留审查动作。
- source_word: וְהִנֵּה
  choice: 发现
  rationale: 在现代汉语程序性叙述中，“发现”自然传达引人注意并确认所见结果的功能，避免生硬直译为“看哪”。
- source_word: כֵּהָה הַנֶּגַע
  choice: 那患处……已经变淡
  rationale: כֵּהָה表示颜色或症状减弱；נֶגַע在本章指受侵染、呈病变迹象之处。“患处”保留其异常性质，又不误解为人体皮肤病。
- source_word: אַחֲרֵי הֻכַּבֵּס אֹתוֹ
  choice: 洗过以后
  rationale: 准确表达希伯来语被动形式的结果；汉语无需重复代词，所洗对象可由上下文明确。
- source_word: וְקָרַע אֹתוֹ
  choice: 就要把那一块……撕掉
  rationale: 原文宾语代词所指在形式上可能是患处或所在物；结合后接“从……中”，译为“那一块”自然表明应除去受影响的部分，而非撕毁整件物品。
- source_word: מִן הַבֶּגֶד
  choice: 从衣服……中
  rationale: בֶּגֶד在此指受检验的衣物，“衣服”是现代汉语清楚、宽泛的对应词。
- source_word: מִן הָעוֹר
  choice: 皮革
  rationale: 此处עוֹר与衣物及纺织材料并列，指加工或作为物件使用的皮革，而不是人体皮肤。
- source_word: מִן הַשְּׁתִי
  choice: 经线
  rationale: 准确对应织物中纵向排列的线，是现代汉语通行的纺织术语。
- source_word: מִן הָעֵרֶב
  choice: 纬线
  rationale: 准确对应与经线交织的横向线，构成自然且明确的术语对“经线或纬线”。
