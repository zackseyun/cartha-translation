base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/008.yaml
  text: And the priest shall examine him[a], and behold, if the scaly eruption has spread on the skin, the priest shall pronounce him unclean; it is leprosy.
translation:
  language: zh_hans
  text: 祭司要察看他；若见那皮疹已经在皮肤上扩散，祭司就要宣布他为不洁净；这是皮肤病[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “皮肤病”译自希伯来语 tsaraʿat（察拉阿特），传统上常译为“癞病”或“麻风病”。这个词在《利未记》中并不等同于现代医学所说的麻风病，可能涵盖较广范围的皮肤病变。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאָה
  choice: 要察看
  rationale: 在本章祭司进行鉴别的语境中，רָאָה不只是普通的“看见”，而是有目的地察看、检验。
- source_word: וְהִנֵּה
  choice: 看哪，若
  rationale: 保留הִנֵּה引人注意、呈现察看结果的作用；结合后面的诊断情形，用“若”自然表达其条件意味。
- source_word: הַמִּסְפַּחַת
  choice: 鳞状疹
  rationale: 该词指受祭司察看的表浅皮肤病变；“鳞状疹”比“痂”宽泛，也能传达可能呈鳞屑状的外观。
- source_word: פָּשְׂתָה ... בָּעוֹר
  choice: 在皮肤上扩散了
  rationale: 准确表达病变已经蔓延或扩展这一关键诊断标准。
- source_word: וְטִמְּאוֹ
  choice: 宣布他为不洁净
  rationale: 祭司在此判定并宣告礼仪身份，并非使当事人变得不洁净。
- source_word: צָרַעַת
  choice: 癞病
  rationale: 采用简洁、具有利未记传统语域的总称，同时以脚注说明它不应被狭义等同于现代医学所说的麻风病。
- source_word: הִוא
  choice: 这是
  rationale: 阴性代词回指前述病症，构成明确的鉴定句。
theological_decisions:
- issue: 利未记洁净条例中צָרַעַת的译法
  choice: 癞病
  alternative: 严重皮肤病；麻风病；察拉阿特
  rationale: 希伯来词所指范围比现代汉语的“麻风病”更广，且本节属于祭司判定礼仪洁净状态的语境。“癞病”保留传统经文术语和类别名称，但必须用脚注防止读者将其直接等同于汉森病。
translation_notes:
  register: 采用现代、庄重而易懂的律例文体。“看哪”保留原文提示察看结果的语气；“宣布……为不洁净”突出祭司的鉴定和宣告职能。
