  yaml_path: translation/ot/leviticus/013/050.yaml
  text: And the priest shall examine the diseased area[b][a], and he shall isolate the diseased area for seven days.
translation:
  language: zh_hans
  text: 祭司要察看那异常斑痕[a]，并把有这异常斑痕的物件隔离[b]七天。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “异常斑痕”也可译作“患处”“斑痕”，或较传统地译作“灾病”。希伯来语指祭司所察看的受影响之处或异常痕迹；在本段衣物检验的语境中，并不必然指某一种现代疾病。
    reason: lexical_alternative
  - marker: b
    text: “隔离”也可译作“关起来”“封闭”或“留置”。这里指暂时留置，以便观察。原文仍重复说“封闭该异常处”；在实际操作上，所指为带有该痕迹的物件。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאָה
  choice: 要察看
  rationale: רָאָה本义为“看见、看”，但在本章祭司履行检验程序的语境中，译作“察看”更能表达正式检查的含义，同时不把祭司的判断现代医学化。
- source_word: הַכֹּהֵן
  choice: 祭司
  rationale: 准确对应带定冠词的כֹּהֵן；汉语在上下文明确时无需另加“那位”。
- source_word: הַנָּגַע / הַנֶּגַע
  choice: 病斑 / 有病斑的物件
  rationale: נֶגַע指受检的异常斑痕或受影响部位，不宜径直归入某种现代疾病。首处译为“病斑”；第二处按衣物检验的上下文显明其转喻意义，译为“有病斑的物件”，避免产生只把一小块部位单独关起来的误解。
- source_word: וְהִסְגִּיר
  choice: 并将……隔离
  rationale: סגר的使役式表示关起、封闭或隔离。此处是暂时留置以便观察，现代汉语用“隔离”清楚而不过度限定具体操作方式。
- source_word: שִׁבְעַת יָמִים
  choice: 七天
  rationale: 直接表达原文的持续时段；“隔离七天”符合现代汉语习惯。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“察看”保留祭司检验程序的正式感；“病斑”避免“瘟疫”等词可能造成的现代传染病联想。根据利未记13:47—59衣物受检的近邻语境，第二个“病斑”以转喻方式译为“有病斑的物件”，并用脚注交代原文形式。
