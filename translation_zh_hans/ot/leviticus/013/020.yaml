  text: וְ/רָאָ֣ה הַ/כֹּהֵ֗ן וְ/הִנֵּ֤ה מַרְאֶ֨/הָ֙ שָׁפָ֣ל מִן הָ/ע֔וֹר וּ/שְׂעָרָ֖/הּ הָפַ֣ךְ לָבָ֑ן וְ/טִמְּא֧/וֹ הַ/כֹּהֵ֛ן נֶֽגַע צָרַ֥עַת הִ֖וא בַּ/שְּׁחִ֥ין פָּרָֽחָה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/020.yaml
  text: And the priest shall examine it[a], and behold, its appearance is deeper than the skin, and its hair has turned white; then the priest shall pronounce him unclean. It is an outbreak of leprosy; it has broken out in the boil.
translation:
  language: zh_hans
  text: 祭司要察看；看哪，患处显得比周围的皮肤凹陷，患处上的毛已经变白，祭司就要宣布那人为不洁净。这是在疮中发出的皮肤病[a]灶。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语“צָרַעַת”，传统译作“大麻风”；在《利未记》中，这个词可能泛指多种皮肤病症，并不专指现代所说的汉森病。
    reason: 说明传统译名与希伯来语词义范围之间的差异，避免时代错置的医学理解。
lexical_decisions:
- source_word: וְרָאָה
  choice: 要察看
  rationale: 在祭司诊断病症的程序中，该动词指仔细检验，不只是一般的“看见”。
- source_word: וְהִנֵּה
  choice: 看哪
  rationale: 保留原文引人注意、提示观察结果的话语标记，同时维持庄重语体。
- source_word: מַרְאֶהָ שָׁפָל מִן הָעוֹר
  choice: 它看起来陷入皮下
  rationale: 原文直指患处的外观低于皮肤；此译自然表达患处呈凹陷状，而不把它断定为实际侵入深度。
- source_word: וּשְׂעָרָהּ הָפַךְ לָבָן
  choice: 其中的毛已经变白
  rationale: 阴性后缀指相关患处；“其中的毛”比直译“它的毛”更符合现代汉语。
- source_word: וְטִמְּאוֹ
  choice: 宣布那人为不洁净
  rationale: 祭司作出礼仪性的权威判定，并非使那人变得不洁净。
- source_word: נֶגַע צָרַעַת
  choice: 大麻风的病症
  rationale: “病症”表达 נֶגַע 在诊断语境中的患病征象；“大麻风”保留 צָרַעַת 的传统经文称谓，并以脚注防止与现代汉森病简单等同。
- source_word: בַּשְּׁחִין
  choice: 在疮中
  rationale: שְׁחִין 指疖疮或发炎的疮；“疮”在本段上下文中简洁自然。
- source_word: פָּרָחָה
  choice: 发作
  rationale: 该动词描写病症从疮处显现或发出；“发作”不额外断定它已向全身扩散。
theological_decisions:
- issue: 利未记礼仪律中 צָרַעַת 的译法
  choice: 大麻风
  alternative: 皮肤病
  rationale: 采用中文圣经传统中辨识度较高的称谓，但用脚注明确其希伯来语涵盖范围可能更广，避免将古代礼仪诊断直接等同于现代汉森病。
- issue: 祭司使人“不洁净”还是判定人为“不洁净”
  choice: 宣布那人为不洁净
  alternative: 使他不洁净
  rationale: 上下文描述祭司依据征象作礼仪判定；“宣布”既保留判定的权威性，也避免暗示祭司造成了不洁净状态。
translation_notes:
  register: 采用现代、庄重而易懂的法律—礼仪语体。“看哪”刻意保留原文的观察提示；“患处”由诊断语境补出，使代词所指在中文中清楚。
