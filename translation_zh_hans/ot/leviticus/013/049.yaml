  verdict: revise
  source_fidelity: 原文以条件句描述衣物、皮革、经线、纬线或任何皮制器物上的“斑痕”；若其呈浅绿或浅红色，即被归为 נֶגַע צָרַעַת，并须呈交祭司。草稿完整涵盖各项材料、近似色彩及不明示施事者的被动语气。惟“这种斑痕就是灾病”把斑痕与疾病类别直接等同，汉语语义略显含混；补出“的斑痕”能更贴近该希伯来语构词关系。
  naturalness: “衣物、皮革、经线、纬线或任何皮制物品上的斑痕”清楚自然；“发绿或发红”可用，但“呈浅绿色或浅红色”更准确体现重叠形容词所表达的近似色调，且在法例语体中更稳妥。“要给祭司察看”比“要拿给祭司看”更庄重，并自然保持原文未指明谁呈交的表达。
