  text: וְ/הָיָ֨ה הַ/נֶּ֜גַע יְרַקְרַ֣ק א֣וֹ אֲדַמְדָּ֗ם בַּ/בֶּגֶד֩ א֨וֹ בָ/ע֜וֹר אֽוֹ בַ/שְּׁתִ֤י אוֹ בָ/עֵ֨רֶב֙ א֣וֹ בְ/כָל כְּלִי ע֔וֹר נֶ֥גַע צָרַ֖עַת ה֑וּא וְ/הָרְאָ֖ה אֶת הַ/כֹּהֵֽן׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/049.yaml
  text: And if the spot is greenish or reddish in the garment[a], or in the leather, or in the warp or in the woof, or in any article of leather, it is a diseased spot of skin disease[b], and it shall be shown to the priest.
translation:
  language: zh_hans
  text: 如果衣物、皮革、经线、纬线或任何皮制物品上的斑痕呈浅绿色或浅红色，这就是灾病[a]的斑痕，要给祭司察看。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “灾病”译自希伯来语 צָרַעַת。这是《利未记》中由祭司鉴定的一类异常状况，可见于人体、衣物或房屋；传统常译作“大麻风”，但并不专指现代医学所说的麻风病。
    reason: 说明希伯来语专门类别，并避免传统译名造成现代医学上的误解。
lexical_decisions:
- source_word: נֶגַע
  choice: 斑痕
  rationale: 本节所指是在衣物或皮革上可见的异常区域；“斑痕”自然、具体，也适用于非人体材料。
- source_word: יְרַקְרַק
  choice: 发绿
  rationale: 重叠词形表示近似或带有某种绿色；“发绿”保留颜色并避免把具体色调说得过于确定。
- source_word: אֲדַמְדָּם
  choice: 发红
  rationale: 重叠词形表示呈红色或略带红色；“发红”符合观察性描述。
- source_word: בֶּגֶד
  choice: 衣物
  rationale: 这里是纺织品类别。“衣物”比“衣服”略广，也能涵盖上下文所说的织物制品。
- source_word: עוֹר
  choice: 皮革
  rationale: 此处指作为材料使用的兽皮，而非活体皮肤；“皮革”最清楚。
- source_word: שְׁתִי
  choice: 经线
  rationale: 指织物纵向排列的线，是现代汉语通行的纺织术语。
- source_word: עֵרֶב
  choice: 纬线
  rationale: 指织物横向交织的线，与“经线”构成准确、易懂的术语对。
- source_word: כְּלִי עוֹר
  choice: 皮制物品
  rationale: כְּלִי 可泛指器具或物件；“皮制物品”既自然又保留其宽泛范围。
- source_word: נֶגַע צָרַעַת
  choice: 这种斑痕就是灾病
  rationale: 逐项保留“斑痕”与祭司鉴定的特殊“灾病”类别，同时避免把 צָרַעַת 误认作现代医学所说的麻风病。脚注说明其传统译法和范围。
- source_word: וְהָרְאָה אֶת־הַכֹּהֵן
  choice: 要拿给祭司看
  rationale: 希伯来语为使役被动，施事者未明说。汉语用无主句“要拿给……看”自然地保留施事者不明确这一点。
theological_decisions:
- issue: 祭司法例中 צָרַעַת 的译法
  choice: 灾病
  alternative: 麻风病／大麻风
  rationale: 《利未记》中的 צָרַעַת 不仅涉及人体，也可出现在衣物和皮革上，因此不是现代医学中特指的麻风病。“灾病”把它作为祭司鉴定的特殊病变类别来表达，又不强加现代诊断。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“发绿或发红”保留原文近似色彩的观察语气；“经线、纬线”采用通行纺织术语。句末不用补出“察看”等原文未明说的动作，只以“看”自然表达呈交祭司鉴定。
