  text: וַ/יְדַבֵּ֣ר יְהוָ֔ה אֶל מֹשֶׁ֥ה וְ/אֶֽל אַהֲרֹ֖ן לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/001.yaml
  text: And Yahweh spoke to Moses and to Aaron[a], saying,
translation:
  language: zh_hans
  text: 雅威[a]对摩西和亚伦说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文作“YHWH”（יהוה）；这里译作“雅威”。传统中文译本常译作“耶和华”。
    reason: 说明神名的原文形式及传统中文译法。
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: 说
  rationale: 该动词在这里引出一段新的神谕；现代汉语用“说”自然、庄重，也符合固定叙事句式。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文四字神名 יהוה（YHWH）的常见学术拟音译出，保留其作为神之专名的性质，而不以称号代替。
- source_word: אֶל מֹשֶׁה וְאֶל אַהֲרֹן
  choice: 对摩西和亚伦
  rationale: 两个 אֶל 分别标明说话的对象；汉语用“对……和……”清楚表达两位共同受话者，无须机械重复介词。
- source_word: לֵאמֹר
  choice: 说：
  rationale: 该不定式用于引出下文直接话语；汉语以“说：”衔接下一节最为自然，并保留其引语功能。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名，而非“主”的称号；正文采用“雅威”以保留专名，并用脚注交代希伯来文形式及中文传统译法。
translation_notes:
  register: 采用现代、简洁而庄重的叙事语言。“对摩西和亚伦说”符合当代标准汉语；冒号明确表示话语内容将在下一节开始。
