  text: וְ/רָאָ֨ה הַ/כֹּהֵ֜ן אַחֲרֵ֣י הֻכַּבֵּ֣ס אֶת הַ/נֶּ֗גַע וְ֠/הִנֵּה לֹֽא הָפַ֨ךְ הַ/נֶּ֤גַע אֶת עֵינ/וֹ֙ וְ/הַ/נֶּ֣גַע לֹֽא פָשָׂ֔ה טָמֵ֣א ה֔וּא בָּ/אֵ֖שׁ תִּשְׂרְפֶ֑/נּוּ פְּחֶ֣תֶת הִ֔וא בְּ/קָרַחְתּ֖/וֹ א֥וֹ בְ/גַבַּחְתּֽ/וֹ׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/055.yaml
  text: Then the priest shall examine it after the diseased area has been washed[a], and if the diseased area has not changed its appearance and the diseased area has not spread, it is unclean. You shall burn it in the fire; it is a corrosive spot[c][b], whether on its worn side or on its bare side.
translation:
  language: zh_hans
  text: 祭司要在患处洗过以后察看；若见患处的外观没有改变[a]，患处也没有扩散，它就是不洁净的。你要用火把它烧掉；这是腐蚀性的斑痕[b]，无论在物件的这一部位或另一部位[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“患处的颜色没有改变”。希伯来语直译为“患处没有改变它的眼”，指肉眼可见的样貌。
    reason: lexical_alternative
  - marker: b
    text: 或译“腐蚀性的病变”。这个罕见的希伯来语词指材料遭受侵蚀或毁损的患斑；传统译法不尽相同。
    reason: lexical_alternative
  - marker: c
    text: 本句末尾的希伯来语含义不确定，直译近似“在它的后秃处或前额秃处”。这些通常描述头部不同部位的词在这里用于衣料或皮革，可能指物件的两个表面或部位。
    reason: textual_or_interpretive_difficulty
lexical_decisions:
- source_word: וְרָאָה
  choice: 祭司要……察看
  rationale: 在利未记祭司鉴察灾病的语境中，רָאָה不只是一般的“看见”，而是有目的地检查、察看。
- source_word: אַחֲרֵי הֻכַּבֵּס אֶת הַנֶּגַע
  choice: 在患处洗过以后
  rationale: הֻכַּבֵּס是被动形式，表示患处或受影响部分已经经过洗涤；中文用“洗过”自然表达这一结果状态，同时不强行指定洗涤者。
- source_word: הַנֶּגַע
  choice: 患处
  rationale: 本章该词指受灾病影响、需要鉴察的部位；“患处”比“瘟疫”更符合衣物或皮革制品的语境，也避免误指现代医学上的特定疾病。
- source_word: לֹא הָפַךְ הַנֶּגַע אֶת עֵינוֹ
  choice: 患处的外观没有改变
  rationale: 希伯来语直译为“患处没有改变它的眼”，是指可见的样貌，可能特别涉及颜色；正文用“外观”保留较宽的语义，脚注说明“颜色”这一可能。
- source_word: לֹא פָשָׂה
  choice: 没有扩散
  rationale: פָשָׂה在本章鉴察灾病的语境中表示病变范围蔓延或扩大，“扩散”简洁准确。
- source_word: טָמֵא הוּא
  choice: 它就是不洁净的
  rationale: טָמֵא是利未记礼仪洁净制度中的法律判定；“不洁净”保留其礼仪范畴，不把它简化为一般的肮脏。
- source_word: בָּאֵשׁ תִּשְׂרְפֶנּוּ
  choice: 你要用火把它烧掉
  rationale: 动词是第二人称阳性单数，正文保留直接命令的形式；“用火烧掉”是自然清楚的现代汉语。
- source_word: פְּחֶתֶת
  choice: 腐蚀性的损坏
  rationale: 该罕见名词表示材料受到侵蚀、消耗或破坏的状态；此译法传达破坏性，同时不武断认定为某种现代霉菌或疾病。
- source_word: בְּקָרַחְתּוֹ אוֹ בְגַבַּחְתּוֹ
  choice: 无论出现在物件的这一面还是另一面
  rationale: 两个词通常用于头部不同部位的秃脱，在此被转用于衣料或皮革，具体所指表面并不确定。正文保留“两面”的对举而不擅自判定为正面、反面、新面或磨损面，具体困难见脚注。
