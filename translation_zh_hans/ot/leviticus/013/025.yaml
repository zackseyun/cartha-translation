id: LEV.13.25
reference: Leviticus 13:25
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/רָאָ֣ה אֹתָ֣/הּ הַ/כֹּהֵ֡ן וְ/הִנֵּ֣ה נֶהְפַּךְ֩ שֵׂעָ֨ר לָבָ֜ן בַּ/בַּהֶ֗רֶת וּ/מַרְאֶ֨/הָ֙ עָמֹ֣ק מִן הָ/ע֔וֹר צָרַ֣עַת הִ֔וא בַּ/מִּכְוָ֖ה פָּרָ֑חָה וְ/טִמֵּ֤א אֹת/וֹ֙ הַ/כֹּהֵ֔ן נֶ֥גַע צָרַ֖עַת הִֽוא־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/025.yaml
  text: And the priest shall examine it[a], and behold, the hair in the bright spot has turned white and its appearance is deeper than the skin, it is a skin disease that has broken out in the burn scar; and the priest shall pronounce him unclean. It is an infection of skin disease.
translation:
  language: zh_hans
  text: 祭司要察看患处；只见白斑中的毛已经变白，白斑看起来比皮肤深，这是在烧伤处发作的严重皮肤病[a]。祭司要宣布他不洁净；这是严重皮肤病的病灶。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语“察拉阿特”（tsaraʿat）泛指一类严重的皮肤患疾，传统上常译作“大麻风”，但不专指现代医学所说的麻风病（汉森病）。
    reason: 说明关键希伯来语词的广泛含义，并避免与特定现代疾病混同。
lexical_decisions:
- source_word: רָאָה
  choice: 察看
  rationale: 在祭司诊断的语境中，这个动词表示正式检视，而不只是一般的“看见”。
- source_word: בַּהֶרֶת
  choice: 白斑
  rationale: 该词指皮肤上明亮、发白的斑块；“白斑”在现代汉语中自然，也与本句毛发变白的诊断描述相协调，同时不引入具体的现代病名。
- source_word: וְהִנֵּה
  choice: 只见
  rationale: 保留希伯来语引出观察结果的提示作用，比条件式的“如果”更贴近原文，又比直译“看哪”更符合现代汉语诊断叙述。
- source_word: נֶהְפַּךְ שֵׂעָר לָבָן
  choice: 毛已经变白
  rationale: 表达毛发发生变化后的状态，贴合原文完成式和被动／自发变化的含义。
- source_word: מַרְאֶהָ עָמֹק מִן־הָעוֹר
  choice: 白斑看起来比皮肤深
  rationale: 保留这是视觉判断而非断言实际组织深度的含义，也再度明确阴性代词所指的是白斑。
- source_word: צָרַעַת
  choice: 严重皮肤病
  rationale: 该词在利未记中涵盖多种严重的皮肤患疾，并不等同于现代所称的汉森病；此译法避免误导性的医学限定。
- source_word: מִכְוָה
  choice: 烧伤处
  rationale: 该名词指烧伤所留下或影响的部位；“烧伤处”不武断认定已经形成瘢痕。
- source_word: פָּרָחָה
  choice: 发作
  rationale: 在皮肤病语境中，该动词表示病变冒出或发作；“发作”简洁自然，且不额外断定已经扩散。
- source_word: טִמֵּא אֹתוֹ
  choice: 宣布他不洁净
  rationale: 这里是祭司作出礼仪身份的权威判定，并非祭司使当事人变得不洁净。
- source_word: נֶגַע צָרַעַת
  choice: 严重皮肤病的患处
  rationale: נֶגַע在本章指可观察、可诊断的病患或病变部位；“患处”比现代医学意义较强的“感染”更少过度解释。
theological_decisions:
- issue: 利未记洁净条例中 צָרַעַת 的译法
  choice: 严重皮肤病
  alternative: 大麻风／麻风病
  rationale: 原词所指范围比现代汉森病更广，并且属于祭司依据礼仪条例判定的病患类别。采用“严重皮肤病”既保留其严重性，也不把古代类别错误等同于特定现代疾病。
- issue: 祭司在 טִמֵּא אֹתוֹ 中的作用
  choice: 宣布他不洁净
  alternative: 使他不洁净
  rationale: 原句描述祭司作出洁净条例下的判定；译为“宣布”避免暗示祭司是患病或不洁状态的成因。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“只见”自然承接祭司察看的结果并体现 וְהִנֵּה；用分号保留原文连续诊断与宣告的节奏。全句避免现代医学上的过度确诊，也保留礼仪上“不洁净”的专门含义。
