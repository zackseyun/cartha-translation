  text: וְ/אִם בַּהֶרֶת֩ לְבָנָ֨ה הִ֜וא בְּ/ע֣וֹר בְּשָׂר֗/וֹ וְ/עָמֹק֙ אֵין מַרְאֶ֣/הָ מִן הָ/ע֔וֹר וּ/שְׂעָרָ֖/ה לֹא הָפַ֣ךְ לָבָ֑ן וְ/הִסְגִּ֧יר הַ/כֹּהֵ֛ן אֶת הַ/נֶּ֖גַע שִׁבְעַ֥ת יָמִֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/004.yaml
  text: But if the bright spot is white in the skin of his flesh[a], and its appearance is not deeper than the skin, and its hair has not turned white[c][b], then the priest shall isolate the affected area for seven days.
translation:
  language: zh_hans
  text: 但如果他身上的皮肤有白色亮斑[a]，看起来并不比皮肤深，斑上的毛也没有变白，祭司就要把长有这病变[c]的人隔离[b]七天。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“明斑”或“发亮的斑块”，指这里所描述的皮肤病变。
    reason: lexical_alternative
  - marker: b
    text: 或译“暂时隔离观察”；希伯来语指暂时隔开，以便观察情况。
    reason: lexical_alternative
  - marker: c
    text: 希伯来语为“灾病、病变”；原文以病变为“隔离”的对象，语境中指长有该病变而接受检查的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּהֶרֶת
  choice: 亮斑
  rationale: 指皮肤上颜色发白、外观明亮的可见斑点；“亮斑”简洁自然，也与前文其他类型的皮肤异常相区别。
- source_word: לְבָנָה
  choice: 白色
  rationale: 直接表达该斑的颜色，不弱化为“发白”。
- source_word: בְּעוֹר בְּשָׂרוֹ
  choice: 他身上的皮肤
  rationale: 此处“肉身”实际指人的身体；采用现代汉语自然表达，同时保留病变位于皮肤的意思。
- source_word: וְעָמֹק אֵין מַרְאֶהָ מִן הָעוֹר
  choice: 看起来并不比皮肤深
  rationale: 保留这是凭外观判断深浅的诊察标准，而不是断言实际组织深度。
- source_word: וּשְׂעָרָהּ
  choice: 斑上的毛
  rationale: 所指是与该斑相关、长在其中或其上的毛；这样比直译为“它的毛”更清楚。
- source_word: לֹא הָפַךְ לָבָן
  choice: 没有变白
  rationale: הפך在这里表示状态发生变化，“变白”符合现代汉语习惯。
- source_word: וְהִסְגִּיר
  choice: 隔离
  rationale: 表示暂时隔开以便继续观察；“隔离”比“关起来”准确，也不必然暗示现代医学意义上的传染病检疫。
- source_word: אֶת־הַנֶּגַע
  choice: 患处
  rationale: נגע在本章指祭司正在检查的受影响部位或病变；“患处”避免过早诊断为某种特定疾病。
- source_word: שִׁבְעַת יָמִים
  choice: 七天
  rationale: 自然表达规定的隔离观察期限。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。保留“看起来”所表达的观察性判断，不把该皮肤异常等同于现代医学所称的麻风病；“隔离”按上下文理解为为期七天的暂时观察措施。
