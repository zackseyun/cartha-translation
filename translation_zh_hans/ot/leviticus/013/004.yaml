  to: 但如果他身上的皮肤有白色亮斑[a]，看起来并不比皮肤深，斑上的毛也没有变白，祭司就要把长有这病变[c]的人隔离[b]七天。
  rationale: 仅修正末句的汉语搭配及其所指：原文的“隔离病变”在上下文中是以病变指代患者。修订明确被隔离的是长有病变的人，同时以脚注保留原文措辞的观察。其余译文忠实、自然，无须改动。
