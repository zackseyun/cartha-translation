  text: בִּ/שְׁנַ֥ת הַ/יּוֹבֵ֖ל הַ/זֹּ֑את תָּשֻׁ֕בוּ אִ֖ישׁ אֶל אֲחֻזָּתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/013.yaml
  text: In this Year of Jubilee[a], each of you shall return to his property.
translation:
  language: zh_hans
  text: 在这禧年，你们各人都要归回自己的产业[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “产业”也可译作“地业”或“所拥有的土地”；这里主要指个人或家族所持有的土地。
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּשְׁנַת הַיּוֹבֵל הַזֹּאת
  choice: 在这禧年
  rationale: 介词 בְּ 与“年”的组合表达时间范围；הַזֹּאת 修饰“禧年”。“在这禧年”既贴近原文，也符合现代汉语表达。
- source_word: תָּשֻׁבוּ
  choice: 你们……都要归回
  rationale: 这是第二人称阳性复数未完成式，在律法语境中表达规定或要求。“要归回”自然传达其规范语气，并保留复数受话者“你们”。
- source_word: אִישׁ
  choice: 各人
  rationale: אִישׁ 在此作逐一分配用法，意为每一个人。“各人”准确保留其分配意义，又符合现代汉语习惯。
- source_word: אֶל אֲחֻזָּתוֹ
  choice: 归回自己的产业
  rationale: אֲחֻזָּה 在利未记25章指个人或家族所持有的土地产业；反身表达“自己的”在汉语中自然承接“你们各人”。“产业”简洁表达该法律语境中的土地所有物。
theological_decisions:
- issue: אִישׁ 的阳性单数分配形式
  choice: 各人
  alternative: 各男子；每个人
  rationale: 这里的重点是对复数受话者逐一适用规定，而不是特别强调生理性别。“各人”保留分配性，不额外扩大或缩小原文所指范围。
- issue: “归回”是返回土地还是恢复产权
  choice: 保留“归回自己的产业”的原文张力
  alternative: 收回自己的产业；回到自己的地业
  rationale: שׁוּב אֶל 可以描写回到某处，而本章制度背景也涉及产业复归。正文不把这两层含义强行限定为其中之一。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“禧年”沿用中文圣经及一般神学语境中已通行的制度名称；“你们各人都要”清楚呈现复数命令与逐一分配结构。
