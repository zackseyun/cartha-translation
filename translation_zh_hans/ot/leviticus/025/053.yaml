  text: כִּ/שְׂכִ֥יר שָׁנָ֛ה בְּ/שָׁנָ֖ה יִהְיֶ֣ה עִמּ֑/וֹ לֹֽא יִרְדֶּ֥/נּֽוּ בְּ/פֶ֖רֶךְ לְ/עֵינֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/053.yaml
  text: Like a hired worker year by year he shall be with him[a]; he shall not rule over him harshly in your sight.
translation:
  language: zh_hans
  text: 他要像雇工一样，年年与那人在一起[a]；那人不可在你眼前严酷地辖制他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他要像雇工一样，年复一年与那人在一起。”
    reason: “年年”对应原文逐年、持续的惯用表达；“年复一年”为自然的中文替代表达。
lexical_decisions:
- source_word: כִּשְׂכִיר
  choice: 像雇工一样
  rationale: כ 前缀表示比较，שׂכיר 指受雇作工的人，不是奴隶；“像雇工一样”准确、自然，并保留其受法律保护的身份对比。
- source_word: שָׁנָה בְּשָׁנָה
  choice: 年年
  rationale: 该分配性惯用语表示逐年持续的状态；“年年”简洁自然。
- source_word: יִהְיֶה עִמּוֹ
  choice: 与那人同住
  rationale: 原文直译为“与他在一起”。在本段主仆居处与服役的语境中，“同住”自然表达持续处于其家中的状态，但不擅自补入“服事”。
- source_word: לֹא יִרְדֶּנּוּ
  choice: 不可……辖制他
  rationale: רדה 表示统治、支配；“辖制”保留权力关系及禁令的力度。
- source_word: בְּפֶרֶךְ
  choice: 严酷地
  rationale: 该词表示严厉、残酷的压迫方式，尤其与强迫劳役相关；“严酷地”与“辖制”搭配自然。
- source_word: לְעֵינֶיךָ
  choice: 在你眼前
  rationale: 保留“眼”这一原文意象，表示这种行为发生在受话者亲眼可见、应当干预的范围内。
theological_decisions:
- issue: 以色列人在外族主人手下的法律身份
  choice: 译作“像雇工一样”，呈现比较关系及暂时、受保护的地位
  alternative: 译作“作为雇工”或采用带有更强奴隶意味的称谓
  rationale: 原文 כִּשְׂכִיר 以比较词 כ 开头，且 שׂכיר 指雇工。译文既不抹去本章中的服役处境，也不把经文未明说的动产奴隶身份强加进去。
- issue: “他要与他在一起”的具体含义
  choice: 译作“与那人同住”，并以脚注保留更贴近字面的译法
  alternative: 译作“服事那人”
  rationale: היה עם 字面仅表示“与……在一起”；“服事”虽符合上下文，却增加了动词本身没有明说的内容。
translation_notes:
  register: 采用现代、庄重而通顺的法律文体。“那人”用于区分外族主人和被赎的弟兄；分号保留原文两项规定之间紧密而清楚的关系。
