base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/020.yaml
  text: And if you say, ‘What will we eat in the seventh year, since we will not sow or gather our produce?’
translation:
  language: zh_hans
  text: 如果你们说：‘第七年我们吃什么呢？看哪，我们既不播种，也不收集自己的出产。’
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְכִי תֹאמְרוּ
  choice: 如果你们问
  rationale: 这里引出百姓可能提出的问题；汉语用“如果你们问”比直译“如果你们说”更自然，也准确体现后面的疑问内容。
- source_word: מַה נֹאכַל
  choice: 我们吃什么呢
  rationale: 保留直接疑问和对安息年食物供应的忧虑；“呢”使现代汉语问句自然。
- source_word: בַּשָּׁנָה הַשְּׁבִיעִת
  choice: 第七年
  rationale: 按原文直译；上下文明确指土地安息的第七年。
- source_word: הֵן
  choice: （不单独译出）
  rationale: 该词在此引出并强调现实依据。汉语借后句及“既……也……”自然表达这一语用功能，避免生硬译作“看哪”。
- source_word: לֹא נִזְרָע וְלֹא נֶאֱסֹף
  choice: 我们既不撒种，也不收取
  rationale: 两个未完成式在假设性问题中表示第七年将不做的事；“既不……也不……”清楚保留并列否定。
- source_word: תְּבוּאָתֵנוּ
  choice: 我们的出产
  rationale: תְּבוּאָה可指土地的产物或收成；“出产”保留较宽泛的意义，并与土地条例的语境相称。
theological_decisions:
- issue: הֵן与前句的逻辑关系
  choice: 以独立陈述呈现：“我们既不撒种，也不收取我们的出产。”
  alternative: 译为原因从句：“既然我们不撒种，也不收取我们的出产。”
  rationale: 原文הֵן具有提示、强调作用，不是明确的因果连词。独立陈述更能保留原文的修辞力度与逻辑开放性，不把关系过度确定为“因为/既然”。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留直接引语和百姓忧虑的口吻；不添加原文没有的解释性内容。
