  yaml_path: translation/ot/leviticus/025/048.yaml
  text: After he has been sold[a], he may be redeemed; one of his brothers may redeem him.
translation:
  language: zh_hans
  text: 他被卖以后，可以得赎；他的弟兄[a]中有一人可以赎他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “弟兄”直译希伯来文；在这里的法律语境中，指可为他办理赎回的男性家族成员。也可较宽泛地译作“亲属”。
    reason: 说明原文“弟兄”的字面阳性称谓，以及其在亲属赎回法律语境中的较广适用范围。
lexical_decisions:
- source_word: אַחֲרֵי נִמְכַּר
  choice: 他被卖以后
  rationale: אַחֲרֵי引出已经发生的处境，נִמְכַּר是מכר的尼法勒完成式，表示“被卖”。译文以自然的汉语时间结构表达。
- source_word: גְּאֻלָּה תִּהְיֶה לּוֹ
  choice: 仍可得赎
  rationale: 原文直译近于“赎回要归于他／他可有赎回”，表示被卖之后赎回仍然可行。“得赎”保留法律性的救赎用语，“仍可”清楚传达这种权利或可能性。
- source_word: אֶחָד מֵאֶחָיו
  choice: 他的弟兄中有一人
  rationale: אֶחָיו字面为“他的弟兄”，在本段法律语境中指可履行至亲赎回责任的男性亲属。正文保留其明确的阳性亲属称谓及“从中一人”的结构。
- source_word: יִגְאָלֶנּוּ
  choice: 可以赎他
  rationale: גאל是亲属赎回制度的核心动词；“赎”兼顾法律含义及其经文用语的延续性。“可以”表达本条款所准许的行动，不把它强化为无条件命令。
theological_decisions:
- issue: אֶחָיו所指的亲属范围
  choice: 正文译作“他的弟兄”
  alternative: 他的亲属／他的族亲
  rationale: 希伯来文明确使用阳性复数“弟兄”。本段下文继续列举伯叔、堂表兄弟等亲属，说明这里处于至亲赎回的法律框架中；正文不擅自扩大词义，脚注提示其法律语境中的亲属功能。
- issue: גְּאֻלָּה תִּהְיֶה לּוֹ的法律语气
  choice: 仍可得赎
  alternative: 他必有赎回权／必有人赎他
  rationale: 该结构确认赎回对他仍属可行或可享有的安排，却没有明确保证实际必有人执行赎回。因此避免译成必然会获赎。
translation_notes:
  register: 采用现代、庄重而简洁的法律叙述语体。“被卖”“得赎”“赎他”彼此呼应；保留“弟兄”的原文性别信息，并以脚注解释其亲属赎回语境。
