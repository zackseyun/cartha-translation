  text: וְ/כִֽי יָמ֥וּךְ אָחִ֛י/ךָ עִמָּ֖/ךְ וְ/נִמְכַּר לָ֑/ךְ לֹא תַעֲבֹ֥ד בּ֖/וֹ עֲבֹ֥דַת עָֽבֶד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/039.yaml
  text: And if your brother becomes poor with you and sells himself to you[b][a], you shall not make him serve as a slave.
translation:
  language: zh_hans
  text: 你的弟兄若在你那里陷入贫困，卖身给你[a]，你不可把他当奴隶役使[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“被卖给你”。原文采用被动形式；按本段语境，指穷人因贫困而卖身服役。
    reason: alternative_reading
  - marker: b
    text: 直译：“不可使他做奴隶的劳役。”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כִי
  choice: 若
  rationale: 引出律法中的条件情形；现代汉语用“若”简洁庄重，句首无需机械译出连接词“和”。
- source_word: יָמוּךְ
  choice: 陷入贫困
  rationale: 该动词表示经济状况衰落、变得贫穷；“陷入贫困”既体现过程，也符合现代汉语表达。
- source_word: אָחִיךָ
  choice: 你的弟兄
  rationale: 保留原文的亲属称谓及其盟约群体语境，不在正文中直接释作“以色列同胞”。
- source_word: עִמָּךְ
  choice: 你身边的
  rationale: 表达此人处于受话者身边、与其共同生活的关系语境，同时使汉语句式自然。
- source_word: וְנִמְכַּר לָךְ
  choice: 卖身给你
  rationale: 原文为被动形态，可直译为“被卖给你”；但在贫困所导致的债役语境中，“卖身给你”自然传达其惯用含义，并以脚注保留被动译法。
- source_word: לֹא תַעֲבֹד בּוֹ
  choice: 你不可让他……服役
  rationale: 该结构表示使某人劳动或要求某人服役；如此翻译清楚表达禁令的使役含义。
- source_word: עֲבֹדַת עָבֶד
  choice: 像奴隶一样服役
  rationale: 原意为“奴隶的劳役”；正文以自然汉语说明禁止按奴隶的身份和劳役方式对待他，并在脚注保留较直译的表达。
theological_decisions:
- issue: 以色列债役律例中身份与劳役用语的翻译
  choice: 像奴隶一样服役
  alternative: 像仆人一样服侍；做奴隶的劳役；作债役仆人
  rationale: עֶבֶד在这里涉及受奴役的身份和相应劳役，并非一般性的服侍。译作“奴隶”保留禁令的力度，也不掩饰经文所区分的社会身份；本节并非否认贫困弟兄进入某种服役关系，而是禁止把他当作奴隶役使。
translation_notes:
  register: 采用现代、庄重而易懂的律法语言。“弟兄”保留原文的群体亲属称谓；“卖身”与“奴隶”直接呈现债役和身份张力，不作委婉化处理。
