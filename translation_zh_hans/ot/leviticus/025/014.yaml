revisions:
- from: 你们若把什么卖给同胞[a]，或从同胞手里买什么，彼此不可欺压。
  to: 你们若卖东西给同伴，或从同伴手中购买，不可彼此亏负。
  rationale: 修订以“同伴”更准确传达עָמִית的共同体关系，并将“欺压”改为“亏负”，使禁令与本节买卖语境及原文动词的商业性不义相符。“彼此”保留原文分配性、相互性的禁令效果；“从同伴手中”则保留מִיַּד的具体交易惯用语。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T04:51:17Z'
review_pass:
  verdict: revise
  source_fidelity: 原文的条件句、卖与买的并列关系，以及“从……手中”的交易惯用语均已表达。不过“欺压”通常指强势压迫，未能准确体现ינה在此买卖语境中“亏负、以不正当交易占便宜”的核心含义；宜改为“亏负”。“彼此”可自然表达איש את אחיו在禁令中的相互、分配性用法。
  naturalness: 原译整体通顺，律法语体也适切。“同胞”在现代汉语中较易首先理解为同国人；“同伴”更贴近עָמִית所指共同体中的同类成员，且不不当地扩大为国族概念。“从同伴手中购买”自然且保留原文具体说法。
  terminology: 建议将“欺压”统一改为“亏负”，这是中文圣经及现代法律/伦理语境中对该处商业性不义较准确、庄重的表达。以“同伴”译עָמִית，并在脚注保留“邻舍”等替代译法，可避免把术语固定为现代国族意义的“同胞”。
  issues:
  - severity: medium
    issue: “欺压”弱化了交易语境中的具体不义。
    rationale: תּוֹנוּ（源自ינה）在紧邻买卖的语境中指不公正地亏待或占对方便宜；“欺压”更常指广义、持续性的压迫，虽非完全错误，却不够准确。
  - severity: low
    issue: “同胞”可能带入现代国族含义。
    rationale: עָמִית指共同体内的同伴、同类成员；“同伴”较能保留该社会—共同体关系，而不将其限定为现代意义的同国人。
  revised_text: 你们若卖东西给同伴，或从同伴手中购买，不可彼此亏负。
  revised_footnotes:
  - marker: a
    text: “同伴”也可译作“邻舍”或“同胞”，指共同体中的成员。“不可彼此亏负”直译作“各人不可亏负自己的弟兄”；这里尤其指在买卖中不公平地占人便宜。
    reason: 说明עָמִית的共同体含义，并保留אִישׁ אֶת אָחִיו的较字面表达及ינה在商业语境中的含义。
