  text: וְ/כִֽי תִמְכְּר֤וּ מִמְכָּר֙ לַ/עֲמִיתֶ֔/ךָ א֥וֹ קָנֹ֖ה מִ/יַּ֣ד עֲמִיתֶ֑/ךָ אַל תּוֹנ֖וּ אִ֥ישׁ אֶת אָחִֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/014.yaml
  text: And if you sell something to your neighbor[a], or buy from your neighbor, no man shall oppress his brother.
translation:
  language: zh_hans
  text: 你们若卖东西给同伴，或从同伴手中购买，不可彼此亏负。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְכִי
  choice: 若
  rationale: 在律法条文中引出条件情形；现代汉语用“若”简洁而庄重，连接意味可由上下文承接。
- source_word: תִמְכְּרוּ מִמְכָּר
  choice: 把什么卖
  rationale: מִמְכָּר可指所售之物或买卖；此处用泛指的“什么”配合“卖”，符合汉语交易表达，又不把对象限定为特定商品。
- source_word: לַעֲמִיתֶךָ
  choice: 给同胞
  rationale: עָמִית指共同体中的同伴或成员。“同胞”保留以色列共同体内部的关系含义，比一般性的“邻舍”更贴合此处。
- source_word: אוֹ קָנֹה מִיַּד עֲמִיתֶךָ
  choice: 或从同胞手里买什么
  rationale: קָנֹה在此与前一有限动词并列，表达“买”；מִיַּד的具体惯用语以“从……手里”保留，汉语自然且清楚。
- source_word: אַל תּוֹנוּ
  choice: 不可欺压
  rationale: ינה在交易语境中表示亏负、欺骗或占人便宜。“欺压”保留其较宽的伤害性含义，脚注说明这里尤指交易中的不公。
- source_word: אִישׁ אֶת אָחִיו
  choice: 彼此
  rationale: 该结构字面为“各人对他的弟兄”，在禁令中具有相互、分配性的群体意义。汉语“彼此”自然传达此义，不额外限定为亲生兄弟。
theological_decisions:
- issue: אִישׁ אֶת אָחִיו的代表性阳性与共同体范围
  choice: 译作“彼此”
  alternative: “各人不可欺压自己的弟兄”
  rationale: 希伯来文采用阳性单数表达共同体成员之间的普遍责任。汉语“彼此”保存法律对群体内部相互行为的要求，也避免让现代读者误解为只涉及男性或亲生兄弟。
- issue: תּוֹנוּ在商业语境中的含义范围
  choice: 正文用“欺压”，脚注注明“亏负、占便宜”
  alternative: 正文直接译作“亏负”或“欺骗”
  rationale: “欺压”保留动词较宽的伦理力度，而上下文与脚注明确其在买卖中尤其指不公平地占人便宜，不把含义缩窄为单纯欺诈。
translation_notes:
  register: 采用现代、庄重而易懂的律法语体。“从同胞手里”保留原文具体的交易惯用语；“彼此不可欺压”简洁表达禁令，并由脚注保存较字面的亲属措辞和商业语义。
