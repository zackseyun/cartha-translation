  text: וַ/אֲשֶׁ֤ר יִגְאַל֙ מִן הַ/לְוִיִּ֔ם וְ/יָצָ֧א מִמְכַּר בַּ֛יִת וְ/עִ֥יר אֲחֻזָּת֖/וֹ בַּ/יֹּבֵ֑ל כִּ֣י בָתֵּ֞י עָרֵ֣י הַ/לְוִיִּ֗ם הִ֚וא אֲחֻזָּתָ֔/ם בְּ/ת֖וֹךְ בְּנֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/033.yaml
  text: And if one of the Levites redeems it[a], then the sale of the house in the city of his possession shall be released in the Jubilee[b]; for the houses of the cities of the Levites are their possession among the sons of Israel.
translation:
  language: zh_hans
  text: 若有利未人赎回房屋[a]，他产业城中所卖的房屋到了禧年就要归回[b]；因为利未人各城的房屋，是他们在以色列子孙中所拥有的产业[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “房屋”按上下文补出。开头也可理解为：“若有人从利未人手中赎回房屋。”希伯来语介词可按“利未人中的一位”或“从利未人那里”理解。
    reason: 句法歧义及省略宾语说明
  - marker: b
    text: “归回”直译为“出去”，指所卖的房屋脱离买者的占有而归回原属者。
    reason: 词义说明
  - marker: c
    text: “以色列子孙”是希伯来语对以色列全体民众的惯常称呼。
    reason: 称谓说明
lexical_decisions:
- source_word: וַאֲשֶׁר יִגְאַל מִן הַלְוִיִּם
  choice: 若利未人中有人赎回了房屋
  rationale: 将 מִן 理解为表示群体中的一员，即“利未人中有人”；גאל 在本段土地法规中是赎回产业。原文未明说宾语，按上下文补出“房屋”，并用脚注保留另一种句法理解。
- source_word: וְיָצָא
  choice: 就要归回
  rationale: 字面是“出去”，在禧年产业法规中指所卖产业脱离买方而回归原有归属。“归回”既表达法律效果，也避免把动作误解为房屋实际移动。
- source_word: מִמְכַּר בַּיִת וְעִיר אֲחֻזָּתוֹ
  choice: 他产业所在城中所卖的房屋
  rationale: 希伯来语结构紧缩；结合上下文，指位于利未人产业之城中的已售房屋。此译使汉语关系清楚，同时不扩展法律内容。
- source_word: בַּיֹּבֵל
  choice: 到了禧年
  rationale: “禧年”是本章的专门制度用语；“到了”自然表达产业在该时点归回。
- source_word: בָּתֵּי עָרֵי הַלְוִיִּם
  choice: 利未人各城的房屋
  rationale: 自然呈现原文的属格链，所指是分给利未人的城中房屋。
- source_word: הִוא אֲחֻזָּתָם
  choice: 是他们……所得的产业
  rationale: אֲחֻזָּה 指依法持有、具有世代归属性质的地产。“产业”适合本章土地法规的语域；“所得的”使现代汉语完整，但不额外限定取得方式。
- source_word: בְּתוֹךְ בְּנֵי יִשְׂרָאֵל
  choice: 在以色列子孙中
  rationale: 保留 בְּנֵי יִשְׂרָאֵל 的传统盟约性称谓，并准确表达利未人的产业处于以色列群体之中。
theological_decisions:
- issue: מִן הַלְוִיִּם 的句法关系
  choice: 利未人中有人赎回
  alternative: 若有人从利未人手中赎回
  rationale: מִן 可作部分用法，表示“利未人中的一个”，也可被理解为来源“从利未人那里”。正文采用与上下文中利未人赎回权相符的部分用法，脚注保留真实歧义。
- issue: 禧年时房屋的法律结果
  choice: 归回
  alternative: 出去／解除出售状态
  rationale: וְיָצָא 本义为“出去”，在本章制度中表达产业退出买方占有并恢复原有归属。正文不进一步界定具体承受人，以免超出经文。
- issue: בְּנֵי יִשְׂרָאֵל 的称谓
  choice: 以色列子孙
  alternative: 以色列人／以色列民
  rationale: 采用形式对应的盟约性称谓，同时以脚注说明其群体含义，避免读者误以为仅指男性直系后代。
translation_notes:
  register: 采用现代、庄重而清楚的法律叙述语体。“禧年”“赎回”“产业”与本章术语保持一致；避免照搬希伯来语紧缩句法造成生硬，同时用脚注保存开头介词结构及“出去”的真实语义张力。
