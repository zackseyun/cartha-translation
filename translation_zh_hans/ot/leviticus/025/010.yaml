  text: וְ/קִדַּשְׁתֶּ֗ם אֵ֣ת שְׁנַ֤ת הַ/חֲמִשִּׁים֙ שָׁנָ֔ה וּ/קְרָאתֶ֥ם דְּר֛וֹר בָּ/אָ֖רֶץ לְ/כָל יֹשְׁבֶ֑י/הָ יוֹבֵ֥ל הִוא֙ תִּהְיֶ֣ה לָ/כֶ֔ם וְ/שַׁבְתֶּ֗ם אִ֚ישׁ אֶל אֲחֻזָּת֔/וֹ וְ/אִ֥ישׁ אֶל מִשְׁפַּחְתּ֖/וֹ תָּשֻֽׁבוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/010.yaml
  text: And you shall consecrate the fiftieth year[a], and proclaim liberty in the land to all its inhabitants. It shall be a jubilee for you, and each of you shall return to his property[d][c][b], and each of you shall return to his family.
translation:
  language: zh_hans
  text: 你们要把第五十年分别为圣，并在这地向所有居民宣告自由[a]。这一年要作你们的禧年[b]；你们各人[d]都要归回自己的产业[c]，各人都要归回自己的家族。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “自由”也可译作“释放”。希伯来文指在禧年中正式宣告的自由或释放。
    reason: lexical_alternative
  - marker: b
    text: 这里“禧年”指第五十年的特殊制度，而不是单指角或角声。
    reason: cultural_note
  - marker: c
    text: “产业”也可译作“所拥有的地产”，主要指承袭而来的土地产业。
    reason: lexical_alternative
  - marker: d
    text: “各人”原文直译为“各男人”，在这里是逐一指称群体成员的用法；“家族”也可译作“家庭”或“宗族”。
    reason: source_form_and_lexical_alternative
lexical_decisions:
- source_word: וְקִדַּשְׁתֶּם
  choice: 分别为圣
  rationale: 该词在此表示将第五十年划分出来，使之成为神圣之年；“分别为圣”既保留宗教含义，也符合现代中文圣经语体。
- source_word: וּקְרָאתֶם דְּרוֹר
  choice: 宣告自由
  rationale: דְּרוֹר指正式宣告释放或自由，禧年背景包含人身获释及产业恢复；正文用“自由”保留其宽广含义，并以脚注注明“释放”这一可能译法。
- source_word: בָּאָרֶץ לְכָל יֹשְׁבֶיהָ
  choice: 在这地向所有居民
  rationale: 忠实体现地点介词“在”及间接受词“向”；“这地”由语境所指的土地而来，表达自然清楚。
- source_word: יוֹבֵל
  choice: 禧年
  rationale: 本章中该词是第五十年制度的专称，并非只指宣告时所吹的公羊角；“禧年”是现代中文中清楚而通行的对应词。
- source_word: אִישׁ
  choice: 各人
  rationale: אִישׁ虽为阳性单数形式，在此具有逐一分配的法律用法；“各人”自然表达每一个相关以色列人的含义，不额外限定只有成年男子。
- source_word: אֶל אֲחֻזָּתוֹ
  choice: 归回自己的产业
  rationale: אֲחֻזָּה在土地法规中主要指所持有、尤其承袭而来的地产；“产业”简洁保留财产及继承土地的语义。
- source_word: אֶל מִשְׁפַּחְתּוֹ
  choice: 归回自己的家族
  rationale: מִשְׁפָּחָה可指家庭或宗族单位；在禧年社会结构中，“家族”比现代核心家庭意义的“家庭”更能保留原词范围。
- source_word: וְשַׁבְתֶּם ... תָּשֻׁבוּ
  choice: 归回……归回
  rationale: 重复使用“归回”，对应希伯来文同一词根的重复，并凸显禧年的恢复主题。
theological_decisions:
- issue: 禧年中的דְּרוֹר所指范围
  choice: 正文译为“自由”
  alternative: “释放”
  rationale: 原词表示正式获释，也可延伸为自由状态；正文不把它缩限为单一类别的债务、奴役或土地安排，以保留经文的概括性。
- issue: יוֹבֵל是制度名称还是公羊角
  choice: 译为“禧年”
  alternative: “公羊角”或“角声”
  rationale: 在“这一年要作你们的……”的句法和利未记25章语境中，所指是第五十年的制度；不在正文中采用其可能的词源或相关器物意义。
- issue: 分配用法的אִישׁ
  choice: 译为“各人”
  alternative: “各男人”
  rationale: 此处阳性单数具有逐一指称群体成员的法律功能；“各人”保留分配意义，避免把适用对象不必要地收窄，同时脚注交代原文形式。
- issue: מִשְׁפָּחָה的社会单位范围
  choice: 译为“家族”
  alternative: “家庭”或“宗族”
  rationale: 原词可涵盖比现代核心家庭更广的亲属群体；“家族”保留这一宽度，又不过度规定其具体社会规模。
translation_notes:
  register: 采用庄重、清楚的现代标准普通话。“你们要”表达法律命令而不过分古雅；两次“各人都要归回”有意保存原文的平行与重复。“分别为圣”“禧年”“产业”属于读者可理解且适合律法文本的圣经语汇。
