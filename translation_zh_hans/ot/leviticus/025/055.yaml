  source_fidelity: 原文两次使用עבד（先为“归我”的表述，后为“我的……”）以强调以色列全体专属耶和华；在利未记25章禁止以色列人永久沦为同胞之产业的语境中，现译“仆人”弱化了这种受役及归属的对照。改用“奴仆”能保留古代受役身份与盟约归属的语义，且不将其不当地等同于现代种族化动产奴隶制。其余句法、出埃及公式和神名均忠实于原文。
  naturalness: “属我的仆人”虽可理解，但在现代汉语中不如“我的奴仆”简洁自然；原文的强调可借两次重复“我的奴仆”清楚呈现。全句保持庄重、现代且流畅的经文语体。
  terminology: “以色列人”“埃及地”“耶和华”“你们的上帝”均恰当。“奴仆”在此比“仆人”更能反映עבד的受役和归属含义，同时保有中文经文语域中较稳妥的历史语义。
