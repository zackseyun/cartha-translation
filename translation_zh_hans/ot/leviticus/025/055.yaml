  text: כִּֽי לִ֤/י בְנֵֽי יִשְׂרָאֵל֙ עֲבָדִ֔ים עֲבָדַ֣/י הֵ֔ם אֲשֶׁר הוֹצֵ֥אתִי אוֹתָ֖/ם מֵ/אֶ֣רֶץ מִצְרָ֑יִם אֲנִ֖י יְהוָ֥ה אֱלֹהֵי/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/055.yaml
  text: For the sons of Israel are my servants[a]; they are my servants, whom I brought out of the land of Egypt[b]. I am Yahweh your God.
translation:
  language: zh_hans
  text: 因为以色列人是我的奴仆；他们是我的奴仆，是我从埃及地领出来的。我是耶和华你们的上帝。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接并说明前文禧年条例的理由；现代汉语用“因为”自然地保留解释关系。
- source_word: לִי
  choice: 属我的
  rationale: 介词加代词表达归属；“属我的”比单用“我的”更清楚地凸显本节关于所有权和归属的重点。
- source_word: בְנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 这是希伯来语常用的群体称谓，所指包括整个以色列民；译作“以色列人”在现代汉语中准确自然，避免“以色列的儿子们”被误解为仅指男性或雅各的亲生儿子。
- source_word: עֲבָדִים / עֲבָדַי
  choice: 仆人 / 我的仆人
  rationale: עבד可指奴隶或仆役；本句强调以色列归属于耶和华，并与不得永久受人辖制的上下文形成对照。“仆人”保留服属关系，也符合庄重的盟约语域；重复译出以保留原文强调。
- source_word: אֲשֶׁר הוֹצֵאתִי אוֹתָם
  choice: 是我……领出来的
  rationale: 使役形态表达“使之出来、带出”；“领出来”自然承载出埃及这一固定救赎母题。
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: 从埃及地
  rationale: 准确保留出埃及公式中的地点表达。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的神名音译，明确呈现专名而非以头衔代替。
- source_word: אֱלֹהֵיכֶם
  choice: 你们的上帝
  rationale: 保留第二人称复数及盟约公式；“上帝”是自然、庄重且通行的现代汉语表达。
theological_decisions:
- issue: עבד在盟约归属和限制永久奴役的语境中的译法
  choice: 仆人
  alternative: 奴隶
  rationale: 该词确可表示受奴役者，而上下文也涉及债役和归属；但此处是耶和华对全体以色列的盟约性宣告。“仆人”既保留服属与归属，也避免把人与上帝的关系无条件等同于近现代动产奴隶制。原文词义中的张力由上下文和“属我的”保留。
- issue: בְנֵי יִשְׂרָאֵל这一阳性复数群体称谓
  choice: 以色列人
  alternative: 以色列的众子
  rationale: 该惯用语在这里指全体以色列民，并非仅限男性。现代汉语译作“以色列人”准确传达实际所指，不额外建立性别限定。
- issue: 神名יהוה的呈现
  choice: 耶和华
  alternative: 雅威／主
  rationale: “耶和华”是简体中文读者最熟悉的专名形式，能区分神名与称号；同时不把原文专名隐去为“主”。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。保留“他们是我的仆人”的重复，以呈现希伯来文的强调；用“属我的”显明本节作为前文条例依据的归属逻辑。
