  text: וְ֠/גַם מִ/בְּנֵ֨י הַ/תּוֹשָׁבִ֜ים הַ/גָּרִ֤ים עִמָּ/כֶם֙ מֵ/הֶ֣ם תִּקְנ֔וּ וּ/מִ/מִּשְׁפַּחְתָּ/ם֙ אֲשֶׁ֣ר עִמָּ/כֶ֔ם אֲשֶׁ֥ר הוֹלִ֖ידוּ בְּ/אַרְצְ/כֶ֑ם וְ/הָי֥וּ לָ/כֶ֖ם לַֽ/אֲחֻזָּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/045.yaml
  text: You may also buy from the sons of the sojourners who reside with you[a], and from their families who are with you, whom they have fathered in your land[b]; and they shall become your possession.
translation:
  language: zh_hans
  text: 你们也可以从住在你们中间的寄居者的子孙中购买[a]，也可以从他们的家族中购买那些与你们同住、由他们在你们境内所生的人；这些人要归你们作产业[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “寄居者的子孙”直译“寄居者的儿子们”；这里可泛指他们的后代。
    reason: lexical_alternative
  - marker: b
    text: “产业”在这里是法律用语，表示这些人被当作可以承继的财产。
    reason: legal_context
lexical_decisions:
- source_word: וְגַם
  choice: 你们也可以
  rationale: 承接上一节，补充另一类获准购买的对象；“可以”自然表达本段律法语境中的许可含义。
- source_word: מִבְּנֵי
  choice: 从……的子孙中
  rationale: בְּנֵי 字面为“儿子们”，但在此族群和家系语境中可泛指子孙后代；正文采用现代汉语较自然的“子孙”，脚注保留其字面形式。
- source_word: הַתּוֹשָׁבִים הַגָּרִים עִמָּכֶם
  choice: 住在你们中间的寄居者
  rationale: 两个相关称谓共同指住在以色列人中间、却不属于本地族群的人；“寄居者”保留律法语体，“住在你们中间”表达其居留状态。
- source_word: מֵהֶם תִּקְנוּ
  choice: 从……中购买
  rationale: קנה 可指取得或购买；本段涉及奴隶买卖，商业含义明确，因此不以较含蓄的“取得”弱化原文。
- source_word: וּמִמִּשְׁפַּחְתָּם
  choice: 也可以从他们……的家族中
  rationale: מִשְׁפָּחָה 可指家庭或宗族；“家族”兼顾群体规模及本段的血缘语境。
- source_word: אֲשֶׁר הוֹלִידוּ בְּאַרְצְכֶם
  choice: 他们在你们境内所生的人
  rationale: הוליד 指生育、使出生；译文保留“他们”为主语及出生于当地这一法律相关信息，同时避免在汉语中强行限定为父系措辞。
- source_word: וְהָיוּ לָכֶם לַאֲחֻזָּה
  choice: 他们要归你们为产业
  rationale: אֲחֻזָּה 指产业、占有之物或可承继的产业。本处对象是人，“归你们为产业”既保留原文严峻的所有权语言，也维持律法文本的正式语体。
theological_decisions:
- issue: 奴隶制律例中的购买与所有权语言
  choice: 直译为“购买”和“归你们为产业”
  alternative: 取得、仆人、归你们使用
  rationale: 希伯来文明确描述购买及作为产业占有的法律地位。翻译不以委婉词淡化这种制度现实，也不在正文中加入赞同或谴责性的解释。
- issue: אֲחֻזָּה 在本节中的法律含义
  choice: 产业
  alternative: 财产、所有物、基业
  rationale: “产业”能保留该词常有的持有和承继色彩；脚注说明此处所指并非一般抽象归属，而是可承继的财产地位。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。保留第二人称复数“你们”和直接的买卖、所有权措辞，不用“雇工”或“仆役”等词弱化原文。句式稍作重组，使两个“从……中购买”的来源在汉语中清楚对应，同时保留原文家族关系从句的范围。
