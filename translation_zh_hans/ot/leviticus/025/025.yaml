base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/025.yaml
  text: If your brother becomes poor and sells some of his property[b][a], then his nearest kinsman-redeemer shall come and redeem what his brother has sold.
translation:
  language: zh_hans
  text: 如果你的弟兄陷入贫困，卖了他的一部分祖业[a]，那么与他最近的近亲[b]就可以来，赎回那弟兄所卖的产业。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “祖业”指以色列家族世代承受并持有的土地产业。
    reason: cultural_note
  - marker: b
    text: “最近的近亲”指有资格赎回家族产业的近亲。原文所用的动词形式在这类法律条文中可理解为准许或规定性的行动；也可译作“就要来，赎回”。
    reason: lexical_alternative
lexical_decisions:
- source_word: יָמוּךְ
  choice: 陷入贫困
  rationale: 该动词表示经济状况衰落、变得贫穷；“陷入贫困”自然地表达这一变化。
- source_word: אָחִיךָ
  choice: 你的弟兄
  rationale: 保留希伯来文的亲属称谓；在本法例中，这称谓也可涵盖同属以色列群体的人。
- source_word: מֵאֲחֻזָּתוֹ
  choice: 他的一部分祖业
  rationale: אֲחֻזָּה在本章指以色列家族承受并持有的土地产业，而非泛指任何财物；“祖业”简洁体现其世代承受的性质。
- source_word: גֹאֲלוֹ הַקָּרֹב אֵלָיו
  choice: 他至近的赎业亲属
  rationale: גֹּאֵל指有权利和责任赎回家族产业的近亲；“赎业亲属”既表达亲属身份，也保留גאל的赎回概念，“至近”体现亲属次序。
- source_word: וּבָא וְגָאַל
  choice: 就要来，赎回
  rationale: 连续动词在条件法例中陈述随后适用的法律行动；正文采用规范性的“就要”，脚注保留可理解为许可的可能。
- source_word: אֵת מִמְכַּר אָחִיו
  choice: 他弟兄所卖的
  rationale: מִמְכָּר可指售出之物或买卖事项；此处按上下文自然译为被卖出的产业，同时保留原文重复的“弟兄”称谓。
theological_decisions:
- issue: 以色列律法中的亲属称谓
  choice: 你的弟兄
  alternative: 你的亲属／你的以色列同胞
  rationale: 原文明确使用“弟兄”；尽管法律语境可将其用于盟约群体成员，正文不将这一亲属意象中性化。
- issue: גאל词族的法律与神学内涵
  choice: 赎业亲属／赎回
  alternative: 近亲／买回来
  rationale: “赎回”保留גאל词族在希伯来圣经中的法律和神学呼应；加上“赎业亲属”说明此处是家族土地制度中的具体角色。
- issue: 近亲赎业行动的语气
  choice: 就要来，赎回
  alternative: 可以来赎回
  rationale: 条件法例的连续动词可作为规范性结果来理解，但希伯来文并无独立情态词明确区分义务与许可，因此正文采取较强的法律表述，并在脚注中保留另一理解。
translation_notes:
  register: 采用现代、庄重而易懂的法律叙述。“祖业”和“赎业亲属”略带制度性，但均由脚注解释；句式保留原文的条件—结果结构及重复的亲属语言。
