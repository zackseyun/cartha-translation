  text: וּ/בְ/כֹ֖ל אֶ֣רֶץ אֲחֻזַּתְ/כֶ֑ם גְּאֻלָּ֖ה תִּתְּנ֥וּ לָ/אָֽרֶץ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/024.yaml
  text: And in all the land of your possession[b][a], you shall grant redemption for the land.
translation:
  language: zh_hans
  text: 在你们一切产业地上，都要准许赎回土地。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“都要给予土地赎回权。”
    reason: lexical_alternative
  - marker: b
    text: “产业地”指以色列人按所分得的产业而持有的土地。
    reason: cultural_note
lexical_decisions:
- source_word: וּבְכֹל
  choice: 在……全部……上
  rationale: 承接上下文并把范围扩展到所有产业之地；中文不必硬译句首连接词“并且”，即可自然表达法规的普遍适用。
- source_word: אֶרֶץ
  choice: 土地
  rationale: 本节处于土地买卖与赎回的法律语境，所指是可持有、转让的土地，不是“地球”或泛指“国家”。
- source_word: אֲחֻזַּתְכֶם
  choice: 你们所得为业的
  rationale: 该词指以色列人在分配所得产业中的土地持有权。“所得为业”保留继承产业的背景，同时比单说“财产”更贴合本章语境。
- source_word: גְּאֻלָּה
  choice: 被赎回
  rationale: 此处指已经转让的土地可由原主或其亲属付价取回。采用动词化表达，使现代中文自然，同时保留“赎回”的契约法律含义。
- source_word: תִּתְּנוּ
  choice: 要准许
  rationale: 字面为“你们要给予”。与“赎回”搭配时，意为给予或保障赎回的可能，译作“准许”符合中文法律语感，又不把它过度限定为某种后世制度术语。
- source_word: לָאָרֶץ
  choice: 土地被赎回
  rationale: 希伯来文直译近于“把赎回给予土地”；中文用被动结构表达赎回所涉及的对象，清楚而自然。
theological_decisions:
- issue: 此命令究竟授予法律权利，还是泛指允许赎回
  choice: 正文译为“准许土地被赎回”
  alternative: “要给予土地赎回权”或“要为土地提供赎回”
  rationale: 上下文确有制度性权利的意味，但名词 גְּאֻלָּה 本身也可指赎回行为。正文不把含义完全锁定为抽象的“赎回权”，并在脚注保留这一合法理解。
- issue: “赎回”的神学色彩
  choice: 按土地法规理解为付价取回土地
  alternative: 赋予救赎论意义
  rationale: 本节直接讨论祖业土地的买卖与取回，不应把后来的救赎论内涵强加进正文。
translation_notes:
  register: 采用现代、庄重而易懂的法规语体。“所得为业”保留利未记土地制度的文化背景；“准许……被赎回”避免生硬直译“把赎回给予土地”。脚注标记均已置于正文。
