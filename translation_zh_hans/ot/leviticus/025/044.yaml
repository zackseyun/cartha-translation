base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/044.yaml
  text: As for your male slave and your female slave who may belong to you[a], from the nations that are around you[b], from them you may buy a male slave and a female slave.
translation:
  language: zh_hans
  text: 至于你可以拥有的男奴和女奴[a]，你们可以从周围的各国[b]中购买男奴和女奴。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “男奴和女奴”也可译作“奴隶和婢女”。希伯来文在这里分别使用阳性和阴性称谓；因上下文明说购买和归属，正文采用“奴”，而不采用较含混的“仆人”。
    reason: lexical_alternative
  - marker: b
    text: “各国”指以色列周围的非以色列民族；也可译作“你们周围的各族”。
    reason: lexical_alternative
lexical_decisions:
- source_word: עַבְדְּךָ
  choice: 你的男奴／你可以拥有的男奴
  rationale: עֶבֶד 可指奴隶或仆人；本节明确谈到购买和归属，因此译作“奴”比“仆人”更准确。补出“男”以与后面的阴性名词相区别。
- source_word: אֲמָתְךָ
  choice: 女奴
  rationale: אָמָה 在这里是与男性 עֶבֶד 配对的阴性称谓。“女奴”用现代汉语清楚保留其性别和受奴役身份。
- source_word: אֲשֶׁר יִהְיוּ לָךְ
  choice: 你可以拥有的
  rationale: 该短语直指这些人归于受话者、成为其所有；结合本段法规的许可语气，“可以拥有”既表达归属，也避免把未完成式机械译成绝对将来。
- source_word: מֵאֵת הַגּוֹיִם אֲשֶׁר סְבִיבֹתֵיכֶם
  choice: 从周围的各国中
  rationale: גּוֹיִם 在这里指以色列周边的非以色列民族或国家。“周围的各国”自然简洁，并保留其群体与地域含义。
- source_word: מֵהֶם
  choice: 从……中
  rationale: 该词回指周围各国，表示购买对象的来源。汉语将其与前面的介词短语合并为“从周围的各国中”，避免生硬重复，同时保留原意。
- source_word: תִּקְנוּ
  choice: 你们可以……购买
  rationale: קנה 表示购买或取得；在上下文中，这是许可而非购买命令，因此用“可以购买”。
- source_word: עֶבֶד וְאָמָה
  choice: 男奴和女奴
  rationale: 希伯来文以阳性和阴性单数名词并列，泛指两类人；明确译出二者，可保留法律条文中的性别区分。
theological_decisions:
- issue: 奴隶制度法律条文中的身份用语
  choice: 男奴和女奴
  alternative: 男仆和女仆／奴仆和婢女
  rationale: 本节明确涉及购买及所有关系，受奴役身份是法律含义的核心；采用“奴”不淡化原文，也不在翻译中加入对该制度的辩护或评判。
- issue: תִּקְנוּ 的语气
  choice: 你们可以购买
  alternative: 你们要购买／你们必购买
  rationale: 上下文规定可从哪些人群取得奴隶，并非命令以色列人必须购买；许可式译法更符合该法规的功能。
- issue: 受话者数的转换
  choice: 保留“你”与“你们”的转换
  alternative: 全译为“你们”
  rationale: 原文先用第二人称阳性单数后缀 לָךְ，随后用复数形式 סְבִיבֹתֵיכֶם 和 תִּקְנוּ。正文保留这一转换，以免抹平原文形式。
translation_notes:
  register: 采用现代、庄重而直接的法规体汉语。正文不以委婉称谓淡化奴隶身份；同时保留原文由单数“你”转为复数“你们”的人称数变化。
