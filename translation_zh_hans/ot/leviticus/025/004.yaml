revisions:
- from: 但第七年，土地要守完全安息的安息年[a]，归耶和华为安息。你不可耕种田地，也不可修剪葡萄园。
  to: 但第七年，土地要享有一个安息年，就是完全安息；这是归给耶和华的安息。你不可播种田地，也不可修剪葡萄藤。
  rationale: 修订使“安息”首先是为土地而设的，并以“安息年”结合上下文说明第七年的制度，同时保留 שַׁבַּת שַׁבָּתוֹן 的强调。两个农业禁令分别严格对应“播种”和“修剪葡萄藤”。脚注锚点保留在“安息年”之后。
