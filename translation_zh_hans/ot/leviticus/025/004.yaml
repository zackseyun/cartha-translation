  text: וּ/בַ/שָּׁנָ֣ה הַ/שְּׁבִיעִ֗ת שַׁבַּ֤ת שַׁבָּתוֹן֙ יִהְיֶ֣ה לָ/אָ֔רֶץ שַׁבָּ֖ת לַ/יהוָ֑ה שָֽׂדְ/ךָ֙ לֹ֣א תִזְרָ֔ע וְ/כַרְמְ/ךָ֖ לֹ֥א תִזְמֹֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/004.yaml
  text: But in the seventh year there shall be a sabbath of complete rest for the land[a], a sabbath to Yahweh. You shall not sow your field, and you shall not prune your vineyard.
translation:
  language: zh_hans
  text: 但第七年，土地要享有一个安息年，就是完全安息；这是归给耶和华的安息。你不可播种田地，也不可修剪葡萄藤。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבַשָּׁנָה הַשְּׁבִיעִת
  choice: 但第七年
  rationale: 连接词 וּ 在此承接上一节六年耕作的规定，并引出第七年的对比，用“但”自然体现语篇转折。
- source_word: שַׁבַּת שַׁבָּתוֹן
  choice: 完全安息的安息年
  rationale: 该同源词组加强停止劳作、彻底安息之意；“安息年”符合土地每七年休耕的语境，同时保留“完全安息”的强调。
- source_word: יִהְיֶה לָאָרֶץ
  choice: 土地要守
  rationale: 希伯来文直指这种安息是给土地的；中文以土地为主语，更自然地表达土地进入安息状态。
- source_word: שַׁבָּת לַיהוָה
  choice: 归耶和华为安息
  rationale: 介词 לְ 表明这安息是奉献、归属耶和华的；“归……为”保留其指向和奉献意味。
- source_word: שָׂדְךָ לֹא תִזְרָע
  choice: 你不可耕种田地
  rationale: זרע 本义为播种；此处禁令所指是田地的播种耕作。“耕种田地”是现代中文自然表达，但范围略宽于单纯“播种”。
- source_word: וְכַרְמְךָ לֹא תִזְמֹר
  choice: 也不可修剪葡萄园
  rationale: זמר 在葡萄栽培语境中指修剪枝条；中文说“修剪葡萄园”简洁自然，并与前句禁令平行。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文明确使用四字神名。采用华语圣经传统中广为人知的“耶和华”，既作为专名呈现，也避免以“主”替代而掩盖原文的神名。
- issue: שַׁבַּת לַיהוָה 所表达的关系
  choice: 归耶和华为安息
  alternative: 耶和华的安息
  rationale: 原文介词 לְ 可表达归属、奉献或指向；译作“归耶和华”保留这种关系，而不把它限定为单纯所有格。
translation_notes:
  register: 采用现代、庄重而易懂的法规语体。“不可”体现禁令；“安息年”使土地第七年休耕的含义清楚。脚注保留 שַׁבַּת שַׁבָּתוֹן 的另一种可能侧重。
