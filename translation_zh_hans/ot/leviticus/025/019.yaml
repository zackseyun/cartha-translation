base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/019.yaml
  text: The land will yield its fruit[a], and you will eat your fill and live securely on it.
translation:
  language: zh_hans
  text: 这地必出产果实；你们必吃得饱足，在这地安然居住[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “居住”也可译作“生活”。原文强调在这地安稳而安全地定居。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתְנָה הָאָרֶץ פִּרְיָהּ
  choice: 这地必出产果实
  rationale: 原文直译为“这地必给出它的果实”。“出产果实”既保留土地结果的具体意象，也自然表达农作物的产出。
- source_word: וַאֲכַלְתֶּם לָשֹׂבַע
  choice: 你们必吃得饱足
  rationale: לָשֹׂבַע表示饱足、满足；“吃得饱足”准确传达吃到满足的意思，并保留原文简洁的表述。
- source_word: וִישַׁבְתֶּם לָבֶטַח עָלֶיהָ
  choice: 在这地安然居住
  rationale: ישׁב在此指居住、定居，בֶּטַח表示安全、安稳；“安然居住”自然传达在土地上稳定而安全地生活。为避免中文代词指向含混，将“在其上”自然化为“在这地”。
