base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/035.yaml
  text: If your brother becomes poor and his hand falters beside you[a], then you shall support him[b]; so that he may live beside you as a resident foreigner or a temporary resident.
translation:
  language: zh_hans
  text: 如果你的弟兄变得贫穷，在你身边无力维持生计[a]，你就要扶持他，让他像寄居者和暂住者一样，与你同住[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译近于“他的手在你身边衰弱（或动摇）”，是指他失去经济能力，不能维持自己的生活。
    reason: lexical_alternative
  - marker: b
    text: “寄居者和暂住者”在希伯来文中的句法较为紧缩；也可理解为这两个身份称谓直接连于“扶持他”，即“你要扶持他——寄居者和暂住者”。
    reason: alternative_reading
lexical_decisions:
- source_word: וְכִי
  choice: 如果
  rationale: 引入条件式律例；现代汉语用“如果”自然清楚，无须另译前缀连词。
- source_word: יָמוּךְ
  choice: 变得贫穷
  rationale: 该动词表示境况降低；本节涉及经济困顿，译为“变得贫穷”准确易懂。
- source_word: אָחִיךָ
  choice: 你的弟兄
  rationale: 保留原文的男性亲属称谓及其群体内部的亲缘表达，不直接释为“以色列同胞”。
- source_word: וּמָטָה יָדוֹ עִמָּךְ
  choice: 在你身边无力维持生计
  rationale: 原文直译近于“他的手在你身边衰弱/动摇”，是指经济能力衰退、无法自立的习语；正文传达其含义，同时以脚注保留原有意象。
- source_word: וְהֶחֱזַקְתָּ בּוֹ
  choice: 你就要扶持他
  rationale: חזק的使役形在此表示抓住、支撑有需要的人；“扶持”兼具具体意象和经济社会层面的帮助。
- source_word: גֵּר
  choice: 寄居者
  rationale: 指住在以色列群体中的外来居民；“寄居者”简洁，并保留其法律社会身份色彩。
- source_word: וְתוֹשָׁב
  choice: 暂住者
  rationale: 表示居留地位较弱或较临时的人；“暂住者”可与“寄居者”有所区别。
- source_word: גֵּר וְתוֹשָׁב
  choice: 像寄居者或暂住者一样
  rationale: 原文结构紧缩且有歧义；正文将其理解为说明贫穷弟兄受扶持后的居留身份，并用“或”避免断定二词必为单一复合称谓。另一种句法理解列入脚注。
- source_word: וָחַי
  choice: 让他……生活
  rationale: 在命令之后可表达扶持所要达到的目的或结果；“让他……生活”符合自然汉语，也不把语气强化为绝对预告。
- source_word: עִמָּךְ
  choice: 在你身边
  rationale: 保留重复介词的关系和空间意味，强调困乏者继续留在共同体中。
theological_decisions:
- issue: “你的弟兄”的范围
  choice: 正文保留“你的弟兄”，按上下文指圣约群体中的同胞。
  alternative: 译作“你的以色列同胞”或“你的族人”。
  rationale: 原文以亲属语言表达群体责任；保留该称谓可避免将解释直接写进正文。
- issue: “寄居者和暂住者”的句法功能
  choice: 理解为描述贫穷弟兄如何在群体中生活：“像寄居者或暂住者一样”。
  alternative: 理解为额外的受助对象：“你要扶持他，也要扶持寄居者和暂住者”；或视作复合称谓“寄居的暂住者”。
  rationale: 希伯来文表达紧缩，存在真实歧义。正文采用与后句连读的自然理解，脚注保留另一主要读法，不以译文消除张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“弟兄”保留原文亲属称谓；“无力维持生计”解释古代身体意象，并由脚注补足字面表达。正文中的[a]、[b]均与脚注对应。
