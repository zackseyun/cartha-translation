  text: וְ/אִ֗ישׁ כִּֽי יִמְכֹּ֤ר בֵּית מוֹשַׁב֙ עִ֣יר חוֹמָ֔ה וְ/הָיְתָה֙ גְּאֻלָּת֔/וֹ עַד תֹּ֖ם שְׁנַ֣ת מִמְכָּר֑/וֹ יָמִ֖ים תִּהְיֶ֥ה גְאֻלָּתֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/029.yaml
  text: If a man sells a house for dwelling in a walled city[a], its redemption may be made until the completion of a full year from its sale; its right of redemption shall last for days, that is, a full year.
translation:
  language: zh_hans
  text: 如果有人卖掉有城墙的城中的一所住宅，在房屋售出满一年以前，他可以将这房屋赎回；他的赎回权为期一整年[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “一整年”希伯来文直译为“日子”；在这里的法律用语中，指一整年的期限。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ כִּי
  choice: 如果有人
  rationale: 这是律例中引出具体情形的条件句；“有人”在现代汉语中自然，也保留单数代表性的用法，无须机械译出连接词 וְ。
- source_word: בֵּית מוֹשַׁב עִיר חוֹמָה
  choice: 城墙以内的一所住宅
  rationale: בֵּית מוֹשַׁב 指供居住的房屋，译作“住宅”；עִיר חוֹמָה 指有城墙的城。结合本章土地与房产法规，“城墙以内”自然表达房屋位于有城墙的城中。
- source_word: וְהָיְתָה גְּאֻלָּתוֹ
  choice: 可以将它赎回
  rationale: גְּאֻלָּה 在此指售出房产后依法赎回的可能或权利；用动词表达，比抽象的“它的赎回”更符合现代汉语。
- source_word: עַד תֹּם שְׁנַת מִמְכָּרוֹ
  choice: 在房屋售出满一年以前
  rationale: 原文指自售出之日起一年期满，而不是售出所在日历年的年末；“满一年以前”准确传达这一期限。
- source_word: יָמִים תִּהְיֶה גְאֻלָּתוֹ
  choice: 他有一整年的赎回权
  rationale: יָמִים 在这一法律习语中表示完整的一年；גְּאֻלָּה 此处明确表现为卖方享有的赎回权。正文采用自然、明确的汉语，脚注交代字面措辞。
theological_decisions: []
