  text: וְ/אִ֕ישׁ כִּ֛י לֹ֥א יִֽהְיֶה לּ֖/וֹ גֹּאֵ֑ל וְ/הִשִּׂ֣יגָה יָד֔/וֹ וּ/מָצָ֖א כְּ/דֵ֥י גְאֻלָּתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/026.yaml
  text: But if a man has no redeemer[a], and his hand attains enough and he finds sufficient means for his redemption[b],
translation:
  language: zh_hans
  text: 但如果那人没有近亲赎回者，而他自己财力充足，找到了足以赎回产业的款项，
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/אִישׁ כִּי
  choice: 如果那人
  rationale: 该结构引入一个法律条件。结合上节已经提到卖掉产业的人，用“那人”自然承接上下文，同时保留单数指称。
- source_word: לֹא יִהְיֶה לּוֹ גֹּאֵל
  choice: 没有赎业的近亲
  rationale: גֹּאֵל 在本章土地法规中指有权利或责任赎回家族产业的近亲。“赎业的近亲”比单说“救赎者”更准确地表达此处的亲属和财产法律含义。
- source_word: וְהִשִּׂיגָה יָדוֹ
  choice: 后来自己有了足够的财力
  rationale: 原文直译为“他的手达到了”，是表示经济能力变得充足的习语。译文传达其实际含义，并以“后来”体现连续叙事中的处境变化。
- source_word: וּמָצָא כְּדֵי
  choice: 可以
  rationale: 原文意为“找到足够的”，在本句中是获得足够款项、具备能力之意；与前面的“有了足够的财力”合译，可避免汉语重复。
- source_word: גְאֻלָּתוֹ
  choice: 赎回自己的产业
  rationale: 名词表示赎回或赎回权；本章明确涉及先前卖出的土地产业，因此将隐含宾语表达出来，使现代读者准确理解法律语境。
theological_decisions:
- issue: גֹּאֵל 的身份和作用
  choice: 赎业的近亲
  alternative: 赎回者／救赎者
  rationale: 此处不是泛指属灵拯救，而是家族土地法中的近亲赎业者；译法限定于上下文，不引入后来的神学含义。
- issue: גְאֻלָּתוֹ 的代词所指
  choice: 赎回自己的产业
  alternative: 完成他的赎回／赎回它
  rationale: 希伯来语形式可直译为“他的赎回”，但上下文所赎的是那人卖出的产业。译文明确对象，同时脚注保留原文名词结构。
translation_notes:
  register: 采用现代、庄重而易懂的法律叙述。“产业”承接利未记25章的土地语境；句末保留逗号，以延续至下一节的法律规定。
