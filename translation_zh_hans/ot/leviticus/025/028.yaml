  text: וְ/אִ֨ם לֹֽא מָֽצְאָ֜ה יָד֗/וֹ דֵּי֮ הָשִׁ֣יב ל/וֹ֒ וְ/הָיָ֣ה מִמְכָּר֗/וֹ בְּ/יַד֙ הַ/קֹּנֶ֣ה אֹת֔/וֹ עַ֖ד שְׁנַ֣ת הַ/יּוֹבֵ֑ל וְ/יָצָא֙ בַּ/יֹּבֵ֔ל וְ/שָׁ֖ב לַ/אֲחֻזָּתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/028.yaml
  text: But if his hand does not find enough to restore it to him[a], then what he sold shall remain in the hand of the one who bought it until the year of Jubilee; and it shall go out in the Jubilee, and he shall return to his property.
translation:
  language: zh_hans
  text: 但他若没有足够的财力将产业赎回，他所卖的产业就要留在买主手中，直到禧年；到了禧年，那产业要脱离买主的手，他也要归回自己的产业。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“那产业要归回他的产业。”希伯来语末句的主语既可理解为原产业主人，也可理解为所卖的产业。
    reason: 保留末句动词主语的真实语法歧义。
lexical_decisions:
- source_word: מָצְאָה יָדוֹ דֵּי
  choice: 无力筹得足够的钱
  rationale: “手找到足够”是表示财力或手段足够的希伯来语习语。译为“无力筹得足够的钱”，既自然表达经济能力不足，也切合赎回土地所需款项的法律语境。
- source_word: הָשִׁיב לוֹ
  choice: 偿还买主
  rationale: 这里指为赎回产业而向买主付还相应款项；补明“买主”可消除汉语代词指向不清，同时不把动作误解为仅仅交还土地。
- source_word: מִמְכָּרוֹ
  choice: 他所卖的产业
  rationale: 该名词既可指买卖行为，也可指所卖之物。下文说它留在买主手中并于禧年脱离其手，表明这里所指的是卖出的产业。
- source_word: בְּיַד הַקֹּנֶה אֹתוֹ
  choice: 留在买主手中
  rationale: 保留“手中”这一表示占有和支配的希伯来语法律意象，同时用“买主”简洁表达分词“购买者”。
- source_word: שְׁנַת הַיּוֹבֵל
  choice: 禧年
  rationale: 这是利未记土地制度中的固定术语；“禧年”是现代中文圣经语境中清楚而庄重的通行译法。
- source_word: וְיָצָא בַּיּוֹבֵל
  choice: 到了禧年，那产业要脱离买主的手
  rationale: יצא 的基本义是“出去”。结合前句“在买主手中”，译为“脱离买主的手”既保留空间性意象，也清楚表达产业不再归买主占有。
- source_word: וְשָׁב לַאֲחֻזָּתוֹ
  choice: 他也要归回自己的产业
  rationale: 将原主视为动词主语，符合禧年中人归回世袭产业的语境。אֲחֻזָּה 指持有的、通常具有世袭性质的土地产业，译作“产业”较为准确自然。
theological_decisions:
- issue: 末句 וְשָׁב 的主语
  choice: 以原产业主人为主语：“他也要归回自己的产业”
  alternative: 以所卖的产业为主语：“那产业也要归回他的所有”
  rationale: 希伯来语动词为阳性单数，既可回指原主，也可能回指语法上为阳性的“所卖之物”。上下文较自然地描写原主在禧年归回世袭产业，但语法上的另一种理解确实存在，因此正文采用较可能的读法，并以脚注保留歧义。
translation_notes:
  register: 采用现代、庄重而易懂的法律叙述语体。“筹得足够的钱”明示此处所涉及的赎回款项；“留在买主手中／脱离买主的手”保留原文关于占有权的“手”之意象。脚注标记已置于正文相应位置。
