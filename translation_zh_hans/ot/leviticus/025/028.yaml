revisions:
- from: 但他若无力筹得足够的钱偿还买主，他所卖的产业就要留在买主手中，直到禧年；到了禧年，那产业要脱离买主的手，他也要归回自己的产业。[a]
  to: 但他若没有足够的财力将产业赎回，他所卖的产业就要留在买主手中，直到禧年；到了禧年，那产业要脱离买主的手，他也要归回自己的产业。[a]
  rationale: 修订首句，以“赎回产业”表达原文在本段土地赎回法律语境中的意思，避免将“归还给他”误译为单纯向买主偿债。修订脚注措辞，使替代译法符合现代汉语，同时明确其依据是末句主语的语法歧义。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T04:51:12Z'
review_pass:
  verdict: revise
  source_fidelity: 首句“偿还买主”将 הָשִׁיב לוֹ 的受事和方向过度限定为向买主付款；原文在此更直接表达原主须有足够财力使所卖产业归还给自己，即赎回产业。其余法律关系、禧年时产业脱离买主占有、以及原主归回其产业，均得到准确表达。
  naturalness: 译文总体庄重通顺，适合现代中文法律叙述。“无力筹得足够的钱偿还买主”虽自然，但容易造成偿债而非赎回产业的理解；改为“没有足够的财力将产业赎回”更简洁明确。
  terminology: “禧年”“买主”“产业”均为恰当且一致的术语。“归回自己的产业”保留原文较可能以原主为主语的读法；脚注应以更自然的中文说明另一种以产业为主语的可能。
  issues:
  - severity: medium
    issue: “偿还买主”过度解释 הָשִׁיב לוֹ
    rationale: 原文并未明确说“偿还买主”；在土地赎回的语境中，短语所指是有足够的资源使所卖产业归还给原主。译为“将产业赎回”既符合语境，也不错误指定“向谁偿还”。
  - severity: low
    issue: 脚注中的“归回他的所有”不够自然
    rationale: “所有”在现代汉语中通常不作“所有物/产业”的名词中心语。用“归回他的产业”或“归还给他”更自然，并仍能保留末句主语的语法歧义。
