  to: 他和随同他的儿子要离开你；他要回到自己的宗族[a]，归回他父辈的产业[b]。
  rationale: 修订以分号及重复“他要”明确原文后半句的单数主语，同时保留两次“回”类动词所形成的复归强调。“随同他的儿子”自然表达“他的儿子与他一起”。脚注 b 改用现代汉语中自然且能涵盖世袭地产含义的表述。
