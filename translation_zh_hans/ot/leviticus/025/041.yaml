base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/041.yaml
  text: Then he and his sons with him shall go out from you[b][a], and he shall return to his clan and return to the property of his fathers.
translation:
  language: zh_hans
  text: 他和随同他的儿子要离开你；他要回到自己的宗族[a]，归回他父辈的产业[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“家族”；这里的希伯来词可指较广的亲属群体或宗族。
    reason: lexical_alternative
  - marker: b
    text: 或译“他父辈所持有的产业”或“他的祖传产业”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָצָא
  choice: 要……离开
  rationale: 此处在法律条文中表达将要发生的结果。“离开”保留“出去”的具体动作，同时不把上下文所暗含的获释之意直接写入正文。
- source_word: מֵעִמָּךְ
  choice: 离开你
  rationale: 原文直译近似“从与你同在之处出去”；现代汉语用“离开你”自然表达离开债主或主人的家及服役关系，又避免增译为“脱离你的服役”。
- source_word: הוּא וּבָנָיו עִמּוֹ
  choice: 他和他的儿子们要一同
  rationale: 保留原文明示的阳性复数“儿子们”；“一同”自然传达“与他一起”，不把它泛化为“孩子们”。
- source_word: וְשָׁב ... יָשׁוּב
  choice: 回到……归回
  rationale: 用两个近义而同根感鲜明的动词保留原文两次 שׁוב 的重复和复归强调，同时使现代汉语行文自然。
- source_word: מִשְׁפַּחְתּוֹ
  choice: 他的宗族
  rationale: 在土地与亲属制度的语境中，该词通常指比核心家庭更广的亲属群体；“宗族”比“家庭”更准确。
- source_word: אֲחֻזַּת אֲבֹתָיו
  choice: 他父辈的产业
  rationale: אֲחֻזָּה 指持有的土地或世袭产业；“父辈的产业”既保留父系承继措辞，也表达祖传地产和财产的法律含义。
theological_decisions:
- issue: 男性亲属称谓的处理
  choice: 他的儿子们……他父辈的产业
  alternative: 他的孩子们……他祖先的产业
  rationale: 希伯来文在两处都明确使用阳性称谓，而本节的法律背景涉及父系家族与产业承继，因此正文不将其性别中和。
- issue: 离开所具有的社会法律含义
  choice: 离开你
  alternative: 从为你服役中获释
  rationale: 上下文确实涉及禧年时债役关系的终止，但原文本节使用具体的“出去、离开”，并未采用明确表示“释放”的专门措辞；正文保留这种表达，让法律含义由上下文呈现。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“回到……归回……”保留原文的重复修辞；“宗族”和“产业”体现本节的亲属、土地及承继语境。脚注标记分别紧随所解释的词语。
