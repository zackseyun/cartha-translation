base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/022.yaml
  text: And you shall sow in the eighth year and eat from the old produce until the ninth year; until its produce comes in[a], you shall eat the old.
translation:
  language: zh_hans
  text: 第八年，你们要播种，也要吃往年的收成[a]，直到第九年；直到第九年的收成下来以前，你们仍要吃往年的收成。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文两处都用“旧的”一词：第一处与“收成”相连，第二处所指的“收成”则由上下文补出。
    reason: 说明原文“旧的”的重复，并准确交代第一处明载“收成”、第二处省略名词的差别。
lexical_decisions:
- source_word: וּזְרַעְתֶּם
  choice: 你们要播种
  rationale: 该动词在这段律法指示中带有面向将来的指令意味；“要播种”既自然，也保留其规范性。
- source_word: מִן הַתְּבוּאָה יָשָׁן
  choice: 吃往年的收成
  rationale: תְּבוּאָה指土地的出产或收成，יָשָׁן意为“旧的”；“往年的收成”在现代汉语中自然地表达尚在食用的旧收成，又不把范围收窄为某一种谷物。
- source_word: עַד הַשָּׁנָה הַתְּשִׁיעִת
  choice: 直到第九年
  rationale: 直接保留原文的时间界限。
- source_word: עַד בּוֹא תְּבוּאָתָהּ
  choice: 那一年的收成进来以前
  rationale: 阴性单数后缀最自然地回指刚提到的“第九年”；“收成进来”贴近בּוֹא“来到、进入”的表达，并表示新收成可供使用。
- source_word: תֹּאכְלוּ יָשָׁן
  choice: 你们都要吃往年的收成
  rationale: 重复“往年的收成”，保留原文对יָשָׁן的重复，强调在新收成到来之前仍以旧收成为食。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“往年的收成”比“陈粮”涵盖面更广，也更贴近תְּבוּאָה；句式保留原文两段时间界限及末尾的重复强调。
