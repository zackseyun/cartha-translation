  text: כְּ/שָׂכִ֥יר כְּ/תוֹשָׁ֖ב יִהְיֶ֣ה עִמָּ֑/ךְ עַד שְׁנַ֥ת הַ/יֹּבֵ֖ל יַעֲבֹ֥ד עִמָּֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/040.yaml
  text: He shall be with you like a hired worker[a], like a sojourner; he shall serve with you until the year of jubilee.
translation:
  language: zh_hans
  text: 他在你那里要像雇工和寄居者[a]一样；他要在你那里做工，直到禧年。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “寄居者”或译“外来居民”，指居住在当地但非本族的人。
    reason: 说明תּוֹשָׁב所表示的社会法律身份及其可行译法。
lexical_decisions:
- source_word: כְּשָׂכִיר
  choice: 像雇工一样
  rationale: שָׂכִיר指受雇取酬的劳动者。“雇工”简明自然，也符合上下文将此人与奴隶区别开来的法律地位。
- source_word: כְּתוֹשָׁב
  choice: 像寄居者一样
  rationale: תּוֹשָׁב指居住在当地、却不属于本族的外来居民。“寄居者”保留其社会法律身份，并以脚注说明现代汉语中的另一种表达。
- source_word: יִהְיֶה עִמָּךְ
  choice: 他在你那里要……一样
  rationale: 直译为“他要与你同在”在现代汉语中容易产生别的联想；“在你那里”自然表达他在对方家中所处的身份，同时保留עִמָּךְ的关系含义。
- source_word: עַד שְׁנַת הַיֹּבֵל
  choice: 直到禧年
  rationale: “禧年”是《利未记》第二十五章中该释放年度的通行中文专称，准确而简洁。
- source_word: יַעֲבֹד עִמָּךְ
  choice: 他要在你那里做工
  rationale: עבד在此可指服事或劳动。鉴于上下文禁止把此人当奴隶辖制，“做工”更自然地体现受保护的劳动关系；“在你那里”也保留重复出现的עִמָּךְ，而不强化原文未明说的支配意味。
theological_decisions:
- issue: 因贫困而服役的以色列人的身份
  choice: 以“雇工和寄居者”的身份描述，并用“做工”表达其劳动
  alternative: 译作“雇仆……服事你”
  rationale: 上下文明确区分此人与奴隶，并规定其服役是暂时的，直到禧年为止。译文既不应淡化实际的服役关系，也不应加入财产式奴役的含义。
translation_notes:
  register: 采用现代、庄重而易懂的法律叙述语体。“在你那里”两次对应עִמָּךְ，既避免生硬的“与你同在”，也避免将第二处过度解释为“为你”。
