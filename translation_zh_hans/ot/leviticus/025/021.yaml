  text: וְ/צִוִּ֤יתִי אֶת בִּרְכָתִ/י֙ לָ/כֶ֔ם בַּ/שָּׁנָ֖ה הַ/שִּׁשִּׁ֑ית וְ/עָשָׂת֙ אֶת הַ/תְּבוּאָ֔ה לִ/שְׁלֹ֖שׁ הַ/שָּׁנִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/021.yaml
  text: Then I will command my blessing for you in the sixth year[a], and it will produce the yield for three years.
translation:
  language: zh_hans
  text: 我必在第六年命定我的赐福临到你们；这赐福必带来足够三年之用的收成[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “收成”也可译作“出产”或“农产”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְצִוִּיתִי
  choice: 我必命令
  rationale: 保留צוה“发令、命令”的力度；结合上下文，此处是在回应上一节预设的疑问，中文不必另加“那么”。
- source_word: בִּרְכָתִי
  choice: 我的福
  rationale: 直译其所属关系，并保留神所赐福分的宽广含义；后半句说明这福在农业上的具体效果。
- source_word: לָכֶם
  choice: 临到你们
  rationale: ל表示受益者；与“命令我的福”搭配时，“临到你们”比生硬的“给你们”更自然。
- source_word: בַּשָּׁנָה הַשִּׁשִּׁית
  choice: 在第六年
  rationale: 直接保留安息年周期中的时间定位。
- source_word: וְעָשָׂת
  choice: 这福必带来
  rationale: 阴性单数动词可自然承接阴性名词“我的福”；中文明确重复“这福”，既避免指代含混，也表达其产生收成的作用。
- source_word: הַתְּבוּאָה
  choice: 收成
  rationale: תבואה在此指农业产出；“收成”是现代中文中清楚自然的表达。
- source_word: לִשְׁלֹשׁ הַשָּׁנִים
  choice: 足够三年之用
  rationale: 原文直译为“为三年”，语境所指是收成可供三年；补出“足够……之用”能用自然中文准确表达其功能。
theological_decisions:
- issue: 所应许之福的性质
  choice: 神直接命令他的福临到百姓，使第六年的农业收成格外丰盛
  alternative: 仅泛指通常的天意照管或自然丰收
  rationale: 第一人称“我必命令”与“我的福”共同表明，这是神明确施行的特殊供应，而不是对一般农业规律的陈述。
- issue: וְעָשָׂת的主语
  choice: 理解为“我的福”，译作“这福必带来”
  alternative: 理解为第六年或土地，并译作“那一年／土地必出产”
  rationale: 动词为阴性单数，最近且语法相合的先行词是阴性的“我的福”；不过其实际结果仍是土地在第六年产生收成。
translation_notes:
  register: 采用庄重而易懂的现代标准普通话。“命令我的福临到你们”保留原文神圣命令的力度；后句用“足够三年之用”明示原文在上下文中的供应含义。
