  to: 我必在第六年命定我的赐福临到你们；这赐福必带来足够三年之用的收成[a]。
  rationale: 修改仅处理现代汉语搭配和脚注的词义范围：“命定我的赐福临到”保留原文“我必命令我的福”的权柄与施行性；“这赐福”清楚承接阴性单数动词所指的赐福。保留“足够三年之用”，这是该短语在紧邻上下文中的自然中文表达，并未改变供应三年的含义。
