base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/016.yaml
  text: In proportion to the greater number of years you shall increase its purchase price[a], and in proportion to the fewer number of years you shall reduce its purchase price, because he is selling to you a number of harvests.
translation:
  language: zh_hans
  text: 年数越多，就要相应提高买价；年数越少，就要相应降低买价，因为他卖给你的是若干次收成。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “收成”或译“农作物”“出产”。希伯来语 תְּבוּאוֹת 可指收获的农作物、土地的出产或各次收成。
    reason: lexical_alternative
lexical_decisions:
- source_word: לְפִי
  choice: 相应
  rationale: 该短语表示数量上的对应或比例关系；“相应”以自然、简洁的现代汉语表达价格随年数调整。
- source_word: רֹב הַשָּׁנִים / מְעֹט הַשָּׁנִים
  choice: 年数多／年数少
  rationale: 两组短语彼此对称，指禧年前所余年数的多寡；此译保留法律条文的对照结构。
- source_word: תַּרְבֶּה / תַּמְעִיט
  choice: 提高／降低
  rationale: 两个使役动词分别表示使之增多和使之减少；与“买价”搭配时，“提高／降低”清楚自然。
- source_word: מִקְנָתוֹ
  choice: 买价
  rationale: מִקְנָה可指购得之物、购买行为或购价；上下文按年数和收成计算交易价值，因此译作“买价”最贴切，同时避免在汉语中强行表达含义不够明确的阳性单数后缀。
- source_word: מִסְפַּר תְּבוּאֹת
  choice: 相应次数的收成
  rationale: 该词组直指一定数目的出产或收成；“相应次数”承接前文年数多寡，也说明实际交易的是土地在这些年间带来的收成。
- source_word: הוּא מֹכֵר לָךְ
  choice: 他卖给你的是
  rationale: 保留原文阳性单数主语，并以汉语判断式结构突出所售之物的性质。
