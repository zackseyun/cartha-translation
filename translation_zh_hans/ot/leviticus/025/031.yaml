  text: וּ/בָתֵּ֣י הַ/חֲצֵרִ֗ים אֲשֶׁ֨ר אֵין לָ/הֶ֤ם חֹמָה֙ סָבִ֔יב עַל שְׂדֵ֥ה הָ/אָ֖רֶץ יֵחָשֵׁ֑ב גְּאֻלָּה֙ תִּהְיֶה לּ֔/וֹ וּ/בַ/יֹּבֵ֖ל יֵצֵֽא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/031.yaml
  text: But the houses of the villages that have no wall around them shall be regarded as the fields of the land[a]; redemption shall be available for them[b], and in the Jubilee they shall go out.
translation:
  language: zh_hans
  text: 但四周没有城墙的村落的房屋，要算作乡间的田地[a]；这类房屋可以赎回，在禧年要归回[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译为“要算作那地的田地”，意思是这些村落的房屋在律法上按乡间田地处理，而不按有城墙之城内的房屋处理。
    reason: lexical_alternative
  - marker: b
    text: 直译为“在禧年，它要出去”。按本章产业法规，这指产业脱离买主而归回原主。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָתֵּי הַחֲצֵרִים
  choice: 村落房屋
  rationale: חֲצֵרִים在此指乡间的村落或聚居地；其没有城墙的特征由下一个关系从句明说，因此不重复加入名词本身。
- source_word: אֲשֶׁר אֵין לָהֶם חֹמָה סָבִיב
  choice: 四周没有城墙的
  rationale: 直接表达这些村落没有环绕的墙垣，并以现代汉语自然呈现סָבִיב“周围、四周”。
- source_word: עַל שְׂדֵה הָאָרֶץ יֵחָשֵׁב
  choice: 要算作乡野的田地
  rationale: 保留“算作”的法律归类含义，也较贴近שְׂדֵה הָאָרֶץ的字面表达；“乡野”凸显其与有城墙之城内房屋的对比。
- source_word: גְּאֻלָּה תִּהְיֶה לּוֹ
  choice: 这类房屋可以赎回
  rationale: 希伯来语以单数代词指作为一类财产看待的房屋；汉语用“这类房屋”既承接复数房屋，也表达其仍可赎回的法律状态。
- source_word: וּבַיֹּבֵל יֵצֵא
  choice: 到了禧年也要归还原主
  rationale: יֵצֵא字面为“要出去”，在本章产业法规中指产业在禧年脱离买主而复归；正文采用自然清楚的法律语义，脚注保留字面说法。
