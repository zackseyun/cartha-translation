  text: אִם ע֥וֹד רַבּ֖וֹת בַּ/שָּׁנִ֑ים לְ/פִי/הֶן֙ יָשִׁ֣יב גְּאֻלָּת֔/וֹ מִ/כֶּ֖סֶף מִקְנָתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/051.yaml
  text: If many years still remain[a], in proportion to them he shall repay his redemption price from the money of his purchase.
translation:
  language: zh_hans
  text: 如果剩下的年数还多，他就要按这些年数，从买他的价银中偿还自己的赎价。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“偿还自己的赎金。”原文名词可指赎回这件事，但在这里更可能指为赎回而偿还的金额。
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: 如果
  rationale: 标准条件连词，引出本条例中的一种情形。
- source_word: עוֹד רַבּוֹת בַּשָּׁנִים
  choice: 剩下的年数还多
  rationale: 原文直陈“年数尚多”；结合上下文，所指是距离禧年尚余的年数。此译法补出汉语所需的“剩下”，但不增加原文之外的具体说明。
- source_word: לְפִיהֶן
  choice: 按这些年数
  rationale: 字面为“照着它们的口”，是表示依照或按比例计算的习语；“这些年数”清楚回指前句。
- source_word: יָשִׁיב
  choice: 偿还
  rationale: שׁוב 的使役式在此法律与金钱语境中表示交还、付还；“偿还”自然体现款项返还之意。
- source_word: גְּאֻלָּתוֹ
  choice: 自己的赎价
  rationale: גְּאֻלָּה 可指赎回行为，也可在本处具体指为获得赎回而支付的金额；正文采用符合计价语境的“赎价”，并以脚注保留词义张力。
- source_word: מִכֶּסֶף מִקְנָתוֹ
  choice: 从买他的价银中
  rationale: 原文为“从他被购买的钱银中”；此译法明确这是当初买他的价款，同时保留“从……中”所表达的比例核算关系。
