  text: אֲנִ֗י יְהוָה֙ אֱלֹ֣הֵי/כֶ֔ם אֲשֶׁר הוֹצֵ֥אתִי אֶתְ/כֶ֖ם מֵ/אֶ֣רֶץ מִצְרָ֑יִם לָ/תֵ֤ת לָ/כֶם֙ אֶת אֶ֣רֶץ כְּנַ֔עַן לִ/הְי֥וֹת לָ/כֶ֖ם לֵ/אלֹהִֽים־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/038.yaml
  text: I am Yahweh your God[a], who brought you out of the land of Egypt to give you the land of Canaan, to be your God.
translation:
  language: zh_hans
  text: “我是雅威[a]，你们的上帝；我把你们从埃及地领出来，为要把迦南地赐给你们，并作你们的上帝。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文为 YHWH（יהוה），其古代确切读音不能完全确定，通常音译作“雅威”；汉语传统也译作“耶和华”，有些译本以“主”代称。
    reason: 说明神名的原文形式、拟音的不确定性及主要传统译法。
lexical_decisions:
- source_word: יְהוָה
  choice: 雅威
  rationale: 以音译呈现四字神名 YHWH，保留其作为以色列之上帝专名的功能；“雅威”是现代汉语中按学界通常拟音所作的通行音译。
- source_word: אֱלֹהֵיכֶם
  choice: 你们的上帝
  rationale: אֱלֹהִים 虽具有复数形式，但此处指独一的以色列之上帝，并带第二人称复数所属后缀，故译为“你们的上帝”。
- source_word: הוֹצֵאתִי אֶתְכֶם
  choice: 我把你们……领出来
  rationale: יצא 的使役式在出埃及语境中表示“带出、领出”；“领出来”既自然，也保留上帝主动施行拯救的含义。
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: 从埃及地
  rationale: 保留原文 אֶרֶץ（地、国土），译作“埃及地”，符合现代汉语圣经叙事的庄重语体。
- source_word: לָתֵת לָכֶם אֶת אֶרֶץ כְּנַעַן
  choice: 为要把迦南地赐给你们
  rationale: 不定式 לָתֵת 表达目的；“为要”明确其与领出埃及之间的目的关系，“赐给”体现给予土地的恩赐和应许语境。
- source_word: לִהְיוֹת לָכֶם לֵאלֹהִים
  choice: 并作你们的上帝
  rationale: 这是盟约关系的固定表达。“作你们的上帝”自然传达关系性的归属与委身，不误解为上帝本体发生改变。
- source_word: אֲנִי
  choice: 我是
  rationale: 希伯来文名词句以独立代词强调说话者身份；现代汉语补出系词“是”，形成自然而庄重的自我宣告。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 正文采用对 YHWH 通常拟音的直接音译，以保留神名而不以称号取代；脚注同时说明其读音并非由辅音拼写完全确定，并列出汉语传统译法。
- issue: 盟约公式 לִהְיוֹת לָכֶם לֵאלֹהִים 的理解
  choice: 作你们的上帝
  alternative: 成为你们的上帝；对你们作上帝
  rationale: 原文强调上帝与百姓的盟约关系，而非暗示上帝的本质或身份发生变化；“作你们的上帝”保留这一关系含义，也避免加入额外神学解释。
- issue: 两个不定式短语的关系
  choice: 为要……并……
  alternative: 要……，要……；使……并使……
  rationale: לָתֵת 与 לִהְיוֹת 均承接“领出来”，可共同表达出埃及行动的目的。译文用“为要……并……”保持两项目的并列，同时不把目的与结果之间的语义张力解释得过死。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“埃及地”“迦南地”“赐给”保留经文的历史与盟约语感；分号划分上帝的身份宣告与其救赎行动，避免句子拖沓。脚注标记 [a] 已置于正文神名之后。
