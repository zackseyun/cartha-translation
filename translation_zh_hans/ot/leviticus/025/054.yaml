  source_fidelity: 译文准确保留了条件、未获赎回、禧年及“儿子们”的核心信息。但“他和他的儿子们都要出去”虽可大致表达并列主体，未充分呈现עִמּוֹ（“与他一同／随他”）所强调的共同离开；“到了禧年”也略弱化了原文“在禧年那一年”的明确时间表述。
