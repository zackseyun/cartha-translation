  text: וְ/אִם לֹ֥א יִגָּאֵ֖ל בְּ/אֵ֑לֶּה וְ/יָצָא֙ בִּ/שְׁנַ֣ת הַ/יֹּבֵ֔ל ה֖וּא וּ/בָנָ֥י/ו עִמּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/054.yaml
  text: But if he is not redeemed by these means[a], then he and his sons with him shall go out in the year of Jubilee.
translation:
  language: zh_hans
  text: 但他若没有借着这些方式[a]被赎回，在禧年那一年，他和他的儿子们要一同出去。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“借着这些”，指前几节所述的赎回规定。
    reason: 提示בְּאֵלֶּה的较直译形式及其前文指向。
lexical_decisions:
- source_word: וְאִם
  choice: 但……若
  rationale: 承接前文关于赎回的规定，并表示在这些可能性未能实现时的轻微转折。
- source_word: לֹא יִגָּאֵל
  choice: 没有……被赎回
  rationale: יִגָּאֵל是גאל的尼法勒式，在本法律语境中指借亲属或赎价而获赎；采用被动表达保留原文语态及法律含义。
- source_word: בְּאֵלֶּה
  choice: 通过这些方式
  rationale: 介词与指示代词回指前几节所列的赎回安排；“方式”是为现代汉语清晰度所作的最低限度补足，并以脚注保留直译可能。
- source_word: וְיָצָא
  choice: 都要出去
  rationale: 原义为“出去”，在此指脱离服役状态；保留原文惯用表达，不直接释作“获释”。“都”自然涵盖随后列出的本人及其儿子们。
- source_word: בִּשְׁנַת הַיֹּבֵל
  choice: 到了禧年
  rationale: 准确表达法律所规定的时间点，并采用《利未记》语境中יוֹבֵל的通行译名“禧年”。
- source_word: הוּא וּבָנָיו עִמּוֹ
  choice: 他和他的儿子们
  rationale: 保留בָנָיו明确的阳性复数“儿子们”；עִמּוֹ所表达的一同离开，由并列主语及“都”自然呈现。
theological_decisions:
- issue: בָנָיו所指家庭成员的性别范围
  choice: 儿子们
  alternative: 儿女／孩子们
  rationale: 希伯来文明确使用阳性复数“儿子”；译文不将其无依据地扩大为性别中性的家庭成员。
- issue: וְיָצָא在役使法规中的含义
  choice: 出去
  alternative: 获得释放
  rationale: “获得释放”能说明语境含义，但会消除原文“出去”这一法律惯用语；正文保留其具体意象与可能张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“被赎回”“禧年”保持法律与经文术语的一致性；句序略作汉语化处理，同时保留条件句、被动语态、性别用语和“出去”的原文意象。
