  text: then he shall calculate the years since its sale and return the surplus to the man to whom he sold it, and he shall return to his property.
translation:
  language: zh_hans
  text: 他要计算卖出以后经过的年数，把余款[a]还给买受人，他就归回自己的产业[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“剩余的款项”或“超出的数额”。希伯来语指按尚未使用的年数计算后余下的金额。
    reason: lexical_alternative
  - marker: b
    text: “产业”在这里指他所持有的土地，很可能是以色列人家族承受的产业。
    reason: cultural_note
lexical_decisions:
- source_word: וְחִשַּׁב
  choice: 他要计算
  rationale: חִשַּׁב在这里指核算赎回产业时所依据的年数；“计算”符合现代汉语，也保留法律条文的语气。
- source_word: שְׁנֵי מִמְכָּרוֹ
  choice: 卖出以后经过的年数
  rationale: 字面为“其售卖的年数”。结合禧年土地赎回的程序，所计算的是自卖出后已经过去的年数；此译法明确实际所指，同时不加入具体金额算法。
- source_word: וְהֵשִׁיב
  choice: 还给
  rationale: 使役式在本语境中表示偿还或交还款项；“还给”是自然、清楚的现代汉语。
- source_word: הָעֹדֵף
  choice: 余款
  rationale: 该词指核算后剩余或超出的部分；上下文涉及赎价，译作“余款”比泛称“剩余”更清楚，另以脚注保留词义范围。
- source_word: לָאִישׁ אֲשֶׁר מָכַר לוֹ
  choice: 给买受人
  rationale: 字面为“给他所卖给的那人”，即购得该产业的人。“买受人”简洁地表达法律关系，又比“买家”更符合庄重法规语体。
- source_word: וְשָׁב
  choice: 自己就可回到
  rationale: שׁוב表示归回；在完成核算和偿还后，原卖主得以回归其产业。“就可”自然表达这一法律许可与结果，不把它误读为空间上的一般返回。
- source_word: לַאֲחֻזָּתוֹ
  choice: 他的产业
  rationale: אֲחֻזָּה在利未记的禧年法规中指所持有的土地，通常带有家族承受之地的背景。“产业”兼顾关键词的一致性、庄重感和可读性。
theological_decisions:
- issue: 禧年法规中 אֲחֻזָּה 的性质
  choice: 产业
  alternative: 所有地；祖业；世袭产业
  rationale: 该词并非泛指一切财物，而是在以色列土地制度中指家族所承受、持有的土地。“产业”在正文中简洁自然，并以脚注说明其土地和家族承受的含义，避免把正文过度解释为“祖业”，也不淡化其圣约土地背景。
translation_notes:
  register: 采用现代、庄重而易懂的法规语体。“买受人”准确表达交易关系；“产业”延续利未记土地法规中的关键概念。句子按计算、偿还、归回三个步骤推进，贴合希伯来文结构。
