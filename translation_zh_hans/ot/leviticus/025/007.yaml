base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/007.yaml
  text: And for your livestock[a], and for the wild animals that are in your land, all its produce shall be for food.
translation:
  language: zh_hans
  text: 你地里一切的出产，都要给你的牲畜和你地上的野生动物作食物。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִבְהֶמְתְּךָ
  choice: 你的牲畜
  rationale: בְּהֵמָה在这里统指受话者所拥有的家养动物；“牲畜”既自然，又能与下文的野生动物形成清楚对比。
- source_word: לַחַיָּה
  choice: 野兽
  rationale: חַיָּה与“牲畜”相对，指非驯养的动物；“野兽”具体、简洁，也符合本段农耕语境。
- source_word: אֲשֶׁר בְּאַרְצְךָ
  choice: 地里的
  rationale: 关系从句修饰“野兽”；用“地里的”自然表达其位于受话者土地之中，并保留אֶרֶץ的具体土地含义。
- source_word: תִּהְיֶה
  choice: 要……作
  rationale: היה在此表示出产被指定、可供食用；“要……作食物”既保留律法语气，也符合现代汉语表达。
- source_word: כָּל תְּבוּאָתָהּ
  choice: 你地里的出产……都
  rationale: תְּבוּאָה指土地的出产，阴性后缀回指“地”；汉语将所属关系明说为“你地里的出产”，并用“都”传达כָּל。
- source_word: לֶאֱכֹל
  choice: 作食物
  rationale: 带ל的动词不定式表示用途；“作食物”自然地表达“供食用”，同时适合本节的律法文体。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的律法叙述语体。为避免汉语中连续两个“你的地”显得累赘，将希伯来语的信息重排为“你地里的出产，也都要给你的牲畜和地里的野兽作食物”，不改变出产供家畜与野生动物食用的含义。
