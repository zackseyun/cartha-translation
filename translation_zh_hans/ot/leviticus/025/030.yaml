source:
  edition: WLC
  text: וְ/אִ֣ם לֹֽא יִגָּאֵ֗ל עַד מְלֹ֣את ל/וֹ֮ שָׁנָ֣ה תְמִימָה֒ וְ֠/קָם הַ/בַּ֨יִת אֲשֶׁר בָּ/עִ֜יר אֲשֶׁר לא חֹמָ֗ה לַ/צְּמִיתֻ֛ת לַ/קֹּנֶ֥ה אֹת֖/וֹ לְ/דֹרֹתָ֑י/ו לֹ֥א יֵצֵ֖א בַּ/יֹּבֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/030.yaml
  text: But if it is not redeemed before a full year is completed for it[a], then the house that is in a city that has no wall shall pass permanently to the one who bought it, throughout his generations[b]; it shall not go out in the Jubilee.
translation:
  language: zh_hans
  text: 若到整整一年期满时仍未赎回，位于有城墙[a]的城内的房屋，就永久归买主及其世世代代所有；禧年时也不归还原主。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 马所拉传统的读音是“有城墙”；书写形式则是“没有城墙”。本节上下文承接第29节，并与第31节的无城墙村庄相对，因此正文采用读音。
    reason: textual_variant
lexical_decisions:
- source_word: יִגָּאֵל
  choice: 赎回
  rationale: 此处 גאל 的尼法勒形态指在产业赎回制度下被原业主或其亲属赎买回来。“赎回”既保留利未记25章的法律术语，也能表达买回产业之意。
- source_word: עַד מְלֹאת לוֹ שָׁנָה תְמִימָה
  choice: 若满了一整年还没有
  rationale: 该短语规定赎回期限，以自然的现代汉语表达“直到完整一年期满”这一时间界限，不额外限定其历法算法。
- source_word: וְקָם ... לַצְּמִיתֻת
  choice: 就永久归……所有
  rationale: קום 字面为“立定”，在本法律语境中表示交易正式确立；לצמיתת 表明这种归属永久有效。合译可清楚传达法律效力。
- source_word: הַבַּיִת אֲשֶׁר בָּעִיר אֲשֶׁר לוֹ חֹמָה (קרי)
  choice: 位于有城墙的城内的房屋
  rationale: 采用马所拉读音（Qere）“有城墙”，这也符合25:29及25:31的上下文对比；书写形式的异文在脚注中保留。
- source_word: לַקֹּנֶה אֹתוֹ
  choice: 归买主……所有
  rationale: 分词 קנה 指购买该房屋的人；“买主”简洁自然，并与永久产权的法律语境相称。
- source_word: לְדֹרֹתָיו
  choice: 及其世世代代
  rationale: 该短语表示产权延续于买主后续各代，而非仅限买主本人；“世世代代”保留代际延续的形式与力度。
- source_word: לֹא יֵצֵא בַּיּוֹבֵל
  choice: 禧年时也不归还原主
  rationale: יצא 字面为“出去”，在产业法语境中指脱离买主而复归原业主。译出实际法律含义，比直译“不出去”更易懂。
- source_word: יּוֹבֵל
  choice: 禧年
  rationale: 这是利未记25章所设制度的通行中文名称，庄重且为普通读者所能识别。
theological_decisions:
- issue: 城内房屋买卖在一年赎回期后的法律效力
  choice: 一年期满仍未赎回，房屋便永久归买主家系，禧年也不复归原主。
  alternative: 较字面地译作房屋“永久立定”给买主，不明说产权复归与否。
  rationale: וְקָם、לַצְּמִיתֻת、לְדֹרֹתָיו及לֹא יֵצֵא בַּיּוֹבֵל共同表明交易成为永久且可世代承继，并明确排除禧年复归；译文只阐明本段产业法的含义，不引入额外教义。
- issue: “有城墙”与“没有城墙”的文本差异
  choice: 正文依马所拉读音译为“有城墙”。
  alternative: 依辅音书写形式译为“没有城墙”。
  rationale: 马所拉读音为 לוֹ（“有”），而书写形式为 לא（“没有”）。本节承接25:29的“有城墙的城”，并与25:31无城墙村庄的规定形成明确对比，因此正文采用读音，同时以脚注如实保存书写异文。
translation_notes:
  register: 采用现代、庄重而清楚的法律叙述。“赎回”“禧年”保留本章核心术语；“永久归……所有”和“不归还原主”将希伯来语法律惯用表达自然地转为现代汉语。正文仅设一个脚注标记[a]，用于不可忽略的马所拉读音与书写形式差异。
