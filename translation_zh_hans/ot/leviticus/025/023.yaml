  rationale: 修订将“永远卖断”调整为更自然、简明的“永久卖断”，并将可能过度限定的“暂住者”改为“居住者”，以保留תּוֹשָׁבִים的较宽语义。同步收敛“不过”及脚注中的扩展性表述，使正文和注释都忠实表达土地归上帝所有及以色列人的依附性居住地位。
