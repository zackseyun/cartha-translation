  text: וְ/הָ/אָ֗רֶץ לֹ֤א תִמָּכֵר֙ לִ/צְמִתֻ֔ת כִּי לִ֖/י הָ/אָ֑רֶץ כִּֽי גֵרִ֧ים וְ/תוֹשָׁבִ֛ים אַתֶּ֖ם עִמָּדִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/023.yaml
  text: The land must not be sold permanently[a], because the land is mine[b]. For you are strangers and sojourners with me.
translation:
  language: zh_hans
  text: “土地不可永久卖断[a]，因为土地是我的。你们在我这里是寄居者和居住者[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“不可永远卖断。”
    reason: lexical_alternative
  - marker: b
    text: “寄居者和居住者”表明以色列人是在属于上帝的土地上居住，其土地身分从属于上帝对土地的所有权。
    reason: cultural_note
lexical_decisions:
- source_word: תִמָּכֵר
  choice: 不可……卖断
  rationale: 这是 מכר 的尼法勒未完成式，在法律语境中具有被动禁令的效力。“不可卖断”既保留被动所指的交易，又自然表达禁令。
- source_word: לִצְמִתֻת
  choice: 永远……卖断
  rationale: צְמִתֻת 在土地制度语境中指永久、不可撤销的让渡。“永远卖断”是现代汉语中自然的土地交易用语，也与禧年归回的上下文相符。
- source_word: כִּי לִי הָאָרֶץ
  choice: 因为土地是我的
  rationale: 第一个 כִּי 引出禁令的理由；直译所有关系，保留上帝对土地的明确主权宣告。
- source_word: גֵרִים
  choice: 寄居者
  rationale: גֵר 指居住在非本族土地、地位有所依附的人。“寄居者”既保留非原有地主的身份，也符合庄重而易懂的圣经语体。
- source_word: וְתוֹשָׁבִים
  choice: 暂住者
  rationale: תּוֹשָׁב 指居住当地但没有世袭土地权的人。与“寄居者”并列译作“暂住者”，传达其居住权的非永久性，同时避免两词完全重复。
- source_word: עִמָּדִי
  choice: 在我这里
  rationale: עם 加第一人称单数后缀基本义为“与我同在／在我这里”。此处“在我这里”自然表达以色列人在上帝所属土地上居住的关系，又不把依附含义过度写入正文。
theological_decisions:
- issue: 以色列与土地的关系
  choice: 土地属于上帝，以色列人是在他那里寄居和暂住的人，其土地权并非绝对永久。
  alternative: 只把本节视为社会经济法规，不保留其神学根据；或把它扩展成超出禧年语境的绝对剥夺宣告。
  rationale: 原文明确以“土地是我的”作为不可永久卖断土地的理由，并以寄居者、暂住者描述以色列人的身份。译文保留法律规定及其神学依据，但不扩展到经文没有陈述的体系。
translation_notes:
  register: 采用现代、庄重而通俗的法律宣告语体。“卖断”准确传达永久让渡土地权的语境；“不过是”自然显明 כִּי 所引出的身份理由，但不削弱人的尊严。所有脚注标记均已置于正文对应位置。
