  text: כִּֽי עֲבָדַ֣/י הֵ֔ם אֲשֶׁר הוֹצֵ֥אתִי אֹתָ֖/ם מֵ/אֶ֣רֶץ מִצְרָ֑יִם לֹ֥א יִמָּכְר֖וּ מִמְכֶּ֥רֶת עָֽבֶד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/042.yaml
  text: For they are my slaves[a], whom I brought out from the land of Egypt[b]; they shall not be sold as slaves are sold.
translation:
  language: zh_hans
  text: 因为他们是我的奴隶[a]，是我从埃及地领出来的；他们不可按买卖奴隶的方式被卖[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“我的仆人”。希伯来语עֲבָדַי可译作“我的奴隶”或“我的仆人”；这里采用“奴隶”，因为本节强调归属关系，并禁止把以色列人当作普通奴隶财产出售。
    reason: lexical_alternative
  - marker: b
    text: 直译“不可按奴隶的售卖方式被卖”，意思是不可用普通奴隶交易的方式出售他们。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 引出上一条律例的理由，保留原文的解释和因果作用。
- source_word: עֲבָדַי
  choice: 我的奴隶
  rationale: עֶבֶד带第一人称单数词尾。这里强调以色列人属于耶和华，因此不可被同胞当作可交易的奴隶；“奴隶”比“仆人”更能保留此处的社会法律力度。
- source_word: הֵם
  choice: 他们是
  rationale: 明确译出独立代词所带的强调，并按现代汉语补出判断词“是”。
- source_word: אֲשֶׁר הוֹצֵאתִי אֹתָם
  choice: 是我……领出来的
  rationale: 用强调结构自然表达关系从句，并保留出埃及叙事中“领出来”的惯用说法。
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: 从埃及地
  rationale: 准确、简洁地保留地理称谓和介词关系。
- source_word: לֹא יִמָּכְרוּ
  choice: 他们不可……被卖掉
  rationale: 原文为尼法勒未完成式，在法律语境中表达被动禁令；“不可……被卖掉”兼顾语态和律法语气。
- source_word: מִמְכֶּרֶת עָבֶד
  choice: 像奴隶那样
  rationale: 该短语指奴隶买卖的方式或性质；此译自然表达不得把以色列同胞作为普通奴隶财产出售的禁令。
theological_decisions:
- issue: 在耶和华拥有并救赎以色列人的语境中如何翻译עֶבֶד
  choice: 奴隶
  alternative: 仆人／奴仆
  rationale: 本节以耶和华对以色列人的所有权为禁止转卖的依据，受辖制和归属的法律身份是论证重点。“奴隶”保留这种张力，不把原文柔化为一般性的服事关系；脚注同时注明可译“仆人”。
translation_notes:
  register: 采用现代、庄重而易懂的律法语言。“奴隶”有意保留原文尖锐的所有权表达；末句使用自然汉语，同时以脚注交代其较为凝缩的希伯来语结构。
