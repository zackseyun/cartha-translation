  yaml_path: translation/ot/leviticus/025/037.yaml
  text: You shall not lend him your money at interest[b][a], nor give him your food for increase.
translation:
  language: zh_hans
  text: 不可把你的钱[a]借给他以收取利息，也不可把你的食物给他以求增益[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“银子”。希伯来语 כֶּסֶף 既可指“银子”，也可指“钱”；这里所说的是用于借贷的钱。
    reason: lexical_alternative
  - marker: b
    text: “增益”也可译为“增加”；指供应食物时所索取的额外回报。
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּסְפְּךָ (כֶּסֶף)
  choice: 你的钱
  rationale: 该词本义可指“银子”，也常在经济和法律语境中指“钱”。本节涉及借贷，因此译作“钱”最自然。
- source_word: תִתֵּן לוֹ
  choice: 借给他
  rationale: 动词字面义为“给”，但与“钱”和“利息”连用时，语境明确指借贷；译作“借给他”准确传达法律经济含义。
- source_word: בְּנֶשֶׁךְ
  choice: 收取利息
  rationale: 该词指贷款所收的利息；现代汉语“利息”清楚准确，又不把含义限缩为过高或非法的利息。
- source_word: וּבְמַרְבִּית
  choice: 从中取利
  rationale: מַרְבִּית表示增加、增益或额外收益；这里与供应食物相连，“从中取利”自然表达索取额外回报的意思，同时脚注保留其字面意象。
- source_word: אָכְלֶךָ (אֹכֶל)
  choice: 你的食物
  rationale: 该词直接指食物。保留“你的”，对应原文第二人称所有格，也维持与前句“你的钱”的平行。
- source_word: לֹא ... לֹא
  choice: 不可……也不可
  rationale: 两个否定词构成并列禁令；这一译法保留原文法律性的语气和平行结构。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的法律性措辞。“借给”按上下文表达 תִתֵּן 的实际含义；两个并列禁令保持简洁对称，并用脚注保留 כֶּסֶף 和 מַרְבִּית 的词义幅度。
