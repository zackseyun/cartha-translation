  text: דַּבֵּ֞ר אֶל בְּנֵ֤י יִשְׂרָאֵל֙ וְ/אָמַרְתָּ֣ אֲלֵ/הֶ֔ם כִּ֤י תָבֹ֨אוּ֙ אֶל הָ/אָ֔רֶץ אֲשֶׁ֥ר אֲנִ֖י נֹתֵ֣ן לָ/כֶ֑ם וְ/שָׁבְתָ֣ה הָ/אָ֔רֶץ שַׁבָּ֖ת לַ/יהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/002.yaml
  text: Speak to the sons of Israel and say to them, ‘When you come into the land that I am giving to you, then the land shall keep a Sabbath to Yahweh.
translation:
  language: zh_hans
  text: 你要向以色列人宣告，对他们说：“你们进入我赐给你们的那片土地时，土地要为雅威[b]守安息[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“土地要为雅威享受安息。”原文把土地拟人化，说它遵守安息。
    reason: lexical_alternative
  - marker: b
    text: “雅威”是希伯来文神名יהוה（YHWH）的音译；传统上也译作“耶和华”，有些译本以“上主”代替。
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר אֶל־בְּנֵי יִשְׂרָאֵל
  choice: 你要告诉以色列人
  rationale: דַּבֵּר是加强词干命令式，表示直接吩咐；בְּנֵי יִשְׂרָאֵל字面为“以色列的众子”，在现代汉语中用涵盖整个群体的惯用称呼“以色列人”最自然。
- source_word: וְאָמַרְתָּ אֲלֵהֶם
  choice: 对他们说
  rationale: 保留原文连续而庄重的训令句式，也与前面的“告诉”形成自然衔接。
- source_word: כִּי תָבֹאוּ אֶל־הָאָרֶץ
  choice: 你们进入……那片土地时
  rationale: 此处כִּי引出预期会发生的时间情境，译为“……时”比条件性的“如果”更合适；בוא加אֶל表达进入。
- source_word: אֲשֶׁר אֲנִי נֹתֵן לָכֶם
  choice: 我赐给你们的
  rationale: נֹתֵן为分词，表达正在实现或即将实现的赐予；汉语定语结构简洁自然，“赐”也符合神赐土地的语境。
- source_word: וְשָׁבְתָה הָאָרֶץ שַׁבָּת
  choice: 土地要……守安息
  rationale: 保留原文将土地拟人化、使其遵守安息的突出表达；“守安息”兼顾停止耕作和遵守安息制度的含义。
- source_word: לַיהוָה
  choice: 为雅威
  rationale: 介词ל表示这安息归于、献于雅威；“为”在现代汉语中自然表达这种归属和奉献关系。
- source_word: יהוה
  choice: 雅威
  rationale: 采用对四字神名YHWH的音译，直接呈现经文中的专名，而不以称号代替。
theological_decisions:
- issue: 土地守安息的拟人表达
  choice: 土地要为雅威守安息
  alternative: 土地要为雅威休息
  rationale: 原文不只说土地停止劳作，还用同根的动词שׁבת和名词שׁבת表达土地“守安息”；所选译法保存这种制度性和拟人化张力。
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文使用神的专名；音译“雅威”比以“上主”这一称号替代更直接，也较接近学界通常重构的读音。
translation_notes:
  register: 采用现代、庄重而易懂的法律训令语体。“以色列人”符合现代汉语群体称谓；保留“土地守安息”的拟人化表达，不把本节原文没有明说的“年”加入正文。
