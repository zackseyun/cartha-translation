  to: 至于利未人的城，他们所承受为业之城中的房屋，利未人永远有赎回权。[a]
  rationale: 修订仅消除正文中由“就是”引起的错误同位关系：先以“利未人的城”设定法规范围，再以“他们所承受为业之城中的房屋”作为赎回权所涉及的对象。保留“永远”以表达עוֹלָם在此法律语境中的持续有效性，并以脚注保留原文较形式化的名词性表达。
