  text: וְ/עָרֵי֙ הַ/לְוִיִּ֔ם בָּתֵּ֖י עָרֵ֣י אֲחֻזָּתָ֑/ם גְּאֻלַּ֥ת עוֹלָ֖ם תִּהְיֶ֥ה לַ/לְוִיִּֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/032.yaml
  text: As for the cities of the Levites[a], the houses in the cities of their possession may be redeemed permanently by the Levites.
translation:
  language: zh_hans
  text: 至于利未人的城，他们所承受为业之城中的房屋，利未人永远有赎回权。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或较直译：“永久的赎回权必归利未人所有。”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/עָרֵי הַ/לְוִיִּם
  choice: 至于利未人的城
  rationale: 连接词加名词在此引出法律条文中的新情况；用“至于”自然标明话题转换，同时保留“利未人的城”这一所属关系。
- source_word: בָּתֵּי עָרֵי אֲחֻזָּתָם
  choice: 就是他们承受为业之城中的房屋
  rationale: 希伯来语字面为“他们产业之城的房屋”。“承受为业”体现 אֲחֻזָּה 所含的法定、世袭产业意味，“城中的房屋”则符合现代汉语表达。
- source_word: גְּאֻלַּת
  choice: 赎回权
  rationale: 本词指赎回已转让产业的法律性赎回；结合“归利未人所有”的句式，译为“赎回权”能清楚表达持续存在的法定权利。
- source_word: עוֹלָם
  choice: 永远
  rationale: 在本法律语境中表示长久、持续有效；“永远”简洁自然，表达该权利不因一般期限而消失。
- source_word: תִּהְיֶה לַ/לְוִיִּם
  choice: 利未人……有
  rationale: 字面为“必归利未人所有”。汉语用“利未人有……权”自然传达 לְ 所标示的权利归属及未完成式所陈述的法规效力。
theological_decisions:
- issue: 利未城中房屋赎回条款的法律效力
  choice: 本节赋予利未人持续有效的赎回权
  alternative: 较形式对应地译作“永久的赎回必归利未人所有”
  rationale: גְּאֻלַּת עוֹלָם תִּהְיֶה לַלְוִיִּם 是名词性法律表述，核心是赎回权持续归利未人。正文以自然汉语表达其法律作用，脚注保留较贴近原文结构的译法，避免把歧义静默消除。
translation_notes:
  register: 采用现代、庄重而易懂的法律叙述语体。“承受为业”保留利未记土地制度的产业含义；“赎回权”明确本句的法律功能。脚注标记已在正文中出现。
