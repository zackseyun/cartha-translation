base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/006.yaml
  text: The Sabbath produce of the land shall be for you for food—for you[a], for your male slave, for your female slave, for your hired worker[b], and for your resident foreigner who dwells with you.
translation:
  language: zh_hans
  text: 地在安息年间的出产[a]要供你们食用，也供你、你的男奴、女奴，以及住在你那里、作雇工或外来寄居者的人食用[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“地的安息”；这里指土地在安息年间所出的、可供食用的出产。
    reason: lexical_alternative
  - marker: b
    text: “外来寄居者”指住在以色列人中间、却不是本地人的人；也可译作“寄居者”。原文“住在你那里”的复数形式可连及“雇工”和“外来寄居者”两个类别。
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׁבַּת הָאָרֶץ
  choice: 地在安息年间的出产
  rationale: 原文直译为“地的安息”，但“作食物”表明此处实际涉及土地在安息期间自然长出的出产。正文采用自然清楚的表达，同时以脚注保留原文措辞及其制度性联系。
- source_word: לָכֶם לְאָכְלָה
  choice: 要给你们作食物
  rationale: 保留“给你们”和“作食物”的目的、用途含义，并符合中文律法语体。
- source_word: לְךָ
  choice: 就是给你
  rationale: 保留原文由复数“你们”转为单数“你”的变化，并自然引出可享用出产者的名单。
- source_word: עַבְדְּךָ / אֲמָתֶךָ
  choice: 你的男奴、女奴
  rationale: 两词分别指男性和女性奴隶；如此翻译保留其受奴役身份以及原文明确的性别区分，不与雇工混同。
- source_word: שְׂכִירְךָ
  choice: 雇工
  rationale: 指领取报酬的受雇劳动者；“雇工”简明、现代，并保留其与奴隶不同的社会经济身份。
- source_word: תוֹשָׁבְךָ הַגָּרִים עִמָּךְ
  choice: 和你住在一起的外来居民
  rationale: תוֹשָׁב指住在当地、却并非本土成员的人；后面的短语说明其与受话者共同居住。“外来居民”既表达居留状态，也保留外来者身份。
theological_decisions:
- issue: 以色列律法中不同劳役身份的译法
  choice: 将 עבד/אמה 译为“男奴、女奴”，将 שׂכיר 译为“雇工”
  alternative: 把三者都译作“仆人”或“佣人”
  rationale: 原文刻意区分受奴役的家庭成员与领取报酬的雇工；统一译作“仆人”会抹去这项法律和社会差异。
- issue: “地的安息”与安息年出产之间的关系
  choice: 正文译为“地在安息年间的出产”，脚注保留直译
  alternative: 正文直译为“地的安息”
  rationale: “作食物”显示这里指安息年间可供食用的自然出产；但原文以“地的安息”称之，因此脚注保留其真实措辞及神学张力，而不把安息仅化约为农产品。
translation_notes:
  register: 采用现代、庄重而易懂的律法叙述语体。“你们”与“你”的转换依照希伯来原文：先面向群体陈述，随后以单数列举个人家中的成员。
