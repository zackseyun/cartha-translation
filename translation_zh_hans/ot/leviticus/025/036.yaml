  terminology: “利息”准确；将第二个术语译为“增益”可保留其与“利息”相关但不完全相同的经济增额含义，脚注说明其可译为“增加”或“获利”。“敬畏”“上帝”“弟兄”均恰当；“弟兄”的盟约群体含义应保留脚注。
