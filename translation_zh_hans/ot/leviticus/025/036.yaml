base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/036.yaml
  text: Do not take interest or profit from him[a], but fear your God[b], and let your brother live with you.
translation:
  language: zh_hans
  text: 不可向他收取利息和增益[a]；要敬畏你的上帝，让你的弟兄[b]得以与你同住。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “增益”也可译作“增加”或“获利”。希伯来文在这里把两个相关词并列，指从贫困借款人身上收取的利息或额外利益。
    reason: lexical_alternative
  - marker: b
    text: 这里的“弟兄”指同属盟约群体的人，不一定是亲生兄弟。
    reason: cultural_note
lexical_decisions:
- source_word: אַל תִּקַּח
  choice: 不可……收取
  rationale: אַל加未完成式表达禁令；“不可”保留律法命令的直接力度，“收取”也符合利息和收益的经济语境。
- source_word: מֵאִתּוֹ
  choice: 向他
  rationale: 表示从这位处于困境的同胞身上取得所禁止的利益；现代汉语在“收取”之后自然说“向他”。
- source_word: נֶשֶׁךְ
  choice: 利息
  rationale: 指贷款所收取的利息；“高利贷”容易把含义限于过高利率，而原文在此禁止的是向贫困同胞收息。
- source_word: וְתַרְבִּית
  choice: 或额外收益
  rationale: 该词与“利息”并列，指在本金或借出物之外索取的增加、进项或利益；“额外收益”在现代汉语中清楚表达这种经济含义，同时不把两词强行等同。
- source_word: וְיָרֵאתָ מֵאֱלֹהֶיךָ
  choice: 要敬畏你的上帝
  rationale: 连接词在语境中引出与剥削相反的伦理要求；“敬畏”保留既畏惧又尊崇的圣经用语，“你的上帝”保留第二人称单数及盟约性的直接称呼。
- source_word: וְחֵי
  choice: 并让……生活
  rationale: 保留连接词和此处的意愿、命令意味，不明确增添“以便”之类的目的关系；“让……生活”自然传达容许并扶持对方继续生存。
- source_word: אָחִיךָ
  choice: 你的弟兄
  rationale: 直译亲属称谓，并保留律法语境中同属盟约群体者之间的家族性联系；群体含义由脚注说明。
- source_word: עִמָּךְ
  choice: 与你一同
  rationale: 直接表达对方继续在受命者身边、同一群体中生活的意思。
theological_decisions:
- issue: 盟约律法中אָחִיךָ的社会伦理含义
  choice: 你的弟兄
  alternative: 你的以色列同胞；你的族人
  rationale: 原文使用“弟兄”这一亲属称谓，同时在本章语境中指同属盟约群体的人。正文保留原有家族性意象，脚注解释其范围，避免把它误解为仅指亲生兄弟。
- issue: וְחֵי所表达的逻辑关系
  choice: 并让你的弟兄……生活
  alternative: 使你的弟兄可以……生活；好让你的弟兄……生活
  rationale: 原文以连接词加动词形式承接前句，可具有意愿或结果色彩，但没有明示单一的目的关系。采用“并让”较直接地保留命令推进及一定的语义张力。
translation_notes:
  register: 采用现代、庄重而易懂的律法语体。“不可”体现禁令力度；“额外收益”避免古奥，也不将第二个经济术语缩窄为单纯的利息。脚注标记分别紧随所解释的词语。
