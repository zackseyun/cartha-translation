revisions:
- from: 不可向他收取利息或额外收益[a]；要敬畏你的上帝，并让你的弟兄[b]与你一同生活。
  to: 不可向他收取利息和增益[a]；要敬畏你的上帝，让你的弟兄[b]得以与你同住。
  rationale: 将并列术语之间的“或”改为“和”，以反映原文的连词关系；以“增益”简洁保留第二术语的经济增额含义，并相应调整脚注。末句改为“得以与你同住”，使汉语更自然地表达同一共同体中继续生活的意思，同时维持原文未明示单一目的关系的句法张力。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T04:51:46Z'
