  text: אֵ֣ת סְפִ֤יחַ קְצִֽירְ/ךָ֙ לֹ֣א תִקְצ֔וֹר וְ/אֶת עִנְּבֵ֥י נְזִירֶ֖/ךָ לֹ֣א תִבְצֹ֑ר שְׁנַ֥ת שַׁבָּת֖וֹן יִהְיֶ֥ה לָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/005.yaml
  text: You shall not reap the aftergrowth of your harvest[a], and you shall not gather the grapes of your unpruned vine[c][b]; it shall be a year of complete rest for the land.
translation:
  language: zh_hans
  text: 你收割后自生的庄稼[a]，不可收割；你未修剪的葡萄树所结的葡萄[b]，也不可采摘。这是土地完全安息的一年[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“自生的庄稼”。指先前收割后自行长出的作物。
    reason: lexical_alternative
  - marker: b
    text: “未修剪的葡萄树”直译可作“被分别出来的葡萄树”，指安息年间任其生长、未加料理的葡萄树。
    reason: lexical_alternative
  - marker: c
    text: 或译：“这是土地的安息年”或“这是土地庄严安息的一年”。
    reason: lexical_alternative
lexical_decisions:
- source_word: סְפִיחַ קְצִירְךָ
  choice: 你收割后自然长出的庄稼
  rationale: סְפִיחַ 指先前收割后由遗落种子等自行长出的作物，而非当年有意播种的庄稼；此译在现代汉语中清楚自然，并保留其自生含义。
- source_word: לֹא תִקְצוֹר
  choice: 不可收割
  rationale: קצר 专指收割田间作物；用“收割”准确保留农业语境。
- source_word: עִנְּבֵי נְזִירֶךָ
  choice: 你未修剪的葡萄树所结的葡萄
  rationale: נָזִיר 在此指安息年间被撇下、不加料理或修剪的葡萄树，并非指许愿的拿细耳人；此译表达实际农业含义，同时以脚注保留字面的语义范围。
- source_word: לֹא תִבְצֹר
  choice: 不可采摘
  rationale: בצר 特指采收葡萄；“采摘”符合现代汉语习惯，也与前句的“收割”形成恰当区别。
- source_word: שְׁנַת שַׁבָּתוֹן
  choice: 这一年……要完全安息
  rationale: שַׁבָּתוֹן 表达强化的安息，即彻底停止常规耕作；“完全安息”既传达强调意味，也不把它弱化为单纯的年份名称。
- source_word: לָאָרֶץ
  choice: 土地
  rationale: 本章语境是耕种之地及其农业周期，因此“土地”比泛指世界的“大地”更准确。
theological_decisions:
- issue: 如何表达土地的安息年，同时避免加入后来的教义或礼仪联想
  choice: 这一年，土地要完全安息
  alternative: 这一年要作土地的安息年／这一年，土地要守严肃的安息
  rationale: 此译让“土地”保持为安息的承受者，并传达 שַׁבָּתוֹן 的强化意味；既保留安息主题，也不额外引入经文没有明说的制度解释。
translation_notes:
  register: 采用现代、庄重而易懂的法规语体；以“不可……也不可……”呈现两个平行禁令，并将最后一句独立处理，以突出土地完全安息的要求。所有脚注标记均置于相应正文词语之后。
