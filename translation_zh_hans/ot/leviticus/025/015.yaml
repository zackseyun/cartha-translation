  text: בְּ/מִסְפַּ֤ר שָׁנִים֙ אַחַ֣ר הַ/יּוֹבֵ֔ל תִּקְנֶ֖ה מֵ/אֵ֣ת עֲמִיתֶ֑/ךָ בְּ/מִסְפַּ֥ר שְׁנֵֽי תְבוּאֹ֖ת יִמְכָּר לָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/015.yaml
  text: According to the number of years after the Jubilee[a], you shall buy from your fellow; according to the number of years of crops he shall sell to you.
translation:
  language: zh_hans
  text: 你要按禧年以后年数的多少，向你的同胞购买；他也要按可收成的年数[a]卖给你。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译为“按出产的年数”。这里的售价按下一个禧年以前尚可收成的年份计算，并不是把土地永久转让。
    reason: 说明 שְׁנֵי תְבוּאֹת 的字面含义及其在禧年土地制度中的计价作用。
lexical_decisions:
- source_word: בְּמִסְפַּר
  choice: 按照……年数的多少
  rationale: 介词 בְּ 与 מִסְפַּר 连用，表示衡量或计算的标准；这一译法既保留“按数目”的含义，也符合现代汉语表达。
- source_word: אַחַר הַיּוֹבֵל
  choice: 禧年以后
  rationale: 忠实表达相对于禧年的时间关系；“禧年”是《利未记》25章中 יוֹבֵל 的通行译法。
- source_word: תִּקְנֶה
  choice: 你要……购买
  rationale: 未完成式在律法语境中具有规范性，“要”自然传达法律指示的语气。
- source_word: מֵאֵת עֲמִיתֶךָ
  choice: 向同胞
  rationale: עָמִית 指群体中的同伴或同属一共同体的人；“同胞”适合本段以色列共同体内部交易的法律语境，又不额外限定具体亲属关系。
- source_word: שְׁנֵי תְבוּאֹת
  choice: 可收成的年数
  rationale: 该短语直指“出产／收成的年数”，重点是土地尚能提供收成的年份；加入“可”使汉语自然，并清楚表达这些年份是交易计价的依据。
- source_word: יִמְכָּר לָךְ
  choice: 他也要……卖给你
  rationale: 保留第三人称单数卖方与第二人称买方之间的对应关系；“也”呈现原文两个平行分句的关联。
theological_decisions:
- issue: 土地交易是永久转让，还是按禧年周期计算使用收益
  choice: 正文保留按年数交易的表述，脚注说明计价涉及下一个禧年前可收成的年份
  alternative: 直接在正文译成“按距离下一个禧年尚余的收成年数”
  rationale: 原文本节没有明说“永久转让”或“尚余至下一个禧年”，但上下文表明交易价值与禧年周期中的收成年份有关。将解释放入脚注，可保留本节措辞，同时帮助读者理解法律背景。
translation_notes:
  register: 采用现代、庄重而易懂的法律叙述语体。两个分句保持平行：“你要……购买；他也要……卖给你。”脚注标记置于其所解释的“可收成的年数”所在句末。
