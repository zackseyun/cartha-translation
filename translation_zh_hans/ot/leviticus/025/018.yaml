  rationale: 修订仅解决“照着实行”的无明确宾语及搭配不完整问题，并以“就必”更直接呈现命令之后的安居结果。法律术语的区分、原文动词复现、特指土地及安全居住的意义均予保留；脚注锚点与脚注内容完整对应。
