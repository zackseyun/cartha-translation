base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/018.yaml
  text: So you shall carry out my statutes and keep my judgments[a], and do them[c][b], and you shall dwell in the land securely.
translation:
  language: zh_hans
  text: 你们要遵行我的律例，谨守我的典章，并实行这些规定[a]；你们就必在那地安然居住[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文两次使用“做、实行”一词，直译为：“你们要实行我的律例，谨守我的典章，并实行它们。”
    reason: lexical_alternative
  - marker: b
    text: 指在上帝应许赐给以色列的土地上安全居住。
    reason: cultural_note
lexical_decisions:
- source_word: חֻקֹּתַי
  choice: 我的律例
  rationale: “律例”自然保留 חֻקִּים 所指规定、法令的盟约法律含义，也能与下文 מִשְׁפָּטִים 区分。
- source_word: מִשְׁפָּטַי
  choice: 我的典章
  rationale: מִשְׁפָּטִים 可指判例、裁决或法度；“典章”庄重而易懂，并与“律例”构成两个不同但相关的法律类别。
- source_word: תִּשְׁמְרוּ
  choice: 谨守
  rationale: שׁמר 在盟约和法律语境中意为守住、遵守；“谨守”既体现持续留意，也符合现代中文圣经法律语体。
- source_word: וַעֲשִׂיתֶם ... אֹתָם
  choice: 遵行……并照着实行
  rationale: 原文两次使用 עשה，形成强调实际履行的复现结构。中文用“遵行……实行”避免生硬重复，同时用脚注说明原文措辞。
- source_word: וִישַׁבְתֶּם
  choice: 居住
  rationale: ישׁב 在土地应许语境中指安居、定居；“居住”是自然、准确的现代中文表达。
- source_word: הָאָרֶץ
  choice: 那地
  rationale: 此处带定冠词的 הָאָרֶץ 承接上下文中赐给以色列的土地；“那地”保留特定的盟约土地指向，而不泛化为任何地方。
- source_word: לָבֶטַח
  choice: 安然
  rationale: בֶּטַח 表示安全、稳妥；“安然居住”是自然搭配，传达不受威胁的稳定生活。
theological_decisions:
- issue: 顺服与在地上安居之间的关系
  choice: 以“就可以”表达本节在以色列盟约土地处境中，遵行上帝法令与安然居住之间的结果关系。
  alternative: 把本节理解为对所有时代信徒个人安全或兴旺的普遍保证。
  rationale: 希伯来文以连续动词把遵行命令和在特定土地上安居相连；译文保留这一盟约处境，不把应许泛化。
translation_notes:
  register: 采用现代、庄重而清楚的普通话。“律例／典章”保留原文两个法律术语的区别；“遵行／谨守／实行”呈现命令从留意遵守到实际履行的层次。脚注标记均置于相关正文之后。
