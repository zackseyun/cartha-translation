  text: וּֽ/שְׂדֵ֛ה מִגְרַ֥שׁ עָרֵי/הֶ֖ם לֹ֣א יִמָּכֵ֑ר כִּֽי אֲחֻזַּ֥ת עוֹלָ֛ם ה֖וּא לָ/הֶֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/034.yaml
  text: But the field of pastureland belonging to their cities must not be sold[b][a], for it is their permanent possession.
translation:
  language: zh_hans
  text: 但他们各城的郊野地[a]不可卖，因为那是他们永久[b]的产业。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “郊野地”也可译作“公用地”或“空地”，指利未人各城周围的土地。
    reason: lexical_alternative
  - marker: b
    text: “永久”也可译作“永远”；希伯来语在这里强调这产业持久、不可转让的地位。
    reason: alternative_reading
lexical_decisions:
- source_word: וּ/שְׂדֵה
  choice: 但……田地
  rationale: שְׂדֵה意为“田地”；句首וּ在这里承接上文并形成转折，译为“但”能清楚表达本节与前文利未人城中房屋可赎回之规定的对照。
- source_word: מִגְרַשׁ
  choice: 郊野
  rationale: מִגְרָשׁ指城周围的空地、公共用地或牧放牲畜之地。“郊野”既简洁自然，也保留其位于城外周边的空间含义，而不把用途限定为放牧。
- source_word: עָרֵי/הֶם
  choice: 他们各城
  rationale: 该词意为“他们的城”。置于“郊野”之前，译作“他们各城郊野”可自然表达这些地带隶属于他们各城。
- source_word: לֹא יִמָּכֵר
  choice: 不可卖
  rationale: מכר的尼法勒未完成式在此为被动意义“被卖”，并带有律法禁令的语气；“不可卖”简明地表达这一禁止。
- source_word: כִּי
  choice: 因为
  rationale: כִּי在此引出禁止出售的理由，译为“因为”符合现代汉语因果表达。
- source_word: אֲחֻזַּת עוֹלָם
  choice: 永久的产业
  rationale: אֲחֻזָּה指作为地产而持有的产业，עוֹלָם在本条土地律法中强调持续、不可转让的地位；“永久的产业”保留其法律力度，同时不额外断定抽象意义上的无穷永恒。
- source_word: הוּא לָ/הֶם
  choice: 那是他们……的
  rationale: 阳性单数代词הוּא回指前述田地，לָהֶם表明归属；“那是他们……的产业”符合现代汉语表达。
theological_decisions:
- issue: עוֹלָם在以色列土地律法中的含义
  choice: 永久
  alternative: 永远；恒久
  rationale: 此处强调该土地作为利未人产业持续保留、不得转让的法律地位。“永久”既传达长久不变，也避免将经文的律法用语扩张为关于形而上无限时间的断言。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“他们各城郊野的田地”保留原文“田地—郊野—各城”的构造关系，又避免生硬直译；“不可卖”符合律法条文的简洁语体。
