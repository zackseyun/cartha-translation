  text: וְ/סָפַרְתָּ֣ לְ/ךָ֗ שֶׁ֚בַע שַׁבְּתֹ֣ת שָׁנִ֔ים שֶׁ֥בַע שָׁנִ֖ים שֶׁ֣בַע פְּעָמִ֑ים וְ/הָי֣וּ לְ/ךָ֗ יְמֵי֙ שֶׁ֚בַע שַׁבְּתֹ֣ת הַ/שָּׁנִ֔ים תֵּ֥שַׁע וְ/אַרְבָּעִ֖ים שָׁנָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/008.yaml
  text: You shall count for yourself seven sabbaths of years[a], seven years seven times, and the days of the seven sabbaths of years shall be for you forty-nine years.
translation:
  language: zh_hans
  text: “你要为自己计算七个七年安息周期[a]，即七年为一组，共七次；这七个七年安息周期的日子，共计四十九年。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“七个年周”。希伯来文直译为“七个年之安息”，指七个各为七年的周期。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְסָפַרְתָּ
  choice: 你要……数算
  rationale: ספר在此指计算、数点一系列规定的时期；“数算”既贴近原文，也符合庄重而清楚的现代汉语。
- source_word: לְךָ
  choice: 为自己
  rationale: 保留希伯来文明确的第二人称与格表达，表示这项年期计算是受命者应当进行的。
- source_word: שֶׁבַע שַׁבְּתֹת שָׁנִים
  choice: 七个安息年周期
  rationale: 直译为“七个年之安息”，此处实际指七个以七年为单位的安息年周期；译入“周期”可避免误解为七个单独的年份，同时保留与安息年条例的联系。
- source_word: שֶׁבַע שָׁנִים שֶׁבַע פְּעָמִים
  choice: 就是七年七次
  rationale: 保留原文重复说明的结构和次序，明确每个周期为七年，共重复七次。
- source_word: וְהָיוּ לְךָ
  choice: 共是
  rationale: 该表达引出前述周期所得的总数；“共是”以自然汉语传达其合计意义。末句不再逐字重复“为你”，因中文中主语语境已清楚，而总数关系得到保留。
- source_word: יְמֵי
  choice: 日子
  rationale: 保留原文字面的“日子”，表达这些周期所涵盖的全部时日。
- source_word: שֶׁבַע שַׁבְּתֹת הַשָּׁנִים
  choice: 七个安息年周期
  rationale: 与前半句用词一致，既保持重复，也使所计算的周期清楚。
- source_word: תֵּשַׁע וְאַרְבָּעִים שָׁנָה
  choice: 四十九年
  rationale: 按现代汉语习惯表达数字总数，准确对应原文。
theological_decisions:
- issue: שַׁבְּתֹת שָׁנִים是直译为“年的安息”，还是解释为七年周期
  choice: 正文作“安息年周期”，脚注注明也可译作“七个年周”并说明字面表达
  alternative: 七个年的安息；七个年周
  rationale: 本节上下文是禧年计算，所指为七个七年周期。正文保留“安息年”以维系与安息年制度的神学和文学联系，同时以“周期”避免把它理解成七个孤立的安息年；脚注保存原文比喻和译法空间。
translation_notes:
  register: 采用现代、庄重且易懂的简体中文。保留“七年七次”和“日子”等原文的重复与具体表达；以“安息年周期”兼顾原文意象、上下文含义和中文清晰度。
