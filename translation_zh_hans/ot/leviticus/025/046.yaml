  text: וְ/הִתְנַחֲלְתֶּ֨ם אֹתָ֜/ם לִ/בְנֵי/כֶ֤ם אַחֲרֵי/כֶם֙ לָ/רֶ֣שֶׁת אֲחֻזָּ֔ה לְ/עֹלָ֖ם בָּ/הֶ֣ם תַּעֲבֹ֑דוּ וּ/בְ/אַ֨חֵי/כֶ֤ם בְּנֵֽי יִשְׂרָאֵל֙ אִ֣ישׁ בְּ/אָחִ֔י/ו לֹא תִרְדֶּ֥ה ב֖/וֹ בְּ/פָֽרֶךְ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/046.yaml
  text: You may pass them on as an inheritance to your sons after you[a], to inherit as a possession permanently; from them you may exact labor. But over your brothers, the sons of Israel[b], no man shall rule over his brother harshly.
translation:
  language: zh_hans
  text: 你们可以把他们遗留给你们身后的儿子[a]，作为世代相传的产业；你们可以使他们服劳役。但对你们的弟兄，就是以色列人[b]，谁也不可严厉地辖制自己的弟兄。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你们可以把他们传给你们身后的儿子，作为永久的产业来承受。”
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“你们的弟兄，以色列的众子”；这里用男性亲属称谓，把以色列同胞称为盟约群体中的弟兄。
    reason: cultural_note
lexical_decisions:
- source_word: וְהִתְנַחֲלְתֶּם
  choice: 作为产业传给
  rationale: 该词在此表示使某人或某物成为可由后代承受的产业。“作为产业传给”既自然，也保留法律上的世袭含义。
- source_word: לִבְנֵיכֶם אַחֲרֵיכֶם
  choice: 给你们身后的儿子
  rationale: 直译希伯来文的“儿子”和“在你们之后”，保留原文明确的男性继承用语；“身后”在现代汉语中自然表达本人死后。
- source_word: לָרֶשֶׁת אֲחֻזָּה
  choice: 使他们……成为承受的产业
  rationale: 同时呈现“承受”和“产业”两层意义，避免淡化原文把人视为世袭财产的法律现实。
- source_word: לְעֹלָם
  choice: 永久
  rationale: 在这项社会法律中表示持续、恒久的法律地位，并非必然指超越历史的形而上永恒。
- source_word: בָּהֶם תַּעֲבֹדוּ
  choice: 你们可以使他们服劳役
  rationale: 此处 עבד 指在受支配关系下被迫服役；“使他们服劳役”比“让他们工作”更准确地反映强制性，同时不作过度扩写。
- source_word: וּבְאַחֵיכֶם בְּנֵי יִשְׂרָאֵל
  choice: 但对你们的弟兄以色列人
  rationale: 保留“弟兄”的盟约亲属语言，并以“以色列人”自然表达“以色列的众子”在此对该群体的指称。
- source_word: אִישׁ בְּאָחִיו
  choice: 谁也不可……自己的弟兄
  rationale: 该分配式结构禁止每一个以色列人如此对待同胞；汉语以“谁也不可”清楚、自然地表达普遍禁令。
- source_word: לֹא תִרְדֶּה בוֹ
  choice: 不可……辖制
  rationale: רדה 表示施行统治或支配。“辖制”保留权力关系，并由后面的副词说明其受禁止的严酷方式。
- source_word: בְּפָרֶךְ
  choice: 严厉地
  rationale: 该词在强迫劳动语境中表示苛刻、残酷的严厉方式；“严厉地”简洁并贴近原文，未将程度强化为唯一可能的“残酷无情”。
theological_decisions:
- issue: 以色列社会法律中的亲属称谓
  choice: 保留“弟兄”，并以“以色列人”说明其群体身份。
  alternative: 同胞；以色列同胞；族人
  rationale: 原文以男性亲属称谓表达盟约群体内部的团结和义务。“弟兄”保留这一神学和社会框架，脚注则说明原文形式。
- issue: 如何直接呈现本节的奴役和财产语言
  choice: 明确译出世袭产业和强制服劳役的含义。
  alternative: 采用较柔和的“仆役”“服事”等措辞，弱化所有权和强制性。
  rationale: 原文确实把这些人描述为可由后代承受的产业，并允许向他们索取劳动。译文不替文本作道德缓和，也不额外加入评价，从而保留其法律力度和神学张力。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“产业”“承受”“辖制”保持法律文本的正式感；“使他们服劳役”直面强制劳动的社会现实。主文中的[a]、[b]均与脚注对应。
