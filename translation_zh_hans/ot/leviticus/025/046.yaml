revisions:
- from: 你们可以把他们作为产业传给你们身后的儿子[a]，使他们永久成为承受的产业；你们可以使他们服劳役。但对你们的弟兄以色列人[b]，谁也不可严厉地辖制自己的弟兄。
  to: 你们可以把他们遗留给你们身后的儿子[a]，作为世代相传的产业；你们可以使他们服劳役。但对你们的弟兄，就是以色列人[b]，谁也不可严厉地辖制自己的弟兄。
  rationale: 修订仅消除“承受的产业”的汉语歧义，并使同位语结构更清晰。“世代相传的产业”在本法律语境中表达了לָרֶשֶׁת אֲחֻזָּה与לְעוֹלָם所指的可继承、持续占有；没有淡化文本所述的财产与强制劳役现实。
