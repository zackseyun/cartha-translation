  naturalness: “使他们永久成为承受的产业”不符合现代汉语通常搭配；改为“作为世代相传的产业”可清晰表达其作为可继承财产的法律地位。“弟兄，就是以色列人”也比无停顿的“弟兄以色列人”更自然明确。
  terminology: 保留“弟兄”“产业”“服劳役”“严厉地辖制”等正式法律语体用语。脚注说明男性亲属词的原文形式，且不将其不必要地中性化。
