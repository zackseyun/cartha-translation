  text: וַ/יְדַבֵּ֤ר יְהוָה֙ אֶל מֹשֶׁ֔ה בְּ/הַ֥ר סִינַ֖י לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/001.yaml
  text: And Yahweh spoke to Moses on Mount Sinai[a], saying,
translation:
  language: zh_hans
  text: 雅威[a]在西奈山对摩西说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文：YHWH（四字神名）；传统上也译作“耶和华”。
    reason: 说明原文四字神名的形式，并列出中文传统译名。
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: 说
  rationale: 该动词意为“说、讲话”；在现代汉语中，“对摩西说”自然地表达其受事关系。句首的 waw 在此承接叙事，汉语无须机械译作“并且”。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文读者熟悉的专名“耶和华”译出四字神名，不以称号替代；脚注说明其希伯来文形式及另一常见音译。
- source_word: אֶל מֹשֶׁה
  choice: 对摩西
  rationale: 介词 אֶל 标示说话的对象，译作“对摩西”准确且符合现代汉语习惯。
- source_word: בְּהַר סִינַי
  choice: 在西奈山
  rationale: 介词 בְ 在这里表示地点；“在西奈山”保留原文对讲话地点的陈述，不额外限定为山顶或山脚。
- source_word: לֵאמֹר
  choice: 说：
  rationale: 该不定式引出下文直接话语。汉语用“说：”及冒号自然地保留其前引功能。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名，正文因此采用中文传统且广为人知的专名“耶和华”，而不是以“主”这一称号替代；脚注保留另一常见音译“雅威”，不把具体古代读音视为完全确定。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。语序调整为“地点—对象—谓语”，使单节中文流畅；冒号承接下一节的神谕内容。
