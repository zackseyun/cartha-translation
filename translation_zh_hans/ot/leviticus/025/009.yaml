base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/009.yaml
  text: Then you shall sound a trumpet blast in the seventh month[a], on the tenth day of the month[b]. On the Day of Atonement you shall sound the trumpet throughout all your land.
translation:
  language: zh_hans
  text: 你要在第七个月初十吹响号角[a]，发出响亮的号声。赎罪日[b]，你们要在你们全地吹响号角。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “号角”：希伯来语为 shofar，指角制的吹奏乐器，传统上常理解为羊角号。
    reason: lexical_alternative
  - marker: b
    text: “赎罪日”：希伯来语字面为“赎罪之日”；其中“赎罪”一词为复数形式。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַעֲבַרְתָּ
  choice: 你要……使号角发出响声
  rationale: 使役式字面为“使……经过”，与号角连用时指使号声传出；此处用自然中文表达，并保留单数命令所指的代表性执行者。
- source_word: שׁוֹפַר תְּרוּעָה
  choice: 使号角发出响声
  rationale: שׁוֹפַר 是角制吹奏乐器，תְּרוּעָה 指响亮的信号声；合译既表达乐器，也表达鸣响的动作和效果。
- source_word: בַּחֹדֶשׁ הַשְּׁבִיעִי
  choice: 在第七个月
  rationale: 按原文直译月份序数，不擅自换算现代历法。
- source_word: בֶּעָשׂוֹר לַחֹדֶשׁ
  choice: 本月初十
  rationale: 希伯来语意为“该月的第十日”；“本月初十”是简洁自然的现代汉语日期表达。
- source_word: בְּיוֹם הַכִּפֻּרִים
  choice: 赎罪日
  rationale: 这是该礼仪日的通行中文名称；原文 כִּפֻּרִים 在形态上为复数，其形式差异以脚注说明。
- source_word: תַּעֲבִירוּ שׁוֹפָר
  choice: 你们要……吹响号角
  rationale: 同一使役动词在此为复数；“吹响号角”自然表达使号声传遍全地的意思。
- source_word: בְּכָל אַרְצְכֶם
  choice: 在你们全地
  rationale: 准确表达范围涵盖以色列人全部疆土，而不额外解释其政治或地理边界。
theological_decisions:
- issue: יוֹם הַכִּפֻּרִים 的译法
  choice: 赎罪日
  alternative: 赎罪之日／诸赎罪之日
  rationale: 采用现代中文中明确、通行的礼仪日名称，同时借脚注保留希伯来语复数形式，避免用生硬直译预先界定其神学含义。
translation_notes:
  register: 采用现代、庄重且易懂的经文语体。“就是”表明“本月初十”具体说明第七个月的日期；前半句保留单数“你”，后半句保留复数“你们”，反映希伯来文人称数目的变化。所有脚注标记均置于相应正文词语之后。
