  text: אוֹ דֹד֞/וֹ א֤וֹ בֶן דֹּד/וֹ֙ יִגְאָלֶ֔/נּוּ אֽוֹ מִ/שְּׁאֵ֧ר בְּשָׂר֛/וֹ מִ/מִּשְׁפַּחְתּ֖/וֹ יִגְאָלֶ֑/נּוּ אֽוֹ הִשִּׂ֥יגָה יָד֖/וֹ וְ/נִגְאָֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/049.yaml
  text: or his uncle[a], or his uncle’s son, may redeem him; or one of his close blood relatives from his clan may redeem him; or if his hand prospers[b], he may redeem himself.
translation:
  language: zh_hans
  text: 或是他的伯叔，或是他伯叔的儿子[a]，可以赎他；或是他宗族中的骨肉近亲，可以赎他；或是他自己有了足够的财力[b]，他就可以赎回自己。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“他伯叔的儿子”；可概称为他的男性堂表亲。
    reason: lexical_alternative
  - marker: b
    text: 原文直译近于“他的手达到（所需）”；这是指他获得了足够的财力。
    reason: lexical_alternative
lexical_decisions:
- source_word: דֹדוֹ
  choice: 他的伯叔
  rationale: 在本段亲属赎回的法律语境中，דּוֹד 指叔伯一类的男性长辈亲属，而不是“所爱的人”。“伯叔”比单用“叔叔”更能避免无根据地限定长幼。
- source_word: בֶן דֹּדוֹ
  choice: 他伯叔的儿子[a]
  rationale: 按希伯来语直译为“伯叔的儿子”，即堂兄弟；正文保留原文明确的亲属关系，脚注说明现代汉语中的自然称谓。
- source_word: יִגְאָלֶנּוּ
  choice: 可以赎他
  rationale: גאל 在此指近亲履行赎回义务或权利。“赎”保留本章反复出现的法律—神学关键词；“可以”表达此处所列赎回途径，不把未完成式强解为绝对命令。
- source_word: מִשְּׁאֵר בְּשָׂרוֹ
  choice: 骨肉近亲
  rationale: 原文以“肉身”关系表达血缘上的亲近。“骨肉近亲”既保留身体性的亲属意象，也符合现代汉语。
- source_word: מִמִּשְׁפַּחְתּוֹ
  choice: 他宗族中的
  rationale: מִשְׁפָּחָה 在以色列社会结构中通常指比核心家庭更广的亲属群体；“宗族”比“家庭”更贴切。
- source_word: הִשִּׂיגָה יָדוֹ
  choice: 他的手有了能力[b]
  rationale: 原文直译近于“他的手达到／够得着”，是取得足够经济能力的惯用语。正文保留“手”的意象，同时用“有了能力”使含义在汉语中可理解，脚注补明其经济意义。
- source_word: וְנִגְאָל
  choice: 他就可以赎回自己
  rationale: 形式上可理解为“他被赎回”，但在他本人已有足够财力的语境中，实际意义是自行付出赎价。“赎回自己”是自然且符合上下文的汉语表达。
theological_decisions:
- issue: 亲属赎回术语 גאל 的译法
  choice: 在本节统一译作“赎／赎回”
  alternative: 买回；赎买
  rationale: “赎”能维持本章 גאל 词群的概念连续性，也不把其意义缩减为普通商业交易。
- issue: הִשִּׂיגָה יָדוֹ 的手之意象
  choice: 译作“他的手有了能力”并加脚注
  alternative: 他富裕起来；他有了足够的钱财
  rationale: 保留原文具体意象，同时借脚注说明这是拥有足够财力的惯用表达，避免正文成为纯解释性改写。
- issue: וְנִגְאָל 的语态与实际所指
  choice: 按语境译作“他就可以赎回自己”
  alternative: 他就被赎回
  rationale: 希伯来语形式本身不是显式反身式，但前句的主语是本人取得能力，因此上下文指向自赎；译文保留“可以”，不额外引入强制性义务。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“伯叔”“宗族”“骨肉近亲”保留古代亲属制度的层次，但普通读者仍可理解；句式沿用原文逐项列举的法律文体。
