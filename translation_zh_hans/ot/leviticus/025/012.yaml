id: LEV.25.12
reference: Leviticus 25:12
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כִּ֚י יוֹבֵ֣ל הִ֔וא קֹ֖דֶשׁ תִּהְיֶ֣ה לָ/כֶ֑ם מִן הַ֨/שָּׂדֶ֔ה תֹּאכְל֖וּ אֶת תְּבוּאָתָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/012.yaml
  text: For it is a jubilee; it shall be holy to you[a]. From the field you shall eat its produce.
translation:
  language: zh_hans
  text: 因为这是禧年；这一年对你们来说应当是圣的。你们要吃田地里的出产[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“收成”或“产物”。希伯来语指田地所生出的东西。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 在上下文中引出前一条禁令的理由；“因为”自然地保留了解释性的因果关系。
- source_word: יוֹבֵל
  choice: 禧年
  rationale: 本章所指的是第五十年的特殊年份，而不是“公羊角”；“禧年”是现代中文圣经语境中清楚而通行的对应词。
- source_word: קֹדֶשׁ תִּהְיֶה לָכֶם
  choice: 这一年对你们来说应当是圣的
  rationale: 保留“圣”的盟约与分别为圣含义，并明确阴性代词所指的是禧年；“对你们来说”对应 לָכֶם，不将其弱化为一般意义上的“特别”。
- source_word: מִן הַשָּׂדֶה
  choice: 田地里的
  rationale: 以自然中文表达从田地直接取得食物的来源关系，同时不增添有关收割或储存的解释。
- source_word: תֹּאכְלוּ
  choice: 你们要吃
  rationale: 在律法语境中表达指示性或规范性的未完成式，比单纯的许可语气“可以吃”更贴近原文。
- source_word: תְּבוּאָתָהּ
  choice: 田地里的出产
  rationale: 指田地所生出的东西；“出产”范围较广，能够涵盖禧年中土地自然长出的可食之物。
theological_decisions:
- issue: 禧年的圣洁性质
  choice: 这一年对你们来说应当是圣的
  alternative: 你们要以这一年为圣／这一年对你们来说是神圣的
  rationale: 原文把“圣”述说为禧年的性质，并说明它与以色列人的关系。“应当是圣的”保留法律语境中的规范意味，也不把圣洁仅仅解释为礼仪性或社会性的特殊安排。
translation_notes:
  register: 采用现代、庄重而易懂的律法文体。“禧年”和“圣”保留关键宗教术语；分号反映原文两句之间紧密的解释关系。脚注标记置于其实际说明的“出产”之后。
