  text: וְ/חִשַּׁב֙ עִם קֹנֵ֔/הוּ מִ/שְּׁנַת֙ הִמָּ֣כְר/וֹ ל֔/וֹ עַ֖ד שְׁנַ֣ת הַ/יֹּבֵ֑ל וְ/הָיָ֞ה כֶּ֤סֶף מִמְכָּר/וֹ֙ בְּ/מִסְפַּ֣ר שָׁנִ֔ים כִּ/ימֵ֥י שָׂכִ֖יר יִהְיֶ֥ה עִמּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/050.yaml
  text: He shall calculate with his buyer from the year he sold himself to him until the year of jubilee[a], and the price of his sale shall be according to the number of years[b]; like the days of a hired worker he shall be with him.
translation:
  language: zh_hans
  text: 他要同买他的人核算：从他卖身给那人的那一年起，到禧年[a]为止；他卖身的价银要按年数计算；他在那人那里要像雇工一样[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“到禧年之年为止”。
    reason: 对应“禧年之年”的形式化译法；正文采用中文通行的“禧年”。
  - marker: b
    text: 或译“像雇工的日子一样”。这里以雇工的服务作为比较。
    reason: 说明“雇工的日子”的较直译表达，同时不把该比较扩展为原文未明说的制度性结论。
lexical_decisions:
- source_word: וְחִשַּׁב עִם קֹנֵהוּ
  choice: 他要跟买他的人计算
  rationale: חשׁב在赎价法规中指财务核算；“跟……计算”既保留עִם的共同核算意味，也符合现代汉语法律语境。
- source_word: מִשְּׁנַת הִמָּכְרוֹ לוֹ
  choice: 从他卖身给对方的那一年起
  rationale: 该形式本身可较形式化地理解为“从他被卖给对方的那一年”，但上下文表明此人因贫困而自卖；正文采用自然的反身表达“卖身”，不改变其受约束的处境。
- source_word: עַד שְׁנַת הַיֹּבֵל
  choice: 直到禧年
  rationale: “禧年”是该制度在现代中文圣经语境中的通行名称，简洁地对应希伯来语专门用语。
- source_word: כֶּסֶף מִמְכָּרוֹ
  choice: 他卖身所得的价银
  rationale: כֶּסֶף字面为“银子、钱”；在此指交易所确定的金额。“价银”保留古代银钱背景，又清楚表达赎价核算的基础。
- source_word: בְּמִסְפַּר שָׁנִים
  choice: 按照年数计算
  rationale: 该短语以年数作为金额核算标准；补出“计算”使中文句意完整，并承接句首的财务核算。
- source_word: כִּימֵי שָׂכִיר יִהְיֶה עִמּוֹ
  choice: 他在对方那里的年日，要像雇工的年日一样
  rationale: 保留“年日”的比较结构及יִהְיֶה עִמּוֹ“在他那里”的关系，说明其服务期限按雇工年期看待，而非永久归属。
theological_decisions:
- issue: 卖身者与买主之间的法律身份
  choice: 用“卖身”与“像雇工的年日一样”表达受约束的劳役及按年核价
  alternative: 将其直接称为“奴隶”或把末句解释为现代雇佣关系
  rationale: 原文使用买卖语言，同时以雇工的年日作为估价类比；译文保留两者之间的张力，不把古代制度等同于永久所有权，也不将其现代化。
translation_notes:
  register: 采用现代、庄重而易懂的法律叙述语体。“买他的人”比“买主”更直接保留人的宾语关系；以“对方”避免连续重复“他”所造成的指代混乱。正文保留希伯来语末句略显凝练的比较结构，同时调整为自然汉语。
