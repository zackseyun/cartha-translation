  text: וְ/לֹ֤א תוֹנוּ֙ אִ֣ישׁ אֶת עֲמִית֔/וֹ וְ/יָרֵ֖אתָ מֵֽ/אֱלֹהֶ֑י/ךָ כִּ֛י אֲנִ֥י יְהֹוָ֖ה אֱלֹהֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/017.yaml
  text: And no man shall oppress his neighbor[a], but you shall fear your God, for I am Yahweh your God.
translation:
  language: zh_hans
  text: 你们不可彼此欺压[a]，却要敬畏你的上帝，因为我是雅威，你们的上帝。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“亏待”或“占便宜”。这里的希伯来语动词可指在社会或经济往来中不公平地利用别人。
    reason: lexical_alternative
lexical_decisions:
- source_word: תוֹנוּ
  choice: 欺压
  rationale: 使役式在本章买卖、赎回与禧年条例的社会经济语境中，指亏待别人或占人便宜。“欺压”保留其严肃的伦理力度；脚注列出较宽泛的可能译法。
- source_word: אִישׁ אֶת־עֲמִיתוֹ
  choice: 彼此
  rationale: 希伯来语直译为“各人对他的同伴”，具有相互、分配性的群体规范功能。现代汉语用“彼此”自然简洁，不把男性语法形式误解为只适用于男子。
- source_word: עֲמִיתוֹ
  choice: 同伴（含于“彼此”）
  rationale: עָמִית指共同体中的同伴、同胞或社会关系中的对方；在“彼此”中自然表达其人际关系含义。
- source_word: וְיָרֵאתָ
  choice: 却要敬畏
  rationale: וְ形式上是“并且”，此处在禁令与正面命令之间具有对照作用；“却要”在汉语中清楚表达这种转折而不过度释义。
- source_word: מֵאֱלֹהֶיךָ
  choice: 敬畏你的上帝
  rationale: 介词 מִן 跟在 ירא 后标示敬畏的对象；汉语习惯直接说“敬畏你的上帝”。单数后缀对应紧接着对个体的命令。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以汉语圣经传统中通行的专名形式音译四字神名，而不以“主”这一称号代替。
- source_word: אֱלֹהֵיכֶם
  choice: 你们的上帝
  rationale: 复数后缀转向整个立约群体；译文保留从单数“你的”到复数“你们的”的变化。
- source_word: כִּי
  choice: 因为
  rationale: 保留该词引出命令依据的因果功能。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威；上主
  rationale: 原文明确使用四字神名。正文采用现代汉语读者最熟悉的专名“耶和华”，不以称号“上主”替代；“雅威”是另一种较接近学术重构读音的译法。
- issue: אִישׁ 的代表性阳性表达
  choice: 以“彼此”表达分配性关系
  alternative: 任何人都不可欺压自己的同伴；各人不可欺压同伴
  rationale: אִישׁ在“各人对其同伴”的结构中具有分配性，并非把禁令限定为男性。汉语“彼此”忠实传达共同体成员相互之间的义务，同时避免生硬或产生错误的性别限制。
- issue: 命令对象的数变化
  choice: 保留“你的”与“你们的”的单复数转换
  alternative: 全句统一译作“你们的”
  rationale: 原文 וְיָרֵאתָ 与 אֱלֹהֶיךָ 为第二人称阳性单数，而 אֱלֹהֵיכֶם 为复数。保留变化可呈现个体责任与群体身份并置的张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“不可……却要……”清楚呈现禁令与正面命令的对照；破折号突出立约宣告，同时保留原文末尾从单数对象到复数群体的转换。
