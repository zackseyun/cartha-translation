  text: But if few years remain until the Year of Jubilee, then he shall calculate with him; according to his years he shall repay his redemption.
translation:
  language: zh_hans
  text: 如果离禧年只剩不多的年数，就要同他核算；他要按所剩的年数偿还赎价[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“偿还赎回的价款。”原文所指的是为赎回他而需支付的金额，并非抽象意义上的“救赎”。
    reason: lexical_alternative
lexical_decisions:
- source_word: מְעַט נִשְׁאַר בַּשָּׁנִים
  choice: 只剩下不多的年数
  rationale: מְעַט与“年数”连用，表示余下的年份不多；这样表达既贴近原文，也符合现代汉语习惯。
- source_word: שְׁנַת הַיּוֹבֵל
  choice: 禧年
  rationale: 这是利未记25章所设立制度的通行中文名称，简洁且准确。
- source_word: וְחִשַּׁב לוֹ
  choice: 就要同他计算
  rationale: חִשַּׁב在此法律和经济语境中指核算；“同他”保留了לוֹ所体现的双方结算关系。
- source_word: כְּפִי שָׁנָיו
  choice: 按所剩的年数
  rationale: כְּפִי表示依照或按比例。结合上下文，所依据的是到禧年为止余下的年数；补出“所剩的”使中文指向清楚。
- source_word: יָשִׁיב אֶת גְּאֻלָּתוֹ
  choice: 付清自己的赎价
  rationale: יָשִׁיב在此表示偿付，גְּאֻלָּה指为获得释放而付的赎回款项，而不是抽象意义上的“救赎”；“赎价”自然传达其经济含义。
