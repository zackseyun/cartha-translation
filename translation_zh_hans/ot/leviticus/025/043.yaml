  text: לֹא תִרְדֶּ֥ה ב֖/וֹ בְּ/פָ֑רֶךְ וְ/יָרֵ֖אתָ מֵ/אֱלֹהֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/043.yaml
  text: You shall not rule over him harshly[a], but you shall fear your God.
translation:
  language: zh_hans
  text: 不可严酷地辖制他[a]，却要敬畏你的上帝。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“用严厉的手段辖制他”“残酷地辖制他”。希伯来语这个词表示严厉、压迫、使人不堪承受的对待。
    reason: lexical_alternative
lexical_decisions:
- source_word: תִרְדֶּה
  choice: 辖制
  rationale: רדה表示施行统治或管辖；在本节关于以色列同胞服役的律法语境中，“辖制”既保留权力关系，也避免把意思弱化为一般的“使唤”。
- source_word: בּוֹ
  choice: 他
  rationale: 阳性单数代词回指前文服役的以色列同胞；其介词关系在汉语中由“辖制他”自然表达。
- source_word: בְּפָרֶךְ
  choice: 严酷地
  rationale: פָרֶךְ指严厉、压迫甚至使人不堪承受的对待；“严酷地”自然修饰“辖制”，同时不必过度强化为“残忍无情地”。
- source_word: וְיָרֵאתָ
  choice: 却要敬畏
  rationale: 连接词形式上是“和”，但紧接禁令时具有语义上的对照作用；“却要”清楚表达不可严酷辖制、反要敬畏上帝的伦理关系。
- source_word: מֵאֱלֹהֶיךָ
  choice: 你的上帝
  rationale: 介词מִן与ירא连用时标示敬畏的对象；现代汉语自然译为“敬畏你的上帝”，并保留第二人称所属关系。
theological_decisions:
- issue: 末句作为伦理动机还是并列命令
  choice: 用“却要敬畏你的上帝”表达敬畏上帝对人如何运用权力形成约束。
  alternative: 较形式对应地译为“并要敬畏你的上帝”。
  rationale: 希伯来语连接词本身可作普通并列，但在禁止严酷辖制之后，语境形成明显对照；“却要”保留这种伦理张力，而不增添宗派性解释。
translation_notes:
  register: 采用现代、庄重而易懂的律法语体。“不可……却要……”保留命令的力度和两分结构；“辖制”准确但不生僻，“严酷地”传达压迫性而避免无根据地强化。
