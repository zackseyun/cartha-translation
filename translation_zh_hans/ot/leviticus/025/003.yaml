base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/003.yaml
  text: For six years you shall sow your field[a], and for six years you shall prune your vineyard and gather its produce.
translation:
  language: zh_hans
  text: 六年里，你要在你的田地里播种；六年里，你要修剪你的葡萄园，并收取这地的出产[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “出产”也可译作“收成”。希伯来语所指较广，可包括土地的各种农产。
    reason: 保留 תְּבוּאָה 的宽泛农业含义及可行译法。
lexical_decisions:
- source_word: שֵׁשׁ שָׁנִים
  choice: 六年之内
  rationale: 这是表示持续时段的宾格用法；“六年之内”自然地表达这些农事在六年期间进行。
- source_word: תִּזְרַע שָׂדֶךָ
  choice: 你要在田里播种
  rationale: תִּזְרַע 在律法语境中具有指令意味；שָׂדֶה 指耕作的田地。“在田里播种”符合现代汉语习惯，也保留原文的农业含义。
- source_word: תִּזְמֹר כַּרְמֶךָ
  choice: 你要修剪葡萄园
  rationale: זמר 用于葡萄园时特指修剪葡萄藤；“修剪葡萄园”是简明、自然的汉语表达。
- source_word: וְאָסַפְתָּ
  choice: 收取
  rationale: אָסַף 的基本意思是聚集、收取；这里指收取农产，未将其窄化为某一种收割方式。
- source_word: תְּבוּאָתָהּ
  choice: 那地的出产
  rationale: תְּבוּאָה 泛指土地所产之物；阴性单数后缀最自然地回指上文的“地”（הָאָרֶץ，利25:2），而非阳性的“葡萄园”（כֶּרֶם）。“那地的出产”既体现语法指向，也保留词义的广度。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的律法语体。“你要”传达希伯来语未完成式在此处的规定性功能，避免使用过于古雅的“你必”。两个“六年之内”保留原文的平行与强调。
