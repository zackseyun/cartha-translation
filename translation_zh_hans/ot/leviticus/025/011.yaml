  text: יוֹבֵ֣ל הִ֗וא שְׁנַ֛ת הַ/חֲמִשִּׁ֥ים שָׁנָ֖ה תִּהְיֶ֣ה לָ/כֶ֑ם לֹ֣א תִזְרָ֔עוּ וְ/לֹ֤א תִקְצְרוּ֙ אֶת סְפִיחֶ֔י/הָ וְ/לֹ֥א תִבְצְר֖וּ אֶת נְזִרֶֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/011.yaml
  text: It is a Jubilee[a]; the fiftieth year shall be for you. You shall not sow, and you shall not reap its volunteer growth[c][b], and you shall not gather the grapes of its unpruned vines.
translation:
  language: zh_hans
  text: 这是禧年，是你们的第五十年。你们不可播种，也不可收割自行长出的作物[a]，也不可采摘未修剪的葡萄树所结的葡萄[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“自生的作物”。
    reason: lexical_alternative
  - marker: b
    text: 原文指未加整治、任其生长的葡萄藤所产的葡萄；这里的动词专指采摘葡萄。
    reason: lexical_ambiguity
lexical_decisions:
- source_word: יוֹבֵל
  choice: 禧年
  rationale: 在利未记25章的制度性语境中，指每逢第五十年所设的特殊年份，而不是字面意义上的公羊角；“禧年”是现代中文圣经语境中通行且易懂的名称。
- source_word: שְׁנַת הַחֲמִשִּׁים שָׁנָה
  choice: 第五十年
  rationale: 以自然的现代汉语表达希伯来语的序数年份结构。
- source_word: תִּהְיֶה לָכֶם
  choice: 要成为你们的禧年
  rationale: 结合前句的谓语“禧年”补出中文所需成分，保留“对你们／属于你们”的关系，同时避免“要为你们”在中文中的含混。
- source_word: לֹא תִזְרָעוּ
  choice: 你们不可播种
  rationale: “不可”适合律法禁令的庄重语体，并准确表达否定性命令。
- source_word: לֹא תִקְצְרוּ
  choice: 也不可收割
  rationale: 保留谷物收获动词与后文采摘葡萄的区别。
- source_word: סְפִיחֶיהָ
  choice: 自生的庄稼
  rationale: 指未经播种而自行长出的作物；“自生的庄稼”比技术性较强的说法更适合普通现代读者。
- source_word: לֹא תִבְצְרוּ
  choice: 也不可摘取
  rationale: 该动词专用于采收葡萄；“摘取”自然体现这一农业动作，并与“收割”有别。
- source_word: נְזִרֶיהָ
  choice: 未修剪的葡萄树所结的葡萄
  rationale: 该词在此处指被留置、不加整治的葡萄树或其出产；结合专指采摘葡萄的动词，将隐含的果实明确译出，使中文自然，又保留“不加修剪”的农业含义。
theological_decisions:
- issue: 开头两分句的关系
  choice: 保留“这是禧年”这一独立宣告，随后说明第五十年要成为他们的禧年
  alternative: 合并为“第五十年要作你们的禧年”
  rationale: 希伯来文先有明确的名词谓语宣告“这是禧年”，再提“第五十年”；分作两句能较好保留原文的强调和句法张力，虽在第二句为汉语清晰度补出“禧年”。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“不可”维持律法文本的规范语气；“播种—收割—摘取”清楚区分不同农业动作。开头保留原文先宣告、后说明第五十年的结构。
