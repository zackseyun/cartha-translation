source:
  edition: WLC
  text: וְ/כִ֣י תַשִּׂ֗יג יַ֣ד גֵּ֤ר וְ/תוֹשָׁב֙ עִמָּ֔/ךְ וּ/מָ֥ךְ אָחִ֖י/ךָ עִמּ֑/וֹ וְ/נִמְכַּ֗ר לְ/גֵ֤ר תּוֹשָׁב֙ עִמָּ֔/ךְ א֥וֹ לְ/עֵ֖קֶר מִשְׁפַּ֥חַת גֵּֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/047.yaml
  text: If the means of a resident foreigner among you become sufficient[a], and your brother beside him becomes poor and sells himself to the resident foreigner among you, or to a member of the foreigner’s clan,
translation:
  language: zh_hans
  text: 如果你们中间寄居的外族人经济宽裕起来，而你在他身边的弟兄却陷入贫困，把自己卖给你们中间寄居的外族人，或卖给外族人家族中的一员[a]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“寄居者家族的支系（或根株）”。这里的希伯来语含义较难确定；正文按语境译为“家族中的一员”。
    reason: 保留עֵקֶר מִשְׁפַּחַת גֵּר的词义疑难和可能的较直译表达。
lexical_decisions:
- source_word: תַשִּׂיג יַד
  choice: 经济宽裕起来
  rationale: 这个习语直译为“手达到”，在此表示经济能力增强、财力充足；译文用现代汉语清楚表达其经济含义，并保留状态变化。
- source_word: גֵּר וְתוֹשָׁב
  choice: 寄居的外族人
  rationale: 两个词共同描写住在以色列群体中的非本族居民；合译既体现其外来者身份，也体现其定居性质，避免生硬地拆成两类。
- source_word: וּמָךְ
  choice: 陷入贫困
  rationale: 该动词表示境况衰落而变穷；“陷入贫困”自然地传达这一变化。
- source_word: אָחִיךָ
  choice: 你的弟兄
  rationale: 保留原文的亲属称谓及其盟约群体中的伦理力度；上下文所指是同族的以色列人。
- source_word: עִמּוֹ
  choice: 在他身边
  rationale: 保留原文“与他同在、在他那里”的关系表达，不把其具体含义过度限定为雇佣、隶属或单纯比较。
- source_word: וְנִמְכַּר
  choice: 把自己卖给
  rationale: Niphal形式可作被动理解，但本章债务贫困的法律语境容许反身含义；“把自己卖给”符合现代汉语，也说明是因贫困进入服役关系。
- source_word: לְעֵקֶר מִשְׁפַּחַת גֵּר
  choice: 外族人家族中的一员
  rationale: עֵקֶר在此含义困难，可能指家族的根株、支系或其中成员；正文采用语境上通顺而不过度具体化的表达，并以脚注保留词义疑难。
theological_decisions:
- issue: 以色列社会律法中的亲属称谓
  choice: 你的弟兄
  alternative: 你的同胞／你的族人
  rationale: 直译“弟兄”保留律法所赋予同族关系的家庭性和伦理力度，而不将其简化为公民身份。
- issue: וְנִמְכַּר所描述的出售性质
  choice: 把自己卖给
  alternative: 被卖给
  rationale: 上下文讲贫困者因经济困境进入服役关系；反身译法符合该法律情境，但不额外界定其所有制度细节。
- issue: גֵּר וְתוֹשָׁב是一个复合身份还是两类人
  choice: 寄居的外族人
  alternative: 寄居者和暂住者
  rationale: 在本句中两个称谓共同限定一个单数经济主体，合译能自然表达定居于群体中的外来者；同时避免无根据地断定为两个不同群体。
translation_notes:
  register: 采用现代、庄重而易懂的法律叙述语体。句末保留逗号，因为本节在句法和内容上延续到下一节。脚注标记置于真正存在词义疑难的末尾短语之后。
