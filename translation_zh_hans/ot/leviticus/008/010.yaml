base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/010.yaml
  text: Then Moses took the anointing oil and anointed the tabernacle and all that was in it[a], and consecrated them.
translation:
  language: zh_hans
  text: 随后，摩西拿了膏油，膏抹帐幕和其中的一切，把它们分别为圣。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“使它们成为圣洁”或“使它们成圣”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: 随后，摩西拿来
  rationale: 叙事性连续式推动事件发展；“随后”自然表达先后关系，“拿来”符合摩西取用膏油的语境。
- source_word: שֶׁמֶן הַמִּשְׁחָה
  choice: 膏油
  rationale: 这是用于膏抹的油；“膏油”是现代中文圣经语境中简洁、明确的礼仪用语，原文此处并未另加“圣”字。
- source_word: וַיִּמְשַׁח
  choice: 膏抹
  rationale: 保留把油用于对象之上的礼仪行为及其分别为圣的含义，比泛化为“涂抹”更贴合祭司礼仪语境。
- source_word: הַמִּשְׁכָּן
  choice: 帐幕
  rationale: 准确指向《出埃及记—利未记》中作为圣所的会幕建筑；“帐幕”简洁而庄重。
- source_word: כָּל אֲשֶׁר בּוֹ
  choice: 其中所有的一切
  rationale: 完整表达帐幕内全部物件或陈设，不把原文未逐项说明的对象具体化。
- source_word: וַיְקַדֵּשׁ אֹתָם
  choice: 并使它们成为圣洁
  rationale: קדשׁ在此指在礼仪中使帐幕及其中物件归为圣、分别出来；该译法保留“成为圣”的核心语义，复数“它们”也对应帐幕与其中一切。
theological_decisions:
- issue: 祭司礼仪语境中קדשׁ的译法
  choice: 使它们成为圣洁
  alternative: 把它们分别为圣／使它们成圣
  rationale: 原文既可强调使对象成为圣，也可从功能上理解为分别归圣。正文采用直接表达圣洁状态的译法，并以脚注保留常见的礼仪性表达，避免把两者的细微张力静默消除。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“膏油、膏抹、帐幕”保留祭司礼仪的关键术语；句式按希伯来叙事顺序展开，同时避免生硬直译。
