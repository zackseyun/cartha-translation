base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/026.yaml
  text: And from the basket of unleavened bread that was before Yahweh[a], he took one unleavened cake, one cake of bread with oil, and one wafer, and put them on the fat portions and on the right thigh.
translation:
  language: zh_hans
  text: 他从摆在雅威面前、盛着无酵饼的篮子里，取出一个无酵饼、一个用油制备的饼[a]和一个薄饼，把它们放在脂肪部分和右腿上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“一个与油调制的饼”。希伯来语表明这饼与油有关，但没有明确说明具体的制备方式。
    reason: 保留 חַלַּת לֶחֶם שֶׁמֶן 所指制备方式的词义不确定性。
lexical_decisions:
- source_word: מִסַּל הַמַּצּוֹת
  choice: 从……无酵饼篮子里
  rationale: 介词 מִן 表示来源；סַל 是篮子，מַצּוֹת 在此指篮中的无酵饼类供物。此译既保留具体礼仪物件，也符合现代汉语表达。
- source_word: אֲשֶׁר לִפְנֵי יְהוָה
  choice: 摆在雅威面前的
  rationale: לִפְנֵי 在礼仪语境中表示位于雅威面前、呈在他面前；补出“摆在”使修饰关系在汉语中清楚自然。
- source_word: חַלַּת מַצָּה אַחַת
  choice: 一个无酵饼
  rationale: חַלָּה 指饼或饼状面包，מַצָּה 表明不含酵；“无酵饼”是简洁明确的现代汉语礼仪用语。
- source_word: חַלַּת לֶחֶם שֶׁמֶן אַחַת
  choice: 一个用油做的饼
  rationale: 该短语表明这饼与油一同制备，却没有明说油是调入、抹上还是以其他方式使用；“用油做的”保留这种不确定性。
- source_word: רָקִיק אֶחָד
  choice: 一个薄饼
  rationale: רָקִיק 指薄而扁的饼；“薄饼”比“薄片”更清楚地表明这是饼类供物。
- source_word: הַחֲלָבִים
  choice: 脂肪块
  rationale: 复数形式在献祭语境中指从祭牲取出的指定脂肪部分，而不是泛指油脂；“脂肪块”保留其具体性。
- source_word: שׁוֹק הַיָּמִין
  choice: 右腿
  rationale: שׁוֹק 指祭牲的腿部肉块，具体范围可理解为腿、腿股或胫部；“右腿”自然且不过度限定解剖部位。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”较贴近学界通常采用的古希伯来语读音重构，并保留其作为专名的性质。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。以“取出……把它们放在……”清楚呈现连续的礼仪动作；避免使用过于古雅或宗派化的措辞。脚注标记放在它实际解释的“用油做的饼”之后。
