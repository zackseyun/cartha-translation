  text: וְ/אֶת הַ/פָּ֤ר וְ/אֶת עֹר/וֹ֙ וְ/אֶת בְּשָׂר֣/וֹ וְ/אֶת פִּרְשׁ֔/וֹ שָׂרַ֣ף בָּ/אֵ֔שׁ מִ/ח֖וּץ לַֽ/מַּחֲנֶ֑ה כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/017.yaml
  text: But the bull[a], along with its hide, its flesh, and its dung, he burned with fire outside the camp[b], just as Yahweh had commanded Moses.
translation:
  language: zh_hans
  text: 但他把公牛连同它的皮[a]、肉和粪[b]，都在营外用火烧了，正如雅威所吩咐摩西的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “皮”也可译作“外皮”。
    reason: lexical_alternative
  - marker: b
    text: “粪”也可译作“粪便”；希伯来语פֶּרֶשׁ特指排泄物，并非泛指废物。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַפָּר
  choice: 公牛
  rationale: פַּר指公牛或公牛犊；此处采用简明、自然的“公牛”，不把上下文中的赎罪祭信息增添进本节。
- source_word: עֹרוֹ
  choice: 它的皮
  rationale: עוֹר指动物的皮；“皮”在现代汉语中准确自然，也符合祭牲被分割处理的语境。
- source_word: בְּשָׂרוֹ
  choice: 肉
  rationale: בָּשָׂר在此指祭牲的肉体部分；汉语“肉”比“肉体”更自然，也没有“可供食用”的额外含义。
- source_word: פִּרְשׁוֹ
  choice: 粪
  rationale: פֶּרֶשׁ特指排泄物；“粪”直接保留了希伯来语具体而明确的意思，不泛化为“污物”或“废物”。
- source_word: שָׂרַף בָּאֵשׁ
  choice: 用火烧了
  rationale: 既表达שׂרף“焚烧”的动作，也保留בָּאֵשׁ“用火”的明示成分；措辞庄重而不生硬。
- source_word: מִחוּץ לַמַּחֲנֶה
  choice: 在营外
  rationale: 准确对应“营地之外”，并采用五经礼仪语境中简洁自然的说法。
- source_word: כַּאֲשֶׁר צִוָּה
  choice: 正如……吩咐……的
  rationale: כַּאֲשֶׁר强调行动完全依照命令；“正如”自然传达这种对应关系。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见音译呈现四字神名，保留其专名性质，不以“主”等称号替代。
- source_word: וְאֶת ... וְאֶת ... וְאֶת ... וְאֶת
  choice: 把公牛连同它的皮、肉和粪，都……
  rationale: 用“连同”和“都”自然呈现希伯来语反复连接并标示宾语所形成的累积列举。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；正文采用“雅威”作为较贴近学界重构读音的现代汉语音译，同时承认“耶和华”是汉语传统中的另一音译。
- issue: 是否把公牛明定为赎罪祭牲
  choice: 只译“公牛”
  alternative: 赎罪祭的公牛
  rationale: 上下文表明这是赎罪祭牲，但本节הַפָּר本身只说“公牛”；不在正文中补入本节未明说的祭类，以免消除原文的简洁表达。
translation_notes:
  register: 采用现代、庄重而易懂的祭仪叙事语言。宾语前置结构调整为自然汉语语序，并以“连同……都”保留原文列举的累积感；“但”体现本节与前文祭坛上焚烧部分之间的转折。
