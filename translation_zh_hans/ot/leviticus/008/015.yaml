  - severity: medium
    issue: “坛脚那里”较口语，且未充分表达יְסוֹד作为祭坛基部／底座的术语意义。
    rationale: “坛的底座”自然而准确地表达祭坛的基部，避免将其仅理解为“脚”。
  - severity: medium
    issue: “为坛赎罪”在汉语中容易使读者理解为祭坛本身犯了道德意义上的罪。
    rationale: 原文כפר על祭坛指向祭祀性的除污、净化／赎罪行为。译作“为坛行赎罪礼”保留核心术语，同时较清楚地标示其为礼仪行为。
