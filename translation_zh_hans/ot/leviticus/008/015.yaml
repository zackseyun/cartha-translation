  text: וַ/יִּשְׁחָ֗ט וַ/יִּקַּ֨ח מֹשֶׁ֤ה אֶת הַ/דָּם֙ וַ֠/יִּתֵּן עַל קַרְנ֨וֹת הַ/מִּזְבֵּ֤חַ סָבִיב֙ בְּ/אֶצְבָּע֔/וֹ וַ/יְחַטֵּ֖א אֶת הַ/מִּזְבֵּ֑חַ וְ/אֶת הַ/דָּ֗ם יָצַק֙ אֶל יְס֣וֹד הַ/מִּזְבֵּ֔חַ וַֽ/יְקַדְּשֵׁ֖/הוּ לְ/כַפֵּ֥ר עָלָֽי/ו־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/015.yaml
  text: And he slaughtered it, and Moses took the blood and put it on the horns of the altar all around with his finger, and he purified the altar, and he poured out the blood at the base of the altar and consecrated it to make atonement for it.
translation:
  language: zh_hans
  text: 摩西宰了公牛，取了血，用手指抹在坛的四角上，洁净了坛[a]；又把血倒在坛的底座，使坛成圣，为坛行赎罪礼[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“净化了坛”。这里的希伯来语动词指除去礼仪上的不洁，并不是说祭坛犯了罪。
    reason: lexical_alternative
  - marker: b
    text: “行赎罪礼”也可理解为“除去污秽”或“行洁净礼”。这里祭坛是这项礼仪所作用的对象。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁחָט
  choice: 宰了公牛
  rationale: שׁחט在献祭语境中指宰杀祭牲；宾语依上文补出为“公牛”，使中文指代清楚。
- source_word: קַרְנוֹת הַמִּזְבֵּחַ סָבִיב
  choice: 坛四周的角
  rationale: 保留祭坛凸起之“角”的礼仪术语，并以“四周”表达סָבִיב所含的周遍意义。
- source_word: בְּאֶצְבָּעוֹ
  choice: 用指头
  rationale: 准确表达单数名词及其工具意义，符合自然汉语。
- source_word: וַיְחַטֵּא אֶת־הַמִּזְבֵּחַ
  choice: 洁净了坛
  rationale: חטא的Piel形式在祭司礼仪语境中表示除去礼仪上的污秽、使之洁净，并非“使坛犯罪”。
- source_word: יָצַק אֶל־יְסוֹד הַמִּזְבֵּחַ
  choice: 把血倒在坛脚那里
  rationale: יְסוֹד字面可指根基，在祭坛结构中以“坛脚”更直观地表示坛的基部。
- source_word: וַיְקַדְּשֵׁהוּ
  choice: 使坛成为圣洁
  rationale: 表达קדשׁ使祭坛分别为圣、归于神圣用途的含义，语言庄重而易懂。
- source_word: לְכַפֵּר עָלָיו
  choice: 为坛赎罪
  rationale: 保留כפר这一核心祭祀术语的神学分量；“为坛”将祭坛明确呈现为礼仪作用的对象，同时不把具体机制解释得过窄。
theological_decisions:
- issue: 祭司礼仪语境中חטא的译法
  choice: 洁净了坛
  alternative: 为坛除罪污
  rationale: 这里不是说祭坛犯了罪，而是说借着血的礼仪除去其不洁；“洁净”清楚保留礼仪含义，也不引入后期教义体系。
- issue: 祭祀语境中כפר על的译法
  choice: 为坛赎罪
  alternative: 为坛行除污礼；在坛上施行赎罪礼
  rationale: “赎罪”延续希伯来文核心祭祀用语及其神学张力；脚注说明其也可侧重除污或洁净，避免把原文含义单一化。
translation_notes:
  register: 采用现代、庄重而易懂的礼仪叙述语体。“坛”“角”“赎罪”保留经文中的核心祭祀术语；句式按希伯来文动作次序展开，同时补明上文所指的“公牛”和后文所指的“坛”，以符合现代汉语表达。
