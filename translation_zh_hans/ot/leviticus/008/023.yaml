base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/023.yaml
  text: And he slaughtered it[a], and Moses took some of its blood and put it on the lobe of Aaron’s right ear, and on the thumb of his right hand, and on the big toe of his right foot.
translation:
  language: zh_hans
  text: 他把那只公绵羊宰了。摩西取了些羊血，抹在亚伦右耳的耳垂[a]上、右手的大拇指上和右脚的大脚趾上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “耳垂”或译“耳尖”。
    reason: 希伯来词 תְּנוּךְ 较罕见，可指耳朵外缘、末端或耳垂；正文采用较自然的“耳垂”，脚注保留另一合理译法。
lexical_decisions:
- source_word: וַיִּשְׁחָט
  choice: 他把那只公绵羊宰了
  rationale: 该动词在献祭语境中指礼仪性的宰杀；“宰”比泛指的“杀”更准确。宾语根据紧接上文的承接关系补出为“那只公绵羊”，使现代汉语表达清楚自然。
- source_word: מִדָּמוֹ
  choice: 取了些羊血
  rationale: 介词 מִן 表明从其血中取出一部分；“些”自然传达部分量，“羊血”则明确代词所指而不改变意义。
- source_word: תְּנוּךְ אֹזֶן
  choice: 耳垂
  rationale: 该罕见词组指耳朵外缘或末端部位；正文采用现代汉语中最清楚自然的“耳垂”，并以脚注保留“耳尖”这一可能译法。
- source_word: הַיְמָנִית
  choice: 右耳／右手／右脚
  rationale: 该阴性形容词分别限定耳、手和脚；按现代汉语习惯译作“右耳、右手、右脚”。
- source_word: בֹּהֶן יָדוֹ
  choice: 右手的大拇指
  rationale: בֹּהֶן 用于手时特指拇指；“大拇指”是普通现代汉语中明确自然的说法。
- source_word: בֹּהֶן רַגְלוֹ
  choice: 右脚的大脚趾
  rationale: בֹּהֶן 用于脚时特指大脚趾，译文保留了原文的解剖部位精确性。
- source_word: וַיִּתֵּן עַל
  choice: 抹在……上
  rationale: 在将祭牲血施于身体部位的礼仪语境中，“抹在”比机械直译“放在”更自然准确，同时没有加入原文未明说的象征解释。
theological_decisions:
- issue: 把祭牲的血施在亚伦身体末端部位的礼仪意义
  choice: 只如实叙述礼仪动作，不在正文中解释其象征意义
  alternative: 在正文中明说这是分别为圣、洁净或象征听从、服事与行走
  rationale: 希伯来文本在本节只记述摩西所做的动作，并未解释各身体部位的象征意义；译文因此保留叙述本身，不导入特定神学阐释。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。“宰了”承接献祭语境；分成两句以避免首句连续动作造成拗口。“羊血”按近距离语境明确所指。正文中的脚注标记 [a] 与脚注完全对应。
