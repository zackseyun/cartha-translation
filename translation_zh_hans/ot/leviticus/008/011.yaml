base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/011.yaml
  text: He sprinkled some of it on the altar seven times[a], and he anointed the altar and all its utensils, and the basin and its stand[b], to consecrate them.
translation:
  language: zh_hans
  text: 他把一些膏油洒在祭坛上七次[a]，又膏抹祭坛和祭坛的一切器具，以及洗濯盆和盆座[b]，使它们分别为圣。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文作“从其中（洒）”，其中“其中”指上下文所说的膏油。
    reason: lexical_alternative
  - marker: b
    text: “盆座”也可译作“底座”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּז
  choice: 洒
  rationale: 该词在使役形和礼仪语境中表示将液体洒出；“洒”简明自然，也保留仪式动作。
- source_word: מִמֶּנּוּ
  choice: 把一些膏油
  rationale: 希伯来文直译为“从它”，所指由上文可知是膏油。正文采用符合现代汉语习惯的表达，并以脚注保留原文形式。
- source_word: הַמִּזְבֵּחַ
  choice: 祭坛
  rationale: 这是献祭语境中 מִזְבֵּחַ 的标准现代汉语译法。
- source_word: שֶׁבַע פְּעָמִים
  choice: 七次
  rationale: 直接表达仪式动作重复的次数。
- source_word: וַיִּמְשַׁח
  choice: 膏抹
  rationale: 保留 משׁח 在圣所奉献礼中的礼仪含义，同时是现代读者可理解的宗教用语。
- source_word: כָּל כֵּלָיו
  choice: 祭坛的一切器具
  rationale: “器具”自然涵盖附属于祭坛的各类用具；补明“祭坛的”以避免汉语中的指代含混。
- source_word: הַכִּיֹּר
  choice: 洗濯盆
  rationale: 该词指会幕区域供礼仪洗濯使用的盆；“洗濯盆”比单说“盆”更明确，又不采用较生僻的传统词。
- source_word: כַּנּוֹ
  choice: 盆座
  rationale: כֵּן 在此指支承洗濯盆的结构；“盆座”简洁清楚，亦可译“底座”。
- source_word: לְקַדְּשָׁם
  choice: 使它们分别为圣
  rationale: 表达把这些物件划归神圣用途的礼仪意义，不把动作弱化为一般的清洁或祝福。
theological_decisions:
- issue: 圣所礼仪动作与器物的术语
  choice: 采用“膏抹”“分别为圣”等庄重而可懂的礼仪语言
  alternative: 译作“涂油”“使成圣”，或采用更古雅的器物名称
  rationale: 本节叙述会幕器物的奉献礼；所选表达保留分别归于神圣用途的含义，但不额外引入后来的教义解释。
translation_notes:
  register: 采用现代、庄重、易懂的标准普通话。“洗濯盆”明确其礼仪用途；句式保持叙事流畅，并保留原文先洒七次、继而膏抹并分别为圣的动作次序。
