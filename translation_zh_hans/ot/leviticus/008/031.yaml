  text: וַ/יֹּ֨אמֶר מֹשֶׁ֜ה אֶל אַהֲרֹ֣ן וְ/אֶל בָּנָ֗י/ו בַּשְּׁל֣וּ אֶת הַ/בָּשָׂר֮ פֶּ֣תַח אֹ֣הֶל מוֹעֵד֒ וְ/שָׁם֙ תֹּאכְל֣וּ אֹת֔/וֹ וְ/אֶ֨ת הַ/לֶּ֔חֶם אֲשֶׁ֖ר בְּ/סַ֣ל הַ/מִּלֻּאִ֑ים כַּ/אֲשֶׁ֤ר צִוֵּ֨יתִי֙ לֵ/אמֹ֔ר אַהֲרֹ֥ן וּ/בָנָ֖י/ו יֹאכְלֻֽ/הוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/031.yaml
  text: And Moses said to Aaron and to his sons[a], “Boil the meat at the entrance of the tent of meeting, and there eat it and the bread that is in the basket of ordination offerings, just as I commanded, saying, ‘Aaron and his sons shall eat it.’”
translation:
  language: zh_hans
  text: 摩西对亚伦和他的儿子们说：“你们要在会幕门口煮这肉，并在那里吃这肉和承接圣职礼[a]筐里的饼，正如我所吩咐说：‘亚伦和他的儿子们要吃它。’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“授职礼”或“奉献礼”。这里指亚伦和他儿子就任祭司时所举行的礼仪及相关祭物。
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּשְּׁלוּ
  choice: 煮
  rationale: 该动词在献祭饮食语境中指烹煮，译作“煮”既具体又符合现代汉语。
- source_word: הַבָּשָׂר
  choice: 这肉
  rationale: 指献祭牲畜可食用的肉；“肉”比“肉体”自然，并以“这”承接上文所述祭牲。
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: 在会幕门口
  rationale: פֶּתַח表示入口或门口；“会幕门口”是简洁、清楚且已通行的礼仪地点表达。
- source_word: וְשָׁם תֹּאכְלוּ אֹתוֹ
  choice: 也要在那里吃这肉
  rationale: 保留שָׁם对地点的强调；将代词明确为“这肉”，避免汉语中指代不清。
- source_word: הַלֶּחֶם
  choice: 饼
  rationale: 此处指承接圣职礼中筐里的无酵饼等饼类；“饼”比泛称“食物”更具体，也比“面包”更符合古代近东语境。
- source_word: סַל הַמִּלֻּאִים
  choice: 承接圣职礼筐子
  rationale: מִלֻּאִים是使祭司就职、承接圣职的礼仪用语；译文保留礼仪性质，同时避免把该短语误解为筐子本身被按立。
- source_word: כַּאֲשֶׁר צִוֵּיתִי לֵאמֹר
  choice: 正如我所吩咐的
  rationale: לֵאמֹר在此引出随后直接引语，汉语以冒号自然体现其功能，无须生硬译成“说”。
- source_word: יֹאכְלֻהוּ
  choice: 要吃这些
  rationale: 未完成式在引述的命令中带有指令义，译作“要吃”保留义务语气而不过度强化为“必须”；单数后缀可统指前述肉和饼，汉语用“这些”明确表达集合性所指。
theological_decisions:
- issue: 祭司就职语境中מִלֻּאִים的译法
  choice: 承接圣职礼
  alternative: 授职礼；分别为圣礼
  rationale: 该词源于“充满（手）”的礼仪表达，在本章特指亚伦及其儿子承接祭司职分的仪式。“承接圣职礼”既体现祭司就职背景，又不套用后世特定教会体制。
- issue: 末尾单数代词所指
  choice: 这些（统指肉和饼）
  alternative: 它（按语法单数直译）
  rationale: 希伯来语יֹאכְלֻהוּ带阳性单数宾语后缀，可能集合性地回指前述食物。汉语若译“它”容易误以为只指饼或肉，因此用“这些”保留整体指向，而不另行限定。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“会幕”“承接圣职礼”保持利未记礼仪语境的术语连贯性；命令以“你们要”表达，直接引语层次清楚。
