base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/016.yaml
  text: He took all the fat that was on the entrails[a], the lobe of the liver, the two kidneys and their fat[b], and Moses burned them on the altar.
translation:
  language: zh_hans
  text: 摩西取了内脏上的一切脂油、肝叶[a]、两个肾和肾上的脂油；他把这一切都焚烧在祭坛上[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“肝上的附属物”。这个希伯来词指预备祭牲时从肝脏处取下的一个特定部分。
    reason: lexical_alternative
  - marker: b
    text: 这里的“焚烧”在献祭语境中更具体地指“使之化为烟”或“焚烧献上”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: 他取了
  rationale: 这是叙事中表示先后动作的动词形式。保留第三人称代词，使后半句明确出现“摩西”的希伯来文句式得以体现。
- source_word: כָּל הַחֵלֶב
  choice: 一切脂油
  rationale: חֵלֶב在献祭语境中特指献上的脂肪部分；“脂油”既贴近原文，也符合中文祭祀叙述的庄重语体。
- source_word: אֲשֶׁר עַל הַקֶּרֶב
  choice: 盖在内脏上的
  rationale: קֶרֶב在此指牲畜的内部脏器；“内脏”具体、自然，并准确表达脂油位于其上的关系。
- source_word: יֹתֶרֶת הַכָּבֵד
  choice: 肝叶
  rationale: 该短语指献祭处理时从肝脏处取下的特定部分，确切解剖所指并不完全确定；正文采用简洁通行的“肝叶”，脚注保留“肝上的附属物”这一可能译法。
- source_word: שְׁתֵּי הַכְּלָיֹת
  choice: 两个肾
  rationale: 直接表达原文双数，采用现代中文常用的解剖名称。
- source_word: חֶלְבְּהֶן
  choice: 肾上的脂油
  rationale: 原文直译为“它们的脂油”，所指是两个肾相关的脂油；中文明确说“肾上的脂油”，避免代词指向含混。
- source_word: וַיַּקְטֵר
  choice: 焚烧
  rationale: קטר在献祭语境中指把祭物烧在坛上，使之化为烟而献上；正文用自然庄重的“焚烧”，脚注说明其祭仪含义。
- source_word: הַמִּזְבֵּחָה
  choice: 在祭坛上
  rationale: 词尾的方向/处所形式在这里表明焚烧发生于祭坛之上；此译法符合现代汉语。
theological_decisions:
- issue: 焚烧动作的祭仪含义
  choice: 正文译作“焚烧”，脚注说明“使之化为烟而献上”
  alternative: 直接译作“烧成馨香”或“献为烟气”
  rationale: 原文动词包含祭坛焚烧、化为烟而献上的意义，却没有在本节明说“馨香”；因此不加入原文没有的神学评价，同时通过脚注保留其献祭专门含义。
translation_notes:
  register: 采用现代、庄重而易懂的祭仪叙述。“脂油”区别于日常用语“肥肉”，较适合利未记的献祭语境。分号保留原文两个连续动作，并让后半句明确出现的主语“摩西”自然可辨。
