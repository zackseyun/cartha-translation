  text: Then he cut the ram into its pieces[a], and Moses burned the head, the pieces, and the suet in smoke.
translation:
  language: zh_hans
  text: 他把公绵羊切成各块；摩西把羊头、各块和脂肪[a]焚烧，使其化为烟。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“脂油”。希伯来语指祭牲的一部分脂肪，具体部位不确定；有些译者按公绵羊献祭的背景理解为“肥尾”。
    reason: 说明罕见祭牲术语פָּדֶר的词义范围，并保留“脂油”与“肥尾”两种理解，而不在正文中强行确定具体部位。
lexical_decisions:
- source_word: הָאַיִל
  choice: 公绵羊
  rationale: אַיִל在献祭语境中指成年的雄性绵羊；“公绵羊”准确且便于现代普通读者理解。
- source_word: נִתַּח לִנְתָחָיו
  choice: 切成一块一块
  rationale: 动词与同根名词连用，表示把祭牲肢解、切成各块；此译法在中文中自然地保留了原文的重复意味。
- source_word: וַיַּקְטֵר
  choice: 焚烧成烟
  rationale: קטר的使役式在献祭语境中表示焚烧祭物，使其烟气上升；“焚烧成烟”比单说“烧”更能体现该祭仪含义，同时未添加原文此节没有明说的地点。
- source_word: הָרֹאשׁ
  choice: 羊头
  rationale: 原义为“头”；补出“羊”符合汉语表达，并明确其所指仍是前述公绵羊。
- source_word: הַנְּתָחִים
  choice: 肉块
  rationale: 指前句切开的各部分；“肉块”自然承接“一块一块”，也避免较生硬的“肢块”。
- source_word: הַפָּדֶר
  choice: 肥油
  rationale: פָּדֶר指祭牲的一块脂肪组织，具体部位并不完全确定；“肥油”保留其脂肪含义，不把它未经确定地具体化为“肥尾”。
