  text: וַ/יַּ֣עַשׂ מֹשֶׁ֔ה כַּֽ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֹת֑/וֹ וַ/תִּקָּהֵל֙ הָֽ/עֵדָ֔ה אֶל פֶּ֖תַח אֹ֥הֶל מוֹעֵֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/004.yaml
  text: And Moses did as Yahweh commanded him[a], and the congregation assembled at the entrance to the tent of meeting.
translation:
  language: zh_hans
  text: 摩西就照耶和华吩咐他的那样行了；会众聚集到会幕门口。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: 做了
  rationale: עשה含义宽泛，可指“做、行”；这里表示摩西遵行命令，“做了”自然直接。
- source_word: כַּאֲשֶׁר
  choice: 照……所
  rationale: 表达行动与命令相符；汉语“照……所吩咐的”准确而自然。
- source_word: צִוָּה
  choice: 吩咐
  rationale: צוה表示有权威的命令；“吩咐”在中文圣经叙事中庄重自然，也保留权威语气。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代简体中文读者熟悉的专名形式音译四字神名，不以称号替代。
- source_word: אֹתוֹ
  choice: 他的
  rationale: 指摩西；嵌入“所吩咐他的”结构，清楚保留宾语关系。
- source_word: וַתִּקָּהֵל
  choice: 聚集
  rationale: קהל的尼法勒形式在此表示会众聚到一起；中文不及物用法“聚集”自然，并不强行判定为外力使其集合。
- source_word: הָעֵדָה
  choice: 会众
  rationale: עֵדָה指以色列共同体或集合起来的群体；“会众”符合五经语境，且为普通中文读者所熟悉。
- source_word: אֶל
  choice: 到
  rationale: 保留向着某处并到达的方向意义；与“聚集到……门口”搭配自然。
- source_word: פֶּתַח
  choice: 门口
  rationale: פֶּתַח指入口或开口；在帐幕场景中，“门口”简洁自然。
- source_word: אֹהֶל מוֹעֵד
  choice: 会幕
  rationale: 这是现代中文圣经传统中对“相会之帐”的凝练固定称呼，兼顾可读性及术语连续性。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用神的专名而非称号；正文保留专名。现代标准中文中“耶和华”辨识度最高，未用“主”取代神名。
- issue: וַתִּקָּהֵל 的语态表达
  choice: 会众也聚集
  alternative: 会众也被召集
  rationale: 尼法勒形式容许中动或被动理解；正文采用自然的中性汉语表达，不明确加入原文未指出的召集者，也不排除会众是被聚集起来的语义可能。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。以“就……也……”顺接两个叙事动作；保留摩西顺服命令的直接表达。正文未设脚注，因为“会众也聚集”在中文中可自然涵盖希伯来语中动与被动之间的语义弹性。
