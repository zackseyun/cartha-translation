base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/018.yaml
  text: Then he brought near the ram of the burnt offering[b][a], and Aaron and his sons laid their hands on the head of the ram.
translation:
  language: zh_hans
  text: 他把作燔祭的公绵羊带到近前[a]。亚伦和他的儿子们都把双手按[b]在公绵羊的头上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “带到近前”也可译作“呈上”。
    reason: lexical_alternative
  - marker: b
    text: “按”也可译作“放在”；原文动词可带有把手按压在祭牲上的意思，指献祭时所行的礼仪动作。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְרֵב
  choice: 他又……牵来
  rationale: 使役词形在献祭语境中指把祭牲带近或呈上。“牵来”符合公绵羊作为活祭牲的情境，也自然承接上文；“他”依近文指摩西。
- source_word: אֵיל הָעֹלָה
  choice: 作燔祭的公绵羊
  rationale: אֵיל明确指公绵羊，עֹלָה是固定祭祀用语“燔祭”。此译自然表达这只羊被指定作燔祭，同时保留原文的祭祀术语。
- source_word: וַיִּסְמְכוּ
  choice: 按
  rationale: סמך在献祭礼仪中指把手放在祭牲上，并可含按压之意。“按”简洁自然，比单纯的“放”更能体现该动作。
- source_word: יְדֵיהֶם
  choice: 都把双手
  rationale: 原文“他们的手”为复数。汉语加“都”使复数主语与各自行礼的动作清楚，“双手”保留手的复数。
- source_word: עַל רֹאשׁ הָאָיִל
  choice: 在公绵羊的头上
  rationale: 直接、自然地对应原文介词短语，不增添该礼仪动作的解释。
theological_decisions:
- issue: 献祭礼仪中的按手动作
  choice: 把双手按在公绵羊的头上
  alternative: 把双手放在公绵羊的头上
  rationale: 译文只陈述经文明确记载的礼仪动作，不擅自解释为归罪、认同或转移，从而保留经文本身的神学开放性。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“公绵羊”准确区分性别和牲畜种类；分成两句以保持中文叙事清晰。脚注仅说明词义选择，不加入经文本身未明说的礼仪神学解释。
