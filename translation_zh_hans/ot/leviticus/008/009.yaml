  text: וַ/יָּ֥שֶׂם אֶת הַ/מִּצְנֶ֖פֶת עַל רֹאשׁ֑/וֹ וַ/יָּ֨שֶׂם עַֽל הַ/מִּצְנֶ֜פֶת אֶל מ֣וּל פָּנָ֗י/ו אֵ֣ת צִ֤יץ הַ/זָּהָב֙ נֵ֣זֶר הַ/קֹּ֔דֶשׁ כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/009.yaml
  text: And he put the turban on his head[a], and on the front of the turban he placed the gold plate, the holy crown, just as Yahweh had commanded Moses.
translation:
  language: zh_hans
  text: 他把礼冠戴在亚伦头上，又把金牌，就是圣冠[a]，安在礼冠正面，正如雅威所吩咐摩西的那样。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“神圣的冠饰”。
    reason: “冠饰”可更明确地表达 נֵזֶר 在此是礼冠上的神圣标志，而非另一顶独立的冠。
lexical_decisions:
- source_word: מִצְנֶפֶת
  choice: 礼冠
  rationale: 指大祭司特有的头部礼服。“礼冠”简洁、庄重，也能与本句后面的“圣冠”区分；其形制可能近似缠裹式头巾。
- source_word: אֶל מוּל פָּנָיו
  choice: 在礼冠正面
  rationale: 该短语在此说明金牌安放于礼冠朝前的一面，而不是仅仅位于亚伦面前。
- source_word: צִיץ
  choice: 金牌
  rationale: 该词本可指花朵或花形饰物，但在祭司服饰语境中指固定在礼冠上的金质饰牌；“金牌”结合原文明确的材质，表达清楚。
- source_word: נֵזֶר הַקֹּדֶשׁ
  choice: 圣冠
  rationale: 这是对金牌的同位说明，表明它是分别为圣的冠饰；“圣冠”贴近原文且适合现代读者。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以常见的现代汉语音译呈现四字神名，保留其作为上帝专名的性质，不以称号替代。
- source_word: וַיָּשֶׂם ... וַיָּשֶׂם
  choice: 戴……安在
  rationale: 同一希伯来语动词连续出现；按两个动作的不同对象分别译为“戴”和“安在”，既自然又保留动作含义。
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת־מֹשֶׁה
  choice: 正如雅威吩咐摩西的
  rationale: “正如”体现完全依照神命令而行的对应意味，并以自然汉语表达完成式叙事。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华／上主
  rationale: 原文直接使用四字神名，因此采用“雅威”作为专名音译，避免以称号取代，也不采用较晚形成的混合读音。
- issue: נֵזֶר הַקֹּדֶשׁ 与金牌的关系
  choice: 译作同位语“就是圣冠”
  alternative: 译作两个分立物件“金牌和圣冠”
  rationale: 原文中“圣冠”紧接“金牌”，最自然地起同位说明作用；译文不把两者拆成不同物件。
translation_notes:
  register: 采用现代、庄重而易懂的礼仪叙事文体。“礼冠”避免把祭司头饰误解为普通帽子；“正面”清楚交代金牌的安放位置。为免孤立经节中两个“他”所指不清，按上下文明确受衣者为亚伦。
