source:
  edition: WLC
  text: וַ/יִּתֵּ֣ן אֶת הַ/כֹּ֔ל עַ֚ל כַּפֵּ֣י אַהֲרֹ֔ן וְ/עַ֖ל כַּפֵּ֣י בָנָ֑י/ו וַ/יָּ֧נֶף אֹתָ֛/ם תְּנוּפָ֖ה לִ/פְנֵ֥י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/027.yaml
  text: He put all of it into the palms of Aaron and into the palms of his sons[a], and he waved them as a wave offering before Yahweh.
translation:
  language: zh_hans
  text: 他把这一切都放在亚伦的手掌上，也放在他儿子们的手掌上；他又在耶和华面前把这些作为摇祭摇动。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: 放在
  rationale: נתן 可表示“给、放、置”；此处描述把祭物部分置于手掌上的动作，“放在”准确自然，也不暗示所有权转移。
- source_word: אֶת הַכֹּל
  choice: 这一切
  rationale: 指上一节所列的全部祭物部分；“这一切”既承接上文，也保留完整涵盖之意。
- source_word: עַל כַּפֵּי
  choice: 在……的手掌上
  rationale: עַל 的基本义是“在……上”，כַּף 在此指手掌；这一表达贴近原文，也能自然呈现祭物置于摊开或捧起的手掌上。
- source_word: בָנָיו
  choice: 他儿子们
  rationale: 原文明确指亚伦的男性后裔，即参与承接圣职礼的儿子们，不泛化为“儿女”或“孩子们”。
- source_word: וַיָּנֶף אֹתָם תְּנוּפָה
  choice: 把这些作为摇祭……摇一摇
  rationale: נוף 的使役式与 תְּנוּפָה 构成同根表达，指以摇动方式呈献祭物；译文同时保留动作“摇”和礼仪术语“摇祭”。“这些”明确指手掌上的祭物，而非亚伦及其儿子。
- source_word: לִפְנֵי יְהוָה
  choice: 在耶和华面前
  rationale: 保留“在……面前”的礼仪性空间表达，并以现代中文通行的专名“耶和华”译出四字神名。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: “耶和华”是现代简体中文圣经语境中最通行、普通读者最易识别的专名形式；不以“主”替代，因而仍明确呈现原文的专有神名。
- issue: 摇祭动作的施事者与宾语
  choice: 摩西把祭物作为摇祭摇动
  alternative: 亚伦和他的儿子们共同摇动祭物
  rationale: וַיָּנֶף 是第三人称阳性单数，语法上的施事者延续上文的摩西；אֹתָם 指复数祭物部分。中文不重复“他”可避免代词歧义，但句法仍由前半句的施事者贯穿。
- issue: בָנָיו 的性别与亲属含义
  choice: 他儿子们
  alternative: 他的孩子们
  rationale: 承接圣职礼中的对象明确是亚伦的儿子；保留原文的男性亲属指称，不作性别中和。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“摇祭”保留利未记中的专门礼仪术语；“摇一摇”则清楚表达与该名词同根的实际动作。正文适度合并希伯来文重复的介词短语，脚注交代其较形式对应的译法。
