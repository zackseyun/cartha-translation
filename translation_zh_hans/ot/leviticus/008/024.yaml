base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/024.yaml
  text: Then he brought Aaron’s sons near, and Moses put some of the blood on the lobe of their right ear, on the thumb of their right hand, and on the big toe of their right foot. Then Moses threw the blood against the altar all around.
translation:
  language: zh_hans
  text: 摩西又让亚伦的儿子们近前来，把一些血抹在他们的右耳垂、右手大拇指和右脚大拇趾上。随后，摩西把血泼在祭坛四周。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּקְרֵב
  choice: 让……近前来
  rationale: 使役形式在这里表示摩西使亚伦的儿子们走近；这样表达自然，也保留礼仪场景中的动作关系。
- source_word: תְּנוּךְ
  choice: 耳垂
  rationale: 该词指耳朵的末端或耳垂；结合本节具体部位，译作“耳垂”清楚而准确。
- source_word: בֹּהֶן יָד
  choice: 手大拇指
  rationale: בֹּהֶן 用于手时指拇指；“右手大拇指”符合现代汉语习惯。
- source_word: בֹּהֶן רֶגֶל
  choice: 脚大拇趾
  rationale: בֹּהֶן 用于脚时指大脚趾；“大拇趾”准确区分于手指。
- source_word: וַיִּזְרֹק
  choice: 洒
  rationale: זרק 在祭坛血礼语境中表示将血泼洒、洒向祭坛；“洒”是中文祭礼叙述中自然且不过度限定具体手法的表达。
- source_word: סָבִיב
  choice: 四周
  rationale: 表示环绕祭坛各面，译作“祭坛四周”简洁明确。
theological_decisions:
- issue: 血抹在右耳、右手和右脚上的礼仪意义
  choice: 只陈述礼仪动作，不在正文中解释其象征意义
  alternative: 加入听从、服事或行走分别为圣等象征性解释
  rationale: 原文仅记述仪式行为，没有明说象征含义；正文应保留这种克制，避免导入特定释经传统。
- issue: “近前来”的祭司性含义
  choice: 译为一般使役动作“让……近前来”
  alternative: 译为“把……献上”或“使……就任”
  rationale: 本处动词直接描述人物靠近，虽置于承接圣职礼仪中，却不宜把整套神学含义压入单个动词。
translation_notes:
  register: 采用现代、庄重而易懂的叙事体。“摩西又让……近前来”承接上一节礼仪步骤；第二句用“随后”推进动作。避免生硬直译代词开头，并保持三个身体部位的平行结构。
