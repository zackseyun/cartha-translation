    issue: 末句“洒在祭坛四周”的动作力度和位置关系不够明确。
    rationale: וַיִּזְרֹק 的基本动作是投、泼、撒向；而 עַל הַמִּזְבֵּחַ סָבִיב 指向祭坛及其四面。“泼在祭坛四周”更贴近原文，也避免被理解为洒在祭坛周边地面。
  revised_text: 摩西又让亚伦的儿子们近前来，把一些血抹在他们的右耳垂、右手大拇指和右脚大拇趾上。随后，摩西把血泼在祭坛四周。
