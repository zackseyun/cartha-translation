base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/022.yaml
  text: Then he brought near the second ram[a], the ram of ordination, and Aaron and his sons laid their hands on the head of the ram.
translation:
  language: zh_hans
  text: 随后，摩西把第二只公绵羊，就是承接圣职的公绵羊[a]带来。亚伦和他的儿子们把手按在公绵羊的头上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “承接圣职”也可译作“授职”或“分别为圣”。希伯来语此处是指祭司设立礼的专门用语。
    reason: 说明 מִלֻּאִים 在本段的技术性礼仪含义，并保留可接受的译法。
lexical_decisions:
- source_word: וַיַּקְרֵב
  choice: 随后，摩西牵来
  rationale: 使役式在献祭礼仪中表示把祭牲带近、呈上；按上下文补出主语“摩西”，并用“牵来”自然表达将活的公绵羊带到近前。
- source_word: הָאַיִל הַשֵּׁנִי
  choice: 第二只公绵羊
  rationale: 准确保留序数“第二”和 אַיִל 所指的公绵羊。
- source_word: אֵיל הַמִּלֻּאִים
  choice: 承接圣职所献的公绵羊
  rationale: מִלֻּאִים 是祭司就职礼的专门用语；“承接圣职”在中文圣经语境中简洁而明确地表达祭司受任就职，同时借“所献的”说明该羊在礼仪中的用途。
- source_word: וַיִּסְמְכוּ
  choice: 把手按在
  rationale: סמך 在献祭语境中指将手放在或按在祭牲上；“按在”清楚保留礼仪动作。
- source_word: אֶת יְדֵיהֶם
  choice: 手
  rationale: 希伯来文形式为复数，但汉语以集合性的“手”配合复数主语更自然，并不否定各人所行的按手动作。
- source_word: עַל רֹאשׁ הָאָיִל
  choice: 在羊头上
  rationale: 直接、自然地表达介词短语，并由近距语境明确“羊”就是该公绵羊。
- source_word: אַהֲרֹן וּבָנָיו
  choice: 亚伦和他儿子们
  rationale: בָנָיו 在本段指亚伦参与祭司承接圣职礼的男性后裔；译作“儿子们”准确保留性别和复数。
theological_decisions:
- issue: 祭司礼仪术语 מִלֻּאִים 的译法
  choice: 承接圣职
  alternative: 授职；分别为圣
  rationale: 该词字面与“充满、填满”有关，在利未记8章则专指亚伦及其儿子被设立为祭司的礼仪。“承接圣职”既保留传统祭司礼仪色彩，也明确指向受任就职；脚注列出可理解的现代替代说法，避免将术语限定为某一宗派制度。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。为避免中文代词指向含混，依上下文补出“摩西”；用“牵来”对应活祭牲被带到近前。主文保留“承接圣职”这一凝练礼仪表达，并以脚注说明替代译法。
