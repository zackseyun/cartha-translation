source:
  edition: WLC
  text: כַּ/אֲשֶׁ֥ר עָשָׂ֖ה בַּ/יּ֣וֹם הַ/זֶּ֑ה צִוָּ֧ה יְהוָ֛ה לַ/עֲשֹׂ֖ת לְ/כַפֵּ֥ר עֲלֵי/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/034.yaml
  text: Just as has been done on this day[a], Yahweh has commanded to be done, to make atonement for you.
translation:
  language: zh_hans
  text: 正如今日所做的，耶和华吩咐这样做，好为你们赎罪。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“今日所做的，正是耶和华所吩咐要做的，好为你们赎罪。”
    reason: 原文前后两个“做”彼此呼应，可理解为当天所行的礼仪正是耶和华所命定施行的；原文在本句未明确第二个“做”的执行者。
lexical_decisions:
- source_word: כַּאֲשֶׁר
  choice: 正如
  rationale: 引出与当天已经施行之礼仪的比较，保留原文的比较意味，现代汉语也自然。
- source_word: עָשָׂה
  choice: 所做的
  rationale: 原文虽为第三人称阳性单数，但此处施事者并未明说，指刚刚完成的礼仪；用“所做的”避免武断补出主语。
- source_word: בַּיּוֹם הַזֶּה
  choice: 今天
  rationale: 指举行礼仪的当日；“今天”简洁、自然，并准确表达时间指向。
- source_word: צִוָּה
  choice: 吩咐
  rationale: 表达具有约束力的神圣命令，符合庄重而通俗的经文语体。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代简体中文圣经读者熟悉的神名音译，不以称号取代专名。
- source_word: לַעֲשֹׂת
  choice: 要这样做
  rationale: 与前面的 עָשָׂה 呼应；补入“这样”可在汉语中清楚指回当天所行的礼仪，而不强行指定执行者。
- source_word: לְכַפֵּר
  choice: 好……赎罪
  rationale: 保留祭司礼仪语境中 כפר 的传统核心含义，同时避免以更狭窄的神学术语解释其机制。
- source_word: עֲלֵיכֶם
  choice: 为你们
  rationale: 在 כפר 的搭配中表示为某人或代表某人；“为你们”简明自然。
theological_decisions:
- issue: 祭祀语境中 כפר 的译法
  choice: 好为你们赎罪
  alternative: 好为你们行赎罪之礼；好为你们遮罪
  rationale: “赎罪”是现代中文中较为通行且可理解的祭祀用语，保留原文的礼仪—神学意味；不采用“挽回祭”等更狭窄说法，以免预先限定 כפר 的具体机制。
- issue: 前后两个 עשה 的施事者
  choice: 用“所做的／要这样做”保持施事者不明说
  alternative: 译为“他所做的／他吩咐你们做”
  rationale: 原文语法允许从语境理解施事者，却没有在本句明确指出；不补出特定主语，可保留原文的含混与焦点。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“正如……也……”呈现比较结构；“赎罪”保留利未记祭祀语境的术语色彩。脚注标记已在正文中列出。
