base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/013.yaml
  text: Then Moses brought Aaron’s sons near[a], and clothed them with tunics, and girded them with sashes, and bound caps on them[c][b], just as Yahweh had commanded Moses.
translation:
  language: zh_hans
  text: 摩西又使亚伦的儿子们近前[a]，给他们穿上内袍，束上腰带[b]，给他们戴上礼帽，正如雅威所吩咐摩西的那样。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“把亚伦的儿子们带上前来”或“把亚伦的儿子们呈献出来”。希伯来语动词既可指使人靠近，也可在礼仪中指把人带到神面前。
    reason: lexical_alternative
  - marker: b
    text: 原文“腰带”为单数，可按分配意义理解，即每人束上一条祭司腰带。
    reason: grammatical_clarification
lexical_decisions:
- source_word: וַיַּקְרֵב
  choice: 使……近前
  rationale: 使役形通常表示“使靠近、带到近前”；此处处于承接圣职的礼仪语境。“使……近前”保留了接近与呈献之间的语义空间。
- source_word: בְּנֵי אַהֲרֹן
  choice: 亚伦的儿子们
  rationale: 直接表达原文的属格结构和复数男性亲属含义，符合现代汉语。
- source_word: וַיַּלְבִּשֵׁם כֻּתֳּנֹת
  choice: 给他们穿上内袍
  rationale: 使役动词表示替他们穿衣；כֻּתֳּנֹת 是贴身穿着的长衣，在祭司服饰语境中译作“内袍”较准确，也避免现代“衬衫”的误解。
- source_word: וַיַּחְגֹּר אֹתָם אַבְנֵט
  choice: 束上腰带
  rationale: חגר 表示束系，אַבְנֵט 指布制的祭司腰带。原文名词虽为单数，却可按分配意义理解为每人一条；中文无需强行标出复数。
- source_word: וַיַּחֲבֹשׁ לָהֶם מִגְבָּעוֹת
  choice: 戴上礼帽
  rationale: חבשׁ 在此表示把头饰系戴好；מִגְבָּעוֹת 是普通祭司的专用头饰，与大祭司的冠冕有别。“礼帽”体现礼仪用途，又不把具体形制过度确定为现代帽子或包头巾。
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: 正如雅威吩咐摩西的
  rationale: “正如”保留严格照命而行的符合语气；将神名 יְהוָה 音译为“雅威”，不以称号代替专名。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华／上主
  rationale: 原文使用四字神名。音译“雅威”保留其专名性质；“耶和华”是传统混合读法，“上主”则以称号代替名字。
- issue: וַיַּקְרֵב 的礼仪含义
  choice: 使亚伦的儿子们近前
  alternative: 把亚伦的儿子们呈献出来
  rationale: 该动词在礼仪语境可带有“呈献”意味，但原文本身仍以“使靠近”为基本表达；正文保留这种开放性，并以脚注列出礼仪性的另一译法。
translation_notes:
  register: 采用现代、庄重而易懂的礼仪叙事语体。“内袍”“腰带”“礼帽”彼此区分祭司服饰；句式紧凑，保留原文连续动作及结尾的遵命公式。
