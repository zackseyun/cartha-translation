  yaml_path: translation/ot/leviticus/008/019.yaml
  text: And he slaughtered it[a], and Moses threw the blood against the altar all around.
translation:
  language: zh_hans
  text: 他宰了那只公绵羊；摩西把血泼在祭坛四周。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“把血甩向祭坛四面。”原文动词表示有力地施血，并非轻轻地撒血。
    reason: 说明献祭用语的动作力度，并提供可保留原文“投掷”意味的译法。
lexical_decisions:
- source_word: וַיִּשְׁחָט
  choice: 他宰了那只公绵羊
  rationale: שׁחט在献祭语境中特指宰杀祭牲。希伯来文省略宾语，中文依上文补出“那只公绵羊”，并保留原文先用隐含主语、后明确说“摩西”的叙事结构。
- source_word: וַיִּזְרֹק
  choice: 泼
  rationale: זרק在此指将祭牲的血有力地施到祭坛上。“泼”比“撒”更能避免轻轻洒血的印象，同时符合现代汉语表达。
- source_word: הַדָּם
  choice: 血
  rationale: 定冠词所指的血在上下文中明确；“把血泼在……”是自然的现代汉语，无须另加指示词。
- source_word: הַמִּזְבֵּחַ
  choice: 祭坛
  rationale: מזבח在献祭语境中的标准译法。
- source_word: סָבִיב
  choice: 四周
  rationale: 表达血施于祭坛周围各面的分布含义，简洁自然。
- source_word: מֹשֶׁה
  choice: 摩西
  rationale: 采用现代中文圣经传统中通行的人名音译。
