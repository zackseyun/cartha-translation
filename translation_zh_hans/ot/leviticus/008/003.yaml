  text: And assemble all the congregation at the entrance of the tent of meeting[a].
translation:
  language: zh_hans
  text: 又要把全体会众[a]召集到会幕门口。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语 עֵדָה 可按语境译为“会众”“集会”或“共同体”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֵת
  choice: 又要把
  rationale: וְ承接上一连串命令，译作“又要”；אֵת是定指宾语标记，中文不单独译出，以“把”字句自然呈现宾语与命令的关系。
- source_word: כָּל
  choice: 全体
  rationale: כָּל修饰定指名词，强调会众整体；“全体”简洁自然地表达其完整范围。
- source_word: הָ/עֵדָה
  choice: 会众
  rationale: עֵדָה在祭司文献语境中指以色列共同体；“会众”兼顾群体性和礼仪场景，也保留“全会”的可能含义于脚注。
- source_word: הַקְהֵל
  choice: 召集
  rationale: 这是קהל的使役式命令形，意为使人聚集；“召集”准确表达摩西奉命把会众集合起来。
- source_word: אֶל פֶּתַח
  choice: 到……门口
  rationale: אֶל表示趋向，פֶּתַח指入口或开口；中文“到……门口”既保留方向性，也符合自然表达。
- source_word: אֹהֶל מוֹעֵד
  choice: 会幕
  rationale: 该固定词组直指以色列敬拜中相会的帐幕；“会幕”是现代中文圣经语境中准确、简洁且广为人知的称呼。
