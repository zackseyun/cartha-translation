  yaml_path: translation/ot/leviticus/008/032.yaml
  text: And what remains of the meat and of the bread you shall burn with fire[a].
translation:
  language: zh_hans
  text: 肉和饼中剩下的[a]，你们要用火焚烧。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “肉”原文直译可作“血肉”或“肉体”；这里指祭牲可食用的肉。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַנּוֹתָר
  choice: 剩下的
  rationale: 该词是 נותר 的尼法勒分词，在此作名词性用法，指余留下来的东西；“剩下的”自然简洁。
- source_word: בַּבָּשָׂר
  choice: 肉
  rationale: בָּשָׂר 的基本义是“肉、血肉”；在本节献祭食物的语境中，指祭牲的肉，译作“肉”最自然。
- source_word: וּבַלָּחֶם
  choice: 和饼
  rationale: לֶחֶם 通常指饼或食物；在承接前文献祭礼仪的语境中，“饼”比泛称“食物”更具体，也符合上下文。
- source_word: בָּאֵשׁ
  choice: 用火
  rationale: 介词 בְּ 在这里表示手段；“用火”准确表达焚烧的方式，并符合现代汉语习惯。
- source_word: תִּשְׂרֹפוּ
  choice: 你们要……焚烧
  rationale: 第二人称阳性复数未完成式在律法指令中具有命令意味；“你们要”保留指令语气，“焚烧”符合祭礼语域。
