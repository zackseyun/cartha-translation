base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/014.yaml
  text: Then he brought near the bull of the sin offering[a], and Aaron and his sons laid their hands on the head of the bull of the sin offering.
translation:
  language: zh_hans
  text: 随后，摩西把赎罪祭的公牛带到近前[a]。亚伦和他的儿子们把手按在赎罪祭公牛的头上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “带到近前”或译“呈上”。
    reason: 原词在这里可指把祭牲带近，也可强调在礼仪中将其呈上；不指定带来的具体方式。
lexical_decisions:
- source_word: וַיַּגֵּשׁ
  choice: 牵上前来
  rationale: 使役形在祭礼语境中表示把祭牲带近或呈上；“牵上前来”既符合公牛由人带领的实际动作，也保留带到仪式现场、呈到近前的含义。
- source_word: פַּר
  choice: 公牛
  rationale: 该词在献祭语境中指公牛；本节本身不要求明确译作“牛犊”或“少壮公牛”。
- source_word: הַחַטָּאת
  choice: 赎罪祭
  rationale: 这里所指显然不是抽象的“罪”，而是祭物类别。采用现代中文圣经语境中清楚而通行的“赎罪祭”。
- source_word: וַיִּסְמֹךְ
  choice: 按
  rationale: 在献祭礼仪中，该动词指把手放在祭牲身上，并可能含有施力之意；“按”比单纯的“放”更能保留这一动作特点，又不过度说明力度。
- source_word: יְדֵיהֶם
  choice: 手
  rationale: 希伯来文为复数，指亚伦和众子各自的手。现代汉语用集合式单数“把手按在”最自然，并不否定多人各自实施动作。
- source_word: עַל רֹאשׁ
  choice: 在……的头上
  rationale: 直接保留礼仪动作的空间关系，表达自然清楚。
theological_decisions:
- issue: 献祭礼仪中按手动作的含义
  choice: 只描述亚伦和他儿子们把手按在公牛头上的动作，不在正文中解释其神学机制。
  alternative: 将动作明确解释为认同祭牲、转移罪责，或把祭牲分别为圣。
  rationale: 本节只记述礼仪动作，并未明说它表示罪责转移、身份认同或指定祭牲；译文应保留这种未加解释的神学张力。
translation_notes:
  register: 采用现代、庄重且易懂的叙事语言。主语补出“摩西”，由上文连续叙事可确定；分为两句，以免重复的“赎罪祭公牛”使长句显得拖沓。脚注标记已置于相关词组之后。
