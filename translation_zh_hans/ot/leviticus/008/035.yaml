id: LEV.8.35
reference: Leviticus 8:35
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וּ/פֶתַח֩ אֹ֨הֶל מוֹעֵ֜ד תֵּשְׁב֨וּ יוֹמָ֤ם וָ/לַ֨יְלָה֙ שִׁבְעַ֣ת יָמִ֔ים וּ/שְׁמַרְתֶּ֛ם אֶת מִשְׁמֶ֥רֶת יְהוָ֖ה וְ/לֹ֣א תָמ֑וּתוּ כִּי כֵ֖ן צֻוֵּֽיתִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/035.yaml
  text: And you shall stay at the entrance of the tent of meeting day and night for seven days[a], and keep the charge of Yahweh, so that you may not die; for so I have been commanded.
translation:
  language: zh_hans
  text: 你们要在会幕门口昼夜驻留七天，并谨守雅威所交付的职守，这样你们就不至于死亡[a]，因为我就是这样受命的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你们就不会死亡”；也可译作：“免得你们死亡。”
    reason: 希伯来语 וְלֹא תָמֻתוּ 形式上可作并列陈述，也可在前述命令之后表达所要避免的后果或警告。
lexical_decisions:
- source_word: וּ/פֶתַח אֹהֶל מוֹעֵד
  choice: 在会幕门口
  rationale: פֶתַח 指入口、门口；אֹהֶל מוֹעֵד 是圣所的固定称谓。采用现代中文通行而简洁的“会幕门口”，保留地点含义。
- source_word: תֵּשְׁבוּ
  choice: 驻留
  rationale: ישׁב 可指坐、居住或停留；本段是祭司承接圣职期间持续守在指定地点的命令，“驻留”既表达留守，也避免误解为一直坐着。
- source_word: יוֹמָם וָלַיְלָה שִׁבְעַת יָמִים
  choice: 昼夜驻留七天
  rationale: “昼夜”自然表达 יוֹמָם וָלַיְלָה 所涵盖的连续时段，“七天”直接保留期限。
- source_word: וּ/שְׁמַרְתֶּם אֶת מִשְׁמֶרֶת יְהוָה
  choice: 并谨守雅威所交付的职守
  rationale: שׁמר 与 מִשְׁמֶרֶת 的搭配表示恪守所规定的任务或责任。“谨守……职守”保留礼仪语境的庄重感；补出“所交付的”使“雅威的职守”在现代中文中含义清楚。
- source_word: יְהוָה
  choice: 雅威
  rationale: 原文直接使用四字神名；以“雅威”音译，保留其作为以色列之神专名的性质，而不改换成称号。
- source_word: וְ/לֹא תָמֻתוּ
  choice: 这样你们就不至于死亡
  rationale: 并列形式在命令之后可表达遵命所避免的后果。此译法自然呈现目的或结果关系，同时以脚注保留直译为并列陈述或理解为警告的可能。
- source_word: כִּי כֵן צֻוֵּיתִי
  choice: 因为我就是这样受命的
  rationale: 被动式表明摩西所传达的是自己从上帝领受的命令；“就是这样受命的”简洁保留 כֵּן 的指向和完成式的效力。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文使用专名而非称号；音译“雅威”能直接保留这一点，不以“主”替代，也不借译名加入额外解释。
- issue: 死亡警告 וְלֹא תָמֻתוּ 的逻辑语气
  choice: 这样你们就不至于死亡
  alternative: 你们就不会死亡；免得你们死亡；否则你们会死亡
  rationale: 希伯来语形式上以“并且不”连接，但在命令语境中可表示遵命所避免的结果。正文采用自然的目的／结果表达，脚注注明其他可能，避免把它绝对化为与顺服无关的应许。
translation_notes:
  register: 采用现代、庄重而易懂的礼仪叙事语体。“会幕”“谨守”“职守”“受命”保持经文语域，但句法按现代普通话组织。
