  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/אֶת הַ/קֶּ֥רֶב וְ/אֶת הַ/כְּרָעַ֖יִם רָחַ֣ץ בַּ/מָּ֑יִם וַ/יַּקְטֵר֩ מֹשֶׁ֨ה אֶת כָּל הָ/אַ֜יִל הַ/מִּזְבֵּ֗חָ/ה עֹלָ֨ה ה֤וּא לְ/רֵֽיחַ נִיחֹ֨חַ֙ אִשֶּׁ֥ה הוּא֙ לַ/יהוָ֔ה כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/021.yaml
  text: He washed the entrails and the legs with water[a], and Moses burned the whole ram on the altar. It was a burnt offering for a pleasing aroma, a food offering to Yahweh, just as Yahweh had commanded Moses.
translation:
  language: zh_hans
  text: 摩西用水洗了内脏和腿，把整只公绵羊放在祭坛上焚烧。这是燔祭，作为蒙悦纳的馨香，是献给耶和华的火祭[a]，正如耶和华吩咐摩西的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“是献给耶和华的食物祭。”
    reason: אִשֶּׁה 可按献祭方式理解为“火祭”，也可结合祭坛食物的观念译为“食物祭”；两种理解均有依据。
lexical_decisions:
- source_word: הַקֶּרֶב
  choice: 内脏
  rationale: 指祭牲内部的器官或内里部分；“内脏”具体、自然，符合献祭语境。
- source_word: הַכְּרָעַיִם
  choice: 腿
  rationale: 在献祭条例中指祭牲的腿部，可能尤其涉及小腿；正文用现代汉语中清楚自然的“腿”。
- source_word: רָחַץ בַּמָּיִם
  choice: 用水洗了
  rationale: 保留希伯来文明确提到“水”的表达，也呈现礼仪动作的具体性。
- source_word: וַיַּקְטֵר
  choice: 放在祭坛上焚烧
  rationale: 该动词在祭司献祭语境中指使祭物在坛上焚烧、化为烟气上升；此译法比单说“烧”更明确，又保持自然。
- source_word: כָּל הָאַיִל
  choice: 整只公绵羊
  rationale: כָּל 强调整个祭牲；אַיִל 是成年公绵羊，译作“整只公绵羊”准确且通俗。
- source_word: עֹלָה
  choice: 燔祭
  rationale: “燔祭”是现代中文圣经语境中成熟而准确的祭类名称，指整祭牲在坛上焚烧献上。
- source_word: לְרֵיחַ נִיחֹחַ
  choice: 献为蒙悦纳的馨香
  rationale: 保留气味的祭祀比喻，同时以“蒙悦纳”表达 נִיחֹחַ 所含的悦纳、令人愉悦之意，不将其粗浅化为单纯嗅觉描写。
- source_word: אִשֶּׁה
  choice: 火祭
  rationale: 该词的词源和语境都与火有关；“火祭”简洁保留献祭方式，并避免把有争议的“食物祭”解释直接写入正文。
- source_word: לַיהוָה / יְהוָה
  choice: 献给耶和华 / 耶和华
  rationale: 以汉语中广泛通行的音译“耶和华”呈现四字神名，而不是用称号替代；介词 לְ 依语境译为“献给”。
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: 正如耶和华吩咐摩西的
  rationale: “正如”体现 כַּאֲשֶׁר 所强调的完全遵照关系，结句符合现代汉语叙事习惯。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用神的专名。中文正文采用读者最熟悉、长期通行的专名形式“耶和华”，而不以“主”这一称号替换；“雅威”是较接近现代学界重构读音的另一可行音译。
- issue: 献祭固定语 לְרֵיחַ נִיחֹחַ
  choice: 献为蒙悦纳的馨香
  alternative: 作为怡人的香气
  rationale: 此译保留“香气”的感官比喻，并表达祭物蒙神悦纳的语境意义，同时不消除原文对气味的具体描写。
- issue: אִשֶּׁה 的含义
  choice: 火祭
  alternative: 献给耶和华的食物祭
  rationale: 该词传统上可理解为“用火献的祭”，也有词典和祭坛食物意象支持“食物祭”。正文采用较少解释性的“火祭”，脚注保留另一种理解。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留“燔祭”“火祭”“馨香”等必要的礼仪用语，并用“蒙悦纳”帮助普通读者理解固定献祭短语。主句按希伯来文动作顺序展开；分号避免多个“和”造成拖沓。
