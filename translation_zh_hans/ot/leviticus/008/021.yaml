revisions:
- from: 他用水洗了内脏和腿；摩西把整只公绵羊放在祭坛上焚烧。这是燔祭，献为蒙悦纳的馨香，是献给耶和华的火祭[a]，正如耶和华吩咐摩西的。
  to: 摩西用水洗了内脏和腿，把整只公绵羊放在祭坛上焚烧。这是燔祭，作为蒙悦纳的馨香，是献给耶和华的火祭[a]，正如耶和华吩咐摩西的。
  rationale: 修订仅消除中文代词指称的不明和轻微的句式重复：明确摩西是两个动作的施事者，并顺畅安排“燔祭”“蒙悦纳的馨香”与“火祭”的同位说明。未增添或删减原文信息，保留神名、祭祀术语及脚注替代译法。
