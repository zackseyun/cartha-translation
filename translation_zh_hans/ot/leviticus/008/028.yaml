  text: וַ/יִּקַּ֨ח מֹשֶׁ֤ה אֹתָ/ם֙ מֵ/עַ֣ל כַּפֵּי/הֶ֔ם וַ/יַּקְטֵ֥ר הַ/מִּזְבֵּ֖חָ/ה עַל הָ/עֹלָ֑ה מִלֻּאִ֥ים הֵם֙ לְ/רֵ֣יחַ נִיחֹ֔חַ אִשֶּׁ֥ה ה֖וּא לַ/יהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/028.yaml
  text: Then Moses took them from their palms and burned them on the altar[a], on top of the burnt offering. They were an ordination offering for a pleasing aroma[b], a food offering to Yahweh.
translation:
  language: zh_hans
  text: 于是，摩西从他们的手掌上取下这些祭物，在祭坛上、燔祭之上焚烧。这些是承接圣职所用的祭物，作为蒙悦纳的馨香，是献给耶和华的火祭。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מֵעַל כַּפֵּיהֶם
  choice: 从他们的手掌上
  rationale: 原文直译为“从他们的手掌之上”；上下文是摇祭放在亚伦和他儿子们手掌上的礼仪动作，保留“手掌”既准确也能自然表达。
- source_word: וַיַּקְטֵר
  choice: 放在……焚烧
  rationale: 该词在献祭语境中指使祭物在坛上焚烧、化为烟上升；中文以“焚烧”清楚表达祭坛上的礼仪行为。
- source_word: עַל הָעֹלָה
  choice: 在燔祭之上
  rationale: עַל通常表示“在……之上”，这里指这些祭物在燔祭上面焚烧，不改释为“旁边”。
- source_word: מִלֻּאִים
  choice: 承接圣职的祭物
  rationale: 这是祭司就职礼的专门术语，源于“充满手”的礼仪表达；“承接圣职”是中文圣经语境中清楚而庄重的说法，并以“祭物”点明本节所指。
- source_word: לְרֵיחַ נִיחֹחַ
  choice: 作为蒙悦纳的馨香
  rationale: 保留祭祀惯用语中的馨香意象，并用“蒙悦纳”表达该短语所含的接纳意味，而不把它缩减为单纯的嗅觉描写。
- source_word: אִשֶּׁה
  choice: 火祭
  rationale: 该祭司文献术语指经火献上的祭物；“火祭”简洁、准确，也避免采用存在争议的“食物祭”。
- source_word: לַיהוָה
  choice: 献给耶和华
  rationale: 以“耶和华”译出神名יהוה；介词ל结合献祭语境译为“献给”。
theological_decisions:
- issue: 祭司就职术语מִלֻּאִים的表达
  choice: 承接圣职的祭物
  alternative: 授职祭／就职祭
  rationale: 此词特指亚伦及其众子受任祭司的礼仪。选文保留祭司职分和礼仪性质，同时不引入后世教会制度的特定含义。
- issue: אִשֶּׁה的祭祀含义
  choice: 火祭
  alternative: 经火献上的祭物／食物祭
  rationale: 词源和本节焚烧祭物的语境支持“火祭”。“食物祭”是一种可能的功能性解释，但并非词义在此唯一确定的表达，故不在正文中将其坐实。
- issue: לְרֵיחַ נִיחֹחַ所表达的神圣悦纳
  choice: 蒙悦纳的馨香
  alternative: 怡人的香气／安抚的香气
  rationale: 既保留原文的香气意象，也表达祭物蒙神悦纳的祭祀语用；不将其解释成机械地安抚神明。
translation_notes:
  register: 采用现代、庄重而易懂的祭祀叙事语体。“燔祭”“火祭”“承接圣职”作为必要的利未记术语保留；句式按希伯来文动作顺序展开，同时避免生硬逐词对应。
