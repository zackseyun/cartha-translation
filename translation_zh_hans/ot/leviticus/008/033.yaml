  text: וּ/מִ/פֶּתַח֩ אֹ֨הֶל מוֹעֵ֜ד לֹ֤א תֵֽצְאוּ֙ שִׁבְעַ֣ת יָמִ֔ים עַ֚ד י֣וֹם מְלֹ֔את יְמֵ֖י מִלֻּאֵי/כֶ֑ם כִּ֚י שִׁבְעַ֣ת יָמִ֔ים יְמַלֵּ֖א אֶת יֶדְ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/033.yaml
  text: And you shall not go out from the entrance of the tent of meeting for seven days[a], until the day the days of your ordination are completed, for he will ordain you for seven days.
translation:
  language: zh_hans
  text: 你们不可从会幕门口出去，要在那里七天，直到你们承接圣职的日子满了；因为他要用七天使你们承接圣职[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “使你们承接圣职”字面意思是“充满你们的手”，是希伯来语中授予祭司职分的习语；它与前面的“承接圣职”出自同一词族。
    reason: 说明原文祭司授职习语的字面形式及本节内部的词语呼应。
lexical_decisions:
- source_word: וּמִפֶּתַח אֹהֶל מוֹעֵד
  choice: 从会幕门口
  rationale: “会幕”准确而通行地表达 אֹהֶל מוֹעֵד；“门口”保留 פֶּתַח 的空间含义，并适合现代汉语。
- source_word: לֹא תֵצְאוּ
  choice: 不可……出去
  rationale: 保留否定命令的约束力，也与“从……门口”自然衔接。
- source_word: שִׁבְעַת יָמִים
  choice: 要在那里七天
  rationale: 原文直陈“七天”；补出“要在那里”是依据“不出去”所表达的持续停留，使汉语明确流畅，并未增加新的地点。
- source_word: עַד יוֹם מְלֹאת יְמֵי מִלֻּאֵיכֶם
  choice: 直到你们承接圣职的日期满了
  rationale: מִלֻּאִים 在祭司礼仪语境中指就职、授职；“承接圣职”既庄重又能体现进入祭司职任的过程。“日期满了”传达 מלא 的完成含义。
- source_word: כִּי
  choice: 因为
  rationale: 清楚表明后半句说明前述七日禁令的理由。
- source_word: יְמַלֵּא אֶת יֶדְכֶם
  choice: 使你们承接圣职
  rationale: 这是祭司授职的希伯来习语，字面为“充满你们的手”。正文按其语境意义翻译，以免现代读者误解；字面形式和词语呼应在脚注中说明。
theological_decisions:
- issue: 祭司授职习语 מלא את־יד 的译法
  choice: 正文译为“使你们承接圣职”，脚注注明字面形式
  alternative: 直译为“充满你们的手”
  rationale: 直译在现代汉语中无法自行传达授予祭司职分的意思，容易被理解为身体动作。意译保留礼仪意义，脚注则呈现原文意象，并说明它与前句“承接圣职”属于同一词族。
- issue: יְמַלֵּא 的第三人称主语
  choice: 保留为“他”
  alternative: 明确译作“摩西”或改用无主句
  rationale: 希伯来文只用第三人称单数，并未在本节重述主语。保留“他”避免替原文消除指代上的含蓄，读者可由上下文判断。
translation_notes:
  register: 采用现代、庄重而易懂的礼仪用语。“不可”保持律法指令的力度；“承接圣职”避免过度教派化，同时准确表达祭司就职。
