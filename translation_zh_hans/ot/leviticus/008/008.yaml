base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/008.yaml
  text: And he placed the breastpiece on him[b][a], and he put the Urim and the Thummim into the breastpiece.
translation:
  language: zh_hans
  text: 他给亚伦戴上胸牌[a]，又把乌陵和土明[b]放进胸牌里。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “胸牌”或译“胸饰”。希伯来文指大祭司佩在胸前的礼仪物件，并非用于防护的铠甲。
    reason: lexical_alternative
  - marker: b
    text: “乌陵”和“土明”是希伯来礼仪专名，传统上采用音译；这些物件的具体形制和使用方法不能确定。
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּשֶׂם עָלָיו
  choice: 给亚伦戴上
  rationale: שׂוּם עַל 表示把物件放在某人身上；在祭司穿戴礼服的语境中，“给……戴上”比逐字译作“放在……身上”更自然。代词“他”按上文明确为亚伦，以免现代汉语指代含混。
- source_word: הַחֹשֶׁן
  choice: 胸牌
  rationale: חֹשֶׁן 指大祭司佩在胸前、与求问判断相关的礼仪物件。“胸牌”简明自然，也比“胸甲”更不容易使人误以为是护身铠甲；两处采用同一译法。
- source_word: וַיִּתֵּן אֶל
  choice: 放进
  rationale: נָתַן 在此是“放置”，אֶל 在该结构和具体语境中表示放入胸牌之内；“放进”准确而符合现代汉语习惯。
- source_word: הָאוּרִים וְאֶת הַתֻּמִּים
  choice: 乌陵和土明
  rationale: 这两个词是成对出现的希伯来礼仪专名，其具体形制和使用方法不能确定。采用中文圣经传统音译，避免按可能的词源译成“光明与完全”而赋予未经文本证实的含义。
theological_decisions:
- issue: 如何处理 אוּרִים וְתֻּמִּים 这对祭司礼仪用语
  choice: 音译为“乌陵和土明”
  alternative: 译作“光明与完全”或概括为“圣签”
  rationale: 经文把它们作为已知的特定物件提及，却没有在本节解释其性质。音译既保留原文的专名性，也不武断判定其词义、形制或求问方式。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“给亚伦戴上”体现祭司授职时穿戴礼服的动作；“放进……里”清楚表达物件置于胸牌之内。专名使用通行音译，并以脚注保留其历史与功能上的不确定性。
