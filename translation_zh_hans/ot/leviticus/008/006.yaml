  yaml_path: translation/ot/leviticus/008/006.yaml
  text: Then Moses brought Aaron and his sons near and washed them with water.
translation:
  language: zh_hans
  text: 随后，摩西把亚伦和他的儿子们带上前来，用水洗了他们。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּקְרֵב
  choice: 带上前来
  rationale: 使役形式在这里表示把人带近、带到礼仪场所前；“带上前来”既保留具体动作，也符合现代汉语叙事表达。
- source_word: מֹשֶׁה
  choice: 摩西
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: אַהֲרֹן
  choice: 亚伦
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: בָּנָיו
  choice: 他的儿子们
  rationale: 这里指亚伦将要承接祭司职分的男性后代，因此明确译作“儿子们”。
- source_word: וַיִּרְחַץ
  choice: 洗了
  rationale: 原词可指洗或沐浴；经文没有进一步说明方式或范围，“洗了”自然且不作过度限定。
- source_word: אֹתָם
  choice: 他们
  rationale: 宾语代词同时指亚伦和他的儿子们。
- source_word: בַּמָּיִם
  choice: 用水
  rationale: 介词在此自然表示施洗所用的媒介；“用水”比“在水里”更贴合中文习惯，又不增加浸入水中的含义。
- source_word: וַ
  choice: 随后
  rationale: 叙事连接词推动事件次序；“随后”以自然现代汉语表达其承接作用。
