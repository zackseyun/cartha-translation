  text: וַ/יִּקַּ֤ח מֹשֶׁה֙ אֶת הֶ֣/חָזֶ֔ה וַ/יְנִיפֵ֥/הוּ תְנוּפָ֖ה לִ/פְנֵ֣י יְהוָ֑ה מֵ/אֵ֣יל הַ/מִּלֻּאִ֗ים לְ/מֹשֶׁ֤ה הָיָה֙ לְ/מָנָ֔ה כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/029.yaml
  text: Then Moses took the breast and waved it as a wave offering before Yahweh. It was Moses' portion from the ram of ordination[a], just as Yahweh had commanded Moses.
translation:
  language: zh_hans
  text: 摩西又取了胸肉，在耶和华面前把它摇动，作为摇祭。这胸肉是承接圣职所献的公羊中归摩西的一份，正如耶和华所吩咐摩西的那样。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקַּח
  choice: 摩西又取了
  rationale: 叙事性 wayyiqtol 推进事件；“又”自然承接上文，同时保留“取”的基本意义。
- source_word: הֶחָזֶה
  choice: 羊的胸肉
  rationale: חָזֶה 在献祭语境中指祭牲的胸部份额；加“羊的”明确其所属，符合本节上下文。
- source_word: וַיְנִיפֵהוּ תְנוּפָה
  choice: 把它摇一摇，作为摇祭
  rationale: 动词 נוּף 与同根名词 תְּנוּפָה 连用，兼具实际礼仪动作和祭物类别；此译保留两者。
- source_word: לִפְנֵי יְהוָה
  choice: 在耶和华面前
  rationale: 这是礼仪语境中的固定表达，表示在耶和华临在之处献呈。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的专名形式表达四字神名，不以一般称号代替。
- source_word: מֵאֵיל הַמִּלֻּאִים
  choice: 承接圣职之公羊中
  rationale: אֵיל 是“公羊”；מִלֻּאִים 字面与“充满手”有关，在利未记8章指祭司就职礼。“承接圣职”是准确且较自然的中文礼仪用语。
- source_word: לְמֹשֶׁה הָיָה לְמָנָה
  choice: 归给摩西的一份
  rationale: מָנָה 指分配所得的份额；“归给……的一份”自然表达该胸肉作为摩西所得祭物份额。
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: 正如耶和华所吩咐摩西的
  rationale: 保留本书常见的遵命公式，表明摩西的行动符合先前的神圣命令。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用四字神名。中文正文采用广为人知且具有专名功能的“耶和华”，避免改译为一般称号“主”。
- issue: 祭司就职语境中的 מִלֻּאִים
  choice: 承接圣职
  alternative: 分别为圣
  rationale: 本章语境是亚伦及其儿子的祭司就职礼；“承接圣职”较具体地表达其受职性质，同时脚注保留较宽泛的可选译法。
- issue: נוּף / תְּנוּפָה 的礼仪含义
  choice: 摇一摇，作为摇祭
  alternative: 献上，作为举祭
  rationale: 原文以同根动词和名词并置，首先呈现摇动或挥动的礼仪动作；不把具体动作弱化为笼统的“献上”。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“摇祭”“承接圣职”保留利未记礼仪术语；用“把它摇一摇，作为摇祭”避免术语本身掩盖原文明确表达的动作。
