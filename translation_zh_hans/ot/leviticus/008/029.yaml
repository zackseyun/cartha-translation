revisions:
- from: 摩西又取了羊的胸肉，在耶和华面前把它摇一摇，作为摇祭。这是承接圣职之公羊中归给摩西的一份[a]，正如耶和华所吩咐摩西的。
  to: 摩西又取了胸肉，在耶和华面前把它摇动，作为摇祭。这胸肉是承接圣职所献的公羊中归摩西的一份，正如耶和华所吩咐摩西的那样。
  rationale: 修订仅处理汉语句法、礼仪语体和修饰关系的清晰度，未改变原文所表达的祭物份额、摇祭动作或遵命公式。脚注锚点[a]应保留在“承接圣职”之后。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T04:50:32Z'
review_pass:
  verdict: revise
  source_fidelity: 译文整体忠实保留了胸肉、在耶和华面前举行摇祭、此份归摩西，以及遵照耶和华吩咐的要素。将“承接圣职之公羊”调整为“承接圣职所献的公羊”，可避免修饰关系上似乎是公羊‘承接圣职’的歧义。
  naturalness: “把它摇一摇”带有口语性及动作轻微的语感，不适合庄重的礼仪叙述；“摇动，作为摇祭”更自然稳妥。末句“正如……所吩咐摩西的”在现代汉语中缺少与“正如”相应的“那样”，应补足。
  terminology: “耶和华”“摇祭”“承接圣职”均可用，且符合本章祭司就职礼语境。脚注改为更直接说明“承接圣职”对应的替代译法，以免把“分别为圣”表述为唯一的词汇替代。
  issues:
  - severity: medium
    issue: 末句“正如耶和华所吩咐摩西的”句法未完成。
    rationale: “正如”引出的比较结构需要“那样”等承接成分；补足后才自然表达原文的遵命公式。
  - severity: low
    issue: “把它摇一摇”语体偏口语，且“摇一摇”有轻微、随意的语感。
    rationale: 原文描述正式祭仪动作，并以动词与“摇祭”同根名词并置；“摇动，作为摇祭”既保留这一点，也更合庄重叙事语体。
  - severity: low
    issue: “承接圣职之公羊”修饰关系略有歧义。
    rationale: 可被瞬间理解为公羊本身承接圣职；加入“所献的”明确这是在承接圣职礼中使用的公羊。
  revised_text: 摩西又取了胸肉，在耶和华面前把它摇动，作为摇祭。这胸肉是承接圣职所献的公羊中归摩西的一份，正如耶和华所吩咐摩西的那样。
