base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/025.yaml
  text: Then he took the fat[a], and the fat tail, and all the fat that was on the entrails, and the lobe of the liver, and the two kidneys with their fat, and the right thigh.
translation:
  language: zh_hans
  text: 随后，他取了脂肪、羊的肥尾巴、内脏上的一切脂肪、肝叶[a]、两个肾和附在它们上面的脂肪，以及右大腿。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“肝脏的附属部分”。这个希伯来语词指献祭过程中取下的一个特定部位。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: 随后，他取了
  rationale: 未完成式连续体推进叙事；“随后”自然表达动作次序，同时保留主语“他”。
- source_word: הַחֵלֶב
  choice: 脂肪
  rationale: 这是献祭条例中指指定肥脂部分的常用词；“脂肪”直白、准确。
- source_word: הָאַלְיָה
  choice: 肥尾
  rationale: 所指不是一般的尾巴，而是绵羊富含脂肪的尾部；“肥尾”简洁体现其祭牲解剖含义。
- source_word: כָּל הַחֵלֶב אֲשֶׁר עַל הַקֶּרֶב
  choice: 内脏上的一切脂肪
  rationale: קֶרֶב 在献祭解剖语境中指腹腔内脏；此译具体易懂，并保留“在……上”的位置关系。
- source_word: יֹתֶרֶת הַכָּבֵד
  choice: 肝叶
  rationale: 该短语指献祭过程中取下的肝脏特定部分；“肝叶”自然简明，但具体解剖所指并不完全确定，故加注说明。
- source_word: שְׁתֵּי הַכְּלָיֹת
  choice: 两个肾
  rationale: 直接表达原文的双数概念和解剖所指。
- source_word: חֶלְבְּהֶן
  choice: 肾上的脂肪
  rationale: 原文直译为“它们的脂肪”；结合献祭解剖语境，译作“肾上的脂肪”清楚表达附属关系。
- source_word: שׁוֹק הַיָּמִין
  choice: 右大腿
  rationale: שׁוֹק 指腿部、尤其是大腿或上腿部分；“右大腿”在此比笼统的“右腿”更具体。
