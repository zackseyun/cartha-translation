  text: And Aaron and his sons did all the things that Yahweh had commanded through Moses[a].
translation:
  language: zh_hans
  text: 亚伦和他的儿子们遵行了耶和华通过摩西所吩咐的一切[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“通过摩西的手”，是表示代理或传达的惯用语，意思是“通过摩西”或“由摩西传达”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: 遵行了
  rationale: עשה在这里概括亚伦及其儿子对礼仪命令的实际执行。译作“遵行了”既自然，又明确表达这是对命令的顺服；比单纯的“做了”更符合汉语搭配。
- source_word: אַהֲרֹן וּבָנָיו
  choice: 亚伦和他的儿子们
  rationale: 按现代中文圣经人名惯例将אַהֲרֹן译作“亚伦”；בָנָיו在祭司承接圣职的语境中明确指他的男性后裔，因此译作“他的儿子们”。
- source_word: אֵת כָּל הַדְּבָרִים
  choice: 一切
  rationale: דברים可指话语、事项或事情。这里指前述全部命令及礼仪事项；中文用“一切”简洁自然，并由“所吩咐的”限定其内容。
- source_word: צִוָּה
  choice: 所吩咐的
  rationale: צוה表示发出权威命令。中文“吩咐”适合叙述上帝对祭司礼仪的命令，并与“遵行”自然搭配。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文读者熟悉的专名“耶和华”呈现四字神名，保留原文使用上帝专名而非一般称号这一点。
- source_word: בְּיַד מֹשֶׁה
  choice: 借摩西
  rationale: 字面为“在摩西手中／藉摩西之手”，是表达代理或中介的惯用语。“借摩西”用自然中文准确传达命令由摩西传达的意义；脚注保留其字面意象。
theological_decisions:
- issue: 四字神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威；上主
  rationale: 原文直接使用以色列上帝的专名。正文采用现代简体中文圣经传统中辨识度最高的“耶和华”，不以称号“上主”取代专名；“雅威”则是另一种可能的音译。
- issue: בְּיַד מֹשֶׁה所表达的中介关系
  choice: 借摩西
  alternative: 由摩西；藉摩西的手
  rationale: 该短语表明耶和华的命令经由摩西传达，并非把命令的最终来源归于摩西。“借摩西”保留这种代理关系，同时不额外引入有关摩西中保身份的系统神学表述。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“遵行……所吩咐的一切”避免生硬直译“做了所有的话／事情”，同时保留本节总结性顺服的语气。正文脚注标记与脚注相对应。
