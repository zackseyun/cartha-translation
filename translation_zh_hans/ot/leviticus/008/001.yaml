base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/001.yaml
  text: Then Yahweh spoke to Moses[a], saying,
translation:
  language: zh_hans
  text: 耶和华[a]对摩西说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文为“YHWH”（四字神名）；中文传统译作“耶和华”，也有音译作“雅威”。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: 说
  rationale: 该叙事形式承接并推进上下文；现代汉语通常不必机械译出“于是/然后”。用“说”自然表达言语行为，并与后面的引语衔接。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 这是四字神名。中文圣经传统普遍以“耶和华”作为其专名形式；脚注同时说明原文形式及常见替代音译，以保留文本信息。
- source_word: אֶל
  choice: 对
  rationale: 在言说动词后标明说话对象，现代汉语自然译为“对”。
- source_word: מֹשֶׁה
  choice: 摩西
  rationale: 采用现代中文通行的圣经人名译法。
- source_word: לֵאמֹר
  choice: 说：
  rationale: 这是引出下文直接话语的固定公式。汉语用“说：”既自然又准确，冒号标明下一节开始引语。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用四字神名而非“主”这一称号。正文采用中文读者最熟悉的专名形式“耶和华”，不以“主”替代；脚注注明希伯来文 YHWH 及“雅威”等音译，以呈现其专名性质和读音的不确定性。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。希伯来语叙事连接词不单独译出，避免生硬；以冒号引出下一节的直接话语。
