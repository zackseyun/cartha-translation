  text: וַ/יִּצֹק֙ מִ/שֶּׁ֣מֶן הַ/מִּשְׁחָ֔ה עַ֖ל רֹ֣אשׁ אַהֲרֹ֑ן וַ/יִּמְשַׁ֥ח אֹת֖/וֹ לְ/קַדְּשֽׁ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/012.yaml
  text: Then he poured some of the anointing oil on Aaron’s head and anointed him to consecrate him.
translation:
  language: zh_hans
  text: 然后，摩西把一些膏油倒在亚伦头上，膏他，使他成圣。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּצֹק
  choice: 倒
  rationale: יצק在这里指倾倒液体；“倒”是现代汉语中自然、准确的表达。
- source_word: מִשֶּׁמֶן הַמִּשְׁחָה
  choice: 一些膏油
  rationale: 介词מִן在这里具有部分义，表示从膏油中取一部分；“膏油”简明保留其礼仪用途。
- source_word: עַל רֹאשׁ אַהֲרֹן
  choice: 在亚伦头上
  rationale: 直接表达עַל的方位意义，符合现代汉语习惯。
- source_word: וַיִּמְשַׁח אֹתוֹ
  choice: 膏立他
  rationale: משׁח在祭司承接圣职的语境中不仅指涂抹，也指借膏抹设立；“膏立”保留礼仪和职分含义。
- source_word: לְקַדְּשׁוֹ
  choice: 使他分别为圣
  rationale: 在祭司礼仪语境中，קדשׁ表示将人划归神圣用途；“分别为圣”既保留圣洁概念，也体现被设立从事圣职。
- source_word: וַ
  choice: 然后
  rationale: 叙事性的连续式推进礼仪行动，“然后”自然表达先后次序。
theological_decisions:
- issue: 祭司承接圣职语境中קדשׁ的译法
  choice: 使他分别为圣
  alternative: 使他成圣；把他奉献为圣
  rationale: 原文强调亚伦借此礼仪被划归神圣用途。“分别为圣”保留了圣洁与分别归属两方面，不把含义限缩为一般的任职或奉献。
- issue: משׁח在本节中的礼仪和职分含义
  choice: 膏立他
  alternative: 膏抹他
  rationale: “膏立”能让现代读者看出这一动作具有设立祭司的作用；同时仍以“膏”保留原文的具体礼仪动作。
translation_notes:
  register: 采用现代、庄重而易懂的叙事体。“摩西”承接上下文明确主语，虽本节希伯来文仅用第三人称代词，但为中文独立阅读所需而明示。句式保留“倒油—膏立—分别为圣”的动作及目的关系。
