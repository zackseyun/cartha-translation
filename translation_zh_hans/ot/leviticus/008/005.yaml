  text: וַ/יֹּ֥אמֶר מֹשֶׁ֖ה אֶל הָ/עֵדָ֑ה זֶ֣ה הַ/דָּבָ֔ר אֲשֶׁר צִוָּ֥ה יְהוָ֖ה לַ/עֲשֽׂוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/005.yaml
  text: And Moses said to the congregation[a], “This is the thing that Yahweh has commanded to be done.”
translation:
  language: zh_hans
  text: 摩西对会众说：“这就是耶和华吩咐要做的事。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: 该叙事形式推动事件发展；汉语无需机械译出连接词，也能自然承接上文。
- source_word: הָעֵדָה
  choice: 会众
  rationale: 指聚集在一起的以色列群体；“会众”既符合礼仪语境，也为现代读者所熟悉。
- source_word: זֶה הַדָּבָר
  choice: 这就是……的事
  rationale: 保留指示词和名词“事”的结构，同时使整句符合现代汉语表达。
- source_word: צִוָּה
  choice: 吩咐
  rationale: 表达有权柄者所发出的命令；在上帝发令的语境中自然且庄重。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经传统中广为人知的神名译法，不以“主”这一称号代替原文中的专名。
- source_word: לַעֲשׂוֹת
  choice: 要做的
  rationale: 原文是不定式，形式上为主动，但没有明说执行者；汉语“要做的”可自然保留这种未指明主体的表达。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名，应以专名而非“主”来表达。“耶和华”在简体中文读者中辨识度最高；“雅威”较接近当代学界常见的拟音，但普及度较低。
- issue: 谁执行所吩咐的事
  choice: 不明说执行者
  alternative: 补作“你们要做的事”或采用更明确的被动表达
  rationale: 原文 לַעֲשׂוֹת 没有明说主语。译作“要做的事”保留了这一开放性，避免擅自限定为会众或摩西等人。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“会众”保留礼仪共同体色彩；整句简洁，并保留原文对行动执行者未加明说的特点。
