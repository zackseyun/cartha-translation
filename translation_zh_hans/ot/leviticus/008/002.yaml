  text: קַ֤ח אֶֽת אַהֲרֹן֙ וְ/אֶת בָּנָ֣י/ו אִתּ֔/וֹ וְ/אֵת֙ הַ/בְּגָדִ֔ים וְ/אֵ֖ת שֶׁ֣מֶן הַ/מִּשְׁחָ֑ה וְ/אֵ֣ת פַּ֣ר הַֽ/חַטָּ֗את וְ/אֵת֙ שְׁנֵ֣י הָֽ/אֵילִ֔ים וְ/אֵ֖ת סַ֥ל הַ/מַּצּֽוֹת־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/002.yaml
  text: Take Aaron and his sons with him[a], and the garments, and the anointing oil, and the bull of the sin offering, and the two rams, and the basket of unleavened bread.
translation:
  language: zh_hans
  text: “你要把亚伦和他的儿子们一同带来，也要带来衣服、膏油、作赎罪祭[a]的公牛、两只公绵羊和一篮无酵饼。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“洁净祭”。希伯来语这个词可指与罪有关、也与礼仪洁净有关的祭。
    reason: 保留 חַטָּאת 在祭祀语境中“赎罪祭”与“洁净祭”之间的语义幅度。
lexical_decisions:
- source_word: קַח
  choice: 带来
  rationale: 这是动词 לקח 的阳性单数祈使式。此处摩西奉命召集人并备齐物品，“带来”比孤立的“拿”更自然，也保留命令语气。
- source_word: אַהֲרֹן וְאֶת־בָּנָיו אִתּוֹ
  choice: 亚伦和他的儿子们一同
  rationale: 明确保留 אִתּוֹ“同他一起”的意思；汉语用“一同”自然表达亚伦与众子同时被带来。
- source_word: הַבְּגָדִים
  choice: 衣服
  rationale: בְּגָדִים 的基本义为衣服、衣裳。上下文已表明是祭司所穿的服装，因此正文不额外加入原文没有的“圣”字。
- source_word: שֶׁמֶן הַמִּשְׁחָה
  choice: 膏油
  rationale: 该结构直指用于膏立仪式的油；“膏油”是简洁、通行且能保留礼仪含义的汉语表达。
- source_word: פַּר הַחַטָּאת
  choice: 作赎罪祭的公牛
  rationale: פַּר 是公牛；חַטָּאת 在献祭语境中指与罪及洁净有关的祭。“作……的公牛”清楚说明公牛是祭牲，同时避免生硬的所属结构。
- source_word: שְׁנֵי הָאֵילִים
  choice: 两只公绵羊
  rationale: אַיִל 在此指成年雄羊；“公绵羊”比单说“羊”更准确，也符合现代汉语。
- source_word: סַל הַמַּצּוֹת
  choice: 一篮无酵饼
  rationale: סַל 是篮子，מַצּוֹת 是未发酵的饼类；“一篮无酵饼”自然保留其集合意义。
theological_decisions:
- issue: 献祭语境中 חַטָּאת 的译法
  choice: 赎罪祭
  alternative: 洁净祭
  rationale: 此处该词指一种祭，而不是抽象的“罪”。“赎罪祭”沿用读者熟悉的祭名；但该祭也具有处理礼仪不洁、施行洁净的层面，因此用脚注保留“洁净祭”这一可辩护译法，不把原词的神学张力单一化。
translation_notes:
  register: 采用现代、庄重而易懂的命令句。以“你要”明确单数受命者的语气；用“也要带来”整理希伯来语连续并列结构，使汉语流畅而不删减清单内容。脚注标记紧随“赎罪祭”，准确对应所注释的词。
