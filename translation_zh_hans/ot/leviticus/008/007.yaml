  terminology: “以弗得”保留专门祭司礼服术语，避免擅自限定其形制；“腰带”“精工织带”等表达清晰且符合礼仪服饰语境。脚注a紧邻“精工织带”，列出可行词义选择；脚注b紧邻最后固定动作，准确说明罕见动词及织带的作用，锚点与所注内容相符。
