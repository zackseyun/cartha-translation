  text: וַ/יִּתֵּ֨ן עָלָ֜י/ו אֶת הַ/כֻּתֹּ֗נֶת וַ/יַּחְגֹּ֤ר אֹת/וֹ֙ בָּֽ/אַבְנֵ֔ט וַ/יַּלְבֵּ֤שׁ אֹת/וֹ֙ אֶֽת הַ/מְּעִ֔יל וַ/יִּתֵּ֥ן עָלָ֖י/ו אֶת הָ/אֵפֹ֑ד וַ/יַּחְגֹּ֣ר אֹת֗/וֹ בְּ/חֵ֨שֶׁב֙ הָֽ/אֵפֹ֔ד וַ/יֶּאְפֹּ֥ד ל֖/וֹ בּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/007.yaml
  text: And he put the tunic on him[a], and fastened him with the sash, and clothed him with the robe, and put the ephod on him, and fastened it on him with the skillfully woven band of the ephod[b], and tied the ephod to him with it.
translation:
  language: zh_hans
  text: 他给亚伦穿上内袍，束上腰带，披上外袍，又给他套上以弗得；然后用以弗得的精工织带[a]给他束腰，把以弗得系在他身上[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “精工织带”也可译作“装饰带”或“以弗得的束带”。
    reason: lexical_alternative
  - marker: b
    text: 这里的希伯来语动词很少见，可能表示用以弗得的织带把以弗得固定在亚伦身上。
    reason: cultural_note
lexical_decisions:
- source_word: כֻּתֹּנֶת
  choice: 内袍
  rationale: 指祭司贴身穿的基本长衣；译作“内袍”既符合祭司服饰语境，也可与本节的מְעִיל“外袍”清楚区分。
- source_word: אַבְנֵט
  choice: 腰带
  rationale: 指围束腰部的布带。“腰带”是现代汉语中自然、明确的表达。
- source_word: מְעִיל
  choice: 外袍
  rationale: 指穿在内袍之外的祭司袍服；“外袍”清楚呈现服装层次。
- source_word: אֵפֹד
  choice: 以弗得
  rationale: 这是专门的祭司礼服，汉语没有完全对应的普通服饰名称，故沿用音译以保留礼仪上的特指性。
- source_word: חֵשֶׁב הָאֵפֹד
  choice: 以弗得的精工织带
  rationale: 在祭司服饰语境中，חֵשֶׁב指与以弗得相连、用于束系的织带；“精工织带”兼顾其制作特点和实际功能，同时以脚注保留其他可能译法。
- source_word: וַיַּחְגֹּר אֹתוֹ
  choice: 给他束腰
  rationale: חגר表示以带子围束腰部。“给他束腰”比逐字式表达更符合现代汉语，又准确保留穿戴动作。
- source_word: וַיֶּאְפֹּד לוֹ בּוֹ
  choice: 把以弗得系在他身上
  rationale: 罕见的同源动词אפרד在这里描述借那条织带固定以弗得；译文将隐含宾语明确为“以弗得”，使汉语关系清楚而不改变动作含义。
- source_word: וַיִּתֵּן עָלָיו
  choice: 给他穿上／套上
  rationale: 这是把衣物加在某人身上的表达；按不同服饰分别译为“穿上”和“套上”，使汉语自然并保留穿戴次序。
theological_decisions:
- issue: 祭司礼服术语的处理
  choice: 保留专门术语“以弗得”，其他较常见衣物按其穿着层次译为“内袍、腰带、外袍”
  alternative: 把“以弗得”意译为“围裙式礼服”等描述性名称
  rationale: “以弗得”具有明确的礼仪专属性，而其确切形制不能由本词单独确定；音译避免加入经文未明说的服装形状，同时让普通服饰名称保持易懂。
- issue: 末尾同源动词וַיֶּאְפֹּד的宾语关系
  choice: 译为“把以弗得系在他身上”，并以脚注说明原文强调用织带固定
  alternative: 较逐字地译为“用它给他束上”
  rationale: 希伯来语以罕见的同源动词描述固定以弗得，末尾בּוֹ回指织带。汉语若完全逐字会含混，因此明确动作对象，但不赋予额外的神学含义。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。为避免连续使用“他”造成施事者与受事者混淆，按上文明确受事者为“亚伦”；动作顺序严格依照希伯来文本。分号呈现前后连续而略有层次的穿戴步骤。
