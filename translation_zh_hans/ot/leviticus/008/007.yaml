  source_fidelity: 译文完整保留了希伯来文的穿戴次序：内袍、腰带、外袍、以弗得、以弗得的织带，以及最后借该织带固定以弗得的动作。“给亚伦穿上”明确了承受者，后续省略的代词在汉语中仍可自然回指亚伦。末句“把以弗得系在他身上”恰当地将希伯来文罕见同源动词所隐含的对象关系说清楚；脚注也保留了“用织带固定”的依据。
