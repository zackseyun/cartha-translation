source:
  edition: WLC
  text: וַ/יִּקַּ֨ח מֹשֶׁ֜ה מִ/שֶּׁ֣מֶן הַ/מִּשְׁחָ֗ה וּ/מִן הַ/דָּם֮ אֲשֶׁ֣ר עַל הַ/מִּזְבֵּחַ֒ וַ/יַּ֤ז עַֽל אַהֲרֹן֙ עַל בְּגָדָ֔י/ו וְ/עַל בָּנָ֛י/ו וְ/עַל בִּגְדֵ֥י בָנָ֖י/ו אִתּ֑/וֹ וַ/יְקַדֵּ֤שׁ אֶֽת אַהֲרֹן֙ אֶת בְּגָדָ֔י/ו וְ/אֶת בָּנָ֛י/ו וְ/אֶת בִּגְדֵ֥י בָנָ֖י/ו אִתּֽ/וֹ־־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/030.yaml
  text: Then Moses took some of the anointing oil and some of the blood that was on the altar[a], and sprinkled it on Aaron, on his garments, on his sons, and on the garments of his sons with him; so he consecrated Aaron, his garments, his sons, and the garments of his sons with him.
translation:
  language: zh_hans
  text: 摩西取了一些膏油和坛上的血，把它们洒在亚伦和他的衣服上，也洒在同他在一起的儿子们和他们的衣服上。这样，他使亚伦和他的衣服、同他在一起的儿子们和他们的衣服分别为圣[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “分别为圣”也可译作“使……成圣”。
    reason: 说明קדשׁ的词义选择；“成圣”更简短，“分别为圣”则更清楚地传达本节礼仪性地归作圣用的语境。
lexical_decisions:
- source_word: וַיִּקַּח ... מִשֶּׁמֶן ... וּמִן הַדָּם
  choice: 取了一些膏油和……血
  rationale: 动词意为“取”，两个由מִן引出的成分表示从膏油和血中取出一部分；用“一些”自然表达部分义，而不暗示取了全部。
- source_word: שֶׁמֶן הַמִּשְׁחָה
  choice: 膏油
  rationale: 这是祭司礼仪语境中的专用油。“膏油”是现代中文圣经语体中简洁、清楚且保留礼仪含义的表达。
- source_word: הַדָּם אֲשֶׁר עַל הַמִּזְבֵּחַ
  choice: 坛上的血
  rationale: 以简洁的定中结构表达“在祭坛上的血”，没有增添血的来源或状态。
- source_word: וַיַּז
  choice: 把它们洒在
  rationale: נזה的使役式在祭司礼仪中指洒液体。原文宾语省略，中文补出“它们”，回指前述膏油和血，但不明说二者已经混合。
- source_word: בְּגָדָיו
  choice: 他的衣服
  rationale: בֶּגֶד泛指衣服或衣袍。“衣服”自然易懂，又不额外限定为某一种祭司礼服。
- source_word: בָּנָיו
  choice: 他的儿子们
  rationale: 原文为阳性复数，并具体指参与承接圣职礼的亚伦之子，因此保留“儿子们”。
- source_word: בִּגְדֵי בָנָיו אִתּוֹ
  choice: 同他在一起的儿子们和他们的衣服
  rationale: אִתּוֹ最自然地说明儿子们与亚伦同在。中文调整语序以避免误解为衣服“同他在一起”，同时保留儿子及其衣服这两个对象。
- source_word: וַיְקַדֵּשׁ
  choice: 使……分别为圣
  rationale: קדשׁ在此表示使人和衣服归于神圣用途、为祭司职分而分别出来。“分别为圣”保留圣洁与礼仪设立两层含义。
theological_decisions:
- issue: 祭司承接圣职语境中קדשׁ的译法
  choice: 使……分别为圣
  alternative: 使……成圣；把……奉献为圣
  rationale: “分别为圣”既表达归为圣洁用途，也不把动作缩减为仅仅任命职务；同时避免引入经文未明说的后期教义范畴。
- issue: 亚伦后代的性别指称
  choice: 儿子们
  alternative: 孩子们
  rationale: 希伯来文明确使用阳性复数，且上下文所指是承接祭司职分的亚伦众子，因此不宜改成性别范围更宽的“孩子们”。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。保留原文两次列举亚伦、衣服、儿子们及其衣服的结构性重复；通过“同他在一起的”明确אִתּוֹ所修饰的对象，不额外断定膏油与血是否预先混合。
