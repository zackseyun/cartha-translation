  text: וְ/כִ֥י תַקְרִ֛ב קָרְבַּ֥ן מִנְחָ֖ה מַאֲפֵ֣ה תַנּ֑וּר סֹ֣לֶת חַלּ֤וֹת מַצֹּת֙ בְּלוּלֹ֣ת בַּ/שֶּׁ֔מֶן וּ/רְקִיקֵ֥י מַצּ֖וֹת מְשֻׁחִ֥ים בַּ/שָּֽׁמֶן׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/002/004.yaml
  text: 'And if you bring near an offering of a grain offering baked in an oven[a], it shall be of fine flour: unleavened cakes mixed with oil, or unleavened wafers anointed with oil.'
translation:
  language: zh_hans
  text: 如果你献上炉中烤制的谷物祭，就要用细面做成：用油调和的无酵饼，或[a]抹上油的无酵薄饼。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文作“和”；这里可能是在列举炉烤谷物祭的另一种形式。
    reason: 保留希伯来语连接词的字面形式，同时说明语境中可能表达选择关系。
lexical_decisions:
- source_word: וְכִי
  choice: 如果
  rationale: 在祭祀条例中引出一种条件情形；现代汉语用“如果”即可自然表达，前面的连接词不必机械译出。
- source_word: תַקְרִב קָרְבַּן
  choice: 你献上的是……祭
  rationale: 希伯来语字面有“使靠近／带近祭物”之意；在现代汉语祭祀语境中，“献上”自然体现把祭物带到上帝面前呈献，避免生硬重复“带近一个祭物”。
- source_word: מִנְחָה
  choice: 谷物祭
  rationale: 本章语境所指是以细面和油等制成的特定祭物类别。“谷物祭”比可能引起“素食”联想的“素祭”更直接透明，也保留其礼仪类别。
- source_word: מַאֲפֵה תַנּוּר
  choice: 炉中烤制的
  rationale: 自然表达祭物在烤炉中烘烤的制作方式。
- source_word: סֹלֶת
  choice: 细面
  rationale: 指精细、优质的面粉；“细面”简洁并符合祭物制作语境。
- source_word: חַלּוֹת מַצּוֹת
  choice: 无酵饼
  rationale: 指不用酵制作的饼状食品；采用清楚且通行的礼仪用语。
- source_word: בְּלוּלֹת בַּשֶּׁמֶן
  choice: 调油的
  rationale: 分词表示油混入面或饼料中；“调油”准确区分于后文把油涂在表面的做法。
- source_word: וּרְקִיקֵי מַצּוֹת
  choice: 或[a]……无酵薄饼
  rationale: רְקִיקִים 指薄的饼片。原文连接词通常是“和”，但此处很可能并列炉烤谷物祭可采用的另一种形式，因此正文用“或”，并以脚注保留原文形式与歧义。
- source_word: מְשֻׁחִים בַּשָּׁמֶן
  choice: 抹油的
  rationale: 在食品制作语境中指把油涂抹在薄饼上；“抹油”比带有较强礼仪联想的“膏抹”更准确自然。
theological_decisions:
- issue: מִנְחָה 在祭祀语境中的译法
  choice: 谷物祭
  alternative: 素祭；礼物祭；贡物
  rationale: 该词在其他语境可指礼物或贡物，但利未记第二章明确描述以细面、油等制成的祭物类别。“谷物祭”既保留礼仪专指，又不额外加入宗派性解释。
- issue: 两种炉烤制品之间连接词的关系
  choice: 正文译为“或”，脚注说明原文作“和”
  alternative: 正文直译为“和”
  rationale: 两项看起来是谷物祭的两种可选形态，但希伯来语本身使用普通连接词。正文表达条例中的选择关系，同时用脚注保存原文措辞及其可能的并列理解，不把歧义静默消除。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“谷物祭”突出祭物类别，“调油”与“抹油”分别体现油混入原料和涂在成品上的差别；句式按中文程序性条例自然组织。
