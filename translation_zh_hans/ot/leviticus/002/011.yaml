source:
  edition: WLC
  text: כָּל הַ/מִּנְחָ֗ה אֲשֶׁ֤ר תַּקְרִ֨יבוּ֙ לַ/יהוָ֔ה לֹ֥א תֵעָשֶׂ֖ה חָמֵ֑ץ כִּ֤י כָל שְׂאֹר֙ וְ/כָל דְּבַ֔שׁ לֹֽא תַקְטִ֧ירוּ מִמֶּ֛/נּוּ אִשֶּׁ֖ה לַֽ/יהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/002/011.yaml
  text: Every grain offering that you present to Yahweh shall not be made with leaven[b][a], for you shall not burn any leaven or any honey from it as a food offering to Yahweh.
translation:
  language: zh_hans
  text: 凡你们献给雅威的素祭，都不可用酵制作；因为你们不可把任何酵或蜜[a]在坛上焚烧，作为献给雅威的火祭[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “蜜”在古代用法中也可能包括用果实熬成的糖浆，不一定只指蜂蜜。
    reason: 文化与词义范围说明
  - marker: b
    text: “火祭”指放在祭坛上焚烧献上的祭物。
    reason: 礼仪术语说明
lexical_decisions:
- source_word: הַמִּנְחָה
  choice: 素祭
  rationale: 本章语境明确指以细面或谷物制成的祭物；“素祭”是现代中文圣经语境中通行且简洁的礼仪术语。
- source_word: תַּקְרִיבוּ
  choice: 献给
  rationale: קרב 的使役式在献祭语境中表示把祭物带近并呈献；中文“献给”自然表达对象与礼仪行动。
- source_word: לַיהוָה
  choice: 给雅威
  rationale: 直接音译四字神名 יהוה 为“雅威”，保留其作为盟约之神专名的性质。
- source_word: תֵעָשֶׂה חָמֵץ
  choice: 不可做成发酵的
  rationale: 保留被动结构和成品处于发酵状态的含义，不把所用发酵剂过度限定为现代商品酵母。
- source_word: שְׂאֹר
  choice: 酵
  rationale: 指用于使面团发酵的酵种或发酵剂；“酵”在祭祀法规中准确而简洁。
- source_word: דְּבַשׁ
  choice: 蜜
  rationale: 保留该词通常意义，同时以脚注说明古代用法可能包括果实熬成的糖浆。
- source_word: תַקְטִירוּ
  choice: 在坛上焚烧
  rationale: 该动词在献祭语境中指使祭物在祭坛上焚烧而烟气上升；补出“在坛上”以清楚传达礼仪动作，而非普通焚烧。
- source_word: מִמֶּנּוּ
  choice: 不单独明译
  rationale: 希伯来文单数代词的指向可能是前述材料或素祭；中文直接说“任何酵和蜜……都不可”已自然传达禁止取其中任何部分焚献的意思，避免生硬且可能误导的“从它”。
- source_word: אִשֶּׁה
  choice: 火祭
  rationale: 这是由火焚献的祭坛供物这一礼仪类别；“火祭”简洁保留与火有关的词义，脚注进一步解释。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名，采用“雅威”以专名形式呈现，不以称号替代。
- issue: אִשֶּׁה 的礼仪含义
  choice: 火祭
  alternative: 献给雅威的食物；经火献上的祭物
  rationale: 保留该术语与祭坛之火的明确关联，又不把“食物”这一可能的礼仪意象强加为唯一解释；脚注说明其实际献呈方式。
- issue: 蜜的范围
  choice: 正文译“蜜”，脚注保留广义可能
  alternative: 蜂蜜；果蜜
  rationale: דבש 可指蜂蜜，在古代用法中也可能涵盖果实糖浆；正文不武断限定，脚注保存历史语义范围。
translation_notes:
  register: 采用庄重而清楚的现代标准普通话。“素祭”“火祭”保留利未记礼仪体系中的术语连续性；句式避免过度古雅。“在坛上”属于语境明示，有助于区别普通焚烧与献祭焚烧。
