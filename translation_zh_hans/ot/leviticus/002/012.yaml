id: LEV.2.12
reference: Leviticus 2:12
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: קָרְבַּ֥ן רֵאשִׁ֛ית תַּקְרִ֥יבוּ אֹתָ֖/ם לַ/יהוָ֑ה וְ/אֶל הַ/מִּזְבֵּ֥חַ לֹא יַעֲל֖וּ לְ/רֵ֥יחַ נִיחֹֽחַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/002/012.yaml
  text: As an offering of firstfruits you may present them to Yahweh[b][a], but they must not go up on the altar as a pleasing aroma.
translation:
  language: zh_hans
  text: 你们可以把它们作为初熟供物献给雅威；但不可把它们献在祭坛上，作为蒙悦纳的香气。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “献在祭坛上”直译为“上到祭坛”；这里指把供物放在祭坛上焚献。
    reason: lexical_alternative
lexical_decisions:
- source_word: קָרְבַּן רֵאשִׁית
  choice: 作为初熟之物的供物
  rationale: 保留原文结构中“供物”与“初熟之物”的关系，并与上节所说有酵和蜜之物相衔接；此处并非笼统的“初熟果子”。
- source_word: תַּקְרִיבוּ אֹתָם
  choice: 你们可以把它们献上
  rationale: קרב 的使役形在祭祀语境中指把东西带来献给神；结合下半句的禁止，译作“可以”清楚表达这些东西可作为初熟供物奉献。复数“它们”照应上一节的相关物品。
- source_word: לַיהוָה
  choice: 给雅威
  rationale: 介词 ל 表示奉献的对象；יהוה按其专名译作“雅威”。
- source_word: וְאֶל הַמִּזְבֵּחַ לֹא יַעֲלוּ
  choice: 但不可把它们献上祭坛
  rationale: 连接词在此表示对比。עלה 字面为“上去”，在祭坛语境中指把供物献到坛上；中文用主动表达更自然，同时保留祭祀含义。
- source_word: לְרֵיחַ נִיחֹחַ
  choice: 作为蒙悦纳的香气
  rationale: 这是祭祀用语，既保留“香气”的意象，也表达 ניחוח 所含的悦纳意味，而不把它简化为仅仅气味宜人。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”较直接反映其通常重建的读音，并保留这是专名而非称号。
- issue: “蒙悦纳的香气”是否表示这些供物本身不蒙神悦纳
  choice: 仅表明不可在祭坛上把它们作为蒙悦纳的香气献上
  alternative: 把整句解释为这些供物完全不蒙悦纳
  rationale: 本节前半句明确允许把它们作为初熟供物献给雅威，后半句限制的是上祭坛的方式；译文保留这种张力，不扩大禁令。
translation_notes:
  register: 采用庄重而自然的现代普通话。“供物”“祭坛”“蒙悦纳的香气”保留祭祀语境；句式清楚区分可以奉献与不可上坛焚献。
