  text: וְ/הַ/נּוֹתֶ֨רֶת֙ מִן הַ/מִּנְחָ֔ה לְ/אַהֲרֹ֖ן וּ/לְ/בָנָ֑י/ו קֹ֥דֶשׁ קָֽדָשִׁ֖ים מֵ/אִשֵּׁ֥י יְהוָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/002/003.yaml
  text: And what is left of the grain offering shall be for Aaron and for his sons[a], a most holy portion from the food offerings of Yahweh.
translation:
  language: zh_hans
  text: 素祭所剩下的，要归亚伦和他的子孙；这是耶和华的火祭[a]中至圣的部分。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “火祭”也可译作“献给耶和华的食物祭”，或“献给耶和华、经火献上的祭”。
    reason: אִשֶּׁה是祭祀专门用语，可强调经火献上的方式，也可指献给神的食物祭这一礼仪类别。
lexical_decisions:
- source_word: וְהַנּוֹתֶרֶת
  choice: 剩下的
  rationale: 带定冠词的分词作名词使用，指素祭余下的部分；“剩下的”自然简明，并保留其余物之意。
- source_word: מִן הַמִּנְחָה
  choice: 素祭
  rationale: 本章的 מִנְחָה 特指以细面等谷物为主要材料的祭物；“素祭”是现代中文圣经语境中通行且简洁的礼仪术语。
- source_word: לְאַהֲרֹן וּלְבָנָיו
  choice: 要归亚伦和他的子孙
  rationale: 介词 לְ 在此表达分配或归属；“要归”清楚传达祭司所得的份。
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: 至圣的部分
  rationale: 该叠加结构表示最高程度的圣；补出“部分”，明确所描述的是素祭余下之物，避免被误解为圣所中的“至圣所”。
- source_word: מֵאִשֵּׁי יְהוָה
  choice: 献给耶和华的火祭中
  rationale: אִשֶּׁה 是与祭坛焚烧有关的祭祀术语，מִן 在此把该部分归入这类祭物；“火祭”保留词语的火焚关联，而脚注注明可表达为“食物祭”。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文读者熟悉的专名形式呈现四字神名，而不只用一般性的称号替代。
theological_decisions:
- issue: קֹדֶשׁ קָדָשִׁים 的礼仪分类
  choice: 至圣的部分
  alternative: 至圣；圣中之圣
  rationale: 译文保留祭祀制度中最高圣洁等级的含义，同时避免“圣中之圣”被误读为帐幕或圣殿的地点名称。
- issue: אִשֵּׁי יְהוָה 的祭祀含义
  choice: 献给耶和华的火祭
  alternative: 耶和华的食物祭；献给耶和华的经火之祭
  rationale: 原词既有经火献上的语源和礼仪关联，也可作献给神之“食物祭”的技术称谓；正文采用简明的“火祭”，并以脚注保存另一种合理理解。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“素祭”“火祭”“至圣”保留利未记祭祀制度所需的术语一致性；句法稍作显化，以“部分”明确指代余下的祭物。
