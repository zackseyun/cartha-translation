id: LEV.2.9
reference: Leviticus 2:9
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/הֵרִ֨ים הַ/כֹּהֵ֤ן מִן הַ/מִּנְחָה֙ אֶת אַזְכָּ֣רָתָ֔/הּ וְ/הִקְטִ֖יר הַ/מִּזְבֵּ֑חָ/ה אִשֵּׁ֛ה רֵ֥יחַ נִיחֹ֖חַ לַ/יהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/002/009.yaml
  text: Then the priest shall lift up from the grain offering its memorial portion and burn it on the altar[a], a food offering, a pleasing aroma to Yahweh.
translation:
  language: zh_hans
  text: 祭司要从素祭中取出作为纪念的那一份，在祭坛上焚烧；这是献给耶和华的火祭，是蒙悦纳的香气。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “火祭，是蒙悦纳的香气”也可译作“以火献上的祭物，是献给耶和华的怡人香气”。
    reason: 保留 אִשֵּׁה 与 רֵיחַ נִיחֹחַ 这一祭祀公式在类别和语气上的译法差异。
lexical_decisions:
- source_word: וְהֵרִים
  choice: 取出
  rationale: 该词在此指祭司从素祭中取出一部分用于献祭；“取出”自然清楚，也保留了从整体中举取、移出的仪式动作。
- source_word: הַכֹּהֵן
  choice: 祭司
  rationale: 祭祀语境中 כֹּהֵן 的标准现代汉语译法。
- source_word: מִן הַמִּנְחָה
  choice: 从素祭中
  rationale: 利未记第2章的 מִנְחָה 特指以细面、谷物制成的祭物；“素祭”是简洁而通行的中文礼仪术语。
- source_word: אֶת אַזְכָּרָתָהּ
  choice: 作为纪念的那一份
  rationale: 此处指从整个素祭中取出并焚烧的代表性部分。“那一份”明确是部分祭物，“作为纪念”保留该词的纪念功能，同时不武断解释纪念的对象或方式。
- source_word: וְהִקְטִיר
  choice: 焚烧
  rationale: קטר 的使役式在献祭语境中指在坛上烧祭物、使之化为烟；“焚烧”庄重自然，并保留祭坛动作。
- source_word: הַמִּזְבֵּחָה
  choice: 在祭坛上
  rationale: 带方向词尾的 מִזְבֵּחָה 在此惯用结构中表示祭物被烧在祭坛上，中文宜译为处所。
- source_word: אִשֵּׁה
  choice: 火祭
  rationale: 该词语源和祭祀用法均与火有关。“火祭”直接保留原文类别，避免把有争议的“献给上帝的食物”解释写入正文。
- source_word: רֵיחַ נִיחֹחַ
  choice: 蒙悦纳的香气
  rationale: 该固定祭祀用语既保留气味意象，也表达祭物蒙神悦纳的语用含义；比单纯的“怡人香气”更贴合祭祀语境。
- source_word: לַיהוָה
  choice: 献给耶和华的
  rationale: 介词 לְ 表明献祭的对象；专名 יהוה 译为“耶和华”，符合现代简体中文圣经语境中的通行辨识形式。
theological_decisions:
- issue: אִשֵּׁה 的祭祀含义
  choice: 火祭
  alternative: 献给耶和华的食物祭
  rationale: “火祭”紧贴词形及火焚祭祀语境，又不预先断定该词在此是否应按祭物作为神之“食物”的祭司传统意象来表达。
- issue: רֵיחַ נִיחֹחַ 所表达的神人关系
  choice: 蒙悦纳的香气
  alternative: 怡人的香气／使人舒畅的香气
  rationale: 正文保留原文的拟人化气味意象，并呈现祭物蒙悦纳的祭祀意义，但不引入赎罪机制或其他后期神学解释。
- issue: אַזְכָּרָה 的指向
  choice: 作为纪念的那一份
  alternative: 纪念份／使人记念的那一份
  rationale: 原词可涉及纪念、提醒或代表性献上，具体是谁记念谁并未在本节说明；译文保留这一开放性。
translation_notes:
  register: 采用现代、庄重而易懂的礼仪用语。“素祭”“祭司”“祭坛”“火祭”保持利未记祭祀词汇的一致性；句法按希伯来文动作顺序展开，同时用分号使中文层次清楚。
