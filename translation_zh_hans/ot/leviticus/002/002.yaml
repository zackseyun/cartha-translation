source:
  edition: WLC
  text: וֶֽ/הֱבִיאָ֗/הּ אֶל בְּנֵ֣י אַהֲרֹן֮ הַ/כֹּהֲנִים֒ וְ/קָמַ֨ץ מִ/שָּׁ֜ם מְלֹ֣א קֻמְצ֗/וֹ מִ/סָּלְתָּ/הּ֙ וּ/מִ/שַּׁמְנָ֔/הּ עַ֖ל כָּל לְבֹנָתָ֑/הּ וְ/הִקְטִ֨יר הַ/כֹּהֵ֜ן אֶת אַזְכָּרָתָ/הּ֙ הַ/מִּזְבֵּ֔חָ/ה אִשֵּׁ֛ה רֵ֥יחַ נִיחֹ֖חַ לַ/יהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/002/002.yaml
  text: He shall bring it to Aaron’s sons[a], the priests, and he shall take from there a handful of its fine flour and some of its oil, with all of its frankincense. Then the priest shall burn its memorial portion on the altar, a food offering, a pleasing aroma to Yahweh.
translation:
  language: zh_hans
  text: 他要把素祭带到亚伦的子孙，就是众祭司那里。祭司要从那里取一满把细面和一些油，并取所有的乳香；他要把这素祭的纪念部分焚烧在祭坛上，作为献给雅威的火祭，成为蒙他悦纳的馨香。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “火祭”也可译作“经火献上的祭物”；这个希伯来祭祀术语的确切含义仍有讨论。
    reason: 说明אִשֵּׁה的词义存在真实的不确定性，并提供较展开的形式对应译法。
lexical_decisions:
- source_word: וֶהֱבִיאָהּ
  choice: 他要把素祭带到
  rationale: 以“素祭”明确阴性代词所指，承接上文，并保留祭祀条例的程序语气。
- source_word: בְּנֵי אַהֲרֹן הַכֹּהֲנִים
  choice: 亚伦的子孙、众祭司
  rationale: 保留亲属称谓及同位语“祭司”；“子孙”适合祭司家系的延续含义。
- source_word: וְקָמַץ מִשָּׁם מְלֹא קֻמְצוֹ
  choice: 祭司要从其中抓取满满一把
  rationale: קמץ指合手抓取，מְלֹא קֻמְצוֹ是手所能抓满的量；“从其中”自然表达מִשָּׁם在本语境中的来源。
- source_word: מִסָּלְתָּהּ וּמִשַּׁמְנָהּ
  choice: 细面和一些油
  rationale: סֹלֶת是祭物所用细面；油只取与一把细面相伴的部分，故加“一些”，避免误解为取尽所有的油。
- source_word: עַל כָּל לְבֹנָתָהּ
  choice: 并取所有的乳香
  rationale: 明确乳香须全部取用，并将介词结构按中文动作关系展开。
- source_word: וְהִקְטִיר
  choice: 焚烧
  rationale: 该词在祭祀语境中指在坛上烧献、使之化为烟；“焚烧”简洁而保留礼仪意义。
- source_word: אַזְכָּרָתָהּ
  choice: 素祭中纪念的一份
  rationale: 这是祭司文献中的专门用语，指从全祭物中取出烧献的一份；保留“纪念”而不擅自说明纪念的对象或作用。
- source_word: אִשֵּׁה
  choice: 火祭
  rationale: 该祭祀术语与火中烧献密切相关；“火祭”在中文中简明，并避免把并不确定的“食物”含义写入正文。
- source_word: רֵיחַ נִיחֹחַ
  choice: 蒙他悦纳的香气
  rationale: 保留气味意象，并以“蒙他悦纳”传达ניחוח在祭祀公式中表示取悦、悦纳的含义。
- source_word: יהוה
  choice: 雅威
  rationale: 直接音译四字神名，与普通称号“主”区分。
theological_decisions:
- issue: 献祭者与抓取祭物者的主语转换
  choice: 第二句明说“祭司要”
  alternative: 继续使用“他要”
  rationale: 希伯来文动词为第三人称单数，语境表明实际抓取并烧献的是亚伦子孙中的一名祭司；中文明说主语可避免误以为献祭者亲自执行。
- issue: אַזְכָּרָתָהּ的含义
  choice: 素祭中纪念的一份
  alternative: 纪念祭；使人想起的一份
  rationale: 保留该术语中真实存在的“纪念”概念，却不判定它是使上帝记念、使献祭者记念，还是祭物的代表部分。
- issue: אִשֵּׁה的译法
  choice: 火祭
  alternative: 食物祭；经火献上的祭物
  rationale: 词源和准确语义存在讨论；本节的焚烧动作明确支持与火有关的译法，而“食物祭”会较强地导入食物意象。
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 采用较贴近学界通常重构读音的音译，并保留专名性质。
translation_notes:
  register: 采用现代、庄重而易懂的祭祀条例语体。“素祭”“祭司”“祭坛”“乳香”沿用通行圣经及礼仪词汇；句法适度拆分，以清楚呈现带来、抓取和焚烧三个步骤。
