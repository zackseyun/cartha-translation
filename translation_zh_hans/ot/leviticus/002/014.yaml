revisions:
- from: 如果你向雅威献初熟之物的素祭，就要把用火烘烤的新鲜麦穗，以及碾碎的新麦粒，作为初熟之物的素祭献上。[a]
  to: 如果你向雅威献初熟之物的素祭，就要把用火烘烤的青穗和粗碎的新谷，作为你的初熟之物的素祭献上。[a]
  rationale: 修订去除了原文没有的“小麦”限定，以“青穗”和“新谷”保留原文的谷物与初熟意象；以“粗碎”更贴合גֶּרֶשׂ。两次“献”及“初熟之物的素祭”仍保留，以反映原文重复的礼仪呈献用语。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T04:50:46Z'
review_pass:
  verdict: revise
  source_fidelity: 译文总体保留了向雅威献初熟之物之素祭的条件句、两次献上的礼仪动作和经火处理谷物的画面。但“麦穗／麦粒”把原文泛指的谷物无依据地限定为小麦；此外，אָבִיב与גֶּרֶשׂ כַּרְמֶל在句中是并列/补充性的谷物描述，不宜以“新鲜麦穗，以及碾碎的新麦粒”造成过强的两种明确麦制品之感。
  naturalness: “新鲜麦穗”在现代汉语农业语境中不如“青穗”自然；“碾碎的新麦粒”也略显生硬。改为“用火烘烤的青穗和粗碎的新谷”庄重、清楚，且不作无根据的作物种类限定。
  terminology: “雅威”“素祭”“初熟之物”均可保留。“素祭”是利未记第二章语境中已确立且易识别的祭祀术语。
