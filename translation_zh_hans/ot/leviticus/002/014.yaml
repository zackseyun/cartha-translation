  text: וְ/אִם תַּקְרִ֛יב מִנְחַ֥ת בִּכּוּרִ֖ים לַ/יהוָ֑ה אָבִ֞יב קָל֤וּי בָּ/אֵשׁ֙ גֶּ֣רֶשׂ כַּרְמֶ֔ל תַּקְרִ֕יב אֵ֖ת מִנְחַ֥ת בִּכּוּרֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/002/014.yaml
  text: And if you present to Yahweh an offering of firstfruits, you shall present your offering of firstfruits as fresh heads of grain roasted in the fire, crushed kernels from the fresh grain.
translation:
  language: zh_hans
  text: 如果你向雅威献初熟之物的素祭，就要把用火烘烤的青穗和粗碎的新谷，作为你的初熟之物的素祭献上。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“用火烤过的鲜穗，即鲜谷制成的碎粒。”
    reason: אָבִיב、גֶּרֶשׂ和כַּרְמֶל的精确农业指涉及三者之间的句法关系仍有词汇层面的不确定性；此译法保留“鲜穗／鲜谷”及“碎粒”的另一种可行理解。
lexical_decisions:
- source_word: מִנְחַת
  choice: 素祭
  rationale: 在利未记第2章的祭祀语境中，מִנְחָה特指以谷物为主的祭物；“素祭”是简明而通行的中文礼仪术语。
- source_word: בִּכּוּרִים / בִּכּוּרֶיךָ
  choice: 初熟之物
  rationale: 指最早成熟并献给上帝的出产；“初熟之物”既保留农业含义，也符合祭祀语境。
- source_word: לַיהוָה
  choice: 向雅威
  rationale: 原文直接使用神圣四字名יהוה；音译为“雅威”，保留其作为盟约之名的性质。
- source_word: אָבִיב
  choice: 新鲜麦穗
  rationale: אָבִיב指尚新鲜、处于穗中阶段的谷物；“新鲜麦穗”自然具体，同时不过度限定成熟程度。
- source_word: קָלוּי בָּאֵשׁ
  choice: 用火烘烤
  rationale: 准确表达谷物经火烤制的处理方式，符合现代汉语表达。
- source_word: גֶּרֶשׂ
  choice: 碾碎的……麦粒
  rationale: 该词表示经压碎或粗碎的谷粒；“碾碎的麦粒”具体易懂。
- source_word: כַּרְמֶל
  choice: 新麦粒
  rationale: 此处不是地名，而指新鲜的新收谷物；与גֶּרֶשׂ连用，表达由新谷制成的碎粒。
- source_word: תַּקְרִיב ... תַּקְרִיב
  choice: 献……献上
  rationale: 重复保留קרב使役式所表达的礼仪性呈献动作，同时使中文流畅。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华／上主
  rationale: 原文明确使用יהוה；采用“雅威”作为音译，保留经文中的专名性质，不以称号替代。
- issue: מִנְחָה在本章中的祭物类别
  choice: 素祭
  alternative: 供物／谷物祭
  rationale: 利未记第2章整体规定以谷物为材料的מִנְחָה；译作“素祭”保留其专门祭名，但不额外引入献祭功效方面的解释。
translation_notes:
  register: 采用庄重、清晰的现代标准汉语。保留原文“献……献上”的重复和祭祀语气；正文用较具体的农业图像，脚注呈现相关希伯来词组的另一种合理理解。
