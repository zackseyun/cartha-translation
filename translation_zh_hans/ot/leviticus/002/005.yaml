base_translation:
  language: en
  yaml_path: translation/ot/leviticus/002/005.yaml
  text: And if your offering is a grain offering on the griddle[a], it shall be of fine flour mixed with oil, unleavened.
translation:
  language: zh_hans
  text: 如果你献的是在煎盘[a]上制作的素祭，就要用油调和细面，且要无酵。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“平底锅”。希伯来语所指的是制作这种素祭时使用的平坦炊具。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִנְחָה
  choice: 素祭
  rationale: 本章中该词特指以细面等谷物制成的祭物；“素祭”是现代中文圣经语境中简洁而明确的既定称呼。
- source_word: עַל הַמַּחֲבַת
  choice: 在烤盘上
  rationale: 该短语指在平坦的炊具表面上制作祭物；“烤盘”自然易懂，同时在脚注中保留“平底锅”的可能译法。
- source_word: קָרְבָּנְךָ
  choice: 你的供物
  rationale: 该词泛指献上的祭物，此处与“素祭”构成说明关系；译作“你的供物”既保留第二人称，也避免把两个近义词机械合并。
- source_word: סֹלֶת
  choice: 细面
  rationale: 指精细研磨的优质面粉，是祭祀条例中的固定原料；“细面”准确、凝练，并符合中文宗教法规文体。
- source_word: בְּלוּלָה בַשֶּׁמֶן
  choice: 调油的
  rationale: 分词表示面粉与油混合，并未明确限定为揉制；“调油”在中文中简洁表达混合过程而不过度具体化。
- source_word: מַצָּה
  choice: 不可发酵
  rationale: 此处描述祭物应处于无酵状态，并非另指一块无酵饼；采用否定式能自然表达该要求。
- source_word: תִהְיֶה
  choice: 就要
  rationale: 未完成体在此具有法规性的规定语气；“就要”在现代中文中清楚传达要求，同时不额外强化为绝对命令。
