base_translation:
  language: en
  yaml_path: translation/ot/leviticus/002/010.yaml
  text: And what remains of the grain offering shall be for Aaron and for his sons[a], most holy from the food offerings of Yahweh.
translation:
  language: zh_hans
  text: 素祭所剩下的要归亚伦和他的子孙；这是献给耶和华的火祭中至圣的部分。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “火祭”或译“食物供物”；指献给耶和华的祭物，传统上理解为经火献上的祭物。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַנּוֹתֶרֶת
  choice: 所剩下的
  rationale: 带冠词的分词作名词使用，指素祭献烧之后留下的部分；“所剩下的”自然并准确。
- source_word: מִן הַמִּנְחָה
  choice: 素祭
  rationale: 本章的 מִנְחָה 特指以细面等谷物为主的祭物；“素祭”是简明且通行的中文祭祀术语。
- source_word: לְאַהֲרֹן וּלְבָנָיו
  choice: 要归亚伦和他的子孙
  rationale: 介词 לְ 表示分配或归属；“要归”保留律法条文的规定语气。
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: 至圣的
  rationale: 这是希伯来语表达最高程度的结构，意为“最为神圣”；不增补原文没有的“份”。
- source_word: מֵאִשֵּׁי
  choice: 火祭
  rationale: אִשֶּׁה 指经火献上的祭物；“火祭”简洁地保留献祭方式，同时以脚注注明另一种语义理解。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文读者熟悉的专名“耶和华”呈现四字神名，而非以一般称号代替。
theological_decisions:
- issue: קֹדֶשׁ קָדָשִׁים 的修饰关系
  choice: 这是……中至圣的
  alternative: 这是至圣的一份
  rationale: 原文只说“至圣”，未明说“份”；正文保留其简洁性，并让它指向素祭所剩下的部分。
- issue: אִשֵּׁי יְהוָה 的含义
  choice: 献给耶和华的火祭
  alternative: 耶和华的食物祭
  rationale: 词形与祭物经火献上的含义关系最直接；但祭司传统中也可能突出献给上帝的“食物”这一祭祀意象，故以脚注保留。
translation_notes:
  register: 采用现代、庄重而易懂的律法文体。“要归”体现规定语气；分号帮助读者辨明归属规定与圣洁等级的说明。
