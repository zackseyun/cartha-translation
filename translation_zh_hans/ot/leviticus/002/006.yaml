  text: 要把它掰成小块，再浇上油；这是素祭。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פָּת֤וֹת אֹתָהּ פִּתִּים
  choice: 要把它掰成小块
  rationale: 不定式绝对形在祭祀条例中具有命令作用；“掰成小块”自然表达将烤制祭物分成若干块的动作和结果。
- source_word: וְיָצַקְתָּ
  choice: 再浇上
  rationale: 带连接词的第二人称阳性单数完成式在指示程序中具有命令作用；“再”清楚体现动作次序。
- source_word: עָלֶיהָ שָׁמֶן
  choice: 浇上油
  rationale: על表示把油施加在祭物上；原文只说“油”，不增补为“橄榄油”。
- source_word: מִנְחָה
  choice: 素祭
  rationale: 本章语境中这是由细面或谷物制成的祭物；“素祭”是现代中文圣经语境中简洁且通行的礼仪术语。
- source_word: הִוא
  choice: 这是
  rationale: 独立代词对刚才所述祭物作出认定；中文用“这是”表达自然。
