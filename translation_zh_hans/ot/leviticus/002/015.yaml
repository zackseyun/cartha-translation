  yaml_path: translation/ot/leviticus/002/015.yaml
  text: And you shall put oil on it[a], and place frankincense on it; it is a grain offering.
translation:
  language: zh_hans
  text: 要在上面浇油，把乳香放在上面；这是素祭。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְנָתַתָּ
  choice: 要……浇
  rationale: נתן含义宽泛，可指“给、放、置”。此处宾语是油，汉语礼仪指令中“浇油”自然准确，也保留将油施于供物之上的动作。
- source_word: עָלֶיהָ
  choice: 在上面
  rationale: 介词עַל加阴性单数后缀，指油和乳香置于前述供物之上；“在上面”符合现代汉语习惯。
- source_word: שֶׁמֶן
  choice: 油
  rationale: 原文只说“油”，虽在献祭语境中通常指橄榄油，译文不增补原文未明说的种类。
- source_word: וְשַׂמְתָּ
  choice: 把……放
  rationale: שׂים意为“放、安置”；“把乳香放在上面”清楚表达有意安放祭物成分的动作。
- source_word: לְבֹנָה
  choice: 乳香
  rationale: לְבֹנָה专指乳香，而非泛指各种香料或香。
- source_word: מִנְחָה
  choice: 素祭
  rationale: 在利未记献祭法规中，מִנְחָה指以谷物等为主要材料的祭物；“素祭”是简洁而通行的中文圣经礼仪术语。
- source_word: הִוא
  choice: 这是
  rationale: 阴性单数代词回指刚描述的供物，构成简单判断句；中文用“这是素祭”自然明确。
