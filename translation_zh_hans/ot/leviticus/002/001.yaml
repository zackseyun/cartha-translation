  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/נֶ֗פֶשׁ כִּֽי תַקְרִ֞יב קָרְבַּ֤ן מִנְחָה֙ לַֽ/יהוָ֔ה סֹ֖לֶת יִהְיֶ֣ה קָרְבָּנ֑/וֹ וְ/יָצַ֤ק עָלֶ֨י/הָ֙ שֶׁ֔מֶן וְ/נָתַ֥ן עָלֶ֖י/הָ לְבֹנָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/002/001.yaml
  text: When a person presents a grain offering to Yahweh[a], his offering shall be of fine flour[b], and he shall pour oil on it and put frankincense on it.
translation:
  language: zh_hans
  text: 若有人向雅威[a]献素祭[b]，他的供物要用细面；他要在上面浇上油，并放上乳香。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “雅威”是希伯来文 יהוה 所表示的神名。
    reason: divine_name
  - marker: b
    text: “素祭”指以谷物制品为主体的祭物；本节所说的是细面。
    reason: cultural_note
lexical_decisions:
- source_word: נֶפֶשׁ
  choice: 人
  rationale: 该词本义可指“生命、魂”，但在这里的律法表述中指一个人；译作“有人”自然地保留了泛指的单数意义，也避免引入形而上的含义。
- source_word: תַקְרִיב
  choice: 献
  rationale: 使役形在献祭语境中表示把供物带近、呈献；现代汉语用“献”简洁而准确。
- source_word: קָרְבַּן
  choice: 供物
  rationale: 这是“带近来献上之物”的通称；“供物”既可与后面的“素祭”区别，也符合祭祀语境。
- source_word: מִנְחָה
  choice: 素祭
  rationale: 在利未记的祭祀制度中，该词特指以谷物制品为主体的祭物；“素祭”是简明且通行的中文名称，但其含义通过脚注说明。
- source_word: לַיהוָה
  choice: 向雅威
  rationale: 介词 ל 表示献祭所归向的对象，译作“向”；יהוה按其专名性质音译为“雅威”。
- source_word: סֹלֶת
  choice: 细面
  rationale: 指经过精细加工的优质面粉；“细面”简洁，并符合本段祭物材料的语境。
- source_word: יִהְיֶה קָרְבָּנוֹ
  choice: 他的供物要用细面
  rationale: 保留希伯来文第三人称阳性单数的代表性律法表述；中文以“要用细面”自然说明供物的构成。
- source_word: וְיָצַק עָלֶיהָ שֶׁמֶן
  choice: 并要浇油在上面
  rationale: 准确表达把油倾倒在细面祭物之上的动作；“要”体现律法指示的语气。
- source_word: וְנָתַן עָלֶיהָ לְבֹנָה
  choice: 放上乳香
  rationale: לְבֹנָה 是用于敬拜的芳香树脂“乳香”；中文省去重复宾语仍清楚指向供物。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名。音译“雅威”保留其作为盟约之神专名的性质，而不以称号替代。
- issue: 律法中阳性单数形式的处理
  choice: 他的供物
  alternative: 其供物；他们的供物
  rationale: 原文使用第三人称阳性单数后缀，属于代表性单数。译文保留“他的”，不把单数改成复数，同时“若有人”表明规定适用于任何献祭者。
- issue: מִנְחָה 在本节中的祭物类别
  choice: 素祭
  alternative: 谷物祭；礼物
  rationale: 该词本可泛指礼物或贡物，但在本章祭祀语境中已成为特定祭类，其材料在本节明确为细面；译作“素祭”并用脚注解释，既保留专门类别，也不误作泛称。
translation_notes:
  register: 采用现代、庄重而易懂的律法文体。“若有人……要……”自然呈现希伯来文的条件句和规范语气；保留代表性单数，但避免生硬直译 נֶפֶשׁ 为“魂”。
