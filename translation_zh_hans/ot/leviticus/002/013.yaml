source:
  edition: WLC
  text: וְ/כָל קָרְבַּ֣ן מִנְחָתְ/ךָ֮ בַּ/מֶּ֣לַח תִּמְלָח֒ וְ/לֹ֣א תַשְׁבִּ֗ית מֶ֚לַח בְּרִ֣ית אֱלֹהֶ֔י/ךָ מֵ/עַ֖ל מִנְחָתֶ֑/ךָ עַ֥ל כָּל קָרְבָּנְ/ךָ֖ תַּקְרִ֥יב מֶֽלַח־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/002/013.yaml
  text: And every offering of your grain offering you shall season with salt[a]. You shall not let the salt of the covenant of your God be lacking from your grain offering[c][b]; with all your offerings you shall offer salt.
translation:
  language: zh_hans
  text: 你素祭的每一样供物都要加盐[a]；不可使你神之约的盐从你的素祭中缺少[b]。你的一切供物都要加盐[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“你要以盐加盐。”
    reason: 保留希伯来文名词“盐”与同根动词并用的表达。
  - marker: b
    text: “你神之约的盐”也可译作“你神的约之盐”。原文保留了盐与约之间的祭祀性关联，没有在这里进一步解释。
    reason: 说明原文的属格表达及其有意保留的含义空间。
  - marker: c
    text: 或译：“在你一切的供物上，都要献上盐。”
    reason: 保留介词 עַל 和动词“献上”的较直译表达。
lexical_decisions:
- source_word: קָרְבַּן
  choice: 供物
  rationale: 这是涵盖面较广的献祭用语。译作“供物”既自然，也能与本节特指的“素祭”区分。
- source_word: מִנְחָה
  choice: 素祭
  rationale: 在利未记第2章，此词特指以谷物为主的祭物；“素祭”是现代中文圣经语境中清楚而简洁的专门称呼。
- source_word: בַּמֶּלַח תִּמְלָח
  choice: 用盐调和
  rationale: 原文以名词“盐”和同根动词“加盐”并用。中文译作“用盐调和”自然地表达祭物必须加盐，同时脚注保留较直译的形式。
- source_word: תַשְׁבִּית
  choice: 不可让……缺少
  rationale: 此处使役形表达使某物停止、除去或任其缺少；“不可让……缺少”准确体现禁令。
- source_word: מֶלַח בְּרִית אֱלֹהֶיךָ
  choice: 你神立约的盐
  rationale: 保留“盐”与“约”之间未经解释的原文关系，不将其象征意义扩写进正文；中文用“立约的盐”较自然，也保持修饰关系的可能张力。
- source_word: מֵעַל
  choice: 从……中
  rationale: 原义接近“从……上面”，在“缺少”的中文句式中译作“从……中”更自然，并保留不得从素祭撤去盐的意思。
- source_word: עַל כָּל קָרְבָּנְךָ
  choice: 你献上的一切供物都要加盐
  rationale: 介词 עַל 可直译为“在……上”；整句依中文习惯重组，清楚表达每一种供物上都必须有盐。
- source_word: תַּקְרִיב
  choice: 献上
  rationale: קרב 的使役形在献祭语境中通常指把祭物呈献出来；“献上”符合自然、庄重的现代中文祭祀用语。
theological_decisions:
- issue: 是否解释“你神立约的盐”的象征意义
  choice: 正文保留“你神立约的盐”这一约的表达
  alternative: 你神之约的象征——盐；你神立约所规定的盐
  rationale: 原文本身没有说明盐如何关联于约。直保留这一意象，可避免把持久、忠诚等可能含义中的某一种定为唯一解释。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“素祭”保留本章的祭礼专名；“供物”用于较广义的 קָרְבַּן。正文避免生硬重复，脚注则呈现希伯来文的同根重复、介词形式以及“盐—约”表达的真实含混性。
