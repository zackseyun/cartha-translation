id: LEV.2.8
reference: Leviticus 2:8
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/הֵבֵאתָ֣ אֶת הַ/מִּנְחָ֗ה אֲשֶׁ֧ר יֵעָשֶׂ֛ה מֵ/אֵ֖לֶּה לַ/יהוָ֑ה וְ/הִקְרִיבָ/הּ֙ אֶל הַ/כֹּהֵ֔ן וְ/הִגִּישָׁ֖/הּ אֶל הַ/מִּזְבֵּֽחַ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/002/008.yaml
  text: And you shall bring the grain offering that is made from these things to Yahweh[a], and he shall present it to the priest, and he shall bring it near to the altar.
translation:
  language: zh_hans
  text: 你要把用这些材料制成的素祭带来，献给雅威[a]；他要把它呈给祭司，并带到祭坛那里[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“带到雅威那里”。希伯来语介词可表示趋向，也可表示奉献归属。
    reason: 保留לַיהוה在方向与奉献对象之间的语义幅度。
  - marker: b
    text: 希伯来文在“你要带来”之后使用第三人称单数动词，却未明说“他”具体指谁；可按礼仪上下文作不同理解。
    reason: 保留原文对第三人称动作主体的简略与可解释性，不把一种礼仪重建写成原文明说的内容。
lexical_decisions:
- source_word: וְהֵבֵאתָ
  choice: 你要……带到
  rationale: בוא的使役形第二人称阳性单数在礼仪法规中表达指令；译为“你要……带到”，自然体现义务和方向。
- source_word: הַמִּנְחָה
  choice: 素祭
  rationale: מִנְחָה在利未记第2章特指以细面、谷物制品为主的祭物；“素祭”是中文圣经语境中简洁且通行的礼仪术语。
- source_word: אֲשֶׁר יֵעָשֶׂה מֵאֵלֶּה
  choice: 用上述材料制成的
  rationale: עשה的被动形表示“被制成”，מֵאֵלֶּה回指前文列举的材料或制法；“上述材料”比直译“这些东西”更自然，但不限定具体是哪一种形态。
- source_word: לַיהוָה
  choice: 到雅威面前
  rationale: ל可表示方向或奉献对象；结合“带来”的动作，正文采用方向性表达，同时以脚注保留“献给雅威”的可能。יהוה音译为“雅威”，保留神的专名。
- source_word: וְהִקְרִיבָהּ
  choice: 要把它呈给
  rationale: קרב的使役形意为使之靠近、带近或呈上；“呈给”既体现礼仪动作，也与下句נגשׁ的“带到……前”有所区别。
- source_word: אֶל הַכֹּהֵן
  choice: 给祭司
  rationale: אֶל表达朝向或到达；此处是把祭物交呈祭司。
- source_word: וְהִגִּישָׁהּ
  choice: 再把它带到……前
  rationale: נגשׁ的使役形表示使之接近；“带到……前”清楚表达祭司把祭物移近祭坛的下一步礼仪动作。
- source_word: אֶל הַמִּזְבֵּחַ
  choice: 到祭坛前
  rationale: מִזְבֵּחַ是献祭用的祭坛；“祭坛前”自然传达אֶל的趋向含义，而不暗示祭物此时已经放在坛上。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华／主
  rationale: 原文直接使用四字神名יהוה；“雅威”以现代汉语常用音译保留其作为盟约神名的性质，不以称号“主”取代。
- issue: לַיהוָה所表达的是方向还是奉献归属
  choice: 正文译为“到雅威面前”，脚注保留“献给雅威”
  alternative: 献给雅威
  rationale: 介词ל既可配合“带来”表示趋向，也可表示祭物奉献给谁。上下文的移动语言支持方向性译法，但奉献含义不能排除。
- issue: 两个第三人称动词的主语
  choice: 依礼仪顺序译为“献祭的人……祭司……”并加注说明
  alternative: 连续使用未明确所指的“他”
  rationale: 原文在第二人称“你要带来”之后改用两个第三人称阳性单数动词，却没有逐一明说主语。根据“呈给祭司”及随后趋近祭坛的动作，前者自然指献祭者，后者自然指祭司；脚注保留原文主语转换的简略性。
translation_notes:
  register: 采用现代、庄重而易懂的礼仪法规语体。“素祭”“祭司”“祭坛”保留中文圣经读者熟悉的核心术语；用“上述材料”“呈给”“带到……前”避免生硬逐词翻译。神名译作“雅威”。
