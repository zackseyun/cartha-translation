base_translation:
  language: en
  yaml_path: translation/ot/leviticus/002/016.yaml
  text: And the priest shall burn its memorial portion from its crushed grain and from its oil[a], with all its frankincense—an offering made by fire to Yahweh.
translation:
  language: zh_hans
  text: 祭司要从粗碾的谷粒和油中取出其纪念部分[a]，连同全部乳香焚烧在坛上；这是献给雅威的火祭。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “粗碾的谷粒”也可译作“粗碎的谷粒”或“碾碎的谷粒”；希伯来语指为素祭预备、经过粗碾或粗碎的谷粒。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְטִיר
  choice: 在坛上焚烧
  rationale: 该词在献祭语境中指把祭物烧在坛上，使其化为烟；补出“在坛上”使现代汉语读者清楚其礼仪场景。
- source_word: הַכֹּהֵן
  choice: 祭司
  rationale: כהן在祭祀律例中的标准现代汉语译法。
- source_word: אַזְכָּרָתָהּ
  choice: 作纪念的部分
  rationale: 这是素祭中取出焚烧的代表性部分；此译保留“纪念”的词义，也明确它是祭物的一部分。
- source_word: מִגִּרְשָׂהּ
  choice: 从轧碎的谷粒中
  rationale: גרש指经过碾轧、粗碎的谷粒；“轧碎的谷粒”通俗而能反映其加工状态。
- source_word: וּמִשַּׁמְנָהּ
  choice: 和油中
  rationale: מן表示作纪念的部分取自谷粒和油；译文用“从……和……中取出”自然呈现这一关系。
- source_word: עַל כָּל לְבֹנָתָהּ
  choice: 连同全部乳香
  rationale: 在此献祭指示中，על表达伴随关系，即所取部分与全部乳香一同焚烧。
- source_word: אִשֶּׁה
  choice: 火祭
  rationale: 这是指经火献上的祭物的固定祭祀术语；“火祭”简明、自然，并避免把它误解成一般食物。
- source_word: לַיהוָה
  choice: 献给雅威
  rationale: 介词ל表示祭物奉献的对象；“献给”符合现代汉语献祭语境，יהוה音译为“雅威”以保留专名。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”较贴近学界通常重构的读音，并保留其作为专有名的性质，不以称号替代。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“作纪念的部分”保留礼仪术语的含义；调整语序为“取出……连同……焚烧”，以自然呈现希伯来文所表达的取材与焚献关系。
