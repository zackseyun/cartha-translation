  text: And if your offering is a grain offering from a pan[a], it shall be made of fine flour with oil.
translation:
  language: zh_hans
  text: 如果你所献的是用深锅[a]制备的素祭，就要用细面和油制成。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“平底锅”、“煎盘”或“烹调锅”；这个希伯来词所指器皿的确切形制不能确定。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: 如果
  rationale: 引出祭例中的另一种情形；汉语用“如果”已能自然表达承接性的条件关系，不必生硬补出“而”。
- source_word: מִנְחַת
  choice: 素祭
  rationale: 本章语境中特指以谷物为主的祭物；“素祭”是现代中文圣经语境中简明且较为通行的名称。
- source_word: מַרְחֶשֶׁת
  choice: 深锅
  rationale: 该词指烹制祭物的一种器皿，可能比前节的平底烤盘更深；但器皿的确切形制不明，因此加注保留不确定性。
- source_word: קָרְבָּנֶךָ
  choice: 你的供物
  rationale: 表达带到上帝面前献上的物品，并准确保留第二人称单数所属形式；“供物”也避免与后面的祭类名称重复。
- source_word: סֹלֶת
  choice: 细面
  rationale: 指经过精细加工的优质面粉，是素祭所用的标准材料；“细面”简洁、庄重，也符合中文祭祀条文的表达习惯。
- source_word: בַּשֶּׁמֶן
  choice: 和油
  rationale: 介词表示制作时油的伴随或用料关系；“和油”不额外断定具体是调和、浸泡还是煎制。
- source_word: תֵּעָשֶׂה
  choice: 要……制成
  rationale: 保留被动制作的意义和律例的指令语气，同时使现代汉语自然流畅。
