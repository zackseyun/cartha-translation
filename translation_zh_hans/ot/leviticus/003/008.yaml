id: LEV.3.8
reference: Leviticus 3:8
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/סָמַ֤ךְ אֶת יָד/וֹ֙ עַל רֹ֣אשׁ קָרְבָּנ֔/וֹ וְ/שָׁחַ֣ט אֹת֔/וֹ לִ/פְנֵ֖י אֹ֣הֶל מוֹעֵ֑ד וְ֠/זָרְקוּ בְּנֵ֨י אַהֲרֹ֧ן אֶת דָּמ֛/וֹ עַל הַ/מִּזְבֵּ֖חַ סָבִֽיב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/008.yaml
  text: He shall lay his hand on the head of his offering and slaughter it before the tent of meeting[a], and Aaron’s sons shall throw its blood against the altar all around.
translation:
  language: zh_hans
  text: 他要把一只手按在自己的祭物头上，在会幕前宰杀它；亚伦的儿子们要把它的血泼[a]在祭坛四周。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“掷”。希伯来语动词指以有力的礼仪动作将血投、泼到祭坛上，并非轻轻点洒。
    reason: 说明“泼”所译希伯来语动词的动作力度，并提供不预设具体施行方式的词汇替代。
lexical_decisions:
- source_word: וְסָמַךְ
  choice: 把手按在
  rationale: סמך在献祭语境中指把手放在并按于祭牲头上的礼仪动作；“按在”自然地保留了接触及一定力度，又不加入象征意义。
- source_word: יָדוֹ
  choice: 手
  rationale: 原文为单数，并带第三人称阳性单数后缀；汉语由句首的“他”自然表明所属关系。
- source_word: רֹאשׁ
  choice: 头
  rationale: 采用献祭指示中明确的身体部位含义。
- source_word: קָרְבָּנוֹ
  choice: 供物
  rationale: קָרְבָּן泛指献到上帝面前的礼物或祭物；“供物”保留其宽泛意义，不将其缩窄为某一种祭。
- source_word: וְשָׁחַט
  choice: 宰杀
  rationale: 该词是宰杀祭牲的礼仪用语；“宰杀”比一般的“杀”更准确，也符合现代汉语。
- source_word: לִפְנֵי
  choice: 在……前
  rationale: 准确表达空间上位于会幕前，也保留礼仪语境中“在其面前”的意味。
- source_word: אֹהֶל מוֹעֵד
  choice: 会幕
  rationale: 这是该圣所名称在现代中文圣经语体中简洁、通行且准确的表达。
- source_word: וְזָרְקוּ
  choice: 泼洒
  rationale: זרק表示以抛、泼的动作将血施于祭坛；“泼洒”既自然，又比单说“洒”更能体现动作的力度。
- source_word: בְּנֵי אַהֲרֹן
  choice: 亚伦的儿子们
  rationale: 直译原文的男性亲属称谓，不笼统改作“后裔”或解释为“祭司”。
- source_word: דָּמוֹ
  choice: 它的血
  rationale: 后缀所指是作为供物的动物；现代汉语用“它”自然明确。
- source_word: עַל הַמִּזְבֵּחַ
  choice: 在祭坛……
  rationale: 与“泼洒”连用，表示血被施到祭坛各面；汉语整体结构无需机械译成“对着祭坛”。
- source_word: סָבִיב
  choice: 四周
  rationale: 表达血的礼仪动作遍及祭坛周围各面。
theological_decisions:
- issue: 献祭礼仪中的按手动作
  choice: 仅译作“把手按在”，陈述礼仪动作本身。
  alternative: 译文中加入认同、归属或罪责转移等象征解释。
  rationale: 本节只规定动作，并未解释其神学意义；直陈动作可避免把某一种后来的解释写入正文。
- issue: בְּנֵי אַהֲרֹן的性别与亲属含义
  choice: 亚伦的儿子们
  alternative: 亚伦的后裔；亚伦家的祭司
  rationale: 原文明确说“儿子们”；保留这一称谓最忠实，也不以职分解释取代亲属表达。
translation_notes:
  register: 采用现代、庄重而易懂的礼仪叙述语体。“把手按在”“宰杀”“泼洒”清楚呈现连续动作；用分号区分献祭者的动作与亚伦众子的职责。脚注标记紧随其所解释的“泼洒”。
