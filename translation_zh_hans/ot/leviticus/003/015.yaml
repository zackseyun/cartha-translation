base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/015.yaml
  text: and the two kidneys[a], and the fat that is on them, which is on the loins, and the appendage on the liver, with the kidneys[b], he shall remove.
translation:
  language: zh_hans
  text: 又要取下两个肾，以及肾上靠近腰部的脂肪；也要取下肝上的附属部分[a]，连同肾一起[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“肝叶”。这里的希伯来语解剖名词（יֹתֶרֶת）确切所指不明，因此正文采用较宽泛的“附属部分”。
    reason: lexical_alternative
  - marker: b
    text: 直译“在肾上”。这里很可能是指这部分要与肾一同取下。
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁתֵּי הַכְּלָיֹת
  choice: 两个肾
  rationale: 该词组明确指祭牲的两肾；现代汉语用“两个肾”自然清楚。
- source_word: הַחֵלֶב אֲשֶׁר עֲלֵהֶן אֲשֶׁר עַל הַכְּסָלִים
  choice: 肾上靠近腰部的脂肪
  rationale: 保留脂肪与肾及腰部的空间关系，同时避免汉语逐层关系从句造成生硬。כְּסָלִים 可指腰部或胁腹区域，“腰部”符合此处祭牲解剖语境。
- source_word: הַיֹּתֶרֶת עַל הַכָּבֵד
  choice: 肝上的附属部分
  rationale: יֹתֶרֶת 所指的确切现代解剖部位不确定；“附属部分”保留其与肝相连或位于肝上的基本含义，不作过度精确的认定。
- source_word: עַל הַכְּלָיֹת
  choice: 连同肾一起
  rationale: 字面可作“在肾上”，但在本祭礼程序中较可能说明该部分与肾一同取下；正文采用自然的程序性表达，并以脚注保留字面可能。
- source_word: יְסִירֶנָּה
  choice: 要……取下
  rationale: סור 的使役式在此表示移除祭牲的指定部位；“取下”适合屠宰及祭礼操作语境，也保留法规指令语气。
