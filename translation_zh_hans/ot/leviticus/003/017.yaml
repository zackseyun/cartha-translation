base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/017.yaml
  text: 'It shall be a permanent statute throughout your generations, in all your dwellings: you shall eat neither any fat nor any blood.'
translation:
  language: zh_hans
  text: 这是你们世世代代永久的定例[a]；在你们一切住处，你们不可吃任何脂油或任何血。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“永远的定例”或“长存的定例”。希伯来语“永远”用于法律语境时，常强调这项规定长久、持续有效。
    reason: 说明 עוֹלָם 的词义范围及其在法律语境中的用法。
lexical_decisions:
- source_word: חֻקַּת
  choice: 定例
  rationale: 该词指固定、具有约束力的规定；“定例”保留法律与盟约语境中的庄重意味，同时符合现代中文圣经文体。
- source_word: עוֹלָם
  choice: 永远的
  rationale: 在法律套语中表示持续有效、世代相传。“永远的”简明自然；脚注说明它也可理解为“永久的”，避免把希伯来语法律用语所表达的时限作过度哲学化的界定。
- source_word: לְדֹרֹתֵיכֶם
  choice: 世世代代
  rationale: 表达该规定在连续各代中持续有效，是现代中文中自然且庄重的说法。
- source_word: בְּכֹל מוֹשְׁבֹתֵיכֶם
  choice: 无论住在哪里
  rationale: 准确传达“在你们所有居住之处”的普遍适用范围，比直译“在你们一切住处”更符合现代汉语。
- source_word: כָּל חֵלֶב
  choice: 一切脂油
  rationale: “脂油”适合利未记献祭语境中的动物脂肪，也保留 כָּל 的全面语气。
- source_word: וְכָל דָּם
  choice: 一切血
  rationale: 与“一切脂油”平行，保留 כָּל 所表达的全面禁止。
- source_word: לֹא תֹאכֵלוּ
  choice: 你们都不可吃
  rationale: לֹא 加未完成式在法律语境中构成禁令；“不可吃”清楚而庄重，“都”使复数对象和全面禁令在中文中更自然。
theological_decisions:
- issue: עוֹלָם 所表达的命令期限
  choice: 译作“永远的定例”，并以脚注说明法律语境中的持续效力
  alternative: 永久的定例；长久有效的定例
  rationale: 原文强调这项规定世代延续、在各居住地持续有效。“永远的”保留经文的强度，脚注则防止把该法律套语默默限定为抽象意义上的绝对无穷。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“这是”补足希伯来语名词句在中文中所需的判断结构；分号呈现前半句法规公式与后半句具体禁令之间的关系。
