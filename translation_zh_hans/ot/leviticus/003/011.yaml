  yaml_path: translation/ot/leviticus/003/011.yaml
  text: The priest shall burn it on the altar as food[a], an offering made by fire to Yahweh.
translation:
  language: zh_hans
  text: 祭司要在祭坛上把它焚烧，作为献给耶和华、经火献上的食物[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “食物”原文通常也可译作“饼”；这里是献祭用语，指在祭坛上归给耶和华、经火献上的祭物。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְטִירוֹ
  choice: 要把它……焚烧
  rationale: 祭祀语境中的קטר使役形指在祭坛上焚烧祭物，使之化为烟气上升；“焚烧”自然清楚，也保留礼仪动作。
- source_word: הַכֹּהֵן
  choice: 祭司
  rationale: 准确对应祭祀语境中的כֹּהֵן，是现代汉语的标准表达。
- source_word: הַמִּזְבֵּחָה
  choice: 放在祭坛上
  rationale: 原文带方向词尾，结合焚烧祭物的动作，译作“放在祭坛上”自然地表达其目标位置。
- source_word: לֶחֶם
  choice: 食物
  rationale: לֶחֶם通常可指“饼”或“食物”，在这里是献祭体系中的习语，指祭坛上归给耶和华的祭物，并非特指烤制的饼。
- source_word: אִשֶּׁה
  choice: 火祭
  rationale: 这是献祭术语，指借着火献上的祭物；“火祭”简洁并符合本段礼仪语境。
- source_word: לַיהוָה
  choice: 献给耶和华
  rationale: 介词ל在此表达奉献对象；按所给教义规范，将神名יהוה音译为“耶和华”。
theological_decisions:
- issue: 祭祀习语 לֶחֶם אִשֶּׁה 的关系
  choice: 作为献给耶和华的食物，就是火祭
  alternative: 作为火祭的食物献给耶和华；作为饼，就是献给耶和华的火祭
  rationale: 原文紧密并列“食物”和“火祭”，其确切句法关系具有一定含混性。本译文以“就是”表明二者同指所焚烧的祭物，同时用脚注保留“饼”的字面词义；“食物”是祭祀类比用语，不暗示神需要物质滋养。
translation_notes:
  register: 采用现代、庄重而易懂的礼仪叙述。“焚烧”“祭坛”“火祭”保持利未记祭祀术语的一致性；神名按要求译作“耶和华”。
