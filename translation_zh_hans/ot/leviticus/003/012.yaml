  text: וְ/אִ֥ם עֵ֖ז קָרְבָּנ֑/וֹ וְ/הִקְרִיב֖/וֹ לִ/פְנֵ֥י יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/012.yaml
  text: But if his offering is a goat[a], then he shall present it before Yahweh.
translation:
  language: zh_hans
  text: 如果他的供物是山羊，他就要把它献在雅威[a]面前。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文为“YHWH”（四字神名），传统中文常译作“耶和华”；“雅威”是按其通常重构读音所作的音译。
    reason: 说明神名的原文形式及主要中文译法。
lexical_decisions:
- source_word: וְאִם
  choice: 如果
  rationale: 连接词与条件词共同引出平安祭条例中的下一种情形；汉语用“如果”自然承接上文，不额外强化对比。
- source_word: עֵז
  choice: 山羊
  rationale: 该名词在此为单数，指作为供物的山羊；现代汉语无须添加不定冠词。
- source_word: קָרְבָּנוֹ
  choice: 他的供物
  rationale: קָרְבָּן泛指带来献上的礼物或祭物；“供物”保留其较宽泛的含义，避免用“祭牲”过度限定。
- source_word: וְהִקְרִיבוֹ
  choice: 他就要把它献上
  rationale: קרב的使役形表示使之近前、呈献；在祭祀语境中译为“献上”自然清楚，“就要”表达条件句中的条例性要求。
- source_word: לִפְנֵי
  choice: 在……面前
  rationale: 准确表达空间及礼仪意义上的“在……面前”。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以通行的现代汉语音译呈现四字神名YHWH，保留其专名性质，而不以称号代替。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；耶和华（上主）
  rationale: 原文直接使用四字神名。正文采用较贴近学界通常重构读音Yahweh的“雅威”，脚注说明传统译名，以保留文本中的专名及中文读者熟悉的对应形式。
- issue: וְאִם所表达的篇章关系
  choice: 如果
  alternative: 但如果；至于如果
  rationale: 本句引出另一种可献的牲畜，并不必然表达强烈转折；简洁的“如果”保留条件关系而不过度解释。
translation_notes:
  register: 采用现代、庄重而易懂的条例体。句式简洁，与祭祀法规的上下文协调；代词“它”对应单数山羊。脚注标记置于所说明的神名之后。
