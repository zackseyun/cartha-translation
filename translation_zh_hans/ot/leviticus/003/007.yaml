  text: אִם כֶּ֥שֶׂב הֽוּא מַקְרִ֖יב אֶת קָרְבָּנ֑/וֹ וְ/הִקְרִ֥יב אֹת֖/וֹ לִ/פְנֵ֥י יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/007.yaml
  text: If he is presenting a sheep as his offering[a], then he shall present it before Yahweh.
translation:
  language: zh_hans
  text: 如果他献的是一只绵羊作为供物[a]，就要把它带到雅威面前献上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“一只羊羔作为供物”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: 如果
  rationale: 在祭祀条例中引出一种条件情形；“如果”直接保留条件意味。
- source_word: כֶּשֶׂב
  choice: 绵羊
  rationale: 该词指羊，常可指幼羊；此处用“绵羊”既区别于山羊，也不强行限定年龄。
- source_word: מַקְרִיב
  choice: 献的是
  rationale: 使役词形表达把供物带近、呈献；结合中文句法译为“献的是”，自然地引出供物种类。
- source_word: קָרְבָּנוֹ
  choice: 作为供物
  rationale: קָרְבָּן是带到上帝面前的供物；“供物”准确且不把含义缩窄为某一种祭。
- source_word: וְהִקְרִיב אֹתוֹ
  choice: 就要把它献
  rationale: 在律法语境中表达接续的指令；“就要”体现条件之后的义务，“它”回指该羊。
- source_word: לִפְנֵי
  choice: 在……面前
  rationale: 保留空间及礼仪性的呈献含义。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见音译呈现四字神名，保留其专名性质，不以称号替代。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”较贴近学界通常重构的读音，并保留这是专名而非“主”这一称号。
- issue: כֶּשֶׂב 是否限定为幼羊
  choice: 正文译“绵羊”，脚注注明“羊羔”
  alternative: 羊羔
  rationale: 原词可泛指绵羊，也可依语境指幼羊；正文不额外限定年龄，同时以脚注保存真实的词义可能性。
translation_notes:
  register: 采用现代、庄重而易懂的律法指令语体。“献的是……就要……”使中文条件结构清楚，并避免生硬重复“呈献”。
