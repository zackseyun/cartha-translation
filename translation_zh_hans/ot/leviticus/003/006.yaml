  text: וְ/אִם מִן הַ/צֹּ֧אן קָרְבָּנ֛/וֹ לְ/זֶ֥בַח שְׁלָמִ֖ים לַ/יהוָ֑ה זָכָר֙ א֣וֹ נְקֵבָ֔ה תָּמִ֖ים יַקְרִיבֶֽ/נּוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/006.yaml
  text: And if his offering for a sacrifice of peace offerings to Yahweh is from the flock[a], male or female, he shall offer it without blemish.
translation:
  language: zh_hans
  text: 如果他献给雅威作平安祭[a]的供物取自羊群，无论是公是母，都要献上没有残疾的祭牲。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“团契祭”。希伯来语שְׁלָמִים传统上译作“平安祭”，也可侧重献祭筵席中共享福祉和团契的意义。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: 如果
  rationale: 以条件句承接上文的祭例；汉语无需机械译出句首连接词，仍能自然体现其延续关系。
- source_word: מִן הַצֹּאן
  choice: 取自羊群
  rationale: צֹאן是绵羊和山羊等小型家畜的集合称谓；“羊群”简洁自然，也不把原文限定为其中一种。
- source_word: קָרְבָּנוֹ
  choice: 他的供物
  rationale: קָרְבָּן指献到神面前的礼物或祭物；“供物”在此能与后面的祭礼类别自然搭配。
- source_word: לְזֶבַח שְׁלָמִים
  choice: 作平安祭
  rationale: זֶבַח שְׁלָמִים是祭祀术语；“平安祭”保留שְׁלָמִים与完整、安好及和睦相关的传统表达，同时用脚注提示其团契含义。
- source_word: לַיהוָה
  choice: 献给雅威
  rationale: 介词לְ在此表示供物献呈的对象；“雅威”直接音译四字神名יהוה。
- source_word: זָכָר אוֹ נְקֵבָה
  choice: 无论是公是母
  rationale: 准确表达祭牲可以为雄性或雌性，并采用现代汉语描述动物性别的自然说法。
- source_word: תָּמִים
  choice: 没有残疾的
  rationale: 在祭牲语境中，תָּמִים表示没有身体缺陷、符合献祭要求；“没有残疾”清楚而庄重。
- source_word: יַקְרִיבֶנּוּ
  choice: 都要献上
  rationale: קרב的使役形在祭祀语境中指把祭物带到神面前献上；“献上”自然表达这一礼仪动作，宾语由上文明确。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”按较通行的学术重构音译，保留其作为专名的性质。
- issue: שְׁלָמִים所指祭礼的译法
  choice: 平安祭
  alternative: 团契祭（或和睦祭）
  rationale: 该词可关联平安、福祉、完整，也可突出献祭者在祭宴中的共享与团契；正文采用传统且易识别的“平安祭”，脚注保留另一层可能的侧重，不将其含义收窄。
translation_notes:
  register: 采用现代、庄重而易懂的祭礼用语。句序大体遵循希伯来文：先说明供物取自羊群，再列明公母皆可，最后规定必须没有残疾；脚注标记置于其实际解释的“平安祭”之后。
