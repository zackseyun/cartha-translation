base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/010.yaml
  text: and the two kidneys[a], and the fat that is on them, which is on the loins, and the appendage on the liver, which he shall remove with the kidneys.
translation:
  language: zh_hans
  text: 两只肾、肾上面的脂肪，就是腰部的脂肪，以及肝上的附属部分[a]；这部分要连同两只肾一起取下。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“肝叶”。希伯来语 יֹתֶרֶת 所指的确切解剖部位不能确定。
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁתֵּי הַכְּלָיֹת
  choice: 两只肾
  rationale: 该词组在献祭解剖语境中明确指一对肾脏；“两只肾”具体、自然。
- source_word: הַחֵלֶב
  choice: 脂肪
  rationale: 在利未记的献祭条例中，חֵלֶב 指归给祭坛的优质内脏脂肪；“脂肪”是现代汉语中清楚而不过度专门化的表达。
- source_word: אֲשֶׁר עֲלֵהֶן אֲשֶׁר עַל הַכְּסָלִים
  choice: 肾上面的脂肪，就是腰部的脂肪
  rationale: 保留两个关系从句所说明的位置关系；“就是”使连续修饰在现代汉语中清楚易懂。
- source_word: הַיֹּתֶרֶת עַל הַכָּבֵד
  choice: 肝上的附属部分
  rationale: יֹתֶרֶת 所指的确切解剖部位不确定。“附属部分”保留这种不确定性，而“肝上的”直接反映 עַל 的宽泛空间或连接关系。
- source_word: עַל הַכְּלָיֹת יְסִירֶנָּה
  choice: 这部分要连同两只肾一起取下
  rationale: 动词的阴性单数宾语后缀回指 יֹתֶרֶת；“这部分”明确其所指，“连同……一起”表达此处与两肾一并取下的礼仪动作。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的祭祀条例用语。为避免误导，脚注标在存在词义疑难的“附属部分”之后；分号和“这部分”既保留希伯来语末尾动词的回指关系，也使汉语句法清晰。
