  text: וְ/הִקְטִ֨ירוּ אֹת֤/וֹ בְנֵֽי אַהֲרֹן֙ הַ/מִּזְבֵּ֔חָ/ה עַל הָ֣/עֹלָ֔ה אֲשֶׁ֥ר עַל הָ/עֵצִ֖ים אֲשֶׁ֣ר עַל הָ/אֵ֑שׁ אִשֵּׁ֛ה רֵ֥יחַ נִיחֹ֖חַ לַֽ/יהוָֽה־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/005.yaml
  text: And Aaron’s sons shall burn it on the altar[a], on top of the burnt offering that is on the wood that is on the fire. It is a food offering, a pleasing aroma to Yahweh.
translation:
  language: zh_hans
  text: 亚伦的子孙要把它焚烧在祭坛上，就是放在燔祭上面；燔祭在柴上，柴在火上。这是献给雅威的火祭，是令他喜悦的香气。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִקְטִירוּ
  choice: 要把它焚烧
  rationale: קטר 的使役形在献祭语境中指把祭物烧在坛上，使其化为烟而上升。“焚烧”既清楚自然，也保留礼仪动作；“要”表达程序性指令。
- source_word: אֹתוֹ
  choice: 它
  rationale: 阳性单数直接宾语代词，回指上文所规定的平安祭脂油部分。
- source_word: בְנֵי אַהֲרֹן
  choice: 亚伦的子孙
  rationale: 直译这一构造短语；在本段中指亚伦家族中履行祭司职务的人。
- source_word: הַמִּזְבֵּחָה
  choice: 在祭坛上
  rationale: 表示焚烧祭物的目的地或位置；希伯来语方向词尾在汉语中无需另行体现。
- source_word: עַל הָעֹלָה
  choice: 放在燔祭上面
  rationale: עַל 在连续描述祭坛摆放层次时最自然地表示“在……上面”；עֹלָה 依利未记祭祀术语译为“燔祭”。
- source_word: אֲשֶׁר עַל הָעֵצִים אֲשֶׁר עַל הָאֵשׁ
  choice: 燔祭在柴上，柴在火上
  rationale: 保留原文重复的关系结构与祭坛上的层次安排；עֵצִים 译作范围较宽的“柴”，不限定为特定形状的木料。
- source_word: אִשֵּׁה
  choice: 火祭
  rationale: 这是祭祀技术用语，通常指经火献上的祭物。“火祭”简洁并直接反映献祭方式；其与献给上帝之“食物”的关联作为可行理解收入脚注。
- source_word: רֵיחַ נִיחֹחַ
  choice: 令他喜悦的香气
  rationale: 这一固定祭祀表达说明祭物为上帝所悦纳。“令他喜悦”自然表达 נִיחֹחַ 的效果，同时保留“香气”的具体意象。
- source_word: לַיהוָה
  choice: 献给雅威
  rationale: לְ 表示祭物所归属、奉献的对象；用“献给”与祭祀语境相合。神名 יהוה 音译为“雅威”，不以称号代替。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名。音译“雅威”保留其作为盟约之神专名的性质，不以一般称号代替。
- issue: 祭祀术语 אִשֵּׁה 的含义
  choice: 火祭
  alternative: 食物祭；献上的食物
  rationale: 该词在此明确涉及祭坛焚烧，译作“火祭”最直接，也避免让现代读者误以为祭司只是把普通食物摆给上帝。不过，祭司传统也把祭坛祭物称为上帝的“食物”，因此在脚注保留这一词义关联，不将其神学张力消除。
- issue: רֵיחַ נִיחֹחַ 是否明说上帝被安抚
  choice: 令他喜悦的香气
  alternative: 使他平息的香气；蒙悦纳的馨香
  rationale: נִיחֹחַ 可表达舒畅、悦纳的效果，但本节没有明确说献祭平息了神的愤怒。“令他喜悦”保留祭物蒙悦纳的含义，又不额外引入赎罪或息怒观念。
translation_notes:
  register: 采用现代、庄重而易懂的礼仪用语。“焚烧”“祭坛”“燔祭”“火祭”保持利未记祭祀术语的一致性；分号和重复句式既理清祭坛上的摆放层次，也尽量保留希伯来文逐层说明的节奏。
