  to: 亚伦的子孙要把它焚烧在祭坛上，就是放在燔祭上面；燔祭在柴上，柴在火上。这是献给雅威的火祭，是令他喜悦的香气。
  rationale: 修订仅校正脚注中对 אִשֶּׁה 的词义说明，并微调正文连接语以清楚反映原文连续的坛上摆放关系。其余关键术语和“令他喜悦的香气”的悦纳含义均予保留。
