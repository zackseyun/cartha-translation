review_pass:
  verdict: revise
  source_fidelity: 译文整体准确呈现了祭司焚烧上文所述部分、置于坛上燔祭之上，以及木柴与火的层次。惟脚注把 אִשֶּׁה 说成可理解为“献上的食物”并称其有该词义，超出了该词在此的稳妥词汇含义；此处首先是“经火献上的祭物／火祭”。
  naturalness: 正文庄重、通顺。“燔祭在柴上，柴在火上”简洁地保留了原文重复的空间关系。将“放在”调整为“就是放在”可使其与前句的焚烧动作及原文的层层限定衔接更自然。
  terminology: “亚伦的子孙”“祭坛”“燔祭”“火祭”“雅威”均适合本书祭祀语境。“火祭”可保留；脚注应仅提供“经火献上的祭物”这一稳妥释义，不应把“食物”当作该词的直接替代译法。
  issues:
  - severity: medium
    issue: 脚注将 אִשֶּׁה 解释为“献上的食物”，并断言其具有此词义关联。
    rationale: אִשֶּׁה 在此是祭祀技术语，基本指经火献上的祭物（常译“火祭”或“火献祭”）。祭物作为神的“食物”的观念可见于其他相关祭祀表述，但不宜作为本词在本节的直接词义或替代翻译，免得误导读者。
  - severity: low
    issue: “放在燔祭上面”与前面的“焚烧”可进一步连结。
    rationale: 原文的“在坛上、在燔祭上”是同一祭祀动作的连续位置限定；加入“就是”能在不增添意义的情况下使汉语句法关系更清楚。
  revised_text: 亚伦的子孙要把它焚烧在祭坛上，就是放在燔祭上面；燔祭在柴上，柴在火上。这是献给雅威的火祭，是令他喜悦的香气。
  revised_footnotes:
