  text: וְ/סָמַ֤ךְ אֶת יָד/וֹ֙ עַל רֹאשׁ֔/וֹ וְ/שָׁחַ֣ט אֹת֔/וֹ לִ/פְנֵ֖י אֹ֣הֶל מוֹעֵ֑ד וְ֠/זָרְקוּ בְּנֵ֨י אַהֲרֹ֧ן אֶת דָּמ֛/וֹ עַל הַ/מִּזְבֵּ֖חַ סָבִֽיב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/013.yaml
  text: And he shall lay his hand on its head and slaughter it before the tent of meeting[a], and the sons of Aaron shall throw its blood against the altar all around.
translation:
  language: zh_hans
  text: 他要把手按在它头上，在会幕前宰杀它；亚伦的儿子们要把它的血泼[a]在祭坛的四面。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “泼”也可译作“洒”。这里的希伯来动词指把血抛洒到祭坛上。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְסָמַךְ אֶת־יָדוֹ עַל־רֹאשׁוֹ
  choice: 把手按在它头上
  rationale: 保留原文单数“手”，并以现代汉语自然表达献祭者将手按在祭牲头上的动作；“按”也比单纯的“放”更能体现 סמך 的力度。
- source_word: וְשָׁחַט אֹתוֹ
  choice: 宰杀它
  rationale: שׁחט 是献祭语境中宰杀牲畜的常用动词；“宰杀”既准确又不显古奥。
- source_word: לִפְנֵי אֹהֶל מוֹעֵד
  choice: 在会幕前
  rationale: 采用简明而通行的礼仪用语；“前”保留原文的空间关系。
- source_word: בְּנֵי אַהֲרֹן
  choice: 亚伦的儿子们
  rationale: 直接保留原文“亚伦的儿子”这一祭司身份称谓，不笼统改作“祭司们”。
- source_word: וְזָרְקוּ ... אֶת־דָּמוֹ
  choice: 把它的血泼
  rationale: זרק 在祭牲礼仪中表示将血有力地抛洒到祭坛上；“泼”比“滴”或通常容易让人联想到少量液滴的“洒”更能体现该动作，同时脚注保留可译范围。
- source_word: עַל־הַמִּזְבֵּחַ סָבִיב
  choice: 在祭坛的四面
  rationale: 表达血施于祭坛四周各面，而不是仅落在祭坛周围的地面上；“四面”自然体现 סָבִיב 的环绕、分布意义。
theological_decisions: []
