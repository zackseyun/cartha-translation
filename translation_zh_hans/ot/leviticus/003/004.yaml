base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/004.yaml
  text: and the two kidneys[a], and the fat that is on them, which is on the loins, and the appendage on the liver, with the kidneys, he shall remove.
translation:
  language: zh_hans
  text: 两只肾、其上的脂肪，即位于腰部的脂肪，以及肝上的附属部分[a]，他要把这附属部分连同两只肾一同取下。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“肝叶”。这里的希伯来语解剖名称所指不确定。
    reason: 保留疑难解剖术语的词义不确定性，并提供常见替代译法。
lexical_decisions:
- source_word: שְׁתֵּי הַכְּלָיֹת
  choice: 两只肾
  rationale: 该短语明确指献祭牲畜的两个肾；“两只肾”准确、自然。
- source_word: הַחֵלֶב אֲשֶׁר עֲלֵהֶן
  choice: 肾上面的脂肪
  rationale: חֵלֶב在利未记献祭条例中指献给上帝的脂肪部分；译文保留其与肾的空间关系。
- source_word: אֲשֶׁר עַל הַכְּסָלִים
  choice: 就是腰部的脂肪
  rationale: כְּסָלִים指腰部或胁腹区域；“就是”自然表达此关系从句对前述脂肪位置的进一步说明。
- source_word: הַיֹּתֶרֶת עַל הַכָּבֵד
  choice: 肝上的附属部分
  rationale: יֹתֶרֶת所指的确切解剖部位并不确定；“附属部分”既表达其与肝的关系，也避免武断地确定为某一肝叶。
- source_word: עַל הַכְּלָיוֹת יְסִירֶנָּה
  choice: 他要连同肾一起取下
  rationale: 此处עַל在献祭程式中表达与肾一同取下的操作关系；“要……取下”保留律例的指令语气。
