id: LEV.3.14
reference: Leviticus 3:14
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/הִקְרִ֤יב מִמֶּ֨/נּוּ֙ קָרְבָּנ֔/וֹ אִשֶּׁ֖ה לַֽ/יהוָ֑ה אֶת הַ/חֵ֨לֶב֙ הַֽ/מְכַסֶּ֣ה אֶת הַ/קֶּ֔רֶב וְ/אֵת֙ כָּל הַ/חֵ֔לֶב אֲשֶׁ֖ר עַל הַ/קֶּֽרֶב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/014.yaml
  text: 'And from it he shall present his offering[a], a food offering to Yahweh: the fat that covers the entrails, and all the fat that is on the entrails,'
translation:
  language: zh_hans
  text: 他要从其中献上他的供物，作为献给耶和华的火祭[a]：就是遮盖内脏的脂肪，以及内脏上所有的脂肪。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“食物祭”。希伯来语 אִשֶּׁה 是献祭术语，传统上译作“火祭”，也可能指献给上帝的食物。
    reason: 保留该献祭术语在“经火献上”与“献作食物”之间的词义张力。
lexical_decisions:
- source_word: וְהִקְרִיב
  choice: 献上
  rationale: 使役式在献祭语境中表示把祭物呈献出来；“献上”自然、庄重，并保留礼仪动作。
- source_word: מִמֶּנּוּ
  choice: 从其中
  rationale: 代词指前文所说的祭牲；“从其中”表明以下部分取自祭牲。
- source_word: קָרְבָּנוֹ
  choice: 他的供物
  rationale: קָרְבָּן是献祭用语；“供物”既体现献给上帝之物，也避免与下文的具体祭类混淆。
- source_word: אִשֶּׁה
  choice: 火祭
  rationale: 这是祭司文献中的专门献祭术语，传统上理解为经火献上的祭物；“火祭”简洁地保留其祭祀语境，而脚注注明另一种语义理解。
- source_word: לַיהוָה
  choice: 献给耶和华
  rationale: 介词ל表示祭物的归向或对象；“献给”与本句的献祭动作自然衔接。
- source_word: הַחֵלֶב
  choice: 脂肪
  rationale: 在献祭条例中指从祭牲取下、归于坛上焚烧的特定肥脂部分；“脂肪”是直接且清楚的对应。
- source_word: הַמְכַסֶּה אֶת הַקֶּרֶב
  choice: 遮盖内脏的
  rationale: 按分词结构译为修饰“脂肪”的定语，并保留其覆盖内脏的空间关系。
- source_word: וְאֵת כָּל הַחֵלֶב אֲשֶׁר עַל הַקֶּרֶב
  choice: 以及内脏上所有的脂肪
  rationale: 保留כָּל的完整范围和עַל的附着、位置含义，中文表达自然。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 正文采用现代中文读者最熟悉且庄重的专名“耶和华”，明确呈现原文的盟约神名，而不以“主”替代。
- issue: אִשֶּׁה的祭祀含义
  choice: 火祭
  alternative: 食物祭
  rationale: 该词的词源和具体语义存在讨论；正文保留传统且贴近焚烧仪式的“火祭”，脚注列出祭司文献中可能强调献给上帝之食物的另一译法，不将争议静默消解。
translation_notes:
  register: 采用现代、庄重而易懂的祭祀条例语体。“供物”“火祭”保留必要的礼仪术语；“内脏”“脂肪”则使用清楚直接的现代解剖用语。
