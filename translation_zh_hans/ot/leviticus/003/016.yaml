  text: וְ/הִקְטִירָ֥/ם הַ/כֹּהֵ֖ן הַ/מִּזְבֵּ֑חָ/ה לֶ֤חֶם אִשֶּׁה֙ לְ/רֵ֣יחַ נִיחֹ֔חַ כָּל חֵ֖לֶב לַ/יהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/016.yaml
  text: And the priest shall burn them on the altar as food[a], an offering made by fire for a pleasing aroma[c][b]. All the fat belongs to Yahweh.
translation:
  language: zh_hans
  text: 祭司要把这些焚烧在祭坛上，作为火祭的食物[a]，作怡悦的香气[b]。所有脂油都归雅威。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“火祭的饼（或食物）”。这里的“饼”指广义的食物，并非专指面包。
    reason: lexical_alternative
  - marker: b
    text: 或译“馨香之气”或“使人舒畅的香气”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְטִירָם
  choice: 要把这些……焚烧献上
  rationale: קטר 的使役式在献祭语境中指把祭物焚烧，使烟上腾而献上；“焚烧献上”既自然，也保留祭献含义。复数宾语后缀译作“这些”，回指上文指定的祭物部分。
- source_word: הַמִּזְבֵּחָה
  choice: 在祭坛上
  rationale: 此处带方向词尾的形式按语境表示焚烧发生之处；现代汉语以“在祭坛上”最自然。
- source_word: לֶחֶם אִשֶּׁה
  choice: 作为献火祭的食物
  rationale: לֶחֶם 在这里是广义的“食物”，并非特指面包；אִשֶּׁה 指经火献上的祭物。“献火祭的食物”保留原文紧密而略带张力的祭祀意象。
- source_word: לְרֵיחַ נִיחֹחַ
  choice: 成为蒙悦纳的香气
  rationale: 这是固定的献祭用语。נִיחֹחַ 可表达使人舒畅、悦纳之意；“蒙悦纳的香气”保留嗅觉比喻，同时在现代汉语中表明该祭物得到神悦纳。
- source_word: כָּל חֵלֶב
  choice: 所有脂油
  rationale: כָּל 保留总括和强调语气；חֵלֶב 在本章指献祭中特定的脂油部分，译作“脂油”比一般的“脂肪”更符合祭祀语境。
- source_word: לַיהוָה
  choice: 都归雅威
  rationale: 介词 ל־ 在此表示归属或专献；“归雅威”自然地表达脂油专属于雅威。神名 יהוה 采用音译“雅威”。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名。音译“雅威”保留其作为立约神名的性质，不以称号替代，也不加入宗派性解释。
- issue: 献祭公式 לְרֵיחַ נִיחֹחַ 的表达
  choice: 蒙悦纳的香气
  alternative: 馨香的香气；使人舒畅的香气
  rationale: 主译保留原文的香气意象及祭物蒙悦纳的含义，但不进一步解释神如何感受香气，从而保留经文的神学张力。
- issue: כָּל חֵלֶב לַיהוָה 的归属含义
  choice: 所有脂油都归雅威
  alternative: 所有脂油都是献给雅威的
  rationale: 原文仅以介词短语表达归属或专献。“归雅威”涵盖这两层可能，不把它收窄为单一的献祭动作。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“焚烧献上”“脂油”等用语与利未记的祭祀语境相称；避免古奥句式，也不把祭祀比喻改写成教义解释。
