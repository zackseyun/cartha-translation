    rationale: לְרֵיחַ נִיחֹחַ字面为“作怡悦／安舒的香气”；该公式可暗示蒙悦纳，但原文没有明确说“蒙悦纳”。采用“怡悦的香气”更贴近原文，并保留其习语性的歧义与意象。
  - severity: low
