  to: 祭司要把这些焚烧在祭坛上，作为火祭的食物[a]，作怡悦的香气[b]。所有脂油都归雅威。
  rationale: 修订将祭祀术语调整为更标准自然的“火祭”，并以“怡悦的香气”紧贴希伯来文固定公式，避免把其可蕴含的悦纳意义直接断言为已发生的“蒙悦纳”。脚注a限于词义说明，删除非本节必要的神学解释。
