  to: 他要从平安祭[a]祭牲中取出火祭献给雅威：羊的脂肪，整条肥尾[b]，要从贴近脊骨之处[c]割下；以及遮盖内脏的脂肪和内脏上所有的脂肪。
  rationale: 修订以冒号和并列结构呈现原文所列的脂肪部位，避免把“脂肪”与“整条肥尾”误作完全等同，同时将割下肥尾的指令紧接其所修饰的对象。“祭牲”是由本段语境中已指定的羊所作的自然说明，不改变祭仪含义。脚注锚点均紧随相应术语，并保留解剖定位的文本歧义。
