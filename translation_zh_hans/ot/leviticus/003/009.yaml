  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/הִקְרִ֨יב מִ/זֶּ֣בַח הַ/שְּׁלָמִים֮ אִשֶּׁ֣ה לַ/יהוָה֒ חֶלְבּ/וֹ֙ הָ/אַלְיָ֣ה תְמִימָ֔ה לְ/עֻמַּ֥ת הֶ/עָצֶ֖ה יְסִירֶ֑/נָּה וְ/אֶת הַ/חֵ֨לֶב֙ הַֽ/מְכַסֶּ֣ה אֶת הַ/קֶּ֔רֶב וְ/אֵת֙ כָּל הַ/חֵ֔לֶב אֲשֶׁ֖ר עַל הַ/קֶּֽרֶב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/009.yaml
  text: 'And from the sacrifice of peace offerings he shall present an offering made by fire to Yahweh: its fat[a], the whole fat tail, which he shall remove close to the backbone, and the fat that covers the entrails, and all the fat that is on the entrails[c][b],'
translation:
  language: zh_hans
  text: 他要从平安祭[a]祭牲中取出火祭献给雅威：羊的脂肪，整条肥尾[b]，要从贴近脊骨之处[c]割下；以及遮盖内脏的脂肪和内脏上所有的脂肪。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “平安祭”也可译作“团契祭”或“福祉祭”。
    reason: lexical_alternative
  - marker: b
    text: 原文指“完整的肥尾”，即古代献祭所用肥尾羊富含脂肪的整条尾部。
    reason: cultural_note
  - marker: c
    text: “贴近脊骨之处”也可译作“与脊骨相对之处”或“脊椎根部”。
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶבַח הַשְּׁלָמִים
  choice: 平安祭
  rationale: שְׁלָמִים 是祭祀制度中的固定术语，语义涉及平安、福祉与相交；“平安祭”简洁、庄重，也延续现代中文圣经读者熟悉的称呼。
- source_word: אִשֶּׁה
  choice: 火祭
  rationale: 该词指在坛火上献给神的祭物或献礼；“火祭”保留礼仪含义，且不把它误解为普通食物。
- source_word: לַיהוָה
  choice: 献给雅威
  rationale: 原文直接使用四字神名；“雅威”以现代中文音译呈现此立约之名。
- source_word: חֶלְבּוֹ
  choice: 羊的脂肪
  rationale: 直译为“它的脂肪”。本节承接前文所说的羊，用“羊的”明确中文指代，同时保留指定献上脂肪的祭仪细节。
- source_word: הָאַלְיָה תְמִימָה
  choice: 整条肥尾
  rationale: אַלְיָה 特指肥尾羊宽大而富含脂肪的尾部，תְמִימָה 表示完整无缺；“整条肥尾”自然且准确。
- source_word: לְעֻמַּת הֶעָצֶה
  choice: 从靠近脊骨的地方
  rationale: 该短语说明割下肥尾的位置与脊骨相对或相近；正文采用便于理解的解剖表达，并以脚注保留其他可能解释。
- source_word: יְסִירֶנָּה
  choice: 割下
  rationale: 该动词基本义为移除；在处理祭牲尾部的语境中，“割下”比泛泛的“除去”更具体自然。
- source_word: הַחֵלֶב הַמְכַסֶּה אֶת הַקֶּרֶב
  choice: 遮盖内脏的脂肪
  rationale: קֶרֶב 在祭牲解剖语境中指腹腔内脏；此译法具体而不失庄重。
- source_word: כָּל הַחֵלֶב אֲשֶׁר עַל הַקֶּרֶב
  choice: 内脏上所有的脂肪
  rationale: 与前面的“遮盖内脏的脂肪”保持区分，也重复“内脏”以保存原文措辞的一致性。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文明确写出四字神名。正文采用“雅威”作现代中文音译，既区别于作为称号的“主”，也不以替代读法掩盖专名。
- issue: שְׁלָמִים 的祭名所含意义
  choice: 平安祭
  alternative: 团契祭；福祉祭
  rationale: 该词可关联平安、完整、福祉和共享祭餐；“平安祭”作为正文译名不排除这些语义层面，脚注说明其他可行理解，避免把祭礼意义缩减为单一教义。
translation_notes:
  register: 采用现代、庄重而易懂的祭祀用语。“献给雅威，作火祭”重组原文语序以符合汉语表达；用冒号列出所献部位。正文明确“羊”以承接上文并避免“它的脂肪”在汉语中指代含混。所有脚注标记均紧随相关词语。
