  text: וְ/הִקְרִיב֙ מִ/זֶּ֣בַח הַ/שְּׁלָמִ֔ים אִשֶּׁ֖ה לַ/יהוָ֑ה אֶת הַ/חֵ֨לֶב֙ הַֽ/מְכַסֶּ֣ה אֶת הַ/קֶּ֔רֶב וְ/אֵת֙ כָּל הַ/חֵ֔לֶב אֲשֶׁ֖ר עַל הַ/קֶּֽרֶב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/003.yaml
  text: And from the sacrifice of peace offerings he shall present as a food offering to Yahweh the fat that covers the entrails[a], and all the fat that is on the entrails,
translation:
  language: zh_hans
  text: 他要从平安祭中取出脂油，作为献给雅威的火祭[a]，就是遮盖内脏的脂油和内脏上所有的脂油。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “火祭”或可译作“经火献上的祭物”；这个词也可能含有“献作食物的祭物”之意。
    reason: 保留אִשֶּׁה在焚烧方式与献作神圣食物之礼之间的词义张力。
lexical_decisions:
- source_word: וְהִקְרִיב
  choice: 他要……献上
  rationale: 使役形在献祭语境中指把祭物呈献到上帝面前；中文用“献上”自然表达正式的礼仪行动。
- source_word: מִזֶּבַח הַשְּׁלָמִים
  choice: 从平安祭中
  rationale: זֶבַח指宰献之祭，שְׁלָמִים是特定祭类；“平安祭”沿用清楚而通行的中文祭祀术语，并保留该词与完整、安康及和好相关的语义背景。
- source_word: אִשֶּׁה
  choice: 火祭
  rationale: 该词在祭司文献中指经火焚烧、化为烟气献上的祭物。“火祭”简洁自然，也直接保留其与火有关的词义；其可能带有献作食物之礼的含义，置于脚注说明。
- source_word: לַיהוָה
  choice: 献给雅威
  rationale: 原文直接使用神名יהוה；音译为“雅威”，保留其作为立约之神名字的性质。
- source_word: הַחֵלֶב
  choice: 脂油
  rationale: 献祭条例中特指献上的肥脂部分；“脂油”比泛指身体肥胖的“脂肪”更符合屠宰和祭祀语境。
- source_word: הַמְכַסֶּה אֶת הַקֶּרֶב
  choice: 遮盖内脏的脂油
  rationale: 分词作定语，说明这一部分脂油覆盖着腹腔内的脏器。
- source_word: כָּל הַחֵלֶב אֲשֶׁר עַל הַקֶּרֶב
  choice: 内脏上所有的脂油
  rationale: 直译עַל的空间关系，并与前面的覆盖性脂油并列，保留原文细致的解剖描述。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文使用四字神名，正文采用“雅威”以呈现其专名性质，不以称号替代，也不引入特定宗派解释。
- issue: 祭祀术语 אִשֶּׁה 的译法
  choice: 火祭
  alternative: 献作食物的祭物；经火献上的祭物
  rationale: 词源和用法仍有讨论。正文以“火祭”保留明确的焚烧维度，脚注同时保存它可能表示献作神圣食物之礼的语义，避免把争议静默定论。
- issue: שְׁלָמִים 所指祭类
  choice: 平安祭
  alternative: 团契祭；安康祭
  rationale: “平安祭”是现代中文读者较熟悉的祭类名称，同时可涵盖完整、安康与和好等关联意义；本节不把它窄化为单一神学功能。
translation_notes:
  register: 采用现代、庄重而易懂的礼仪语言。“从……中取出……作为……”使中文句法顺畅，同时保持原文由平安祭中选取特定脂油献上的结构；以“内脏”准确表达动物腹腔内部器官。
