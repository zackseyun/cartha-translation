  to: 如果他的供物是平安祭的祭牲，他若从牛群中献上祭牲，无论是公是母，都要将没有残疾的献在雅威面前。
  rationale: 修订只补足“献上”的宾语并调整性别并列句式，使中文语法完整自然；未改变原文的条件、许可或献祭要求。脚注锚点及内容均可保留。
