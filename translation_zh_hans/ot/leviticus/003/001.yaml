  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/אִם זֶ֥בַח שְׁלָמִ֖ים קָרְבָּנ֑/וֹ אִ֤ם מִן הַ/בָּקָר֙ ה֣וּא מַקְרִ֔יב אִם זָכָר֙ אִם נְקֵבָ֔ה תָּמִ֥ים יַקְרִיבֶ֖/נּוּ לִ/פְנֵ֥י יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/001.yaml
  text: If his offering is a sacrifice of peace offerings[a], if he offers it from the herd, whether male or female[b], he shall offer it without blemish before Yahweh.
translation:
  language: zh_hans
  text: 如果他的供物是平安祭的祭牲，他若从牛群中献上祭牲，无论是公是母，都要将没有残疾的献在雅威面前。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: זֶבַח שְׁלָמִים
  choice: 平安祭的祭牲
  rationale: זֶבַח明确指祭牲或祭献，שְׁלָמִים指这一祭的类别。译作“平安祭的祭牲”保留希伯来语的复合结构，也避免把具有平安、福祉、完整等含义的术语过窄地解释为“团契祭”。
- source_word: קָרְבָּנוֹ
  choice: 他的供物
  rationale: קָרְבָּן泛指带来献上的供物；“供物”在现代中文中清楚、庄重，也适合献祭语境。
- source_word: מִן הַבָּקָר
  choice: 从牛群中
  rationale: בָּקָר指牛类牲畜；“从牛群中”既准确，又自然表达从该类牲畜中选取祭牲。
- source_word: מַקְרִיב / יַקְרִיבֶנּוּ
  choice: 献／把……献上
  rationale: קרב的使役式在献祭语境中表示把供物带到近前献上；“献”符合现代中文的祭祀用语。
- source_word: אִם זָכָר אִם נְקֵבָה
  choice: 无论公的母的
  rationale: 成对的אִם…אִם表示两种选择都可接受；“无论……都……”自然传达这一许可。
- source_word: תָּמִים
  choice: 没有残疾的
  rationale: 在祭牲条例中，תָּמִים指没有身体缺陷，译为“没有残疾的”具体易懂，并保留礼仪要求。
- source_word: לִפְנֵי יְהוָה
  choice: 在雅威面前
  rationale: לִפְנֵי意为“在……面前／临在中”；יְהוָה作为神的专名音译为“雅威”，不以称号替代。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名。正文采用较贴近YHWH传统重构读音的“雅威”，保留其专名性质；脚注提示中文传统中的其他译法。
- issue: שְׁלָמִים这一祭类的名称
  choice: 平安祭
  alternative: 团契祭；酬恩祭
  rationale: “平安祭”是中文圣经传统中通行且语义较宽的译名，能够容纳平安、福祉、完整等关联；“团契祭”较强调共同分享这一解释层面，因此仅列作备选。
translation_notes:
  register: 采用现代、庄重而易懂的法规体。保留原文连续的条件结构，但以“无论……都……”使中文顺畅；用“公的母的”指牲畜性别，避免较书面的“雄性或雌性”。
