  text: וְ/סָמַ֤ךְ יָד/וֹ֙ עַל רֹ֣אשׁ קָרְבָּנ֔/וֹ וּ/שְׁחָט֕/וֹ פֶּ֖תַח אֹ֣הֶל מוֹעֵ֑ד וְ/זָרְק֡וּ בְּנֵי֩ אַהֲרֹ֨ן הַ/כֹּהֲנִ֧ים אֶת הַ/דָּ֛ם עַל הַ/מִּזְבֵּ֖חַ סָבִֽיב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/002.yaml
  text: He shall lay his hand on the head of his offering and slaughter it at the entrance of the tent of meeting[a], and Aaron’s sons, the priests[b], shall throw the blood against the altar all around.
translation:
  language: zh_hans
  text: 他要把手按在供物的头上，在会幕门口[a]宰杀它；亚伦的子孙，就是祭司，要把血泼在祭坛四周[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“在会幕入口处”。
    reason: lexical_alternative
  - marker: b
    text: 或译“把血洒向祭坛四面”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְסָמַךְ יָדוֹ
  choice: 把手按在
  rationale: סמך在献祭语境中指把手放在或按在祭牲头上；“按在”自然简洁，并保留可能含有施力的意味。יָדוֹ为单数，故译作“手”，不增译为“双手”。
- source_word: רֹאשׁ קָרְבָּנוֹ
  choice: 供物的头
  rationale: רֹאשׁ是具体的“头”；קָרְבָּן是广义的献上之物，译作“供物”比“祭牲”更贴近该词本身的宽泛含义。
- source_word: וּשְׁחָטוֹ
  choice: 宰杀它
  rationale: שׁחט是宰杀祭牲的常用动词；“宰杀”准确保留献祭程序的语义，比泛称“杀”更具体。
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: 在会幕门口
  rationale: פֶּתַח可指开口、入口或门口；“门口”是现代汉语中简明自然的表达。אֹהֶל מוֹעֵד按通行且易懂的圣经用语译作“会幕”。
- source_word: בְּנֵי אַהֲרֹן הַכֹּהֲנִים
  choice: 亚伦的子孙，就是祭司
  rationale: 保留“亚伦的子孙”与同位语“祭司”的双重身份说明；“就是”清楚表达同位关系。
- source_word: וְזָרְקוּ אֶת־הַדָּם
  choice: 要把血泼在
  rationale: זרק表示把液体抛、洒或泼向某处；“泼”比“洒”更能体现动作力度，也避免让人误以为是细密的喷洒。
- source_word: עַל־הַמִּזְבֵּחַ סָבִיב
  choice: 祭坛四周
  rationale: עַל与זרק连用表示血被泼到祭坛上或其侧面；סָבִיב表示环绕四周。“泼在祭坛四周”自然地传达环绕祭坛施血的动作，同时不过度限定具体表面。
theological_decisions:
- issue: 施血动作的性质
  choice: 把血泼在祭坛四周
  alternative: 把血洒在祭坛周围
  rationale: זרק通常不是表示细微“喷洒”的专门动作，而是把血抛泼到祭坛上；“泼”较能保留动作力度，也不把此礼仪与其他可能用“洒”表达的施血方式混同。
- issue: 按手动作是否含有特定神学解释
  choice: 只译作“把手按在”
  alternative: 增译为表示认同、转移罪责或献呈
  rationale: 本节只陈述礼仪动作，并未明说其神学含义；译文不增添经文本身未解释的教义性结论。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“供物”保留קָרְבָּן的广义；“会幕”采用通行称谓；分号划分献祭者与祭司先后执行的动作。所有脚注标记均置于正文相关短语之后。
