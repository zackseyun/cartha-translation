base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/012.yaml
  text: Then the priest shall take the one male lamb and present it as a guilt offering[a], along with the log of oil[b], and he shall wave them as a wave offering before Yahweh.
translation:
  language: zh_hans
  text: 祭司要取那一只公羊羔，作为赎愆祭[a]献上；又要献上一罗革油[b]，并在雅威面前为这两样行摇祭。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “赎愆祭”也可译作“赔偿祭”。
    reason: lexical_alternative
  - marker: b
    text: “罗革”是古代以色列礼仪中使用的一种小容量单位。
    reason: cultural_note
lexical_decisions:
- source_word: וְלָקַח
  choice: 要取
  rationale: 承接前文礼仪程序，并保留律法规定的指令语气；汉语无需机械译出句首连接词。
- source_word: הַכֹּהֵן
  choice: 祭司
  rationale: 符合祭祀语境中כֹּהֵן的标准现代汉语译法。
- source_word: הַכֶּבֶשׂ הָאֶחָד
  choice: 那一只公羊羔
  rationale: “那一只”体现定冠词加数词所作的特指，并与本仪式中的其他祭牲区分；“公羊羔”明确该词在此祭祀语境中的性别。
- source_word: וְהִקְרִיב אֹתוֹ
  choice: 把它……献上
  rationale: הקריב在祭祀语境中指把祭物带近并呈献；“献上”自然且不额外限定宰杀等后续动作。
- source_word: לְאָשָׁם
  choice: 作为赎愆祭
  rationale: אָשָׁם在利未记中是专门祭名；“赎愆祭”是准确而庄重的传统术语，同时用脚注保留“赔偿祭”这一强调补偿性质的译法。
- source_word: לֹג הַשָּׁמֶן
  choice: 一罗革油
  rationale: לֹג是古代以色列的小容量单位；音译“罗革”保留专门度量名称，并以脚注解释。
- source_word: וְהֵנִיף אֹתָם
  choice: 把它们摇一摇
  rationale: 保留הניף所指的礼仪性摇动动作，也使普通现代读者易懂。
- source_word: תְּנוּפָה
  choice: 作为摇祭
  rationale: 采用与动词“摇”对应的祭祀专门术语，体现该动作具有呈献性质。
- source_word: לִפְנֵי יְהוָה
  choice: 在雅威面前
  rationale: 直接呈现圣名，并自然表达礼仪在神面前进行。
theological_decisions:
- issue: אָשָׁם这一祭名的含义
  choice: 赎愆祭
  alternative: 赔偿祭
  rationale: “赎愆祭”保留广为人知的祭祀术语；“赔偿祭”则突出该祭有时涉及补偿或赔还的层面。正文不把其含义缩减为单纯内在罪疚，脚注保留另一合理理解。
- issue: 圣名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: “雅威”更直接对应学界通常重构的YHWH读音，避免用称号代替经文中的专名；“耶和华”是汉语传统形式，但其读音来源不同。
translation_notes:
  register: 采用现代、庄重且可朗读的律法文体。“把它和……一同献上”使两个受词关系清楚；分号划分呈献与摇祭两个连续动作。脚注标记已放在各自所解释的词语之后，并纠正了咨询层中脚注内容与标记次序不一致的问题。
