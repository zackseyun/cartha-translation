revisions:
- from: 祭司要取那一只公羊羔，把它和一罗革油[b]一同献上，作为赎愆祭[a]；又要在雅威面前把它们摇一摇，作为摇祭。
  to: 祭司要取那一只公羊羔，作为赎愆祭[a]献上；又要献上一罗革油[b]，并在雅威面前为这两样行摇祭。
  rationale: 修订将“作为赎愆祭”紧接公羊羔的献上动作，明确其仅指羊；油另列为献上的礼仪物品。以“为这两样行摇祭”对应“把它们摇动，作为摇祭”，保留羊与油共同参与摇祭的关系，并采用较庄重自然的现代汉语礼仪文体。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T04:54:55Z'
review_pass:
  verdict: revise
  source_fidelity: 草稿准确呈现了祭司取公羊羔、献为赎愆祭、连同一罗革油，并在雅威面前举行摇祭的基本礼仪次序。可是“把它和一罗革油一同献上，作为赎愆祭”在汉语句法上可能使“作为赎愆祭”同时修饰公羊羔和油；原文的לְאָשָׁם直接说明公羊羔的祭别，油并非赎愆祭。因此需调整句法范围。
  naturalness: “摇一摇”用于礼仪动作可以理解，但在庄重律法文体中，“行摇祭”更自然凝练，也避免口语化的重复。分句后以“这两样”回指公羊羔和油，关系清晰。
  terminology: “公羊羔”“赎愆祭”“罗革”“摇祭”“雅威”均可接受，且与原文及既定译名取向相符。“赔偿祭”作为赎愆祭的可选译法，脚注保留得当。
  issues:
  - severity: medium
    issue: “作为赎愆祭”可能被读作同时修饰公羊羔和一罗革油。
    rationale: 希伯来文的“作为赎愆祭”（לְאָשָׁם）紧随“献上它”，其中“它”指单数的公羊羔；随后提及的油与羊一同被摇，但不应被表述为赎愆祭。应将羊的献祭类别与油的呈献分开。
  - severity: low
    issue: “把它们摇一摇，作为摇祭”略显口语且动词、名词重复。
    rationale: 原文确有“摇动／举摇”动词与“摇祭”名词的搭配；中文可用“行摇祭”自然地表达这一技术性礼仪，同时不损失其祭仪性质。
  revised_text: 祭司要取那一只公羊羔，作为赎愆祭[a]献上；又要献上一罗革油[b]，并在雅威面前为这两样行摇祭。
  revised_footnotes:
  - marker: a
    text: “赎愆祭”也可译作“赔偿祭”。
    reason: lexical_alternative
  - marker: b
    text: “罗革”是古代以色列礼仪中使用的一种小容量单位。
    reason: cultural_note
  revision_rationale: 修订将“作为赎愆祭”紧接公羊羔的献上动作，明确其仅指羊；油另列为献上的礼仪物品。以“为这两样行摇祭”对应“把它们摇动，作为摇祭”，保留羊与油共同参与摇祭的关系，并采用较庄重自然的现代汉语礼仪文体。
