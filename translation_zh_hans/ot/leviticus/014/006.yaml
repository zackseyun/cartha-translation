  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: אֶת הַ/צִּפֹּ֤ר הַֽ/חַיָּה֙ יִקַּ֣ח אֹתָ֔/הּ וְ/אֶת עֵ֥ץ הָ/אֶ֛רֶז וְ/אֶת שְׁנִ֥י הַ/תּוֹלַ֖עַת וְ/אֶת הָ/אֵזֹ֑ב וְ/טָבַ֨ל אוֹתָ֜/ם וְ/אֵ֣ת הַ/צִּפֹּ֣ר הַֽ/חַיָּ֗ה בְּ/דַם֙ הַ/צִּפֹּ֣ר הַ/שְּׁחֻטָ֔ה עַ֖ל הַ/מַּ֥יִם הַֽ/חַיִּֽים־־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/006.yaml
  text: As for the living bird, he shall take it, along with the cedar wood, the scarlet yarn, and the hyssop, and dip them and the living bird in the blood of the bird that was slaughtered over the fresh water.
translation:
  language: zh_hans
  text: 至于那只活鸟，他要把它连同香柏木、朱红线和牛膝草拿来，把这些东西和活鸟蘸在那只在活水[a]上方宰杀的鸟的血中。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “活水”直译即“有生命的水”，这里指流动的新鲜水。
    reason: 说明希伯来语习语的字面形式和语境含义，保留“流动的水”等可能译法。
lexical_decisions:
- source_word: הַצִּפֹּר הַחַיָּה
  choice: 那只活鸟
  rationale: צִפּוֹר泛指鸟；חַיָּה在这里与已宰杀的鸟形成明确对比。现代汉语用“活鸟”自然、准确。
- source_word: יִקַּח
  choice: 他要……拿来
  rationale: 未完成式在礼仪法规中表达指令；“要”保留规定性，同时比生硬的“应当取”更符合现代汉语。
- source_word: עֵץ הָאֶרֶז
  choice: 香柏木
  rationale: 该结构指仪式中使用的香柏木材或木块；“香柏木”是清楚而庄重的通行译法。
- source_word: שְׁנִי הַתּוֹלַעַת
  choice: 朱红线
  rationale: 该词组指以虫红染料染成的朱红色材料，具体形态未完全明说；结合仪式用品，译作“朱红线”简明自然。
- source_word: הָאֵזֹב
  choice: 牛膝草
  rationale: 这是该礼仪植物名称的传统通行译法；其精确植物学鉴定仍有争议，不在正文中强行确定。
- source_word: וְטָבַל
  choice: 蘸在……血中
  rationale: טבל表示将物件浸入液体；“蘸”准确表达这里短暂浸入的礼仪动作。
- source_word: אוֹתָם וְאֵת הַצִּפֹּר הַחַיָּה
  choice: 这些东西和活鸟
  rationale: אוֹתָם回指所列礼仪用品，随后原文又明确加入活鸟；译文保留这一区分，避免误以为代词已经包括活鸟。
- source_word: הַצִּפֹּר הַשְּׁחֻטָה
  choice: 宰杀的鸟
  rationale: שׁחט指宰杀，在礼仪语境中比泛称“杀死”更准确。
- source_word: עַל הַמַּיִם הַחַיִּים
  choice: 在活水上方
  rationale: עַל保留空间关系“在……上方”；מַיִם חַיִּים直译为“活水”，在此指流动的新鲜水。正文保留原文意象，脚注说明实际含义。
theological_decisions:
- issue: 礼仪语境中מַיִם חַיִּים的译法
  choice: 活水
  alternative: 流动的水；新鲜水
  rationale: “活水”最贴近希伯来语字面表达，也能在汉语中表示流动而非死滞的水。脚注明确其礼仪语境中的通常含义，既不抹去原文意象，也不把后来的神学用法强加于本节。
- issue: עַל所表达的宰杀位置
  choice: 在活水上方宰杀
  alternative: 在活水旁宰杀；宰杀在活水之上
  rationale: 原文保留“在……之上”的空间表述，并与上一节所述盛有活水的器皿相呼应；不将其弱化为仅仅“旁边”。
translation_notes:
  register: 采用现代、庄重而易懂的礼仪法规语体。“连同……拿来”理顺汉语语序；“这些东西和活鸟”保留原文先用复数代词、再另提活鸟的结构。
