base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/016.yaml
  text: The priest shall dip his right finger into some of the oil that is on his left palm[a], and with his finger he shall sprinkle some of the oil seven times before Yahweh.
translation:
  language: zh_hans
  text: 祭司要把右手的手指蘸在左手掌上的油里，再用手指把一些油在雅威[a]面前弹洒七次。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “雅威”是希伯来文神名 יהוה（YHWH）的音译；传统上也译作“耶和华”，或以“上主”代称。
    reason: 说明神名的原文形式及常见译法。
lexical_decisions:
- source_word: טָבַל
  choice: 蘸
  rationale: 该动词表示把身体部位或物件蘸入液体；此处只有手指接触油，用“蘸”准确而自然。
- source_word: אֶצְבָּעוֹ הַיְמָנִית
  choice: 右手指
  rationale: 直译为“他的右手指”；“右手指”简洁地保留礼仪动作所要求的左右之别，又不擅自明确为某一根手指。
- source_word: מִן הַשֶּׁמֶן אֲשֶׁר עַל כַּפּוֹ הַשְּׂמָאלִית
  choice: 在左手掌上的油里
  rationale: 介词מִן跟在“蘸”之后，汉语自然表达为“蘸在……油里”；כַּף具体指手掌，故不用泛指的“左手”。
- source_word: הִזָּה
  choice: 弹洒
  rationale: 该词在祭司礼仪语境中指按规定将液体洒出；“弹洒”既清楚，也能体现用手指施行的礼仪动作。
- source_word: בְּאֶצְבָּעוֹ
  choice: 用手指
  rationale: 介词בְּ在此表示工具或方式；“用手指”符合现代汉语表达。
- source_word: שֶׁבַע פְּעָמִים
  choice: 七次
  rationale: 按原文直译，保留具有礼仪意义的明确次数。
- source_word: לִפְנֵי יְהוָה
  choice: 在雅威面前
  rationale: לִפְנֵי在此是礼仪用语，表示在神面前或临在之处；“在……面前”保留原文简洁庄重的表达。
- source_word: יְהוָה
  choice: 雅威
  rationale: 原文直接使用四字神名；“雅威”以现代汉语音译呈现该专名。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文使用神的专名，而非称号；译作“雅威”可保留专名性质，不以称号替代，也不把经文的礼仪关系作额外解释。
translation_notes:
  register: 采用现代、庄重而易懂的礼仪叙述。“右手指”保留原文未明确具体哪一根手指的含混；“弹洒”体现祭司用手指施行的规定动作。脚注标记置于“雅威”之后，与脚注内容准确对应。
