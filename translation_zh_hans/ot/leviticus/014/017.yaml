base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/017.yaml
  text: And from the rest of the oil that is on his palm[a], the priest shall put some on the lobe of the right ear of the one being cleansed, and on the thumb of his right hand, and on the big toe of his right foot[b], on top of the blood of the guilt offering.
translation:
  language: zh_hans
  text: 祭司要从手掌上剩下的油中取一些，抹在正在接受洁净的人的右耳垂[a]、右手的大拇指和右脚的大脚趾上，也就是抹在赎愆祭的血上[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“右耳尖”。希伯来语所指的是耳朵外侧的末端；在这一仪式语境中，“耳垂”是较清楚的现代译法。
    reason: lexical_alternative
  - marker: b
    text: 或译“在赎愆祭的血上”。意思是把油抹在先前已经抹血的同一部位。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִיֶּתֶר הַשֶּׁמֶן
  choice: 从……剩下的油中取一些
  rationale: מִן带有部分义，יֶתֶר指剩余之物；此译既保留“从余下的油中”的意思，也以“取一些”自然表达祭司只使用其中一部分。
- source_word: עַל כַּפּוֹ
  choice: 手掌上
  rationale: כַּף在此指手掌或掌心，עַל通常为“在……上”；结合前文祭司将油倒在左手掌上的仪式动作，译作“手掌上”准确自然。
- source_word: יִתֵּן
  choice: 抹在
  rationale: נתן基本义为“放、置”；在把油施于身体部位的仪式语境中，“抹在”比直译“放在”更符合现代汉语，同时不改变动作实质。
- source_word: הַמִּטַּהֵר
  choice: 正接受洁净之人
  rationale: Hitpael分词指正在经历礼仪洁净过程的人；“正接受洁净”保留过程性及非主动施行洁净的语义。
- source_word: תְּנוּךְ אֹזֶן
  choice: 耳垂
  rationale: תְּנוּךְ指耳朵外缘或末端；在这一施油仪式中，“耳垂”是现代汉语中最清楚自然的身体部位名称，同时以脚注保留“耳尖”的可能译法。
- source_word: בֹּהֶן יָדוֹ
  choice: 右手大拇指
  rationale: בֹּהֶן用于手时指拇指；按现代汉语习惯译为“大拇指”。
- source_word: בֹּהֶן רַגְלוֹ
  choice: 右脚大拇趾
  rationale: בֹּהֶן用于脚时指大脚趾；“大拇趾”明确区别于手指，也符合庄重的现代书面语。
- source_word: עַל דַּם הָאָשָׁם
  choice: 抹在赎愆祭牲的血上
  rationale: 末尾的עַל表明油施在先前已抹血之处，或直接在血的上面；正文保留“在……血上”的空间关系，脚注说明其具体含义。
theological_decisions:
- issue: 祭祀术语אָשָׁם的译法
  choice: 赎愆祭
  alternative: 赔偿祭
  rationale: אָשָׁם在利未记中是特定祭类，涉及罪责及由此产生的责任。“赎愆祭”是中文圣经传统中辨识度高且较准确的专门术语，不把后来的宗派性解释带入正文。
translation_notes:
  register: 采用现代、庄重而易懂的祭仪叙述。“正接受洁净之人”保留原文分词的过程意味；三个身体部位并列，维持原文重复而有节奏的仪式表达。
