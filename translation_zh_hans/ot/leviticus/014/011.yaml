base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/011.yaml
  text: And the priest who cleanses shall present the man who is being cleansed, along with those things, before Yahweh at the entrance of the tent of meeting.
translation:
  language: zh_hans
  text: 主持洁净礼的祭司要在会幕门口，使正在接受洁净礼的那人站在雅威面前，并把那些物品[a]安放在那里。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“它们”；指上节所列的祭牲和油。
    reason: 说明复数代词所指，并表明正文的“那些物品”是依上下文作出的明确化处理。
lexical_decisions:
- source_word: וְהֶעֱמִיד
  choice: 要把……带到……面前，站在
  rationale: עמד的使役式直译为“使……站立”；这里用于礼仪性的呈献场景。译文兼顾“带到面前”的自然表达和“站在”的具体动作。
- source_word: הַכֹּהֵן הַמְטַהֵר
  choice: 执行洁净礼的祭司
  rationale: 主动分词说明祭司在洁净程序中的礼仪职责；“执行洁净礼”避免误解为祭司赋予人道德上的纯洁。
- source_word: הָאִישׁ הַמִּטַּהֵר
  choice: 正在得洁净的那人
  rationale: 保留אִישׁ的单数人物指称，并以“正在得洁净”表达该人处于礼仪洁净过程之中。
- source_word: וְאֹתָם
  choice: 和那些物品
  rationale: 复数代词按上文所列祭牲和油理解；中文明确补出“物品”，以免被误读为其他人。
- source_word: לִפְנֵי יְהוָה
  choice: 在雅威面前
  rationale: 保留礼仪语境中“在……面前”的表达，并将神名יהוה音译为“雅威”。
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: 在会幕门口
  rationale: 采用现代中文圣经语体中清楚而通行的圣所地点用语。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”较贴近学界通常采用的发音重构，同时不以“主”替代原有专名。
- issue: 祭司在洁净过程中的作用
  choice: 执行洁净礼
  alternative: 使人洁净
  rationale: 本节描写祭司主持礼仪的职分；此译法不额外断定祭司是洁净状态的最终施予者。
translation_notes:
  register: 采用庄重、清楚的现代标准普通话。“会幕”“洁净礼”保留利未记礼仪语境中的通行术语；句式尽量贴近希伯来文动作结构，同时避免生硬的“使……站立”。
