revisions:
- from: 执行洁净礼的祭司要把正在得洁净的那人和那些物品[a]带到雅威面前，站在会幕门口。
  to: 主持洁净礼的祭司要在会幕门口，使正在接受洁净礼的那人站在雅威面前，并把那些物品[a]安放在那里。
  rationale: 修订消除了“站在会幕门口”的悬垂修饰语，并以“使……站在”对应原文使役动词对该人的用法，以“安放”自然表达同一动词对随带祭物和油的礼仪性安置。地点“会幕门口”和“雅威面前”均予保留，未增添神学解释。
  reviewer_model: gpt-5.6-terra
