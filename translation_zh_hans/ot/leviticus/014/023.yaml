  text: וְ/הֵבִ֨יא אֹתָ֜/ם בַּ/יּ֧וֹם הַ/שְּׁמִינִ֛י לְ/טָהֳרָת֖/וֹ אֶל הַ/כֹּהֵ֑ן אֶל פֶּ֥תַח אֹֽהֶל מוֹעֵ֖ד לִ/פְנֵ֥י יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/023.yaml
  text: And on the eighth day he shall bring them for his cleansing to the priest[a], at the entrance of the tent of meeting, before Yahweh.
translation:
  language: zh_hans
  text: 第八天，为使自己得洁净，他要把这些祭物带到会幕门口、雅威面前，交给祭司。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “为使自己得洁净”也可译作“为自己的洁净”。这里指礼仪上的洁净过程。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵבִיא
  choice: 他要……带到
  rationale: 在律法程序中，带连接词的使役完成式具有指示性的将来语气；“要……带到”符合现代汉语法规叙述。
- source_word: אֹתָם
  choice: 这些祭物
  rationale: 阳性复数宾语代词回指上一节列出的献祭物品。汉语补出“祭物”，使所指清楚，又不增加新的内容。
- source_word: בַּיּוֹם הַשְּׁמִינִי
  choice: 第八天
  rationale: 标准时间表达；汉语无需译出介词即可自然表达“在第八天”。
- source_word: לְטָהֳרָתוֹ
  choice: 为自己的洁净
  rationale: 此处指皮肤病患者礼仪上的洁净过程或恢复；“洁净”既保留祭仪语境，也避免误解为普通清洗。
- source_word: אֶל הַכֹּהֵן
  choice: 到祭司那里
  rationale: 准确表达方向，符合现代汉语习惯。
- source_word: אֶל פֶּתַח אֹהֶל מוֹעֵד
  choice: 就是会幕门口
  rationale: 第二个 אֶל 界定带到祭司处的具体地点。“会幕”是 אֹהֶל מוֹעֵד 简明而通行的汉语对应。
- source_word: לִפְנֵי יְהוָה
  choice: 来到雅威面前
  rationale: 保留祭仪中“在雅威面前”的临在含义；“来到”使方向结构在汉语中连贯。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按源文直接呈现四字神名，以现代汉语常见音译“雅威”保留其专名性质。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；耶和华上主
  rationale: 源文使用四字神名而非称号；“雅威”直接保留盟约之神的专名，不以“主”替换。
- issue: לְטָהֳרָתוֹ 的礼仪含义
  choice: 为自己的洁净
  alternative: 为使自己得洁净；为自己的洁净礼
  rationale: 原词可涉及洁净的过程或状态。正文以“洁净”保留这种宽度，不把它限定为某个单独礼式，也不引入道德赦罪的含义。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。“这些祭物”明示代词的上文所指；句式保留律法程序的次序，并以“雅威”译神名。
