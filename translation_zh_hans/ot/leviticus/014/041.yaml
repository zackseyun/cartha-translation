  text: וְ/אֶת הַ/בַּ֛יִת יַקְצִ֥עַ מִ/בַּ֖יִת סָבִ֑יב וְ/שָׁפְכ֗וּ אֶת הֶֽ/עָפָר֙ אֲשֶׁ֣ר הִקְצ֔וּ אֶל מִ/ח֣וּץ לָ/עִ֔יר אֶל מָק֖וֹם טָמֵֽא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/041.yaml
  text: He shall have the inside of the house scraped all around[a], and they shall pour out the dust that they scraped off outside the city into an unclean place.
translation:
  language: zh_hans
  text: 他要叫人把房屋里面四周都刮净；他们要把刮下来的尘土[a]倒在城外不洁净的地方。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“尘土”；这里指从房屋墙面刮下来的粉尘或碎料。
    reason: 说明原词的字面意义及其在本处的具体所指，避免在正文中加入“灰泥”等原文未明说的材料名称。
lexical_decisions:
- source_word: יַקְצִעַ
  choice: 要把……刮净
  rationale: 该动词为使役形，表示祭司命人实施刮除；汉语“要把……刮净”可自然表达所要求的处置，而不必暗示祭司亲自动手。
- source_word: מִבַּיִת סָבִיב
  choice: 房子里面四周
  rationale: 这里指房屋内部环绕一周的表面；此译法简明自然，并保留“里面”和“四周”两层意思。
- source_word: וְשָׁפְכוּ
  choice: 他们要……倒到
  rationale: שׁפך 基本义为“倾倒、倒出”；在清除废料的语境中，“倒到”符合现代汉语习惯。
- source_word: הֶעָפָר
  choice: 尘土
  rationale: 原词直译为“尘土”。上下文表明这是墙面刮下的粉尘或碎料，但正文不增添原文未明确表达的“灰泥”。
- source_word: אֲשֶׁר הִקְצוּ
  choice: 刮下来的
  rationale: 指从房屋内壁刮除下来的材料，与前面的“刮净”相呼应。
- source_word: אֶל מִחוּץ לָעִיר
  choice: 到城外
  rationale: 表达向城界之外移动，符合原文介词结构的方向意义。
- source_word: אֶל מָקוֹם טָמֵא
  choice: 不洁净的地方
  rationale: “不洁净”保留利未记中 טָמֵא 的礼仪性类别，避免误解为一般卫生状况或道德污秽。
theological_decisions:
- issue: 利未记洁净条例中 טָמֵא 的译法
  choice: 不洁净
  alternative: 污秽；不洁
  rationale: “不洁净”能清楚体现礼仪上的洁净类别，又不会额外赋予道德败坏的含义。
translation_notes:
  register: 采用现代、庄重而易懂的法规叙述语体。“要把……；他们要……”保留单数责任主体与复数执行者之间的转换；不刻意补出“祭司”或“工人”。
