  yaml_path: translation/ot/leviticus/014/020.yaml
  text: Then the priest shall offer up the burnt offering and the grain offering on the altar[a], and the priest shall make atonement for him, and he shall be clean.
translation:
  language: zh_hans
  text: 祭司要把燔祭和素祭献在祭坛上，为他赎罪，他就洁净。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהֶעֱלָה
  choice: 要……献在
  rationale: עלה 的使役式在献祭语境中指把祭物献上，而不只是带到某处；结合“祭坛上”译为“献在”自然且准确。
- source_word: הָעֹלָה
  choice: 燔祭
  rationale: 这是利未记中 עלה 作为祭物名称的标准对应词，指整只焚献的祭物。
- source_word: הַמִּנְחָה
  choice: 素祭
  rationale: 在利未记的祭祀条例中，מִנְחָה 特指以细面等为主的祭物；“素祭”是简体中文圣经语境中清楚而通行的称呼。
- source_word: הַמִּזְבֵּחָה
  choice: 在祭坛上
  rationale: 带方向词尾的“祭坛”在此表示祭物被献到祭坛上，现代汉语宜表达为“在祭坛上”。
- source_word: וְכִפֶּר עָלָיו
  choice: 为他赎罪
  rationale: כפר 在祭司献祭语境中表示施行赎罪之礼，עָלָיו 表示为他、替他；“为他赎罪”保留礼仪与神学含义。
- source_word: וְטָהֵר
  choice: 他就洁净了
  rationale: Qal 形式陈述仪式完成后所得的洁净状态；“就……了”自然表达结果，同时没有把它改写成被动的洁净过程。
theological_decisions:
- issue: 祭司律法中“洁净”的性质
  choice: 保留礼仪身份意义的“洁净”
  alternative: 译作道德上的“纯洁”，或改成过程性的“被洁净”
  rationale: 利未记14章论述皮肤病污秽消除后的礼仪恢复，重点是礼仪身份而非道德转变。直译为“洁净”可保留经文本身的类别与结果陈述。
translation_notes:
  register: 采用现代、庄重而简洁的普通话。“燔祭”“素祭”“赎罪”“洁净”保留利未记祭祀制度所需的术语准确性；合并第二个“祭司”主语，符合现代汉语表达，所指仍清楚。原文末句无须设置异文脚注，因为“他就洁净了”已经直接保留其结果状态。
