id: LEV.14.21
reference: Leviticus 14:21
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/אִם דַּ֣ל ה֗וּא וְ/אֵ֣ין יָד/וֹ֮ מַשֶּׂגֶת֒ וְ֠/לָקַח כֶּ֣בֶשׂ אֶחָ֥ד אָשָׁ֛ם לִ/תְנוּפָ֖ה לְ/כַפֵּ֣ר עָלָ֑י/ו וְ/עִשָּׂר֨וֹן סֹ֜לֶת אֶחָ֨ד בָּל֥וּל בַּ/שֶּׁ֛מֶן לְ/מִנְחָ֖ה וְ/לֹ֥ג שָֽׁמֶן־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/021.yaml
  text: But if he is poor and his means are insufficient[a], then he shall take one male lamb for a guilt offering to be waved, to make atonement for him, and one-tenth of an ephah of fine flour mixed with oil for a grain offering[b], and one log of oil.
translation:
  language: zh_hans
  text: “但他若贫穷，财力不够[a]，就要取一只公羊羔作赎愆祭，行摇祭礼，为他赎罪；又要取一伊法的十分之一、用油调和的细面作素祭，并一罗革的油[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“他的手够不着”，意思是他没有足够的财力。
    reason: lexical_alternative
  - marker: b
    text: “罗革”是古代以色列礼仪条例中使用的一种小容量液体量器。
    reason: cultural_note
lexical_decisions:
- source_word: דַּל
  choice: 贫穷
  rationale: 该词表示经济状况贫困；“贫穷”在现代汉语法律礼仪语境中直接自然。
- source_word: וְאֵין יָדוֹ מַשֶּׂגֶת
  choice: 财力不够
  rationale: 希伯来语直译为“他的手够不着”，此处是指经济能力不足；正文传达实际含义，脚注保留原文意象。
- source_word: כֶּבֶשׂ אֶחָד
  choice: 一只公羊羔
  rationale: כֶּבֶשׂ在此特指公的幼羊；译出性别可保留献祭条例的精确性。
- source_word: אָשָׁם
  choice: 赎愆祭
  rationale: 采用中文圣经传统中辨识度较高的祭礼术语，以区别其他祭类，同时不对其功用作超出原文的教义解释。
- source_word: לִתְנוּפָה
  choice: 摇一摇
  rationale: 此处指将赎愆祭羊羔行摇献礼，而不是另设一种祭物；动词化表达避免误解为独立的“摇祭”。
- source_word: לְכַפֵּר עָלָיו
  choice: 为他赎罪
  rationale: 保留祭司礼仪语境中כפר的传统表达，不进一步限定赎罪机制。
- source_word: וְעִשָּׂרוֹן סֹלֶת אֶחָד
  choice: 十分之一伊法的细面
  rationale: עִשָּׂרוֹן是十分之一的量，献祭条例中通常指十分之一伊法；补出“伊法”使计量关系清楚。
- source_word: בָּלוּל בַּשֶּׁמֶן
  choice: 调油的
  rationale: 表示细面与油混合；“调油的细面”简洁、自然，适合礼仪条例。
- source_word: לְמִנְחָה
  choice: 作素祭
  rationale: מִנְחָה在利未记祭祀语境中是特定祭类；“素祭”为通行中文术语。
- source_word: לֹג שָׁמֶן
  choice: 一罗革油
  rationale: לֹג是古代以色列的特定液量单位；音译保留其技术性质，并以脚注说明。
theological_decisions:
- issue: 祭祀术语的处理
  choice: 正文保留“赎愆祭”“赎罪”“素祭”等既有祭礼术语
  alternative: 改用“赔偿祭”“除污”或解释性的礼仪描述
  rationale: 本节属于祭司法条例，保留各祭类之间的词汇区别，既维持原文的礼仪与神学张力，也避免把某一种赎罪理论带入译文。
- issue: לִתְנוּפָה与赎愆祭羊羔的关系
  choice: 译作“摇一摇”，表示对该羊羔施行摇献动作
  alternative: 译作“作为摇祭”
  rationale: 语法和上下文表明同一只羊羔是赎愆祭，并接受摇献礼；不宜使读者误以为另有一种独立祭物。
translation_notes:
  register: 采用现代、庄重而易懂的法规语体。“就要取”体现条例命令；分号区分羊羔祭物与细面、油等附属供物。所有古代计量单位均予保留，并对较陌生的“罗革”加注。
