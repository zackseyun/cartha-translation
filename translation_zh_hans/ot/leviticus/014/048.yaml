  text: וְ/אִם בֹּ֨א יָבֹ֜א הַ/כֹּהֵ֗ן וְ/רָאָה֙ וְ֠/הִנֵּה לֹא פָשָׂ֤ה הַ/נֶּ֨גַע֙ בַּ/בַּ֔יִת אַחֲרֵ֖י הִטֹּ֣חַ אֶת הַ/בָּ֑יִת וְ/טִהַ֤ר הַ/כֹּהֵן֙ אֶת הַ/בַּ֔יִת כִּ֥י נִרְפָּ֖א הַ/נָּֽגַע־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/048.yaml
  text: But if the priest comes in and looks[a], and behold, the disease has not spread in the house after the house was plastered, then the priest shall pronounce the house clean[b], because the disease is healed.
translation:
  language: zh_hans
  text: 但祭司若进屋察看，发现房屋抹灰以后，灾病没有在房屋里蔓延，祭司就要宣布这房屋为洁净，因为灾病已经痊愈。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאִם
  choice: 但……若
  rationale: 承接上一种处置结果并引出相反条件；“但……若”既表达对比，也符合现代汉语法规语体。
- source_word: בֹּא יָבֹא
  choice: 进屋
  rationale: 不定式绝对式加强动词语意；汉语不宜机械重复，以“进屋”自然表达祭司进入房屋检查的程序。
- source_word: וְרָאָה
  choice: 察看
  rationale: 基本义为“看”，此处处于祭司检查房屋的程序中；“察看”既保留视觉动作，也自然体现检视语境。
- source_word: וְהִנֵּה
  choice: 发现
  rationale: 该话语标记引出察看的结果。汉语用“发现”自然呈现其引人注意及结果显现的功能，无须生硬译作“看哪”。
- source_word: לֹא פָשָׂה
  choice: 没有……蔓延
  rationale: פשה在利未记皮肤及房屋灾病语境中指扩散；“蔓延”准确而通俗。
- source_word: הַנֶּגַע
  choice: 灾病
  rationale: נגע可指打击、灾患或病变；这里是房屋所受、可蔓延又可“痊愈”的异常灾患。“灾病”保留其广义及拟病化表达，避免把它等同于现代医学诊断，也比“瘟疫”准确。
- source_word: בַּבַּיִת
  choice: 在房屋里
  rationale: 按希伯来语介词译出病变在房屋内部蔓延的意思。
- source_word: אַחֲרֵי הִטֹּחַ אֶת־הַבָּיִת
  choice: 房屋抹灰以后
  rationale: טוח指涂抹或抹灰；结合前文以新灰泥抹房屋的修复程序，“抹灰”具体、自然。原文未强调施工者，汉语以主语为房屋的表达保持这一点。
- source_word: וְטִהַר הַכֹּהֵן אֶת־הַבָּיִת
  choice: 祭司就要宣布这房屋为洁净
  rationale: טהר在祭司洁净条例中可表示判定或宣布为洁净。这样既体现祭司的礼仪裁定职责，也不误解为祭司此时亲自清洗房屋。
- source_word: כִּי נִרְפָּא הַנָּגַע
  choice: 因为灾病已经痊愈
  rationale: נרפא是רפא的被动/中间式，使用“痊愈”保留原文把房屋灾病拟作可医治之病的表达；“已经”符合检查时确认完成状态的语境。
theological_decisions:
- issue: וְטִהַר表示礼仪裁定还是实际清洗
  choice: 祭司宣布房屋为洁净
  alternative: 祭司洁净房屋
  rationale: 上下文中抹灰等实际修复工作已经完成，此刻祭司根据灾病没有蔓延作出洁净裁定。译为“宣布……为洁净”明确祭司在礼仪法律程序中的判定作用，同时不排除后续洁净礼仪。
translation_notes:
  register: 采用现代、庄重而清楚的法规叙述语体。“察看”“抹灰”“宣布……为洁净”适合普通读者，也保留祭司条例的程序性；不使用过度古雅的“看哪”或容易误导的“瘟疫”。
