base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/003.yaml
  text: The priest shall go out to a place outside the camp[a], and the priest shall examine him; and behold, the disease of leprosy has been healed in the one with the skin disease,
translation:
  language: zh_hans
  text: 祭司要到营外去；祭司察看，见那患皮肤病的人身上的皮肤病患已经痊愈，
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְיָצָא
  choice: 要……去
  rationale: 在礼仪法规的程序语境中，带连接词的完成式表示规定要采取的行动；现代汉语用“要”自然表达这一规范性。
- source_word: הַכֹּהֵן
  choice: 祭司
  rationale: 这是祭祀与礼仪语境中 כֹּהֵן 的标准译法；原文重复出现，译文也保留重复。
- source_word: אֶל מִחוּץ לַמַּחֲנֶה
  choice: 到营外去
  rationale: אֶל 表示朝向，מִחוּץ לַמַּחֲנֶה 指营地之外；“到营外去”准确而符合现代汉语习惯。
- source_word: וְרָאָה
  choice: 察看
  rationale: ראה 本义为“看见”，但在本段检验条例中指祭司作出仔细检查；“察看”兼顾语义和语域。
- source_word: וְהִנֵּה
  choice: 若见
  rationale: הִנֵּה 本可译作“看哪”，这里引出祭司察看所得的情形；“若见”保留其发现、呈现功能，也符合汉语法规叙述。
- source_word: נִרְפָּא
  choice: 已经痊愈
  rationale: Niphal 形式表达被治好或进入痊愈状态；“已经痊愈”突出察看时已形成的结果状态。
- source_word: נֶגַע הַצָּרַעַת
  choice: 灾病
  rationale: נֶגַע 指击打、灾患或病症，צָרַעַת 是礼仪分类术语，其范围并不等同现代麻风病；正文用较宽泛的“灾病”，避免不当限定。
- source_word: מִן הַצָּרוּעַ
  choice: 那患皮肤病的人身上的
  rationale: מִן 表示病患已从患者身上消退；将其转化为“人身上的”可在汉语中自然表达病症与患者分离的关系。
theological_decisions:
- issue: צָרַעַת / צָרוּעַ 的译法
  choice: 皮肤病／患皮肤病的人
  alternative: 麻风病／麻风病人
  rationale: 该希伯来术语涵盖一类造成礼仪不洁的皮肤病变，不能简单等同于现代医学所称的麻风病（汉森病）。采用宽泛译法可避免时代错置，同时不对具体病因作超出原文的判断。
- issue: וְהִנֵּה 的条件性与呈现性
  choice: 若见
  alternative: 看哪
  rationale: 在检验程序中，该词既呈现祭司发现的事实，也在句法功能上引出后续条件。“若见”适合现代汉语法规语境，但不把病愈本身解释为任何特定神学机制。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。保留“祭司”的重复，以反映原文的程序性节奏；不用容易令人误解为现代汉森病的“麻风病”。本节希伯来原文句末仍未完结，因此译文以逗号收束。
