  text: Then he shall release the live bird outside the city into the open field. Thus he shall make atonement for the house[a], and it shall be clean.
translation:
  language: zh_hans
  text: 然后，他要把那只活鸟放飞到城外的野地里。他要这样为房屋赎罪[a]，房屋就洁净了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“为房屋除污”或“为房屋行除罪礼”。希伯来文在这里的礼仪洁净语境中使用了祭司赎罪用语。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשִׁלַּח
  choice: 然后，他要……放到
  rationale: 此处是 שלח 的加强词干，用于放走活鸟的礼仪行动；“然后”自然表达连接词所体现的步骤次序，而“放到……野地里”在汉语中包含使其离去、得以自由的意思。
- source_word: הַצִּפֹּר הַחַיָּה
  choice: 那只活鸟
  rationale: “活鸟”简洁自然，也保留了它与此前被宰之鸟的鲜明对比；指示词“那只”符合上下文已知所指。
- source_word: אֶל מִחוּץ לָעִיר אֶל פְּנֵי הַשָּׂדֶה
  choice: 到城外的野地里
  rationale: 两个方向短语共同表示把鸟送往城界以外的开阔田野。“野地”比逐字译作“田地的表面”自然，也保留了远离居住区、进入开阔地带的空间含义。
- source_word: וְכִפֶּר עַל הַבַּיִת
  choice: 他要这样为房屋赎罪
  rationale: 保留祭司礼仪中 כפר 的核心赎罪用语及其作用于房屋时形成的张力，不将其无声简化为一般清洗；“这样”表明赎罪是借上述礼仪完成的。
- source_word: וְטָהֵר
  choice: 房屋就洁净了
  rationale: 动词描述礼仪完成后房屋所处的洁净状态。汉语明确补出“房屋”作主语，避免把洁净误解为祭司或活鸟的状态。
theological_decisions:
- issue: כפר 用于房屋洁净礼时应如何表达
  choice: 为房屋赎罪
  alternative: 为房屋除污；为房屋行除罪礼
  rationale: 原文刻意采用祭司体系的赎罪术语，即使对象是房屋。正文保留这种不寻常的神学与礼仪张力，不预设某一后来的赎罪理论；脚注则说明在本段语境中也可侧重理解为除污或除罪。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“房屋”与本章礼仪法规的正式语域相称；正文保留“为房屋赎罪”这一原文中真实而不寻常的表达，并用脚注提示其礼仪洁净含义。
