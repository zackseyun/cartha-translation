  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וּ/בָא֙ הַ/כֹּהֵ֔ן וְ/רָאָ֕ה וְ/הִנֵּ֛ה פָּשָׂ֥ה הַ/נֶּ֖גַע בַּ/בָּ֑יִת צָרַ֨עַת מַמְאֶ֥רֶת הִ֛וא בַּ/בַּ֖יִת טָמֵ֥א הֽוּא׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/044.yaml
  text: then the priest shall come and inspect[a], and if indeed the infection has spread in the house, it is a destructive mildew in the house[b]; it is unclean.
translation:
  language: zh_hans
  text: 祭司就要来察看；如果灾病确实在房屋里蔓延，这房屋里的是一种侵蚀性的灾病[a]；这房屋是不洁净的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “灾病”所译的希伯来词在此用于房屋，也用于人和衣物上的异常征象；传统上常译作“麻风病”，但并不是指现代医学所说的麻风病。“侵蚀性的”也可译作“恶性的”或“毁坏性的”。
    reason: 说明 צָרַעַת 的广义礼仪用法，避免将其等同于现代霉菌或特定疾病，并保留 מַמְאֶרֶת 的词义幅度。
lexical_decisions:
- source_word: וּבָא
  choice: 就要进去
  rationale: 在祭司法例的程序语境中，连词加完成式表达接续的规定动作；“就要”体现先后程序，“进去”按房屋察验的语境自然表达祭司进入其中。
- source_word: הַכֹּהֵן
  choice: 祭司
  rationale: 准确保留执行礼仪鉴定之职分的定指称谓。
- source_word: וְרָאָה
  choice: 察看
  rationale: 原义是“看”，此处具有检验、鉴定意味；“察看”既自然，又不添加原文没有的技术性细节。
- source_word: וְהִנֵּה
  choice: 如果……确实
  rationale: 在察验程序中引出所发现的情况；“如果”体现条件关系，“确实”传达 הִנֵּה 的指示与确认语气。
- source_word: פָּשָׂה
  choice: 蔓延
  rationale: 此动词在灾病语境中指范围扩展；“蔓延”适用于房屋上的异常斑迹。
- source_word: הַנֶּגַע
  choice: 灾病
  rationale: נֶגַע 是利未记中涵盖人体、衣物和房屋异常征象的专门类别。“灾病”保留其广义及礼仪语境，避免将其限定为现代医学感染。
- source_word: צָרַעַת
  choice: 霉斑
  rationale: 该词在这里用于房屋，不宜译成现代意义的“麻风病”或“皮肤病”。正文以“霉斑”自然指向建筑物上的破坏性异常，但脚注说明希伯来词的范围更广，且并非现代科学诊断。
- source_word: מַמְאֶרֶת
  choice: 恶性
  rationale: 此词表示严重、有侵蚀或败坏性质；“恶性”在此修饰房屋霉斑，表达其严重性，同时保留“侵蚀性”等可能含义。
- source_word: טָמֵא הוּא
  choice: 这房屋是不洁净的
  rationale: “不洁净”是利未记礼仪状态术语的常规表达；明确补出“这房屋”，避免汉语中的代词指向含混。
theological_decisions:
- issue: 房屋语境中 צָרַעַת 的译法
  choice: 正文译作“霉斑”，并用脚注交代其广义礼仪类别
  alternative: 麻风病；皮肤病；灾病
  rationale: 原文把同一术语用于人、衣物和房屋，因此不能将这里解释为现代汉生病，也不宜在房屋上使用“皮肤病”。“霉斑”使现代读者明白此处所见的房屋现象；脚注则避免把希伯来词过度等同于现代霉菌学诊断。
- issue: טָמֵא 的性质
  choice: 译作“不洁净”，保留礼仪状态用语
  alternative: 不纯洁；受污染
  rationale: 本节是在祭司鉴定条例中宣告房屋的礼仪状态，而不是作单纯卫生或道德判断。“不洁净”最能与利未记整体的洁净体系保持一致。
- issue: 程序性句法
  choice: 用“就要……；如果……”表达规定程序
  alternative: 按过去时叙事译为“祭司进来察看了”
  rationale: 上下文属于法律程序，不是对一次既成事件的叙述；规定式表达忠实呈现其功能。
translation_notes:
  register: 采用现代、庄重而易懂的法规文体。“祭司就要进去察看”呈现接续程序；“灾病”作为本章反复出现的礼仪诊断类别，“霉斑”则自然说明房屋中的具体表现。脚注标记[a]已在正文出现。
