  text: לְ/הוֹרֹ֕ת בְּ/י֥וֹם הַ/טָּמֵ֖א וּ/בְ/י֣וֹם הַ/טָּהֹ֑ר זֹ֥את תּוֹרַ֖ת הַ/צָּרָֽעַת׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/057.yaml
  text: to give instruction about when it is unclean and when it is clean. This is the law concerning the defiling condition[a].
translation:
  language: zh_hans
  text: 用以指示何时为不洁，何时为洁净。这是有关这种不洁现象的条例[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “不洁现象”传统上常译作“麻风病”。这里的希伯来词可指人、衣物或房屋上使其成为不洁的异常状况，并不限于现代医学所说的麻风病（汉森病）。
    reason: 说明关键希伯来词的传统译法和实际语义范围，避免把礼仪类别误解为单一的现代疾病。
lexical_decisions:
- source_word: לְהוֹרֹת
  choice: 为要指示
  rationale: 该词为使役形，表示作出具有权威性的教导或指示；“指示”既保留律法语境中的权威意味，也符合本节总结前文条例的功能。
- source_word: בְּיוֹם הַטָּמֵא וּבְיוֹם הַטָּהֹר
  choice: 何时不洁，何时洁净
  rationale: 这里的“日子”是时间习语，重点在于辨明相关情形何时属于不洁、何时属于洁净，并非指两个特定的日历日期。
- source_word: תּוֹרַת
  choice: 条例
  rationale: תּוֹרָה在这里指规范这一类情形的祭司律例；“条例”自然、庄重，且适合本章结语。
- source_word: הַצָּרָעַת
  choice: 灾病
  rationale: 该希伯来词所指的礼仪类别可见于人体、衣物和房屋，不宜限定为现代医学上的麻风病。“灾病”保留其有害异常状态的含义，并能涵盖本章所列各种对象；脚注说明其传统译法及范围。
theological_decisions:
- issue: צָרַעַת在利未记洁净条例中的含义范围
  choice: 正文译作“灾病”，并以脚注解释
  alternative: 麻风病；皮肤病；致污秽的病变
  rationale: 原文是范围较广的礼仪分类，不仅涉及人的皮肤，也涉及衣物和房屋。译作“麻风病”容易造成现代医学上的错误等同，译作“皮肤病”又无法涵盖非人体对象。“灾病”保留原文类别的广度，而“不洁／洁净”的上下文已明确其礼仪后果。
- issue: בְּיוֹם的时间表达
  choice: 译作“何时”
  alternative: 在不洁的日子和洁净的日子
  rationale: 这里是在说明如何识别不洁与洁净的时机或状态。直译为“日子”会使现代读者误以为经文在规定具体日期。
translation_notes:
  register: 采用现代、庄重而易懂的律法文体。“为要指示”承接本章前面的条例；“何时不洁，何时洁净”以自然汉语表达希伯来语的时间习语。脚注标记[a]置于所解释的“灾病”之后。
