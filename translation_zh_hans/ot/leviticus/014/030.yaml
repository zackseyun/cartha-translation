  text: וְ/עָשָׂ֤ה אֶת הָֽ/אֶחָד֙ מִן הַ/תֹּרִ֔ים א֖וֹ מִן בְּנֵ֣י הַ/יּוֹנָ֑ה מֵ/אֲשֶׁ֥ר תַּשִּׂ֖יג יָדֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/030.yaml
  text: And he shall offer one of the turtledoves or one of the young pigeons[a], according to what his means can afford—
translation:
  language: zh_hans
  text: 他要按他所能负担的程度[a]，献上一只斑鸠或一只雏鸽——
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“按他的手所能达到的”，是指按他负担得起的程度。
    reason: 说明希伯来习语的字面形象和实际含义。
lexical_decisions:
- source_word: וְעָשָׂה
  choice: 献上
  rationale: עָשָׂה本义为“做、行”，但在献祭语境中指办理或献上祭物；译为“献上”自然且切合上下文。
- source_word: אֶת הָאֶחָד
  choice: 一只
  rationale: 这里指从随后列出的鸟类中取一只；汉语以量词“只”清楚表达。
- source_word: מִן־הַתֹּרִים
  choice: 斑鸠
  rationale: תֹּרִים在利未记献祭条例中指斑鸠，而非泛指所有鸠鸽。
- source_word: אוֹ מִן־בְּנֵי הַיּוֹנָה
  choice: 或一只雏鸽
  rationale: בְּנֵי הַיּוֹנָה是指幼鸽的固定表达；补出“一只”符合现代汉语，也清楚保留二选一的结构。
- source_word: מֵאֲשֶׁר תַּשִּׂיג יָדוֹ
  choice: 按自己力所能及的
  rationale: 原文直译为“从他手所能达到的”，是表示个人经济能力的希伯来习语。“力所能及”既传达负担能力，也保留“所及”的形象。
theological_decisions: []
