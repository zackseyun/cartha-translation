  text: and for a skin disease in a garment or in a house,[a]
translation:
  language: zh_hans
  text: 以及衣物和房屋上的察拉阿特[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “察拉阿特”是希伯来语术语，传统上常译作“麻风病”。但在《利未记》中，它所指范围更广，也包括衣物和房屋上出现的异常现象；其具体性质不能确定。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְ
  choice: 以及……上的
  rationale: 连词和介词承接前文所列各类条例；“以及”保留清单结构，而“……上的”结合本节两个对象，清楚表达所涉及的灾病。
- source_word: צָרַעַת
  choice: 灾病
  rationale: צָרַעַת 在利未记中不只指人体病变，也可指衣物和房屋表面的异常现象。“灾病”避免误解为现代医学所称的麻风病，也保留其作为一种需按礼仪条例查验之异常状况的宽泛含义。
- source_word: הַבֶּגֶד
  choice: 衣物
  rationale: 此处为类别性用法；“衣物”比“衣服”略为庄重，并可涵盖本章所说不同材质的织物或制品。
- source_word: וְלַבָּיִת
  choice: 和房屋上的
  rationale: 保留希伯来语连接词“和”，并按上下文将介词的关系自然表达为发生在房屋上的灾病。
theological_decisions:
- issue: צָרַעַת 是否应译为“麻风病”
  choice: 灾病
  alternative: 麻风病／大麻风
  rationale: 该词在本节明确用于衣物和房屋，不能等同于一种人体临床疾病；采用较宽泛的译法，不对其具体性质作超出原文的判定。
translation_notes:
  register: 采用现代、简洁而庄重的书面语。“以及”承接前文清单；“灾病”配合脚注，既便于普通读者理解，又避免将希伯来词限定为现代医学意义上的麻风病。
