  text: וְ/שָׁ֥ב הַ/כֹּהֵ֖ן בַּ/יּ֣וֹם הַ/שְּׁבִיעִ֑י וְ/רָאָ֕ה וְ/הִנֵּ֛ה פָּשָׂ֥ה הַ/נֶּ֖גַע בְּ/קִירֹ֥ת הַ/בָּֽיִת׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/039.yaml
  text: Then the priest shall return on the seventh day and look, and if the infection has spread in the walls of the house,
translation:
  language: zh_hans
  text: 第七天，祭司要回来察看；如果灾病在房屋的墙壁上蔓延了，
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְשָׁב
  choice: 要回来
  rationale: 该动词表示“返回、再来”；结合律法语境，用“要回来”自然表达规定性的动作。
- source_word: וְרָאָה
  choice: 察看
  rationale: 这里不是一般的“看”，而是祭司为判断灾病状况而检查，译作“察看”较准确。
- source_word: הַנֶּגַע
  choice: 灾病
  rationale: נגע在本章指可见且需由祭司鉴定的异常灾害或病征；“灾病”既保留其灾害色彩，也避免用现代医学术语过度限定。
- source_word: פָשָׂה
  choice: 蔓延了
  rationale: 表示灾病扩展、散布；“蔓延”符合墙壁上病征扩大的语境。
- source_word: בְּקִירֹת הַבָּיִת
  choice: 在房屋的墙壁上
  rationale: 忠实呈现复数“墙壁”和介词所表达的所在范围。
theological_decisions:
- issue: וְהִנֵּה在条件句中的表达
  choice: 译为“如果”，不另译“看哪”
  alternative: “察看，看哪，灾病已经……”
  rationale: 此处וְהִנֵּה引出祭司察看后可能发现的情形，汉语律例叙述以“如果”最自然；这不改变祭司鉴察与后续裁定的条件性质。
translation_notes:
  register: 采用现代、庄重而清楚的律法叙述语体。经文句末保留逗号，因为本节是延续到下一节的条件从句。
