  text: וְ/שָׁחַ֖ט אֶת הַ/צִּפֹּ֣ר הָ/אֶחָ֑ת אֶל כְּלִי חֶ֖רֶשׂ עַל מַ֥יִם חַיִּֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/050.yaml
  text: Then he shall slaughter the one bird into an earthenware vessel over living water[a].
translation:
  language: zh_hans
  text: 然后，他要在一个盛有活水[a]的陶器上方宰杀那一只鸟。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“活水”（字面为“活的水”）；此处指新鲜的水或流动的水。
    reason: 说明希伯来语习语的字面形式及其在礼仪语境中的含义。
lexical_decisions:
- source_word: וְשָׁחַט
  choice: 然后，他要……宰杀
  rationale: 承接礼仪程序的连续指令；“然后”体现次序，“要”表达规定性，“宰杀”准确指有意放血的礼仪性杀牲。
- source_word: הַצִּפֹּר הָאֶחָת
  choice: 其中一只鸟
  rationale: 原文直译近于“那一只鸟”，语境中是从先前提到的两只鸟中取一只；不擅自译成“第一只”。
- source_word: אֶל
  choice: 在……上
  rationale: 该介词在此表示宰杀时血流入器皿；结合中文句式译作“宰杀在盛有……的陶器上”，既保留仪式画面，也避免误解为把鸟杀进器皿内部。
- source_word: כְּלִי חֶרֶשׂ
  choice: 陶器
  rationale: 指陶土制成的器皿；“陶器”简洁、自然，并保留器皿材质的规定。
- source_word: עַל מַיִם חַיִּים
  choice: 盛有活水
  rationale: עַל 在此结合器皿和水，表示宰杀是在器皿中的水之上进行；用“盛有”明确水在陶器内。
- source_word: מַיִם חַיִּים
  choice: 活水
  rationale: 保留希伯来语“活的水”的字面表达及其跨经文呼应；脚注说明此处实际指新鲜或流动的水。
theological_decisions:
- issue: 礼仪洁净语境中 מַיִם חַיִּים 的译法
  choice: 活水
  alternative: 新鲜的水；流动的水
  rationale: “活水”直接保存原文措辞及潜在的经文互文意义，同时用脚注交代该希伯来习语在本处所指的新鲜或流动之水，不把字面表达与实际含义混为一谈。
translation_notes:
  register: 采用现代、庄重而易懂的礼仪法规文体。“其中一只”自然呈现两只鸟中择一的含义；“盛有活水的陶器上”使器皿、水与宰杀动作的关系清楚，同时保留原文“活水”的表达。
