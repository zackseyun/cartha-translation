id: LEV.14.13
reference: Leviticus 14:13
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/שָׁחַ֣ט אֶת הַ/כֶּ֗בֶשׂ בִּ֠/מְקוֹם אֲשֶׁ֨ר יִשְׁחַ֧ט אֶת הַֽ/חַטָּ֛את וְ/אֶת הָ/עֹלָ֖ה בִּ/מְק֣וֹם הַ/קֹּ֑דֶשׁ כִּ֡י כַּ֠/חַטָּאת הָ/אָשָׁ֥ם הוּא֙ לַ/כֹּהֵ֔ן קֹ֥דֶשׁ קָֽדָשִׁ֖ים הֽוּא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/013.yaml
  text: And he shall slaughter the lamb in the place where they slaughter the sin offering and the burnt offering[a], in the holy place; for like the sin offering, the guilt offering belongs to the priest[b]; it is most holy.
translation:
  language: zh_hans
  text: 他要在宰杀赎罪祭[a]和燔祭的地方，就是圣处，宰杀这只羊羔；因为赎愆祭[b]和赎罪祭一样，归祭司所有；赎愆祭是至圣的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “赎罪祭”也可译作“洁净祭”，强调这种祭在祭司法中的洁净作用。
    reason: lexical_alternative
  - marker: b
    text: “赎愆祭”也可译作“赔偿祭”或“补偿祭”，强调其赔偿或补偿的一面。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁחַט
  choice: 要……宰杀
  rationale: שׁחט在献祭语境中特指礼仪性的宰杀；用“宰杀”比一般的“杀”更准确。未明确补出主语，以保留希伯来文在上下文中所指执行者的衔接。
- source_word: הַכֶּבֶשׂ
  choice: 这只羊羔
  rationale: כֶּבֶשׂ通常指羊羔；加“这只”自然承接上文已经指定的祭牲。
- source_word: בִּמְקוֹם אֲשֶׁר יִשְׁחַט
  choice: 在宰杀……的地方
  rationale: יִשְׁחַט在法规中可作泛指；汉语无需增添“他”或“他们”，即可自然表达规定的宰杀地点。
- source_word: הַחַטָּאת
  choice: 赎罪祭
  rationale: 这是现代中文圣经语境中辨识度高且稳定的祭类名称；该词在祭司法中也可侧重洁净功能，故以脚注保留“洁净祭”的可能译法。
- source_word: הָעֹלָה
  choice: 燔祭
  rationale: “燔祭”是עֹלָה在中文圣经传统中明确而简洁的标准祭类名称。
- source_word: בִּמְקוֹם הַקֹּדֶשׁ
  choice: 在圣处
  rationale: 原文有定冠词，指指定的神圣区域；“圣处”比“圣所”更能避免使读者误以为是帐幕内部的特定房间。
- source_word: הָאָשָׁם
  choice: 赎愆祭
  rationale: “赎愆祭”保留אָשָׁם作为特定献祭类别的传统名称，也与“赎罪祭”清楚区分；其赔偿、补偿层面在脚注中说明。
- source_word: לַכֹּהֵן
  choice: 归祭司的
  rationale: 介词ל在此表达祭司对祭物的权利或所得；“归祭司的”简洁传达这一含义。
- source_word: קֹדֶשׁ קָדָשִׁים הוּא
  choice: 这是至圣的
  rationale: קֹדֶשׁ קָדָשִׁים是祭司法中的最高神圣等级表达；“至圣”自然且保留其技术性。
theological_decisions:
- issue: חַטָּאת在祭司法中的含义
  choice: 赎罪祭
  alternative: 洁净祭
  rationale: 该词既是传统上称为“赎罪祭”的祭类，也常承担洁净污秽的礼仪功能。正文采用读者熟悉的祭类名称，同时在脚注保留强调洁净功能的译法，避免把词义只限定为道德罪责。
- issue: אָשָׁם的祭类名称
  choice: 赎愆祭
  alternative: 赔偿祭（或补偿祭）
  rationale: “赎愆祭”能保持既有祭类辨识度；“赔偿祭”则突出某些相关律例中的偿还层面。正文不把该祭单纯化为经济赔偿，脚注保留另一理解重点。
- issue: כַּחַטָּאת הָאָשָׁם הוּא לַכֹּהֵן的句法关系
  choice: 因为赎愆祭和赎罪祭一样，是归祭司的
  alternative: 因为赎愆祭如同赎罪祭；它是归祭司的
  rationale: 两种表达都反映赎愆祭与赎罪祭的类比及祭司所得权。正文用流畅的单句呈现，不额外断定类比超出本节所说的祭司权益。
translation_notes:
  register: 采用现代、庄重而易懂的法规体。保留“燔祭、赎罪祭、赎愆祭、至圣”等必要的祭祀术语；地点译作“圣处”，避免与作为建筑区域名称的“圣所”混淆。正文中的脚注标记[a]与脚注一致。
