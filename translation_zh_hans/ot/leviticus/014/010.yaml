  text: וּ/בַ/יּ֣וֹם הַ/שְּׁמִינִ֗י יִקַּ֤ח שְׁנֵֽי כְבָשִׂים֙ תְּמִימִ֔ים וְ/כַבְשָׂ֥ה אַחַ֛ת בַּת שְׁנָתָ֖/הּ תְּמִימָ֑ה וּ/שְׁלֹשָׁ֣ה עֶשְׂרֹנִ֗ים סֹ֤לֶת מִנְחָה֙ בְּלוּלָ֣ה בַ/שֶּׁ֔מֶן וְ/לֹ֥ג אֶחָ֖ד שָֽׁמֶן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/010.yaml
  text: And on the eighth day he shall take two male lambs without blemish[a], and one ewe lamb a year old without blemish, and three-tenths of an ephah of fine flour as a grain offering mixed with oil, and one log of oil.
translation:
  language: zh_hans
  text: 第八天，他要取两只没有残疾的公羊羔、一只一岁的没有残疾的母羊羔，又取十分之三伊法调油的细面作素祭，并取一罗革油[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “罗革”是古代以色列礼仪中使用的一种小容量液体单位。
    reason: cultural_note
lexical_decisions:
- source_word: וּבַיּוֹם הַשְּׁמִינִי
  choice: 第八天
  rationale: 承接前文的礼仪程序；现代汉语不必机械译出句首连接词，也能清楚表达次序。
- source_word: יִקַּח
  choice: 他要取
  rationale: 未完成式在律法条文中具有指令性；“要取”自然保留规定的语气。
- source_word: שְׁנֵי כְבָשִׂים
  choice: 两只公羊羔
  rationale: 阳性名词与下文阴性的母羊羔形成有意义的性别对照，故明确译出“公”。
- source_word: תְּמִימִים / תְּמִימָה
  choice: 没有残疾
  rationale: 在献祭语境中指牲畜没有可使其不合礼仪要求的缺陷；此译法准确而易懂。
- source_word: וְכַבְשָׂה אַחַת בַּת שְׁנָתָהּ
  choice: 一只一岁的母羊羔
  rationale: 保留牲畜的性别和年龄要求，并以自然的现代汉语表达希伯来语年龄习语。
- source_word: וּשְׁלֹשָׁה עֶשְׂרֹנִים
  choice: 十分之三伊法
  rationale: עִשָּׂרוֹן是十分之一的量；此处为三份，按本段量制语境明确表达为十分之三伊法。
- source_word: סֹלֶת
  choice: 细面
  rationale: 指献祭所用精细研磨的面粉；“细面”简明并符合礼仪语域。
- source_word: מִנְחָה
  choice: 素祭
  rationale: 在利未记献祭术语中专指以谷物为核心的供物；“素祭”是简洁且通行的中文术语。
- source_word: בְּלוּלָה בַשֶּׁמֶן
  choice: 调油
  rationale: 表达细面与油混合的状态；“调油”自然、简洁，并保留制作要求。
- source_word: וְלֹג אֶחָד שָׁמֶן
  choice: 一罗革油
  rationale: לֹג是特定的古代液体容量单位，没有完全对应的现代单位，故音译并用脚注说明。
