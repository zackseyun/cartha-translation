base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/036.yaml
  text: Then the priest shall command that they empty the house before the priest goes in to inspect the diseased area[a], so that everything in the house may not become unclean; and afterward the priest shall go in to inspect the house.
translation:
  language: zh_hans
  text: 祭司要吩咐人，在他进去察看患处[a]以前，先把房子腾空，免得房里的一切都成为不洁净的。之后，祭司要进去察看房子。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“斑痕”“灾病”。希伯来语 נֶגַע 指祭司所察看的受侵害部位或异常状况。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְצִוָּה
  choice: 祭司要吩咐
  rationale: 在程序性律法中，连词加完成式表示随后应执行的步骤；中文用“要吩咐”自然表达规定与次序。
- source_word: וּפִנּוּ אֶת־הַבַּיִת
  choice: 先把房子腾空
  rationale: 复数动词的施事者未明确指出，中文以“吩咐人……把房子腾空”表达不定施事，并清楚说明须移出屋内物品。
- source_word: בְּטֶרֶם
  choice: 在……以前，先
  rationale: 准确表达祭司检查之前的时间关系；“先”同时凸显程序次序。
- source_word: לִרְאוֹת
  choice: 察看
  rationale: 字面义为“看”，在祭司履行鉴定职责的语境中表示正式查看；“察看”既自然又不过度技术化。
- source_word: הַנֶּגַע
  choice: 患处
  rationale: נֶגַע指受侵害的斑点或异常状况；“患处”保留其可见部位与受损状态的含义，同时不把它限定为现代医学上的传染病。
- source_word: וְלֹא יִטְמָא
  choice: 免得……成为不洁净的
  rationale: 该分句说明事先腾空房子的预防目的；“免得”自然传达目的或所避免的结果。
- source_word: כָּל אֲשֶׁר בַּבָּיִת
  choice: 房里的一切
  rationale: 简洁指称房屋内所有物品，忠实保留“所有在房中的”这一范围。
- source_word: וְאַחַר כֵּן
  choice: 之后
  rationale: 标明随后进行的程序步骤，现代中文简洁自然。
- source_word: לִרְאוֹת אֶת־הַבָּיִת
  choice: 察看房子
  rationale: 第二处以整座房子为宾语；保持“察看”一致，也保留从患处到房屋整体的表述变化。
theological_decisions:
- issue: 礼仪不洁术语 טמא
  choice: 成为不洁净的
  alternative: 沾染污秽；成为不洁
  rationale: 此处指利未记礼仪制度中的不洁状态，并不必然表示道德罪责；“成为不洁净的”清楚且避免道德化。
translation_notes:
  register: 采用现代、庄重而易懂的程序性法规语体。“腾空”明确表示移出屋内物品；“患处”配合脚注保留 נֶגַע 的语义幅度。
