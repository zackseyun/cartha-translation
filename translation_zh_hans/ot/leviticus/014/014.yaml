base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/014.yaml
  text: Then the priest shall take some of the blood of the guilt offering[a], and the priest shall put it on the lobe of the right ear of the one being cleansed, and on the thumb of his right hand[b], and on the big toe of his right foot.
translation:
  language: zh_hans
  text: 祭司要取一些赎过祭的血[a]，抹在那正在接受洁净之人的右耳垂[b]上、右手大拇指上和右脚大脚趾上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“从赎过祭的血中取”。
    reason: lexical_alternative
  - marker: b
    text: 或译“右耳尖”。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִדַּם הָאָשָׁם
  choice: 一些赎过祭牲的血
  rationale: מִן在这里具有部分义，指从祭牲的血中取出一部分用于礼仪。“一些……的血”符合现代汉语表达；אָשָׁם指特定的赎过祭，而“祭牲”明确血来自所献的牲畜。
- source_word: הָאָשָׁם
  choice: 赎过祭
  rationale: אָשָׁם在利未记中指与罪责及补偿相关的特定祭类。“赎过祭”既区别于חַטָּאת所指的祭，也比现代读者较难理解的“赎愆祭”更通俗。
- source_word: תְּנוּךְ אֹזֶן
  choice: 耳垂
  rationale: תְּנוּךְ指耳朵的边缘或柔软末端；在此礼仪语境中，“耳垂”是自然且较可能的解剖部位，同时以脚注保留“耳尖”的可能性。
- source_word: הַמִּטַּהֵר
  choice: 那正在接受洁净之人
  rationale: טהר的Hitpael分词在此指处于洁净礼过程中的人。此译文突出过程及其作为祭司礼仪接受者的身份，不将其误解为自行洁净。
- source_word: בֹּהֶן יָדוֹ הַיְמָנִית
  choice: 右手大拇指
  rationale: בֹּהֶן与手连用时指拇指；现代汉语通常说“大拇指”。
- source_word: בֹּהֶן רַגְלוֹ הַיְמָנִית
  choice: 右脚大脚趾
  rationale: בֹּהֶן与脚连用时指最大的脚趾；“大脚趾”是现代汉语的直接表达。
- source_word: וְלָקַח ... וְנָתַן
  choice: 要取……抹在
  rationale: 两个完成式在礼仪法规中表达规定的动作。“要”体现指令性；血施于身体部位时用“抹”比泛泛的“放”更符合汉语习惯。
theological_decisions:
- issue: 洁净礼接受者的角色
  choice: 译作“正在接受洁净之人”，表明此人正处于祭司执行的洁净礼中
  alternative: 求洁净之人；洁净自己的人；已经洁净的人
  rationale: Hitpael形式本身可带反身或过程色彩，但上下文由祭司实施仪式，故不宜暗示此人凭自己完成洁净，也不宜把尚在进行的礼仪说成已经完成。
- issue: אָשָׁם祭的性质
  choice: 赎过祭
  alternative: 赎愆祭；赔偿祭；罪责祭
  rationale: 该词兼有罪责和赔偿关联。“赎过祭”保留其作为独立祭类的性质，又不把其完全化约为经济赔偿；译文不进一步规定其神学机制。
translation_notes:
  register: 采用现代、庄重而易懂的礼仪法规语体。句式保留原文依次列举右耳、右手和右脚的结构；“赎过祭”用于兼顾祭类区分与当代可理解性。所有脚注标记均置于相应词语之后。
