  text: וְ/הָיָה֩ בַ/יּ֨וֹם הַ/שְּׁבִיעִ֜י יְגַלַּ֣ח אֶת כָּל שְׂעָר֗/וֹ אֶת רֹאשׁ֤/וֹ וְ/אֶת זְקָנ/וֹ֙ וְ/אֵת֙ גַּבֹּ֣ת עֵינָ֔י/ו וְ/אֶת כָּל שְׂעָר֖/וֹ יְגַלֵּ֑חַ וְ/כִבֶּ֣ס אֶת בְּגָדָ֗י/ו וְ/רָחַ֧ץ אֶת בְּשָׂר֛/וֹ בַּ/מַּ֖יִם וְ/טָהֵֽר־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/009.yaml
  text: 'And on the seventh day he shall shave off all his hair: his head[a], his beard, and his eyebrows. He shall shave off all his hair, wash his clothes, and bathe his body in water; then he shall be clean.'
translation:
  language: zh_hans
  text: 第七天，他要把全身的毛发都剃掉，就是头发、胡须和眉毛；他要剃掉全身所有的毛发，洗净衣服，用水洗身，就洁净了。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָיָה בַיּוֹם הַשְּׁבִיעִי
  choice: 第七天
  rationale: 该结构在礼仪程序中引出下一时间步骤；现代汉语无需直译“事情将是”，直接译出时间即可保留顺序意义。
- source_word: יְגַלַּח אֶת כָּל שְׂעָרוֹ
  choice: 他要把全身的毛发都剃掉
  rationale: גלח的加强词干在此指剃除毛发；“全身的毛发”自然表达כָּל שְׂעָרוֹ的全面范围。
- source_word: רֹאשׁוֹ
  choice: 头发
  rationale: 原文直译为“他的头”，但作为“剃”的宾语，所指是头上的毛发；译作“头发”可避免误解为剃头皮。
- source_word: זְקָנוֹ
  choice: 胡须
  rationale: זָקָן在此指胡须。
- source_word: גַּבֹּת עֵינָיו
  choice: 眉毛
  rationale: 该希伯来语短语字面为“眼睛的眉弓”，现代汉语自然对应“眉毛”。
- source_word: וְאֶת כָּל שְׂעָרוֹ יְגַלֵּחַ
  choice: 他要剃掉全身所有的毛发
  rationale: 保留原文在列举头发、胡须和眉毛之后的重复，以突出必须全部剃除。
- source_word: וְכִבֶּס אֶת בְּגָדָיו
  choice: 洗净衣服
  rationale: כבס通常指洗涤衣物；“洗净衣服”符合礼仪洁净程序，也适合现代汉语。
- source_word: וְרָחַץ אֶת בְּשָׂרוֹ בַּמַּיִם
  choice: 用水洗身
  rationale: בשר字面为“肉身”，在沐浴语境中指人的身体；“用水洗身”既自然又保留以水清洗身体的含义。
- source_word: וְטָהֵר
  choice: 就洁净了
  rationale: 该动词表示完成上述礼仪后进入洁净状态；“洁净”保留利未记礼仪状态术语，“就”体现结果和顺序。
theological_decisions:
- issue: 礼仪洁净术语
  choice: 洁净
  alternative: 清洁；得到洁净
  rationale: טהר在本段指礼仪身份，而非道德无罪。“洁净”是现代中文圣经语境中清楚且稳定的礼仪用语；译作“清洁”容易仅被理解为卫生状态，译作“得到洁净”则偏向过程或被动结果。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。保留原文对“全身毛发”的重复强调；将“他的头”按剃毛语境明确译为“头发”，将“他的肉身”自然译为“身”。本节无须脚注。
