  text: וְ/לָקַ֧ח הַ/כֹּהֵ֛ן אֶת כֶּ֥בֶשׂ הָ/אָשָׁ֖ם וְ/אֶת לֹ֣ג הַ/שָּׁ֑מֶן וְ/הֵנִ֨יף אֹתָ֧/ם הַ/כֹּהֵ֛ן תְּנוּפָ֖ה לִ/פְנֵ֥י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/024.yaml
  text: Then the priest shall take the guilt-offering lamb and the log of oil[b][a], and the priest shall wave them as a wave offering before Yahweh.
translation:
  language: zh_hans
  text: 祭司要取那只赎愆祭的羊羔[a]和一罗革油[b]，把它们在雅威面前作摇祭献上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“赎愆祭所用的羊羔”；传统也译“补过祭的羊羔”。
    reason: lexical_alternative
  - marker: b
    text: “罗革”是古代以色列礼仪制度中一种较小的液体容量单位。
    reason: cultural_note
lexical_decisions:
- source_word: וְלָקַח
  choice: 要取
  rationale: 未完成式意义由连续叙事中的完成式承接礼仪程序；汉语用“要”表达规程中的指令和下一步行动，不必机械译出句首连接词。
- source_word: הַכֹּהֵן
  choice: 祭司
  rationale: 这是 כֹּהֵן 在祭祀法规中的标准对应词；希伯来文在第二个动词前重复主语，汉语为避免生硬，以同一分句中的明确主语统摄两个动作。
- source_word: כֶּבֶשׂ הָאָשָׁם
  choice: 那只赎愆祭的羊羔
  rationale: אָשָׁם 在此指特定祭物类别及相关罪责；“赎愆祭”保留礼仪术语，“的羊羔”自然表达原文的属格结构。定冠词按上下文译作“那只”。
- source_word: לֹג הַשָּׁמֶן
  choice: 一罗革油
  rationale: לֹג 是特定的液体容量单位，音译为“罗革”比泛译“一份”更准确；汉语补出数量词“一”，表达该计量结构。
- source_word: וְהֵנִיף
  choice: 摇一摇
  rationale: נוּף 的使役式在祭祀程序中表示以摇动的方式献呈；“摇一摇”自然传达具体礼仪动作，并与后面的“摇祭”保留同源词呼应。
- source_word: אֹתָם
  choice: 把它们
  rationale: 复数代词同时指羊羔和油；译出“它们”保留原文明确的复数指代。
- source_word: תְּנוּפָה
  choice: 作为摇祭
  rationale: 该名词表示借摇动献呈的祭礼类别或方式；“作为摇祭”既保留技术术语，也与动词“摇一摇”形成原文所有的同源呼应。
- source_word: לִפְנֵי יְהוָה
  choice: 在雅威面前
  rationale: לִפְנֵי 表示在神面前献呈；专名 יְהוָה 音译为“雅威”，保留原文的圣约之名。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。译作“雅威”以专名形式呈现，不以称号“主”代替，也避免把传统混合读音“耶和华”放入正文。
- issue: 祭名 אָשָׁם 的译法
  choice: 赎愆祭
  alternative: 补过祭；赎罪责祭
  rationale: “赎愆祭”是简明且可辨识的现代汉语礼仪术语，能表达因罪责或亏欠而献的祭；不把它与 חַטָּאת 所指的另一祭类混同。
translation_notes:
  register: 采用现代、庄重而清楚的祭祀法规语体。保留“赎愆祭”“摇祭”“罗革”等必要的礼仪术语，并用脚注解释不熟悉的计量单位。正文保留羊羔与油共同作为复数对象的语义，也以“摇祭／摇一摇”再现原文名词与动词的同源呼应。
