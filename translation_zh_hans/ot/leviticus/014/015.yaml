base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/015.yaml
  text: Then the priest shall take some of the log of oil and pour it into the palm of his own left hand[a].
translation:
  language: zh_hans
  text: 祭司要从那一罗革的油中取一些，倒在自己的左手掌上[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “罗革”是古代的液量单位。
    reason: cultural_note
lexical_decisions:
- source_word: וְלָקַח
  choice: 祭司要……取
  rationale: 承接前文的礼仪程序，表达依次施行的规定；现代汉语法规式叙述用“要”自然清楚。
- source_word: הַכֹּהֵן
  choice: 祭司
  rationale: 这是 כֹּהֵן 在祭祀礼仪语境中的标准译法。
- source_word: מִלֹּג הַשָּׁמֶן
  choice: 从那一罗革油中取一些
  rationale: מִן 在这里兼有来源和部分之意，表示从这一罗革的油中取出一部分，而非拿起整份油。
- source_word: לֹג
  choice: 罗革
  rationale: 保留古代特定液量单位的音译，并以脚注说明，避免换算成并不确定的现代容量。
- source_word: וְיָצַק
  choice: 倒
  rationale: 准确表达将油倾倒出来的礼仪动作，并与前面的“要”共同构成连续的规定。
- source_word: עַל כַּף
  choice: 倒在……手掌上
  rationale: עַל 的基本空间意义是“在……上”；“手掌上”既贴近原文，也符合汉语表达。
- source_word: כַּף
  choice: 手掌
  rationale: כַּף 在此具体指掌心或手掌，而非泛指整只手。
- source_word: הַשְּׂמָאלִית
  choice: 左手掌
  rationale: 该阴性形容词修饰 כַּף，明确指定左边的手掌。
- source_word: כַּף הַכֹּהֵן הַשְּׂמָאלִית
  choice: 自己的左手掌
  rationale: 原文再次出现“祭司”，说明油倒在执行此礼的祭司本人手上；汉语以反身代词表达，避免误解为另一位祭司。
