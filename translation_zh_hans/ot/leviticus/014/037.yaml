base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/037.yaml
  text: He shall examine the infection, and if the infection is in the walls of the house as sunken areas, greenish or reddish, and their appearance is deeper than the wall,
translation:
  language: zh_hans
  text: 他要察看那灾病；如果那灾病在房屋的墙壁上呈现为泛绿或泛红的凹陷处[a]，并且这些凹陷处看起来低于墙面[b]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“下陷的斑块”。
    reason: lexical_alternative
  - marker: b
    text: 直译“低于墙”；即看起来凹入墙的表面。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאָה
  choice: 他要察看
  rationale: 在祭司进行诊断的程序语境中，ראה不只是“看见”，而是仔细察验；“察看”自然且保留礼仪法规的庄重语气。
- source_word: הַנֶּגַע
  choice: 灾病
  rationale: נגע在利未记13—14章泛指人、衣物或房屋上受侵害的异常现象；“灾病”可涵盖房屋上的病变而不把它误说成现代医学意义的感染。
- source_word: וְהִנֵּה
  choice: 如果
  rationale: 字面可作“看哪”，但在此法规程序中引出察看后发现的情形，用“如果”表达条件功能最自然。
- source_word: בְּקִירֹת הַבַּיִת
  choice: 出现在房屋的墙上
  rationale: 介词ב可按处所译作“在”；汉语说墙面上的可见病变，以“墙上”较自然，并由后文说明其凹入墙面。
- source_word: שְׁקַעֲרוּרֹת
  choice: 凹陷处
  rationale: 这个罕见词表示下陷、凹入之处；“凹陷处”准确、通俗，并与后文“低于墙面”呼应。
- source_word: יְרַקְרַקֹּת
  choice: 浅绿色
  rationale: 重叠形式表示带绿或偏绿的色泽；“浅绿色”在现代汉语中简洁地传达非纯正浓绿的意思。
- source_word: אֲדַמְדַּמֹּת
  choice: 浅红色
  rationale: 重叠形式表示带红、偏红的色泽；与“浅绿色”并列可自然体现减弱的颜色程度。
- source_word: וּמַרְאֵיהֶן
  choice: 并且看起来
  rationale: מראה指可见的外观；在汉语中以“看起来”连接诊断标准，比直译“它们的外观”更自然。
- source_word: שָׁפָל מִן הַקִּיר
  choice: 低于墙面
  rationale: 原文直译为“低于墙”；此处指病变看上去凹入墙的表面。“低于墙面”保留原有空间意象，且避免把视觉现象过度解释为实际深度。
