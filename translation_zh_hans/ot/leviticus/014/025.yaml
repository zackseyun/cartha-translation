base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/025.yaml
  text: Then he shall slaughter the guilt-offering lamb[a], and the priest shall take some of the blood of the guilt offering and put it on the lobe of the right ear of the one being cleansed, and on the thumb of his right hand[b], and on the big toe of his right foot.
translation:
  language: zh_hans
  text: 他要宰杀那只作赎愆祭[a]的羊羔。祭司要取些赎愆祭牲的血，抹在正接受洁净之人的右耳垂[b]上、他的右手拇指上和他的右脚大拇趾上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “赎愆祭”也可译作“赔偿祭”；这是指一种特定的祭。
    reason: lexical_alternative
  - marker: b
    text: 或译“右耳尖”。希伯来语所指的是耳朵外侧的末端部位。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁחַט
  choice: 他要宰杀
  rationale: 该动词在献祭礼仪中指宰杀祭牲；“宰杀”比泛指的“杀”更准确。希伯来文未重述主语，中文以“他”保留上下文中的行动者。
- source_word: כֶּבֶשׂ הָאָשָׁם
  choice: 那只作赎愆祭的羊羔
  rationale: 这一结构指指定用作אָשָׁם祭的羊羔；中文采用自然的用途表达。
- source_word: אָשָׁם
  choice: 赎愆祭
  rationale: 这里指利未记中一种特定的祭，而非抽象的罪责。“赎愆祭”是较稳定的中文祭名，并以脚注补充现代可理解的替代译法。
- source_word: מִדַּם הָאָשָׁם
  choice: 取些赎愆祭牲的血
  rationale: 介词מִן在此有部分义，表示只取其中一些血；加“祭牲”使中文清楚表明血的来源。
- source_word: הַמִּטַּהֵר
  choice: 正接受洁净之人
  rationale: Hitpael分词表示此人正在经历礼仪洁净过程；“正接受洁净”保留过程性，同时避免误解为一般清洁。
- source_word: תְּנוּךְ אֹזֶן
  choice: 耳垂
  rationale: 该词指耳朵外侧的末端或突出部位；“耳垂”是自然且传统的理解，但原词具体所指并非完全确定，故附注“耳尖”这一译法。
- source_word: בֹּהֶן יָדוֹ
  choice: 右手拇指
  rationale: בֹּהֶן与“手”连用时指拇指，中文无须逐字重复所有格。
- source_word: בֹּהֶן רַגְלוֹ
  choice: 右脚大拇趾
  rationale: בֹּהֶן与“脚”连用时指大拇趾；这是现代中文明确的解剖表达。
theological_decisions:
- issue: 祭名אָשָׁם的译法
  choice: 赎愆祭
  alternative: 赔偿祭
  rationale: 该词在本节指一种特定的利未礼祭。“赎愆祭”保留其与罪责相关的核心意义及中文术语连续性；“赔偿祭”能突出某些语境中的补偿层面，却可能把该祭的意义收窄，因此列入脚注而不作为正文。
translation_notes:
  register: 采用现代、庄重而易懂的礼仪叙述。句子分为宰杀与抹血两个步骤，以免连续并列过长；“抹在……上”符合中文礼仪动作表达。所有脚注标记均置于对应词语之后。
