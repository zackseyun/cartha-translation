  text: וְ/צִוָּה֙ הַ/כֹּהֵ֔ן וְ/שָׁחַ֖ט אֶת הַ/צִּפּ֣וֹר הָ/אֶחָ֑ת אֶל כְּלִי חֶ֖רֶשׂ עַל מַ֥יִם חַיִּֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/005.yaml
  text: Then the priest shall command that one bird be slaughtered over an earthenware vessel containing fresh water[a].
translation:
  language: zh_hans
  text: 祭司要吩咐人把一只鸟宰杀在盛有活水[a]的陶器上方。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “活水”指新鲜的水或流动的水。
    reason: 说明希伯来语字面表达及其礼仪语境中的含义。
lexical_decisions:
- source_word: וְצִוָּה
  choice: 要吩咐人
  rationale: 在礼仪程序中，连词加完成式表达接续性的指令；“要吩咐人”既体现祭司的权威，也自然引出受命者所执行的动作。
- source_word: הַכֹּהֵן
  choice: 祭司
  rationale: 符合祭司礼仪语境中的常规译法。
- source_word: וְשָׁחַט
  choice: 把……宰杀
  rationale: 原文为主动式，但主语可能承接受命执行者；用“吩咐人把……宰杀”保留这一句法关系，并以“宰杀”准确表达礼仪性的杀鸟动作。
- source_word: אֶת־הַצִּפּוֹר הָאֶחָת
  choice: 一只鸟
  rationale: 指前文两只鸟中的一只；现代汉语以“一只鸟”表达最自然。
- source_word: אֶל כְּלִי חֶרֶשׂ
  choice: 在……陶器上方
  rationale: 结合宰杀动作及器皿承接血液的场景，译为“在陶器上方”，避免误解为把鸟放入器皿中宰杀。
- source_word: עַל מַיִם חַיִּים
  choice: 盛有活水
  rationale: עַל在此表明陶器与水的空间关系，即器皿内有水；“活水”保留希伯来语的鲜明表达，其具体含义由脚注说明。
theological_decisions:
- issue: מַיִם חַיִּים在洁净礼仪中的译法
  choice: 活水
  alternative: 新鲜的水；流动的水
  rationale: 直译“活水”可保留原文措辞及其潜在意涵，而脚注说明在本礼仪语境中指非死水的新鲜水或流动水，不把后来的神学象征直接带入本节。
- issue: 宰杀地点与器皿中水的关系
  choice: 在盛有活水的陶器上方宰杀
  alternative: 宰杀到陶器里，在活水之上
  rationale: 此译法自然表达鸟血流入盛水陶器的仪式安排，同时不把אֶל机械译成“进入”而造成鸟本身在器皿内被宰杀的印象。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“陶器”比“瓦器”更易为当代普通读者理解；保留“活水”并加注，兼顾原文形式、传统辨识度与可理解性。
