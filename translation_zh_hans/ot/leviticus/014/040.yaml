base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/040.yaml
  text: then the priest shall command that they remove the stones in which the infection is[a], and throw them outside the city to an unclean place.
translation:
  language: zh_hans
  text: 祭司就要吩咐人把有灾病的石头[a]拆下来，扔到城外不洁净的地方。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“里面有灾病的石头。”希伯来原文直译为“灾病在其中的石头”。
    reason: 保留אֲשֶׁר בָּהֵן הַנָּגַע的字面空间关系及其可替代表达。
lexical_decisions:
- source_word: וְצִוָּה
  choice: 就要吩咐
  rationale: 该形式承接前文的礼仪程序，表示下一步应采取的行动；“就要”自然体现程序推进，“吩咐”保留命令意味。
- source_word: הַכֹּהֵן
  choice: 祭司
  rationale: 这是利未记礼仪语境中כֹּהֵן的标准译法；汉语无需另用冠词表达其确定性。
- source_word: וְחִלְּצוּ
  choice: 吩咐人把……拆下来
  rationale: 原动词表示抽出、移除；对象是房屋墙体中的石头，用“拆下来”既符合建筑语境，又不额外限定具体工具或方法。希伯来语复数主语未明说身份，汉语以泛指的“人”自然表达。
- source_word: הָאֲבָנִים
  choice: 石头
  rationale: 直接保留原词的普通含义；上下文已经表明是建房所用的石头，无需增译为“石料”或“墙石”。
- source_word: אֲשֶׁר בָּהֵן הַנָּגַע
  choice: 灾病所在的
  rationale: 尽量保留“灾病在其中”的空间表达，也避免把נֶגַע武断地认定为现代医学上的传染病、霉菌或麻风病。“灾病”可涵盖利未记中出现在人体、衣物和房屋上的异常灾患。
- source_word: וְהִשְׁלִיכוּ אֶתְהֶן
  choice: 扔
  rationale: 自然表达将拆下的石头投弃出去；宾语在汉语句式中已以前置的“石头”明确，无需重复“它们”。
- source_word: אֶל מִחוּץ לָעִיר
  choice: 到城外
  rationale: 准确表达朝城邑外部移动的方向；“城外”是简洁自然的现代汉语。
- source_word: אֶל מָקוֹם טָמֵא
  choice: 不洁净的地方
  rationale: “不洁净”保留טָמֵא在利未记中的礼仪洁净范畴，不把它缩减为一般卫生意义上的“脏”。
theological_decisions:
- issue: 利未记中房屋灾患与礼仪不洁的表达
  choice: 将נֶגַע译为“灾病”，将טָמֵא译为“不洁净”
  alternative: 将נֶגַע译为“霉斑”“侵染”或“病患”，将טָמֵא译为“不洁”或“污秽”
  rationale: 原文规定的是礼仪鉴定和处置，并未明确给出可与现代医学或建筑学诊断完全对应的现象。“灾病”保留其灾患、病变或斑痕的语义张力；“不洁净”则清楚维持礼仪分类，避免暗示单纯肮脏或道德败坏。
translation_notes:
  register: 采用现代、庄重而易懂的程序性叙述。“祭司就要吩咐人”符合汉语法规与礼仪指令的表达习惯；“拆下来”贴合墙体石头的实际语境；全句避免古奥措辞，也不把“灾病”具体化为未经原文确认的霉菌或现代疾病。
