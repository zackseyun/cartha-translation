  text: זֹ֤את תִּֽהְיֶה֙ תּוֹרַ֣ת הַ/מְּצֹרָ֔ע בְּ/י֖וֹם טָהֳרָת֑/וֹ וְ/הוּבָ֖א אֶל הַ/כֹּהֵֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/002.yaml
  text: 'This shall be the law for the leprous person on the day of his cleansing: he shall be brought to the priest[a].'
translation:
  language: zh_hans
  text: “患麻风[a]的人得洁净之日，所适用的条例如下：他要被带到祭司那里。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “患麻风的人”所译的希伯来语词，指受צָרַעַת（传统上常译作“麻风”）影响的人；这种状况不一定就是现代医学所说的麻风病（汉森病）。
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת תִּהְיֶה
  choice: 所适用的条例如下
  rationale: 这是律法条文的引介公式；结合后面的“条例”，译为“如下”比逐字译作“这将是”更符合现代汉语，同时保留其规范性。
- source_word: תּוֹרַת
  choice: 条例
  rationale: תּוֹרָה在这里指规定的洁净礼仪程序；“条例”既准确又比抽象的“律法”更贴合本段语境。
- source_word: הַמְּצֹרָע
  choice: 患麻风的人
  rationale: 该词指受צָרַעַת影响的人。正文沿用读者熟悉的“麻风”传统术语，并用“患……的人”避免以疾病定义其身份；脚注说明它不一定等同于现代医学所称的麻风病。
- source_word: בְּיוֹם טָהֳרָתוֹ
  choice: 得洁净之日
  rationale: טהר在本段主要涉及礼仪上的洁净与恢复；“得洁净”保留这一礼仪含义，而不把它缩减为医疗痊愈。
- source_word: וְהוּבָא
  choice: 他要被带到
  rationale: 保留Hophal被动式以及礼仪程序中的规范语气；“要被带到”清楚表达当事人由别人带往祭司那里。
- source_word: אֶל הַכֹּהֵן
  choice: 祭司那里
  rationale: 定冠词指语境中负责查验并主持礼仪的祭司；“到祭司那里”是自然的现代汉语表达。
theological_decisions:
- issue: מְצֹרָע与现代麻风病概念的关系
  choice: 正文译作“患麻风的人”，并加脚注限定术语含义
  alternative: 患皮肤病的人；麻风病人
  rationale: צָרַעַת是一种与礼仪不洁有关的古代分类，不能直接等同于现代医学的汉森病；同时，笼统译作“皮肤病”也可能过度缩窄其范围。正文保留传统关联，脚注防止现代医学上的误读。
- issue: טָהֳרָתוֹ的洁净性质
  choice: 得洁净
  alternative: 痊愈；得到洁净礼
  rationale: 原文强调洁净状态及其礼仪确认，而非单纯医学康复；“得洁净”保留身体状况与礼仪地位之间的张力，不额外断定具体机制。
translation_notes:
  register: 采用现代、庄重且易懂的律法条文语体。“所适用的条例如下”使句首引介自然清楚；保留“他要被带到”的被动结构，以贴近原文程序性表达。脚注标记[a]紧随需要说明的术语。
