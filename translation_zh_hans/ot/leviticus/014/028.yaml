base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/028.yaml
  text: And the priest shall put some of the oil that is on his palm on the lobe of the right ear of the one being cleansed[a], and on the thumb of his right hand, and on the big toe of his right foot, on the place of the guilt-offering blood.
translation:
  language: zh_hans
  text: 祭司要从手掌上的油中取一些，抹在正在洁净的人的右耳垂、右手拇指和右脚大脚趾上，即抹在赎愆祭之血所在的位置上[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“抹在先前涂上赎愆祭之血的地方。”
    reason: 原文直译为“在赎愆祭之血的位置上”；结合前文礼仪步骤，此处指先前施用赎愆祭之血的相同部位。
lexical_decisions:
- source_word: וְנָתַן
  choice: 抹在
  rationale: נתן本义宽泛，可指“给、放、置”；在把油施于身体部位的礼仪语境中，“抹在”自然明确，又不额外规定具体动作方式。
- source_word: מִן הַשֶּׁמֶן אֲשֶׁר עַל כַּפּוֹ
  choice: 从手掌上的油中取一些
  rationale: מן具有部分含义；כף在此指手掌。此译既表达“取一些油”，也保留油原先在祭司手掌上的礼仪画面。
- source_word: תְּנוּךְ אֹזֶן
  choice: 耳垂
  rationale: תנוך在祭司礼仪语境中指耳朵的耳垂；这是现代汉语中最清楚、准确的身体部位名称。
- source_word: הַמִּטַּהֵר
  choice: 正在得洁净之人
  rationale: 该Hitpael分词指正在经历礼仪洁净过程的人；“正在得洁净”保留过程性及一定的被动意味。
- source_word: בֹּהֶן יָדוֹ
  choice: 手大拇指
  rationale: בֹּהֶן用于手时指大拇指；与“右手”组合符合现代汉语习惯。
- source_word: בֹּהֶן רַגְלוֹ
  choice: 脚大脚趾
  rationale: בֹּהֶן用于脚时指大脚趾；此译清楚区别于其他脚趾。
- source_word: עַל מְקוֹם דַּם הָאָשָׁם
  choice: 就是抹在赎愆祭牲血所在的位置
  rationale: מקום是“地方、位置”；此句指油施在先前施用赎愆祭牲血的同一位置。正文保留“血所在的位置”的简洁结构，脚注提供更明确的过程性表达。
theological_decisions:
- issue: אָשָׁם的祭名
  choice: 赎愆祭
  alternative: 赔偿祭；赎罪责祭
  rationale: אָשָׁם可指罪责、赔偿责任及相应祭物。“赎愆祭”是中文圣经传统中较为人熟悉且能与其他祭类区分的名称；此处不把其神学功能进一步限定为仅仅赔偿或仅仅除罪。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“正在得洁净之人”保留礼仪过程性；以“右耳垂、右手大拇指和右脚大脚趾”的并列结构清楚呈现三个施油部位。
