  yaml_path: translation/ot/leviticus/014/004.yaml
  text: Then the priest shall command that two live clean birds[a], cedar wood, scarlet yarn[b], and hyssop be taken for the one being cleansed.
translation:
  language: zh_hans
  text: 祭司要吩咐人，为那正在接受洁净礼的人取两只洁净的活鸟、香柏木、朱红色线[a]和牛膝草[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“朱红色绳”。希伯来语 שְׁנִי תוֹלַעַת 指染成朱红色的材料，其具体形态并不确定，因此可有不同译法。
    reason: lexical_alternative
  - marker: b
    text: “牛膝草”所指的确切植物并不确定；此处保留传统译名。
    reason: cultural_note
lexical_decisions:
- source_word: וְצִוָּה
  choice: 祭司要吩咐人
  rationale: 在礼仪法规的连续指令中，连词加完成式推进程序步骤；“要吩咐人”既表达指令语气，也与下文第三人称单数的“取”自然衔接。
- source_word: וְלָקַח
  choice: 取
  rationale: 该动词虽为第三人称阳性单数，但接在“祭司要吩咐”之后，可按非特指的执行者理解；译为“吩咐人……取”避免误示祭司必须亲自拿取。
- source_word: לַמִּטַּהֵר
  choice: 为那正在得洁净的人
  rationale: Hitpael分词指处于礼仪洁净过程中的人；“正在得洁净”保留过程性，不把动作误说成已经完成。
- source_word: שְׁתֵּי צִפֳּרִים חַיּוֹת טְהֹרוֹת
  choice: 两只洁净的活鸟
  rationale: צִפּוֹר泛指鸟，不限定为麻雀；“活鸟”体现חַיּוֹת，“洁净”则保留利未记中的礼仪类别。
- source_word: עֵץ אֶרֶז
  choice: 香柏木
  rationale: 这是表示香柏木材的结构，采用现代中文圣经语境中清楚而传统的名称。
- source_word: שְׁנִי תוֹלַעַת
  choice: 朱红色线
  rationale: 该词组指用虫源染料染成朱红色的材料，但材料的具体形态并不完全确定；正文用自然明确的“线”，脚注保留其他可能。
- source_word: אֵזֹב
  choice: 牛膝草
  rationale: 采用传统译名以保持礼仪用语的连续性；原词所指植物的确切品种仍有争议，故以脚注说明。
theological_decisions:
- issue: טְהֹרוֹת所指的洁净性质
  choice: 洁净
  alternative: 礼仪上洁净
  rationale: 上下文已明确属于洁净礼仪；正文保留原文简洁表达，不额外加入解释性限定，也不把它泛化为道德上的纯洁。
translation_notes:
  register: 采用现代、庄重而易懂的法规叙述语体。“祭司要吩咐人……取”自然呈现礼仪程序，并避免暗示祭司必须亲自取用这些物品。所有脚注标记均置于所说明的词语之后。
