base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/027.yaml
  text: Then the priest shall sprinkle with his right finger some of the oil that is on his left palm seven times before Yahweh.
translation:
  language: zh_hans
  text: 祭司要用右手的指头，从左手掌里的油中取一些，在雅威面前弹洒七次。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִזָּה
  choice: 要……弹洒
  rationale: נזה 的使役式在礼仪语境中指将液体弹出、洒出。“弹洒”既体现用指头施行的动作，也符合现代汉语的祭礼语境；句首连接词融入连续程序的表达。
- source_word: הַכֹּהֵן
  choice: 祭司
  rationale: כֹּהֵן 在以色列礼仪律例中的标准译法。
- source_word: בְּאֶצְבָּעוֹ הַיְמָנִית
  choice: 用右手的指头
  rationale: 原文为单数，直指施行动作的指头；汉语以“右手的指头”自然表达其位于右侧，同时不擅自指定是哪一根手指。
- source_word: מִן הַשֶּׁמֶן
  choice: 把……油取一些
  rationale: 介词 מִן 在这里具有部分意义，表示从掌中的油取出一部分来弹洒，而不是使用全部的油。
- source_word: אֲשֶׁר עַל כַּפּוֹ הַשְּׂמָאלִית
  choice: 左手掌里的
  rationale: כַּף 在此具体指手掌；“左手掌里的油”清楚呈现油盛在掌中的礼仪画面。
- source_word: שֶׁבַע פְּעָמִים
  choice: 七次
  rationale: 准确、自然地表达动作重复的次数。
- source_word: לִפְנֵי יְהוָה
  choice: 在雅威面前
  rationale: לִפְנֵי 表示在神面前、神临在之处施行礼仪；“雅威”音译原文的圣名 יְהוָה。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名。采用“雅威”以较直接地音译该名，并避免用称号取代专名；不借此处理其古代确切发音仍有争议的问题。
translation_notes:
  register: 采用现代、庄重而清楚的礼仪法规文体。“把……取一些”明确部分关系；“弹洒”呈现祭司用指头将油洒出的具体动作。
