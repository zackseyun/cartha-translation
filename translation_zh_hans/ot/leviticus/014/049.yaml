  text: וְ/לָקַ֛ח לְ/חַטֵּ֥א אֶת הַ/בַּ֖יִת שְׁתֵּ֣י צִפֳּרִ֑ים וְ/עֵ֣ץ אֶ֔רֶז וּ/שְׁנִ֥י תוֹלַ֖עַת וְ/אֵזֹֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/049.yaml
  text: And he shall take, to purify the house from sin, two birds, cedar wood, scarlet yarn, and hyssop.
translation:
  language: zh_hans
  text: 为洁净房屋[a]，他要取两只鸟、香柏木、朱红色线[b]和牛膝草。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“为房屋除污”。原文动词在这里指按礼仪除去罪污或不洁，使房屋洁净。
    reason: lexical_alternative
  - marker: b
    text: 或译“朱红色绳”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַח
  choice: 他要取
  rationale: 连词加完成式在礼仪法规的连续程序中表达应当进行的下一步；“要取”自然保留指令语气。
- source_word: לְחַטֵּא אֶת הַבַּיִת
  choice: 为洁净房屋
  rationale: חטא 的 Piel 词形在此礼仪语境中指除去不洁、使之洁净；对象是实体房屋，并非具有道德罪责的人。“洁净”既符合现代汉语，也不额外加入原文未明说的赎罪机制。
- source_word: שְׁתֵּי צִפֳּרִים
  choice: 两只鸟
  rationale: 原文此处只说“两只鸟”，没有加“活的”，故不从相邻经文补入正文。
- source_word: עֵץ אֶרֶז
  choice: 香柏木
  rationale: 这是该构词短语在圣经礼仪材料中的常规而清楚的汉语表达。
- source_word: שְׁנִי תוֹלַעַת
  choice: 朱红色线
  rationale: 该词组指礼仪中使用的朱红染色材料；“朱红色线”具体、自然，同时以脚注保留“绳”的可能表达。
- source_word: אֵזֹב
  choice: 牛膝草
  rationale: 植物的确切鉴定仍有争议；“牛膝草”是广为人知的传统对应词，适合正文保留。
theological_decisions:
- issue: לְחַטֵּא 以房屋为宾语时的礼仪含义
  choice: 为洁净房屋
  alternative: 为房屋除罪；为房屋赎罪
  rationale: 上下文论及受灾病侵染的房屋及其洁净礼。此处 Piel 词形表达从礼仪性污秽中洁净，而不是赦免房屋的道德罪责；因此不把“罪”或“赎罪”直接写入正文，同时在脚注说明原词的礼仪含义。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“为洁净房屋”前置，清楚表达取这些物品的目的；物品列表简洁，符合礼仪法规的行文。
