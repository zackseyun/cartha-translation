  yaml_path: translation/ot/leviticus/014/043.yaml
  text: But if the disease returns and breaks out in the house after he has removed the stones[a], and after he has scraped the house, and after it has been plastered,
translation:
  language: zh_hans
  text: 但若在取出石头、刮削房屋并抹灰之后，灾病[a]又在房屋里出现，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “灾病”也可译作“病患”或“灾患”。希伯来语 negaʿ（נגע）是《利未记》中的专门用语，可指在人、衣物或房屋上出现的病症、损害或异常现象。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: 但若
  rationale: 承接前述处理程序，并引出与预期结果相反的条件情形；“但若”兼顾连接和转折语气。
- source_word: יָשׁוּב
  choice: 又
  rationale: 此处指灾病在处理后重新出现；汉语以“又……发作”自然表达“返回、复发”的意义。
- source_word: הַנֶּגַע
  choice: 灾病
  rationale: נגע是《利未记》中用于人、衣物或房屋异常病变的技术性用语。“灾病”既保留其灾患性质，也不把房屋上的现象过度限定为现代医学意义的疾病。
- source_word: וּפָרַח
  choice: 发作
  rationale: 该动词本义带有萌发、扩展开来的形象，在这里描写房屋灾病再次显现或蔓延；“发作”符合现代汉语，并与“又”共同传达复发之意。
- source_word: בַּבַּיִת
  choice: 在房子里
  rationale: 介词在此表示灾病出现的地点；“在房子里”自然明确。
- source_word: אַחַר חִלֵּץ אֶת־הָאֲבָנִים
  choice: 在拆掉石头以后
  rationale: 指按前文规定把受影响的石头从房屋中取出；“拆掉”适合建筑处理语境。
- source_word: וְאַחֲרֵי הִקְצוֹת אֶת־הַבַּיִת
  choice: 刮过房子
  rationale: 原文指刮削房屋表面；“刮过房子”保留具体处理动作，且避免泛化为清洁。
- source_word: וְאַחֲרֵי הִטּוֹחַ
  choice: 并抹灰以后
  rationale: טוח指给房屋表面涂抹灰泥。原文未明说动作执行者，汉语以无主语的并列结构保持这种开放性。
