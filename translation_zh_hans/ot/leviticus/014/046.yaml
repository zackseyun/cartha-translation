  text: And whoever enters the house during all the days that it is quarantined shall be unclean until the evening[a].
translation:
  language: zh_hans
  text: 在房子被封闭[a]的所有日子里，凡进入这房子的人，必不洁净到晚上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“被关起来”或“被隔离”。希伯来语指房子在祭司的限制下被封闭，以便察看。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/הַ/בָּא
  choice: 凡进去的人
  rationale: 定冠词加分词在这里作名词使用，泛指任何进入者；“凡……的人”自然地保留了律法条文的普遍效力。
- source_word: אֶל הַ/בַּיִת
  choice: 进去
  rationale: בוא 与 אֶל 连用表示进入房子；汉语由上下文中的“房子”配合“进去”即可清楚表达，无须重复宾语。
- source_word: כָּל יְמֵי
  choice: 期间
  rationale: 该短语涵盖房子受限制的全部时段；“期间”在现代汉语中简洁自然，并保留完整的时间范围。
- source_word: הִסְגִּיר אֹתוֹ
  choice: 房子被封闭
  rationale: סגר 在利未记十三至十四章的检验程序中指把对象封闭、隔离，以待察看。正文采用被动表达，符合汉语习惯，也不明说希伯来语中未明示的施事者；脚注保留其他可行译法及礼仪法律语境。
- source_word: יִטְמָא
  choice: 都不洁净
  rationale: 该动词表示进入礼仪上的不洁状态。此处译作“不洁净”，既符合本段的礼仪法律语境，也避免误解为一般卫生状况。
- source_word: עַד הָ/עָרֶב
  choice: 直到晚上
  rationale: 这是表示暂时礼仪不洁持续期限的惯用语；“直到晚上”是自然、准确的现代汉语。
