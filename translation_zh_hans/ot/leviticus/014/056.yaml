  text: and for a swelling[a], and for a scab[b], and for a bright spot.
translation:
  language: zh_hans
  text: 以及皮肤隆起[a]、疹斑[b]和亮斑[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“肿块”或“隆起的患处”；所指的具体皮肤症状不能确定。
    reason: lexical_alternative
  - marker: b
    text: 或译“皮疹”“斑块”或“痂”；希伯来词所指的具体皮肤病变不能确定。
    reason: lexical_alternative
  - marker: c
    text: 或译“明斑”；按本段语境，也可理解为“白斑”。
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂאֵת
  choice: 皮肤隆起
  rationale: 该词在利未记13—14章的检验语境中指皮肤上隆起的患处；译作“皮肤隆起”既保留其形态特征，也避免把它过度确定为某种现代医学疾病。
- source_word: סַפַּחַת
  choice: 疹斑
  rationale: 该词所指的具体皮肤症状无法确定，可能是皮疹、斑块或结痂一类病变；“疹斑”自然简洁，并保留诊断上的宽泛性。
- source_word: בֶּהֶרֶת
  choice: 亮斑
  rationale: 该词主要表达皮肤上明亮或发白的斑点；“亮斑”贴近词义，又不把颜色限定得比希伯来文更具体。
- source_word: וְ/לַ
  choice: 以及
  rationale: 重复的连词和介词承接前文法规清单。汉语用“以及……、……和……”自然地保持列举关系，无须机械重复“关于”。
