  text: אֵ֣ת אֲשֶׁר תַּשִּׂ֞יג יָד֗/וֹ אֶת הָ/אֶחָ֥ד חַטָּ֛את וְ/אֶת הָ/אֶחָ֥ד עֹלָ֖ה עַל הַ/מִּנְחָ֑ה וְ/כִפֶּ֧ר הַ/כֹּהֵ֛ן עַ֥ל הַ/מִּטַּהֵ֖ר לִ/פְנֵ֥י יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/031.yaml
  text: whatever his means can afford[a], one as a sin offering and one as a burnt offering, along with the grain offering[b]. Thus the priest shall make atonement for the one being cleansed before Yahweh.
translation:
  language: zh_hans
  text: 他就要按自己所能负担的[a]献上：一只作赎罪祭[b]，另一只作燔祭，并连同素祭献上。祭司要在耶和华面前为那正在接受洁净礼的人赎罪。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语直译为“他的手所能达到的”，意思是他所能负担的。
    reason: lexical_alternative
  - marker: b
    text: 也可译为“洁净祭”或“净化祭”。
    reason: alternative_reading
lexical_decisions:
- source_word: אֲשֶׁר תַּשִּׂיג יָדוֹ
  choice: 他力所能及的
  rationale: 希伯来语直译为“他的手所能达到的”，是表示经济能力的习语；此译自然地表达按其能力所能负担之物。
- source_word: חַטָּאת
  choice: 赎罪祭
  rationale: 这是利未记祭祀语境中的惯用译法，同时保留该祭与罪及礼仪洁净之间的联系；“洁净祭”亦为可能译法。
- source_word: עֹלָה
  choice: 燔祭
  rationale: 采用现代中文圣经语体中通行的祭祀术语，指整只焚烧、烟气上升的祭物。
- source_word: עַל הַמִּנְחָה
  choice: 连同素祭献上
  rationale: 此处 עַל 表示伴随或附加，而非空间意义的“在……上面”；补出“献上”使中文句意完整。
- source_word: וְכִפֶּר
  choice: 赎罪
  rationale: 保留祭司礼仪行为的传统神学用语，不进一步限定赎罪机制。
- source_word: הַמִּטַּהֵר
  choice: 那正在得洁净的人
  rationale: 反映该词的分词形式，指正处于礼仪洁净过程中的人。
- source_word: לִפְנֵי יְהוָה
  choice: 在耶和华面前
  rationale: 准确表达“在……面前／临在中”，并保留神的名字。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代标准汉语中对四字神名广为人知的专名形式，而不是以“主”这一称号替代。
theological_decisions:
- issue: 祭物 חַטָּאת 的名称
  choice: 赎罪祭
  alternative: 洁净祭
  rationale: “赎罪祭”是中文读者熟悉的利未记祭祀术语，但该祭也具有礼仪洁净功能；用脚注保留另一种学术上可行的理解，避免抹平语义张力。
- issue: כפר 的祭祀含义
  choice: 为……赎罪
  alternative: 为……施行洁净／除污
  rationale: 原文描述祭司借祭礼所行之事；“赎罪”保留其祭祀与神学力度，同时不引入特定赎罪理论。
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 使用简体中文普通读者最熟悉的专名形式，明确译作神的名字，而非用称号替代。
translation_notes:
  register: 采用现代、庄重而易懂的中文，并保留利未记传统祭祀术语。主文中的“赎罪祭”应带脚注标记[b]，以对应所列脚注。
