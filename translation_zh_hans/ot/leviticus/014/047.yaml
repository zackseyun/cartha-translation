  text: וְ/הַ/שֹּׁכֵ֣ב בַּ/בַּ֔יִת יְכַבֵּ֖ס אֶת בְּגָדָ֑י/ו וְ/הָ/אֹכֵ֣ל בַּ/בַּ֔יִת יְכַבֵּ֖ס אֶת בְּגָדָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/047.yaml
  text: And whoever lies down in the house shall wash his clothes[b][a], and whoever eats in the house shall wash his clothes.
translation:
  language: zh_hans
  text: 凡躺在这房子里的人，都要洗自己的衣服；凡在这房子里吃东西的人，也都要洗自己的衣服。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהַשֹּׁכֵב
  choice: 凡躺……的人
  rationale: 带定冠词的分词作名词使用，泛指任何躺在房子里的人。שׁכב可指“躺下”，也可指“睡觉”；译作“躺”保留较宽的词义，更符合本节法律条文的表达。
- source_word: בַּבַּיִת
  choice: 在这房子里
  rationale: 该介词短语直接表示处所；结合上下文所论的特定房屋，用“这房子”自然清楚。
- source_word: יְכַבֵּס
  choice: 都要洗
  rationale: 在祭司法例中，未完成式表达规定或义务；“要洗”既保留规范语气，又符合现代汉语。
- source_word: אֶת־בְּגָדָיו
  choice: 自己的衣服
  rationale: בֶּגֶד指衣物。希伯来语第三人称阳性单数后缀在这里与泛指的法律主体呼应；汉语用“自己的”自然保持单数主体的回指关系，而不额外限定性别。
- source_word: וְהָאֹכֵל
  choice: 凡……吃东西的人
  rationale: 同样是带定冠词、作名词使用的分词，具有泛指法律主体的作用。“吃东西”比孤立的“吃”在现代汉语中更自然。
theological_decisions:
- issue: 法律条文中阳性单数形式的性别表达
  choice: 用“凡……的人……自己的衣服”表达泛指
  alternative: 用“凡……的男人……他的衣服”保留表面的阳性形式
  rationale: 希伯来语阳性单数分词和后缀在此具有代表性的法律泛指功能，并不表明规定只适用于男性。现代汉语用“人”和“自己的”既保留泛指范围和单数回指，又不加入原文没有的男性限制。
translation_notes:
  register: 采用简明、庄重的现代法律条文语体。“凡……的人，都要……”清楚呈现两个并列规定；第二句加“也”自然传达重复命令的并列关系。原文的“躺”和“吃”均不作神学扩展。
