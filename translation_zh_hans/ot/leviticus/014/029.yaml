  text: וְ/הַ/נּוֹתָ֗ר מִן הַ/שֶּׁ֨מֶן֙ אֲשֶׁר֙ עַל כַּ֣ף הַ/כֹּהֵ֔ן יִתֵּ֖ן עַל רֹ֣אשׁ הַ/מִּטַּהֵ֑ר לְ/כַפֵּ֥ר עָלָ֖י/ו לִ/פְנֵ֥י יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/029.yaml
  text: And the rest of the oil that is in the priest’s palm he shall put on the head of the one being cleansed[a], to make atonement for him before Yahweh.
translation:
  language: zh_hans
  text: 祭司要把手掌中剩下的油抹在那正在洁净的人的头上，在雅威面前为他赎罪。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהַנּוֹתָר מִן־הַשֶּׁמֶן
  choice: 剩下的油
  rationale: הַנּוֹתָר 是 נותר 的分词，指余下之物；与 מִן־הַשֶּׁמֶן 构成部分关系。中文用“剩下的油”自然且准确。
- source_word: אֲשֶׁר עַל כַּף הַכֹּהֵן
  choice: 祭司手掌中
  rationale: כַּף 指手掌或掌心；עַל 字面为“在……上”，但液体盛于掌心时，现代中文说“手掌中”更自然，也保留具体的礼仪画面。
- source_word: יִתֵּן עַל רֹאשׁ
  choice: 要抹在……头上
  rationale: נתן 本义宽泛，可指放置；此处对象是油，礼仪动作译为“抹在”比“放在”更符合现代中文表达。
- source_word: הַמִּטַּהֵר
  choice: 那正在得洁净之人
  rationale: טהר 的 Hitpael 分词指正在经历洁净礼仪的人；“正在得洁净”保留其过程性和礼仪语境。
- source_word: לְכַפֵּר עָלָיו
  choice: 为他……赎罪
  rationale: כפר 是祭祀语境中的核心术语，译作“赎罪”；עַל 标明赎罪所为之人，故译“为他”。
- source_word: לִפְנֵי יְהוָה
  choice: 在雅威面前
  rationale: לִפְנֵי 表示在某位面前或临在中；יְהוָה 按项目所给更新原则音译为“雅威”，保留其盟约名字。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；依项目所给更新原则采用“雅威”，而不以称号替代。
- issue: לְכַפֵּר 的祭祀含义
  choice: 赎罪
  alternative: 遮盖；除罪；施行洁净礼
  rationale: 保留 כפר 在利未记祭祀制度中的传统核心术语，不把其具体机制过度解释为某一种理论。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以“要”表达礼仪规程；“正在得洁净之人”略带礼仪书面色彩，用以准确保留希伯来语分词的过程性。原文无必须另列的文本异读或实质歧义，故不设脚注。
