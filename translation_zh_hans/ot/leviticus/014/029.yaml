revisions:
- from: 祭司手掌中剩下的油，要抹在那正在得洁净之人的头上，为他在雅威面前赎罪。
  to: 祭司要把手掌中剩下的油抹在那正在洁净的人的头上，在雅威面前为他赎罪。
  rationale: 修订明确祭司为施行抹油动作的主体，消除中文句法歧义；同时以更自然的“正在洁净的人”对应希伯来语 Hitpael 分词。其余词汇和语序保持原文礼仪行动及“在雅威面前为他赎罪”的意义。
