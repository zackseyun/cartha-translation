  text: Then the priest shall go out of the house to the doorway of the house and shut up the house for seven days[a].
translation:
  language: zh_hans
  text: 祭司要从房屋里出来，到房屋门口去，并把房屋封闭七天[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“把房屋关闭七天”。希伯来语动词在这里可以表示在检查期间将房屋关闭、限制进入。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָצָא
  choice: 要……出来
  rationale: 在程序性律法中，此处动词承接并推进规定步骤；用“要……出来”自然表达指令意义。
- source_word: הַכֹּהֵן
  choice: 祭司
  rationale: 准确对应利未记律法语境中的 כֹּהֵן；汉语无需另行表达定冠词。
- source_word: מִן הַבַּיִת
  choice: 从屋里
  rationale: 与“出来”搭配，现代汉语用“从屋里出来”最自然，也保留从房屋内部离开的空间关系。
- source_word: אֶל פֶּתַח הַבָּיִת
  choice: 走到屋门口
  rationale: פֶּתַח 指入口或开口；“屋门口”具体自然，又不额外假定门扇。“走到”明确表达 אֶל 的趋向。
- source_word: וְהִסְגִּיר
  choice: 然后……封闭
  rationale: סגר 的使役形在此表示限制进入、将房屋关闭一段时间。“封闭”适合房屋检查程序，且不像“隔离”那样过度解释。
- source_word: אֶת הַבַּיִת
  choice: 房屋
  rationale: 直接宾语标记不译；此处用“房屋”清楚指回受检查的建筑。
- source_word: שִׁבְעַת יָמִים
  choice: 七天
  rationale: 准确表达规定的持续时段；汉语无需添加介词。
