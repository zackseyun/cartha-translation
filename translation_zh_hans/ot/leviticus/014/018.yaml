    rationale: 原文 הַמִּטַּהֵר 为处在洁净程序中的人；现代汉语以“正在接受洁净礼的人”表达这一过程更顺畅，且不把他误作已完成洁净的人。
  - severity: low
    issue: 脚注的替代译文“正在行洁净礼的人”可能暗示该人主动施行礼仪。
    rationale: 该分词在此是洁净程序中受处理者的称呼。脚注并非保留必要的文本歧义，删除可避免把礼仪行动的施行者与接受者混同。
