  text: וְ/הַ/נּוֹתָ֗ר בַּ/שֶּׁ֨מֶן֙ אֲשֶׁר֙ עַל כַּ֣ף הַ/כֹּהֵ֔ן יִתֵּ֖ן עַל רֹ֣אשׁ הַ/מִּטַּהֵ֑ר וְ/כִפֶּ֥ר עָלָ֛י/ו הַ/כֹּהֵ֖ן לִ/פְנֵ֥י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/018.yaml
  text: And what remains of the oil that is on the priest’s palm he shall put on the head of the one being cleansed[a], and the priest shall make atonement for him before Yahweh.
translation:
  language: zh_hans
  text: 祭司要把掌中剩下的油抹在那正在接受洁净礼的人的头上；祭司要在耶和华面前为他赎罪。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהַנּוֹתָר בַּשֶּׁמֶן
  choice: 剩下的油
  rationale: נוֹתָר是尼法勒分词，作名词性用法，指所余之物；结合בַּשֶּׁמֶן的语境，译为“剩下的油”最符合现代汉语表达，也保留“余下”之意。
- source_word: אֲשֶׁר עַל כַּף הַכֹּהֵן
  choice: 祭司掌中
  rationale: כַּף具体指手掌；עַל字面为“在……上”，但液体由手掌承托，现代汉语自然说“掌中”。
- source_word: יִתֵּן עַל רֹאשׁ
  choice: 抹在……头上
  rationale: נָתַן可指放、置、给；在把油施于人体的礼仪语境中，“抹在”自然清楚，比泛泛的“放在”更贴合动作。
- source_word: הַמִּטַּהֵר
  choice: 那正在得洁净之人
  rationale: טהר的Hitpael分词表示正经历礼仪洁净过程的人；“正在得洁净”保留其过程性及中间态色彩，避免误译为已经洁净。
- source_word: וְכִפֶּר עָלָיו
  choice: 祭司要为他赎罪
  rationale: כפר在利未记祭司礼仪中具有施行赎罪的固定含义；“为他赎罪”保留传统且宽泛的礼仪—神学表达，不限定具体赎罪理论。
- source_word: לִפְנֵי יְהוָה
  choice: 在耶和华面前
  rationale: לִפְנֵי表示“在……面前”；专名יהוה音译为汉语中通行的“耶和华”，明确呈现经文中的神圣名字。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。正文采用现代中文圣经传统中辨识度最高的专名“耶和华”，而不以“主”替代，从而保留专名性质；“雅威”是较接近学界重构读音的另一译法。
- issue: 祭司礼仪中כפר的译法
  choice: 为他赎罪
  alternative: 为他施行赎罪／为他除罪污
  rationale: “赎罪”能保留该词在祭司礼仪中的传统神学张力，同时不把其意义缩窄为单一的代偿理论或单纯的净化观念。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。为避免连续多个“他”造成指代含混，重复“祭司”作第二分句主语。正文中的脚注标记与脚注相对应。
