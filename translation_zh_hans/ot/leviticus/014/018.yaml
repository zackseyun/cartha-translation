  to: 祭司要把掌中剩下的油抹在那正在接受洁净礼的人的头上；祭司要在耶和华面前为他赎罪。
  rationale: 仅作汉语表达和脚注的安全修订。“正在接受洁净礼的人”保留原文分词所指的进行中礼仪身份，语义不变得更具体；删去可能误导的脚注及其锚点。其余措辞保持原译的忠实性与庄重语域。
