base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/052.yaml
  text: Thus he shall cleanse the house with the blood of the bird[a], with the living water, with the live bird, with cedar wood, with hyssop[b], and with scarlet yarn.
translation:
  language: zh_hans
  text: 这样，他要用鸟的血、活水[a]、活鸟、香柏木、牛膝草和朱红色纱线[b]，使那房子洁净。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“新鲜的水”或“流动的水”。希伯来语直译为“活水”，通常指来自新鲜、流动水源的水。
    reason: lexical_alternative
  - marker: b
    text: 或译“朱红色线”。希伯来语指洁净礼中使用的朱红色染制材料。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְחִטֵּא
  choice: 他要……洁净
  rationale: חטא 的皮勒式在礼仪语境中指除去污秽、使之洁净；“洁净”自然表达礼仪性的净化，也避免误解为“使犯罪”。连接词 וְ 依照现代汉语叙事衔接不另译出。
- source_word: הַבַּיִת
  choice: 那房子
  rationale: 这里指上文正在接受洁净礼的具体房屋；“那房子”承接语境清楚自然。
- source_word: בְּדַם הַצִּפּוֹר
  choice: 用鸟的血
  rationale: 介词 בְּ 在此表示施行洁净所用的材料或手段，译作“用”最为自然。
- source_word: וּבַמַּיִם הַחַיִּים
  choice: 活水
  rationale: 保留希伯来语“活水”的字面表达及其经文呼应；在此通常指来自新鲜、流动水源的水，并以脚注说明。
- source_word: וּבַצִּפֹּר הַחַיָּה
  choice: 活鸟
  rationale: 准确而简洁地表现这只仍然活着的鸟，并与被宰之鸟形成对照。
- source_word: וּבְעֵץ הָאֶרֶז
  choice: 香柏木
  rationale: עֵץ 与树种连用时在此指仪式所用的木料；“香柏木”是清楚且通行的圣经用语。
- source_word: וּבָאֵזֹב
  choice: 牛膝草
  rationale: 采用现代中文圣经中通行的礼仪植物名称；其精确植物学鉴定仍有争议。
- source_word: וּבִשְׁנִי הַתּוֹלָעַת
  choice: 朱红色纱线
  rationale: 该词组指用虫红染料染成朱红色的材料，很可能是礼仪中使用的线或纱；“朱红色纱线”具体、自然，同时不把材料误解成单指染料。
theological_decisions:
- issue: חטא 皮勒式的礼仪含义
  choice: 洁净
  alternative: 为……赎罪／除罪
  rationale: 受词是遭受房屋灾病污染的房子，语境强调礼仪性除污，而不是房子犯了道德意义上的罪；“洁净”保留本段的祭仪范畴，不额外引入教义解释。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。将一连串表示工具或材料的 בְּ 短语合并在“用……洁净”的自然汉语结构中；脚注标记分别紧随其实际解释的“活水”和“朱红色纱线”，避免歧义。
