  terminology: “祭司”及“灾病”均合适；“灾病”不强加现代医学诊断，并能保留 נגע 在本章的广泛、礼仪性相关含义。脚注应说明“像灾病一样”是对 כְּנֶגַע 的近似表述，而非把整句当作逐字直译。
