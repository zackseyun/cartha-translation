  text: then the owner of the house shall come and tell the priest[a], saying, ‘Something like a plague has appeared to me in the house.’
translation:
  language: zh_hans
  text: 房子的主人就要去告诉祭司，说：“我看见房子里似乎有灾病[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文此处为“像灾病（的状况）”。房主只是报告所见的疑似状况，并未作出确定的鉴定。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָא
  choice: 就要来
  rationale: 在律法程序的叙述中，带连接词的完成式表示接续发生的步骤；“就要来”自然体现程序推进。
- source_word: אֲשֶׁר לוֹ הַבַּיִת
  choice: 房主
  rationale: 原意为“房子属于他的人”；“房主”简洁、自然，准确表达所有关系。
- source_word: וְהִגִּיד לַכֹּהֵן
  choice: 告诉祭司
  rationale: נגד 的使役式表示使人知道、报告；“告诉祭司”既通顺，也保留向祭司正式报告的语境。
- source_word: לֵאמֹר
  choice: 说
  rationale: 作为引出直接引语的常用表达，“说”符合现代汉语习惯。
- source_word: כְּנֶגַע
  choice: 好像出现了灾病
  rationale: 前缀 כְּ־ 表示近似或不确定，不能译成已经确诊；נֶגַע 在《利未记》的洁净条例中指造成礼仪问题的灾病或病状，“灾病”保留其宽泛性，不把它限定为现代医学意义的感染。
- source_word: נִרְאָה לִי
  choice: 我看见……出现了
  rationale: ראה 的尼法勒式可表示“显现、被看见”；此译法自然表达房主根据所见作出的有限观察。
- source_word: בַּבָּיִת
  choice: 房子里
  rationale: בְּ־ 在此表示受影响的情形出现在房屋之中或其结构上；汉语“房子里”可自然概括这一空间关系。
theological_decisions:
- issue: 房主是否有权断定这是灾病
  choice: 用“好像”保留观察的暂定性质
  alternative: 译成“房子里出现了灾病”作确定陈述
  rationale: 希伯来语 כְּנֶגַע 明确带有近似语气；最终鉴定属于祭司的职责，译文不应让房主预先作出确定判断。
translation_notes:
  register: 采用现代、简洁而庄重的律法叙述语体。“房主”“告诉祭司”便于普通读者理解；“灾病”呼应本章有关房屋受侵害状况的专门用语，同时以“好像”保留原文的不确定性。脚注标记放在其实际解释的“灾病”之后。
