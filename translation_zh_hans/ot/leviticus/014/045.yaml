base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/045.yaml
  text: Then he shall tear down the house—its stones[a], its timbers, and all the plaster of the house—and carry them out to an unclean place outside the city.
translation:
  language: zh_hans
  text: 他要拆毁那座房子，并把它的石头、木料和房屋的一切尘土[a]，都运到城外不洁净的地方。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “尘土”原文直译为“房屋的一切尘土”；在此建筑语境中，也可能指泥灰、灰浆或从墙面刮下来的材料。
    reason: 保留עָפָר的字面意义，并说明其在建筑语境中的可能所指。
lexical_decisions:
- source_word: וְנָתַץ
  choice: 他要拆毁
  rationale: נתץ在此指将受污染的房屋拆除；“拆毁”自然、明确，也保留希伯来语动作的力度。连接词וְ在上下文中承接前面的判定和处置，因此不必机械译作“并且”。
- source_word: הַבַּיִת
  choice: 那座房子／房子的
  rationale: בַּיִת在这里指受检验的建筑物实体；“房子”是现代汉语中准确而通俗的表达。
- source_word: אֲבָנָיו
  choice: 房子的石头
  rationale: 原文直指构成房屋的石块；保留具体形象，不泛化为“建筑材料”。
- source_word: עֵצָיו
  choice: 木料
  rationale: 原词指房屋中的木质构件；“木料”既可涵盖梁木等结构材料，也比直译“木头”更符合拆房语境。
- source_word: כָּל עֲפַר הַבָּיִת
  choice: 所有灰泥[a]
  rationale: עָפָר字面为“尘土、泥土”，但在本段刮除墙面并拆毁房屋的建筑语境中，很可能指墙面刮下的泥灰或灰泥；正文采用自然的语境义，并以脚注保留字面含义和其他可能解释。
- source_word: וְהוֹצִיא
  choice: 都运到
  rationale: 该使役动词表示使这些拆下来的材料出去；“运到”自然体现大批建筑材料被搬出并送往指定地点。
- source_word: אֶל מִחוּץ לָעִיר
  choice: 城外
  rationale: 简洁表达向城邑范围以外移动的方向。
- source_word: אֶל מָקוֹם טָמֵא
  choice: 不洁净的地方
  rationale: טָמֵא是利未记的核心礼仪洁净术语；“不洁净”保留其礼仪和法律语境，避免仅理解为一般卫生意义上的肮脏。
theological_decisions:
- issue: 礼仪洁净术语טָמֵא的译法
  choice: 不洁净
  alternative: 污秽的／不洁的
  rationale: “不洁净”能够稳定传达利未记中礼仪与法律层面的状态，同时不额外引入道德败坏或卫生污染的含义。
translation_notes:
  register: 采用现代、庄重而易懂的法律叙事语体。“把……都运到……”将较长的希伯来语宾语序列重组为自然汉语，同时完整保留房屋、石头、木料、墙面材料、城外及不洁净地点等信息。
