base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/001.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: zh_hans
  text: 耶和华对摩西说[a]：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文为“YHWH”（四字神名）；传统上译作“耶和华”，也常以“主”代称。
    reason: 说明原文神名及中文传统译法，避免把专名与称号混同。
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: 说
  rationale: 该形式引入新的叙事性发言事件；在现代汉语中，“对……说”是自然、庄重且符合此神谕引言公式的表达。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文读者熟悉的专名“耶和华”对应四字神名，而不以“主”这一称号替代；脚注注明原文形式。
- source_word: אֶל
  choice: 对
  rationale: 与言说动词搭配，将受话者自然译为“对摩西说”。
- source_word: מֹשֶׁה
  choice: 摩西
  rationale: 采用该希伯来人名在现代汉语中的标准译名。
- source_word: לֵאמֹר
  choice: 以冒号表达
  rationale: 此不定式引出下文所说的内容；汉语通常用冒号自然承载这一功能，若另译“说”会显得重复。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威；主
  rationale: 原文直接使用四字神名，正文保留为专名，不以称号“主”替代；“耶和华”是普通现代中文读者最熟悉的传统音译，同时脚注保留原文信息。
translation_notes:
  register: 采用现代、简洁而庄重的叙事语体。“对摩西说：”符合自然汉语，并由冒号引出下一节的直接话语。
