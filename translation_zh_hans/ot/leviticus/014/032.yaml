  text: זֹ֣את תּוֹרַ֔ת אֲשֶׁר בּ֖/וֹ נֶ֣גַע צָרָ֑עַת אֲשֶׁ֛ר לֹֽא תַשִּׂ֥יג יָד֖/וֹ בְּ/טָהֳרָתֽ/וֹ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/032.yaml
  text: This is the law for him in whom there is an infection of skin disease[b][a], whose means cannot afford what is required for his cleansing.
translation:
  language: zh_hans
  text: 这是为身患皮肤病变[a]、无力备办洁净礼所需之物的人所定的条例[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “皮肤病变”译自希伯来语“灾患（נֶגַע）”与“צָרָעַת”的组合；其中 צָרָעַת 传统上常译作“麻风病”，但在《利未记》中范围较广，指多种皮肤病变及其相关的礼仪不洁，不能简单等同于现代所说的麻风病。
    reason: lexical_alternative
  - marker: b
    text: 直译为“他的手够不到他的洁净所需”。这是指财力不足、不能备办洁净礼所需之物的惯用说法。
    reason: lexical_alternative
lexical_decisions:
- source_word: תּוֹרַת
  choice: 条例
  rationale: 在祭司礼仪语境中，תּוֹרָה 指规定性的程序或准则；“条例”比泛指性的“律法”更自然地表达本节总结前述规程的作用。
- source_word: נֶגַע צָרָעַת
  choice: 严重皮肤病灾病
  rationale: צָרָעַת 在《利未记》中涵盖多种造成礼仪不洁的严重病变，并不等同于现代所说的麻风病；“严重皮肤病”传达其范围，“灾病”则保留 נֶגַע 所指的病患、灾患性质。
- source_word: אֲשֶׁר בּוֹ
  choice: 身上有……的人
  rationale: 自然表达病患存在于此人身上的希伯来语结构，同时不改变其所指。
- source_word: לֹא תַשִּׂיג יָדוֹ
  choice: 无力负担
  rationale: 这是表示财力达不到要求的惯用语；中文不直译“他的手够不到”，以免产生空间意义上的误解。
- source_word: בְּטָהֳרָתוֹ
  choice: 洁净自己所需的费用
  rationale: 上下文所指是洁净礼中需要提供的祭物；“费用”说明其财力不足，却不把原文未明说的具体祭物写入正文。
theological_decisions:
- issue: צָרָעַת 的疾病认定
  choice: 严重皮肤病
  alternative: 麻风病
  rationale: 不把古代礼仪分类等同于现代汉森病，保留该术语在《利未记》中的较广范围。
- issue: טָהֳרָה 的礼仪含义
  choice: 洁净
  alternative: 痊愈
  rationale: 本节涉及礼仪洁净程序及其所需祭物，不是在宣告医学上的痊愈。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“条例”符合祭司礼仪规程的总结语气；正文用“无力负担”自然转达希伯来语财力不足的惯用表达，脚注保留其字面意象。
