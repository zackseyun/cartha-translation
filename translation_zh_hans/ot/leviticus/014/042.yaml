  yaml_path: translation/ot/leviticus/014/042.yaml
  text: Then they shall take other stones and bring them in place of the stones[b][a], and he shall take other mortar and plaster the house.
translation:
  language: zh_hans
  text: 他们要另取石头，拿来替换原来的石头[b]；再取别的泥料[a]，把房子重新抹好。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “泥料”或译“灰泥”；直译为“别的尘土（泥土）”。这里指更换受侵染的石头后，用来重新涂抹房屋的材料。
    reason: lexical_alternative
  - marker: b
    text: 直译“拿到石头下面”，这里是替代的说法，意思是拿来放在原来那些石头的位置。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקְחוּ
  choice: 他们要另取
  rationale: 连词加完成式在这一礼仪程序中承接前一步，表达接续的指令；中文用“要”自然呈现规定语气。
- source_word: אֲבָנִים אֲחֵרוֹת
  choice: 另取石头
  rationale: אֲחֵרוֹת 指另外的石头，即用来替换已被移走的石头；“另取”简洁自然。
- source_word: וְהֵבִיאוּ אֶל תַּחַת הָאֲבָנִים
  choice: 拿来替换原来的石头
  rationale: תַּחַת 在此表示替代，而不是空间上的“在……下面”；补出“原来的”以明确其所指，而不增加实质信息。
- source_word: וְעָפָר אַחֵר
  choice: 别的泥料
  rationale: עָפָר 基本义为尘土、泥土，此处指重新涂抹房屋所用的土质材料。“泥料”既保留材料属性，也符合修缮语境，避免把它过度限定为现代水泥砂浆或成品灰泥。
- source_word: יִקַּח
  choice: 再取
  rationale: 原文由复数转为第三人称阳性单数，指执行这一步的未特定人员。汉语省略主语可自然保留其泛指性，并避免误将单复数转换解释为特定角色变化。
- source_word: וְטָח אֶת הַבָּיִת
  choice: 把房子重新抹好
  rationale: טוח 指在表面涂抹或抹灰；结合前文已刮去房屋内壁涂层的程序，“重新抹好”准确表达修复动作，并符合现代汉语习惯。
