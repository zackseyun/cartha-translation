  text: כִּ֤י תָבֹ֨אוּ֙ אֶל אֶ֣רֶץ כְּנַ֔עַן אֲשֶׁ֥ר אֲנִ֛י נֹתֵ֥ן לָ/כֶ֖ם לַ/אֲחֻזָּ֑ה וְ/נָתַתִּי֙ נֶ֣גַע צָרַ֔עַת בְּ/בֵ֖ית אֶ֥רֶץ אֲחֻזַּתְ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/034.yaml
  text: When you enter the land of Canaan that I am giving to you as a possession[a], and I put an outbreak of skin disease in a house in the land of your possession,
translation:
  language: zh_hans
  text: “你们进入我赐给你们作产业的迦南地时，我使你们作为产业所得之地的一所房屋出现一种灾病[a]，”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 传统上或译“麻风灾病”。这里的希伯来语所指范围比现代医学所说的麻风病更广，可用于人、衣物和房屋上的多种病变或侵染现象。
    reason: 说明词义范围，避免读者把发生在房屋上的现象误解为现代医学意义的麻风病。
lexical_decisions:
- source_word: כִּי תָבֹאוּ
  choice: 你们进入……以后
  rationale: כִּי在此引出将来的时间情境；结合未完成式תָבֹאוּ，译作“进入……以后”自然地表达后续条例生效的时间。
- source_word: אֶרֶץ כְּנַעַן
  choice: 迦南地
  rationale: 采用现代汉语中通行而庄重的地名表达。
- source_word: אֲשֶׁר אֲנִי נֹתֵן לָכֶם
  choice: 就是我赐给你们
  rationale: 保留第一人称神圣施予者；“赐给”符合土地由上帝授予的语境，且不把分词的行动意味削弱为纯粹静态所有。
- source_word: לַאֲחֻזָּה
  choice: 作产业
  rationale: אֲחֻזָּה指可长期持有的地产或产业；“产业”比一般的“财产”更适合土地权属语境。
- source_word: וְנָתַתִּי
  choice: 我若使……出现
  rationale: 保留希伯来文明确的第一人称神圣施动，同时用“若”顺应汉语法律条件句；不改成无施事的“出现”。
- source_word: נֶגַע צָרַעַת
  choice: 灾病
  rationale: 该组合指一种受击打般的病患或侵染现象，且本节对象是房屋；“灾病”保留负面灾患性质，又避免误指现代医学所称的麻风病。
- source_word: בְּבֵית
  choice: 一所房屋出现
  rationale: 将介词结构按自然汉语转换为以房屋作处所主语的表达，不改变现象发生于房屋中的意思。
- source_word: אֶרֶץ אֲחֻזַּתְכֶם
  choice: 你们所得之地
  rationale: 自然表达“你们所持有的产业之地”，并与前面的“赐给你们作产业”形成语义呼应。
theological_decisions:
- issue: 房屋灾病的神圣施动者
  choice: 保留“我若使……出现”
  alternative: 译成“房屋若出现灾病”等无施事表达
  rationale: וְנָתַתִּי明确以说话者上帝为第一人称施动者。译文保留这一可能令人不安的神学张力，不将事件弱化为自然发生。
- issue: וְ־在条例句中的关系
  choice: 以“以后，我若……”表达连续而兼具条件性的情境
  alternative: 机械译作“并且我使……”
  rationale: 希伯来文以连续结构描述进入土地后可能发生并触发条例的情形；汉语用“若”可自然呈现法律语境，同时仍保留上帝的主动作用，并不断言每所房屋必然受灾。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。“就是……”解释前述“迦南地”，“作产业”保留土地权属色彩；全句作为后续条例的引句，以逗号收束。
