  text: וְ/עָשָׂ֤ה הַ/כֹּהֵן֙ אֶת הַ֣/חַטָּ֔את וְ/כִפֶּ֕ר עַל הַ/מִּטַּהֵ֖ר מִ/טֻּמְאָת֑/וֹ וְ/אַחַ֖ר יִשְׁחַ֥ט אֶת הָ/עֹלָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/019.yaml
  text: Then the priest shall offer the sin offering and make atonement for the one being cleansed from his uncleanness[a]; and afterward he shall slaughter the burnt offering.
translation:
  language: zh_hans
  text: 祭司要献上赎罪祭[a]，为那正从不洁中得洁净的人赎罪；然后，他要宰杀燔祭牲。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“洁净祭”。希伯来语 חַטָּאת 在利未记的礼仪语境中可指用于洁净的祭。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשָׂה
  choice: 要献上
  rationale: עָשָׂה 字面义为“做、行”，在献祭语境中指办理或献上祭物；译作“献上”自然地表达其礼仪含义。
- source_word: הַכֹּהֵן
  choice: 祭司
  rationale: 这是该礼仪语境中定冠词名词的标准对应词；汉语无需另行表达定冠词。
- source_word: הַחַטָּאת
  choice: 赎罪祭
  rationale: 此处该词是献祭动作的直接宾语，明确指一种祭物。“赎罪祭”是中文圣经传统中清楚且通行的祭名，同时以脚注保留“洁净祭”这一在利未记洁净礼仪中可能更贴近功能的译法。
- source_word: וְכִפֶּר עַל
  choice: 为……赎罪
  rationale: כפר 在祭司献祭语境中表示施行赎罪之礼；עַל 标明礼仪所为之人。此译保留礼仪与神学力度，而不限定其作用机制。
- source_word: הַמִּטַּהֵר
  choice: 那正……得洁净的人
  rationale: Hitpael 分词指正在经历礼仪洁净过程的人，可带反身或受事意味；“正……得洁净”保留过程性，并避免武断译成主动自洁。
- source_word: מִטֻּמְאָתוֹ
  choice: 从不洁中
  rationale: טֻמְאָה 在利未记中指礼仪上的不洁。“不洁”简洁、传统且符合上下文；所属关系已由“那……的人”自然体现，无须生硬译出“他的”。
- source_word: וְאַחַר
  choice: 然后
  rationale: 清楚表达礼仪程序的先后次序，符合现代汉语。
- source_word: יִשְׁחַט
  choice: 要宰杀
  rationale: 这是宰杀祭牲的常用专门动词；“宰杀”比泛称“杀”更准确地保留献祭语域。
- source_word: הָעֹלָה
  choice: 燔祭牲
  rationale: עֹלָה 是“燔祭”；因其作为“宰杀”的宾语，译作“燔祭牲”明确所宰杀的是用于燔祭的牲畜，避免汉语中仿佛宰杀抽象祭礼的别扭表达。
theological_decisions:
- issue: חַטָּאת 在利未记洁净礼仪中的祭名
  choice: 赎罪祭
  alternative: 洁净祭
  rationale: 该词既可沿用传统祭名“赎罪祭”，在此类礼仪语境中也可按其洁净功能理解为“洁净祭”。正文采用较为通行的“赎罪祭”，脚注保留另一可能，避免消除原词的语义张力。
- issue: כפר 的表达
  choice: 赎罪
  alternative: 施行洁除礼／遮盖
  rationale: “赎罪”是祭司礼仪语境中稳定而庄重的对应词，能够保留神学分量；但不进一步说明赎罪如何发生，以免把特定理论加入经文。
- issue: הַמִּטַּהֵר 的语态与参与方式
  choice: 正从不洁中得洁净的人
  alternative: 正在洁净自己的人
  rationale: Hitpael 形式可能含反身意味，但上下文中的人也正在接受祭司礼仪。采用“得洁净”保留受事与过程性，不把它限定为完全主动的自洁。
- issue: 阳性单数所属后缀 מִטֻּמְאָתוֹ
  choice: 以“那……的人”维持单数所指，不重复译出“他的”
  alternative: 他的不洁
  rationale: 希伯来文是阳性单数。现代汉语可通过单数中心语自然维持所指；省略冗余所属语不构成性别中和，也不改变原文人数。
translation_notes:
  register: 采用现代、庄重而易懂的礼仪用语。“赎罪祭”“燔祭牲”“宰杀”保持利未记祭祀术语的一致性；句法按原文先献赎罪祭、后宰杀燔祭牲的程序展开。脚注标记 [a] 已置于正文相应祭名之后。
