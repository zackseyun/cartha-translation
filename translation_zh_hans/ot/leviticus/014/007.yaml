base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/007.yaml
  text: He shall sprinkle it on the one being cleansed from the skin disease seven times[a], and he shall pronounce him clean[b], and he shall let the living bird go free over the open field.
translation:
  language: zh_hans
  text: 祭司要在那正在从皮肤病中得洁净的人身上洒七次[a]，宣告他洁净[b]，然后把那只活鸟放到野地里去。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 传统译作“麻风病”。希伯来文此词在《利未记》中所指较广，涵盖多种与皮肤有关的状况，并不一定指现代所称的麻风病。
    reason: lexical_alternative
  - marker: b
    text: 或译：“使他洁净。”这里指祭司在礼仪上正式宣告或确认此人为洁净。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִזָּה
  choice: 祭司要把水洒在……身上
  rationale: נזה 的使役式在礼仪语境中指洒液体。希伯来文未明说主语和所洒之物，但上下文表明执行者是祭司，所洒的是前文所述调和之水；中文为通顺而补出“祭司”和“水”。
- source_word: הַמִּטַּהֵר
  choice: 那正……得洁净的人
  rationale: טהר 的 Hitpael 分词表示正在经历洁净礼仪的人；“正……得洁净”保留过程性，而非仅描述一种静态身份。
- source_word: מִן הַצָּרַעַת
  choice: 从皮肤病中
  rationale: צָרַעַת 在《利未记》中所指范围比现代汉语的“麻风病”更广，不宜与汉森病直接等同；“皮肤病”较少造成时代错置。
- source_word: שֶׁבַע פְּעָמִים
  choice: 七次
  rationale: 直接、自然地对应原文次数短语。
- source_word: וְטִהֲרוֹ
  choice: 宣布他为洁净
  rationale: 此处祭司的动作具有礼仪和判定性质；“宣布……为洁净”比“使他洁净”更清楚地表达正式确认，同时脚注保留另一种理解。
- source_word: וְשִׁלַּח אֶת הַצִּפֹּר הַחַיָּה
  choice: 再把那只活鸟放……去
  rationale: שׁלח 在此指释放那只仍活着的鸟。“放……去”符合现代汉语，也保留释放的动作。
- source_word: עַל פְּנֵי הַשָּׂדֶה
  choice: 到田野中
  rationale: 该空间短语可指在田野表面或朝向开阔野地。中文“到田野中去”自然表达鸟被放归野外，避免生硬直译为“在田野表面之上”。
theological_decisions:
- issue: צָרַעַת 的译法
  choice: 皮肤病
  alternative: 麻风病
  rationale: 该词在祭司礼仪体系中涵盖多种异常状况，不能准确等同于现代医学所称麻风病；采用宽泛译法可避免将后世诊断倒置进经文。
- issue: וְטִהֲרוֹ 所表达的祭司行为
  choice: 宣布他为洁净
  alternative: 使他洁净
  rationale: 上下文中的祭司承担礼仪鉴定与确认职能。“宣布”凸显这种正式判定，但原动词也可能被理解为“使之洁净”，故以脚注保留。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。句首补出上下文明确的“祭司”，并补出所洒的“水”，以符合汉语表达；不沿用容易被误解为现代汉森病的传统译名“麻风病”。
