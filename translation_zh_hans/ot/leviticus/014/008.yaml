  source_fidelity: 正文整体准确呈现了洗衣、剃尽毛发、洗身、成为洁净、入营及帐篷外居住七天的礼仪次序。惟“正在接受洁净的人”把希伯来语分词较强地限定为进行中的状态，且脚注把其主要替代解释为“正在洁净自己的人”，容易误导为该人主动施行洁净。该词在此礼仪语境中指接受／经历洁净礼的人。
  naturalness: 原文通顺庄重。“那正在接受洁净礼的人”更符合现代汉语，也更清楚标明这是礼仪程序；“便成为洁净”比“就洁净了”更恰当地表达此处规定行动之后获得的礼仪状态。
  terminology: “洁净”“营中”“帐篷”均合适，并避免将礼仪洁净道德化。保留“可以进入营中”及其脚注，能在正文采用贴合上下文的许可性表达，同时保留未完成式可作规定性或将来性理解的余地。
