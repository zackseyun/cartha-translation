id: LEV.14.8
reference: Leviticus 14:8
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/כִבֶּס֩ הַ/מִּטַּהֵ֨ר אֶת בְּגָדָ֜י/ו וְ/גִלַּ֣ח אֶת כָּל שְׂעָר֗/וֹ וְ/רָחַ֤ץ בַּ/מַּ֨יִם֙ וְ/טָהֵ֔ר וְ/אַחַ֖ר יָב֣וֹא אֶל הַֽ/מַּחֲנֶ֑ה וְ/יָשַׁ֛ב מִ/ח֥וּץ לְ/אָהֳל֖/וֹ שִׁבְעַ֥ת יָמִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/008.yaml
  text: The one being cleansed shall wash his clothes[a], shave off all his hair, and bathe in water; then he shall be clean. Afterward he may come into the camp[b], but he shall stay outside his tent for seven days.
translation:
  language: zh_hans
  text: 那正在接受洁净礼的人[a]要洗衣服，剃去所有毛发，用水洗身，便成为洁净。此后，他可以进入营中[b]，但要在自己的帐篷外居住七天。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“那正在得洁净的人”。希伯来语指正在经历规定洁净礼的人。
    reason: 说明该分词在本段礼仪语境中所指为接受／经历洁净程序的人，并保留自然的词汇替代译法，避免不当地强调反身意义。
  - marker: b
    text: 或译“他要进入营中”。希伯来语形式既可表示“要／将进入”，也可按语境理解为获准进入；他入营后仍须住在自己的帐篷外。
    reason: 保留未完成式在规定性、将来性与许可性之间的语义张力。
lexical_decisions:
- source_word: הַמִּטַּהֵר
  choice: 正在接受洁净的人
  rationale: 该词是Hitpael分词，指处于规定洁净礼过程中的人。“正在接受洁净”自然地表达过程性，也避免让人误解为道德上的洗净。
- source_word: כִבֶּס ... בְּגָדָיו
  choice: 要洗净衣服
  rationale: כִּבֵּס常指洗涤衣物；“洗净衣服”符合现代汉语，也与后文洗身相区别。
- source_word: גִלַּח אֶת כָּל שְׂעָרוֹ
  choice: 剃去全身的毛发
  rationale: “全身的毛发”明确表达כָּל的完整范围；“剃去”体现毛发被彻底除去。
- source_word: רָחַץ בַּמַּיִם
  choice: 用水洗身
  rationale: 在礼仪语境中，רָחַץ指洗身体；译为“洗身”可避免与洗衣服混淆。
- source_word: וְטָהֵר
  choice: 就洁净了
  rationale: 此句说明完成上述行动后所得的礼仪状态；“就”自然体现希伯来文在上下文中的结果与次序。
- source_word: יָבֹא אֶל הַמַּחֲנֶה
  choice: 他可以进入营中
  rationale: 未完成式本身可表示将要进入，也可在此语境中表示获准进入。鉴于随后仍有限制，“可以进入”贴切表达恢复入营资格，同时以脚注保留形式上的另一读法。
- source_word: וְיָשַׁב מִחוּץ לְאָהֳלוֹ
  choice: 但要在自己的帐篷外住
  rationale: יָשַׁב在这里表示暂时居住或停留。虽然连接词字面为“和”，入营后却仍不得回帐篷，汉语用“但”能自然呈现这一对比。
- source_word: שִׁבְעַת יָמִים
  choice: 七天
  rationale: 按现代汉语习惯直接表达持续时间。
theological_decisions:
- issue: 洁净用语所指的性质
  choice: 以“洁净”表达טהר/מטהר所指的礼仪身份与恢复过程
  alternative: 译作“洁除／洁除礼”或容易被理解为道德净化的措辞
  rationale: 本节谈的是按利未记规定恢复礼仪洁净并重新进入营地，不是直接陈述内在道德状态；“洁净”既承接经文术语，也不额外加入教派性解释。
- issue: 进入营地是命令、未来事件还是许可
  choice: 正文译为“可以进入营中”
  alternative: “要进入营中”或“将进入营中”
  rationale: 希伯来语יָבֹא形式上容许简单将来或规定性表达；后文说明他仍须住在帐篷外，因此许可性理解较符合礼仪进程，但以脚注保留原文歧义。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“营中”“帐篷”保留古代以色列营地语境；句式按礼仪步骤清楚推进，并避免把礼仪洁净道德化。
