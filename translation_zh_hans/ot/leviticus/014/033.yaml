  text: And Yahweh spoke to Moses and to Aaron[a], saying,
translation:
  language: zh_hans
  text: 耶和华对摩西和亚伦说：
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: 说
  rationale: 该词在叙事中引出新的言说事件；与后面的 לֵאמֹר 构成固定引语公式时，现代汉语以“对……说”表达最自然。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经传统中最通行的神名音译，以专名呈现四字神名，而不改译为称号。
- source_word: אֶל מֹשֶׁה וְאֶל אַהֲרֹן
  choice: 对摩西和亚伦
  rationale: אֶל 标明话语对象；希伯来文在两个人名前重复介词，汉语用一个“对”统摄并列对象即可准确自然地表达。
- source_word: לֵאמֹר
  choice: 说：
  rationale: 该不定式是引出直接引语的惯用公式；中文以句末“说：”自然承接下文，不机械重复为“说……说道”。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用神的专名，而非“主”这一称号。“耶和华”是普通现代中文读者最熟悉且可明确识别为专名的传统音译；“雅威”更接近当代学界常见的拟音，但不确定的古代发音不宜借正文作过度断定。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。保留典型的启示公式，并用冒号表明话语将在下一节展开。
