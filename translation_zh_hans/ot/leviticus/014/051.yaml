  text: וְ/לָקַ֣ח אֶת עֵֽץ הָ֠/אֶרֶז וְ/אֶת הָ֨/אֵזֹ֜ב וְ/אֵ֣ת שְׁנִ֣י הַ/תּוֹלַ֗עַת וְ/אֵת֮ הַ/צִּפֹּ֣ר הַֽ/חַיָּה֒ וְ/טָבַ֣ל אֹתָ֗/ם בְּ/דַם֙ הַ/צִּפֹּ֣ר הַ/שְּׁחוּטָ֔ה וּ/בַ/מַּ֖יִם הַֽ/חַיִּ֑ים וְ/הִזָּ֥ה אֶל הַ/בַּ֖יִת שֶׁ֥בַע פְּעָמִֽים־־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/051.yaml
  text: Then he shall take the cedar wood[a], the hyssop, the scarlet yarn, and the living bird, and dip them in the blood of the slaughtered bird and in the fresh water[b], and sprinkle the house seven times.
translation:
  language: zh_hans
  text: 他要取香柏木、牛膝草、朱红线[a]和那只活鸟，把这些蘸在被宰之鸟的血和活水[b]中，然后向房屋洒七次。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语字面为“虫的朱红色”，传统上理解为用虫制朱红染料染成的线或纱。
    reason: 说明原文特殊表达及所指礼仪材料。
  - marker: b
    text: 希伯来语为“活水”，在这里指新鲜的水，通常是流动的水。
    reason: 说明希伯来语习语的字面形式和语境含义。
lexical_decisions:
- source_word: וְלָקַח
  choice: 他要取
  rationale: 在连续的礼仪条例中，带连接词的完成式表达接续性的规定动作；“要取”自然体现指令语气。
- source_word: עֵץ הָאֶרֶז
  choice: 香柏木
  rationale: 准确表达作为洁净礼仪材料的香柏木，符合现代汉语和传统礼仪用语。
- source_word: הָאֵזֹב
  choice: 牛膝草
  rationale: 这是 אֵזוֹב 的通行汉语译名；原文在此重在其礼仪用途，并未进一步说明具体植物品种。
- source_word: שְׁנִי הַתּוֹלַעַת
  choice: 朱红线
  rationale: 该短语字面与产朱红染料的虫有关，实际指朱红色染料染成的线或线状材料；“朱红线”简洁且适合本段礼仪场景。
- source_word: הַצִּפֹּר הַחַיָּה
  choice: 那只活鸟
  rationale: “活”使这只鸟与已经被宰的鸟形成明确对照；“那只”符合汉语篇章衔接。
- source_word: וְטָבַל אֹתָם
  choice: 把这些蘸在
  rationale: טבל 表示蘸入或浸入；“这些”保留阳性复数代词对前述整组礼仪材料的指称。
- source_word: בְּדַם הַצִּפֹּר הַשְּׁחוּטָה
  choice: 在被宰之鸟的血……中
  rationale: שׁחט 是礼仪语境中“宰”的常用动词；此译法保留该语域而不弱化为一般的“杀死”。
- source_word: וּבַמַּיִם הַחַיִּים
  choice: 和活水中
  rationale: 直译“活水”，在这里指来自活源、清新或流动的水；正文保留希伯来语形象，脚注说明其语境含义。
- source_word: וְהִזָּה אֶל הַבַּיִת
  choice: 然后向房屋洒
  rationale: נזה 的使役式是礼仪性洒液的常用表达；介词 אֶל 表示朝向，译作“向房屋洒”既贴近句法，也避免擅自限定具体洒落位置。
- source_word: שֶׁבַע פְּעָמִים
  choice: 七次
  rationale: 直接表达动作重复的次数，无须增译。
theological_decisions:
- issue: 礼仪律例中 מַיִם חַיִּים 的译法
  choice: 活水
  alternative: 清水；流动的水
  rationale: 希伯来语字面是“活水”，在本语境中通常指来自泉源或水流的新鲜、流动之水。正文保留原文意象和一定的语义张力，脚注交代其礼仪语境，避免把后世神学含义强加于本节。
translation_notes:
  register: 采用现代、庄重而易懂的礼仪法规语体。用“他要……然后……”呈现连续指令；保留“活水”的原文意象，并以脚注释义。脚注[a]置于“朱红线”之后，以准确对应其所解释的词语。
