  text: 这是有关各种皮肤病变和头皮或胡须部位的皮疹[a]的条例。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语指一种发生于头皮或胡须部位的特定病症，常伴有毛发异常；其确切的现代医学对应不明。或译“鳞屑性皮疹”；传统译作“疥癣”。
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת הַתּוֹרָה
  choice: 这是……的条例
  rationale: זֹאת引出总结性规定；תּוֹרָה在此指诊察和处理相关病患的成套规例，译作“条例”比泛指性的“律法”更贴合本节结语的法律语境。
- source_word: לְכָל נֶגַע הַצָּרַעַת
  choice: 关于各种癞病患处
  rationale: לְכָל表示适用范围；נֶגַע在祭司检验的语境中指可见的患处或病变。צָרַעַת并不等同于现代所称的麻风病（汉森病），故采用较传统但不直接作现代医学诊断的“癞病”，并与“患处”组合以保留原文的具体性。
- source_word: וְלַנָּתֶק
  choice: 和头癣
  rationale: נֶתֶק指利未记13章所述发生于头皮或胡须部位、伴有毛发异常的特定病症；“头癣”简明易懂，但现代医学对应并不确定，因此以脚注说明范围和其他译法。
