  text: And from the oil the priest shall pour onto the palm of his own left hand[a].
translation:
  language: zh_hans
  text: 祭司要从那油中倒在自己的左手掌上[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译：“在祭司的手掌上，那左边的〔手掌〕。”
    reason: 说明原文在“祭司的手掌”后以“左边的”作修饰；正文按现代中文语序译为“自己的左手掌”。
lexical_decisions:
- source_word: וּ/מִן
  choice: 要从……中
  rationale: מִן表示来源“从”，前缀连接词承接前面的礼仪步骤；中文按连续指令的语境自然表达，不必另译“并且”。
- source_word: הַ/שֶּׁמֶן
  choice: 那油
  rationale: 定冠词所指的是前文已经提到的油；“那油”在中文中自然体现这一特指。
- source_word: יִצֹק
  choice: 倒出
  rationale: 该未完成式在礼仪条例中表达指令；“要……倒出”既保留规范性，也符合现代中文表达。
- source_word: עַל
  choice: 到……上
  rationale: 表示油被倒向并落在手掌表面，译为“到……上”能清楚体现动作方向。
- source_word: כַּף
  choice: 手掌
  rationale: כַּף在此具体指手掌或掌心，而非泛指整只手；“手掌”准确且自然。
- source_word: הַ/כֹּהֵן הַ/שְּׂמָאלִית
  choice: 自己的左手掌
  rationale: 原文直译结构是“祭司的手掌，左边的”；中文用“自己的左手掌”避免重复“祭司”，并清楚表明是执行动作的同一位祭司。
