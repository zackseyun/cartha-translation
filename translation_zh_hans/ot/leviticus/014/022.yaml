  text: וּ/שְׁתֵּ֣י תֹרִ֗ים א֤וֹ שְׁנֵי֙ בְּנֵ֣י יוֹנָ֔ה אֲשֶׁ֥ר תַּשִּׂ֖יג יָד֑/וֹ וְ/הָיָ֤ה אֶחָד֙ חַטָּ֔את וְ/הָ/אֶחָ֖ד עֹלָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/022.yaml
  text: and two turtledoves or two young pigeons[a], as his means can afford; and one shall be a sin offering and the other a burnt offering.
translation:
  language: zh_hans
  text: 又要取两只斑鸠，或两只雏鸽，按他的财力所能置办的；一只作赎罪祭[a]，另一只作燔祭。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“洁净祭”。希伯来语这个词在礼仪语境中可指用于洁净的祭。
    reason: 保留חַטָּאת在礼仪洁净语境中的可行词义，避免只按“罪”来理解该祭的功能。
lexical_decisions:
- source_word: וּשְׁתֵּי תֹרִים
  choice: 以及两只斑鸠
  rationale: 连接词承接上一节的供物清单；תֹרִים特指可作祭牲的斑鸠，译作“斑鸠”比泛称“鸽子”更准确。
- source_word: אוֹ שְׁנֵי בְּנֵי יוֹנָה
  choice: 或两只雏鸽
  rationale: אוֹ表示二选一；בְּנֵי יוֹנָה是指幼鸽的固定表达，译作“雏鸽”既自然又保留年龄含义。
- source_word: אֲשֶׁר תַּשִּׂיג יָדוֹ
  choice: 是他力所能及的
  rationale: 字面为“他的手所能达到的”，在此表示其经济能力足以置办；“力所能及”自然保留按财力而定的含义。
- source_word: וְהָיָה אֶחָד חַטָּאת
  choice: 一只作赎罪祭
  rationale: 单数动词和数词把两只鸟中的一只指定为חַטָּאת；“赎罪祭”是该祭名在现代中文圣经语体中清楚而通行的译法。
- source_word: וְהָאֶחָד עֹלָה
  choice: 另一只作燔祭
  rationale: 带冠词的“一个”与前一个形成配对对照，故译为“另一只”；עֹלָה按其祭祀术语译为“燔祭”。
theological_decisions:
- issue: 利未记祭祀语境中חַטָּאת的译法
  choice: 赎罪祭
  alternative: 洁净祭
  rationale: חַטָּאת是传统上称为“赎罪祭”的祭类，但在涉及礼仪性不洁的经文中也突出洁净功能。正文采用读者较熟悉的祭名，同时以脚注保留“洁净祭”这一有充分词义和语境依据的译法，不把两者之间的张力消除。
translation_notes:
  register: 采用现代、庄重而易懂的中文。“以及”保留本节承接上一节的句法关系；“力所能及”表达希伯来语的经济能力习语；祭名使用通行的“赎罪祭”和“燔祭”。脚注标记置于其实际说明的“赎罪祭”之后。
