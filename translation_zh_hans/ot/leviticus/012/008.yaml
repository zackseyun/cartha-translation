  text: וְ/אִם לֹ֨א תִמְצָ֣א יָדָ/הּ֮ דֵּ֣י שֶׂה֒ וְ/לָקְחָ֣ה שְׁתֵּֽי תֹרִ֗ים א֤וֹ שְׁנֵי֙ בְּנֵ֣י יוֹנָ֔ה אֶחָ֥ד לְ/עֹלָ֖ה וְ/אֶחָ֣ד לְ/חַטָּ֑את וְ/כִפֶּ֥ר עָלֶ֛י/הָ הַ/כֹּהֵ֖ן וְ/טָהֵֽרָה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/012/008.yaml
  text: But if she cannot afford a lamb[a], then she shall take two turtledoves or two young pigeons, one for a burnt offering and one for a sin offering; and the priest shall make atonement for her, and she shall be clean.
translation:
  language: zh_hans
  text: 但她若无力预备一只羊羔，就要取两只斑鸠或两只雏鸽，一只作燔祭，一只作赎罪祭[a]。祭司要为她赎罪，她就洁净了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “赎罪祭”或译“洁净祭”；在本章语境中，这祭是为处理生产后的礼仪不洁。
    reason: lexical_alternative
lexical_decisions:
- source_word: תִמְצָא יָדָהּ דֵּי שֶׂה
  choice: 无力预备一只羊羔
  rationale: 希伯来语直译为“她的手找不到足够的一只羊”，是指经济能力不足。“无力预备”自然表达她没有足够财力，同时保留献祭语境。
- source_word: שֶׂה
  choice: 羊羔
  rationale: 本节承接前文所规定的一岁羊羔；在此译作“羊羔”比泛称“羊”更符合上下文。
- source_word: שְׁתֵּי תֹרִים
  choice: 两只斑鸠
  rationale: תֹרִים特指斑鸠；采用中文圣经祭祀语境中准确而通行的名称。
- source_word: שְׁנֵי בְּנֵי יוֹנָה
  choice: 两只雏鸽
  rationale: 该短语字面为“鸽子的儿子”，实际指幼鸽；“雏鸽”简洁自然。
- source_word: עֹלָה
  choice: 燔祭
  rationale: “燔祭”是中文中对该全烧祭物的固定、准确译名，也维持利未记祭名的一致性。
- source_word: חַטָּאת
  choice: 赎罪祭
  rationale: 这是该祭名在中文中的传统固定译法；因本章语境涉及产后礼仪不洁，也可能理解为“洁净祭”，故以脚注保留这一语境性译法。
- source_word: וְכִפֶּר עָלֶיהָ
  choice: 祭司要为她赎罪
  rationale: 保留כפר在祭司礼仪中的神学与祭祀含义；不进一步限定赎罪的机制或对象。
- source_word: וְטָהֵרָה
  choice: 她就洁净了
  rationale: 该动词指恢复礼仪上的洁净状态；“洁净”准确承接本章主题，完成体式的中文表达自然。
theological_decisions:
- issue: 产后洁净语境中חַטָּאת的译法
  choice: 赎罪祭
  alternative: 洁净祭
  rationale: 主文采用一致且通行的祭名“赎罪祭”，但不把产后礼仪不洁等同于个人道德犯罪；脚注说明“洁净祭”这一符合本章功能语境的可能译法，以保留原词的语义张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“无力预备”表达经济能力不足，避免生硬照译希伯来习语；祭祀术语采用中文读者熟悉的“燔祭、赎罪祭、赎罪、洁净”，并用脚注保留חַטָּאת在本语境中的另一种理解。
