  text: And on the eighth day the flesh of his foreskin shall be circumcised[a].
translation:
  language: zh_hans
  text: 第八天，要给他行割礼[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文按字面说：“他包皮的肉要受割礼。”希伯来语动词为被动形式；主文按现代汉语习惯译为“给他行割礼”。
    reason: 保留希伯来语的被动句式和“包皮的肉”这一具体表达，同时避免将割礼误释为“割除”。
lexical_decisions:
- source_word: וּ/בַ/יּוֹם הַ/שְּׁמִינִי
  choice: 第八天
  rationale: 用现代汉语自然的时间表达传达“在第八天”；本节承接上文，汉语无需硬译句首连接词也能保持法律条文的连续性。
- source_word: יִמּוֹל
  choice: 要给他行割礼
  rationale: 希伯来语为Niphal未完成式第三人称阳性单数，在此表达被动而带规定性。汉语通常以“给他行割礼”自然表达受事者接受割礼，同时用“要”保留法律指令的语气。
- source_word: בְּשַׂר עָרְלָתֹו
  choice: 行割礼
  rationale: 原文直译为“他包皮的肉要被割除”。现代汉语固定说法“行割礼”清楚准确地表达该动作，避免生硬而可能引起误解的逐词翻译；直译形式收入脚注。
