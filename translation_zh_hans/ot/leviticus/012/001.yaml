base_translation:
  language: en
  yaml_path: translation/ot/leviticus/012/001.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: zh_hans
  text: 雅威[a]对摩西说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文为“YHWH”（יהוה）；也常译作“耶和华”。
    reason: 说明原文神名及另一常见译名。
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: 说
  rationale: 在“耶和华对摩西说”这一固定引语公式中，现代汉语用“说”最自然；句首的 וַ 表示叙事推进，无须机械译成“然后”。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 这是四字神名 YHWH；“耶和华”是现代中文圣经传统中广为人知的专名形式，并以脚注说明其希伯来文形式及另一常见音译。
- source_word: אֶל־מֹשֶׁה
  choice: 对摩西
  rationale: 介词 אֶל 在言说结构中标示说话对象，汉语自然表达为“对摩西”。
- source_word: לֵאמֹר
  choice: 说（由冒号体现引语功能）
  rationale: 该不定式用于引出随后直接话语；中文无需重复译作“说”，以冒号自然承接下一节内容。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用神的专名而非称号；正文保留中文读者熟悉的专名“耶和华”，脚注注明 YHWH 及“雅威”这一常见拟音，避免把专名改译为“主”。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。用冒号承接下一节的直接话语，避免照搬希伯来语公式而形成“说，说”的中文重复。
