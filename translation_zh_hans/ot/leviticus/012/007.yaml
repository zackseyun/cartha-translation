  text: וְ/הִקְרִיב֞/וֹ לִ/פְנֵ֤י יְהוָה֙ וְ/כִפֶּ֣ר עָלֶ֔י/הָ וְ/טָהֲרָ֖ה מִ/מְּקֹ֣ר דָּמֶ֑י/הָ זֹ֤את תּוֹרַת֙ הַ/יֹּלֶ֔דֶת לַ/זָּכָ֖ר א֥וֹ לַ/נְּקֵבָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/012/007.yaml
  text: And he shall present it before Yahweh and make atonement for her[a], and she shall be cleansed from the source of her blood. This is the law for the woman who gives birth, whether to a male or to a female.
translation:
  language: zh_hans
  text: 祭司要把祭物献到雅威面前，为她赎罪；她就得以洁净，脱离她的血流[a]。这是妇人生男或生女的条例。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“她的血的源头”；也可译为“她出血的源头”。
    reason: 说明 מִמְּקֹר דָּמֶיהָ 的字面意象；正文以“血流”表达其在产后礼仪洁净语境中的自然含义。
lexical_decisions:
- source_word: וְהִקְרִיבוֹ
  choice: 祭司要把祭物献在
  rationale: 使役形动词带第三人称阳性单数宾语后缀，指上文所述祭物；主语按上下文是祭司。用“献”保留礼仪语境，并以“祭物”自然表达希伯来文代词所指。
- source_word: לִפְנֵי יְהוָה
  choice: 在雅威面前
  rationale: לִפְנֵי 表示“在……面前”；专名 יְהוָה 音译为“雅威”，保留经文中的圣约之名。
- source_word: וְכִפֶּר עָלֶיהָ
  choice: 为她赎罪
  rationale: כפר 在祭司献祭语境中表示施行赎罪；此译保留原文的神学张力，不把它缩窄为某一种赎罪理论，也不因产后洁净语境而改写为单纯“洁除污秽”。
- source_word: וְטָהֲרָה
  choice: 她就……得洁净
  rationale: 该动词在连续叙事中表达祭司行动产生的结果。中文“得洁净”自然体现成为礼仪洁净的状态。
- source_word: מִמְּקֹר דָּמֶיהָ
  choice: 从她的血源
  rationale: מָקוֹר 本义为源头、泉源；“血源”简洁保留原文意象及其可能指产后血流来源的含义，并用脚注说明较解释性的译法。
- source_word: זֹאת תּוֹרַת
  choice: 这是……的条例
  rationale: תּוֹרָה 在本段公式中指规定性的礼仪训令。“条例”符合现代中文律例语体，比泛指整套律法的“律法”更贴合此处。
- source_word: הַיֹּלֶדֶת
  choice: 妇人生……
  rationale: 分词指生产的妇人；中文在后接“男或女”时以“妇人生……”表达最为自然。
- source_word: לַזָּכָר אֹו לַנְּקֵבָה
  choice: 生男或生女
  rationale: 原文采用“男性／女性”两个性别词。中文固定表达“生男或生女”既准确保留区分，也比“生一个男性或女性”自然。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名。译作“雅威”较接近学界通常重构的读音，并保留其作为专名的性质。
- issue: 产后洁净语境中的 כפר
  choice: 为她赎罪
  alternative: 为她行洁除礼
  rationale: 原文使用祭司文献中通常表示赎罪的 כפר。虽然上下文关乎礼仪洁净，译文仍保留“赎罪”，避免消除原文中赎罪与洁净并列的张力。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“祭司”由上文补出以避免中文代词指向不明；分号呈现赎罪行动与洁净结果之间的紧密关系。
