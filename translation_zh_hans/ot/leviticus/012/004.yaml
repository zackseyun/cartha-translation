  text: וּ/שְׁלֹשִׁ֥ים יוֹם֙ וּ/שְׁלֹ֣שֶׁת יָמִ֔ים תֵּשֵׁ֖ב בִּ/דְמֵ֣י טָהֳרָ֑ה בְּ/כָל קֹ֣דֶשׁ לֹֽא תִגָּ֗ע וְ/אֶל הַ/מִּקְדָּשׁ֙ לֹ֣א תָבֹ֔א עַד מְלֹ֖את יְמֵ֥י טָהֳרָֽ/הּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/012/004.yaml
  text: Then she shall remain for thirty-three days in the blood of her purification. She shall not touch any holy thing[a], and she shall not come into the sanctuary, until the days of her purification are completed.
translation:
  language: zh_hans
  text: 她要在洁净之血中停留三十三天[a]。她不可触碰任何圣物，也不可进入圣所，直到她洁净的日子期满。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “洁净之血”原文直译也可作“洁净的血”。这是一个不寻常的说法，指产后流血及与礼仪洁净有关的时期。
    reason: 说明希伯来语特殊措辞及其语境含义，同时保留其歧义。
lexical_decisions:
- source_word: וּ/שְׁלֹשִׁים יוֹם וּ/שְׁלֹשֶׁת יָמִים
  choice: 三十三天
  rationale: 希伯来语直译为“三十天又三天”；现代汉语自然合并为“三十三天”。
- source_word: תֵּשֵׁב
  choice: 度过
  rationale: 该动词本义可指“坐、居住、停留”；此处表示在某种礼仪状态中持续一段时间，“度过”符合现代汉语表达。
- source_word: בִּ/דְמֵי טָהֳרָה
  choice: 在洁净之血的状态中
  rationale: 原文措辞特殊，字面为“在洁净的血中”，指产后流血及相关的礼仪洁净期；译文保留“血”的具体意象，并补出“状态”以便理解。
- source_word: בְּ/כָל קֹדֶשׁ
  choice: 任何圣物
  rationale: קֹדֶשׁ 可指“圣、圣洁之物”；在本礼仪律例语境中，“圣物”简洁地表达供圣用之物。
- source_word: לֹא תִגָּע
  choice: 不可触碰
  rationale: 准确表达法律条文中的禁止，语体庄重而自然。
- source_word: וְ/אֶל הַ/מִּקְדָּשׁ לֹא תָבֹא
  choice: 也不可进入圣所
  rationale: מִקְדָּשׁ 指分别为圣的场所；“进入圣所”自然表达原文“不可来到圣所”的空间含义。
- source_word: עַד מְלֹאת יְמֵי טָהֳרָהּ
  choice: 直到她洁净的日子满了
  rationale: 保留 מְלֹאת 的“满、完成”意象及原文明确的阴性所属后缀，避免把礼仪洁净误解为道德赦罪。
theological_decisions:
- issue: 如何表达产后的礼仪洁净而不暗示道德罪责
  choice: 洁净
  alternative: 洁除；净化
  rationale: 本节处理的是礼仪身份和期限，并未断言生产本身构成道德过犯。“洁净”符合《利未记》的礼仪语境，也保留该术语的神学张力。
- issue: 如何处理 בִּדְמֵי טָהֳרָה 这一不寻常短语
  choice: 洁净之血的状态
  alternative: 洁净的血；产后洁净期
  rationale: 选择保留原文“血”的具体表达，不将其完全解释为抽象的“产后洁净期”；同时用“状态”使现代读者能理解这里是在描述持续的礼仪处境。
translation_notes:
  register: 采用现代、庄重而易懂的律例语体。“不可”保持法律禁令的力度；“圣物”“圣所”“洁净”保持《利未记》礼仪术语的一致性。
