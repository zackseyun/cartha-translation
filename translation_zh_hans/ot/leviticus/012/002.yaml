source:
  edition: WLC
  text: דַּבֵּ֞ר אֶל בְּנֵ֤י יִשְׂרָאֵל֙ לֵ/אמֹ֔ר אִשָּׁה֙ כִּ֣י תַזְרִ֔יעַ וְ/יָלְדָ֖ה זָכָ֑ר וְ/טָֽמְאָה֙ שִׁבְעַ֣ת יָמִ֔ים כִּ/ימֵ֛י נִדַּ֥ת דְּוֺתָ֖/הּ תִּטְמָֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/012/002.yaml
  text: 'Speak to the sons of Israel[a], saying: If a woman conceives and gives birth to a male child, then she shall be unclean seven days[c][b]; she shall be unclean as in the days of her menstrual impurity.'
translation:
  language: zh_hans
  text: “你要告诉以色列人[a]说：妇女若[b]怀孕，生下男孩，就要不洁净七天[c]；她要像她月经不洁净的日子那样不洁净。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“以色列的众子”；这是对以色列民族的惯用称呼。
    reason: lexical_alternative
  - marker: b
    text: 或译：“当……时”。这里的希伯来语词引出个案律例，可按语境译作“若”或“当……时”。
    reason: lexical_alternative
  - marker: c
    text: 这里的“不洁净”指洁净条例中的礼仪状态，并非说道德上有罪。
    reason: cultural_note
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 该希伯来语短语直译为“以色列的众子”，在这里是对以色列民族的惯用称呼；译作“以色列人”符合现代汉语，也涵盖本条律例所面对的全体会众。
- source_word: אִשָּׁה
  choice: 妇女
  rationale: 法律条文中泛指一名女性，并不要求译成“妻子”；“妇女”在现代汉语中清楚、庄重。
- source_word: כִּי
  choice: 若
  rationale: 此处引出个案律例的条件。“若”保留法律表述的条件语气；按上下文也可理解为“当……时”，故加注说明。
- source_word: תַזְרִיעַ
  choice: 怀孕
  rationale: 该词源于“撒种、产生种子”，此处与生产连用，指受孕或怀孕；“怀孕”是自然清楚的现代汉语表达。
- source_word: וְיָלְדָה זָכָר
  choice: 生下男孩
  rationale: 保留 זָכָר 所强调的男性性别，同时采用符合现代汉语的生产用语。
- source_word: וְטָמְאָה / תִּטְמָא
  choice: 就要不洁净／她要不洁净
  rationale: 保留原文前后两次明确陈述“不洁净”的重复，并维持律例语体；不在正文中增添原文没有明说的“礼仪上”。
- source_word: שִׁבְעַת יָמִים
  choice: 七天
  rationale: 直接表达原文规定的时段。
- source_word: כִּימֵי נִדַּת דְּוֺתָהּ
  choice: 像她月经期间一样
  rationale: נִדָּה 与 דְּוֺתָהּ 在此共同指月经流血及其相关的不洁净时期；此译自然表达比较关系，避免把生理状态误译为一般疾病。
theological_decisions:
- issue: טמא 在洁净条例中的性质
  choice: 正文译作“不洁净”
  alternative: 译作“礼仪上不洁净”或“仪式上不洁净”
  rationale: 本章语境表明这是礼仪性的洁净状态，并非道德罪责；但希伯来语动词本身只说“不洁净”，因此正文不加限定，以脚注交代语境。
- issue: בְּנֵי יִשְׂרָאֵל 的群体指称
  choice: 以色列人
  alternative: 以色列的众子／以色列子民
  rationale: 这是希伯来语惯用的民族称谓。现代汉语“以色列人”既准确指向立约群体，也避免让读者误以为命令只传给男性。
- issue: כִּי 的个案律例语气
  choice: 若
  alternative: 当……时
  rationale: 原词在个案律例中既可用条件式表达，也可按预期发生的情形译为时间式；正文采用“若”，脚注保留“当……时”的可能性。
translation_notes:
  register: 采用现代、庄重而易懂的律例语体。“你要告诉……说”保留命令的传达结构；用“妇女”“怀孕”“生下男孩”“月经期间”等当代常用表达。正文保留“不洁净”的重复及其礼仪语境中的张力，不把解释性限定直接写入经文。
