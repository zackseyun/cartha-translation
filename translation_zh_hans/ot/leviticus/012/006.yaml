  text: וּ/בִ/מְלֹ֣את יְמֵ֣י טָהֳרָ֗/הּ לְ/בֵן֮ א֣וֹ לְ/בַת֒ תָּבִ֞יא כֶּ֤בֶשׂ בֶּן שְׁנָת/וֹ֙ לְ/עֹלָ֔ה וּ/בֶן יוֹנָ֥ה אוֹ תֹ֖ר לְ/חַטָּ֑את אֶל פֶּ֥תַח אֹֽהֶל מוֹעֵ֖ד אֶל הַ/כֹּהֵֽן׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/012/006.yaml
  text: And when the days of her purification are completed[a], whether for a son or for a daughter, she shall bring a year-old lamb for a burnt offering, and a young pigeon or a turtledove for a sin offering, to the priest at the entrance of the tent of meeting.
translation:
  language: zh_hans
  text: 无论她生的是儿子还是女儿，她洁净的日子满了，就要带一只一岁的羊羔作燔祭，并带一只雏鸽或一只斑鸠作赎罪祭[a]，到会幕门口交给祭司。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“洁净祭”。希伯来语这个词可指除去礼仪不洁的祭，并不只指为道德过犯所献的祭。
    reason: 保留חַטָּאת在祭祀术语“赎罪祭”与本处礼仪洁净功能之间的词义张力。
lexical_decisions:
- source_word: וּבִמְלֹאת יְמֵי טָהֳרָהּ
  choice: 她……洁净的日子满了
  rationale: 介词加不定式结构表达一段时期结束；“日子满了”自然保留时间和完成之意。טָהֳרָהּ在本章指礼仪上的洁净过程，并非道德上的洗罪。
- source_word: לְבֵן אוֹ לְבַת
  choice: 为儿子或女儿
  rationale: 忠实保留两种生产情形；汉语无需另加“无论”，也能自然表达二者皆适用。
- source_word: תָּבִיא
  choice: 就要带
  rationale: Hiphil未完成式在律法语境中具有规定性；“要”庄重而自然，不额外强化为绝对命令。
- source_word: כֶּבֶשׂ בֶּן שְׁנָתוֹ
  choice: 一只一岁以内的羊羔
  rationale: 该希伯来习语指尚在第一年内的羊羔；“一岁以内”比“一岁的”更准确地保留年龄范围。
- source_word: לְעֹלָה
  choice: 作燔祭
  rationale: עֹלָה是利未记中固定的祭祀术语，采用现代中文圣经语域中清楚而简洁的“燔祭”。
- source_word: וּבֶן יוֹנָה אוֹ תֹר
  choice: 并一只雏鸽或一只斑鸠
  rationale: בֶּן־יוֹנָה明确指幼鸽，תֹר指斑鸠；分别译出，保留动物种类与年龄的区别。
- source_word: לְחַטָּאת
  choice: 作赎罪祭
  rationale: חַטָּאת是祭祀体系中的传统技术用语，但也可从功能上理解为洁净祭；正文保留常用术语，脚注说明本处语境。
- source_word: אֶל־פֶּתַח אֹהֶל מוֹעֵד אֶל־הַכֹּהֵן
  choice: 到会幕门口交给祭司
  rationale: 两个אֶל分别表达地点方向和接受者；此译自然说明她把祭物带到会幕门口给祭司，同时保留希伯来语末尾信息次序。
theological_decisions:
- issue: 产后洁净语境中חַטָּאת的译法
  choice: 正文译“赎罪祭”，并加脚注说明也可译“洁净祭”
  alternative: 正文直接译“洁净祭”
  rationale: “赎罪祭”保留利未记献祭术语的一致性和读者熟悉度；然而本段处理的是生产后的礼仪不洁，并不表示生产本身是道德罪行。脚注保存原词在此语境中的功能性含义，避免消除其真实的词义张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“洁净”“燔祭”“赎罪祭”“会幕”保留利未记必要的礼仪术语；句法依照希伯来文推进，又调整为自然中文。
