  text: וְ/אִם נְקֵבָ֣ה תֵלֵ֔ד וְ/טָמְאָ֥ה שְׁבֻעַ֖יִם כְּ/נִדָּתָ֑/הּ וְ/שִׁשִּׁ֥ים יוֹם֙ וְ/שֵׁ֣שֶׁת יָמִ֔ים תֵּשֵׁ֖ב עַל דְּמֵ֥י טָהֳרָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/012/005.yaml
  text: But if she gives birth to a female child[a], then she shall be unclean for two weeks, as in her menstruation[b]; and for sixty-six days she shall remain in the blood of purification.
translation:
  language: zh_hans
  text: 但如果她生的是女孩，她就成为不洁净的两个星期，如同她因月经而不洁净时一样[a]；她要在与洁净有关的流血期间度过六十六天[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里的“不洁净”指礼仪上的状态。希伯来原文把产后的这段不洁期与妇女因月经而处于不洁状态的期间相比较，并非指道德罪责。
    reason: lexical_alternative
  - marker: b
    text: “与洁净有关的流血期间”较直译为“洁净之血”。这指产后流血以及按律法规定完成洁净的期间，不表示产妇有道德罪责。
    reason: cultural_note
lexical_decisions:
- source_word: וְאִם
  choice: 但如果
  rationale: 承接上一节生男孩的情形，引出相对的生女孩情形；既保留条件关系，也体现语境中的转折。
- source_word: נְקֵבָה תֵלֵד
  choice: 她生的是女孩
  rationale: נְקֵבָה本义为“女性、雌性”，在分娩语境中自然指女婴；“女孩”比仅说“女性”更符合现代汉语，同时不必将其改写为亲属称谓“女儿”。
- source_word: וְטָמְאָה
  choice: 她就要不洁净
  rationale: 表示分娩后所处的礼仪状态。“不洁净”保留利未记的核心术语，不暗示她犯了罪或在道德上有污点。
- source_word: שְׁבֻעַיִם
  choice: 两个星期
  rationale: 该双数形式在这里表示两个七日周期，即十四天；“两个星期”是清楚自然的现代汉语。
- source_word: כְּנִדָּתָהּ
  choice: 像月经污秽期间一样
  rationale: נִדָּה在此涉及月经所伴随的礼仪不洁状态。译文明确比较的是这一期间，而不是把月经本身说成道德污秽。
- source_word: וְשִׁשִּׁים יוֹם וְשֵׁשֶׁת יָמִים
  choice: 六十六天
  rationale: 将希伯来语“六十天和六天”按现代汉语数词习惯合并，数量不变。
- source_word: תֵּשֵׁב
  choice: 度过
  rationale: 字面可作“坐、居留”，在这里表示持续处于规定的状态或期间；“度过”比“坐在”自然，也避免误解为空间位置。
- source_word: עַל דְּמֵי טָהֳרָה
  choice: 在产血洁净期中
  rationale: 希伯来语近于“在洁净之血中”，指产后与流血及洁净相关的规定期间。“产血洁净期”在现代汉语中较易理解，并以脚注保留其字面结构和礼仪背景。
theological_decisions:
- issue: 本节“不洁净”的性质
  choice: 保留“不洁净”这一礼仪用语，不添加道德定罪含义
  alternative: 译作“在礼仪上不洁净”
  rationale: 上下文规定的是产后礼仪身份和洁净期限，并非断言产妇有道德罪责。正文保留原文简洁的“不洁净”，脚注说明其礼仪性质。
- issue: “洁净之血”与产后洁净期的关系
  choice: 正文译为“产血洁净期”，脚注交代较直译的表达
  alternative: 直译为“洁净之血”或“在洁净的血中”
  rationale: 原文表达具有古代礼仪法规的浓厚色彩。直译在现代汉语中容易被理解成血液本身已被判定为“干净”，故正文表达其期间意义，同时不将其解释成道德赦罪。
translation_notes:
  register: 采用现代、庄重而易懂的法规文体。“两个星期”和“六十六天”清楚呈现两个规定期限；保留“不洁净”这一利未记术语，并用脚注防止读者将礼仪状态误解为道德污点。
