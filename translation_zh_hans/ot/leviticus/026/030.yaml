  text: וְ/הִשְׁמַדְתִּ֞י אֶת בָּמֹֽתֵי/כֶ֗ם וְ/הִכְרַתִּי֙ אֶת חַמָּ֣נֵי/כֶ֔ם וְ/נָֽתַתִּי֙ אֶת פִּגְרֵי/כֶ֔ם עַל פִּגְרֵ֖י גִּלּוּלֵי/כֶ֑ם וְ/גָעֲלָ֥ה נַפְשִׁ֖/י אֶתְ/כֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/030.yaml
  text: And I will destroy your high places[a], and cut down your incense altars, and place your corpses on the carcasses of your idols[b], and my soul will abhor you.
translation:
  language: zh_hans
  text: 我要摧毁你们的丘坛，铲除你们的香坛[a]；我要把你们的尸首放在你们偶像的尸首上[b]，我的心必厌恶你们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“太阳柱”。希伯来语所指的是非法敬拜所用的器物，可能与焚香或太阳崇拜有关；其确切形制仍有争议。
    reason: lexical_alternative
  - marker: b
    text: 希伯来语用同一个“尸首”先指人，又指偶像，借此强调偶像毫无生命，并加重羞辱的意味。
    reason: wordplay
lexical_decisions:
- source_word: הִשְׁמַדְתִּי
  choice: 摧毁
  rationale: 使役形表达彻底毁坏；“摧毁”力度鲜明，又不超出本节所指的对象。
- source_word: בָּמֹתֵיכֶם
  choice: 你们的丘坛
  rationale: בָּמוֹת通常指设在高处或被称为“高处”的祭祀场所；“丘坛”在简体中文中简洁地兼顾其地势与敬拜用途。
- source_word: הִכְרַתִּי
  choice: 铲除
  rationale: כרת本义为“砍断、剪除”。因宾语所指器物的具体形制不确定，“铲除”既保留清除殆尽的力度，也避免把它限定为一定可以“砍倒”的柱状物。
- source_word: חַמָּנֵיכֶם
  choice: 你们的香坛
  rationale: חַמָּנִים指非法祭祀所用的器物，可能与焚香或太阳崇拜有关，具体形制有争议；正文采用可读的功能性译法，并以脚注保留“太阳柱”的可能。
- source_word: נָתַתִּי
  choice: 放在
  rationale: נתן在这里表示把某物置于另一物之上；“放在”自然直接。
- source_word: פִּגְרֵיכֶם
  choice: 你们的尸首
  rationale: פֶּגֶר指尸体；用于人时，“尸首”准确、庄重，并保留审判场景的严厉。
- source_word: פִּגְרֵי גִּלּוּלֵיכֶם
  choice: 你们偶像的尸首
  rationale: 原文再次使用פֶּגֶר，把偶像描绘成毫无生命的尸体。中文重复“尸首”，保留原文刻意形成的对应与羞辱效果。
- source_word: גִּלּוּלֵיכֶם
  choice: 你们的偶像
  rationale: גִּלּוּלִים是带强烈贬义的偶像称呼；正文以清楚自然的“偶像”表达所指，其轻蔑色彩由上下文和脚注补明。
- source_word: גָעֲלָה נַפְשִׁי אֶתְכֶם
  choice: 我的心必厌恶你们
  rationale: 原文直译为“我的生命/灵魂必厌恶你们”。现代中文以“我的心”自然表达主体内在而强烈的憎厌，同时保留第一人称所有结构，不简化成单纯的“我必厌恶你们”。
theological_decisions:
- issue: 以拟人方式表达上帝强烈的厌恶
  choice: 我的心必厌恶你们
  alternative: 我必厌恶你们；我的灵魂必厌恶你们
  rationale: 保留נַפְשִׁי的显式表达，使强烈而带关系性的拒斥不被淡化；“我的心”比现代中文里的“我的灵魂”更自然，也不额外引入灵魂构成论方面的联想。
translation_notes:
  register: 采用现代、庄重而直接的普通话。保留审判宣告的严厉语气及“尸首—尸首”的刻意重复；分号仅用于清楚呈现两个紧密相连的审判动作。脚注[a]按其实际对应词חַמָּנֵיכֶם置于“香坛”之后。
