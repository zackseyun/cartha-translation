source:
  edition: WLC
  text: וְ/הֵבֵאתִ֨י עֲלֵי/כֶ֜ם חֶ֗רֶב נֹקֶ֨מֶת֙ נְקַם בְּרִ֔ית וְ/נֶאֱסַפְתֶּ֖ם אֶל עָרֵי/כֶ֑ם וְ/שִׁלַּ֤חְתִּי דֶ֨בֶר֙ בְּ/ת֣וֹכְ/כֶ֔ם וְ/נִתַּתֶּ֖ם בְּ/יַד אוֹיֵֽב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/025.yaml
  text: And I will bring against you a sword executing the vengeance of the covenant[a], and you will be gathered into your cities. Then I will send pestilence among you, and you will be given into the hand of the enemy.
translation:
  language: zh_hans
  text: 我要使一把为盟约施行报复的刀剑临到你们[a]；你们必聚集到自己的城里。那时，我要在你们中间降下瘟疫，你们必被交在仇敌手中。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译近于“一把为盟约施行报复（报复）的刀剑”；“施行报复”和“报复”是同根词，用以加强语气。“盟约”与“报复”的关系可理解为“为盟约伸张”“施行盟约的报应”，或“执行盟约所关联的惩罚”。
    reason: 说明希伯来语同根强调，并保留“盟约”与“报复”之间未完全确定的语义关系，避免正文增补“背约之罪”。
lexical_decisions:
- source_word: וְהֵבֵאתִי עֲלֵיכֶם חֶרֶב
  choice: 我要使刀剑临到你们
  rationale: הֵבֵאתִי 是 בוא 的使役式，表示使某物临到；“使刀剑临到你们”既保留使役结构，也自然表达敌对性的审判。
- source_word: נֹקֶמֶת נְקַם בְּרִית
  choice: 追讨背约之罪
  rationale: 该结构直译近于“为约施行报复的刀剑”，其中分词与同根名词形成强调。现代汉语若逐字重复“报复报复”不自然；结合利26:15所述违背盟约的语境，“追讨背约之罪”表达盟约被破坏所招致的司法性惩罚，同时用脚注保留原文可能的关系与强调。
- source_word: וְנֶאֱסַפְתֶּם אֶל עָרֵיכֶם
  choice: 你们必聚集到自己的城里
  rationale: נֶאֱסַפְתֶּם 为被动或反身形态，语境中指众人在战争压力下退聚城中；“聚集到自己的城里”保留形式上的含蓄，不额外明说逃难或被围困。
- source_word: וְשִׁלַּחְתִּי דֶבֶר בְּתוֹכְכֶם
  choice: 我要在你们中间降下瘟疫
  rationale: דֶבֶר 指严重的流行性疫病；“瘟疫”符合盟约咒诅语境。“降下”自然表达神使灾害进入人群的动作。
- source_word: וְנִתַּתֶּם בְּיַד אוֹיֵב
  choice: 你们必被交在仇敌手中
  rationale: נִתַּתֶּם 是被动式；“交在……手中”保留希伯来语以“手”表示权势与控制的惯用表达，单数“仇敌”也对应原文。
theological_decisions:
- issue: “盟约的报复”（נְקַם בְּרִית）的关系
  choice: 译作“追讨背约之罪”，并以脚注说明原文
  alternative: “为约施行报复”或“施行盟约的报复”
  rationale: 原文可指因盟约遭破坏而施行报应，也可理解为替盟约伸张或执行盟约所规定的惩罚。正文采用符合本段语境的自然汉语，脚注则保留这些相近而未完全等同的可能性，避免把盟约审判的张力抹平。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“刀剑临到”“交在仇敌手中”保留经文的审判意象；“瘟疫”准确呈现盟约咒诅中的灾病。脚注标记[a]已置于正文相应短语之后。
