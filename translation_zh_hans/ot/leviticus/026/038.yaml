  text: וַ/אֲבַדְתֶּ֖ם בַּ/גּוֹיִ֑ם וְ/אָכְלָ֣ה אֶתְ/כֶ֔ם אֶ֖רֶץ אֹיְבֵי/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/038.yaml
  text: You will perish among the nations[a], and the land of your enemies will consume you.
translation:
  language: zh_hans
  text: 你们必在列国中灭亡；你们仇敌的土地必吞吃你们。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “吞吃”直译为“吃”；也可译作“吞灭”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲבַדְתֶּם
  choice: 你们必……灭亡
  rationale: אבד 的 Qal 形式在盟约咒诅的连续后果中表示灭亡、消逝。“灭亡”自然传达毁灭性的结局，又不额外限定具体死法。
- source_word: בַּגּוֹיִם
  choice: 在列国中
  rationale: גּוֹיִם 指各国、各民族；“列国”保留旧约语境中的集合性表达，不引入后期“外邦人”的宗教含义。
- source_word: וְאָכְלָה
  choice: 必吞吃
  rationale: אכל 字面意为“吃”。土地作主语时构成强烈的拟人化隐喻；“吞吃”既保留原文意象，也符合现代汉语表达。
- source_word: אֶתְכֶם
  choice: 你们
  rationale: 直宾标记附第二人称阳性复数后缀，汉语自然译作宾语“你们”。
- source_word: אֶרֶץ
  choice: 土地
  rationale: אֶרֶץ 在流亡语境中指仇敌所居之地；“土地”也能自然充当“吞吃”的主语并保留原文意象。
- source_word: אֹיְבֵיכֶם
  choice: 你们仇敌的
  rationale: 该构造短语修饰“土地”，直译即可准确保留所属关系及敌对语境。
theological_decisions:
- issue: “仇敌的土地必吞吃你们”的隐喻力量
  choice: 保留土地“吞吃”流亡者的盟约咒诅意象。
  alternative: 意译为“你们仇敌的土地必毁灭你们”。
  rationale: 原文以常见动词“吃”描写土地，形成刻意而强烈的拟人化表达。保留此意象可维持咒诅的严厉程度和文学张力，而不将其解释为某一种特定的毁灭方式。
translation_notes:
  register: 采用现代、庄重且易懂的书面汉语。“列国”适合旧约盟约与流亡语境；“吞吃”刻意保留希伯来文的具体隐喻。脚注标记置于整句末，说明其所涉及的后半句用词。
