  text: וְ/נָתַתִּ֤י אֶת עָֽרֵי/כֶם֙ חָרְבָּ֔ה וַ/הֲשִׁמּוֹתִ֖י אֶת מִקְדְּשֵׁי/כֶ֑ם וְ/לֹ֣א אָרִ֔יחַ בְּ/רֵ֖יחַ נִיחֹֽחֲ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/031.yaml
  text: And I will make your cities a ruin[a], and I will lay waste your sanctuaries, and I will not smell the pleasing aroma of your offerings.
translation:
  language: zh_hans
  text: 我要使你们的城邑成为废墟，使你们的圣所荒凉；我也不闻你们祭物所发的馨香之气。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “祭物所发的”是按献祭语境补出的。希伯来文直译为：“我也不闻你们的馨香之气。”这是一种献祭用语；在此语境中通常表达上帝不悦纳所献的祭物。
    reason: 说明语境补足，保留原文“闻”的感官意象，并谨慎说明该献祭习语的通常含义。
lexical_decisions:
- source_word: וְנָתַתִּי אֶת־עָרֵיכֶם חָרְבָּה
  choice: 我要使你们的城邑沦为废墟
  rationale: נתן与宾语及表语连用，在这里表达“使……成为”的意思；“城邑”涵盖城市和市镇，“沦为废墟”自然地传达חָרְבָּה所指的毁坏状态。
- source_word: וַהֲשִׁמּוֹתִי
  choice: 使……荒凉
  rationale: 这是שמם的使役形，表示使某处荒废、凄凉；译文保留其使役力量。
- source_word: מִקְדְּשֵׁיכֶם
  choice: 你们的圣所
  rationale: 原文为复数，泛指分别为圣的敬拜场所；现代汉语中“圣所”既可作类别性集合表达，也保留礼仪语境，避免误限定为单一建筑。
- source_word: וְלֹא אָרִיחַ
  choice: 我也不闻
  rationale: 原文动词是“闻、嗅”，保留拟人化的感官意象，而不直接释为“不悦纳”。
- source_word: בְּרֵיחַ נִיחֹחֲכֶם
  choice: 你们所献的馨香之气
  rationale: רֵיחַ נִיחֹחַ是献祭语境中的固定表达。“馨香之气”保留其礼仪色彩；“所献的”由语境补出，避免被误解为百姓自身的气味。
theological_decisions:
- issue: 末句应保留嗅闻的拟人化表达，还是直接译出拒绝祭物的含义
  choice: 保留“我也不闻”的感官意象
  alternative: 译作“我也不悦纳你们的祭物”
  rationale: 希伯来文明确使用“闻”以及献祭用语“馨香之气”。直译意象既暗示不悦纳，又不把隐含意义完全替代原文表达。
- issue: מִקְדְּשֵׁיכֶם的复数如何在汉语中表达
  choice: 译作类别性集合用法“你们的圣所”
  alternative: 译作“你们各处的圣所”或“你们的众圣所”
  rationale: 原文复数须在理解上保留，但“众圣所”较生硬，“各处的圣所”又增加分布含义；汉语“圣所”可自然泛指此类场所。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“城邑”“圣所”“馨香之气”保留经文的礼仪与审判语域；分号呈现两组毁灭宣告与末句拒绝祭物之间的推进关系。
