  text: וְ/הִתְהַלַּכְתִּי֙ בְּ/ת֣וֹכְ/כֶ֔ם וְ/הָיִ֥יתִי לָ/כֶ֖ם לֵֽ/אלֹהִ֑ים וְ/אַתֶּ֖ם תִּהְיוּ לִ֥/י לְ/עָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/012.yaml
  text: I will walk among you and will be your God[a], and you will be my people.
translation:
  language: zh_hans
  text: 我要在你们中间行走[a]，我要作你们的上帝，你们要作我的子民。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我要在你们当中往来。”
    reason: 词形可带有反复走动、往来的意味；此译法提示 Hitpael 形式的动态色彩，同时不把它改释为“居住”。
lexical_decisions:
- source_word: וְהִתְהַלַּכְתִּי
  choice: 我要……行走
  rationale: התהלך 是 הלך 的 Hitpael 形式，在这里表达上帝亲自在百姓中间行走、临在的图景。“行走”保留原文具体的盟约意象；译作“居住”则会超出这个动词本身的含义。
- source_word: בְּתוֹכְכֶם
  choice: 在你们中间
  rationale: 该短语指在整个群体当中。“在你们中间”自然、准确，也避免“在你们里面”可能引起的个人内在居住之义。
- source_word: וְהָיִיתִי לָכֶם לֵאלֹהִים
  choice: 我要作你们的上帝
  rationale: 这是固定的盟约用语。此译法以自然的现代汉语表达归属与关系，同时保留原文的盟约力度。
- source_word: לֵאלֹהִים
  choice: 上帝
  rationale: 在以色列的盟约语境中，אֱלֹהִים 明确指与百姓立约的独一上帝，并非泛指某一位神。
- source_word: וְאַתֶּם תִּהְיוּ לִי לְעָם
  choice: 你们要作我的子民
  rationale: 这是与前句对应的固定盟约用语。“我的子民”自然地表达 לִי לְעָם 所包含的归属和关系。
theological_decisions:
- issue: 盟约公式的表达
  choice: 我要作你们的上帝，你们要作我的子民
  alternative: 我要成为你们的上帝，你们要成为属我的百姓
  rationale: 所选译文保留双方相属的盟约关系，语言凝练自然；不额外说明这关系如何实现，也不加入原文未明说的教义内容。
- issue: 上帝在百姓中间的行动与临在
  choice: 在你们中间行走
  alternative: 住在你们中间
  rationale: “行走”保留原文动词的具体动态意象及其神学张力；“住”虽可传达临在，却会把原文的动作意象解释为定居。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“作你们的上帝／作我的子民”保留熟悉的盟约措辞；“行走”刻意保存希伯来文具体的临在意象。
