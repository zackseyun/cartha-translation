base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/026.yaml
  text: When I break your supply of bread[a], ten women will bake your bread in a single oven and return your bread by weight; and you will eat, but you will not be satisfied.
translation:
  language: zh_hans
  text: 我断绝你们的粮食供应[a]时，十个妇女要在一个炉子里烤你们的饼，按重量把饼交还给你们；你们会吃，却吃不饱。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“折断你们粮食的杖”；这是一个习语，指断绝赖以维生的粮食供应。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּשִׁבְרִי
  choice: 我断绝……时
  rationale: בְּ 加不定式构成时间从句。שׁבר 在这里比喻毁掉维持生活的来源；“断绝”比字面的“折断”更自然，并符合粮食匮乏的语境。
- source_word: מַטֵּה לֶחֶם
  choice: 粮食供应
  rationale: 该短语字面为“饼的杖”，是指赖以维生的粮食来源。“粮食供应”清楚传达习语含义，字面意象则保留在脚注中。
- source_word: עֶשֶׂר נָשִׁים
  choice: 十个女人
  rationale: 忠实保留希伯来文明确指出的数量和性别，呈现家庭烤饼场景。
- source_word: בְּתַנּוּר אֶחָד
  choice: 在一个炉子里
  rationale: 直译“一只炉子里”，强调粮食稀少，以致十户所需的饼可集中在一个炉中烤；现代汉语用“一个炉子”自然清楚。
- source_word: וְהֵשִׁיבוּ לַחְמְכֶם
  choice: 把饼交还给你们
  rationale: שׁוב 的使役式表示使之返回、送回。这里指烤好后将饼交回各家；“交还”比单纯“归还”更贴合分发场景。
- source_word: בַּמִּשְׁקָל
  choice: 按分量
  rationale: 字面为“按重量”，语境表示因匮乏而称量配给。“按分量”在现代汉语中自然，并传达限量分发之意。
- source_word: וַאֲכַלְתֶּם וְלֹא תִשְׂבָּעוּ
  choice: 你们吃了，却吃不饱
  rationale: שׂבע 在食物语境中指吃饱。“吃不饱”比抽象的“不满足”更准确自然；“却”体现结果与通常期待相反。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“粮食供应”解释原文习语，同时用脚注保留“饼的杖”这一具体意象；“炉子”“吃不饱”等措辞贴近日常语言，但不削弱审判语境的严肃性。
