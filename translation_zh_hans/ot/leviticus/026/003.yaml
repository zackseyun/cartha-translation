  text: אִם בְּ/חֻקֹּתַ֖/י תֵּלֵ֑כוּ וְ/אֶת מִצְוֺתַ֣/י תִּשְׁמְר֔וּ וַ/עֲשִׂיתֶ֖ם אֹתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/003.yaml
  text: If you walk in my statutes and keep my commandments and do them,[a]
translation:
  language: zh_hans
  text: 如果你们遵照我的律例而行，谨守我的诫命，并照着去行。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“行在我的律例中。”希伯来文直译为“在我的律例中行走”，这是盟约用语，指按照这些律例安排自己的生活。
    reason: 说明原文“行走”的字面意象及其在盟约语境中的惯用含义。
lexical_decisions:
- source_word: אִם
  choice: 如果
  rationale: 明确引出条件句，保留盟约陈述的条件性质；译作“当……时”会削弱这一点。
- source_word: בְּחֻקֹּתַי תֵּלֵכוּ
  choice: 遵照我的律例而行
  rationale: הלך本义为“行走”，与介词ב及“律例”连用时，表示按这些律例安排生活和行为。“遵照……而行”既保留“行”的意象，也自然传达其惯用含义。
- source_word: מִצְוֺתַי
  choice: 我的诫命
  rationale: “诫命”准确体现מִצְוָה的命令与律法语域，并与“律例”形成合宜的对应。
- source_word: תִּשְׁמְרוּ
  choice: 谨守
  rationale: שׁמר在律法语境中指留心遵守；“谨守”兼具认真看守和切实遵行之意，语言庄重而通顺。
- source_word: וַעֲשִׂיתֶם אֹתָם
  choice: 并且付诸实行
  rationale: 直译为“并且做它们”，所指是前面的诫命。“付诸实行”自然表达实际履行，保留经文对行动的强调。
theological_decisions:
- issue: 盟约语境中“行走”的惯用表达
  choice: 遵照我的律例而行
  alternative: 行在我的律例中；遵行我的律例
  rationale: 原文以“行走”描写整全的生活方式。“遵照……而行”没有把它缩减为一次性的服从，也避免“行在……中”在现代汉语中过于生硬，同时保留“行”的经文意象。
translation_notes:
  register: 采用现代、庄重且易懂的书面汉语。“律例—诫命—实行”保留原文的律法语域和从生活方向到实际行动的推进。
