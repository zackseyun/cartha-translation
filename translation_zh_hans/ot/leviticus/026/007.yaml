  text: You will pursue your enemies[a], and they will fall before you by the sword.
translation:
  language: zh_hans
  text: 你们必追赶仇敌；他们必在你们面前倒在刀下。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “倒在刀下”也可译作“倒在刀剑前”。原文此处的介词短语可按不同方式理解，可指死于刀剑，也可较字面地表达与刀剑相对而倒下。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּרְדַפְתֶּם
  choice: 你们必追赶
  rationale: רדף通常指“追赶、追击”。“追赶”保留军事语境，也符合现代汉语表达。
- source_word: אֹיְבֵיכֶם
  choice: 仇敌
  rationale: אֹיֵב是表示“敌人、仇敌”的常用名词；“仇敌”语体庄重，并准确体现第二人称复数所属关系。
- source_word: וְנָפְלוּ
  choice: 他们必……倒在
  rationale: נפל的基本义是“倒下”。在战斗语境中可暗示战败或死亡，但保留“倒下”的意象，不把隐含意义过度明说。
- source_word: לִפְנֵיכֶם
  choice: 在你们面前
  rationale: לִפְנֵי加人称后缀惯常表示“在……面前”；此译法自然并保留原文空间与胜败关系的表达。
- source_word: לֶחָרֶב
  choice: 在刀下
  rationale: 介词ל与חֶרֶב结合，在此可表达结果或方式。“倒在刀下”是自然的现代汉语军事表达，同时涵盖因刀剑而倒下或死亡的意思。
