  text: וְ/אִ֨ם בְּ/אֵ֔לֶּה לֹ֥א תִוָּסְר֖וּ לִ֑/י וַ/הֲלַכְתֶּ֥ם עִמִּ֖/י קֶֽרִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/023.yaml
  text: And if by these things you are not corrected by me[a], but walk contrary to me,
translation:
  language: zh_hans
  text: 如果你们受了这些惩治，仍不接受我的管教[a]，反而与我敌对，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“仍不因这些事受我的纠正”。
    reason: 原文 תִוָּסְרוּ לִי 的表达较为凝练，可侧重“受到纠正”，也可侧重“接受管教而改正”。
lexical_decisions:
- source_word: בְּאֵלֶּה
  choice: 受了这些惩治
  rationale: 介词 בְּ 在此很可能表示凭借或通过，指上文所述的灾罚；结合上下文译作“受了这些惩治”，既点明所指，也符合现代汉语。
- source_word: תִוָּסְרוּ לִי
  choice: 仍不接受我的管教
  rationale: יסר 的尼法勒形可表示受到管教、因管教而受纠正；这里重点不是惩治未曾临到，而是人没有因此受教改正。לִי 表明这种回应与耶和华有关，合译为“接受我的管教”自然且保留关系层面。
- source_word: וַהֲלַכְתֶּם
  choice: 反而……
  rationale: “行走”在此描述持续的行事态度；中文无需机械保留该隐喻。“反而”表达条件句中与前项相对的转折。
- source_word: עִמִּי קֶרִי
  choice: 与我敌对
  rationale: עִמִּי 字面为“与我”，קֶרִי 在本章反复指敌对、对抗的态度。译作“与我敌对”保留关系性的对抗，同时是自然清楚的现代汉语。
theological_decisions:
- issue: 如何表达 עִמִּי קֶרִי 所指的盟约关系中的对抗
  choice: 与我敌对
  alternative: 跟我作对；以敌对的态度与我同行
  rationale: 原文表达的不是一次孤立的过犯，而是持续以对抗态度面对耶和华。“与我敌对”简洁保留其关系性与张力，又不引入原文以外的神学范畴。
- issue: תִוָּסְרוּ 是指没有受罚，还是受罚后仍不受教
  choice: 受了惩治，仍不接受管教
  alternative: 不被我纠正；不受我的管教
  rationale: 上文已经列举临到百姓的惩治，因此本句更可能强调这些措施未使他们受教归正。译文将惩治的发生与受教的结果区分开，避免误读为管教并未实施。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“惩治”承接上文灾罚，“管教”突出其纠正目的；“与我敌对”保留原文关系性的对抗含义。句末逗号表明本节语意在下一节继续。
