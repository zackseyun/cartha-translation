  text: וְ/תַ֥ם לָ/רִ֖יק כֹּחֲ/כֶ֑ם וְ/לֹֽא תִתֵּ֤ן אַרְצְ/כֶם֙ אֶת יְבוּלָ֔/הּ וְ/עֵ֣ץ הָ/אָ֔רֶץ לֹ֥א יִתֵּ֖ן פִּרְיֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/020.yaml
  text: Your strength will be spent in vain[a], and your land will not yield its produce, and the trees of the land will not yield their fruit.
translation:
  language: zh_hans
  text: 你们的力量必白白耗尽[a]；你们的土地必不出产，地上的树木也不结果子。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你们的力量必耗费在虚空之中。”
    reason: 保留לָרִיק较为形式对应的译法，以及力量最终耗尽却毫无成果的意象。
lexical_decisions:
- source_word: וְתַם
  choice: 必……耗尽
  rationale: תמם在此表示力量被用尽、消耗殆尽；“耗尽”既贴近原文，又符合现代汉语表达。
- source_word: לָרִיק
  choice: 白白
  rationale: לריק表达徒劳、毫无成果之意；“白白”自然地传达付出力量却没有收成的语境。
- source_word: כֹּחֲכֶם
  choice: 你们的力量
  rationale: כח指力量或能力；在农耕劳作的语境中，“力量”准确而自然。
- source_word: אַרְצְכֶם
  choice: 你们的土地
  rationale: ארץ在此指以色列人耕种并赖以出产的土地；“土地”比“国家”更切合农业语境。
- source_word: תִתֵּן ... יְבוּלָהּ
  choice: 出土产
  rationale: 原文直译为“给出它的出产”；汉语用“土地出土产”简洁自然，并保留农业产出的广泛含义。
- source_word: וְעֵץ הָאָרֶץ
  choice: 地上的树木
  rationale: עץ虽为单数形式，在此具有集合意义；译作复数“树木”符合现代汉语习惯。
- source_word: לֹא יִתֵּן פִּרְיוֹ
  choice: 不结果子
  rationale: 原文直译为“不献出它的果子”；对于树木，汉语“结果子”最自然，并准确表达不产果实。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重且易懂的普通话。用两个并列分句呈现盟约咒诅逐步展开的结果；保留“必”的确定语气，并将希伯来语集合单数“树”自然译为“树木”。
