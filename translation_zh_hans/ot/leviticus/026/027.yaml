  text: וְ/אִ֨ם בְּ/זֹ֔את לֹ֥א תִשְׁמְע֖וּ לִ֑/י וַ/הֲלַכְתֶּ֥ם עִמִּ֖/י בְּ/קֶֽרִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/027.yaml
  text: But if in spite of this you will not listen to me[a], and you walk contrary to me[b],
translation:
  language: zh_hans
  text: 但如果你们尽管这一切[a]，仍不听从我，仍与我作对[b]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “尽管这一切”也可译作“虽是这样”或“尽管这些事”。
    reason: lexical_alternative
  - marker: b
    text: 原文近似“以敌对的方式与我同行”。这里的希伯来词含义较难确定；也可理解为“敌对我”或“与我相抗”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: 但如果
  rationale: 承接前文逐步加重的约的警告，既保留条件关系，也表达转折和递进。
- source_word: בְּזֹאת
  choice: 尽管这一切
  rationale: 这里回指此前的管教，语境赋予该短语让步含义；“这一切”自然涵盖前述诸事。
- source_word: לֹא תִשְׁמְעוּ לִי
  choice: 不听从我
  rationale: שׁמע与ל连用时，不仅指听见，也包含听取并顺从；“听从”同时保留听觉意象和顺服含义。
- source_word: וַהֲלַכְתֶּם
  choice: 反而……作对
  rationale: הלך在此表示持续的行为方式，并与后面的介词短语构成关系性的惯用表达；“反而”显出在管教之后仍持对立态度的递进。
- source_word: עִמִּי בְּקֶרִי
  choice: 与我作对
  rationale: 原文直译近似“以קֶרִי与我同行”；קֶרִי词义较难确定，在本章反复出现，语境指敌对、相抗的行事态度。“与我作对”在现代汉语中自然，并保留关系性的对立。
theological_decisions:
- issue: 利未记26章中“行走”与קֶרִי构成的约之警告惯用语
  choice: 译作“与我作对”，保留人与上帝之间关系性的对立
  alternative: 行事敌对我；顽梗地违背我；与我相抗而行
  rationale: 本句不只是陈述未能遵命，也描写在约的关系中采取对立态度。“与我作对”避免把含义缩减为一般的不顺服，同时不把词义过度限定为某一种心理状态。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“听从”兼顾听见与顺服；“与我作对”比生硬直译“与我相反而行”更易懂。句末保留逗号，以衔接下一节继续展开的条件结果。
