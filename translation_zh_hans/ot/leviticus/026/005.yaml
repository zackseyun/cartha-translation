  naturalness: “你们打粮食要一直打到收葡萄的时候，收葡萄又要一直收到播种的时候”重复“打/收”，稍显口语和滞重。改用“打谷要延续到……；葡萄收获又要延续到……”更自然、庄重，也保留平行。
  terminology: דַּיִשׁ宜译“打谷”（或“脱粒”），比“打粮食”更准确。בָּצִיר译“葡萄收获”可清楚表达收获期及农事活动。לַחְמְכֶם在此可译“自己的粮食”；“吃得饱足”准确对应“吃你们的粮食至饱足”。
