base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/005.yaml
  text: Your threshing will last for you until the grape harvest, and the grape harvest will last until sowing; and you will eat your bread to the full and live securely in your land.
translation:
  language: zh_hans
  text: 你们的打谷要延续到葡萄收获时；葡萄收获又要延续到播种时。你们要吃自己的粮食，吃得饱足，并安然住在自己的土地上。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דַּיִשׁ
  choice: 打粮食
  rationale: 指脱粒、打谷这一收获环节；“打粮食”在现代汉语中自然易懂，也保留了原文以农事活动为主语的画面。
- source_word: הִשִּׂיג / יַשִּׂיג
  choice: 一直……到
  rationale: 该动词本义为“赶上、达到”。这里描写一季农事延续到下一季，译作“一直……到”准确表达丰产使农事相接不断的含义。
- source_word: בָּצִיר
  choice: 收葡萄
  rationale: 指葡萄收获期；译作“收葡萄”比抽象的“葡萄收成”更能与前后农事活动平行。
- source_word: לַחְמְכֶם
  choice: 自己的粮食
  rationale: לֶחֶם可指饼，也可泛指主食或食物；在本节丰收语境中，“粮食”自然表达赖以为生的食物，并体现第二人称复数所属后缀。
- source_word: לָבֶטַח
  choice: 安然
  rationale: 表达安全、无惧和有保障的状态；“安然居住”简洁而庄重。
theological_decisions:
- issue: 土地祝福中丰产与安全的关系
  choice: 按原文并列呈现粮食充足与在土地上安然居住
  alternative: 将安全扩展解释为特定政治、军事或末世性应许
  rationale: 本节本身只陈述吃得饱足并安然居住，不宜加入原文未明说的神学体系或应验方式。
translation_notes:
  register: 采用现代、庄重且便于普通读者理解的表达。以“一直……到……又一直……到……”再现原文两次“达到/赶上”的平行结构和农事季节接续不断的丰收景象。
