  text: וְ/הָ/אָרֶץ֩ תֵּעָזֵ֨ב מֵ/הֶ֜ם וְ/תִ֣רֶץ אֶת שַׁבְּתֹתֶ֗י/הָ בָּ/הְשַׁמָּ/ה֙ מֵ/הֶ֔ם וְ/הֵ֖ם יִרְצ֣וּ אֶת עֲוֺנָ֑/ם יַ֣עַן וּ/בְ/יַ֔עַן בְּ/מִשְׁפָּטַ֣/י מָאָ֔סוּ וְ/אֶת חֻקֹּתַ֖/י גָּעֲלָ֥ה נַפְשָֽׁ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/043.yaml
  text: But the land will be abandoned by them and will enjoy its Sabbaths while it lies desolate without them[a], and they will accept the punishment for their iniquity, because—indeed, because—they rejected my judgments and their soul abhorred my statutes.
translation:
  language: zh_hans
  text: 那地必被他们撇下；当他们不在那地、那地荒凉时，土地要享受自己的安息年；他们也必承受自己罪孽的刑罚[a]，因为——的确是因为——他们厌弃我的典章，心里憎恶我的律例。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“承担自己的罪孽”，也可理解为“为自己的罪孽作补偿”。这个希伯来语表达可以有不止一种理解；这里按盟约刑罚的上下文译出其司法含义。
    reason: 说明希伯来惯用语在罪孽、罪责后果和补偿含义之间的真实歧义。
lexical_decisions:
- source_word: תֵּעָזֵב מֵהֶם
  choice: 必被他们撇下
  rationale: 保留尼法勒式的被动含义，以“地”为主语；“被他们撇下”在现代汉语中自然地表达居民离开土地。
- source_word: וְתִרֶץ אֶת שַׁבְּתֹתֶיהָ
  choice: 就要享受它的安息年
  rationale: 此处 רצה 表示土地得到或享受先前未得的安息；“安息年”说明这里是土地的安息期，同时保留“安息”的盟约用语。
- source_word: בָּהְשַׁמָּה מֵהֶם
  choice: 他们不在那里、地一片荒凉的时候
  rationale: 同时表达百姓不在当地以及土地荒凉的状态，避免误解为百姓造成荒凉的方式。
- source_word: יִרְצוּ אֶת עֲוֺנָם
  choice: 必承受自己罪孽的刑罚
  rationale: 在盟约咒诅、流亡和土地补享安息的司法语境中，עון 可兼指罪孽及其后果；此译突出承受应得刑罚，同时以脚注保留原文惯用语的其他可能理解。
- source_word: יַעַן וּבְיַעַן
  choice: 这正是因为——的确是因为——
  rationale: 用重复和破折号再现希伯来文双重因果表达的强调语气。
- source_word: בְּמִשְׁפָּטַי
  choice: 我的典章
  rationale: “典章”适合盟约法律语境，并与下文的“律例”保持词汇区分。
- source_word: חֻקֹּתַי
  choice: 我的律例
  rationale: 采用清楚而庄重的法律用语，对应规定、法令之意，并区别于 מִשְׁפָּטַי。
- source_word: גָּעֲלָה נַפְשָׁם
  choice: 心里憎恶
  rationale: נפש 在此指人的内在生命或意愿；现代汉语用“心里”比直译“他们的魂”自然，同时保留内在厌恶的力度。
theological_decisions:
- issue: יִרְצוּ אֶת עֲוֺנָם 中 עון 的含义
  choice: 按司法含义译为“承受自己罪孽的刑罚”
  alternative: “承担自己的罪孽”或“为自己的罪孽作补偿”
  rationale: 上下文是盟约刑罚、流亡和土地补享安息，因此罪责所招致的刑罚是主要含义。不过，希伯来惯用语容许把重点理解为承担罪孽本身或作出补偿，故不应隐藏其歧义，并以脚注交代。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“安息年”“典章”“律例”保留利未记的盟约和法律语域；强调性重复用破折号呈现。脚注标记[a]已置于相关短语之后。
