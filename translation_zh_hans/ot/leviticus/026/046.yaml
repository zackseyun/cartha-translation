base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/046.yaml
  text: These are the statutes and the judgments and the laws that Yahweh gave between himself and the sons of Israel at Mount Sinai by the hand of Moses[a][b].
translation:
  language: zh_hans
  text: 这些是雅威在自己与以色列子孙[a]之间、在西奈山借摩西之手[b]所赐的律例、典章和法度。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“以色列人”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译“借摩西的手”，这是表示“通过摩西”的惯用语。
    reason: cultural_note
lexical_decisions:
- source_word: אֵלֶּה
  choice: 这些是
  rationale: 以自然的现代汉语引出本节对前述盟约法规的总结。
- source_word: הַחֻקִּים
  choice: 律例
  rationale: 表达固定颁定的规条，并保持庄重的法律语域。
- source_word: הַמִּשְׁפָּטִים
  choice: 典章
  rationale: 在此法律词组三联结构中，表示具有权威的司法规定或条例。
- source_word: הַתּוֹרֹת
  choice: 法度
  rationale: 复数形式在此指多项权威性的律法教导；“法度”既符合上下文的法律语域，也与“律例、典章”构成自然的并列。
- source_word: אֲשֶׁר נָתַן
  choice: 所赐的
  rationale: 直接保留 נָתַן“赐、给”的基本意义，不将其释义为“设立”。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见音译呈现神的盟约之名，而不以称号替代。
- source_word: בֵּינוֹ וּבֵין בְּנֵי יִשְׂרָאֵל
  choice: 在他自己与以色列子孙之间
  rationale: 保留“在……之间”的关系结构，并直接反映“以色列之子”这一族群称谓。
- source_word: בְּהַר סִינַי
  choice: 在西奈山
  rationale: 自然、准确地表达颁赐这些法规的地点。
- source_word: בְּיַד מֹשֶׁה
  choice: 借摩西之手
  rationale: 保留希伯来语的具体意象，同时汉语读者也能理解其媒介含义；脚注说明其惯用意义。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；采用“雅威”以呈现其名称性质，而不以“主”等称号替代。
- issue: בְּנֵי יִשְׂרָאֵל 的译法
  choice: 以色列子孙
  alternative: 以色列人
  rationale: 正文保留希伯来语族群称谓的字面形式，同时以脚注提供更惯用的现代汉语表达。
- issue: בֵּינוֹ וּבֵין 的关系表达
  choice: 在他自己与……之间
  alternative: 为他自己和……
  rationale: 保留原文“在双方之间”的措辞及其关系张力，不在正文中额外加入“立约”等解释性词语。
translation_notes:
  register: 采用现代、庄重而易懂的法律—盟约语体。“律例、典章和法度”保留原文三个近义法律术语的并列，不将其合并；句法尽量贴近原文次序，同时保持现代汉语可读性。
