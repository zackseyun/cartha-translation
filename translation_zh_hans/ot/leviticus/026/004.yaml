base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/004.yaml
  text: then I will give you your rains in their season[a], and the land will yield its produce[b], and the tree of the field will give their fruit.
translation:
  language: zh_hans
  text: 我就必按时给你们降雨[a]，土地必出产作物，田野的树木[b]也必结出果实。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“在它们的时节”；也可译“在适当的时候”或“按季节”。
    reason: lexical_alternative
  - marker: b
    text: “树木”在希伯来文中是单数形式，这里具有集合意义。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי
  choice: 我就必……给
  rationale: נתן的基本义是“给”。“必”表达未完成式在应许语境中的将来意义，“就”承接前文的条件与结果关系，却不扩展其神学含义。
- source_word: גִשְׁמֵיכֶם
  choice: 给你们降雨
  rationale: 原文为带第二人称复数后缀的复数“你们的雨”。现代汉语不自然地说“你们的诸雨”，故译为“给你们降雨”，保留雨是赐给以色列民的含义。
- source_word: בְּעִתָּם
  choice: 按时
  rationale: 指雨水在适宜的时节来到；“按时”简洁自然，并由脚注保留“在它们的时节”这一较贴近形式的译法。
- source_word: וְנָתְנָה הָאָרֶץ
  choice: 土地必出产
  rationale: 原文直译为“土地必给出”。汉语谈土地的收成通常用“出产”，既自然又准确。
- source_word: יְבוּלָהּ
  choice: 作物
  rationale: יְבוּל指土地所出的农产或收成。“作物”适合本节具体的农业语境，同时避免缩窄为某一种庄稼。
- source_word: וְעֵץ הַשָּׂדֶה
  choice: 田野的树木
  rationale: 希伯来文采用单数形式，但具有集合意义。中文以复数概念“树木”表达最自然，并以脚注说明原文形式。
- source_word: יִתֵּן פִּרְיוֹ
  choice: 必结出果实
  rationale: 原文沿用נתן，直译为“给出它的果实”。中文对树木通常说“结出果实”，在不改变意义的前提下采用自然表达。
theological_decisions:
- issue: 顺服之约中与农业有关的赐福
  choice: 直接译为上帝赐下合时雨水，并使土地和树木出产
  alternative: 将其泛化为任何时代都保证物质富足，或把农业赐福完全灵意化
  rationale: 本节在利未记之约的赐福语境中，直接谈雨水、土地出产和树木结果。译文保留具体的农业意义，不加入后来的教义应用。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。句式保留三项并列的应许；“降雨—土地出产—树木结果”清楚呈现农业语境。避免生硬复制希伯来语的复数“雨”和单数集合名词，同时用脚注保留相关形式信息。
