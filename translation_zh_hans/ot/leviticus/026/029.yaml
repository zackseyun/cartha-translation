  text: וַ/אֲכַלְתֶּ֖ם בְּשַׂ֣ר בְּנֵי/כֶ֑ם וּ/בְשַׂ֥ר בְּנֹתֵי/כֶ֖ם תֹּאכֵֽלוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/029.yaml
  text: And you will eat the flesh of your sons, and you will eat the flesh of your daughters.
translation:
  language: zh_hans
  text: 你们要吃自己儿子的肉，也要吃自己女儿的肉。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַאֲכַלְתֶּם
  choice: 你们要吃
  rationale: 该词为 אכל 的 Qal 第二人称阳性复数形式，带连接词 וַ；在盟约咒诅的连续宣告中，用“要吃”自然表达必将发生的审判后果，句间承接关系可由上下文体现。
- source_word: בְּשַׂר
  choice: 肉
  rationale: בָּשָׂר 在此指身体的肉；现代汉语用“肉”直接而不委婉，能保留食人惨状的强烈冲击。“血肉”会增加原文没有的“血”，“身体”则会削弱具体含义。
- source_word: בְּנֵיכֶם
  choice: 自己儿子的
  rationale: 原文明确为“你们的儿子”，且下句另提女儿，不宜泛化为“儿女”或“孩子”；加入“自己”是自然汉语表达，用来清楚体现所属关系和惨烈反差。
- source_word: וּבְשַׂר
  choice: 也要……的肉
  rationale: 保留第二次出现的“肉”和并列连接关系，以再现希伯来文的平行结构与反复强调。
- source_word: בְּנֹתֵיכֶם
  choice: 自己女儿的
  rationale: 直接保留原文“你们的女儿”，与“儿子”构成明确的男女对应；“自己”使现代汉语中的所属关系更自然、醒目。
- source_word: תֹּאכֵלוּ
  choice: 要吃
  rationale: 原文在第二分句重复有限动词，因此译文也重复“要吃”，不省略，以保留警告的节奏和强调。
theological_decisions:
- issue: 如何表达盟约咒诅中食子的警告
  choice: 按直接、预告性的审判陈述翻译：“你们要吃自己儿子的肉，也要吃自己女儿的肉。”
  alternative: 采用弱化或委婉的说法，如仅说“你们将吞吃自己的儿女”
  rationale: 原文明确重复“肉”和“吃”，描述围困等极端审判后果中的食人行为。直译能保留其可怖程度，又不额外说明成因、责任或神学机制，从而避免超出本节。
translation_notes:
  register: 采用庄重而通俗的现代标准汉语。“要”在审判宣告语境中表达确定将临的后果；保留“儿子／女儿”和两次“肉／吃”的平行结构。未设置脚注，因为原文在本节没有需要另行标示的文本异读或不可兼顾的歧义。
