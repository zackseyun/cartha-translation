base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/013.yaml
  text: I am Yahweh your God[a], who brought you out of the land of Egypt, from being their slaves[c][b]; I broke the bars of your yoke and made you walk upright.
translation:
  language: zh_hans
  text: 我是耶和华——你们的上帝；我把你们从埃及地领出来，使你们不再作埃及人的奴隶。我折断了你们轭上的横木[a]，使你们挺身而行[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“你们的轭杆”。
    reason: מֹטֹת可指构成轭具的横木或杆件，中文可有不同的具体称法。
  - marker: b
    text: 或译“使你们昂首而行”。
    reason: קוֹמְמִיּוּת表示直立、昂然的姿态，也隐含摆脱奴役后尊严恢复的意味。
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文通行的专名“耶和华”译出以色列上帝的圣名，不以“主”这一称号替代。
- source_word: אֱלֹהֵיכֶם
  choice: 你们的上帝
  rationale: 在“耶和华你们的上帝”这一盟约宣告中，该形式明确指独一的上帝；“上帝”庄重而为现代读者普遍理解。
- source_word: הוֹצֵאתִי אֶתְכֶם מֵאֶרֶץ מִצְרַיִם
  choice: 我把你们从埃及地领出来
  rationale: 保留使役动词“使出来”的出埃及意象；中文用“把……领出来”自然表达上帝主动施行拯救。
- source_word: מִהְיֹת לָהֶם עֲבָדִים
  choice: 使你们不再作他们的奴隶
  rationale: 该结构表示脱离作奴隶的状态；“奴隶”准确呈现受奴役的身份，不弱化为一般的“仆人”。“不再”在中文中清楚表达介词短语所指的脱离。
- source_word: מֹטֹת עֻלְּכֶם
  choice: 你们轭上的横木
  rationale: מֹטֹת指轭具的横木或轭杆；译文保留具体的轭之意象，同时让现代中文读者可理解。
- source_word: וָאוֹלֵךְ אֶתְכֶם קוֹמְמִיּוּת
  choice: 使你们挺身而行
  rationale: 保留הלך使役形的“使……行走”以及קוֹמְמִיּוּת所表达的直立姿态；“挺身而行”同时传达身体不再屈伏与尊严得恢复的意味。
theological_decisions:
- issue: 以色列人在埃及的身份
  choice: 奴隶
  alternative: 仆人
  rationale: 上下文强调从埃及的强制奴役中获释；“奴隶”保留经文中受辖制的社会身份和拯救力度。
- issue: 结尾的解放意象
  choice: 使你们挺身而行
  alternative: 使你们昂首而行／领你们直立行走
  rationale: 原文兼具使役性的行走动作与直立、昂然的姿态。正文避免只取道德意义或仅作心理化解释，保留身体姿态和恢复尊严两方面的张力。
- issue: 轭之横木的比喻
  choice: 按具体轭具译作“横木”
  alternative: 轭杆／轭的束缚
  rationale: 具体译法保存奴役之轭被折断的形象，不把隐喻抽象化为一般的“束缚”。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“领出来”“奴隶”“轭上的横木”保留出埃及与解除奴役的具体图像；“挺身而行”简洁呈现原文少见词语所包含的直立姿态和尊严感。
