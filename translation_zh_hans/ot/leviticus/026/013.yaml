  terminology: “耶和华”“上帝”“奴隶”“轭”“横木”使用恰当；“挺身而行”有效保留了直立、不再屈服的具体姿态。脚注a原有“轭上的轭杆”表述略显重复，改为“你们的轭杆”更自然。
