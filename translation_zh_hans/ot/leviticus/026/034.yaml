  text: אָז֩ תִּרְצֶ֨ה הָ/אָ֜רֶץ אֶת שַׁבְּתֹתֶ֗י/הָ כֹּ֚ל יְמֵ֣י הֳשַׁמָּ֔/ה וְ/אַתֶּ֖ם בְּ/אֶ֣רֶץ אֹיְבֵי/כֶ֑ם אָ֚ז תִּשְׁבַּ֣ת הָ/אָ֔רֶץ וְ/הִרְצָ֖ת אֶת שַׁבְּתֹתֶֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/034.yaml
  text: Then the land will enjoy its Sabbaths all the days of its desolation[a], while you are in the land of your enemies; then the land will rest and enjoy its Sabbaths.
translation:
  language: zh_hans
  text: 那时，在它荒凉的一切日子里，当你们在仇敌的土地上时，土地必得享它的安息年[a]；那时，土地必安息，得享它的安息年。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“补足它的安息年”或“为它的安息年得到补偿”。这里的希伯来语动词含有得到先前未能享有之份的意思。
    reason: 说明 רצה 在本语境中兼有享有安息与补足先前未得安息的词义张力。
lexical_decisions:
- source_word: אָז
  choice: 那时
  rationale: 表示前述审判所带来的后果；“那时”自然地保留了时间和结果意味。
- source_word: תִּרְצֶה / וְהִרְצָת
  choice: 必得享／得享
  rationale: 这里的 רצה 表示土地终于得到先前未获准享有的安息，含有得到所当得之份、补足亏欠的意味。“得享”适合以土地为主语，也保留经文的拟人表达；两处采用相同译法，以呈现原文词根的重复。
- source_word: הָאָרֶץ
  choice: 土地
  rationale: 本处指以色列所居住并耕种的约地，而不是全世界；“土地”也能自然地与荒凉、安息相连。
- source_word: אֶת שַׁבְּתֹתֶיהָ
  choice: 它的安息年
  rationale: 结合利未记二十五至二十六章的语境，复数“安息”主要指土地应守的各个安息年。汉语以“安息年”明确表达其土地制度背景。
- source_word: כֹּל יְמֵי הֳשַׁמָּה
  choice: 在荒凉的所有日子
  rationale: 保留“所有日子”的完整时段含义，并表明土地持续处于荒凉状态。
- source_word: וְאַתֶּם בְּאֶרֶץ אֹיְבֵיכֶם
  choice: 就是你们住在仇敌之地的时候
  rationale: 该分句说明土地荒凉发生于百姓身处敌国期间；补出“住”和“时候”，使原文的处境关系在现代汉语中清楚自然。
- source_word: תִּשְׁבַּת
  choice: 必安息
  rationale: 动词 שבת 在此既有停止耕作的意思，也呼应安息制度；“安息”保留这一词语关联。
theological_decisions:
- issue: 土地与未守安息年之间的关系
  choice: 土地在百姓流亡期间得享先前未能享有的安息年
  alternative: 土地补足它的安息年／为它的安息年得到补偿
  rationale: 上下文带有审判和补偿亏欠的意味，但 רצה 的表达不宜被缩减为单纯的财务偿还。“得享”保留土地接受其当得安息的拟人图像，并用脚注说明其补足意味。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“得享”略带经文体色彩，但普通读者容易理解；重复“那时”“土地”“得享它的安息年”，以保留原文强调和结构对应。
