id: LEV.26.44
reference: Leviticus 26:44
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/אַף גַּם זֹ֠את בִּֽ/הְיוֹתָ֞/ם בְּ/אֶ֣רֶץ אֹֽיְבֵי/הֶ֗ם לֹֽא מְאַסְתִּ֤י/ם וְ/לֹֽא גְעַלְתִּי/ם֙ לְ/כַלֹּתָ֔/ם לְ/הָפֵ֥ר בְּרִיתִ֖/י אִתָּ֑/ם כִּ֛י אֲנִ֥י יְהוָ֖ה אֱלֹהֵי/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/044.yaml
  text: Yet even then[a], when they are in the land of their enemies, I will not reject them, and I will not abhor them so as to destroy them, to break my covenant with them[c][b]; for I am Yahweh their God.
translation:
  language: zh_hans
  text: 然而，即使他们身在仇敌之地，我也不会厌弃他们，也不会憎恶他们，以致将他们灭尽[a]，废掉我与他们所立的约；因为我是耶和华[b]——他们的上帝。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “灭尽”也可译作“彻底消灭”或“使他们完全灭亡”。
    reason: lexical_alternative
  - marker: b
    text: “耶和华”对应希伯来文神名 YHWH；也常音译作“雅威”。
    reason: alternative_reading
lexical_decisions:
- source_word: וְאַף גַּם זֹאת
  choice: 然而，即使
  rationale: 这一叠加强调结构带有让步和转折意味；结合前文的刑罚与流亡，“然而，即使”自然地表达“尽管如此”。
- source_word: בִּהְיוֹתָם בְּאֶרֶץ אֹיְבֵיהֶם
  choice: 他们身在仇敌之地
  rationale: ב 加不定式结构表示时间或处境；“身在”简洁、自然，并保留他们处于敌国境内的含义。
- source_word: לֹא מְאַסְתִּים
  choice: 我也不会厌弃他们
  rationale: מָאַס 表示拒绝、弃绝或厌弃；“厌弃”兼顾拒斥与嫌恶色彩，也与下一个更强烈的动词形成递进。
- source_word: וְלֹא גְעַלְתִּים
  choice: 也不会憎恶他们
  rationale: גָּעַל 表示憎恶、厌恶；“憎恶”保留其强烈情感色彩，同时避免与前一动词完全同义。
- source_word: לְכַלֹּתָם
  choice: 以致将他们灭尽
  rationale: ל 不定式可表达结果或目的；“以致”保留与前述厌弃、憎恶之间的逻辑关系，“灭尽”准确表达彻底消灭、耗尽之意。
- source_word: לְהָפֵר בְּרִיתִי אִתָּם
  choice: 废掉我与他们所立的约
  rationale: הֵפֵר 在约的语境中指破坏、废除或使之失效；“废掉”清楚表达使约失效，而“所立的约”符合现代汉语习惯。
- source_word: כִּי אֲנִי יְהוָה אֱלֹהֵיהֶם
  choice: 因为我是耶和华——他们的上帝
  rationale: כִּי 引出理由；以传统且通行的中文形式“耶和华”音译神名 YHWH，破折号使“他们的上帝”作为同位说明清晰自然。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文明确使用四字神名。正文采用现代中文圣经读者最熟悉的专名“耶和华”，并以脚注说明其对应希伯来文 YHWH，不用“主”替代专名。
- issue: 完成式动词 מְאַסְתִּים 与 גְעַלְתִּים 的时态
  choice: 不会厌弃……不会憎恶
  alternative: 没有厌弃……没有憎恶
  rationale: 希伯来语完成式本身不机械对应现代语言时态；本段预告以色列将处于仇敌之地，并陈明上帝在该处境中的持续立场，因此用将来取向的“不会”表达应许语气，同时不把它解释成只限于单一时点。
- issue: לְכַלֹּתָם 与 לְהָפֵר 的关系
  choice: 两个不定式依次说明彻底弃绝的结果：灭尽他们、废掉圣约
  alternative: 只将“灭尽他们”连于“憎恶”，再把“废约”作为独立目的
  rationale: 原文连续使用两个 ל 不定式，句法关系可有细微歧义。译文保留并列推进，不额外断定二者严格的层级关系。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“身在仇敌之地”比直译“在他们仇敌的地上”更顺畅；保留“厌弃／憎恶”的递进与“灭尽／废约”的双重后果。所有脚注标记均置于正文对应位置。
