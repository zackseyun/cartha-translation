base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/039.yaml
  text: And those of you who remain will waste away in the lands of your enemies because of their iniquity[b][a]; and also because of the iniquities of their fathers with them they will waste away.
translation:
  language: zh_hans
  text: 你们中剩下的人，必因自己的罪孽，在仇敌的各地逐渐衰残[a]；也必因他们祖辈的罪孽仍伴随着他们，而逐渐衰残[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“渐渐朽坏”、“逐渐消瘦”；希伯来语动词含有在审判之下逐渐消损、腐朽的意思。
    reason: lexical_alternative
  - marker: b
    text: “仍伴随着他们”对应原文简短的“与他们”；这可能表示祖辈的罪孽仍伴随他们，也可能表示他们连同仍在影响他们的祖辈罪孽一同衰残。
    reason: alternative_reading
lexical_decisions:
- source_word: וְהַנִּשְׁאָרִים בָּכֶם
  choice: 你们中剩下的人
  rationale: 保留分词“剩下的”及בכם所表达的“在你们中”之意，也自然体现审判后余民的语境。
- source_word: יִמַּקּוּ
  choice: 日渐衰败
  rationale: מקק的尼法勒形态表示逐渐消损、腐朽或衰残；“日渐衰败”在现代汉语中庄重自然，并保留持续消耗的意味。
- source_word: בַּעֲוֺנָם
  choice: 因自己的罪孽
  rationale: עָוֹן兼有罪恶、罪责及其后果的语义；此处介词ב可作原因理解。“因自己的罪孽”清楚表达审判的关联，同时不把词义缩窄为单纯后果。
- source_word: בְּאַרְצֹת אֹיְבֵיכֶם
  choice: 在仇敌之地
  rationale: 希伯来文“诸地”为复数，但汉语集合性表达“仇敌之地”更自然，仍可涵盖多个敌国疆域。
- source_word: וְאַף
  choice: 也
  rationale: 表达递进兼添加的关系，简洁自然；上下文已足以传达“甚至、并且”的加强意味。
- source_word: בַּעֲוֺנֹת אֲבֹתָם
  choice: 因他们祖辈的罪孽
  rationale: 保留复数“罪孽”。אבות在此指先辈；“祖辈”比现代汉语的“父亲们”更准确自然，又不预先解释代际责任的性质。
- source_word: אִתָּם
  choice: 与他们同在
  rationale: 按原文保留简短而含混的关系表达，不武断判定是祖辈罪孽仍伴随他们，还是他们与祖辈罪孽一同衰败。
theological_decisions:
- issue: 个人罪孽与祖辈罪孽所带来的代际审判
  choice: 同时陈述他们因自己的罪孽，也因祖辈的罪孽而衰败，并保留“与他们同在”的歧义。
  alternative: 将后半句解释为仅承受祖辈犯罪的后果，或解释为他们重犯祖辈同样的罪。
  rationale: 原文明确并列两者，却没有解释个人罪责、群体连带和历史后果之间的具体关系；译文不应替原文消解这一神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“日渐衰败”两次重复，以对应原文首尾重复的动词；脚注标记均置于相关正文之后。
