  source_fidelity: 译文准确表达余民在仇敌之地因自身罪孽而逐渐衰亡，并保留祖辈罪孽与其命运相关的陈述。惟后半句“因他们祖辈的罪孽与他们同在”句法上易被读作“罪孽同在”是原因，却没有清楚承接原文最后的“他们必消损”；宜以“仍伴随着他们”明确其修饰关系，同时保留原文所容许的解释空间。将“仇敌之地”调整为“仇敌的各地”，以较明确反映希伯来语复数。
  naturalness: “日渐衰败”用于人虽可理解，但较常用于国家、事业或势力；“逐渐衰残”更贴合人在审判下耗尽、衰亡的语境，也适合两次重复。修订后的后半句层次清晰、庄重自然。
  terminology: “罪孽”适切对应עון，并保留道德罪责及其所致后果的宽度。“祖辈”是现代汉语中自然的统称；不应将其释义为单纯后果或重复其祖辈所犯的罪。
