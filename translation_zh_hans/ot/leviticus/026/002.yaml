  text: אֶת שַׁבְּתֹתַ֣/י תִּשְׁמֹ֔רוּ וּ/מִקְדָּשִׁ֖/י תִּירָ֑אוּ אֲנִ֖י יְהוָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/002.yaml
  text: You shall keep my Sabbaths and revere my sanctuary[a]; I am Yahweh.
translation:
  language: zh_hans
  text: 你们要谨守我的安息日，敬畏我的圣所[a]。我是雅威。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“惧怕我的圣所”，或“对我的圣所肃然起敬”。希伯来语动词可按语境表示惧怕、敬畏或因威严而生畏。
    reason: 保留 תִּירָאוּ 的词义范围，避免把神圣畏惧、尊崇和肃然起敬之间的张力单一化。
lexical_decisions:
- source_word: שַׁבְּתֹתַי
  choice: 我的安息日
  rationale: 原文为复数并带第一人称单数后缀，指属于雅威、应当遵守的各安息日。现代汉语通常不必用生硬的“各安息日”来明示复数；“我的安息日”可自然涵盖这一整套安息日制度。
- source_word: תִּשְׁמֹרוּ
  choice: 谨守
  rationale: שׁמר在诫命语境中兼有遵守、看守和留心实行之意。“谨守”既简洁自然，也保留了认真遵行的力度。
- source_word: וּמִקְדָּשִׁי
  choice: 我的圣所
  rationale: מִקְדָּשׁ指分别为圣之处，即神的圣所；“圣所”是现代汉语宗教语境中准确而通行的对应词。
- source_word: תִּירָאוּ
  choice: 敬畏
  rationale: ירא可表达惧怕、敬畏或因威严而肃然起敬。这里的对象是雅威的圣所，“敬畏”能自然表达神圣敬重，同时不抹去原词所含的畏惧与威严感；脚注说明其语义幅度。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以音译“雅威”呈现四字神名，保留原文中神亲自启示的立约之名，而不以称号代替。
- source_word: אֲנִי יְהוָה
  choice: 我是雅威
  rationale: 保留原文简洁有力的自我宣告，以说话者的身份和权柄作为两项命令的根据。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用神的专名。音译“雅威”较能保留其专名性质，避免用称号替代，也不把传统的另一种拟音当作原始读音。
- issue: 对圣所所用 ירא 的语气
  choice: 敬畏
  alternative: 惧怕；对……肃然起敬
  rationale: 此处既涉及圣所应受的神圣尊重，也保留面对神圣临在时的畏惧和威严感。“敬畏”不将其弱化为一般性的尊重，脚注则保存其他可能表达。
- issue: “安息日”复数的表达
  choice: 我的安息日
  alternative: 我的各安息日
  rationale: 希伯来文复数可指全套安息日时序，不一定只强调多个日期。汉语名词通常无需形态标示复数，因此采用自然表达，同时不把范围限定为单一的一天。
translation_notes:
  register: 采用现代、庄重而易懂的诫命语体。“谨守”体现立约命令的严肃性；“敬畏”保持宗教语境中的自然表达。句末“我是雅威”保留原文权威而简洁的自我宣告。
