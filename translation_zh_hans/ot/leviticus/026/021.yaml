base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/021.yaml
  text: And if you walk contrary to me and are not willing to listen to me[b][a], then I will continue to strike you sevenfold according to your sins.
translation:
  language: zh_hans
  text: 如果你们与我作对[a]，不肯听从我，我必照着你们的罪，再把七倍的击打加在你们身上[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“以敌意对待我”或“与我对抗”。“与我以 קֶרִי 而行”是一个难解的希伯来语表达；在本章中，它指向对抗的态度，而不只是偶然行事。
    reason: lexical_alternative
  - marker: b
    text: 较直译：“我必照着你们的罪，加添击打你们七次。”
    reason: alternative_reading
lexical_decisions:
- source_word: קֶרִי
  choice: 作对
  rationale: 该词在本章反复用于“与我……而行”的结构，表达敌对、对抗的态度。“作对”在现代汉语中自然清楚，又不把词义限定为公开敌意；“偶然”虽是学界讨论过的可能义，但不合本章逐步加重盟约惩罚的语境。
- source_word: תֵּלְכוּ עִמִּי קֶרִי
  choice: 与我作对
  rationale: 希伯来语以“行走”比喻人的行事为人。汉语若直译为“与我作对而行”较生硬，因此用“与我作对”传达其行为和立场上的持续对抗。
- source_word: תֹאבוּ
  choice: 不肯
  rationale: 该动词强调意愿，表示并非没有听见，而是不愿接受；“不肯”简洁地保留了顽梗和拒绝的意味。
- source_word: לִשְׁמֹעַ לִי
  choice: 听从我
  rationale: שׁמע 基本义为听，在盟约语境中也含有听而顺从的意味。“听从我”兼顾聆听与服从，不必把含义缩减为单纯听见。
- source_word: וְיָסַפְתִּי
  choice: 再
  rationale: 该词本义为“增添”。这里承接前文逐步加重的惩罚，“再”自然表达在已有审判之上继续加添。
- source_word: מַכָּה
  choice: 灾祸击打
  rationale: 该名词可指打击、创伤或灾害。译为“灾祸击打”既保留神主动击打的惩罚性，也避免把它过窄地限定为瘟疫。
- source_word: שֶׁבַע
  choice: 七倍
  rationale: 本章惩罚公式中的“七”具有倍加强度的副词性用法；“七倍”是自然且贴近上下文的汉语表达。
- source_word: כְּחַטֹּאתֵיכֶם
  choice: 照着你们的罪
  rationale: 介词 כְּ 表达对应或相称关系。“照着你们的罪”保留惩罚与罪相应的意味，比单译“因为你们的罪”更贴近原文。
theological_decisions:
- issue: 盟约惩罚公式的性质
  choice: 译为神照着百姓的罪加重七倍击打，但不限定灾祸的具体形式。
  alternative: 将 מַכָּה 特指为“瘟疫”，或将 כְּחַטֹּאתֵיכֶם 仅译为“因为你们的罪”。
  rationale: 本节处于利未记26章盟约制裁逐步升级的段落。译文应保留审判加重及其与罪相应的张力，却不应把宽泛的“击打、灾祸”擅自限定为某一种灾害。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“作对”“不肯听从”直接有力，符合警告语气；“灾祸击打”保留 מַכָּה 的宽泛范围和神施行审判的主动性。所有脚注标记均已置于正文相应位置。
