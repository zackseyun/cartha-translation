  text: וְ/אֶתְ/כֶם֙ אֱזָרֶ֣ה בַ/גּוֹיִ֔ם וַ/הֲרִיקֹתִ֥י אַחֲרֵי/כֶ֖ם חָ֑רֶב וְ/הָיְתָ֤ה אַרְצְ/כֶם֙ שְׁמָמָ֔ה וְ/עָרֵי/כֶ֖ם יִהְי֥וּ חָרְבָּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/033.yaml
  text: And I will scatter you among the nations[a], and I will draw out the sword after you; and your land will become a desolation, and your cities will become ruins.
translation:
  language: zh_hans
  text: 我要把你们分散到列国中；我要拔刀追赶你们[a]。你们的土地必变得荒凉，你们的城邑必沦为废墟。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“我要在你们身后拔刀”。
    reason: 保留אַחֲרֵיכֶם“在你们后面”的字面表达，以及它在上下文中可表示追击的含义。
lexical_decisions:
- source_word: אֱזָרֶה
  choice: 分散
  rationale: 希伯来语זרה在此表示使人四散、分布各处；“分散”自然清楚，并保留盟约审判中流散异邦的含义。
- source_word: בַגּוֹיִם
  choice: 到列国中
  rationale: גּוֹיִם在这里指以色列以外的各国；“列国”符合地缘与流亡语境，也避免加入后期“外邦人”一词可能带来的额外宗教含义。
- source_word: וַהֲרִיקֹתִי ... חָרֶב
  choice: 我要拔刀
  rationale: ריק与חֶרֶב构成拔刀、出鞘的惯用表达；“拔刀”保留具体的军事意象，且符合现代汉语习惯。
- source_word: אַחֲרֵיכֶם
  choice: 追赶你们
  rationale: 字面为“在你们后面／跟在你们后面”，在刀剑审判的语境中表示追击；“追赶你们”清楚传达其语境意义，脚注保留较直译的表达。
- source_word: שְׁמָמָה
  choice: 荒凉
  rationale: 此名词表示荒芜、毁坏的状态；汉语用“变得荒凉”自然地表达土地遭毁后的结果。
- source_word: חָרְבָּה
  choice: 废墟
  rationale: 此词指毁坏、荒废之地；与“城邑”搭配时，“沦为废墟”准确而自然。
- source_word: וְהָיְתָה ... יִהְיוּ
  choice: 必变得／必沦为
  rationale: היה在此具有进入某种结果状态的意味；“变得”和“沦为”清楚表达由原状转入荒凉毁坏的过程，“必”则体现预告的确定语气。
theological_decisions:
- issue: 盟约审判中上帝直接施行分散和刀剑追击
  choice: 保留第一人称的直接施动表达：“我要……我要……”
  alternative: 改用被动或非人格表达，弱化上帝的直接行动
  rationale: 希伯来文明确以上帝为分散百姓并拔刀追击的主语；译文应保留这种严肃的神学张力，不加淡化。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“列国”“城邑”略具经文语体色彩，但仍为普通读者所理解；分号呈现前两项审判行动的并列关系，后一句则陈述其结果。
