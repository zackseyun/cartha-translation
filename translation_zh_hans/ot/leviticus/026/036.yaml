revisions:
- from: 至于你们中剩下的人，我要使他们在仇敌之地心里胆怯。连风吹落叶的响声[a]也要追赶他们；他们必逃跑，像逃避刀剑一样；即使无人追赶，他们也必跌倒。
  to: 至于你们中剩下的人，我要使他们在仇敌的土地上心里胆怯。一片被风吹动的叶子发出的声音[a]也要追赶他们；他们必逃跑，像逃避刀剑一样；即使无人追赶，他们也必跌倒。
  rationale: 将“风吹落叶”改为“一片被风吹动的叶子发出的声音”，以避免把叶子误解为已落下，同时维持原文所描写的微小叶声。脚注相应保留未明示施动者的译法；“仇敌之地”改为“仇敌的土地上”，以较自然地反映原文复数。其余表达可保留。
