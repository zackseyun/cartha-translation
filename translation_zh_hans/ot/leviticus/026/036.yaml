base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/036.yaml
  text: As for those of you who remain, I will bring faintness into their hearts in the lands of their enemies, and the sound of a driven leaf will pursue them; they will flee as one flees from the sword, and they will fall when no one is pursuing.
translation:
  language: zh_hans
  text: 至于你们中剩下的人，我要使他们在仇敌的土地上心里胆怯。一片被风吹动的叶子发出的声音[a]也要追赶他们；他们必逃跑，像逃避刀剑一样；即使无人追赶，他们也必跌倒。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“一片飘动的叶子发出的声音。”
    reason: 原文只说叶子被驱动或吹动，未明说施动者是风，也未说叶子落下。
lexical_decisions:
- source_word: הַנִּשְׁאָרִים בָּכֶם
  choice: 你们中剩下的人
  rationale: 保留分词“剩下的”和בכם所表达的群体归属，也延续对以色列的直接称呼。
- source_word: וְהֵבֵאתִי מֹרֶךְ בִּלְבָבָם
  choice: 我要使他们……心里胆怯
  rationale: מֹרֶךְ指勇气衰弱、内心畏缩；“使……心里胆怯”自然表达使役关系，并保留上帝主动施行审判的含义。
- source_word: בְּאַרְצֹת אֹיְבֵיהֶם
  choice: 在仇敌之地
  rationale: 中文以集合性的“仇敌之地”表达他们散居在敌方地域的处境，不必机械复制希伯来语复数。
- source_word: קוֹל עָלֶה נִדָּף
  choice: 风吹落叶的响声
  rationale: נדף描述叶子被吹动或驱赶；正文采用自然中文“风吹落叶”，脚注保留较少明示施动者的译法。
- source_word: וְרָדַף אֹתָם
  choice: 也要追赶他们
  rationale: 保留רדף的拟人化和反讽效果：微小的声响仿佛成了追赶者。
- source_word: וְנָסוּ מְנֻסַת חֶרֶב
  choice: 他们必逃跑，像逃避刀剑一样
  rationale: 将表示逃亡方式的结构译成明确而自然的比较，同时保留“刀剑”的审判意象。
- source_word: וְנָפְלוּ וְאֵין רֹדֵף
  choice: 即使无人追赶，他们也必跌倒
  rationale: “跌倒”保留נפל可指倒下、崩溃或败亡的宽泛含义；“即使”凸显原文无人追赶却仍倒下的反差。
theological_decisions:
- issue: 审判的性质
  choice: 上帝使流亡者内心胆怯，以致因微小声响惊逃跌倒
  alternative: 只描述外在军事追击，或仅泛指不安
  rationale: 原文明确把内心的胆怯归于上帝的行动，并以落叶声引发逃亡来刻画恐慌；译文同时保留神圣施动者和心理层面的审判，不引入额外教义解释。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“胆怯”比生硬的“心中衰弱”更易懂；“追赶”保留原文的拟人化，“跌倒”则避免把结果过度限定为死亡或单纯绊倒。
