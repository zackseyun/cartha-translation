  text: וְ/זָכַרְתִּ֥י לָ/הֶ֖ם בְּרִ֣ית רִאשֹׁנִ֑ים אֲשֶׁ֣ר הוֹצֵֽאתִי אֹתָ/ם֩ מֵ/אֶ֨רֶץ מִצְרַ֜יִם לְ/עֵינֵ֣י הַ/גּוֹיִ֗ם לִ/הְיֹ֥ת לָ/הֶ֛ם לֵ/אלֹהִ֖ים אֲנִ֥י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/045.yaml
  text: 'But I will remember for them the covenant with their forefathers, whom I brought out from the land of Egypt in the sight of the nations, to be their God: I am Yahweh.'
translation:
  language: zh_hans
  text: 但我必为他们记念我与先前世代所立的约[a]；我曾在列国眼前把那些人从埃及地领出来，为要作他们的上帝。我是耶和华。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “先前世代”也可译作“从前的人”或按语境译作“祖先”。希伯来语直译为“先前之人的约”；下文说明这些人是上帝从埃及地领出来的。
    reason: 保留 רִאשֹׁנִים 的字面范围及其可能的语境性译法，避免正文过度限定。
lexical_decisions:
- source_word: וְזָכַרְתִּי
  choice: 但……我会记念
  rationale: וְ 在此承接上文并形成转折，译作“但”符合语篇走向；动词保留“记念”的盟约语感。
- source_word: לָהֶם
  choice: 为了他们
  rationale: 保留介词 ל 的受益含义，表明这次记念是为他们的益处，而不只是“记得他们”。
- source_word: בְּרִית רִאשֹׁנִים
  choice: 我与先前那些人所立的约
  rationale: רִאשֹׁנִים 字面为“先前的那些人”，在此作名词使用。此译法避免把原文明确化为“列祖”，并由后面的关系从句自然说明其所指。中文补出“我与……所立”以表达压缩的希伯来语盟约结构。
- source_word: אֲשֶׁר הוֹצֵאתִי אֹתָם
  choice: 我曾……把那些人……领出来
  rationale: 关系从句指向人，而非“约”；重复“那些人”使现代汉语中的指代清楚。
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: 从埃及地
  rationale: 保留传统出埃及公式中的“地”，同时符合现代中文表达。
- source_word: לְעֵינֵי הַגּוֹיִם
  choice: 在列国眼前
  rationale: 较直接地保留“在……眼前”的意象，强调出埃及事件公开为列国所见。
- source_word: לִהְיוֹת לָהֶם לֵאלֹהִים
  choice: 为要作他们的上帝
  rationale: 采用自然、庄重的中文盟约公式，并保留目的含义。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代简体中文读者熟悉的专名形式音译四字神名，不用称号替代。
theological_decisions:
- issue: “先前那些人的约”所指为何
  choice: 译作“我与先前那些人所立的约”，让后句“我曾……把那些人从埃及地领出来”界定其所指。
  alternative: 译作“与列祖所立的约”或“与祖先所立的约”。
  rationale: 原文 רִאשֹׁנִים 是“先前的／早先的那些人”，并未使用通常表示“列祖”的 אָבוֹת。关系从句明确指向被领出埃及的人，因此不把它泛化为更早的族长，也不把性别信息强化为“父辈”。
- issue: 神记念盟约的受益对象
  choice: “为了他们，我会记念”
  alternative: “我会记念他们”或“我会为他们记念”
  rationale: 原文 לָהֶם 与“盟约”结构相连，表达上帝为当前百姓的益处记念先前之约；所记念的直接宾语是约，而不是百姓本身。
translation_notes:
  register: 采用现代、庄重而易懂的经文语体。“记念”“所立的约”“列国眼前”保留盟约与出埃及叙事的传统语感；句法略作拆分，以免希伯来语长句在中文中产生歧义。
