  text: וְ/נָתַתִּ֤י שָׁלוֹם֙ בָּ/אָ֔רֶץ וּ/שְׁכַבְתֶּ֖ם וְ/אֵ֣ין מַחֲרִ֑יד וְ/הִשְׁבַּתִּ֞י חַיָּ֤ה רָעָה֙ מִן הָ/אָ֔רֶץ וְ/חֶ֖רֶב לֹא תַעֲבֹ֥ר בְּ/אַרְצְ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/006.yaml
  text: And I will give peace in the land[a], and you will lie down, with no one making you afraid. And I will remove harmful beasts from the land[b], and the sword will not pass through your land.
translation:
  language: zh_hans
  text: 我要赐平安给这地；你们必躺卧，无人惊吓你们。我要把危险的野兽从这地除去[a]；刀剑[b]也必不经过你们的地。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“猛兽”。希伯来语指会给当地居民带来危险的野生动物。
    reason: lexical_alternative
  - marker: b
    text: “刀剑”在希伯来语中可借指战争或武装入侵。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי שָׁלוֹם בָּאָרֶץ
  choice: 我要赐平安给这地
  rationale: “赐”自然表达上帝施予盟约福分；“平安”保留 שָׁלוֹם 所涵盖的安宁、安全与福祉，而“这地”保留具体的领土语境。
- source_word: וּשְׁכַבְתֶּם וְאֵין מַחֲרִיד
  choice: 你们必躺卧，无人惊吓你们
  rationale: “躺卧”保留 שׁכב 的具体意象，没有把它缩窄为睡眠；“无人惊吓你们”体现 מַחֲרִיד 的使动含义。
- source_word: וְהִשְׁבַּתִּי חַיָּה רָעָה מִן הָאָרֶץ
  choice: 我要使危险的野兽从这地绝迹
  rationale: שׁבת 的使役形表示“使停止、除去”，在此译作“使……绝迹”清楚表达其结果；חַיָּה רָעָה 指造成威胁的动物，并非具有道德邪恶的动物，因此译作“危险的野兽”。
- source_word: וְחֶרֶב לֹא תַעֲבֹר בְּאַרְצְכֶם
  choice: 刀剑也必不经过你们的地
  rationale: 保留“刀剑”的希伯来语具体意象及其可能指战争或武装入侵的转喻意义；“经过”直接对应 עבר，“你们的地”保留盟约之地的领土含义。
theological_decisions:
- issue: 所应许之平安的范围
  choice: 译文呈现以土地为背景、包括免受恐惧、危险野兽和战争侵扰的整体安全。
  alternative: 把“平安”仅理解为内心属灵的平静，或仅理解为政治安定。
  rationale: 本节以躺卧、野兽和刀剑等具体图像说明盟约福分；译文既不把应许灵意化，也不把其范围限制为单一政治层面。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“躺卧”保留原文的安歇图像；分号使三项安全应许的结构清楚。脚注标记分别紧随“危险的野兽”和“刀剑”，与注释内容准确对应。
