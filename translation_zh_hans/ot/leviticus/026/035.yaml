  text: כָּל יְמֵ֥י הָשַּׁמָּ֖/ה תִּשְׁבֹּ֑ת אֵ֣ת אֲשֶׁ֧ר לֹֽא שָׁבְתָ֛ה בְּ/שַׁבְּתֹתֵי/כֶ֖ם בְּ/שִׁבְתְּ/כֶ֥ם עָלֶֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/035.yaml
  text: All the days of its desolation it shall rest—the rest that it did not have during your Sabbaths[b][a], while you were dwelling on it.
translation:
  language: zh_hans
  text: 在它荒凉的所有日子里，地都要安息，享有它在你们住在其上时、在你们的安息日[a]所未曾享有的安息。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里“你们的安息日”在上下文中指土地本应享有的安息期，尤其包括所说的安息年。
    reason: cross_reference
  - marker: b
    text: 较直译可作：“地要安息，补上它先前未曾安息的安息。”希伯来原文重复“安息”这个动词，以加强语意。
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל יְמֵי הַשַּׁמָּה
  choice: 在它荒凉的一切日子
  rationale: 保留כָּל יְמֵי的周遍时间含义；“它”回指土地，הַשַּׁמָּה指荒凉状态。
- source_word: תִּשְׁבֹּת
  choice: 地都要安息
  rationale: שׁבת在此以阴性单数指土地停止耕作、得到安息；明说“地”可使现代汉语指代清楚。
- source_word: אֵת אֲשֶׁר לֹא שָׁבְתָה
  choice: 享受……没有得到的安息
  rationale: אֵת אֲשֶׁר引出动词的宾语；汉语补出“安息”，并以“享受／得到”自然表达土地补得先前缺失的安息，同时在句中保留词根重复的效果。
- source_word: בְּשַׁבְּתֹתֵיכֶם
  choice: 在你们的安息日
  rationale: 形式上保留复数安息期的表述；上下文尤其指土地应得的安息，包括安息年，故以脚注说明而不在正文中过度限定。
- source_word: בְּשִׁבְתְּכֶם עָלֶיהָ
  choice: 你们住在其上时
  rationale: 准确表达ישׁב不定式结构的时间意义和עָלֶיהָ对土地的回指，语体庄重简洁。
theological_decisions:
- issue: “你们的安息日”所指范围
  choice: 正文保留“你们的安息日”，脚注说明上下文中的土地安息
  alternative: 直接译为“你们的安息年”
  rationale: 希伯来词本身是复数“安息日／安息期”，上下文虽特别涉及安息年，但正文不宜把可能的范围直接收窄。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“地”补明阴性动词的主语；“其上”保持经文语体。“享受……安息”使希伯来语宾语结构在汉语中自然，同时避免把土地安息仅解释为某一教派性的制度观。
