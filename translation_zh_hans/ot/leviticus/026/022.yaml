source:
  edition: WLC
  text: וְ/הִשְׁלַחְתִּ֨י בָ/כֶ֜ם אֶת חַיַּ֤ת הַ/שָּׂדֶה֙ וְ/שִׁכְּלָ֣ה אֶתְ/כֶ֔ם וְ/הִכְרִ֨יתָה֙ אֶת בְּהֶמְתְּ/כֶ֔ם וְ/הִמְעִ֖יטָה אֶתְ/כֶ֑ם וְ/נָשַׁ֖מּוּ דַּרְכֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/022.yaml
  text: And I will send against you the wild animals of the field[a], and they will bereave you, cut off your livestock, reduce your number[c][b], and your roads will become desolate.
translation:
  language: zh_hans
  text: 我必差遣田野的野兽[a]攻击你们；它们必使你们失去儿女[b]，除灭你们的牲畜，使你们人数减少；你们的道路必荒凉[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“野外的猛兽”。
    reason: 保留חַיַּת הַשָּׂדֶה可译为一般野生动物或强调其危险性的译法。
  - marker: b
    text: 希伯来语这个动词通常指使人丧失儿女；原文没有另出现“儿女”一词。
    reason: 说明正文按该动词惯用义译出隐含对象，同时区分其与原文明确出现名词的情形。
  - marker: c
    text: “道路”也可译作“路径”或“通路”；可指道路荒废或无人通行。
    reason: 保留דְּרָכִים的词义范围，并避免把与前句人口减少的因果关系说得过于确定。
lexical_decisions:
- source_word: וְהִשְׁלַחְתִּי בָכֶם
  choice: 我要使……来到你们中间
  rationale: שלח的使役形表达差遣或使之临到；בכם在此带有敌对、侵害的语境。“来到你们中间”自然表达野兽侵入民众当中，同时保留上帝主动施行审判的含义。
- source_word: חַיַּת הַשָּׂדֶה
  choice: 田野的野兽
  rationale: 该结构指野外生存的动物；“田野的野兽”贴近原文意象，现代中文也容易理解。
- source_word: וְשִׁכְּלָה אֶתְכֶם
  choice: 它们必使你们丧失儿女
  rationale: שכל的加强形通常表示使人丧失子女。中文若只译“使你们丧失”语义不完整，因此明示该动词惯常隐含的“儿女”。
- source_word: וְהִכְרִיתָה אֶת בְּהֶמְתְּכֶם
  choice: 除灭你们的牲畜
  rationale: הכרית在审判语境中表示剪除、灭绝；“除灭”保留其强烈程度。בהמה在这里泛指家养牲畜，不限于牛。
- source_word: וְהִמְעִיטָה אֶתְכֶם
  choice: 使你们人数减少
  rationale: מעט的使役形意为使之变少；补出“人数”可在现代中文中清楚表达人口减少的含义。
- source_word: וְנָשַׁמּוּ דַּרְכֵיכֶם
  choice: 你们的道路也必荒凉
  rationale: נשׁם表示荒废、荒凉；דרך的复数在社会受灾的上下文中最自然地指实际道路或交通路线。
theological_decisions:
- issue: “使你们丧失”所隐含的对象
  choice: 正文译作“使你们丧失儿女”
  alternative: 只译“使你们遭受丧亲之痛”，不明确丧失的是儿女
  rationale: 原文没有另写“儿女”一词，但שכל在此类用法中惯常表示使人失去子女。正文明确补出有助于中文完整自然，脚注同时说明这是动词所含之义，而非原文另有名词。
- issue: בכם的空间与敌对意味
  choice: 译作“来到你们中间”
  alternative: 译作“攻击你们”或“临到你们身上”
  rationale: 上下文已明确野兽带来刑罚；采用空间性表达可避免把介词过度释义，同时不削弱神主动差遣审判的意思。
translation_notes:
  register: 采用现代、庄重而清楚的普通话。“除灭”“荒凉”保留盟约审判语境的力度；句式按希伯来文连续后果展开，但用分号改善中文可读性。
