  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: אַף אֲנִ֗י אֵלֵ֤ךְ עִמָּ/ם֙ בְּ/קֶ֔רִי וְ/הֵבֵאתִ֣י אֹתָ֔/ם בְּ/אֶ֖רֶץ אֹיְבֵי/הֶ֑ם אוֹ אָ֣ז יִכָּנַ֗ע לְבָבָ/ם֙ הֶֽ/עָרֵ֔ל וְ/אָ֖ז יִרְצ֥וּ אֶת עֲוֺנָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/041.yaml
  text: I too will walk contrary to them and bring them into the land of their enemies[a]; or then their uncircumcised heart will be humbled[e][d][c][b], and then they will accept the punishment for their iniquity.
translation:
  language: zh_hans
  text: 我也[a]要以敌对的态度对待他们[b]，把他们带进他们仇敌的土地。或到那时[c]，他们未受割礼的心[d]就会谦卑下来；那时，他们就会承担自己罪孽的惩罚[e]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“连我也”。希伯来语在这里强调上帝相应采取的行动。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译近似“以敌对的态度与他们同行”或“与他们相逆而行”；这是本章反复出现的圣约咒诅用语。
    reason: lexical_alternative
  - marker: c
    text: 希伯来文作“或到那时”。这一短语的句法较难确定，可能引出他们的心谦卑下来的时点。
    reason: alternative_reading
  - marker: d
    text: 直译“他们未受割礼的心”，是描述内心顽梗和不洁的圣约性隐喻。
    reason: cultural_note
  - marker: e
    text: 也可译作“为自己的罪孽作补偿”或“使自己的罪孽得到偿付”。这一希伯来习语指承受或偿付罪责应得的后果。
    reason: alternative_reading
lexical_decisions:
- source_word: אַף אֲנִי
  choice: 我也
  rationale: אַף与独立人称代词连用，强调对应关系：他们怎样敌对，上帝也照样回应。“我也”在现代汉语中简洁地保留这种强调。
- source_word: אֵלֵךְ עִמָּם בְּקֶרִי
  choice: 要与他们作对而行
  rationale: 这是本章反复出现的圣约咒诅用语；קֶרִי在此表达敌对、相抗，而非偶然。“作对而行”既保留“行走”的意象，也传达敌对关系。
- source_word: וְהֵבֵאתִי אֹתָם בְּאֶרֶץ אֹיְבֵיהֶם
  choice: 把他们带进仇敌之地
  rationale: בוא的使役形表示“带入”；译文保留被掳到仇敌境内的场景。
- source_word: אוֹ אָז
  choice: 或到那时
  rationale: 此短语句法困难，可能引出他们的心终于谦卑下来的时点或另一种发展。保留“或”的离析意味，不将疑难之处擅自消解。
- source_word: יִכָּנַע
  choice: 就会谦卑下来
  rationale: כנע的受动形可指“被降卑、降服”。以“心”为主语时，“谦卑下来”较自然地表达内在屈服，同时不排除受管教而降卑的意味。
- source_word: לְבָבָם הֶעָרֵל
  choice: 他们未受割礼的心
  rationale: 直译并保留圣约性的身体隐喻，避免仅以“顽梗的心”取代其经文互文意义。
- source_word: וְאָז יִרְצוּ אֶת עֲוֺנָם
  choice: 那时，他们就会承担自己罪孽的惩罚
  rationale: רצה与עון连用，在此涉及承受或偿付罪责应得的后果。“承担……惩罚”使现代读者能理解其司法含义，又避免暗示靠功德自行赎罪。
theological_decisions:
- issue: “未受割礼”用于“心”的圣约隐喻
  choice: 保留为“未受割礼的心”
  alternative: 顽梗的心；不肯悔改的心
  rationale: 原文使用具有圣约内涵的隐喻，不只是泛指顽固。保留这一表达可维系它与申命记及先知书相关用语的联系，也避免过度释义。
- issue: יִרְצוּ אֶת עֲוֺנָם的含义
  choice: 承担自己罪孽的惩罚
  alternative: 为罪孽作补偿；罪孽得到偿付；承认自己的罪责
  rationale: 该短语着重承受或偿付违约罪责所招致的后果。译文保留司法意味，同时不引入靠人自身功劳赎罪的神学判断。
- issue: אוֹ אָז的逻辑关系
  choice: 保留“或到那时”
  alternative: 到那时；若到那时；或许那时
  rationale: 希伯来语衔接本身困难，可能表示转折、选择或某一时点。直保留“或”可让原文真实的歧义继续存在，而不替读者预先裁定。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“作对而行”保留本章反复出现的“行走”意象；“未受割礼的心”有意保留陌生但重要的圣约隐喻。标点将“或到那时”置于第二句开头，以显出原文转接的突兀和歧义。
