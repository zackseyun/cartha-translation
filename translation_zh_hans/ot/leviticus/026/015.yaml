source:
  edition: WLC
  text: וְ/אִם בְּ/חֻקֹּתַ֣/י תִּמְאָ֔סוּ וְ/אִ֥ם אֶת מִשְׁפָּטַ֖/י תִּגְעַ֣ל נַפְשְׁ/כֶ֑ם לְ/בִלְתִּ֤י עֲשׂוֹת֙ אֶת כָּל מִצְוֺתַ֔/י לְ/הַפְרְ/כֶ֖ם אֶת בְּרִיתִֽ/י־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/015.yaml
  text: and if you reject my statutes[a], and if your soul abhors my judgments, so that you do not do all my commandments, thereby breaking my covenant[c][b],
translation:
  language: zh_hans
  text: 如果你们厌弃我的律例，如果你们从心里憎恶我的典章，以致不遵行我的一切诫命，从而背弃我的约。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּחֻקֹּתַי
  choice: 我的律例
  rationale: חֻקִּים 指制定的法规或定例；“律例”保留法律—盟约语域，并与下文 מִשְׁפָּטִים 区分。
- source_word: תִּמְאָסוּ
  choice: 厌弃
  rationale: מאס 不只是拒绝，也含轻蔑、嫌弃之意；“厌弃”简洁地传达这种强烈态度。
- source_word: מִשְׁפָּטַי
  choice: 我的典章
  rationale: מִשְׁפָּטִים 可指司法判定、法规；“典章”保持正式法律色彩，也避免与“律例”混同。
- source_word: תִּגְעַל נַפְשְׁכֶם
  choice: 你们从心里憎恶
  rationale: 直译为“你们的 נפש 憎恶”。此处 נֶפֶשׁ 表示人自身、内在生命；“从心里”在现代汉语中自然表达全人的深切憎恶，而不把它技术化为独立的“灵魂”。
- source_word: לְבִלְתִּי עֲשׂוֹת
  choice: 以致不遵行
  rationale: 该结构可表达结果或目的；“以致”保留两者之间的联系，而“遵行”适合诫命语境。
- source_word: כָּל מִצְוֺתַי
  choice: 我的一切诫命
  rationale: מִצְוֹת 是命令、诫命；“诫命”保留盟约律法的正式语气。
- source_word: לְהַפְרְכֶם
  choice: 破坏
  rationale: פרר 的使役式在此指废弃、破坏盟约效力；“破坏我的约”保留动作的法律—关系含义。
- source_word: בְּרִיתִי
  choice: 我的约
  rationale: בְּרִית 是标准的盟约用语；现代中文圣经语境中“约”准确且自然。
theological_decisions:
- issue: נֶפֶשׁ 在习语中的表达
  choice: 从心里憎恶
  alternative: 你们的心灵憎恶／你们全人憎恶
  rationale: 希伯来文以 נֶפֶשׁ 为主语，强调人内在而整体的厌恶。“从心里”保留强度且符合现代汉语，不据此引入灵魂与身体二分的教义。
- issue: 盟约律法术语的区分
  choice: 律例／典章／诫命／约
  alternative: 定例／法令／命令／盟约
  rationale: 原文连续使用不同法律—盟约词汇；译文尽量分别表达，不为流畅而把它们合并为同一术语。
- issue: לְהַפְרְכֶם 与不顺服之间的逻辑关系
  choice: 以致不遵行……破坏我的约
  alternative: 为要不遵行……废弃我的约
  rationale: 两个不定式结构可带目的或结果意味。正文以自然中文保留连续发展，不额外断定其纯属主观目的或客观结果。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“厌弃—憎恶—不遵行—破坏”保留原文逐步加重的警告语势；句末逗号反映本节在上下文中尚未完结。
