  yaml_path: translation/ot/leviticus/026/010.yaml
  text: You will eat old stores long kept[a], and you will clear out the old because of the new.
translation:
  language: zh_hans
  text: 你们要吃久存的陈粮；因新粮，你们要把陈粮搬出去。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你们要吃久存的陈粮，也要因新粮而把陈粮搬出去。”
    reason: 保留 מִפְּנֵי 较形式对应的因果表达，以及原文两个并列分句的结构。
lexical_decisions:
- source_word: וַאֲכַלְתֶּם
  choice: 你们要吃
  rationale: 该完成式在盟约赐福的连续应许中表达将来结果；“要吃”自然传达应许语气。
- source_word: יָשָׁן נוֹשָׁן
  choice: 久存的陈粮
  rationale: יָשָׁן在此作名词性用法，指以往收成所储存的食物；נוֹשָׁן强调存放已久。“陈粮”符合农业语境，“久存”保留强化意味，又不暗示已经变质。
- source_word: וְיָשָׁן
  choice: 陈粮
  rationale: 再次以名词性形容词指先前储存的粮食，与前半句保持呼应。
- source_word: מִפְּנֵי חָדָשׁ
  choice: 新粮来到时
  rationale: 该短语可表示因新的粮食来到而将旧粮移出。正文用时间—情境表达使现代汉语自然，同时保留新粮取代陈粮的关系。
- source_word: תּוֹצִיאוּ
  choice: 搬出去
  rationale: יצא的使役式直译为“使出去、带出去”；“搬出去”适合储粮场景，并比“清掉”更少加入处置或丢弃之意。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的应许语体。“陈粮”在上下文中指上季留下并长期储存的粮食，不含腐坏之意；脚注标记已置于正文相应句末。
