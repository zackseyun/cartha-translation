source:
  edition: WLC
  text: לֹֽא תַעֲשׂ֨וּ לָ/כֶ֜ם אֱלִילִ֗ם וּ/פֶ֤סֶל וּ/מַצֵּבָה֙ לֹֽא תָקִ֣ימוּ לָ/כֶ֔ם וְ/אֶ֣בֶן מַשְׂכִּ֗ית לֹ֤א תִתְּנוּ֙ בְּ/אַרְצְ/כֶ֔ם לְ/הִֽשְׁתַּחֲוֺ֖ת עָלֶ֑י/הָ כִּ֛י אֲנִ֥י יְהוָ֖ה אֱלֹהֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/001.yaml
  text: You shall not make idols for yourselves[a], and you shall not set up for yourselves a carved image or a standing stone, and you shall not place a figured stone in your land to bow down to it[b], for I am Yahweh your God.
translation:
  language: zh_hans
  text: “你们不可为自己制造偶像；也不可为自己立起雕像或石柱；不可在你们的地上放置刻有图像的石头[a]，向它下拜；因为我是雅威[b]——你们的上帝。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “刻有图像的石头”也可译作“雕饰的石头”“雕刻的石头”或“石像”。希伯来语 אֶבֶן מַשְׂכִּית 所指物件的确切形制尚有争议，但指与被禁止的敬拜有关的石制物件。
    reason: lexical_alternative
  - marker: b
    text: 希伯来语为 YHWH（יהוה），是上帝的名；传统上也译作“耶和华”或以“上主”代称。
    reason: alternative_reading
lexical_decisions:
- source_word: אֱלִילִם
  choice: 偶像
  rationale: 该词指供人敬拜的偶像，并常带有虚妄、无价值的贬义；“偶像”在现代汉语中清楚自然，不必在正文中额外扩展其贬义。
- source_word: פֶסֶל
  choice: 雕刻神像
  rationale: 该词指以雕刻方式制成的像。“雕刻神像”保留制作方式及敬拜语境，也与前面的泛称“偶像”有所区别。
- source_word: מַצֵּבָה
  choice: 石柱
  rationale: 该词指竖立的石碑或柱状石物；此处与禁戒祭祀物件有关。“石柱”简明具体，而不在名词中额外加入“神圣”等解释。
- source_word: אֶבֶן מַשְׂכִּית
  choice: 雕花的石头
  rationale: 此短语的确切形制有争议，可能指刻有图形、纹饰或形象的石头。“雕花的石头”在现代汉语中较自然，同时以脚注保留其他可能。
- source_word: תַעֲשׂוּ לָכֶם
  choice: 为自己制造
  rationale: 保留动词“制造”和לָכֶם的反身、受益含义，符合禁令语体。
- source_word: תָקִימוּ לָכֶם
  choice: 为自己……立起
  rationale: קום的使役式在这里表示竖立某物；“立起”准确而自然，并保留“为自己”的含义。
- source_word: תִתְּנוּ בְּאַרְצְכֶם
  choice: 在你们的地上安放
  rationale: נתן在地点介词短语前表示放置、安放；“你们的地”保留盟约之地的范围。
- source_word: לְהִשְׁתַּחֲוֺת עָלֶיהָ
  choice: 向它下拜
  rationale: 不定式表示安放此物的目的；“下拜”直接表达俯伏敬拜。עַל在这里最可能指向敬拜对象，而不是“在它上面”。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见音译呈现四字神名，保留其作为以色列上帝之专名的性质，不以称号替代。
- source_word: כִּי אֲנִי יְהוָה אֱלֹהֵיכֶם
  choice: 因为我是雅威你们的上帝
  rationale: כִּי说明禁令的根据；“因为”在现代汉语中明确自然，并保留盟约公式。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名。正文采用“雅威”以保留专名性质；脚注说明希伯来文字母及传统译法，使读者了解不同惯例。
- issue: 多种祭祀物件术语的区分
  choice: 分别译作“偶像”“雕刻神像”“石柱”“雕花的石头”
  alternative: 统称为“偶像”或“神像”
  rationale: 原文连续使用四个不同词语。分别翻译可保留律法条文的具体性，不把不同物件扁平化为同一类别。
- issue: עָלֶיהָ所指的敬拜关系
  choice: 向它下拜
  alternative: 在它上面敬拜
  rationale: 介词עַל可有不同空间或关系含义，但在此禁戒祭祀物件的语境中，以石头为下拜对象最为自然；不将较不可能的空间读法写入正文。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语，以“不可”维持律法禁令的语气。通过分号划分制造、竖立和安放敬拜物件三层禁令；保留第二人称复数“你们”及反复出现的“为自己”。
