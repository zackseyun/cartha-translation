  text: וְ/נָתַתִּ֥י מִשְׁכָּנִ֖/י בְּ/תוֹכְ/כֶ֑ם וְ/לֹֽא תִגְעַ֥ל נַפְשִׁ֖/י אֶתְ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/011.yaml
  text: And I will set my dwelling place among you, and my soul will not abhor you.
translation:
  language: zh_hans
  text: 我要把我的居所设立在你们中间；我的心必不厌弃你们。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִשְׁכָּנִי
  choice: 我的居所
  rationale: מִשְׁכָּן指居住之处，也可特指会幕；本节重在上帝住在百姓中间，译作“居所”既保留词义，也避免把意涵不必要地限缩为建筑物。
- source_word: בְּתוֹכְכֶם
  choice: 在你们中间
  rationale: 准确表达介词短语所指的临在位置，符合现代汉语习惯。
- source_word: נַפְשִׁי
  choice: 我的心
  rationale: נֶפֶשׁ在此作为上帝自称中的主体表达，指上帝自身及内在态度；直译“我的魂”在现代汉语中生硬且易引起误解，“我的心”保留原文明确出现该词及其情感意味。
- source_word: תִגְעַל
  choice: 厌弃
  rationale: געל表示强烈嫌恶、排斥；“厌弃”兼顾厌恶与弃绝的含义，语体庄重自然。
theological_decisions:
- issue: 如何表达拟人化的“我的נפש”
  choice: 保留为“我的心”，不省略主语成分
  alternative: 译作“我也不会厌弃你们”或直译“我的魂也不会厌弃你们”
  rationale: 原文特意使用נַפְשִׁי，应在汉语中有所体现；“我的心”保留拟人表达，同时不暗示关于上帝构成的特定形而上学主张。
- issue: מִשְׁכָּן是否特指会幕
  choice: 译作“居所”
  alternative: 译作“帐幕”或“会幕”
  rationale: 上下文可能唤起会幕意象，但该词在此也表达上帝住在百姓中间；“居所”保留较宽的语义范围，不替原文消除这种张力。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。“安置我的居所”保留原文“给予/设置”的动作感；分号呈现两个并列应许。
