  yaml_path: translation/ot/leviticus/026/024.yaml
  text: then I also will walk contrary to you[b][a], and I myself will strike you sevenfold for your sins.
translation:
  language: zh_hans
  text: 我也要与你们敌对而行[a]，我还要因你们的罪七倍地击打你们[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“与你们相逆而行”“怀着敌意与你们同行”。这里译作“敌对”的希伯来词在利未记26章多次出现，描写以色列与耶和华彼此对抗。
    reason: lexical_alternative
  - marker: b
    text: 或译：“因你们的罪击打你们七次”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָלַכְתִּי
  choice: 我也要……而行
  rationale: 保留הלך“行走、行”的具体意象和本章反复出现的表达；中文用“而行”构成庄重而自然的搭配。句首连接词按连续警告的语境融入句式，不机械译为“然后”。
- source_word: אַף אֲנִי
  choice: 我也
  rationale: 表达上帝相应采取行动的递进与对等意味，同时符合现代汉语习惯。
- source_word: עִמָּכֶם
  choice: 与你们
  rationale: 按原文保留介词“与”，并与“敌对而行”搭配，呈现双方关系中的对立。
- source_word: בְּקֶרִי
  choice: 敌对
  rationale: קרי是利未记26章的重复关键词，描述以色列与耶和华彼此相对的立场。“敌对”清楚自然，也保留其敌意、对抗或相逆而行的语义范围。
- source_word: וְהִכֵּיתִי
  choice: 并且我要……击打你们
  rationale: נכה的基本义为“击打”。此处保留审判行动的力度，不用较古旧的“击杀”，也不额外限定结果。
- source_word: גַּם אָ֔נִי
  choice: 并且我要
  rationale: 原文再次强调行动者是“我”。中文借重复主语“我”体现强调，避免连续使用“我也”造成生硬。
- source_word: שֶׁבַע
  choice: 七倍
  rationale: 保留本章惩罚公式的强化修辞；“七倍”在现代汉语中比“七次”更能表达程度或分量加重，同时不排除数目表达的可能。
- source_word: עַל חַטֹּאתֵיכֶם
  choice: 因你们的罪
  rationale: על在此表示惩罚的原因或依据；“因你们的罪”简洁、自然，并准确呈现因果关系。
theological_decisions:
- issue: 如何翻译上帝与以色列相互对立的盟约审判用语בקרי
  choice: 敌对
  alternative: 相逆；怀着敌意；与你们作对
  rationale: “敌对”保留本章重复用语所表达的对应性对抗，不把它仅仅解释为情绪上的敌意，也不引入后来的神学范畴。
- issue: שבע在惩罚公式中应按倍数还是次数表达
  choice: 七倍
  alternative: 七次
  rationale: “七倍”保留警告的修辞强度，并容纳强化惩罚的惯用意义；脚注同时说明较严格的次数理解。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“敌对而行”有意保留原文“行”的意象及本章关键词的重复；两个脚注标记均置于正文相关词语之后。
