  text: וְ/אִם לֹ֥א תִשְׁמְע֖וּ לִ֑/י וְ/לֹ֣א תַעֲשׂ֔וּ אֵ֥ת כָּל הַ/מִּצְוֺ֖ת הָ/אֵֽלֶּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/014.yaml
  text: But if you do not listen to me and do not do all these commandments,[a]
translation:
  language: zh_hans
  text: 但如果你们不听从我，不遵行这一切诫命，[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “听从我”也可译作“听我的话”或“顺服我”。希伯来语动词既有听的意思，在这里也含有服从之意。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: 但如果
  rationale: 本短语承接前文的赐福，并转入相反情形；“但如果”既表达语境中的转折，也保留条件意义。
- source_word: תִשְׁמְעוּ לִי
  choice: 听从我
  rationale: שׁמע 与 ל 连用表示留心听，并含有顺服之意。“听从我”在现代汉语中自然地兼顾聆听与服从，没有把意思缩减为单纯听见。
- source_word: וְלֹא תַעֲשׂוּ
  choice: 不遵行
  rationale: עשה 在律法语境中指实行、履行。“遵行”比单说“做”更符合汉语中执行诫命的惯用表达，同时保留与前一分句的区别。
- source_word: אֵת כָּל הַמִּצְוֺת הָאֵלֶּה
  choice: 这一切诫命
  rationale: כָּל 表示全部，הָאֵלֶּה 指前述内容，מִצְוֺת 是具有盟约和律法色彩的“诫命”；“这一切诫命”准确而自然。
theological_decisions:
- issue: שׁמע ל 应侧重“听”还是直接译作“服从”
  choice: 听从我
  alternative: 听我的话；顺服我
  rationale: “听从”保留希伯来语以聆听表达回应的意象，同时在现代汉语中包含服从意味；又不与下一句“遵行诫命”完全合并，因而保留原文中听从与实行之间的层次。
translation_notes:
  register: 采用现代、庄重而易懂的律法语体。“诫命”保留盟约性的法律色彩；句末逗号表明本节是后续警告之条件从句。
