base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/032.yaml
  text: And I myself will lay the land waste[a], and your enemies who dwell in it will be appalled at it.
translation:
  language: zh_hans
  text: 我必亲自使这地荒凉；住在其中的你们的仇敌也必因这地而惊骇[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “惊骇”或译“震惊”或“因它而骇然”。希伯来语动词在这里可表示人面对荒凉景象时惊愕骇然。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַהֲשִׁמֹּתִי
  choice: 使……荒凉
  rationale: שׁמם的使役式表示“使荒凉、使成为废墟”。此译保留使役含义，也符合现代汉语表达。
- source_word: אֲנִי
  choice: 我要亲自
  rationale: 独立人称代词与已含主语的动词并用，具有强调作用；“亲自”自然体现说话者对这一行动的强调。
- source_word: הָאָרֶץ
  choice: 这地
  rationale: 上下文所指是圣约审判临到的迦南地，并非全世界；“这地”准确体现特定语境。
- source_word: וְשָׁמְמוּ
  choice: 也必惊骇
  rationale: שׁמם的简单词干在此以“你们的仇敌”为主语，可表示因目睹荒凉而震惊、惊骇；避免误解为仇敌本身变得荒凉。
- source_word: עָלֶיהָ
  choice: 见了
  rationale: 介词עַל与שׁמם连用，可标示惊骇所针对的对象或缘由；汉语用“见了”自然表达仇敌面对这地荒凉景象的反应。
- source_word: אֹיְבֵיכֶם
  choice: 你们的仇敌
  rationale: 直接保留复数第二人称所属关系。
- source_word: הַיֹּשְׁבִים בָּהּ
  choice: 住在其中的
  rationale: ישׁב的分词表示居住；“住在其中”清楚、自然，并保留持续居住的含义。
theological_decisions:
- issue: הָאָרֶץ在圣约审判语境中的所指
  choice: 这地（上下文中的以色列地／迦南地）
  alternative: 全地／大地
  rationale: 紧接的上下文谈到以色列的土地因违约而遭审判；译作“这地”可避免把审判范围无根据地扩大到全世界。
- issue: 两个分句之间וְ的关系
  choice: 以分号及“也”表达并列承接
  alternative: 译成“以致／好叫”，表达结果或目的
  rationale: 希伯来文只明确使用普通连接词，并未明说目的或结果；译文不额外限定两句的逻辑关系。
translation_notes:
  register: 采用现代、庄重而易懂的经文语体。“荒凉”与“惊骇”保留同一希伯来词根在使役式和简单式中的语义关联，同时按各自主语和句法关系作自然区分。
