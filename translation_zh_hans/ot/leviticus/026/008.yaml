base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/008.yaml
  text: Five of you will chase a hundred[a], and a hundred of you will chase ten thousand[b], and your enemies will fall before you by the sword.
translation:
  language: zh_hans
  text: 你们中五人要追赶一百人[a]；你们中一百人要追赶一万人[b]；你们的仇敌必在你们面前倒在刀剑之下。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “追赶”也可译作“追击”；下句同。
    reason: lexical_alternative
  - marker: b
    text: 希伯来语这个词可指“一万”，也可泛指“万千”；这里按数字的递进关系译作“一万”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָדְפוּ / יִרְדֹּפוּ
  choice: 要追赶
  rationale: רדף常指追逐、追赶；在军事语境中，“追赶”自然明确，并保留两句的平行表达。
- source_word: מִכֶּם
  choice: 你们中间……个人
  rationale: 介词מן在这里表示整体中的一部分，即“你们中间的五个人／一百个人”，而不是空间上的“从你们那里”。
- source_word: חֲמִשָּׁה מֵאָה
  choice: 五个人要追赶一百人
  rationale: 忠实呈现原文人数对比；汉语按语境补出量词“人”，使对象关系清楚自然。
- source_word: רְבָבָה
  choice: 一万人
  rationale: 该词可指“一万”或泛指“万千”；这里与一百形成递进的数字对比，采用确数“一万”更贴合上下文。
- source_word: וְנָפְלוּ
  choice: 必倒
  rationale: 保留נפל“倒下”的基本意象；“必”表达此处盟约祝福中未完成式所指向的确定结果。
- source_word: אֹיְבֵיכֶם
  choice: 你们的仇敌
  rationale: 准确表达军事语境中的敌对者，语体庄重而通俗。
- source_word: לִפְנֵיכֶם
  choice: 在你们面前
  rationale: 贴近希伯来语表达，表示仇敌在以色列人面前被击败。
- source_word: לֶחָרֶב
  choice: 死在刀下
  rationale: 该短语在战争语境中表示被兵刃杀死；汉语“死在刀下”比直译“向着刀剑倒下”自然，同时保留具体军事意象。
theological_decisions:
- issue: 盟约祝福中的悬殊军事胜利是具体应许还是泛化的鼓励
  choice: 保留直接、具体的军事应许
  alternative: 弱化为一般性的得胜或鼓励
  rationale: 本节属于利未记26章的盟约祝福；译文应保留人数悬殊和仇敌倒毙的具体画面，不将其抽象化。
- issue: 数字רְבָבָה应理解为确数还是泛称
  choice: 译作确数“一万”
  alternative: 译作“万千”或“无数”
  rationale: 原文从五对一百推进到一百对一万，数字平行支持确数理解；脚注仍说明其词义范围，以保留语义余地。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“你们中间五个人”清楚表达部分关系；分号保留两组悬殊人数与最终战果之间的推进。
