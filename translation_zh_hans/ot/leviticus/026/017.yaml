base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/017.yaml
  text: And I will set my face against you[a], and you will be struck down before your enemies; those who hate you will rule over you[c][b], and you will flee when no one is pursuing you.
translation:
  language: zh_hans
  text: 我要定意反对你们[a]；你们必在仇敌面前被击败[b]。恨你们的人必统治你们；你们必逃跑，却没有人追赶你们[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译近于“我要使我的脸向着你们”；这是表示定意敌对并施行审判的说法。
    reason: cultural_note
  - marker: b
    text: 也可译作“被击倒”。
    reason: lexical_alternative
  - marker: c
    text: 或译作：“你们要逃跑，没有人追赶你们。”
    reason: translation_alternative
lexical_decisions:
- source_word: וְנָתַתִּי פָנַי בָּכֶם
  choice: 我要转脸敌对你们
  rationale: 保留希伯来文以“脸”表达上帝亲自、坚决敌对并施行审判的拟人性意象，同时用现代汉语明确其敌对含义。
- source_word: וְנִגַּפְתֶּם לִפְנֵי אֹיְבֵיכֶם
  choice: 你们必败在仇敌面前
  rationale: 此处动词的被动形态在军事语境中可指被击倒或被击败；“败在仇敌面前”简洁自然，也保留 לִפְנֵי 的空间及军事色彩。
- source_word: וְרָדוּ בָכֶם
  choice: 必统治你们
  rationale: רדה 表示统治、掌权；上下文暗含压制，但本句没有明说暴虐程度，因此不采用“奴役”或“欺压”等较强释义。
- source_word: שֹׂנְאֵיכֶם
  choice: 恨你们的人
  rationale: 按分词形式直译为持续仇恨他们的人，并与前面的“仇敌”保持词汇区别。
- source_word: וְנַסְתֶּם וְאֵין רֹדֵף אֶתְכֶם
  choice: 即使无人追赶你们，你们也要逃跑
  rationale: 表达因恐惧而在没有追兵时仍然逃跑的反常情形；脚注保留希伯来文并列结构可能呈现的另一种关系。
theological_decisions:
- issue: 审判语境中关于上帝“脸”的拟人说法
  choice: 保留“脸”的意象，译作“我要转脸敌对你们”
  alternative: 我要敌对你们
  rationale: 抽象译法虽流畅，却会削弱上帝在盟约关系中亲自转而反对百姓的文学和神学力度。
- issue: 仇恨者掌权的性质
  choice: 译作“统治你们”
  alternative: 辖制你们；残暴地统治你们
  rationale: 原文明确说他们掌权，却未在本分句中具体说明统治的残酷程度，因此采用不过度强化的译法。
- issue: 无人追赶与逃跑之间的逻辑关系
  choice: 正文采用让步关系“即使……也……”
  alternative: 你们要逃跑，那时却没有人追赶你们
  rationale: 上下文强调审判造成的惊惶，让步关系最为自然；但希伯来文仅以连接词并列两句，脚注保留较少解释的表达。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“转脸敌对”有意保留原文的身体意象；“统治”避免加入原文未明说的残暴程度。分号划分审判行动及其结果，使句子层次清楚。
