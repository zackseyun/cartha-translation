  verdict: revise
  source_fidelity: 译文基本忠实地表达了敌对、战败、受恨者统治及无人追赶仍逃跑的审判后果。但“我要转脸敌对你们”把“设立/定向自己的脸攻击”译成“转脸”，加入了原文未明示的转向动作；末句的“即使……也……”将原文并列结构明确化为让步关系，虽合语境，仍可更贴近原文而保留其简洁关系。
  naturalness: “转脸敌对”在现代汉语中不够自然，且“转脸”容易理解为变脸或转过脸去。“我要定意反对你们”庄重、清楚，且可由脚注保留原文“脸”的习语。将“败在仇敌面前”改为“在仇敌面前被击败”更合现代书面汉语。
  terminology: “仇敌”与“恨你们的人”恰当地保留了原文中“敌人”和“恨恶者”的词汇区别；“统治你们”准确而未夸大压迫程度。“定意反对”在正文中表达审判性的坚决敌对，脚注保留拟人化的“脸”意象。
