  text: וְ/שָׁבַרְתִּ֖י אֶת גְּא֣וֹן עֻזְּ/כֶ֑ם וְ/נָתַתִּ֤י אֶת שְׁמֵי/כֶם֙ כַּ/בַּרְזֶ֔ל וְ/אֶֽת אַרְצְ/כֶ֖ם כַּ/נְּחֻשָֽׁה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/019.yaml
  text: And I will break the pride of your strength[b][a], and I will make your heavens like iron and your land like bronze.
translation:
  language: zh_hans
  text: 我要打破你们因自己的力量而有的骄傲，使你们的天[a]如铁，你们的地如铜[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“天空”。希伯来文采用复数形式，常用来指头顶的天空。
    reason: lexical_alternative
  - marker: b
    text: 原词可指铜或青铜。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁבַרְתִּי
  choice: 我要打破
  rationale: שׁבר意为“打破、粉碎”。“打破”既保留原文的强烈动作，也能自然地与“骄傲”搭配。
- source_word: גְּאוֹן עֻזְּכֶם
  choice: 你们因强盛而有的骄傲
  rationale: גְּאוֹן可指骄傲、威荣或高昂，עֹז指力量、强盛。此处是对悖逆者的盟约审判，因此采用负面的“骄傲”；这一表达也尽量保留“骄傲”与“强盛”之间的属格关系，而不把它完全改写为单指军事力量。
- source_word: וְנָתַתִּי
  choice: 使
  rationale: נתן基本义为“给、置”，但在此结构中表示使某物呈现某种状态，现代汉语译作“使”最自然。
- source_word: שְׁמֵיכֶם
  choice: 你们的天
  rationale: 原文为复数形式“诸天”，在这里指头顶的天空。“天”保留庄重的经文语体，也符合汉语习惯。
- source_word: כַּבַּרְזֶל
  choice: 如铁
  rationale: כ加名词构成比较，铁表现天空坚硬、不降雨的形象；“如铁”简洁而保留比喻。
- source_word: אַרְצְכֶם
  choice: 你们的地
  rationale: אֶרֶץ可指土地、国土或地面；在旱灾和农作物歉收的语境中，“地”兼顾土地与土壤的含义。
- source_word: כַּנְּחֻשָׁה
  choice: 如铜
  rationale: נְחֻשָׁה可指铜或青铜。“铜”在现代汉语中自然、简洁，并保留原词无法确定是纯铜还是青铜的空间。
theological_decisions:
- issue: 咒诅意象的具体含义
  choice: 保留“天如铁、地如铜”的比喻，暗示旱灾与土地不产出
  alternative: 直接解释为“天不降雨，土地干硬”
  rationale: 上下文中的农业审判支持旱灾和荒芜的理解，但原文以金属比喻表达，并未直接解释，因此正文不把隐喻改成明说。
- issue: “强盛”与“骄傲”的关系
  choice: 译为“因强盛而有的骄傲”
  alternative: “你们引以为傲的力量”或“你们强盛的威荣”
  rationale: 原文属格结构容许不同理解。当前译法以审判语境中的负面“骄傲”为主，同时保留其根源在于以自身强盛自恃；不将其解释成某一种特定的政治或军事力量。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“天如铁，地如铜”保留原文对称、凝练的咒诅意象；以“因强盛而有的骄傲”避免生硬直译，同时没有消除希伯来语属格关系所含的张力。
