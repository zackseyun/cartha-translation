  text: וְ/הִתְוַדּ֤וּ אֶת עֲוֺנָ/ם֙ וְ/אֶת עֲוֺ֣ן אֲבֹתָ֔/ם בְּ/מַעֲלָ֖/ם אֲשֶׁ֣ר מָֽעֲלוּ בִ֑/י וְ/אַ֕ף אֲשֶׁר הָֽלְכ֥וּ עִמִּ֖/י בְּ/קֶֽרִי־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/040.yaml
  text: But if they confess their iniquity and the iniquity of their fathers[a], in the unfaithfulness by which they were unfaithful to me, and also that they walked contrary to me[b],
translation:
  language: zh_hans
  text: 但他们若承认自己的罪孽和祖先的罪孽，承认他们对我所犯的背信之罪[a]，也承认他们以敌对的态度对待我[b]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “背信之罪”也可译作“不忠”或“背叛”。原文在此使用同源的名词和动词，强调他们对上帝所犯的背信之事。
    reason: lexical_alternative
  - marker: b
    text: “以敌对的态度对待我”也可译作“与我对抗”。原文这里的词含义较难确定，在本章多次出现，表示与上帝相对抗或怀有敌意的行事方式。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִתְוַדּוּ
  choice: 但他们若承认
  rationale: 该词为 ידה 的 Hitpael 完成式，意为“承认、认罪”。结合上文未完的条件结构，用“若”自然地承接语境；“但”体现本节相对于前述审判的转折。
- source_word: עֲוֺנָם וְאֶת עֲוֺן אֲבֹתָם
  choice: 自己的罪孽和祖先的罪孽
  rationale: עָוֹן 可指罪孽、罪责或罪的后果；此处指需要承认的过犯。“祖先”自然传达 אֲבֹתָם 在群体历史语境中的所指，同时保留共同体承认前代罪孽的含义。
- source_word: בְּמַעֲלָם אֲשֶׁר מָעֲלוּ בִי
  choice: 也就是他们对我不忠、背叛了我
  rationale: 名词 מַעַל 与同源动词 מעל 连用，着重表达对上帝的失信和背约。中文难以不生硬地逐字重复同源词，因此以“不忠、背叛”并列，兼顾关系性与行为力度；“也就是”表明后语说明其罪孽的具体内容。
- source_word: וְאַף אֲשֶׁר
  choice: 并且承认
  rationale: וְאַף 增添另一项所承认的事实。中文补出前文动词“承认”，使句法清楚，但不增加新的命题内容。
- source_word: הָלְכוּ עִמִּי בְּקֶרִי
  choice: 他们行事与我敌对
  rationale: הלך 在这里表示行为方式；קֶרִי 是本章反复出现且含义困难的词，语境指向对抗或敌意。“行事与我敌对”比直译“与我逆行”更自然，也保留敌对关系的力度。
theological_decisions:
- issue: 群体认罪包含祖先的罪孽
  choice: 保留“自己的罪孽和祖先的罪孽”
  alternative: 自己的罪和祖先犯罪所造成的后果
  rationale: 希伯来文直接将他们自己的 עָוֹן 与祖先的 עָוֹן 并列。译文不将祖先的罪淡化为影响或后果，也不额外解释后代如何与之相关。
- issue: מעל 的盟约性含义
  choice: 对我不忠、背叛了我
  alternative: 干犯了我／得罪了我
  rationale: 原文强调关系中的失信与背约。“不忠、背叛”保留这种神学张力，又不引入特定宗派术语。
- issue: קֶרִי 的不确定含义
  choice: 正文译作“敌对”，脚注保留“对抗”等可能性
  alternative: 偶然地／顽梗地
  rationale: 该词词义有争议，但本章的相互对应表达以及惩罚语境支持“敌对、对抗”这一语义范围；脚注明确其困难性，避免把解释包装成绝对确定的词义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“罪孽”保留道德与罪责的分量；“祖先”在现代群体历史语境中比“父辈”覆盖更准确。全节在下一节继续，因此句末用逗号。
