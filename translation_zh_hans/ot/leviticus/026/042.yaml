base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/042.yaml
  text: Then I will remember my covenant with Jacob[a], and also my covenant with Isaac, and also my covenant with Abraham I will remember; and I will remember the land.
translation:
  language: zh_hans
  text: 那时[a]，我必记念我与雅各所立的约，也必记念我与以撒所立的约；我也必记念我与亚伯拉罕所立的约，也必记念这地。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “那时”也可译作“并且”。希伯来文的连接词可单纯译为“并且”；译作“那时”体现本节与上文的衔接。
    reason: 词义与篇章衔接的翻译选择
lexical_decisions:
- source_word: וְזָכַרְתִּי
  choice: 那时，我必记念
  rationale: זכר在立约语境中不只是想起，也含有顾念并采取行动的意味；正文仍保留“记念”，不把隐含意义展开。句首וְ可译为“并且”，但结合前文悔改、偿还罪债与蒙悦纳的条件和进程，译作“那时”更自然；脚注保留直译可能。
- source_word: בְּרִיתִי
  choice: 我与……所立的约
  rationale: בְּרִית是希伯来圣经中表示“约”的标准用语。中文以“我与某人所立的约”自然表达原文“我的约—某人”的关系，同时逐一保留三次重复。
- source_word: יַעֲקֹב
  choice: 雅各
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: וְאַף
  choice: 也必／我也必
  rationale: אַף在此有递进、附加和强调作用；用“也”保留其附加意义，并以“必”配合预告性的动词语气。
- source_word: יִצְחָק
  choice: 以撒
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: אַבְרָהָם
  choice: 亚伯拉罕
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: אֶזְכֹּר
  choice: 我也必记念／并且记念
  rationale: 保留原文再次明说“记念”的修辞重复，不简化为一个统领三个名字和土地的动词。
- source_word: וְהָאָרֶץ
  choice: 并且记念这地
  rationale: אֶרֶץ在本章语境中指上帝赐给以色列、如今因他们被掳而荒凉安息的那地；“这地”比泛指的“土地”更清楚地体现其特指性。
theological_decisions:
- issue: 列祖之约的次序和强调
  choice: 保留“雅各、以撒、亚伯拉罕”的逆年代次序，并分别重复“我与……所立的约”。
  alternative: 按熟悉的年代次序改为“亚伯拉罕、以撒、雅各”，或合并为“我与亚伯拉罕、以撒、雅各所立的约”。
  rationale: 原文刻意采用雅各、以撒、亚伯拉罕的次序，并对每一位列祖重复בְּרִיתִי。照原结构翻译可保存其层层追溯和强调效果，避免以传统固定表达取代本节措辞。
- issue: 上帝“记念”的含义
  choice: 正文译为“记念”，不扩写为“记念并施行”或“更新”。
  alternative: 译作“顾念并采取行动”或“重申／更新所立的约”。
  rationale: 立约语境中的神圣记念通常指向行动，但本节只明说“记念”。保留这个词可保存原文的神学张力，不将语境含义直接写进正文。
- issue: 三个“约”是分别的约还是同一约的多次确认
  choice: 按原文逐一译为“我与……所立的约”，不在译文中判定三者的关系。
  alternative: 合并为单数的“与列祖所立的约”，或明确称为三个不同的约。
  rationale: 原文三次使用“我的约”并分别连接三位列祖，却没有在本句中系统说明这些约彼此如何关联；译文保留这种表达上的开放性。
translation_notes:
  register: 采用现代、庄重而易懂的普通话书面语。“记念”保留圣经立约语境中的庄重色彩；反复使用“我与……所立的约”以再现希伯来文的排比和强调。标点将三项列祖之约与末尾“这地”清楚区分，同时不削弱动词重复。
