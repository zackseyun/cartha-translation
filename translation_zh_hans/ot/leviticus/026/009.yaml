  text: וּ/פָנִ֣יתִי אֲלֵי/כֶ֔ם וְ/הִפְרֵיתִ֣י אֶתְ/כֶ֔ם וְ/הִרְבֵּיתִ֖י אֶתְ/כֶ֑ם וַ/הֲקִימֹתִ֥י אֶת בְּרִיתִ֖/י אִתְּ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/009.yaml
  text: And I will turn toward you and make you fruitful and multiply you[a], and I will establish my covenant with you.
translation:
  language: zh_hans
  text: 我要眷顾你们，使你们繁衍增多，并坚立我与你们的约。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “眷顾”直译为“转向”。这里指上帝带着恩惠转向他们。
    reason: 说明希伯来语的具体意象及其在赐福语境中的含义。
lexical_decisions:
- source_word: וּפָנִיתִי אֲלֵיכֶם
  choice: 我要眷顾你们
  rationale: פנה 的基本意象是“转向”，但在本节赐福语境中表示带着恩惠关注对方。汉语“眷顾”自然、庄重，并准确传达此处的语用含义；直译信息收入脚注。
- source_word: וְהִפְרֵיתִי אֶתְכֶם
  choice: 使你们繁衍
  rationale: פרה 的使役式表示使人多结果子、繁殖兴旺。对群体而言，“使你们繁衍”既自然，又保留五经赐福公式中的生育含义。
- source_word: וְהִרְבֵּיתִי אֶתְכֶם
  choice: 增多
  rationale: רבה 的使役式意为使数量增加。与“繁衍”连用为“繁衍增多”，保留希伯来语成对的赐福措辞，同时符合现代汉语表达。
- source_word: וַהֲקִימֹתִי אֶת־בְּרִיתִי אִתְּכֶם
  choice: 并坚立我与你们所立的约
  rationale: קום 的使役式与“约”连用，可表示坚立、确立或使之持续有效。由于此处面对的是已经处于约中之民，“坚立”比可能暗示首次缔约的“建立”更能保留原文语义范围；补出“所立”使汉语结构清楚，并未增添新的关系。
theological_decisions:
- issue: 是否在正文保留“转向你们”的具体意象
  choice: 正文译作“眷顾你们”，脚注注明直译
  alternative: 我要转向你们
  rationale: 上下文明确是上帝赐福性的关注。汉语直译“转向你们”容易只被理解为空间动作，不能自然传达该语境中的恩惠意味；脚注保留原文意象和可核查性。
- issue: “坚立我的约”是首次立约还是确认既有之约
  choice: 采用可涵盖确认、维持和落实之意的“坚立”
  alternative: 建立我的约；确认我的约
  rationale: 希伯来语表达本身可指设立或使约生效、坚定。经文语境不宜被译文强行限定为首次缔约或仅仅确认，因此选用语义较宽的“坚立”。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“繁衍增多”保留五经中反复出现的赐福公式；“约”沿用圣经核心术语。脚注标记置于本节句末，涵盖“眷顾”的词义说明。
