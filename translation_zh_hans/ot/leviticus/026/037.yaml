base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/037.yaml
  text: They will stumble over one another as if before a sword[a], though no one is pursuing[b]; and you will have no power to stand before your enemies.
translation:
  language: zh_hans
  text: 他们要彼此绊倒[a]，仿佛面对刀剑，虽然无人追赶；你们在仇敌面前必站立不住[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“一个人（绊）在他的弟兄身上”，这里指众人在惊慌中彼此绊跌。
    reason: lexical_alternative
  - marker: b
    text: 或译：“你们在仇敌面前必无立足之地。”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָשְׁלוּ
  choice: 跌倒
  rationale: כשל表示绊倒、踉跄或失足；结合恐慌中彼此冲撞的语境，“跌倒”保留了具体动作和溃乱的画面。
- source_word: אִישׁ בְּאָחִיו
  choice: 彼此碰撞
  rationale: 原文直译为“一个人撞在他的弟兄身上”；这里是分配式表达，描写众人在惊慌中互相冲撞。
- source_word: כְּמִפְּנֵי חֶרֶב
  choice: 如同躲避刀剑
  rationale: כְּ与מִפְּנֵי合用，字面近于“如同从刀剑面前”；“躲避”自然表达由刀剑面前退逃的动态意象，但不把它扩展为实际有人追杀。
- source_word: וְרֹדֵף אָיִן
  choice: 尽管无人追赶
  rationale: 字面为“并没有追赶者”；“尽管”清楚呈现上下文中的反差：他们惊逃如遭刀剑追逼，实际却无人追赶。
- source_word: וְלֹא תִהְיֶה לָכֶם תְּקוּמָה
  choice: 你们必站立不住
  rationale: תְּקוּמָה可指站起、立足或抵挡的能力；在与仇敌对阵的语境中，“站立不住”同时传达无法立足和无法抵挡。
- source_word: לִפְנֵי אֹיְבֵיכֶם
  choice: 在仇敌面前
  rationale: 忠实保留לִפְנֵי的空间与对抗意味，表达面对仇敌时无法站稳阵脚。
theological_decisions: []
