revisions:
- from: 我也要这样对待你们：我要使突如其来的惊恐[a]临到你们，还有消耗人的疾病[b]和热病，使你们眼目衰败、生命消损[c]。你们必徒然撒种，你们的仇敌却要吃掉所种的。
  to: 我也要这样对待你们：我要使突如其来的惊恐[a]、使人衰弱消瘦的疾病[b]和热病临到你们，使你们眼目衰败、生命消损[c]。你们必徒然撒种，你们的仇敌却要吃掉所种的。
  rationale: 仅作安全的汉语句法与措辞调整：将惊恐、疾病和热病作为同受“使……临到你们”支配的并列灾祸，并以更自然的描述性措辞表达“wasting disease”。其余译文、脚注锚点及原文保留的语义歧义均维持不变。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T04:51:27Z'
