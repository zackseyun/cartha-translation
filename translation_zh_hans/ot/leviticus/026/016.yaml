language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: אַף אֲנִ֞י אֶֽעֱשֶׂה זֹּ֣את לָ/כֶ֗ם וְ/הִפְקַדְתִּ֨י עֲלֵי/כֶ֤ם בֶּֽהָלָה֙ אֶת הַ/שַּׁחֶ֣פֶת וְ/אֶת הַ/קַּדַּ֔חַת מְכַלּ֥וֹת עֵינַ֖יִם וּ/מְדִיבֹ֣ת נָ֑פֶשׁ וּ/זְרַעְתֶּ֤ם לָ/רִיק֙ זַרְעֲ/כֶ֔ם וַ/אֲכָלֻ֖/הוּ אֹיְבֵי/כֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/016.yaml
  text: 'I also will do this to you: I will appoint over you sudden terror[a], wasting disease and fever, consuming the eyes and draining the life; and you will sow your seed in vain[c][b], and your enemies will eat it.'
translation:
  language: zh_hans
  text: 我也要这样对待你们：我要使突如其来的惊恐[a]、使人衰弱消瘦的疾病[b]和热病临到你们，使你们眼目衰败、生命消损[c]。你们必徒然撒种，你们的仇敌却要吃掉所种的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“恐慌”。这个希伯来词可指突然临到的惊惧或慌乱。
    reason: lexical_alternative
  - marker: b
    text: 这个希伯来疾病名称的确切所指不能确定，可能泛指使人日渐消瘦衰弱的疾病。
    reason: lexical_uncertainty
  - marker: c
    text: 或译：“使眼目耗尽、生命衰残。”
    reason: lexical_alternative
lexical_decisions:
- source_word: אַף אֲנִי
  choice: 我也
  rationale: 保留 אַף 与独立代词所表达的承接和强调，并以自然的现代汉语呈现。
- source_word: אֶעֱשֶׂה זֹּאת לָכֶם
  choice: 要这样对待你们
  rationale: 在审判语境中，לָכֶם 表示行动指向听者；“这样对待你们”比直译“向你们做这事”更自然。
- source_word: וְהִפְקַדְתִּי עֲלֵיכֶם
  choice: 我要使……临到你们
  rationale: 使役式 פקד 在这里表示将灾祸加在人身上；此译准确、自然，同时不把它过度限定为行政意义的“委派”。
- source_word: בֶּהָלָה
  choice: 突如其来的惊恐
  rationale: 兼顾该词的恐慌、惊惧之义及突然临到的语境色彩。
- source_word: הַשַּׁחֶפֶת
  choice: 消耗人的疾病
  rationale: 古代疾病的确切所指不明；此译传达使人日渐消瘦衰弱的病症，避免武断定为肺结核。
- source_word: הַקַּדַּחַת
  choice: 热病
  rationale: 该词指发热、灼热的病症；“热病”简洁且符合现代圣经语体。
- source_word: מְכַלּוֹת עֵינַיִם
  choice: 使你们眼目衰败
  rationale: 保留 כלה 所含耗尽、衰残之意，又使希伯来语意象在中文中清楚可懂。
- source_word: וּמְדִיבֹת נָפֶשׁ
  choice: 生命消损
  rationale: נפש 在这里指人的生命活力；此译避免将其专门解释为非物质的“灵魂”，并保留原文的衰耗含义。
- source_word: וּזְרַעְתֶּם לָרִיק זַרְעֲכֶם
  choice: 你们必徒然撒种
  rationale: לָרִיק 表示徒劳、毫无结果；“徒然撒种”忠实而简练。
- source_word: וַאֲכָלֻהוּ אֹיְבֵיכֶם
  choice: 你们的仇敌却要吃掉所种的
  rationale: 保留希伯来文的并列连接，同时用“却”表达结果上的反差；宾语后缀回指种子及其出产，译作“所种的”比“吃掉种子”更符合农业语境。
theological_decisions:
- issue: 咒诅语境中 נָפֶשׁ 的译法
  choice: 生命
  alternative: 灵魂；性命；身心
  rationale: 上下文描写疾病造成的身体衰败，נָפֶשׁ 在此最自然地指生命及活力。译作“生命”不预设身心二分的人论，也不消除该词较宽的语义范围。
- issue: 仇敌吃掉出产与徒然撒种之间的关系
  choice: 保留并列而以“却”显示反差
  alternative: 译为因果关系：“因为你们的仇敌要吃掉”
  rationale: 原文使用 waw 连接，仇敌吃掉作物在语义上说明撒种为何徒然，但语法上没有明确的因果标记；译文避免把隐含关系提升为明说的因果。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“眼目衰败、生命消损”适度保留希伯来文的平行结构和鲜明意象；疾病名称不作超出原文证据的现代医学诊断。
