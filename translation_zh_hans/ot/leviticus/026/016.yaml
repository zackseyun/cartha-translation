  source_fidelity: 译文整体忠实呈现了审判宣告、突发的惊恐、两类未作现代医学定名的病症、眼目与生命的衰耗，以及徒然撒种而被仇敌吞食的后果。将 נֶפֶשׁ 译为“生命”恰当，不引入关于“灵魂”的教义性预设；“却”虽略强化对比，仍符合上下文的结果性反差。
  naturalness: 原句“我要使突如其来的惊恐临到你们，还有消耗人的疾病和热病”中，“还有”使后两个灾病与“临到你们”的支配关系略显松散；改为将三个名词并列后统一置于“临到你们”之前，句法更自然、庄重且清楚。“消耗人的疾病”可理解，但“使人衰弱消瘦的疾病”更符合现代汉语表达，并明确其描述性而非特定诊断。
  terminology: “热病”“眼目衰败”“生命消损”“徒然撒种”均保持合宜的现代圣经语体。疾病术语保留不确定性，未将 שַׁחֶפֶת 武断译作某一种现代疾病。
