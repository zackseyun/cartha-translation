base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/028.yaml
  text: then I also will walk contrary to you in furious hostility[b][a], and I myself will discipline you sevenfold for your sins.
translation:
  language: zh_hans
  text: 我也要在烈怒中以敌对的态度对待你们[a]；我自己也必因你们的罪，加重七倍地管教你们[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译可作“在烈怒中与你们同行／行走，以相反（或敌对）的态度相待”。本章反复使用“行走”这一表达；其中“相反（或敌对）”所译的原文词含义有争议，也可译作“对抗”或“乖违”。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“因你们的罪管教你们七次”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָלַכְתִּי
  choice: 我要……行事（在整句中译作“我要……与你们为敌”）
  rationale: הלך本义为“行走”，但与עם及קֶרִי组成反复出现于本章的关系性表达。汉语若直译“行走”会生硬，因此以“与你们为敌”自然传达其对抗性的行动，同时在脚注保留较形式对应的译法。
- source_word: עִמָּכֶם
  choice: 与你们
  rationale: עם本义是“与……同在/一起”；在此与קֶרִי构成对抗性语境。“与你们为敌”既保留关系对象，也符合现代汉语。
- source_word: בַּחֲמַת
  choice: 在烈怒中
  rationale: חֵמָה指炽热的愤怒、烈怒；“在烈怒中”保留介词结构及原文强烈程度。
- source_word: קֶרִי
  choice: 为敌
  rationale: קֶרִי是本章含义困难且反复出现的词，可指敌对、抵触或相反而行。“为敌”在现代汉语中清楚自然，但不排除“以敌对相待/相反而行”等理解，故以脚注说明。
- source_word: וְיִסַּרְתִּי
  choice: 管教
  rationale: יסר可指管教、责罚或惩治。“管教”保留纠正与惩戒兼具的语义，不把经文缩减为纯粹报复性的刑罚。
- source_word: אַף אֲנִי
  choice: 我也……我必亲自
  rationale: אַף与אֲנִי共同强化主语；用“也”和“亲自”分别体现回应性与强调作用。
- source_word: שֶׁבַע
  choice: 七倍
  rationale: שֶׁבַע字面为“七”，在本章表示加重至七倍的管教。“七倍”简洁，并保留“七次”的可能译法于脚注。
- source_word: עַל חַטֹּאתֵיכֶם
  choice: 因你们的罪
  rationale: עַל在此说明管教的缘由或根据；“因你们的罪”是自然、准确的现代汉语。
theological_decisions:
- issue: 盟约咒诅中神回应的性质
  choice: 同时保留敌对与管教的措辞：神在烈怒中与百姓为敌，并因他们的罪亲自管教他们。
  alternative: 将全句统一译成纯刑罚性的“惩罚”，或弱化为一般性的“不悦”。
  rationale: 希伯来文同时使用הלך＋עם＋קֶרִי的关系性对抗表达和可含纠正意味的יסר。并列保留两者，避免把神学张力单方面解释为纯报应或加以淡化。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“烈怒”“为敌”“管教”适合盟约警告的严肃语域；避免生硬直译“行走相反”，同时用脚注保留原文惯用语的歧义。
