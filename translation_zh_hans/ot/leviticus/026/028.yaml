  naturalness: “我必亲自因你们的罪管教你们七倍”虽可理解，但语序稍显滞涩，“管教你们七倍”也容易暂时被理解为管教七个人或七次。改为“我自己也必因你们的罪，加重七倍地管教你们”更符合现代汉语，同时保留强调和加重的语义。
