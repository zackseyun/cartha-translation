source:
  edition: WLC
  text: וְ/אִ֨ם עַד אֵ֔לֶּה לֹ֥א תִשְׁמְע֖וּ לִ֑/י וְ/יָסַפְתִּי֙ לְ/יַסְּרָ֣ה אֶתְ/כֶ֔ם שֶׁ֖בַע עַל חַטֹּאתֵי/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/018.yaml
  text: And if[a], despite these things, you do not listen to me[b], then I will continue to discipline you sevenfold for your sins.
translation:
  language: zh_hans
  text: 即使经历了这一切[a]，你们还是不听从我，我就要因你们的罪，再加七倍地管教你们[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“尽管有这一切”或“经过这一切以后”。这里指尽管前述的惩罚已经临到。
    reason: lexical_alternative
  - marker: b
    text: 或译：“七次”。原文可能表示管教大大加重，不一定是严格计算的次数。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: 即使……还是
  rationale: 承接前文并引出条件；与 עַד אֵלֶּה 合译为自然的让步条件句。
- source_word: עַד אֵלֶּה
  choice: 经历了这一切
  rationale: 在本段语境中指先前的惩罚已经临到，而百姓仍不听从；结合“即使”表达“不顾这一切”的含义，避免误解为单纯的时间终点。
- source_word: לֹא תִשְׁמְעוּ לִי
  choice: 不听从我
  rationale: 既保留“听”的意象，也自然包含作出顺服回应的含义。
- source_word: וְיָסַפְתִּי
  choice: 继续
  rationale: 表达 יסף 所含的追加、进一步施行之意，并与前文已经发生的管教相连。
- source_word: לְיַסְּרָה אֶתְכֶם
  choice: 管教你们
  rationale: “管教”同时保留纠正与惩戒的力度，符合盟约警告的语境。
- source_word: שֶׁבַע
  choice: 加重七倍
  rationale: 将作副词使用的“七”理解为惩罚程度的强化；“加重”使现代汉语清楚自然，同时脚注保留数量性理解。
- source_word: עַל חַטֹּאתֵיכֶם
  choice: 因你们的罪
  rationale: 准确表达 עַל 在此所说明的原因或依据。
theological_decisions:
- issue: 盟约咒诅语境中 יָסַר 的性质
  choice: 管教
  alternative: 惩罚；责打
  rationale: 此处制裁具有惩罚性，也带有纠正目的；“管教”保留这种张力，既不淡化刑罚，也不将其缩减为纯粹报应。
- issue: שֶׁבַע 是程度强化还是严格次数
  choice: 正文译作“加重七倍”
  alternative: 七次
  rationale: 审判公式中的“七”可表示完全或强化的程度，但原文也容许较严格的数量理解，因此不在脚注中排除“七次”。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“即使……还是……”清楚呈现让步条件；“听从”兼顾听见与顺服；“管教”保留纠正和惩戒并存的盟约语义。所有脚注标记均置于正文相应位置。
