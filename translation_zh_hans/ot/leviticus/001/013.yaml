id: LEV.1.13
reference: Leviticus 1:13
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/הַ/קֶּ֥רֶב וְ/הַ/כְּרָעַ֖יִם יִרְחַ֣ץ בַּ/מָּ֑יִם וְ/הִקְרִ֨יב הַ/כֹּהֵ֤ן אֶת הַ/כֹּל֙ וְ/הִקְטִ֣יר הַ/מִּזְבֵּ֔חָ/ה עֹלָ֣ה ה֗וּא אִשֵּׁ֛ה רֵ֥יחַ נִיחֹ֖חַ לַ/יהוָֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/001/013.yaml
  text: But he shall wash the entrails and the legs with water[a], and the priest shall present all of it and turn it into smoke on the altar. It is a burnt offering, a food offering, a pleasing aroma to Yahweh.
translation:
  language: zh_hans
  text: 内脏和腿要用水洗净；祭司要把这一切献上，在祭坛上焚烧成烟。这是燔祭，是献给耶和华的火祭[a]，有蒙悦纳的香气。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“用火献的祭物”。
    reason: 保留 אִשֵּׁה 更展开的字面表达；标记置于“火祭”之后，与所注词语准确对应。
lexical_decisions:
- source_word: הַקֶּרֶב
  choice: 内脏
  rationale: 在献祭语境中指祭牲内部的脏器；“内脏”具体、自然。
- source_word: הַכְּרָעַיִם
  choice: 腿
  rationale: 指祭牲的腿部，可能尤指小腿；正文用普通读者易懂的“腿”，不作超出原文的细分。
- source_word: יִרְחַץ בַּמָּיִם
  choice: 要用水洗净
  rationale: 保留“用水”的工具性短语；“洗净”符合中文礼仪程序的表达。
- source_word: וְהִקְרִיב
  choice: 要把……献上
  rationale: 使役形在献祭语境中表示带近、呈献；“献上”既自然，又与随后专指焚烧的动词有所区分。
- source_word: אֶת־הַכֹּל
  choice: 这一切
  rationale: 指前文已处理好的祭牲全部部分，保留整体性。
- source_word: וְהִקְטִיר
  choice: 焚烧成烟
  rationale: 该献祭动词不只是一般的焚烧，而有使祭物化烟上升之意；此译法保留其礼仪色彩。
- source_word: הַמִּזְבֵּחָה
  choice: 在祭坛上
  rationale: 按希伯来语方向后缀在此语境中的常规功能，译明焚烧发生于祭坛上。
- source_word: עֹלָה
  choice: 燔祭
  rationale: 这是该祭类在中文圣经传统中稳定且准确的名称，也体现祭物全然焚烧的特征。
- source_word: אִשֵּׁה
  choice: 火祭
  rationale: 保留词语与火相关的祭祀含义，避免将有争议的词源或“食物”观念直接写入正文。
- source_word: רֵיחַ נִיחֹחַ
  choice: 蒙悦纳的香气
  rationale: 既保留“香气”的感官比喻，也表达 ניחוח 在献祭语境中的悦纳含义，而不把比喻化约为纯抽象陈述。
- source_word: לַיהוָה
  choice: 献给耶和华
  rationale: 直接呈现希伯来专名 יהוה；介词 ל 表明祭物归向、献给耶和华。
theological_decisions:
- issue: רֵיחַ נִיחֹחַ 的拟人化献祭语言
  choice: 有蒙悦纳的香气
  alternative: 有馨香的气味／有使人舒畅的香气
  rationale: 译文保留原文以气味描述神悦纳祭物的比喻，同时不将其解释成关于神之生理感官的断言。
- issue: אִשֵּׁה 的含义
  choice: 火祭
  alternative: 用火献的祭物／食物祭
  rationale: 该词确与献祭之火相关，但其具体词源和是否含“食物”观念存在讨论；正文采用较透明的“火祭”，脚注补充更展开的直译可能。
- issue: עֹלָה הוּא 的指称
  choice: 这是燔祭
  alternative: 它是燔祭
  rationale: 用“这”承接整项献祭程序，不额外限定代词究竟只指祭牲还是整个祭礼。
translation_notes:
  register: 采用现代、庄重而易懂的礼仪语言。“内脏”“腿”“洗净”保持具体；“燔祭”“祭坛”保留必要且通行的祭祀术语。分号呈现清洗与祭司献烧两个连续步骤；不补明“他”是谁，以免替原文解决其承前主语。
