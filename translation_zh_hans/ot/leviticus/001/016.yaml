base_translation:
  language: en
  yaml_path: translation/ot/leviticus/001/016.yaml
  text: He shall remove its crop with its feathers and throw it beside the altar[a], on the east side[b], to the place of the ashes.
translation:
  language: zh_hans
  text: 祭司要除去鸟的嗉囊[a]，连同羽毛[b]，把它扔到祭坛旁边，就是东面倒灰的地方。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “嗉囊”或译“嗉子”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文作“连同它的羽毛”；有些译本译作“连同其中的污物”。
    reason: alternative_reading
lexical_decisions:
- source_word: וְהֵסִיר
  choice: 祭司要除去
  rationale: 使役式在这里表示将某物去除；根据连续的献祭规程补出主语“祭司”，使现代汉语表达自然，同时保留指令语气。
- source_word: מֻרְאָתוֹ
  choice: 鸟的嗉囊
  rationale: 在鸟类献祭的语境中，此词指鸟的嗉囊；“嗉囊”是准确而通行的现代汉语解剖名称。
- source_word: בְּנֹצָתָהּ
  choice: 连同羽毛
  rationale: 该短语有解释上的困难；其辅音形式最自然地与“羽毛、羽衣”有关，因此正文采用“连同羽毛”，并以脚注保留“污物”的传统解释。
- source_word: וְהִשְׁלִיךְ אֹתָהּ
  choice: 把它扔到
  rationale: שלך的使役式常指扔、抛；“扔到”直接自然，阴性单数代词“它”指前面被除去之物。
- source_word: אֵצֶל הַמִּזְבֵּחַ
  choice: 祭坛旁边
  rationale: אֵצֶל表示在某物旁边或近旁；此译准确保留空间关系。
- source_word: קֵדְמָה
  choice: 东面
  rationale: 方向副词表示向东或位于东侧；结合地点说明译作“东面”最符合现代汉语。
- source_word: אֶל מְקוֹם הַדָּשֶׁן
  choice: 倒灰的地方
  rationale: דֶּשֶׁן在献祭语境中可指从祭坛清出的灰；“倒灰的地方”清楚表达指定处所，又不额外限定灰的性质。
theological_decisions: []
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。以“就是”连接“祭坛旁边”和“东面倒灰的地方”，清楚呈现原文连续的地点限定；对难解的בְּנֹצָתָהּ在正文采用最直接的词源意义，并在脚注保留另一种传统译法。
