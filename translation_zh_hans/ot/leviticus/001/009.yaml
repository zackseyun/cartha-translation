  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/קִרְבּ֥/וֹ וּ/כְרָעָ֖י/ו יִרְחַ֣ץ בַּ/מָּ֑יִם וְ/הִקְטִ֨יר הַ/כֹּהֵ֤ן אֶת הַ/כֹּל֙ הַ/מִּזְבֵּ֔חָ/ה עֹלָ֛ה אִשֵּׁ֥ה רֵֽיחַ נִיח֖וֹחַ לַֽ/יהוָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/001/009.yaml
  text: But he shall wash its entrails and its legs with water[a], and the priest shall turn all of it into smoke on the altar, a burnt offering, a food offering[c][b], a pleasing aroma to Yahweh.
translation:
  language: zh_hans
  text: 但他要用水洗净内脏和腿；祭司要把这一切放在祭坛上焚烧成烟，作为燔祭，是献给耶和华的火祭[a]，成为蒙悦纳的馨香[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “火祭”也可译作“经火献上的祭物”；另有学者理解为“食物祭”。
    reason: lexical_alternative
  - marker: b
    text: “蒙悦纳的馨香”直译为“令人愉悦（或安抚）的香气”，是献祭礼仪中的固定用语，表示祭物蒙耶和华悦纳。
    reason: cultural_note
lexical_decisions:
- source_word: קִרְבּוֹ
  choice: 内脏
  rationale: 在献祭语境中指牲畜的内部器官；“内脏”具体、自然，也符合用水清洗的动作。
- source_word: כְרָעָיו
  choice: 腿
  rationale: 指牲畜的下肢；“腿”是现代汉语中清楚易懂的表达，不必采用较生僻的专门术语。
- source_word: יִרְחַץ בַּמָּיִם
  choice: 用水洗净
  rationale: 忠实表达“洗”和介词所指的用水方式；“洗净”符合中文礼仪语境，但不额外规定清洗方法。
- source_word: וְהִקְטִיר
  choice: 焚烧成烟
  rationale: 该动词在祭祀语境中特指使祭物在坛上焚烧、化为烟气上升，比单说“烧”更能体现其礼仪含义。
- source_word: אֶת־הַכֹּל
  choice: 这一切
  rationale: 保留原文对整体性的强调，指按规定处理后的全部祭牲。
- source_word: הַמִּזְבֵּחָה
  choice: 放在祭坛上
  rationale: 希伯来语方向词尾在此按中文习惯表达为祭物被置于坛上焚烧；措辞自然且不改变动作地点。
- source_word: עֹלָה
  choice: 燔祭
  rationale: 这是该类祭物在中文圣经传统中通行且准确的名称，也保留祭物整体焚献的礼仪背景。
- source_word: אִשֵּׁה
  choice: 火祭
  rationale: 该词的准确语义存在讨论；正文采用直接而简洁的“火祭”，并以脚注保留“经火献上的祭物”及“食物祭”的可能理解。
- source_word: רֵיחַ נִיחוֹחַ
  choice: 蒙悦纳的馨香
  rationale: 保留原文的嗅觉隐喻，同时以“蒙悦纳”传达这一固定献祭用语所表示的悦纳含义，避免暗示神具有物质性的需要。
- source_word: לַיהוָה
  choice: 献给耶和华
  rationale: ל־既可与“馨香”相连理解为“对耶和华而言”，也可在整个祭祀短语中表达祭物献给耶和华；中文措辞自然地保留其指向。
- source_word: יהוה
  choice: 耶和华
  rationale: 采用现代简体中文圣经读者最熟悉的专名形式，明确呈现原文的神名，而不以泛称“主”取代。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 耶和华
  alternative: 雅威；上主
  rationale: 原文直接使用四字神名。正文采用中文读者广泛熟悉的“耶和华”，既作为专名呈现，也不以“主”消解原文的专名性质。
- issue: אִשֵּׁה 的语义
  choice: 火祭
  alternative: 经火献上的祭物；食物祭
  rationale: 词义及其与“火”的关系有讨论。正文不把它确定解释成神所需的“食物”，而以脚注诚实保留主要可能译法。
- issue: רֵיחַ נִיחוֹחַ 的献祭隐喻
  choice: 蒙悦纳的馨香
  alternative: 令人愉悦的香气；安抚的香气
  rationale: 保留原文的香气意象，并提示这是表示祭物蒙神悦纳的固定祭祀用语，不将其解释成机械性的安抚作用。
- issue: לַיהוָה 的句法关联
  choice: 献给耶和华
  alternative: 对耶和华而言是蒙悦纳的馨香
  rationale: 介词短语可与邻近的“馨香”紧密相连，也可理解为整个祭物献给耶和华。正文采用流畅的整体指向，脚注说明固定用语的含义，未排斥较窄的句法理解。
translation_notes:
  register: 采用庄重而清楚的现代标准普通话。“焚烧成烟”保留祭祀动词的特定含义；“燔祭”“祭坛”沿用读者熟悉且准确的礼仪术语。正文保持原文连续的同位说明结构，同时用标点使中文易读。
