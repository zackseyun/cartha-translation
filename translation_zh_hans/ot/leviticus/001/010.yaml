  text: וְ/אִם מִן הַ/צֹּ֨אן קָרְבָּנ֧/וֹ מִן הַ/כְּשָׂבִ֛ים א֥וֹ מִן הָ/עִזִּ֖ים לְ/עֹלָ֑ה זָכָ֥ר תָּמִ֖ים יַקְרִיבֶֽ/נּוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/001/010.yaml
  text: And if his offering is from the flock, from the sheep or from the goats, for a burnt offering, he shall offer it, a male without blemish.
translation:
  language: zh_hans
  text: 如果他的供物是从羊群中取的，就是从绵羊或山羊中取的，若要献作燔祭[a]，就要献上一只没有残疾的雄性祭牲[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “献作燔祭”也可译作“作为燔祭献上”。
    reason: lexical_alternative
  - marker: b
    text: “没有残疾”指祭牲身体上没有缺陷；这是献这种祭所要求的条件。
    reason: cultural_note
lexical_decisions:
- source_word: וְאִם
  choice: 如果
  rationale: 承接前文并引出另一种条件情形；现代汉语中省去生硬的“并且”更自然，条件关系仍然清楚。
- source_word: מִן הַצֹּאן
  choice: 从羊群中取的
  rationale: צֹאן是绵羊和山羊等小型家畜的集合称呼，后文再明确分为绵羊或山羊。
- source_word: קָרְבָּנוֹ
  choice: 他的供物
  rationale: קָרְבָּן指在敬拜中带来献上的礼物或祭物；“供物”既保留较宽泛的祭祀用语，也不与本句特定的“燔祭”混同。
- source_word: מִן הַכְּשָׂבִים א֥וֹ מִן הָעִזִּים
  choice: 无论绵羊或山羊
  rationale: 准确呈现羊群中的两个类别，不把כְּשָׂבִים过度缩窄为幼羊。
- source_word: לְעֹלָה
  choice: 献作燔祭
  rationale: עֹלָה是整只焚烧献上的祭类；“献作”自然表达介词לְ在此处的用途或身份关系。
- source_word: זָכָר תָּמִים
  choice: 一只没有残疾的公羊
  rationale: 保留祭牲必须为雄性且无身体缺陷的双重要求；在绵羊或山羊的语境中，“公羊”可自然统称雄性的羊。
- source_word: יַקְרִיבֶנּוּ
  choice: 就要献
  rationale: קרב的使役式在献祭语境中意为呈献；“就要献”清楚表达规条所要求的行动。
theological_decisions:
- issue: 祭名עֹלָה的译法
  choice: 燔祭
  alternative: 升献祭
  rationale: “燔祭”是现代中文圣经语境中清楚而稳定的祭类名称，也反映祭牲焚烧献上的性质；不以词源性的“上升”强行限定其神学含义。
- issue: 祭牲的性别要求
  choice: 公羊
  alternative: 雄性
  rationale: 原文明确规定祭牲为雄性，译文保留这一具体要求，而不作性别中和处理。
- issue: תָּמִים在献祭法规中的含义
  choice: 没有残疾
  alternative: 完全的
  rationale: 此处首先指祭牲在身体上没有缺陷；译作“完全的”可能被误解为抽象或道德上的完美。
translation_notes:
  register: 采用现代、庄重而易懂的法规体。保留“供物”“燔祭”等必要的礼仪术语，并以脚注说明可选表达及祭牲无残疾的文化背景。
