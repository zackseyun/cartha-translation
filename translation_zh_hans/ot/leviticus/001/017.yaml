id: LEV.1.17
reference: Leviticus 1:17
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/שִׁסַּ֨ע אֹת֣/וֹ בִ/כְנָפָי/ו֮ לֹ֣א יַבְדִּיל֒ וְ/הִקְטִ֨יר אֹת֤/וֹ הַ/כֹּהֵן֙ הַ/מִּזְבֵּ֔חָ/ה עַל הָ/עֵצִ֖ים אֲשֶׁ֣ר עַל הָ/אֵ֑שׁ עֹלָ֣ה ה֗וּא אִשֵּׁ֛ה רֵ֥יחַ נִיחֹ֖חַ לַ/יהוָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/001/017.yaml
  text: He shall tear it open by its wings[a], but he shall not divide it; and the priest shall burn it on the altar, on the wood that is on the fire. It is a burnt offering, a food offering, a pleasing aroma to Yahweh.
translation:
  language: zh_hans
  text: 他要从鸟的两翼处把它撕开，却不可完全分断。祭司要在坛上、在火上的柴上把它焚烧献上。这是燔祭，是献给雅威的火祭[a]，是使雅威喜悦的馨香。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “火祭”也可译为“火献祭”或“借火献上的祭物”；有些解释将此词理解为“献给神的食物”。
    reason: 保留希伯来语אִשֶּׁה的解释空间，同时准确反映其在祭祀语境中的主要译法与另一种相关理解。
lexical_decisions:
- source_word: וְשִׁסַּע אֹתוֹ בִכְנָפָיו
  choice: 从鸟的两翼处把它撕开
  rationale: שׁסע表示撕开或劈开；בִכְנָפָיו可指动作的位置或所借助的部位。“从鸟的两翼处把它撕开”保留具体意象，并与下句不可完全分断相衔接。
- source_word: לֹא יַבְדִּיל
  choice: 却不可完全分断
  rationale: בדל的使役式表示分开；上下文要求把鸟撕开但不使两部分彻底分离，因此补出“完全”以清楚表达动作界限。
- source_word: וְהִקְטִיר אֹתוֹ
  choice: 焚烧献上
  rationale: 在祭祀语境中，קטר使役式不只是一般焚烧，也指在坛上焚烧，使祭物化为烟而献上。“焚烧献上”兼顾动作与礼仪功能。
- source_word: עַל הָעֵצִים אֲשֶׁר עַל הָאֵשׁ
  choice: 火上面的柴上
  rationale: 保留原文两次עַל所呈现的坛上层次关系，不改写为更宽泛的表达。
- source_word: עֹלָה
  choice: 燔祭
  rationale: 这是利未记中此祭类的通行、准确中文名称，表达祭物在坛上全部焚烧献上的礼仪性质。
- source_word: אִשֶּׁה
  choice: 火祭
  rationale: 该词在祭祀语境中通常与火有关，但词源和具体含义存在讨论。“火祭”简洁保留这一联系，并用脚注说明另一种理解。
- source_word: רֵיחַ נִיחֹחַ
  choice: 使他喜悦的香气
  rationale: ניחוח在固定祭祀短语中表达蒙神悦纳或使神喜悦；此译保留香气隐喻及神喜悦祭物的含义，语言自然。
- source_word: לַיהוָה
  choice: 献给雅威
  rationale: 介词ל表达献祭的对象或方向；“献给”符合祭祀语境。יהוה按其专名译作“雅威”。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名。译作“雅威”以专名形式呈现该盟约之名，而不以头衔代替。
- issue: רֵיחַ נִיחֹחַ所表达的祭祀意义
  choice: 使他喜悦的香气
  alternative: 蒙悦纳的馨香
  rationale: 选择主动表达以贴近短语通常所传达的“使雅威喜悦”，同时保留原文感官隐喻，不引入经文未明说的后期神学范畴。
- issue: אִשֶּׁה的含义
  choice: 火祭
  alternative: 献物／食物祭
  rationale: 该词传统上被理解为与火相关的祭物，但也有人依据相关词形和祭物被称为神的食物而采取其他解释。正文采用语境上最直接的“火祭”，脚注保留不确定性。
translation_notes:
  register: 采用现代、庄重而易懂的礼仪用语。“撕开”“完全分断”清楚呈现操作步骤；“燔祭”“坛”沿用普通中文读者熟悉的圣经祭祀术语。正文中的脚注标记[a]与脚注完全对应。
