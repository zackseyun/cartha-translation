  to: 他要从鸟的两翼处把它撕开，却不可完全分断。祭司要在坛上、在火上的柴上把它焚烧献上。这是燔祭，是献给雅威的火祭[a]，是使雅威喜悦的馨香。
  rationale: 修订使“焚烧献上”直接对应וְהִקְטִיר，保留原文“在坛上／在火上的柴上”的层次；将末句的代词明确为“雅威”；并收紧脚注措辞，既不把有争议的词义定死，也不以过于笼统的“献物”弱化祭祀语境。其余关键术语与原有译法均可保留。
