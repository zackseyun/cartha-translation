  text: And the sons of Aaron the priest shall put fire on the altar and arrange wood on the fire[a].
translation:
  language: zh_hans
  text: 祭司亚伦的儿子们要把火放在祭坛上，把柴摆在火上。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְנָתְנוּ
  choice: 要把……放在
  rationale: נתן在此指放置；结合祭祀条例的程序性语境，用“要”表达指令作用。
- source_word: בְּנֵי אַהֲרֹן הַכֹּהֵן
  choice: 祭司亚伦的儿子们
  rationale: 将单数同位语הַכֹּהֵן理解为修饰亚伦，即“祭司亚伦”，同时保留由他的儿子们执行动作的信息。
- source_word: אֵשׁ
  choice: 火
  rationale: 此处指祭坛上实际使用的火，按字面译出。
- source_word: עַל הַמִּזְבֵּחַ
  choice: 在祭坛上
  rationale: 自然表达火被放置于祭坛之上的位置。
- source_word: וְעָרְכוּ
  choice: 排列
  rationale: ערך在礼仪语境中含有按次序摆放、安排妥当之意；“排列”简洁保留这种秩序性。
- source_word: עֵצִים
  choice: 柴
  rationale: 这里指供燃烧使用的木料；现代汉语用“柴”比笼统的“木头”更符合祭坛生火的具体语境。
- source_word: עַל הָאֵשׁ
  choice: 在火上
  rationale: 直译重复的介词结构，保留原文动作顺序和空间关系。
