source:
  edition: WLC
  text: וְ/שָׁחַ֨ט אֹת֜/וֹ עַ֣ל יֶ֧רֶךְ הַ/מִּזְבֵּ֛חַ צָפֹ֖נָ/ה לִ/פְנֵ֣י יְהוָ֑ה וְ/זָרְק֡וּ בְּנֵי֩ אַהֲרֹ֨ן הַ/כֹּהֲנִ֧ים אֶת דָּמ֛/וֹ עַל הַ/מִּזְבֵּ֖חַ סָבִֽיב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/001/011.yaml
  text: And he shall slaughter it on the north side of the altar before Yahweh[a], and Aaron’s sons, the priests, shall throw its blood against the altar all around.
translation:
  language: zh_hans
  text: 他要在祭坛的北边、在雅威面前宰杀它；亚伦的子孙，就是祭司，要把它的血泼[a]在祭坛的四边。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“把它的血甩在祭坛的四边”。原文动词含有用力投掷、泼出的意思，并非轻轻洒落。
    reason: 说明血礼动词的力度，并保留“甩”这一可能译法。
lexical_decisions:
- source_word: וְשָׁחַט
  choice: 宰杀
  rationale: 这是献祭语境中宰杀牲畜的专门动词，比泛指的“杀”更准确，也符合礼仪条例的庄重语体。
- source_word: יֶרֶךְ הַמִּזְבֵּחַ צָפֹנָה
  choice: 祭坛北边
  rationale: יֶרֶךְ本义为“侧面、边”，צָפֹנָה指向北方；合起来自然表达为“祭坛北边”。
- source_word: לִפְנֵי יְהוָה
  choice: 在雅威面前
  rationale: 保留“在……面前”的祭仪表达，表示在雅威临在之处。
- source_word: וְזָרְקוּ
  choice: 泼
  rationale: זרק表示投、掷，在血礼中指将血有力地泼向祭坛；“泼”比“洒”更能体现动作力度，同时符合现代汉语表达。
- source_word: בְּנֵי אַהֲרֹן הַכֹּהֲנִים
  choice: 亚伦的子孙作祭司的
  rationale: 既保留“亚伦的子孙”这一血统身份，也表达同位成分“祭司”，避免把二者合并得过于笼统。
- source_word: דָּמוֹ
  choice: 它的血
  rationale: 后缀所指是被宰杀的祭牲；现代汉语以“它”指动物，清楚自然。
- source_word: עַל הַמִּזְבֵּחַ סָבִיב
  choice: 在祭坛四周
  rationale: 结合זרק理解为把血泼到祭坛周围各面；“祭坛四周”保留סָבִיב所表达的环绕范围。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；“雅威”较贴近学界通行的复原读音，并保留其作为专名的性质，而不以称号取代。
translation_notes:
  register: 采用现代、庄重而易懂的礼仪条例语体。“要”体现指令性质；分号区分献祭者宰杀与祭司处理血的两个连续动作。
