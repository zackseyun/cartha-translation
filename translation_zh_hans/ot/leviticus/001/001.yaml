  text: וַ/יִּקְרָ֖א אֶל מֹשֶׁ֑ה וַ/יְדַבֵּ֤ר יְהוָה֙ אֵלָ֔י/ו מֵ/אֹ֥הֶל מוֹעֵ֖ד לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/001/001.yaml
  text: Then Yahweh called to Moses and spoke to him from the tent of meeting[a], saying,
translation:
  language: zh_hans
  text: 雅威[a]呼唤摩西，又从会幕中对他说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“耶和华”。希伯来文使用神的名字יהוה（YHWH）。
    reason: 提供四字神名的传统中文译法，并说明原文用的是神名。
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: 呼唤
  rationale: קרא在这里引出神对摩西的讲话。“呼唤”自然表达向某人发声，同时不加入“召来”所可能暗含的命令意味。
- source_word: אֶל־מֹשֶׁה
  choice: 摩西
  rationale: 在“呼唤摩西”这一现代汉语结构中，无须另译介词אֶל；“摩西”采用通行中文译名。
- source_word: וַיְדַבֵּר
  choice: 又……说
  rationale: דבר表示讲话；译作“说”符合现代汉语习惯，并与后面的引语自然衔接。“又”承接前一动作，反映叙事连接词וַ。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按四字神名יהוה的常见学术拟音译出其专名性质，不以“主”等称号替代。
- source_word: אֵלָיו
  choice: 对他说
  rationale: 介词和第三人称单数后缀回指摩西；“对他说”准确且自然。
- source_word: מֵאֹהֶל מוֹעֵד
  choice: 从会幕中
  rationale: אֹהֶל מוֹעֵד直指作为约定相会之处的帐幕。“会幕”是简洁、通行且不额外增添建筑含义的中文表达；“从……中”保留声音发出的方位。
- source_word: לֵאמֹר
  choice: ：
  rationale: 该不定式用于引出随后讲话的内容。现代汉语以冒号引出直接引语，比机械重复“说：”更自然，同时保留其篇章功能。
- source_word: וַ
  choice: 又
  rationale: 第二个叙事连接词表示动作承接。句首连接词在现代汉语中可不明译，以免生硬；“又”清楚呈现呼唤与讲话的连续关系。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名，而非“主”这一称号。正文用“雅威”表达较接近YHWH的拟音；脚注保留汉语传统形式“耶和华”，不把两者误解为不同对象。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“会幕”为普通读者熟悉的圣经用语；以冒号承接下一节的讲话内容，避免照搬希伯来语公式而形成重复、生硬的中文。
