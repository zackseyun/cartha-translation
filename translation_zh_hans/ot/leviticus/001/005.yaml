id: LEV.1.5
reference: Leviticus 1:5
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/שָׁחַ֛ט אֶת בֶּ֥ן הַ/בָּקָ֖ר לִ/פְנֵ֣י יְהוָ֑ה וְ֠/הִקְרִיבוּ בְּנֵ֨י אַהֲרֹ֤ן הַֽ/כֹּֽהֲנִים֙ אֶת הַ/דָּ֔ם וְ/זָרְק֨וּ אֶת הַ/דָּ֤ם עַל הַ/מִּזְבֵּ֨חַ֙ סָבִ֔יב אֲשֶׁר פֶּ֖תַח אֹ֥הֶל מוֹעֵֽד־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/001/005.yaml
  text: And he shall slaughter the young bull before Yahweh[a], and Aaron’s sons, the priests, shall present the blood and throw the blood against the altar all around[b], which is at the entrance of the tent of meeting.
translation:
  language: zh_hans
  text: 他要在雅威面前宰杀那头公牛[a]。亚伦的儿子们，即祭司们，要献上这血，并向位于会幕入口处的祭坛四面泼血[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “公牛”字面为“牛群之子”，是指牛类牲畜的希伯来语惯用说法。
    reason: lexical_alternative
  - marker: b
    text: “泼血”也可译作“泼洒”，或按传统译作“洒在”。希伯来语动词表示把血投出、泼出，用于礼仪性的施血。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁחַט
  choice: 要宰杀
  rationale: 在祭牲规程中，该完成式具有指示、规定的语气；“宰杀”比一般的“杀死”更准确地表达礼仪中的屠宰。
- source_word: בֶּן הַבָּקָר
  choice: 那头公牛犊
  rationale: 字面为“牛群之子”，是指牛类牲畜的惯用表达；结合上文所规定的雄性祭牲，译作“公牛犊”自然且具体，同时以脚注保留字面信息。
- source_word: לִפְנֵי יְהוָה
  choice: 在雅威面前
  rationale: 保留希伯来文常见的空间及礼仪表达，表明宰杀是在雅威临在之处进行。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常用的音译呈现四字神名，而不以称号“主”替代专名。
- source_word: וְהִקְרִיבוּ
  choice: 要献上
  rationale: 使役词形的基本意思是“使靠近、呈上”；在祭司处理血的语境中，“献上”庄重自然，又不把它误解为再次宰献整只祭牲。
- source_word: בְּנֵי אַהֲרֹן הַכֹּהֲנִים
  choice: 亚伦的儿子们，就是祭司们
  rationale: 保留亲属称谓与同位说明，清楚表明此时处理血的是担任祭司的亚伦众子。
- source_word: וְזָרְקוּ
  choice: 把血泼向
  rationale: זרק表示投、掷或泼出；“泼向”比“洒”更能体现施血动作的力度，也与介词עַל所表达的朝向或接触相配。
- source_word: עַל הַמִּזְבֵּחַ סָבִיב
  choice: 泼向……祭坛的四周
  rationale: 表达血施在祭坛四面的动作，避免让读者误以为只是泼在祭坛周边的地面上。
- source_word: אֲשֶׁר פֶּתַח אֹהֶל מוֹעֵד
  choice: 会幕入口处那座祭坛
  rationale: 将希伯来文关系从句自然整合进汉语定语结构，同时明确该地点说明修饰祭坛。
- source_word: אֹהֶל מוֹעֵד
  choice: 会幕
  rationale: 这是现代中文圣经语体中通行且简洁的名称；其字面义为“相会之帐幕”。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。音译“雅威”保留其专名性质；“耶和华”是传统音译，“主”则是替代性称号。
- issue: 祭司与献祭者的分工
  choice: 由献祭者宰杀，由亚伦的儿子们处理血
  alternative: 将全部动作笼统归于祭司
  rationale: 原文先以第三人称单数指献祭者宰杀，随后转为复数，明确由亚伦众子、即祭司献上并施用血；译文保留这一主语转换。
translation_notes:
  register: 采用现代、庄重而清楚的礼仪叙述语体。句子在主语转换处断开，以便普通读者看清献祭者与祭司的不同职责；“泼向”保留原文动作力度，“会幕”采用通行中文术语。
