revisions:
- from: 他要在雅威面前宰杀那头公牛犊[a]。亚伦的儿子们，就是祭司们，要献上这血，并把血泼向会幕入口处那座祭坛的四周[b]。
  to: 他要在雅威面前宰杀那头公牛[a]。亚伦的儿子们，即祭司们，要献上这血，并向位于会幕入口处的祭坛四面泼血[b]。
  rationale: 修订仅处理两处安全且必要的词义与汉语表达问题：以“公牛”避免“公牛犊”的年龄过度限定；以“向……祭坛四面泼血”明确血是施于祭坛四面，而非泼在祭坛周围。其余内容保留原译对神名、祭司身份和仪式动作的处理。
