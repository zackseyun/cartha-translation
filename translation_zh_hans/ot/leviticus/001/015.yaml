  text: וְ/הִקְרִיב֤/וֹ הַ/כֹּהֵן֙ אֶל הַ/מִּזְבֵּ֔חַ וּ/מָלַק֙ אֶת רֹאשׁ֔/וֹ וְ/הִקְטִ֖יר הַ/מִּזְבֵּ֑חָ/ה וְ/נִמְצָ֣ה דָמ֔/וֹ עַ֖ל קִ֥יר הַ/מִּזְבֵּֽחַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/001/015.yaml
  text: And the priest shall bring it to the altar[a], and pinch off its head and burn it on the altar[b], and its blood shall be drained out on the side of the altar.
translation:
  language: zh_hans
  text: 祭司要把鸟带到祭坛那里，掐断它的头[a]，并在坛上焚烧；它的血要挤到祭坛的侧面上[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “掐断”也可译作“扭断”；原文是祭司宰杀献祭之鸟的专门用语。
    reason: lexical_alternative
  - marker: b
    text: 直译“在祭坛的壁上”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרִיבוֹ
  choice: 把鸟带到
  rationale: קרב 的使役式表示使之靠近、带到或呈到；下接 אֶל הַמִּזְבֵּחַ，具体表达移向祭坛的动作。“鸟”承接上文，比单用“它”更清楚。
- source_word: הַכֹּהֵן
  choice: 祭司
  rationale: 祭祀律例中 כֹּהֵן 的标准现代汉语译法。
- source_word: אֶל הַמִּזְבֵּחַ
  choice: 祭坛前
  rationale: אֶל 表示朝向或到达；“带到祭坛前”符合汉语习惯，也避免误解为把活鸟放到坛面上。
- source_word: וּמָלַק
  choice: 掐断
  rationale: מלק 是处理鸟祭时的专门动词，指祭司用手掐断或扭断鸟头。“掐断”具体、简明；脚注保留“扭断”这一可能译法及术语性质。
- source_word: אֶת רֹאשׁוֹ
  choice: 它的头
  rationale: 直译宾语，所指为献祭之鸟的头。
- source_word: וְהִקְטִיר
  choice: 焚烧
  rationale: 祭祀语境中的 קטר 指在坛上焚烧，使祭物化为烟上升。“焚烧”比一般的“烧”更庄重，并保留希伯来文未明说宾语的特点，不擅自判定所烧的是鸟头还是整只鸟。
- source_word: הַמִּזְבֵּחָה
  choice: 在坛上
  rationale: 此处带方向词尾的形式在祭祀语境中自然表示在祭坛那里、祭坛之上进行焚烧；现代汉语以“在坛上”最简洁。
- source_word: וְנִמְצָה
  choice: 要挤在
  rationale: מצה 的被动式在此表示血因挤压而流出或被挤出。汉语主动式“把血挤在”虽可更明确施事，但原文未明说施事；“血要挤在”以祭祀律例式表达保留这一点，并传达挤出而非自然滴尽。
- source_word: דָמוֹ
  choice: 鸟的血
  rationale: 指这只鸟的血；重现名词“鸟”可避免连续代词在汉语中指代含混。
- source_word: עַל קִיר הַמִּזְבֵּחַ
  choice: 在祭坛的侧面
  rationale: קִיר 字面为“墙、壁”；用于祭坛时，“侧面”是自然汉语，也不会让人误以为另有一堵墙。脚注保留较字面的“坛壁”。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的祭祀律例语体。主句以连续动作呈现仪式步骤；“焚烧”不补出原文省略的宾语，以保留其指向上的含蓄。脚注标记分别紧跟所说明的“掐断它的头”和“祭坛的侧面”。
