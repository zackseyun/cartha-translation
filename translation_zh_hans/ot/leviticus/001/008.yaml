base_translation:
  language: en
  yaml_path: translation/ot/leviticus/001/008.yaml
  text: And Aaron’s sons[a], the priests, shall arrange the pieces, the head, and the fat on the wood that is on the fire that is on the altar.
translation:
  language: zh_hans
  text: 亚伦的儿子们，就是祭司，要把肉块、头和脂肪[a]摆放在柴上；柴在火上，火在祭坛上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“板油”或“覆盖内脏的脂肪”；希伯来语所指是祭牲身上用于献祭的一部分肥脂。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָרְכוּ
  choice: 要……摆放
  rationale: ערך在献祭程序中指按次序摆列、安放；“要……摆放”既保留指令语气，也符合现代汉语表达。句首的连接词 וְ 由本节与上文的连续关系体现，不生硬译作“并且”。
- source_word: בְּנֵי אַהֲרֹן הַכֹּהֲנִים
  choice: 亚伦的儿子们，就是祭司
  rationale: 将“祭司”理解为对“亚伦的儿子们”的同位说明；“就是”明确二者关系，同时不改变原文所指。
- source_word: הַנְּתָחִים
  choice: 肉块
  rationale: נְתָחִים指前一步切开的祭牲各块。“肉块”比笼统的“各部分”更具体，也自然承接献祭语境。
- source_word: הָרֹאשׁ
  choice: 头
  rationale: 按其普通的身体部位含义直译。
- source_word: הַפָּדֶר
  choice: 脂肪
  rationale: פָּדֶר指用于献祭的肥脂部分，但确切的解剖学所指并不完全确定。“脂肪”清楚易懂，其他可能含义收入脚注。
- source_word: עַל הָעֵצִים
  choice: 在柴上
  rationale: עֵצִים在这里集合性地指作燃料的木柴；“柴”比“木头”更贴合燃烧献祭的场景。
- source_word: אֲשֶׁר עַל הָאֵשׁ אֲשֶׁר עַל הַמִּזְבֵּחַ
  choice: 柴在火上，火在祭坛上
  rationale: 原文连续使用两个关系从句，逐层说明柴、火与祭坛的位置。译文保留这一层叠结构，以免将原文的程序性描述过度顺平。
theological_decisions: []
