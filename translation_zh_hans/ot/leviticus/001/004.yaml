  text: וְ/סָמַ֣ךְ יָד֔/וֹ עַ֖ל רֹ֣אשׁ הָ/עֹלָ֑ה וְ/נִרְצָ֥ה ל֖/וֹ לְ/כַפֵּ֥ר עָלָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/001/004.yaml
  text: And he shall lay his hand on the head of the burnt offering[a], and it shall be accepted for him to make atonement on his behalf.
translation:
  language: zh_hans
  text: 他要把手按在燔祭牲的头上；这祭牲就会为他蒙悦纳[a]，从而为他赎罪。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他就会蒙悦纳”——希伯来文的被动形式也可理解为更直接地指献祭的人，而不是祭牲。
    reason: 保留וְנִרְצָה所指对象的另一种合理解释。
lexical_decisions:
- source_word: וְסָמַךְ
  choice: 要把手按在
  rationale: סמך在献祭礼仪中指把手放在或按在祭牲身上；“按在”自然地表达这一动作，同时不额外限定按压的力度。
- source_word: יָדוֹ
  choice: 他的手
  rationale: 保留希伯来文的单数所有格；在汉语句中以“把手”自然表达，施事者“他”已明确。
- source_word: עַל רֹאשׁ
  choice: 在……的头上
  rationale: 直接保留介词短语所描写的身体动作和位置。
- source_word: הָעֹלָה
  choice: 燔祭牲
  rationale: עֹלָה是全牲焚烧的祭物；“燔祭牲”既沿用通行的礼仪术语，也在本节按手于动物的语境中明确指祭牲。
- source_word: וְנִרְצָה
  choice: 这祭牲就会……蒙悦纳
  rationale: 以被动表达保留“蒙悦纳”的祭祀含义；正文按上下文将所悦纳者理解为祭牲，同时用脚注保留所悦纳者可能是献祭者的解释。
- source_word: לוֹ
  choice: 为他
  rationale: 表达受益关系，保留祭物蒙悦纳是为了献祭者的含义。
- source_word: לְכַפֵּר
  choice: 赎罪
  rationale: כפר是核心献祭术语；“赎罪”是简明而通行的汉语对应词，不在此限定其具体神学机制。
- source_word: עָלָיו
  choice: 为他
  rationale: 在献祭语境中，כפר加על指出赎罪所关涉或惠及的人；“为他”自然表达这一关系。
theological_decisions:
- issue: וְנִרְצָה这一被动动词所指的是祭物还是献祭者
  choice: 正文理解为祭牲蒙悦纳
  alternative: 献祭者蒙悦纳
  rationale: 上下文紧接着提到燔祭牲，献祭程序也自然指向祭物为献祭者蒙悦纳；然而，希伯来文的阳性单数被动形式并未无可争议地以阴性名词עֹלָה为主语，也可理解为献祭者蒙悦纳，因此在脚注中保留另一读法。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“燔祭牲”“蒙悦纳”“赎罪”保留利未记献祭语境中的关键术语；分号呈现按手与蒙悦纳、赎罪之间的推进关系。
