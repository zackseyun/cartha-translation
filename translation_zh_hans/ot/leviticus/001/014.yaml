source:
  edition: WLC
  text: וְ/אִ֧ם מִן הָ/ע֛וֹף עֹלָ֥ה קָרְבָּנ֖/וֹ לַֽ/יהוָ֑ה וְ/הִקְרִ֣יב מִן הַ/תֹּרִ֗ים א֛וֹ מִן בְּנֵ֥י הַ/יּוֹנָ֖ה אֶת קָרְבָּנֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/001/014.yaml
  text: And if his offering to Yahweh is a burnt offering from the birds, then he shall present his offering from the turtledoves or from the young pigeons.
translation:
  language: zh_hans
  text: 如果他献给雅威的供物是取自鸟类的燔祭，他就要从斑鸠或雏鸽中献上他的供物。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאִם
  choice: 如果
  rationale: וְ接续前文并引入新的条件情形；现代汉语以“如果”自然表达这种承接性的条件句，无须生硬增译“并且”。
- source_word: מִן הָעוֹף
  choice: 鸟类作的
  rationale: עוֹף在本祭牲语境中指鸟类；结合介词מִן，译为“鸟类作的”可清楚说明燔祭所用祭牲的类别。
- source_word: עֹלָה
  choice: 燔祭
  rationale: 这是希伯来祭祀制度中的固定祭种，祭物全部焚烧，其烟上腾；“燔祭”是准确且通行的现代中文圣经术语。
- source_word: קָרְבָּנוֹ
  choice: 他献……的供物／作供物
  rationale: קָרְבָּן指带到神面前献上的供物。本节前后重复该词，译文在条件句和主句中均保留“供物”的概念，同时调整语序使中文自然。
- source_word: לַיהוָה
  choice: 献给雅威
  rationale: 介词ל在献祭语境中表示供物所献的对象；“献给”符合现代汉语。“雅威”直接呈现יהוה这一神圣名字。
- source_word: וְהִקְרִיב
  choice: 他就要献上
  rationale: קרב的使役形在礼仪语境中表示把祭物带近、呈献；“献上”兼顾动作的祭祀含义和中文可读性，“就要”对应条件句的结果。
- source_word: מִן הַתֹּרִים
  choice: 斑鸠
  rationale: תּוֹר指斑鸠；复数形式在此表示可从这一类鸟中选取，中文用类称单数自然表达。
- source_word: מִן בְּנֵי הַיּוֹנָה
  choice: 雏鸽
  rationale: 字面为“鸽子的幼鸟”，是指幼鸽的惯用表达；“雏鸽”简洁而准确地保留年龄限定。
- source_word: אוֹ
  choice: 或
  rationale: 保留两类准许祭鸟之间的选择关系。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华／上主
  rationale: 原文直接使用四字神名יהוה；采用“雅威”作为其音译，保留经文中的专名性质，不以称号替代。
- issue: עֹלָה的祭祀含义
  choice: 燔祭
  alternative: 上升祭
  rationale: 虽然该词与“上升”相关，但在利未记中已是特定祭种名称；“燔祭”既保留其制度性含义，也不额外解释其神学象征。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。句式保留原文的条件—结果结构，并保留“供物”在两分句中的语义重复；后半句调整为自然汉语，避免直译成“从斑鸠或雏鸽中献他的供物”的生硬表达。
