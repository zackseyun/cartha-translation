id: LEV.1.2
reference: Leviticus 1:2
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: דַּבֵּ֞ר אֶל בְּנֵ֤י יִשְׂרָאֵל֙ וְ/אָמַרְתָּ֣ אֲלֵ/הֶ֔ם אָדָ֗ם כִּֽי יַקְרִ֥יב מִ/כֶּ֛ם קָרְבָּ֖ן לַֽ/יהוָ֑ה מִן הַ/בְּהֵמָ֗ה מִן הַ/בָּקָר֙ וּ/מִן הַ/צֹּ֔אן תַּקְרִ֖יבוּ אֶת קָרְבַּנְ/כֶֽם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/001/002.yaml
  text: 'Speak to the sons of Israel and say to them: When a man from among you brings an offering to Yahweh[b][a], you shall bring your offering from the livestock—from the herd or from the flock.'
translation:
  language: zh_hans
  text: “你要对以色列人[a]说：‘你们中若有一人[b]向雅威[c]献上供物，就要从牲畜中，从牛群或羊群中献上你们的供物。’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“以色列的众子”，是指以色列人或以色列民的固定称谓。
    reason: lexical_alternative
  - marker: b
    text: 原文是“人”（אָדָם，adam），以单数引出群体中任一人的情形。
    reason: lexical_alternative
  - marker: c
    text: “雅威”音译希伯来文神名 יהוה；中文传统译本也常译作“耶和华”。
    reason: textual_and_theological_clarity
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列众子
  rationale: 保留希伯来语正式称呼的字面意象；脚注说明在此泛指以色列人。
- source_word: אָדָם
  choice: 一个人
  rationale: 原文以单数“人”引出个案，具有代表性；译文保留单数形式，不把它直接改写成“任何人”。
- source_word: יַקְרִיב / תַּקְרִיבוּ
  choice: 献给／献上
  rationale: 使役词形在献祭语境中指带来、呈献；中文用“献”自然地表达把供物带到神面前，同时保留前后动词的呼应。
- source_word: מִכֶּם
  choice: 你们中
  rationale: 表达从群体中选取一个个体的部分关系，符合现代汉语习惯。
- source_word: קָרְבָּן
  choice: 供物
  rationale: 这是涵盖面较广的献呈之物，不宜一概窄化为经过宰杀的“祭牲”；“供物”适合本节总论性的祭礼语境。
- source_word: לַיהוָה
  choice: 给雅威
  rationale: 将四字神名 יהוה 作为专名音译，反映原文直接使用盟约之名。
- source_word: הַבְּהֵמָה
  choice: 牲畜
  rationale: 指可供献祭的家养动物这一总类；“牲畜”在现代中文中准确且简洁。
- source_word: הַבָּקָר
  choice: 牛群
  rationale: 指大型牛类牲畜，与下文小型群畜形成对举。
- source_word: הַצֹּאן
  choice: 羊群
  rationale: 简洁表达由绵羊和山羊构成的小型群畜；中文“羊”可以统摄绵羊与山羊。
- source_word: תַּקְרִיבוּ אֶת קָרְבַּנְכֶם
  choice: 你们……献上你们的供物
  rationale: 保留原文从单数个案“一个人”转回第二人称复数、向全体会众发出规定的变化。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华／上主
  rationale: 原文使用四字神名而非称号；音译“雅威”较直接地保留其专名性质，并在脚注交代中文传统译法。
- issue: אָדָם 与 בְּנֵי יִשְׂרָאֵל 的代表性阳性表达
  choice: 保留“一个人”和“以色列众子”
  alternative: 任何人／以色列人
  rationale: 正文保留原文形式及其群体称呼的历史色彩，同时用脚注说明这里的代表性和泛指范围，避免误解为只强调性别或血缘上的儿子。
- issue: 单数个案与复数群体命令之间的转换
  choice: 保留“一个人”与“你们……你们的供物”的转换
  alternative: 全句统一改成单数或复数
  rationale: 希伯来文先提出群体中某个个人的情形，随后用复数向全体会众规定供物来源；不将这一张力静默抹平。
translation_notes:
  register: 采用现代、庄重而易懂的法律训示语体。以“告诉……对他们说”保留双重传话公式；正文有意保留原文由单数个案转为复数群体命令的结构。“就是”明确说明牛群和羊群是“牲畜”这一总类的两个分项。
