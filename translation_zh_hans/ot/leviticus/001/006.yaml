  yaml_path: translation/ot/leviticus/001/006.yaml
  text: Then he shall skin the burnt offering and cut it into its pieces[a][b].
translation:
  language: zh_hans
  text: 然后，他要剥去燔祭牲的皮[a]，把祭牲切成块[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“把燔祭牲剥皮。”
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译为“把它切成它的各块”，指按献祭程序将祭牲分割成若干部分。
    reason: cultural_note
lexical_decisions:
- source_word: וְהִפְשִׁיט
  choice: 然后，他要剥去……的皮
  rationale: 希伯来语פשט的使役式在献祭语境中指剥除牲畜的皮。“剥去……的皮”是现代汉语中清楚自然的表达，也准确保留具体的礼仪动作。句首וְ按程序推进译作“然后”。
- source_word: הָעֹלָה
  choice: 燔祭牲
  rationale: עֹלָה是利未记中全牲焚烧之祭的固定术语。此处该词也是剥皮、切块动作的直接对象，因此译作“燔祭牲”，既承接标准礼仪名称“燔祭”，又明确所指为献祭的牲畜。
- source_word: וְנִתַּח
  choice: 切成块
  rationale: נתח在此指将祭牲分割成若干部分。“切成块”符合现代汉语表达，并与后面的לִנְתָחֶיהָ共同传达分割结果。
- source_word: לִנְתָחֶיהָ
  choice: 成块
  rationale: נֵתַח指切下的块或部分；介词ל在这里表达分割后的结果。汉语“切成块”自然地传达“切成其各块”的意思，而不生硬重复所有格。
