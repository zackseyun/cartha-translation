source:
  edition: WLC
  text: אִם עֹלָ֤ה קָרְבָּנ/וֹ֙ מִן הַ/בָּקָ֔ר זָכָ֥ר תָּמִ֖ים יַקְרִיבֶ֑/נּוּ אֶל פֶּ֝תַח אֹ֤הֶל מוֹעֵד֙ יַקְרִ֣יב אֹת֔/וֹ לִ/רְצֹנ֖/וֹ לִ/פְנֵ֥י יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/001/003.yaml
  text: If his offering is a burnt offering from the herd[a], he shall offer a male without blemish. He shall offer it at the entrance of the tent of meeting, that he may be accepted before Yahweh.
translation:
  language: zh_hans
  text: “若他所献的供物是取自牛群的燔祭，他要献上一头没有残疾的公牛。他要在会幕门口把它献在雅威面前，使自己蒙悦纳[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“按他自己的意愿（甘心）。”
    reason: 原文לִרְצֹנוֹ可指献祭者在雅威面前蒙悦纳，也可理解为献祭出于自愿。
lexical_decisions:
- source_word: עֹלָה
  choice: 燔祭
  rationale: 这是利未记中通行而准确的祭祀术语，指祭物在坛上焚烧献上；比直译为“升上之祭”更符合现代汉语圣经语境。
- source_word: קָרְבָּנוֹ
  choice: 他的供物
  rationale: קָרְבָּן泛指带来献给上帝的礼物或祭物；“供物”既保留其广义，也适合本节祭祀语境。
- source_word: מִן הַבָּקָר
  choice: 从牛群中选取的
  rationale: הַבָּקָר指牛类牲畜。“从牛群中选取的”自然表达来源范围，并为下文“一头公牛”提供清楚衔接。
- source_word: זָכָר תָּמִים
  choice: 一头没有残疾的公牛
  rationale: זָכָר明确要求雄性，תָּמִים在祭牲语境中指没有缺陷或残疾；“公牛”依上下文明确动物类别。
- source_word: יַקְרִיבֶנּוּ / יַקְרִיב אֹתוֹ
  choice: 他要献上……／他要……把它献上
  rationale: קרב的使役形在祭祀语境中表示把祭物带近并呈献；“献上”是自然、准确的现代汉语表达，同时保留原文两次重复。
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: 会幕门口
  rationale: 这是以色列圣所的固定称谓；“会幕门口”简洁自然，准确表达帐幕入口处。
- source_word: לִרְצֹנוֹ
  choice: 使自己蒙悦纳
  rationale: 此短语存在句法和语义歧义。在献祭语境中，主文采用献祭者在上帝面前蒙悦纳之意，并在脚注保留“出于自愿”的传统理解。
- source_word: לִפְנֵי יְהוָה
  choice: 在雅威面前
  rationale: לִפְנֵי表示“在……面前／临在中”；“雅威”以现代汉语音译呈现四字神名יהוה。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华／上主
  rationale: 原文直接使用四字神名。主文采用“雅威”，在汉语中音译该盟约之名，不以称号替代。
- issue: לִרְצֹנוֹ的解释
  choice: 使自己蒙悦纳
  alternative: 出于自愿；按自己的意愿
  rationale: 该表达既可理解为献祭者在雅威面前得蒙悦纳，也有译为自愿献上的悠久传统。主文按利未记祭祀语境采用前者，脚注保留后者，不消除原文的真实歧义。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“燔祭”“会幕”保留必要且通行的礼仪术语；其余句法力求自然。脚注标记置于所说明的歧义短语之后。
