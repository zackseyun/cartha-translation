revisions:
- from: 他要把祭牲切成块，连同头和脂肪[a]；祭司要把这一切摆在柴上；柴在火上，火在祭坛上。
  to: 他要把祭牲切成块，连同头和脂肪[a]；祭司要把这一切摆在祭坛上的火所烧着的柴上。
  rationale: 修订仅重组末句的空间关系，使其在现代标准汉语中更连贯，同时保留原文所表达的木柴在火上、火在祭坛上的层叠描述。其余措辞及脚注均可保留。
