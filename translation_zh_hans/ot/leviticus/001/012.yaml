base_translation:
  language: en
  yaml_path: translation/ot/leviticus/001/012.yaml
  text: And he shall cut it into its pieces[a], with its head and its fat, and the priest shall arrange them on the wood that is on the fire, which is on the altar.
translation:
  language: zh_hans
  text: 他要把祭牲切成块，连同头和脂肪[a]；祭司要把这一切摆在祭坛上的火所烧着的柴上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“板油”或“内脏周围的脂肪”。希伯来语这个词指与祭牲有关的脂肪组织。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנִתַּח אֹתוֹ לִנְתָחָיו
  choice: 把祭牲切成块
  rationale: נתח在献祭规程中指将祭牲切割成若干块。“切成块”自然、明确；补出“祭牲”以清楚表达希伯来语代词所指。
- source_word: רֹאשׁוֹ
  choice: 头
  rationale: 直接表达祭牲的头；中文语境已明确所属，无须重复“它的”。
- source_word: פִּדְרוֹ
  choice: 脂肪[a]
  rationale: פדר指与祭牲有关的脂肪组织，具体范围并非完全确定。“脂肪”通顺且不过度限定，其他可能译法列入脚注。
- source_word: וְעָרַךְ
  choice: 摆
  rationale: ערך在礼仪语境中指按次序放置。“摆”在现代中文中自然，并保留规整放置的动作含义。
- source_word: הַכֹּהֵן
  choice: 祭司
  rationale: כהן在利未记献祭法规中的标准译法。
- source_word: אֹתָם
  choice: 这一切
  rationale: 概括前述肉块、头和脂肪，符合中文表达，并保留复数宾语的集合性。
- source_word: עַל הָעֵצִים
  choice: 在柴上
  rationale: עֵצִים虽为复数，但在此指供火使用的木柴，中文以集合名词“柴”最自然。
- source_word: אֲשֶׁר עַל הָאֵשׁ אֲשֶׁר עַל הַמִּזְבֵּחַ
  choice: 柴在火上，火在祭坛上
  rationale: 以两个并列短句保留希伯来文层叠的空间关系，避免把第二个关系从句错误地理解为修饰木柴。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的祭祀规程用语。以“他要”表达法律礼仪语境中的规定性动作；用分号呈现先由献祭者切割、再由祭司摆放的步骤，并保留原文“柴—火—祭坛”的层叠结构。
