id: LEV.10.15
reference: Leviticus 10:15
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: שׁ֣וֹק הַ/תְּרוּמָ֞ה וַ/חֲזֵ֣ה הַ/תְּנוּפָ֗ה עַ֣ל אִשֵּׁ֤י הַ/חֲלָבִים֙ יָבִ֔יאוּ לְ/הָנִ֥יף תְּנוּפָ֖ה לִ/פְנֵ֣י יְהוָ֑ה וְ/הָיָ֨ה לְ/ךָ֜ וּ/לְ/בָנֶ֤י/ךָ אִתְּ/ךָ֙ לְ/חָק עוֹלָ֔ם כַּ/אֲשֶׁ֖ר צִוָּ֥ה יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/015.yaml
  text: They shall bring the thigh of the contribution and the breast of the wave offering[a], along with the food offerings of the fat portions, to wave as a wave offering before Yahweh; and it shall be for you and for your sons with you as a permanent statute[d][c][b], just as Yahweh commanded.
translation:
  language: zh_hans
  text: 他们要把举献[b]的后腿[a]和摇祭[c]的胸肉，连同献作火祭的脂肪部分带来，在雅威[d]面前行摇祭礼。这些祭物要归你和你的儿子所有，作为永远的定例，正如雅威所吩咐的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “后腿”也可译作“大腿”，指祭牲后腿的部位。
    reason: lexical_alternative
  - marker: b
    text: “举献”指分别出来献上的一份；传统也译作“举祭”。
    reason: lexical_alternative
  - marker: c
    text: “摇祭”指在雅威面前作礼仪性展示的祭物；也可译作“呈献祭”。
    reason: cultural_note
  - marker: d
    text: “雅威”是希伯来文神名YHWH的音译。
    reason: lexical_alternative
lexical_decisions:
- source_word: שׁוֹק
  choice: 腿
  rationale: 指祭牲后腿中归给祭司的部位；“腿”自然明确，同时以脚注说明也可理解为“大腿”。
- source_word: תְּרוּמָה
  choice: 举献
  rationale: 保留“举起、分别出来献上”的礼仪含义，也比单用“供物”更能与摇祭区分。
- source_word: חָזֶה
  choice: 胸
  rationale: 这是献祭语境中祭牲的胸部，为直接、通行的解剖用语。
- source_word: תְּנוּפָה / לְהָנִיף
  choice: 摇祭 / 摇一摇
  rationale: 用同根概念对应希伯来文的名词与动词，保留在雅威面前作礼仪性展示的动作。
- source_word: עַל אִשֵּׁי הַחֲלָבִים
  choice: 连同献作火祭的脂肪部分
  rationale: עַל在此表达伴随关系；该译法清楚说明脂肪部分是焚献之物，避免把“脂肪”误解为抽象性质。
- source_word: וְהָיָה לְךָ וּלְבָנֶיךָ אִתְּךָ
  choice: 这些要归给你和同你一起的儿子
  rationale: 按上下文将单数形式理解为前述祭物的整体，并明确表达祭司及其儿子对这些部分的权利。
- source_word: לְחָק עוֹלָם
  choice: 作永远的定例
  rationale: 保留 חֹק 的规定、定例之意和 עוֹלָם 的持续性，不额外限定其神学时效。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常用音译呈现希伯来文神名YHWH，而不以称号替代。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；音译“雅威”保留其作为专名的性质，并以脚注交代。
- issue: 献祭术语的准确性与可读性
  choice: 保留“举献”“摇祭”，并把动作译为“摇一摇”
  alternative: 贡献／呈献祭；一律采用较传统但不透明的术语
  rationale: 保留两类祭物的区别及名词—动词呼应，同时借脚注解释礼仪动作，避免读者误以为只是普通捐献。
- issue: לְחָק עוֹלָם的持续性
  choice: 永远的定例
  alternative: 永久的份额；世世代代的条例
  rationale: 直译其持续性，不在本节中预先解决这项祭司条例在后续神学框架中的适用问题。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“作举献的腿”“作摇祭的胸”保留祭司律例的技术性；第二句改用“这些要归给……”以符合汉语指代习惯，并使前述两个祭牲部位均包括在内。
