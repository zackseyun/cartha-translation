  text: וְ/אֵת֩ חֲזֵ֨ה הַ/תְּנוּפָ֜ה וְ/אֵ֣ת שׁ֣וֹק הַ/תְּרוּמָ֗ה תֹּֽאכְלוּ֙ בְּ/מָק֣וֹם טָה֔וֹר אַתָּ֕ה וּ/בָנֶ֥י/ךָ וּ/בְנֹתֶ֖י/ךָ אִתָּ֑/ךְ כִּֽי חָקְ/ךָ֤ וְ/חָק בָּנֶ֨י/ךָ֙ נִתְּנ֔וּ מִ/זִּבְחֵ֥י שַׁלְמֵ֖י בְּנֵ֥י יִשְׂרָאֵֽל׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/014.yaml
  text: And you[a], and your sons and your daughters with you, shall eat the breast of the wave offering and the thigh of the contribution in a clean place[c][b], because they have been given as your portion and your sons’ portion from the sacrifices of the peace offerings of the sons of Israel.
translation:
  language: zh_hans
  text: 摇祭的胸[a]和举祭的腿[b]，你和你的儿子、女儿要与你一同在洁净的地方吃；因为这些祭物是从以色列人的平安祭[c]中赐给你和你儿子的分。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “摇祭”也可译作“呈献祭”；原文指按礼仪摇动或呈献的祭物份额。
    reason: lexical_alternative
  - marker: b
    text: “举祭”也可译作“举献之物”；原词本义与举起或分别献上有关，在这里指归给祭司的份额。
    reason: lexical_alternative
  - marker: c
    text: “平安祭”也可译作“团契祭”；原词的含义还可涉及完整、福祉或和好。
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲזֵה הַתְּנוּפָה
  choice: 作摇祭的胸
  rationale: חֲזֶה指祭牲的胸部；תְּנוּפָה指在耶和华面前摇动、呈献的礼仪。采用中文圣经礼仪语汇“摇祭”，既简洁又保留动作意象。
- source_word: שׁוֹק הַתְּרוּמָה
  choice: 作举祭的腿
  rationale: שׁוֹק指祭牲的腿或大腿部分；תְּרוּמָה本义涉及举起、分别献上，在这里是归给祭司的祭物份额。“举祭”保留其礼仪含义。
- source_word: תֹּאכְלוּ
  choice: 要吃
  rationale: 未完成式在此具有训令功能；“要吃”用现代中文自然表达明确指示。
- source_word: בְּמָקוֹם טָהוֹר
  choice: 在洁净的地方
  rationale: טָהוֹר在利未记语境中涉及礼仪上的洁净；正文不额外添加“礼仪上”，以免过度解释。
- source_word: אַתָּה וּבָנֶיךָ וּבְנֹתֶיךָ אִתָּךְ
  choice: 你和你的儿女
  rationale: “儿女”自然涵盖原文明确列出的儿子和女儿；中文不必重复“与你一同”，共同进食的结构已清楚传达אִתָּךְ的意思。
- source_word: חָקְךָ וְחָק בָּנֶיךָ
  choice: 给你和你儿子的分
  rationale: חֹק在本祭祀语境中是规定归属的份额，而非抽象的律例；“分”简洁准确。
- source_word: נִתְּנוּ
  choice: 赐给
  rationale: 被动完成式表示已经确立的授予；中文“赐给”可自然表达祭物份额由神规定授予祭司的语境。
- source_word: מִזִּבְחֵי שַׁלְמֵי
  choice: 从……平安祭中
  rationale: שְׁלָמִים可涉及平安、完整和福祉；“平安祭”保留较宽的传统含义，不将其缩窄为单纯的团契。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 这是现代标准汉语表达该希伯来集体称谓的自然方式，指以色列民整体，并不改变其族群所指。
theological_decisions:
- issue: שְׁלָמִים的祭类名称
  choice: 平安祭
  alternative: 团契祭
  rationale: “平安祭”较好保留该词关于平安、完整和福祉的广泛语义；“团契祭”可能将其神学含义缩窄为相交或共享筵席。
- issue: בְּנֵי יִשְׂרָאֵל的集体称谓
  choice: 以色列人
  alternative: 以色列的众子
  rationale: “以色列人”是该固定希伯来语族群称谓在现代汉语中的准确自然表达；直译“众子”容易使普通读者误以为只包括男性，反而遮蔽其集体用法。
- issue: 祭司份额חֹק的性质
  choice: 分
  alternative: 定例
  rationale: 上下文讨论从祭物中归给亚伦及其儿子的具体份额，因此译作“分”而不译作抽象的“定例”，同时保留这是经规定而赐下的含义。
translation_notes:
  register: 采用现代、庄重而易懂的祭祀法规文体。保留“摇祭、举祭、平安祭”等必要术语，并以脚注说明其动作意象和语义范围。按希伯来语宾语前置的强调结构，以“至于”引出两项祭物；中文语序则把共同进食者置于谓语前，使句子自然清楚。
