  yaml_path: translation/ot/leviticus/010/020.yaml
  text: And Moses heard[a], and it was good in his eyes.
translation:
  language: zh_hans
  text: 摩西听了，觉得这事妥当[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“这在他眼中是好的。”也可译作“他便满意了”或“他就认可了”。
    reason: 说明希伯来语习语的字面形式及其可能表达的认可、满意之意。
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: 听了
  rationale: שׁמע在此首先表示“听见、听取”；“听了”自然承接上一节亚伦的解释，同时不把经文过度解释为“完全理解”或“赞同”。
- source_word: מֹשֶׁה
  choice: 摩西
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: וַיִּיטַב בְּעֵינָיו
  choice: 觉得这事妥当
  rationale: 该短语直译为“在他眼中是好的”，是表示评价、认可或满意的希伯来语习语。“觉得这事妥当”以自然现代汉语表达其语境含义，同时避免把摩西的反应强化为明确批准。
theological_decisions:
- issue: 摩西回应的强度
  choice: 觉得这事妥当
  alternative: 他就认可了／他很满意
  rationale: 原文说明这事在摩西眼中是好的或可接受的，但未明确描述正式批准或强烈满意；正文保留较克制的评价语气。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。“妥当”适合祭司礼仪语境，也能让普通读者清楚理解；脚注保留原文“在眼中”的意象及语义幅度。
