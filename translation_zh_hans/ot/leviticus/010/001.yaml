  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יִּקְח֣וּ בְנֵֽי אַ֠הֲרֹן נָדָ֨ב וַ/אֲבִיה֜וּא אִ֣ישׁ מַחְתָּת֗/וֹ וַ/יִּתְּנ֤וּ בָ/הֵן֙ אֵ֔שׁ וַ/יָּשִׂ֥ימוּ עָלֶ֖י/הָ קְטֹ֑רֶת וַ/יַּקְרִ֜בוּ לִ/פְנֵ֤י יְהוָה֙ אֵ֣שׁ זָרָ֔ה אֲשֶׁ֧ר לֹ֦א צִוָּ֖ה אֹתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/001.yaml
  text: Then Nadab and Abihu[a], Aaron’s sons, each took his firepan, put fire in it, placed incense on it, and presented unauthorized fire before Yahweh, which he had not commanded them.
translation:
  language: zh_hans
  text: 亚伦的儿子拿答和亚比户各自拿了自己的火盘，把火放在盘中，把香放在上面，在耶和华面前献上未经吩咐的火[a]，就是耶和华没有吩咐他们献的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“凡火”“异火”或“外来的火”。这里指未经耶和华吩咐而献上的火；下句说明其未经吩咐。
    reason: 说明אֵשׁ זָרָה的词义范围，并保留传统译语和“外来／陌生”的词汇可能性，同时不把其具体性质限定为某一种仪式违规。
lexical_decisions:
- source_word: וַיִּקְחוּ
  choice: 拿了
  rationale: לקח是常见叙事动词；“拿了”自然承接本节的一连串动作。
- source_word: בְנֵי אַהֲרֹן נָדָב וַאֲבִיהוּא
  choice: 亚伦的儿子拿答和亚比户
  rationale: 按希伯来语关系结构译出亲属身份，并采用现代中文常用的圣经人名音译。
- source_word: אִישׁ מַחְתָּתוֹ
  choice: 各自拿了自己的火盘
  rationale: אִישׁ在此具有逐一分配的意思；מַחְתָּה指盛放或搬运炭火、香料的盘状器具，“火盘”比礼仪色彩较强的“香炉”更贴近器物本身。
- source_word: וַיִּתְּנוּ בָהֵן אֵשׁ
  choice: 把火放在盘里
  rationale: 原文代词为阴性复数，指两个火盘；中文以集合性的“盘里”表达，避免生硬重复。
- source_word: וַיָּשִׂימוּ עָלֶיהָ קְטֹרֶת
  choice: 又把香放在火上
  rationale: 原文后缀为阴性单数，可能是分配性地指各人的火盘；结合献香动作，中文译作“放在火上”自然清楚，又不改变动作次序。
- source_word: וַיַּקְרִבוּ לִפְנֵי יְהוָה
  choice: 在耶和华面前献上
  rationale: קרב的使役式在祭礼语境中表示呈献；“献上”保留礼仪含义。“在……面前”对应固定表达לִפְנֵי。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 使用现代简体中文圣经传统中辨识度最高的专名形式，明确呈现原文的神圣名字，而非以称号替代。
- source_word: אֵשׁ זָרָה
  choice: 凡火
  rationale: 保留中文圣经传统中简洁而具有祭礼边界意味的说法；其具体含义由紧接的“没有吩咐”加以界定，并在脚注列出更直白的译法。
- source_word: אֲשֶׁר לֹא צִוָּה אֹתָם
  choice: 是耶和华没有吩咐他们献的
  rationale: 明确补出相对从句所修饰的献火行为，使现代中文顺畅；“他们”保留希伯来文宾语后缀。重复“耶和华”可避免中文中代词指向不清。
theological_decisions:
- issue: 神圣名字יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。正文采用中文读者最熟悉且庄重的专名“耶和华”；“雅威”较接近现代学界常见的拟音，但尚未成为普通中文的主流形式。
- issue: אֵשׁ זָרָה所指的违规性质
  choice: 凡火
  alternative: 未经许可的火／异火
  rationale: זָרָה可表达陌生、外来或不属规定范围之意；下半句明确指出问题在于耶和华未曾吩咐。正文不进一步断定火的来源或具体程序，以保存原文的含混与祭礼张力。
- issue: 相对从句的逻辑关系
  choice: 是耶和华没有吩咐他们献的
  alternative: 耶和华并没有吩咐他们这样做
  rationale: 所选译法把从句直接连于“凡火／献火”，贴近原文结构，同时不扩展为对整套行为细节的额外判定。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。叙事动作依原文次序展开；“各自……自己的”体现分配结构。避免使用过度古雅的“遂、乃”等词，也不推测凡火的具体来源或拿答、亚比户的主观动机。
