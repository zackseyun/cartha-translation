id: LEV.10.2
reference: Leviticus 10:2
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/תֵּ֥צֵא אֵ֛שׁ מִ/לִּ/פְנֵ֥י יְהוָ֖ה וַ/תֹּ֣אכַל אוֹתָ֑/ם וַ/יָּמֻ֖תוּ לִ/פְנֵ֥י יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/002.yaml
  text: And fire came out from before Yahweh and consumed them[a], and they died before Yahweh.
translation:
  language: zh_hans
  text: 火从耶和华面前出来[a]，烧灭了他们；他们就死在耶和华面前。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“从耶和华的临在中”。
    reason: “从耶和华面前”保留原文直译式空间意象；此处提供“临在中”这一自然的替代译法。
lexical_decisions:
- source_word: וַתֵּצֵא
  choice: 出来
  rationale: 该叙事性动词表示火从一个源头发出；“出来”自然保留了方向感。
- source_word: אֵשׁ
  choice: 火
  rationale: 此处指施行即时审判的火，按通常字义翻译。
- source_word: מִלִּפְנֵי יְהוָה
  choice: 从耶和华面前
  rationale: 保留希伯来语“从耶和华面前／临在中”的空间意象，也与本节末尾的重复相呼应。
- source_word: וַתֹּאכַל
  choice: 烧灭了
  rationale: אָכַל本义为“吃、吞吃”，以火为主语时表示焚烧并毁灭；“烧灭”符合现代汉语表达，同时保留其毁灭性的力度。
- source_word: אֹתָם
  choice: 他们
  rationale: 指上文的拿答和亚比户，不在本节中增补其姓名。
- source_word: וַיָּמֻתוּ
  choice: 他们就死
  rationale: 原文为主动不及物表达“他们死了”；“就”自然呈现前句所述事件带来的结果，而不改写为被动的“被杀”。
- source_word: לִפְנֵי יְהוָה
  choice: 在耶和华面前
  rationale: 保留原文庄重的重复及其地点和神学意涵。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 以现代中文圣经读者熟悉的专名“耶和华”对应四字神名，同时明确保留其专名性质，不以“主”替代。
- issue: וַיָּמֻתוּ应译为主动结果还是被动使役
  choice: 他们就死
  alternative: 他们被杀死
  rationale: 希伯来语直接说“他们死了”，前句已经说明死因；采用主动不及物表达，避免额外加入被动使役解释。
- issue: 两处לִפְנֵי יְהוָה相关表达的重复
  choice: 两处均保留“耶和华面前”
  alternative: 其中一处改为“耶和华的临在中”
  rationale: 原文刻意重复同一核心短语；保留重复可呈现事件从耶和华面前发出、二人又死在耶和华面前的庄严对应。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“烧灭”比直译“吞吃”更符合火作主语时的汉语习惯；分号呈现前后两项结果，并保留原文连续叙事的力度。
