  text: מַדּ֗וּעַ לֹֽא אֲכַלְתֶּ֤ם אֶת הַֽ/חַטָּאת֙ בִּ/מְק֣וֹם הַ/קֹּ֔דֶשׁ כִּ֛י קֹ֥דֶשׁ קָֽדָשִׁ֖ים הִ֑וא וְ/אֹתָ֣/הּ נָתַ֣ן לָ/כֶ֗ם לָ/שֵׂאת֙ אֶת עֲוֺ֣ן הָ/עֵדָ֔ה לְ/כַפֵּ֥ר עֲלֵי/הֶ֖ם לִ/פְנֵ֥י יְהוָֽה־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/017.yaml
  text: Why did you not eat the sin offering in the holy place? For it is most holy[a], and he has given it to you to bear the iniquity of the congregation, to make atonement for them before Yahweh.
translation:
  language: zh_hans
  text: “你们为什么没有在圣处吃这赎罪祭[a]呢？这是至圣的祭物；耶和华把它赐给你们，是要你们担当会众的罪孽，在他面前为他们赎罪。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “赎罪祭”也可译作“洁净祭”。希伯来语 חַטָּאת 既可指与罪有关的祭，也可强调除去不洁的作用。
    reason: lexical_alternative
lexical_decisions:
- source_word: מַדּוּעַ לֹא אֲכַלְתֶּם
  choice: 你们为什么没有……吃呢
  rationale: 直接表达责问原因；复数“你们”对应希伯来语第二人称复数，句末“呢”使现代汉语问句自然。
- source_word: הַחַטָּאת
  choice: 赎罪祭
  rationale: 此处明确指献祭的祭牲；“赎罪祭”是现代中文圣经语境中清楚且通行的名称，同时以脚注保留“洁净祭”这一可行译法。
- source_word: בִּמְקוֹם הַקֹּדֶשׁ
  choice: 在圣所
  rationale: 指祭司按规定食用祭物的神圣区域；“圣所”简洁庄重，也不把范围过度具体化。
- source_word: קֹדֶשׁ קָדָשִׁים הִוא
  choice: 这是至圣的祭物
  rationale: 重叠结构表达最高级的神圣等级；补出“祭物”符合中文表达，并明确阴性代词所指的赎罪祭。
- source_word: וְאֹתָהּ נָתַן לָכֶם
  choice: 他把它赐给你们
  rationale: 保留第三人称单数主语，按上下文指上帝；“赐给”自然体现这份祭司职分和份额来自上帝。
- source_word: לָשֵׂאת אֶת־עֲוֺן הָעֵדָה
  choice: 担当会众的罪孽
  rationale: “担当”保留 נשא 的承担、背负意味；“罪孽”较完整地保存 עָוֹן 可能涵盖罪过及其罪责的张力。
- source_word: לְכַפֵּר עֲלֵיהֶם
  choice: 为他们赎罪
  rationale: 采用中文祭祀语境中既定而自然的表达，不额外限定 כפר 的具体机制。
- source_word: לִפְנֵי יְהוָה
  choice: 在耶和华面前
  rationale: 既保留“在……面前”的临在和礼仪意味，也按希伯来专名音译 יהוה。
theological_decisions:
- issue: חַטָּאת 在献祭条例中的含义
  choice: 正文译作“赎罪祭”
  alternative: “洁净祭”
  rationale: 上下文确定它是祭物；“赎罪祭”最易为普通中文读者识别，而脚注保留该祭也涉及除去不洁的词义维度。
- issue: נָתַן 的未明说主语
  choice: 保留为“他”，按上下文指上帝
  alternative: 采用被动式“这祭物赐给了你们”
  rationale: 希伯来语使用第三人称阳性单数动词；上下文自然指上帝，保留“他”不必把原文改写为被动。
- issue: 祭司“担当会众的罪孽”的意义
  choice: 直译并保留其代表性、礼仪性的张力
  alternative: 解释为“除去会众的罪责”或“承担会众所受的刑罚”
  rationale: 原文没有在本句中详解担当的机制；不把它收窄为单一教义解释。
translation_notes:
  register: 采用现代、庄重而清楚的标准普通话。“至圣的祭物”“担当会众的罪孽”“在耶和华面前”等措辞保留利未记礼仪语境的分量，同时避免生硬逐词翻译。
