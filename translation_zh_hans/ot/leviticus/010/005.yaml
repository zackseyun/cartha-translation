  text: So they came near and carried them in their tunics to outside the camp[a], just as Moses had said.
translation:
  language: zh_hans
  text: 于是他们上前，连同他们所穿的长衣，把二人抬到营外[a]，正如摩西所说的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“借着他们的长衣把二人抬到营外。”希伯来语介词也可表示方式或工具，因此这句话可能是说，他们利用死者所穿的长衣搬运尸体。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרְבוּ
  choice: 他们上前
  rationale: קרב的Qal连续式表示向前靠近；“上前”在现代汉语中自然，并保留了动作方向，不额外赋予礼仪含义。
- source_word: וַיִּשָּׂאֻם
  choice: 把二人……抬到
  rationale: נשׂא带第三人称阳性复数宾语后缀，所指是拿答和亚比户；上下文是搬走尸体，因此“抬”比泛泛的“带走”准确，也比“举起”更符合持续搬运的动作。
- source_word: בְּכֻתֳּנֹתָם
  choice: 连同身上的袍子
  rationale: כֻּתֹּנֶת指贴身穿着的长衣或袍子；介词ב既可描述尸身仍穿着袍子的状态，也可表示借着或抓住袍子搬运。正文采用自然且较少过度限定的表达，并以脚注保留工具义的可能。
- source_word: אֶל מִחוּץ לַמַּחֲנֶה
  choice: 到营外
  rationale: אֶל与מִחוּץ共同表达朝营地外面的移动；“到营外”简洁自然，并清楚保留方向性。
- source_word: כַּאֲשֶׁר דִּבֶּר מֹשֶׁה
  choice: 正如摩西所说的
  rationale: כַּאֲשֶׁר表示与摩西先前的话相符；“正如……所说的”自然表达其回指和符合之意。
