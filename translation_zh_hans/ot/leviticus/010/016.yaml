base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/016.yaml
  text: Moses diligently searched for the goat of the sin offering[a], and behold, it had been burned up. So he was angry with Eleazar and with Ithamar, Aaron’s remaining sons, saying[c][b],
translation:
  language: zh_hans
  text: 摩西仔细查找那只作赎罪祭的公山羊[a]，不料，它已经被焚烧了[b]。于是，他向亚伦剩下的儿子[c]以利亚撒和以他玛发怒，说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“把那只作赎罪祭的公山羊查了又查。”希伯来文以不定式绝对形配合同一动词，表示强调。
    reason: lexical_alternative
  - marker: b
    text: 或译：“它已经被完全焚烧了。”希伯来文表示摩西发现时，这只公山羊处于已经被焚烧的状态。
    reason: lexical_alternative
  - marker: c
    text: “亚伦剩下的儿子”指以利亚撒和以他玛，就是拿答和亚比户死后留下的两个儿子（利10:1–2、12）。
    reason: cross_reference
lexical_decisions:
- source_word: שְׂעִיר הַחַטָּאת
  choice: 那只作赎罪祭的公山羊
  rationale: שְׂעִיר 指公山羊；“作赎罪祭的”以自然汉语表达其祭物类别，并保留特指语气。
- source_word: דָּרֹשׁ דָּרַשׁ
  choice: 仔细查找
  rationale: 不定式绝对形与限定动词连用，强化查找这一行动；“仔细查找”自然传达强调意味，脚注保留原文重复形式。
- source_word: וְהִנֵּה
  choice: 不料
  rationale: הִנֵּה 在这里引出摩西查找后的意外发现；“不料”符合现代叙事汉语，也保留突然引起注意的语用功能。
- source_word: שֹׂרָף
  choice: 已经烧掉了
  rationale: 被动分词描述公山羊被发现时处于焚烧后的状态；“已经烧掉了”表达结果状态，不明说焚烧者。
- source_word: וַיִּקְצֹף
  choice: 发怒
  rationale: 该动词表示恼怒、发怒；此译法准确而不过度强化为“暴怒”。
- source_word: הַנּוֹתָרִם
  choice: 剩下的
  rationale: 指拿答和亚比户死后仍在的两位儿子；“剩下的”简洁，并避免正文过度解释。
- source_word: לֵאמֹר
  choice: 说：
  rationale: 这是引出下文直接引语的惯用表达；以冒号自然连接下一节的话。
theological_decisions:
- issue: שֹׂרָף 是否明确表示祭牲被完全烧尽
  choice: 正文译为“已经烧掉了”
  alternative: 已经完全焚烧了
  rationale: 该形式首先描述被焚烧后的状态；上下文可能意味着全部焚烧，但原词本身不必然明确强调“完全”，故将较强译法置于脚注。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。“不料”传达突然发现；“发怒”保持语气分寸。人名依照中文圣经常见译名。脚注标记均紧随其所解释的词组。
