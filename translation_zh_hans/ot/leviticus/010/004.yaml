base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/004.yaml
  text: Then Moses called Mishael and Elzaphan[a], the sons of Uzziel, Aaron’s uncle, and said to them, “Come near[b]; carry your brothers away from before the sanctuary to outside the camp.”
translation:
  language: zh_hans
  text: 摩西召了亚伦的叔父乌薛的儿子米沙利和以利撒反来，对他们说：“你们近前来，把你们的弟兄[a]从圣所[b]前抬到营外去。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “弟兄”在希伯来语中也可泛指男性近亲；这里指拿答和亚比户，他们是米沙利和以利撒反的堂兄弟。
    reason: lexical_alternative
  - marker: b
    text: “圣所”也可译作“圣处”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: 召了……来
  rationale: 在叙事语境中，קרא 表示呼叫或召来某人；“召了……来”自然表达了这一动作。
- source_word: בְּנֵי עֻזִּיאֵל דֹּד אַהֲרֹן
  choice: 亚伦的叔父乌薛的儿子
  rationale: 按希伯来语同位结构，乌薛是亚伦的叔父，米沙利和以利撒反是乌薛的儿子；这一汉语次序明确保留亲属关系。
- source_word: קִרְבוּ
  choice: 近前来
  rationale: 保留 קרב 所表达的空间性接近，也符合庄重的命令语气。
- source_word: שְׂאוּ
  choice: 抬
  rationale: נשא 可指举起、承担或搬运；此处对象是尸体，“抬”准确而自然。
- source_word: אֲחֵיכֶם
  choice: 你们的弟兄
  rationale: אָח 可指亲兄弟，也可泛指男性近亲；保留原文的亲属称谓，并以脚注说明此处实际指堂兄弟。
- source_word: מֵאֵת פְּנֵי הַקֹּדֶשׁ
  choice: 从圣所前
  rationale: פְּנֵי 在此具有空间意义，指圣所前面；הַקֹּדֶשׁ 在上下文中指神圣区域或圣所。
- source_word: אֶל מִחוּץ לַמַּחֲנֶה
  choice: 到营外去
  rationale: 清楚表达 אֶל 所标示的移动方向，同时符合现代汉语习惯。
theological_decisions: []
