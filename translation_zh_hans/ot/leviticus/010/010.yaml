base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/010.yaml
  text: to distinguish between the holy and the common[a], and between the unclean and the clean[b],
translation:
  language: zh_hans
  text: 并要分辨圣与俗[a]、不洁净与洁净[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “俗”指没有被分别为圣、属于通常用途的，并不一定含有亵渎或不敬之意。
    reason: lexical_alternative
  - marker: b
    text: 这里指礼仪上不洁净或洁净的状态。
    reason: cultural_note
lexical_decisions:
- source_word: וּלֲהַבְדִּיל
  choice: 并要分辨
  rationale: 该词为带介词的动词不定式，承接上文表达目的或职责。“分辨”自然地体现祭司辨明不同类别的职能；“并要”保留与上文的连接，不把它误作独立命令。
- source_word: בֵּין
  choice: ……与……
  rationale: 希伯来语介词在两组并列范畴中反复标示对比。现代汉语用“甲与乙”表达“在甲乙之间作区分”最简洁自然。
- source_word: הַקֹּדֶשׁ
  choice: 圣
  rationale: 此处名词指被分别为圣的事物或圣的范畴。“圣”保留其概括性，不擅自限定为某一种物件。
- source_word: הַחֹל
  choice: 俗
  rationale: 该词与“圣”相对，指未被分别为圣、属于通常用途的范畴，并不必然表示邪恶或亵渎。“俗”简练地保留祭司条例中的圣俗对举，脚注说明其含义。
- source_word: הַטָּמֵא
  choice: 不洁净
  rationale: 在利未记的语境中，这主要是礼仪身份类别。“不洁净”是准确而通行的表达，且不将其一概解释为道德罪恶。
- source_word: הַטָּהוֹר
  choice: 洁净
  rationale: 该词与“不洁净”成对，表示礼仪上洁净的身份。“洁净”符合利未记语境和现代汉语宗教用语。
theological_decisions:
- issue: קֹדֶשׁ 与 חֹל 所表达的圣俗对比
  choice: 圣与俗
  alternative: 圣与凡俗；圣与亵渎
  rationale: 经文区分的是被分别为圣与未被分别为圣的范畴。“圣与俗”简洁保留原文对举；“亵渎”容易误导读者，以为后者必然涉及主动不敬，故仅在脚注中澄清。
- issue: טָמֵא / טָהוֹר 的性质
  choice: 不洁净与洁净，并以脚注说明为礼仪类别
  alternative: 不纯与纯；将其理解为道德上的污秽与纯洁
  rationale: 利未记此处论及祭司辨别礼仪身份。译文保留传统而准确的词语，同时避免暗示一切不洁净状态都等同于道德罪责。
translation_notes:
  register: 采用简洁、庄重的现代标准汉语。“圣与俗”和“不洁净与洁净”保持原文两组对称及其先后次序；“并要”显示本节在句法上承接前文。
