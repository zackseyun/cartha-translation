  text: וַ/יְדַבֵּ֨ר מֹשֶׁ֜ה אֶֽל אַהֲרֹ֗ן וְ/אֶ֣ל אֶ֠לְעָזָר וְ/אֶל אִ֨יתָמָ֥ר בָּנָי/ו֮ הַ/נּֽוֹתָרִים֒ קְח֣וּ אֶת הַ/מִּנְחָ֗ה הַ/נּוֹתֶ֨רֶת֙ מֵ/אִשֵּׁ֣י יְהוָ֔ה וְ/אִכְל֥וּ/הָ מַצּ֖וֹת אֵ֣צֶל הַ/מִּזְבֵּ֑חַ כִּ֛י קֹ֥דֶשׁ קָֽדָשִׁ֖ים הִֽוא־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/012.yaml
  text: 'Then Moses spoke to Aaron and to Eleazar and to Ithamar[a], his remaining sons: “Take the grain offering that remains from the food offerings of Yahweh, and eat it unleavened beside the altar, because it is most holy.”'
translation:
  language: zh_hans
  text: 随后，摩西对亚伦、亚伦其余的儿子以利亚撒和以他玛说：“你们要取雅威的火祭中所剩的素祭，在祭坛旁吃；要吃无酵的，因为这是至圣之物。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: 随后，摩西……说
  rationale: 叙事性连续式推进事件次序；“随后”符合现代汉语叙事习惯，又不额外赋予转折意味。
- source_word: הַנּוֹתָרִים
  choice: 其余的儿子
  rationale: 保留“剩下、余下”的基本意义，并自然指向拿答、亚比户死后亚伦余下的两个儿子；避免用“幸存”强化原文未明说的险境色彩。
- source_word: הַמִּנְחָה
  choice: 素祭
  rationale: 此处是利未记的专门献祭术语，指谷物类祭物；“素祭”是简明且通行的现代中文圣经术语。
- source_word: הַנּוֹתֶרֶת
  choice: 所剩的
  rationale: 准确表达献给雅威的部分处理之后留下的素祭份额，并与修饰对象自然衔接。
- source_word: מֵאִשֵּׁי יְהוָה
  choice: 献给雅威的祭物中
  rationale: 正文采用现代读者易懂的表达，说明素祭余份来自献给雅威的祭物；脚注保留 אִשֵּׁי 所含的火祭意象及更形式对应的译法。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代中文常用音译呈现四字神名，不以称号替代原文中的专名。
- source_word: וְאִכְלוּהָ מַצּוֹת
  choice: 不加酵地吃
  rationale: מַצּוֹת 在此说明食用时须为无酵状态；该译法自然保留其方式或状态含义，不擅自限定为饼或饼状物。
- source_word: אֵצֶל הַמִּזְבֵּחַ
  choice: 在祭坛旁
  rationale: 准确表达靠近祭坛的位置要求，又不暗示必须与祭坛直接接触。
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: 至圣的
  rationale: 按希伯来语最高级结构表达最高程度的圣洁；用于祭物时，“至圣”比容易让人联想到圣所空间的“至圣所”更准确。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；正文以“雅威”音译专名，既区别于“主”等称号，也贴近学界通常重构的读音。
- issue: אִשֵּׁי 的祭祀含义
  choice: 正文译作“献给雅威的祭物”，脚注保留“雅威的火祭”
  alternative: 正文直接译作“雅威的火祭”
  rationale: 该词既与经火献上的祭物有关，也在祭祀语境中泛指献给神的祭物。正文优先清晰可懂，脚注保留火的意象，不把词义争议静默消除。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“素祭”“祭坛”“至圣”保留必要的利未记祭祀术语；句法避免古奥，同时维持命令语气和礼仪语境。
