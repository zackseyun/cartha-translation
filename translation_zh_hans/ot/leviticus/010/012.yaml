  - severity: low
    issue: 受话者列表的汉语语序略有歧义。
    rationale: “亚伦和他其余的儿子以利亚撒、以他玛”可作同位语理解，但先明确列出亚伦、以利亚撒和以他玛，再补充“亚伦其余的儿子”，更顺畅。
