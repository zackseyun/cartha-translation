revisions:
- from: 随后，摩西对亚伦和他其余的儿子以利亚撒、以他玛说：“你们要拿献给雅威的祭物中所剩的素祭[a]，在祭坛旁不加酵地吃，因为这是至圣的。”
  to: 随后，摩西对亚伦、亚伦其余的儿子以利亚撒和以他玛说：“你们要取雅威的火祭中所剩的素祭，在祭坛旁吃；要吃无酵的，因为这是至圣之物。”
  rationale: 修订主要提升现代汉语的句法清晰度，并将 אִשֵּׁי 在正文中译为“火祭”，直接保留原词的火祭语义。将无酵要求表达为“要吃无酵的”，既不擅自限定具体饼形，也比原句更清楚。其余关键术语和原文的命令、地点及至圣等级均予保留。
