  source_fidelity: 译文总体忠实呈现了叙事推进、亚伦余下的儿子、所剩的素祭、祭坛旁的位置要求及“至圣”的祭祀等级。惟“在祭坛旁不加酵地吃”在现代汉语中修饰关系稍不够清晰；原文的 מַצּוֹת 明确要求该素祭以无酵形式食用，宜明确表达为“要吃无酵的”。
  naturalness: “摩西对亚伦和他其余的儿子以利亚撒、以他玛说”虽可理解，但将同位语置于“亚伦”之后略易造成短暂歧义。改为先列亚伦，再列两位儿子，句法更自然清楚。
  terminology: “雅威”“素祭”“火祭”“祭坛”“至圣之物”均适合本段的礼仪语境。“至圣之物”比单用形容词“至圣的”更符合中文中对祭物类别的自然指称，且不改变希伯来文的最高级含义。
