  text: הֵ֚ן לֹא הוּבָ֣א אֶת דָּמָ֔/הּ אֶל הַ/קֹּ֖דֶשׁ פְּנִ֑ימָה אָכ֨וֹל תֹּאכְל֥וּ אֹתָ֛/הּ בַּ/קֹּ֖דֶשׁ כַּ/אֲשֶׁ֥ר צִוֵּֽיתִי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/018.yaml
  text: Look, its blood was not brought into the sanctuary, inside. You certainly should have eaten it in the holy place, as I commanded.
translation:
  language: zh_hans
  text: 看哪，它的血并没有被带进圣所里面[a]；你们本该在圣所把它吃了[b]，正如我所吩咐的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“被带进圣所内部。”原文在表示神圣区域的词后又加“里面”，强调进入内部。
    reason: lexical_alternative
  - marker: b
    text: 原文直译近似“吃，你们要吃”，以重复词根的表达加强语气；在本节责问既往之事的语境中，意为“你们确实本该把它吃了”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: 看哪
  rationale: 这是引人注意并加强语气的提示词；“看哪”简洁庄重，也保留了原文的强调作用。
- source_word: הוּבָא
  choice: 被带进
  rationale: 该词为בוא的使役被动式，表示血并未由人带入某处；“被带进”同时表达被动和向内移动。
- source_word: דָּמָהּ
  choice: 它的血
  rationale: 阴性单数后缀指前文的赎罪祭牲；现代汉语在祭牲语境中自然用“它”。
- source_word: אֶל־הַקֹּדֶשׁ פְּנִימָה
  choice: 进圣所里面
  rationale: אֶל表示朝向并进入，פְּנִימָה进一步强调内部；译文明确保留“里面”，并以“圣所”表达礼仪性的神圣区域。
- source_word: אָכוֹל תֹּאכְלוּ
  choice: 本该……吃了
  rationale: 不定词绝对式与未完成式连用，加强“吃”的语气；结合摩西追究已经发生之事的上下文，“本该……吃了”自然表达强烈而未履行的命令。
- source_word: אֹתָהּ
  choice: 把它
  rationale: 阴性单数宾语后缀指赎罪祭祭牲或其祭肉；“把它”承接清楚，无须增添原文未明说的名词。
- source_word: בַּקֹּדֶשׁ
  choice: 在圣处
  rationale: 指祭司按规定吃祭物的神圣地点；“圣处”保留礼仪空间含义，也与前句带有“里面”的“圣所”适度区分。
- source_word: כַּאֲשֶׁר צִוֵּיתִי
  choice: 正如我所吩咐的
  rationale: 直接表达比较关系和先前的命令；“正如”也保留了摩西申明命令依据的语气。
theological_decisions:
- issue: 礼仪空间术语的区分
  choice: 前句译作“进圣所里面”，后句译作“在圣处”
  alternative: 两处都译作“圣所”，或把前句具体化为“幔子内”
  rationale: 前句含有表示向内的פְּנִימָה，后句只有בַּקֹּדֶשׁ。译文保留两者的差异，以呈现祭血是否进入内部与祭司是否应吃祭物之间的礼仪逻辑，同时不把原文具体化为未明说的“幔子内”。
- issue: 加强式动词在过去语境中的表达
  choice: 译作“你们本该……吃了”
  alternative: 译作“你们一定要吃”或“你们务要吃”
  rationale: 原文形式加强吃的命令，但上下文是摩西责问已经没有执行的规定；“本该……吃了”兼顾强调和过去未履行的语境，而不将其误作面向将来的命令。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“看哪”保留责问中的强调；“圣所里面”与“圣处”呈现原文相关但不完全相同的空间措辞；整体句式简洁，适合公开诵读。
