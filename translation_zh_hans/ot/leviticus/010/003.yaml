source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר מֹשֶׁ֜ה אֶֽל אַהֲרֹ֗ן הוּא֩ אֲשֶׁר דִּבֶּ֨ר יְהוָ֤ה לֵ/אמֹר֙ בִּ/קְרֹבַ֣/י אֶקָּדֵ֔שׁ וְ/עַל פְּנֵ֥י כָל הָ/עָ֖ם אֶכָּבֵ֑ד וַ/יִּדֹּ֖ם אַהֲרֹֽן־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/003.yaml
  text: 'Then Moses said to Aaron[a], “This is what Yahweh spoke, saying: ‘Among those who come near me I will be sanctified[b], and before all the people I will be glorified.’” And Aaron was silent.'
translation:
  language: zh_hans
  text: 摩西对亚伦说：“这就是耶和华所说的：‘我要在亲近我的人中显为圣[a]，在全体百姓面前得荣耀[b]。’”亚伦默然不语。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我要借着亲近我的人被尊为圣。”希伯来语既可表示上帝的圣洁彰显出来，也可表示亲近他的人承认并尊他为圣。
    reason: alternative_reading
  - marker: b
    text: 或译：“受尊崇。”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的神名译法“耶和华”，以专名而非“主”这一称号对应四字神名。
- source_word: הוּא אֲשֶׁר דִּבֶּר יְהוָה לֵאמֹר
  choice: 这就是耶和华所说的
  rationale: 自然表达原文的指认句式；中文无需机械重复“说，曰”，引语已清楚标示其内容。
- source_word: בִּקְרֹבַי
  choice: 在亲近我的人中
  rationale: 保留介词“在……中”和“亲近者”的开放含义，同时让读者听出祭司接近上帝、事奉上帝的语境，而不把所指限定为“祭司”。
- source_word: אֶקָּדֵשׁ
  choice: 显为圣
  rationale: 原文为קדש的未完成式Nifal，可表达上帝的圣洁被彰显或被承认为圣。“显为圣”在中文中较自然，并保留这两方面的张力。
- source_word: וְעַל־פְּנֵי כָל־הָעָם
  choice: 在全体百姓面前
  rationale: 准确、自然地表达公开发生于全体百姓眼前的意义。
- source_word: אֶכָּבֵד
  choice: 得荣耀
  rationale: 原文为כבד的Nifal，指上帝公开受到尊荣；“得荣耀”保留其神学分量，也与上一分句形成平行。
- source_word: וַיִּדֹּם אַהֲרֹן
  choice: 亚伦默然不语
  rationale: 表达דמם所含的沉默、静止反应；“默然不语”庄重而清楚，符合此处肃穆语境。
theological_decisions:
- issue: 上帝在亲近他的人中“成圣”的含义
  choice: 我要在亲近我的人中显为圣
  alternative: 亲近我的人必须尊我为圣／我要借着亲近我的人被尊为圣
  rationale: “显为圣”既可指上帝的圣洁借审判彰显，也容纳人应当承认并尊他为圣的含义，避免把原文张力单向化。
- issue: אֶכָּבֵד所表达的公开尊荣
  choice: 在全体百姓面前得荣耀
  alternative: 在全体百姓面前受尊崇
  rationale: “得荣耀”与神圣语境和前句的“显为圣”相称；脚注保留较日常的词义选择。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“亲近我的人”保留祭司语境而不作过度限定；“默然不语”呈现亚伦在儿子受审判后的肃穆沉默。所有脚注标记均已置于正文相应位置。
