  text: וַ/אֲכַלְתֶּ֤ם אֹתָ/הּ֙ בְּ/מָק֣וֹם קָדֹ֔שׁ כִּ֣י חָקְ/ךָ֤ וְ/חָק בָּנֶ֨י/ךָ֙ הִ֔וא מֵ/אִשֵּׁ֖י יְהוָ֑ה כִּי כֵ֖ן צֻוֵּֽיתִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/013.yaml
  text: You shall eat it in a holy place[a], because it is your portion and the portion of your sons from the food offerings of Yahweh, for so I have been commanded.
translation:
  language: zh_hans
  text: 你们要在圣处吃它，因为这是你和你儿子从献给雅威的火祭[a]中所得的份；因为我曾这样受命。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“献给雅威的食物祭”。
    reason: אִשֶּׁה 通常译为“火祭”，也有将其理解为献给神的食物性祭物的解释；保留另一可能译法。
lexical_decisions:
- source_word: וַאֲכַלְתֶּם
  choice: 你们要吃
  rationale: 该动词以阳性复数为受词，承接上文的指示；“要吃”在现代汉语中自然表达命令语气，无须机械译出句首连接词。
- source_word: בְּמָקוֹם קָדֹשׁ
  choice: 在圣洁的地方
  rationale: 原文没有定冠词，并不明确限定为某一特定房间；“圣洁的地方”既保留礼仪语境，也避免译得过于具体。
- source_word: חָקְךָ וְחָק בָּנֶיךָ
  choice: 分给你和你儿子们的份
  rationale: חֹק 在祭司礼仪语境中指按规定所得的份额，而非抽象的律例。“你”是单数，指亚伦；“儿子们”保留原文的男性与祭司身份所具有的具体性。
- source_word: מֵאִשֵּׁי יְהוָה
  choice: 从献给雅威的火祭中
  rationale: אִשֶּׁה 指借火献上的祭物或祭礼类别；“火祭”简洁保留其礼仪含义。介词 מִן 表明这一份取自这些祭物。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常用音译呈现四字神名，保留其作为专名的性质，而不以称号代替。
- source_word: כִּי כֵן צֻוֵּיתִי
  choice: 因为我所领受的命令正是如此
  rationale: 保留原文被动式所表示的摩西领受命令之意，并以自然汉语表达 כֵן 的“如此”。
theological_decisions:
- issue: 祭司所得之 חֹק 的含义
  choice: 分给……的份
  alternative: 定例；应得之物
  rationale: 上下文讨论祭物中归祭司食用的指定份额；译作“份”体现具体礼仪安排，同时不附加后来的神学含义。
- issue: אִשֵּׁי יְהוָה 的译法
  choice: 献给雅威的火祭
  alternative: 献给雅威的食物祭
  rationale: “火祭”直接保留该祭祀术语与火的关联；由于该词也可从祭物作为献给神的食物来理解，脚注列出另一译法，以保留词义讨论空间。
- issue: “你儿子们”的所指
  choice: 你儿子们
  alternative: 你的子女；你的后代
  rationale: 原文明确使用“儿子们”，在此具体指亚伦家中承担祭司职分的男性，不宜泛化为所有子女。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“圣洁的地方”“火祭”等词保留利未记的礼仪语域；句式避免文言化。脚注标记紧随其实际说明的“火祭”，而非置于“圣洁的地方”之后。
