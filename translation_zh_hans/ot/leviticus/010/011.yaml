  text: וּ/לְ/הוֹרֹ֖ת אֶת בְּנֵ֣י יִשְׂרָאֵ֑ל אֵ֚ת כָּל הַ֣/חֻקִּ֔ים אֲשֶׁ֨ר דִּבֶּ֧ר יְהוָ֛ה אֲלֵי/הֶ֖ם בְּ/יַד מֹשֶֽׁה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/011.yaml
  text: and to teach the sons of Israel all the statutes that Yahweh has spoken to them by the hand of Moses[a].
translation:
  language: zh_hans
  text: 并要教导以色列人耶和华借摩西[a]向他们所说的一切律例。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 字面意思是：“借摩西的手。”
    reason: 说明 בְּיַד מֹשֶׁה 的字面习语，同时正文采用自然的中介性表达。
lexical_decisions:
- source_word: וּלְהוֹרֹת
  choice: 并要教导
  rationale: וּ连接上文祭司的职责，לְ加使役形不定式表达应履行的目的或责任；“并要教导”既承接上文，也自然体现使人明白的含义。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 该表达字面为“以色列的众子”，在这里作为全体盟约群体的通称；“以色列人”是现代汉语中自然、准确且不致误解为只包括男性的表达。
- source_word: כָּל הַחֻקִּים
  choice: 一切律例
  rationale: חֻקִּים指颁定并应当遵守的规定；“律例”保留律法语境的庄重色彩，也是现代中文圣经语体中清楚可懂的用词。
- source_word: אֲשֶׁר דִּבֶּר יְהוָה אֲלֵיהֶם
  choice: 耶和华向他们所说的
  rationale: 按希伯来语关系从句修饰“律例”；“向他们所说的”保留神发言及以色列人作为受话者的关系。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文中对四字神名最通行的音译“耶和华”，将其作为专名呈现，而不以“主”这一称号替代。
- source_word: בְּיַד מֹשֶׁה
  choice: 借摩西的手
  rationale: 直译该希伯来习语，以保留摩西作为神启示中介的形象；更自然的意译“借着摩西”收入脚注。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 两者都是对神名的音译；“耶和华”在简体中文读者中最通行且明确作为专名使用，不以称号“主”取代原文神名。
- issue: בְּנֵי יִשְׂרָאֵל 是否限定男性
  choice: 以色列人
  alternative: 以色列的众子
  rationale: 该短语虽为语法上的阳性复数，语境中却指整个盟约群体；译作“以色列人”避免在中文里产生仅指男性的额外限定。
- issue: בְּיַד מֹשֶׁה 所表达的中介关系
  choice: 借摩西的手
  alternative: 借着摩西
  rationale: 正文保留原文“借……的手”的中介性意象，同时用脚注提供自然汉语表达，不把摩西理解为这些律例的最终来源。
translation_notes:
  register: 采用现代、庄重而易懂的律法语体。“并要”承接上一节的祭司职责；句序略作汉语化处理，同时保留“借摩西的手”这一原文意象。
