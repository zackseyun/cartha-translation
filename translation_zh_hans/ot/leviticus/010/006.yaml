revisions:
- from: 摩西对亚伦和他的儿子以利亚撒、以他玛说：“不可披头散发[a]，也不可撕裂衣服，免得你们死亡，也免得烈怒临到全会众。但你们的弟兄，就是以色列全家，可以为雅威所燃起的这场焚烧[b]哀哭。”
  to: 摩西对亚伦和他的儿子以利亚撒、以他玛说：“不可披头散发[a]，也不可撕裂衣服，免得你们死亡，又使烈怒临到全体会众。但你们的弟兄，就是以色列全家，要为雅威所施行的焚烧哀哭[b]。”
  rationale: 修订יִבְכּוּ为“要……哀哭”，不再把以色列全家的哀悼仅表述为许可；并以“雅威所施行的焚烧”自然呈现原文的同源“焚烧”表达及神的直接行动。其余措辞保留原译的现代、庄重语体和原文的哀悼习俗。
