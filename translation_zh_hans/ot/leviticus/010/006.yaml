  text: וַ/יֹּ֣אמֶר מֹשֶׁ֣ה אֶֽל אַהֲרֹ֡ן וּ/לְ/אֶלְעָזָר֩ וּ/לְ/אִֽיתָמָ֨ר בָּנָ֜י/ו רָֽאשֵׁי/כֶ֥ם אַל תִּפְרָ֣עוּ וּ/בִגְדֵי/כֶ֤ם לֹֽא תִפְרֹ֨מוּ֙ וְ/לֹ֣א תָמֻ֔תוּ וְ/עַ֥ל כָּל הָ/עֵדָ֖ה יִקְצֹ֑ף וַ/אֲחֵי/כֶם֙ כָּל בֵּ֣ית יִשְׂרָאֵ֔ל יִבְכּוּ֙ אֶת הַ/שְּׂרֵפָ֔ה אֲשֶׁ֖ר שָׂרַ֥ף יְהוָֽה־׀־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/006.yaml
  text: And Moses said to Aaron and to Eleazar and Ithamar his sons[a], “Do not let your heads hang loose, and do not tear your garments, so that you do not die and he become angry with all the congregation. But your brothers, the whole house of Israel[b], shall weep for the burning that Yahweh has kindled.”
translation:
  language: zh_hans
  text: 摩西对亚伦和他的儿子以利亚撒、以他玛说：“不可披头散发[a]，也不可撕裂衣服，免得你们死亡，又使烈怒临到全体会众。但你们的弟兄，就是以色列全家，要为雅威所施行的焚烧哀哭[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“不可露头”，或“不可任头发散乱”。希伯来语所指的是一种涉及头部或头发的哀悼表现。
    reason: lexical_alternative
  - marker: b
    text: 希伯来语直译：“雅威所焚烧的焚烧。”这里译作“雅威所施行的焚烧”，以免中文重复生硬，同时保留雅威直接施行此事的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאשֵׁיכֶם אַל תִּפְרָעוּ
  choice: 不可披头散发
  rationale: פרע在此指让头发散乱、不加约束，是哀悼的表现。“披头散发”以自然现代汉语传达这一动作，同时脚注保留“不可露头”等传统理解。
- source_word: וּבִגְדֵיכֶם לֹא תִפְרֹמוּ
  choice: 也不可撕裂衣服
  rationale: פרם指撕裂衣服，尤其是哀悼举动；此译清楚保留其礼仪语境。
- source_word: וְלֹא תָמֻתוּ
  choice: 免得你们死亡
  rationale: 紧接禁令的否定未完成式表达所警告的后果；“免得”简洁而有警戒力度。
- source_word: וְעַל כָּל הָעֵדָה יִקְצֹף
  choice: 也免得烈怒临到全会众
  rationale: 原文动词为单数，但主语没有明说。译作“烈怒临到”避免擅自补出主语，同时自然表达神圣震怒所造成的后果。
- source_word: וַאֲחֵיכֶם כָּל בֵּית יִשְׂרָאֵל
  choice: 你们的弟兄，就是以色列全家
  rationale: 保留“弟兄”的阳性复数形式，并将“以色列全家”按同位语处理，说明所指是整个民族共同体。
- source_word: יִבְכּוּ אֶת הַשְּׂרֵפָה
  choice: 可以为……这场焚烧哀哭
  rationale: שְׂרֵפָה具体指焚烧或烧毁；“这场焚烧”保留具体意象，“哀哭”体现丧悼语境。这里的未完成式可表达许可或预期，中文用“可以”凸显与祭司禁哀之间的对照。
- source_word: אֲשֶׁר שָׂרַף יְהוָה
  choice: 雅威所燃起的
  rationale: 采用“燃起”避免“焚烧……所焚烧”的生硬重复，同时明确保留雅威是行动者。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以音译呈现四字神名，保留其作为以色列之神专名的功能，不以称号代替。
theological_decisions:
- issue: 是否明说יִקְצֹף的主语
  choice: 以“烈怒临到”保留主语未明说的句法
  alternative: “他向全会众发怒”
  rationale: 上下文可推知发怒者是雅威，但本分句没有明说主语。抽象表达既忠于这种隐含性，也避免无根据地消除原文张力。
- issue: יִבְכּוּ的语气
  choice: 可以……哀哭
  alternative: 要／将要……哀哭
  rationale: 未完成式在此可理解为许可、指示或预期。祭司被禁止采用哀悼标志，而以色列全家则可哀哭；正文采用许可语气，未将哀哭解释为对神审判的抗议。
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 采用较直接反映学界通常重构读音的现代汉语音译，并明确其为专名。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。“披头散发”“撕裂衣服”“哀哭”保留古代哀悼习俗的具体性；“全会众”“以色列全家”维持盟约共同体用语。
