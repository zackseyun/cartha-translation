review_pass:
  verdict: revise
  source_fidelity: “可以为……哀哭”将יִבְכּוּ弱化为许可；在此与对祭司的禁令相对，较适合译为对以色列全家的指示／预期（“要……哀哭”）。此外，“这场焚烧”搭配“所燃起的”在中文中不够自然，且“燃起”较偏向点火，未能很好对应原文“焚烧……所焚烧”的同源表达。
  naturalness: 整体庄重通顺。“全体会众”“要为……哀哭”比“全会众”“可以为……哀哭”更符合现代标准汉语的经文语体；“雅威所施行的焚烧”能在不生硬重复的情况下保留原文所强调的焚烧及雅威的行动者身份。
  terminology: “雅威”“披头散发”“撕裂衣服”“哀哭”均恰当。保留“弟兄”和“以色列全家”符合原文的措辞与民族共同体指涉。
  issues:
  - severity: medium
    issue: “可以为……哀哭”误弱化יִבְכּוּ的语气。
    rationale: 此处第三人称复数未完成式是在说明／吩咐以色列全家应有的哀悼行动，而不是单纯准许他们哀哭。译为“要……哀哭”更准确地保留其与祭司禁哀的对照。
  - severity: medium
    issue: “雅威所燃起的这场焚烧”表达不自然，且“燃起”范围偏窄。
    rationale: שְׂרֵפָה及其同源动词强调焚烧造成的事件／毁灭；中文以“所施行的焚烧”可避免不自然的同源重复，同时不把行动限缩为仅仅点燃火焰。
  - severity: low
    issue: “全会众”可调整为“全体会众”。
    rationale: 后者在现代汉语中更自然，且不改变עֵדָה的集体含义。
