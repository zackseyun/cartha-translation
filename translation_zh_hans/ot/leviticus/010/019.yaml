base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/019.yaml
  text: And Aaron said to Moses[a], “Look, today they presented their sin offering and their burnt offering before Yahweh, and things like these have happened to me. If I had eaten the sin offering today[c][b], would it have been good in the sight of Yahweh?”
translation:
  language: zh_hans
  text: 亚伦对摩西说：“你看，今天他们在耶和华面前献上了自己的赎罪祭[a]和燔祭，而这样的事竟临到我[b]。如果我今天吃了赎罪祭，耶和华看为好吗[c]？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “赎罪祭”也可译作“洁净祭”。希伯来语 חַטָּאת 既与“罪”有关，在利未记的献祭语境中也可指使人从罪或不洁中得洁净的祭。本节两处相同。
    reason: lexical_alternative
  - marker: b
    text: “这样的事竟临到我”，主要是指当天发生的灾祸，尤其是亚伦两个儿子的死亡。
    reason: cultural_note
  - marker: c
    text: 也可译作：“会蒙耶和华喜悦吗？”
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: 你看
  rationale: 这是引起对方注意并引出解释的语气词；“你看”符合现代汉语口吻，也保留了强调作用。
- source_word: הִקְרִיבוּ
  choice: 献上了
  rationale: 使役形在献祭语境中指把祭物呈献；“献上”自然、明确。
- source_word: חַטָּאתָם / חַטָּאת
  choice: 自己的赎罪祭 / 赎罪祭
  rationale: 此处指祭物而非抽象的“罪”；“赎罪祭”是利未记语境中通行且易懂的译法，同时以脚注保留“洁净祭”这一可辩护的理解。
- source_word: עֹלָתָם
  choice: 燔祭
  rationale: 这是该祭牲完全焚烧献上的专门祭名，沿用现代中文圣经读者熟悉的表达。
- source_word: לִפְנֵי יְהוָה
  choice: 在耶和华面前
  rationale: 贴近原文的礼仪用语，表达祭物是在耶和华临在之处献上的。
- source_word: וַתִּקְרֶאנָה אֹתִי כָּאֵלֶּה
  choice: 而这样的事竟临到我
  rationale: 保留“这类事情临到我”的原文表达，并用“竟”自然传达当日灾祸突临的语感；不在正文中把所指限定为某一种礼仪状态。
- source_word: וְאָכַלְתִּי
  choice: 如果我今天吃了
  rationale: 形式上是连接词加完成式，但在上下文中引出反事实色彩的修辞问句；汉语用“如果……了”能清楚表达其论辩功能。
- source_word: הַיִּיטַב בְּעֵינֵי יְהוָה
  choice: 耶和华看为好吗
  rationale: 保留“在……眼中为好”的判断意象，同时采用自然现代汉语；脚注给出较顺畅但更具解释性的“会蒙耶和华喜悦吗”。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经传统中对神圣四字名最通行、最易识别的音译。
theological_decisions:
- issue: 亚伦不吃赎罪祭的辩解性质
  choice: 让亚伦把当天临到他的灾祸与吃祭物是否蒙神认可联系起来，但不具体说明原因是哀伤、礼仪状态，还是更广义的合宜性。
  alternative: 明确译成亚伦因丧子而不洁，不能吃祭物；或仅说他因个人悲痛而不愿吃。
  rationale: 原文只提出当天所遭遇的事，并以神是否看为好作修辞性反问，没有交代确切的礼仪或心理机制；译文应保留这种神学与礼仪上的张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“你看”保留亚伦当面申辩的口吻；“竟临到我”传达突遭灾祸而不过度解释；祭祀术语采用“赎罪祭”“燔祭”。所有脚注标记均置于相关正文处，并按正文出现顺序排列。
