base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/007.yaml
  text: And you shall not go out from the entrance of the tent of meeting, lest you die, because the anointing oil of Yahweh is on you.” And they did according to the word of Moses.
translation:
  language: zh_hans
  text: 你们不可从会幕门口出去，免得你们死亡，因为雅威的膏抹油在你们身上。”他们就照摩西所说的话做了。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּמִפֶּתַח אֹהֶל מוֹעֵד
  choice: 离开会幕门口
  rationale: מִן与יצא连用，表示“从……出去、离开”；פֶּתַח指入口或门口。将אֹהֶל מוֹעֵד译为通行且易懂的礼仪术语“会幕”。
- source_word: לֹא תֵצְאוּ
  choice: 你们不可离开
  rationale: 否定词加未完成式在此表达严肃禁令；“不可”既保留律法语气，又符合现代汉语。
- source_word: פֶּן תָּמֻתוּ
  choice: 免得死亡
  rationale: פֶּן引出所警告的后果。“免得死亡”保留原文的目的／警戒表达，不将其改写成更确定的“否则必死”。
- source_word: כִּי
  choice: 因为
  rationale: 此处引出不得离开的理由，译作“因为”清楚自然。
- source_word: שֶׁמֶן מִשְׁחַת יְהוָה
  choice: 雅威的膏油
  rationale: 该结构指与雅威的膏立和分别为圣有关的油；“雅威的膏油”简洁自然，并保留其归属于雅威的关系。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以“雅威”音译四字神名，区别于作为称号的“主”。
- source_word: עֲלֵיכֶם
  choice: 在你们身上
  rationale: 直译介词עַל在此处的空间及礼仪含义，表明膏油已施在这些祭司身上。
- source_word: וַיַּעֲשׂוּ כִּדְבַר מֹשֶׁה
  choice: 他们就照摩西的话做了
  rationale: וַיַּעֲשׂוּ推进叙事，“就”自然体现承接；כִּדְבַר表示按所说的话而行，译文准确且通顺。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。采用“雅威”保留其专名性质，不以称号“主”替代；“耶和华”是传统形式，但较不能反映通常重构的读音。
- issue: 膏油“在你们身上”的含义
  choice: 保留具体表述“在你们身上”
  alternative: 意译为“你们已被分别为圣”
  rationale: 原文以膏油在他们身上说明禁令的理由，既有具体礼仪层面，也隐含受膏后的圣职身份。直译可避免只保留抽象神学解释。
- issue: פֶּן תָּמֻתוּ所表达的警告力度
  choice: 免得死亡
  alternative: 否则你们必死
  rationale: פֶּן引出需要防止的严重后果，但原文没有在此加入“必”字；译文保留其警告形式，不额外强化为明言的绝对断语。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“会幕”“膏油”保留利未记的礼仪语域；“不可”“免得”维持禁令的肃穆感，但避免文言化。引号承接上文摩西的话，随后转入叙事。
