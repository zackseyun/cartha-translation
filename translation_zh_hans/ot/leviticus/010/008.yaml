  text: וַ/יְדַבֵּ֣ר יְהוָ֔ה אֶֽל אַהֲרֹ֖ן לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/008.yaml
  text: And Yahweh spoke to Aaron[a], saying,
translation:
  language: zh_hans
  text: 雅威[a]对亚伦说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文为 יהוה（YHWH，四字神名）；也常译作“耶和华”。
    reason: 说明神名的原文形式及常见的另一译法。
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: 对……说
  rationale: 该动词配合叙事性的 וַ־ 推进叙事；在汉语神谕引介语中，“对……说”自然、准确，也避免把 וַ־ 生硬译成“并且”。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文四字神名 YHWH 音译，以保留这里所用的上帝专名，而不以称号替代。
- source_word: אֶל
  choice: 对
  rationale: 标明说话的对象；现代汉语用“对”最自然。
- source_word: אַהֲרֹן
  choice: 亚伦
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: לֵאמֹר
  choice: 说：
  rationale: 该不定式用于引出随后话语的内容；汉语以“说：”连同冒号表达此功能，既自然又保留引语结构。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名 YHWH。正文采用较贴近其通常学术重构读音的“雅威”，以保留专名；脚注列出中文读者熟悉的传统译名“耶和华”。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。希伯来语的叙事连接词不单独直译；神谕引介公式译作“雅威对亚伦说：”。
