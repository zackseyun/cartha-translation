  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: יַ֣יִן וְ/שֵׁכָ֞ר אַל תֵּ֣שְׁתְּ אַתָּ֣ה וּ/בָנֶ֣י/ךָ אִתָּ֗/ךְ בְּ/בֹאֲ/כֶ֛ם אֶל אֹ֥הֶל מוֹעֵ֖ד וְ/לֹ֣א תָמֻ֑תוּ חֻקַּ֥ת עוֹלָ֖ם לְ/דֹרֹתֵי/כֶֽם־׀׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/009.yaml
  text: You and your sons with you shall not drink wine or strong drink when you enter the tent of meeting[a], lest you die[c][b]. It is a permanent statute throughout your generations.
translation:
  language: zh_hans
  text: “你的儿子们和你进会幕时，不可喝葡萄酒或烈酒，免得你们死亡。这要作你们世世代代永远的条例。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יַיִן
  choice: 葡萄酒
  rationale: 该词通常指葡萄发酵制成的酒；译为“葡萄酒”准确而自然。
- source_word: שֵׁכָר
  choice: 烈酒
  rationale: 泛指葡萄酒以外能使人醉的酒类；“烈酒”是简洁、通行的对应，但不应限于现代蒸馏酒。
- source_word: אַל תֵּשְׁתְּ
  choice: 不可喝
  rationale: אַל加未完成式表达禁令；“不可喝”符合中文律例语体，并保留命令力度。
- source_word: אַתָּה וּבָנֶיךָ אִתָּךְ
  choice: 你和跟你在一起的儿子们
  rationale: 保留“你”“你的儿子们”及אִתָּךְ“跟你在一起”，明确亚伦和众子一同受此禁令约束。
- source_word: בְּבֹאֲכֶם
  choice: 进……时
  rationale: ב加不定词结构表示时间或情境；中文“进……时”自然地表达这一限定。
- source_word: אֹהֶל מוֹעֵד
  choice: 会幕
  rationale: 这是该圣所名称在现代中文圣经语境中最通行且简明的译法。
- source_word: וְלֹא תָמֻתוּ
  choice: 免得你们死亡
  rationale: 在禁令之后表达应当避免的致命后果；“免得”保留警告和目的/结果之间的张力，不将其改写为绝对结果陈述。
- source_word: חֻקַּת עוֹלָם
  choice: 永远的条例
  rationale: 这是持续有效之律例的固定表达；“永远的条例”保留עוֹלָם的长久性和庄严法律语气。
- source_word: לְדֹרֹתֵיכֶם
  choice: 你们世世代代
  rationale: 表示此条例延续于后代；“世世代代”是自然、庄重的现代中文表达。
theological_decisions:
- issue: 死亡警告从句的语力
  choice: 译作“免得你们死亡”
  alternative: “这样你们就不至于死亡”或“你们就不会死亡”
  rationale: 希伯来文在禁令后接וְלֹא תָמֻתוּ，可表达所要避免的后果。“免得”既直接保留警告，也不把句法过度限定为单纯目的或机械性的结果。
- issue: 禁酒命令的适用范围
  choice: 以“进会幕时”限定禁令
  alternative: 将其理解为祭司在任何情况下都须完全禁酒
  rationale: בְּבֹאֲכֶם אֶל אֹהֶל מוֹעֵד明确提供进入会幕这一时间和场景限定；译文不将禁令扩大为任何时候都不得饮酒。
- issue: חֻקַּת עוֹלָם与后续世代的关系
  choice: 译作“这是你们世世代代永远的条例”
  alternative: “这是永久的条例，直到你们的世世代代”
  rationale: 保留条例长久有效并跨越历代的法律公式，不在译文中预先界定其神学上的终止或延续方式。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语，保留律例语气。句首引语承接上文耶和华对亚伦的直接讲话。“烈酒”在现代汉语中可能让人联想到蒸馏酒，但此处按古希伯来语应广义理解为葡萄酒以外能使人醉的酒类。
