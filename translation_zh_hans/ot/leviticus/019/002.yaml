  text: דַּבֵּ֞ר אֶל כָּל עֲדַ֧ת בְּנֵי יִשְׂרָאֵ֛ל וְ/אָמַרְתָּ֥ אֲלֵ/הֶ֖ם קְדֹשִׁ֣ים תִּהְי֑וּ כִּ֣י קָד֔וֹשׁ אֲנִ֖י יְהוָ֥ה אֱלֹהֵי/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/002.yaml
  text: Speak to all the congregation of the sons of Israel[a], and say to them, ‘You shall be holy, for I, Yahweh your God[b], am holy.’
translation:
  language: zh_hans
  text: 你要对以色列人的全体会众[a]说，告诉他们：‘你们要圣洁[b]，因为我——耶和华、你们的上帝——是圣洁的。’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“以色列全体会众”。
    reason: lexical_alternative
  - marker: b
    text: 也可译：“你们务要圣洁”或“你们当圣洁”。
    reason: alternative_reading
lexical_decisions:
- source_word: דַּבֵּר
  choice: 说
  rationale: 这是דבר的Piel祈使式，直接吩咐摩西发言；“说”简明自然，也符合庄重的律法语境。
- source_word: כָּל עֲדַת בְּנֵי יִשְׂרָאֵל
  choice: 以色列人的全体会众
  rationale: עֵדָה指聚集成群的约民共同体，כָּל强调全体；בְּנֵי יִשְׂרָאֵל在这里是指以色列民族整体的固定表达，译作“以色列人”符合现代汉语习惯，且不缩窄为男性后裔。
- source_word: וְאָמַרְתָּ אֲלֵהֶם
  choice: 告诉他们
  rationale: 承接前面的“说”，表达律法话语中常见的命令序列；采用“告诉他们”可避免现代汉语中“说……对他们说”的生硬重复。
- source_word: קְדֹשִׁים תִּהְיוּ
  choice: 你们要圣洁
  rationale: 复数形容词与未完成式היה结合，在此具有规范、命令性的力量；“要圣洁”既保留应然语气，也不把句式过度解释为单纯命令或未来预告。
- source_word: קָדוֹשׁ
  choice: 圣洁
  rationale: 该词表达与上帝相关的神圣、分别及纯全；“圣洁”是准确而通行的译法，比单译“分别出来”涵义更完整。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的专名形式音译四字神名，不以“主”这一称号代替上帝的名字。
- source_word: אֱלֹהֵיכֶם
  choice: 你们的上帝
  rationale: 第二人称阳性复数后缀指向受话的整个群体；“你们的上帝”自然呈现其约的关系。
theological_decisions:
- issue: 如何翻译בְּנֵי יִשְׂרָאֵל这一约民称谓
  choice: 以色列人
  alternative: 以色列的子孙
  rationale: 该希伯来语短语字面具有父系后裔形式，但在本节指整个以色列共同体。现代汉语“以色列人”准确传达所指对象，也避免让读者误以为命令只针对男性；脚注保留会众结构的另一种表达。
- issue: 圣洁要求的语气
  choice: 你们要圣洁
  alternative: 你们务要圣洁；你们当成为圣洁的人
  rationale: קְדֹשִׁים תִּהְיוּ在语法上是“圣洁”加未完成式“成为／是”，在本段律法语境中带命令或义务色彩。“要圣洁”保留这种力量，同时不把它限定为纯粹祈使或未来陈述。
- issue: 上帝的圣洁与百姓圣洁之间的关系
  choice: 因为我耶和华你们的上帝是圣洁的
  alternative: 因为我——耶和华你们的上帝——是圣洁的
  rationale: כִּי明确给出百姓应当圣洁的根据；译文保留因果关系，不进一步解释百姓的圣洁与上帝圣洁在性质或程度上的关系。
translation_notes:
  register: 采用现代、庄重而易懂的律法宣告语体。“说，告诉他们”保留原文两个言说动词的递进，同时使汉语流畅；引语中的复数“你们”清楚对应全体会众。
