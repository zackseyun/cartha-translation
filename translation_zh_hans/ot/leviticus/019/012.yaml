id: LEV.19.12
reference: Leviticus 19:12
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/לֹֽא תִשָּׁבְע֥וּ בִ/שְׁמִ֖/י לַ/שָּׁ֑קֶר וְ/חִלַּלְתָּ֛ אֶת שֵׁ֥ם אֱלֹהֶ֖י/ךָ אֲנִ֥י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/012.yaml
  text: You shall not swear falsely by my name and so profane the name of your God[a]. I am Yahweh.
translation:
  language: zh_hans
  text: 不可奉我的名起假誓，以致亵渎你上帝的名。我是雅威。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תִשָּׁבְעוּ
  choice: 起誓
  rationale: שׁבע 的尼斐勒式在法律和伦理语境中指起誓；现代汉语以“起誓”自然、明确。
- source_word: בִשְׁמִי
  choice: 奉我的名
  rationale: 介词 ב 与“名”连用表示起誓时所援引的名号；“奉我的名”符合现代汉语的宣誓表达。
- source_word: לַשָּׁקֶר
  choice: 假
  rationale: 字面为“为了虚假/归于虚假”，在起誓语境中作方式或目的限定；“起假誓”简洁传达虚假誓言，同时避免把具体所指限定为仅仅陈述不实。
- source_word: וְחִלַּלְתָּ
  choice: 以致亵渎
  rationale: חלל 的皮耶勒式意为亵渎、玷污神圣之物；此处连接词可表达前一行为造成的结果，“以致”自然呈现这种联系。
- source_word: שֵׁם
  choice: 名
  rationale: 保留原文“名”，因为它在经文中承载上帝所启示的身份与尊荣，不宜意译为“名誉”等。
- source_word: אֱלֹהֶיךָ
  choice: 你的上帝
  rationale: אֱלֹהִים 虽为复数形态，此处由语境明确指以色列独一的上帝；第二人称后缀为单数。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代中文常见音译呈现四字神名，保留其专名性质，不以称号替代。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名；“雅威”较贴近通常重构的读音，并保留其作为专名的功能。
- issue: 第二分句与第一分句的逻辑关系
  choice: 结果关系：“以致亵渎”
  alternative: 并列关系：“又亵渎”
  rationale: 希伯来语 ו 可仅作并列，也可在此语境中表示虚假起誓所导致的结果；正文采用自然的结果表达，但不增加超出语境的新内容。
translation_notes:
  register: 采用简洁、庄重的现代标准汉语。“不可”保留法律禁令的力度；“起假誓”比“虚假地起誓”更自然。“你”依原文为单数。
