source:
  edition: WLC
  text: וְ/כִי תָבֹ֣אוּ אֶל הָ/אָ֗רֶץ וּ/נְטַעְתֶּם֙ כָּל עֵ֣ץ מַאֲכָ֔ל וַ/עֲרַלְתֶּ֥ם עָרְלָת֖/וֹ אֶת פִּרְי֑/וֹ שָׁלֹ֣שׁ שָׁנִ֗ים יִהְיֶ֥ה לָ/כֶ֛ם עֲרֵלִ֖ים לֹ֥א יֵאָכֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/023.yaml
  text: When you come into the land and plant any kind of tree for food[a], you shall regard its fruit as uncircumcised. For three years it shall be forbidden to you; it shall not be eaten.
translation:
  language: zh_hans
  text: 你们进入那地，栽种各样供食用的树时，要把所结的果子视为未受割礼的[a]。三年之内，这些果子在你们看来都要算为未受割礼的；不可食用。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“未受割礼的”。这里用作比喻，指头三年所结的果子在法律上尚不准食用。
    reason: 解释原文隐喻及其在本节中的法律含义。
lexical_decisions:
- source_word: וְ/כִי תָבֹאוּ אֶל הָאָרֶץ
  choice: 你们进入那地……时
  rationale: כִּי在律法语境中引出将来的情形，宜译为“……时”；“那地”保留原文特指而不擅自补作“迦南”。
- source_word: וּנְטַעְתֶּם כָּל עֵץ מַאֲכָל
  choice: 栽种各样可作食物的树
  rationale: 指为取得食物而栽种的各类果树；“各样”自然表达כָּל的涵盖意义。
- source_word: וַעֲרַלְתֶּם עָרְלָתוֹ אֶת פִּרְיוֹ
  choice: 要把树的果子看作未受割礼的
  rationale: 保留ערל/ערלה的刻意隐喻，同时用“看作”表达其法律和礼仪身份，而非字面的身体行为。
- source_word: שָׁלֹשׁ שָׁנִים יִהְיֶה לָכֶם עֲרֵלִים
  choice: 三年之内，这果子对你们都是禁食的
  rationale: לָכֶם表示相对于以色列人的规定状态；此处以“禁食的”传达该状态的实际效力，并避免中文重复隐喻造成误解。
- source_word: לֹא יֵאָכֵל
  choice: 不可吃
  rationale: 简洁保留尼法勒式的非人称、被动禁令语气，而不明确添加“你们”作主语。
theological_decisions:
- issue: 是否在正文中保留果子“未受割礼”的隐喻
  choice: 首次出现时保留“未受割礼的”，随后以“禁食的”说明其实际效力
  alternative: 两处都译为“禁食的”或“不可吃的”
  rationale: 原文刻意使用ערל/ערלה这一带有圣约和礼仪色彩的词，完全意译会抹去其神学质感；但第二次在结论性禁令中译出功能意义，可使现代读者清楚理解，且不把隐喻误解为园艺操作。
translation_notes:
  register: 采用现代、庄重而易懂的律法语体。“那地”延续经文中的特指；“未受割礼的”保留原文陌生而重要的隐喻，并由脚注解释。
