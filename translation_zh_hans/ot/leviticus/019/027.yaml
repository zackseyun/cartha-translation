base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/027.yaml
  text: You shall not round off the hair at the sides of your head[c][b][a], and you shall not mar the edges of your beard.
translation:
  language: zh_hans
  text: 你们不可把头两侧的头发修成圆形[a][b]，也不可毁坏胡须的边缘[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “头两侧”所译的原文词也可指“边缘”“侧面”或“角落”。
    reason: lexical_alternative
  - marker: b
    text: 这句话可能指把头两侧的头发环绕剃剪成圆形；原文没有进一步说明具体做法。
    reason: cultural_note
  - marker: c
    text: “毁坏”也可译作“损坏”或“使……残缺”；原文没有明确指明修剪方式。
    reason: lexical_alternative
lexical_decisions:
- source_word: תַקִּפוּ
  choice: 修成圆形
  rationale: 该词在此指把头部边缘的头发环绕修剪成圆形。“修成圆形”保留具体形状，又不把动作限定为完全剃除。
- source_word: פְּאַת רֹאשְׁכֶם
  choice: 你们头两侧的发际
  rationale: פֵּאָה可指边缘、侧面或角落；结合头发修整的语境，“头两侧的发际”在现代汉语中清楚自然，也保留其作为头部边缘的含义。
- source_word: תַשְׁחִית
  choice: 毁坏
  rationale: שׁחת的使役形通常有毁坏、损坏之意。“毁坏”保留原词较强的力度，不擅自明确具体使用剃、剪或其他方式。
- source_word: פְּאַת זְקָנֶךָ
  choice: 胡须的边缘
  rationale: 直译其边缘或末端之意，不把禁令缩窄为某一种特定胡须造型。
- source_word: לֹא ... וְלֹא
  choice: 不可……也不可……
  rationale: 符合现代汉语律法性禁令的庄重表达，并准确传达两个并列禁令。
theological_decisions:
- issue: 禁令的性质与背景
  choice: 正文只陈述具体的头发和胡须修整禁令，不补入其动机
  alternative: 将禁令明确解释为反对异教哀悼习俗，或泛指禁止周边民族的某些装束
  rationale: 本节希伯来文本没有明说禁令缘由；不在正文中补入文化或宗教动机，可保留文本本身的解释空间。
- issue: 人称数的转换
  choice: 汉语正文按群体性命令统一表达为“你们”，不生硬呈现第二分句的单数后缀
  alternative: 译为“你们不可……也不可毁坏你的胡须边缘”
  rationale: 原文第一分句的后缀为复数，第二分句为单数，这种转换在律法训令中可作集合性、分配性的称呼。现代汉语若机械转换会造成指代混乱，统一为群体命令并不消除禁令对每个人的适用。
translation_notes:
  register: 采用现代、庄重而易懂的律法语体。“不可……也不可……”保留并列禁令的节奏；“发际”比“头的角落”更符合现代汉语，同时以脚注保留פֵּאָה的词义范围。
