base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/026.yaml
  text: You shall not eat over the blood[b][a]. You shall not practice divination or interpret omens.
translation:
  language: zh_hans
  text: 不可在血上进食[a]；不可行占卜，也不可解读征兆[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“与血同吃”。这句希伯来语含义难定，可能指吃尚带血的肉，也可能指参加与血有关的仪式性宴席。
    reason: alternative_reading
  - marker: b
    text: 或译“行术数”；传统上也有译作“占候时日”的。
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא תֹאכְלוּ
  choice: 不可……吃东西
  rationale: 否定词加未完成式在律法语境中表达禁令。“不可”保持庄重而清楚的律法语体。
- source_word: עַל הַדָּם
  choice: 在血上
  rationale: 希伯来语短语含义难定。较直译的表达保留介词עַל及原文歧义，避免把所禁行为武断限定为吃带血的肉或参加某种血祭宴席。
- source_word: תְנַחֲשׁוּ
  choice: 行占卜
  rationale: נחשׁ的强意词干指占卜活动。“行占卜”是现代汉语中自然、明确且庄重的说法。
- source_word: תְעוֹנֵנוּ
  choice: 观兆
  rationale: 该词在此词干中的确切含义并不完全确定，通常与观测、解释征兆或术数活动有关。“观兆”简明传达较可能的意义，同时用脚注保留传统译法。
theological_decisions:
- issue: 如何翻译含义不明的禁令עַל הַדָּם
  choice: 正文保留较直译的“在血上”
  alternative: 与血同吃；趁肉中还有血时吃；参加与血有关的祭仪宴席
  rationale: 这项禁令的确切所指存在争议，可能关乎吃带血的肉、参加与血有关的仪式性宴席，或其他祭仪行为。正文不替读者确定其中一种解释，而在脚注中列出主要可能性。
- issue: תְעוֹנֵנוּ所指的术法
  choice: 观兆
  alternative: 行术数；占候时日；行占卜
  rationale: 词义有争议，且与前一动词可能部分重叠。“观兆”保持两项禁令的区分，又不把它狭义确定为选择吉日。
translation_notes:
  register: 采用现代、庄重而易懂的律法语体，以“不可”表达连续禁令。正文尽量简洁；对原文真正存在的词义与仪式背景歧义，借脚注说明而不在正文中强行消解。
