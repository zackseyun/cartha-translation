  text: אַל תְּחַלֵּ֥ל אֶֽת בִּתְּ/ךָ֖ לְ/הַזְנוֹתָ֑/הּ וְ/לֹא תִזְנֶ֣ה הָ/אָ֔רֶץ וּ/מָלְאָ֥ה הָ/אָ֖רֶץ זִמָּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/029.yaml
  text: Do not profane your daughter by making her a prostitute[c][b][a], lest the land become prostituted and the land be filled with depravity.
translation:
  language: zh_hans
  text: 不可使你的女儿卖淫而玷辱她[a]，免得这地行淫[b]，遍地充满淫邪[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “玷辱”也可译作“亵渎”或“污辱”。“使她卖淫”在希伯来文中是使役形式，指使她从事卖淫。
    reason: lexical_alternative
  - marker: b
    text: 直译“免得这地行淫”。这里把“地”人格化，描写整个社会受到败坏。
    reason: lexical_alternative
  - marker: c
    text: 或译“无耻恶行”或“邪恶”。原词指骇人的道德败坏，在本节语境中带有明显的性意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּחַלֵּל
  choice: 亵渎
  rationale: 该词为 חלל 的加强词干，在本节表示把人当作不圣洁的、予以玷辱。“亵渎”保留《利未记》中圣与俗的语义背景。
- source_word: בִּתְּךָ
  choice: 你的女儿
  rationale: 保留原文单数名词及第二人称阳性单数所属形式。
- source_word: לְהַזְנוֹתָהּ
  choice: 使你的女儿卖淫
  rationale: זנה 的使役式不定词带第三人称阴性单数后缀，强调使她从事卖淫，而非仅说她自行行淫。
- source_word: תִזְנֶה הָאָרֶץ
  choice: 这地也行淫
  rationale: 直译并保留原文将“地”人格化、以行淫描写全体社会败坏的隐喻；“也”自然表达前后行为的扩散关系。
- source_word: וּמָלְאָה הָאָרֶץ
  choice: 遍地充满
  rationale: 在“免得”所引出的后果中，用自然的现代汉语表达全地被某种恶行充斥。
- source_word: זִמָּה
  choice: 淫邪
  rationale: 该词可指恶谋、无耻恶行，且在《利未记》的语境中常带明显的性犯罪色彩；“淫邪”兼顾性意味与严重的道德败坏。
theological_decisions:
- issue: 是否保留“地行淫”的隐喻
  choice: 译作“这地也行淫”
  alternative: 这地败坏／这地陷入淫乱
  rationale: 原文直接以 זנה 描写“地”，既把群体人格化，也把个人行为与全地败坏联系起来；保留隐喻更能传达原文的修辞力度。
- issue: 是否用圣俗语域翻译 חלל
  choice: 译作“亵渎”
  alternative: 玷污／羞辱
  rationale: 本章处于《利未记》的圣洁语境，“亵渎”较能保留 חלל 所涉及的使之成为不圣洁之物这一观念，同时不加入特定宗派解释。
- issue: זִמָּה 的范围
  choice: 正文译作“淫邪”，脚注列出较宽的可能译法
  alternative: 邪恶／无耻恶行／淫乱
  rationale: 上下文支持性方面的恶行，但该词本身可涵盖更广的蓄意、骇人的道德败坏；正文体现当前语境，脚注保存词义幅度。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“卖淫”直接清楚，“亵渎”维持《利未记》的圣洁语域；“这地也行淫”刻意保留原文略显突出的拟人隐喻。所有脚注标记依正文出现顺序排列。
