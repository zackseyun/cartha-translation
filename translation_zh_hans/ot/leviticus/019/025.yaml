  text: וּ/בַ/שָּׁנָ֣ה הַ/חֲמִישִׁ֗ת תֹּֽאכְלוּ֙ אֶת פִּרְי֔/וֹ לְ/הוֹסִ֥יף לָ/כֶ֖ם תְּבוּאָת֑/וֹ אֲנִ֖י יְהוָ֥ה אֱלֹהֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/025.yaml
  text: And in the fifth year you may eat its fruit, so that it may increase its produce for you. I am Yahweh your God.
translation:
  language: zh_hans
  text: 第五年，你们可以吃那树的果子，以增加你们从那树所得的收成。我是耶和华——你们的神。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבַשָּׁנָה הַחֲמִישִׁת
  choice: 第五年
  rationale: 承接上文律例的时间次序；现代汉语不必机械译出句首连接词，也能自然体现从前四年到第五年的推进。
- source_word: תֹּאכְלוּ
  choice: 你们可以吃
  rationale: 未完成式在此前禁令解除的律法语境中表示许可；“可以吃”比“要吃”或“将吃”更准确地传达其语用功能。
- source_word: אֶת־פִּרְיוֹ
  choice: 它的果子
  rationale: פְּרִי在此指所栽果树的果实，三阳单数后缀照译为“它的”。
- source_word: לְהוֹסִיף
  choice: 好使……增加
  rationale: 带לְ的不定式表达目的或结果；“好使”保留这一关系，而不把目的与结果之间的细微张力强行定死。
- source_word: תְּבוּאָתוֹ
  choice: 它……出产
  rationale: תְּבוּאָה指产出、收成或产量；“出产”涵盖较广，并与前面的具体“果子”有所区别。
- source_word: אֲנִי יְהוָה אֱלֹהֵיכֶם
  choice: 我是耶和华你们的神
  rationale: 保留利未记中庄严的盟约自我宣告；以现代中文圣经传统中通行的专名“耶和华”对应神名יהוה。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。中文采用广为人知的专名“耶和华”，既不以“主”代替神名，也保持普通读者可辨识的庄重表达。
- issue: 增加出产这一分句的目的／结果关系
  choice: 好使它为你们增加出产
  alternative: 它就会为你们增加出产
  rationale: לְהוֹסִיף可表达目的并带有结果意味；“好使”贴近其句法功能，同时不把这句话改写成单纯的因果保证。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“你们可以吃”清楚表达律法许可；整体保持简洁，避免补入原文未明说的施事者或农业机制。
