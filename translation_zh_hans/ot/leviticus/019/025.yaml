- from: 第五年，你们可以吃它的果子，好使它为你们增加出产。我是耶和华你们的神。
  to: 第五年，你们可以吃那树的果子，以增加你们从那树所得的收成。我是耶和华——你们的神。
  rationale: 修订仅处理中文代词指代与搭配问题。“那树”由紧邻上下文中所栽的果树明确引出，并非增添新的事实；“以增加你们从那树所得的收成”保留 לְהוֹסִיף 所表达的目的／结果向度，且以“收成”自然呈现 תְּבוּאָתוֹ 的农业产出含义。
