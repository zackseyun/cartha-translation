id: LEV.19.8
reference: Leviticus 19:8
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/אֹֽכְלָי/ו֙ עֲוֺנ֣/וֹ יִשָּׂ֔א כִּֽי אֶת קֹ֥דֶשׁ יְהוָ֖ה חִלֵּ֑ל וְ/נִכְרְתָ֛ה הַ/נֶּ֥פֶשׁ הַ/הִ֖וא מֵ/עַמֶּֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/008.yaml
  text: Whoever eats it shall bear his iniquity[a], because he has profaned the holy thing of Yahweh[d][c][b], and that person shall be cut off from his people.
translation:
  language: zh_hans
  text: 吃这祭肉的人要担当自己的罪责[a]，因为他亵渎了耶和华的圣物[b]；那人必从自己的族人中被剪除[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“担当自己的罪孽”。这个希伯来语惯用语可指承担罪咎及其后果。
    reason: lexical_alternative
  - marker: b
    text: “耶和华的圣物”指归耶和华为圣之物；这里具体指祭肉。
    reason: cultural_note
  - marker: c
    text: “被剪除”是盟约刑罚的固定说法；本节没有说明这是指死亡、被逐出共同体，还是上帝直接施行审判。原文直译为“那生命必被剪除”，在法律用语中意为“那人”。
    reason: alternative_reading
lexical_decisions:
- source_word: וְאֹכְלָיו
  choice: 吃这祭肉的人
  rationale: 分词带代词后缀，泛指吃了前文所说祭肉的人。补出“祭肉”承接上下文，比单说“吃它的人”更符合现代汉语，同时没有改变所指。
- source_word: עֲוֺנוֹ יִשָּׂא
  choice: 要担当自己的罪责
  rationale: 该希伯来语惯用语兼有承担罪咎及其后果之意。“担当罪责”保留原文的法律与神学分量，又比直译“担当罪孽”更自然。
- source_word: כִּי
  choice: 因为
  rationale: 明确引出受罚的原因。
- source_word: קֹדֶשׁ יְהוָה
  choice: 耶和华的圣物
  rationale: 原文指归耶和华为圣之物，在本段具体为祭肉。“圣物”既贴近原文，也避免把本句未明说的类别进一步限定为“祭物”或“圣份”。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经中通行而庄重的神名译法。
- source_word: חִלֵּל
  choice: 亵渎了
  rationale: 该词的加强词干表示把圣物当作俗物、损害其神圣性；“亵渎”准确而凝练。
- source_word: וְנִכְרְתָה
  choice: 必……被剪除
  rationale: 保留盟约刑罚的固定表达，不擅自判定其具体方式是处死、逐出群体还是上帝直接施行审判。
- source_word: הַנֶּפֶשׁ הַהִוא
  choice: 那人
  rationale: נֶפֶשׁ 在此法律语境中指完整的个人，而非专指与身体相对的“灵魂”。
- source_word: מֵעַמֶּיהָ
  choice: 从自己的族人中
  rationale: 阴性后缀在语法上与 נֶפֶשׁ 呼应；语义上是指违法者所属的族群。“族人”较能保留 עַם 在盟约共同体中的群体含义。
theological_decisions:
- issue: “被剪除”这一刑罚公式的具体含义
  choice: 保留“必从自己的族人中被剪除”
  alternative: 处死；逐出共同体；由上帝直接除灭
  rationale: 本节没有说明刑罚的执行机制。保留原文公式，避免消解其法律和神学上的开放性。
- issue: “担当罪责”所涵盖的范围
  choice: 采用可兼指罪咎及其后果的表达
  alternative: 担当罪孽；承受罪的惩罚
  rationale: 原文惯用语不只陈述内在罪咎，也可能包含相应后果；译成“罪责”可保留这种张力，而不把含义缩窄为单纯受罚。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。“担当罪责”“亵渎”“圣物”“被剪除”保留律法文本的法律与礼仪色彩；句法按因果关系自然展开。所有脚注标记均置于相关词句之后。
