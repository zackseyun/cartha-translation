source:
  edition: WLC
  text: מֹ֧אזְנֵי צֶ֣דֶק אַבְנֵי צֶ֗דֶק אֵ֥יפַת צֶ֛דֶק וְ/הִ֥ין צֶ֖דֶק יִהְיֶ֣ה לָ/כֶ֑ם אֲנִי֙ יְהוָ֣ה אֱלֹֽהֵי/כֶ֔ם אֲשֶׁר הוֹצֵ֥אתִי אֶתְ/כֶ֖ם מֵ/אֶ֥רֶץ מִצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/036.yaml
  text: You shall have honest scales[a], honest weights, an honest ephah, and an honest hin. I am Yahweh your God[c][b], who brought you out of the land of Egypt.
translation:
  language: zh_hans
  text: 你们要有公道的天平[a]、公道的砝码、公道的伊法[b]和公道的欣[c]。我是耶和华，你们的神；我曾把你们从埃及地领出来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “公道”也可译作“公正”。原文在本节四次使用同一个词 צֶדֶק，常指“公义”或“公正”，这里用于交易的称量和度量。
    reason: lexical_alternative
  - marker: b
    text: “伊法”是古代的干量单位。
    reason: cultural_note
  - marker: c
    text: “欣”是古代的液量单位。
    reason: cultural_note
lexical_decisions:
- source_word: מֹאזְנֵי צֶדֶק
  choice: 公道的天平
  rationale: מֹאזְנַיִם指称重用的天平；צֶדֶק在商业度量语境中表示合乎公义、公平无欺。“公道的天平”既保留伦理含义，也符合现代汉语表达。
- source_word: אַבְנֵי צֶדֶק
  choice: 公道的砝码
  rationale: אַבְנֵי字面为“石头”，这里指交易中称重所用的石制砝码。译作“砝码”清楚传达其实际功能，并与四次出现的צֶדֶק保持一致。
- source_word: אֵיפַת צֶדֶק
  choice: 公道的伊法
  rationale: אֵיפָה是古代干量单位。保留音译“伊法”，避免以不精确的现代单位替代，并用脚注说明。
- source_word: וְהִין צֶדֶק
  choice: 公道的欣
  rationale: הִין是古代液量单位。保留音译“欣”，以保存原文的历史文化特征，并用脚注说明。
- source_word: יִהְיֶה לָכֶם
  choice: 你们要用
  rationale: 原文直译为“你们要有”。结合天平、砝码和量器的商业语境，“要用”自然表达律法所要求的持有与使用，且不削弱命令语气。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的专名“耶和华”翻译四字神名，而不以称号替代。
- source_word: אֱלֹהֵיכֶם
  choice: 你们的神
  rationale: 在“耶和华你们的神”这一盟约公式中，אֱלֹהִים按单数意义理解，译为“神”。
- source_word: הוֹצֵאתִי אֶתְכֶם מֵאֶרֶץ מִצְרַיִם
  choice: 曾把你们从埃及地领出来
  rationale: 自然传达出埃及公式，并保留这条命令以耶和华救赎以色列的行动为依据的结构。
theological_decisions:
- issue: 商业律法语境中重复四次的צֶדֶק如何翻译
  choice: 公道
  alternative: 诚实；公正；准确
  rationale: צֶדֶק通常涵盖“公义、公正”，在本节修饰天平、砝码和容量单位，强调交易符合公义而不欺诈。“公道”可自然用于器具和度量，同时保留比单纯技术性“准确”更强的伦理意味。四处采用同一译法，以呈现原文的重复和节奏。
- issue: 古代容量单位是否换算为现代单位
  choice: 保留“伊法”和“欣”的音译
  alternative: 译为“干量器”和“液量器”，或换算成现代容量
  rationale: 原文指特定的古代单位；现代换算存在历史上的不确定性，也会模糊源文化。音译配合简短脚注兼顾准确与可读性。
- issue: 四字神名的译法
  choice: 耶和华
  alternative: 上主；主
  rationale: 原文使用神的专名יְהוָה。采用中文传统且广为人知的音译“耶和华”，保留专名性质，不以称号代替。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“你们要用”表达律法命令；四次重复“公道的”再现希伯来文的修辞节奏。古代单位保留音译并以脚注说明。
