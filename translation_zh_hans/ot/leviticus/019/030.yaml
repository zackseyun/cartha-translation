  text: אֶת שַׁבְּתֹתַ֣/י תִּשְׁמֹ֔רוּ וּ/מִקְדָּשִׁ֖/י תִּירָ֑אוּ אֲנִ֖י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/030.yaml
  text: You shall keep my Sabbaths and revere my sanctuary[a]; I am Yahweh.
translation:
  language: zh_hans
  text: 你们要守我的安息日，也要敬畏我的圣所[a]。我是雅威。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“惧怕我的圣所。”希伯来语动词既可表示“惧怕”，也可表示“敬畏”；这里指以神圣而庄重的态度对待雅威的圣所。
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׁבְּתֹתַי
  choice: 我的安息日
  rationale: 希伯来语为复数，指属于雅威、由他规定的一切安息日条例。现代汉语通常以“安息日”表达这类复数概念，不必机械加“各个”。
- source_word: תִּשְׁמֹרוּ
  choice: 要守
  rationale: שׁמר在律法语境中有遵守、谨守之意；“守安息日”是自然、简洁且为读者熟悉的现代汉语搭配。
- source_word: מִקְדָּשִׁי
  choice: 我的圣所
  rationale: מִקְדָּשׁ指分别为圣的场所；“圣所”准确保留神圣空间的含义，又不把所指限缩为会幕或圣殿。
- source_word: תִּירָאוּ
  choice: 敬畏
  rationale: ירא既可表示害怕，也可表示敬畏。此处以圣所为对象，强调对神圣之地怀有庄重敬意；“敬畏”同时保留原词中畏惧与尊崇的张力。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以“雅威”音译四字神名，保留经文中上帝的专名，而不以称号替代。
- source_word: אֲנִי יְהוָה
  choice: 我是雅威
  rationale: 完整保留反复出现的盟约自我宣告，现代汉语自然明确。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；译作“雅威”可清楚保留其作为以色列之神专名的性质，不以称号代替。
- issue: תִּירָאוּ 用于圣所时的语义力度
  choice: 敬畏我的圣所
  alternative: 惧怕我的圣所；尊崇我的圣所
  rationale: “敬畏”比单纯的“惧怕”更符合敬拜语境，又比“尊崇”更能保存希伯来语 ירא 所含的畏惧意味，避免消解原文的语义张力。
translation_notes:
  register: 采用现代、庄重而简明的律法语体。“你们要……也要……”清楚呈现两个并列命令；“安息日”“圣所”“敬畏”均为普通现代读者能够理解的既有宗教词汇。
