base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/011.yaml
  text: You shall not steal[a], and you shall not deal falsely, and you shall not lie to one another.
translation:
  language: zh_hans
  text: 不可偷窃，不可欺骗，也不可彼此〔a〕说谎。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תִּגְנֹבוּ
  choice: 不可偷窃
  rationale: Qal未完成式第二人称阳性复数在לֹא之后构成禁令；“偷窃”直接、准确地表达גנב的通常含义。
- source_word: תְכַחֲשׁוּ
  choice: 不可欺骗
  rationale: כחש的Piel词形可表示欺骗、虚假否认或以虚假相待。此处与偷窃、说谎并列，“欺骗”自然地涵盖较广的虚假待人行为，同时不把含义局限为口头否认。
- source_word: תְשַׁקְּרוּ
  choice: 不可……说谎
  rationale: שקר的Piel词形通常表示说谎或行事虚假；结合其后的人际对象，用“说谎”最符合现代汉语，也保留了与前一动词的区别。
- source_word: אִישׁ בַּעֲמִיתוֹ
  choice: 彼此
  rationale: 字面结构近于“各人对同伴”，在本句中具有分配和相互的意义。“彼此”以自然简洁的汉语传达这种人际关系，不把语法上的阳性形式误解为只针对男性。
- source_word: עֲמִית
  choice: 彼此（在整体短语中）
  rationale: עֲמִית指同伴、同胞或群体中的邻舍；与אִישׁ构成的整体表达在此宜译为相互性的“彼此”。
theological_decisions:
- issue: אִישׁ ... עֲמִיתוֹ的阳性分配式表达
  choice: 在正文中译为不限定性别的“彼此”
  alternative: 各人不可向自己的同伴说谎；人不可向同伴说谎
  rationale: 希伯来语的阳性单数在这里具有代表和分配作用，并非把禁令限于男性。“彼此”准确传达其普遍且相互的人际指向。
translation_notes:
  register: 采用现代、庄重而易懂的法律禁令语体。三个并列的לֹא禁令统一用“不可”，保留原文简洁有力的排比；用“也”自然连接末项，不增加原文没有的解释。
