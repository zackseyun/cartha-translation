id: LEV.19.20
reference: Leviticus 19:20
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ֠/אִישׁ כִּֽי יִשְׁכַּ֨ב אֶת אִשָּׁ֜ה שִׁכְבַת זֶ֗רַע וְ/הִ֤וא שִׁפְחָה֙ נֶחֱרֶ֣פֶת לְ/אִ֔ישׁ וְ/הָפְדֵּה֙ לֹ֣א נִפְדָּ֔תָה א֥וֹ חֻפְשָׁ֖ה לֹ֣א נִתַּן לָ֑/הּ בִּקֹּ֧רֶת תִּהְיֶ֛ה לֹ֥א יוּמְת֖וּ כִּי לֹ֥א חֻפָּֽשָׁה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/020.yaml
  text: If a man lies with a woman and has an emission of semen[a], and she is a slave woman designated for a man, but she has not been redeemed or given her freedom, there shall be an inquiry; they shall not be put to death[b], because she had not been freed.
translation:
  language: zh_hans
  text: 若某男子与一个女人交合，泄精，而那女人是被指定给某个男人的女奴[a]，但她尚未被赎回，也没有获得自由，就应当进行审查[b]。他们不可被处死，因为她还没有获得自由。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “被指定给某个男人”也可译作“许配给某个男人”或“许诺给某个男人”。希伯来语很可能表示这名女奴已被安排或承诺给某个男人，但她尚不具备自由女子在婚姻或婚约中的完整法律地位。
    reason: lexical_alternative
  - marker: b
    text: 译作“审查”的希伯来语词十分罕见，含义不确定；也可能指“惩罚”或“赔偿”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ
  choice: 一个男人
  rationale: 法律条文中的阳性单数指一名男性，按其通常意义直译。
- source_word: יִשְׁכַּב אֶת אִשָּׁה שִׁכְבַת זֶרַע
  choice: 与一个女人同寝交合，以致泄精
  rationale: 原文不仅指性交，也明确包含精液排出的含义；译文保留这一法律语境中的具体性，同时使用现代汉语可理解的表达。
- source_word: שִׁפְחָה
  choice: 女奴
  rationale: 本条律法以女子尚未获得自由的奴隶身份为关键，因此不以较弱的“婢女”或“女仆”淡化其受奴役的法律地位。
- source_word: נֶחֱרֶפֶת לְאִישׁ
  choice: 被指定给一个男人
  rationale: 该词罕见且含义有争议，可能指许配、许诺或指定给某人；“被指定给”保留关系上的安排，又不把她等同于具有完整自由身份的正式未婚妻。
- source_word: וְהָפְדֵּה לֹא נִפְדָּתָה
  choice: 还没有被赎
  rationale: 原文以同源词强化尚未赎回这一事实；汉语用“还没有被赎”自然表达其法律经济含义。
- source_word: חֻפְשָׁה לֹא נִתַּן לָהּ
  choice: 也没有获得自由
  rationale: 原文直指自由尚未赐给她，即她尚未脱离奴隶身份；此译法自然且清楚。
- source_word: בִּקֹּרֶת
  choice: 进行审查
  rationale: 这是罕见且释义不确定的名词。“审查”保留可能的司法调查含义，不在正文中武断确定某种具体刑罚；其他可能含义收入脚注。
- source_word: לֹא יוּמְתוּ
  choice: 他们不可被处死
  rationale: 复数形式涉及双方；被动形式在司法语境中表示不得将他们处死。
- source_word: כִּי לֹא חֻפָּשָׁה
  choice: 因为她还没有获得自由
  rationale: 明确保留原文所给理由：女子当时仍未脱离奴隶身份。
theological_decisions:
- issue: נֶחֱרֶפֶת לְאִישׁ 所表示的关系和法律地位
  choice: 被指定给一个男人
  alternative: 许配给一个男人；许诺给一个男人
  rationale: 经文把此案与自由女子的情形区分开，因为她尚未被赎或释放。“被指定给”既表达她与某男子已有约定，也不预先断定这等同于自由女子的正式婚约。
- issue: בִּקֹּרֶת 的司法含义
  choice: 应当进行审查
  alternative: 应当受罚；应当赔偿
  rationale: 该词罕见，具体所指存在真实的词义不确定性。正文采用较少限定的司法性表达，并在脚注中保留其他主要解释，避免强行确立某种刑罚理论。
- issue: לֹא יוּמְתוּ 的复数所指
  choice: 他们不可被处死
  alternative: 不可处死二人
  rationale: 原文动词为复数，最自然地回指发生性关系的男女双方；译文保留这一点，但不添加原文没有说明的具体责任分配。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。以“女奴”明确呈现受奴役身份；以“同寝交合，以致泄精”保留原文的性行为及精液排出细节；对两个罕见而有争议的词语采用不作过度判定的正文译法，并用脚注呈现主要备选理解。
