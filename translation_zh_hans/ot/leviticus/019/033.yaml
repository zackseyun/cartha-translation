  text: וְ/כִֽי יָג֧וּר אִתְּ/ךָ֛ גֵּ֖ר בְּ/אַרְצְ/כֶ֑ם לֹ֥א תוֹנ֖וּ אֹתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/033.yaml
  text: When a foreigner resides with you in your land[b][a], you shall not mistreat him.
translation:
  language: zh_hans
  text: 若有寄居者[b]与你同住，在你们的土地上，你们不可亏待他[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“不可欺压他”“不可虐待他”。
    reason: lexical_alternative
  - marker: b
    text: “寄居者”译自希伯来语 ger，指住在以色列人中间的非本地居民，并非仅仅短暂停留的旅客。
    reason: cultural_note
lexical_decisions:
- source_word: וְכִי
  choice: 若有
  rationale: 引出律法中的情境或条件；“若有”简洁自然，也不把条件意味改写为纯粹时间关系。
- source_word: יָגוּר
  choice: 同住
  rationale: 该动词指非本地人在当地居住；与“寄居者”配合，表达持续居住而非短暂停留。
- source_word: אִתְּךָ
  choice: 与你们
  rationale: 希伯来文此处为第二人称阳性单数，但同句后半使用复数，整体对象是以色列群体；现代汉语采用复数使指称自然清楚。
- source_word: גֵּר
  choice: 寄居者
  rationale: 指居住在以色列人中间、并非本地族群成员的人；“寄居者”兼顾外来身份与当地居住的含义，避免把他误解为仅仅路过的陌生人。
- source_word: בְּאַרְצְכֶם
  choice: 在你们的土地上
  rationale: 保留 אֶרֶץ 的“土地”意象及复数领属形式，符合本段对群体的称呼。
- source_word: לֹא תוֹנוּ
  choice: 不可欺压
  rationale: ינה 的使役形可指亏负、欺压或不当对待；“欺压”自然庄重，并能表达利用弱势身份加以侵害的意味，同时以脚注保留较宽泛的译法。
- source_word: אֹתוֹ
  choice: 他
  rationale: 原文为阳性单数宾语代词，回指阳性单数名词 גֵּר，故保留为“他”。
theological_decisions:
- issue: 圣洁条例中 גֵּר 的身份称谓
  choice: 寄居者
  alternative: 外来人；侨居者；外族居民
  rationale: 该词所指并非普通陌生人，而是在以色列土地上长期居住、处于当地社会与律法范围内的非本地人。“寄居者”既保留其外来身份，也不加入现代国籍或移民制度的技术含义。
- issue: 禁止行为 לֹא תוֹנוּ 的范围
  choice: 不可欺压
  alternative: 不可亏负；不可虐待；不可欺负
  rationale: 原词语义可涵盖不公对待、压迫或亏负。正文采用“欺压”突出权势不对等下的侵害，但不把具体侵害方式限定为经济剥削或身体虐待；脚注保留其较广语义。
translation_notes:
  register: 采用现代、庄重而易懂的律法文体。“若有……你们不可……”清楚呈现条件句与禁令；正文保留“土地”的经文语感，并以“寄居者”表达古代以色列社会中的特定居民身份。
