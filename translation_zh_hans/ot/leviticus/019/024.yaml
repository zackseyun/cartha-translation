  text: וּ/בַ/שָּׁנָה֙ הָ/רְבִיעִ֔ת יִהְיֶ֖ה כָּל פִּרְי֑/וֹ קֹ֥דֶשׁ הִלּוּלִ֖ים לַ/יהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/024.yaml
  text: But in the fourth year all its fruit shall be holy[a], for giving praise to Yahweh.
translation:
  language: zh_hans
  text: 但到了第四年，所有的果子都要归耶和华为圣[a]，作赞美之用。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 较直译：“归耶和华为圣，作赞美之用”，或“圣洁的赞美，归给耶和华”。这里的希伯来语短语很少见；“赞美”一词也可含欢庆之意，可能强调以这些果子向耶和华欢庆和赞美。
    reason: 保留 קֹדֶשׁ הִלּוּלִים לַיהוָה 这一罕见短语的形式和语义歧义。
lexical_decisions:
- source_word: וּבַשָּׁנָה הָרְבִיעִת
  choice: 但到了第四年
  rationale: ו 在上下文中与前三年形成转折；בַשָּׁנָה 表示时间，现代汉语以“到了”自然表达进入第四年的时点。
- source_word: יִהְיֶה כָּל פִּרְיוֹ קֹדֶשׁ
  choice: 树上所有的果子都要成为圣物
  rationale: 补出语境中的“树上”以明确代词所指；קֹדֶשׁ 在此为名词性表语，表示果子被分别为圣，译作“圣物”比单说“圣洁”更符合祭仪语境。
- source_word: הִלּוּלִים
  choice: 用来赞美
  rationale: 该罕见复数名词与赞美、欢庆有关；避免译成原文未明确使用的“祭物”，同时在正文中自然表达其用途。
- source_word: לַיהוָה
  choice: 耶和华
  rationale: ל 表示对象或归属；יהוה 为神的专名，按现代中文圣经传统音译为“耶和华”。
theological_decisions:
- issue: 罕见短语 קֹדֶשׁ הִלּוּלִים לַיהוָה 的关系
  choice: 成为圣物，用来赞美耶和华
  alternative: 成为圣物，是献给耶和华的赞美；成为圣物，为要赞美耶和华
  rationale: 原文可理解为果子被分别为圣，并用于向耶和华献上赞美或欢庆。正文采用自然的用途表达，脚注保留其罕见结构及其他可能理解，不把它具体化为原文未明说的祭物。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“圣物”保留律法与祭仪语域；“用来赞美”便于普通读者理解，脚注则交代较直译的表达和原文歧义。
