  text: כְּ/אֶזְרָ֣ח מִ/כֶּם֩ יִהְיֶ֨ה לָ/כֶ֜ם הַ/גֵּ֣ר הַ/גָּ֣ר אִתְּ/כֶ֗ם וְ/אָהַבְתָּ֥ ל/וֹ֙ כָּמ֔וֹ/ךָ כִּֽי גֵרִ֥ים הֱיִיתֶ֖ם בְּ/אֶ֣רֶץ מִצְרָ֑יִם אֲנִ֖י יְהוָ֥ה אֱלֹהֵי/כֶֽם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/034.yaml
  text: The sojourner who sojourns with you shall be to you like a native among you[a], and you shall love him as yourself, for you were sojourners in the land of Egypt. I am Yahweh your God.
translation:
  language: zh_hans
  text: 那寄居在你们中间的寄居者[a]，你们要视他如同你们中间的本地人；你要爱他如同爱自己，因为你们在埃及地曾作寄居者。我是雅威——你们的上帝。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “寄居者”也可译作“外来人”或“陌生人”，指居住在以色列人中间的非本地人；“本地人”也可译作“本地出生的人”。
    reason: 说明 גֵּר 的社会法律语境及 אֶזְרָח 的主要译法，避免采用带现代国籍制度色彩的术语。
lexical_decisions:
- source_word: כְּאֶזְרָח מִכֶּם
  choice: 如同本地人
  rationale: אֶזְרָח 指本地居民或本地出生的群体成员；“如同本地人”保留介词 כְּ 的比较意味，也符合现代汉语表达。
- source_word: הַגֵּר הַגָּר אִתְּכֶם
  choice: 与你们同住的寄居者
  rationale: גֵּר 指住在以色列人中间的非本地人，并非仅仅是过路客；“寄居者”保留其长期居住而身份非本地的法律社会含义。“同住”自然传达分词 גָּר，虽不能完全复制希伯来语的同根复现。
- source_word: וְאָהַבְתָּ לוֹ כָּמוֹךָ
  choice: 你要爱他如同爱自己
  rationale: “你要”清楚表达律法命令的效力；补出第二个“爱”使 כָּמוֹךָ 在现代汉语中自然明确，同时保持与利未记19:18的呼应。
- source_word: כִּי גֵרִים הֱיִיתֶם
  choice: 因为你们……也曾是寄居者
  rationale: 再次使用“寄居者”，保留与前半句 גֵּר 的词汇联系；“曾”表达过去状态，“也”凸显以色列人与现今寄居者处境的类比。
- source_word: בְּאֶרֶץ מִצְרָיִם
  choice: 在埃及地
  rationale: 保留原文“埃及之地”的完整表达及其救赎历史色彩。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者最熟悉的传统音译呈现四字神名，区别于作为称号的“主”。
- source_word: אֱלֹהֵיכֶם
  choice: 你们的上帝
  rationale: 直接呈现复数第二人称后缀，保留“我是耶和华你们的上帝”这一立约公式。
theological_decisions:
- issue: 法律伦理语境中 גֵּר 的译法
  choice: 寄居者
  alternative: 外来人、外侨、陌生人
  rationale: 本节所指是居住在以色列群体中的非本地人。“寄居者”既不把他误解为短暂停留的访客，也不套用现代国籍与移民制度；其他可能译法列入脚注。
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用神的专名而非“主”这一称号。正文采用中文传统且广为人知的“耶和华”，同时不把该词降格为普通称谓。
- issue: 单数命令与复数群体的张力
  choice: 保留“你要”与“你们”的转换
  alternative: 全译为复数“你们要”
  rationale: 原文在爱的命令中使用第二人称阳性单数，随后以复数回顾以色列人在埃及的经历。保留转换，可呈现律法既向群体、也向其中每个人发出要求的原文形式，而不替原文消除这种变化。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“与你们同住”避免生硬复制希伯来语“寄居者之寄居”的同根结构；分号呈现身份待遇与爱人命令之间的推进。保留单数“你要”与复数“你们”的人称数变化。
