  terminology: “寄居者”适合本节的 גֵּר，并应在后句重复以保留词汇联系。“本地人”可对应 אֶזְרָח。脚注不宜使用带现代国籍法律制度色彩的“外侨”；可用“外来人”“寄居的外族人”等较中性的说明。神名改为“雅威”，以对应 POB 的 Yahweh 决定。
