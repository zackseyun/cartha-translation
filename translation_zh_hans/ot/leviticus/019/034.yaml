revisions:
- from: 与你们同住的寄居者，在你们中间要如同本地人[a]；你要爱他如同爱自己，因为你们在埃及地也曾是寄居者。我是耶和华你们的上帝。
  to: 那寄居在你们中间的寄居者[a]，你们要视他如同你们中间的本地人；你要爱他如同爱自己，因为你们在埃及地曾作寄居者。我是雅威——你们的上帝。
  rationale: 修订仅调整神名以符合英语 POB 的 Yahweh 审核决定，并改善脚注术语和锚点。正文以“寄居在……的寄居者”尽可能保留 גֵּר 与分词 גָּר 的同根联系；“视他如同”自然表达“要把他当作……看待”的规范性含义，且保留“你们／你”的原文数的转换。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T04:51:02Z'
