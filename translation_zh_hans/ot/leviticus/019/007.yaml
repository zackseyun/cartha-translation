  text: וְ/אִ֛ם הֵאָכֹ֥ל יֵאָכֵ֖ל בַּ/יּ֣וֹם הַ/שְּׁלִישִׁ֑י פִּגּ֥וּל ה֖וּא לֹ֥א יֵרָצֶֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/007.yaml
  text: But if it is eaten at all on the third day[a], it is a defiled thing; it will not be accepted.
translation:
  language: zh_hans
  text: 但若有人在第三天仍吃这祭肉，它就是可憎之物[a]，必不蒙悦纳。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“令人厌弃之物”或“不洁之物”。这里的希伯来词指祭肉因超过规定期限而成为不合献祭礼仪、不能蒙悦纳之物。
    reason: 说明פִּגּוּל在献祭语境中的特殊含义，并保留可用的词义选择。
lexical_decisions:
- source_word: וְאִם
  choice: 但如果
  rationale: 承接前文所规定的食用期限，引出与规定相反的条件；“但如果”自然地表达转折和条件。
- source_word: הֵאָכֹל יֵאָכֵל
  choice: 还有人吃
  rationale: 原文以不定式绝对形配合未完成式，强化“吃”的动作。“到了第三天还有人吃”在现代汉语中既体现强调和警告意味，也避免生硬直译。
- source_word: בַּיּוֹם הַשְּׁלִישִׁי
  choice: 到了第三天
  rationale: 准确表达时间界限，并与“还有人吃”搭配，清楚显示已经超过前文许可的期限。
- source_word: פִּגּוּל
  choice: 污秽之物
  rationale: 此词在献祭语境中指因违反礼仪规定而变得不合蒙悦纳资格的祭物。“污秽之物”保留其负面及礼仪性含义，又不将其扩大为其他希伯来词所表达的“可憎之物”。脚注补充其语义范围。
- source_word: הוּא
  choice: 它就是
  rationale: 保留原文述谓性代词的强调作用，明确指出该祭肉此时的性质。
- source_word: לֹא יֵרָצֶה
  choice: 必不蒙悦纳
  rationale: רצה的尼法勒式在献祭语境中表示祭物不被神接纳。“蒙悦纳”是自然、庄重且具有祭祀语境色彩的现代汉语表达；“必不”也与全句的强调语气相称。
theological_decisions:
- issue: 第三天食用祭肉所造成的礼仪地位
  choice: 译为“污秽之物”，并以“必不蒙悦纳”表明其献祭礼仪上的不可接受性
  alternative: 理解为单纯腐坏的肉，或译成具有更广泛严重禁忌含义的“可憎之物”
  rationale: 上下文讨论平安祭祭肉的合法食用期限，末句又明确涉及是否蒙悦纳。因此，本节首先宣告的是祭肉在礼仪和献祭上的不合格，而不是单纯描述物理腐败，也不应扩展成原文未明说的普遍道德或形而上类别。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“这祭肉”根据紧接的献祭语境补明隐含所指；“到了第三天还有人吃”以自然汉语传达原文加强式动词的警告语气。脚注标记紧随其实际解释的“污秽之物”，而非时间短语。
