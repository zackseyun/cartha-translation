revisions:
- from: 你们宰献平安祭给雅威时，要为使自己蒙悦纳而献。[a]
  to: 你们向雅威献平安祭时，要献得蒙悦纳。[a]
  rationale: 修订以“向雅威献平安祭”改善汉语搭配，并以“要献得蒙悦纳”保留原文在献祭者与祭物之间可能存在的指向张力，不将其限定为单一的神学或语法解释。脚注提供较直译的替代说法并说明歧义。
