review_pass:
  verdict: revise
  source_fidelity: 原译准确传达了献平安祭给雅威及为蒙悦纳而献的基本意思。不过，“为使自己蒙悦纳”将לִרְצֹנְכֶם较明确地限定为献祭者蒙悦纳；该短语在祭祀语境中也可表达祭物获悦纳。宜以汉语中可保留这一关联的措辞处理。
  naturalness: “你们宰献平安祭给雅威时”中“宰献……给”搭配略显生硬；“要为使自己蒙悦纳而献”末尾的“而献”也不够自然。改为“向雅威献……”“要献得蒙悦纳”更合现代标准汉语的律法文本语体。
  terminology: “平安祭”是合适且通行的祭祀术语；“雅威”准确对应神名יהוה。
  issues:
  - severity: medium
    issue: 主译过度限定“蒙悦纳”的指向
    rationale: לִרְצֹנְכֶם直译为“为你们的悦纳／接纳”。在献祭法规中可关联献祭者的蒙悦纳，也可关联祭物的可蒙悦纳性。原译“为使自己蒙悦纳”只保留前者，而脚注承认另一可能，宜在正文中避免不必要地消解此张力。
  - severity: low
    issue: 献祭动词搭配不够自然
    rationale: “宰献平安祭给雅威”虽可理解，但现代汉语较自然的表达是“向雅威献平安祭”。“献得蒙悦纳”亦能保留重复的献祭动词所强调的献祭方式。
  revised_text: 你们向雅威献平安祭时，要献得蒙悦纳。[a]
  revised_footnotes:
