  text: וְ/כִ֧י תִזְבְּח֛וּ זֶ֥בַח שְׁלָמִ֖ים לַ/יהוָ֑ה לִֽ/רְצֹנְ/כֶ֖ם תִּזְבָּחֻֽ/הוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/005.yaml
  text: And when you sacrifice a peace offering to Yahweh[a], you shall sacrifice it so that you may be accepted.
translation:
  language: zh_hans
  text: 你们向雅威献平安祭时，要献得蒙悦纳。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“要为你们的悦纳而献。”这里可指献祭者蒙悦纳，也可指所献的祭物蒙悦纳。
    reason: 保留לִרְצֹנְכֶם在祭祀语境中可关联献祭者或祭物的表达张力。
lexical_decisions:
- source_word: וְכִי
  choice: ……时
  rationale: כִּי在这里引出律法中的情形，兼有条件和时间意味；汉语用“……时”最自然，也符合上下文的训令语气。
- source_word: תִזְבְּחוּ / תִּזְבָּחֻהוּ
  choice: 宰献／献
  rationale: זבח指为献祭而宰杀并献上。首次译作“宰献”以体现祭牲被宰杀的含义，后句用“献”避免汉语生硬重复，同时保留命令的重点。
- source_word: זֶבַח שְׁלָמִים
  choice: 平安祭
  rationale: 这是以色列献祭制度中的固定祭类；“平安祭”是简明、通行且较少加入解释的译法。
- source_word: לַיהוָה
  choice: 给雅威
  rationale: 介词ל表示祭物献给、归给雅威；“给雅威”在现代汉语中自然地表达献祭的对象。神名יהוה按其专名译作“雅威”。
- source_word: לִרְצֹנְכֶם
  choice: 为使自己蒙悦纳
  rationale: רָצוֹן在祭祀法规中通常表示在神面前蒙悦纳。这里的第二人称复数后缀直指献祭者，汉语用反身代词“自己”自然承接“你们”，同时保留目的意味。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；译作“雅威”保留其作为圣约之神专名的性质，不以称号代替。
- issue: לִרְצֹנְכֶם所指的悦纳
  choice: 为使献祭者蒙悦纳
  alternative: 按你们的意愿；使祭物蒙悦纳
  rationale: 祭祀语境支持“蒙悦纳”的含义，而非“随你们喜欢”。后缀“你们的”使献祭者蒙悦纳成为主译，不过这一简短结构也可理解为祭物被悦纳，因此在脚注说明。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“宰献”保留祭牲宰杀的礼仪背景，“平安祭”采用通行祭名；句式简洁，适合律法文本。
