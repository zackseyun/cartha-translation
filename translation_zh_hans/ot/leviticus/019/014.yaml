id: LEV.19.14
reference: Leviticus 19:14
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: לֹא תְקַלֵּ֣ל חֵרֵ֔שׁ וְ/לִ/פְנֵ֣י עִוֵּ֔ר לֹ֥א תִתֵּ֖ן מִכְשֹׁ֑ל וְ/יָרֵ֥אתָ מֵּ/אֱלֹהֶ֖י/ךָ אֲנִ֥י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/014.yaml
  text: 'You shall not curse a deaf man[a], and before a blind man you shall not put a stumbling block; but you shall fear your God: I am Yahweh.'
translation:
  language: zh_hans
  text: 不可咒骂聋人[a]，也不可在盲人面前放置绊脚物；却要敬畏你的上帝。我是雅威。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “聋人”和下文的“盲人”，希伯来文均用阳性单数形式，作为律法中的代表性个案。
    reason: lexical_alternative
lexical_decisions:
- source_word: תְקַלֵּל
  choice: 咒骂
  rationale: 该词在此既可指诅咒，也含辱骂、轻蔑之意；“咒骂”简洁自然，并保留言语伤害的力度。
- source_word: חֵרֵשׁ
  choice: 聋人
  rationale: 希伯来文为阳性单数，用作律法中的代表性个案；现代汉语“聋人”自然、尊重，也无需强加原文未明说的性别。
- source_word: לִפְנֵי
  choice: 在……面前
  rationale: 保留原文明确的空间含义，与放置绊脚物的具体图景相符。
- source_word: עִוֵּר
  choice: 盲人
  rationale: 希伯来文为阳性单数的代表性法律用例；“盲人”是现代汉语自然、尊重的对应表达。
- source_word: תִתֵּן
  choice: 放置
  rationale: נתן字面为“给”，但与“绊脚物”搭配时，汉语用“放置”更准确自然。
- source_word: מִכְשֹׁל
  choice: 绊脚物
  rationale: 指使人跌倒之物。“绊脚物”保留具体图景，也不把本节过早抽象化为一般性的“障碍”。
- source_word: וְיָרֵאתָ
  choice: 却要敬畏
  rationale: 连接词וְ本可译作“并且”，但此处从暗中伤害弱势者转向对上帝的敬畏，带有伦理上的对照意味；“却要”自然呈现这一语篇关系。
- source_word: מֵאֱלֹהֶיךָ
  choice: 你的上帝
  rationale: 介词מִן与“敬畏”连用时标示敬畏的对象，汉语自然表达为“敬畏你的上帝”。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以常见的现代汉语音译呈现四字神名，区别于作为称号的“主”。
theological_decisions:
- issue: 律法个案中的阳性单数形式
  choice: 正文译为“聋人”和“盲人”，脚注说明原文形式
  alternative: 聋的男人；瞎眼的男人
  rationale: 原文的阳性单数在律法中可作为代表性个案。汉语名词通常不标语法性别，因此“聋人”“盲人”既忠实传达所指，也避免凭形式加入生硬的男性限定；脚注保留原文形态信息与代表性功能。
- issue: 末尾动机句与前文的关系
  choice: 译作“却要敬畏你的上帝”
  alternative: 并要敬畏你的上帝
  rationale: 原文连接词容许较中性的“并”，但语境将人难以察觉的欺凌与对上帝的敬畏相对照。“却要”呈现这种伦理张力，而不增添具体惩罚或动机。
- issue: מִכְשֹׁל的具体与引申含义
  choice: 保留具体的“绊脚物”
  alternative: 障碍；使人跌倒的东西
  rationale: 本节首先形成针对盲人的具体禁令，同时该词可能具有更广的伦理共鸣。正文保留具体图景，不将其限定为比喻，也不排除引申理解。
translation_notes:
  register: 采用现代、庄重而易懂的律法语体。“不可……也不可……；却要……”保持原文命令的节奏。“绊脚物”比“绊脚石”更准确，因为原文并未限定物体材质；“雅威”用于呈现神名。
