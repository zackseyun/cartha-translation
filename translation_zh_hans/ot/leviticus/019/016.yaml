  text: לֹא תֵלֵ֤ךְ רָכִיל֙ בְּ/עַמֶּ֔י/ךָ לֹ֥א תַעֲמֹ֖ד עַל דַּ֣ם רֵעֶ֑/ךָ אֲנִ֖י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/016.yaml
  text: You shall not go about as a slanderer among your people[a]. You shall not stand against the blood of your neighbor. I am Yahweh.
translation:
  language: zh_hans
  text: 不可在你的同胞中四处搬弄是非。不可危及你邻舍的性命。[a]我是雅威。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“不可在你邻舍流血时袖手旁观。”原文直译：“不可站在你邻舍的血上。”这句话也可理解为不可危及邻舍的生命。
    reason: 原文“不可站在你邻舍的血上”简练而有歧义；保留常见的禁止袖手旁观的理解，同时说明正文所采用的较宽泛理解。
lexical_decisions:
- source_word: תֵלֵךְ רָכִיל
  choice: 四处搬弄是非
  rationale: הלך与רָכִיל构成习语，描写人在群体中往来传播有害的传言。“四处”保留行动意象，“搬弄是非”在现代汉语中自然，并传达这种行为造成纷争、损害他人的严重性。
- source_word: בְּעַמֶּיךָ
  choice: 在你的同胞中
  rationale: ב表示活动所在的群体范围；עַם在本条群体伦理语境中指本族、本群体的人。“同胞”比单纯的“人民”更能表达彼此所属的关系。
- source_word: לֹא תַעֲמֹד עַל דַּם רֵעֶךָ
  choice: 不可起来危害你邻舍的性命
  rationale: 该短语字面涉及“站立”“在／敌对”与“血”，在汉语中逐词直译会晦涩难解。“起来危害”保留עמד可能具有的采取立场或行动之意，“性命”表达דם在此处以血代指生命的用法；另一种常见的旁观不救之义收入脚注。
- source_word: רֵעֶךָ
  choice: 你邻舍
  rationale: רֵעַ指与自己共同生活、负有伦理责任的人。“邻舍”是庄重而通行的圣经用语，也不会把范围缩小为现代意义上仅指住在附近的人。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以“雅威”音译四字神名，表明这里是上帝的专名，而不是以“主”等称号代替。
theological_decisions:
- issue: לֹא תַעֲמֹד עַל דַּם רֵעֶךָ的解释
  choice: 正文理解为禁止采取危害邻舍性命的立场或行动。
  alternative: 不可在邻舍流血时袖手旁观，即不可见死不救。
  rationale: 希伯来语表达简短，介词עַל与עמד、דם连用时可容许敌对加害和袖手旁观两种理解。正文依句法可能性采用主动危害之义，同时用脚注保存广为接受的旁观不救之义，不把原文的张力悄然消除。
translation_notes:
  register: 采用现代、庄重而易懂的规范汉语。“四处搬弄是非”自然传达群体中传播有害言论的行为；第二句避免生硬逐词直译，同时以脚注保存原文的重要歧义。神名采用音译“雅威”。
