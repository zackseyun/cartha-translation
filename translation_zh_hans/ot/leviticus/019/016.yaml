  terminology: “同胞”“邻舍”“雅威”均可接受；“邻舍”与本段伦理、法律语境相称。“性命”恰当地表达“血”在此可能所指的生命，但脚注宜说明原文直译为“不可站在你邻舍的血上/旁”，以保留其语义张力。
