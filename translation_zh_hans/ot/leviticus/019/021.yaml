base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/021.yaml
  text: 'And he shall bring his guilt offering to Yahweh[a], to the entrance of the tent of meeting: a ram as a guilt offering.'
translation:
  language: zh_hans
  text: 他要把他的赎愆祭，就是一只作赎愆祭的公绵羊，带到会幕的门口，献给雅威[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “赎愆祭”也可译作“补偿祭”。希伯来语 אָשָׁם 既可指愆责，也可指为此作补偿而献的祭物。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵבִיא
  choice: 他要……带到
  rationale: 在律法语境中，此形式表达规定或义务；现代汉语用“要”自然传达这一法令语气。
- source_word: אֲשָׁמוֹ
  choice: 自己的赎愆祭牲
  rationale: אָשָׁם在此指为愆责作补偿而献的祭物；加入“祭牲”可清楚表明所带来的是下文所说的公绵羊，而非抽象的罪责。
- source_word: לַיהוָה
  choice: 献给雅威
  rationale: ל兼有朝向和奉献之意；“献给”符合献祭语境，并按源文直接保留神的名字。
- source_word: אֶל פֶּתַח אֹהֶל מוֹעֵד
  choice: 带到会幕门口
  rationale: 准确表达移动的目的地；“会幕”是现代中文中对אֹהֶל מוֹעֵד简洁而通行的称呼。
- source_word: אֵיל
  choice: 一只……公绵羊
  rationale: אֵיל特指成年雄性绵羊；“公绵羊”比单说“公羊”更明确。
- source_word: אָשָׁם
  choice: 作赎愆祭
  rationale: 末尾名词与“公绵羊”构成同位说明，指出这只羊的祭祀用途；“作”自然保留该关系。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 源文直接使用四字神名；“雅威”较贴近学界通常重构的读音，也避免以称号代替专名。
- issue: אָשָׁם兼有愆责与补偿性祭物的含义
  choice: 正文译作“赎愆祭”，脚注说明“补偿祭”这一含义
  alternative: 补偿祭
  rationale: “赎愆祭”保留其与罪责、过犯的联系，脚注则呈现该词也强调赔补或补偿，不把原词的语义张力单一化。
translation_notes:
  register: 采用现代、庄重而易懂的律法叙述语体。“他要”表达规范性要求；语序先交代地点和奉献对象，再用“就是”引出祭牲的同位说明，使中文自然且不损失源文信息。
