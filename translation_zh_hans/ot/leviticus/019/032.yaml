  text: מִ/פְּנֵ֤י שֵׂיבָה֙ תָּק֔וּם וְ/הָדַרְתָּ֖ פְּנֵ֣י זָקֵ֑ן וְ/יָרֵ֥אתָ מֵּ/אֱלֹהֶ֖י/ךָ אֲנִ֥י יְהוָֽה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/032.yaml
  text: You shall rise before gray hair[a], and you shall honor the face of an old man, and you shall fear your God[b]; I am Yahweh.
translation:
  language: zh_hans
  text: 在白发的人面前，你要起立[a]；要尊敬年长的男子[b]；要敬畏你的神；我是雅威。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文也可直译为“在白发面前”；“白发”是指年老的人的具体表达。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译为“尊敬年长男子的面”；这里“面”构成表示当面尊敬的表达。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִפְּנֵי שֵׂיבָה
  choice: 在白发的人面前
  rationale: מִפְּנֵי与קום连用，表示在某人面前起身；שֵׂיבָה本指“白发”，并可转指年老的人。译文保留“白发”的具体意象，同时补出“的人”，使现代汉语自然明白。
- source_word: תָּקוּם
  choice: 你要起立
  rationale: קום的未完成式在此表达命令，指以站起来表示敬意。“起立”准确、简洁，也符合现代汉语礼敬长者的语境。
- source_word: וְהָדַרְתָּ
  choice: 要尊敬
  rationale: ' הדר的Piel词形在此表示给予尊荣、礼敬；“尊敬”自然地表达伦理命令，又不把它强化为敬拜性的崇敬。'
- source_word: פְּנֵי זָקֵן
  choice: 老者
  rationale: 该短语字面为“老者的面”。现代汉语通常直接说“尊敬老者”；脚注保留字面表达。זָקֵן也可按语境理解为年长者或长老，此处不强行限定职分。
- source_word: וְיָרֵאתָ מֵאֱלֹהֶיךָ
  choice: 要敬畏你的神
  rationale: ירא以神为宾语时兼有畏惧、敬重与肃然顺服之意；“敬畏”是现代汉语中既自然又能保留这种神学张力的表达。第二人称单数所属关系译作“你的神”。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以音译呈现四字神名，而不以称号替代；“雅威”是现代简体中文中清楚而常见的译法。
theological_decisions:
- issue: זָקֵן的性别与指称范围
  choice: 老者
  alternative: 老年男子／长老
  rationale: 原文为阳性单数，但该词既可指年老的人，也可指长老。汉语“老者”保留单数类称和庄重语气，不擅自把它限定为男性身份或群体职分；脚注说明原文表达。
- issue: 对神的“惧怕”
  choice: 敬畏你的神
  alternative: 惧怕你的神／尊崇你的神
  rationale: “敬畏”同时容纳畏惧、尊崇和顺服，避免把ירא弱化为一般尊敬，也避免仅理解为惊恐。
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华／主
  rationale: 正文直接呈现专名，保留原文以色列之神的盟约名字，不用“主”这一称号替代。
translation_notes:
  register: 采用现代、庄重而易懂的命令句式。保留“白发”的希伯来具体意象，以“在……面前起立”表达礼敬动作；第二分句为避免生硬，正文使用自然汉语“尊敬老者”，字面形式置于脚注。三个命令以分号并列，末句简洁有力。
