  text: אַל תִּפְנ֤וּ אֶל הָ/אֹבֹת֙ וְ/אֶל הַ/יִּדְּעֹנִ֔ים אַל תְּבַקְשׁ֖וּ לְ/טָמְאָ֣ה בָ/הֶ֑ם אֲנִ֖י יְהוָ֥ה אֱלֹהֵי/כֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/031.yaml
  text: Do not turn to mediums or to spiritists; do not seek them out[a], to become unclean by them. I am Yahweh your God.
translation:
  language: zh_hans
  text: 不可转向招魂者或通灵者，也不可求问他们[a]，以致因他们沾染不洁。我是雅威你们的上帝。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “招魂者”也可译作“交鬼者”或“亡灵”；“通灵者”也可译作“有熟悉之灵者”（传统表达）或“巫师”。这两个希伯来词都与被禁止的求问灵或死者的做法有关，既可指从业者，也可能涉及他们所求问的灵。
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּפְנוּ
  choice: 转向
  rationale: פנה的基本义是“转向”。这里指人转而寻求这些受禁的对象；保留“转向”可避免把原文直接收窄为“求问”。
- source_word: הָאֹבֹת
  choice: 招魂者
  rationale: אוֹב在此类律法语境中与求问死者的灵或其从业者有关。上下文将其与יִדְּעֹנִים并列，并以“求问他们”承接，因此正文采用指人的“招魂者”；脚注保留“亡灵、交鬼者”等可能表达。
- source_word: הַיִּדְּעֹנִים
  choice: 通灵者
  rationale: יִדְּעֹנִי指借助灵界知识从事受禁求问的人。“通灵者”是现代汉语中较清楚且不过度传奇化的表达，也与“招魂者”有所区分。
- source_word: תְּבַקְשׁוּ
  choice: 求问他们
  rationale: בקש基本义为“寻求”。在本节有关招魂、通灵的语境中，“求问他们”自然表达主动寻找并向其探询，同时没有增添具体求问内容。
- source_word: לְטָמְאָה בָהֶם
  choice: 以致因他们而沾染不洁
  rationale: 不定式לְטָמְאָה可表达目的或结果，בָהֶם表示借着或因着他们。“以致”保留结果意味，“沾染不洁”既符合利未记语域，也不限定为纯礼仪性或纯道德性的污秽。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见音译呈现四字神名，保留其作为以色列之神专名的性质，而不以称号替代。
- source_word: אֱלֹהֵיכֶם
  choice: 你们的上帝
  rationale: 忠实保留第二人称复数的盟约关系表达；“上帝”是庄重而通行的现代汉语用词。
theological_decisions:
- issue: 本节“不洁”的性质
  choice: 译为“沾染不洁”，不限定其仅为礼仪性或仅为道德性
  alternative: 译为“在礼仪上不洁”或“受到道德玷污”
  rationale: טמא在利未记中可涉及礼仪与道德两个层面；本节没有明确要求只取其中之一，因此保留其神学广度。
- issue: 两个受禁称谓所指的是灵体还是从业者
  choice: 正文按上下文译作两类从业者，并以脚注说明词义也可涉及亡灵或附从的灵
  alternative: 正文直接译作“亡灵”和“熟悉的灵”
  rationale: “求问他们”以及两个复数名词的并列在本禁令中自然指向受禁的从业者，但אוֹב尤其可以指被求问的亡灵或相关灵体；脚注保存这一真实的词义歧义。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“招魂者、通灵者”避免现代“魔法师”等容易引起幻想文学联想的说法；“沾染不洁”保留利未记的礼仪—道德语域。脚注标记[a]已置于正文相关短语之后。
