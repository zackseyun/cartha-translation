  text: וְ/כִפֶּר֩ עָלָ֨י/ו הַ/כֹּהֵ֜ן בְּ/אֵ֤יל הָֽ/אָשָׁם֙ לִ/פְנֵ֣י יְהוָ֔ה עַל חַטָּאת֖/וֹ אֲשֶׁ֣ר חָטָ֑א וְ/נִסְלַ֣ח ל֔/וֹ מֵ/חַטָּאת֖/וֹ אֲשֶׁ֥ר חָטָֽא־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/022.yaml
  text: And the priest shall make atonement for him before Yahweh with the ram of the guilt offering for the sin that he committed[a], and he shall be forgiven for the sin that he committed.
translation:
  language: zh_hans
  text: 祭司要用赎愆祭[a]的公绵羊，在雅威面前为他所犯的罪替他赎罪；他所犯的罪就必蒙赦免。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“赔偿祭”。希伯来语אָשָׁם既可指罪责，也可突出这种祭所包含的赔偿、修复性质。
    reason: 保留祭名在罪责与补偿、修复之间的词义张力。
lexical_decisions:
- source_word: וְכִפֶּר עָלָיו
  choice: 替他赎罪
  rationale: כפר在祭司礼仪语境中指施行赎罪之礼；על表示受益者。“替他赎罪”既自然，也保留祭司代表当事人施行礼仪的含义。
- source_word: הַכֹּהֵן
  choice: 祭司
  rationale: 保留执行献祭礼仪者的身份；希伯来文的定指在本段语境中由汉语自然表达，无须机械加“那位”。
- source_word: בְּאֵיל הָאָשָׁם
  choice: 用赎愆祭的公绵羊
  rationale: ב表示工具或凭借，אֵיל明确指公绵羊；אָשָׁם在献祭律例中兼有罪责与补偿、修复的意味，正文采用较为通行的“赎愆祭”，并以脚注说明另一译法。
- source_word: לִפְנֵי יְהוָה
  choice: 在雅威面前
  rationale: 保留祭祀场景中的临在和方位表达，并将神的专名יהוה音译为“雅威”。
- source_word: עַל חַטָּאתוֹ אֲשֶׁר חָטָא
  choice: 为他所犯的罪
  rationale: 避免直译同源结构“为他所犯的罪行了罪”造成生硬，同时保留赎罪所针对的是当事人所犯之罪。
- source_word: וְנִסְלַח לוֹ
  choice: 他……就必蒙赦免
  rationale: 保留希伯来文被动式和未明说的施事者，不擅自补出“神”；“蒙赦免”符合庄重而自然的现代汉语。
- source_word: מֵחַטָּאתוֹ אֲשֶׁר חָטָא
  choice: 他所犯的罪……蒙赦免
  rationale: מן在赦免公式中表达罪得到宽赦；汉语以“所犯的罪蒙赦免”自然传达，不机械译作“从罪中”。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；音译“雅威”保留其作为盟约专名的性质，不以称号替代。
- issue: 赦免的施事者是否明说
  choice: 采用被动表达“蒙赦免”，不补出施事者
  alternative: 神必赦免他
  rationale: 原文使用被动式而未明说施事者；译文保留这一表达，既不否认语境中隐含的神圣施事者，也不在正文中增加原文没有明说的成分。
- issue: אָשָׁם所指祭物的名称
  choice: 赎愆祭
  alternative: 赔偿祭
  rationale: 该词同时涉及罪责及补偿、修复层面；正文采用传统且可识别的祭名，脚注保留“赔偿祭”这一能凸显补偿性质的译法，避免把语义压缩为单一教义概念。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。“赎愆祭”属于必要的礼仪术语，以脚注帮助普通读者理解；句式略作调整，使两次“他所犯的罪”都得到保留，同时避免希伯来语同源结构在汉语中显得拗口。
