  text: וְ/כַרְמְ/ךָ֙ לֹ֣א תְעוֹלֵ֔ל וּ/פֶ֥רֶט כַּרְמְ/ךָ֖ לֹ֣א תְלַקֵּ֑ט לֶֽ/עָנִ֤י וְ/לַ/גֵּר֙ תַּעֲזֹ֣ב אֹתָ֔/ם אֲנִ֖י יְהוָ֥ה אֱלֹהֵי/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/010.yaml
  text: And you shall not strip your vineyard bare[a], nor shall you gather the fallen grapes of your vineyard; you shall leave them for the poor and for the sojourner[c][b]. I am Yahweh your God.
translation:
  language: zh_hans
  text: 不可把你葡萄园里的葡萄摘尽[a]，也不可捡拾你葡萄园中掉落的葡萄[b]；要把这些留给穷人和寄居者[c]。我是雅威你们的上帝。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“不可再去摘取园中余下的葡萄”。原文动词指主要采摘之后，再次搜采藤上剩余的葡萄。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“园中散落的葡萄”或“葡萄园的遗留葡萄”。原文指采摘时散落、掉下或留下的葡萄。
    reason: lexical_alternative
  - marker: c
    text: “寄居者”指住在以色列人中间的非本地人，也可译作“外来居民”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כַרְמְךָ
  choice: 你的葡萄园
  rationale: כֶּרֶם 指种植葡萄的园地；“葡萄园”是现代汉语中自然、准确的对应词。
- source_word: תְעוֹלֵל
  choice: 采摘净尽
  rationale: 此处指在主要收成后再次搜采藤上余下的葡萄；“采摘净尽”清楚表达不得把余果全部收走的禁令，同时脚注保留“再去摘取余下葡萄”的具体含义。
- source_word: פֶּרֶט
  choice: 掉落的葡萄
  rationale: פֶּרֶט 在葡萄收割语境中指采摘时散落或掉下的葡萄；译文将具体所指明示出来。
- source_word: תְלַקֵּט
  choice: 捡拾
  rationale: לקט 指收集、拾取；与掉落的葡萄搭配时，“捡拾”比笼统的“收集”更具体自然。
- source_word: לֶעָנִי
  choice: 给穷人
  rationale: עָנִי 在此法律语境中指贫穷、缺乏生活资源的人；“穷人”直接易懂。
- source_word: וְלַגֵּר
  choice: 和寄居者
  rationale: גֵּר 指住在以色列人中间、却非本地族群成员的人；“寄居者”保留其居住及社会法律身份，不泛化为所有外国人。
- source_word: תַּעֲזֹב אֹתָם
  choice: 要把这些留给
  rationale: עזב 在此意为特意留下供他人取用；“把这些留给”自然表达受益对象，并将复数代词概括地指向未采和掉落之物。
- source_word: יְהוָה
  choice: 雅威
  rationale: 原文直接使用四字神名；“雅威”以现代汉语常见音译保留这个专名，不以称号替代。
- source_word: אֱלֹהֵיכֶם
  choice: 你们的上帝
  rationale: 忠实保留复数第二人称领属形式，以及律法中“我是雅威你们的上帝”这一立约宣告。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文是神的专名而非“主”这一称号；采用“雅威”保留专名，并贴近学界通常采用的读音重构。
- issue: 复数代词 אֹתָם 的所指
  choice: 译作“这些”，概括未摘尽和掉落的葡萄
  alternative: 译作“它们”，仅按最近的阳性复数名词理解
  rationale: 希伯来文代词为阳性复数，其具体范围可理解为前述留在园中的收成；“这些”既保留概括性，也不把所指不必要地限定为某一类余果。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“不可……也不可……；要……”保留律法条文的平行结构和命令力度；“采摘净尽”避免使用现代读者可能不熟悉、且通常用于谷物的“拾穗”来直接翻译葡萄园中的动作。
