id: LEV.19.18
reference: Leviticus 19:18
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: לֹֽא תִקֹּ֤ם וְ/לֹֽא תִטֹּר֙ אֶת בְּנֵ֣י עַמֶּ֔/ךָ וְ/אָֽהַבְתָּ֥ לְ/רֵעֲ/ךָ֖ כָּמ֑וֹ/ךָ אֲנִ֖י יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/018.yaml
  text: You shall not take vengeance or bear a grudge against the sons of your people[a], but you shall love your neighbor as yourself; I am Yahweh.
translation:
  language: zh_hans
  text: 不可向你本族的人报复，也不可对他们怀恨；要爱你的邻舍，如同爱自己。我是雅威。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תִקֹּם
  choice: 报复
  rationale: נקם表示实施报复、报仇；“报复”在现代汉语中自然，并保留主动报复的含义。
- source_word: תִטֹּר
  choice: 怀恨
  rationale: נטר在此指持续存留愤怒或怨恨；“怀恨”准确传达这种长期记恨的意味。
- source_word: בְּנֵי עַמֶּךָ
  choice: 本族人
  rationale: 字面为“你百姓的众子”，在此惯用地指同属以色列群体的人；“本族人”既自然，也保留直接语境中的群体范围。
- source_word: וְאָהַבְתָּ
  choice: 却要爱
  rationale: 法律语境中的连接词加完成式具有命令作用；“却要”既表达命令，也显出它与前两个禁令的对比。
- source_word: לְרֵעֲךָ
  choice: 你的邻舍
  rationale: רֵעַ可指同伴、朋友或邻舍；“邻舍”是此伦理语境中准确且为读者熟悉的对应词，同时不在译文中预先扩大或缩小其范围。
- source_word: כָּמוֹךָ
  choice: 如同爱自己
  rationale: 字面为“如同你自己”。汉语补出比较关系中隐含的“爱”，可避免误读，并自然表达以对自己的爱为比较标准。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以“雅威”音译上帝的专名，而不以称号替代，保留希伯来文本使用专名的特点。
theological_decisions:
- issue: 命令对象的范围
  choice: 将בְּנֵי עַמֶּךָ译为“本族人”，将רֵעַ译为“邻舍”
  alternative: 把两处都泛化为普世性的“所有人”，或把两处都处理成完全相同的群体称谓
  rationale: 经文本身先提“本族人”，后用“邻舍”；译文保留这一区别，不把后来的扩展性解释或限制性解释直接写入正文。
- issue: 神名的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 希伯来文使用专名יהוה；音译“雅威”可保留专名性质，避免以称号替代。
translation_notes:
  register: 采用现代、庄重而易懂的规范汉语。“不可……也不可……；却要……”保留律法命令的节奏和转折。“爱你的邻舍，如同爱自己”兼顾传统熟悉度与现代可读性。
