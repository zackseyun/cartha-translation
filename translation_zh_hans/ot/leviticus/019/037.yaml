  text: וּ/שְׁמַרְתֶּ֤ם אֶת כָּל חֻקֹּתַ/י֙ וְ/אֶת כָּל מִשְׁפָּטַ֔/י וַ/עֲשִׂיתֶ֖ם אֹתָ֑/ם אֲנִ֖י יְהוָֽה־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/037.yaml
  text: So you shall keep all my statutes and all my judgments[a], and do them. I am Yahweh.
translation:
  language: zh_hans
  text: 所以，你们要谨守我的一切律例和一切典章[a]，并且实行。我是雅威。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “律例”或译“法令”；“典章”或译“规章”“裁定”。希伯来文在这里使用了两个不同的法律术语。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁמַרְתֶּם
  choice: 所以，你们要谨守
  rationale: שׁמר在盟约和律法语境中指谨守、遵守。译作“谨守”既体现持续留意并遵行的含义，也保留与后文“实行”的区别。句首וּ结合本节在全章末尾的总结作用，译作“所以”。
- source_word: כָּל
  choice: 一切
  rationale: 两处均译作“一切”，保留希伯来文全面、无遗漏的语气。
- source_word: חֻקֹּתַי
  choice: 我的一切律例
  rationale: חֻקִּים指颁定的法规或条例。“律例”符合《利未记》的庄重法律语体，并与מִשְׁפָּטִים有所区别。
- source_word: מִשְׁפָּטַי
  choice: 我的一切典章
  rationale: מִשְׁפָּטִים可指判例、裁定或法令。“典章”保持法律语域，也保留它与חֻקִּים是两个不同法律术语这一点。
- source_word: וַעֲשִׂיתֶם אֹתָם
  choice: 并且实行
  rationale: עשה以法律规定为宾语时表示实行、执行。“实行”自然简洁，并避免与前面的“谨守”重复。汉语可省略已明确的宾语“它们”。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见音译“雅威”呈现神的专名，而不以“主”这一称号代替。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名。译作“雅威”旨在呈现其专名性质；“耶和华”是汉语传统中广为人知的另一种音译。
translation_notes:
  register: 采用现代、庄重而易懂的法律与盟约语体。“谨守……并且实行”保留原文先强调持守、再强调付诸行动的结构；“律例”和“典章”维持两个希伯来法律术语的区别。
