base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/001.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: zh_hans
  text: 雅威[a]对摩西说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文：YHWH；传统上常译作“耶和华”或“上主”。
    reason: 说明神名的原文形式及传统译法。
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: 说
  rationale: 这是引入一段新神谕的叙事形式；现代汉语以“对……说”自然表达说话事件。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文四字神名 YHWH 的常见学术拟音译出其专名，不以称号替代。
- source_word: אֶל
  choice: 对
  rationale: 在“说话”结构中标明受话者，汉语自然表达为“对”。
- source_word: מֹשֶׁה
  choice: 摩西
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: לֵאמֹר
  choice: 说：
  rationale: 该词是希伯来语引出直接话语的固定形式；与前面的 וַיְדַבֵּר 合并译为“对摩西说：”，既保留引语功能，又避免汉语中生硬重复。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名，因此正文采用“雅威”以保留专名性质；脚注说明其希伯来字母形式及传统译法，不把某一传统称号无提示地代入正文。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。“雅威[a]对摩西说：”合并处理希伯来语的“讲话……说”公式，并用冒号承接下一节的直接话语；脚注标记紧随其所解释的神名。
