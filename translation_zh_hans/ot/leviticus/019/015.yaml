  text: לֹא תַעֲשׂ֥וּ עָ֨וֶל֙ בַּ/מִּשְׁפָּ֔ט לֹא תִשָּׂ֣א פְנֵי דָ֔ל וְ/לֹ֥א תֶהְדַּ֖ר פְּנֵ֣י גָד֑וֹל בְּ/צֶ֖דֶק תִּשְׁפֹּ֥ט עֲמִיתֶֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/015.yaml
  text: You shall not commit injustice in judgment. You shall not show partiality to the poor, nor honor the face of the great; with righteousness you shall judge your neighbor.
translation:
  language: zh_hans
  text: 你们审判时不可行不公之事；不可偏袒穷人，也不可徇有权势者的情面；要按公义审判你的同胞。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “按公义”或译“按公正”。
    reason: lexical_alternative
  - marker: b
    text: “偏袒”和“徇……的情面”原文分别直译为“抬起穷人的脸”和“尊崇大人物的脸”，都是法庭语境中的说法，指因人的处境或地位而徇情偏私。
    reason: cultural_note
lexical_decisions:
- source_word: עָוֶל בַּמִּשְׁפָּט
  choice: 审判时……行不公之事
  rationale: 该词组处于司法语境，指在审理和裁断中施行不公；此译既保留行为性的表达，也符合现代汉语法律语境。
- source_word: תִשָּׂא פְנֵי דָל
  choice: 偏袒穷人
  rationale: “抬起……的脸”是表示优待、徇情的希伯来语习语；译出其司法含义。“穷人”保留 דָל 的经济及社会弱势色彩。
- source_word: תֶהְדַּר פְּנֵי גָדוֹל
  choice: 徇有权势者的情面
  rationale: 该表达与前句平行，禁止因对方地位显要而优待。“有权势者”自然表达 גָדוֹל 在此处的社会地位含义，同时避免误解为身体高大。
- source_word: בְּצֶדֶק
  choice: 按公义
  rationale: צֶדֶק 同时带有道德正直与司法公正的含义；“公义”保留这种较宽的伦理—司法张力，脚注列出“公正”这一语境性译法。
- source_word: תִּשְׁפֹּט
  choice: 审判
  rationale: 直接表达 שׁפט 的司法裁断意义，并以“要”体现律法命令语气。
- source_word: עֲמִיתֶךָ
  choice: 你的同胞
  rationale: עָמִית 指共同体中的同伴或同属之人；“同胞”比现代汉语中常指邻近居民的“邻舍”更能传达此处的共同体关系。
theological_decisions:
- issue: 法律伦理语境中 צֶדֶק 的译法
  choice: 按公义
  alternative: 按公正
  rationale: 原词兼具道德正直和司法正义两方面。“公义”保留较广的神学与伦理内涵，而脚注承认“公正”在审判语境中同样成立，避免把原文含义收窄。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“你们”承接对全体听众的禁令，末句“你的同胞”保留希伯来文单数形式。分号呈现原文三个相互关联的司法命令。
