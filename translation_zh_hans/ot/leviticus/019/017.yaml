  text: לֹֽא תִשְׂנָ֥א אֶת אָחִ֖י/ךָ בִּ/לְבָבֶ֑/ךָ הוֹכֵ֤חַ תּוֹכִ֨יחַ֙ אֶת עֲמִיתֶ֔/ךָ וְ/לֹא תִשָּׂ֥א עָלָ֖י/ו חֵֽטְא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/017.yaml
  text: You shall not hate your brother in your heart. You shall surely rebuke your neighbor[a], and you shall not bear sin because of him.
translation:
  language: zh_hans
  text: 不可在心里恨你的弟兄；务要责备你的邻舍，不可因他而负罪[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“不可因他的缘故招致罪责”，或“不可分担他的罪”。这个希伯来语短语是习惯用语，可能指因没有指出对方的过错，自己也因此负罪。
    reason: 保留“不可因他而负罪”所对应的希伯来语习语在罪责归属和因果关系上的词义歧义。
lexical_decisions:
- source_word: תִשְׂנָא
  choice: 恨
  rationale: שׂנא直接表示憎恨；“恨”保留禁令的道德力度，不将其弱化为一般的不满或敌意。
- source_word: אָחִיךָ
  choice: 你的弟兄
  rationale: אָח既可指亲兄弟，也可指盟约群体中的成员；“弟兄”保留原文的亲属称谓及其群体共鸣。
- source_word: בִּלְבָבֶךָ
  choice: 心里
  rationale: לֵבָב指人的内在思想、意向和态度；“心里”是自然的现代汉语，也准确保留命令所针对的内在仇恨。
- source_word: הוֹכֵחַ תּוֹכִיחַ
  choice: 务要责备
  rationale: 不定式绝对形与限定动词连用，加强命令语气；“务要”体现强调，“责备”表达针对过错作出明确指正。
- source_word: עֲמִיתֶךָ
  choice: 你的同胞
  rationale: עָמִית指同一群体中的伙伴或成员；“同胞”在此比泛指地域相邻者的“邻舍”更直接表达共同体关系，同时与前句“弟兄”形成自然对应。
- source_word: תִשָּׂא עָלָיו חֵטְא
  choice: 因他担当罪
  rationale: נשׂא חטא可指担当罪责或招致罪责，עָלָיו在此可表达“因他／在他的事上”；正文贴近原文措辞，并用脚注保留其多种可能含义。
theological_decisions:
- issue: 亲属与共同体称谓的范围
  choice: 保留阳性单数关系称谓“弟兄”和“同胞”
  alternative: 译作“同伴”“别人”或“以色列同胞”
  rationale: 原文使用具有代表作用的阳性单数形式。“弟兄”和“同胞”既保留盟约共同体语境，也不把所指范围过早限定为血亲，或在正文中加入原文未明说的“以色列”。
- issue: 末句罪责的归属与成因
  choice: 正文译作“不可因他担当罪”，以脚注保留解释空间
  alternative: “不可因他的缘故招致罪责”或“不可与他一同有罪”
  rationale: 希伯来语习语可指因未纠正对方而自己负罪，也可能指因对方而招致罪责或分担其罪。正文不将这种神学与伦理张力静默地固定为单一解释。
translation_notes:
  register: 采用现代、庄重而易懂的法律劝诫语体。“务要”传达原文的强调结构；分号呈现禁止内心仇恨与积极责备之间的紧密对照。
