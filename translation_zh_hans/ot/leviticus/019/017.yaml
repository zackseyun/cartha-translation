revisions:
- from: 不可心里恨你的弟兄；务要责备你的同胞，不可因他担当罪。[a]
  to: 不可在心里恨你的弟兄；务要责备你的邻舍，不可因他而负罪[a]。
  rationale: 修订仅改善现代汉语的语序、末句的罪责关系表达及脚注锚点。“邻舍”作为共同体内“同伴／邻人”的惯用伦理语汇，比“同胞”更少引起现代国族身份的联想，并与本章的语境协调。脚注继续保留末句的多种可行理解，不预设特定神学解释。
