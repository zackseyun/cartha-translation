source:
  edition: WLC
  text: לֹֽא תַעֲשֹׁ֥ק אֶת רֵֽעֲ/ךָ֖ וְ/לֹ֣א תִגְזֹ֑ל לֹֽא תָלִ֞ין פְּעֻלַּ֥ת שָׂכִ֛יר אִתְּ/ךָ֖ עַד בֹּֽקֶר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/013.yaml
  text: You shall not oppress your neighbor or rob him[a]. The wages of a hired worker shall not remain with you until morning.
translation:
  language: zh_hans
  text: 不可欺压你的邻舍，也不可抢夺他的财物。雇工的工钱不可在你那里留到早晨。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תַעֲשֹׁק
  choice: 欺压
  rationale: 该动词可指滥用权势、扣留应得之物而压榨他人；“欺压”保留其宽广的伦理含义，也符合本节的经济语境。
- source_word: רֵעֲךָ
  choice: 你的同胞
  rationale: 在律法伦理语境中，רֵעַ常指共同体中的一员；“同胞”自然地表达彼此同属群体的关系，同时避免把范围仅理解为空间上相邻的人。
- source_word: תִגְזֹל
  choice: 抢夺他的财物
  rationale: גזל常指以强力或不正当手段夺取；“抢夺”比一般的“偷窃”更能体现强行侵占之意。补出“财物”，使现代汉语表达完整，但不限定具体物品。
- source_word: תָלִין
  choice: 留到
  rationale: 该动词在此为阴性单数，与“工钱”一致，字面意思是“过夜、留宿”；“不可……留到早晨”保留由工钱作语法主体的结构及延付禁令。
- source_word: פְּעֻלַּת
  choice: 工钱
  rationale: פְּעֻלָּה可指劳动或劳动所得；与שָׂכִיר连用并处于禁止延付的语境中，译作“工钱”最明确自然。
- source_word: שָׂכִיר
  choice: 雇工
  rationale: שָׂכִיר指受雇领取报酬的人；“雇工”是简洁、通行的现代汉语说法。
- source_word: אִתְּךָ
  choice: 在你那里
  rationale: 介词表明工钱仍由雇主掌握；“在你那里”直接传达其被留在对方手中的意思。
- source_word: עַד בֹּקֶר
  choice: 到早晨
  rationale: 保留原文具体的时间界限，而不只概括为“过夜”。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的律法语体。“不可”保持禁令的明确力度；两个分句分别呈现欺压、抢夺及延付工资的社会伦理要求。未沿用英语层的脚注，因为其脚注内容与正文后半句实际对应，却标在前半句之后，且中文正文已自然表达该词义，无需另设词汇异译注。
