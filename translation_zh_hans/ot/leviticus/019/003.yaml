source:
  edition: WLC
  text: אִ֣ישׁ אִמּ֤/וֹ וְ/אָבִי/ו֙ תִּירָ֔אוּ וְ/אֶת שַׁבְּתֹתַ֖/י תִּשְׁמֹ֑רוּ אֲנִ֖י יְהוָ֥ה אֱלֹהֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/003.yaml
  text: Each man shall fear his mother and his father[a], and you shall keep my Sabbaths[b]. I am Yahweh your God.
translation:
  language: zh_hans
  text: 你们各人[a]都要敬畏[b]自己的母亲和父亲，也要谨守我的安息日。我是雅威你们的上帝。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“各男人”，这里用阳性单数，以分配方式指群体中的各人。
    reason: 说明原文的语法形式及其群体性用法。
  - marker: b
    text: 或译“惧怕”；原词可指带着尊崇和畏惧的态度。
    reason: 保留希伯来文ירא在惧怕与尊崇之间的词义幅度。
lexical_decisions:
- source_word: אִישׁ
  choice: 你们各人
  rationale: 希伯来文以阳性单数作分配式用法，对整个群体中的每一个成员发出命令。现代汉语用“你们各人”自然表达这一分配意义；脚注说明原文的形式。
- source_word: אִמּוֹ וְאָבִיו
  choice: 自己的母亲和父亲
  rationale: 保留原文逐一提及双亲以及“母亲”在“父亲”之前的次序，不合并为“父母”。“自己的”承接希伯来文两个第三人称单数所属后缀。
- source_word: תִּירָאוּ
  choice: 敬畏
  rationale: ירא在本语境中兼有惧怕、尊敬和心存畏惧之意。“敬畏”在现代汉语中能较好保留这种伦理性的畏惧与尊崇，避免把命令弱化为一般的尊敬。
- source_word: שַׁבְּתֹתַי
  choice: 我的安息日
  rationale: “安息日”在汉语中可作类称，表达原文复数所指的各个安息日，同时保留第一人称所属关系。
- source_word: תִּשְׁמֹרוּ
  choice: 谨守
  rationale: שׁמר有守护、遵守、谨慎持守之意；与安息日搭配时，“谨守”自然且保留认真遵行的力度。
- source_word: יְהוָה
  choice: 雅威
  rationale: 用现代汉语中直接音译四字神名的形式，避免以“主”这一称号替代原文专名。
- source_word: אֱלֹהֵיכֶם
  choice: 你们的上帝
  rationale: 在“雅威”与单一所指的盟约宣告中，此词为单数意义；译作“你们的上帝”符合句法和语境。
theological_decisions:
- issue: 对儿女应有态度的情感力度
  choice: 敬畏自己的母亲和父亲
  alternative: 惧怕自己的母亲和父亲；尊敬自己的母亲和父亲
  rationale: 原词可以表示惧怕，也可表示带着畏惧的尊崇。“敬畏”保留两方面的张力；“惧怕”可能过度突出恐惧，“尊敬”则可能削弱畏惧感。
- issue: 开头分配式阳性单数的表达
  choice: 你们各人
  alternative: 每个男人
  rationale: 此处阳性单数אִישׁ以分配方式向全体会众发令。汉语“你们各人”准确传达实际句法功能，同时由脚注保留原文形式信息，避免“每个男人”在汉语中被误解为只限成年男性。
- issue: 神名的呈现
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。译文以音译专名呈现，不用称号“主”取代；“雅威”较直接反映学界通常重构的读音。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“母亲和父亲”刻意保留原文先母后父的次序；“谨守”体现盟约命令的严肃性。
