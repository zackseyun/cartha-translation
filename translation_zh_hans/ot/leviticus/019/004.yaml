  text: אַל תִּפְנוּ֙ אֶל הָ֣/אֱלִילִ֔ים וֵֽ/אלֹהֵי֙ מַסֵּכָ֔ה לֹ֥א תַעֲשׂ֖וּ לָ/כֶ֑ם אֲנִ֖י יְהוָ֥ה אֱלֹהֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/004.yaml
  text: Do not turn to idols[a], and do not make cast-metal gods for yourselves[b]. I am Yahweh your God.
translation:
  language: zh_hans
  text: 不可转向偶像[a]，也不可为自己铸造金属神像[b]。我是雅威，你们的神。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“虚无的偶像”；这个希伯来词可能含有“毫无价值”的贬义。
    reason: lexical_alternative
  - marker: b
    text: 或译：“铸成的神明”或“金属偶像”。原文指以熔融金属铸成、作为神祇而受崇拜的形像。
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּפְנוּ
  choice: 转向
  rationale: פנה 与 אֶל 连用，基本义是“转向”。这里可涵盖把注意、倚赖或敬拜转向偶像，但不直接窄化为“敬拜”。
- source_word: אֱלִילִים
  choice: 偶像
  rationale: אֱלִילִים 通常指偶像，并可能含有“虚无、毫无价值”的贬义；正文采用现代汉语最清楚自然的“偶像”，贬义色彩在脚注说明。
- source_word: אֱלֹהֵי מַסֵּכָה
  choice: 铸造神像
  rationale: 该结构指以熔融材料，尤其金属，铸成的神祇形像。“铸造神像”在现代汉语中自然，并保留制造方式及偶像实体的含义。
- source_word: תַעֲשׂוּ לָכֶם
  choice: 为自己铸造
  rationale: לָכֶם 表示为自己使用或拥有；“为自己”保留了这一受益或归属含义。动词“铸造”同时自然承接 מַסֵּכָה 所指的制作方式。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以“雅威”音译四字神名，保留其作为以色列之神专名的性质，不以称号代替。
- source_word: אֱלֹהֵיכֶם
  choice: 你们的神
  rationale: אֱלֹהִים 虽在形态上为复数形式，此处在盟约宣告中明确指以色列唯一的神，故译作单数“神”；后缀为第二人称复数，译作“你们的”。
theological_decisions:
- issue: 是否把“转向偶像”明确译成“敬拜偶像”
  choice: 不可转向偶像
  alternative: 不可敬拜偶像
  rationale: 原文 פנה 表示转向或面向，并未直接使用“敬拜”一词。保留较宽的表达，既包括敬拜的语境，也不把原文含义人为缩窄。
- issue: 如何译出神名 יְהוָה
  choice: 雅威
  alternative: 耶和华／主
  rationale: 原文直接使用神的专名。采用现代常见的学术性音译“雅威”，不以“主”这一称号替代；“耶和华”则源于较晚的混合读法。
- issue: אֱלֹהֵי מַסֵּכָה 应译作“神”还是“神像”
  choice: 铸造神像
  alternative: 铸成的神明
  rationale: 原文以“神”称呼这些铸成之物，带有偶像神祇的观念；汉语若直译“铸造神明”不够自然。“神像”清楚表明这是人手制造的崇拜对象，同时脚注保留“铸成的神明”这一较形式对应的译法。
translation_notes:
  register: 采用简洁、庄重而现代的禁令句式。“不可”适合律法语体，但普通读者仍易理解；“转向”刻意保留原文比“敬拜”更宽的语义范围。
