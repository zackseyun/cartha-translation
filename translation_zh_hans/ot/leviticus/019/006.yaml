  yaml_path: translation/ot/leviticus/019/006.yaml
  text: It shall be eaten on the day of your sacrifice and on the next day[a], but what remains until the third day shall be burned in the fire.
translation:
  language: zh_hans
  text: 这祭物要在你们献祭的当天和第二天吃；剩到第三天的，要用火焚烧。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּיוֹם זִבְחֲכֶם
  choice: 你们献祭的当天
  rationale: בְּיוֹם 表示时间，זִבְחֲכֶם 指你们所献的祭；译文用现代汉语的时间表达，并保留献祭语境。
- source_word: יֵאָכֵל
  choice: 都要吃这祭物
  rationale: Nifal 未完成式是被动形式，在律例语境中表达规定。汉语采用自然的主动式，并从上下文补出“这祭物”。
- source_word: וּמִמָּחֳרָת
  choice: 和第二天
  rationale: מָחֳרָת 指紧接着的次日；“第二天”清楚自然，也与随后“第三天”形成顺序。
- source_word: וְהַנּוֹתָר עַד יוֹם הַשְּׁלִישִׁי
  choice: 剩到第三天的
  rationale: הַנּוֹתָר 是表示剩余之物的分词，עַד 标明截至第三天的时间界限；此译简洁保留二者关系。
- source_word: בָּאֵשׁ יִשָּׂרֵף
  choice: 必须用火焚烧
  rationale: יִשָּׂרֵף 是 Nifal 被动式；“必须”体现律例的强制性，“用火焚烧”是自然且庄重的现代汉语。
theological_decisions: []
