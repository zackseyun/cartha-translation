  text: וְ/שֶׂ֣רֶט לָ/נֶ֗פֶשׁ לֹ֤א תִתְּנוּ֙ בִּ/בְשַׂרְ/כֶ֔ם וּ/כְתֹ֣בֶת קַֽעֲקַ֔ע לֹ֥א תִתְּנ֖וּ בָּ/כֶ֑ם אֲנִ֖י יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/028.yaml
  text: You shall not make any cuts in your flesh for the dead[a], and you shall not put a tattoo mark on yourselves[b]. I am Yahweh.
translation:
  language: zh_hans
  text: 不可为死人在身上割伤[a]，也不可在身上刺刻印记[b]。我是耶和华。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“为死者”。这里的希伯来语是惯用说法，通常指为死者哀悼。
    reason: lexical_alternative
  - marker: b
    text: 或译“刻写的标记”或“纹身”。这组希伯来词十分罕见，可能指留在身体上的永久标记。
    reason: lexical_alternative
lexical_decisions:
- source_word: שֶׂרֶט
  choice: 割伤
  rationale: 该名词指在身体上造成的切口或伤痕；“割伤”在现代汉语中自然，并保留具体的身体动作而不限定工具或严重程度。
- source_word: לָנֶפֶשׁ
  choice: 为死人
  rationale: 在此律法及哀悼语境中，נֶפֶשׁ 指死者；“为死人”简洁传达为死者哀悼而行此事的惯用含义，同时脚注保留“为死者”的表达。
- source_word: בִּבְשַׂרְכֶם
  choice: 在身上
  rationale: 字面为“在你们的肉体上”；现代汉语用“在身上”更自然清楚，仍明确指身体。
- source_word: כְתֹבֶת קַעֲקַע
  choice: 刺刻印记
  rationale: 这是罕见的组合表达，涉及写刻或刺入身体的标记。“刺刻印记”保留其永久性身体标记的可能含义，又不把语义无保留地限定为现代“纹身”。
- source_word: לֹא תִתְּנוּ ... בָּכֶם
  choice: 不可在身上刺刻
  rationale: נתן 配合介词 ב 在此表达把标记施加于身体；按汉语习惯结合动作译为“在身上刺刻”。
- source_word: אֲנִי יְהוָה
  choice: 我是耶和华
  rationale: 保留神圣名字 יהוה 的专名性质，并采用现代中文圣经读者熟悉的“耶和华”。
theological_decisions:
- issue: 身体标记禁令与现代纹身问题的范围
  choice: 正文直译为不可为死人割伤身体，也不可刺刻印记，不在译文中限定或扩大其适用范围
  alternative: 将两项都明确限定为异教丧葬习俗，或直接表述为对一切时代和文化中所有纹身的普遍禁令
  rationale: 希伯来文只在第一项禁令中明说“为死人”，第二项没有重复这一限定。译文应保留这种结构和张力，不替经文作进一步的教义裁定。
- issue: כְתֹבֶת קַעֲקַע 的确切所指
  choice: 正文译作“刺刻印记”，脚注说明也可理解为“纹身”
  alternative: 正文直接译作“纹身”
  rationale: 该表达罕见，其构词指向刻写或刺入的身体标记；较宽的正文译法可保存词义的不确定性，脚注则提供最常见的现代对应。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“不可”保持律法禁令的简洁力度；两个分句平行。正文不把第二项直接等同于所有现代纹身，以保留原文罕见词组的语义余地。
