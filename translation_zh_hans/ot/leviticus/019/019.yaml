  to: 你们要遵守我的律例。不可使你的牲畜与不同种类交配；不可在你的田里播种混合的两样种子；混纺的衣服，就是沙阿特内兹[a]，不可披在你身上。
  rationale: 修订仅处理现代汉语的语义清晰度和搭配问题：以“不同种类”准确表达כִּלְאַיִם，以更自然的语序处理田地播种条款，并重构衣物条款以消除不自然的使役表达。保留“沙阿特内兹”的音译及脚注中的传统性限定，不在正文或脚注中把该术语的具体纤维构成断言为无争议事实。
