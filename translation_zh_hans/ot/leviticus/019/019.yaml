  source_fidelity: 总体忠实地传达了三项禁令及原文由复数转单数的变化。第一项“与异类交配”在现代汉语中含义偏泛，容易使“异类”被理解为非同类生物或带贬义；应明确为不同种类。第二项“两样混杂的种子”也略显别扭，改为“混合的两样种子”较清楚，仍不具体化种类。
  naturalness: 原译整体庄重可懂，但“让……披在你身上”和“搀杂料子的衣服”不够自然。“混纺的衣服……不可披在你身上”更符合现代汉语的法律训令语体，同时保留原文衣物‘临到／上到’人身上的意象。
  terminology: “律例”“牲畜”“撒播／播种”均合适。“沙阿特内兹”保留为音译并以脚注说明是恰当的；正文的“混纺”不预断具体纤维。脚注应将“受禁止”改为更自然的“被禁止”，并保留“传统上”的限定。
