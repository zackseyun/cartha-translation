    rationale: כִּלְאַיִם指不同种类的混合；“异类”在现代中文中常指非我族类、奇异者或泛指他者。译为“与不同种类交配”更贴近原文而不添加遗传学含义。
  - severity: low
    issue: “两样混杂的种子”搭配生硬。
    rationale: 该表达可能被理解为种子本身性质‘混杂’，而非在田中播下两种不同种类。调整语序可更自然地保留原文概括性。
  - severity: low
