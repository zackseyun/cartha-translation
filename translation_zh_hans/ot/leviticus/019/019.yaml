base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/019.yaml
  text: You shall keep my statutes. You shall not breed your livestock with two different kinds; you shall not sow your field with two kinds of seed; and a garment of mixed material[a], shaatnez, shall not come upon you.
translation:
  language: zh_hans
  text: 你们要遵守我的律例。不可使你的牲畜与不同种类交配；不可在你的田里播种混合的两样种子；混纺的衣服，就是沙阿特内兹[a]，不可披在你身上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “沙阿特内兹”是希伯来语中一种被禁止的混纺织物的专门名称，传统上理解为羊毛和细麻混织的料子；参申命记22:11。
    reason: lexical_alternative
lexical_decisions:
- source_word: חֻקֹּתַי
  choice: 我的律例
  rationale: חֻקָּה指规定并确立的法令；“律例”在现代中文圣经语体中庄重、清楚，也保留其法律性质。
- source_word: תִּשְׁמֹרוּ
  choice: 要遵守
  rationale: שׁמר在盟约和法律语境中表示谨守、遵行；“遵守”是自然明确的现代汉语表达。
- source_word: בְּהֶמְתְּךָ
  choice: 你的牲畜
  rationale: בְּהֵמָה在此泛指家养牲畜，不限于牛。
- source_word: תַרְבִּיעַ כִּלְאַיִם
  choice: 让你的牲畜与异类交配
  rationale: 使役形动词תַרְבִּיעַ表示使动物交配，כִּלְאַיִם表示不同种类的混合；此译法保留使役含义，并避免加入现代遗传学色彩较强的术语。
- source_word: שָׂדְךָ לֹא תִזְרַע כִּלְאָיִם
  choice: 不可在你的田里撒播两样混杂的种子
  rationale: זָרַע意为撒种；כִּלְאַיִם在本分句指不同种类混种，补出“种子”符合语境，也使中文完整。
- source_word: בֶגֶד כִּלְאַיִם
  choice: 搀杂料子的衣服
  rationale: בֶגֶד是衣服，כִּלְאַיִם表示异类材料的混合；“搀杂料子”保留概括性，不在正文中先行限定具体纤维。
- source_word: שַׁעַטְנֵז
  choice: 沙阿特内兹
  rationale: 这是罕见的专门术语，确切词源和内涵不明；音译并以脚注解释，可保存原文的技术性与不确定性。
- source_word: יַעֲלֶה עָלֶיךָ
  choice: 披在你身上
  rationale: 原文直译为“上到你身上”；“披在你身上”在中文中自然，并保留衣物置于身体之上的具体意象，较“穿”略少解释性。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的法律训令语体。开头用复数“你们”对应全体听众，后三项禁令依希伯来文转为单数“你的／你”，保留原文人称变化。用分号呈现三项并列禁令；技术词音译并附脚注，避免在正文中过度确定其材质。
