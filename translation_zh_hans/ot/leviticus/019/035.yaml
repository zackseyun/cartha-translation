base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/035.yaml
  text: You shall not commit injustice in judgment[a], in measures of length, weight, or volume.
translation:
  language: zh_hans
  text: 你们不可在审判[a]上，或在长度、重量、容量的计量上行不公。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “审判”也可译为“公正”或“公平的裁断”；本句可泛指在判断及各类计量中不可行不公。
    reason: 原文 מִשְׁפָּט 可指审判、司法裁断或公正；脚注保留此处的语义范围，而不改变禁令的表达。
lexical_decisions:
- source_word: לֹא תַעֲשׂוּ
  choice: 你们不可……行
  rationale: 原文是第二人称阳性复数禁令；“你们不可……行”既保留律法语气，也符合现代汉语表达。
- source_word: עָוֶל
  choice: 不公
  rationale: 该词表示不正、不公或欺诈；“行不公”涵盖司法和交易计量中的不公平行为。
- source_word: בַּמִּשְׁפָּט
  choice: 在审判上
  rationale: מִשְׁפָּט 可指审判、公正或司法裁断。“在审判上”贴近原文，并保留其可能涉及司法判断的含义。
- source_word: בַּמִּדָּה
  choice: 量尺寸
  rationale: מִדָּה 是度量、尺寸；鉴于后文另列重量和容量，“量尺寸”自然地区分长度或大小方面的度量。
- source_word: בַּמִּשְׁקָל
  choice: 称重量
  rationale: מִשְׁקָל 指重量或称量；“称重量”准确表达实际交易中的称量行为。
- source_word: וּבַמְּשׂוּרָה
  choice: 量容量
  rationale: מְשׂוּרָה 指容量单位或所量的容量，不必限定为液体或干物；“量容量”保留其范围。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的律法体。主句保留“你们不可”的群体禁令语气；三个计量类别用平行的动宾结构表达，避免把容量擅自缩窄为液量或干量。
