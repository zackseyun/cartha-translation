id: LEV.19.9
reference: Leviticus 19:9
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וּֽ/בְ/קֻצְרְ/כֶם֙ אֶת קְצִ֣יר אַרְצְ/כֶ֔ם לֹ֧א תְכַלֶּ֛ה פְּאַ֥ת שָׂדְ/ךָ֖ לִ/קְצֹ֑ר וְ/לֶ֥קֶט קְצִֽירְ/ךָ֖ לֹ֥א תְלַקֵּֽט־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/009.yaml
  text: When you reap the harvest of your land[a], you shall not completely reap the edge of your field, and you shall not gather the gleanings of your harvest.
translation:
  language: zh_hans
  text: 你们收割地里的庄稼时，不可把田边全都割尽[a]，也不可拾取收割时遗落的庄稼。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “田边”或译“田角”。希伯来语可指边缘、侧边或角落；这里指田地外围必须留下不收割的部分。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְקֻצְרְכֶם
  choice: 你们收割……时
  rationale: 介词 בְּ 加不定式结构在这里引出时间情境；译为“……时”符合现代汉语法规语体。
- source_word: קְצִיר אַרְצְכֶם
  choice: 地里的庄稼
  rationale: קְצִיר 可指收成、庄稼或收割；结合“你们的地”，译作“地里的庄稼”自然地表达田地所产且正被收割的作物，避免将 אֶרֶץ 误解为政治意义的国家。
- source_word: לֹא תְכַלֶּה
  choice: 不可……全都割尽
  rationale: Piel 形式的 כלה 表示完成、做尽；与 לִקְצֹר 连用，指不可将指定部分彻底收割，故以“全都割尽”明确动作和完成含义。
- source_word: פְּאַת שָׂדְךָ
  choice: 田边
  rationale: פֵּאָה 可指边、侧边或角落；在本条收割法规中泛指田地外围应留下不割的部分。“田边”简明自然，同时保留其范围未被精确限定的特点。
- source_word: לֶקֶט קְצִירְךָ
  choice: 收割时遗落的庄稼
  rationale: לֶקֶט 指收割过程中掉落或留下、可随后捡拾的作物。“遗落的庄稼”比专业色彩较强的“遗穗”范围更宽，也不把对象限于谷穗。
- source_word: לֹא תְלַקֵּט
  choice: 不可拾取
  rationale: לקט 指逐一捡拾、收集散落作物；“拾取”准确表达此处禁止田主回头捡收遗落物的动作。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的法规语体。“不可”体现禁令力度；第二人称在前句明示，后句依汉语习惯承接省略。脚注保留 פֵּאָה 在“边缘／角落”之间的真实词义幅度。
