id: LEV.20.22
reference: Leviticus 20:22
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וּ/שְׁמַרְתֶּ֤ם אֶת כָּל חֻקֹּתַ/י֙ וְ/אֶת כָּל מִשְׁפָּטַ֔/י וַ/עֲשִׂיתֶ֖ם אֹתָ֑/ם וְ/לֹא תָקִ֤יא אֶתְ/כֶם֙ הָ/אָ֔רֶץ אֲשֶׁ֨ר אֲנִ֜י מֵבִ֥יא אֶתְ/כֶ֛ם שָׁ֖מָּ/ה לָ/שֶׁ֥בֶת בָּֽ/הּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/022.yaml
  text: So you shall keep all my statutes and all my judgments and do them[b][a], so that the land to which I am bringing you to dwell in it may not vomit you out.
translation:
  language: zh_hans
  text: 所以，你们要谨守我的一切律例和一切典章[a]，并且遵行，免得我领你们去居住的那地把你们吐出去[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “律例”和“典章”对应两个不同的希伯来语法律用词，也可译作“法令”和“法规”。
    reason: lexical_alternative
  - marker: b
    text: “吐出去”也可译作“呕吐出去”。原文使用“呕吐”一词，以鲜明的比喻描写土地驱逐受玷污的居民。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁמַרְתֶּם
  choice: 所以，你们要谨守
  rationale: שׁמר在盟约和法律语境中指谨慎遵守；“谨守”兼顾守护与实行之意。连接词译作“所以”，承接上文的警告并表达推论。
- source_word: חֻקֹּתַי
  choice: 我的一切律例
  rationale: חֻקָּה指规定、法令或成文条例；“律例”是庄重而易懂的法律用语，并与מִשְׁפָּטִים有所区分。
- source_word: מִשְׁפָּטַי
  choice: 一切典章
  rationale: מִשְׁפָּט可指判例、司法裁定或规范；“典章”保留法律色彩，也避免与חֻקּוֹת合并为同一泛称。
- source_word: וַעֲשִׂיתֶם אֹתָם
  choice: 并且遵行
  rationale: עשה以律法条文为宾语时指实行、履行；中文用“遵行”自然表达实际照着去做，宾语由前文承接，无须重复。
- source_word: וְלֹא תָקִיא אֶתְכֶם
  choice: 免得……把你们吐出去
  rationale: קיא本义是“呕吐”；保留“吐出去”这一鲜明拟人比喻，不弱化土地驱逐受玷污居民的警告。“免得”自然表达命令之后所警戒的结果。
- source_word: הָאָרֶץ
  choice: 那地
  rationale: 此处指以色列人将要进入居住的特定土地，不是泛指全地或世界。
- source_word: אֲשֶׁר אֲנִי מֵבִיא אֶתְכֶם שָׁמָּה לָשֶׁבֶת בָּהּ
  choice: 我领你们去居住的
  rationale: 以简洁自然的现代汉语表达上帝把百姓带到那里、使他们住在其中的目的；“居住”保持庄重语体。
theological_decisions:
- issue: 土地吐出居民的盟约警告
  choice: 保留土地“把你们吐出去”的拟人化表达。
  alternative: 译作“那地不会排斥你们”或“把你们赶出去”。
  rationale: 原文刻意使用强烈的生理比喻，呈现土地因居民的污秽而将其逐出的严肃后果；直译能保存其神学张力。
- issue: חֻקּוֹת与מִשְׁפָּטִים的区别
  choice: 分别译作“律例”和“典章”。
  alternative: 统称“律法”，或译作“法令”和“法规”。
  rationale: 原文并列两个不同的法律术语；使用两个中文词保留其词汇区别，但不进一步断定二者各自严格的法律分类。
- issue: וְלֹא תָקִיא所表达的逻辑关系
  choice: 用“免得”表达应当遵行与土地吐出之间的警戒性结果。
  alternative: 直陈为“那地就不会把你们吐出去”。
  rationale: 希伯来语以否定未完成式承接命令，可理解为所要避免的结果；“免得”保留警告语气，而不把它改写成机械性的保证。
translation_notes:
  register: 采用现代、庄重且适合公开诵读的标准普通话。“谨守”“律例”“典章”“遵行”保留盟约法律语体；句法则按现代汉语调整，以“免得”清楚连接命令与警告。
