base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/027.yaml
  text: And a man or a woman[a], if there is in them a medium or a spiritist, shall surely be put to death; they shall stone them with stones[c][b]. Their blood is on them.
translation:
  language: zh_hans
  text: 男人或女人，若作灵媒[a]或通灵者[b]，必被处死；要用石头打死他们。他们的血归到自己身上[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “灵媒”所译的希伯来词也可指与招魂有关的灵，或指求问这种灵的人。
    reason: lexical_alternative
  - marker: b
    text: “通灵者”也可译作“巫师”或“求问灵的人”。
    reason: lexical_alternative
  - marker: c
    text: “他们的血归到自己身上”是法律上的惯用语，表示他们要为自己的死承担责任。
    reason: cultural_note
lexical_decisions:
- source_word: וְאִישׁ אוֹ אִשָּׁה
  choice: 男人或女人
  rationale: 保留原文明确并列的两性表达；句首连接词在此承接上下文，中文不必机械译作“并且”。
- source_word: כִּי יִהְיֶה בָהֶם
  choice: 若是
  rationale: 原文直译近似“若在他们里面有”，但这是描述某人具有灵媒或通灵身份、能力或相关之灵的希伯来表达；译作“若是”使现代中文自然，同时不在正文中细分其古代观念。
- source_word: אוֹב
  choice: 灵媒
  rationale: 此处在刑法语境中指与求问死者之灵有关的人或现象。“灵媒”是现代读者易懂的称谓；脚注保留该词也可指相关之灵的词义歧义。
- source_word: יִדְּעֹנִי
  choice: 通灵者
  rationale: 该词与אוֹב并列，指借灵界获取隐秘知识的人或相关之灵。“通灵者”避免“巫师”在现代奇幻作品中的联想，并以脚注说明其他译法。
- source_word: מוֹת יוּמָתוּ
  choice: 必被处死
  rationale: 以“必”表达不定式绝对形与限定动词连用所带出的加强语气。
- source_word: בָּאֶבֶן יִרְגְּמוּ אֹתָם
  choice: 人们要用石头打死他们
  rationale: 保留原文明说的刑具“石头”；以“人们”对应原文未明说身份的复数施事者，不擅自限定为某一特定群体。
- source_word: דְּמֵיהֶם בָּם
  choice: 他们的血归在自己身上
  rationale: 保留“血”这一司法性惯用语及责任落在当事人自身的表达，不直接改写为较具解释性的“他们罪有应得”。
theological_decisions:
- issue: 如何翻译与招魂、通灵有关的两个术语
  choice: 正文译作“灵媒”和“通灵者”，并在脚注保留词义范围
  alternative: 译作“交鬼者”和“巫师”，或把אוֹב直接译为“交鬼的灵”
  rationale: 原文谴责相关行为，却没有要求译文断定这两个古代术语的精确分类，也没有完全消除“相关之灵”与“操行者”之间的词义张力。现代称谓配合脚注能兼顾可懂性与原文歧义。
- issue: “他们的血归在自己身上”的司法含义
  choice: 正文保留血的比喻，脚注说明这是归责公式
  alternative: 正文直接译为“他们应对自己的死负责”或“他们罪有应得”
  rationale: 直译保留原文庄严而凝练的法律措辞；脚注解释其功能，避免把翻译本身扩展为额外的神学判断。
- issue: 保留男女并列
  choice: 译作“男人或女人”
  alternative: 概括为“任何人”
  rationale: 原文明确提到男人和女人，译文据此保留两者，而不以中性概括取代。
translation_notes:
  register: 采用现代、庄重而清楚的法律语体。“必被处死”保留判决的强制语气；“用石头打死”比单用“石刑”更贴近原文动作，也更便于普通读者理解。正文避免使用容易带来奇幻文学联想的“巫师”，并借脚注保存古代术语的真实歧义。
