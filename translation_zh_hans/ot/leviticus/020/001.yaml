  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/001.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: zh_hans
  text: 耶和华对摩西说：
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: 说
  rationale: 该词在此引出新的神谕段落。现代汉语以“对……说”自然、准确地表达这一固定叙事公式，无须机械区分英语的 spoke 与 said。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 这是四字神名 יהוה；“耶和华”是现代简体中文圣经语境中最通行、可辨识的专名译法，保留其作为神名而非称号的功能。
- source_word: אֶל
  choice: 对
  rationale: 与言说动词连用，标明说话对象；汉语固定表达为“对摩西说”。
- source_word: מֹשֶׁה
  choice: 摩西
  rationale: 采用该人名在现代汉语中的标准译名。
- source_word: לֵאמֹר
  choice: （融入“说”）
  rationale: 该不定式是希伯来语引出直接话语的惯用成分。若另译为“说道”或“说：”，会与 וַיְדַבֵּר 在汉语中重复；以“对摩西说：”完整表达其功能。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。中文正文保留专名，并采用普通读者最熟悉且已约定俗成的“耶和华”；“雅威”较接近学界常见的推定读音，但在现代中文大众语境中的通行度较低。此处不以“主”替代神名。
translation_notes:
  register: 采用庄重、简洁而自然的现代标准汉语。“耶和华对摩西说”既保留原文公式性，也为下一节的直接话语自然铺垫。原文的 וַיְדַבֵּר 与 לֵאמֹר 不在中文中重复直译，以避免生硬的“讲话……说”。
