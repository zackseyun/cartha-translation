source:
  edition: WLC
  text: וְ/אִ֣ישׁ אֲשֶׁר יִקַּ֣ח אֶת אֲחֹת֡/וֹ בַּת אָבִ֣י/ו א֣וֹ בַת אִ֠מּ/וֹ וְ/רָאָ֨ה אֶת עֶרְוָתָ֜/הּ וְ/הִֽיא תִרְאֶ֤ה אֶת עֶרְוָת/וֹ֙ חֶ֣סֶד ה֔וּא וְ/נִ֨כְרְת֔וּ לְ/עֵינֵ֖י בְּנֵ֣י עַמָּ֑/ם עֶרְוַ֧ת אֲחֹת֛/וֹ גִּלָּ֖ה עֲוֺנ֥/וֹ יִשָּֽׂא־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/017.yaml
  text: If a man takes his sister[a], his father's daughter or his mother's daughter, and sees her nakedness, and she sees his nakedness, it is a disgrace, and they shall be cut off in the sight of the sons of their people. He has uncovered his sister's nakedness[b]; he shall bear his guilt.
translation:
  language: zh_hans
  text: 若有男人取自己的姐妹，就是自己父亲的女儿或自己母亲的女儿，并看见她的下体，她也看见他的下体，这是可耻的事[a]。他们必在本族人眼前被剪除[b]。他露了自己姐妹的下体；他必担当自己的罪责。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “可耻的事”所译的希伯来词通常表示“慈爱”或“忠诚”，但在这里罕见地带有负面意义，也可译作“羞耻的事”或“受责斥的事”。
    reason: lexical_alternative
  - marker: b
    text: “被剪除”保留了希伯来语的法律判词；本句没有明确说明这是处死、逐出群体，还是其他形式的除去。
    reason: alternative_reading
lexical_decisions:
- source_word: יִקַּח
  choice: 取
  rationale: 保留希伯来语“取”的宽泛表达；在本条性禁令中，它可能涉及娶为妻或发生性关系，不在译文中擅自限定为其中一种。
- source_word: אֲחֹתוֹ בַּת אָבִיו אוֹ בַת אִמּוֹ
  choice: 自己的姐妹，就是父亲的女儿或母亲的女儿
  rationale: 保留原文的同位说明，明确包括同父异母或同母异父的姐妹。
- source_word: וְרָאָה אֶת עֶרְוָתָהּ וְהִיא תִרְאֶה אֶת עֶרְוָתוֹ
  choice: 并看见她的下体，她也看见他的下体
  rationale: 保留原文“看见下体”的身体意象和法律委婉语，不直接改写为“发生性关系”。
- source_word: חֶסֶד
  choice: 可耻的事
  rationale: 该词在这里罕见地用于负面意义；上下文要求理解为可耻、可羞辱之事，而非其通常的“慈爱”或“忠诚”。
- source_word: וְנִכְרְתוּ
  choice: 他们必被剪除
  rationale: 保留希伯来法律判词的固定意象，同时不擅自判定具体方式是处死、驱逐还是其他除去形式。
- source_word: לְעֵינֵי בְּנֵי עַמָּם
  choice: 在本族人眼前
  rationale: 自然地表达“在他们族人的眼前”，兼顾公开性与群体归属。
- source_word: עֶרְוַת אֲחֹתוֹ גִּלָּה
  choice: 他露了自己姐妹的下体
  rationale: 保留利未记性禁令中“露下体”的反复用语及其法律语感。
- source_word: עֲוֺנוֹ יִשָּׂא
  choice: 他必担当自己的罪责
  rationale: “罪责”兼顾罪本身与随之而来的责任或后果，避免只译成刑罚而缩窄原义。
theological_decisions:
- issue: חֶסֶד在本节中的意义
  choice: 按负面义译为“可耻的事”
  alternative: 按该词通常的正面义译为“慈爱”或“忠诚”
  rationale: 本节是乱伦禁令及判罚语境，正面义在句法和语境中均不合适；负面义虽罕见，却符合此处用法。
- issue: “被剪除”的具体刑罚性质
  choice: 保留“被剪除”的法律公式，不说明执行方式
  alternative: 明确译为处死、逐出群体或断绝后代
  rationale: 原文在本句中没有界定具体执行机制；保留公式可维持文本本身的含混与法律—神学张力。
- issue: “看见下体”的指涉范围
  choice: 保留原文委婉语和身体意象
  alternative: 直接解释为“发生性关系”
  rationale: 上下文清楚表明这是性方面的禁令，但原文选择“看见下体”而非直接陈述性交；译文不将其含义过度具体化。
translation_notes:
  register: 采用现代、庄重而易懂的法律语体。“取”略带经文语感，用来保存原词在娶妻与性占有之间的宽泛性；“下体”“露了……下体”保留本章反复出现的委婉表达；“本族人”比逐字译作“他们百姓的众子”更符合现代汉语。
