  terminology: “剪除”“玷污”“圣所”“亵渎”“圣名”均适切，应保留。“摩洛”可保留为专名音译。将“献给”改为“交给”，避免在正文把“给”直接具体化为祭献；脚注说明上下文所暗示的祭献含义。
