  to: 我必亲自定意敌对那人，并把他从本族中剪除[a]，因为他把自己的一些后代交给摩洛，为要玷污我的圣所，亵渎我的圣名。
  rationale: 修订以“定意敌对那人”取代含义不稳的“向那人变脸”，表达上帝亲自、坚决反对该人的审判行动，而不假装在汉语中保留一个不通顺的身体意象。“交给”对应一般动词“给”，脚注再交代上下文的祭献指向；“为要”保留目的性。其余关键法律和礼仪术语维持不变。
