  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/אֲנִ֞י אֶתֵּ֤ן אֶת פָּנַ/י֙ בָּ/אִ֣ישׁ הַ/ה֔וּא וְ/הִכְרַתִּ֥י אֹת֖/וֹ מִ/קֶּ֣רֶב עַמּ֑/וֹ כִּ֤י מִ/זַּרְע/וֹ֙ נָתַ֣ן לַ/מֹּ֔לֶךְ לְמַ֗עַן טַמֵּא֙ אֶת מִקְדָּשִׁ֔/י וּ/לְ/חַלֵּ֖ל אֶת שֵׁ֥ם קָדְשִֽׁ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/003.yaml
  text: I myself will set my face against that man and cut him off from among his people[a], because he has given some of his offspring to Molech, so as to defile my sanctuary and to profane my holy name.
translation:
  language: zh_hans
  text: 我必亲自定意敌对那人，并把他从本族中剪除[a]，因为他把自己的一些后代交给摩洛，为要玷污我的圣所，亵渎我的圣名。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “一些后代”也可理解为他的一些儿女。原文直译为“把自己后代中的一些给了摩洛”；从上下文看，这行为指向把儿女献给摩洛的祭献。
    reason: 说明“后代”所指及מן的部分含义，并保留“给”这一原文动词与上下文所暗示的祭献意义之间的区别。
lexical_decisions:
- source_word: וַאֲנִי
  choice: 我必亲自
  rationale: 独立代词强调上帝本人采取行动；“亲自”在现代汉语中自然地传达这一强调。
- source_word: אֶתֵּן אֶת־פָּנַי בָּאִישׁ הַהוּא
  choice: 向那人变脸
  rationale: 保留希伯来语“把脸朝向/置于某人”的审判性习语，并以汉语“变脸”明确表达敌对和不悦；“那人”保留指示词和阳性单数所指。
- source_word: וְהִכְרַתִּי אֹתוֹ מִקֶּרֶב עַמּוֹ
  choice: 并把他从他的族人中剪除
  rationale: “剪除”保留 כרת 在盟约和司法语境中的固定力度，不武断限定为处死、放逐或其他具体方式；“族人中”保留群体范围。
- source_word: מִזַּרְעוֹ
  choice: 自己的后代
  rationale: זרע 在此指此人的子女或后裔；中文“后代”自然且保留原词范围。介词 מן 具有部分意义，结合“后代”这一集合名词可理解为其中一些，脚注加以说明。
- source_word: נָתַן לַמֹּלֶךְ
  choice: 献给了摩洛
  rationale: נתן 字面为“给”；在祭仪语境中“献给”既符合自然汉语，也不在正文中明确添加“献祭”或“经火”。“摩洛”按专名音译。
- source_word: לְמַעַן
  choice: 以致
  rationale: 该词可表示目的或结果；“以致”保留由行为导致玷污圣所、亵渎圣名的联系，而不强行断定行为人的主观目的。
- source_word: טַמֵּא אֶת־מִקְדָּשִׁי
  choice: 玷污我的圣所
  rationale: “玷污”准确表达祭仪上的不洁与亵渎；“圣所”是 מקדש 在祭司语境中的自然对应。
- source_word: וּלְחַלֵּל אֶת־שֵׁם קָדְשִׁי
  choice: 亵渎我的圣名
  rationale: “亵渎”自然传达 חלל 将神圣之物当作凡俗之物的严重含义；“圣名”简洁而庄重。
theological_decisions:
- issue: 献给摩洛之行为的具体性质
  choice: 正文作“把自己的后代献给了摩洛”，不直接增添“献作祭物”或“使之经火”。
  alternative: 把自己的儿女献祭给摩洛；使自己的后代经火归给摩洛。
  rationale: 上下文强烈指向以儿童为祭，但本节使用一般动词“给”。正文保留原句的词汇宽度，脚注说明语境中的祭献含义。
- issue: 上帝亲自施行审判及“向某人置脸”的习语
  choice: 译作“我必亲自向那人变脸”。
  alternative: 我要与那人敌对；我要转脸攻击那人。
  rationale: 既传达独立代词的强调，也尽量保存“脸”的原文意象和上帝主动敌对的司法含义，而不淡化为一般的不赞同。
- issue: “剪除”的具体实现方式
  choice: 保留“剪除”，不解释为处死、逐出或神圣刑罚中的某一特定方式。
  alternative: 消灭他；把他逐出族群；处死他。
  rationale: 原文未在此明确审判实现的方式；保留术语可避免消解其司法和盟约张力。
- issue: לְמַעַן 表示目的还是结果
  choice: 译作“以致”，在汉语中侧重结果而不完全排除目的关联。
  alternative: 为要；从而。
  rationale: 原词可承载目的或结果色彩；“以致”避免把玷污圣所和亵渎圣名明确说成行为人有意识追求的目的。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“亲自”突出神亲自审判；“剪除”“圣所”“圣名”保留祭司律法语境的肃穆感。正文避免使用古奥虚词，也不把献给摩洛的具体仪式方式说得超过本节原文。
