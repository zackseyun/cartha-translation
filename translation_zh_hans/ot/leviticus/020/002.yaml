source:
  edition: WLC
  text: וְ/אֶל בְּנֵ֣י יִשְׂרָאֵ֘ל תֹּאמַר֒ אִ֣ישׁ אִישׁ֩ מִ/בְּנֵ֨י יִשְׂרָאֵ֜ל וּ/מִן הַ/גֵּ֣ר הַ/גָּ֣ר בְּ/יִשְׂרָאֵ֗ל אֲשֶׁ֨ר יִתֵּ֧ן מִ/זַּרְע֛/וֹ לַ/מֹּ֖לֶךְ מ֣וֹת יוּמָ֑ת עַ֥ם הָ/אָ֖רֶץ יִרְגְּמֻ֥/הוּ בָ/אָֽבֶן־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/002.yaml
  text: 'And you shall say to the sons of Israel: Any man from the sons of Israel[a], or from the sojourner who sojourns in Israel, who gives any of his offspring to Molech shall surely be put to death[c][b]; the people of the land shall stone him with stones.'
translation:
  language: zh_hans
  text: “你要对以色列人说：无论是以色列人，还是寄居在以色列的外族人[a]，任何人若把自己的儿女[b]交给摩洛[c]，都必被处死。本地的百姓要用石头打死他。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “寄居的外族人”指住在以色列人中间的外来居民。希伯来文使用同词根的名词和动词，直译可作“寄居者，就是寄居在以色列的人”。
    reason: lexical_alternative
  - marker: b
    text: “儿女”所译的希伯来文直译为“种子”，此处指一个人的子孙或儿女。
    reason: lexical_alternative
  - marker: c
    text: “摩洛”通常被理解为一个与献儿女之礼有关的神祇或称号；也有人认为，这个词不是神名，而是指某一类祭献。
    reason: alternative_reading
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 希伯来语直译为“以色列的众子”，在现代汉语中以“以色列人”自然、准确地表达全体国民，而不造成仅指男性后裔的误解。
- source_word: אִישׁ אִישׁ
  choice: 任何人
  rationale: 名词重复构成逐一分配的惯用表达，意为“任何人”或“每一个人”；“任何人”符合现代汉语法规语体。
- source_word: הַגֵּר הַגָּר
  choice: 寄居在以色列的外族人
  rationale: גֵּר 指居住在以色列群体中的外来居民，并非短期旅客；译文保留“寄居”的概念，同时用“外族人”说明其身份。
- source_word: יִתֵּן מִזַּרְעוֹ לַמֹּלֶךְ
  choice: 把自己的后代交给摩洛
  rationale: “交给”贴近 נָתַן 的基本义，避免在正文中加入本节未明说的献祭方式；“自己的后代”表达 מִזַּרְעוֹ 的部分含义，即其后代中的任何一个。
- source_word: מוֹת יוּמָת
  choice: 都必被处死
  rationale: 不定式绝对形与限定动词连用，加强死刑判决的确定性；“必被处死”兼顾强调与司法性的被动语态。
- source_word: עַם הָאָרֶץ
  choice: 本地的百姓
  rationale: 保留“地上的民”这一群体性表达；此处指当地共同体中执行刑罚的百姓，不采用后期可能具有阶层含义的技术性解释。
- source_word: יִרְגְּמֻהוּ בָאָבֶן
  choice: 要用石头打死他
  rationale: 既明确保留行刑工具“石头”，又以现代汉语惯用说法表达“用石头投击致死”。
theological_decisions:
- issue: לַמֹּלֶךְ 所指为何
  choice: 正文音译为专名“摩洛”
  alternative: 理解为某一类称作 molek 的祭献，而非神祇名称
  rationale: 传统且直接的理解是摩洛为与献儿女之礼相关的神祇或称号；但学界也有祭献类别之说，因此正文不添加“神”或“献祭”等限定，并在脚注中保留另一种理解。
- issue: “交给摩洛”的具体行为
  choice: 不在正文中增补“用火焚烧”或“献作祭物”
  alternative: 意译为“把儿女献给摩洛为祭”
  rationale: 本节只说“交给摩洛”，虽上下文与其他经文常将此行为同献祭联系起来，翻译仍不应把本节未明说的实施方式写入正文。
translation_notes:
  register: 采用现代、庄重而易懂的法规语体。以“无论……还是……”清楚呈现适用对象，以“任何人……都必……”表达希伯来文的逐一分配和刑罚强调；避免生硬直译“以色列的众子”“用石头掷他”，同时保留原文在摩洛及相关行为性质上的解释空间。
