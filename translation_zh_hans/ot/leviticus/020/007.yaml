  text: וְ/הִ֨תְקַדִּשְׁתֶּ֔ם וִ/הְיִיתֶ֖ם קְדֹשִׁ֑ים כִּ֛י אֲנִ֥י יְהוָ֖ה אֱלֹהֵי/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/007.yaml
  text: Consecrate yourselves[a], and be holy, because I am Yahweh your God.
translation:
  language: zh_hans
  text: 你们要使自己分别为圣[a]，成为圣洁，因为我是雅威你们的上帝。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“你们要使自己成圣”。希伯来语动词为反身形式，强调以色列人要主动将自己分别为圣。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִתְקַדִּשְׁתֶּם
  choice: 你们要使自己分别为圣
  rationale: התפעל形式表达反身且主动的行动，要求以色列人将自己分别为圣；此译法也避免与下一分句较具状态意味的“成为圣洁”重复。
- source_word: וִהְיִיתֶם
  choice: 成为
  rationale: 此处的完成式接续前一命令，在语境中具有命令性的连续作用；译作“成为”自然地保留并列推进。
- source_word: קְדֹשִׁים
  choice: 圣洁
  rationale: 在利未记的盟约和伦理语境中，“圣洁”保留了该词在归属、分别和品格方面的神学分量。
- source_word: כִּי
  choice: 因为
  rationale: 引出命令的根据，现代汉语用“因为”能清楚表达因果关系。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文直接音译四字神名，保留其作为以色列上帝之立约名字的性质，而不以称号代替。
- source_word: אֱלֹהֵיכֶם
  choice: 你们的上帝
  rationale: אֱלֹהִים虽为复数形态，此处带第二人称复数后缀，并在上下文中明确指以色列独一的上帝，故采用单数含义。
theological_decisions:
- issue: 如何翻译神名יְהוָה
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文使用四字神名。译作“雅威”直接呈现专名，并避免用“主”这一称号取代原文的名字。
- issue: 人的自我分别为圣与圣洁状态的关系
  choice: 保留“使自己分别为圣”与“成为圣洁”两个相连而不等同的命令
  alternative: 合并为“你们要圣洁”
  rationale: 原文先用反身动词要求主动自洁或自我奉献，随后用系词加形容词表达成为圣洁；分译可保留两者的张力，不把人的回应与圣洁状态混为一谈。
translation_notes:
  register: 采用庄重而易懂的现代标准普通话。“分别为圣”是现代中文圣经语域中较为熟悉且能传达反身行动的表达；“成为圣洁”与前句形成清楚区分。
