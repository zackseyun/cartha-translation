id: LEV.20.8
reference: Leviticus 20:8
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וּ/שְׁמַרְתֶּם֙ אֶת חֻקֹּתַ֔/י וַ/עֲשִׂיתֶ֖ם אֹתָ֑/ם אֲנִ֥י יְהוָ֖ה מְקַדִּשְׁ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/008.yaml
  text: You shall keep my statutes and do them. I am Yahweh[a], who sanctifies you.
translation:
  language: zh_hans
  text: 你们要遵守我的律例，实行它们。我是使你们成圣的雅威。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“使你们成为圣洁。”
    reason: 说明מְקַדִּשְׁכֶם也可用较通俗的方式表达，而不改变其使役意义。
lexical_decisions:
- source_word: וּשְׁמַרְתֶּם
  choice: 你们要遵守
  rationale: שׁמר在律法语境中表示“谨守、遵守”；“要遵守”自然表达复数对象所承担的命令和责任。句首连接词וּ以中文句间衔接自然体现，不机械译作“并且”。
- source_word: חֻקֹּתַי
  choice: 我的律例
  rationale: חֻקָּה指规定、法令；“律例”保留妥拉法律语境中的专门色彩，并符合现代中文圣经语体。
- source_word: וַעֲשִׂיתֶם אֹתָם
  choice: 实行它们
  rationale: עשה与律法条文连用，指付诸实行。“实行”比直译“做它们”更符合现代汉语，同时保留从遵守到实际履行的含义；“它们”明确回指复数的“律例”。
- source_word: יְהוָה
  choice: 雅威
  rationale: 原文直接使用四字神名；采用现代中文常见音译“雅威”，保留其作为专名的性质，不以称号代替。
- source_word: מְקַדִּשְׁכֶם
  choice: 使你们成圣
  rationale: קדשׁ的使役分词表示雅威持续或具有特征性的行动。“使你们成圣”既保留圣洁词汇的神学关联，也清楚表达是雅威使其子民成为圣洁。
theological_decisions:
- issue: 四字神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文使用神的专名而非称号。“雅威”较直接地音译该名，避免用“上主”等称号替换；“耶和华”虽有悠久中文传统，但较不贴近通常重建的读音。
- issue: מְקַדִּשְׁכֶם所表达的成圣行动
  choice: 使你们成圣
  alternative: 使你们成为圣洁；把你们分别为圣
  rationale: 使役分词把以色列的遵行建立在雅威使他们成圣的行动上。“成圣”保留全书关键的圣洁术语，也不把含义缩减为单纯的道德改善；脚注提供更通俗的等值表达。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“遵守—实行”呈现听从律例并付诸行动的递进；“成圣”保留利未记核心的圣洁用语。
