base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/009.yaml
  text: For any man who curses his father or his mother shall surely be put to death[a]; he has cursed his father and his mother[c][b]; his blood is on him.
translation:
  language: zh_hans
  text: 凡咒骂父亲或母亲的人，必须被处死[a]。他咒骂了父亲和母亲[b]；他的血归到他自己身上[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“必定被处死”，用重复词根的结构加强语气。
    reason: source_form
  - marker: b
    text: 希伯来文是“父亲和母亲”；首句译作“或”，是要表明咒骂父母任何一方都要受此刑罚。
    reason: lexical_alternative
  - marker: c
    text: 也可译作“他的血债在自己身上”。这是说，他要为自己的死承担责任。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 凡……的
  rationale: 此处引出适用于任何人的法律情形；与后面的分配性表达结合，译成“凡……的”比单独译“因为”或“如果”更自然。
- source_word: אִישׁ אִישׁ
  choice: 凡……的
  rationale: 名词重叠构成分配性习语，意思是“任何人、无论谁”。中文以“凡……的”准确表达普遍适用的法律范围，无须机械重复“人”。
- source_word: יְקַלֵּל / קִלֵּל
  choice: 咒骂／咒骂了
  rationale: 该词在此指向父母发出咒诅、恶言辱骂；“咒骂”兼顾“咒诅”与辱骂的语义，也符合现代中文法律告诫的语体。
- source_word: אָבִיו וְאֶת אִמּוֹ
  choice: 父亲或母亲
  rationale: 希伯来文形式为“父亲和母亲”，但法律上的分配意义是咒骂任何一方即构成此罪；中文用“或”可避免误解为必须同时咒骂双亲。脚注保留原文连接形式。
- source_word: מוֹת יוּמָת
  choice: 必须处死
  rationale: 不定式绝对形与限定动词连用，加强死刑判决；“必须处死”保留强调和司法被动含义，且现代中文简洁庄重。
- source_word: דָּמָיו בּוֹ
  choice: 他的血归到自己身上
  rationale: 这是司法责任公式，表示其死亡责任由自己承担。译文保留“血”的原文意象，同时避免把它过度解释为后来的教义概念。
theological_decisions:
- issue: אִישׁ אִישׁ 的阳性分配表达
  choice: 凡……的
  alternative: 任何男人／无论谁
  rationale: 希伯来文使用阳性名词，但在此法律条文中具有代表性和普遍适用性。现代中文“凡……的”既不添加原文没有的性别限定，也准确传达分配意义。
- issue: 父亲与母亲之间连接词的法律含义
  choice: 父亲或母亲
  alternative: 父亲和母亲
  rationale: 原文用“和”，但惩罚显然适用于咒骂父母任何一方。“或”使中文读者准确理解法律效力；脚注注明原文形式，以保留文本张力。
- issue: דָּמָיו בּוֹ 的责任公式
  choice: 他的血归到自己身上
  alternative: 他要担当流血的罪／他的血债在他身上
  rationale: 选择保留原文“血”的隐喻，并表达犯人对所受死刑负有责任；不把短语限定为某种特定的赎罪论或形而上罪责观。
translation_notes:
  register: 采用现代、庄重而清楚的法律语体。“必须处死”传达原文强调式死刑判决；“他的血归到自己身上”保留希伯来语司法公式的具体意象。所有脚注标记均置于相关正文之后。
