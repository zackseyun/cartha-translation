  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וָ/אֹמַ֣ר לָ/כֶ֗ם אַתֶּם֮ תִּֽירְשׁ֣וּ אֶת אַדְמָתָ/ם֒ וַ/אֲנִ֞י אֶתְּנֶ֤/נָּה לָ/כֶם֙ לָ/רֶ֣שֶׁת אֹתָ֔/הּ אֶ֛רֶץ זָבַ֥ת חָלָ֖ב וּ/דְבָ֑שׁ אֲנִי֙ יְהוָ֣ה אֱלֹֽהֵי/כֶ֔ם אֲשֶׁר הִבְדַּ֥לְתִּי אֶתְ/כֶ֖ם מִן הָֽ/עַמִּֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/024.yaml
  text: But I said to you[a], ‘You shall possess their land, and I myself will give it to you to possess’—a land flowing with milk and honey. I am Yahweh your God[d][c][b], who has separated you from the peoples.
translation:
  language: zh_hans
  text: 但我曾对你们说：“你们必承受他们的土地；我亲自要把这地赐给你们，作你们的产业[a]。”这是一块流奶与蜜之地[b]。我是耶和华——你们的上帝；我已把你们从万民中分别出来[d]。[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “承受……作产业”也可译作“占有”。这里前后所用的希伯来语动词，都可指承受产业，也可指取得并占有。
    reason: lexical_alternative
  - marker: b
    text: “流奶与蜜”是希伯来语表达，形容土地丰饶、物产充足。
    reason: cultural_note
  - marker: c
    text: “耶和华”对应希伯来文神名 YHWH；传统上也常以“上主”这一称号代替。
    reason: alternative_reading
  - marker: d
    text: “分别出来”也可译作“使……有别”或“使……与……分开”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמַר
  choice: 但我曾对你们说
  rationale: וַ 推进叙事，但本句与前文对列国受审判的陈述形成转折；“但”自然体现语境关系，“曾说”指向上文已经宣告的应许。
- source_word: תִּירְשׁוּ ... לָרֶשֶׁת אֹתָהּ
  choice: 必得……让你们得为产业
  rationale: ירשׁ兼有承受产业、取得并占有土地的含义。前后采用“得”和“得为产业”，既保留词根呼应，也避免中文生硬重复。
- source_word: אַדְמָתָם
  choice: 他们的土地
  rationale: אדמה本指土地、土壤，在此为领土语境，译作“土地”最贴切。
- source_word: וַאֲנִי
  choice: 我要亲自
  rationale: 独立人称代词 אֲנִי 带有强调作用，“亲自”在中文中清楚保留这一强调。
- source_word: אֶתְּנֶנָּה
  choice: 把这地赐给你们
  rationale: נתן在应许语境中表示上帝赐予；宾语后缀所指为土地，中文明确译出“这地”更自然。
- source_word: אֶרֶץ זָבַת חָלָב וּדְבָשׁ
  choice: 一片流奶与蜜之地
  rationale: 保留希伯来语惯用意象，不在正文中展开解释其丰饶含义。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经传统中最通行、读者最易识别的四字神名音译，并以脚注说明其对应希伯来文 YHWH。
- source_word: הִבְדַּלְתִּי
  choice: 把你们……分别出来
  rationale: בדל表示分开、区别或分别出来；此译保留本章关于区分与圣洁的主题，又不额外加入后期教义术语。
- source_word: הָעַמִּים
  choice: 万民
  rationale: עמים指多个民族或民群；“万民”是自然而庄重的现代中文概括，不强加现代政治国家的含义。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威；上主
  rationale: 原文直接使用四字神名。正文采用中文读者最熟悉的专名形式“耶和华”，不以称号替代；脚注交代其希伯来文形式及传统替代译法。
- issue: 以色列与万民的分别
  choice: 是我把你们从万民中分别出来
  alternative: 是我使你们与万民有别；是我把你们从万民中分别为圣
  rationale: 原文只陈述上帝将他们分别出来，并未在此动词中明说“为圣”；因此不把目的补入正文，以保留原文范围。
- issue: 土地的取得既是承受产业又是占有
  choice: 得……得为产业
  alternative: 占有……占有；承受……承受为业
  rationale: ירשׁ本身兼具继承与取得占有的语义。正文用自然中文表达产业维度，脚注保留“占有”的可能，避免单方面消除词义张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话书面语。“一片流奶与蜜之地”保留经文意象；“得为产业”略具圣经语体，但在脚注中说明其兼有取得、占有之义。所有脚注标记均紧随相关正文内容。
