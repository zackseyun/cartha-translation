  text: וְ/אִ֗ישׁ אֲשֶׁ֨ר יִשְׁכַּ֤ב אֶת זָכָר֙ מִשְׁכְּבֵ֣י אִשָּׁ֔ה תּוֹעֵבָ֥ה עָשׂ֖וּ שְׁנֵי/הֶ֑ם מ֥וֹת יוּמָ֖תוּ דְּמֵי/הֶ֥ם בָּֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/013.yaml
  text: If a man lies with a male as one lies with a woman[a], both of them have done an abomination; they shall surely be put to death[b]; their blood is on them.
translation:
  language: zh_hans
  text: 男人若与男性同寝，如同与女人同寝一样[a]，他们二人都行了可憎之事。他们必被处死；他们流血的罪归在自己身上[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“如同与女人的诸般寝卧”，是指与女人性交的惯用语。
    reason: lexical_alternative
  - marker: b
    text: 直译为“他们的血在他们身上”；这是表示他们须自行承担死亡责任的法律惯语。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ אֲשֶׁר
  choice: 人若
  rationale: 这是律法中的条件句式；译作“人若”既自然，也保留“若有人”的法律表达。
- source_word: יִשְׁכַּב אֶת זָכָר
  choice: 与男性同寝
  rationale: שׁכב在此是指性交的惯用表达；“同寝”保留原文意象而不过度直白。זָכָר译作“男性”，以区别前面的אִישׁ“人／男人”。
- source_word: מִשְׁכְּבֵי אִשָּׁה
  choice: 像与女人同寝一样
  rationale: 原文直译为“女人的诸般寝卧”，是指与女人性交的希伯来语惯用语；正文采用自然中文，并以脚注说明字面形式。
- source_word: תּוֹעֵבָה
  choice: 可憎之事
  rationale: 该词是分量很重的道德与盟约用语；“可憎之事”在现代中文中庄重、清楚，并保留原文的严厉评价。
- source_word: עָשׂוּ שְׁנֵיהֶם
  choice: 他们二人都行了
  rationale: 明确保留原文对双方的强调，不增添有关动机或身份的解释。
- source_word: מוֹת יוּמָתוּ
  choice: 他们必被处死
  rationale: 原文以不定词绝对式加强被动动词，表示确定而强调的死刑判决；“必被处死”同时传达强调和被动语态。
- source_word: דְּמֵיהֶם בָּם
  choice: 他们的血归到自己身上
  rationale: 保留“血”这一原文法律—道德意象，表达他们自行承担死亡责任；脚注提示也可按其含义理解为“流血之罪归在他们身上”。
theological_decisions:
- issue: 如何翻译具有当代争议性的律法禁令
  choice: 按照希伯来文，以行为为中心直译，不改写成现代身份类别。
  alternative: 译作“同性恋行为”，或采用现代性取向、身份方面的术语。
  rationale: 原文规定的是一个具体行为，并未使用现代身份范畴；译文既不淡化，也不扩大原文所说的内容。
- issue: אִישׁ与זָכָר的性别词语区别
  choice: 分别体现为“人”和“男性”。
  alternative: 两处都译作“男人”，或将其中一处改为性别中性用语。
  rationale: 希伯来文刻意使用两个不同词语；中文保留这一词汇区别，同时使句子自然。
- issue: דְּמֵיהֶם בָּם的法律与神学含义
  choice: 正文保留“他们的血归到自己身上”的原文意象。
  alternative: 直接解释为“他们流血的罪由自己承担”或“他们罪有应得”。
  rationale: 原句既涉及血，也表达责任归属；保留意象可避免把含义过早限定为单一解释，脚注则说明另一种可能的理解。
translation_notes:
  register: 采用现代、庄重且易懂的律法文体。“同寝”承接希伯来文的寝卧意象；“可憎之事”“必被处死”保留原文的严肃力度。标点将行为评断与刑罚判决分开，使中文层次清楚。
