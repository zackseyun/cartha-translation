source:
  edition: WLC
  text: וְ/לֹ֤א תֵֽלְכוּ֙ בְּ/חֻקֹּ֣ת הַ/גּ֔וֹי אֲשֶׁר אֲנִ֥י מְשַׁלֵּ֖חַ מִ/פְּנֵי/כֶ֑ם כִּ֤י אֶת כָּל אֵ֨לֶּה֙ עָשׂ֔וּ וָ/אָקֻ֖ץ בָּֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/023.yaml
  text: And you shall not walk in the statutes of the nation that I am driving out before you[a], because they did all these things[c][b], and I loathed them.
translation:
  language: zh_hans
  text: 你们不可遵循我正从你们面前赶走的那个民族[b]的规例[a]，因为他们做了这一切事，我便厌恶他们[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “规例”也可译作“习俗”；希伯来语可指规定下来的做法或固定条例。
    reason: lexical_alternative
  - marker: b
    text: “赶走”直译为“从你们面前遣走”，在这里指驱逐出去。
    reason: lexical_alternative
  - marker: c
    text: “厌恶”也可译作“憎恶”。
    reason: lexical_alternative
lexical_decisions:
- source_word: תֵלְכוּ
  choice: 遵循
  rationale: הלך本义为“行走”，在此与规例连用，表达按某种规范行事。现代汉语用“遵循”自然清楚，也保留行为方式的含义。
- source_word: בְּחֻקֹּת
  choice: 规例
  rationale: חֻקּוֹת可指固定的规定、惯例或制度化做法；“规例”兼顾其规范性和既定性，脚注补充“习俗”这一语境上可行的译法。
- source_word: הַגּוֹי
  choice: 那个民族
  rationale: גּוֹי在此为单数，集合性地指即将被逐出的迦南居民；“那个民族”保留单数，又避免“外邦人”等后期神学色彩。
- source_word: מְשַׁלֵּחַ מִפְּנֵיכֶם
  choice: 正从你们面前赶走
  rationale: שׁלח字面可指“遣走”，与מִפְּנֵיכֶם连用时语境含义是驱逐、移除；“赶走”准确表达夺地背景中的动作。分词译为“正……”，体现行动正在展开或即将施行。
- source_word: כִּי אֶת כָּל אֵלֶּה עָשׂוּ
  choice: 因为他们做了这一切事
  rationale: כִּי在此说明原因；“这一切事”回指上文列举的禁行之事，不额外解释其具体范围。
- source_word: וָאָקֻץ בָּם
  choice: 我便厌恶他们
  rationale: קוץ表达强烈的反感或憎恶；“厌恶”在现代汉语中庄重而有力度。בם按其语法形式译作对象“他们”，不改写为只厌恶其行为。
theological_decisions:
- issue: 如何表达上帝的强烈厌恶而不削弱或扩大神人同形式语言
  choice: 我便厌恶他们
  alternative: 我便憎恶他们／我就对他们深感厌恶
  rationale: 原文以强烈情感词描述上帝对该民族及其所行之事的道德反感。“厌恶”保留这种力度，同时不把经文扩展为超出原文的系统神学陈述。
- issue: 厌恶的对象是人还是行为
  choice: 保留“他们”为直接对象
  alternative: 我便厌恶他们所做的事
  rationale: בם的自然指向是前述民族中的人。虽然原因是“他们做了这一切事”，译文仍按原文保留对人的代词，不把对象静默改为行为，从而保留经文的张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“遵循……规例”避免生硬照搬“行在……中”的希伯来语习语；“那个民族”保留原文单数集合名词；句末“我便厌恶他们”维持原文强烈而简洁的语气。
