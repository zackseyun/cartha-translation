  text: וְ/אִשָּׁ֗ה אֲשֶׁ֨ר תִּקְרַ֤ב אֶל כָּל בְּהֵמָה֙ לְ/רִבְעָ֣ה אֹתָ֔/הּ וְ/הָרַגְתָּ֥ אֶת הָ/אִשָּׁ֖ה וְ/אֶת הַ/בְּהֵמָ֑ה מ֥וֹת יוּמָ֖תוּ דְּמֵי/הֶ֥ם בָּֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/016.yaml
  text: If a woman approaches any animal to mate with it[a], you shall kill the woman and the animal. They shall surely be put to death[b]; their blood is on them.
translation:
  language: zh_hans
  text: 女人若走近任何动物，为要与它交合[a]，你就要杀死那女人和那动物。二者都必须被处死；二者的血归在自己身上[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“让它骑跨自己。”希伯来语动词在此指人与动物的性交，字面上带有骑跨的具体意象。
    reason: lexical_alternative
  - marker: b
    text: 直译：“二者的血在自己身上。”这是法律惯用语，表示其死亡的责任归在二者自身。
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּקְרַב
  choice: 走近
  rationale: קרב的基本意思是“靠近、走近”。保留具体动作，并由后面的目的短语说明其性行为意图，避免把该动词本身过度译成“发生性关系”。
- source_word: כָּל בְּהֵמָה
  choice: 任何动物
  rationale: בְּהֵמָה在这里泛指兽类；כָּל赋予不定、广泛的范围。“任何动物”是清楚自然的现代汉语，也不把范围不必要地缩窄为家畜。
- source_word: לְרִבְעָה אֹתָהּ
  choice: 要让它与自己交合
  rationale: רבע在此明确指动物与人的性交，且希伯来语结构以女人为动作所及者，含动物骑跨她的具体意象。“让它与自己交合”清楚表达行为及方向，又避免生硬地照译骑跨动作。
- source_word: וְהָרַגְתָּ
  choice: 你就要杀死
  rationale: 该法律语境中的动词具有命令效力；“你就要”既保留第二人称单数形式，也自然表达随条件而来的法律处置。
- source_word: מוֹת יוּמָתוּ
  choice: 二者都必须被处死
  rationale: 不定式绝对形与限定动词连用，强化死刑判决。“必须”传达其确定和强制性；“二者都”明确复数同时指女人和动物。
- source_word: דְּמֵיהֶם בָּם
  choice: 它们丧命的责任在自己
  rationale: 这是归定死亡责任的法律惯用语。如此译法以自然现代汉语传达其含义，同时脚注保留较贴近字面的“它们的血归在自己身上”。
theological_decisions:
- issue: 如何表述涉及人与动物性交的严厉刑法条文
  choice: 直接译明行为和死刑判决，不以含混委婉语弱化原文
  alternative: 采用“同寝”等较含蓄但对现代读者可能不够明确的说法
  rationale: 原文是明确的法律禁令及刑罚规定。译文应忠实保留其严肃性、清晰度和重复强调，不添加经文之外的伦理评论。
- issue: 动物在性行为中的语法角色
  choice: 译作“让它与自己交合”，保留女人主动接近并使动物参与、女人为动作所及者的结构
  alternative: 笼统译作“与动物交合”，不体现原文的方向性
  rationale: 原文אֹתָהּ指向女人，רבע的具体意象涉及动物骑跨她。主文采用自然表达，脚注交代更直译的可能。
- issue: 血的惯用语所表达的责任
  choice: 在正文中明确为“丧命的责任在自己”
  alternative: 逐字译作“它们的血归在自己身上”
  rationale: 该惯用语表明受刑者自己承担死亡责任，而非另加一种刑罚或教义判断；脚注保留原文意象和另一译法。
translation_notes:
  register: 采用庄重、直接而易懂的现代法律语体。“交合”准确而不粗俗；保留第二人称单数“你”和连续两次死刑表述，以反映希伯来文的句法及强调。脚注标记[a]、[b]均已置于正文对应位置。
