source:
  edition: WLC
  text: וְ֠/אִישׁ אֲשֶׁר יִשְׁכַּ֨ב אֶת אִשָּׁ֜ה דָּוָ֗ה וְ/גִלָּ֤ה אֶת עֶרְוָתָ/הּ֙ אֶת מְקֹרָ֣/הּ הֶֽעֱרָ֔ה וְ/הִ֕יא גִּלְּתָ֖ה אֶת מְק֣וֹר דָּמֶ֑י/הָ וְ/נִכְרְת֥וּ שְׁנֵי/הֶ֖ם מִ/קֶּ֥רֶב עַמָּֽ/ם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/018.yaml
  text: If a man lies with a woman during her menstrual impurity and uncovers her nakedness—he has laid bare her flow[c][b][a], and she has uncovered the flow of her blood—both of them shall be cut off from among their people.
translation:
  language: zh_hans
  text: 男人若在女人月经不洁时[a]与她同寝，揭露她的下体——他揭露了她的源头[b]，她也揭露了自己血的源头——二人都要从他们的民中被剪除[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“在她来月经时”。这里的希伯来语也包含利未记所说与月经有关的礼仪不洁。
    reason: lexical_alternative
  - marker: b
    text: “源头”直译为“源头”或“泉源”，在这里是对身体流血源头的委婉说法；下句直译为“她揭露了自己血的源头”。
    reason: lexical_alternative
  - marker: c
    text: “被剪除”是摩西五经中常见的法律用语；本节没有说明这种除去以何种方式执行。
    reason: alternative_reading
lexical_decisions:
- source_word: אִישׁ
  choice: 男人
  rationale: 保留阳性单数法律表述；本条明确论及性行为中的男性一方。
- source_word: יִשְׁכַּב אֶת אִשָּׁה
  choice: 与她同寝
  rationale: 这是希伯来语表示性交的惯用语；“同寝”在现代中文中庄重、清楚，又保留原文的委婉法律措辞。
- source_word: דָּוָה
  choice: 月经不洁期间
  rationale: 该词在利未记语境中不仅指正在行经，也指与月经相连的礼仪不洁状态。
- source_word: גִלָּה אֶת עֶרְוָתָהּ
  choice: 露了她的下体
  rationale: 保留利未记中反复使用的性禁令惯用语，同时用现代中文可理解的表达呈现。
- source_word: מְקֹרָהּ הֶעֱרָה
  choice: 他使她的源处裸露
  rationale: מָקוֹר本义为“源头、泉源”，此处委婉指身体流血的源处；正文保留原文意象，脚注加以说明。
- source_word: וְהִיא גִּלְּתָה אֶת מְקוֹר דָּמֶיהָ
  choice: 她也显露了自己血的源头
  rationale: 保留女人作为并列参与者的语法结构，并较直译地呈现“她血的源头”。
- source_word: וְנִכְרְתוּ
  choice: 都要……被剪除
  rationale: 保留摩西五经中常见的盟约性法律套语，不擅自确定其实施方式。
- source_word: מִקֶּרֶב עַמָּם
  choice: 从本族中
  rationale: 自然表达“从他们人民中间”，保留群体归属和被移除的含义。
theological_decisions:
- issue: דָּוָה所指状态的性质
  choice: 译作“月经不洁期间”，兼顾行经事实和礼仪不洁状态。
  alternative: “正在来月经时”或“患病／不洁时”
  rationale: 利未记的法律语境明确涉及月经所带来的礼仪不洁，并非泛指疾病；正文不把这种礼仪范畴扩展为道德定罪。
- issue: “被剪除”刑罚的具体性质
  choice: 保留“从本族中被剪除”的公式，不说明执行机制。
  alternative: 处死、逐出群体或绝后
  rationale: 本节希伯来文没有具体说明“剪除”如何实现；保留其含混性，避免把有争议的法律或神学解释写入正文。
- issue: 女人在平行分句中的角色
  choice: 保留“她也显露了”这一主动表述。
  alternative: 改为纯被动描述，以弱化女人的语法参与
  rationale: 原文明确以וְהִיא及主动动词构成与男性行为相应的分句；译文不消除这种法律上的平行结构。
translation_notes:
  register: 采用庄重而可懂的现代标准汉语。“同寝”“露了她的下体”“被剪除”保留利未记法律文本的惯用表达；“源处”刻意保留希伯来文的身体意象和委婉性，并以脚注避免误解。
