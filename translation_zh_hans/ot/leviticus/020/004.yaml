base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/004.yaml
  text: But if the people of the land deliberately close their eyes to that man when he gives some of his offspring to Molech[a], so as not to put him to death[c][b],
translation:
  language: zh_hans
  text: 但当地民众若在那人把自己的一些儿女献给摩洛[a]时，故意对他视而不见，而不把他处死，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “摩洛”可能指某个神祇，也可能指一种献儿女为祭的仪式；另有人将此词理解为“王”。
    reason: alternative_reading
lexical_decisions:
- source_word: הַעְלֵם יַעְלִימוּ
  choice: 故意……视而不见
  rationale: 不定式绝对式与限定动词连用，强化“隐藏眼目”的动作；结合上下文，这是明知而故意不理会。“视而不见”既保留眼目的意象，又以自然现代汉语表达其惯用义。
- source_word: עַם הָאָרֶץ
  choice: 当地民众
  rationale: 在本法律语境中指当地共同体的民众，并非特指某个社会阶层；“当地民众”比逐字译作“地上的民”更自然清楚。
- source_word: אֶת עֵינֵיהֶם מִן הָאִישׁ הַהוּא
  choice: 对那人视而不见
  rationale: 希伯来语字面为“把他们的眼目从那人隐藏起来”，是拒绝注意或处置他的惯用表达；汉语“对……视而不见”准确保留其形象和含义。
- source_word: בְּתִתּוֹ מִזַּרְעוֹ
  choice: 任由他把自己的儿女献出
  rationale: מִן 在此为部分用法，表示从其后裔中献出一些；זֶרַע 字面为“种子”，此处指儿女。“任由”在句法上体现民众明知而不干预，并不改变“他献出”的施事关系。
- source_word: לַמֹּלֶךְ
  choice: 给摩洛
  rationale: 本段祭祀语境支持将该词作为受献对象的名称或称号音译为“摩洛”；不以解释性意译预先断定其确切性质。
- source_word: לְבִלְתִּי הָמִית אֹתוֹ
  choice: 不把他处死
  rationale: 该结构表达民众视而不见所导致或意在达到的结果，即不执行规定的死刑；“处死”符合汉语法律语体。
theological_decisions:
- issue: 祭祀受献对象 לַמֹּלֶךְ 的理解
  choice: 摩洛
  alternative: 王／那王
  rationale: 辅音形式理论上可与“王”相关，但利未记18:21和20:2–5的祭祀语境更支持将其视为受献对象的专名或称号。采用音译可保留其身份究竟是神祇还是祭仪称谓的张力，而不强行解释。
translation_notes:
  register: 采用现代、庄重而易懂的法律叙事语体。“视而不见”保留希伯来语“隐藏眼目”的意象；“当地民众”避免“地上的民”在现代汉语中的歧义。本节句末逗号保留其与下一节主句相连的未完结构。
