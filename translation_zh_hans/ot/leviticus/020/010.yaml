    rationale: 该词在本法律语境指“他的邻舍／同伴”，即共同体中的另一人，并不要求国籍或民族意义上的同胞。应以“邻舍”保留其通常且较宽的含义；脚注亦应一致。
  - severity: low
    issue: “就是”略偏解释性口语。
    rationale: 原文的重复具有法律式澄清与强调作用；“即”可自然呈现这种同位重述，而不增加解释色彩。
