  text: וְ/אִ֗ישׁ אֲשֶׁ֤ר יִנְאַף֙ אֶת אֵ֣שֶׁת אִ֔ישׁ אֲשֶׁ֥ר יִנְאַ֖ף אֶת אֵ֣שֶׁת רֵעֵ֑/הוּ מֽוֹת יוּמַ֥ת הַ/נֹּאֵ֖ף וְ/הַ/נֹּאָֽפֶת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/010.yaml
  text: If a man commits adultery with another man's wife—if he commits adultery with his neighbor's wife—the adulterer and the adulteress shall surely be put to death[a].
translation:
  language: zh_hans
  text: 人若与别人的妻子通奸，即与邻舍的妻子通奸，通奸的男女二人都必被处死。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“与一个男人的妻子……与他邻舍的妻子”。这里的重复是法律文体中的强调和进一步说明。
    reason: 说明原文措辞及重复结构
lexical_decisions:
- source_word: וְאִישׁ אֲשֶׁר
  choice: 人若
  rationale: 希伯来语以连接词、名词和关系词引入案例法条件；现代汉语法律表述用“人若”简洁自然，并保留条件结构。
- source_word: יִנְאַף
  choice: 通奸
  rationale: נאף特指与已有婚姻关系者发生奸淫，不泛指一切淫乱；“通奸”准确而清楚。
- source_word: אֶת אֵשֶׁת אִישׁ
  choice: 与别人的妻子
  rationale: 字面为“与一个男人的妻子”；“别人的妻子”自然表达她是另一名男子之妻。
- source_word: אֵשֶׁת רֵעֵהוּ
  choice: 同胞的妻子
  rationale: רֵעַ在此指共同体中的同伴或同胞，不限于住在附近的人；“同胞”比现代汉语的“邻舍”更易懂，也避免误解为仅指邻居。
- source_word: מוֹת יוּמַת
  choice: 必被处死
  rationale: 不定式绝对形与限定动词连用，加强被处死的确定性；“必被处死”保留强调和法律语体，且不增添本节未说明的执行方式。
- source_word: הַנֹּאֵף וְהַנֹּאָפֶת
  choice: 通奸的男人和女人
  rationale: 原文分别使用阳性和阴性分词，明确指出男女双方；此译法对称、清楚，并避免现代汉语中较生僻或带强烈标签色彩的名词。
theological_decisions:
- issue: 法律条文中的性别表达
  choice: 保留“男人和女人”，明确双方均受同一刑罚。
  alternative: 译作“通奸的双方”。
  rationale: 原文明确区分阳性与阴性犯罪者；直陈男女双方既忠实于语法，也不将其泛化。
- issue: 死刑公式的范围
  choice: 译作“必被处死”，不说明处死方式。
  alternative: 译作“必须处决”或补明具体执行方式。
  rationale: 原文以加强结构确定刑罚，却未在本节规定执行方式；译文不从其他经文或传统补入细节。
- issue: 重复陈述罪行
  choice: 保留“就是与同胞的妻子通奸”的重述。
  alternative: 合并为“人若与同胞的妻子通奸”。
  rationale: 原文先说“一个男人的妻子”，再以“同胞的妻子”重述并明确罪行；保留重复可呈现法律文体的强调，不把它视为可删赘语。
translation_notes:
  register: 采用现代、庄重而易懂的法律语体。“同胞”表达共同体成员之意；“必被处死”保留原文强调，不增添刑罚执行方式。脚注标记置于完整刑罚句之后。
