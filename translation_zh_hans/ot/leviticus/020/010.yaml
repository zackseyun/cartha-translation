  source_fidelity: 译文总体准确保留了案件式条件、罪行的重复陈述、男女双方及未说明方式的死刑处罚。惟“同胞”通常指同一国籍或民族的人，较希伯来语 רֵעֵהוּ（他的邻舍／同伴、共同体中的人）狭窄，且脚注不宜将该词径译为“同胞”。
  naturalness: “人若……，就是……”可懂，但在现代庄重的法律式汉语中，“即……”更凝练自然。“通奸的男人和女人都必被处死”清楚；改为“通奸的男女二人都必被处死”可保留男女明示并使指称更顺畅。
  terminology: “通奸”恰当对应 נאף；“必被处死”恰当传达 מות יומת 的加强被动形式，且没有擅自指定执行方式。“邻舍”是此处 רֵעַ 的传统且准确的现代书面语对应，避免“同胞”的国族含义。
  issues:
