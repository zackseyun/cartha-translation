revisions:
- from: 人若与别人的妻子通奸，就是与同胞的妻子通奸，通奸的男人和女人都必被处死。[a]
  to: 人若与别人的妻子通奸，即与邻舍的妻子通奸，通奸的男女二人都必被处死。[a]
  rationale: 将“同胞”改为“邻舍”，以免将 רֵעֵהוּ 限定为国族意义的同胞，并同步校正脚注。以“即”表达原文对同一罪行的重复澄清；其余措辞保留原有的源文忠实性、法律语体和刑罚范围。
