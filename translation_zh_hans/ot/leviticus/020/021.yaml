  text: וְ/אִ֗ישׁ אֲשֶׁ֥ר יִקַּ֛ח אֶת אֵ֥שֶׁת אָחִ֖י/ו נִדָּ֣ה הִ֑וא עֶרְוַ֥ת אָחִ֛י/ו גִּלָּ֖ה עֲרִירִ֥ים יִהְיֽוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/021.yaml
  text: And if a man takes his brother’s wife[a], it is uncleanness; he has uncovered his brother’s nakedness[b]. They shall be childless.
translation:
  language: zh_hans
  text: 人若娶了兄弟的妻子，这就是污秽[a]；他揭露了兄弟的下体。他们必没有儿女[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “污秽”所译的希伯来词也可译作“不洁净”或“玷污”；这个词可表示礼仪和道德层面的不洁。
    reason: lexical_alternative
  - marker: b
    text: 或译：“他们必无儿无女而死。”希伯来文直译是“他们必没有儿女”，并没有说明这一判罚将如何实现。
    reason: alternative_reading
lexical_decisions:
- source_word: וְאִישׁ אֲשֶׁר
  choice: 人若
  rationale: 这是法律条文中的条件性关系从句；译作“人若”简洁自然，也保留个案法规的语气。句首连接词在中文中无须机械译出。
- source_word: יִקַּח אֶת אֵשֶׁת אָחִיו
  choice: 娶了兄弟的妻子
  rationale: לקח本义为“取”，用于婚姻或男女结合的语境时可表达“娶”。“娶了”在现代汉语中自然，但不额外限定具体婚礼程序；“兄弟”保留אָח可指哥哥或弟弟的宽泛含义。
- source_word: נִדָּה הִוא
  choice: 这就是污秽
  rationale: נִדָּה可指礼仪或道德层面的不洁、污秽。以“这”指前述行为或关系，避免把污秽直接归于那名女子本人。
- source_word: עֶרְוַת אָחִיו גִּלָּה
  choice: 他露了兄弟的下体
  rationale: 直译并保留《利未记》中表示非法性关系的固定委婉语；不将其释义性改写为“与她发生性关系”。
- source_word: עֲרִירִים יִהְיוּ
  choice: 他们必没有儿女
  rationale: 复数形式指涉双方；עֲרִירִים表示无子女。译文不说明此判罚如何实现，也不擅自加入死亡。
theological_decisions:
- issue: עֲרִירִים יִהְיוּ所表达的惩罚
  choice: 他们必没有儿女
  alternative: 他们必无儿无女而死
  rationale: 希伯来文本明确说的是“没有儿女”，并未明确说二人将如何落到这一结局。正文保留这种未加说明的审判措辞，不把死亡补入正文。
- issue: נִדָּה הִוא所指的对象
  choice: 这就是污秽
  alternative: 她是不洁净的
  rationale: 语境是在判定这种结合，译作“这就是污秽”可避免把道德或礼仪评价单独落在女子身上，同时保留该词的礼仪—道德张力。
translation_notes:
  register: 采用现代、庄重而易懂的法律语体。“人若……必……”符合汉语法规式表达；“露了……的下体”有意保留原文的委婉法律用语。“兄弟”不区分哥哥或弟弟，以保存原文אָח的范围。脚注标记分别紧随其实际解释的词句。
