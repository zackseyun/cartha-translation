  text: וְ/אִ֗ישׁ אֲשֶׁ֤ר יִשְׁכַּב֙ אֶת דֹּ֣דָת֔/וֹ עֶרְוַ֥ת דֹּד֖/וֹ גִּלָּ֑ה חֶטְאָ֥/ם יִשָּׂ֖אוּ עֲרִירִ֥ים יָמֻֽתוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/020.yaml
  text: If a man lies with his aunt[a], he has uncovered his uncle’s nakedness. They shall bear their sin[b]; they shall die childless.
translation:
  language: zh_hans
  text: 人若与叔父的妻子同房，就是揭露了他叔父的下体[a]。他们要担当自己的罪[b]；他们必无子女而死。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“他叔父的下体，他揭露了。”这是《利未记》中有关亲属关系的固定说法；这里指与叔父的妻子同房，违犯了被禁止的亲属关系。
    reason: cultural_note
  - marker: b
    text: 或译：“自己的罪责。”希伯来语这一表达既可指所犯的罪，也可指因罪而承担的责任。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ אֲשֶׁר
  choice: 人若
  rationale: 这是律例中引出个案的条件句；“人若”既保留单数男性所指，也符合现代汉语法律表述。
- source_word: יִשְׁכַּב אֶת
  choice: 与……同房
  rationale: 此处 שׁכב 明指性交。“同房”在现代汉语中庄重、明确，又不过分露骨。
- source_word: דֹּדָתוֹ
  choice: 自己的叔伯母
  rationale: 该词在此由下一分句界定为叔伯的妻子。汉语按长幼区分“伯母”和“婶母”，而希伯来文未作这种区分，因此用合称“叔伯母”。
- source_word: עֶרְוַת דֹּדוֹ גִּלָּה
  choice: 露了他叔伯的下体
  rationale: 保留利未记中“揭露下体”的固定亲属禁婚用语，并以脚注说明其在本节所指的关系。
- source_word: חֶטְאָם יִשָּׂאוּ
  choice: 他们要担当自己的罪
  rationale: 复数形式表明双方都承担责任；“担当……罪”保留希伯来语习语及“罪／罪责”的语义张力。
- source_word: עֲרִירִים יָמֻתוּ
  choice: 他们必无子女而死
  rationale: 简洁保留原文所陈述的结局，不擅自说明惩罚机制，也不判定是从未生育还是死时没有存留的后代。
theological_decisions:
- issue: עֲרִירִים יָמֻתוּ 所表达的惩罚结局
  choice: 他们必无子女而死
  alternative: 他们死时必没有子女／后代
  rationale: 原文只说明他们在无后代的状态中死亡，没有交代这是不能生育、子女先亡，还是没有存留的后代；正文保留这种简洁与含混。
- issue: חֶטְאָם 的语义
  choice: 自己的罪
  alternative: 自己的罪责
  rationale: חטא 可指所犯的罪，也可侧重因罪而承担的罪责；正文采用较直接的“罪”，脚注保留另一可能。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。“叔伯母／叔伯”避免把希伯来文未说明的长幼关系限定为“伯母／伯父”或“婶母／叔父”；“同房”明确表达性关系；“露了……下体”保留利未记的关键法律—亲属习语，并由脚注解释。
