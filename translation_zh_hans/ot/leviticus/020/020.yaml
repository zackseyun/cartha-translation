revisions:
- from: 人若与自己的叔伯母同房，就是露了他叔伯的下体[a]。他们要担当自己的罪[b]；他们必无子女而死。
  to: 人若与叔父的妻子同房，就是揭露了他叔父的下体[a]。他们要担当自己的罪[b]；他们必无子女而死。
  rationale: 仅将不规范且可能含混的“叔伯母／叔伯”改为“叔父的妻子／叔父”，并相应调整脚注说明。其余译文保留原稿对希伯来法律习语、共同负罪和“无子女而死”这一未具体说明之结局的忠实表达。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T04:51:13Z'
