  terminology: “同房”适当地表达此处性关系；“揭露……下体”保留《利未记》的关键习语，不应释义为一般性的“侵犯”。“罪”及脚注中的“罪责”妥善保留 חטאם 的语义范围。“无子女而死”不擅自解释无后代的具体机制，合宜。
