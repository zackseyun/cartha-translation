  source_fidelity: 译文整体忠实保留了神亲自敌对、家族、剪除、对偶像的“行淫”隐喻及复数“他们的族人”。但“跟随他行淫、追随摩洛行淫”的串联在现代汉语中句法关系略显含混，容易读成与该人发生性行为，而非仿效其偶像崇拜；宜使两个“在……之后/随从……”的对象更清楚。
  naturalness: “与……为敌”“剪除”庄重自然。将偶像崇拜的两个跟随对象明确为“仿效他”和“随从摩洛”，可避免歧义并仍保留原文重复的性不忠隐喻。脚注标记应紧邻所解释的词语，而非一并置于句末。
  terminology: “摩洛”“剪除”“行淫”均适当。“行淫”在本节须由脚注说明其为偶像崇拜的比喻，不应在正文将其直接释义为拜偶像。
  issues:
  - severity: medium
    issue: “跟随他行淫、追随摩洛行淫”的修饰关系不够清晰。
    rationale: 希伯来文先说“所有在他之后行淫的人”，再说“随从摩洛行淫”。现有汉语容易把“跟随他行淫”理解为与那人进行性行为；改为“仿效他行淫、随从摩洛行淫”可明确前者是效法该人的不忠行为，后者是偶像崇拜的对象，同时保留两次 זנה。
  - severity: low
