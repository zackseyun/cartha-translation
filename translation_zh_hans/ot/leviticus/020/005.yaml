  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/שַׂמְתִּ֨י אֲנִ֧י אֶת פָּנַ֛/י בָּ/אִ֥ישׁ הַ/ה֖וּא וּ/בְ/מִשְׁפַּחְתּ֑/וֹ וְ/הִכְרַתִּ֨י אֹת֜/וֹ וְ/אֵ֣ת כָּל הַ/זֹּנִ֣ים אַחֲרָ֗י/ו לִ/זְנ֛וֹת אַחֲרֵ֥י הַ/מֹּ֖לֶךְ מִ/קֶּ֥רֶב עַמָּֽ/ם־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/005.yaml
  text: then I myself will set my face against that man and against his family[a], and I will cut off him and all who prostitute themselves after him by prostituting themselves after Molech[b], from among their people.
translation:
  language: zh_hans
  text: 我必亲自与那人和他的家族为敌；我要把他和所有仿效他行淫[a]、随从摩洛行淫的人，从他们的族人中剪除[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “行淫”在这里是比喻说法，以性方面的不忠指背弃上帝、追随偶像。
    reason: lexical_alternative
  - marker: b
    text: “剪除”是盟约审判用语；本节没有说明这是指死亡、逐出群体，还是上帝以其他方式除去。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׂמְתִּי אֲנִי אֶת־פָּנַי
  choice: 我就要亲自……为敌
  rationale: 希伯来语直译为“我亲自把我的脸朝向……”，在这里表示定意敌对并施行审判。“亲自”体现 אֲנִי 的强调；意译为“为敌”符合现代汉语，同时保留审判力度。
- source_word: בָּאִישׁ הַהוּא
  choice: 与那人
  rationale: אִישׁ 为阳性单数，具体指前文所说的男性犯罪者，故译作“那人”。
- source_word: וּבְמִשְׁפַּחְתּוֹ
  choice: 和他的家族
  rationale: מִשְׁפָּחָה 可指家庭、家族或宗族；“家族”比“家庭”更能涵盖这里可能涉及的扩大家庭和亲族群体。
- source_word: וְהִכְרַתִּי אֹתוֹ
  choice: 把他……剪除
  rationale: 使役式 כרת 在盟约律法语境中表示从群体中除去。“剪除”保留其固定审判用语的形象，也不擅自限定执行方式。
- source_word: וְאֵת כָּל־הַזֹּנִים אַחֲרָיו
  choice: 和所有跟随他行淫……的人
  rationale: זנה 以性不忠比喻拜偶像；“行淫”保留这一强烈隐喻。אַחֲרָיו 译为“跟随他”，表明这些人仿效并追随他的行为。
- source_word: לִזְנוֹת אַחֲרֵי הַמֹּלֶךְ
  choice: 追随摩洛行淫
  rationale: 再次译出 זנה，以保留原文有意的重复；“追随”自然表达 אַחֲרֵי 所指的非法敬奉。
- source_word: הַמֹּלֶךְ
  choice: 摩洛
  rationale: 此处按传统理解为与献儿女之礼有关的神名 Molech，采用现代中文圣经中通行的音译“摩洛”。
- source_word: מִקֶּרֶב עַמָּם
  choice: 从他们的族人中
  rationale: מִקֶּרֶב 表示从群体当中除去；עַמָּם 带复数所属后缀，与“他和所有……的人”这一复合宾语相应，故译“他们的族人”。
theological_decisions:
- issue: 以性不忠比喻拜偶像
  choice: 在正文中两次使用“行淫”
  alternative: 译为“不忠”或“拜偶像”
  rationale: 原文有意使用 זנה 的性隐喻，并重复该词，借婚约不忠刻画对上帝的背叛；保留隐喻和重复可传达其修辞与神学张力。
- issue: 盟约审判用语“剪除”的具体含义
  choice: 保留“剪除”，不说明具体执行方式
  alternative: 译为“处死”“驱逐”或“消灭”
  rationale: 本节宣告上帝的审判，却没有明确说明是死亡、逐出群体还是其他形式的除去；不作窄化可保留原文的含混性。
- issue: 家族一同成为敌对对象
  choice: 直译为“与那人和他的家族为敌”
  alternative: 弱化或省略“他的家族”
  rationale: 原文明说上帝的脸也朝向其 מִשְׁפָּחָה。译文保留这一令人不安的集体维度，不额外解释家族为何受牵连。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“为敌”自然传达希伯来语“把脸朝向”的敌对含义；“剪除”和“行淫”则保留律法文本的固定表达、强烈意象及刻意重复。脚注标记置于整句末尾，分别解释正文中的“行淫”和“剪除”。
