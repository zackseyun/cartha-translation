  text: וְ/אִ֗ישׁ אֲשֶׁ֤ר יִשְׁכַּב֙ אֶת אֵ֣שֶׁת אָבִ֔י/ו עֶרְוַ֥ת אָבִ֖י/ו גִּלָּ֑ה מֽוֹת יוּמְת֥וּ שְׁנֵי/הֶ֖ם דְּמֵי/הֶ֥ם בָּֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/011.yaml
  text: If a man lies with his father's wife[a], he has uncovered his father's nakedness; both of them shall surely be put to death[b]; their blood is on them.
translation:
  language: zh_hans
  text: 若有男子与父亲的妻子同寝，就是露了父亲的下体[a]；二人都必被处死；他们的血归在自己身上[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可较为解释性地译作“就是在性方面羞辱了父亲”。“露了父亲的下体”是希伯来原文的直译，也是《利未记》中指违禁性行为的固定表达。
    reason: lexical_alternative
  - marker: b
    text: “他们的血归在自己身上”是法律用语，表示他们应当为自己的死亡承担责任。
    reason: cultural_note
lexical_decisions:
- source_word: וְאִישׁ אֲשֶׁר
  choice: 人若
  rationale: 这一结构在律例中引出假设案件。“人若”符合现代汉语法律条件句，也保留原文所指的男性行为人。
- source_word: יִשְׁכַּב אֶת
  choice: 与……同寝
  rationale: 在性行为禁令的语境中，该表达指发生性关系。“同寝”庄重而不过分直露，并能准确传达这里的性含义。
- source_word: אֵשֶׁת אָבִיו
  choice: 父亲的妻子
  rationale: 按原文直译，不缩窄为“继母”；后者虽常是实际所指，却加入了原文没有使用的亲属称谓。
- source_word: עֶרְוַת אָבִיו גִּלָּה
  choice: 露了父亲的下体
  rationale: 保留《利未记》中反复出现的固定表达及其经文间联系；脚注说明它在此指借性行为侵犯并羞辱父亲，而非单纯看见父亲裸体。
- source_word: מוֹת יוּמְתוּ
  choice: 必要被处死
  rationale: 原文以不定式绝对形配合同根限定动词加强语气。“必要被处死”保留刑罚的确定性和被动语态，又不擅自说明执行方式。
- source_word: שְׁנֵיהֶם
  choice: 二人都
  rationale: 明确保留原文对双方的强调。
- source_word: דְּמֵיהֶם בָּם
  choice: 他们的血归到自己身上
  rationale: 保留原文的法律性血债公式及其形象表达；脚注解释其含义是死亡责任由他们自己承担。
theological_decisions:
- issue: 如何翻译性禁令中的固定表达
  choice: 露了父亲的下体
  alternative: 在性方面羞辱了父亲
  rationale: 直译保留圣洁律例内部的措辞联系及原文张力；意译虽更直接，却会抹去原文借“下体”表达亲属关系受侵犯的方式。
- issue: 法律条文中行为人的性别
  choice: 人若
  alternative: 任何人若
  rationale: 原文以阳性单数“男人”设定案件，且所述行为具体指男性行为人。“人若”在汉语中自然，同时没有把所指扩大为不分性别的泛称。
- issue: 死亡责任公式的表达
  choice: 他们的血归到自己身上
  alternative: 他们要自负死亡的责任
  rationale: 保留原文的血之意象和法律公式，不把其神学与司法意味完全化约为解释性陈述；脚注提供其实际含义。
translation_notes:
  register: 采用现代、庄重而易懂的律例文体。“同寝”“必要被处死”保持经文的严肃性；“露了父亲的下体”和“血归到自己身上”保留希伯来文的核心意象，并用脚注帮助现代读者理解。
