id: LEV.20.25
reference: Leviticus 20:25
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/הִבְדַּלְתֶּ֞ם בֵּֽין הַ/בְּהֵמָ֤ה הַ/טְּהֹרָה֙ לַ/טְּמֵאָ֔ה וּ/בֵין הָ/ע֥וֹף הַ/טָּמֵ֖א לַ/טָּהֹ֑ר וְ/לֹֽא תְשַׁקְּצ֨וּ אֶת נַפְשֹֽׁתֵי/כֶ֜ם בַּ/בְּהֵמָ֣ה וּ/בָ/ע֗וֹף וּ/בְ/כֹל֙ אֲשֶׁ֣ר תִּרְמֹ֣שׂ הָֽ/אֲדָמָ֔ה אֲשֶׁר הִבְדַּ֥לְתִּי לָ/כֶ֖ם לְ/טַמֵּֽא־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/025.yaml
  text: So you shall distinguish between the clean animal and the unclean[a], and between the unclean bird and the clean; and you shall not make yourselves detestable by the animal or by the bird or by anything that creeps on the ground[b], which I have set apart for you as unclean.
translation:
  language: zh_hans
  text: 因此，你们要分辨洁净的兽类和不洁净的兽类，也要分辨不洁净的鸟类和洁净的鸟类。你们不可因兽类、鸟类或任何在地上爬行的东西而使自己成为可憎的[a]；这些就是我为你们分别出来、定为不洁净的[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “使自己成为可憎的”中的“自己”，原文直译为“你们的生命”或“你们的人”，在此是指你们自身；这里所用的动词不是通常表示“成为不洁净”的那个词。
    reason: 说明נפשׁ的习语用法，并保留שׁקץ与טמא的词义区别。
  - marker: b
    text: “定为不洁净的”也可较直地译作“分别给你们，作为不洁净的”。
    reason: 保留末尾לְטַמֵּא在分类、指定功能上的表达空间。
lexical_decisions:
- source_word: וְהִבְדַּלְתֶּם
  choice: 因此，你们要分辨
  rationale: הבדיל的使役形在此要求以色列辨明并维持类别之间的区别。“分辨”比“分开”更自然地表达对洁净与不洁净类别的识别；“因此”承接上文的因果与劝令关系。
- source_word: הַבְּהֵמָה
  choice: 兽类
  rationale: בְּהֵמָה在本段指陆地动物这一广泛类别；“兽类”比“牲畜”范围更宽，也避免“动物”在现代汉语中可能包含鸟类的歧义。
- source_word: הַטְּהֹרָה / הַטְּמֵאָה / הַטָּמֵא / הַטָּהֹר
  choice: 洁净 / 不洁净
  rationale: 保留利未记礼仪与盟约语境中的分类术语，不将其改写为一般道德意义上的“纯洁/污秽”。
- source_word: הָעוֹף
  choice: 鸟类
  rationale: 在饮食条例语境中自然译为“鸟类”；原词有时可泛指飞禽，但本处无须扩展为较生硬的“飞行生物”。
- source_word: וְלֹא תְשַׁקְּצוּ אֶת נַפְשֹׁתֵיכֶם
  choice: 你们不可……使自己成为可憎的
  rationale: שׁקץ的使役意义属于“可憎、令人厌恶”的语义范围，不宜与טמא直接合并译作“玷污”。נפשׁותיכם在此指人自身，故用自然的反身表达“自己”。
- source_word: וּבְכֹל אֲשֶׁר תִּרְמֹשׂ הָאֲדָמָה
  choice: 或任何在地上爬行的东西
  rationale: רמשׂ表示贴近地面爬动；此译法保持范围宽泛，同时不误加“成群滋生”的含义。
- source_word: אֲשֶׁר הִבְדַּלְתִּי לָכֶם לְטַמֵּא
  choice: 这些都是我为你们分别出来、定为不洁净的
  rationale: 用“分别出来”呼应本节前半的בדל，并以“定为不洁净”表达末尾不定式的分类或指定作用。
theological_decisions:
- issue: 洁净与不洁净是礼仪类别还是一般道德评价
  choice: 采用“洁净/不洁净”，保留以色列盟约生活中的礼仪分类
  alternative: 纯洁/污秽，或洁净/被玷污
  rationale: 经文命令百姓区分食物与生物类别，并非宣称某些动物本身具有一般性的道德邪恶。
- issue: נפשׁ在本句中的人论含义
  choice: 译作“自己”，指完整的人
  alternative: 你们的灵魂
  rationale: 这里是常见的希伯来语反身性用法；译成“灵魂”会无根据地引入身心二分的技术含义。
- issue: שׁקץ与טמא是否应合并为同一概念
  choice: 分别译作“可憎”与“不洁净”
  alternative: 两者都译成“污秽/玷污”
  rationale: 原文刻意使用不同词根；分译可保留“成为可憎”与礼仪分类“不洁净”之间既相关又不完全相同的张力。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。以“兽类/鸟类”形成清楚的类别对照，保留原文先“洁净—不洁净”、后“不洁净—洁净”的交错次序；末句用“这些”自然统摄前列各类生物。
