  text: וְ/אִ֗ישׁ אֲשֶׁ֨ר יִתֵּ֧ן שְׁכָבְתּ֛/וֹ בִּ/בְהֵמָ֖ה מ֣וֹת יוּמָ֑ת וְ/אֶת הַ/בְּהֵמָ֖ה תַּהֲרֹֽגוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/015.yaml
  text: If a man has sexual intercourse with an animal, he must surely be put to death, and you shall kill the animal.
translation:
  language: zh_hans
  text: “若有男人与牲畜交合[a]，他必须被处死；你们也要杀死那牲畜。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文按字面可译为“把自己的寝卧给牲畜”，是指性交的希伯来语惯用说法。
    reason: 说明原文委婉惯用语及正文意译。
lexical_decisions:
- source_word: אִישׁ
  choice: 男人
  rationale: 该名词为阳性单数，本节特指男性行为人；下一节另行论及女性，因此不宜泛化为“人”。
- source_word: אֲשֶׁר
  choice: 若有
  rationale: 该词形式上是关系词，但在判例式律法中引出条件情形，译作“若有”自然地表达其法律条件句功能。
- source_word: יִתֵּן שְׁכָבְתּוֹ
  choice: 交合
  rationale: 这是表示性交的希伯来语委婉惯用语；“交合”在现代汉语中明确、庄重，并适合律法语体。
- source_word: בִּבְהֵמָה
  choice: 与牲畜
  rationale: בְּהֵמָה 指牲畜或兽类；在本条律法语境中，“牲畜”自然清楚，且避免“野兽”可能造成的不当限缩。
- source_word: מוֹת יוּמָת
  choice: 必须被处死
  rationale: 不定式绝对形与限定动词连用，加强死刑判决的确定性和强制性；“必须被处死”兼顾强调与现代法律语感。
- source_word: וְאֶת־הַבְּהֵמָה תַּהֲרֹגוּ
  choice: 你们也要杀死那牲畜
  rationale: 复数第二人称保留为“你们”，指受命执行律法的群体；“也”体现连词在并列处罚中的承接作用，“那牲畜”回指前述牲畜。
theological_decisions:
- issue: 行为人的性别特指
  choice: 译为“男人”
  alternative: 译为性别泛指的“人”
  rationale: 原文明确使用阳性单数名词，且下一节另述女性情形；保留男性特指可维护这组律法条文的结构和法律精确性。
translation_notes:
  register: 采用现代、庄重而清楚的律法语体。“交合”避免古奥含混，也不使用粗俗措辞；分号呈现对男人与牲畜的两项并列处置。
