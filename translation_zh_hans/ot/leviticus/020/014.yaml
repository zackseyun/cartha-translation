  text: וְ/אִ֗ישׁ אֲשֶׁ֨ר יִקַּ֧ח אֶת אִשָּׁ֛ה וְ/אֶת אִמָּ֖/הּ זִמָּ֣ה הִ֑וא בָּ/אֵ֞שׁ יִשְׂרְפ֤וּ אֹת/וֹ֙ וְ/אֶתְ/הֶ֔ן וְ/לֹא תִהְיֶ֥ה זִמָּ֖ה בְּ/תוֹכְ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/014.yaml
  text: If a man takes a woman and her mother[a], it is depravity. They shall burn him and them with fire[c][b], so that there will not be depravity among you.
translation:
  language: zh_hans
  text: 如果一个男人与一个女人和她母亲结合[a]，这是可憎的恶行[b]。他们要用火焚烧他和她们[c]，这样，你们中间就不再有可憎的恶行。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“娶一个女人，又娶她母亲。”原文动词的字面意思是“取”，在法律语境中可以指娶妻，但这里没有明确使用“结婚”一词。
    reason: lexical_alternative
  - marker: b
    text: “可憎的恶行”所译的希伯来语词也可译为“恶行”、“淫荡之事”或“骇人的恶事”，指严重而可憎的性方面罪行。
    reason: lexical_alternative
  - marker: c
    text: “她们”指那个女人和她母亲。
    reason: referent_clarification
lexical_decisions:
- source_word: אִישׁ
  choice: 一个男人
  rationale: 原文为阳性单数，明确指这条律法中犯罪的男性；保留其性别指向。
- source_word: יִקַּח
  choice: 与……结合
  rationale: לקח的字面义是“取”，在法律和两性语境中可指娶妻或建立性关系。现代汉语若直译为“取”会显得古旧且含义不清；“结合”既符合语境，也不把原文限定为正式婚姻。
- source_word: אִשָּׁה
  choice: 一个女人
  rationale: אִשָּׁה既可指“女人”，也可指“妻子”。这里采用较宽泛的“女人”，避免在原文没有明说时预先认定婚姻身份。
- source_word: אִמָּהּ
  choice: 她母亲
  rationale: 准确表达原文的第三人称阴性单数所属关系，即前述女人的母亲。
- source_word: זִמָּה
  choice: 淫恶
  rationale: 该词在利未记的性伦理律法中表示严重、可憎的性方面恶行。“淫恶”简洁地兼顾其性含义和强烈的道德谴责，并可在本节两处一致复现。
- source_word: בָּאֵשׁ
  choice: 用火
  rationale: 介词ב在这里表示手段；“用火”是自然、准确的现代汉语表达。
- source_word: יִשְׂרְפוּ אֹתוֹ וְאֶתְהֶן
  choice: 人要用火焚烧他和她们
  rationale: 保留原文第三人称复数主动式的法律措辞。汉语以泛指的“人”承接未明说的执行者；“她们”指女人和她母亲。
- source_word: וְלֹא תִהְיֶה זִמָּה בְּתוֹכְכֶם
  choice: 这样，你们中间就不再有淫恶
  rationale: “这样”自然呈现惩罚所要达到的结果；“你们中间”对应בְּתוֹכְכֶם，并保留复数第二人称所指的群体。
theological_decisions:
- issue: “与一个女人和她母亲结合”所指关系的性质
  choice: 采用较宽泛的“结合”，不在正文中明确限定为婚姻。
  alternative: “娶一个女人，又娶她母亲”或“娶一个女人和她母亲为妻”
  rationale: לקח在这种法律语境中可以含有婚娶之意，但原文没有另用明确表示婚姻的词。较宽泛的译法保留原文可能涵盖婚姻或性结合的张力。
- issue: 焚烧刑罚的语态和执行者
  choice: 译为主动句“人要用火焚烧他和她们”。
  alternative: “他和她们都要被火焚烧”
  rationale: 原文动词是第三人称复数主动式，以“他”和“她们”为宾语。正文保留主动法律句式，同时不额外指定原文没有明说的具体执行者。
- issue: 焚烧是否明确译作处死
  choice: 仅译“焚烧”，不在正文中增添“烧死”。
  alternative: “用火烧死”
  rationale: 刑罚语境强烈暗示处决，但原文字面只说“焚烧”。不补入“死”可避免替文本解决有关刑罚实施方式的细节问题。
translation_notes:
  register: 采用现代、庄重而直接的法律文体。“结合”比直译“取”更符合现代汉语，同时保留婚姻与性关系之间的原文含混；“淫恶”保持全节关键词复现。
