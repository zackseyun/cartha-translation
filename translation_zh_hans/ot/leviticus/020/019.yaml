  text: וְ/עֶרְוַ֨ת אֲח֧וֹת אִמְּ/ךָ֛ וַ/אֲח֥וֹת אָבִ֖י/ךָ לֹ֣א תְגַלֵּ֑ה כִּ֧י אֶת שְׁאֵר֛/וֹ הֶעֱרָ֖ה עֲוֺנָ֥/ם יִשָּֽׂאוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/019.yaml
  text: You shall not uncover the nakedness of your mother's sister or of your father's sister[a], for he has laid bare his own flesh[b]; they shall bear their iniquity.
translation:
  language: zh_hans
  text: 不可揭露你母亲的姐妹或你父亲的姐妹的下体，因为他揭露了自己的骨肉[a]；他们要担当自己的罪孽[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “自己的骨肉”也可译作“自己的近亲”或“自己的血亲”。希伯来语在这里按字面使用了表示肉身和亲属关系的词。
    reason: lexical_alternative
  - marker: b
    text: “担当自己的罪孽”也可理解为“担当自己的罪责”或“承担自己罪孽的惩罚”。
    reason: lexical_alternative
lexical_decisions:
- source_word: עֶרְוַת ... לֹא תְגַלֵּה
  choice: 不可揭露……的下体
  rationale: 保留利未记中“揭露下体”这一固定的性禁令用语，而不直接释为“发生性关系”；“下体”在现代汉语中自然、庄重，也能表达 עֶרְוָה 的身体含义。
- source_word: אֲחוֹת אִמְּךָ וַאֲחוֹת אָבִיךָ
  choice: 你母亲的姐妹或你父亲的姐妹
  rationale: 依照希伯来语的亲属称谓逐项表达，既明确双方亲属关系，也比仅说“姨母或姑母”更贴近原文。并列关系在汉语禁令中用“或”表达任一对象均在禁止之列。
- source_word: כִּי
  choice: 因为
  rationale: 表达禁令后理由分句的解释或因果功能，不额外强化其逻辑。
- source_word: שְׁאֵרוֹ
  choice: 自己的骨肉
  rationale: שְׁאֵר 可指血亲、近亲，且保有“肉身”的具体意象；“骨肉”是现代汉语中自然的亲属隐喻，兼顾字面形象和亲属含义。
- source_word: הֶעֱרָה
  choice: 露出了
  rationale: ערה 的使役形表示使之赤露、暴露。译作“露出了”保留原文意象，并避免与前句“揭露”机械重复。
- source_word: עֲוֺנָם יִשָּׂאוּ
  choice: 他们要担当自己的罪孽
  rationale: “担当罪孽”保留 נשׂא עָוֹן 的浓缩惯用表达，让“罪、罪责或罪的后果”之间的语义张力保持开放。
theological_decisions:
- issue: 理由分句的单数与惩处分句的复数转换
  choice: 保留“他……自己的”与“他们……”的转换
  alternative: 统一为复数：“因为他们露出了自己的骨肉；他们要担当自己的罪孽。”
  rationale: 希伯来文本在 שְׁאֵרוֹ、הֶעֱרָה 使用单数，却在 עֲוֺנָם、יִשָּׂאוּ 转为复数。保留这种转换，可如实呈现法律措辞中从单数行为主体转向双方责任的张力，而不替原文消除不整齐之处。
- issue: 是否在正文中明说性行为
  choice: 保留“揭露……下体”的委婉法律用语
  alternative: 译为“不可与……发生性关系”
  rationale: 原文的固定表达是本段禁令结构的一部分；直译其意象能维持上下文互文联系，同时其性含义在本章语境中足够清楚。
- issue: עָוֹן 在责任与惩罚之间的含义
  choice: 正文译作“罪孽”，脚注说明也可指罪责或罪的后果
  alternative: 正文直接译作“罪责”或“罪的惩罚”
  rationale: 该词可涵盖罪行、罪责及其后果；不在正文中单选一个含义，有助于保存原文的神学与法律张力。
translation_notes:
  register: 采用现代、庄重而易懂的法律语体。“不可”对应禁令，“揭露……的下体”保留本段反复出现的源语惯用表达；“骨肉”既自然又保存希伯来语的亲属身体隐喻。正文中的[a]、[b]均与脚注对应。
