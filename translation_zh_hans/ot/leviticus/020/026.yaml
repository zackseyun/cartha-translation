  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וִ/הְיִ֤יתֶם לִ/י֙ קְדֹשִׁ֔ים כִּ֥י קָד֖וֹשׁ אֲנִ֣י יְהוָ֑ה וָ/אַבְדִּ֥ל אֶתְ/כֶ֛ם מִן הָֽ/עַמִּ֖ים לִ/הְי֥וֹת לִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/026.yaml
  text: You shall be holy to me[a], because I, Yahweh, am holy, and I have separated you from the peoples to be mine.
translation:
  language: zh_hans
  text: 你们要归我为圣，因为我雅威是圣洁的；我已把你们从万民[a]中分别出来，使你们归我。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“列国”。希伯来语עַמִּים可指“万民、各族”，在某些语境中也可指“列国”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וִהְיִיתֶם לִי קְדֹשִׁים
  choice: 你们要归我为圣
  rationale: וִהְיִיתֶם在本段律法与劝诫语境中带有要求和结果意味；לִי表达归属关系，קְדֹשִׁים兼具道德与礼仪上的圣别含义。“归我为圣”简洁保留了归属、要求和成圣三层意味。
- source_word: כִּי קָדוֹשׁ אֲנִי
  choice: 因为我……是圣洁的
  rationale: כִּי在此说明以色列归耶和华为圣的根据；“圣洁”保持קָדוֹשׁ与前句“为圣”的词义联系，又符合现代汉语对上帝属性的自然表达。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文直接呈现四字神名，而不以“主”这一称号代替；“雅威”是现代汉语中清楚且通行的音译。
- source_word: וָאַבְדִּל אֶתְכֶם
  choice: 我已把你们……分别出来
  rationale: בדל表示分开、区别或分别；“已……分别出来”体现行动已经完成并持续具有盟约意义，也避免与קדש的“圣”混为同一个词。
- source_word: מִן הָעַמִּים
  choice: 从万民中
  rationale: עַמִּים是复数集合名词，可指各族、各民或列国。“万民”在此自然表达以色列以外诸民的整体，同时不把含义限定为政治国家。
- source_word: לִהְיוֹת לִי
  choice: 使你们归我
  rationale: 不定式结构表达上帝分别他们的目的或结果，לִי表示归属；“归我”保留盟约性的所属关系，并与本节开头形成呼应。
theological_decisions:
- issue: 如何同时表达以色列的圣洁与被分别出来
  choice: 分别用“为圣”和“分别出来”翻译קדש与בדל
  alternative: 把两词都译作“分别为圣”或“分别出来”
  rationale: 原文先以上帝的圣洁作为以色列为圣的根据，随后另用בדל说明上帝把他们从万民中分别出来。采用两个不同表达，可保留圣洁的道德、礼仪及关系层面，也保留分别行动本身。
- issue: 如何翻译神名יְהוָה
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文使用上帝的专名。音译“雅威”呈现该盟约之名，避免以称号代替专名。
- issue: לִי所表达的盟约归属
  choice: 首尾均以“归我”表达
  alternative: 开头译作“对我”，结尾译作“属于我”
  rationale: 重复“归我”保留原文首尾两次לִי的呼应，并清楚表达被分别出来是为了专属于雅威，而不额外加入“子民”等原文未明说的名词。
translation_notes:
  register: 采用庄重而简明的现代标准汉语。“归我为圣”略带经文语体，但在普通读者可理解的范围内，并能凝练保留原文的归属与圣洁含义；分号呈现两句之间紧密的因果与行动联系。
