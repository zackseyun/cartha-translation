id: LEV.20.6
reference: Leviticus 20:6
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/הַ/נֶּ֗פֶשׁ אֲשֶׁ֨ר תִּפְנֶ֤ה אֶל הָֽ/אֹבֹת֙ וְ/אֶל הַ/יִּדְּעֹנִ֔ים לִ/זְנ֖וֹת אַחֲרֵי/הֶ֑ם וְ/נָתַתִּ֤י אֶת פָּנַ/י֙ בַּ/נֶּ֣פֶשׁ הַ/הִ֔וא וְ/הִכְרַתִּ֥י אֹת֖/וֹ מִ/קֶּ֥רֶב עַמּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/006.yaml
  text: And the person who turns to the mediums and to the spiritists[a], to prostitute himself after them[c][b], I will set my face against that person and cut him off from among his people.
translation:
  language: zh_hans
  text: “若有人转向招魂者和通灵者[a]，随从他们行淫[b]，我就要与那人敌对，把他从自己的族人中剪除[c]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “招魂者和通灵者”：原文两个词都与求问亡魂或灵体有关，所指可能是这类从业者；两者的确切区别并不明确。
    reason: lexical_alternative
  - marker: b
    text: “随从他们行淫”：这是盟约不忠的隐喻，也可译作“跟随他们而不忠”。
    reason: lexical_alternative
  - marker: c
    text: “剪除”是律法中的固定审判用语；本节没有说明这一惩罚具体以何种方式执行。
    reason: alternative_reading
lexical_decisions:
- source_word: הַנֶּפֶשׁ
  choice: 有人／那人
  rationale: 在律法语境中，נֶפֶשׁ 指具体的个人，并非特指与身体相对的“灵魂”；汉语用“人”自然准确。
- source_word: תִּפְנֶה
  choice: 转向
  rationale: 保留 פנה“转向”的基本意象；在本处也自然表达求助、投奔这些从业者之意，而不把含义收窄为单次“求问”。
- source_word: הָאֹבֹת
  choice: 招魂者
  rationale: אוֹב 在此指与亡魂或灵体相通的从业者。“招魂者”比传统的“交鬼者”更符合现代汉语，也能体现其与亡灵咨询的关联。
- source_word: הַיִּדְּעֹנִים
  choice: 通灵者
  rationale: יִדְּעֹנִי 指凭隐秘灵界知识行事的人，常与 אוֹב 并列。“通灵者”既与“招魂者”有所区分，又保留两者共同的灵媒语义范围。
- source_word: לִזְנוֹת אַחֲרֵיהֶם
  choice: 随从他们行淫
  rationale: 直译并保留 זנה 的性不忠隐喻，以及 אַחֲרֵי“跟随、随从”的表达；这里借行淫描写在属灵和盟约上的不忠。
- source_word: וְנָתַתִּי אֶת־פָּנַי בַּנֶּפֶשׁ הַהִוא
  choice: 我就要与那人敌对
  rationale: 希伯来语直译为“把我的脸朝向／攻击那人”，是表示上帝亲自敌对、施行审判的惯用语。译作“与……敌对”在现代汉语中自然，并传达该习语的实际力度。
- source_word: וְהִכְרַתִּי אֹתוֹ
  choice: 把他……剪除
  rationale: 保留 כרת 在律法中的固定审判用语及其开放性，不擅自限定为处死、驱逐或其他某一种具体执行方式。
- source_word: מִקֶּרֶב עַמּוֹ
  choice: 从自己的族人中
  rationale: 表达此人被从其所属群体中剪除；“族人”在本处比泛指政治共同体的“人民”更自然。
theological_decisions:
- issue: 是否保留以行淫描写盟约不忠的隐喻
  choice: 随从他们行淫
  alternative: 跟随他们，对我不忠
  rationale: 原文明确使用 זנה。保留“行淫”可呈现罪行所包含的盟约背叛意味，避免把强烈的先知性、律法性隐喻淡化为一般的不忠。
- issue: 如何表达“把脸朝向那人”的神圣审判惯用语
  choice: 我就要与那人敌对
  alternative: 我就要向那人变脸
  rationale: 原文强调上帝亲自转而敌对此人。“与……敌对”清楚传达该习语的司法和神学力度；“变脸”在现代汉语里容易显得口语化，且可能只被理解为态度改变。
- issue: “剪除”的具体刑罚方式
  choice: 把他从自己的族人中剪除
  alternative: 把他处死／把他逐出族群
  rationale: כרת 的具体实施方式在此并未说明。保留“剪除”既呈现审判的严厉，也不替原文裁定究竟是死亡、驱逐，还是上帝直接施行的其他惩罚。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“招魂者／通灵者”避免古奥的“交鬼者／行巫术者”，同时保留两个希伯来术语的并列关系；“行淫”和“剪除”则有意保存原文强烈的盟约隐喻与司法措辞。
