language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/אִ֗ישׁ אֲשֶׁ֤ר יִשְׁכַּב֙ אֶת כַּלָּת֔/וֹ מ֥וֹת יוּמְת֖וּ שְׁנֵי/הֶ֑ם תֶּ֥בֶל עָשׂ֖וּ דְּמֵי/הֶ֥ם בָּֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/012.yaml
  text: If a man lies with his daughter-in-law[a], both of them shall surely be put to death. They have committed perversion[b]; their blood is upon them.
translation:
  language: zh_hans
  text: 如果一个男人与自己的儿媳发生性关系[a]，他们两人都必须被处死。他们做了可耻的事[b]；他们的血归在自己身上[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文“躺卧”在这里是指发生性关系的委婉说法。
    reason: clarification
  - marker: b
    text: “可耻的事”所译的希伯来语也可理解为“混乱之事”“败坏的行为”或“悖乱之事”，指严重违背正当秩序的行为。
    reason: lexical_alternative
  - marker: c
    text: 原文直译为“他们的血在他们身上”。这是法律惯用语，表示他们须为自己被处死承担责任；也可译作“他们自负血债”。
    reason: idiom_clarification
lexical_decisions:
- source_word: וְאִישׁ אֲשֶׁר
  choice: 如果一个男人
  rationale: 这一组合在判例法句式中引出条件情形。保留 אִישׁ 的男性所指，同时用现代汉语自然的“如果”表达法律条件。
- source_word: יִשְׁכַּב אֶת
  choice: 与……同寝
  rationale: שׁכב 与 אֶת 在此是发生性关系的惯用表达。“同寝”庄重且清楚，并保留原文委婉的身体意象。
- source_word: כַּלָּתוֹ
  choice: 儿媳
  rationale: כַּלָּה 在此指儿子的妻子；“儿媳”是现代汉语准确而简洁的亲属称谓。
- source_word: מוֹת יוּמְתוּ שְׁנֵיהֶם
  choice: 他们两人都必须被处死
  rationale: 不定式绝对形 מוֹת 加限定动词 יוּמְתוּ 构成强调性的死刑公式。“必须被处死”传达确定、强制的法律效力；“他们两人都”明确保留 שְׁנֵיהֶם。
- source_word: תֶּבֶל עָשׂוּ
  choice: 他们行了悖乱之事
  rationale: תֶּבֶל 在性禁令中指违背正当秩序、可耻而严重的行为。“悖乱之事”保留其强烈的道德评价，又避免把词义过度限定为某一种解释。
- source_word: דְּמֵיהֶם בָּם
  choice: 他们流血的责任归到自己身上
  rationale: 原文直译为“他们的血在他们身上”，是宣告受刑者须为自身死亡负责的法律惯用语。正文适度显明其含义，同时以脚注保留较直译的表达。
theological_decisions:
- issue: 法律主体的性别
  choice: 译为“一个男人”
  alternative: “一个人”或“有人”
  rationale: אִישׁ 是阳性单数，而且本条所述亲属关系中的行为主体是男性；明确译出性别忠实于原文。
- issue: תֶּבֶל 的道德性质
  choice: 译为“悖乱之事”
  alternative: “混乱之事”“可耻的事”“败坏的行为”
  rationale: 该词本身对行为作出强烈的道德否定，但其确切语义范围存在争议。“悖乱之事”既表达对正当秩序的严重违背，也不把歧义静默地收窄。
- issue: דְּמֵיהֶם בָּם 的责任含义
  choice: 正文译明为“他们流血的责任归到自己身上”
  alternative: 直译为“他们的血归到自己身上”或解释为“他们自负血债”
  rationale: 这一惯用语把依法死亡的责任归于犯罪者自身。正文让现代读者容易理解，脚注则保留其字面形式及“血债”的可能表达。
translation_notes:
  register: 采用现代、庄重且便于普通读者理解的法律语体。“同寝”保留原文的委婉表达；“必须被处死”体现强调性的死刑公式；对 תֶּבֶל 及血责惯用语以脚注保存词义张力和较直译形式。
