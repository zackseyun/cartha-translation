source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר מֹשֶׁ֔ה זֶ֧ה הַ/דָּבָ֛ר אֲשֶׁר צִוָּ֥ה יְהוָ֖ה תַּעֲשׂ֑וּ וְ/יֵרָ֥א אֲלֵי/כֶ֖ם כְּב֥וֹד יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/006.yaml
  text: And Moses said[a], “This is the thing that Yahweh has commanded you to do, that the glory of Yahweh may appear to you.”
translation:
  language: zh_hans
  text: 摩西说：“这就是雅威吩咐你们要做的事；雅威的荣耀要向你们显现。[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“这就是雅威吩咐你们要做的事，好使雅威的荣耀向你们显现。”
    reason: 原文末句可理解为前句所吩咐行动的目的或结果；正文保留其也可作并列将来应许的表达。
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: 该叙事形式推动情节发展；现代汉语通常无需另译连接词，直接用“说”即可自然表达。
- source_word: מֹשֶׁה
  choice: 摩西
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: זֶה הַדָּבָר
  choice: 这就是……的事
  rationale: 保留原文单数、具体的“这事”，同时以自然的现代汉语组织判断句。
- source_word: צִוָּה
  choice: 吩咐
  rationale: 准确表达צוה所含的权威命令之意，也符合中文圣经语体；在本句中比“命令”更自然。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见音译呈现神的专名，而不以称号“耶和华”或“主”代替。
- source_word: תַּעֲשׂוּ
  choice: 你们要做
  rationale: 明确保留第二人称复数，并自然表达这是所吩咐之事。
- source_word: וְיֵרָא
  choice: 好使……显现
  rationale: 按目的或结果关系理解连接词与未完成式，使所吩咐的行动和荣耀的显现紧密相连；同时以脚注保留并列将来结果的可行读法。
- source_word: אֲלֵיכֶם
  choice: 向你们
  rationale: 与“显现”搭配自然，表明神荣耀显现所面向的人。
- source_word: כְּבוֹד יְהוָה
  choice: 雅威的荣耀
  rationale: 直接表达原文所属结构，保留“荣耀”作为神可彰显之威荣与临在的核心意象。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名；采用“雅威”以中文音译保留其专名性质，不以称号替换。
- issue: 末句וְיֵרָא的逻辑关系
  choice: 目的／结果：“好使雅威的荣耀向你们显现”
  alternative: 并列的将来结果：“雅威的荣耀就会向你们显现”
  rationale: 希伯来语连接词加未完成式在此可表达执行命令之后的目的或结果。正文采用目的／结果表达，但脚注保留同样合乎原文的并列应许读法，避免消除原文张力。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“这就是……的事”保留原文的具体表达；“好使”较为庄重，又能清楚表现目的或结果。脚注标记紧接其所说明的末句。
