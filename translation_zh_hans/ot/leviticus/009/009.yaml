  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ֠/יַּקְרִבוּ בְּנֵ֨י אַהֲרֹ֣ן אֶת הַ/דָּם֮ אֵלָי/ו֒ וַ/יִּטְבֹּ֤ל אֶצְבָּע/וֹ֙ בַּ/דָּ֔ם וַ/יִּתֵּ֖ן עַל קַרְנ֣וֹת הַ/מִּזְבֵּ֑חַ וְ/אֶת הַ/דָּ֣ם יָצַ֔ק אֶל יְס֖וֹד הַ/מִּזְבֵּֽחַ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/009.yaml
  text: And Aaron’s sons brought the blood to him[a], and he dipped his finger in the blood and put it on the horns of the altar[c][b], and he poured out the blood at the base of the altar.
translation:
  language: zh_hans
  text: 亚伦的儿子们把血拿到他面前[a]。他把手指蘸在血中，将血抹在祭坛的角上[b]，又把血倒在祭坛脚下[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“把血呈给他”；这里的希伯来语动词可表示“带近”，在礼仪语境中也可表示“呈上”。
    reason: lexical_alternative
  - marker: b
    text: “祭坛的角”指祭坛四角向外突出的角状部分。
    reason: cultural_note
  - marker: c
    text: “祭坛脚下”或译“祭坛的根基处”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְרִבוּ
  choice: 拿到……面前
  rationale: 希伯来语קרב的使役式表示“使靠近、带近”，在献祭礼仪中也可指“呈上”。“拿到……面前”既保留移动含义，也符合现代汉语叙事。
- source_word: בְּנֵי אַהֲרֹן
  choice: 亚伦的儿子们
  rationale: 直接保留亲属关系和复数形式；上下文表明他们也在履行祭司助手的职分。
- source_word: הַדָּם
  choice: 血
  rationale: 指上下文已明确的祭牲之血。汉语不以冠词标示定指，无须另加“这”。
- source_word: אֵלָיו
  choice: 他面前
  rationale: 保留原文的第三人称代词；结合紧接的动作主体，最自然的所指是亚伦。
- source_word: וַיִּטְבֹּל
  choice: 蘸
  rationale: טבל可指浸入或蘸入；这里的宾语是手指，“蘸”准确而自然。
- source_word: אֶצְבָּעוֹ
  choice: 他的手指
  rationale: 保留单数及所属关系；正文依汉语习惯省去显性的“他的”，由主语自然领会。
- source_word: וַיִּתֵּן עַל
  choice: 抹在……上
  rationale: 字面为“放在……上”，此处描述用手指施血的礼仪动作，“抹在”比机械直译更准确自然。
- source_word: קַרְנוֹת הַמִּזְבֵּחַ
  choice: 祭坛的角
  rationale: 保留原文的礼仪术语和具体形象，指祭坛四角向外突出的角状部分。
- source_word: יָצַק
  choice: 倒
  rationale: 该动词表示倾倒液体；“倒”符合本节处理祭血的动作，并避免额外加入“其余的”等原文未明说的信息。
- source_word: אֶל יְסוֹד הַמִּזְבֵּחַ
  choice: 在祭坛脚下
  rationale: יְסוֹד可指根基或底部；在祭坛语境中，“祭坛脚下”清楚自然地表达血被倒向祭坛底部。
theological_decisions:
- issue: אֵלָיו（“到他那里”）的所指
  choice: 理解为把血拿到亚伦面前，同时在正文中保留代词“他”
  alternative: 理解为把血拿到祭坛或另一未明说的对象那里
  rationale: 上文以亚伦为执行礼仪者，本节又说他的儿子们协助，因此“他”最自然地回指亚伦。这是上下文和语法判断，并非教义性补充。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。句子依希伯来文的动作次序展开；用“抹”表达手指施血的实际动作，同时以脚注解释祭坛的角和“根基”这一礼仪建筑用语。
