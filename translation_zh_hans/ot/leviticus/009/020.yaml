  yaml_path: translation/ot/leviticus/009/020.yaml
  text: They placed the fat pieces on the breasts[a], and he burned the fat pieces on the altar.
translation:
  language: zh_hans
  text: 他们把脂肪块放在胸脯上；他在祭坛上焚烧脂肪块[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “焚烧”也可较直译为“使脂肪块在祭坛上化为烟”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשִׂימוּ
  choice: 他们把……放在
  rationale: שׂים意为“放、安放”；这里用现代汉语自然的“把”字句，准确表达祭礼动作。
- source_word: הַחֲלָבִים
  choice: 脂肪块
  rationale: 献祭语境中的חֵלֶב复数指从祭牲取出的脂肪部分；译作“脂肪块”既体现复数和具体部分，也避免仅指抽象的脂肪物质。
- source_word: עַל הֶחָזוֹת
  choice: 在胸肉上
  rationale: חָזֶה在祭祀律例中指祭牲的胸部肉块；“胸肉”比单说“胸”更明确地指祭牲部位。
- source_word: וַיַּקְטֵר
  choice: 他把……焚烧
  rationale: קטר在祭司献祭语境中指在祭坛上焚烧祭物，使其化为烟；正文用“焚烧”简洁庄重，脚注保留更贴近词义的表达。
- source_word: הַמִּזְבֵּחָה
  choice: 在祭坛上
  rationale: 带方向词尾的מזבח在קטר之后按汉语习惯表达焚烧发生的位置，译为“在祭坛上”。
theological_decisions: []
