  text: וְ/אֶת הַ/חֲלָבִ֖ים מִן הַ/שּׁ֑וֹר וּ/מִן הָ/אַ֔יִל הָֽ/אַלְיָ֤ה וְ/הַֽ/מְכַסֶּה֙ וְ/הַ/כְּלָיֹ֔ת וְ/יֹתֶ֖רֶת הַ/כָּבֵֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/019.yaml
  text: 'and the fat pieces from the ox and from the ram: the fat tail[a], the covering fat, the kidneys, and the lobe of the liver.'
translation:
  language: zh_hans
  text: 还有公牛和公绵羊的脂肪：肥尾[a]、遮盖内脏的脂肪、两个肾，以及肝叶。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “肥尾”指肥尾羊富含脂肪的尾部。
    reason: 向不熟悉古代近东羊种及献祭部位的现代读者说明这一术语。
lexical_decisions:
- source_word: וְאֶת הַחֲלָבִים
  choice: 还有……的脂肪
  rationale: וְאֶת承接上一节的宾语清单；חֲלָבִים在献祭语境中指指定献上的脂肪部分。中文用“脂肪”配合后面的具体列举，简洁而自然。
- source_word: מִן הַשּׁוֹר
  choice: 公牛的
  rationale: שׁוֹר可泛指牛类；本段献祭语境所指为公牛。“公牛”与前文祭牲称谓一致，也避免现代汉语中“阉牛”的狭义联想。
- source_word: וּמִן הָאַיִל
  choice: 和公绵羊的
  rationale: אַיִל在献祭语境中明确指成年雄绵羊；“公绵羊”比单说“公羊”更清楚地区别于山羊。
- source_word: הָאַלְיָה
  choice: 肥尾
  rationale: 指肥尾羊富含脂肪的尾部；“肥尾”准确、简明，并保留其作为特定献祭部位的含义。
- source_word: וְהַמְכַסֶּה
  choice: 遮盖内脏的脂肪
  rationale: 该分词字面为“遮盖之物”，在同类献祭条文中指遮盖内脏的脂肪。补出“内脏”和“脂肪”，使现代读者能清楚理解其解剖学所指。
- source_word: וְהַכְּלָיֹת
  choice: 两个肾
  rationale: כְּלָיֹת为复数，指一对肾；中文献祭清单中译作“两个肾”清晰自然。
- source_word: וְיֹתֶרֶת הַכָּבֵד
  choice: 以及肝叶
  rationale: יֹתֶרֶת הַכָּבֵד指附着于肝脏的特定部分，传统上常理解为肝叶；“肝叶”是简明且可理解的现代中文表达，同时不对其更精确的解剖对应作过度断定。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而清楚的祭祀条文语体。本节在句法上承接上一节，因此以“还有”起句。保留原文的清单结构，并在“遮盖内脏的脂肪”处适度补足隐含信息，以免直译成“遮盖物”造成误解。
