base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/018.yaml
  text: Then he slaughtered the ox and the ram[a], the sacrifice of peace offerings that was for the people. Aaron’s sons brought the blood to him, and he splashed it on the altar all around.
translation:
  language: zh_hans
  text: 随后，亚伦宰了公牛和公羊，就是为百姓献的平安祭[a]。亚伦的儿子们把血递给他，他就把血泼洒在祭坛四周。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“团契祭”或“福祉祭”。希伯来语 שְׁלָמִים 含有平安、完整、福祉和相交的意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁחַט
  choice: 随后，亚伦宰了
  rationale: 叙事性连续式推进事件次序，译作“随后”自然；“宰”准确表达献祭中的宰杀。希伯来文此处主语为代词，中文补出“亚伦”以避免跨句指代不清。
- source_word: הַשּׁוֹר וְאֶת הָאַיִל
  choice: 公牛和公绵羊
  rationale: שׁוֹר泛指牛类，但本章献祭语境指公牛；אַיִל明确指公绵羊。如此译法既符合上下文，也便于普通读者理解。
- source_word: זֶבַח הַשְּׁלָמִים
  choice: 平安祭
  rationale: 这是中文圣经语境中自然、庄重且简洁的传统术语，并保留该词与平安、完整及相交相关的语义联想；其他可能译法列于脚注。
- source_word: אֲשֶׁר לָעָם
  choice: 为百姓献的
  rationale: 介词短语在此表明祭物是代表百姓、为百姓而献；用简洁的定语结构表达关系。
- source_word: וַיַּמְצִאוּ ... אֵלָיו
  choice: 递给他
  rationale: 该动词在礼仪流程中表示把血交到主祭者手中；“递给”比泛泛的“带到”更贴合动作，也保持自然中文。
- source_word: וַיִּזְרְקֵהוּ
  choice: 把血泼洒
  rationale: זָרַק在献祭语境指将血抛洒、泼洒到祭坛上，不是轻微的点滴式“洒”；重复“血”可避免中文代词歧义。
- source_word: עַל הַמִּזְבֵּחַ סָבִיב
  choice: 在祭坛四周
  rationale: 保留עַל与סָבִיב的空间表达，说明血被施于祭坛周围各面，而不额外限定为仅在顶面或某一侧。
theological_decisions:
- issue: שְׁלָמִים的祭名及其神学意涵
  choice: 正文译作“平安祭”，脚注说明也可理解为“团契祭”或“福祉祭”
  alternative: 直接在正文译作“团契祭”或“福祉祭”
  rationale: 原词兼有平安、完整、福祉和共享相交的联想。正文采用成熟的中文祭礼术语，脚注保留其语义宽度，不把该祭单一化为某一种神学解释。
translation_notes:
  register: 采用现代、庄重而清楚的祭礼叙事语言。“宰”“献”“祭坛”“平安祭”保持经文体裁的礼仪色彩；句法简洁，适合普通现代汉语读者。
