  text: וַ/יִּשָּׂ֨א אַהֲרֹ֧ן אֶת יד/ו אֶל הָ/עָ֖ם וַֽ/יְבָרְכֵ֑/ם וַ/יֵּ֗רֶד מֵ/עֲשֹׂ֧ת הַֽ/חַטָּ֛את וְ/הָ/עֹלָ֖ה וְ/הַ/שְּׁלָמִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/022.yaml
  text: Then Aaron lifted up his hands toward the people and blessed them[a], and he came down from offering the sin offering, the burnt offering[c][b], and the peace offerings.
translation:
  language: zh_hans
  text: 亚伦向百姓举起双手[a]，祝福他们；献完赎罪祭[b]、燔祭和平安祭[c]后，他就下来了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文形式为单数“他的手”；这里通常理解为举起双手祝福。
    reason: lexical_alternative
  - marker: b
    text: “赎罪祭”或译“洁净祭”。
    reason: lexical_alternative
  - marker: c
    text: “平安祭”或译“团契祭”或“福祉祭”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׂא
  choice: 举起
  rationale: נשׂא与“手”连用，表示举起或抬起；“举起”自然地呈现祝福前的动作。
- source_word: יָדוֹ
  choice: 双手
  rationale: 马所拉文本的形式为单数“他的手”，但此处是祭司举手祝福的动作，汉语用“双手”更自然；原文单数保留在脚注中。
- source_word: אֶל הָעָם
  choice: 向百姓
  rationale: אֶל表示动作的方向；“向百姓”既准确又符合现代汉语表达。
- source_word: וַיְבָרְכֵם
  choice: 为他们祝福
  rationale: ברך的加强词干在此直接表示祝福；“为他们祝福”清楚、庄重。
- source_word: וַיֵּרֶד
  choice: 便走下坛来
  rationale: ירד意为下来或下去；结合献祭场景，所指很可能是从祭坛处下来。为使汉语明确自然，补出“坛”，但不赋予额外神学意义。
- source_word: מֵעֲשֹׂת
  choice: 献完
  rationale: 介词מִן接עשה的不定式，表示从已经完成的行动中下来；在献祭语境中，“献完”简洁地表达完成祭礼之后。
- source_word: הַחַטָּאת
  choice: 赎罪祭
  rationale: 这是利未记中固定的祭物术语。中文传统称“赎罪祭”，辨识度高；“洁净祭”所强调的功能性解释收入脚注。
- source_word: הָעֹלָה
  choice: 燔祭
  rationale: עֹלָה是全牲焚烧献上的祭，中文圣经惯用技术术语“燔祭”，简洁且保持经文间一致。
- source_word: הַשְּׁלָמִים
  choice: 平安祭
  rationale: שְׁלָמִים是技术性祭祀名称；“平安祭”是中文常用译名，并保留其与平安、福祉相关的词义联系。
theological_decisions:
- issue: 祭物名称的翻译
  choice: 正文采用“赎罪祭、燔祭、平安祭”
  alternative: “洁净祭、全燔祭、团契祭／福祉祭”
  rationale: 采用中文读者熟悉且能保持利未记内部一致性的祭祀术语，同时以脚注保存可能凸显祭物功能的其他译法，避免把单一功能解释写死在正文中。
- issue: 亚伦举手时的单复数
  choice: 正文译作“双手”
  alternative: 按希伯来语形式译作“他的一只手／他的手”
  rationale: 原文形式是单数，但祝福手势通常被理解为举双手。正文采用自然汉语表达，脚注明示形式上的歧义，不以译文遮蔽原文证据。
- issue: וַיֵּרֶד所指的下降地点
  choice: 译作“走下坛来”
  alternative: 较形式地译作“下来”
  rationale: 上下文表明亚伦刚完成祭坛上的献祭，因此“坛”是合理的语境补足；不过原文只说“下来”，故不进一步说明具体台阶或位置。
translation_notes:
  register: 采用现代、庄重而易懂的普通话书面语。“赎罪祭、燔祭、平安祭”保留利未记的技术性祭祀词汇；句序按希伯来叙事推进，并用“随后”“便”使中文关系清楚。
