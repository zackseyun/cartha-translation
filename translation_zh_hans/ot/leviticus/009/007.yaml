source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר מֹשֶׁ֜ה אֶֽל אַהֲרֹ֗ן קְרַ֤ב אֶל הַ/מִּזְבֵּ֨חַ֙ וַ/עֲשֵׂ֞ה אֶת חַטָּֽאתְ/ךָ֙ וְ/אֶת עֹ֣לָתֶ֔/ךָ וְ/כַפֵּ֥ר בַּֽעַדְ/ךָ֖ וּ/בְעַ֣ד הָ/עָ֑ם וַ/עֲשֵׂ֞ה אֶת קָרְבַּ֤ן הָ/עָם֙ וְ/כַפֵּ֣ר בַּֽעֲדָ֔/ם כַּ/אֲשֶׁ֖ר צִוָּ֥ה יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/007.yaml
  text: And Moses said to Aaron[a], “Come near to the altar, and offer your sin offering and your burnt offering, and make atonement for yourself and for the people. Then offer the people's offering, and make atonement for them, just as Yahweh commanded.”
translation:
  language: zh_hans
  text: 摩西对亚伦说：“你要上前到祭坛前，献上你的赎罪祭[a]和燔祭，为自己和百姓赎罪；然后献上百姓的供物，为他们赎罪，正如耶和华所吩咐的。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“洁净祭”。希伯来语חַטָּאת可指赎罪祭；在某些语境中，这一名称也突出除去礼仪性不洁的作用。
    reason: 保留该祭名在罪与洁净两方面的词义范围。
lexical_decisions:
- source_word: קְרַב אֶל הַמִּזְבֵּחַ
  choice: 走近祭坛
  rationale: 祈使式קְרַב在祭祀语境中表示上前、靠近；“走近祭坛”自然清楚，也保留对亚伦的直接命令。
- source_word: וַעֲשֵׂה
  choice: 献上
  rationale: עָשָׂה字面为“做、办理”，以祭物为宾语时指执行献祭礼；“献上”符合现代汉语的祭祀表达。
- source_word: חַטָּאתְךָ
  choice: 你的赎罪祭
  rationale: חַטָּאת在祭祀条例中指处理罪或不洁的祭物；“赎罪祭”是准确且通行的译名，另以脚注保留“洁净祭”这一侧重净化作用的译法。
- source_word: עֹלָתֶךָ
  choice: 你的燔祭
  rationale: עֹלָה在祭祀用语中指全然焚烧献上的祭物；“燔祭”是简明而稳定的术语。
- source_word: וְכַפֵּר
  choice: 赎罪
  rationale: כפר在祭司献祭语境中涉及遮盖、洁净及恢复关系；“赎罪”保留其宽广的礼仪和神学分量，不限定具体赎罪理论。
- source_word: בַּעַדְךָ וּבְעַד הָעָם
  choice: 为自己和百姓
  rationale: בְּעַד表达为了或代表某人；汉语“为”简洁自然，并可由献祭语境体现代表性。
- source_word: קָרְבַּן הָעָם
  choice: 百姓的供物
  rationale: קָרְבָּן是带来献给神之物的概称；“供物”保留其广义，不误限定为某一种祭。
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה
  choice: 照耶和华所吩咐的去做
  rationale: כַּאֲשֶׁר表示依照命令而行；“照……所吩咐的去做”在汉语中自然，并明确承接前述献祭行动。神名יהוה译作通行的中文圣经专名“耶和华”。
theological_decisions:
- issue: חַטָּאת在祭祀语境中的译法
  choice: 赎罪祭
  alternative: 洁净祭
  rationale: 该词既可关联罪，也可突出祭礼对不洁的净化作用。正文采用读者熟悉且符合本处语境的“赎罪祭”，脚注保留“洁净祭”，避免抹平词义张力。
- issue: כפר的表达
  choice: 赎罪
  alternative: 行洁净礼／施行遮盖
  rationale: 本节没有说明赎罪机制；采用宽广而传统的“赎罪”，既保留神学重量，也不强加特定理论。
- issue: 亚伦为自己和百姓赎罪的关系
  choice: 按原文并列保留“为自己和百姓赎罪”
  alternative: 将其解释为先后两个独立礼仪动作
  rationale: 原文将两个对象并列于同一个וְכַפֵּר之下；译文不额外判定具体祭物各自作用于哪一对象。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“赎罪祭”“燔祭”保留利未记的关键祭祀术语；“供物”则维持קָרְבָּן的概称性质。句式依照希伯来文的命令次序，以分号区分亚伦自己的祭与百姓的供物。
