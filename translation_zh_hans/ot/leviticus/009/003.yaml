  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/אֶל בְּנֵ֥י יִשְׂרָאֵ֖ל תְּדַבֵּ֣ר לֵ/אמֹ֑ר קְח֤וּ שְׂעִיר עִזִּים֙ לְ/חַטָּ֔את וְ/עֵ֨גֶל וָ/כֶ֧בֶשׂ בְּנֵי שָׁנָ֛ה תְּמִימִ֖ם לְ/עֹלָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/003.yaml
  text: And to the sons of Israel you shall speak[a], saying, ‘Take a male goat for a sin offering, and a calf and a lamb, each a year old, without blemish, for a burnt offering.’
translation:
  language: zh_hans
  text: 你要对以色列人说：‘你们要取一只公山羊作赎罪祭[a]，又取一头牛犊和一只羊羔；二者都要一岁大、没有瑕疵，作燔祭。’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“洁净祭”。在祭司礼仪语境中，希伯来语 חַטָּאת 可强调洁净、除污的作用。
    reason: 保留该祭名在祭司文献中的重要词义选择，避免“赎罪祭”成为唯一可能的理解。
lexical_decisions:
- source_word: וְ/אֶל
  choice: 你要对
  rationale: 希伯来语连词与介词承接上文，并引出面向以色列人的新指示；现代汉语以“对”自然表达受话对象，连接关系由上下文体现。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 这是指以色列群体的惯用称谓。“以色列人”在现代汉语中自然、准确，避免把希伯来语亲属表达机械译成“以色列的众子”。
- source_word: תְּדַבֵּר לֵאמֹר
  choice: 说
  rationale: 以“说”简洁传达指令性动词和引语公式；前面的“要”保留对摩西的指令语气，冒号直接引出话语内容。
- source_word: קְחוּ
  choice: 你们要取
  rationale: 复数命令式针对以色列群体；“取”保留 לקח 的基本义，不额外加入原文未明说的目的地含义。
- source_word: שְׂעִיר עִזִּים
  choice: 一只公山羊
  rationale: 该短语指雄性的山羊；“公山羊”是清楚、通行的现代汉语表达。
- source_word: לְחַטָּאת
  choice: 作赎罪祭
  rationale: 在祭祀条例中，该词指一种祭物类别。“赎罪祭”是中文圣经传统中最易辨识的名称，同时以脚注保留“洁净祭”这一有根据的理解。
- source_word: וְעֵגֶל
  choice: 又取一头牛犊
  rationale: עֵגֶל 的基本义是牛犊；补出“取”使并列结构在汉语中清楚流畅，而不改变原意。
- source_word: וָכֶבֶשׂ
  choice: 和一只羊羔
  rationale: כֶּבֶשׂ 指羊羔；“羊羔”比泛称“羊”更准确，并与随后的一岁年龄要求相称。
- source_word: בְּנֵי שָׁנָה
  choice: 都是一岁
  rationale: 原文为复数，兼指牛犊与羊羔；“都是”清楚表达其分配性修饰范围。
- source_word: תְּמִימִם
  choice: 没有残疾的
  rationale: 在献祭语境中指没有可导致不合格之缺陷；“没有残疾”比抽象的“完全”更准确易懂。
- source_word: לְעֹלָה
  choice: 作燔祭
  rationale: עֹלָה 是全牲焚烧献上的祭类。“燔祭”是准确且已为中文读者熟悉的礼仪术语。
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל 的群体称谓
  choice: 以色列人
  alternative: 以色列的众子／以色列子民
  rationale: 该表达在这里是盟约群体称谓。译作“以色列人”既涵盖所指群体，也符合现代汉语，不因希伯来语语法上的阳性复数而把命令范围不必要地限定为男性。
- issue: 祭祀语境中 חַטָּאת 的名称
  choice: 赎罪祭
  alternative: 洁净祭
  rationale: 该词既与罪有关，也可在祭司礼仪文本中突出除污、洁净功能。正文采用读者较熟悉的“赎罪祭”，脚注保留“洁净祭”，不消除原词的语义张力。
translation_notes:
  register: 采用现代、庄重而易懂的指令体。量词按现代汉语分别用“只”称山羊和羊羔、用“头”称牛犊；以“都是”明确“一岁、没有残疾”同时修饰牛犊和羊羔。脚注标记紧随所解释的“赎罪祭”。
