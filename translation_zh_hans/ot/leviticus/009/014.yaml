  text: וַ/יִּרְחַ֥ץ אֶת הַ/קֶּ֖רֶב וְ/אֶת הַ/כְּרָעָ֑יִם וַ/יַּקְטֵ֥ר עַל הָ/עֹלָ֖ה הַ/מִּזְבֵּֽחָ/ה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/014.yaml
  text: He washed the entrails and the lower legs[a], and he burned them on the altar, on top of the burnt offering.
translation:
  language: zh_hans
  text: 他洗净内脏和小腿，又把它们放在祭坛上的燔祭之上焚烧献上[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：又使它们在祭坛上、燔祭之上化为烟。
    reason: 原文动词在献祭语境中可特指把祭物焚烧，使其化为烟而献上。
lexical_decisions:
- source_word: וַיִּרְחַץ
  choice: 洗净
  rationale: רחץ在献祭语境中指用水洗；“洗净”既表达动作，也自然体现礼仪处理。
- source_word: הַקֶּרֶב
  choice: 内脏
  rationale: קֶרֶב在献祭条例中具体指牲畜的内部器官；“内脏”是现代汉语中准确、清楚的对应词。
- source_word: הַכְּרָעָיִם
  choice: 小腿
  rationale: כְּרָעַיִם指牲畜腿部较下方的部分，即胫腿；“小腿”比笼统的“腿”更保留其解剖范围。
- source_word: וַיַּקְטֵר
  choice: 焚烧献上
  rationale: קטר的使役形在祭司文献中不是泛指烧毁，而是指在祭坛上焚烧，使祭物化为烟而献上；“焚烧献上”兼顾实际动作和礼仪含义。
- source_word: עַל הָעֹלָה
  choice: 在燔祭之上
  rationale: עַל在此表示位于已经在祭坛上的燔祭上面；“在……之上”保留原文的空间关系。
- source_word: הָעֹלָה
  choice: 燔祭
  rationale: עֹלָה是整只焚烧献上的祭物；“燔祭”是准确且通行的现代中文圣经术语。
- source_word: הַמִּזְבֵּחָה
  choice: 祭坛上
  rationale: מִזְבֵּחַ意为祭坛，方向词尾结合上下文自然译为“在祭坛上”。
theological_decisions:
- issue: וַיַּקְטֵר的祭祀含义
  choice: 焚烧献上
  alternative: 焚烧；使之化为烟
  rationale: 正文既不把该词弱化为普通燃烧，也不采用汉语中较生硬的“使之化为烟”；脚注保留其字面及礼仪色彩。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“小腿”保留动物部位的具体含义；“焚烧献上”表达祭坛礼仪动作。脚注标记置于相关动词短语之后，避免误指“小腿”。
