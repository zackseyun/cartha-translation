  text: וְ/אֵ֣ת הֶ/חָז֗וֹת וְ/אֵת֙ שׁ֣וֹק הַ/יָּמִ֔ין הֵנִ֧יף אַהֲרֹ֛ן תְּנוּפָ֖ה לִ/פְנֵ֣י יְהוָ֑ה כַּ/אֲשֶׁ֖ר צִוָּ֥ה מֹשֶֽׁה׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/021.yaml
  text: And Aaron waved the breasts and the right thigh as a wave offering before Yahweh, just as Moses had commanded.
translation:
  language: zh_hans
  text: 亚伦把胸肉和右腿在雅威面前摇献，正如摩西所吩咐的。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֶחָזוֹת
  choice: 胸肉
  rationale: חָזֶה在献祭语境中指牲畜的胸部祭肉；此处虽为复数，汉语用集合性的“胸肉”更自然，也能准确指明祭物部位。
- source_word: שׁוֹק הַיָּמִין
  choice: 右腿
  rationale: שׁוֹק指腿部或大腿部位；“右腿”在现代汉语中自然清楚，并保留הַיָּמִין“右边的”这一限定。
- source_word: הֵנִיף ... תְּנוּפָה
  choice: 摇献
  rationale: 动词נוּף的使役式与同根名词תְּנוּפָה共同表示在雅威面前作礼仪性的摇动呈献。“摇献”简洁保留动作及其献祭术语性质，避免把原文未说明的具体动作方向说死。
- source_word: לִפְנֵי יְהוָה
  choice: 在雅威面前
  rationale: לִפְנֵי表示“在……面前／临在中”；将圣名יְהוָה音译为“雅威”，直接保留原文中的盟约之名。
- source_word: כַּאֲשֶׁר צִוָּה מֹשֶׁה
  choice: 正如摩西所吩咐的
  rationale: 该从句强调亚伦的行动完全依照摩西先前的命令；“正如……所吩咐的”符合现代汉语表达。
theological_decisions:
- issue: 圣名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华／上主
  rationale: 原文直接使用四字圣名。音译“雅威”保留其专名性质，不以称号替代；同时不引入额外的宗派性解释。
- issue: 摇献动作的具体形态
  choice: 仅译“摇献”
  alternative: 举献／前后摇动献上
  rationale: נוּף与תְּנוּפָה明确指礼仪性的摇献，但本节没有交代动作的具体方向或幅度，因此不作超出原文的解释。
translation_notes:
  register: 采用庄重、简明的现代标准普通话。“胸肉”比逐字复数“胸部们”自然；“摇献”作为献祭术语，兼顾原文形式与普通读者的可理解性。
