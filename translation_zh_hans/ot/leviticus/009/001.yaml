  text: And it happened on the eighth day that Moses called Aaron and his sons and the elders of Israel[a].
translation:
  language: zh_hans
  text: 第八天，摩西召来亚伦和他的儿子们，以及以色列的众长老[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “召来”也可译作“叫来”或“召集”；希伯来语动词在这里可表达这些相近的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: （不单独译出）
  rationale: 该叙事连接形式引入新的时间节点；现代汉语以句首“第八天”自然推进叙事，无须生硬译作“事情发生了”。
- source_word: בַּיּוֹם הַשְּׁמִינִי
  choice: 第八天
  rationale: 忠实表达原文的时间短语，不增添“在那以后”等上下文说明。
- source_word: קָרָא
  choice: 召来
  rationale: 此处动词可表示“叫”或“召集”；“召来”既符合摩西请相关人员前来的语境，也保持自然庄重的现代汉语。
- source_word: לְאַהֲרֹן
  choice: 亚伦
  rationale: 采用现代中文圣经传统中通行的人名音译。
- source_word: וּלְבָנָיו
  choice: 和他的儿子们
  rationale: 祭司承接的语境表明 בנים 特指亚伦的男性后代；复数“儿子们”准确反映原文。
- source_word: וּלְזִקְנֵי יִשְׂרָאֵל
  choice: 以及以色列的众长老
  rationale: 该结构指以色列中具有代表和领导身份的长老；“众长老”清楚体现复数，并符合庄重的现代汉语。
