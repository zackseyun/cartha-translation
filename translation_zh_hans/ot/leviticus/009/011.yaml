  yaml_path: translation/ot/leviticus/009/011.yaml
  text: But the flesh and the hide he burned with fire outside the camp[a].
translation:
  language: zh_hans
  text: 但他在营外用火焚烧了肉和皮。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“至于肉和皮，他在营外用火焚烧。”
    reason: וְ可按上下文译作“但”以显示与上一节坛上焚烧的对比，也可较中性地处理为话题转换；原文语序将“肉和皮”置于动词之前。
lexical_decisions:
- source_word: וְ/אֶת
  choice: 但
  rationale: וְ本可译作“和/并且”；结合上一节把祭物烧在坛上的动作，本节转述在营外焚烧其余部分，译作“但”自然显出对比。אֵת是宾语标记，不另译。
- source_word: הַ/בָּשָׂר
  choice: 那肉
  rationale: בָּשָׂר指动物的肉体或肉；现代汉语祭牲语境中“肉”清楚自然，“那”承接前文所述祭牲。
- source_word: הָ/ע֑וֹר
  choice: 皮
  rationale: עוֹר指动物的皮；“皮”简洁准确，也比“皮肤”更适合祭牲语境。
- source_word: שָׂרַף
  choice: 烧
  rationale: 该动词表示焚烧；“烧”忠实保留动作本身，不额外加入“烧尽”等完成意味。
- source_word: בָּ/אֵשׁ
  choice: 用火
  rationale: 介词בְ在此可表示手段，“用火”是自然的现代汉语表达；也可理解为“在火中”。
- source_word: מִ/ח֖וּץ לַֽ/מַּחֲנֶֽה
  choice: 在营外
  rationale: 该短语表示以色列营地之外的位置；“在营外”简明自然，并保留礼仪空间上的意义。
theological_decisions:
- issue: 献祭语境中的焚烧处置
  choice: 具体直译为把肉和皮用火烧在营外，不加入象征性解释。
  alternative: 在译文中凸显后续经文或预表性关联。
  rationale: 本节直接记述祭司执行献祭礼仪的步骤；译文应忠实呈现希伯来文本中的具体行动，不把后来的神学解释写入正文。
translation_notes:
  register: 采用庄重而易懂的现代标准普通话。“但”承接上下文的对比；“肉和皮”“用火”“营外”保持祭祀动作具体清楚。脚注保留介词及语篇连接上的可译空间。
