base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/023.yaml
  text: Moses and Aaron went into the tent of meeting, and when they came out, they blessed the people. Then the glory of Yahweh appeared to all the people.
translation:
  language: zh_hans
  text: 摩西和亚伦进了会幕，出来后为百姓祝福。耶和华的荣耀向全体百姓显现。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֹהֶל מוֹעֵד
  choice: 会幕
  rationale: 这是现代中文圣经语境中自然、庄重且广为理解的固定译法；在本节指以色列人与上帝相会的圣所帐幕。
- source_word: וַיָּבֹא ... וַיֵּצְאוּ
  choice: 进了……出来后
  rationale: 按上下文将并列主语“摩西和亚伦”视为两个动作的共同执行者；用自然中文保留动作的先后次序，而不增添因果关系。
- source_word: וַיְבָרֲכוּ
  choice: 为……祝福
  rationale: 直接表达祝福这一行为，不额外规定祝福的具体形式或内容。
- source_word: הָעָם / כָּל הָעָם
  choice: 百姓／全体百姓
  rationale: 此处指聚集的以色列群体；“百姓”符合中文叙事语体，“全体”准确表达כָּל。
- source_word: כְבוֹד יְהוָה
  choice: 耶和华的荣耀
  rationale: “荣耀”保留כָּבוֹד在神显语境中可见威荣的含义；神名按其专名译作“耶和华”。
- source_word: וַיֵּרָא
  choice: 显现
  rationale: 该尼法勒形式在这里表示可见的彰显；“显现”自然体现神显语境，又不补入显现的具体形态。
- source_word: אֶל כָּל הָעָם
  choice: 向全体百姓
  rationale: “向”自然对应显现所面向或临到的对象，不添加“在眼前”等原文未明说的细节。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威／上主
  rationale: 原文明确使用四字神名；正文采用现代简体中文圣经读者熟悉的专名“耶和华”，避免以称号取代专名。
- issue: 末句与前文的时序关系
  choice: 随即
  alternative: 并且／然后
  rationale: 连续的wayyiqtol叙事形式表达事件推进；“随即”清楚呈现紧接发生的次序，但不把它强化为因果关系。
- issue: וַיָּבֹא单数形式与复合主语
  choice: 摩西和亚伦都进了会幕
  alternative: 只有摩西进入，亚伦仅在后续动作中出现
  rationale: 虽然动词形式为单数，但其前置谓语之后接复合主语，且随后的动词使用复数；按希伯来叙事句法，自然理解为摩西和亚伦共同进入。
translation_notes:
  register: 采用现代、庄重而易懂的叙事中文。“会幕”“耶和华的荣耀”保留礼仪与神显语境中的传统术语；分成两句以避免连续多个“又”造成生硬，同时忠实呈现动作顺序。
