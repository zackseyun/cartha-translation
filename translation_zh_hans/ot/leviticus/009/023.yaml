  naturalness: 整体庄重自然。“出来后为百姓祝福”在现代汉语中清晰顺畅，并足以表达动作先后，无须加“就”或“随即”。
  terminology: “会幕”“百姓”“耶和华的荣耀”“显现”均为准确、通行且符合本段礼仪与神显语境的译法。“向全体百姓”恰当保留显现面向全体民众的意思。
