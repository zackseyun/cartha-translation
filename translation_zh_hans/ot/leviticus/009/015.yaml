  text: וַ/יַּקְרֵ֕ב אֵ֖ת קָרְבַּ֣ן הָ/עָ֑ם וַ/יִּקַּ֞ח אֶת שְׂעִ֤יר הַֽ/חַטָּאת֙ אֲשֶׁ֣ר לָ/עָ֔ם וַ/יִּשְׁחָטֵ֥/הוּ וַֽ/יְחַטְּאֵ֖/הוּ כָּ/רִאשֽׁוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/015.yaml
  text: Then he presented the people's offering[a], and he took the goat of the sin offering that was for the people, and slaughtered it and offered it for sin, as with the first one.
translation:
  language: zh_hans
  text: 随后，他献上百姓的供物，又取来那只为百姓作赎罪祭的公山羊，把它宰了，照先前的方式把它献作赎罪祭[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “献作赎罪祭”也可译为“用它施行洁净、除污的礼仪”。这里的希伯来语动词在祭司礼仪中也可含有洁净、除去污秽的意思。
    reason: 保留וַיְחַטְּאֵהוּ在赎罪祭礼仪语境中的词义歧义。
lexical_decisions:
- source_word: וַיַּקְרֵב
  choice: 献上
  rationale: 使役词干在献祭语境中指把祭物带近并呈献；“献上”符合现代汉语礼仪语境，同时不把它泛化为整套献祭程序。
- source_word: קָרְבַּן הָעָם
  choice: 百姓的供物
  rationale: קָרְבָּן是带到上帝面前的泛称祭物；“供物”自然简洁，并保留其类别未具体说明这一点。
- source_word: שְׂעִיר הַחַטָּאת
  choice: 作赎罪祭的公山羊
  rationale: שְׂעִיר指公山羊，חַטָּאת在此献祭语境中指赎罪祭；此译法明确牲畜及其祭物用途。
- source_word: אֲשֶׁר לָעָם
  choice: 为百姓
  rationale: 介词ל在此表示这祭牲是为百姓、代表百姓而指定，不只是归百姓所有。
- source_word: וַיִּשְׁחָטֵהוּ
  choice: 把它宰了
  rationale: שׁחט是宰杀祭牲的常用动词；“宰”准确保留祭牲语境。
- source_word: וַיְחַטְּאֵהוּ
  choice: 献作赎罪祭
  rationale: חטא的Piel形在祭司礼仪语境中可指执行赎罪祭或洁净除罪的礼仪。正文采用自然的功能性表达，脚注保留“洁净／除污”的词义可能。
- source_word: כָּרִאשׁוֹן
  choice: 照先前那一只办理
  rationale: 此短语回指本章先前献上的赎罪祭牲，并表明按同样方式处理；“先前那一只”比抽象的“起初”更贴合上下文。
theological_decisions:
- issue: חַטָּאת在献祭语境中的含义
  choice: 赎罪祭
  alternative: 罪
  rationale: 上下文明指祭牲和献祭程序，因此这里是祭物名称，而非抽象的“罪”。
- issue: וַיְחַטְּאֵהוּ的礼仪含义
  choice: 正文译为“献作赎罪祭”，并以脚注说明也可理解为执行洁净、除污的礼仪
  alternative: 使它洁净；用它除污；用它赎罪
  rationale: 直接译成“使它洁净”容易让读者误以为被洁净的是公山羊本身；“用它赎罪”则加入了该动词在此未明确表达的专门神学术语。正文保留祭礼功能，脚注呈现真实的词义张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“供物”保留קָרְבָּן的一般性；“公山羊”准确表达性别；以“照先前那一只办理”自然回指前述赎罪祭牲。脚注标记置于相关分句末，避免打断正文。
