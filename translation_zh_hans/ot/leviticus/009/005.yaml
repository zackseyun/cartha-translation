id: LEV.9.5
reference: Leviticus 9:5
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יִּקְח֗וּ אֵ֚ת אֲשֶׁ֣ר צִוָּ֣ה מֹשֶׁ֔ה אֶל פְּנֵ֖י אֹ֣הֶל מוֹעֵ֑ד וַֽ/יִּקְרְבוּ֙ כָּל הָ֣/עֵדָ֔ה וַ/יַּֽעַמְד֖וּ לִ/פְנֵ֥י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/005.yaml
  text: So they brought what Moses had commanded to the front of the tent of meeting, and all the congregation came near and stood before Yahweh.
translation:
  language: zh_hans
  text: 于是，他们把摩西所吩咐的带到会幕前；全会众都走近，站在雅威面前。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְחוּ
  choice: 他们把……带到
  rationale: לקח通常意为“拿、取”，但本句有目的地“会幕前”，译作“带到”更自然，也准确表达物品被移至该处。
- source_word: אֵת אֲשֶׁר צִוָּה מֹשֶׁה
  choice: 摩西所吩咐的
  rationale: 原文以宾语标记加关系从句，指前文规定预备的祭牲和素祭等物；保留概括表达，不擅自在正文中逐项补明。
- source_word: אֶל־פְּנֵי
  choice: 到……前
  rationale: 这里是空间方位，指会幕前方；译文用“到会幕前”与后面的“在雅威面前”形成自然区别。
- source_word: אֹהֶל מוֹעֵד
  choice: 会幕
  rationale: “会幕”是现代中文圣经语域中通行且简洁的名称，表达作为相会之帐幕的专门含义。
- source_word: וַיִּקְרְבוּ
  choice: 走近
  rationale: קרב表示接近；“走近”清楚传达会众向圣所方向靠近的动作，同时避免过度礼仪化。
- source_word: כָּל־הָעֵדָה
  choice: 全会众
  rationale: עֵדָה在祭司传统语境中指以色列共同体；“全会众”既简洁，又保留群体和敬拜场景。
- source_word: וַיַּעַמְדוּ
  choice: 站
  rationale: עמד在此直接表示站立；无需增加“肃立”之类原文未明说的姿态。
- source_word: לִפְנֵי יְהוָה
  choice: 在雅威面前
  rationale: 该短语兼具空间和敬拜含义；“在……面前”保留二者，而“雅威”直接音译原文的神圣名字。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名。译作“雅威”能在现代普通话中较直接地保留这一盟约名字，而不以称号替代；同时不采用较传统但语音依据较弱的“耶和华”。
- issue: “站在雅威面前”的含义
  choice: 保留空间与敬拜意义的重叠
  alternative: 明确译为“站在雅威的临在中”或“站在雅威面前敬拜”
  rationale: לִפְנֵי既可指实际方位，也可表达处于神面前的礼仪关系；原文没有单独出现“敬拜”或抽象的“临在”，因此不将张力单向解释。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准普通话。“于是”承接叙事；分号呈现两个连续动作组。“会幕”为通行专名，“雅威”保留神名。正文不添加原文未明说的祭物清单或敬拜动作。
