  text: And he presented the burnt offering and offered it according to the ordinance[a].
translation:
  language: zh_hans
  text: 他呈上燔祭，按既定的规例办理这祭礼[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“照规定的方式办理。”
    reason: 词语 כַּמִּשְׁפָּט 可指既定的规范，也可指按该规范所定的程序或方式。
lexical_decisions:
- source_word: וַיַּקְרֵב
  choice: 献上
  rationale: 使役词形的基本意思是“使靠近、带到近前”；在献祭语境中，“献上”自然表达把祭物带到坛前呈献的动作，又不必机械译作“带近”。
- source_word: הָעֹלָה
  choice: 燔祭
  rationale: עֹלָה是利未记中指全牲焚烧之祭的固定术语；“燔祭”是简明、通行且庄重的中文对应。
- source_word: וַיַּעֲשֶׂהָ
  choice: 办理
  rationale: עָשָׂה本义宽泛，可指“做、施行”；这里指按礼仪完成这项祭礼。“办理”保留其概括性，避免擅自缩窄为某一个具体献祭步骤。
- source_word: כַּמִּשְׁפָּט
  choice: 照规定
  rationale: מִשְׁפָּט在此指既定的礼仪规范或程序。“照规定”既保留规范性，也符合现代汉语表达。
