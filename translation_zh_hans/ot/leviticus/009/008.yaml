base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/008.yaml
  text: Then Aaron came near to the altar and slaughtered the calf of the sin offering that was for himself[a].
translation:
  language: zh_hans
  text: 于是，亚伦走近祭坛，宰了那只为自己献作赎罪祭[a]的牛犊。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“洁净祭”。希伯来语 חטאת 可指与罪有关、并用于除去污秽的祭。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרַב
  choice: 走近
  rationale: 表示亚伦实际走到祭坛近前；“走近”自然、具体，也符合礼仪场景。
- source_word: הַמִּזְבֵּחַ
  choice: 祭坛
  rationale: מזבח在献祭语境中的标准对应词。
- source_word: וַיִּשְׁחַט
  choice: 宰了
  rationale: שחט指宰杀祭牲；“宰”比泛指的“杀”更准确，也符合现代汉语表达。
- source_word: עֵגֶל
  choice: 牛犊
  rationale: עגל指幼牛；“牛犊”清楚自然，并与本章前文所指定的祭牲一致。
- source_word: הַחַטָּאת
  choice: 赎罪祭
  rationale: 此处חטאת指一种祭物或祭类；“赎罪祭”是现代中文圣经语境中清楚而通行的名称，同时以脚注保留“洁净祭”所强调的除污功能。
- source_word: אֲשֶׁר לוֹ
  choice: 为自己献作
  rationale: 直译可作“属于他的”，但上下文表明这是亚伦为自己所献的祭；此译自然地表达其祭祀功能，并与随后为百姓献的祭形成对照。
theological_decisions:
- issue: 祭司礼仪语境中חטאת的译法
  choice: 赎罪祭
  alternative: 洁净祭
  rationale: חטאת既与罪有关，也可在祭司文献中突出除去礼仪污秽、恢复洁净的作用。正文采用通行且容易理解的“赎罪祭”，脚注保留“洁净祭”，避免把该祭的功能只限定为一种解释。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“于是”承接连续动作；“走近祭坛，宰了……”保持原文简洁的动作推进。脚注标记已置于“赎罪祭”之后，使其所指明确。
