base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/010.yaml
  text: And the fat[a], the kidneys, and the lobe of the liver from the sin offering he turned into smoke on the altar, just as Yahweh had commanded Moses.
translation:
  language: zh_hans
  text: 他把赎罪祭[a]的脂油、两腰子和肝叶放在祭坛上焚烧成烟，正如雅威所吩咐摩西的那样。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“洁净祭”。希伯来语这个词既可强调处理罪，也可强调除去污秽、恢复洁净。
    reason: alternative_reading
lexical_decisions:
- source_word: חֵלֶב
  choice: 脂油
  rationale: 在献祭语境中指献给上帝的脂肪部分；“脂油”既贴近原文，也符合中文祭祀语体。
- source_word: כְּלָיֹת
  choice: 两腰子
  rationale: 原文为复数，指祭牲的两个肾脏；“两腰子”保留具体的解剖细节，也沿用清楚易懂的圣经用语。
- source_word: יֹּתֶרֶת מִן־הַכָּבֵד
  choice: 肝叶
  rationale: 该短语指与肝相连并在献祭时取下的突出部分；具体解剖所指并不完全确定，“肝叶”简洁自然，且避免过度限定。
- source_word: חַטָּאת
  choice: 赎罪祭
  rationale: 这是该祭类最通行、最易识别的中文名称；其也可能侧重洁净功用，故在脚注保留“洁净祭”这一译法。
- source_word: הִקְטִיר
  choice: 焚烧成烟
  rationale: 该词在献祭语境中特指使祭物在坛上化为烟上升，不只是一般的焚烧；“焚烧成烟”保留这一礼仪含义。
- source_word: הַמִּזְבֵּחָה
  choice: 放在祭坛上
  rationale: 原词带方向词尾，与“焚烧成烟”连用时表示把祭物带到坛上焚烧；此译法在现代中文中自然清楚。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以音译呈现四字神名，保留其作为以色列上帝之专名的性质，而不以称号替代。
theological_decisions:
- issue: 献祭律例中 חַטָּאת 的译法
  choice: 赎罪祭
  alternative: 洁净祭
  rationale: 该词既与罪有关，也可突出除去礼仪污秽、恢复洁净的功能。正文采用通行的“赎罪祭”，脚注保留另一种有根据的理解，不消除原词的功能张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。将祭物所属关系前置为“赎罪祭的……”，避免连续使用“从……中”的生硬结构；保留主语“他”，不把上下文中的亚伦直接补入正文。脚注标记置于其实际说明的“赎罪祭”之后。
