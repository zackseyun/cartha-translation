  text: וְ/שׁ֨וֹר וָ/אַ֜יִל לִ/שְׁלָמִ֗ים לִ/זְבֹּ֨חַ֙ לִ/פְנֵ֣י יְהוָ֔ה וּ/מִנְחָ֖ה בְּלוּלָ֣ה בַ/שָּׁ֑מֶן כִּ֣י הַ/יּ֔וֹם יְהוָ֖ה נִרְאָ֥ה אֲלֵי/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/004.yaml
  text: and an ox and a ram for peace offerings[a], to sacrifice before Yahweh, and a grain offering mixed with oil[b]; for today Yahweh will appear to you.
translation:
  language: zh_hans
  text: 又要带一头牛和一只公绵羊，作平安祭[a]，在耶和华[b]面前献上；并带一份用油调和的谷物祭；因为今天耶和华要向你们显现。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “平安祭”也可译作“团契祭”或“福祉祭”。
    reason: lexical_alternative
  - marker: b
    text: “耶和华”所译的是希伯来文神名 יהוה（YHWH）；也常拟音为“雅威”。
    reason: lexical_alternative
lexical_decisions:
- source_word: שׁוֹר
  choice: 牛
  rationale: 该词泛指牛类祭牲，本处不强行限定为公牛；量词“一头”使现代汉语表达自然。
- source_word: אַיִל
  choice: 公绵羊
  rationale: 该词明确指成年雄性绵羊；“公绵羊”比单说“羊”更准确，也比音译或生僻祭仪用语更易懂。
- source_word: שְׁלָמִים
  choice: 平安祭
  rationale: 这是利未记中的专门祭名，涵盖平安、福祉及共享团契等含义；正文采用中文圣经传统中较熟悉的“平安祭”，脚注保留其他可能表达。
- source_word: לִזְבֹּחַ
  choice: 献
  rationale: 在祭祀语境中，该动词既涉及宰杀，也指作为祭物献上；“献”自然传达礼仪功能，而不把意义缩减为物理性的宰杀。
- source_word: לִפְנֵי יְהוָה
  choice: 在耶和华面前
  rationale: 忠实保留“在……面前／临在中”的空间及敬拜含义，并将神名作为专名表达。
- source_word: מִנְחָה
  choice: 谷物祭
  rationale: 在利未记祭祀条例中，此词特指以谷物制品为主的祭物；“谷物祭”比传统“素祭”更直接，避免现代读者误解为泛指素食祭品。
- source_word: בְּלוּלָה בַשָּׁמֶן
  choice: 调油的
  rationale: 表示谷物祭用油拌和；“调油的”简洁自然，并保留其制备方式。
- source_word: כִּי הַיּוֹם
  choice: 因为今天
  rationale: כִּי在此引出吩咐献祭的理由，הַיּוֹם强调显现就在当天。
- source_word: נִרְאָה אֲלֵיכֶם
  choice: 要向你们显现
  rationale: 虽为尼法勒完成式，语境指即将发生的神显，因此用“要……显现”表达临近的将来，同时不增添原文未出现的“荣耀”。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威；上主
  rationale: 原文直接使用四字神名。正文采用普通中文读者熟悉的专名“耶和华”，而不以称号取代；脚注说明其所对应的希伯来文神名及另一常见拟音。
- issue: 神显陈述的主体与时态
  choice: 今天耶和华要向你们显现
  alternative: 今天耶和华的荣耀要向你们显现；今天耶和华已经向你们显现
  rationale: 本节原文的主语是耶和华本身，并没有“荣耀”一词，故不从邻近经文补入；结合上下文，将完成式理解为即将实现的神显。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以“谷物祭”替代较易引起现代误解的“素祭”；保留“平安祭”这一较熟悉的祭名，并用脚注呈现其语义范围。句式延续献祭清单的结构，用“又要带……并带……”体现本节与上文相连。
