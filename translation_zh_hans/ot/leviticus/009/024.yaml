base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/024.yaml
  text: And fire came out from before Yahweh and consumed on the altar the burnt offering and the fat portions[a]. And all the people saw[b], and they shouted for joy and fell on their faces.
translation:
  language: zh_hans
  text: 火从雅威面前发出[a]，烧尽了祭坛上的燔祭和脂油。全体百姓看见了，就欢呼[b]，俯伏在地。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“从雅威的同在中”；希伯来语直译为“从雅威面前”。
    reason: 说明该介词短语可按“雅威面前”的空间意象直译，也可按其所指的神圣同在作解释性翻译。
  - marker: b
    text: 也可译作“发出喜乐的呼喊”。
    reason: רנן可指带有喜乐的高声呼喊；脚注保留该词的语义幅度。
lexical_decisions:
- source_word: וַתֵּצֵא אֵשׁ
  choice: 有火……出来
  rationale: יצא描写火向外发出；“有火……出来”在现代汉语中自然，并保留叙事的突发感。
- source_word: מִלִּפְנֵי יְהוָה
  choice: 从雅威面前
  rationale: לִפְנֵי字面为“在……面前”，这里表示火从雅威所在之处发出；采用“雅威”音译神名יְהוָה。
- source_word: וַתֹּאכַל
  choice: 烧尽了
  rationale: 该动词本义为“吃、吞吃”，以火为主语时，“烧尽”准确而自然地表达祭物被完全吞噬。
- source_word: עַל הַמִּזְבֵּחַ
  choice: 祭坛上的
  rationale: 自然表达祭物所在的位置，并保持其与“燔祭和脂油”的修饰关系。
- source_word: הָעֹלָה
  choice: 燔祭
  rationale: 这是עֹלָה在献祭语境中的标准汉语术语，指献上焚烧的祭物。
- source_word: הַחֲלָבִים
  choice: 脂油
  rationale: 复数形式在献祭语境中特指献给神的规定脂肪部分；“脂油”简洁且符合礼仪语境。
- source_word: וַיַּרְא כָּל הָעָם
  choice: 全体百姓看见了
  rationale: 直接保留主语的整体性及“看见”这一叙事动作。
- source_word: וַיָּרֹנּוּ
  choice: 欢呼
  rationale: רנן在此指因喜乐而发出的响亮呼声；“欢呼”兼顾喜乐和出声两层含义，不将其限定为歌唱。
- source_word: וַיִּפְּלוּ עַל פְּנֵיהֶם
  choice: 面伏于地
  rationale: 保留希伯来语“俯伏在自己脸上”的具体姿态，同时以庄重而易懂的现代汉语表达敬畏中的俯伏。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”较贴近学界通常重建的读音，也避免以称号替代专名。
- issue: 百姓欢呼与俯伏并列所表达的反应
  choice: 同时保留喜乐的欢呼和敬畏的俯伏
  alternative: 将欢呼解释为单纯赞美或将俯伏解释为单纯恐惧
  rationale: 原文只并列叙述两种动作，没有说明其确切心理或礼仪性质，因此不额外限定其神学含义。
translation_notes:
  register: 采用现代、庄重且便于普通读者理解的叙事语言。“燔祭”“祭坛”“脂油”保留必要的献祭术语；“面伏于地”既呈现原文身体姿态，又避免过度解释为特定礼仪。
