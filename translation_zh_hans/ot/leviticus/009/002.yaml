  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֶֽל אַהֲרֹ֗ן קַח לְ֠/ךָ עֵ֣גֶל בֶּן בָּקָ֧ר לְ/חַטָּ֛את וְ/אַ֥יִל לְ/עֹלָ֖ה תְּמִימִ֑ם וְ/הַקְרֵ֖ב לִ/פְנֵ֥י יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/002.yaml
  text: And he said to Aaron[a], “Take for yourself a calf, a son of the herd, for a sin offering, and a ram for a burnt offering, both without blemish, and present them before Yahweh.”
translation:
  language: zh_hans
  text: 他对亚伦说：“你要为自己取一头牛犊[a]作赎罪祭，一只公绵羊作燔祭；两只都须没有残疾。你要把它们呈献在雅威面前。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译“牛犊，牛群之子”，即一头幼牛。
    reason: 说明原文同位结构及所指动物，同时保持正文自然简明。
lexical_decisions:
- source_word: וַיֹּאמֶר אֶל־אַהֲרֹן
  choice: 他对亚伦说
  rationale: 保留希伯来叙事的承接关系，并以“他”保留原文主语所依赖的上文指代。
- source_word: קַח לְךָ
  choice: 你要为自己取
  rationale: 命令式译为“你要……”，并用“为自己”表达 לְךָ 的反身及切身关联意味。
- source_word: עֵגֶל בֶּן־בָּקָר
  choice: 一头牛犊
  rationale: 按现代汉语自然表达译出所指的幼牛；原文“牛犊，牛群之子”的同位结构在脚注中说明。
- source_word: לְחַטָּאת
  choice: 作赎罪祭
  rationale: 在献祭语境中，חַטָּאת 指处理罪的祭物或祭礼，采用汉语圣经传统且易懂的术语“赎罪祭”。
- source_word: וְאַיִל לְעֹלָה
  choice: 一只公绵羊作燔祭
  rationale: אַיִל 指成年公绵羊；עֹלָה 是整只焚烧献上的祭，译作惯用术语“燔祭”。
- source_word: תְּמִימִם
  choice: 两只都须没有残疾
  rationale: 复数形容词同时修饰牛犊和公绵羊；“两只都”明确其复数范围，“没有残疾”自然表达祭牲完整无瑕的要求。
- source_word: וְהַקְרֵב
  choice: 你要把它们呈献
  rationale: קרב 的使役式在礼仪语境中表示带近、呈上；“呈献”既体现礼仪行为，又不提前等同于随后具体执行的宰杀和焚献程序。
- source_word: לִפְנֵי יְהוָה
  choice: 在雅威面前
  rationale: לִפְנֵי 表示来到其面前或临在中；“雅威”直接音译四字神名，区别于以称号替代。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名。采用较贴近通行学术重构读音 Yahweh 的“雅威”，既保留专名性质，也避免用称号“上主”取代原文神名。
- issue: חַטָּאת 的祭祀含义
  choice: 赎罪祭
  alternative: 洁净祭；除罪祭
  rationale: 该词在本节明确指祭牲及其礼仪用途。“赎罪祭”是现代中文读者较熟悉的祭名；同时不在正文中额外限定其作用仅为道德罪责或仅为礼仪洁净。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。保留祭祀专门用语“赎罪祭”“燔祭”，以“呈献在……面前”体现礼仪场景，并避免把 וְהַקְרֵב 过度解释为已经完成献祭。
