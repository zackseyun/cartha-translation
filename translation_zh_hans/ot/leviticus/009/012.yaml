  text: וַ/יִּשְׁחַ֖ט אֶת הָ/עֹלָ֑ה וַ֠/יַּמְצִאוּ בְּנֵ֨י אַהֲרֹ֤ן אֵלָי/ו֙ אֶת הַ/דָּ֔ם וַ/יִּזְרְקֵ֥/הוּ עַל הַ/מִּזְבֵּ֖חַ סָבִֽיב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/012.yaml
  text: Then he slaughtered the burnt offering[a], and Aaron’s sons brought the blood to him, and he splashed it against the altar on all sides.
translation:
  language: zh_hans
  text: 随后，他宰了燔祭牲。亚伦的儿子们把血递给他，他就把血泼向祭坛四面[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“把血洒在祭坛四周”。这里的希伯来语动词表示有力地抛洒，并不是轻轻喷洒。
    reason: 说明献祭语境中זרק的动作力度，并保留较传统的译法。
lexical_decisions:
- source_word: וַיִּשְׁחַט
  choice: 随后，他宰了
  rationale: שׁחט在献祭语境中指宰杀祭牲；“随后”自然表达叙事中的动作推进。
- source_word: הָעֹלָה
  choice: 燔祭牲
  rationale: עֹלָה是整只焚烧献上的祭物；“燔祭牲”既沿用通行祭祀术语，也明确这里被宰的是祭牲。
- source_word: וַיַּמְצִאוּ ... אֵלָיו אֶת־הַדָּם
  choice: 把血递给他
  rationale: 该表达在此指亚伦的儿子们把血送交亚伦，供他施血；“递给”贴合近距离礼仪操作，也比泛泛的“带到”更自然。
- source_word: וַיִּזְרְקֵהוּ
  choice: 把血泼向
  rationale: זרק在献祭礼仪中表示将血有力地抛洒到祭坛上，并非轻微喷洒；“泼向”在现代汉语中能较好体现动作的力度和方向。
- source_word: עַל הַמִּזְבֵּחַ סָבִיב
  choice: 祭坛四面
  rationale: עַל与סָבִיב合起来表示血施在祭坛周围各面；“祭坛四面”避免被误解为只洒在祭坛周边的地面上。
theological_decisions: []
translation_notes:
  register: 采用庄重而易懂的现代标准普通话。以“燔祭牲”保留利未记的礼仪术语，用“泼向祭坛四面”清楚呈现血是施于祭坛各面的动作。
