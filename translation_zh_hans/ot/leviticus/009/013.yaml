base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/013.yaml
  text: And they brought the burnt offering to him[a], piece by piece, and the head[b]; and he burned them on the altar.
translation:
  language: zh_hans
  text: 他们把燔祭的各块和头递给他；他就在祭坛上焚烧。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָעֹלָה
  choice: 燔祭
  rationale: 这是《利未记》中 עֹלָה 的常用祭祀术语，指在祭坛上焚烧献上的祭物；“燔祭”简洁、庄重，并为现代中文圣经读者所熟悉。
- source_word: הִמְצִיאוּ אֵלָיו
  choice: 递给他
  rationale: 此处使役式表达把祭物送到亚伦面前；上下文是协助者将各部分交给亚伦处理，因此“递给他”比泛泛的“带到他那里”更贴合动作次序。
- source_word: לִנְתָחֶיהָ
  choice: 一块一块地
  rationale: נֶתַח 指宰杀后切开的块段，带 ל 的形式在此表达按各块分别交付；这一译法自然呈现逐块递交的意思。
- source_word: הָרֹאשׁ
  choice: 头
  rationale: 按原文保留明确的解剖部位；原文把头与其他切块并列区分。
- source_word: וַיַּקְטֵר
  choice: 烧在祭坛上，献为馨香的烟
  rationale: קטר 在祭祀语境中并非仅指普通焚烧，而是把祭物烧在坛上，使其烟气升腾献上；正文兼顾具体动作和礼仪含义。
- source_word: עַל הַמִּזְבֵּחַ
  choice: 在祭坛上
  rationale: 直译并符合现代汉语的自然表达。
theological_decisions:
- issue: קטר 的祭祀含义
  choice: 烧在祭坛上，献为馨香的烟
  alternative: 烧在祭坛上
  rationale: 原动词带有焚烧祭物、使烟上腾的礼仪意义；译文不把它弱化为普通燃烧。“馨香”在此用于表达祭祀性焚烧，但因该词并非本节明说，设置脚注说明。
translation_notes:
  register: 采用现代、庄重而易懂的祭祀叙事语体。“燔祭”“祭坛”保留已经稳定的经文术语；“一块一块地递给他”清楚呈现祭物各部分依次交给亚伦的动作。
