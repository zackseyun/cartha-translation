base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/017.yaml
  text: Then he presented the grain offering[a], filled his hand from it, and burned it on the altar, besides the morning burnt offering.
translation:
  language: zh_hans
  text: 接着，他献上素祭[a]，从其中取了一把，烧在祭坛上；此外还有早晨的燔祭。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “从其中取了一把”，原文直译为“从其中装满他的手掌”，指用手取出一份素祭，放在祭坛上焚烧。
    reason: 说明原文的具体表达及其祭祀语境。
lexical_decisions:
- source_word: וַיַּקְרֵב
  choice: 献上
  rationale: 使役词形在献祭语境中表示把祭物带近、呈献；“献上”符合现代汉语礼仪语境，又不额外限定具体动作。
- source_word: הַמִּנְחָה
  choice: 素祭
  rationale: 在利未记祭祀条例中，מִנְחָה特指以细面等为主要祭物的祭，采用中文圣经传统且简洁明确的术语“素祭”。
- source_word: וַיְמַלֵּא כַפּוֹ מִמֶּנָּה
  choice: 从其中取了满满一把
  rationale: 原文直译为“从其中装满他的手掌”。此处用自然汉语保留一手满取出祭物的具体形象。
- source_word: וַיַּקְטֵר
  choice: 烧
  rationale: קטר的使役词形在献祭语境中指把祭物焚烧，使之化为烟；祭坛语境已清楚表明这是礼仪性的焚献。
- source_word: עַל הַמִּזְבֵּחַ
  choice: 在祭坛上
  rationale: 准确表达祭物焚烧的位置，符合现代标准汉语。
- source_word: מִלְּבַד
  choice: 在……以外
  rationale: 此处表示附加关系，即这次素祭的焚献是在例行的早晨燔祭之外另行进行。
- source_word: עֹלַת הַבֹּקֶר
  choice: 早晨的燔祭
  rationale: עֹלָה是利未记中的固定祭类“燔祭”；属格结构自然译作“早晨的燔祭”，指每日早晨例行献上的燔祭。
theological_decisions: []
