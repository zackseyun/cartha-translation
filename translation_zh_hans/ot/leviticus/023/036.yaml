  text: שִׁבְעַ֣ת יָמִ֔ים תַּקְרִ֥יבוּ אִשֶּׁ֖ה לַ/יהוָ֑ה בַּ/יּ֣וֹם הַ/שְּׁמִינִ֡י מִקְרָא קֹדֶשׁ֩ יִהְיֶ֨ה לָ/כֶ֜ם וְ/הִקְרַבְתֶּ֨ם אִשֶּׁ֤ה לַֽ/יהוָה֙ עֲצֶ֣רֶת הִ֔וא כָּל מְלֶ֥אכֶת עֲבֹדָ֖ה לֹ֥א תַעֲשֽׂוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/036.yaml
  text: For seven days you shall present a food offering to Yahweh. On the eighth day you shall have a holy convocation[a], and you shall present a food offering to Yahweh. It is a solemn assembly; you shall do no ordinary work.
translation:
  language: zh_hans
  text: 七天，你们要向雅威献上火祭[a]。第八天，你们要举行圣会，并向雅威献上火祭。这是严肃会[b]；不可做任何日常劳作。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “火祭”是祭祀礼仪中的固定术语，指经火献上的祭物。
    reason: 说明 אִשֶּׁה 的祭祀术语义，避免误解为单指火。
  - marker: b
    text: 或译“闭幕集会”。此词在这里指第八日举行的特别集会，并具有节期结束的语境含义。
    reason: 保留 עֲצֶרֶת 的替代译法及其在本节中的节期收束语境。
lexical_decisions:
- source_word: שִׁבְעַת יָמִים
  choice: 七天之内……每天
  rationale: 原文表示持续七天履行献祭要求。汉语补出“每天”，自然表达逐日献祭的分配意义，而不改变期限。
- source_word: תַּקְרִיבוּ / וְהִקְרַבְתֶּם
  choice: 献上
  rationale: קרב 的使役式在祭祀语境中指把祭物呈献给神；“献上”准确、自然，也保留礼仪色彩。
- source_word: אִשֶּׁה
  choice: 火祭
  rationale: 这是祭司法中的固定术语，指经火献上的祭物。“火祭”简洁地保留其献祭方式；用脚注说明并非只强调火本身。
- source_word: לַיהוָה
  choice: 向雅威
  rationale: 介词 ל 表示献祭的对象或归属；“向雅威献上”符合现代汉语。יהוה 按其专名译作“雅威”。
- source_word: מִקְרָא קֹדֶשׁ
  choice: 圣会
  rationale: 此固定节期用语指奉召举行的神圣聚会。“圣会”简明、庄重，并保留礼仪性质。
- source_word: עֲצֶרֶת
  choice: 庄严集会
  rationale: 该词指节期中特别守礼、停止日常事务的集会，也可能带有节期收束的含义。“庄严集会”保留礼仪的郑重感，另以脚注保存“闭幕集会”的可能理解。
- source_word: כָּל מְלֶאכֶת עֲבֹדָה
  choice: 任何日常劳作
  rationale: 此短语在节期条例中主要禁止通常的职业性、劳役性工作，并非断言一切活动都不可进行。“日常劳作”在现代汉语中清楚表达这一区别。
- source_word: בַּיּוֹם הַשְּׁמִינִי
  choice: 第八天
  rationale: 直接而自然地表达时间。
- source_word: יִהְיֶה לָכֶם
  choice: 你们要举行
  rationale: 原文直译为“你们要有”，在圣会语境中用“举行”更符合现代汉语，同时保留规定性的语气。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名。采用“雅威”作为较贴近学界通常重构读音的中文音译，同时不以“主”替代专名。
- issue: עֲצֶרֶת 的节期性质
  choice: 庄严集会
  alternative: 闭幕集会
  rationale: 词义兼有停止日常事务、专心聚集的意味，在本节第八天的语境中也可能指节期结束时的集会。正文不把“闭幕”确定为唯一含义，脚注保留另一译法。
translation_notes:
  register: 采用现代、庄重而易懂的礼仪语言。“圣会”“火祭”保留祭司法的术语感；“日常劳作”则避免生硬直译。句首补出“每天”，使七天连续献祭的意思在汉语中清楚呈现。
