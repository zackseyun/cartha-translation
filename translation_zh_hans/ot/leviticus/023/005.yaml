  text: בַּ/חֹ֣דֶשׁ הָ/רִאשׁ֗וֹן בְּ/אַרְבָּעָ֥ה עָשָׂ֛ר לַ/חֹ֖דֶשׁ בֵּ֣ין הָ/עַרְבָּ֑יִם פֶּ֖סַח לַ/יהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/005.yaml
  text: In the first month[a], on the fourteenth day of the month, at twilight[b], is the Passover to Yahweh.
translation:
  language: zh_hans
  text: 第一月十四日黄昏[a]，是耶和华的逾越节[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“在两个傍晚之间”，指日落前后黄昏的一段时间。
    reason: lexical_alternative
  - marker: b
    text: “逾越节”也可理解为“逾越祭”或“逾越节的祭牲”。
    reason: alternative_reading
lexical_decisions:
- source_word: בַּחֹדֶשׁ הָרִאשׁוֹן
  choice: 正月
  rationale: 在节期历法语境中，חֹדֶשׁ 指月份；“正月”是现代汉语中自然、简洁的“第一个月”，不额外指定月份名称。
- source_word: בְּאַרְבָּעָה עָשָׂר לַחֹדֶשׁ
  choice: 十四日
  rationale: 希伯来语按月内日期计时；与“正月”连用时，“正月十四日”准确且符合汉语习惯。
- source_word: בֵּין הָעַרְבָּיִם
  choice: 黄昏
  rationale: 该习语字面为“在两个傍晚之间”，所指是日落前后的一段暮色时分；正文采用自然的“黄昏”，脚注保留其字面形式。
- source_word: פֶּסַח
  choice: 逾越节
  rationale: פֶּסַח 可指逾越节期、礼仪，也可指逾越祭或祭牲。节期历法的上下文支持正文采用较宽泛的“逾越节”，并以脚注保留献祭含义。
- source_word: לַיהוָה
  choice: 献给耶和华的
  rationale: ל 表达归属或奉献对象；“献给”在祭仪语境中自然地体现其指向。יהוה 音译为现代中文通行的“耶和华”，明确呈现神的专名。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。中文正文保留专名而不以“主”替代；“耶和华”是普通现代中文读者最熟悉且通行的形式。
- issue: פֶּסַח 在祭仪语境中的含义
  choice: 逾越节
  alternative: 逾越祭／逾越节祭牲
  rationale: 此词既可能指节期或礼仪，也可能指祭物。正文顺应节期历法语境使用较宽泛的“逾越节”，脚注保留祭物或献祭的可能含义，避免过度消解原文歧义。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“正月十四日黄昏”简洁保留历法信息；“献给耶和华的”体现 לַיהוָה 的奉献或归属关系。所有脚注标记均已置于正文相应位置。
