  text: וּ/סְפַרְתֶּ֤ם לָ/כֶם֙ מִ/מָּחֳרַ֣ת הַ/שַּׁבָּ֔ת מִ/יּוֹם֙ הֲבִ֣יאֲ/כֶ֔ם אֶת עֹ֖מֶר הַ/תְּנוּפָ֑ה שֶׁ֥בַע שַׁבָּת֖וֹת תְּמִימֹ֥ת תִּהְיֶֽינָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/015.yaml
  text: 'And you shall count for yourselves from the day after the Sabbath[a], from the day you bring the sheaf of the wave offering: seven complete Sabbaths shall there be.'
translation:
  language: zh_hans
  text: 你们要为自己数算：从安息日的次日，从你们献上摇祭的禾捆那一天起，共计七个完整的安息日[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“整整七周。”希伯来文直译为“七个完整的安息日”。
    reason: 保留 שַׁבָּתוֹת 在此处可按七日周期理解为“周”的常见词义选择，同时说明正文的字面依据。
lexical_decisions:
- source_word: וּסְפַרְתֶּם
  choice: 你们要数算
  rationale: 该形式在律法指令中具有命令效力；“要数算”既自然，也保留正式的指令语气。
- source_word: לָכֶם
  choice: 为自己
  rationale: 保留与格代词所带的切身、反身意味，而不简化为单纯的“数”。
- source_word: מִמָּחֳרַת הַשַּׁבָּת
  choice: 从安息日的次日
  rationale: מָחֳרַת 指次日；“安息日”保留 שַׁבָּת 的礼仪和历法专名性质，不泛化为“休息日”。
- source_word: מִיּוֹם הֲבִיאֲכֶם
  choice: 就是你们带来……的那一天起
  rationale: 明确标示计数的起点，并用“就是”自然连接前一个时间短语。
- source_word: עֹמֶר
  choice: 禾捆
  rationale: 本段语境指献上的谷物捆，而不是单指容量单位；“禾捆”对现代读者清楚，也符合祭礼场景。
- source_word: הַתְּנוּפָה
  choice: 作摇祭
  rationale: תְּנוּפָה 是在耶和华面前摇献或呈献之祭的固定礼仪术语；“摇祭”保留其具体祭仪含义。
- source_word: שֶׁבַע שַׁבָּתוֹת
  choice: 七个……安息日
  rationale: 希伯来文明确使用 שַׁבָּתוֹת，而非通常表示“周”的词；正文保留“安息日”，不预先化解历法解释上的张力。
- source_word: תְּמִימֹת
  choice: 完整的
  rationale: 在时间计数语境中表示完整、足数，而非道德完美或祭物无残疾。
- source_word: תִּהְיֶינָה
  choice: 要有
  rationale: 反映结句的存在或述谓表达，同时保持现代汉语自然。
theological_decisions:
- issue: 历法指令中 שַׁבָּת / שַׁבָּתוֹת 的理解
  choice: 正文译作“安息日”，并将复数保留为“七个完整的安息日”。
  alternative: 按七日周期的意义译作“周”，即“整整七周”。
  rationale: 原文使用“安息日”一词，而本节涉及计数从哪一天开始以及复数是否惯用地表示“周”等历法争议。正文贴近原文，保留其歧义；常见的“周”译法列入脚注。
translation_notes:
  register: 采用现代、庄重而易懂的律法文体。“数算”“安息日”“摇祭”保留经文的祭礼语域；以冒号和“就是”梳理原文连续的起点短语。脚注标记置于其实际所说明的“七个完整的安息日”之后。
