  text: וְ/כָל הַ/נֶּ֗פֶשׁ אֲשֶׁ֤ר תַּעֲשֶׂה֙ כָּל מְלָאכָ֔ה בְּ/עֶ֖צֶם הַ/יּ֣וֹם הַ/זֶּ֑ה וְ/הַֽאֲבַדְתִּ֛י אֶת הַ/נֶּ֥פֶשׁ הַ/הִ֖וא מִ/קֶּ֥רֶב עַמָּֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/030.yaml
  text: And every person who does any work on this very day—I will destroy that person from among his people[a].
translation:
  language: zh_hans
  text: 凡就在这一天做任何工的人，我必把那人从他的族人中除灭[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我必把那人从他的族人中剪除。”这里的希伯来语动词意为“除灭、使灭亡”，不是通常译作“剪除”的那个动词；不过，两者都含有在审判中将人除去的意思。
    reason: alternative_reading
lexical_decisions:
- source_word: הַנֶּפֶשׁ
  choice: 人
  rationale: 在律法和圣约语境中，נֶפֶשׁ通常指一个具体的人，而非专指非物质的“灵魂”；两处均译为“人”，自然且准确。
- source_word: תַּעֲשֶׂה כָּל מְלָאכָה
  choice: 做任何工
  rationale: עשה与מְלָאכָה搭配表示做工；“任何”保留כָּל的全面禁止意味。
- source_word: בְּעֶצֶם הַיּוֹם הַזֶּה
  choice: 在这一天
  rationale: 上下文已经明确所指日期；现代汉语“在这一天”自然地指向这个特定日子。עֶצֶם的强调意味可理解为正当此日，但若机械译作“就在这一天”容易产生不必要的对比语气。
- source_word: וְהַאֲבַדְתִּי
  choice: 我必……除灭
  rationale: אבד的使役式表示使之灭亡、毁灭；“除灭”既保留审判与毁灭的力度，也能与后面的“从……中”自然衔接。
- source_word: מִקֶּרֶב עַמָּהּ
  choice: 从他的族人中
  rationale: 该短语表示从所属群体中除去。后缀阴性是与阴性名词נֶפֶשׁ的语法一致，并不限定此人为女性；汉语采用通用的“他的”。“族人”较“人民”更贴合群体归属关系。
theological_decisions:
- issue: וְהַאֲבַדְתִּי ... מִקֶּרֶב עַמָּהּ所表达的刑罚性质
  choice: 我必把那人从他的族人中除灭
  alternative: 我必把那人从他的族人中剪除
  rationale: 原文使用אבד的使役式，即“使灭亡、除灭”，而不是常译为“剪除”的כרת。正文因此保留毁灭性的力度，不把它无标记地处理成技术性的群体开除；脚注同时列出符合审判语境的“剪除”译法，以保留刑罚具体性质上的张力。
translation_notes:
  register: 采用现代、庄重而清楚的律法文体。“凡……的人”表达普遍适用性；“我必”保留上帝亲自施行审判的第一人称语气。脚注标记已在正文中对应呈现。
