  text: בַּ/סֻּכֹּ֥ת תֵּשְׁב֖וּ שִׁבְעַ֣ת יָמִ֑ים כָּל הָֽ/אֶזְרָח֙ בְּ/יִשְׂרָאֵ֔ל יֵשְׁב֖וּ בַּ/סֻּכֹּֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/042.yaml
  text: You shall dwell in booths for seven days[a]; every native-born person in Israel shall dwell in booths.
translation:
  language: zh_hans
  text: 你们要住在棚屋里七天[a]；凡以色列本地出生的人都要住在棚屋里。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “棚屋”也可译作“棚舍”或“临时棚舍”；希伯来语指为节期搭建的临时住处。
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּסֻּכֹּת
  choice: 在棚子里
  rationale: סֻכּוֹת 指为节期搭建的临时棚舍。“棚子”保留了具体形象，又是现代汉语中自然易懂的表达。
- source_word: תֵּשְׁבוּ / יֵשְׁבוּ
  choice: 要住
  rationale: ישׁב 本可表示“坐”，但在此居住语境中意为“居住”。“要住”既准确表达命令，也自然简明；两处重复采用同一译法。
- source_word: שִׁבְעַת יָמִים
  choice: 七天
  rationale: 这是表示持续时间的短语；汉语直接说“住……七天”最为自然，无须另加介词。
- source_word: כָּל הָאֶזְרָח
  choice: 凡……本地出生的人
  rationale: אֶזְרָח 指本地出生、属于共同体的人，与寄居者相对。“本地出生的人”避免把后世政治意义上的“公民”概念带入经文；“凡……都”自然传达 כָּל 与单数集合性表达。
- source_word: בְּיִשְׂרָאֵל
  choice: 以色列……的人
  rationale: 此处说明该本地出生者属于以色列共同体。汉语将地点/共同体限定语置于“本地出生的人”之前，更为顺畅。
theological_decisions:
- issue: הָאֶזְרָח 的代表性阳性单数是否限定男性
  choice: 凡以色列本地出生的人
  alternative: 凡以色列本地出生的男子
  rationale: 该名词虽为语法上的阳性单数，却具有代表性和集合性，并非明确把命令限于男性。“人”保留其一般范围，不额外加入性别限制。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“你们要……；凡……都要……”保留原文两分句的命令结构和关键词重复。
