source:
  edition: WLC
  text: דַּבֵּ֛ר אֶל בְּנֵ֥י יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר בַּ/חֹ֨דֶשׁ הַ/שְּׁבִיעִ֜י בְּ/אֶחָ֣ד לַ/חֹ֗דֶשׁ יִהְיֶ֤ה לָ/כֶם֙ שַׁבָּת֔וֹן זִכְר֥וֹן תְּרוּעָ֖ה מִקְרָא קֹֽדֶשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/024.yaml
  text: 'Speak to the sons of Israel[a], saying: In the seventh month, on the first day of the month, there shall be for you a solemn rest, a memorial of trumpet blasts, a holy convocation.'
translation:
  language: zh_hans
  text: “你要吩咐以色列子孙说：七月初一，你们要守庄严的安息，以号声作纪念[a]，并举行圣会。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“以响亮的信号声作纪念”。希伯来语“号声”也可泛指高声呼喊、欢呼，或号角、号筒发出的响声。
    reason: 保留תְּרוּעָה的宽泛词义，避免把它无保留地限定为某一种乐器的吹奏声。
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列子孙
  rationale: 保留原文的家族—盟约表达，同时在现代汉语中可自然地统指以色列共同体。
- source_word: בַּחֹדֶשׁ הַשְּׁבִיעִי בְּאֶחָד לַחֹדֶשׁ
  choice: 七月初一
  rationale: 准确传达希伯来历法表达“第七月的第一日”，并采用自然简洁的现代汉语日期说法。
- source_word: שַׁבָּתוֹן
  choice: 庄严的安息
  rationale: 表达为节期而停止日常劳作的郑重性质，并与通常音译或专名化的“安息日”有所区别。
- source_word: זִכְרוֹן תְּרוּעָה
  choice: 以号声作纪念
  rationale: 保持两个名词之间关系的简洁性；“号声”符合礼仪与节期语境，又不擅自指定某一种具体乐器。
- source_word: מִקְרָא קֹדֶשׁ
  choice: 圣会
  rationale: 这是简洁、庄重且容易理解的礼仪用语，表达被召集举行的神圣聚会。
theological_decisions:
- issue: תְּרוּעָה所指声音的性质
  choice: 号声
  alternative: 呼喊声、欢呼声、响亮的信号声
  rationale: 在节期礼仪语境中，号角或号筒发出的信号声较为可能；但该词本身范围更广，因此正文采用较简洁的“号声”，并在脚注中保留其他可能。
- issue: זִכְרוֹן תְּרוּעָה的句法关系
  choice: 以号声作纪念
  alternative: 号声的纪念；用号声宣告的纪念日
  rationale: 原文是紧密相连的名词结构，具体关系略有含混。“以号声作纪念”在汉语中自然，也避免加入原文没有明说的“宣告”或“纪念日”。
translation_notes:
  register: 采用现代、庄重而清楚的经文语体。“吩咐”“庄严的安息”“圣会”维持律法与礼仪语境的正式感；句式则依照现代汉语调整，避免生硬直译。
