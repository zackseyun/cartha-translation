source:
  edition: WLC
  text: כָּל מְלֶ֥אכֶת עֲבֹדָ֖ה לֹ֣א תַעֲשׂ֑וּ וְ/הִקְרַבְתֶּ֥ם אִשֶּׁ֖ה לַ/יהוָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/025.yaml
  text: You shall do no laborious work[a], and you shall present a food offering to Yahweh.
translation:
  language: zh_hans
  text: 你们不可做任何劳碌的工作；要向雅威献上火祭[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“食物祭”；也可译为“经火献上的祭物”。
    reason: 原文 אִשֶּׁה 为祭祀专门用语；“火祭”是传统且稳妥的译法，但其词义和词源解释仍有讨论，故保留“食物祭”及“经火献上的祭物”等可行译法。
lexical_decisions:
- source_word: כָּל ... לֹא תַעֲשׂוּ
  choice: 不可做任何……
  rationale: 希伯来语以“所有／任何……不做”表达全面禁止；现代汉语用“不可做任何……”自然地保留其涵盖全部的语气。
- source_word: מְלֶאכֶת עֲבֹדָה
  choice: 劳作
  rationale: 这个组合词指日常劳动或服役性质的工作，并非绝对禁止一切动作。“劳作”简洁、现代，也避免把范围缩窄为职业工作。
- source_word: וְהִקְרַבְתֶּם
  choice: 要……献上
  rationale: קרב 的使役式在献祭语境中指把祭物带近并呈献；“献上”符合现代汉语祭祀用语，也保留命令性质。
- source_word: אִשֶּׁה
  choice: 食物作祭
  rationale: 这是祭司文献中的专门献祭用语。“食物作祭”传达其作为献给神之祭物的含义；由于该词传统上也可理解为经火献上的祭物，另以脚注保留。
- source_word: לַיהוָה
  choice: 向雅威
  rationale: 介词 ל 表示呈献的对象；神名 יהוה 按其专名译作“雅威”，不以称号替代。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。译作“雅威”可明确保留其专名性质；“耶和华”是传统音译，“主”则以称号替代原文专名。
- issue: 祭祀术语 אִשֶּׁה 的理解
  choice: 食物作祭
  alternative: 经火献上的祭物；火祭
  rationale: 该词的词源及祭司语境允许“食物祭”和“火祭”两种表达重点。正文采用便于现代读者理解的“食物作祭”，但不将“经火献上”的传统理解排除，故列入脚注。
translation_notes:
  register: 采用现代、庄重而简明的律法文体。“你们”体现原文第二人称复数；分号对应两个并列命令。脚注标记紧跟其所说明的祭祀术语，避免误置于“劳作”之后。
