revisions:
- from: 同献的素祭，要用十分之二伊法调油的细面，作为献给雅威的火祭[a]，是蒙悦纳的香气；同献的奠祭，要用四分之一欣的酒。
  to: 随同献上的素祭，是伊法的十分之二细面，调和了油，作为献给雅威的火祭[a]，成为馨香之气；随同献上的奠祭，是四分之一欣的酒。
  rationale: 修订仅处理中文计量结构、搭配及固定祭祀语汇：以“伊法的十分之二”明确原文的量，以“调和了油的细面”顺畅表达被动分词，并以“馨香之气”保留原文意象。其余术语、神名及脚注锚点均予保留。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T04:51:11Z'
review_pass:
  verdict: revise
  source_fidelity: 整体忠实反映原文：素祭附属于上节的羊羔，分量为伊法的十分之二，细面与油调和，献给雅威并带有“馨香／蒙悦纳”的祭祀语汇，奠祭为四分之一欣的酒。惟“十分之二伊法”在现代汉语中修饰关系不够清楚，宜明确为“伊法的十分之二”。
  naturalness: “同献的”能表达随羊羔附献的关系，但“同献的素祭，要用十分之二伊法调油的细面”计量与“调油的”连缀略显生硬。改为“随同献上的素祭，是伊法的十分之二细面，调和了油”更清楚、自然，且不增加原文信息。
  terminology: “素祭”“奠祭”“火祭”“伊法”“欣”均为庄重且可识别的祭祀及度量术语；“雅威”与本项目对神名的既定处理一致。“馨香之气”保留原文的嗅觉意象及祭祀固定语，不应仅抽象化为“蒙悦纳”。
