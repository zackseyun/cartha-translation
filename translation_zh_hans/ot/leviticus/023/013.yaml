  - severity: low
    issue: “蒙悦纳的香气”较弱化固定祭祀意象
    rationale: רֵיחַ נִיחֹחַ字面保留“香气／馨香”意象，并在礼仪语境中表示为神所悦纳；“馨香之气”是自然、庄重且更贴近原文的译法。
