  text: וּ/מִנְחָת/וֹ֩ שְׁנֵ֨י עֶשְׂרֹנִ֜ים סֹ֣לֶת בְּלוּלָ֥ה בַ/שֶּׁ֛מֶן אִשֶּׁ֥ה לַ/יהוָ֖ה רֵ֣יחַ נִיחֹ֑חַ וְ/נִסְכֹּ֥/ה יַ֖יִן רְבִיעִ֥ת הַ/הִֽין׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/013.yaml
  text: Its grain offering shall be two-tenths of an ephah of fine flour mixed with oil[a], a food offering to Yahweh, a pleasing aroma; and its drink offering shall be wine, a fourth of a hin.
translation:
  language: zh_hans
  text: 随同献上的素祭，是伊法的十分之二细面，调和了油，作为献给雅威的火祭[a]，成为馨香之气；随同献上的奠祭，是四分之一欣的酒。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“作为献给雅威的食物祭”。
    reason: אִשֶּׁה既可着重经火献上的方式，也可按祭坛上献给神的供物理解；正文采用较形式对应的“火祭”，脚注保留另一种常见理解。
lexical_decisions:
- source_word: וּמִנְחָתוֹ
  choice: 同献的素祭
  rationale: מִנְחָה在祭祀语境中特指以谷物为主的祭物，译作“素祭”；三单阳性后缀回指上节的羊羔，“同献的”自然表达其随附关系。
- source_word: שְׁנֵי עֶשְׂרֹנִים
  choice: 十分之二伊法
  rationale: 原文直译为“两个十分之一”，祭司法例中指伊法的十分之一；补出“伊法”可使计量明确，同时保留古代单位。
- source_word: סֹלֶת
  choice: 细面
  rationale: 这是祭物所用精制面粉的固定用语，“细面”简洁并符合中文祭祀语境。
- source_word: בְּלוּלָה בַשֶּׁמֶן
  choice: 调油的
  rationale: 被动分词表示面粉与油混合；“调油”比“掺油”更自然庄重。
- source_word: אִשֶּׁה לַיהוָה
  choice: 献给雅威的火祭
  rationale: אִשֶּׁה是经火献上的祭物这一专门术语，译作“火祭”直接保留献祭方式；לַיהוָה表明祭物献给雅威。
- source_word: רֵיחַ נִיחֹחַ
  choice: 蒙悦纳的香气
  rationale: 该固定祭祀短语既有香气意象，也表达祭物蒙神悦纳；此译兼顾两层含义，而不把意象抽象化。
- source_word: וְנִסְכֹּה
  choice: 同献的奠祭
  rationale: נֶסֶךְ指倾倒酒液的祭物，中文传统术语“奠祭”准确简洁；后缀仍回指羊羔，以“同献的”表达。
- source_word: יַיִן
  choice: 酒
  rationale: 原词通常指葡萄酒；在奠祭语境中“酒”自然明确。
- source_word: רְבִיעִת הַהִין
  choice: 四分之一欣
  rationale: 保留古代液量单位“欣”，并按中文习惯表达分数。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”较贴近学界普遍采用的希伯来语拟音，并保留其作为专名的性质。
- issue: אִשֶּׁה的祭祀含义
  choice: 火祭
  alternative: 食物祭
  rationale: 该词与火中献祭有关；此处译为“火祭”可避免把并非普通食物的祭物误解为餐食，同时脚注说明也可按祭坛供物的观念理解为“食物祭”。
translation_notes:
  register: 采用现代、庄重而易懂的礼仪语体。“素祭”“奠祭”“火祭”为简明的祭祀术语；古代度量单位“伊法”“欣”予以保留。
