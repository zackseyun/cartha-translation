base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/010.yaml
  text: 'Speak to the sons of Israel and say to them: When you come into the land that I am giving to you[a], and reap its harvest[b], then you shall bring the sheaf of the firstfruits of your harvest to the priest.'
translation:
  language: zh_hans
  text: “你要对以色列人说：你们到了我赐给你们的那地，收割那地的庄稼时，就要把初收庄稼的一捆[a]带到祭司那里。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “一捆”所译原文词可音译为“俄梅珥”；这里可指一捆庄稼，也可理解为专门术语“俄梅珥”。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 这是现代汉语对该希伯来语群体称谓最自然、准确的表达；若直译为“以色列的儿子们”，容易被误解为仅指以色列本人的亲生儿子。
- source_word: כִּי תָבֹאוּ
  choice: 你们到了……时
  rationale: כִּי在这里引出命令适用的时间情境；“到了……时”自然表达确定将发生的进入，而不额外加入因果意味。
- source_word: הָאָרֶץ אֲשֶׁר אֲנִי נֹתֵן לָכֶם
  choice: 我赐给你们的那地
  rationale: “那地”保留特指的地理与盟约语境；נֹתֵן用“赐给”体现上帝是赐予者，也符合汉语圣经律法文体。
- source_word: וּקְצַרְתֶּם אֶת קְצִירָהּ
  choice: 收割那地的庄稼
  rationale: 以“收割……庄稼”自然呈现希伯来语同根动词和名词；明确后缀所指的是那地，避免汉语代词含混。
- source_word: וַהֲבֵאתֶם
  choice: 就要……带到
  rationale: “就”显明前述情境之后的程序次序，“要”表达律法命令；“带到”自然对应把收获物送至祭司处。
- source_word: עֹמֶר רֵאשִׁית קְצִירְכֶם
  choice: 初收庄稼的一捆
  rationale: 该短语指收割开始时取出、带给祭司的一捆庄稼。“初收庄稼”保留רֵאשִׁית的时间优先含义，“一捆”采用עֹמֶר在本处的具体农作物意义，同时以脚注保留术语歧义。
- source_word: הַכֹּהֵן
  choice: 祭司
  rationale: 这是祭祀律例语境中כֹּהֵן的标准现代汉语译法。
theological_decisions:
- issue: 盟约群体称谓中的语法性别
  choice: 以色列人
  alternative: 以色列的众子
  rationale: בְּנֵי יִשְׂרָאֵל字面带阳性复数形式，但在此是对盟约群体的惯用称谓。现代汉语“以色列人”准确指明该群体，不把原文无意限定为男性，也避免生硬误读。
- issue: עֹמֶר的礼仪与农业含义
  choice: 一捆
  alternative: 一俄梅珥
  rationale: 上下文描述从刚收割的庄稼中取物带给祭司，因此具体的“一捆”最符合本句场景；但该词也可作为“俄梅珥”这一专门术语，故在脚注中保留，不把两种可能性完全合并。
- issue: רֵאשִׁית的献祭含义
  choice: 初收庄稼
  alternative: 庄稼的初熟之物
  rationale: 原词可指开头或最先的一部分；这里“初收庄稼”保留其时间与次序意义，并让其献礼性质由带到祭司的命令自然显出，而不在正文中加入原文未明说的“献给上帝”。
translation_notes:
  register: 采用现代、庄重而易懂的律法文体。以“你要告诉……对他们说”保留重复的传话公式；用“那地”维持本节特指的地域色彩。正文避免生硬音译，但通过脚注保存עֹמֶר的术语可能性。
