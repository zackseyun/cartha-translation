  yaml_path: translation/ot/leviticus/023/009.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: zh_hans
  text: 雅威[a]对摩西说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文为“YHWH”（四字圣名）；“雅威”是通常采用的读音重构，传统也译作“耶和华”或“上主”。
    reason: 说明神圣专名的原文形式、读音不完全确定及传统译法。
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: 说
  rationale: 该动词在这一固定叙事引语公式中引出新的发言。“说”是现代汉语最自然、准确的表达；无需生硬译成“讲话”。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以通常重构的读音音译上帝的专名 YHWH，保留其作为名字而非称号的性质；原文辅音本身不能完全确定古代读音。
- source_word: אֶל־מֹשֶׁה
  choice: 对摩西
  rationale: 介词 אֶל 在言说动词后标明说话对象，现代汉语自然表达为“对摩西”。
- source_word: לֵאמֹר
  choice: 说：
  rationale: 这是常见的引语导入形式。汉语用“说：”即可自然承载 וַיְדַבֵּר 与 לֵאמֹר 的组合功能，并引出下一节的话。
theological_decisions:
- issue: 上帝圣名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字圣名 YHWH。正文采用“雅威”，以专名呈现，并在脚注中说明读音重构及传统译法，避免把专名无提示地替换为称号。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。冒号表明本节是下一节直接引语的引入句；脚注标记紧接其所说明的圣名。
