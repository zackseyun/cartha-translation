base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/032.yaml
  text: It is a Sabbath of complete rest for you[a], and you shall afflict yourselves. On the ninth day of the month, in the evening, from evening to evening[b], you shall keep your Sabbath.
translation:
  language: zh_hans
  text: 这是你们的完全安息日；你们要使自己受苦[a]。本月初九的晚上，从晚上到晚上[b]，你们要守安息日。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“谦卑自己”或“克制自己”。这个希伯来语表达指人在悔罪礼仪中刻苦己身，传统上包括禁食。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“从晚上到晚上”，反映以色列人按晚上划定一天起止的方式。
    reason: cultural_note
lexical_decisions:
- source_word: שַׁבַּת שַׁבָּתוֹן
  choice: 完全安息的安息日
  rationale: 这一名词组合加强“停止、安息”的含义；此译法保留强调语气，又不把原文并未直接表达的“庄严”加入正文。
- source_word: וְעִנִּיתֶם אֶת נַפְשֹׁתֵיכֶם
  choice: 你们要使自己受苦
  rationale: ענה在此礼仪语境中指向自我苦待或克己；נפשׁ在该表达中具有反身作用，因此译作“自己”，避免将其窄化为非物质的“灵魂”。正文保留较宽泛、直接的意义，不径直改译为“禁食”。
- source_word: בְּתִשְׁעָה לַחֹדֶשׁ בָּעֶרֶב
  choice: 这个月初九晚上
  rationale: 按希伯来语次序，所指是该月第九日的晚上，即这段守节时间的起点；中文以“初九晚上”自然简洁地表达。
- source_word: מֵעֶרֶב עַד עֶרֶב
  choice: 从晚上到晚上
  rationale: 依原文直译，保留以色列人按晚上划定礼仪日界限的表达；不擅自具体化为“从日落到日落”。
- source_word: תִּשְׁבְּתוּ שַׁבַּתְּכֶם
  choice: 你们要守安息日
  rationale: 动词שבת有停止、安息之意，与“你们的安息日”连用时，惯用意义是遵守安息日的安息；此译自然，也避免生硬的“安息你们的安息”。
theological_decisions:
- issue: 赎罪日礼仪中“使自己受苦”的具体含义
  choice: 正文保留“使自己受苦”这一宽泛命令
  alternative: 你们要禁食；你们要谦卑自己；你们要克制自己
  rationale: 本节没有直接使用“禁食”一词，尽管禁食传统上属于这一悔罪礼仪。保留宽泛措辞可避免把原文限定为某一种具体做法，并保存其解释张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“使自己受苦”贴近原文并保留礼仪含义的宽度；脚注补充较自然的其他译法及禁食背景。为使脚注所释对象清楚，[a]置于“使自己受苦”之后，[b]置于“从晚上到晚上”之后。
