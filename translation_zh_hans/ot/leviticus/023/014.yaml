revisions:
- from: 你们不可吃饼、烘烤的谷物[a]或新鲜的谷穗[b]，直到这一天，就是直到你们把供物献给你们的上帝。世世代代，无论你们住在哪里，这都是永久的条例[c]。
  to: 你们不可吃饼、烘焙的谷物[a]或新熟的谷物[b]，直到当日，就是你们把献给你们上帝的供物带来的那一天。这要在你们一切居住之处，世世代代作为永久的条例[c]。
  rationale: 修订解决时间短语的汉语句法问题，保留 עֶצֶם 对“当日”的强调，以及两个 עַד 所表达的“直到献供物之日”的界定。词汇上采用较不窄化的“新熟的谷物”，并在脚注保留“新鲜的谷穗”这一可行译法。末句重排为自然的现代汉语，同时保留“世世代代”和“一切居住之处”的双重范围。
