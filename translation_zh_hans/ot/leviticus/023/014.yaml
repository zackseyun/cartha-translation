base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/014.yaml
  text: And you shall not eat bread or roasted grain or fresh grain until this very day[a], until you have brought the offering of your God[c][b]. It is a permanent statute throughout your generations in all your dwelling places.
translation:
  language: zh_hans
  text: 你们不可吃饼、烘焙的谷物[a]或新熟的谷物[b]，直到当日，就是你们把献给你们上帝的供物带来的那一天。这要在你们一切居住之处，世世代代作为永久的条例[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “烘焙的谷物”也可译作“烤过的谷物”。
    reason: lexical_alternative
  - marker: b
    text: “新熟的谷物”也可译作“新鲜的谷穗”。
    reason: lexical_alternative
  - marker: c
    text: “永久的条例”也可译作“永远的条例”或“长久的条例”。
    reason: lexical_alternative
lexical_decisions:
- source_word: לֶחֶם
  choice: 饼
  rationale: 在收割条例的语境中指用谷物制成的饼；采用具体词义，不泛化为“食物”。
- source_word: קָלִי
  choice: 烘烤的谷物
  rationale: 指经烤制或焙制的谷物；这一表达既保留农业语境，也便于现代读者理解。
- source_word: כַרְמֶל
  choice: 新鲜的谷穗
  rationale: 此处与饼和烘烤的谷物并列，指新熟、尚新鲜的穗粒；译作“谷穗”比笼统的“谷物”更具体，同时保留词义的一定弹性。
- source_word: לֹא תֹאכְלוּ
  choice: 你们不可吃
  rationale: 否定词加未完成式在律法语境中表达禁令；“不可”自然保留法律效力。
- source_word: עַד עֶצֶם הַיּוֹם הַזֶּה
  choice: 直到这一天
  rationale: עֶצֶם 带强调意味；中文“这一天”结合后续限定可自然传达所指的特定当天，避免生硬直译为“这一天本身”。
- source_word: עַד הֲבִיאֲכֶם
  choice: 就是直到你们把……献上
  rationale: 介词 עַד 后接带人称后缀的不定式，标明禁令终止所取决的行动；“把……献上”清楚表达先决条件。
- source_word: קָרְבַּן אֱלֹהֵיכֶם
  choice: 给你们的上帝献上供物
  rationale: קָרְבָּן 是带到上帝面前的供物，未限定具体祭类，因此不窄化为某一种祭。
- source_word: חֻקַּת עוֹלָם
  choice: 永久的条例
  rationale: 保留该律例持续有效的法律语气，同时使用现代、易懂的中文。
- source_word: לְדֹרֹתֵיכֶם
  choice: 世世代代
  rationale: 自然表达该条例跨越连续世代的效力。
- source_word: בְּכֹל מֹשְׁבֹתֵיכֶם
  choice: 无论你们住在哪里
  rationale: 以现代中文准确表达所有居住地或定居处，避免“在你们一切住处”一类生硬结构。
theological_decisions:
- issue: חֻקַּת עוֹלָם 在摩西律法中的效力范围
  choice: 译作“永久的条例”，保留其在利未记法律与圣约框架中的持续约束力。
  alternative: “永远的条例”或“世世代代永守的条例”
  rationale: 译文不预先裁定此礼仪性条例在后续救赎历史中的适用方式，也不把任何特定宗派关于律法延续或终止的结论写入正文。
translation_notes:
  register: 采用现代、庄重而清楚的律法文体。“不可”保留禁令语气；末句适度调整语序，使“世世代代”和“无论你们住在哪里”在现代汉语中自然，同时不削弱原文的普遍性与持续性。
