  yaml_path: translation/ot/leviticus/023/007.yaml
  text: On the first day there shall be a holy convocation for you[b][a]; you shall do no laborious work.
translation:
  language: zh_hans
  text: 第一天，你们要有圣会[a]；不可做任何日常劳作[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “圣会”也可译为“神圣的集会”；原文含有召集会众的意味。
    reason: lexical_alternative
  - marker: b
    text: 原文为“服役的工作”或“劳作的工作”，指通常的劳动或职业性工作；传统英语译作“servile work”。
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הָרִאשׁוֹן
  choice: 第一天
  rationale: 介词בְּ加定冠词、名词“日”和序数词，表示命令实施的时间；译为“第一天”自然简洁。
- source_word: מִקְרָא קֹדֶשׁ
  choice: 圣会
  rationale: מִקְרָא在节期礼仪语境中可指召集起来的会众或集会，קֹדֶשׁ说明其为分别为圣；“圣会”兼顾礼仪色彩与现代中文的可懂度。
- source_word: יִהְיֶה לָכֶם
  choice: 你们要举行
  rationale: 原文直译近于“对你们而言，要有……”。中文用“你们要举行”自然表达百姓当有圣会的规定，但不额外说明召集者或具体仪式。
- source_word: כָּל
  choice: 任何……都不
  rationale: כָּל与否定词连用，表示全面禁止；中文用“任何……都不可”准确保留其周延范围。
- source_word: מְלֶאכֶת עֲבֹדָה
  choice: 日常劳作
  rationale: 该组合字面近于“劳作／服役之工”，在节期律例中指通常的生产性或职业性劳动；“日常劳作”比“苦工”或“奴仆之工”更不易造成误解。
- source_word: לֹא תַעֲשׂוּ
  choice: 都不可做
  rationale: לֹא加未完成式在律法语境中表达禁令；“不可做”保持庄重、明确的法规语气。
theological_decisions:
- issue: מְלֶאכֶת עֲבֹדָה所禁止工作的范围
  choice: 译作“日常劳作”，表明禁令针对通常的劳动或职业性工作。
  alternative: 译作“一切工作”，理解为禁止任何形式的活动。
  rationale: 原文使用特定组合מְלֶאכֶת עֲבֹדָה，而不是不加限定地说一切行为；译文应保留节期律例中这一限定，同时不自行列举哪些具体活动获准。
translation_notes:
  register: 采用现代、庄重而易懂的律例文体。“圣会”保留利未记节期规定的礼仪语域；“任何……都不可”清楚呈现禁令的全面措辞。脚注分别保留מִקְרָא קֹדֶשׁ的“集会／召集”语义，以及מְלֶאכֶת עֲבֹדָה较难以单一中文词组穷尽的含义。
