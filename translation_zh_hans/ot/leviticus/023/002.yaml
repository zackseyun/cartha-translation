  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: דַּבֵּ֞ר אֶל בְּנֵ֤י יִשְׂרָאֵל֙ וְ/אָמַרְתָּ֣ אֲלֵ/הֶ֔ם מוֹעֲדֵ֣י יְהוָ֔ה אֲשֶׁר תִּקְרְא֥וּ אֹתָ֖/ם מִקְרָאֵ֣י קֹ֑דֶשׁ אֵ֥לֶּה הֵ֖ם מוֹעֲדָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/002.yaml
  text: 'Speak to the sons of Israel and say to them: The appointed times of Yahweh[c][b][a], which you shall proclaim as holy convocations—these are my appointed times.'
translation:
  language: zh_hans
  text: “你要对以色列的子孙[c]说：‘雅威所定的时节[a]，就是你们要宣告为圣会[b]的时节；这些是我所定的时节。’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“所定的节期”或“节庆”。希伯来语可泛指指定的神圣时日，并不限于设宴庆祝的节日。
    reason: lexical_alternative
  - marker: b
    text: 或译“神圣的集会”。
    reason: lexical_alternative
  - marker: c
    text: 希伯来语直译为“以色列的儿子们”，这是指以色列全体百姓的常用立约称谓。
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר אֶל־בְּנֵי יִשְׂרָאֵל וְאָמַרְתָּ אֲלֵהֶם
  choice: 你要对以色列的子孙说
  rationale: 以自然的现代汉语合并希伯来语“讲话……并对他们说”的引语导入格式，同时以传统且可理解的“以色列的子孙”保留 בְּנֵי יִשְׂרָאֵל 的字面和群体含义。
- source_word: מוֹעֲדֵי / מוֹעֲדָי
  choice: 所定的时节 / 我所定的时节
  rationale: מוֹעֵד 指指定的时间或场合；本章也包括安息日，因此不用较窄的“节庆”，以免限于宴饮或欢庆性质的节日。前后采用同一译法，并明确表达末尾第一人称单数后缀。
- source_word: יְהוָה
  choice: 雅威
  rationale: 用现代汉语音译呈现四字神名，保留其专名性质，不以“主”等称号替代。
- source_word: אֲשֶׁר תִּקְרְאוּ אֹתָם
  choice: 就是你们要宣告……的时节
  rationale: קרא 在此指公开宣布、召集或指定；“宣告”符合礼仪与公共场合的语境。补出“时节”作为关系从句所指对象，使汉语清楚自然。
- source_word: מִקְרָאֵי קֹדֶשׁ
  choice: 圣会
  rationale: “圣会”简洁表达因召集而举行、分别为圣的聚会；脚注保留“神圣集会”这一更明说集会性质的译法。
- source_word: אֵלֶּה הֵם
  choice: 这些是
  rationale: 保留希伯来语指示词加代词的确认和强调作用，避免把末句弱化为普通重复。
theological_decisions:
- issue: 如何译出神名 יְהוָה
  choice: 雅威
  alternative: 耶和华；主
  rationale: 采用与源文较直接对应的专名音译，避免以称号代替神名，也不借此加入宗派性解释。
- issue: מוֹעֵד 是否应限缩为节庆
  choice: 所定的时节
  alternative: 节期；节庆
  rationale: 本章的范围包括安息日，广义时间用语更能保存原词涵盖指定圣日和节期的幅度。
- issue: בְּנֵי יִשְׂרָאֵל 的性别与群体含义
  choice: 以色列的子孙
  alternative: 以色列人
  rationale: 保留原文“以色列之子”的形式，同时按其约民称谓理解为整个以色列群体，不把它解释成只包括成年男性。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。主句按源文次序先提出“雅威所定的时节”，再以末句“这些是我所定的时节”收束并保留强调。引语标点适应中文习惯；“圣会”沿用简洁的礼仪语体，相关含义由脚注说明。
