  yaml_path: translation/ot/leviticus/023/023.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: zh_hans
  text: 雅威[a]对摩西说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文：יהוה（YHWH）；也可译作“耶和华”。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: 说
  rationale: 该叙事性动词在固定引语公式中引出一次新的说话事件；现代汉语用“说”自然、准确，无须与后面的 לֵאמֹר 分别硬译。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文读者最熟悉的专名形式呈现四字神名，保留其作为名字而非头衔的性质。
- source_word: אֶל־מֹשֶׁה
  choice: 对摩西
  rationale: 介词 אֶל 标明说话的对象，汉语自然表达为“对摩西”。
- source_word: לֵאמֹר
  choice: 说（融入引语公式）
  rationale: 该不定式在希伯来语中惯常引出下文话语；译作句末“说：”既表达其功能，也避免汉语中“说……说”的生硬重复。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。正文采用中文传统且广为人知的专名“耶和华”，不以“主”这一头衔替代；“雅威”是按学界常见拟音所得的另一译法。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。希伯来语的 וַיְדַבֵּר…לֵאמֹר 是固定引语公式，整体译为“对摩西说：”；冒号提示讲话内容接续于下一节。
