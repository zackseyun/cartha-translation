base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/040.yaml
  text: And on the first day you shall take for yourselves the fruit of majestic trees[a], branches of palm trees, boughs of leafy trees, and willows of the brook, and you shall rejoice before Yahweh your God for seven days.
translation:
  language: zh_hans
  text: 第一天，你们要为自己取佳美树木的果子[a]、棕榈树的枝叶、茂密树木的枝条和溪边的柳枝；你们要在雅威——你们的上帝面前欢乐七天。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或指“香橼果”。后期犹太传统如此理解；希伯来语字面意思是“佳美（或华美）树木的果子”。
    reason: 保留原文宽泛措辞，同时说明后期传统中的具体认定。
lexical_decisions:
- source_word: וּלְקַחְתֶּם לָכֶם
  choice: 你们要为自己取
  rationale: 在律法指令语境中表达命令义；“为自己”保留לָכֶם，避免省略原文成分。
- source_word: בַּיּוֹם הָרִאשׁוֹן
  choice: 第一天
  rationale: 直接对应原文时间短语，不把上下文虽已说明、但本节未明说的“节期”加入正文。
- source_word: פְּרִי עֵץ הָדָר
  choice: 佳美树木的果子
  rationale: הָדָר可表示荣美、华美或佳美；采用概括性译法，保留希伯来语本身的宽泛含义，不在正文中直接认定为香橼。
- source_word: כַּפֹּת תְּמָרִים
  choice: 棕榈树的枝叶
  rationale: כַּפֹּת在此指棕榈的枝叶；该译法自然明确，也不作过细的植物学限定。
- source_word: וַעֲנַף עֵץ עָבֹת
  choice: 茂密树木的枝条
  rationale: עָבֹת含浓密、繁茂之意，很可能描述树叶繁密；译文同时保留“树木”和“枝条”的意象。
- source_word: וְעַרְבֵי נָחַל
  choice: 溪边的柳枝
  rationale: עַרְבֵי通常指柳树一类，נָחַל指溪流或季节性河道；“溪边的柳枝”符合本段收集枝叶的语境。
- source_word: וּשְׂמַחְתֶּם
  choice: 你们要……欢乐
  rationale: 直接表达该动词“欢喜、欢乐”的含义，并保留律法指令的语气。
- source_word: לִפְנֵי יְהוָה אֱלֹהֵיכֶם
  choice: 在你们的上帝雅威面前
  rationale: לִפְנֵי译作“在……面前”，神名יְהוָה按项目规范音译为“雅威”。
- source_word: שִׁבְעַת יָמִים
  choice: 七天
  rationale: 汉语以“欢乐七天”自然表达持续时间，无须另加介词。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；音译“雅威”保留其作为专名的性质，并与所给项目规范一致。
- issue: פְּרִי עֵץ הָדָר所指为何
  choice: 正文采用宽泛的“佳美树木的果子”
  alternative: 香橼（枸橼）果
  rationale: 后期犹太传统通常将其认定为住棚节所用的香橼，但希伯来语字面较为宽泛；正文不以传统认定取代原文的歧义，另在脚注说明。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“取”保持律法文本的简洁指令感；四类植物材料以并列结构呈现。脚注标记[a]已置于相关短语之后。
