  text: וְ/חַגֹּתֶ֤ם אֹת/וֹ֙ חַ֣ג לַֽ/יהוָ֔ה שִׁבְעַ֥ת יָמִ֖ים בַּ/שָּׁנָ֑ה חֻקַּ֤ת עוֹלָם֙ לְ/דֹרֹ֣תֵי/כֶ֔ם בַּ/חֹ֥דֶשׁ הַ/שְּׁבִיעִ֖י תָּחֹ֥גּוּ אֹתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/041.yaml
  text: You shall celebrate it as a feast to Yahweh for seven days in the year[a]. It is a permanent statute throughout your generations[b]; in the seventh month you shall celebrate it.
translation:
  language: zh_hans
  text: 你们要每年向雅威[a]守这节，为期七天。这要作为你们世世代代永久的条例[b]；你们要在第七个月守这节。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “向雅威”也可译作“为雅威”。
    reason: lexical_alternative
  - marker: b
    text: “永久的条例”也可译作“永远的条例”或“长存的条例”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְחַגֹּתֶם / תָּחֹגּוּ
  choice: 守这节
  rationale: חָגַג指庆祝、遵守节期，常带朝圣节庆色彩。“守这节”是现代中文宗教法规语境中的自然表达，也保留本节两次动词的呼应。
- source_word: אֹתוֹ
  choice: 这节
  rationale: 代词所指是上下文中的节期。中文若只译“它”较生硬，明示为“这节”没有增添新的所指。
- source_word: חַג
  choice: 节
  rationale: חַג表示节期或节庆，且常与朝圣有关；“节”简洁自然，符合《利未记》的节期语境。
- source_word: לַיהוָה
  choice: 向雅威
  rationale: 介词ל可表达方向、归属或奉献对象；“向雅威守这节”表明节期是献给并尊崇雅威的。
- source_word: שִׁבְעַת יָמִים
  choice: 七天
  rationale: 表示守节持续的时间；放在“守这节”之后符合现代汉语语序。
- source_word: בַּשָּׁנָה
  choice: 每年
  rationale: 字面为“在年中”，在此说明节期按年举行；“每年”准确传达其习惯性、年度性的含义。
- source_word: חֻקַּת עוֹלָם
  choice: 永久的条例
  rationale: חֻקָּה是规定、条例；עוֹלָם在盟约法规中表达持续长久的效力。“永久的条例”保留其强烈的延续性，同时不额外界定哲学意义上的绝对无终。
- source_word: לְדֹרֹתֵיכֶם
  choice: 你们世世代代
  rationale: 该惯用语说明此条例对连续各代都有效；“世世代代”是自然、庄重的现代中文。
- source_word: בַּחֹדֶשׁ הַשְּׁבִיעִי
  choice: 在七月
  rationale: 直接表达举行节期的月份；“七月”在本语境中指历法的第七个月。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名יהוה；“雅威”较贴近学界通常重构的读音，并保留这是专名而非称号。
- issue: 祭祀法规中עוֹלָם的效力
  choice: 永久的条例
  alternative: 永远的条例
  rationale: 该词强调条例跨越世代、持续有效，但在盟约法规语境中未必意在作关于绝对时间无限性的哲学断言；“永久”保留其约束力而不过度阐释。
translation_notes:
  register: 采用现代、庄重而易懂的法规语体。“守这节”既自然，也保留节期礼仪的含义；两处重复使用，以对应希伯来文动词的重复。
