  text: וַ/יְדַבֵּ֣ר מֹשֶׁ֔ה אֶת מֹעֲדֵ֖י יְהוָ֑ה אֶל בְּנֵ֖י יִשְׂרָאֵֽל־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/044.yaml
  text: So Moses declared the appointed times of Yahweh to the sons of Israel[a].
translation:
  language: zh_hans
  text: 摩西就向以色列人[a]宣告了雅威所定的节期。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译“以色列的众子”；也可译作“以色列子民”，传统译法为“以色列的儿女”。
    reason: 说明希伯来语惯用称呼的字面形式及可选译法。
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: 宣告了
  rationale: דבר在此以直接宾语指向整套神圣日历；本节又是全章总结，因此“宣告”比单纯的“说”更自然，并保留公开传达、使人知晓的语气。
- source_word: מֹעֲדֵי
  choice: 所定的日期
  rationale: מוֹעֵד指预先指定的时间或会期。本章范围包括安息日，并不只限于筵席或庆典；“所定的日期”既保留“指定时间”的核心含义，也避免把范围缩窄为“节期”。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以音译呈现四字神名，保留原文所用的专名，而不以头衔替代。
- source_word: אֶל
  choice: 向
  rationale: 该介词标明摩西宣告的对象；汉语“向……宣告”准确而自然。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 该短语字面为“以色列的众子”，在这里是对以色列全体百姓的常规称呼；正文采用现代汉语自然表达，并以脚注保留原文形式。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用以色列上帝的四字神名。正文采用较贴近其通常重构读音的“雅威”，从而保留专名性质；“耶和华”是汉语传统译名，可视为另一种音译传统。
- issue: מֹעֲדֵי的范围
  choice: 所定的日期
  alternative: 节期
  rationale: 利未记23章所列内容包括安息日，因此不宜将该词只理解为节庆。“所定的日期”保留其涵盖各类神圣指定时间的广度。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“摩西就……”承接前文并体现וַ的叙事推进；语序调整为“向对象宣告内容”，符合自然汉语表达。
