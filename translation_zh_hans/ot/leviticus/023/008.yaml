  text: וְ/הִקְרַבְתֶּ֥ם אִשֶּׁ֛ה לַ/יהוָ֖ה שִׁבְעַ֣ת יָמִ֑ים בַּ/יּ֤וֹם הַ/שְּׁבִיעִי֙ מִקְרָא קֹ֔דֶשׁ כָּל מְלֶ֥אכֶת עֲבֹדָ֖ה לֹ֥א תַעֲשֽׂוּ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/008.yaml
  text: And you shall present a food offering to Yahweh for seven days[a]. On the seventh day there shall be a holy convocation; you shall do no laborious work.
translation:
  language: zh_hans
  text: 你们要一连七天向雅威献火祭[a]。第七天要举行圣会；不可做任何日常劳作。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“经火献上的祭物”。
    reason: 原文אִשֶּׁה是献祭术语，可强调祭物经火献上；“火祭”是较凝练的译法。
lexical_decisions:
- source_word: וְהִקְרַבְתֶּם
  choice: 献
  rationale: 这是קרב的使役式，在献祭语境中指把祭物带近并呈献；中文用“献”简洁自然，也保留礼仪含义。
- source_word: אִשֶּׁה
  choice: 火祭
  rationale: 该词是祭司文献中的献祭术语，通常指经火献上的祭物。“火祭”简明而保留原文的礼仪意象；其他可能表达收入脚注。
- source_word: לַיהוָה
  choice: 向雅威
  rationale: 介词ל表示献祭的指向或归属；“向雅威献”符合现代汉语习惯，并保留神的专名。
- source_word: שִׁבְעַת יָמִים
  choice: 七天之中……每天
  rationale: 原文表示献祭持续七天。汉语补出“每天”，自然地说明这七天内均须献祭，而没有改变其时段。
- source_word: בַּיּוֹם הַשְּׁבִיעִי
  choice: 第七天
  rationale: 直接表达原文的时间状语。
- source_word: מִקְרָא קֹדֶשׁ
  choice: 圣会
  rationale: 该固定节期用语指受召集的神圣聚会。“圣会”简洁、庄重，也符合本段礼仪语境。
- source_word: כָּל מְלֶאכֶת עֲבֹדָה
  choice: 任何日常劳作
  rationale: 该短语并非泛指一切活动，而是指通常的劳务或职业性工作；“日常劳作”避免误解为绝对禁止任何动作。
- source_word: לֹא תַעֲשׂוּ
  choice: 都不可做
  rationale: 准确表达复数对象所领受的禁令，并与“任何”构成自然的现代汉语句式。
theological_decisions:
- issue: 如何译出神名יהוה
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”是较接近学界通行重构读音的现代汉语音译，保留其作为专名的性质，而不以头衔替代。
- issue: אִשֶּׁה的献祭性质
  choice: 火祭
  alternative: 经火献上的祭物
  rationale: 原词的确切构词和涵盖范围存在讨论，但在祭司礼仪语境中明确指献给神的祭物，并与火有关。正文采用凝练的礼仪术语，脚注保留解释性译法，不进一步限定具体祭种。
translation_notes:
  register: 采用现代、庄重而易懂的礼仪语言。“圣会”和“火祭”保留利未记的祭司文献色彩；“日常劳作”则避免古奥的“劳碌之工”或可能引起身份误解的“奴仆之工”。
