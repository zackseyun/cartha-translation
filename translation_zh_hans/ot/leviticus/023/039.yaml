source:
  edition: WLC
  text: אַ֡ךְ בַּ/חֲמִשָּׁה֩ עָשָׂ֨ר י֜וֹם לַ/חֹ֣דֶשׁ הַ/שְּׁבִיעִ֗י בְּ/אָסְפְּ/כֶם֙ אֶת תְּבוּאַ֣ת הָ/אָ֔רֶץ תָּחֹ֥גּוּ אֶת חַג יְהוָ֖ה שִׁבְעַ֣ת יָמִ֑ים בַּ/יּ֤וֹם הָֽ/רִאשׁוֹן֙ שַׁבָּת֔וֹן וּ/בַ/יּ֥וֹם הַ/שְּׁמִינִ֖י שַׁבָּתֽוֹן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/039.yaml
  text: However[a], on the fifteenth day of the seventh month, when you have gathered in the produce of the land, you shall celebrate the feast of Yahweh for seven days. On the first day there shall be a solemn rest[b], and on the eighth day a solemn rest.
translation:
  language: zh_hans
  text: 不过[a]，七月十五日，你们收完地里的出产以后，要庆祝雅威的节期七天之久。第一日要有庄严的安歇[b]，第八日也要有庄严的安歇。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “不过”也可译作“确实”或“只是”；这里的希伯来词可表示强调，也可表示限定或转折。
    reason: lexical_alternative
  - marker: b
    text: “庄严的安歇”也可译作“安息之日”或“安息”；这个希伯来词指与神圣礼仪有关的特别安歇，并不一定专指每周的安息日。
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: 不过
  rationale: 此处承接并转入对该节期日期和守法的具体说明，带有限定或转折意味；“不过”自然地保留这一话语功能。
- source_word: בַּחֲמִשָּׁה עָשָׂר יוֹם לַחֹדֶשׁ הַשְּׁבִיעִי
  choice: 七月十五日
  rationale: 采用现代汉语通行的日期表达，准确保留月份和日期。
- source_word: בְּאָסְפְּכֶם אֶת תְּבוּאַת הָאָרֶץ
  choice: 你们收完地里的出产以后
  rationale: 介词 בְּ 加不定词结构表示时间背景；“收完……以后”体现收聚完成之意。תְּבוּאָה 泛指土地的产出，不限于谷物，故译为“出产”。
- source_word: תָּחֹגּוּ אֶת חַג יְהוָה
  choice: 要庆祝雅威的节期
  rationale: חגג 与 חַג 同现，指举行、庆祝节期；译文既表达庆祝行动，也保留节期这一礼仪含义。神名 יְהוָה 音译为“雅威”。
- source_word: שִׁבְעַת יָמִים
  choice: 七天
  rationale: 在“庆祝……节期”的结构中，直接用“七天”自然表达持续时间。
- source_word: שַׁבָּתוֹן
  choice: 完全安歇
  rationale: 该词表示为神圣礼仪而停止日常劳作的特别安息；“完全安歇”保留停止劳作的强度，同时避免直接等同于每周的安息日。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；采用较贴近学界通常复原读音的“雅威”，以保留其专名性质，而不以“主”这一称号替代。
- issue: 节期律例中 שַׁבָּתוֹן 的含义
  choice: 完全安歇
  alternative: 守安息／安息日
  rationale: 此词指与神圣节期相关的停工安歇。译作“完全安歇”可避免读者误以为这里必然指每周第七日的安息日，同时保留其庄严、彻底停止劳作的含义。
- issue: 七天节期与第八日的关系
  choice: 保留“第八日”而不解释其如何计入节期
  alternative: 把第八日解释为七天节期之外的附加圣会
  rationale: 原文一方面说庆祝七天，另一方面又规定第八日安歇；译文保留这一表述张力，不在正文中加入原文未明说的协调解释。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“地里的出产”保持农业语境且不缩窄为谷物；“雅威”保留神名；两个 שַׁבָּתוֹן 以相同措辞译出，以呈现原文的重复和平衡。
