revisions:
- from: 这些是耶和华所定的节期；你们要宣告这些日子为圣会，并向耶和华献上火祭，就是燔祭、素祭、祭牲和奠祭，每天献当天所规定的。
  to: 这些是耶和华的节期，就是你们要宣告为圣会的节期，为要向耶和华献上火祭：燔祭、素祭、祭物和奠祭；各日当日所当献的，要在各日献上。
  rationale: 修订消除了把“圣会”说成“日子”的语义偏移，并以“为要”清楚连接宣告节期与献祭目的。祭项仍按原文次序列出；末句保留“各日”与“当日”相对应的逐日履行含义，未将其限定为某一类具体规条。
