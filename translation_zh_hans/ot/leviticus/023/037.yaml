  text: אֵ֚לֶּה מוֹעֲדֵ֣י יְהוָ֔ה אֲשֶׁר תִּקְרְא֥וּ אֹתָ֖/ם מִקְרָאֵ֣י קֹ֑דֶשׁ לְ/הַקְרִ֨יב אִשֶּׁ֜ה לַ/יהוָ֗ה עֹלָ֧ה וּ/מִנְחָ֛ה זֶ֥בַח וּ/נְסָכִ֖ים דְּבַר י֥וֹם בְּ/יוֹמֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/037.yaml
  text: 'These are the appointed times of the LORD, which you shall proclaim as holy convocations, to present a food offering to the LORD: a burnt offering and a grain offering, a sacrifice and drink offerings, each day''s matter on its day.'
translation:
  language: zh_hans
  text: 这些是耶和华的节期，就是你们要宣告为圣会的节期，为要向耶和华献上火祭：燔祭、素祭、祭物和奠祭；各日当日所当献的，要在各日献上。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מוֹעֲדֵי יְהוָה
  choice: 耶和华所定的节期
  rationale: מוֹעֵד 指指定的时间或节期；本章语境聚焦宗教历法中的节期。“所定的节期”兼顾其指定性及自然中文表达。
- source_word: מִקְרָאֵי קֹדֶשׁ
  choice: 圣会
  rationale: 该词组指为神圣目的召集的聚会；“圣会”简洁、庄重，也符合本章反复用语。
- source_word: אִשֶּׁה
  choice: 火祭
  rationale: 该术语指献在火中的祭物；保留其献祭方式，不将其词源上有争议的含义具体化为“食物”。
- source_word: עֹלָה וּמִנְחָה זֶבַח וּנְסָכִים
  choice: 燔祭、素祭、祭牲和奠祭
  rationale: 分别对应全烧祭、谷物供物、宰杀献上的祭物及浇奠之物；采用现代中文圣经语域中清楚而稳定的术语。
- source_word: דְּבַר יוֹם בְּיוֹמוֹ
  choice: 每天献当天所规定的
  rationale: 字面为“每日之事在其日”；此处指各日应献的祭物或份额。译文补出语境隐含的“献”，使中文自然，同时保留逐日履行规定之意。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 耶和华
  alternative: 雅威／上主
  rationale: 采用普通简体中文读者最熟悉、且能作为专名识别的传统译法；不借译名引入特定宗派立场。
- issue: אִשֶּׁה 是否译作“食物祭”
  choice: 火祭
  alternative: 献给耶和华的食物祭
  rationale: 该词与火中献祭密切相关，而“食物”解释涉及词源和祭物作为神之食物的观念。译作“火祭”较少过度阐释，也与后列各种祭物相容。
- issue: זֶבַח 的具体类型
  choice: 祭牲
  alternative: 平安祭／祭物
  rationale: 原文仅用泛指宰牲献祭的名词，未明确限定为平安祭；故不作更具体的神学分类。
translation_notes:
  register: 采用现代、庄重且易懂的礼仪法规语体；分号区分节期定义与献祭要求，列举祭类时保持原文次序。
