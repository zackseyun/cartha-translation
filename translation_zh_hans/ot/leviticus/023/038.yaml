base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/038.yaml
  text: besides the Sabbaths of Yahweh[a], and besides your gifts, and besides all your vows, and besides all your freewill offerings[b], which you give to Yahweh.
translation:
  language: zh_hans
  text: 此外还有雅威的安息日[a]，另有你们的礼物，另有你们所许的一切愿，另有你们献给雅威的一切甘心祭[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “此外还有”也可译为“除……以外”或“另加上”；本节每次重复的同一表达均可如此理解。
    reason: lexical_alternative
  - marker: b
    text: “甘心祭”或译“自愿献的供物”。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִלְּבַד
  choice: 在……以外
  rationale: 这一介词短语相对于前文规定的节期事项，表示这些日子和供物不包括在其中，也就是仍须另行遵守或献上。译文保留四次重复，以体现希伯来文的强调和并列结构。
- source_word: שַׁבְּתֹת יְהוָה
  choice: 雅威的安息日
  rationale: “安息日”采用复数意义，与希伯来文相符；汉语名词通常不以形态标示复数，因此不另加“一切”，避免扩大原文范围。属格结构自然译为“雅威的安息日”。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语音译保存四字神名所指的立约之名，不以称号“主”替代。
- source_word: מַתְּנוֹתֵיכֶם
  choice: 你们的礼物
  rationale: 该词泛指献给上帝的礼物；“礼物”自然简明，也不把原文未明确限定的类别过度具体化。
- source_word: כָּל נִדְרֵיכֶם
  choice: 你们所许的一切愿
  rationale: נֶדֶר可指所许的愿或因许愿而献之物；在献祭语境中采用“所许的一切愿”，保留原词的许愿含义及其可能的指涉张力。
- source_word: כָּל נִדְבֹתֵיכֶם
  choice: 你们的一切甘心祭
  rationale: 在祭祀语境中，נְדָבָה指自愿献上的供物；“甘心祭”是简洁、清楚且符合语境的表达。
- source_word: אֲשֶׁר תִּתְּנוּ לַיהוָה
  choice: 你们献给雅威的
  rationale: נתן基本义为“给”；在供献语境中译为“献给”更自然。关系从句置于最后一项之前，紧贴其语法先行词，同时上下文也容许读者理解为献礼、许愿之物和甘心祭均归给雅威。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名。译作“雅威”旨在保留其专名性质，并采用较接近学界通常重构发音的现代汉语形式。
- issue: 关系从句אֲשֶׁר תִּתְּנוּ לַיהוָה的修饰范围
  choice: 在句法上紧接“一切甘心祭”，不另加排他性说明
  alternative: 明确解释为同时修饰礼物、所许的愿和甘心祭
  rationale: 希伯来文关系从句紧随最后一项，但语义上也可能概括前面的供献项目。译文保持这种结构，不强行消除其范围上的含混。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“在……以外”的重复略显郑重，但有意保存原文四次重复所形成的律法文体和强调效果。本节在语法上承接前文，译文补入“这是”使其作为单节阅读时较自然，同时不改变命令内容。
