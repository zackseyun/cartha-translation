id: LEV.23.19
reference: Leviticus 23:19
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/עֲשִׂיתֶ֛ם שְׂעִיר עִזִּ֥ים אֶחָ֖ד לְ/חַטָּ֑את וּ/שְׁנֵ֧י כְבָשִׂ֛ים בְּנֵ֥י שָׁנָ֖ה לְ/זֶ֥בַח שְׁלָמִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/019.yaml
  text: And you shall offer one male goat for a sin offering[b][a], and two male lambs a year old for a sacrifice of peace offerings.
translation:
  language: zh_hans
  text: 你们要献一只公山羊作赎罪祭[a]，又献两只一岁的公羊羔作平安祭[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “赎罪祭”或译“洁净祭”。
    reason: lexical_alternative
  - marker: b
    text: “平安祭”或译“相交祭”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַעֲשִׂיתֶם
  choice: 你们要献
  rationale: 该动词本义为“做、预备”，但在列举祭牲和祭类的语境中，译作“献”能自然、准确地表达献祭行为。
- source_word: שְׂעִיר עִזִּים אֶחָד
  choice: 一只公山羊
  rationale: 保留数目和祭牲的雄性特征，符合现代汉语量词习惯。
- source_word: לְחַטָּאת
  choice: 作赎罪祭
  rationale: “赎罪祭”是现代中文读者熟悉的利未记祭礼术语；原词也可侧重洁净功能，故在脚注中保留“洁净祭”这一译法。
- source_word: וּשְׁנֵי כְבָשִׂים
  choice: 又献两只公羊羔
  rationale: “又献”承接前一献祭动作；“公羊羔”明确表达祭牲的性别与种类。
- source_word: בְּנֵי שָׁנָה
  choice: 一岁的
  rationale: 直接表达这些羊羔的年龄，简洁自然。
- source_word: לְזֶבַח שְׁלָמִים
  choice: 作平安祭
  rationale: “平安祭”既贴近 שְׁלָמִים 与完整、安宁相关的词义，也是在中文圣经语境中通行而简明的祭礼名称；另一种强调共同分享的译法留在脚注。
theological_decisions:
- issue: חַטָּאת 在祭祀律例中的含义
  choice: 赎罪祭
  alternative: 洁净祭
  rationale: 原词既与罪有关，也可突出除污、洁净的祭礼功能。正文采用通行且易懂的“赎罪祭”，脚注保留“洁净祭”，不把该祭的神学意义限定为单一解释。
- issue: שְׁלָמִים 的祭礼名称
  choice: 平安祭
  alternative: 相交祭
  rationale: “平安祭”较贴近原词并沿用成熟的中文祭礼术语；“相交祭”强调献祭者共同分享祭物的一面，但解释性更强，因此列为脚注异译。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。“献……作……”清楚呈现祭礼指令；句式简洁，适合公开诵读。所有脚注标记均紧接相关祭名。
