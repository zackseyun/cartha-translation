  text: כִּ֤י כָל הַ/נֶּ֨פֶשׁ֙ אֲשֶׁ֣ר לֹֽא תְעֻנֶּ֔ה בְּ/עֶ֖צֶם הַ/יּ֣וֹם הַ/זֶּ֑ה וְ/נִכְרְתָ֖ה מֵֽ/עַמֶּֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/029.yaml
  text: For every person who does not humble himself on this very day shall be cut off from his people[a].
translation:
  language: zh_hans
  text: 因为凡就在这一天不刻苦己心的人，都必从自己的族人中被剪除。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “刻苦己心”也可译作“使自己受苦”或“自我克制”。这个希伯来语习语指谦卑自己、克制自己，传统上与禁食有关。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接并说明前一命令的理由，符合希伯来法律条文的解释性语气。
- source_word: כָל הַנֶּפֶשׁ
  choice: 凡……的人
  rationale: נֶפֶשׁ在此指具体的人，而非作为技术术语的非物质“灵魂”；这样的表达自然且保留普遍范围。
- source_word: אֲשֶׁר לֹא תְעֻנֶּה
  choice: 不刻苦己心
  rationale: ענה在赎罪日语境中表示自我克制、自卑或使自己受苦，传统上与禁食相关。“刻苦己心”保留严肃的礼仪及悔罪意味，同时脚注说明其他可能译法。
- source_word: בְּעֶצֶם הַיּוֹם הַזֶּה
  choice: 在这一天
  rationale: 此处עֶצֶם加强时间表达；中文“这一天”结合语序已突出所指定的当日，避免生硬直译。
- source_word: וְנִכְרְתָה
  choice: 必……被剪除
  rationale: 保留כרת在盟约法律中的传统意象和法律分量，不擅自判定其具体执行方式。
- source_word: מֵעַמֶּיהָ
  choice: 从自己的族人中
  rationale: 阴性后缀与阴性名词נֶפֶשׁ作语法呼应，并不限定所指之人的性别；“自己的族人”自然表达泛指关系。
theological_decisions:
- issue: 赎罪日“刻苦己心”的含义
  choice: 正文译作“不刻苦己心”
  alternative: 不使自己受苦；不自卑；不禁食
  rationale: 原文习语涵盖自我克制、自卑与受苦，且在传统实践中尤其与禁食相关。正文不把含义缩窄为单一做法，脚注保留其语义幅度。
- issue: “被剪除”这一刑罚的性质
  choice: 保留“从自己的族人中被剪除”的法律公式
  alternative: 被逐出；被处死；遭受上帝直接的审判
  rationale: 本节没有说明刑罚的具体机制；保留原文表达，可避免在死亡、驱逐或神直接施行审判等解释之间作过度裁定。
translation_notes:
  register: 采用现代、庄重而易懂的法律—礼仪语体。“刻苦己心”略带经文传统色彩，但在现代中文中仍可理解；脚注补足其具体语义。“被剪除”刻意保留原文的盟约性意象和刑罚机制上的含混。
