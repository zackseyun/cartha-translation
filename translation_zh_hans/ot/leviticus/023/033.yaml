  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: zh_hans
  text: 雅威[a]对摩西说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文为 YHWH；传统中文译作“耶和华”。
    reason: 说明四字神名的原文形式及传统中文音译。
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: 说
  rationale: 该动词配合叙事连接形式，引出新的神谕；现代汉语用“对……说”自然表达这一常见的发言公式。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 这是四字神名 YHWH；“耶和华”是现代中文圣经传统中最广为人知的音译，并以脚注说明其形式及另一种译法。
- source_word: אֶל
  choice: 对
  rationale: 在“说”这一动词后，“对”自然标明受话者。
- source_word: מֹשֶׁה
  choice: 摩西
  rationale: 采用该人名通行的现代中文译名。
- source_word: לֵאמֹר
  choice: 说
  rationale: 希伯来语“发言＋说”的公式若逐字译出会造成现代汉语不自然的重复，因此与前面的动词合译为“对摩西说”，并用冒号提示下文内容。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名，而非“主”这一称号。正文保留中文传统音译“耶和华”，脚注同时交代 YHWH 及“雅威”这一更接近学界重构读音的译法，不把读音上的不确定性隐去。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。将希伯来语重复式发言公式整合为“对摩西说”，冒号表明神谕内容接续于下一节；脚注标记紧随其所解释的神名。
