  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וּ/קְרָאתֶ֞ם בְּ/עֶ֣צֶם הַ/יּ֣וֹם הַ/זֶּ֗ה מִֽקְרָא קֹ֨דֶשׁ֙ יִהְיֶ֣ה לָ/כֶ֔ם כָּל מְלֶ֥אכֶת עֲבֹדָ֖ה לֹ֣א תַעֲשׂ֑וּ חֻקַּ֥ת עוֹלָ֛ם בְּ/כָל מוֹשְׁבֹ֥תֵי/כֶ֖ם לְ/דֹרֹֽתֵי/כֶֽם׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/021.yaml
  text: And on that very day you shall proclaim a holy convocation[a]; you shall do no laborious work[c][b]. It is a permanent statute throughout your dwellings for your generations.
translation:
  language: zh_hans
  text: 就在这一天，你们要宣告圣会[a]；任何日常劳作[b]都不可做。这是在你们一切住处、世世代代都要遵守的永久条例[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “圣会”也可译作“神圣的集会”或“圣洁的集会”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译为“劳役之工”，指日常或劳作性质的工作。
    reason: lexical_alternative
  - marker: c
    text: “永久条例”也可译作“永远的条例”或“恒久的条例”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּקְרָאתֶם
  choice: 你们要宣告举行
  rationale: קרא在此祭礼语境中指正式宣布并召集聚会。“宣告举行”既保留公开宣告的含义，也使现代汉语表达自然。
- source_word: בְּעֶצֶם הַיּוֹם הַזֶּה
  choice: 就在这一天
  rationale: עֶצֶם在此强化所指日期，强调正是该日；“就在”简明保留这一强调。
- source_word: מִקְרָא קֹדֶשׁ
  choice: 圣会
  rationale: 这是利未记中的固定祭礼用语，指正式召集的神圣聚会。“圣会”简洁、庄重，并由脚注说明可译作“神圣的集会”。
- source_word: יִהְיֶה לָכֶם
  choice: 举行圣会
  rationale: 原文直译为“对你们而言要成为圣会”。汉语用“宣告举行圣会”自然地表达该日被定为圣会的规定，未另作生硬重复。
- source_word: כָּל מְלֶאכֶת עֲבֹדָה
  choice: 任何日常劳作
  rationale: 该法律短语所禁的是劳作、服役性质的常规工作，并非明确禁止一切可能的活动；“日常劳作”保留其范围，也避免过度解释。
- source_word: לֹא תַעֲשׂוּ
  choice: 都不可做
  rationale: 以现代汉语法律语体表达明确禁令，并与前面的“任何”自然呼应。
- source_word: חֻקַּת עוֹלָם
  choice: 永久条例
  rationale: עוֹלָם在法律公式中表示持续长久、世代有效。“永久条例”保留强度，同时不额外引入形而上的解释。
- source_word: בְּכָל מוֹשְׁבֹתֵיכֶם
  choice: 在一切住处
  rationale: 保留原文的分布范围，指以色列人所有居住之地；用语简洁而接近原文。
- source_word: לְדֹרֹתֵיכֶם
  choice: 世世代代
  rationale: 准确传达条例在连续各代中的适用性，是自然且庄重的现代汉语表达。
theological_decisions:
- issue: 节期律法中禁止工作的范围
  choice: 译作“任何日常劳作都不可做”
  alternative: 任何工作都不可做；不可做劳役之工
  rationale: כָּל מְלֶאכֶת עֲבֹדָה通常指日常、职业或劳役性质的工作。此译避免把禁令扩展为原文未明确表达的“一切活动”，同时以脚注保留其字面结构。
- issue: חֻקַּת עוֹלָם所表达的持续性
  choice: 译作“永久条例”
  alternative: 永远的条例；恒久的条例
  rationale: 保留条例持续有效的强烈措辞，并让“世世代代”说明其法律语境；不进一步裁定该公式在后续救赎历史中的神学适用方式。
translation_notes:
  register: 采用现代、庄重而易懂的法律—礼仪语体。“就在”保留日期强调；“宣告举行圣会”避免机械直译，同时保存正式召集的含义；末句调整为自然汉语语序，将适用世代、地点和条例的持久性清楚表达。
