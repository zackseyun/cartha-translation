  yaml_path: translation/ot/leviticus/023/035.yaml
  text: On the first day there shall be a holy convocation[b][a]; you shall do no laborious work.
translation:
  language: zh_hans
  text: 第一日当有圣会[a]；不可做任何日常工作[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“受召集的圣洁聚会”。希伯来语 מִקְרָא קֹדֶשׁ 是一个正式礼仪用语，指受正式召集的圣洁聚会。
    reason: lexical_alternative
  - marker: b
    text: 或译“任何职业性工作”或“任何通常的工作”。这个短语指日常服役或从业所做的劳动。
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הָרִאשׁוֹן
  choice: 第一天
  rationale: 介词短语表示时间；现代汉语用“第一天”即可自然表达，无须机械译出介词。
- source_word: מִקְרָא קֹדֶשׁ
  choice: 举行圣会
  rationale: 这是利未记中的固定礼仪用语，指受召而举行的神圣聚会。“圣会”简洁庄重，也保留正式召集聚会的含义；用“举行”使整句符合现代汉语表达。
- source_word: כָּל מְלֶאכֶת עֲבֹדָה
  choice: 任何日常劳作
  rationale: 该短语指与日常职业或服役相关的劳动，并非禁止一切动作。“日常劳作”兼顾词义和节期法规的语境，同时避免“苦工”可能造成的过度限定义。
- source_word: לֹא תַעֲשׂוּ
  choice: 都不可做
  rationale: 未完成式复数在法规中表达禁令；“不可”保留法令语气，并以“都”与前面的“任何”呼应。
theological_decisions: []
