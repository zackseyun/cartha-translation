source:
  edition: WLC
  text: וְ/כָל מְלָאכָה֙ לֹ֣א תַעֲשׂ֔וּ בְּ/עֶ֖צֶם הַ/יּ֣וֹם הַ/זֶּ֑ה כִּ֣י י֤וֹם כִּפֻּרִים֙ ה֔וּא לְ/כַפֵּ֣ר עֲלֵי/כֶ֔ם לִ/פְנֵ֖י יְהוָ֥ה אֱלֹהֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/028.yaml
  text: You shall do no work on this very day[a], for it is a Day of Atonement, to make atonement for you before Yahweh your God.
translation:
  language: zh_hans
  text: 就在这一天，你们什么工都不可做，因为这是赎罪日[a]，要在雅威——你们的上帝——面前为你们赎罪。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语直译为“赎罪的日子”，其中“赎罪”一词是复数形式；通常译作节期名称“赎罪日”。
    reason: 说明原文的复数形式及通行节期译名。
lexical_decisions:
- source_word: וְכָל מְלָאכָה לֹא תַעֲשׂוּ
  choice: 你们什么工都不可做
  rationale: מְלָאכָה在安息日和节期法规中指工作或劳作；以“什么工都不可做”自然表达全称禁令，并保留律法语气。
- source_word: בְּעֶצֶם הַיּוֹם הַזֶּה
  choice: 就在这一天
  rationale: 该习语强调所指的正是这一天；“就在这一天”以自然现代汉语传达其时间上的强调。
- source_word: כִּי
  choice: 因为
  rationale: 此处引出不得做工的理由，“因为”清楚呈现因果关系。
- source_word: יוֹם כִּפֻּרִים
  choice: 赎罪日
  rationale: 该短语字面为“赎罪的日子”，其中כִּפֻּרִים为复数形式；“赎罪日”是准确、通行且易懂的节期名称，复数形式在脚注说明。
- source_word: לְכַפֵּר עֲלֵיכֶם
  choice: 为你们赎罪
  rationale: 祭仪语境中的כפר表示施行赎罪，עַל标明赎罪所为之人；此译不额外限定其具体神学机制。
- source_word: לִפְנֵי
  choice: 在……面前
  rationale: 表达在雅威临在之前的祭仪关系，是自然且准确的对应。
- source_word: יְהוָה
  choice: 雅威
  rationale: 采用希伯来神名四字母的现代汉语音译，保留其专名性质，而不以称号替代。
- source_word: אֱלֹהֵיכֶם
  choice: 你们的上帝
  rationale: 在与雅威连用的盟约表达中为单数意义；“你们的上帝”保留其关系性表述。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用神的专名。译作“雅威”较贴近其学界通行的拟音，也避免把专名改成称号。
- issue: כפר及כִּפֻּרִים的祭仪含义
  choice: 赎罪／赎罪日
  alternative: 洁净；遮盖；诸赎罪之日
  rationale: 上下文属于祭司礼仪法规。“赎罪”保留其祭仪和修复关系的分量，同时不强行规定某一种后世的赎罪理论；节期名称采用自然汉语，原文复数形态则收入脚注。
translation_notes:
  register: 采用现代、庄重而易懂的律法文体。“不可做”保持禁令力度；“就在这一天”传达原文的强调而避免生硬直译。脚注标记紧随其所解释的“赎罪日”。
