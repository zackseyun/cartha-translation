  text: כָּל מְלָאכָ֖ה לֹ֣א תַעֲשׂ֑וּ חֻקַּ֤ת עוֹלָם֙ לְ/דֹרֹ֣תֵי/כֶ֔ם בְּ/כֹ֖ל מֹֽשְׁבֹֽתֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/031.yaml
  text: You shall do no work[b][a]. It is a permanent statute throughout your generations in all your dwelling places.
translation:
  language: zh_hans
  text: 不可做任何工。这要作你们世世代代、在一切住处永远的定例[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“永久的定例”或“长久的定例”。希伯来语“עוֹלָם”可表示长久、持续或永久。
    reason: lexical_alternative
  - marker: b
    text: 直译“在你们所有的住处”；也可译“在你们所有的定居地”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל מְלָאכָה לֹא תַעֲשׂוּ
  choice: 任何工都不可做
  rationale: מְלָאכָה指工作、劳作；כָּל与否定词连用，使禁令涵盖任何工作。“任何工都不可做”既保留全面禁止的语气，也符合现代汉语法规性表达。
- source_word: חֻקַּת עוֹלָם
  choice: 永远的定例
  rationale: חֻקָּה是固定的法规、定例；עוֹלָם表示长久、持续或永久。“永远的定例”保留原文的持久性措辞，同时不额外界定其哲学意义。
- source_word: לְדֹרֹתֵיכֶם
  choice: 你们世世代代
  rationale: 该词组表示此规定延续适用于后继各代。“世世代代”自然地传达跨越历代的持续范围。
- source_word: בְּכֹל מֹשְׁבֹתֵיכֶם
  choice: 无论住在哪里
  rationale: מוֹשָׁב可指住处或定居之地。此译法以自然现代汉语表达原文涵盖所有居住地点的范围。
theological_decisions:
- issue: 礼仪律例中的持续期限用语
  choice: 永远的定例
  alternative: 永久的定例／长久的定例
  rationale: 原文עוֹלָם可以表达长久、持续乃至永久。正文保留“永远”的强度，并用脚注说明其语义范围，避免擅自把经文限定为绝对无终或仅属暂时。
translation_notes:
  register: 采用现代、庄重而易懂的法规性语体。首句简洁保留禁令的全面性；后句为使希伯来语省略式名词结构在汉语中完整自然，补出“都要遵守”，不改变律例适用于历代及所有住处的含义。
