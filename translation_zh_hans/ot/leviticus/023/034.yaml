base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/034.yaml
  text: 'Speak to the sons of Israel[a], saying: On the fifteenth day of this seventh month is the Feast of Booths for seven days to Yahweh.'
translation:
  language: zh_hans
  text: 你要对以色列人说：‘这个第七个月的十五日，要向雅威守棚屋节，为期七天。’
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דַּבֵּר
  choice: 你要……说
  rationale: 这是对摩西的命令式吩咐；用“你要……说”保留律法宣告的正式语气，同时符合现代汉语表达。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 原文直译为“以色列的众子”，在此作为固定称谓，集体指以色列全体民众；“以色列人”在现代汉语中自然准确。
- source_word: לֵאמֹר
  choice: 说
  rationale: 这是引出直接话语的惯用结构，与前面的“对……说”合并表达，避免生硬重复。
- source_word: לַחֹדֶשׁ הַשְּׁבִיעִי הַזֶּה
  choice: 这第七个月
  rationale: 保留原文的指示词“这”和序数“第七”，也避免将其误解为现代公历的七月。
- source_word: חַג הַסֻּכּוֹת
  choice: 棚屋节
  rationale: סֻכּוֹת指临时搭建的棚屋或遮蔽处；“棚屋节”直接呈现词义，传统名称“住棚节”列入脚注。
- source_word: שִׁבְעַת יָמִים
  choice: 为期七天
  rationale: 以自然现代汉语清楚表达节期持续七日。
- source_word: לַיהוָה
  choice: 向雅威所守的
  rationale: 介词ל在此表示节期归向、献与雅威；“向雅威所守的”既自然，也保留敬拜与归属的含义。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”较直接地音译该立约之名，不以称号替代。
- issue: 节期名称 הַסֻּכּוֹת 的译法
  choice: 棚屋节
  alternative: 住棚节
  rationale: 正文优先呈现希伯来词的具体含义；脚注保留华语读者熟悉的传统名称，不把翻译传统写进原文本身。
- issue: לַיהוָה 所表达的关系
  choice: 向雅威所守的
  alternative: 献给雅威的
  rationale: 原文可表示节期归属、献与或朝向雅威；采用“向雅威所守的”保留敬拜方向，同时避免把它限定为祭物意义上的“献给”。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。直接引语使神谕结构清晰；“这第七个月”保留古代礼仪历法的表达，不误导为公历七月。
