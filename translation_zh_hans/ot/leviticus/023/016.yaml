  text: עַ֣ד מִֽ/מָּחֳרַ֤ת הַ/שַּׁבָּת֙ הַ/שְּׁבִיעִ֔ת תִּסְפְּר֖וּ חֲמִשִּׁ֣ים י֑וֹם וְ/הִקְרַבְתֶּ֛ם מִנְחָ֥ה חֲדָשָׁ֖ה לַ/יהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/016.yaml
  text: You shall count fifty days[a], up to the day after the seventh Sabbath; then you shall present a new grain offering to Yahweh.
translation:
  language: zh_hans
  text: 你们要数五十天[a]，直到第七个安息日的次日；然后要把新的素祭献给耶和华。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“直到第七周的次日。”希伯来文直译为“第七个安息日的次日”；对于这里节期计日方式的理解，解释者有不同看法。
    reason: 保留可能的历法理解，同时说明正文遵循希伯来文“第七个安息日”的措辞。
lexical_decisions:
- source_word: עַד מִמָּחֳרַת
  choice: 直到……的次日
  rationale: עַד标明计数所达到的时点，מִמָּחֳרַת指随后的一天；合译既贴近原文，也符合现代汉语。
- source_word: הַשַּׁבָּת הַשְּׁבִיעִת
  choice: 第七个安息日
  rationale: 原文明确使用“安息日”而非通常表示“周”的词，因此保留其字面表达，不在正文中消解历法上的歧义。
- source_word: תִּסְפְּרוּ חֲמִשִּׁים יוֹם
  choice: 你们要数五十天
  rationale: 法律指令中的未完成式译为“要数”；数词与日的组合自然译作“五十天”。
- source_word: וְהִקְרַבְתֶּם
  choice: 然后要……献
  rationale: 在献祭语境中，该动词指把祭物带来献上；“然后”自然表达前后次序。
- source_word: מִנְחָה חֲדָשָׁה
  choice: 新收的素祭
  rationale: מִנְחָה在利未记献祭术语中通常指素祭；“新收的”说明此祭取自新产物，并避免汉语“新的素祭”被误解为一种新设立的祭。
- source_word: לַיהוָה
  choice: 给耶和华
  rationale: 介词ל在此表示献祭的对象；以“耶和华”呈现经文中的神圣名号。
theological_decisions:
- issue: 神圣名号יהוה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 中文圣经传统中“耶和华”是普通读者最熟悉且庄重的专名形式；不以“主”替代，可保留原文使用专名这一事实。
- issue: הַשַּׁבָּת הַשְּׁבִיעִת应译作“第七个安息日”还是“第七周”
  choice: 第七个安息日
  alternative: 第七周
  rationale: 原文使用שַׁבָּת，保留“安息日”可避免替文本裁定有争议的节期历法解释；另一种理解置于脚注。
translation_notes:
  register: 采用现代、庄重而易懂的法规语体。“素祭”沿用中文读者熟悉的利未记祭祀术语；“新收的”使祭物来自新收成的含义自然清楚。
