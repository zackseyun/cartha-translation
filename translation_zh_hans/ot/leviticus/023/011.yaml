id: LEV.23.11
reference: Leviticus 23:11
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/הֵנִ֧יף אֶת הָ/עֹ֛מֶר לִ/פְנֵ֥י יְהוָ֖ה לִֽ/רְצֹנְ/כֶ֑ם מִֽ/מָּחֳרַת֙ הַ/שַּׁבָּ֔ת יְנִיפֶ֖/נּוּ הַ/כֹּהֵֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/011.yaml
  text: And he shall wave the sheaf before Yahweh for your acceptance[a]; on the day after the Sabbath the priest shall wave it.
translation:
  language: zh_hans
  text: 祭司要在耶和华面前摇动那一捆，使你们蒙悦纳[a]；安息日的次日，祭司要摇动它。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“为使供物替你们蒙悦纳。”希伯来语也可表示敬拜者借着这供物在耶和华面前蒙悦纳。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵנִיף
  choice: 要……摇动
  rationale: 该词是 נוּף 的使役式，在礼仪语境中指摇动或呈献祭物；“摇动”保留了具体的礼仪动作。
- source_word: הָעֹמֶר
  choice: 那一捆
  rationale: 此处指作为初熟供物献上的一捆庄稼，而非单纯的干量单位；“那一捆”自然承接上文。
- source_word: לִפְנֵי יְהוָה
  choice: 在耶和华面前
  rationale: 准确表达在上帝临在中举行礼仪呈献的意思，并以“耶和华”音译圣名。
- source_word: לִרְצֹנְכֶם
  choice: 使你们蒙悦纳
  rationale: 该短语在献祭语境中表示敬拜者借着供物得到接纳；此译法自然，同时以脚注保留“为使供物替你们蒙悦纳”的可能理解。
- source_word: מִמָּחֳרַת הַשַּׁבָּת
  choice: 安息日的次日
  rationale: 简明准确地表达指定为安息日之后的一天，不处理“安息日”具体所指的历法争议。
- source_word: יְנִיפֶנּוּ
  choice: 要摇动它
  rationale: 重复同一礼仪动词，并将阳性单数宾语后缀明确译为“它”，回指那一捆。
- source_word: הַכֹּהֵן
  choice: 祭司
  rationale: 符合祭祀法规语境中 כֹּהֵן 的标准汉语表达。
theological_decisions:
- issue: 神圣四字名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 采用现代中文圣经读者最熟悉的专名形式“耶和华”，保留其作为上帝名字的性质，而不以“主”这一称号替代。
- issue: לִרְצֹנְכֶם 在献祭语境中的指向
  choice: 使你们蒙悦纳
  alternative: 为使供物替你们蒙悦纳
  rationale: 希伯来语可表达敬拜者因这项呈献而蒙接纳，也可强调供物为他们而得蒙悦纳；正文采用较自然且以人为指向的译法，脚注保留另一层可能。
translation_notes:
  register: 采用庄重而清楚的现代标准普通话。“摇动”保留祭礼动作，“蒙悦纳”沿用可理解的宗教礼仪用语；句序基本贴近希伯来文，同时将主语“祭司”前置以符合汉语表达。
