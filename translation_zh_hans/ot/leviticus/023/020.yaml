source:
  edition: WLC
  text: וְ/הֵנִ֣יף הַ/כֹּהֵ֣ן אֹתָ֡/ם עַל֩ לֶ֨חֶם הַ/בִּכּוּרִ֤ים תְּנוּפָה֙ לִ/פְנֵ֣י יְהוָ֔ה עַל שְׁנֵ֖י כְּבָשִׂ֑ים קֹ֛דֶשׁ יִהְי֥וּ לַ/יהוָ֖ה לַ/כֹּהֵֽן׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/020.yaml
  text: The priest shall wave them with the bread of the firstfruits as a wave offering before Yahweh[a], with the two lambs. They shall be holy to Yahweh for the priest.
translation:
  language: zh_hans
  text: 祭司要把这些连同初熟之物的饼和两只羊羔，在雅威面前摇献[a]。这些要成为归雅威的圣物，归给祭司。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “连同……和……”原文也可直译为“在初熟之物的饼上面……在两只羊羔上面”；这里的介词可能表示这些祭物一同举行礼仪性呈献，并不一定指实际摆放在其上。
    reason: 说明介词 עַל 在礼仪语境中的词义选择，同时保留空间性直译的可能。
lexical_decisions:
- source_word: וְהֵנִיף
  choice: 要……摇献
  rationale: נוּף 的使役式在献祭语境中指在神面前举行摇献礼；“摇献”既保留礼仪动作，也符合现代中文圣经用语。
- source_word: אֹתָם
  choice: 这些
  rationale: 阳性复数宾格代词回指上文所述祭物；本节本身没有明确列出其全部所指，因此不用更具体的名词，以保留原文的回指开放性。
- source_word: עַל לֶחֶם הַבִּכּוּרִים
  choice: 连同初熟之物的饼
  rationale: עַל 字面可表示“在……上面”，但在此礼仪语境中较可能表示一同呈献；“连同”避免无根据地断定祭物彼此上下放置。
- source_word: לֶחֶם הַבִּכּוּרִים
  choice: 初熟之物的饼
  rationale: 保留名词属格关系，并将饼与本节节期中的初熟献礼联系起来；不把“初熟”误解为饼本身成熟。
- source_word: תְּנוּפָה
  choice: 摇献
  rationale: 这是献祭制度中的专门术语，指在雅威面前礼仪性地摇动或呈献祭物。
- source_word: לִפְנֵי יְהוָה
  choice: 在雅威面前
  rationale: 按原文表达在神临在之处举行礼仪，并直接音译神名 יהוה。
- source_word: עַל שְׁנֵי כְּבָשִׂים
  choice: 和两只羊羔
  rationale: 此处 עַל 与前一处相似，宜表达共同参与摇献；“羊羔”准确传达献祭语境中的 כְּבָשִׂים。
- source_word: קֹדֶשׁ יִהְיוּ
  choice: 这些要成为……圣物
  rationale: 谓语名词 קֹדֶשׁ 配合 היה 表示祭物取得分别为圣的身份；译作“圣物”比抽象的“成为圣洁”更清楚地表达祭物类别。
- source_word: לַיהוָה לַכֹּהֵן
  choice: 归雅威的……归给祭司
  rationale: 两个 לְ 短语并列形成献给雅威且划归祭司的关系；译文保留这种双重归属张力，不将其解释为祭司拥有独立于雅威的所有权。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”较贴近学界通常重建的读音，并区别于称号“主”。
- issue: 圣物归雅威同时归给祭司的关系
  choice: 归雅威的圣物，归给祭司
  alternative: 献给雅威，供祭司享用
  rationale: 原文简洁并列 לַיהוָה 与 לַכֹּהֵן，没有明确说明具体用途；译文保留神圣归属与祭司所得并存的法律和礼仪张力，不额外补入“享用”。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“摇献”“圣物”保留利未记礼仪术语的一致性；句式避免古奥文言，也不补足原文未明说的代词所指或礼仪摆放方式。
