language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וּֽ/בְ/קֻצְרְ/כֶ֞ם אֶת קְצִ֣יר אַרְצְ/כֶ֗ם לֹֽא תְכַלֶּ֞ה פְּאַ֤ת שָֽׂדְ/ךָ֙ בְּ/קֻצְרֶ֔/ךָ וְ/לֶ֥קֶט קְצִירְ/ךָ֖ לֹ֣א תְלַקֵּ֑ט לֶֽ/עָנִ֤י וְ/לַ/גֵּר֙ תַּעֲזֹ֣ב אֹתָ֔/ם אֲנִ֖י יְהוָ֥ה אֱלֹהֵי/כֶֽם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/022.yaml
  text: And when you reap the harvest of your land[a], you shall not completely reap the edge of your field, and you shall not gather the gleanings of your harvest; you shall leave them for the poor and for the sojourner[b]. I am Yahweh your God.
translation:
  language: zh_hans
  text: 你们收割自己土地上的庄稼时，你不可把田边[a]全都割尽，也不可捡拾收割时遗落的庄稼；要把它们留给穷人和寄居者[b]。我是雅威——你们的上帝。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“田角”。希伯来词可以指边缘、侧边或角落。
    reason: lexical_alternative
  - marker: b
    text: 也可译“寄居的外族人”，指住在以色列人中间、受以色列法律保护的非以色列人。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְקֻצְרְכֶם אֶת קְצִיר אַרְצְכֶם
  choice: 你们收割自己土地上的庄稼时
  rationale: 介词 בְּ 与不定式连用，在这里引出时间背景；“收割……时”符合现代汉语法律条文的表达。“庄稼”兼顾 קָצִיר 所指的收成或被收割的作物。
- source_word: לֹא תְכַלֶּה פְּאַת שָׂדְךָ בְּקֻצְרֶךָ
  choice: 你不可把田边全都割尽
  rationale: Piel 形式 תְכַלֶּה 表示彻底完成；“全都割尽”清楚表达不可一直收割到田地尽头。פֵּאָה 可指边缘、侧边或角落，正文采用较宽泛自然的“田边”。
- source_word: וְלֶקֶט קְצִירְךָ לֹא תְלַקֵּט
  choice: 也不可捡拾收割时遗落的庄稼
  rationale: לֶקֶט 指主要收割过程中散落、事后可捡拾的零散作物；“遗落的庄稼”比专门农业术语更便于普通读者理解，并保留其具体含义。
- source_word: לֶעָנִי
  choice: 给穷人
  rationale: עָנִי 在本条社会法规中指贫穷、经济困顿的人；“穷人”直接而自然。
- source_word: וְלַגֵּר
  choice: 给寄居者
  rationale: גֵּר 指住在以色列人中间、并受其社会法律保护的非本族居民；“寄居者”保留其居住与外来身份，不等同于临时访客。
- source_word: תַּעֲזֹב אֹתָם
  choice: 要把它们留给
  rationale: עָזַב 在此表示刻意留下而不收走，以供他人拾取；“留给”简洁表达目的。
- source_word: אֲנִי יְהוָה אֱלֹהֵיכֶם
  choice: 我是雅威——你们的上帝
  rationale: 以“雅威”音译神圣四字名 יְהוָה，并保留“你们的上帝”这一庄严的盟约宣告。破折号使同位关系在现代汉语中清楚自然。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用神圣四字名，音译为“雅威”可将专名与称号区分，并保留其作为盟约之神名的功能。
- issue: גֵּר 在以色列律法中的身份
  choice: 寄居者
  alternative: 外侨；寄居的外族人；陌生人
  rationale: “寄居者”既表达其非本族身份，又体现其长期住在当地并受律法保障的处境，避免套用现代国籍或移民制度概念。
- issue: 人称数目的转换
  choice: 保留开头和结尾的复数“你们”，并在个体命令中使用单数“你”
  alternative: 全节统一译为复数“你们”
  rationale: 希伯来文开头与结尾为复数，中间针对每个田地主体的命令为单数。保留转换可反映律法既面向全体，也逐一约束个人。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语，句式保留律法命令的力度。正文避免生僻农业术语，以“遗落的庄稼”表达 לֶקֶט；同时保留原文复数—单数—复数的人称变化。所有脚注标记均已置于正文相应词语之后。
