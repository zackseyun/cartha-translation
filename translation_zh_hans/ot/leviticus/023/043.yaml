source:
  edition: WLC
  text: לְמַעַן֮ יֵדְע֣וּ דֹרֹֽתֵי/כֶם֒ כִּ֣י בַ/סֻּכּ֗וֹת הוֹשַׁ֨בְתִּי֙ אֶת בְּנֵ֣י יִשְׂרָאֵ֔ל בְּ/הוֹצִיאִ֥/י אוֹתָ֖/ם מֵ/אֶ֣רֶץ מִצְרָ֑יִם אֲנִ֖י יְהוָ֥ה אֱלֹהֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/043.yaml
  text: so that your generations may know that I made the sons of Israel dwell in booths when I brought them out of the land of Egypt[b][a]. I am Yahweh your God.
translation:
  language: zh_hans
  text: 好让你们世世代代都知道：我领以色列人[b]出埃及地的时候，曾使他们住在棚屋里[a]。我是耶和华你们的上帝。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “棚屋”也可译作“临时住所”或“遮蔽棚”；希伯来语指临时搭建的棚屋，是“住棚节”名称所用的同一个词。
    reason: lexical_alternative
  - marker: b
    text: “以色列人”原文直译为“以色列的众子”，是对以色列民的群体称呼。
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן יֵדְעוּ דֹרֹתֵיכֶם
  choice: 好让你们世世代代都知道
  rationale: לְמַעַן引出目的；“好让”自然表达目的关系。“世世代代”准确传达דֹרֹתֵיכֶם所指连续多代的人，比生硬的“你们的世代”更符合现代汉语。
- source_word: כִּי
  choice: ：
  rationale: 此处引出“知道”的具体内容。汉语用冒号比直译为“就是”或“知道……这件事”更自然，同时保持内容从句的功能。
- source_word: בַסֻּכּוֹת
  choice: 住在棚子里
  rationale: סֻכּוֹת指临时搭建的棚屋或遮蔽处；“棚子”通俗清楚，也保留与住棚节名称的词汇联系。
- source_word: הוֹשַׁבְתִּי
  choice: 曾使他们住
  rationale: 采用“使……住”保留ישׁב使役式的使役意义；“曾”标明这里回顾出埃及时的历史行动。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 这个固定群体称谓在现代汉语中自然译作“以色列人”，包括整个以色列民；若直译“以色列的儿子们”会造成谱系或性别上的误解。
- source_word: בְּהוֹצִיאִי אוֹתָם
  choice: 我领……出……的时候
  rationale: 介词בְּ加不定式结构表达时间背景；“领……出……的时候”自然准确地呈现上帝带领他们离开的行动。
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: 出埃及地
  rationale: 保留原文אֶרֶץ“地”的成分，并采用汉语圣经语体中自然、简洁的表达。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文读者熟悉的专名“耶和华”明确呈现四字神名，而不以称号“主”替代。
- source_word: אֱלֹהֵיכֶם
  choice: 你们的上帝
  rationale: 直接保留第二人称复数所属关系和盟约宣告的措辞。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用神的专名而非“主”这一称号。中文正文采用广为人知且具专名功能的“耶和华”；“雅威”是学术界常见的另一音译。
- issue: הוֹשַׁבְתִּי所表达的使役关系
  choice: 曾使他们住在棚子里
  alternative: 曾安置他们住在棚子里
  rationale: 保留使役式，明确棚居经历处于上帝的作为之中；不进一步解释棚子究竟指旷野中的哪类居所，以免消除原文留下的历史和意象张力。
- issue: בְּנֵי יִשְׂרָאֵל的群体含义
  choice: 以色列人
  alternative: 以色列的子孙
  rationale: 这里指作为整体的以色列民，并非只强调男性后裔；“以色列人”最自然且不改变所指范围。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“好让”和“……的时候”使句法自然；“世世代代”保留跨代记念的盟约语感。正文中的[a][b]均有对应脚注。
