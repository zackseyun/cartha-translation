base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/001.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: zh_hans
  text: 雅威[a]对摩西说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文：YHWH；传统上译作“耶和华”。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: 说
  rationale: 该词在叙事中引出上帝接下来的话。汉语用“对摩西说”自然、庄重，也无需重复翻译后面的 לֵאמֹר。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代简体中文读者熟悉的圣经专名“耶和华”来表示四字神名 YHWH，并以脚注说明原文形式。
- source_word: אֶל מֹשֶׁה
  choice: 对摩西
  rationale: 介词 אֶל 在言说结构中标明受话者，现代汉语自然表达为“对摩西”。
- source_word: לֵאמֹר
  choice: （并入“说”）
  rationale: 这是引出直接引语的惯用不定式。若逐字译成“说：……说道”，汉语会显得重复，因此与 וַיְדַבֵּר 合译为“说：”。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威；主
  rationale: 原文直接使用以四个辅音字母构成的神名，而非“主”这一称号。正文采用中文圣经传统中广为人知的专名“耶和华”，不以称号取代；脚注保留原文 YHWH 的信息。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。希伯来语的“说话……说道”公式合并为汉语常用的“对摩西说：”，冒号提示下文为话语内容。
