    issue: “公牛犊”过度限定年龄
    rationale: פַּר בֶּן־בָּקָר 指牛群中的公牛（在部分语境可带年轻公牛的色彩），但“牛犊”在中文通常指幼龄小牛，可能缩窄原文所指。译作“公牛”保留原文的稳妥范围。
  - severity: medium
    issue: “为馨香之祭”改变并弱化原文句法
    rationale: רֵיחַ נִיחֹחַ 的核心是“怡人／馨香的香气”，并由 לַיהוה 指向耶和华；它不是与燔祭、火祭并列的另一技术性祭名。应使“馨香”作为对火祭的描述，并明确其献给耶和华。
  - severity: low
    issue: “公绵羊羔”用语叠沓
    rationale: “公羊羔”已自然表达“雄性幼羊”；“公绵羊羔”虽可理解，但不符合现代标准汉语的常用搭配。
