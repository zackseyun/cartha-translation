- from: 你们要把七只一岁的、没有残疾的公绵羊羔，连同那饼[a]一起献上，又献一头公牛犊和两只公绵羊。这些要作献给耶和华的燔祭，连同相应的素祭和奠祭，作为火祭[b]，献给耶和华为馨香之祭。
  to: 你们要把七只一岁的、没有残疾的公羊羔，连同那饼[a]一起献上；又要献一头公牛和两只公绵羊。这些要作献给耶和华的燔祭，连同相应的素祭和奠祭，作为献给耶和华、馨香的火祭[b]。
  rationale: 修订避免把公牛误限为牛犊，并将“馨香”恢复为对火祭及其归向耶和华的祭祀描述。其余祭牲清单、伴随“那饼”的含义和术语均予保留。
