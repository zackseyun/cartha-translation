id: LEV.23.18
reference: Leviticus 23:18
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/הִקְרַבְתֶּ֣ם עַל הַ/לֶּ֗חֶם שִׁבְעַ֨ת כְּבָשִׂ֤ים תְּמִימִם֙ בְּנֵ֣י שָׁנָ֔ה וּ/פַ֧ר בֶּן בָּקָ֛ר אֶחָ֖ד וְ/אֵילִ֣ם שְׁנָ֑יִם יִהְי֤וּ עֹלָה֙ לַֽ/יהוָ֔ה וּ/מִנְחָתָ/ם֙ וְ/נִסְכֵּי/הֶ֔ם אִשֵּׁ֥ה רֵֽיחַ נִיחֹ֖חַ לַ/יהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/018.yaml
  text: And with the bread you shall present seven male lambs a year old[a], without blemish, and one bull from the herd, and two rams. They shall be a burnt offering to Yahweh, with their grain offering and their drink offerings, a food offering[b], a pleasing aroma to Yahweh.
translation:
  language: zh_hans
  text: 你们要把七只一岁的、没有残疾的公羊羔，连同那饼[a]一起献上；又要献一头公牛和两只公绵羊。这些要作献给耶和华的燔祭，连同相应的素祭和奠祭，作为献给耶和华、馨香的火祭[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “连同那饼”也可译作“在那饼旁边”或“除那饼以外”；希伯来语介词在这里可以表示伴随或附加，并不一定指把祭牲放在饼上。
    reason: lexical_alternative
  - marker: b
    text: “火祭”也可译作“经火献上的祭物”。“馨香”直指祭物所发出、归于耶和华的怡人香气。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרַבְתֶּם
  choice: 你们要……献上
  rationale: 使役式在献祭语境中指把祭物带近并呈献；“献上”符合现代汉语礼仪语境。
- source_word: עַל הַלֶּחֶם
  choice: 连同那饼一起
  rationale: עַל 在此祭祀公式中可表示伴随或附加，而非必然指放在饼上；正文采用自然的伴随义，并以脚注保留其他可能。
- source_word: שִׁבְעַת כְּבָשִׂים תְּמִימִם בְּנֵי שָׁנָה
  choice: 七只一岁的、没有残疾的公绵羊羔
  rationale: 准确表达数量、年龄、性别及祭牲必须无残疾的要求。
- source_word: וּפַר בֶּן בָּקָר אֶחָד
  choice: 一头公牛犊
  rationale: פַר בֶּן־בָּקָר 指牛群中的幼公牛；“公牛犊”简明地保留其类别与年龄色彩。
- source_word: וְאֵילִם שְׁנָיִם
  choice: 两只公绵羊
  rationale: אַיִל 特指成年公绵羊，与前面的公羊羔有所区别。
- source_word: יִהְיוּ עֹלָה לַיהוָה
  choice: 这些要作献给耶和华的燔祭
  rationale: עֹלָה 是整牲焚烧的专门祭名；单数在此统摄所列祭牲。
- source_word: וּמִנְחָתָם וְנִסְכֵּיהֶם
  choice: 连同相应的素祭和奠祭
  rationale: 代词后缀指与这些燔祭相配的祭物；“相应的”比汉语中的复数表达更自然。
- source_word: אִשֵּׁה
  choice: 火祭
  rationale: 该词指经火献上的祭物；“火祭”直接保留火的要素，并用脚注说明也可展开翻译。
- source_word: רֵיחַ נִיחֹחַ
  choice: 馨香之祭
  rationale: 这是固定祭祀表达，表示其香气蒙悦纳；“馨香之祭”庄重且易于理解。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 正文采用现代中文圣经读者最熟悉的专名“耶和华”，并将其作为专名而非以“主”替代；“雅威”是较接近学术重构发音的另一译法。
- issue: רֵיחַ נִיחֹחַ 是否明说神的悦纳
  choice: 馨香之祭
  alternative: 蒙耶和华悦纳的香气
  rationale: 原文是高度凝练的祭祀惯用语；正文保留其意象与礼仪色彩，不把“悦纳”的隐含意义完全解释进正文。
translation_notes:
  register: 采用现代、庄重而易懂的祭祀用语。“素祭”“奠祭”“燔祭”保留利未记中的固定术语；句式按中文重组，同时保持原文所列祭牲及随附祭物的关系。
