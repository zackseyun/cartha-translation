review_pass:
  verdict: revise
  source_fidelity: 译文基本忠实呈现六日可做工、第七日为强化安息的安息日、圣会、禁做任何工，以及此日归于雅威等要素。“向雅威守的安息日”虽试图表达 לַיהוָה，却使“在你们一切住处”的范围和“归属雅威”的谓语关系略显含混；改为“归于雅威的安息日”更直接而不扩大含义。
  naturalness: “任何工你们都不可做”受原文语序影响较重，在现代汉语中不够自然，宜改为“你们不可做任何工”。“神圣集会的日子”可懂，但原文直接称该日为“圣会”；用“圣会”更简洁、庄重，也不额外加入“日子”的分类说明。
  terminology: “雅威”一致、准确地保留了神名。 “完全安息的安息日”可保留原文同源强化，且适合律法语体；“圣会”是 מִקְרָא קֹדֶשׁ 的常用准确对应。
  issues:
  - severity: medium
    issue: 末句的句法关系含混
    rationale: “这是在你们一切住处向雅威守的安息日”容易被读成仅在住处向雅威举行某项守日活动，未清楚表达“这是归于雅威的安息日”以及命令遍及一切住处的范围。
  - severity: low
    issue: 禁令语序不合现代汉语常规
    rationale: “任何工你们都不可做”虽可理解，却不如“你们不可做任何工”自然清楚。
  - severity: low
    issue: “神圣集会的日子”略有释义性扩展
    rationale: מִקְרָא קֹדֶשׁ 直指受召集的圣会；译为“圣会”更贴近原文的名词断语和汉语圣经法律语体。
  revised_text: 六日可以做工；但第七日是完全安息的安息日，是圣会。你们不可做任何工；在你们一切住处，这都是归于雅威的安息日。[a]
