base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/003.yaml
  text: For six days work may be done[a], but on the seventh day is a Sabbath of complete rest, a holy convocation. You shall do no work[b]; it is a Sabbath to Yahweh in all your dwellings.
translation:
  language: zh_hans
  text: 六日可以做工；但第七日是完全安息的安息日，是圣会。你们不可做任何工；在你们一切住处，这都是归于雅威的安息日。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在你们一切住处”也可译作“在你们各处的定居地”或“遍及你们一切定居处”。
    reason: lexical_alternative
lexical_decisions:
- source_word: תֵּעָשֶׂה מְלָאכָה
  choice: 可以做工
  rationale: 保留尼法勒未完成式的被动、许可性语气；汉语用“可以做工”自然表达六日之内工作获准进行。
- source_word: שַׁבַּת שַׁבָּתוֹן
  choice: 完全安息的安息日
  rationale: 以名词重复式表达原文的强化结构，兼顾“安息日”与彻底停止劳作之意。
- source_word: מִקְרָא קֹדֶשׁ
  choice: 神圣集会的日子
  rationale: מִקְרָא 含召集、集会之意；此译法在现代汉语中清楚表达正式召集的圣会。
- source_word: כָּל מְלָאכָה לֹא תַעֲשׂוּ
  choice: 任何工你们都不可做
  rationale: 保留第二人称复数的直接禁令，并以前置宾语体现全面禁止的强调。
- source_word: שַׁבָּת הִוא לַיהוָה
  choice: 这是……向雅威守的安息日
  rationale: “向雅威守”自然表达介词 לְ 所标示的归属与朝向，同时不把它简化为单纯所有关系。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文四字神名音译为现代简体中文常见形式“雅威”，不以称号代替专名。
- source_word: בְּכֹל מוֹשְׁבֹתֵיכֶם
  choice: 在你们一切住处
  rationale: מוֹשָׁב 可指居住之处或定居点；正文采用较贴近词形且简明的“住处”，并以脚注保留另一可能。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用以色列上帝的专名；采用“雅威”较贴近学界通常重构的读音，也避免用“主”这一称号取代专名。
- issue: שַׁבַּת שַׁבָּתוֹן 的强调程度
  choice: 完全安息的安息日
  alternative: 严肃安息的安息日
  rationale: 此同源组合强化停止劳作、安息的程度；“完全安息”保留法律语境中的力度，又不加入后期教义解释。
- issue: לַיהוָה 所表达的关系
  choice: 向雅威守的
  alternative: 归雅威的
  rationale: 介词既可体现归属，也可体现面向雅威而遵守；正文选择自然汉语中的“向雅威守”，不将其限定为纯所有关系。
translation_notes:
  register: 采用现代、庄重而易懂的法律性语体。“六日”保留经文凝练风格；分号呈现六日做工与第七日安息之间的对照。正文仅设置一个脚注，标记[a]已在正文出现。
