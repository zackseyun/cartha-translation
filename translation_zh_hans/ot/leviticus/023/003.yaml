revisions:
- from: 六日可以做工；但第七日是完全安息的安息日，是神圣集会的日子。任何工你们都不可做；这是在你们一切住处向雅威守的安息日。[a]
  to: 六日可以做工；但第七日是完全安息的安息日，是圣会。你们不可做任何工；在你们一切住处，这都是归于雅威的安息日。[a]
  rationale: 修订使禁令和末句的现代汉语表达更自然、句法范围更明确，并以“归于雅威的”直接对应 לַיהוָה 所表达的归属／奉献关系。“圣会”保留正式受召集的礼仪集会含义；脚注仍锚定“住处”，保留 מוֹשָׁב 可指居所或定居地的词义范围。
