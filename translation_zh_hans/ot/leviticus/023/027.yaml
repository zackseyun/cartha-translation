id: LEV.23.27
reference: Leviticus 23:27
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: אַ֡ךְ בֶּ/עָשׂ֣וֹר לַ/חֹדֶשׁ֩ הַ/שְּׁבִיעִ֨י הַ/זֶּ֜ה י֧וֹם הַ/כִּפֻּרִ֣ים ה֗וּא מִֽקְרָא קֹ֨דֶשׁ֙ יִהְיֶ֣ה לָ/כֶ֔ם וְ/עִנִּיתֶ֖ם אֶת נַפְשֹׁתֵי/כֶ֑ם וְ/הִקְרַבְתֶּ֥ם אִשֶּׁ֖ה לַ/יהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/027.yaml
  text: But on the tenth day of this seventh month[a], it is the Day of Atonement. It shall be a holy convocation for you[c][b], and you shall afflict yourselves and present a food offering to Yahweh.
translation:
  language: zh_hans
  text: 不过，在这个第七个月的初十，是赎罪日[a]。你们要举行圣会，刻苦己心[b]，并把火祭[c]献给耶和华。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “赎罪”的希伯来语形式是复数；也可较直译为“诸般赎罪之日”。
    reason: 保留原文 יוֹם הַכִּפֻּרִים 的复数形态，而不在正文中使用生硬的中文节期名称。
  - marker: b
    text: 或译：“克制自己”“使自己谦卑”。这里没有把该命令仅仅限定为禁食。
    reason: 说明 וְעִנִּיתֶם אֶת נַפְשֹׁתֵיכֶם 这一习语的主要词义可能性，并保留其礼仪含义的宽度。
  - marker: c
    text: 即经火献上的祭物；有译本译作“食物祭”。
    reason: 解释 אִשֶּׁה 这一祭司术语，并列出其重要替代译法。
lexical_decisions:
- source_word: אַךְ
  choice: 不过
  rationale: 该语气词在这里标明带有限定和强调意味的转折，引出与前一节不同的节期规定；“不过”自然地保留这种语篇作用。
- source_word: בֶּעָשׂוֹר לַחֹדֶשׁ הַשְּׁבִיעִי הַזֶּה
  choice: 这第七个月初十
  rationale: “初十”是现代汉语表达某月第十日的自然说法，同时保留原文的指示词“这”。
- source_word: יוֹם הַכִּפֻּרִים
  choice: 赎罪日
  rationale: 采用现代汉语中清楚、通行的节期名称；汉语名词本身不强制区分单复数，原文复数形式的信息由脚注保留。
- source_word: מִקְרָא קֹדֶשׁ
  choice: 举行圣会
  rationale: 该固定礼仪用语指被召集的神圣聚会；结合 יִהְיֶה לָכֶם 译成“你们要举行圣会”，比生硬的名词句更符合现代汉语。
- source_word: וְעִנִּיתֶם אֶת נַפְשֹׁתֵיכֶם
  choice: 刻苦己心
  rationale: 保留“使自己受苦、克制自己”的礼仪和悔罪意味，不将其限定为禁食，也不把 נֶפֶשׁ 误解为与整个人分离的抽象灵魂。
- source_word: אִשֶּׁה
  choice: 火祭
  rationale: 该祭司用语指经火献上的祭物；“火祭”简洁、庄重，并避免把词义进一步限定为某一种具体祭物。
- source_word: לַיהוָה
  choice: 献给耶和华
  rationale: 以中文读者熟悉的专名形式表达四字神名 יהוה，并清楚保留介词所表示的献祭对象。
theological_decisions:
- issue: יוֹם הַכִּפֻּרִים 中复数形式的呈现
  choice: 正文采用“赎罪日”，脚注说明希伯来语为复数形式
  alternative: 诸般赎罪之日
  rationale: 现代汉语的“赎罪”不标示语法数，因此“赎罪日”既自然，也没有否定原文复数；脚注则使读者看见原文形态，避免用不自然的中文替原文消除或扩大其含义。
- issue: “刻苦己心”的具体内容
  choice: 不把命令直接等同于禁食
  alternative: 禁食；谦卑自己；克制自己
  rationale: 原文习语的范围比单一的禁食行为更广，也可能兼具自我克制、受苦和谦卑的意味；正文保留其张力，脚注列出主要理解。
- issue: אִשֶּׁה 的祭祀含义
  choice: 火祭
  alternative: 食物祭；经火献上的祭物
  rationale: “火祭”最直接呈现该祭司术语与火的关联；脚注说明其所指，以免读者误以为“火”本身就是祭物。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“初十”“举行圣会”“献给”等表达便于普通读者理解；“赎罪日”“火祭”保留利未记礼仪语境所需的正式色彩。所有脚注标记均紧随其所解释的词语。
