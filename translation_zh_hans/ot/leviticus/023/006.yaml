  text: וּ/בַ/חֲמִשָּׁ֨ה עָשָׂ֥ר יוֹם֙ לַ/חֹ֣דֶשׁ הַ/זֶּ֔ה חַ֥ג הַ/מַּצּ֖וֹת לַ/יהוָ֑ה שִׁבְעַ֥ת יָמִ֖ים מַצּ֥וֹת תֹּאכֵֽלוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/006.yaml
  text: And on the fifteenth day of this month is the Feast of Unleavened Bread to Yahweh[a]; for seven days you shall eat unleavened bread.
translation:
  language: zh_hans
  text: 在本月十五日，是归雅威[a]的无酵节；你们要吃无酵饼七天。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“献给雅威”。这里的希伯来语介词既可表示归属，也可表示奉献的对象。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בַ/חֲמִשָּׁה עָשָׂר יוֹם לַ/חֹדֶשׁ הַ/זֶּה
  choice: 这月十五日
  rationale: 按现代汉语日期表达整合为“这月十五日”，准确传达该月中的具体日期；句首连词在单节独立呈现时不必机械译出。
- source_word: חַג הַ/מַּצּוֹת
  choice: 无酵节
  rationale: 这是节期名称；“无酵节”是简明、通行且能体现专名性质的现代中文表达。
- source_word: לַ/יהוָה
  choice: 献给雅威
  rationale: 将圣名 יְהוָה 音译为“雅威”；介词 ל־ 在这里可表示奉献或归属，“献给”自然地保留奉献关系，同时用脚注说明另一种可能。
- source_word: שִׁבְעַת יָמִים
  choice: 七天
  rationale: 表示持续时段；置于宾语之后符合自然现代汉语语序。
- source_word: מַצּוֹת
  choice: 无酵饼
  rationale: 此处指食用的未发酵饼，与节期名称中的“无酵”相呼应，也比泛称“无酵食物”更贴近名词复数所指。
- source_word: תֹּאכֵלוּ
  choice: 你们要吃
  rationale: 未完成式在律法语境中具有指令作用；“要吃”保留规范性，又避免现代汉语中过度生硬或加强语气。
theological_decisions:
- issue: 神圣四字名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用神的专名；“雅威”较贴近学界通常重构的读音，并保留其作为专名的性质。
- issue: 介词 ל־ 在“לַיהוָה”中的关系
  choice: 献给雅威
  alternative: 归雅威
  rationale: 该介词可表达奉献的对象或归属关系。正文采用自然的奉献表达，但不把归属义排除，因此以脚注保留另一译法。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。“无酵节”作为节期名，“无酵饼”作为食物名，既清楚区分又保持词义关联。指令使用“你们要吃”，适合律法文本而不过分古雅。
