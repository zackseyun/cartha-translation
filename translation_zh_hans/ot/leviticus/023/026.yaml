  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/026.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: zh_hans
  text: 雅威[a]对摩西说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文：יהוה（YHWH），即上帝的名；其发音并不完全确定，传统上也译作“耶和华”。
    reason: 说明四字神名的原文形式、发音的不确定性及传统译名。
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: 说
  rationale: 该叙事性动词引出新的神谕。在现代汉语中，“对摩西说”自然准确；与后面的 לֵאמֹר 合并表达，可避免生硬重复。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 这是四字神名 יהוה。采用现代中文圣经读者熟悉的专名形式“耶和华”，并以脚注说明原文及其他音译。
- source_word: אֶל־מֹשֶׁה
  choice: 对摩西
  rationale: 介词 אֶל 标明话语的对象；“对摩西”符合现代标准汉语表达。人名 מֹשֶׁה 采用通行译名“摩西”。
- source_word: לֵאמֹר
  choice: 说（以冒号引出下文）
  rationale: 该不定式是固定的引语导入形式。汉语无需逐字重复为“说……说”，以“说：”自然承载其功能。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名，而非“主”这一称号。正文保留中文传统中广为人知的专名“耶和华”，脚注注明原文 YHWH 及“雅威”等音译，既不以称号替代神名，也不把有争议的发音当作唯一确定形式。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。希伯来语“讲话……说”的公式结构合并为“对摩西说：”，冒号承接下一节的直接引语。
