  text: מִ/מּוֹשְׁבֹ֨תֵי/כֶ֜ם תָּבִ֣יאּוּ לֶ֣חֶם תְּנוּפָ֗ה שְׁ֚תַּיִם שְׁנֵ֣י עֶשְׂרֹנִ֔ים סֹ֣לֶת תִּהְיֶ֔ינָה חָמֵ֖ץ תֵּאָפֶ֑ינָה בִּכּוּרִ֖ים לַֽ/יהוָֽה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/017.yaml
  text: From your dwellings you shall bring two loaves of bread for a wave offering[a]; they shall be of two-tenths of an ephah of fine flour, baked with leaven[b], as firstfruits to Yahweh.
translation:
  language: zh_hans
  text: 你们要从你们的住处带来两个作摇祭的饼；每个饼要用伊法的十分之二[a]细面制成，烤成有酵的饼[b]，作为献给雅威的初熟之物。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文作“两个十分之一”；在祭司文本的计量体系中，指伊法的十分之二。
    reason: cultural_note
  - marker: b
    text: 或译：“用酵烤制。”原文明确说明这些作为初熟之物的饼是有酵的。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִמּוֹשְׁבֹתֵיכֶם
  choice: 从自己的住处
  rationale: מוֹשָׁב指居住之处或聚居地；“从自己的住处”自然地保留了来源地点的含义。
- source_word: לֶחֶם תְּנוּפָה
  choice: 两个饼，作摇祭
  rationale: לֶחֶם虽为单数形式，却由“两个”限定，故按汉语表达译为“两个饼”；תְּנוּפָה是祭礼术语，译作“摇祭”。
- source_word: שְׁנֵי עֶשְׂרֹנִים סֹלֶת
  choice: 每个饼要用伊法的十分之二细面做成
  rationale: “两个十分之一”在祭司计量体系中指伊法的十分之二。结合复数系词及相近平行规定，该分量宜理解为每个饼的用量；将隐含单位补出，并以脚注说明。
- source_word: חָמֵץ תֵּאָפֶינָה
  choice: 加酵烤制
  rationale: חָמֵץ明确表示有酵或发酵的状态，תֵּאָפֶינָה表示被烤成；“加酵烤制”简洁清楚，同时保留这批初熟饼有酵这一特殊规定。
- source_word: בִּכּוּרִים
  choice: 初熟之物
  rationale: בִּכּוּרִים指献给上帝的初熟出产；此处把两个饼界定为初熟献物。
- source_word: לַיהוָה
  choice: 献给雅威
  rationale: 介词ל表示奉献的对象；以“献给”明确其祭礼关系，并将יהוה音译为“雅威”，保留盟约之名。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；“雅威”较贴近学界通常复原的读音，并避免以称号替代专名。
- issue: 祭礼术语 תְּנוּפָה
  choice: 摇祭
  alternative: 挥献祭；举祭
  rationale: “摇祭”保留了该词所指的特定呈献动作与传统祭礼类别，同时不进一步断定动作的具体方向或方式。
- issue: “两个十分之一”与两个饼的数量关系
  choice: 每个饼用伊法的十分之二
  alternative: 两个饼合计用伊法的十分之二
  rationale: 希伯来文未明说“每个”，但复数“它们要是”和祭司传统中的相近平行用法支持逐饼理解；正文采用较自然且较可能的理解，脚注交代原文的简略表达。
translation_notes:
  register: 采用现代、庄重而易懂的祭礼法规语体。“要”体现指令性；“细面”“摇祭”“初熟之物”保持利未记关键术语的一致性。
