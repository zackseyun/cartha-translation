  text: אֵ֚לֶּה מוֹעֲדֵ֣י יְהוָ֔ה מִקְרָאֵ֖י קֹ֑דֶשׁ אֲשֶׁר תִּקְרְא֥וּ אֹתָ֖/ם בְּ/מוֹעֲדָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/004.yaml
  text: These are the appointed times of Yahweh[a], holy convocations[b], which you shall proclaim at their appointed times.
translation:
  language: zh_hans
  text: 以下是雅威所定的时日[a]，是神圣的集会[b]；你们要在各自所定的时间宣告它们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“所定的节期”“指定的时节”。希伯来语 מוֹעֵד 不只指节庆或筵席，也可指雅威所指定的时间。
    reason: lexical_alternative
  - marker: b
    text: 或译“圣会”“神圣的召集”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  choice: 以下是
  rationale: 用现代汉语自然引出下文将要列举的项目，并补出希伯来语名词句中隐含的判断关系。
- source_word: מוֹעֲדֵי
  choice: 所定的时日
  rationale: מוֹעֵד兼有指定时间、约定时刻及聚集之期的含义；“所定的时日”突出时间性，又不把范围缩窄为宴席或一般节庆。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见音译呈现四字神名，保留原文使用专名而非称号的特点。
- source_word: מִקְרָאֵי קֹדֶשׁ
  choice: 神圣的集会
  rationale: 该结构指分别为圣、由召集而形成的会众聚集；此译兼顾圣洁性质与集会含义。
- source_word: תִּקְרְאוּ אֹתָם
  choice: 你们要……宣告它们
  rationale: קרא在这里带有公开宣布、召集的意味；保留复数宾语“它们”，避免把原文明确限定为单纯命名或实际举行。
- source_word: בְּמוֹעֲדָם
  choice: 在各自所定的时间
  rationale: 复数所属后缀表明每一项都有相应的指定时刻；此译自然表达这一分配关系，也呼应前面的“所定的时日”。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名。音译“雅威”既保留其专名性质，也避免以称号替代原文。
- issue: מוֹעֵד 的范围
  choice: 所定的时日
  alternative: 节期；所定的节庆
  rationale: 本章语境涉及以色列的宗教日历，但该词本身比宴席或节庆更宽，也可涵盖安息日等神圣时间，因此不在正文中把含义缩窄。
- issue: 关系从句所指
  choice: 以“它们”保留复数回指
  alternative: 你们要宣布举行这些集会
  rationale: אֹתָם在语法上回指阳性复数，可能着重前面的“所定的时日”，而“神圣的集会”又与之同位。直译为“它们”可保留这种关联张力，不擅自限定为某一种解释。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“时日”较“日期”略具礼仪语境，又仍为普通读者易懂；句末保留“宣告它们”，以贴近原文并维持其回指上的开放性。
