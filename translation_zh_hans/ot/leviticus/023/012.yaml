  text: וַ/עֲשִׂיתֶ֕ם בְּ/י֥וֹם הֲנִֽיפְ/כֶ֖ם אֶת הָ/עֹ֑מֶר כֶּ֣בֶשׂ תָּמִ֧ים בֶּן שְׁנָת֛/וֹ לְ/עֹלָ֖ה לַ/יהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/012.yaml
  text: On the day you wave the sheaf[a], you shall offer a male lamb without blemish, a year old, as a burnt offering to Yahweh.
translation:
  language: zh_hans
  text: 你们摇献禾捆[a]的那一天，要把一只一岁的、没有残疾的公羊羔献给雅威作燔祭。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“俄梅珥”。这个词也可指一种干量单位；这里很可能指在礼仪中摇献的禾捆。
    reason: 保留עֹמֶר的词义范围，并说明本节按具体祭物翻译的语境依据。
lexical_decisions:
- source_word: וַעֲשִׂיתֶם
  choice: 要把……献给
  rationale: עָשָׂה本义宽泛，可表示“做、制作”；在献祭法规中可指办理或献上祭物。译为“献给”既符合本节祭祀语境，也使现代汉语自然清楚。
- source_word: בְּיוֹם
  choice: ……的那一天
  rationale: 介词בְ与“日子”构成时间状语；结合后面的属格结构，译作“……的那一天”最符合现代汉语表达。
- source_word: הֲנִיפְכֶם
  choice: 你们摇献
  rationale: נוף的使役形在礼仪语境中指在雅威面前摇动祭物。采用“摇献”保留这一专门的礼仪动作，同时避免把它泛化为普通的“献上”。
- source_word: הָעֹמֶר
  choice: 禾捆
  rationale: עֹמֶר既可指容量单位，也可指收割后扎成的一捆谷物；本段描述初熟收成的摇献礼仪，具体指所献的禾捆。脚注保留“俄梅珥”这一可能译法。
- source_word: כֶּבֶשׂ
  choice: 公绵羊羔
  rationale: 该阳性名词指羊羔，在献祭规定中为公羊羔；“公绵羊羔”明确呈现动物种类和性别。
- source_word: תָּמִים
  choice: 没有残疾
  rationale: 在祭牲语境中，תָּמִים指没有身体缺陷、合乎献祭要求；“没有残疾”是准确且普通读者易懂的表达。
- source_word: בֶּן שְׁנָתוֹ
  choice: 一岁
  rationale: 这是表示祭牲年龄的希伯来语惯用说法；“一岁”简洁自然，并保留经文明确的年龄规定。
- source_word: לְעֹלָה
  choice: 作燔祭
  rationale: עֹלָה是整只焚烧献上的祭；“燔祭”是准确而通行的汉语圣经礼仪术语。
- source_word: לַיהוָה
  choice: 献给雅威
  rationale: 介词לְ表示祭物归向雅威；“献给”自然呈现这一关系。“雅威”按其希伯来语形式音译神的立约之名。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名。译作“雅威”较贴近YHWH的通行学术复原读音，也避免以称号替代专名；“耶和华”是汉语传统中广为人知的另一音译。
- issue: עֹמֶר在本节指容量还是禾捆
  choice: 禾捆
  alternative: 俄梅珥（容量单位）
  rationale: 本段的收割与摇献语境表明，这里所指更可能是作为礼仪祭物的一捆谷物，而不只是抽象的干量单位；脚注仍保留词义上的另一种可能。
translation_notes:
  register: 采用现代、庄重而易懂的规范汉语。“摇献”和“燔祭”保留必要的礼仪术语；句序按汉语习惯调整为时间状语在前、祭牲要求在后。
