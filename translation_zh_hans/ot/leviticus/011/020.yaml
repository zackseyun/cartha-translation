  text: כֹּ֚ל שֶׁ֣רֶץ הָ/ע֔וֹף הַ/הֹלֵ֖ךְ עַל אַרְבַּ֑ע שֶׁ֥קֶץ ה֖וּא לָ/כֶֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/020.yaml
  text: Every swarming winged creature that walks on four feet is detestable to you[a][b][c].
translation:
  language: zh_hans
  text: 凡有翅膀、用四足行走的群生动物[a][b]，对你们来说都是可憎之物[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “有翅膀”或译“会飞的”。这里的希伯来语可泛指飞行生物，并不限于鸟类。
    reason: lexical_alternative
  - marker: b
    text: 原文直译“在四〔足〕上行走”；下文则说明，某些另有适于跳跃之足的昆虫属于例外。
    reason: cultural_note
  - marker: c
    text: “可憎之物”或译“当厌弃的东西”。这里指食物条例中礼仪上的禁忌。
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּל
  choice: 凡……都
  rationale: 以现代汉语的总括结构表达希伯来语的周遍意义，涵盖这一类别中的每一种动物。
- source_word: שֶׁרֶץ
  choice: 群生动物
  rationale: 该词指群集、滋生的一类小动物；“群生动物”比传统的“爬物”更贴近词义，也避免把其活动方式限定为爬行。
- source_word: הָעוֹף
  choice: 有翅膀
  rationale: עוֹף在此范围广于鸟类，也包括昆虫；译作“有翅膀”可避免误解为只指鸟。
- source_word: הַהֹלֵךְ
  choice: 行走
  rationale: 分词表示这类动物惯常的移动方式；“行走”直接对应其基本含义。
- source_word: עַל אַרְבַּע
  choice: 用四足
  rationale: 紧贴希伯来语“在四〔足〕上”的表达；“足”为语境中自然补足的信息。
- source_word: שֶׁקֶץ
  choice: 可憎之物
  rationale: 保留该词在食物条例中所表达的强烈厌弃与禁忌意味，不将它弱化或等同于一般的“不洁”。
- source_word: לָכֶם
  choice: 对你们来说
  rationale: 表达这些动物相对于受律法约束之以色列人的身份，即他们应把这些动物视为可憎。
theological_decisions:
- issue: שֶׁקֶץ在食物条例中的性质
  choice: 可憎之物
  alternative: 不洁之物
  rationale: 原文使用的不是通常译作“不洁”的术语；译文保留其独特而强烈的礼仪禁忌色彩，同时不把它扩展为普遍的道德定罪。
translation_notes:
  register: 采用庄重而清晰的现代标准汉语。“凡……都”自然呈现律例的总括语气；保留“群生动物”“可憎之物”等分类与礼仪用语，同时借脚注说明其范围，避免读者误以为本节只涉及鸟类或是在作一般性的道德判断。
