  text: אַ֣ךְ מַעְיָ֥ן וּ/ב֛וֹר מִקְוֵה מַ֖יִם יִהְיֶ֣ה טָה֑וֹר וְ/נֹגֵ֥עַ בְּ/נִבְלָתָ֖/ם יִטְמָֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/036.yaml
  text: However[a], a spring or a cistern collecting water shall remain clean, but whoever touches their carcass shall be unclean.
translation:
  language: zh_hans
  text: 不过，泉源或蓄水池[a]仍是洁净的；凡触摸这些动物尸体的人，就不洁净。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “蓄水池”所对应的希伯来语短语可直译为“水的汇集处”。它可理解为修饰前面的“泉源或池子”，即汇集的水或水池；也可理解为与前面名词同位的说明。
    reason: 保留 מִקְוֵה מַיִם 的词义及其与前面名词之间可能存在的句法歧义。
lexical_decisions:
- source_word: אַךְ
  choice: 不过
  rationale: 表示对上一节污秽条例的例外和转折；“不过”自然清楚，也避免把它过度理解为严格的限制词“惟独”。
- source_word: מַעְיָן
  choice: 泉源
  rationale: 指天然涌出的水源；“泉源”准确且符合庄重的现代汉语。
- source_word: בּוֹר
  choice: 池子
  rationale: 此处指人工挖掘、用来汇集水的坑池；结合后面的“蓄水”可避免将其误解为天然水井。
- source_word: מִקְוֵה מַיִם
  choice: 蓄水的
  rationale: 原意是水的汇集或汇集之水；译作“蓄水的”能自然修饰“池子”，同时保留水聚集其中的核心意思，其他可能的句法关联在脚注说明。
- source_word: יִהְיֶה טָהוֹר
  choice: 仍是洁净的
  rationale: 字面为“是洁净的”；上下文强调这类水源不因前述尸体掉入而变为不洁净，因此用“仍是”明示语境所含的持续状态。
- source_word: נֹגֵעַ
  choice: 接触……的
  rationale: 该分词作泛指名词使用；这一表达在现代汉语中自然，并保留普遍适用的语气。
- source_word: נִבְלָתָם
  choice: 它们尸体
  rationale: נְבֵלָה指动物的尸体；第三人称阳性复数后缀回指前文所说的动物，而单数名词在此可作集合性表达。
- source_word: יִטְמָא
  choice: 就不洁净
  rationale: 采用利未记礼仪语境中的常用术语；“就”自然表达接触所导致的状态。
theological_decisions:
- issue: 礼仪洁净术语
  choice: 洁净／不洁净
  alternative: 纯洁／污秽
  rationale: 本节讨论礼仪上的洁净状态，不直接表达道德评价；“洁净／不洁净”既是通行的经文用语，也较少引入额外的道德含义。
- issue: 水源是否因动物尸体而不洁净
  choice: 仍是洁净的
  alternative: 是洁净的
  rationale: 希伯来文形式本身是“是洁净的”，但在上一节谈到尸体掉入器皿的背景下，此句构成例外；“仍是”将语境中的延续意义表达出来，而不改变其礼仪判定。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“不过……但……”清楚呈现例外与对比；使用“洁净／不洁净”维持利未记礼仪法规的一贯语域。
