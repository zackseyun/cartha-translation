id: LEV.11.42
reference: Leviticus 11:42
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כֹּל֩ הוֹלֵ֨ךְ עַל גָּח֜ וְ/כֹ֣ל הוֹלֵ֣ךְ עַל אַרְבַּ֗ע עַ֚ד כָּל מַרְבֵּ֣ה רַגְלַ֔יִם לְ/כָל הַ/שֶּׁ֖רֶץ הַ/שֹּׁרֵ֣ץ עַל הָ/אָ֑רֶץ לֹ֥א תֹאכְל֖וּ/ם כִּי שֶׁ֥קֶץ הֵֽם־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/042.yaml
  text: Anything that goes on its belly[a], and anything that goes on four feet, even every creature with many feet, among all the swarming things that swarm on the earth—you shall not eat them[c][b], for they are detestable.
translation:
  language: zh_hans
  text: 地上一切爬动的爬物中，凡用肚腹爬行的[a]、四足行走的，甚至多足的，你们都不可吃；因为它们是可憎之物[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“用肚腹行走的。”
    reason: 保留 הוֹלֵךְ 的较字面译法；正文“爬行”更符合现代汉语，但略带解释性。
  - marker: c
    text: 或译：“因为它们是可憎的。”
    reason: 保留 שֶׁקֶץ 的谓词性译法；正文采用名词性“可憎之物”以反映原文名词并使汉语更自然。
lexical_decisions:
- source_word: כֹּל
  choice: 凡……的／一切
  rationale: 按类别作周遍性表达；汉语用“凡……的”和“一切”自然保留其全面涵盖的作用。
- source_word: הוֹלֵךְ עַל גָּח
  choice: 用肚腹爬行的
  rationale: 直译其以腹部为移动方式的具体形象；“爬行”比生硬的“用肚腹行走”更符合现代汉语。
- source_word: הוֹלֵךְ עַל אַרְבַּע
  choice: 四足行走的
  rationale: 保留原文“四”这一具体分类，同时以“四足”清楚表达其所指。
- source_word: עַד כָּל מַרְבֵּה רַגְלַיִם
  choice: 直到一切多足的
  rationale: 保留 עַד 的延展范围意味，不擅自将其单纯解释为“甚至”；“多足的”简洁表达腿脚众多的生物。
- source_word: לְכָל הַשֶּׁרֶץ הַשֹּׁרֵץ
  choice: 凡属……成群爬动之物
  rationale: 用“凡属”表达分类关系，并以“成群爬动之物”呈现同根名词与分词的重复含义，兼顾可读性。
- source_word: עַל הָאָרֶץ
  choice: 地上
  rationale: 在动物移动语境中，“地上”比“地球上”或抽象的“大地上”更自然，也可对应土地、地面的语义范围。
- source_word: לֹא תֹאכְלֻם
  choice: 你们都不可吃
  rationale: 明确保留复数第二人称和法律禁令的语气；“都”也自然承接前面的各类动物。
- source_word: שֶׁקֶץ
  choice: 可憎的
  rationale: 表达饮食洁净法规中令人厌恶、应当避开的性质，不额外加入后世教义判断。
theological_decisions:
- issue: 圣洁法规中此禁令的性质
  choice: 按经文直接译为饮食禁令，不说明其在后续时代是否继续适用
  alternative: 译成永恒道德禁令，或淡化为单纯文化禁忌
  rationale: 原文在利未记洁净条例中直接颁布禁令；译文应保留其法律力度，但不替经文解决更广泛的正典和教义争论。
- issue: שֶׁקֶץ 的礼仪与情感色彩
  choice: 译作“可憎的”，并以脚注保留“可厌恶之物”的名词性可能
  alternative: 译作“污秽的”或固定为强烈宗教术语“可憎之物”
  rationale: 该词在本段与饮食禁忌有关，但并不等同于一般的“污秽”；“可憎的”既保留强烈排斥色彩，也避免过度阐释。
translation_notes:
  register: 采用现代、庄重而易懂的法规语体。“凡……的”“不可吃”保留经文的分类与禁令结构；避免使用过于古雅的“蠕行”或可能缩窄范围的现代动物学术语。所有脚注标记均置于正文相应位置。
