base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/013.yaml
  text: 'And these from among the birds you shall regard as detestable[a]; they shall not be eaten; they are detestable: the eagle, the vulture[c][b], and the black vulture.'
translation:
  language: zh_hans
  text: “以下这些飞鸟，你们要视为可憎的[a]；不可食用；它们是可憎的：雕、胡兀鹫[b]和黑兀鹫[c]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本段所列的希伯来鸟名，具体指哪一种鸟并不总能确定；“雕”也可能泛指大型猛禽，甚至包括某种兀鹫。
    reason: lexical_alternative
  - marker: b
    text: “胡兀鹫”（又称“食骨鹫”）的鉴定并不确定；也可作较宽泛的“兀鹫”。
    reason: lexical_alternative
  - marker: c
    text: “黑兀鹫”的鉴定并不确定；有些译本译作“鱼鹰”，也有人认为是某种雕或兀鹫。
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּשַׁקְּצוּ
  choice: 要视为可憎之物
  rationale: 该词的加强语态在饮食律例中不只表达厌恶的情感，也表示把某物当作禁忌、可憎之物看待；此译法也与下文“它们是可憎的”相呼应。
- source_word: מִן הָעוֹף
  choice: 在飞鸟中
  rationale: 介词 מִן 在此表示从一类中选出若干种；עוֹף 可泛指有翼飞行动物，本段语境下译作“飞鸟”自然且保留类别意味。
- source_word: לֹא יֵאָכְלוּ
  choice: 不可食用
  rationale: 原文为被动形式的禁令；“不可食用”简洁地保留律法语气和非人称表达。
- source_word: שֶׁקֶץ
  choice: 可憎的／可憎之物
  rationale: 该词在利未记饮食条例中指礼仪和律法意义上应当厌弃、禁戒之物，不宜弱化为单纯“不洁”。
- source_word: הַנֶּשֶׁר
  choice: 雕
  rationale: נֶשֶׁר 通常指大型猛禽，传统上多译为鹰或雕，也可能包括食腐的大型兀鹫；正文采用自然的类别名称“雕”，不作过度具体的物种鉴定。
- source_word: הַפֶּרֶס
  choice: 胡兀鹫
  rationale: פֶּרֶס 常被鉴定为胡兀鹫（亦称髭兀鹫、食骨鹫），但不能完全确定；正文采用较常见的现代中文鸟名，并以脚注注明不确定性。
- source_word: הָעָזְנִיָּה
  choice: 黑兀鹫
  rationale: 该鸟名的准确所指不确定；“黑兀鹫”是可行的现代鉴定之一，正文采用此译名，同时在脚注保留其他可能。
theological_decisions:
- issue: שֶׁקֶץ 的律法含义
  choice: 译作“可憎之物”，保留其礼仪禁忌和强烈否定色彩
  alternative: 译作“不洁之物”
  rationale: “不洁”容易把 שֶׁקֶץ 与 טָמֵא 完全等同；原文用词更强，且本节重复该词，因此不应消解二者可能存在的语义差别。
translation_notes:
  register: 采用现代、庄重而易懂的律法体中文。“不可食用”保持简洁的禁令语气；鸟名尽量使用现代通行名称，但借脚注明确动物学鉴定的不确定性。
