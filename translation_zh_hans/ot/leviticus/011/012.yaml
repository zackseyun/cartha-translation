  text: כֹּ֣ל אֲשֶׁ֥ר אֵֽין ל֛/וֹ סְנַפִּ֥יר וְ/קַשְׂקֶ֖שֶׂת בַּ/מָּ֑יִם שֶׁ֥קֶץ ה֖וּא לָ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/012.yaml
  text: Everything in the water that does not have fins and scales is detestable to you[a].
translation:
  language: zh_hans
  text: 水中凡没有鳍和鳞的，对你们来说都是可憎之物[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“你们所厌恶的”。希伯来语 שֶׁקֶץ 在这里的饮食条例语境中，指礼仪上可憎、令人厌恶之物。
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּל אֲשֶׁר
  choice: 凡……的
  rationale: 这一组合引出涵盖全类的关系结构；“凡……的”在现代汉语中自然，并保留全面概括的语气。
- source_word: אֵין לוֹ
  choice: 没有
  rationale: 希伯来语的否定存在结构在此表达“不具有”，汉语用“没有”简洁自然。
- source_word: סְנַפִּיר וְקַשְׂקֶשֶׂת
  choice: 鳍和鳞
  rationale: 两个单数名词在此作类别特征使用；汉语“鳍和鳞”无需显式复数即可表达泛指。
- source_word: בַּמָּיִם
  choice: 水中
  rationale: מַיִם 虽为复数形式，此处指水域环境；“水中”准确、简练而自然。
- source_word: שֶׁקֶץ
  choice: 可憎之物
  rationale: 该词在饮食条例语境中表示礼仪上令人厌恶、应当摒弃之物。“可憎之物”保留其名词性和强烈评价色彩，又不与 טָמֵא 一类“不洁”术语混同。
- source_word: הוּא
  choice: 都是
  rationale: 独立代词加强名词判断句；结合前面的总括结构，汉语以“都是”自然呈现判断及概括语气。
- source_word: לָכֶם
  choice: 对你们来说
  rationale: 保留该规定直接适用于受话群体的关系意义；“对你们来说”是自然的现代汉语表达。
theological_decisions:
- issue: 饮食条例语境中 שֶׁקֶץ 的礼仪性评价
  choice: 可憎之物
  alternative: 可厌恶的／不洁之物
  rationale: “可憎之物”既传达强烈的厌弃意味，也保留原文的名词判断形式；不用“不洁之物”，以免把 שֶׁקֶץ 与本节未使用的“不洁”专门词汇混为一谈。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“凡……的……都是……”清楚呈现全称类别判断；“鳍和鳞”符合现代汉语对水生动物特征的常用说法。
