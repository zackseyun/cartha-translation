base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/035.yaml
  text: And anything on which any part of their carcass falls shall become unclean[a]. Whether oven or hearth, it must be broken down; they are unclean[b], and they shall be unclean for you.
translation:
  language: zh_hans
  text: 凡有它们的尸体的一部分落在其上的任何物件，都要成为不洁净的[a]。无论是烤炉还是灶台[b]，都必须拆毁；它们是不洁净的，对你们也是不洁净的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “尸体”也可译作“尸骸”。这里的希伯来语在洁净条例中指不洁净动物的尸体。
    reason: lexical_alternative
  - marker: b
    text: “灶台”指烹煮食物的装置；希伯来语所指的具体形制可能类似炉灶、锅架或开放式火灶。
    reason: cultural_note
lexical_decisions:
- source_word: נִבְלָתָם
  choice: 它们尸体的一部分
  rationale: נְבֵלָה在洁净条例中指死去动物的尸体；介词מִן在“从其尸体掉下”的语境中自然表示尸体的一部分，但用脚注保留“尸骸／尸体”层面的表达可能性。
- source_word: יִפֹּל
  choice: 掉在
  rationale: 未完成式在法律条文中表达一般情形；“掉在”符合现代汉语的常规陈述。
- source_word: עָלָיו יִטְמָא
  choice: 掉在上面的东西，都要变为不洁净
  rationale: 明确保留承受尸体接触之物因而进入不洁净状态的结果，同时不把礼仪性含义扩写进正文。
- source_word: תַּנּוּר
  choice: 烤炉
  rationale: 该词指烘烤食物的炉；“烤炉”比泛称“炉子”更清楚地表达其用途。
- source_word: כִירַיִם
  choice: 灶台
  rationale: 该词指供烹煮使用的装置，具体形制不完全确定；“灶台”自然易懂，又避免把古代结构过度具体化。
- source_word: יֻתָּץ
  choice: 必须拆毁
  rationale: 被动式在律法语境中表达必须执行的拆除；“拆毁”适合固定或泥陶制的烹饪设施。
- source_word: טְמֵאִים הֵם
  choice: 它们是不洁净的
  rationale: 保留利未记洁净条例中的核心术语“不洁净”，不误解为道德上的邪恶。
- source_word: וּטְמֵאִים יִהְיוּ לָכֶם
  choice: 对你们也要算为不洁净
  rationale: “对你们”保留לָכֶם与以色列受众的关系；“算为”自然表达这些器物须被他们视作不洁净。
theological_decisions:
- issue: 利未记条例中“不洁净”的性质
  choice: 正文译为“不洁净”
  alternative: “礼仪上不洁净”或“礼仪性污秽”
  rationale: 此处谈的是礼仪状态而非道德邪恶；正文保留稳定的圣经关键词“不洁净”，避免解释性扩写，同时让上下文界定其含义。
translation_notes:
  register: 采用现代、庄重而易懂的法律条文语体。“凡……都……”呈现普遍适用的条例；“必须”表达律法义务。“烤炉”和“灶台”区分两类烹饪设施，同时以脚注说明后者形制的不确定性。
