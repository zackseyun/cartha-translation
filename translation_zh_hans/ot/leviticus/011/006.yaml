id: LEV.11.6
reference: Leviticus 11:6
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/אֶת הָ/אַרְנֶ֗בֶת כִּֽי מַעֲלַ֤ת גֵּרָה֙ הִ֔וא וּ/פַרְסָ֖ה לֹ֣א הִפְרִ֑יסָה טְמֵאָ֥ה הִ֖וא לָ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/006.yaml
  text: And the hare[a], because it chews the cud but does not divide the hoof, is unclean for you.
translation:
  language: zh_hans
  text: 兔[a]，因为它反刍，却不分蹄，对你们来说是不洁净的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 传统上译作“野兔”；这个希伯来词也可能泛指兔类。
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאַרְנֶבֶת
  choice: 兔
  rationale: 该希伯来词传统上指野兔，但确切物种范围并不完全确定；正文用现代汉语自然的统称“兔”，脚注说明传统译法。
- source_word: כִּי
  choice: 因为
  rationale: 此处引出该动物被列为不洁净的理由，译作“因为”清楚表达因果关系。
- source_word: מַעֲלַת גֵּרָה
  choice: 反刍
  rationale: 原文意为使食物回上来，即反刍；“反刍”是现代汉语简洁、通行的表达。
- source_word: וּפַרְסָה לֹא הִפְרִיסָה
  choice: 却不分蹄
  rationale: 保留蹄没有分开的判定标准，并以“却”自然表达与前项相对的关系。
- source_word: טְמֵאָה הִוא לָכֶם
  choice: 对你们来说是不洁净的
  rationale: 保留“不洁净”这一利未记饮食条例中的礼仪性分类，也明确表达לָכֶם所指的立约群体。
theological_decisions:
- issue: 利未记饮食条例中“不洁净”的性质
  choice: 保留礼仪分类用语“不洁净”
  alternative: 译成“污秽”或理解为道德上的邪恶
  rationale: 本节是在规定以色列人的饮食分类，并非断言这种动物在道德上邪恶；正文不额外解释，但以传统且宽容的“不洁净”保留其礼仪语境。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“反刍”“分蹄”“不洁净”既贴近原文，又与本章动物分类的术语保持一致。
