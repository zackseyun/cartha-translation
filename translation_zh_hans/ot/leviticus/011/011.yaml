  text: וְ/שֶׁ֖קֶץ יִהְי֣וּ לָ/כֶ֑ם מִ/בְּשָׂרָ/ם֙ לֹ֣א תֹאכֵ֔לוּ וְ/אֶת נִבְלָתָ֖/ם תְּשַׁקֵּֽצוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/011.yaml
  text: And they shall be detestable to you; you shall not eat any of their flesh[a], and you shall regard their carcasses as detestable.
translation:
  language: zh_hans
  text: 它们对你们要算为可憎之物[a]；不可吃它们的肉，也要视它们的尸体为可憎。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“可厌恶之物”；希伯来语在这里指在饮食条例中礼仪上可憎、应视为可憎的事物。
    reason: lexical_alternative
lexical_decisions:
- source_word: שֶׁקֶץ
  choice: 可憎的
  rationale: 该词在本段饮食条例中指礼仪上令人厌恶、必须摒弃之物。“可憎的”既保留强烈的负面评价，又避免用“污秽”混同于希伯来文其他表示不洁的专门词语。
- source_word: יִהְיוּ לָכֶם
  choice: 对你们来说是
  rationale: 保留原文介词所表达的关系，说明以色列人应当如何看待这些水中生物，同时符合现代汉语表达。
- source_word: מִבְּשָׂרָם
  choice: 它们的肉
  rationale: 否定的“吃”与介词 מִן 连用，具有部分义，即不可吃其肉中的任何一部分；汉语禁令“不可吃它们的肉”已自然包含这一全面禁止。
- source_word: לֹא תֹאכֵלוּ
  choice: 你们不可吃
  rationale: “不可”准确传达法律条文中否定未完成式的禁令效力，庄重而自然。
- source_word: נִבְלָתָם
  choice: 它们的尸体
  rationale: נְבֵלָה 指动物死后的躯体；“尸体”在现代汉语中清楚准确，也不额外限定其死亡方式。
- source_word: תְּשַׁקֵּצוּ
  choice: 要视……为可憎
  rationale: 该动词与 שֶׁקֶץ 同源，不只表示情绪上的厌恶，也要求作出礼仪上的负面认定；“视……为可憎”保留这一评价和归类意味，并与前句形成词根呼应。
theological_decisions:
- issue: 饮食律例中厌恶用语的性质
  choice: 采用“可憎”表达礼仪和盟约处境中的强烈排斥
  alternative: 译作“可恶”“可厌”或“不洁”
  rationale: 本节规定以色列人在饮食条例下应如何看待这些生物。“可憎”保留原文强度，却不把该词擅自扩展为普遍的道德定罪；“不洁”则会混同本章其他专门的不洁术语。
translation_notes:
  register: 采用现代、庄重而易懂的法律条文语体。“也”承接原文第二个连接词；以分号保留三项紧密相连的规定。脚注标记置于其实际解释的“可憎的”之后。
