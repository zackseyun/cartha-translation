  text: אֶת זֶה֙ תֹּֽאכְל֔וּ מִ/כֹּ֖ל אֲשֶׁ֣ר בַּ/מָּ֑יִם כֹּ֣ל אֲשֶׁר ל/וֹ֩ סְנַפִּ֨יר וְ/קַשְׂקֶ֜שֶׂת בַּ/מַּ֗יִם בַּ/יַּמִּ֛ים וּ/בַ/נְּחָלִ֖ים אֹתָ֥/ם תֹּאכֵֽלוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/009.yaml
  text: 'These you may eat from all that are in the waters: whatever in the waters[a], in the seas and in the streams, has fins and scales—these you may eat.'
translation:
  language: zh_hans
  text: 水中之物，你们可以吃这些：凡在水中、在海里或在河流[a]里有鳍有鳞的，都可以吃。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “河流”所译的希伯来语也可指溪流、河道或旱谷中的季节性水道。
    reason: 保留נְחָלִים在不同语境下可能涵盖的地貌与水道类型。
lexical_decisions:
- source_word: אֶת זֶה תֹּאכְלוּ
  choice: 你们都可以吃
  rationale: 希伯来语以指示语引出准许食用的类别；汉语将准许语放在句末，与末尾重复的“你们可以吃”合并表达，既自然又保留法规语气。
- source_word: מִכֹּל אֲשֶׁר בַּמָּיִם
  choice: 水中各种动物
  rationale: מִן带有“从……之中”的分类意义；“水中各种动物”以现代汉语清楚引出水生物的范围。原文未明说“动物”，但上下文所指明确，补出后更符合汉语表达。
- source_word: סְנַפִּיר וְקַשְׂקֶשֶׂת
  choice: 有鳍有鳞
  rationale: 两个单数名词在此作类别特征，汉语惯用“有鳍有鳞”概括，不必机械标示单复数。
- source_word: בַּיַּמִּים
  choice: 在海里
  rationale: יָם的复数在此泛指各海域；“海里”自然、准确。
- source_word: וּבַנְּחָלִים
  choice: 在河流里
  rationale: נְחָלִים可指溪流、河道或季节性水道；在水生动物分类语境中，“河流”是清楚而宽泛的正文选择，同时以脚注保留词义范围。
- source_word: אֹתָם תֹּאכֵלוּ
  choice: 你们都可以吃
  rationale: 末句重新强调这些水生动物可供食用；“可以”体现饮食法规中的许可含义，“都”回指凡符合条件者。
theological_decisions: []
