base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/025.yaml
  text: And everyone who carries any of their carcasses shall wash his clothes and be unclean until the evening[a].
translation:
  language: zh_hans
  text: 凡搬动它们任何一具尸体的人，都要洗衣服，就必不洁净到晚上。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“凡搬起它们尸体中任何一具的。”希伯来文的介词结构可作较字面的表达；正文以自然汉语表达其分配性的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כָל הַ/נֹּשֵׂא
  choice: 凡搬动……的
  rationale: וְ承接上文；כָּל与分词连用，表示普遍适用的个人。נָשָׂא在此指拿起、搬运动物尸体；“搬动”比单纯“拿”更自然，也保留实际接触并移动的含义。
- source_word: מִ/נִּבְלָתָ/ם
  choice: 它们尸体
  rationale: נְבֵלָה在利未记洁净条例中指动物的尸体。介词מִן的结构可较形式地理解为“它们尸体中的一部分”或“从它们的尸体”；正文按汉语习惯概括为“它们尸体”，不把对象误解为人的遗体。
- source_word: יְכַבֵּס בְּגָדָי/ו
  choice: 都要洗净衣服
  rationale: 未完成式在法条中表达义务。“要”保留规定性语气；כִּבֵּס指洗涤，译作“洗净”符合洁净条例语境。希伯来文为代表性阳性单数，汉语“凡……的，都……”自然涵盖每一个适用者，无须添加性别代词。
- source_word: וְ/טָמֵא
  choice: 并且不洁净
  rationale: טָמֵא表示礼仪上的不洁净，而非道德邪恶。“不洁净”延续利未记术语，并保留状态含义。
- source_word: עַד הָ/עָרֶב
  choice: 到晚上
  rationale: 该短语界定不洁净状态持续的时限；“到晚上”是现代汉语中自然、准确的表达。
theological_decisions:
- issue: 不洁净的性质
  choice: 译作“不洁净”，视为礼仪状态
  alternative: 译作“污秽”或理解为道德罪恶
  rationale: 本节处于动物尸体所致不洁净的条例中，טָמֵא描述礼仪身份和期限，并不等同于道德败坏。
- issue: 代表性阳性单数的表达
  choice: 用“凡……的，都……”表达普遍适用的个人
  alternative: 明确译作“他……他的衣服”
  rationale: 希伯来文用阳性单数作通则表述；现代汉语以无性别的关系结构既保留逐人适用的范围，也不额外强化原文没有特别强调的男性身份。
translation_notes:
  register: 采用现代、庄重而易懂的法条语体。“尸体”明确指上文所说动物的遗骸；“不洁净”作为利未记礼仪条例的固定术语。脚注标记已在正文中出现。
