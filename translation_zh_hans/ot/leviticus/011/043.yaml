base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/043.yaml
  text: Do not make yourselves detestable by any swarming thing that swarms[a], and do not make yourselves unclean by them, so that you do not become unclean by them.
translation:
  language: zh_hans
  text: 你们不可因任何群聚活动的小动物[a]而使自己成为可憎的；也不可因它们使自己不洁，以免因它们染上不洁。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“任何爬行的小动物”。希伯来语所指是一类成群活动或大量涌现的小动物，范围不一定限于爬行之物。
    reason: 词义备选
lexical_decisions:
- source_word: תְּשַׁקְּצוּ אֶת נַפְשֹׁתֵיכֶם
  choice: 使自己成为可憎的
  rationale: שׁקץ 表示成为或视为可憎；נפש 在此反身结构中指整个人，故译为“自己”，而非较狭义的“灵魂”。此译也避免与下文 טמא 的“不洁”混同。
- source_word: בְּכָל הַשֶּׁרֶץ הַשֹּׁרֵץ
  choice: 因任何群聚滋生的小动物
  rationale: שׁרץ 兼有成群活动、繁生之意，名词与分词连用形成同根复沓。“群聚滋生的小动物”保留其广泛类别，不把所指限于只在地上爬行的动物；介词 בְּ 译作“因”，表达这些动物是导致该状态的媒介。
- source_word: תִטַּמְּאוּ
  choice: 使自己不洁
  rationale: 该反身动词表示使自身进入不洁状态；“不洁”保留利未记礼仪与圣洁条例中的核心术语。
- source_word: וְנִטְמֵתֶם בָּם
  choice: 以免因它们染上不洁
  rationale: 在连续禁令之后，此分句自然表达所警戒的结果。“以免”保留结果或警戒关系，“染上不洁”与前句“使自己不洁”略作区分，同时保留 בָּם 的媒介含义。
theological_decisions:
- issue: 圣洁条例中 טמא 的礼仪不洁含义
  choice: 不洁
  alternative: 玷污
  rationale: “不洁”既是现代中文可懂的固定表达，也能涵盖本段的礼仪分类，不擅自把经文强化为道德罪责；“玷污”虽可行，却较容易带入强烈的道德意味。
- issue: וְנִטְמֵתֶם 与前述禁令的逻辑关系
  choice: 以免因它们染上不洁
  alternative: 并因它们成为不洁
  rationale: 希伯来语连接词本身容许并列或结果性的理解；在禁令语境中，“以免”自然呈现警戒后果，但不把不洁解释为超出经文所说的刑罚或罪责。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“群聚滋生的小动物”略带法规分类语气，适合利未记语境，并尽量保留希伯来语 שׁרץ 的词根复沓和宽泛类别。脚注标记已置于正文相应词组之后。
