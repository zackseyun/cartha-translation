  text: כִּ֣י אֲנִ֣י יְהוָה֮ אֱלֹֽהֵי/כֶם֒ וְ/הִתְקַדִּשְׁתֶּם֙ וִ/הְיִיתֶ֣ם קְדֹשִׁ֔ים כִּ֥י קָד֖וֹשׁ אָ֑נִי וְ/לֹ֤א תְטַמְּאוּ֙ אֶת נַפְשֹׁ֣תֵי/כֶ֔ם בְּ/כָל הַ/שֶּׁ֖רֶץ הָ/רֹמֵ֥שׂ עַל הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/044.yaml
  text: For I am Yahweh your God[a]. Consecrate yourselves therefore, and be holy, for I am holy[b]. And you shall not defile yourselves with any swarming thing that moves on the earth.
translation:
  language: zh_hans
  text: 因为我是耶和华——你们的上帝。你们要分别为圣，成为圣洁，因为我是圣洁的。你们不可因地上任何活动的群生物而玷污自己。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “玷污自己”也可译作“使自己不洁”。
    reason: 保留טמא在礼仪洁净语境中的直接译法。
  - marker: b
    text: “群生物”也可译作“爬行之物”。
    reason: 保留שרץ的常见传统译法；“活动的”对应原文对其在地上移动的描述。
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代汉语中广为人知的专名“耶和华”呈现四字神名，而不以“主”这一称号代替。
- source_word: אֱלֹהֵיכֶם
  choice: 你们的上帝
  rationale: 在以耶和华为主语的盟约表达中，此词指单数的“上帝”；“你们的上帝”自然准确。
- source_word: וְהִתְקַדִּשְׁתֶּם
  choice: 你们要使自己分别为圣
  rationale: 该动词为反身形式，表示人使自己归于圣、分别出来；这一译法兼顾反身意义及礼仪与伦理内涵。
- source_word: וִהְיִיתֶם קְדֹשִׁים
  choice: 成为圣洁
  rationale: 表达分别为圣所要求或带来的状态，并与下句上帝的圣洁形成清楚呼应。
- source_word: קָדוֹשׁ
  choice: 圣洁的
  rationale: 保留本节关键的圣洁用语及上帝与百姓之间的神学关联，不缩减为单纯的“分别出来”。
- source_word: תְטַמְּאוּ אֶת נַפְשֹׁתֵיכֶם
  choice: 玷污自己
  rationale: 动词表达使之不洁；נפש在此指人自身，而非专门论述灵魂，故采用自然的反身表达。
- source_word: שֶּׁרֶץ
  choice: 成群活动的小生物
  rationale: 该词在利未记11章指成群滋生、活动的较小生物；此译比笼统的“爬物”更能反映词义范围。
- source_word: הָרֹמֵשׂ עַל הָאָרֶץ
  choice: 在地上……活动的
  rationale: רמשׂ描述在地面活动，并不必然限定为爬行；“活动”避免过度具体化其运动方式。
theological_decisions:
- issue: 上帝的圣洁与百姓圣洁之间的关联
  choice: 两处均保留“圣洁”这一核心词根联系
  alternative: 将百姓或上帝的一处译为“分别出来”
  rationale: 原文重复קדש词族，以耶和华自身的圣洁作为百姓应当圣洁的根据；统一用语保留这一神学关联。
- issue: נַפְשֹׁתֵיכֶם所表达的人观
  choice: 译为“自己”
  alternative: 译为“你们的灵魂”或“你们的性命”
  rationale: 此处所说的是人因禁食之物而成为不洁，并非在界定身体与灵魂的关系；“自己”保留整体人格含义而不引入额外教义。
- issue: 禁令的礼仪与伦理色彩
  choice: 译为“玷污自己”，并以脚注说明“不洁”译法
  alternative: 正文译为“使自己不洁”
  rationale: “玷污”在现代汉语中较自然，也能传达污染含义；脚注保留本章礼仪洁净语境中的直接表达。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。以“分别为圣／圣洁”保留原文קדש词族的重复联系；避免“灵魂”等可能造成二元人观误读的表达。
