  source_fidelity: “成群活动的小生物”大致传达了שׁרץ的群集/滋生概念，但“小”并非原文明确限定，且该短语把“成群”活动和“在地上活动”（הָרֹמֵשׂ עַל־הָאָרֶץ）合并后略显笨重。反身命令“使自己分别为圣”可理解，但“分别为圣”本身已足以表达其反身的自我归圣意义。
  naturalness: 正文整体庄重通顺；改为“你们要分别为圣”更简洁自然。将词义说明分别锚定在相关词语之后，较在句末以一个合并脚注呈现更清楚。
  terminology: 保留“耶和华”“上帝”“圣洁”和“玷污自己”。以“群生物”对应שׁרץ，避免添加“小”的限定；以“在地上活动的”对应רמש，避免将其限定为仅“爬行”。
  issues:
