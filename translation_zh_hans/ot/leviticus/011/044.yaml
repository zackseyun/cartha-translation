    issue: “成群活动的小生物”添加了“小”的限定，且表达略显累赘。
    rationale: שׁרץ指群集、滋生或成群活动之物；虽然在本章常涉及小型生物，原词本身并未在此处明说“小”。“群生物”可较紧凑地保留该类别概念。
  - severity: low
    issue: 单一脚注置于全句末，同时涵盖“玷污自己”和生物类别，锚定不够明确。
    rationale: 将两个词汇替代译法分别置于“玷污自己”和“群生物”之后，可使读者明确各注所指，且不改变经文意义。
