  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: אַ֤ךְ אֶת זֶה֙ לֹ֣א תֹֽאכְל֔וּ מִֽ/מַּעֲלֵי֙ הַ/גֵּרָ֔ה וּ/מִ/מַּפְרִיסֵ֖י הַ/פַּרְסָ֑ה אֶֽת הַ֠/גָּמָל כִּֽי מַעֲלֵ֨ה גֵרָ֜ה ה֗וּא וּ/פַרְסָה֙ אֵינֶ֣/נּוּ מַפְרִ֔יס טָמֵ֥א ה֖וּא לָ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/004.yaml
  text: 'Nevertheless[a], you shall not eat these from among those that chew the cud or from among those that divide the hoof: the camel, because it chews the cud but does not divide the hoof[b]; it is unclean to you.'
translation:
  language: zh_hans
  text: 但在反刍或分蹄的动物中，以下这些你们不可吃：骆驼虽然反刍，却不分蹄[a]；它对你们是不洁净的[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “分蹄”也可译作“蹄裂开”。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“对你们是不洁净的”，指按照赐给以色列的饮食条例，这动物被列为不洁净。
    reason: cultural_note
lexical_decisions:
- source_word: אַךְ
  choice: 但
  rationale: 该词在此限制上一节所述的一般准则，引出例外；“但”简洁自然地保留转折和限制作用。
- source_word: מִמַּעֲלֵי הַגֵּרָה
  choice: 在反刍……的动物中
  rationale: 希伯来语字面指“使食团上来”；现代汉语以“反刍”准确、简明地表达这一动物分类特征。
- source_word: וּמִמַּפְרִיסֵי הַפַּרְסָה
  choice: 或分蹄的动物中
  rationale: 短语指蹄部裂分这一分类特征。连接词本义常为“和”，但此处随后列举只具备两项特征之一的动物，译作“或”能清楚表达是从任一类中提出不可吃的例外。
- source_word: הַגָּמָל
  choice: 骆驼
  rationale: 该动物名称的直接、通行对应词。
- source_word: כִּי מַעֲלֵה גֵרָה הוּא
  choice: 虽然反刍
  rationale: 原文以 כִּי 说明骆驼具备第一项特征；结合下句的否定对比，汉语用“虽然……却……”自然地呈现论述关系。
- source_word: וּפַרְסָה אֵינֶנּוּ מַפְרִיס
  choice: 却不分蹄
  rationale: 准确表达骆驼不符合第二项标准，并与前面的“虽然”构成清楚对比。
- source_word: טָמֵא הוּא לָכֶם
  choice: 它对你们是不洁净的
  rationale: “不洁净”保留利未记纯洁条例中的核心分类用语；“对你们”对应 לָכֶם，保留该规定针对受命群体的法律视角，而不在正文中将其窄化为“礼仪上的”。
theological_decisions:
- issue: 利未记饮食条例中“不洁净”的性质
  choice: 不洁净
  alternative: 礼仪上不洁净／仪式上不洁净
  rationale: 原文 טָמֵא 是本段核心法律和纯洁分类术语。正文采用“不洁净”，既保留其经文用语和神学张力，也避免加入原文未明说的限定；脚注简要交代其在以色列饮食条例中的语境。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“反刍”“分蹄”“不洁净”作为本段反复出现的分类术语，保持简洁一致；用“虽然……却……”使希伯来语中的理由与对比在汉语中清楚自然。
