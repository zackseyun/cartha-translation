base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/023.yaml
  text: But every winged swarming thing that has four feet is detestable to you[a][b].
translation:
  language: zh_hans
  text: 但凡有翅膀、长着四只脚的群生小生物，对你们都是可憎之物[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “有翅膀……的群生小生物”也可译作“会飞的爬物”；这个希伯来语词组泛指成群活动的飞行小生物，尤指昆虫。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译为“有四只脚”；这里的“四只脚”也可表达为“四条腿”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כֹל
  choice: 但凡
  rationale: וְ在上节所列例外之后带出对照，译作“但”；כֹל具概括、逐类涵盖之意，以“凡”自然表达。
- source_word: שֶׁרֶץ הָעֹוף
  choice: 有翅膀……的群生小物
  rationale: שֶׁרֶץ指成群活动、滋生繁多的小型生物，הָעֹוף限定为飞行或有翅膀的一类。此处避免简单译成“鸟”或仅译“昆虫”，以保留希伯来语分类的宽泛性。
- source_word: אֲשֶׁר לוֹ אַרְבַּע רַגְלָיִם
  choice: 用四足爬行的
  rationale: 直译为“有四只脚”。结合上文11:20-21，这一表达描述其以四足行走；“用四足爬行”在现代汉语中较自然，同时脚注保留字面形式。
- source_word: שֶׁקֶץ
  choice: 可憎的
  rationale: 该词在饮食条例中表示应当厌弃、不可食用之物。“可憎”保持法律与礼仪语境中的强烈评价，又不直接改译为“污秽”。
- source_word: הוּא לָכֶם
  choice: 对你们都是
  rationale: 希伯来文为无系词句，直意是“它对你们是可憎之物”；“对你们”保留律法所针对的群体，配合כֹל译作“都是”。
theological_decisions:
- issue: שֶׁקֶץ是否等同于礼仪上的“不洁”
  choice: 译为“可憎的”
  alternative: 译为“污秽的”或“不洁净的”
  rationale: 本节使用的是שֶׁקֶץ，而不是通常表示礼仪不洁的טָמֵא。译文保留两者的词义区别，不把“可憎”与“不洁”完全等同。
translation_notes:
  register: 采用现代、庄重且易懂的律法文体。“群生小物”用于保留שֶׁרֶץ的生物类别含义；“但凡……都是”承接上节例外之后的转折与总括。所有脚注标记均已置入正文。
