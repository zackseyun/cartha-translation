base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/007.yaml
  text: And the pig[a], because it has a divided hoof and splits the hoof, but does not chew the cud[b], is unclean to you.
translation:
  language: zh_hans
  text: 猪[a]虽蹄分瓣、蹄裂开，却不反刍[b]；对你们是不洁净的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“豕”。
    reason: lexical_alternative
  - marker: b
    text: 直译“不使反刍物上来”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחֲזִיר
  choice: 猪
  rationale: 采用现代汉语最通行的动物名称，指这一动物种类，不另加古雅或贬义色彩。
- source_word: כִּי
  choice: 虽然
  rationale: 此处在整句论证中先承认猪具备分蹄特征，随后以“不反刍”构成转折；汉语用“虽然……却……”自然呈现希伯来语由 כִּי 引出、并由后续 וְהוּא…לֹא 形成的让步性语境。
- source_word: מַפְרִיס פַּרְסָה
  choice: 蹄分两瓣
  rationale: 表达蹄已经分开的状态，采用普通读者容易理解的现代汉语。
- source_word: וְשֹׁסַע שֶׁסַע פַּרְסָה
  choice: 是分蹄的
  rationale: 保留原文对分蹄特征的第二重描述和强调，不将两个近义短语完全合并。
- source_word: גֵּרָה לֹא יִגָּר
  choice: 不反刍
  rationale: “反刍”是现代汉语准确而简洁的常用动物学表达；脚注保留其字面意象。
- source_word: טָמֵא הוּא לָכֶם
  choice: 对你们来说，它是不洁净的
  rationale: “不洁净”保留利未记礼仪及饮食分类的语义，并以“对你们来说”明确 לָכֶם 所指的盟约群体关系，避免解释成一般卫生或道德判断。
theological_decisions:
- issue: 饮食律例中 טָמֵא 的性质
  choice: 不洁净（礼仪及饮食分类意义）
  alternative: 污秽／不纯洁
  rationale: 本章是在划分以色列人可吃与不可吃的动物；“不洁净”既沿用清楚的圣经用语，也不把该词误解为动物本身具有道德邪恶。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。以“虽然……却……”顺应汉语逻辑，保留原文对分蹄的重复强调；用“不洁净”维持利未记的礼仪语域。
