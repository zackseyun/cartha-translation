base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/029.yaml
  text: 'And these are unclean for you among the swarming things that swarm on the earth: the mole-rat[a], and the mouse, and the great lizard according to its kind.'
translation:
  language: zh_hans
  text: 在地上群集活动的生物中，以下这些对你们是不洁净的：鼹形鼠[a]、老鼠和各类大蜥蜴。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “鼹形鼠”和“大蜥蜴”所对应的希伯来语动物名称，确切所指都不能确定；传统译法也将前者译为“鼬”或“鼹鼠”，将后者译为“陆龟”或笼统译为“蜥蜴”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזֶה
  choice: 以下这些
  rationale: זֶה在形态上是单数，但用于引出后面的动物清单；现代汉语用复数性的“以下这些”更自然，也保留其指示和列举功能。
- source_word: לָכֶם
  choice: 对你们
  rationale: 这里的ל表示与以色列人的关系或适用范围；“对你们”清楚表达这些动物就他们而言属于不洁净。
- source_word: הַטָּמֵא
  choice: 不洁净的
  rationale: 在利未记礼仪洁净条例中，“不洁净”是准确、通行且易懂的用语，并不把这里误解为一般卫生意义上的肮脏。
- source_word: בַּשֶּׁרֶץ הַשֹּׁרֵץ
  choice: 在……群集的群生小动物中
  rationale: 用“群生／群集”体现名词שֶׁרֶץ与同根分词שֹּׁרֵץ的重复，同时以“小动物”自然表达此处所指的陆生小型动物。
- source_word: עַל הָאָרֶץ
  choice: 在地上
  rationale: 此处指这些动物活动的陆地或地面领域；“在地上”比“在大地上”更符合现代汉语语境。
- source_word: הַחֹלֶד
  choice: 鼹形鼠
  rationale: 具体动物身份不能确定；“鼹形鼠”对应一种合理的现代辨认，同时用脚注保留“鼬”或“鼹鼠”等传统译法。
- source_word: הָעַכְבָּר
  choice: 老鼠
  rationale: עַכְבָּר通常指鼠类；“老鼠”是现代普通读者最自然易懂的统称。
- source_word: הַצָּב לְמִינֵהוּ
  choice: 各类大蜥蜴
  rationale: צָב的具体物种不确定，可能是一种较大的蜥蜴；לְמִינֵהוּ直接修饰它，译作“各类”简洁表达“按其种类”的分类含义。
theological_decisions:
- issue: “不洁净”的性质
  choice: 沿用礼仪法规用语“不洁净”，不增添道德或卫生解释
  alternative: 译作“污秽”或解释为有害、不道德
  rationale: 原文只规定这些动物相对于盟约群体的洁净类别，并未在本节说明其道德或卫生原因。
translation_notes:
  register: 采用现代、庄重而易懂的法规语体。“群生／群集”有意保留希伯来语同根词的重复；句末把“按其种类”自然压缩为“各类”，其修饰范围限于“大蜥蜴”。
