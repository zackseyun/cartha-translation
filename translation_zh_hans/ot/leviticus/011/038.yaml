review_pass:
  verdict: revise
  source_fidelity: 译文正确呈现条件句、种子受水和随后不洁净的礼仪判定。但“它们的尸体若有一部分[a]掉在种子上”语序不够自然，且“若有一部分”容易暂时被读作数量条件，而非落下之物。נְבֵלָה在此应明确为动物尸体；מִן可按部分义理解，也有“它们中任何一具的尸体”一类分析可能，宜以清楚正文和完整脚注保留。
  naturalness: “有水浇在”可懂，但“有水洒在”更符合水被施于种子的自然现代汉语。“落在上面”避免重复“种子上”，且回指清楚。
  terminology: “不洁净”恰当地保留利未记的礼仪洁净术语，不应改作带有道德意味的“污秽”。“尸体”在上下文已由所指动物限定；脚注补明“动物尸体（尸骸）”的词义。
  issues:
