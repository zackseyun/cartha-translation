    issue: 尸体部分的句法表达不自然
    rationale: “它们的尸体若有一部分掉在种子上”在现代汉语中插入“若有一部分”不顺，也不够直接地表达“尸体的任何一部分落下”的部分关系。
  - severity: low
    issue: 脚注的备选译法不完整
    rationale: “它们中若有任何一具尸体”未重述“落在种子上”的句法关系，且“它们中”容易显得指代不明；应说明另一分析是“它们中任何一具的尸体”。
  revised_text: 但若有水洒在种子上，而它们尸体的任何一部分落在上面，这种子对你们就不洁净。
