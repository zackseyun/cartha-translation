  text: וְ/כִ֤י יֻתַּן מַ֨יִם֙ עַל זֶ֔רַע וְ/נָפַ֥ל מִ/נִּבְלָתָ֖/ם עָלָ֑י/ו טָמֵ֥א ה֖וּא לָ/כֶֽם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/038.yaml
  text: But if water is put on the seed[a], and any of their carcasses falls on it, it is unclean to you.
translation:
  language: zh_hans
  text: 但若有水洒在种子上，而它们尸体的任何一部分落在上面，这种子对你们就不洁净。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְכִי
  choice: 但若
  rationale: 承接上一节关于干种子的规定，并引出与之相对的条件情形；“但若”兼顾连接和对比意味。
- source_word: יֻתַּן מַיִם עַל זֶרַע
  choice: 有水浇在种子上
  rationale: 保留נתן使役被动式“被放、被施加”的含义；汉语用“有水浇在……上”自然表达水被施于种子的情形，不将其过度解释为仅仅“受潮”。
- source_word: מִנִּבְלָתָם
  choice: 它们的尸体若有一部分[a]
  rationale: נְבֵלָה指动物的尸体；介词מִן在此可作部分义，理解为尸体的一部分。原文也可能指它们中任何一具尸体，故以脚注保留该歧义。
- source_word: עָלָיו
  choice: 掉在种子上
  rationale: 代词回指阳性单数集合名词זֶרַע。汉语重复“种子”比用“它”更清楚。
- source_word: טָמֵא הוּא לָכֶם
  choice: 这种子对你们就是不洁净的
  rationale: 明确主语仍是种子，并保留利未记礼仪条例中的“不洁净”这一身份类别，以及לָכֶם“对你们”的群体视角。
theological_decisions:
- issue: 不洁净的性质
  choice: 礼仪上的“不洁净”
  alternative: 污秽、被玷污
  rationale: 本节规定的是利未律法中的洁净身份，并不直接断定道德罪责；“不洁净”能较准确地区分这一礼仪范畴。
- issue: מִנִּבְלָתָם中部分关系的理解
  choice: 尸体的一部分
  alternative: 它们中任何一具尸体
  rationale: מִן可表达部分关系，而 נְבֵלָה带复数所属后缀；两种分析均有可能，因此正文采用在同类律例中较自然的“尸体的一部分”，脚注保留另一理解。
translation_notes:
  register: 采用现代、庄重而清楚的律例语体。“浇在种子上”保留具体动作，“这种子”明确不洁净状态所归属的对象；避免把礼仪上的不洁净说成道德上的污秽。
