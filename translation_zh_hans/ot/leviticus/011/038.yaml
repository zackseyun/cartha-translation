revisions:
- from: 但若有水浇在种子上，而它们的尸体若有一部分[a]掉在种子上，这种子对你们就是不洁净的。
  to: 但若有水洒在种子上，而它们尸体的任何一部分落在上面，这种子对你们就不洁净。
  rationale: 将水的施加改为更自然的“洒在”，并重组尸体部分的条件语序，使正文清晰表达“任何一部分落在种子上”。脚注保留原文中可争议的部分义／个体义分析，且完整说明动物尸体的词义，不将该礼仪条例作神学性扩展。
