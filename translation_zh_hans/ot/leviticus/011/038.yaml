    text: 或译：“它们中任何一具的尸体”。原文“尸体”（נְבֵלָה）指动物的尸体（尸骸）；此处介词可理解为指尸体的任何一部分，也可理解为指它们中任何一具的尸体。
    reason: 保留מִן在此可能的部分义及其与复数所属后缀结合时的另一句法分析。
  revision_rationale: 将水的施加改为更自然的“洒在”，并重组尸体部分的条件语序，使正文清晰表达“任何一部分落在种子上”。脚注保留原文中可争议的部分义／个体义分析，且完整说明动物尸体的词义，不将该礼仪条例作神学性扩展。
