lexical_decisions:
- source_word: אֵת
  choice: 不单独译出
  rationale: 这是直接宾语标记，在中文中通常无需对应词；其句法作用由本节清单的结构体现。
- source_word: כָּל
  choice: 各种
  rationale: כָּל修饰单数集合名词，并与后面的分类套语连用；译作“各种”既表达涵盖无遗，也符合现代汉语列举动物类别的习惯。
- source_word: עֹרֵב
  choice: 渡鸦
  rationale: 该词通常指渡鸦，也可能较宽泛地涵盖鸦科鸟类。“渡鸦”保留其标准词义，同时以脚注说明“乌鸦”这一可能译法。
- source_word: לְמִינוֹ
  choice: （融入“各种”）
  rationale: 这是祭司文献常见的分类套语，直译为“按其类”。在本处将其与כָּל合译为“各种”，自然简洁，并保留按类别统括的含义，且不强加现代生物分类的精确性。
