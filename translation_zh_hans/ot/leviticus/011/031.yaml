base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/031.yaml
  text: These are unclean for you among all the swarming things[b][a]. Everyone who touches them when they are dead shall be unclean until the evening.
translation:
  language: zh_hans
  text: 在所有群集的小动物中，这些对你们是不洁净的。凡接触它们尸体的，必不洁净，直到晚上。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“在它们死亡时”或“在它们的死亡状态中”；指接触这些动物的尸体。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה הַטְּמֵאִים לָכֶם
  choice: 这些对你们来说是不洁净的
  rationale: 保留指示复数及关系与格；“不洁净”在利未记礼仪洁净语境中准确且通行，并不暗示一般卫生状况。
- source_word: בְּכָל הַשָּׁרֶץ
  choice: 在一切群聚的小动物中
  rationale: שֶׁרֶץ泛指成群活动或大量滋生的小型生物；“群聚的小动物”比限定为昆虫或爬行动物更能保留原词范围，“在……中”表达分类含义。
- source_word: כָּל הַנֹּגֵעַ בָּהֶם
  choice: 凡触碰它们的
  rationale: “凡……的”自然表达分配性的普遍范围；“触碰”明确表示身体接触。
- source_word: בְּמֹתָם
  choice: 它们死后
  rationale: 该表达字面与“它们的死亡”有关，在本条洁净条例中指这些动物处于死亡状态，而非仅指死亡发生的瞬间。
- source_word: יִטְמָא עַד הָעָרֶב
  choice: 都不洁净到晚上
  rationale: 以现代汉语简明表达接触后所得的礼仪状态及其持续期限；“到晚上”准确对应时间界限。
theological_decisions:
- issue: “不洁净”的性质
  choice: 采用礼仪法规中的“不洁净”，不补入“礼仪上”等解释词
  alternative: 在礼仪上不洁净
  rationale: 上下文已限定为利未记的洁净条例；正文保持原文简洁，避免把解释直接写入经文。
translation_notes:
  register: 采用现代、庄重而易懂的法规语体。保留群体类别的宽泛性，不将שֶׁרֶץ过度具体化为某一现代动物分类。
