  yaml_path: translation/ot/leviticus/011/019.yaml
  text: and the stork[a], the heron according to its kind, and the hoopoe[c][b], and the bat.
translation:
  language: zh_hans
  text: 鹳、鹭[a]的各类[c]、戴胜[b]和蝙蝠。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “鹭”所译的希伯来词所指的确切鸟类无法确定，也可能是朱鹭或其他长腿水鸟。
    reason: lexical_alternative
  - marker: b
    text: 传统上常译作“凤头麦鸡”；这个希伯来词更可能指戴胜。
    reason: alternative_reading
  - marker: c
    text: “各类”表示同一大类鸟中的相关种类。
    reason: cultural_note
lexical_decisions:
- source_word: חֲסִידָה
  choice: 鹳
  rationale: 这是传统且最获词典支持的鸟类辨认；在本段中该词用作鸟名，不按其可能与“忠诚、慈爱”有关的词根释义。
- source_word: אֲנָפָה
  choice: 鹭
  rationale: 确切鸟种不能确定；“鹭”是符合涉禽语境且较通行的现代译法，同时以脚注保留“朱鹭等长腿水鸟”的可能性。
- source_word: לְמִינָהּ
  choice: 的各类
  rationale: 表达属于这一总体鸟类的不同种类；采用自然的现代汉语，同时保留希伯来语的分类含义。
- source_word: דּוּכִיפַת
  choice: 戴胜
  rationale: 现代词汇学与动物辨认较支持 hoopoe，即“戴胜”，优于传统英语译法 lapwing 所指的“凤头麦鸡”。
- source_word: עֲטַלֵּף
  choice: 蝙蝠
  rationale: 该词辨认明确。经文按可观察到的飞行动物归类，不按现代哺乳动物分类法，因此直接译作“蝙蝠”。
- source_word: וְאֵת / וְאֶת
  choice: 列表并列关系
  rationale: 希伯来语重复使用带连词的直接宾语标记。汉语不另译宾语标记，并用顿号及末项前的“和”自然呈现并列结构。
