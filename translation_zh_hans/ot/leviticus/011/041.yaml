base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/041.yaml
  text: And every swarming thing that swarms on the earth is detestable[b][a]; it shall not be eaten.
translation:
  language: zh_hans
  text: 凡在地上爬行的小生物，都是可憎的[a]，均不可吃。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “可憎的”在这里指按礼仪规定不可作为食物。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כָל
  choice: 凡
  rationale: 这里的 וְ 承接前文，中文无需机械译出；כָּל 用“凡”表达涵盖全类的法规语气。
- source_word: הַ/שֶּׁרֶץ הַ/שֹּׁרֵץ
  choice: 群行的小生物
  rationale: שֶׁרֶץ 及其同根分词描述成群活动或贴近地面移动的一类小生物。“群行的小生物”既保留“群集活动”的特征，也比生硬重复“群行之物群行”更符合现代汉语。
- source_word: עַל הָ/אָ֑רֶץ
  choice: 在地上
  rationale: 本章按水中、空中及陆地环境区分生物；“在地上”自然表达此处的陆地范围。
- source_word: שֶׁ֥קֶץ ה֖וּא
  choice: 都是可憎的
  rationale: שֶׁקֶץ 在本章饮食律语境中指因礼仪规定而不可作为食物之物；“可憎”保留强烈否定色彩，但不额外解释为一般道德邪恶。הוּא 的强调由判断句体现。
- source_word: לֹ֥א יֵאָכֵֽל
  choice: 不可吃
  rationale: Niphal 未完成式在这里构成被动禁令。现代中文用“不可吃”简洁保留法规语体和禁止效力，且不必刻意复制被动形式。
theological_decisions:
- issue: שֶׁקֶץ 的性质
  choice: 正文译作“可憎的”，脚注说明其在本节特指按礼仪规定不可作为食物
  alternative: 可厌恶的／可憎之物
  rationale: 这样保留原文强烈的礼仪性排斥，同时避免把该词静默扩展为普遍的道德定罪。
translation_notes:
  register: 采用简洁、庄重的现代法规语体。“群行的小生物”力求兼顾 שֶׁרֶץ 的广义类别及同根词连用所表达的活动特征；不以“昆虫”限缩其范围。
