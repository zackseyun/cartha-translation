  text: the kite[a], and the falcon according to its kind,
translation:
  language: zh_hans
  text: 鸢[a]和隼，各从其类；
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这两种鸟的确切所指不能确定；前者也可译作“秃鹫”，后者也可译作“鸢”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַדָּאָה
  choice: 鸢
  rationale: 该词所指鸟种不能完全确定，但很可能是一种猛禽；“鸢”是现代汉语中自然、常见的对应词，并与另一鸟名相区别。
- source_word: הָאַיָּה
  choice: 隼
  rationale: 该词指一种猛禽，具体种类不确定，可理解为隼或鸢。正文译作“隼”，既在可能的语义范围内，也避免与前一鸟名混同。
- source_word: לְמִינָהּ
  choice: 各从其类
  rationale: 保留希伯来语按类别归属的含义；“各”在汉语中自然地表明这里包括该鸟名下的各类。
- source_word: וְאֶת ... וְאֶת
  choice: ……和……
  rationale: 宾格标记אֵת不单独翻译，并列连词则自然译为“和”，承接上下文的鸟类清单。
