source:
  edition: WLC
  text: וְ/כֹל֩ אֲשֶׁ֨ר אֵֽין ל֜/וֹ סְנַפִּ֣יר וְ/קַשְׂקֶ֗שֶׂת בַּ/יַּמִּים֙ וּ/בַ/נְּחָלִ֔ים מִ/כֹּל֙ שֶׁ֣רֶץ הַ/מַּ֔יִם וּ/מִ/כֹּ֛ל נֶ֥פֶשׁ הַ/חַיָּ֖ה אֲשֶׁ֣ר בַּ/מָּ֑יִם שֶׁ֥קֶץ הֵ֖ם לָ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/010.yaml
  text: But everything in the seas and in the streams that does not have fins and scales[b][a], among all the swarming things in the waters and among all the living creatures that are in the waters—they are detestable to you.
translation:
  language: zh_hans
  text: 但在海里和河流中，水里一切群聚的生物和一切水中的活物，凡没有鳍和鳞的，对你们来说都是可憎之物[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “可憎之物”也可译作“可厌恶之物”。这里的希伯来语在饮食律例的语境中，指礼仪上令人厌弃之物。
    reason: lexical_alternative
  - marker: b
    text: “河流”所译的希伯来语也可指溪流、河谷中的水道等流动水域。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכֹל
  choice: 但……凡……的
  rationale: 连接上节并形成对照；“但”体现语境中的转折，“凡”保留 כֹל 的周遍范围。
- source_word: אֲשֶׁר אֵין לוֹ
  choice: 凡没有……的
  rationale: 自然表达所要求特征的缺失，并清楚统摄本节所列水生类别。
- source_word: סְנַפִּיר וְקַשְׂקֶשֶׂת
  choice: 鳍和鳞
  rationale: 准确保留两项并列的身体特征；“和”表明二者都是准许食用所需的标志。
- source_word: בַּיַּמִּים וּבַנְּחָלִים
  choice: 在海里和河流中
  rationale: יַמִּים 指海域；נְחָלִים 泛指流动水道，此处译作普通读者易懂的“河流”，并以脚注保留“溪流、水道”的可能范围。
- source_word: מִכֹּל שֶׁרֶץ הַמַּיִם
  choice: 水里一切群聚的生物
  rationale: שֶׁרֶץ 描绘成群活动或繁多滋生的水生物；“群聚的生物”保留类别意象，又避免“爬物”用于水生物时可能造成的误解。
- source_word: וּמִכֹּל נֶפֶשׁ הַחַיָּה
  choice: 和一切水中的活物
  rationale: נֶפֶשׁ הַחַיָּה 在这里泛指有生命的动物，译作“活物”简洁自然，不误导为抽象的“灵魂”。
- source_word: שֶׁקֶץ הֵם לָכֶם
  choice: 对你们来说都是可憎之物
  rationale: 保留无动词名词句所陈述的身份状态，也传达饮食条例语境中强烈的礼仪性厌弃含义。
theological_decisions:
- issue: 饮食律例中 שֶׁקֶץ 的礼仪身份用语
  choice: 可憎之物
  alternative: 可厌恶之物；令人憎恶之物
  rationale: “可憎之物”保持原文的强烈语气和名词性分类，同时不额外加入“污秽”等原文此处未明说的术语；脚注说明其特指本饮食律例中的礼仪性厌弃。
translation_notes:
  register: 采用现代、庄重而易懂的法规叙述。调整希伯来语成分次序，以“凡没有鳍和鳞的”统摄前面的两类水生物；不将 שֶׁקֶץ 扩释为一般性的道德定罪。主文中的脚注标记与脚注逐一对应。
