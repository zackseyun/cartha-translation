revisions:
- from: 如果准许你们食用的牲畜中有一只死了，触碰它尸体的人就不洁净，直到晚上。
  to: 如果可供你们食用的牲畜中有一只死了，接触它的尸体的人就成为不洁净的，直到傍晚。
  rationale: 修订仅改善现代汉语的结构、法规语体和时间表达，并更明确呈现“不洁净”状态的发生；不改变原文的条件、牲畜类别、触摸对象或法律后果。正文中的“可供你们食用的”已自然表达原文的类别限定，因此无需另设脚注。
