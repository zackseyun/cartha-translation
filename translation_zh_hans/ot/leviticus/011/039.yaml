  text: וְ/כִ֤י יָמוּת֙ מִן הַ/בְּהֵמָ֔ה אֲשֶׁר הִ֥יא לָ/כֶ֖ם לְ/אָכְלָ֑ה הַ/נֹּגֵ֥עַ בְּ/נִבְלָתָ֖/הּ יִטְמָ֥א עַד הָ/עָֽרֶב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/039.yaml
  text: And if any of the livestock that may be used for food dies[a], the one who touches its carcass shall be unclean until the evening.
translation:
  language: zh_hans
  text: 如果可供你们食用的牲畜中有一只死了，接触它的尸体的人就成为不洁净的，直到傍晚。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְכִי
  choice: 如果
  rationale: 引出与上文相连的条件条例；现代汉语中用“如果”即可自然承载条件关系，无须机械译出连接词ו。
- source_word: יָמוּת
  choice: 死了
  rationale: מות的Qal未完成式位于条件句中，表示假设发生的死亡；“死了”在汉语法规语境中自然明确。
- source_word: מִן הַבְּהֵמָה
  choice: 牲畜中有一只
  rationale: מן在此为部分用法，表示该类牲畜中的一只；בהמה在本段饮食条例中宜译为“牲畜”，而非泛指一切动物。
- source_word: אֲשֶׁר הִיא לָכֶם לְאָכְלָה
  choice: 准许你们食用的
  rationale: 该短语界定可作为食物的牲畜类别。“准许你们食用的”既符合中文表达，也保留律法许可和分类的含义。
- source_word: הַנֹּגֵעַ
  choice: 触碰……的人
  rationale: 将名词化分词译为“……的人”，准确表达实施触碰行为者。
- source_word: בְּנִבְלָתָהּ
  choice: 它尸体
  rationale: נְבֵלָה指动物死后的尸体；“尸体”简洁自然，并与活体相区别。
- source_word: יִטְמָא
  choice: 就不洁净
  rationale: 此动词表示因接触而进入礼仪上的不洁状态；“不洁净”保留利未记礼仪法规的术语性质，“就”体现条件后果。
- source_word: עַד הָעָרֶב
  choice: 直到晚上
  rationale: 准确表达不洁状态持续至当日晚间的时限，并符合现代汉语习惯。
theological_decisions:
- issue: יִטְמָא所指的不洁性质
  choice: 不洁净
  alternative: 成为污秽
  rationale: 上下文讨论礼仪上的洁净状态，并非一般卫生或道德污秽；采用传统而仍可理解的“不洁净”，避免误导。
translation_notes:
  register: 采用现代、庄重而清楚的法规体中文。句序依照自然汉语调整，保留条件、对象类别、接触后果和时限。无需脚注；英文脚注所解释的许可含义已在正文“准许你们食用的”中明确表达。
