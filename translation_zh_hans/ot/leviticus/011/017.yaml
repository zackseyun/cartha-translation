  text: 小鸮[a]、鸬鹚和大鸮。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这些鸟的具体种类不能确定。“小鸮”“鸬鹚”和“大鸮”是传统或学术上可能的译法；כּוֹס也可译作“鸮”或“角鸮”，שָׁלָךְ也可能指“鹈鹕”，יַנְשׁוּף也可译作“角鸮”或“雕鸮”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכּוֹס
  choice: 小鸮
  rationale: 此词在不洁净飞禽的名单中指某种鸮类，但具体物种不能确定。“小鸮”是较常见且合乎动物分类语境的辨识，也保留了原词很可能指特定鸟类的特点。
- source_word: הַשָּׁלָךְ
  choice: 鸬鹚
  rationale: 此词所指鸟类历来有争议，可能与潜水捕鱼的水鸟有关。“鸬鹚”是传统且可成立的译法；因辨识不确定，脚注列出其他可能。
- source_word: הַיַּנְשׁוּף
  choice: 大鸮
  rationale: 此词见于飞禽名单，很可能指大型夜行鸮类。“大鸮”既表达其可能的类别与体形，又不武断确定到现代具体物种。
- source_word: וְאֶת
  choice: 、……和……
  rationale: 反复出现的连词加宾格标记表明这是承接上文的名单。中文以顿号和末项前的“和”自然呈现列举关系，无须逐项机械重复连词。
