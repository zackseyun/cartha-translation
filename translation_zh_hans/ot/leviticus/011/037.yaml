source:
  edition: WLC
  text: וְ/כִ֤י יִפֹּל֙ מִ/נִּבְלָתָ֔/ם עַל כָּל זֶ֥רַע זֵר֖וּעַ אֲשֶׁ֣ר יִזָּרֵ֑עַ טָה֖וֹר הֽוּא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/037.yaml
  text: And if any of their carcass falls on any seed for sowing that is to be sown[a], it is clean.
translation:
  language: zh_hans
  text: 如果它们的尸体有一部分掉在任何要播种的种子上[a]，这种子是洁净的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“如果它们的尸体掉在任何要播种的种子上。”希伯来语“它们的尸体”（מִנִּבְלָתָם）既可理解为尸体的一部分，也可按集合或复数意义理解为它们的尸体。
    reason: 保留希伯来语部分义与集合／复数义之间的词汇歧义。
lexical_decisions:
- source_word: וְ/כִי
  choice: 如果
  rationale: 在连续的案例律中引出条件情形；汉语用“如果”已能自然承接上下文，无须生硬补出连接词。
- source_word: יִפֹּל
  choice: 掉在
  rationale: נפל在此表示尸体或其一部分落到种子上；与介词עַל合译为“掉在……上”自然准确。
- source_word: מִ/נִּבְלָתָם
  choice: 它们的尸体有一部分
  rationale: מִן可表达部分关系，נְבֵלָה在本段指动物的尸体。正文采用部分义，同时以脚注保留也可作集合或复数理解的可能。
- source_word: כָּל זֶרַע זֵרוּעַ
  choice: 任何要播种的种子
  rationale: כָּל在条件律中宜译为“任何”；זֶרַע זֵרוּעַ指供播种之用的种子，译文避免汉语中不自然的同根重复。
- source_word: אֲשֶׁר יִזָּרֵעַ
  choice: 要播种的
  rationale: 未完成式在关系从句中带有预期、用途上的意味，指将用于播种的种子。
- source_word: טָהוֹר הוּא
  choice: 这种子是洁净的
  rationale: טָהוֹר在利未记礼仪条例中译为“洁净”；明确补出汉语所需的指代对象“这种子”，而不添加原文未明说的“仍然”。
theological_decisions:
- issue: 洁净的性质
  choice: 洁净
  alternative: 纯净
  rationale: 上下文讨论礼仪上的洁净与不洁净，而非种子的物理纯度或道德状态。
translation_notes:
  register: 采用现代、庄重而易懂的法律条文语体。“这种子”使末句指代清楚；脚注标记[a]已置于正文相关短语之后。
