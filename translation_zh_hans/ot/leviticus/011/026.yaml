  text: לְֽ/כָל הַ/בְּהֵמָ֡ה אֲשֶׁ֣ר הִוא֩ מַפְרֶ֨סֶת פַּרְסָ֜ה וְ/שֶׁ֣סַע אֵינֶ֣/נָּה שֹׁסַ֗עַת וְ/גֵרָה֙ אֵינֶ֣/נָּה מַעֲלָ֔ה טְמֵאִ֥ים הֵ֖ם לָ/כֶ֑ם כָּל הַ/נֹּגֵ֥עַ בָּ/הֶ֖ם יִטְמָֽא־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/026.yaml
  text: As for every animal that has a divided hoof[a], but does not split the hoof completely and does not chew the cud, they are unclean to you. Everyone who touches them shall be unclean.
translation:
  language: zh_hans
  text: 凡蹄虽分开、却没有完全裂开，又不反刍的走兽，对你们来说都是不洁净的。凡接触它们的，必不洁净。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְכָל הַבְּהֵמָה
  choice: 凡……的走兽
  rationale: לְ 在此引出所论类别；בְּהֵמָה 指陆地上的兽类。用“凡……的走兽”既自然，也保留律法条文的概括语气。
- source_word: מַפְרֶסֶת פַּרְסָה
  choice: 蹄有分开
  rationale: 该同源词组描述蹄呈分开状态；此译法也为下文“没有完全裂成两瓣”的限定保留空间。
- source_word: וְשֶׁסַע אֵינֶנָּה שֹׁסַעַת
  choice: 却没有完全裂成两瓣
  rationale: 原文以同源名词和动词强调蹄的裂分，却否定其充分裂开。“完全裂成两瓣”清楚表达这一限定，同时保留前后措辞中的张力。
- source_word: וְגֵרָה אֵינֶנָּה מַעֲלָה
  choice: 又不反刍
  rationale: 原文直译为“不把反刍物带上来”；“反刍”是现代汉语中准确、简明的惯用表达。
- source_word: טְמֵאִים הֵם לָכֶם
  choice: 对你们来说都是不洁净的
  rationale: “不洁净”保留利未记礼仪洁净体系中的专门范畴；“对你们来说”对应 לָכֶם 所表达的律法关系。
- source_word: כָּל הַנֹּגֵעַ בָּהֶם יִטְמָא
  choice: 凡接触它们的，必不洁净
  rationale: “凡……的”自然表达 כָּל 加分词的普遍条件；“必不洁净”体现未完成式在律法语境中所宣告的确定后果。
theological_decisions:
- issue: 利未记礼仪律中的洁净术语
  choice: 不洁净
  alternative: 污秽／不洁
  rationale: טָמֵא 在本节指礼仪与律法上的不洁状态，不必然表示道德败坏。“不洁净”既符合中文圣经语域，也避免额外引入道德判断。
- issue: 接触所导致之状态的表达
  choice: 必不洁净
  alternative: 就会成为不洁净
  rationale: 原文 יִטְמָא 可强调进入或处于不洁状态；“必不洁净”保留律法后果的确定性，而不额外说明持续时间或解除方式。
translation_notes:
  register: 采用现代、庄重而易懂的律法语体。“走兽”“反刍”“不洁净”均为普通读者可理解且适合利未记语境的用词；不把“接触它们”擅自限定为接触尸体。
