  text: מִ/כָּל הָ/אֹ֜כֶל אֲשֶׁ֣ר יֵאָכֵ֗ל אֲשֶׁ֨ר יָב֥וֹא עָלָ֛י/ו מַ֖יִם יִטְמָ֑א וְ/כָל מַשְׁקֶה֙ אֲשֶׁ֣ר יִשָּׁתֶ֔ה בְּ/כָל כְּלִ֖י יִטְמָֽא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/034.yaml
  text: Any food that may be eaten[a], on which water comes, becomes unclean; and any drink that may be drunk in any vessel becomes unclean.
translation:
  language: zh_hans
  text: 凡可吃的[a]食物，若有水沾在上面，就成为不洁净；在任何器皿里的可喝饮料，也成为不洁净。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或较直译：“被吃的”。
    reason: 原文 אֲשֶׁר יֵאָכֵל 的尼法形式可较形式化地译作“被吃的”，在本处也可理解为“可吃的、供食用的”。
lexical_decisions:
- source_word: מִכָּל הָאֹכֶל
  choice: 凡……食物
  rationale: 介词 מִן 与 כָּל 连用，在这里引出普遍类别；“凡……食物”既体现整体范围，也符合中文律法条文的表达。
- source_word: אֲשֶׁר יֵאָכֵל
  choice: 可吃的
  rationale: 尼法未完成式在此可表示适于或供人食用；“可吃的”自然保留这一限定含义。原文也可较直译为“被吃的”，故设脚注。
- source_word: אֲשֶׁר יָבֹא עָלָיו מַיִם
  choice: 只要有水沾在上面
  rationale: 原文直译是“水来到它上面”。“有水沾在上面”以自然中文表达接触关系，同时不添加是谁倒水等原文未说明的施事；“只要”体现律例中的条件关系。
- source_word: יִטְמָא
  choice: 就成为不洁净
  rationale: טמא 在本章指礼仪上的不洁净状态；“成为”表现状态变化，“不洁净”则与利未记的核心术语保持一致。
- source_word: מַשְׁקֶה אֲשֶׁר יִשָּׁתֶה
  choice: 可喝的饮料
  rationale: מַשְׁקֶה 指供饮用之物，相关尼法形式限定其为可饮用的；“可喝的饮料”简明且符合现代汉语。
- source_word: בְּכָל כְּלִי
  choice: 任何器皿里
  rationale: כְּלִי 是器皿、容器的通称；“器皿”适合利未记的礼仪语域，“任何”传达 כָּל 的周遍意义。
theological_decisions:
- issue: יִטְמָא 所表达的不洁性质
  choice: 不洁净
  alternative: 污秽／不纯洁
  rationale: 上下文讨论以色列礼仪律中的洁净分类。“不洁净”准确保留该法律—礼仪术语，又不把它误释为一般卫生状况或道德罪污。
translation_notes:
  register: 采用现代、庄重而清楚的律法语体。“凡……只要……就……”使条件和结果明确；两次使用“成为不洁净”，保留希伯来文两个平行分句的重复与法律措辞。
