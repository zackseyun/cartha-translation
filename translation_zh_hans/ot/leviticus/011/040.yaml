base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/040.yaml
  text: And the one who eats any of its carcass shall wash his clothes and be unclean until the evening[b][a], and the one who carries its carcass shall wash his clothes and be unclean until the evening.
translation:
  language: zh_hans
  text: 吃了它的尸体的一部分[a]的人，要洗衣服；他就不洁净，直到晚上[b]。搬运它的尸体的人，也要洗衣服；他就不洁净，直到晚上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“从它的尸体吃”或“吃了它的尸体中的一些”；希伯来语的表达具有部分义。
    reason: lexical_alternative
  - marker: b
    text: 这里的“不洁净”是指按照以色列礼仪洁净条例所处的不洁净状态。
    reason: cultural_note
lexical_decisions:
- source_word: הָאֹכֵל
  choice: 吃了……的人
  rationale: 带定冠词的分词在这里作名词使用，泛指实施这一行为的人；此译法既保留法律条文的单数表述，也符合现代汉语。
- source_word: מִנִּבְלָתָהּ
  choice: 它尸体中一部分
  rationale: 介词 מִן 在此具有部分义，表示吃了尸体中的一部分。正文表达这一基本含义，脚注保留较贴近形式的其他译法。
- source_word: נִבְלָתָהּ
  choice: 它的尸体
  rationale: נְבֵלָה 在本段动物洁净条例中指动物死后的尸体，而不是人的遗体；“尸体”准确且为现代读者所熟悉。
- source_word: יְכַבֵּס בְּגָדָיו
  choice: 要洗净衣服
  rationale: 未完成式在法律语境中具有规定、命令作用。“要”自然传达义务语气，“洗净衣服”也清楚表达 כבס 的动作。
- source_word: וְטָמֵא
  choice: 并且不洁净
  rationale: 该词陈述由此产生并持续的洁净状态；不在正文中增添“礼仪上”，以免超过希伯来文本的明说范围。
- source_word: עַד הָעָרֶב
  choice: 直到晚上
  rationale: 直接保留时间界限；现代汉语无需另行体现希伯来语定冠词。
- source_word: הַנֹּשֵׂא
  choice: 搬运……的人
  rationale: 带定冠词的分词作名词使用，并与前半句形成平行。“搬运”在动物尸体的语境中比抽象的“担当”更准确自然。
theological_decisions:
- issue: 不洁净的性质
  choice: 正文译为“不洁净”，另以脚注说明这是以色列洁净条例中的状态
  alternative: 正文译为“礼仪上不洁净”
  rationale: 上下文明确涉及礼仪洁净，但希伯来语本身只用 טָמֵא。正文保留原文措辞，脚注提供必要的文化说明，避免把解释直接写入经文。
- issue: 法律分词中的性别表达
  choice: 用“……的人”作泛指
  alternative: 使用带显性男性色彩的“他”
  rationale: 希伯来语采用阳性单数法律表述，但所指是任何符合条件的人。现代汉语“……的人”既忠实保留单数泛指功能，也不添加原文无意强调的性别信息。
translation_notes:
  register: 采用庄重而自然的现代标准汉语，保持利未记法律条文的平行结构。以“要”表达规定性语气，以“……的人”呈现希伯来语单数分词的泛指作用；正文不加入宗派性术语。
