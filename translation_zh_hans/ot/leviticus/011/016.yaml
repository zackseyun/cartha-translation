  yaml_path: translation/ot/leviticus/011/016.yaml
  text: and the ostrich[a], and the hawk, and the gull, and the falcon according to its kind,
translation:
  language: zh_hans
  text: 鸵鸟[a]、鹰、海鸥，以及各类隼，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节几个希伯来鸟名的具体所指并不确定；传统上也有把“鸵鸟”译作“猫头鹰”，把“鹰”译作“夜鹰”或“猫头鹰”，把“海鸥”译作“杜鹃”，把“隼”译作“鹰”的。
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּת הַיַּעֲנָה
  choice: 鸵鸟
  rationale: 该短语字面为“鸵鸟之女”，但在动物名录中作为鸟名使用；依据词典和同源词证据，译作“鸵鸟”较为合适，同时以脚注保留传统的“猫头鹰”解释。
- source_word: הַתַּחְמָס
  choice: 鹰
  rationale: 具体鸟种无法确定；原词看来指一种猛禽。采用宽泛而自然的“鹰”，避免无根据地细分鸟种。
- source_word: הַשָּׁחַף
  choice: 海鸥
  rationale: 词义虽不完全确定，但现代词典多支持鸥类；“海鸥”是现代汉语中自然易懂的鸟名。
- source_word: הַנֵּץ
  choice: 隼
  rationale: 该词指鹰隼类猛禽；译作“隼”既在语义范围内，也可与本节前面的 תַּחְמָס 区分。
- source_word: לְמִינֵהוּ
  choice: 各类
  rationale: 该分类用语表示这一鸟类所属的各种类别；“各类”简洁自然，并与律法动物名录的语境相符。
- source_word: וְאֵת / וְאֶת
  choice: 、／以及
  rationale: 希伯来语以连词和直接宾语标记连接连续名录；汉语不表达直接宾语标记，采用顿号并在末项前用“以及”，自然呈现列表结构。
theological_decisions: []
