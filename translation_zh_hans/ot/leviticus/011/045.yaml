  text: כִּ֣י אֲנִ֣י יְהוָ֗ה הַֽ/מַּעֲלֶ֤ה אֶתְ/כֶם֙ מֵ/אֶ֣רֶץ מִצְרַ֔יִם לִ/הְיֹ֥ת לָ/כֶ֖ם לֵ/אלֹהִ֑ים וִ/הְיִיתֶ֣ם קְדֹשִׁ֔ים כִּ֥י קָד֖וֹשׁ אָֽנִי׀׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/045.yaml
  text: For I am Yahweh[a], who brought you up from the land of Egypt to be your God. And you shall be holy[b], because I am holy.
translation:
  language: zh_hans
  text: 因为我是耶和华；我把你们从埃及地领上来[a]，为要作你们的上帝。你们要圣洁，因为[b]我是圣洁的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译可作“那领你们上来的”。希伯来文用分词；虽然出埃及是过去的事件，也可译作“领你们上来”。
    reason: 保留分词在时态和体貌上的表达空间。
  - marker: b
    text: 或译“原来我是圣洁的”。
    reason: 保留希伯来语连词כִּי在中文中较正式的另一种表达。
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经传统中最通行的神名译法，明确保留立约之神的专名，而不以“主”替代。
- source_word: הַמַּעֲלֶה
  choice: 把你们……领上来
  rationale: 保留עלה“上来”的空间意象；该词是分词，但在出埃及这一已经发生的事件语境中，中文用过去事件式表达最自然。
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: 从埃及地
  rationale: 保留原文明确出现的“地”，也符合中文中常见的出埃及立约表述。
- source_word: לִהְיֹת לָכֶם לֵאלֹהִים
  choice: 为要作你们的上帝
  rationale: 自然表达目的关系及立约归属，同时保留“作你们的上帝”的关系性含义。
- source_word: וִהְיִיתֶם קְדֹשִׁים
  choice: 你们要圣洁
  rationale: 在上下文中表达要求或命令；“圣洁”比仅译作“分别出来”更完整，也比“成为圣洁”更自然凝练。
- source_word: כִּי קָדוֹשׁ אָנִי
  choice: 因为我是圣洁的
  rationale: 将כִּי理解为说明以色列应当圣洁的理由，同时以脚注保留较正式的“原来”译法。
theological_decisions:
- issue: 圣洁要求的立约基础
  choice: 把百姓应当圣洁的要求，与耶和华的身份、出埃及的拯救行动以及“作你们的上帝”的立约关系并置。
  alternative: 只把本节理解为孤立的礼仪洁净规定。
  rationale: 本节虽处于饮食条例的语境，却明确诉诸出埃及、立约关系和上帝自身的圣洁；译文保留这些联系而不作超出原文的发挥。
- issue: וִהְיִיתֶם的语气
  choice: 译为带命令意味的“你们要圣洁”。
  alternative: 译为结果或应许意味较强的“你们必成为圣洁”。
  rationale: 上下文以此要求百姓分别为圣，但该动词形式本身可兼具将来或结果色彩；正文采用语境中更自然的命令读法。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“耶和华”“埃及地”“作你们的上帝”等措辞保留立约语体；句式避免古奥，并以分号清楚呈现神的身份与行动。
