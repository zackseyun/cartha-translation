id: LEV.11.5
reference: Leviticus 11:5
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/אֶת הַ/שָּׁפָ֗ן כִּֽי מַעֲלֵ֤ה גֵרָה֙ ה֔וּא וּ/פַרְסָ֖ה לֹ֣א יַפְרִ֑יס טָמֵ֥א ה֖וּא לָ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/005.yaml
  text: And the rock badger[a], because it chews the cud but does not divide the hoof, is unclean for you.
translation:
  language: zh_hans
  text: 岩蹄兔[a]，因为它反刍，却不分蹄，对你们是不洁净的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “岩蹄兔”也可简称“蹄兔”；传统译法作“沙番”，另有译法作“岩獾”。
    reason: 说明动物名称的现代识别及传统、通俗译名差异。
lexical_decisions:
- source_word: הַשָּׁפָן
  choice: 岩蹄兔
  rationale: 该词通常指栖息于岩石地带的蹄兔类动物。“岩蹄兔”在现代汉语中比传统音译“沙番”更能指明动物，也比“岩獾”更符合现代动物分类。
- source_word: כִּי
  choice: 因为
  rationale: 引出这动物被列为不洁净的原因，现代汉语用“因为”清楚自然。
- source_word: מַעֲלֵה גֵרָה
  choice: 反刍
  rationale: 希伯来语字面意思是“使食团上来”，在饮食条例中指反刍；“反刍”是简明而通行的对应表达，保留经文自身的观察与分类方式。
- source_word: וּפַרְסָה לֹא יַפְרִיס
  choice: 却不分蹄
  rationale: 原文说明其蹄没有分开。“不分蹄”简洁地保留利未记饮食条例的分类术语；“却”自然表达两项特征之间的对照。
- source_word: טָמֵא
  choice: 不洁净
  rationale: 在利未记的礼仪与饮食法规中，该词表示礼仪身份；“不洁净”是现代中文圣经语境中清楚而稳妥的表达。
- source_word: לָכֶם
  choice: 对你们
  rationale: 表明这一不洁净的分类适用于受话群体；“对你们”准确保留原文的关系指向。
theological_decisions:
- issue: 利未记饮食法规中 טָמֵא 的性质
  choice: 译作“不洁净”，表达礼仪法规中的身份
  alternative: 理解为动物本身在道德上邪恶或污秽
  rationale: 本章语境是在划分可吃与不可吃、洁净与不洁净的礼仪类别，并非评价动物的道德属性。译文保留经文的法规类别，不额外引入道德判断。
- issue: מַעֲלֵה גֵרָה 与现代动物学描述之间的关系
  choice: 按经文的观察性分类译作“反刍”
  alternative: 为符合现代动物生理分类而改写或弱化此语
  rationale: 翻译应忠实呈现原文所使用的饮食法规术语，不以现代动物学判断改写经文，也不在正文中替经文化解可能产生的张力。
translation_notes:
  register: 采用现代、庄重而易懂的法规性表达。句式保留原文“因为……却……”的因果与对照关系；“不洁净”沿用利未记礼仪语境中的核心术语。
