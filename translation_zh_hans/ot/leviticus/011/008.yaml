id: LEV.11.8
reference: Leviticus 11:8
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: מִ/בְּשָׂרָ/ם֙ לֹ֣א תֹאכֵ֔לוּ וּ/בְ/נִבְלָתָ֖/ם לֹ֣א תִגָּ֑עוּ טְמֵאִ֥ים הֵ֖ם לָ/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/008.yaml
  text: You shall not eat any of their flesh[a], and you shall not touch their carcasses; they are unclean to you.
translation:
  language: zh_hans
  text: 这些动物的肉，你们不可吃；它们的尸体[a]，你们也不可触碰；它们对你们是不洁净的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文所用的词指动物死后的尸体，也可译作“尸骸”。
    reason: 说明希伯来词נְבֵלָה特指动物尸体，并提供可行的词汇替代。
lexical_decisions:
- source_word: מִבְּשָׂרָם
  choice: 这些动物的肉
  rationale: מִן与“肉”连用，在这里具有部分义，指不可吃这些动物身上的肉；补出“这些动物”使中文指代清楚。
- source_word: לֹא תֹאכֵלוּ
  choice: 你们不可吃
  rationale: 未完成式在律法语境中表达禁令；“不可”庄重、自然，并保留明确的禁止语气。
- source_word: וּבְנִבְלָתָם
  choice: 它们的尸体
  rationale: נְבֵלָה指动物死后的躯体；“尸体”在现代汉语中清楚自然，脚注进一步限定为动物尸体，避免理解为人的遗体。
- source_word: לֹא תִגָּעוּ
  choice: 你们也不可触碰
  rationale: נגע的基本义是触摸或接触；“触碰”直接表达其义，不在正文中增添触碰后果。
- source_word: טְמֵאִים
  choice: 不洁净
  rationale: 这是利未记礼仪洁净制度中的类别用语；“不洁净”保留礼仪含义，不将其误解为一般卫生状况或道德邪恶。
- source_word: הֵם לָכֶם
  choice: 它们对你们是不洁净的
  rationale: “对你们”保留לָכֶם所表达的关系性，说明这些动物相对于以色列人被归为不洁净。
theological_decisions:
- issue: 利未记食物条例中“不洁净”的性质
  choice: 按礼仪洁净类别译为“不洁净”
  alternative: 译为“不纯洁”或进一步解释为道德上的污秽
  rationale: 经文本身使用的是以色列礼仪洁净制度的分类，不应在译文中加入关于道德邪恶或此条例后来适用范围的神学结论。
translation_notes:
  register: 采用现代、庄重而易懂的律法文体。以“不可”传达禁令，以“不洁净”维持本章礼仪分类的一致性；将脚注标在其实际解释的“尸体”之后。
