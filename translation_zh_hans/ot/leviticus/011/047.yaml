  text: לְ/הַבְדִּ֕יל בֵּ֥ין הַ/טָּמֵ֖א וּ/בֵ֣ין הַ/טָּהֹ֑ר וּ/בֵ֤ין הַֽ/חַיָּה֙ הַֽ/נֶּאֱכֶ֔לֶת וּ/בֵין֙ הַֽ/חַיָּ֔ה אֲשֶׁ֖ר לֹ֥א תֵאָכֵֽל׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/047.yaml
  text: to distinguish between the unclean and the clean[a], and between the creature that may be eaten and the creature that may not be eaten.
translation:
  language: zh_hans
  text: 为要辨别不洁净的和洁净的，以及可吃的活物[a]和不可吃的活物。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “活物”也可译作“动物”。
    reason: 保留 חַיָּה 在此处可作较广义“活物”或一般“动物”理解的词义幅度。
lexical_decisions:
- source_word: לְהַבְדִּיל
  choice: 为要辨别
  rationale: 不定式承接上文，表达目的或结果；“辨别”自然地传达律法语境中的分类与判断，且不误作空间上的分开。
- source_word: בֵּין ... וּבֵין
  choice: 辨别……和……，以及……和……
  rationale: 用两个并列的对比组保留希伯来文重复介词所形成的平行结构，同时符合现代汉语表达。
- source_word: הַטָּמֵא / הַטָּהֹר
  choice: 不洁净的／洁净的
  rationale: 这是利未记礼仪律例中的分类术语；“不洁净／洁净”既沿用清楚通行的中文表达，也避免将其直接道德化为邪恶与良善。
- source_word: הַחַיָּה
  choice: 活物
  rationale: 该词在此可泛指动物或生物；“活物”保留较宽的词义，不把范围无依据地限于野兽。
- source_word: הַנֶּאֱכֶלֶת
  choice: 可吃的
  rationale: 此处的被动分词在饮食律语境中指获准或适合食用，而不只是事实上被吃；“可吃”简洁地传达这一含义。
- source_word: אֲשֶׁר לֹא תֵאָכֵל
  choice: 不可吃的
  rationale: 该从句与获准食用者形成对照，表达禁止食用；“不可吃”在现代汉语中自然且保留律法语气。
theological_decisions:
- issue: 利未记律法中的洁净分类
  choice: 译作“不洁净的／洁净的”，按礼仪与律法类别理解
  alternative: “污秽的／纯净的”或将其解释为道德善恶
  rationale: 本节总结饮食律中的法定区别；采用洁净术语可保存原文类别，而不额外断言这些活物本身具有道德上的邪恶或良善。
- issue: “可吃／不可吃”的规范含义
  choice: 译出准许与禁止食用的对照
  alternative: 译成事实上“被吃／不被吃”或仅表示物理上“能吃／不能吃”
  rationale: 上下文是饮食律例，重点在律法许可与禁止，不是饮食习惯或生理可能性。
translation_notes:
  register: 采用现代、庄重而易懂的律法体中文。“为要”表明本节承接上文的目的关系；两个“……和……”对比组保留原文平行结构。
