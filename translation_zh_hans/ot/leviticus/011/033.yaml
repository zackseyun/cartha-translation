base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/033.yaml
  text: And every earthenware vessel into which any of them falls—everything that is in it shall become unclean[a], and you shall break it.
translation:
  language: zh_hans
  text: 凡陶器[a]，若其中任何一只掉进里面，里面的一切都成为不洁净；那器皿你们要打破。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “陶器”也可译作“陶土器皿”或“瓦器”；此处特指用陶土烧制的容器。
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּלִי חֶרֶשׂ
  choice: 陶器
  rationale: כְּלִי泛指器具或容器，חֶרֶשׂ指烧制的陶土；“陶器”在现代汉语中自然简洁，也保留了材质对礼仪条例的重要性。
- source_word: יִפֹּל מֵהֶם
  choice: 有其中一只掉进
  rationale: 复数代词承接上文所说的小动物；“其中一只”表达希伯来语在此语境中的分指含义，同时不把所指缩窄到尸体之外的其他事物。
- source_word: אֶל תּוֹכוֹ
  choice: 掉进里面
  rationale: תּוֹךְ指器皿内部；“掉进里面”自然表达由外进入器内的动作。
- source_word: כֹּל אֲשֶׁר בְּתוֹכוֹ
  choice: 器皿里的一切
  rationale: 保留כֹּל的全称范围，并以明确的“器皿里”避免汉语代词指向含混。
- source_word: יִטְמָא
  choice: 都就不洁净
  rationale: 在利未记礼仪洁净语境中，“不洁净”是清楚且稳定的术语；“就”体现由掉入所导致的状态。
- source_word: וְאֹתוֹ תִשְׁבֹּרוּ
  choice: 那器皿你们要打破
  rationale: 用前置的“那器皿”对应希伯来语宾语前置所带的强调，并以“要”自然表达指令。
theological_decisions: []
