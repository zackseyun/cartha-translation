source:
  edition: WLC
  text: וְ/כֹ֣ל אֲשֶׁר יִפֹּל עָלָי/ו֩ מֵ/הֶ֨ם בְּ/מֹתָ֜/ם יִטְמָ֗א מִ/כָּל כְּלִי עֵץ֙ א֣וֹ בֶ֤גֶד אוֹ עוֹר֙ א֣וֹ שָׂ֔ק כָּל כְּלִ֕י אֲשֶׁר יֵעָשֶׂ֥ה מְלָאכָ֖ה בָּ/הֶ֑ם בַּ/מַּ֧יִם יוּבָ֛א וְ/טָמֵ֥א עַד הָ/עֶ֖רֶב וְ/טָהֵֽר־־׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/032.yaml
  text: And everything on which any of them falls when they are dead shall become unclean—from any wooden vessel or garment or skin or sackcloth, any vessel with which work is done. It shall be put into the water, and it shall be unclean until the evening; then it shall be clean.
translation:
  language: zh_hans
  text: 它们中任何一只死后，掉在什么物件上，那物件就不洁净；无论是木器、衣服、皮子或粗麻布，凡可供使用的器具，都要放入水中[a]，并且不洁净到晚上；晚上以后就洁净了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“浸入水中。”希伯来文直译为“带入水中”。
    reason: 保留בַּמַּיִם יוּבָא在动作方式上的词义幅度。
lexical_decisions:
- source_word: אֲשֶׁר יִפֹּל עָלָיו מֵהֶם בְּמֹתָם
  choice: 它们死后，无论哪一只掉在什么东西上
  rationale: 按上下文，מֵהֶם回指上一节所说动物中的任何一只；בְּמֹתָם表示处于死亡状态或死后。采用自然汉语表达，同时保留其尸体接触物品的条件关系。
- source_word: יִטְמָא
  choice: 就不洁净
  rationale: 这里指礼仪法规中的状态变化，不表示道德罪责；“不洁净”符合现代中文圣经法律语域。
- source_word: מִכָּל כְּלִי עֵץ אוֹ בֶגֶד אוֹ עוֹר אוֹ שָׂק
  choice: 无论是木器、衣服、皮子或粗麻布
  rationale: מִן在此引出受影响物品的范围。כְּלִי עֵץ译为宽泛的“木器”；עוֹר保留为未限定加工程度的“皮子”；שָׂק指制袋等所用的粗织材料，译作“粗麻布”较易懂。
- source_word: כָּל כְּלִי אֲשֶׁר יֵעָשֶׂה מְלָאכָה בָּהֶם
  choice: 凡用来做工的器具
  rationale: 概括由上述材料制成并用于工作的各类器具；中文以用途结构自然表达希伯来文的被动与工具关系。
- source_word: בַּמַּיִם יוּבָא
  choice: 都要放入水中
  rationale: 字面为“被带入水中”。“放入水中”保留动作本身，不在正文中进一步限定为浸没或洗涤。
- source_word: וְטָמֵא עַד הָעֶרֶב וְטָהֵר
  choice: 并且不洁净到晚上，之后就洁净了
  rationale: 保留不洁净持续至晚上的法律时限，以及此后恢复洁净状态的顺序。
theological_decisions:
- issue: 洁净术语的性质
  choice: 将טמא/טהר译为“不洁净/洁净”，作为礼仪法律状态
  alternative: 污秽/除去污秽；不纯/纯净
  rationale: 本节讨论接触死物所产生的礼仪状态，并未直接宣告道德罪责；所选译法既符合利未记语境，也避免加入额外神学判断。
- issue: 入水动作的具体方式
  choice: 正文译作“放入水中”，脚注提示也可理解为“浸入水中”
  alternative: 直接译作“浸入水中”
  rationale: 希伯来文使用“使进入/带入水中”，未采用专指浸没的动词；因此正文保留较宽泛措辞，不把可能的执行方式写死。
translation_notes:
  register: 采用现代、庄重而易懂的法律条文语体。“它们”承接上一节所列的不洁净小动物；正文以分号和列举结构澄清长句关系，不添加原文没有的道德含义。
