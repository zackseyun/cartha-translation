base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/024.yaml
  text: 'And by these you shall become unclean: everyone who touches their carcass shall be unclean until the evening[a][b].'
translation:
  language: zh_hans
  text: 你们因这些会成为不洁净的：凡触碰它们的尸体的，就不洁净到晚上。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“至于这些，你们会成为不洁净的。”开头的短语也可能是较宽泛地引出下文所说的类别，而不一定严格表示致使关系。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文“它们的尸体”中的“尸体”为单数形式，带复数物主后缀；也可按分配意义理解为“它们各自的尸体”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְאֵלֶּה
  choice: 你们因这些
  rationale: 介词 לְ 与指示代词连用，在此可表达致使不洁净的关联，也可能较宽泛地引出下文类别；正文采用自然且符合上下文的“因这些”，并以脚注保留另一可能。
- source_word: תִּטַּמָּאוּ
  choice: 会成为不洁净的
  rationale: 该词是 טמא 的第二人称阳性复数未完成式，表示进入礼仪上的不洁净状态；避免使用容易暗示道德罪污或主动自污的措辞。
- source_word: כָּל הַנֹּגֵעַ
  choice: 凡触碰……的
  rationale: כָּל 加单数分词具有泛指和普遍范围，现代汉语用“凡……的”简洁自然。
- source_word: בְּנִבְלָתָם
  choice: 触碰它们尸体
  rationale: נְבֵלָה 在动物洁净条例中指死去动物的尸体；希伯来语为单数名词接复数物主后缀，正文保留单数形式“尸体”，脚注说明也可按分配意义理解为复数。
- source_word: יִטְמָא
  choice: 必不洁净
  rationale: 第三人称阳性单数形式与泛指的单数主语一致；“必不洁净”清楚表达条例所规定的礼仪状态。
- source_word: עַד הָעָרֶב
  choice: 到晚上
  rationale: 表示不洁净状态持续的终点；“到晚上”是现代汉语中自然、准确的时间表达。
theological_decisions:
- issue: 圣洁条例中“不洁净”用语的性质
  choice: 按礼仪上的不洁净状态翻译
  alternative: 译为带有道德贬义的“玷污”或“污秽”
  rationale: 本节论及接触动物尸体所产生的礼仪状态，并未把这种接触直接表述为道德罪责；“不洁净”能保留原文的祭仪范畴。
translation_notes:
  register: 采用现代、庄重而易懂的法规体中文。“不洁净”保留利未记礼仪语境；“触碰”较“摸”庄重，又比“接触”更具体。所有脚注标记均置于正文相应句末。
