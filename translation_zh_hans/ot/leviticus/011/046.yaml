  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: זֹ֣את תּוֹרַ֤ת הַ/בְּהֵמָה֙ וְ/הָ/ע֔וֹף וְ/כֹל֙ נֶ֣פֶשׁ הַֽ/חַיָּ֔ה הָ/רֹמֶ֖שֶׂת בַּ/מָּ֑יִם וּ/לְ/כָל נֶ֖פֶשׁ הַ/שֹּׁרֶ֥צֶת עַל הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/046.yaml
  text: This is the law concerning the livestock[a], the birds, every living creature that moves in the waters[c][b], and every creature that swarms on the earth.
translation:
  language: zh_hans
  text: 这是关于走兽[a]、飞鸟、水中游动的各样活物[b]，以及地上[c]成群活动的各样生物的律法[d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “走兽”或译“牲畜”或“陆地动物”；希伯来语可指兽类，常包括家畜，但并不限于家畜。
    reason: lexical_alternative
  - marker: b
    text: “活物”或译“有生命的生物”；这里的希伯来语惯用语指有生命之物，并非特指非物质的“灵魂”。
    reason: lexical_alternative
  - marker: c
    text: “地上”或译“陆地上”或“大地上”。
    reason: lexical_alternative
  - marker: d
    text: “律法”也可译“训诲”；希伯来语既可指具有权威的律例，也可指教导。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבְּהֵמָה
  choice: 走兽
  rationale: 该词泛指陆地上的兽类，虽常包括家畜，却不限于家畜。结合本章洁净与不洁净动物的范围，“走兽”比“牲畜”更全面，也与飞鸟和水生动物形成清楚的类别对照。
- source_word: הָעוֹף
  choice: 飞鸟
  rationale: עוֹף可广指有翼飞行之物；“飞鸟”是现代汉语中自然、庄重的类别名称，也保留其与飞行相关的词义。
- source_word: כָל נֶפֶשׁ הַחַיָּה
  choice: 各样活物
  rationale: נֶפֶשׁ הַחַיָּה在这里指有生命的生物，并非专指非物质的“灵魂”。“各样活物”准确而简洁。
- source_word: הָרֹמֶשֶׂת
  choice: 游动
  rationale: רמש表示移动、爬行；此处所指在水中，因此“游动”符合语境，比“爬行”自然，同时不与下文的שׁרץ混同。
- source_word: בַּמָּיִם
  choice: 水中
  rationale: 希伯来语形式为复数，但汉语以“水中”表达最自然，并完整保留其水域语义。
- source_word: הַשֹּׁרֶצֶת
  choice: 成群活动
  rationale: שׁרץ可表示群集、滋生或成群移动。“成群活动”既保留动态和群聚意味，也避免将所有此类生物狭义化为“爬虫”。
- source_word: עַל הָאָרֶץ
  choice: 地上
  rationale: אָרֶץ在这里与水域相对，可指大地或陆地；“地上”在汉语中自然涵盖两者。
- source_word: תּוֹרַת
  choice: 关于……的律法
  rationale: תּוֹרָה在本节总结前述洁净与不洁净动物的规范，既有权威律例之意，也有教导之意。“关于……的律法”符合总结性公式，并在脚注保留“训诲”的可能。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。句式保留原文总结条款的结构，以“关于……的律法”收束全句；各动物类别用并列形式呈现，并通过“游动”与“成群活动”区分רמש和שׁרץ。
