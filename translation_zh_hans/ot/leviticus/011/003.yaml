base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/003.yaml
  text: You may eat any animal that has a split hoof[a], completely divided[b], and that chews the cud.
translation:
  language: zh_hans
  text: 在走兽中，凡蹄分两瓣、蹄瓣完全裂开的，又反刍的，你们都可以吃。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כֹּל
  choice: 凡……都
  rationale: 这里与后面的分词结构搭配，按类别作周遍性陈述；“凡……都”自然体现希伯来文的分配性和包举性。
- source_word: מַפְרֶסֶת פַּרְסָה וְשֹׁסַעַת שֶׁסַע פְּרָסֹת
  choice: 蹄分开、蹄瓣完全分裂
  rationale: 前后两个同源表达共同说明蹄确实分成两瓣。译文保留其重复强调，同时用现代汉语清楚描述这一生理特征。
- source_word: מַעֲלַת גֵּרָה
  choice: 反刍
  rationale: 希伯来语字面意思是“使食团上来”。“反刍”是现代汉语对该动物行为准确、通行且简洁的说法。
- source_word: בַּבְּהֵמָה
  choice: 在走兽中
  rationale: 本节处于陆生动物分类的语境中。בְּהֵמָה在此不限于家畜；“走兽”比“牲畜”范围更合适，也比笼统的“动物”更能标明本段类别。
- source_word: אֹתָהּ תֹּאכֵלוּ
  choice: 你们都可以吃
  rationale: 未完成式在饮食条例中表达许可，而不是要求必须食用；“可以吃”准确传达法律上的准许。单数代词所指的类别在汉语“凡……的”结构中自然体现。
