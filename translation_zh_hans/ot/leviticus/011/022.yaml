base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/022.yaml
  text: 'These of them you may eat: the locust according to its kind[a], and the bald locust according to its kind, and the cricket according to its kind, and the grasshopper according to its kind.'
translation:
  language: zh_hans
  text: 其中可以吃的是以下几种：蝗虫，按其种类；秃蝗，按其种类；蟋蟀，按其种类；蚱蜢，按其种类。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 除“蝗虫”外，其余三个希伯来语昆虫名称所指的确切种类并不确定；סָלְעָם传统上译作“秃蝗”，חַרְגֹּל常译作“蟋蟀”，חָגָב常译作“蚱蜢”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה מֵהֶם
  choice: 其中……的是这些
  rationale: 该短语从上文所说有翅、群飞的生物中引出可食用的一部分；此译法贴合原文的筛选关系，也符合现代汉语表达。
- source_word: תֹּאכֵלוּ
  choice: 你们可以吃
  rationale: 未完成式在饮食条例中表达许可，而非命令必须食用；“可以吃”自然传达准许之意。
- source_word: הָאַרְבֶּה
  choice: 蝗虫
  rationale: אַרְבֶּה是希伯来语中最常见、辨识度最高的蝗虫名称。
- source_word: לְמִינוֹ / לְמִינֵהוּ
  choice: 各从其类
  rationale: 保留妥拉中反复出现的分类公式，并以简洁、庄重且为中文圣经读者熟悉的方式表达“按其种类”。
- source_word: הַסָּלְעָם
  choice: 秃蝗
  rationale: 具体昆虫无法确定；“秃蝗”保留传统辨识，并与本节其他昆虫名称相区别，同时用脚注说明不确定性。
- source_word: הַחַרְגֹּל
  choice: 蟋蟀
  rationale: 该词所指的确切直翅目昆虫不明；“蟋蟀”是传统且通行的译法，但不将其视为确定的现代物种鉴定。
- source_word: הֶחָגָב
  choice: 蚱蜢
  rationale: חָגָב通常指蝗类或草蜢类跳跃昆虫；“蚱蜢”既自然，也可与本节的אַרְבֶּה“蝗虫”区分。
