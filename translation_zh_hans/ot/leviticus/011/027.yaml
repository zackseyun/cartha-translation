revisions:
- from: 凡四足行走的动物中，用掌行走的，对你们都是不洁净的。谁触摸它们的尸体，谁就不洁净到晚上。
  to: 凡四足行走的动物中以掌着地行走的，对你们都是不洁净的。谁触摸它们的尸体，谁就必成为不洁净的，直到晚上。
  rationale: 修订仅澄清首句的句法限定关系，并以“成为不洁净的”表达触尸产生的礼仪状态变化；不增添动物分类或神学解释，也不需要脚注。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T04:50:31Z'
review_pass:
  verdict: revise
  source_fidelity: 首句原译将“用掌行走的”置于“凡四足行走的动物中”之后，虽大意可通，却使希伯来文“凡……以掌行走的，在一切四足行走的动物中”的限定关系不够清晰。修订后保留“掌”的身体部位意象，并明确其为着地行走。第二句补出“成为”，更准确表达触尸后进入礼仪不洁净状态的法律后果。
  naturalness: “凡四足行走的动物中以掌着地行走的”是庄重而可理解的规条体汉语；“必成为不洁净的，直到晚上”自然、清楚，并保留法律性语气。
  terminology: “不洁净”准确维持本节的礼仪洁净术语，避免将其误解为道德评价。“尸体”在动物死亡语境中可接受，且不必在中文中复制希伯来文单数名词加复数后缀的集合用法。
  issues:
  - severity: medium
    issue: 首句的修饰范围与原文次序不够清晰。
    rationale: 原译“凡四足行走的动物中，用掌行走的”在逗号处分开两个限定语，读起来较像先设定一类动物、后补充描述；修订为连续的名词性结构，更清楚对应原文的“凡……在……中”。
  - severity: low
    issue: “谁就不洁净到晚上”未明确状态改变。
    rationale: יִטְמָא在此规定触摸尸体所导致的礼仪不洁净状态；加入“成为”能避免理解为触摸者原已不洁净。
  revised_text: 凡四足行走的动物中以掌着地行走的，对你们都是不洁净的。谁触摸它们的尸体，谁就必成为不洁净的，直到晚上。
