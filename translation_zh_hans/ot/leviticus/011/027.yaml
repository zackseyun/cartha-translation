base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/027.yaml
  text: And every one that walks on its paws, among all the animals that walk on four feet, they are unclean to you. Everyone who touches their carcass shall be unclean until the evening.
translation:
  language: zh_hans
  text: 凡四足行走的动物中以掌着地行走的，对你们都是不洁净的。谁触摸它们的尸体，谁就必成为不洁净的，直到晚上。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְכֹל הוֹלֵךְ עַל כַּפָּיו
  choice: 凡……用掌行走的
  rationale: כַּף 原指手掌、脚掌或其凹面；这里指动物以掌部着地行走。译作“用掌行走”既保留原文的身体部位意象，也避免把范围过早限定为现代分类意义上的“爪子”。
- source_word: בְּכָל הַחַיָּה הַהֹלֶכֶת עַל אַרְבַּע
  choice: 四足行走的动物中
  rationale: חַיָּה 在本段指陆生动物；“四足行走”自然表达 עַל אַרְבַּע，同时保留其分类性表述。
- source_word: טְמֵאִים הֵם לָכֶם
  choice: 对你们都是不洁净的
  rationale: 采用利未记礼仪语境中的固定术语“不洁净”，并保留 לָכֶם“对你们”的关系表达。
- source_word: כָּל הַנֹּגֵעַ
  choice: 谁触摸……谁就
  rationale: 以现代汉语法律、规条式句型表达原文的周遍和条件效力。
- source_word: בְּנִבְלָתָם
  choice: 它们的尸体
  rationale: נְבֵלָה 指动物死尸；中文“尸体”在此自然准确。原文为单数名词配复数后缀，具有集合用法，中文无需生硬复制数的不一致。
- source_word: יִטְמָא עַד הָעָרֶב
  choice: 就不洁净到晚上
  rationale: 未完成式在律法语境中表达规定后的状态结果；“到晚上”简洁保留其时间界限。
theological_decisions:
- issue: 礼仪洁净术语
  choice: 不洁净
  alternative: 污秽／不纯洁
  rationale: טמא 在这里规定的是礼仪身份，而非直接判定道德罪责；“不洁净”最能维持这一范畴区别。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语，保留律法规条的概括性和礼仪术语；不另加脚注，因为原文中的“用掌行走”和集合性“尸体”可在正文中自然表达，不需借脚注解决。
