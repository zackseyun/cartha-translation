  text: the owl, the pelican, and the carrion vulture;
translation:
  language: zh_hans
  text: 猫头鹰[a]、鹈鹕[b]和秃鹫[c]；
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这种鸟的确切种类不详，也有译本译作某种水鸟。
    reason: 希伯来词 תִּנְשֶׁמֶת 的物种辨认有较大争议。
  - marker: b
    text: “鹈鹕”所译的希伯来词也可能指荒野中的另一种鸟。
    reason: 希伯来词 קָאָת 虽有古老译本和传统支持“鹈鹕”，但具体鸟种仍有争议。
  - marker: c
    text: 可能特指白兀鹫，即埃及秃鹫。
    reason: 希伯来词 רָחָם 可较具体地辨认为埃及秃鹫，但证据不足以在正文中完全限定。
lexical_decisions:
- source_word: הַתִּנְשֶׁמֶת (ha-tinšemet)
  choice: 猫头鹰
  rationale: 这种鸟的确切种类已无法确定；依照本节传统译法及英语审校层译作“猫头鹰”，同时用脚注保留也可能指某种水鸟的词义不确定性。
- source_word: הַקָּאָת (ha-qaʾat)
  choice: 鹈鹕
  rationale: 古代译本和长期翻译传统多支持“鹈鹕”，但该词也曾被理解为荒野中的某种鸟，因此以脚注说明辨认并不确定。
- source_word: הָרָחָם (ha-raḥam)
  choice: 食腐秃鹫
  rationale: 闪语同源词及鸟类辨认通常指向一种食腐的秃鹫，可能特指白兀鹫；正文采用较宽泛的名称，避免把不完全确定的物种认定写死。
theological_decisions:
- issue: 洁净条例中鸟名的物种辨认
  choice: 正文采用通行现代鸟名，并以脚注标明不确定性
  alternative: 将三种鸟全部音译，或断言为具体物种
  rationale: 此处的难点属于古代动物名称辨认，并不涉及需由教派立场解决的神学问题；既要使现代读者能够理解，也应忠实保留原词所容许的不确定性。
translation_notes:
  register: 采用现代、庄重而易懂的动物名称；保留原文逐项列举的简洁结构，并以分号衔接本章连续的禁食鸟类清单。
