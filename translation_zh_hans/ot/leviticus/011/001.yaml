  yaml_path: translation/ot/leviticus/011/001.yaml
  text: And Yahweh spoke to Moses and to Aaron[a], saying to them,
translation:
  language: zh_hans
  text: 耶和华对摩西和亚伦说：
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: 说
  rationale: 该形式推进叙事并引出神的宣告；现代汉语用“说”自然、庄重，也符合本节的引语结构。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经传统中广为人知的专名形式，保留四字神名作为名字的功能，而不以“主”这一称号替代。
- source_word: אֶל מֹשֶׁה וְאֶל אַהֲרֹן
  choice: 对摩西和亚伦
  rationale: 准确表达摩西和亚伦同为受话者；汉语不必机械重复介词。
- source_word: לֵאמֹר אֲלֵהֶם
  choice: 说
  rationale: 希伯来文直译近似“对他们说”；在汉语中与前面的言说动词合并为“对……说”最自然，同时仍清楚表明话是向二人说的。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威；主
  rationale: 原文直接使用四字神名。译作“耶和华”可在简体中文语境中以熟悉的专名保留其名字性质；不译成“主”，以免用称号取代原文专名。“雅威”更接近学界常见的拟音，但在普通中文读者中较不通行。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。原文的“说……对他们说”若逐项照搬会显得重复，因此按汉语表达整合为“对摩西和亚伦说”，不损失两人同为受话者的信息。
