base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/021.yaml
  text: 'Yet these you may eat from all the swarming things that fly[b][a], that go on all fours: those that have jointed legs above their feet to hop on the ground with them.'
translation:
  language: zh_hans
  text: 不过，在一切有翅、用四足行走的群生动物中，你们可以吃这一类：就是那些在脚的上方长有[a]跳跃用的腿[b]，可以用这些腿在地上跳跃的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语书写传统按字面为“没有腿”；传统诵读作“有腿”，上下文和古代译本也支持这一读法。
    reason: textual_variant
  - marker: b
    text: 或译“跳跃腿”。这里的希伯来词指专门用于跳跃的后腿。
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: 不过
  rationale: 承接前文的禁令并引出例外；“不过”在现代汉语中自然地表达限制和转折。
- source_word: אֶת זֶה
  choice: 这一类
  rationale: 原文形式为单数“这个”，但在此引出一种获准食用的类别；译作“这一类”既保留类别指向，也符合汉语表达。
- source_word: תֹּאכְלוּ
  choice: 你们可以吃
  rationale: 法律语境中的未完成式在此表达许可，与前文禁令形成对照。
- source_word: מִכֹּל שֶׁרֶץ הָעוֹף
  choice: 在一切有翅……的群生动物中
  rationale: שֶׁרֶץ指成群活动或繁生的小动物，הָעוֹף限定其为有翅类别；避免把范围缩窄为现代分类学意义上的“鸟”或“昆虫”。
- source_word: הַהֹלֵךְ עַל אַרְבַּע
  choice: 用四足行走
  rationale: 直译其运动方式，同时避免用“爬行”过度限定原文较宽泛的הלך。
- source_word: אֲשֶׁר לוֹא כְרָעַיִם
  choice: 它们……有用于跳跃的腿
  rationale: 正文按传统读法לוֹ理解为“有”；כְרָעַיִם在本语境中指适于跳跃的特殊腿部。辅以脚注交代书写传统及词义备选。
- source_word: מִמַּעַל לְרַגְלָיו
  choice: 脚的上方
  rationale: 保留原文的身体部位及相对位置描述，不将“脚”与特殊的跳跃腿混同。
- source_word: לְנַתֵּר
  choice: 蹦跳
  rationale: 表达这些特殊腿的用途，符合蝗虫一类动物在地面跳跃的动作。
- source_word: בָּהֵן
  choice: 用这些腿
  rationale: 明确代词所指，避免汉语中的歧义。
- source_word: עַל הָאָרֶץ
  choice: 在地上
  rationale: 此处描述动物的地面运动，“地上”自然且准确。
