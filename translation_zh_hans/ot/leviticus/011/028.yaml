  text: וְ/הַ/נֹּשֵׂא֙ אֶת נִבְלָתָ֔/ם יְכַבֵּ֥ס בְּגָדָ֖י/ו וְ/טָמֵ֣א עַד הָ/עָ֑רֶב טְמֵאִ֥ים הֵ֖מָּה לָ/כֶֽם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/028.yaml
  text: Whoever carries their carcass shall wash his clothes and be unclean until the evening[a]. They are unclean for you.
translation:
  language: zh_hans
  text: 凡搬运它们的尸体的人，都要洗衣服，并且要不洁净到晚上。对你们来说，它们是不洁净的。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהַנֹּשֵׂא
  choice: 凡搬运……的
  rationale: 带定冠词的分词泛指任何符合条件的人；“凡……的”自然地保留律法条文的一般适用性。
- source_word: נִבְלָתָם
  choice: 它们尸体
  rationale: נְבֵלָה特指动物的尸体，复数后缀指向上文所述动物。汉语不强制标明“尸体”的单复数，因而可保留原文可能具有的集合或分配含义。
- source_word: יְכַבֵּס בְּגָדָיו
  choice: 都要洗净衣服
  rationale: 未完成式在律法语境中表达规定或义务；“要”清楚传达规范效力，“衣服”符合现代汉语。
- source_word: וְטָמֵא
  choice: 并且不洁净
  rationale: 这里说明接触后产生的礼仪状态，而不是道德罪责；与利未记中的洁净术语保持一致。
- source_word: עַד הָעָרֶב
  choice: 到晚上
  rationale: 准确表达该不洁净状态持续至傍晚，同时符合现代汉语习惯。
- source_word: טְמֵאִים הֵמָּה לָכֶם
  choice: 对你们来说，它们是不洁净的
  rationale: 保留לָכֶם“对你们”的关系含义，并以“它们”回指上文所述动物，不额外解释其范围。
theological_decisions:
- issue: 礼仪不洁术语
  choice: 不洁净
  alternative: 污秽；不纯洁
  rationale: טמא在利未记洁净条例中是礼仪层面的技术用语；“不洁净”既能保持术语一致，也避免无根据地引入道德罪责。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“凡……的，都要……”体现律法条文的普遍规定；全节避免古奥表达，并保持利未记礼仪术语的一致性。
