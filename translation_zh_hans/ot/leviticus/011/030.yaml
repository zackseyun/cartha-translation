  text: the gecko[a], the monitor lizard, the lizard, the sand lizard, and the chameleon.
translation:
  language: zh_hans
  text: 壁虎[a]、巨蜥、蜥蜴、沙蜥和变色龙。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节几种动物的确切鉴定尚不确定。传统和现代提出的译法包括：“壁虎”也可能是“雪貂”或“鼩鼱”；“巨蜥”也可能是“变色龙”；“沙蜥”也可能是“石龙子”，较早的传统则译作“蜗牛”；“变色龙”也可能是“鼹鼠”或另一种蜥蜴。
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֲנָקָה
  choice: 壁虎
  rationale: 这一动物的确切种类不明；在本节爬行动物的语境中，译作一种蜥蜴类动物比“雪貂”或“鼩鼱”等哺乳动物更合适。“壁虎”是自然易懂、且符合可能所指的现代译法。
- source_word: הַכֹּחַ
  choice: 巨蜥
  rationale: 此词通常被理解为一种体形较大的蜥蜴。“巨蜥”既是合理的现代对应词，也能与本节其他蜥蜴类名称区分；确切种类仍不确定。
- source_word: הַלְּטָאָה
  choice: 蜥蜴
  rationale: 原词很可能泛指某种蜥蜴，无法确定具体种类，因此采用宽泛的“蜥蜴”，避免作出过度精确的判断。
- source_word: הַחֹמֶט
  choice: 沙蜥
  rationale: 在这一爬行动物名单中，将其理解为蜥蜴类比传统的“蜗牛”更符合上下文。“沙蜥”是可能的现代对应词，但具体鉴定仍有争议。
- source_word: הַתִּנְשָׁמֶת
  choice: 变色龙
  rationale: 同一希伯来词在别处可指一种鸟，但此处属于爬行小动物的名单，所以应按爬行动物理解。“变色龙”是广为采用的语境性译法，确切所指仍不确定。
