base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/002.yaml
  text: Speak to the sons of Israel[a], saying[c][b], ‘These are the living creatures that you may eat from among all the animals that are on the earth.’
translation:
  language: zh_hans
  text: 你们要对以色列子孙[a]说：‘地上一切动物中，你们可以吃的活物如下[b]：’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “以色列子孙”直译为“以色列的众子”，也可译作“以色列人”。
    reason: 说明亲属式群体称谓及其自然中文替代译法。
  - marker: b
    text: 原文直译近于“这是你们可以吃的活物”；“这”和“活物”在语法形式上是单数，但这里用作总称，并引出下文的分类清单。
    reason: 保留原文单数形式与集体、分类意义之间的张力。
lexical_decisions:
- source_word: דַּבְּרוּ
  choice: 你们要对……说
  rationale: 这是复数命令式，按上文同时吩咐摩西和亚伦；此译法保留命令语气，并自然引出受话对象和直接引语。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列子孙
  rationale: 较贴近原文的亲属群体称谓，同时也是现代中文读者能够理解的庄重表达；脚注注明也可按整体意义译作“以色列人”。
- source_word: לֵאמֹר
  choice: 说
  rationale: 这是希伯来语常用的引语引介形式；中文用“说”即可自然表达，无须重复译成“说着”。
- source_word: זֹאת הַחַיָּה
  choice: 可以吃的活物如下
  rationale: זֹאת和חַיָּה在形式上均为阴性单数，但此处具有总称和分类引介作用，后文列出多个种类。用“如下”既传达指示和目录引介功能，也避免把它误解成仅指一只动物。
- source_word: אֲשֶׁר תֹּאכְלוּ
  choice: 你们可以吃的
  rationale: 法律语境中的未完成式表达许可范围；“可以吃”比单纯未来式“将要吃”更准确。
- source_word: מִכָּל
  choice: ……一切……中
  rationale: מִן与כֹּל结合具有从整体中选取一部分的含义，中文用“……中”自然表达这一部分关系。
- source_word: הַבְּהֵמָה
  choice: 动物
  rationale: 该词可指牲畜或陆地兽类；在本章饮食条例的分类语境中宜宽泛译为“动物”，不预先限缩为家畜。
- source_word: אֲשֶׁר עַל הָאָרֶץ
  choice: 地上
  rationale: 这是地点限定语，在本章中把此类动物与随后谈到的水中生物等类别区分开来；“地上”兼顾原文形式和中文简洁度。
theological_decisions:
- issue: 饮食条例中的语气
  choice: 译作“可以吃”，表达许可
  alternative: 译作“要吃”或“将吃”
  rationale: 本句是在界定获准食用的动物，并非命令以色列人必须吃这些动物，也不只是预告未来行为。
translation_notes:
  register: 采用现代、庄重而易懂的法律训示语体。“以色列子孙”保留原文的亲属称谓；“如下”使本节自然衔接下一节的具体清单。所有脚注标记均已置于正文相应位置。
