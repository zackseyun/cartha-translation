id: LEV.21.23
reference: Leviticus 21:23
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: אַ֣ךְ אֶל הַ/פָּרֹ֜כֶת לֹ֣א יָבֹ֗א וְ/אֶל הַ/מִּזְבֵּ֛חַ לֹ֥א יִגַּ֖שׁ כִּֽי מ֣וּם בּ֑/וֹ וְ/לֹ֤א יְחַלֵּל֙ אֶת מִקְדָּשַׁ֔/י כִּ֛י אֲנִ֥י יְהוָ֖ה מְקַדְּשָֽׁ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/023.yaml
  text: However[a], he shall not go in to the veil or come near the altar, because there is a defect in him, so that he may not profane my sanctuaries[c][b]; for I am Yahweh who sanctifies them.
translation:
  language: zh_hans
  text: 但他不可来到幔子[a]前，也不可接近祭坛，因为他身体有缺陷[b]，免得亵渎我的圣所[c]；因为我是使这些圣所成圣的耶和华。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“帷幕”。这里指圣所内的幔子。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译为“他身上有缺陷”。这里说的是使他不得执行这项祭司职务的身体缺陷，并非道德过失。
    reason: lexical_alternative
  - marker: c
    text: 希伯来文作“我的圣所”，形式为复数；有些译本按整体意义译作单数“我的圣所”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: 但
  rationale: 承接上一节准许他吃圣物的规定，引出本节对祭司职务的限制；“但”自然保留转折和限制意味。
- source_word: הַפָּרֹכֶת
  choice: 幔子
  rationale: 指圣所内分隔空间的帷幔；“幔子”简洁、庄重，也符合祭祀语境。
- source_word: יָבֹא אֶל
  choice: 进到……那里
  rationale: 保留“来到／进入到”的空间意味，又不擅自断定他是越过幔子还是仅来到幔子近旁。
- source_word: הַמִּזְבֵּחַ
  choice: 祭坛
  rationale: 祭司礼仪语境中该词的标准现代汉语译法。
- source_word: יִגַּשׁ
  choice: 走近
  rationale: 体现祭司接近祭坛执行职务的用语，同时为普通读者所易懂。
- source_word: מוּם בּוֹ
  choice: 他身有残疾
  rationale: 此处指身体上的缺损，使祭司不得执行特定礼仪职务，并非道德过失；“身有残疾”明确表达这一点。
- source_word: יְחַלֵּל
  choice: 亵渎
  rationale: 在祭司圣洁用语中，表示把圣的当作凡俗；“亵渎”保留其强烈的礼仪和神学含义。
- source_word: מִקְדָּשַׁי
  choice: 我的各圣处
  rationale: 希伯来文为复数。“各圣处”既保留复数形式，也避免让现代读者误以为必然存在多个彼此独立的圣所。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的形式呈现神的专名。
- source_word: מְקַדְּשָׁם
  choice: 使它们成圣
  rationale: 保留使役分词的意义，并以复数代词对应前面的“各圣处”。
theological_decisions:
- issue: מְקַדְּשָׁם 中复数代词的所指
  choice: “它们”指前文“我的各圣处”
  alternative: 也可能宽泛地指祭司或以色列民
  rationale: 最近且在数上相合的先行词是复数的“我的各圣处”，也最贴合本节关于圣所范围和祭坛的直接语境；同时不否认在更宽广的祭司神学中，耶和华也使祭司和百姓成圣。
- issue: 祭司“身有残疾”的神学含义
  choice: 这是对特定礼仪职务的身体资格限制，并非道德定罪
  alternative: 译作“身有瑕疵”，但现代读者可能将其误解为品格缺陷
  rationale: מוּם 在本段律法中指身体状况；本节限制的是接近幔子和祭坛，并未宣告此人犯罪或价值较低。
translation_notes:
  register: 采用现代、庄重而易懂的祭司律法语体。“进到幔子那里”有意保留原文空间关系的开放性；“各圣处”保留复数，却不暗示多个独立敬拜中心。
