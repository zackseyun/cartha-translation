  terminology: “亵渎”“雅威”“火祭”“圣洁”均符合本段礼仪法规的庄重语体。“火祭”可保留为传统且简洁的祭祀术语；以“献给雅威的火祭”消除属格关系的歧义。脚注应明确“火祭”所对应的较字面替代译法，并保留“饼”为 לֶחֶם 的直译。
