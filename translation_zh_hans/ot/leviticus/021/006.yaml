source:
  edition: WLC
  text: קְדֹשִׁ֤ים יִהְיוּ֙ לֵ/אלֹ֣הֵי/הֶ֔ם וְ/לֹ֣א יְחַלְּל֔וּ שֵׁ֖ם אֱלֹהֵי/הֶ֑ם כִּי֩ אֶת אִשֵּׁ֨י יְהוָ֜ה לֶ֧חֶם אֱלֹהֵי/הֶ֛ם הֵ֥ם מַקְרִיבִ֖ם וְ/הָ֥יוּ קֹֽדֶשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/006.yaml
  text: They shall be holy to their God and shall not profane the name of their God[a], because they present the food offerings of Yahweh, the food of their God; therefore they shall be holy.
translation:
  language: zh_hans
  text: 他们要在他们的神面前为圣洁，不可亵渎他们神的名；因为他们献上献给雅威的火祭，就是他们神的食物[a]，所以他们要圣洁。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “火祭”也可译作“用火献的祭”；“食物”直译为“饼”。
    reason: 保留 אִשֵּׁי 的祭祀术语及其较字面的表达，并说明 לֶחֶם 在此可直译为“饼”。
lexical_decisions:
- source_word: קְדֹשִׁים יִהְיוּ לֵאלֹהֵיהֶם
  choice: 他们要归他们的神为圣
  rationale: “圣”保留利未记中圣与俗的核心对比；“归……为圣”自然表达 לֵאלֹהֵיהֶם 所指向的归属和分别关系，并保留法律语境中的规定语气。
- source_word: וְלֹא יְחַלְּלוּ שֵׁם אֱלֹהֵיהֶם
  choice: 不可亵渎他们神的名
  rationale: חלל 的 Piel 词形在祭祀语境中表示使神圣之物成为俗物、加以亵渎；“亵渎”准确而庄重。
- source_word: אִשֵּׁי יְהוָה
  choice: 雅威的火祭
  rationale: אִשֶּׁה 是与献火相关的祭祀术语；译作“火祭”比泛化为“食物祭”更直接保留原文的祭祀形式。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见音译呈现四字神名，避免用称号代替原文中的专名。
- source_word: לֶחֶם אֱלֹהֵיהֶם
  choice: 他们神的食物
  rationale: לֶחֶם 可指面包，也可广指食物；在祭祀语境中“食物”可避免将所献之物误限于面饼。
- source_word: הֵם מַקְרִיבִם
  choice: 他们献上
  rationale: קרב 的 Hiphil 分词指把祭物带近、呈献；“献上”符合现代汉语祭祀表达。
- source_word: וְהָיוּ קֹדֶשׁ
  choice: 所以他们要圣洁
  rationale: 末句重申祭司应有的圣洁状态；结合前面的 כי 因由句，将 וְ 译为“所以”，自然呈现上下文的推论关系。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；正文采用较贴近学界通行重建读音的“雅威”，同时不以“主”等称号取代专名。
- issue: אִשֵּׁי יְהוָה לֶחֶם אֱלֹהֵיהֶם 的关系
  choice: 雅威的火祭，就是他们神的食物
  alternative: 雅威的火祭、他们神的食物
  rationale: 将 לֶחֶם אֱלֹהֵיהֶם 理解为对前一祭祀表达的同位说明，但脚注保留较贴近词面的译法，以免过度消除原文表达上的张力。
- issue: 祭物称为神的“食物”
  choice: 保留“他们神的食物”
  alternative: 意译为“献给他们神的祭物”
  rationale: 保留原文鲜明的祭祀用语，不将其扩展解释为神需要进食，也不因潜在神学疑问而删改。
translation_notes:
  register: 采用现代、庄重而易懂的祭司法令语体。“归……为圣”“亵渎”“火祭”保留利未记的关键礼仪词汇；句法略作汉语化处理，并以分号呈现禁令与理由之间的关系。
