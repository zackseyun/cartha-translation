base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/013.yaml
  text: And he shall take a wife in her virginity[a].
translation:
  language: zh_hans
  text: 他要娶仍是处女的女子为妻[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他要娶一个处女为妻。”希伯来文直译为“在她的童贞中”。
    reason: 说明原文状态性短语的较通顺译法及其字面形式。
lexical_decisions:
- source_word: וְהוּא
  choice: 他要
  rationale: 独立代词明确承接上文的主语；汉语不必另译连接词“并且”，以免生硬。“他”保留明确主语。
- source_word: אִשָּׁה
  choice: 女子为妻
  rationale: 该词本可指“女子”或“妻子”；与“娶/取”搭配时表示婚姻关系，因此译作“女子为妻”既保留人物指称，也明确婚姻语境。
- source_word: בִּבְתוּלֶיהָ
  choice: 处女之身
  rationale: 前置词 בְּ 加抽象名词及第三人称阴性单数后缀，表达女子处于童贞状态。“处女之身”在现代汉语中自然、庄重，也比单说“处女”更贴近原文的状态性表达。
- source_word: יִקָּח
  choice: 娶
  rationale: לקח 的基本义是“取、拿”，但在以女子为宾语的婚姻语境中是“娶妻”的惯用表达。汉语“娶……为妻”既准确传达婚姻含义，也保持律法条文的庄重语体。
theological_decisions:
- issue: 祭司婚姻条例中的婚姻措辞
  choice: 译作“娶……为妻”，并保留女子处于童贞状态的表达
  alternative: 译作“他要娶一个处女”或较字面地译作“他要取一个在童贞中的女子”
  rationale: 原文是律法性、公式化的婚姻规定。“娶……为妻”准确传达 לקח אשה 的希伯来语婚姻习语；“处女之身”保留 בבתוליה 的状态意味，同时不引入超出经文的神学解释。
translation_notes:
  register: 采用现代、庄重而易懂的律法语体。“处女之身”略带正式色彩，适合祭司条例的文体；脚注补出更自然的替代译法和希伯来文字面结构。
