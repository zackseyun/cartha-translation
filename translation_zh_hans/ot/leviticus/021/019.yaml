  yaml_path: translation/ot/leviticus/021/019.yaml
  text: or a man who has a broken foot or a broken hand,[a]
translation:
  language: zh_hans
  text: 或是脚或手骨折的人，[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“身上有脚部或手部的骨折的人。”
    reason: 保留 אֲשֶׁר יִהְיֶה בוֹ 较为形式对应的“身上有”结构，并反映 שֶׁבֶר 的名词表达及原文“脚或手”的选择关系。
lexical_decisions:
- source_word: אוֹ
  choice: 或是
  rationale: 作为简单的选择连词，承接上文所列使祭司不宜近前供职的身体状况。
- source_word: אִישׁ אֲשֶׁר יִהְיֶה בוֹ
  choice: ……的人
  rationale: 希伯来语直译为“在他里面有……的人”；现代汉语用“……的人”自然表达其具有该身体状况。上下文已限定为男性祭司，无须生硬地重复“男人”。
- source_word: שֶׁבֶר
  choice: 骨折
  rationale: 该名词指骨头的折断或骨折；“骨折”既准确又是现代汉语描述此类身体损伤的常用说法。
- source_word: רָגֶל
  choice: 脚
  rationale: 该词的基本义是“脚”；虽有时可泛指腿，但本处没有充分语境依据将范围扩大为“腿”。
- source_word: יָד
  choice: 手
  rationale: 该词的直接对应词是“手”；虽有时可泛指手臂，但本处不必扩大其范围。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的法律条文语体。“脚骨折、手骨折”比逐字式的“有脚的折断、手的折断”自然，同时保留原文对脚和手的明确区分。
