  text: or hunchbacked[a], or dwarfed, or with a defect in his eye, or with an itch, or with scabs[d][c][b], or with crushed testicles.
translation:
  language: zh_hans
  text: 或是驼背的[a]，或是身材发育不全的[b]，或是眼睛有缺陷的[c]，或是患某种皮肤病的，或是患皮疹的[d]，或是睾丸被压伤的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “驼背”也可译作“背部弯曲”。
    reason: lexical_alternative
  - marker: b
    text: 译作“身材发育不全”的希伯来词含义不确定，也可能指身材矮小或身体消瘦萎缩。
    reason: lexical_alternative
  - marker: c
    text: 也可译作“眼中有斑点”；具体是哪一种眼部缺陷并不确定。
    reason: lexical_alternative
  - marker: d
    text: 这里两个希伯来词可能指两种不同的皮肤病或皮肤症状；其对应的现代医学诊断无法确定。
    reason: cultural_note
lexical_decisions:
- source_word: גִבֵּן
  choice: 驼背的
  rationale: 指背部弯曲或隆起的身体状况。“驼背”是现代汉语中清楚、自然的对应表达，不额外加入道德评价。
- source_word: דַק
  choice: 身材发育不全的
  rationale: 该词在此处含义不确定，可能指身材矮小、发育受阻或身体消瘦萎缩。正文采用较宽泛的表达，避免武断确定为某一种具体状况。
- source_word: תְּבַלֻּל בְּעֵינוֹ
  choice: 眼睛有缺陷的
  rationale: 该短语表示眼部异常，但具体病症不明；采用概括性译法，以避免误定为白内障或眼中斑点。
- source_word: גָרָב
  choice: 患疥病的
  rationale: 指一种引起瘙痒或结痂的皮肤病。“疥病”保留其皮肤疾病性质，同时不将其等同于精确的现代诊断。
- source_word: יַלֶּפֶת
  choice: 患癣病的
  rationale: 指另一种与前词有别的皮肤病。“癣病”在汉语中自然，也保留两种皮肤病之间的区分，但不声称能确定其现代医学名称。
- source_word: מְרוֹחַ אָשֶׁךְ
  choice: 睾丸受损的
  rationale: 字面涉及睾丸遭挤压或损伤。“受损”准确传达身体伤害，且比限定为某一种损伤方式稍宽，符合该分词短语的语义范围。
- source_word: אוֹ
  choice: 或是
  rationale: 重复出现的选择连词，逐项列举不同情况；一致译为“或是”以保留原文目录式结构。
theological_decisions:
- issue: 祭司圣洁条例中的身体缺陷用语
  choice: 直接描述身体状况，同时不赋予其道德含义
  alternative: 用委婉语弱化身体指称，或采用精确的现代医学诊断
  rationale: 本节所列状况关乎祭司履行特定礼仪职务的资格，并未把这些身体状况说成个人罪过。译文应保持原文具体直接的身体语言，同时避免引入污名化或并不存在的医学精确性。
translation_notes:
  register: 采用现代、庄重且易懂的标准普通话。保留原文以“或是”反复列举的结构；身体状况用语清楚直接，但对词义或医学诊断不确定之处以概括译法和脚注说明。
