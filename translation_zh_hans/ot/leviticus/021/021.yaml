id: LEV.21.21
reference: Leviticus 21:21
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כָּל אִ֞ישׁ אֲשֶׁר בּ֣/וֹ מ֗וּם מִ/זֶּ֨רַע֙ אַהֲרֹ֣ן הַ/כֹּהֵ֔ן לֹ֣א יִגַּ֔שׁ לְ/הַקְרִ֖יב אֶת אִשֵּׁ֣י יְהוָ֑ה מ֣וּם בּ֔/וֹ אֵ֚ת לֶ֣חֶם אֱלֹהָ֔י/ו לֹ֥א יִגַּ֖שׁ לְ/הַקְרִֽיב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/021.yaml
  text: No man from the offspring of Aaron the priest who has a defect shall come near to offer the food offerings of Yahweh[a]. A defect is in him[b]; he shall not come near to offer the bread of his God.
translation:
  language: zh_hans
  text: 祭司亚伦的后裔中，凡身体有缺陷的男子，都不可近前献上耶和华的火祭[a]。他身体有缺陷，不可近前献上他上帝的食物[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “火祭”也可译作“献给耶和华的食物祭”。
    reason: 原词אִשֶּׁה的确切词源和语义重点存在讨论，既可突出经火献上的祭物，也可结合本节的食物意象来表达。
  - marker: b
    text: “食物”原文直译为“饼”；这是祭司礼仪用语，指献给上帝的祭物。
    reason: 说明לֶחֶם的字面意义及其在祭祀语境中的转喻用法。
lexical_decisions:
- source_word: כָּל אִישׁ ... לֹא
  choice: 凡……的，都不可
  rationale: 以现代汉语自然表达“כל”与否定句构成的普遍禁令，并保留祭司职分在本节明确限定的男性语境。
- source_word: מִזֶּרַע אַהֲרֹן הַכֹּהֵן
  choice: 祭司亚伦的后裔中
  rationale: “זרע”在此表示家系后裔；前置“祭司”使汉语表述自然，同时保留“亚伦是祭司”的同位关系。
- source_word: מוּם
  choice: 残疾
  rationale: 本段所列的是使亚伦男性后裔不得近前献祭的身体损伤或异常；“残疾”较“瑕疵”更清楚地传达身体层面的含义，但不额外判定其道德价值。
- source_word: יִגַּשׁ
  choice: 近前
  rationale: 保留献祭礼仪中“接近”的空间与职务含义，并在本节两处采用相同译法。
- source_word: לְהַקְרִיב
  choice: 献上
  rationale: 使役词根קרב在祭祀语境指把祭物带近、呈献；“献上”是自然且庄重的现代汉语。
- source_word: אִשֵּׁי יְהוָה
  choice: 耶和华的火祭
  rationale: אִשֶּׁה是祭司文献中的祭祀术语，与火上献呈密切相关；译作“火祭”保留其传统技术含义，并以脚注说明也可按祭物的食物意象理解。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代简体中文圣经语域中最通行的专名形式，明确呈现四字神名，而非以称号替代。
- source_word: לֶחֶם אֱלֹהָיו
  choice: 他上帝的食物
  rationale: לֶחֶם字面为“饼”，但在本节祭司语境中借指献给上帝的祭物；正文译“食物”便于现代读者理解，脚注保留字面表达。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。中文正文采用广为人知且可辨识为专名的“耶和华”，同时不以“主”取代神名。
- issue: “上帝的食物”是否暗示上帝需要进食
  choice: 保留祭司礼仪的食物意象，不作本体论解释
  alternative: 将其释义为“献给他上帝的祭物”
  rationale: 原文确用לֶחֶם这一食物词汇描述祭物；译文应保存该礼仪隐喻，而不推导上帝具有人的生理需要。
- issue: 身体残疾与献祭资格的关系
  choice: 准确表达本节对近前献祭的礼仪性限制
  alternative: 泛化为残疾者不得敬拜或亲近上帝
  rationale: 经文限制的是亚伦后裔执行献祭职务，不应扩大为对残疾者属灵地位或一般敬拜资格的判断。
translation_notes:
  register: 采用现代、庄重而易懂的律法语体。“近前”在两处重复，以对应原文的结构性重复；“残疾”清楚指向本段的身体状况，但译文不加入贬损或道德评判。所有脚注标记均已置于正文相应位置。
