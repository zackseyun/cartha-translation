base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/003.yaml
  text: and for his virgin sister who is near to him[a], who has not belonged to a man, he may make himself unclean.
translation:
  language: zh_hans
  text: 也可以为与他亲近的姐姐或妹妹——她仍是处女，未曾嫁人[a]——使自己沾染不洁。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“未曾有过丈夫”或“未曾与男人结合”。希伯来语的这一习语指她尚未进入与男人的婚姻或结合关系。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלַאֲחֹתוֹ
  choice: 也可以为……姐姐或妹妹
  rationale: וְ接续前文所列可为之沾染不洁的亲属；אָחוֹת不区分年长或年幼，现代汉语需用“姐姐或妹妹”完整表达，所属关系由“他”体现。
- source_word: הַבְּתוּלָה
  choice: 未婚
  rationale: בְּתוּלָה通常指处女；本句随后以“尚未归于男人”加以限定。在这项亲属与丧葬条例中，“未婚”自然表达其尚未进入婚姻结合的身份，同时避免中文“处女姐姐或妹妹”的生硬。
- source_word: הַקְּרוֹבָה אֵלָיו
  choice: 他亲近的
  rationale: 保留希伯来文“与他亲近”的关系性表达，主要指亲属关系上的亲近，而不限定为感情亲密或单纯空间接近。
- source_word: אֲשֶׁר לֹא הָיְתָה לְאִישׁ
  choice: 就是尚未嫁人的
  rationale: 该希伯来习语直译近于“尚未归于男人”，在此可指尚未进入与男人的婚姻或结合。正文按祭司亲属条例的语境译为自然的现代汉语“尚未嫁人”，脚注保留原文表达可能涉及更广义男女结合的余地。
- source_word: לָהּ יִטַּמָּא
  choice: 使自己不洁
  rationale: יִטַּמָּא在上下文指祭司因接触死者而进入礼仪性不洁状态，并非道德败坏；句法处于许可亲属例外的清单中，故以“可以”表达许可。
theological_decisions:
- issue: 祭司条例中“不洁”的性质
  choice: 译作礼仪状态意义的“使自己不洁”
  alternative: “玷污自己”
  rationale: 上下文讨论祭司因死者而沾染礼仪性不洁，并不表示祭司犯了道德上的罪；“不洁”能保持利未记的礼仪法律范畴。
- issue: לֹא הָיְתָה לְאִישׁ所指范围
  choice: 正文依语境译为“尚未嫁人”，并以脚注保留可能包括尚未与男人结合的含义
  alternative: “尚未属于男人”或“尚未与男人同房”
  rationale: 原文是含蓄的关系习语，可能着眼于婚姻归属，也可能兼含性结合；不宜在正文中以过度字面的所有权语言表达，也不应在没有说明的情况下完全消除其语义张力。
translation_notes:
  register: 采用现代、庄重而易懂的法律叙述语体。“姐姐或妹妹”避免中文“姐妹”可能被误解为复数；“亲近”保留原文关系意象。正文中的脚注标记置于相关短语之后。
