base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/001.yaml
  text: 'And Yahweh said to Moses[a], “Speak to the priests, the sons of Aaron[b], and say to them: None shall make himself unclean for a dead person among his people,”'
translation:
  language: zh_hans
  text: 耶和华对摩西说：“你要告诉祭司，就是亚伦的子孙；要对他们说：你们中不可有人因本族中的死者而使自己不洁[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “死者”原文直译为“人”或“生命”；在这里的洁净条例中，指死去的人或尸体。“不洁”是指因接触死者而在礼仪上成为不洁。
    reason: 说明לְנֶפֶשׁ的语境义及יִטַּמָּא所指的礼仪性不洁。
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的专名“耶和华”译出四字神名，而不以“主”这一称号替代。
- source_word: אֱמֹר ... וְאָמַרְתָּ
  choice: 你要告诉……对他们说
  rationale: 保留原文两次使用אמר的重复，同时使现代汉语表达自然清楚。
- source_word: הַכֹּהֲנִים בְּנֵי אַהֲרֹן
  choice: 祭司，就是亚伦的子孙
  rationale: 将同位关系明确译出；“子孙”在此自然涵盖亚伦祭司家系，不限于亚伦亲生儿子。
- source_word: לְנֶפֶשׁ
  choice: 因……死者
  rationale: נֶפֶשׁ在尸体洁净条例中指死者或尸体；“死者”既准确又比“尸体”庄重，并由脚注说明其语境含义。
- source_word: יִטַּמָּא
  choice: 使自己不洁
  rationale: 保留动词的自反意味以及礼仪性不洁的范畴，避免译成容易被理解为道德败坏的“玷污自己”。
- source_word: בְּעַמָּיו
  choice: 族人中的
  rationale: 该短语可指在其人民或亲族之中；本段随后列出近亲例外，因此“族人中的”兼顾群体和亲属语境。
theological_decisions:
- issue: 祭司条例中“不洁”的性质
  choice: 译作“使自己不洁”，表达因接触死者而沾染礼仪上的不洁。
  alternative: 译作“玷污自己”或将其理解为道德罪污。
  rationale: 上下文属于祭司洁净条例，重点是接触死者所产生的礼仪状态，而非直接判定道德邪恶。
- issue: 禁令主语的范围
  choice: 译作“你们中不可有人”，对应对众祭司的复数讲话。
  alternative: 译作“祭司不可”或单数“他不可”。
  rationale: 原文动词虽为单数，但在对复数群体颁布分配性禁令时，可自然理解为其中任何一人都不可如此；此译法不额外限定身份。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“你要告诉……对他们说”保留原文重复；“亚伦的子孙”清楚表达祭司家系；避免使用可能误导为道德污秽的措辞。
