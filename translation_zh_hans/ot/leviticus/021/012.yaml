  text: וּ/מִן הַ/מִּקְדָּשׁ֙ לֹ֣א יֵצֵ֔א וְ/לֹ֣א יְחַלֵּ֔ל אֵ֖ת מִקְדַּ֣שׁ אֱלֹהָ֑י/ו כִּ֡י נֵ֠זֶר שֶׁ֣מֶן מִשְׁחַ֧ת אֱלֹהָ֛י/ו עָלָ֖י/ו אֲנִ֥י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/012.yaml
  text: And he shall not go out from the sanctuary[a], nor shall he profane the sanctuary of his God, because the consecration of the anointing oil of his God is upon him. I am Yahweh.
translation:
  language: zh_hans
  text: 他不可离开圣所，也不可亵渎他所事奉的上帝的圣所，因为上帝的膏立之油所赋予的分别为圣身份在他身上[a]。我是耶和华。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “分别为圣身份”或译“冠冕”。希伯来语词可指冠冕，也可指奉献或分别为圣的状态。较直译为：“他上帝膏立之油的冠冕在他身上。”
    reason: 保留נֵזֶר可指“冠冕”或“奉献、分别为圣”的词义张力，并说明正文未将其限缩为职分。
lexical_decisions:
- source_word: וּמִן הַמִּקְדָּשׁ לֹא יֵצֵא
  choice: 他不可离开圣所
  rationale: מִקְדָּשׁ指分别为圣的场所；在祭司律例中译作“圣所”自然准确。יֵצֵא本义为“出去”，结合介词מִן，用现代汉语“离开”清楚表达不得从圣所出去的禁令。
- source_word: וְלֹא יְחַלֵּל
  choice: 也不可亵渎
  rationale: חלל的Piel词形在圣洁律例中指使神圣之物失去其神圣地位，即“亵渎”；此译保留圣与俗之间的对照。
- source_word: אֵת מִקְדַּשׁ אֱלֹהָיו
  choice: 他上帝的圣所
  rationale: 按原文重复“圣所”，保留律法语句的强调；后缀译为“他的”，在汉语中自然处理为“他上帝的”。
- source_word: כִּי
  choice: 因为
  rationale: 此处引出前述禁令的理由，译作“因为”明确保留因果关系。
- source_word: נֵזֶר
  choice: 圣职
  rationale: נֵזֶר可指冠冕，也可指奉献、分别为圣的身份。此处与膏油相连，重点在大祭司经膏立所得、持续在身的神圣身份；“圣职”以自然汉语传达这一语境意义，同时用脚注保留“冠冕”的具体意象。
- source_word: שֶׁמֶן מִשְׁחַת אֱלֹהָיו
  choice: 他上帝膏油所赋予的
  rationale: 该结构直指属于他上帝的膏立之油。“膏油所赋予的”把它与经膏立而有的圣职自然连接，未省略膏油这一礼仪要素。
- source_word: עָלָיו
  choice: 在他身上
  rationale: 直译介词短语，表达经膏立所得的神圣身份持续归在他身上。
- source_word: אֲנִי יְהוָה
  choice: 我是耶和华
  rationale: 保留利未记反复出现的神圣自我宣告公式，并以“耶和华”音译四字神名。
theological_decisions:
- issue: נֵזֶר在大祭司膏立语境中的含义
  choice: 正文译作“圣职”，指膏立所赋予的神圣身份与职分。
  alternative: 可较直译为“冠冕”，即“他上帝膏油的冠冕在他身上”。
  rationale: 该词既可表示冠冕或冠饰，也可表示奉献、分别为圣的状态。上下文以大祭司受膏的身份解释禁令，因此正文采用读者易懂的功能性表达，但脚注保留原词的冠冕意象，避免消除词义张力。
translation_notes:
  register: 采用现代、庄重而清楚的律法文体。“不可”体现禁令语气；重复“圣所”以保持原文强调。正文避免生硬的“膏油的奉献”结构，改用“膏油所赋予的圣职”，并借脚注保存希伯来语的具体冠冕意象与词义张力。
