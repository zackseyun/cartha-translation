  text: לֹֽא יקרחה קָרְחָה֙ בְּ/רֹאשָׁ֔/ם וּ/פְאַ֥ת זְקָנָ֖/ם לֹ֣א יְגַלֵּ֑חוּ וּ/בִ֨/בְשָׂרָ֔/ם לֹ֥א יִשְׂרְט֖וּ שָׂרָֽטֶת־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/005.yaml
  text: They shall not make a bald patch on their head[a], nor shave off the edge of their beard, nor make cuts in their flesh.
translation:
  language: zh_hans
  text: 他们不可在头上剃出秃斑，也不可剃去胡须的边缘[a]，也不可在肉身上割出伤痕。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“胡须的角”。希伯来语这个词可指边缘、侧边或角。
    reason: 保留פאה在具体部位上的词义不确定性，避免把所指的修剪范围说得过于确定。
lexical_decisions:
- source_word: יקרחה ... קָרְחָה
  choice: 把头上剃出秃斑
  rationale: 动词与同根名词连用，强调人为造成一块秃处，而不是自然脱发。“剃出秃斑”在现代汉语中具体、清楚，也保留了原文所禁的动作。
- source_word: בְּרֹאשָׁם
  choice: 头上
  rationale: 原文以单数名词配复数后缀，语义上按每个人分配理解；汉语用“他们……头上”自然表达这一点。
- source_word: פְאַת זְקָנָם
  choice: 胡须的边缘
  rationale: פאה可指边缘、侧边或角；“边缘”不把具体修剪部位说得过于确定，并在脚注中保留另一种可能译法。
- source_word: יְגַלֵּחוּ
  choice: 剃去
  rationale: 此处强调把毛发除去；“剃去”比单说“剃”更明确地表达去除之意。
- source_word: וּבִבְשָׂרָם
  choice: 在肉身上
  rationale: בשר直指“肉身、肉体”；此译保留原文具体的身体意象，而不弱化为较泛的“身上”。
- source_word: יִשְׂרְטוּ שָׂרָטֶת
  choice: 割出伤痕
  rationale: 动词与同根名词构成的表达指在身体上割划出伤口或痕迹；“割出伤痕”直接易懂，也避免过于临床化。
theological_decisions:
- issue: 禁令的性质与背景
  choice: 只译出本节明确列举的剃秃、剃须和割伤身体等禁令，不在正文补入“为死人”或“哀悼时”等背景说明。
  alternative: 根据利未记19:28或申命记14:1，在正文中补明这是为死人哀悼的行为。
  rationale: 本节本身没有“为死人”等限定语。即使平行经文和礼俗背景可能说明这些行为的场合，译文仍应保留本节自身的表达范围，不把别处的信息写入正文。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。三个并列禁令都以“不可”构成清楚节奏；用“秃斑”“剃去”“割出伤痕”等普通读者容易理解的具体措辞，同时保留原文的身体性和简洁性。
