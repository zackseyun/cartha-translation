base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/010.yaml
  text: And the high priest, who is greater than his brothers[a], on whose head the anointing oil has been poured and whose hand has been filled to wear the garments, shall not let his head hang loose[b], nor shall he tear his garments.
translation:
  language: zh_hans
  text: “在弟兄中为首的大祭司，头上被浇了膏油，又受授职穿上圣衣的，不可蓬头散发[a]，也不可撕裂衣服。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “蓬头散发”和撕裂衣服都是当时常见的哀悼表现。
    reason: cultural_note
lexical_decisions:
- source_word: הַכֹּהֵן הַגָּדוֹל מֵאֶחָיו
  choice: 在弟兄中为首的大祭司
  rationale: הַכֹּהֵן הַגָּדוֹל是祭司职分的固定称谓，译作“大祭司”；מֵאֶחָיו在这里表示他在弟兄中的首要地位，译作“在弟兄中为首”，既保留群体关系，也自然表达比较或超越之意。
- source_word: יוּצַק עַל רֹאשׁוֹ שֶׁמֶן הַמִּשְׁחָה
  choice: 头上浇过膏油
  rationale: 保留被动式所呈现的浇油礼仪图景；“膏油”在中文圣经语境中简明而明确。
- source_word: וּמִלֵּא אֶת יָדוֹ לִלְבֹּשׁ אֶת הַבְּגָדִים
  choice: 又承接了圣职，可以穿上圣服
  rationale: “使手充满”是授予祭司职分的惯用语。正文采用自然中文“承接了圣职”，避免逐字翻译造成误解；“圣服”根据祭司礼仪语境表达特定职服，但不进一步限定其细节。
- source_word: אֶת רֹאשׁוֹ לֹא יִפְרָע
  choice: 不可蓬头散发
  rationale: פרע在此指使头发散乱、不加整理，是哀悼的外在表现；“蓬头散发”是自然、清楚的现代汉语表达。
- source_word: וּבְגָדָיו לֹא יִפְרֹם
  choice: 也不可撕裂衣服
  rationale: 直接保留撕裂衣服这一古代哀悼举动，措辞清楚而庄重。
theological_decisions:
- issue: מִלֵּא אֶת יָדוֹ这一授职惯用语的译法
  choice: 正文译作“承接了圣职”
  alternative: 直译作“使他的手充满”或“他的手已被充满”
  rationale: 该表达在祭司礼仪中指正式授职。中文直译不易传达其惯用意义，故采用意义明确且不附加宗派色彩的表达。
- issue: מֵאֶחָיו所表达的关系
  choice: 在弟兄中为首
  alternative: 高过他的弟兄；从弟兄中选出
  rationale: 介词מן在此最可能表达比较或首要地位。“为首”保留其职位上的优越性，又不把“大”解释为个人品格或本质上的更伟大。
- issue: 不可散乱头发与撕裂衣服的禁令
  choice: 保留为具体行为禁令
  alternative: 概括译作“不可采用哀悼的习俗”
  rationale: 原文列出两项具体动作；正文不把它们抽象化，以保留律例的具体性，并以脚注说明其文化功能。
translation_notes:
  register: 采用现代、庄重、易懂的法规体中文。“不可……也不可……”体现禁令的并列结构；保留“弟兄”的男性群体指向，因为这里所指的是祭司群体。
