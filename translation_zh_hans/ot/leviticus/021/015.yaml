  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/לֹֽא יְחַלֵּ֥ל זַרְע֖/וֹ בְּ/עַמָּ֑י/ו כִּ֛י אֲנִ֥י יְהוָ֖ה מְקַדְּשֽׁ/וֹ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/015.yaml
  text: He shall not profane his offspring among his people[c][b][a], for I am Yahweh who sanctifies him.
translation:
  language: zh_hans
  text: 不可在自己的族人中玷污自己的后裔[a][b]，因为我是使他分别为圣的耶和华[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “玷污”也可译作“亵渎”或“使成为俗的”。希伯来语原词指使本应为圣的成为不圣洁的。
    reason: lexical_alternative
  - marker: b
    text: 按上下文，这是指大祭司若违反婚姻方面的限制，就会使自己的后代在所属共同体中蒙受玷污；原文没有进一步说明其具体后果。
    reason: cultural_note
  - marker: c
    text: “使他分别为圣”也可译作“使他成为圣洁”或“使他成圣”。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְחַלֵּל
  choice: 玷污
  rationale: 此处是 חלל 的 Piel 形式，指使本应为圣的成为俗污、不再保持圣洁。“玷污”在现代汉语中自然，也能保留祭司圣洁语境中的严重含义。
- source_word: זַרְעוֹ
  choice: 自己的后裔
  rationale: זֶרַע 可指种子、子孙或后裔；这里涉及大祭司婚姻及其血脉，“后裔”既自然，又保留其谱系意义。
- source_word: בְּעַמָּיו
  choice: 在自己的族人中
  rationale: בְּ 加 עַמָּיו 表示其所属群体之中。此处“族人”比泛指现代国家人口的“人民”更贴合以色列共同体及亲族语境，同时不把含义限定为近亲。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代简体中文读者熟悉的神名译法“耶和华”，保留四字神名作为专名，而不以称号替代。
- source_word: מְקַדְּשׁוֹ
  choice: 使他分别为圣
  rationale: קדשׁ 的 Piel 分词表示使人成圣、将人分别出来归为圣。“使……分别为圣”清楚表达动作及祭司圣洁语境，也避免仅被理解为一次性的仪式。
theological_decisions:
- issue: 禁令所指及成圣理由
  choice: 正文保持宽泛表述：他不可在族人中玷污自己的后裔，因为耶和华使他分别为圣。
  alternative: 可更具体地解释为：大祭司若娶被禁止的女子，就会使其后裔失去祭司资格。
  rationale: 上下文确实涉及大祭司的婚姻限制，但本节希伯来文本没有明说“失去祭司资格”。因此正文不加入这一解释，只在脚注说明上下文联系，以保留原文的概括性和神学张力。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。“不可”延续律法禁令的正式语气；“自己的”两次出现，分别对应希伯来语第三人称单数所有后缀，使主体关系明确。脚注标记均置于相关词语之后，并按正文出现顺序排列。
