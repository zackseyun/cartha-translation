  text: כִּ֥י כָל אִ֛ישׁ אֲשֶׁר בּ֥/וֹ מ֖וּם לֹ֣א יִקְרָ֑ב אִ֤ישׁ עִוֵּר֙ א֣וֹ פִסֵּ֔חַ א֥וֹ חָרֻ֖ם א֥וֹ שָׂרֽוּעַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/018.yaml
  text: 'For no man who has a defect shall come near: a blind man[a], or a lame man, or one with a disfigured face[d][c][b], or one with a limb too long.'
translation:
  language: zh_hans
  text: 因为凡身体有残缺[a]的男子都不可近前[b]，无论是失明的、跛足的、面部有残损的[c]，还是肢体畸长的[d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “残缺”指本段所列、使祭司不能近前供职的身体状况。
    reason: lexical_alternative
  - marker: b
    text: 这里的“近前”是指祭司近前履行礼仪职分。
    reason: cultural_note
  - marker: c
    text: 此处的希伯来语词十分罕见，可能特指鼻子残缺、受损或畸形；确切含义不能完全确定。
    reason: lexical_alternative
  - marker: d
    text: 此处的希伯来语词可能指某一肢体或身体部分异常伸长或比例失常。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 本词承接上文，为前述禁令说明理由；“因为”自然表达其解释性语气。
- source_word: כָל אִישׁ אֲשֶׁר בּוֹ מוּם
  choice: 凡身体有残缺的男子
  rationale: 在否定句中，כָל אִישׁ 表示“凡……的男子都不”；מוּם 在本段指影响祭司供职资格的身体残缺。“男子”保留原文性别所指，因为上下文专论亚伦后裔中的男性祭司。
- source_word: לֹא יִקְרָב
  choice: 都不可近前
  rationale: 既保留 קרב“靠近、近前”的礼仪用语，也以“不可”清楚表达禁令；具体指祭司近前供职，由脚注说明。
- source_word: אִישׁ עִוֵּר
  choice: 失明的
  rationale: 准确、简洁地描述看不见的状态；与后续并列项目保持自然一致。
- source_word: פִסֵּחַ
  choice: 跛足的
  rationale: 表示行走有障碍或腿脚有残疾；“跛足”较为明确，也避免加入原文没有的病因。
- source_word: חָרֻם
  choice: 鼻部残损的
  rationale: 这是罕见词，古代译本和词典多将其理解为鼻部残缺或畸形；正文采用较可能的具体含义，同时以脚注保留其不确定性。
- source_word: שָׂרוּעַ
  choice: 肢体畸长的
  rationale: 该词可能指肢体或身体某部分异常伸长、不成比例；此译法具体易懂，却不限定究竟是哪一肢体。
theological_decisions:
- issue: 此项限制的性质
  choice: 将“不可近前”限定为祭司礼仪职分中的限制
  alternative: 理解为对这类人的普遍社会排斥，或对其人格、道德价值的判断
  rationale: 本节上下文论及祭司近前献祭的资格；原文没有把身体残缺等同于罪，也没有对人的内在价值作出评断。
- issue: 罕见身体状况术语的解释
  choice: 正文采用最可能的具体含义，并用脚注保留词义的不确定性
  alternative: 笼统译作“身体畸形”，或断言某一种精确病症
  rationale: חָרֻם 与 שָׂרוּעַ 均不常见；既不可抹去它们彼此不同的所指，也不宜给出超出原文证据的医学诊断。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“身体有残缺”符合祭司律例语境；各项用状态描述并列，避免现代医学诊断或贬损性措辞。脚注明确礼仪范围，并保留两个罕见希伯来语词的词义不确定性。
