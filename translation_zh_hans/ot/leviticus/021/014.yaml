  text: אַלְמָנָ֤ה וּ/גְרוּשָׁה֙ וַ/חֲלָלָ֣ה זֹנָ֔ה אֶת אֵ֖לֶּה לֹ֣א יִקָּ֑ח כִּ֛י אִם בְּתוּלָ֥ה מֵ/עַמָּ֖י/ו יִקַּ֥ח אִשָּֽׁה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/014.yaml
  text: 'He shall not take these as wife: a widow[a], or a divorced woman, or a defiled woman, or a prostitute. Rather, he shall take a virgin from his own people as wife.'
translation:
  language: zh_hans
  text: 他不可娶寡妇、离过婚的女子、被玷污的女子[a]或妓女；他只可娶本族中的处女为妻。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“被亵渎的女子”或“被俗化的女子”；此希伯来语词在祭司婚姻条例中指其身份被视为不合资格的女子，具体所指本节未说明。
    reason: 保留 חֲלָלָה 的“亵渎／俗化”词义范围，并避免把其资格状态的具体原因或性质强加给经文。
lexical_decisions:
- source_word: אַלְמָנָה
  choice: 寡妇
  rationale: 这是该词的常用含义，适合此处列举不可婚娶对象的法律语境。
- source_word: גְרוּשָׁה
  choice: 离过婚的女子
  rationale: 原文指被送走、被休的女子；此译法用现代汉语清楚表达其离婚身份，同时避免古旧措辞。
- source_word: חֲלָלָה
  choice: 被玷污的女子
  rationale: 该词在祭司圣洁条例中涉及因身份被视为受亵渎而不适合与祭司通婚的女子；正文采用较易懂的表达，并以脚注保留更贴近词根的译法。
- source_word: זֹנָה
  choice: 妓女
  rationale: 直接表达原词在此处的通常含义，现代、明确而不古旧。
- source_word: אֶת אֵלֶּה לֹא יִקָּח
  choice: 他不可娶……
  rationale: 希伯来语“取”在本句是娶妻的法律用语；汉语直接译作“娶”更自然，也保留禁令语气。
- source_word: כִּי אִם
  choice: 只可
  rationale: 承接前面的禁令，引出唯一获准的婚娶对象，准确体现排他性的转折。
- source_word: בְּתוּלָה
  choice: 处女
  rationale: 在婚姻法规语境中准确表达该词的含义。
- source_word: מֵעַמָּיו
  choice: 本族中的
  rationale: 表达女子须来自他自己的民众或族群之中；“本族中的”简洁自然。
- source_word: יִקַּח אִשָּׁה
  choice: 娶……为妻
  rationale: 明确表达原文“取一个女人/妻子”的婚姻含义，符合现代汉语习惯。
theological_decisions:
- issue: 祭司婚姻禁令中 חֲלָלָה 的译法
  choice: 被玷污的女子
  alternative: 被亵渎的女子；失去圣洁身份的女子
  rationale: 该词与祭司圣洁身份有关，并非单纯描述身体不洁或一般道德败坏。正文采用通顺而仍保留礼仪—身份色彩的译法，脚注说明其词义范围，避免把具体成因强加进经文。
translation_notes:
  register: 采用现代、庄重而易懂的法规语体。“不可娶……只可娶……”保持原文禁令与许可之间的鲜明对照；列表用词简洁，避免古旧的“休妇”“娼妓”等表达。
