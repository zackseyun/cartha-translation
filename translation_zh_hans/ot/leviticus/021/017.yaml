base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/017.yaml
  text: 'Speak to Aaron[b][a], saying: Any man from your offspring throughout their generations who has a defect shall not come near to offer the food of his God.'
translation:
  language: zh_hans
  text: 你要对亚伦说：你后裔中，世世代代凡身体有残缺[a]的男子，都不可近前来献他上帝的食物[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“有瑕疵”。希伯来语 מוּם 在这里指使人不能履行这项祭司职务的身体缺陷。
    reason: lexical_alternative
  - marker: b
    text: 直译“他上帝的饼”；在这里的祭司礼仪语境中，“饼”泛指献给上帝的祭物食品。
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר אֶל אַהֲרֹן לֵאמֹר
  choice: 你要对亚伦说
  rationale: 以自然的现代汉语表达命令式及希伯来语常见的引语引入格式，同时保留直接吩咐的语气。
- source_word: אִישׁ מִזַּרְעֲךָ
  choice: 你后裔中……的男子
  rationale: 这里指亚伦后裔中本可承担祭司职分的男性；“后裔”准确表达血统延续，又比“种子”自然。
- source_word: לְדֹרֹתָם
  choice: 世世代代
  rationale: 表达这项规定持续适用于亚伦家系的历代后裔。
- source_word: מוּם
  choice: 身体有残缺
  rationale: 本词在祭司与献祭条例中指影响礼仪职务资格的身体缺陷；此译法清楚而不过度暗示道德过错，并以脚注保留“瑕疵”这一传统译法。
- source_word: לֹא יִקְרַב
  choice: 不可近前来
  rationale: 既保留法律禁令的力度，也保留祭司条例中“接近”圣所或祭坛的专门意味。
- source_word: לְהַקְרִיב
  choice: 献
  rationale: 使役词形在此指把祭物呈献给上帝；“献”符合现代汉语的献祭语境。
- source_word: לֶחֶם אֱלֹהָיו
  choice: 他上帝的食物
  rationale: לֶחֶם 字面为“饼”，但在本段祭司礼仪语境中泛指献给上帝的祭物食品；正文译作“食物”较能传达实际范围，脚注保留字面意义。
theological_decisions:
- issue: 对身体有残缺之祭司的礼仪职务限制
  choice: 忠实译为不得近前献祭物食品的特定祭司职务限制
  alternative: 将经文扩大解释为当事人在道德、人格或圣约身份上低人一等
  rationale: 原文规定的是特定圣所职务的礼仪资格，并未宣称身体有残缺者有道德罪责、较低的人格价值，或被排除在圣约群体之外。译文不加入这些原文没有作出的判断。
- issue: לֶחֶם 的礼仪含义
  choice: 正文译“食物”，脚注说明字面为“饼”
  alternative: 正文直译“饼”
  rationale: 直译“饼”可能使现代读者误以为只涉及烘焙食品；“食物”在此更能体现祭司文献中泛指祭物食品的用法，同时用脚注保留原文意象。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。“不可近前来”保留祭司礼仪用语的色彩；“身体有残缺”避免把礼仪资格限制误写成对人格价值的评断。所有脚注标记均置于正文相应词语之后。
