  yaml_path: translation/ot/leviticus/021/016.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: zh_hans
  text: 耶和华对摩西说：
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: 说
  rationale: 该形式引出新的叙事性发言事件。在现代汉语的神谕引言中，“对……说”自然、庄重，也无需机械区分“说”与“讲话”。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 这是四字神名。中文采用已广泛通行的专名形式“耶和华”，而非以“主”这一称号替代。
- source_word: אֶל
  choice: 对
  rationale: 此介词标明发言所指向的对象；在“对摩西说”中译作“对”最符合现代汉语习惯。
- source_word: מֹשֶׁה
  choice: 摩西
  rationale: 采用该希伯来人名在现代中文圣经及一般中文中的标准译名。
- source_word: לֵאמֹר
  choice: （由冒号表达）
  rationale: 该词标示随后将引出直接话语。现代汉语通常以“说：”及冒号自然表达，不必重复译为“说道”。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威；上主；主
  rationale: 原文使用神的专名，而非称号。正文保留中文读者熟悉的专名“耶和华”，避免用“主”消除专名与称号之间的区别；“雅威”更接近常见学术拟音，但在普通现代中文中的通行度较低。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。“耶和华对摩西说：”保留原文的发言公式，并用冒号明确表示讲话内容承接下一节。
