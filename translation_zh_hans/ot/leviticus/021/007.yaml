  text: אִשָּׁ֨ה זֹנָ֤ה וַ/חֲלָלָה֙ לֹ֣א יִקָּ֔חוּ וְ/אִשָּׁ֛ה גְּרוּשָׁ֥ה מֵ/אִישָׁ֖/הּ לֹ֣א יִקָּ֑חוּ כִּֽי קָדֹ֥שׁ ה֖וּא לֵ/אלֹהָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/007.yaml
  text: They shall not take a woman who is a prostitute or defiled, and they shall not take a woman divorced from her husband, for he is holy to his God.
translation:
  language: zh_hans
  text: 他们不可娶妓女或被玷污的女子，也不可娶被丈夫休弃的女子，因为祭司是归他的上帝为圣的。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: זֹנָה
  choice: 作妓女
  rationale: 表达该词所指从事卖淫的女子，措辞自然，也不把重点转移为对其人格的定性。
- source_word: חֲלָלָה
  choice: 被玷污的女子
  rationale: 保留该词与圣俗界限相关的被动含义，并与现有审定用语“defiled”一致；不进一步限定其被玷污的具体方式。
- source_word: גְּרוּשָׁה מֵאִישָׁהּ
  choice: 被丈夫休弃的女子
  rationale: 准确体现“从她丈夫那里被遣离／离弃”的含义；“休弃”符合律法语境，同时现代读者可以理解。
- source_word: קָדֹשׁ הוּא לֵאלֹהָיו
  choice: 祭司是归他的上帝为圣的
  rationale: 原文由前面的复数规定转为单数，泛指每一位祭司；补出“祭司”以免中文代词指向不明，并用“归……为圣”表达关系性的分别为圣。
theological_decisions:
- issue: חֲלָלָה所表达的礼仪—身份含义
  choice: 被玷污的女子
  alternative: 被亵渎的女子／失去圣洁身份的女子
  rationale: 原词含有被剥夺圣洁资格或遭亵渎的意味，但经文没有在此说明成因；采用较宽泛的“被玷污”以保留张力，避免加入特定身份理论。
- issue: 复数命令与单数理由之间的转换
  choice: 前句用“他们”，末句用泛指单数“祭司”
  alternative: 全句统一为复数“他们……因为他们……”
  rationale: 保留希伯来文从יִקָּחוּ复数到הוּא单数的转换，同时以明确名词避免中文歧义。
translation_notes:
  register: 采用现代、庄重而易懂的律法文体。“娶”自然表达婚娶语境；“休弃”略带经文语域，但仍为普通现代读者熟悉。
