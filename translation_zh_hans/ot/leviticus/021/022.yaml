  text: לֶ֣חֶם אֱלֹהָ֔י/ו מִ/קָּדְשֵׁ֖י הַ/קֳּדָשִׁ֑ים וּ/מִן הַ/קֳּדָשִׁ֖ים יֹאכֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/022.yaml
  text: He may eat the food of his God[a], from the most holy things and from the holy things.
translation:
  language: zh_hans
  text: 他可以吃属于他上帝的食物[a]：既可吃至圣之物，也可吃圣物。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “食物”直译为“饼”；这里泛指分给祭司的神圣食物。
    reason: 保留 לֶחֶם 的字面意义及其在祭祀语境中的习惯用法。
lexical_decisions:
- source_word: לֶחֶם
  choice: 食物
  rationale: 该词本义为“饼”，但在这里指祭司所得的神圣食物份额；译作“食物”可避免让人误以为仅指饼，同时以脚注保留字面译法。
- source_word: אֱלֹהָיו
  choice: 他上帝的
  rationale: 保留希伯来语第三人称阳性单数所属后缀，表达这位祭司与上帝的关系。
- source_word: מִקָּדְשֵׁי הַקֳּדָשִׁים
  choice: 至圣之物
  rationale: 该结构表达最高等级的圣物；“至圣之物”既自然，也保留祭司律法中的类别区分。
- source_word: וּמִן הַקֳּדָשִׁים
  choice: 还是圣物
  rationale: “圣物”与前面的“至圣之物”保持词根联系，并体现两类神圣份额的对照；用“无论……还是……”自然表达两者都可食用。
- source_word: יֹאכֵל
  choice: 可以吃
  rationale: 在上下文的律法对照中，此未完成式表示许可：有残疾的祭司虽不可近前献祭，却仍获准吃神圣份额。
theological_decisions:
- issue: 祭司律法中 יֹאכֵל 的语气
  choice: 许可（“可以吃”）
  alternative: 简单将来（“要吃”）或义务命令（“应当吃”）
  rationale: 上下文旨在区分禁止近前献祭与仍可享用圣物的权利；许可语气最能保留这一法律对照，而不把它强化为义务。
translation_notes:
  register: 采用现代、庄重而易懂的律法文体。“至圣之物”和“圣物”保留原文的祭祀类别区分；“无论……还是……”使汉语表达自然，但不消除两类圣物的区别。
