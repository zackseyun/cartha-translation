revisions:
- from: 他可以吃他上帝的食物[a]，无论是至圣之物，还是圣物。
  to: 他可以吃属于他上帝的食物[a]：既可吃至圣之物，也可吃圣物。
  rationale: 修订使“他的上帝”的所属关系在现代汉语中自然可懂，并以“既可吃……，也可吃……”明确对应原文对两类圣物的并列列举和许可语气；未改变祭祀类别或增加神学解释。
