id: LEV.21.9
reference: Leviticus 21:9
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וּ/בַת֙ אִ֣ישׁ כֹּהֵ֔ן כִּ֥י תֵחֵ֖ל לִ/זְנ֑וֹת אֶת אָבִ֨י/הָ֙ הִ֣יא מְחַלֶּ֔לֶת בָּ/אֵ֖שׁ תִּשָּׂרֵֽף־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/009.yaml
  text: And the daughter of a priest[a], if she profanes herself by prostituting herself, profanes her father[b]; she shall be burned with fire.
translation:
  language: zh_hans
  text: 祭司的女儿若因行淫[a]而亵渎自己[b]，就是亵渎她的父亲；她必须被火焚烧。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “行淫”也可译作“作妓女”或“卖淫”。
    reason: lexical_alternative
  - marker: b
    text: “亵渎自己”所对应的希伯来语也可能理解为“开始”，整句因而可译作“若开始行淫”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַת אִישׁ כֹּהֵן
  choice: 祭司的女儿
  rationale: 这是希伯来语领属结构，直译为“一个人、一个祭司的女儿”，在现代汉语中自然表达为“祭司的女儿”；句首的连接词在单节独立呈现时无需硬译为“并且”。
- source_word: כִּי
  choice: 若
  rationale: 在律例体裁中引出条件性案例；“若”简洁、庄重，并保留法律条文的语气。
- source_word: תֵחֵל
  choice: 亵渎自己
  rationale: 按 חלל 的使役词干理解，表达使自己落入不圣、受亵渎的状态；这样也与后句同词根的“亵渎她的父亲”形成清楚呼应。另有按“开始”理解的可能，收入脚注。
- source_word: לִזְנוֹת
  choice: 因行淫
  rationale: זנה 可指作妓女、卖淫或行淫；本节是具体的性行为语境。“行淫”既保留其负面和具体含义，又不武断加入是否收取报酬这一原文未明说的细节。
- source_word: אֶת אָבִיהָ הִיא מְחַלֶּלֶת
  choice: 就是亵渎她的父亲
  rationale: 保留 חלל 的祭司圣洁语汇，不弱化为单纯的“使父亲蒙羞”；“就是”自然表达独立代词 הִיא 所带的强调。
- source_word: בָּאֵשׁ תִּשָּׂרֵף
  choice: 她必须被火焚烧
  rationale: 被动式与司法语境中的未完成式共同表达规定的刑罚。“必须”明确其律法命令性质，“被火焚烧”保留原文被动结构及火刑措辞。
theological_decisions:
- issue: 祭司圣洁律例中 חלל 的译法
  choice: 前后两处均译为“亵渎”
  alternative: 前句译“玷污自己”，后句译“使父亲蒙羞”
  rationale: 重复“亵渎”可保存原文词根呼应及祭司圣洁语境中的宗教含义，同时不把经文缩减为社会名誉问题。
- issue: זנה 所指行为的具体程度
  choice: 正文译“行淫”，脚注说明“作妓女/卖淫”
  alternative: 正文直接译“卖淫”
  rationale: 该词可以具体指妓女行为，但本节本身没有明说金钱交易；“行淫”保留较宽的语义范围，脚注则呈现更具体的词义可能。
- issue: 火焚刑罚的表达
  choice: 按原文直接译出，不补充执行次序或方式
  alternative: 解释为先处死后焚尸，或直接断定为活活烧死
  rationale: 本节只规定“被火焚烧”，没有说明焚烧是否为直接处死方式；译文不借助其他传统或推论消除这一未说明之处。
translation_notes:
  register: 采用现代、庄重而清楚的律法语体。“若”“必须”体现条件律例和法定刑罚；重复“亵渎”保存原文关键词的呼应。正文避免古奥的“娼妓”“辱没”等措辞，也不对刑罚执行方式作超出原文的解释。
