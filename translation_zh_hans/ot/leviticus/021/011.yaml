  text: וְ/עַ֛ל כָּל נַפְשֹׁ֥ת מֵ֖ת לֹ֣א יָבֹ֑א לְ/אָבִ֥י/ו וּ/לְ/אִמּ֖/וֹ לֹ֥א יִטַּמָּֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/011.yaml
  text: He shall not go near any dead body[a]; he shall not make himself unclean even for his father or for his mother.
translation:
  language: zh_hans
  text: 他不可接近任何尸体[a]；即使是自己的父亲或母亲，也不可使自己不洁净。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“尸首”。原文所用词通常可指“人”或“生命”；在洁净条例中，这一惯用表达是指人的尸体。
    reason: 说明希伯来语惯用表达及其词义选择，避免将נֶפֶשׁ理解为死者脱离身体的灵魂。
lexical_decisions:
- source_word: וְעַל ... לֹא יָבֹא
  choice: 不可挨近
  rationale: 在祭司洁净条例中，בוא与עַל连用，表达接近死者尸体、从而可能沾染不洁的意思；“挨近”自然地传达这一禁令，而不把含义限于一般性的“来到”。
- source_word: כָּל
  choice: 任何
  rationale: 与否定词连用时，“任何”最清楚地表达无一例外的全面禁止。
- source_word: נַפְשֹׁת מֵת
  choice: 死人的尸体
  rationale: 该短语字面涉及“死者的人/生命”，但在利未记洁净条例中是指人的尸体。“死人的尸体”明确保留其人为死者的所指，避免将נֶפֶשׁ误解为脱离身体的“灵魂”。
- source_word: לְאָבִיו וּלְאִמּוֹ
  choice: 即使是他的父亲或母亲
  rationale: ל在这里标明相关对象；在全面禁令之后列出至亲，具有连父母也不例外的强调意味。“或”符合逐一分配的语义。
- source_word: לֹא יִטַּמָּא
  choice: 不可使自己不洁净
  rationale: טמא的Hitpael形式在此具有反身意义。“使自己不洁净”保留礼仪洁净范畴，不将其误释为一般道德败坏。
theological_decisions:
- issue: 礼仪不洁的术语
  choice: 不洁净
  alternative: 玷污自己；在礼仪上成为不洁净
  rationale: 经文涉及祭司因接触尸体而产生的不洁。“不洁净”保留利未记本身的分类；“玷污”容易带出过强的道德含义，而加上“在礼仪上”则把解释直接写入正文。
translation_notes:
  register: 采用现代、庄重而易懂的法规语体。“不可”体现法律禁令；分号保留两项彼此相关的禁止。“即使”显明父母也不构成例外，但不额外引入宗派性解释。
