  text: וְ/קִדַּשְׁתּ֔/וֹ כִּֽי אֶת לֶ֥חֶם אֱלֹהֶ֖י/ךָ ה֣וּא מַקְרִ֑יב קָדֹשׁ֙ יִֽהְיֶה לָּ֔/ךְ כִּ֣י קָד֔וֹשׁ אֲנִ֥י יְהוָ֖ה מְקַדִּשְׁ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/008.yaml
  text: You shall treat him as holy[a], because he offers the food of your God. He shall be holy to you, for I, Yahweh who sanctify you, am holy.
translation:
  language: zh_hans
  text: 你要尊他为圣，因为他献上献给你神的食物[a]。他在你看来应当是圣的，因为我雅威、使你们成圣的那一位，是圣的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “食物”直译为“饼”；这里很可能广指献给神的食物祭。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקִדַּשְׁתּוֹ
  choice: 你要尊他为圣
  rationale: קדשׁ 的 Piel 形式在这里要求以色列人把祭司分别为圣，并按其圣洁身份看待他。“尊他为圣”既保留命令语气和“圣”的词根呼应，也比“使他成圣”更准确地表达百姓应有的态度。
- source_word: לֶחֶם אֱלֹהֶיךָ
  choice: 你神的食物
  rationale: לֶחֶם 字面可译“饼”，但在祭司献祭的语境中可广指献给神的食物或食物祭。“食物”符合此处礼仪语境，同时以脚注保留字面译法。
- source_word: מַקְרִיב
  choice: 献上
  rationale: קרב 的 Hiphil 分词在献祭语境中指把祭物呈献给神；“献上”自然、明确，并保留祭司职分的礼仪含义。
- source_word: קָדֹשׁ יִהְיֶה לָּךְ
  choice: 他对你应当是圣的
  rationale: 保留 לְ 的关系意味，也保留前后“圣”的重复。“应当”传达 יִהְיֶה 在本段规范性语境中的要求，而不把它仅处理为未来陈述。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见音译呈现神的专名，而不以称号替代。
- source_word: מְקַדִּשְׁכֶם
  choice: 使你们成圣
  rationale: 该分词表达雅威持续或具有特征性的使人成圣行动。“使你们成圣”自然清楚，并与本节反复出现的 קדשׁ 词群保持联系。
theological_decisions:
- issue: לֶחֶם אֱלֹהֶיךָ 的祭祀含义
  choice: 你神的食物
  alternative: 你神的饼
  rationale: 上下文谈论祭司献祭，לֶחֶם 在此很可能广指献给神的食物祭，而非只指普通的饼；脚注保留较直译的可能。
- issue: קדשׁ 词群的重复
  choice: 尊……为圣／是圣的／使……成圣
  alternative: 把……分别出来／归为圣／使……圣洁
  rationale: 重复使用“圣”保留本节的词汇与神学连贯性：祭司之圣与雅威自身的圣洁及其使百姓成圣的行动相连。
- issue: 第二人称单数与复数的转换
  choice: 保留“你”与“你们”的转换
  alternative: 全译为“你们”
  rationale: 希伯来文前半节以第二人称单数称呼共同体，末尾 מְקַדִּשְׁכֶם 则明确为复数。译文保留这一转换，不擅自抹平原文形式上的张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“尊他为圣”表达群体应按祭司的圣洁身份对待他；“献上”符合祭祀语境。保留原文从单数“你”转为复数“你们”的人称变化。
