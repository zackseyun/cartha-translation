  yaml_path: translation/ot/leviticus/021/002.yaml
  text: 'except for his close relative who is nearest to him: for his mother[a], for his father, for his son, for his daughter, and for his brother—'
translation:
  language: zh_hans
  text: 惟独为他至近的亲属[a]：为他的母亲、为他的父亲、为他的儿子、为他的女儿、为他的兄弟——
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “至近亲属”所译的希伯来词 שְׁאֵר 字面有“肉身”或“骨肉”之意，在此指亲属；也可译作“血亲”或“近亲”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: 惟独
  rationale: 本短语承接上一节的禁令，引出例外；“惟独”既表达限制性例外，也适合本节作为未完句的结构。
- source_word: שְׁאֵרוֹ
  choice: 他的骨肉亲属
  rationale: שְׁאֵר本义涉及“肉身、骨肉”，并可指亲属；“骨肉亲属”保留其形象和亲属含义，又符合现代汉语。
- source_word: הַקָּרֹב אֵלָיו
  choice: 他最亲近的
  rationale: 该短语限定亲属关系上的接近程度；“最亲近的”自然传达近亲之意，同时没有把范围扩大到一般情感亲密者。
- source_word: לְאִמּוֹ וּלְאָבִיו וְלִבְנוֹ וּלְבִתּוֹ וּלְאָחִיו
  choice: 为他的母亲、为他的父亲、为他的儿子、为他的女儿、为他的兄弟
  rationale: 逐项保留希伯来文反复出现的לְ介词，以清楚表明祭司获准因这些亲属而沾染不洁，并维持法律条文的列举节奏。
theological_decisions:
- issue: 祭司可为哪些死者沾染不洁
  choice: 将名单理解为上一节禁令的明确例外，并保留为各亲属重复的“为”
  alternative: 把本节处理成独立的亲属名单，省略例外关系或各项前的介词
  rationale: כִּי אִם在此引出例外，重复的לְ则标明因谁而可沾染不洁；译文保留这种法律关系，不额外扩展名单。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“惟独……就是……”保留原文承接上一节并引出具体名单的句法；句末破折号表明本句与后文仍相连。
