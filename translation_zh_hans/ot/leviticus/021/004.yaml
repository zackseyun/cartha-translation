  yaml_path: translation/ot/leviticus/021/004.yaml
  text: He shall not defile himself as a husband among his people[a], and so profane himself.
translation:
  language: zh_hans
  text: 他不可身为本族中的丈夫[a]而玷污自己，以致亵渎自己。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他作为本族中有地位的人，不可玷污自己，以致亵渎自己。”本句希伯来语艰深；也有人较概括地理解为，他不可在本族人中玷污自己，以致亵渎自己。
    reason: alternative_reading
lexical_decisions:
- source_word: יִטַּמָּא
  choice: 玷污自己
  rationale: 此处指祭司因接触死者而沾染礼仪上的不洁。“玷污自己”既保留祭司条例的庄重语域，也比单说“成为不洁”更自然。
- source_word: בַּעַל
  choice: 丈夫
  rationale: בַּעַל 可指“丈夫、主人、有地位的人”。在论及至亲丧葬与沾染不洁的上下文中，“丈夫”能体现亲属关系，但原句艰深，其他理解在脚注中保留。
- source_word: בְּעַמָּיו
  choice: 本族人的
  rationale: 字面为“在他的民中”。结合上下文，这里很可能带有本族或亲属群体的意味；译作“本族人的”使其与“丈夫”构成可理解的现代汉语表达。
- source_word: לְהֵחַלּוֹ
  choice: 亵渎自己
  rationale: 该不定式可表达目的或结果，意为祭司因沾染不洁而损害其圣职身份。“亵渎”保留 חלל 在圣洁法规中的术语联系。
theological_decisions:
- issue: בַּעַל בְּעַמָּיו 这一艰深短语的解释
  choice: 理解为祭司不可因妻子之死，以本族人的丈夫身份使自己沾染不洁。
  alternative: 也可理解为“他作为本族中有地位的人，不可玷污自己”；或较概括地理解为“他不可在本族人中玷污自己，以致亵渎自己”。
  rationale: “丈夫”是 בַּעַל 的常见义，也契合前后有关至亲丧葬的规定；但希伯来语句法高度压缩，不能把其他主要解释悄然排除，因此正文采用亲属关系读法，脚注说明歧义。
translation_notes:
  register: 采用现代、庄重而易懂的祭司法规语体。“玷污”与“亵渎”分别体现礼仪不洁和圣俗界限；正文保留原文压缩感，同时用脚注明示真实歧义。
