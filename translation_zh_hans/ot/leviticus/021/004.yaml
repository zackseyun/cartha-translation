  to: 他不可身为本族中的丈夫[a]而玷污自己，以致亵渎自己。
  rationale: 修订移除了原文没有明确表达的因果关系，并补足末句的结果关系。“身为本族中的丈夫”保留英文审校轨迹所采用的主要读法，同时不明说沾染是“为了”哪一位亲属；脚注完整保留主要替代读法。
