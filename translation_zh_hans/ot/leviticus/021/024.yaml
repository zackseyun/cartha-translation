  text: So Moses spoke to Aaron and to his sons and to all the sons of Israel[a].
translation:
  language: zh_hans
  text: 摩西对亚伦、亚伦的儿子们和所有以色列人[a]说。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“以色列的儿子们”；也可译作“以色列的子孙”。这是指以色列全体百姓的固定称谓。
    reason: 说明希伯来语固定称谓的字面形式及可选译法。
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: 于是……说了这些话
  rationale: 该叙事形式承接并收束上文；按中文习惯补出“这些话”，使本节作为本段结语自然完整，并未增添新的言语内容。
- source_word: אֶל
  choice: 对
  rationale: 此处介词标明说话的对象，现代汉语用“对”最自然直接。
- source_word: בָּנָיו
  choice: 亚伦的儿子们
  rationale: 希伯来语为阳性复数并带第三人称阳性单数后缀，具体指亚伦的儿子；重复“亚伦”可避免汉语连续使用领属代词时的歧义。
- source_word: כָּל
  choice: 所有
  rationale: 准确表达该词涵盖整个群体的含义。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 字面为“以色列的众子”，但这是指以色列全体百姓的固定族群称谓；“以色列人”是现代标准汉语中准确、自然且不误限于男性的表达。
theological_decisions:
- issue: 盟约群体称谓 בְּנֵי יִשְׂרָאֵל 的译法
  choice: 以色列人
  alternative: 以色列的众子；以色列的子孙
  rationale: 该短语虽采用阳性复数形式，实际作为固定称谓指整个以色列群体。正文译作“以色列人”保留其群体所指，避免现代读者误以为只包括男性；脚注注明其字面形式和传统译法，以保存原文表达。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“于是”体现承接和总结作用；“说了这些话”符合汉语段落结句习惯。
