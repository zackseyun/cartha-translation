  text: וְ/כָל נֶ֗פֶשׁ אֲשֶׁ֨ר תֹּאכַ֤ל נְבֵלָה֙ וּ/טְרֵפָ֔ה בָּ/אֶזְרָ֖ח וּ/בַ/גֵּ֑ר וְ/כִבֶּ֨ס בְּגָדָ֜י/ו וְ/רָחַ֥ץ בַּ/מַּ֛יִם וְ/טָמֵ֥א עַד הָ/עֶ֖רֶב וְ/טָהֵֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/015.yaml
  text: And every person who eats an animal found dead or one torn by beasts[a], whether native or sojourner, shall wash his clothes and bathe in water, and he shall be unclean until the evening[b]; then he shall be clean.
translation:
  language: zh_hans
  text: 凡吃了自行死去或被野兽撕裂的动物[a]的人，无论是本地人还是寄居者[b]，都要洗衣服，用水洗身；他必不洁净直到傍晚，随后就洁净了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “自行死去的动物”或译“动物尸体”；原文指未经宰杀而死亡的动物。“被野兽撕裂的动物”指被猛兽撕咬、撕裂的动物。
    reason: lexical_alternative
  - marker: b
    text: “寄居者”指住在以色列人中间的外来居民。
    reason: lexical_clarification
lexical_decisions:
- source_word: נֶפֶשׁ
  choice: 人
  rationale: 在这类律法条文中指具体的个人，并非强调非物质的“灵魂”；译作“人”自然准确。
- source_word: נְבֵלָה
  choice: 自然死去的牲畜
  rationale: 指未经合规宰杀而死亡的动物尸体；“自然死去的牲畜”比单说“尸体”更清楚地表达此处的礼仪类别。
- source_word: טְרֵפָה
  choice: 被野兽撕裂的牲畜
  rationale: 该词指被猛兽撕咬致死或撕裂的动物；译文保留其致死原因。
- source_word: אֶזְרָח
  choice: 本地人
  rationale: 指以色列群体中的本土成员；“本地人”简明，也能与“寄居者”形成对应。
- source_word: גֵּר
  choice: 寄居者
  rationale: 指居住在以色列人中间的外来居民，而非短暂停留的陌生人；“寄居者”保留其社会与律法含义。
- source_word: וְכִבֶּס בְּגָדָיו
  choice: 要洗衣服
  rationale: 准确表达恢复礼仪洁净所要求的行动，并采用现代汉语的自然说法。
- source_word: וְרָחַץ בַּמַּיִם
  choice: 用水洗身
  rationale: 此处指身体的洗濯；“用水洗身”清楚表达动作，又不额外规定浸泡方式。
- source_word: וְטָמֵא עַד הָעֶרֶב
  choice: 不洁净到晚上
  rationale: 这里是不洁的礼仪状态，不是泛指道德污秽；该译法与利未记的洁净术语一致。
- source_word: וְטָהֵר
  choice: 之后就洁净了
  rationale: 表示洗濯并经过规定时间后，暂时的不洁状态终止；“之后”自然呈现原文的结果次序。
theological_decisions:
- issue: 利未记洁净律中“不洁净／洁净”的性质
  choice: 使用“不洁净／洁净”，按礼仪身份理解
  alternative: 译作“玷污／洁净”或“污秽／得洁净”
  rationale: 经文描述吃了此类动物之后的礼仪状态及其解除，不宜在译文中额外加入道德罪责的判断。
- issue: וְטָהֵר所表达的时间与结果关系
  choice: 译作“之后就洁净了”
  alternative: 直译为“并且洁净”
  rationale: 原文简洁连接各步骤；汉语加入“之后”能显明在洗濯并等到晚上后的状态转变，却不把未明说的神学机制加入经文。
translation_notes:
  register: 采用现代、庄重而易懂的律法文体。“凡……的人，无论……都……”清楚呈现适用对象与义务；保留“不洁净／洁净”这一利未记核心礼仪术语，避免把它误解为一般卫生状况或道德定罪。
