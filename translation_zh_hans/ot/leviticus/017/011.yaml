  text: כִּ֣י נֶ֣פֶשׁ הַ/בָּשָׂר֮ בַּ/דָּ֣ם הִוא֒ וַ/אֲנִ֞י נְתַתִּ֤י/ו לָ/כֶם֙ עַל הַ/מִּזְבֵּ֔חַ לְ/כַפֵּ֖ר עַל נַפְשֹׁתֵי/כֶ֑ם כִּֽי הַ/דָּ֥ם ה֖וּא בַּ/נֶּ֥פֶשׁ יְכַפֵּֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/011.yaml
  text: For the life of the flesh is in the blood[a], and I have given it to you on the altar to make atonement for your lives[b], for it is the blood that makes atonement by the life.
translation:
  language: zh_hans
  text: 因为肉身的生命在血中[a]；我把这血赐给你们，可以在祭坛上为你们的生命赎罪；因为血是借着生命来赎罪的[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “生命”所译的希伯来词也可按语境译作“性命”“自身”或“灵魂”；本节所指的是与血相联的生命。
    reason: lexical_alternative
  - marker: b
    text: “借着生命来赎罪”也可译作“借着血中的生命赎罪”，或“因为生命在血中而赎罪”。原文十分简练，介词的确切含义存在不同理解。
    reason: alternative_reading
lexical_decisions:
- source_word: נֶפֶשׁ
  choice: 生命
  rationale: 本节把 נֶפֶשׁ 与血紧密相连，所指首先是使肉体存活的生命，而不是与身体相对的非物质“灵魂”；三处均尽量保持这一词义联系。
- source_word: הַבָּשָׂר
  choice: 肉体
  rationale: 指有生命之受造物的血肉之躯；“肉体”既贴近原文，也比“肉”更能表达这里的生命载体。
- source_word: בַּדָּם
  choice: 在血中
  rationale: 保留介词 בְּ 的位置或领域含义，表达肉体的生命与血内在相联。
- source_word: נְתַתִּיו לָכֶם
  choice: 我把血赐给你们
  rationale: 原文代词“它”承接上文的“血”；汉语明确说“血”可避免指代含混。“赐给”体现这是上帝为祭坛礼仪所作的安排。
- source_word: עַל הַמִּזְבֵּחַ
  choice: 献在祭坛上
  rationale: 原文直译为“在祭坛上”；结合“赐给你们……为要赎罪”的祭祀语境，补出“献”使现代汉语自然，但不改变其礼仪场景。
- source_word: לְכַפֵּר עַל נַפְשֹׁתֵיכֶם
  choice: 为你们的生命赎罪
  rationale: “赎罪”是利未记中 כפר 的常用祭祀用语，不限定某一种赎罪理论；“生命”保持 נֶפֶשׁ 在本节中的词义连贯。
- source_word: בַּנֶּפֶשׁ יְכַפֵּר
  choice: 凭着生命赎罪
  rationale: 原文结构简练且有歧义。将 בְּ 理解为凭借或由于，保留血之所以能赎罪与其中生命的关系，同时用脚注列出更明确的解释性译法。
theological_decisions:
- issue: 祭祀律例中 נֶפֶשׁ 的含义
  choice: 全节译为“生命”
  alternative: 灵魂；性命；自身
  rationale: 本节论证血与生命的关联；译作“灵魂”容易引入原文并未明说的身心二分。“生命”最能维持献血赎罪的上下文逻辑。
- issue: 末句 בַּנֶּפֶשׁ 的语法作用
  choice: 译为“凭着生命”，保留较为凝练的表达
  alternative: 因为生命在血中；借着血中的生命
  rationale: 介词 בְּ 可有工具、凭借或关联等含义。正文不把这种紧凑表达完全解释开，脚注则提供较明确但解释性更强的译法。
- issue: 血与赎罪功效之间的陈述
  choice: 保留“血……赎罪”的主语结构
  alternative: 生命使血能够赎罪
  rationale: 原文明确以“血”为末句的强调性主语，同时又以“生命”说明其赎罪作用；译文保留这两者之间的张力，不进一步建构特定的赎罪理论。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“赎罪”“祭坛”保留利未记的祭祀语域；末句刻意维持原文的凝练与一定程度的歧义，并以脚注辅助普通读者。
