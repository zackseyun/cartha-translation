  text: But if he does not wash his clothes and does not bathe his body[b][a], then he shall bear his guilt.
translation:
  language: zh_hans
  text: 但他若不洗衣服，也不洗自己的身体[a]，就要担当自己的罪责[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “身体”直译为“肉”（或“肉身”）；这里指洗自己的身体。
    reason: lexical_alternative
  - marker: b
    text: “担当自己的罪责”也可译作“担当自己的罪孽”或“承担自己罪孽所招致的惩罚”。这个希伯来语法律用语可同时包含罪咎及其后果。
    reason: alternative_reading
lexical_decisions:
- source_word: וְאִם
  choice: 但他若
  rationale: 承接上一节规定的洁净程序，并引出不照办的相反情形；“但……若”自然表达语境中的转折与条件。
- source_word: יְכַבֵּס
  choice: 洗衣服
  rationale: כּבס 的加强词干通常指洗衣物；原文此处省略宾语，但上一节已明确提到衣服，因此在汉语中补出“衣服”以避免含混。
- source_word: וּבְשָׂרוֹ
  choice: 身体
  rationale: בשר 字面为“肉身”，但在礼仪洗濯语境中指人的身体；译作“身体”符合现代汉语习惯，并以脚注保留字面信息。
- source_word: יִרְחָץ
  choice: 洗净
  rationale: רחץ 指用水洗身体；“洗净身体”既区别于前面的洗衣服，也符合本段洁净礼仪的语境。
- source_word: וְנָשָׂא
  choice: 就要担当
  rationale: 此处连接词加完成式表达不履行洁净要求所产生的后果；“就要”体现条件结果关系，“担当”保留法律措辞的庄重感。
- source_word: עֲוֹנוֹ
  choice: 自己的罪责
  rationale: עון 可涵盖罪孽、罪责以及罪所带来的后果；“罪责”在现代汉语中能较好保留罪咎与责任两方面，而不明确限定具体刑罚。
theological_decisions:
- issue: 法律用语“担当他的 עון”的含义
  choice: 译作“担当自己的罪责”，不具体说明刑罚。
  alternative: “担当自己的罪孽”或“承担自己罪孽的惩罚”
  rationale: 希伯来语表达可同时涉及犯罪事实、罪咎及其后果。正文保留这种张力，脚注说明可能含义，避免只解释为道德过错或明确的刑罚。
translation_notes:
  register: 采用现代、庄重而易懂的法律礼仪语体。“洗衣服”补足原文依上下文省略的宾语；“洗净身体”使两项洁净行动清楚并列；脚注标记均置于正文对应词语之后。
