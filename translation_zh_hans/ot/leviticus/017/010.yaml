  text: וְ/אִ֨ישׁ אִ֜ישׁ מִ/בֵּ֣ית יִשְׂרָאֵ֗ל וּ/מִן הַ/גֵּר֙ הַ/גָּ֣ר בְּ/תוֹכָ֔/ם אֲשֶׁ֥ר יֹאכַ֖ל כָּל דָּ֑ם וְ/נָתַתִּ֣י פָנַ֗/י בַּ/נֶּ֨פֶשׁ֙ הָ/אֹכֶ֣לֶת אֶת הַ/דָּ֔ם וְ/הִכְרַתִּ֥י אֹתָ֖/הּ מִ/קֶּ֥רֶב עַמָּֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/010.yaml
  text: And any man from the house of Israel[a], or from the sojourner who sojourns among them, who eats any blood—I will set my face against the person who eats the blood[c][b], and I will cut him off from among his people.
translation:
  language: zh_hans
  text: “以色列家中的任何人，或寄居在他们中间的寄居者[a]，若吃任何血，我必定意与那吃血的人为敌，并把他从他的民中剪除[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “寄居者”指居住在以色列人中间的外来居民；也可译作“外族居民”。
    reason: lexical_alternative
  - marker: b
    text: “剪除”是盟约法律中的惩罚用语；本节没有说明这是指死亡、被逐出群体，还是神所施行的其他审判。
    reason: alternative_reading
lexical_decisions:
- source_word: וְאִישׁ אִישׁ
  choice: 任何人
  rationale: 重叠的 אִישׁ 是法律用语中的周遍表达，意为“任何人”或“无论谁”；现代汉语用“任何人”自然传达其分配和强调作用。
- source_word: מִבֵּית יִשְׂרָאֵל
  choice: 以色列家中
  rationale: 保留“以色列家”这一盟约和群体称谓，同时用“中”自然衔接所属范围。
- source_word: וּמִן הַגֵּר הַגָּר בְּתוֹכָם
  choice: 或寄居在他们中间的寄居者
  rationale: גֵּר 指住在以色列社会中的非本族居民，并非短暂停留的旅客；“寄居……的寄居者”也保留了原文名词与同根分词的呼应。
- source_word: אֲשֶׁר יֹאכַל כָּל דָּם
  choice: 若吃任何血
  rationale: יֹאכַל 是普通的“吃”，כָּל דָּם 表示任何血，强调禁令没有例外。
- source_word: וְנָתַתִּי פָנַי
  choice: 我必……变脸
  rationale: 保留原文“脸”的拟人意象；汉语“向某人变脸”可表达由神亲自敌对、施行审判，而不把习语完全抽象化。
- source_word: בַּנֶּפֶשׁ הָאֹכֶלֶת אֶת הַדָּם
  choice: 向那吃血的人
  rationale: נֶפֶשׁ 在这里指违法的个体，译作“人”比“灵魂”更符合此法律语境，也避免加入原文没有强调的身心二分观念。
- source_word: וְהִכְרַתִּי אֹתָהּ
  choice: 并把他……剪除
  rationale: הִכְרִית 是盟约法律中的惩罚公式。“剪除”保留原文意象和严厉性，同时不擅自断定具体执行方式。
- source_word: מִקֶּרֶב עַמָּהּ
  choice: 从他的民中
  rationale: 直译其“从所属民众当中”的群体关系；代词按汉语自然地回指前面的违法者。
theological_decisions:
- issue: “剪除”这一惩罚公式的具体含义
  choice: 保留“从他的民中剪除”，不说明惩罚的具体方式。
  alternative: 处死、逐出群体，或由神以其他方式除灭。
  rationale: 本节明确宣告严厉的盟约审判，却没有界定其实施机制；保留公式可避免消除原文真实存在的解释张力。
- issue: “变脸”的神学和拟人表达
  choice: 保留“脸”的意象，译作“向……变脸”。
  alternative: 与……为敌、反对……、定意惩罚……。
  rationale: 这些替代译法能说明功能，却会抹去原文 פָנַי 的拟人意象；“变脸”在现代汉语中仍可理解为转而严厉敌对。
translation_notes:
  register: 采用现代、庄重而可理解的法律宣告语体。“以色列家”“变脸”“剪除”保留原文的盟约性称谓和鲜明意象；脚注只解释现代读者可能不熟悉或不可过度确定的表达。
