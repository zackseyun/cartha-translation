id: LEV.17.14
reference: Leviticus 17:14
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כִּֽי נֶ֣פֶשׁ כָּל בָּשָׂ֗ר דָּמ֣/וֹ בְ/נַפְשׁ/וֹ֮ הוּא֒ וָֽ/אֹמַר֙ לִ/בְנֵ֣י יִשְׂרָאֵ֔ל דַּ֥ם כָּל בָּשָׂ֖ר לֹ֣א תֹאכֵ֑לוּ כִּ֣י נֶ֤פֶשׁ כָּל בָּשָׂר֙ דָּמ֣/וֹ הִ֔וא כָּל אֹכְלָ֖י/ו יִכָּרֵֽת־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/014.yaml
  text: For the life of all flesh is its blood[a]; in its life it is. So I said to the sons of Israel, ‘You shall not eat the blood of any flesh[b], for the life of all flesh is its blood.’ Everyone who eats it shall be cut off.
translation:
  language: zh_hans
  text: 因为一切有肉身之物的生命就是它的血；它的血在它的生命中[a]。所以我对以色列人说：‘任何有肉身之物的血，你们都不可吃，因为一切有肉身之物的生命就是它的血。’凡吃血的，必被剪除[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这句希伯来语十分浓缩，也可理解为“它的血与它的生命同在”，或较意译地译作“它的血就是它的生命”。
    reason: 保留 בְנַפְשׁוֹ הוּא 的句法和语义歧义。
  - marker: b
    text: “剪除”没有在这里说明具体方式；可能指从群体中除掉，也可能指死亡或神所施行的审判。
    reason: 避免对盟约制裁公式 יִכָּרֵת 作超出本节的限定。
lexical_decisions:
- source_word: נֶפֶשׁ
  choice: 生命
  rationale: 本节以生物的生命与血的关系作为禁令的根据，并非讨论与身体相分离的“灵魂”；译作“生命”最贴合祭祀和饮食条例的语境。
- source_word: כָּל בָּשָׂר
  choice: 一切有血肉之物
  rationale: 既保留“血肉”这一具体意象，也比直译“一切肉体”更自然，并涵盖上下文所说的各种活物。
- source_word: דָּם / דָּמוֹ
  choice: 血／它的血
  rationale: 血是本节禁令及其理由的核心词，应直接、前后一致地翻译。
- source_word: בְנַפְשׁוֹ הוּא
  choice: 血是在它生命中的
  rationale: 希伯来语表达高度浓缩；此译保留介词“在……中”和独立分句，不把生命与血之间的关系过度解释为单纯等同。
- source_word: וָאֹמַר
  choice: 所以我……说
  rationale: 这里从生命与血的原则转入禁令，“所以”自然体现上下文的推论关系。
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: 对以色列人
  rationale: 这是现代汉语对该群体名称自然、准确的表达；机械直译为“以色列的儿子们”容易误解为仅指男性。
- source_word: לֹא תֹאכֵלוּ
  choice: 你们都不可吃
  rationale: “不可”符合律法禁令的庄重语体；“都”配合“任何”，清楚表达普遍禁止。
- source_word: כָּל אֹכְלָיו
  choice: 凡吃血的
  rationale: 代词所指在语境中是血；明确重复“血”可避免现代汉语中“吃它”的指代含混，并保留逐人适用的意味。
- source_word: יִכָּרֵת
  choice: 必被剪除
  rationale: 保留希伯来语盟约制裁的传统意象和被动形式，不擅自判定具体指处死、逐出群体还是神的审判。
theological_decisions:
- issue: נֶפֶשׁ 与血的关系
  choice: 译作“生命”，并保留“血是在它生命中的”这一压缩而略带张力的陈述。
  alternative: 译作“灵魂”，或直接顺译为“血就是生命”。
  rationale: 经文论证的是活物的生命与血之间的关系，而非建立灵魂论；原文介词结构也不宜只用明确的等同句完全消解。
- issue: יִכָּרֵת 所指的制裁方式
  choice: 译作“必被剪除”，不在正文中具体说明执行方式。
  alternative: 译作“必被处死”“必被逐出群体”或“必被除名”。
  rationale: 这个希伯来语惯用语在不同语境中可能涉及多种盟约性审判；本节本身没有明确其机制，译文应保留这一开放性。
translation_notes:
  register: 采用现代、庄重而易懂的律法语体。“一切有血肉之物”保留原文反复出现的 בשר 意象；引语使用“不可”体现正式禁令。首句有意保留原文的浓缩和重复，并用脚注说明可能理解。
