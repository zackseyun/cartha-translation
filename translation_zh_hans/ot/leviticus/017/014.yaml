  rationale: 修订仅处理两个安全且必要的表达问题：以“有肉身之物”更贴近 כָּל־בָּשָׂר，避免在该词中预先加入“血”；并把第二分句改为自然的汉语语序，仍保留“血在生命中”的原文张力。其余译文及两个脚注均忠实、得体，无须改动。
