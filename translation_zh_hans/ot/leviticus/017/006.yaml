source:
  edition: WLC
  text: וְ/זָרַ֨ק הַ/כֹּהֵ֤ן אֶת הַ/דָּם֙ עַל מִזְבַּ֣ח יְהוָ֔ה פֶּ֖תַח אֹ֣הֶל מוֹעֵ֑ד וְ/הִקְטִ֣יר הַ/חֵ֔לֶב לְ/רֵ֥יחַ נִיחֹ֖חַ לַ/יהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/006.yaml
  text: And the priest shall throw the blood against the altar of Yahweh at the entrance of the tent of meeting[b][a], and shall burn the fat as a pleasing aroma to Yahweh.
translation:
  language: zh_hans
  text: 祭司要在会幕门口、耶和华的祭坛上泼洒血[a]，又要焚烧脂肪，作为献给耶和华、蒙悦纳的馨香[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “泼洒”也可译作“洒”或“泼在”；原文动词指祭司按礼仪把血施到祭坛上，动作比轻轻喷洒更有力度。
    reason: lexical_alternative
  - marker: b
    text: 原文为固定的献祭用语，直译可作“怡人的香气”；也常译作“悦纳的馨香”。这里表示祭物蒙耶和华悦纳。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזָרַק
  choice: 要把……泼洒
  rationale: 在献祭语境中，זָרַק指祭司将血有力地泼、洒到祭坛上的礼仪动作；“泼洒”既保留动作力度，也比单用“洒”更不易让人误解为轻微喷洒。
- source_word: הַכֹּהֵן
  choice: 祭司
  rationale: כֹּהֵן的标准现代汉语译法；希伯来语定冠词无需机械对应。
- source_word: הַדָּם
  choice: 血
  rationale: 直接、自然地表达祭牲的血。
- source_word: עַל מִזְבַּח יְהוָה
  choice: 在……耶和华的祭坛上
  rationale: עַל与זָרַק连用，表示血被施到祭坛上；汉语用“泼洒在……上”自然，并由“泼洒”体现动作力度。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经传统中对四字神名最通行、最易识别的音译，保留其作为专名的性质。
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: 会幕门口
  rationale: “会幕”是אֹהֶל מוֹעֵד在中文圣经语境中简洁而通行的译法；“门口”准确表达פֶּתַח的地点含义。
- source_word: וְהִקְטִיר
  choice: 又要焚烧
  rationale: 在祭司礼仪语境中指把祭物烧在坛上，使其化为烟；“焚烧”比一般的“烧”更庄重，也符合献祭语域。
- source_word: הַחֵלֶב
  choice: 脂肪
  rationale: 指献祭时归坛焚烧的特定肥脂部分；“脂肪”是现代读者清楚易懂的直译。
- source_word: לְרֵיחַ נִיחֹחַ
  choice: 作为蒙悦纳的馨香
  rationale: 该固定献祭用语表达香气为神所接纳、喜悦；“蒙悦纳的馨香”保留接受意涵和庄重语体，而不把短语缩减为单纯气味描写。
- source_word: לַיהוָה
  choice: 献给耶和华
  rationale: 介词לְ表示祭物和香气所指向的对象；汉语补出“献给”能自然呈现献祭关系。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用四字神名而非普通称号。译作“耶和华”保留专名，并符合现代中文读者最广泛熟悉的圣经用法；“雅威”是更接近现代学界重构读音的可行替代。
- issue: רֵיחַ נִיחֹחַ所表达的是气味性质还是神的接纳
  choice: 蒙悦纳的馨香
  alternative: 怡人的香气
  rationale: 该祭祀套语不宜被理解为神仅仅享受气味；“蒙悦纳”保留祭物被神接纳的关系性含义，同时没有进一步规定接纳的机制。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“会幕”“祭坛”“馨香”等保留熟悉的圣经礼仪词汇，同时以“泼洒”“脂肪”“蒙悦纳”等清楚表达原文动作和献祭含义。脚注标记均置于相关短语之后。
