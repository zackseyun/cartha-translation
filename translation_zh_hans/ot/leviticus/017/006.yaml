  terminology: “祭司”“会幕”“耶和华”“祭坛”“馨香”均一致且适切。“安抚的香气”不宜作为脚注直译：该固定献祭短语并不要求汉语表达神被“安抚”的意思，易引入不必要的解释性联想；宜以“怡人的香气”等较中性的措辞说明。
