revisions:
- from: 祭司要把血泼洒在会幕门口耶和华的祭坛上[a]，又要焚烧脂肪，献给耶和华，作为蒙悦纳的馨香[b]。
  to: 祭司要在会幕门口、耶和华的祭坛上泼洒血[a]，又要焚烧脂肪，作为献给耶和华、蒙悦纳的馨香[b]。
  rationale: 修订只澄清原文地点短语的句法关系，并使“焚烧脂肪……归给耶和华”的汉语表达更紧凑。脚注b删去可能带来额外神学联想的“安抚”，以中性且符合该献祭套语的说明取代；不改变经文所保留的礼仪性表达。
