source:
  edition: WLC
  text: לְמַעַן֩ אֲשֶׁ֨ר יָבִ֜יאוּ בְּנֵ֣י יִשְׂרָאֵ֗ל אֶֽת זִבְחֵי/הֶם֮ אֲשֶׁ֣ר הֵ֣ם זֹבְחִים֮ עַל פְּנֵ֣י הַ/שָּׂדֶה֒ וֶֽ/הֱבִיאֻ֣/ם לַֽ/יהוָ֗ה אֶל פֶּ֛תַח אֹ֥הֶל מוֹעֵ֖ד אֶל הַ/כֹּהֵ֑ן וְ/זָ֨בְח֜וּ זִבְחֵ֧י שְׁלָמִ֛ים לַֽ/יהוָ֖ה אוֹתָֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/005.yaml
  text: so that the sons of Israel may bring their sacrifices that they are sacrificing in the open field[a], and bring them to Yahweh at the entrance of the tent of meeting, to the priest[b], and sacrifice them as peace offerings to Yahweh.
translation:
  language: zh_hans
  text: 为要叫以色列人把他们在野外宰献的祭牲带到会幕门口，在耶和华面前交给祭司，并作为平安祭献给耶和华。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “平安祭”也可译作“团契祭”或“福祉祭”；原词含有平安、完整和福祉的意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן אֲשֶׁר
  choice: 为要使
  rationale: 引出承接上一节规定的目的，既保留目的意味，也符合现代汉语表达。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 此处指以色列共同体；现代汉语用“以色列人”自然清楚，也不误导为仅限某些人的亲生儿子。
- source_word: זִבְחֵיהֶם אֲשֶׁר הֵם זֹבְחִים
  choice: 他们……宰献的祭牲
  rationale: זבח兼有宰杀与献祭意味；“宰献”保留二者的结合，“祭牲”也与后文把它们献为平安祭相符。
- source_word: עַל פְּנֵי הַשָּׂדֶה
  choice: 在野外
  rationale: 这是自然的现代汉语，对应在田野或旷野开放地带进行的行为，不机械直译为“田野表面”。
- source_word: לַיהוָה
  choice: 耶和华面前／给耶和华
  rationale: 按汉语圣经传统以“耶和华”呈现四字神名；前一处结合地点结构译作“耶和华面前”，后一处按受献对象译作“给耶和华”。
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: 会幕门口
  rationale: “会幕”是简洁而通行的 אֹהֶל מוֹעֵד 译法，“门口”准确表达入口处。
- source_word: אֶל הַכֹּהֵן
  choice: 交给祭司
  rationale: 保留定冠所指的主持祭司；“交给”使两个连续的 אֶל 目标关系在汉语中清楚自然。
- source_word: זִבְחֵי שְׁלָמִים
  choice: 平安祭
  rationale: 这是该特定祭类在汉语中的通行名称，同时保留 שׁלם 所关联的平安、完满含义。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文明确使用四字神名。正文采用现代中文读者最熟悉且能作为专名识别的“耶和华”，不以“主”替代而遮蔽其专名性质。
- issue: זִבְחֵי שְׁלָמִים 的祭类含义
  choice: 平安祭
  alternative: 团契祭／福祉祭
  rationale: “平安祭”保留传统祭类名称，不把其神学功能单一限定为团契或福祉；脚注提示其语义范围。
- issue: בְּנֵי יִשְׂרָאֵל 的群体所指
  choice: 以色列人
  alternative: 以色列的众子
  rationale: 该表达在律法语境中指全体以色列共同体。译为“以色列人”保留群体所指，避免现代中文将其误解为只包括男性后裔。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“宰献”有意保留原文 זבח 所兼具的宰杀与献祭意味；句子维持原文目的从句及连续动作的结构，但以逗号调整为易读的中文节奏。
