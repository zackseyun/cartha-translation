base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/003.yaml
  text: Any man from the house of Israel who slaughters an ox or a sheep or a goat in the camp[a], or who slaughters it outside the camp—
translation:
  language: zh_hans
  text: “以色列家中任何人[a]，若在营内宰杀牛、绵羊或山羊，或在营外宰杀——”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“人、人”，是分配性的惯用说法，意思是“任何一人”；此处泛指以色列群体中的任何成员。
    reason: 说明希伯来文叠词的形式及其普遍适用的含义。
lexical_decisions:
- source_word: אִישׁ אִישׁ
  choice: 无论谁
  rationale: 叠用的“人、人”是分配性惯用语，表示群体中的任何一人。译为“无论谁”既保留普遍适用的法律语气，也符合现代汉语表达。
- source_word: מִבֵּית יִשְׂרָאֵל
  choice: 以色列家中
  rationale: 直译为“从以色列家”。保留“以色列家”这一盟约民族称谓，并用“中”自然表达成员范围。
- source_word: יִשְׁחַט
  choice: 宰杀
  rationale: שׁחט特指宰杀动物，在献祭语境中尤为常见；“宰杀”比泛指的“杀”更准确。
- source_word: שׁוֹר
  choice: 牛
  rationale: 该词在此指可供宰杀的牛类个体，并未限定为公牛或阉牛；汉语“牛”能保留其类别宽度。
- source_word: כֶשֶׂב
  choice: 绵羊
  rationale: 该词泛指绵羊，并不必然是幼羊；译作“绵羊”也可与下文的“山羊”清楚区分。
- source_word: עֵז
  choice: 山羊
  rationale: 标准动物名称；与“绵羊”并列时，“山羊”比单说“羊”更清楚。
- source_word: בַּמַּחֲנֶה
  choice: 在营内
  rationale: 准确表达营地范围之内，且与后面的“在营外”形成简洁、对称的结构。
- source_word: מִחוּץ לַמַּחֲנֶה
  choice: 在营外
  rationale: 表达宰杀行为发生在营地以外；现代汉语简明自然。
- source_word: אֲשֶׁר ... אֲשֶׁר
  choice: 若……或……
  rationale: 希伯来文两个关系从句构成并列条件。汉语用“若……或……”保留法律条文的条件结构，无须机械重复关系代词。
- source_word: '[implicit object after second יִשְׁחַט]'
  choice: 宰杀
  rationale: 第二次出现的动词未重述宾语，宾语可由前面的牛、绵羊或山羊自然承接；汉语中省略“它”更流畅，也不产生歧义。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的法律条文语体。“以色列家”保留原文的盟约民族称谓；“营内／营外”构成清晰对举。句末用破折号表示本节语法和法令内容在下一节继续。
