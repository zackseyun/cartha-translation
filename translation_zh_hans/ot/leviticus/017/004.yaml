source:
  edition: WLC
  text: וְ/אֶל פֶּ֜תַח אֹ֣הֶל מוֹעֵד֮ לֹ֣א הֱבִיא/וֹ֒ לְ/הַקְרִ֤יב קָרְבָּן֙ לַֽ/יהוָ֔ה לִ/פְנֵ֖י מִשְׁכַּ֣ן יְהוָ֑ה דָּ֣ם יֵחָשֵׁ֞ב לָ/אִ֤ישׁ הַ/הוּא֙ דָּ֣ם שָׁפָ֔ךְ וְ/נִכְרַ֛ת הָ/אִ֥ישׁ הַ/ה֖וּא מִ/קֶּ֥רֶב עַמּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/004.yaml
  text: 'and has not brought it to the entrance of the tent of meeting to present it as an offering to Yahweh before the tabernacle of Yahweh[a], blood shall be imputed to that man: he has shed blood[c][b], and that man shall be cut off from among his people.'
translation:
  language: zh_hans
  text: 却没有把它带到会幕门口，在耶和华的帐幕前献给耶和华作供物，那么流血之罪就要归到那人身上[a]；他流了血。那人必从他的族人中被剪除[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译：“血要算在那人身上。”意思是那人须承担流血的罪责。
    reason: lexical_alternative
  - marker: b
    text: “被剪除”在这里没有明确说明是指死亡、逐出群体，还是其他形式的盟约性除名。
    reason: cultural_note
lexical_decisions:
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: 会幕门口
  rationale: 这是该圣所称谓在现代汉语圣经语体中的自然表达；“门口”准确传达 פֶּתַח 的入口之意。
- source_word: הֱבִיאוֹ
  choice: 把它带到
  rationale: 使役词形表示“带来”；“它”回指上一节所宰杀的牲畜。
- source_word: לְהַקְרִיב קָרְבָּן
  choice: 献……作供物
  rationale: הקריב 在献祭语境中指献上或呈献，קָרְבָּן 指供物；此译避免生硬重复，同时保留祭祀含义。
- source_word: לַיהוָה
  choice: 给耶和华
  rationale: 直接音译神名 יהוה 为“耶和华”，与原文专名相对应。
- source_word: לִפְנֵי מִשְׁכַּן יְהוָה
  choice: 在耶和华的帐幕前
  rationale: מִשְׁכָּן 本义为居所，在此指圣所帐幕；לִפְנֵי 表示空间上的“在……前”。
- source_word: דָּם יֵחָשֵׁב לָאִישׁ הַהוּא
  choice: 流血之罪就要归到那人身上
  rationale: 原文直译为“血要算在那人身上”，在法律语境中表示他须承担流血的罪责；此译保留“归算”的司法含义并使现代读者易懂。
- source_word: דָּם שָׁפָךְ
  choice: 他流了血
  rationale: 紧贴希伯来语的固定表达，并与前句的法律判定形成呼应。
- source_word: וְנִכְרַת
  choice: 必……被剪除
  rationale: 保留 כרת 被动式的传统、形象化法律用语，不擅自确定是处死、驱逐还是其他盟约性除名方式。
- source_word: מִקֶּרֶב עַמּוֹ
  choice: 从他的族人中
  rationale: 自然传达“从其人民当中”的群体归属与排除含义。
theological_decisions:
- issue: דָּם יֵחָשֵׁב 的法律含义
  choice: 流血之罪就要归到那人身上
  alternative: 血要算在那人身上
  rationale: 上下文宣告未经许可宰杀所产生的流血罪责。“流血之罪”明确司法含义，而脚注保存原文较为直译的措辞。
- issue: “被剪除”所指的处罚方式
  choice: 必从他的族人中被剪除
  alternative: 必被处死；必被逐出
  rationale: 本节没有说明执行方式，因此不把它限定为死刑、驱逐或某种特定的宗教处分。
translation_notes:
  register: 采用现代、庄重而易懂的法律—礼仪语体。“会幕”“供物”“耶和华”“被剪除”等用语延续常见圣经词汇；以分号和短句呈现原文判词的递进力度。
