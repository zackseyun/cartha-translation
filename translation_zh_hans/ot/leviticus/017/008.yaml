base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/008.yaml
  text: 'And you shall say to them: Any man from the house of Israel[a], or from the sojourner who sojourns among them[b], who offers up a burnt offering or a sacrifice—'
translation:
  language: zh_hans
  text: 你要对他们说：以色列家中的任何一个男子[a]，或在他们中间寄居的外族人[b]，若献上燔祭或祭牲——
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语直译为“男子、男子”，是法律用语中的分配式表达，意思是逐一包括每个具体个案。
    reason: lexical_alternative
  - marker: b
    text: “寄居的外族人”也可译作“寄居者”，指住在以色列人中间的非以色列人。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲלֵהֶם תֹּאמַר
  choice: 你要对他们说
  rationale: 保留连接语气和对摩西的指示功能；现代汉语用“要……说”自然表达律法语体中的命令。
- source_word: אִישׁ אִישׁ
  choice: 任何一个男子
  rationale: 希伯来语重复“男子”构成逐一分配的法律习语；“任何一个”传达其涵盖每一具体个案的作用，同时保留原文阳性表达。
- source_word: מִבֵּית יִשְׂרָאֵל
  choice: 以色列家中的
  rationale: 保留“以色列家”这一群体及盟约性称谓，并以“中的”自然表达成员所属关系。
- source_word: וּמִן הַגֵּר אֲשֶׁר יָגוּר בְּתוֹכָם
  choice: 或在他们中间寄居的外族人
  rationale: גֵּר指居住在以色列群体中的非以色列人；“寄居的外族人”既保留寄居身份，也明确其非本族背景。“或”按上下文表达两类对象的并列选择。
- source_word: אֲשֶׁר יַעֲלֶה
  choice: 若献上
  rationale: עלה的使役形在祭祀语境中表示把祭物献上；条件式“若”符合本句法律条款的汉语结构。
- source_word: עֹלָה
  choice: 燔祭
  rationale: 这是全部焚烧献上的祭，采用现代中文圣经及宗教语境中明确而稳定的术语“燔祭”。
- source_word: אוֹ זָבַח
  choice: 或别的祭牲
  rationale: 此处זָבַח作名词，指宰杀献上的祭物，与燔祭并列。“别的祭牲”在汉语中清楚显示它是燔祭以外的宰献祭物，同时避免误读为泛指献祭行为。
theological_decisions:
- issue: אִישׁ אִישׁ的阳性分配表达
  choice: 任何一个男子
  alternative: 任何人；无论谁
  rationale: 原文以阳性单数名词重复，作为法律语体中的分配式表达。正文保留其阳性形式，并用脚注说明这一结构强调逐一个案，避免把它误解成只是在重复用词。
- issue: גֵּר所指的群体身份
  choice: 寄居的外族人
  alternative: 寄居者；侨居者；陌生人
  rationale: 该词在此指住在以色列人中、受其祭祀法规约束的非以色列人。“寄居的外族人”保留法律与群体身份含义，又不套用现代移民制度术语。
- issue: זָבַח在燔祭之后的含义
  choice: 别的祭牲
  alternative: 祭物；宰献祭
  rationale: 原文在此以名词形式与“燔祭”并列，可泛指经宰杀献上的祭牲。译文不进一步限定为某一种祭，以保留原文的广度。
translation_notes:
  register: 采用现代、庄重而易懂的律法语体。“以色列家”“燔祭”保留必要的经文术语；句末破折号反映原句在本节末尚未完结，内容延续至下一节。
