base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/001.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: zh_hans
  text: 耶和华[a]对摩西说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文为“YHWH”（יהוה）；传统上常以“主”代替（英语传统作“the LORD”）。
    reason: 说明正文神名所对应的希伯来文形式及传统替代译法。
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: 说
  rationale: 该词的连续式在此引入新的叙事性言说事件；汉语“对……说”自然、准确，也无需与后面的 לֵאמֹר 重复译为两个“说”。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 这是四字神名 יהוה；“耶和华”是现代汉语圣经语境中通行且可辨识的专名形式，脚注同时交代希伯来文形式及传统替代译法。
- source_word: אֶל
  choice: 对
  rationale: 在言说动词后标明说话对象，现代汉语自然表达为“对摩西说”。
- source_word: מֹשֶׁה
  choice: 摩西
  rationale: 采用该人名在现代汉语中的标准译名。
- source_word: לֵאמֹר
  choice: ：
  rationale: 该不定式用于引出随后话语的内容；现代汉语以冒号自然实现这一篇章功能，避免生硬地重复“说”。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威；上主
  rationale: 原文直接使用四字神名。正文采用汉语读者最熟悉的专名“耶和华”，不以称号无声取代神名；脚注说明原文形式与传统译法，以保留文本信息。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。“耶和华对摩西说”保留原文公式化的神谕引言；以冒号承接下一节的话语内容。
