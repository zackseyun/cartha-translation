  text: וְ/אִ֨ישׁ אִ֜ישׁ מִ/בְּנֵ֣י יִשְׂרָאֵ֗ל וּ/מִן הַ/גֵּר֙ הַ/גָּ֣ר בְּ/תוֹכָ֔/ם אֲשֶׁ֨ר יָצ֜וּד צֵ֥יד חַיָּ֛ה אוֹ ע֖וֹף אֲשֶׁ֣ר יֵאָכֵ֑ל וְ/שָׁפַךְ֙ אֶת דָּמ֔/וֹ וְ/כִסָּ֖/הוּ בֶּ/עָפָֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/013.yaml
  text: And any man from the sons of Israel[a], or from the sojourner who sojourns among them, who hunts game—whether wild animal or bird—that may be eaten[b], shall pour out its blood and cover it with earth.
translation:
  language: zh_hans
  text: “凡以色列人或寄居在他们中间的外侨，若猎取可供食用的野兽或飞鸟，就要倒出它的血，并用土把血掩盖。[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “把血掩盖”：原文的代词最自然地指前面所说的血；“土”也可译为“尘土”。
    reason: 说明原文代词的所指及עפר的词义范围。
lexical_decisions:
- source_word: אִישׁ אִישׁ
  choice: 无论谁
  rationale: 重复的“人”表达逐一、周遍的分配意义；汉语用“无论谁”自然传达“任何人”，且不必机械重复。
- source_word: מִבְּנֵי יִשְׂרָאֵל
  choice: 以色列人中
  rationale: בני ישראל是以色列共同体的惯用称呼；现代汉语译作“以色列人”清楚自然，也保留群体身份。
- source_word: הַגֵּר הַגָּר בְּתוֹכָם
  choice: 寄居在他们中间的外侨中
  rationale: גר指住在以色列群体内、但并非以色列人的寄居者。“外侨”凸显其外来居民的法律身份，“寄居”则反映同根动词。
- source_word: יָצוּד צֵיד
  choice: 猎得
  rationale: 希伯来文以同根动词和名词构成强调性的狩猎表达；“猎得”简洁地兼顾狩猎行为及所得猎物。
- source_word: חַיָּה אוֹ עוֹף
  choice: 野兽或飞鸟
  rationale: 狩猎语境表明חיה在此指野生动物；עוף包括有翼飞禽，“飞鸟”在现代中文中自然明白。
- source_word: אֲשֶׁר יֵאָכֵל
  choice: 可吃的
  rationale: 被动式在此表达适合作食物或获准食用；“可吃的”保留许可与适食之间的语义空间。
- source_word: וְשָׁפַךְ אֶת־דָּמוֹ
  choice: 都要放出它的血
  rationale: 法律语境中的连续完成式具有命令效力；“要”表达规定，“放出血”比可能泛指杀害的“流血”更准确地描述处理猎物血液的动作。
- source_word: וְכִסָּהוּ בֶּעָפָר
  choice: 用土掩盖
  rationale: 宾语代词最自然地回指刚提到的血；עפר在此为尘土、松土，“用土掩盖”是自然而具体的中文表达。
theological_decisions:
- issue: וְכִסָּהוּ中宾语代词的所指
  choice: 理解为掩盖血
  alternative: 理解为掩盖或埋葬猎物
  rationale: 最近且最自然的先行词是“它的血”，也与本章处理血的主题相符；脚注说明所指，以免中文省略宾语后变得不明。
- issue: אֲשֶׁר יֵאָכֵל的许可意味
  choice: 译为“可吃的”
  alternative: 译为“被吃的”或“能吃的”
  rationale: 上下文涉及律法所准许的食物，但原文也可从适合食用的角度理解；“可吃的”保留这种张力，不进一步列举洁净条例。
translation_notes:
  register: 采用现代、庄重而易懂的法律叙述语体。“外侨”用于清楚表达住在群体中的非以色列居民这一身份；句式以“无论谁……都要……”自然呈现原文的周遍条件与命令关系。
