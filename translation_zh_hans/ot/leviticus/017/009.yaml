id: LEV.17.9
reference: Leviticus 17:9
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/אֶל פֶּ֜תַח אֹ֤הֶל מוֹעֵד֙ לֹ֣א יְבִיאֶ֔/נּוּ לַ/עֲשׂ֥וֹת אֹת֖/וֹ לַ/יהוָ֑ה וְ/נִכְרַ֛ת הָ/אִ֥ישׁ הַ/ה֖וּא מֵ/עַמָּֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/009.yaml
  text: and does not bring it to the entrance of the tent of meeting to offer it to Yahweh[b][a], that man shall be cut off from his people.
translation:
  language: zh_hans
  text: 却不把它带到会幕门口，献给耶和华[a]，那人必从他的族人中被剪除[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译可作“为耶和华做成它”；这里的希伯来语习用表达是指办理献祭、把祭物献上。
    reason: lexical_alternative
  - marker: b
    text: “被剪除”是法律套语，本节没有说明刑罚的具体方式；可能指从盟约共同体中除去，也可能指上帝直接施行审判。
    reason: alternative_reading
lexical_decisions:
- source_word: פֶּתַח
  choice: 门口
  rationale: 指入口或门道；在会幕语境中，“门口”自然、清楚，也符合现代汉语宗教文本的庄重语体。
- source_word: אֹהֶל מוֹעֵד
  choice: 会幕
  rationale: 这是该圣所名称在现代中文圣经传统中最通行且简洁的译法；虽未逐字呈现“相会之帐幕”，却准确指向旷野时期的帐幕圣所。
- source_word: יְבִיאֶנּוּ
  choice: 把它带到
  rationale: 宾语后缀回指上下文中的祭牲；“把它带到”保留具体动作，不预先将其解释成礼仪性的“呈献”。
- source_word: לַעֲשׂוֹת אֹתוֹ לַיהוָה
  choice: 献给耶和华
  rationale: 直译近于“为耶和华做成它”，但献祭语境中的 עשה 可指办理或献上祭物；正文采用自然明确的礼仪表达，脚注保留字面形式。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文读者熟悉的神圣名字译法，保留专名性质，不以“主”这一称号替代。
- source_word: וְנִכְרַת
  choice: 必……被剪除
  rationale: 保留希伯来法律套语“剪除”的形象和未确定性，不擅自限定为处死、逐出或某一种神圣审判。
- source_word: הָאִישׁ הַהוּא
  choice: 那人
  rationale: 准确反映带指示成分的阳性单数法律表达，同时是自然简洁的现代汉语。
- source_word: מֵעַמָּיו
  choice: 从他的族人中
  rationale: מֵעַמָּיו 为复数形式，通常指此人所属的族群或共同体；“族人”比笼统的“人民”更符合此处关系性语境。
theological_decisions:
- issue: “被剪除”的刑罚具体指什么
  choice: 保留“必从他的族人中被剪除”这一法律套语，不说明执行方式。
  alternative: 译作“必被处死”或“必从会众中驱逐出去”。
  rationale: 本节没有明确界定该刑罚是死亡、逐出共同体、绝后，还是上帝直接施行的审判；保留套语可保存原文的法律与神学张力。
- issue: הָאִישׁ הַהוּא 的性别表达
  choice: 译为“那人”。
  alternative: 译为“那个人”或“这样的人”。
  rationale: “那人”既贴近阳性单数原文，也符合汉语法律式叙述；无需额外扩大或缩小其适用范围。
- issue: 神名 יְהוָה 的呈现
  choice: 译为“耶和华”。
  alternative: 译为“雅威”或以“主”替代。
  rationale: “耶和华”是现代中文圣经传统中广为识别的专名形式，能在普通读者可懂性与神名的专名性质之间取得平衡。
translation_notes:
  register: 采用现代、庄重而易懂的法律—礼仪语体。“却不”承接前文条件结构；“会幕门口”沿用通行中文术语；脚注分别说明献祭习语和“剪除”刑罚的刻意未定性。
