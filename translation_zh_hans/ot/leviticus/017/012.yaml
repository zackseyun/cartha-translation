  text: עַל כֵּ֤ן אָמַ֨רְתִּי֙ לִ/בְנֵ֣י יִשְׂרָאֵ֔ל כָּל נֶ֥פֶשׁ מִ/כֶּ֖ם לֹא תֹ֣אכַל דָּ֑ם וְ/הַ/גֵּ֛ר הַ/גָּ֥ר בְּ/תוֹכְ/כֶ֖ם לֹא יֹ֥אכַל דָּֽם־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/012.yaml
  text: Therefore I said to the sons of Israel[a], ‘No person among you shall eat blood[b], and the sojourner who sojourns among you shall not eat blood.’
translation:
  language: zh_hans
  text: 因此，我对以色列子孙[a]说：“你们中任何人都不可吃血；寄居在你们中间的外来居民[b]也不可吃血。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语直译为“以色列的众子”；也可译作“以色列人”或“以色列的后裔”。
    reason: lexical_alternative
  - marker: b
    text: “外来居民”对应的希伯来语词指居住在以色列人中间、遵守其共同体法规的非以色列人；也可译作“寄居者”或“外侨”。
    reason: cultural_note
lexical_decisions:
- source_word: עַל כֵּן
  choice: 因此
  rationale: 承接上文关于生命在血中的理由，清楚保留结论性的推论关系。
- source_word: אָמַרְתִּי
  choice: 我……说
  rationale: 采用一般过去叙述所需的自然汉语表达，不将基本动词“说”强化为“吩咐”。
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: 对以色列子孙
  rationale: 保留希伯来语“以色列的众子”这一传统族群称谓；“子孙”在现代汉语中可自然指整个以色列后裔群体，并避免误解为仅限男性儿子。
- source_word: כָּל נֶפֶשׁ מִכֶּם
  choice: 你们中任何人都
  rationale: נֶפֶשׁ在这里指个体之人；结合否定词译为“任何人都不可”，准确传达逐一适用的禁令，比直译“灵魂”自然。
- source_word: לֹא תֹאכַל דָּם
  choice: 都不可吃血
  rationale: “不可”符合汉语律法禁令的庄重语体；“吃血”直接保留原文措辞。
- source_word: הַגֵּר
  choice: 寄居者
  rationale: 指住在以色列群体中、受其共同体规范约束的非本族居民；“寄居者”比泛称“外国人”更能体现其居留身份。
- source_word: הַגָּר בְּתוֹכְכֶם
  choice: 在你们中间寄居的寄居者
  rationale: 保留原文名词גֵּר与同词根分词גָּר之间的呼应，同时明确其生活在以色列群体之中。
- source_word: לֹא יֹאכַל דָּם
  choice: 也不可吃血
  rationale: “也”自然表明同一禁令同样适用于寄居者，并保留重复禁令的法律效力。
theological_decisions:
- issue: לִבְנֵי יִשְׂרָאֵל的性别形式与群体所指
  choice: 以色列子孙
  alternative: 以色列人／以色列的众子
  rationale: “子孙”既保留原文以父系祖先之名指称后裔的表达，也按汉语惯用法涵盖整个群体，不额外主张禁令只适用于男性。
- issue: גֵּר所指群体的身份
  choice: 寄居者
  alternative: 外来居民／外侨／外国人
  rationale: 该词在此指居住于以色列中间的非本族居民，而非泛指所有国外之人；译文不把其法律或盟约地位解释得超过本节所言。
translation_notes:
  register: 采用现代、庄重而易懂的律法语体。“不可”体现禁令语气；分号保持两个适用对象之间的平行结构。引号内用全角中文标点。
