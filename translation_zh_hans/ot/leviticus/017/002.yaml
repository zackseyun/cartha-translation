  text: דַּבֵּ֨ר אֶֽל אַהֲרֹ֜ן וְ/אֶל בָּנָ֗י/ו וְ/אֶל֙ כָּל בְּנֵ֣י יִשְׂרָאֵ֔ל וְ/אָמַרְתָּ֖ אֲלֵי/הֶ֑ם זֶ֣ה הַ/דָּבָ֔ר אֲשֶׁר צִוָּ֥ה יְהוָ֖ה לֵ/אמֹֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/002.yaml
  text: Speak to Aaron and to his sons and to all the sons of Israel[a], and say to them, ‘This is the thing that Yahweh has commanded[b], saying,’
translation:
  language: zh_hans
  text: 你要向亚伦、他的儿子和所有以色列人[a]宣告，并对他们说：‘这是雅威所吩咐的事[b]：’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“以色列的众子”；这是指全体以色列人的惯用称谓。
    reason: lexical_alternative
  - marker: b
    text: “事”也可译作“话”或“事项”。
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר
  choice: 讲话
  rationale: 该词是皮埃勒词干第二人称阳性单数命令式，直接命令摩西发言；“讲话”保留了正式的言说命令，也与后面的“对他们说”有所区分。
- source_word: בָּנָיו
  choice: 他的儿子
  rationale: 原文是明确的阳性复数并带第三人称阳性单数后缀，指亚伦的儿子；译作“儿子”准确保留其性别与祭司家族语境。
- source_word: כָּל בְּנֵי יִשְׂרָאֵל
  choice: 所有以色列人
  rationale: 该短语字面为“以色列的众子”，但在这里是指以色列全体的惯用族群称谓；“所有以色列人”在现代汉语中自然清楚，并由脚注保留字面表达。
- source_word: וְאָמַרְתָּ אֲלֵהֶם
  choice: 对他们说
  rationale: 保留接续命令及其明确受话对象，同时使汉语句式顺畅。
- source_word: זֶה הַדָּבָר
  choice: 这是……的事
  rationale: דָּבָר可指“话、事情、事项”；此处引出接下来具体颁布的命令，译作“事”自然且不排除其言语宣告性质，其他可能译法列入脚注。
- source_word: צִוָּה
  choice: 所吩咐的
  rationale: 完成式在该公式中指已经颁下、随即将陈述的命令；汉语“所吩咐的”简洁表达这一关系。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以音译呈现四字神名，保留其作为专名的功能，而不以称号替代。
- source_word: לֵאמֹר
  choice: 冒号引出直接内容
  rationale: 该不定式引出命令的具体内容；现代汉语以冒号连接下文，比机械重复“说”更自然，同时保留其篇章功能。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华／主
  rationale: 原文直接使用上帝的专名；“雅威”按其通常学术重构音译，不将专名改成称号，也不武断采用另一传统音译。
- issue: בְּנֵי יִשְׂרָאֵל 是按字面亲属表达还是按族群称谓翻译
  choice: 所有以色列人
  alternative: 以色列的众子／以色列的众儿女
  rationale: 该表达虽形式上是阳性复数“以色列的众子”，在本节却作为全体以色列会众的惯用称谓。正文采用现代汉语中不易误解的族群表达，脚注说明字面形式，以免把命令错误限定为成年男子。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留原文“讲话／说”的双重言说结构，但以冒号承接 לֵאמֹר 所引出的下文，避免生硬重复。
