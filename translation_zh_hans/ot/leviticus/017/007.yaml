  text: וְ/לֹא יִזְבְּח֥וּ עוֹד֙ אֶת זִבְחֵי/הֶ֔ם לַ/שְּׂעִירִ֕ם אֲשֶׁ֛ר הֵ֥ם זֹנִ֖ים אַחֲרֵי/הֶ֑ם חֻקַּ֥ת עוֹלָ֛ם תִּֽהְיֶה זֹּ֥את לָ/הֶ֖ם לְ/דֹרֹתָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/007.yaml
  text: They shall no longer sacrifice their sacrifices to the goat-demons, after which they prostitute themselves. This shall be a permanent statute for them throughout their generations.
translation:
  language: zh_hans
  text: 他们不可再把祭物献给山羊鬼[a]，随从它们行淫[b]。这是他们世世代代永远的条例[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “山羊鬼”也可译作“山羊偶像”或“多毛的鬼怪”；希伯来语所指是与非法敬拜有关、具有山羊形象的存在。
    reason: lexical_alternative
  - marker: b
    text: 希伯来语直译为“随从它们行淫”，以行淫比喻在敬拜上不忠或拜偶像。
    reason: cultural_note
  - marker: c
    text: “永远的条例”也可译作“永久的条例”。
    reason: lexical_alternative
lexical_decisions:
- source_word: יִזְבְּחוּ ... זִבְחֵיהֶם
  choice: 把祭物献给
  rationale: 以自然的现代汉语表达同源动词与名词构成的献祭用语；不机械重复“祭献他们的祭物”，同时保留祭祀含义。
- source_word: עוֹד
  choice: 再
  rationale: 与否定词“不可”搭配成“不可再”，准确表达停止先前或持续行为的禁令。
- source_word: לַשְּׂעִירִם
  choice: 给山羊鬼
  rationale: שׂעירים 字面与山羊或多毛者有关，在此非法祭祀语境中很可能指具有山羊形象的邪灵；“山羊鬼”既保留形象，也避免引入希腊罗马的萨堤尔概念。
- source_word: זֹנִים אַחֲרֵיהֶם
  choice: 随从它们行淫
  rationale: 保留原文以性不忠描写宗教不忠的强烈隐喻，并以“随从”表达 אַחֲרֵי 的追随关系。
- source_word: חֻקַּת עוֹלָם
  choice: 永远的条例
  rationale: 这是希伯来法律文本中的固定持续性表述；正文采用庄重而通行的“永远的条例”，脚注提示也可理解为永久施行。
- source_word: לְדֹרֹתָם
  choice: 世世代代
  rationale: 自然表达该条例对连续各代的持续适用。
theological_decisions:
- issue: שְּׂעִירִם 在非法敬拜中的所指
  choice: 具有山羊形象的邪灵，即“山羊鬼”
  alternative: 山羊偶像；多毛的鬼怪；普通山羊
  rationale: 献祭对象和随后“行淫”的宗教不忠语境支持超自然或偶像崇拜层面的所指，而非普通动物；脚注保留词义范围。
- issue: זֹנִים 的宗教不忠隐喻
  choice: 明确保留“行淫”
  alternative: 不忠；拜偶像
  rationale: 原文刻意使用性不忠的强烈隐喻；不将其弱化或直接解释成抽象的“拜偶像”，以保留原文的神学张力。
- issue: חֻקַּת עוֹלָם 的时效表达
  choice: 永远的条例
  alternative: 永久的条例；长久的条例
  rationale: 保留传统法律公式的力度，同时用脚注说明 עוֹלָם 在此也可译作“永久”，不进一步裁定其 covenantal 时限。
translation_notes:
  register: 采用现代、庄重而易懂的法律—礼仪语体。“不可再”清楚表达禁令；“山羊鬼”保留古代敬拜语境中的陌生形象；“随从它们行淫”保留原文尖锐隐喻，不以解释性措辞取代。
