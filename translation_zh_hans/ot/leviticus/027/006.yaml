  text: וְ/אִ֣ם מִ/בֶּן חֹ֗דֶשׁ וְ/עַד֙ בֶּן חָמֵ֣שׁ שָׁנִ֔ים וְ/הָיָ֤ה עֶרְכְּ/ךָ֙ הַ/זָּכָ֔ר חֲמִשָּׁ֥ה שְׁקָלִ֖ים כָּ֑סֶף וְ/לַ/נְּקֵבָ֣ה עֶרְכְּ/ךָ֔ שְׁלֹ֥שֶׁת שְׁקָלִ֖ים כָּֽסֶף־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/006.yaml
  text: If it is from a month old up to five years old, your valuation for the male shall be five shekels of silver, and for the female your valuation shall be three shekels of silver.
translation:
  language: zh_hans
  text: 若年龄从满一个月到五岁，男的估价为五舍客勒银子，女的则为三舍客勒银子。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִבֶּן חֹדֶשׁ
  choice: 从满一个月
  rationale: 这是希伯来语表达年龄的惯用语；译作“从满一个月”自然清楚，也明确保留估价年龄段的起点。
- source_word: וְעַד בֶּן חָמֵשׁ שָׁנִים
  choice: 到五岁
  rationale: 承接年龄范围的表达，以简洁的现代汉语保留其法律条文中的年龄界限。
- source_word: עֶרְכְּךָ
  choice: 估价
  rationale: 本章所指的是许愿条例规定的估定金额；“估价”既保留法律语义，也比逐字呈现第二人称后缀更符合现代汉语条文表达。
- source_word: הַזָּכָר
  choice: 男的
  rationale: 原文按性别划分类别，并未使用特指儿童身份的词；“男的”可避免增译为“男孩”。
- source_word: חֲמִשָּׁה שְׁקָלִים כָּסֶף
  choice: 五舍客勒银子
  rationale: 直接呈现金额及银这一材质，并保留圣经时代的重量兼货币单位“舍客勒”。
- source_word: וְלַנְּקֵבָה
  choice: 女的
  rationale: 与“男的”平行，准确表达原文按性别设置的估价类别，而不额外限定为“女孩”。
- source_word: שְׁלֹשֶׁת שְׁקָלִים כָּסֶף
  choice: 三舍客勒银子
  rationale: 直接、对称地呈现原文规定的金额。
- source_word: וְהָיָה
  choice: 为
  rationale: 在本段法律语境中表示规定的估价；汉语用“为”简洁自然，并保持规范性语气。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而简明的法规式汉语。保留“舍客勒”这一传统计量名称；不把原文的性别类别擅自年龄化为“男孩、女孩”，因为该节本身只用“男、女”类别，年龄范围已在前文说明。
