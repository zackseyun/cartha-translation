  text: וְ/הֶעֱרִ֤יךְ הַ/כֹּהֵן֙ אֹתָ֔/הּ בֵּ֥ין ט֖וֹב וּ/בֵ֣ין רָ֑ע כְּ/עֶרְכְּ/ךָ֥ הַ/כֹּהֵ֖ן כֵּ֥ן יִהְיֶֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/012.yaml
  text: and the priest shall assess it[a], whether good or bad; as the priest assesses it, so it shall be.
translation:
  language: zh_hans
  text: 祭司要为它估价，不论好坏；祭司怎样估价[a]，就照这样定。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译：“照你所估的价，祭司，事情就要这样定。”这里的“你”是对祭司的称呼；意思是祭司所作的估价具有决定效力。
    reason: 原文在“你的估价”中使用第二人称单数词尾，随后称“祭司”；脚注保留这一特殊句法并说明其在语境中的指向。
lexical_decisions:
- source_word: וְהֶעֱרִיךְ
  choice: 要鉴定
  rationale: 此处使役式动词指祭司对许愿所献的牲畜作价值评定；“鉴定”自然表达先察看品质、再确定价值的正式行为。
- source_word: הַכֹּהֵן
  choice: 祭司
  rationale: 保留利未记律法语境中 כֹּהֵן 的标准称谓。
- source_word: אֹתָהּ
  choice: 它
  rationale: 阴性单数代词回指牲畜；现代汉语在此法律语境中自然用“它”。
- source_word: בֵּין טוֹב וּבֵין רָע
  choice: 看是好是坏
  rationale: 希伯来语直译为“在好与坏之间”，这里表示按品质作判断；“看是好是坏”兼顾原意与现代汉语表达。
- source_word: כְּעֶרְכְּךָ הַכֹּהֵן
  choice: 祭司怎样估定
  rationale: 原文形式上含第二人称单数后缀，随后有“祭司”作同位说明。正文按语境表达为祭司的正式估价，同时以脚注保留其特殊字面结构。
- source_word: כֵּן יִהְיֶה
  choice: 就要怎样定
  rationale: 该公式表明祭司的估价具有确定效力；此译法在现代汉语中自然，并保留律法语气。
theological_decisions:
- issue: 祭司估价的效力
  choice: 用“就要怎样定”表达该估价为最终确定的数额
  alternative: “事情就要这样成就”或仅作一般将来陈述
  rationale: 上下文讨论许愿牲畜的估价，כֵּן יִהְיֶה 在此确认祭司所定价值的约束力，并非引入额外教义。
translation_notes:
  register: 采用现代、庄重而易懂的律法文体。“鉴定”侧重祭司察验牲畜好坏的行为，“估定”侧重由此确定价值；脚注标记已置于正文对应词后。
