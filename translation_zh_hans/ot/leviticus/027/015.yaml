source:
  edition: WLC
  text: וְ/אִ֨ם הַ/מַּקְדִּ֔ישׁ יִגְאַ֖ל אֶת בֵּית֑/וֹ וְ֠/יָסַף חֲמִישִׁ֧ית כֶּֽסֶף עֶרְכְּ/ךָ֛ עָלָ֖י/ו וְ/הָ֥יָה לֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/015.yaml
  text: And if the one who consecrated it redeems his house[a], then he shall add a fifth of the silver of your valuation to it[b], and it shall be his.
translation:
  language: zh_hans
  text: '如果那把房屋分别为圣的人[a]要赎回自己的房屋，就要在你所估定的银价上加五分之一[b]，房屋便归他。


    [a] “分别为圣”也可译作“奉献”或“使之成为圣物”。这里指把房屋归给耶和华。

    [b] 即在祭司估定的银价之外，再加上该价的五分之一。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “分别为圣”也可译作“奉献”或“使之成为圣物”。这里指把房屋归给耶和华。
    reason: lexical_alternative
  - marker: b
    text: 即在祭司估定的银价之外，再加上该价的五分之一。
    reason: cultural_note
lexical_decisions:
- source_word: הַמַּקְדִּישׁ
  choice: 那把房屋分别为圣的人
  rationale: 该分词在本章的礼仪与估价法规中，指把房屋划归为圣、归给耶和华的人。“分别为圣”保留了 קדשׁ 的神圣含义；“奉献”虽更简洁，却略弱化了原词的礼仪色彩。
- source_word: יִגְאַל
  choice: 赎回
  rationale: גאל 在此指通过付款重新取得已分别为圣之房屋的所有权。“赎回”既符合利未记的法律—礼仪语境，也比“买回”更能保留原词色彩。
- source_word: בֵּיתוֹ
  choice: 自己的房屋
  rationale: 字面为“他的房屋”。汉语用“自己的房屋”能清楚表明房屋原属那位分别为圣者，同时保持法律文本对财产的准确指称。
- source_word: וְיָסַף
  choice: 就要……加
  rationale: 在条件句之后，该动词表达必须履行的行为。“就要”以自然的现代汉语传达法律义务。
- source_word: חֲמִישִׁית
  choice: 五分之一
  rationale: 准确对应原文的分数表达，也保持古代法律文本的措辞，避免改写成现代百分比。
- source_word: כֶּסֶף עֶרְכְּךָ
  choice: 你所估定的银价
  rationale: כֶּסֶף 具体指银或以银支付的价款，עֶרְכְּךָ 是第二人称单数“你的估价”。译文保留“银价”和对负责估价者的直接称呼。
- source_word: עָלָיו
  choice: 在……上加
  rationale: 此处表达在估定价额之外追加款项；“在……上加”是自然且准确的汉语表达。
- source_word: וְהָיָה לוֹ
  choice: 房屋便归他
  rationale: 该句说明付款后的所有权结果。补出“房屋”使汉语指代清楚，“归他”简明保留原文法律效力。
theological_decisions:
- issue: 对归给上帝之房产所用的礼仪术语
  choice: 分别为圣
  alternative: 奉献；使之成为圣物
  rationale: 上下文所说的不只是一般捐赠，而是把房屋置于归耶和华为圣的估价制度之下。“分别为圣”保留神圣与法律双重含义，又不引入特定宗派解释。
translation_notes:
  register: 采用现代、庄重而易懂的法律—礼仪语体。“银价”保留古代支付媒介的具体性；“便归他”自然表达赎回后的产权结果。脚注标记均置于正文相关词句之后。
