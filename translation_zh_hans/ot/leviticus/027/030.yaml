  text: וְ/כָל מַעְשַׂ֨ר הָ/אָ֜רֶץ מִ/זֶּ֤רַע הָ/אָ֨רֶץ֙ מִ/פְּרִ֣י הָ/עֵ֔ץ לַ/יהוָ֖ה ה֑וּא קֹ֖דֶשׁ לַֽ/יהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/030.yaml
  text: Every tithe of the land[a], from the seed of the land and from the fruit of the tree, belongs to Yahweh; it is holy to Yahweh.
translation:
  language: zh_hans
  text: “地里出产的一切十分之一[a]，无论是地里的种子，还是树上的果子，都属于雅威；这十分之一归雅威为圣。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 较直译：“地里所有的十分之一，无论出自地里的种子，还是出自树上的果子，都是雅威的。”
    reason: 保留原文“地的十分之一”这一较紧凑的结构，并展示לַיהוָה可直译为“是雅威的”。
lexical_decisions:
- source_word: וְכָל מַעְשַׂר הָאָרֶץ
  choice: 地里出产的一切十分之一
  rationale: מַעְשַׂר指作为奉献的“十分之一”；הָאָרֶץ在本节农业语境中指土地及其出产。译文补出“出产”，使现代汉语自然，并由下文“种子”和“果子”明确限定其含义。
- source_word: מִזֶּרַע הָאָרֶץ
  choice: 无论是地里的种子
  rationale: 保留“种子”的具体意象，不泛化为“农作物”；介词מִן与后一短语并列，说明十分bots一所取自的两类出产，故以“无论是……还是……”表达。
- source_word: מִפְּרִי הָעֵץ
  choice: 还是树上的果子
  rationale: הָעֵץ虽为单数，在此可作集合用法；汉语“树上的果子”自然涵盖各类树木所产的果实。
- source_word: לַיהוָה הוּא
  choice: 都属于雅威
  rationale: 介词ל在这里表达归属或奉献关系；译作“属于”既清楚又不排除其礼仪性归属。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见音译呈现四字神名，保留其作为专名的性质，不以称号代替。
- source_word: קֹדֶשׁ לַיהוָה
  choice: 归雅威为圣
  rationale: קֹדֶשׁ表示分别为圣、专归神所有；“归雅威为圣”保留礼仪与神学力度，也没有误译成原文并无的“至圣”。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用以色列神的专名。音译“雅威”保留专名性质；不以“上主”这一称号替代，也不采用较晚形成的混合读音“耶和华”。
- issue: לַיהוָה所表达的关系
  choice: 属于雅威／归雅威为圣
  alternative: 给雅威／为雅威所用
  rationale: ל既可包含归属，也可包含奉献、分别出来的方向。前半句用“属于”表达所有权，后半句用“归……为圣”表达圣别关系，保留两层互补含义。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“十分之一”比专门术语“什一”更容易为普通读者理解；“归……为圣”保留《利未记》的礼仪语域。
