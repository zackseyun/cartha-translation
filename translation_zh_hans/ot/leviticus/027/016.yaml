source:
  edition: WLC
  text: וְ/אִ֣ם מִ/שְּׂדֵ֣ה אֲחֻזָּת֗/וֹ יַקְדִּ֥ישׁ אִישׁ֙ לַֽ/יהוָ֔ה וְ/הָיָ֥ה עֶרְכְּ/ךָ֖ לְ/פִ֣י זַרְע֑/וֹ זֶ֚רַע חֹ֣מֶר שְׂעֹרִ֔ים בַּ/חֲמִשִּׁ֖ים שֶׁ֥קֶל כָּֽסֶף׀׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/016.yaml
  text: 'If a man consecrates to Yahweh part of the field of his possession[a], then your valuation shall be according to its seed requirement: fifty shekels of silver for the seed of a homer of barley.'
translation:
  language: zh_hans
  text: 如果一个人把自己承受为业的田地中的一部分分别为圣，归给雅威[a]，你要按田地所需的种子估定价值：每需一贺梅珥大麦种子的田地，估价为五十舍客勒银子[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “承受为业的田地”指作为世袭产业持有的土地。原文在“田地”前有“从”之意，表明所分别为圣的是该田地中的一部分。
    reason: 说明地产术语及原文介词所表达的部分关系。
  - marker: b
    text: “贺梅珥”是古代容量单位；“舍客勒”是重量单位，此处以银子计价。这里按播种田地所需的大麦种子数量估价；原文简洁地说：“一贺梅珥大麦种子，五十舍客勒银子。”
    reason: 解释古代单位及原文简洁而省略的估价公式。
lexical_decisions:
- source_word: מִשְּׂדֵה אֲחֻזָּתוֹ
  choice: 自己承受为业的田地中的一部分
  rationale: אֲחֻזָּה在此指世代持有、通常由继承而来的地产；מִן前缀表明所献的是田地中的一部分，而不一定是整块田地。
- source_word: יַקְדִּישׁ
  choice: 分别为圣，归给
  rationale: 该动词在利未记27章指把财物划归神圣用途；“分别为圣”保留礼仪含义，加上“归给”使现代汉语表达自然。
- source_word: אִישׁ
  choice: 一个人
  rationale: 希伯来语为阳性单数，但在此类法律条文中具有泛指作用；现代汉语“一个人”自然且不额外限定性别。
- source_word: לַיהוָה
  choice: 归给雅威
  rationale: 按源文直接保留四字神名的专名性质，译作“雅威”，而不是以称号替代。
- source_word: עֶרְכְּךָ
  choice: 你就要……估定价值
  rationale: 保留第二人称单数，并以自然汉语表达祭司或受命估价者所作的法定估值。
- source_word: לְפִי זַרְעוֹ
  choice: 按田地所需的种子
  rationale: 这里的标准是播种该田地需要的种子数量，并非田地的出产；明确补出“所需”以避免误解。
- source_word: זֶרַע חֹמֶר שְׂעֹרִים
  choice: 可用一贺梅珥大麦种子播种的田地
  rationale: 此短语以一贺梅珥大麦种子所能播种的面积为估价单位；这样处理既保留古代量词，也清楚表达农业计量关系。
- source_word: בַּחֲמִשִּׁים שֶׁקֶל כָּסֶף
  choice: 估价为五十舍客勒银子
  rationale: 介词ב在此引出估定金额；保留“舍客勒”这一重量兼货币单位，并说明是银子。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 源文使用神的专名；音译“雅威”保存其专名性质，避免用称号代替，也与所给审定层的最新神学决定一致。
- issue: 法律条文中אִישׁ的泛指范围
  choice: 一个人
  alternative: 一个男人
  rationale: 虽为阳性单数形式，但在法律条文中可代表任何适用者；译作“一个人”保留单数代表性，不把生理性别强调为规定重点。
translation_notes:
  register: 采用现代、庄重而清楚的法律礼仪文体。“分别为圣，归给雅威”兼顾献地行为的神圣性质与汉语可读性；保留“贺梅珥”“舍客勒”等古代单位，并以脚注辅助普通读者理解。
