  text: וְ/אִ֨ם מִ/בֶּן חָמֵ֜שׁ שָׁנִ֗ים וְ/עַד֙ בֶּן עֶשְׂרִ֣ים שָׁנָ֔ה וְ/הָיָ֧ה עֶרְכְּ/ךָ֛ הַ/זָּכָ֖ר עֶשְׂרִ֣ים שְׁקָלִ֑ים וְ/לַ/נְּקֵבָ֖ה עֲשֶׂ֥רֶת שְׁקָלִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/005.yaml
  text: And if it is from five years old up to twenty years old, your valuation shall be twenty shekels for the male and ten shekels for the female.
translation:
  language: zh_hans
  text: 若年龄在五岁至二十岁之间，你所定的估价额：男性二十舍客勒，女性十舍客勒。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאִם
  choice: 如果
  rationale: 承接上文继续列举条件情形；现代汉语中直接用“如果”已能自然表达这种衔接，无须机械译出连接词。
- source_word: מִבֶּן חָמֵשׁ שָׁנִים וְעַד בֶּן עֶשְׂרִים שָׁנָה
  choice: 年龄是从五岁到二十岁
  rationale: 准确表达希伯来语以“……之子”构式标示的年龄范围，并采用自然的现代汉语。
- source_word: וְהָיָה
  choice: 为
  rationale: 在法规性估价表中表达规定的数额；“为”简洁而庄重，比逐字译作“将是”更符合汉语法律说明文体。
- source_word: עֶרְכְּךָ
  choice: 你所估定的价银
  rationale: 保留第二人称后缀及本章许愿估价的专门语境；加“银”表明此处是按舍客勒计量的规定金额，而非对人格价值的泛称。
- source_word: הַזָּכָר
  choice: 男性
  rationale: 按原文阳性单数类别表达估价对象的性别分类，不扩大为社会群体意义的“男人”。
- source_word: עֶשְׂרִים שְׁקָלִים
  choice: 二十舍客勒
  rationale: 保留古代重量及货币单位，不换算成现代币值。
- source_word: וְלַנְּקֵבָה
  choice: 女性为
  rationale: 与“男性为”形成简洁平行结构，忠实表达原文相应的性别分类。
- source_word: עֲשֶׂרֶת שְׁקָלִים
  choice: 十舍客勒
  rationale: 直接保留数额和古代计量单位，与前项形成明确对照。
theological_decisions:
- issue: 祭祀法规中按性别划分的估价类别
  choice: 男性……女性
  alternative: 男人……女人；男的……女的
  rationale: 原文使用带冠词的阳性、阴性单数名词，指估价表中的性别类别。“男性……女性”既准确又保持法规语体，不把这项特定赎价规定延伸为对人的本质价值或社会地位的判断。
translation_notes:
  register: 采用现代、庄重而易懂的法规说明语体。句法保持条件—估价—两类金额的结构；“舍客勒”作为历史单位沿用通行音译。
