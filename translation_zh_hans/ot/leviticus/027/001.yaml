base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/001.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: zh_hans
  text: 耶和华对摩西说：
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: 说
  rationale: 该词在叙事中构成常见的发言引介公式；现代汉语用“说”最自然，也无需与后面的 לֵאמֹר 机械重复。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的神名音译“耶和华”，在正文中保留专名性质，而不以“主”这一称号替代。
- source_word: אֶל־מֹשֶׁה
  choice: 对摩西
  rationale: 介词 אֶל 标明说话所指向的对象；“对摩西”是自然、准确的现代汉语表达。
- source_word: לֵאמֹר
  choice: 说：
  rationale: 该不定式用于引出下文的直接话语。汉语以句末“说：”合并表达整个希伯来语发言公式，既保留功能，又避免“说……说”式生硬重复。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 耶和华
  alternative: 雅威；上主
  rationale: 原文直接使用四字神名。正文采用中文传统且广为人知的专名形式“耶和华”，保留其神名身份；“雅威”更接近常见学术拟音，“上主”则是称号替代，均可作为翻译传统中的替代方案，但本节不需脚注干扰简短的发言公式。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。希伯来语 וַיְדַבֵּר ... לֵאמֹר 的套语不逐词复现为“讲话……说”，而整合成中文惯用的“对……说：”，冒号明确引出下一节的话语。
