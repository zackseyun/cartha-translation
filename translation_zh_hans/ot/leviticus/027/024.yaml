  source_fidelity: 正文准确保留了禧年时田地复归、归还给先前出让者，以及该人是土地产业所属者这三个要点。惟“以这块土地为产业的人”在现代汉语中较容易理解为“以土地为生/从事土地经营的人”，未充分表达אֲחֻזַּת הָאָרֶץ所指的土地持有产业；宜改为明确的“拥有这份土地产业的人”。
