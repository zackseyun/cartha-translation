revisions:
- from: 到了禧年，那块田要归还给当初出售这田的人，就是以这块土地为产业的人。[a]
  to: 到了禧年，那块田要归还给当初把这块田卖出去的人，就是拥有这份土地产业[a]的人。
  rationale: 修订仅消除“以土地为产业”可能造成的职业性理解，并润饰脚注的汉语表达与锚点位置。仍以“当初把这块田卖出去的人”表达“从其买得此田的人”，不添加原文未明说的买方身分；“土地产业”保留原文的土地持有/归属含义及其语境中的家族背景。
