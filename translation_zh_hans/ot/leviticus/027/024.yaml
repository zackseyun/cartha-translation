  text: בִּ/שְׁנַ֤ת הַ/יּוֹבֵל֙ יָשׁ֣וּב הַ/שָּׂדֶ֔ה לַ/אֲשֶׁ֥ר קָנָ֖/הוּ מֵ/אִתּ֑/וֹ לַ/אֲשֶׁר ל֖/וֹ אֲחֻזַּ֥ת הָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/024.yaml
  text: In the year of jubilee the field shall return to the one from whom it was bought[a], to the one to whom the possession of the land belongs.
translation:
  language: zh_hans
  text: 到了禧年，那块田要归还给当初把这块田卖出去的人，就是拥有这份土地产业[a]的人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “拥有这份土地产业的人”也可译作“这份土地产业所属的人”。希伯来语“土地产业”指所持有的一份土地；在这里，按禧年律例的背景，是指原属家族的土地产业。
    reason: 说明 אֲחֻזַּת הָאָרֶץ 所指的土地持有产业及其在本段中的家族产业背景，不在正文中额外限定为“祖传”。
lexical_decisions:
- source_word: בִּשְׁנַת הַיּוֹבֵל
  choice: 到了禧年
  rationale: 以自然的现代汉语表达时间背景；“禧年”沿用利未记相关律例中的专门称谓。
- source_word: יָשׁוּב הַשָּׂדֶה
  choice: 那块田要归还
  rationale: “田”直接对应 שָׂדֶה；未完成式在律例语境中表示规定的结果，译作“要归还”兼顾法律效力与现代汉语的自然表达。
- source_word: לַאֲשֶׁר קָנָהוּ מֵאִתּוֹ
  choice: 给当初出售这田的人
  rationale: 希伯来文直指“他从其手中买田的人”。汉语从卖方角度表达可避免代词指向含混，同时保留交易关系及归还对象。
- source_word: לַאֲשֶׁר לוֹ אֲחֻזַּת הָאָרֶץ
  choice: 就是以这块土地为产业的人
  rationale: אֲחֻזָּה 指土地产业或持有的地业；“以……为产业”保留其土地权属含义，但不在正文中额外明说“祖传”或“家族分地”。
theological_decisions:
- issue: 禧年律例中 אֲחֻזַּת הָאָרֶץ 的性质
  choice: 正文译作“以这块土地为产业的人”
  alternative: “这块土地的祖业所有人”或“这块土地原属的家族产业所有人”
  rationale: 上下文涉及以色列家族土地在禧年的复归，但本节用词本身着重于土地产业或持有权。正文不把“祖传”明文化，以免消除原文在词汇层面保留的空间；相关语境含义置于脚注说明。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“到了……要……”符合律例叙述；“就是”明确后半句与前述卖田者为同一人。避免使用过于古雅的“归与”或现代行政色彩较强的术语。
