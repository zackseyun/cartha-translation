  text: לֹ֣א יַחֲלִיפֶ֗/נּוּ וְ/לֹֽא יָמִ֥יר אֹת֛/וֹ ט֥וֹב בְּ/רָ֖ע אוֹ רַ֣ע בְּ/ט֑וֹב וְ/אִם הָמֵ֨ר יָמִ֤יר בְּהֵמָה֙ בִּ/בְהֵמָ֔ה וְ/הָֽיָה ה֥וּא וּ/תְמוּרָת֖/וֹ יִֽהְיֶה קֹּֽדֶשׁ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/010.yaml
  text: He shall not replace it or exchange it[a], good for bad or bad for good; and if he does indeed exchange one animal for another[b], then both it and its substitute shall be holy.
translation:
  language: zh_hans
  text: 不可把它换掉，也不可拿它换别的牲畜[a]，无论拿好的换坏的，还是拿坏的换好的。若他确实以一头牲畜换另一头牲畜[b]，原来的牲畜和换来的牲畜都要归为圣。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “换掉”和“换”对应希伯来文中两个意义相关但并不相同的动词。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文用不定式绝对形加同源限定动词来加强语气，可译作“若他确实换”或“若他执意换”。
    reason: lexical_alternative
lexical_decisions:
- source_word: יַחֲלִיפֶנּוּ
  choice: 把它更换
  rationale: 使役式动词 חלף 在此指把已经指定的牲畜换掉；译作“更换”简洁自然，并与后面的 מוּר 略作区分。
- source_word: יָמִיר אֹתוֹ
  choice: 用别的牲畜替代它
  rationale: מוּר 在本段法律语境中指以另一牲畜取代原牲畜；补出“别的牲畜”使中文所指清楚，同时不改变原意。
- source_word: טוֹב בְּרָע אוֹ רַע בְּטוֹב
  choice: 拿好的换坏的，还是拿坏的换好的
  rationale: 两个形容词在希伯来文中作名词使用；中文采用对称表达，保留两种方向都被禁止的法律规定。
- source_word: וְאִם הָמֵר יָמִיר
  choice: 若他确实……替换
  rationale: 不定式绝对形与限定动词连用以加强语气；“确实”在现代中文中自然地传达这一强调。
- source_word: בְּהֵמָה בִּבְהֵמָה
  choice: 以一头牲畜替换另一头
  rationale: 按中文习惯明确表达一头牲畜与另一头之间的替换关系。
- source_word: וְהָיָה הוּא וּתְמוּרָתוֹ
  choice: 原来的牲畜和替代它的牲畜都
  rationale: 原文代词指原先指定的牲畜，תְמוּרָה 指替代物；明确译出两者，以免中文代词造成歧义。
- source_word: קֹדֶשׁ
  choice: 成为圣物
  rationale: קֹדֶשׁ 在献祭和许愿法规中表示归于神的神圣地位；“成为圣物”既直接又符合中文法律语境。
theological_decisions:
- issue: 尝试替换以后，原牲畜与替代牲畜的地位
  choice: 原来的牲畜和替代它的牲畜都成为圣物
  alternative: 只有替代的牲畜成为圣物；或本句只宣告替换无效而未赋予二者神圣地位
  rationale: “它和它的替代物都必为圣”明确将神圣地位同时赋予两头牲畜；译文以“都”保留这一双重结果。
translation_notes:
  register: 采用现代、庄重而清楚的法律语体。“牲畜”承接本段献祭动物的语境；末句明确说出原牲畜与替代牲畜，避免代词含混。
