  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/אִם אַחַ֣ר הַ/יֹּבֵל֮ יַקְדִּ֣ישׁ שָׂדֵ/הוּ֒ וְ/חִשַּׁב ל֨/וֹ הַ/כֹּהֵ֜ן אֶת הַ/כֶּ֗סֶף עַל פִּ֤י הַ/שָּׁנִים֙ הַ/נּ֣וֹתָרֹ֔ת עַ֖ד שְׁנַ֣ת הַ/יֹּבֵ֑ל וְ/נִגְרַ֖ע מֵֽ/עֶרְכֶּֽ/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/018.yaml
  text: But if he consecrates his field after the Jubilee[a], then the priest shall calculate the money for him according to the years remaining until the year of Jubilee[c][b], and it shall be deducted from your valuation.
translation:
  language: zh_hans
  text: 但如果他在禧年以后把自己的田地分别为圣，祭司就要按直到禧年所剩的年数，为他计算价款；这要从你的估价中扣减。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַחַר הַיֹּבֵל
  choice: 在禧年以后
  rationale: אַחַר表示时间上的“以后”；הַיֹּבֵל在本章指禧年制度中的禧年。
- source_word: יַקְדִּישׁ
  choice: 分别为圣
  rationale: קדשׁ在此指把田地划归神圣用途；“分别为圣”保留礼仪和法律语境中的神圣含义。
- source_word: שָׂדֵהוּ
  choice: 自己的田地
  rationale: 保留第三人称单数所属关系，并以自然汉语表达。
- source_word: וְחִשַּׁב לוֹ הַכֹּהֵן אֶת הַכֶּסֶף
  choice: 祭司就要……为他计算价款
  rationale: חשב在此是计算、核算；הַכֶּסֶף字面为银钱，在估价法规中自然指应计的价款。
- source_word: עַל פִּי הַשָּׁנִים הַנּוֹתָרֹת עַד שְׁנַת הַיֹּבֵל
  choice: 按距离禧年尚余的年数
  rationale: עַל־פִּי表示“按照、根据”，整句说明按剩余年数作比例计算；中文合并表达可避免重复“禧年之年”。
- source_word: וְנִגְרַע מֵעֶרְכֶּךָ
  choice: 相应的数额要从你所估定的价值中扣除
  rationale: גרע的被动形式表示减少或扣除；二人称单数后缀以“你”保留。补出“相应的数额”明确被扣除的是因年数减少而减去的金额，不改变原意。
theological_decisions:
- issue: מֵעֶרְכֶּךָ中的第二人称单数后缀
  choice: 从你所估定的价值中
  alternative: 从所估定的价值中／从它的估价中
  rationale: 原文直接使用第二人称单数，译文保留“你”，维持本段律法措辞的直接称谓及其与前述估价标准的联系。
- issue: יַקְדִּישׁ的礼仪性用语
  choice: 分别为圣
  alternative: 奉献／献上
  rationale: “分别为圣”明确保留קדשׁ的神圣领域含义，同时不额外规定田地最终用途或引入宗派性解释。
translation_notes:
  register: 采用现代、庄重而易懂的律法文体。“价款”“扣除”贴合法律经济语境；保留“你”的单数直接称谓。原文在本节没有必须以脚注保留的实质歧义，因此不设脚注。
