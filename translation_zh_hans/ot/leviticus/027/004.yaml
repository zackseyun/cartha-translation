  text: וְ/אִם נְקֵבָ֖ה הִ֑וא וְ/הָיָ֥ה עֶרְכְּ/ךָ֖ שְׁלֹשִׁ֥ים שָֽׁקֶל־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/004.yaml
  text: But if it is a female[a], then your valuation shall be thirty shekels.
translation:
  language: zh_hans
  text: 但如果是女性，你所估定的价银就要为三十舍客勒。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאִם
  choice: 但如果
  rationale: 承接上一节并引出相对的女性情形；“但如果”自然表达上下文中的对比条件。
- source_word: נְקֵבָה הִוא
  choice: 是女性
  rationale: נְקֵבָה表示生理性别上的女性；此处所指是人，因此用“女性”比“雌性”自然，也不把词义限缩为特定年龄的“女人”。
- source_word: וְהָיָה
  choice: 就要为
  rationale: 在法律条件句中引出结果，用“就要为”清楚呈现条件与结果的关系。
- source_word: עֶרְכְּךָ
  choice: 你所估定的价银
  rationale: עֶרֶךְ在本章指按规定作出的估价，第二人称单数后缀予以保留；结合舍客勒这一计量单位，以“价银”明确这是估定的金额，而不额外在单位前添加原文未明说的“银”。
- source_word: שְׁלֹשִׁים שָׁקֶל
  choice: 三十舍客勒
  rationale: 按希伯来文直接保留数额及重量、货币单位；数词后原文用单数形式属于希伯来语习惯，中文无须标示复数。
