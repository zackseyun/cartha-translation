id: LEV.27.20
reference: Leviticus 27:20
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/אִם לֹ֤א יִגְאַל֙ אֶת הַ/שָּׂדֶ֔ה וְ/אִם מָכַ֥ר אֶת הַ/שָּׂדֶ֖ה לְ/אִ֣ישׁ אַחֵ֑ר לֹ֥א יִגָּאֵ֖ל עֽוֹד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/020.yaml
  text: But if he does not redeem the field[a], or if he has sold the field to another man, it may not be redeemed again.
translation:
  language: zh_hans
  text: 但他若不赎回那块田，或已把那块田卖给另一个人[a]，那块田以后就不可再赎回。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “另一个人”原文直译为“另一个男人”；在这里也可作泛指。
    reason: 说明希伯来语阳性名词的字面形式及其在法律语境中的泛指可能。
lexical_decisions:
- source_word: וְאִם
  choice: 但……若／或
  rationale: 两个וְאִם延续上一节的条件规定；首处用“但……若”体现转折承接，第二处依语境用“或”自然连接两个条件，同时保留其并列关系。
- source_word: יִגְאַל / יִגָּאֵל
  choice: 赎回／被赎回
  rationale: גאל在本章奉献田产的法律语境中指按规定赎回产业。“赎回”既保留其法律—礼仪色彩，也能自然对应主动式与被动式。
- source_word: הַשָּׂדֶה
  choice: 那块田
  rationale: 这里指上下文已明确谈到的特定田地；“那块田”比宽泛的“土地”更准确，也符合现代汉语表达。
- source_word: מָכַר
  choice: 已把……卖给
  rationale: 完成式在条件句中表示已经发生并产生法律后果的出售，因此用“已”体现完成性。
- source_word: לְאִישׁ אַחֵר
  choice: 给另一个人
  rationale: אִישׁ字面为“男人”，但在此法律表述中可以泛指个人；正文用自然且不缩窄适用范围的“另一个人”，脚注说明其字面形式。
- source_word: עוֹד
  choice: 以后……再
  rationale: עוֹד在否定句中表示此后不再可能；“以后就不可再”清楚表达出售后的永久法律后果。
theological_decisions:
- issue: 法律条文中阳性单数אִישׁ的表达
  choice: 另一个人
  alternative: 另一个男人
  rationale: 该词的词形和基本词义为阳性，但在法律语境中可作泛称。正文采用现代汉语自然的泛指表达，并以脚注保留原文的字面信息，避免无依据地把法规效力限定于男性。
- issue: גאל的法律—礼仪含义
  choice: 赎回
  alternative: 买回
  rationale: “赎回”保留利未记27章中奉献产业按规定取回的专门含义，并不额外引入某一宗派的神学解释；“买回”虽通俗，却会削弱原词在本章反复出现的术语联系。
- issue: 末句被动式的主语所指
  choice: 明确重复“那块田”，译作“那块田以后就不可再赎回”
  alternative: 以后就不可再赎回
  rationale: 希伯来语被动动词的语法主语承接“田”。中文补出“那块田”可避免误把人理解为被赎者，同时不指定由谁执行赎回，保留原文未说明施事者的特点。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。保留“赎回”作为本章核心法律—礼仪术语；用“那块田”维持上下文指称清晰。脚注标记紧接其实际说明的“另一个人”，而非置于前一个“田”之后。
