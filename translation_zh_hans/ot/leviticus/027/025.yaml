  text: And every valuation of yours shall be by the sanctuary shekel[a]; the shekel shall be twenty gerahs.
translation:
  language: zh_hans
  text: 你所估定的一切价额，都要按圣所的舍客勒[a]计算；一舍客勒为二十季拉。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“按圣洁的舍客勒”。希伯来语指圣所相关估价所采用的标准舍客勒。
    reason: lexical_alternative
lexical_decisions:
- source_word: עֶרְכְּךָ
  choice: 你所估定的一切价额
  rationale: 本章中的 עֶרֶךְ 是为许愿所涉及的人或物核定的价额；译作“估定的价额”保留其法律和礼仪语境中的术语意味，并以“你所”体现第二人称单数后缀。
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: 按圣所的舍客勒计算
  rationale: 该短语指与圣所有关的标准舍客勒，即作为估价依据的规定衡量标准；“按……计算”自然表达介词 בְּ 在此处的标准或依据义。
- source_word: גֵּרָה
  choice: 季拉
  rationale: 这是古代较小的重量或币值单位，现代汉语没有直接对应单位，故采用通行音译。
- source_word: עֶשְׂרִים גֵּרָה יִהְיֶה הַשָּׁקֶל
  choice: 一舍客勒为二十季拉
  rationale: 简明保留原文对舍客勒单位的定义关系，同时符合现代汉语计量表达。
- source_word: יִהְיֶה
  choice: 都要；为
  rationale: 首处未完成式在律法语境中具有规定性，译作“都要”；第二处用于界定单位，译作“为”更自然。
