  text: וְ/אִם בְּהֵמָ֔ה אֲשֶׁ֨ר יַקְרִ֧יבוּ מִמֶּ֛/נָּה קָרְבָּ֖ן לַֽ/יהוָ֑ה כֹּל֩ אֲשֶׁ֨ר יִתֵּ֥ן מִמֶּ֛/נּוּ לַ/יהוָ֖ה יִֽהְיֶה קֹּֽדֶשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/009.yaml
  text: And if it is an animal from which they present an offering to Yahweh[a], everything that one gives from it to Yahweh shall be holy.
translation:
  language: zh_hans
  text: 如果是可从中取出祭物献给雅威的牲畜[a]，那么凡从其中献给雅威的，都要成为圣物。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“如果是从中献给雅威祭物的牲畜”。希伯来语既可指适合用来献祭的牲畜，也可指实际从中献上祭物的牲畜。
    reason: 保留关系从句在适献资格与实际献祭行为之间的词义和句法歧义。
lexical_decisions:
- source_word: וְאִם
  choice: 如果
  rationale: 承接前文，引出律例中的条件句；现代汉语中省去直译“并且”更自然，而条件关系仍然清楚。
- source_word: בְּהֵמָה
  choice: 牲畜
  rationale: 这里处于献祭语境，所指是可供人役用或献祭的家畜；“牲畜”比泛称“动物”更贴合语境。
- source_word: אֲשֶׁר יַקְרִיבוּ מִמֶּנָּה קָרְבָּן לַיהוָה
  choice: 可从中献祭物给雅威的
  rationale: יַקְרִיבוּ在祭祀语境中表示带来、呈献，מִמֶּנָּה表示祭物取自这一类牲畜。正文采用表示适合献祭的理解，同时以脚注保留也可能指实际献上的歧义。
- source_word: קָרְבָּן
  choice: 祭物
  rationale: 该词指带到神面前的供物；在本节献祭语境中，“祭物”简明、自然，并保留礼仪含义。
- source_word: לַיהוָה
  choice: 给雅威
  rationale: 直接音译神圣四字名יהוה为“雅威”，并以“给”表达献呈的对象。
- source_word: כֹּל אֲשֶׁר יִתֵּן
  choice: 凡……献……的
  rationale: 将希伯来语泛指单数自然地译为汉语“凡……的”，不额外限定行为人的性别。
- source_word: מִמֶּנּוּ
  choice: 从其中
  rationale: 回指前面的单数集合名词“牲畜”，保留祭物取自该牲畜的关系。
- source_word: יִהְיֶה קֹדֶשׁ
  choice: 都要成为圣物
  rationale: 表达其此后具有分别为圣、专属神的礼仪地位；“圣物”比抽象的“圣洁”更符合本段财物奉献的法律语境。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用神圣四字名；采用“雅威”音译，以呈现其作为立约之神专名的功能，不以称号替代。
- issue: יִהְיֶה קֹדֶשׁ所表达的地位
  choice: 都要成为圣物
  alternative: 都要成为圣的
  rationale: 本节讨论献给神之牲畜的礼仪和法律归属。“圣物”明确表达分别归神的状态，同时没有增添具体祭礼处置方式。
- issue: 关系从句描述适献资格还是实际献祭
  choice: 描述可从中献祭物的牲畜
  alternative: 描述实际从中献上祭物的牲畜
  rationale: 希伯来语关系从句在此可作类别描述，也可理解为实际行为。正文选用较符合律例分类语境的资格性表达，并以脚注保留另一种读法。
translation_notes:
  register: 采用现代、庄重而易懂的律例体。用“牲畜”“祭物”“圣物”维持祭祀语域；句式以“如果……那么凡……”清楚呈现条件和结论。
