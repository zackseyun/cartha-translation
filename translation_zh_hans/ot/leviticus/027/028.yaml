  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: אַךְ כָּל חֵ֡רֶם אֲשֶׁ֣ר יַחֲרִם֩ אִ֨ישׁ לַֽ/יהוָ֜ה מִ/כָּל אֲשֶׁר ל֗/וֹ מֵ/אָדָ֤ם וּ/בְהֵמָה֙ וּ/מִ/שְּׂדֵ֣ה אֲחֻזָּת֔/וֹ לֹ֥א יִמָּכֵ֖ר וְ/לֹ֣א יִגָּאֵ֑ל כָּל חֵ֕רֶם קֹֽדֶשׁ קָֽדָשִׁ֥ים ה֖וּא לַ/יהוָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/028.yaml
  text: However[a], every devoted thing that a man devotes to Yahweh from all that belongs to him—whether human or animal, or from the field of his inherited property—shall not be sold or redeemed. Every devoted thing is most holy to Yahweh.
translation:
  language: zh_hans
  text: 不过，人若把自己所有的，无论是人、牲畜，还是承受为业的田地，永献给耶和华，凡这样永献之物[a]都不可出售，也不可赎回。凡永献之物都归耶和华为至圣。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “永献之物”译自希伯来语ḥerem，是指不可撤回地分别归给耶和华之物；在某些语境中，这个词也可指被置于禁令之下或交付毁灭之物。
    reason: 说明专门术语的语义范围，并保留其在其他语境中所含的禁绝或毁灭意味。
lexical_decisions:
- source_word: אַךְ
  choice: 不过
  rationale: 在前文可赎回的许愿之物与本节不可赎回的永献之物之间形成限制性转折。
- source_word: חֵרֶם / יַחֲרִם
  choice: 永献之物 / 永献
  rationale: 这是指不可撤回地归给耶和华之物的专门用语；“永献”突出其不可转让、不可赎回的性质，同时不把某些语境中的毁灭含义直接写入正文。
- source_word: אִישׁ
  choice: 人
  rationale: 希伯来语为阳性单数，在法律条文中具有泛指作用；现代汉语以“人若”自然表达。
- source_word: לַיהוָה
  choice: 给耶和华 / 对耶和华
  rationale: 保留神名的专名形式，并依句法分别表达献归与圣洁关系。
- source_word: מֵאָדָם וּבְהֵמָה
  choice: 无论是人、牲畜
  rationale: אָדָם与牲畜相对，表示人类这一类别；בְּהֵמָה在此法律财产语境中译为“牲畜”较为贴切。
- source_word: וּמִשְּׂדֵה אֲחֻזָּתוֹ
  choice: 还是承受为业的田地
  rationale: אֲחֻזָּה指以色列家族所承受的产业，译文保留其世袭产业的法律背景。
- source_word: לֹא יִמָּכֵר וְלֹא יִגָּאֵל
  choice: 都不可出售，也不可赎回
  rationale: 清楚保留两个并列的法律禁令；“赎回”与本章有关许愿财物的术语一致。
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: 至圣的
  rationale: 这是希伯来语最高级表达，指最高程度的圣洁。
theological_decisions:
- issue: חֵרֶם在本节中的含义
  choice: 正文译为“永献之物”，强调不可撤回地献归耶和华。
  alternative: “当灭之物”或“被置于禁令之下的东西”
  rationale: 该词族在某些经文中确有禁绝或毁灭的含义，但本节直接强调不可出售、不可赎回及“至圣”。正文不武断限定其处置方式，相关语义范围在脚注说明。
- issue: 被永献者包括“人”的神学与法律张力
  choice: 按原文保留“人”这一类别，不在正文中解释其具体后果。
  alternative: 将其弱化为一般财物，或明确解释为处死、转作圣所服役
  rationale: 本节本身没有说明永献之人的具体处置；下一节另有相关规定。译文应保留原文的张力，避免提前作教义性裁定。
translation_notes:
  register: 采用现代、庄重而易懂的法律条文语体。“承受为业的田地”保留土地产业背景；“至圣”沿用清晰而凝练的礼仪术语。
