  text: וְ/אִם מָ֥ךְ הוּא֙ מֵֽ/עֶרְכֶּ֔/ךָ וְ/הֶֽעֱמִיד/וֹ֙ לִ/פְנֵ֣י הַ/כֹּהֵ֔ן וְ/הֶעֱרִ֥יךְ אֹת֖/וֹ הַ/כֹּהֵ֑ן עַל פִּ֗י אֲשֶׁ֤ר תַּשִּׂיג֙ יַ֣ד הַ/נֹּדֵ֔ר יַעֲרִיכֶ֖/נּוּ הַ/כֹּהֵֽן־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/008.yaml
  text: But if he is too poor for your valuation[a], then he shall be made to stand before the priest, and the priest shall assess him[b]; the priest shall assess him according to what the one making the vow can afford.
translation:
  language: zh_hans
  text: 但他若贫穷，无力负担你所定的估价[a]，就要让他站在祭司面前；祭司要为他估价。祭司要按照许愿之人所能负担的，为他估价[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他若低于你所定的估价。”希伯来文结构可较直译为此；这里的意思是他经济上无力达到或负担规定的估价。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译为“按照许愿之人的手所能达到的”；这是表示其经济能力的习语。
    reason: lexical_alternative
lexical_decisions:
- source_word: מָךְ הוּא מֵעֶרְכֶּךָ
  choice: 他若贫穷，负担不起你所定的估价
  rationale: מָךְ表示经济贫困；与מִן及“估价”连用，在本语境中指无力承担规定的估价。“贫穷，负担不起”以自然中文表达这种比较和经济能力不足，同时保留第二人称后缀。
- source_word: וְהֶעֱמִידוֹ לִפְנֵי הַכֹּהֵן
  choice: 就要让他站在祭司面前
  rationale: 使役形העמיד意为“使……站立”；此译保留正式程序，也不擅自明确希伯来文未明说的执行者。
- source_word: וְהֶעֱרִיךְ אֹתוֹ הַכֹּהֵן
  choice: 祭司要估定他的价
  rationale: ערך在本章是为许愿所涉及的人确定金额的法律术语。“估定他的价”既清楚表达金额评定，也避免把它误解为对人格价值的判断。
- source_word: עַל פִּי
  choice: 按照
  rationale: 该短语引出祭司评定金额所依据的标准，中文用“按照”自然、准确。
- source_word: אֲשֶׁר תַּשִּׂיג יַד הַנֹּדֵר
  choice: 许愿之人所能负担的
  rationale: 字面为“许愿之人的手所能达到的”，是表示经济能力的习语；译作“所能负担的”符合现代汉语表达。
- source_word: יַעֲרִיכֶנּוּ הַכֹּהֵן
  choice: 祭司要……估定他的价
  rationale: 与前面的ערך保持术语一致，呈现祭司按许愿者经济能力重新确定金额的程序。
theological_decisions: []
