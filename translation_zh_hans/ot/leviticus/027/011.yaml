  text: וְ/אִם֙ כָּל בְּהֵמָ֣ה טְמֵאָ֔ה אֲ֠שֶׁר לֹא יַקְרִ֧יבוּ מִמֶּ֛/נָּה קָרְבָּ֖ן לַֽ/יהוָ֑ה וְ/הֶֽעֱמִ֥יד אֶת הַ/בְּהֵמָ֖ה לִ/פְנֵ֥י הַ/כֹּהֵֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/011.yaml
  text: But if it is any unclean animal from which they may not present an offering to Yahweh[a], then he shall set the animal before the priest,
translation:
  language: zh_hans
  text: 但若是任何不洁净的牲畜，不可把它作为供物献给耶和华[a]，就要把那牲畜带到祭司面前，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“不可从这种牲畜献上供物给耶和华。”原文“献上”使用泛指的复数动词，可理解为“人不可献上”。
    reason: 说明希伯来文泛指复数的非人格用法，并保留“从其中”这一表达的字面译法。
lexical_decisions:
- source_word: וְאִם
  choice: 但若是
  rationale: 承接上一条条例并引出与洁净牲畜相对的条件情形；“但”表达转折推进，“若是”保留条件语气。
- source_word: כָּל בְּהֵמָה טְמֵאָה
  choice: 任何不洁净的牲畜
  rationale: כָּל与单数名词连用，在此表示不定范围“任何”；בְּהֵמָה在献祭与许愿财产的语境中译作“牲畜”自然；טְמֵאָה指礼仪上的不洁净。
- source_word: אֲשֶׁר לֹא יַקְרִיבוּ מִמֶּנָּה קָרְבָּן
  choice: 人不可从这类牲畜中取来献供物
  rationale: יַקְרִיבוּ虽为第三人称复数，却具有泛指、非人格用法，故译作“人不可”；מִמֶּנָּה保留“从其中”的来源含义；קָרְבָּן译作清楚而庄重的“供物”。
- source_word: לַיהוָה
  choice: 给耶和华
  rationale: 直接以现代中文通行形式“耶和华”呈现四字神名，并用“给”表达供物所献的对象。
- source_word: וְהֶעֱמִיד
  choice: 他就要……牵到
  rationale: העמיד的使役式本义为“使站立、安置”。对于牲畜，现代中文用“牵到……面前”自然地表达将它带去并置于指定位置；“就要”标明条件句的结果。
- source_word: אֶת הַבְּהֵמָה לִפְנֵי הַכֹּהֵן
  choice: 把那牲畜牵到祭司面前
  rationale: “那牲畜”回指前述对象；“祭司面前”保留正式接受祭司查验和估价的场景。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威；上主
  rationale: 原文明确使用四字神名。正文采用现代中文圣经传统中广为人知的专名“耶和华”，而不以称号取代神名。
- issue: 不洁净牲畜与献祭资格
  choice: 人不可从这类牲畜中取来献供物
  alternative: 不可把它献作供物
  rationale: 原文的מִמֶּנָּה可表示“从它／从这类牲畜中”，重点是这类牲畜不能作为献给耶和华之供物的来源。译文保留该结构，不把“不洁净”泛化为道德污秽，也不超出本节界定具体祭牲类别。
translation_notes:
  register: 采用现代、庄重而易懂的法律条例语体。“不洁净”保留礼仪术语色彩；“牲畜”“供物”“祭司面前”符合利未记语境。句末用逗号，以配合下一节继续说明祭司估价的程序。
