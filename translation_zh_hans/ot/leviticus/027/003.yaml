  text: וְ/הָיָ֤ה עֶרְכְּ/ךָ֙ הַ/זָּכָ֔ר מִ/בֶּן֙ עֶשְׂרִ֣ים שָׁנָ֔ה וְ/עַ֖ד בֶּן שִׁשִּׁ֣ים שָׁנָ֑ה וְ/הָיָ֣ה עֶרְכְּ/ךָ֗ חֲמִשִּׁ֛ים שֶׁ֥קֶל כֶּ֖סֶף בְּ/שֶׁ֥קֶל הַ/קֹּֽדֶשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/003.yaml
  text: And your valuation for the male from twenty years old up to sixty years old shall be fifty shekels of silver[a], according to the sanctuary shekel.
translation:
  language: zh_hans
  text: 你为二十岁至六十岁的男性所作的估价，应为五十舍客勒银子，按圣所的舍客勒[a]计算。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “舍客勒”是古代的重量单位；这里是按圣所所用的舍客勒标准计算。
    reason: 说明“舍客勒”的计量性质，并澄清“圣所的舍客勒”表示计量标准。
lexical_decisions:
- source_word: עֶרְכְּךָ
  choice: 你所估定的价
  rationale: עֵרֶךְ在利未记27章指许愿条例中按规定评定的金额，并非人的内在价值；保留第二人称单数后缀所表达的“你”。
- source_word: הַזָּכָר
  choice: 男性
  rationale: 原文是带定冠词的阳性单数，在这里界定按性别划分的估价类别；“男性”准确而不把它过度个体化为“男人”。
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וְעַד בֶּן שִׁשִּׁים שָׁנָה
  choice: 从二十岁到六十岁
  rationale: 自然表达原文所规定的年龄范围，同时保留两个端点。
- source_word: חֲמִשִּׁים שֶׁקֶל כֶּסֶף
  choice: 五十舍客勒银子
  rationale: 直译重量与金属的组合；“舍客勒”保留古代重量单位，避免误作现代货币。
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: 按圣所的舍客勒
  rationale: 介词בְּ在此表示计量标准；“圣所的舍客勒”指与圣所相关的规范重量，而非抽象意义上的“神圣舍客勒”。
- source_word: וְהָיָה ... וְהָיָה
  choice: 就要……估定为
  rationale: 在法律条例语境中表达规定性的结果；现代汉语用“就要”比机械重复“必为”更自然。
theological_decisions:
- issue: 按性别划分的估价类别
  choice: 男性
  alternative: 男人；男的
  rationale: 原文明确按性别与年龄设置估价类别，因此不作性别中和；这属于礼仪法律分类，并非对人格尊严作价值判断。
- issue: עֵרֶךְ在本章中的性质
  choice: 估定的价
  alternative: 价值；身价；估价
  rationale: 本节论及许愿之人的法定折价，不是在陈述人的内在价值，也不是一般市场价格；“估定的价”保留其礼仪与法律性质。
- issue: 圣所舍客勒的功能
  choice: 作为计量标准
  alternative: 指一笔献给圣所的钱
  rationale: בְּשֶׁקֶל הַקֹּדֶשׁ修饰金额的计算方式，说明采用圣所认可的舍客勒标准，而不是另加一项款额。
translation_notes:
  register: 采用现代、庄重而易懂的法规语体。“若是男性……就要……”使汉语句法自然；保留“舍客勒”这一传统音译，并以脚注解释。脚注标记置于整句末，所注内容涵盖金额单位及圣所计量标准。
