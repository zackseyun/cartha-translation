  text: לֹ֧א יְבַקֵּ֛ר בֵּֽין ט֥וֹב לָ/רַ֖ע וְ/לֹ֣א יְמִירֶ֑/נּוּ וְ/אִם הָמֵ֣ר יְמִירֶ֔/נּוּ וְ/הָֽיָה ה֧וּא וּ/תְמוּרָת֛/וֹ יִֽהְיֶה קֹ֖דֶשׁ לֹ֥א יִגָּאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/033.yaml
  text: He shall not inspect whether it is good or bad[a], nor shall he exchange it; and if he does in fact exchange it, then both it and its substitute shall be holy[b]; it shall not be redeemed.
translation:
  language: zh_hans
  text: 不可察验其好坏[a]，也不可用别的替换它；若真的替换了它，原来的和替代的那只都要成为圣物[b]，不可赎回。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“不可在好坏之间加以辨别。”这是指不可按牲畜的品质挑选。
    reason: lexical_alternative
  - marker: b
    text: 希伯来语用同一词根的不定式绝对形和限定动词加强语气，也可译为：“若确实替换了它。”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְבַקֵּר
  choice: 察看
  rationale: 此处为献祭法规语境，指察验并挑选什一牲畜；“察看”既保留检验之意，也能自然连接后面的“是好是坏”。
- source_word: בֵּין טוֹב לָרַע
  choice: 是好是坏
  rationale: 希伯来语字面为“在好与坏之间”，这里指按牲畜品质加以区分；译作“是好是坏”符合现代汉语，同时保留评价与挑选的含义。
- source_word: יְמִירֶנּוּ / הָמֵר יְמִירֶנּוּ
  choice: 把它换掉／确实把它换掉
  rationale: מור在本段指以另一只牲畜替换已经归圣的牲畜。“换掉”自然明确；“确实”体现不定式绝对形与限定动词连用所产生的强调。
- source_word: תְמוּרָתוֹ
  choice: 替换的
  rationale: 指用来取代原来那只牲畜的另一只牲畜。结合“原来的”表达，现代汉语简洁而清楚。
- source_word: קֹדֶשׁ
  choice: 圣物
  rationale: 此处不是泛指道德上的圣洁，而是说明两只牲畜都归给上帝、具有礼仪法规上的神圣地位；“成为圣物”准确传达其名词性用法和祭祀语域。
- source_word: לֹא יִגָּאֵל
  choice: 不可赎回
  rationale: גאל的尼法勒形在此指已归圣之物不得付价取回。“赎回”保留利未记中的法律与礼仪术语一致性。
- source_word: הוּא וּתְמוּרָתוֹ
  choice: 原来的和替换的都
  rationale: 明确指出原牲畜和替代牲畜两者都具有归圣地位，也使代词在汉语中所指清楚。
theological_decisions:
- issue: 归圣与赎回用语的礼仪法律效力
  choice: 将קֹדֶשׁ译为“圣物”，将גאל译为“赎回”。
  alternative: 较宽泛地译为“归作神圣”与“买回”。
  rationale: 本节论及以色列敬拜法规中归给上帝的牲畜。“圣物”和“赎回”保留原文的礼仪及法律语域，同时不引入后期教义含义。
translation_notes:
  register: 采用现代、庄重而易懂的法规文体。“不可”体现禁令语气；以“圣物”和“赎回”维持利未记礼仪法律术语的一致性。所有脚注标记均已置于正文相应位置。
