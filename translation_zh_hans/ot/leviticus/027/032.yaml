  text: וְ/כָל מַעְשַׂ֤ר בָּקָר֙ וָ/צֹ֔אן כֹּ֥ל אֲשֶׁר יַעֲבֹ֖ר תַּ֣חַת הַ/שָּׁ֑בֶט הָֽ/עֲשִׂירִ֕י יִֽהְיֶה קֹּ֖דֶשׁ לַֽ/יהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/032.yaml
  text: And every tithe of the herd and the flock[a], every tenth animal that passes under the rod[b], shall be holy to Yahweh.
translation:
  language: zh_hans
  text: 牛群和羊群的十分之一，就是从杖下经过时每逢第十只，都要归雅威为圣。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “杖”也可译作“牧杖”。这里描写牲畜逐只从牧人的杖下经过，以便点数；每逢第十只，就归雅威为圣。
    reason: 说明“从杖下经过”的古代牧养和点数背景。
lexical_decisions:
- source_word: מַעְשַׂר
  choice: 当献的十分之一
  rationale: 这是指分别出来奉献的“第十份”。译作“当献的十分之一”既保留比例意义，也符合本节牲畜逐只计数的法律语境。
- source_word: בָּקָר וָצֹאן
  choice: 牛群羊群
  rationale: בָּקָר指牛类牲畜，צֹאן是绵羊、山羊等小型群居牲畜的集合称呼；“牛群羊群”简洁自然，并保留两类牲畜的对应。
- source_word: כֹּל אֲשֶׁר יַעֲבֹר תַּחַת הַשָּׁבֶט
  choice: 从牧杖下经过的
  rationale: 保留牲畜逐只从杖下经过、接受点数的牧养图景；补出“牧”字可帮助现代读者识别此杖的用途。
- source_word: הָעֲשִׂירִי
  choice: 每第十只
  rationale: 原文直译为“第十个”，所指牲畜由上下文隐含。中文补出量词“只”，并以“每”表达连续点数时每逢第十只的分配意义。
- source_word: יִהְיֶה קֹּדֶשׁ
  choice: 都要……为圣
  rationale: 直接保留“成为／算为圣”的圣洁类别及法律规定的语气，不改写为较具解释性的“献上”。
- source_word: לַיהוָה
  choice: 归雅威
  rationale: 介词ל在这里表示归属或奉献对象；“归雅威为圣”自然表达这些牲畜被分别归给雅威。神名按原文专名译作“雅威”。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文明确使用四字神名。采用“雅威”保留其专名性质，不以称号替代，也不引入特定宗派解释。
- issue: קֹדֶשׁ的祭祀法律含义
  choice: 归雅威为圣
  alternative: 献给雅威；归雅威所有
  rationale: “为圣”保留原文的神学与法律范畴，即该牲畜被分别归给雅威；单译“献给”或“归所有”会削弱“圣”的明确措辞。
- issue: “十分之一”与“每第十只”的关系
  choice: 两者都保留
  alternative: 只译作“每第十只”
  rationale: 原文同时出现מַעְשַׂר与הָעֲשִׂירִי，形成概括与具体点数规则的复述。译文保留这种略带重复的结构，不把两项静默合并。
translation_notes:
  register: 采用现代、庄重而易懂的法律叙述。保留原文“十分之一”与“第十只”的复述，并用“就是”表明后半句具体说明前半句；避免使用生僻祭祀术语。
