base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/021.yaml
  text: But the field[a], when it is released in the Jubilee, shall be holy to Yahweh, like a field devoted to destruction; it shall be the priest’s possession.
translation:
  language: zh_hans
  text: 但这块田在禧年归出时，要归耶和华为圣，像永献[a]的田一样；它要归祭司为产业。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “永献”所译的希伯来词，指不可撤回地献给耶和华、从人的日常使用中除去之物；在某些语境中也可指被置于禁令之下、交付毁灭之物。
    reason: 说明 חֵרֶם 的特殊法律与宗教含义，并保留其语义范围。
lexical_decisions:
- source_word: וְהָיָה הַשָּׂדֶה
  choice: 但……这块田……要
  rationale: 连接前文的法律情形，并带出与上一节赎回安排相对的结果；“这块田”自然指回前文所说的田。
- source_word: בְּצֵאתוֹ בַיֹּבֵל
  choice: 到了禧年，这块田归出时
  rationale: 保留“出去、归出”的产权法语意象，同时用“到了禧年”明确其发生时点；不擅自补出原文未明说的归属对象。
- source_word: קֹדֶשׁ לַיהוָה
  choice: 要归耶和华为圣
  rationale: 表达该田被分别归给耶和华的圣洁地位；以“耶和华”直接对应圣名 יהוה。
- source_word: כִּשְׂדֵה הַחֵרֶם
  choice: 像永献的田一样
  rationale: “永献”表达 חֵרֶם 不可撤回、脱离一般人使用的性质，又避免在本处直接限定为实际毁灭；脚注补充其语义力度。
- source_word: לַכֹּהֵן תִּהְיֶה אֲחֻזָּתוֹ
  choice: 它要归祭司为产业
  rationale: לַכֹּהֵן 表示归属，אֲחֻזָּה 指土地产业或世袭地业；此译自然呈现禧年时确定的产权结果。
theological_decisions:
- issue: 圣名 יהוה 的译法
  choice: 耶和华
  alternative: 上主
  rationale: 采用现代中文圣经读者熟悉的专名形式，明确原文出现的是以色列上帝的圣名，而非普通称号。
- issue: חֵרֶם 在圣洁律例中的含义
  choice: 永献
  alternative: 当灭之物；禁献
  rationale: 本节比较的重点是土地不可撤回地归给上帝并退出一般人的支配。“永献”保留其不可赎回性；脚注同时说明该词在其他语境中也可能涉及毁灭，避免把本节的含义缩窄或淡化。
- issue: 禧年时田地“出去”的法律含义
  choice: 归出
  alternative: 释放；归还
  rationale: 原文只说田地“出去”，没有在本分句明说归还给谁。“归出”保留法律语境和原文的开放性，后半句再明确它归祭司为产业。
translation_notes:
  register: 采用庄重而易懂的现代标准普通话。“归出”和“产业”保留土地律例的法律色彩；句式尽量清晰，不补入原文未明确说明的中间产权关系。
