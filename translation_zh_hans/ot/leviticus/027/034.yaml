  text: אֵ֣לֶּה הַ/מִּצְוֺ֗ת אֲשֶׁ֨ר צִוָּ֧ה יְהוָ֛ה אֶת מֹשֶׁ֖ה אֶל בְּנֵ֣י יִשְׂרָאֵ֑ל בְּ/הַ֖ר סִינָֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/034.yaml
  text: These are the commandments that Yahweh commanded Moses for the sons of Israel at Mount Sinai[a].
translation:
  language: zh_hans
  text: 这些是雅威在西奈山为以色列子孙所吩咐摩西的诫命。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “为以色列子孙”也可译为“给以色列子孙的”或“向以色列子孙所颁布的”。
    reason: 保留介词אֶל在此可表示对象、方向或相关关系的译法差异。
lexical_decisions:
- source_word: אֵלֶּה הַמִּצְוֺת
  choice: 这些就是……诫命
  rationale: אֵלֶּה引出全书末尾的总结语；中文用“这些就是”自然体现判断句。מִצְוֹת译为“诫命”，保留其法律与权威色彩。
- source_word: צִוָּה
  choice: 吩咐
  rationale: 准确表达发布命令的动作，并与“诫命”保持词义联系；在涉及上帝对摩西说话时，“吩咐”庄重而自然。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文四字神名作音译，保留其作为专名的性质，不以称号替代。
- source_word: אֶת מֹשֶׁה
  choice: 摩西
  rationale: אֶת标明摩西是צִוָּה的直接宾语；中文以“吩咐摩西”自然呈现这一关系。
- source_word: אֶל בְּנֵי יִשְׂרָאֵל
  choice: 传给以色列子孙
  rationale: אֶל表示命令所指向的对象；结合语境，以“传给”表达摩西受命将诫命交付给以色列子孙，同时用脚注保留介词关系的其他译法。בְּנֵי יִשְׂרָאֵל直译为“以色列子孙”。
- source_word: בְּהַר סִינָי
  choice: 在西奈山
  rationale: בְּ在此表示地点；“在西奈山”是自然且贴近原文的中文表达。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名，因此采用现代汉语中贴近YHWH读音的“雅威”，保存专名性质；不以“主”这一称号替代。
- issue: בְּנֵי יִשְׂרָאֵל的译法
  choice: 以色列子孙
  alternative: 以色列人；以色列百姓
  rationale: 保留希伯来语“以色列的众子”这一传统族群表达；此处指整个以色列群体，并非仅指男性。
- issue: אֶל所表达的关系
  choice: 传给以色列子孙
  alternative: 向以色列子孙；给以色列子孙的
  rationale: 介词אֶל基本表示方向或对象；上下文表明摩西受命把诫命传达给以色列，因此正文采用通顺的“传给”，脚注保留较形式对应的译法。
translation_notes:
  register: 采用现代、庄重而清楚的标准普通话。“这些就是”体现结语性质；“诫命”“吩咐”保持法律语域及词义呼应。句式略作汉语化，以免按希伯来语结构直译而生硬。
