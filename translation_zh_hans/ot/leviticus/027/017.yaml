  text: אִם מִ/שְּׁנַ֥ת הַ/יֹּבֵ֖ל יַקְדִּ֣ישׁ שָׂדֵ֑/הוּ כְּ/עֶרְכְּ/ךָ֖ יָקֽוּם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/017.yaml
  text: If he consecrates his field from the year of jubilee[a], your valuation shall stand.
translation:
  language: zh_hans
  text: 如果他从禧年那一年起将自己的田地分别为圣[a]，你所作的估价就应当有效。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“奉献”。希伯来语动词含有把某物分别出来、归作圣用的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: 如果
  rationale: 标准条件连词，用来引出这一条例所设定的情形。
- source_word: מִשְּׁנַת הַיֹּבֵל
  choice: 从禧年那一年起
  rationale: 介词 מִן 表示时间起点；这样译也与下文按距离下一禧年尚余年数估价的制度相符。
- source_word: יַקְדִּישׁ
  choice: 分别为圣
  rationale: קדשׁ 的使役式在此表示把产业划归神圣用途；“分别为圣”保留其礼仪和神圣含义。
- source_word: שָׂדֵהוּ
  choice: 自己的田地
  rationale: 自然表达第三人称单数所有关系，并清楚回指献田者。
- source_word: כְּעֶרְכְּךָ
  choice: 你所估定的价值
  rationale: 指受话者所作的估价；结合本章语境，受话者是祭司，但原句未在本节重述其身份，因此不直接增补“祭司”。
- source_word: יָקוּם
  choice: 就应当成立
  rationale: קום 在法律与行政语境中表示有效、成立；“应当成立”既保留规范性语气，也符合现代汉语法律文体。
theological_decisions:
- issue: 将田地划归神圣用途的礼仪性动词
  choice: 分别为圣
  alternative: 奉献
  rationale: “分别为圣”较明确地保留 קדשׁ 所含的神圣、礼仪性意义；“奉献”较自然，却可能弱化“使之成为圣物”的含义。
- issue: 估价者的身份
  choice: 保留第二人称“你”，不明说祭司
  alternative: 译作“祭司所估定的价值”
  rationale: 上下文可确认受话者与祭司有关，但本节希伯来文本只用第二人称后缀；保留原文表达可避免把语境说明写入正文。
translation_notes:
  register: 采用现代、庄重而易懂的条例文体。“从禧年那一年起”明确时间起点；“所估定的价值……成立”保留原文法律措辞。
