base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/007.yaml
  text: And if from sixty years old and upward[a], if male, then your valuation shall be fifteen shekels[b], and for the female ten shekels.
translation:
  language: zh_hans
  text: 若有人年满六十岁或以上，若为男性，你所定的价额就是十五舍客勒；女性则为十舍客勒。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“从六十岁起。”
    reason: lexical_alternative
lexical_decisions:
- source_word: מִבֶּן שִׁשִּׁים שָׁנָה וָמַעְלָה
  choice: 六十岁以上的人
  rationale: 该希伯来语习语表示从六十岁起、包括六十岁的年龄范围；现代汉语“六十岁以上”自然且通常包含六十岁，补出“的人”使句意完整。
- source_word: זָכָר
  choice: 男的
  rationale: 原词指生理性别，不特指成年男子；“男的”与下文“女的”对应，适合涵盖本节所说的年龄群体。
- source_word: עֶרְכְּךָ
  choice: 你所定的价
  rationale: 本章中该词是许愿条例里的技术用语，指按规定为人核定的价额；此译既保留第二人称形式，也比“你的估价”更清楚地表达受词关系。
- source_word: חֲמִשָּׁה עָשָׂר שָׁקֶל
  choice: 十五舍客勒
  rationale: 直接译出数目与古代重量、货币单位，并沿用中文圣经语境中常见的音译“舍客勒”。
- source_word: לַנְּקֵבָה
  choice: 女的则是
  rationale: 原文介词引出女性对应的定价；“则是”自然呈现男女两项的对照。
- source_word: עֲשָׂרָה שְׁקָלִים
  choice: 十舍客勒
  rationale: 直接译出数目和单位。
