  text: וְ/חִשַּׁב ל֣/וֹ הַ/כֹּהֵ֗ן אֵ֚ת מִכְסַ֣ת הָֽ/עֶרְכְּ/ךָ֔ עַ֖ד שְׁנַ֣ת הַ/יֹּבֵ֑ל וְ/נָתַ֤ן אֶת הָ/עֶרְכְּ/ךָ֙ בַּ/יּ֣וֹם הַ/ה֔וּא קֹ֖דֶשׁ לַ/יהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/023.yaml
  text: then the priest shall calculate for him the proportion of your valuation up to the Year of Jubilee[a], and on that day he shall give your valuation as a holy offering to Yahweh.
translation:
  language: zh_hans
  text: 祭司要为他算出你的估价额中截至禧年相应的数额；那人要在当天交付这估价额，归耶和华为圣。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“归耶和华为圣。”
    reason: 保留 קֹדֶשׁ לַיהוָה 的更形式对应译法；正文同样保留该表达，脚注提示其直译性质。
lexical_decisions:
- source_word: וְחִשַּׁב
  choice: 要……算出
  rationale: חשׁב 的 Piel 形在这里指计算、核算金额；“算出”符合现代汉语法律条文语体。
- source_word: לּוֹ
  choice: 为他
  rationale: 此与格代词表示祭司为有关的人核算应付金额。
- source_word: מִכְסַת
  choice: 应付的份额
  rationale: מִכְסָה 可指规定的数额或相应比例；本节按距离禧年的时段折算，因此译作“份额”，并以“应付的”说明其实际功能。
- source_word: הָעֶרְכְּךָ
  choice: 你所估的价额
  rationale: עֵרֶךְ 是利未记27章关于许愿估价的术语；保留第二人称单数后缀，并用自然的现代汉语表达。
- source_word: עַד שְׁנַת הַיֹּבֵל
  choice: 直到禧年为止
  rationale: 该短语表示折算期限的终点；“禧年”是此制度在汉语圣经传统中通行且清楚的名称。
- source_word: וְנָתַן
  choice: 那人要……交出
  rationale: נתן 基本义为“给、交出”。上下文表明付款者是献地的人，而不是负责计算的祭司；“交出”也避免把动作过度限定为某种现代付款方式。
- source_word: בַּיּוֹם הַהוּא
  choice: 在当天
  rationale: 直接表达同一日履行交付义务的时间要求。
- source_word: קֹדֶשׁ לַיהוָה
  choice: 作为归耶和华为圣之物
  rationale: 贴近原文“归耶和华为圣”，并让该短语在“交出价额”之后形成自然、完整的汉语句子，不额外限定为某一类祭物。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代汉语圣经读者熟悉的专名形式来表达四字神名。
theological_decisions:
- issue: וְנָתַן 的隐含主语
  choice: 以“那人”指献地并负责交付价额的人
  alternative: 仍以祭司为主语，或仅译“他”而保留表面歧义
  rationale: 希伯来语未明说主语，形式上可承接“祭司”，但本段分工是祭司核算、献地者交付。若汉语仅说“他”，通常会被理解为祭司，反而造成误导，因此按上下文译作“那人”。
- issue: קֹדֶשׁ לַיהוָה 的表达
  choice: 归耶和华为圣之物
  alternative: 作为献给耶和华的圣物
  rationale: 所交价额具有归耶和华、分别为圣的性质。所选译法保留原文简洁的圣别用语，也避免用“献给”过度解释具体礼仪动作。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语，并保留利未记27章估价条例的法律与礼仪语域。“估价额”“份额”“交出”既便于普通读者理解，也维持术语的一致性。
