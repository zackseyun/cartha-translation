  text: But if a man redeems any of his tithe[a], he shall add a fifth to it.
translation:
  language: zh_hans
  text: 但人若赎回[a]自己十分之一中的一部分，就要在原数上加五分之一。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “赎回”原文采用同一动词的不定词绝对式与未完成式连用，是带有强调语气的结构。
    reason: 说明希伯来文正文中难以在自然汉语里直接重现的强调结构。
lexical_decisions:
- source_word: וְ/אִם
  choice: 但……若
  rationale: 连接词与条件词引出律法条款中的另一种情况；“但……若”既保留承接中略带转折的语气，也符合现代汉语表达。
- source_word: גָּאֹל יִגְאַל
  choice: 赎回
  rationale: גאל在此指付出相应价值取回已经分别为圣的份额。原文以不定词绝对式配合同根未完成式加强语气；正文采用自然的“赎回”，并以脚注说明其强调结构，避免把它过度解释为意愿。
- source_word: אִישׁ
  choice: 人
  rationale: 该词虽为阳性单数，但在律法条文中泛指适用此规定的个人；现代汉语用“人”自然且不损失原意。
- source_word: מִ/מַּעַשְׂר/וֹ
  choice: 自己所献的十分之一中的一部分
  rationale: 介词מִן在此具有部分义，表示从此人的十分之一中赎回一部分。“所献的”依据本段关于归给耶和华之十分之一的语境，使汉语指向清楚。
- source_word: חֲמִשִׁית/וֹ
  choice: 五分之一
  rationale: 该词表示一个五分之一的份额；“五分之一”是现代汉语中准确、自然的数量表达。
- source_word: יֹסֵף עָלָיו
  choice: 在原数上加五分之一
  rationale: 使役形动词表示“加上”，עַל表示加在原有数额之上；汉语补出“原数”，清楚表达须在本金之外增加五分之一。
