  source_fidelity: “永献”可恰当保留חֵרֶם／חרם的专门奉献—禁绝含义，而“不可赎回；必须处死”准确传达יִפָּדֶה与强调式מוֹת יוּמָת。不过，正文的“永献之物”与“从人中”及处死条款相冲突，容易把该人称为物品；应在汉语中明确其人为对象，同时保留“永献”的技术性措辞。
  naturalness: “凡……的人，都不可赎回；必须处死”符合现代庄重的法律文体，且避免“被归为永献之物的”这一较为生硬、指称不协调的结构。
  terminology: 以“被归作永献的人”保留“永献”作为חֵרֶם的关联术语，并使动词表达与之相连。“赎回”及“必须处死”均可保留。脚注的替代译文改为语法完整的“被定为毁灭的人”，作为将ḥerem的毁灭含义显化的译法，不把它强加于正文。
