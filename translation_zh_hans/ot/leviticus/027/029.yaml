  text: כָּל חֵ֗רֶם אֲשֶׁ֧ר יָחֳרַ֛ם מִן הָ/אָדָ֖ם לֹ֣א יִפָּדֶ֑ה מ֖וֹת יוּמָֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/029.yaml
  text: No devoted thing that is devoted from man may be redeemed[b][a]; it must surely be put to death.
translation:
  language: zh_hans
  text: 凡从人中[a]被归作永献的人，都不可赎回；必须处死。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “从人中”指人类中的人，即一个人。
    reason: lexical_alternative
  - marker: b
    text: 或译：“凡从人中被定为毁灭的人，都不可赎回；必须处死。”
    reason: alternative_reading
lexical_decisions:
- source_word: חֵרֶם
  choice: 永献之物
  rationale: 该词是祭祀与律法语境中的专门用语，指不可撤回地归给上帝之物；在某些语境中也含有交付毁灭之意。“永献之物”保留其专门性质，不在正文中预先消解这种张力。
- source_word: יָחֳרַם
  choice: 被归为永献之物
  rationale: 采用被动表达，保留该动词与 חֵרֶם 的词根联系，也体现被置于这种不可赎回状态之下的含义。
- source_word: מִן הָאָדָם
  choice: 从人中
  rationale: 这里表示所说对象属于人类，即是人，而不是一般物品。“从人中”既贴近原文，也符合现代汉语；脚注进一步说明。
- source_word: יִפָּדֶה
  choice: 不可赎回
  rationale: פדה 在本章估价、赎回的律法语境中表示付出代价赎回；“赎回”准确保留法律与祭祀色彩。
- source_word: מוֹת יוּמָת
  choice: 必须处死
  rationale: 不定式绝对形与限定动词连用，强调死亡判决的确定性；“必须处死”以自然简洁的汉语传达这种加强语气和被动含义。
theological_decisions:
- issue: 涉及人的 חֵרֶם 应理解为永献，还是明确译为交付毁灭
  choice: 正文保留“永献之物”这一祭祀—律法专门用语
  alternative: 凡从人中被列为当灭之人的，都不可赎回；必须处死。
  rationale: 原文把 חרם／פדה 的奉献与赎回术语同处死公式并置。正文保留这种神学和法律上的张力，不把 חֵרֶם 的全部意义直接归结为死刑；另一种更明确的理解列入脚注。
- issue: אָדָם 在本节所指的范围
  choice: 译作“从人中”，明确其对象为人类中的一个人
  alternative: 属于人的；从人类中
  rationale: 介词短语 מִן־הָאָדָם 在这里说明永献对象的类别或来源，即人类中的人。“从人中”既不把 אָדָם 限定为男性，也避免误解为人的所有物。
translation_notes:
  register: 采用现代、庄重而易懂的律法文体。“永献之物”作为本章的专门术语，保留原文中奉献、禁令与毁灭之间未完全展开的语义张力；分号突出不可赎回与必须处死两项紧密相连的规定。
