- from: 凡从人中[a]被归为永献之物的，都不可赎回；必须处死。[b]
  to: 凡从人中[a]被归作永献的人，都不可赎回；必须处死。[b]
  rationale: 修订仅消除汉语中“物”与人的指称冲突，并修正替代译文的句法。正文仍以“永献”保存原文在奉献、禁绝及死亡判决之间的技术性张力；脚注提供将其毁灭含义明确化的可行替代读法。
