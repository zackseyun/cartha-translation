source:
  edition: WLC
  text: וְ/אִם֙ אֶת שְׂדֵ֣ה מִקְנָת֔/וֹ אֲשֶׁ֕ר לֹ֖א מִ/שְּׂדֵ֣ה אֲחֻזָּת֑/וֹ יַקְדִּ֖ישׁ לַֽ/יהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/022.yaml
  text: But if he consecrates to Yahweh a field of his purchase[a], which is not from the field of his inherited property,
translation:
  language: zh_hans
  text: 如果有人把自己买来的一块田，就是不属于他祖业的田，分别为圣，归给雅威，
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאִם
  choice: 如果
  rationale: 承接前文并引入另一种条件情形；现代汉语中用“如果”即可自然表达，毋须硬译连接词 וְ。
- source_word: שְׂדֵה מִקְנָתוֹ
  choice: 自己买来的一块田
  rationale: 表达该田是购得而非承受祖业所得，既符合希伯来语构造的意义，也比“购买之田”更自然易懂。
- source_word: אֲשֶׁר לֹא מִשְּׂדֵה אֲחֻזָּתוֹ
  choice: 就是不属于他祖业的田
  rationale: אֲחֻזָּה 在本章土地法规中指世袭持有的产业；“祖业”清楚保留其家族承继和土地权属含义。希伯来语 מִן 在此表示该田并非出自或属于其世袭地产，汉语以“不属于”自然呈现。
- source_word: יַקְדִּישׁ
  choice: 分别为圣归给
  rationale: 该动词在本章指因许愿或奉献而把财产划归神圣用途；“分别为圣归给”兼顾礼仪法律色彩和归属方向。
- source_word: לַיהוָה
  choice: 归给耶和华
  rationale: 介词 לְ 表示奉献的归属对象；以“归给”与前面的“分别为圣”顺畅衔接。神名 יהוה 音译为“耶和华”，符合现代简体中文圣经语域中广为人知的专名形式。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文明确使用四字神名。中文采用通行且易识别的专名“耶和华”，而不以“主”替代，因此保留其作为盟约神名的性质；“雅威”是较贴近学术拟音的可行替代。
- issue: קָדַשׁ 的奉献含义
  choice: 分别为圣归给
  alternative: 奉献给
  rationale: 这里不仅泛指赠予，也指在礼仪和法律上将田地划为圣物；所选译法保留这一神圣归属含义，不额外规定具体仪式。
translation_notes:
  register: 采用现代、庄重而易懂的法律条例语体。本节句法未完，末尾保留逗号以承接下一节。主句用“自己买来的一块田”，避免生硬的名词化表达；关系从句以“就是”补充界定田地性质。
