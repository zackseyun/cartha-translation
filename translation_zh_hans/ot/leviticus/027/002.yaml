  text: דַּבֵּ֞ר אֶל בְּנֵ֤י יִשְׂרָאֵל֙ וְ/אָמַרְתָּ֣ אֲלֵ/הֶ֔ם אִ֕ישׁ כִּ֥י יַפְלִ֖א נֶ֑דֶר בְּ/עֶרְכְּ/ךָ֥ נְפָשֹׁ֖ת לַֽ/יהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/002.yaml
  text: 'Speak to the sons of Israel and say to them: When a man makes a special vow, involving the valuation of persons to Yahweh,'
translation:
  language: zh_hans
  text: “你要对以色列人说：若有人许一个特别的愿，涉及归给雅威之人的估价[a]，”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语此短语句法困难，直译可作：“照你的估价，归给雅威的人。”这里的“你的”是第二人称单数，指向摩西；其含义是本章随后所规定、关于人的估定价值。
    reason: 原文בְּעֶרְכְּךָ נְפָשֹׁת לַיהוָה的句法和“你的”所指存在解释空间；脚注保留较形式对应的译法，并说明后文语境。
lexical_decisions:
- source_word: דַּבֵּר אֶל־בְּנֵי יִשְׂרָאֵל
  choice: 你要告诉以色列人
  rationale: דַּבֵּר是加强词干命令式，用于正式传令；“告诉”配合“对他们说”在现代汉语中自然庄重。בְּנֵי יִשְׂרָאֵל字面为“以色列的众子”，此处指整个约民群体，译作“以色列人”更符合现代汉语习惯，且不误限定为男性。
- source_word: אִישׁ
  choice: 有人
  rationale: 虽为阳性单数名词，但在本法律条文中具有泛指、代表性的作用；“有人”准确表达适用于个体的条件句，不额外断定该规定只涉及男性。
- source_word: יַפְלִא נֶדֶר
  choice: 许特别的愿
  rationale: יַפְלִא是פלא的使役词干形式，在此表示作出非同寻常或特别的许愿；“许特别的愿”既保留其标记性，也符合汉语宗教法律语体。
- source_word: בְּעֶרְכְּךָ נְפָשֹׁת
  choice: 把人按估价
  rationale: 该短语句法困难。עֶרְכְּךָ含第二人称阳性单数后缀，指本章随后规定的估定价值；נְפָשֹׁת在此指人，而非非物质意义的“灵魂”。“把人按估价”保留估价与人的关联，同时避免把摩西说成每次亲自估价的人。
- source_word: לַיהוָה
  choice: 献给雅威
  rationale: 介词ל表示许愿所归向的对象；“献给”符合奉献语境。יהוה按其专名译作“雅威”，保留经文中的盟约之名。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华／上主
  rationale: 原文直接使用四字神名；采用“雅威”作为现代汉语中较接近学术重构读音的专名译法，不以称号替代专名。
- issue: אִישׁ在法律条件句中的性别表达
  choice: 有人
  alternative: 一个男人
  rationale: 这里的阳性单数构成一般法律个案，而后文估价对象明确包括男女；译作“有人”保留泛指法律效力，避免在本节无根据地把许愿者限定为男性。
- issue: בְּעֶרְכְּךָ נְפָשֹׁת的关系
  choice: 把人按估价献给雅威
  alternative: 照你的估价，将人献给雅威
  rationale: 希伯来语结构含义不易确定，可能突出法定估价，也可能保留对摩西的第二人称措辞。正文用自然汉语表达估价所涉的奉献关系，脚注交代较形式对应的读法，不把歧义完全消解。
translation_notes:
  register: 采用现代、庄重而易懂的法律—敬拜语体。“以色列人”自然表达约民整体；“许特别的愿”保留该愿的特殊性质；“按估价”与后续条文衔接。
