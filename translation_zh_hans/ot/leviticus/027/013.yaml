  yaml_path: translation/ot/leviticus/027/013.yaml
  text: But if he does redeem it[a], then he shall add a fifth to your valuation.
translation:
  language: zh_hans
  text: 但他若确实赎回那牲畜[a]，就要在你所估定的价钱上再加五分之一。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“他若赎回那牲畜”或“他若一定赎回那牲畜”。希伯来语以不定式绝对形与限定动词连用，对“赎回”加以强调。
    reason: 保留希伯来语强调结构可能采用的不同译法，避免把强调程度解释得过死。
lexical_decisions:
- source_word: וְאִם
  choice: 但……若
  rationale: 本节承接上一节关于不洁净牲畜估价的规定，并转入赎回这一对比情形；“但……若”既保留条件关系，也体现语流中的转折。
- source_word: גָּאֹל יִגְאָלֶנָּה
  choice: 他若确实赎回那牲畜
  rationale: 不定式绝对形与限定动词连用，对“赎回”加以强调；“确实赎回”保留这种强调，而不把它解释成单纯的意愿。阴性宾语后缀回指上一节所说的牲畜，正文明确译为“那牲畜”，便于独立阅读。
- source_word: וְיָסַף
  choice: 就要……再加
  rationale: 此处连接词加完成式表达条件成立后必须采取的法律后果；“就要”体现规定性，“再加”表明是在估价之外追加。
- source_word: חֲמִישִׁתוֹ
  choice: 五分之一
  rationale: 该词表示一个五分之一的份额。中文用“再加五分之一”自然表达按既定估价追加百分之二十，同时不加入原文没有明说的额外名词。
- source_word: עַל עֶרְכֶּךָ
  choice: 在你所估定的价钱上
  rationale: עַל在“加添”的结构中表示加在原数额之上；עֶרְכֶּךָ是第二人称阳性单数，指祭司所作的估价，因此译作“你所估定的价钱”。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的法律条文语体。“估定的价钱”比单说“估价”更清楚地表示祭司评定的金额；“那牲畜”承接上文，避免孤立经节中的代词指向不明。
