  text: וְ/אִ֗ישׁ כִּֽי יַקְדִּ֨שׁ אֶת בֵּית֥/וֹ קֹ֨דֶשׁ֙ לַֽ/יהוָ֔ה וְ/הֶעֱרִיכ/וֹ֙ הַ/כֹּהֵ֔ן בֵּ֥ין ט֖וֹב וּ/בֵ֣ין רָ֑ע כַּ/אֲשֶׁ֨ר יַעֲרִ֥יךְ אֹת֛/וֹ הַ/כֹּהֵ֖ן כֵּ֥ן יָקֽוּם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/014.yaml
  text: And if a man consecrates his house as holy to Yahweh[a], then the priest shall assess it, whether good or bad; as the priest assesses it[b], so it shall stand.
translation:
  language: zh_hans
  text: 若有人把自己的房屋分别为圣，归给耶和华[a]，祭司就要按房屋的好坏[b]估定它的价值；祭司怎样估定[c]，就以所估的为准。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “耶和华”对应希伯来文神名 יהוה（YHWH）；也常译作“雅威”，或按传统以“上主”代称。
    reason: divine_name
  - marker: b
    text: “好坏”指房屋在祭司估价时的状况或质量如何。
    reason: cultural_note
  - marker: c
    text: “估定”也可译作“估价”或“评定价值”；本节重复使用同一个希伯来语动词，指祭司作出具有约束力的估价。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ כִּי
  choice: 若有人
  rationale: 这是律法案例的条件引入语。现代汉语用“若有人”自然清楚；希伯来语虽用阳性单数 אִישׁ，此处泛指遇到该情形的人。
- source_word: יַקְדִּשׁ אֶת־בֵּיתוֹ קֹדֶשׁ לַיהוָה
  choice: 把自己的房屋分别为圣，归给耶和华
  rationale: יַקְדִּשׁ 表示将某物划归神圣用途；“分别为圣”保留“圣”的核心概念。“房屋”比“家”更准确地指本段接受估价的不动产。
- source_word: וְהֶעֱרִיכוֹ
  choice: 祭司就要……估定它的价值
  rationale: ערך 的使役式在本章指具有法律效力的祭司估价。“估定价值”兼顾官方评估和最终定价的含义。
- source_word: בֵּין טוֹב וּבֵין רָע
  choice: 按房屋的好坏
  rationale: 直译为“在好与坏之间”，这里指祭司依据房屋的状况或质量作出估价；“按房屋的好坏”符合现代汉语表达。
- source_word: כַּאֲשֶׁר יַעֲרִיךְ אֹתוֹ הַכֹּהֵן כֵּן יָקוּם
  choice: 祭司怎样估定，就以所估的为准
  rationale: קום 在此表示估价成立、有效并须遵行。“以所估的为准”自然传达祭司估价具有决定效力，同时保留原句的法律语气。
- source_word: לַיהוָה
  choice: 耶和华
  rationale: 按希伯来文本直接呈现四字神名 יהוה；“耶和华”是简体中文圣经传统中最通行、最易辨认的音译。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 耶和华
  alternative: 雅威；上主
  rationale: 原文明确使用四字神名。正文采用中文读者最熟悉的专名“耶和华”，不以称号替代；脚注说明其希伯来文形式及其他常见处理。
- issue: 房屋“分别为圣”的性质
  choice: 保留“分别为圣，归给耶和华”的祭献性表述
  alternative: 仅译作“把房屋奉献给耶和华”
  rationale: 原文同时含有动词 יקדישׁ 与名词 קֹדֶשׁ，强调房屋被赋予神圣归属；不把这一点弱化为一般性的捐献。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“分别为圣”保留利未记的礼仪用语，“估定价值”和“以所估的为准”则以普通读者易懂的法律性表达呈现祭司估价的程序与效力。
