base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/027.yaml
  text: But if it is among the unclean animals[a], then he shall redeem it at your valuation and add a fifth of it to it; and if it is not redeemed[b], then it shall be sold at your valuation.
translation:
  language: zh_hans
  text: 但若是不洁净牲畜中的一只[a]，他就要按你所估定的价赎回，并在估价之外加上五分之一[b]；若没有赎回，就要按你所估定的价卖掉。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“属于不洁净牲畜一类”。这里指礼仪上归为不洁净的一类牲畜。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“把它的五分之一加在它上面”，意思是另加估价的百分之二十。
    reason: lexical_clarification
lexical_decisions:
- source_word: בַּבְּהֵמָה הַטְּמֵאָה
  choice: 属于不洁净的牲畜
  rationale: בְּהֵמָה可指动物或牲畜；本节处于头生牲畜及估价的律法语境中，译作“牲畜”自然明确。介词בְּ在这里表示归属某一类别，即礼仪上不洁净的牲畜。
- source_word: וּפָדָה
  choice: 他就要……赎回
  rationale: פדה意为付出赎价而取回。此处是法律条文中的后续处置，译作“就要……赎回”保留其程序性语气；下文“若没有赎回”同时表明实际也可能不赎回。
- source_word: בְעֶרְכֶּךָ
  choice: 照你所估定的价
  rationale: עֵרֶךְ在利未记27章指所评定的价额；“你”保留希伯来文第二人称阳性单数，按上下文是对负责估价者说的。
- source_word: וְיָסַף חֲמִשִׁתוֹ עָלָיו
  choice: 并在估价之外加上五分之一
  rationale: 希伯来文直译近于“把它的五分之一加在它上面”，意思是在评定价额之外再加该价额的五分之一。中文如此表达清楚而保留计算基准。
- source_word: וְאִם לֹא יִגָּאֵל
  choice: 若没有赎回
  rationale: יִגָּאֵל是Nifal形式，未明说实施赎回的人；用无主语的“没有赎回”保留原文未指明施事者的特点。
- source_word: וְנִמְכַּר
  choice: 就要……卖掉
  rationale: Nifal在这里表达法律规定中的被动处置；现代中文用“卖掉”自然，且不必生硬使用“被卖”。
theological_decisions:
- issue: 赎回是许可还是规定程序
  choice: 译作“他就要……赎回”，并保留下句“若没有赎回”
  alternative: “他可以……赎回”
  rationale: 原文在法律条件句后使用完成式叙述处置，并未采用明确表示许可的词；“就要”较贴近程序性规定。与此同时，下句明言可能没有赎回，因此不把它解释成在任何情况下都必须赎回。
translation_notes:
  register: 采用现代、庄重而易懂的律法条文语体。“不洁净”保留利未记中的礼仪类别含义；“照你所估定的价”保留原文对单数第二人称的直接称呼。脚注标记均置于所说明的词句之后。
