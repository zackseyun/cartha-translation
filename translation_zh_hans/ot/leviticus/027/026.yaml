  text: אַךְ בְּכ֞וֹר אֲשֶׁר יְבֻכַּ֤ר לַֽ/יהוָה֙ בִּ/בְהֵמָ֔ה לֹֽא יַקְדִּ֥ישׁ אִ֖ישׁ אֹת֑/וֹ אִם שׁ֣וֹר אִם שֶׂ֔ה לַֽ/יהוָ֖ה הֽוּא־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/026.yaml
  text: However[a], a firstborn among the livestock, which as a firstborn belongs to Yahweh, no man may consecrate; whether an ox or a sheep[b], it belongs to Yahweh.
translation:
  language: zh_hans
  text: 但牲畜中头生而归耶和华的，任何人不可把它分别为圣；无论是牛还是羊[a]，都归耶和华。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “羊”所译的希伯来语可泛指羊类牲畜，包括绵羊或山羊。
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: 但
  rationale: 在此引出对前述奉献条例的限制或例外；“但”简洁保留其转折和限定作用。
- source_word: בְּכוֹר
  choice: 头生的
  rationale: 指牲畜中最先出生者；“头生的”在中文圣经语境中准确、简明，也能为普通读者理解。
- source_word: אֲשֶׁר יְבֻכַּר לַיהוָה בִּבְהֵמָה
  choice: 牲畜中凡头生归耶和华的
  rationale: 被动形式在此表达头生的身份以及它与耶和华的归属关系，并非人在执行某种使之成为头生的仪式。
- source_word: לֹא יַקְדִּישׁ אִישׁ אֹתוֹ
  choice: 任何人都不可把它分别为圣
  rationale: קדש 的使役式具有奉献、使之归圣的礼仪含义；“分别为圣”保留这一含义。“任何人”自然表达 אִישׁ 在此的泛指用法。
- source_word: אִם שׁוֹר אִם שֶׂה
  choice: 无论是牛还是羊
  rationale: 保留“无论……还是……”的并列结构。שׁוֹר 指牛类，שֶׂה 指羊群中的单只牲畜，可为绵羊或山羊；中文“羊”可自然涵盖两者。
- source_word: לַיהוָה הוּא
  choice: 它都是耶和华的
  rationale: 直截了当地表达该牲畜归耶和华所有，同时保留原文简短而有法律效力的断语。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文读者最熟悉的圣名译法，明确呈现原文专名，而不以“主”替代。
theological_decisions:
- issue: 头生牲畜不可再由人分别为圣的理由
  choice: 经文表明它因头生的身份已经归耶和华，因此人不可把它作为自己的奉献另行分别为圣。
  alternative: 重点仅在于头生身份本身具有神圣性质，而不强调所有权。
  rationale: 开头说它“头生归耶和华”，结尾又明确说“它都是耶和华的”，支持归属关系；正文不加入“已经”或“再”等解释词，以免把经文隐含的逻辑过度明说。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。“分别为圣”保留祭祀和许愿条例中的专门含义；整体句式尽量贴近希伯来文的法律陈述，同时避免生硬直译。
