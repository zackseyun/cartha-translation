language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/אִם גָּאֹ֤ל יִגְאַל֙ אֶת הַ/שָּׂדֶ֔ה הַ/מַּקְדִּ֖ישׁ אֹת֑/וֹ וְ֠/יָסַף חֲמִשִׁ֧ית כֶּֽסֶף עֶרְכְּ/ךָ֛ עָלָ֖י/ו וְ/קָ֥ם לֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/019.yaml
  text: But if the one who consecrated it indeed redeems the field[a], then he shall add a fifth of your valuation money to it[c][b], and it shall remain his.
translation:
  language: zh_hans
  text: 但那把田地分别为圣的人[a]，若果真赎回田地，就要在你所估定的价银之外，再加上五分之一[b]；田地就归他所有[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “分别为圣”也可译作“奉献”或“使成圣”。
    reason: lexical_alternative
  - marker: b
    text: 直译：“你估价之银的五分之一。”
    reason: lexical_alternative
  - marker: c
    text: 也可译作“田地就确定归他”；直译：“就为他立定。”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: 但……若
  rationale: 承接上一节的法规，并引出与前述情形相对的条件，现代汉语用“但……若”自然清楚。
- source_word: גָּאֹל יִגְאַל
  choice: 若果真赎回
  rationale: 不定式绝对形与未完成式连用，强调“赎回”这一动作；“果真”既保留强调，也避免误译为意愿或义务。
- source_word: הַשָּׂדֶה
  choice: 田地
  rationale: 指上下文中已经分别为圣的特定田地；“田地”比泛称“土地”更准确。
- source_word: הַמַּקְדִּישׁ אֹתוֹ
  choice: 那把田地分别为圣的人
  rationale: 分词指将田地置于神圣用途之下的人。“分别为圣”保留祭祀法规中的神圣含义，同时为现代读者所能理解。
- source_word: וְיָסַף
  choice: 就要……再加上
  rationale: 在法规语境中表达规定性的后续行动；“就要”体现法定要求，“再加上”说明是在原估价之外追加。
- source_word: חֲמִשִׁית כֶּסֶף עֶרְכְּךָ
  choice: 在你所估定的价银之外，再加上五分之一
  rationale: 原文直译为“你估价之银的五分之一”。译文明确所加的是估定价银的五分之一，并保留第二人称的法律表述。
- source_word: וְקָם לוֹ
  choice: 田地就归他所有
  rationale: 该法律惯用语字面为“为他立定”，在此表示田地的归属获得确立；“归他所有”准确表达法律结果。
theological_decisions:
- issue: הקדישׁ 的礼仪性含义
  choice: 分别为圣
  alternative: 奉献；使成圣
  rationale: 这里不是普通捐赠，而是把产业划归神圣用途。“分别为圣”保留礼仪和法律层面的含义，又不额外引入宗派性解释。
- issue: 条件句后续条款的法律效力
  choice: “就要……；……就……”所表达的规定及结果
  alternative: 单纯将来时；过去叙事
  rationale: 利未记27章属于法规语境，本节规定赎回者必须追加五分之一，并说明由此确立的产业归属。
translation_notes:
  register: 采用庄重而清楚的现代标准普通话。“果真”保留希伯来语动词结构的强调；“价银”保留古代估价以银计值的背景，但句法按现代汉语调整。所有代词指向均在必要处明确为“田地”，以免歧义。
