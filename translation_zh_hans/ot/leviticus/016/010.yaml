  text: וְ/הַ/שָּׂעִ֗יר אֲשֶׁר֩ עָלָ֨ה עָלָ֤י/ו הַ/גּוֹרָל֙ לַ/עֲזָאזֵ֔ל יָֽעֳמַד חַ֛י לִ/פְנֵ֥י יְהוָ֖ה לְ/כַפֵּ֣ר עָלָ֑י/ו לְ/שַׁלַּ֥ח אֹת֛/וֹ לַ/עֲזָאזֵ֖ל הַ/מִּדְבָּֽרָ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/010.yaml
  text: But the goat on which the lot for Azazel fell shall be presented alive before Yahweh[a], to make atonement over it[b], to send it away into the wilderness to Azazel.
translation:
  language: zh_hans
  text: 但那只抽签归给阿撒泻勒[a]的公山羊，要活着被安置在耶和华面前，为要在它身上行赎罪礼[b]，并把它送到旷野，归给阿撒泻勒。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “阿撒泻勒”所指为何，学者意见不一；它可能是专名，也可能是与“除去”有关的用语。传统上也有译作“替罪羊”的。
    reason: 说明有争议的希伯来语עֲזָאזֵל，并保留重要的传统译法。
  - marker: b
    text: 或译：“为它赎罪。”
    reason: 保留לְכַפֵּר עָלָיו中介词关系的另一种合理理解。
lexical_decisions:
- source_word: וְהַשָּׂעִיר
  choice: 但那只……公山羊
  rationale: שָׂעִיר在此指仪式中两只公山羊之一；译作“公山羊”准确自然。连接词按上文两只羊的对照关系译作“但”。
- source_word: אֲשֶׁר עָלָה עָלָיו הַגּוֹרָל לַעֲזָאזֵל
  choice: 抽签归给阿撒泻勒的
  rationale: 用现代汉语简洁表达签落在这只羊上、判定它归属阿撒泻勒的意思；保留有争议的עֲזָאזֵל音译，不在正文中断定其所指。
- source_word: יָעֳמַד חַי
  choice: 要活着被安置
  rationale: Hophal形态表达使之站立或安置的被动使役意义；“被安置”比生硬的“被使站立”自然，同时保留公山羊由祭司呈立且仍然活着的含义。
- source_word: לִפְנֵי יְהוָה
  choice: 在耶和华面前
  rationale: 按中文圣经语域以“耶和华”表达神名，并以“在……面前”保留礼仪性呈献的空间关系。
- source_word: לְכַפֵּר עָלָיו
  choice: 在它上面行赎罪礼
  rationale: “行赎罪礼”传达祭仪语境中的כפר；“在它上面”较直接地保留עַל的表述，避免断定是“为它”赎罪还是借它施行仪式。
- source_word: לְשַׁלַּח אֹתוֹ לַעֲזָאזֵל הַמִּדְבָּרָה
  choice: 把它送到旷野，归给阿撒泻勒
  rationale: “送到旷野”体现方向后缀所表达的趋向；将“归给阿撒泻勒”置后，既自然又保留目的地或归属所含的原文歧义。
theological_decisions:
- issue: עֲזָאזֵל的含义
  choice: 阿撒泻勒（音译）
  alternative: 替罪羊；完全除去；旷野中的某一存在或地点
  rationale: 该词词源和所指均有争议。正文音译能避免把某一种历史解释写入经文，同时保留两次出现的对应关系。
- issue: לְכַפֵּר עָלָיו的关系
  choice: 在它上面行赎罪礼
  alternative: 为它赎罪
  rationale: 原文介词עַל可表达“在……上”或引出赎罪所关涉的对象。正文保留较具体的表层关系，脚注列出“为它”的可能性，不消除祭仪上的张力。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“被安置”兼顾原文被动使役形式与中文自然度；“行赎罪礼”突出利未记的礼仪语境。正文不把“阿撒泻勒”直接解释为“替罪羊”，以保留原文的不确定性。
