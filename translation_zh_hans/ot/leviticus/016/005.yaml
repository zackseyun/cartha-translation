  text: וּ/מֵ/אֵ֗ת עֲדַת֙ בְּנֵ֣י יִשְׂרָאֵ֔ל יִקַּ֛ח שְׁנֵֽי שְׂעִירֵ֥י עִזִּ֖ים לְ/חַטָּ֑את וְ/אַ֥יִל אֶחָ֖ד לְ/עֹלָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/005.yaml
  text: And from the congregation of the sons of Israel he shall take two male goats for a sin offering and one ram for a burnt offering[a][b].
translation:
  language: zh_hans
  text: 他要从以色列会众中取两只公山羊作赎罪祭[a]，一只公绵羊作燔祭。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“洁净祭”。希伯来语 חַטָּאת 在《利未记》中可指处理罪和礼仪不洁的祭。
    reason: alternative_reading
lexical_decisions:
- source_word: וּמֵאֵת
  choice: 从……中
  rationale: 介词组合表示来源；结合中文语序，以“从……中”自然表达祭牲由会众提供。连接词 וּ 在中文中可由后半句的“再”体现，不必机械译作“并且”。
- source_word: עֲדַת בְּנֵי יִשְׂרָאֵל
  choice: 以色列人全会众
  rationale: עֵדָה 指作为整体的群体或会众；בְּנֵי יִשְׂרָאֵל 是指以色列民族的惯用称谓。译作“以色列人全会众”既保留群体性，也符合现代汉语。
- source_word: יִקַּח
  choice: 他要……取
  rationale: 未完成式在礼仪法规中具有指令性；“要”能自然表达规定和义务，同时避免过强地解释为绝对命令。
- source_word: שְׁנֵי שְׂעִירֵי עִזִּים
  choice: 两只公山羊
  rationale: 该短语特指雄性的山羊；“公山羊”准确保留祭牲的性别要求。
- source_word: לְחַטָּאת
  choice: 作赎罪祭
  rationale: חַטָּאת 在祭祀语境中指处理罪及礼仪不洁的祭；“赎罪祭”是中文圣经传统中清楚、通行的名称，另以脚注保留“洁净祭”的功能性译法。
- source_word: וְאַיִל אֶחָד
  choice: 再取一只公绵羊
  rationale: אַיִל 特指成年公绵羊；中文补出量词“只”，并用“再取”承接前一动作，使并列结构清楚自然。
- source_word: לְעֹלָה
  choice: 作燔祭
  rationale: עֹלָה 指整只焚烧献上的祭物；“燔祭”是准确且沿用已久的中文祭祀术语。
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל 的群体指称
  choice: 以色列人
  alternative: 以色列的众子／以色列子孙
  rationale: 此惯用语在这里指整个以色列群体，并非仅限男性。“以色列人”传达实际所指，避免现代读者误解，同时“全会众”保留其共同体性质。
- issue: חַטָּאת 的祭名及功能
  choice: 赎罪祭
  alternative: 洁净祭
  rationale: 该词既与罪有关，也具有洁净礼仪不洁的功能。正文采用中文读者熟悉的“赎罪祭”，脚注列出“洁净祭”，以保留原词在利未记中的功能张力，不把它限定为单一理论。
translation_notes:
  register: 采用现代、庄重而易懂的法规体中文。以“他要”表达礼仪指令，以“公山羊／公绵羊”清楚区分祭牲种类；保留传统祭名“赎罪祭、燔祭”，并用脚注说明关键术语的另一种可能译法。
