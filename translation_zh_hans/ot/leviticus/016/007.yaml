  text: וְ/לָקַ֖ח אֶת שְׁנֵ֣י הַ/שְּׂעִירִ֑ם וְ/הֶעֱמִ֤יד אֹתָ/ם֙ לִ/פְנֵ֣י יְהוָ֔ה פֶּ֖תַח אֹ֥הֶל מוֹעֵֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/007.yaml
  text: And he shall take the two goats and set them before Yahweh at the entrance of the tent of meeting[a].
translation:
  language: zh_hans
  text: 他要取两只公山羊，使它们站在雅威面前，在会幕门口。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “雅威”是希伯来文神名יהוה的音译。
    reason: 说明神名的原文形式及译法。
lexical_decisions:
- source_word: וְלָקַח
  choice: 他要把……牵来
  rationale: 在礼仪规程中，带连接词的完成式承接上文，表达接续的指令性动作。“牵来”符合把活牲畜带到指定地点的自然汉语表达。
- source_word: שְׁנֵי הַשְּׂעִירִם
  choice: 两只公山羊
  rationale: שָׂעִיר在此指公山羊；译出性别既符合词义，也与赎罪日献祭的上下文相称。
- source_word: וְהֶעֱמִיד אֹתָם
  choice: 使它们站
  rationale: עמד的使役式本义是“使……站立”，这里保留牲畜被安置在指定位置的具体画面，而不将其抽象化为“呈献”。
- source_word: לִפְנֵי יְהוָה
  choice: 在雅威面前
  rationale: לִפְנֵי兼有空间上的“在……面前”和处于其临在中的意味；“雅威”直接呈现经文中的神名。
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: 在会幕门口
  rationale: פֶּתַח指入口或门口；אֹהֶל מוֹעֵד采用现代中文圣经语境中自然且简洁的惯用名称“会幕”。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名。音译“雅威”保留其作为专名的性质，不以称号取代，也不采用较晚形成的混合读音。
- issue: וְהֶעֱמִיד的礼仪含义
  choice: 使它们站
  alternative: 把它们呈献
  rationale: 原文首先描写使两只羊站在指定地点的具体动作；“呈献”虽可表达礼仪功能，却会增加原文没有明说的解释，因此正文保留较具体的说法。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。以“牵来”自然表达带领牲畜的动作，以“使它们站”保留希伯来文的具体使役含义；“就是”明确“会幕门口”与“雅威面前”共同指向同一礼仪地点。
