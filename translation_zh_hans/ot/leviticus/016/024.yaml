  text: וְ/רָחַ֨ץ אֶת בְּשָׂר֤/וֹ בַ/מַּ֨יִם֙ בְּ/מָק֣וֹם קָד֔וֹשׁ וְ/לָבַ֖שׁ אֶת בְּגָדָ֑י/ו וְ/יָצָ֗א וְ/עָשָׂ֤ה אֶת עֹֽלָת/וֹ֙ וְ/אֶת עֹלַ֣ת הָ/עָ֔ם וְ/כִפֶּ֥ר בַּעֲד֖/וֹ וּ/בְעַ֥ד הָ/עָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/024.yaml
  text: He shall wash his body with water in a holy place[a], put on his garments, come out, and offer his burnt offering and the burnt offering of the people[c][b], and make atonement for himself and for the people.
translation:
  language: zh_hans
  text: 他要在圣洁之处[b]用水洗身[a]，穿上自己的衣服，出来，献上自己的燔祭和百姓的燔祭，为自己和百姓赎罪[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “身”原文直译为“肉”。
    reason: lexical_alternative
  - marker: b
    text: “圣洁之处”原文并不一定是指内殿的“圣所”。
    reason: lexical_alternative
  - marker: c
    text: “赎罪”也可译作“除罪”；在某些礼仪语境中，这个词也可表达“施行洁净”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָחַץ
  choice: 他要……洗
  rationale: 带连接词的完成式在祭司法令的连续步骤中表达规定性动作；用“要”体现程序指令，而非过去叙事。
- source_word: בְּשָׂרוֹ
  choice: 洗身
  rationale: 字面为“他的肉身”；在沐浴语境中，“洗身”是自然、准确的现代汉语表达，也避免“肉体”可能带来的神学联想。
- source_word: בַמַּיִם
  choice: 用水
  rationale: 介词与“洗”连用时，以“用水”最符合现代汉语习惯。
- source_word: בְּמָקוֹם קָדוֹשׁ
  choice: 在圣洁之处
  rationale: 原文是普通名词“地方”加形容词“圣洁”，并未明确使用指称内殿的专门称谓；“圣洁之处”既保留祭祀语域，也不擅自限定为“圣所”。
- source_word: וְלָבַשׁ אֶת־בְּגָדָיו
  choice: 穿上衣服
  rationale: 准确表达穿回其衣物的动作，现代、庄重而不生硬。
- source_word: וְיָצָא
  choice: 出来
  rationale: 承接他身处圣洁之处的场景，清楚表达由内向外的移动。
- source_word: וְעָשָׂה
  choice: 献上
  rationale: עָשָׂה字面可作“做”，但以燔祭为宾语时，“献上”最能自然表达祭祀行动。
- source_word: עֹלָתוֹ וְאֶת־עֹלַת הָעָם
  choice: 自己的燔祭和百姓的燔祭
  rationale: “燔祭”是עֹלָה在祭祀语境中的通行译法；重复“燔祭”保留原文的平行结构。
- source_word: וְכִפֶּר
  choice: 赎罪
  rationale: כפר在此指借祭祀为人施行赎罪；“赎罪”保留广泛的祭祀与神学含义，不将其限缩为某一种赎罪理论。
- source_word: בַּעֲדוֹ וּבְעַד הָעָם
  choice: 为自己和百姓
  rationale: “为”简洁自然地传达בְּעַד所含的代表、代求或为某人施行之意。
theological_decisions:
- issue: 利未记祭祀法规中כפר的译法
  choice: 赎罪
  alternative: 除罪；施行洁净
  rationale: 本节的直接对象是祭司本人和百姓，因此正文采用涵盖面较广且通行的“赎罪”。“除罪”可突出消除罪责，“施行洁净”可突出某些礼仪语境中的净化功能，但任取其一都会缩窄原词在此处保留的意义张力。
- issue: בְּמָקוֹם קָדוֹשׁ所指地点的范围
  choice: 圣洁之处
  alternative: 圣所
  rationale: 原文没有明确把该处等同于作为内殿名称的“圣所”。采用描述性译法，以免把具体地点解释得超过原文。
translation_notes:
  register: 采用现代、庄重而易懂的祭司法令语体。句式依照希伯来文的连续动作推进；保留“自己的燔祭／百姓的燔祭”的平行结构。脚注分别说明“身”的字面含义、地点称谓的非专名性质，以及כפר的语义范围。
