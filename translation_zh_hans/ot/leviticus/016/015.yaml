id: LEV.16.15
reference: Leviticus 16:15
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/שָׁחַ֞ט אֶת שְׂעִ֤יר הַֽ/חַטָּאת֙ אֲשֶׁ֣ר לָ/עָ֔ם וְ/הֵבִיא֙ אֶת דָּמ֔/וֹ אֶל מִ/בֵּ֖ית לַ/פָּרֹ֑כֶת וְ/עָשָׂ֣ה אֶת דָּמ֗/וֹ כַּ/אֲשֶׁ֤ר עָשָׂה֙ לְ/דַ֣ם הַ/פָּ֔ר וְ/הִזָּ֥ה אֹת֛/וֹ עַל הַ/כַּפֹּ֖רֶת וְ/לִ/פְנֵ֥י הַ/כַּפֹּֽרֶת־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/015.yaml
  text: Then he shall slaughter the goat of the sin offering that is for the people[a], and bring its blood inside the veil, and do with its blood as he did with the blood of the bull, and sprinkle it on the atonement cover and before the mercy seat.
translation:
  language: zh_hans
  text: 随后，他要宰杀那只为百姓作赎罪祭的公山羊，把羊血带到幔子里面。他怎样处理公牛的血，也要照样处理羊血，把血洒在赎罪盖[a]上和赎罪盖前。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 传统译作“施恩座”。
    reason: 保留כַּפֹּרֶת具有历史影响的传统译法，同时让正文采用更直接体现器物与赎罪礼仪的译名。
lexical_decisions:
- source_word: וְשָׁחַט
  choice: 随后，他要宰杀
  rationale: 该动词指礼仪性的宰杀；在连续的律法指示中，用“要”表达规定，“随后”体现连接词所表示的步骤推进。
- source_word: שְׂעִיר הַחַטָּאת אֲשֶׁר לָעָם
  choice: 那只为百姓作赎罪祭的公山羊
  rationale: שָׂעִיר在此指公山羊；“为百姓”将它与亚伦为自己献上的公牛区分开来，“作赎罪祭”自然表达祭牲与祭类的关系。
- source_word: וְהֵבִיא אֶת־דָּמוֹ אֶל מִבֵּית לַפָּרֹכֶת
  choice: 把羊血带到幔子里面
  rationale: הֵבִיא表示带入；“羊血”明确代词所指，空间短语则指幔子内侧的区域。
- source_word: וְעָשָׂה אֶת־דָּמוֹ כַּאֲשֶׁר עָשָׂה לְדַם הַפָּר
  choice: 他怎样处理公牛的血，也要照样处理羊血
  rationale: 原文表达略有省略，意思是对羊血施行与公牛血相同的礼仪；“处理”既自然，又不擅自补明具体动作。
- source_word: וְהִזָּה אֹתוֹ
  choice: 把血洒
  rationale: נזה的使役形在献祭语境中指洒血；重复“血”使中文指代清楚。
- source_word: עַל הַכַּפֹּרֶת וְלִפְנֵי הַכַּפֹּרֶת
  choice: 在赎罪盖上和赎罪盖前
  rationale: 分别保留“在……上”和“在……前”的礼仪空间区别；כַּפֹּרֶת指约柜的盖，“赎罪盖”兼顾器物性质及其与כפר词族的联系。
theological_decisions:
- issue: כַּפֹּרֶת的译法
  choice: 赎罪盖
  alternative: 施恩座
  rationale: 该词在本段首先指约柜上的盖，并与赎罪日礼仪密切相关。“赎罪盖”既明确器物所指，也保留其词源与礼仪联系；传统译法“施恩座”具有历史影响，列入脚注而不作为正文，以免将解释性神学意象直接代入器物名称。
translation_notes:
  register: 采用现代、庄重而易懂的礼仪法规语体。“随后……要……”清楚呈现程序次序；两次使用“赎罪盖”，避免同一希伯来词在同一句中译名不一。
