  text: וּ/בָ֤א אַהֲרֹן֙ אֶל אֹ֣הֶל מוֹעֵ֔ד וּ/פָשַׁט֙ אֶת בִּגְדֵ֣י הַ/בָּ֔ד אֲשֶׁ֥ר לָבַ֖שׁ בְּ/בֹא֣/וֹ אֶל הַ/קֹּ֑דֶשׁ וְ/הִנִּיחָ֖/ם שָֽׁם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/023.yaml
  text: Then Aaron shall come into the tent of meeting and take off the linen garments that he put on when he went into the holy place[a], and he shall leave them there.
translation:
  language: zh_hans
  text: 亚伦随后要进入会幕，脱下他进入圣所[a]时所穿的细麻衣服，把衣服留在那里。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“圣处”；也有人根据赎罪日礼仪的整体语境，将这里更具体地理解为“至圣所”。
    reason: 保留 הַקֹּדֶשׁ 在本节中一般指“圣处/圣所”、但可按上下文被理解为至圣所的语义与解释空间。
lexical_decisions:
- source_word: וּבָא
  choice: 随后要进入
  rationale: 连接词加完成式在礼仪规程中承接前文，表示接续发生的步骤；“随后要”体现程序次序，“进入”自然表达 בוא 与目标地点连用时的含义。
- source_word: אֹהֶל מוֹעֵד
  choice: 会幕
  rationale: 这是该圣所帐幕在现代中文圣经语境中明确、简洁且广为理解的标准称呼。
- source_word: וּפָשַׁט
  choice: 脱下
  rationale: 该动词在衣物语境中意为脱去；“脱下”是现代汉语最自然直接的表达。
- source_word: בִּגְדֵי הַבָּד
  choice: 细麻衣服
  rationale: בִּגְדֵי 指衣服，בָּד 指用于祭司服饰的麻布；“细麻衣服”既保留材质信息，也符合庄重而通俗的中文表达。
- source_word: אֲשֶׁר לָבַשׁ
  choice: 所穿的
  rationale: לָבַשׁ 可指穿上或穿着；此处关系从句修饰衣服，“所穿的”简洁自然，不额外强调穿衣动作的起点。
- source_word: בְּבֹאוֹ
  choice: 进入……时
  rationale: 介词 בְּ 加不定式结构表示时间情境；结合后面的目标地点，以“进入……时”准确而顺畅。
- source_word: הַקֹּדֶשׁ
  choice: 圣所
  rationale: 原文是一般性的“圣处/圣所”，未采用专指内层圣所的完整名称；正文保留其概括性。
- source_word: וְהִנִּיחָם שָׁם
  choice: 把衣服留在那里
  rationale: הִנִּיחַ 在此可指放置或留下。中文用“留在那里”自然体现礼仪指令，又不臆定具体放置方式；重复“衣服”可避免连续代词造成指代不清。
theological_decisions:
- issue: הַקֹּדֶשׁ 所指的具体范围
  choice: 正文译作“圣所”
  alternative: “圣地”；或依赎罪日整体语境具体译作“至圣所”
  rationale: 本节原文本身只说“那圣的地方”，并未使用明确专指至圣所的较完整表达。译作“圣所”保留原文可能涵盖圣所区域或在语境中特指至圣所的张力，并以脚注说明解释空间。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“随后要……脱下……把……”呈现礼仪规程的接续步骤；避免古奥句式，也不把“圣所”未经说明地具体化为“至圣所”。
