  text: וְ/נָשָׂ֨א הַ/שָּׂעִ֥יר עָלָ֛י/ו אֶת כָּל עֲוֺנֹתָ֖/ם אֶל אֶ֣רֶץ גְּזֵרָ֑ה וְ/שִׁלַּ֥ח אֶת הַ/שָּׂעִ֖יר בַּ/מִּדְבָּֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/022.yaml
  text: The goat shall carry on itself all their iniquities to a cut-off land[a], and he shall send the goat away into the wilderness.
translation:
  language: zh_hans
  text: 那只公山羊要把他们一切的罪孽都背负在自己身上，带到隔绝之地[a]；他要把那只公山羊送入旷野。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“偏僻之地”、“难以到达之地”或“荒凉之地”。希伯来语可能是指与人烟隔绝的地方。
    reason: 保留אֶרֶץ גְּזֵרָה这一罕见短语的合理词义选择及其不确定性。
lexical_decisions:
- source_word: וְנָשָׂא
  choice: 要……背负
  rationale: נשא在此表示承担并携带。译作“背负”既保留公山羊把罪孽负在身上的具体图像，也符合庄重而自然的现代汉语。
- source_word: הַשָּׂעִיר
  choice: 那只公山羊
  rationale: שָׂעִיר在祭仪语境中指公山羊；汉语明确译出性别自然且准确。定指词“那只”承接上下文中的这只羊。
- source_word: עָלָיו
  choice: 在自己身上
  rationale: 明确保留介词短语所表达的罪孽落在公山羊身上的具体意象；“自己”在汉语中清楚表达回指。
- source_word: כָּל עֲוֺנֹתָם
  choice: 他们一切的罪孽
  rationale: עָוֹן兼有罪恶及其罪责的分量；“罪孽”比泛称的“罪”更能保留这种道德与祭仪意味，同时不把词义限定为单纯的刑责。
- source_word: אֶל אֶרֶץ גְּזֵרָה
  choice: 带到隔绝之地
  rationale: גְּזֵרָה词义罕见而有争议，可能指被隔开、孤僻、难以到达或荒凉之地。“隔绝之地”贴近其分离意象，又避免在正文中过度确定具体地貌。
- source_word: וְשִׁלַּח
  choice: 他要……送入
  rationale: שׁלח在这里表示将公山羊遣离、送走。“送入旷野”在现代汉语中自然，并保留动作方向；主语仍译作“他”，不在本节内补入原文未明说的身份。
- source_word: בַּמִּדְבָּר
  choice: 旷野
  rationale: מִדְבָּר可指荒野、草原或沙漠地带；“旷野”是此祭仪语境中准确、庄重且不过度限定地貌的译法。
theological_decisions:
- issue: 公山羊负罪意象的表达
  choice: 保留公山羊把众人的罪孽背负在自己身上的具体说法
  alternative: 意译为“除去他们的罪”
  rationale: 原文描写罪孽被负在羊身上并带离群体的祭仪图像。直陈这一图像可保留经文本身的象征张力，而不预先把它解释为某一后来的教义结论。
- issue: אֶרֶץ גְּזֵרָה的含义
  choice: 正文译作“隔绝之地”
  alternative: 孤僻之地、难以到达之地、荒凉之地
  rationale: 该短语存在真实的词义不确定性。“隔绝之地”保留其可能的“切断、分离”核心意象，其他合理理解则列入脚注，避免正文武断消除歧义。
- issue: וְשִׁלַּח的主语
  choice: 保留代词“他”
  alternative: 明确译作“那负责放羊的人”
  rationale: 希伯来文本本节只用第三人称单数动词，主语身份须由上一节得知；保留“他”避免在本节正文中加入解释性成分。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“背负在自己身上”有意保留原文具体而略带强调的祭仪图像；“隔绝之地”保持简洁，相关词义歧义由脚注说明。
