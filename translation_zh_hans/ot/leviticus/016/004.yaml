  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כְּתֹֽנֶת בַּ֨ד קֹ֜דֶשׁ יִלְבָּ֗שׁ וּ/מִֽכְנְסֵי בַד֮ יִהְי֣וּ עַל בְּשָׂר/וֹ֒ וּ/בְ/אַבְנֵ֥ט בַּד֙ יַחְגֹּ֔ר וּ/בְ/מִצְנֶ֥פֶת בַּ֖ד יִצְנֹ֑ף בִּגְדֵי קֹ֣דֶשׁ הֵ֔ם וְ/רָחַ֥ץ בַּ/מַּ֛יִם אֶת בְּשָׂר֖/וֹ וּ/לְבֵשָֽׁ/ם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/004.yaml
  text: He shall put on the holy linen tunic[a], and the linen undergarments shall be on his body; he shall tie the linen sash around himself and wrap the linen turban around himself. These are holy garments[b]. He shall wash his body with water then put them on.
translation:
  language: zh_hans
  text: 他要穿上圣洁的细麻布内袍，细麻布裤要贴身穿；他要束上细麻布腰带，缠上细麻布头巾。这些都是圣衣。他要用水洗身，然后穿上这些衣服。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כְּתֹנֶת בַּד קֹדֶשׁ
  choice: 圣洁的细麻布内袍
  rationale: כְּתֹנֶת 指贴身穿的长衣；在祭司服饰语境中译作“内袍”既自然，也能与下文其他衣物区分。בַּד 表示麻布材质，קֹדֶשׁ 修饰这件衣袍，表示分别用于圣职。
- source_word: מִכְנְסֵי בַד
  choice: 细麻布裤
  rationale: 指遮盖下身、贴身穿着的祭司服装；“裤”简明、现代，避免“裤衩”的口语感和“内裤”可能造成的过窄联想。
- source_word: עַל בְּשָׂרוֹ
  choice: 贴身穿
  rationale: 字面为“在他的肉身上”，此处强调衣物直接穿在身体上；“贴身穿”在现代汉语中清楚自然。
- source_word: אַבְנֵט בַּד יַחְגֹּר
  choice: 束上细麻布腰带
  rationale: אַבְנֵט 是祭司所用的带子，יַחְגֹּר 表示环腰束系；“束上……腰带”凝练地表达该动作。
- source_word: מִצְנֶפֶת בַּד יִצְנֹף
  choice: 缠上细麻布头巾
  rationale: מִצְנֶפֶת 是缠裹式头饰，同根动词 יִצְנֹף 强调缠戴；“缠上……头巾”保留原文的具体动作。
- source_word: בִּגְדֵי קֹדֶשׁ
  choice: 圣衣
  rationale: 该词组指分别为圣、供祭司礼仪使用的衣服；“圣衣”是简洁而庄重的现代圣经用语。
- source_word: וְרָחַץ בַּמַּיִם אֶת בְּשָׂרוֹ
  choice: 他要用水洗身
  rationale: 原文直译为“用水洗他的肉身”；“用水洗身”保留身体洁净的具体含义，同时避免“肉身”在汉语中的额外神学联想。
- source_word: וּלְבֵשָׁם
  choice: 然后穿上这些衣服
  rationale: 后缀“他们”回指前述衣物；汉语以“这些衣服”明确所指。连接词 וְ 在连续指令中自然译作“然后”，表达洗身后穿衣的次序。
theological_decisions:
- issue: 衣服的“圣洁”性质
  choice: 以“圣洁的”和“圣衣”表达礼仪上分别为圣
  alternative: 神圣的衣服／圣服
  rationale: 经文本身称这些衣服为 קֹדֶשׁ，译文保留其礼仪与职分上的神圣性质，但不加入后来的象征性或宗派性解释。
- issue: בָּשָׂר 在洁净礼仪中的译法
  choice: 按语境译为“贴身”和“洗身”
  alternative: 肉身／身体
  rationale: 这里所指是祭司实际的身体，而非后来神学语境中与“灵”相对的“肉体”；采用自然汉语可避免不必要的神学联想，同时保留仪式要求。
- issue: 洗身与穿衣的次序
  choice: 译作“然后穿上”
  alternative: 并穿上
  rationale: 原文以 וְ 连接连续动作；“然后”清楚表达叙事与指令中的先后次序，但不赋予该连接词超出语境的神学含义。
translation_notes:
  register: 采用现代、庄重且易懂的普通话书面语。“内袍、腰带、头巾、圣衣”保持祭司服饰语境的尊严；避免古奥的“袍褂、膝裤、以水洗肉”等表达。原文没有必须另列的文本异读或实质歧义，因此不设脚注。
