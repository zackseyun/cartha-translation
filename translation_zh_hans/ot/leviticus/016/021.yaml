source:
  edition: WLC
  text: וְ/סָמַ֨ךְ אַהֲרֹ֜ן אֶת שְׁתֵּ֣י יד/ו עַ֨ל רֹ֣אשׁ הַ/שָּׂעִיר֮ הַ/חַי֒ וְ/הִתְוַדָּ֣ה עָלָ֗י/ו אֶת כָּל עֲוֺנֹת֙ בְּנֵ֣י יִשְׂרָאֵ֔ל וְ/אֶת כָּל פִּשְׁעֵי/הֶ֖ם לְ/כָל חַטֹּאתָ֑/ם וְ/נָתַ֤ן אֹתָ/ם֙ עַל רֹ֣אשׁ הַ/שָּׂעִ֔יר וְ/שִׁלַּ֛ח בְּ/יַד אִ֥ישׁ עִתִּ֖י הַ/מִּדְבָּֽרָ/ה־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/021.yaml
  text: And Aaron shall lay both his hands on the head of the live goat[a], and confess over it all the iniquities of the sons of Israel, and all their transgressions, all their sins, and put them on the head of the goat[b], and send it away into the wilderness by the hand of a man appointed for the task.
translation:
  language: zh_hans
  text: 亚伦要把双手按在那只活着的公山羊的头上，在它上面承认以色列的子孙[a]一切的罪孽、他们一切的过犯和一切的罪，并把这些都放在那只公山羊的头上；再交给一个为此预备好的人[b]，由他把它送到旷野去。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “以色列的子孙”原文直译为“以色列的儿子们”；这里指以色列民。
    reason: lexical_alternative
  - marker: b
    text: “为此预备好的人”也可理解为“为此指定的人”。原文对这人的角色用语较难确定，可能着重于他已预备妥当、受指定，或适合在这时执行任务。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְסָמַךְ
  choice: 按在
  rationale: 在献祭礼仪语境中，סמך表示把手按在祭牲身上的动作；“按在”自然且保留了动作的具体性。
- source_word: שְׁתֵּי יָדוֹ
  choice: 双手
  rationale: 准确表达希伯来文“两只手”，也符合现代汉语习惯。
- source_word: הַשָּׂעִיר הַחַי
  choice: 那只活山羊
  rationale: 指赎罪日礼仪中仍然活着的那只公山羊；汉语通常以“山羊”表达而不必重复标明雄性。
- source_word: וְהִתְוַדָּה עָלָיו
  choice: 在它上面承认
  rationale: 保留“承认”与介词“在……上面”的礼仪图景，不把动作弱化为一般性的认罪。
- source_word: עֲוֺנֹת
  choice: 罪孽
  rationale: “罪孽”能表达该词所含的邪曲、罪责意味，并与后面的“过犯”和“罪”有所区分。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列众子
  rationale: 保留原文正式的亲属称谓和复数群体含义；脚注说明其所指是以色列民。
- source_word: פִּשְׁעֵיהֶם
  choice: 他们的一切过犯
  rationale: פֶּשַׁע含越界、悖逆之意；“过犯”既庄重易懂，也与其他罪恶词汇形成区别。
- source_word: לְכָל חַטֹּאתָם
  choice: 和一切罪
  rationale: 此处在语境中汇总并完成三重罪恶用语的列举；译作“和一切罪”保留并列和总括效果。
- source_word: וְנָתַן אֹתָם
  choice: 把这些都放在
  rationale: “这些”回指所承认的罪孽、过犯和罪；“放在”保留原文具体的转置图景，不进一步解释其机制。
- source_word: וְשִׁלַּח
  choice: 把它送到
  rationale: 表达将山羊送离群体、前往旷野的动作；“送到”与方向词配合自然。
- source_word: בְּיַד אִישׁ עִתִּי
  choice: 交由一个为此预备好的人
  rationale: ביד是借某人之手、交由某人办理的表达；עִתִּי含义较难确定，译文保留“预备好”的可能重点，脚注列出“指定”的可能性。
- source_word: הַמִּדְבָּרָה
  choice: 到旷野去
  rationale: 方向词尾表示朝旷野而去；“旷野”比“沙漠”更能避免过度限定地貌。
theological_decisions:
- issue: 是否区分三组罪恶用语
  choice: 罪孽／过犯／罪
  alternative: 将三者都译作“罪”
  rationale: 原文连续使用עֲוֺנֹת、פִּשְׁעִים、חַטֹּאות，强调以色列罪责的全面性；采用三个相关而不同的汉语词，既保留修辞累积，也不人为建立严格的教义分类。
- issue: 是否保留בְּנֵי יִשְׂרָאֵל的亲属形式
  choice: 以色列众子
  alternative: 以色列人／以色列民
  rationale: 正文保留原文阳性、亲属性的正式说法，同时用脚注说明该短语在此群体性地指以色列民，避免误解为仅指某些男性。
- issue: 如何表达罪被放在山羊头上的礼仪图景
  choice: 把这些都放在山羊头上
  alternative: 把罪归到山羊身上
  rationale: 采用接近原文的具体动作表达，保留其神学张力，不在译文中进一步规定这是象征、转移还是归算。
translation_notes:
  register: 采用现代、庄重而易懂的礼仪叙述语体。“按在”“承认”“放在”“送到旷野去”保留原文连续动作；两处脚注分别置于真正相关的“以色列众子”和执行任务之人之后。
