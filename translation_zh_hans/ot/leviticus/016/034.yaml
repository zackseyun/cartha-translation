  text: וְ/הָֽיְתָה זֹּ֨את לָ/כֶ֜ם לְ/חֻקַּ֣ת עוֹלָ֗ם לְ/כַפֵּ֞ר עַל בְּנֵ֤י יִשְׂרָאֵל֙ מִ/כָּל חַטֹּאתָ֔/ם אַחַ֖ת בַּ/שָּׁנָ֑ה וַ/יַּ֕עַשׂ כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/034.yaml
  text: This shall be for you a permanent statute[a], to make atonement for the sons of Israel for all their sins once in the year[b]. And he did as Yahweh commanded Moses.
translation:
  language: zh_hans
  text: 这要作你们永远的定例：每年一次，为以色列人赎罪，除去他们的一切罪[a]。他就照耶和华所吩咐摩西的去做了[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“为以色列人的一切罪赎罪”。原文的介词也可能突出从罪污中得洁净、罪污被除去的意味。
    reason: 保留 מִן 与 כפר 连用时赎罪及洁除之间的语义张力。
  - marker: b
    text: “他”原文没有明说是谁；按上下文通常理解为亚伦。
    reason: 说明希伯来文隐含主语所保留的指代含蓄。
lexical_decisions:
- source_word: וְהָיְתָה זֹּאת לָכֶם לְחֻקַּת עוֹלָם
  choice: 这要作你们永远的定例
  rationale: 保留法律条文的语气；“永远”对应 עוֹלָם，“定例”对应祭司文献中作为固定律例的 חֻקָּה。
- source_word: לְכַפֵּר עַל בְּנֵי יִשְׂרָאֵל
  choice: 为以色列人赎去……罪
  rationale: כפר 在本章祭祀语境中表示施行赎罪；“以色列人”自然表达 בְּנֵי יִשְׂרָאֵל 这一集体族称。
- source_word: מִכָּל חַטֹּאתָם
  choice: 他们的一切罪
  rationale: מן 与 כפר 连用时兼有针对罪施行赎罪和除去罪污的意味；“赎去”在中文中保留赎罪与洁除两方面的关联。
- source_word: אַחַת בַּשָּׁנָה
  choice: 每年一次
  rationale: 准确而自然地表达一年举行一次的周期。
- source_word: וַיַּעַשׂ
  choice: 他就……做了
  rationale: 希伯来文动词为第三人称阳性单数，但本节没有明说主语；保留代词，不擅自补作“亚伦”或“摩西”。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的专名形式音译四字神名。
theological_decisions:
- issue: כפר 与 מן 所表达的赎罪和洁除关系
  choice: 为以色列人赎去他们的一切罪
  alternative: 为以色列人的一切罪赎罪
  rationale: “赎去”既不把赎罪简化为单一理论，也较贴近 מן 可能突出的脱离罪污之意；脚注保留更常见的表达。
- issue: וַיַּעַשׂ 的隐含主语
  choice: 保留“他”
  alternative: 明确译为“亚伦”
  rationale: 上下文可能使读者理解为亚伦，但原文此处未重复姓名，因此不在正文中消除语法上的含蓄。
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 采用现代标准汉语中广为人知且具有专名功能的传统音译，不以“主”替代原文神名。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。“定例”“赎去……罪”保留利未记祭祀律法的正式语域，同时避免过度古雅；句序调整为中文自然表达，并保留原文末句的隐含主语。
