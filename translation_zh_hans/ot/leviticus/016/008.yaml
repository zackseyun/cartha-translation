  text: וְ/נָתַ֧ן אַהֲרֹ֛ן עַל שְׁנֵ֥י הַ/שְּׂעִירִ֖ם גּוֹרָל֑וֹת גּוֹרָ֤ל אֶחָד֙ לַ/יהוָ֔ה וְ/גוֹרָ֥ל אֶחָ֖ד לַ/עֲזָאזֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/008.yaml
  text: 'And Aaron shall cast lots over the two goats: one lot for Yahweh and one lot for Azazel[a].'
translation:
  language: zh_hans
  text: 亚伦要在两只公山羊上拈阄：一阄归耶和华，一阄归阿撒泻勒[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“一阄归替罪羊。”希伯来语“阿撒泻勒”的含义有争议；它可能是专名，也可能指这只公山羊的功用，或与“除去”有关。
    reason: alternative_reading
lexical_decisions:
- source_word: וְנָתַן
  choice: 拈阄
  rationale: 该动词本义为“给、放置”，但与“阄”和介词“在……上”连用，在此指以拈阄来分派。汉语“拈阄”自然、准确地表达这项礼仪行动。
- source_word: עַל
  choice: 在……上
  rationale: 保留介词“在……上”的空间意象，表明两只公山羊是拈阄所针对的对象，而不直接改写成解释性的“为”。
- source_word: שְׁנֵי הַשְּׂעִירִם
  choice: 两只公山羊
  rationale: שָׂעִיר在此特指公山羊；译出“公”比笼统的“山羊”更贴近希伯来语及本章祭牲语境。
- source_word: גּוֹרָלוֹת / גּוֹרָל אֶחָד
  choice: 阄 / 一阄
  rationale: “阄”是现代汉语中表示抽签所用之物或所得结果的简明对应，也保留原文单复数及重复结构。
- source_word: לַיהוָה
  choice: 归耶和华
  rationale: 介词לְ在分派语境中表示归属；“归”清楚表达一阄所指定的归属。神名四字母按中文圣经通行方式译作“耶和华”。
- source_word: לַעֲזָאזֵל
  choice: 归阿撒泻勒
  rationale: עֲזָאזֵל含义有争议。正文音译可保留它可能是专名、去处或与除去有关之称谓的开放性，避免把某一种解释写入正文。
theological_decisions:
- issue: 赎罪日礼仪中עֲזָאזֵל的含义
  choice: 正文音译作“阿撒泻勒”
  alternative: 作“替罪羊”“完全除去”，或理解为与旷野相关的某个有位格者
  rationale: 本节本身无法确定该词究竟指公山羊的功用、所去之处，还是某个有位格者。音译最能保存原文的歧义与神学张力；影响深远的“替罪羊”译法列入脚注。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“拈阄”保留礼仪语感而仍为普通读者所理解；“一阄……一阄……”对应原文的平行重复。正文脚注标记与脚注一致。
