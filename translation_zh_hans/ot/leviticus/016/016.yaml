id: LEV.16.16
reference: Leviticus 16:16
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/כִפֶּ֣ר עַל הַ/קֹּ֗דֶשׁ מִ/טֻּמְאֹת֙ בְּנֵ֣י יִשְׂרָאֵ֔ל וּ/מִ/פִּשְׁעֵי/הֶ֖ם לְ/כָל חַטֹּאתָ֑/ם וְ/כֵ֤ן יַעֲשֶׂה֙ לְ/אֹ֣הֶל מוֹעֵ֔ד הַ/שֹּׁכֵ֣ן אִתָּ֔/ם בְּ/ת֖וֹךְ טֻמְאֹתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/016.yaml
  text: Thus he shall make atonement for the sanctuary because of the uncleannesses of the sons of Israel and because of their transgressions[a], for all their sins[c][b]; and so he shall do for the tent of meeting that dwells with them in the midst of their uncleannesses.
translation:
  language: zh_hans
  text: 他要因以色列人的种种不洁，以及他们的过犯，就是他们一切的罪，为圣所行赎罪礼；他也要照样为那在他们中间、处于他们种种不洁之中的会幕行礼。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְכִפֶּר
  choice: 行赎罪礼，除去
  rationale: כפר在利未记礼仪语境中兼有赎罪与洁净圣所的作用。用“行赎罪礼”保留专门礼仪含义，并以“除去”自然衔接不洁、过犯和罪。
- source_word: עַל הַקֹּדֶשׁ
  choice: 为圣所
  rationale: הַקֹּדֶשׁ在本段指神圣的帐幕区域；“圣所”既贴近原文，也符合现代汉语礼仪语境。
- source_word: מִטֻּמְאֹת
  choice: 种种不洁
  rationale: 保留希伯来语复数所表达的多种礼仪性污秽；在汉语中“种种不洁”比生硬的“不洁净之事”更自然。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 该表达在此统指以色列群体；现代汉语以“以色列人”最自然准确，不必形式化译为“以色列的儿子们”。
- source_word: וּמִפִּשְׁעֵיהֶם לְכָל חַטֹּאתָם
  choice: 以及他们的一切过犯和罪
  rationale: פשע译作“过犯”，保留其违逆、越界的道德分量；חטאות在此与不洁和过犯并列，指“罪”而非“赎罪祭”。לְכָל与前项关系略有压缩，汉语并列可清楚传达涵盖他们一切罪的意思。
- source_word: וְכֵן יַעֲשֶׂה לְאֹהֶל מוֹעֵד
  choice: 他也要照样为会幕行礼
  rationale: “照样”保留相应礼仪行动的程序含义；אֹהֶל מוֹעֵד采用中文圣经语境中简洁而通行的“会幕”。
- source_word: הַשֹּׁכֵן אִתָּם
  choice: 会幕住在他们中间
  rationale: 保留שׁכן“居住”的拟人化表达及关系意味，不把它仅弱化为“位于”。אִתָּם在此结合下句的空间表达自然译作“在他们中间”。
- source_word: בְּתוֹךְ טֻמְאֹתָם
  choice: 处于他们种种不洁之中
  rationale: 保留圣所处在百姓不洁中的空间图景，并以“种种”反映复数。
theological_decisions:
- issue: 赎罪日语境中כפר的含义
  choice: 译为“行赎罪礼，除去”
  alternative: 仅译“洁净”或“赎罪”
  rationale: 此处礼仪既处理圣所所受的不洁污染，也涉及百姓的过犯和罪。组合表达保留赎罪礼的神学与礼仪性质，同时显明其洁除作用，避免缩减为单一层面。
- issue: 圣所与百姓不洁的关系
  choice: 保留“会幕住在他们中间，处于他们种种不洁之中”
  alternative: 解释为神住在他们中间，或仅说会幕位于营中
  rationale: 语法上分词修饰会幕；译文保留原文对会幕“居住”的拟人化张力，不把会幕直接等同于神，也不消除圣所处于不洁之中的神学意象。
- issue: לְכָל חַטֹּאתָם的句法关系
  choice: 译作“他们的一切过犯和罪”
  alternative: “因他们的过犯，就是他们一切的罪”或“为他们一切的罪”
  rationale: 原文可理解为赎罪行动涵盖所有罪，也可视作进一步界定过犯。汉语以并列方式保留各罪类均被涵盖的核心意义，而不强行断定同位或从属关系。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“行赎罪礼”保留祭司礼仪术语，“除去”帮助普通读者理解该礼仪针对圣所不洁的功用；避免古奥的“为……赎罪”可能造成替圣所本身道德犯罪赎罪的误解。全节无脚注，故正文不设脚注标记。
