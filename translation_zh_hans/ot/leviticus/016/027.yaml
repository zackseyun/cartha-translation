reference: Leviticus 16:27
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/אֵת֩ פַּ֨ר הַֽ/חַטָּ֜את וְ/אֵ֣ת שְׂעִ֣יר הַֽ/חַטָּ֗את אֲשֶׁ֨ר הוּבָ֤א אֶת דָּמָ/ם֙ לְ/כַפֵּ֣ר בַּ/קֹּ֔דֶשׁ יוֹצִ֖יא אֶל מִ/ח֣וּץ לַֽ/מַּחֲנֶ֑ה וְ/שָׂרְפ֣וּ בָ/אֵ֔שׁ אֶת עֹרֹתָ֥/ם וְ/אֶת בְּשָׂרָ֖/ם וְ/אֶת פִּרְשָֽׁ/ם׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/027.yaml
  text: And the bull for the sin offering and the goat for the sin offering, whose blood was brought in to make atonement in the sanctuary, he shall bring out to outside the camp, and they shall burn their hides, their flesh, and their dung in the fire.
translation:
  language: zh_hans
  text: 那作赎罪祭的公牛和作赎罪祭的公山羊，它们的血被带进圣所，以行赎罪礼；他要把它们带到营外[a]，他们要用火焚烧它们的皮、肉和粪[b][c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文先用单数“他要带出去”，随后改用复数“他们要焚烧”；这里保留这一数的转换，可能是区分主持礼仪的人与协助执行的人。
    reason: source_structure
  - marker: b
    text: “皮”也可译作“兽皮”。
    reason: lexical_alternative
  - marker: c
    text: “粪”指祭牲体内的排泄物，不是泛指内脏。
    reason: lexical_clarification
lexical_decisions:
- source_word: פַּר הַחַטָּאת / שְׂעִיר הַחַטָּאת
  choice: 作赎罪祭的公牛／作赎罪祭的公山羊
  rationale: 以自然的现代汉语表达祭牲与חַטָּאת这一祭类的关系；“赎罪祭”沿用通行且易懂的礼仪用语，同时不在正文中加入对该祭功能的额外解释。
- source_word: הוּבָא אֶת־דָּמָם
  choice: 它们的血被带进
  rationale: 保留原文被动语态，并用“带进”表达בוא在此处进入神圣空间的方向含义。
- source_word: לְכַפֵּר בַּקֹּדֶשׁ
  choice: 进圣所行赎罪礼
  rationale: “圣所”具体表达הַקֹּדֶשׁ所指的神圣场所；“行赎罪礼”既保留כפר的祭仪意义，也比抽象的“赎罪”更符合本节礼仪语境。
- source_word: יוֹצִיא אֶל־מִחוּץ לַמַּחֲנֶה
  choice: 他要把它们带到营外
  rationale: 用“带到营外”自然表达使役动词与方向结构；补出汉语必需的宾语“它们”，所指为两只祭牲。
- source_word: וְשָׂרְפוּ בָאֵשׁ
  choice: 他们要用火焚烧
  rationale: 保留复数谓语所暗示的复数执行者，并以“用火焚烧”呈现בָאֵשׁ的手段含义。
- source_word: עֹרֹתָם וְאֶת־בְּשָׂרָם וְאֶת־פִּרְשָׁם
  choice: 它们的皮、肉和粪
  rationale: 逐项保留祭牲被焚烧的部分；“皮”“肉”是自然准确的动物用语，“粪”则直译פֶּרֶשׁ，不误作“内脏”。
theological_decisions:
- issue: חַטָּאת与כפר的祭仪术语
  choice: 赎罪祭；行赎罪礼
  alternative: 洁净祭；施行洁净
  rationale: “赎罪祭”与“赎罪礼”是现代中文读者较熟悉的祭仪表述，也能保留经文的神学分量；不将其限定为单一的“洁净”功能，以免消除该词在礼仪语境中的语义张力。
- issue: יוֹצִיא的单数与וְשָׂרְפוּ的复数转换
  choice: 他要……他们要……
  alternative: 要把……带到……并焚烧……
  rationale: 原文明确从第三人称阳性单数转为第三人称复数。正文保留这一转换，不擅自把两个动作归给同一主体。
- issue: בַּקֹּדֶשׁ与赎罪行动的关系
  choice: 进圣所行赎罪礼
  alternative: 为圣所赎罪
  rationale: 介词ב最直接可表示行动发生的地点；上下文虽涉及圣所的洁净或赎罪，但本节本身没有明确使用“为圣所”，故正文保留地点表达，不替原文收窄对象。
translation_notes:
  register: 采用庄重而清楚的现代标准普通话。句子保留祭仪文体及原文单数转复数的结构，又用“带到营外”“用火焚烧”等自然汉语避免生硬直译。
