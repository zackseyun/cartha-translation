  text: וְ/הָיְתָ֥ה לָ/כֶ֖ם לְ/חֻקַּ֣ת עוֹלָ֑ם בַּ/חֹ֣דֶשׁ הַ֠/שְּׁבִיעִי בֶּֽ/עָשׂ֨וֹר לַ/חֹ֜דֶשׁ תְּעַנּ֣וּ אֶת נַפְשֹֽׁתֵי/כֶ֗ם וְ/כָל מְלָאכָה֙ לֹ֣א תַעֲשׂ֔וּ הָֽ/אֶזְרָ֔ח וְ/הַ/גֵּ֖ר הַ/גָּ֥ר בְּ/תוֹכְ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/029.yaml
  text: 'And this shall be for you a permanent statute: in the seventh month[a], on the tenth day of the month, you shall humble yourselves, and you shall do no work, whether the native-born or the sojourner who sojourns among you.'
translation:
  language: zh_hans
  text: “这要作你们永远的律例：七月初十，你们要刻苦自己[a]，不可做任何工作；无论是本地出生的人，还是寄居在你们中间的外来人，都不可做。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“使自己受苦”或“谦卑自己”；传统上通常理解这包括禁食。
    reason: 说明希伯来语短语的较直译表达及其传统礼仪含义，同时不在正文中将其缩窄为禁食。
lexical_decisions:
- source_word: וְהָיְתָה
  choice: 这要作
  rationale: 这是法律条文的惯用表达；“这”承接上文所规定的赎罪日礼仪，现代汉语中比直译为“它要成为”自然。
- source_word: לְחֻקַּת עוֹלָם
  choice: 永远的律例
  rationale: חֻקָּה指规定、律例；עוֹלָם在此表达持续长久的约内义务。“永远的律例”既保留原文力度，也符合中文圣经法律语体。
- source_word: בַּחֹדֶשׁ הַשְּׁבִיעִי בֶּעָשׂוֹר לַחֹדֶשׁ
  choice: 七月初十
  rationale: 原文为“第七月，在该月第十日”。“七月初十”是自然、准确的汉语日期表达。
- source_word: תְּעַנּוּ אֶת־נַפְשֹׁתֵיכֶם
  choice: 你们要刻苦自己
  rationale: 该短语字面涉及使自身受苦或降卑，在赎罪日语境中表示自我克制与谦卑，传统上包括禁食。“刻苦自己”保留其广度，不把含义限定为单一礼仪行为。
- source_word: וְכָל־מְלָאכָה לֹא תַעֲשׂוּ
  choice: 任何工都不可做
  rationale: מְלָאכָה指工作、劳作；此译简洁地表达全面禁工的法律命令。
- source_word: הָאֶזְרָח
  choice: 本地人
  rationale: אֶזְרָח指本地出生并属于群体的人；“本地人”自然地保留其与寄居者的对比。
- source_word: הַגֵּר הַגָּר בְּתוֹכְכֶם
  choice: 寄居在你们中间的外来人
  rationale: גֵּר指住在以色列群体中的外来居民。“外来人”说明其身份，“寄居在你们中间”反映同根名词与动词的强调，同时避免现代政治色彩过重的用语。
theological_decisions:
- issue: 赎罪日命令中“刻苦自己”的含义
  choice: 正文采用范围较广的“刻苦自己”，不直接写成“禁食”。
  alternative: “使自己受苦”、“谦卑自己”或“禁食”
  rationale: 希伯来语表达比禁食这一具体行为更广，虽然后来的传统通常将禁食包括在内。译文保留这种语义张力，避免把一种较窄的礼仪解释写入正文。
translation_notes:
  register: 采用现代、庄重而易懂的法律语体。“永远的律例”保留经文的约法色彩；“都要如此”明确本地人与寄居者同受前述两项命令约束。脚注标记紧随其所解释的“刻苦自己”。
