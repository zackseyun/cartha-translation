id: LEV.16.32
reference: Leviticus 16:32
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/כִפֶּ֨ר הַ/כֹּהֵ֜ן אֲשֶׁר יִמְשַׁ֣ח אֹת֗/וֹ וַ/אֲשֶׁ֤ר יְמַלֵּא֙ אֶת יָד֔/וֹ לְ/כַהֵ֖ן תַּ֣חַת אָבִ֑י/ו וְ/לָבַ֛שׁ אֶת בִּגְדֵ֥י הַ/בָּ֖ד בִּגְדֵ֥י הַ/קֹּֽדֶשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/032.yaml
  text: And the priest who is anointed and whose hand is filled to serve as priest in place of his father shall make atonement[a], and he shall put on the linen garments, the holy garments.
translation:
  language: zh_hans
  text: 那受膏、承接圣职[a]，接替父亲担任祭司的祭司，要行赎罪礼；他要穿上细麻布衣，就是圣衣。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“使他的手充满”，是授予职分、使人就任祭司的惯用说法。
    reason: 保存希伯来文授职惯用语的字面形式，并解释其含义。
lexical_decisions:
- source_word: וְכִפֶּר
  choice: 要行赎罪礼
  rationale: כפר在祭司礼仪语境中指按规定礼仪施行赎罪。“行赎罪礼”既保留礼仪含义，也避免对其作用机制作过度解释。
- source_word: הַכֹּהֵן
  choice: 祭司
  rationale: 希伯来文仅称“祭司”，随后以受膏、承接圣职和接替父亲来界定其身份；因此不直接增译为“大祭司”。
- source_word: אֲשֶׁר יִמְשַׁח אֹתוֹ
  choice: 受膏
  rationale: 原文直译近于“（有人）膏他”，施事者没有明说；中文用被动性质的“受膏”自然表达其已获膏立的身份，同时不补出施事者。
- source_word: וַאֲשֶׁר יְמַלֵּא אֶת יָדוֹ
  choice: 承接圣职
  rationale: “使他的手充满”是授予祭司职分、使其就任的固定说法。“承接圣职”是现代中文圣经语境中清楚而庄重的表达，字面意象则收入脚注。
- source_word: לְכַהֵן
  choice: 担任祭司
  rationale: 该不定式表示履行祭司职务；“担任祭司”符合现代汉语，并清楚表达职分。
- source_word: תַּחַת אָבִיו
  choice: 接替父亲
  rationale: תחת在这里表示在职分上取代、继任；“接替父亲”简洁传达世袭继任关系。
- source_word: וְלָבַשׁ
  choice: 他要穿上
  rationale: 该动词表示穿上衣物；“穿上”保留礼仪行动及经文中的责任语气。
- source_word: בִּגְדֵי הַבָּד
  choice: 细麻布衣
  rationale: בד在祭司服饰语境中指麻布；“细麻布衣”自然、明确，并与利未记礼仪服饰用语相称。
- source_word: בִּגְדֵי הַקֹּדֶשׁ
  choice: 就是圣衣
  rationale: 后一个短语与“细麻布衣”构成同位说明，指出这些衣服是分别为圣的衣服；“就是”显明这一关系。
theological_decisions:
- issue: 是否将 הַכֹּהֵן 解释性译为“大祭司”
  choice: 祭司
  alternative: 大祭司
  rationale: 上下文所指确是承继大祭司职分的人，但本节原文没有使用“大祭司”这一称号，而以受膏、承接圣职和接替父亲来描述他。译文保留原文的称谓方式。
- issue: 如何处理“使他的手充满”这一授职惯用语
  choice: 承接圣职，并以脚注保存字面表达
  alternative: 使他的手充满；受任；被授职
  rationale: 逐字直译在现代中文中容易令人误解；“承接圣职”传达祭司就任的制度性含义，而脚注使原文意象仍可查考。
- issue: כפר在本节是泛称“赎罪”还是强调礼仪行动
  choice: 行赎罪礼
  alternative: 赎罪；施行遮罪
  rationale: 本章语境是赎罪日规定的祭司礼仪。“行赎罪礼”保留其礼仪指向，同时不限定赎罪的神学机制。
translation_notes:
  register: 采用现代、庄重而易懂的普通话书面语。“要”表达律法规定的责任；以分号区分赎罪礼与穿圣衣两项相关行动。脚注标记紧随其实际解释的“承接圣职”，避免错置。
