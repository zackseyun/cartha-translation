  text: וְ/לָקַח֙ מִ/דַּ֣ם הַ/פָּ֔ר וְ/הִזָּ֧ה בְ/אֶצְבָּע֛/וֹ עַל פְּנֵ֥י הַ/כַּפֹּ֖רֶת קֵ֑דְמָ/ה וְ/לִ/פְנֵ֣י הַ/כַּפֹּ֗רֶת יַזֶּ֧ה שֶֽׁבַע פְּעָמִ֛ים מִן הַ/דָּ֖ם בְּ/אֶצְבָּעֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/014.yaml
  text: And he shall take some of the bull's blood and sprinkle it with his finger on the front of the mercy seat[a], eastward; and before the mercy seat he shall sprinkle some of the blood with his finger seven times.
translation:
  language: zh_hans
  text: 他要取一些公牛的血，用手指弹在施恩座[a]的东面；又要用手指在施恩座前弹一些血，七次。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “施恩座”指约柜的盖，也可译作“赎罪盖”。
    reason: 说明希伯来语 כַּפֹּרֶת 所指的具体器物，并保留较直接体现其赎罪关联的替代译法。
lexical_decisions:
- source_word: וְלָקַח
  choice: 他要取
  rationale: 连词加完成式在祭祀程序中承接上一动作，表达规定性的下一步骤；现代汉语用“要”自然体现这一语气。
- source_word: מִדַּם הַפָּר
  choice: 一些公牛的血
  rationale: 介词 מִן 在此具有部分义，表示从公牛的血中取一部分。
- source_word: וְהִזָּה / יַזֶּה
  choice: 弹
  rationale: נזה 在祭司礼仪语境中指用指头将血液弹洒出去；“弹”比泛称的“洒”更具体，也与所述手法相符。
- source_word: בְאֶצְבָּעוֹ
  choice: 用指头
  rationale: 介词 בְּ 表示施行动作的工具；“用指头”是自然、明确的现代汉语。
- source_word: עַל פְּנֵי הַכַּפֹּרֶת קֵדְמָה
  choice: 朝东弹在施恩座的表面上
  rationale: עַל פְּנֵי 表示在物体的面或表面上，קֵדְמָה 表示朝东或在东面；此译保留血弹在盖面上以及东方方位这两项信息，而不将“表面”与下句“座前”混同。
- source_word: הַכַּפֹּרֶת
  choice: 施恩座
  rationale: 这是约柜上盖的专称。“施恩座”在中文圣经传统中辨识度高；脚注同时说明其实体所指及较直译的替代译法。
- source_word: וְלִפְנֵי הַכַּפֹּרֶת
  choice: 又要……在施恩座前
  rationale: לִפְנֵי 表示在某物前面；此处与前一动作弹在盖的表面上形成空间上的区别。
- source_word: שֶׁבַע פְּעָמִים
  choice: 共七次
  rationale: 明确保留礼仪规定的次数；“共”自然说明七次是该重复动作的总数。
- source_word: מִן הַדָּם
  choice: 一些血
  rationale: 再次按部分义理解 מִן，表示每次取用一部分血，而非搬运全部的血。
theological_decisions:
- issue: הַכַּפֹּרֶת 的译法
  choice: 施恩座
  alternative: 赎罪盖
  rationale: 该词指约柜的盖，并与赎罪礼仪密切相关。“施恩座”保留中文读者熟悉的礼仪专称，但不让传统译名掩盖其实体含义，因此在脚注中列出“赎罪盖”并加以说明。
- issue: 第一次弹血的空间关系
  choice: 朝东弹在施恩座的表面上
  alternative: 弹在施恩座东面的部分
  rationale: 原文 עַל פְּנֵי הַכַּפֹּרֶת קֵדְמָה 同时包含“在……表面上”和东方方位；主译文不把方位过度限定为盖子的某个固定分区，也不将其误解为只在施恩座前的地面上。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“弹血”准确呈现祭司用指头施行的礼仪动作；句式依次交代取血、第一次弹血的方位与位置，以及第二次弹血的次数，避免不必要的古语和宗派化解释。
