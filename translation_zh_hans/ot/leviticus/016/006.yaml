base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/006.yaml
  text: Aaron shall present the bull of the sin offering that is for himself[a], and he shall make atonement for himself and for his household.
translation:
  language: zh_hans
  text: 亚伦要把那头为自己预备的赎罪祭公牛[a]奉上，为自己和家人赎罪。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “赎罪祭”也可译作“洁净祭”。希伯来语 חַטָּאת 可指赎罪祭；在一些语境中，这一名称特别强调礼仪上的洁净。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרִיב
  choice: 牵来
  rationale: 在献祭语境中，הקריב指把祭牲带近、呈到耶和华面前；此处尚未描述完整宰献过程，因此译作“牵来”既自然，也避免过早表达为“献上”。
- source_word: פַּר
  choice: 公牛
  rationale: פַּר指公牛；现代汉语以“公牛”清楚自然地表达祭牲的种类。
- source_word: הַחַטָּאת
  choice: 赎罪祭
  rationale: 此处חַטָּאת不是抽象的“罪”，而是祭物名称。“赎罪祭”是现代中文圣经语境中清楚且通行的译法；其礼仪洁净含义以脚注保留。
- source_word: אֲשֶׁר לוֹ
  choice: 为自己献作
  rationale: 该短语表明这头牛是指定给亚伦本人使用的祭牲，并与下文“为自己……赎罪”相呼应；译文按中文习惯明确其祭祀用途。
- source_word: וְכִפֶּר
  choice: 赎罪
  rationale: כפר在祭司礼仪语境中表达施行遮盖、洁除而达成和好的礼仪行动；“赎罪”保留其核心祭祀与神学分量，而不额外限定机制。
- source_word: בַּעֲדוֹ
  choice: 为自己
  rationale: בְּעַד加代词后缀表示“为、代表”；“为自己”简洁准确。
- source_word: וּבְעַד בֵּיתוֹ
  choice: 和家人
  rationale: בֵּיתוֹ在这里指亚伦的家属或家庭群体，而非房屋建筑；“家人”是普通现代读者最自然的表达。
theological_decisions:
- issue: 祭祀律例中חַטָּאת的译法
  choice: 赎罪祭
  alternative: 洁净祭
  rationale: 上下文明确指一种祭物。“赎罪祭”保留传统而易懂的罪与赎罪关联；“洁净祭”所强调的礼仪洁净功能则在脚注中说明，以保存原词的语义张力。
- issue: בֵּיתוֹ的范围
  choice: 家人
  alternative: 家；家属
  rationale: 此处所指很可能是亚伦的家庭或家属，而不是建筑物；“家人”自然明白，也不引入经文未明说的更广泛制度性含义。
- issue: וְהִקְרִיב所描述的礼仪阶段
  choice: 牵来
  alternative: 献上；带到近前
  rationale: 该动词在此可指把祭牲带近并呈上，未必单独涵盖全部献祭动作。“牵来”符合公牛这一有生命祭牲，也保留程序逐步展开的特点。
translation_notes:
  register: 采用现代、庄重而易懂的礼仪叙述。“牵来”贴合公牛祭牲和程序语境；“家人”比直译“他的家”更符合现代普通话。脚注标记[a]已置于对应词组之后。
