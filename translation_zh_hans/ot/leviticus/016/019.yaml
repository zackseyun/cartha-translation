  text: וְ/הִזָּ֨ה עָלָ֧י/ו מִן הַ/דָּ֛ם בְּ/אֶצְבָּע֖/וֹ שֶׁ֣בַע פְּעָמִ֑ים וְ/טִהֲר֣/וֹ וְ/קִדְּשׁ֔/וֹ מִ/טֻּמְאֹ֖ת בְּנֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/019.yaml
  text: He shall sprinkle some of the blood on it with his finger seven times[c][b][a], and cleanse it and consecrate it from the uncleannesses of the sons of Israel.
translation:
  language: zh_hans
  text: 他要用手指将一些血洒在坛上七次，洁净坛[a]，使坛成圣[b]，使坛脱离以色列人[c]的种种不洁。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “洁净”也可译作“使……洁净”。这里的希伯来语动词是祭司礼仪用语，指使祭坛在礼仪上洁净。
    reason: lexical_alternative
  - marker: b
    text: “使……成圣”也可译作“使……成为圣洁”或“将……分别为圣”。
    reason: lexical_alternative
  - marker: c
    text: “以色列人”，希伯来语字面意思是“以色列的众子”，在这里指以色列全体民众。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִזָּה
  choice: 弹
  rationale: 该动词在祭司礼仪语境中指把血洒出或弹出；“弹”与“用指头”自然衔接，也准确呈现具体动作。
- source_word: עָלָיו
  choice: 在坛上
  rationale: 代词所指承接上一节的祭坛。汉语中明确说“坛”可避免连续使用“它”造成含混，所补信息由上下文直接提供。
- source_word: מִן־הַדָּם
  choice: 一些血
  rationale: 介词 מִן 在此具有部分义，表示从已有的血中取一部分。
- source_word: בְּאֶצְבָּעוֹ
  choice: 用指头
  rationale: בְּ 表示工具或手段；“用指头”是现代汉语中自然、明确的表达。
- source_word: שֶׁבַע פְּעָמִים
  choice: 七次
  rationale: 直译数量短语，保留礼仪次数的明确规定。
- source_word: וְטִהֲרוֹ
  choice: 洁净坛
  rationale: טהר 在祭司礼仪中指使某物在礼仪上洁净；“洁净”既通俗又保留祭仪含义。
- source_word: וְקִדְּשׁוֹ
  choice: 使坛成圣
  rationale: קדש 在此指使祭坛成为圣洁、分别归于神；“使……成圣”准确保留其礼仪和神圣范畴。
- source_word: מִטֻּמְאֹת
  choice: 脱离……的种种污秽
  rationale: 保留介词 מִן 的分离意味及名词复数；“种种污秽”比生硬的“诸污秽”更符合现代汉语。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 这是现代汉语对该群体称谓最自然的表达；脚注保留希伯来语字面形式“以色列的众子”。
theological_decisions:
- issue: 祭坛的礼仪洁净与成圣
  choice: 译为“洁净坛，使坛成圣，使坛脱离……污秽”
  alternative: 可译为“使坛洁净，并将坛分别为圣，除去……的不洁”
  rationale: 经文所述是祭司礼仪作用于祭坛，并非祭坛发生道德改变，也不是在谈人的内在更新。译文保留礼仪洁净、成圣及与污秽分离三层表达。
- issue: בְּנֵי יִשְׂרָאֵל 的群体指称
  choice: 正文译为“以色列人”
  alternative: 字面可译为“以色列的众子”或传统表达“以色列子民”
  rationale: 该短语在这里是全体群体的固定称呼；“以色列人”在现代汉语中清楚自然，并不排除女性。字面形式通过脚注交代，避免把语法形式误解为仅限男性。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“弹”具体呈现祭司用指头洒血的动作；重复“坛”以明确代词所指，并形成适合礼仪条文的清晰节奏。“种种污秽”保留希伯来语复数，同时避免过度古雅或技术化。
