base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/013.yaml
  text: And he shall put the incense on the fire before Yahweh[a], so that the cloud of the incense may cover the mercy seat that is over the testimony, so that he may not die.
translation:
  language: zh_hans
  text: 他要在雅威面前把香放在火上，使香的烟云遮住法版上方的赎罪盖[a]，免得他死亡。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“施恩座”。希伯来语所指的是约柜的盖，特别与赎罪礼有关。
    reason: 提供传统译名及必要的词义说明。
lexical_decisions:
- source_word: וְנָתַן
  choice: 他要……放
  rationale: 连词加完成式在祭仪规程中具有指示作用；“要……放”自然表达规定性的动作。
- source_word: הַקְּטֹרֶת
  choice: 香
  rationale: 指圣所礼仪所用的香；中文用“香”简洁自然，无须增译为“香料混合物”。
- source_word: עַל הָאֵשׁ
  choice: 放在火上
  rationale: 直接表达把香置于火或燃烧的炭火之上，贴合希伯来语空间关系。
- source_word: לִפְנֵי יְהוָה
  choice: 在雅威面前
  rationale: 既保留祭仪中处于神面前的含义，也用“雅威”音译神名。
- source_word: וְכִסָּה
  choice: 使……遮住
  rationale: 在上下文中表达前一动作所要产生的目的或结果，同时不将其过度限定为单一语义关系。
- source_word: עֲנַן הַקְּטֹרֶת
  choice: 香的云雾
  rationale: 保留“云”的意象，并以“云雾”表达香燃烧后形成、能够遮蔽的烟云。
- source_word: הַכַּפֹּרֶת
  choice: 赎罪盖
  rationale: 该词指约柜之盖，且在赎罪礼中具有核心作用；“赎罪盖”比传统的“施恩座”更直接显示其实体和祭仪关联。
- source_word: אֲשֶׁר עַל הָעֵדוּת
  choice: 见证版上面的
  rationale: עֵדוּת在会幕语境中指作为盟约见证、存放在柜中的法版；译作“见证版”既保留“见证”一义，也避免现代读者误解为抽象的见证。
- source_word: וְלֹא יָמוּת
  choice: 免得他死亡
  rationale: 简明表达若不按此规程行便面临死亡的警告，也保留目的与后果之间的张力。
theological_decisions:
- issue: הַכַּפֹּרֶת在赎罪礼语境中的译法
  choice: 赎罪盖
  alternative: 施恩座
  rationale: 原词所指首先是柜盖，并与赎罪礼密切相关。“赎罪盖”兼顾实物所指与礼仪功能；传统译名“施恩座”列入脚注，以保留读者熟悉的对应说法。
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 以现代汉语音译四字神名，表明原文使用的是以色列之神的专名，而非“主”这一称号。
- issue: וְכִסָּה与末句的逻辑关系
  choice: 使……遮住……免得他死亡
  alternative: 香云就遮住……他便不至死亡
  rationale: 原文连词结构可涵盖目的和结果；此译法自然呈现祭仪动作的保护作用，而不对其机制作额外神学解释。
translation_notes:
  register: 采用庄重而清楚的现代书面汉语。“把香放在火上”保持动作具体；“香的云雾”保留原文的云彩意象；句末“免得他死亡”简洁传达祭仪警告。脚注标记[a]置于所解释的“赎罪盖”之后。
