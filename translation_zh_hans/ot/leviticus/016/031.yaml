  text: שַׁבַּ֨ת שַׁבָּת֥וֹן הִיא֙ לָ/כֶ֔ם וְ/עִנִּיתֶ֖ם אֶת נַפְשֹׁתֵי/כֶ֑ם חֻקַּ֖ת עוֹלָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/031.yaml
  text: It is a Sabbath of complete rest for you[a], and you shall humble yourselves; it is a permanent statute.
translation:
  language: zh_hans
  text: 这是给你们的完全安息日；你们要刻苦己心[a]。这是永远的律例。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“使自己受苦”；传统上理解为包括禁食和自我克制。
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׁבַּת שַׁבָּתוֹן
  choice: 完全安息的安息日
  rationale: 保留“安息日”这一固定的礼仪和神学称谓，并用“完全安息”表达重叠结构的加强含义，表明这是彻底停止日常劳作的日子。
- source_word: הִיא לָכֶם
  choice: 这是你们……的
  rationale: 以自然的现代汉语表达原文面向群体的系词判断，同时保留“为你们”的指向。
- source_word: וְעִנִּיתֶם אֶת נַפְשֹׁתֵיכֶם
  choice: 你们要刻苦己心
  rationale: “己心”在此表达整个自身，而不把 נֶפֶשׁ 狭义化为与身体相对的“灵魂”；“刻苦”保留自我克制和降卑的礼仪含义，也不直接把命令限定为禁食。
- source_word: חֻקַּת עוֹלָם
  choice: 永远的律例
  rationale: 采用简明庄重的律法用语，保留 עוֹלָם 所表达的持续、长久效力。
theological_decisions:
- issue: 赎罪日自我克制命令的具体含义
  choice: 刻苦己心
  alternative: 使自己受苦；禁食；克制自己
  rationale: 原文 ענה + נפשׁ 是较宽泛的礼仪性表达，传统上包括禁食和自我克制，但并未直接使用“禁食”的专门动词。因此正文保留较宽的命令，脚注说明其可能范围，不把传统实践等同于词汇本身。
translation_notes:
  register: 采用现代、庄重而易懂的律法语体。“完全安息的安息日”略带重复，以保留希伯来文 שַׁבַּת שַׁבָּתוֹן 的加强表达；“刻苦己心”沿用读者较熟悉的宗教语汇，并由脚注澄清其词义范围。
