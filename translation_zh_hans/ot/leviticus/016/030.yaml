source:
  edition: WLC
  text: כִּֽי בַ/יּ֥וֹם הַ/זֶּ֛ה יְכַפֵּ֥ר עֲלֵי/כֶ֖ם לְ/טַהֵ֣ר אֶתְ/כֶ֑ם מִ/כֹּל֙ חַטֹּ֣אתֵי/כֶ֔ם לִ/פְנֵ֥י יְהוָ֖ה תִּטְהָֽרוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/030.yaml
  text: For on this day atonement shall be made for you to cleanse you[b][a]; from all your sins before Yahweh you shall be clean.
translation:
  language: zh_hans
  text: 因为在这一天，要为你们赎罪，使你们洁净；在雅威面前，你们必从一切的罪中得洁净。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，为赎罪日的命令说明理由；现代汉语用“因为”自然清楚。
- source_word: בַיּוֹם הַזֶּה
  choice: 在这一天
  rationale: 保留指示词“这”及礼仪语境中的时间指向。
- source_word: יְכַפֵּר עֲלֵיכֶם
  choice: 要为你们行赎罪礼
  rationale: כפר 的 Piel 在此是祭祀礼仪用语；“行赎罪礼”保留礼仪含义。希伯来语动词为第三人称阳性单数，但本分句没有明说主语，故正文采用汉语无主句，避免擅自指定施行者。
- source_word: לְטַהֵר אֶתְכֶם
  choice: 使你们洁净
  rationale: 表达赎罪礼的目的或结果，并保留 טהר 的洁净范畴。
- source_word: מִכֹּל חַטֹּאתֵיכֶם
  choice: 从自己一切的罪中
  rationale: חטאת 在这里指百姓的罪，而非赎罪祭；介词 מן 表达从罪污中得洁净。
- source_word: לִפְנֵי יְהוָה
  choice: 在雅威面前
  rationale: לִפְנֵי 表示在……面前或临在中；以“雅威”音译圣名 יהוה。
- source_word: תִּטְהָרוּ
  choice: 必……得洁净
  rationale: Qal 未完成式表达礼仪完成后的洁净状态或结果，并与前面的使役式“使你们洁净”有所区分。
theological_decisions:
- issue: יְהוָה（YHWH）的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字圣名；“雅威”较贴近通行的学术复原，也不以称号取代专名。
- issue: 赎罪礼施行者是否明说
  choice: 采用无主句“要为你们行赎罪礼”
  alternative: 他要为你们赎罪
  rationale: יְכַפֵּר 是第三人称阳性单数，但本分句未明说主语。正文不擅自判定是祭司或别的施行者，脚注保留直译可能。
- issue: כפר 的神学范围
  choice: 行赎罪礼
  alternative: 遮罪；除罪；平息愤怒
  rationale: 保留利未记祭祀语境中的综合性礼仪用语，不把后来的单一赎罪理论写入正文。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“行赎罪礼”凸显祭祀语境；分号呈现前后两层意思：赎罪礼使人洁净，以及人在雅威面前从一切罪中得洁净。
