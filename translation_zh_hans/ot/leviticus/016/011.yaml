base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/011.yaml
  text: Aaron shall present the bull of the sin offering that is for himself[a], and he shall make atonement for himself and for his household[b]; then he shall slaughter the bull of the sin offering that is for himself.
translation:
  language: zh_hans
  text: 亚伦要把那头为自己作赎罪祭的公牛带到近前[a]，为自己和家中之人[b]赎罪；然后，他要宰杀那头为自己作赎罪祭的公牛。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “作赎罪祭的公牛”也可译作“为赎罪祭所用的公牛”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译为“为自己和自己的家”；这里的“家”指他家中的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרִיב
  choice: 要……带到近前
  rationale: 使役式在献祭语境中表示把祭牲带近或呈上。译作“带到近前”既保留礼仪动作，也不提前把尚未宰杀的公牛说成已经完全献上。
- source_word: פַּר הַחַטָּאת
  choice: 作赎罪祭的公牛
  rationale: 该结构指与赎罪祭相关的公牛；这一表达符合现代汉语，也保留“赎罪祭”这一祭祀术语。
- source_word: אֲשֶׁר לוֹ
  choice: 为自己
  rationale: 这里重点不是公牛归亚伦所有，而是它被指定用来为亚伦本人献祭，因此译作“为自己”。
- source_word: וְכִפֶּר
  choice: 赎罪
  rationale: כפר在祭司礼仪中表示施行赎罪之礼。“赎罪”沿用清楚而宽泛的祭祀用语，不限定其具体神学机制。
- source_word: בַּעֲדוֹ וּבְעַד בֵּיתוֹ
  choice: 为自己和家人
  rationale: בעד表示“为了、代表”；ביתו字面为“他的家”，此处所指是他家中的人，现代汉语用“家人”更自然。
- source_word: וְשָׁחַט
  choice: 然后，他要宰杀
  rationale: שׁחט是献祭时宰杀牲畜的标准用词；“然后”自然表达希伯来文连接词在此处呈现的行动次序。
- source_word: פַּר הַחַטָּאת אֲשֶׁר לוֹ
  choice: 那头为自己作赎罪祭的公牛
  rationale: 前后两处采用同样译法，体现希伯来文刻意的重复和礼仪重点。
theological_decisions:
- issue: 献祭语境中כפר的译法
  choice: 赎罪
  alternative: 洁净；施行遮罪
  rationale: “赎罪”保留该词在祭司礼仪中的传统而宽广的含义，只陈述礼仪行动及其对象，不把经文限定为某一种后来的赎罪理论。
translation_notes:
  register: 采用现代、庄重而易懂的礼仪叙述。“带到近前”比“献上”更明确地区分呈上祭牲与随后宰杀的步骤；保留原文中“为自己作赎罪祭的公牛”的重复。
