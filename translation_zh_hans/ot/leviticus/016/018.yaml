  text: וְ/יָצָ֗א אֶל הַ/מִּזְבֵּ֛חַ אֲשֶׁ֥ר לִ/פְנֵֽי יְהוָ֖ה וְ/כִפֶּ֣ר עָלָ֑י/ו וְ/לָקַ֞ח מִ/דַּ֤ם הַ/פָּר֙ וּ/מִ/דַּ֣ם הַ/שָּׂעִ֔יר וְ/נָתַ֛ן עַל קַרְנ֥וֹת הַ/מִּזְבֵּ֖חַ סָבִֽיב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/018.yaml
  text: Then he shall go out to the altar that is before Yahweh and make atonement for it[a], and he shall take some of the bull's blood and some of the goat's blood and put it on the horns of the altar all around.
translation:
  language: zh_hans
  text: 随后，他要出来，到耶和华面前的祭坛那里，为祭坛行赎罪礼。他要取些公牛的血和公山羊的血，抹在祭坛四角上。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְיָצָא
  choice: 随后，他要出来
  rationale: 该形式在礼仪指令中承接前文步骤；“随后”清楚表达程序次序，“出来”保留从内层圣所向外移动的含义。
- source_word: הַמִּזְבֵּחַ אֲשֶׁר לִפְנֵי יְהוָה
  choice: 耶和华面前的祭坛
  rationale: לִפְנֵי直译为“在……面前”，在本段圣所语境中用于指明祭坛的位置。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的神圣名字译法，保留原文专名而不以头衔替代。
- source_word: וְכִפֶּר עָלָיו
  choice: 为坛行赎罪礼
  rationale: כפר在祭司礼仪语境中兼有赎罪及洁净之意；“行赎罪礼”保留其礼仪和神学分量，并明确代词所指是祭坛。
- source_word: וְלָקַח מִדַּם הַפָּר וּמִדַּם הַשָּׂעִיר
  choice: 取一些公牛的血和公山羊的血
  rationale: 重复的מִן具有部分义，故译作“取一些”；שָׂעִיר在此指公山羊，明译性别既准确也自然。
- source_word: וְנָתַן עַל קַרְנוֹת הַמִּזְבֵּחַ סָבִיב
  choice: 抹在祭坛四周的各角上
  rationale: נָתַן基本义为放置，但在把血施于坛角的礼仪动作中，“抹在”是自然准确的中文；“四周的各角”表达סָבִיב所指的周遍性。
theological_decisions:
- issue: 祭司礼仪语境中כפר的译法
  choice: 为坛行赎罪礼
  alternative: 洁净坛／为坛除污
  rationale: 本节的动作以祭坛为对象，含有洁净、除污意味，但כפר的语义不宜被缩窄为单一的洁净概念。正文采用较宽广且具礼仪性的“行赎罪礼”，脚注保留洁净义。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“祭坛”“坛角”“赎罪礼”等词符合利未记礼仪语境；句式按礼仪步骤自然推进，避免文言化，也不额外解释血是否混合。
