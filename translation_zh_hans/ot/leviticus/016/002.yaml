  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁ֗ה דַּבֵּר֮ אֶל אַהֲרֹ֣ן אָחִי/ךָ֒ וְ/אַל יָבֹ֤א בְ/כָל עֵת֙ אֶל הַ/קֹּ֔דֶשׁ מִ/בֵּ֖ית לַ/פָּרֹ֑כֶת אֶל פְּנֵ֨י הַ/כַּפֹּ֜רֶת אֲשֶׁ֤ר עַל הָ/אָרֹן֙ וְ/לֹ֣א יָמ֔וּת כִּ֚י בֶּֽ/עָנָ֔ן אֵרָאֶ֖ה עַל הַ/כַּפֹּֽרֶת־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/002.yaml
  text: And Yahweh said to Moses[a], “Tell Aaron your brother that he must not come at just any time into the Holy Place, inside the veil, before the atonement cover that is on the ark, so that he may not die. For I will appear in the cloud over the atonement cover.”
translation:
  language: zh_hans
  text: 耶和华对摩西说：“你要告诉你的兄弟亚伦，不可随时进入幔子里面的圣所，来到柜上的赎罪盖[a]前，免得他死亡，因为我要在云中显现在赎罪盖上方。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “赎罪盖”传统译作“施恩座”。
    reason: 保留 כַּפֹּרֶת 的重要传统译法，同时正文采用更能显示实体与礼仪功能的表达。
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的专名形式“耶和华”，使四字神名作为名字呈现，而不以“主”这一称号代替。
- source_word: דַּבֵּר אֶל אַהֲרֹן אָחִיךָ
  choice: 你要告诉你哥哥亚伦
  rationale: “告诉”自然传达命令摩西向亚伦转告的语气；“你哥哥亚伦”符合现代汉语习惯，也保留亲属关系。
- source_word: וְאַל יָבֹא בְכָל עֵת
  choice: 不可随时进入
  rationale: 否定祈使表达禁令；“不可随时”表示不得不受限制地任意进入，并非说不可持续不断地进入。
- source_word: הַקֹּדֶשׁ מִבֵּית לַפָּרֹכֶת
  choice: 幔子里面的圣所
  rationale: 该短语指幔子内侧的神圣空间；这一表达既交代位置，也保持祭仪语境中的庄重。
- source_word: אֶל פְּנֵי הַכַּפֹּרֶת
  choice: 来到……赎罪盖前
  rationale: פני 表示在某物面前；加入“来到”使中文句法自然，同时不改变进入该处的空间含义。
- source_word: הַכַּפֹּרֶת
  choice: 赎罪盖
  rationale: 此词指约柜的盖，并与赎罪礼仪密切相关；“赎罪盖”同时保留具体物件和礼仪功能，传统译法另见脚注。
- source_word: הָאָרֹן
  choice: 柜
  rationale: 原文仅说“柜”，未使用“约柜”的完整称谓，因此正文不作增补。
- source_word: וְלֹא יָמוּת
  choice: 免得他死亡
  rationale: 清楚表达所警告并要避免的后果，语体庄重而不古奥。
- source_word: כִּי בֶעָנָן אֵרָאֶה עַל הַכַּפֹּרֶת
  choice: 因为我要在云中显现在赎罪盖上方
  rationale: 保留“因为”所引出的理由，以及“在云中”的显现方式；“上方”自然表达 עַל 的空间关系。
theological_decisions:
- issue: כַּפֹּרֶת 在会幕礼仪中的译法
  choice: 赎罪盖
  alternative: 施恩座
  rationale: “赎罪盖”明确这是柜上的实体盖板，并传达其赎罪礼仪意义；“施恩座”虽有悠久传统，却容易令现代读者首先理解为座位，故列入脚注而不置于正文。
- issue: בְּכָל עֵת 的限制范围
  choice: 不可随时进入
  alternative: 不可在任何时候进入
  rationale: 上下文所禁的是不受规定约束的进入，并非绝对禁止一切进入；“不可随时”保留这种受指定时机限制的含义。
- issue: 神在云中的显现
  choice: 我要在云中显现
  alternative: 我在云中显现
  rationale: 希伯来语未明确解释云是常驻现象还是特定礼仪中的显现媒介；采用将来式语气自然承接禁令，同时不进一步界定显现方式。
translation_notes:
  register: 采用现代、庄重、清楚的标准普通话。句式保留神谕的权威语气，避免生硬直译；祭仪术语尽量透明，并用脚注保存传统称谓。
