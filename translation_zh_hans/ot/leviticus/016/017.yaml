  timestamp: '2026-07-14T04:50:47Z'
review_pass:
  verdict: revise
  source_fidelity: 原文的禁令覆盖“他进入圣所赎罪，直到他出来”的整个期间，随后说明他为自己、家和以色列全会众赎罪。草案基本传达此意，但将“会幕里不可有任何人”置于时间从句之后，中文可被误读为禁令仅在“出来”之后生效；宜使“直到”明确辖及禁令的持续时段。
  naturalness: “他进去在圣所行赎罪礼时”语序不够自然；“当他进入圣所行赎罪礼时……直到他出来”更清晰、庄重。“行赎罪礼”可理解，但在本节两个动词均为祭司执行的赎罪行为，以“赎罪”直译更简洁且不减损礼仪语境。
  terminology: “会幕”“圣所”“以色列全会众”均合乎本章及现代中文圣经语域。אָדָם在此为泛称，译“任何人”恰当。כפר译“赎罪”能保留原文的核心语义，且不添加特定教义解释。
  issues:
  - severity: medium
    issue: 时间状语与禁令的辖域在中文中不够明确
    rationale: 原文“会幕中不可有任何人……直到他出来”规定无人可在场的完整时段。草案的语序可能使“直到他出来”悬置，弱化其对禁令的限定。
  - severity: low
    issue: “他进去在圣所行赎罪礼时”语序生硬
    rationale: 应改为“当他进入圣所赎罪时”，更符合现代标准汉语，也忠实表达原文不定式的目的／时间关系。
  revised_text: 当他进入圣所赎罪时，直到他出来，会幕里不可有任何人。他要为自己、自己的家和以色列全会众赎罪。
