revisions:
- from: 他进去在圣所行赎罪礼时，直到他出来，会幕里不可有任何人。他要为自己、自己的家和以色列全会众行赎罪礼。
  to: 当他进入圣所赎罪时，直到他出来，会幕里不可有任何人。他要为自己、自己的家和以色列全会众赎罪。
  rationale: 重排首句，使“直到他出来”清楚限定会幕中不得有人的时段；将两处“行赎罪礼”统一为“赎罪”，直接对应כפר，并在上下文中自然保留其祭司礼仪行为的含义。其余术语及群体范围维持不变。
