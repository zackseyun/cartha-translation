  text: וְ/כָל אָדָ֞ם לֹא יִהְיֶ֣ה בְּ/אֹ֣הֶל מוֹעֵ֗ד בְּ/בֹא֛/וֹ לְ/כַפֵּ֥ר בַּ/קֹּ֖דֶשׁ עַד צֵאת֑/וֹ וְ/כִפֶּ֤ר בַּעֲד/וֹ֙ וּ/בְעַ֣ד בֵּית֔/וֹ וּ/בְעַ֖ד כָּל קְהַ֥ל יִשְׂרָאֵֽל־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/017.yaml
  text: And no man shall be in the tent of meeting when he enters to make atonement in the holy place, until he comes out. And he shall make atonement for himself, and for his household, and for all the assembly of Israel.
translation:
  language: zh_hans
  text: 当他进入圣所赎罪时，直到他出来，会幕里不可有任何人。他要为自己、自己的家和以色列全会众赎罪。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָדָם
  choice: 任何人
  rationale: 这里泛指一切人，而不是特指男性；“任何人”自然表达全面禁入的规定。
- source_word: אֹהֶל מוֹעֵד
  choice: 会幕
  rationale: 采用现代中文圣经语境中通行且简洁的礼仪场所名称。
- source_word: לְכַפֵּר / וְכִפֶּר
  choice: 行赎罪礼
  rationale: כפר在本章指祭司所执行的礼仪性赎罪行动；“行赎罪礼”既保留赎罪含义，也凸显这里所说的是仪式行为。
- source_word: בַּקֹּדֶשׁ
  choice: 在圣所
  rationale: קֹדֶשׁ在此指分别为圣的内部礼仪空间；译作“圣所”符合上下文，同时不进一步限定为“至圣所”。
- source_word: קְהַל יִשְׂרָאֵל
  choice: 以色列全会众
  rationale: קהל指聚集成群体的会众；“全会众”保留כָּל所强调的整体范围。
theological_decisions:
- issue: כפר的礼仪与神学含义
  choice: 行赎罪礼
  alternative: 赎罪／施行遮盖
  rationale: 译文不把该词简化为主观悔罪，也不以词源式“遮盖”限定其神学意义，而按利未记16章的祭司礼仪语境表达。
- issue: בַּקֹּדֶשׁ所指的具体区域
  choice: 圣所
  alternative: 至圣所
  rationale: 原文使用קֹדֶשׁ而非明确的“至圣所”称谓；保留较宽的“圣所”，避免消除原文在空间指向上的概括性。
translation_notes:
  register: 采用庄重而清晰的现代标准汉语。调整语序，将时间范围“从进去行礼直到出来”置于禁令之前，使中文自然；重复“行赎罪礼”以对应原文两次כפר，并保持祭司法令的正式语气。
