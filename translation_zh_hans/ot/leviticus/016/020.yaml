base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/020.yaml
  text: When he has finished making atonement for the sanctuary[a], the tent of meeting, and the altar[c][b], he shall present the live goat.
translation:
  language: zh_hans
  text: 亚伦完成了为圣所[a]、会幕和祭坛所行的赎罪礼[c]后，就要把那只活着的公山羊带到近前[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “圣所”也可译作“圣处”。
    reason: lexical_alternative
  - marker: b
    text: “带到近前”原文直译为“使……靠近”，指把羊带近，以进行下一步礼仪。
    reason: lexical_alternative
  - marker: c
    text: 这里的“赎罪礼”在本语境中也可理解为施行礼仪性的洁净或除污。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִלָּה מִכַּפֵּר
  choice: 行完赎罪礼之后
  rationale: 这里的完成动词与介词短语共同表达前一系列礼仪结束后，再进行下一项行动；用“……之后”自然呈现时间顺序。“行赎罪礼”既保留 כפר 的礼仪和神学分量，也不把其作用限定为单一理论。
- source_word: הַקֹּדֶשׁ
  choice: 圣所
  rationale: 在赎罪日的语境中指神圣的圣所空间；“圣所”是现代汉语中简洁、准确且通行的对应词。
- source_word: אֹהֶל מוֹעֵד
  choice: 会幕
  rationale: 这是该固定希伯来语名称在中文圣经传统中清楚而自然的表达，指相会之帐幕。
- source_word: הַמִּזְבֵּחַ
  choice: 祭坛
  rationale: 直接对应礼仪用具，现代中文含义明确。
- source_word: וְהִקְרִיב
  choice: 带到耶和华面前
  rationale: 该使役词基本义为“使靠近、带近”，此处不是献杀活羊，而是将它带近以进行下一步礼仪。根据本章上下文补明“耶和华面前”，同时以脚注保留原文较简略的形式。
- source_word: הַשָּׂעִיר הֶחָי
  choice: 那只活着的公山羊
  rationale: “活着的”明确区别于已经宰杀的另一只公山羊；指示成分“那只”符合上下文已知所指。
theological_decisions:
- issue: 祭祀语境中 כפר 的译法
  choice: 行赎罪礼
  alternative: 洁净；除污
  rationale: כפר 在利未记中可包含洁净或除去礼仪污秽的作用，但此处采用较宽广的“赎罪礼”，既保留祭祀神学意义，也不把词义缩限于某一种作用机制；脚注提示语境中的另一理解。
- issue: הַקֹּדֶשׁ 所指的圣域
  choice: 圣所
  alternative: 至圣所；圣地
  rationale: 原词本身可泛指神圣之处，而本章近距离语境可能使读者理解为内层圣域。主文采用较宽的“圣所”，不把其范围过早限定，并在脚注保留“圣地”的形式性译法。
- issue: הִקְרִיב 是否表示献祭
  choice: 带到耶和华面前
  alternative: 使它靠近；呈上
  rationale: 这只羊此时仍活着，随后将承载罪孽并被送走，因此不宜让中文误解为立即宰献。“带到……面前”表达礼仪性的带近，而不预断它属于何种献祭动作。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“行完赎罪礼之后”清楚呈现礼仪顺序；“公山羊”比单说“山羊”更准确反映 שָׂעִיר。脚注标记均置于相关词语或短语之后，并按正文出现顺序排列。
