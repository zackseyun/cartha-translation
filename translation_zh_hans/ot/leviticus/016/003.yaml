  text: בְּ/זֹ֛את יָבֹ֥א אַהֲרֹ֖ן אֶל הַ/קֹּ֑דֶשׁ בְּ/פַ֧ר בֶּן בָּקָ֛ר לְ/חַטָּ֖את וְ/אַ֥יִל לְ/עֹלָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/003.yaml
  text: 'With this Aaron shall enter the Holy Place: with a bull from the herd for a sin offering[b][a], and a ram for a burnt offering.'
translation:
  language: zh_hans
  text: 亚伦要这样进入圣所：带一头公牛作赎罪祭[a][b]，一只公绵羊作燔祭。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“一头公牛，牛群之子”，是指牛群中一头公牛的习语。
    reason: lexical_alternative
  - marker: b
    text: “赎罪祭”也可译作“洁净祭”；原词既与罪有关，也可强调礼仪上的洁净。
    reason: alternative_reading
lexical_decisions:
- source_word: בְּ/זֹאת
  choice: 这样
  rationale: 介词 בְּ 与指示代词 זֹאת 连用，可表示方式或凭借；“这样”自然地引出亚伦进入圣所所须遵行的安排，同时保留“以此／用这些”的含义。
- source_word: יָבֹא
  choice: 要……进入
  rationale: 未完成式在祭司法令中具有指示、规定的语气；“要”比单纯将来时更能表达规范性。
- source_word: אֶל הַ/קֹּדֶשׁ
  choice: 进入圣所
  rationale: הַקֹּדֶשׁ 在赎罪日语境中指神圣的内部空间；“圣所”在中文中庄重自然，也避免把所指范围解释得过窄。
- source_word: בְּ/פַר בֶּן בָּקָר
  choice: 带一头公牛
  rationale: פַר בֶּן־בָּקָר 是指牛群中一头公牛的习语；中文以“公牛”表达核心所指，随同进入所需祭牲的 בְּ 译作“带”。
- source_word: לְ/חַטָּאת
  choice: 作赎罪祭
  rationale: חַטָּאת 在祭祀法规中通常指此类祭物；“赎罪祭”是现代中文圣经语域中通行且易懂的名称，同时以脚注保留“洁净祭”所强调的礼仪洁净层面。
- source_word: וְ/אַיִל
  choice: 一只公绵羊
  rationale: אַיִל 指成年的公绵羊；加入量词符合现代汉语表达。
- source_word: לְ/עֹלָה
  choice: 作燔祭
  rationale: עֹלָה 是整只焚献之祭的固定术语；“燔祭”庄重、简洁，并与中文圣经传统术语保持一致。
theological_decisions:
- issue: 祭祀术语 חַטָּאת 的含义
  choice: 赎罪祭
  alternative: 洁净祭
  rationale: 该词与罪有关，也可突出祭物所发挥的礼仪洁净作用。正文采用读者较熟悉的“赎罪祭”，脚注保留“洁净祭”，不消除原词在罪与洁净之间的语义张力。
- issue: הַקֹּדֶשׁ 所指的圣洁空间
  choice: 圣所
  alternative: 至圣所
  rationale: 本章语境可能使读者联想到幔内空间，但本节只用较一般的 הַקֹּדֶשׁ；译作“圣所”避免在正文中加入原文未明说的更具体界定。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。句式以冒号呈现总述与祭牲清单的关系；使用“赎罪祭”“燔祭”等通行祭祀术语，并借脚注说明希伯来习语及术语的语义张力。
