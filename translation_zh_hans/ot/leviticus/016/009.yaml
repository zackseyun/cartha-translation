- from: 亚伦要把那只抽签归给耶和华的公山羊牵来，献作赎罪祭。
  to: 亚伦要把那只为耶和华抽中的公山羊奉上，作赎罪祭。
  rationale: 修订以“奉上”对应祭仪语境中的“呈献”，以“为耶和华抽中的”清楚传达签为耶和华而落在该羊身上的指定结果；末句保留原文“使它成为赎罪祭”的简洁祭仪表述。英语审校轨迹所列“签落在……身上／为……抽中”属可互换的译法，在此中文正文已充分表达，无需脚注。
