    rationale: 原文是“为耶和华的签落在其上的那只羊”，即该羊由抽签指定。改为“为耶和华抽中的”可消除公山羊似乎自行抽签的歧义。
  revised_text: 亚伦要把那只为耶和华抽中的公山羊奉上，作赎罪祭。
