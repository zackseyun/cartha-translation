  text: וְ/הִקְרִ֤יב אַהֲרֹן֙ אֶת הַ/שָּׂעִ֔יר אֲשֶׁ֨ר עָלָ֥ה עָלָ֛י/ו הַ/גּוֹרָ֖ל לַ/יהוָ֑ה וְ/עָשָׂ֖/הוּ חַטָּֽאת־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/009.yaml
  text: Then Aaron shall present the goat on which the lot for Yahweh fell[a], and make it a sin offering.
translation:
  language: zh_hans
  text: 亚伦要把那只为耶和华抽中的公山羊奉上，作赎罪祭。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִקְרִיב
  choice: 牵来
  rationale: 使役词根 הקריב 在祭祀语境中表示把祭牲带近、呈到坛前；“牵来”符合公山羊这一活祭牲，也避免在本句后半“献作赎罪祭”之前过早重复“献”。
- source_word: הַשָּׂעִיר
  choice: 公山羊
  rationale: שׂעיר 在此指公山羊；明确性别符合祭祀条例的动物称谓，现代汉语也自然清楚。
- source_word: אֲשֶׁר עָלָה עָלָיו הַגּוֹרָל לַיהוָה
  choice: 那只抽签归给耶和华的
  rationale: 希伯来语直述签落在该羊身上，并以 לַיהוָה 表示归属或指定；“抽签归给耶和华”自然传达仪式中的分派结果。
- source_word: לַיהוָה
  choice: 归给耶和华
  rationale: 介词 ל 表示指定或归属；יהוה 作为上帝的盟约之名音译为“耶和华”，不改写为称号。
- source_word: וְעָשָׂהוּ חַטָּאת
  choice: 献作赎罪祭
  rationale: חטאת 在祭祀律例中指赎罪祭；עשה 加宾语后缀表达把该羊作为赎罪祭办理。“献作”在现代汉语中简洁地表达这一祭仪用途。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名；正文保留专名形式，以常见现代中文圣经用名“耶和华”表达，而不以“主”替代。
- issue: חטאת 在本节中的含义
  choice: 赎罪祭
  alternative: 罪
  rationale: 祭祀条例和句中以公山羊为对象的语境明确指祭物类别，而非把公山羊本体等同于抽象的“罪”。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。句式保持原文的两个连续动作：先把抽签指定的公山羊牵来，再献作赎罪祭。无需脚注；英语脚注所列两种表达在中文“抽签归给”中已自然涵盖。
