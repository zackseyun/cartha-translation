  text: וַ/יְדַבֵּ֤ר יְהוָה֙ אֶל מֹשֶׁ֔ה אַחֲרֵ֣י מ֔וֹת שְׁנֵ֖י בְּנֵ֣י אַהֲרֹ֑ן בְּ/קָרְבָתָ֥/ם לִ/פְנֵי יְהוָ֖ה וַ/יָּמֻֽתוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/001.yaml
  text: And Yahweh spoke to Moses after the death of Aaron’s two sons[a], when they came near before Yahweh and died.
translation:
  language: zh_hans
  text: 亚伦的两个儿子在亲近雅威时死了；这事以后，雅威对摩西说：
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: 对……说
  rationale: 这是希伯来叙事中常见的神谕引介语；现代汉语以“对摩西说”最自然，也保留了说话对象。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文四字神名 YHWH 的通行拟音译出，保留其作为上帝专名的性质，而不以称号代替。
- source_word: אַחֲרֵי מוֹת שְׁנֵי בְּנֵי אַהֲרֹן
  choice: 亚伦的两个儿子……死了。这事以后
  rationale: 原文意为“亚伦的两个儿子死后”。调整汉语语序，将死亡的相关情形先交代完整，再以“这事以后”承接主句，使句子清楚自然。
- source_word: בְּקָרְבָתָם
  choice: 近到……面前时
  rationale: ב 加不定式及第三人称复数词尾在此表示他们趋近时的情形。“近到”保留 קרב 的接近含义，也适合本节的礼仪语境。
- source_word: לִפְנֵי יְהוָה
  choice: 雅威面前
  rationale: 直截保留空间及临在两方面都可能具有的含义。
- source_word: וַיָּמֻתוּ
  choice: 死了
  rationale: 简洁保留希伯来文叙事的突兀力度；没有擅自加入“因此”等明确因果连接词。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用上帝的专名。译作“雅威”较贴近 YHWH 的拟音，并避免将专名改为称号。
- issue: 亲近雅威与死亡之间的关系
  choice: 以“……时”表达时间或伴随情形
  alternative: 译作“因近到雅威面前而死”以明确因果
  rationale: בְּקָרְבָתָם 首先说明他们亲近时的情形；上下文可能暗示因果，但本节的语法没有用明确的因果连词，因此正文不将因果关系说死。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“近到……面前”略带礼仪色彩，以呼应本章语境；通过拆句和“这事以后”避免汉语长定语，同时完整保留事件次序。冒号表示神的话将在下一节继续。
