  text: וְ/כִפֶּר֙ אֶת מִקְדַּ֣שׁ הַ/קֹּ֔דֶשׁ וְ/אֶת אֹ֧הֶל מוֹעֵ֛ד וְ/אֶת הַ/מִּזְבֵּ֖חַ יְכַפֵּ֑ר וְ/עַ֧ל הַ/כֹּהֲנִ֛ים וְ/עַל כָּל עַ֥ם הַ/קָּהָ֖ל יְכַפֵּֽר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/033.yaml
  text: Thus he shall make atonement for the Holy Sanctuary[a], and for the Tent of Meeting, and for the altar[b]; and he shall make atonement for the priests and for all the people of the assembly.
translation:
  language: zh_hans
  text: 他要为圣洁的圣所、会幕和祭坛行赎罪礼[a]；也要为祭司和会众中的全体百姓[b]行赎罪礼。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “行赎罪礼”也可译作“施行洁除”；在这里的祭仪语境中，希伯来语动词 כפר 既有赎罪之意，也可强调洁除污秽。
    reason: lexical_alternative
  - marker: b
    text: “会众中的全体百姓”也可译作“全体会众”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִפֶּר / יְכַפֵּר / יְכַפֵּר
  choice: 行赎罪礼
  rationale: כפר在本节是祭仪术语，同时用于圣所、会幕、祭坛和人。译作“行赎罪礼”既保留其赎罪含义，也表明这里说的是具体礼仪；全节采用同一译法，以体现希伯来文的重复和礼仪上的统一。
- source_word: מִקְדַּשׁ הַקֹּדֶשׁ
  choice: 神圣的圣所
  rationale: 该短语由“圣所”和“圣/神圣”构成。“神圣的圣所”保留其强调性质，又不将其限定为原文未明确指定的“至圣所”。
- source_word: אֹהֶל מוֹעֵד
  choice: 会幕
  rationale: “会幕”是现代中文圣经语境中简明而通行的称呼，表达这座作为相会之处的帐幕。
- source_word: הַמִּזְבֵּחַ
  choice: 祭坛
  rationale: 这是该祭仪设施自然、明确的现代中文译法。
- source_word: עַל
  choice: 为
  rationale: 与כפר连用时，“为……行赎罪礼”符合现代汉语表达，也适用于本节所列的圣物和人。
- source_word: הַכֹּהֲנִים
  choice: 祭司
  rationale: 采用该职分名称通行且准确的中文译法。
- source_word: כָּל עַם הַקָּהָל
  choice: 会众的全体百姓
  rationale: 保留原文中“百姓”与“会众”两个群体性成分，不简化为仅仅“所有百姓”；同时使用现代读者容易理解的表达。
theological_decisions:
- issue: 赎罪用语同时用于神圣设施和人
  choice: 对圣所、会幕、祭坛、祭司及百姓均译作“行赎罪礼”
  alternative: 对神圣设施译作“洁净”，对人译作“赎罪”
  rationale: 原文刻意重复同一个动词כפר。统一译法保留整节祭仪行动的整体性，也避免把该词在不同受事上的作用过早拆分或限定；脚注则说明洁除污秽也是其语义内涵。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“神圣的圣所”有意保留原文略带强调和重复的结构，不擅自具体化为“至圣所”。分号对应经文由神圣设施转向祭司和百姓的层次，同时重复“行赎罪礼”，以再现希伯来文的关键词重复。
