  text: וְ/לָקַ֣ח מְלֹֽא הַ֠/מַּחְתָּה גַּֽחֲלֵי אֵ֞שׁ מֵ/עַ֤ל הַ/מִּזְבֵּ֨חַ֙ מִ/לִּ/פְנֵ֣י יְהוָ֔ה וּ/מְלֹ֣א חָפְנָ֔י/ו קְטֹ֥רֶת סַמִּ֖ים דַּקָּ֑ה וְ/הֵבִ֖יא מִ/בֵּ֥ית לַ/פָּרֹֽכֶת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/012.yaml
  text: And he shall take a full censer of coals of fire from upon the altar before Yahweh[a], and both the fullness of his hands of finely ground fragrant incense, and bring it inside the veil.
translation:
  language: zh_hans
  text: 他要从耶和华面前的祭坛上取一个盛满火炭的香炉，又取双手捧满的、研细的香料制成的香，带到幔子里面。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “幔子里面”指幔子后面的空间，也就是内层圣所。也可译作“幔子以内”。
    reason: 说明希伯来语空间表达及其可行译法。
lexical_decisions:
- source_word: וְלָקַח
  choice: 他要……取
  rationale: 连词加完成式在礼仪规程中表达接续的指令；“要”符合现代汉语法规式叙述。
- source_word: מְלֹא הַמַּחְתָּה
  choice: 一个盛满……的香炉
  rationale: 原文直指“香炉所能盛满的量”；此译既保留器具，也自然表达满容量。
- source_word: גַּחֲלֵי אֵשׁ
  choice: 火炭
  rationale: 这是现代汉语对燃烧炭块的自然表达，准确传达原文“火的炭”。
- source_word: מֵעַל הַמִּזְבֵּחַ מִלִּפְנֵי יְהוָה
  choice: 从耶和华面前的祭坛上
  rationale: 保留 מֵעַל 的表面方位，并将“在耶和华面前”自然地理解为限定祭坛的位置。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的专名形式呈现四字神名，而不以称号替代。
- source_word: וּמְלֹא חָפְנָיו
  choice: 又用双手捧满
  rationale: חָפְנָיו 指双手合捧，מְלֹא 表示满量；译文明确保留双手及其容量。
- source_word: קְטֹרֶת סַמִּים דַּקָּה
  choice: 研细的香料香
  rationale: “香料香”保留以芳香材料制成之香的构造，“研细”传达 דַּקָּה 所指的细碎状态。
- source_word: וְהֵבִיא מִבֵּית לַפָּרֹכֶת
  choice: 带到幔子里面
  rationale: 在本章空间语境中，该压缩表达指向幔子内侧，即进入内层圣所；“带到”呈现使其进入的方向。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。采用中文长期通行且仍被普通读者识别为专名的“耶和华”，不改用“主”这一称号；“雅威”是更贴近学术重构发音的可行替代。
- issue: מִבֵּית לַפָּרֹכֶת 的空间方向
  choice: 到幔子里面
  alternative: 在幔子以内
  rationale: 结合使役动词“带入”和赎罪日仪式流程，短语表示把香炉和香带进幔后空间；译文不进一步加入“至圣所”，以免把上下文说明写进正文。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。句式保留礼仪规程的指令语气；避免生硬直译“满手之量”，同时以“双手捧满”保存原文双数和满量信息。
