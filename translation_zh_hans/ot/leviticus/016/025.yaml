  text: וְ/אֵ֛ת חֵ֥לֶב הַֽ/חַטָּ֖את יַקְטִ֥יר הַ/מִּזְבֵּֽחָ/ה׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/025.yaml
  text: And he shall burn the fat of the sin offering on the altar[a].
translation:
  language: zh_hans
  text: 他要把赎罪祭[a]的脂油焚烧在祭坛上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“洁净祭”。希伯来语这个词可以指为除去罪或礼仪上的不洁而献的祭。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵת
  choice: 要把
  rationale: 连词承接前面的礼仪程序；宾语标记אֵת在汉语中不单独译出。用“把”字句自然引出受事“脂油”。
- source_word: חֵלֶב
  choice: 脂油
  rationale: 指献祭时规定献上的脂肪。“脂油”既准确表达祭牲脂肪，也符合庄重而易懂的祭祀语境。
- source_word: הַחַטָּאת
  choice: 赎罪祭
  rationale: 在利未记的献祭法规中，חַטָּאת通常指处理罪与不洁的祭物。“赎罪祭”是现代中文圣经语境中清楚且通行的名称，同时以脚注保留“洁净祭”这一功能性译法。
- source_word: יַקְטִיר
  choice: 焚烧
  rationale: קטר的使役式在献祭语境中指在坛上焚烧，使祭物化为烟。“焚烧”自然简洁，并保留礼仪动作的含义。
- source_word: הַמִּזְבֵּחָה
  choice: 在祭坛上
  rationale: 原词带方向词尾，字面可表示“到祭坛那里”；结合焚烧祭物的动作，现代汉语自然表达为“在祭坛上”。
theological_decisions:
- issue: 献祭法规中חַטָּאת的译法
  choice: 赎罪祭
  alternative: 洁净祭
  rationale: 该词既与罪有关，也可指为除去罪或礼仪不洁而献的祭。正文采用读者较熟悉的“赎罪祭”，但不把词义仅限于道德罪；脚注保留“洁净祭”，呈现其礼仪净化功能及原文的语义张力。
translation_notes:
  register: 采用现代、庄重而简明的法规体中文。“他”承接上下文中的祭司；不在本节补出原文未重复说明的身份。
