base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/026.yaml
  text: The one who sends the goat away to Azazel shall wash his clothes and bathe his body in water[a], and afterward he may come into the camp.
translation:
  language: zh_hans
  text: 那把公山羊送往阿撒泻勒[a]的人，要洗净衣服，用水洗身；然后才可以进营。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “阿撒泻勒”一词的含义有争议。这里将它作为专名或称号音译；也有人按功能理解为“除去”，并由此与所谓“替罪羊”联系起来。
    reason: alternative_reading
lexical_decisions:
- source_word: וְהַמְשַׁלֵּחַ
  choice: 那……送往……的人
  rationale: 带冠词的分词作名词用，指负责把公山羊送走的人；此译自然保留其身份和职责意味。
- source_word: הַשָּׂעִיר
  choice: 公山羊
  rationale: שָׂעִיר 在本祭仪语境中指公山羊；明确性别符合上下文，也便于读者辨认前文所述祭牲。
- source_word: לַעֲזָאזֵל
  choice: 往阿撒泻
  rationale: 该词含义历来有争议。音译为专名或称号，可避免将其武断解释为“除去”、替罪羊或某种荒野存在；介词 ל 在这里结合“送”的动作译为“往”。
- source_word: יְכַבֵּס בְּגָדָיו
  choice: 要洗净衣服
  rationale: 这是礼仪洁净法规中的惯用表达；“要”体现规范要求，“洗净衣服”现代、清楚。
- source_word: וְרָחַץ אֶת־בְּשָׂרוֹ בַּמָּיִם
  choice: 用水洗身
  rationale: בָּשָׂר 字面为“肉身”，在洁净礼仪中指身体；“用水洗身”准确而符合现代汉语表达。
- source_word: וְאַחֲרֵי כֵן
  choice: 然后才
  rationale: 不仅表示先后，也清楚传达洗涤之后方可回营的条件次序。
- source_word: יָבֹא אֶל־הַמַּחֲנֶה
  choice: 可以进营
  rationale: 此处未完成式在法规流程中表示完成洗涤后获准进入营地，而非另下一道必须进营的命令。
theological_decisions:
- issue: 赎罪日礼仪中 לַעֲזָאזֵל 的含义
  choice: 作为专名或称号音译为“阿撒泻”
  alternative: 译作“除去”、与“替罪羊”功能相连，或理解为荒野／邪灵存在
  rationale: 原词的词源、所指和神学含义均有争议，本节也未加解释。正文音译最能保留原文的开放性，不把某一解释写入经文。
translation_notes:
  register: 采用现代、庄重而易懂的法规体。“要……然后才可以……”清楚呈现礼仪要求及回营许可的先后关系。脚注标记紧接相关争议词“阿撒泻”，而非接在“用水洗身”之后，以准确标示注释对象。
