  text: וְ/הַ/שֹּׂרֵ֣ף אֹתָ֔/ם יְכַבֵּ֣ס בְּגָדָ֔י/ו וְ/רָחַ֥ץ אֶת בְּשָׂר֖/וֹ בַּ/מָּ֑יִם וְ/אַחֲרֵי כֵ֖ן יָב֥וֹא אֶל הַֽ/מַּחֲנֶֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/028.yaml
  text: The one who burns them shall wash his clothes and bathe his body in water[b][a], and afterward he may come into the camp.
translation:
  language: zh_hans
  text: 焚烧它们的人要洗净自己的衣服，并用水洗身[a]；之后才可以进入营地[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“洗他的肉身”；这里指洗全身。
    reason: lexical_alternative
  - marker: b
    text: 或译：“之后要进入营地。”希伯来语动词也可表达简单将来或规定语气；按这里的洁净程序，正文理解为完成清洗后获准进入。
    reason: alternative_reading
lexical_decisions:
- source_word: וְהַשֹּׂרֵף
  choice: 焚烧……的人
  rationale: 带定冠词的分词在此作名词用，指负责焚烧上一节所述公牛和公山羊遗骸的人；此译保留角色含义，也符合现代汉语。
- source_word: אֹתָם
  choice: 它们
  rationale: 阳性复数宾格代词回指上文的公牛和公山羊，或其遗骸；中文以“它们”自然承接。
- source_word: יְכַבֵּס בְּגָדָיו
  choice: 要洗净自己的衣服
  rationale: 未完成式在礼仪法规中具有规定性；“要”表达义务，“洗净”体现清洗并与洁净程序相关，反身领属用“自己的”清楚自然。
- source_word: וְרָחַץ אֶת־בְּשָׂרוֹ בַּמָּיִם
  choice: 并用水洗身
  rationale: בשר字面为“肉身”，但在沐洗惯用语中指全身；“用水洗身”简洁自然，也与洗衣的动作相区别。
- source_word: וְאַחֲרֵי כֵן
  choice: 之后
  rationale: 准确表达完成清洗后才发生下一步的时间顺序。
- source_word: יָבֹא אֶל־הַמַּחֲנֶה
  choice: 才可以进入营地
  rationale: בוא加אֶל表示进入；结合礼仪洁净语境，未完成式很可能表示完成洁净后获准重新进入。“才”明确保留先后条件关系。
theological_decisions:
- issue: 末句在礼仪洁净程序中的语气
  choice: 才可以进入营地
  alternative: 之后要进入营地／之后将进入营地
  rationale: 上下文规定接触并焚烧赎罪祭遗骸者须先洗衣洗身，随后才能重返营地。许可性译法最能表达这一礼仪逻辑；但希伯来语未完成式本身也可按简单将来或规定语气理解，因此以脚注保留另一读法。
translation_notes:
  register: 采用现代、庄重而易懂的法规叙述语体。“营地”比“营”更明确指群体驻扎区域；以“洗身”避免“洗肉身”的生硬感。脚注标记均置于相关正文之后。
