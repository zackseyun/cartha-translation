  terminology: “亚舍拉”保留原词的所指歧义，处理恰当；“耶和华”及“以色列的上帝”也准确。脚注中的“祭祀物”可保留，但以“与她有关的祭祀物”说明其为相关崇拜对象，避免将原词限定为单一形制。
