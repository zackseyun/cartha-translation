base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/033.yaml
  text: Ahab also made the Asherah[a], and Ahab went on to do more to provoke Yahweh, the God of Israel, than all the kings of Israel who were before him.
translation:
  language: zh_hans
  text: 亚哈又造了亚舍拉[a]。亚哈又做了更多惹耶和华——以色列的上帝——发怒的事，比在他以前的以色列众王所做的还多。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“亚舍拉柱”。希伯来语“亚舍拉”既可指女神亚舍拉，也可指与她有关的祭祀物。
    reason: 保留原词在神祇与相关祭祀物之间的真实歧义；“亚舍拉柱”仅作为一种较具体的替代译法。
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: 造了
  rationale: עָשָׂה的基本义是“制造、做”。以הָאֲשֵׁרָה为宾语时，“造了”直接保留原文动作；不译作“立了”，以免把较宽泛的动词过度具体化。
- source_word: הָאֲשֵׁרָה
  choice: 亚舍拉
  rationale: 采用希伯来词的音译，以保留其可能指女神亚舍拉，也可能指与她有关的祭祀物这一歧义。定冠词在现代汉语中不必机械译出。
- source_word: וַיּוֹסֶף ... לַעֲשׂוֹת
  choice: 所做的事……更
  rationale: יָסַף加不定式可表示继续或增加；结合后面的比较结构，汉语用“所做的事……更”自然表达亚哈在惹上帝发怒之事上超过先王。
- source_word: לְהַכְעִיס
  choice: 惹……发怒
  rationale: כעס的使役形表示使对方动怒。“惹……发怒”在现代汉语中自然清楚，并保留使役含义。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的专名形式音译四字神名，保留其作为以色列之上帝专名的功能，而非以头衔替代。
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: 以色列的上帝
  rationale: 直接表达希伯来语的属格构造，并作为同位语说明耶和华的身份。
- source_word: מִכֹּל מַלְכֵי יִשְׂרָאֵל אֲשֶׁר הָיוּ לְפָנָיו
  choice: 比他以前以色列所有的王
  rationale: 介词מִן表达比较；“他以前”自然传达לְפָנָיו在这里指在亚哈之前执政，而非空间上的“在他面前”。
theological_decisions:
- issue: אֲשֵׁרָה的所指
  choice: 正文保留音译“亚舍拉”，不判定是女神还是祭祀物
  alternative: 亚舍拉神像／亚舍拉木柱／女神亚舍拉
  rationale: 本节没有明确限定该词究竟指神祇本身还是相关祭祀物。正文保留词义张力，脚注说明两种可能，避免加入原文未作出的判断。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“惹……发怒”比“激怒”更完整地呈现使役关系；第二句调整为自然汉语比较句，但保留亚哈超过此前所有以色列王的强调。
