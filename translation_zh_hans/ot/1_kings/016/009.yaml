base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/009.yaml
  text: But his servant Zimri[a], commander of half the chariots, conspired against him while he was in Tirzah, drinking himself drunk in the house of Arza[b], who was over the household in Tirzah.
translation:
  language: zh_hans
  text: 他的臣仆心利，就是统领一半战车的将领，密谋反叛他。那时，他正在得撒、亚杂的家里喝酒，喝得酩酊大醉[a]。亚杂是在得撒掌管王室事务的官员[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“喝酒至醉”。希伯来文的说法很生动，描写他不断喝酒，以致醉酒。
    reason: lexical_alternative
  - marker: b
    text: “掌管王室事务”是一个行政职衔，可能指负责王室家务或王宫事务的官员。
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּקְשֹׁר עָלָיו
  choice: 密谋反叛他
  rationale: קשר与עַל连用，在君王叙事中指结党谋反；“密谋反叛”既自然，也保留其政治含义。
- source_word: עַבְדּוֹ
  choice: 他的臣仆
  rationale: עבד本义为“仆人”，在王室语境中也可指臣属或官员；“臣仆”兼顾字面关系和宫廷身份。
- source_word: זִמְרִי
  choice: 心利
  rationale: 采用现代中文圣经读者熟悉的传统人名译法。
- source_word: שַׂר מַחֲצִית הָרָכֶב
  choice: 统领一半战车的将领
  rationale: שַׂר指统领或将领，רכב在此指战车部队；此译法贴近原文结构，同时让现代读者清楚其军职。
- source_word: וְהוּא בְתִרְצָה
  choice: 那时，他正在得撒
  rationale: וְהוּא引出事件发生时的背景状况；“那时……正在”自然表达其伴随和时间关系。
- source_word: שֹׁתֶה שִׁכּוֹר
  choice: 喝酒，喝得酩酊大醉
  rationale: 分词与形容词的组合生动描写持续饮酒并达到醉酒状态；此译法保留动作及其结果。
- source_word: בֵּית אַרְצָא
  choice: 亚杂的家里
  rationale: בית加人名在此自然译为某人的家；比照搬为“亚杂的房屋”更符合现代汉语。
- source_word: אֲשֶׁר עַל הַבַּיִת
  choice: 掌管王宫的官员
  rationale: עַל־הַבַּיִת是行政职衔，指主管王室家务或宫廷事务的人；正文采用意译以避免把“家”误解为普通住宅。
- source_word: בְּתִרְצָה
  choice: 在得撒
  rationale: 保留原文末尾重复的地点说明，并使之与亚杂的官职相连。
theological_decisions: []
translation_notes:
  register: 采用庄重而流畅的现代标准汉语。“心利、得撒、亚杂”沿用常见圣经专名译法。将解释性同位语和背景分句适度拆开，以免长句含混；同时保留原文对得撒这一地点的重复。脚注[a]置于饮酒描述之后，脚注[b]置于行政职衔之后，使标记与注释内容准确对应。
