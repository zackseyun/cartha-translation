  text: וַ/יִּשְׁכַּ֤ב בַּעְשָׁא֙ עִם אֲבֹתָ֔י/ו וַ/יִּקָּבֵ֖ר בְּ/תִרְצָ֑ה וַ/יִּמְלֹ֛ךְ אֵלָ֥ה בְנ֖/וֹ תַּחְתָּֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/006.yaml
  text: Baasha slept with his fathers and was buried in Tirzah[a], and Elah his son reigned in his place.
translation:
  language: zh_hans
  text: 巴沙与列祖同睡[a]，葬在得撒。他儿子以拉接续他作王。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“与祖先同眠”。希伯来语“与列祖同睡”是记述君王死亡的惯用表达。
    reason: 说明希伯来语死亡套语，并提供较现代的词汇替代。
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: 同睡
  rationale: 该动词字面意为“睡”，在列王纪的君王卒年套语中委婉表示死亡。保留“睡”的意象，既贴近原文，也不把这一固定表达直接释义为“死了”。
- source_word: עִם אֲבֹתָיו
  choice: 与列祖
  rationale: “列祖”简洁地表达历代先祖，并能与“同睡”组成庄重、可辨识的君王死亡套语；脚注补充较口语化的译法。
- source_word: וַיִּקָּבֵר
  choice: 葬在
  rationale: 尼法勒式在此表示被安葬；现代汉语无须明说被动，用“葬在”自然且准确。
- source_word: בְּתִרְצָה
  choice: 在得撒
  rationale: 介词 בְּ 与城名连用，表示安葬地点；תִּרְצָה 按通行圣经地名译作“得撒”。
- source_word: וַיִּמְלֹךְ
  choice: 作王
  rationale: 该词在王位继承记载中表示登基并执掌王权；结合“接续他”译为“作王”，符合现代汉语叙事习惯。
- source_word: אֵלָה בְנוֹ
  choice: 他儿子以拉
  rationale: 调整为自然的现代汉语语序，同时完整保留人物姓名及父子关系。
- source_word: תַּחְתָּיו
  choice: 接续他
  rationale: 此词在王位继承语境中表示取代前王、继承其位；“接续他”比单纯的“在他以后”更清楚地体现继位关系。
theological_decisions:
- issue: 死亡套语是否直接释义为“死了”
  choice: 保留“与列祖同睡”的希伯来语意象
  alternative: 译为“死了”或“归到祖先那里”
  rationale: 原文采用惯常而含蓄的君王死亡套语。直译其核心意象可保留文学形式及可能的神学张力，同时脚注说明其惯用意义，避免将“睡”额外解释为某一特定的死后状态教义。
translation_notes:
  register: 采用现代、庄重而简洁的历史叙事语体。“列祖”“同睡”“作王”保留列王纪王室记载的固定表达，同时通过脚注帮助普通读者理解。
