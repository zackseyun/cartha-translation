base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/025.yaml
  text: Omri did what was evil in the eyes of Yahweh[a], and he did more evil than all who were before him.
translation:
  language: zh_hans
  text: 暗利行雅威眼中看为恶的事，并且他作恶比所有在他以前的人更甚。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他比所有在他以前的人更恶。”希伯来语动词既可理解为描述暗利本人，也可理解为描述他的行为；正文采用本段君王评价语境中常见的行为性表达。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשֶׂה
  choice: 做
  rationale: עשה与“恶”搭配，表示行出某种行为；译为“做”自然地构成“做……恶的事”。
- source_word: הָרַע
  choice: 看为恶的事
  rationale: 这里的形容词带定冠词并作名词性用法；结合“在……眼中”的评价惯用语，译为“看为恶的事”既符合现代汉语，也保留评价角度。
- source_word: בְּעֵינֵי
  choice: 眼中
  rationale: 保留希伯来语“在某人眼中”的形象，同时在现代汉语中自然可懂。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来语四字神名的常见学术重构音译，保留其作为专名的性质，不以头衔替代。
- source_word: וַיָּרַע
  choice: 作恶更甚
  rationale: 该动词在比较结构中可指行为上更加邪恶；“作恶更甚”与前半句衔接，并保留与另一种主体性质解读之间的张力。
- source_word: מִכֹּל אֲשֶׁר לְפָנָיו
  choice: 比所有在他以前的人
  rationale: 忠实保留原文泛指的“所有在他以前的”，不在正文中补出原文未明说的“君王”或“前任”。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用以色列之神的专名；采用“雅威”以音译方式呈现该名，而不以“主”等头衔替代。
- issue: וַיָּרַע 描写行为还是本人
  choice: 作恶更甚
  alternative: 他比所有在他以前的人更恶
  rationale: 上下文首先说暗利“做……恶的事”，故正文延续行为性的表达；脚注保留该动词也可描述暗利本人更恶的理解。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“雅威眼中看为恶的事”保留希伯来语评价公式的意象；“作恶更甚”简洁呈现比较关系。
