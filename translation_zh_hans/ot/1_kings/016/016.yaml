base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/016.yaml
  text: And the people who were camped there heard it said, “Zimri has conspired and has also struck down the king.” So all Israel made Omri, the commander of the army over Israel, king that day in the camp.
translation:
  language: zh_hans
  text: 驻扎在那里的百姓听说：“心利谋反，还杀了王。”于是，以色列众人当天就在营中立以色列的军队统帅暗利为王。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָעָם הַחֹנִים
  choice: 驻扎在那里的百姓
  rationale: הַחֹנִים 指正在安营、驻扎的人；结合上下文补出“在那里”，使现代汉语自然，同时不增加新的地点信息。
- source_word: קָשַׁר
  choice: 谋反
  rationale: 该动词在王权叙事中指结党策划、发动叛乱；“谋反”准确而简洁。
- source_word: הִכָּה אֶת־הַמֶּלֶךְ
  choice: 杀了王
  rationale: 字面为“击打了王”，但本章上文明确心利已经杀死以拉；这里在语境中是致死性的击杀。
- source_word: וַיַּמְלִכוּ ... אֶת־עָמְרִי
  choice: 立……暗利为王
  rationale: 希伯来语使役登基表达，汉语惯用“立某人为王”。
- source_word: שַׂר צָבָא עַל־יִשְׂרָאֵל
  choice: 以色列的军队统帅
  rationale: 保留 עַל־יִשְׂרָאֵל 对统辖范围的限定，并用现代汉语自然表达其军事职衔。
