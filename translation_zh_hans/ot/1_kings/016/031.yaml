  text: וַ/יְהִי֙ הֲ/נָקֵ֣ל לֶכְתּ֔/וֹ בְּ/חַטֹּ֖אות יָרָבְעָ֣ם בֶּן נְבָ֑ט וַ/יִּקַּ֨ח אִשָּׁ֜ה אֶת אִיזֶ֗בֶל בַּת אֶתְבַּ֨עַל֙ מֶ֣לֶךְ צִידֹנִ֔ים וַ/יֵּ֨לֶךְ֙ וַֽ/יַּעֲבֹ֣ד אֶת הַ/בַּ֔עַל וַ/יִּשְׁתַּ֖חוּ לֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/031.yaml
  text: And as if it were a light thing for him to walk in the sins of Jeroboam son of Nebat[a], he took Jezebel daughter of Ethbaal, king of the Sidonians, as his wife, and went and served Baal and bowed down to him.
translation:
  language: zh_hans
  text: 他行尼八的儿子耶罗波安所犯的罪，还以为是小事，[a]便娶了西顿人之王以谒巴力的女儿耶洗别为妻，又去事奉巴力，向他下拜。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他行尼八的儿子耶罗波安所犯的罪，难道还算小事吗？”希伯来语开头是带修辞意味的惯用表达，强调亚哈不以这些罪为重。
    reason: 保留希伯来语开头在陈述式与修辞问句表达之间的可能性。
lexical_decisions:
- source_word: הֲנָקֵל
  choice: 仿佛认为……只是小事
  rationale: 该表达带有修辞意味，指出亚哈把先前的罪看得无足轻重，并引出进一步的背道行为；正文采用陈述式表达，疑问式的可能译法收入脚注。
- source_word: לֶכְתּוֹ בְּחַטֹּאות
  choice: 沿着……的罪路而行
  rationale: 保留希伯来语“行走”表示生活方式或行为模式的比喻，同时使现代汉语读者容易理解。
- source_word: בְּחַטֹּאות יָרָבְעָם בֶּן נְבָט
  choice: 沿着尼八的儿子耶罗波安的罪路
  rationale: 直接保留《列王纪》中反复出现的评判性表达，指耶罗波安所开创并延续的犯罪模式。
- source_word: וַיִּקַּח אִשָּׁה אֶת אִיזֶבֶל
  choice: 娶了……耶洗别为妻
  rationale: 自然表达希伯来语“取女子为妻”的结构，不作不必要的扩写。
- source_word: אֶתְבַּעַל
  choice: 以谒巴力
  rationale: 采用中文圣经传统中较为通行的腓尼基王名音译。
- source_word: צִידֹנִים
  choice: 西顿人
  rationale: 按复数族称直译；“西顿人的王”比单称“西顿王”更贴近原文。
- source_word: וַיֵּלֶךְ
  choice: 去
  rationale: 保留叙事动作的推进，连接其婚姻行为与随后主动参与巴力崇拜。
- source_word: וַיַּעֲבֹד אֶת הַבַּעַל
  choice: 事奉巴力
  rationale: עבד在祭祀语境中表示宗教性的服事或敬奉；译作“事奉”可与下一动词所指的下拜动作保持区别。
- source_word: הַבַּעַל
  choice: 巴力
  rationale: 按中文惯例作为神名处理，不另译希伯来语冠词。
- source_word: וַיִּשְׁתַּחוּ לוֹ
  choice: 向他下拜
  rationale: 保留俯伏、下拜这一具体动作，避免与前面的“事奉”合并成一个笼统的“敬拜”。
theological_decisions:
- issue: 亚哈的背道与耶罗波安之罪的关系
  choice: 译文呈现递进：亚哈仿佛把沿袭耶罗波安的罪看作小事，继而借婚姻关系转向事奉巴力。
  alternative: 也可把开头译成直接的修辞问句：“他沿着……的罪路而行，难道还算小事吗？”
  rationale: 希伯来语开头既有修辞问句的形式可能，也在叙事中产生升级效果。正文保留这种评判和递进，但不进一步断言亚哈主观上如何衡量罪恶。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言；保留“罪路而行”“事奉”“下拜”等具有经文色彩但仍自然的表达。人名采用常见中文圣经音译。
