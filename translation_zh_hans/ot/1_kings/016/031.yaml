revisions:
- from: 他仿佛认为，沿着尼八的儿子耶罗波安的罪路而行只是小事，[a]竟又娶了西顿人的王以谒巴力的女儿耶洗别为妻，去事奉巴力，向他下拜。
  to: 他行尼八的儿子耶罗波安所犯的罪，还以为是小事，[a]便娶了西顿人之王以谒巴力的女儿耶洗别为妻，又去事奉巴力，向他下拜。
  rationale: 修订以“行……所犯的罪”替代不自然的“罪路而行”，并以“还以为是小事”更直接而自然地表达希伯来语开头的修辞性轻忽。其余人名、族称及“事奉／下拜”的区分均维持原稿的忠实处理。
