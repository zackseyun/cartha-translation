base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/023.yaml
  text: In the thirty-first year of Asa king of Judah[a], Omri became king over Israel for twelve years; he reigned in Tirzah six years.
translation:
  language: zh_hans
  text: 犹大王亚撒在位第三十一年，暗利登基，作以色列王十二年；他在得撒作王六年。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节先说暗利作王共十二年，随后说明其中有六年是在得撒作王。
    reason: clarification
lexical_decisions:
- source_word: בִּשְׁנַת שְׁלֹשִׁים וְאַחַת שָׁנָה
  choice: 在位第三十一年
  rationale: 这是希伯来语常见的君王纪年格式；现代汉语以“在位第三十一年”自然、准确地表达。
- source_word: לְאָסָא מֶלֶךְ יְהוּדָה
  choice: 犹大王亚撒
  rationale: 介词 לְ 在这里标明纪年所参照的君王；“犹大王亚撒在位……”符合现代汉语的纪年表达。
- source_word: מָלַךְ
  choice: 登基
  rationale: 第一次出现的 מָלַךְ 在纪年公式中表示开始作王，因此译作“登基”，体现其起始含义。
- source_word: עַל יִשְׂרָאֵל
  choice: 作以色列王
  rationale: מָלַךְ עַל 表示统治某一国民；汉语用“作以色列王”比直译“在以色列之上作王”自然。
- source_word: שְׁתֵּים עֶשְׂרֵה שָׁנָה
  choice: 十二年
  rationale: 表示暗利作王的总年数；汉语无需另加介词即可清楚表达持续时间。
- source_word: בְּתִרְצָה
  choice: 在得撒
  rationale: בְּ 在此表示地点，即暗利以得撒为统治中心的时期。
- source_word: מָלַךְ שֵׁשׁ שָׁנִים
  choice: 作王六年
  rationale: 第二次出现的 מָלַךְ 描述在得撒作王的时长，而非再次登基，故译作“作王六年”。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。保留希伯来文两个并列分句及“十二年”与“六年”的区分，不擅自解释其余六年的地点或相关年代问题。
