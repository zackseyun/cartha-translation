source:
  edition: WLC
  text: וַ/יֵּ֗לֶךְ בְּ/כָל דֶּ֨רֶךְ֙ יָרָבְעָ֣ם בֶּן נְבָ֔ט ו/ב/חטאתי/ו אֲשֶׁ֥ר הֶחֱטִ֖יא אֶת יִשְׂרָאֵ֑ל לְ/הַכְעִ֗יס אֶת יְהוָ֛ה אֱלֹהֵ֥י יִשְׂרָאֵ֖ל בְּ/הַבְלֵי/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/026.yaml
  text: For he walked in all the way of Jeroboam son of Nebat[a], and in his sins by which he caused Israel to sin, provoking Yahweh, the God of Israel, with their idols.
translation:
  language: zh_hans
  text: 他全然走尼八的儿子耶罗波安的道路，也随从耶罗波安的罪，就是他使以色列人犯的罪，以他们的虚妄之物[a]惹以色列的上帝雅威发怒。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “虚妄之物”或译“毫无价值之物”；这里是贬称，指偶像。
    reason: 说明הבל的字面意象及其在本节中的语境所指。
lexical_decisions:
- source_word: וַיֵּלֶךְ בְּכָל דֶּרֶךְ
  choice: 他完全走……的道路
  rationale: הלך בדרך在此指行为和生活方式，不是实际行走；“完全走……的道路”既保留希伯来文“道路”的比喻，也表达בכל所强调的全面效法。
- source_word: יָרָבְעָם בֶּן־נְבָט
  choice: 尼八的儿子耶罗波安
  rationale: 按照现代中文圣经人名的通行译法音译，并保留父子关系。
- source_word: וּבְחַטֹּאתָיו אֲשֶׁר הֶחֱטִיא אֶת־יִשְׂרָאֵל
  choice: 也犯他使以色列人所犯的罪
  rationale: 保留חטא使役式“使……犯罪”的因果力量；“他”在上下文中回指耶罗波安。
- source_word: לְהַכְעִיס
  choice: 惹……发怒
  rationale: 该不定式可表达目的或结果；中文“惹……发怒”自然地呈现其挑起怒气的含义，而不强行限定为单一逻辑关系。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以中文音译呈现四字神名，避免用头衔取代原文专名。
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: 以色列的上帝
  rationale: 直接表达原文的领属结构和身份说明。
- source_word: בְּהַבְלֵיהֶם
  choice: 以他们的虚妄之物
  rationale: הבל本义涉及气息、虚空和无价值之物，在此语境中带有针对偶像的贬斥意味；正文保留原文比喻，脚注说明其所指。
theological_decisions:
- issue: 四字神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文使用上帝的专名；采用“雅威”保留专名性质，而不以称号替代。
- issue: הבל的宗教性所指
  choice: 虚妄之物
  alternative: 偶像
  rationale: 上下文表明这些无价值之物指向偶像，但正文保留原词“虚空、无价值”的论战性比喻，避免只给出解释性指称。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“走……的道路”保留圣经常见的行为比喻；“惹……发怒”符合自然中文。正文中的[a]与脚注对应。
