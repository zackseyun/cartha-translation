  text: הִנְ/נִ֥י מַבְעִ֛יר אַחֲרֵ֥י בַעְשָׁ֖א וְ/אַחֲרֵ֣י בֵית֑/וֹ וְ/נָֽתַתִּי֙ אֶת בֵּ֣יתְ/ךָ֔ כְּ/בֵ֖ית יָרָבְעָ֥ם בֶּן נְבָֽט־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/003.yaml
  text: Behold[a], I am sweeping away Baasha and his house, and I will make your house like the house of Jeroboam son of Nebat.
translation:
  language: zh_hans
  text: 看哪[a]，我要把巴沙和他的家彻底除灭；我要使你的家像尼八的儿子耶罗波安的家一样。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “彻底除灭”按字面可译作“在巴沙之后、在他家之后焚烧（或烧尽）”。这是希伯来语习语，意思是耶和华要清除巴沙和他的家系。
    reason: 保留 מַבְעִיר אַחֲרֵי 在原文中两次出现的“之后”结构及其焚烧意象，并说明其在本处表示清除巴沙及其家系的习语含义。
lexical_decisions:
- source_word: הִנְנִי
  choice: 看哪
  rationale: 引出庄严的神谕宣告，保留希伯来语提示听者注意的先知性语气；“看哪”在现代中文中仍庄重且易懂。
- source_word: מַבְעִיר אַחֲרֵי
  choice: 彻底除灭
  rationale: 该结构在此审判语境中表示清除、消灭巴沙及其后裔，而非着重说明用火焚烧的具体方式。“彻底除灭”清楚传达全面清除的结果；较直译的表达收入脚注。
- source_word: בַעְשָׁא
  choice: 巴沙
  rationale: 采用现代中文圣经语境中通行的人名译法。
- source_word: בֵיתוֹ / בֵיתְךָ
  choice: 他的家／你的家
  rationale: בַּיִת 在君王受审判的语境中可涵盖家庭、家族和王朝。“家”保留原文意象及其范围上的张力，不将含义限定为家庭成员或王朝。
- source_word: וְנָתַתִּי
  choice: 我要使
  rationale: נתן 在“使某物如同……”的结构中表示使之成为某种状态；译作“使”符合现代汉语习惯。
- source_word: כְּבֵית
  choice: 像……的家一样
  rationale: 自然表达比较关系，同时保留两家受同样审判的对应。
- source_word: יָרָבְעָם בֶּן נְבָט
  choice: 尼八的儿子耶罗波安
  rationale: 按希伯来语亲子关系明确表达，并采用通行中文专名译法。
theological_decisions:
- issue: 对巴沙家所受审判的性质
  choice: 正文将希伯来语习语译为对巴沙及其家彻底清除，而不指定以火为实际执行方式。
  alternative: 较形式化地译作“我要在巴沙之后焚烧／烧除”，或直接译作“我要焚烧巴沙”。
  rationale: 原文 מַבְעִיר אַחֲרֵי 的字面成分涉及“烧除”和“在……之后”，但上下文所宣告的是巴沙家系遭全面清除。正文传达该习语的审判力度，脚注则保存其字面意象及解释空间，避免误导读者把重点放在具体的火刑方式上。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。“看哪”保留神谕的郑重语气；“彻底除灭”直白有力。“家”有意保留家庭、家族与王朝之间的语义宽度。
