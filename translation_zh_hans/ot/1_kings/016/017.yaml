  text: 于是，暗利和随同他的全体以色列人从基比顿上去，围困得撒。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲלֶה
  choice: 上去
  rationale: 保留עלה表示“上去、上升”的基本叙事意义，既可反映地势，也可指军事进发，而不额外限定为“行军”。
- source_word: עָמְרִי
  choice: 暗利
  rationale: 采用现代中文圣经中通行的人名译法。
- source_word: וְכָל יִשְׂרָאֵל עִמּוֹ
  choice: 和跟随他的全以色列人
  rationale: “以色列”在此为集体称谓，语境中指拥护并随同暗利的众人或军队；加入“人”使现代汉语自然，“跟随他的”准确表达עִמּוֹ的随同行动。
- source_word: מִגִּבְּתוֹן
  choice: 从基比顿
  rationale: מן直译为“从”；地名采用现代中文圣经中通行的译名。
- source_word: וַיָּצֻרוּ
  choice: 围攻
  rationale: צור在此具有军事上的围困、攻城之意；“围攻”简洁自然，并保留围困与进攻兼具的语义。
- source_word: עַל
  choice: 围攻的宾语结构
  rationale: עַל标示围攻的目标；现代汉语中“围攻”直接带宾语，无须另译介词。
- source_word: תִּרְצָה
  choice: 得撒
  rationale: 采用现代中文圣经中通行的地名译法。
theological_decisions: []
