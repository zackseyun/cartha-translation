  text: He set up an altar for Baal in the house of Baal[a], which he had built in Samaria.
translation:
  language: zh_hans
  text: 他在自己建于撒马利亚的巴力庙[a]里，为巴力设立了一座祭坛。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“巴力的房屋”；也可译为“巴力的神庙”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֶם
  choice: 筑了
  rationale: 希伯来语קום的使役式在此指设立、建起祭坛；现代汉语通常说“筑坛”，自然且准确。
- source_word: מִזְבֵּחַ
  choice: 一座坛
  rationale: מִזְבֵּחַ指献祭用的祭坛；“坛”符合中文圣经语体，量词“一座”使表达自然。
- source_word: לַבָּעַל
  choice: 为巴力
  rationale: 介词ל在此表示归属或奉献对象；“为巴力”清楚表明这坛是献给巴力的。
- source_word: בֵּית הַבַּעַל
  choice: 巴力庙
  rationale: 字面为“巴力的房屋”，语境中指供奉巴力的神庙；“巴力庙”在现代汉语中比“巴力的殿”更直接自然，脚注保留字面信息。
- source_word: אֲשֶׁר בָּנָה
  choice: 自己建于
  rationale: 关系从句修饰“巴力庙”，主语仍是亚哈；重组为前置定语，既符合汉语语序，也保留该庙由他建造的信息。
- source_word: בְּשֹׁמְרוֹן
  choice: 于撒马利亚
  rationale: 介词ב表示地点；שֹׁמְרוֹן按通行译名译作“撒马利亚”。”于”置于定语中简洁庄重。
theological_decisions:
- issue: בֵּית הַבַּעַל的表达
  choice: 巴力庙
  alternative: 巴力的殿；巴力的房屋
  rationale: 此词组字面是“巴力的房屋”，在本段祭祀语境中实际指巴力神庙。“巴力庙”准确传达所指，并以脚注保存原文的字面措辞，不加入宗派性解释。
translation_notes:
  register: 采用现代、简洁而庄重的叙事语言。“筑了一座坛”为自然汉语搭配；将关系从句前置为定语，避免生硬照搬希伯来语序。脚注标记[a]已置于正文对应词后。
