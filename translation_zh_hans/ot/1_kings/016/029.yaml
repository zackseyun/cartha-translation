base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/029.yaml
  text: And Ahab son of Omri became king over Israel in the thirty-eighth year of Asa king of Judah, and Ahab son of Omri reigned over Israel in Samaria twenty-two years.
translation:
  language: zh_hans
  text: 犹大王亚撒在位第三十八年，暗利的儿子亚哈登基作以色列王。暗利的儿子亚哈在撒玛利亚统治以色列二十二年。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מָלַךְ
  choice: 登基作……王
  rationale: 在列王纪的登基公式中，此处完成式指开始作王；“登基作以色列王”自然地区别于后文表示统治年数的说法。
- source_word: בִּשְׁנַת שְׁלֹשִׁים וּשְׁמֹנֶה שָׁנָה לְאָסָא מֶלֶךְ יְהוּדָה
  choice: 犹大王亚撒在位第三十八年
  rationale: 按现代汉语常用的纪年格式表达希伯来文以亚撒统治年次为参照的同步纪年。
- source_word: וַיִּמְלֹךְ
  choice: 统治
  rationale: 此动词引出亚哈在位的地点和年数，表示持续执政，与前面的登基相区别。
- source_word: בְּשֹׁמְרוֹן
  choice: 在撒玛利亚
  rationale: 介词指明地点；撒玛利亚是其王权所在之地，不额外补入原文未明说的“以……为都”。
- source_word: עֶשְׂרִים וּשְׁתַּיִם שָׁנָה
  choice: 二十二年
  rationale: 直接、自然地表达在位时长。
- source_word: וְ
  choice: 不单独译出
  rationale: 句首连词承接前文；中文在独立经节中省略“于是/而”更自然，叙事连续性仍由纪年公式体现。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的史书体。人名、地名依中文圣经通行译名“亚撒、暗利、亚哈、撒玛利亚”。用“登基作……王”表达即位，用“统治……年”表达持续掌权，避免同一汉语词掩盖两处动词在登基公式中的功能差异。
