  text: וַ/יְהִ֤י דְבַר יְהוָה֙ אֶל יֵה֣וּא בֶן חֲנָ֔נִי עַל בַּעְשָׁ֖א לֵ/אמֹֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/001.yaml
  text: Then the word of Yahweh came to Jehu son of Hanani against Baasha[a], saying,
translation:
  language: zh_hans
  text: 于是，雅威的话临到哈拿尼的儿子耶户，责备巴沙，说：
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: 于是……临到
  rationale: 以“于是”承接叙事的新进展；结合后面的先知启示惯用语，将希伯来语结构自然表达为“话临到”。
- source_word: דְבַר יְהוָה
  choice: 雅威的话
  rationale: 保留“话”在先知启示公式中的正式与神学意味，而不解释性地改作“信息”。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来语四字神名的通行现代汉语音译处理，保留其作为专名的性质，不以称号替代。
- source_word: אֶל
  choice: 临到
  rationale: 在“雅威的话”这一启示公式中，汉语以“临到”自然标明神言的领受者。
- source_word: יֵהוּא בֶן חֲנָנִי
  choice: 哈拿尼的儿子耶户
  rationale: 直接表达希伯来语的父子关系，并采用现代汉语圣经人名的通行音译。
- source_word: עַל
  choice: 针对
  rationale: 本处引出审判性神谕，“针对”可体现话语所指及其不利指向，同时不像“攻击”或“责备”那样加入原文未明说的动作。
- source_word: בַּעְשָׁא
  choice: 巴沙
  rationale: 采用该人名的通行现代汉语音译。
- source_word: לֵאמֹר
  choice: 说：
  rationale: 引出下一节神谕的具体内容；冒号符合现代汉语标点习惯。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名；音译为“雅威”保留其专名性质，避免以“主”这一称号取代。
- issue: 先知公式中 עַל 的语气
  choice: 针对巴沙
  alternative: 论到巴沙；关于巴沙
  rationale: 下文是对巴沙的审判宣告，因此译文需要保留不利指向；但介词本身也可较宽泛地表示“关于”，故正文采用兼具指向性而不过度解释的“针对”，并以脚注保留较中性的译法。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“于是”推进叙事，“雅威的话临到……”保留先知启示公式；句末用冒号引出下一节的直接话语。
