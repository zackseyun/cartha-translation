  text: וְ/יֶ֨תֶר דִּבְרֵ֤י עָמְרִי֙ אֲשֶׁ֣ר עָשָׂ֔ה וּ/גְבוּרָת֖/וֹ אֲשֶׁ֣ר עָשָׂ֑ה הֲ/לֹֽא הֵ֣ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/027.yaml
  text: The rest of the acts of Omri[a], what he did[b], and his might that he showed—are they not written in the Book of the Chronicles of the Kings of Israel?
translation:
  language: zh_hans
  text: 暗利其余的事迹，以及他所施展的勇力，不都记在《以色列诸王年代志》上吗？[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 《以色列诸王年代志》指以色列王室的史料汇编，不是圣经中的《历代志》。
    reason: cultural_note
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי עָמְרִי
  choice: 暗利其余的事
  rationale: “דִּבְרֵי”在君王事迹总结套语中指君王的事迹或所行之事，而非单指言语；“其余的事”自然、简洁地传达该义。
- source_word: אֲשֶׁר עָשָׂה
  choice: 就是他所行的
  rationale: 保留原文关系从句及动词“行、做”的概括性，并以“就是”使中文结构清楚。
- source_word: וּגְבוּרָתוֹ אֲשֶׁר עָשָׂה
  choice: 以及他所展现的勇力
  rationale: גְּבוּרָה既可指力量、勇力，也可指彰显这种力量的英勇事迹；“所展现的勇力”保留抽象名词及后续“他所行的”这一表达的动态意味。
- source_word: הֲלֹא הֵם כְּתוּבִים
  choice: 不都记……吗
  rationale: 以现代汉语反问句保留原文期待肯定回答的修辞力量；“记”在文献语境中比逐字的“写”更自然。
- source_word: עַל סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יִשְׂרָאֵל
  choice: 记在《以色列诸王年代志》上
  rationale: “年代志”表达דִּבְרֵי הַיָּמִים所指的按时序编录的王室史料；书名号表明这是文献名称，“上”也保留עַל的表达特点。
