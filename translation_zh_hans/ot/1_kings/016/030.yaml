  text: וַ/יַּ֨עַשׂ אַחְאָ֧ב בֶּן עָמְרִ֛י הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה מִ/כֹּ֖ל אֲשֶׁ֥ר לְ/פָנָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/030.yaml
  text: Ahab son of Omri did what was evil in the sight of Yahweh[b][a], more than all who were before him.
translation:
  language: zh_hans
  text: 暗利的儿子亚哈在雅威眼中[a]行恶，比他以前所有的人更甚[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：在雅威眼中为恶。
    reason: 保留希伯来语 בְּעֵינֵי 的身体意象及其评价性惯用语。
  - marker: b
    text: 或译：在行恶上胜过所有先于他的人。
    reason: “在他以前的人”与“先于他的人”都可表达 לְפָנָיו 在此处的时间意义；补出“在行恶上”以明确比较范围。
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: 做了
  rationale: עָשָׂה 与“恶”连用，表示行恶；“做了……的事”在现代汉语中自然，也保留原文的基本动词。
- source_word: הָרַע
  choice: 视为恶的事
  rationale: 带冠词的形容词 רַע 在此作名词性用法；结合 בְּעֵינֵי，译为“视为恶的事”既清楚又符合现代汉语。
- source_word: בְּעֵינֵי יְהוָה
  choice: 雅威视为
  rationale: 原文直译为“在雅威眼中”，表达雅威的判断；正文采用自然的汉语表达，并以脚注保留原文意象。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文四字神名的常见汉语音译处理，保留其专名性质，不以称号替代。
- source_word: מִכֹּל אֲשֶׁר לְפָנָיו
  choice: 比所有在他以前的人更甚
  rationale: 比较用法 מִן 表明亚哈在恶行上超过此前所有相关人物；上下文所指为先前的君王，正文不额外补入“君王”，以免比原文更明确。
- source_word: לְפָנָיו
  choice: 在他以前
  rationale: לְפָנָיו 字面为“在他面前”，此处是时间意义，指先于他的人。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文使用神的专名 יְהוָה；“雅威”较直接反映通常重构的读音，同时保留专名而不改译为“主”。
- issue: “在雅威眼中”的道德评价
  choice: 雅威视为恶
  alternative: 在雅威眼中为恶
  rationale: 两种译法都表明评价标准属于雅威，而非仅陈述人的看法；正文选择更自然的现代汉语，脚注保留直译。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“暗利的儿子亚哈”依照希伯来语语序；“更甚”简洁表达比较程度。正文未补出“君王”，以保留原文措辞的宽度。
