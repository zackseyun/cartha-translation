  yaml_path: translation/ot/1_kings/016/028.yaml
  text: And Omri slept with his fathers and was buried in Samaria[a], and Ahab his son reigned in his place.
translation:
  language: zh_hans
  text: 暗利与他的列祖同睡[a]，葬在撒马利亚。他的儿子亚哈接替他作王。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “与他的列祖同睡”是王室叙事中表示死亡的惯用说法。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב עָמְרִי עִם אֲבֹתָיו
  choice: 暗利与他的列祖同睡
  rationale: 这是王室叙事中表示死亡的固定用语。保留“同睡”的意象与反复出现的公式性，同时用脚注向现代读者说明其含义。
- source_word: אֲבֹתָיו
  choice: 他的列祖
  rationale: “列祖”自然体现先祖和王朝传承，比单纯的“父亲们”更符合现代汉语中的固定圣经叙事语体。
- source_word: וַיִּקָּבֵר
  choice: 葬
  rationale: 希伯来语为被动式，但现代汉语在此省略显式被动标记更自然，仍清楚表达他被安葬。
- source_word: בְּשֹׁמְרוֹן
  choice: 在撒马利亚
  rationale: 介词 בְּ 表示安葬地点；“在撒马利亚”准确而自然。
- source_word: וַיִּמְלֹךְ
  choice: 作王
  rationale: 表达 מָלַךְ 的统治、为王之义，符合汉语王位继承叙事的惯用说法。
- source_word: תַּחְתָּיו
  choice: 接替他
  rationale: 该短语表示取代前王、承继王位；“接替他作王”在现代汉语中简洁自然，也不额外限定继位发生的具体方式。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言；保留希伯来文王室死亡公式“与列祖同睡”，并以脚注解释，避免将其意象直接改写为“死了”。
