  text: אָ֧ז יֵחָלֵ֛ק הָ/עָ֥ם יִשְׂרָאֵ֖ל לַ/חֵ֑צִי חֲצִ֨י הָ/עָ֜ם הָ֠יָה אַחֲרֵ֨י תִבְנִ֤י בֶן גִּינַת֙ לְ/הַמְלִיכ֔/וֹ וְ/הַ/חֲצִ֖י אַחֲרֵ֥י עָמְרִֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/021.yaml
  text: 'Then the people of Israel were divided into two parts: half of the people followed Tibni son of Ginath[a], to make him king, and half followed Omri.'
translation:
  language: zh_hans
  text: 那时，以色列民分成了两派：一半人拥护基纳的儿子提比尼，要立他为王；另一半人拥护暗利。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יֵחָלֵק
  choice: 分成了
  rationale: 该词为חלק的尼法勒式，表达“被分开、分裂”。主语“民”是集合名词；现代汉语用“分成了两派”自然传达政治阵营的分裂。
- source_word: הָעָם יִשְׂרָאֵל
  choice: 以色列民
  rationale: 此处指以色列的国民群体。“以色列民”简洁、庄重，也符合现代中文圣经叙事语体。
- source_word: לַחֵצִי
  choice: 两派
  rationale: 字面为“成两半”。结合随后两位王位竞争者的政治背景，译作“两派”既保留二分结构，也自然表达阵营之分。
- source_word: חֲצִי הָעָם
  choice: 一半人
  rationale: 准确保留原文反复出现的“半数百姓”，并使中文表达简洁流畅。
- source_word: הָיָה אַחֲרֵי
  choice: 拥护
  rationale: 字面为“在……之后”，在政治争位语境中表示站在某人一边、支持某人。“拥护”比单纯“跟随”更清楚地表达政治效忠。
- source_word: תִבְנִי בֶן גִּינַת
  choice: 基纳的儿子提比尼
  rationale: 依普通话现代常用圣经人名音译，并按汉语亲属结构表达“某人的儿子”。
- source_word: לְהַמְלִיכוֹ
  choice: 要立他为王
  rationale: מלך的使役不定式带第三人称后缀，意为使他作王。“立他为王”不额外加入加冕仪式等原文未明说的细节。
- source_word: וְהַחֲצִי אַחֲרֵי עָמְרִי
  choice: 另一半人拥护暗利
  rationale: 从前一分句补出谓语；“另一半”清楚呈现两派之间的对称关系。
theological_decisions: []
