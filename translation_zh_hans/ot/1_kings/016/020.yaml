base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/020.yaml
  text: The rest of the acts of Zimri[a], and his conspiracy that he carried out—are they not written in the Book of the Chronicles of the Kings of Israel?
translation:
  language: zh_hans
  text: 心利其余的事迹，以及他所策划的谋反[a]，不都记在《以色列诸王记》上吗？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文作“他的谋反，就是他所谋划的”。名词和动词出自同一词根，用以加强语气。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי זִמְרִי
  choice: 心利其余的事
  rationale: 王室纪事的固定表达；דִּבְרֵי 在此指与君王有关的事迹或事情，而非单指言语。译作“其余的事”自然、简洁，也不增添原文没有的时间副词。
- source_word: וְקִשְׁרוֹ אֲשֶׁר קָשָׁר
  choice: 以及他所策划的谋反
  rationale: קֶשֶׁר 在王权语境中指政治谋反或阴谋；后接同根动词 קָשָׁר，形成强调性的同根重复。中文以“策划的谋反”自然表达这一关系，并保留第三人称单数所属意义。
- source_word: הֲלֹא הֵם כְּתוּבִים
  choice: 不都写……吗
  rationale: 保留 הֲלֹא 引出的反问形式，并以“都”承接复数主语所涵盖的两项内容。
- source_word: עַל סֵפֶר
  choice: 写在……上
  rationale: 较贴近介词 עַל 与 סֵפֶר 的书面载录意象，同时符合现代汉语“写在书上”的习惯。
- source_word: סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יִשְׂרָאֵל
  choice: 《以色列诸王记》
  rationale: 该短语是所引王室编年史的题名；采用简明、惯用的中文书名形式，不将其与正典《历代志》混同。
