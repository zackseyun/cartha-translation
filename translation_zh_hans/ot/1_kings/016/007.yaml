source:
  edition: WLC
  text: וְ/גַ֡ם בְּ/יַד יֵה֨וּא בֶן חֲנָ֜נִי הַ/נָּבִ֗יא דְּבַר יְהוָ֡ה הָיָה֩ אֶל בַּעְשָׁ֨א וְ/אֶל בֵּית֜/וֹ וְ/עַ֥ל כָּל הָ/רָעָ֣ה אֲשֶׁר עָשָׂ֣ה בְּ/עֵינֵ֣י יְהוָ֗ה לְ/הַכְעִיס/וֹ֙ בְּ/מַעֲשֵׂ֣ה יָדָ֔י/ו לִ/הְי֖וֹת כְּ/בֵ֣ית יָרָבְעָ֑ם וְ/עַ֥ל אֲשֶׁר הִכָּ֖ה אֹתֽ/וֹ־־־־־־׀־׀־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/007.yaml
  text: And also through Jehu son of Hanani the prophet[a], the word of Yahweh came against Baasha and against his house, both because of all the evil that he did in the sight of Yahweh, provoking him to anger by the work of his hands, by becoming like the house of Jeroboam, and because he struck him down.
translation:
  language: zh_hans
  text: 此外，耶和华的话也借着哈拿尼的儿子耶户先知，临到巴沙和他的家，针对他在耶和华眼中所行的一切恶事：他以自己手所做的惹耶和华发怒，效法耶罗波安的家；又因他击杀了他[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文“他”是阳性单数，所指并不明确。它可指耶罗波安本人；按上下文，更可能指耶罗波安的“家”，即其王朝，作为一个整体。
    reason: 保留原文阳性单数宾语的歧义，并说明上下文中较可能的集体/王朝所指。
lexical_decisions:
- source_word: וְגַם
  choice: 此外……也
  rationale: 承接上文并补充说明，保留连接和递进作用，同时符合现代汉语表达。
- source_word: בְּיַד יֵהוּא
  choice: 借着……耶户
  rationale: בְּיַד 是表示代理或媒介的习语；“借着”自然地表明耶户是传达神话语的先知。
- source_word: דְּבַר יְהוָה
  choice: 耶和华的话
  rationale: 保留先知文献的固定表达，并以“耶和华”音译四字神名。
- source_word: אֶל בַּעְשָׁא וְאֶל בֵּיתוֹ
  choice: 临到巴沙和他的家，谴责……
  rationale: אֶל 本义可指“向、到”，但此处内容是审判宣告；以“临到”保留先知公式，再补出“谴责”表达语境中的敌对和审判意味。
- source_word: בֵּיתוֹ
  choice: 他的家
  rationale: “家”保留希伯来语意象，并可兼指家室、家族和王朝，不把范围过早限定为其中一种。
- source_word: וְעַל כָּל הָרָעָה
  choice: 谴责他……所行的一切恶事
  rationale: עַל 在此引出审判的缘由；“谴责”使全句在汉语中清楚连贯。
- source_word: בְּעֵינֵי יְהוָה
  choice: 在耶和华眼中
  rationale: 保留原文常见的评价性视觉隐喻，现代读者也容易理解。
- source_word: לְהַכְעִיסוֹ
  choice: 惹耶和华发怒
  rationale: 体现使役含义，并明确代词所指，避免汉语中的歧义。
- source_word: בְּמַעֲשֵׂה יָדָיו
  choice: 他手所做的
  rationale: 保留“手”的具体意象；该短语可泛指行为，也可能暗含人手所造之物，不将其窄化为某一种罪。
- source_word: לִהְיוֹת כְּבֵית יָרָבְעָם
  choice: 使自己变得像耶罗波安的家
  rationale: 把不定式理解为其行为所造成的结果，同时保留他与耶罗波安王朝相似这一表达。
- source_word: וְעַל אֲשֶׁר הִכָּה אֹתוֹ
  choice: 也谴责他击毁了它
  rationale: 阳性单数后缀可回指阳性名词“家”，按集体意义指耶罗波安王朝；“击毁”既反映 הִכָּה 的击打语义，也符合王朝遭消灭的语境。歧义在脚注中保留。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 采用现代中文圣经读者最熟悉的专名形式“耶和华”，明确将四字神名作为专名呈现，而不以“主”替代。
- issue: 巴沙因消灭耶罗波安家而受责的张力
  choice: 保留“也谴责他击毁了它”
  alternative: 省略或解释为仅因残暴方式受责
  rationale: 原文明言这一行为也是审判依据；即使巴沙的行动与先前对耶罗波安家的审判相合，也不替文本化解神的审判与人的责任之间的张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“临到”保留先知宣告的传统语体，“谴责”则补足汉语所需的审判关系。人名采用通行译名：哈拿尼、耶户、巴沙、耶罗波安。
