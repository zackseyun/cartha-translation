source:
  edition: WLC
  text: יַ֗עַן אֲשֶׁ֤ר הֲרִימֹתִ֨י/ךָ֙ מִן הֶ֣/עָפָ֔ר וָ/אֶתֶּנְ/ךָ֣ נָגִ֔יד עַ֖ל עַמִּ֣/י יִשְׂרָאֵ֑ל וַ/תֵּ֣לֶךְ בְּ/דֶ֣רֶךְ יָרָבְעָ֗ם וַֽ/תַּחֲטִא֙ אֶת עַמִּ֣/י יִשְׂרָאֵ֔ל לְ/הַכְעִיסֵ֖/נִי בְּ/חַטֹּאתָֽ/ם־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/002.yaml
  text: Because I raised you up from the dust and made you ruler over my people Israel[a], and you walked in the way of Jeroboam and caused my people Israel to sin, provoking me to anger by their sins,
translation:
  language: zh_hans
  text: “因为我从尘土中提拔你，立你作我民以色列的领袖，你又走耶罗波安的道路，使我民以色列犯罪[a]，因他们的罪惹我发怒，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “使……犯罪”也可译作“领……陷入罪中”；希伯来语动词是使役形式。
    reason: 说明原文动词的使役意义及自然的中文替代译法。
lexical_decisions:
- source_word: יַעַן אֲשֶׁר
  choice: 因此
  rationale: 这个复合表达引出下一节审判的根据。中文将“因此”置于句末承接下文，既保留因果关系，也避免用悬空的“因为”造成不完整感。
- source_word: הֲרִימֹתִיךָ מִן הֶעָפָר
  choice: 我从尘土中提拔你
  rationale: “从尘土中”保留卑微出身的意象；“提拔”自然表达从低微地位升至王权的含义。
- source_word: וָאֶתֶּנְךָ נָגִיד
  choice: 立你作……的领袖
  rationale: נָגִיד 指受立的领导者或统治者；“领袖”清楚庄重，并避免把该词过度限定为某种具体王室头衔。
- source_word: עַל עַמִּי יִשְׂרָאֵל
  choice: 我民以色列的
  rationale: 与“领袖”组合为自然中文，同时保留“我民”的所属强调和治理关系。
- source_word: וַתֵּלֶךְ בְּדֶרֶךְ יָרָבְעָם
  choice: 你却走耶罗波安的道路
  rationale: “走……的道路”保留希伯来语以道路比喻行为模式的表达；“却”自然呈现上帝提拔巴沙与巴沙随后背逆之间的语义转折。
- source_word: וַתַּחֲטִא אֶת עַמִּי יִשְׂרָאֵל
  choice: 使我民以色列犯罪
  rationale: חטא 的使役词干明确表示令别人犯罪；此译直接保留使役意义。
- source_word: לְהַכְעִיסֵנִי
  choice: 惹我发怒
  rationale: 简洁自然地表达该不定式所表示的结果或目的，并保留罪对上帝造成的直接冒犯。
- source_word: בְּחַטֹּאתָם
  choice: 他们的罪
  rationale: 第三人称阳性复数后缀最自然地回指紧邻的“我民以色列”；在中文中作“惹我发怒”的主语，清楚传达这些罪引发上帝的怒气。
theological_decisions:
- issue: “他们的罪”所指为何
  choice: 指以色列民在巴沙引导下所犯的罪
  alternative: 也可较宽泛地理解为耶罗波安道路所代表的罪行，其中包括巴沙本人的参与
  rationale: 紧邻的复数先行对象是“我民以色列”，因此回指百姓最符合句法；同时，巴沙“使”他们犯罪，表明君王负有引人犯罪的责任，却不抹去百姓自身犯罪的事实。
- issue: 巴沙与以色列犯罪之间的关系
  choice: 保留使役表达“使……犯罪”
  alternative: 译作“领……陷入罪中”
  rationale: 使役词干将责任明确归于巴沙的引导和影响，但经文本并未说明他以何种机制强迫百姓，因此不进一步解释为强制。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。保留“尘土”和“走……的道路”等经文意象。因本节语法上延续至下一节，将因果连接语“因此”置于末尾，以自然承接后文；经文结尾保留逗号表示句意未完。
