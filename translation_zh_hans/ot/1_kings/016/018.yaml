revisions:
- from: 心利见城已被攻取，就进了王宫的内堡[a]，放火焚烧王宫，也让火烧到自己身上[b]，就死了。
  to: 心利见城已被攻取，就进了王宫的内堡[a]，放火焚烧王宫，自己也葬身火中[b]，就死了。
  rationale: 修订将不够贴切的“让火烧到自己身上”改为“自己也葬身火中”，以自然、庄重的现代汉语保留原文所描写的自我毁灭结果；脚注则保留原文“在自己上面”的不寻常措辞，并避免增添建筑坍塌等细节。
