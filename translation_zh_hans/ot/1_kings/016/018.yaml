  text: וַ/יְהִ֞י כִּ/רְא֤וֹת זִמְרִי֙ כִּֽי נִלְכְּדָ֣ה הָ/עִ֔יר וַ/יָּבֹ֖א אֶל אַרְמ֣וֹן בֵּית הַ/מֶּ֑לֶךְ וַ/יִּשְׂרֹ֨ף עָלָ֧י/ו אֶת בֵּֽית מֶ֛לֶךְ בָּ/אֵ֖שׁ וַ/יָּמֹֽת־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/018.yaml
  text: And when Zimri saw that the city had been captured[a], he went into the citadel of the king’s house and burned the king’s house over himself with fire[b], and died.
translation:
  language: zh_hans
  text: 心利见城已被攻取，就进了王宫的内堡[a]，放火焚烧王宫，自己也葬身火中[b]，就死了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “内堡”也可译作“堡垒”或“宫殿”；希伯来语אַרְמוֹן可指设防的王室建筑。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“用火把王宫烧在自己上面”。这描写心利放火焚烧王宫，自己也葬身火中。
    reason: cultural_note
lexical_decisions:
- source_word: כִּ/רְאוֹת
  choice: 见……就
  rationale: 带כ的独立形不定式在此表示时间背景；汉语用“见……就”自然地衔接心利所见与随后行动。
- source_word: נִלְכְּדָה הָ/עִיר
  choice: 城已被攻取
  rationale: לכד的Nifal形表示城被夺取；“已”体现心利看见时攻城已经得手。
- source_word: אַרְמוֹן בֵּית הַ/מֶּלֶךְ
  choice: 王宫的内堡
  rationale: אַרְמוֹן可指宫殿或设防的王室建筑；因后文另有“王宫”，译作“内堡”既保留两者区别，也符合此处进入王室建筑内部坚固处所的语境。
- source_word: בֵּית הַ/מֶּלֶךְ / בֵּית מֶלֶךְ
  choice: 王宫
  rationale: 字面为“王的房屋”，现代汉语以“王宫”表达王室居所，并保留原文两次所指相同建筑的关系。
- source_word: וַ/יִּשְׂרֹף עָלָי/ו ... בָּ/אֵשׁ
  choice: 放火焚烧王宫，也让火烧到自己身上
  rationale: 保留“用火焚烧”及עָלָיו“在自己身上／临到自己”的反身含义，同时用可理解的现代汉语表达其自焚行动，不额外断言建筑倒塌。
- source_word: וַ/יָּמֹת
  choice: 就死了
  rationale: 作为连续叙事的结果，用“就”自然表达前述行动随即导致死亡。
