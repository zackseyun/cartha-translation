review_pass:
  verdict: revise
  source_fidelity: 译文准确传达心利见城陷落、进入王室设防处所、纵火及死亡的叙事顺序。但“也让火烧到自己身上”将“把王宫烧在自己身上”的特殊表达弱化为火焰波及他，未充分表现其以焚烧王宫而自我毁灭的关系。
  naturalness: “王宫的内堡”在历史叙事中可以接受；“也让火烧到自己身上”虽可理解，却较口语化且不够贴切。改为“自己也葬身火中”更自然、庄重，并准确交代结果。
  terminology: “心利”“城已被攻取”“王宫”“内堡”“焚烧”均符合现代标准汉语的庄重历史叙事语体。保留“内堡”与“王宫”的区分，有助于反映אַרְמוֹן与בֵּית之间的措辞差异。
  issues:
  - severity: medium
    issue: “也让火烧到自己身上”弱化了עָלָיו所表达的自我毁灭关系。
    rationale: 原文说心利用火焚烧王宫“在自己上面／向自己”，后接“就死了”。现有说法容易理解为火意外烧及身体；改为“自己也葬身火中”以自然汉语表达其纵火导致自身死亡，同时不擅自断言建筑坍塌。
  - severity: low
    issue: 脚注b的“把王宫烧在自己身上”不合现代汉语表达。
    rationale: 该脚注虽意在保留字面结构，但表述生硬。应说明原文的字面意象，并以清晰中文解释其所指。
  revised_text: 心利见城已被攻取，就进了王宫的内堡[a]，放火焚烧王宫，自己也葬身火中[b]，就死了。
