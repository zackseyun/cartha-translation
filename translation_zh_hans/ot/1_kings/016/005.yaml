  text: וְ/יֶ֨תֶר דִּבְרֵ֥י בַעְשָׁ֛א וַ/אֲשֶׁ֥ר עָשָׂ֖ה וּ/גְבֽוּרָת֑/וֹ הֲ/לֹא הֵ֣ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/005.yaml
  text: The rest of the acts of Baasha[a], and what he did, and his might—are they not written in the Book of the Chronicles of the Kings of Israel?
translation:
  language: zh_hans
  text: 巴沙其余的事迹、他所行的，以及他的勇力，不都记在《以色列诸王纪事录》[a]中吗？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：《以色列诸王年鉴》。
    reason: 原文书名סֵפֶר דִּבְרֵי הַיָּמִים可理解为纪事录或年鉴；两种译法都能表达王室编年史料的性质。
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי בַעְשָׁא
  choice: 巴沙其余的事迹
  rationale: יֶתֶר表示其余部分；在列王纪常见的君王总结语中，דִּבְרֵי指有关君王的事迹或事项，而非单指言语。
- source_word: וַאֲשֶׁר עָשָׂה
  choice: 他所行的
  rationale: 直接表达关系从句，不增添原文未明说的“所有”。
- source_word: וּגְבוּרָתוֹ
  choice: 以及他的勇力
  rationale: 保留גְּבוּרָה作为抽象名词的“力量、勇武”含义，也容纳其在王室纪事语境中指表现出来的强盛或英勇；不直接释作更具体的“英勇事迹”。
- source_word: הֲלֹא הֵם כְּתוּבִים
  choice: 不都记在……中吗
  rationale: 保留希伯来文反问句式及列王纪中的固定总结语气；“记”在现代汉语中自然表达书面记录。
- source_word: סֵפֶר דִּבְרֵי הַיָּמִים
  choice: 《……纪事录》
  rationale: 该词组指记录历日事件的史料或王室纪事文献；“纪事录”既自然，又避免让读者误以为此处必然指正典《历代志》。
- source_word: לְמַלְכֵי יִשְׂרָאֵל
  choice: 以色列诸王
  rationale: 介词לְ在书名中表示该文献所涉及的对象，即以色列诸王；按汉语书名习惯组合为《以色列诸王纪事录》。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的史书语体。“其余的事迹……不都记在……中吗”保留列王纪反复出现的君王总结公式。脚注标记置于所解释的书名之后。
