base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/022.yaml
  text: But the people who followed Omri prevailed over the people who followed Tibni son of Ginath. So Tibni died[a], and Omri became king.
translation:
  language: zh_hans
  text: 但拥护暗利的民众胜过了拥护基纳的儿子提比尼的民众。于是提比尼死了，暗利就作了王。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֶּחֱזַק
  choice: 胜过了
  rationale: חזק在此以אֶת引出对方，表示暗利一派在政治冲突中占据优势、胜过另一派；“胜过了”自然且保留其强弱较量的含义。
- source_word: הָעָם אֲשֶׁר אַחֲרֵי עָמְרִי
  choice: 拥护暗利的民众
  rationale: אַחֲרֵי字面为“在……之后”，在此政治语境中指跟随、支持某人；“拥护”清楚表达阵营归属。
- source_word: אֶת הָעָם אֲשֶׁר אַחֲרֵי תִּבְנִי
  choice: 拥护……提比尼的民众
  rationale: 与前半句保持平行，表达支持提比尼的敌对阵营；אֶת在此标示חזק所胜过的对象。
- source_word: תִּבְנִי בֶן גִּינַת
  choice: 基纳的儿子提比尼
  rationale: 按现代汉语自然次序表达父子身份，并采用常见圣经人名译法。
- source_word: וַיָּמָת תִּבְנִי
  choice: 于是提比尼死了
  rationale: 连续式叙事动词推进事件；“于是”体现前后次序及语境中的结果关系，但不具体说明死亡方式。
- source_word: וַיִּמְלֹךְ עָמְרִי
  choice: 暗利就作了王
  rationale: מלך在此指 rival 死后暗利取得王位；“作了王”比泛指统治时期的“执政”更准确。
theological_decisions:
- issue: 提比尼之死与暗利一派获胜之间的关系
  choice: 以“于是”连接，但不说明提比尼是被杀、自然死亡或自尽
  alternative: 译作“提比尼被杀”或明确说明因果与死法
  rationale: 希伯来文只说“提比尼死了”，叙事次序暗示其死与冲突结局相关，却没有交代死亡方式，不应增补。
translation_notes:
  register: 采用现代、庄重而易懂的叙事体。“民众”对应两次הָעָם，既保留原文重复和平行结构，也避免把双方过度制度化地称为“军队”或“党派”。本节无需脚注；英文咨询稿的脚注实际解释וַיֶּחֱזַק，而非其标记所在的“提比尼死了”，中文正文以“胜过了”已充分表达该词义。
