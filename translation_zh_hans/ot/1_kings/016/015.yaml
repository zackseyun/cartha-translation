base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/015.yaml
  text: In the twenty-seventh year of Asa king of Judah[a], Zimri became king for seven days in Tirzah, while the people were camped against Gibbethon, which belonged to the Philistines.
translation:
  language: zh_hans
  text: 犹大王亚撒二十七年，心利在得撒作王七天。那时，百姓正向属非利士人的基比顿[a]扎营。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“百姓正在属非利士人的基比顿扎营。”这里的军事语境表明，“向……扎营”较可能指以该城为进攻目标；但该介词也可按地点理解。
    reason: 说明介词 עַל 可作地点理解，也可在军事语境中表示敌对目标；正文采用后者，但保留前者作为可能译法。
lexical_decisions:
- source_word: בִּשְׁנַת עֶשְׂרִים וָשֶׁבַע שָׁנָה לְאָסָא מֶלֶךְ יְהוּדָה
  choice: 犹大王亚撒二十七年
  rationale: 按现代中文常用的王年纪年格式表达，完整保留君王、国名和年份。
- source_word: מָלַךְ זִמְרִי שִׁבְעַת יָמִים
  choice: 心利……作王七天
  rationale: “作王”自然表达 מָלַךְ 在此处的执政含义，并可与紧随其后的七天期限顺畅连接；不额外断定只指登基动作。
- source_word: בְּתִרְצָה
  choice: 在得撒
  rationale: 按地点介词直译，并采用通行中文专名。
- source_word: וְהָעָם חֹנִים
  choice: 那时，百姓正扎营
  rationale: 分词表示持续中的状态；“那时……正”自然呈现该背景情形，而不把连接词机械译为“并且”。
- source_word: עַל גִּבְּתוֹן
  choice: 对着……基比顿
  rationale: 军事语境中的 עַל 很可能表示以该城为进攻目标；“对着”保留敌对方向，又不像“围攻”那样增加原文未明说的具体战术。
- source_word: אֲשֶׁר לַפְּלִשְׁתִּים
  choice: 属非利士人的
  rationale: 用领属结构简洁表达 לְ 所指的归属关系，不额外解释为占领或军事控制。
