base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/010.yaml
  text: Then Zimri came in, struck him down, and killed him, in the twenty-seventh year of Asa king of Judah; and he reigned in his place.
translation:
  language: zh_hans
  text: 心利进去，击打他，杀死了他。这是犹大王亚撒在位第二十七年。心利接替他作王。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹא
  choice: 就进去
  rationale: בוא可指“来”或“进入”；在刺杀的叙事场景中译作“进去”自然地表达进入其所在之处，又不额外指定地点。“就”承接前文的叙事次序。
- source_word: זִמְרִי
  choice: 心利
  rationale: 采用现代中文圣经中通行的人名译法。
- source_word: וַיַּכֵּהוּ
  choice: 击杀了他
  rationale: נכה基本义为“击打、击杀”。此处保留它与随后“把他杀死”两个连续动作的表达；“击杀”兼顾暴力攻击的力度和庄重叙事语体。
- source_word: וַיְמִיתֵהוּ
  choice: 把他杀死
  rationale: מות的使役形表示“使之死亡、杀死”；此译直接清楚，并保留原文在前一动词之后进一步明确死亡结果的重复。
- source_word: בִּשְׁנַת עֶשְׂרִים וָשֶׁבַע
  choice: 在位第二十七年
  rationale: 这是君王纪年的固定表达；结合后面的“犹大王亚撒”，用“在位第二十七年”符合现代中文习惯。
- source_word: לְאָסָא מֶלֶךְ יְהוּדָה
  choice: 犹大王亚撒
  rationale: 介词ל在此标明纪年所依据的君王；重组为“犹大王亚撒在位第二十七年”，既准确又自然。
- source_word: וַיִּמְלֹךְ
  choice: 作王
  rationale: מלך可表示“作王、统治”或“登基”；此处与“接替他”连用，清楚表达继位，同时不额外说明统治期限。
- source_word: תַּחְתָּיו
  choice: 接替他
  rationale: תחתיו在王位继承语境中意为“代替他、在他的位置上”；“接替他作王”是自然且透明的现代中文表达。
theological_decisions: []
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。保留原文“击打/击杀”与“杀死”连续并列所形成的强调，不补出刺杀地点，也不把“作王”解释为更具体的登基仪式。
