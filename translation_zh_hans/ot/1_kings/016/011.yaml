base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/011.yaml
  text: And it happened that when he became king[a], as soon as he sat on his throne, he struck down all the house of Baasha. He did not leave him a single male[b], or any of his kinsmen or his friends.
translation:
  language: zh_hans
  text: 他登基后，刚一坐上王位，就击杀了巴沙全家；没有给巴沙留下一个男丁[a]，也没有留下他的亲族[b]和朋友。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“向墙排尿的人”，是指男性的粗俗习语。
    reason: lexical_alternative
  - marker: b
    text: 或译“他的报仇者”或“他的赎回者”；这个希伯来词指负有家族责任的近亲。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: （融入“他一作王”）
  rationale: 这是希伯来叙事中承接下一事件的常用形式；现代汉语无需机械译出“事情发生了”，以自然的时间承接表达其功能。
- source_word: בְמָלְכוֹ
  choice: 他一作王
  rationale: 介词 בְּ 加不定式结构表示时间；上下文所指是心利登基之初，“一作王”也与下句的即时行动自然衔接。
- source_word: כְשִׁבְתּוֹ עַל־כִּסְאוֹ
  choice: 刚坐上王位
  rationale: 表达他登上王位后随即采取行动；“刚”自然传达紧接发生的时间关系。
- source_word: הִכָּה
  choice: 击杀了
  rationale: נכה 在此语境中指致命攻击；“击杀”既保留“击打”的词义色彩，也明确结果是杀死。
- source_word: אֶת כָּל־בֵּית בַּעְשָׁא
  choice: 巴沙全家
  rationale: בֵּית 在此指巴沙的家族或王室，而非房屋；“全家”是现代汉语中自然且符合上下文的表达。
- source_word: לֹא הִשְׁאִיר לוֹ
  choice: 没有给巴沙留下
  rationale: 保留原文表示归属的间接受词，并将代词明确为“巴沙”，避免现代汉语中的指代含混。
- source_word: מַשְׁתִּין בְּקִיר
  choice: 一个男丁
  rationale: 原文是粗俗的男性指称习语；正文用“男丁”清楚传达所指，并在脚注保留其字面形象。
- source_word: וְגֹאֲלָיו
  choice: 他的亲族
  rationale: גֹּאֵל 指负有赎回产业、救助或报血仇等家族责任的近亲；正文用较宽泛的“亲族”，不把具体责任限定为其中一种。
- source_word: וְרֵעֵהוּ
  choice: 朋友
  rationale: רֵעַ 可指朋友、同伴或关系密切者；“朋友”是最直接且不额外限定其政治身份的译法。
theological_decisions:
- issue: גֹּאֵל 在本节中的具体职能
  choice: 正文译作“亲族”，脚注说明其可能承担赎回、救助或报血仇等义务
  alternative: “报仇者”或“赎业至亲”
  rationale: 原词强调具有家族义务的近亲，但本节没有说明具体是哪一种义务；采用宽泛译法以保留原文的多义性，避免把语境限定为报仇或赎业。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“一作王，刚坐上王位”突出事件紧接登基发生；“男丁”避免在正文中直译粗俗习语，同时由脚注保存原文特色。所有脚注标记均置于相应词语之后。
