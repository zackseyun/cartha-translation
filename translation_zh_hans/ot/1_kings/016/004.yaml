base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/004.yaml
  text: Whoever belonging to Baasha dies in the city[a], the dogs will eat; and whoever belonging to him dies in the field[b], the birds of the heavens will eat.
translation:
  language: zh_hans
  text: 凡属巴沙的人，死在城里的，必被狗吃掉；死在田野的，必被天上的飞鸟吃掉。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “天上的飞鸟”也可译作“空中的飞鸟”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמֵּת לְבַעְשָׁא
  choice: 凡属巴沙的人，死在……的
  rationale: 单数分词在这里具有泛指作用；לְ 表示归属或关联。译文用“凡属巴沙的人”自然表达所指，却不将其明确限定为“家族”或“王朝”。
- source_word: בָּעִיר
  choice: 在城里
  rationale: בְּ 是地点介词；“城里”与后文“田野”形成自然对照。
- source_word: יֹאכְלוּ הַכְּלָבִים
  choice: 必被狗吃掉
  rationale: אָכַל 的基本义是“吃”；按汉语语序改用被动式，清楚表达尸体遭狗吞食的含义，并保留预言语气。
- source_word: וְהַמֵּת לוֹ
  choice: 死在……的
  rationale: לוֹ 仍指巴沙，且与前句形成平行。中文第二分句承前省略“凡属巴沙的人”，避免生硬重复，同时不改变指称。
- source_word: בַּשָּׂדֶה
  choice: 在田野
  rationale: שָׂדֶה 可指田地或城外旷野；“田野”保留其宽泛空间意义及与城市的对照。
- source_word: עוֹף הַשָּׁמָיִם
  choice: 天上的飞鸟
  rationale: עוֹף 是集合名词，可指飞禽；“天上的飞鸟”是自然且庄重的圣经汉语表达，也保留 שָׁמַיִם 的空间意象。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以“凡……的”表现希伯来语泛指分词，用两个地点分句保持原文平行结构；未将归属巴沙者过度解释为家族、臣仆或王朝。
