  text: וְ/יֶ֛תֶר דִּבְרֵ֥י אֵלָ֖ה וְ/כָל אֲשֶׁ֣ר עָשָׂ֑ה הֲ/לֽוֹא הֵ֣ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יִשְׂרָאֵֽל־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/014.yaml
  text: The rest of the acts of Elah[a], and all that he did—are they not written in the Book of the Chronicles of the Kings of Israel?
translation:
  language: zh_hans
  text: 以拉其余的事迹，以及他所做的一切，岂不都记载在《以色列诸王记》[a]中吗？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：《以色列诸王年鉴》。
    reason: “דִּבְרֵי הַיָּמִים”可指按年代编录的纪事或年鉴；“年鉴”更明确突出其档案性质。
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי אֵלָה
  choice: 以拉其余的事迹
  rationale: יֶתֶר意为“其余、剩下的”；דִּבְרֵי在王朝纪事的固定表达中指君王的事迹，而非仅指言语。句首וְ在此承接上下文，现代汉语无须机械译作“并且”。
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: 以及他所做的一切
  rationale: 保留כָל的周全含义，并以自然汉语表达עָשָׂה宽泛的“做”。
- source_word: הֲלוֹא הֵם כְּתוּבִים
  choice: 不都记在……吗
  rationale: הֲלוֹא引出预期肯定回答的反问；“不都……吗”自然保留这一语气。כְּתוּבִים直指书面记载，译作“记在”。
- source_word: עַל סֵפֶר
  choice: 记在《……》上
  rationale: עַל字面为“在……之上”，在文献记录语境中，汉语惯用“记在……上”。סֵפֶר在此指特定文献。
- source_word: דִּבְרֵי הַיָּמִים לְמַלְכֵי יִשְׂרָאֵל
  choice: 《以色列诸王记》
  rationale: דִּבְרֵי הַיָּמִים在此指按时日记录的官方纪事；“诸王记”简洁、庄重，也符合反复出现的王朝档案书名表达。לְ表示这部记录与以色列诸王有关。
theological_decisions:
- issue: 该文献是否等同于现存的圣经《历代志》
  choice: 采用《以色列诸王记》这一中性书名，不作等同认定
  alternative: 译成可能使读者联想到圣经《历代志》的名称
  rationale: 原文只指一部关于以色列诸王的纪事文献，不能据此断定它就是现存的圣经《历代志》；译文应避免加入这种认定。
translation_notes:
  register: 采用现代、庄重而易懂的史书语体。保留原文的反问句式，并将脚注标记放在其实际说明的文献名称之后。
