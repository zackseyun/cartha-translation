  yaml_path: translation/ot/1_kings/016/008.yaml
  text: In the twenty-sixth year of Asa king of Judah, Elah son of Baasha became king over Israel in Tirzah for two years.
translation:
  language: zh_hans
  text: 犹大王亚撒二十六年，巴沙的儿子以拉在得撒登基，统治以色列，共两年。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּשְׁנַת עֶשְׂרִים וָשֵׁשׁ שָׁנָה
  choice: 二十六年
  rationale: 这是希伯来语常见的君王纪年格式；用“二十六年”自然、准确地表达在位年份。
- source_word: לְאָסָא מֶלֶךְ יְהוּדָה
  choice: 犹大王亚撒
  rationale: 介词לְ在此标示所参照的君王在位年；“犹大王亚撒二十六年”符合现代汉语纪年表达。
- source_word: מָלַךְ
  choice: 登基，统治
  rationale: 在登基记载中，该动词既说明以拉开始作王，也统摄随后所述的两年王期。汉语用“登基，统治……共两年”清楚区分即位地点与统治对象、时长。
- source_word: אֵלָה
  choice: 以拉
  rationale: 按现代中文圣经人名的通行译法音译。
- source_word: בֶן בַּעְשָׁא
  choice: 巴沙的儿子
  rationale: 直接表达希伯来语父子关系结构。
- source_word: עַל יִשְׂרָאֵל
  choice: 统治以色列
  rationale: עַל与“作王”类动词连用，表示统治的对象；不额外加入原文没有的“国”。
- source_word: בְּתִרְצָה
  choice: 在得撒
  rationale: 介词בְּ在此表示地点；“在得撒”保留原文对王室所在地的说明。
- source_word: שְׁנָתָיִם
  choice: 共两年
  rationale: 双数形式明确表示两年；“共两年”自然地表达王期总长。
