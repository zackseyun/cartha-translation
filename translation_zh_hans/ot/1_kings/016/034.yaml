  text: בְּ/יָמָ֞י/ו בָּנָ֥ה חִיאֵ֛ל בֵּ֥ית הָאֱלִ֖י אֶת יְרִיחֹ֑ה בַּ/אֲבִירָ֨ם בְּכֹר֜/וֹ יִסְּדָ֗/הּ ו/ב/שגיב צְעִיר/וֹ֙ הִצִּ֣יב דְּלָתֶ֔י/הָ כִּ/דְבַ֣ר יְהוָ֔ה אֲשֶׁ֣ר דִּבֶּ֔ר בְּ/יַ֖ד יְהוֹשֻׁ֥עַ בִּן נֽוּן־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/034.yaml
  text: In his days Hiel of Bethel rebuilt Jericho[a]. At the cost of Abiram his firstborn he laid its foundation, and at the cost of Segub his youngest he set up its gates[b], according to the word of Yahweh that he had spoken through Joshua son of Nun.
translation:
  language: zh_hans
  text: 亚哈在位期间，伯特利人希伊勒重建了耶利哥[a]。他以长子亚比兰为代价奠定根基，又以幼子西割为代价安设城门[b]；这正应验了耶和华借嫩的儿子约书亚所说的话。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “重建”直译为“建造”；这里所建的是先前已被毁的耶利哥。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“在/以他长子亚比兰……又在/以他幼子西割”。这里呼应约书亚记6:26，通常理解为重建耶利哥是以失去这两个儿子为代价。
    reason: alternative_reading
lexical_decisions:
- source_word: בְּיָמָיו
  choice: 亚哈在位期间
  rationale: 这是回指上文君王亚哈的时间用语；明确所指可避免中文代词含混，并自然表达其统治时期。
- source_word: בָּנָה
  choice: 重建
  rationale: 动词字面为“建造”，但耶利哥此前已被毁；“重建”准确传达语境含义，脚注保留直译。
- source_word: חִיאֵל בֵּית הָאֱלִי
  choice: 伯特利人希伊勒
  rationale: 该称谓表示来自或隶属伯特利；“伯特利人”简洁自然。
- source_word: בַּאֲבִירָם בְּכֹרוֹ
  choice: 以长子亚比兰为代价
  rationale: 介词短语呼应约书亚记6:26的咒诅；此译表达建城以丧失其子为代价，同时不补入死亡方式等原文未明说的细节。
- source_word: יִסְּדָהּ
  choice: 奠立城基
  rationale: יסד在建城语境中指奠基；中文以“城基”明确阴性代词所指为耶利哥。
- source_word: וּבִשְׂגוּב צְעִירוֹ
  choice: 又以幼子西割为代价
  rationale: 与前一介词短语平行；צעיר在家庭排行语境中表示最年幼的儿子。
- source_word: הִצִּיב דְּלָתֶיהָ
  choice: 安设城门
  rationale: דלת字面可指门扇，在城市语境中指城门；“安设”自然表达建造工程的最后阶段。
- source_word: כִּדְבַר יְהוָה
  choice: 正如耶和华……所说的话
  rationale: 传达事件依照耶和华先前话语成就的公式，同时保留神名。
- source_word: אֲשֶׁר דִּבֶּר בְּיַד
  choice: 借……所说
  rationale: ביד是表达中介或代理的惯用语；“借”在现代中文圣经语体中庄重且易懂。
- source_word: יְהוֹשֻׁעַ בִּן נוּן
  choice: 嫩的儿子约书亚
  rationale: 按现代中文自然语序表达父子称谓，并采用通行专名译法。
theological_decisions:
- issue: 希伊勒两子与咒诅应验之间的关系
  choice: 译为重建分别“以”长子和幼子“为代价”，表明两子的丧失与奠基、立门相连
  alternative: 较字面译作“在他长子亚比兰身上……在他幼子西割身上”，不明说损失或死亡
  rationale: 经文明显呼应约书亚记6:26，最自然的理解是建城过程中咒诅应验、两子丧生；但正文不添加死因、献祭或具体过程，脚注也保留介词的字面形式与解释空间。
translation_notes:
  register: 采用现代、庄重而易懂的叙事文体。以“亚哈在位期间”明示上文所指；专名采用简体中文圣经常用译名。正文保持紧凑，脚注交代“建造”的字面义及两个介词短语的形式与咒诅背景。
