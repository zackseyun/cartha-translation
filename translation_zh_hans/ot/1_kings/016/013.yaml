  text: אֶ֚ל כָּל חַטֹּ֣אות בַּעְשָׁ֔א וְ/חַטֹּ֖אות אֵלָ֣ה בְנ֑/וֹ אֲשֶׁ֣ר חָטְא֗וּ וַ/אֲשֶׁ֤ר הֶחֱטִ֨יאוּ֙ אֶת יִשְׂרָאֵ֔ל לְ/הַכְעִ֗יס אֶת יְהוָ֛ה אֱלֹהֵ֥י יִשְׂרָאֵ֖ל בְּ/הַבְלֵי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/013.yaml
  text: because of all the sins of Baasha and the sins of Elah his son[a], which they committed and by which they caused Israel to sin, provoking Yahweh, the God of Israel, with their idols.
translation:
  language: zh_hans
  text: 这一切都是因着巴沙所犯的一切罪，以及他儿子以拉所犯的罪：他们犯罪，又使以色列犯罪，以他们的虚无之物[a]惹耶和华、以色列的上帝发怒。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “虚无之物”在这里指偶像；原词也可译作“虚妄之物”或“毫无价值之物”。
    reason: 说明原词的字面意象及其在偶像崇拜语境中的具体所指。
lexical_decisions:
- source_word: אֶל
  choice: 这是因
  rationale: 本节承接上文的审判宣告，介词在此说明原因；用“这是因”既体现因果关系，也使作为独立经节的中文较为完整。
- source_word: כָּל חַטֹּאות בַּעְשָׁא וְחַטֹּאות אֵלָה בְנוֹ
  choice: 巴沙所犯的一切罪，以及他儿子以拉所犯的罪
  rationale: 保留“一切”的全面指控，并按现代汉语自然表达领属关系。
- source_word: אֲשֶׁר חָטְאוּ
  choice: 他们自己犯罪
  rationale: 关系从句回指巴沙和以拉；加入“自己”与下句“使以色列人犯罪”形成清楚对照，而未增加新的命题。
- source_word: וַאֲשֶׁר הֶחֱטִיאוּ אֶת יִשְׂרָאֵל
  choice: 又使以色列人犯罪
  rationale: 准确表达חטא使役式的含义。
- source_word: לְהַכְעִיס
  choice: 惹……发怒
  rationale: 体现该不定式所表达的结果或目的，在现代汉语中自然清楚。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经语境中广为人知的专名形式呈现四字神名，而不以普通称号替代。
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: 以色列的上帝
  rationale: 直接呈现原文的领属结构，说明被惹怒者的身份。
- source_word: בְּהַבְלֵיהֶם
  choice: 以他们虚无之物
  rationale: הֶבֶל本义涉及气息、虚空、虚妄，此处复数在偶像崇拜语境中以贬义指偶像；正文保留原文的修辞张力，脚注说明具体所指。
theological_decisions:
- issue: 四字神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用上帝的专名。中文正文采用读者熟悉且明确为专名的“耶和华”，同时不改译为“主”这一称号。
- issue: הבלים在偶像语境中的表达
  choice: 虚无之物
  alternative: 偶像
  rationale: 直译保留原文将偶像斥为虚空、毫无价值之物的论战性隐喻；脚注明确其在本段语境中所指，避免读者误解。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“他们自己犯罪，又使以色列人犯罪”突出原文两层指控。“耶和华—以色列的上帝”以破折号标明同位关系。脚注标记紧随其所解释的“虚无之物”。
