  text: וַ/יַּשְׁמֵ֣ד זִמְרִ֔י אֵ֖ת כָּל בֵּ֣ית בַּעְשָׁ֑א כִּ/דְבַ֤ר יְהוָה֙ אֲשֶׁ֣ר דִּבֶּ֣ר אֶל בַּעְשָׁ֔א בְּ/יַ֖ד יֵה֥וּא הַ/נָּבִֽיא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/012.yaml
  text: So Zimri destroyed all the house of Baasha[b][a], according to the word of Yahweh that he had spoken against Baasha through Jehu the prophet.
translation:
  language: zh_hans
  text: 于是，心利灭尽了巴沙的全家[a]，正如雅威借先知耶户向巴沙所说的话[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “巴沙的全家”指巴沙的王室或王朝，不只是与他同住的一家人。
    reason: cultural_note
  - marker: b
    text: 或译：“针对巴沙所说的话。”希伯来语介词字面常作“对、向”；本处所指的是针对巴沙的审判宣告。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁמֵד
  choice: 灭尽了
  rationale: 使役形表达使之毁灭、彻底除灭；“灭尽”既保留彻底性，也符合现代汉语历史叙事的庄重语体。
- source_word: כָּל בֵּית בַּעְשָׁא
  choice: 巴沙全家
  rationale: “家”保留希伯来语“בית”的王室、家族或王朝含义；“全”对应“כָּל”。脚注说明这里不限于同住的家庭成员。
- source_word: כִּדְבַר
  choice: 正如……的话
  rationale: 该结构表示事件与先前宣告相符并使其应验；“正如”在汉语中自然表达这种符合关系。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以常见的现代汉语音译呈现四字神名，不用称号替代专名。
- source_word: אֲשֶׁר דִּבֶּר
  choice: 所说……的话
  rationale: 以汉语关系结构自然表达雅威先前已经说出的宣告，不必用额外时态标记。
- source_word: אֶל בַּעְשָׁא
  choice: 攻击巴沙
  rationale: 介词“אֶל”字面通常为“向、对”，但此处引出针对巴沙的审判宣告；“攻击”表达语境中的不利指向，同时以脚注保留较直译的可能。
- source_word: בְּיַד יֵהוּא הַנָּבִיא
  choice: 借先知耶户
  rationale: “借……之手”是表达媒介或代理的希伯来语习语；“借先知耶户”是自然现代汉语，并保留耶户作为传言者的角色。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名，因此正文采用音译“雅威”，以专名而非称号呈现。
- issue: אֶל בַּעְשָׁא 在审判预言中的语力
  choice: 攻击巴沙
  alternative: 对巴沙
  rationale: “攻击”清楚传达上下文中审判之言的不利性质；脚注保留介词更字面的译法，避免掩盖原文可能的表达幅度。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“于是”承接前文叙事；“灭尽”体现动作的彻底性。句式尽量贴近原文的实现预言结构，同时避免生硬照译“借……的手”。
