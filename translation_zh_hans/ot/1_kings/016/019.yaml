source:
  edition: WLC
  text: עַל חטאת/ו אֲשֶׁ֣ר חָטָ֔א לַ/עֲשׂ֥וֹת הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה לָ/לֶ֨כֶת֙ בְּ/דֶ֣רֶךְ יָרָבְעָ֔ם וּ/בְ/חַטָּאת/וֹ֙ אֲשֶׁ֣ר עָשָׂ֔ה לְ/הַחֲטִ֖יא אֶת יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/019.yaml
  text: because of his sins that he committed[a], doing what was evil in the eyes of Yahweh, walking in the way of Jeroboam and in the sin that he caused Israel to commit.
translation:
  language: zh_hans
  text: 因为他的罪[a]：他做雅威眼中看为恶的事，走耶罗波安的道路，并随从他所犯、使以色列犯罪的罪。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译近似“因他的罪，就是他所犯的罪”。
    reason: 说明原文以同根名词和动词构成的表达；正文以自然汉语表达。
lexical_decisions:
- source_word: עַל
  choice: 因为
  rationale: 此处引出前文惩罚或死亡的原因；“因为”自然表达其因果作用。
- source_word: חטאתו אֲשֶׁר חָטָא
  choice: 他所犯的罪
  rationale: 希伯来文采用同根结构，直译近似“他所犯下的他的罪”；汉语用“他所犯的罪”既准确又自然，并保留集合性单数“罪”。
- source_word: לַעֲשׂוֹת הָרַע בְּעֵינֵי יְהוָה
  choice: 行雅威眼中看为恶的事
  rationale: 保留“在……眼中”的评价性隐喻，并把不定式理解为说明其罪的具体内容。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见音译呈现四字神名，保留其作为专名的性质，而不以称号替代。
- source_word: לָלֶכֶת בְּדֶרֶךְ יָרָבְעָם
  choice: 走耶罗波安的道路
  rationale: 保留希伯来文以“行走”和“道路”描述生活方式与行为模式的隐喻。
- source_word: וּבְחַטָּאתוֹ אֲשֶׁר עָשָׂה לְהַחֲטִיא אֶת יִשְׂרָאֵל
  choice: 并犯了那使以色列犯罪的罪
  rationale: 将“他所行的罪”与后面的使役式“使以色列犯罪”连为完整汉语表达，保留其使役意义，同时避免悬垂结构。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；采用“雅威”保留专名性质，不以称号代替，也不把较晚形成的混合读音带入正文。
- issue: 使以色列犯罪的责任表达
  choice: 使以色列犯罪
  alternative: 引诱以色列犯罪；使以色列陷在罪中
  rationale: 原文 חטא 的使役式明确表达导致或促使他人犯罪，但未具体说明所用方式；因此不增添“引诱”等原文没有明说的含义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。保留“走……的道路”和“在……眼中”等清楚可懂的希伯来意象；整节在原语境中承接前文，故以“因为”起句。
