base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/024.yaml
  text: He bought the hill of Samaria from Shemer for two talents of silver[a], built on the hill, and called the name of the city that he built Samaria, after the name of Shemer[b], the owner of the hill.
translation:
  language: zh_hans
  text: 他用两他连得银子[a]从示麦手中买下撒马利亚山，在山上建造；又照着那山的主人示麦的名字，给所建的城起名叫撒马利亚[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “他连得”是古代按重量计算贵金属的大单位；原文为“两他连得银子”。
    reason: cultural_note
  - marker: b
    text: “撒马利亚”的希伯来语读音近于“朔姆龙”，与“示麦”的名字相关；本节说明这城是按那山的主人示麦之名命名的。
    reason: name_wordplay
lexical_decisions:
- source_word: וַיִּקֶן
  choice: 买下
  rationale: קנה在此指付出价款取得地产；“买下”自然表达交易及所有权转移。
- source_word: הָהָר
  choice: 山
  rationale: הַר可指山或山丘；中文地名和叙事中译作“山”简洁自然，又不必过度限定地形规模。
- source_word: שֹׁמְרוֹן
  choice: 撒马利亚
  rationale: 采用现代中文圣经传统中通行的地名译法；本节先指撒马利亚山，后指建成的城。
- source_word: מֵאֵת שֶׁמֶר
  choice: 从示麦手中
  rationale: 介词结构表示购买对象或取得来源；“从……手中”符合现代汉语地产交易语境。
- source_word: בְּכִכְּרַיִם כָּסֶף
  choice: 用两他连得银子
  rationale: כִּכָּר是按重量计算贵金属的大单位，双数形式表示两个；保留古代单位，避免换算造成虚假精确。
- source_word: וַיִּבֶן אֶת הָהָר
  choice: 在山上建造
  rationale: 希伯来语直译为“建造那山”，实际指在山上进行建设；不擅自补入“城邑”或“设防”。
- source_word: וַיִּקְרָא אֶת שֵׁם הָעִיר
  choice: 给所建的城起名叫
  rationale: 将希伯来语“称那城的名”转换为自然、庄重的现代汉语命名表达。
- source_word: עַל שֵׁם שֶׁמֶר
  choice: 照着……示麦的名字
  rationale: 明确保留该城按示麦之名命名的关系，而不将其简化为仅有名称相似。
- source_word: אֲדֹנֵי הָהָר
  choice: 山主
  rationale: אדון在这里表示土地所有者；“山主”简洁保留其产权含义，不带神学上的“主”之意。
theological_decisions: []
