  register: 采用现代、庄重而易懂的叙事文体。保留古代重量单位并用脚注解释；“在山上建造”维持原文未明说具体建筑内容的含蓄；人名“示麦”和地名“撒马利亚”沿用通行译名，同时以脚注呈现希伯来语中的命名关联。
