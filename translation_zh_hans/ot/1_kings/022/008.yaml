base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/008.yaml
  text: 'And the king of Israel said to Jehoshaphat[a], “There is still one more man through whom to inquire of Yahweh, but I hate him, because he does not prophesy good concerning me, but only evil: Micaiah son of Imlah.” And Jehoshaphat said, “Let not the king say so.”'
translation:
  language: zh_hans
  text: 以色列王对约沙法说：“还有一个人，可以借着他求问耶和华；但我恨他，因为他预言关于我的事，没有好事，只有坏事——就是音拉的儿子米该雅。”约沙法说：“王不要这样说。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עוֹד אִישׁ אֶחָד
  choice: 还有一个人
  rationale: 保留עוֹד的“还、尚有”之意，并以自然汉语表达另有一人的增添意味。
- source_word: לִדְרֹשׁ אֶת־יְהוָה מֵאֹתוֹ
  choice: 我们可以借着他求问耶和华
  rationale: דָּרַשׁ在先知语境中指“求问”，מֵאֹתוֹ表明以此人为媒介；补出“我们可以”使汉语句法完整，但不改变原意。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经传统中对四字神名的通行音译，保留其专名性质。
- source_word: שְׂנֵאתִיו
  choice: 我恨他
  rationale: 直译其明确而持续的敌对态度，不弱化为“不喜欢”。
- source_word: לֹא יִתְנַבֵּא עָלַי טוֹב כִּי אִם רָע
  choice: 他从不预言关于我的好事，只预言坏事
  rationale: 将否定加כִּי אִם的排他结构自然译为“从不……只……”。רָע保留宽泛的“坏事”，不擅自限定为灾祸或道德邪恶。
- source_word: מִיכָיְהוּ בֶּן־יִמְלָה
  choice: 音拉的儿子米该雅
  rationale: 采用中文圣经中通行的人名译法，并按自然汉语表达父子关系。
- source_word: אַל יֹאמַר הַמֶּלֶךְ כֵּן
  choice: 王不要这样说
  rationale: 保留אַל加祈愿式所表达的劝止，也体现约沙法对王说话时的礼貌与宫廷语气。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。中文正文采用读者最熟悉且具有专名功能的传统音译“耶和华”，不以“主”替代，从而保留圣约神名的指向。
- issue: רָע在亚哈抱怨中的含义
  choice: 坏事
  alternative: 灾祸
  rationale: רָע可指恶事、不幸或灾祸；此处是亚哈对预言内容的概括。译作“坏事”保留语义宽度，避免预先断定仅指具体灾难。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“王不要这样说”保留尊敬而克制的宫廷口吻；人名使用简体中文圣经读者熟悉的形式。原英文脚注标记位置与其脚注内容似不相符，且中文正文已自然表达“借着他求问”，因此不设脚注。
