  to: 以色列王对约沙法说：“还有一个人，可以借着他求问耶和华；但我恨他，因为他预言关于我的事，没有好事，只有坏事——就是音拉的儿子米该雅。”约沙法说：“王不要这样说。”
  rationale: 删去未明示的“我们”，并以“他预言关于我的事，没有好事，只有坏事”对应“他不预言关于我的好事，只预言坏事”，既保留原文的好／坏对照和亚哈的抱怨语气，也避免将语义强化为绝对的“从不”。不需脚注：原英文脚注所示的“借着他”在中文正文中已明白表达。
