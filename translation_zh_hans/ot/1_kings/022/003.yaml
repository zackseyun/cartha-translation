base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/003.yaml
  text: And the king of Israel said to his servants[a], “Do you know that Ramoth-gilead belongs to us[b], yet we are doing nothing to take it from the hand of the king of Aram?”
translation:
  language: zh_hans
  text: 以色列王对臣仆说：“你们知道吗，基列的拉末是我们的；我们却没有采取行动[a]，把它从亚兰王手中夺取过来。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “没有采取行动”直译为“我们保持沉默”；这里指明知该城应当归属我们，却仍不采取行动。
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲבָדָיו
  choice: 臣仆
  rationale: 此处是王对宫廷人员或臣属说话；“臣仆”既保留“仆人”的王室用语色彩，也符合现代汉语语境，不武断限定其官职。
- source_word: הֲיְדַעְתֶּם
  choice: 你们知道吗
  rationale: 原文没有明确的否定词，故不译作“难道你们不知道吗”；问句在语境中自然带有反问和唤起共同认知的意味。
- source_word: כִּי לָנוּ רָמֹת גִּלְעָד
  choice: 基列的拉末本是我们的
  rationale: לָנוּ表达归属或领土主张；加入“本”自然传达该城理应归属以色列的语境，但不额外断定这一主张的法理依据。
- source_word: רָמֹת גִּלְעָד
  choice: 基列的拉末
  rationale: 采用中文圣经地名的通行形式，并以“的”清楚表达复合地名关系。
- source_word: מַחְשִׁים
  choice: 毫无行动
  rationale: 该分词字面涉及沉默，在此与未去夺回城邑相连，表达消极不作为；“毫无行动”自然传达责备语气。
- source_word: מִקַּחַת אֹתָהּ
  choice: 不……把它夺回来
  rationale: 介词מִן与“沉默/不行动”结合，指出被搁置的行动。按领土先属“我们”的陈述，“夺回来”比单纯“夺取”更贴合语境。
- source_word: מִיַּד
  choice: 从……手中
  rationale: 保留希伯来语表示控制权或占有权的常见身体隐喻，在现代汉语中同样自然。
- source_word: אֲרָם
  choice: 亚兰
  rationale: 按希伯来地名音译为“亚兰”，不以较后的地缘名称“叙利亚”替代。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事体。“臣仆”保留王室语境；“毫无行动”呈现原文“沉默”在本句中的习语功能。英文咨询层的脚注标记与内容存在错配：其[a]正文标在“servants”后，注释却解释מַחְשִׁים；其[b]正文标在归属语后，注释却解释Aram。本稿按原文相关词语重新安置并整合脚注，只保留确有助于理解的词义说明。
