  source_fidelity: 译文准确保留亚兰王、三十二名战车长、禁令及唯一攻击以色列王的命令。“小的和大的”是指各等身份的人，宜在正文中以“任何人，无论尊卑”清楚而自然地表达，并以脚注说明其字面形式。
