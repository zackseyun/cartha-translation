  yaml_path: translation/ot/1_kings/022/031.yaml
  text: The king of Aram had commanded the thirty-two chariot commanders who belonged to him[a], saying, “Do not fight with either small or great[c][b], but only with the king of Israel alone.”
translation:
  language: zh_hans
  text: 亚兰王曾吩咐他手下的三十二名战车长说：“不要同任何人交战，无论尊卑[a]；只攻击以色列王一人。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “尊卑”直译为“小的和大的”，指任何身份或地位的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמֶלֶךְ אֲרָם
  choice: 亚兰王
  rationale: 保留原文地名“亚兰”；句首连接词在本节中文叙事中不必机械译出。
- source_word: צִוָּה
  choice: 曾吩咐
  rationale: 表达发令之意，并以“曾”体现相对于随后战事的背景动作。
- source_word: שָׂרֵי הָרֶכֶב אֲשֶׁר לוֹ
  choice: 他手下的战车长
  rationale: שָׂרֵי 指军事首领，הָרֶכֶב 指战车部队；“他手下的”自然表达 אֲשֶׁר לוֹ 的所属关系。
- source_word: שְׁלֹשִׁים וּשְׁנַיִם
  choice: 三十二名
  rationale: 准确翻译基数，并按现代汉语为人员加量词。
- source_word: לֹא תִּלָּחֲמוּ אֶת קָטֹן וְאֶת גָּדוֹל
  choice: 无论地位低的还是地位高的，你们都不要交战
  rationale: “小与大”在此指身份或地位不同的人；显明其惯用含义，同时保留两极并举的表达。
- source_word: כִּי אִם אֶת מֶלֶךְ יִשְׂרָאֵל לְבַדּוֹ
  choice: 只可攻击以色列王一人
  rationale: כִּי אִם 与 לְבַדּוֹ 共同强化唯一目标；“攻击”在军事语境中明确表达敌对交战。
