  text: So the king died and was brought to Samaria[a], and they buried the king in Samaria.
translation:
  language: zh_hans
  text: 王就死了。有人把他送到撒马利亚[a]；他们把王葬在撒马利亚。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译：“王死了，他来到撒马利亚。”按上下文，意思是王死后，遗体被送到撒马利亚。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת הַמֶּלֶךְ
  choice: 王就死了
  rationale: וַיָּמָת是מות的Qal叙事式，表示事件次第；“就死了”自然呈现叙事推进。הַמֶּלֶךְ仍译“王”，不以专名“亚哈”取代原文称谓。
- source_word: וַיָּבֹא שֹׁמְרוֹן
  choice: 有人把他送回撒马利亚
  rationale: 原文形式上是“他来到撒马利亚”，但王已经死亡，语境所指是其遗体被运抵撒马利亚。中文用不定施事的主动句表达最自然；“回”也符合撒马利亚是王城这一语境。脚注保留原文形式及译文所作的语境性明示。
- source_word: שֹׁמְרוֹן
  choice: 撒马利亚
  rationale: 采用该地名在现代中文圣经传统中的通行译名。
- source_word: וַיִּקְבְּרוּ
  choice: 将……葬
  rationale: 第三人称复数、施事未明；中文承接前句，以不明说具体施事的“将……葬”自然表达。
- source_word: אֶת הַמֶּלֶךְ
  choice: 王
  rationale: 保留希伯来文重复“王”的措辞，而不完全改作代词。
- source_word: בְּשֹׁמְרוֹן
  choice: 在那里
  rationale: 所指仍是前句的撒马利亚；中文用“在那里”避免同一句中地名生硬重复，同时准确保留安葬地点。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而清楚的叙事语言。“有人把他送回”明示语境中隐含的遗体运输，但以脚注保存希伯来文“他来到”的形式；正文中的[a]与脚注对应。
