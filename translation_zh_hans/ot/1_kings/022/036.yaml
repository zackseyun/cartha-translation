base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/036.yaml
  text: And a cry passed through the camp at sunset[a], saying, “Each man to his city[b], and each man to his land!”
translation:
  language: zh_hans
  text: 日落时，一阵喊声传遍营中[a]：“各人归自己的城，各人归自己的土地[b]！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “喊声”也可译作“呼喊声”“高呼声”或“宣告声”。希伯来语 רִנָּה 常指响亮的呼声；这里指传遍全营的通告。
    reason: lexical_alternative
  - marker: b
    text: 直译：“各人到自己的城，各人到自己的地。”这是战后遣散军兵、让他们各归本处的固定说法。
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעֲבֹר
  choice: 传遍了
  rationale: 该动词本义为“经过、穿过”；与“营中”和呼喊声搭配时，译作“传遍了”自然地表达声音或消息在全营传播。
- source_word: הָרִנָּה
  choice: 呼喊声
  rationale: רִנָּה可指高声呼喊、响亮的喊声；此处是亚哈死后传遍军营的撤散通告，并非欢呼，因此采用中性的“呼喊声”。
- source_word: בַּמַּחֲנֶה
  choice: 营中
  rationale: 介词字面为“在营中”，与“传遍”合用即可清楚表达呼喊遍及全营。
- source_word: כְּבֹא הַשֶּׁמֶשׁ
  choice: 日落时
  rationale: “太阳进入”是表示太阳落下的惯用语，现代汉语自然译作“日落时”。
- source_word: לֵאמֹר
  choice: （以直接引语表达）
  rationale: 该词引出呼喊的内容；汉语以冒号和直接引语自然承载其功能，无须机械译出“说”。
- source_word: אִישׁ ... וְאִישׁ
  choice: 各人……各人
  rationale: 重复保留希伯来语的逐一分配语气和宣告式节奏；上下文已明确对象为军中人员，不必增添原文没有的性别限定。
- source_word: אֶל עִירוֹ
  choice: 回自己的城
  rationale: עִיר通常指城或城邑；“回”符合战后解散、各归本处的语境。
- source_word: וְאִישׁ אֶל אַרְצוֹ
  choice: 各人回自己的故土
  rationale: אֶרֶץ在此指各人所属的地域或家乡土地；“故土”比“国家”更贴近其具体归属意味，并与“自己的城”形成自然平行。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“传遍了呼喊声”保留声音在营中传播的形象；直接引语保持原文简短有力的军中通告节奏。
