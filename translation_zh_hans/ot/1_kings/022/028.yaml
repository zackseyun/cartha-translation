base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/028.yaml
  text: And Micaiah said[a], “If you indeed return in peace, Yahweh has not spoken by me.” And he said, “Hear[b], all you peoples!”
translation:
  language: zh_hans
  text: 米该雅说：“如果你果真平安归来，雅威就没有借着我说话[a]。”他又说：“万民哪，你们都要听[b]！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译为“雅威没有通过我说话”。这里指雅威以米该雅为传话的先知。
    reason: lexical_alternative
  - marker: b
    text: 原文“万民”是复数，是向广泛的众民公开发出的呼召，并非只对一个群体说。
    reason: cultural_note
lexical_decisions:
- source_word: מִיכָיְהוּ
  choice: 米该雅
  rationale: 采用现代中文圣经读者熟悉的人名音译。
- source_word: אִם שׁוֹב תָּשׁוּב
  choice: 如果你果真……归来
  rationale: “不定式绝对形＋未完成式”的组合加强语气；“果真”自然地保留强调性的条件含义。
- source_word: בְּשָׁלוֹם
  choice: 平安
  rationale: 此处指安然无恙地回来；保留希伯来语“平安”的惯用表达，也符合上下文。
- source_word: לֹא דִבֶּר יְהוָה בִּי
  choice: 雅威就没有借着我说话
  rationale: 介词短语 בִּי 在先知语境中表示说话者以先知为传话的媒介；“借着我”既自然，又保留这一工具性含义。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以常见的现代汉语音译呈现四字神名，不以称号替代专名。
- source_word: שִׁמְעוּ
  choice: 你们都要听
  rationale: 命令式要求众人留心听；“要听”保留公开宣告和先知呼召的语气。
- source_word: עַמִּים כֻּלָּם
  choice: 万民哪，你们都
  rationale: עַמִּים 是复数，כֻּלָּם 表示全体；“万民哪，你们都”兼顾广泛的复数对象和呼语语气。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名，因此以专名音译，避免用称号代替。
- issue: 末句 וַיֹּאמֶר 的说话者
  choice: 仍由米该雅说话，以“他又说”承接
  alternative: 视为编者插语或另一说话者的话
  rationale: 原文没有明示更换说话者，最直接的句法理解是米该雅继续发言；译文不作未经文本支持的重新归属。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“果真”保留原文加强语气的条件结构；“万民哪”保留先知公开宣告的呼语色彩。
