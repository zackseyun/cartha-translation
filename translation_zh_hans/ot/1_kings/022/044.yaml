base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/044.yaml
  text: However[a], the high places were not removed[b]; the people still were sacrificing and burning incense on the high places.
translation:
  language: zh_hans
  text: 只是，丘坛[a]没有被废除；百姓仍在丘坛献祭、烧香[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “丘坛”指地方性的祭祀场所，通常设在高处；也可理解为“祭祀场所”。
    reason: lexical_alternative
  - marker: b
    text: 本节没有说明这些祭祀行为是献给耶和华但地点不合规定，还是属于更广泛的偶像崇拜。
    reason: cultural_note
lexical_decisions:
- source_word: אַךְ
  choice: 只是
  rationale: 在上下文中表示与前面对君王的正面评价形成转折；“只是”自然、简洁，并保留其限制兼转折的语气。
- source_word: הַבָּמוֹת
  choice: 丘坛
  rationale: בָּמוֹת指地方性的祭祀场所，常设于高处；“丘坛”是中文圣经语境中简明且较为确切的传统译法，又不直接判定敬拜对象。
- source_word: לֹא סָרוּ
  choice: 还没有废去
  rationale: 以“丘坛”为主语时，סור在此表示这些祭祀场所未被除掉。“废去”符合中文表达，并传达其继续存在的含义。
- source_word: עוֹד
  choice: 仍
  rationale: 表明这种祭祀行为持续未改；“仍”简洁地保留延续意味。
- source_word: הָעָם
  choice: 百姓
  rationale: 自然表达对当地民众的集合性称呼。
- source_word: מְזַבְּחִים
  choice: 在献祭
  rationale: 分词表达持续或惯常的行动；与“仍在”连用，可在现代汉语中清楚呈现这种持续性。
- source_word: וּמְקַטְּרִים
  choice: 烧香
  rationale: קטר在祭祀语境中常指焚香或使祭物冒烟；此处采用惯用而简明的“烧香”，同时不增添原文未明说的敬拜对象。
- source_word: בַּבָּמוֹת
  choice: 在那里
  rationale: 所指明确承接前文的“丘坛”，用代词避免中文中生硬重复，同时完整保留地点信息。
theological_decisions:
- issue: 丘坛祭祀的对象和性质
  choice: 仅描述百姓在丘坛献祭、烧香，不说明祭祀是献给耶和华还是其他神明。
  alternative: 明确译为百姓在未经许可之处敬拜耶和华，或明确译为偶像崇拜。
  rationale: 希伯来文本批评丘坛仍然存在，却没有在本节指明祭祀对象。正文保留这一神学张力，不把可能的历史解释写入译文。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“只是”承接上下文的转折；“仍在那里献祭、烧香”自然呈现两个希伯来分词所表达的持续或惯常行为。脚注标记均置于正文相关词句之后。
