base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/030.yaml
  text: Then the king of Israel said to Jehoshaphat[a], “Disguise yourself and go into the battle, but you, put on your robes.” So the king of Israel disguised himself and went into the battle.
translation:
  language: zh_hans
  text: 以色列王对约沙法说：“我要改装上阵[a]，你却要穿着自己的衣服。”于是，以色列王改了装，上阵去了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “我要改装上阵”所对应的希伯来语形式也可理解为对约沙法的命令：“你要改装上阵。”但下文说改装的是以色列王，因此正文采用第一人称。
    reason: alternative_reading
lexical_decisions:
- source_word: הִתְחַפֵּשׂ וָבֹא
  choice: 我要改装上阵
  rationale: 这两个形式在此处可作表达说话者打算的用法；下文紧接着说以色列王实际改了装，因此正文采用第一人称。“改装”自然表达隐藏身份，“上阵”简洁传达进入战事。
- source_word: וְאַתָּה
  choice: 你却要
  rationale: 独立人称代词带出以色列王与约沙法之间的鲜明对比；“却”在现代汉语中自然体现这种反差。
- source_word: לְבַשׁ בְּגָדֶיךָ
  choice: 穿着自己的衣服
  rationale: בְּגָדִים本义为衣服、服装。这里不把“王服”写入正文，以免超出原文；语境仍让读者看出这与改装相对。
- source_word: וַיִּתְחַפֵּשׂ
  choice: 改了装
  rationale: 直接表达以色列王改变装束、掩饰身份的反身动作，并与前面的计划呼应。
- source_word: וַיָּבֹא בַּמִּלְחָמָה
  choice: 上阵去了
  rationale: בוא与בַמִּלְחָמָה合起来表示进入战斗；“上阵去了”是自然、庄重而易懂的现代汉语。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“改装”比“化装”更适合军事与身份掩饰的场景；“上阵”避免生硬直译“进入战争”。保留原文“自己的衣服”的宽泛说法，不擅自明确为王服。
