base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/021.yaml
  text: Then the spirit came forward and stood before Yahweh and said[a], ‘I will entice him.’ And Yahweh said to him[b], ‘By what means?’
translation:
  language: zh_hans
  text: 这时，一个灵走上前来，站在耶和华面前，说：“我会引诱他。”耶和华问他：“用什么办法？”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָרוּחַ
  choice: 那灵
  rationale: 此处有定冠词，且上下文描写天上议会中的一个特定灵体。“那灵”保留特指意味，又避免用“圣灵”所可能造成的过度认定。
- source_word: וַיֵּצֵא
  choice: 走上前来
  rationale: 该动词基本义为“出去、出来”；在天上议会的场景中，指这灵从众者中走出并上前发言。“走上前来”自然表达这一动作。
- source_word: וַיַּעֲמֹד לִפְנֵי
  choice: 站在……面前
  rationale: 直译并保留在上位者面前侍立、陈言的正式场景。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文读者熟悉的神圣名字音译，不以“主”这一称号替代原文专名。
- source_word: אֲפַתֶּנּוּ
  choice: 我去引诱他
  rationale: פתה 的加强词干在此可表示引诱、劝诱或使其受骗；“引诱”既传达促使亚哈采取致命行动之意，也不抢先把具体手段完全限定为欺骗，因为下一节才加以说明。
- source_word: בַּמָּה
  choice: 用什么办法？
  rationale: 此问句询问实施计划的方式或手段；该译法清楚、自然，并符合议事场景。
theological_decisions:
- issue: 天上议会中 הָרוּחַ 的身份
  choice: 译为“那灵”，理解为场景中的一个特定灵体，但不认定为圣灵
  alternative: “圣灵”或“一个灵”
  rationale: 定冠词支持特指，叙事也描写天军中的一位上前提议；然而上下文并未要求将其认定为圣灵。“那灵”保留这种特指与身份上的开放性。
- issue: 神许可并施行对亚哈的诱导性审判
  choice: 保留“引诱”的直接表达
  alternative: 弱化为“劝说”或明确强化为“欺骗”
  rationale: 原文让耶和华询问实施方式，并在后文揭示谎言之灵的手段。译文不淡化其中的神学张力，也不在本节提前作超出原文的解释。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“这时”衔接叙事，“走上前来”体现天上议会中从众者间出来陈言的动作；对话简洁直接。
