base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/035.yaml
  text: And the battle intensified that day[a], and the king remained standing in the chariot facing Aram, and he died in the evening[c][b]; and the blood from the wound flowed into the bottom of the chariot.
translation:
  language: zh_hans
  text: 那一天，战事越发激烈[a]。王被支撑着站在战车上，面对亚兰[b]。到了晚上，他死了；伤口流出的血淌进战车底部[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“战事加剧”；直译近于“战事上升”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“王一直站在战车上”。原文形式可能表示他被维持站立或被支撑着直立，未说明具体方式。
    reason: lexical_alternative
  - marker: c
    text: 原文直译为“战车的怀中”，指战车里面较低的部分。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּעֲלֶה הַמִּלְחָמָה
  choice: 战事越发激烈
  rationale: עלה与“战事”连用，表示战斗升级；这样译既传达其惯用含义，也符合现代汉语表达。
- source_word: מָעֳמָד
  choice: 被扶着站
  rationale: 该形式带有使役或维持站立的被动意味；结合王已经负伤的语境，“被扶着站”保留了这一层含义，但不具体断言如何支撑。
- source_word: בַּמֶּרְכָּבָה
  choice: 在战车上
  rationale: 现代汉语通常说人在战车上；这比“战车里”自然，同时不妨碍末句所说战车内部或底部积血。
- source_word: נֹכַח אֲרָם
  choice: 面对亚兰人
  rationale: נֹכַח表示面向或正对；此处אֲרָם在战争语境中以国名代指敌方军队，译作“亚兰人”更自然清楚。
- source_word: וַיָּמָת בָּעֶרֶב
  choice: 到了晚上，他就死了
  rationale: 准确表达傍晚或晚上死亡的时间关系，语言自然庄重。
- source_word: וַיִּצֶק דַּם הַמַּכָּה
  choice: 伤口流出的血淌进
  rationale: יצק本义与倾倒、流出有关；描写血液时用“淌”具体自然，“伤口流出的血”明确属格表示来源。
- source_word: חֵיק הָרָכֶב
  choice: 战车底部
  rationale: חֵיק字面为“怀中、怀里”，用于战车是形象说法，指其内侧低处或承接液体的部分；“战车底部”清晰传达具体所指。
