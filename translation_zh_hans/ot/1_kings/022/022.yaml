revisions:
- from: 他说：“我要出去，作谎言之灵[a]，在他所有先知的口中说话。”耶和华说：“你必能诱惑他，也必能成功[b]。出去，照这样做吧。”
  to: 他说：“我要出去，作在他所有先知口中的谎言之灵[a]。”耶和华说：“你必会诱惑他，也必会成功[b]。出去，照这样做。”
  rationale: 修订使中文更直接地对应原文的句法与命令语气，避免增添“说话”这一原文未明说的动词，并以“必会”表达该场景中对行动及结果的预告，而非仅表达能力。保留“谎言之灵”、明确“耶和华说”及相应脚注，未化解或改写文本本身的神学张力。
  reviewer_model: gpt-5.6-terra
