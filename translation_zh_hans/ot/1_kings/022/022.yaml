  text: וַ/יֹּ֗אמֶר אֵצֵא֙ וְ/הָיִ֨יתִי֙ ר֣וּחַ שֶׁ֔קֶר בְּ/פִ֖י כָּל נְבִיאָ֑י/ו וַ/יֹּ֗אמֶר תְּפַתֶּה֙ וְ/גַם תּוּכָ֔ל צֵ֖א וַ/עֲשֵׂה כֵֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/022.yaml
  text: And he said[a], ‘I will go out and be a lying spirit in the mouth of all his prophets.’ And he said, ‘You will entice him, and you will also prevail[b]. Go out and do so.’
translation:
  language: zh_hans
  text: 他说：“我要出去，作在他所有先知口中的谎言之灵[a]。”耶和华说：“你必会诱惑他，也必会成功[b]。出去，照这样做。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“说谎的灵”。
    reason: רוּחַ שֶׁקֶר可译为“谎言之灵”，也可表达为“说谎的灵”。
  - marker: b
    text: “诱惑”也可译作“欺骗”或“劝诱”；“成功”也可译作“得胜”或“能够做到”。
    reason: פתה可按语境指引诱、劝诱或欺骗；יכל可指有能力、能够做到或成功。
lexical_decisions:
- source_word: אֵצֵא
  choice: 我要出去
  rationale: 第一人称单数未完成式在提议语境中表达意向；“出去”自然，并与后面的命令“出去”形成呼应。
- source_word: וְהָיִיתִי
  choice: 作
  rationale: 这里表示承担某种角色；现代汉语用“作……之灵”比生硬的“成为”更符合叙事语境。
- source_word: רוּחַ שֶׁקֶר
  choice: 谎言之灵
  rationale: 保留名词“谎言/虚假”与“灵”的关系，也避免把原文含义过度限定为灵自身说谎；脚注列出更惯用的另一译法。
- source_word: בְּפִי כָּל נְבִיאָיו
  choice: 在他所有先知的口中说话
  rationale: 保留“在……口中”的希伯来语意象，并补出汉语理解所需的“说话”，表明谎言之灵借众先知发言。
- source_word: תְּפַתֶּה
  choice: 你必能诱惑他
  rationale: Piel形式可涵盖引诱、说服或欺骗；此处采用“诱惑”，保留使亚哈走向既定结局的诱导意味，宾语“他”由上下文补出。
- source_word: וְגַם תּוּכָל
  choice: 也必能成功
  rationale: יכל可指有能力、胜任或成功；“必能成功”在差遣语境中兼顾能力与预期结果，并由脚注提示另一可能表达。
- source_word: צֵא וַעֲשֵׂה כֵן
  choice: 出去，照这样做吧
  rationale: 保留“出去”与前文的词语呼应；“照这样做吧”是自然、庄重的现代汉语命令表达。
theological_decisions:
- issue: 涉及欺骗的天上对话中，神的许可与差遣如何表达
  choice: 直接呈现耶和华命令该灵出去并照所提方案行事
  alternative: 弱化为耶和华仅仅容许该灵自行行动
  rationale: 原文使用直接引语和命令式，不宜为缓解神学张力而改写成单纯许可；译文保留神的主权与受造代理者行动之间未被本文解释的张力。
- issue: 是否明确第二个“他说”的主语
  choice: 译为“耶和华说”
  alternative: 保持代词“他说”
  rationale: 本节希伯来文仅用阳性单数动词，但上文天上议会场景清楚表明回应者是耶和华；汉语连续使用“他说”容易造成指代混乱，因此按语境明示主语，不增加新的神学内容。
translation_notes:
  register: 采用现代、庄重且易懂的叙事语言。“谎言之灵”保留原文形式和歧义；“在……口中说话”兼顾希伯来语意象与汉语清晰度。所有脚注标记均已置于正文对应位置。
