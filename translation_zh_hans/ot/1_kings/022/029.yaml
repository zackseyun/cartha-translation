  text: So the king of Israel and Jehoshaphat king of Judah went up to Ramoth-gilead.
translation:
  language: zh_hans
  text: 于是，以色列王和犹大王约沙法上到基列的拉末。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַל
  choice: 上到
  rationale: עלה的基本义是“上去、上到”。这里带目的地，译作“上到”既保留希伯来的方向表达，也不额外限定为军事行动。
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: 以色列王
  rationale: 原文使用君王称号而未直呼亚哈之名；“以色列王”自然且忠实地保留这种叙事方式。
- source_word: וִיהוֹשָׁפָט
  choice: 和……约沙法
  rationale: וְ表示并列，专名按现代中文圣经通行译名译为“约沙法”。
- source_word: מֶלֶךְ יְהוּדָה
  choice: 犹大王
  rationale: 这是置于专名之后的同位称号；中文为表达清楚并保持自然语序，将其置于“约沙法”之前。
- source_word: רָמֹת גִּלְעָד
  choice: 基列的拉末
  rationale: 采用现代中文圣经中常见的地名形式，并以“的”清楚表达复合地名的地域关系，不将其误解为普通描述。
