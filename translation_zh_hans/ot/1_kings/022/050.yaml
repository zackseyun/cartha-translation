  to: 那时，亚哈的儿子亚哈谢对约沙法说：“让我的臣仆同你的臣仆一起乘船去吧。”可是约沙法不肯。
  rationale: 仅调整直接引语中两个“臣仆”的句法关系，使其更准确对应原文“我的臣仆同你的臣仆”，不改变原有意思、人物名称或叙事语气。中文没有必要复制英语对“在船上／在船里”的脚注；“乘船”已自然明确地表达航行语境。
