  yaml_path: translation/ot/1_kings/022/050.yaml
  text: Then Ahaziah son of Ahab said to Jehoshaphat[b][a], “Let my servants go with your servants in the ships,” but Jehoshaphat was not willing.
translation:
  language: zh_hans
  text: 那时，亚哈的儿子亚哈谢对约沙法说：“让我的臣仆同你的臣仆一起乘船去吧。”可是约沙法不肯。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָז
  choice: 那时
  rationale: 作为时间和叙事推进标记，承接前文事件；“那时”自然且不额外强调因果。
- source_word: אָמַר
  choice: 说
  rationale: 叙事中引出直接引语的常规译法。
- source_word: אֲחַזְיָהוּ בֶן אַחְאָב
  choice: 亚哈的儿子亚哈谢
  rationale: 按中文圣经人名惯例音译，并清楚表达父子关系。
- source_word: יֵלְכוּ
  choice: 让……去吧
  rationale: 表达未完成式在此所带的提议或请求语气；句末“吧”使现代汉语表达自然。
- source_word: עֲבָדַי / עֲבָדֶיךָ
  choice: 我的臣仆／你的臣仆
  rationale: עֶבֶד 可指仆人、臣属或官员；这里双方都是君王，其人员参与航海事务，译作“臣仆”既保留服事关系，也避免武断限定为奴隶。
- source_word: עִם
  choice: 和……一同
  rationale: 准确表达伴随、共同参与的含义，并使中文句式流畅。
- source_word: בָּאֳנִיּוֹת
  choice: 乘船
  rationale: 希伯来语介词 ב 与“船”连用，语境义是搭乘船只；现代汉语通常说“乘船”，无需机械译作“在船里／船上”。
- source_word: וְלֹא אָבָה
  choice: 可是……不肯
  rationale: אָבָה 表示愿意、同意；否定形式译作“不肯”，简洁自然，并保留主观不愿同意的意义。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。人名使用简体中文圣经通行形式。“臣仆”对应王室语境中的 עֶבֶד；“乘船”按现代汉语习惯传达介词短语，不另设脚注，因为中文不存在英语 in/on 的同等歧义。
