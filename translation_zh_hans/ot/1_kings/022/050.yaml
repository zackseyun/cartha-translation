  source_fidelity: 译文准确传达了亚哈谢的提议、双方的臣仆、船只航行以及约沙法不愿同意的结局。惟“让我的臣仆和你的臣仆一同……”将原文“我的臣仆同你的臣仆”的伴随关系处理为完全并列，虽不致改变主要意思，但可更贴近原文句法。
  naturalness: 整体庄重、通顺，符合现代中文圣经叙事语体。“臣仆”和“不肯”均自然。将伴随关系改作“同……一起”会更清楚顺畅。
