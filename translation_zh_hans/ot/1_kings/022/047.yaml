  text: וְ/יֶ֨תֶר֙ הַ/קָּדֵ֔שׁ אֲשֶׁ֣ר נִשְׁאַ֔ר בִּ/ימֵ֖י אָסָ֣א אָבִ֑י/ו בִּעֵ֖ר מִן הָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/047.yaml
  text: And he removed from the land the rest of the cult prostitutes who remained in the days of Asa his father[a].
translation:
  language: zh_hans
  text: 他把父亲亚撒在位时遗留下来的其余男庙妓[a]，都从国中除去了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“从事淫乱祭祀的男性人员”。希伯来语קָדֵשׁ是阳性词，指参与非法祭祀性行为的人。
    reason: 保留该词在具体身份称谓上的词义幅度，并说明其男性形式。
lexical_decisions:
- source_word: וְיֶתֶר
  choice: 其余
  rationale: יֶתֶר表示剩余、余下的部分；“其余”简洁地传达此前尚未被除去的人。
- source_word: הַקָּדֵשׁ
  choice: 男庙妓
  rationale: קָדֵשׁ在此为阳性名词，指与非法祭祀性行为有关的男性。“男庙妓”兼顾其性别、祭祀背景和性行为含义，并避免沿用含义失准且带有后世论战色彩的传统称呼。
- source_word: אֲשֶׁר נִשְׁאַר
  choice: 遗留下来的
  rationale: 该关系从句说明这些人是亚撒时期留下而仍然存在的；“遗留下来的”自然表达其结果状态。
- source_word: בִּימֵי אָסָא אָבִיו
  choice: 父亲亚撒在位时
  rationale: בִּימֵי直译为“在……的日子”，在君王叙事中自然指“在位时”；同时保留亚撒是其父亲的信息。
- source_word: בִּעֵר
  choice: 除去了
  rationale: בער在此与“从国中”连用，表示清除或移除；“除去”不额外断言驱逐、处死或焚烧等具体手段。
- source_word: מִן הָאָרֶץ
  choice: 从国中
  rationale: הָאָרֶץ在本段政治地理语境中指犹大国土，而非全世界；“国中”符合中文君王叙事的表达。
theological_decisions:
- issue: 如何翻译带有道德与文化争议的קָדֵשׁ
  choice: 男庙妓
  alternative: 从事淫乱祭祀的男性人员；男性祭祀人员
  rationale: 词形明确为阳性，语境也表明其属于被禁止的祭祀活动。“男庙妓”直接表达传统词义所包含的祭祀与性行为层面；脚注同时保留较宽泛的译法，以免把该人的具体身份和活动方式说得超过原词本身所能确定的程度。
translation_notes:
  register: 采用庄重而自然的现代汉语。“父亲亚撒在位时”符合历史叙事语体；“除去”保持行动方式未明的含蓄；用“男庙妓”避免“庙妓”在现代汉语中容易被误解为女性。
