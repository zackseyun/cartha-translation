base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/048.yaml
  text: And there was no king in Edom[a]; a deputy was king.
translation:
  language: zh_hans
  text: 以东没有王；一名受委任的官员[a]作王。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “受委任的官员”或译“总督”“派驻的官员”。希伯来语 נִצָּב 字面指被安置、派驻或委任的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/מֶלֶךְ אֵין
  choice: 那时……没有王
  rationale: וּ承接叙事，在汉语中以“那时”自然连接上下文；אֵין表示不存在，结合历史叙事译为“没有”；מֶלֶךְ直译为“王”。
- source_word: בֶּ/אֱדוֹם
  choice: 以东
  rationale: 介词בְּ加地名אֱדוֹם表示地点；按现代汉语习惯，与“没有王”连用时无需另加“在”，仍清楚表达“以东境内”。
- source_word: נִצָּב
  choice: 受委任的官员
  rationale: 该词是נצב的分词，基本含义是“被安置、被派驻或被委任的人”。在此政治语境中指受命任职、并非世袭君王的人；“受委任的官员”既保留被任命之意，也避免把具体官衔说得过于确定。
- source_word: מֶלֶךְ
  choice: 作王
  rationale: 末尾的מֶלֶךְ与נִצָּב构成简短的名词性表述。译作“作王”保留原文措辞及其张力，不擅自扩展为“代行王权”或“担任总督”。
theological_decisions:
- issue: “以东没有王”与“官员作王”之间的表面张力
  choice: 保留两句并列：“没有王；……官员作王”
  alternative: 解释为“没有独立的王，只有官员代行王权”
  rationale: 原文自身以简洁而略显矛盾的方式陈述政治状况，可能区分本土君王与受委任的统治者。正文不加入“独立”“代行”等解释性限定，以保存原文的含混与张力。
translation_notes:
  register: 采用简洁、庄重的现代标准汉语。“作王”保留原文末尾重复“王”的凝练表达；脚注说明נִצָּב的词义范围，不在正文中确定其精确官衔。
