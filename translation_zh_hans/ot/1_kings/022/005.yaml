  text: וַ/יֹּ֥אמֶר יְהוֹשָׁפָ֖ט אֶל מֶ֣לֶךְ יִשְׂרָאֵ֑ל דְּרָשׁ נָ֥א כַ/יּ֖וֹם אֶת דְּבַ֥ר יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/005.yaml
  text: And Jehoshaphat said to the king of Israel[a], “Please inquire today for the word of Yahweh.”
translation:
  language: zh_hans
  text: 约沙法又对以色列王说：“请你今天寻求雅威的话[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “寻求雅威的话”也可译作“求问雅威的话”或“向雅威求取话语”。
    reason: 原文 דָּרַשׁ 可表示“寻求、求问”；此处是寻求雅威所赐的话语或指示。
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 又……说
  rationale: 叙事中的连续式推动情节；“又……说”承接上文自然，也保留动作继续发展的意味。
- source_word: יְהוֹשָׁפָט
  choice: 约沙法
  rationale: 采用现代中文圣经中通行的人名音译。
- source_word: אֶל מֶלֶךְ יִשְׂרָאֵל
  choice: 对以色列王
  rationale: 直接保留介词关系和王号，中文表达简洁自然。
- source_word: דְּרָשׁ
  choice: 求问
  rationale: 此处指寻求来自上帝的指示；“求问”既能表达寻求，也符合向上帝求取启示的语境。
- source_word: נָא
  choice: 请你
  rationale: נָא表示请求或恳请；“请你”是自然、现代且合乎人物身份的礼貌表达。
- source_word: כַיּוֹם
  choice: 今天
  rationale: 该词在此强调当日就寻求指示；译作“今天”保留其时间意义，不额外强化为“立刻”。
- source_word: אֶת דְּבַר יְהוָה
  choice: 雅威的话
  rationale: 保留“话”这一核心意象，并让它作为“求问”的对象；希伯来语也容许按中文习惯理解为向雅威求取信息，因此以脚注注明。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代中文常见形式音译四字神名，保留其作为专名的性质，而不以称号替代。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”较直接地反映通常重构的读音，同时脚注不需要把专名改释为称号。
- issue: דָּרַשׁ 与“雅威的话”的句法关系
  choice: 求问雅威的话
  alternative: 向雅威求一句话
  rationale: 正文尽量保留原文以“雅威的话”为直接对象的结构，不把它完全解释成向雅威求取一句信息；脚注呈现中文可采用的另一种理解。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。保留“今天”的时间力度和“请你”的恳请语气；神名译作“雅威”，不使用全大写称号式替代。
