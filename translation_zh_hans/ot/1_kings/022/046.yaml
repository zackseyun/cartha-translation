  text: וְ/יֶ֨תֶר דִּבְרֵ֧י יְהוֹשָׁפָ֛ט וּ/גְבוּרָת֥/וֹ אֲשֶׁר עָשָׂ֖ה וַ/אֲשֶׁ֣ר נִלְחָ֑ם הֲ/לֹֽא הֵ֣ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יְהוּדָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/046.yaml
  text: The rest of the acts of Jehoshaphat[a], and his might that he showed, and how he fought—are they not written in the Book of the Chronicles of the Kings of Judah?
translation:
  language: zh_hans
  text: 约沙法其余的事迹、他所显出的勇力[a]，以及他怎样争战，不都记在《犹大列王大事记》上吗？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他所行的英勇事迹。”希伯来文把“他的勇力”和“他所行的”连在一起，指他以行动表现出来的勇武或英勇作为。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי יְהוֹשָׁפָט
  choice: 约沙法其余的事迹
  rationale: 王朝纪事的固定总结语中，דְּבָרִים并非单指“话语”，而是指君王的事情、作为或事迹；“其余的事迹”符合现代汉语史书语体。
- source_word: וּגְבוּרָתוֹ אֲשֶׁר עָשָׂה
  choice: 他所显出的勇力
  rationale: גְּבוּרָה可指力量、英勇或英勇事迹；与“他所行的”连用时，表达在行动中展现的勇武。“所显出的勇力”保留名词结构及其语义张力。
- source_word: וַאֲשֶׁר נִלְחָם
  choice: 以及他怎样争战
  rationale: נִלְחָם意为争战、作战；译作“怎样争战”自然承接前文，也不额外加入原文未明说的“战争”。
- source_word: הֲלֹא הֵם כְּתוּבִים
  choice: 不都记……吗
  rationale: 保留原文反问式的史料引证公式；“记在……上”是现代汉语中自然且庄重的表达。
- source_word: עַל סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יְהוּדָה
  choice: 记在《犹大列王大事记》上
  rationale: דִּבְרֵי הַיָּמִים在此指王室年代记录或编年史；《犹大列王大事记》既传达其文献性质，也避免与正典书名《历代志》混同。
