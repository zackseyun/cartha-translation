base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/018.yaml
  text: Then the king of Israel said to Jehoshaphat[a], “Did I not tell you that he would not prophesy good concerning me, but only evil?”
translation:
  language: zh_hans
  text: 以色列王就对约沙法说：“我不是告诉过你吗？他不会预言关于我的好事，而只会预言坏事[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“灾祸”。希伯来文直译为“好……只（有）坏”，以鲜明的反义词表达对王不利、甚至预告灾祸的预言。
    reason: 说明 רָע 在此保留与“好”相对的基本含义，也可按预言语境理解为“灾祸”。
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 就……说
  rationale: וַ־推动叙事向前；“就”自然表达事件承接关系，又不作过度强调。
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: 以色列王
  rationale: 依照原文保留称号，不补出“亚哈”的名字。
- source_word: אֶל יְהוֹשָׁפָט
  choice: 对约沙法
  rationale: 介词 אֶל 在说话语境中表示话语所指向的对象；原文只有人名，不增添“王”的称号。
- source_word: הֲלוֹא אָמַרְתִּי אֵלֶיךָ
  choice: 我不是告诉过你吗
  rationale: הֲלוֹא 引出预期对方肯定的反问，带有责怪和自证语气；“告诉过你”自然表达此前已经说过。
- source_word: לֹא יִתְנַבֵּא
  choice: 他不会预言
  rationale: 未完成式相对于先前的“告诉过”表示当时所预期或断定的行为；“不会”也可涵盖王所声称的惯常倾向。
- source_word: עָלַי
  choice: 有关我的
  rationale: עַל 与预言言语连用时表示“关于、涉及”；此译法避免把它误解成单纯“为了我的利益”。
- source_word: טוֹב
  choice: 好事
  rationale: טוֹב 在这里作名词性用法，与 רָע 构成鲜明对照；“好事”在现代汉语中自然，并保留原文未具体说明内容的特点。
- source_word: כִּי אִם
  choice: 只会
  rationale: 否定之后的 כִּי אִם 表示排他性对比，即“而只、唯独”；结合前面的“不会预言”，译作“只会预言”最自然。
- source_word: רָע
  choice: 坏事
  rationale: 保留 רָע 与 טוֹב 的直接反义关系，同时在语境中表示不利的预言内容；“灾祸”这一更具体的语境义收入脚注。
theological_decisions:
- issue: 预言语境中 רָע 的含义
  choice: 坏事
  alternative: 灾祸
  rationale: 这里是以色列王抱怨米该雅从不预言对他有利的事。“坏事”保留希伯来文“好—坏”的张力，不把该词限定为道德邪恶，也不直接把它收窄为灾难；可能的“灾祸”义以脚注说明。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“就对……说”保持叙事推进；王的反问保持口语中的责怪语气。“预言有关我的好事”略带正式色彩，以准确保留 עָלַי 的“关于我”之义。
