base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/027.yaml
  text: 'and say[a], ‘Thus says the king: Put this man in the prison, and feed him with bread of affliction and water of affliction until I come in peace.’'
translation:
  language: zh_hans
  text: 你要说：“王如此说：‘把这个人关进监牢，给他吃困苦之饼，喝困苦之水[a]，直到我平安回来。’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “困苦之饼”和“困苦之水”也可译作“患难之饼”和“患难之水”；这个说法可能是指严苛或微薄的囚犯口粮。
    reason: 说明 לַחַץ 的词义选择及该平行短语可能表达的实际含义。
lexical_decisions:
- source_word: כֹּה אָמַר הַמֶּלֶךְ
  choice: 王如此说
  rationale: 保留希伯来语正式的传令公式，同时采用现代汉语可理解的庄重表达。
- source_word: שִׂימוּ אֶת זֶה
  choice: 把这个人关进
  rationale: “这个人”自然指向上下文中的米该雅；与“监牢”连用时译作“关进”比直译“放入”更符合现代汉语。
- source_word: בֵּית הַכֶּלֶא
  choice: 监牢
  rationale: 准确表达“拘禁之所”的具体含义，简洁而庄重。
- source_word: וְהַאֲכִילֻהוּ
  choice: 给他吃
  rationale: 直接传达使役命令“喂他／给他吃”，并与下文“喝”构成自然的汉语搭配。
- source_word: לֶחֶם לַחַץ
  choice: 困苦饼
  rationale: 保留原文“困苦／压迫之饼”的凝练意象，不直接把它解释为少量或粗劣的口粮。
- source_word: וּמַיִם לַחַץ
  choice: 困苦水
  rationale: 与“困苦饼”保持原文的平行结构，并通过脚注说明其可能指严苛或微薄的囚粮。
- source_word: עַד בֹּאִי בְשָׁלוֹם
  choice: 直到我平安回来
  rationale: “平安”保留 שָׁלוֹם 的语义幅度及叙事中的反讽张力；“回来”按语境自然表达“我来到／归来”。
theological_decisions:
- issue: 亚哈所说 בְשָׁלוֹם 的含义
  choice: 平安回来
  alternative: 安全回来；得胜回来
  rationale: 原词可指安然无恙地归来，但不必限定为安全或军事成功；“平安”保留其语义空间以及后文所形成的叙事张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“王如此说”保留正式传令语气；引语层级以中文双引号和单引号清楚标示。
