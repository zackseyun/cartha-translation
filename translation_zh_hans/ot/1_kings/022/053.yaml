  text: וַ/יַּ֥עַשׂ הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה וַ/יֵּ֗לֶךְ בְּ/דֶ֤רֶךְ אָבִי/ו֙ וּ/בְ/דֶ֣רֶךְ אִמּ֔/וֹ וּ/בְ/דֶ֨רֶךְ֙ יָרָבְעָ֣ם בֶּן נְבָ֔ט אֲשֶׁ֥ר הֶחֱטִ֖יא אֶת יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/053.yaml
  text: And he did what was evil in the eyes of Yahweh and walked in the way of his father, and in the way of his mother, and in the way of Jeroboam son of Nebat, who caused Israel to sin.
translation:
  language: zh_hans
  text: 他行雅威眼中看为恶的事，走他父亲的道路、他母亲的道路，以及尼八的儿子耶罗波安的道路；耶罗波安使以色列犯罪。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ הָרַע
  choice: 他做……看为恶的事
  rationale: עָשָׂה 与 הָרַע 构成惯用表达，意为“做恶事”。译文采用现代汉语中自然的“做……看为恶的事”，并与后面的评价视角相连。
- source_word: בְּעֵינֵי יְהוָה
  choice: 耶和华眼中看为
  rationale: 保留希伯来语“在……眼中”的评价性惯用语，同时调整语序，使现代汉语流畅。神名 יְהוָה 采用汉语圣经传统且广为人知的音译“耶和华”。
- source_word: וַיֵּלֶךְ בְּדֶרֶךְ
  choice: 行……所行的道
  rationale: 保留“行走于道路”的行为隐喻；“行……所行的道”在庄重的现代汉语中清楚表达效法某种生活方式。
- source_word: אָבִיו / אִמּוֹ
  choice: 他父亲／他母亲
  rationale: 明确保留原文分别提及父亲和母亲的重复与强调。
- source_word: יָרָבְעָם בֶּן נְבָט
  choice: 尼八的儿子耶罗波安
  rationale: 按现代汉语自然顺序表达希伯来语父名结构，并采用通行人名译法。
- source_word: הֶחֱטִיא אֶת יִשְׂרָאֵל
  choice: 使以色列陷在罪中
  rationale: הֶחֱטִיא 是使役式，表示使以色列犯罪；“陷在罪中”保留使役责任，又比“强迫犯罪”更少加入原文没有的强制含义。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用四字神名。中文正文采用读者最熟悉、已有深厚公共使用基础的专名“耶和华”，而不是以“主”代替，从而保留其专名性质。
- issue: 耶罗波安与以色列犯罪之间的因果关系
  choice: 曾使以色列陷在罪中
  alternative: 曾引诱以色列犯罪
  rationale: 原文使役式明确表达因果责任，却未具体说明手段；因此避免加入“引诱”等原文未明说的方式。
- issue: “行……的道”的伦理含义
  choice: 保留道路隐喻
  alternative: 效法……的行为
  rationale: 原文三次重复 דֶּרֶךְ，既指生活方式，也形成修辞强调；译文保留三重“道”的结构，不把隐喻完全解释掉。
translation_notes:
  register: 采用庄重而可懂的现代标准汉语。保留“眼中”“行……的道”等希伯来语核心意象及父亲、母亲、耶罗波安三重并列；分号用于清楚区分耶罗波安的修饰说明。
