revisions:
- from: 他做耶和华眼中看为恶的事，行他父亲所行的道，也行他母亲所行的道，又行尼八的儿子耶罗波安所行的道；耶罗波安曾使以色列陷在罪中。
  to: 他行雅威眼中看为恶的事，走他父亲的道路、他母亲的道路，以及尼八的儿子耶罗波安的道路；耶罗波安使以色列犯罪。
  rationale: 修订依照希伯来文本保留“在雅威眼中”“走……道路”的伦理隐喻，以及父亲、母亲和耶罗波安三项并列。将神名改为“雅威”，与英语 POB 的 Yahweh 决定一致；将使役式译为“使以色列犯罪”，避免加入原文没有的时间或状态含义。分号自然引出限定耶罗波安的关系分句，语义仍明确指向该人物。
