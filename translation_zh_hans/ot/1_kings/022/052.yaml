base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/052.yaml
  text: Ahaziah son of Ahab became king over Israel in Samaria in the seventeenth year of Jehoshaphat king of Judah, and he reigned over Israel two years.
translation:
  language: zh_hans
  text: 亚哈的儿子亚哈谢在犹大王约沙法在位第十七年，在撒马利亚登基为以色列王；他统治以色列两年。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מָלַךְ
  choice: 登基作……王
  rationale: 此处完成式用于记述亚哈谢即位；“登基作以色列王”自然、明确地表达开始执掌王权，而不与后面的在位年数混淆。
- source_word: עַל יִשְׂרָאֵל
  choice: 作以色列王／统治以色列
  rationale: 介词 עַל 与 מלך 连用，表示对人民或疆域施行王权；按两个分句的现代汉语表达分别译为“作以色列王”和“统治以色列”。
- source_word: בְּשֹׁמְרוֹן
  choice: 于撒马利亚
  rationale: בְּ 表示地点；撒马利亚是其即位和执政所在的王都。“于”适合本节简洁庄重的编年体语气。
- source_word: בִּשְׁנַת שְׁבַע עֶשְׂרֵה לִיהוֹשָׁפָט
  choice: 在犹大王约沙法十七年
  rationale: 这是王年同步纪年格式，表示约沙法在位的第十七年；汉语王朝纪年习惯可简洁表达为“约沙法十七年”。
- source_word: וַיִּמְלֹךְ
  choice: 统治
  rationale: 在即位通告之后，此动词连同年数概述执政期限；“统治”避免重复“作王”，也保留治理以色列的含义。
- source_word: שְׁנָתָיִם
  choice: 两年
  rationale: 双数形式明确表示两年，作统治期限。
- source_word: אֲחַזְיָהוּ בֶן אַחְאָב
  choice: 亚哈的儿子亚哈谢
  rationale: 保留父子关系，并按现代汉语自然语序表达；人名采用通行圣经译名。
- source_word: מֶלֶךְ יְהוּדָה
  choice: 犹大王
  rationale: 同位称号用于辨明约沙法的身份；“犹大王”简洁、准确，符合汉语历史叙事惯例。
theological_decisions: []
