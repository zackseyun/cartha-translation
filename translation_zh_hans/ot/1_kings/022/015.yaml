source:
  edition: WLC
  text: וַ/יָּבוֹא֮ אֶל הַ/מֶּלֶךְ֒ וַ/יֹּ֨אמֶר הַ/מֶּ֜לֶךְ אֵלָ֗י/ו מִיכָ֨יְהוּ֙ הֲ/נֵלֵ֞ךְ אֶל רָמֹ֥ת גִּלְעָ֛ד לַ/מִּלְחָמָ֖ה אִם נֶחְדָּ֑ל וַ/יֹּ֤אמֶר אֵלָי/ו֙ עֲלֵ֣ה וְ/הַצְלַ֔ח וְ/נָתַ֥ן יְהוָ֖ה בְּ/יַ֥ד הַ/מֶּֽלֶךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/015.yaml
  text: So he came to the king[a], and the king said to him, “Micaiah, should we go to Ramoth-gilead for battle, or should we refrain?” And he said to him, “Go up and succeed, and Yahweh will give it into the hand of the king.”
translation:
  language: zh_hans
  text: 于是，米该雅来到王面前。王问他：“米该雅，我们该不该到基列的拉末去打仗？还是不要去？”他回答：“你上去，必会成功；雅威必把它交在王手中。”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 从上下文看，米该雅这句话很可能是反讽；但希伯来文本身没有明确标出讥讽语气。
    reason: 保留原文未明说的语气，同时帮助读者理解叙事语境。
lexical_decisions:
- source_word: וַיָּבוֹא אֶל־הַמֶּלֶךְ
  choice: 于是，米该雅来到王面前
  rationale: 连续叙事形式译为“于是”，自然承接上文。希伯来文主语仅为“他”，中文补出“米该雅”以免指代含混；“来到王面前”符合宫廷场景，也准确表达 אֶל־הַמֶּלֶךְ。
- source_word: מִיכָיְהוּ
  choice: 米该雅
  rationale: 采用现代中文圣经语境中通行且易辨认的人名译法。
- source_word: הֲנֵלֵךְ ... אִם נֶחְדָּל
  choice: 我们该不该去……？还是不要去？
  rationale: 未完成式在问句中表达征询意见；后一分句是与出征相对的克制、停止行动。此译法符合现代汉语议事口吻。
- source_word: רָמֹת גִּלְעָד
  choice: 基列的拉末
  rationale: 按希伯来语地名结构译出地域归属，既自然，也避免中文读者误将两个词看作并列地名。
- source_word: לַמִּלְחָמָה
  choice: 去攻打
  rationale: 介词加“战争、战斗”表达出征作战的目的；在本处译为动词“攻打”，比直译“去打仗”更自然，并与争夺该城的语境相合。
- source_word: עֲלֵה וְהַצְלַח
  choice: 上去吧，你必成功
  rationale: 保留 עֲלֵה 的“上去”意象；הַצְלַח 表示行动取得成功。正文不额外加入讥讽标记，以保存原文表层措辞及语境中的反讽张力。
- source_word: וְנָתַן יְהוָה
  choice: 雅威必把它交在
  rationale: 命令式之后的完成式在这里表达确定的后续结果，故译“必”；原文省略受词，中文以中性代词“它”补足句法，但不明确限定为城、军队或战事成果。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语中可读的音译呈现四字神名，不以称号“主”替代原文的专名。
- source_word: בְּיַד הַמֶּלֶךְ
  choice: 交在王手中
  rationale: 保留希伯来语“交在某人手中”的惯用形象，表达使其落入王的掌控。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。译作“雅威”保留专名性质，同时避免用称号代替。
- issue: 米该雅回答的语气
  choice: 正文按字面陈述，脚注说明很可能是反讽
  alternative: 在正文加入“讥讽地说”或用明显嘲讽措辞
  rationale: 上下文强烈暗示米该雅是在说反话，但本节希伯来文本身没有明确的词汇或语法标志。正文不替读者消除这种叙事张力，脚注则提示语境所显示的可能语气。
- issue: “必把它交在王手中”的受词
  choice: 使用未明确所指的“它”
  alternative: 明确译为“把那城交在王手中”
  rationale: 希伯来文没有明说受词。虽然语境很可能指基列的拉末或相关战果，正文仍不补成明确的“那城”，以保留原文的省略。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。王的问话译得简洁直接，符合征询先知意见的场景；米该雅的回答保持表层肯定，不在正文中擅自强化反讽。脚注标记置于整句回答之后，使其明确对应米该雅的答话。
