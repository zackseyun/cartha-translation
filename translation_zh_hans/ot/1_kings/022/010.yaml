base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/010.yaml
  text: The king of Israel and Jehoshaphat king of Judah were sitting[a], each on his throne, clothed in garments, at the threshing floor at the entrance of the gate of Samaria, and all the prophets were prophesying before them.
translation:
  language: zh_hans
  text: 以色列王和犹大王约沙法各坐在自己的宝座上，穿着衣服，在撒玛利亚城门入口处的打谷场上；众先知都在他们面前说预言。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּמֶלֶךְ יִשְׂרָאֵל
  choice: 以色列王
  rationale: וּ承接上文；现代汉语在本句中无需另译“于是”或“现在”，也能自然延续叙事。
- source_word: וִיהוֹשָׁפָט מֶלֶךְ יְהוּדָה
  choice: 和犹大王约沙法
  rationale: 保留并列关系，以现代汉语通常的“称号＋姓名”次序表达同位结构。
- source_word: יֹשְׁבִים אִישׁ עַל כִּסְאוֹ
  choice: 各自坐在宝座上
  rationale: 分词描绘当时持续的坐姿；אִישׁ在这里作分配用法，译为“各自”；王室语境中的כִּסֵּא译为“宝座”。
- source_word: מְלֻבָּשִׁים בְּגָדִים
  choice: 身穿礼服
  rationale: 字面是“穿着衣服”；王室公开场合暗示正式服装，因此正文用自然的“礼服”，同时以脚注注明原文未明确限定服装种类。
- source_word: בְּגֹרֶן פֶּתַח שַׁעַר שֹׁמְרוֹן
  choice: 地点是在撒玛利亚城门入口处的打谷场
  rationale: 保留“打谷场”和“城门入口”的空间关系；加入“地点是”可避免汉语误读为二王坐在礼服或宝座之外的悬垂修饰。
- source_word: וְכָל הַנְּבִיאִים מִתְנַבְּאִים לִפְנֵיהֶם
  choice: 所有先知都在他们面前说预言
  rationale: 保留כָל的全称范围、分词所描绘的持续场景，以及לִפְנֵיהֶם所表达的当面或在场关系；“说预言”比“预言着”更自然。
theological_decisions:
- issue: 这些先知所说之话是否必然来自上帝
  choice: 仅称他们“说预言”
  alternative: 译为“传讲上帝的话”或“作假预言”
  rationale: 本节的希伯来语只描述他们正在行使先知性言说，并未在此处直接判定其信息的来源或真假；译文不提前解决下文形成的神学张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“宝座”“先知”“说预言”保留经文语域；用分号清楚区分王的场景布置与众先知正在进行的行动。
