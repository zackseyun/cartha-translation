base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/042.yaml
  text: Jehoshaphat was thirty-five years old when he began to reign, and he reigned twenty-five years in Jerusalem. And his mother’s name was Azubah daughter of Shilhi.
translation:
  language: zh_hans
  text: 约沙法登基时三十五岁，在耶路撒冷作王二十五年。他母亲名叫阿苏巴，是示利希的女儿。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוֹשָׁפָט
  choice: 约沙法
  rationale: 按现代中文圣经人名的通行音译处理，不翻译名字的词源含义。
- source_word: בֶּן שְׁלֹשִׁים וְחָמֵשׁ שָׁנָה בְּמָלְכוֹ
  choice: 登基时三十五岁
  rationale: 希伯来语直译近于“他作王时是三十五岁之子”；中文以君王纪年公式“登基时三十五岁”自然、准确地表达即位年龄。
- source_word: וְעֶשְׂרִים וְחָמֵשׁ שָׁנָה מָלַךְ
  choice: 作王二十五年
  rationale: מָלַךְ在王朝纪事中指执掌王权；“作王”既贴近原文，也符合现代中文圣经历史叙事的庄重语体。
- source_word: בִּירוּשָׁלִָם
  choice: 在耶路撒冷
  rationale: 地点介词加地名，直接译为“在耶路撒冷”。
- source_word: וְשֵׁם אִמּוֹ עֲזוּבָה
  choice: 他母亲名叫阿苏巴
  rationale: 保留王室纪事中记载王母姓名的公式内容，同时用自然现代中文表达；עֲזוּבָה按音译作“阿苏巴”。
- source_word: בַּת שִׁלְחִי
  choice: 是示利希的女儿
  rationale: בַּת直接表示“女儿”；שִׁלְחִי作为人名按音译处理。
