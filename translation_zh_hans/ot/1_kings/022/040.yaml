  yaml_path: translation/ot/1_kings/022/040.yaml
  text: And Ahab slept with his fathers[a], and Ahaziah his son became king in his place.
translation:
  language: zh_hans
  text: 亚哈与他的列祖同睡[a]；他儿子亚哈谢接替他作王。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“与他的列祖同睡”，是王室记载中表示去世的惯用语。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: 同睡
  rationale: 该动词与“列祖”构成王室死亡记述中的固定委婉语。译作“同睡”保留希伯来语意象和程式性；脚注说明其实际含义是去世。
- source_word: עִם אֲבֹתָיו
  choice: 与列祖
  rationale: “列祖”是现代中文圣经语体中自然且庄重的表达，既保留家族与王朝色彩，也比直译“父亲们”准确。
- source_word: וַיִּמְלֹךְ
  choice: 作王
  rationale: 此处处于王位继承公式中，表示亚哈谢登上王位；配合“接替他”可清楚表达即位，而非仅描述持续统治。
- source_word: תַּחְתָּיו
  choice: 接替他
  rationale: 该词表示取代前任、承接其职位。译作“接替他”符合现代汉语，并准确传达王位继承关系。
- source_word: אַחְאָב
  choice: 亚哈
  rationale: 采用现代中文圣经传统中通行的人名音译。
- source_word: אֲחַזְיָהוּ
  choice: 亚哈谢
  rationale: 采用现代中文圣经传统中通行的人名音译。
- source_word: בְנוֹ
  choice: 他儿子
  rationale: 明确保留原文的父子关系及王朝继承信息。
theological_decisions: []
