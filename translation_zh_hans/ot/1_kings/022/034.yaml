base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/034.yaml
  text: But a man drew his bow at random and struck the king of Israel between the scale armor and the breastplate[a]. So he said to his charioteer, “Turn your hand and take me out of the camp[d][c][b], for I am wounded.”
translation:
  language: zh_hans
  text: 可是，有一个人随手拉弓[a]，射中了以色列王，正中护甲接合部和胸甲之间的缝隙[b]。王就对他的战车驾驶者说：“掉转车头[c]，带我离开战阵，因为我受伤了[d]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “随手”所译的希伯来语也可理解为“无意间”“没有特定目标地”或“随意地”；这里大概是说射箭的人并未特意瞄准以色列王。
    reason: lexical_alternative
  - marker: b
    text: 原文的两个甲具术语，直译可作“接合之物”和“铠甲”；其确切所指不能确定，很可能是指不同护甲部件之间的缝隙。
    reason: cultural_note
  - marker: c
    text: 原文是“转过你的手”，是操纵战车转向的说法。
    reason: lexical_alternative
  - marker: d
    text: 这里的希伯来语动词也可表示“患病”或“变得虚弱”；按中箭的语境，意思是“受伤”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ
  choice: 可是，有个人
  rationale: וְ在这里引出与前文形成转折的叙事发展；אִישׁ是不具名的普通人物，译为“有个人”自然明确。
- source_word: מָשַׁךְ בַּקֶּשֶׁת
  choice: 开弓
  rationale: 这是拉弓射箭的常用表达；现代汉语“开弓”简洁自然，并由下文“射中了”明确其结果。
- source_word: לְתֻמּוֹ
  choice: 随意
  rationale: 本词本可涉及“纯全、无心”，在战斗语境中较可能表示没有瞄准某个特定对象；“随意”保留其非特定意图，同时用脚注说明其他可能理解。
- source_word: וַיַּכֶּה
  choice: 射中了
  rationale: נכה基本义为“击中、打击”；因施事者使用弓箭，“射中了”是合乎汉语语境的对应表达，又不提前加入伤势程度。
- source_word: בֵּין הַדְּבָקִים וּבֵין הַשִּׁרְיָן
  choice: 铠甲接合处和胸甲之间的空隙
  rationale: 两个甲具术语的确切所指不完全确定；译文表达箭射入不同护甲部件之间的薄弱处，并以脚注保留词义的不确定性。
- source_word: לְרַכָּבוֹ
  choice: 对驾车的人
  rationale: 此处指操控王所乘战车的人；“驾车的人”比专门术语更易为现代普通读者理解。
- source_word: הֲפֹךְ יָדְךָ
  choice: 调转方向
  rationale: 希伯来语直译为“转过你的手”，在这里是操纵战车转向的习语；正文译出实际动作，脚注保留原文意象。
- source_word: וְהוֹצִיאֵנִי מִן הַמַּחֲנֶה
  choice: 带我离开战阵
  rationale: מַחֲנֶה可指营地、军队或军阵；当时正在交战，“战阵”比静态的“营地”更贴合语境。
- source_word: כִּי הָחֳלֵיתִי
  choice: 因为我受伤了
  rationale: 该动词可表示患病、变弱或受创；紧接中箭的语境清楚指受伤，但原文没有明说“重伤”，故不增加程度。
