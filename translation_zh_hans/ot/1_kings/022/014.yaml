id: 1KI.22.14
reference: 1 Kings 22:14
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יֹּ֖אמֶר מִיכָ֑יְהוּ חַי יְהוָ֕ה כִּ֠י אֶת אֲשֶׁ֨ר יֹאמַ֧ר יְהוָ֛ה אֵלַ֖/י אֹת֥/וֹ אֲדַבֵּֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/014.yaml
  text: And Micaiah said[a], “As Yahweh lives, whatever Yahweh says to me, that I will speak.”
translation:
  language: zh_hans
  text: 米该雅说：“我指着永活的雅威[a]起誓，雅威对我说什么，我就说什么。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “雅威”音译自希伯来文神名 יהוה（YHWH）。
    reason: 说明神名的原文形式及译名依据。
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: 该叙事性未完成式用于承接上下文并引出直接引语；现代汉语通常不必机械补出“于是”或“并且”。
- source_word: מִיכָיְהוּ
  choice: 米该雅
  rationale: 采用现代中文圣经读者较熟悉的人名译法。
- source_word: חַי יְהוָה
  choice: 我指着永活的雅威起誓
  rationale: 这是希伯来语常见的庄严起誓公式；此译法明确表达其誓言功能，同时保留“雅威是活着的”这一核心意象。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来语四字神名的通行学术拟音译出其专名性质，不以一般称号代替。
- source_word: כִּי אֵת אֲשֶׁר
  choice: ……什么
  rationale: 该组合在誓言内容中构成泛指宾语关系，现代汉语自然表达为“说什么……就说什么”。
- source_word: יֹאמַר יְהוָה אֵלַי
  choice: 雅威对我说什么
  rationale: 未完成式在此指尚待领受的启示；汉语条件式结构无需另加将来时标记。אֶל 表示话语朝向先知，译为“对我”。
- source_word: אֹתוֹ אֲדַבֵּר
  choice: 我就说什么
  rationale: אֹתוֹ 回指前面的关系成分；用汉语“什么……就……什么”结构保留回指和强调。דבר 译作“说”，符合先知传达话语的语境。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用神的专名。译作“雅威”既保留专名性质，也避免以称号替换；脚注提示其所对应的希伯来文形式。
- issue: חַי יְהוָה 的性质
  choice: 明确译为起誓公式“我指着永活的雅威起誓”
  alternative: 直译为“雅威是活着的”
  rationale: 上下文中该短语具有誓言功能。明确补出“起誓”使现代读者理解其言语行为，同时以“永活的”保留该公式对神生命的宣认。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“说什么，我就说什么”自然传达先知只宣告所领受之话的坚定语气；不额外解释这话是否合乎君王期待，以保留叙事张力。
