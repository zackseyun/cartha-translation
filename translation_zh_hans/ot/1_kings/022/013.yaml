base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/013.yaml
  text: And the messenger who had gone to summon Micaiah spoke to him[a], saying, “Look now, the words of the prophets are with one mouth favorable to the king. Please let your word be like the word of one of them, and speak favorably.”
translation:
  language: zh_hans
  text: 那去召米该雅的使者对他说：“你看，众先知的话都一致对王有利。请你也说和他们中一个人一样的话，说对王有利的话吧。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַמַּלְאָךְ
  choice: 使者
  rationale: 上下文指奉命去召米该雅的人，不是天使；“使者”准确保留其受差遣者的身份。
- source_word: לִקְרֹא
  choice: 召
  rationale: 此处是在王面前传召先知，“召”简洁、自然，并体现正式传唤的语境。
- source_word: הִנֵּה נָא
  choice: 你看
  rationale: 兼顾引起注意和劝说的语气，比直译为“看哪，请”更符合现代汉语对话。
- source_word: דִּבְרֵי הַנְּבִיאִים פֶּה אֶחָד
  choice: 众先知都异口同声地
  rationale: פֶּה אֶחָד字面为“一个口”，是“一致、同声”的习语；“异口同声”自然保留口的意象，也清楚表达众人意见一致。
- source_word: טוֹב אֶל הַמֶּלֶךְ
  choice: 向王说吉言
  rationale: 这里的“好”描述先知对王所说之话的有利、顺耳性质；“说吉言”既自然，也与末句重复的טוֹב形成呼应。
- source_word: יְהִי נָא דבריך
  choice: 请你也……说话
  rationale: 希伯来语直译为“请让你的话成为”；汉语采用劝请式表达，同时保留下文要求米该雅与其他先知一致的意思。
- source_word: כִּדְבַר אַחַד מֵהֶם
  choice: 像他们中任何一个人那样说话
  rationale: 原文为“像他们中一个人的话”；“任何一个人”在汉语中更清楚地表达随从其中任一人的一致说法，并未特指某位先知。
- source_word: וְדִבַּרְתָּ טּוֹב
  choice: 说吉言吧
  rationale: 保留“说好话、说有利之言”的要求；句末“吧”自然表达使者劝求的语气。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而口语自然的叙事表达。“异口同声”传达原文“一个口”的习语，因此无需脚注；“吉言”在此指对王有利、令王满意的话，不预先判定其真假。
