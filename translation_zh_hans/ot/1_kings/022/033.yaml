base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/033.yaml
  text: And it happened[a], when the commanders of the chariots saw that he was not the king of Israel, they turned back from pursuing him.
translation:
  language: zh_hans
  text: 当战车部队的将领们看见他不是以色列王时，他们就不再追赶他，转回去了。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“从他后面转回去”，意思是他们停止跟随或追赶他。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: （融入句式，未单独译出）
  rationale: 这是希伯来叙事中承接下一事件的常用形式；现代汉语可由整句的顺承自然表达，若硬译为“事情发生了”反而累赘。
- source_word: כִּרְאוֹת
  choice: 一看出
  rationale: 介词כְּ加不定式结构表示时间；结合后面的判断内容，“一看出”自然表达他们辨认清楚后随即采取行动。
- source_word: שָׂרֵי הָרֶכֶב
  choice: 战车部队的将领们
  rationale: שָׂרֵי指军事首领，הָרֶכֶב在此可指战车或战车兵力；译作“战车部队的将领们”既符合军事语境，也避免被误解为每辆战车本身有一位“长官”。
- source_word: כִּי לֹא מֶלֶךְ יִשְׂרָאֵל הוּא
  choice: 他不是以色列王
  rationale: כִּי引出他们看明白的内容；阳性单数代词הוּא指他们先前追击的人。
- source_word: וַיָּשׁוּבוּ
  choice: 就转回去
  rationale: שׁוּב在此表示改变行动方向、退回去；“就”体现他们辨认之后紧接着作出的反应。
- source_word: מֵאַחֲרָיו
  choice: 不再追赶他
  rationale: 字面为“从他后面”，在当前军事语境中是停止跟随或追击某人的惯用表达；“不再追赶他”清楚传达其语用含义。
