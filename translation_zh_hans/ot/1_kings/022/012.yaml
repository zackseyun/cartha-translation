  yaml_path: translation/ot/1_kings/022/012.yaml
  text: And all the prophets were prophesying thus[a], saying, “Go up to Ramoth-gilead and succeed, and Yahweh will give it into the hand of the king.”
translation:
  language: zh_hans
  text: 众先知也都这样预言说：“上到基列的拉末去吧，你必成功；雅威必把它交在王的手中。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/כָל הַ/נְּבִאִים
  choice: 众先知也都
  rationale: 保留集合性的“所有先知”和叙事连接词；“也”自然衔接上文同样的预言场景。
- source_word: נִבְּאִים כֵּן
  choice: 这样预言
  rationale: 分词表达当时持续进行的行动；现代汉语不必另加“正在”，“这样”保留כֵּן所指的方式与一致内容。
- source_word: לֵ/אמֹר
  choice: 说
  rationale: 自然引出直接引语。
- source_word: עֲלֵה
  choice: 上……去吧
  rationale: 保留עלה“上去”的基本空间表达，不直接增译为“攻打”，让军事含义由语境呈现。
- source_word: רָמֹת גִּלְעָד
  choice: 基列的拉末
  rationale: 按现代汉语地名习惯表达该复合地名，并清楚呈现拉末位于基列。
- source_word: וְ/הַצְלַח
  choice: 你必成功
  rationale: צלח的使役式在此表示取得成功；结合预言口吻，译为结果性的“必成功”，较“亨通”更自然且适合军事语境。
- source_word: וְ/נָתַן
  choice: 必把它交
  rationale: 在命令之后表达预告的结果；“它”承接基列的拉末或相关战事目标，符合汉语表达需要。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以音译保留希伯来文本中的上帝专名，不用称号替代。
- source_word: בְּ/יַד הַ/מֶּלֶךְ
  choice: 在王手中
  rationale: 保留希伯来语“在……手中”的支配权意象；汉语能够自然理解为交由王掌控。
theological_decisions:
- issue: 上帝名字יהוה的译法
  choice: 雅威
  alternative: 耶和华／上主
  rationale: 原文直接使用四字神名；“雅威”较直接地音译该专名，避免以称号替换。
- issue: 先知话语是否明说攻城
  choice: 上……去
  alternative: 攻打
  rationale: עלה本身是“上去”，军事行动虽由语境暗示，却未在本节动词中明说，因此不把暗含意义写死。
- issue: וְנָתַן的时态与关系
  choice: 必把它交
  alternative: 已经把它交／因为必把它交
  rationale: 该形式在直接预言中可指将来的确定结果；连接词直译为并列关系，不额外判定为完成时或因果关系。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“众先知也都这样预言说”保留原文持续、群体一致发言的场景；引语简洁有力。无脚注，因此正文不设脚注标记。
