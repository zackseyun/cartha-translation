base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/032.yaml
  text: And it happened[a], when the commanders of the chariots saw Jehoshaphat, that they said, “Surely he is the king of Israel.” So they turned aside against him to fight[b], but Jehoshaphat cried out.
translation:
  language: zh_hans
  text: 战车部队的将领们一看见约沙法，就说：“这一定是以色列王！”于是他们转而攻击他；约沙法却呼喊起来。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי כִּרְאוֹת
  choice: 一看见
  rationale: כִּרְאוֹת在此引出时间情境；现代汉语用“一看见”自然地表达随即发生的叙事关系。וַיְהִי主要承担叙事衔接功能，无须机械译成“事情发生了”。
- source_word: שָׂרֵי הָרֶכֶב
  choice: 战车队长
  rationale: שָׂרֵי指军事长官，הָרֶכֶב在上下文中指战车部队；“战车队长”简洁清楚，指挥战车部队的军官。
- source_word: אַךְ מֶלֶךְ יִשְׂרָאֵל הוּא
  choice: 这一定是以色列王
  rationale: אַךְ在此表达确信的辨认，而非排他性的“只有”；“这一定是”也保留他们误认约沙法的语气。
- source_word: וַיָּסֻרוּ עָלָיו לְהִלָּחֵם
  choice: 于是转过去攻击他
  rationale: סור与עַל连用在这里表示转向某人并采取敌对行动，לְהִלָּחֵם说明目的是交战；“转过去攻击他”兼顾方向变化和军事敌意。
- source_word: וַיִּזְעַק
  choice: 呼喊起来
  rationale: זעק表示大声呼喊，常带危急色彩；经文本身未说明呼喊的内容或对象，因此不作增补。
theological_decisions:
- issue: 约沙法呼喊的内容与对象
  choice: 仅译为“呼喊起来”
  alternative: 向耶和华呼救／发出作战口号
  rationale: 本节希伯来文本只陈述וַיִּזְעַק，没有明说他喊了什么或向谁呼喊；不以历代志平行经文或解释性推断填补。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。保留战场动作的迅速感及末句的危急张力，不使用古雅的“于是事情发生了”一类句式。
