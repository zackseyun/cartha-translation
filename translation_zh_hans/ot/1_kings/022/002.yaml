base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/002.yaml
  text: In the third year[a], Jehoshaphat king of Judah went down to the king of Israel.
translation:
  language: zh_hans
  text: 到了第三年，犹大王约沙法下到[a]以色列王那里。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “下到”或译“来到”。这里的希伯来语动词本义是“下去”，可能反映地势高低，也可以泛指前往。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: 到了
  rationale: 这里的叙事形式用于引出时间背景。译为“到了”既自然承接上文，也避免生硬直译成“事情发生了”。
- source_word: בַּשָּׁנָה הַשְּׁלִישִׁית
  choice: 第三年
  rationale: 保留原文的定指序数和时间意义；与“到了”连用，符合现代汉语叙事习惯。
- source_word: וַיֵּרֶד
  choice: 下到
  rationale: 保留希伯来语 ירד“下去、下降”的方向或地势色彩，同时表达前往某处；脚注注明也可按一般移动或叙事视角理解。
- source_word: יְהוֹשָׁפָט
  choice: 约沙法
  rationale: 采用现代中文圣经中通行且易于识别的人名译法。
- source_word: מֶלֶךְ יְהוּדָה
  choice: 犹大王
  rationale: 准确表达约沙法的王室身份；汉语以“犹大王约沙法”的顺序组成自然的同位结构。
- source_word: אֶל מֶלֶךְ יִשְׂרָאֵל
  choice: 以色列王那里
  rationale: 与表示移动的“下到”搭配，清楚传达 אֶל 所表示的趋向，并保留正式的政治称号。
