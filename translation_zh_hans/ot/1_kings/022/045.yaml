  text: And Jehoshaphat made peace with the king of Israel[a].
translation:
  language: zh_hans
  text: 约沙法与以色列王讲和了[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“约沙法与以色列王和平相处。”这个希伯来语动词既可理解为建立和平关系，也可理解为处于和平状态；正文采用前一种意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁלֵם
  choice: 讲和了
  rationale: 该词为 שׁלם 的使役词干形式，结合叙事中的连续式，可指建立和平关系或缔结和平。“讲和了”自然简明，并保留主要文本所采用的事件性含义。
- source_word: יְהוֹשָׁפָט
  choice: 约沙法
  rationale: 采用现代中文圣经读者熟悉的人名译法。
- source_word: עִם
  choice: 与
  rationale: 表示建立和平关系的另一方，现代汉语以“与”表达自然、庄重。
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: 以色列王
  rationale: 直接表达希伯来语属格结构；上下文所指为当时在位的北国君王，中文无需另加定冠成分。
