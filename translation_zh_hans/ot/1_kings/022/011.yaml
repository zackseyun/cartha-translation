  to: 基拿拿的儿子西底家为自己造了两只铁角，说：“耶和华如此说：‘你要用这些角冲撞亚兰，直到把他们灭尽。’”
  rationale: 仅调整表示以角攻击的动词短语，以消除现代汉语歧义，并更直接呈现原文的角击意象；其余译文保持不变。
