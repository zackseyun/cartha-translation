base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/011.yaml
  text: 'Then Zedekiah son of Chenaanah made for himself horns of iron and said, “Thus says the LORD: With these you will gore Aram until you have finished them off.”'
translation:
  language: zh_hans
  text: 基拿拿的儿子西底家为自己造了两只铁角，说：“耶和华如此说：‘你要用这些角冲撞亚兰，直到把他们灭尽。’”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קַרְנֵי בַרְזֶל
  choice: 两只铁角
  rationale: קַרְנֵי 是“角”的复数构造式；补出“两只”符合汉语表达，也呈现西底家所造的象征性器物。
- source_word: תְּנַגַּח
  choice: 抵死
  rationale: 该动词指用角抵、撞；“抵死”保留牛角攻击的具体意象，并表达致命性推进。
- source_word: אֲרָם
  choice: 亚兰
  rationale: 采用希伯来地名的常见中文音译，避免以现代国名替代古代政治实体。
- source_word: עַד כַּלֹּתָם
  choice: 直到把他们灭尽
  rationale: כַּלֹּתָם 可表达使其终结、消灭；此处宾语后缀指亚兰一方的人众，汉语以“他们”自然呈现其集合意义。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 耶和华
  alternative: 雅威／上主
  rationale: 采用普通中文读者熟悉的专名“耶和华”，并保留先知宣告公式“耶和华如此说”；本节叙事并不由此确认该预言为真。
- issue: 虚假先知话语的引述方式
  choice: 按其宣称直接引述
  alternative: 加上“他假称”等解释语
  rationale: 原文仅记载西底家的言行；不在本节中添加评断，以保留上下文逐步揭示的叙事张力。
translation_notes:
  register: 采用现代、庄重而清楚的叙事体。“为自己造了”紧贴 ל/וֹ，保留该动作受益者或归属关系；内外两层引号区分西底家的发言和他所宣称的神谕。
