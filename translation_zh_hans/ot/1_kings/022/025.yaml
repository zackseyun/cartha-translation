    rationale: 原文是“你进入……，为要藏起来”；中文以“进入……藏起来”可较清楚保留动作与目的的层次。
  revised_text: 米该雅说：“看吧，你在那日从一间房到另一间房藏起来时，就会看见。”
  revised_footnotes:
