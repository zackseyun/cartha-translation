    rationale: 希伯来文直作“房间在房间中／进房间又进房间”，可指退入更深处，也可指逐间躲避。正文宜采用不武断且能反映重复的“从一间房到另一间房”，脚注保留“进入最里面的房间”的可能。
  - severity: low
