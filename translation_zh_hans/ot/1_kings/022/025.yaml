  text: And Micaiah said[a], “Behold, you will see on that day when you go into an inner room to hide.”
translation:
  language: zh_hans
  text: 米该雅说：“看吧，你在那日从一间房到另一间房藏起来时，就会看见。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר מִיכָיְהוּ
  choice: 米该雅说
  rationale: 以现代中文常用的叙事表达承接上下文；人名采用《列王纪》中通行的中文译名。
- source_word: הִנְּךָ רֹאֶה
  choice: 看吧……就会看见了
  rationale: הִנְּךָ用于唤起注意，译作“看吧”；分词רֹאֶה结合“到那日”的未来语境具有预示意味，译作“就会看见了”，既保留“看见”的字面意象，也表达届时亲自验证的语气。
- source_word: בַּיּוֹם הַהוּא אֲשֶׁר
  choice: 到那日……的时候
  rationale: 将时间短语和关系词自然组合成现代汉语时间从句，不额外限定“那日”的具体所指。
- source_word: תָּבֹא חֶדֶר בְּחֶדֶר
  choice: 躲进内室
  rationale: 重复的חֶדֶר配合介词可表示进入更里面的房间，也可能描写从一间房躲到另一间房；正文采用简洁自然的“内室”，并以脚注保留其表达方式的歧义。
- source_word: לְהֵחָבֵה
  choice: 躲进
  rationale: 该不定式表示目的，即为了隐藏自己；汉语用“躲进”把进入房间与藏身目的自然结合。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“看吧”保留原文直接、带预告意味的语气；末尾“就会看见了”与前文呼应，避免把“看见”解释性改译为“知道”或“明白”。
