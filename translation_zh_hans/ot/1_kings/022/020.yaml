base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/020.yaml
  text: And Yahweh said[a], “Who will entice Ahab, so that he may go up and fall at Ramoth-gilead?” And this one said one thing, and that one said another.
translation:
  language: zh_hans
  text: 雅威说[a]：“谁去引诱亚哈，好叫他上到基列的拉末去，倒在那里呢？”这个说这样，那个说那样。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“劝服”；这个动词按语境也可有“欺骗”的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语音译上帝向以色列启示的专名，不用“主”这一称号代替，也不采用源自另一种传统读音的“耶和华”。
- source_word: יְפַתֶּה
  choice: 引诱
  rationale: פִּעֵל 形式可表示引诱、劝服或欺骗；“引诱”保留了促使亚哈采取行动的意味，同时不在正文中把语义完全限定为单纯劝说或明确欺骗。
- source_word: וְיַעַל
  choice: 使他上……去
  rationale: 这里的连接词加未完成式承接前面的引诱，表达预期目的或结果；“使他上……去”符合现代汉语，也保留“上去”的空间与军事行动意味。
- source_word: וְיִפֹּל
  choice: 倒在那里
  rationale: נפל 的基本义是“倒下”；军事语境暗示败亡或战死，但正文保留较基本的表达，不直接改译为“阵亡”。“在那里”自然承接前面的地点。
- source_word: בְּרָמֹת גִּלְעָד
  choice: 在基列的拉末
  rationale: 将地名 רָמֹת גִּלְעָד 音译并按汉语地名关系表达为“基列的拉末”；介词的地点义由“倒在那里”体现。
- source_word: זֶה בְּכֹה וְזֶה אֹמֵר בְּכֹה
  choice: 这个这样说，那个那样说
  rationale: 贴近原文“这个……那个……”及两个 בְּכֹה 的对举，又以简洁自然的现代汉语表达各方提出不同意见。
theological_decisions:
- issue: 雅威参与亚哈的败亡
  choice: 保留雅威主动询问谁去引诱亚哈的直接表述
  alternative: 弱化为“谁去影响亚哈”或改写以减少雅威的主动性
  rationale: 希伯来文明确把这项询问归于雅威，并置于天上议会的场景中。译文不淡化神在审判中的主权与行动，也不额外解释其伦理或神学张力。
- issue: “倒下”是否明确译为死亡
  choice: 译作“倒在那里”
  alternative: 译作“战死在那里”或“在那里灭亡”
  rationale: 上下文很可能指亚哈在战事中死亡，但原文使用基本动词 נפל。保留“倒下”的意象，既传达军事败亡，也不把语义明示程度推得超过原文。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“雅威”保留神的专名；问句结构简明自然。末句用“这个这样说，那个那样说”重现原文对举，不补出“众灵”等原文此节未明说的主语。
