base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/019.yaml
  text: 'Then he said[a], “Therefore hear the word of Yahweh: I saw Yahweh sitting on his throne, and all the host of heaven standing by him[b], on his right and on his left.”'
translation:
  language: zh_hans
  text: 他说：“因此，你要听雅威的话：我看见雅威坐在他的宝座上，天上的万军[a]都侍立在他旁边[b]，在他的右边和左边。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “天上的万军”也可译作“天上的众军”或“天上全军”。这里没有明确限定为天使。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译为“站在他上方”；结合下文“在他的右边和左边”，这里很可能指在他身旁侍候。
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: 因此
  rationale: 表达由前文引出的推论或承接关系，同时保留先知宣告的郑重语气。
- source_word: שְׁמַע
  choice: 你要听
  rationale: 保留第二人称单数命令的直接性；现代汉语中庄重而清楚。
- source_word: דְּבַר יְהוָה
  choice: 雅威的话
  rationale: 保留先知宣告的固定表达，并将四字神名按其专名音译为“雅威”。
- source_word: רָאִיתִי
  choice: 我看见
  rationale: 直接呈现米该雅所报告的异象经历，不额外规定完成时态的细微含义。
- source_word: יֹשֵׁב עַל כִּסְאוֹ
  choice: 坐在他的宝座上
  rationale: 自然、直接地保留持续坐于王座上的异象画面。
- source_word: כָל צְבָא הַשָּׁמַיִם
  choice: 天上的万军
  rationale: 保留צָבָא兼有群体、军队和天上众属之意的集体性意象，不把所指收窄为“天使”。
- source_word: עֹמֵד עָלָיו
  choice: 都侍立在他旁边
  rationale: 结合宝座朝廷的场景及下文“右边和左边”，译出在旁侍候的含义；脚注同时说明介词的较直译表达。
- source_word: מִימִינוֹ וּמִשְּׂמֹאלוֹ
  choice: 在他的右边和左边
  rationale: 保留希伯来文对称的空间描写，现代汉语自然清楚。
theological_decisions:
- issue: 异象中四字神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文使用神的专名；音译“雅威”保留其作为以色列之神圣约名字的性质，而不以称号代替。
- issue: “天上的万军”所指的范围
  choice: 保留广义的天上群体意象
  alternative: 天使；天上的军队
  rationale: 原文并未在本节把该群体明确限定为天使；保留“万军”可维持天上朝廷与军旅意象之间的张力。
- issue: עָלָיו在宝座异象中的空间关系
  choice: 正文译作“在他旁边”，脚注保留“在他上方”的字面可能
  alternative: 在他上方；环绕着他
  rationale: 后面的“在他的右边和左边”支持近旁侍立的场景，但介词本身较直译可指“在他上方”，不应完全抹去这一形式上的可能。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“你要听”保留先知命令的力度；“侍立”贴合宝座前侍候的场景，又不过度解释天上众属的身份。所有脚注标记均置于正文相应词语之后。
