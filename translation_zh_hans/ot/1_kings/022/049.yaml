base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/049.yaml
  text: Jehoshaphat made ships of Tarshish to go to Ophir for gold[a], but they did not go[b], because the ships were wrecked at Ezion-geber.
translation:
  language: zh_hans
  text: 约沙法造了他施船[a]，要往俄斐去获取金子；但船队未能前往，因为船只在以旬·迦别失事了。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“他施式的船”，可能指一类大型远洋船，并不一定是从他施来的船。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文“没有前往”和“失事”都使用单数动词，可能把这些船视为一个整体，即船队。
    reason: lexical_alternative
lexical_decisions:
- source_word: עשר
  choice: 造了
  rationale: 辅音文本作 עשר；按本句句法和上下文理解为“制造、预备”的动词，以约沙法为主语、“他施船”为宾语。译作“造了”简洁自然，也符合历代志平行记载所反映的情形。
- source_word: אֳנִיּוֹת תַּרְשִׁישׁ
  choice: 他施船
  rationale: 保留希伯来语传统构造表达，同时让中文简洁流畅。此词组既可能指与他施有关的船，也可能指某类大型远洋船，因此在脚注保留语义上的开放性。
- source_word: לָלֶכֶת אוֹפִירָה
  choice: 要往俄斐去
  rationale: 不定式与地名方向词尾共同表达目的和目的地；“要往……去”贴近原文，也符合现代汉语。
- source_word: לַזָּהָב
  choice: 运取金子
  rationale: 介词 ל 在这里表示航行的目的，即取得黄金。“运取金子”比直译“为金子”更清楚地传达航海任务，又不增添金子的具体来源或交易方式。
- source_word: וְלֹא הָלָךְ
  choice: 但船队没有成行
  rationale: 原文动词为单数，但语境所指是船只构成的整体。用“船队”承接集体意义，并以“没有成行”表达航程未能启程或完成，避免误解为约沙法本人没有前往。
- source_word: נשברה
  choice: 失事了
  rationale: שבר 的尼法勒式基本义为“被打破、破损”；用于船舶语境时，“失事”能自然表达船只遭毁坏而无法航行，同时不武断限定具体毁坏方式。
- source_word: בְּעֶצְיוֹן גָּבֶר
  choice: 在以旬·迦别
  rationale: 介词 ב 标明事件发生地点；地名按通行的中文音译处理，并以间隔号分隔复合名称。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事体。“运取金子”明确目的关系；“没有成行”和“失事”符合现代航海语境。保留“他施船”的传统表达，并用脚注说明其真实语义歧义。
