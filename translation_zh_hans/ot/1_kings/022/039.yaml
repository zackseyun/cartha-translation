base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/039.yaml
  text: The rest of the acts of Ahab[a], and all that he did, and the ivory house that he built[b], and all the cities that he built—are they not written in the Book of the Chronicles of the Kings of Israel?
translation:
  language: zh_hans
  text: 亚哈其余的事迹、他所做的一切、他建造的象牙屋[a]，以及他建造的所有城邑，不都记载在《以色列诸王纪事录》[b]中吗？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “象牙屋”原文也可直译为“象牙之屋”，大概是指一座以象牙装饰的王室建筑，并非整座建筑都由象牙造成。
    reason: lexical_alternative
  - marker: b
    text: 《以色列诸王纪事录》是《列王纪》所引用的一种王室记录来源，不一定指圣经中的《历代志》。
    reason: cross_reference
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי אַחְאָב
  choice: 亚哈其余的事迹
  rationale: “דִּבְרֵי”在《列王纪》的君王生平总结套语中指其事迹或相关事项，不宜直译为“话语”；句首的וְ不另加“现在”等时间词。
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: 他所做的一切
  rationale: 保留עָשָׂה的宽泛含义，不将其限定为成就或功业。
- source_word: בֵּית הַשֵּׁן
  choice: 象牙宫
  rationale: 原文直译近于“象牙之屋”。结合亚哈的王室身份，“宫”在现代汉语中自然，但不表示整座建筑由象牙造成；脚注保留这一解释空间。
- source_word: וְכָל הֶעָרִים אֲשֶׁר בָּנָה
  choice: 他建造的所有城邑
  rationale: “城邑”可涵盖古代有城防或具城市性质的聚落，又不额外断定它们全是大型城市。
- source_word: הֲלוֹא הֵם כְּתוּבִים
  choice: 不都记在……上吗
  rationale: 以期待肯定回答的反问句再现הֲלוֹא；“记在”自然表达书面载录，同时符合中文档案用语。
- source_word: סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יִשְׂרָאֵל
  choice: 《以色列诸王纪事录》
  rationale: 将该题名理解为以色列诸王的王室纪事文献。“纪事录”既表达דִּבְרֵי הַיָּמִים的编年记录含义，也避免让现代读者误以为必然是正典《历代志》。
theological_decisions:
- issue: 所引文献是否等同于圣经正典《历代志》
  choice: 译作《以色列诸王纪事录》，并在脚注说明其为《列王纪》引用的王室记录来源
  alternative: 译作《以色列诸王历代志》
  rationale: 原文指一部与以色列诸王有关的书面纪事来源，但没有证明它就是现存的正典《历代志》；译文不应强行认同二者。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。用并列结构保留希伯来文君王生平总结句式，并以自然的中文反问句收束；书名采用书名号，脚注标记均置于相关词语之后。
