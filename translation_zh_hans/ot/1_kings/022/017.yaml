base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/017.yaml
  text: And he said[a], “I saw all Israel scattered on the mountains, like sheep that have no shepherd. And Yahweh said, ‘These have no master[b]; let each man return to his house in peace.’”
translation:
  language: zh_hans
  text: 他说：“我看见全以色列人四散在山上，好像没有牧人的羊。雅威说：‘这些人没有主人[a]；各人都平安回家去吧。’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “主人”原文为复数形式，也可译作“众主人”；在本句语境中，指这些人没有统治他们的首领。
    reason: 保留原文数的形式及其语境意义。
lexical_decisions:
- source_word: נְפֹצִים
  choice: 散布
  rationale: 该分词表示分散、散开；“散布在群山上”自然地呈现军队失去统领后四散的异象。
- source_word: אֶל הֶהָרִים
  choice: 在群山上
  rationale: אֶל通常可表示方向，但在这里与分散的状态结合，语境是地点性的；译为“在群山上”符合异象画面。
- source_word: כַּצֹּאן אֲשֶׁר אֵין לָהֶם רֹעֶה
  choice: 好像没有牧人的羊群
  rationale: 保留原文熟悉而直接的比喻，并以“羊群”自然表达צאן的集合意义。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以常见汉语音译呈现四字神名，保留其作为专名的性质，不以称号代替。
- source_word: אֲדֹנִים
  choice: 主人
  rationale: 该词形为复数，可指主、统治者；此处语境指以色列军队失去了统领者，译作单数集合意义的“主人”既贴近词义，也避免直接把解释性的“王”写入正文。
- source_word: יָשׁוּבוּ אִישׁ לְבֵיתוֹ
  choice: 让他们各人平安回家去吧
  rationale: 未完成式在神的引语中带有祈使或准许意味；“让……吧”表达这一语气，“各人”保留אִישׁ的逐一分配意义。
- source_word: בְּשָׁלוֹם
  choice: 平安
  rationale: “平安回家”是自然汉语，也保留שָׁלוֹם兼具安然无事与和平的含义。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名，因此正文采用专名音译“雅威”，不以“主”这一称号取代。
- issue: אֲדֹנִים的数与所指
  choice: 这些人没有主人
  alternative: 这些人没有众主人；这些人没有统领
  rationale: 希伯来文形式为复数，但上下文聚焦军队失去作为统治首脑的王。“主人”保留权柄关系和原文的含蓄；脚注说明复数形式，不把所指直接限定为“王”。
- issue: אִישׁ的分配表达
  choice: 各人
  alternative: 每一个人；各自
  rationale: “各人”准确保留该阳性单数名词在此处的逐一分配用法，同时符合现代汉语习惯。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“散布在群山上”保留异象的空间画面；“好像没有牧人的羊群”延续圣经比喻而不作神学扩写。引语层次以中文引号清楚标示。
