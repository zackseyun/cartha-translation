base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/004.yaml
  text: And he said to Jehoshaphat[a], “Will you go with me to battle at Ramoth-gilead?” And Jehoshaphat said to the king of Israel, “I am as you are, my people as your people, my horses as your horses.”
translation:
  language: zh_hans
  text: 他对约沙法说：“你肯同我去基列的拉末作战吗？”约沙法对以色列王说：“我与你一样；我的人民与你的人民一样，我的马匹与你的马匹一样。”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文为简短的无系词比较结构，逐项表达团结与结盟的立场。
    reason: 说明原文省略系词的紧凑平行表达及其语境含义，不把解释性的“同心”作为正文的替代译文。
lexical_decisions:
- source_word: הֲתֵלֵךְ אִתִּי
  choice: 你愿意和我一起去……吗
  rationale: 疑问词与未完成式构成直接邀请；“愿意……吗”符合现代汉语邀请共同出征的语气，“和我一起”准确表达同行。
- source_word: לַמִּלְחָמָה רָמֹת גִּלְעָד
  choice: 去基列的拉末打仗
  rationale: 按上下文将介词短语自然处理为前往该地作战；保留具体军事行动，不扩大为泛指的“战争”。
- source_word: רָמֹת גִּלְעָד
  choice: 基列的拉末
  rationale: 采用中文圣经传统中通行且清楚的地名形式，表达该城与基列地区的关系。
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: 以色列王
  rationale: 简洁、正式地表达希伯来语的属格结构，所指在上下文中明确。
- source_word: כָּמוֹנִי כָמוֹךָ
  choice: 我与你一样
  rationale: 为希伯来语无系词的简短比较结构补出汉语所需的表达，同时保留双方一致、共同进退的含义，不改写成更强的归属宣言。
- source_word: כְּעַמִּי כְעַמֶּךָ
  choice: 我的人民与你的人民一样
  rationale: 保留原文平行结构及“人民”的具体所指；“一样”在现代汉语中清楚表达结盟式的认同。
- source_word: כְּסוּסַי כְּסוּסֶיךָ
  choice: 我的马匹与你的马匹一样
  rationale: 直译具体名词“马”，采用“马匹”使现代汉语更自然；不提前解释为“骑兵”或整体军力。
theological_decisions:
- issue: 约沙法答语所表达的联盟承诺强度
  choice: 保留三个“一样”的平行比较句
  alternative: 译为“你我不分彼此”或“我的一切都归你调遣”
  rationale: 原文以简短的无系词比较结构表达团结与联盟，但没有明确使用“不分彼此”或“归你调遣”等更强措辞，因此不将隐含意义写入正文。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“愿意和我一起去……打仗吗”自然呈现邀请出征的语气；答语保留原文三重平行，避免过度口语化，也不把结盟含义扩写成原文未明说的军事承诺。
