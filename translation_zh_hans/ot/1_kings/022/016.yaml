  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר אֵלָי/ו֙ הַ/מֶּ֔לֶךְ עַד כַּ/מֶּ֥ה פְעָמִ֖ים אֲנִ֣י מַשְׁבִּעֶ֑/ךָ אֲ֠שֶׁר לֹֽא תְדַבֵּ֥ר אֵלַ֛/י רַק אֱמֶ֖ת בְּ/שֵׁ֥ם יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/016.yaml
  text: Then the king said to him[a], “How many times must I make you swear that you tell me nothing but the truth in the name of Yahweh?”
translation:
  language: zh_hans
  text: 王对他说：“我还要让你起誓[a]多少次，你才会奉雅威的名，只对我说实话呢？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “让你起誓”也可译作“使你立誓”或“叫你宣誓”。原文动词表示使某人起誓，使其受誓言约束。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 对他说
  rationale: 承接叙事次序；现代汉语通常不必把连接词另译为“然后”，上下文已能清楚表达推进关系。
- source_word: הַמֶּלֶךְ
  choice: 王
  rationale: 保留希伯来文所用的身份称谓，不以专名替代。
- source_word: עַד כַּמֶּה פְעָמִים
  choice: 还要……多少次
  rationale: 表达因一再发生而产生的不耐与责问，比直译“直到多少次”更符合现代汉语。
- source_word: מַשְׁבִּעֶךָ
  choice: 让你起誓
  rationale: שׁבע 的使役式表示使某人起誓或令其受誓言约束；此译清楚保留使役含义。
- source_word: אֲשֶׁר לֹא תְדַבֵּר אֵלַי רַק אֱמֶת
  choice: 你才会……只对我说实话
  rationale: 希伯来文采用“不可对我说……唯独真话”的限制结构；汉语以“只……说实话”自然表达同样的排他意义。“才会”传达反问中要求对方遵从誓言的语气。
- source_word: בְּשֵׁם יְהוָה
  choice: 奉雅威的名
  rationale: “奉……的名”表达借其名义、权柄并在其名下发言；“雅威”直接音译四字神名。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用神的专名。采用较贴近 Yahweh 读音的“雅威”，既保留专名性质，也避免以称号替代。
- issue: 誓言与说真话之间的句法关系
  choice: 你才会奉雅威的名，只对我说实话
  alternative: 叫你起誓，不可对我说别的，只能奉雅威的名说实话
  rationale: 采用自然的汉语反问句表达原文要求；不把“奉雅威的名”限制为仅修饰“起誓”，而按原文位置保留其与说真话的关联。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“还要……多少次”保留王责问、不耐的语气；“只对我说实话”清楚传达原文限制结构。
