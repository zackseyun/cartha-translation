base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/043.yaml
  text: He walked in all the ways of Asa his father[a]; he did not turn aside from them[b], doing what was right in the eyes of Yahweh.
translation:
  language: zh_hans
  text: 他完全遵行他父亲亚撒的道路[a]，毫不偏离，做耶和华眼中看为正的事[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译可作：“他走在他父亲亚撒所走的道路上。”这里的“道路”指生活和行事的方式。
    reason: lexical_alternative
  - marker: b
    text: 直译：“行耶和华眼中正的事”，意思是做耶和华看为正的事。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ בְּכָל דֶּרֶךְ
  choice: 完全遵行……的道路
  rationale: הלך与דרך共同构成以“行路”表达生活和行为方式的比喻。中文用“遵行……的道路”既保留道路意象，又自然表达效法某种行事模式；כָל在此表达全面性，译作“完全”。
- source_word: אָסָא אָבִיו
  choice: 他父亲亚撒
  rationale: 按现代汉语亲属称谓和专名的自然次序表达，清楚保留亚撒与主语的父子关系。
- source_word: לֹא סָר מִמֶּנּוּ
  choice: 毫不偏离
  rationale: סור意为转离、偏离，与前文的道路意象呼应。省去汉语中生硬的代词“它”，仍自然承接前述道路；“毫不”体现否定陈述的完整性而不增添新的评价。
- source_word: לַעֲשׂוֹת הַיָּשָׁר
  choice: 做……看为正的事
  rationale: 这是王室评语中的常见表达，直指行为符合正确标准；译文不把它扩展为更具体的宗教或政治主张。
- source_word: בְּעֵינֵי יְהוָה
  choice: 耶和华眼中看为
  rationale: 保留希伯来语“在……眼中”的评价意象，同时用现代汉语常见结构使句意清楚。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经语境中广为人知的神名音译，作为四字神名的专名表达，而非改译为一般称号。
theological_decisions:
- issue: 对王行为的评价公式
  choice: 保留经文对约沙法遵循亚撒道路并行耶和华眼中正事的肯定
  alternative: 概括为约沙法忠心或敬虔地作王
  rationale: 原文使用列王纪常见的王室评价语言，却未在本节具体界定“正”的全部内容；译文因此保留其道德与圣约评价，不加入经文未明说的神学概括。
- issue: מִמֶּנּוּ所指对象
  choice: 在中文中省略显式代词，以“毫不偏离”自然承接前述道路
  alternative: 明确译作“不偏离这道路”或理解为“不偏离他”
  rationale: 该阳性单数后缀最自然地回指前述单数“道路”，但其形式容许读者注意到语法张力；省略宾语符合汉语表达，也避免把原文可能存在的指代张力过度钉死。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“遵行……的道路”保留原文行路比喻；“耶和华眼中看为正”保留希伯来语评价惯用语，同时让普通读者容易理解。
