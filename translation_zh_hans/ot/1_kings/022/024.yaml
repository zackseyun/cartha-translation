  text: וַ/יִּגַּשׁ֙ צִדְקִיָּ֣הוּ בֶֽן כְּנַעֲנָ֔ה וַ/יַּכֶּ֥ה אֶת מִיכָ֖יְהוּ עַל הַ/לֶּ֑חִי וַ/יֹּ֕אמֶר אֵי זֶ֨ה עָבַ֧ר רֽוּחַ יְהוָ֛ה מֵ/אִתִּ֖/י לְ/דַבֵּ֥ר אוֹתָֽ/ךְ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/024.yaml
  text: Then Zedekiah son of Chenaanah came near and struck Micaiah on the cheek and said[a], “Which way did the Spirit of Yahweh pass from me to speak to you?”
translation:
  language: zh_hans
  text: 于是，基拿拿的儿子西底家走上前来，打了米该雅的脸颊，说：“雅威的灵离开我，去向你说话，是从哪条路过去的呢？”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּגַּשׁ
  choice: 走上前来
  rationale: 表达靠近、上前的动作，也自然呈现当面对质的语气。
- source_word: צִדְקִיָּהוּ בֶן־כְּנַעֲנָה
  choice: 基拿拿的儿子西底家
  rationale: 按希伯来语父名结构译出，并采用现代中文圣经人名的通行音译。
- source_word: וַיַּכֶּה ... עַל־הַלֶּחִי
  choice: 打了米该雅一记耳光
  rationale: 原文直指击打脸颊；在此对峙场景中，“一记耳光”比生硬的“打在脸颊上”更自然，同时未超出动作含义。
- source_word: אֵי זֶה עָבַר
  choice: 是走哪条路呢
  rationale: 保留“经过、走哪条路径”的形象和西底家的讥讽口吻，而不简化成泛指的“怎么”。
- source_word: רוּחַ יְהוָה
  choice: 耶和华的灵
  rationale: 此处指使先知发言的神之灵；“灵”保留神学指向，神名按现代中文广泛通行形式译为“耶和华”。
- source_word: מֵאִתִּי
  choice: 从我这里离开
  rationale: “从我这里”表达来源；补出“离开”使汉语中“走哪条路”的讥讽形象清楚，其概念已包含在“从……经过”之中。
- source_word: לְדַבֵּר אוֹתָךְ
  choice: 去跟你说话
  rationale: 自然表达灵转而向米该雅说话的方向关系；“跟你说话”符合现代口语化但仍端庄的叙事语体。
theological_decisions:
- issue: רוּחַ יְהוָה 是指神的灵，还是一般的风或气息
  choice: 耶和华的灵
  alternative: 耶和华的气息
  rationale: 上下文是先知权威之争，西底家讥讽地声称神的灵原在自己这里，后来才去向米该雅说话；译作“灵”最符合语境，但不替文本裁定两位先知谁的宣称真实。
- issue: 如何呈现西底家问题中的讥讽及路径意象
  choice: 从我这里离开、去跟你说话，是走哪条路呢
  alternative: 耶和华的灵怎么会离开我，去跟你说话呢
  rationale: 原文以“哪条路”和“经过”构成讥讽性问题。正文保留具体路径意象，避免把它释义为单纯质疑“怎么会”。
translation_notes:
  register: 采用现代、自然而庄重的叙事中文。“走上前来”体现对峙动作；直接引语保留带挑衅意味的反问。“一记耳光”清楚传达击打脸颊的动作。
