  text: And Jehoshaphat son of Asa became king over Judah in the fourth year of Ahab king of Israel.
translation:
  language: zh_hans
  text: 亚撒的儿子约沙法在以色列王亚哈作王的第四年登基作犹大王。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וִיהוֹשָׁפָט
  choice: 约沙法
  rationale: 人名按现代中文圣经通行译名音译。句首连接词 וַ/וִ 在这里承接前文；现代汉语叙事中直接起句更自然，其衔接作用可由上下文体现，不必机械译作“而”。
- source_word: בֶּן אָסָא
  choice: 亚撒的儿子
  rationale: 准确表达希伯来语属格结构，说明约沙法的父系身份，并采用通行人名“亚撒”。
- source_word: מָלַךְ
  choice: 登基，作……王
  rationale: 此处 Qal 完成式用于王朝纪年记述，重点是开始执掌王权。“登基”表达起始意义，“作犹大王”补明其统治对象。
- source_word: עַל־יְהוּדָה
  choice: 作犹大王
  rationale: 介词 עַל 与 מלך 连用，表示对犹大的统治。汉语用“作犹大王”比直译“在犹大之上作王”自然清楚。
- source_word: בִּשְׁנַת אַרְבַּע
  choice: 在……第四年
  rationale: 这是标准的君王纪年公式；“第四年”简洁、自然，无须增添原文没有明说的“在位”。
- source_word: לְאַחְאָב
  choice: 亚哈第四年
  rationale: 纪年公式中的 לְ 表示以亚哈的统治为纪年参照。中文将其自然表达为“亚哈第四年”。
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: 以色列王
  rationale: 作为“亚哈”的同位称号，译作“以色列王”符合现代中文惯用语序，也准确标明其王权所属。
theological_decisions: []
translation_notes:
  register: 采用庄重而清楚的现代标准汉语，并沿用中文圣经中约沙法、亚撒、亚哈等通行专名。句式保持王朝纪年记载的简洁性；“登基，作犹大王”兼顾原文动词的即位含义与 עַל־יְהוּדָה 所表达的统治关系。
