  text: Then the king of Israel said[a], “Take Micaiah and return him to Amon, the governor of the city, and to Joash the king’s son.”
translation:
  language: zh_hans
  text: 以色列王说：“把米该雅带走，送回城里的长官亚们和王的儿子约阿施那里。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: 未单独译出连接词וַ，以符合现代汉语叙事习惯；事件的先后关系由上下文自然体现。
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: 以色列王
  rationale: 忠实保留原文称号，不以具体人名“亚哈”替代。
- source_word: קַח
  choice: 把……带回去
  rationale: לקח的基本义为“拿、带”；结合后面的使役式שוב，在汉语中合译为“把……带回去”最自然，且不额外强化为“抓住”。
- source_word: מִיכָיְהוּ
  choice: 米该雅
  rationale: 采用现代中文圣经人名的通行译法。
- source_word: וַהֲשִׁיבֵהוּ
  choice: 带回去
  rationale: שוב的使役式表示“使他返回、把他带回”；“带回去”自然表达他将被送回原处或原先的管辖之下。
- source_word: אֶל אָמֹן
  choice: 交给……亚们
  rationale: 介词אֶל本义为“到、向”；在把人送回官员监管的语境中，汉语用“交给”更自然，也清楚表达两位接收者。
- source_word: שַׂר הָעִיר
  choice: 城里的长官
  rationale: שַׂר可指官长、统领或主要官员；“长官”保留其职务性质，同时避免武断限定为行政长官或军事统领。
- source_word: וְאֶל יוֹאָשׁ
  choice: 和……约阿施
  rationale: 保留第二位并列接收者；前面的“交给”同时支配两个人名，符合汉语表达。
- source_word: בֶּן הַמֶּלֶךְ
  choice: 王的儿子
  rationale: 直接传达原文亲属关系，不增译为带有正式头衔意味的“王子”。
theological_decisions: []
