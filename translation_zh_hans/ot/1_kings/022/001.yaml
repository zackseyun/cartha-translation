  yaml_path: translation/ot/1_kings/022/001.yaml
  text: For three years they remained without war between Aram and Israel[a][b].
translation:
  language: zh_hans
  text: 一连三年，亚兰和以色列之间没有战争。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “亚兰”是希伯来名称，一些译本译作“叙利亚”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשְׁבוּ
  choice: 一连
  rationale: ישׁב在这里与“三年”连用，表示某种状态持续了一段时间；结合后面的“没有战争”，译为“一连”自然地表达延续性，而不采用字面的“坐着”或“居住”。
- source_word: שָׁלֹשׁ שָׁנִים
  choice: 三年
  rationale: 这是表示时长的时间宾格；与“一连”搭配，清楚表达持续三年。
- source_word: אֵין מִלְחָמָה
  choice: 没有战争
  rationale: 直接保留希伯来文的否定存在结构，语言自然，也不把“没有战争”扩大解释为全面和平。
- source_word: בֵּין ... וּבֵין
  choice: ……和……之间
  rationale: 以现代汉语的标准关系结构表达希伯来文重复的介词בֵּין。
- source_word: אֲרָם
  choice: 亚兰
  rationale: 按希伯来专名音译，避免以较后的地缘名称“叙利亚”替代。
- source_word: יִשְׂרָאֵל
  choice: 以色列
  rationale: 采用该专名在现代中文圣经语境中的通行译名。
