  text: וְ/עַתָּ֗ה הִנֵּ֨ה נָתַ֤ן יְהוָה֙ ר֣וּחַ שֶׁ֔קֶר בְּ/פִ֖י כָּל נְבִיאֶ֣י/ךָ אֵ֑לֶּה וַֽ/יהוָ֔ה דִּבֶּ֥ר עָלֶ֖י/ךָ רָעָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/023.yaml
  text: And now[a], behold, Yahweh has put a lying spirit in the mouth of all these prophets of yours[b], and Yahweh has spoken disaster against you.
translation:
  language: zh_hans
  text: 现在，看哪，耶和华已把说谎的灵[a]放在你这些先知的口中；耶和华已宣告灾祸要临到你[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“谎言之灵”或“虚假之灵”。
    reason: lexical_alternative
  - marker: b
    text: “灾祸”也可译作“灾难”。这里指审判所带来的祸患，并非道德意义上的“恶”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: 现在
  rationale: 承接前文并转入眼前结论；现代汉语中“现在”已能自然表达希伯来语连词与时间指示的合力，无须生硬译作“而现在”。
- source_word: הִנֵּה
  choice: 看哪
  rationale: 保留提醒听者郑重注意的先知性语气；比“看”更庄重，也比完全省略更贴近原文。
- source_word: נָתַן
  choice: 已把……放进
  rationale: 按原文直接表达耶和华的主动作为，不弱化为“容许”；与“灵”和“口中”的搭配在汉语中也清楚自然。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代简体中文圣经语境中广为人知的神名译法。
- source_word: רוּחַ שֶׁקֶר
  choice: 谎言之灵
  rationale: 保留构造短语的形式及其可能张力，既可理解为说谎的灵，也可理解为以虚假为特征的灵；脚注列出更具施事色彩的译法。
- source_word: בְּפִי כָּל נְבִיאֶיךָ אֵלֶּה
  choice: 放进你这些先知众人的口中
  rationale: 保留“口中”的希伯来语言说意象、“这些”的指示强调及第二人称所属关系；“众人”体现单数“口”对整个复数组群的分配性用法。
- source_word: דִּבֶּר עָלֶיךָ רָעָה
  choice: 已经宣告灾祸临到你
  rationale: דבר在此是发出具有确定性的审判之言；רעה在语境中指有害的审判结果。“灾祸临到你”比直译“对你说灾祸”更符合现代汉语，同时保留宣告而非另加“命定”等解释。
theological_decisions:
- issue: 耶和华与谎言之灵之间的行动关系
  choice: 耶和华已把谎言之灵放进……口中
  alternative: 耶和华容许谎言之灵进入……口中
  rationale: 希伯来语 נָתַן 直接陈述神的行动，译文不以“容许”或“准许”缓和其力度，从而保留原文有关神主权与欺骗媒介之间的神学张力。
- issue: רָעָה用于耶和华审判行动时的含义
  choice: 灾祸
  alternative: 恶事；灾难
  rationale: 此处指向亚哈的有害审判结局，并非断言耶和华施行道德上的邪恶。“灾祸”既准确传达审判语境，也不消除原文严厉的负面力量。
- issue: רוּחַ שֶׁקֶר的语法与施事含义
  choice: 谎言之灵
  alternative: 说谎的灵；虚假之灵
  rationale: 构造短语可表达以虚假或谎言为特征的灵；正文保留较形式对应且庄重的表达，脚注呈现更明确的施事性译法，避免过度限定。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“看哪”保留先知宣告的郑重语体；其余句法力求自然。“你这些先知众人”带有原文指向亚哈的强调，但不额外加入贬义。所有脚注标记均已置于正文相应位置。
