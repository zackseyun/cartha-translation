source:
  edition: WLC
  text: וַ/יִּקְבֹּ֨ץ מֶֽלֶךְ יִשְׂרָאֵ֥ל אֶֽת הַ/נְּבִיאִים֮ כְּ/אַרְבַּ֣ע מֵא֣וֹת אִישׁ֒ וַ/יֹּ֣אמֶר אֲלֵ/הֶ֗ם הַ/אֵלֵ֞ךְ עַל רָמֹ֥ת גִּלְעָ֛ד לַ/מִּלְחָמָ֖ה אִם אֶחְדָּ֑ל וַ/יֹּאמְר֣וּ עֲלֵ֔ה וְ/יִתֵּ֥ן אֲדֹנָ֖/י בְּ/יַ֥ד הַ/מֶּֽלֶךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/006.yaml
  text: Then the king of Israel gathered the prophets[a], about four hundred men, and said to them, “Should I go against Ramoth-gilead for battle, or should I refrain?” And they said, “Go up, and the Lord will give it into the hand of the king.”
translation:
  language: zh_hans
  text: 以色列王召集了众先知，约有四百人，问他们：“我该上去攻打基列的拉末，还是作罢呢？”他们回答：“上去吧！主[a]必把它交在王手中。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我主必把它交在王手中。”希伯来语אֲדֹנָי在某些语境中可理解为“我主”，但此处更可能是对上帝的称呼“主”。
    reason: 保留אֲדֹנָי可能作普通尊称“我主”的另一种理解，同时说明正文所采神圣称号的读法。
lexical_decisions:
- source_word: וַיִּקְבֹּץ
  choice: 召集
  rationale: קבץ在此指把人聚集起来；“召集”自然地体现王召来众先知问话的语境。
- source_word: הַנְּבִיאִים
  choice: 众先知
  rationale: נְבִיאִים的标准译法；“众”与后文约四百人的群体相称。
- source_word: כְּאַרְבַּע מֵאוֹת אִישׁ
  choice: 约有四百人
  rationale: 前缀כְּ表示约数，因此不用精确的“四百人”。
- source_word: הַאֵלֵךְ
  choice: 我该上去
  rationale: 疑问词与第一人称未完成式构成征询、斟酌性的问句；“我该……”符合现代汉语表达。
- source_word: עַל רָמֹת גִּלְעָד לַמִּלְחָמָה
  choice: 攻打基列的拉末
  rationale: עַל与战争语境表明军事行动以基列的拉末为目标；“攻打”简洁自然，也传达לַמִּלְחָמָה的战争含义。
- source_word: אִם אֶחְדָּל
  choice: 还是作罢呢
  rationale: חדל表示停止、不再进行；“作罢”保留王在出战与放弃行动之间斟酌的语气。
- source_word: עֲלֵה
  choice: 上去吧
  rationale: 保留עלה常见的军事用语“上去”，并以“吧”体现先知回答中的劝进语气。
- source_word: אֲדֹנָי
  choice: 主
  rationale: 马所拉文本的读音通常是对上帝的称呼“主”，而不是神名יהוה；不译作带特殊排印的“耶和华”。另一种“我主”的理解收入脚注。
- source_word: בְּיַד הַמֶּלֶךְ
  choice: 交在王手中
  rationale: 保留“在……手中”这一表示落入某人权势或控制之下的希伯来语习语，现代读者也容易理解。
theological_decisions:
- issue: 先知回答中אֲדֹנָי的所指
  choice: 主
  alternative: 我主
  rationale: 按马所拉读音和神谕式语境，此处更可能是对上帝的称呼“主”；但该词在某些语境也可指“我主”，故不消除这一真实的词义可能性，而在脚注中保留。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“基列的拉末”沿用清楚易懂的地名结构；问句用“我该……还是……”呈现征询语气，回答则简洁有力。脚注标记紧随其实际所释的“主”。
