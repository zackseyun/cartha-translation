  text: וַ/יִּשְׁטֹ֨ף אֶת הָ/רֶ֜כֶב עַ֣ל בְּרֵכַ֣ת שֹׁמְר֗וֹן וַ/יָּלֹ֤קּוּ הַ/כְּלָבִים֙ אֶת דָּמ֔/וֹ וְ/הַ/זֹּנ֖וֹת רָחָ֑צוּ כִּ/דְבַ֥ר יְהוָ֖ה אֲשֶׁ֥ר דִּבֵּֽר־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/038.yaml
  text: And they washed the chariot at the pool of Samaria[a], and the dogs licked up his blood, and the prostitutes washed there, according to the word of Yahweh that he had spoken.
translation:
  language: zh_hans
  text: 有人在撒马利亚的池旁冲洗战车；狗舔了他的血，妓女们也在那里洗浴[a]，正如雅威所说的那样。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“妓女们也洗了自己”或“洗澡”。希伯来文动词没有明说所洗的对象。
    reason: 保留רָחָצוּ未明示宾语所形成的词义和句法含混。
lexical_decisions:
- source_word: וַיִּשְׁטֹף
  choice: 有人……冲洗
  rationale: 该动词为第三人称阳性单数，但没有明说施事者；现代汉语用“有人”自然表达这种不定施事，且不把它误解为亚哈本人所做。
- source_word: הָרֶכֶב
  choice: 战车
  rationale: 上下文所指是亚哈染血的那辆战车；汉语在已有语境中无须另加指示词。
- source_word: עַל בְּרֵכַת שֹׁמְרוֹן
  choice: 在撒马利亚的池旁
  rationale: עַל在此表示洗车地点；“池旁”比字面化的“池上”自然，也与场景相符。
- source_word: וַיָּלֹקּוּ הַכְּלָבִים אֶת דָּמוֹ
  choice: 狗舔了他的血
  rationale: 保留动词“舔”和“他的血”；汉语完成体“了”符合叙事中的已成事件。
- source_word: וְהַזֹּנוֹת רָחָצוּ
  choice: 妓女们也在那里洗浴
  rationale: זוֹנוֹת直译为“妓女”；רָחָצוּ没有明说宾语，可指洗浴或洗自己。正文采用自然但不过度细化的“洗浴”，并以脚注保留其句法含混。
- source_word: כִּדְבַר יְהוָה אֲשֶׁר דִּבֵּר
  choice: 正如雅威所说的话
  rationale: 保留先知话语得到实现的对应公式，并按要求将יהוה译为“雅威”。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；“雅威”以现代汉语音译呈现该盟约之名，不以称号替代。
- issue: וְהַזֹּנוֹת רָחָצוּ中洗的对象
  choice: 妓女们也在那里洗浴
  alternative: 妓女们也洗了自己；妓女们也洗澡
  rationale: 希伯来文明确以“妓女们”为主语，却没有明说宾语。正文不补出确定宾语，脚注说明可能的反身理解，以保留原文的解释张力。
translation_notes:
  register: 采用现代、庄重而通顺的叙事文体。“有人……冲洗”处理未明说的施事者；分号区分洗车场景与随后发生的事项。脚注标记紧随其实际说明的“洗浴”之后。
