source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר֙ יְה֣וֹשָׁפָ֔ט הַ/אֵ֨ין פֹּ֥ה נָבִ֛יא לַ/יהוָ֖ה ע֑וֹד וְ/נִדְרְשָׁ֖ה מֵ/אוֹתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/007.yaml
  text: But Jehoshaphat said[a], “Is there not still here a prophet of Yahweh, that we may inquire of him?”
translation:
  language: zh_hans
  text: 约沙法却说[a]：“这里不是还有一位雅威的先知吗？让我们求问他吧。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“约沙法说：‘这里不是还另有一位雅威的先知吗？让我们求问他吧。’”
    reason: 连接词可作一般叙事承接；עוֹד 在本语境中也可理解为“另有一位”。
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 却说
  rationale: 叙事连接词 וַ 在本段语境中带出约沙法与先前众先知之言相对的回应；“却说”自然表达这种转折，同时保留叙事推进。
- source_word: יְהוֹשָׁפָט
  choice: 约沙法
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: הַאֵין
  choice: 不是……吗
  rationale: 否定疑问句期待或寻求肯定回答；“不是……吗”在现代汉语中既自然，也保留原文语气。
- source_word: פֹּה
  choice: 这里
  rationale: 准确表达地点副词“在这里”。
- source_word: נָבִיא לַיהוָה
  choice: 一位雅威的先知
  rationale: לַיהוָה 表示先知与雅威的归属或代表关系；“雅威的先知”简明自然，不额外限定其职能。
- source_word: עוֹד
  choice: 还
  rationale: 可表示仍然存在或尚有；在语境中也可能暗含“另一位”，正文用“还”保留这种开放性。
- source_word: וְנִדְרְשָׁה
  choice: 我们可以求问
  rationale: 第一人称复数祈愿式表达意愿或目的；“我们可以求问”接续前面的疑问句自然，并传达共同寻求答复之意。
- source_word: מֵאוֹתוֹ
  choice: 求问他
  rationale: 介词 מִן 字面有“从他那里”之意；中文“求问他”是自然表达，保留先知作为答复来源或中介的关系，而不将其明确解释为求问的最终对象。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名 יהוה；“雅威”较贴近其通常重构的读音，并明确保留专名性质，不以称号替代。
- issue: 求问对象与先知的中介角色
  choice: 求问他
  alternative: 借着他求问
  rationale: מֵאוֹתוֹ 可直译为“从他那里”，语境指通过先知获得神谕。“求问他”贴近希伯来语结构且中文自然；不增添“借着”，以免正文过度解释中介关系。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“却说”体现上下文转折；否定疑问句保留原文寻求确认的语气。正文中的脚注标记与脚注一一对应。
