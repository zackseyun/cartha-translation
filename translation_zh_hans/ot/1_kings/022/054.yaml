  text: וַֽ/יַּעֲבֹד֙ אֶת הַ/בַּ֔עַל וַ/יִּֽשְׁתַּחֲוֶ֖ה ל֑/וֹ וַ/יַּכְעֵ֗ס אֶת יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל כְּ/כֹ֥ל אֲשֶׁר עָשָׂ֖ה אָבִֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/054.yaml
  text: He served Baal and bowed down to him[a], and he provoked Yahweh, the God of Israel, just as his father had done.
translation:
  language: zh_hans
  text: 他事奉巴力，向他俯伏下拜[a]，惹雅威——以色列的神——发怒；他也照着他父亲所做的一切去做。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“敬拜他”；希伯来语动词字面指屈身或俯伏下拜。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲבֹד
  choice: 事奉
  rationale: עבד的基本义是“服事”；在偶像崇拜语境中指宗教性的侍奉。“事奉”既保留其词义，也与下文具体的下拜动作相区分。
- source_word: הַבַּעַל
  choice: 巴力
  rationale: 此处指名为巴力的神祇；现代中文通常直接音译为“巴力”，不另行表达希伯来语冠词。
- source_word: וַיִּשְׁתַּחֲוֶה לוֹ
  choice: 向他俯伏下拜
  rationale: שׁחה表示屈身、俯伏，常用作敬拜行为。“俯伏下拜”保留具体动作，也不把它与前面的“事奉”合并。
- source_word: וַיַּכְעֵס
  choice: 惹……发怒
  rationale: כעס的使役形表示使某人发怒；“惹……发怒”在现代中文中自然，并清楚表达使役关系。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以常见的现代中文音译呈现以色列之神的专名，不以称号替代。
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: 以色列的神
  rationale: 直接表达希伯来语附属结构，并说明雅威与以色列的关系。
- source_word: כְּכֹל אֲשֶׁר עָשָׂה אָבִיו
  choice: 完全照他父亲所做的行
  rationale: 保留כְּכֹל“照着一切”的整体性；此处“行”作动词，使中文简洁而庄重。
theological_decisions:
- issue: 如何翻译神名יהוה
  choice: 雅威
  alternative: 耶和华
  rationale: 本节将以色列的神与巴力形成对照；采用“雅威”可明确呈现原文中的专名，并避免以“主”等称号替代。
- issue: 下拜动作是否直接译为敬拜
  choice: 向他俯伏下拜
  alternative: 敬拜他
  rationale: 原词既描述身体俯伏，也可在语境中表达敬拜。正文保留具体动作，脚注说明其功能性译法，从而不消除原文的词义层次。
translation_notes:
  register: 采用现代、庄重且易懂的书面汉语。“事奉”符合宗教语境；破折号标明“以色列的神”是对“雅威”的同位说明。
