base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/051.yaml
  text: And Jehoshaphat slept with his fathers and was buried with his fathers in the city of David his father[b][a], and Jehoram his son became king in his place.
translation:
  language: zh_hans
  text: 约沙法与他的列祖同眠[a]，也与他的列祖一同葬在他祖先大卫的城中[b]；他的儿子约兰接替他作王。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “与列祖同眠”是希伯来文表示死亡的惯用说法。
    reason: lexical_alternative
  - marker: b
    text: 原文直译“他父亲”；希伯来宗谱用语中的“父亲”也可指祖先或先祖。
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּשְׁכַּב עִם אֲבֹתָיו
  choice: 与他的列祖同眠
  rationale: 这是王室讣告中的惯用表达，指死亡；保留希伯来文的文学意象，并用脚注说明其含义。
- source_word: וַיִּקָּבֵר עִם אֲבֹתָיו
  choice: 葬在他祖先……的城里
  rationale: נפעל式自然表达为被安葬；中文用主动形式“葬在”更自然，而“祖先”传达 אבות 在宗族语境中的集合意义。
- source_word: בְּעִיר דָּוִד
  choice: 在……大卫的城里
  rationale: 准确保留“城—大卫”的属格关系；结合后置的 אָבִיו，在中文中调整语序以自然表达。
- source_word: אָבִיו
  choice: 他祖先
  rationale: 此处大卫并非约沙法的生父；אָב 在希伯来宗谱用语中可指先祖。译作“祖先”可避免现代读者误解，同时以脚注保留原文直译信息。
- source_word: וַיִּמְלֹךְ יְהוֹרָם בְּנוֹ תַּחְתָּיו
  choice: 他的儿子约兰接替他作王
  rationale: וַיִּמְלֹךְ 与 תַּחְתָּיו 合起来表达王位继承；“接替他作王”比单说“统治”更准确、自然。
theological_decisions:
- issue: “睡眠”是否暗示特定的死后状态教义
  choice: 保留“同眠”作为希伯来王室讣告惯语，并注明是死亡的委婉说法
  alternative: 直接译为“死了”
  rationale: 原文的习语本身不在此明确界定死后状态；保留意象但加以说明，可避免导入额外教义判断。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“列祖同眠”保留王室讣告公式的文学色彩；“接替他作王”清楚表达继位。脚注标记按其所解释内容排列。
