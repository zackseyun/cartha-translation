  text: וַ/יִּקְרָא֙ מֶ֣לֶךְ יִשְׂרָאֵ֔ל אֶל סָרִ֖יס אֶחָ֑ד וַ/יֹּ֕אמֶר מַהֲרָ֖/ה מִיכָ֥יְהוּ בֶן יִמְלָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/009.yaml
  text: Then the king of Israel called one officer and said[a], “Bring Micaiah son of Imlah quickly.”
translation:
  language: zh_hans
  text: 于是，以色列王召来一名宫廷官员[a]，说：“快把音拉的儿子米该雅带来。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语“סָרִיס”可指“太监”，也可泛指宫廷官员；这里较可能是后一种意思。
    reason: 保留原词的词义范围，避免正文把该人的生理身份确定下来。
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: 召来
  rationale: קרא 在此叙事语境中表示叫来或召唤某人；“召来”既体现王的命令语气，也符合现代汉语叙事表达。
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: 以色列王
  rationale: 这是表明说话者身份的名词组合；译为“以色列王”简洁自然。
- source_word: אֶל סָרִיס אֶחָד
  choice: 一名宫廷官员
  rationale: סָרִיס 既可指受阉割者，也可泛指王室官员。此处重点在其奉王命办事的宫廷职能，故正文采用“一名宫廷官员”，并以脚注保留另一词义。
- source_word: מַהֲרָה
  choice: 快把……带来
  rationale: מַהֲרָה 表达急迫之意。希伯来文没有另写“带来”这一动词，但上下文中的命令隐含了这一动作；汉语补出“带来”更自然清楚。
- source_word: מִיכָיְהוּ
  choice: 米该雅
  rationale: 采用现代中文圣经语境中通行且易于辨认的人名译法。
- source_word: בֶן יִמְלָה
  choice: 音拉的儿子
  rationale: 按希伯来文父名结构直接译出，保留人物身份信息。
