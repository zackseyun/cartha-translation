base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/002.yaml
  text: He reigned three years in Jerusalem[b][a], and his mother’s name was Maacah daughter of Abishalom.
translation:
  language: zh_hans
  text: 他在耶路撒冷作王三年。他母亲名叫玛迦，是亚比沙龙的女儿[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “女儿”在希伯来语谱系语境中有时也可泛指女性后裔。
    reason: alternative_reading
lexical_decisions:
- source_word: שָׁלֹשׁ שָׁנִים
  choice: 三年
  rationale: 基数词加复数名词表示在位时长；现代汉语简洁表达为“三年”。
- source_word: מָלַךְ
  choice: 作王
  rationale: 此处 Qal 形式表示施行王权、在位统治，而非登基这一动作；“作王”准确且符合《列王纪》的叙事语体。
- source_word: בִּירוּשָׁלִָם
  choice: 在耶路撒冷
  rationale: 介词 בְּ 表示地点；“在耶路撒冷”是自然的现代汉语表达。
- source_word: וְשֵׁם אִמּוֹ
  choice: 他母亲名叫
  rationale: 保留君王纪事中介绍母亲姓名的固定信息，同时采用自然流畅的现代汉语句式。
- source_word: מַעֲכָה
  choice: 玛迦
  rationale: 按中文圣经人名的通行音译处理。
- source_word: בַּת
  choice: 女儿
  rationale: בַּת 的直接词义是“女儿”；谱系语境中可能泛指女性后裔，但不在正文中替原文消除这一歧义。
- source_word: אֲבִישָׁלוֹם
  choice: 亚比沙龙
  rationale: 依此处希伯来语名字形式 אֲבִישָׁלוֹם 音译；中文“亚比沙龙”也保留了其中的 -בי- 音节，有别于通行的“押沙龙”。
theological_decisions:
- issue: 谱系表达 בַּת אֲבִישָׁלוֹם 的亲属范围
  choice: 正文译作“亚比沙龙的女儿”
  alternative: 亚比沙龙的孙女或女性后裔
  rationale: 原文明确使用“女儿”一词，因此正文保留其直接含义；希伯来谱系用语有时可指较广义的后裔，这一可能性以脚注说明，不在正文中武断解决。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“作王三年”沿用中文圣经历史书中自然且明确的君王纪事表达。人名按原文形式译为“亚比沙龙”，不另设仅服务于英语名称差异的脚注。
