  text: כִּ֚י לְמַ֣עַן דָּוִ֔ד נָתַן֩ יְהוָ֨ה אֱלֹהָ֥י/ו ל֛/וֹ נִ֖יר בִּ/ירוּשָׁלִָ֑ם לְ/הָקִ֤ים אֶת בְּנ/וֹ֙ אַחֲרָ֔י/ו וּֽ/לְ/הַעֲמִ֖יד אֶת יְרוּשָׁלִָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/004.yaml
  text: Nevertheless[a], for David’s sake Yahweh his God gave him a lamp in Jerusalem, to raise up his son after him and to establish Jerusalem.
translation:
  language: zh_hans
  text: 然而，因大卫的缘故，雅威他的上帝在耶路撒冷赐给他一盏灯[a]，使他的儿子接续他，并使耶路撒冷得以坚立。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“光”。“在耶路撒冷赐给他一盏灯”是一个比喻，指大卫的王室后裔在那里得以延续。
    reason: 说明词义选择及其隐喻含义，同时保留“光”这一可能译法。
lexical_decisions:
- source_word: כִּי
  choice: 然而
  rationale: 本词常可表示“因为”，但在此承接上文对亚比央罪行的叙述，语篇作用带有转折意味；“然而”自然表达他虽犯罪，大卫王室却未被断绝的张力。
- source_word: לְמַעַן דָּוִד
  choice: 因大卫的缘故
  rationale: לְמַעַן与人名连用，表示上帝因某人的缘故而采取行动；此译法自然，也不额外阐明其背后的盟约含义。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语音译保留希伯来文本中的上帝专名，而不以称号替代。
- source_word: אֱלֹהָיו
  choice: 他的上帝
  rationale: 保留原文第三人称所属关系，不在正文中明确代词究竟指亚比央还是大卫。
- source_word: נִיר
  choice: 一盏灯
  rationale: 保留原文具体的“灯”这一意象；在本节中它隐喻大卫王室后裔得以延续，但不宜在正文中直接改译为“王朝”或“后裔”。
- source_word: בִּירוּשָׁלָם
  choice: 在耶路撒冷
  rationale: 自然表达介词ב的地点含义。
- source_word: לְהָקִים אֶת בְּנוֹ אַחֲרָיו
  choice: 使他的儿子接续他
  rationale: הקים的使役形与אַחֲרָיו共同表达儿子在其后兴起并承继王位；“接续他”以自然汉语呈现这一王位承继关系。
- source_word: וּלְהַעֲמִיד אֶת יְרוּשָׁלָם
  choice: 并使耶路撒冷坚立
  rationale: העמיד的使役形表示使之站立、维持或确立；“坚立”保留这一形象及其持续稳固之意，同时仍以耶路撒冷为明示宾语。
theological_decisions:
- issue: נִיר与大卫之约的隐喻关系
  choice: 正文保留“一盏灯”的隐喻
  alternative: 直接译作“王朝”“后裔”或“光”
  rationale: “灯”既指向大卫王室的延续，也保留与其他相关经文的互文呼应；脚注解释其语境意义，而正文不将隐喻扁平化。
- issue: “他的上帝”中代词的指向
  choice: 保留“他的上帝”
  alternative: 明确译作“亚比央的上帝”或“大卫的上帝”
  rationale: 希伯来文仅使用第三人称所属后缀；上下文较自然地指向当时所论的君王亚比央，但正文维持原有措辞，避免过度限定。
- issue: 耶路撒冷作为末句宾语的含义
  choice: 保留城市名称“耶路撒冷”
  alternative: 解释性地译为“以耶路撒冷为中心的国度”
  rationale: 城市可能转喻以其为中心的大卫王国，但原文明确说耶路撒冷，因此正文不把转喻解释直接写入。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“因大卫的缘故”“接续他”“坚立”具有经文语体的凝练感，但仍可为普通现代读者理解；代词和“灯”的隐喻均依原文保留。
