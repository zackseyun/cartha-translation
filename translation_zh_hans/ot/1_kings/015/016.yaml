  yaml_path: translation/ot/1_kings/015/016.yaml
  text: And there was war between Asa and Baasha king of Israel all their days[a].
translation:
  language: zh_hans
  text: 亚撒和以色列王巴沙之间一直有战争，贯穿他们所有的日子。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“他们所有的日子”；也可译作“贯穿他们的日子”或“他们一生的日子”。此习语的具体时间范围未明说。
    reason: 保留希伯来语时间习语的字面形式及其范围上的含混。
lexical_decisions:
- source_word: וּמִלְחָמָה הָיְתָה
  choice: 彼此一直争战
  rationale: 原文是“有战争”的存在句；结合表示持续时段的“他们一切的日子”，现代汉语用“彼此一直争战”更自然，也保留持续敌对的含义。
- source_word: בֵּין אָסָא וּבֵין בַּעְשָׁא
  choice: 亚撒和……巴沙……彼此
  rationale: 成对介词表示双方之间的相互敌对；汉语以“和……彼此”自然表达。
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: 以色列王
  rationale: 按希伯来语组合关系，作为巴沙的身份称谓译为“以色列王”。
- source_word: כָּל יְמֵיהֶם
  choice: 在世的日子
  rationale: 原文字面为“他们一切的日子”。正文采用自然的汉语习语，同时不明确限定为统治期间。脚注保留字面表达及其可能范围。
theological_decisions:
- issue: “他们一切的日子”所指的范围
  choice: 正文译作“在世的日子”，不限定为在位时期
  alternative: 他们在位的年日；他们一生的日子
  rationale: 希伯来语本身只说“他们一切的日子”，语境可能着眼于二人同时执政的时期，但原文没有明说“在位”；因此不把该解释写入正文，并以脚注说明字面形式。
translation_notes:
  register: 采用庄重而通顺的现代标准普通话。“彼此一直争战”比生硬的“有战争在……之间”更符合现代汉语；人名使用通行圣经译名“亚撒”“巴沙”。
