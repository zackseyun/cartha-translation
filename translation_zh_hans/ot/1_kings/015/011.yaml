  text: וַ/יַּ֧עַשׂ אָסָ֛א הַ/יָּשָׁ֖ר בְּ/עֵינֵ֣י יְהוָ֑ה כְּ/דָוִ֖ד אָבִֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/011.yaml
  text: Asa did what was right in the eyes of Yahweh[a], as David his father had done.
translation:
  language: zh_hans
  text: 亚撒行雅威眼中看为正的事，正如他祖先大卫所行的。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译“正如他父亲大卫所行的”；这里的“父亲”是王朝谱系用语，指祖先，并非生父。
    reason: 说明אָבִיו的字面形式及其在王朝语境中的祖先义，避免亲属关系上的误解。
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: 行……的事
  rationale: עָשָׂה基本义为“做、行”；与הַיָּשָׁר连用时，译作“行……看为正的事”符合现代汉语，也保留君王评语的行动意味。
- source_word: אָסָא
  choice: 亚撒
  rationale: 采用现代中文圣经中通行的人名音译。
- source_word: הַיָּשָׁר
  choice: 看为正的事
  rationale: יָשָׁר可指“正、正直”；在此与“行”组成道德评价，译为“看为正的事”自然清楚，并与后面的“耶和华眼中”衔接。
- source_word: בְּעֵינֵי
  choice: 眼中
  rationale: 保留希伯来语“在……眼中”的评价性隐喻；现代汉语可以自然理解为“在……看来”。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代简体中文读者熟悉的形式音译四字神名，保留其作为专名的性质，不以称号替代。
- source_word: כְּדָוִד
  choice: 像……大卫一样
  rationale: 前缀כְּ表示比较；“像……一样”准确而自然。
- source_word: אָבִיו
  choice: 他祖先
  rationale: אָב既可指父亲，也可指先祖。大卫并非亚撒的生父，此处是王朝谱系用语；正文采用“祖先”可避免现代读者误解，同时脚注交代原文直译。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用神的专名；中文正文保留专名，并采用普通现代读者最熟悉的传统音译“耶和华”，而不改译为“主”。
- issue: “他父亲大卫”的谱系含义
  choice: 正文译作“他祖先大卫”
  alternative: 他父亲大卫
  rationale: 原文אָבִיו字面可译“他父亲”，但在这里指王朝先祖，而非直接父亲。译作“祖先”明确实际关系；脚注保留原文字面表达及其王朝含义。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。保留“眼中”的希伯来语意象；将王朝语境中的“父亲”在正文明确为“祖先”，并以脚注保存原文字面表达。
