id: 1KI.15.29
reference: 1 Kings 15:29
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יְהִ֣י כְ/מָלְכ֗/וֹ הִכָּה֙ אֶת כָּל בֵּ֣ית יָרָבְעָ֔ם לֹֽא הִשְׁאִ֧יר כָּל נְשָׁמָ֛ה לְ/יָרָבְעָ֖ם עַד הִשְׁמִד֑/וֹ כִּ/דְבַ֣ר יְהוָ֔ה אֲשֶׁ֣ר דִּבֶּ֔ר בְּ/יַד עַבְדּ֖/וֹ אֲחִיָּ֥ה הַ/שִּׁילֹנִֽי־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/029.yaml
  text: And when he became king[a], he struck down all the house of Jeroboam. He did not leave to Jeroboam a single living thing, until he had destroyed him[b], according to the word of Yahweh that he had spoken by the hand of his servant Ahijah the Shilonite.
translation:
  language: zh_hans
  text: 他一登基，就击杀耶罗波安全家所有的人，没有给耶罗波安留下一个活口[a]，直到将他除灭[b]；这正如雅威借着他仆人示罗人亚希雅所说的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“没有留下任何气息”，意思是没有留下一个活人。
    reason: 说明希伯来语נְשָׁמָה的字面意象及其惯用含义。
  - marker: b
    text: 或译“直到把耶罗波安家除灭”。原文用阳性单数代词，也可能把耶罗波安家视为一个整体。
    reason: 保留并解释עַד הִשְׁמִידוֹ所指对象的语法歧义。
lexical_decisions:
- source_word: וַיְהִי כְמָלְכוֹ
  choice: 他一作王
  rationale: 将希伯来叙事公式和时间结构自然译出，表达巴沙登基后随即采取行动的语境。
- source_word: הִכָּה
  choice: 击杀
  rationale: נכה在此处指以暴力杀灭王室成员；“击杀”既保留动作力度，也符合现代汉语的庄重叙事语体。
- source_word: אֶת כָּל בֵּית יָרָבְעָם
  choice: 耶罗波安全家
  rationale: “家”在王室语境中兼有家庭与王朝的含义；“全家”简洁自然，并保留集体意义。
- source_word: לֹא הִשְׁאִיר כָּל נְשָׁמָה
  choice: 没有……留下一个活口
  rationale: נְשָׁמָה本义涉及气息，此处是“没有留下任何活人”的惯用表达。“一个活口”在现代汉语中自然明确，字面意象另收入脚注。
- source_word: לְיָרָבְעָם
  choice: 给耶罗波安
  rationale: 保留ל所表达的归属、关联关系，即没有给耶罗波安留下任何属于其家族或后裔的幸存者。
- source_word: עַד הִשְׁמִידוֹ
  choice: 直到把他灭尽
  rationale: 保留原文阳性单数后缀的形式及其潜在歧义；“他”可表面指耶罗波安，也可按集体用法指其家族。
- source_word: כִּדְבַר יְהוָה
  choice: 正如雅威……所说的话
  rationale: 译出预言应验公式“照雅威的话”，同时用自然汉语调整句序。
- source_word: יְהוָה
  choice: 雅威
  rationale: 采用希伯来神名四字母的现代汉语音译，保留其作为专名的性质，而不以称号替代。
- source_word: אֲשֶׁר דִּבֶּר בְּיַד עַבְדּוֹ
  choice: 借着他仆人……所说的话
  rationale: בְיַד字面为“借……的手”，在先知传话公式中表示媒介；“借着”准确且符合现代汉语。
- source_word: אֲחִיָּה הַשִּׁילֹנִי
  choice: 示罗人亚希雅
  rationale: 按现代中文圣经人名、地名习惯音译，并将所属地表达为“示罗人”。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用以色列神的专名；“雅威”较直接反映学界通常重构的读音，并避免以“主”等称号代替专名。
- issue: עַד הִשְׁמִידוֹ中单数代词的所指
  choice: 把他灭尽
  alternative: 把耶罗波安家灭尽
  rationale: 原文使用阳性单数后缀，语法上可回指耶罗波安，但语境中实际遭灭绝的是他的家族。正文保留单数形式，脚注说明集体所指，不替原文消除张力。
translation_notes:
  register: 采用庄重而清楚的现代标准普通话。“一作王”“击杀”“活口”“灭尽”保持历史叙事的力度；“借着”则自然呈现先知作为传话媒介的含义。正文中的[a]、[b]均与相应脚注准确对应。
