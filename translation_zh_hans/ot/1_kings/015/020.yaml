  text: וַ/יִּשְׁמַ֨ע בֶּן הֲדַ֜ד אֶל הַ/מֶּ֣לֶךְ אָסָ֗א וַ֠/יִּשְׁלַח אֶת שָׂרֵ֨י הַ/חֲיָלִ֤ים אֲשֶׁר ל/וֹ֙ עַל עָרֵ֣י יִשְׂרָאֵ֔ל וַ/יַּךְ֙ אֶת עִיּ֣וֹן וְ/אֶת דָּ֔ן וְ/אֵ֖ת אָבֵ֣ל בֵּֽית מַעֲכָ֑ה וְ/אֵת֙ כָּל כִּנְר֔וֹת עַ֖ל כָּל אֶ֥רֶץ נַפְתָּלִֽי־־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/020.yaml
  text: Ben-hadad listened to King Asa and sent the commanders of the armies that were his against the cities of Israel[a], and he struck Ijon, Dan, Abel-beth-maacah, and all Chinneroth[b], against all the land of Naphtali.
translation:
  language: zh_hans
  text: 便·哈达听从了亚撒王，就派他手下的军队统帅攻打以色列的城邑[a]。他攻击了以云、但、亚伯·伯·玛迦、基尼烈全境[b]，以及拿弗他利全地。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “听从”也可译作“听了亚撒王的话”。原文习语含有听取请求并照办的意思。
    reason: lexical_alternative
  - marker: b
    text: “基尼烈”在这里是地名，可能指一个地区，并非普通名词“竖琴”。
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּשְׁמַע אֶל
  choice: 听从了
  rationale: 该希伯来语习语表示听取并接受某人的请求；上下文随后的军事行动表明便·哈达作出了有利回应。“听从”自然表达这一含义，又不像“服从”那样暗示亚撒对他拥有权柄。
- source_word: שָׂרֵי הַחֲיָלִים אֲשֶׁר לוֹ
  choice: 他手下的军队统帅
  rationale: שָׂרֵי 指军事首领，הַחֲיָלִים 指军队；אֲשֶׁר לוֹ 表示归属或隶属关系。合译为“他手下的军队统帅”，符合现代汉语军事语境。
- source_word: עַל עָרֵי יִשְׂרָאֵל
  choice: 攻打以色列的城邑
  rationale: 在“派遣”及军事语境中，עַל 指向敌对行动的目标；“攻打”明确表达其敌对方向。
- source_word: וַיַּךְ
  choice: 攻取了
  rationale: נכה 可指击打、攻击或击败。这里后接一系列城邑和地区，在战争叙事中“攻取”自然，但不额外断言毁灭程度。
- source_word: עִיּוֹן
  choice: 以云
  rationale: 采用现代中文圣经地名的通行音译。
- source_word: אָבֵל בֵּית מַעֲכָה
  choice: 亚伯·伯·玛迦
  rationale: 按复合地名音译，并以间隔号标明名称构成，便于现代读者辨读。
- source_word: כָּל כִּנְרוֹת
  choice: 基尼烈全境
  rationale: כִּנְרוֹת 在此是地名，且 כָּל 暗示所指可能为整个区域；“全境”比逐字的“所有基尼烈”更符合汉语，同时保留地域性理解。
- source_word: עַל כָּל אֶרֶץ נַפְתָּלִי
  choice: 和拿弗他利全地
  rationale: 此处 עַל 可把较广的拿弗他利地域加入前面的攻击对象。“和”在汉语中自然延续受击地点的清单，不重复“攻打”。
