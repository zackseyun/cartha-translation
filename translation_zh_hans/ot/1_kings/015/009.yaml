  text: In the twentieth year of Jeroboam king of Israel[b][a], Asa became king over Judah.
translation:
  language: zh_hans
  text: 以色列王耶罗波安在位第二十年，亚撒登基作犹大王。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“亚撒开始统治犹大。”原文直译为“亚撒作了犹大王”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בִ/שְׁנַת עֶשְׂרִים
  choice: 在位第二十年
  rationale: 这是王朝纪年的标准表达。希伯来语字面为“在二十年”，在本语境中具有序数意义；中文自然表达为“在位第二十年”。句首连接词不必单独译作“又”。
- source_word: לְ/יָרָבְעָם
  choice: 耶罗波安在位
  rationale: 介词 לְ 标示纪年所依据的君王；结合中文王朝纪年习惯，以“在位”明确这是耶罗波安统治的第二十年。
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: 以色列王
  rationale: 按现代汉语中君王称号的自然次序翻译，同时保留其王国归属。
- source_word: מָלַךְ
  choice: 登基作……王
  rationale: 在列王纪的登基公式中，此完成式表示开始执政，而非概括整个统治时期；“登基作王”准确、简洁地传达即位含义。
- source_word: אָסָא
  choice: 亚撒
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: מֶלֶךְ יְהוּדָה
  choice: 作犹大王
  rationale: 希伯来语字面为“犹大王”；与“登基”连用时，“作犹大王”符合自然中文。
theological_decisions: []
