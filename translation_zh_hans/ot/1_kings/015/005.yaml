base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/005.yaml
  text: because David had done what was right in the eyes of Yahweh and had not turned aside from anything that he had commanded him all the days of his life[a], except in the matter of Uriah the Hittite.
translation:
  language: zh_hans
  text: 因为大卫行了耶和华眼中看为正的事；他一生没有偏离耶和华所吩咐他的一切，惟独在赫人乌利亚的事上[a]例外。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在赫人乌利亚的事上”或译“关于赫人乌利亚”。
    reason: בִּדְבַר在此可指“在……的事上”或“关于……”，后者保留该短语的宽泛指涉，且是自然的现代汉语表达。
lexical_decisions:
- source_word: אֲשֶׁר
  choice: 因为
  rationale: 此处承接上文，说明前一节所述恩待大卫的缘由；用“因为”明确其因果功能。
- source_word: עָשָׂה ... אֶת הַיָּשָׁר
  choice: 行了……看为正的事
  rationale: 保留“行正事”的希伯来语惯用表达，并以自然现代汉语传达道德评价。
- source_word: בְּעֵינֵי יְהוָה
  choice: 耶和华眼中看为
  rationale: 保留原文“在……眼中”的评价性比喻，同时符合现代汉语习惯。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经传统中对神圣四字名的通行音译。
- source_word: וְלֹא סָר
  choice: 没有偏离
  rationale: סור在这里指没有离开所受吩咐的道路；“偏离”自然地表达这种遵命语境。
- source_word: מִכֹּל אֲשֶׁר צִוָּהוּ
  choice: 耶和华吩咐他的一切
  rationale: 明确动词的主语为耶和华、宾语为大卫，避免汉语代词连续出现造成歧义，并保留כֹּל所表达的全称范围。
- source_word: כֹּל יְמֵי חַיָּיו
  choice: 一生
  rationale: 以简洁自然的现代汉语表达“他生命中的所有日子”，不损失时间范围。
- source_word: רַק
  choice: 只是……例外
  rationale: 此处引出前述概括性称许的唯一明说例外；这样译能清楚表达限制功能。
- source_word: בִּדְבַר אוּרִיָּה
  choice: 在乌利亚的事上
  rationale: דָּבָר在此结构中可指事情、事件或案件；“在……的事上”既贴近原文，也保留一定语义宽度。
- source_word: אוּרִיָּה הַחִתִּי
  choice: 赫人乌利亚
  rationale: 按现代中文常用形式音译人名，并直接翻译其族属称谓。
theological_decisions:
- issue: 大卫虽有其他已知罪行，本节仍给予广泛称许
  choice: 保留原文对大卫一生顺服的概括性称许，并仅陈明经文明确提出的乌利亚事件这一例外
  alternative: 改写为“大体上忠心”，或加入悔改、盟约忠诚等解释
  rationale: 原文本身把广泛称许与一个明确例外并置；译文应保存这种神学张力，不用外加解释来缓和或重构它。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“耶和华眼中看为正”保留希伯来语意象；“一生都没有偏离”清楚自然。将重复代词展开为“耶和华吩咐他”，以免中文读者误判所指。
