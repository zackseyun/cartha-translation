revisions:
- from: 他行雅威眼中看为恶的事，走耶罗波安的道路，也行在他的罪中，就是他使以色列犯罪的那罪。
  to: 他做了雅威眼中看为恶的事，走耶罗波安的道路，又随从耶罗波安使以色列犯罪的那罪。
  rationale: 修订解决了原稿的汉语句法问题，并以自然的“随从……的罪”对应“行在……罪中”。将代词所指明确为耶罗波安，是为避免汉语指代歧义；该指向由原文紧邻的“耶罗波安”及关系从句的单数阳性动词所确定。未改变评价、道路、罪或使役犯罪等核心语义。
