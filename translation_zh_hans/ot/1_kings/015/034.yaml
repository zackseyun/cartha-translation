base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/034.yaml
  text: He did what was evil in the eyes of Yahweh and walked in the way of Jeroboam and in his sin by which he caused Israel to sin.
translation:
  language: zh_hans
  text: 他做了雅威眼中看为恶的事，走耶罗波安的道路，又随从耶罗波安使以色列犯罪的那罪。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ הָרַע
  choice: 他行……看为恶的事
  rationale: 按列王纪反复出现的评语公式译出；“行……恶事”既保留“行”的动作性，也符合现代汉语表达。
- source_word: בְּעֵינֵי יְהוָה
  choice: 雅威眼中看为
  rationale: 保留希伯来语“在……眼中”的评价隐喻，同时用“看为”使汉语句法自然。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语音译直接呈现四字神名，与源文专名性质相符。
- source_word: וַיֵּלֶךְ בְּדֶרֶךְ יָרָבְעָם
  choice: 走耶罗波安的道路
  rationale: 保留“走在道路上”这一描述行为模式的隐喻，并维持列王纪公式化措辞。
- source_word: וּבְחַטָּאתוֹ
  choice: 也行在他的罪中
  rationale: 保留介词结构及单数“他的罪”，并与前面的“走……道路”形成并列；“他的”不额外明说所指，以免超出源文。
- source_word: אֲשֶׁר הֶחֱטִיא אֶת־יִשְׂרָאֵל
  choice: 就是他使以色列犯罪的那罪
  rationale: 将הֶחֱטִיא的使役意义明确译为“使……犯罪”，关系从句则用“就是……的那罪”自然连接其先行词。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 源文使用四字神名；“雅威”较直接反映学界通常重构的读音，并避免以称号代替专名。
- issue: “他的罪”中代词的所指
  choice: 保留“他的”，不在正文中补成“耶罗波安的”
  alternative: 耶罗波安的罪
  rationale: 上下文强烈指向耶罗波安，但希伯来语本身使用第三人称单数后缀；保留代词可忠实维持源文的衔接方式，不作不必要的明示。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语；保留列王纪评语公式中的“眼中”“道路”和“罪”等核心意象，同时避免生硬的逐词直译。
