  register: 采用庄重而易懂的现代标准汉语。“与他列祖同睡”保留原文传统死亡委婉语；“人们把他葬”保留希伯来语主动复数的不定指表达。将名字异文脚注[b]置于“亚比央”之后，使注释对象清楚。
