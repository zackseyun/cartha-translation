base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/008.yaml
  text: And Abijam lay down with his fathers[a], and they buried him in the city of David[b]. Then Asa his son became king in his place.
translation:
  language: zh_hans
  text: 亚比央[b]与他的列祖同睡[a]；人们把他葬在大卫城。他的儿子亚撒接续他作王。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “与他的列祖同睡”是希伯来语惯用语，表示去世。
    reason: cultural_note
  - marker: b
    text: 在一些平行或相关经文中，亚比央称为“亚比雅”；本节希伯来文本作“亚比央”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: 同睡
  rationale: 这是希伯来语叙述君王去世的惯用表达；保留“睡”的比喻，并由脚注说明其含义，避免直接意译成“死了”而抹去原文意象。
- source_word: אֲבִיָּם
  choice: 亚比央
  rationale: 按本节马所拉文本 אֲבִיָּם 音译；相关经文中另有“亚比雅”这一名字形式，故加脚注说明。
- source_word: עִם אֲבֹתָיו
  choice: 与他列祖
  rationale: “列祖”自然地表达家族先辈，并保留王室承袭与祖先安葬传统的色彩。
- source_word: וַיִּקְבְּרוּ אֹתוֹ
  choice: 人们把他葬
  rationale: 原文为主动复数，但未说明执行安葬者是谁；以不定指的“人们”保留主动结构而不擅自指认主体。
- source_word: בְּעִיר דָּוִד
  choice: 在大卫城
  rationale: “大卫城”是该地名在现代汉语圣经语境中清楚、通行的表达。
- source_word: וַיִּמְלֹךְ
  choice: 作王
  rationale: 在王位承袭公式中，此动词表示登上王位；结合“接续他”准确表达其起始与继位含义。
- source_word: אָסָא בְנוֹ
  choice: 他儿子亚撒
  rationale: 采用自然的现代汉语语序，同时清楚保留亚撒与亚比央的父子关系。
- source_word: תַּחְתָּיו
  choice: 接续他
  rationale: 此处表示继任其王位；“接续他作王”比单说“在他以后”更明确，也比“代替他”更符合正常继位语境。
theological_decisions: []
