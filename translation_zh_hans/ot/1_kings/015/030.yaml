  text: עַל חַטֹּ֤אות יָרָבְעָם֙ אֲשֶׁ֣ר חָטָ֔א וַ/אֲשֶׁ֥ר הֶחֱטִ֖יא אֶת יִשְׂרָאֵ֑ל בְּ/כַעְס֕/וֹ אֲשֶׁ֣ר הִכְעִ֔יס אֶת יְהוָ֖ה אֱלֹהֵ֥י יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/030.yaml
  text: because of the sins of Jeroboam that he committed and by which he caused Israel to sin[a], and because of his provocation by which he provoked Yahweh, the God of Israel.
translation:
  language: zh_hans
  text: 这是因为耶罗波安所犯的罪，以及他使以色列人犯的罪；又因为他惹怒耶和华——以色列的上帝——的挑衅之举[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“因他的怒气”。原文这个词既可指怒气，也可指惹人发怒的挑衅或行为；此处后接“惹怒”，故正文译作“挑衅之举”。
    reason: 保留כַּעַס在“怒气”与“挑衅、惹怒之事”之间的词义可能。
lexical_decisions:
- source_word: עַל
  choice: 因为
  rationale: 此处引出前文所述事件或审判的原因；译作“因为”既准确又符合现代汉语表达。
- source_word: חַטֹּאות יָרָבְעָם אֲשֶׁר חָטָא
  choice: 耶罗波安所犯的罪
  rationale: 以汉语自然的关系结构表达“耶罗波安所犯下的罪”，保留复数所指的整体含义，并避免“犯罪之罪”的生硬重复。
- source_word: הֶחֱטִיא אֶת יִשְׂרָאֵל
  choice: 使以色列人也犯下的罪
  rationale: הֶחֱטִיא是使役形，明确表达耶罗波安使以色列犯罪；“也”凸显他自己犯罪并使百姓同犯的对应关系。
- source_word: בְּכַעְסוֹ
  choice: 以挑衅之举
  rationale: כַּעַס在此可指怒气，也可指招致愤怒的挑衅或惹怒行为；结合随后“惹怒耶和华”的动词，正文采用“挑衅之举”，并以脚注保留另一词义。
- source_word: הִכְעִיס
  choice: 惹怒了
  rationale: 该使役动词表示使对方发怒；“惹怒”简洁自然，并保留原文的因果力度。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的专名“耶和华”呈现四字神名，而非用称号替代。
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: 以色列的上帝
  rationale: 直接保留原文对耶和华作为以色列之上帝的身份说明。
theological_decisions:
- issue: 四字神名יהוה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用上帝的专名；中文正文采用广为普通读者识别的传统音译“耶和华”，不以“主”这一称号替代专名。
- issue: 耶罗波安与以色列犯罪之间的因果关系
  choice: 他使以色列人也犯下的罪
  alternative: 他引诱以色列人所犯的罪
  rationale: 保留使役动词所明确表达的责任，同时不额外断定他使百姓犯罪的具体手段。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。以“就是”说明后句与“耶罗波安所犯的罪”的关系，以分号区分两个并列原因；保留本节承接前文的因果句式。
