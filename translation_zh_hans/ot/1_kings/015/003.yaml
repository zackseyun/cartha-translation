base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/003.yaml
  text: He walked in all the sins of his father that he had committed before him[a], and his heart was not wholly devoted to Yahweh his God[c][b], like the heart of David his father.
translation:
  language: zh_hans
  text: 他行在他父亲在他面前所犯的一切罪中[a]；他的心并不全然忠于雅威[c]——他的神[b]，不像他祖先大卫的心那样。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在他面前”也可理解为“在他以前”。原文可能指他父亲的罪先于他发生，也可能暗示那些罪摆在他眼前，成了他效法的先例。
    reason: lexical_alternative
  - marker: b
    text: 也可译为“他的心没有完全归向雅威他的神”或“他的心没有完全忠于雅威他的神”。
    reason: alternative_reading
  - marker: c
    text: “雅威”音译希伯来文神名YHWH；传统常译作“耶和华”或以“上主”代替。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּלֶךְ בְּכָל חַטֹּאות
  choice: 他行了……一切罪
  rationale: הלך与介词ב及道德行为连用，表示按某种行为方式生活。中文“行了……罪”既自然，也保留原文关于行为道路的伦理含义。
- source_word: אָבִיו אֲשֶׁר עָשָׂה לְפָנָיו
  choice: 他父亲在他面前所犯的
  rationale: 关系从句指向父亲所犯的罪。“在他面前”保留לְפָנָיו可能表示“在他眼前”或“在他以前”的含混性，不在正文中强行限定为时间或空间。
- source_word: לְבָבוֹ שָׁלֵם עִם
  choice: 他的心……全然忠于
  rationale: שָׁלֵם描述内心完整、专一的忠诚；“全然忠于”在现代中文中自然表达对神毫无二心的委身，又避免误解为绝对无罪或本体上的完美。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语音译方式呈现四字神名YHWH，而不是用“主”这一称号代替；脚注同时说明传统译法。
- source_word: כִּלְבַב דָּוִד אָבִיו
  choice: 不像他祖先大卫的心
  rationale: 比较对象明确是两人的“心”。此处אָב可指祖先，译为“祖先”可避免把大卫误认为亚比央的生父。
theological_decisions:
- issue: “心是שָׁלֵם”的含义
  choice: 全然忠于
  alternative: 心完全归向；心纯全
  rationale: 上下文评判的是对雅威的专一忠诚，而不是宣称大卫绝对无罪。“全然忠于”保留圣约忠诚的重点。
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用神的专名。正文采用接近Yahweh读音的“雅威”，不以称号代替，并在脚注交代常见传统译法。
- issue: 大卫被称为אָבִיו
  choice: 他祖先大卫
  alternative: 他父亲大卫
  rationale: 希伯来语אָב可表示父亲或祖先；大卫在此是王室祖先，不是亚比央的直接生父。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“全然忠于”传达内心专一的圣约忠诚；“在他面前”有意保留原文的空间与时间含混性。分号呈现行为与内心评价之间的紧密联系。
