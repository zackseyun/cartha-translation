  text: וְ/יֶ֛תֶר דִּבְרֵ֥י נָדָ֖ב וְ/כָל אֲשֶׁ֣ר עָשָׂ֑ה הֲ/לֹא הֵ֣ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/031.yaml
  text: The rest of the acts of Nadab[a], and all that he did, are they not written in the Book of the Chronicles of the Kings of Israel?
translation:
  language: zh_hans
  text: 拿答其余的事迹，以及他所做的一切，不都记在《以色列诸王大事记》[a]中吗？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“以色列诸王编年史”。这里的希伯来语名称指一种王室档案，并不一定是圣经中的《历代志》。
    reason: 说明原文所指文献的性质，并保留书名的另一种可能译法，避免将其误认为圣经正典《历代志》。
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי נָדָב
  choice: 拿答其余的事迹
  rationale: יֶתֶר 表示“其余的”，דִּבְרֵי 在王朝纪事的固定结语中不是单指言语，而是指有关君王的事迹或事项；译作“事迹”自然且符合史书语境。וְ 在此承接上文，无须另加“现在”。
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: 以及他所做的一切
  rationale: 贴近原文关系从句，同时保持现代汉语自然表达。
- source_word: הֲלֹא הֵם כְּתוּבִים
  choice: 不都记在……中吗
  rationale: הֲלֹא 引出预期肯定答案的反问；“不都……吗”保留这一语气。כְּתוּבִים 本义为“写下”，在文献引证语境中译作“记在”更自然。
- source_word: עַל סֵפֶר
  choice: 记在……中
  rationale: עַל 字面为“在……之上”，但汉语谈及文献所载内容通常说“记在书中”。
- source_word: סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יִשְׂרָאֵל
  choice: 《以色列诸王大事记》
  rationale: דִּבְרֵי הַיָּמִים 在此指按时日编录的王室纪事；“大事记”能传达史料或编年记录的性质，לְ 在书名中表示该记录与以色列诸王相关。加书名号符合现代汉语规范。
