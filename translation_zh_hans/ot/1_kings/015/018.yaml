  text: וַ/יִּקַּ֣ח אָ֠סָא אֶת כָּל הַ/כֶּ֨סֶף וְ/הַ/זָּהָ֜ב הַֽ/נּוֹתָרִ֣ים בְּ/אוֹצְר֣וֹת בֵּית יְהוָ֗ה וְ/אֶת אֽוֹצְרוֹת֙ בֵּ֣ית מלך וַֽ/יִּתְּנֵ֖/ם בְּ/יַד עֲבָדָ֑י/ו וַ/יִּשְׁלָחֵ֞/ם הַ/מֶּ֣לֶךְ אָסָ֗א אֶל בֶּן הֲ֠דַד בֶּן טַבְרִמֹּ֤ן בֶּן חֶזְיוֹן֙ מֶ֣לֶךְ אֲרָ֔ם הַ/יֹּשֵׁ֥ב בְּ/דַמֶּ֖שֶׂק לֵ/אמֹֽר־־׀־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/018.yaml
  text: Then Asa took all the silver and the gold that remained in the treasuries of the house of Yahweh and in the treasuries of the king’s house[a], and put them into the hand of his servants. Then King Asa sent them to Ben-hadad son of Tabrimmon, son of Hezion, king of Aram, who lived in Damascus, saying[b],
translation:
  language: zh_hans
  text: 亚撒把耶和华殿的府库和王宫[a]的府库中所有剩下的金银取出来，交在臣仆手中；亚撒王把这些金银送给住在大马士革的亚兰王便·哈达——他是他伯利们的儿子、希旬的孙子——说[b]：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “王宫”直译为“王的家”。
    reason: lexical_alternative
  - marker: b
    text: 本节末句引出下一节的话。
    reason: discourse_clarification
lexical_decisions:
- source_word: וַיִּקַּח
  choice: 亚撒……取出来
  rationale: 叙事性连续式推进事件；中文无需机械添加“然后”，以动词顺序自然表达先后。
- source_word: כָּל הַכֶּסֶף וְהַזָּהָב הַנּוֹתָרִים
  choice: 剩下的金银全都
  rationale: 保留כָּל的总体意义和הַנּוֹתָרִים所指的余存之物，同时采用自然现代汉语语序。
- source_word: בְּאֹצְרוֹת בֵּית יְהוָה
  choice: 耶和华殿府库里
  rationale: “府库”适合存放贵金属的语境；בֵּית יְהוָה在此指圣殿，译作“耶和华殿”简洁明确，并保留神名。
- source_word: וְאֶת אֹצְרוֹת בֵּית מלך
  choice: 和王宫府库里
  rationale: 字面为“王的家/殿宇的府库”，语境指王宫；正文采用现代汉语中清楚自然的“王宫”。
- source_word: וַיִּתְּנֵם בְּיַד עֲבָדָיו
  choice: 交在臣仆手中
  rationale: 保留“在……手中”的希伯来语意象；“臣仆”在王室差遣语境中比单纯“仆人”更贴切。
- source_word: וַיִּשְׁלָחֵם
  choice: 派他们把这些金银送给
  rationale: 希伯来语宾语后缀语法上可回指金银，但紧接“臣仆”也易产生表达上的张力；中文将执行者和所送物都明说，使事件关系清楚。
- source_word: בֶּן הֲדַד בֶּן טַבְרִמֹּן בֶּן חֶזְיוֹן
  choice: 便·哈达；便·哈达是他伯利们的儿子、希旬的孙子
  rationale: 按希伯来文音译人名，并把连续的“儿子”结构转为自然中文谱系表达。
- source_word: מֶלֶךְ אֲרָם
  choice: 亚兰王
  rationale: 保留原文历史地理名称“亚兰”，不以较晚的“叙利亚”替代。
- source_word: הַיֹּשֵׁב בְּדַמֶּשֶׂק
  choice: 住在大马士革的
  rationale: 分词在此表示居住，译文采用自然现代汉语。
- source_word: לֵאמֹר
  choice: 亚撒说：
  rationale: 该词引出下一节的直接引语；中文以冒号自然衔接。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文读者熟悉的神名形式直接呈现四字神名，而不以称号“主”代替。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用神的专名。正文保留专名而非以“主”替代；“耶和华”是现代中文圣经语境中最广为人知、庄重且易懂的形式。
- issue: אֲרָם的历史地理名称
  choice: 亚兰
  alternative: 叙利亚
  rationale: “亚兰”直接对应希伯来文，并避免用后来的地理名称覆盖列王纪的历史称谓。
translation_notes:
  register: 采用现代、庄重而易懂的叙事体。“府库”“臣仆”保留王室与圣殿语境的正式感；人名以中点分隔复名。正文重组了差遣句，以避免代词所指在中文中含混，同时未改变臣仆运送金银的事件内容。
