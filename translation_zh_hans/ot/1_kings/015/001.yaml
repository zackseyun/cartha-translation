  text: In the eighteenth year of King Jeroboam son of Nebat[a], Abijam became king over Judah.
translation:
  language: zh_hans
  text: 尼八的儿子耶罗波安王在位第十八年，亚比央[a]登基作犹大王。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文作“亚比央”；同一位王在其他经文中称为“亚比雅”。
    reason: alternative_reading
lexical_decisions:
- source_word: וּ/בִ/שְׁנַת שְׁמֹנֶה עֶשְׂרֵה
  choice: 在位第十八年
  rationale: 这是希伯来叙事中常见的君王纪年格式；现代汉语用“在位第十八年”自然、准确。句首连接词不单独译出，以免行文生硬。
- source_word: לַ/מֶּלֶךְ יָרָבְעָם בֶּן נְבָט
  choice: 尼八的儿子耶罗波安王
  rationale: 按现代汉语习惯排列王号与父称，同时保留原文所指的君王纪年关系。
- source_word: מָלַךְ
  choice: 登基
  rationale: 此处的完成式用于即位记载，重点是开始作王；“登基”比笼统的“作王”更清楚地表达即位这一时点。
- source_word: אֲבִיָּם
  choice: 亚比央
  rationale: 马所拉文本本节明确作 אֲבִיָּם，应在正文中保留这一名字形式，不按其他经文的“亚比雅”统一。
- source_word: עַל יְהוּדָה
  choice: 统治犹大
  rationale: 介词 עַל 与动词 מלך 连用，表示对某地或群体施行王权；“统治犹大”在现代汉语中直接自然。
