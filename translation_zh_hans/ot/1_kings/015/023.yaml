  text: וְ/יֶ֣תֶר כָּל דִּבְרֵֽי אָ֠סָא וְ/כָל גְּב֨וּרָת֜/וֹ וְ/כָל אֲשֶׁ֣ר עָשָׂ֗ה וְ/הֶֽ/עָרִים֙ אֲשֶׁ֣ר בָּנָ֔ה הֲ/לֹֽא הֵ֣מָּה כְתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֣י יְהוּדָ֑ה רַ֚ק לְ/עֵ֣ת זִקְנָת֔/וֹ חָלָ֖ה אֶת רַגְלָֽי/ו־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/023.yaml
  text: The rest of all the acts of Asa[a], and all his might, and all that he did[b], and the cities that he built—are they not written in the Book of the Chronicles of the Kings of Judah? Yet in the time of his old age he became diseased in his feet.
translation:
  language: zh_hans
  text: 亚撒其余的一切事迹、他的所有威力、他所做的一切，以及他建造的城，不都记在《犹大列王纪事录》[a]上吗？只是年老时，他的脚患病了。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“《犹大列王年鉴》”。
    reason: 原文书名可理解为记录犹大诸王事件的年代志或年鉴。
  - marker: b
    text: 原文只说明患病的部位是脚，没有说明具体是什么病。
    reason: 防止读者把译文理解为原文已经给出某种特定诊断。
lexical_decisions:
- source_word: וְיֶתֶר כָּל דִּבְרֵי אָסָא
  choice: 亚撒其余的一切事迹
  rationale: 这是列王纪中常见的王朝总结语。“事迹”在现代汉语中自然地表达 דְּבָרִים 在史书语境下所指的行为和事件；句首不另加原文没有的“至于”或“现在”。
- source_word: וְכָל גְּבוּרָתוֹ
  choice: 他的全部勇力
  rationale: גְּבוּרָה 可指力量、英勇或伟业。“勇力”保留其抽象性，也不与下一句“他所做的一切”合并。
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: 他所做的一切
  rationale: 直接保留关系从句的广泛涵盖范围。
- source_word: וְהֶעָרִים אֲשֶׁר בָּנָה
  choice: 以及他建造的城
  rationale: בָּנָה 的本义是“建造”；不把上下文可能暗示的修筑防御工事直接写入正文。
- source_word: הֲלֹא הֵמָּה כְתוּבִים
  choice: 不都记在……上吗
  rationale: 保留原文反问句式；汉语以“记在……上”自然表达被动的“写在书上”。
- source_word: עַל סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יְהוּדָה
  choice: 《犹大列王纪事录》
  rationale: 把该资料来源作为书名处理。“纪事录”传达 דִּבְרֵי הַיָּמִים 所指的按时日记录的王室史料，也尽量避免与正典《列王纪》混淆。
- source_word: רַק לְעֵת זִקְנָתוֹ
  choice: 只是到了年老的时候
  rationale: רַק 在这里引出限制性的补充说明；“只是”保留这一语气。“到了”自然表达所指人生阶段。
- source_word: חָלָה אֶת רַגְלָיו
  choice: 他的脚患了病
  rationale: 原文说明患病部位是脚，却没有指出具体疾病；此译法自然，并避免添加诊断。
theological_decisions: []
translation_notes:
  register: 采用庄重而清楚的现代标准汉语，保留王朝总结语的反问结构。书名加书名号；“城”按汉语可作集合性表达。脚注标记均放在其实际说明的词句之后。
