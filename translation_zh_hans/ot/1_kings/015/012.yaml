base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/012.yaml
  text: He removed the male cult prostitutes from the land[d][c][b][a], and he took away all the idols that his fathers had made.
translation:
  language: zh_hans
  text: 他把境内的男庙妓[b]清除出去[a]，又除掉他列祖[d]所造的一切偶像[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“赶出去”。原文动词可表示使人离开某地，因此既可理解为清除，也可理解为驱逐。
    reason: lexical_alternative
  - marker: b
    text: 原文指与异教祭祀中的性行为有关的男子。传统译法有时作“所多玛人”，但这会引入后世特定的分类，未能准确表达这里的词义。
    reason: lexical_alternative
  - marker: c
    text: 这里译作“偶像”的原文带有强烈鄙夷意味，也可表达“可憎的偶像”或“污秽如粪的偶像”。
    reason: lexical_alternative
  - marker: d
    text: 或译：“他的祖先”或“他的父辈”。原文“他的父亲们”是指先前世代的惯用说法。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲבֵר
  choice: 清除出去
  rationale: 该使役形式在此表示使某人从一地离开，即清除或驱逐。“清除出去”既保留动作的力度，也不限定具体执行方式。
- source_word: הַקְּדֵשִׁים
  choice: 男庙妓
  rationale: 该阳性复数名词在本语境中指与非法祭祀性行为有关的男子。“男庙妓”简明表达其男性身份和祭祀背景；脚注说明原词及其语义范围，避免采用容易引入后世分类的传统称呼。
- source_word: מִן הָאָרֶץ
  choice: 境内
  rationale: 原文直译为“从这地”。结合上下文，这里指犹大境内；译作“境内”符合现代汉语表达，并保留地域范围。
- source_word: וַיָּסַר
  choice: 除掉
  rationale: 该使役形式意为移走、除去。“除掉”自然有力，也与前句“清除出去”形成适度变化。
- source_word: כָּל הַגִּלֻּלִים
  choice: 一切偶像
  rationale: 该词明确指偶像，同时带强烈鄙夷色彩。正文用通顺明确的“偶像”，脚注保留“可憎、污秽之物”的贬斥意味。
- source_word: אֲשֶׁר עָשׂוּ אֲבֹתָיו
  choice: 他列祖所造的
  rationale: “列祖”贴近希伯来语“他的父辈”，在庄重现代汉语中可自然指先前各代男性祖辈；“所造的”清楚表达偶像由他们制造。
theological_decisions:
- issue: הַקְּדֵשִׁים所指人员的身份
  choice: 男庙妓
  alternative: 参与异教淫乱仪式的男子；献身于神庙的男子
  rationale: 原词字面与“分别为圣”相关，但在此处及相关经文中具有受谴责的祭祀性行为背景。正文采用传统词义范围内较明确的译法，同时用脚注承认该词首先标示与此类祭祀活动有关的男性，避免扩展为一般性的性伦理类别。
- issue: אֲבֹתָיו的代际含义
  choice: 他列祖
  alternative: 他的祖先；他的父辈
  rationale: 原文为阳性复数“他的父辈”，在这里指先前世代。“列祖”既保留其男性和代际色彩，又符合经文叙事的庄重语体。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“境内”顺应汉语语序表达“从这地”，“列祖”保留历史叙事和男性祖辈的含义；对带有争议或强烈贬义的词汇，在正文保持简洁，在脚注中呈现语义张力。
