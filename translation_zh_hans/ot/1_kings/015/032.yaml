    issue: 正文“彼此一直争战”把“有战争”改为双方持续交战。
    rationale: 希伯来文使用存在式“战争＋有”，陈述二者之间存在战争；“一直”也容易被理解为不间断的实际作战。改为“常常争战”可自然表达全段时期的战争状态。
  - severity: medium
    issue: 脚注称可理解为“他们在位期间”。
    rationale: כָּל־יְמֵיהֶם 字面为“他们所有的日子”，通常指两人的一生／在世期间；原文没有“统治、王位或在位”的词语，不能把该解释作为等值替代。
