  text: And there was war between Asa and Baasha king of Israel all their days[a].
translation:
  language: zh_hans
  text: 亚撒和以色列王巴沙在世的日子常常争战。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“他们所有的日子”；也可译为“他们一生的日子”或“他们在世期间”。
    reason: 保留希伯来文的生命时段习语及复数代词的指向，不把它解释为“在位期间”。
lexical_decisions:
- source_word: וּ/מִלְחָמָה הָיְתָה
  choice: 彼此一直争战
  rationale: 原文直译为“有战争”，在本句概括性的时间范围内，用“彼此一直争战”自然表达持续敌对状态；“争战”保留 מִלְחָמָה 的战争含义，而不弱化为一般“冲突”。
- source_word: בֵּין ... וּ/בֵין
  choice: 亚撒和……巴沙……彼此
  rationale: 用现代汉语的“和……彼此”自然表达希伯来语重复介词“在……之间”。
- source_word: אָסָא
  choice: 亚撒
  rationale: 采用现代中文圣经人名的通行译名。
- source_word: בַּעְשָׁא
  choice: 巴沙
  rationale: 采用现代中文圣经人名的通行译名。
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: 以色列王
  rationale: 准确表达附加于巴沙的人物身份，符合现代汉语语序。
- source_word: כָּל יְמֵי/הֶם
  choice: 在世的日子
  rationale: 保留原文“他们所有的日子”这一生命时段用语，同时以自然中文表达；“他们”所指的具体范围在上下文中可能有语义张力，脚注予以说明。
