  text: And when Baasha heard of it[a], he stopped building Ramah and remained in Tirzah.
translation:
  language: zh_hans
  text: 巴沙听见这事，就停止修建拉玛，住在得撒[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “住在”也可译作“留在”。
    reason: 原文וַיֵּשֶׁב兼有居住与停留之意；上下文不能完全排除“留在”的语感。
lexical_decisions:
- source_word: וַיְהִי כִּשְׁמֹעַ
  choice: 巴沙听见这事，就
  rationale: “וַיְהִי”与不定词结构在叙事中引出时间从句；现代汉语自然译作“……听见这事，就……”。原文未明说所听见的内容，“这事”按上文语境补出。
- source_word: בַּעְשָׁא
  choice: 巴沙
  rationale: 按现代中文圣经人名的通行音译处理。
- source_word: וַיֶּחְדַּל מִבְּנוֹת
  choice: 停止修建
  rationale: חדל与介词מִן加不定词表示停止某项活动；“停止修建”准确而符合现代汉语。
- source_word: אֶת הָרָמָה
  choice: 拉玛
  rationale: 此处是地名，作“修建”的宾语；采用现代中文圣经地名的通行音译。
- source_word: וַיֵּשֶׁב
  choice: 住在
  rationale: ישׁב可表示坐下、居住或停留；此处“住在”保留其通常的居住义，同时不额外断定是否永久定居。
- source_word: בְּתִרְצָה
  choice: 在得撒
  rationale: 介词בְּ译为“在”，地名תִרְצָה采用现代中文圣经的通行音译“得撒”。
theological_decisions: []
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。“停止修建”避免文言化的“停建于”，“住在得撒”保持叙事流畅；“这事”是依据上文作出的必要语境补足。
