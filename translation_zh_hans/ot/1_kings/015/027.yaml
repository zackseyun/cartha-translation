base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/027.yaml
  text: Then Baasha son of Ahijah[a], of the house of Issachar, conspired against him, and Baasha struck him down at Gibbethon, which belonged to the Philistines[c][b], while Nadab and all Israel were besieging Gibbethon.
translation:
  language: zh_hans
  text: 以萨迦支派的亚希雅之子巴沙密谋反对他[a]，在基比顿把他击杀了[b]；基比顿属非利士人[c]。当时，拿答和以色列众人正在围攻基比顿。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“密谋害他”或“结党反对他”。
    reason: 希伯来语表达指针对某人策划或结成政治阴谋；不必具体限定为叛乱。
  - marker: b
    text: 或译：“击倒了他”；希伯来语直译为“击打了他”，上下文表明他因此死亡。
    reason: 保留原词较宽的“击打”义，并说明本处致死的语境含义。
  - marker: c
    text: 或译：“当时由非利士人控制”。
    reason: 希伯来语结构既可表示归属，也可在军事语境中表示实际控制。
lexical_decisions:
- source_word: וַיִּקְשֹׁר עָלָיו
  choice: 阴谋反叛他
  rationale: קשר与עַל连用，通常指针对某人结成政治阴谋或发动叛变；“阴谋反叛”既保留政治含义，也符合现代汉语表达。
- source_word: בַּעְשָׁא בֶן אֲחִיָּה
  choice: 亚希雅之子巴沙
  rationale: 按中文圣经人名惯例音译专名，并以“之子”简洁表达父子关系。
- source_word: לְבֵית יִשָּׂשכָר
  choice: 以萨迦家族的
  rationale: 这里的בֵּית表示宗族或支派归属；“家族”比现代汉语中的单字“家”更清楚，又不过度限定其具体层级。
- source_word: וַיַּכֵּהוּ
  choice: 把他击杀了
  rationale: נכה本义为“击打”，本段语境明确此击导致拿答死亡；“击杀”同时保留击打意象和致死结果。
- source_word: בְּגִבְּתוֹן
  choice: 在基比顿
  rationale: 事件发生在这座正被围攻的城镇，“在”是自然且准确的地点表达。
- source_word: אֲשֶׁר לַפְּלִשְׁתִּים
  choice: 基比顿属非利士人
  rationale: 介词ל可表达归属或控制；“属非利士人”保持简洁，也容纳所有权与实际控制两种理解。
- source_word: וְנָדָב וְכָל־יִשְׂרָאֵל
  choice: 当时，拿答和以色列全军
  rationale: 句首连接词在此引出事件发生时的背景；译为“当时”自然呈现其伴随、时间功能。“全军”依军事围城语境表达“全以色列”，避免误解为每一位百姓。
- source_word: צָרִים עַל־גִּבְּתוֹן
  choice: 正在围攻基比顿
  rationale: צור על在军事语境中指围城；分词表示持续进行中的行动，因此译为“正在围攻”。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而清楚的叙事语体。为保持希伯来文的信息次序，先述阴谋与击杀，再交代基比顿的归属及围城背景；以分号避免误读。“以色列全军”按围城军事语境处理，但不将其扩展为更具体的军队编制。
