  rationale: 修订仅收回两处超过原文明确程度的表述：以“密谋反对”代替“阴谋反叛”，并以“以色列众人”代替“以色列全军”。同时将以萨迦的归属表述为“支派”，使现代汉语读者更易识别其族群／支派性质。其余地点、人名、击杀、基比顿归属及围攻的持续背景均予保留。
