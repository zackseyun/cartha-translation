  text: וַ/יַּ֥עַשׂ הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה וַ/יֵּ֨לֶךְ֙ בְּ/דֶ֣רֶךְ אָבִ֔י/ו וּ֨/בְ/חַטָּאת֔/וֹ אֲשֶׁ֥ר הֶחֱטִ֖יא אֶת יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/026.yaml
  text: He did what was evil in the sight of Yahweh and walked in the way of his father and in his sin with which he caused Israel to sin.
translation:
  language: zh_hans
  text: 他行耶和华眼中看为恶的事，走他父亲的道路，也行在他父亲使以色列人犯罪的罪中。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ הָרַע
  choice: 他做……看为恶的事
  rationale: 保留《列王纪》中评价君王的固定表达，同时用现代汉语自然呈现实质化形容词 הָרַע。
- source_word: בְּעֵינֵי יְהוָה
  choice: 耶和华眼中看为
  rationale: 保留希伯来语“在……眼中”的评价性意象；中文以“眼中看为”表达自然清楚。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的神名音译“耶和华”，而非以称号“主”替代专名。
- source_word: וַיֵּלֶךְ בְּדֶרֶךְ אָבִיו
  choice: 走他父亲所走的道路
  rationale: 保留“行走—道路”的行为隐喻，并以重叠动词使现代汉语顺畅。
- source_word: וּבְחַטָּאתוֹ
  choice: 陷在他父亲的罪中
  rationale: בְ 同时承接“走在……中”的结构；中文若直译“走在罪中”略显生硬，故用“陷在……罪中”表达持续参与同一罪行。上下文及 אָבִיו 后接阳性单数后缀，所指自然是父亲的罪。
- source_word: אֲשֶׁר הֶחֱטִיא אֶת יִשְׂרָאֵל
  choice: 他父亲曾以这罪使以色列人犯罪
  rationale: 明确保留 הֶחֱטִיא 的使役意义；“以这罪”表达关系从句与前项之关联，并补明在中文中容易含混的主语所指。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用四字神名而非称号；“耶和华”是现代简体中文普通读者最熟悉、且能清楚作为专名识别的形式。
- issue: “他的罪”中代词所指
  choice: 译明为“他父亲的罪”
  alternative: 保留为“他的罪”
  rationale: 紧邻先行词“他父亲”，且本书固定用语所指是父亲使以色列犯罪的罪；译明可避免中文误读为本节主语自己的罪，同时不改变原文论断。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语，保留“眼中”“道路”等希伯来语核心意象；用分号理清末尾关系从句，避免连续多个“他”造成指代不明。
