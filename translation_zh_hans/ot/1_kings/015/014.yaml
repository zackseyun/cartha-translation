  text: וְ/הַ/בָּמ֖וֹת לֹא סָ֑רוּ רַ֣ק לְבַב אָסָ֗א הָיָ֥ה שָׁלֵ֛ם עִם יְהוָ֖ה כָּל יָמָֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/014.yaml
  text: But the high places were not removed; nevertheless[a], Asa’s heart was wholly devoted to Yahweh all his days.
translation:
  language: zh_hans
  text: 丘坛却没有废除；不过，亚撒的心一生都完全归向耶和华[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“亚撒的心一生都专一跟随耶和华。”希伯来文直译为“亚撒的心一生都与耶和华完全”。
    reason: 说明שָׁלֵם עִם יְהוָה的另一种自然译法，并保留原文“完全／完整”与“同、与”的字面结构。
lexical_decisions:
- source_word: וְהַבָּמוֹת
  choice: 邱坛
  rationale: בָּמוֹת在此指当地的高处祭祀场所；“邱坛”是简洁而通行的中文圣经用语，兼顾地点与祭祀设施的含义。
- source_word: לֹא סָרוּ
  choice: 没有废除
  rationale: 以邱坛为主语时，סוּר在改革语境中指被撤除、废止，而非自行离去；“废除”也能表达有关敬拜设施及其制度未被取缔。
- source_word: רַק
  choice: 不过
  rationale: רַק在这里引出让步性的转折：虽然邱坛没有废除，经文仍肯定亚撒内心的忠诚。“不过”自然地保留这一张力。
- source_word: לְבַב אָסָא
  choice: 亚撒的心
  rationale: לְבַב指人的内在意志、态度和忠诚；“亚撒的心”既贴近原文，也符合现代汉语表达。
- source_word: שָׁלֵם
  choice: 完全归向
  rationale: שָׁלֵם与“心”和耶和华连用，强调完整、无二的忠诚，不表示毫无罪过；“完全归向”在中文中清楚表达全心效忠，同时避免译成道德上的绝对完美。
- source_word: עִם יְהוָה
  choice: 归向耶和华
  rationale: עִם字面为“与……同在／在……一边”；配合“心是完全的”这一盟约忠诚表达，汉语以“归向耶和华”较自然。字面结构在脚注中保留。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文读者熟悉的神圣名字“耶和华”，而不以称号替代。
- source_word: כָּל יָמָיו
  choice: 一生都
  rationale: 自然表达“他所有的日子”，保留时间上的全面性而不作多余扩展。
theological_decisions:
- issue: 邱坛尚未废除，却称亚撒的心为“完全”
  choice: 将这句话译为对亚撒一生基本而完整的盟约忠诚之肯定，同时保留其改革并不彻底的事实。
  alternative: 把经文理解为亚撒在道德和行为上毫无瑕疵，或反过来削弱为仅仅一般性的称许。
  rationale: 经文刻意并列“邱坛没有废除”与“心……完全”，说明שָׁלֵם所指是根本而专一的忠诚，并非宣称他毫无过失；译文不消解这两者之间的张力。
translation_notes:
  register: 采用庄重、自然的现代标准汉语。“邱坛”保留必要的古代敬拜背景；“完全归向”较“全心效忠”更贴近“心……完全”的原文意象。分号呈现前后让步转折，并避免把未废除邱坛与亚撒内心忠诚简单调和。
