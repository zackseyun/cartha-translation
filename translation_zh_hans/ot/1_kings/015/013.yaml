  text: וְ/גַ֣ם אֶת מַעֲכָ֣ה אִמּ֗/וֹ וַ/יְסִרֶ֨/הָ֙ מִ/גְּבִירָ֔ה אֲשֶׁר עָשְׂתָ֥ה מִפְלֶ֖צֶת לָ/אֲשֵׁרָ֑ה וַ/יִּכְרֹ֤ת אָסָא֙ אֶת מִפְלַצְתָּ֔/הּ וַ/יִּשְׂרֹ֖ף בְּ/נַ֥חַל קִדְרֽוֹן׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/013.yaml
  text: He also removed Maacah his mother from being queen mother[a], because she had made an abominable image for Asherah[c][b]. Asa cut down her image and burned it in the Kidron Valley.
translation:
  language: zh_hans
  text: 他也撤去玛迦——他的母亲——王太后的职位[a]，因为她为亚舍拉[c]造了一个可憎的偶像[b]。亚撒砍倒她的偶像，并在汲沦谷把它焚烧了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文作“他母亲”；在王室用语中，这有时也可指祖母或女性祖先。
    reason: lexical_alternative
  - marker: b
    text: 或译“一个骇人的物件”。这种祭祀物的确切形制无法确定。
    reason: lexical_alternative
  - marker: c
    text: “亚舍拉”可能指亚舍拉女神，也可能指她的崇拜标志，后者常译作“亚舍拉柱”。
    reason: alternative_reading
lexical_decisions:
- source_word: וְגַם
  choice: 他也
  rationale: 表达承接上文的附加关系；汉语按语境补出主语“他”。
- source_word: מַעֲכָה אִמּוֹ
  choice: 他母亲玛迦
  rationale: 正文保留希伯来文直译“他母亲”，不按更广的家谱背景直接协调为“祖母”；相关可能性留在脚注说明。
- source_word: וַיְסִרֶהָ מִגְּבִירָה
  choice: 废除了……的王太后之位
  rationale: 使役形动词表示将她从某身份或职位上撤下；גְּבִירָה在王室语境中指王太后或宫廷中的尊贵女主。“废除……之位”自然地传达罢黜含义。
- source_word: אֲשֶׁר עָשְׂתָה
  choice: 因为她……造了
  rationale: 在此按因果关系理解，说明她被罢黜的缘由。
- source_word: מִפְלֶצֶת
  choice: 一个可憎的偶像
  rationale: 保留该词对祭祀物的强烈贬斥色彩，同时以“偶像”自然表达其作为崇拜物的性质；其确切形制仍不确定，故加脚注。
- source_word: לָאֲשֵׁרָה
  choice: 为亚舍拉
  rationale: 采用音译，不在正文中断定这是女神本身还是与她有关的崇拜标志。
- source_word: וַיִּכְרֹת ... אֶת מִפְלַצְתָּהּ
  choice: 砍倒她的偶像
  rationale: כרת具有砍断、砍倒的具体动作含义，比泛化为“毁掉”更贴近原文。
- source_word: וַיִּשְׂרֹף
  choice: 焚烧了
  rationale: 直接表达用火烧毁，语体庄重简洁。
- source_word: בְּנַחַל קִדְרוֹן
  choice: 在汲沦谷
  rationale: נחל可指溪谷、干河床或谷地；“汲沦谷”符合该地的地理语境和中文圣经地名传统。
theological_decisions:
- issue: אֲשֵׁרָה的所指
  choice: 正文译作“亚舍拉”，不判定是女神还是崇拜标志
  alternative: 译作“亚舍拉女神”或“亚舍拉柱”
  rationale: 原词在语境中可指亚舍拉这位神祇，也可指其崇拜标志；本节另有一个被制造并砍倒的物件，因此不宜在正文中过度明确所指。
- issue: מַעֲכָה אִמּוֹ的亲属关系
  choice: 正文译作“他母亲玛迦”
  alternative: 译作“他祖母玛迦”
  rationale: 希伯来正文明确使用“母亲”，尽管王室用语有时可泛指祖母或女性祖先；正文保留原文张力，以脚注交代另一可能。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“王太后之位”体现宫廷职分；“可憎的偶像”传达原文的强烈负面评价，但以脚注保留祭祀物形制上的不确定性。所有脚注标记均置于相关词语之后。
