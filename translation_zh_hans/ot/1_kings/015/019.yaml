base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/019.yaml
  text: There is a covenant between me and you, between my father and your father. Look, I have sent you a bribe of silver and gold. Go, break your covenant with Baasha king of Israel, so that he may withdraw from me.
translation:
  language: zh_hans
  text: “你我之间，以及我父与你父之间，有盟约。看，我给你送来了金银作贿赂。去，废掉你同以色列王巴沙所立的盟约，使他离开我。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּרִית
  choice: 盟约
  rationale: 此处指两位君王及其父辈之间的政治条约；“盟约”既保留该词的正式分量，也符合外交语境。
- source_word: שֹׁחַד
  choice: 贿赂
  rationale: 该词通常指为影响对方行为而送出的财物；亚撒送金银正是要促使便哈达背弃与巴沙的盟约，因此译作“贿赂”而不弱化为中性的“礼物”。
- source_word: הָפֵרָה
  choice: 废掉
  rationale: Hiphil祈使式表达使盟约失效、予以破坏；“废掉”自然地传达正式取消现有盟约。
- source_word: וְיַעֲלֶה מֵעָלָי
  choice: 使他从我这里撤兵
  rationale: 字面为“使他从我身上/这里上去、离开”；上下文是巴沙对犹大的军事压力，汉语用“撤兵”明确表达语境所含之意。
- source_word: הִנֵּה
  choice: 看
  rationale: 保留原文引人注意的语气，同时符合庄重叙事中的直接引语。
theological_decisions:
- issue: 是否将政治条约用语作神学化处理
  choice: 译作“盟约”，但不增添神圣认可或宗教仪式含义
  alternative: 约定／条约
  rationale: בְּרִית可用于人与人及国家之间的盟约。本节没有表明此盟约具有神圣性质，故保留核心词义而不作额外神学诠释。
- issue: 是否缓和亚撒所送财物的伦理色彩
  choice: 直译为“贿赂”
  alternative: 礼物／赠礼
  rationale: שֹׁחַד带有用财物影响他人决定的负面意味；上下文也表明目的是诱使对方违约，不宜在译文中淡化这种张力。
translation_notes:
  register: 采用现代、庄重而清楚的君王外交口吻。“向来有”自然表达无动词名词句所陈述的既存关系；“我父与你父”保留原文简洁的平行结构。末句按军事上下文译为“撤兵”，避免生硬直译。
