base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/006.yaml
  text: And there was war between Rehoboam and Jeroboam all the days of his life[a].
translation:
  language: zh_hans
  text: 罗波安和耶罗波安之间一直有战争，终其一生。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“罗波安在世的日子，二人之间一直有战争。”有些解释者根据上下文和文本方面的讨论，认为这里的“其”是指亚比央（亚比雅）。
    reason: 保留希伯来文单数阳性代词所指的不确定性，并交代将其理解为罗波安或亚比央（亚比雅）的主要替代读法。
lexical_decisions:
- source_word: וּ/מִלְחָמָה
  choice: 常有战争
  rationale: מִלְחָמָה指“战争、争战”；结合存在句及全句所表达的持续时段，译为“常有战争”自然地传达长期敌对状态，同时不把它缩窄为某一场战役。句首连接词在中文叙事中不必机械译出。
- source_word: הָיְתָה
  choice: 有
  rationale: היה在这里构成存在句，译作“有”最符合现代汉语。持续意味主要由“终其一生”及语境表达。
- source_word: בֵין ... וּ/בֵין
  choice: ……和……之间
  rationale: 成对介词标明争战双方；“罗波安和耶罗波安之间”是自然、清楚的现代汉语表达。
- source_word: רְחַבְעָם
  choice: 罗波安
  rationale: 采用中文圣经传统中通行且易于识别的人名音译。
- source_word: יָרָבְעָם
  choice: 耶罗波安
  rationale: 采用中文圣经传统中通行且易于识别的人名音译。
- source_word: כָּל יְמֵי
  choice: 终……一生
  rationale: 该希伯来语惯用语表示某人一生的全部时期；“终其一生”简洁、庄重，也符合现代汉语。
- source_word: חַיָּיו
  choice: 其一生
  rationale: 保留第三人称单数男性代词的指称不明确性，不在正文中擅自补明所指人物。
theological_decisions:
- issue: “终其一生”中代词的所指
  choice: 正文保留“其”，不明确指定先行词
  alternative: 明确译作“终罗波安一生”或“终亚比央一生”
  rationale: 希伯来文只有第三人称单数男性后缀，当前分句并未明说所指。虽然最近的男性人名是耶罗波安，但上下文、平行经文及文本讨论使此处存在真实张力；因此正文保留代词形式，并由脚注说明主要解释。
translation_notes:
  register: 采用现代、庄重而通俗的叙事体。“常有战争”比逐字式“有战争”更自然地表达贯穿一生的敌对情形；“终其一生”保留原文代词的歧义。脚注标记已在正文中以[a]出现。
