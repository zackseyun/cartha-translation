  text: וַ/יָּבֵא֙ אֶת קָדְשֵׁ֣י אָבִ֔י/ו ו/קדש/ו בֵּ֣ית יְהוָ֑ה כֶּ֥סֶף וְ/זָהָ֖ב וְ/כֵלִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/015.yaml
  text: And he brought into the house of Yahweh the holy things of his father and his own holy things[a], silver and gold and vessels.
translation:
  language: zh_hans
  text: 他把父亲的圣物和自己的圣物[a]带进雅威的殿，即银、金和器皿。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“父亲所奉献的物件和他自己所奉献的物件”。
    reason: 词义也可用动作化表达，明确这些物件是父亲和他本人分别奉献的。
lexical_decisions:
- source_word: וַיָּבֵא
  choice: 带进
  rationale: 使役形在这里表示“带入”；目的地“雅威的殿”已经明示，用“带进”自然准确。
- source_word: קָדְשֵׁי אָבִיו
  choice: 父亲的圣物
  rationale: 复数构造形式指分别为圣、奉献作神圣用途的物件；“圣物”保留其礼仪含义，也不把奉献方式说得过细。
- source_word: וְקָדְשׁוֹ
  choice: 和自己的圣物
  rationale: 带第三人称阳性单数后缀的名词在此具有集合意义，与“父亲的圣物”形成平行；“自己的”清楚表明这些圣物属于本句主语。
- source_word: בֵּית יְהוָה
  choice: 雅威的殿
  rationale: בַּיִת在圣所语境中可自然译为“殿”；既保留具体建筑含义，也符合现代汉语表达。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文四字神名直接音译为“雅威”，保留经文中的专名功能。
- source_word: כֶּסֶף וְזָהָב וְכֵלִים
  choice: 银、金和器皿
  rationale: 按原文顺序列出圣物的内容；כֵּלִים含义宽泛，在圣殿语境中译作“器皿”既传统又不过度限定。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华／上主
  rationale: 原文直接使用四字神名，音译“雅威”可保留其作为立约神名的专名性质，而不以称号替代。
- issue: קֹדֶשׁ所指物件的性质
  choice: 圣物
  alternative: 所奉献的物件
  rationale: “圣物”保留这些物件已分别归于神圣用途的含义，同时避免断定奉献行为的具体形式；脚注提供动作化译法。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“即”表示末尾的银、金和器皿是对前述圣物的同位说明；正文保留“圣物”的简洁与原文平行结构，脚注交代较明确的奉献含义。
