  text: וַ/יְמִתֵ֣/הוּ בַעְשָׁ֔א בִּ/שְׁנַ֣ת שָׁלֹ֔שׁ לְ/אָסָ֖א מֶ֣לֶךְ יְהוּדָ֑ה וַ/יִּמְלֹ֖ךְ תַּחְתָּֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/028.yaml
  text: Baasha put him to death in the third year of Asa king of Judah[a], and reigned in his place.
translation:
  language: zh_hans
  text: 犹大王亚撒第三年，巴沙杀死了他[a]，接替他作王。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“使他死”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמִתֵהוּ
  choice: 杀死了他
  rationale: 该词是מות的使役词干，字面意思是“使他死”。“杀死了他”既表达使役和致死结果，也符合现代汉语叙事习惯；不用“处死”，以免加入司法行刑的含义。
- source_word: בַעְשָׁא
  choice: 巴沙
  rationale: 按现代中文圣经人名的通行音译处理。
- source_word: בִּשְׁנַת שָׁלֹשׁ
  choice: 第三年
  rationale: 介词ב与年数结构在王朝纪年公式中表示“在第三年”。中文省去“在”更简洁自然，时间关系仍然清楚。
- source_word: לְאָסָא מֶלֶךְ יְהוּדָה
  choice: 犹大王亚撒
  rationale: ל在王朝纪年公式中标明纪年所依据的君王；将头衔置于人名前，符合现代汉语常用表达。
- source_word: וַיִּמְלֹךְ
  choice: 作王
  rationale: מלך在此表示登上王位并掌权；结合后面的接替关系，“作王”自然且准确。
- source_word: תַּחְתָּיו
  choice: 接替他
  rationale: תחת加代词后缀在此表示王位上的取代与继承。“接替他”比字面式的“在他的位置上”更符合现代汉语。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。保留王朝纪年的紧凑表达，并以“接替他作王”清楚呈现王位更替。
