  yaml_path: translation/ot/1_kings/015/033.yaml
  text: In the third year of Asa king of Judah, Baasha son of Ahijah became king over all Israel in Tirzah, and he reigned twenty-four years.
translation:
  language: zh_hans
  text: 犹大王亚撒在位第三年，亚希雅的儿子巴沙在得撒登基，统治全以色列，共二十四年。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּשְׁנַת שָׁלֹשׁ לְאָסָא מֶלֶךְ יְהוּדָה
  choice: 犹大王亚撒在位第三年
  rationale: 介词ב与年份结构构成时间背景，לְאָסָא表示以亚撒的统治年为参照。中文用“在位第三年”自然保留王年纪年的公式。
- source_word: מָלַךְ
  choice: 登基
  rationale: 此处动词指巴沙开始作王，是即位事件；译作“登基”可与随后表示统治时长的成分区分。
- source_word: בַּעְשָׁא בֶן אֲחִיָּה
  choice: 亚希雅的儿子巴沙
  rationale: 按现代中文自然表达保留希伯来语父子称谓，并采用通行圣经人名译法。
- source_word: עַל כָּל יִשְׂרָאֵל
  choice: 统治全以色列
  rationale: עַל与מלך连用表示对人民行使王权；“全以色列”直接保留כָּל的范围表达。
- source_word: בְּתִרְצָה
  choice: 在得撒
  rationale: 前缀ב表示地点；“在得撒”表明其登基和施政所在之地。
- source_word: עֶשְׂרִים וְאַרְבַּע שָׁנָה
  choice: 共二十四年
  rationale: 该数词短语说明统治持续时间；中文补入“共”，使省略而由语境提供的持续意义清楚自然。
