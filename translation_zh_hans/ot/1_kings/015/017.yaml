base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/017.yaml
  text: Then Baasha king of Israel went up against Judah and built Ramah[b][a], so as not to allow anyone to go out or come in to Asa king of Judah.
translation:
  language: zh_hans
  text: 以色列王巴沙上来攻打犹大，修筑拉玛[a]，不许任何人到犹大王亚撒那里出入[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“加固拉玛”。希伯来文动词直译是“建造”，上下文则表明这是军事性的修筑。
    reason: lexical_alternative
  - marker: b
    text: “到……那里出入”指人员往来。巴沙修筑拉玛，是要封锁通往犹大王亚撒那里的交通。
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעַל ... עַל־יְהוּדָה
  choice: 上来攻打犹大
  rationale: עלה与עַל在军事语境中表示向敌方进军；“上来”保留地势方向，“攻打”明确敌对语义。
- source_word: וַיִּבֶן אֶת־הָרָמָה
  choice: 修筑拉玛
  rationale: בנה基本义为“建造、修筑”。此处拉玛是已有地名，军事语境暗示建设防御工事；“修筑”既自然，也不把正文明确化为原文未直说的“筑防”。
- source_word: לְבִלְתִּי תֵּת
  choice: 不让
  rationale: 该结构表达阻止或不准的目的；“不让”简洁自然。
- source_word: יֹצֵא וָבָא
  choice: 人出入
  rationale: 原文是“出去和进来”的惯用搭配，概括人员往来；汉语“出入”自然保留其双向移动含义。
- source_word: לְאָסָא מֶלֶךְ יְהוּדָה
  choice: 犹大王亚撒那里
  rationale: ל表示与亚撒有关的趋向或关系。译作“亚撒那里”保留原文未明说起点与终点的含混，不擅自补成“往来于”。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事体。人名、地名依中文圣经通行译法作“巴沙、拉玛、亚撒”；正文保留原文在“修筑”及人员与亚撒之关系上的适度含混，并以脚注说明军事和交通封锁语境。
