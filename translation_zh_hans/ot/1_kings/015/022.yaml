  text: וְ/הַ/מֶּ֨לֶךְ אָסָ֜א הִשְׁמִ֤יעַ אֶת כָּל יְהוּדָה֙ אֵ֣ין נָקִ֔י וַ/יִּשְׂא֞וּ אֶת אַבְנֵ֤י הָֽ/רָמָה֙ וְ/אֶת עֵצֶ֔י/הָ אֲשֶׁ֥ר בָּנָ֖ה בַּעְשָׁ֑א וַ/יִּ֤בֶן בָּ/ם֙ הַ/מֶּ֣לֶךְ אָסָ֔א אֶת גֶּ֥בַע בִּנְיָמִ֖ן וְ/אֶת הַ/מִּצְפָּֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/022.yaml
  text: Then King Asa summoned all Judah—no one was exempt—and they carried away the stones of Ramah and its timber[a], with which Baasha had built[c][b], and King Asa built with them Geba of Benjamin and Mizpah.
translation:
  language: zh_hans
  text: 于是，亚撒王召集全犹大人[a]，无人可以免役[b]。他们把巴沙修筑拉玛所用的石头和木料都搬走了[c]。亚撒王就用这些材料修筑便雅悯的迦巴和米斯巴。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “召集”也可译作“向全犹大发出号令”；希伯来语字面意思是“使全犹大听见”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来语字面为“没有一个得以免除的人”，意思是无人获准不参加这项劳役。
    reason: lexical_alternative
  - marker: c
    text: 原文的关系从句说明，这些石头和木料是巴沙修筑拉玛时使用的材料。
    reason: syntactic_clarification
lexical_decisions:
- source_word: הִשְׁמִיעַ
  choice: 召集
  rationale: 该词是שׁמע的使役形，字面为“使听见”，在这里指向全犹大发出号令、征调民众。“召集”自然表达其语境功能，同时以脚注保留“宣告”的字面可能。
- source_word: אֵין נָקִי
  choice: 无人可以免役
  rationale: נָקִי在此不是指道德上的“无罪”，而是指免除劳役或征调；“无人可以免役”准确传达所有人都必须参与搬运。
- source_word: וַיִּשְׂאוּ
  choice: 搬走了
  rationale: נשא在此表示把建筑材料从拉玛运走；“搬走”兼顾搬运和移除两层意思。
- source_word: אַבְנֵי הָרָמָה
  choice: 拉玛的石头
  rationale: 按希伯来语组合结构直译，并在整句中自然表达为从拉玛搬走的建筑石料。
- source_word: עֵצֶיהָ
  choice: 木料
  rationale: 这里所指是建筑用木材，而非泛指树木；“木料”符合现代汉语建筑语境。
- source_word: אֲשֶׁר בָּנָה בַּעְשָׁא
  choice: 巴沙修筑拉玛所用的
  rationale: 关系从句在语境中说明这些石头和木料是巴沙修筑拉玛使用的材料。这样处理可避免汉语误解为巴沙“建造木料”。
- source_word: וַיִּבֶן בָּם
  choice: 就用这些材料修筑
  rationale: 介词ב及其复数后缀回指石头和木料；明确说“这些材料”使指代清楚。
- source_word: גֶּבַע בִּנְיָמִן
  choice: 便雅悯的迦巴
  rationale: 保留原文地名与便雅悯的所属或地域关系，也用以区别同名地点。
- source_word: הַמִּצְפָּה
  choice: 米斯巴
  rationale: 采用通行的中文圣经地名音译；希伯来语定冠词在中文专名中无需另译。
