base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/024.yaml
  text: And Asa slept with his fathers and was buried with his fathers in the city of David his father[b][a], and Jehoshaphat his son reigned in his place.
translation:
  language: zh_hans
  text: 亚撒与列祖同睡[a]；他与列祖同葬在他祖先大卫[b]的城中。亚撒的儿子约沙法继位作王。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“与祖先同眠”。希伯来文直译为“与他的父辈同睡”，是记述君王去世和安葬的固定用语。
    reason: lexical_alternative
  - marker: b
    text: “他祖先大卫”指大卫是亚撒王室谱系中的先祖，并非他的生父。
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: 与……同睡
  rationale: 保留《列王纪》中表示死亡的固定王室用语；上下文中的安葬清楚表明这里指去世。
- source_word: עִם אֲבֹתָיו
  choice: 与列祖
  rationale: “列祖”既贴近希伯来语“他的父辈”，也自然表达历代祖先及王朝传承的含义。
- source_word: וַיִּקָּבֵר
  choice: 葬在
  rationale: 以自然简洁的中文表达尼法勒式在此处的被动含义“被安葬”。
- source_word: בְּעִיר דָּוִד אָבִיו
  choice: 在他祖大卫的城里
  rationale: 保留“大卫”与“他的父辈”之间的王朝关系，同时用“他祖”避免现代读者误以为大卫是亚撒的生父。
- source_word: וַיִּמְלֹךְ
  choice: 作王
  rationale: 符合王位继承记述的简洁中文表达。
- source_word: תַּחְתָּיו
  choice: 接续他
  rationale: 准确表达取代前王、承继王位之意，而不只是时间上的“在他以后”。
