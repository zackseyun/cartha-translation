base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/010.yaml
  text: He reigned forty-one years in Jerusalem[b][a], and his mother’s name was Maacah daughter of Abishalom.
translation:
  language: zh_hans
  text: 他在耶路撒冷作王四十一年。他母亲名叫玛迦，是亚比沙龙[a]的女儿[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文作“亚比沙龙”；许多中文译本按较常见的名称形式译作“押沙龙”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文作“女儿”；在族谱语境中，这个词也可较宽泛地指女性后裔。
    reason: alternative_reading
lexical_decisions:
- source_word: וְאַרְבָּעִים וְאַחַת שָׁנָה
  choice: 四十一年
  rationale: 希伯来语直译为“四十又一年”；现代汉语自然表达为“四十一年”。
- source_word: מָלַךְ
  choice: 作王
  rationale: 此处说明君王统治的年数，并非登基这一动作；“作王”准确而符合中文圣经叙事语体。
- source_word: בִּירוּשָׁלִָם
  choice: 在耶路撒冷
  rationale: 介词 בְּ 表示地点，“在耶路撒冷”是自然、准确的现代汉语。
- source_word: וְשֵׁם אִמּוֹ
  choice: 他母亲名叫
  rationale: 保留“他母亲的名字”这一信息，同时采用现代汉语中简洁自然的表达。
- source_word: מַעֲכָה
  choice: 玛迦
  rationale: 按通行中文圣经人名译法音译该专名。
- source_word: בַּת
  choice: 女儿
  rationale: 该词的直接词义是“女儿”；虽然在族谱语境中也可能泛指女性后裔，但正文不以解释性译法消除原文张力。
- source_word: אֲבִישָׁלוֹם
  choice: 亚比沙龙
  rationale: 依本节希伯来语形式 אֲבִישָׁלוֹם 音译，以区别于较常见的“押沙龙”这一名称形式；常见译名在脚注中说明。
theological_decisions:
- issue: 玛迦与亚比沙龙的亲属关系
  choice: 正文保留原文直称的“女儿”
  alternative: 孙女；女性后裔
  rationale: 原文明确使用 בַּת（女儿）。即使结合其他族谱材料可能将其理解为较远的女性后裔，译文也不应代替原文解决历史与族谱上的张力，因此将较宽泛的可能性留在脚注中。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“作王四十一年”延续中文历史叙事的常用表达；分为两句以避免欧化长句。脚注紧随各自所解释的词语，确保指向清楚。
