  yaml_path: translation/ot/1_kings/015/025.yaml
  text: Nadab son of Jeroboam became king over Israel in the second year of Asa king of Judah, and he reigned over Israel two years.
translation:
  language: zh_hans
  text: 耶罗波安的儿子拿答在犹大王亚撒第二年登基作以色列王，统治以色列两年。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/נָדָב בֶּן יָרָבְעָם
  choice: 耶罗波安的儿子拿答
  rationale: 按现代汉语自然语序表达父子关系；句首 וְ 在此承接王朝叙事，不另译为带有明确时间意义的“后来”或“当时”。人名采用通行圣经译名。
- source_word: מָלַךְ עַל יִשְׂרָאֵל
  choice: 登基作以色列王
  rationale: 首个 מָלַךְ 出现在登基纪年公式中，重点是即位，而非泛指统治过程；“登基作……王”清楚区分后文表示在位期限的同一词根动词。
- source_word: בִּ/שְׁנַת שְׁתַּיִם
  choice: 在……第二年
  rationale: 希伯来文用基数词“二”构成王年纪年惯用语，现代汉语自然表达为“第二年”。
- source_word: לְ/אָסָא מֶלֶךְ יְהוּדָה
  choice: 犹大王亚撒
  rationale: 介词 לְ 标明纪年的参照对象；“犹大王亚撒第二年”是简洁自然的汉语王年公式。
- source_word: וַ/יִּמְלֹךְ עַל יִשְׂרָאֵל שְׁנָתָיִם
  choice: 统治以色列两年
  rationale: 此处动词后接时长，表示在位统治的期限；译作“统治”既自然，又避免与前面的即位含义混淆。
