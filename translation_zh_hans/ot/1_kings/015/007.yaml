base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/007.yaml
  text: The rest of the acts of Abijam[a], and all that he did[b], are they not written in the Book of the Chronicles of the Kings of Judah? And there was war between Abijam and Jeroboam.
translation:
  language: zh_hans
  text: 亚比央[a]其余的事迹，以及他所做的一切，岂不都记在《犹大列王纪事》[b]中吗？亚比央和耶罗波安之间有战争。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些平行或相关经文称他为“亚比雅”；本节希伯来文本作“亚比央”。
    reason: alternative_reading
  - marker: b
    text: 或译：“《犹大列王年鉴》”。
    reason: lexical_alternative
lexical_decisions:
- source_word: יֶתֶר דִּבְרֵי אֲבִיָּם
  choice: 亚比央其余的事迹
  rationale: 王室史书的总结套语中，דִּבְרֵי指与君王有关的事迹，而不只是言语；“其余的事迹”准确且符合现代汉语表达。
- source_word: אֲבִיָּם
  choice: 亚比央
  rationale: 按本节马所拉文本אֲבִיָּם音译，不与相关经文中的另一名称形式“亚比雅”强行统一。
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: 以及他所做的一切
  rationale: 保留原文概括性，不把עָשָׂה收窄为某一类成就或政绩。
- source_word: הֲלוֹא הֵם כְּתוּבִים
  choice: 岂不都记在……中吗
  rationale: 保留הֲלוֹא所引出的反问形式；“记在”自然表达书面记载之意。
- source_word: סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יְהוּדָה
  choice: 《犹大列王纪事》
  rationale: 将史料标题译为简洁庄重的现代汉语；דִּבְרֵי הַיָּמִים在此指按时序编录的王室史事。
- source_word: וּמִלְחָמָה הָיְתָה
  choice: 常有战争
  rationale: 存在句表明双方处于战争状态；结合君王总结语境，“常有战争”比生硬的“有战争”更符合汉语，同时不具体断言某一场战役。
- source_word: בֵּין אֲבִיָּם וּבֵין יָרָבְעָם
  choice: 亚比央和耶罗波安之间
  rationale: 用现代汉语自然表达成对介词בֵּין...וּבֵין所标明的双方对立关系。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事文体。保留原文的反问句式，并按希伯来文本区分“亚比央”与相关经文中的“亚比雅”。脚注[b]置于史料标题之后，使其所说明的词语清楚明确。
