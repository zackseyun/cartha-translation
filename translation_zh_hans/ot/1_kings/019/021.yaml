  text: וַ/יָּ֨שָׁב מֵ/אַחֲרָ֜י/ו וַ/יִּקַּ֣ח אֶת צֶ֧מֶד הַ/בָּקָ֣ר וַ/יִּזְבָּחֵ֗/הוּ וּ/בִ/כְלִ֤י הַ/בָּקָר֙ בִּשְּׁלָ֣/ם הַ/בָּשָׂ֔ר וַ/יִּתֵּ֥ן לָ/עָ֖ם וַ/יֹּאכֵ֑לוּ וַ/יָּ֗קָם וַ/יֵּ֛לֶךְ אַחֲרֵ֥י אֵלִיָּ֖הוּ וַ/יְשָׁרְתֵֽ/הוּ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/021.yaml
  text: Then he turned back from following him[a], took the pair of oxen, and sacrificed them. With the oxen’s equipment he boiled the flesh and gave it to the people, and they ate[b]. Then he arose and went after Elijah and served him.
translation:
  language: zh_hans
  text: 以利沙就转身离开以利亚，取了那一对牛[a]，把它们宰了献祭。他用套牛的器具[b]作燃料，煮了肉，分给众人，众人就吃了。随后，他起身跟随以利亚，服侍他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“那一对套轭的牛”。
    reason: צֶמֶד既可突出数量上的“一对”，也包含共同套轭的意思。
  - marker: b
    text: 或译：“用牛轭或其他牛具”。
    reason: כְּלִי是范围较广的词，可泛指器具；在本处可能包括牛轭及其他套牛、耕作所用的木具。
lexical_decisions:
- source_word: וַיָּשָׁב מֵאַחֲרָיו
  choice: 以利沙就转身离开以利亚
  rationale: 原文直译近似“从他后面返回”。结合上一节以利沙追上以利亚、请求先回家辞别的语境，这里表达他暂时转身离开以利亚；明确姓名可避免现代汉语代词含混。
- source_word: צֶמֶד הַבָּקָר
  choice: 那一对牛
  rationale: צֶמֶד可指成对套轭的牲畜，也可突出“轭／一组”的概念。正文采用自然明确的“一对牛”，脚注保留“套轭的一对牛”的含义。
- source_word: וַיִּזְבָּחֵהוּ
  choice: 把它们宰了献祭
  rationale: זבח通常带有祭牲宰杀的意味。“宰了献祭”既表达实际宰杀，也保留祭祀色彩；不进一步说明献给谁或祭礼的具体形式。希伯来语宾语后缀为单数，承接作为集合单位的“一对牛”，汉语按实际所指用复数。
- source_word: וּבִכְלִי הַבָּקָר
  choice: 用套牛的器具
  rationale: כְּלִי范围较广，可指器具、用具或装备。这里指与耕牛配套的木制用具，并在烹煮时使用；正文不把其范围过度限定为“轭”。
- source_word: בִּשְּׁלָם הַבָּשָׂר
  choice: 煮了牛肉
  rationale: בשל可指煮或烹调；“煮”贴近其通常含义。“牛肉”在现代汉语中比直译“肉体／肉”自然，并由上下文明确来源。
- source_word: לָעָם וַיֹּאכֵלוּ
  choice: 分给众人，众人就吃了
  rationale: עם在此指当地共同进食的人群。“众人”简洁自然，重复主语可清楚表达复数动词“他们吃了”。
- source_word: וַיָּקָם וַיֵּלֶךְ אַחֲרֵי אֵלִיָּהוּ
  choice: 随后，他起身跟随以利亚
  rationale: 保留“起身”和“在……后面行走”的叙事次序；“跟随”是现代汉语对该动作最自然的表达。
- source_word: וַיְשָׁרְתֵהוּ
  choice: 服侍他
  rationale: שרת指在旁服侍，也可表示担任随从。“服侍他”直接而宽泛，不擅自限定其职责。
theological_decisions:
- issue: זבח是否应明确译出献祭含义
  choice: 译作“宰了献祭”
  alternative: 仅译作“宰了”
  rationale: 该动词通常具有祭牲宰杀的色彩，告别旧生活并与众人共食的语境也支持保留这一意味；但经文没有交代祭物献给谁或是否属于正式圣所礼仪，因此译文不作补充。
translation_notes:
  register: 采用庄重而通顺的现代标准普通话。叙事连接词简洁，保留原文连续动作的节奏；避免古奥的“起来往……后面去”，也不把献祭场合或牛具的具体种类说得超过原文。
