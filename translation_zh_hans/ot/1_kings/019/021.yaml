  naturalness: 修订文本采用自然、庄重的现代普通话。“用……作燃料，煮了肉”既通顺，也避免“牛肉”在此处略偏日常食材名称的语感。
  terminology: 以利亚、以利沙的通行译名正确。“宰了献祭”保留原文זבח的献祭意味，但不臆定献祭对象或礼仪形式。“服侍”恰当对应שרת。
