  text: וַ/יָּ֖קָם וַ/יֹּ֣אכַל וַ/יִּשְׁתֶּ֑ה וַ/יֵּ֜לֶךְ בְּ/כֹ֣חַ הָ/אֲכִילָ֣ה הַ/הִ֗יא אַרְבָּעִ֥ים יוֹם֙ וְ/אַרְבָּעִ֣ים לַ֔יְלָה עַ֛ד הַ֥ר הָ/אֱלֹהִ֖ים חֹרֵֽב׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/008.yaml
  text: So he arose and ate and drank[a], and went in the strength of that food forty days and forty nights to Horeb, the mountain of God.
translation:
  language: zh_hans
  text: 于是，他起来吃了喝了，靠着那食物所得的力量，走了四十昼夜，来到上帝的山何烈。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּקָם וַיֹּאכַל וַיִּשְׁתֶּה
  choice: 于是，他起来吃了喝了
  rationale: 三个连续叙事动词依次表达起身、吃、喝；“于是”自然承接上文，也体现希伯来叙事的推进。
- source_word: וַיֵּלֶךְ
  choice: 走了
  rationale: הלך在此表示前行、行走；结合“四十昼夜”可自然理解为旅程，无须额外加入“旅行”。
- source_word: בְּכֹחַ הָאֲכִילָה הַהִיא
  choice: 靠着那食物所得的力量
  rationale: 兼顾בְּכֹחַ的“凭借力量”和אֲכִילָה在上下文中由所吃食物带来滋养的含义；比直译“靠着那次吃食的力量”更符合现代汉语。
- source_word: אַרְבָּעִים יוֹם וְאַרְבָּעִים לַיְלָה
  choice: 四十昼夜
  rationale: 准确而凝练地表达连续四十天与四十夜的时段，符合庄重的现代汉语叙事。
- source_word: עַד
  choice: 来到
  rationale: 此处标示行程终点；汉语用“来到”比生硬的“直到”更自然，同时不改变目的地含义。
- source_word: הַר הָאֱלֹהִים
  choice: 上帝的山
  rationale: 保留希伯来语所属结构及其庄严意味，并明确指向以色列的上帝。
- source_word: חֹרֵב
  choice: 何烈
  rationale: 采用中文圣经传统中通行的地名音译。
theological_decisions:
- issue: הָאֱלֹהִים在הַר הָאֱלֹהִים中的理解
  choice: 上帝
  alternative: 神圣的／神的
  rationale: 在“何烈”这一固定的圣经地理称谓中，该词最自然地指以色列的上帝；译作“上帝的山”既忠实于原文，也不额外引入解释。
- issue: 四十昼夜与食物力量之间的关系
  choice: 保持原文陈述，不解释为神迹机制
  alternative: 明确说食物以神迹方式维持他四十昼夜
  rationale: 原文只说他凭那次进食所得的力量前行，并未解释其生理或神迹机制；译文保留这一张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“吃了喝了”简洁自然；“靠着那食物所得的力量”将希伯来语略显压缩的表达清楚呈现。因正文已表达英语脚注所说明的滋养含义，未另设脚注。
