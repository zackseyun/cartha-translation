source:
  edition: WLC
  text: וְ/אַחַ֤ר הָ/רַ֨עַשׁ֙ אֵ֔שׁ לֹ֥א בָ/אֵ֖שׁ יְהוָ֑ה וְ/אַחַ֣ר הָ/אֵ֔שׁ ק֖וֹל דְּמָמָ֥ה דַקָּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/012.yaml
  text: And after the earthquake[a], a fire; Yahweh was not in the fire. And after the fire, a sound of a gentle whisper.
translation:
  language: zh_hans
  text: 地震之后有火；雅威不在火中。火之后，有细微静谧之声[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这句希伯来语直译近于“细微静谧之声”，措辞刻意纤细而且难解；也可译作“轻柔的低语”、“微小的声音”或“寂静中细微的声音”。
    reason: 保留קוֹל דְּמָמָה דַקָּה的多义性及原文中“声音”与“静谧”的张力。
lexical_decisions:
- source_word: וְאַחַר הָרַעַשׁ
  choice: 地震之后
  rationale: רַעַשׁ在这一显现事件的次序中指地震或剧烈震动；“地震”简明自然。וְאַחַר承接前文，汉语用“之后”即可体现连续次序。
- source_word: אֵשׁ
  choice: 有火
  rationale: 此处引出继地震而来的下一现象。汉语不使用冠词，以“有火”自然表达希伯来语无冠词的אֵשׁ。
- source_word: לֹא בָאֵשׁ יְהוָה
  choice: 雅威不在火中
  rationale: 将介词ב按处所义译为“在……中”，保持原文反复句式，不额外说明神临在的方式。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常用的音译“雅威”呈现四字神名，保留其专名性质，不以称号代替。
- source_word: קוֹל
  choice: 声
  rationale: קוֹל既可指声音，也可指话语或嗓音；译作较宽泛的“声”，不擅自断定这里已有言语。
- source_word: דְּמָמָה
  choice: 静谧
  rationale: 该词可指寂静、安静或平静；“静谧”能与“声”形成原文特有的张力。
- source_word: דַקָּה
  choice: 细微
  rationale: 阴性形容词דַקָּה有细、薄、微小之意；“细微”在现代汉语中自然，同时保留声音轻细微弱的意象。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名。音译“雅威”保留其作为以色列之神专名的性质，避免用称号取代。
- issue: קוֹל דְּמָמָה דַקָּה这一难解短语
  choice: 细微静谧之声
  alternative: 轻柔的低语；微小的声音；寂静中细微的声音
  rationale: 原文近乎直译为“细微静谧之声”，有意形成“声”与“静谧”之间的张力。正文保留这种含混和悖论感，不明确补入“说话”或将其完全解释成耳语；较通顺的可能译法列入脚注。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。以简短并列句保存希伯来叙事的节奏；末句略带陌生感，是为保留原文刻意而难解的表达，并以脚注辅助普通读者。
