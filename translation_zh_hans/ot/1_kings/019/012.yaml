  terminology: “雅威”准确一致地处理四字神名。“地震”“火中”“声”“静谧”“细微”均与原文字义范围相符；其中“静谧”与“声”的组合有效保留歧义。脚注说明了直译性质和主要替代译法，锚点置于难解短语后亦正确。
