base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/002.yaml
  text: Then Jezebel sent a messenger to Elijah[a], saying, “So may the gods do, and more also, if by this time tomorrow I do not make your life like the life of one of them.”
translation:
  language: zh_hans
  text: 于是，耶洗别派使者去见以利亚，说：“愿众神惩罚我，并且加倍惩罚我；明天这个时候，我若不使你的性命和他们中一个人的性命一样。”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “众神”也可译作“上帝”。希伯来语 אֱלֹהִים 可作单数或复数理解；本句所配动词为复数形式，且说话者是耶洗别，因此正文采用复数译法。
    reason: 保留 אֱלֹהִים 单复数解释上的真实歧义。
lexical_decisions:
- source_word: וַתִּשְׁלַח
  choice: 于是……派
  rationale: 未完成式连续体推动叙事向前；“于是”自然表达事件的承接。
- source_word: מַלְאָךְ
  choice: 使者
  rationale: 宫廷语境中指奉命传话的人，而非超自然的天使。
- source_word: כֹּה יַעֲשׂוּן אֱלֹהִים וְכֹה יוֹסִפוּן
  choice: 愿众神重重惩罚我……就任凭众神这样待我
  rationale: 这是固定的起誓咒诅格式。中文需要重组语序，才能清楚表达说话者以自己受罚为担保的誓言；“重重惩罚”传达“这样行，并且加倍”的强化意义。
- source_word: אֱלֹהִים
  choice: 众神
  rationale: 这里的两个动词均为复数形式，且说话者是耶洗别，因此复数义最符合直接语境；同时以脚注保留单数“上帝”的可能。
- source_word: כִּי
  choice: 若
  rationale: 在誓言格式中引出使咒诅成立的条件，现代汉语用“若”表达自然且庄重。
- source_word: כָעֵת מָחָר
  choice: 明天这个时候
  rationale: 准确表达次日相应时刻，不额外加入原文未明确表达的截止含义。
- source_word: אָשִׂים אֶת־נַפְשְׁךָ
  choice: 使你的性命……一样
  rationale: 保留 שׂים 与 נֶפֶשׁ 的使成结构和“性命”这一宾语，而不直接释义为“杀死你”。
- source_word: נַפְשְׁךָ / כְּנֶפֶשׁ אַחַד מֵהֶם
  choice: 你的性命像他们中一人的性命一样
  rationale: “性命”在此指人的生命，而非与身体相对的灵魂；重复“性命”保留希伯来文的对应结构。
theological_decisions:
- issue: 耶洗别誓言中 אֱלֹהִים 的单复数
  choice: 正文译作“众神”
  alternative: “上帝”
  rationale: 名词形态可作单数“上帝”或复数“众神”，但此处相配的动词为复数，且耶洗别的宗教背景支持复数理解。由于单数读法在语法和传统中仍有可能，脚注予以保留。
- issue: 誓言公式是否补出受罚对象“我”
  choice: 在中文誓言结构中明确补出“我”
  alternative: 机械直译为“愿众神这样行，并且加倍”
  rationale: 原文固定公式省略了受罚对象，但其语用含义是说话者自我咒诅。中文若完全不补出，意思不完整；以功能对等方式补出“我”，不改变誓言内容。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“就任凭……这样待我”呈现古代誓言的自我咒诅逻辑；避免将威胁直接意译为“杀死你”，以保留原文两次使用“性命”的修辞对应。
