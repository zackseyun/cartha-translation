id: 1KI.19.14
reference: 1 Kings 19:14
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יֹּאמֶר֩ קַנֹּ֨א קִנֵּ֜אתִי לַ/יהוָ֣ה אֱלֹהֵ֣י צְבָא֗וֹת כִּֽי עָזְב֤וּ בְרִֽיתְ/ךָ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל אֶת מִזְבְּחֹתֶ֣י/ךָ הָרָ֔סוּ וְ/אֶת נְבִיאֶ֖י/ךָ הָרְג֣וּ בֶ/חָ֑רֶב וָ/אִוָּתֵ֤ר אֲנִי֙ לְ/בַדִּ֔/י וַ/יְבַקְשׁ֥וּ אֶת נַפְשִׁ֖/י לְ/קַחְתָּֽ/הּ׀־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/014.yaml
  text: And he said[a], “I have been very zealous for Yahweh, the God of hosts, because the sons of Israel have forsaken your covenant, torn down your altars, and killed your prophets with the sword. I alone am left, and they seek my life[b], to take it.”
translation:
  language: zh_hans
  text: 他说：“我为雅威——万军之上帝大发热心[a]，因为以色列人背弃了你的约，拆毁了你的祭坛，用刀杀了你的先知；只剩下我一个人，他们正寻索我的性命，想要夺去[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我为雅威极其热心。”希伯来文以不定式绝对式与同根动词连用，加强语气；该词根在其他语境也可含“嫉妒／忌邪”之意。
    reason: 保留 קַנֹּא קִנֵּאתִי 的强调结构及相关词义背景，同时采用适合以利亚自述的自然汉语。
  - marker: b
    text: 直译：“他们寻索我的性命，要把它取去。”
    reason: 保留 נַפְשִׁי“我的性命”以及后面回指该词的代词，并说明“寻索”与目的结构。
lexical_decisions:
- source_word: קַנֹּא קִנֵּאתִי
  choice: 大发热心
  rationale: 不定式绝对式与限定动词连用，强化“热心”的程度。“大发热心”在现代汉语中自然表达这种强调，也避免把此处误解为出于嫉妒。
- source_word: לַיהוָה
  choice: 为雅威
  rationale: 介词 ל 表明以雅威为热心所指向的对象；将四字神名音译为“雅威”，保留其专名性质。
- source_word: אֱלֹהֵי צְבָאוֹת
  choice: 万军之上帝
  rationale: 这是固定的神圣称号；“万军”保留 צְבָאוֹת 可涵盖天上与地上众军的宽广含义，不作过度限定。
- source_word: עָזְבוּ בְרִיתְךָ
  choice: 背弃了你的约
  rationale: עָזַב 在盟约语境中表示离弃、抛弃；“背弃”既自然，也传达违约的严重性。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 该短语字面为“以色列的儿子们”，在这里是全体民族的惯用称呼；译作“以色列人”符合现代汉语习惯，并不把所指范围不必要地限于男性。
- source_word: מִזְבְּחֹתֶיךָ הָרָסוּ
  choice: 拆毁了你的祭坛
  rationale: הָרַס 表示拆除、毁坏建筑物；“拆毁”准确而形象。
- source_word: נְבִיאֶיךָ הָרְגוּ בֶחָרֶב
  choice: 用刀杀了你的先知
  rationale: 保留 בֶחָרֶב 的工具含义和原文暴力行为的具体性。
- source_word: וָאִוָּתֵר אֲנִי לְבַדִּי
  choice: 只剩下我一个人
  rationale: 自然表达 אֲנִי לְבַדִּי 对以利亚孤立处境的强调。
- source_word: וַיְבַקְשׁוּ אֶת נַפְשִׁי לְקַחְתָּהּ
  choice: 他们还要取我的性命
  rationale: נֶפֶשׁ 在此惯用语中指人的生命；合并表达目的结构，使中文简洁自然，同时保留对方企图杀害以利亚的含义。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名。音译“雅威”保留其作为盟约之神专名的性质，同时不把它转换成称号。
- issue: קַנֹּא קִנֵּאתִי 的语义
  choice: 大发热心
  alternative: 极其嫉妒；极其忌邪
  rationale: 该表达可涉及“热心”与“嫉妒/忌邪”的相关语义。结合以利亚为雅威及其约所发的热忱，正文采用现代汉语较少引起误解的“大发热心”，并以脚注保留较贴近词形的另一译法。
- issue: בְּנֵי יִשְׂרָאֵל 的群体指称
  choice: 以色列人
  alternative: 以色列的众子
  rationale: 这里是民族整体的惯用名称，而非专指男性后裔；采用自然、准确的现代汉语群体称谓。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。句式保留以利亚申诉的递进节奏；以分号突出“只剩下我一个人”所表达的孤立和危迫。正文所有脚注标记均已对应出现。
