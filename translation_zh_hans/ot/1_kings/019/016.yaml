  text: וְ/אֵת֙ יֵה֣וּא בֶן נִמְשִׁ֔י תִּמְשַׁ֥ח לְ/מֶ֖לֶךְ עַל יִשְׂרָאֵ֑ל וְ/אֶת אֱלִישָׁ֤ע בֶּן שָׁפָט֙ מֵ/אָבֵ֣ל מְחוֹלָ֔ה תִּמְשַׁ֥ח לְ/נָבִ֖יא תַּחְתֶּֽי/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/016.yaml
  text: And you shall anoint Jehu son of Nimshi as king over Israel[a], and Elisha son of Shaphat from Abel-meholah you shall anoint as prophet in your place.
translation:
  language: zh_hans
  text: 你要膏宁示的儿子耶户作以色列王；又要膏来自亚伯·米何拉的沙法的儿子以利沙作先知，接替你[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“在你之后”或“代替你”；希伯来语既可表示继任，也可表示替代。
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּמְשַׁח
  choice: 你要膏
  rationale: 该词是动词 משׁח 的 Qal 未完成式第二人称阳性单数；在委任语境中表达指令。“要膏”既保留命令意味，也符合现代中文圣经语体。
- source_word: לְמֶלֶךְ
  choice: 作……王
  rationale: 介词 לְ 在此标示受任的身份或职分；中文用“作……王”自然表达任命。
- source_word: עַל יִשְׂרָאֵל
  choice: 作以色列王
  rationale: עַל 表示治理对象。中文通常以“作以色列王”自然包含“统治以色列”的含义，避免生硬地译作“在以色列之上作王”。
- source_word: יֵהוּא בֶן נִמְשִׁי
  choice: 宁示的儿子耶户
  rationale: 保留希伯来文的父子身份结构，并采用现代中文圣经中通行的人名译法。
- source_word: מֵאָבֵל מְחוֹלָה
  choice: 亚伯·米何拉人
  rationale: 前缀 מִן 表示来源地；“亚伯·米何拉人”在中文中简洁自然地表明以利沙来自该地。
- source_word: אֱלִישָׁע בֶּן שָׁפָט
  choice: 沙法的儿子以利沙
  rationale: 保留父子身份结构，并采用中文圣经通行的人名译法。
- source_word: לְנָבִיא
  choice: 作先知
  rationale: 介词 לְ 标示受任的职分；“作先知”准确而自然。
- source_word: תַּחְתֶּיךָ
  choice: 接替你
  rationale: תַּחַת 可表达处于某人之下、继某人之后或代替某人。语境涉及先知职分的承接，“接替你”兼顾继任与替代意味，而脚注保留其他可能译法。
- source_word: וְאֵת ... וְאֶת
  choice: ……；又……
  rationale: אֵת 是直接宾语标记，不单独翻译；第二个 וְ 以“又”呈现并列指令，分号使中文层次清楚。
theological_decisions:
- issue: תַּחְתֶּיךָ 所表达的以利沙与以利亚之间的关系
  choice: 译作“接替你”，表示以利沙承接以利亚的先知职分。
  alternative: 也可理解为偏重时间先后的“在你之后”，或偏重替代意味的“代替你”。
  rationale: “接替你”保留职分承接的核心意思，却不把经文限定为纯粹的时间先后，也不强化为突然撤换；脚注明确保留希伯来语本身的语义张力。
translation_notes:
  register: 采用庄重、清楚的现代标准普通话。“膏”“先知”等词保留必要的圣经专门用语；人名、地名采用简体中文圣经的通行译名。原英文咨询层把脚注标记置于“以色列”之后，但脚注实际说明的是 תַּחְתֶּיךָ，因此中文稿将标记置于“接替你作先知”之后。
