base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/009.yaml
  text: There he came to the cave and spent the night there. And behold[a], the word of Yahweh came to him and said to him, “What are you doing here, Elijah?”
translation:
  language: zh_hans
  text: 他来到那里的一处洞穴，就在那里过夜。这时，雅威的话临到他，对他说：“以利亚，你在这里做什么？[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“以利亚，你为什么在这里？”希伯来语这一习语按字面结构近似：“什么与你在这里有关？”
    reason: 保留 מַה לְּךָ פֹה 所问的处境、行为或缘由的语义幅度，避免将其限定为单纯询问动机。
lexical_decisions:
- source_word: וַיָּבֹא שָׁם אֶל הַמְּעָרָה
  choice: 他在那里进了那洞
  rationale: בוא 与 אֶל 连用表示来到、进入某处；译为“进了”符合这里以洞为留宿地点的语境。“那洞”保留定冠词所指的特定洞穴。
- source_word: וַיָּלֶן שָׁם
  choice: 在洞里过夜
  rationale: לון/לין 表示住宿、过夜；“过夜”是自然的现代汉语。将 שָׁם 具体化为“在洞里”，清楚承接前句而不改变所指。
- source_word: וְהִנֵּה
  choice: 忽然
  rationale: הִנֵּה 在叙事中引人注意，并使新事件显得突然而鲜明；“忽然”自然传达这种话语功能。
- source_word: דְבַר יְהוָה
  choice: 雅威的话
  rationale: 保留常见的先知启示用语“……的话”，并将神名 יהוה 音译为“雅威”。
- source_word: וַיֹּאמֶר לוֹ
  choice: 对他说
  rationale: 保留希伯来文中“话临到他，并对他说”的连续表达；其主语在语法上承接“雅威的话”。
- source_word: מַה לְּךָ פֹה
  choice: 你在这里做什么
  rationale: 该习语直译近似“你在这里有什么”；在语境中是追问以利亚身处此地的情形或缘由。“你在这里做什么”自然，并避免只限定为对动机的询问。
- source_word: אֵלִיָּהוּ
  choice: 以利亚
  rationale: 采用现代中文圣经传统中通行的人名译法。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”以现代汉语中常见的形式音译该专名，而不是以称号替代。
- issue: דְבַר יְהוָה 启示公式的表达
  choice: 雅威的话
  alternative: 从雅威而来的信息
  rationale: “雅威的话”保留原文的标准先知性公式及其神学分量，也不把“话”解释性缩窄为一般“信息”。
- issue: מַה לְּךָ פֹה 所问的重点
  choice: 你在这里做什么
  alternative: 你为什么在这里
  rationale: 原文习语可同时触及以利亚在此的处境、行为和缘由；正文采用较宽的问法，脚注保留偏重原因的理解。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“忽然”承担 הִנֵּה 的叙事提示作用；问句按汉语习惯将称呼置前。正文保留原文略显重复的启示结构，但避免生硬直译。
