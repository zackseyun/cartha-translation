source:
  edition: WLC
  text: וְ/הֽוּא הָלַ֤ךְ בַּ/מִּדְבָּר֙ דֶּ֣רֶךְ י֔וֹם וַ/יָּבֹ֕א וַ/יֵּ֕שֶׁב תַּ֖חַת רֹ֣תֶם אחת וַ/יִּשְׁאַ֤ל אֶת נַפְשׁ/וֹ֙ לָ/מ֔וּת וַ/יֹּ֣אמֶר רַ֗ב עַתָּ֤ה יְהוָה֙ קַ֣ח נַפְשִׁ֔/י כִּֽי לֹא ט֥וֹב אָנֹכִ֖י מֵ/אֲבֹתָֽ/י־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/004.yaml
  text: But he himself went a day's journey into the wilderness[a], and came and sat down under a broom tree. And he asked that he might die, and said, “It is enough; now, Yahweh, take my life[b], for I am no better than my fathers.”
translation:
  language: zh_hans
  text: 他独自走进旷野，走了一天的路程后，来到一棵罗腾树[a]下坐下。他求死，说：“够了！现在，耶和华啊，求你取走我的性命，因为我不比我的列祖更好。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “罗腾树”指荒漠中的一种灌木；也可译作“罗腾灌木”。
    reason: 说明较陌生的植物名称，并避免对其现代植物学对应作过度确定。
lexical_decisions:
- source_word: בַּמִּדְבָּר
  choice: 走进旷野
  rationale: מִדְבָּר指旷野或荒漠地带；结合הלך的移动含义，译为“走进旷野”自然且准确。
- source_word: דֶּרֶךְ יוֹם
  choice: 走了一天的路程
  rationale: 该结构表示一天所走的路程；此译既保留距离概念，也符合现代汉语叙事。
- source_word: רֹתֶם אַחַת
  choice: 一棵罗腾树
  rationale: רֹתֶם是生长于荒漠的灌木，通常认为是金雀花类植物；采用音译并加类别词，避免把具体植物误定为另一现代物种。
- source_word: וַיִּשְׁאַל אֶת־נַפְשׁוֹ לָמוּת
  choice: 他求死
  rationale: 这是希伯来语习语，意为为自己请求死亡；“求死”简洁、自然，并保留其主动向上帝祈求的语境。
- source_word: רַב עַתָּה
  choice: 够了！……现在
  rationale: רַב在此是“够了”的感叹；עַתָּה另译为“现在”，保留原文断裂而急切的语气。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文读者熟悉的专名形式呈现四字神名，而不以称号代替。
- source_word: קַח נַפְשִׁי
  choice: 取走我的性命
  rationale: נֶפֶשׁ在此语境指人的生命，而非强调与身体区分的“灵魂”；“取走我的性命”与前面的求死呼应。
- source_word: כִּי לֹא טוֹב אָנֹכִי מֵאֲבֹתָי
  choice: 因为我并不比我的列祖强
  rationale: טוֹב与比较介词מִן构成“不比……更好/更强”；“强”在此自然表达以利亚认为自己未胜过先辈的意思，同时不把它限定为道德评价。
theological_decisions:
- issue: 四字神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文以以色列上帝的专名作直接称呼。正文采用现代中文圣经传统中辨识度最高的专名“耶和华”；“雅威”是较接近学界常见重构读音的另一译法。
- issue: נֶפֶשׁ在求死语境中的含义
  choice: 性命
  alternative: 灵魂
  rationale: 上下文明确是请求死亡，因此这里指生命或本人；译作“灵魂”可能引入原文此处并未强调的身心二分观。
- issue: “列祖”所指范围
  choice: 保留“我的列祖”
  alternative: 我的先辈
  rationale: אֲבֹתָי可指祖先或前人。保留较正式的“列祖”，不武断判定以利亚是在比较血缘祖先、属灵先辈还是历代前人。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“他自己却”突出原文独立主语所带的转折和孤身行动；直接引语以短句和感叹号传达以利亚的疲惫与急切。
