source:
  edition: WLC
  text: וַ/יְהִ֣י כִּ/שְׁמֹ֣עַ אֵלִיָּ֗הוּ וַ/יָּ֤לֶט פָּנָי/ו֙ בְּ/אַדַּרְתּ֔/וֹ וַ/יֵּצֵ֕א וַֽ/יַּעֲמֹ֖ד פֶּ֣תַח הַ/מְּעָרָ֑ה וְ/הִנֵּ֤ה אֵלָי/ו֙ ק֔וֹל וַ/יֹּ֕אמֶר מַה לְּ/ךָ֥ פֹ֖ה אֵלִיָּֽהוּ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/013.yaml
  text: And when Elijah heard it[a], he wrapped his face in his cloak, and went out and stood at the entrance of the cave. And behold, a voice came to him and said, “What are you doing here[b], Elijah?”
translation:
  language: zh_hans
  text: 以利亚听见了[a]，就用外袍蒙住脸，出去站在洞口。看哪，有声音对他说：“以利亚，你在这里做什么[b]？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文没有明说“听见”的对象；按上下文，是指前一节刚刚提到的声响或声音。
    reason: 保留原文省略的宾语及其指代范围。
  - marker: b
    text: 也可译作“你在这里有什么事？”这个希伯来语习语是在问以利亚到这里来的事务、目的或缘由。
    reason: 说明习语的语义范围及可行译法。
lexical_decisions:
- source_word: כִּשְׁמֹעַ
  choice: 听见了
  rationale: כְּ加不定式构成时间从句，译文借前后动作的衔接自然表达“当……听见时”；希伯来文没有明说所听见的对象，中文也不补定具体对象，以保留原文含蓄。
- source_word: וַיָּלֶט פָּנָיו
  choice: 用……蒙住脸
  rationale: 该动词表示紧密包裹或遮盖；结合“脸”和所用衣物，现代汉语以“蒙住脸”最自然清楚。
- source_word: בְּאַדַּרְתּוֹ
  choice: 用外袍
  rationale: אַדֶּרֶת指外层衣物，也可指具有标志性的先知衣袍；“外袍”既便于现代读者理解，也不过度加入解释。
- source_word: וַיֵּצֵא וַיַּעֲמֹד
  choice: 出去站在
  rationale: 忠实呈现两个连续动作：从洞内出去，并在洞口站定；中文叙事中这样表达简洁自然。
- source_word: פֶּתַח הַמְּעָרָה
  choice: 洞口
  rationale: פֶּתַח意为开口或入口；“洞口”是现代汉语中准确而自然的对应表达。
- source_word: וְהִנֵּה
  choice: 看哪
  rationale: 保留הִנֵּה使场景鲜明呈现、引人注意的叙事作用，不增添原文没有明说的“忽然”之意。
- source_word: אֵלָיו קוֹל
  choice: 有声音对他说
  rationale: 原文是无动词句，直译为“看哪，向着他有声音”；此译法符合现代汉语，同时不指明声音的发出者，保留原文的表达。
- source_word: מַה לְּךָ פֹה
  choice: 你在这里做什么
  rationale: 该希伯来语习语询问人在此地的事务、目的或缘由；此译法自然，并比“你为什么在这里”更完整地保留语义范围。
- source_word: אֵלִיָּהוּ
  choice: 以利亚
  rationale: 采用现代中文圣经传统中通行的人名译法。
theological_decisions:
- issue: “听见”之后省略的宾语
  choice: 不在正文中补出具体宾语，仅以脚注说明
  alternative: 听见那声音／听见那微小的声音
  rationale: 本节希伯来文没有宾语；上下文虽指向前一节所述之声响或声音，但明确补成某一种会消除原文保留的叙事张力。
- issue: 声音发出者的身份
  choice: 有声音对他说
  alternative: 耶和华对他说
  rationale: 本句只明说“声音”，没有直接重述发声者；译文不把上下文推定写入正文。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“看哪”有意保留原文鲜明引介场景的语气；其余叙事尽量使用普通读者易懂的表达。脚注标记按其实际说明对象放置：听见后的[a]说明隐含宾语，问句后的[b]说明希伯来语习语。
