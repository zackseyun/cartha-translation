  text: וַ/יִּשְׁכַּב֙ וַ/יִּישַׁ֔ן תַּ֖חַת רֹ֣תֶם אֶחָ֑ד וְ/הִנֵּֽה זֶ֤ה מַלְאָךְ֙ נֹגֵ֣עַ בּ֔/וֹ וַ/יֹּ֥אמֶר ל֖/וֹ ק֥וּם אֱכֽוֹל־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/005.yaml
  text: Then he lay down and slept under a broom tree. And behold[a], an angel touched him and said to him, “Get up, eat.”
translation:
  language: zh_hans
  text: 他就躺在一棵罗腾树下睡着了。忽然，有一位天使[a]碰了碰他，对他说：“起来吃吧！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“使者”。希伯来语 מַלְאָךְ 既可指人的使者，也可指天使；这里的上下文较支持“天使”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב וַיִּישַׁן
  choice: 他就躺……睡着了
  rationale: 两个连续的叙事动词依次表达躺下与睡眠；用“就”承接上文，以“睡着了”自然呈现动作的进展。
- source_word: תַּחַת רֹתֶם אֶחָד
  choice: 在一棵罗腾树下
  rationale: תַּחַת意为“在……下面”；רֹתֶם指旷野中的一种灌木，采用较为准确且保留原物种名称的“罗腾树”。אֶחָד在此具有不定指作用，译作“一棵”。
- source_word: וְהִנֵּה זֶה
  choice: 忽然，有一位
  rationale: 该结构在叙事中提示突然而醒目的新情况；“忽然，有一位”比直译“看哪，这”更符合现代汉语，同时保留其突显作用。
- source_word: מַלְאָךְ
  choice: 天使
  rationale: 该词可指一般使者，也可指天使；结合随后超自然的供应，正文采用“天使”，并以脚注保留“使者”的可能。
- source_word: נֹגֵעַ בּוֹ
  choice: 碰了碰他
  rationale: 分词נֹגֵעַ表示接触；汉语叠词“碰了碰”自然表达引起熟睡者注意的轻触，但不引入击打之意。
- source_word: וַיֹּאמֶר לוֹ
  choice: 对他说
  rationale: 自然对应原文明确的间接宾语“对他”。
- source_word: קוּם אֱכֹל
  choice: 起来吃吧
  rationale: 两个简短命令依次为“起来”和“吃”；“吧”使现代汉语中的吩咐自然，但不增加命题内容。
theological_decisions:
- issue: מַלְאָךְ应译为“天使”还是“使者”
  choice: 天使
  alternative: 使者
  rationale: 词本身具有两种可能；本段的旷野供应和后续叙事较支持超自然使者，因此正文用“天使”，但脚注明示词义上的另一可能，避免把歧义完全抹去。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。“罗腾树”保留原植物名称；“忽然”传达וְהִנֵּה的突显功能。引语简洁，符合原文两个命令式的力度。
