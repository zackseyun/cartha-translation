  text: וַ/יֹּ֗אמֶר צֵ֣א וְ/עָמַדְתָּ֣ בָ/הָר֮ לִ/פְנֵ֣י יְהוָה֒ וְ/הִנֵּ֧ה יְהוָ֣ה עֹבֵ֗ר וְ/ר֣וּחַ גְּדוֹלָ֡ה וְ/חָזָ֞ק מְפָרֵק֩ הָרִ֨ים וּ/מְשַׁבֵּ֤ר סְלָעִים֙ לִ/פְנֵ֣י יְהוָ֔ה לֹ֥א בָ/ר֖וּחַ יְהוָ֑ה וְ/אַחַ֤ר הָ/ר֨וּחַ רַ֔עַשׁ לֹ֥א בָ/רַ֖עַשׁ יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/011.yaml
  text: And he said[a], “Go out and stand on the mountain before Yahweh.” And behold, Yahweh was passing by, and a great and strong wind was tearing apart the mountains and shattering rocks before Yahweh, but Yahweh was not in the wind. And after the wind, an earthquake[b], but Yahweh was not in the earthquake.
translation:
  language: zh_hans
  text: 他对他说：“你出去，站在山上，立在雅威面前。”看哪，雅威正经过；一阵强大而猛烈的风在雅威面前，撕裂山岭，击碎岩石；但雅威不在风中。[a] 风后有地震，但雅威不在地震中。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“雅威不在风中”。这可能表示雅威没有在风中显现，但正文保留原文较为含蓄的说法。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“雅威不在地震中”。原文没有进一步说明“不在其中”的具体含义，正文保留这一表达。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常用音译呈现四字神名，保留其作为专名的性质，不用“耶和华”或“主”替代。
- source_word: צֵא וְעָמַדְתָּ
  choice: 你出去，站在
  rationale: 分别保留两个动词的命令语气；“出去，站在”自然清楚，不额外强化。
- source_word: לִפְנֵי יְהוָה
  choice: 来到雅威面前
  rationale: 保留“在……面前”的空间及临在意味；加入“来到”使汉语命令句衔接自然，但不把短语扩释为抽象的“在场”。
- source_word: וְהִנֵּה
  choice: 看哪
  rationale: 作为叙事提示语，保留原文所营造的突现感和庄重语体。
- source_word: עֹבֵר
  choice: 正从那里经过
  rationale: 用“正……经过”表达分词所呈现的进行性；“那里”在汉语中使移动场景更清楚，并未规定经过的具体路线。
- source_word: רוּחַ גְּדוֹלָה וְחָזָק
  choice: 一阵猛烈的强风
  rationale: 语境明确指能撕裂山岭的风；“猛烈的强风”兼顾两个形容成分，又符合现代汉语习惯。
- source_word: מְפָרֵק הָרִים וּמְשַׁבֵּר סְלָעִים
  choice: 撕裂山岭，击碎岩石
  rationale: 保留两个并列的强烈动作及“山岭／岩石”的对应，形成简洁鲜明的画面。
- source_word: רַעַשׁ
  choice: 地震
  rationale: 该词可指震动或地震；在此自然现象的连续场景中，“地震”最符合上下文。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名，因此以音译专名呈现，避免用称号替代，也不引入其他传统读法。
- issue: “雅威不在风中／地震中”的含义
  choice: 保留“不在……中”的位置性表达
  alternative: 雅威没有借着风／地震显现；雅威不临在于风／地震中
  rationale: 原文只说雅威“不在”这些现象中，没有明确解释为不掌管、不参与或不借此启示；直译可保留叙事中的神学张力。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“看哪”保留希伯来叙事的突现提示；其余句式力求自然简洁。脚注标记分别紧随其所解释的“不在风中”和“不在地震中”，避免英文咨询层中首个标记位置与脚注内容不相符的问题。
