  verdict: revise
  source_fidelity: 整体忠实传达了以利亚的申诉、加强式的热心、以色列人的背约行为，以及他所感受到的孤立和死亡威胁。惟末句“他们还要寻索”把希伯来文未完成式所表述的当前、持续性威胁较明显地推向“将来还要”的意思；删去“还要”并用“正”更贴合语境。
