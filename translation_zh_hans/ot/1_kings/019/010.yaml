  terminology: “耶和华”恰当地保留神名；“万军之上帝”忠实对应“万军的神”，且与本译文采用“上帝”的称谓一致。“大发热心”自然表达希伯来文不定式绝对形加限定动词的强调，不误导为人际性的嫉妒。
