source:
  edition: WLC
  text: וַ/יֹּאמֶר֩ קַנֹּ֨א קִנֵּ֜אתִי לַ/יהוָ֣ה אֱלֹהֵ֣י צְבָא֗וֹת כִּֽי עָזְב֤וּ בְרִֽיתְ/ךָ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל אֶת מִזְבְּחֹתֶ֣י/ךָ הָרָ֔סוּ וְ/אֶת נְבִיאֶ֖י/ךָ הָרְג֣וּ בֶ/חָ֑רֶב וָֽ/אִוָּתֵ֤ר אֲנִי֙ לְ/בַדִּ֔/י וַ/יְבַקְשׁ֥וּ אֶת נַפְשִׁ֖/י לְ/קַחְתָּֽ/הּ׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/010.yaml
  text: And he said[a], “I have been very zealous for Yahweh, the God of hosts, because the sons of Israel have forsaken your covenant, torn down your altars, and killed your prophets with the sword. I alone am left, and they seek my life[c][b], to take it.”
translation:
  language: zh_hans
  text: 他说：“我为耶和华——万军之上帝大发热心，因为以色列人背弃了你的约，拆毁了你的祭坛，用刀杀了你的先知；只剩下我一个人，他们正寻索我的性命，要夺去它。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קַנֹּא קִנֵּאתִי
  choice: 大发热心
  rationale: 不定式绝对形与限定动词连用，强化“热心”的程度。“大发热心”在现代汉语中自然地表达强烈、持续的护约热忱，同时避免“嫉妒”可能引起的误解。
- source_word: לַיהוָה
  choice: 为耶和华
  rationale: 介词 ל 表明热心所为的对象；神名 יהוה 音译为“耶和华”，在正文中保留其专名性质。
- source_word: אֱלֹהֵי צְבָאוֹת
  choice: 万军之上帝
  rationale: צְבָאוֹת 指众军、万军；采用庄重且通行的“万军之上帝”，不以“全能”替代原文不同的称号。
- source_word: כִּי
  choice: 因为
  rationale: 在此引出以利亚大发热心的理由；“因为”清楚、自然。
- source_word: עָזְבוּ בְרִיתְךָ
  choice: 背弃了你的约
  rationale: עָזַב 在立约语境中具有离弃、抛弃之意；“背弃”准确体现违约的严重性。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 字面为“以色列的众子”，此处整体指以色列百姓；“以色列人”是现代汉语中自然且准确的群体称谓。
- source_word: מִזְבְּחֹתֶיךָ הָרָסוּ
  choice: 拆毁了你的祭坛
  rationale: הָרַס 表示拆除、毁坏；“拆毁”既具体又符合祭坛作为建筑物的语境。
- source_word: נְבִיאֶיךָ הָרְגוּ בֶחָרֶב
  choice: 用刀杀了你的先知
  rationale: 保留工具短语 בֶחָרֶב 的具体性；汉语“用刀杀了”直接、自然。
- source_word: וָאִוָּתֵר אֲנִי לְבַדִּי
  choice: 只剩下我一个人
  rationale: 自然表达以利亚所强调的孤立处境，并保留 אֲנִי לְבַדִּי 的排他意味。
- source_word: וַיְבַקְשׁוּ אֶת נַפְשִׁי
  choice: 他们还要寻索我的性命
  rationale: נֶפֶשׁ 在此指生命；“寻索我的性命”保留希伯来语的表达方式，语义是企图杀害。
- source_word: לְקַחְתָּהּ
  choice: 把它夺去
  rationale: 阴性代词后缀回指“我的性命”；“把它夺去”保留回指结构，并明确表达夺命之意。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。正文采用现代简体中文圣经传统中最广为人知的专名“耶和华”，而不以“主”替代，保留这是专名的性质。
- issue: “热心”与“嫉妒”的语义张力
  choice: 大发热心
  alternative: 极其嫉妒
  rationale: קנא 可涉及嫉妒或热忱，但介词 לַיהוָה 和上下文表明以利亚是在陈述自己为耶和华及其约所发的强烈热心；译作“嫉妒”在现代汉语中容易被理解为私欲或羡妒。
- issue: 以利亚“只剩我一个”的陈述
  choice: 按他的原话直译，不作神学修正
  alternative: 只剩我一个忠于你的人
  rationale: 原文保留以利亚当下的自我判断，后文会对其认知作出回应；正文不提前解释或调和，以保存叙事张力。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。句式保留以利亚申诉的层层推进，并以分号划分他的孤独处境和生命威胁。神名使用“耶和华”；“万军之上帝”保留原文称号，不将其泛化为“全能的上帝”。
