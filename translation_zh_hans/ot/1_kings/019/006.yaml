  text: He looked[a], and behold, at his head was a cake baked on hot stones and a jar of water. He ate and drank and lay down again.
translation:
  language: zh_hans
  text: 他一看，只见头旁有一个在热石上烤成的饼[a]和一罐水。他吃了，喝了，又躺下。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“一个在炭火上烤的饼”。希伯来语“רְצָפִים”可能指烤饼所用的热石，也有译本较笼统地译作“炭火”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּבֵּט
  choice: 他一看
  rationale: נבט表示“看、注视”；“一看”自然地引出他随即发现的事物，又不添加原文没有的观看方向。
- source_word: וְהִנֵּה
  choice: 只见
  rationale: הִנֵּה用于唤起注意，使眼前景象鲜明呈现；“只见”符合现代汉语叙事习惯，也保留了原文的即时感。
- source_word: מְרַאֲשֹׁתָיו
  choice: 头旁
  rationale: 该词指躺卧者头部所在或近旁的位置；“头旁”简洁自然，符合本段场景。
- source_word: עֻגַת רְצָפִים
  choice: 一个在热石上烤成的饼
  rationale: עֻגָה指饼或圆饼；רְצָפִים很可能指用来烤饼的热石。正文表达较可能的烹制方式，同时以脚注保留“炭火”的传统理解。
- source_word: וְצַפַּחַת מָיִם
  choice: 和一罐水
  rationale: צַפַּחַת指罐、壶一类容器；“一罐水”是清楚自然且不过度限定器形的现代汉语。
- source_word: וַיֹּאכַל וַיֵּשְׁתְּ
  choice: 他吃了，喝了
  rationale: 按两个连续的叙事动词直译其先后动作，并以简洁短句保留希伯来文节奏。
- source_word: וַיָּשָׁב וַיִּשְׁכָּב
  choice: 又躺下
  rationale: שׁוּב与שׁכב连用表示重新躺下；“又躺下”自然传达重复动作，避免生硬译作“返回并躺下”。
