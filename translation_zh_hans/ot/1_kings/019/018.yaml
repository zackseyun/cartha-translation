  text: וְ/הִשְׁאַרְתִּ֥י בְ/יִשְׂרָאֵ֖ל שִׁבְעַ֣ת אֲלָפִ֑ים כָּל הַ/בִּרְכַּ֗יִם אֲשֶׁ֤ר לֹֽא כָֽרְעוּ֙ לַ/בַּ֔עַל וְ/כָ֨ל הַ/פֶּ֔ה אֲשֶׁ֥ר לֹֽא נָשַׁ֖ק לֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/018.yaml
  text: Yet I have left for myself seven thousand in Israel—all the knees that have not bowed to Baal[b][a], and every mouth that has not kissed him.
translation:
  language: zh_hans
  text: 但我会在以色列为自己留下七千人[a]：他们都没有向巴力屈膝，也没有用口亲吻他[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“但我已经在以色列为自己保留了七千人。”
    reason: 希伯来语动词形式可理解为已经成就并持续有效的保留，也可依上下文理解为将来的行动。
  - marker: b
    text: 亲吻偶像是表示尊崇或敬拜的举动。
    reason: 帮助现代读者理解这一古代宗教行为的文化含义。
lexical_decisions:
- source_word: וְהִשְׁאַרְתִּי
  choice: 但我会……为自己留下
  rationale: שׁאר的使役形表示“使留下、保留”。结合上文一连串面向将来的吩咐和结果，这里译为将来时较合语境；“为自己”表达这些人归于耶和华、为他而蒙保留。句首的“但”体现对以利亚所诉处境的转折回应。
- source_word: בְיִשְׂרָאֵל
  choice: 在以色列
  rationale: 按地点义直接翻译。
- source_word: שִׁבְעַת אֲלָפִים
  choice: 七千人
  rationale: 原文直译为“七千”，所指数目中的人；汉语补出“人”更自然清楚。
- source_word: כָּל הַבִּרְכַּיִם אֲשֶׁר לֹא כָרְעוּ לַבַּעַל
  choice: 他们的膝盖都未曾向巴力跪下
  rationale: 保留“膝盖”的身体意象，同时用汉语领属结构表明这些膝盖代表前述七千人。כּרע表示跪下或屈膝；介词ל指向敬拜所朝向的对象。
- source_word: הַבַּעַל
  choice: 巴力
  rationale: 虽有定冠词，但在现代汉语圣经语境中作为神名译作“巴力”最自然，不另译冠词。
- source_word: וְכָל הַפֶּה אֲשֶׁר לֹא נָשַׁק לוֹ
  choice: 口也都未曾亲吻他
  rationale: 保留“口”和“亲吻”的具体意象；“他”忠实反映原文代词，所指为巴力。这里的亲吻在语境中是向偶像表示尊崇的举动。
theological_decisions:
- issue: 保留之陈述的时态与余民含义
  choice: 我会在以色列为自己留下七千人
  alternative: 我已经在以色列为自己留下七千人
  rationale: 希伯来语完成式本身可从不同角度理解；在列王纪上19:15—18的将来事件序列中，将来译法更切合语篇。脚注保留完成或现时结果式的另一可能。正文不加入“余民”等后来的神学术语。
- issue: 向巴力屈膝和亲吻的宗教含义
  choice: 直译具体动作，并以脚注说明其敬拜含义
  alternative: 没有敬拜巴力
  rationale: 原文用两种身体动作描绘忠贞；直译可保存修辞力度，也避免把两个动作概括成抽象术语。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“他们的膝盖……口……”既保留原文身体部位的平行意象，也避免逐字译成“所有的膝盖、每一个口”所造成的生硬。
