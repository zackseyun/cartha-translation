  yaml_path: translation/ot/1_kings/019/003.yaml
  text: And he saw, and arose and went for his life, and came to Beersheba, which belongs to Judah, and left his servant there.
translation:
  language: zh_hans
  text: 以利亚看见了，就起身逃命，来到属于犹大的别是巴，把仆人留在那里。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּרְא
  choice: 看见这情形
  rationale: 马所拉文本作“他看见”，虽有古译本及部分校勘意见支持“他害怕”，但正文依WLC保留“看见”；补出“这情形”使现代汉语自然，同时不具体限定所见内容。
- source_word: וַיֵּלֶךְ אֶל־נַפְשׁוֹ
  choice: 逃命
  rationale: 字面为“为自己的性命而去”，语境中指为保全性命离开；“逃命”简洁自然，也保留紧迫感。
- source_word: בְּאֵר שֶׁבַע
  choice: 别是巴
  rationale: 采用现代中文圣经读者熟悉的传统地名译法。
- source_word: נַעֲרוֹ
  choice: 仆人
  rationale: נַעַר可指年轻人、侍从或仆役；此处带所属关系并承担随从角色，译作“仆人”最合语境。
theological_decisions:
- issue: וַיַּרְא的文本与释义
  choice: 依马所拉文本译作“看见这情形”
  alternative: 依据部分古译本或元音重构译作“害怕”
  rationale: 指定原文底本WLC明确为“看见”；不以推测性校勘取代正文，也不将以利亚的心理状态直接写入经文。
- issue: 以利亚离开的动机
  choice: 译作“逃命”
  alternative: 较字面地译作“为自己的性命而去”
  rationale: 表达行动旨在保全生命，不进一步裁断这是恐惧、审慎或不忠，避免加入神学评判。
translation_notes:
  register: 采用庄重而自然的现代标准汉语；保留希伯来叙事的动作顺序，但以“就”连接，避免逐词复制造成生硬。
