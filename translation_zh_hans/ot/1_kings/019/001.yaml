  text: וַ/יַּגֵּ֤ד אַחְאָב֙ לְ/אִיזֶ֔בֶל אֵ֛ת כָּל אֲשֶׁ֥ר עָשָׂ֖ה אֵלִיָּ֑הוּ וְ/אֵ֨ת כָּל אֲשֶׁ֥ר הָרַ֛ג אֶת כָּל הַ/נְּבִיאִ֖ים בֶּ/חָֽרֶב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/001.yaml
  text: Ahab told Jezebel all that Elijah had done, and how he had killed all the prophets with the sword.
translation:
  language: zh_hans
  text: 亚哈把以利亚所做的一切，以及他怎样用刀杀了所有先知的事，都告诉了耶洗别。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּגֵּד
  choice: 告诉了
  rationale: 准确表达叙事中的“告知、报告”，用语自然简明。
- source_word: וְאֵת כָּל אֲשֶׁר הָרַג
  choice: 以及他怎样……杀了……的事
  rationale: 原文结构较生硬，按上下文将אֲשֶׁר理解为说明事情经过的“怎样”，同时保留以利亚为动作者。
- source_word: בֶּחָרֶב
  choice: 用刀
  rationale: “刀”可自然表达古代用于击杀的利器；这里是方式状语，不必扩展为特定武器类型。
- source_word: כָּל הַנְּבִיאִים
  choice: 所有先知
  rationale: 保留原文的全称表达；其具体所指由前文语境限定，不在本节擅加“巴力的”。
theological_decisions:
- issue: “他”杀先知的指代
  choice: 保留“他”，按最近且合乎语境的先行词理解为以利亚
  alternative: 改成“以利亚”以完全消除歧义
  rationale: 原文使用第三人称动词而未重述姓名；中文保留代词，既忠于形式，也能由语境清楚识别。
- issue: “所有先知”的范围
  choice: 直译为“所有先知”
  alternative: 译为“所有巴力的先知”
  rationale: 虽据18章可知所指，但本节希伯来文本未明说“巴力的”，因此不把上下文补语写入正文。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“把……以及……的事，都告诉了……”符合普通话信息结构，也避免机械复制希伯来语宾语链。
