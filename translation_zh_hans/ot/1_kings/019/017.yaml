  text: וְ/הָיָ֗ה הַ/נִּמְלָ֛ט מֵ/חֶ֥רֶב חֲזָאֵ֖ל יָמִ֣ית יֵה֑וּא וְ/הַ/נִּמְלָ֛ט מֵ/חֶ֥רֶב יֵה֖וּא יָמִ֥ית אֱלִישָֽׁע׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/017.yaml
  text: And it shall be that whoever escapes from the sword of Hazael[a], Jehu shall put to death; and whoever escapes from the sword of Jehu, Elisha shall put to death.
translation:
  language: zh_hans
  text: 凡从哈薛刀下逃脱的，耶户必杀死；凡从耶户刀下逃脱的，以利沙必杀死[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“以利沙必杀。”希伯来文动词为使役式，意为“使……死亡”。在上下文中，以利沙可理解为直接施行这审判，或借着其先知性的宣告和事工使审判临到。
    reason: 说明使役动词的词汇特点，并保留以利沙施事方式在上下文中的解释空间，避免消解正文直接的语法表达。
lexical_decisions:
- source_word: וְהָיָה
  choice: （不单独译出）
  rationale: 这里的叙事—结果引介式与后续未完成式共同表达必然发生的情形。现代汉语用两个“凡……必……”结构即可自然体现，无须生硬直译为“事情将是”。
- source_word: הַנִּמְלָט
  choice: 凡……逃脱的
  rationale: 带定冠词的分词在此作泛指实体用法；“凡……的”准确表达“任何逃脱者”的概括意义。
- source_word: מֵחֶרֶב
  choice: 从……刀下
  rationale: 保留“刀剑”的具体意象，同时“从某人刀下逃脱”是自然的现代汉语，也能表达武力杀戮或审判。
- source_word: חֲזָאֵל
  choice: 哈薛
  rationale: 按现代中文圣经人名惯例音译。
- source_word: יָמִית
  choice: 必杀死
  rationale: 该词是מות的使役词干，直指使人死亡。“必杀死”在汉语中自然，并保留明确的致死施事关系及预告的确定性；此处两次出现均一致翻译。
- source_word: יֵהוּא
  choice: 耶户
  rationale: 按现代中文圣经人名惯例音译。
- source_word: אֱלִישָׁע
  choice: 以利沙
  rationale: 按现代中文圣经人名惯例音译。
theological_decisions:
- issue: 以利沙在“必杀死”中的施事角色
  choice: 正文保留以利沙为“杀死”之直接语法主语
  alternative: 理解为以利沙所宣告的审判，或由其先知事工促成的审判，并非他亲手杀人
  rationale: 希伯来文以完全平行的句法把哈薛、耶户和以利沙列作致死审判的施事者。若在正文中改成“以利沙必宣告审判”等，会替原文消解其张力；可能的间接施事理解留在脚注说明。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“凡……必……”形成整齐的平行结构；“刀下”保留原文意象，又符合普通读者的表达习惯。
