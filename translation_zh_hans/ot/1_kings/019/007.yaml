  text: וַ/יָּשָׁב֩ מַלְאַ֨ךְ יְהוָ֤ה שֵׁנִית֙ וַ/יִּגַּע בּ֔/וֹ וַ/יֹּ֖אמֶר ק֣וּם אֱכֹ֑ל כִּ֛י רַ֥ב מִמְּ/ךָ֖ הַ/דָּֽרֶךְ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/007.yaml
  text: Then the angel of Yahweh returned a second time and touched him and said[a], “Get up and eat, because the journey is too much for you.”
translation:
  language: zh_hans
  text: 雅威的天使[a]第二次回来，触碰了他，说：“起来吃吧，因为这段路程超过了你所能承受的。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“雅威的使者”。
    reason: 保留מַלְאָךְ可表示“天使”或一般“使者”的词义幅度。
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: 回来
  rationale: שׁוב在此叙事语境中表示返回；“回来”符合现代汉语叙事习惯。
- source_word: מַלְאַךְ יְהוָה
  choice: 雅威的天使
  rationale: מַלְאָךְ既可指一般的“使者”，也可指来自上帝的“天使”；本段描述神圣使者，正文采用自然且通行的“天使”，并以脚注保留词义上的另一种译法。יְהוָה按其专名译作“雅威”。
- source_word: שֵׁנִית
  choice: 第二次
  rationale: 明确保留原文所表达的次数，比笼统的“又”更具体。
- source_word: וַיִּגַּע בּוֹ
  choice: 碰了他一下
  rationale: נגע在这里指身体上的触碰；“碰了他一下”自然地传达一次触碰，也不额外重复“再次”。
- source_word: קוּם אֱכֹל
  choice: 起来吃吧
  rationale: 保留两个直接命令，同时用“吧”使现代汉语中的劝告语气自然，不削弱命令内容。
- source_word: כִּי
  choice: 因为
  rationale: 明确引出要求以利亚进食的原因。
- source_word: רַב מִמְּךָ הַדָּרֶךְ
  choice: 这段路程超过了你所能承受的
  rationale: 原文直陈路程相对于以利亚而言过重或过大，重点是超出其能力，而不只表示距离太长；此译法保留这种容量与负担意味。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；采用“雅威”作为较贴近יהוה常见学术复原读音的汉语音译，保留其专名性质。
- issue: מַלְאַךְ在本节的身份称谓
  choice: 天使
  alternative: 使者
  rationale: 上下文所指是来自雅威的超自然使者，正文译“天使”自然明确；但原词本身也可泛指“使者”，故以脚注保留该歧义，而不进一步界定其本体身份。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“碰了他一下”自然呈现动作；“超过了你所能承受的”避免把原文含义缩窄为单纯路途遥远。
