base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/020.yaml
  text: So he left the oxen and ran after Elijah and said[a], “Please let me kiss my father and my mother, and then I will go after you.” And he said to him, “Go back[b], for what have I done to you?”
translation:
  language: zh_hans
  text: 于是，以利沙撇下牛，跑着追赶以利亚，说[a]：“请让我亲一亲我的父亲和母亲，然后我就跟随你。”以利亚对他说：“回去吧[b]，因为我对你做了什么呢？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可较概括地译作：“请让我向我的父亲和母亲告别。”原文动词的字面意思是“亲吻”。
    reason: lexical_alternative
  - marker: b
    text: 以利亚这句话较难确定，也可理解为：“回去吧，因为我为你做了什么呢？”这也可能是一种省略的说法，把决定留给以利沙。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעֲזֹב
  choice: 撇下
  rationale: 此处指以利沙暂时离开正在耕作的牛；“撇下”自然地表达立即放下手头之事，又不先行断定这是永久抛弃。
- source_word: הַבָּקָר
  choice: 牛
  rationale: בקר可泛指牛群；上下文是套牛耕地，简明译作“牛”最符合现代汉语。
- source_word: וַיָּרָץ אַחֲרֵי
  choice: 跑去追上
  rationale: 保留“跑”的具体动作，并以“追上”自然表达朝以利亚赶去，而非表示敌意追逐。
- source_word: אֶשְּׁקָה נָּא
  choice: 请让我亲一亲
  rationale: נשק的字面动作是“亲吻”，נָא表达请求语气；正文保留具体的告别动作，不泛化为“辞别”。
- source_word: לְאָבִי וּלְאִמִּי
  choice: 我的父亲和母亲
  rationale: 原文分别提到父亲和母亲，因此不压缩为“父母”。
- source_word: וְאֵלְכָה אַחֲרֶיךָ
  choice: 然后我就跟随你
  rationale: הלך אחרי在此既有走在某人之后的字面意义，也可暗示开始随从、服事；“跟随你”在现代汉语中自然并保留两层可能。
- source_word: לֵךְ שׁוּב
  choice: 回去吧
  rationale: 两个连续命令式字面为“去，回去”；汉语若逐字重复会显得生硬，“回去吧”自然表达其简短命令，同时“吧”与语境中的许可可能相容。
- source_word: כִּי מֶה עָשִׂיתִי לָךְ
  choice: 因为我对你做了什么呢？
  rationale: 按原文保留“对你做了什么”的疑问形式，不在正文中判定这是许可、责备还是提醒。
theological_decisions:
- issue: 以利亚回答כִּי מֶה עָשִׂיתִי לָךְ的含义
  choice: 正文直译为“因为我对你做了什么呢？”，保留疑问和语义张力。
  alternative: 也可能理解为“回去吧，我对你做了什么呢？”、“回去吧，因为你要想想我对你所做的”，或一种把决定留给以利沙的省略说法。
  rationale: 原句可被理解为许可、反问、提醒或不加勉强的表态。若在正文中明确其中一种，会消除原文真实存在的含混。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。“亲一亲”保留希伯来文的具体动作；“跟随”兼顾实际行动与随从关系；以脚注说明以利亚回答中的真实歧义。所有脚注标记均已置于正文相应位置。
