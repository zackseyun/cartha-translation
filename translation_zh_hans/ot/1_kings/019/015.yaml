base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/015.yaml
  text: And Yahweh said to him[a], “Go, return by your way to the wilderness of Damascus; and when you arrive[b], you shall anoint Hazael as king over Aram.”
translation:
  language: zh_hans
  text: 雅威对他说：“去吧，你回去，走往大马士革旷野的路[a]。你到了那里，就要膏哈薛作亚兰[b]的王。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“朝大马士革的旷野去。”希伯来文“旷野”一词带有表示方向的词尾。
    reason: lexical_alternative
  - marker: b
    text: “亚兰”是希伯来文地名，常被译作“叙利亚”。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文直接音译上帝的专名，而不以“主”这一称号代替；“雅威”也对应 Yahweh 的现代汉语音译。
- source_word: לֵךְ שׁוּב
  choice: 去吧，沿原路返回
  rationale: 保留两个相连命令的推进感；“沿原路返回”以自然汉语表达“回到／循着你的路返回”。
- source_word: לְדַרְכְּךָ
  choice: 沿原路
  rationale: 结合“返回”的语境，表达循着先前路线回去的意思，避免生硬直译为“回到你的路”。
- source_word: מִדְבָּרָה דַמָּשֶׂק
  choice: 往大马士革的旷野去
  rationale: 名词所带的方向词尾表示朝向该地移动；译文明确呈现“往……去”，同时在脚注保留“朝……”这一较弱方向表达的可能。
- source_word: וּבָאתָ
  choice: 你到了那里
  rationale: 该形式承接命令次序，在此自然表示抵达目的地之后；补出“那里”使现代汉语指向清楚。
- source_word: וּמָשַׁחְתָּ
  choice: 就要膏
  rationale: 承接前面的命令，表达抵达后应执行的委任行动；“膏”保留以膏立王的圣经文化意象。
- source_word: חֲזָאֵל
  choice: 哈薛
  rationale: 采用现代中文圣经中通行且简明的人名音译。
- source_word: לְמֶלֶךְ עַל אֲרָם
  choice: 作亚兰的王
  rationale: 自然表达任命哈薛统治亚兰；“亚兰”直接对应希伯来专名 אֲרָם，而不以较后期的地名“叙利亚”代替。
theological_decisions:
- issue: 如何译出神名 יְהוָה
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文使用四字神名而非称号；“雅威”直接对应其较通行的学术重构读音，既保留专名性质，也不以“主”消解原文用词。
- issue: “膏哈薛作王”的命令语气
  choice: 就要膏哈薛作亚兰的王
  alternative: 就膏哈薛作亚兰王；必须膏哈薛作亚兰王
  rationale: 保留命令链条中的郑重委任语气，但不额外强化为“必须”，也不解释以利亚后来如何执行这一命令。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。命令句简洁有力；保留“膏”这一关键文化与神学用语，并将两个词汇性说明放在其实际对应位置。
