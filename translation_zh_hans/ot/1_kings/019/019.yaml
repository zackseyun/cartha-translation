base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/019.yaml
  text: So he went from there and found Elisha son of Shaphat[a], and he was plowing with twelve yoke-pairs before him, and he was with the twelfth[b]. Elijah passed by him and threw his cloak over him.
translation:
  language: zh_hans
  text: 于是，以利亚从那里离开，遇见了沙法的儿子以利沙。以利沙正在耕地，有十二对牲畜在他前面；他自己在第十二对那里[a]。以利亚从他身旁经过，把自己的外袍扔在他身上[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “十二对”也可译作“十二组套轭的牲畜”；希伯来语指用于耕地的十二组成对役畜。原文接着说以利沙“在第十二对那里”或“与第十二对同在”，没有明说他如何驱赶这一对。
    reason: 说明צְמָדִים的农业含义，并保留以利沙与第十二对役畜之关系的原文省略性。
  - marker: b
    text: “外袍”传统上也译作“外衣”或“斗篷”。在上下文中，这件衣物与以利亚的先知身份有关。
    reason: 保留אַדֶּרֶת的传统译法及其上下文意涵，但不把象征意义写入正文。
lexical_decisions:
- source_word: וַיֵּלֶךְ מִשָּׁם
  choice: 于是，以利亚从那里离开
  rationale: 连续式推动叙事，用“于是”自然衔接上文；希伯来文主语承接上文，中文补出“以利亚”以避免歧义，并保留“从那里”的空间指向。
- source_word: וַיִּמְצָא אֶת אֱלִישָׁע בֶּן שָׁפָט
  choice: 遇见了沙法的儿子以利沙
  rationale: מָצָא基本义为“找到、遇见”；此处“遇见”符合叙事情境，也不暗示此前曾刻意搜寻。人名按现代中文圣经通行形式音译。
- source_word: וְהוּא חֹרֵשׁ
  choice: 以利沙正在耕地
  rationale: 分词表达正在持续的动作；“正在耕地”是自然、清楚的现代汉语。
- source_word: שְׁנֵים עָשָׂר צְמָדִים
  choice: 十二对牲畜
  rationale: צֶמֶד可指成对套轭的役畜或一组轭；农业语境表明是用于耕地的成对牲畜，但具体牲畜种类未明说，因此不直接译作“牛”。
- source_word: לְפָנָיו וְהוּא בִּשְׁנֵים הֶעָשָׂר
  choice: 在他前面，他自己跟着第十二对
  rationale: 保留各组位于以利沙前方、他与第十二组同在的位置关系。“跟着”使中文通顺，同时没有把隐含的赶牲畜动作过度明说。
- source_word: וַיַּעֲבֹר אֵלִיָּהוּ אֵלָיו
  choice: 以利亚从他身旁经过
  rationale: עָבַר与אֶל在这里描写以利亚来到并经过以利沙身旁；此译法自然呈现随后的象征性动作。
- source_word: וַיַּשְׁלֵךְ אַדַּרְתּוֹ אֵלָיו
  choice: 把自己的外袍扔在他身上
  rationale: שׁלך明确表达投、扔的动作；אַדֶּרֶת在此指以利亚特有的外衣。“外袍”兼顾现代可懂度和衣物的庄重感，不在正文中把动作解释为任命。
theological_decisions:
- issue: 以利亚外袍这一动作的象征意义
  choice: 正文只叙述以利亚把外袍扔在以利沙身上
  alternative: 直接释义为“立他作先知”或“指定他为继承人”
  rationale: 本节希伯来文只记载象征性动作，并未在句中解释其含义；把任命或继承直接写进正文，会消除叙事刻意保留的含蓄，应让上下文呈现其意义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。正文保留希伯来文简洁的动作顺序，并适度补出承接上文的主语以符合汉语表达；不使用较古雅的“衣钵”等带有后世成语色彩的词。
