base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/045.yaml
  text: And in a little while[a], the sky grew black with clouds and wind, and there was a heavy rain[c][b]. Then Ahab mounted his chariot and went to Jezreel.
translation:
  language: zh_hans
  text: 过了不多时[a]，天空因云和风变得昏暗[b]，随后下起了大雨[c]。亚哈便登上战车，往耶斯列去了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文是一个希伯来语习语，直译近似“直到这样，又直到这样”，意思是“其间”或“过了不多时”。
    reason: lexical_alternative
  - marker: b
    text: 也可译为“天空被云和风弄得昏暗”。
    reason: lexical_alternative
  - marker: c
    text: 直译为“有了大雨”或“有一场大雨”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי עַד כֹּה וְעַד כֹּה
  choice: 过了不多时
  rationale: 希伯来语习语直译近似“直到这样，又直到这样”，在此表示一段很短的时间过去；译作“过了不多时”自然地传达其时间意义。
- source_word: הַשָּׁמַיִם הִתְקַדְּרוּ עָבִים וְרוּחַ
  choice: 天空被乌云遮暗，风也刮了起来
  rationale: הַשָּׁמַיִם 在天气语境中指可见的天空；הִתְקַדְּרוּ 表示变暗或阴沉。原文紧凑地以“云和风”伴随或促成天空变暗，汉语采用自然的分句表达，不把风生硬地说成天色变暗的直接原因。
- source_word: וַיְהִי גֶּשֶׁם גָּדוֹל
  choice: 随后下起了大雨
  rationale: 字面为“有了大雨”；现代汉语以“下起了大雨”表达强降雨，既自然又不过度强化为原文未明说的“倾盆”。
- source_word: וַיִּרְכַּב אַחְאָב
  choice: 亚哈便登上战车
  rationale: רכב 可指骑乘或登乘；原文宾语省略，但叙事上下文明确涉及王的战车，因此在汉语中补出“战车”以免被误解为骑马。
- source_word: יִזְרְעֶאלָה
  choice: 往耶斯列去了
  rationale: 词尾方向性־ה表示朝向耶斯列，汉语自然译为“往耶斯列去了”。
