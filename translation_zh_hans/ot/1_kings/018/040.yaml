base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/040.yaml
  text: Then Elijah said to them[a], “Seize the prophets of Baal; let not one of them escape.” And they seized them[b], and Elijah brought them down to the Kishon Wadi and slaughtered them there.
translation:
  language: zh_hans
  text: 以利亚对他们说：“抓住巴力的先知，一个也不许逃脱！”他们就抓住了那些先知。以利亚把他们带下去，到基顺溪谷[a]，在那里宰杀了他们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “溪谷”也可译作“溪流”。希伯来语 נַחַל 可指溪谷、河床或溪流。
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּפְשׂוּ
  choice: 抓住
  rationale: 该词是复数命令式，要求众人强行擒住对方；“抓住”简明有力，也适合现代汉语叙事。
- source_word: נְבִיאֵי הַבַּעַל
  choice: 巴力的先知
  rationale: 直接体现希伯来语的属格结构，清楚标明这些先知所事奉的对象。
- source_word: אִישׁ אַל יִמָּלֵט מֵהֶם
  choice: 一个也不许逃脱
  rationale: אִישׁ在这里作逐一分配用法，意思是不容其中任何一人逃走；此译比逐字译作“不许一个男人逃脱”更自然，也准确保留其强调。
- source_word: וַיִּתְפְּשׂוּם
  choice: 众人就抓住了他们
  rationale: 与前面的命令使用同一动词，中文也重复“抓住”，保持词汇呼应。
- source_word: וַיּוֹרִדֵם
  choice: 把他们带下到
  rationale: 保留ירד使役形所表达的向下移动，不额外说明押送方式。
- source_word: נַחַל קִישׁוֹן
  choice: 基顺溪谷
  rationale: נַחַל可指有水或季节性干涸的溪谷、河床或溪流；“溪谷”兼顾地形含义，并在脚注中保留词义范围。
- source_word: וַיִּשְׁחָטֵם
  choice: 宰杀了他们
  rationale: שׁחט是表示宰杀的强烈动词；“宰杀”保留原文刺耳而残酷的力度，不弱化为泛指的“杀死”或带司法解释的“处决”。
- source_word: שָׁם
  choice: 在那里
  rationale: 直接传达地点副词，并自然衔接前述地点。
theological_decisions:
- issue: 如何表述对巴力先知的暴力行动
  choice: 直译为以利亚在那里“宰杀了他们”
  alternative: 译作较缓和或带解释色彩的“处决了他们”“把他们治死”
  rationale: 本节直接叙述抓捕和宰杀；译文既不应淡化暴力，也不应加入本节没有明说的神圣授权或司法定性。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“一个也不许逃脱”体现原文逐一排除的强调；“宰杀”有意保留原文对暴力行为的鲜明表述。
