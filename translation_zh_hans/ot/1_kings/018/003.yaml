base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/003.yaml
  text: And Ahab called Obadiah[a], who was over the household. Now Obadiah feared Yahweh greatly.
translation:
  language: zh_hans
  text: 亚哈召来负责王室事务的俄巴底[a]。俄巴底十分敬畏雅威。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“在王室之家之上”，指主管王室家政、宫廷事务或产业的高级官员。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא אַחְאָב אֶל עֹבַדְיָהוּ
  choice: 亚哈召来俄巴底
  rationale: קרא + אל 表示亚哈叫俄巴底前来；“召来”在王室语境中自然体现命令关系，又不刻意强化为正式传召。
- source_word: עֹבַדְיָהוּ
  choice: 俄巴底
  rationale: 采用现代中文圣经读者熟悉的人名译法。
- source_word: אֲשֶׁר עַל הַבָּיִת
  choice: 管理王宫的
  rationale: 字面为“在这家之上的”，在王室语境中指主管王家或宫廷事务的高级官员；正文采用自然简明的职务表达，脚注保留较宽的语义范围。
- source_word: הָיָה יָרֵא אֶת יְהוָה
  choice: 敬畏雅威
  rationale: ירא 与神连用时兼有畏惧与尊崇之意；“敬畏”保留其宗教和伦理分量。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以音译呈现四字神名，保留原文使用的专名，而不以称号替代。
- source_word: מְאֹד
  choice: 十分
  rationale: 自然表达副词的强烈程度，同时避免古奥措辞。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华／上主
  rationale: 原文直接使用以色列神的四字专名；音译“雅威”较直接地保留专名性质，不以传统音译或称号取代。
- issue: ירא 对雅威所表达的态度
  choice: 敬畏
  alternative: 惧怕／尊崇
  rationale: 此词在神学语境中同时包含畏惧和虔敬；“敬畏”不把含义单方面缩减为恐惧或尊敬。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“召来”符合君王命属下前来的场景；第二句重复“俄巴底”，保留原文转入人物背景说明的结构。
