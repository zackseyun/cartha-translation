  - severity: low
    issue: 脚注的“在这家之上的”不是原文的准确直译。
    rationale: הַבָּיִת 是带定冠词的“那／这家、该家”，但中文直译不应无据确定为“这家”；且此处须说明其为王室语境的惯用官职表达。
  revised_text: 亚哈召来负责王室事务的俄巴底[a]。俄巴底十分敬畏雅威。
  revised_footnotes:
