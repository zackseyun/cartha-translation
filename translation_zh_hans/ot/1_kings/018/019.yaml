source:
  edition: WLC
  text: וְ/עַתָּ֗ה שְׁלַ֨ח קְבֹ֥ץ אֵלַ֛/י אֶת כָּל יִשְׂרָאֵ֖ל אֶל הַ֣ר הַ/כַּרְמֶ֑ל וְ/אֶת נְבִיאֵ֨י הַ/בַּ֜עַל אַרְבַּ֧ע מֵא֣וֹת וַ/חֲמִשִּׁ֗ים וּ/נְבִיאֵ֤י הָֽ/אֲשֵׁרָה֙ אַרְבַּ֣ע מֵא֔וֹת אֹכְלֵ֖י שֻׁלְחַ֥ן אִיזָֽבֶל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/019.yaml
  text: Now send and gather to me all Israel at Mount Carmel[a], along with the prophets of Baal, four hundred and fifty, and the prophets of Asherah, four hundred[c][b], who eat at Jezebel’s table.
translation:
  language: zh_hans
  text: 现在你要派人，把以色列众人召集到迦密山[a]、到我这里；也把巴力的四百五十名先知和亚舍拉的四百名先知[c]召来，他们是在耶洗别的桌前吃饭的人[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“往迦密山”；希伯来语介词表示朝向集会地点的移动。
    reason: lexical_alternative
  - marker: b
    text: “在耶洗别的桌前吃饭”表示这些先知由她供养，受她的王室庇护。
    reason: cultural_note
  - marker: c
    text: “亚舍拉”可以指女神亚舍拉；在某些语境中，也可指与她有关的祭祀物。这里与“巴力”平行，较可能指女神。
    reason: cultural_note
lexical_decisions:
- source_word: וְעַתָּה
  choice: 现在
  rationale: 作为话语标记，引出以利亚要求亚哈立即执行的命令；现代汉语用“现在”自然简洁。
- source_word: שְׁלַח קְבֹץ אֵלַי
  choice: 你要派人去，把……召集到我这里
  rationale: 两个祈使形式合起来表达“派人召集”的行动及结果；译文保留“到我这里”的方向含义，同时符合现代汉语表达。
- source_word: כָּל יִשְׂרָאֵל
  choice: 以色列众人
  rationale: 保留全国性、集合性的称谓及其修辞广度，且比逐字译作“全以色列”更符合现代汉语。
- source_word: אֶל הַר הַכַּרְמֶל
  choice: 聚集在迦密山
  rationale: 介词本义指向目的地；汉语在“召集”语境中以“聚集在”自然表达最终集会地点，脚注保留“到”的可能译法。
- source_word: נְבִיאֵי הַבַּעַל
  choice: 巴力的四百五十名先知
  rationale: 明确这些先知与巴力的从属或事奉关系，并依汉语习惯把数目置于量词短语中。
- source_word: נְבִיאֵי הָאֲשֵׁרָה
  choice: 亚舍拉的四百名先知
  rationale: 与“巴力的先知”平行，正文将亚舍拉按神祇名称处理；脚注说明其在其他语境也可指相关祭祀物。
- source_word: אֹכְלֵי שֻׁלְחַן אִיזָבֶל
  choice: 那些在耶洗别席上吃饭的人
  rationale: 保留希伯来语具体的席桌意象；这也暗示他们受耶洗别供养，但不把该推论直接写进正文。
theological_decisions:
- issue: 本节אֲשֵׁרָה所指为何
  choice: 正文音译为神祇名“亚舍拉”
  alternative: 译为与亚舍拉有关的祭祀木柱等崇拜物
  rationale: 该词与“巴力”形成平行，并且有自己的“先知”，因此这里较可能指神祇；音译既顺应语境，也避免在正文中把仍有讨论的所指解释得过死。
- issue: “以色列众人”的范围
  choice: 保留集合性的全国称谓
  alternative: 解释为每一个以色列人，或明确改成以色列各方代表
  rationale: 原文具有修辞上的整体性，却没有说明是否指每个个体实际到场；译文不替原文限定范围。
- issue: “在耶洗别席上吃饭”的含义
  choice: 正文保留席上吃饭的意象
  alternative: 直接意译为“受耶洗别供养”
  rationale: 王室供养很可能是该表达的实际含义，但具体意象本身具有叙事和文化价值，因此正文保留，脚注予以说明。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“你要派人去”清楚表达对亚哈的命令；“席上吃饭”略带经典文体色彩，但普通读者仍能理解，并保留原文形象。所有脚注标记均置于对应正文内容之后。
