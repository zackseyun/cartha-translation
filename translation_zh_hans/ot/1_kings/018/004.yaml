  text: וַ/יְהִי֙ בְּ/הַכְרִ֣ית אִיזֶ֔בֶל אֵ֖ת נְבִיאֵ֣י יְהוָ֑ה וַ/יִּקַּ֨ח עֹבַדְיָ֜הוּ מֵאָ֣ה נְבִאִ֗ים וַֽ/יַּחְבִּיאֵ֞/ם חֲמִשִּׁ֥ים אִישׁ֙ בַּ/מְּעָרָ֔ה וְ/כִלְכְּלָ֖/ם לֶ֥חֶם וָ/מָֽיִם׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/004.yaml
  text: When Jezebel was cutting off the prophets of Yahweh[a], Obadiah took a hundred prophets and hid them, fifty men to a cave[b], and provided them with bread and water.
translation:
  language: zh_hans
  text: 当耶洗别杀害雅威的先知时[a]，俄巴底带走一百名先知，把他们每五十人藏在一个洞里[b]，并供给他们饼和水。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “杀害”也可译作“剪除”或“消灭”；原文的字面意思是“砍断、除掉”。
    reason: lexical_alternative
  - marker: b
    text: 原文直译近于“五十人在一个洞里”。结合一百人的总数，这句话很可能是说他们分成两组，每组五十人，分别藏在洞里。
    reason: textual_ambiguity
lexical_decisions:
- source_word: וַיְהִי בְּהַכְרִית
  choice: ……时
  rationale: וַיְהִי与介词בְּ加不定式构成时间背景；汉语用“……时”自然表达，不另添原文没有的“现在”。
- source_word: הַכְרִית
  choice: 剪除
  rationale: כרת的使役式字面意为“剪除、除掉”，在本语境中指杀害或消灭；“剪除”既保留原文意象，也能表达有意清除先知的行动。
- source_word: אִיזֶבֶל
  choice: 耶洗别
  rationale: 采用现代中文圣经读者熟悉的人名译法。
- source_word: נְבִיאֵי יְהוָה
  choice: 雅威的先知
  rationale: 忠实表达领属结构，并将四字神名作为专名译为“雅威”。
- source_word: וַיִּקַּח
  choice: 把……藏了起来
  rationale: לקח本义为“取、带走”；此处与随后“藏起来”的动作紧密相连。中文不机械重复“带走”，而以处置式结构自然涵盖俄巴底接管并藏匿他们的行动。
- source_word: עֹבַדְיָהוּ
  choice: 俄巴底
  rationale: 采用现代中文圣经读者熟悉的人名译法。
- source_word: מֵאָה נְבִאִים
  choice: 一百名先知
  rationale: 直接保留人数；量词“名”符合现代汉语。
- source_word: וַיַּחְבִּיאֵם
  choice: 把……藏了起来
  rationale: חבא使役式表示使人隐藏，即“藏匿”；“藏了起来”自然、清楚。
- source_word: חֲמִשִּׁים אִישׁ בַּמְּעָרָה
  choice: 每五十人藏在一个洞里
  rationale: 原文形式近于“五十人在那洞里”，结合总数一百，最可能表示分成两组，每组五十人，分别藏在洞中；正文采用自然的分配式表达，脚注保留原文单数形式及其歧义。
- source_word: וְכִלְכְּלָם
  choice: 并供给他们
  rationale: כלכל的强化词干表示维持、供养或供应；下接饼和水，因此“供给”准确而自然。
- source_word: לֶחֶם וָמָיִם
  choice: 饼和水
  rationale: 保留具体食物名称；“饼”比泛化为“食物”更贴近לֶחֶם。
theological_decisions:
- issue: 四字神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用以色列上帝的专名。译作“雅威”可在中文中以专名形式体现该名字，不以称号替代，也不引入额外的宗派解释。
- issue: 耶洗别对先知所做之事的力度
  choice: 剪除
  alternative: 杀害；消灭
  rationale: 原词保留“砍断、剪除”的意象，但语境明确指暴力清除，甚至杀害。正文保留意象，脚注说明实际语义，以免弱化事件。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“原来”表明本节是在交代前文所提俄巴底的背景，而不是翻译一个独立的“现在”。句式清晰，避免古奥用语；“剪除”保留原文意象，并借脚注帮助普通读者理解其暴力含义。
