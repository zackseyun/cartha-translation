  yaml_path: translation/ot/1_kings/018/020.yaml
  text: So Ahab sent to all the sons of Israel and gathered the prophets to Mount Carmel[a].
translation:
  language: zh_hans
  text: 于是，亚哈派人到所有以色列人[a]那里去，把众先知聚集到迦密山。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“以色列的众子”；此处指所有以色列人。
    reason: 说明בְּנֵי יִשְׂרָאֵל的字面亲属称谓及其在本句中的语境所指。
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: 派人到
  rationale: שׁלח 的基本义是“派遣、差遣”。这里没有明说所传的信息或召集的动作，因此译作“派人到”既符合现代汉语，也避免把隐含内容写进正文。
- source_word: בְּכָל בְּנֵי יִשְׂרָאֵל
  choice: 到以色列众人那里
  rationale: 介词 בְּ 在 שׁלח 之后可表示行动所指向或遍及的对象；בְּנֵי יִשְׂרָאֵל 字面为“以色列的众子”，在现代汉语中通常自然地表达为“以色列众人”。字面形式收入脚注。
- source_word: וַיִּקְבֹּץ
  choice: 聚集
  rationale: קבץ 表示把人召集、聚拢到一处；“聚集”直接对应原文，并保留亚哈为动作主体。
- source_word: הַנְּבִיאִים
  choice: 众先知
  rationale: נְבִיאִים 是“先知”的复数；“众先知”简洁地表达定指复数。
- source_word: אֶל הַר הַכַּרְמֶל
  choice: 到迦密山
  rationale: הַר 加地名在汉语中自然译为“某某山”；“迦密山”是准确、通行的地名表达。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“于是”承接上文；用“并”连接两个连续动作。正文避免补入原文未明说的“传信”或“召集”等内容。
