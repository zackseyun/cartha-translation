base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/005.yaml
  text: And Ahab said to Obadiah[a], “Go through the land to all the springs of water and to all the wadis. Perhaps we may find grass and keep horse and mule alive[b], so that we do not have to cut off some of the livestock.”
translation:
  language: zh_hans
  text: 亚哈对俄巴底亚说：“你要走遍全境，到各处水泉和各条溪谷[a]去。也许我们能找到草，好让马和骡子活下去，免得我们要从牲畜中除掉一部分[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“溪流”。希伯来语这个词可指溪流、季节性水道，或水道所在的谷床；在旱灾的背景下，“溪谷”较能涵盖这里的地貌含义。
    reason: lexical_alternative
  - marker: b
    text: 直译“从牲畜中割除”。这大概是指因草料不足而不得不减少牲畜的数量，但原文没有说明具体怎样处置。
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּאָרֶץ
  choice: 走遍全国
  rationale: 介词 בּ 与“去”连用，在搜寻的语境中表示走过一片区域；“走遍全国”自然地表达全面搜寻。
- source_word: מַעְיְנֵי הַמַּיִם
  choice: 各处水泉
  rationale: 保留天然水源的具体含义；“水泉”在庄重的现代汉语中简明易懂。
- source_word: הַנְּחָלִים
  choice: 溪谷
  rationale: נחל 可指溪流，也可指季节性水道或其谷床；旱灾背景下，“溪谷”既贴合地貌，也不暗示其中必定有常流水。
- source_word: אוּלַי נִמְצָא
  choice: 也许我们能找到
  rationale: 保留 אוּלַי 的不确定性，并自然表达第一人称复数的共同打算。
- source_word: חָצִיר
  choice: 草
  rationale: 此处指可供牲畜食用的植物；“草”自然准确，不额外加入已经割下或晒干的含义。
- source_word: וּנְחַיֶּה
  choice: 好让……活下去
  rationale: 使役形式表达使其存活或保全其生命；该译法符合现代汉语的目的表达。
- source_word: סוּס וָפֶרֶד
  choice: 马和骡子
  rationale: 希伯来语单数在此可作集合用法；汉语类称无需显式复数。
- source_word: וְלֹא נַכְרִית מֵהַבְּהֵמָה
  choice: 免得我们不得不除掉一部分牲畜
  rationale: כרת 的基本意象是“割除、除掉”，而 מן 在此自然具有部分义；译文保留减少牲畜数量的含义，同时避免武断说明具体处置方式。
