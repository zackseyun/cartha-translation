base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/031.yaml
  text: And Elijah took twelve stones[a], according to the number of the tribes of the sons of Jacob, to whom the word of Yahweh had come, saying[b], “Israel shall be your name.”
translation:
  language: zh_hans
  text: 以利亚取了十二块石头，照着雅各众子各支派的数目；雅威的话曾临到雅各，说[a]：“你的名字要叫以色列。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里回顾雅威给雅各改名的事，见《创世记》32:28；35:10：“你的名字要叫以色列。”
    reason: cross_reference
lexical_decisions:
- source_word: וַיִּקַּח
  choice: 取了
  rationale: 这是叙事中常见的连续式动词；“取了”准确自然，也符合以利亚取石筑坛的语境。
- source_word: שְׁתֵּים עֶשְׂרֵה אֲבָנִים
  choice: 十二块石头
  rationale: 直接表达原文的数词和名词，并按现代汉语习惯加入量词“块”。
- source_word: כְּמִסְפַּר שִׁבְטֵי בְנֵי יַעֲקֹב
  choice: 数目与雅各众子的支派相同
  rationale: 保留כְמִסְפַּר的对应、相称含义，也忠实呈现“雅各众子”和“支派”之间的关系，避免生硬的逐词排列。
- source_word: בְנֵי יַעֲקֹב
  choice: 雅各众子
  rationale: 较直接地保留希伯来文“雅各的儿子们”这一男性亲属表达；脚注说明可按群体意义理解为“雅各的子孙”。
- source_word: אֲשֶׁר הָיָה דְבַר יְהוָה אֵלָיו
  choice: 雅威的话曾临到雅各
  rationale: 关系从句所指最自然是雅各；在中文中重复“雅各”可避免把“他”误解为以利亚。“曾”表明这是先前发生的神谕事件。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以“雅威”音译四字神名，保留原文所用的专名。
- source_word: לֵאמֹר
  choice: 说
  rationale: 自然引出后面的直接引语。
- source_word: יִשְׂרָאֵל יִהְיֶה שְׁמֶךָ
  choice: 你的名字要叫以色列
  rationale: 自然、庄重地表达命名宣告；虽未照搬希伯来语词序，仍保留将雅各改名为以色列的重点。
theological_decisions:
- issue: 四字神名יהוה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”较贴近通常重构的读音，并明确保留这是神的专名。
- issue: 关系从句所指对象
  choice: 明确译为雅各
  alternative: 译作“雅威的话曾临到他”
  rationale: 原文关系从句紧接“雅各”，并以改名宣告确认所指是雅各。中文若只用“他”容易误指以利亚，因此明确人名而不改变原意。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“数目与……相同”使原文的对应关系在汉语中清楚自然；“雅威的话曾临到”保留圣经神谕表达的庄重感。
