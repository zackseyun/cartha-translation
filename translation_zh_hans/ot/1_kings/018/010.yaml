  source_fidelity: 译文总体准确传达了俄巴底以耶和华之名起誓、亚哈广泛搜寻以利亚，以及要求受搜寻的政治实体宣誓未找到他的内容。可是“若”将原文叙述中的搜寻结果处理成条件句，且“证明”在誓言内容之外增添了证据／论证意味；宜改为直接叙述与引述誓言内容。
  naturalness: “没有一个国家或王国，我主没有派人到那里去找你”及“他们说……我主就叫……”较符合现代汉语，也更清楚呈现“那里”和连续动作。“我指着永活的耶和华——你的上帝——起誓”庄重自然。
  terminology: “耶和华”恰当保留神名，并与指亚哈的“我主”区别。“国家或王国”可保留原文的并列政治用语。“我主”符合臣下对君王的敬称。
