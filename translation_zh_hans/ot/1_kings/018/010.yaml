revisions:
- from: 俄巴底指着永活的耶和华——你的上帝——起誓说：“没有一个国家或王国，是我主没有派人去寻找你的。他们若说：‘他不在这里’，我主就让那个王国和国家起誓，证明他们找不到你。”
  to: 我指着永活的耶和华——你的上帝——起誓：没有一个国家或王国，我主没有派人到那里去找你。他们说：‘他不在那里。’我主就叫那王国和那国家起誓，说他们没有找到你。
  rationale: 修订保留誓言公式、神名、政治实体的并列和“我主”的宫廷敬称；将条件式“若”改为实际搜寻后的答复，并删去“证明”所附加的推论意味。以“他们没有找到你”直接表达誓言所确认的过去搜寻结果，既通顺，也不将希伯来语未完成式过度限定为抽象的能力判断。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T05:51:02Z'
