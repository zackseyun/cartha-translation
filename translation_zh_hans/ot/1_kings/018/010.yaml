  text: חַ֣י יְהוָ֣ה אֱלֹהֶ֗י/ךָ אִם יֶשׁ גּ֤וֹי וּ/מַמְלָכָה֙ אֲ֠שֶׁר לֹֽא שָׁלַ֨ח אֲדֹנִ֥/י שָׁם֙ לְ/בַקֶּשְׁ/ךָ֔ וְ/אָמְר֖וּ אָ֑יִן וְ/הִשְׁבִּ֤יעַ אֶת הַ/מַּמְלָכָה֙ וְ/אֶת הַ/גּ֔וֹי כִּ֖י לֹ֥א יִמְצָאֶֽ/כָּה׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/010.yaml
  text: As Yahweh your God lives, there is no nation or kingdom where my lord has not sent to seek you. When they said, ‘He is not here,’ he made the kingdom and the nation swear that they could not find you.
translation:
  language: zh_hans
  text: 我指着永活的耶和华——你的上帝——起誓：没有一个国家或王国，我主没有派人到那里去找你。他们说：‘他不在那里。’我主就叫那王国和那国家起誓，说他们没有找到你。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חַי יְהוָה אֱלֹהֶיךָ
  choice: 指着永活的耶和华——你的上帝——起誓
  rationale: 这是希伯来语庄严的起誓格式，字面以耶和华的生命为凭。汉语明确补出“起誓”，自然传达其语用力量；“永活的”表达神确实活着，并避免误读为一般陈述。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的神名音译，而不以“主”这一称号替代；也与本节指亚哈的“我主”清楚区分。
- source_word: אִם יֶשׁ גּוֹי וּמַמְלָכָה אֲשֶׁר לֹא
  choice: 没有一个国家或王国，是……没有……的
  rationale: אִם 位于誓言结构中，具有省略式的强烈否定含义，并非表示真实的不确定条件。此译法保留俄巴底断言亚哈搜寻范围极广的语气。
- source_word: גּוֹי וּמַמְלָכָה
  choice: 国家或王国
  rationale: 两词在此具有地缘政治含义；“国家”和“王国”自然保留原文并列而略有重叠的表达。
- source_word: אֲדֹנִי
  choice: 我主
  rationale: 这里指俄巴底的君王亚哈，并非上帝；“我主”保留宫廷式敬称，也不额外引入奴役含义。
- source_word: שָׁלַח ... לְבַקֶּשְׁךָ
  choice: 派人去寻找你
  rationale: 原文直译为“派去寻找你”，汉语需要补出隐含的执行者“人”，才能自然表达差遣搜寻的行动。
- source_word: וְאָמְרוּ אָיִן
  choice: 他们若说：‘他不在这里’
  rationale: אָיִן 在语境中意为所寻找的人不在那里；补出代词“他”指以利亚。“若”呈现每次搜查所得答复与随后要求起誓之间的情境关系。
- source_word: וְהִשְׁבִּיעַ
  choice: 就让……起誓
  rationale: שבע 的使役式表示使人起誓或令其宣誓；“让……起誓”是清楚、自然的现代汉语。
- source_word: כִּי לֹא יִמְצָאֶךָ
  choice: 证明他们找不到你
  rationale: כִּי 引出誓言内容。加入“证明”说明该誓言所确认的事项；“找不到”保留未能寻获的结果，而不强化为绝对能力上的不可能。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 两者都是对四字神名的处理；正文采用普通简体中文圣经传统中辨识度最高的“耶和华”，保留专名性质，并使之区别于称号“主”。
- issue: 誓言公式 חַי־יהוה 的表达
  choice: 指着永活的耶和华起誓
  alternative: 耶和华是永活的
  rationale: 上下文要求把该结构理解为庄严誓言。明确补出“起誓”传达其言语行为，不把它弱化为孤立的神学陈述。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。为避免经文脱离上下文时误把起誓者理解成以利亚，补出“俄巴底……起誓说”；“我主”保留臣属对亚哈的敬称。“那个王国和国家”按单数形式作逐一、分配式理解。
