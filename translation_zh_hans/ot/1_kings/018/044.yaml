base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/044.yaml
  text: And it happened on the seventh time that he said[a], “Look, a small cloud, like a man’s palm, is rising from the sea.” Then he said, “Go up, say to Ahab, ‘Harness your chariot and go down[c][b], so that the rain does not stop you.’”
translation:
  language: zh_hans
  text: 第七次，仆人说：“看哪，有一小片云从海那边升起，像人的手掌[a]。”以利亚说：“你上去告诉亚哈：‘套好车驾[b]，下去吧，免得被雨阻住[c]。’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“像一个人的手掌。”这比较可指云的大小，也可能保留对其形状或可见范围的概括。
    reason: 保留希伯来文比较结构未明确限定的含义。
  - marker: b
    text: “套好车驾”指给拉车的牲口套上挽具，预备车驾启程。
    reason: 说明此处动词在古代车驾出行语境中的具体含义。
  - marker: c
    text: 或译：“免得雨把你耽搁住。”
    reason: עצר可表示阻挡、扣留或使人耽搁。
lexical_decisions:
- source_word: וַיְהִי בַּשְּׁבִעִית
  choice: 第七次
  rationale: 承接上文仆人反复前去察看，指第七次察看；现代汉语无须直译叙事连接语“事情发生了”。
- source_word: וַיֹּאמֶר
  choice: 仆人说
  rationale: 希伯来文仅作“他说”，但依上文说话者是仆人；补明主语可避免现代汉语中的指代含混。
- source_word: הִנֵּה
  choice: 看哪
  rationale: 保留引人注意和现场发现的语气，同时符合庄重的现代经文语体。
- source_word: עָב קְטַנָּה
  choice: 一小片云
  rationale: “片”符合汉语描述初现云朵的习惯，也传达其微小。
- source_word: כְּכַף אִישׁ
  choice: 像人的手掌那么大
  rationale: כַּף 指手掌；上下文中的比较主要说明云的大小。汉语用“人的”自然表达泛指人类，不必机械保留希伯来文阳性单数。
- source_word: עֹלָה מִיָּם
  choice: 从海上升起
  rationale: 分词表示正在发生的动作；“升起”准确呈现云从海面方向出现的景象。
- source_word: עֲלֵה
  choice: 你上去
  rationale: 保留命令式及上行的方向意义，指示仆人去传话。
- source_word: אֱסֹר
  choice: 套好车
  rationale: אסר 本义为捆绑、系上，此处是套好牲口、预备车辆启程的惯用表达；“套好车”简洁自然。
- source_word: וָרֵד
  choice: 下去吧
  rationale: 保留从迦密山下去的地形方向；语气词“吧”使转述的命令在汉语中自然。
- source_word: וְלֹא יַעֲצָרְכָה הַגָּשֶׁם
  choice: 免得被大雨阻住
  rationale: עצר 在此表示阻拦、耽搁；被动表达符合汉语习惯，并保留暴雨妨碍行程这一实际警告。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。补出“仆人”和“以利亚”以澄清两个连续出现的第三人称说话者；避免文言化的“于是”“驾车而下”，同时用“看哪”保留原文现场感。
