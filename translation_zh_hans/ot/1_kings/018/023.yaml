  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/יִתְּנוּ לָ֜/נוּ שְׁנַ֣יִם פָּרִ֗ים וְ/יִבְחֲר֣וּ לָ/הֶם֩ הַ/פָּ֨ר הָ/אֶחָ֜ד וִֽ/ינַתְּחֻ֗/הוּ וְ/יָשִׂ֨ימוּ֙ עַל הָ֣/עֵצִ֔ים וְ/אֵ֖שׁ לֹ֣א יָשִׂ֑ימוּ וַ/אֲנִ֞י אֶעֱשֶׂ֣ה אֶת הַ/פָּ֣ר הָ/אֶחָ֗ד וְ/נָֽתַתִּי֙ עַל הָ֣/עֵצִ֔ים וְ/אֵ֖שׁ לֹ֥א אָשִֽׂים־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/023.yaml
  text: Let them give us two bulls[a], and let them choose one bull for themselves, cut it into pieces, and place it on the wood, but put no fire under it. And I will prepare the other bull and place it on the wood, and I will put no fire under it.
translation:
  language: zh_hans
  text: 让他们给我们两头公牛；让他们为自己选一头，切成块，放在木柴上，却不要点火[a]。我也要预备另一头公牛，放在木柴上，也不点火。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“不要放火”；意思是不要点燃木柴或祭物。
    reason: 说明原文措辞，并交代自然中文译法。
lexical_decisions:
- source_word: וְיִתְּנוּ לָנוּ שְׁנַיִם פָּרִים
  choice: 让他们给我们两头公牛
  rationale: 连词加未完成式在这里表达提议或挑战；פָּרִים指献祭场景中的公牛。“给我们两头公牛”直接、自然，不额外限定年龄。
- source_word: וְיִבְחֲרוּ לָהֶם הַפָּר הָאֶחָד
  choice: 让他们为自己选一头
  rationale: לָהֶם表明他们为自己这一方挑选；带冠词的数词结构指两头中的一头。中文省略重复的“公牛”仍指代清楚。
- source_word: וִינַתְּחֻהוּ
  choice: 切成块
  rationale: נתח在献祭预备中指把牲畜分割成块；不具体化为固定块数。
- source_word: וְיָשִׂימוּ עַל־הָעֵצִים
  choice: 放在木柴上
  rationale: שׂים意为放置；הָעֵצִים在此指作燃料、已经摆放的木柴，用中文集合表达“木柴”自然清楚。
- source_word: וְאֵשׁ לֹא יָשִׂימוּ
  choice: 却不要点火
  rationale: 希伯来文直译为“不要放火”；现代中文“不要点火”准确表达不得引燃木柴或祭物，同时避免把原文没有明说的方位“在下面”写入正文。
- source_word: וַאֲנִי אֶעֱשֶׂה אֶת־הַפָּר הָאֶחָד
  choice: 我也要预备另一头公牛
  rationale: עשה以祭牲为宾语时表示处置、预备祭牲；两头中的一头已归对方，因此译作“另一头”符合语境。“预备”不提前断定献祭已经完成。
- source_word: וְנָתַתִּי עַל־הָעֵצִים וְאֵשׁ לֹא אָשִׂים
  choice: 放在木柴上，也不点火
  rationale: 保留与前半句平行的动作和禁令，以简洁自然的中文呈现。
theological_decisions:
- issue: 如何表达献祭预备过程而不加入后来的神学范畴
  choice: 采用“切成块、放在木柴上、不点火”等具体动作语言
  alternative: 通篇使用“献上、陈设”等较技术化的礼仪术语
  rationale: 本节重点是迦密山较量的实际安排，并未展开献祭神学；具体动作词更贴近希伯来文，也不把经文未明说的教义含义带入译文。
- issue: 是否把“火”解释为放在祭物下面
  choice: 正文译作“不点火”，脚注说明希伯来文的字面形式
  alternative: 正文增译“不要在下面点火”
  rationale: 木柴位于祭物之下可由场景推知，但原文没有“下面”一词。正文以自然中文传达禁令，脚注保留形式差异，避免将隐含方位当成明说内容。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“公牛”“木柴”“切成块”“点火”均为普通读者熟悉的词；分号呈现提议的步骤和平行结构。正文中的[a]与脚注对应。
