  language: zh_hans
  text: 他把柴摆好，把公牛切成块，放在柴上。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲרֹךְ
  choice: 摆好
  rationale: ערך在献祭准备的语境中指按适当次序摆放。“摆好”自然简洁，也体现动作有安排地完成。
- source_word: הָעֵצִים
  choice: 柴
  rationale: 原文为复数形式，在这里指祭坛上作燃料的木柴。现代汉语用集合意义的“柴”最自然。
- source_word: וַיְנַתַּח
  choice: 把……切成块
  rationale: נתח指将祭牲分割成若干块；此译明确表达分割结果，又避免使用过于专业的屠宰术语。
- source_word: הַפָּר
  choice: 公牛
  rationale: פַּר在献祭语境中通常指公牛；本节本身无需额外译出年龄。
- source_word: וַיָּשֶׂם
  choice: 放
  rationale: שׂים在这里表示把分割后的祭牲置于柴上。“放”符合现代汉语叙事，清楚而不失庄重。
- source_word: עַל הָעֵצִים
  choice: 在柴上
  rationale: עַל在此表达直接的空间位置；“在柴上”准确且符合现代汉语习惯。
