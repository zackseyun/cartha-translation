base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/029.yaml
  text: And it happened[a], when noon had passed, that they kept prophesying until the offering up of the grain offering, but there was no voice, no one answering[b], and no one paying attention.
translation:
  language: zh_hans
  text: 中午过后，他们仍不断地说预言[a]，直到献上素祭的时刻[b]；可是没有声音，没有人回答，也没有人留心。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们不停狂呼乱叫。”原文使用通常表示“说预言”的动词，在这里描写巴力先知狂热的举动。
    reason: lexical_alternative
  - marker: b
    text: “献上素祭的时刻”也可理解为献每日傍晚常祭的时刻。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי
  choice: 中午过后
  rationale: 这里的叙事形式用于推进场景；现代汉语无须机械译出“事情发生了”，以时间分句自然承接上下文。
- source_word: כַּעֲבֹר הַצָּהֳרַיִם
  choice: 中午过后
  rationale: 介词כְּ与不定式结构表示时间关系，指正午已经过去。
- source_word: וַיִּתְנַבְּאוּ
  choice: 他们继续说预言
  rationale: 希伯来语使用通常表示“说预言”的动词；此处语境显示巴力的先知处于狂热状态。“继续”体现动作延续，同时保留原词与先知活动的词汇联系。
- source_word: עַד לַעֲלוֹת הַמִּנְחָה
  choice: 直到献上素祭的时候
  rationale: 原文直指“素祭献上”的时候；מִנְחָה在此也可能作为固定献祭时段的标志，因此不在正文中擅自加入“傍晚”。
- source_word: וְאֵין קוֹל
  choice: 没有声音
  rationale: קוֹל可指声音或嗓音；“没有声音”既自然，也保留巴力毫无回应的含义。
- source_word: וְאֵין עֹנֶה
  choice: 无人回答
  rationale: 分词表达没有任何回应者；简洁的汉语分句准确传达其意义。
- source_word: וְאֵין קָשֶׁב
  choice: 也无人理会
  rationale: קָשֶׁב表示留意、听取或关注；“无人理会”自然呈现无人听见、无人关注的递进效果。
theological_decisions:
- issue: 如何表达巴力先知的狂热活动
  choice: 继续说预言
  alternative: 不停狂呼乱叫
  rationale: 原文采用通常表示“说预言”的动词。正文保留这一词汇联系及叙事中的反讽张力，把更具解释性的狂热含义列入脚注。
- issue: מִנְחָה是否明确指傍晚的常献祭时段
  choice: 献上素祭的时候
  alternative: 献傍晚常祭的时候
  rationale: 原文没有明说“傍晚”；正文保留“素祭”的直接含义，脚注说明它也可指固定的傍晚献祭时段。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“没有声音，无人回答，也无人理会”保留原文三个否定分句的节奏和递进。脚注标记分别紧跟其所解释的词组。
