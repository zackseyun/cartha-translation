revisions:
- from: 难道没有人告诉我主，我在耶洗别杀耶和华的先知时所做的事吗？我把耶和华的先知藏了一百人[a]，每五十人藏在一个洞里，并且供给他们饼和水。
  to: 难道没有人把我在耶洗别杀害耶和华的先知时所做的事告诉我主吗？我把耶和华的先知中的一百人[a]藏起来，每五十人藏在一个洞里，并且供给他们饼和水。
  rationale: 修正“把”字句的结构，使“一百人”明确为从耶和华先知中被藏匿的人；微调首句语序以符合现代汉语。其余内容、反问语气、时间背景、分组表达及脚注锚点均予保留。
