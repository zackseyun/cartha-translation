  text: הֲ/לֹֽא הֻגַּ֤ד לַֽ/אדֹנִ/י֙ אֵ֣ת אֲשֶׁר עָשִׂ֔יתִי בַּ/הֲרֹ֣ג אִיזֶ֔בֶל אֵ֖ת נְבִיאֵ֣י יְהוָ֑ה וָ/אַחְבִּא֩ מִ/נְּבִיאֵ֨י יְהוָ֜ה מֵ֣אָה אִ֗ישׁ חֲמִשִּׁ֨ים חֲמִשִּׁ֥ים אִישׁ֙ בַּ/מְּעָרָ֔ה וָ/אֲכַלְכְּלֵ֖/ם לֶ֥חֶם וָ/מָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/013.yaml
  text: Has it not been told to my lord what I did when Jezebel was killing the prophets of Yahweh—how I hid a hundred of the prophets of Yahweh[a], fifty men in each cave, and provided them with bread and water?
translation:
  language: zh_hans
  text: 难道没有人把我在耶洗别杀害耶和华的先知时所做的事告诉我主吗？我把耶和华的先知中的一百人[a]藏起来，每五十人藏在一个洞里，并且供给他们饼和水。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译可作“每五十人一个洞”，也可理解为“分成两组，每组五十人，藏在洞里”。希伯来文重复“五十”表达按五十人分组；“洞”为单数，可能具有分配性用法。
    reason: 保留重复数词所表达的分组分配，以及单数“洞”在此结构中的解释空间。
lexical_decisions:
- source_word: הֲלֹא הֻגַּד לַאדֹנִי
  choice: 难道没有人告诉我主
  rationale: הֲלֹא引出预期肯定回答的反问；将被动式הֻגַּד自然转为汉语主动无定主语句。“我主”是对以利亚的恭敬称呼，并非神性称号。
- source_word: בַּהֲרֹג אִיזֶבֶל
  choice: 在耶洗别杀……时
  rationale: 介词加不定式结构表达时间背景；“杀……时”保留原文行动进行期间的含义，而不额外界定其完成状态。
- source_word: נְבִיאֵי יְהוָה
  choice: 耶和华的先知
  rationale: 按专名呈现四字神名יהוה，并清楚保留属格结构。
- source_word: מִנְּבִיאֵי יְהוָה מֵאָה אִישׁ
  choice: 把耶和华的先知藏了一百人
  rationale: מן为部分用法，指从耶和华的众先知中藏了一百人；“人”对应原文אִישׁ。
- source_word: חֲמִשִּׁים חֲמִשִּׁים אִישׁ בַּמְּעָרָה
  choice: 每五十人藏在一个洞里
  rationale: 重复数词表示按五十人分组；单数“洞”在此可作分配性表达。译文自然表明分组安置，同时脚注保留句法上的其他理解。
- source_word: וָאֲכַלְכְּלֵם לֶחֶם וָמָיִם
  choice: 并且供给他们饼和水
  rationale: כלכל在此指供养、维持所需；“供给”贴合语义，并保留具体物品“饼和水”。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名；采用现代简体中文圣经语境中最为通行、普通读者最易识别的专名“耶和华”，不以“主”替代其专名性质。
- issue: לַאדֹנִי所指
  choice: 我主
  alternative: 我的主人
  rationale: 此处是俄巴底对以利亚的恭敬称呼，不是对神的称号；“我主”保留尊称语气及其与神名的区别。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“难道……吗”体现反问语气；用“我主”保留古代恭敬称呼，但避免误作神称。脚注明示希伯来文分组表达的真实歧义。
