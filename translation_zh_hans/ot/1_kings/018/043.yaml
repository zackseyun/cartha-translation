  to: 于是，以利亚对他的仆人[a]说：“请上去，朝海的方向看[b]。”仆人就上去察看，说：“什么也没有。”以利亚说：“再回去察看七次[c]。”
  rationale: 修订末句及其脚注，以避免把希伯来文未明说的次数计算方式译成“总共七次”。“再回去察看七次”在汉语中顺畅，并从上下文自然带出重复察看的动作。其余译文忠实自然，无须改动。
