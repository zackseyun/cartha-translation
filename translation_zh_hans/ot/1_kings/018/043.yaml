  text: וַ/יֹּ֣אמֶר אֶֽל נַעֲר֗/וֹ עֲלֵֽה נָא֙ הַבֵּ֣ט דֶּֽרֶךְ יָ֔ם וַ/יַּ֨עַל֙ וַ/יַּבֵּ֔ט וַ/יֹּ֖אמֶר אֵ֣ין מְא֑וּמָה וַ/יֹּ֕אמֶר שֻׁ֖ב שֶׁ֥בַע פְּעָמִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/043.yaml
  text: Then he said to his servant[a], “Please go up and look toward the sea.” So he went up and looked, and said, “There is nothing.” Then he said[c][b], “Go back seven times.”
translation:
  language: zh_hans
  text: 于是，以利亚对他的仆人[a]说：“请上去，朝海的方向看[b]。”仆人就上去察看，说：“什么也没有。”以利亚说：“再回去察看七次[c]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“他的少年”或“他的侍从”。
    reason: lexical_alternative
  - marker: b
    text: 直译“向海的方向看”。
    reason: lexical_alternative
  - marker: c
    text: 即反复回去察看；原文只说明次数为七次，并未明确说明是否将先前那次察看计入其中。
    reason: cultural_note
lexical_decisions:
- source_word: נַעֲרוֹ
  choice: 他的仆人
  rationale: נַעַר可指少年、年轻人或侍从。这里此人听从以利亚的吩咐，“仆人”能自然表达其叙事角色；脚注保留年龄或职分方面的其他可能。
- source_word: עֲלֵה נָא
  choice: 请上去
  rationale: עֲלֵה是“上去”的命令式，נָא使语气较为恳切或礼貌；译作“请上去”兼顾动作和语气。
- source_word: הַבֵּט דֶּרֶךְ יָם
  choice: 朝海的方向望一望
  rationale: הַבֵּט表示“看、凝望”，דֶּרֶךְ יָם在这里表示朝向海的方向。此译法忠实而符合现代汉语表达。
- source_word: אֵין מְאוּמָה
  choice: 什么也没有
  rationale: 这是强调性的否定表达，指没有看见任何东西；“什么也没有”简洁自然。
- source_word: שֻׁב
  choice: 再回去
  rationale: שׁוּב通常意为“返回、回去”。结合上文，命令是让仆人回去重复察看；正文保持“回去”的基本意义，并以“再”连接语境。
- source_word: שֶׁבַע פְּעָמִים
  choice: 共七次
  rationale: 直译为“七次”。加“共”使汉语清楚表明总次数，同时不改变原文数量。
