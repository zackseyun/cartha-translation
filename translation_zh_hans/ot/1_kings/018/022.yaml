  text: וַ/יֹּ֤אמֶר אֵלִיָּ֨הוּ֙ אֶל הָ/עָ֔ם אֲנִ֞י נוֹתַ֧רְתִּי נָבִ֛יא לַ/יהוָ֖ה לְ/בַדִּ֑/י וּ/נְבִיאֵ֣י הַ/בַּ֔עַל אַרְבַּע מֵא֥וֹת וַ/חֲמִשִּׁ֖ים אִֽישׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/022.yaml
  text: Then Elijah said to the people[a], “I, I alone, am left as a prophet of Yahweh, but the prophets of Baal are four hundred and fifty men.”
translation:
  language: zh_hans
  text: 于是，以利亚对百姓说：“只剩下我一个人作雅威的先知[a]，巴力的先知却有四百五十人。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 以利亚这里所说的是他在这场公开对峙中孤身站立的处境；本章其他地方提到，俄巴底曾藏起雅威的一些先知（18:4、13）。
    reason: 保留以利亚话语本身的强调，同时提示叙事中有意保留的张力，避免在正文中加以调和。
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 于是……说
  rationale: 连续式叙事动词推进情节；“于是”在现代汉语中自然表达这里的承接关系。
- source_word: אֶל הָעָם
  choice: 对百姓
  rationale: עָם 指当时聚集的以色列民众；“百姓”符合列王纪语境，也比“人群”更能体现其群体身份。
- source_word: אֲנִי נוֹתַרְתִּי ... לְבַדִּי
  choice: 只剩下我一个人
  rationale: 显明主语 אֲנִי 与 לְבַדִּי 共同突出以利亚所说的孤立处境；这一汉语表达既自然，也保留强调意味。
- source_word: נָבִיא לַיהוָה
  choice: 作雅威的先知
  rationale: 介词 לְ 在这里表示先知归属于雅威并代表他发言；“作雅威的先知”是清楚、自然的汉语表达。
- source_word: יְהוָה
  choice: 雅威
  rationale: 直接音译四字神名，保留其作为以色列之神专名的性质，而不以称号替代。
- source_word: וּנְבִיאֵי הַבַּעַל
  choice: 巴力的先知却
  rationale: 连接词在语境中形成一人与众人的鲜明对比，因此用“却”表达转折对照。
- source_word: אַרְבַּע מֵאוֹת וַחֲמִשִּׁים אִישׁ
  choice: 有四百五十人
  rationale: 完整保留人数；אִישׁ 是计数人的用语，译为“人”简洁自然。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华／上主
  rationale: 原文使用神的专名；“雅威”直接呈现该名，不以传统音译或称号代替。
- issue: 以利亚自称是唯一剩下的先知
  choice: 只剩下我一个人作雅威的先知
  alternative: 我独自留下来作雅威的先知
  rationale: 按原话保留以利亚在这场公开对峙中的强调，不在正文中将其与俄巴底所藏的其他先知调和。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“只剩下我一个人”自然体现希伯来文显明主语与“独自”的双重强调；“却”突出双方人数的强烈对照。
