  yaml_path: translation/ot/1_kings/018/035.yaml
  text: And the water went all around the altar[b][a], and it also filled the trench with water.
translation:
  language: zh_hans
  text: 水流遍祭坛四周[a]，也把沟[b]灌满了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “流遍”所译动词直义为“走”或“去”；这里以“水”为主语，指水的流动。
    reason: lexical_alternative
  - marker: b
    text: “沟”也可译作“沟槽”或“水渠”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלְכוּ הַמַּיִם
  choice: 水流到
  rationale: 动词字面义为“去、行”，但以“水”为主语时表示水的流动；译作“流到”既符合现代汉语，也保留其动态含义。
- source_word: סָבִיב לַמִּזְבֵּחַ
  choice: 祭坛四周
  rationale: סָבִיב表示环绕的范围；“祭坛四周”自然表达水遍及祭坛周围。
- source_word: וְגַם
  choice: 也
  rationale: 保留原文递进附加的语气，说明水不仅流到祭坛四周，也进入了沟中。
- source_word: אֶת־הַתְּעָלָה
  choice: 沟
  rationale: תְּעָלָה在本段指围绕祭坛挖出的沟槽；“沟”简洁自然，且不把其具体形制说得过死。
- source_word: מִלֵּא מָיִם
  choice: 灌满了水
  rationale: 表达“使之充满水”的结果；采用“沟里也灌满了水”的无显式施事结构，避免替原文强行指定该动词的主语。
