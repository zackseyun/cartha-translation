  text: וַ/יַּעֲלֶ֥ה אַחְאָ֖ב לֶ/אֱכֹ֣ל וְ/לִ/שְׁתּ֑וֹת וְ/אֵ֨לִיָּ֜הוּ עָלָ֨ה אֶל רֹ֤אשׁ הַ/כַּרְמֶל֙ וַ/יִּגְהַ֣ר אַ֔רְצָ/ה וַ/יָּ֥שֶׂם פָּנָ֖י/ו בֵּ֥ין ברכ/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/042.yaml
  text: So Ahab went up to eat and to drink[a], but Elijah went up to the top of Carmel[c][b], and he bent down to the ground and put his face between his knees.
translation:
  language: zh_hans
  text: 亚哈就上去吃喝；以利亚却[a]登上迦密山顶[b]，俯身向地[c]，把脸放在双膝之间。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “却”或译“而”。希伯来语连接词本身通常表示“和、而”；这里译作“却”，是为了显出亚哈与以利亚所做之事的对比。
    reason: lexical_alternative
  - marker: b
    text: “迦密山顶”也可译作“迦密的顶峰”。希伯来语此处直称“迦密”，没有另用“山”字。
    reason: lexical_alternative
  - marker: c
    text: 原文在这里描述以利亚的身体姿势；上下文可能暗示他在祷告，但本节没有明确使用“祷告”一词。
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעֲלֶה
  choice: 上去
  rationale: עלה是常见的方向性动词，表示“上去、登上”；此处用“上去”自然地保留叙事中的方向感。
- source_word: לֶאֱכֹל וְלִשְׁתּוֹת
  choice: 吃喝
  rationale: 两个不定式表示目的；现代汉语以“吃喝”简洁、自然地表达“去吃、去喝”，没有增添宴乐等原文未明说的含义。
- source_word: וְאֵלִיָּהוּ
  choice: 以利亚却
  rationale: וְ形式上是“和、而”，但上下句将亚哈的行动与以利亚的行动并列对照；“却”在汉语中自然显出这一语篇对比，同时以脚注保留直译可能。
- source_word: עָלָה אֶל רֹאשׁ הַכַּרְמֶל
  choice: 登上迦密山顶
  rationale: רֹאשׁ本义为“头”，用于地形时指顶部或顶峰。“迦密山”是现代中文对该地名的通行表达，“山顶”清楚传达其地形含义。
- source_word: וַיִּגְהַר אַרְצָה
  choice: 俯身向地
  rationale: 罕见动词גהר描述身体弯下、伏低的姿势；“俯身向地”保留具体动作，不将其直接解释为敬拜或祷告。
- source_word: וַיָּשֶׂם פָּנָיו בֵּין בִּרְכָּיו
  choice: 把脸放在双膝之间
  rationale: 按原文具体呈现以利亚的姿势。“双膝”符合现代汉语习惯，并表达膝盖的复数意义。
theological_decisions:
- issue: 是否在正文中把以利亚的姿势明确解释为祷告
  choice: 只翻译身体姿势，不加入“祷告”
  alternative: “他俯伏祷告”或“他把脸放在双膝之间祷告”
  rationale: 上下文可能使读者把这一姿势理解为祷告，但本节本身只描述身体动作。正文不明说“祷告”，可避免把合理推论写成原文明言。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。“吃喝”简练通顺；“俯身向地”有意保留姿势描写及其解释空间，不使用较古奥的“屈身伏地”，也不增译“祷告”。
