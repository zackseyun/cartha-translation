base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/024.yaml
  text: Then call on the name of your god[a], and I will call on the name of Yahweh; and the God who answers by fire, he is God." And all the people answered and said[b], "The word is good.
translation:
  language: zh_hans
  text: 你们要呼求你们神的名[a]，我也要呼求雅威的名；那用火回应的神，他就是神。”众民都回答说：“这提议很好。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“你们的众神”。希伯来语 אֱלֹהֵיכֶם 在形式上可以是复数；本节语境也可理解为特指巴力这一位神。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּקְרָאתֶם בְּשֵׁם
  choice: 你们要求告……的名
  rationale: קרא 与 בְּשֵׁם 连用表示呼求或祈求某位神明；“求告……的名”既贴近原文，也是自然庄重的现代汉语表达。
- source_word: אֱלֹהֵיכֶם
  choice: 你们神
  rationale: אֱלֹהִים 形式上可作复数，但本段竞验所针对的是巴力这一位神明，且后文以单数动词和代词指称，因此正文采用单数；复数可能性保留在脚注。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以通行的现代汉语音译呈现四字神名，不用称号替代专名。
- source_word: יַעֲנֶה בָאֵשׁ
  choice: 用火回应
  rationale: בָאֵשׁ 可表达方式或手段；“用火回应”清楚保留以降火作答的竞验含义。
- source_word: הוּא הָאֱלֹהִים
  choice: 他就是神
  rationale: 保留强调代词 הוּא 及结论性的判断语气，不预先替读者解决竞验的结果。
- source_word: וַיַּעַן כָּל הָעָם וַיֹּאמְרוּ
  choice: 众民都回答说
  rationale: 希伯来叙事中“回答并说”可自然合译为“回答说”，同时保留全体百姓回应的范围。
- source_word: טוֹב הַדָּבָר
  choice: 这提议很好
  rationale: דָּבָר 可指话、事情或提议；此处百姓赞同以降火判明真神的办法，“这提议很好”最符合语境。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华／主
  rationale: 原文直接使用神的专名；“雅威”较直接地转写该名，并避免以称号“主”取代。
- issue: אֱלֹהֵיכֶם 的数
  choice: 你们神（单数）
  alternative: 你们的众神（复数）
  rationale: 词形容许复数理解，但竞验语境指向巴力，后续单数动词 יַעֲנֶה 也支持单数；由于词形仍有真实歧义，脚注注明复数译法。
- issue: 首个 הָאֱלֹהִים 的所指
  choice: 那用火回应的神
  alternative: 那用火回应的上帝
  rationale: 此语句先泛指竞验双方所声称的神明，再由“他就是神”宣告真正身份；中文正文用同一个“神”保留原文的修辞推进。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“求告……的名”保留敬拜语境；“这提议很好”按上下文传达百姓对所提验证办法的赞同。所有脚注标记均已置于正文。
