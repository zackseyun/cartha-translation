  to: 于是，以利亚走到所有民众面前，说：“你们在两根枝杈之间一瘸一拐[a]，要到什么时候呢？如果雅威是上帝，就跟从他；如果巴力是神，就跟从巴力。”众民却没有回答他一句话。
