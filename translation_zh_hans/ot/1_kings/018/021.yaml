  text: וַ/יִּגַּ֨שׁ אֵלִיָּ֜הוּ אֶל כָּל הָ/עָ֗ם וַ/יֹּ֨אמֶר֙ עַד מָתַ֞י אַתֶּ֣ם פֹּסְחִים֮ עַל שְׁתֵּ֣י הַ/סְּעִפִּים֒ אִם יְהוָ֤ה הָֽ/אֱלֹהִים֙ לְכ֣וּ אַחֲרָ֔י/ו וְ/אִם הַ/בַּ֖עַל לְכ֣וּ אַחֲרָ֑י/ו וְ/לֹֽא עָנ֥וּ הָ/עָ֛ם אֹת֖/וֹ דָּבָֽר־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/021.yaml
  text: Then Elijah came near to all the people and said[a], “How long will you keep limping between two opinions? If Yahweh is God, follow him; but if Baal, follow him.” But the people did not answer him a word.
translation:
  language: zh_hans
  text: 于是，以利亚走到所有民众面前，说：“你们在两根枝杈之间一瘸一拐[a]，要到什么时候呢？如果雅威是上帝，就跟从他；如果巴力是神，就跟从巴力。”众民却没有回答他一句话。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“在两种意见之间摇摆”。希伯来文较直译为“在两根枝杈（或岔口）上／之间跛行”，是指向分裂效忠的比喻。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגַּשׁ
  choice: 走近
  rationale: נגשׁ表示走近、上前；“走近”自然地保留了以利亚面向全体民众上前发言的动作。
- source_word: כָּל הָעָם
  choice: 众民
  rationale: 概括全体在场之民，简洁而庄重，保留集合性表达。
- source_word: עַד מָתַי
  choice: 要到什么时候呢
  rationale: 符合现代汉语质问语气，也准确表达希伯来语的时间挑战句式。
- source_word: פֹּסְחִים עַל שְׁתֵּי הַסְּעִפִּים
  choice: 一瘸一拐地摇摆在两个岔枝之间
  rationale: פֹּסְחִים带有跛行、跳动之意；סְעִפִּים指分岔的枝条或岔杈。译文保留具体而不稳定的动作和岔枝意象，同时用“摇摆”使其所表达的游移状态在现代汉语中可理解。
- source_word: אִם יְהוָה הָאֱלֹהִים
  choice: 如果雅威是上帝
  rationale: 将יהוה按其专名译作“雅威”，并自然呈现判断句所提出的独一效忠挑战。
- source_word: לְכוּ אַחֲרָיו
  choice: 跟从他
  rationale: “走在他后面”在此表示忠诚与归从；“跟从”兼顾习语意义和庄重语体。
- source_word: הַבַּעַל
  choice: 巴力
  rationale: 虽有定冠词，语境中是神名，现代汉语以“巴力”最自然。
- source_word: וְלֹא עָנוּ הָעָם אֹתוֹ דָּבָר
  choice: 众民却一句话也不回答他
  rationale: 保留“一句话也不”的强调，并以“却”传达上下文中的反差。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名。音译“雅威”使其与普通称号“上帝”有别，并保留经文对雅威与巴力的直接对举。
- issue: פֹּסְחִים עַל שְׁתֵּי הַסְּעִפִּים所表达的分裂效忠
  choice: 保留“瘸行”和“两个岔枝”的具体意象，并用“摇摆”辅助理解
  alternative: 在两种意见之间犹豫不决
  rationale: 原文意象具有词义和解释上的张力；完全抽象化为“意见”会消除枝杈及跛行的画面，而仅作逐词直译在汉语中又难以理解。
- issue: 省略句וְאִם הַבַּעַל
  choice: 如果巴力是
  alternative: 如果巴力是上帝
  rationale: 保留原文第二个条件句的省略形式，不替原文补足谓语，同时汉语仍可从上句清楚领会。
translation_notes:
  register: 采用现代、庄重且可朗读的简体中文。“一瘸一拐地摇摆在两个岔枝之间”有意保留希伯来文突兀而鲜明的隐喻；不设置脚注，因为译文正文已兼顾形象与基本含义。
