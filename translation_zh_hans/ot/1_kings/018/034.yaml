  text: וַ/יֹּ֗אמֶר מִלְא֨וּ אַרְבָּעָ֤ה כַדִּים֙ מַ֔יִם וְ/יִֽצְק֥וּ עַל הָ/עֹלָ֖ה וְ/עַל הָ/עֵצִ֑ים וַ/יֹּ֤אמֶר שְׁנוּ֙ וַ/יִּשְׁנ֔וּ וַ/יֹּ֥אמֶר שַׁלֵּ֖שׁוּ וַ/יְשַׁלֵּֽשׁוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/034.yaml
  text: Then he said[a], “Fill four jars with water and pour it on the burnt offering and on the wood.” Then he said, “Do it a second time,” and they did it a second time. Then he said, “Do it a third time,” and they did it a third time.
translation:
  language: zh_hans
  text: 他就说：“把四个水罐[a]装满水，倒在燔祭和柴上。”接着他说：“再照样做一次。”他们就照样做了第二次。他又说：“再做第三次。”他们就照样做了第三次。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “水罐”或译“水瓶”；希伯来词泛指盛装、运送液体的器皿。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 他就说／接着他说／他又说
  rationale: 连续式叙事形式推动事件发展；依上下文分别用“就”“接着”“又”，既保留先后推进，也避免现代汉语中机械重复。
- source_word: אַרְבָּעָה כַדִּים
  choice: 四个水罐
  rationale: כַּדִּים 指盛装或运送液体的器皿。“水罐”自然清楚，又不把器皿的具体形状或材质说得过死。
- source_word: וְיִצְקוּ
  choice: 倒在
  rationale: 此处接续前面的复数命令，要求听命者把水倾倒在祭物和柴上；汉语直接用祈使表达最自然。
- source_word: עַל הָעֹלָה
  choice: 在燔祭上
  rationale: עֹלָה 是以色列献祭制度中的固定祭名；“燔祭”是现代中文圣经语境中准确而简洁的对应词。
- source_word: וְעַל הָעֵצִים
  choice: 和柴上
  rationale: עֵצִים 在本段指祭坛上摆放的木柴；译作“柴”比泛指材质的“木头”更符合焚烧祭物的场景。
- source_word: שְׁנוּ / וַיִּשְׁנוּ
  choice: 再照样做一次／照样做了第二次
  rationale: 词根 שנה 在此表示重复先前动作。命令句用自然汉语“再照样做一次”，叙述句明确这是第二次，以保留原文的计数递进。
- source_word: שַׁלֵּשׁוּ / וַיְשַׁלֵּשׁוּ
  choice: 照样做第三次／照样做了第三次
  rationale: 这组形式表示把同一行动做到第三次；译文保留原文命令与执行之间的整齐对应。
theological_decisions:
- issue: 祭祀术语 עֹלָה 的译法
  choice: 燔祭
  alternative: 全烧祭
  rationale: 该词指全部焚烧献上的祭物。“燔祭”是准确、简洁且广为理解的规范译名；正文不额外加入“全”字，以免超过本节明说的内容。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。叙事连接词随语境变化以保持流畅；重复命令则保留“第二次—第三次”的递进结构。脚注标记紧接其所解释的“水罐”。
