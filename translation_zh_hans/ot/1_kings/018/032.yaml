  text: וַ/יִּבְנֶ֧ה אֶת הָ/אֲבָנִ֛ים מִזְבֵּ֖חַ בְּ/שֵׁ֣ם יְהוָ֑ה וַ/יַּ֣עַשׂ תְּעָלָ֗ה כְּ/בֵית֙ סָאתַ֣יִם זֶ֔רַע סָבִ֖יב לַ/מִּזְבֵּֽחַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/032.yaml
  text: And with the stones he built an altar in the name of Yahweh[a], and he made a trench around the altar, like the capacity for two seahs of seed.
translation:
  language: zh_hans
  text: 他用这些石头奉雅威的名筑了一座坛，又在坛的四周挖了一道沟，容量约为两细亚种子的量[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译近似“像两细亚种子的容量（或范围）”。“细亚”是古代容量单位；这句话可能是在说明沟的容量或整体大小。
    reason: 说明古代度量单位，并保留希伯来原文省略表达所带来的“容量或范围”歧义。
lexical_decisions:
- source_word: וַיִּבְנֶה אֶת־הָאֲבָנִים מִזְבֵּחַ
  choice: 他用这些石头……筑了一座坛
  rationale: 原文直译近似“他把这些石头筑成一座坛”。中文用“用这些石头……筑了一座坛”自然表达石头作为材料的意思，也不额外引入上一节的“重修”。
- source_word: בְּשֵׁם יְהוָה
  choice: 奉雅威的名
  rationale: “奉……的名”是现代中文表达以某人的名义、权柄或为其名而行的自然说法，保留原文 בְּשֵׁם 的宗教与盟约内涵。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以常见的现代汉语音译呈现神的专名，而不以“主”这一称号替代。
- source_word: וַיַּעַשׂ תְּעָלָה
  choice: 挖了一道沟
  rationale: תְּעָלָה 指沟、沟渠；结合祭坛四周的场景，“挖了一道沟”比直译“做了一道沟”更符合自然中文。
- source_word: כְּבֵית סָאתַיִם זֶרַע
  choice: 大小约可容纳两细亚种子
  rationale: 原文是省略而难解的度量表达，字面近似“像两细亚种子的容量（或范围）”。正文以“大小约可容纳”表达其大概是在说明沟的规模或容量，同时保留古代单位“细亚”，不武断换算成现代单位。
- source_word: סָבִיב לַמִּזְבֵּחַ
  choice: 在坛的四周
  rationale: 简洁自然地表达沟环绕祭坛的位置关系。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名。采用“雅威”保留其专名性质，避免用称号替代；“耶和华”是传统音译，但较不贴近通常重构的读音。
- issue: בְּשֵׁם 的含义
  choice: 奉雅威的名
  alternative: 为雅威的名；凭雅威的名
  rationale: “奉……的名”能保留原文可能涉及名义、权柄和敬拜归属的张力，而不把它局限为单一解释。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“筑坛”符合叙事及祭祀语境；“挖了一道沟”清楚易懂。保留“细亚”这一古代单位，并以脚注解释原文难点，避免未经文本支持的精确公制换算。
