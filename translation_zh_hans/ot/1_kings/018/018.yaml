source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר לֹ֤א עָכַ֨רְתִּי֙ אֶת יִשְׂרָאֵ֔ל כִּ֥י אִם אַתָּ֖ה וּ/בֵ֣ית אָבִ֑י/ךָ בַּֽ/עֲזָבְ/כֶם֙ אֶת מִצְוֺ֣ת יְהוָ֔ה וַ/תֵּ֖לֶךְ אַחֲרֵ֥י הַ/בְּעָלִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/018.yaml
  text: And he said[a], “I have not troubled Israel, but you and your father's house have[c][b], because you have forsaken the commandments of Yahweh and have gone after the Baals.”
translation:
  language: zh_hans
  text: 他说：“给以色列带来灾祸的不是我，而是你和你父家，因为你们离弃了雅威[a]的诫命，并且你随从了众巴力[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “雅威”译自希伯来文神名 יהוה（YHWH），传统上也译作“耶和华”。
    reason: 说明神名的原文形式及常见译名。
  - marker: b
    text: 原文“巴力”为复数；可指各地不同形态或名号的巴力崇拜。
    reason: 保留并说明原文复数所含的文化背景，同时避免过度限定其具体所指。
lexical_decisions:
- source_word: עָכַרְתִּי
  choice: 给……带来灾祸
  rationale: 该动词在此指给群体招致祸患；这一译法自然地承接上节对以利亚的指控，也保留了灾难性的语义。
- source_word: כִּי אִם
  choice: 不是……而是……
  rationale: 这组词在此表示强烈的转折和纠正：以利亚否认指控，并将责任归回亚哈及其父家。
- source_word: וּבֵית אָבִיךָ
  choice: 你和你父家
  rationale: “父家”保留希伯来语的家族、宗族及王朝责任含义，比单译“家人”更充分。
- source_word: בַּעֲזָבְכֶם
  choice: 因为你们离弃了
  rationale: 介词加不定式在此说明造成灾祸的原因；第二人称复数对应亚哈及其父家。
- source_word: מִצְוֺת
  choice: 诫命
  rationale: 保留该词在盟约和律法语境中的分量，同时符合现代汉语圣经语体。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语音译呈现四字神名，而不以称号替代；脚注说明其希伯来文形式。
- source_word: וַתֵּלֶךְ אַחֲרֵי
  choice: 而你又去随从
  rationale: “随从”表达效忠和敬拜之意；原文动词为第二人称阳性单数，因此明确译作“你”，与前面的复数“你们”有所区别。
- source_word: הַבְּעָלִים
  choice: 众巴力
  rationale: 保留希伯来文明确的复数形式，指巴力崇拜的多种地方形态或表现。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用神的专名。采用“雅威”保留专名性质，避免以“主”这一称号替代；脚注兼顾读者辨识。
- issue: הַבְּעָלִים 的复数形式
  choice: 众巴力
  alternative: 巴力；巴力偶像
  rationale: 原文为复数。译作“众巴力”不将其简化为单数，也不额外加入原文没有的“偶像”一词。
- issue: 复数 בַּעֲזָבְכֶם 与单数 וַתֵּלֶךְ 的转换
  choice: “你们离弃了……而你又去随从”
  alternative: “你们离弃了……又去随从”
  rationale: 原文先以复数指亚哈及其父家，随后用第二人称阳性单数直接指向亚哈。译文保留这一责任焦点的转换。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“父家”“诫命”“随从”保留古代宗族、盟约和敬拜语境，但句法力求普通读者容易理解。译文特意保留原文从复数“你们”转为单数“你”的变化。
