base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/015.yaml
  text: And Elijah said[a], “As Yahweh of hosts lives, before whom I stand, today I will surely present myself to him.”
translation:
  language: zh_hans
  text: 以利亚说：“万军之耶和华永活；我侍立在他面前。我起誓，今天我必在亚哈面前现身[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译可作“我必让他看见我”或“我必出现在他面前”；“他”按上下文指亚哈。这个希伯来语动词可表示“被看见、出现”或“让自己露面”。
    reason: lexical_alternative
lexical_decisions:
- source_word: חַי יְהוָה
  choice: 我指着……永活的主……起誓
  rationale: 这是希伯来语庄严的起誓套语。汉语用“指着……起誓”自然传达誓言功能，同时以“永活的主”保留原文以耶和华之生命作保证的表达。
- source_word: יְהוָה צְבָאוֹת
  choice: 万军之耶和华
  rationale: 保留神的专名“耶和华”及传统而广义的称号“万军”，不将 צְבָאוֹת 限定为人间军队或天军。
- source_word: אֲשֶׁר עָמַדְתִּי לְפָנָיו
  choice: 我所侍立在他面前的
  rationale: “侍立”既保留“站在……面前”的宫廷意象，也自然表达先知在上主面前等候差遣、事奉他的含义。
- source_word: כִּי הַיּוֹם
  choice: 今天……一定
  rationale: כִּי 在此引出誓言所保证的内容；“一定”以自然汉语表达上下文中的郑重保证。
- source_word: אֵרָאֶה אֵלָיו
  choice: 我一定会去见亚哈
  rationale: ראה 的尼法勒式在此可指“被看见、出现、让自己被看见”。“去见亚哈”在现代汉语中清楚表达以利亚主动前去露面；代词所指按上下文明确为亚哈，但脚注保留原文形式和词义幅度。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。正文采用现代中文圣经读者最熟悉的专名形式“耶和华”，不以“主”这一称号替代；誓言套语中的“永活的主”为汉语句法补充，专名仍明确出现。
- issue: “侍立在他面前”的含义
  choice: 保留宫廷式侍立意象，并容纳事奉含义
  alternative: 直接译作“我所事奉的”
  rationale: 原文既可表达身处上主面前，也隐含服侍、听命；直译其意象可避免把丰富含义缩减为单一解释。
- issue: אֵרָאֶה 的语态与主动性
  choice: 正文译作“去见”，脚注保留“让他看见我／出现在他面前”
  alternative: 我必向他显现
  rationale: 该尼法勒式具有“被看见、出现、现身”的语义范围。正文需符合现代汉语叙事习惯，但不应使“显现”带上不必要的神学色彩，因此在脚注保存较形式对应的译法。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“侍立”保留先知在君王般的上主面前听命的意象；破折号使较长的希伯来誓言结构在中文中清楚易读。正文将代词明确为“亚哈”，脚注说明原文仍为第三人称代词，并保存动词的真实歧义。
