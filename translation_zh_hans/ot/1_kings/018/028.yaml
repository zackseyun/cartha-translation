  text: וַֽ/יִּקְרְאוּ֙ בְּ/ק֣וֹל גָּד֔וֹל וַ/יִּתְגֹּֽדְדוּ֙ כְּ/מִשְׁפָּטָ֔/ם בַּ/חֲרָב֖וֹת וּ/בָֽ/רְמָחִ֑ים עַד שְׁפָךְ דָּ֖ם עֲלֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/028.yaml
  text: So they cried out with a loud voice and cut themselves according to their custom with swords and spears until the blood gushed out on them[a][b].
translation:
  language: zh_hans
  text: 于是，他们大声呼喊，照着自己的规矩[b]，用刀剑和长矛割伤自己[a]，直到他们身上鲜血直流。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “割伤自己”也可译作“划破自己”。希伯来语指仪式性的自我割伤。
    reason: lexical_alternative
  - marker: b
    text: “照着自己的规矩”也可译作“照着自己的惯例”或“照他们一贯的做法”。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקְרְאוּ
  choice: 他们大声呼喊
  rationale: קרא在此指向巴力高声求告；“呼喊”比中性的“呼叫”更符合仪式场景，并与בְּקוֹל גָּדוֹל合并成自然的现代汉语。
- source_word: בְּקוֹל גָּדוֹל
  choice: 大声
  rationale: 直译为“用大声音”不合现代汉语习惯；“大声”准确保留其强度。
- source_word: וַיִּתְגֹּדְדוּ
  choice: 割伤自己
  rationale: 该反身形式表示仪式性的自我割伤；“割伤自己”清楚直接，又不额外断定伤口的深浅。
- source_word: כְּמִשְׁפָּטָם
  choice: 照着自己的规矩
  rationale: מִשְׁפָּט在这里指他们既定的仪式惯例；“规矩”既保留规范性，也可自然理解为惯常做法。
- source_word: בַּחֲרָבוֹת
  choice: 用刀剑
  rationale: 介词ב表示工具；“刀剑”自然传达חֶרֶב所指的带刃武器。
- source_word: וּבָרְמָחִים
  choice: 和长矛
  rationale: רֹמַח指矛或长枪；“长矛”是清楚、常用的现代名称。
- source_word: עַד שְׁפָךְ דָּם עֲלֵיהֶם
  choice: 直到他们身上鲜血直流
  rationale: עַד表达动作达到的程度，שׁפךְ דם描绘血流出；此译法在现代汉语中自然，并保留“血在他们身上”的具体画面，而不把流量夸张为“喷涌”。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“于是”承接上文，“鲜血直流”保留原文的鲜明画面，但避免不必要地强化为喷涌。脚注标记均置于其所说明的词语之后。
