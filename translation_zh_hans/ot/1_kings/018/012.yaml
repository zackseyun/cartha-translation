source:
  edition: WLC
  text: וְ/הָיָ֞ה אֲנִ֣י אֵלֵ֣ךְ מֵ/אִתָּ֗/ךְ וְ/ר֨וּחַ יְהוָ֤ה יִֽשָּׂאֲ/ךָ֙ עַ֚ל אֲשֶׁ֣ר לֹֽא אֵדָ֔ע וּ/בָ֨אתִי לְ/הַגִּ֧יד לְ/אַחְאָ֛ב וְ/לֹ֥א יִֽמְצָאֲ/ךָ֖ וַ/הֲרָגָ֑/נִי וְ/עַבְדְּ/ךָ֛ יָרֵ֥א אֶת יְהוָ֖ה מִ/נְּעֻרָֽ/י׀׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/012.yaml
  text: And when I go away from you[a], the Spirit of Yahweh may carry you where I do not know. Then when I come and tell Ahab and he does not find you, he will kill me—though your servant has feared Yahweh from my youth.
translation:
  language: zh_hans
  text: 我一离开你，雅威的灵[a]也许会把你带到我不知道的地方。等我去告诉亚哈时，他却找不到你，就会杀我。可是你的仆人从小就敬畏雅威。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“雅威的风”。希伯来语“רוּחַ”可指“灵”“风”或“气息”；此处译作“灵”较符合上下文。
    reason: 保留原词真实存在的词义歧义。
lexical_decisions:
- source_word: וְהָיָה אֲנִי אֵלֵךְ מֵאִתָּךְ
  choice: 我一离开你
  rationale: 以自然的汉语条件—时间结构表达将来的情形，同时保留离开以利亚身边的含义。
- source_word: רוּחַ יְהוָה
  choice: 雅威的灵
  rationale: רוּחַ 可指灵、风或气息；此处描述神的力量将先知带走，以“灵”最符合先知叙事语境，同时在脚注保留“风”的可能。
- source_word: יִשָּׂאֲךָ
  choice: 也许会把你带到
  rationale: נשא 的基本义是举起、承载或带走；“把你带到”适合此处所担心的超自然转移，而“也许会”体现俄巴底所设想的不确定情形。
- source_word: עַל אֲשֶׁר לֹא אֵדָע
  choice: 我不知道的地方
  rationale: 希伯来语表达未知的去处；汉语需补出“地方”才自然清楚。
- source_word: וּבָאתִי לְהַגִּיד לְאַחְאָב
  choice: 我去告诉亚哈
  rationale: 按语境，俄巴底是前去向亚哈报告；“去告诉”比机械译作“来告诉”更符合汉语视角。
- source_word: וְלֹא יִמְצָאֲךָ וַהֲרָגָנִי
  choice: 他却找不到你，就会杀我
  rationale: 清楚呈现找不到以利亚所导致的后果；“却”突出事情与报告内容相反。
- source_word: וְעַבְדְּךָ
  choice: 你仆人
  rationale: 这是对以利亚的谦称，并非着重法律上的奴隶身份。
- source_word: יָרֵא אֶת יְהוָה מִנְּעֻרָי
  choice: 从小就敬畏雅威
  rationale: “敬畏”兼具畏惧与尊崇的宗教含义；“从小就”自然表达自幼延续至今。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以通行的汉语音译呈现四字神名，保留其作为专名的性质。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”较贴近学界通常重构的读音，并避免以称号替代专名。
- issue: רוּחַ יְהוָה 的所指
  choice: 雅威的灵
  alternative: 雅威的风
  rationale: 语境将行动归于神的主动能力，“灵”最为贴切；但原词确有“风”的词义，故不把另一可能从文本证据中抹去，而列于脚注。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。“我一……”“却……就……”使俄巴底所担心的连锁后果清晰自然；保留“你仆人”这一古代礼貌自称和“敬畏”这一核心宗教用语。
