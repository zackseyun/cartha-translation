  text: וַ/יֹּ֨אמֶר אֵלִיָּ֜הוּ לִ/נְבִיאֵ֣י הַ/בַּ֗עַל בַּחֲר֨וּ לָ/כֶ֜ם הַ/פָּ֤ר הָֽ/אֶחָד֙ וַ/עֲשׂ֣וּ רִאשֹׁנָ֔ה כִּ֥י אַתֶּ֖ם הָ/רַבִּ֑ים וְ/קִרְאוּ֙ בְּ/שֵׁ֣ם אֱלֹהֵי/כֶ֔ם וְ/אֵ֖שׁ לֹ֥א תָשִֽׂימוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/025.yaml
  text: Then Elijah said to the prophets of Baal[a], “Choose one bull for yourselves and prepare it first, because you are many; then call on the name of your god[b], but put no fire under it.”
translation:
  language: zh_hans
  text: 于是，以利亚对巴力的先知说：“你们为自己挑选一头公牛，先预备好，因为你们人多；然后求告你们神的名[a]，但不要放火[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “求告……的名”是希伯来语惯用说法，意思是向该神明呼求或恳求。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“不要放火”，没有明确说把火放在哪里；献祭的上下文表明，是不可用火点燃祭物。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 于是……说
  rationale: 连续式叙事动词推进事件；“于是”在现代汉语中自然表达先后关系。
- source_word: לִנְבִיאֵי הַבַּעַל
  choice: 对巴力的先知
  rationale: 按希伯来语属格结构直译，清楚表明这些先知隶属于巴力。
- source_word: בַּחֲרוּ לָכֶם הַפָּר הָאֶחָד
  choice: 你们为自己挑选一头公牛
  rationale: 上下文已有两头公牛，这里指从中选一头；保留 לָכֶם“为自己”的受益含义。
- source_word: וַעֲשׂוּ
  choice: 预备好
  rationale: עָשָׂה 在献祭语境中指把牲畜预备妥当；比笼统的“做”明确，又避免提前译成“献上”。
- source_word: רִאשֹׁנָה
  choice: 先
  rationale: 该形式在此作副词，表示行动次序。
- source_word: כִּי אַתֶּם הָרַבִּים
  choice: 因为你们人多
  rationale: 直接表达让巴力先知先行的理由，并自然传达其人数众多。
- source_word: וְקִרְאוּ בְּשֵׁם אֱלֹהֵיכֶם
  choice: 然后求告你们神的名
  rationale: קרא בשם 是向神明呼求、求告的惯用语；保留“名”以反映原文表达。上下文所指为单数的巴力，因此译作“神”而非“众神”。
- source_word: וְאֵשׁ לֹא תָשִׂימוּ
  choice: 但不要放火
  rationale: 原文直陈不可放置火，却未明说“在下面”；正文不补入方位信息，以保留原文措辞。
theological_decisions:
- issue: אֱלֹהֵיכֶם 指称巴力时在数上的理解
  choice: 你们神的名
  alternative: 你们众神的名
  rationale: אֱלֹהִים 的形式可呈复数，但本节对象明确是单数的巴力；采用单数可避免无根据地引入多个神明，同时不对巴力作真实性判断。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“预备好”符合献祭场景而不过度解释；“不要放火”保留原文未明说方位的特点，并以脚注交代语境含义。
