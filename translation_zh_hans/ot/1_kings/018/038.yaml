  text: וַ/תִּפֹּ֣ל אֵשׁ יְהוָ֗ה וַ/תֹּ֤אכַל אֶת הָֽ/עֹלָה֙ וְ/אֶת הָ֣/עֵצִ֔ים וְ/אֶת הָ/אֲבָנִ֖ים וְ/אֶת הֶ/עָפָ֑ר וְ/אֶת הַ/מַּ֥יִם אֲשֶׁר בַּ/תְּעָלָ֖ה לִחֵֽכָה־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/038.yaml
  text: Then the fire of Yahweh fell and consumed the burnt offering[a], the wood, the stones, the dust, and licked up the water that was in the trench.
translation:
  language: zh_hans
  text: 随后，雅威的火[a]降下，烧尽了燔祭、木柴、石头和尘土，又舔干了沟里的水。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“从雅威而来的火降下”。希伯来语可强调这火来自雅威。
    reason: 说明אֵשׁ יְהוָה既可表达所属关联，也可着重表达火的神圣来源。
lexical_decisions:
- source_word: אֵשׁ יְהוָה
  choice: 雅威的火
  rationale: 保留希伯来语中“火”与神名并列所表达的所属或关联关系，同时不排除火来自雅威这一含义。
- source_word: וַתִּפֹּל
  choice: 降下
  rationale: נפל本义为“落下”；用于从天而来的火时，“降下”在现代汉语中自然，也保留了从上而下的图景。
- source_word: וַתֹּאכַל
  choice: 烧尽了
  rationale: 该动词字面义为“吃”，但以火为主语时译作“烧尽”符合现代汉语习惯，并表达彻底吞噬之意。
- source_word: הָעֹלָה
  choice: 燔祭
  rationale: עלה在献祭语境中特指全部焚烧的祭，采用简明且通行的祭祀术语“燔祭”。
- source_word: הָעֵצִים
  choice: 木柴
  rationale: 指祭坛上摆放、用来焚烧祭物的木料；“木柴”比笼统的“木头”更贴合场景。
- source_word: הָאֲבָנִים
  choice: 石头
  rationale: 直接对应原词，并凸显火连祭坛石块也烧尽的非凡景象。
- source_word: הֶעָפָר
  choice: 尘土
  rationale: עפר可指尘埃或松土；“尘土”既准确，又保留叙事的鲜明画面。
- source_word: לִחֵכָה
  choice: 舔干了
  rationale: 保留לחך“舔”的拟人化意象，同时“干了”清楚表达沟里的水被完全除去。
- source_word: הַמַּיִם אֲשֶׁר בַּתְּעָלָה
  choice: 沟里的水
  rationale: תעלה指祭坛周围所挖的沟；简洁的“沟里的水”符合上下文和现代汉语表达。
- source_word: וַ
  choice: 随后
  rationale: 句首叙事连接词推进事件次序，“随后”比反复使用“于是”或“和”更自然。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名，音译“雅威”保留其作为以色列之神专名的性质，不以称号代替。
- issue: אֵשׁ יְהוָה所表达的关系
  choice: 雅威的火
  alternative: 从雅威那里降下的火
  rationale: 原文结构可以强调这火属于雅威或源自雅威；正文采用较贴近形式且保留张力的“雅威的火”，脚注列出来源性的译法。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“燔祭”保留必要的圣经祭祀术语；“舔干”保存原文生动意象。句式简洁，适合普通现代读者。
