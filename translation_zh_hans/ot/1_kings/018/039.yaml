  text: וַ/יַּרְא֙ כָּל הָ/עָ֔ם וַֽ/יִּפְּל֖וּ עַל פְּנֵי/הֶ֑ם וַ/יֹּ֣אמְר֔וּ יְהוָה֙ ה֣וּא הָ/אֱלֹהִ֔ים יְהוָ֖ה ה֥וּא הָ/אֱלֹהִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/039.yaml
  text: When all the people saw it[a], they fell on their faces and said, “Yahweh, he is God! Yahweh, he is God!”
translation:
  language: zh_hans
  text: 众民看见了，就俯伏在地，说：“雅威，他是上帝！雅威，他是上帝！”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּרְא כָּל הָעָם
  choice: 众民看见了
  rationale: וַיַּרְא意为“看见”，原文未明说宾语；中文用“看见了”既自然，也保留由上文补足所见之事的含蓄性。כָּל הָעָם简洁译为“众民”。
- source_word: וַיִּפְּלוּ עַל פְּנֵיהֶם
  choice: 就俯伏在地
  rationale: 这是表示敬畏、降服的具体身体动作。“俯伏在地”是现代中文圣经语体中自然而庄重的表达，也传达面朝下伏地的含义。
- source_word: וַיֹּאמְרוּ
  choice: 说
  rationale: 原词是普通的言说动词，并未明确表示呼喊或宣告，因此采用克制的“说”。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以音译呈现四字神名，保留其作为以色列之神专名的性质，不以称号替代。
- source_word: הוּא
  choice: 他是
  rationale: 保留原文显式人称代词所带的强调；中文采用“雅威，他是……”的复指结构。
- source_word: הָאֱלֹהִים
  choice: 上帝
  rationale: 定冠词在此语境中把雅威认定为与巴力相对的真神。现代中文以“上帝”作为专指表达即可自然传达这一含义，无须生硬译成“那位神”。
- source_word: יְהוָה הוּא הָאֱלֹהִים
  choice: 雅威，他是上帝！
  rationale: 保留原文的代词强调、认信语气和完整重复，不另加“唯有”或“才是”，以免把语境中的排他含义扩写进正文。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名，音译“雅威”可保留其专名性质；不以“主”这一称号取代，也不采用较晚形成的混合读音“耶和华”。
- issue: הָאֱלֹהִים的排他含义
  choice: 上帝
  alternative: 真神；才是上帝；唯有他是上帝
  rationale: 定冠词及与巴力对比的上下文具有排他指向，但原句没有“唯有”一词。正文采用自然的专指“上帝”，让排他性由上下文和重复强调表达，避免过度释义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“俯伏在地”保留敬畏动作；两次认信按原文完整重复，并以感叹号表现高潮语气。
