  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר אֵלִיָּ֤הוּ לְ/כָל הָ/עָם֙ גְּשׁ֣וּ אֵלַ֔/י וַ/יִּגְּשׁ֥וּ כָל הָ/עָ֖ם אֵלָ֑י/ו וַ/יְרַפֵּ֛א אֶת מִזְבַּ֥ח יְהוָ֖ה הֶ/הָרֽוּס־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/030.yaml
  text: Then Elijah said to all the people[a], “Come near to me.” So all the people came near to him, and he repaired the altar of Yahweh that had been torn down.
translation:
  language: zh_hans
  text: 于是，以利亚对众民说：“到我这里来。”众民就都到他那里。以利亚修复了那座被拆毁的雅威祭坛。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “修复”直译为“医治”，也可译作“恢复”。
    reason: 保留希伯来语רפא的字面意象及可接受的词义选择。
lexical_decisions:
- source_word: גְּשׁוּ
  choice: 到我这里来
  rationale: 该命令要求众人实际走近以利亚；此译法在现代汉语中自然，并保留朝说话者靠近的方向感。
- source_word: וַיִּגְּשׁוּ
  choice: 到他那里
  rationale: 与前面的命令相呼应，清楚表达众民照以利亚的话走近他。
- source_word: וַיְרַפֵּא
  choice: 修复
  rationale: רפא的基本义是“医治”，但以祭坛为宾语时，表示使受损之物恢复完好；“修复”在此最准确自然，同时以脚注保留原文意象。
- source_word: מִזְבַּח יְהוָה
  choice: 雅威祭坛
  rationale: 自然表达祭坛属于并用于敬拜雅威的属格关系，也保留神的专名。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以常见的现代汉语音译直接呈现四字神名，而不以称号替代。
- source_word: הֶהָרוּס
  choice: 被拆毁的
  rationale: 该被动分词表示祭坛已经遭到拆除或破坏；“被拆毁”具体呈现先前发生的毁坏。
- source_word: וַיֹּאמֶר
  choice: 于是……说
  rationale: 以“于是”体现叙事推进，在现代汉语中流畅自然。
- source_word: כָל הָעָם
  choice: 众民／众民都
  rationale: 用简洁庄重的集体称谓表达“全体百姓”；第二处以“都”明确保留כָל的全体意义。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华／上主
  rationale: 原文直接使用四字神名；音译“雅威”保留其专名性质，避免以称号替代。
- issue: וַיְרַפֵּא用于祭坛时的意象
  choice: 正文译“修复”，脚注说明字面为“医治”
  alternative: 恢复／医治
  rationale: “修复”准确表达语境中的实际行动，而脚注保留希伯来语把祭坛拟作可被“医治”之物的鲜明意象。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言；重复“到我这里来／到他那里”以呈现命令与回应之间的对应。
