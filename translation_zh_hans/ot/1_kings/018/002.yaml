  text: So Elijah went to show himself to Ahab[b][a]. Now the famine was severe in Samaria.
translation:
  language: zh_hans
  text: 于是，以利亚去见亚哈[a]。当时，撒马利亚的饥荒十分严重[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“向亚哈现身”，或“到亚哈面前现身”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“撒马利亚的饥荒极其严峻”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: 于是……去
  rationale: 连续式叙事动词承接上一节并推进事件；“于是”自然表达顺承，也可含前因后果的意味。
- source_word: אֵלִיָּהוּ
  choice: 以利亚
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: לְהֵרָאוֹת אֶל אַחְאָב
  choice: 去见亚哈
  rationale: ראה 的尼法勒不定式在此指向亚哈显现、让亚哈见到自己；“去见亚哈”符合现代汉语表达，同时脚注保留“向亚哈现身／到亚哈面前”的较形式对应译法。
- source_word: וְהָרָעָב
  choice: 当时……饥荒
  rationale: 前缀 ו 在这里引出背景性、伴随性说明，并非单纯推进下一动作；“当时”清楚呈现这一语篇关系。
- source_word: חָזָק
  choice: 十分严重
  rationale: חָזָק 本义涉及强烈、有力；修饰饥荒时表示程度很重，现代汉语自然说“十分严重”。
- source_word: בְּשֹׁמְרוֹן
  choice: 撒马利亚的
  rationale: 介词 בְּ 表示地点。属格式“撒马利亚的饥荒”自然表达发生于该地，又不武断限定这里专指城还是较广地区。
