  text: וַ֠/יִּקְחוּ אֶת הַ/פָּ֨ר אֲשֶׁר נָתַ֣ן לָ/הֶם֮ וַֽ/יַּעֲשׂוּ֒ וַ/יִּקְרְא֣וּ בְ/שֵׁם הַ֠/בַּעַל מֵ/הַ/בֹּ֨קֶר וְ/עַד הַ/צָּהֳרַ֤יִם לֵ/אמֹר֙ הַ/בַּ֣עַל עֲנֵ֔/נוּ וְ/אֵ֥ין ק֖וֹל וְ/אֵ֣ין עֹנֶ֑ה וַֽ/יְפַסְּח֔וּ עַל הַ/מִּזְבֵּ֖חַ אֲשֶׁ֥ר עָשָֽׂה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/026.yaml
  text: So they took the bull that had been given to them[a], prepared it, and called on the name of Baal from morning until noon, saying, “O Baal, answer us!” But there was no voice, and no one answered. And they limped around the altar that had been made.
translation:
  language: zh_hans
  text: 他们便取了交给他们的那头公牛，把它预备妥当；从早晨直到正午，不断求告巴力的名，说：“巴力啊，求你回应我们！”可是没有声音，也没有谁回应。他们就在所筑的祭坛旁一瘸一跳[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“在祭坛旁蹦跳”或“在祭坛旁跳舞”。这里的希伯来语动词可能指跛行或跳跃式的仪式动作，并可能有意呼应本章21节使用的同根词。
    reason: 保留罕见动词的词义范围及其可能的文学呼应。
lexical_decisions:
- source_word: וַיִּקְחוּ אֶת הַפָּר אֲשֶׁר נָתַן לָהֶם
  choice: 他们就牵来那头给他们的公牛
  rationale: לקח在叙事中表示“取来、带来”；对于公牛，用“牵来”符合现代汉语习惯。关系从句保留“给他们”的含义，但不强行补出施予者。
- source_word: וַיַּעֲשׂוּ
  choice: 预备妥当
  rationale: 此处在献祭语境中是省略式表达，指把公牛预备好；不译作“献上”，以免超前表达尚未发生的焚烧。
- source_word: וַיִּקְרְאוּ בְשֵׁם הַבַּעַל
  choice: 求告巴力的名
  rationale: 保留קרא בשם这一敬拜、祈求语境中的固定表达，也不因叙事对巴力的否定而弱化原句的宗教性措辞。
- source_word: מֵהַבֹּקֶר וְעַד הַצָּהֳרַיִם
  choice: 从早晨直到正午
  rationale: 直接、自然地表达原文的时间跨度。
- source_word: הַבַּעַל עֲנֵנוּ
  choice: 巴力啊，求你应允我们
  rationale: “应允”符合祈求神明回应的语境，并清楚传达呼格和复数受词。
- source_word: וְאֵין קוֹל וְאֵין עֹנֶה
  choice: 可是没有声音，也没有谁回应
  rationale: 保留原文两重否定的递进：既无任何声音，也没有回应者。
- source_word: וַיְפַסְּחוּ
  choice: 一瘸一跳
  rationale: פסח在这里可能描写跛行、跳跃式的仪式动作；“一瘸一跳”保留其不寻常的动作感，也能与本章21节同根词的文学呼应相连。
- source_word: עַל הַמִּזְבֵּחַ
  choice: 绕着……祭坛
  rationale: 介词עַל本义范围较广；结合此处仪式性移动，译为“绕着”比理解为跳到坛面上更合语境。
- source_word: אֲשֶׁר עָשָׂה
  choice: 所筑的
  rationale: 原文动词为阳性单数，却没有明说主语；汉语无主被动式“所筑的”避免擅自认定是谁筑坛，同时保留祭坛已经筑成的含义。
theological_decisions:
- issue: 对巴力祈求用语的处理
  choice: 求告巴力的名
  alternative: 呼求巴力；奉巴力的名呼喊
  rationale: 该译法保留圣经中“求告……的名”这一宗教性表达，但并不暗示巴力真实或有能力；其无能由下文的沉默自然显明。
- issue: וַיְפַסְּחוּ的仪式动作及文学呼应
  choice: 一瘸一跳
  alternative: 跳舞；蹦跳；跛行
  rationale: 不将有意含混且可能带讽刺意味的动词平化为普通“跳舞”，并尽量保留它与18:21同根词之间的联系。
- issue: 筑坛者身份
  choice: 所筑的祭坛
  alternative: 他所筑的祭坛；他们所筑的祭坛
  rationale: 马所拉文本使用单数动词，却未明确指出主语。采用不明示施事者的汉语结构，避免在先知群体、某一人或其他所指之间作无根据的神学或叙事裁定。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。“不断”体现从早晨到正午持续呼求的动作；“可是”凸显长时间祈求与全无回应之间的反差。脚注标记紧跟存在词义歧义的“一瘸一跳”，而非置于无关短语之后。
