revisions:
- from: 他们就牵来那头给他们的公牛，预备妥当；从早晨直到正午，他们不断求告巴力的名，说：“巴力啊，求你应允我们！”可是没有声音，也没有谁回应。他们又绕着所筑的祭坛一瘸一跳[a]。
  to: 他们便取了交给他们的那头公牛，把它预备妥当；从早晨直到正午，不断求告巴力的名，说：“巴力啊，求你回应我们！”可是没有声音，也没有谁回应。他们就在所筑的祭坛旁一瘸一跳[a]。
  rationale: 修订限于两处较明确的语义和表达问题：以“取了”对应普通叙事动词，以“回应我们”对应祈求中的“回答”。末句调整语序与介词表达，使汉语更自然，同时不把动作定死为单纯跳舞或仅为跛行；脚注也相应采用“在祭坛旁”，以避免将 עַל 的空间关系过度限定为环绕运动。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T05:51:07Z'
