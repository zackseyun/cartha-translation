  naturalness: 修订后“取了交给他们的那头公牛，把它预备妥当”更顺畅，动作衔接也更清楚。“他们就在所筑的祭坛旁一瘸一跳”避免“绕着……一瘸一跳”可能产生的轻微歧义，并维持现代庄重叙事语体。
  terminology: “求告巴力的名”恰当地保留原文的求告用语；“祭坛”“巴力”“正午”等术语均合适。“所筑的”不擅自补出 עָשָׂה 的未明施事者，安全保留原文在此的指涉问题。
