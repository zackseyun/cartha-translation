base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/041.yaml
  text: And Elijah said to Ahab[a], “Go up, eat and drink, for there is the sound of the abundance of rain.”
translation:
  language: zh_hans
  text: 以利亚对亚哈说：“你上去，吃喝吧，因为有暴雨的轰鸣声[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “暴雨的轰鸣声”或译“丰沛雨水的声音”。希伯来语短语可指雨的喧响、轰鸣，也可强调雨量的丰沛；原文未明确说明这是已经听见的声音，还是对将临之雨的宣告。
    reason: 说明 הֲמוֹן 可含“喧响、轰鸣”及“众多、丰沛”之意，并保留原文对声音性质与时态的未定性。
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלִיָּהוּ לְאַחְאָב
  choice: 以利亚对亚哈说
  rationale: 按希伯来叙事语序自然表达；וַיֹּאמֶר 推进叙事，在中文中无需机械译出连接词“于是”。人名采用现代中文圣经通行译名。
- source_word: עֲלֵה
  choice: 上去
  rationale: 保留 עלה 的空间方向义；上下文中亚哈要从基顺河谷一带上去。
- source_word: אֱכֹל וּשְׁתֵה
  choice: 吃喝吧
  rationale: 准确传达两个命令式，同时用“吧”使以利亚对王所说的话符合自然、庄重的现代汉语。
- source_word: כִּי
  choice: 因为
  rationale: 引出前述命令的理由，关系明确而自然。
- source_word: קוֹל הֲמוֹן הַגָּשֶׁם
  choice: 有大雨轰鸣的声音了
  rationale: קוֹל 是“声音”，הֲמוֹן 可指喧响、轰鸣，也可表达众多或丰盛；此译保留短语鲜明的听觉意象，并以“大雨”传达雨势之盛。“了”自然表示所宣告的雨声已经出现或将临近。
theological_decisions:
- issue: 以利亚所说的雨声是实际听见还是先知性的宣告
  choice: 不增添“我听见”或“将要”
  alternative: 译作“我听见大雨将至的声音”
  rationale: 原文只说“有……的声音”，没有明确交代感知者，也没有明说时间关系；正文保留这种张力，不替读者判定是实际听觉还是先知性的确信。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“吃喝吧”简洁口语化但不随便；“大雨轰鸣的声音”保留原文紧凑而生动的听觉表达。脚注标记紧随所注释的短语。
