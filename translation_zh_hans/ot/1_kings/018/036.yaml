source:
  edition: WLC
  text: וַ/יְהִ֣י בַּ/עֲל֣וֹת הַ/מִּנְחָ֗ה וַ/יִּגַּ֞שׁ אֵלִיָּ֣הוּ הַ/נָּבִיא֮ וַ/יֹּאמַר֒ יְהוָ֗ה אֱלֹהֵי֙ אַבְרָהָם֙ יִצְחָ֣ק וְ/יִשְׂרָאֵ֔ל הַ/יּ֣וֹם יִוָּדַ֗ע כִּֽי אַתָּ֧ה אֱלֹהִ֛ים בְּ/יִשְׂרָאֵ֖ל וַ/אֲנִ֣י עַבְדֶּ֑/ךָ ו/ב/דברי/ך עָשִׂ֔יתִי אֵ֥ת כָּל הַ/דְּבָרִ֖ים הָ/אֵֽלֶּה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/036.yaml
  text: And it happened[a], at the offering up of the grain offering, that Elijah the prophet came near and said, “O Yahweh, God of Abraham, Isaac, and Israel, let it be known today that you are God in Israel, and that I am your servant[b], and that by your word I have done all these things.”
translation:
  language: zh_hans
  text: 到了献上素祭的时候，先知以利亚走上前来，说：“耶和华，亚伯拉罕、以撒和以色列[a]的上帝啊，愿今天显明：你是以色列中的上帝，我是你的仆人，并且我照你的话[b]做了这一切事。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文作“以色列”；较常见的列祖称谓常用“雅各”，但本节明确写的是“以色列”。
    reason: alternative_reading
  - marker: b
    text: 或译“按你的话”或“奉你的话”。
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּעֲלוֹת הַמִּנְחָה
  choice: 到了献上素祭的时候
  rationale: עֲלוֹת在这里指把祭物献上；מִנְחָה具体指素祭。译文保留其祭祀含义，又采用自然的现代汉语时间表达。
- source_word: וַיִּגַּשׁ
  choice: 走上前来
  rationale: נגשׁ表示靠近、上前；“走上前来”既呈现实际动作，也符合此处庄重场景。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 直接译出四字神名，而不以“主”等称号替代；“耶和华”是现代中文读者熟悉的专名形式。
- source_word: אֱלֹהֵי אַבְרָהָם יִצְחָק וְיִשְׂרָאֵל
  choice: 亚伯拉罕、以撒和以色列的上帝
  rationale: 原文明确写“以色列”，不是较常见公式中的“雅各”，因此不作协调性改写。
- source_word: הַיּוֹם יִוָּדַע
  choice: 愿人今天知道
  rationale: ידע的尼法勒未完成式在祷告中有祈愿语气；以“愿人……知道”自然表达其不定施事的被动含义和祈求意味。
- source_word: אֱלֹהִים בְּיִשְׂרָאֵל
  choice: 以色列中的上帝
  rationale: 介词ב按其直接意义译作“在……中”，不额外限定为“统治以色列”或其他解释。
- source_word: עַבְדֶּךָ
  choice: 你的仆人
  rationale: עבד可指奴仆或臣仆；在先知受差遣服事上帝的语境中，“仆人”最自然恰当。
- source_word: וּבִדְבָרֶךָ
  choice: 照你的话
  rationale: 介词ב与דבר连用可表达依据或凭借；“照你的话”保留“按照你的话／奉你的话而行”的含义，不把דבר收窄为“命令”。
- source_word: עָשִׂיתִי אֵת כָּל הַדְּבָרִים הָאֵלֶּה
  choice: 我做了这一切事
  rationale: דברים在这里指事情或行动，而非言语；汉语用“这一切事”简明自然。
theological_decisions:
- issue: 四字神名יהוה的译法
  choice: 耶和华
  alternative: 主
  rationale: 原文使用上帝的专名，正文保留专名，不以称号取代。
- issue: 列祖称谓使用“以色列”而非“雅各”
  choice: 亚伯拉罕、以撒和以色列的上帝
  alternative: 亚伯拉罕、以撒和雅各的上帝
  rationale: 忠实保留本节的实际措辞，不按更熟悉的列祖公式进行协调。
- issue: “照你的话”中介词ב的关系
  choice: 照你的话
  alternative: 借着你的话／奉你的命令
  rationale: 原文可表示依据，也带有凭上帝之言行事的意味；正文采用自然且不过度解释的译法，并以脚注保留其他可能表达。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语言。“上帝啊”保留呼告语气；“走上前来”具体呈现动作；全句尽量依照希伯来文的并列推进，同时以现代汉语自然连接。
