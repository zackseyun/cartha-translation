revisions:
- from: 到了献上素祭的时候，先知以利亚走上前来，说：“耶和华，亚伯拉罕、以撒和以色列[a]的上帝啊，愿人今天知道你是以色列中的上帝，也知道我是你的仆人，并且我是照你的话[b]做了这一切事。”
  to: 到了献上素祭的时候，先知以利亚走上前来，说：“耶和华，亚伯拉罕、以撒和以色列[a]的上帝啊，愿今天显明：你是以色列中的上帝，我是你的仆人，并且我照你的话[b]做了这一切事。”
  rationale: 修订仅改善两处汉语表达：以“愿今天显明”对应祷告中的被动祈愿，避免无必要地补出“人”；并删去末一分句重复的“是”。其余措辞及脚注均忠实反映希伯来文本与英文审计记录，故予以保留。
