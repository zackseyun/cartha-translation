revisions:
- from: 耶和华的手加在以利亚身上[a]。以利亚束起腰间的衣服[b]，跑在亚哈前面，一直跑到耶斯列入口处。
  to: 耶和华的手临到以利亚[a]；他束起腰间的衣服[b]，跑在亚哈前面，直到耶斯列的入口处。
  rationale: 将“加在……身上”改为“临到”，使神圣能力的习语在现代标准汉语中更自然，同时不将其解释为特定类型的超自然体力或先知性催促。调整脚注b，以准确说明“束腰”所涉及的是收拢衣服的文化动作。其余内容忠实保留原文的空间关系和终点的“入口/接近处”含义。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T05:51:08Z'
