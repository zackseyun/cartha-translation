base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/046.yaml
  text: And the hand of Yahweh was on Elijah[b][a], and he tucked up his loins and ran ahead of Ahab as far as the entrance to Jezreel.
translation:
  language: zh_hans
  text: 耶和华的手临到以利亚[a]；他束起腰间的衣服[b]，跑在亚哈前面，直到耶斯列的入口处。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译可作“耶和华的手在以利亚身上”或“向以利亚”。这是表示耶和华施行能力或影响的习语；原文没有具体说明其方式。
    reason: lexical_alternative
  - marker: b
    text: 原文直译“束起他的腰”；指把长衣收拢并束在腰间，以便奔跑。
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的神名译法，明确保留原文中的专名，不以“主”取代。
- source_word: וְיָד יְהוָה הָיְתָה אֶל
  choice: 耶和华的手加在……身上
  rationale: 保留“手”的希伯来语意象及神主动施力的含义，又不进一步断定这是超自然体力、先知感动，还是二者兼有。
- source_word: וַיְשַׁנֵּס מָתְנָיו
  choice: 束起腰间的衣服
  rationale: 原文直译近于“束起腰部”；按当时服饰习惯，这是把长衣束起以便奔跑。正文明确实际动作，脚注保留字面表达。
- source_word: וַיָּרָץ לִפְנֵי
  choice: 跑在……前面
  rationale: 自然地表达空间上的“在前面奔跑”，不额外断定以利亚是在履行礼仪性或侍从性的领跑职分。
- source_word: עַד בֹּאֲכָה יִזְרְעֶאלָה
  choice: 一直跑到耶斯列入口处
  rationale: 该结构表示抵达或接近某地的界点；“入口处”保留其空间含义，同时不把原文未明说的地点具体化为城门。
- source_word: יִזְרְעֶאל
  choice: 耶斯列
  rationale: 采用该希伯来地名通行的现代中文音译。
theological_decisions:
- issue: 以利亚所得能力的性质
  choice: 以“耶和华的手加在以利亚身上”表达神的作用，但不说明其具体方式
  alternative: 直译为神奇地赐给以利亚超人的奔跑速度，或专指先知受感
  rationale: 原文习语清楚表明神的主动作用，却没有界定这是身体力量、先知性的催促，还是二者兼有；译文保留这种张力。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“加在……身上”保留原文意象；“束起腰间的衣服”让普通读者无需熟悉古代服饰习语也能理解动作。句末重复“跑”以清楚连接奔跑的终点，符合现代汉语叙事节奏。
