  text: So Obadiah went to meet Ahab and told him[a], and Ahab went to meet Elijah.
translation:
  language: zh_hans
  text: 于是，俄巴底去见亚哈，向他报告[a]；亚哈就去见以利亚。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“告诉了他。”这个希伯来语动词可表示“告诉、报告、告知”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: 去
  rationale: 希伯来语叙事形式在此推进情节，基本义为“去”；中文用“去”自然简洁，不增添原文没有的语气。
- source_word: עֹבַדְיָהוּ
  choice: 俄巴底
  rationale: 依照现代中文圣经中通行的人名音译。
- source_word: לִקְרַאת
  choice: 迎见
  rationale: 该结构表示朝某人而去、与其会面。“迎见”既保留主动前往相见的方向感，又符合庄重而易懂的叙事语体。
- source_word: אַחְאָב
  choice: 亚哈
  rationale: 依照现代中文圣经中通行的人名音译。
- source_word: וַיַּגֶּד לוֹ
  choice: 把这事告诉了他
  rationale: נגד的使役形可表示“告诉、报告、告知”。原文未明说所告内容，中文以“这事”承接上文而不具体补写细节，并保持自然表达。
- source_word: וַיֵּלֶךְ אַחְאָב
  choice: 亚哈便去
  rationale: 重复的叙事形式表示随后发生的动作；“便”自然呈现事件顺序，同时不赋予额外因果含义。
- source_word: אֵלִיָּהוּ
  choice: 以利亚
  rationale: 依照现代中文圣经中通行的人名音译。
