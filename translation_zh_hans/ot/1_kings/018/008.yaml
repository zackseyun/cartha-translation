  text: וַ/יֹּ֥אמֶר ל֖/וֹ אָ֑נִי לֵ֛ךְ אֱמֹ֥ר לַ/אדֹנֶ֖י/ךָ הִנֵּ֥ה אֵלִיָּֽהוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/008.yaml
  text: And he said to him[a], “I am he. Go, say to your master, ‘Look, Elijah is here.’”
translation:
  language: zh_hans
  text: 以利亚对他说：“是我。你去告诉你的主人：‘看，以利亚在这里。’”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר לוֹ
  choice: 以利亚对他说
  rationale: 希伯来语直译为“他对他说”；根据紧接上文的明确说话者，以“以利亚”代替代词，使独立经节在现代汉语中清楚自然，不改变指称。
- source_word: אָנִי
  choice: 是我
  rationale: 独立人称代词在此用于强调身份确认；“是我”简洁自然，并保留原文省略谓语的自我辨认功能。
- source_word: לֵךְ אֱמֹר
  choice: 你去告诉
  rationale: 两个阳性单数命令式构成连续指令；汉语“去告诉”自然表达“去，说给……听”的意思。加入“你”可明确命令对象。
- source_word: לַאדֹנֶיךָ
  choice: 你的主人
  rationale: אָדוֹן在此指俄巴底的世俗上级亚哈，不是对上帝的称号；“主人”符合其臣仆关系，也避免与神圣称号混淆。
- source_word: הִנֵּה
  choice: 看
  rationale: 该指示词引人注意随后宣告的事实；“看”保留其提示力度，又比古雅表达更符合现代汉语。
- source_word: אֵלִיָּהוּ
  choice: 以利亚
  rationale: 采用该人物姓名在中文圣经传统中通行而易识别的音译。
theological_decisions:
- issue: אָדוֹן指人的权威称谓
  choice: 主人
  alternative: 主
  rationale: 上下文所指是亚哈作为俄巴底的世俗上级；译作“主人”既准确表达社会关系，也避免使读者误以为这是对上帝的称呼。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。直接引语层次清楚；“是我”保留希伯来语强调代词所表达的身份确认。
