base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/001.yaml
  text: And it happened after many days that the word of Yahweh came to Elijah in the third year[a], saying, “Go, show yourself to Ahab, and I will give rain upon the face of the land.”
translation:
  language: zh_hans
  text: 过了许多日子，到了第三年，雅威的话临到以利亚，说：“去，向亚哈现身；我要把雨赐在这地上[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我要使雨降在这地上。”希伯来文直译为“我要把雨赐在地面上”。
    reason: 说明较自然的替代译法，并保留原文“赐”和“地面”这一字面表达。
lexical_decisions:
- source_word: וַיְהִי יָמִים רַבִּים
  choice: 过了许多日子
  rationale: 保留希伯来叙事推进和“许多日子”的时间表达，同时符合现代汉语习惯。
- source_word: וּדְבַר יְהוָה הָיָה אֶל
  choice: 雅威的话临到
  rationale: 这是先知叙事中常见的启示公式；“临到”既贴近原文，也符合庄重而易懂的现代中文表达。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以音译呈现四字神名，而不以称号替代，反映原文使用的是专名。
- source_word: בַּשָּׁנָה הַשְּׁלִישִׁית
  choice: 到了第三年
  rationale: 准确保留原文的时间定位，不额外判定第三年从哪一事件起算。
- source_word: הֵרָאֵה אֶל אַחְאָב
  choice: 让亚哈见到你
  rationale: 该尼法勒命令式字面含义是“使自己被看见”；此译自然表达以利亚须公开现身于亚哈面前。
- source_word: וְאֶתְּנָה מָטָר
  choice: 我要把雨赐给
  rationale: 保留 נתן“给、赐”的基本意义，并以“赐”体现雨水作为雅威所给予之物；不把它仅处理为一般气象动作。
- source_word: עַל פְּנֵי הָאֲדָמָה
  choice: 这地
  rationale: 在旱灾语境中指当地土地；正文采用自然简洁的中文，字面意象则在脚注中说明。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名，因此正文采用现代汉语常见的音译“雅威”，避免以称号“主”替代专名。
- issue: 雨水作为神所“赐”的礼物
  choice: 我要把雨赐给这地
  alternative: 我要使雨降在这地上
  rationale: 原文动词 נתן 是“给、赐”，正文保留其施予意味，同时不超出经文本身作进一步神学发挥。
translation_notes:
  register: 采用现代、庄重、易懂的叙事语言。“过了许多日子”保持经文节奏；“让亚哈见到你”比“向亚哈显现”更能避免现代读者误解为超自然显现。脚注标记放在其实际说明的降雨短语之后。
