  yaml_path: translation/ot/1_kings/018/006.yaml
  text: 'So they divided the land between themselves to pass through it: Ahab went one way by himself[a], and Obadiah went another way by himself.'
translation:
  language: zh_hans
  text: 于是，他们把那地分开，以便穿行其中。亚哈独自走一条路，俄巴底也独自走另一条路。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来原文两次都说“一条路”，直译为：“亚哈独自走一条路，俄巴底也独自走一条路。”这里译作“一条路……另一条路”，以自然中文表达二人分头走不同路线的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחַלְּקוּ לָהֶם אֶת־הָאָרֶץ
  choice: 他们把那地划分开
  rationale: פיעל式 וַיְחַלְּקוּ 表示主动划分；לָהֶם 在此语境中表示二人之间的分配。“把那地划分开”自然表达他们分区行动的意思。
- source_word: לַעֲבָר בָּהּ
  choice: 各自走遍一部分
  rationale: עבר ב 表示从某区域经过、穿行。结合前面的分区，以“各自走遍一部分”表达二人分别穿行所分区域的语境含义，同时不额外加入搜寻等原文未明说的目的。
- source_word: הָלַךְ
  choice: 走
  rationale: הלך 可指行走或前往；在路线叙述中，“走”简洁自然，也不必限定具体交通方式。
- source_word: בְּדֶרֶךְ אֶחָד
  choice: 一条路／另一条路
  rationale: 原文在两小句中都用“一条路”，形成分配式对照。中文以“一条路……另一条路”自然显明二人走不同路线；脚注保留原文重复形式。
- source_word: לְבַדּוֹ
  choice: 独自
  rationale: 准确表达“单独、自己一人”的意义，并保留两人分头行动的强调。
- source_word: עֹבַדְיָהוּ
  choice: 俄巴底
  rationale: 采用现代中文圣经人名的通行译名。
