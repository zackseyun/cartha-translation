  text: וַ/יְהִ֨י בַֽ/צָּהֳרַ֜יִם וַ/יְהַתֵּ֧ל בָּ/הֶ֣ם אֵלִיָּ֗הוּ וַ/יֹּ֨אמֶר֙ קִרְא֤וּ בְ/קוֹל גָּדוֹל֙ כִּֽי אֱלֹהִ֣ים ה֔וּא כִּ֣י שִׂ֧יחַ וְ/כִֽי שִׂ֛יג ל֖/וֹ וְ/כִֽי דֶ֣רֶךְ ל֑/וֹ אוּלַ֛י יָשֵׁ֥ן ה֖וּא וְ/יִקָֽץ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/027.yaml
  text: And it happened at noon that Elijah mocked them and said[a], “Cry out with a loud voice, for he is a god. For he is musing, or he has gone aside, or he is on a journey. Perhaps he is sleeping and will awake.”
translation:
  language: zh_hans
  text: 到了中午，以利亚嘲弄他们，说：“大声呼喊吧！因为他是神。他或许正在沉思，或是走开了[a]，或是在外出旅行；也许他睡着了，会醒来。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或作“去解手了”。这里的希伯来语可能是委婉说法。
    reason: 说明罕见短语 שִׂיג לוֹ 的可能具体含义，同时保留正文的含蓄表达。
lexical_decisions:
- source_word: וַיְהִי בַצָּהֳרַיִם
  choice: 到了中午
  rationale: 自然表达希伯来叙事推进及时间背景，避免生硬地译作“事情发生在中午”。
- source_word: וַיְהַתֵּל בָּהֶם
  choice: 嘲弄他们
  rationale: 准确传达该动词所含的讥讽和戏弄语气，并保持庄重简洁。
- source_word: קִרְאוּ בְקוֹל גָּדוֹל
  choice: 大声呼喊吧
  rationale: 保留命令语气及“用大声音”的具体含义，同时符合现代汉语习惯。
- source_word: כִּי אֱלֹהִים הוּא
  choice: 因为他是神
  rationale: 这里的 אֱלֹהִים 指巴力这一神祇，处于以利亚的讽刺话语中；现代汉语“神”无需冠词，语境足以避免将其等同于以色列的上帝。
- source_word: שִׂיחַ
  choice: 他正在沉思
  rationale: 该词可能表示沉思或专注思索；译文保留这种相对宽泛的含义和反讽效果。
- source_word: שִׂיג לוֹ
  choice: 走开了
  rationale: 原文罕见且委婉，可能暗指去解手；正文维持含蓄表达，较明确的可能含义置于脚注。
- source_word: דֶרֶךְ לוֹ
  choice: 出门远行了
  rationale: 传达“有路程在身、外出旅行”的惯用意义，现代汉语自然明白。
- source_word: אוּלַי יָשֵׁן הוּא וְיִקָץ
  choice: 也许他正在睡觉，等会儿就会醒来
  rationale: 将 וְיִקָץ 按不及物的“醒来”处理，不增译为“必须叫醒”；“等会儿”使其与前句的睡眠状态在汉语中衔接自然。
theological_decisions:
- issue: אֱלֹהִים 用于巴力时的译法
  choice: 神
  alternative: 上帝；一位神
  rationale: 以利亚是在讥讽巴力的先知，并非承认巴力就是以色列的上帝。汉语以“神”指称一位异教神祇最自然，也保留讽刺语气。
- issue: 委婉语 שִׂיג לוֹ 的处理
  choice: 正文译作“走开了”，脚注说明可能意指“去解手”
  alternative: 正文直接译作“去解手了”
  rationale: 希伯来语本身表达间接，正文保留其委婉和不确定性，脚注则交代广泛认可的可能解释，避免把推断当作唯一明说的含义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。以利亚的话保留明显的讽刺层递；不用古奥的“高声求告”或过于口语化的措辞。脚注标记[a]已置于对应短语之后。
