  yaml_path: translation/ot/1_kings/018/011.yaml
  text: And now you are saying, ‘Go, say to your lord, “Look, Elijah is here.”’
translation:
  language: zh_hans
  text: 现在你却说：‘去告诉你的主人：“看，以利亚在这里。”’
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַתָּה
  choice: 现在却
  rationale: וְעַתָּה 表示“而现在”；结合俄巴底亚对以利亚命令的抗辩语境，用“现在却”自然表达转折。
- source_word: לַאדֹנֶיךָ
  choice: 你的主人
  rationale: אָדוֹן 在此指俄巴底亚所服侍的亚哈，而非神；译作“主人”既准确又避免与神圣称谓混淆。
- source_word: הִנֵּה
  choice: 看
  rationale: 保留 הִנֵּה 引人注意的现场指示语气；现代汉语中“看”比“看哪”更自然。
- source_word: אֵלִיָּהוּ
  choice: 以利亚
  rationale: 采用该先知姓名的通行中文译名。
