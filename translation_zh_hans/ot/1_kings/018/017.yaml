base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/017.yaml
  text: And when Ahab saw Elijah[a], Ahab said to him, “Is that you, troubler of Israel?”
translation:
  language: zh_hans
  text: 当亚哈看见以利亚时，亚哈对他说：“你就是那个使以色列遭殃的人吗？”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “使以色列遭殃的人”或译“扰乱以色列的人”，或“给以色列带来灾祸的人”。
    reason: עֹכֵר可指使人陷入祸患、灾难或困境者；这些译法分别反映其语义范围的不同侧面。
lexical_decisions:
- source_word: וַיְהִי כִּרְאוֹת
  choice: 一看见
  rationale: 这里的叙事结构以כ加不定式表达时间关系；“一看见”自然、简洁，也贴合随后立刻发问的情境。
- source_word: אֵלִיָּהוּ
  choice: 以利亚
  rationale: 采用现代中文圣经读者熟悉的标准人名译法。
- source_word: וַיֹּאמֶר אַחְאָב אֵלָיו
  choice: 就对他说
  rationale: 准确表达叙事中的说话动作及其对象；上下文已点明亚哈，无须在中文中重复姓名。
- source_word: הַאַתָּה זֶה
  choice: 你就是那个……的人吗
  rationale: 疑问词、独立代词和指示词共同形成带有针对性和责问意味的问句；这一表达在现代中文中自然地保留其强调语气。
- source_word: עֹכֵר יִשְׂרָאֵל
  choice: 使以色列遭殃的人
  rationale: עכר表示使人陷入祸患、灾难或混乱。“使……遭殃”既保留亚哈指控以利亚招致国难的力度，也不把这项指控当作叙述者认可的事实。
theological_decisions:
- issue: 亚哈指控的语气与叙述立场
  choice: 以直接问责的方式译作“你就是那个使以色列遭殃的人吗？”
  alternative: “你就是扰乱以色列的人吗？”或“你就是给以色列带来灾祸的人吗？”
  rationale: 原文呈现亚哈把以色列的困境归咎于以利亚。译文保留这项尖锐指控，但不替亚哈确认其判断，也不预先化解下一节将显明的神学张力。
translation_notes:
  register: 采用现代、庄重而口语自然的叙事表达。“遭殃”通俗易懂，同时具有足够的指控力度；问句保留亚哈当面责难以利亚的语气。
