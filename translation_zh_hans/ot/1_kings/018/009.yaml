  text: וַ/יֹּ֖אמֶר מֶ֣ה חָטָ֑אתִי כִּֽי אַתָּ֞ה נֹתֵ֧ן אֶֽת עַבְדְּ/ךָ֛ בְּ/יַד אַחְאָ֖ב לַ/הֲמִיתֵֽ/נִי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/009.yaml
  text: And he said[a], “What have I sinned, that you are giving your servant into Ahab’s hand to put me to death?”
translation:
  language: zh_hans
  text: 他说：“我犯了什么罪，你竟要把你仆人交在亚哈手里，让亚哈杀死我吗？”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 他说
  rationale: 希伯来叙事中的常见承接形式；中文用“他说”自然引出俄巴底的回答，无须机械译出连接词。
- source_word: מֶה חָטָאתִי
  choice: 我犯了什么罪
  rationale: 保留 חטא 的道德和宗教意味，也符合现代汉语质问句的自然表达。
- source_word: כִּי אַתָּה נֹתֵן
  choice: 你竟要把
  rationale: 分词在直接引语中表达眼前或即将发生之事；“竟要”传达说话者惊惧而不解的责问，同时体现显式代词 אַתָּה 的强调。
- source_word: עַבְדְּךָ
  choice: 你仆人
  rationale: 这是对上位者自称的谦敬用语；译作“仆人”比“奴隶”更符合本处语境。
- source_word: בְּיַד אַחְאָב
  choice: 交在亚哈手里
  rationale: 保留“在……手里”这一表示落入权势或控制之下的希伯来意象，中文也清楚自然。
- source_word: לַהֲמִיתֵנִי
  choice: 使他杀死我
  rationale: מות 的使役式字面为“使我死”；在本句中主语意指亚哈，译为“使他杀死我”既交代关系，也保留致死意图。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而口语可懂的直接引语。“我犯了什么罪”保留原文的道德力度；“你竟要”自然呈现俄巴底的震惊和责问。原文无需要另列的实质歧义，因此不设脚注。
