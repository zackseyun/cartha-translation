base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/037.yaml
  text: Answer me[a], O Yahweh, answer me, so that this people may know that you, O Yahweh, are God[b], and that you have turned their heart back.
translation:
  language: zh_hans
  text: 耶和华啊，求你应允我，应允我！好让这百姓知道：你，耶和华，是上帝；也知道，是你已经使他们的心回转。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “他们的心”：原文“心”为单数，带复数所属后缀，是把全体百姓视为一个整体的集合表达；也可按中文习惯译作“他们的心”。
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲנֵנִי
  choice: 求你应允我
  rationale: 在祷告语境中，此词请求上帝以实际行动回应；“应允我”自然、庄重，并保留原文的重复强调。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文读者熟悉的神圣名字译法，保留原文专名，而不以一般称号取代。
- source_word: וְיֵדְעוּ
  choice: 好让……知道
  rationale: 此处连接词与未完成式表达以利亚祈求的目的或结果；“好让”在现代汉语中清楚自然。
- source_word: הָעָם הַזֶּה
  choice: 这百姓
  rationale: 保留 עַם 的集合意义；“这百姓”符合经文语体，同时普通读者也容易理解。
- source_word: כִּי אַתָּה יְהוָה הָאֱלֹהִים
  choice: 你耶和华是上帝
  rationale: 此句确认耶和华的身份，并在与巴力的对比中宣认他是上帝；不额外加入“唯有”，以免把语境中的排他含义扩写进正文。
- source_word: הֲסִבֹּתָ
  choice: 是你使……回转
  rationale: 保留使役词形所表达的神主动使其转回的含义；焦点结构“是你”也反映原文重复主语 אַתָּה 的强调。
- source_word: אֶת לִבָּם
  choice: 他们的心
  rationale: 保留原文单数“心”和复数所属关系，呈现全体百姓作为一个整体的集合表达。
- source_word: אֲחֹרַנִּית
  choice: 回转
  rationale: 该副词表达向后转、返回；在此语境中，“回转”自然地传达百姓归回耶和华的意思，而不额外添加“再次”。
theological_decisions:
- issue: 百姓回转中的神圣行动
  choice: 也知道是你使他们的心回转
  alternative: 也知道你使他们的心回转；也知道你正在使他们的心回转
  rationale: 译文保留希伯来语完成式以及使役动词所强调的神的主动作为，不把它弱化为许可，也不借此引入本节之外的系统神学结论。
- issue: הָאֱלֹהִים 中冠词的表达
  choice: 是上帝
  alternative: 是那位上帝；是真神
  rationale: 冠词在此可作确定性或类别性的用法；“是上帝”在现代中文中自然，并保留身份宣认。“真神”虽符合上下文对比，却把解释性含义直接加入正文。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语言。保留“应允我”的重复、耶和华这一专名，以及神使百姓回转的强烈主动性；避免为流畅而消除原文的集合单数和神学张力。
