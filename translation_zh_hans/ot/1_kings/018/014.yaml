  text: And now you are saying, ‘Go, tell your lord, “Look, Elijah is here,”’ and he will kill me.’
translation:
  language: zh_hans
  text: 现在你却说：‘去告诉你的主人：‘看，以利亚在这里。’这样，他就会杀了我。’
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַתָּה
  choice: 现在……却
  rationale: 既保留“现在”的时间推进，也用“却”自然表达俄巴底在上下文中的惊惧与反差。
- source_word: לַאדֹנֶיךָ
  choice: 你的主人
  rationale: אָדוֹן在此指亚哈这一人间主人，而非神；译作“主人”符合俄巴底与亚哈的臣属关系。
- source_word: הִנֵּה אֵלִיָּהוּ
  choice: 看，以利亚在这里
  rationale: הִנֵּה用于引人注意；“看”比“看哪”更符合现代普通话，同时保留现场感。
- source_word: וַהֲרָגָנִי
  choice: 这样，他就会杀了我
  rationale: 该形式字面连接为“而他会杀我”；根据语境补出“这样”使因果承接自然，不改变主语所指的亚哈。
