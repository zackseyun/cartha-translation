base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/007.yaml
  text: As Obadiah was on the way, behold, Elijah came to meet him. When he recognized him, he fell on his face and said, “Is that you, my lord Elijah?”
translation:
  language: zh_hans
  text: 俄巴底正在路上，忽然，以利亚迎面而来。俄巴底认出他，就俯伏在地，说：“你就是我主以利亚吗？”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִנֵּה
  choice: 忽然
  rationale: 叙事中用于引出出人意料的相遇；译为“忽然”比直译“看哪”更符合现代汉语叙事，同时保留突现感。
- source_word: לִקְרָאתוֹ
  choice: 迎面而来
  rationale: 表示向着某人而来、与其相遇；“迎面而来”自然表达双方在路上碰面的场景，但不额外断定以利亚是否专程寻找俄巴底。
- source_word: וַיִּפֹּל עַל־פָּנָיו
  choice: 俯伏在地
  rationale: 希伯来语字面为“伏在脸上”，是表示敬畏或尊敬的姿态；现代汉语以“俯伏在地”表达自然准确。
- source_word: הַאַתָּה זֶה
  choice: 你就是……吗
  rationale: 这是带有辨认、惊讶意味的确认问句；“你就是……吗”保留该语气，也适合当面说话的场景。
- source_word: אֲדֹנִי
  choice: 我主
  rationale: 此处是俄巴底对以利亚的尊称，不是神名；保留为“我主”可反映原文的尊敬程度，并避免误作“主耶和华”。
theological_decisions:
- issue: אֲדֹנִי 所指对象及称谓性质
  choice: 译作“我主”，指以利亚
  alternative: 译作“先生”或“主人”
  rationale: 词尾第一人称单数和紧随其后的“以利亚”表明这是对先知的尊称。译作“我主”最贴近原文，又不使用专指上帝的形式。
translation_notes:
  register: 采用现代、庄重而清楚的叙事语言。“俄巴底”沿用中文圣经中广为人知的人名形式；“俯伏在地”保留古代礼敬动作的文化距离。
