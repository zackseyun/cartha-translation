base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/019.yaml
  text: The rest of the acts of Jeroboam[a], how he fought and how he reigned, behold[c][b], they are written in the Book of the Chronicles of the Kings of Israel.
translation:
  language: zh_hans
  text: 耶罗波安其余的事迹[a]，包括他怎样争战、怎样统治；看哪，这些事都记在《以色列诸王记》[b]上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “事迹”直译可作“事情”；在这类君王生平总结中，指所记载的政事和作为。
    reason: lexical_alternative
  - marker: b
    text: 这里指以色列诸王的官方编年记录或史料，并非圣经中的《历代志》。
    reason: cross_reference
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי יָרָבְעָם
  choice: 耶罗波安其余的事迹
  rationale: “דִּבְרֵי”本义范围包括言语、事情；在君王生平总结套语中指其政事和作为。译作“事迹”既符合这里的文体，也比直译“事情”自然。
- source_word: אֲשֶׁר נִלְחַם
  choice: 包括他怎样争战
  rationale: נלחם意为争战、作战；关系词אֲשֶׁר在此列举其余事迹的内容，用“包括”引出，符合现代汉语表达。
- source_word: וַאֲשֶׁר מָלָךְ
  choice: 怎样作王
  rationale: מלך在此指执掌王权、统治，而不是登基成为王；“作王”保留原文概括其统治情况的宽泛含义。
- source_word: הִנָּם כְּתוּבִים
  choice: 都记在
  rationale: הִנָּם是带复数代词成分的呈示表达，强调这些事已见于所指记录。汉语以“都记在”自然传达其复数照应与指示效果；不机械译为“看哪”。
- source_word: עַל סֵפֶר
  choice: 记在……上
  rationale: 原文介词עַל字面为“在……之上”，用于书卷记录时，现代汉语惯用“记在……上”。
- source_word: סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יִשְׂרָאֵל
  choice: 《以色列诸王记》
  rationale: 该词组指以色列诸王的王室编年记录；采用简洁的中文书名形式，并以脚注说明并非圣经中的《历代志》。
