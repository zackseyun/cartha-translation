  text: וַ/יהוָ֞ה אָמַ֣ר אֶל אֲחִיָּ֗הוּ הִנֵּ֣ה אֵ֣שֶׁת יָרָבְעָ֡ם בָּאָ֣ה לִ/דְרֹשׁ֩ דָּבָ֨ר מֵ/עִמְּ/ךָ֤ אֶל בְּנָ/הּ֙ כִּֽי חֹלֶ֣ה ה֔וּא כָּ/זֹ֥ה וְ/כָ/זֶ֖ה תְּדַבֵּ֣ר אֵלֶ֑י/הָ וִ/יהִ֣י כְ/בֹאָ֔/הּ וְ/הִ֖יא מִתְנַכֵּרָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/005.yaml
  text: And Yahweh said to Ahijah[a], “Look, Jeroboam’s wife is coming to ask you about her son, because he is sick. You shall speak to her like this and like that. And when she comes[b], she will be disguising herself.”
translation:
  language: zh_hans
  text: 耶和华对亚希雅说：“你看，耶罗波安的妻子正要来向你求问她儿子的事，因为他病了。你要这样那样对她说[a]。她来的时候，她会乔装打扮[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“你要这样那样对她说”。这是指一段确定、但在这里尚未具体说出的信息。
    reason: 说明希伯来语固定表达 כָּזֹה וְכָזֶה 的含义，避免将“这样那样”理解为随意或内容含糊。
  - marker: b
    text: 或译：“她会装成另一个人。”原文动词表示使自己不被认出，即伪装或掩饰身份。
    reason: 说明 מִתְנַכֵּרָה 的反身意义及可行译法。
lexical_decisions:
- source_word: וַיהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的专名译出四字神名，明确指向以色列的神。
- source_word: הִנֵּה
  choice: 看
  rationale: 保留引起注意和提示眼前事态的功能，同时避免古雅的“看哪”。
- source_word: בָּאָה
  choice: 正来
  rationale: 结合语境表达即将到来的进行性或临近性。
- source_word: לִדְרֹשׁ דָּבָר מֵעִמְּךָ אֶל בְּנָהּ
  choice: 来找你，要为她的儿子求问
  rationale: “求问”体现向先知寻求信息或神谕的语境；“为她的儿子”自然表达所问之事与儿子有关。
- source_word: כִּי חֹלֶה הוּא
  choice: 因为他病了
  rationale: 直接保留原因关系，并采用自然的现代汉语。
- source_word: כָּזֹה וְכָזֶה תְּדַבֵּר אֵלֶיהָ
  choice: 你要如此如此对她说
  rationale: 保留原文故意未在此交代具体内容的固定说法，不擅自补出下文信息。
- source_word: וִיהִי כְבֹאָהּ
  choice: 她来的时候
  rationale: 将希伯来叙事公式自然地译为时间从句。
- source_word: וְהִיא מִתְנַכֵּרָה
  choice: 必会乔装身份
  rationale: 表达使自己不被认出、装成别人的反身含义；“乔装身份”比单纯“化装”更清楚。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 采用现代简体中文圣经传统中最广为人知的专名形式，同时不以普通称号取代原文专名。
- issue: 求问对象与神谕语境
  choice: 来找你，要为她的儿子求问
  alternative: 来向你求问她儿子的事
  rationale: 原文可理解为从先知处寻求关于儿子的答复；正文保留先知咨询语境，但不额外明说“向神求问”，以免加入原文未明示的神学解释。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“看”保留 הִנֵּה 的提示作用；“如此如此”略带书面色彩，但能准确呈现原文有意略去具体话语的表达。脚注标记均置于相关正文之后。
