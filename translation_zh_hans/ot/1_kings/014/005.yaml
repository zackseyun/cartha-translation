  to: 耶和华对亚希雅说：“你看，耶罗波安的妻子正要来向你求问她儿子的事，因为他病了。你要这样那样对她说[a]。她来的时候，她会乔装打扮[b]。”
  rationale: 修订消除了“为儿子求问”可能被误解为代祷的歧义，并以自然的“乔装打扮”替换不常用的“乔装身份”。“这样那样”及其脚注保留并解释原文固定表达所指的、尚未明说的具体指示；没有增添任何神学或叙事信息。
