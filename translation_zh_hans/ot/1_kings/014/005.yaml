  naturalness: “正来找你，要为她的儿子求问”略显生硬且有歧义；“必会乔装身份”不是自然的现代汉语搭配。“正要来向你求问她儿子的事”和“会乔装打扮”较自然，同时保留原文的预告与反身伪装之意。
  terminology: “耶和华”“亚希雅”“耶罗波安”均可保留。“这样那样”比“如此如此”更合现代标准汉语；脚注应说明这是一项内容尚未在此明说的确定指示，而非随意或含糊的说法。
