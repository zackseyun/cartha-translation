id: 1KI.14.8
reference: 1 Kings 14:8
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וָ/אֶקְרַ֤ע אֶת הַ/מַּמְלָכָה֙ מִ/בֵּ֣ית דָּוִ֔ד וָ/אֶתְּנֶ֖/הָ לָ֑/ךְ וְ/לֹֽא הָיִ֜יתָ כְּ/עַבְדִּ֣/י דָוִ֗ד אֲשֶׁר֩ שָׁמַ֨ר מִצְוֺתַ֜/י וַ/אֲשֶׁר הָלַ֤ךְ אַחֲרַ/י֙ בְּ/כָל לְבָב֔/וֹ לַ/עֲשׂ֕וֹת רַ֖ק הַ/יָּשָׁ֥ר בְּ/עֵינָֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/008.yaml
  text: and I tore the kingdom away from the house of David and gave it to you[a]. But you have not been like my servant David, who kept my commandments and who walked after me with all his heart[b], to do only what was right in my eyes.
translation:
  language: zh_hans
  text: 我从大卫家[a]夺走了王国，把它给了你。你却不像我的仆人大卫；他遵守我的诫命，全心跟随我[b]，只做我眼中看为正的事。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “大卫家”是王朝用语，指大卫的王室世系。
    reason: cultural_note
  - marker: b
    text: 原文直译为“走在我后面”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶקְרַע
  choice: 夺走
  rationale: 该动词本义为“撕裂、撕开”，在这里以王国为宾语，并与“从大卫家”连用，表达强行剥离、夺走。中文若直译为“撕下王国”较不自然，因此用“夺走”传达语境中的强烈动作。
- source_word: הַמַּמְלָכָה
  choice: 王国
  rationale: 指作为政治实体和统治领域的国度；“王国”在现代汉语中清楚自然。
- source_word: מִבֵּית דָּוִד
  choice: 从大卫家
  rationale: 保留希伯来语“家”的王朝性表达，不直接在正文中解释为“大卫王朝”。
- source_word: וָאֶתְּנֶהָ לָךְ
  choice: 把它给了你
  rationale: 按叙事时序译为已经发生的过去行动；“它”回指王国。
- source_word: וְלֹא הָיִיתָ כְּעַבְדִּי דָוִד
  choice: 你却不像我的仆人大卫
  rationale: 以自然的现代汉语表达持续到当前指控中的对比；“仆人”符合此处尊荣性的君王—圣约语境。
- source_word: שָׁמַר מִצְוֺתַי
  choice: 遵守我的诫命
  rationale: שׁמר与诫命连用时通常指谨守、遵行；“遵守”准确而自然。
- source_word: הָלַךְ אַחֲרַי
  choice: 跟随我
  rationale: 希伯来语字面为“走在我后面”；中文“跟随我”自然传达忠诚顺从的含义，脚注保留其具体隐喻。
- source_word: בְּכָל לְבָבוֹ
  choice: 全心
  rationale: 表达内心毫无保留、专一投入，简洁而符合现代汉语。
- source_word: לַעֲשׂוֹת רַק הַיָּשָׁר בְּעֵינָי
  choice: 只做我眼中看为正的事
  rationale: 保留רַק“只”和“在我眼中”的评价视角，也以目的或表现性的连续结构自然承接“全心跟随我”。
theological_decisions:
- issue: 本节把大卫树立为顺服典范，但其他经文记载了他的罪
  choice: 照本节自身的修辞，毫无附加限定地保留对大卫的正面评价
  alternative: 加入“大体上”“通常”等缓和语，或在正文中说明其例外
  rationale: 原文在耶罗波安与大卫之间作鲜明对比，明确说大卫遵守诫命、全心跟随神，并只做神眼中看为正的事。译文不应借协调其他经文而削弱本节有意保留的神学张力。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“大卫家”保留原文的王朝习语，并用脚注解释；“跟随我”避免生硬直译，同时在脚注中保存“走在我后面”的具体意象。正文各脚注标记与脚注内容对应。
