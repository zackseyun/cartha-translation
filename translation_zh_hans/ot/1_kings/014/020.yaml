base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/020.yaml
  text: The days that Jeroboam reigned were twenty-two years. Then he lay down with his fathers[a], and Nadab his son became king in his place.
translation:
  language: zh_hans
  text: 耶罗波安作王二十二年。他与列祖同睡[a]，他儿子拿答接替他作王。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这是希伯来文表示死亡的惯用语；也可译作“与列祖同卧”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַיָּמִים אֲשֶׁר מָלַךְ
  choice: 作王共……年
  rationale: 这是希伯来文概述君王在位年数的惯用格式；中文以“作王共……年”自然表达，不生硬保留句首连词和“日子”的形式。
- source_word: יָרָבְעָם
  choice: 耶罗波安
  rationale: 采用现代中文圣经人名的通行译法。
- source_word: עֶשְׂרִים וּשְׁתַּיִם שָׁנָה
  choice: 二十二年
  rationale: 按现代汉语习惯表达希伯来文数词。
- source_word: וַיִּשְׁכַּב עִם אֲבֹתָיו
  choice: 他与列祖同睡
  rationale: 保留王室记述中表示死亡的希伯来文委婉语及其意象；“列祖”比直译“父亲们”更符合该固定表达在中文中的意义。脚注说明其所指，避免误解。
- source_word: וַיִּמְלֹךְ
  choice: 作王
  rationale: 此处处于王位承继公式中，与“接替他”连用，清楚表明拿答登基继位。
- source_word: נָדָב בְּנוֹ
  choice: 他儿子拿答
  rationale: 符合现代汉语自然语序，并保留经文明说的父子关系。
- source_word: תַּחְתָּיו
  choice: 接替他
  rationale: 在王位承继语境中表示取代前王而继位；“接替他”比形式化的“在他的位置上”更自然明确。
theological_decisions:
- issue: 王室公式中的死亡委婉语
  choice: 保留“与列祖同睡”这一意象，并以脚注解释为死亡。
  alternative: 译作“死了”或“与列祖同卧”。
  rationale: 原文是叙事中的固定死亡委婉语，并非对死后状态作系统性的教义陈述。直接译作“死了”会抹平原文意象；“同卧”在现代汉语中较易产生歧义。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“作王共二十二年”和“接替他作王”符合中文历史叙事习惯；“与列祖同睡”保留源文色彩，并由脚注消除现代读者可能产生的误解。
