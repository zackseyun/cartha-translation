  text: וַ/תָּ֣רַע לַ/עֲשׂ֔וֹת מִ/כֹּ֖ל אֲשֶׁר הָי֣וּ לְ/פָנֶ֑י/ךָ וַ/תֵּ֡לֶךְ וַ/תַּעֲשֶׂה לְּ/ךָ֩ אֱלֹהִ֨ים אֲחֵרִ֤ים וּ/מַסֵּכוֹת֙ לְ/הַכְעִיסֵ֔/נִי וְ/אֹתִ֥/י הִשְׁלַ֖כְתָּ אַחֲרֵ֥י גַוֶּֽ/ךָ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/009.yaml
  text: and have done evil above all who were before you. You went and made for yourself other gods and molten images to provoke me to anger[a], and you have cast me behind your back.
translation:
  language: zh_hans
  text: 你行恶，比所有在你以前的人更甚；你竟去为自己制造别的神和铸像，惹我发怒，却把我抛在背后。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתָּרַע לַעֲשׂוֹת מִכֹּל
  choice: 你行恶……更甚
  rationale: רעה＋לעשות构成“行恶”的惯用表达；מִכֹּל明确带出比较义。“更甚”既保留比较力度，也符合庄重而自然的现代汉语。
- source_word: מִכֹּל אֲשֶׁר הָיוּ לְפָנֶיךָ
  choice: 比所有在你以前的人
  rationale: לְפָנֶיךָ在这里指时间或先后次序，译为“在你以前的人”，不误解为空间方位。
- source_word: וַתֵּלֶךְ
  choice: 你竟去
  rationale: הלך在连续叙事中引出下一行动；“竟”体现此处责备语气，但不另加具体行动内容。
- source_word: וַתַּעֲשֶׂה לְּךָ
  choice: 为自己制造
  rationale: לְּךָ具有反身兼受益意味；“为自己”准确保留这一指向，“制造”适用于后接神像与铸像的语境。
- source_word: אֱלֹהִים אֲחֵרִים
  choice: 别的神
  rationale: 直译盟约语境中的非法敬拜对象，不添加“外国的”等原文未明说的地域含义。
- source_word: וּמַסֵּכוֹת
  choice: 铸像
  rationale: מַסֵּכָה指用浇铸方式制成的像，通常为金属祭祀物；“铸像”简洁保留制作工艺及实体形象。
- source_word: לְהַכְעִיסֵנִי
  choice: 惹我发怒
  rationale: 准确表达כעס使役形“使我发怒”的因果和人称宾语，汉语也自然有力。
- source_word: וְאֹתִי הִשְׁלַכְתָּ אַחֲרֵי גַוֶּךָ
  choice: 却把我抛在背后
  rationale: 保留原文以身体方位表达轻蔑拒绝的强烈比喻；“抛”传达השליך的动作力度，不抽象化为“无视”。
theological_decisions:
- issue: 如何呈现偶像崇拜的盟约性冒犯
  choice: 别的神和铸像
  alternative: 外邦神和偶像
  rationale: 保留“神”与具体铸造形象两个并列类别；不把二者泛化为“偶像”，也不加入原文没有明确表达的“外邦”含义。
- issue: 是否保留拒绝上帝的身体性比喻
  choice: 把我抛在背后
  alternative: 不把我放在眼里
  rationale: 原文使用强烈、具体的动作比喻。直保此意象可呈现轻蔑与决绝，不将其消解为抽象解释。
translation_notes:
  register: 采用庄重、清晰的现代标准普通话。“更甚”“铸像”“抛在背后”兼顾原文力度与普通读者的可理解性；分号呈现罪行比较与具体行为之间的推进关系。
