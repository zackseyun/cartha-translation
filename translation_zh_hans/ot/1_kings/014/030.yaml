  text: And there was war between Rehoboam and Jeroboam all their days[a].
translation:
  language: zh_hans
  text: 罗波安和耶罗波安之间的战争一直延续，贯穿他们一生[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“所有的日子”。这是希伯来语时间习语；在这里可指他们一生或在位期间，表示争战持续不断。
    reason: 说明原文“所有的日子”的字面形式及其语境中的时间范围，避免将其限定为单一解释。
lexical_decisions:
- source_word: וּמִלְחָמָה הָיְתָה
  choice: 一直有战争
  rationale: מִלְחָמָה意为“战争、战事”，הָיְתָה在这里作存在性表达。“有战争”贴近原文句法；“一直”结合句末的时间语意，构成自然的现代汉语。
- source_word: בֵין רְחַבְעָם וּבֵין יָרָבְעָם
  choice: 罗波安和耶罗波安之间
  rationale: 重复的בֵין标明两个对立方之间的关系；人名采用现代中文圣经通行译名。
- source_word: כָּל הַיָּמִים
  choice: 他们所有的日子
  rationale: 直译为“所有的日子”。原文没有明说“在世”或“在位”，因此正文保留较宽的表达，不把所指范围限定为一生或执政时期。
theological_decisions: []
translation_notes:
  register: 采用简洁、庄重而易懂的现代标准汉语。“持续了他们所有的日子”略带原文色彩，旨在保留希伯来语כָּל הַיָּמִים的开放性；脚注解释其自然含义。
