  yaml_path: translation/ot/1_kings/014/027.yaml
  text: So King Rehoboam made bronze shields in their place and committed them into the hand of the commanders of the runners[b][a], who guarded the entrance of the king’s house.
translation:
  language: zh_hans
  text: 于是，罗波安王造了铜盾牌，代替那些金盾牌，并把这些盾牌交给奔走者的长官[a]掌管；这些奔走者守卫王宫的入口。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “奔走者”直译希伯来语。这可能是王室的一支队伍，承担护卫或传令等职责；因此也可按职能意译为“护卫队的长官”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: 造了
  rationale: עשה在本叙事语境中指制作器物；“造了”自然简洁。
- source_word: הַמֶּלֶךְ רְחַבְעָם
  choice: 罗波安王
  rationale: 按现代汉语习惯将王号置于人名之后。
- source_word: תַּחְתָּם
  choice: 来代替那些金盾牌
  rationale: 字面为“代替它们”；所指是上一节被夺走的金盾牌。正文明确先行词，可避免汉语代词指向含混。
- source_word: מָגִנֵּי נְחֹשֶׁת
  choice: 铜盾牌
  rationale: נְחֹשֶׁת可指铜或青铜；汉语圣经历史叙事中“铜”可作较宽泛的传统金属名称，不武断限定合金成分。
- source_word: וְהִפְקִיד עַל יַד
  choice: 把它们交给……掌管
  rationale: 该组合表示将物件置于某人手下保管；此译既传达委托保管，也符合现代汉语表达。
- source_word: שָׂרֵי הָרָצִים
  choice: 跑卒长官
  rationale: 保留הָרָצִים“奔跑者”的字面意象，同时用“卒”表明这是一支王室职役队伍；脚注说明其可能职能。
- source_word: הַשֹּׁמְרִים
  choice: 护卫
  rationale: 分词表示这支队伍持续执行守卫职责；汉语中以定语“护卫……的”表达自然。
- source_word: פֶּתַח בֵּית הַמֶּלֶךְ
  choice: 王宫入口
  rationale: בֵּית הַמֶּלֶךְ字面为“王的家/房屋”，在此制度语境中明确指王宫；“王宫入口”准确且易懂。
theological_decisions: []
