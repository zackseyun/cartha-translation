  text: וַ/יִּקְבְּר֥וּ אֹת֛/וֹ וַ/יִּסְפְּדוּ ל֖/וֹ כָּל יִשְׂרָאֵ֑ל כִּ/דְבַ֤ר יְהוָה֙ אֲשֶׁ֣ר דִּבֶּ֔ר בְּ/יַד עַבְדּ֖/וֹ אֲחִיָּ֥הוּ הַ/נָּבִֽיא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/018.yaml
  text: They buried him[a], and all Israel mourned for him, according to the word of Yahweh that he had spoken through his servant Ahijah the prophet.
translation:
  language: zh_hans
  text: 他们把他埋葬了；以色列众人都为他哀悼，正如耶和华借着他的仆人亚希雅先知所说的话。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְבְּרוּ אֹתוֹ
  choice: 他们把他埋葬了
  rationale: קבר的Qal叙事形式表示埋葬；保留复数主语和指向已故儿子的宾语代词，并用现代汉语自然表达事件的先后。
- source_word: וַיִּסְפְּדוּ לוֹ
  choice: 为他哀悼
  rationale: ספד指为死者公开举哀或哀悼；“哀悼”既符合安葬语境，也不额外强调哭号等具体形式。
- source_word: כָּל יִשְׂרָאֵל
  choice: 以色列众人
  rationale: 这是指以色列民的集合性说法；“众人”比生硬的“全以色列”更符合现代汉语，同时保留整体范围。
- source_word: כִּדְבַר יְהוָה
  choice: 这正如耶和华……所说的话
  rationale: כְּ加דָבָר表示事情与先前神谕相符；“正如……所说的话”清楚呈现预言应验关系。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代简体中文圣经语境中广为人知的神名音译，作为四字神名的专名表达，而非以头衔替代。
- source_word: אֲשֶׁר דִּבֶּר
  choice: 所说的
  rationale: 关系从句修饰“话”；汉语借上下文自然表明这话先于安葬和哀悼说出，无需另加时态标记。
- source_word: בְּיַד עַבְדּוֹ
  choice: 借他的仆人
  rationale: ביד在此为借某人传达的媒介惯用语；“借”清楚表达先知作为传话者，同时避免直译“借……的手”造成不自然。
- source_word: אֲחִיָּהוּ הַנָּבִיא
  choice: 亚希雅先知
  rationale: 人名按通行中文形式音译；定冠词所标明的身份以汉语同位结构“亚希雅先知”表达。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。正文保留专名而不改为“主”；“耶和华”是普通现代中文读者最熟悉的形式。
- issue: 先知中介表达 בְּיַד עַבְדּוֹ
  choice: 借他的仆人
  alternative: 由他的仆人之手
  rationale: 原文说明神的话经由亚希雅传达。“借”保留中介关系，却不超出原文增添关于启示机制的教义说明。
- issue: כִּדְבַר 所表达的应验关系
  choice: 这正如……所说的话
  alternative: 照着……的话
  rationale: 所述安葬与全民哀悼依照先前神谕发生；该译法保留预言与事件相符的神学意味，而不把关系进一步解释为因果。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。以分号连接安葬与哀悼两个连续动作，再以独立句突出先知之言的应验。没有需要脚注保留的实质歧义；ביד的希伯来习语直接按意义译为“借”。
