  naturalness: “与列祖同睡”庄重自然，适合保留原文死亡公式。将安葬分句改为“与列祖一同葬在大卫城”，避免“葬在……，与……同葬”的重复和后置补足造成的不顺。
  terminology: “列祖”“大卫城”“亚扪女子”“亚比央”均合宜。“亚扪女子”准确体现阴性族称，且比带有歧义或较生僻的替代说法更符合现代标准汉语。
