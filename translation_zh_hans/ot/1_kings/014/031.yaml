base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/031.yaml
  text: And Rehoboam slept with his fathers and was buried with his fathers in the city of David[a]. And his mother's name was Naamah the Ammonite[b]. And Abijam his son reigned in his place.
translation:
  language: zh_hans
  text: 罗波安与列祖同睡；他与列祖一同葬在大卫城。他母亲名叫拿玛，是亚扪女子[a]。他儿子亚比央[b]接替他作王。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文使用阴性族称，明确指出拿玛是亚扪女子。
    reason: lexical_alternative
  - marker: b
    text: 亚比央在其他一些经文中称为“亚比雅”；本节原文作“亚比央”。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁכַּב עִם אֲבֹתָיו
  choice: 与列祖同睡
  rationale: 保留希伯来王室讣告中表示死亡的固定说法，同时用“列祖”体现王朝先人的含义，不直接释作“死了”。
- source_word: וַיִּקָּבֵר עִם אֲבֹתָיו
  choice: 与列祖同葬
  rationale: 准确表达被动的安葬动作，并与前一句的固定公式相呼应。
- source_word: בְּעִיר דָּוִד
  choice: 在大卫城
  rationale: 采用清楚而惯用的中文地名表达。
- source_word: נַעֲמָה הָעַמֹּנִית
  choice: 拿玛，是亚扪女子
  rationale: 女性族称 הָעַמֹּנִית 明确表示她是亚扪女性；“亚扪女子”在现代中文中自然且不失原文信息。
- source_word: אֲבִיָּם
  choice: 亚比央
  rationale: 依照本节马所拉文本的具体名字形式音译，不以其他经文所用的“亚比雅”统一替换。
- source_word: וַיִּמְלֹךְ ... תַּחְתָּיו
  choice: 接替他作王
  rationale: 自然表达王位承继，也保留 תַּחְתָּיו 所含“取代其位”的意义。
