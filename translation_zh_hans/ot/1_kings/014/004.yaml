  text: וַ/תַּ֤עַשׂ כֵּן֙ אֵ֣שֶׁת יָרָבְעָ֔ם וַ/תָּ֨קָם֙ וַ/תֵּ֣לֶךְ שִׁלֹ֔ה וַ/תָּבֹ֖א בֵּ֣ית אֲחִיָּ֑ה וַ/אֲחִיָּ֨הוּ֙ לֹֽא יָכֹ֣ל לִ/רְא֔וֹת כִּ֛י קָ֥מוּ עֵינָ֖י/ו מִ/שֵּׂיבֽ/וֹ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/004.yaml
  text: Jeroboam’s wife did so. She arose and went to Shiloh[a], and came to Ahijah’s house. Now Ahijah could not see, because his eyes were dim because of his old age.
translation:
  language: zh_hans
  text: 耶罗波安的妻子就照着做了。她起身前往示罗，来到亚希雅家。那时，亚希雅不能看见，因为他年老，眼睛昏花[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“他的眼睛因年老而站住了”，这是形容年老导致视力丧失的惯用说法。
    reason: 保留原文较特殊的身体意象，并说明其惯用含义。
lexical_decisions:
- source_word: וַתַּעַשׂ כֵּן
  choice: 就照着做了
  rationale: 这是希伯来叙事中表示按先前吩咐行事的常用表达；译文自然承接上文。
- source_word: וַתָּקָם וַתֵּלֶךְ שִׁלֹה
  choice: 她起身前往示罗
  rationale: 保留连续动作及叙事节奏；“前往”清楚表达示罗是目的地。
- source_word: וַתָּבֹא בֵּית אֲחִיָּה
  choice: 来到亚希雅家
  rationale: 原文侧重抵达亚希雅的住所，并不必然强调进入屋内。
- source_word: וַאֲחִיָּהוּ לֹא יָכֹל לִרְאוֹת
  choice: 那时，亚希雅已经看不见了
  rationale: “那时”自然标示叙事焦点转向亚希雅；“已经看不见了”准确表达其视力丧失的状态。
- source_word: קָמוּ עֵינָיו
  choice: 眼睛昏花
  rationale: 字面为“他的眼睛站住了”，是描述年老导致视觉功能衰退的惯用说法；正文采用现代汉语中清楚自然的对应表达，并以脚注保留原文意象。
- source_word: מִשֵּׂיבוֹ
  choice: 因为他年老
  rationale: שֵׂיבָה 在此指年老、老年；介词 מִן 表示造成视力衰退的原因。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“就照着做了”“起身前往”“来到”保留希伯来文连续动作的推进感；避免把“来到亚希雅家”过度具体化为“进入屋内”。
