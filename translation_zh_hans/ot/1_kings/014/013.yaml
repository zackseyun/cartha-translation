id: 1KI.14.13
reference: 1 Kings 14:13
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/סָֽפְדוּ ל֤/וֹ כָל יִשְׂרָאֵל֙ וְ/קָבְר֣וּ אֹת֔/וֹ כִּֽי זֶ֣ה לְ/בַדּ֔/וֹ יָבֹ֥א לְ/יָרָבְעָ֖ם אֶל קָ֑בֶר יַ֣עַן נִמְצָא ב֞/וֹ דָּבָ֣ר ט֗וֹב אֶל יְהוָ֛ה אֱלֹהֵ֥י יִשְׂרָאֵ֖ל בְּ/בֵ֥ית יָרָבְעָֽם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/013.yaml
  text: All Israel will mourn for him and bury him[a], because he alone of Jeroboam’s house will come to the grave, since in him something good toward Yahweh, the God of Israel[c][b], has been found in the house of Jeroboam.
translation:
  language: zh_hans
  text: 以色列众人都要为他哀悼，并安葬他[a]；因为在耶罗波安家中，只有他得入坟墓；这是因在耶罗波安家中，在他身上发现了一点向着耶和华——以色列的神——的美善[b][c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译近于“因为只有这一个会来到耶罗波安那里，来到坟墓”；意思是，耶罗波安家中只有他会得到安葬。
    reason: 说明原文较难理解的句法及正文所表达的语境含义。
  - marker: b
    text: “一点美善”也可译作“一件好事”或“某种善”。
    reason: 保留דָּבָר טוֹב既可指事情、也可指品质的词义范围。
  - marker: c
    text: “向着耶和华”可能指内心倾向耶和华，也可能指在与耶和华的关系中可称许、蒙他喜悦。
    reason: 保留介词אֶל在此处的语义开放性和神学张力。
lexical_decisions:
- source_word: וְסָפְדוּ לוֹ
  choice: 都要为他哀哭
  rationale: ספד指为死者哀悼、哀哭；“为他哀哭”符合丧葬语境，也适合全以色列共同举哀的场面。
- source_word: וְקָבְרוּ אֹתוֹ
  choice: 把他安葬
  rationale: 直译为“埋葬他”；“安葬”在现代汉语中自然庄重，并与本节所强调的正式入葬相称。
- source_word: כִּי זֶה לְבַדּוֹ
  choice: 只有他
  rationale: 保留לְבַדּוֹ所表达的排他性，并清楚呈现他与耶罗波安家其他成员的对比。
- source_word: יָבֹא לְיָרָבְעָם אֶל קָבֶר
  choice: 耶罗波安家中，只有他会进坟墓
  rationale: 希伯来语字面结构不适合直接照搬；上下文表示耶罗波安所属家族中只有此人会得到入葬。“进坟墓”保留原文“来到/进入坟墓”的意象。
- source_word: נִמְצָא בוֹ
  choice: 在他里面显出
  rationale: 原文尼法勒完成式意为某种品质“在他里面被发现”。“显出”在中文中较自然，同时保留这品质被察见的意味。
- source_word: דָּבָר טוֹב
  choice: 一点……美善
  rationale: דָּבָר טוֹב是不定而宽泛的表达，可指某件好事或某种良善品质；“一点美善”保留其不确定性，也与“在他里面”自然衔接。
- source_word: אֶל יְהוָה
  choice: 向着耶和华
  rationale: אֶל具有朝向、关联的意味。“向着”保留方向性，不把它过早限定为“蒙悦纳”或“在……眼中看为好”。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经传统中对四字神名的通行音译，作为专名而非以“主”这一称号代替。
- source_word: בְּבֵית יָרָבְעָם
  choice: 在耶罗波安家中
  rationale: “家”在此包含家族、家室乃至王朝的意义；中文“耶罗波安家”既简洁，也保留原文的家族性含义。
theological_decisions:
- issue: “向着耶和华的美善”的确切含义
  choice: 保留“向着耶和华”的方向性表达
  alternative: 译作“耶和华看为好的事”或“讨耶和华喜悦的地方”
  rationale: 原文אֶל可表示朝向或与耶和华的关系，可能描述这孩子对耶和华的倾向，也可能表示在耶和华面前可称许的品质。正文不替原文消除这一张力。
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威；主
  rationale: 原文使用神的专名。采用中文读者最熟悉的专名形式“耶和华”，避免把专名改成称号，同时不据不确定的古代发音强行更新音译。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“哀哭”“安葬”“进坟墓”贴合丧葬语境；以破折号标明“以色列的神”是对“耶和华”的同位说明。正文适度补出第二个“只有他”，使中文逻辑清楚，同时不改变原文所强调的唯一性。
