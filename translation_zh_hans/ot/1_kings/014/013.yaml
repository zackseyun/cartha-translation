revisions:
- from: 以色列众人都要为他哀哭，把他安葬[a]；因为耶罗波安家中，只有他会进坟墓。原来在耶罗波安家中，只有他里面显出了一点向着耶和华—以色列的神—的美善[b][c]。
  to: 以色列众人都要为他哀悼，并安葬他[a]；因为在耶罗波安家中，只有他得入坟墓；这是因在耶罗波安家中，在他身上发现了一点向着耶和华——以色列的神——的美善[b][c]。
  rationale: 修订的关键是将“只有”仅保留在原文明确强调的安葬／入坟墓上，避免无根据地断定耶罗波安家中仅此人具有善。其余调整使中文更自然，并继续保留原文对“向着耶和华”的开放表述及脚注锚点。
