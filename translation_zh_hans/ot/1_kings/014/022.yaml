base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/022.yaml
  text: And Judah did what was evil in the eyes of Yahweh[a], and they provoked him to jealousy more than all that their fathers had done, by the sins that they committed.
translation:
  language: zh_hans
  text: 犹大行耶和华眼中看为恶的事；他们因所犯的罪惹耶和华嫉妒，比他们祖先所行的一切更甚[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“使他嫉妒”或“激起他的嫉妒”。原文使用盟约关系中的嫉妒语言，指耶和华因犹大对他不忠而作出的回应。
    reason: 说明 קנא 的词义选择及其盟约语境，保留其他可行译法并避免将神的嫉妒误解为罪性的妒忌。
lexical_decisions:
- source_word: יְהוּדָה
  choice: 犹大
  rationale: 这是南国及其百姓的专名；原文先用单数集合名词，随后转用复数动词，中文“犹大……他们”可保留这种集合意义。
- source_word: הָרַע
  choice: 看为恶的事
  rationale: עשה + הרע 是固定评价性表达；与“耶和华眼中”连用时，译作“行耶和华眼中看为恶的事”自然且贴近原意。
- source_word: בְּעֵינֵי יְהוָה
  choice: 耶和华眼中
  rationale: 保留希伯来语“在……眼中”的评价性比喻，并将神名 יהוה 音译为“耶和华”。
- source_word: וַיְקַנְאוּ אֹתוֹ
  choice: 惹动耶和华嫉妒
  rationale: קנא 的使役用法表示因不忠而激起神的盟约性嫉妒；“惹动……嫉妒”保留原文神学用语，也不将其弱化为一般愤怒。重复“耶和华”可避免中文代词指向含混。
- source_word: מִכֹּל אֲשֶׁר עָשׂוּ אֲבֹתָם
  choice: 比他们祖先所行的一切更
  rationale: מן 在此表达比较，“比……更”准确呈现比较结构；אבות 在跨世代语境中译作“祖先”比“父亲们”自然。
- source_word: בְּחַטֹּאתָם אֲשֶׁר חָטָאוּ
  choice: 他们所犯的罪
  rationale: 原文以同根名词和动词加强表达，中文用“所犯的罪”自然传达；结合句法，将工具或原因性的 בְּ 融入“以所犯的罪惹动”的关系中。
theological_decisions:
- issue: 神的嫉妒
  choice: 惹动耶和华嫉妒
  alternative: 激起他的妒忌／惹耶和华发怒
  rationale: 原文 קנא 明确使用神回应百姓不忠的盟约性嫉妒语言。保留“嫉妒”可避免把这一概念消解为单纯愤怒；脚注说明其语境，以免被理解为罪性的眼红。
- issue: 犹大的集合性单复数转换
  choice: 犹大……他们
  alternative: 犹大人……他们
  rationale: 原文以专名“犹大”作集合主语，后接复数动词。正文保留专名和复数代词，既贴近形式，也清楚表明所指为犹大百姓。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留“耶和华眼中”和“惹动……嫉妒”等源文意象；将“列祖”改为现代读者更易懂的“祖先”。分号呈现两个紧密相连的分句，并使集合名词“犹大”到复数“他们”的转换清楚可读。
