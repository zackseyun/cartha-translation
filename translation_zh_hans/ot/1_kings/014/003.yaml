base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/003.yaml
  text: And take in your hand ten loaves of bread, some cakes, and a jar of honey, and go to him. He will tell you what will happen to the boy.
translation:
  language: zh_hans
  text: 你手里要带上十个饼、几块糕饼[a]和一瓶蜜，到他那里去。他会告诉你，这孩子将会怎样。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “糕饼”：原文所指的具体食品不确定。
    reason: 希伯来词נִקֻּדִים罕见，其形状或制作方式难以确定。
lexical_decisions:
- source_word: עֲשָׂרָה לֶחֶם
  choice: 十个饼
  rationale: לֶחֶם在此按可计数的饼来理解；“十个饼”既反映数量，也符合古代以饼为主食的语境。
- source_word: נִקֻּדִים
  choice: 几块糕饼
  rationale: 该词所指食品的确切种类不明；上下文表明是与饼和蜜一同携带的烘焙食品。“糕饼”自然易懂，并以脚注保留词义的不确定性。
- source_word: בַּקְבֻּק דְּבַשׁ
  choice: 一瓶蜜
  rationale: בַּקְבֻּק指瓶或小罐一类容器，דְּבַשׁ在此自然译为“蜜”；“一瓶蜜”简洁且符合原文。
- source_word: מַה יִּהְיֶה לַנָּעַר
  choice: 这孩子将会怎样
  rationale: 保留原文对孩子未来处境或结局的开放表达，不具体化为生死、康复或遭遇。
theological_decisions:
- issue: 先知将说明孩子未来的表述
  choice: 他会告诉你，这孩子将会怎样
  alternative: 他会告诉你，这孩子的结局如何
  rationale: 原文מַה יִּהְיֶה לַנָּעַר较为宽泛；采用“将会怎样”避免把经文提前限定为最终结局，保留叙事张力。
translation_notes:
  register: 采用现代、庄重而口语自然的叙事表达。“你手里要带上”兼顾原文“在你手中拿”的形象和现代汉语习惯；“这孩子将会怎样”保留原文的含蓄与悬念。
