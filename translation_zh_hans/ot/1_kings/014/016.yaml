  text: וְ/יִתֵּ֖ן אֶת יִשְׂרָאֵ֑ל בִּ/גְלַ֞ל חַטֹּ֤אות יָֽרָבְעָם֙ אֲשֶׁ֣ר חָטָ֔א וַ/אֲשֶׁ֥ר הֶחֱטִ֖יא אֶת יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/016.yaml
  text: And he will give up Israel because of the sins of Jeroboam[a], which he committed and by which he caused Israel to sin.
translation:
  language: zh_hans
  text: 他必因耶罗波安所犯、又使以色列人犯的罪，把以色列交出去[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “交出去”希伯来文直译为“给”；在这里的审判语境中，指把一个民族交付出去，使其落入灾祸或仇敌手中。
    reason: 说明原文字面义及其在审判语境中的惯用含义，同时避免在正文中补出未明说的承受者。
lexical_decisions:
- source_word: וְיִתֵּן
  choice: 他必……交出去
  rationale: נתן的基本义是“给”；本节处于审判语境，以以色列为直接宾语，表示将其交出，使其落入灾祸或仇敌手中。译作“交出去”保留审判含义，同时不擅自补明本节未指出的承受者或灾祸工具。连接词וְ在中文中不必机械译为“并且”。
- source_word: אֶת יִשְׂרָאֵל
  choice: 以色列
  rationale: 专名兼集体称谓，此处指以色列国及其人民。
- source_word: בִּגְלַל
  choice: 因
  rationale: 表示审判的原因，现代汉语用“因”简洁、庄重且清楚。
- source_word: חַטֹּאות יָרָבְעָם
  choice: 耶罗波安……那些罪
  rationale: חַטֹּאות是复数“罪”；保留复数所指，并按现代汉语将修饰成分置于中心词之前。
- source_word: אֲשֶׁר חָטָא
  choice: 耶罗波安所犯
  rationale: חטא在此表明这些罪是耶罗波安亲自犯的。汉语以“所犯的罪”自然表达，避免生硬直译为“所犯罪”。
- source_word: וַאֲשֶׁר הֶחֱטִיא אֶת יִשְׂרָאֵל
  choice: 又使以色列人陷入其中
  rationale: הֶחֱטִיא是חטא的使役形，意为“使……犯罪”。“陷入其中”回指前述罪，既表达耶罗波安使以色列犯罪的责任，也使中文关系清楚；“以色列人”在这里明确指受影响的人民。
theological_decisions:
- issue: 神施行审判时的措辞与方式
  choice: 把以色列交出去
  alternative: 把以色列交在别人手中／弃绝以色列
  rationale: 原文只用“给、交出”，并未在本分句中指出交给谁，也没有使用通常译为“弃绝”的专门动词。因此正文保留审判的严肃性，却不补入仇敌或把含义强化为彻底弃绝。
- issue: 耶罗波安本人的罪责及其使以色列犯罪的责任
  choice: 耶罗波安所犯、又使以色列人陷入其中的那些罪
  alternative: 耶罗波安所犯的罪，以及他使以色列人所犯的罪
  rationale: 原文连续使用两个关系从句，兼顾耶罗波安亲自犯罪与使全国犯罪两方面。译文保留使役语气，并以“其中”维持两个关系从句都回指“那些罪”的语法联系。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“交出去”比“交付”更贴近普通读者，同时仍保留审判语气；“陷入其中”自然表达使役关系，并避免重复“犯罪”造成的拗口。
