  yaml_path: translation/ot/1_kings/014/029.yaml
  text: The rest of the acts of Rehoboam[a], and all that he did, are they not written in the Book of the Chronicles of the Kings of Judah?
translation:
  language: zh_hans
  text: 罗波安其余的事迹，以及他所做的一切，岂不都记在《犹大列王纪事》[a]上吗？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“《犹大列王年鉴》”。这里译作“纪事”的希伯来语词组，指记载王室事件的档案文献。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי רְחַבְעָם
  choice: 罗波安其余的事迹
  rationale: יֶתֶר意为“其余”，דִּבְרֵי在王室史料引用套语中指君王的事务或事迹，而非单指言语；省略句首显性的“至于/现在”，以免给וְ增加原文没有的时间含义。
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: 以及他所做的一切
  rationale: 直接保留עשה宽泛的“做”义，不额外加入成就或道德评价。
- source_word: הֲלֹא הֵמָּה כְתוּבִים
  choice: 不都记……吗
  rationale: 保留期待肯定回答的否定反问形式；汉语用“记”自然表达文献中的书面记载。
- source_word: עַל סֵפֶר
  choice: 记在……上
  rationale: 按汉语文献表达处理“写在书卷上”；此处סֵפֶר可指书卷或文献。
- source_word: דִּבְרֵי הַיָּמִים לְמַלְכֵי יְהוּדָה
  choice: 《犹大列王大事记》
  rationale: 该短语在列王纪的引证公式中指犹大诸王的王室编年记录；“大事记”既自然，又能与圣经正典书名《历代志》区分。
