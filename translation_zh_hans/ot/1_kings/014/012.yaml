  yaml_path: translation/ot/1_kings/014/012.yaml
  text: But as for you[a], arise, go to your house. When your feet enter the city, the child will die.
translation:
  language: zh_hans
  text: 至于你，起来，回家去吧。你的脚一进城[a]，孩子就会死。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“当你的脚进城时”；希伯来语以“你的脚”形象地表示你到达的时刻。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַתְּ
  choice: 至于你
  rationale: 连词加独立的第二人称阴性单数代词形成强调并带有转折性话题转换；“至于你”自然保留了对妇人的特别指向。
- source_word: ק֖וּמִי
  choice: 起来
  rationale: קום的阴性单数命令式；“起来”既准确又符合现代汉语的庄重叙事语体。
- source_word: לְכִ֣י
  choice: 去吧
  rationale: הלך的阴性单数命令式；结合下文目的地，译作“去吧”简洁自然。
- source_word: לְ/בֵיתֵ֑/ךְ
  choice: 回家
  rationale: 字面为“到你的房屋”；在此语境是返回自己的住处，现代汉语用“回家”最自然，并保留方向含义。
- source_word: בְּ/בֹאָ֥ה
  choice: 一进
  rationale: 介词ב加בוא的不定式构造表达时间；“一……就……”清楚呈现到达时随即发生的结果。
- source_word: רַגְלַ֛יִ/ךְ
  choice: 你的脚
  rationale: 原文明确使用“你的脚”这一身体部位意象指人的到达；正文保留其具体、生动的表达。
- source_word: הָ/עִ֖ירָ/ה
  choice: 城
  rationale: 名词带方向词尾，表示进入城中；“进城”自然包含这一方向意义。
- source_word: וּ/מֵ֥ת
  choice: 就会死
  rationale: 连接词加完成式在预言语境中指将来的结果；“就会死”与前面的时间结构衔接自然。
- source_word: הַ/יָּֽלֶד
  choice: 孩子
  rationale: יֶלֶד可指孩子或男孩；本节重点是特定的孩子而非其性别，因此译作“孩子”。
