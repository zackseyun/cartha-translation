source:
  edition: WLC
  text: לְכִ֞י אִמְרִ֣י לְ/יָרָבְעָ֗ם כֹּֽה אָמַ֤ר יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל יַ֛עַן אֲשֶׁ֥ר הֲרִימֹתִ֖י/ךָ מִ/תּ֣וֹךְ הָ/עָ֑ם וָ/אֶתֶּנְ/ךָ֣ נָגִ֔יד עַ֖ל עַמִּ֥/י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/007.yaml
  text: 'Go and say to Jeroboam[a], ‘Thus says Yahweh[b], the God of Israel: Because I raised you up from among the people and made you ruler over my people Israel,’'
translation:
  language: zh_hans
  text: 你去告诉耶罗波安：‘以色列的神雅威如此说：因为我从百姓中高举了你[a]，立你作我民以色列的领袖[b]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “高举了你”也可译作“提升了你”。
    reason: lexical_alternative
  - marker: b
    text: “立你作……领袖”原文直译为“把你赐下作……领袖”，也可译作“任命你作……领袖”。
    reason: lexical_alternative
lexical_decisions:
- source_word: לְכִי אִמְרִי
  choice: 你去告诉
  rationale: 两个阴性单数祈使式命令受话者前去传达信息；现代汉语以“你去告诉”自然表达，性别不在动词形态中标明。
- source_word: לְיָרָבְעָם
  choice: 耶罗波安
  rationale: 按现代中文圣经人名的通行音译处理。
- source_word: כֹּה אָמַר
  choice: 如此说
  rationale: 保留先知传信公式庄重而可辨认的形式。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以音译呈现四字神名，而不以“主”这一称号代替。
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: 以色列的神
  rationale: 准确表达原文的属格结构和身份说明。
- source_word: יַעַן אֲשֶׁר
  choice: 因为
  rationale: 清楚保留原文引出后续审判理由的因果关系；本节句意延续至下文。
- source_word: הֲרִימֹתִיךָ
  choice: 我从百姓中高举了你
  rationale: 使役形表达把耶罗波安提升到更高地位；“高举”兼顾原有空间隐喻和政治升迁含义。
- source_word: מִתּוֹךְ הָעָם
  choice: 从百姓中
  rationale: 自然表达从群体内部选拔、提升之意。
- source_word: וָאֶתֶּנְךָ נָגִיד
  choice: 立你作……领袖
  rationale: 原文直译为“把你赐下作领袖”，语境所指是授予职分；“立你作”在中文中自然，并保留任命与神主动施行的意味。
- source_word: עַל עַמִּי יִשְׂרָאֵל
  choice: 我民以色列的
  rationale: 与“领袖”结合为“我民以色列的领袖”，既保留神对百姓的所属宣告，也清楚说明治理对象。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用神的专名；“雅威”以现代汉语音译呈现该名，避免用称号“主”取代专名。
- issue: 政治职衔 נָגִיד 的译法
  choice: 领袖
  alternative: 统治者；君王；首领
  rationale: 该词强调由神设立、在百姓之上承担治理权的人；“领袖”既体现权柄，又不把原文限定为特定王室称号。
- issue: יַעַן אֲשֶׁר 所引因果句在本节末尾尚未完结
  choice: 保留“因为”及句末逗号
  alternative: 改写成本节内可独立成句的陈述
  rationale: 原文的理由从本节开始，并在后文接续审判宣告；保留未完句式可呈现原有论证结构，不提前替文本补足结论。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。“如此说”保留先知传信公式；“我民以色列”保留圣约语境中的所属表达。句末不闭合，是因为本节的“因为”从句继续进入下文。
