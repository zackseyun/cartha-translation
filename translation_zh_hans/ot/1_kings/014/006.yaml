base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/006.yaml
  text: And when Ahijah heard the sound of her feet as she came in at the doorway[a], he said, “Come in, wife of Jeroboam[b]. Why are you disguising yourself? For I am sent to you with a hard message.”
translation:
  language: zh_hans
  text: 亚希雅听见她来到门口的脚步声，就说：“进来吧，耶罗波安的妻子！你为什么要乔装改扮呢？我奉差遣来向你传达严厉的话。[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“我奉差遣到你这里，是严厉的”；所指的“话”或“消息”没有明说。
    reason: 说明希伯来文在 קָשָׁה 处省略了所修饰的名词，保留其简约和歧义。
lexical_decisions:
- source_word: קוֹל רַגְלֶיהָ
  choice: 她……的脚步声
  rationale: 希伯来文直译为“她脚的声音”；现代汉语用“脚步声”自然清楚，也完整保留听觉意象。
- source_word: בָּאָה בַפֶּתַח
  choice: 走到门口
  rationale: בַפֶּתַח 指入口或门口；结合分词所描述的动作，译作“走到门口”符合场景，同时不把它限定为实体门扇。
- source_word: בֹּאִי
  choice: 进来吧
  rationale: 这是对女性所用的单数命令式；“进来吧”是自然的现代汉语直接引语。
- source_word: אֵשֶׁת יָרָבְעָם
  choice: 耶罗波安的妻子
  rationale: 准确表达属格结构，并保留亚希雅直接揭明她身份的叙事效果。
- source_word: לָמָּה זֶּה אַתְּ מִתְנַכֵּרָה
  choice: 你为什么装扮成别人呢？
  rationale: התפעל 形态在这里表示使自己显得像陌生人或另一个人。“装扮成别人”既贴近词义，也呼应上文她隐瞒身份的行动。
- source_word: שָׁלוּחַ אֵלַיִךְ
  choice: 我奉差遣来告诉你
  rationale: 被动分词表达受差遣后的现时使命。“奉差遣”保留差遣者未明说的特点；“来告诉你”顺应汉语表达，并与下文省略的内容衔接。
- source_word: קָשָׁה
  choice: 一个严厉的消息
  rationale: 原文只有阴性形容词“严厉的／艰难的”，所修饰的名词省略。按先知传话的语境补出“消息”，但用脚注保留原文的省略和其他理解空间。
theological_decisions:
- issue: קָשָׁה 前后省略的名词
  choice: 正文补作“一个严厉的消息”
  alternative: “严酷的话／凶信”，或保持近似直译“我奉差遣到你这里，是严厉的”
  rationale: 原文并未明说“消息”或“话”，但语境明显指亚希雅受差遣向她传达严厉的内容。正文补“消息”使汉语完整，脚注则说明原文的省略，避免把隐含对象绝对化。
- issue: 差遣者是否明确为上帝
  choice: 译作“奉差遣”，不在本句补出差遣者
  alternative: “上帝差遣我来”
  rationale: 语境可使读者理解差遣来自上帝，但本句希伯来文没有明说主语；不补“上帝”可保存原文的表达方式。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“装扮成别人”比单说“乔装”更直接呈现假扮另一身份的含义；“严厉的消息”保持先知宣告的沉重感。唯一脚注标记[a]已置于相关句末。
