  to: 所罗门的儿子罗波安在犹大作王[a]。罗波安登基时四十一岁，在耶路撒冷作王十七年；耶路撒冷就是耶和华从以色列众支派中拣选出来、把他的名安置在那里的城[b]。罗波安的母亲名叫拿玛，是亚扪女子。
  rationale: 修订以“把他的名安置在那里”直接对应原文的动作和地点，同时保留该表达的具体而不完全解释的意象；脚注继续提供必要的文化背景。将“耶路撒冷”说明为同位语，清楚呈现其为被拣选之城。末句以“亚扪女子”明确原文对拿玛所用的阴性族称。
