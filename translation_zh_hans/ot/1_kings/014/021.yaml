  text: וּ/רְחַבְעָם֙ בֶּן שְׁלֹמֹ֔ה מָלַ֖ךְ בִּֽ/יהוּדָ֑ה בֶּן אַרְבָּעִ֣ים וְ/אַחַ֣ת שָׁנָה֩ רְחַבְעָ֨ם בְּ/מָלְכ֜/וֹ וּֽ/שֲׁבַ֨ע עֶשְׂרֵ֥ה שָׁנָ֣ה מָלַ֣ךְ בִּ/ירוּשָׁלִַ֗ם הָ֠/עִיר אֲשֶׁר בָּחַ֨ר יְהוָ֜ה לָ/שׂ֨וּם אֶת שְׁמ֥/וֹ שָׁם֙ מִ/כֹּל֙ שִׁבְטֵ֣י יִשְׂרָאֵ֔ל וְ/שֵׁ֣ם אִמּ֔/וֹ נַעֲמָ֖ה הָ/עַמֹּנִֽית־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/021.yaml
  text: Rehoboam the son of Solomon reigned in Judah[a]. Rehoboam was forty-one years old when he became king, and he reigned seventeen years in Jerusalem, the city that Yahweh had chosen from all the tribes of Israel to put his name there[b]. And his mother’s name was Naamah the Ammonite woman.
translation:
  language: zh_hans
  text: 所罗门的儿子罗波安在犹大作王[a]。罗波安登基时四十一岁，在耶路撒冷作王十七年；耶路撒冷就是耶和华从以色列众支派中拣选出来、把他的名安置在那里的城[b]。罗波安的母亲名叫拿玛，是亚扪女子。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在犹大作王”也可译作“治理犹大”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译为“把他的名放在那里”。这是盟约性的表达，指耶路撒冷与耶和华的临在和敬拜具有特殊关联。
    reason: cultural_note
lexical_decisions:
- source_word: מָלַךְ בִּיהוּדָה
  choice: 在犹大作王
  rationale: מָלַךְ表示君王施行统治，בִּיהוּדָה直译为“在犹大”；“在犹大作王”既贴近希伯来文，也符合现代汉语表达。
- source_word: בְּמָלְכוֹ
  choice: 登基时
  rationale: 介词加不定式结构指开始为王之时；“登基时”简洁地表达即位年龄，并与随后在位年数区分。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的神名音译“耶和华”，把四字神名作为专名呈现，而非以称号替代。
- source_word: מִכֹּל שִׁבְטֵי יִשְׂרָאֵל
  choice: 从以色列众支派中
  rationale: מִן在此表示从一个群体中作出拣选；“从……中”准确传达这一关系。
- source_word: לָשׂוּם אֶת־שְׁמוֹ שָׁם
  choice: 要立他名
  rationale: 保留“立／置放其名”这一盟约性表达，不扩写为“使他的名居住”，因为后者并非本节的直接措辞；地点意义已由“耶路撒冷”与“城”清楚表达。
- source_word: וְשֵׁם אִמּוֹ נַעֲמָה
  choice: 罗波安的母亲名叫拿玛
  rationale: 用自然现代汉语重现《列王纪》中母亲姓名的正式记载，并明确代词所指。
- source_word: הָעַמֹּנִית
  choice: 是亚扪人
  rationale: 阴性族称说明拿玛的族属；现代汉语通常无需另加女性后缀，“亚扪人”自然且准确。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。中文稿以“耶和华”保留专名性质，并兼顾现代普通中文读者的辨识度；“雅威”是较接近学术重构读音的可行替代。
- issue: “立他名”这一表达的含义
  choice: 正文保留原有意象，以脚注解释
  alternative: 意译为“作为他临在和受敬拜之处”
  rationale: 原文说“把他的名放在那里”，具有盟约、临在和敬拜的背景意义。正文不把这些含义全部释入，以免消除原文的神学意象和张力。
translation_notes:
  register: 采用庄重而清晰的现代标准汉语；以“作王、登基、拣选”等通行词汇保持历史叙事的正式感。拆分较长句子以便普通读者理解，同时保留希伯来文“立他名”的核心意象。
