base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/024.yaml
  text: There were also cult prostitutes in the land[a]. They did according to all the abominations of the nations that Yahweh had driven out before the sons of Israel.
translation:
  language: zh_hans
  text: 境内也有男性庙妓[a]；他们行了耶和华从以色列人面前赶出的列国所行的一切可憎之事。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “男性庙妓”原文为阳性单数，在这里可作一类人的统称；也可译作“从事淫乱祭祀的男子”或“祭祀娼妓”。这个希伯来词指与非法宗教礼仪有关的人，但其具体身份和活动仍有争议。
    reason: 说明原词的阳性形式、集合性用法，以及其礼仪与性行为含义的不确定性。
lexical_decisions:
- source_word: וְגַם
  choice: 也有
  rationale: 结合存在句自然表达附加的一项罪状。
- source_word: קָדֵשׁ
  choice: 男庙妓
  rationale: 该阳性单数名词在此作存在性、类别性的用法，指参与非法祭祀性行为的男子；“男庙妓”简明保留其男性及宗教礼仪语境，同时以脚注说明词义上的不确定性。
- source_word: הָיָה בָאָרֶץ
  choice: 境内也有
  rationale: 将存在动词和地点短语译为自然的现代汉语存在句；“境内”承接犹大国的语境。
- source_word: עָשׂוּ כְּכֹל
  choice: 仿效……行了……一切
  rationale: 把动词与比较结构合并为自然汉语，保留照样而行及行为范围完整的意思。
- source_word: הַתּוֹעֲבֹת
  choice: 可憎的事
  rationale: 保留该词在偶像崇拜和道德宗教语境中的强烈否定评价，又比名词化的“可憎之事”更符合现代汉语。
- source_word: הַגּוֹיִם
  choice: 列国
  rationale: 指迦南地区非以色列的各民族；“列国”庄重而符合旧约历史语境。
- source_word: הוֹרִישׁ
  choice: 赶出去
  rationale: 希伯来语使役形在这里表示使原居民失去土地并被逐离；此译法自然且符合征服迦南的语境。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代简体中文圣经读者最熟悉、可辨识的四字神名译法。
- source_word: מִפְּנֵי
  choice: 从……面前
  rationale: 保留原文空间性和关系性的表达，同时在汉语中通顺。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 该短语在这里是民族称谓；译作“以色列人”准确、自然，避免现代汉语中“以色列的儿子们”可能造成的误解。
theological_decisions:
- issue: קָדֵשׁ 在非法崇拜及性行为语境中的译法
  choice: 男庙妓
  alternative: 祭祀娼妓；庙妓；从事淫乱祭祀的男子
  rationale: 阳性形式支持明确其为男性，而词根所含的礼仪关联要求保留宗教崇拜背景；不采用传统上容易引入与原词无关联想的称呼。脚注承认这一古代身份和活动的具体性质仍有词义争议。
- issue: בְּנֵי יִשְׂרָאֵל 的表达
  choice: 以色列人
  alternative: 以色列的子孙
  rationale: 这里是约定俗成的民族称谓，并非强调生理性别；现代汉语用“以色列人”最清楚，也没有消除所指群体。
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: “耶和华”是现代中文圣经传统中辨识度最高的专名形式；它作为专名区别于“主”，不把四字神名改写为称号。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“可憎的事”保留先知性、宗教性的强烈评价；“仿效……行了……”避免生硬直译，同时维持列国行为与犹大行为之间的比较关系。
