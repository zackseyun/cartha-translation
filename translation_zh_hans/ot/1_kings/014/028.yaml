  text: וַ/יְהִ֛י מִ/דֵּי בֹ֥א הַ/מֶּ֖לֶךְ בֵּ֣ית יְהוָ֑ה יִשָּׂאוּ/ם֙ הָֽ/רָצִ֔ים וֶ/הֱשִׁיב֖וּ/ם אֶל תָּ֥א הָ/רָצִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/028.yaml
  text: And whenever the king entered the house of Yahweh[b][a], the guards would carry them and then return them to the guards’ chamber.
translation:
  language: zh_hans
  text: 每逢王进入耶和华的殿，护卫[b]就带着这些盾牌[a]，随后又把它们送回护卫室。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “这些盾牌”指罗波安为替代示撒夺走的金盾牌而制造的铜盾牌（见王上14:27）。
    reason: cross_reference
  - marker: b
    text: “护卫”原文直译为“奔跑者”；在王室语境中，指随侍君王的卫士或近身护卫。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי מִדֵּי בֹא
  choice: 每逢……进入
  rationale: מִדֵּי加不定式表示反复发生的惯常情形；“每逢”自然地保留这一反复意味。叙事连接词וַיְהִי无需生硬译为“事情发生了”。
- source_word: בֵּית יְהוָה
  choice: 耶和华的殿
  rationale: בַּיִת在此指圣殿建筑；译作“殿”比直译“家”更符合现代汉语，同时保留神名יהוה。
- source_word: יִשָּׂאוּם
  choice: 就拿着这些盾牌
  rationale: 未完成式在惯常结构中表示反复的过去动作。“这些盾牌”明确承接上一节的铜盾牌；“拿着”适合护卫陪同王进入时携带盾牌的场景，且不额外规定具体携带方式。
- source_word: הָרָצִים
  choice: 护卫
  rationale: 该词字面为“奔跑者”，但在王室语境中指随侍君王、在王前奔跑的卫士；“护卫”以现代汉语传达其职能。
- source_word: וֶהֱשִׁיבוּם
  choice: 随后再把它们送回
  rationale: שׁוב的使役形表示使之返回、带回原处；“送回”自然表达仪式结束后的归还动作。
- source_word: אֶל תָּא הָרָצִים
  choice: 护卫室
  rationale: תָּא指房间或小室；“护卫室”简洁表达该房间属于或供护卫使用。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 耶和华
  alternative: 雅威／上主
  rationale: 采用现代中文圣经读者最熟悉的专名形式“耶和华”，把原文的专名与一般称号“主”区分开；此处不涉及教派性解释。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“每逢……就……”清楚呈现惯常反复的行动；以“殿”表达圣殿，以“护卫室”避免生硬的所有格结构。所有代词所指均按上下文适度明示，但脚注保留跨节说明。
