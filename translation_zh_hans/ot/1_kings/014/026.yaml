  text: וַ/יִּקַּ֞ח אֶת אֹצְר֣וֹת בֵּית יְהוָ֗ה וְ/אֶת אֽוֹצְרוֹת֙ בֵּ֣ית הַ/מֶּ֔לֶךְ וְ/אֶת הַ/כֹּ֖ל לָקָ֑ח וַ/יִּקַּח֙ אֶת כָּל מָגִנֵּ֣י הַ/זָּהָ֔ב אֲשֶׁ֥ר עָשָׂ֖ה שְׁלֹמֹֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/026.yaml
  text: He took the treasures of the house of Yahweh and the treasures of the king’s house; he took everything[a]. He also took all the gold shields that Solomon had made.
translation:
  language: zh_hans
  text: 他拿走了雅威的殿[a]中的财宝和王宫中的财宝；他把一切都拿走了。他也拿走了所罗门所造的所有金盾牌。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“雅威的家”，即圣殿。
    reason: 保留 בֵּית יְהוָה 的字面表达，同时说明其语境所指。
lexical_decisions:
- source_word: וַיִּקַּח / לָקָח
  choice: 拿走
  rationale: 基本义是“拿、取”；在劫掠语境中，“拿走”自然地表达财物被带走，同时保留原文反复使用同一动词的强调，不额外加入“抢夺”的强烈色彩。
- source_word: אֹצְרוֹת
  choice: 财宝
  rationale: 该词也可指“宝库”，但这里是被拿走的对象，按语境更可能指宝库中的贵重物品，因此译作“财宝”。
- source_word: בֵּית יְהוָה
  choice: 雅威殿
  rationale: 原文直译为“雅威的家”，在本处指圣殿；正文用现代汉语清楚表达所指，脚注保留原文意象。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文四字神名的通常拟音译作“雅威”，保留其作为专名的性质，而不以“主”这一称号代替。
- source_word: בֵּית הַמֶּלֶךְ
  choice: 王宫
  rationale: 字面为“王的家”，在此指王的宫殿；“王宫”是清楚、自然的现代汉语。
- source_word: וְאֶת הַכֹּל לָקָח
  choice: 他把一切都拿走了
  rationale: 保留原文总结性的独立分句及“全都”的强调意味。
- source_word: מָגִנֵּי הַזָּהָב
  choice: 金盾牌
  rationale: 准确表达由金子制成或以金子装饰的盾牌；“金盾牌”符合简洁自然的现代汉语。
- source_word: אֲשֶׁר עָשָׂה שְׁלֹמֹה
  choice: 所罗门所造的
  rationale: 忠实保留关系从句；不擅自说明所罗门是亲手制作还是命人制作。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用以色列上帝的专名。译作“雅威”保留专名，并较贴近学界对该名读音的通行重构；不用称号“主”取代。
- issue: בֵּית יְהוָה 的表达
  choice: 正文译“雅威殿”，脚注注明字面意思
  alternative: 雅威的家
  rationale: “殿”明确交代本处所指的圣殿，而脚注让读者看见原文“家”的比喻性表达，避免丢失其神学与文学意象。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“拿走”贯穿全节，以对应原文 לקח 的重复；分号和独立短句保留“把一切都拿走了”的总结与强调。
