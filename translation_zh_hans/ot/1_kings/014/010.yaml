  text: לָ/כֵ֗ן הִנְ/נִ֨י מֵבִ֤יא רָעָה֙ אֶל בֵּ֣ית יָרָבְעָ֔ם וְ/הִכְרַתִּ֤י לְ/יָֽרָבְעָם֙ מַשְׁתִּ֣ין בְּ/קִ֔יר עָצ֥וּר וְ/עָז֖וּב בְּ/יִשְׂרָאֵ֑ל וּ/בִֽעַרְתִּי֙ אַחֲרֵ֣י בֵית יָרָבְעָ֔ם כַּ/אֲשֶׁ֛ר יְבַעֵ֥ר הַ/גָּלָ֖ל עַד תֻּמּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/010.yaml
  text: Therefore[a], behold, I am bringing disaster on the house of Jeroboam, and I will cut off from Jeroboam every male, bond and free in Israel, and I will burn away after the house of Jeroboam[b], just as one burns away dung until it is all gone.
translation:
  language: zh_hans
  text: 所以，看哪，我必降灾祸给耶罗波安家；我要从耶罗波安家剪除所有男子[a]，无论在以色列是受约束的还是自由的[b]；我要彻底清除耶罗波安家，正如人清除粪便，直到除尽。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“向墙撒尿的人”，是指男性的粗俗说法。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译为“受约束的和被弃置的”。这个对语的确切社会指向不完全确定，常被理解为“为奴的和自由的”；它很可能表示不分任何类别、全都包括在内。
    reason: lexical_alternative
lexical_decisions:
- source_word: רָעָה
  choice: 灾祸
  rationale: 在审判宣告中指上帝将要降下的灾难，而非道德意义上的“邪恶”；“灾祸”自然且保留严厉语气。
- source_word: וְהִכְרַתִּי
  choice: 剪除
  rationale: 保留כרת在审判语境中使人或家系断绝的强烈含义，也与耶罗波安王朝被彻底除灭的语境相称。
- source_word: מַשְׁתִּין בְּקִיר
  choice: 所有的男子
  rationale: 这是指男性的粗俗希伯来习语；正文传达实际所指，原有直译及其粗俗色彩在脚注中说明。
- source_word: עָצוּר וְעָזוּב
  choice: 无论受管束的还是自由的
  rationale: 尽量保留这一词组的对举形式及其不确定性；在本句中它很可能是表示无一例外的两极统称。
- source_word: וּבִעַרְתִּי אַחֲרֵי בֵית יָרָבְעָם
  choice: 我要把耶罗波安家清除干净
  rationale: בער与下文清除粪便的比喻相呼应，重点在彻底除去；“清除干净”在现代汉语中自然，并体现אַחֲרֵי所加强的彻底性。
- source_word: הַגָּלָל
  choice: 粪便
  rationale: 保留原文刻意使用的粗鄙、蔑视性意象，不以“污秽”或“垃圾”等较弱词语淡化。
- source_word: עַד תֻּמּוֹ
  choice: 直到除尽
  rationale: 简洁表达彻底清除、毫无剩余的意思，并与前面的“清除”构成自然呼应。
theological_decisions:
- issue: 是否弱化上帝审判宣告的严厉程度
  choice: 采用“降灾祸”“剪除”“清除粪便”“除尽”等直接而强烈的措辞
  alternative: 采用“带来麻烦”“移走”等较温和的表达
  rationale: 原文的审判语气严厉，且粪便比喻有意表达蔑视和彻底除灭；译文不应因文体顾虑而淡化。
- issue: עָצוּר וְעָזוּב所涵盖的人群
  choice: 保留对举为“受管束的还是自由的”，并在脚注说明其可能是表示全体的两极统称
  alternative: 直接释义为“所有人”或确定译作“奴仆和自由人”
  rationale: 该固定词组的确切社会指向并不完全确定；正文保留形式张力，脚注交代主要解释，避免将不确定含义定死。
translation_notes:
  register: 采用庄重、直接的现代标准汉语。以“看哪”保留审判宣告的提示语；用分号和“一個也不留下”理清长句层次。正文保留原文的严厉性与粪便意象，同时通过脚注交代粗俗习语及疑难对语的歧义。
