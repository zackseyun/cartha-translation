- from: 凡属耶罗波安的人，死在城里的[a]，必被狗吃掉；死在田野的，必被天空的飞鸟吃掉[b]，因为雅威已经说了。
  to: 凡属耶罗波安的人，若死在城里，就必被狗吃掉；若死在田野，就必被天上的飞鸟吃掉[b]，因为雅威已经如此宣告。
  rationale: 修订以“若……就……”厘清两个平行条件分句，并在第二分句保留同一主语范围。“天上的飞鸟”更符合现代汉语习惯且忠实于原文。“已经如此宣告”使神圣宣告的完成与确定性在中文中更庄重自然。脚注a仍保留原文名词短语的字面形式；脚注b提供贴近原文及传统性的替代译法。
