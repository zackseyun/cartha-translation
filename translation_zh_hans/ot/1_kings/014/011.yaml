base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/011.yaml
  text: Anyone belonging to Jeroboam who dies in the city[a], the dogs will eat; and anyone who dies in the field, the birds of the sky will eat[b], for Yahweh has spoken.
translation:
  language: zh_hans
  text: 凡属耶罗波安的人，若死在城里，就必被狗吃掉；若死在田野，就必被天上的飞鸟吃掉[b]，因为雅威已经如此宣告。
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 也可译作“天空中的飞鸟”或“空中的飞鸟”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמֵּת לְיָרָבְעָם
  choice: 凡属耶罗波安的人，死在……的
  rationale: 希伯来语直译近似“属于耶罗波安的死者”，在本句中按分配意义指凡属耶罗波安一方或家族而死亡的人。译文用自然汉语表达这种归属关系，同时以脚注保留原文形式。
- source_word: בָּעִיר
  choice: 在城里
  rationale: 直接表达带冠词名词的地点意义，并与后文“在田野”形成对照。
- source_word: יֹאכְלוּ הַכְּלָבִים
  choice: 必被狗吃掉
  rationale: אָכַל的基本义是“吃”。被动式汉语清楚表达死者是受事；“吃掉”自然传达尸体被吃尽的可怕景象，而不另加“吞噬”等强化词。
- source_word: וְהַמֵּת בַּשָּׂדֶה
  choice: 死在田野的
  rationale: 保留与前一分句平行的省略结构。“田野”较直接对应שָׂדֶה，也清楚呈现城内与野外的对比。
- source_word: עוֹף הַשָּׁמַיִם
  choice: 天空的飞鸟
  rationale: עוֹף是集合名词，可指飞禽；שָׁמַיִם在此指天空。“天空的飞鸟”既贴近原文，也符合现代汉语。
- source_word: כִּי יְהוָה דִּבֵּר
  choice: 因为雅威已经说了
  rationale: כִּי说明判决必然实现的根据；完成式דִּבֵּר表达神的宣告已经发出。“雅威”直接音译圣名יהוה。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。采用“雅威”保留其专名性质，不以称号“主”替代，也不在正文中采用较传统但音值依据较弱的“耶和华”。
- issue: “属耶罗波安的人”的范围
  choice: 不在正文中明确限定为“家人”或“后裔”
  alternative: 耶罗波安家中的人；耶罗波安的后裔
  rationale: לְיָרָבְעָם明确表示与耶罗波安的归属关系，但本短语本身没有明说“家”或“后裔”。正文保留较宽的关系表达，脚注说明语境所指，避免过度限定。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。两个平行分句均用“死在……的，必被……吃掉”，保留原文严厉、简洁的审判语气；不使用过度古雅的“凡……者”句式。
