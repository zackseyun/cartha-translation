base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/025.yaml
  text: In the fifth year of King Rehoboam[a], Shishak king of Egypt came up against Jerusalem.
translation:
  language: zh_hans
  text: 罗波安王在位第五年，埃及王示撒上来攻打[a]耶路撒冷。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“进军攻打”。希伯来语在军事语境中常用“上去／上来”表示向某地推进，特别是向重要城市进军。
    reason: 说明希伯来语军事行进惯用语，并提供更自然的汉语替代译法。
lexical_decisions:
- source_word: וַיְהִי
  choice: 不另译连接语
  rationale: 该叙事形式引出新的事件发展；现代汉语可直接从时间状语起句，无须添加“事情是这样”或“后来”等原文未明说的词。
- source_word: בַּשָּׁנָה הַחֲמִישִׁית לַמֶּלֶךְ רְחַבְעָם
  choice: 罗波安王在位第五年
  rationale: 这是君王纪年公式；补出“在位”能以自然、明确的现代汉语表达介词 לַ 所标示的执政年次。
- source_word: עָלָה ... עַל
  choice: 上来攻打
  rationale: 该组合在军事语境中表示向某地进军、与之为敌。“上来”保留原文的方向性意象，“攻打”则自然传达 עַל 在这里的敌对含义，同时不把行动过度具体化为已经攻陷。
- source_word: שושק
  choice: 示撒
  rationale: 采用现代中文圣经传统中与希伯来文本形式相对应的通行译名，不以其可能的埃及历史身份名称取代经文名称。
- source_word: מֶלֶךְ מִצְרַיִם
  choice: 埃及王
  rationale: 以简洁自然的汉语称号表达“埃及的王”，并与人名“示撒”构成同位关系。
- source_word: יְרוּשָׁלִָם
  choice: 耶路撒冷
  rationale: 采用现代汉语中通行的圣经地名译法。
theological_decisions: []
