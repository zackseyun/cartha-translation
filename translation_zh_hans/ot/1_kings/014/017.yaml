base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/017.yaml
  text: Then Jeroboam’s wife arose and went and came to Tirzah. As she came to the threshold of the house[a], the boy died.
translation:
  language: zh_hans
  text: 耶罗波安的妻子起身离去，来到得撒。她来到屋子的门槛时[a]，孩子就死了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“当她来到屋子的门槛时。”
    reason: 原文独立代词加分词可表达此事发生的时间背景；可译作“她来到……时”或“当她来到……时”。“屋子”对应原文带定冠词的“房屋”，不在正文中进一步明确为“自家”。
lexical_decisions:
- source_word: וַתָּקָם
  choice: 起身
  rationale: קום的Qal叙事未完成式推进连续动作；“起身”既保留希伯来叙事风格，也不把含义限缩为单纯出发。
- source_word: אֵשֶׁת יָרָבְעָם
  choice: 耶罗波安的妻子
  rationale: 该组合词直接表示婚姻关系；此译自然、清楚。
- source_word: וַתֵּלֶךְ
  choice: 离去
  rationale: הלך在叙事中表示她从先知那里动身而去；“离去”与前面的“起身”衔接自然，又不额外规定行程方式。
- source_word: וַתָּבֹא תִרְצָתָה
  choice: 来到得撒
  rationale: בוא加地名末尾的方向词尾表示朝得撒而来；“来到得撒”保留目的地含义，不擅自说明是否经过城门。
- source_word: הִיא בָּאָה
  choice: 她来到……时
  rationale: 独立代词加分词构成伴随或时间背景；译作“……时”自然表达孩子死亡发生的关键时刻。
- source_word: בְסַף הַבַּיִת
  choice: 自家门槛
  rationale: סַף明确指门槛或门下横木；הַבַּיִת在语境中最自然地指她的家。“自家”使现代汉语顺畅，但脚注保留较直译的可能。
- source_word: וְהַנַּעַר
  choice: 孩子
  rationale: נַעַר可指男孩、少年或孩子；此处指耶罗波安患病的儿子，“孩子”符合上下文且不额外限定年龄。
- source_word: מֵת
  choice: 就死了
  rationale: מות的完成式在此叙事节点表达死亡事件，应验上一节的预言；“就”自然呈现动作紧接门槛时发生，但不另加因果解释。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。保留“起身”所体现的希伯来叙事节奏，以“离去，来到”避免生硬重复；专名按通行中文圣经译名作“耶罗波安”“得撒”。
