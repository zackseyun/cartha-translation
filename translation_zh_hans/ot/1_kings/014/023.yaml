base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/023.yaml
  text: They too built for themselves high places[a], pillars, and Asherah poles on every high hill and under every green tree.
translation:
  language: zh_hans
  text: 他们也为自己建造丘坛、立柱和亚舍拉柱[a]，设在每座高冈上和每棵青翠的树下。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“亚舍林”或“圣木柱”；这个希伯来语词指与女神亚舍拉有关的祭祀物件。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבְנוּ
  choice: 建造
  rationale: בנה的基本义是“建造”；在本句中统摄一系列祭祀设施。中文为行文自然，对柱像和亚舍拉柱补用“立起”，不改变原意。
- source_word: גַם הֵמָּה
  choice: 他们也
  rationale: 保留גם的追加意味，并承接上文所述犹大的罪。
- source_word: לָהֶם
  choice: 为自己
  rationale: 此处介词加代词具有受益或反身意味，指他们为自己设置这些祭祀场所和物件。
- source_word: בָּמוֹת
  choice: 丘坛
  rationale: 该词指地方性的祭祀场所，常设于高处，但并非每次都单指地势；“丘坛”简洁保留其宗教及传统语义。
- source_word: מַצֵּבוֹת
  choice: 柱像
  rationale: 该词指竖立作祭祀用途的石柱或立石；“柱像”在中文圣经语境中能表达其祭祀性质，又不武断认定其必有雕刻形象。
- source_word: אֲשֵׁרִים
  choice: 亚舍拉柱
  rationale: 复数形式在此与丘坛、柱像并列，最自然是指与女神亚舍拉有关的祭祀物件。“亚舍拉柱”既保留专名联系，也表明所指为物件；具体形制仍有不确定性，故加注说明。
- source_word: עַל כָּל גִּבְעָה גְבֹהָה
  choice: 在每座高冈上
  rationale: 直译地形和分布范围，也保留此类描写非法敬拜地点的固定修辞。
- source_word: וְתַחַת כָּל עֵץ רַעֲנָן
  choice: 每棵青翠树下
  rationale: רַעֲנָן表示青绿、繁茂；“青翠”自然地传达树木茂盛常青的景象。
theological_decisions:
- issue: אֲשֵׁרִים是指女神亚舍拉本身，还是与她有关的祭祀物件
  choice: 按祭祀物件译作“亚舍拉柱”
  alternative: “亚舍林”“圣木柱”或“亚舍拉像”
  rationale: 该词与丘坛和柱像并列，并受“建造”支配，在此更可能指实体祭祀物件，而非女神本身。不过其具体形制不能完全确定，因此正文避免译成过度具体的“木杆”，并以脚注保留其他可能译法。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“建造丘坛，立起……”符合中文搭配；地点短语前置，使全句自然，同时保持原文“每座……每棵……”的遍及语气。脚注标记置于其实际解释的“亚舍拉柱”之后。
