  text: וְ/הֵקִים֩ יְהוָ֨ה ל֥/וֹ מֶ֨לֶךְ֙ עַל יִשְׂרָאֵ֔ל אֲשֶׁ֥ר יַכְרִ֛ית אֶת בֵּ֥ית יָרָבְעָ֖ם זֶ֣ה הַ/יּ֑וֹם וּ/מֶ֖ה גַּם עָֽתָּה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/014.yaml
  text: And Yahweh will raise up for himself a king over Israel who will cut off the house of Jeroboam this day[a]. But what? Even now.
translation:
  language: zh_hans
  text: 耶和华必为自己兴起一位统治以色列的王；他必在这日剪除耶罗波安的家。可是什么呢？甚至现在[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节希伯来文结尾十分突兀且难解，近乎直译为：“可是什么呢？甚至现在。”末句省略了可明确其意思的成分。有人理解为强调审判的迫近或即时性，例如“还要说什么呢？甚至现在！”；但原文并未明确说审判“已经开始”。“在这日”也可能在语感上与这段突兀的结尾相连，句法关系并不完全确定。
    reason: 保留原文结尾的省略、突兀句法、时间短语可能的关联范围，以及不同理解；避免把“已经开始”这一解释写入正文。
lexical_decisions:
- source_word: וְהֵקִים
  choice: 必兴起
  rationale: 使役式在这里表示使某人起来、兴起或设立；“兴起”保留了上帝使一位君王登上历史舞台的希伯来语习惯表达。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代简体中文读者熟悉的专名“耶和华”译出四字神名，而不以“主”这一称号代替。
- source_word: לוֹ
  choice: 为自己
  rationale: 代词后缀最自然地回指主语耶和华，表示他为自己兴起这位王。
- source_word: מֶלֶךְ עַל־יִשְׂרָאֵל
  choice: 一位治理以色列的王
  rationale: עַל在王权语境中表示对以色列的统治；此译法比生硬的“在以色列之上的王”自然，同时保留政治管治之意。
- source_word: אֲשֶׁר יַכְרִית
  choice: 这王必……剪除
  rationale: כרת的使役式可指剪除、灭绝；“剪除”保留审判性的希伯来语意象，并明确关系代词所指。
- source_word: בֵּית יָרָבְעָם
  choice: 耶罗波安的家
  rationale: “家”保留圣经叙事中兼指家族和王朝的表达，不把含义收窄为单纯的“王朝”。
- source_word: זֶה הַיּוֹם
  choice: 在今日
  rationale: 贴近字面的“这日/今日”，并保留它与后面突兀短句之间难以确定的句法关系。
- source_word: וּמֶה גַּם עָתָּה
  choice: 但还说什么呢？甚至现在就已经开始了
  rationale: 原文结尾突兀、省略成分且意义困难。正文以自然中文传达判断已经迫近乃至启动的强调，但用脚注保留字面形式及其不确定性。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 两者都是对四字神名的音译；“耶和华”在现代中文圣经传统和普通读者中辨识度更高，并且仍将其作为专名而非称号译出。
- issue: 末句וּמֶה גַּם עָתָּה的理解
  choice: 正文表达审判甚至现在已经开始，同时以脚注说明原文的突兀和歧义
  alternative: 完全直译为“但什么呢？甚至现在”
  rationale: 希伯来语句法压缩且可能省略谓语。正文需要可读，但不能把一种解释冒充唯一含义，因此脚注列出近乎字面的形式和其他可能理解。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。“兴起”“剪除”“……的家”保留圣经叙事的传统意象；在正文中适度补足汉语所需成分，并借脚注明示希伯来文末句的省略与歧义。
