source:
  edition: WLC
  text: וְ/הִכָּ֨ה יְהוָ֜ה אֶת יִשְׂרָאֵ֗ל כַּ/אֲשֶׁ֨ר יָנ֣וּד הַ/קָּנֶה֮ בַּ/מַּיִם֒ וְ/נָתַ֣שׁ אֶת יִשְׂרָאֵ֗ל מֵ֠/עַל הָ/אֲדָמָ֨ה הַ/טּוֹבָ֤ה הַ/זֹּאת֙ אֲשֶׁ֤ר נָתַן֙ לַ/אֲב֣וֹתֵי/הֶ֔ם וְ/זֵרָ֖/ם מֵ/עֵ֣בֶר לַ/נָּהָ֑ר יַ֗עַן אֲשֶׁ֤ר עָשׂוּ֙ אֶת אֲשֵׁ֣רֵי/הֶ֔ם מַכְעִיסִ֖ים אֶת יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/015.yaml
  text: And Yahweh will strike Israel[a], as a reed sways in the water, and he will uproot Israel from this good land that he gave to their fathers, and scatter them beyond the River, because they made their Asherim[b], provoking Yahweh.
translation:
  language: zh_hans
  text: 耶和华必击打以色列，使以色列像水中的芦苇一样摇动；他必把以色列从他赐给他们祖先的这片美地上连根拔起，把他们分散到大河[a]那边，因为他们造了亚舍拉祭祀物[b]，惹耶和华发怒。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “大河”在这里指幼发拉底河。
    reason: cross_reference
  - marker: b
    text: 原文是“他们的亚舍拉”；指与女神亚舍拉有关的祭祀物，可能是木柱、神像或其他崇拜象征物。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִכָּה
  choice: 必击打
  rationale: 连词加完成式在这段预言中表达将来的审判；“必击打”既保留动作力度，也自然体现确定的未来语气。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代汉语中通行的专名形式音译四字神名，保留其作为以色列之神名字的性质，而不以称号替代。
- source_word: כַּאֲשֶׁר יָנוּד הַקָּנֶה בַּמַּיִם
  choice: 使他们像水中摇动的芦苇
  rationale: 保留芦苇在水中不稳定摇动的鲜明比喻；按汉语补出受影响者“他们”，使句法关系清楚。
- source_word: וְנָתַשׁ
  choice: 连根拔起
  rationale: 该动词常指拔除植物；此处用土地意象描写以色列被逐离应许之地，“连根拔起”保留原文隐喻。
- source_word: הָאֲדָמָה הַטּוֹבָה הַזֹּאת
  choice: 这片美地
  rationale: “地”在此指神所赐的土地；“美地”简洁保留“好的”这一评价，并符合庄重的圣经汉语表达。
- source_word: אֲשֶׁר נָתַן לַאֲבוֹתֵיהֶם
  choice: 他赐给他们祖先的
  rationale: אָבוֹת在这里指前代先祖；“祖先”在现代汉语中自然，并保留与赐地历史的连续性。
- source_word: וְזֵרָם
  choice: 把他们分散
  rationale: 该词表达驱散、散布；上下文指流亡各处，“分散”准确而不额外引入扬场等可能的词源意象。
- source_word: מֵעֵבֶר לַנָּהָר
  choice: 到大河那边
  rationale: 原文直称“那河/大河”，在历史地理语境中通常指幼发拉底河；正文保留原表达，脚注说明所指。
- source_word: יַעַן אֲשֶׁר
  choice: 因为
  rationale: 直接引出审判的原因，符合现代汉语因果表达。
- source_word: עָשׂוּ אֶת אֲשֵׁרֵיהֶם
  choice: 为自己造了亚舍拉神像
  rationale: אֲשֵׁרִים指与女神亚舍拉有关的祭祀物，其确切形制并不完全确定；“神像”便于普通读者理解，脚注保留其可能为木柱或其他象征物的歧义。
- source_word: מַכְעִיסִים אֶת יְהוָה
  choice: 惹耶和华发怒
  rationale: 明确表达使神动怒的语义，比仅译“触怒”更直接，也符合现代汉语。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 正文采用现代中文圣经读者最熟悉的专名形式“耶和华”，不以“主”等称号取代原文神名；“雅威”是另一种学术界常见拟音。
- issue: “大河”的具体所指
  choice: 正文保留“大河”，脚注说明是幼发拉底河
  alternative: 正文直接译作“幼发拉底河”
  rationale: 原文使用定指称谓 הַנָּהָר，而非河流专名；正文保留这一形式，脚注为现代读者补充历史地理信息。
- issue: אֲשֵׁרֵיהֶם 所指祭祀物的形制
  choice: 亚舍拉神像，并以脚注说明可能是木柱或其他祭祀象征物
  alternative: 亚舍拉木柱／亚舍拉像
  rationale: 该复数词明确与亚舍拉崇拜有关，但具体对象未必都能确定为木柱或拟人雕像；译文采用易懂的概括称呼，同时借脚注保存不确定性。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“连根拔起”保留土地与植物的审判意象；分号梳理连续预言动作。正文中的[a]、[b]均与脚注对应。
