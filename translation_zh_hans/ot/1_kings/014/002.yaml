  text: וַ/יֹּ֨אמֶר יָרָבְעָ֜ם לְ/אִשְׁתּ֗/וֹ ק֤וּמִי נָא֙ וְ/הִשְׁתַּנִּ֔ית וְ/לֹ֣א יֵֽדְע֔וּ כִּי אתי אֵ֣שֶׁת יָרָבְעָ֑ם וְ/הָלַ֣כְתְּ שִׁלֹ֗ה הִנֵּה שָׁם֙ אֲחִיָּ֣ה הַ/נָּבִ֔יא הֽוּא דִבֶּ֥ר עָלַ֛/י לְ/מֶ֖לֶךְ עַל הָ/עָ֥ם הַ/זֶּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/002.yaml
  text: Jeroboam said to his wife[a], “Please get up and disguise yourself, so that they will not know that you are the wife of Jeroboam, and go to Shiloh. Behold, Ahijah the prophet is there; he is the one who spoke concerning me[b], that I would be king over this people.”
translation:
  language: zh_hans
  text: 耶罗波安对妻子说：“请起来，乔装，这样人们就不会知道[a]你是耶罗波安的妻子。然后到示罗去。看哪，亚希雅先知就在那里；他就是那位曾论到我、说我必作这百姓的王的人[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“他们就不知道”；希伯来文没有明确说明主语是谁。
    reason: 保留希伯来文复数动词主语不明确的特点。
  - marker: b
    text: 或译：“他曾预言我作这百姓的王。”
    reason: 提示可将“论到我”和“作这百姓的王”按较紧凑的方式连接。
lexical_decisions:
- source_word: וַיֹּאמֶר יָרָבְעָם לְאִשְׁתּוֹ
  choice: 耶罗波安对妻子说
  rationale: 按希伯来叙事常用表达直译关系和言说动作，现代汉语自然清楚。
- source_word: קוּמִי נָא
  choice: 请起来
  rationale: 命令式表达“起来”，נָא 表示请求或缓和语气，用“请”保留其语用功能。
- source_word: וְהִשְׁתַּנִּית
  choice: 乔装一下
  rationale: 此处 התפעל 形式表示改变自己的外表以免被认出；“乔装”简洁自然，“一下”使请求语气符合现代汉语。
- source_word: וְלֹא יֵדְעוּ
  choice: 这样人们就不会知道
  rationale: 复数动词的主语未明确指出，以泛指“人们”表达，不把它限定为某一群人；“这样”呈现与乔装之间的目的或结果关系。
- source_word: וְהָלַכְתְּ שִׁלֹה
  choice: 你要往示罗去
  rationale: 连续完成式在命令语境中承接前一指示，译为明确而自然的吩咐。
- source_word: הִנֵּה שָׁם
  choice: 看哪，……就在那里
  rationale: “看哪”保留 הִנֵּה 的提示和强调功能，同时维持庄重的经文语体。
- source_word: אֲחִיָּה הַנָּבִיא
  choice: 亚希雅先知
  rationale: 按传统且通行的中文圣经人名音译处理，并直译其职分。
- source_word: הוּא דִבֶּר
  choice: 他就是那位曾……的人
  rationale: 独立代词 הוּא 带有强调作用，此结构在汉语中自然保留“就是他”的焦点。
- source_word: עָלַי לְמֶלֶךְ עַל הָעָם הַזֶּה
  choice: 论到我、说我必作这百姓之王
  rationale: 保留 עָלַי“论到我”的指向，并将 לְמֶלֶךְ 按预言内容理解为耶罗波安将作王；脚注提示较紧贴希伯来句法的另一种表达。
theological_decisions:
- issue: 亚希雅预言与耶罗波安作王之间的句法关系
  choice: 曾论到我、说我必作这百姓之王
  alternative: 曾论到我作这百姓的王
  rationale: 主译文将 לְמֶלֶךְ 展开为预言内容，汉语更清楚，但不额外说明这预言的神学性质、认可程度或实现方式；脚注保留更紧缩的句法可能。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“请起来”“乔装一下”避免古奥，“看哪”则保留原文醒目的提示语气。人名与地名采用简体中文圣经中通行的“耶罗波安、示罗、亚希雅”。
