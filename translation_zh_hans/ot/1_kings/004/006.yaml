  text: and Ahishar was over the household[b][a], and Adoniram son of Abda was over the forced labor.
translation:
  language: zh_hans
  text: 亚希煞掌管王室事务[a]；押大的儿子亚多尼兰主管徭役[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“掌管王宫”或“主管王家”。希伯来语直译为“在这家之上”；这里是负责王室家政或宫廷事务的官衔。
    reason: lexical_alternative
  - marker: b
    text: 或译：“主管征调的劳役”。这里的希伯来语指国家强制征用的劳役。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲחִישָׁר
  choice: 亚希煞
  rationale: 按希伯来语人名音译；句首连接词在本节官员名录的连续结构中不必机械译出。
- source_word: עַל־הַבָּיִת
  choice: 管理王室
  rationale: 字面为“在那家之上”，在王家行政语境中是主管王室或宫廷事务的官衔。“管理王室”既表达管理权限，也不把所指局限为一座建筑。
- source_word: וַאֲדֹנִירָם
  choice: 亚多尼兰
  rationale: 按希伯来语人名音译；并列关系用分号自然呈现。
- source_word: בֶּן־עַבְדָּא
  choice: 押大的儿子
  rationale: 直接保留希伯来语“某人的儿子”这一父称识别方式，人名“押大”采用通行音译。
- source_word: עַל־הַמַּס
  choice: 主管徭役
  rationale: מַס在王国行政语境中指国家强制征用的劳役，而不只是税赋。“徭役”简洁准确地表达这种强制服役制度。
