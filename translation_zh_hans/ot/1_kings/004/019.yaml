base_translation:
  language: en
  yaml_path: translation/ot/1_kings/004/019.yaml
  text: Geber son of Uri[a], in the land of Gilead, the land of Sihon king of the Amorites and of Og king of Bashan; and he was the only governor who was in the land.
translation:
  language: zh_hans
  text: 乌利的儿子基别，在基列地，就是亚摩利人的王西宏和巴珊王噩的地；他是那地唯一的总督[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他是唯一在那地的总督。”希伯来文直译为“在那地”；也有人把这里理解为表示管辖，译作“管理那地”。
    reason: 保留 אֲשֶׁר בָּאָרֶץ 在地点含义与行政含义之间的歧义。
lexical_decisions:
- source_word: גֶּבֶר בֶּן אֻרִי
  choice: 乌利的儿子基别
  rationale: 按希伯来文的父子称谓结构译出；专名采用现代中文圣经中通行的音译。
- source_word: בְּאֶרֶץ גִּלְעָד
  choice: 在基列地
  rationale: 明确译出 אֶרֶץ“地”，并保留其与下一个同位语短语的联系。
- source_word: אֶרֶץ סִיחוֹן מֶלֶךְ הָאֱמֹרִי וְעֹג מֶלֶךְ הַבָּשָׁן
  choice: 就是亚摩利人的王西宏和巴珊王噩的地
  rationale: 将该短语理解为对“基列地”的同位说明，并保留两位昔日统治者与该地域的关联；不额外加入原文没有的“从前”或“领土”。
- source_word: נְצִיב
  choice: 总督
  rationale: 本章语境是所罗门设立的地区行政官员；“总督”简洁清楚，也能体现受委派治理一地的职分。
- source_word: אֶחָד
  choice: 唯一的
  rationale: 在此处“一”具有仅此一人的强调作用；结合无动词分句，译作“唯一的”比生硬的“一位”更符合现代汉语。
- source_word: אֲשֶׁר בָּאָרֶץ
  choice: 那地
  rationale: 正文以“他是那地唯一的总督”自然表达关系分句；希伯来文介词 בְּ 字面为“在”，其可能的行政性理解另见脚注。
