  text: Ahimaaz[a], in Naphtali; he too took Basemath, the daughter of Solomon[b], as a wife.
translation:
  language: zh_hans
  text: 在拿弗他利[a]的是亚希玛斯；他也娶了所罗门的女儿巴实抹为妻[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“管理拿弗他利”或“负责拿弗他利”；这里的希伯来语介词可表示亚希玛斯在这份行政官员名单中所负责的地区。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译“取了所罗门的女儿巴实抹为妻”，是表示娶她的惯用说法。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲחִימַעַץ
  choice: 亚希玛斯
  rationale: 人名按现代中文圣经中通行的译名音译。
- source_word: בְּנַפְתָּלִי
  choice: 在拿弗他利
  rationale: 介词 בְ 与支派或地域名连用，在本段行政官员名单中可指其管辖区域；译作“在拿弗他利”保留原文的地点表达，不进一步限定为“管理”。
- source_word: גַּם הוּא
  choice: 他也
  rationale: 保留原文附加和强调的语气，并采用自然的现代汉语语序。
- source_word: לָקַח ... לְאִשָּׁה
  choice: 娶……为妻
  rationale: 这是希伯来语表示婚娶的惯用结构；中文“娶……为妻”既准确表达其意义，也保留了原文结构。
- source_word: בָּשְׂמַת
  choice: 巴实抹
  rationale: 人名采用现代中文圣经中较通行的音译。
- source_word: בַּת שְׁלֹמֹה
  choice: 所罗门的女儿
  rationale: 准确表达希伯来语属格结构，并符合自然的现代汉语。
