  text: Judah and Israel were as numerous as the sand by the sea in multitude[a], eating and drinking and rejoicing.
translation:
  language: zh_hans
  text: 犹大人和以色列人多如海边的沙[a]；他们吃喝欢喜。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“犹大人和以色列人多得如海边的沙”。原文在“如同海边的沙”这一比较之后，进一步强调其数量众多。
    reason: 说明לָרֹב对人口众多的强调，并保留海边沙粒这一希伯来语常用比喻的替代汉语表达。
lexical_decisions:
- source_word: יְהוּדָה וְיִשְׂרָאֵל
  choice: 犹大和以色列人
  rationale: 两个名称在这里合指其人民；在“以沙为喻”的人口语境中补出“人”，使现代汉语自然明确，同时不改变所指。
- source_word: רַבִּים
  choice: 多
  rationale: 该形容词作谓语，表示人数众多；与后面的沙粒比喻合译为“人多如……”，简洁而贴合汉语习惯。
- source_word: כַּחוֹל אֲשֶׁר עַל הַיָּם לָרֹב
  choice: 如海边的沙
  rationale: 保留希伯来语以海边沙粒比喻数量极多的意象；לָרֹב所表达的数量层面已由“人多如”自然体现，避免生硬重复。
- source_word: אֹכְלִים וְשֹׁתִים וּשְׂמֵחִים
  choice: 他们吃喝欢喜
  rationale: 三个并列形式描写持续或典型的生活状态；“吃喝欢喜”保留原文节奏，并传达安乐、喜庆的景象。
