base_translation:
  language: en
  yaml_path: translation/ot/1_kings/004/005.yaml
  text: Azariahu son of Nathan was over the governors[a], and Zabud son of Nathan was priest and the king’s friend.
translation:
  language: zh_hans
  text: 拿单的儿子亚撒利雅掌管众地方官；拿单的儿子撒布得是祭司[a]，也是王的朋友。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “祭司”在这里也可能指“高级官员”或“王室顾问”。
    reason: 保留 כֹּהֵן 在宫廷语境中可能具有的职务性含义。
lexical_decisions:
- source_word: עֲזַרְיָהוּ
  choice: 亚撒利雅
  rationale: 按现代中文圣经人名惯例音译，并采用读者较熟悉的形式；希伯来语词尾所含的 -yahu 形式不另行展开。
- source_word: בֶן נָתָן
  choice: 拿单的儿子
  rationale: 自然、准确地表达希伯来语谱系及亲属结构。
- source_word: עַל הַנִּצָּבִים
  choice: 掌管众地方官
  rationale: עַל 在行政语境中表示管辖；נִצָּבִים 指受委派负责各地区或职能的官员。译作“地方官”既体现所罗门行政体系的背景，也避免使用生僻官衔。
- source_word: זָבוּד
  choice: 撒布得
  rationale: 依现代普通话音译圣经人名。
- source_word: כֹּהֵן
  choice: 祭司
  rationale: 保留该词最直接、通常的词义；宫廷语境中可能指高级官员或王室顾问的可能性另以脚注说明。
- source_word: רֵעֶה הַמֶּלֶךְ
  choice: 王的密友
  rationale: 字面为“王的朋友”，在王室语境中可表示亲近的知己或受信任的近臣；“密友”自然传达这种亲近关系，同时不将其明确改写成正式官职。
theological_decisions:
- issue: כֹּהֵן 在王室行政名单中的含义
  choice: 正文译作“祭司”
  alternative: 高级官员；王室顾问
  rationale: 该词的基本词义是“祭司”，上下文虽容许宫廷职务的延伸含义，却不足以排除本义。正文保留源文措辞，脚注呈现语境上的另一种理解，以免替读者消解歧义。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“掌管”体现行政权责；用分号清楚区分两位拿单之子的职务。“也是”表明“祭司”和“王的密友”都用于撒布得。脚注标记置于涉及歧义的整句末尾。
