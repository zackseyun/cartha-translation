lexical_decisions:
- source_word: בֶּן חֶסֶד
  choice: 便希悉
  rationale: 该表达直译为“希悉之子”，但在这份行政官员名单中用作人物称谓；正文采用音译，并以脚注保留形式更直译的可能。
- source_word: בָּאֲרֻבּוֹת
  choice: 在亚鲁泊
  rationale: 前缀 בְּ 表示地点“在”；亚鲁泊是地名，采用音译。
- source_word: לוֹ
  choice: 他管辖
  rationale: 字面为“归他”或“属他”；在行政区名单的语境中，表示该地区由这名官员负责，译作“他管辖”较自然。
- source_word: שֹׂכֹה
  choice: 梭哥
  rationale: 地名采用中文圣经中常见的音译形式。
- source_word: וְכָל אֶרֶץ חֵפֶר
  choice: 和希弗全地
  rationale: 保留 כָל“全、所有”的范围；אֶרֶץ 在此指地域，译为“地”。
