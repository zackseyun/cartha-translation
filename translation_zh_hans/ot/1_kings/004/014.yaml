- source_word: מַחֲנָיְמָה
  choice: 在玛哈念
  rationale: 该地名带有表示方向的词尾，字面可译为“往玛哈念”；但本节处于行政辖区官员名单中，语境更可能表示任职地点或以玛哈念为中心的辖区，因此正文用“在玛哈念”，并以脚注保留原文形式上的方向含义。
