  text: וְ/לִ/שְׁלֹמֹ֞ה שְׁנֵים עָשָׂ֤ר נִצָּבִים֙ עַל כָּל יִשְׂרָאֵ֔ל וְ/כִלְכְּל֥וּ אֶת הַ/מֶּ֖לֶךְ וְ/אֶת בֵּית֑/וֹ חֹ֧דֶשׁ בַּ/שָּׁנָ֛ה יִהְיֶ֥ה עַל אחד לְ/כַלְכֵּֽל־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/004/007.yaml
  text: And Solomon had twelve deputies over all Israel[a], and they provided for the king and his household; each one had to provide for one month in the year.
translation:
  language: zh_hans
  text: 所罗门有十二名官员[a]，负责管理全以色列；他们供给王和他的王室，每人每年负责供给一个月。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “官员”也可译作“行政长官”“主管”或“受委派的官吏”。希伯来语这个词泛指受委派担任行政职务的人。
    reason: 保留 נִצָּבִים 的宽泛行政含义及可行译法，避免把具体职级定得过窄。
lexical_decisions:
- source_word: וְלִשְׁלֹמֹה
  choice: 所罗门……设了
  rationale: 希伯来语介词 לְ 在这里表示归属关系；结合任命行政人员的语境，译为“所罗门……设了”比直译“所罗门有”更自然。
- source_word: שְׁנֵים עָשָׂר
  choice: 十二名
  rationale: 忠实表达基数，并以量词“名”配合人员称谓。
- source_word: נִצָּבִים
  choice: 官员
  rationale: 该词泛指受委派、担任职务的人；“官员”保留行政职能的宽泛含义，不把职级过度具体化。
- source_word: עַל כָּל יִשְׂרָאֵל
  choice: 在全以色列
  rationale: 这里可表示这些官员的辖区或任务分布范围；中文用“在全以色列”自然表达其遍及全国的行政安排，同时避免过度强调统治权。
- source_word: וְכִלְכְּלוּ
  choice: 负责供应……的需要
  rationale: כלכל 在本语境中指供给、维持所需；“供应……的需要”清楚表达王室供给职责。
- source_word: אֶת הַמֶּלֶךְ וְאֶת בֵּיתוֹ
  choice: 王和王室
  rationale: בֵּיתוֹ 在此指王的家室及宫廷整体，而非建筑物；“王室”简洁涵盖这一含义。
- source_word: חֹדֶשׁ בַּשָּׁנָה יִהְיֶה עַל אֶחָד לְכַלְכֵּל
  choice: 一年中每人负责供应一个月
  rationale: 原文直译近于“一年一个月，责任落在一人身上去供应”，具有轮值分配的意思；此译自然呈现每名官员每年承担一个月供给任务。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“负责供应王和王室的需要”明确行政供给职能；后半句用“每人负责……一个月”呈现原文的轮值义。
