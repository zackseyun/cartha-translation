  text: 便底甲[a]，在玛迦斯、沙宾、伯示麦和以伦伯哈南。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或较为直译作“底甲的儿子”；这里保留希伯来语的命名形式，将其作为个人称谓“便底甲”。
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן דֶּקֶר
  choice: 便·底甲
  rationale: 在这份行政官员名单中，“בן＋专名”可作为个人称谓；采用音译，保留希伯来语命名形式，也与上下文的人名列表相称。
- source_word: בְּ/מָקַץ
  choice: 在玛迦斯
  rationale: 介词 בְ 在此引出该官员所属的地区或城镇；译为“在”直接保留其处所意义，不把上下文中的管辖含义强加于该词。
- source_word: וּ/בְ/שַׁעַלְבִים
  choice: 沙宾
  rationale: 连词和介词的作用由中文并列结构及前置的“在”统摄；地名按中文圣经传统音译。
- source_word: וּ/בֵית שָׁמֶשׁ
  choice: 伯示麦
  rationale: 原文虽未再次明写介词，但并列结构延续前面的处所关系；将地名音译而不按字面译作“太阳之家”。
- source_word: וְ/אֵילֹון בֵּית חָנָן
  choice: 以伦·伯哈南
  rationale: 在城镇名单中将其理解为复合地名；中文用间隔号标示组成部分，而“在”的处所关系由整组并列成分共同承接。
