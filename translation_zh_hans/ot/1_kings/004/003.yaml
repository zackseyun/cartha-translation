base_translation:
  language: en
  yaml_path: translation/ot/1_kings/004/003.yaml
  text: Elihoreph and Ahijah[a], the sons of Shisha, were secretaries[c][b]; Jehoshaphat the son of Ahilud was the recorder.
translation:
  language: zh_hans
  text: 以利何烈和亚希雅——示沙的两个儿子——任王室书记[a]；亚希律的儿子约沙法任记事官[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“文书官”。希伯来语所指的是负责书写和公文事务的王室官员。
    reason: lexical_alternative
  - marker: b
    text: 或译“史官”“备忘官”。这一宫廷官员负责保存记录，也可能负责把有关事务提请王注意。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלִיחֹרֶף וַאֲחִיָּה
  choice: 以利何烈和亚希雅
  rationale: 两个人名按现代中文圣经常用音译处理，并保留连接词。
- source_word: בְּנֵי שִׁישָׁא
  choice: 示沙的两个儿子
  rationale: בְּנֵי为复数，指前述二人都是示沙的儿子；用破折号插入说明，使名单结构清楚自然。
- source_word: סֹפְרִים
  choice: 王室书记
  rationale: 该复数职称在王室官员名单中指负责书写、公文等事务的官员；加“王室”点明语境，并与后面的另一官职区分。
- source_word: יְהוֹשָׁפָט בֶּן אֲחִילוּד
  choice: 亚希律的儿子约沙法
  rationale: 依照现代汉语自然次序表达父子关系，人名采用常见音译。
- source_word: הַמַּזְכִּיר
  choice: 记事官
  rationale: 此分词性官衔源于“使人记得、提起、记录”，可指负责保存记录并向王禀报事务的宫廷官员；“记事官”既保持词义联系，也避免与前面的书记混同。
theological_decisions: []
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。以破折号标明同位说明，使两位书记与其父亲的关系一目了然；两个相近但不同的宫廷职务分别译为“王室书记”和“记事官”，不把其具体职责界定得过窄。未采纳英文咨询层关于撒母耳记下8:17有“沙威沙”这一相关名字的注释，因为该处马所拉文本实际作“西莱雅”；“沙威沙”见于历代志上18:16，且不足以据此改动本节的“示沙”。
