  text: Ben-abinadab, over all the height of Dor; Taphath the daughter of Solomon was his wife.
translation:
  language: zh_hans
  text: 亚比拿达的儿子管理多珥全境；所罗门的女儿他法是他的妻子。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן אֲבִינָדָב
  choice: 亚比拿达的儿子
  rationale: בֶּן在此可与父名构成称谓，但未提供此人的名字；译出亲属关系比音译为复合人名更清楚，并保留原文信息。
- source_word: כָּל נָפַת דֹּאר
  choice: 多珥全境
  rationale: נָפָה在行政区划语境中指地区、辖区；虽可从词源联想到“高地”，此处与官员辖区列表并列，译作“全境”更符合上下文，同时不把地形词义强加于行政表达。
- source_word: טָפַת
  choice: 他法
  rationale: 按希伯来人名音译，采用简洁的现代汉语形式。
- source_word: הָיְתָה לּוֹ לְאִשָּׁה
  choice: 是他的妻子
  rationale: 忠实表达希伯来语领属婚姻结构，汉语自然简洁。
