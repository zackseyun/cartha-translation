  text: 'And these were their names: Ben-hur[a], in the hill country of Ephraim;'
translation:
  language: zh_hans
  text: 他们的名字如下：便户珥[a]，在以法莲山区；
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“户珥的儿子”；若这里的“便”表示父子关系，而不是人名的一部分。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה שְׁמוֹתָם
  choice: 他们的名字如下
  rationale: 原文是无系词句，直译为“这些是他们的名字”。汉语用“他们的名字如下”自然、简洁地引出名单；句首连接词 וְ 在此承接上下文，不必机械译出。
- source_word: בֶּן חוּר
  choice: 便户珥
  rationale: 在官员名单中将其作为专名音译，同时以脚注保留“户珥的儿子”这一可能的父名解释。
- source_word: בְּהַר אֶפְרָיִם
  choice: 在以法莲山区
  rationale: 这里的 הַר 指以法莲的山地或山区这一地域，而非某一座山；“以法莲山区”符合现代汉语地理表达。
