  text: King Solomon was king over all Israel.
translation:
  language: zh_hans
  text: 所罗门王是全以色列的王。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: 作
  rationale: 此处的叙事形式主要引出并陈述所罗门的王权状态；现代汉语无需另加“于是”或“那时”，谓语“作”自然承载该陈述。
- source_word: הַמֶּלֶךְ שְׁלֹמֹה
  choice: 所罗门王
  rationale: 定冠词、王的称号与专名构成同位表达；“所罗门王”符合现代汉语称谓习惯。
- source_word: מֶלֶךְ
  choice: 作……的王
  rationale: 保留第二个“王”作为谓语名词，不简化为“统治”，以体现原文重复 מֶלֶךְ 的强调。
- source_word: עַל
  choice: 作……的王
  rationale: 在君王治理的语境中表示对某民的权柄；汉语以“作……的王”自然表达。
- source_word: כָּל יִשְׂרָאֵל
  choice: 全以色列
  rationale: כָּל 表示整体范围；“全以色列”简洁地保留所罗门王权覆盖整个以色列的含义。
theological_decisions:
- issue: 如何处理原文两次出现的 מֶלֶךְ
  choice: 两处都译出：“所罗门王作全以色列的王”
  alternative: “所罗门统治全以色列”或“所罗门作全以色列的王”
  rationale: 第一处是称号，第二处是谓语。保留二者可呈现原文对所罗门王者身份及其统辖全以色列的强调，而不额外加入神学解释。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。保留“王”的重复，虽较一般汉语略显强调，却贴合希伯来文结构；不添加原文没有的显式时间词或话语标记。
