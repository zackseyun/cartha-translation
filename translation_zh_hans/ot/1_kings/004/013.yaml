  text: בֶּן גֶּ֖בֶר בְּ/רָמֹ֣ת גִּלְעָ֑ד ל֡/וֹ חַוֺּת֩ יָאִ֨יר בֶּן מְנַשֶּׁ֜ה אֲשֶׁ֣ר בַּ/גִּלְעָ֗ד ל֚/וֹ חֶ֤בֶל אַרְגֹּב֙ אֲשֶׁ֣ר בַּ/בָּשָׁ֔ן שִׁשִּׁים֙ עָרִ֣ים גְּדֹל֔וֹת חוֹמָ֖ה וּ/בְרִ֥יחַ נְחֹֽשֶׁת־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/004/013.yaml
  text: 'Ben-geber[a], in Ramoth-gilead—to him belonged the villages of Jair son of Manasseh, which are in Gilead; to him belonged the region of Argob[b], which is in Bashan: sixty large cities with walls and bronze bars.'
translation:
  language: zh_hans
  text: 便基别[a]负责基列的拉末；基列境内属玛拿西之子睚珥的村庄[b]归他管辖；巴珊境内的亚珥歌伯地区[c]也归他管辖，共有六十座大城，都有城墙和铜制门闩。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“基别的儿子”。
    reason: 原文 בֶּן־גֶּבֶר 在此行政官员名单中可作人名“便基别”，也可按字面理解为“基别的儿子”。
  - marker: b
    text: 或译：“睚珥的帐篷村落”；也可音译为“哈倭特·睚珥”。
    reason: חַוֺּת 可指聚落或帐篷式聚落；该词组也可作为地名音译。
  - marker: c
    text: 或译：“亚珥歌伯辖区”或“亚珥歌伯境内”。
    reason: חֶבֶל 可指地区、辖区或一片划定的地域。
lexical_decisions:
- source_word: בֶּן גֶּבֶר
  choice: 便基别
  rationale: 在这份行政官员名单中，此语整体可作官员的称名。采用音译符合上下文的人名用法，同时以脚注保留“基别的儿子”这一字面理解。
- source_word: בְּרָמֹת גִּלְעָד
  choice: 管基列的拉末
  rationale: 介词 בְ 表示其任职或管辖地点；结合行政名单的语境译出“管”，使现代汉语自然清楚。地名采用“基列的拉末”。
- source_word: לֹו
  choice: 都归他管／也归他管
  rationale: 重复的 לֹו 表示这些地方划归该官员负责；“归他管”比单纯的“属于他”更符合行政辖区语境，又保留归属含义。
- source_word: חַוֺּת יָאִיר
  choice: 雅珥的村庄
  rationale: 此词组指与雅珥有关的一组聚落；“村庄”清楚易懂，脚注保留“帐篷村落”和音译名的可能。
- source_word: אֲשֶׁר בַּגִּלְעָד
  choice: 在基列
  rationale: 关系从句说明雅珥村庄的地理位置；汉语中前置为地点修饰语更自然。
- source_word: חֶבֶל אַרְגֹּב
  choice: 亚珥歌伯地区
  rationale: חֶבֶל 在此指划定的地域或行政范围；“地区”自然且不过度限定其行政性质。
- source_word: אֲשֶׁר בַּבָּשָׁן
  choice: 在巴珊的
  rationale: 关系从句用于说明亚珥歌伯地区的位置，前置后符合现代汉语语序。
- source_word: שִׁשִּׁים עָרִים גְּדֹלוֹת
  choice: 六十座大城
  rationale: גְּדֹלוֹת 可指规模大或地位重要；“大城”简洁，并保留这两方面的语义空间。
- source_word: חוֹמָה
  choice: 都有城墙
  rationale: 该名词以集合性方式描述六十座城的防御设施；补出“都有”使汉语指向明确。
- source_word: וּבְרִיחַ נְחֹשֶׁת
  choice: 和铜门闩
  rationale: בְרִיחַ 是用于加固城门的横闩或门闩，并非城门本身；“铜门闩”准确保留具体的防御形象。
theological_decisions: []
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。通过“管”和“归他管”显明行政名单的语境；保留地名和防御设施的具体表达。原英文咨询层中脚注[a]的位置与脚注内容不一致；本稿依据希伯来文将相关说明置于“雅珥的村庄”之后，并另为“便基别”的真实词义歧义设置脚注。
