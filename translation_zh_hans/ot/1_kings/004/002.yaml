  text: 'And these were the officials who were his: Azariah son of Zadok[a], the priest[b];'
translation:
  language: zh_hans
  text: 以下是他的官员：亚撒利雅，撒督的儿子，祭司[a]；
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语作“亚撒利雅，撒督的儿子，祭司”。“祭司”可理解为指撒督，也可理解为亚撒利雅的职衔；原文没有明确说“大祭司”。
    reason: alternative_reading
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: 如下
  rationale: 该表达承接上文并引出名单；现代汉语用“如下”简洁自然地体现列举功能。
- source_word: הַשָּׂרִים אֲשֶׁר לוֹ
  choice: 他的官员
  rationale: שׂרים在此行政名单中指王室高级官员；אשר לו表示归属所罗门的行政体系。译为“他的官员”既准确又不暗示世袭贵族身份。
- source_word: עֲזַרְיָהוּ
  choice: 亚撒利雅
  rationale: 按中文圣经人名的通行译法音译。
- source_word: בֶן צָדוֹק
  choice: 撒督的儿子
  rationale: 忠实表达标准的父子关系结构。
- source_word: הַכֹּהֵן
  choice: 祭司
  rationale: 希伯来语原文是带定冠词的单数名词“祭司”，并未明确写作“大祭司”，因此不作扩展。
theological_decisions:
- issue: “祭司”所修饰的人物及其职衔范围
  choice: 正文译作“祭司撒督的儿子亚撒利雅”，按较自然的汉语句法将“祭司”理解为修饰撒督，同时用脚注保留它也可能是亚撒利雅职衔的歧义。
  alternative: “撒督的儿子、祭司亚撒利雅”
  rationale: 希伯来语“亚撒利雅，撒督之子，祭司”在句法上存在歧义，不能确定“祭司”指撒督还是亚撒利雅；原文也没有明确说“大祭司”。正文采用自然且有古代背景支持的理解，但不在脚注中消除另一可能。
translation_notes:
  register: 采用现代、简洁而庄重的名单引介句式。“官员”适合行政语境；人名沿用通行中文译名。正文中的[a]与脚注对应。
