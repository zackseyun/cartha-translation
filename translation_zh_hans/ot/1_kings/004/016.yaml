  text: 户筛的儿子巴拿，在亚设和比亚录[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或作“亚录”。这个地名的读法和所指地点并不确定。
    reason: 保留בְעָלוֹת在翻译传统中的另一种读法，以及其地理辨认上的不确定性。
lexical_decisions:
- source_word: בַּֽעֲנָא
  choice: 巴拿
  rationale: 人名按现代中文圣经通行形式音译。
- source_word: בֶּן חוּשָׁי
  choice: 户筛的儿子
  rationale: בֶּן表示父子关系；采用自然、庄重的现代汉语表达，并保留户筛这一通行译名。
- source_word: בְּ/אָשֵׁר
  choice: 在亚设
  rationale: 介词בְּ直译为“在”；上下文虽涉及行政辖区，但不增译为“管辖”，以免消除原文简洁表达中的语义余地。
- source_word: וּ/בְעָלֽוֹת
  choice: 和比亚录
  rationale: 按马所拉元音将其视为地名Bealoth并音译；וּ译为“和”。该地名在译本传统及地理辨认上存在不确定性，另见脚注。
