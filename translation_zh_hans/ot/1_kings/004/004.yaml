  yaml_path: translation/ot/1_kings/004/004.yaml
  text: Benaiah son of Jehoiada was over the army[a], and Zadok and Abiathar were priests.
translation:
  language: zh_hans
  text: 约雅大的儿子比拿雅掌管军队；撒督和亚比亚他作祭司[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “祭司”或可译作“大臣”或“主要官员”，若此处的 כֹּהֲנִים 是在较宽泛的宫廷行政意义上使用。
    reason: 保留王室官员名单语境所容许、但可能性较低的另一种理解。
lexical_decisions:
- source_word: עַל הַצָּבָא
  choice: 掌管军队
  rationale: 介词 עַל 与职权范围连用，表示管理或统辖；“掌管军队”自然表达其权责，又不擅自增添“元帅”等原文未明说的正式军衔。
- source_word: הַצָּבָא
  choice: 军队
  rationale: 此处指有组织的军事力量；“军队”是现代汉语中清楚、通行的对应表达。
- source_word: כֹּהֲנִים
  choice: 祭司
  rationale: 该词通常且首要的含义是“祭司”，而撒督和亚比亚他在其他经文中也明确具有祭司身份；宫廷官员名单这一语境不足以推翻其通常词义。
- source_word: בְנָיָהוּ
  choice: 比拿雅
  rationale: 采用现代中文圣经中通行的人名音译。
- source_word: יְהוֹיָדָע
  choice: 约雅大
  rationale: 采用现代中文圣经中通行的人名音译。
- source_word: צָדוֹק
  choice: 撒督
  rationale: 采用现代中文圣经中通行的人名音译。
- source_word: אֶבְיָתָר
  choice: 亚比亚他
  rationale: 采用现代中文圣经中通行的人名音译。
theological_decisions:
- issue: 在王室行政官员名单的语境中，כֹּהֲנִים 是否应按非礼仪意义译为“大臣”或“首要官员”。
  choice: 祭司
  alternative: 大臣；首要官员
  rationale: “祭司”是该希伯来词的通常含义，且撒督和亚比亚他的祭司身份有其他经文支持。正文保留最有词汇和人物背景依据的译法，同时以脚注保存较宽泛的宫廷行政意义这一可能性，避免无声消除歧义。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。“掌管”准确表达职权关系而不增添原文未明说的军衔；分号呈现两个并列任职陈述。脚注标记置于其实际说明的“祭司”之后。
