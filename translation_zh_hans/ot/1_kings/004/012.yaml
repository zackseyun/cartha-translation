base_translation:
  language: en
  yaml_path: translation/ot/1_kings/004/012.yaml
  text: 'Baana son of Ahilud: Taanach and Megiddo[a], and all Beth-shean, which is beside Zarethan below Jezreel, from Beth-shean to Abel-meholah, as far as beyond Jokmeam.'
translation:
  language: zh_hans
  text: 亚希律的儿子巴拿，管辖他纳、米吉多，以及靠近撒拉他拿、在耶斯列下方的伯善全境；从伯善直到亚伯·米何拉，远至约缅彼岸。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“远至约缅以外的地区。”原文的边界表述简略，含义略难确定。
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּֽעֲנָא֙ בֶּן אֲחִיל֔וּד
  choice: 亚希律的儿子巴拿
  rationale: 人名按希伯来语音译，并采用现代中文圣经读者较熟悉的译名形式；保留名单中省略谓语的结构。
- source_word: תַּעְנַ֖ךְ וּ/מְגִדּ֑וֹ
  choice: 他纳和米吉多
  rationale: 两处地名依希伯来语音译，以“和”表达并列关系。
- source_word: וְ/כָל בֵּ֣ית שְׁאָ֡ן
  choice: 以及伯善全境
  rationale: כָל与地名连用，在本段行政区划语境中很可能指该地及其所属地域；译作“全境”比直译“全伯善”自然，同时避免仅指城内居民。
- source_word: אֲשֶׁר֩ אֵ֨צֶל צָרְתַ֜נָ/ה
  choice: 伯善……靠近撒拉他拿
  rationale: אֵצֶל表示“在旁边、靠近”；关系从句在中文中顺序调整，使所指清楚而不限定具体距离。
- source_word: מִ/תַּ֣חַת לְ/יִזְרְעֶ֗אל
  choice: 在耶斯列下方
  rationale: 保留原文表示较低地势的空间说法，不解释为“南边”，以免过度确定方向。
- source_word: מִ/בֵּ֤ית שְׁאָן֙ עַ֚ד אָבֵ֣ל מְחוֹלָ֔ה
  choice: 从伯善直到亚伯·米何拉
  rationale: 用“从……直到……”自然表达辖区范围，地名采用音译。
- source_word: עַ֖ד מֵ/עֵ֥בֶר לְ/יָקְמֳעָֽם
  choice: 远至约缅彼岸
  rationale: 保留עֵבֶר所表达的“另一边、彼岸”空间关系；原文边界短语凝练且略显难解，较顺畅的地域性理解列入脚注。
