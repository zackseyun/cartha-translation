base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/009.yaml
  text: All these were costly stones[a], cut according to measure, sawed with a saw on the inside and on the outside, from the foundation to the coping[b], and on the outside as far as the great court.
translation:
  language: zh_hans
  text: 这一切都是贵重的石料[a]，按尺寸凿制，里外两面都用锯锯制；从根基直到顶部[b]，外面一直延伸到大院。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“珍贵的石头”。这里更可能是指昂贵、优质的建筑石料，而不是宝石。
    reason: lexical_alternative
  - marker: b
    text: 希伯来语为“直到tĕfaḥot”；所指的具体建筑部位不能确定，可能是顶部的收边、压顶或最上一层石料。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲבָנִים יְקָרֹת
  choice: 贵重的石料
  rationale: יְקָרֹת可指贵重、昂贵；建筑语境所指更可能是价值高、品质好的建筑石料，而非宝石。“石料”也比泛称“石头”更符合施工语境。
- source_word: כְּמִדֹּת גָּזִית
  choice: 按尺寸凿成
  rationale: 兼顾מִדּוֹת所表达的规定尺寸和גָּזִית所表达的凿制石材，中文简洁自然。
- source_word: מְגֹרָרוֹת בַּמְּגֵרָה
  choice: 用锯……锯整齐
  rationale: 保留原文动词与工具名词的具体表达，并以“整齐”传达石面经过加工修整的建筑语境。
- source_word: מִבַּיִת וּמִחוּץ
  choice: 里外两面
  rationale: 此处最可能指石材内外两面的加工；“两面”明确其表面含义，同时保留“里外”的空间对照。
- source_word: מִמַּסָּד
  choice: 从根基
  rationale: מַסָּד在建筑语境中指基础或根基；“根基”庄重且易懂。
- source_word: עַד הַטְּפָחוֹת
  choice: 直到墙顶
  rationale: הַטְּפָחוֹת所指建筑构件不确定，可能是顶部收边、压顶或最上一层石料；正文采用普通读者易懂但不过度具体的“墙顶”，并以脚注说明不确定性。
- source_word: וּמִחוּץ עַד הֶחָצֵר הַגְּדוֹלָה
  choice: 外面则一直到大院
  rationale: 按原文把范围从建筑外部延伸至大院；“大院”自然表达חָצֵר הַגְּדוֹלָה。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的建筑叙述用语。“贵重的石料”避免被误解为宝石；“里外两面”明确石材表面均经锯整；对含义不确定的הַטְּפָחוֹת在正文中作适度概括，并在脚注中保留原文的不确定性。
