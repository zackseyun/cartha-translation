base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/026.yaml
  text: Its thickness was a handbreadth[a], and its rim was made like the rim of a cup, like a lily blossom[b]. It could hold two thousand baths.
translation:
  language: zh_hans
  text: 海厚一掌[a]，边缘做得像杯沿，如百合花朵[b]。它可容两千罢特[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “一掌”是古代长度单位，约为一只手掌的宽度。
    reason: measurement_clarification
  - marker: b
    text: 原文也可较直译为：“它的唇边……像杯子的唇边，像百合花朵。”
    reason: lexical_alternative
  - marker: c
    text: 另见《历代志下》4:5；该处记载海可容三千罢特，而本节作两千罢特。这可能源于文本传抄上的差异，也可能涉及最大容量与通常盛量等不同理解。
    reason: cross_reference
lexical_decisions:
- source_word: עָבְיוֹ
  choice: 海的厚度
  rationale: 该词指铜海本体的厚度；补出“海”使所指在中文中清楚自然。
- source_word: טֶפַח
  choice: 一掌
  rationale: טֶפַח 是以手掌宽度为准的古代长度单位；“一掌”简洁易懂，并保留古代度量。
- source_word: שְׂפָתוֹ
  choice: 边沿
  rationale: 此处指大型容器上缘；“边沿”比直译“唇”更符合现代汉语用法。
- source_word: כְּמַעֲשֵׂה שְׂפַת כּוֹס
  choice: 做得像杯子的边沿
  rationale: מַעֲשֶׂה 在此关乎制作出来的样式；译文自然表达其工艺和形状上的比较。
- source_word: פֶּרַח שׁוֹשָׁן
  choice: 如百合花开放的形状
  rationale: 原文是“百合花朵”，在语境中描绘边沿向外展开的花形；此译保留意象，又使中文关系清楚。
- source_word: אַלְפַּיִם בַּת
  choice: 两千罢特
  rationale: בַּת 是古代液量单位，采用音译“罢特”，不作不确定的现代容量换算。
- source_word: יָכִיל
  choice: 可容
  rationale: 该使役词形在此表达器皿容量，即能够容纳多少，而不必表示当时实际盛有多少。
theological_decisions:
- issue: 《列王纪上》7:26的两千罢特与《历代志下》4:5的三千罢特之差异
  choice: 正文按本节马所拉文本译作“两千罢特”，并以脚注提示平行经文的差异
  alternative: 在正文中协调为三千罢特，或断定一个数字是实际盛量、另一个是最大容量
  rationale: 现有原文明确写“两千”，而平行经文写“三千”；翻译不应在缺乏明示的情况下替文本消除这一差异。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“海”沿用本段对大型铜盆的称呼；度量单位保留古代色彩。主句依希伯来语顺序描写厚度、边沿形状和容量。
