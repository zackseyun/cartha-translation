base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/031.yaml
  text: Its opening projected upward from within the capital by a cubit[a], and its opening was round, like the work of a pedestal, a cubit and a half; and also on its opening were carvings, and their panels were square[c][b], not round.
translation:
  language: zh_hans
  text: 它的开口[a]从冠部内部向上伸出一肘[b]。开口呈圆形，作工如座架一般[c]，量为一肘半；开口上还有雕饰[d]。这些镶板是方的，不是圆的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“口”，是指器物开口的建筑性比喻。
    reason: lexical_alternative
  - marker: b
    text: 一肘约为45厘米。
    reason: measurement
  - marker: c
    text: “作工如座架一般”是一个含义不完全确定的技术性短语，也可译作“座架的工艺”或“作成底座的样式”。
    reason: textual_difficulty
  - marker: d
    text: “雕饰”也可译作“雕刻纹样”、“花环”或“彩带状装饰”。
    reason: lexical_alternative
lexical_decisions:
- source_word: פִיהוּ / פִיהָ
  choice: 开口
  rationale: 这里的“口”是建筑器物的比喻用法，指上部的开口；译作“开口”自然清楚，同时以脚注保留原文意象。
- source_word: מִבֵּית לַכֹּתֶרֶת
  choice: 从顶座内部
  rationale: מִבֵּית 表示“从……里面”，כֹּתֶרֶת 指座架上部类似柱头或冠部的构件；“顶座”较适合本段器物结构的语境。
- source_word: וָמַעְלָה בָּאַמָּה
  choice: 向上伸出一肘
  rationale: 原文以方向副词表达向上的延伸，汉语补出“伸出”可清楚传达空间关系而不过度解释。
- source_word: עָגֹל
  choice: 呈圆形
  rationale: 直接表达开口的形状，并与末尾“方的，不是圆的”形成清楚对照。
- source_word: מַעֲשֵׂה כֵן
  choice: 作法如同座架
  rationale: 这是技术性较强且含义不完全确定的短语；译文保留“作法”与“座架”的基本词义，不把具体构造说得过于确定。
- source_word: אַמָּה וַחֲצִי הָאַמָּה
  choice: 尺寸为一肘半
  rationale: 原文只给出量度，没有明说是直径、宽度还是其他维度；用“尺寸”保留这项真实的含混，避免擅自补作“直径”。
- source_word: מִקְלָעוֹת
  choice: 雕饰
  rationale: 该词指经过加工的装饰，但具体图案不明；“雕饰”既表达装饰性工艺，又不限定为花环等某种纹样。
- source_word: מִסְגְּרֹתֵיהֶם
  choice: 它的镶板
  rationale: 在本段器物描写中，该词指带框的区块或板面；“镶板”能自然承接其方形外观。
- source_word: מְרֻבָּעוֹת לֹא עֲגֻלּוֹת
  choice: 是方的，不是圆的
  rationale: 直译原文明确的形状对比，语言简洁自然。
