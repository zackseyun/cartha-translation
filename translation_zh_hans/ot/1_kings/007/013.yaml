- source_word: וַיִּשְׁלַח
  choice: 派人
  rationale: 此处动词“差遣”未明说宾语；按汉语自然表达译作“派人”，为后续请希兰前来作铺垫。
- source_word: וַיִּקַּח
  choice: 请来了
  rationale: 字面为“取、带来”；在君王派人召来工匠的语境中，“请来了”自然表达使希兰从推罗前来的意思，也避免汉语“带走/抓来”的误解。
- source_word: חִירָם
  choice: 希兰
  rationale: 采用现代中文圣经中常见的专名音译。
- source_word: מִצֹּר
  choice: 从推罗
  rationale: מִן表示来源地“从”，צֹר为腓尼基城邑推罗。
