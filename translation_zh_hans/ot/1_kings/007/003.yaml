  text: It was paneled with cedar above[a], over the side chambers that were on the pillars, forty-five in all, fifteen to a row.
translation:
  language: zh_hans
  text: 其上部用香柏木覆盖，覆在柱子上的侧部结构之上；这些侧部结构共有四十五个，每排十五个。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְסָפֻן
  choice: 用……铺盖
  rationale: 该词是被动形式，表示以材料覆盖或铺设。译作“铺盖”既保留覆盖结构的含义，也不武断限定为墙面镶板或屋顶。
- source_word: בָּאֶרֶז
  choice: 用香柏木
  rationale: 介词 בְּ 在这里标示材料；“用香柏木”符合现代汉语建筑表述。
- source_word: מִמַּעַל
  choice: 上面
  rationale: 表达建筑物上方或上部的位置，简洁保留原文的空间关系。
- source_word: עַל הַצְּלָעֹת
  choice: 在……侧架之上
  rationale: צלעות 本义涉及“侧面、肋部”，建筑语境中的具体所指不确定；“侧架”能表达侧部支承结构，又避免过早断定为房间。
- source_word: אֲשֶׁר עַל הָעַמּוּדִים
  choice: 柱子上的
  rationale: 按原文直译其位置关系，不额外断定这些结构如何与柱子连接。
- source_word: אַרְבָּעִים וַחֲמִשָּׁה
  choice: 共四十五个
  rationale: 此数目概括前述复数结构；加入“共”自然呈现总数含义。
- source_word: חֲמִשָּׁה עָשָׂר הַטּוּר
  choice: 每排十五个
  rationale: טוּר 指一排或一列；上下文以四十五个分成三排，每排十五个。
