base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/007.yaml
  text: And he made the Hall of the Throne[a], where he was to judge—the Hall of Judgment—and it was paneled with cedar from floor to floor.
translation:
  language: zh_hans
  text: 他又建造了王座厅，就是审判厅；他在那里施行审判。厅内用香柏木镶板覆盖，从地面到地面[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“从地面到地面”；也可按上下文理解为“从地面到天花板”。
    reason: 原文措辞不寻常，可能指香柏木镶板覆盖整个垂直墙面；正文保留字面表达，脚注提供常见解释。
lexical_decisions:
- source_word: וְאוּלָם הַכִּסֵּא
  choice: 他又建造王座厅
  rationale: אוּלָם在宫殿建筑语境中指厅堂；הַכִּסֵּא意为王座。中文用“王座厅”既简洁自然，也保留王室建筑的庄重感。希伯来文的עָשָׂה置于后面，中文按自然语序提前译作“建造”。
- source_word: אֲשֶׁר יִשְׁפָּט שָׁם
  choice: 他要在那里审判
  rationale: 未完成式יִשְׁפָּט在此可表达预定功能或惯常行为；“要……审判”契合建筑用途的上下文，同时不把它限定为一次已经完成的行动。
- source_word: אֻלָם הַמִּשְׁפָּט
  choice: 审判厅
  rationale: 这是按功能命名的厅堂。“审判厅”直接对应מִשְׁפָּט，避免用“司法”或“公义”等更具解释性的词。
- source_word: וְסָפוּן בָּאֶרֶז
  choice: 都镶上了香柏木板
  rationale: סָפוּן表示覆盖、铺设或镶板；在室内建筑语境中，“镶上……木板”清楚表达香柏木饰面的意思。
- source_word: מֵהַקַּרְקַע עַד הַקַּרְקָע
  choice: 从地面到地面
  rationale: 马所拉文本两次使用קַרְקַע（地面），故正文保留这一不寻常的重复，不擅自改成“从地面到天花板”；较常见的语境解释放入脚注。
