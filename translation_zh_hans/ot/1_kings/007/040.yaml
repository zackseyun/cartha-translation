base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/040.yaml
  text: And Hiram made the basins[a], the shovels, and the bowls. So Hiram finished doing all the work that he did for King Solomon for the house of Yahweh.
translation:
  language: zh_hans
  text: 希兰制造了水盆、铲子和碗[a]。于是，希兰完成了他为所罗门王、为雅威的殿所做的一切工程。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“洒血碗”，指献祭礼仪中使用的器皿。
    reason: 原词可泛指碗状器皿，也可特别指盛接或洒献祭之血的礼仪器皿；脚注保留这一词义范围。
lexical_decisions:
- source_word: הַכִּיֹּרוֹת
  choice: 水盆
  rationale: 该词指圣殿陈设中用于盛水、洗濯的大型器皿；“水盆”既体现用途，也比传统而生僻的说法更易懂。
- source_word: הַיָּעִים
  choice: 铲子
  rationale: 该词在圣所器具的语境中指清理灰烬或炭火的工具；“铲子”自然、明确。
- source_word: הַמִּזְרָקוֹת
  choice: 碗[a]
  rationale: 该词指盛接或洒献祭之血等液体的器皿；正文用宽泛易懂的“碗”，脚注保留其礼仪用途的可能含义。
- source_word: וַיְכַל
  choice: 完成了
  rationale: 这里表示受托工程已经全部做完；“完成了”准确而符合现代汉语。
- source_word: כָּל הַמְּלָאכָה
  choice: 全部工程
  rationale: מְלָאכָה可泛指工作、工程或工艺；在圣殿建造的总结句中，“全部工程”比“全部工作”更切合语境。
- source_word: בֵּית יְהוָה
  choice: 雅威殿
  rationale: בֵּית直译为“房屋、殿”，此处明确指圣殿；将神名יהוה音译为“雅威”，并以“雅威殿”自然表达所属关系。
- source_word: חִירוֹם / חִירָם
  choice: 希兰
  rationale: 原文在本节采用同一人名的两种拼写；中文统一译为惯用形式“希兰”。
- source_word: אֲשֶׁר עָשָׂה לַמֶּלֶךְ שְׁלֹמֹה
  choice: 他为所罗门王承做的
  rationale: לַמֶּלֶךְ表明工程是替所罗门王完成的；“承做”能自然传达受托施工之意，并避免与前句“制造”机械重复。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；“雅威”较直接地保留其作为专名的性质，不以称号替代，也不在本节增添解释。
- issue: בֵּית יְהוָה是直译为“雅威的家”还是按所指译为圣殿
  choice: 雅威殿
  alternative: 雅威的殿；雅威的家
  rationale: 这里的语境明确是所罗门建造的圣殿。“雅威殿”保留“殿”的建筑意象，同时符合现代汉语习惯，不额外引入宗派性理解。
translation_notes:
  register: 采用庄重而明白的现代标准汉语。器具名称力求具体易懂；总结句以“承做……工程”表达希兰受所罗门王委托为圣殿施工的关系。脚注标在与其对应的הַמִּזְרָקוֹת（“碗”）之后。
