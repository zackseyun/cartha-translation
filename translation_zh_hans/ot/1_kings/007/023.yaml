base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/023.yaml
  text: Then he made the cast sea[a], ten cubits from brim to brim, round all around; its height was five cubits[c][b], and a line of thirty cubits went around it all around.
translation:
  language: zh_hans
  text: 他铸造了“海”[a]：从这一边沿到另一边沿是十肘，四周呈圆形，高五肘；一根三十肘长的量绳[c]环绕它一周[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“盆”。希伯来文把这件圣殿中的大型器皿称为“海”，正文保留这一名称。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译“一根三十肘长的量绳环绕它”；意思是它的周长为三十肘。
    reason: cultural_note
  - marker: c
    text: 此处书写形式为קוה；传统读法表达“量绳”的意思。另参《历代志下》4:2的平行记载。
    reason: textual_variant
lexical_decisions:
- source_word: הַיָּם
  choice: “海”
  rationale: 希伯来文直称这件大型圣殿器皿为“海”。正文保留这一正式名称，并以引号提示这是器物专名，而不把它仅按功用译作“盆”。
- source_word: מוּצָק
  choice: 铸造
  rationale: 该被动分词指金属经熔化后浇铸成形；现代汉语用“铸造”准确、自然，且不额外加入原文此处未明说的金属种类。
- source_word: עֶשֶׂר בָּאַמָּה מִשְּׂפָתוֹ עַד שְׂפָתוֹ
  choice: 从这一边沿到另一边沿是十肘
  rationale: שָׂפָה在器皿语境中指边沿；此译自然表达横跨器口的尺寸，同时保留原文“从边到边”的量法。
- source_word: עָגֹל סָבִיב
  choice: 四周呈圆形
  rationale: 兼顾עָגֹל的圆形含义和סָבִיב的周向强调，避免生硬重复。
- source_word: קוֹמָתוֹ
  choice: 高五肘
  rationale: 建筑与器物尺寸语境中，“高”是自然准确的表达。
- source_word: וקוה / קו
  choice: 一根……量绳
  rationale: 此处所指是用来环绕并量度的绳线；“量绳”比泛称“线”更能在现代汉语中交代其用途，同时脚注保留书写形式方面的文本现象。
- source_word: יָסֹב אֹתוֹ סָבִיב
  choice: 环绕它一周
  rationale: 简洁传达动词“环绕”及סָבִיב所强调的完整一周，符合现代汉语习惯。
- source_word: אַמָּה
  choice: 肘
  rationale: “肘”是中文圣经及古代度量语境中通行的对应词，保留原有计量单位，不在正文中作推算换算。
