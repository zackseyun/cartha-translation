  text: עֹמֵ֞ד עַל שְׁנֵ֧י עָשָׂ֣ר בָּקָ֗ר שְׁלֹשָׁ֣ה פֹנִ֣ים צָפ֡וֹנָ/ה וּ/שְׁלֹשָׁה֩ פֹנִ֨ים יָ֜מָּ/ה וּ/שְׁלֹשָׁ֣ה פֹּנִ֣ים נֶ֗גְבָּ/ה וּ/שְׁלֹשָׁה֙ פֹּנִ֣ים מִזְרָ֔חָ/ה וְ/הַ/יָּ֥ם עֲלֵי/הֶ֖ם מִ/לְ/מָ֑עְלָ/ה וְ/כָל אֲחֹֽרֵי/הֶ֖ם בָּֽיְתָ/ה־׀׀׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/025.yaml
  text: 'It stood on twelve oxen: three facing north[a], three facing west, three facing south, and three facing east; and the Sea was on them above[b], and all their rear parts were inward.'
translation:
  language: zh_hans
  text: 海立在十二头牛上：三头面向北，三头面向西[a]，三头面向南，三头面向东。海在这些牛的上面，牛的后部全都朝里。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “西”的希伯来文直译为“向海”，是圣经中表示西方的惯用说法。
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹמֵד
  choice: 立在
  rationale: 该词是עמד的Qal主动分词，在此作述语，承接上一节的“海”；“立在”自然表达其由牛像承托的状态。
- source_word: בָּקָר
  choice: 牛
  rationale: 该词泛指牛类；原文并未明确这些塑像是公牛还是阉牛，因此用中性的“牛”保留词义范围。
- source_word: פֹנִים
  choice: 面向
  rationale: 原义为“脸朝向”，在反复列举方位的结构中，用“面向”简洁而自然。
- source_word: יָמָּה
  choice: 西
  rationale: 字面与“海”有关，但在圣经希伯来语的方位表达中通常指西方；此处与其余三个基本方位并列。
- source_word: הַיָּם
  choice: 海
  rationale: 这是上下文中圣殿大型铸造水池的专称；保留“海”这一原文形象和器物名称。
- source_word: עֲלֵיהֶם מִלְמָעְלָה
  choice: 在这些牛的上面
  rationale: 紧贴原文空间关系，不额外加入“安放”等原文没有明说的动作。
- source_word: אֲחֹרֵיהֶם
  choice: 牛的后部
  rationale: 原文指这些牛像的后面部分；明确补出“牛的”以避免中文代词指代含混，同时不把词义收窄为更具体的“臀部”。
- source_word: בָּיְתָה
  choice: 朝里
  rationale: 方向词表示向内，即朝向十二头牛围成的内部；“朝里”符合现代汉语的空间描写。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而通俗的建筑陈设描写。“海”保留为圣殿器物的名称；句式按四个方位平行排列，以呈现原文的重复节奏。未为“牛”指定原文没有明确表达的性别。
