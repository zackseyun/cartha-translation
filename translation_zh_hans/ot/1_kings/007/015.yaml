base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/015.yaml
  text: He cast the two bronze pillars; the height of the one pillar was eighteen cubits[a], and a line of twelve cubits measured around it.
translation:
  language: zh_hans
  text: 他铸造了两根青铜柱；一根柱子的高度是十八肘；一根十二肘长的绳子环绕第二根柱子。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּצַר
  choice: 铸造
  rationale: 这里描述铜制圣殿器物的制作，“铸造”准确表达金属浇铸的语境，比宽泛的“塑造”或“制作”更具体。
- source_word: שְׁנֵי הָעַמּוּדִים
  choice: 两根……柱
  rationale: “柱”是现代汉语中自然、准确的建筑用语，量词用“根”。
- source_word: נְחֹשֶׁת
  choice: 铜
  rationale: 该词可指铜或铜合金；“铜”是简洁稳妥的上位表达，避免在原文未明确合金成分时过度限定为“青铜”。
- source_word: שְׁמֹנֶה עֶשְׂרֵה אַמָּה
  choice: 十八肘
  rationale: 保留古代长度单位“肘”，不作带有不确定性的现代单位换算。
- source_word: קוֹמַת הָעַמּוּד הָאֶחָד
  choice: 一根柱子高
  rationale: 以自然的现代汉语表达原文“一根柱子的高度”，同时保留与后文“第二根柱子”的对应。
- source_word: וְחוּט
  choice: 另有一条……绳子
  rationale: חוּט本义为线、绳；在环绕柱子量度周长的语境中，“绳子”具体而自然。“另有”顺畅承接前一尺寸说明。
- source_word: שְׁתֵּים עֶשְׂרֵה אַמָּה
  choice: 十二肘长
  rationale: 保留原有长度单位，并补出汉语表达长度所需的“长”。
- source_word: יָסֹב
  choice: 环绕
  rationale: 忠实保留动词“绕行、环绕”的形象，不将其解释性改写为“量得周长”。
- source_word: הָעַמּוּד הַשֵּׁנִי
  choice: 第二根柱子
  rationale: 马所拉文本明确写“第二根柱子”，因此不改作代词“它”，也不把两根柱子的尺寸关系默默协调。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而清楚的叙述语体。直译马所拉文本中“一根柱子”与“第二根柱子”的不寻常转换，保留原文可能造成的张力，不擅自说明两柱尺寸相同。
