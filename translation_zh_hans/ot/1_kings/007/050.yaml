base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/050.yaml
  text: and the basins[a], the snuffers, the bowls, the cups, and the firepans, of pure gold; and the hinges for the doors of the inner house, for the Most Holy Place, and for the doors of the house, that is, the nave[d][c][b], of gold.
translation:
  language: zh_hans
  text: 还有盆、灯芯剪、碗[a]、小杯和火盘，都是纯金的；内殿（即至圣所[b]）的门轴座[c]，以及正殿[d]的门轴座，也都是金的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“用于洒液的碗”，指礼仪中用来盛放或洒出液体的器皿。
    reason: lexical_alternative
  - marker: b
    text: 按希伯来语字面可译“圣中之圣”。
    reason: lexical_alternative
  - marker: c
    text: 原文很可能指门轴转动所用的承座或类似配件，并非现代的侧装合页。
    reason: cultural_note
  - marker: d
    text: 即圣殿的主要大厅，与内殿相区别。也可译“大厅”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַסִּפּוֹת
  choice: 盆
  rationale: 在圣殿器皿清单中指盛装用的器皿；译作“盆”，并与后面的 מִזְרָקוֹת 区分。
- source_word: הַמְזַמְּרוֹת
  choice: 剪灯芯的剪子
  rationale: 该词在圣所语境中指修剪灯芯的器具；这样译比单用较生僻的“灯剪”更易懂，也不采用一般语境中的“修枝刀”义。
- source_word: הַמִּזְרָקוֹת
  choice: 碗
  rationale: 指礼仪中盛放或洒出液体的器皿；正文用自然的统称“碗”，脚注保留更具体的“洒碗”。
- source_word: הַכַּפּוֹת
  choice: 小杯
  rationale: 原词表示小型凹形器皿；“小杯”保留器物形态而不过度限定为勺或香炉。
- source_word: הַמַּחְתּוֹת
  choice: 火盘
  rationale: 指盛放或运送火炭的盘，既准确又避免“香炉”所暗示的专门焚香用途。
- source_word: זָהָב סָגוּר
  choice: 纯金
  rationale: 这一固定搭配指高品质、精炼的金；“纯金”是现代汉语中自然准确的表达。
- source_word: הַפֹּתוֹת
  choice: 轴座
  rationale: 原词所指很可能是供门轴转动的承座或类似配件，而不是现代侧装合页；正文采用简明的建筑用语，脚注加以说明。
- source_word: הַבַּיִת הַפְּנִימִי
  choice: 内殿
  rationale: 保留“内部殿宇”的空间含义，后面的同位说明表明它就是至圣所。
- source_word: קֹדֶשׁ הַקֳּדָשִׁים
  choice: 至圣所
  rationale: 准确表达希伯来语的最高级结构，也是现代中文读者熟悉而庄重的称呼。
- source_word: הֵיכָל
  choice: 正殿
  rationale: 这里指与内殿相区别的圣殿主要大厅；“正殿”自然地体现这一空间区别。
- source_word: זָהָב
  choice: 也是金的
  rationale: 希伯来语在器物清单末尾再次标明门轴座的材质；中文补出判断结构，使句意完整。
theological_decisions:
- issue: קֹדֶשׁ הַקֳּדָשִׁים 的表达
  choice: 至圣所
  alternative: 圣中之圣
  rationale: “至圣所”清楚传达希伯来语最高级构式，并保持经文所指的殿内空间；脚注保留更贴近字面的传统式表达，未借此引入额外神学解释。
translation_notes:
  register: 采用现代、庄重而易懂的圣殿器物用语。句式保留希伯来文清单的并列结构，同时在中文中补出“都是”和“也都是”，明确两组器物的材质。用“内殿……至圣所”与“正殿”呈现原文的空间对照；对不确定的器皿功能和古代门构件以脚注保留词义范围。
