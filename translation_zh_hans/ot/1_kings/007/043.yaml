lexical_decisions:
- source_word: וְ/אֶת
  choice: 以及
  rationale: אֵת是定指直接宾语标记，无须另译；וְ延续器物清单的并列关系，用“以及”自然表达增列。
- source_word: הַ/מְּכֹנוֹת
  choice: 盆座
  rationale: מְכוֹנוֹת在本段指前文所描述、用来承托盆的带轮座架。“盆座”简明地表达其实际用途，又不像“车”那样过度强调其可移动性。
- source_word: עָשֶׂר
  choice: 十个
  rationale: 基数词，表示盆座的数量。
- source_word: הַ/כִּיֹּרֹת
  choice: 盆
  rationale: כִּיּוֹר指供洗涤使用的盆。“盆”是现代汉语中自然、准确且不古奥的称呼。
- source_word: עֲשָׂרָה
  choice: 十个
  rationale: 基数词，表示盆的数量。
- source_word: עַל
  choice: 上
  rationale: 该介词表示盆安放在支承它们的盆座之上；汉语以“盆座上的”自然表达这种空间关系。
- source_word: הַ/מְּכֹנוֹת
  choice: 盆座
  rationale: 同一节重复使用同一词，保持器物名称前后一致。
