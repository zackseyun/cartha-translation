  text: וְ/חָצֵ֨ר הַ/גְּדוֹלָ֜ה סָבִ֗יב שְׁלֹשָׁה֙ טוּרִ֣ים גָּזִ֔ית וְ/ט֖וּר כְּרֻתֹ֣ת אֲרָזִ֑ים וְ/לַ/חֲצַ֧ר בֵּית יְהוָ֛ה הַ/פְּנִימִ֖ית וּ/לְ/אֻלָ֥ם הַ/בָּֽיִת־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/012.yaml
  text: And the great court all around had three rows of cut stone and a row of cedar beams[c][b][a], like the inner court of the house of Yahweh and the vestibule of the house.
translation:
  language: zh_hans
  text: 大院四周有三层经凿制的石料和一层香柏木梁[a]，与耶和华殿的内院和殿的门廊相同[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “三层经凿制的石料和一层香柏木梁”，也可译作“三排凿石和一排香柏木料”。
    reason: “层／排”及“木梁／木料”反映 טוּר 与 כְּרֻתֹת 在建筑语境中的词义选择。
  - marker: b
    text: “与……相同”，或可译作：“耶和华殿的内院和殿的门廊也是如此。”原文介词可以表示对应关系，也可较直接地理解为“为、给”。
    reason: 保留希伯来语介词 לְ 在省略结构中的句法歧义。
lexical_decisions:
- source_word: חָצֵר הַגְּדוֹלָה
  choice: 大院
  rationale: חָצֵר 指有围界的院落；“大院”简洁自然，并保留其建筑空间含义。
- source_word: סָבִיב
  choice: 四周
  rationale: 表达环绕整个院落的空间关系，符合现代汉语习惯。
- source_word: שְׁלֹשָׁה טוּרִים גָּזִית
  choice: 三层凿好的石头
  rationale: 建筑语境中的 טוּר 指横向排列的层或列；与石材搭配时译作“层”较清楚。גָּזִית 指经过凿制加工的石料。
- source_word: וְטוּר כְּרֻתֹת אֲרָזִים
  choice: 和一层香柏木梁
  rationale: 该短语与石料的层次平行；כְּרֻתֹת 是砍削成形的木件，在此建筑语境中自然译作“木梁”。
- source_word: וְלַחֲצַר בֵּית יְהוָה הַפְּנִימִית וּלְאֻלָם הַבָּיִת
  choice: 与耶和华殿的内院和殿的门廊相同
  rationale: 两个 לְ 可理解为表示对应或关系；结合上文省略的建筑描述，用“与……相同”显明比较关系，同时以脚注保留较直译的关系性读法。
- source_word: אֻלָם
  choice: 门廊
  rationale: 指宏大建筑入口处的前厅或廊厅；“门廊”通俗、准确，适合圣殿建筑语境。
- source_word: הַבָּיִת
  choice: 殿
  rationale: 此处特指圣殿主体建筑；译作“殿”比字面的“房屋”更自然且不致误解。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。中文采用广为人知且庄重的传统专名“耶和华”，不以“主”替代，从而保留专名性质。
translation_notes:
  register: 采用现代、庄重而通俗的建筑叙述。“大院、凿好的石头、香柏木梁、门廊”便于普通读者理解；脚注保留施工术语及介词关系的真实歧义。
