source:
  edition: WLC
  text: בֶּן אִשָּׁה֩ אַלְמָנָ֨ה ה֜וּא מִ/מַּטֵּ֣ה נַפְתָּלִ֗י וְ/אָבִ֣י/ו אִישׁ צֹרִי֮ חֹרֵ֣שׁ נְחֹשֶׁת֒ וַ֠/יִּמָּלֵא אֶת הַ/חָכְמָ֤ה וְ/אֶת הַ/תְּבוּנָה֙ וְ/אֶת הַ/דַּ֔עַת לַ/עֲשׂ֥וֹת כָּל מְלָאכָ֖ה בַּ/נְּחֹ֑שֶׁת וַ/יָּבוֹא֙ אֶל הַ/מֶּ֣לֶךְ שְׁלֹמֹ֔ה וַ/יַּ֖עַשׂ אֶת כָּל מְלַאכְתּֽ/וֹ־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/014.yaml
  text: He was the son of a widow from the tribe of Naphtali[a], and his father was a man of Tyre, a worker in bronze. He was filled with wisdom, understanding, and knowledge to do every kind of work in bronze[b]. So he came to King Solomon and did all his work.
translation:
  language: zh_hans
  text: 他是拿弗他利支派一个寡妇的儿子；他的父亲是推罗人，是铜匠。他被智慧、聪明和知识充满，能从事各样铜工[a]。他来到所罗门王那里，做了他的一切工作。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里的希伯来词可指铜或青铜；本节译作“铜”，泛指这类金属工艺所用的金属。
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן אִשָּׁה אַלְמָנָה
  choice: 一个寡妇的儿子
  rationale: 贴近希伯来语结构，保留对其母亲寡居身份的强调，同时符合现代汉语表达。
- source_word: מִמַּטֵּה נַפְתָּלִי
  choice: 属拿弗他利支派
  rationale: מַטֶּה在族属语境中指“支派”；此译清楚表达其母系族属。
- source_word: אִישׁ צֹרִי
  choice: 推罗人
  rationale: צֹרִי是由地名“推罗”构成的族称，简洁自然。
- source_word: חֹרֵשׁ נְחֹשֶׁת
  choice: 铜匠
  rationale: חֹרֵשׁ指有技能的工匠；נְחֹשֶׁת可指铜或青铜。“铜匠”是自然、宽泛的职业称呼。
- source_word: וַיִּמָּלֵא
  choice: 他满有
  rationale: 反映该动词“被充满／充足具备”的状态含义；汉语用“满有”自然庄重，又不额外指明赋予者。
- source_word: הַחָכְמָה וְאֶת הַתְּבוּנָה וְאֶת הַדַּעַת
  choice: 智慧、聪明和知识
  rationale: 保留原文三项并列；在本语境中这些词兼有实际工艺能力的含义。
- source_word: לַעֲשׂוֹת כָּל מְלָאכָה בַּנְּחֹשֶׁת
  choice: 能做各样铜工
  rationale: 表达其从事各种相关金属工艺的能力，简明而符合现代汉语。
- source_word: וַיָּבוֹא אֶל הַמֶּלֶךְ שְׁלֹמֹה
  choice: 他来到所罗门王那里
  rationale: 按叙事次序直译，不额外赋予因果关系。
- source_word: וַיַּעַשׂ אֶת כָּל מְלַאכְתּוֹ
  choice: 做王交给他的一切工作
  rationale: 希伯来语字面为“做他的一切工作”；依近距离先行词“所罗门王”，可理解为王的工程或所交付的工作，但以脚注保留代词指向的歧义。
theological_decisions:
- issue: וַיִּמָּלֵא所表达的能力来源
  choice: 他满有智慧、聪明和知识
  alternative: 他被智慧、聪明和知识充满
  rationale: 原文使用Niphal形式，可能暗示所领受的装备，却未在本节明说施事者。译文不增补“神使他”，以免消除原文保留的含蓄。
- issue: מְלַאכְתּוֹ中第三人称阳性单数后缀的指向
  choice: 王交给他的一切工作，并加脚注
  alternative: 他自己的一切工作
  rationale: 后缀在语法上可指所罗门，也可指工匠本人的任务。正文采用上下文较顺畅的理解，脚注保留真实歧义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“铜匠”“铜工”保持简洁，并借脚注说明נְחֹשֶׁת在材质上的语义范围。正文的所有脚注标记均已对应出现。
