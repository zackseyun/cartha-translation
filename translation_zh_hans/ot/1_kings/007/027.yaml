base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/027.yaml
  text: He made ten bronze stands. The length of each stand was four cubits[a], its width four cubits, and its height three cubits.
translation:
  language: zh_hans
  text: 他制造了十个青铜座架[a]。每个座架长四肘[b]，宽四肘，高三肘。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“底座”。这里的希伯来词指用来支承盆的座架。
    reason: 说明器物名称的可行替代译法及其在上下文中的功能，不加入本节未明说的地点信息。
  - marker: b
    text: 一肘约合45厘米。
    reason: 为现代读者提供古代长度单位的约略换算；主文保留原有单位。
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: 他制造了
  rationale: 该叙事形式推进事件次序；现代汉语用简单过去语义表达即可，无须机械加入“然后”或“又”。
- source_word: הַמְּכֹנוֹת
  choice: 座
  rationale: 此词在圣殿器具语境中指支承水盆的可移动铜制底座；“座”简洁自然，并由脚注说明具体功能。
- source_word: עֶשֶׂר
  choice: 十个
  rationale: 准确表达基数，并配合现代汉语量词“个”。
- source_word: נְחֹשֶׁת
  choice: 铜
  rationale: 希伯来词可泛指铜或铜合金；圣殿器具中常理解为青铜，但中文“铜”能保留原词在具体合金成分上的宽度。
- source_word: הַמְּכוֹנָה הָאֶחָת
  choice: 每个座
  rationale: 字面为“那一个座”，在这里具有逐一分配的意思；译作“每个座”最清楚。
- source_word: אַמָּה
  choice: 肘
  rationale: 保留古代长度单位，不以不确定的现代数值替代；中文圣经语体中“肘”简明且易识别。
- source_word: אֹרֶךְ / רָחְבָּהּ / קוֹמָתָהּ
  choice: 长／宽／高
  rationale: 分别准确、自然地表达物件的长度、宽度和高度。
