  text: All the doorways and the doorposts had square frames[b][a], and window was opposite window three times.
translation:
  language: zh_hans
  text: 所有门口和门柱都是方的[a]；窗户与窗户相对，分为三层[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“所有开口和门柱都有方形的框缘。”原文的建筑术语也可能特指开口上部的框缘或楣梁。
    reason: lexical_alternative
  - marker: b
    text: 原文直译：“窗户与窗户相对三次。”可能指相对的窗户分三层或三排排列。
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּתָחִים
  choice: 门口
  rationale: 该词指建筑物的开口或入口；此处描述结构，译作“门口”比“门”更准确自然。
- source_word: מְּזוּזוֹת
  choice: 门框
  rationale: 该词通常指门的侧柱或门梃；现代汉语“门框”清楚自然，也能与后面的建筑术语连贯搭配。
- source_word: רְבֻעִים שָׁקֶף
  choice: 方正的
  rationale: 原文短语语法和建筑含义并不完全明确，涉及四方形状及框缘或楣梁；正文用“方正的”避免武断限定为仅有上楣，并以脚注保留另一种理解。
- source_word: מ֧וּל מֶחֱזָ֛ה אֶל מֶחֱזָ֖ה
  choice: 窗户与窗户相对
  rationale: מֶחֱזָה在此建筑语境中最可能指供观看或采光的开口，即窗户；מוּל表示相对或对应。
- source_word: שָׁלֹשׁ פְּעָמִים
  choice: 共有三层
  rationale: 字面为“三次”，结合上下文的建筑布局，较可能表示这种相对排列重复三层；脚注保留字面表达及“三排”的可能。
