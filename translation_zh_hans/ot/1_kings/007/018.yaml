base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/018.yaml
  text: He made the pillars[a], and two rows all around on the one latticework, to cover the capitals that were on top of the pomegranates[b]; and so he did for the second capital.
translation:
  language: zh_hans
  text: 他造了两根柱子，又在其中一个网状饰带四周做了两行装饰，为要遮盖石榴[a]顶上的柱头[b]；第二个柱头也是这样做的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里的“石榴”很可能指石榴形的装饰物。
    reason: lexical_alternative
  - marker: b
    text: 本节希伯来文的句法和各装饰构件之间的关系不甚清楚；也有人理解为，两行石榴装饰环绕着每个柱头的网状饰带。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַשׂ אֶת הָעַמּוּדִים
  choice: 他造了两根柱子
  rationale: 按马所拉文本直译核心叙事；上下文表明所指为两根柱子，因此在中文中补出“两根”，使表达自然清楚。
- source_word: וּשְׁנֵי טוּרִים
  choice: 又……做了两行装饰
  rationale: טוּר指成列排列的事物；原文省略这些行列由什么构成，译文以泛称“装饰”补足中文句法，同时不具体断定其形状。
- source_word: סָבִיב עַל הַשְּׂבָכָה הָאֶחָת
  choice: 在其中一个网状饰带四周
  rationale: שְׂבָכָה是柱头上的网状装饰结构；“其中一个”保留定冠词加数词所指的两个对应构件之一。
- source_word: לְכַסּוֹת
  choice: 为要遮盖
  rationale: 保留不定式表达的目的关系，也保留“遮盖”在此建筑描述中的具体方式尚不明确这一点。
- source_word: הַכֹּתָרֹת
  choice: 柱头
  rationale: כֹּתֶרֶת在本段建筑语境中指柱子顶端的装饰性柱头；“柱头”是现代汉语通行建筑术语。
- source_word: הָרִמֹּנִים
  choice: 石榴
  rationale: 原词直译为“石榴”，在此很可能指石榴形装饰；正文保留原文形象，脚注说明其装饰含义。
- source_word: וְכֵן עָשָׂה לַכֹּתֶרֶת הַשֵּׁנִית
  choice: 第二个柱头也是这样做的
  rationale: 自然表达同样工序用于另一个柱头，并保留原文“第二个”的对应关系。
theological_decisions: []
