  text: And there were four supports at the four corners of the one stand; its supports were part of the stand itself.
translation:
  language: zh_hans
  text: 这一个座架的四角各有一个支撑，共四个；这些支撑是座架本身的一部分。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כְתֵפוֹת / כְתֵפֶיהָ
  choice: 支撑
  rationale: 该词本义为“肩部”，在此描述座架四角伸出的承托构件；译作“支撑”符合器物语境，也便于现代读者理解。
- source_word: הַמְּכֹנָה
  choice: 座架
  rationale: 指承托铜盆的可移动架座；“座架”既体现其底座性质，也与上下文器物结构相符。
- source_word: הָאֶחָת
  choice: 那一个
  rationale: 保留希伯来文本明确出现的单数“一”，不依照平行结构擅自改作“每一个”。
- source_word: מִן הַמְּכֹנָה
  choice: 与座架连成一体
  rationale: 介词短语表明支撑出自座架本身、不是另行安装的部件；按自然汉语表达其结构关系。
