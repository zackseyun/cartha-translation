  text: There were three rows of window frames[a], with window opposite window three times.
translation:
  language: zh_hans
  text: 有三排窗框；窗与窗相对，如此三次。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“窗与窗相对，共三次。”希伯来文直译为“窗对着窗三次”；这可能是指这种排列在三个层级中重复出现。
    reason: 保留“ 三次 ”的字面表达，并说明“三个层级”是可能的建筑学解释，避免正文将其确定化。
lexical_decisions:
- source_word: שְׁקֻפִים
  choice: 窗框
  rationale: 该词在此建筑语境中指有框的开口或窗格结构；译作“窗框”比笼统的“窗户”更能体现结构含义，也避免采用较不确定的“过梁”。
- source_word: שְׁלֹשָׁה טוּרִים
  choice: 三排
  rationale: טוּר表示依次排列的行列；“三排”是现代汉语中自然、清楚的建筑描述。
- source_word: מֶחֱזָה אֶל מֶחֱזָה
  choice: 窗与窗相对
  rationale: מֶחֱזָה在这里指可供观看或采光的开口，结合上下文译作“窗”；אֶל表达彼此对应或朝向，故译作“相对”。
- source_word: שָׁלֹשׁ פְּעָמִים
  choice: 共有三层
  rationale: 字面为“三次”，但在建筑布局中很可能描述这种相对排列在三个层级重复出现；正文采用自然且符合语境的“三层”，脚注保留字面可能性。
