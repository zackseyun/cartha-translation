base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/024.yaml
  text: And gourds were under its rim all around[a], encircling it, ten to the cubit, surrounding the Sea all around. The gourds were in two rows, cast in one piece with it.
translation:
  language: zh_hans
  text: 海的边沿下方有瓜形饰物[a]，环绕着它；每肘十个，围绕海的四周。这些瓜形饰物排成两行，与海一体铸成。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“花蕾形饰物”或“凸饰”；希伯来语所指的是类似瓜果形状的装饰。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפְקָעִים
  choice: 瓜形饰物
  rationale: 该词指类似瓜果形状的装饰性凸起；译为“瓜形饰物”既保留具体形象，也避免断定其植物种类或具体造型。
- source_word: מִתַּחַת לִשְׂפָתוֹ
  choice: 海的边沿下面
  rationale: שָׂפָה本义为“唇、边缘”，这里指大型铜海上部的边沿；“边沿”符合现代汉语器物描写。
- source_word: סָבִיב סֹבְבִים אֹתוֹ
  choice: 环绕一周
  rationale: 原文以同根词重复强化环绕之意；汉语用“环绕一周”自然地表达其完整环绕。
- source_word: עֶשֶׂר בָּאַמָּה
  choice: 每肘十个
  rationale: 该短语表示沿周边排列的密度，即每一肘有十个；此译简洁明确，不额外推定测量方法。
- source_word: מַקִּפִים אֶת הַיָּם סָבִיב
  choice: 围绕着海
  rationale: “海”是这座大型铸造水池的专称；保留原文再次说明饰物环绕铜海的表达。
- source_word: שְׁנֵי טוּרִים
  choice: 共有两行
  rationale: טוּרִים意为成列排列的“行”；“共有两行”清楚交代装饰的布局。
- source_word: יְצֻקִים בִּיצֻקָתוֹ
  choice: 与海一体铸成
  rationale: 原文用同根的“铸”字结构，表明这些饰物在铸造海时同时成形，并非后来附加；“一体铸成”自然传达这一工艺信息。
theological_decisions: []
