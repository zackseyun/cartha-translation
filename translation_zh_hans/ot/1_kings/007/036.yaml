  text: On the panels of its supports and on its frames he engraved cherubim[a], lions, and palm trees, according to the space on each[b], with wreaths all around.
translation:
  language: zh_hans
  text: 他在盆座支架的板面和边框上雕刻了基路伯、狮子和棕榈树；各图案按可用的空处[a]刻制，四周有花环[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文这一短语含义不确定，也可译作“各个图案都刻在适合它的空处”。
    reason: lexical_alternative
  - marker: b
    text: “花环”也可译作“垂花饰”或“花彩”。原文可能指环绕图案的装饰带。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְפַתַּח
  choice: 雕刻
  rationale: 在金属器具的装饰语境中，指刻出图案；“雕刻”自然且能涵盖刻入表面的工艺。
- source_word: הַלֻּחֹת יְדֹתֶיהָ
  choice: 盆座支架的板面
  rationale: לֻחוֹת 指板状表面，יָדוֹת 字面为“手”，在此指盆座伸出的支架或侧部构件；合译可清楚表达构造关系。
- source_word: מַסְגְּרֹתֶיהָ
  choice: 边框
  rationale: 指围合板面的框架或镶边；“边框”符合器物构造语境。
- source_word: כְּרוּבִים
  choice: 基路伯
  rationale: 采用中文圣经传统音译，指圣所图像中的有翼灵界活物，避免译成现代文化中幼童天使式的形象。
- source_word: אֲרָיוֹת
  choice: 狮子
  rationale: 直接表示装饰图案中的狮子。
- source_word: תִמֹרֹת
  choice: 棕榈树
  rationale: 在圣殿装饰语境中指棕榈树形图案。
- source_word: כְּמַעַר אִישׁ
  choice: 按各处可用的空间排列
  rationale: 原文短语罕见且含义困难，可能说明各图案依相应的空白或可用位置安排；正文采用通顺但保留空间概念的译法。
- source_word: לֹיֹת
  choice: 花环
  rationale: 该词可能指环绕图案的花环、彩带状饰带或垂花饰；“花环”简洁表达装饰性环绕物。
- source_word: סָבִיב
  choice: 四周
  rationale: 表达装饰物环绕分布。
