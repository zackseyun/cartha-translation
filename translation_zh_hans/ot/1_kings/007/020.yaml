base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/020.yaml
  text: And the capitals were on the two pillars[a], also above, opposite the bulge that was beside the latticework; and the pomegranates were two hundred, in rows all around[c][b], on the second capital.
translation:
  language: zh_hans
  text: 两根柱子上都有柱头；柱头上方正对着网状饰物另一边的圆鼓部分。石榴有二百个，成行环绕在第二个柱头上。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כֹתָרֹת
  choice: 柱头
  rationale: 在柱子顶部的建筑语境中，指柱头；这是现代汉语中准确、易懂的建筑术语。
- source_word: מִלְעֻמַּת הַבֶּטֶן
  choice: 在……鼓起部分的上方
  rationale: לְעֻמַּת 表示相对、正对的位置；הַבֶּטֶן 字面为“腹部”，此处指柱头圆鼓的部位。结合 מִמַּעַל，以自然汉语表达其上下相对关系。
- source_word: שבכה
  choice: 网状饰物
  rationale: 指柱头上的网格或格子状装饰；“网状饰物”既说明形状，也避免使人误解为实用的网。
- source_word: הָרִמּוֹנִים
  choice: 石榴
  rationale: 此处指石榴形的装饰。上下文已是建筑装饰，正文保留原文简洁的称呼。
- source_word: מָאתַיִם טֻרִים סָבִיב
  choice: 共有二百个，分排环绕
  rationale: 保留二百这一总数，以及 טֻרִים 所表达的成排布置和 סָבִיב 所表达的环绕位置。
- source_word: עַל הַכֹּתֶרֶת הַשֵּׁנִית
  choice: 在第二个柱头上
  rationale: 按 הַשֵּׁנִית 的通常序数含义直译；在成对柱头的描述中，也可能是“另一个柱头”，故列入脚注。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的建筑用语。“有装饰”根据上下文补出，以使原文省略成分较多的建筑描述在汉语中成句；分号保留后半句对石榴数目和排列方式的独立说明。
