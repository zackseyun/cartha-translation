lexical_decisions:
- source_word: וְזֶה
  choice: 是这样
  rationale: 连词与指示词在此引出对底座结构的说明；译为“是这样”符合现代汉语叙述习惯，也保留承接上文的作用。
- source_word: מַעֲשֵׂה
  choice: 构造
  rationale: 此处描述器物的制作形制和结构，“构造”比泛指的“工作”更切合建筑与工艺语境。
- source_word: הַמְּכוֹנָה
  choice: 底座
  rationale: 本段所指是承托盆、装有轮子的座架；“底座”简明自然，并与器物功能相符。
- source_word: מִסְגְּרֹת
  choice: 镶板
  rationale: 该词指底座中带框的区块或嵌板；“镶板”在中文中能清楚表达可能的结构形态，同时以脚注保留“框架”的词义可能。
- source_word: לָהֶם
  choice: 它们都有
  rationale: 介词加复数代词表达归属。结合上下文所述多个底座，译作“它们都有”自然传达所有关系，同时不强行模仿希伯来语单复数转换。
- source_word: וּמִסְגְּרֹת
  choice: 镶板
  rationale: 保留原文对该名词的重复，使结构说明清楚，并与前半句形成对应。
- source_word: בֵּין
  choice: 位于……之间
  rationale: 表达构件之间的空间位置；“位于……之间”是准确而自然的现代汉语。
- source_word: הַשְׁלַבִּים
  choice: 横档
  rationale: 该词指连接或分隔结构的构件，确切形制不明；正文采用容易理解的“横档”，并在脚注列出其他可能。
