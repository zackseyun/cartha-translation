base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/021.yaml
  text: He set up the pillars at the portico of the temple[a]. He set up the right pillar and called its name Jachin; then he set up the left pillar and called its name Boaz.
translation:
  language: zh_hans
  text: 他把两根柱子立在圣殿的门廊处。他立起右边的柱子，给它起名叫雅斤[a]；又立起左边的柱子，给它起名叫波阿斯[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “雅斤”是这根柱子希伯来文名称的音译，不是对其可能含义的翻译。
    reason: lexical_alternative
  - marker: b
    text: “波阿斯”是这根柱子希伯来文名称的音译，不是对其可能含义的翻译。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֶם
  choice: 立／立起
  rationale: 使役式在这里指使柱子站立、安置就位；“立起”自然准确，重复处略作措辞变化以符合现代汉语。
- source_word: הָעַמֻּדִים
  choice: 两根柱子
  rationale: עַמּוּד指柱子；希伯来文为复数，而下文明确逐一提到右、左两根，因此补出“两根”可自然传达语境中已确定的数量。
- source_word: לְאֻלָם הַהֵיכָל
  choice: 在圣殿的门廊前
  rationale: אוּלָם指圣殿主体前的门廊；介词לְ在此表示设置所对应的位置。“门廊前”符合建筑语境，也避免误解为柱子位于门廊内部。
- source_word: הָעַמּוּד הַיְמָנִי
  choice: 右边的柱子
  rationale: יְמָנִי直指右边；不进一步解释为南边，以保留原文的空间表达。
- source_word: וַיִּקְרָא אֶת שְׁמוֹ
  choice: 给它起名叫
  rationale: 自然表达希伯来语“称它的名”这一命名句式，同时保留正式叙事语气。
- source_word: יָכִין
  choice: 雅斤
  rationale: 采用现代中文圣经传统中通行的专名音译，不把名称可能含有的意义写入正文。
- source_word: הָעַמּוּד הַשְּׂמָאלִי
  choice: 左边的柱子
  rationale: שְׂמָאלִי意为左边，与“右边的柱子”形成原文的平行结构。
- source_word: בֹּעַז
  choice: 波阿斯
  rationale: 采用现代中文圣经传统中通行的专名音译，不将其可能含义作为正文译文。
