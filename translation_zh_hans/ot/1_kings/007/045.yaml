base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/045.yaml
  text: and the pots[a], the shovels, the basins[c][b], and all these vessels that Hiram made for King Solomon for the house of Yahweh were of burnished bronze.
translation:
  language: zh_hans
  text: 锅、铲子、碗[a]和这一切器具，是希兰为所罗门王制造、供雅威殿使用的；全是磨亮的青铜[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “碗”或译“盆”。
    reason: lexical_alternative
  - marker: b
    text: “磨亮的青铜”或译“磨光的青铜”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַסִּירוֹת
  choice: 锅
  rationale: סִירוֹת指锅或大锅一类容器；这里采用简明、宽泛的“锅”，不额外限定具体用途。
- source_word: הַיָּעִים
  choice: 铲子
  rationale: יָעִים指清理祭坛灰烬或铲取物料所用的器具，“铲子”自然且符合圣殿器具的语境。
- source_word: הַמִּזְרָקוֹת
  choice: 碗
  rationale: מִזְרָקוֹת指盛接或洒液体的容器；“碗”在现代汉语中清楚自然，同时以脚注保留“盆”的可能。
- source_word: כָּל־הַכֵּלִים הָאֵלֶּה
  choice: 这一切器具
  rationale: כֵּלִים是器皿、用具的总称；“器具”适合概括前列物件，הָאֵלֶּה译为“这”。
- source_word: חִירָם
  choice: 希兰
  rationale: 采用该人物在现代中文圣经传统中通行的音译。
- source_word: בֵּית יְהוָה
  choice: 雅威殿
  rationale: בֵּית直译为“房屋”，但在此明确指圣殿；“雅威殿”在现代汉语中简洁清楚，并保留神名。
- source_word: נְחֹשֶׁת
  choice: 青铜
  rationale: נְחֹשֶׁת可指铜或铜合金；圣殿金属器具语境中译作“青铜”较为妥当。
- source_word: מְמֹרָט
  choice: 磨亮的
  rationale: 该词表示金属经过磨光或抛光；“磨亮的”既传达工艺与光泽，也比生僻的技术用语更易懂。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；采用“雅威”作为较贴近YHWH的现代汉语音译，不以称号替代神名。
- issue: 句末 נְחֹשֶׁת מְמֹרָט 与全句的关系
  choice: 作为前述全部器具的谓语：“全是磨亮的青铜”
  alternative: 作为松散附加语：“磨亮的青铜”
  rationale: 希伯来语末尾是无系词名词性谓语，最自然地说明整列器具的材质；汉语补出“全是”使关系清楚，不改变原意。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。保留清单式节奏，以“都是……全是……”明确原文无系词句的谓语关系；不额外推断各器具的具体礼仪用途。
