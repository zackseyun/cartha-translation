  yaml_path: translation/ot/1_kings/007/016.yaml
  text: He made two capitals of cast bronze to set on the tops of the pillars. The height of the one capital was five cubits[a], and the height of the second capital was five cubits.
translation:
  language: zh_hans
  text: 他造了两个铸铜的柱头[a]，安放在柱子的顶端。一个柱头高五肘，第二个柱头也高五肘。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “柱头”也可译为“冠”；希伯来语此词指柱子顶部的装饰部分。
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹתָרֹת / הַכֹּתֶרֶת
  choice: 柱头
  rationale: 在柱顶建筑构件的语境中，指柱子顶部带装饰性的部分；“柱头”是现代汉语中准确、自然的建筑术语。
- source_word: עָשָׂה
  choice: 造了
  rationale: 忠实表达常用动词“制作、造”，符合建筑叙述的简洁语体。
- source_word: לָתֵת
  choice: 安在
  rationale: 该不定式表示目的；“安在”自然表达把建筑构件设置在柱顶。
- source_word: רָאשֵׁי הָעַמּוּדִים
  choice: 两根柱子的顶端
  rationale: רָאשֵׁי 在此为建筑意义上的“顶端”；根据上下文，两件柱头分别置于两根柱子之上，补出量词使中文清楚自然。
- source_word: מֻצַק נְחֹשֶׁת
  choice: 铸铜
  rationale: 兼顾材料和铸造工艺；圣经语境中的 נְחֹשֶׁת 通常指铜或铜合金，中文传统上以“铜”概括较为稳妥。
- source_word: חָמֵשׁ אַמּוֹת
  choice: 五肘
  rationale: 保留原文古代长度单位，避免以不确定的现代换算取代原文。
- source_word: קוֹמַת
  choice: 高
  rationale: 在建筑尺寸语境中简洁准确地表示高度。
- source_word: הָאֶחָת
  choice: 一个
  rationale: 保留原文“一个”的表达，不擅自改成“第一个”。
- source_word: הַשֵּׁנִית
  choice: 第二个
  rationale: 原文明确说“第二个”，因此照实保留。
