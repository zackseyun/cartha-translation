  text: וְ/אֶת הַ֠/מְּנֹרוֹת חָמֵ֨שׁ מִ/יָּמִ֜ין וְ/חָמֵ֧שׁ מִ/שְּׂמֹ֛אול לִ/פְנֵ֥י הַ/דְּבִ֖יר זָהָ֣ב סָג֑וּר וְ/הַ/פֶּ֧רַח וְ/הַ/נֵּרֹ֛ת וְ/הַ/מֶּלְקַחַ֖יִם זָהָֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/049.yaml
  text: and the lampstands[a], five on the right and five on the left, before the inner sanctuary, of pure gold; and the flowers, the lamps, and the tongs[c][b], of gold.
translation:
  language: zh_hans
  text: 又有灯台，右边五座，左边五座，安放在内殿[a]前，都是纯金[b]的；还有花饰、灯盏和钳子[c]，也都是金的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“至圣所前”。希伯来语“内殿”指圣殿最里面的房间。
    reason: lexical_alternative
  - marker: b
    text: “纯金”或译“精炼的金”。
    reason: lexical_alternative
  - marker: c
    text: “钳子”或译“灯芯剪”。这种器具用于料理灯盏。
    reason: lexical_alternative
lexical_decisions:
- source_word: מְּנֹרוֹת
  choice: 灯台
  rationale: 指承托油灯的灯台，而不是灯盏本身；“灯台”也避免“烛台”使现代读者联想到蜡烛。
- source_word: מִיָּמִין ... מִשְּׂמֹאול
  choice: 右边……左边
  rationale: 按希伯来文的相对方位直译，不在正文中进一步解释为南边和北边。
- source_word: לִפְנֵי הַדְּבִיר
  choice: 在内殿前
  rationale: דְּבִיר 指圣殿最里面的房间；“内殿”简洁自然，并保留其空间意义。
- source_word: זָהָב סָגוּר
  choice: 纯金
  rationale: 该词组指优质、经过炼净的金；“纯金”是自然的现代汉语表达，脚注保留“精炼的金”这一可能译法。
- source_word: הַפֶּרַח
  choice: 花饰
  rationale: פֶּרַח 字面为“花朵”，此处指灯台上的花形装饰；希伯来文单数可作集合意义理解。
- source_word: הַנֵּרֹת
  choice: 灯盏
  rationale: 指安置在灯台上的各个盛油点灯器皿，与“灯台”清楚区分。
- source_word: הַמֶּלְקַחַיִם
  choice: 夹钳
  rationale: 该词指夹取用的双股工具；“夹钳”保持器具名称的宽泛含义，不在正文中限定其具体用途。
- source_word: זָהָב
  choice: 金的
  rationale: 末尾的“金”统摄花饰、灯盏和夹钳；译作“都是金的”符合清单语体，也保留材质说明。
theological_decisions:
- issue: הַדְּבִיר 的圣所称谓
  choice: 内殿
  alternative: 至圣所
  rationale: 原词首先指圣殿最里面的房间；正文采用空间性较强的“内殿”，脚注说明也可按其礼仪名称译为“至圣所”，不把两者的关系隐去。
translation_notes:
  register: 采用现代、庄重而易懂的圣殿器物清单语体。量词“座”用于灯台；“花饰”和“灯盏”分别表达装饰构件与实际点灯器皿。各脚注标记均紧随其所说明的词语。
