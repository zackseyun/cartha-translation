base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/008.yaml
  text: His house where he was to live[a], in the other court farther back from the Hall, was of the same workmanship. He also made a house like this Hall for Pharaoh’s daughter[b], whom Solomon had taken as wife.
translation:
  language: zh_hans
  text: 他居住的宫室在另一院内，位于大厅后方[a]；做工也是这样。所罗门也为他所娶的法老女儿[b]建造了一座像这大厅一样的宫室。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “位于大厅后方”所译的希伯来语空间短语含义不易确定，也可理解为“从大厅往内”。不同译本对这宫室与大厅的相对位置有不同表述。
    reason: alternative_reading
  - marker: b
    text: 希伯来文直译为“所罗门所取的”；这里指娶她为妻。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבֵיתוֹ אֲשֶׁר יֵשֶׁב שָׁם
  choice: 他居住的宫室
  rationale: בַּיִת 在王宫建筑语境中指居所或宫室；关系从句说明其居住用途。中文不必另译 שָׁם，避免“他在那里居住的宫室”的累赘。
- source_word: חָצֵר הָאַחֶרֶת
  choice: 另一院内
  rationale: חָצֵר 指建筑群中的院子；定冠词所指的具体关系在中文“另一院”中已可自然表达。
- source_word: מִבֵּית לָאוּלָם
  choice: 就是大厅后面
  rationale: 这一空间短语结构艰难，可能表示从大厅往内、在大厅后方。正文采用易懂的方位表达，同时以脚注保留不确定性。
- source_word: כַּמַּעֲשֶׂה הַזֶּה הָיָה
  choice: 做工与这大厅相同
  rationale: מַעֲשֶׂה 在建筑语境中指做工或建造方式；“这大厅”按上下文补明比较对象，使中文连贯。
- source_word: וּבַיִת יַעֲשֶׂה לְבַת־פַּרְעֹה
  choice: 也为法老的女儿……建造了一座……宫室
  rationale: 未完成式在建筑叙述中表达过去的建造行动；“宫室”符合王室建筑语境。
- source_word: אֲשֶׁר לָקַח שְׁלֹמֹה
  choice: 就是他所娶的妻子
  rationale: לָקַח 字面为“取、娶”；以女子为宾语时常指娶为妻。正文明确其婚姻含义，脚注注明字面说法。
- source_word: כָּאוּלָם הַזֶּה
  choice: 像这大厅一样
  rationale: אוּלָם 可指门廊或厅堂；本段皇家建筑规模较大，译作“大厅”自然，也与上下文一致。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的建筑叙述用语。“宫室”区别于普通住宅，“大厅”体现 אוּלָם 在王宫建筑群中的规模。保留原文空间关系的歧义，并避免据推测重建具体布局。
