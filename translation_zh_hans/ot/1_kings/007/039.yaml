  text: וַ/יִּתֵּן֙ אֶת הַ/מְּכֹנ֔וֹת חָמֵ֞שׁ עַל כֶּ֤תֶף הַ/בַּ֨יִת֙ מִ/יָּמִ֔ין וְ/חָמֵ֛שׁ עַל כֶּ֥תֶף הַ/בַּ֖יִת מִ/שְּׂמֹאל֑/וֹ וְ/אֶת הַ/יָּ֗ם נָתַ֞ן מִ/כֶּ֨תֶף הַ/בַּ֧יִת הַ/יְמָנִ֛ית קֵ֖דְמָ/ה מִ/מּ֥וּל נֶֽגֶב־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/039.yaml
  text: He placed five stands on the right side of the house and five on the left side of the house[a], and he placed the Sea on the southeast side of the house.
translation:
  language: zh_hans
  text: 他把五个盆座安放在殿的右侧，五个安放在殿的左侧；又把铜海安放在殿的东南侧[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“从殿的右侧，向东，正对南方”，是一种紧凑的方位描述；整体通常理解为殿的东南侧。
    reason: 说明原文的逐项方位表达，并保留其紧凑措辞所带来的解释空间。
lexical_decisions:
- source_word: הַמְּכֹנוֹת
  choice: 盆座
  rationale: 本段所指是承托洗濯盆的带轮铜制座架；“盆座”既说明功能，也避免仅译“车”而过分突出移动性。
- source_word: כֶּתֶף
  choice: 侧
  rationale: 原义为“肩”，用于建筑方位时指建筑物的一侧；译作“侧”自然且贴近原文意象的空间功能。
- source_word: הַבַּיִת
  choice: 殿
  rationale: 原文直译为“房屋”，但在本段明确指耶和华殿；现代汉语中“殿”既准确又庄重。
- source_word: מִיָּמִין / מִשְּׂמֹאלוֹ
  choice: 右侧／左侧
  rationale: 保留希伯来文以人体方位表达位置的方式，不直接改写为南侧／北侧。
- source_word: הַיָּם
  choice: 铜海
  rationale: 指圣殿中巨大的铸铜水盆；结合上下文译作传统且清楚的器物名称“铜海”，避免被理解为天然海洋。
- source_word: הַיְמָנִית קֵדְמָה מִמּוּל נֶגֶב
  choice: 右侧，朝东，正对南方
  rationale: 依次保留原文紧凑而略显生硬的方位成分，不把它们直接归并成“东南侧”，从而保存原文的表达及其空间解释上的张力。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙述体。“安放”适合大型圣殿器物；正文保留原文的右／左和复合方位表达，并以脚注说明通常的东南方理解。
