base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/030.yaml
  text: And the one stand had four bronze wheels and bronze axles[a], and its four corners had supports for them; beneath the basin the supports were cast[c][b], each beside wreathwork.
translation:
  language: zh_hans
  text: 每个底座[a]都有四个青铜轮和青铜轮轴；它的四个脚部各有支托件[b]。盆下方的这些支托件是铸造的，各在花环状装饰[c]旁。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “底座”指盆下面带轮的承托结构。
    reason: lexical_alternative
  - marker: b
    text: “支托件”原文直译为“肩膀”，这里指向外伸出的承托部件。
    reason: lexical_alternative
  - marker: c
    text: 这个希伯来词十分罕见，可能指花环、垂彩一类的装饰。
    reason: textual_or_lexical_uncertainty
lexical_decisions:
- source_word: אוֹפַנֵּי נְחֹשֶׁת
  choice: 青铜轮
  rationale: אוֹפַנִּים明确指轮子；在圣殿器具和铸造语境中，נְחֹשֶׁת宜译为“青铜”，比泛称“铜”更具体。
- source_word: לַמְּכוֹנָה הָאַחַת
  choice: 每一个底座
  rationale: מְכוֹנָה在本段指承托盆的带轮结构。“底座”准确表达其承托功能；希伯来语的定冠词加数词在逐一描述各底座，汉语用“每一个”最自然。
- source_word: סַרְנֵי נְחֹשֶׁת
  choice: 青铜轮轴
  rationale: 在轮子结构的语境中，סַרְנִים最可能指轴件；“轮轴”既清楚又避免误解为一般的杆。
- source_word: פַעֲמֹתָיו
  choice: 底座的四角
  rationale: 该词本可指脚或步，在这里描述器物四处设置支架的位置；按结构语境译作“四角”，但不进一步限定具体形状。
- source_word: כְּתֵפֹת
  choice: 支架
  rationale: 字面义是“肩膀”，用于器物结构时指向外伸出的承托部件；“支架”自然地传达其功能。
- source_word: מִתַּחַת לַכִּיֹּר
  choice: 盆下面
  rationale: כִּיּוֹר指盛水的盆；此处保留明确的上下空间关系。
- source_word: יְצֻקוֹת
  choice: 是铸成的
  rationale: 这是יצק在金属制造语境中的被动形式，“铸成”准确表达铸造工艺。
- source_word: מֵעֵבֶר אִישׁ
  choice: 每个支架旁边
  rationale: 该分配式表达表示各部件分别位于某装饰物旁边；译文保留逐一对应的关系，而不强行确定更具体的几何布局。
- source_word: לֹיוֹת
  choice: 花环装饰
  rationale: 这是罕见词，在圣殿器物语境中大概指花环或垂彩一类装饰；“花环装饰”通顺并保留其装饰性含义。
