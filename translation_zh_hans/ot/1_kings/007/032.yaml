base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/032.yaml
  text: And the four wheels were underneath the panels[a], and the axles of the wheels were on the stand[b]; and the height of each wheel was a cubit and a half.
translation:
  language: zh_hans
  text: 四个轮子在镶板[a]下面，轮子的轴[b]装在座架上；每个轮子高一肘半。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “镶板”或译“框架”或“边框”。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“轮子的手”；这里可能指轮轴或支承轮子的轴杆。
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֹפַנִּים / הָאוֹפַן
  choice: 轮子
  rationale: 在这段座架构造的描述中，אוֹפַן指实际安装在青铜座架上的轮子；“轮子”是自然、明确的现代汉语表达。
- source_word: לְמִתַּחַת
  choice: 在……下面
  rationale: 该复合介词表示位于某物下方；此译法自然地保留空间关系。
- source_word: הַמִּסְגְּרוֹת
  choice: 镶板
  rationale: מִסְגְּרוֹת在本段可能指座架侧面的框架、边框或嵌于框中的板面。“镶板”符合器物制作语境，同时以脚注保留其他可能。
- source_word: וִידוֹת
  choice: 轴
  rationale: 该词字面与“手”有关，但在轮子构造语境中指轮子的突出支承或连接部件；“轴”最能清楚表达其可能的机械功能，脚注保留原文字面与功能上的不确定性。
- source_word: בַּמְּכוֹנָה
  choice: 装在座架上
  rationale: מְכוֹנָה指承托盆的有轮青铜座架。介词ב可表达在其中、其上或与之相连；“装在……上”符合轴与座架连接的语境。
- source_word: קוֹמַת
  choice: 高
  rationale: 这里表示轮子的垂直尺寸；现代汉语量度句用“高”最简洁自然。
- source_word: הָאֶחָד
  choice: 每个
  rationale: 字面为“那一个”，在四个轮子均具同一尺寸的量度语句中具有逐一分配的意思，译作“每个”符合汉语习惯。
- source_word: אַמָּה וַחֲצִי הָאַמָּה
  choice: 一肘半
  rationale: 保留古代长度单位“肘”，不贸然换算为现代单位；“一肘半”准确而简洁。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。句式紧凑，适合建筑构造的叙述；保留“肘”这一古代计量单位，并通过脚注呈现关键器物术语的词义不确定性。
