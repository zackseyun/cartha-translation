  text: וְ/כֹֽתָרֹ֗ת אֲשֶׁר֙ עַל רֹ֣אשׁ הָ/עַמּוּדִ֔ים מַעֲשֵׂ֖ה שׁוּשַׁ֣ן בָּֽ/אוּלָ֑ם אַרְבַּ֖ע אַמּֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/019.yaml
  text: And the capitals that were on the tops of the pillars were made like a lily blossom in the portico[c][b][a], four cubits.
translation:
  language: zh_hans
  text: 柱顶上的柱头做成百合花形[b]；在门廊[a]处，高四肘[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“在前厅”或“在前廊”。希伯来语אוּלָם指圣殿建筑入口处的厅廊。
    reason: lexical_alternative
  - marker: b
    text: 或译“百合花式样”。有些人认为这里的שׁוּשַׁן是柱头上的莲花形装饰。
    reason: lexical_alternative
  - marker: c
    text: 希伯来原文直译为“四肘”，没有明说“高”；这个尺寸很可能是指柱头百合花形部分的高度。
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹתָרֹת
  choice: 柱头
  rationale: 建筑语境中指柱子顶端的装饰构件；“柱头”是现代汉语准确、通行的建筑术语。
- source_word: רֹאשׁ הָעַמּוּדִים
  choice: 柱顶上
  rationale: רֹאשׁ字面为“头”，在柱子语境中自然译作“柱顶”；保留其位置关系。
- source_word: מַעֲשֵׂה שׁוּשַׁן
  choice: 做成百合花形
  rationale: מַעֲשֵׂה可指做工、式样；此处描述柱头的花卉造型。שׁוּשַׁן通常译为“百合花”，但也有人理解为莲花式样，故正文采用通行译法并加注。
- source_word: בָּאוּלָם
  choice: 在门廊处
  rationale: אוּלָם指圣殿入口的厅廊或前廊；“门廊”在现代汉语中清楚自然，同时脚注保留“前厅”等可能译法。
- source_word: אַרְבַּע אַמּוֹת
  choice: 高四肘
  rationale: 原文只直陈“四肘”，未明说所量维度；上下文很可能指百合花形柱头部分的高度。正文为汉语自然表达补出“高”，并在脚注说明。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“柱头”“门廊”兼顾建筑语义与普通读者的可理解性；用脚注保留花卉名称、入口厅廊称谓及尺寸维度上的真实不确定性。
