  yaml_path: translation/ot/1_kings/007/029.yaml
  text: And on the panels that were between the frames were lions[a], oxen, and cherubim; and on the frames likewise above, and beneath the lions and the oxen were wreaths[b], a work of hanging relief.
translation:
  language: zh_hans
  text: 支架之间的镶板上有狮子、牛和基路伯的图案；支架上方也有同样的图案。狮子和牛的下方有花彩[a]，是下垂式的装饰工艺[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “花彩”所译的希伯来语很少见，也可指花环、垂花饰或类似装饰；其具体形状不能确定。
    reason: lexical_alternative
  - marker: b
    text: “下垂式的装饰工艺”所译的短语含义不明确，可能指向下悬垂的装饰，或以向下延伸形态制作的装饰工艺。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִּסְגְּרוֹת
  choice: 镶板
  rationale: 本节描述支架之间带有图案的嵌入部分；译作“镶板”既符合器物构造，也与 שְׁלַבִּים 所指的结构部件相区别。
- source_word: שְׁלַבִּים
  choice: 支架
  rationale: 该词指镶板之间或四周的结构部件；“支架”在现代汉语中自然，并保留其具体形制不完全确定的空间。
- source_word: אֲרָיוֹת
  choice: 狮子
  rationale: 装饰图案中的动物名称，直译即可。
- source_word: בָּקָר
  choice: 牛
  rationale: 这是集合名词，泛指牛类形象；“牛”不把原文过度限定为公牛。
- source_word: כְרוּבִים
  choice: 基路伯
  rationale: 采用现代中文圣经语境中通行的音译，指与神圣宝座相关的特殊天上活物。
- source_word: כֵּן
  choice: 座台
  rationale: 这里按名词理解，指支架上方的底座或台座；这种分析比把它读作副词“同样”更符合紧接其后的空间词 מִמָּעַל，但词义和句法仍有不确定性，故加脚注。
- source_word: מִמָּעַל
  choice: 上方
  rationale: 表示空间位置，与后文“下方”形成对照。
- source_word: מִתַּחַת
  choice: 下方
  rationale: 自然表达装饰位于狮子和牛图案之下。
- source_word: לֹיוֹת
  choice: 花彩
  rationale: 这是罕见的装饰术语，可能指花环、垂花饰或类似的 festoon；“花彩”能自然表示装饰性带状花饰，同时以脚注保留不确定性。
- source_word: מַעֲשֵׂה מוֹרָד
  choice: 垂挂式的雕饰
  rationale: 该疑难短语似乎描述向下悬垂或下垂形态的装饰工艺；此译法兼顾其制作性质和空间形态，不武断指定具体雕刻技术。
