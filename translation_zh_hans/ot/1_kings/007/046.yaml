base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/046.yaml
  text: In the plain of the Jordan the king cast them[c][b][a], in the clay ground between Sukkoth and Zarethan.
translation:
  language: zh_hans
  text: 王在约旦河平原[a]、疏割和撒拉但之间的密实土中[c]铸造了这些器物[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“约旦河谷”。希伯来文直指约旦河一带的区域或平原。
    reason: lexical_alternative
  - marker: b
    text: 或译“浇铸”。这里的动词指把熔化的金属倒入铸模，制成器物。
    reason: lexical_alternative
  - marker: c
    text: 直译“在土地的厚实处”，很可能指适合制作铸模的密实黏土。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּכִכַּר הַיַּרְדֵּן
  choice: 在约旦河平原
  rationale: 地理语境中的כִּכָּר指一片区域或平原；“约旦河平原”自然、明确，同时不像“约旦河谷”那样进一步解释地貌。
- source_word: יְצָקָם
  choice: 把这些器物铸造出来
  rationale: יצק可指倾倒，也常指浇铸金属；本段所述为铜制器物，因此“铸造”准确表达语境。阳性复数宾语后缀以“这些器物”承接上文，使现代汉语表达清楚。
- source_word: הַמֶּלֶךְ
  choice: 王
  rationale: 原文使用带定冠词的普通名词“王”，并未在本节直称所罗门；译文保留这一称谓，让上下文确定所指。
- source_word: בְּמַעֲבֵה הָאֲדָמָה
  choice: 在厚实泥土中
  rationale: מַעֲבֶה表示厚度或密实状态，与אֲדָמָה连用时很可能指适合制作铸模的密实泥土。“厚实泥土”既保留原文意象，也符合铸造语境。
- source_word: בֵּין סֻכּוֹת וּבֵין צָרְתָן
  choice: 在疏割和撒拉但之间
  rationale: 两者均为地名，采用现代中文圣经读者较熟悉的音译“疏割”和“撒拉但”，并保留原文“在……之间”的空间关系。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。为符合汉语信息次序，将地点和铸造环境置于谓语之前；“这些器物”明确承接上文所列铜器，但不增添原文没有的专名。脚注保留“平原/河谷”、“铸造/浇铸”及罕见短语בְּמַעֲבֵה הָאֲדָמָה的解释空间。
