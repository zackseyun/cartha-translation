  yaml_path: translation/ot/1_kings/007/033.yaml
  text: The workmanship of the wheels was like the workmanship of a chariot wheel[a]; their axles, their rims, their spokes[b], and their hubs were all cast metal.
translation:
  language: zh_hans
  text: 轮子的做法像战车轮子的做法；轮轴[a]、轮圈、轮辐[b]和轮毂，全都是铸成的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “轮轴”所译的希伯来词本义与“手、柄”有关；在这里也可能指把手、轴件或支撑件。
    reason: lexical_alternative
  - marker: b
    text: “轮辐”和“轮毂”所译的两个希伯来词都很罕见，确切的技术含义不能确定；也可能分别指箍带，以及支撑件或连接件。
    reason: lexical_alternative
lexical_decisions:
- source_word: מַעֲשֵׂה
  choice: 做法
  rationale: 这里指制作的方式和构造；“做法”既自然易懂，也保留前后重复的比较结构。
- source_word: הָאֹפַנִּים / אוֹפַן
  choice: 轮子
  rationale: 这是该词在器具构造语境中的常见含义；比较对象按希伯来文表达为战车的轮子。
- source_word: כְּמַעֲשֵׂה
  choice: 像……的做法
  rationale: 保留前缀כ所表达的比较关系，也忠实呈现原文重复מַעֲשֵׂה的句式。
- source_word: הַמֶּרְכָּבָה
  choice: 战车
  rationale: 该词在圣经希伯来语中通常指古代战车，符合历史场景。
- source_word: יְדוֹתָם
  choice: 轮轴
  rationale: 该词通常与“手、柄”有关，但在轮子零件清单中较可能指轴件或支承构件；正文采用较易理解的“轮轴”，并以脚注保留不确定性。
- source_word: גַבֵּיהֶם
  choice: 轮圈
  rationale: 字面与“背部、隆起处”有关；在轮子构造中最自然地指外围的轮圈。
- source_word: חִשֻּׁקֵיהֶם
  choice: 轮辐
  rationale: 这是罕见的技术用语；依轮子部件的上下文，正文采用连接轮毂与轮圈的“轮辐”，同时脚注说明也可能指箍带。
- source_word: חִשֻּׁרֵיהֶם
  choice: 轮毂
  rationale: 该罕见词位于轮子部件清单中，较可能指轮子的中央构件；脚注保留“支撑件、连接件”等可能。
- source_word: הַכֹּל
  choice: 全都
  rationale: 概括前面列出的全部部件，现代汉语表达自然。
- source_word: מוּצָק
  choice: 铸成的
  rationale: 源自动词יצק，表示以熔融金属浇铸；上下文已说明对象是金属器件，无须在正文额外补出“金属”。
