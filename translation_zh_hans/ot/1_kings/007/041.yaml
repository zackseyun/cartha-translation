base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/041.yaml
  text: the two pillars[a], and the two bowls of the capitals that were on the tops of the pillars, and the two latticeworks to cover the two bowls of the capitals that were on the tops of the pillars[c][b];
translation:
  language: zh_hans
  text: 两根柱子；柱子顶端两个柱头的两个碗状构件[a]；两件网状饰物[b]，用来覆盖柱子顶端两个柱头的两个碗状构件。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “碗状构件”或可译作“球状饰件”或“浑圆构件”；希伯来语所指为柱头上的圆形构件，其确切形状不能确定。
    reason: lexical_alternative
  - marker: b
    text: “网状饰物”或可译作“网格饰物”。
    reason: lexical_alternative
lexical_decisions:
- source_word: עַמֻּדִים
  choice: 柱子
  rationale: 指圣殿前两根大型独立柱；“柱子”是现代汉语中自然、清楚的建筑用语。
- source_word: גֻלֹּת
  choice: 球状饰件
  rationale: 该词指柱头上形状浑圆的构件，但确切造型不明；“球状饰件”既表达其圆形特征，也避免武断认定为碗形。
- source_word: כֹּתָרֹת
  choice: 柱头
  rationale: 在建筑语境中指柱子顶部的装饰构件；“柱头”是准确而通行的现代汉语术语。
- source_word: רֹאשׁ
  choice: 顶上
  rationale: 原义为“头”，用于建筑物时译为“顶上”自然准确。
- source_word: שְּׂבָכוֹת
  choice: 网状饰物
  rationale: 指网格般交织的装饰构件；该译法兼顾形态、装饰功能与普通读者的可理解性。
- source_word: לְכַסּוֹת
  choice: 用来遮盖
  rationale: 不定式表达用途或目的；“用来遮盖”在器物清单中自然清楚。
- source_word: שְׁנַיִם / שְׁתָּיִם / שְׁתֵּי
  choice: 两／两个／两片
  rationale: 保留原文反复出现的数目“二”，同时按现代汉语名词搭配选用适当量词。
- source_word: אֲשֶׁר עַל רֹאשׁ הָעַמּוּדִים
  choice: 柱顶上
  rationale: 以简洁自然的汉语保留关系从句所说明的位置，并在原文重复之处照样重复。
theological_decisions: []
