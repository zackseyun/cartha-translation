base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/011.yaml
  text: And above were costly stones[a], cut according to measure, and cedar.
translation:
  language: zh_hans
  text: 其上是贵重的石料，按尺寸凿制[a]，并有香柏木。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“按凿石的尺寸（或规格）”。
    reason: 原文כְּמִדּוֹת גָּזִית的关系紧缩；正文按建筑语境译为石料“按尺寸凿制”，脚注保留较贴近字面的替代理解。
lexical_decisions:
- source_word: וּמִלְמַעְלָה
  choice: 上面
  rationale: 该复合形式可表示“从上面”或“在上面”。在这段建筑描述中，它承接前文，指出上层所用的材料，译作“上面”自然清楚。
- source_word: אֲבָנִים יְקָרוֹת
  choice: 贵重的石头
  rationale: יְקָרוֹת在建筑材料语境中指价值高、质地上乘，并非宝石意义；“贵重的石头”既贴近原文，也符合现代汉语。
- source_word: כְּמִדּוֹת גָּזִית
  choice: 按尺寸凿成
  rationale: כְּמִדּוֹת直译为“按照尺寸”，גָּזִית指凿制、琢成的石料。正文用“按尺寸凿成”自然表达石料经加工达到规定尺寸的意思，同时以脚注保留原文结构的另一种理解。
- source_word: וָאָרֶז
  choice: 还有香柏木
  rationale: אֶרֶז指香柏或香柏木；建筑语境中译为“香柏木”明确自然。连接词在汉语中用“还有”表达上层材料包括石料与香柏木。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的建筑叙述用语。“上面用的是”补出希伯来语名词句隐含的关系，使中文通顺；不增添原文未明确说明的具体建筑部位。
