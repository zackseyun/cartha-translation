  text: וּ/מְיֻסָּ֕ד אֲבָנִ֥ים יְקָר֖וֹת אֲבָנִ֣ים גְּדֹל֑וֹת אַבְנֵי֙ עֶ֣שֶׂר אַמּ֔וֹת וְ/אַבְנֵ֖י שְׁמֹנֶ֥ה אַמּֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/010.yaml
  text: And the foundation was of costly stones[a], large stones, stones of ten cubits and stones of eight cubits.
translation:
  language: zh_hans
  text: 根基是用贵重的石头[a]筑成的，都是大石，有十肘的，也有八肘的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“珍贵的石头”。希伯来语强调这些石头价值高或品质优良；在建筑语境中，“贵重的石头”较不容易让人误以为是宝石。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמְיֻסָּד
  choice: 根基是……筑成的
  rationale: 该词是יסד的被动形式；结合前文建筑语境，以“根基是……筑成的”自然表达被动含义，并明确原文语境中隐含的建筑主体。
- source_word: אֲבָנִים יְקָרוֹת
  choice: 贵重的石头
  rationale: יְקָרוֹת强调价值高、造价昂贵或品质上乘；建筑语境中的“贵重的石头”既保留价值含义，又不至于让人误以为是宝石。
- source_word: אֲבָנִים גְּדֹלוֹת
  choice: 大石
  rationale: גְּדֹלוֹת在此指石块体积大；“大石”简洁自然，符合现代汉语建筑描述。
- source_word: אַבְנֵי עֶשֶׂר אַמּוֹת
  choice: 有十肘的
  rationale: 原文表示尺寸为十肘的石头，但没有说明所量的是长、宽还是高；汉语用“有十肘的”保留这一未明确之处。
- source_word: וְאַבְנֵי שְׁמֹנֶה אַמּוֹת
  choice: 也有八肘的
  rationale: 与前一短语平行，清楚表达另一类尺寸为八肘的石头，同时不补入原文未说明的测量方向。
- source_word: אַמּוֹת
  choice: 肘
  rationale: “肘”是古代长度单位אַמָּה的传统且简明译法，可保留源文本的计量体系，避免在正文中作不精确的现代换算。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的普通话。句式顺应汉语表达，以“都是大石，有……的，也有……的”呈现原文并列结构；不补明石头具体哪一方向长十肘或八肘，以保留原文的含混性。
