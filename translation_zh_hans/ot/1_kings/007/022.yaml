  text: And on the top of the pillars was lily-work[b][a], and the work of the pillars was finished.
translation:
  language: zh_hans
  text: 柱顶上有百合花形的工艺装饰[a]；柱子的制作完成了[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“百合花图案”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“柱子的工程完成了”。
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹאשׁ
  choice: 顶
  rationale: 在柱子的建筑语境中指上部；“柱顶”自然准确，又不把原文过度技术化为“柱头”。
- source_word: הָעַמּוּדִים
  choice: 柱子
  rationale: עַמּוּדִים 指建筑中的柱；“柱子”是现代汉语中清楚自然的表达。
- source_word: מַעֲשֵׂה שׁוֹשָׁן
  choice: 百合花形的装饰
  rationale: 该短语直指以百合花为形制或图案的工艺装饰；此译法比生硬的“百合花之作”更易懂，同时保留其装饰性质。
- source_word: שׁוֹשָׁן
  choice: 百合花
  rationale: 通常指百合花；在圣殿建筑描述中表示百合花形或百合花图案的装饰。
- source_word: וַתִּתֹּם
  choice: 就完成了
  rationale: תמם 表示完成、完毕；结合主语“工程”，译为“完成了”符合现代汉语。
- source_word: מְלֶאכֶת הָעַמּוּדִים
  choice: 柱子的工程
  rationale: מְלָאכָה 可指工作、制作或工程；这里概括柱子的制作与装饰工程，保留原文较宽泛的含义。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“柱顶”简洁对应建筑语境；“百合花形的装饰”明确表达原文简约短语所指的装饰工艺。分成两句，使叙述清楚流畅，同时保留两个分句的先后关系。
