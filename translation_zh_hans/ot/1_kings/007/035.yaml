base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/035.yaml
  text: And on the top of the stand there was a round rim all around[a], half a cubit high[b]; and on the top of the stand its supports and its panels were of one piece with it.
translation:
  language: zh_hans
  text: 座架的顶部周围有一道环绕的圆形边缘，高半肘；座架顶部的支撑件[a]和镶板[b]都与座架连成一体。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“把手”。希伯来语字面意思是“它的手”，可能指座架上突出的构件。
    reason: lexical_alternative
  - marker: b
    text: 或译“框架”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְרֹאשׁ הַמְּכוֹנָה
  choice: 座架顶部
  rationale: רֹאשׁ在器物构造中指“顶部”；מְכוֹנָה在本章指承托铜盆的带轮座架。
- source_word: חֲצִי הָאַמָּה קוֹמָה
  choice: 高半肘
  rationale: קוֹמָה说明垂直高度；保留古代长度单位“肘”，表达简洁自然。
- source_word: עָגֹל סָבִיב
  choice: 圆形边缘，环绕四周
  rationale: עָגֹל意为“圆的、圆形的”，סָבִיב表示“四周、周围”。原文没有明说这一构件的名词；“边缘”依据建筑语境作最低限度的补足，同时保留其环绕性。
- source_word: יְדֹתֶיהָ
  choice: 支撑件
  rationale: יָד本义为“手”，描述器物时可指把手、支架或其他突出的构件；此处按结构语境译为“支撑件”，并以脚注保留“把手”的可能。
- source_word: וּמִסְגְּרֹתֶיהָ
  choice: 镶板
  rationale: מִסְגֶּרֶת可指框架、边框或框内板面；结合本段座架的构造描写译为“镶板”，并在脚注注明“框架”这一可能。
- source_word: מִמֶּנָּה
  choice: 都与座架连成一体
  rationale: 字面为“从它而出”，在器物构造语境中表明这些构件出自座架本身，并非另行附加；不额外加入原文未明说的“铸造”。
theological_decisions: []
