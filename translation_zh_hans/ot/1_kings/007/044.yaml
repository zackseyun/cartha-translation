  text: and the one Sea[a], and the twelve oxen under the Sea;
translation:
  language: zh_hans
  text: 以及一个铜海[a]，和铜海下面的十二头牛；
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “铜海”也可译为“大水池”。希伯来文直译为“海”，在这里指圣殿中的大型铸造贮水器。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַיָּם
  choice: 铜海
  rationale: 原词意为“海”，在圣殿器具语境中专指大型铸铜贮水器。译作传统且易懂的“铜海”，既保留其专名性质，又借“铜”说明此处器物的材质与所指。
- source_word: הָאֶחָד
  choice: 那一座
  rationale: 定冠词与数词共同强调这件单一器物，并与上下文中的多件器具相区别；量词“座”适合大型固定器物。
- source_word: הַבָּקָר
  choice: 牛
  rationale: בָּקָר泛指牛类；这些是承托铜海的牛形像。译作“牛”可避免无根据地限定为公牛或阉牛。
- source_word: שְׁנֵים עָשָׂר
  choice: 十二头
  rationale: 忠实表达基数，并采用现代汉语中用于牛的量词“头”。
- source_word: תַּחַת
  choice: 下面
  rationale: 表示牛形像与铜海之间的实际空间位置；“下面”自然清楚，且不额外补入原文未明说的“支撑”。
- source_word: וְאֶת
  choice: 以及……和……
  rationale: 两个带连接词的宾语标记延续前文器具清单。汉语不单独翻译宾语标记，以“以及”和“和”保留并列、承接关系。
theological_decisions: []
