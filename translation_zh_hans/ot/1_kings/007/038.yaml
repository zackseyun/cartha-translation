  text: וַ/יַּ֛עַשׂ עֲשָׂרָ֥ה כִיֹּר֖וֹת נְחֹ֑שֶׁת אַרְבָּעִ֨ים בַּ֜ת יָכִ֣יל הַ/כִּיּ֣וֹר הָ/אֶחָ֗ד אַרְבַּ֤ע בָּֽ/אַמָּה֙ הַ/כִּיּ֣וֹר הָ/אֶחָ֔ד כִּיּ֤וֹר אֶחָד֙ עַל הַ/מְּכוֹנָ֣ה הָ/אַחַ֔ת לְ/עֶ֖שֶׂר הַ/מְּכֹנֽוֹת׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/038.yaml
  text: He made ten bronze basins[a]. Each basin held forty baths, and each basin was four cubits across[c][b]. One basin stood on each of the ten stands.
translation:
  language: zh_hans
  text: 他又造了十个铜盆[c]。每个盆可容四十巴特[a]，每个盆的大小是四肘[b]。十座盆架上各有一个盆。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “巴特”是古代希伯来的液量单位。
    reason: cultural_note
  - marker: b
    text: 原文这里只说“四肘”，没有明说所量的是哪一项尺寸；这里很可能指直径四肘。
    reason: lexical_alternative
  - marker: c
    text: “盆”也可译作“洗濯盆”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִיֹּרוֹת
  choice: 盆
  rationale: 指圣殿器具中盛水、洗濯用的大型容器；“盆”是现代汉语中清楚自然的称呼，不以正文额外限定用途。
- source_word: נְחֹשֶׁת
  choice: 铜
  rationale: 该词可指铜或铜合金；汉语“铜”既符合圣殿器具语境，也避免无充分依据地精确限定为纯铜或青铜。
- source_word: בַּת
  choice: 巴特
  rationale: 保留希伯来液量单位，避免用现代容量换算造成虚假的精确性，并以脚注说明。
- source_word: יָכִיל
  choice: 可容
  rationale: 表达器皿的容量，简洁自然，并准确反映动词“容纳、盛得下”的意思。
- source_word: אַרְבַּע בָּאַמָּה
  choice: 宽四肘
  rationale: 原文只给出“四肘”而未明说测量方向；正文用“宽”使汉语通顺，脚注保留原文未明确是直径的事实。
- source_word: מְכוֹנָה
  choice: 盆架
  rationale: 上下文所指是承托铜盆的架座；“盆架”清楚表达其功能，而不在本节额外强调其带轮结构。
- source_word: כִּיּוֹר אֶחָד עַל הַמְּכוֹנָה הָאַחַת לְעֶשֶׂר הַמְּכֹנוֹת
  choice: 十座盆架，每座上放一个盆
  rationale: 以自然汉语明确表达希伯来语的逐一分配关系：十个盆分别置于十座架上。
theological_decisions: []
