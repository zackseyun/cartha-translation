  source_fidelity: “宽四肘”将原文未明说的测量方向限定为“宽”，且对圆形盆类器物而言也不如“横径／直径”贴切。希伯来文仅给出每盆“四肘”，但上下文和器物语境很可能指直径；正文宜避免把此推断当作明说。其余内容准确反映了十个铜盆、每盆四十巴特、以及十座架各置一盆的分配关系。
  naturalness: “每个盆可容四十巴特”自然。“十座盆架，每座上放一个盆”可理解，但“十座盆架上各有一个盆”在现代汉语中更顺畅，也无需用“放”补入动作方式。为兼顾原文含蓄与汉语通顺，可将尺寸表达为“每个盆的大小是四肘”。
  terminology: “铜盆”可保留：נְחֹשֶׁת在此语境通常可理解为青铜，但汉语“铜”能保留原词对铜／铜合金的概括性。“巴特”及其说明恰当。“盆架”可表达מְכוֹנָה作为承托器具的功能；脚注“洗濯盆”为可接受的替代译法。
