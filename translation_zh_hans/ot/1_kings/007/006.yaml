  yaml_path: translation/ot/1_kings/007/006.yaml
  text: He made the Hall of Pillars fifty cubits long and thirty cubits wide[a], with a porch in front of them[b], and pillars and a threshold in front of them.
translation:
  language: zh_hans
  text: 他又建造柱廊，长五十肘，宽三十肘；在这些柱子前面有前廊[a]，其前面还有柱子和顶盖[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “柱廊”和“前廊”的原文用了同一个词；这里第二次出现时，可能指柱廊正面附设的门廊式结构。
    reason: lexical_alternative
  - marker: b
    text: 译作“顶盖”的希伯来词在此建筑语境中的含义不确定，也可理解为“门槛”、“横梁”或其他有遮盖作用的结构。
    reason: lexical_alternative
lexical_decisions:
- source_word: אוּלָם הָעַמּוּדִים
  choice: 柱廊
  rationale: 指以柱子为显著特征的大型厅廊；“柱廊”既简洁自然，也保留其建筑性质。
- source_word: עָשָׂה
  choice: 建造
  rationale: 该动词通常为“做、制造”，在建筑语境中译作“建造”更符合现代汉语。
- source_word: חֲמִשִּׁים אַמָּה אָרְכּוֹ וּשְׁלֹשִׁים אַמָּה רָחְבּוֹ
  choice: 长五十肘，宽三十肘
  rationale: 以自然的汉语尺寸表达准确保留原文的长度和宽度。
- source_word: וְאוּלָם עַל־פְּנֵיהֶם
  choice: 柱廊前面有一个前廊
  rationale: 同一词 אוּלָם 再次出现，此处指主体建筑前附设的廊式结构；译作“前廊”能说明其相对位置，并以脚注保留词义上的对应关系。
- source_word: וְעַמֻּדִים
  choice: 还有柱子
  rationale: 明确保留原文并列提到的柱子，不将其并入前廊而省略。
- source_word: וְעָב
  choice: 和顶盖
  rationale: 该建筑术语含义不确定；“顶盖”表达可能的遮盖性结构，同时用脚注列出其他主要理解。
- source_word: עַל־פְּנֵיהֶם
  choice: 前面
  rationale: 保留空间关系；汉语省去生硬且所指不明的复数代词，但不进一步断定具体所指。
