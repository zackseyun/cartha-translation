  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יַּ֣עַשׂ שְׁלֹמֹ֔ה אֵ֚ת כָּל הַ/כֵּלִ֔ים אֲשֶׁ֖ר בֵּ֣ית יְהוָ֑ה אֵ֚ת מִזְבַּ֣ח הַ/זָּהָ֔ב וְ/אֶת הַ/שֻּׁלְחָ֗ן אֲשֶׁ֥ר עָלָ֛י/ו לֶ֥חֶם הַ/פָּנִ֖ים זָהָֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/048.yaml
  text: 'And Solomon made all the vessels that were in the house of Yahweh: the golden altar[a], and the table on which was the bread of the Presence[b], of gold.'
translation:
  language: zh_hans
  text: 所罗门又制造了耶和华殿里的一切器具：金坛，以及摆放陈设饼[a]的金桌。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “陈设饼”直译为“面前的饼”或“临在之饼”，即陈设在神面前的饼。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: 制造了
  rationale: עשה含义宽泛，可指“做、制造”。本节列举圣殿器具，“制造”自然明确，又不过分强调具体工艺。
- source_word: כָּל הַכֵּלִים
  choice: 一切器具
  rationale: כֵּלִים可指器皿、用具或陈设；这里统指随后列出的圣殿物件，“器具”在现代汉语中涵盖面适当。
- source_word: בֵּית יְהוָה
  choice: 耶和华殿
  rationale: בֵּית直译为“房屋、殿”，在此指圣殿；将יהוה译作现代中文圣经中通行的专名“耶和华”，既保留这是神名，也使表达自然。
- source_word: מִזְבַּח הַזָּהָב
  choice: 金坛
  rationale: 希伯来语直为“金的坛”；“金坛”简洁、庄重，并保留材质说明。
- source_word: הַשֻּׁלְחָן אֲשֶׁר עָלָיו
  choice: 摆放……的桌
  rationale: 原文为“桌子，其上有……”。汉语用“摆放……的桌”自然呈现其位置关系。
- source_word: לֶחֶם הַפָּנִים
  choice: 陈设饼
  rationale: 该礼仪用语字面为“面前／临在之饼”，指陈设在神面前的饼；“陈设饼”是清楚而通行的中文名称，并以脚注保留字面意涵。
- source_word: זָהָב
  choice: 金桌
  rationale: 句末的זָהָב最自然地说明桌子的材质。汉语将其前置为“金桌”，避免误读为修饰陈设饼。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用四字神名，而不是“主”这一称号。正文采用现代中文读者熟悉的“耶和华”，保留其专名性质；“雅威”是按学界常见拟音所作的另一译法。
- issue: לֶחֶם הַפָּנִים的礼仪含义
  choice: 陈设饼
  alternative: 临在之饼／面前的饼
  rationale: 不把该词组扩释为某一特定神学理论；正文采用通行礼仪名称，脚注交代它表示放在神面前的饼。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“耶和华殿”比逐字的“耶和华的房屋”更符合圣殿语境；整体保留原文清单式结构，并将句末“金”自然处理为修饰桌子的“金桌”。
