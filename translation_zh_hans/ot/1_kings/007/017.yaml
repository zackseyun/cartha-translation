  text: 'There were lattices of latticework and twisted cords of chainwork for the capitals that were on the tops of the pillars: seven for the one capital[a], and seven for the second capital.'
translation:
  language: zh_hans
  text: 柱子顶端的柱头上有网格状的网饰和链状的编带：一个柱头上有七个[a]，另一个柱头上也有七个。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“网状的网饰和链条式的编带。”希伯来文使用成对的工艺词语，描述柱头上的装饰。
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂבָכִים מַעֲשֵׂה שְׂבָכָה
  choice: 网状的格子
  rationale: 原文以同根名词和工艺短语描述网格状装饰。“网状的格子”既保留重复形成的具体工艺意象，又符合现代汉语建筑描述。
- source_word: גְּדִלִים מַעֲשֵׂה שַׁרְשְׁרוֹת
  choice: 链状的编带
  rationale: גְּדִלִים 指捻合或编织成的带状物，后面的短语说明其工艺呈链条形。“链状的编带”保留两层信息而不把它具体化为花环。
- source_word: כֹּתָרֹת
  choice: 柱头
  rationale: 在建筑语境中指柱子顶端的装饰构件；“柱头”是现代汉语通行且准确的建筑术语。
- source_word: אֲשֶׁר עַל רֹאשׁ הָעַמּוּדִים
  choice: 柱顶的
  rationale: רֹאשׁ 字面为“头”，此处指柱子的顶部；压缩为“柱顶的”自然清楚，并保留空间关系。
- source_word: שִׁבְעָה לַכֹּתֶרֶת הָאֶחָת וְשִׁבְעָה לַכֹּתֶרֶת הַשֵּׁנִית
  choice: 一个柱头上有七个，另一个柱头上也有七个
  rationale: 逐一保留两个柱头各有七个装饰单元的分配意义；“也”自然表达相同数目。
