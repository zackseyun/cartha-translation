  text: וַ/יַּנַּ֤ח שְׁלֹמֹה֙ אֶת כָּל הַ/כֵּלִ֔ים מֵ/רֹ֖ב מְאֹ֣ד מְאֹ֑ד לֹ֥א נֶחְקַ֖ר מִשְׁקַ֥ל הַ/נְּחֹֽשֶׁת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/047.yaml
  text: And Solomon left all the vessels unweighed because they were exceedingly many[a]; the weight of the bronze was not determined.
translation:
  language: zh_hans
  text: 所罗门没有称量所有这些器具，因为数量实在太多了[a]；铜的重量没有查明。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“所罗门留下所有这些器具，因为数量实在太多了；铜的重量没有查明。”
    reason: 原文 וַיַּנַּח 可译为“留下、放下”，本身未明确说明“没有称量”；正文依下句重量未被查明的语境作出解释性表达。
lexical_decisions:
- source_word: וַיַּנַּח
  choice: 没有称量
  rationale: 该动词本身可指“放下、留下、不再处理”；结合下句“铜的重量无法查明”，正文用“没有称量”自然表达所罗门未继续进行的事项，同时由脚注保留较为直译的可能。
- source_word: כָּל הַכֵּלִים
  choice: 这一切器具
  rationale: כֵּלִים 是涵盖器物、用具的宽泛词；在圣殿陈设的语境中，“器具”准确、自然，也不把范围过度限定为容器。
- source_word: מֵרֹב מְאֹד מְאֹד
  choice: 因为数量实在太多了
  rationale: מִן 与 רֹב 在此表示原因，两个 מְאֹד 强烈加强程度；“实在太多”以现代汉语保留这种强调。
- source_word: לֹא נֶחְקַר
  choice: 无法查明
  rationale: חקר 的尼法勒式表示未被探明或查究清楚；“无法查明”保留“查究”的词义，并适合重量未获确定的语境。
- source_word: מִשְׁקַל
  choice: 重量
  rationale: 直接对应重量或按重量计算的量。
- source_word: הַנְּחֹשֶׁת
  choice: 铜
  rationale: נְחֹשֶׁת 可泛指铜或铜合金；中文圣经语域通常以“铜”自然涵盖古代铜质材料，避免断定具体合金成分。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“实在太多”体现原文重复 מְאֹד 的强烈强调；脚注保留首句动词与末句被动表达的真实歧义。
