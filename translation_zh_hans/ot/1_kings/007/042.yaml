base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/042.yaml
  text: and the four hundred pomegranates for the two latticeworks[a], two rows of pomegranates for each latticework[b], to cover the two bowl-shaped capitals that were on the tops of the pillars.
translation:
  language: zh_hans
  text: 以及两幅网状装饰[a]所用的四百个石榴；每幅网状装饰有两排石榴，用来遮盖柱子顶端那两个柱头的碗状部分[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“网格饰物”。原文指柱头上网格状的镂空装饰。
    reason: lexical_alternative
  - marker: b
    text: 直译“柱头的两个碗”。
    reason: lexical_alternative
lexical_decisions:
- source_word: רִמֹּנִים
  choice: 石榴
  rationale: 原词通常指石榴；本节语境表明这些是装饰造型，但正文保留具体名词，不额外补入“装饰性的”。
- source_word: שְׂבָכוֹת
  choice: 网状装饰
  rationale: 该词指柱头上的网格状镂空饰物。“网状装饰”既表达其形态，也说明这里所指的是建筑饰件。
- source_word: טוּרִים
  choice: 排
  rationale: 该词表示依次排列的行列；石榴饰件的布置用“两排”最自然清楚。
- source_word: לַשְּׂבָכָה הָאֶחָת
  choice: 每幅网状装饰
  rationale: 字面为“给那一幅网状装饰”，但在两幅饰物各有相同配置的语境中具有逐一分配的意思。
- source_word: לְכַסּוֹת
  choice: 用来遮盖
  rationale: 不定式表示目的；“遮盖”保留其覆盖、掩覆的基本含义。
- source_word: גֻּלֹּת הַכֹּתָרֹת
  choice: 柱头的碗状部分
  rationale: גֻּלֹּת 指圆形或碗形构件，כֹּתָרֹת 在建筑语境中指柱头。此译法保留形状意象，同时让现代读者明白它是柱头的一部分。
- source_word: עַל פְּנֵי הָעַמּוּדִים
  choice: 柱子顶端
  rationale: 字面近似“在柱子表面／上面”；建筑语境表明柱头位于柱子顶部，因此译作“柱子顶端”较清楚。
theological_decisions: []
