base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/002.yaml
  text: He built the House of the Forest of Lebanon[a], one hundred cubits long, fifty cubits wide, and thirty cubits high, on four rows of cedar pillars[c][b], with cedar beams on the pillars.
translation:
  language: zh_hans
  text: 他建造了“黎巴嫩林宫”：长一百肘，宽五十肘，高三十肘；这宫建在四排香柏木柱子上[a]，柱子上架着香柏木横梁[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “建在……上”也可理解为“配有四排香柏木柱子”；原文介词既可表示支承关系，也可能描述建筑的配置。
    reason: lexical_alternative
  - marker: b
    text: “横梁”原文直译为香柏木的“砍制件”，也可能指椽子或其他凿成的香柏木构件。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבֶן
  choice: 他建造了
  rationale: 叙事性的连续式动词在此推进叙事；现代汉语用简单过去语意自然表达，不必另译句首连接词。
- source_word: בֵּית יַעַר הַלְּבָנוֹן
  choice: “黎巴嫩林宫”
  rationale: 这是该建筑的名称。בֵּית本义为“房屋、殿宇”，结合王宫建筑群的语境译作“宫”；“黎巴嫩林”保留原文名称及其香柏木意象，而不把名称的由来写入正文。
- source_word: מֵאָה אַמָּה אָרְכּוֹ וַחֲמִשִּׁים אַמָּה רָחְבּוֹ וּשְׁלֹשִׁים אַמָּה קוֹמָתוֹ
  choice: 长一百肘，宽五十肘，高三十肘
  rationale: 以现代汉语常用的建筑尺寸表达对应原文三个平行的名词性量度短语，并保留古代长度单位“肘”。
- source_word: עַל אַרְבָּעָה טוּרֵי עַמּוּדֵי אֲרָזִים
  choice: 建在四排香柏木柱子上
  rationale: טוּרֵי指成列排列，עַמּוּדֵי指柱子；עַל首先保留“在……上”的空间和支承关系，同时用脚注保留其可能表示建筑配置的理解。
- source_word: וּכְרֻתוֹת אֲרָזִים עַל הָעַמּוּדִים
  choice: 柱子上架着香柏木横梁
  rationale: כְרֻתוֹת字面指砍下或凿成的木件；建筑语境中“横梁”最为清楚自然，但原词没有精确限定构件种类，因此在脚注中保留其他可能。
