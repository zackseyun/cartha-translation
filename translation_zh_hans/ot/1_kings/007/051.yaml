revisions:
- from: 所罗门王为雅威的殿所做的一切工程都完成了。所罗门把他父亲大卫分别为圣之物[a]，就是银、金和器具，都带进来，存放在雅威殿的库房里。
  to: 所罗门王为雅威的殿所做的一切工程都完成了。所罗门把他父亲大卫分别为圣的物品——银、金和器具——带入，放在雅威殿的库房里。
  rationale: 仅作不改变意义的语言修订：以“带入”替换带有说话者视角的“带进来”，并用破折号清楚标示银、金和器具对“分别为圣的物品”的说明。脚注锚点应置于“分别为圣的物品”之后。
