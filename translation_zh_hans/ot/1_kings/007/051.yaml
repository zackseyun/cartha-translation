base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/051.yaml
  text: So all the work that King Solomon did for the house of Yahweh was finished. And Solomon brought in the holy things of David his father—the silver[a], the gold, and the vessels—and put them in the treasuries of the house of Yahweh.
translation:
  language: zh_hans
  text: 所罗门王为雅威的殿所做的一切工程都完成了。所罗门把他父亲大卫分别为圣的物品——银、金和器具——带入，放在雅威殿的库房里。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתִּשְׁלַם
  choice: 都完成了
  rationale: 该动词表示达到完整、完工的状态；主语是“工程”，用“完成了”符合现代汉语表达。
- source_word: כָּל הַמְּלָאכָה
  choice: 一切工程
  rationale: מְלָאכָה在这里涵盖圣殿建造及相关制作的整体工作；“一切工程”既简洁又能体现项目整体。
- source_word: בֵּית יְהוָה
  choice: 雅威的殿／雅威殿
  rationale: בַּיִת字面为“房屋、殿”，此处明确指圣殿；译作“殿”自然庄重，并按所给翻译规范将יהוה音译为“雅威”。
- source_word: וַיָּבֵא
  choice: 带进来
  rationale: בוא的使役式表示使某物进入，即“带进来”；保留物品被带入圣殿范围的方向含义。
- source_word: קָדְשֵׁי דָּוִד אָבִיו
  choice: 他父亲大卫分别为圣之物
  rationale: קָדְשֵׁי指被分别出来归于神、因而成为圣的物品。“分别为圣之物”保留“圣”这一词义，也不把它缩窄为某一种奉献礼。
- source_word: הַכֶּסֶף וְאֶת הַזָּהָב וְאֶת הַכֵּלִים
  choice: 银、金和器具
  rationale: 依照希伯来语次序翻译；כֵּלִים是泛指各种器皿、用具的宽泛词，“器具”避免过度限定具体用途。
- source_word: נָתַן בְּאֹצְרוֹת
  choice: 存放在……库房里
  rationale: נתן基本义为“放置”，与复数אֹצְרוֹת“库房、储藏室”连用时，“存放在库房里”是自然且准确的汉语。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名יהוה；“雅威”较直接地呈现其专名性质，并与所给审校层采用Yahweh的决定一致。
- issue: קָדְשֵׁי所表达的圣别与奉献关系
  choice: 分别为圣之物
  alternative: 所奉献的物品
  rationale: 原词可指献出后归神为圣的物品。“分别为圣之物”保留其圣别含义，脚注则注明“奉献的物品”这一自然的语境译法，不武断消除两者之间的语义张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“雅威的殿”在首次出现时结构完整，后文用较凝练的“雅威殿”；“就是”清楚表明银、金和器具是前述圣物的具体说明。
