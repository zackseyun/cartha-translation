  text: Solomon built his own house for thirteen years[a], and he finished all his house.
translation:
  language: zh_hans
  text: 所罗门建造自己的宫室，用了十三年[a]，建成了整个宫室。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “宫室”也可译作“房屋”。这里的希伯来语词在王室语境中可指王宫或宫殿建筑群。
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּיתוֹ
  choice: 自己的宫室
  rationale: בַּיִת基本义为“房屋、家”，在君王建筑语境中可指王宫或宫殿建筑群。“宫室”自然体现王室住所的语境，又不像“宫殿”那样过度限定为单一建筑；“自己的”也传达句首与前文圣殿工程相对照的语篇作用。
- source_word: בָּנָה
  choice: 建造
  rationale: Qal完成式在此用于叙事，表达所罗门进行并完成建造工程；“建造”庄重而自然。
- source_word: שְׁלֹשׁ עֶשְׂרֵה שָׁנָה
  choice: 历时十三年
  rationale: 原文表示工程持续的时长；“历时十三年”符合现代汉语表达。
- source_word: וַיְכַל
  choice: 才……建成
  rationale: 该连续式动词推进叙事，表示工程最终完结。“才”自然突出十三年之后方告完成，但不额外暗示责难。
- source_word: כָּל בֵּיתוֹ
  choice: 整座宫室全部
  rationale: כָּל强调完整、全体；“整座……全部建成”保留其总括意味，并与前面的“宫室”保持词义连贯。
- source_word: וְאֶת
  choice: 以“自己的”及独立起句体现转题和对照
  rationale: וְ加宾格标记在这里转入与圣殿相关但形成对照的新主题；汉语不宜逐词译出，改由句式和“自己的”体现。
