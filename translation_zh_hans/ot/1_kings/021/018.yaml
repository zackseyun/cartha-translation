  text: ק֣וּם רֵ֗ד לִ/קְרַ֛את אַחְאָ֥ב מֶֽלֶךְ יִשְׂרָאֵ֖ל אֲשֶׁ֣ר בְּ/שֹׁמְר֑וֹן הִנֵּה֙ בְּ/כֶ֣רֶם נָב֔וֹת אֲשֶׁר יָ֥רַד שָׁ֖ם לְ/רִשְׁתּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/018.yaml
  text: Arise[a], go down to meet Ahab king of Israel, who is in Samaria. Look, he is in the vineyard of Naboth, where he has gone down to take possession of it.
translation:
  language: zh_hans
  text: “起来，下去见以色列王亚哈；他在撒马利亚。看哪，他在拿伯的葡萄园里，已经下到那里，要取得那园为业[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“要占有它”。这里的希伯来语动词可按语境表示取得、占有或承受产业。
    reason: lexical_alternative
lexical_decisions:
- source_word: ק֣וּם
  choice: 起来
  rationale: 祈使式，表示起身行动；“起来”自然、简洁，也保留先知命令的有力语气。
- source_word: רֵד
  choice: 下去
  rationale: 保留 ירד 的方向含义，并符合现代汉语表达。
- source_word: לִקְרַאת
  choice: 迎见
  rationale: 表示前去与某人相遇；“迎见”保留行动方向和庄重语体，又不预先解释为“质问”或“对抗”。
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: 以色列王
  rationale: 直接表达希伯来语的属格结构和王室称号。
- source_word: אֲשֶׁר בְּשֹׁמְרוֹן
  choice: 就是住在撒马利亚的那位
  rationale: 希伯来语为无系词关系从句；结合叙事语境，表达亚哈与撒马利亚的常住关系，避免与下句所说他当时正在葡萄园里形成不必要的地点冲突。
- source_word: הִנֵּה
  choice: 看哪
  rationale: 这是引人注意的指示语。“看哪”保留原文的突显和即时感，同时符合庄重的经文语体。
- source_word: בְּכֶרֶם נָבוֹת
  choice: 正在拿伯的葡萄园里
  rationale: בְּ 表示所在位置；加入“正在”自然承接 הִנֵּה 所强调的当前情形。
- source_word: אֲשֶׁר יָרַד שָׁם
  choice: 他已经下到那里
  rationale: 完成式描述此前已发生、并导致当前所在位置的行动；“已经”明确这种前后关系。
- source_word: לְרִשְׁתּוֹ
  choice: 要占有那园
  rationale: ירשׁ 在此表示取得并据有产业。“占有”既传达实际取得所有权或控制权的含义，也不额外加入该动词本身未明说的暴力色彩。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“迎见”比口语化的“去见”更能体现奉命前往相遇的语气，却不把会面目的过度解释为对抗。脚注标记置于其实际说明的“占有那园”之后。
