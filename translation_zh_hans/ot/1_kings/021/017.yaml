  text: וַ/יְהִי֙ דְּבַר יְהוָ֔ה אֶל אֵלִיָּ֥הוּ הַ/תִּשְׁבִּ֖י לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/017.yaml
  text: Then the word of Yahweh came to Elijah the Tishbite[a], saying,
translation:
  language: zh_hans
  text: 随后[a]，雅威的话临到提斯比人以利亚，说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“事情发生了：雅威的话临到提斯比人以利亚，说。”
    reason: 原文 וַיְהִי 可较直译为“事情发生了”，也可按希伯来叙事中的承接功能自然译为“随后”。
lexical_decisions:
- source_word: וַיְהִי
  choice: 随后
  rationale: 该叙事形式承接前文并引出下一件事；“随后”自然表达事件的推进，同时避免把希伯来语惯用结构机械译成“事情发生了”。
- source_word: דְּבַר יְהוָה
  choice: 雅威的话
  rationale: 这是先知叙事中的固定启示公式；“话”比“信息”更贴近原文，也保留其神学分量。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见音译呈现四字神名，保留其作为以色列之神专名的性质，而不以称号替代。
- source_word: אֶל
  choice: 临到
  rationale: 与“……的话”搭配时，“临到”是自然、庄重且符合先知启示语境的汉语表达；方向关系由该动词结构体现。
- source_word: אֵלִיָּהוּ
  choice: 以利亚
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: הַתִּשְׁבִּי
  choice: 提斯比人
  rationale: 简洁保留原文的地域身份称谓，不扩展为原文未明说的解释。
- source_word: לֵאמֹר
  choice: 说
  rationale: 直接引出下一节神谕的内容，并以冒号符合现代汉语书面表达。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。译作“雅威”可将其呈现为专名，而不是用“主”这一称号替代；“耶和华”虽为中文传统形式，但较不贴近学界通常重构的读音。
- issue: דְּבַר יְהוָה 的性质
  choice: 雅威的话
  alternative: 雅威的信息
  rationale: 选择较形式对应的“话”，不把启示公式解释性地缩减为一般“信息”，从而保留其在先知传统中的神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“临到……说”保留先知启示公式的传统语感；正文用“随后”自然衔接前文，脚注保留较形式化的另一译法。
