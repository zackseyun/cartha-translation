  text: וַֽ/יְהִי֙ כִּ/שְׁמֹ֣עַ אִיזֶ֔בֶל כִּֽי סֻקַּ֥ל נָב֖וֹת וַ/יָּמֹ֑ת וַ/תֹּ֨אמֶר אִיזֶ֜בֶל אֶל אַחְאָ֗ב ק֣וּם רֵ֞שׁ אֶת כֶּ֣רֶם נָב֣וֹת הַ/יִּזְרְעֵאלִ֗י אֲשֶׁ֤ר מֵאֵן֙ לָ/תֶת לְ/ךָ֣ בְ/כֶ֔סֶף כִּ֣י אֵ֥ין נָב֛וֹת חַ֖י כִּי מֵֽת־־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/015.yaml
  text: When Jezebel heard that Naboth had been stoned and had died[a], Jezebel said to Ahab, “Get up, take possession of the vineyard of Naboth the Jezreelite, which he refused to give you for silver, because Naboth is not alive; he is dead.”
translation:
  language: zh_hans
  text: 耶洗别听见拿伯已经被人用石头打死，就对亚哈说：“起来，占有耶斯列人拿伯的葡萄园，就是他不肯为了银子给你的那个葡萄园[a]；因为拿伯不再活着，他已经死了。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“就是他不肯卖给你的那个葡萄园。”希伯来文直译为：“就是他不肯为了银子给你的那个葡萄园。”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּשְׁמֹעַ
  choice: 耶洗别听见……就
  rationale: 希伯来叙事句式在此引出随后的行动；用“听见……就”自然表达时间关系和事件推进，不生硬直译“事情发生在……的时候”。
- source_word: סֻקַּל וַיָּמֹת
  choice: 已经被人用石头打死
  rationale: סקל的被动式明确指用石头击打，随后“死了”表明结果。合译为“被人用石头打死”既保留被动受害和具体处决方式，也符合现代汉语；“已经”表明此事先于耶洗别说话。
- source_word: קוּם
  choice: 起来
  rationale: 直接保留命令的紧迫感，也是现代汉语中自然、庄重的表达。
- source_word: רֵשׁ
  choice: 占有
  rationale: ירש在此可指取得并占有产业；“占有”不预先断定这是合法继承，也保留叙事中强占产业的张力。
- source_word: כֶּרֶם
  choice: 葡萄园
  rationale: 这是该农业地产在本语境中的标准对应词。
- source_word: הַיִּזְרְעֵאלִי
  choice: 耶斯列人
  rationale: 该族称形容词说明拿伯来自或居于耶斯列；“耶斯列人”是简洁自然的汉语表达。
- source_word: אֲשֶׁר מֵאֵן לָתֶת לְךָ בְכֶסֶף
  choice: 就是他不肯收你的银子给你的那个葡萄园
  rationale: 尽量保留原文“不给你、换取银子”的措辞，而没有在正文中直接解释为“卖”；关系从句补出“那个葡萄园”，使较长修饰语在汉语中清楚。
- source_word: בְכֶסֶף
  choice: 银子
  rationale: כֶּסֶף字面为“银子”，又可转指钱财。正文保留原文质感；脚注说明交易语境中的自然理解。
- source_word: אֵין נָבוֹת חַי כִּי מֵת
  choice: 拿伯已经不在人世，他死了
  rationale: 保留原文先否定“活着”、再明确“死了”的双重陈述及其冷峻语气；“不在人世”比“不活着”更符合自然现代汉语。
theological_decisions:
- issue: רֵשׁ是否译作具有继承意味的“承受”
  choice: 占有
  alternative: 承受／继承
  rationale: 本节没有明确说明亚哈取得葡萄园的法律机制。译作“占有”保留动词可指取得产业的范围，也避免把行为解释为合法继承。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“用石头打死”明确处决方式；“占有”保留原文语义张力；“银子”保留希伯来文色彩，并以脚注交代“卖给你”的语境性译法。
