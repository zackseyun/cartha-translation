base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/027.yaml
  text: And it happened[a], when Ahab heard these words, that he tore his clothes and put sackcloth on his flesh and fasted and lay in sackcloth and went about softly.
translation:
  language: zh_hans
  text: 亚哈听见这些话，就撕裂衣服，把麻布贴身穿上，禁食，身穿麻布躺卧，并且缓步而行[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “缓步而行”也可译作“安静地走动”或“神情低沉地走动”。希伯来语所描写的是一种收敛、降卑的行动姿态。
    reason: 词义存在合理的多种表达；אַט 可侧重缓慢、安静或低沉克制。
lexical_decisions:
- source_word: וַיְהִי כִשְׁמֹעַ
  choice: 亚哈听见……就
  rationale: 希伯来语叙事公式 וַיְהִי 与时间结构 כִשְׁמֹעַ 在现代汉语中自然表达为“听见……就”，既交代事件推进，也避免生硬直译“事情发生了”。
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: 这些话
  rationale: 此处指以利亚刚刚宣告的审判之言；“这些话”保留 דָּבָר 的言语含义，也符合上下文。
- source_word: וַיִּקְרַע בְּגָדָיו
  choice: 撕裂衣服
  rationale: 准确表达古代哀恸、降卑时撕裂衣服的举动，语言自然明确。
- source_word: וַיָּשֶׂם שַׂק עַל בְּשָׂרוֹ
  choice: 把麻布贴身穿上
  rationale: שַׂק 指哀悼所穿的粗麻布，עַל בְּשָׂרוֹ 表明直接贴着身体；“贴身穿上”保留这一具体形象，又比“放在肉体上”自然。
- source_word: וַיָּצֹם
  choice: 禁食
  rationale: 直接对应 צום，并符合现代汉语圣经语境中的常用表达。
- source_word: וַיִּשְׁכַּב בַּשָּׂק
  choice: 身穿麻布躺卧
  rationale: 保留 שׁכב 的“躺卧”含义，不擅自具体化为“睡觉”；同时表达他躺卧时仍穿着麻布。
- source_word: וַיְהַלֵּךְ אַט
  choice: 缓步而行
  rationale: אַט 可表示缓慢、安静或低沉克制的行动。“缓步而行”保留动作方式及降卑氛围，却不把内心状态解释得过满。
theological_decisions:
- issue: 亚哈回应的性质
  choice: 只叙述他哀恸、降卑的外在行动，不明确判定其悔改是否真诚。
  alternative: 译成“他真心悔改”或暗示这只是虚假的外在表演。
  rationale: 本节希伯来文只报告撕衣、穿麻布、禁食、躺卧和缓步行走等行为，并未直接评断其内心；译文因此保留经文本身的神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。以短句连续呈现原文一连串动作；保留“麻布”这一古代哀悼意象，并用“贴身”说明其与身体直接接触。
