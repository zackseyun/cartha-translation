  text: וַ/יֹּ֤אמֶר אַחְאָב֙ אֶל אֵ֣לִיָּ֔הוּ הַֽ/מְצָאתַ֖/נִי אֹיְבִ֑/י וַ/יֹּ֣אמֶר מָצָ֔אתִי יַ֚עַן הִתְמַכֶּרְ/ךָ֔ לַ/עֲשׂ֥וֹת הָ/רַ֖ע בְּ/עֵינֵ֥י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/020.yaml
  text: Ahab said to Elijah[a], “Have you found me, O my enemy?” And he said, “I have found you, because you have sold yourself to do what is evil in the eyes of Yahweh.”
translation:
  language: zh_hans
  text: 亚哈对以利亚说：“我的仇敌啊，你找到我了吗？”以利亚说：“我找到你了，因为你卖身去行雅威[a]眼中看为恶的事。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文为“YHWH”（יהוה）；中文传统常译作“耶和华”，也有译作“雅威”或以“主”代称。
    reason: 说明神名的原文形式及主要译法。
lexical_decisions:
- source_word: הַמְצָאתַנִי / מָצָאתִי
  choice: 你找到我了吗 / 我找到你了
  rationale: 两处均来自מצא，采用相同的“找到”，保留问答中的用词呼应和对峙语气。
- source_word: אֹיְבִי
  choice: 我的仇敌啊
  rationale: 名词带第一人称单数后缀，直译为“我的仇敌”；句末“啊”自然表达呼格语气。
- source_word: יַעַן
  choice: 因为
  rationale: 清楚表达后句给出的原因，符合现代汉语。
- source_word: הִתְמַכֶּרְךָ
  choice: 你卖身
  rationale: 该词为מכר的反身形式，保留“把自己卖掉、使自己受制于恶”的强烈比喻，而不弱化为单纯“投身”。
- source_word: לַעֲשׂוֹת הָרַע
  choice: 去做……看为恶的事
  rationale: 用自然汉语表达“行恶”，同时与后面的神圣评判结构顺畅衔接。
- source_word: בְּעֵינֵי יְהוָה
  choice: 雅威眼中看为恶
  rationale: 保留希伯来语“在……眼中”的评判意象，又符合现代汉语表达。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以常见音译呈现四字神名，而非用称号替代；脚注说明传统译法。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名，正文采用“雅威”以保留其专名性质；脚注列明希伯来字母及传统中文译法，不把某一称号或另一种音译绝对化。
- issue: “卖身”的比喻力度
  choice: 保留“卖身”
  alternative: 任凭自己；投身
  rationale: 原文反身动词含自我出卖、受制于恶的尖锐意象；保留该张力，不将责任和奴役意味淡化。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。以“我的仇敌啊”体现呼格，以重复“找到”保留原文对话中的语言呼应；“卖身”刻意保留原文强烈的反身比喻。
