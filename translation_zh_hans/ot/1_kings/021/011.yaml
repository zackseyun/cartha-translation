revisions:
- from: 于是，他城里的人，就是住在他城里的长老和贵族，照耶洗别传给他们的吩咐[a]，也就是照她寄给他们的信上所写的，做了。
  to: 于是，他城里的人，就是住在他城里的长老和贵族，照耶洗别传给他们的话去做，正如她寄给他们的信上所写的。[a]
  rationale: 将主要动作改为“照……去做”，使现代汉语自然；以“正如”承接书信内容，保留原文对耶洗别所送信息及所寄书信的重复说明。“话”是为补足汉语宾语所作的最小表达，不把其内容限定为特定类型的命令。脚注锚点移至“贵族”之后。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T05:50:58Z'
review_pass:
  verdict: revise
  source_fidelity: 译文准确辨识了城中的男性领袖、长老、显贵人士，以及耶洗别所寄书信中的指示。原文第一处“差遣/送给”未明说所送之物；译作“传给他们的话”仅作汉语所需的最小补足，并由随后的“信上所写的”明确其内容。
  naturalness: 原句“照……吩咐，也就是照……信上所写的，做了”有双重“照”并列且将“做了”孤置句末，现代汉语不够顺畅；“也就是”也将原文平行的重复表述处理得过于解释性。调整后保留原文的重复指涉，语序自然。
  terminology: “长老”适合此处城邑领袖语境；“贵族”可用，脚注以“显贵”提示其未必专指世袭贵族，恰当。耶洗别的译名通行。
  issues:
  - severity: medium
    issue: 句法不自然，并以“也就是”过度解释两个平行短语。
    rationale: 希伯来文先说他们照耶洗别所送的信息而行，继而说明这是按她寄给他们的信所写的。译文应保留这种说明关系，但不宜形成“照……，也就是照……，做了”的生硬结构。
  revised_text: 于是，他城里的人，就是住在他城里的长老和贵族，照耶洗别传给他们的话去做，正如她寄给他们的信上所写的。[a]
  revised_footnotes:
