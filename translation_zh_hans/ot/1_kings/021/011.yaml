base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/011.yaml
  text: So the men of his city—the elders and the nobles who lived in his city—did as Jezebel had sent to them[a], as it was written in the letters that she had sent to them.
translation:
  language: zh_hans
  text: 于是，他城里的人，就是住在他城里的长老和贵族，照耶洗别传给他们的话去做，正如她寄给他们的信上所写的。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “贵族”也可译作“显贵”。原文这个词可指社会地位显要的人或身居高位的官员。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ
  choice: 做了
  rationale: עָשָׂה在这里表示照指示行事；句末译作“做了”，既保留叙事的直接性，也使中文句法自然。
- source_word: אַנְשֵׁי עִירוֹ
  choice: 他城里的人
  rationale: 原文直译为“他城里的人”。下文同位语明确指长老和贵族，因此无需另加“居民”或“百姓”。
- source_word: הַזְּקֵנִים
  choice: 长老
  rationale: 在城邑治理的语境中，该词指受承认的地方领袖，而不只是年长者；“长老”是准确且通行的译法。
- source_word: הַחֹרִים
  choice: 贵族
  rationale: 该词在此指社会地位显要或身份尊贵的人；“贵族”简明地保留其阶层含义，其他可能含义见脚注。
- source_word: הַיֹּשְׁבִים בְּעִירוֹ
  choice: 住在他城里的
  rationale: יָשַׁב在此表示居住；译文按现代汉语表达为“住在……里的”。
- source_word: כַּאֲשֶׁר שָׁלְחָה אֲלֵיהֶם אִיזָבֶל
  choice: 照耶洗别传给他们的吩咐
  rationale: 原文没有明说所传之物，但上下文及后半句表明是信中的指示。补出“吩咐”可使汉语完整，又不改变其所指。
- source_word: כָּתוּב בַּסְּפָרִים
  choice: 照……信上所写的
  rationale: סְפָרִים在本段指耶洗别寄出的书信，而非一般书卷；“信”符合上下文。
- source_word: אֲשֶׁר שָׁלְחָה אֲלֵיהֶם
  choice: 她寄给他们的
  rationale: 关系从句修饰书信；中文用“她寄给他们的信”自然地表达这一关系。
