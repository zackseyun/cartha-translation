  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/נָתַתִּ֣י אֶת בֵּיתְ/ךָ֗ כְּ/בֵית֙ יָרָבְעָ֣ם בֶּן נְבָ֔ט וּ/כְ/בֵ֖ית בַּעְשָׁ֣א בֶן אֲחִיָּ֑ה אֶל הַ/כַּ֨עַס֙ אֲשֶׁ֣ר הִכְעַ֔סְתָּ וַֽ/תַּחֲטִ֖א אֶת יִשְׂרָאֵֽל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/022.yaml
  text: And I will make your house like the house of Jeroboam son of Nebat and like the house of Baasha son of Ahijah[a], because of the provocation with which you have provoked me and caused Israel to sin.
translation:
  language: zh_hans
  text: 我必使你的家[a]像尼八的儿子耶罗波安的家，也像亚希雅的儿子巴沙的家，因为你惹我发怒，又使以色列犯罪。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里的“家”指亚哈的王室家族，也就是他的王朝。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי
  choice: 我必使
  rationale: נתן本义为“给、置于”，但此处与比较结构连用，表达使亚哈家落得与先前被剪除的王朝同样的结局；译为“使”符合现代汉语，也保留结果义。
- source_word: בֵּיתְךָ
  choice: 你的家
  rationale: בַּיִת在王室审判语境中指家族或王朝。“家”保留希伯来语的核心意象，而脚注说明这里特指王室世系。
- source_word: כְּבֵית ... וּכְבֵית
  choice: 像……的家，也像……的家
  rationale: 前缀כְ表示比较；采用对称结构，准确体现原文两次比较。
- source_word: יָרָבְעָם בֶּן נְבָט
  choice: 尼八的儿子耶罗波安
  rationale: 按现代中文圣经人名惯例音译，并明确保留希伯来语父子称谓。
- source_word: בַּעְשָׁא בֶן אֲחִיָּה
  choice: 亚希雅的儿子巴沙
  rationale: 按现代中文圣经人名惯例音译，并明确保留希伯来语父子称谓。
- source_word: אֶל הַכַּעַס אֲשֶׁר הִכְעַסְתָּ
  choice: 因为你惹我发怒
  rationale: כעס的名词与使役动词在此构成因果性的同根表达。中文若机械重复会生硬；“因为你惹我发怒”自然表达审判缘由，并准确呈现使上帝发怒之意。
- source_word: וַתַּחֲטִא אֶת יִשְׂרָאֵל
  choice: 又使以色列犯罪
  rationale: חטא的使役式表示使他人犯罪；“使以色列犯罪”正式、清楚，并保留直接的因果力度。
theological_decisions:
- issue: “惹怒”之对象在原文中没有明说
  choice: 在中文中补出“我”
  alternative: 译作“因为你所引起的愤怒”而不明说对象
  rationale: 说话者是耶和华，上下文清楚表明被惹怒的是他。中文“惹我发怒”自然明确，没有引入上下文之外的新主张。
- issue: 王室审判语境中בֵּית的含义
  choice: 正文保留“家”，脚注解释为王室家族或王朝
  alternative: 正文直接译作“王朝”或“家族”
  rationale: “家”保留原文意象及三次重复，同时脚注防止读者误解为住宅。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“我必使”保留神谕的确定语气；两组“像……的家”维持原文平行结构。正文中的脚注标记[a]与脚注完全对应。
