  text: הֲֽ/רָאִ֔יתָ כִּֽי נִכְנַ֥ע אַחְאָ֖ב מִ/לְּ/פָנָ֑/י יַ֜עַן כִּֽי נִכְנַ֣ע מִ/פָּנַ֗/י לֹֽא אבי הָֽ/רָעָה֙ בְּ/יָמָ֔י/ו בִּ/ימֵ֣י בְנ֔/וֹ אָבִ֥יא הָ/רָעָ֖ה עַל בֵּיתֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/029.yaml
  text: Have you seen that Ahab has humbled himself before me? Because he has humbled himself before me[a], I will not bring the disaster in his days[b]; in his son's days I will bring the disaster on his house.
translation:
  language: zh_hans
  text: “你看见亚哈在我面前谦卑下来了吗？因为他在我面前谦卑下来，我就不在他的日子降下这灾祸；在他儿子的日子，我必把这灾祸降在他的家[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “家”也可指他的家族或王朝。
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲרָאִיתָ
  choice: 你看见……了吗
  rationale: 这是 ראה 的 Qal 完成式第二人称阳性单数，并带疑问词；用现代汉语的“看见……了吗”表达已经发生而与当前有关的观察。
- source_word: נִכְנַע
  choice: 自卑
  rationale: כנע 的 Niphal 在此指人在上帝面前降卑、屈服；“自卑”保留其反身意味，也不把经文未明说的“悔改”直接加入译文。
- source_word: מִלְּפָנַי / מִפָּנַי
  choice: 在我面前
  rationale: 希伯来语字面涉及“从我面前”，在此是表示人在上帝面前的姿态；“在我面前”自然且贴近惯用含义。
- source_word: יַעַן כִּי
  choice: 因为
  rationale: 该连词引出延后审判的原因；“因为”清楚自然。
- source_word: לֹא אָבִיא
  choice: 我就不……降下
  rationale: בוא 的 Hiphil 表示使某事临到；以“降下”搭配“灾祸”，符合现代汉语表达，并保留上帝主动施行审判的含义。
- source_word: הָרָעָה
  choice: 这灾祸
  rationale: רָעָה 在此审判语境中指惩罚性的灾难，并非道德上的邪恶；指示词“这”承接前文所宣告的灾祸。
- source_word: בְּיָמָיו
  choice: 在他活着的日子
  rationale: 保留“在他的日子”这一时间表达，同时以“活着”明确它指亚哈在世期间。
- source_word: בִּימֵי בְנוֹ
  choice: 到他儿子在世的日子
  rationale: 与前句形成时间上的对照，并以自然汉语表达“在他儿子的日子”。
- source_word: עַל בֵּיתוֹ
  choice: 降在他的家
  rationale: בַּיִת 在王室语境中可指家庭、家族或王朝；正文保留较具体且含义开放的“家”，不擅自限定为某一种。
theological_decisions:
- issue: 亚哈回应的性质
  choice: 译作“自卑”，不直接称为“悔改”
  alternative: 悔改；降服
  rationale: 经文明确说亚哈在上帝面前降卑，并因此使审判延后，却没有使用更明确的悔改用语；译文保留这一神学张力。
- issue: 上帝所降 הָרָעָה 的性质
  choice: 译作“灾祸”
  alternative: 祸患；邪恶
  rationale: 此处指上帝施行审判所带来的灾难，不是说上帝行道德上的邪恶。
- issue: 审判延后的范围
  choice: 表明灾祸不在亚哈在世时临到，而在其儿子在世时临到他的家
  alternative: 将其解释为审判完全撤销
  rationale: 原文只宣告延后，并未说撤销；译文保持这一时间对照。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。“自卑”沿用清楚可懂的圣经语体；“在他活着的日子／到他儿子在世的日子”兼顾希伯来语的平行结构与现代汉语可读性。正文中的脚注标记与脚注内容对应。
