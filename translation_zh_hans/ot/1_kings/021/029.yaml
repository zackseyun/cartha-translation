revisions:
- from: “你看见亚哈在我面前自卑了吗？因为他在我面前自卑，我就不在他活着的日子降下这灾祸；到他儿子在世的日子，我必把这灾祸降在他的家[a]。”
  to: “你看见亚哈在我面前谦卑下来了吗？因为他在我面前谦卑下来，我就不在他的日子降下这灾祸；在他儿子的日子，我必把这灾祸降在他的家[a]。”
  rationale: 修订仅改善关键动词的现代汉语准确性和两句时间短语的平行性。“谦卑下来”表达亚哈在神面前自我降卑／顺服，而不加入原文未明言的“悔改”；“在他的日子／在他儿子的日子”紧贴原文并保留审判延后而非撤销的对照。
