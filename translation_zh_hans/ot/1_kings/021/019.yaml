source:
  edition: WLC
  text: וְ/דִבַּרְתָּ֨ אֵלָ֜י/ו לֵ/אמֹ֗ר כֹּ֚ה אָמַ֣ר יְהוָ֔ה הֲ/רָצַ֖חְתָּ וְ/גַם יָרָ֑שְׁתָּ וְ/דִבַּרְתָּ֨ אֵלָ֜י/ו לֵ/אמֹ֗ר כֹּ֚ה אָמַ֣ר יְהוָ֔ה בִּ/מְק֗וֹם אֲשֶׁ֨ר לָקְק֤וּ הַ/כְּלָבִים֙ אֶת דַּ֣ם נָב֔וֹת יָלֹ֧קּוּ הַ/כְּלָבִ֛ים אֶת דָּמְ/ךָ֖ גַּם אָֽתָּה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/019.yaml
  text: 'And you shall speak to him[a], saying, ‘Thus says Yahweh: Have you murdered and also taken possession?’ And you shall speak to him, saying, ‘Thus says Yahweh: In the place where the dogs licked the blood of Naboth[b], the dogs shall lick your blood—you also.’'
translation:
  language: zh_hans
  text: 你要对他说[a]：“耶和华如此说：你杀了人，又占了产业吗？”你要对他说：“耶和华如此说：在狗舔拿伯的血的地方，狗也必舔你的血——你本人也必遭此下场。”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “杀了人”也可译作“谋杀了人”。这里的希伯来语动词通常指非法夺取人的性命。
    reason: lexical_alternative
  - marker: b
    text: 原文末尾直译为“你也”，特别强调亚哈本人也必遭遇与拿伯相同的下场。
    reason: rhetorical_emphasis
lexical_decisions:
- source_word: וְדִבַּרְתָּ אֵלָיו לֵאמֹר
  choice: 你要对他说
  rationale: 这是常见的受命传话句式。中文用“你要对他说”自然明确；原文的重复在两处均予保留，以呈现先知宣告的正式结构。
- source_word: כֹּה אָמַר יְהוָה
  choice: 耶和华如此说
  rationale: 保留先知传信公式，并将神名 יהוה 译作现代中文圣经读者熟悉的“耶和华”。
- source_word: הֲרָצַחְתָּ
  choice: 你杀了人
  rationale: רצח 指非法夺取人命，语境中具有谋杀的道德和法律分量；“杀了人”在现代汉语中既自然又能表达控罪语气，脚注补明也可直译为“谋杀”。
- source_word: וְגַם יָרָשְׁתָּ
  choice: 还要霸占产业吗
  rationale: ירש 可指承受、占有或取得产业。此处亚哈在拿伯被杀后取得葡萄园，“霸占产业”传达其不义占有，同时不把所占之物局限为本节未明说的“葡萄园”。
- source_word: בִּמְקוֹם אֲשֶׁר
  choice: 在哪里……也必在哪里
  rationale: 以对应式中文表达具体地点，并保留同一地点施行报应的修辞关联。
- source_word: לָקְקוּ ... יָלֹקּוּ
  choice: 舔……也必……舔
  rationale: 过去时与将来时重复同一动词，中文也重复“舔”，保留原文鲜明而可怖的对应。
- source_word: הַכְּלָבִים
  choice: 狗
  rationale: 直译此核心审判意象；汉语类称名词无需强加复数标记。
- source_word: דַּם נָבוֹת
  choice: 拿伯的血
  rationale: 直接表达希伯来语属格结构，专名 נָבוֹת 音译为“拿伯”。
- source_word: אֶת דָּמְךָ גַּם אָתָּה
  choice: 你的血——连你也一样
  rationale: 末尾 גַּם אָתָּה 是突出的追加语，强调亚哈本人也将遭遇同样下场；破折号与“连你也一样”保留其突兀和强调效果。
theological_decisions:
- issue: הֲרָצַחְתָּ 对亚哈责任的道德定性
  choice: 正文译“你杀了人”，并以脚注指出也可译“你谋杀了人”
  alternative: 你谋杀了人
  rationale: 原词通常带有非法杀人的含义；但自然中文中的“杀了人”在控诉语境下已具强烈罪责意味。脚注保留更明确的法律—道德译法，既不削弱控诉，也不把译文解释得过满。
- issue: 末尾 גַּם אָתָּה 的强调与报应对应
  choice: 连你也一样
  alternative: 也要舔你的血／甚至是你的血
  rationale: 原文并非仅陈述“你的血”，而在句末追加“你也”，把审判明确落在亚哈本人身上。译文保留这一强调，不进一步解释其实现方式或时间。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。保留两次“你要对他说”和两次“耶和华如此说”的重复，以呈现先知传话的正式节奏；用“霸占产业”表达不义取得所有权，用破折号再现末尾强调。所有脚注标记均置于正文相应位置。
