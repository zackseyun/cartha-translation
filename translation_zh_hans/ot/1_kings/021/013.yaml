  text: וַ֠/יָּבֹאוּ שְׁנֵ֨י הָ/אֲנָשִׁ֥ים בְּנֵֽי בְלִיַּעַל֮ וַ/יֵּשְׁב֣וּ נֶגְדּ/וֹ֒ וַ/יְעִדֻ/הוּ֩ אַנְשֵׁ֨י הַ/בְּלִיַּ֜עַל אֶת נָב֗וֹת נֶ֤גֶד הָ/עָם֙ לֵ/אמֹ֔ר בֵּרַ֥ךְ נָב֛וֹת אֱלֹהִ֖ים וָ/מֶ֑לֶךְ וַ/יֹּצִאֻ֨/הוּ֙ מִ/ח֣וּץ לָ/עִ֔יר וַ/יִּסְקְלֻ֥/הוּ בָ/אֲבָנִ֖ים וַ/יָּמֹֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/013.yaml
  text: Then the two worthless men came in and sat opposite him[a], and the worthless men testified against Naboth before the people, saying, “Naboth cursed God and the king.” So they brought him outside the city and stoned him with stones[b], and he died.
translation:
  language: zh_hans
  text: 那两个无赖进来，坐在拿伯对面[a]。这两个无赖当着众人的面作证控告拿伯，说：“拿伯咒骂[b]了上帝和王。”众人就把他带到城外，用石头砸他，他就死了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “无赖”直译为“彼列之子”或“彼列之人”，是指卑劣、邪恶之人的希伯来习语。
    reason: lexical_alternative
  - marker: b
    text: “咒骂”原文直译为“祝福”；这里用“祝福”作为“咒骂”的委婉说法。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי בְלִיַּעַל / אַנְשֵׁי הַבְּלִיַּעַל
  choice: 无赖
  rationale: 这是指品行卑劣、无法无天之人的希伯来习语，并非表示生理上的血缘关系；“无赖”在现代汉语中简洁自然，也保留了强烈的贬义。
- source_word: נֶגְדּוֹ
  choice: 在拿伯对面
  rationale: 该词表示面对着拿伯的位置；明确补出姓名，可避免汉语代词指向含混。
- source_word: וַיְעִדֻהוּ
  choice: 作证控告拿伯
  rationale: 此处是司法语境中的敌对证词；“作证控告”兼顾作证行为及其针对性。
- source_word: נֶגֶד הָעָם
  choice: 当着众人的面
  rationale: 表达指控公开发生在民众面前，比直译“在百姓面前”更符合现代汉语。
- source_word: בֵּרַךְ
  choice: 咒骂
  rationale: 字面为“祝福”，但在此控告亵渎的语境中是敬讳性委婉语，实际意思为“咒骂”；正文按语义翻译，并以脚注保留字面形式。
- source_word: אֱלֹהִים
  choice: 上帝
  rationale: 在以色列司法语境中指以色列的上帝，而非复数的诸神。
- source_word: וָמֶלֶךְ
  choice: 和王
  rationale: 直接保留上帝与王这两个被指称遭到咒骂的对象。
- source_word: וַיֹּצִאֻהוּ מִחוּץ לָעִיר
  choice: 把他带到城外
  rationale: 自然清楚地表达众人将拿伯移出城去执行死刑。
- source_word: וַיִּסְקְלֻהוּ בָאֲבָנִים
  choice: 用石头打他
  rationale: 明确保留希伯来文中的工具“石头”；在现代汉语中比“用石头石刑处死”自然，也不提前把死亡结果并入该动作。
- source_word: וַיָּמֹת
  choice: 他就死了
  rationale: 直接呈现连续叙事中的最终结果。
theological_decisions:
- issue: 亵渎指控中委婉语 בֵּרַךְ 的译法
  choice: 正文依实际语义译为“咒骂”
  alternative: 按字面译为“祝福”，再由脚注解释其委婉用法
  rationale: 原文以“祝福”作为敬讳性委婉说法，但指控的实际内容是拿伯咒骂上帝和王。正文传达实际语义，脚注交代字面形式，既清楚又可核查。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“无赖”保留原文强烈的道德贬义；“作证控告”呈现司法场景。正文中的两个脚注标记均与对应脚注配对。
