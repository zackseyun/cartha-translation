  text: וְ/גַ֨ם לְ/אִיזֶ֔בֶל דִּבֶּ֥ר יְהוָ֖ה לֵ/אמֹ֑ר הַ/כְּלָבִ֛ים יֹאכְל֥וּ אֶת אִיזֶ֖בֶל בְּ/חֵ֥ל יִזְרְעֶֽאל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/023.yaml
  text: And also concerning Jezebel[a], Yahweh spoke, saying, ‘The dogs will eat Jezebel in the territory of Jezreel.’
translation:
  language: zh_hans
  text: 雅威也论到耶洗别说：“狗必在耶斯列境内[a]吃掉耶洗别。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在耶斯列的城墙边。”这里的希伯来词含义难定，也可能更具体地指城的外围防御区域。
    reason: 词义存在不确定性，需保留建筑性地点解释这一合理替代译法。
lexical_decisions:
- source_word: וְגַם
  choice: 也
  rationale: 承接上一节的审判宣告，并保留גַם的附加语气；现代汉语中无需另加“并且”即可自然表达。
- source_word: לְאִיזֶבֶל
  choice: 论到耶洗别
  rationale: לְ与דבר连用时可标明言论所涉及的人；上下文是以利亚转述关于耶洗别的神谕，并非说雅威直接向她讲话。
- source_word: דִּבֶּר יְהוָה לֵאמֹר
  choice: 雅威……说
  rationale: 以自然简洁的汉语表达希伯来语的引语公式，同时保留发言主体和直接引语。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来辅音所代表的神名YHWH音译，保留其作为专名的性质，不以称号替代。
- source_word: הַכְּלָבִים
  choice: 狗
  rationale: 汉语泛指一类动物时通常不另行体现希伯来语定冠词；译文仍明确保留原词所指。
- source_word: יֹאכְלוּ
  choice: 必……吃掉
  rationale: “必”表达先知性宣告的确定将来意义；“吃掉”是现代汉语中自然、直白的说法，不采用语气更强的“吞噬”。
- source_word: בְּחֵל יִזְרְעֶאל
  choice: 在耶斯列的地界
  rationale: חֵל在此含义难定。“地界”保留地点意义而不过度断定具体建筑结构；较具体的城防解释列入脚注。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；音译“雅威”保留其专名性质，避免以“主”等称号取代。
- issue: לְאִיזֶבֶל与דִּבֶּר的关系
  choice: 论到耶洗别
  alternative: 对耶洗别说；攻击耶洗别说
  rationale: 叙事场景中，以利亚是在向亚哈转述关于耶洗别的判词；此译法不暗示耶洗别是当时直接受话者。
- issue: בְּחֵל יִזְרְעֶאל的地点含义
  choice: 在耶斯列的地界
  alternative: 在耶斯列的城墙边；在耶斯列的外围防御区
  rationale: חֵל的具体所指存在词义不确定性。正文采用较宽泛而清楚的地点表达，脚注保留更具体的建筑性理解。
translation_notes:
  register: 采用现代、庄重而直接的普通话。“吃掉”保留审判宣告的鲜明和残酷，不用较文言的“食”或强化语气的“吞噬”。脚注标记紧随存在词义争议的“地界”。
