base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/006.yaml
  text: And he spoke to her, because I spoke to Naboth the Jezreelite and said to him, ‘Give me your vineyard for silver, or, if you prefer, I will give you a vineyard in place of it,’ but he said, ‘I will not give you my vineyard.’
translation:
  language: zh_hans
  text: 他对她说：“因为我曾对耶斯列人拿伯说：‘把你的葡萄园给我，我可以付你银子；或者你若愿意，我就另给你一座葡萄园来替换。’可是他说：‘我不把我的葡萄园给你。’”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּכֶסֶף
  choice: 付你银子
  rationale: 直译为“以银子”，在现代汉语中用“付你银子”自然表达以银钱换取葡萄园，同时保留古代语境。
- source_word: אִם חָפֵץ אַתָּה
  choice: 你若愿意
  rationale: חָפֵץ表示意愿或喜好；此处按交易提议译为“你若愿意”，简洁而不额外限定为偏好哪一种方案。
- source_word: כֶרֶם תַּחְתָּיו
  choice: 一座葡萄园来替换
  rationale: תַּחְתָּיו意为“代替它”；译文清楚表达以另一座葡萄园交换原园。
theological_decisions:
- issue: כִּי与后续第一人称话语的关系
  choice: 保留为亚哈对耶洗别所说的“因为我曾……”
  alternative: 译作引述标记“他说：‘我曾……’”，或省略“因为”以使叙事更顺畅
  rationale: 马所拉文本明确有כִּי（通常为“因为”）和第一人称אֲדַבֵּר；虽然此处句法略显突兀，仍保留原文的因果形式与人称，不以语境推断改写文本。
- issue: 拿伯拒绝时是否补入祖业理由
  choice: 只译“我不把我的葡萄园给你”
  alternative: 依据本章第3节补作“不把祖业给你”
  rationale: 本节引语本身只说“我的葡萄园”，不应从前文补入此处未出现的神学或法律理由。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语；以嵌套引号区分亚哈对耶洗别的话和他转述的对话。保留原文略显突兀的“因为”，不擅自修平文本。
