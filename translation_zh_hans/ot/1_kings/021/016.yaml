  text: וַ/יְהִ֛י כִּ/שְׁמֹ֥עַ אַחְאָ֖ב כִּ֣י מֵ֣ת נָב֑וֹת וַ/יָּ֣קָם אַחְאָ֗ב לָ/רֶ֛דֶת אֶל כֶּ֛רֶם נָב֥וֹת הַ/יִּזְרְעֵאלִ֖י לְ/רִשְׁתּֽ/וֹ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/016.yaml
  text: And when Ahab heard that Naboth was dead[a], Ahab arose to go down to the vineyard of Naboth the Jezreelite[b], to take possession of it.
translation:
  language: zh_hans
  text: 亚哈听说拿伯死了[a]，就起身下到耶斯列人拿伯的葡萄园去，要占有那园[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“已经死了”。希伯来语既可着重拿伯死亡后的状态，也可着重已经发生的死亡事件。
    reason: lexical_alternative
  - marker: b
    text: 或译“要取得那园”或“要承受那园为业”。这个希伯来语动词可依语境表示取得、占有或承受产业。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: （不单独译出）
  rationale: 这里作为叙事衔接成分，与后面的时间从句共同推进情节；现代汉语无需机械译为“事情是这样”。
- source_word: כִּשְׁמֹעַ
  choice: 听说
  rationale: כְּ 加动词不定式引出时间背景；结合后面的内容从句，汉语“听说”既自然，也表达“听见某消息”的意思。
- source_word: כִּי
  choice: （融入“听说”结构）
  rationale: 这里引出亚哈所听见的内容；现代汉语用“听说拿伯……”即可自然体现其功能。
- source_word: מֵת
  choice: 死了
  rationale: 该完成式可侧重死亡造成的状态，也可指已经发生的死亡事件；“死了”在现代汉语中自然地兼顾事件完成及其结果状态。
- source_word: וַיָּקָם
  choice: 就起身
  rationale: קום 在叙事中表示开始采取行动；“起身”保留原文动作意象，“就”体现事件的顺承，但不额外强化急迫程度。
- source_word: לָרֶדֶת
  choice: 下到
  rationale: 保留 ירד 的向下移动含义；“下到……去”符合现代汉语叙事表达。
- source_word: כֶּרֶם
  choice: 葡萄园
  rationale: 这是该词在本语境中的常规、准确含义。
- source_word: הַיִּזְרְעֵאלִי
  choice: 耶斯列人
  rationale: 该族属形容词标明拿伯与耶斯列的关系；“耶斯列人”简洁自然，并保留原文称谓。
- source_word: לְרִשְׁתּוֹ
  choice: 要占有那园
  rationale: ירשׁ 可表示取得产业、占有或承受为业。此处描述亚哈前去取得拿伯的葡萄园；“占有”表达取得并控制产业，不把动词本身过度强化为“抢夺”。“那园”清楚回指葡萄园。
theological_decisions:
- issue: 亚哈取得葡萄园的行为性质
  choice: 以“占有”翻译 ירשׁ，不在本节动词中增译“霸占”或“抢夺”
  alternative: 霸占那园／抢夺那园
  rationale: 上下文清楚揭示此事的不义，但本节的 ירשׁ 本身语义范围较宽。译文保留叙事的道德张力，而不把上下文判断直接塞进这个动词。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“就起身下到……去”保留希伯来叙事的动作顺序和方向感；避免古雅的“亚哈便起来，下去……”，也避免口语化的“马上动身”。脚注标记紧接其所说明的词语。
