  to: 亚哈因耶斯列人拿伯对他说的这番话，闷闷不乐、怒气冲冲地进了自己的家。拿伯说：“我不会把我列祖的产业给你。”[a] 亚哈就躺在自己的床上，把脸转向一边，也不肯吃饭。
