base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/004.yaml
  text: So Ahab went into his house sullen and angry because of the word that Naboth the Jezreelite had spoken to him[a], saying, “I will not give you the inheritance of my fathers.” And he lay down on his bed and turned his face away[c][b], and he would not eat bread.
translation:
  language: zh_hans
  text: 亚哈因耶斯列人拿伯对他说的这番话，闷闷不乐、怒气冲冲地进了自己的家。拿伯说：“我不会把我列祖的产业给你。”[a] 亚哈就躺在自己的床上，把脸转向一边，也不肯吃饭。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “我列祖的产业”也可译作“我祖先的产业”；原文直译为“我父辈的产业”，指从父辈承继下来的家族产业。
    reason: lexical_alternative
lexical_decisions:
- source_word: סַר וְזָעֵף
  choice: 闷闷不乐、怒气冲冲
  rationale: 两个并列词共同描写亚哈阴沉、恼怒的状态；采用自然的现代汉语四字表达，同时保留两重情绪。
- source_word: עַל הַדָּבָר אֲשֶׁר דִּבֶּר אֵלָיו
  choice: 因……对他说的话
  rationale: דבר在此指拿伯所说的话；译文保留“话”的含义，也符合现代汉语叙事习惯。
- source_word: נָבוֹת הַיִּזְרְעֵאלִי
  choice: 耶斯列人拿伯
  rationale: 按现代汉语常用次序表达籍贯称谓，并采用通行圣经人名译法。
- source_word: נַחֲלַת אֲבוֹתָי
  choice: 我祖辈的产业
  rationale: נחלה指承继而来的家族土地或产业，不只是一般财物；“祖辈的产业”自然地保留世代承继的含义。
- source_word: וַיִּשְׁכַּב עַל מִטָּתוֹ
  choice: 便躺在床上
  rationale: 准确表达叙事中的后续动作，语气自然。
- source_word: וַיַּסֵּב אֶת פָּנָיו
  choice: 转过脸去
  rationale: 既保留身体动作，也自然传达拒绝面对他人的姿态，不额外解释其心理。
- source_word: וְלֹא אָכַל לָחֶם
  choice: 也不肯吃饭
  rationale: לחם字面为“饼、食物”，此处是泛指进食的习语；“不肯吃饭”体现语境中的主动拒食。
theological_decisions:
- issue: 拿伯所说产业的祖传性质
  choice: 我祖辈的产业
  alternative: 我列祖的产业
  rationale: 原文אֲבוֹתָי为阳性复数，字面可译“我的父辈/列祖”；现代汉语“祖辈”在此仍能体现家族世代传承，又避免“列祖”较强的宗教文体色彩。产业的继承性质由“祖辈的产业”明确保留。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“宫中”根据亚哈的王室身份表达בֵּיתוֹ（他的家/宫室），不增添具体建筑细节；引语另起一句，以避免希伯来语连续结构在汉语中显得拖沓。
