  text: וַ/תִּכְתֹּ֤ב סְפָרִים֙ בְּ/שֵׁ֣ם אַחְאָ֔ב וַ/תַּחְתֹּ֖ם בְּ/חֹתָמ֑/וֹ וַ/תִּשְׁלַ֣ח ה/ספרים אֶל הַ/זְקֵנִ֤ים וְ/אֶל הַֽ/חֹרִים֙ אֲשֶׁ֣ר בְּ/עִיר֔/וֹ הַ/יֹּשְׁבִ֖ים אֶת נָבֽוֹת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/008.yaml
  text: So she wrote letters in Ahab’s name[a], sealed them with his seal, and sent the letters to the elders and to the nobles who were in his city, who were living with Naboth.
translation:
  language: zh_hans
  text: 于是，她以亚哈的名义写了几封信，用亚哈的印封缄，送给他城中的[a]长老和贵族，就是那些与拿伯同城居住的人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “他城中”的“他”可指拿伯，也可指亚哈；正文保留这一歧义。
    reason: 保留希伯来语第三人称阳性单数后缀所指的真实歧义。
lexical_decisions:
- source_word: וַתִּכְתֹּב
  choice: 于是，她……写了
  rationale: 连续式叙事动词推进情节；“于是”符合现代汉语叙事习惯，阴性单数主语依上下文指耶洗别。
- source_word: סְפָרִים / הַסְּפָרִים
  choice: 几封信 / 信
  rationale: סֵפֶר可指书面文件；本节是寄给地方领袖的正式通信，译作“信”最自然。“几封”表达希伯来语复数，不武断指定数目。
- source_word: בְּשֵׁם אַחְאָב
  choice: 以亚哈的名义
  rationale: 保留奉亚哈权柄或代表亚哈行事的官方意味，也是现代汉语的常用表达。
- source_word: וַתַּחְתֹּם בְּחֹתָמוֹ
  choice: 用亚哈的印封好
  rationale: חתם与חותם连用，指用印章封缄文件；明说“亚哈”可避免汉语连续代词造成误解。
- source_word: הַזְּקֵנִים
  choice: 长老
  rationale: 此词在这里指当地具有治理职责的资深领袖；“长老”是准确而通行的译法。
- source_word: הַחֹרִים
  choice: 贵族
  rationale: חֹרִים指社会地位较高的显贵人士；“贵族”简明且符合语境。
- source_word: אֲשֶׁר בְּעִירוֹ
  choice: 他城里的
  rationale: 保留第三人称单数后缀，不在正文中把可能指拿伯或亚哈的所指完全明定。
- source_word: הַיֹּשְׁבִים אֶת נָבוֹת
  choice: 那些与拿伯同城居住的人
  rationale: ישב与אֶת在此表达与拿伯一同居于该地；“同城居住”比字面的“与拿伯同住”更能避免被误解为同住一宅。
theological_decisions:
- issue: בְּעִירוֹ中第三人称单数后缀的所指
  choice: 正文保留“他”的歧义，并按上下文主要理解为拿伯的城
  alternative: “他”也可能指亚哈，即“亚哈的城”
  rationale: 紧随其后的“与拿伯同城居住”支持把当地领袖理解为拿伯城里的人，但语法上的阳性单数后缀也可能回指前文的亚哈，因此不宜静默排除另一种理解。
translation_notes:
  register: 采用庄重、自然的现代标准汉语。“以……的名义”“用……的印封好”兼顾正式文书语境和普通读者的可理解性；用“同城居住”避免“同住”在现代汉语中被误解为共住一所房屋。
