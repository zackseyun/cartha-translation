  - severity: medium
    issue: “在以色列一个也不留下”是未锚定的扩展。
    rationale: 原文的灭绝公式确有全数剪除的效果，但并无与该中文短语逐词对应的独立成分；“所有”及“不论……还是……”已经足以表达其范围。
  - severity: low
