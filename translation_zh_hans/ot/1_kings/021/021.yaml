source:
  edition: WLC
  text: הִנְ/נִ֨י מבי אֵלֶ֨י/ךָ֙ רָעָ֔ה וּ/בִעַרְתִּ֖י אַחֲרֶ֑י/ךָ וְ/הִכְרַתִּ֤י לְ/אַחְאָב֙ מַשְׁתִּ֣ין בְּ/קִ֔יר וְ/עָצ֥וּר וְ/עָז֖וּב בְּ/יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/021.yaml
  text: Behold[a], I am bringing disaster upon you, and I will sweep away after you, and I will cut off from Ahab every male, both bond and free in Israel.
translation:
  language: zh_hans
  text: 看哪，我必使灾祸临到你；我要除尽你的后嗣，又要从以色列中剪除所有属亚哈的男子[a]，无论受拘束的还是被弃置的[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“所有向墙撒尿的”，是指男性的粗俗说法。
    reason: 保留原文习语的粗粝语气，同时使正文自然清楚。
  - marker: b
    text: 这对希伯来语用语的确切含义不确定；也有人理解为“为奴的还是自由的”或“受保护的还是被撇弃的”。其作用是强调无一例外。
    reason: 说明该固定搭配的词义歧义，避免正文把有争议的社会身份解释确定化。
lexical_decisions:
- source_word: הִנְנִי
  choice: 看哪，我必
  rationale: 保留先知宣告公式的庄严感与迫近性；现代汉语中“看哪”虽略带庄重色彩，但仍清楚可懂。
- source_word: מֵבִיא אֵלֶיךָ רָעָה
  choice: 使灾祸临到你
  rationale: 此处 רָעָה 指审判性的灾难，而非道德意义上的邪恶；“临到你”自然表达灾祸针对亚哈而来。
- source_word: וּבִעַרְתִּי אַחֲרֶיךָ
  choice: 彻底清除你身后的一切
  rationale: 保留 אַחֲרֶיךָ“在你之后／你身后”的意象，同时以“一切”补足中文语法所需的隐含宾语；不直接限定为“后裔”，以免消除原文的含混。
- source_word: וְהִכְרַתִּי לְאַחְאָב
  choice: 我必从亚哈家剪除
  rationale: “剪除”保留 כרת 在审判公式中的强烈意象；加入“家”按上下文说明所属关系，指亚哈王朝或家族，而非另一个名叫亚哈的对象。
- source_word: מַשְׁתִּין בְּקִיר
  choice: 所有男子
  rationale: 这是粗俗的希伯来习语，字面为“向墙撒尿的”；正文采用其明确所指，字面表达置于脚注。
- source_word: וְעָצוּר וְעָזוּב
  choice: 无论被拘禁的还是被放任的
  rationale: 该固定搭配的精确所指有争议。采用较贴近词面的译法，并借“无论……还是……”表达无一例外，避免将其确定解释为“为奴的和自由的”。
- source_word: בְּיִשְׂרָאֵל
  choice: 在以色列
  rationale: 按其地点范围直译，并使其统摄亚哈家男子被彻底剪除的宣告。
theological_decisions:
- issue: 神所带来的 רָעָה
  choice: 灾祸
  alternative: 邪恶／祸患
  rationale: 上下文是对亚哈的刑罚与灾难宣告；译作“灾祸”既保留审判的严重性，也不误示神施行道德之恶。
- issue: אַחֲרֶיךָ 的对象范围
  choice: 你身后的一切
  alternative: 你的后裔
  rationale: 原文没有明说“后裔”；正文保留“身后”的开放性，由后半句对亚哈家男子的剪除进一步说明其现实范围。
- issue: וְעָצוּר וְעָזוּב 的解释
  choice: 被拘禁的还是被放任的
  alternative: 为奴的还是自由的／受保护的还是被撇弃的
  rationale: 这一成对用语词义不确定，但功能上强调全体无例外；采用近字面译法并加脚注，避免把有争议的社会身份解释写死。
translation_notes:
  register: 采用现代、庄重而可懂的先知审判语体。“看哪”“剪除”保留宣告的肃穆力度；“彻底清除”“一个也不留下”使希伯来文灭绝公式在现代汉语中清晰有力。所有脚注标记均已置于正文相应位置。
