- from: 看哪，我必使灾祸临到你，彻底清除你身后的一切；我必从亚哈家剪除所有男子[a]，无论被拘禁的还是被放任的，在以色列一个也不留下[b]。
  to: 看哪，我必使灾祸临到你；我要除尽你的后嗣，又要从以色列中剪除所有属亚哈的男子[a]，无论受拘束的还是被弃置的[b]。
  rationale: 修订使“除尽你的后嗣”明确传达此处“在你之后”的审判公式所指，同时删去无原文锚定的“一切”和“一个也不留下”。“所有属亚哈的男子”比“亚哈家”更贴近原文的所属表达，且仍为现代汉语所能理解。保留对末尾固定搭配的审慎近字面译法及说明性脚注。
