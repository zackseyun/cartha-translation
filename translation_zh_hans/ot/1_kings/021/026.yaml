  text: וַ/יַּתְעֵ֣ב מְאֹ֔ד לָ/לֶ֖כֶת אַחֲרֵ֣י הַ/גִּלֻּלִ֑ים כְּ/כֹל֙ אֲשֶׁ֣ר עָשׂ֣וּ הָ/אֱמֹרִ֔י אֲשֶׁר֙ הוֹרִ֣ישׁ יְהוָ֔ה מִ/פְּנֵ֖י בְּנֵ֥י יִשְׂרָאֵֽל׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/026.yaml
  text: He acted very abominably by going after idols[a], according to all that the Amorites had done[b], whom Yahweh drove out before the sons of Israel.
translation:
  language: zh_hans
  text: 他随从偶像[a]，行事极其可憎，完全照着耶和华在以色列子孙[b]面前赶出去的亚摩利人所行的一切。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “偶像”所译的希伯来词带有强烈的鄙夷和厌恶意味；也可译作“可憎的偶像”。“粪像”是一个形象化的字面译法。
    reason: lexical_alternative
  - marker: b
    text: “以色列子孙”也可译作“以色列人”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּתְעֵב מְאֹד
  choice: 他行事极其可憎
  rationale: 将反身词干所表达的可憎行为译为“行事……可憎”，既保留道德评价，也避免误解为仅仅“变得可憎”；“极其”准确体现 מְאֹד 的加强语气。
- source_word: לָלֶכֶת אַחֲרֵי
  choice: 去随从
  rationale: 保留“走在……之后”的跟随意象，同时以现代汉语“随从”表达效忠并敬拜的含义。
- source_word: הַגִּלֻּלִים
  choice: 偶像
  rationale: 正文采用清楚自然的“偶像”；原词带有强烈鄙夷、厌恶色彩，另在脚注说明。
- source_word: כְּכֹל אֲשֶׁר עָשׂוּ
  choice: 完全照着……所行的一切
  rationale: 贴近比较结构及 כֹל 的整体性，说明亚哈的行为以亚摩利人的一切恶行为模式。
- source_word: הָאֱמֹרִי
  choice: 亚摩利人
  rationale: 希伯来文虽为单数形式，却在此作集合名词使用；汉语自然译作复数概念“亚摩利人”。
- source_word: הוֹרִישׁ
  choice: 赶出去
  rationale: 使役形式在征服语境中指使原居民失去土地并离开；“赶出去”清楚、自然。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的神名音译“耶和华”，而不是以称号替代专名。
- source_word: מִפְּנֵי
  choice: 从……面前
  rationale: 保留原文空间关系，并与“赶出去”自然搭配。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列众子
  rationale: 正文保留原文“以色列之子”的男性复数表达；加“众”使现代汉语更顺畅，并以脚注给出惯用表达。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用四字神名而非普通称号；中文正文以广为人知的专名音译“耶和华”保留其专名性质。“雅威”是更贴近学界常见重构读音的另一译法。
- issue: בְּנֵי יִשְׂרָאֵל 的性别与群体含义
  choice: 以色列众子
  alternative: 以色列人
  rationale: 原文在形式上是阳性复数“以色列之子”，同时代表整个盟约群体；正文保留形式，脚注提供自然且涵盖全体的群体译法。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“行事极其可憎”保留原文强烈的道德判断；分号用来理清亚摩利人这一先行词与后续关系从句的联系，避免中文长句产生歧义。
