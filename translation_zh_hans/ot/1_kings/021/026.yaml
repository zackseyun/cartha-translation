revisions:
- from: 他行事极其可憎，去随从偶像[a]，完全照着亚摩利人所行的一切；耶和华曾把他们从以色列众子[b]面前赶出去。
  to: 他随从偶像[a]，行事极其可憎，完全照着耶和华在以色列子孙[b]面前赶出去的亚摩利人所行的一切。
  rationale: 修订恢复原文中“亚摩利人”与“耶和华赶出去”之间的定语关系，调整不够自然的现代汉语搭配，并以“以色列子孙”替代生硬的“以色列众子”。不改变原文对偶像崇拜的强烈贬义、对亚摩利人行为的比较，以及耶和华使其从以色列面前被逐出的历史陈述。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T05:51:05Z'
review_pass:
  verdict: revise
  source_fidelity: 原文的关系从句“耶和华……赶出去的亚摩利人”应直接限定“亚摩利人”。草稿用分号另起分句并以“他们”回指，虽大意可推知，仍削弱了原有句法关联，并可能造成结构上的短暂歧义。修订将其恢复为明确的定语结构。
  naturalness: “去随从偶像”略显生硬，“随从偶像”更合现代汉语。以“以色列子孙”表达 בְּנֵי יִשְׂרָאֵל，既保留源语的家族／后裔表述，也比“以色列众子”自然。
  terminology: “耶和华”“亚摩利人”“偶像”均可保留。“可憎的偶像”适合在脚注说明 גִּלֻּלִים 的贬义；“粪像”属于形象化的直译说法，宜谨慎标作可供参考的字面译法，而不应断言其词源。
  issues:
