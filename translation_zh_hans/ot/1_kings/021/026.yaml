    rationale: “以色列子孙”自然地保留“以色列的子嗣／后裔”这一原文形式；脚注可列“以色列人”为通顺的群体译法。
  - severity: low
    issue: 脚注称“按词源形象”直译为“粪像”表述过强。
    rationale: 该词的贬义明确，但其具体词源说明有讨论空间；应以“可作形象化的字面译法”谨慎表述。
