    rationale: אֲשֶׁר הוֹרִישׁ יְהוָה…是限定“亚摩利人”的关系从句；改为“耶和华在以色列子孙面前赶出去的亚摩利人”，可忠实呈现原文关系且避免代词指代松散。
  - severity: low
    issue: “去随从”搭配不够自然。
    rationale: 中文中“随从偶像”已足以表达跟随、转向敬拜的含义。
  - severity: low
