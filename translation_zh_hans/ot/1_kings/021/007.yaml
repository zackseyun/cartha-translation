  text: וַ/תֹּ֤אמֶר אֵלָי/ו֙ אִיזֶ֣בֶל אִשְׁתּ֔/וֹ אַתָּ֕ה עַתָּ֛ה תַּעֲשֶׂ֥ה מְלוּכָ֖ה עַל יִשְׂרָאֵ֑ל ק֤וּם אֱכָל לֶ֨חֶם֙ וְ/יִטַ֣ב לִבֶּ֔/ךָ אֲנִי֙ אֶתֵּ֣ן לְ/ךָ֔ אֶת כֶּ֖רֶם נָב֥וֹת הַ/יִּזְרְעֵאלִֽי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/007.yaml
  text: Then Jezebel his wife said to him[a], “Do you now govern Israel as king? Get up, eat bread, and let your heart be cheerful[b]; I will give you the vineyard of Naboth the Jezreelite.”
translation:
  language: zh_hans
  text: 于是他的妻子耶洗别对他说[a]：“你现在是在以色列行使王权吗？起来，吃饭吧，心里高兴些[b]；我会把耶斯列人拿伯的葡萄园给你。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “你现在是在以色列行使王权吗？”也可译作：“你现在在以色列行使王权。”希伯来文可理解为陈述或讥讽，不一定是问句。
    reason: alternative_reading
  - marker: b
    text: “吃饭”原文直译为“吃饼”，是指进餐的希伯来惯用语。
    reason: cultural_note
lexical_decisions:
- source_word: וַתֹּאמֶר אֵלָיו
  choice: 对他说
  rationale: 未机械译出连接词וַ；汉语叙事依上下文即可自然表达事件推进。
- source_word: אִיזֶבֶל אִשְׁתּוֹ
  choice: 他的妻子耶洗别
  rationale: 以自然汉语保留耶洗别与亚哈的夫妻关系，并明确说话者。
- source_word: אַתָּה עַתָּה תַּעֲשֶׂה מְלוּכָה עַל יִשְׂרָאֵל
  choice: 现在你还算是在以色列掌王权吗？
  rationale: מְלוּכָה与“行、做”组合，指行使王权；按语境译作带嘲讽意味的反问。“还算是”传达责斥语气，但不把王权本身改写成一般治理。
- source_word: קוּם
  choice: 起来
  rationale: 直接保留命令语气，符合现代汉语。
- source_word: אֱכָל לֶחֶם
  choice: 吃饭
  rationale: 字面为“吃饼/吃食物”，在此是进餐的希伯来惯用语；“吃饭”是自然、准确的现代汉语对应。
- source_word: וְיִטַב לִבֶּךָ
  choice: 让你的心快活起来
  rationale: 保留“心”这一意象，并表达心情转为愉快的意思。
- source_word: אֲנִי אֶתֵּן לְךָ
  choice: 我会……给你
  rationale: 保留显式主语אֲנִי的强调和应许性的将来语气。
- source_word: כֶּרֶם נָבוֹת הַיִּזְרְעֵאלִי
  choice: 耶斯列人拿伯的葡萄园
  rationale: 自然表达所属关系；הַיִּזְרְעֵאלִי指来自耶斯列的人。
theological_decisions:
- issue: 耶洗别开头那句话的语力
  choice: 译作带嘲讽意味的反问：“现在你还算是在以色列掌王权吗？”
  alternative: 也可理解为陈述或讥讽：“现在是你在以色列掌王权。”
  rationale: 希伯来文没有显式疑问词，语法上可作陈述；但上下文显示耶洗别在斥责亚哈不运用王权，因此正文采用自然的反问，脚注保留陈述式可能。
translation_notes:
  register: 采用现代、庄重而口语自然的叙事文体。“掌王权”较“作王治理”更贴近原文“行使王权”的表达；“还算是”体现耶洗别尖锐的嘲讽语气。所有脚注标记均已置于正文。
