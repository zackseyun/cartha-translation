  text: הַ/מֵּ֤ת לְ/אַחְאָב֙ בָּ/עִ֔יר יֹאכְל֖וּ הַ/כְּלָבִ֑ים וְ/הַ/מֵּת֙ בַּ/שָּׂדֶ֔ה יֹאכְל֖וּ ע֥וֹף הַ/שָּׁמָֽיִם׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/024.yaml
  text: Anyone belonging to Ahab who dies in the city the dogs will eat[b][a], and anyone who dies in the field the birds of the sky will eat.
translation:
  language: zh_hans
  text: 凡属亚哈的人，死在城里的，必被狗吃掉；死在田野的，必被空中的飞鸟吃掉。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “空中”也可译作“天上”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמֵּת לְאַחְאָב
  choice: 凡属亚哈的人……死……的
  rationale: 带冠词的分词 הַמֵּת 在这里是泛指；לְאַחְאָב 表示归属或关联。此译法自然表达亚哈家中任何死去的人，并保留原文的概括性。
- source_word: בָּעִיר
  choice: 在城里
  rationale: 按其处所义直译，并与下半句“在田野”形成鲜明对照。
- source_word: יֹאכְלוּ הַכְּלָבִים
  choice: 必被狗吃掉
  rationale: 原文主动句直译为“狗必吃”，但汉语采用被动结构更顺畅，也不减弱审判宣告的力度；“吃掉”对应 אכל。
- source_word: בַּשָּׂדֶה
  choice: 在田野
  rationale: 保留 שָׂדֶה 的基本意象及其与城市相对的开放地域含义。
- source_word: עוֹף הַשָּׁמָיִם
  choice: 空中的飞鸟
  rationale: עוֹף 是飞禽的集合称呼，הַשָּׁמַיִם 在此指天空；“空中的飞鸟”是现代汉语中自然且庄重的表达。
theological_decisions:
- issue: לְאַחְאָב 所指的归属范围
  choice: 译作“属亚哈的人”
  alternative: “亚哈家的人”或“亚哈的后裔”
  rationale: 原文只表达与亚哈的归属关系，语境可能指其家室或王朝，但本节没有明确限定为血缘后裔；因此不在正文中过度收窄。
translation_notes:
  register: 采用现代、庄重而易懂的宣告体。“凡……的”呈现两个平行的泛指结构；两次“必被……吃掉”保留原文冷峻、对称的审判语气。
