base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/003.yaml
  text: But Naboth said to Ahab[a], “Far be it from me by Yahweh to give you the inheritance of my fathers.”
translation:
  language: zh_hans
  text: 拿伯却对亚哈说：“愿雅威绝不让我把我祖先传下来的产业给你。”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或较直译：“这事从雅威而言，断不可临到我。”原文的强烈拒绝语将此事与雅威相连；介词的具体关系可有不同理解。
    reason: 说明חָלִילָה לִּי מֵיהוָה这一惯用强烈拒绝语，并保留מִן的解释张力。
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 却……说
  rationale: וַ־推动叙事；结合上节亚哈的提议，“却”自然体现拿伯的拒绝和语篇转折，而不是机械译作“于是”或“并且”。
- source_word: נָבוֹת
  choice: 拿伯
  rationale: 采用现代中文圣经人名的通行音译。
- source_word: אֶל־אַחְאָב
  choice: 对亚哈
  rationale: 自然表达说话的对象；亚哈采用现代中文通行音译。
- source_word: חָלִילָה לִּי מֵיהוָה
  choice: 我凭雅威绝不能
  rationale: חָלִילָה לִּי表示强烈的拒斥，מֵיהוָה使这种拒绝明确关联于雅威；“凭雅威绝不能”保留其近似誓言的宗教分量，又符合现代汉语表达。
- source_word: מִתִּתִּי
  choice: 把……给
  rationale: 该介词加不定式表达被坚决拒绝的行动；在汉语中用“把”字句最自然。
- source_word: נַחֲלַת אֲבֹתַי
  choice: 我祖先的产业
  rationale: נַחֲלָה在此指家族世代承受的土地产业；“产业”兼顾土地财产和承继含义。“祖先”在现代汉语中自然表达复数אֲבֹתַי所指的父系先人。
- source_word: לָךְ
  choice: 给你
  rationale: 准确表达希伯来语的间接受词。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；“雅威”以现代汉语音译保留其作为专有盟约之名的性质。
- issue: חָלִילָה לִּי מֵיהוָה的关系与语气
  choice: 我凭雅威绝不能
  alternative: 雅威绝不容我；我在雅威面前万不可
  rationale: 原语表达既有强烈拒绝，也使拒绝与雅威相关。“凭雅威”保留其近似誓言的力度，避免把原文含混的介词关系完全解释为雅威直接发出禁令。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“绝不能”传达强烈拒绝，感叹号体现原句的情绪力度；“祖先的产业”使普通读者能够理解这是世代承受的家族土地，而不把它弱化为一般财物。
