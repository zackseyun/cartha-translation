  text: וְ֠/הוֹשִׁיבוּ שְׁנַ֨יִם אֲנָשִׁ֥ים בְּנֵֽי בְלִיַּעַל֮ נֶגְדּ/וֹ֒ וִ/יעִדֻ֣/הוּ לֵ/אמֹ֔ר בֵּרַ֥כְתָּ אֱלֹהִ֖ים וָ/מֶ֑לֶךְ וְ/הוֹצִיאֻ֥/הוּ וְ/סִקְלֻ֖/הוּ וְ/יָמֹֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/010.yaml
  text: And seat two worthless men opposite him[a], and let them testify against him, saying, ‘You have cursed God and the king.’ Then bring him out and stone him, so that he dies.
translation:
  language: zh_hans
  text: 又要叫两个无赖坐在他对面，让他们作证控告他说：‘你咒骂了上帝和王。’[a] 然后把他带出去，用石头打死。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “咒骂”原文直译为“祝福”；这里用“祝福”作为“咒骂”的委婉说法。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוֹשִׁיבוּ
  choice: 叫……坐
  rationale: 使役形在这里是“使其就座、安排坐下”；这样译既保留使役含义，也符合现代汉语表达。
- source_word: שְׁנַיִם אֲנָשִׁים בְּנֵי בְלִיַּעַל
  choice: 两个无赖
  rationale: 原文明确是两名男性，符合两名证人的法律背景；“无赖”传达该习语所指的卑劣、无法无天之人，又避免把“彼列之子”误解为专名或魔鬼称号。
- source_word: נֶגְדּוֹ
  choice: 在他对面
  rationale: 表示面对着拿伯就座，保留正式指控场景中的空间关系。
- source_word: וִיעִדֻהוּ
  choice: 让他们作证控告他
  rationale: 该动词在司法语境中指作证；加入“控告”清楚表达证言是针对他的，而不把动作弱化为一般指责。
- source_word: בֵּרַכְתָּ
  choice: 你咒骂了
  rationale: בּרך通常意为“祝福”，但此处以敬讳说法表达“咒骂”；上下文要求的是足以判处死刑的亵渎及冒犯君王之罪。字面形式在脚注说明。
- source_word: אֱלֹהִים וָמֶלֶךְ
  choice: 上帝和王
  rationale: 这里的אֱלֹהִים按单数所指理解，与“王”并列，构成对上帝和王权的双重指控。
- source_word: וְהוֹצִיאֻהוּ
  choice: 把他拉出去
  rationale: 表示将他带离现场去执行刑罚；“拉出去”符合暴力处决的语境，且自然直接。
- source_word: וְסִקְלֻהוּ וְיָמֹת
  choice: 用石头打死
  rationale: 将“用石头击打他”及结果式“使他死”合并为自然的现代汉语，同时完整传达处决方式和死亡结果。
theological_decisions:
- issue: בֵּרַכְתָּ以“上帝”为宾语时的敬讳用法
  choice: 正文译为“咒骂”，脚注交代字面为“祝福”
  alternative: 正文直译为“祝福”，再由读者依脚注判断其反义用法
  rationale: 叙事中的伪造罪名显然是咒骂上帝和王；正文若译“祝福”会误传控告内容，但脚注保留原文措辞及其敬讳性质。
- issue: בְּנֵי בְלִיַּעַל的身份含义
  choice: 译为“无赖”
  alternative: 译为“彼列之子”或“卑劣的人”
  rationale: 此处是描述道德败坏、可被收买作伪证的人，并无必要将“彼列”处理成专名；“无赖”简洁传达其社会与道德贬义。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“作证控告”保留司法语境；“用石头打死”比逐字译成“用石头打他，使他死”更自然，同时没有削弱死刑结果。脚注标记[a]紧随相关引语之后。
