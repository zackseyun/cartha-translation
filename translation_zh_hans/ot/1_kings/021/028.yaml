  text: And the word of Yahweh came to Elijah the Tishbite[a], saying,
translation:
  language: zh_hans
  text: 雅威[a]的话临到提斯比人以利亚，说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文为 YHWH（יהוה），这里译作“雅威”；传统上常译作“耶和华”或以“主”代称。
    reason: 说明神圣名字的原文形式、正文译法及传统译法。
lexical_decisions:
- source_word: וַיְהִי
  choice: 临到
  rationale: 在“耶和华的话临到某人”这一先知启示套语中，用“临到”既贴近原文结构，也符合现代中文圣经语体。
- source_word: דְּבַר יְהוָה
  choice: 耶和华的话
  rationale: דָּבָר既可指“话”，也可指“信息”；此处保留“话”，以维持先知叙事中的固定表达及经文间的呼应。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文读者最熟悉的神圣名字译法，并用脚注说明其希伯来文形式及传统代称。
- source_word: אֵלִיָּהוּ
  choice: 以利亚
  rationale: 采用现代中文圣经中通行的人名译法。
- source_word: הַתִּשְׁבִּי
  choice: 提斯比人
  rationale: 该称谓表明以利亚与提斯比的关系；“提斯比人”简洁地保留原文的族属或地名形容词形式，而不武断限定为出生地或居住地。
- source_word: לֵאמֹר
  choice: 说
  rationale: 该不定式引出下一节的直接话语；“说”自然简洁，并保留与后文的衔接。
theological_decisions:
- issue: 神圣名字 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威；主
  rationale: 原文直接使用四字神名。正文采用现代中文圣经传统中最通行的“耶和华”，同时在脚注中注明希伯来文形式，既保留其专名性质，也帮助读者理解“主”这一传统代称。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“耶和华的话临到……”保留先知启示套语；句末用“说：”明确提示神的话将在下一节开始。
