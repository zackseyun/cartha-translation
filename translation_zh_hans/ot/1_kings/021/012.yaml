  text: They proclaimed a fast and seated Naboth at the head of the people[a].
translation:
  language: zh_hans
  text: 他们宣告禁食，并让拿伯坐在民众中最前面的位置[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“坐在民众面前”或“坐在民众中最显要的位置”。原文此短语直译为“在民众的首位”。
    reason: lexical_alternative
lexical_decisions:
- source_word: קָרְאוּ
  choice: 宣告
  rationale: קרא以“禁食”为宾语时，指公开宣布或号召举行禁食；“宣告”既符合公共行动的语境，也自然庄重。
- source_word: צוֹם
  choice: 禁食
  rationale: 该名词指正式举行的禁食；汉语“宣告禁食”简洁自然，并保留其公共、制度性的意味。
- source_word: וְהֹשִׁיבוּ
  choice: 并让……坐
  rationale: ישב的使役式表示使某人坐下或安排某人就座；“让……坐”准确保留使役含义，现代汉语也较自然。
- source_word: אֶת נָבוֹת
  choice: 拿伯
  rationale: אֶת标明“拿伯”是动词的确定直接宾语；人名采用现代中文圣经中通行的音译。
- source_word: בְּרֹאשׁ
  choice: 在……的首位
  rationale: 该短语字面意为“在头部／首位”，在公共审理场景中可能指显要位置、众人前面或最前列；正文保留希伯来语的“首”意象。
- source_word: הָעָם
  choice: 民众
  rationale: עם在此指聚集起来的百姓或城中公众；“民众”能自然表达这群参加公共集会的人，同时不把它过度限定为正式议会。
