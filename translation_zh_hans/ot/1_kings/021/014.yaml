  yaml_path: translation/ot/1_kings/021/014.yaml
  text: Then they sent word to Jezebel[a], saying, “Naboth has been stoned and is dead.”
translation:
  language: zh_hans
  text: 于是，他们派人告诉耶洗别：“拿伯已经被人用石头打死了。”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 更直译：“拿伯被人用石头打了，他就死了。”
    reason: 原文用两个动词分句，先说拿伯被人用石头打，随后说他死了；主文按自然汉语合并为“用石头打死了”。
lexical_decisions:
- source_word: וַיִּשְׁלְחוּ
  choice: 于是，他们派人告诉
  rationale: 连续式动词推进叙事，译为“于是”自然；结合后面的“说”，这里所派出的是传话的人，因此用“派人告诉”准确表达语境含义。
- source_word: אֶל אִיזֶבֶל
  choice: 耶洗别
  rationale: 介词表示消息传达的对象；“耶洗别”采用现代中文圣经中通行的人名音译。
- source_word: לֵאמֹר
  choice: （以冒号引出直接引语）
  rationale: 这是希伯来语常见的引语公式。现代汉语以“告诉……：”引出话语，比另译“说”更简洁自然，含义没有缺失。
- source_word: סֻקַּל
  choice: 被人用石头打死
  rationale: 该动词为被动式，指以投石方式处死。中文补出施事泛称“人”，使被动句自然；“死”也承接下一动词明确说明的结果。
- source_word: נָבוֹת
  choice: 拿伯
  rationale: 采用现代中文圣经中通行的人名音译。
- source_word: וַיָּמֹת
  choice: 死了（合并在“打死了”中）
  rationale: 原文按顺序说“被人用石头打，他就死了”。主文用汉语自然的结果补语“打死了”表达同一事件及结果；脚注保留原文两分句的形式。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“于是”承接前文并推进情节；“派人告诉”符合传递消息的语境。主文避免生硬照搬希伯来语的两个连续分句，同时以脚注保存其形式。
