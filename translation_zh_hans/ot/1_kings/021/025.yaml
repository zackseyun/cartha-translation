  text: רַ֚ק לֹֽא הָיָ֣ה כְ/אַחְאָ֔ב אֲשֶׁ֣ר הִתְמַכֵּ֔ר לַ/עֲשׂ֥וֹת הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה אֲשֶׁר הֵסַ֥תָּה אֹת֖/וֹ אִיזֶ֥בֶל אִשְׁתּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/025.yaml
  text: Surely there was no one like Ahab, who sold himself to do what was evil in the sight of Yahweh, because Jezebel his wife incited him.
translation:
  language: zh_hans
  text: 的确，没有人像亚哈那样，把自己卖了，去行雅威眼中看为恶的事；他的妻子耶洗别煽动他。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רַק
  choice: 的确
  rationale: 此处主要加强整句的断言语气，而不是单纯表示“只有”；“的确”在现代汉语中自然地传达强调作用。
- source_word: לֹא הָיָה כְאַחְאָב
  choice: 从来没有人像亚哈那样
  rationale: 这是表达无人可比的希伯来语习语；补出“人”并用“从来”强化其历时性的概括，符合现代汉语表达。
- source_word: הִתְמַכֵּר
  choice: 卖身
  rationale: 保留 מכר 在此反身形式中的鲜明隐喻，表达亚哈主动把自己交付给恶，而不弱化为一般的“沉迷”或“致力于”。
- source_word: לַעֲשׂוֹת הָרַע
  choice: 去做……看为恶的事
  rationale: 自然表达持续实行恶事的含义，并与后面的评价短语连成通顺的汉语。
- source_word: בְּעֵינֵי יְהוָה
  choice: 雅威眼中看为
  rationale: 保留“在……眼中”的希伯来语评价性意象，同时按汉语习惯加入“看为”。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见的音译呈现四字神名，保留其作为以色列之神专名的性质，而不以称号代替。
- source_word: הֵסַתָּה
  choice: 煽动
  rationale: 该使役动词表示促使、挑动某人采取负面行动；“煽动”准确保留其贬义和推动作用。
- source_word: אֲשֶׁר הֵסַתָּה אֹתוֹ אִיזֶבֶל אִשְׁתּוֹ
  choice: 他的妻子耶洗别煽动了他
  rationale: 以并列分句自然呈现关系从句的内容，保留耶洗别对亚哈的煽动，同时不把这一关系明确限定为因果。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华／上主
  rationale: 原文直接使用四字神名；译作“雅威”可较直接地保留专名性质，避免以称号取代。
- issue: 亚哈的责任与耶洗别的煽动
  choice: 既保留“卖身”的主动性，也陈述妻子的煽动
  alternative: 译成“因为妻子煽动他”而明确建立因果关系
  rationale: 原文同时强调亚哈主动把自己交付给恶，也提及耶洗别的煽动。采用并列分句，避免让后者消解前者的责任，也不把关系词的语义过度收窄为单一因果。
translation_notes:
  register: 采用庄重而通俗的现代标准汉语。“卖身”保留原文强烈隐喻；分号使末句与前文紧密相连，又避免用“因为”过度解释 אֲשֶׁר 的逻辑关系。
