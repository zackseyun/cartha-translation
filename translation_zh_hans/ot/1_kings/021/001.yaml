  text: After these things[a], Naboth the Jezreelite had a vineyard in Jezreel, beside the palace of Ahab king of Samaria.
translation:
  language: zh_hans
  text: 这些事以后[a]，耶斯列人拿伯有一个在耶斯列的葡萄园，靠近撒马利亚王亚哈的宫殿。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“这些事以后，有一个葡萄园属于耶斯列人拿伯。”希伯来文用“有……归拿伯”来表达所有关系。
    reason: 词汇与句法异译
lexical_decisions:
- source_word: וַיְהִי
  choice: （不单独译出）
  rationale: 此处用于引入新的叙事段落；现代汉语可由“这些事以后”自然承接，无须另加“事情是这样”或“后来”。
- source_word: אַחַר הַדְּבָרִים הָאֵלֶּה
  choice: 这些事以后
  rationale: 保留希伯来语复数形式及时间过渡功能，表达自然、庄重。
- source_word: כֶּרֶם
  choice: 葡萄园
  rationale: 这是该词在此处通常且明确的含义。
- source_word: הָיָה לְנָבוֹת
  choice: 拿伯……有一个
  rationale: 希伯来语以存在句加介词表达所有关系；汉语用“有一个”自然呈现，同时在脚注说明原文结构。
- source_word: נָבוֹת
  choice: 拿伯
  rationale: 采用现代中文圣经人名的通行音译。
- source_word: הַיִּזְרְעֵאלִי
  choice: 耶斯列人
  rationale: 直接表达其籍贯或地域归属。
- source_word: אֲשֶׁר בְּיִזְרְעֶאל
  choice: 在耶斯列
  rationale: 简洁保留关系从句对葡萄园所在地的说明。
- source_word: אֵצֶל
  choice: 旁边
  rationale: 准确表达紧邻或靠近的位置关系，比泛指的“附近”更具体。
- source_word: הֵיכַל
  choice: 宫殿
  rationale: 在君王住所的语境中指王宫或宫殿，而非圣殿。
- source_word: אַחְאָב
  choice: 亚哈
  rationale: 采用现代中文圣经人名的通行音译。
- source_word: מֶלֶךְ שֹׁמְרוֹן
  choice: 撒马利亚王
  rationale: 自然表达亚哈的王权称号及其统治中心；与“亚哈”构成汉语常用的同位结构。
