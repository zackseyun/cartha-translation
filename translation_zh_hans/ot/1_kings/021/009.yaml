  yaml_path: translation/ot/1_kings/021/009.yaml
  text: She wrote in the letters[a], saying, “Proclaim a fast, and seat Naboth at the head of the people.”
translation:
  language: zh_hans
  text: 她在信中写道：“你们要宣告禁食，并让拿伯坐在民众前面[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“在民众之首”或“在民众中显眼的位置”。希伯来文直译为“在民众的头部／首位”，可能指会众中靠前、显眼或居首的位置。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּכְתֹּב
  choice: 她……写道
  rationale: 该词为כתב的连续式未完成时第三人称阴性单数，承接上文，以耶洗别为主语；中文用“她……写道”自然表达叙事推进及阴性主语。
- source_word: בַּסְּפָרִים
  choice: 在信中
  rationale: ספרים在本段语境中指寄给城中长老和贵族的书信，而非现代意义的书籍；中文“在信中写道”符合书信惯用表达。希伯来语为复数，中文集合性“信”在此可自然涵盖多封信件。
- source_word: לֵאמֹר
  choice: 写道
  rationale: 这是引出书信内容的标准引语形式；与כתב合译为“写道”，避免生硬的“写信说”，同时保留引语功能。
- source_word: קִרְאוּ
  choice: 宣告
  rationale: 复数命令式，要求公开发出举行禁食的通告；“宣告禁食”既自然，又体现正式、公开的行动。
- source_word: צוֹם
  choice: 禁食
  rationale: 该名词指共同体举行的禁食；“禁食”是现代中文中简洁而标准的对应。
- source_word: וְהוֹשִׁיבוּ
  choice: 并让……坐
  rationale: ישב的使役式复数命令，意为使某人就座；“让……坐”保留使役含义，也比“安置”更直接自然。
- source_word: אֶת נָבוֹת
  choice: 拿伯
  rationale: 将专名נָבוֹת按中文圣经通行形式音译为“拿伯”。
- source_word: בְּרֹאשׁ הָעָם
  choice: 在民众的首位
  rationale: 直译为“在民众的头部／首位”，可能表示会众前面、显眼处或居首的位置。“首位”保留原文的空间及地位意象，不武断限定其确切含义，并以脚注说明。
