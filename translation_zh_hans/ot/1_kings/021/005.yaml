  yaml_path: translation/ot/1_kings/021/005.yaml
  text: Then Jezebel his wife came to him and said to him[a], “Why is your spirit so sullen that you are not eating bread?”
translation:
  language: zh_hans
  text: 于是，亚哈的妻子耶洗别来到他那里，对他说[a]：“你为什么这样闷闷不乐，连饭也不吃呢？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译：“这是怎么回事？你的灵（指心情或精神状态）低沉，你也不吃饭？”
    reason: 说明原文疑问句的较直译结构，并保留“灵”在此指内在情绪状态的字面表达。
lexical_decisions:
- source_word: וַתָּבֹא אֵלָיו
  choice: 于是……来到他那里
  rationale: 连续式叙事动词推进情节；“于是”自然表达先后进展，“来到他那里”保留方向关系。
- source_word: אִיזֶבֶל אִשְׁתּוֹ
  choice: 亚哈的妻子耶洗别
  rationale: 原文为“他的妻子耶洗别”。中文补出前文所指的亚哈，使指代清楚；“耶洗别”采用通行中文圣经人名译法。
- source_word: וַתְּדַבֵּר אֵלָיו
  choice: 对他说
  rationale: 用于引出直接引语时，这是现代汉语自然且准确的表达。
- source_word: מַה־זֶּה
  choice: 为什么这样
  rationale: 字面为“这是什么”，在此是询问对方为何处于这种状态；意译为“为什么这样”既自然，也保留指向当前状况的语气。
- source_word: רוּחֲךָ סָרָה
  choice: 闷闷不乐
  rationale: רוּחַ在此指内在情绪或精神状态，סָרָה描述低落、乖戾或郁郁不欢的状态。“闷闷不乐”符合本段语境，又避免将其过度限定为愤怒或悲伤。
- source_word: וְאֵינְךָ אֹכֵל לָחֶם
  choice: 连饭也不吃
  rationale: “吃饼/面包”在此泛指吃饭。译作“吃饭”符合现代汉语；“连……也……”自然呈现后一现象作为其低落状态的突出表现，而不另加一个原文没有明说的“为什么”。
