base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/022.yaml
  text: but you came back and ate bread and drank water in the place about which he said to you[a], ‘Do not eat bread, and do not drink water’—your corpse shall not come to the tomb of your fathers.
translation:
  language: zh_hans
  text: 可是你回来了，在他对你说‘不可吃饼，也不可喝水’的地方吃了饼，喝了水；你的尸身必不能归到你列祖的坟墓。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתָּשָׁב
  choice: 你却回来
  rationale: שׁוב在连续叙事中表示返回；“却”自然体现责备语境中的转折，但不增添新的命题内容。
- source_word: וַתֹּאכַל לֶחֶם
  choice: 吃了饼
  rationale: 保留具体名词“饼”，与先前禁令的措辞呼应，不泛化为“吃了东西”。
- source_word: וַתֵּשְׁתְּ מַיִם
  choice: 喝了水
  rationale: 直接保留原文宾语及与禁令之间的重复。
- source_word: בַּמָּקוֹם אֲשֶׁר דִּבֶּר אֵלֶיךָ
  choice: 在他曾对你说……的地方
  rationale: 现代汉语用关系结构自然表达该地点正是命令所针对的地方；“他”依照马所拉文本保留第三人称，不擅自明确所指。
- source_word: אַל תֹּאכַל לֶחֶם וְאַל תֵּשְׁתְּ מָיִם
  choice: 不可吃饼，也不可喝水
  rationale: “不可”适合庄重的直接禁令；保留两个否定词和重复的名词，以呈现原文的修辞力度。
- source_word: נִבְלָתְךָ
  choice: 你的尸身
  rationale: נְבֵלָה指死尸；“尸身”既明确又较庄重，并保留审判宣告的强烈语气。
- source_word: לֹא תָבוֹא נִבְלָתְךָ אֶל קֶבֶר אֲבֹתֶיךָ
  choice: 你的尸身必不得葬入你列祖的坟墓
  rationale: 中文需自然表达尸身不能进入祖坟的含义；“葬入”将语境中隐含的安葬动作明说，同时脚注保存希伯来文直译的“来到”。
- source_word: אֲבֹתֶיךָ
  choice: 你列祖
  rationale: “列祖”在庄重现代汉语中简洁表达父系先祖及家族墓葬传统，比泛称“祖先”更贴近原文。
theological_decisions:
- issue: 审判宣告的性质
  choice: 具体宣告这位神人的尸身不能葬入列祖的坟墓
  alternative: 泛指死后受辱的比喻性宣告
  rationale: 希伯来文聚焦于尸身不能来到列祖的坟墓，最自然地指不能归葬祖坟；译文不进一步扩展其神学含义。
- issue: 命令发出者的指代
  choice: 保留“他曾对你说”
  alternative: 明确译为“耶和华曾对你说”
  rationale: 马所拉文本使用第三人称单数动词而未在本节重述主语；保留代词可维持原文的指代形式与可能张力。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“饼”“尸身”“列祖的坟墓”保留原文的具体意象；句法按现代汉语调整，避免生硬直译。脚注标记置于整句之后，对应审判宣告的翻译说明。
