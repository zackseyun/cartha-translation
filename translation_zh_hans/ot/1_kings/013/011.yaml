base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/011.yaml
  text: An old prophet was living in Bethel[a], and his sons came and told him all the deed that the man of God had done that day in Bethel, and the words that he had spoken to the king[b]; they told them to their father.
translation:
  language: zh_hans
  text: 有一位年老的先知[a]住在伯特利。他的儿子来了，把神人当天在伯特利所做的一切，以及他对王所说的话，都告诉了他；他们把这些事告诉了他们的父亲[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“有某一位年老的先知”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文先用单数“他的儿子来了……告诉了他”，随后转为复数“他们……告诉了他们的父亲”。这可能暗示不止一个儿子，也可能是文本或叙事上的不规则；正文保留这种转换，没有加以统一。
    reason: textual_variant
lexical_decisions:
- source_word: נָבִיא אֶחָד זָקֵן
  choice: 一位年老的先知
  rationale: אֶחָד在不定名词短语中可指某一个人；译作“一位”既自然，也保留其不定性。“年老的先知”准确表达זָקֵן，并避免把年龄误解为资历。
- source_word: יֹשֵׁב בְּבֵית־אֵל
  choice: 住在伯特利
  rationale: יֹשֵׁב在这里表示居住，而不是当时正在坐着；“住在”符合现代汉语叙事习惯。
- source_word: וַיָּבֹא בְנוֹ
  choice: 他的儿子来了
  rationale: בְנוֹ在此为单数“他的儿子”。正文保留单数，不以后文的复数形式加以统一。
- source_word: וַיְסַפֶּר לוֹ
  choice: 告诉了他
  rationale: ספר的皮埃勒词干在此意为讲述、告知；“告诉了他”简洁自然。
- source_word: אֶת כָּל הַמַּעֲשֶׂה
  choice: 所做的一切
  rationale: מַעֲשֶׂה虽为单数，却在这里概括神人所行的整件事；“所做的一切”在汉语中自然地保留这种集合意义。
- source_word: אִישׁ הָאֱלֹהִים
  choice: 神人
  rationale: 这是《列王纪》等历史书中固定的先知称号；“神人”简明并延续传统圣经汉语用法。
- source_word: הַיּוֹם
  choice: 当天
  rationale: 在过去时叙事中指故事所述的那一天，译作“当天”比“今天”自然。
- source_word: אֶת הַדְּבָרִים אֲשֶׁר דִּבֶּר אֶל הַמֶּלֶךְ
  choice: 以及他对王所说的话
  rationale: 保留דְּבָרִים“话”的具体表达，使先知所行的事与所说的话彼此有别。
- source_word: וַיְסַפְּרוּם לַאֲבִיהֶם
  choice: 他们又把这些事告诉了他们的父亲
  rationale: 希伯来语使用复数主语、复数宾语后缀和“他们的父亲”。译文保留复数“他们”，不将其与前文单数“儿子”调和；“这些事”概括前述行为与话语。
