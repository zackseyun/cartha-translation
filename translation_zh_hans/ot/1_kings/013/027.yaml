  text: 他对儿子们说：“给我把那头驴备上鞍。”于是他们就给那头驴备上了鞍。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר אֶל־בָּנָיו לֵאמֹר
  choice: 他吩咐儿子们说
  rationale: וַיְדַבֵּר推进叙事，直译为“说话”；结合随后命令式直接引语，现代汉语用“吩咐……说”更自然，并保留对象“儿子们”和引语结构。
- source_word: חִבְשׁוּ לִי אֶת־הַחֲמוֹר
  choice: 给我备好驴
  rationale: חבשׁ用于驴时指装上鞍具、备妥乘用；“备好驴”是自然的现代汉语表达，并保留לִי所表示的“为我”。
- source_word: וַיַּחֲבֹשׁוּ
  choice: 他们就把驴备好了
  rationale: 以“就”承接叙事结果，并重复“备好”以对应原文重复使用חבשׁ；补出“驴”使汉语所指清楚。
