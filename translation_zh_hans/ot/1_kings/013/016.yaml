base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/016.yaml
  text: And he said[a], “I cannot return with you or go with you, and I will not eat bread or drink water with you in this place.”
translation:
  language: zh_hans
  text: 他回答说[a]：“我不能同你回去，也不能与你同去；我也不会在这地方同你吃饼、喝水。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文本在前两个“同你”的“你”上使用阴性单数形式，在“同你吃饼、喝水”的“你”上则使用阳性单数形式；中文正文无法体现这种性别形式的变化。
    reason: textual_variant
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 他回答说
  rationale: 叙事体未完成式连续式引出直接引语；结合上下文，用“回答说”自然表明这是对邀请的回应，又不额外赋予因果或转折含义。
- source_word: לֹא אוּכַל
  choice: 我不能
  rationale: יכל的未完成式与否定词连用，表示不能或不被允许；“我不能”简洁自然，并保留这种约束意味。
- source_word: לָשׁוּב אִתָּךְ
  choice: 同你回去
  rationale: שׁוב表示返回、回去；“同你回去”准确表达与对方一同折返。
- source_word: וְלָבוֹא אִתָּךְ
  choice: 也不能与你同去
  rationale: בוא可随观察角度译作来、去或进入；此处不明确说明目的地，译作“同去”既符合汉语表达，也避免添加“进屋”等原文未明说的信息。
- source_word: וְלֹא אֹכַל לֶחֶם
  choice: 我也不会……吃饼
  rationale: 保留לֶחֶם的具体意象“饼”，并与上下文反复出现的禁令措辞呼应；未泛化为“吃东西”。
- source_word: וְלֹא אֶשְׁתֶּה ... מַיִם
  choice: 也不会……喝水
  rationale: 按原文保留“水”，并用汉语并列结构“吃饼、喝水”自然呈现两个否定行为。
- source_word: בַּמָּקוֹם הַזֶּה
  choice: 在这地方
  rationale: 直译地点短语，较“在这里”略具庄重感，同时仍符合现代汉语。
theological_decisions: []
translation_notes:
  register: 采用自然、庄重的现代标准汉语。保留“饼”和“水”的具体措辞，并以“同去”保留בוא在移动方向上的语境弹性。脚注说明马所拉文本中第二人称后缀的性别不一致，不在正文中擅自校正。
