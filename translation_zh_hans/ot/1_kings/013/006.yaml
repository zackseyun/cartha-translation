  text: וַ/יַּ֨עַן הַ/מֶּ֜לֶךְ וַ/יֹּ֣אמֶר אֶל אִ֣ישׁ הָ/אֱלֹהִ֗ים חַל נָ֞א אֶת פְּנֵ֨י יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ וְ/הִתְפַּלֵּ֣ל בַּעֲדִ֔/י וְ/תָשֹׁ֥ב יָדִ֖/י אֵלָ֑/י וַ/יְחַ֤ל אִישׁ הָֽ/אֱלֹהִים֙ אֶת פְּנֵ֣י יְהוָ֔ה וַ/תָּ֤שָׁב יַד הַ/מֶּ֨לֶךְ֙ אֵלָ֔י/ו וַ/תְּהִ֖י כְּ/בָ/רִֽאשֹׁנָֽה׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/006.yaml
  text: Then the king answered and said to the man of God[a], “Please entreat the favor of Yahweh your God, and pray for me, that my hand may be restored to me.” So the man of God entreated the favor of Yahweh, and the king’s hand was restored to him and became as it was before.
translation:
  language: zh_hans
  text: 王回答神人说：“请你向耶和华你的神恳求施恩[a]，为我祷告，使我的手恢复原状。”于是神人恳求耶和华施恩，王的手就恢复了，像先前一样。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“求耶和华垂顾。”希伯来语此处的习语字面为“恳求耶和华的面”，意为求取他的恩宠。
    reason: 说明希伯来习语的字面意象及其在上下文中的惯用意义。
lexical_decisions:
- source_word: חַל נָא אֶת־פְּנֵי יְהוָה / וַיְחַל ... אֶת־פְּנֵי יְהוָה
  choice: 请你恳求耶和华施恩 / 恳求耶和华施恩
  rationale: 该习语字面涉及“脸/面”，实际表示恳求某人垂顾、施恩。“恳求……施恩”既传达请求的迫切，也避免“平息怒气”等超出本节明言范围的含义。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的专名“耶和华”呈现四字神名，而不以称号“主”替代。
- source_word: אֱלֹהֶיךָ
  choice: 你神
  rationale: 忠实保留王所说的第二人称所属关系，不改成“我们的神”；中文“耶和华你神”简洁庄重，也保留原文张力。
- source_word: וְהִתְפַּלֵּל בַּעֲדִי
  choice: 为我祷告
  rationale: 自然准确地表达带 בַּעֲדִי 的代求含义，无须加上较具解释性的“代求”。
- source_word: וְתָשֹׁב יָדִי אֵלָי / וַתָּשָׁב יַד־הַמֶּלֶךְ אֵלָיו
  choice: 使我的手恢复原状 / 王的手就恢复了
  rationale: 原文直译为手“回到”本人，结合上文指肢体功能恢复。中文用“恢复”清楚自然；请求中的“原状”与末句“像先前一样”相呼应。
- source_word: וַתְּהִי כְּבָרִאשֹׁנָה
  choice: 像先前一样
  rationale: 简明传达手恢复到原先状态，避免古奥的“如初”。
- source_word: אִישׁ הָאֱלֹהִים
  choice: 神人
  rationale: “神人”是该希伯来称谓在中文中的凝练对应，保留其特定先知性称号，不直接释作“先知”。
- source_word: וַיַּעַן ... וַיֹּאמֶר
  choice: 回答……说
  rationale: 保留希伯来叙事组合的两层表达，同时符合现代中文叙事习惯。
theological_decisions:
- issue: 王称耶和华为“你神”
  choice: 保留“耶和华你神”
  alternative: 耶和华我们的神
  rationale: 第二人称形式是原文明示的措辞，可能表现王与耶和华之间的距离感，也承认神人与神的特殊关系；不可擅自改为共同归属。
- issue: 恳求耶和华“的面”的习语
  choice: 正文译为“恳求耶和华施恩”，脚注保留“求耶和华垂顾”的可能表达及字面意象
  alternative: 平息耶和华的怒气
  rationale: 本习语表示求取恩宠或垂顾；“平息怒气”会把上下文可能蕴含的神学意义变成明说，过度限定原文。
translation_notes:
  register: 采用现代、庄重而通顺的叙事中文。保留“神人”这一传统且精确的称谓，以及“耶和华你神”的原文人称张力；避免把习语解释成明确的赎罪或平怒术语。
