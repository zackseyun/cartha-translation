reference: 1 Kings 13:26
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יִּשְׁמַ֣ע הַ/נָּבִיא֮ אֲשֶׁ֣ר הֱשִׁיב֣/וֹ מִן הַ/דֶּרֶךְ֒ וַ/יֹּ֨אמֶר֙ אִ֣ישׁ הָ/אֱלֹהִ֣ים ה֔וּא אֲשֶׁ֥ר מָרָ֖ה אֶת פִּ֣י יְהוָ֑ה וַ/יִּתְּנֵ֨/הוּ יְהוָ֜ה לָ/אַרְיֵ֗ה וַֽ/יִּשְׁבְּרֵ֨/הוּ֙ וַ/יְמִתֵ֔/הוּ כִּ/דְבַ֥ר יְהוָ֖ה אֲשֶׁ֥ר דִּבֶּר לֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/026.yaml
  text: When the prophet who had brought him back from the way heard it[a], he said, “It is the man of God who rebelled against the word of Yahweh; therefore Yahweh gave him to the lion, and it mauled him and killed him, according to the word of Yahweh that he spoke to him.”
translation:
  language: zh_hans
  text: 那位曾使他从路上返回的先知听见这事，就说：“这是那位违抗耶和华命令的[a]神人。因此，耶和华把他交给狮子；狮子撕裂了他，杀死了他，正如耶和华曾对他说过的话。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“违抗耶和华的话”；直译“违抗耶和华的口”。
    reason: 原文“反叛／违抗耶和华的口”是以“口”指其所说的话或命令的习语；主文采用自然的“命令”，脚注保留其余可行译法。
lexical_decisions:
- source_word: הֱשִׁיבוֹ מִן הַדֶּרֶךְ
  choice: 使他从路上返回
  rationale: 保留使役形式“使……返回”和 מן הַדֶּרֶךְ 的路线含义；在现代汉语中自然清楚，也延续本章“路”的叙事意象。
- source_word: אִישׁ הָאֱלֹהִים
  choice: 神人
  rationale: 这是希伯来叙事中对受神差遣者的固定称谓；“神人”简洁，并能保持上下文称呼的一致。
- source_word: מָרָה אֶת־פִּי יְהוָה
  choice: 违抗耶和华命令
  rationale: מָרָה 表示反抗或违背；“耶和华的口”在此是指他亲口发出的命令。译作“违抗耶和华命令”既传达反叛意味，也符合现代汉语习惯。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的专名形式，区别于一般称号“主”，并保留四字神名作为专名的功能。
- source_word: וַיִּתְּנֵהוּ ... לָאַרְיֵה
  choice: 把他交给狮子
  rationale: 此处 נתן + ל 表示将人交在狮子的权势之下；“交给”比字面“给”更准确自然。
- source_word: וַיִּשְׁבְּרֵהוּ
  choice: 撕伤了他
  rationale: שׁבר 字面有“打破、折断”之意，以狮子为主语时指猛烈撕咬或摧伤；“撕伤”保留暴力伤害，又避免误译成单纯“折断”。
- source_word: וַיְמִתֵהוּ
  choice: 把他咬死
  rationale: 使役式意为“使他死、杀死”；结合狮子这一主语，译为“咬死”在汉语中具体自然，同时明确死亡结果。
- source_word: כִּדְבַר יְהוָה אֲשֶׁר דִּבֶּר לוֹ
  choice: 正如耶和华对他说过的话
  rationale: 表达事件应验先前所说之话；“说过”清楚标明该话语先于当前事件。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用四字神名。中文主文采用广为人知且具有专名功能的“耶和华”，不以“主”替代；“雅威”是较接近学术重构发音的另一可行译法。
- issue: פִּי יְהוָה 的习语表达
  choice: 耶和华命令
  alternative: 耶和华的话；耶和华的口
  rationale: “口”以转喻方式指耶和华亲口发出的命令。上下文所违背的是明确禁令，因此“命令”自然且准确；不将其扩展为某一宗派性的神学解释。
- issue: 审判因果关系
  choice: 保留“因此，耶和华把他交给狮子”
  alternative: 耶和华任凭狮子袭击他
  rationale: וַיִּתְּנֵהוּ 明确以耶和华为主动者。译文保留原文直接的神圣施行关系，不弱化为纯粹许可，也不超出经文解释其机制。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。句法尽量贴近希伯来叙事推进，同时避免“违背耶和华的口”等生硬直译。本节无需脚注，因此主文没有脚注标记。
