base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/017.yaml
  text: 'For a word came to me by the word of the LORD: ‘You shall not eat bread, and you shall not drink water there; you shall not return by going on the way by which you went.’'
translation:
  language: zh_hans
  text: 因为有话借着耶和华的话临到我，说：“你不可在那里吃饼，也不可喝水；你不可沿着你来时所走的路回去。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דָבָר אֵלַי בִּדְבַר יְהוָה
  choice: 有话借着耶和华的话临到我
  rationale: 保留原文“话……借着耶和华的话”的重复与先知启示措辞，不将其简化为“耶和华吩咐我”。
- source_word: לֹא תֹאכַל לֶחֶם
  choice: 你不可……吃饼
  rationale: לֶחֶם在此可泛指食物，但直译“饼”能保留具体意象，且现代读者可以理解。
- source_word: לֹא תָשׁוּב לָלֶכֶת
  choice: 你不可……返回
  rationale: 原文由“返回”与“走”构成，汉语若逐字译作“返回去走”生硬；以“返回”表达核心动作，并由后面的“所走”保留行走措辞。
- source_word: בַּדֶּרֶךְ אֲשֶׁר הָלַכְתָּ בָּהּ
  choice: 从你去时所走的那条路
  rationale: 明确指先前来程所走的道路，同时保持原文关系从句的结构和意义。
theological_decisions:
- issue: “耶和华的话”的启示公式
  choice: 保留“有话借着耶和华的话临到我”的双重“话”表达
  alternative: 译为“耶和华曾吩咐我”
  rationale: 原文刻意使用דָבָר与בִּדְבַר יְהוָה；保留其形式可呈现说话者所声称的神圣启示来源，不替叙事预先判断该声称。
- issue: 禁令的语气
  choice: 使用“不可”
  alternative: 使用“不要”或“不得”
  rationale: “不可”既体现לֹא加未完成式在直接命令中的禁止语气，也符合庄重而自然的经文语体。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。保留先知启示公式的重复；引语标点按现代简体中文规范处理。
