  text: 他就对他说：“跟我回家吃饭吧。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 他就……说
  rationale: 叙事性连续式推动情节；“就”自然表达事件的承接。
- source_word: אֵלָיו
  choice: 对他说
  rationale: 准确表达介词加第三人称阳性单数词尾所标明的说话对象。
- source_word: לֵךְ אִתִּי
  choice: 跟我
  rationale: לֵךְ 字面为“去”，但与“和我”连用构成邀请时，现代汉语自然说“跟我”；其移动方向由后面的“回家”表达。
- source_word: הַבָּיְתָה
  choice: 回家
  rationale: “房屋”一词带方向词尾，意为“往家里／到房子去”；在邀请语境中，“回家”是自然、简洁的汉语表达，指随说话者到其住处。
- source_word: וֶאֱכֹל לָחֶם
  choice: 吃饭吧
  rationale: לֶחֶם 基本义为“饼、食物”，也常借指一餐饭；现代汉语邀请人“吃饭”比“吃饼”自然，“吧”体现连续命令式在此处的邀请语气。
