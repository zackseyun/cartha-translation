  text: And their father said to them, “Which way did he go?” For his sons had seen the way that the man of God, who came from Judah, had gone.
translation:
  language: zh_hans
  text: 他们的父亲问他们：“他走的是哪条路？”因为他的儿子们看见了那位从犹大来的神人所走的路。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: 问
  rationale: 该动词基本义为“说”，但这里引出直接问句，现代汉语用“问”更自然，也准确表达其言语功能。
- source_word: אֲבִיהֶם
  choice: 他们的父亲
  rationale: 后缀为第三人称阳性复数，指上文提到的众子；译为“他们的父亲”明确保留所指。
- source_word: אֵי זֶה הַדֶּרֶךְ
  choice: 哪条路
  rationale: 该问语要求辨明神人所走的路线；“哪条路”比单说“哪里”更贴合原文。
- source_word: הָלָךְ
  choice: 走了／所走的
  rationale: 两处均保留“走”的基本意义，并依问句和关系从句的汉语结构分别表达。
- source_word: וַיִּרְאוּ
  choice: 原来看见了
  rationale: 动词表示儿子们已经看见那条路线；“原来”在自然汉语中承接前面的提问，并体现此句对提问背景的解释作用。
- source_word: אִישׁ הָאֱלֹהִים
  choice: 神人
  rationale: “神人”是该希伯来固定称谓在中文圣经语境中简洁而准确的对应，不将其缩窄解释为“先知”。
- source_word: אֲשֶׁר בָּא מִיהוּדָה
  choice: 那位从犹大来的
  rationale: 保留关系从句及来源地点，以自然汉语置于“神人”之前。
