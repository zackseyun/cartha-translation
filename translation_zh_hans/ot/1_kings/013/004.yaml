  to: '王一听见神人向伯特利的祭坛所发出的斥责之言，耶罗波安就从祭坛上方伸出手来，说：“抓住他！”他向神人伸出的手枯干了[a]，不能收回来。


    [a] 或译“枯萎了”；希伯来文直译“干枯了”。'
  rationale: 修订明确神人是针对、斥责祭坛而呼喊，删去原文未明示的“立刻”，并以“从祭坛上方”较直接呈现 מֵעַל 的空间关系。其余叙事结构、专名、称谓和命令语气均予保留。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T05:51:04Z'
review_pass:
  verdict: revise
  source_fidelity: 译文总体准确传达王听见神人的话、下令拘捕、手枯干且不能收回的叙事。惟“向……大声宣告”未充分表达 קָרָא עַל 在此针对祭坛发出斥责的语气；“立刻”虽符合上下文的紧接叙述，却不是原文中明示的词语，宜删去以保持等值克制。
  naturalness: 整体是自然、庄重的现代普通话。“从祭坛那里”略显口语且空间关系含混，改为“从祭坛上方伸出手来”更贴近 מֵעַל；“收回来”自然。
  terminology: “神人”“伯特利”“耶罗波安”“祭坛”均恰当，并保留了原文称谓。“抓住他！”恰当传达复数命令式。脚注将 withered 译为“萎缩了”不够贴切，宜作“枯萎了”；主文“枯干了”保留 יבש 的干枯意象。
  issues:
  - severity: medium
    issue: “向伯特利的祭坛大声宣告的话”弱化了对祭坛的斥责性。
    rationale: קָרָא עַל 在此是向祭坛呼喊、宣告反对/斥责的话；仅说“向……宣告”可被理解为中性地对祭坛讲话。
  - severity: low
    issue: “立刻”超出了原文的明示措辞。
    rationale: 叙事连续性可暗示事件随即发生，但 וַתִּיבַשׁ 本身未含“立刻”；删除可避免添加时间限定。
  - severity: low
    issue: 脚注的“萎缩了”不是此处最贴切的中文替代译法。
    rationale: 英文审计轨迹的替代词为“withered”；中文“枯萎了”较准确保留枯槁意象，且不引入偏医学化的“萎缩”。
