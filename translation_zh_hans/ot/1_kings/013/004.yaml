  text: וַ/יְהִי֩ כִ/שְׁמֹ֨עַ הַ/מֶּ֜לֶךְ אֶת דְּבַ֣ר אִישׁ הָ/אֱלֹהִ֗ים אֲשֶׁ֨ר קָרָ֤א עַל הַ/מִּזְבֵּ֨חַ֙ בְּ/בֵֽית אֵ֔ל וַ/יִּשְׁלַ֨ח יָרָבְעָ֧ם אֶת יָד֛/וֹ מֵ/עַ֥ל הַ/מִּזְבֵּ֖חַ לֵ/אמֹ֣ר תִּפְשֻׂ֑/הוּ וַ/תִּיבַ֤שׁ יָד/וֹ֙ אֲשֶׁ֣ר שָׁלַ֣ח עָלָ֔י/ו וְ/לֹ֥א יָכֹ֖ל לַ/הֲשִׁיבָ֥/הּ אֵלָֽי/ו־־־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/004.yaml
  text: And when the king heard the word of the man of God[a], who cried out against the altar at Bethel, Jeroboam stretched out his hand from the altar, saying, “Seize him!” But his hand, which he stretched out against him, dried up, and he could not draw it back to himself.
translation:
  language: zh_hans
  text: '王一听见神人向伯特利的祭坛所发出的斥责之言，耶罗波安就从祭坛上方伸出手来，说：“抓住他！”他向神人伸出的手枯干了[a]，不能收回来。


    [a] 或译“枯萎了”；希伯来文直译“干枯了”。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“枯萎了”；希伯来文直译“干枯了”。
    reason: 说明 וַתִּיבַשׁ 的可行替代译法，并保留其字面“干枯”意象；锚点紧随“枯干了”。
lexical_decisions:
- source_word: דְּבַר
  choice: 话
  rationale: 在先知宣告的语境中，单数“话”既保留原文的具体表达，也比“信息”更贴近希伯来文措辞。
- source_word: אִישׁ הָאֱלֹהִים
  choice: 神人
  rationale: 这是希伯来圣经中的固定称谓；“神人”保留原文形式，避免直接解释为“先知”。
- source_word: קָרָא עַל
  choice: 向……大声宣告
  rationale: קרא表达出声呼喊或宣告，על在此表示宣告所针对的对象；此译法兼顾声音力度和针对性。
- source_word: בְּבֵית אֵל
  choice: 伯特利
  rationale: 采用现代中文圣经地名的通行音译；在句中作为祭坛所在地点。
- source_word: וַיִּשְׁלַח ... אֶת יָדוֹ מֵעַל הַמִּזְבֵּחַ
  choice: 从祭坛那里伸出手来
  rationale: שלח יד在此指伸手示意敌对行动；“从祭坛那里”自然表达王当时在祭坛处或祭坛上方的位置，而不把空间关系规定得过细。
- source_word: תִּפְשֻׂהוּ
  choice: 抓住他！
  rationale: 复数命令式是向随从发出的强硬命令；“抓住”直接有力，又不额外引入现代法律意义上的“逮捕”。
- source_word: וַתִּיבַשׁ יָדוֹ
  choice: 他的手立刻枯干了
  rationale: יבש的基本意象是变干、干枯；“枯干”保留原文形象，“立刻”由叙事中动作紧接发生的结构体现，不作医学诊断。
- source_word: אֲשֶׁר שָׁלַח עָלָיו
  choice: 他向神人伸出的手
  rationale: 关系从句指明正是那只朝神人敌意伸出的手；补出“神人”可避免中文代词指向含混。
- source_word: לַהֲשִׁיבָהּ אֵלָיו
  choice: 不能收回来
  rationale: 使役形态表示使手回到自己这里；中文“收回来”自然传达手突然无法缩回的状态。
theological_decisions:
- issue: 耶罗波安之手所受审判的性质
  choice: 按叙事直陈他的手突然枯干并失去收回能力
  alternative: 译作“萎缩”或进一步说明为某种瘫痪
  rationale: 原文将此事呈现为王敌对命令之后即时发生的身体审判；译文保留事件的超常性和力度，但不添加具体医学解释。
translation_notes:
  register: 采用庄重而清楚的现代标准普通话。“王一听见……耶罗波安就……”保留原文先以称号、后以姓名指称同一人物的叙事结构；命令句简短有力。
