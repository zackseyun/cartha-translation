  text: וְ/הַ/מִּזְבֵּ֣חַ נִקְרָ֔ע וַ/יִּשָּׁפֵ֥ךְ הַ/דֶּ֖שֶׁן מִן הַ/מִּזְבֵּ֑חַ כַּ/מּוֹפֵ֗ת אֲשֶׁ֥ר נָתַ֛ן אִ֥ישׁ הָ/אֱלֹהִ֖ים בִּ/דְבַ֥ר יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/005.yaml
  text: And the altar was torn apart[a], and the ashes were poured out from the altar, according to the sign that the man of God had given by the word of Yahweh.
translation:
  language: zh_hans
  text: 祭坛裂开了，灰烬也从祭坛上倾倒下来，正如神人奉雅威的话所给出的兆头[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “兆头”也可译作“征兆”或“神迹”。希伯来语 מוֹפֵת 可指具有验证作用的征兆、奇事或预兆。
    reason: 保留 מוֹפֵת 的词义范围，避免只突出超自然奇事或只突出预告功能。
lexical_decisions:
- source_word: הַמִּזְבֵּחַ
  choice: 祭坛
  rationale: 这是 מִזְבֵּחַ 在祭祀语境中的标准译法，准确而自然，无须增译为“献祭的祭坛”。
- source_word: נִקְרָע
  choice: 裂开了
  rationale: קרע 表示撕裂、裂开；此处描述祭坛发生明显破裂。“裂开了”自然保留希伯来语被动结果状态的含义。
- source_word: וַיִּשָּׁפֵךְ הַדֶּשֶׁן
  choice: 坛上的灰也倾倒出来
  rationale: שׁפך 表示倒出、倾出；דֶּשֶׁן 在祭坛语境中指献祭后留下的灰烬或含油脂的残余物。“灰”简明自然，“倾倒出来”体现其从坛上流落的动态。
- source_word: מִן הַמִּזְבֵּחַ
  choice: 坛上的……出来
  rationale: מן 表示来源。中文将其与主语合并为“坛上的灰……出来”，比直译“灰从祭坛倾倒出来”更顺畅，同时保留空间来源。
- source_word: כַּמּוֹפֵת
  choice: 正如……预兆
  rationale: כְּ 表示符合、照着；מוֹפֵת 可指神迹、征兆或预兆。上下文侧重事先宣告而后应验的验证性事件，因此译作“正如……预兆”，并以脚注保留词义范围。
- source_word: אֲשֶׁר נָתַן
  choice: 所给的
  rationale: 保留 נתן“给、赐下”的基本意义；与“预兆”搭配虽略带希伯来表达色彩，但庄重且可理解。
- source_word: אִישׁ הָאֱלֹהִים
  choice: 神人
  rationale: 这是 אִישׁ הָאֱלֹהִים 的传统而简洁的中文对应，保留其固定称号，不将其解释性地改为“先知”。
- source_word: בִּדְבַר יְהוָה
  choice: 奉雅威的话
  rationale: בְּ 可表达凭借或依据，דְבַר 为“话、言语”。“奉雅威的话”保留这一公式化表达及其权威来源，同时避免窄化为“命令”。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以“雅威”音译四字神名，保留经文直接使用的盟约之名。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用 יְהוָה；“雅威”较贴近通常重建的读音，也不以称号替代专名。
- issue: מוֹפֵת 的性质
  choice: 预兆
  alternative: 神迹；征兆
  rationale: 该词兼有神迹、征兆、预兆等意义。此处事件既超自然，又是先前所宣告并用于证实话语的记号；正文采用“预兆”，脚注保留其真实词义张力。
translation_notes:
  register: 采用现代、庄重且易懂的叙事体。“神人”保留圣经中的固定称号；“雅威”作为专名处理。脚注标记置于“裂开了”之后，提示整件应验之事与后文“预兆”的词义说明相关。
