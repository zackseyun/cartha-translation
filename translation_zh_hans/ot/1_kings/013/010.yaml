  text: So he went by another way and did not return by the way he had come to Bethel.
translation:
  language: zh_hans
  text: 于是，他从另一条路走了，没有从他来伯特利时所走的那条路返回。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: 于是，他……走了
  rationale: 未完成式动词前接叙事性 waw，推进事件顺序；“于是”自然表达前文命令所产生的后续行动。
- source_word: בְּדֶרֶךְ אַחֵר
  choice: 从另一条路
  rationale: דֶּרֶךְ 在此指道路或路线；“另一条路”保留与来路的鲜明对照。
- source_word: וְלֹא שָׁב
  choice: 没有……返回
  rationale: שׁוּב 在行程语境中意为返回或回去；“返回”简洁准确。
- source_word: בַּדֶּרֶךְ אֲשֶׁר בָּא בָהּ
  choice: 从他来……时所走的那条路
  rationale: 关系从句限定先前的来路；希伯来语 בָהּ 的阴性代词后缀回指 דֶּרֶךְ，汉语以“所走的那条路”自然体现。
- source_word: אֶל בֵּית אֵל
  choice: 来伯特利
  rationale: בֵּית אֵל 是地名 Bethel，按现代中文圣经通行译名译为“伯特利”；介词 אֶל 表明他先前来时的目的地。
