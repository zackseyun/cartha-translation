id: 1KI.13.33
reference: 1 Kings 13:33
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: אַחַר֙ הַ/דָּבָ֣ר הַ/זֶּ֔ה לֹֽא שָׁ֥ב יָרָבְעָ֖ם מִ/דַּרְכּ֣/וֹ הָ/רָעָ֑ה וַ֠/יָּשָׁב וַ/יַּ֜עַשׂ מִ/קְצ֤וֹת הָ/עָם֙ כֹּהֲנֵ֣י בָמ֔וֹת הֶֽ/חָפֵץ֙ יְמַלֵּ֣א אֶת יָד֔/וֹ וִ/יהִ֖י כֹּהֲנֵ֥י בָמֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/033.yaml
  text: After this event[a], Jeroboam did not turn from his evil way, but again made priests of high places from among all the people. Whoever desired it, he ordained him, and he became one of the priests of the high places.
translation:
  language: zh_hans
  text: 这事以后，耶罗波安仍没有离开他的恶道，反而又从民众中选立人为丘坛祭司。凡愿意的，他就任命谁为祭司[a]，那人便成为丘坛祭司之一。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“充满他的手”，这是希伯来语中使人就任或承接祭司职分的习语。
    reason: 保留祭司就职习语的字面形式及其含义。
lexical_decisions:
- source_word: אַחַר הַדָּבָר הַזֶּה
  choice: 这事以后
  rationale: דָּבָר在这里指前述事件；“这事以后”自然简明，也保留其可指事情或事件的宽度。
- source_word: לֹא שָׁב ... מִדַּרְכּוֹ הָרָעָה
  choice: 仍没有离开他的恶道
  rationale: שׁוּב与“从他的恶道”连用，表示转离。译作“离开”保留道路隐喻，避免直接采用解释性更强的“悔改”。“仍”承接前述警告与事件。
- source_word: וַיָּשָׁב וַיַּעַשׂ
  choice: 反而又……选立
  rationale: 第二个שׁוּב与后续动词连用，表示再次或继续采取行动；“又”传达重复，“反而”体现与前句否定所形成的转折。
- source_word: מִקְצוֹת הָעָם
  choice: 从民众中
  rationale: 该短语字面涉及“边缘、各端”，在此表示祭司取自一般民众，而非受限定的祭司群体。“从民众中”避免误译为社会地位最低的人，同时不把范围过度绝对化。
- source_word: כֹּהֲנֵי בָמוֹת
  choice: 丘坛祭司
  rationale: בָמוֹת指地方性的高处祭坛或敬拜场所。“丘坛”是简洁而具经文语体的对应表达，“丘坛祭司”自然呈现属格关系。
- source_word: הֶחָפֵץ
  choice: 凡愿意的
  rationale: 带冠词的单数分词具有泛指作用。“凡愿意的”保留任何有意者皆可的开放性，并不补入原文未明说的资格条件。
- source_word: יְמַלֵּא אֶת יָדוֹ
  choice: 他就授予谁圣职
  rationale: 字面为“充满他的手”，是使人就任祭司职分的习语。“授予圣职”在现代汉语中清楚传达其功能，字面形式则收入脚注。
- source_word: וִיהִי כֹּהֲנֵי בָמוֹת
  choice: 那人便成为丘坛祭司之一
  rationale: 希伯来文以单数动词配复数表语，表示某人进入这一群体；汉语用“之一”自然表达这种类别归属。
theological_decisions:
- issue: 是否把שׁוּב直接译为宗教术语“悔改”
  choice: 仍没有离开他的恶道
  alternative: 仍不悔改，离弃他的恶道
  rationale: 上下文确有道德和宗教意味，但原文以“转回／离开道路”的具体隐喻表达。正文保留这一隐喻，不用更具神学概括性的术语替代。
- issue: 如何处理祭司就职习语יְמַלֵּא אֶת יָדוֹ
  choice: 授予谁圣职
  alternative: 使谁承接圣职；充满谁的手
  rationale: 该习语表示使人就任或承接祭司职分。“授予圣职”让普通读者能够理解其功能，同时以脚注保留原文形象，避免把字面表达误认为一般祝福。
- issue: מִקְצוֹת הָעָם是否表示“最低阶层的人”或“各阶层的人”
  choice: 从民众中
  alternative: 从各等民众中；从民众中地位最低的人中
  rationale: 原短语的确切语感存在争议。上下文重点在于耶罗波安从普通民众中任命祭司，并且凡愿意者都可承职；正文采用不过度限定社会阶层的译法，以保存原文张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“恶道”保留希伯来文的道路隐喻；“丘坛祭司”延续列王纪宗教场所的传统称谓。脚注标记置于该祭司就职习语的对应译文之后，而非置于“这事以后”之后。
