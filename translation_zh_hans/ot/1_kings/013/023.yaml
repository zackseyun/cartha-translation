base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/023.yaml
  text: And it happened[a], after he had eaten bread and after he had drunk, that he saddled the donkey for him, for the prophet whom he had brought back.
translation:
  language: zh_hans
  text: 那位神人吃过饭、喝过以后，老先知就为那位被他带回来的先知给驴上了鞍。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “带回来”或译“使他返回”。
    reason: 保留שוב使役式较为直译的表达。
lexical_decisions:
- source_word: וַיְהִי
  choice: （以“……以后，……就……”体现）
  rationale: 这是叙事中的连续式，推进下一件事；现代汉语用时间从句配合“就”自然表达，无须生硬译作“事情发生了”。
- source_word: אַחֲרֵי אָכְלוֹ לֶחֶם
  choice: 吃过饭以后
  rationale: אַחֲרֵי加带后缀的不定词表示先后次序；לֶחֶם字面为“饼、食物”，此处按常见习语指用饭，译作“吃过饭”比“吃过饼”自然。
- source_word: וְאַחֲרֵי שְׁתוֹתוֹ
  choice: 喝过以后
  rationale: 与前一时间短语平行；原文没有说明所喝的是水还是酒，因此译文也不具体补出饮料。
- source_word: וַיַּחֲבָשׁ
  choice: 备好了
  rationale: חבש用于牲畜时指装上鞍具；汉语“备好了驴”自然表达把驴上好鞍、预备妥当。
- source_word: לוֹ
  choice: 为
  rationale: 介词ל在这里表示为另一人使用而备驴，译作“为”准确自然。
- source_word: הַחֲמוֹר
  choice: 驴
  rationale: חֲמוֹר的现代标准汉语对应词。
- source_word: לַנָּבִיא
  choice: 那位先知
  rationale: 原文此处明确使用נָבִיא“先知”，不应改成前文常用的称号“神人”。
- source_word: אֲשֶׁר הֱשִׁיבוֹ
  choice: 他带回来的
  rationale: שוב的使役式表示使人返回；结合上下文，“带回来”既自然，又保留了使役含义。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。为使代词所指清楚，依上下文将进食者称为“那位神人”，将备驴者称为“老先知”；同时在本节后半严格保留原文对前者使用的称呼“先知”。
