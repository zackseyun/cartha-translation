  text: So he went back with him and ate bread in his house and drank water[a].
translation:
  language: zh_hans
  text: 于是，神人跟他回去，在他家里吃了饼[a]，喝了水。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文作“吃饼”；这个说法也可泛指吃饭。这里保留“饼”，因为“饼”和“水”是上下文反复出现的重要词语。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב אִתּוֹ
  choice: 神人跟他回去
  rationale: שׁוב的叙事性未完成式表示返回这一已完成的动作；“跟他回去”自然表达同行返回。依据上下文补出“神人”，以避免汉语零主语造成指代不清。
- source_word: וַיֹּאכַל לֶחֶם
  choice: 吃了饼
  rationale: לֶחֶם可泛指食物或一餐，但本段反复提到不可吃饼、不可喝水，因此保留具体的“饼”，维持叙事中的关键词呼应。
- source_word: בְּבֵיתוֹ
  choice: 在他家里
  rationale: 直接表达地点；“他”按上下文指那位老先知，不在正文中额外解释。
- source_word: וַיֵּשְׁתְּ מָיִם
  choice: 喝了水
  rationale: 直译该动宾结构，并保留“水”这一与先前禁令相呼应的具体词语。
