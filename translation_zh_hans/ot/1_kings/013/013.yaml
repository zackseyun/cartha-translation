  text: And he said to his sons[a], “Saddle the donkey for me.” So they saddled the donkey for him, and he rode on it.
translation:
  language: zh_hans
  text: 他对儿子们说：“给我备好那头驴。”他们就给他备好了那头驴；他便骑上驴去了。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 他……说
  rationale: 以自然的汉语叙事承接上下文；不额外强化为明确的时间先后。
- source_word: בָּנָיו
  choice: 他的儿子们
  rationale: 原文为阳性复数，明确指他的众子，而非泛指儿女。
- source_word: חִבְשׁוּ לִי הַחֲמוֹר
  choice: 给我把驴备好
  rationale: חבש 在骑乘牲畜的语境中指装鞍、备妥；“把驴备好”是自然清楚的现代汉语，也涵盖备鞍以供骑乘之意。
- source_word: וַיַּחְבְּשׁוּ לוֹ הַחֲמוֹר
  choice: 他们就给他备好了驴
  rationale: 重复命令中的同一动词，并以“就”自然表达命令随后得到执行的叙事推进。
- source_word: וַיִּרְכַּב עָלָיו
  choice: 他便骑上去了
  rationale: רכב על 表示骑在牲畜上；汉语“骑上去”自然表达登上驴骑行，代词所指由上下文清楚确定。
