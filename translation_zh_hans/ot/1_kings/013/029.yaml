  text: וַ/יִּשָּׂ֨א הַ/נָּבִ֜יא אֶת נִבְלַ֧ת אִישׁ הָ/אֱלֹהִ֛ים וַ/יַּנִּחֵ֥/הוּ אֶֽל הַ/חֲמ֖וֹר וַ/יְשִׁיבֵ֑/הוּ וַ/יָּבֹ֗א אֶל עִיר֙ הַ/נָּבִ֣יא הַ/זָּקֵ֔ן לִ/סְפֹּ֖ד וּ/לְ/קָבְרֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/029.yaml
  text: Then the prophet lifted up the corpse of the man of God and laid it on the donkey and brought it back[a]. And he came to the city of the old prophet to mourn and to bury him.
translation:
  language: zh_hans
  text: 于是，那先知抬起神人的尸体，把他放在驴背上，带他回去。老先知回到自己的城里，为他哀悼[a]，并安葬他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“为他举哀”或“为他哀哭”。原文所用的词可特指为死者举行丧礼哀悼。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׂא
  choice: 抱起
  rationale: נשא在此表示抬起、负载尸体；“抱起”在现代汉语中自然地呈现将遗体抬放到驴背上的动作，又不限定必须由多人抬举。
- source_word: נִבְלַת אִישׁ הָאֱלֹהִים
  choice: 神人的尸体
  rationale: נבלה明确指死尸；“尸体”准确而庄重。“神人”保留 אִישׁ הָאֱלֹהִים 这一叙事中的固定称谓。
- source_word: וַיַּנִּחֵהוּ אֶל הַחֲמוֹר
  choice: 把他放在驴背上
  rationale: נוח的使役式在此意为放置；“驴背上”符合汉语对载运场景的自然表达。阳性宾语后缀可指已死的神人，因此用“他”维持其人格指称。
- source_word: וַיְשִׁיבֵהוּ
  choice: 带了回去
  rationale: שוב的使役式意为使其返回、带回；“带了回去”自然表达老先知把遗体运回城中的动作，同时保留“返回”的方向含义。
- source_word: וַיָּבֹא אֶל עִיר הַנָּבִיא הַזָּקֵן
  choice: 老先知回到自己的城里
  rationale: 原文直译为“他来到老先知的城”；主语按上下文仍是老先知。汉语若照字面容易误解为另一人来到老先知的城，因此明确为“老先知回到自己的城里”，不改变所指。
- source_word: לִסְפֹּד
  choice: 为他哀哭
  rationale: ספד指为死者哀悼，常包含出声哀哭或作哀歌；“哀哭”比泛称“哀悼”更保留该词在丧葬语境中的具体意味。
- source_word: וּלְקָבְרוֹ
  choice: 将他安葬
  rationale: קבר意为埋葬；“安葬”是现代汉语中庄重、自然的丧葬用语，宾语“他”指神人。
theological_decisions: []
