id: 1KI.13.1
reference: 1 Kings 13:1
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/הִנֵּ֣ה אִ֣ישׁ אֱלֹהִ֗ים בָּ֧א מִ/יהוּדָ֛ה בִּ/דְבַ֥ר יְהוָ֖ה אֶל בֵּֽית אֵ֑ל וְ/יָרָבְעָ֛ם עֹמֵ֥ד עַל הַ/מִּזְבֵּ֖חַ לְ/הַקְטִֽיר׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/001.yaml
  text: And behold[a], a man of God came from Judah to Bethel by the word of Yahweh[b], while Jeroboam was standing by the altar to burn incense.
translation:
  language: zh_hans
  text: 看哪，有一位神人奉雅威的话[a]从犹大来到伯特利。那时[b]，耶罗波安正站在祭坛旁，要烧香[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因雅威的话”或“照着雅威的话”。
    reason: 介词 בְּ 在这里可着重表达凭借、差遣依据或遵照。
  - marker: b
    text: 或译：“耶罗波安也正站在祭坛旁。”原文连接词可仅表示“而”或“并且”，不必明确译成同时发生的“那时”。
    reason: 保留希伯来语连接词与分词结构在句间关系上的歧义。
  - marker: c
    text: “烧香”也可较宽泛地译作“焚烧祭物，使其化为烟”。
    reason: הקטיר 在祭祀语境中可专指烧香，也可泛指把祭物焚烧成烟。
lexical_decisions:
- source_word: וְהִנֵּה
  choice: 看哪
  rationale: 保留叙事中的提示和引人注意功能，也维持原文突然把人物带入场景的生动感。
- source_word: אִישׁ אֱלֹהִים
  choice: 一位神人
  rationale: 直译这一固定称谓，不直接解释为“先知”，从而保留原文用语及其较宽的指涉范围。
- source_word: בִּדְבַר יְהוָה
  choice: 奉雅威的话
  rationale: 这里的介词短语表明此人因雅威的话而来，并受其差遣或授权；“奉……的话”在现代汉语中简洁自然。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以常见的现代汉语音译呈现四字神名，区别于称号“主”。
- source_word: אֶל בֵּית אֵל
  choice: 来到伯特利
  rationale: “伯特利”采用通行地名译法；结合移动动词，אֶל自然译出目的地。
- source_word: וְיָרָבְעָם עֹמֵד
  choice: 那时，耶罗波安正站着
  rationale: 分词表示当时持续的背景动作；“那时……正……”自然表达与神人到来的同时性，同时用脚注保留连接词也可仅作“而/并且”理解。
- source_word: עַל הַמִּזְבֵּחַ
  choice: 在祭坛旁
  rationale: עַל在此与“站”连用，宜表示在祭坛边或祭坛前，而非站在祭坛顶部。
- source_word: לְהַקְטִיר
  choice: 要烧香
  rationale: 该使役式动词在祭祀语境中指使祭物化为烟；本段语境通常具体理解为烧香。“要”表达不定式所说明的目的。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”较贴近学界普遍采用的拟音，也不把专名改写为“主”这一称号。
- issue: אִישׁ אֱלֹהִים 是否解释为先知
  choice: 神人
  alternative: 先知
  rationale: 此称谓在上下文中确实指承担神圣使命的人，但本节没有使用“先知”一词；保留“神人”可避免把解释直接写入正文。
- issue: בִּדְבַר יְהוָה 所表达的关系
  choice: 奉雅威的话
  alternative: 照着雅威的话
  rationale: 正文凸显神人受神的话差遣和授权，但脚注保留按所领受之话而行动的理解，不把介词的语义限制为单一类别。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“看哪”略带经文风格，用来保留原文的现场感；“神人”“祭坛”“烧香”均为普通读者熟悉的宗教叙事词汇。句子分为两句，使人物到来与耶罗波安当时的动作清楚呈现。
