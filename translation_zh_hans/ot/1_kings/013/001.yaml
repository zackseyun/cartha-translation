  source_fidelity: 正文准确呈现了 וְהִנֵּה 的提示语气、“神人”、从犹大到伯特利、奉雅威的话而来，以及耶罗波安持续站在祭坛旁并以烧香为目的的背景动作。将 עַל הַמִּזְבֵּחַ 译为“在祭坛旁”符合此处与“站立”搭配的自然空间含义，避免不必要地理解为站在祭坛顶部。
