  yaml_path: translation/ot/1_kings/013/028.yaml
  text: He went and found his corpse thrown on the road[a], with the donkey and the lion standing beside the corpse. The lion had not eaten the corpse[b], nor had it torn apart the donkey.
translation:
  language: zh_hans
  text: 他去后，发现那人的尸体被抛在路上[a]，驴和狮子站在尸体旁边。狮子没有吃那尸体，也没有撕碎那头驴[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “尸体”也可译作“尸身”或“尸骸”。希伯来语 נְבֵלָה 用词强烈，突出了那人确实已经死亡。
    reason: lexical_alternative
  - marker: b
    text: 希伯来语直译为“也没有折断那头驴”；这里是说狮子没有把驴撕裂或毁坏。
    reason: lexical_alternative
lexical_decisions:
- source_word: נִבְלָתוֹ / הַנְּבֵלָה
  choice: 那人的尸体 / 那尸体
  rationale: נְבֵלָה指死尸或尸骸。此处所指为人，用“尸体”自然、明确，也保留原文直面死亡的强烈语气；首次加“那人的”使中文指代清楚。
- source_word: מֻשְׁלֶכֶת
  choice: 被抛
  rationale: 这是שלך的被动分词，表示尸体被扔下或抛置在那里；“被抛”比单说“躺着”更能保留原文力度。
- source_word: בַּדֶּרֶךְ
  choice: 在路上
  rationale: דֶּרֶךְ在这里指道路；“在路上”是现代汉语中自然且符合场景的表达。
- source_word: עֹמְדִים אֵצֶל
  choice: 站在……旁边
  rationale: 分词与介词共同描绘驴和狮子停立在尸体近旁，保留原文醒目的静止画面。
- source_word: לֹא אָכַל
  choice: 没有吃
  rationale: אָכַל是普通的“吃”，不宜强化为“吞吃”或“吞噬”；中文“没有吃”也自然表达老人到场时看到的结果。
- source_word: שָׁבַר אֶת הַחֲמוֹר
  choice: 撕碎那头驴
  rationale: שׁבר字面为“打破、折断”；以驴为宾语且施事为狮子时，语境所指是把驴咬伤、撕裂或毁坏。“撕碎”在中文中自然地传达这一形象，同时脚注保留字面信息。
- source_word: וַיֵּלֶךְ וַיִּמְצָא
  choice: 他去了，看见
  rationale: 两个连续叙事动词表示行动推进。מצא在此为到达后发现眼前景象；“去了，看见”符合现代汉语叙事习惯，且不增添原文没有的信息。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“那人的尸体”避免中文开头代词所指含混；第二次简化为“那尸体”。保留驴和狮子同时站在尸体旁的反常画面，不对其神学意义作解释。
