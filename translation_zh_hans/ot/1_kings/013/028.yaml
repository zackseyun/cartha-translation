  to: 他去后，发现那人的尸体被抛在路上[a]，驴和狮子站在尸体旁边。狮子没有吃那尸体，也没有撕碎那头驴[b]。
  rationale: 将“他去了，看见”改为“他去后，发现”，以更准确、自然地表达连续叙事中“去”和“发现”的关系。修订脚注b，使其对 שָׁבַר 的语境说明与正文力度一致，并避免把意思限于较弱的“咬伤”。
