  text: וַ/יֹּ֤אמֶר אִישׁ הָֽ/אֱלֹהִים֙ אֶל הַ/מֶּ֔לֶךְ אִם תִּתֶּן לִ/י֙ אֶת חֲצִ֣י בֵיתֶ֔/ךָ לֹ֥א אָבֹ֖א עִמָּ֑/ךְ וְ/לֹֽא אֹ֤כַל לֶ֨חֶם֙ וְ/לֹ֣א אֶשְׁתֶּה מַּ֔יִם בַּ/מָּק֖וֹם הַ/זֶּֽה־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/008.yaml
  text: But the man of God said to the king[a], “If you were to give me half your house, I would not go with you, nor would I eat bread or drink water in this place.”
translation:
  language: zh_hans
  text: 神人对王说：“即使你把你家的一半给我[a]，我也不会跟你去，也不会在这地方吃饼喝水。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “你家的一半”也可理解为“你一半的家业”或“一半产业”；希伯来原文直译为“你家的一半”。
    reason: 保留בַּיִת在“房屋、家庭、家业、产业”之间的语义幅度，同时说明此处可能指王所能给予的巨额财产。
lexical_decisions:
- source_word: אִישׁ הָאֱלֹהִים
  choice: 神人
  rationale: 这是希伯来语对奉上帝差遣之人的固定称呼；“神人”简洁保留原文表达，不将其解释性地改为“先知”。
- source_word: אִם תִּתֶּן לִי אֶת חֲצִי בֵיתֶךָ
  choice: 即使你把你家的一半给我
  rationale: 保留“你家的一半”这一原文意象，并以“即使……也……”自然表达带有强烈拒绝意味的条件句。此处“家”可能涵盖住宅、家业或产业，译文不在正文中限定其范围。
- source_word: לֹא אָבֹא עִמָּךְ
  choice: 我也不会跟你去
  rationale: 动词字面为“来”，但在王邀请神人与自己同行的语境中，现代汉语用“跟你去”更自然；“不会”与前面的假设条件相配。
- source_word: לֹא אֹכַל לֶחֶם
  choice: 也不会……吃饼
  rationale: לֶחֶם可泛指食物或一餐，但“饼”保留其基本词义和希伯来叙事的具体措辞，在上下文中仍易理解。
- source_word: לֹא אֶשְׁתֶּה מַּיִם
  choice: 喝水
  rationale: 按原文直译，并与“吃饼”组成自然、紧凑的并列结构。
- source_word: בַּמָּקוֹם הַזֶּה
  choice: 在这地方
  rationale: 贴近原文并保留指示语“这”的强调，比单译“这里”更具原文色彩。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“神人”保留固定的圣经称谓；“即使……也不会……”清楚传达坚决拒绝。“吃饼喝水”保留原文的具体表达和节奏。
