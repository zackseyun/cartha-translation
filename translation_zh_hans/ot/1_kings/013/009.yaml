base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/009.yaml
  text: For this is what he commanded me by the word of the LORD, saying, ‘You shall not eat bread, nor drink water, nor return by the way that you went.’
translation:
  language: zh_hans
  text: 因为耶和华的话曾这样吩咐我说：‘你不可吃饼，也不可喝水，也不可从你来时所走的路返回。’
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי כֵן
  choice: 因为……这样
  rationale: כִּי承接上文说明原因，כֵן指向随后引述的具体命令；此译法自然保留因果和指示作用。
- source_word: בִּדְבַר יְהוָה
  choice: 借着耶和华的话
  rationale: 保留介词所表达的媒介意味，并将神名יהוה音译为现代中文圣经读者熟悉的“耶和华”。
- source_word: לֶחֶם
  choice: 饼
  rationale: 在本节饮食禁令的语境中指作为食物的饼，也可泛指食物；“饼”较贴近原词且与“水”形成对应。
- source_word: תָשׁוּב
  choice: 返回
  rationale: 准确表达שׁוב的返回之意。
- source_word: בַּדֶּרֶךְ אֲשֶׁר הָלָכְתָּ
  choice: 从你来时所走的路
  rationale: 原文直指“你所走的那条路”；结合返回动作，中文如此表达可清楚说明不可沿原路折返，同时不把动词误译成“来”。
theological_decisions:
- issue: 命令的来源与传达方式
  choice: “耶和华曾借着他的话这样吩咐我”
  alternative: “耶和华的话这样吩咐我”
  rationale: 原文主语隐含于第三人称单数动词“他吩咐”，而“借着耶和华的话”说明命令的媒介；译文保留二者，不将“话”改作拟人化主语。
- issue: 神名יהוה的呈现
  choice: 耶和华
  alternative: 上主
  rationale: 采用现代简体中文圣经传统中广为人知的专名形式，明确对应四字神名，同时不加入宗派性解释。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。引语中的三个禁令以分号分隔，使节奏清楚；不添加原文没有的解释性信息。
