base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/014.yaml
  text: So he went after the man of God and found him sitting under the terebinth[a], and he said to him, “Are you the man of God who came from Judah?” And he said, “I am.”
translation:
  language: zh_hans
  text: 于是，他去追那神人，找到他时，他正坐在笃耨香树下[a]。他就对他说：“你是从犹大来的那位神人吗？”他说：“是我。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“在橡树下”。希伯来语אֵלָה更具体地指笃耨香树。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ אַחֲרֵי
  choice: 追赶
  rationale: 该短语表示在某人之后追去；结合上下文，这位老先知是在寻找并赶上神人。“追赶”既保留行动方向，也自然体现此处的追寻语境。
- source_word: אִישׁ הָאֱלֹהִים
  choice: 神人
  rationale: 这是本段反复使用的固定称谓。译作“神人”直接保留原文表达，不将其解释性地窄化为“神的先知”。
- source_word: וַיִּמְצָאֵהוּ
  choice: 发现他
  rationale: מצא在叙事中通常表示“找到、发现”。此处“发现他”自然地引出随后所见的坐姿和地点。
- source_word: יֹשֵׁב
  choice: 坐着／坐在
  rationale: 分词描述神人被发现时的姿势；在地点短语前译作“坐在”最符合现代汉语。
- source_word: תַּחַת הָאֵלָה
  choice: 在笃耨香树下
  rationale: אֵלָה较具体地指笃耨香树（terebinth），并非笼统的“大树”；正文采用较精确的树名，同时以脚注提示传统上的另一译法。
- source_word: הַאַתָּה
  choice: 你是……吗
  rationale: 疑问词与第二人称代词构成身份确认问句，现代汉语自然表达为“你是……吗”。
- source_word: אֲשֶׁר בָּאתָ מִיהוּדָה
  choice: 从犹大来的那位
  rationale: 关系从句用来辨认此人的身份；“从犹大来的那位”准确表达来源，也使整句汉语流畅。
- source_word: אָנִי
  choice: 是我
  rationale: 原文是省略谓语的简短回答“我”。针对前面的身份问句，汉语以“是我”表达最自然，并保留回答的简洁。
theological_decisions:
- issue: אִישׁ הָאֱלֹהִים作为称谓的译法
  choice: 神人
  alternative: 神的先知
  rationale: “神人”直接对应原文的固定称谓，并与上下文保持一致；“神的先知”虽可解释其身份，却加入了原文此处没有明说的职分称号。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“神人”保留希伯来叙事中的固定称谓；“笃耨香树”虽不常见，但较准确，故以脚注补充常见的传统译法。
