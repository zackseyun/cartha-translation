  rationale: 修订仅处理“追赶”和“发现”两处的语义力度与汉语自然度。“去追”准确表达去到对方后面、追寻对方的行动，而不附加追捕意味；“找到他时，他正坐在”自然表达“找到他，见他正坐着”的希伯来叙事结构。保留“神人”“犹大”“笃耨香树”、身份问句和简短答语，以维持术语一致及原文的叙事简洁。
