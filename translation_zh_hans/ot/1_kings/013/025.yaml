base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/025.yaml
  text: And behold[a], men were passing by and saw the corpse thrown on the road, and the lion standing beside the corpse; and they came and reported it in the city where the old prophet lived.
translation:
  language: zh_hans
  text: 看哪，有些人正经过，看见尸体被丢在路上，狮子站在尸体旁边。他们就来到那位老先知所住的城里，报告了这件事。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在城里说起了这件事。”希伯来文动词本义只是“说”，但这里的语境表明，他们是在传报所看见的事。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: 看哪
  rationale: 保留希伯来叙事中引人注意、突出眼前突发情景的标记，同时采用现代中文圣经语体中清楚而庄重的表达。
- source_word: אֲנָשִׁים עֹבְרִים
  choice: 有些人正从那里经过
  rationale: אֲנָשִׁים在此泛指一群路人；分词עֹבְרִים表示正在进行的动作，因此译作“正……经过”。“从那里”按场景补足中文所需的空间指向，不增加新的事件内容。
- source_word: וַיִּרְאוּ
  choice: 看见
  rationale: 采用动词的普通视觉义，保持简洁的叙事推进。
- source_word: הַנְּבֵלָה
  choice: 尸体
  rationale: 上下文明确所指是死去的人，用“尸体”准确、简洁，也避免“尸首”较陈旧的语感。
- source_word: מֻשְׁלֶכֶת בַּדֶּרֶךְ
  choice: 被丢在路上
  rationale: 保留שלך被动分词所表达的“被抛下、被丢置”之力，不弱化为仅仅“躺在”。
- source_word: הָאַרְיֵה עֹמֵד אֵצֶל הַנְּבֵלָה
  choice: 狮子站在尸体旁边
  rationale: 直接呈现עֹמֵד与אֵצֶל所表达的姿态和相邻位置，画面清楚自然。
- source_word: וַיָּבֹאוּ
  choice: 他们就来到
  rationale: 按希伯来叙事顺序表达随后发生的移动；“就”自然承接他们目睹现场之后的行动。
- source_word: וַיְדַבְּרוּ בָעִיר
  choice: 在城里报告了这件事
  rationale: דבר字面是“说”，此处语境是把所见事件告诉城中人；“报告了这件事”以自然中文补明隐含宾语，同时用脚注保留较贴近字面的可能译法。
- source_word: אֲשֶׁר הַנָּבִיא הַזָּקֵן יֹשֵׁב בָּהּ
  choice: 那位老先知所住的城里
  rationale: יֹשֵׁב בָּהּ在此表示居住；关系从句转换为自然的中文定语结构，并保留“老先知”的称谓。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事中文。“看哪”保留原文的话语提示功能；其余句式避免过度古雅。脚注标记置于“报告了这件事”之后，因为脚注所说明的是וַיְדַבְּרוּ的译法，而不是句首的וְהִנֵּה。
