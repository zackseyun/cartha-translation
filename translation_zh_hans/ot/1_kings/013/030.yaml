base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/030.yaml
  text: And he laid his corpse in his own tomb[a], and they mourned over him, saying, “Alas[b], my brother!”
translation:
  language: zh_hans
  text: 他把那人的遗体安放在自己的坟墓里；他们为他哀悼[a]，说：“哀哉，我的兄弟啊！”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “哀悼”所译的希伯来语指为死者哀悼，常包括正式的哀歌或哭丧。
    reason: lexical_note
  - marker: b
    text: “我的兄弟”很可能是哀歌中的惯用称呼，表达亲近、认同或同道情谊，不一定表示二人是亲生兄弟。
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּנַּח
  choice: 安放
  rationale: 使役形在这里表示把某物放置下来；“安放”自然贴合入葬语境，也保留庄重语气。
- source_word: נִבְלָתוֹ
  choice: 那人的尸身
  rationale: נְבֵלָה指死去的躯体。“尸身”明确表达死亡事实，比“尸体”略显庄重；加“那人的”可避免现代汉语将连续两个“他的”误解为同一所指。
- source_word: בְּקִבְרוֹ
  choice: 在自己的坟墓里
  rationale: קֶבֶר可指坟墓或墓穴；按本节主语和上下文，后缀指老先知本人的坟墓。现代汉语用“自己的”清楚表达这一关系。
- source_word: וַיִּסְפְּדוּ
  choice: 众人……举哀
  rationale: ספד指为死者哀悼，常含正式哀歌或丧礼性的举哀。“举哀”既保留其丧葬语境，也能自然引出后面的哀叹语。
- source_word: עָלָיו
  choice: 为他
  rationale: עַל与ספד连用表示为某人哀悼；汉语“为他举哀”比直译“在他之上”自然准确。
- source_word: הוֹי
  choice: 哀哉
  rationale: הוֹי是表达悲痛的感叹词。在此为丧葬哀叹，并非宣告审判；“哀哉”保留庄重而强烈的悲声。
- source_word: אָחִי
  choice: 我的兄弟
  rationale: אָח字面义为“兄弟”，此处也可能是哀歌中表达亲近或同道情谊的称呼；直译可保留其情感力度与关系含义。
