source:
  edition: WLC
  text: וַ/יִּקְרָ֤א עַל הַ/מִּזְבֵּ֨חַ֙ בִּ/דְבַ֣ר יְהוָ֔ה וַ/יֹּ֨אמֶר֙ מִזְבֵּ֣חַ מִזְבֵּ֔חַ כֹּ֖ה אָמַ֣ר יְהוָ֑ה הִנֵּֽה בֵ֞ן נוֹלָ֤ד לְ/בֵית דָּוִד֙ יֹאשִׁיָּ֣הוּ שְׁמ֔/וֹ וְ/זָבַ֣ח עָלֶ֗י/ךָ אֶת כֹּהֲנֵ֤י הַ/בָּמוֹת֙ הַ/מַּקְטִרִ֣ים עָלֶ֔י/ךָ וְ/עַצְמ֥וֹת אָדָ֖ם יִשְׂרְפ֥וּ עָלֶֽי/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/002.yaml
  text: 'And he cried out against the altar by the word of Yahweh and said[a], “Altar, altar, thus says Yahweh: Behold, a son will be born to the house of David, Josiah by name, and he will sacrifice on you the priests of the high places who burn incense on you[c][b], and human bones will be burned on you.”'
translation:
  language: zh_hans
  text: 他照着耶和华的话[a]向祭坛呼喊，说：“祭坛啊，祭坛！耶和华如此说：看哪，大卫家必有一个儿子出生，名叫约西亚。他必在你上面宰杀[b]那些在你上面烧香的丘坛祭司；也必有人骨在你上面被焚烧。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “照着耶和华的话”也可译作“奉耶和华的话”或“凭耶和华的话”。
    reason: 原文介词短语可表示遵照、授权或凭借。
  - marker: b
    text: “宰杀”也可译作“献祭”。原文动词带有祭祀意味，可能刻意突出这座祭坛将受亵渎。
    reason: 保留 זבח 在祭献与宰杀之间的词义张力。
lexical_decisions:
- source_word: וַיִּקְרָא עַל הַמִּזְבֵּחַ
  choice: 向祭坛呼喊
  rationale: 保留 קרא 的高声宣告语气；介词 עַל 在此带有针对、反对祭坛的意味。中文“向……呼喊”自然，而预言内容本身清楚表达审判指向。
- source_word: בִּדְבַר יְהוָה
  choice: 奉耶和华的话
  rationale: 表达先知行动出于耶和华的授权和差遣，同时保留“凭着／按照”的可能含义，另以脚注说明。
- source_word: מִזְבֵּחַ מִזְבֵּחַ
  choice: 祭坛啊，祭坛
  rationale: 保留重复呼语及庄严、强烈的先知宣告语气。
- source_word: כֹּה אָמַר יְהוָה
  choice: 耶和华如此说
  rationale: 准确保留标准的先知使者公式，语言庄重且易懂。
- source_word: הִנֵּה
  choice: 看哪
  rationale: 保留引人注意和庄严宣告的功能。
- source_word: בֵן נוֹלָד לְבֵית דָּוִד
  choice: 大卫家将生一个儿子
  rationale: 将形式上的被动分词按预言语境自然表达为将来事件；“大卫家”保留王朝与家族双重意涵。
- source_word: יֹאשִׁיָּהוּ שְׁמוֹ
  choice: 名叫约西亚
  rationale: 自然、简洁地传达希伯来文命名结构的明确性。
- source_word: וְזָבַח עָלֶיךָ
  choice: 他必在你上面献杀
  rationale: זבח 同时具有宰杀和祭献色彩；“献杀”虽较凝练，却能保留将祭司当作祭牲宰杀所形成的礼仪反讽与祭坛受辱意味。
- source_word: כֹּהֲנֵי הַבָּמוֹת
  choice: 丘坛祭司
  rationale: במות 指地方性敬拜设施或高处祭坛；“丘坛”是《列王纪》语境中准确而简洁的表达。
- source_word: הַמַּקְטִרִים עָלֶיךָ
  choice: 那些在你上面烧香的
  rationale: 按 קטר Hiphil 的常见礼仪用法译为“烧香”；它也可能广指使祭物冒烟，但此处译法清楚自然。
- source_word: וְעַצְמוֹת אָדָם
  choice: 人的骨头
  rationale: אָדָם 在此为泛指人类，不限定男性；“人的骨头”符合现代汉语，并保留原文简洁结构。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 中文普通读者最熟悉“耶和华”，且它明确作为专名出现，不以“主”替代原文的圣名。
- issue: זבח 用于丘坛祭司所形成的祭祀性反讽
  choice: 献杀
  alternative: 宰杀
  rationale: 原词不只是一般杀害，也带祭牲宰献色彩；保留这一语义可呈现以丘坛祭司亵毁该祭坛的审判张力，不把它弱化为普通处决。
- issue: אָדָם 的泛指范围
  choice: 人
  alternative: 男人
  rationale: 此处指人类的骨头，并无男性限定；因此不用“男人”，避免加入原文没有的性别限制。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言；保留“祭坛啊，祭坛”“耶和华如此说”“看哪”等先知宣告的修辞力度。以“丘坛”呈现《列王纪》的礼仪文化背景，并用脚注保存关键介词短语和 זבח 的真实歧义。
