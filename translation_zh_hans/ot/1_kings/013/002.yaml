  to: 他照着耶和华的话[a]向祭坛呼喊，说：“祭坛啊，祭坛！耶和华如此说：看哪，大卫家必有一个儿子出生，名叫约西亚。他必在你上面宰杀[b]那些在你上面烧香的丘坛祭司；也必有人骨在你上面被焚烧。”
