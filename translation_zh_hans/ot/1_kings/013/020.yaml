source:
  edition: WLC
  text: וַ/יְהִ֕י הֵ֥ם יֹשְׁבִ֖ים אֶל הַ/שֻּׁלְחָ֑ן וַֽ/יְהִי֙ דְּבַר יְהוָ֔ה אֶל הַ/נָּבִ֖יא אֲשֶׁ֥ר הֱשִׁיבֽ/וֹ־פ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/020.yaml
  text: And it happened, as they were sitting at the table, that the word of Yahweh came to the prophet who had brought him back.
translation:
  language: zh_hans
  text: 他们正坐在桌旁的时候，耶和华的话临到那位把他带回来的先知。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: ……的时候
  rationale: 此处叙事式连接结构与后面的分词性从句合用，引出同时发生的新事件；汉语以“……的时候”自然表达，不必机械译出“事情发生了”。
- source_word: הֵם יֹשְׁבִים
  choice: 他们正坐
  rationale: 独立代词加分词表示持续中的状态；“正坐”保留进行意味。
- source_word: אֶל הַשֻּׁלְחָן
  choice: 在桌旁
  rationale: אֶל 字面有“向、到”之意，但与“坐”和“桌子”连用时表示就席的位置；“在桌旁”符合现代汉语习惯。
- source_word: דְּבַר יְהוָה
  choice: 耶和华的话
  rationale: 保留标准先知启示用语的构造关系，并直接音译圣名。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代简体中文圣经语境中最通行、辨识度最高的四字神名译法。
- source_word: אֶל הַנָּבִיא
  choice: 临到……先知
  rationale: 在“耶和华的话”这一启示公式中，汉语惯用“临到”标明启示的领受者。
- source_word: אֲשֶׁר הֱשִׁיבוֹ
  choice: 那位把他带回来的
  rationale: שׁוב 的使役形带第三人称阳性单数宾语后缀，表示该先知使“他”返回；“把他带回来”自然保留使役含义及代词指向。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文明确使用四字神名。正文不以“主”替代，以保留专名功能；采用普通现代中文读者最熟悉的“耶和华”，同时不借此裁定古代发音的全部细节。
- issue: 领受耶和华话语的先知身份
  choice: 那位把他带回来的先知
  alternative: 神人本人
  rationale: 关系从句 אֲשֶׁר הֱשִׁיבוֹ 修饰“先知”，依上下文指把神人带回家的老先知。译文保留原文称谓，不增添“老”字，也不消解叙事中神的话临到这位先知所形成的张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。句式保持紧凑，使用“正……的时候”呈现背景动作，以“耶和华的话临到”保留先知叙事的固定表达。
