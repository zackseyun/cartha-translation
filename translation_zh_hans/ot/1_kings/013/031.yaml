base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/031.yaml
  text: And it happened, after he had buried him, that he said to his sons, “When I die, bury me in the tomb where the man of God is buried; lay my bones beside his bones.”
translation:
  language: zh_hans
  text: 他安葬了那神人以后，就对自己的儿子们说：“我死后，你们要把我葬在那神人埋葬在其中的坟墓里，把我的骸骨安放在他的骸骨旁边。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי אַחֲרֵי קָבְרוֹ אֹתוֹ
  choice: 他安葬了那神人以后
  rationale: 将叙事公式与时间短语合并为自然的现代汉语；按上文明确“他”所安葬的是神人，以避免连续代词造成歧义。
- source_word: בָּנָיו
  choice: 自己的儿子们
  rationale: 保留希伯来文所指的男性复数“儿子”，并用“自己的”清楚标明所属关系。
- source_word: בְּמוֹתִי
  choice: 我死后
  rationale: 自然表达预期发生的死亡及其后的安葬安排；与“我死的时候”相比，更符合下文动作的时间关系。
- source_word: וּקְבַרְתֶּם אֹתִי
  choice: 你们要把我葬
  rationale: 在遗嘱式吩咐中，用“要”传达该完成式所具有的指令语气。
- source_word: בַּקֶּבֶר
  choice: 坟墓
  rationale: 指可安放多人骸骨的具体墓穴；“坟墓”在现代汉语中自然、庄重。
- source_word: אִישׁ הָאֱלֹהִים
  choice: 神人
  rationale: 采用《列王纪》叙事中这一固定称谓的简洁直译，不将其缩窄解释为“先知”。
- source_word: עַצְמֹתָיו ... עַצְמֹתָי
  choice: 他的骸骨……我的骸骨
  rationale: 保留原文具体的“骨头”意象，同时“骸骨”更适合庄重的埋葬语境。
- source_word: הַנִּיחוּ ... אֵצֶל
  choice: 安放在……旁边
  rationale: “安放”准确传达命令式“放置”，语体庄重；“旁边”保留空间上的紧邻关系。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“神人”作为本段固定称谓保持一致；不添加原文没有的神学解释。句首不机械译出וַיְהִי为“事情发生了”，而将其叙事推进功能自然融入时间从句。
