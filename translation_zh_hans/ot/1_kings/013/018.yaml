source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר ל֗/וֹ גַּם אֲנִ֣י נָבִיא֮ כָּמוֹ/ךָ֒ וּ/מַלְאָ֡ךְ דִּבֶּ֣ר אֵלַ/י֩ בִּ/דְבַ֨ר יְהוָ֜ה לֵ/אמֹ֗ר הֲשִׁבֵ֤/הוּ אִתְּ/ךָ֙ אֶל בֵּיתֶ֔/ךָ וְ/יֹ֥אכַל לֶ֖חֶם וְ/יֵ֣שְׁתְּ מָ֑יִם כִּחֵ֖שׁ לֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/018.yaml
  text: And he said to him[a], “I also am a prophet like you, and an angel spoke to me by the word of Yahweh, saying, ‘Bring him back with you to your house, that he may eat bread and drink water.’” But he lied to him.
translation:
  language: zh_hans
  text: 他对那人说：“我也和你一样是先知。一位天使[a]奉雅威的话对我说：‘带他跟你一起回你家，让他吃饼、喝水。’”他却对那人说了谎。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“使者”。希伯来语这个词既可指“天使”，也可指一般的“使者”。
    reason: 保留 מַלְאָךְ 的词义歧义。
lexical_decisions:
- source_word: נָבִיא
  choice: 先知
  rationale: 这是现代汉语中对受神差遣传话之人的标准译法，符合本段叙事语境。
- source_word: מַלְאָךְ
  choice: 天使
  rationale: 该词可指属天的“天使”，也可泛指“使者”；此处老先知声称信息来自耶和华，正文采用“天使”，并以脚注保留词义上的另一可能。
- source_word: דִּבֶּר אֵלַי
  choice: 对我说
  rationale: 自然、清楚地表达直接传话，在引出所传内容时比“向我讲话”更符合现代汉语。
- source_word: בִּדְבַר יְהוָה
  choice: 奉耶和华的话
  rationale: 保留介词的凭借或授权意味及先知性表达；不把这句话误解为天使就是“耶和华的话”。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代简体中文圣经语体中广为人知的专名形式，明确呈现原文的神名。
- source_word: הֲשִׁבֵהוּ
  choice: 把他……带回
  rationale: 准确表达使役形所含的“使他返回”之意，同时符合汉语叙事习惯。
- source_word: אִתְּךָ אֶל־בֵּיתֶךָ
  choice: 同你一起……回你家
  rationale: 保留同行者和目的地两方面的信息，并按自然汉语语序组合。
- source_word: וְיֹאכַל לֶחֶם
  choice: 让他吃饼
  rationale: 将命令之后的未完成式理解为目的或许可，并保留“饼”这一具体意象，不泛化为“食物”。
- source_word: וְיֵשְׁתְּ מָיִם
  choice: 喝水
  rationale: 与“吃饼”并列，简洁保留原文的饮水动作。
- source_word: כִּחֵשׁ לוֹ
  choice: 其实，他是在欺骗那人
  rationale: 该动词表示对人说假话或施行欺骗；“其实”清楚标示叙述者对前述宣称的揭露，“那人”也避免连续代词造成指代不清。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。正文保留专名而不以“主”替代；“耶和华”在现代中文读者中辨识度高，同时不改变本节的叙事和神学张力。
- issue: מַלְאָךְ 是“天使”还是一般“使者”
  choice: 天使
  alternative: 使者
  rationale: 语境中的说话者声称获得来自神的超自然启示，因此正文采用“天使”；但希伯来词本身并未在词形上排除普通使者，故以脚注保留歧义。
- issue: 老先知所称启示的真实性
  choice: 以叙述者的话明确指出他在欺骗对方
  alternative: 仅译作“他对他说了谎”
  rationale: 原文末句揭露前述话语为虚假，却没有解释他的动机或谎言的具体机制；译文不进一步作神学推断。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“吃饼、喝水”保留希伯来叙事的具体表达；以“那人”消除末句代词歧义。正文中的脚注标记[a]与脚注对应。
