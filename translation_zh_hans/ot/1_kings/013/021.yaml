  text: וַ/יִּקְרָ֞א אֶל אִ֣ישׁ הָ/אֱלֹהִ֗ים אֲשֶׁר בָּ֤א מִֽ/יהוּדָה֙ לֵ/אמֹ֔ר כֹּ֖ה אָמַ֣ר יְהוָ֑ה יַ֗עַן כִּ֤י מָרִ֨יתָ֙ פִּ֣י יְהוָ֔ה וְ/לֹ֤א שָׁמַ֨רְתָּ֙ אֶת הַ/מִּצְוָ֔ה אֲשֶׁ֥ר צִוְּ/ךָ֖ יְהוָ֥ה אֱלֹהֶֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/021.yaml
  text: 'And he cried out to the man of God who had come from Judah[a], saying, “Thus says Yahweh: Because you have rebelled against the word of Yahweh and have not kept the command that Yahweh your God commanded you,”'
translation:
  language: zh_hans
  text: 他向那位从犹大来的神人高声呼喊说：“耶和华如此说：因为你违抗了耶和华亲口所说的话[a]，没有遵守耶和华你的神吩咐你的命令，”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“耶和华的口”，意思是耶和华亲自说出的话。
    reason: 说明希伯来习语并保留其字面意象。
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: 高声宣告
  rationale: קרא可指呼叫、宣告或高声说；在先知性谴责的语境中，“高声宣告”既体现力度，也保留传达信息的意味。
- source_word: אִישׁ הָאֱלֹהִים
  choice: 神人
  rationale: 这是希伯来文中的固定称谓；“神人”简洁保留原文形式，不将其解释性改写为“先知”。
- source_word: כֹּה אָמַר יְהוָה
  choice: 耶和华如此说
  rationale: 保留先知传信公式的庄重和直接性，并将神名译作“耶和华”。
- source_word: מָרִיתָ
  choice: 违抗了
  rationale: מרה表达反抗、悖逆或公然不服从；“违抗”比一般的“没有听从”更有力度，同时在现代汉语中自然。
- source_word: פִּי יְהוָה
  choice: 耶和华亲口所说的话
  rationale: 原文直译为“耶和华的口”，指耶和华亲自说出的言语；正文采用自然汉语，并以脚注保留其字面意象。
- source_word: שָׁמַרְתָּ
  choice: 遵守
  rationale: שמר与命令连用时通常表示谨守、遵行；“遵守”是现代汉语中准确自然的对应表达。
- source_word: הַמִּצְוָה
  choice: 命令
  rationale: 原文为单数，指具体吩咐；“命令”较“诫命”更不易让读者误解为固定法典条文。
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: 耶和华你的神
  rationale: 直接保留原文的盟约性称谓和第二人称所属关系。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: “耶和华”是现代简体中文圣经语境中广为人知的专名形式，正文以专名而非“主”这一称号来呈现四字神名。
- issue: מָרִיתָ所表达的罪责强度
  choice: 违抗了
  alternative: 悖逆了；没有听从
  rationale: 原词强于一般未能服从，含有反抗意味；“违抗”保留其严肃性，又避免额外加入特定神学体系的术语色彩。
- issue: פִּי יְהוָה的处理
  choice: 耶和华亲口所说的话
  alternative: 耶和华的口；耶和华的话
  rationale: 既表达希伯来习语所指的神之言语，也借“亲口”保留原文“口”的具体意象，而不把它缩窄成另一处“命令”的同义复述。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“高声宣告”体现先知性发言的力度；引文在本节末尚未完结，因此保留未完成的句法和引号结构，与下一节相接。
