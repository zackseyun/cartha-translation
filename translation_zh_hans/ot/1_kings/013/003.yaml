  text: וְ/נָתַן֩ בַּ/יּ֨וֹם הַ/ה֤וּא מוֹפֵת֙ לֵ/אמֹ֔ר זֶ֣ה הַ/מּוֹפֵ֔ת אֲשֶׁ֖ר דִּבֶּ֣ר יְהוָ֑ה הִנֵּ֤ה הַ/מִּזְבֵּ֨חַ֙ נִקְרָ֔ע וְ/נִשְׁפַּ֖ךְ הַ/דֶּ֥שֶׁן אֲשֶׁר עָלָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/003.yaml
  text: 'And on that day he gave a sign[a], saying, “This is the sign that Yahweh has spoken: behold, the altar will be torn apart[b], and the ashes that are on it will be poured out.”'
translation:
  language: zh_hans
  text: 那一天，他给出一个征兆[a]，说：“这就是雅威所说的征兆：看哪，祭坛必裂开，坛上的灰烬[b]必倾倒出来。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “征兆”也可译作“奇事”或“预兆”（希伯来文 מוֹפֵת）。
    reason: lexical_alternative
  - marker: b
    text: 这里译作“灰烬”的希伯来词，在献祭语境中也可更具体指祭牲焚烧后含有脂油的灰烬。
    reason: cultural_note
lexical_decisions:
- source_word: וְנָתַן
  choice: 他给了
  rationale: 保留 נתן“给、置下”的基本意义；与“兆头”连用，在本段指先知给出一个证实其话语的征兆。
- source_word: מוֹפֵת
  choice: 兆头
  rationale: מוֹפֵת 可指征兆、奇事或预兆；此处重点是用来印证预言的可见事件，“兆头”既自然又保留其预示和印证作用。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文四字神名 יהוה 作音译，保留其作为以色列之上帝专名的性质，而不以称号替代。
- source_word: הִנֵּה
  choice: 看哪
  rationale: 保留先知宣告中引人注意、强调即将发生之事的指示语气，并维持庄重语体。
- source_word: נִקְרָע
  choice: 必裂开
  rationale: קרע 的尼法勒形表达被撕裂或裂开的结果；用于祭坛时，“裂开”比“撕开”更符合现代汉语搭配。上下文是预告兆头，故用“必”。
- source_word: וְנִשְׁפַּךְ
  choice: 必倾倒出来
  rationale: שׁפך 的尼法勒形表示被倒出、流出或洒出；此处描述灰烬从祭坛上倒落，“倾倒出来”清楚自然。
- source_word: הַדֶּשֶׁן
  choice: 灰烬
  rationale: דֶּשֶׁן 在献祭语境中可特指夹有脂油的祭物灰烬或残余；正文采用普通读者易懂的“灰烬”，细义置于脚注。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用以色列上帝的专名 יהוה；音译“雅威”可保留专名性质，不把它改成称号。
- issue: “耶和华所说的兆头”中关系从句的理解
  choice: 这就是雅威所说的兆头
  alternative: 这就是雅威所说之事的兆头
  rationale: 希伯来文 אֲשֶׁר דִּבֶּר יְהוָה 形式上修饰“兆头”，可直译为“雅威所说的兆头”；正文保留这一结构，不额外补出“所说之事”来限定其含义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“看哪”保留先知宣告的郑重和指示力度；“祭坛必裂开”使用符合现代汉语对象搭配的表达。两个脚注标记均置于正文相应词语之后。
