id: 1KI.13.32
reference: 1 Kings 13:32
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כִּי֩ הָיֹ֨ה יִהְיֶ֜ה הַ/דָּבָ֗ר אֲשֶׁ֤ר קָרָא֙ בִּ/דְבַ֣ר יְהוָ֔ה עַל הַ/מִּזְבֵּ֖חַ אֲשֶׁ֣ר בְּ/בֵֽית אֵ֑ל וְ/עַל֙ כָּל בָּתֵּ֣י הַ/בָּמ֔וֹת אֲשֶׁ֖ר בְּ/עָרֵ֥י שֹׁמְרֽוֹן־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/032.yaml
  text: For the word that he cried out by the word of Yahweh against the altar that is in Bethel[a], and against all the houses of the high places that are in the cities of Samaria[b], will surely come to pass.
translation:
  language: zh_hans
  text: 因为他奉雅威的话，针对伯特利的祭坛和撒马利亚各城所有丘坛的殿宇[a]所发出的宣告，必定应验。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “丘坛的殿宇”直译为“丘坛的房屋”，指设在丘坛上的祭祀建筑，也可译作“丘坛的神庙”。
    reason: 说明原文较不寻常的组合，并提供较自然的词义选择。
  - marker: b
    text: “必定应验”：希伯来文把同一动词的不定式绝对形和未完成式连用，用来加强确定的语气。
    reason: 解释原文强调预言必然实现的语法结构。
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文先知请求葬在神人墓旁的理由，表达解释性的因果关系。
- source_word: הָיֹה יִהְיֶה
  choice: 必定会实现
  rationale: 以“必定”体现不定式绝对形与未完成式连用所加强的确定语气；“实现”自然地表达预言应验。
- source_word: הַדָּבָר
  choice: 宣告
  rationale: 这里指先知公开说出的审判信息；译作“宣告”比笼统的“事情”更符合预言语境，并能与“所发出的”自然衔接。
- source_word: אֲשֶׁר קָרָא
  choice: 所发出的
  rationale: קרא在此指大声公开宣告；结合中文搭配译为“发出的宣告”，保留公开宣示之意而不显生硬。
- source_word: בִּדְבַר יְהוָה
  choice: 奉雅威的话
  rationale: 表示先知根据并受托于神的话而宣告；“奉……的话”在现代中文中自然体现其权威来源。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来语四字神名作音译，保留其作为神之专名的性质。
- source_word: עַל
  choice: 向
  rationale: 在“发出宣告”的中文结构中，“向……发出”自然标明审判宣告所针对的对象，语义相当于“针对”。
- source_word: הַמִּזְבֵּחַ
  choice: 祭坛
  rationale: 准确表达该处敬拜设施。
- source_word: בְּבֵית אֵל
  choice: 伯特利
  rationale: 采用该地名在现代中文圣经中的通行音译。
- source_word: כָּל בָּתֵּי הַבָּמוֹת
  choice: 所有丘坛的殿宇
  rationale: 保留“丘坛”及其“房屋/殿宇”两个要素，避免直接简化为单一的“神庙”；“殿宇”在祭祀语境中清楚而庄重。
- source_word: בְּעָרֵי שֹׁמְרוֹן
  choice: 撒马利亚各城
  rationale: 自然表达“撒马利亚的众城”，不消除经文在历史称谓方面可能产生的张力。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华／主
  rationale: 原文直接使用四字神名，音译为“雅威”可保留其专名性质，而不以称号代替。
- issue: הָיֹה יִהְיֶה 所表达的预言确定性
  choice: 必定会实现
  alternative: 一定会发生／必然应验
  rationale: 保留希伯来语强化结构所表达的确定性；“实现”既可用于宣告内容成为事实，又不额外加入对实现方式或时间的解释。
- issue: בָּתֵּי הַבָּמוֹת 的所指
  choice: 丘坛的殿宇
  alternative: 丘坛的神庙／丘坛
  rationale: 原文同时保留“殿宇”和“丘坛”两个名词。主文采用较形式对应的译法，不把它预先解释成某一种具体建筑类型。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。句序稍作调整，使长定语在中文中清晰；保留“伯特利”“撒马利亚”等传统地名，并保留“丘坛的殿宇”这一原文结构所具有的具体性与些许陌生感。
