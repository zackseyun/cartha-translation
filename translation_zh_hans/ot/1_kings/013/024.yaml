base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/024.yaml
  text: And he went[a], and a lion found him on the road and killed him. And his corpse was cast on the road, and the donkey was standing beside it, and the lion was standing beside the corpse.
translation:
  language: zh_hans
  text: 他走后，一只狮子在路上遇见他，把他杀死了。他的尸体被抛在路上[a]；驴站在尸体旁，狮子也站在尸体旁。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他的尸体被弃在路上。”希伯来文使用被动分词，表示尸体被抛下或弃置在那里，而不只是躺在那里。
    reason: 词义及语法形式存在可译差异，需要保留被动分词所表达的被抛下或弃置之意。
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: 他走了以后
  rationale: 承接前文并推进叙事；译为“走了以后”自然表达事件的先后关系，不额外说明目的或因果。
- source_word: וַיִּמְצָאֵהוּ אַרְיֵה
  choice: 有一只狮子……遇见他
  rationale: מצא在此指狮子在途中碰上他；“遇见”比字面的“找到”更符合现代汉语叙事，同时保留意外相遇之意。
- source_word: בַּדֶּרֶךְ
  choice: 在路上
  rationale: 符合旅行语境，并保留本节中的重复地点描写。
- source_word: וַיְמִיתֵהוּ
  choice: 把他咬死了
  rationale: 使役式的基本意思是“使他死亡、杀死他”；结合施事者是狮子，“咬死”是自然汉语表达，但不暗示吞食尸体。
- source_word: נִבְלָתוֹ
  choice: 他的尸体
  rationale: נבלה指死尸；“尸体”庄重、清楚，也避免“尸首”可能带来的古旧色彩。
- source_word: מֻשְׁלֶכֶת
  choice: 被抛在
  rationale: 保留שלך被动分词所表达的被抛下、横陈于该处的结果状态，而不弱化为单纯“躺在”。
- source_word: וְהַחֲמוֹר עֹמֵד אֶצְלָהּ
  choice: 驴站在尸体旁边
  rationale: 分词描绘持续可见的场景；将阴性代词所指的“尸体”明确译出，避免汉语代词指向不清。
- source_word: וְהָאַרְיֵה עֹמֵד אֵצֶל הַנְּבֵלָה
  choice: 狮子也站在尸体旁边
  rationale: 保留原文再次明说“尸体”以及分词的场景描写功能；“也”自然呈现驴和狮子并列站立的反常画面。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。用“尸体”而不用较古旧的“尸首”；保留“驴”和“狮子”都站在尸体旁边的重复描写，以突出原文刻意呈现的静止场景。
