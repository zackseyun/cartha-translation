- from: 他走了以后，有一只狮子在路上遇见他，把他咬死了。他的尸体被抛在路上[a]；驴站在尸体旁边，狮子也站在尸体旁边。
  to: 他走后，一只狮子在路上遇见他，把他杀死了。他的尸体被抛在路上[a]；驴站在尸体旁，狮子也站在尸体旁。
  rationale: 修正无原文依据的“咬死”为“杀死”，以保留原文对死亡方式的未说明状态；调整脚注异译及说明，使其准确反映被动分词“被抛下／弃置”的语义。其余结构保留原文反复呈现的静止场景。
