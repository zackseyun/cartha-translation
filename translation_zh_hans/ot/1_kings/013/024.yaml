  naturalness: 译文整体自然、庄重。将“他走了以后”改为“他走后”更简练，仍保留叙事先后；“旁”比“旁边”在此类叙事中更凝练自然。
  terminology: “尸体”“驴”“狮子”均恰当。“杀死了”是对 וַיְמִיתֵהוּ 的中性、准确译法，不擅自具体化为“咬死”。脚注的异译应保留“被抛下／弃置”的被动语义，不能以“横陈”替代而淡化该语义。
