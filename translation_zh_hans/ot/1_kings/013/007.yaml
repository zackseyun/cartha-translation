  text: Then the king said to the man of God[a], “Come home with me and eat, and I will give you a gift.”
translation:
  language: zh_hans
  text: 王对神人说：“请跟我回家吃点东西，我会送你一份礼物。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: 说
  rationale: 该形式承接并推进叙事；现代汉语在上下文中无需机械译出连接词。
- source_word: הַמֶּלֶךְ
  choice: 王
  rationale: 准确、自然地表达带定冠词的名词；具体所指由上下文确定。
- source_word: אִישׁ הָאֱלֹהִים
  choice: 神人
  rationale: 保留希伯来语的固定称谓，不将其解释性地改译为“先知”。
- source_word: בֹּאָה אִתִּי הַבַּיְתָה
  choice: 请跟我回家
  rationale: 方向词尾表明“到家里去”；命令式附加形式带有邀请、劝请色彩，汉语用“请”表达自然。
- source_word: וּסְעָדָה
  choice: 吃点东西
  rationale: סעד本义涉及使自己得力、得到补充，在此邀请回家的语境中指借饮食恢复体力；“吃点东西”自然且不把动作夸大为正式宴饮。
- source_word: וְאֶתְּנָה לְךָ
  choice: 我也要送你
  rationale: 在邀请之后表达说话者提出的进一步给予；“也要”自然传达并列和意愿。
- source_word: מַתָּת
  choice: 一份礼物
  rationale: 该词中性地表示赠礼；避免译为“赏赐”或“报酬”，以免引入原文未明说的权力或酬劳含义。
