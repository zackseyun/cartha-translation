  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יְהִי֙ בַּ/דָּבָ֣ר הַ/זֶּ֔ה לְ/חַטַּ֖את בֵּ֣ית יָרָבְעָ֑ם וּ/לְ/הַכְחִיד֙ וּ/לְ/הַשְׁמִ֔יד מֵ/עַ֖ל פְּנֵ֥י הָ/אֲדָמָֽה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/034.yaml
  text: And this matter became sin for the house of Yarovam[b][a], to cut it off and to destroy it from the face of the ground.
translation:
  language: zh_hans
  text: 这事[a]成了耶罗波安家的罪，以致把这家从地面上[b]剪除、毁灭。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “这事”也可译作“这件事”。希伯来语 דָּבָר 可泛指事情、事件或行为。
    reason: lexical_alternative
  - marker: b
    text: “从地面上”是希伯来语惯用说法，意思是从地上彻底除去。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַּדָּבָר הַזֶּה לְחַטַּאת
  choice: 这事使……陷在罪中
  rationale: 这里的 היה לְחַטָּאת 表明前述之事给耶罗波安家带来犯罪和定罪的后果。译作“使……陷在罪中”比生硬的“成为罪”更符合现代汉语，同时保留因果意味。
- source_word: בַּדָּבָר הַזֶּה
  choice: 这事
  rationale: דָּבָר 在此泛指上文所述的整件事或行为，而非单指话语。“这事”简洁自然，也保留其宽泛指涉。[a]
- source_word: בֵּית יָרָבְעָם
  choice: 耶罗波安家
  rationale: “家”保留 בֵּית 的家族、王室或王朝含义，不把所指过早限定为抽象的“王朝”。
- source_word: וּלְהַכְחִיד וּלְהַשְׁמִיד
  choice: 被除掉、被毁灭
  rationale: 两个使役不定式表达最终结果；分别译为“除掉”和“毁灭”，既体现同义强化，也保留两个动词的差别。汉语补出“这家”并采用被动式，使省略的受事清楚。
- source_word: מֵעַל פְּנֵי הָאֲדָמָה
  choice: 从地面上
  rationale: 贴近希伯来语空间意象；整句表示彻底从地上除去，而未强行把 אֲדָמָה 限定为“土地”或扩大为“全世界”。[b]
theological_decisions:
- issue: 两个毁灭动词所指的对象
  choice: 承接“耶罗波安家”，即其家族或王朝
  alternative: 指前述罪事本身
  rationale: 从句法邻近关系和王朝受审判的叙事语境看，“耶罗波安家”是最自然的隐含受事；译文补出“这家”仅澄清汉语所需的对象，没有额外增加神学判断。
- issue: לְ 不定式与前句的关系
  choice: 译为结果：“以致”
  alternative: 译为目的：“为了”
  rationale: 在本句中，毁灭耶罗波安家是这罪所导致的审判结局，而不是耶罗波安犯罪时所怀的目的；“以致”较准确地表达结果关系。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。正文保留“家”和“从地面上”的希伯来语意象，同时用“陷在罪中”“以致”明确现代汉语所需的关系。脚注标记均置于相关正文之后。
