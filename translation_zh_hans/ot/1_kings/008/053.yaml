  text: כִּֽי אַתָּ֞ה הִבְדַּלְתָּ֤/ם לְ/ךָ֙ לְֽ/נַחֲלָ֔ה מִ/כֹּ֖ל עַמֵּ֣י הָ/אָ֑רֶץ כַּ/אֲשֶׁ֨ר דִּבַּ֜רְתָּ בְּ/יַ֣ד מֹשֶׁ֣ה עַבְדֶּ֗/ךָ בְּ/הוֹצִיאֲ/ךָ֧ אֶת אֲבֹתֵ֛י/נוּ מִ/מִּצְרַ֖יִם אֲדֹנָ֥/י יְהוִֽה־׀־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/053.yaml
  text: For you set them apart for yourself as an inheritance from all the peoples of the earth[a], just as you spoke by the hand of Moses your servant when you brought our fathers out from Egypt[c][b], Lord GOD.
translation:
  language: zh_hans
  text: 因为你把他们从地上万民中分别出来，归你作产业，正如你领我们的先祖出埃及时，借你仆人摩西所说的，主耶和华。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִבְדַּלְתָּם
  choice: 把他们……分别出来
  rationale: 使役词形表示使之分开；“分别出来”自然保留以色列从万民中被特意划分出来的含义。
- source_word: לְךָ לְנַחֲלָה
  choice: 归你作产业
  rationale: 兼顾归属与נחלה所含的产业、承受之业含义；不将其缩减为一般的“财产”。
- source_word: מִכֹּל עַמֵּי הָאָרֶץ
  choice: 从地上万民中
  rationale: “地上万民”表达此处普世范围，“从……中”清楚呈现分别的对象范围。
- source_word: בְּיַד מֹשֶׁה עַבְדֶּךָ
  choice: 借你仆人摩西
  rationale: ביד是借代理人传达的希伯来语惯用表达；汉语译作“借”既准确又自然。
- source_word: בְּהוֹצִיאֲךָ אֶת אֲבֹתֵינוּ מִמִּצְרַיִם
  choice: 你领我们的先祖出埃及时
  rationale: ב加不定式在此表达时间背景；“领……出埃及”自然呈现出离行动。אבותינו在此指以色列前代，译作“先祖”较现代且不强加仅指族长的范围。
- source_word: אֲדֹנָי יְהוִה
  choice: 主耶和华
  rationale: 分别呈现主权称号אדני与神名יהוה，并避免不自然的“主主”。
theological_decisions:
- issue: אֲדֹנָי יְהוִה中神名的译法
  choice: 主耶和华
  alternative: 主上帝；主雅威
  rationale: “主耶和华”在现代中文圣经语域中可辨识，并保留称号与专名两个成分；不以普通称谓“上帝”完全替代原文神名。
- issue: 以色列作为上帝的נחלה
  choice: 归你作产业
  alternative: 归你为业；作你的基业
  rationale: 保留圣约性的归属和产业意象，不进一步解释这种拣选的性质或方式。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。句法依照希伯来文的因果陈述，并将时间短语置于“所说的”之前，使“出埃及时”自然修饰上帝借摩西说话的情境。
