id: 1KI.8.33
reference: 1 Kings 8:33
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: בְּֽ/הִנָּגֵ֞ף עַמְּ/ךָ֧ יִשְׂרָאֵ֛ל לִ/פְנֵ֥י אוֹיֵ֖ב אֲשֶׁ֣ר יֶחֶטְאוּ לָ֑/ךְ וְ/שָׁ֤בוּ אֵלֶ֨י/ךָ֙ וְ/הוֹד֣וּ אֶת שְׁמֶ֔/ךָ וְ/הִֽתְפַּֽלְל֧וּ וְ/הִֽתְחַנְּנ֛וּ אֵלֶ֖י/ךָ בַּ/בַּ֥יִת הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/033.yaml
  text: When your people Israel are struck down before an enemy because they have sinned against you[a], and they turn back to you and confess your name and pray and plead with you in this house,
translation:
  language: zh_hans
  text: 你的子民以色列若因得罪你而在仇敌面前败下阵来，后来又回转归向你，承认你的名[a]，在这殿里向你祷告恳求，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“颂赞你的名”或“感谢你的名”。这里的希伯来语动词可按上下文表示承认、颂赞或感谢。
    reason: 保留 ידה 使役式在本句中无法完全消除的词义歧义。
lexical_decisions:
- source_word: בְּהִנָּגֵף
  choice: 败下阵来
  rationale: 这是 נָגַף 的尼法勒不定式，在军事语境中表示在敌前遭击败；此译保留被动受挫的含义，同时符合现代汉语表达。
- source_word: עַמְּךָ יִשְׂרָאֵל
  choice: 你的子民以色列
  rationale: 保留第二人称所属关系以及“以色列”对“子民”的同位说明，并以“子民”体现此处的立约关系语境。
- source_word: לִפְנֵי אוֹיֵב
  choice: 在仇敌面前
  rationale: לִפְנֵי 直译为“在……面前”，又是希伯来文描述战败的惯用表达；“仇敌”在此可作无定泛指。
- source_word: אֲשֶׁר יֶחֶטְאוּ לָךְ
  choice: 因得罪你
  rationale: 关系词在此引出战败的原因；חטא לך 表示向神犯罪，现代汉语用“得罪你”自然且贴近关系性的含义。
- source_word: וְשָׁבוּ אֵלֶיךָ
  choice: 又回转归向你
  rationale: שׁוּב 表示转回、返回；“回转归向”保留空间隐喻和属灵方向，但不额外加入完整的教义术语。
- source_word: וְהוֹדוּ אֶת שְׁמֶךָ
  choice: 承认你的名
  rationale: ידה 的使役式可表示承认、颂赞或感谢。鉴于上下文涉及犯罪、受败和回转，“承认你的名”较能表达悔罪祈求中对神之名的公开认可，同时用脚注保留其他真实可能。
- source_word: וְהִתְפַּלְלוּ
  choice: 祷告
  rationale: 这是 פלל 的希特帕勒式，在此通常指向神祷告。
- source_word: וְהִתְחַנְּנוּ אֵלֶיךָ
  choice: 向你……恳求
  rationale: חנן 的希特帕勒式表示求恩、哀求；“恳求”传达迫切求告，而“向你”对应 אֵלֶיךָ，避免在正文中过度展开其恩惠内涵。
- source_word: בַּבַּיִת הַזֶּה
  choice: 在这殿里
  rationale: 介词明确表示“在……里面”；בַּיִת 在此指所建造的耶和华之殿，译作“殿”既符合上下文，也比现代汉语中的“房屋”准确自然。
theological_decisions:
- issue: 如何表达犯罪之后归向神的语言而不过度规定“悔改”的完整教义含义
  choice: 又回转归向你
  alternative: 又悔改归向你；又回到你这里
  rationale: 原文 שׁוּב 本义是转回或返回。“回转归向”呈现立约关系恢复的方向，又没有把词义扩展成原文单词本身未完全明说的教义表述。
- issue: 悔罪语境中 וְהוֹדוּ אֶת שְׁמֶךָ 的翻译
  choice: 承认你的名
  alternative: 颂赞你的名；感谢你的名
  rationale: 该动词语义范围包括承认、颂赞和感谢。犯罪、战败、回转和恳求的语境支持“承认”，但其他理解仍属真实可能，因此以脚注保留，不把歧义消除。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“败下阵来”自然表达军事失败；“在这殿里”准确体现所罗门祷告中的圣殿语境。全句是延续至下一节的条件从句，因此以逗号收束。
