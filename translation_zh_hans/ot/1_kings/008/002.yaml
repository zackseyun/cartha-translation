base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/002.yaml
  text: And all the men of Israel assembled before King Solomon at the festival, in the month of Ethanim, which is the seventh month.
translation:
  language: zh_hans
  text: 以色列众人都在以他念月（就是七月）的节期，聚集到所罗门王那里。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כָּל אִישׁ יִשְׂרָאֵל
  choice: 以色列众人
  rationale: 该短语字面为“以色列的所有人/男子”，在此指聚集的以色列民众；译作“众人”自然，也不把范围不必要地限定为成年男性。
- source_word: וַיִּקָּהֲלוּ אֶל הַמֶּלֶךְ שְׁלֹמֹה
  choice: 聚集到所罗门王那里
  rationale: אֶל 表示朝向或到某人那里；此译保留百姓向王聚集的空间和关系含义，不增添原文未明确表达的“在……面前”。
- source_word: יֶרַח הָאֵתָנִים
  choice: 以他念月
  rationale: 保留古代月份名称 Ethanim 的音译；יֶרַח 在此为“月/月分”。
- source_word: בֶּחָג
  choice: 节期的时候
  rationale: חָג 可指朝圣节庆；原文未在本节点明具体节名，因此不擅自译为“住棚节”。
- source_word: הַחֹדֶשׁ הַשְּׁבִיעִי
  choice: 七月
  rationale: 直译其历法次序，并以“就是”说明以他念月与七月同指一个月份。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而通顺的叙事语体。调整希伯来语信息次序，使月份、同位说明和节期关系在中文中清楚自然，同时保留原文未明确指出具体节名的开放性。
