  text: כִּ֚י הַֽ/אֻמְנָ֔ם יֵשֵׁ֥ב אֱלֹהִ֖ים עַל הָ/אָ֑רֶץ הִ֠נֵּה הַ/שָּׁמַ֜יִם וּ/שְׁמֵ֤י הַ/שָּׁמַ֨יִם֙ לֹ֣א יְכַלְכְּל֔וּ/ךָ אַ֕ף כִּֽי הַ/בַּ֥יִת הַ/זֶּ֖ה אֲשֶׁ֥ר בָּנִֽיתִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/027.yaml
  text: For will God indeed dwell on the earth? Behold[a], the heavens, even the highest heavens, cannot contain you[c][b]; how much less this house that I have built!
translation:
  language: zh_hans
  text: 然而，上帝果真会住在地上吗？看哪，天和天上的天尚且容不下你[a]，何况我建造的这殿呢！[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “天上的天”是希伯来语的加强表达，指至高的天；“容不下”也可译作“不能容纳”。
    reason: lexical_alternative
  - marker: b
    text: “这殿”指所罗门建造的圣殿。
    reason: cultural_note
lexical_decisions:
- source_word: כִּי הַאֻמְנָם
  choice: 然而……果真……吗
  rationale: כִּי 在这里承接前文并引出带有惊叹意味的反思；הַאֻמְנָם 加强反问语气。“然而……果真……吗”既自然，也保留所罗门的惊异与庄重语调。
- source_word: יֵשֵׁב
  choice: 住
  rationale: 此处指上帝临在并居住，而非单纯“坐下”；“住”符合圣殿语境，又不暗示上帝受建筑空间限制。
- source_word: עַל הָאָרֶץ
  choice: 在地上
  rationale: 这里的“地”与后面的“天”形成宇宙范围的对照，因此译作“在地上”，而非“在这片土地上”。
- source_word: הִנֵּה
  choice: 看哪
  rationale: 保留原文唤起注意和加强语势的功能，也符合庄重祷告的语域。
- source_word: הַשָּׁמַיִם וּשְׁמֵי הַשָּׁמַיִם
  choice: 天和天上的天
  rationale: 较形式地保留希伯来语的叠加表达及其宏大修辞；脚注说明它指至高之天，避免正文将原有意象完全释义化。
- source_word: לֹא יְכַלְכְּלוּךָ
  choice: 容不下你
  rationale: 动词表达不能容纳、盛载之意。“容不下”是现代汉语中清楚自然的说法，并保留空间容量的比喻。
- source_word: אַף כִּי
  choice: 尚且……何况
  rationale: 明确表达原文由强到弱的递进论证：连诸天都不能容纳上帝，更不用说人所建的殿。
- source_word: הַבַּיִת הַזֶּה
  choice: 这殿
  rationale: בַּיִת 字面为“房屋、殿宇”，在本段明确指所罗门建造的圣殿；“这殿”既保留建筑意象，也避免现代读者误解为普通住宅。
- source_word: אֲשֶׁר בָּנִיתִי
  choice: 我建造的
  rationale: 简洁表达已完成的建造，并保持其与“这殿”的定语关系。
theological_decisions:
- issue: 上帝的超越性与圣殿中的临在
  choice: 以反问表达上帝确实俯就临在的惊异，同时声明诸天也不能容纳他。
  alternative: 将本句译成绝对否认上帝住在地上，或暗示圣殿能把上帝局限在其中。
  rationale: 原文既置于献殿祷告的背景中，又强调任何受造空间都不能容纳上帝。译文保留这两者之间的张力，不把其中一面消解掉。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“看哪”保留祷告中的郑重语气；“果真”“尚且……何况”清楚呈现反问与递进逻辑。所有脚注标记均置于正文相应位置。
