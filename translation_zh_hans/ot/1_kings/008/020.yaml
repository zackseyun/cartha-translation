id: 1KI.8.20
reference: 1 Kings 8:20
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יָּ֣קֶם יְהוָ֔ה אֶת דְּבָר֖/וֹ אֲשֶׁ֣ר דִּבֵּ֑ר וָ/אָקֻ֡ם תַּחַת֩ דָּוִ֨ד אָבִ֜/י וָ/אֵשֵׁ֣ב עַל כִּסֵּ֣א יִשְׂרָאֵ֗ל כַּֽ/אֲשֶׁר֙ דִּבֶּ֣ר יְהוָ֔ה וָ/אֶבְנֶ֣ה הַ/בַּ֔יִת לְ/שֵׁ֥ם יְהוָ֖ה אֱלֹהֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/020.yaml
  text: And Yahweh has fulfilled his word that he spoke[a], and I have risen in the place of David my father and sit on the throne of Israel, just as Yahweh spoke, and I have built the house for the name of Yahweh[b], the God of Israel.
translation:
  language: zh_hans
  text: 耶和华使他所说的话实现了[a]；我接替我父亲大卫，坐上以色列的王位，正如耶和华所说的；我也为耶和华——以色列的上帝——的名建造了这殿[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “使……实现了”也可译作“确立了”或“成就了”。
    reason: lexical_alternative
  - marker: b
    text: 原文直译“这房屋”，这里指圣殿。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֶם
  choice: 使……实现了
  rationale: 使役词形与“话”连用，表示使所说的成为现实；译文保留实现应许的语境含义，并以脚注列出“确立、成就”等可能表达。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代汉语中广为人知的专名形式呈现四字神名，而不以“主”这一称号替代。
- source_word: דְּבָרוֹ אֲשֶׁר דִּבֵּר
  choice: 他所说的话
  rationale: 保留原文“话—说”的重复，不直接释义为“应许”，以免把语境含义写进正文。
- source_word: וָאָקֻם תַּחַת דָּוִד אָבִי
  choice: 我接替我父亲大卫
  rationale: תַּחַת在此表达王位继承；“接替”是自然且准确的现代汉语，也保留了“起而代之”的基本关系。
- source_word: וָאֵשֵׁב עַל כִּסֵּא יִשְׂרָאֵל
  choice: 坐上以色列的王位
  rationale: “坐上……王位”既反映登基这一已发生的行动，也包含如今在位的结果，比单纯“坐在宝座上”更符合汉语王权语境。
- source_word: כַּאֲשֶׁר דִּבֶּר יְהוָה
  choice: 正如耶和华所说的
  rationale: 保持דבר前后呼应，不增译为“应许”。
- source_word: וָאֶבְנֶה הַבַּיִת
  choice: 我也……建造了这殿
  rationale: הַבַּיִת字面为“这房屋/那房屋”，语境明确指圣殿；汉语用“这殿”既自然又保留建筑物称谓，脚注说明字面形式。
- source_word: לְשֵׁם יְהוָה
  choice: 为耶和华……的名
  rationale: 保留“为……的名”这一重要原文表达，不弱化为仅仅“为荣耀”或“献给”。
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: 以色列的上帝
  rationale: 直接呈现其盟约身份称谓，并通过破折号清楚标明这是对耶和华的同位说明。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: “耶和华”是现代简体中文读者最熟悉且能明确识别为专名的形式；正文不以“主”替换原文神名。
- issue: הַבַּיִת应译为“殿”还是“房屋”
  choice: 这殿
  alternative: 这房屋
  rationale: 原词字面是“房屋”，但本节语境中特指所罗门建成的圣殿。“这殿”在现代汉语中清楚自然，脚注保留字面信息。
- issue: 是否把דְּבָרוֹ解释为“应许”
  choice: 他所说的话
  alternative: 他的应许
  rationale: 上下文具有应许实现的含义，但原文使用普通的“话”与“说”；正文保留这一措辞，避免消除其较宽的语义。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。分号呈现原文连续叙述中的三个紧密相关陈述；“接替”“坐上王位”让王位继承关系对普通读者清楚，同时保留“为……的名”这一具有神学分量的原文表达。
