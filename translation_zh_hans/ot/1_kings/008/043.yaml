id: 1KI.8.43
reference: 1 Kings 8:43
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: אַתָּ֞ה תִּשְׁמַ֤ע הַ/שָּׁמַ֨יִם֙ מְכ֣וֹן שִׁבְתֶּ֔/ךָ וְ/עָשִׂ֕יתָ כְּ/כֹ֛ל אֲשֶׁר יִקְרָ֥א אֵלֶ֖י/ךָ הַ/נָּכְרִ֑י לְמַ֣עַן יֵדְעוּ/ן֩ כָּל עַמֵּ֨י הָ/אָ֜רֶץ אֶת שְׁמֶ֗/ךָ לְ/יִרְאָ֤ה אֹֽתְ/ךָ֙ כְּ/עַמְּ/ךָ֣ יִשְׂרָאֵ֔ל וְ/לָ/דַ֕עַת כִּי שִׁמְ/ךָ֣ נִקְרָ֔א עַל הַ/בַּ֥יִת הַ/זֶּ֖ה אֲשֶׁ֥ר בָּנִֽיתִי־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/043.yaml
  text: may you hear in heaven[a], the place where you dwell, and do according to all that the foreigner calls to you for, so that all the peoples of the earth may know your name, to fear you as your people Israel do[b], and to know that your name is called on this house that I have built.
translation:
  language: zh_hans
  text: 愿你从天上，就是你的居所，垂听，并照这外族人向你呼求[a]的一切而行，使地上万民都认识你的名，像你的子民以色列一样敬畏你，并知道我所建的这殿是以你的名而称的[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “向你呼求”也可译作“向你求告”或“向你呼喊”。
    reason: lexical_alternative
  - marker: b
    text: 直译为“你的名被称在这殿之上”；这是表示这殿与您的名相连、属于您的说法。
    reason: idiom_explanation
lexical_decisions:
- source_word: תִּשְׁמַע
  choice: 愿你……垂听
  rationale: 该未完成式在所罗门的祷告中表达祈愿。“愿你”体现意愿语气，“垂听”自然、庄重，并表明这是向上帝发出的恳求。
- source_word: הַשָּׁמַיִם מְכוֹן שִׁבְתֶּךָ
  choice: 在天上、你的居所
  rationale: 保留“天上”与同位说明“你的居所”，既贴近希伯来语结构，也不把两者压缩成单一概念。
- source_word: וְעָשִׂיתָ כְּכֹל אֲשֶׁר
  choice: 并照……的一切而行
  rationale: 保留动词“行”的宽泛含义和“照一切”的总体性，不具体限定上帝回应祈求的方式。
- source_word: יִקְרָא אֵלֶיךָ
  choice: 向你呼求
  rationale: קרא אל 在祷告语境中指向某人呼喊或求告。“呼求”兼顾呼喊和祈求之意，又不把原文明确化为某种特定祷告形式。
- source_word: הַנָּכְרִי
  choice: 这外族人
  rationale: נָכְרִי 指来自别族、非以色列群体的人。“外族人”比“陌生人”更准确，也比带有现代法律色彩的称谓更合适。
- source_word: כָּל עַמֵּי הָאָרֶץ
  choice: 地上万民
  rationale: 这是自然庄重的现代汉语圣经表达，保留“各族人民”的普世范围。
- source_word: לְיִרְאָה אֹתְךָ
  choice: 敬畏你
  rationale: “敬畏”保留 ירא 所包含的畏惧、尊崇和肃然之感，避免将其弱化为普通尊敬。
theological_decisions:
- issue: 如何表达 שִׁמְךָ נִקְרָא עַל הַבַּיִת הַזֶּה 的习语
  choice: 我所建的这殿是归于你名下的
  alternative: 你的名被称在我所建的这殿之上；我所建的这殿是以你的名称呼的
  rationale: 原文习语表达圣殿与上帝之名的公开关联，也可含归属之意。正文采用自然汉语“归于你名下”，脚注保留较直译的形式，避免只理解为建筑名称。
- issue: 如何翻译 ירא
  choice: 敬畏你
  alternative: 惧怕你；尊崇你
  rationale: “敬畏”没有消除畏惧与尊崇之间的神学张力，也符合本节将万民与以色列相提并论的语境。
- issue: 万民认识上帝之名的目的性
  choice: 使地上万民都认识你的名
  alternative: 好让地上万民都知道你的名
  rationale: לְמַעַן 引出目的；“使”清楚表达所罗门祈求上帝回应外族人的普世目的，但不推断回应必然发生的方式。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“垂听”“敬畏”“万民”保留祷告文体的庄严感，但避免古奥句法。标点将“你的居所”处理为“天上”的同位说明；两个脚注标记分别紧随所解释的短语或分句。
