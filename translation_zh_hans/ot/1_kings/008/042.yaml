source:
  edition: WLC
  text: כִּ֤י יִשְׁמְעוּ/ן֙ אֶת שִׁמְ/ךָ֣ הַ/גָּד֔וֹל וְ/אֶת יָֽדְ/ךָ֙ הַֽ/חֲזָקָ֔ה וּֽ/זְרֹעֲ/ךָ֖ הַ/נְּטוּיָ֑ה וּ/בָ֥א וְ/הִתְפַּלֵּ֖ל אֶל הַ/בַּ֥יִת הַ/זֶּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/042.yaml
  text: for they will hear of your great name[a], and of your mighty hand and your outstretched arm, and he will come and pray toward this house—
translation:
  language: zh_hans
  text: 因为他们必听见你的大名、你大能的手和伸出的膀臂；他[a]就会来，向着这殿祷告——
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文在这里从复数“他们必听见”转为单数“他就会来”，可能是从泛指外族人群体转到其中一位代表性的外族人。
    reason: 说明原文主语由复数转为单数，避免读者误以为是译文不一致。
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，说明外族人前来祷告的缘由，保留其解释、因果意味。
- source_word: יִשְׁמְעוּן
  choice: 他们必听见
  rationale: 未完成式在所罗门的祷告中表达将来或一般性的情形；复数“他们”对应作为群体的外族人。
- source_word: אֶת שִׁמְךָ הַגָּדוֹל
  choice: 你的大名
  rationale: “名”既指上帝的名，也承载其声誉与彰显出来的威名；“大名”简洁保留原文意象，不改写为抽象概念。
- source_word: יָדְךָ הַחֲזָקָה
  choice: 你大能的手
  rationale: 保留“手”的具体拟人意象；“大能的”自然表达 חֲזָקָה 所指的强盛力量。
- source_word: זְרֹעֲךָ הַנְּטוּיָה
  choice: 你伸出的膀臂
  rationale: 保留希伯来文中上帝主动施展能力的具体形象，也与旧约常见表达相协调。
- source_word: וּבָא
  choice: 他就会来
  rationale: 原文从复数“他们必听见”转为单数，指群体中的一个代表性外族人；译文保留这一数的转换。
- source_word: וְהִתְפַּלֵּל
  choice: 祷告
  rationale: 与前面的单数动词相连，由“他”统摄，中文无需重复主语。
- source_word: אֶל הַבַּיִת הַזֶּה
  choice: 向着这殿
  rationale: אֶל 在圣殿祷告语境中具有方向意味；“向着”避免误解为必须进入殿内，“殿”也符合此处所指的圣殿。
theological_decisions:
- issue: 描述上帝能力的拟人语言
  choice: 在正文中保留“手”和“膀臂”
  alternative: 译作“能力”和“力量”
  rationale: 这些具体意象在旧约中具有重要的文学和神学作用；抽象化会削弱原文表达。
- issue: 主语由复数转为单数
  choice: 保留“他们必听见……他就会来”
  alternative: 统一译为复数：“他们必听见……就会来祷告”
  rationale: 原文确有数的转换，可能从泛指外族人群体转向其中一位代表性的外族人；保留转换可避免替原文消除张力。
translation_notes:
  register: 采用现代、庄重而易懂的中文。“大名”“大能的手”“伸出的膀臂”保留经文的具体意象；用“向着这殿”明确祷告的方向。破折号保留本节句法向下一节延续的开放性。
