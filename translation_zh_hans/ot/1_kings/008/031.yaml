  text: אֵת֩ אֲשֶׁ֨ר יֶחֱטָ֥א אִישׁ֙ לְ/רֵעֵ֔/הוּ וְ/נָֽשָׁא ב֥/וֹ אָלָ֖ה לְ/הַֽאֲלֹת֑/וֹ וּ/בָ֗א אָלָ֛ה לִ/פְנֵ֥י מִֽזְבַּחֲ/ךָ֖ בַּ/בַּ֥יִת הַ/זֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/031.yaml
  text: If a man sins against his neighbor[a], and an oath is laid on him to make him swear, and the oath comes before your altar in this house,
translation:
  language: zh_hans
  text: “人若得罪邻舍，有誓言加在他身上，要他起誓；这誓言[a]来到你在这殿中的祭坛前，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “誓言”也可译作“咒诅”；这个希伯来词既可指誓言本身，也可指违誓时所招致的咒诅。
    reason: 保留 אָלָה 在司法宣誓语境中的词义范围。
lexical_decisions:
- source_word: יֶחֱטָא
  choice: 得罪
  rationale: 在此处的人际和司法语境中，“得罪”既表达对邻舍的过犯，也保留 חטא 的道德含义，比单纯译作“伤害”或“做错事”更贴切。
- source_word: אִישׁ
  choice: 人
  rationale: 这里的阳性单数泛指任何人；现代汉语用“人”自然、准确，并不抹去原文的代表性单数。
- source_word: לְרֵעֵהוּ
  choice: 邻舍
  rationale: רֵעַ 指同伴、邻人或与自己有关联的人；“邻舍”保留圣经伦理语境中的人际含义。
- source_word: וְנָשָׂא בוֹ אָלָה
  choice: 有誓言加在他身上
  rationale: 保留原文中誓言施加于当事人的被动意象，也避免把未明说的施加者补入正文。
- source_word: לְהַאֲלֹתוֹ
  choice: 要他起誓
  rationale: 该使役式不定词表示使某人宣誓或令其受誓约约束；“要他起誓”清楚表达使役含义。
- source_word: וּבָא אָלָה
  choice: 这誓言来到
  rationale: 按紧邻名词 אָלָה 为主语来理解，保留誓言被带到上帝面前接受裁断的司法图景；原文形式也容许其他句法理解。
- source_word: לִפְנֵי מִזְבַּחֲךָ
  choice: 你的祭坛前
  rationale: 直接保留空间与司法性的表达，现代汉语自然。
- source_word: בַּבַּיִת הַזֶּה
  choice: 这殿中
  rationale: בַּיִת 字面为“房屋、家”，此处明确指所罗门建造的圣殿；“殿”在中文中自然，也保留敬拜场所的庄重语域。
theological_decisions:
- issue: 圣殿司法语境中 אָלָה 的含义
  choice: 誓言
  alternative: 咒诅
  rationale: 本节描述在祭坛前进行的司法宣誓程序，因此正文采用“誓言”；但该词也可指誓言所附带的咒诅或违誓后果，故以脚注保留这一张力。
- issue: וּבָא אָלָה 的主语
  choice: 这誓言来到祭坛前
  alternative: 他来到祭坛前起誓
  rationale: 将紧邻的 אָלָה 视为主语，较直接地反映词序和誓言被呈到上帝面前的图景；不在正文中加入原文未明说的动作细节。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“有誓言加在他身上”略带正式色彩，是为保留希伯来文的被动结构及司法场景；标点表明本节句意延续到下一节。
