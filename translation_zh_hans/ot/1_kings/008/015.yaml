  yaml_path: translation/ot/1_kings/008/015.yaml
  text: And he said[a], “Blessed be Yahweh, the God of Israel, who spoke with his mouth to David my father and has fulfilled it with his hand, saying,”
translation:
  language: zh_hans
  text: 他说：“以色列的上帝雅威是当受称颂的！他亲口向我父亲大卫所说的，也亲手成就了，说：
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָּרוּךְ
  choice: 是当受称颂的
  rationale: 这是用于颂赞上帝的被动分词祝颂语。译为“是当受称颂的”既保留祝颂句式，也符合现代汉语表达。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来语四字神名音译，以专名呈现，而不以“主”这一称号替代。
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: 以色列的上帝
  rationale: 直接表达希伯来语的属格结构，指明雅威与以色列的关系。
- source_word: אֲשֶׁר דִּבֶּר בְּפִיו
  choice: 他亲口……说话
  rationale: “亲口”保留原文“用他的口”的身体意象，并与下文“亲手”构成清晰对照。
- source_word: אֵת דָּוִד אָבִי
  choice: 对我父亲大卫
  rationale: 在דבר之后，אֵת引出说话的对象；“对……说话”是自然且贴合语境的汉语。
- source_word: וּבְיָדוֹ מִלֵּא
  choice: 也亲手成就了
  rationale: 保留“手”的意象，并用“成就”表达מִלֵּא在此将所说之事付诸完成的含义；宾语由上文自然领会，不强行补出。
- source_word: לֵאמֹר
  choice: 说：
  rationale: 这是引出下一节直接引语的常用引语形式；冒号使跨节话语衔接自然。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。音译为“雅威”保留其作为以色列之上帝专名的性质，避免用称号取代专名。
- issue: בָּרוּךְ用于上帝时的理解
  choice: 是当受称颂的
  alternative: 愿……蒙福；称颂……
  rationale: 这里不是祈求上帝领受福分，而是宣告他配受称颂；同时以脚注保留希伯来祝颂公式也可较直接译作“称颂雅威”。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“亲口／亲手”保留原文刻意设置的言语与行动之平行；句末“说：”承接下一节尚未出现的直接引语。
