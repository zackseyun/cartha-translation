  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ֠/אַתָּה תִּשְׁמַ֨ע הַ/שָּׁמַ֜יִם מְכ֤וֹן שִׁבְתֶּ֨/ךָ֙ וְ/סָלַחְתָּ֣ וְ/עָשִׂ֔יתָ וְ/נָתַתָּ֤ לָ/אִישׁ֙ כְּ/כָל דְּרָכָ֔י/ו אֲשֶׁ֥ר תֵּדַ֖ע אֶת לְבָב֑/וֹ כִּֽי אַתָּ֤ה יָדַ֨עְתָּ֙ לְ/בַדְּ/ךָ֔ אֶת לְבַ֖ב כָּל בְּנֵ֥י הָ/אָדָֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/039.yaml
  text: then may you hear in heaven[a], the place where you dwell, and forgive, and act, and give to each man according to all his ways, whose heart you know—for you alone know the heart of all the sons of man—
translation:
  language: zh_hans
  text: 那时，求你在天上、你的居所垂听，赦免并采取行动，按各人一切所行的来待他——你知道他的心；唯有你知道所有世人[a]的心。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“所有人的众子”，是指全体人类的惯用语。
    reason: 说明原文的阳性代表性表达及其实际所指。
lexical_decisions:
- source_word: תִּשְׁמַע הַשָּׁמַיִם
  choice: 求你在天上……垂听
  rationale: 未完成式在所罗门的祷告中表达祈求；“求你……垂听”既传达祈愿语气，也符合现代汉语庄重表达。原文“天”前没有明示介词，但结合“你的居所”这一同位说明，语境指向在天上垂听。
- source_word: מְכוֹן שִׁבְתֶּךָ
  choice: 你的居所
  rationale: מְכוֹן指固定、确立的所在；“你的居所”简洁自然，并保留地点含义。
- source_word: וְסָלַחְתָּ וְעָשִׂיתָ
  choice: 赦免并采取行动
  rationale: 连续的连接词加完成式延续祷告中的请求。“采取行动”保留עָשָׂה在此处宽泛的回应含义，不擅自限定上帝将如何行动。
- source_word: וְנָתַתָּ לָאִישׁ כְּכָל דְּרָכָיו
  choice: 照各人一切所行的待他
  rationale: לָאִישׁ在此具有逐一分配的意义；דֶּרֶךְ的“道路”比喻在汉语中自然转为人的行为。“待他”保留וְנָתַתָּ较宽的施予或报应含义，避免预先判定结果只奖或只罚。
- source_word: אֲשֶׁר תֵּדַע אֶת לְבָבוֹ
  choice: 因为你知道他的心
  rationale: 关系词אֲשֶׁר在此可表达与上文相关的理由或说明；汉语用“因为”清楚连接上帝按行为对待个人与上帝洞察其心之间的关系。
- source_word: לְבָב / לְבָבוֹ
  choice: 心
  rationale: “心”保留希伯来语有关内在思想、意志和动机的传统意象，同时在现代汉语中仍然自然可懂。
- source_word: לְבַדְּךָ
  choice: 唯有你
  rationale: 准确表达上帝独有这种认识的排他性强调。
- source_word: כָּל בְּנֵי הָאָדָם
  choice: 所有世人
  rationale: 该希伯来语短语是指全体人类的惯用语。“所有世人”在现代汉语中自然、庄重，也准确表达其集合性范围；脚注说明其字面形式。
theological_decisions:
- issue: 上帝按各人的行为施予或报应
  choice: 照各人一切所行的待他
  alternative: 照各人一切所行的报应他
  rationale: 原文וְנָתַתָּ本义宽泛，既可包含赏赐，也可包含审判中的报应。“待他”保留这种张力，不把经文限定为单一负面结果。
- issue: כָּל בְּנֵי הָאָדָם的人类学表达
  choice: 所有世人
  alternative: 所有人的众子
  rationale: 原文使用阳性代表性的希伯来惯用语，但僵硬直译在现代汉语中会造成误解。“所有世人”传达实际所指的全体人类，脚注则保留原文的字面意象。
- issue: 上帝独知人心
  choice: 唯有你知道所有世人的心
  alternative: 你独自知道所有人的内心
  rationale: 保留לְבַדְּךָ的排他性与“心”的圣经意象，既不削弱上帝独有的洞察，也不额外发展系统神学命题。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语言。“垂听”“居所”“唯有”保留经文语体的尊严；其余措辞避免过度文言化。分号呈现末句理由与强调之间的转折层次。
