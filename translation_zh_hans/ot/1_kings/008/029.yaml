  text: לִ/הְיוֹת֩ עֵינֶ֨/ךָ פְתֻח֜וֹת אֶל הַ/בַּ֤יִת הַ/זֶּה֙ לַ֣יְלָה וָ/י֔וֹם אֶל הַ֨/מָּק֔וֹם אֲשֶׁ֣ר אָמַ֔רְתָּ יִהְיֶ֥ה שְׁמִ֖/י שָׁ֑ם לִ/שְׁמֹ֨עַ֙ אֶל הַ/תְּפִלָּ֔ה אֲשֶׁ֣ר יִתְפַּלֵּ֣ל עַבְדְּ/ךָ֔ אֶל הַ/מָּק֖וֹם הַ/זֶּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/029.yaml
  text: that your eyes may be open toward this house night and day[a], toward the place of which you said, ‘My name will be there,’ to hear the prayer that your servant prays toward this place.
translation:
  language: zh_hans
  text: 愿你的眼目昼夜向着这殿敞开，向着你曾说“我的名必在那里”[a]的那地方，为要垂听你仆人向这地方祷告的祷告。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “我的名必在那里”是与圣殿有关的表达，表示上帝拣选并认定这地方，也含有他立约同在的意思；但原文仍特意说“我的名”，不宜只改译成“我的同在”。
    reason: 解释“名在那里”的圣殿用语，同时保留原文的神学张力。
lexical_decisions:
- source_word: לִהְיוֹת עֵינֶךָ פְתֻחוֹת
  choice: 愿你的眼目……看顾
  rationale: לִהְיוֹת承接上文祈求；“眼目……看顾”保留拟人意象，同时以现代汉语自然表达眼睛向某处敞开、持续关注之意。
- source_word: אֶל הַבַּיִת הַזֶּה
  choice: 这殿
  rationale: 此处הַבַּיִת指刚建成的圣殿；译作“殿”比“房屋”更符合中文语境，方向意义融入“看顾这殿”。
- source_word: לַיְלָה וָיוֹם
  choice: 昼夜
  rationale: 保留希伯来语表示持续不断的成对用语，在现代庄重汉语中简洁自然。
- source_word: אֶל הַמָּקוֹם
  choice: 地方
  rationale: 保留מָקוֹם的基本意义及本节反复出现的地点主题，不把它解释性改译为“圣所”。
- source_word: יִהְיֶה שְׁמִי שָׁם
  choice: 我的名必在这里
  rationale: 直译关键的圣殿神学用语，不将“名”改写为“同在”或“居住”；“必”在引语中自然表达未完成式所指的确定将来。
- source_word: לִשְׁמֹעַ אֶל הַתְּפִלָּה
  choice: 求你垂听……祷告
  rationale: לִשְׁמֹעַ在语境中延续祈求目的；“垂听”符合向上帝祷告的庄重现代汉语，并体现有回应的聆听。
- source_word: יִתְפַּלֵּל עַבְדְּךָ
  choice: 你仆人……所作的祷告
  rationale: 用关系结构自然表达同源词“祷告／祈祷”的动作；“仆人”符合君王在上帝面前自谦的称谓。
- source_word: אֶל הַמָּקוֹם הַזֶּה
  choice: 向这地方
  rationale: 明确保留אֶל所表示的朝向，体现祷告者面向圣殿祷告的姿态。
theological_decisions:
- issue: 上帝眼目敞开的拟人表达
  choice: 保留“你的眼目”，以“看顾”表达其朝向和关注
  alternative: 愿你的眼目向这殿睁开
  rationale: 原文以身体意象描写上帝留意圣殿；中文若机械直译“眼目敞开”较生硬，因此保留核心拟人意象而采用自然动词，未将其完全抽象化为“关注”。
- issue: “我的名必在那里”的含义
  choice: 正文保留“我的名必在这里”
  alternative: 我必住在这里／我的同在必在这里
  rationale: “名”是原文重要且含义丰富的圣殿用语，涉及上帝对所选之地的认定和立约性的临在，却不宜在正文中被归约为单一释义。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语体。“昼夜”“眼目”“垂听”“仆人”保留经文的礼仪性语感；句法则按现代汉语调整。脚注标记[a]置于“这殿”之后，使其覆盖随后有关“我的名”的说明，同时避免打断引语。
