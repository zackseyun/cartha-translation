  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: לְמַ֨עַן֙ יִֽרָא֔וּ/ךָ כָּל הַ֨/יָּמִ֔ים אֲשֶׁר הֵ֥ם חַיִּ֖ים עַל פְּנֵ֣י הָ/אֲדָמָ֑ה אֲשֶׁ֥ר נָתַ֖תָּה לַ/אֲבֹתֵֽי/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/040.yaml
  text: so that they may fear you all the days that they live on the face of the land that you gave to our fathers[a][b][c].
translation:
  language: zh_hans
  text: 使他们在你赐给我们祖先[c]的这片土地[a]上，一生的每一天[b]都敬畏你。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“这片地面上”；也可较宽泛地译作“大地上”。这里因下文说这是神赐给祖先的，故译作“土地”。
    reason: lexical_alternative
  - marker: b
    text: 直译：“他们活着的所有日子”；意思是“只要他们活着”或“一生”。
    reason: lexical_alternative
  - marker: c
    text: 或译：“先祖”。希伯来语直译为“我们的父辈”。
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן
  choice: 使
  rationale: 引出所祈求的目的或结果；与后面的“都敬畏你”搭配，符合现代汉语表达。
- source_word: יִרָאוּךָ
  choice: 敬畏你
  rationale: 希伯来语 ירא 在以神为对象时兼有惧怕、尊崇和肃然起敬之意；“敬畏”保留其圣经神学分量，又比单说“害怕”准确。
- source_word: כָּל הַיָּמִים אֲשֶׁר הֵם חַיִּים
  choice: 一生的每一天
  rationale: 原文直译近于“他们活着的所有日子”；此译自然地表达其完整持续的时间范围，同时保留“每一天”的意象。
- source_word: עַל פְּנֵי הָאֲדָמָה
  choice: 在这片土地上
  rationale: 原文是“在土地的表面上”。鉴于下文限定为神赐给祖先之地，此处指应许之地；汉语无需生硬保留“表面”这一惯用成分。
- source_word: אֲשֶׁר נָתַתָּה
  choice: 你赐给
  rationale: 表达神已经把土地赐下的行动；“赐给”符合向神祷告的庄重语境。
- source_word: לַאֲבֹתֵינוּ
  choice: 给我们祖先
  rationale: אָבוֹת 字面为“父辈、父亲们”，在这里指以色列承受应许的历代先祖；“祖先”是现代汉语中自然且语境准确的表达。
theological_decisions:
- issue: 如何表达对神的 ירא
  choice: 敬畏你
  alternative: 惧怕你；尊崇你
  rationale: “敬畏”兼顾畏惧与尊崇，不把盟约语境中的属灵态度缩减为单纯恐惧或一般敬重。
- issue: הָאֲדָמָה 的范围
  choice: 这片土地
  alternative: 大地；地上
  rationale: 紧接着的关系从句说明这是神赐给“我们祖先”的土地，因此语境首先指以色列所得之地，而非泛指全世界。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“这片土地”明确承接赐地语境；“一生的每一天”既流畅，也尽量保留原文“所有日子”的表达。脚注标记均置于相应词语之后。
