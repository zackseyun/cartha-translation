id: 1KI.8.28
reference: 1 Kings 8:28
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וּ/פָנִ֜יתָ אֶל תְּפִלַּ֧ת עַבְדְּ/ךָ֛ וְ/אֶל תְּחִנָּת֖/וֹ יְהוָ֣ה אֱלֹהָ֑/י לִ/שְׁמֹ֤עַ אֶל הָֽ/רִנָּה֙ וְ/אֶל הַ/תְּפִלָּ֔ה אֲשֶׁ֧ר עַבְדְּ/ךָ֛ מִתְפַּלֵּ֥ל לְ/פָנֶ֖י/ךָ הַ/יּֽוֹם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/028.yaml
  text: Yet turn toward the prayer of your servant and to his plea for favor[a], O Yahweh my God[b], to hear the cry and the prayer that your servant is praying before you today.
translation:
  language: zh_hans
  text: 然而，雅威我的上帝啊，求你垂顾你仆人的祷告和恳求[a]，垂听你仆人今天在你面前所发的呼求[b]和祷告。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“求恩的恳求”。希伯来词指迫切求取怜悯或恩惠。
    reason: lexical_alternative
  - marker: b
    text: 或译“响亮的呼声”。这里的希伯来词可指大声呼喊或欢呼；在本节中是向上帝发出的呼求。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפָנִיתָ
  choice: 然而……求你垂顾
  rationale: פנה本义为“转向”，在祷告语境中表示留意、眷顾。译作“垂顾”自然庄重，也保留恳求上帝关注的含义；“然而”承接上一节关于上帝超越性的陈述，体现ו在语境中的轻微转折。
- source_word: תְּפִלַּת / הַתְּפִלָּה
  choice: 祷告
  rationale: תפלה在本节出现两次，均直译为“祷告”，保留希伯来文的重复和平行结构。
- source_word: עַבְדְּךָ
  choice: 你仆人
  rationale: עבד在这里是人在上帝面前谦卑自称，译作“仆人”比“奴隶”更符合王室及圣约祷告语境；两处均保持一致。
- source_word: תְּחִנָּתוֹ
  choice: 恳求
  rationale: תחנה指迫切求取怜悯或恩惠；“恳求”是现代汉语中自然、庄重的对应词，并以脚注说明其语义侧重。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语音译呈现四字神名，而不以称号替代，表明原文此处使用的是以色列上帝的专名。
- source_word: אֱלֹהָי
  choice: 我的上帝
  rationale: 直接表达第一人称所属关系，并保留呼语功能。
- source_word: לִשְׁמֹעַ
  choice: 垂听
  rationale: שמע意为“听、听取”；在向上帝祈求的语境中，“垂听”自然庄重，并与前面的“垂顾”衔接。
- source_word: הָרִנָּה
  choice: 呼求
  rationale: רנה可指响亮的呼喊、欢呼或歌声；在与祷告、恳求并列的语境中，“呼求”最贴切，同时以脚注保留“响亮呼声”的词义可能。
- source_word: מִתְפַּלֵּל
  choice: 所发的……祷告
  rationale: 分词表示正在进行的祷告行为；中文以“今天在你面前所发的……祷告”自然表达当前行为。
- source_word: לְפָנֶיךָ
  choice: 在你面前
  rationale: 贴近原文空间意象，在祷告语境中也自然表达处于上帝面前。
- source_word: הַיּוֹם
  choice: 今天
  rationale: 采用现代汉语直接、自然的时间表达。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；以“主”替代神名
  rationale: 原文明确使用四字神名。译作“雅威”以音译保留专名性质，不以“主”这一称号代替；“耶和华”是汉语传统形式，但较少反映学界通常重建的读音。
- issue: רנה在祷告语境中的情感色彩
  choice: 呼求
  alternative: 呼喊；欢呼；歌唱
  rationale: 该词本身可涵盖响亮呼喊、欢呼等意义；本节与“祷告”和“恳求”平行，宜译为向上帝发出的“呼求”，但不把其响亮、迫切的色彩完全排除，故在脚注中说明。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语言。“垂顾”“垂听”符合汉语宗教语境但不过度古雅；保留两次“祷告”以体现原文重复和平行。脚注标记均置于其所解释的词后。
