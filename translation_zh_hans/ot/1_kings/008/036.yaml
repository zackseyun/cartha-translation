source:
  edition: WLC
  text: וְ/אַתָּ֣ה תִּשְׁמַ֣ע הַ/שָּׁמַ֗יִם וְ/סָ֨לַחְתָּ֜ לְ/חַטַּ֤את עֲבָדֶ֨י/ךָ֙ וְ/עַמְּ/ךָ֣ יִשְׂרָאֵ֔ל כִּ֥י תוֹרֵ֛/ם אֶת הַ/דֶּ֥רֶךְ הַ/טּוֹבָ֖ה אֲשֶׁ֣ר יֵֽלְכוּ בָ֑/הּ וְ/נָתַתָּ֤ה מָטָר֙ עַל אַרְצְ/ךָ֔ אֲשֶׁר נָתַ֥תָּה לְ/עַמְּ/ךָ֖ לְ/נַחֲלָֽה׀־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/036.yaml
  text: then may you hear in heaven and forgive the sin of your servants[a], your people Israel, when you teach them the good way in which they should walk. And may you give rain on your land[b], which you have given to your people as an inheritance.
translation:
  language: zh_hans
  text: 求你在天上垂听，赦免你仆人，就是你子民以色列的罪；因为你教导他们当行的善道[a]。求你降雨在你的地上，就是你赐给你子民作产业的地。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “因为你教导他们当行的善道”也可译作“当你教导他们所当行的善道时”。
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּשְׁמַע הַשָּׁמַיִם
  choice: 在天上垂听
  rationale: 希伯来语字面缺少介词，语境中可理解为“在天上”或“从天上”。正文采用符合汉语祷告语体的“在天上垂听”；“垂听”自然表达向神恳求其听取祷告。
- source_word: וְסָלַחְתָּ לְחַטַּאת
  choice: 赦免……的罪
  rationale: חַטָּאת在此指需要蒙赦免的罪，并非赎罪祭；“赦免……的罪”准确、清楚。
- source_word: עֲבָדֶיךָ וְעַמְּךָ יִשְׂרָאֵל
  choice: 你仆人，就是你子民以色列
  rationale: “仆人”保留 עֶבֶד 在向神祷告时的臣属含义；“就是”把“你子民以色列”处理为同位说明，避免误解为两个彼此分开的群体。
- source_word: כִּי תוֹרֵם
  choice: 因为你教导他们
  rationale: כִּי可表示“因为”或在语境中作时间性理解。此处采用其常见因果义，不把原文的逻辑明确改写为时间从句；ירה的使役形译为“教导”。
- source_word: הַדֶּרֶךְ הַטּוֹבָה אֲשֶׁר יֵלְכוּ בָהּ
  choice: 他们当行的善道
  rationale: “善道”保留“好的道路”这一生活道路的比喻；“当行”表达未完成式在此所含的规范性，即他们应当遵行的道路。
- source_word: וְנָתַתָּה מָטָר
  choice: 求你降雨
  rationale: נתן字面为“给”，与“雨”搭配时现代汉语自然说“降雨”。加“求你”延续所罗门祈求的语气，而不将其译成叙事性陈述。
- source_word: עַל אַרְצְךָ
  choice: 在你的地上
  rationale: 保留第二人称后缀所表达的神对土地的所有权。
- source_word: אֲשֶׁר נָתַתָּה לְעַמְּךָ לְנַחֲלָה
  choice: 就是你赐给你子民作产业的地
  rationale: נַחֲלָה在土地语境中指承受的产业。“作产业”既简明，也保留土地由神赐予以色列的盟约背景。
theological_decisions:
- issue: 土地既属于神，又赐给以色列为产业
  choice: 你的地上，就是你赐给你子民作产业的地
  alternative: 你赐给你子民作产业的地上
  rationale: 原文先称土地为“你的地”，又说神将它赐给子民。正文保留二者，既不抹去神的所有权，也不削弱以色列受赐产业的事实。
- issue: כִּי所表达的因果或时间关系
  choice: 因为你教导他们
  alternative: 当你教导他们时
  rationale: כִּי本身允许因果等多种语义。正文采用常见因果义，并以脚注保留时间性理解，避免把有根据的歧义完全消除。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语体。“垂听”“赦免”“善道”“产业”保留经文庄严感，但句法保持现代汉语清晰度。同位结构用“就是”明确“仆人”指神的子民以色列。
