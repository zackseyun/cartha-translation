  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/לֹֽא יָכְל֧וּ הַ/כֹּהֲנִ֛ים לַ/עֲמֹ֥ד לְ/שָׁרֵ֖ת מִ/פְּנֵ֥י הֶֽ/עָנָ֑ן כִּי מָלֵ֥א כְבוֹד יְהוָ֖ה אֶת בֵּ֥ית יְהוָֽה־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/011.yaml
  text: and the priests were not able to stand to minister because of the cloud[b][a], for the glory of Yahweh filled the house of Yahweh.
translation:
  language: zh_hans
  text: 祭司因云彩而不能站立供职[a]，因为雅威的荣耀充满了雅威的殿[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“不能站着事奉”。
    reason: lexical_alternative
  - marker: b
    text: 直译“雅威的家”，这里指圣殿。
    reason: lexical_alternative
lexical_decisions:
- source_word: יָכְלוּ
  choice: 不能
  rationale: 该动词表达能力或承受力；“不能”简明保留祭司无力继续履职的意思，不另加原因。
- source_word: הַכֹּהֲנִים
  choice: 祭司
  rationale: 这是圣殿礼仪语境中该词的标准现代汉语译法。
- source_word: לַעֲמֹד
  choice: 站立
  rationale: 保留“不仅无法供职，也无法站立”的具体形象；不擅自解释为离开岗位。
- source_word: לְשָׁרֵת
  choice: 供职
  rationale: 此处指祭司履行礼仪职务；“供职”比一般的“服事”更明确地体现正式职分，同时不限定具体仪式。
- source_word: מִפְּנֵי הֶעָנָן
  choice: 因云彩
  rationale: מִפְּנֵי 在这里自然表达原因；“因云彩”既忠实又简洁。
- source_word: כִּי
  choice: 因为
  rationale: 引出祭司不能站立供职的进一步解释，使两分句的因果关系在现代汉语中清楚自然。
- source_word: מָלֵא
  choice: 充满了
  rationale: 该完成式陈述荣耀已经充满圣殿的事实；汉语以“了”自然呈现已然状态。
- source_word: כְבוֹד יְהוָה
  choice: 雅威的荣耀
  rationale: 保留“荣耀”的原有神学意象，不将其释义为“同在”或“荣光”。
- source_word: בֵּית יְהוָה
  choice: 雅威的殿
  rationale: בַּיִת 字面为“家、房屋”，在本段明确指圣殿；正文译作“殿”符合现代汉语语境，字面形式置于脚注。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见音译呈现四字神名，保留其作为以色列之神专名的性质，而不以称号替代。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；“雅威”较贴近学界通常采用的发音重构，并明确保留专名。
- issue: כְבוֹד יְהוָה 的含义
  choice: 雅威的荣耀
  alternative: 雅威的同在；雅威的荣光
  rationale: 直译“荣耀”保留其可见彰显、威严及神圣临在之间的丰富张力，不把这一意象收窄为单一解释。
- issue: בֵּית יְהוָה 的指称
  choice: 雅威的殿
  alternative: 雅威的家
  rationale: 上下文所指是圣殿，正文采用自然而准确的“殿”；脚注同时保存希伯来语“家”的字面意象。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“站立供职”保留原文两个不定式的结构与祭司礼仪语境；两个“雅威”照原文重复，不以代词替换。
