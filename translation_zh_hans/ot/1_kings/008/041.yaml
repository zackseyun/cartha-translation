  text: וְ/גַם֙ אֶל הַ/נָּכְרִ֔י אֲשֶׁ֛ר לֹא מֵ/עַמְּ/ךָ֥ יִשְׂרָאֵ֖ל ה֑וּא וּ/בָ֛א מֵ/אֶ֥רֶץ רְחוֹקָ֖ה לְמַ֥עַן שְׁמֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/041.yaml
  text: And also concerning the foreigner[a], who is not from your people Israel, but comes from a distant land for the sake of your name—
translation:
  language: zh_hans
  text: 还有，至于那不属于你子民以色列的外邦人[a]，他为了你的名从遥远之地而来——
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“外族人”“外来者”。希伯来语指非以色列人，不只是旅行者。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם אֶל
  choice: 至于
  rationale: 原文以附加语气承接前文，并引出新的代求对象。现代汉语用“至于”可自然地转换话题；本节是延续至下一节的未完句。
- source_word: הַנָּכְרִי
  choice: 外族人
  rationale: 指不属于以色列民族与圣约群体的人，并非仅指旅客。“外族人”在现代汉语中清楚保留这一身份区别。
- source_word: אֲשֶׁר לֹא מֵעַמְּךָ יִשְׂרָאֵל הוּא
  choice: 他不属于你的子民以色列
  rationale: 明确保留外族人与上帝子民以色列之间的群体及圣约区别，同时使汉语表达自然。
- source_word: וּבָא
  choice: 却……而来
  rationale: 希伯来语连接词本身可作简单承接；上下文存在“不属于以色列，却前来”的轻微对比，译文以“却”自然呈现这种关系而不过度加强。
- source_word: מֵאֶרֶץ רְחוֹקָה
  choice: 从远方
  rationale: 原文直指“从遥远之地而来”。“从远方”简洁自然，包含地域遥远之意。
- source_word: לְמַעַן שְׁמֶךָ
  choice: 因你的名
  rationale: 表达来访的缘由或动机。“名”保留圣经中上帝所启示的身份、声誉与作为等丰富内涵，避免释义性展开。
theological_decisions:
- issue: 以色列与前来寻求上帝的非以色列人之间的圣约身份区别
  choice: 外族人，他不属于你的子民以色列
  alternative: 陌生人，他不是你的以色列民
  rationale: 译文既不淡化此人非以色列人的身份，也不暗示他仅是素不相识或暂时旅行的人；同时保留经文所展现的张力：他在圣约群体之外，却因上帝的名而来。
- issue: “你的名”的神学含义
  choice: 因你的名
  alternative: 因你的声名
  rationale: 保留原文“名”的圣经表达，不把它缩减为名声，也不在正文中将其解释为某一单一概念。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“至于”承接前文并开启本段；句末破折号保留原文句法未完、内容延续至下一节的结构。
