  rationale: 修订删除“而来”，使“从……直到……”仅表达原文对全以色列这一大聚集的地域范围界定；同时调整同位语结构，使句子更符合现代庄重书面汉语。保留“雅威”“守节”、地名音译、两个七日的重复和脚注锚点，不将两个七日的具体节期写入正文。
