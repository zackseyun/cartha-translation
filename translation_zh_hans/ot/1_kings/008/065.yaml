  text: וַ/יַּ֣עַשׂ שְׁלֹמֹ֣ה בָֽ/עֵת הַ/הִ֣יא אֶת הֶ/חָ֡ג וְ/כָל יִשְׂרָאֵ֣ל עִמּ/וֹ֩ קָהָ֨ל גָּד֜וֹל מִ/לְּב֥וֹא חֲמָ֣ת עַד נַ֣חַל מִצְרַ֗יִם לִ/פְנֵי֙ יְהוָ֣ה אֱלֹהֵ֔י/נוּ שִׁבְעַ֥ת יָמִ֖ים וְ/שִׁבְעַ֣ת יָמִ֑ים אַרְבָּעָ֥ה עָשָׂ֖ר יֽוֹם־׀־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/065.yaml
  text: At that time Solomon held the feast[a], and all Israel with him, a great assembly from Lebo-hamath to the Brook of Egypt, before Yahweh our God, seven days and seven days[b], fourteen days.
translation:
  language: zh_hans
  text: 那时，所罗门和与他同在的全以色列，就是从利波哈马[a]直到埃及溪[b]的一个大聚集，在雅威我们的神面前守节七日，又七日，共十四日。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“哈马口”。希伯来语既可理解为疆界地名“利波哈马”，也可理解为描述性的“哈马入口”。
    reason: alternative_reading
  - marker: b
    text: 或译“埃及干河”。这里的希伯来词常指季节性水道或干河床，不一定是常年有水的河流。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ ... אֶת הֶחָג
  choice: 守节
  rationale: עָשָׂה与חָג连用，指举行、遵守或庆祝节期；“守节”简洁自然，也符合此处礼仪语境。
- source_word: קָהָל גָּדוֹל
  choice: 一大群会众
  rationale: קָהָל指聚集起来的群体；“会众”保留正式的共同体含义，“一大群”体现גָּדוֹל所表达的规模。
- source_word: מִלְּבוֹא חֲמָת
  choice: 从利波哈马
  rationale: 该表达常作为固定的疆界地名使用，正文采用音译；其也可按普通名词结构理解为“从哈马口”，故在脚注保留。
- source_word: נַחַל מִצְרַיִם
  choice: 埃及溪
  rationale: נַחַל通常指溪流、季节性水道或干河床，并非大河；“埃及溪”自然简明，也避免使人误以为是尼罗河。
- source_word: לִפְנֵי יְהוָה אֱלֹהֵינוּ
  choice: 在雅威我们的神面前
  rationale: לִפְנֵי表达“在……面前／临在中”的空间关系；译文直接保留这一关系。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见音译呈现四字神名，保留原文使用的盟约之名。
- source_word: שִׁבְעַת יָמִים וְשִׁבְעַת יָמִים
  choice: 七日，又七日
  rationale: 保留希伯来文有意重复的两个七日，同时用“又”清楚表达两段连续时日。
- source_word: אַרְבָּעָה עָשָׂר יוֹם
  choice: 共十四日
  rationale: 这是对前述两个七日的同位总结；“共”自然显明总数而不增加实质含义。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名。正文采用“雅威”，既以专名呈现，又不把它替换成称号；其他传统译法不纳入正文。
- issue: 两个“七日”所指的具体节庆安排
  choice: 保留“七日，又七日”的重复
  alternative: 解释为献殿礼七日和住棚节七日
  rationale: 本节本身没有明确为两个七日逐一命名；直译保留其结构和潜在张力，避免把上下文推论写进正文。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“守节”“会众”保留礼仪和群体色彩；调整语序，把疆界范围紧接“会众”，避免汉语读者误以为该范围修饰守节地点或时长。所有脚注标记均置于所解释的词语之后。
