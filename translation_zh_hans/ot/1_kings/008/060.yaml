id: 1KI.8.60
reference: 1 Kings 8:60
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: לְמַ֗עַן דַּ֚עַת כָּל עַמֵּ֣י הָ/אָ֔רֶץ כִּ֥י יְהוָ֖ה ה֣וּא הָ/אֱלֹהִ֑ים אֵ֖ין עֽוֹד־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/060.yaml
  text: so that all the peoples of the earth may know that the LORD, he is God; there is no other.
translation:
  language: zh_hans
  text: 好让地上万民都知道，耶和华是上帝，除他以外，再没有别的。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְמַעַן דַּעַת
  choice: 好让……都知道
  rationale: 表达目的关系；希伯来语不定式结构在现代汉语中自然译作“好让……知道”。
- source_word: כָּל עַמֵּי הָאָרֶץ
  choice: 地上万民
  rationale: “万民”自然概括“所有民族／各族人民”，并保留普世范围。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经传统中广为人知的专名译法，区别于普通称谓“主”。
- source_word: הוּא הָאֱלֹהִים
  choice: 是上帝
  rationale: 汉语系词“是”已自然承载希伯来语独立代词 הוּא 的强调作用；不机械译为“他是上帝”。
- source_word: אֵין עוֹד
  choice: 除他以外，再没有别的
  rationale: 保留原文绝对、排他的断言；“别的”依据上下文指别的上帝，而不补入原文未重复的名词。
theological_decisions:
- issue: יְהוָה הוּא הָאֱלֹהִים 的排他性认信
  choice: 耶和华是上帝
  alternative: 耶和华，他才是上帝
  rationale: 保留身份判断与排他语境，同时避免“才”额外强化对比；下一分句已明确表达排他性。
- issue: אֵין עוֹד 的所指
  choice: 除他以外，再没有别的
  alternative: 再没有别的上帝
  rationale: 不把上下文省略成分直接补进正文，从而贴近原文的简洁与开放句式；代词“他”使中文所指清楚。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“地上万民”简洁且具有经文语体；整句保留目的、普世见证和独一上帝宣认的推进关系。
