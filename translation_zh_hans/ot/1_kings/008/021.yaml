base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/021.yaml
  text: And there I have set a place for the ark[b][a], in which is the covenant of Yahweh that he made with our fathers when he brought them out of the land of Egypt.
translation:
  language: zh_hans
  text: 我在那里为约柜预备了一处地方；约柜中有雅威的约，就是他领我们的列祖出埃及地时与他们所立的约[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “与他们所立的约”原文直译为“与他们所切的约”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאָשִׂם שָׁם מָקוֹם לָאָרוֹן
  choice: 我在那里为约柜安置了一个地方
  rationale: שׂים的基本义是“放置、安置”；与“地方”搭配时，译为“安置了一个地方”既贴近原文，也保留所预备之处的含义。
- source_word: אֲשֶׁר שָׁם בְּרִית יְהוָה
  choice: 约柜里有雅威的约
  rationale: 原文关系结构较为紧缩，直译近似“其中在那里有雅威的约”；中文明确补出“约柜里”，自然表达其方位关系。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以音译呈现四字神名，保留其作为以色列之神专名的性质。
- source_word: כָּרַת עִם אֲבֹתֵינוּ
  choice: 与他们所立的约
  rationale: כרת ברית字面为“切约”，中文惯用“立约”；“他们”回指前面的“我们的先祖”。
- source_word: אֲבֹתֵינוּ
  choice: 我们的先祖
  rationale: 该词字面可作“我们的父辈”，在出埃及的群体语境中指本民族先辈；“先祖”准确而自然，并不将对象限定为近亲父辈。
- source_word: בְּהוֹצִיאוֹ אֹתָם מֵאֶרֶץ מִצְרָיִם
  choice: 他领我们的先祖出埃及地时
  rationale: 介词ב加使役不定式在此表达时间；“领……出”自然呈现使役动词和出埃及方向。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文使用四字神名而非称号；音译“雅威”保留专名性质，也避免以称号替代。
- issue: “雅威的约”与“立约”的关系
  choice: 保留“雅威的约”，并译作“他……与他们所立的约”
  alternative: 将前后合并为“雅威与我们先祖所立的约”
  rationale: 保留原文先说明约柜中有“雅威的约”、随后用关系从句加以界定的层次，且不消除其重复强调。
- issue: אֲבֹתֵינוּ的范围
  choice: 我们的先祖
  alternative: 我们的父辈
  rationale: 本节回顾出埃及世代，所指是以色列人的前代祖先；“先祖”在现代汉语中比“父辈”更符合此历史群体语境。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。保留“约柜—雅威的约—立约”的原文重复与神学关联；仅为中文清晰度补出第二次“约”和“我们的先祖”。
