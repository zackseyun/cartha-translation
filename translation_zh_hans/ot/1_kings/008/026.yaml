base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/026.yaml
  text: And now[a], God of Israel[b], please let your word that you spoke to your servant David my father be confirmed.
translation:
  language: zh_hans
  text: 现在，以色列的上帝啊，求你使你对你的仆人、我的父亲大卫所说的话得以证实[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“得以确立”“显为真实”，也可按意思译作“得以实现”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: 现在
  rationale: 承接所罗门前面的祷告，并表达当前的恳求；现代汉语不必机械译出句首连接词“和”。
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: 以色列的上帝啊
  rationale: 按呼格理解；“啊”自然传达祷告中的直接称呼。
- source_word: יֵאָמֶן נָא
  choice: 求你使……得以证实
  rationale: 兼顾נָא的恳求语气，以及אמן的尼法勒式所表达的被证实、确立为可靠之意。
- source_word: דבריך
  choice: 你……所说的话
  rationale: 原文为复数“你的话语”，汉语“所说的话”可自然表达集合意义，无须强行标明单复数，也不提前释为“应许”。
- source_word: אֲשֶׁר דִּבַּרְתָּ
  choice: 你……所说的
  rationale: 直接保留关系从句和“说”的基本意义，避免把上下文所暗示的应许性质写进正文。
- source_word: לְעַבְדְּךָ
  choice: 对你仆人
  rationale: 此处指大卫在上帝面前的身份，“仆人”符合祷告与君王语境。
- source_word: דָּוִד אָבִי
  choice: 我父亲大卫
  rationale: 采用现代汉语更自然的亲属称谓次序，同时保留大卫既是说话者之父、也是上帝仆人的双重关系。
theological_decisions:
- issue: 所罗门请求上帝怎样对待先前向大卫所说的话
  choice: 译为“使……所说的话得以证实”
  alternative: “使……确立”或“使……实现”
  rationale: 原文既含坚定、确立之意，也在语境中指向所说之话的兑现。正文保留“证实”的被动意味，不把它完全改写成“实现应许”，从而保留词义张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“求你使……”清楚表达祷告中的恳求；“你仆人、我父亲大卫”以顿号式停顿呈现同位关系，便于普通读者理解。
