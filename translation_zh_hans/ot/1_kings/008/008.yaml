  naturalness: 原句的“从圣所、在内殿前面可以看见”因顿号式逗隔造成句法滞涩，读者不易立即辨明“圣所”与“内殿前面”的空间关系。修订后语序清晰、庄重，符合现代标准汉语。
  terminology: 保留“圣所”与“内殿”的技术性区分；“至圣所”作为脚注中的常用替代译名保留。将“杠头”改为“杠的末端”，不改变器物或空间含义。
