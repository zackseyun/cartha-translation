base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/008.yaml
  text: And the poles were so long that the ends of the poles were seen from the Holy Place before the inner sanctuary[a], but they could not be seen from outside; and they are there to this day.
translation:
  language: zh_hans
  text: 杠很长，以致在内殿前面的圣所里可以看见杠的末端[a]，从外面却看不见；它们直到今日还在那里。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “内殿”或译“至圣所”；希伯来语这个词指圣殿的内室。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּאֲרִכוּ הַבַּדִּים
  choice: 两根杠很长
  rationale: ארך在此描述杠伸得很长；结合下文可见杠头的结果，用状态式表达自然清楚。上下文所指为约柜的两根抬杠，故补出量词“两根”。
- source_word: וַיֵּרָאוּ רָאשֵׁי הַבַּדִּים
  choice: 杠头……可以看见
  rationale: רָאשֵׁי直译为“头”，用于杠时译作“杠头”自然；ראה的尼法勒式表示可见，译作“可以看见”也与后面的“看不见”形成对应。
- source_word: מִן הַקֹּדֶשׁ
  choice: 从圣所
  rationale: 此处הַקֹּדֶשׁ指圣殿外间，与内殿有别；“圣所”简洁并保留建筑空间上的区分。
- source_word: עַל פְּנֵי הַדְּבִיר
  choice: 在内殿前面
  rationale: דְּבִיר指安放约柜的圣殿内室；עַל־פְּנֵי在此表示“在……前面”。译文保留它与前一介词短语的空间关系。
- source_word: וְלֹא יֵרָאוּ הַחוּצָה
  choice: 从外面却看不见
  rationale: הַחוּצָה具有向外、在外的副词意义；依上下文译为“从外面”，与“从圣所”形成明确对照。
- source_word: וַיִּהְיוּ שָׁם עַד הַיּוֹם הַזֶּה
  choice: 它们直到今日还在那里
  rationale: 这是希伯来叙事中表示某状态延续至叙述者当时的惯用语；“直到今日还在那里”符合现代汉语表达。
theological_decisions:
- issue: דְּבִיר的圣殿术语表达
  choice: 内殿
  alternative: 至圣所
  rationale: “内殿”直接表达该词所指的圣殿内室，不先行把建筑名称解释为传统神学术语；“至圣所”作为常见对应保留在脚注中。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“杠头”与“内殿”简洁准确；保留原文关于观看位置的紧凑空间表述，不把它改写成更具体但原文未明说的建筑解释。
