base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/058.yaml
  text: that he may incline our hearts to himself[a], to walk in all his ways and to keep his commandments, his statutes, and his judgments, which he commanded our fathers.
translation:
  language: zh_hans
  text: 愿他使我们的心归向他，使我们行在他一切的道路上，并谨守他的诫命、律例和典章，即他所吩咐我们列祖的。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְהַטּוֹת
  choice: 使……归向
  rationale: 使役式不定词表示“使转向、使倾向”。“使我们的心归向他”在现代汉语中自然，也保留内心受引导而转向上帝的意象。
- source_word: לְבָבֵנוּ
  choice: 我们的心
  rationale: לֵבָב涵盖思想、意志和情感；“心”保留希伯来语的人观及经文惯用表达。
- source_word: אֵלָיו
  choice: 归向他
  rationale: 介词及代词后缀表达朝向上帝；与“归向”搭配，清楚传达方向性。
- source_word: לָלֶכֶת בְּכָל דְּרָכָיו
  choice: 行在他一切的道路上
  rationale: 保留“行走—道路”的盟约性隐喻，指按上帝的旨意生活；表达庄重且可理解。
- source_word: וְלִשְׁמֹר
  choice: 谨守
  rationale: שׁמר用于诫命时意为遵守、持守；“谨守”体现持续而慎重的遵行。
- source_word: מִצְוֺתָיו
  choice: 他的诫命
  rationale: מִצְוָה指受命的义务；“诫命”是准确而通行的圣经法律用语。
- source_word: וְחֻקָּיו
  choice: 律例
  rationale: חֹק/חֻקָּה指制定、颁定的规条；“律例”可与“诫命”和“典章”保持术语区分。
- source_word: וּמִשְׁפָּטָיו
  choice: 典章
  rationale: מִשְׁפָּט可指判例、法令或司法规定；“典章”在此保留法律色彩，并避免与“律例”合并。
- source_word: אֲשֶׁר צִוָּה
  choice: 就是他吩咐……的
  rationale: 关系从句回指前述三类律法。“就是”使汉语修饰关系清楚，“吩咐”直接对应命令之义。
- source_word: אֶת אֲבֹתֵינוּ
  choice: 我们列祖
  rationale: אָבוֹתֵינוּ字面为“我们的父辈”，在以色列历史语境中指历代先祖；“列祖”既保留男性祖辈用语，也符合庄重的现代圣经汉语。
theological_decisions:
- issue: 盟约律法三联词的译法
  choice: 诫命、律例和典章
  alternative: 命令、法令和判例
  rationale: 原文使用三个不同的法律术语。分别翻译可保留盟约文本的层次，不将其笼统化为同一概念。
- issue: 上帝使人的心转向他与人的遵行之间的关系
  choice: 使他使我们的心归向他，行在……谨守……
  alternative: 愿他使我们的心归向他，好叫我们行在……并谨守……
  rationale: 原文由连续的不定词表达目的或结果关系，但未明确标出汉语“好叫”的强因果连接。正文保留这种紧凑结构，不进一步界定神的作为与人的遵行之间的系统神学关系。
- issue: 祖辈称谓的性别与范围
  choice: 我们列祖
  alternative: 我们的祖先
  rationale: 原文使用阳性复数亲属词，语境指以色列的先辈。“列祖”保留源语形式与历史盟约语感；不以中性词消解其措辞。
translation_notes:
  register: 采用现代、庄重而通顺的普通话书面语；保留“行在道路上”的圣经隐喻以及“诫命、律例、典章”的法律术语区分。原文没有需要用脚注标示的文本异读或必须说明的歧义，因此正文不设脚注。
