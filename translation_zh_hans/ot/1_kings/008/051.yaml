base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/051.yaml
  text: For they are your people and your inheritance[a], whom you brought out of Egypt[b], out of the midst of the iron furnace.
translation:
  language: zh_hans
  text: 因为他们是你的子民、你的产业[a]，是你从埃及、从铁炉[b]中领出来的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “产业”也可译作“基业”或“所得的份”，在这里表示以色列是归属上帝的子民。
    reason: lexical_alternative
  - marker: b
    text: “铁炉”是比喻，把埃及描写为使人遭受严酷压迫和苦难之地。参申命记4:20。
    reason: cross_reference
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上下文，为所罗门的祈求说明理由；现代汉语用“因为”自然且准确。
- source_word: עַמְּךָ
  choice: 你的子民
  rationale: 表达以色列与上帝的立约关系；“子民”庄重、自然，也比泛称“人民”更贴合语境。
- source_word: וְנַחֲלָתְךָ
  choice: 是你的产业
  rationale: נַחֲלָה可指承受所得的产业或所属之份；“产业”保留归属与立约意味，同时避免将其仅理解为后世继承的财物。
- source_word: הֵם
  choice: 他们是
  rationale: 保留独立代词的强调作用，并按汉语补出判断结构。
- source_word: אֲשֶׁר
  choice: 是……的
  rationale: 采用汉语关系分句结构，回指前面的“他们”，使全句流畅。
- source_word: הוֹצֵאתָ
  choice: 领出来
  rationale: 该词为使动义，表示使其出去；“领出来”既体现出埃及行动，也适合上帝带领子民的语境。
- source_word: מִמִּצְרַיִם
  choice: 从埃及
  rationale: 准确表达离开埃及的起点，并与后面的第二个מִן短语并列。
- source_word: מִתּוֹךְ
  choice: 从……中
  rationale: 保留“从内部出来”的空间意象，同时符合现代汉语习惯。
- source_word: כּוּר הַבַּרְזֶל
  choice: 铁炉
  rationale: 直译并保留原文隐喻，指如炼铁炉一般严酷的受压迫之地，不在正文中将隐喻解释掉。
theological_decisions:
- issue: 以色列被称为上帝的נַחֲלָה
  choice: 正文译作“你的产业”
  alternative: 你的基业；你所得的份
  rationale: “产业”能够承载所属、分得之份及立约归属的意味，又不强行限定为某一种系统神学意义。
- issue: “铁炉”隐喻的处理
  choice: 在正文保留“铁炉”
  alternative: 炼铁炉；苦难的熔炉
  rationale: 原文以简洁隐喻描写埃及的严酷压迫；直译保留其形象和张力，解释放入脚注。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“子民”和“产业”保留立约语境；重复“从”以反映希伯来文两个介词短语，并以“铁炉”保留原文鲜明隐喻。
