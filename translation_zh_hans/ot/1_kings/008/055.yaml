id: 1KI.8.55
reference: 1 Kings 8:55
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַֽ/יַּעְמֹ֕ד וַ/יְבָ֕רֶךְ אֵ֖ת כָּל קְהַ֣ל יִשְׂרָאֵ֑ל ק֥וֹל גָּד֖וֹל לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/055.yaml
  text: 'And he stood and blessed all the assembly of Israel with a loud voice[b][a], saying:'
translation:
  language: zh_hans
  text: 他站起来，大声[a]为以色列全体会众[b]祝福，说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“用宏大的声音”，即“大声”。
    reason: lexical_alternative
  - marker: b
    text: “会众”也可译作“集会”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעְמֹד
  choice: 他站起来
  rationale: עמד的基本义是“站立”；在叙事次序中，此处自然译作“站起来”，表示所罗门接着起身面向会众。
- source_word: וַיְבָרֶךְ
  choice: 祝福
  rationale: ברך在此指向聚集的百姓宣告祝福；保留“祝福”既简洁，也不额外界定祝福产生作用的方式。
- source_word: כָּל קְהַל יִשְׂרָאֵל
  choice: 以色列全体会众
  rationale: קהל指聚集起来的群体；“全体会众”自然表达其公共、集体含义，并体现כָּל“全体”。
- source_word: קוֹל גָּדוֹל
  choice: 大声
  rationale: 该短语直译为“大声音”，在这里是表示音量的惯用说法；现代汉语以“大声”最为自然。
- source_word: לֵאמֹר
  choice: 说：
  rationale: 该不定式引出下文的讲话内容；汉语用“说：”自然衔接下一节的直接引语。
theological_decisions:
- issue: 所罗门“祝福”以色列会众的性质
  choice: 保留“祝福”，理解为所罗门向聚集的百姓宣告祝福
  alternative: 将其解释为所罗门凭自身权能赐下神圣恩惠
  rationale: 希伯来语ברך可指在正式公共场合宣告祝福；本节没有说明祝福发挥作用的神学机制，因此译文不作超出原文的限定。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“站起来……祝福，说”保留希伯来叙事的动作次序；脚注标记均置于正文对应词语之后。
