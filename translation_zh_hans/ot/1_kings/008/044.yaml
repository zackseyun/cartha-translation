  text: כִּי יֵצֵ֨א עַמְּ/ךָ֤ לַ/מִּלְחָמָה֙ עַל אֹ֣יְב֔/וֹ בַּ/דֶּ֖רֶךְ אֲשֶׁ֣ר תִּשְׁלָחֵ֑/ם וְ/הִתְפַּֽלְל֣וּ אֶל יְהוָ֗ה דֶּ֤רֶךְ הָ/עִיר֙ אֲשֶׁ֣ר בָּחַ֣רְתָּ בָּ֔/הּ וְ/הַ/בַּ֖יִת אֲשֶׁר בָּנִ֥תִי לִ/שְׁמֶֽ/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/044.yaml
  text: When your people go out to battle against their enemy by the way you send them[a], and they pray to Yahweh toward the city that you have chosen and the house that I have built for your name[b],
translation:
  language: zh_hans
  text: 你的子民若出去与仇敌争战，走在你所差遣他们走的路上，并向着你所拣选的城和我为你的名所建造的殿，向耶和华祷告，
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: 若
  rationale: 本节在所罗门祷告的一连串设想中引出条件情形；“若”自然保留其或然性，不把事件说成必然发生。
- source_word: יֵצֵא עַמְּךָ לַמִּלְחָמָה עַל אֹיְבוֹ
  choice: 你的子民……出去，与仇敌争战
  rationale: 保留“出去”的具体军事用语；עַם 是集合名词，中文以“子民”搭配单数概念的“仇敌”自然通顺。
- source_word: בַּדֶּרֶךְ אֲשֶׁר תִּשְׁלָחֵם
  choice: 照你所差遣他们的路
  rationale: דֶּרֶךְ 可指道路、路线或行动进程；此译保留“路”的意象，同时表达这次出征是按上帝的差遣。
- source_word: וְהִתְפַּלְלוּ אֶל יְהוָה
  choice: 向耶和华祷告
  rationale: התפלל 是常用的“祷告”；将四字神名 יְהוָה 译为现代中文圣经传统中通行的专名“耶和华”。
- source_word: דֶּרֶךְ הָעִיר
  choice: 向着……城
  rationale: 此处 דֶּרֶךְ 表示祷告所朝的方向，“向着”准确而自然。
- source_word: הָעִיר אֲשֶׁר בָּחַרְתָּ בָּהּ
  choice: 你所拣选的城
  rationale: 严格保留原文只说明上帝拣选这城，不从上下文补入“立名”等内容。
- source_word: וְהַבַּיִת אֲשֶׁר בָּנִתִי לִשְׁמֶךָ
  choice: 和我为你名所建的殿
  rationale: בַּיִת 字面为“房屋”，但在此明确指圣殿；中文用“殿”既清楚又保留祭祀建筑的庄重语域。“为你名”保留重要的圣经表达。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用以色列上帝的专名。现代汉语圣经读者最熟悉“耶和华”；同时不以“主”替代专名。其古代发音通常重构为“雅威”，但正文采用通行中文形式。
- issue: הַבַּיִת 的圣殿指向
  choice: 殿
  alternative: 房屋
  rationale: 原词字面为“房屋”，在本段却专指所罗门所建的圣殿。译作“殿”避免现代读者误解，同时不额外加入原文没有的限定语。
- issue: 条件句的或然性
  choice: 若
  alternative: 当……时
  rationale: כִּי 在此可引出“当/若”的情形。选“若”保留祷告中的条件性，不暗示这场出征必定发生。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。句末保留逗号，因为本节的条件句和祈求动作在下一节继续。正文避免补入原文未明说的神学解释。
