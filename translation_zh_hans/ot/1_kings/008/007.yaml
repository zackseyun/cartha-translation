  text: For the cherubim spread out their wings over the place of the ark[a], and the cherubim overshadowed the ark and its poles from above.
translation:
  language: zh_hans
  text: 因为基路伯向着约柜所在之处展开翅膀[a]；基路伯从上面遮盖约柜和它的杠。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“朝着约柜所在之处。”希伯来语介词通常表示方向；结合下半句，也可理解为翅膀伸展在约柜所在之处的上方。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 引出对上文的解释或原因，译作“因为”保留希伯来语连接词的说明作用。
- source_word: הַכְּרוּבִים
  choice: 基路伯
  rationale: 采用现代中文圣经语境中通行的音译，指圣所中与约柜相关的有翼形象；希伯来语复数不必在中文词形上标出。
- source_word: פֹּרְשִׂים כְּנָפַיִם
  choice: 张开翅膀
  rationale: 分词描述持续的姿态；中文用“张开”自然表达翅膀处于展开状态。原文没有物主代词，中文也无需补出“他们的”。
- source_word: אֶל מְקוֹם הָאָרוֹן
  choice: 伸向约柜所在之处
  rationale: 保留 אֶל 的方向性“向、朝”，并结合“张开翅膀”补出中文所需的“伸”，不直接把有歧义的介词定译为“在……上方”。
- source_word: וַיָּסֹכּוּ
  choice: 遮盖
  rationale: סכך 表示从上方覆盖、遮蔽；“遮盖”既保留空间图景，也不额外引入保护或荫庇的神学含义。
- source_word: בַּדָּיו
  choice: 抬柜的杠
  rationale: 指搬运约柜所用的杠；补出“抬柜的”可避免现代读者把“杠”误解为其他物件，同时清楚表达其用途。
- source_word: מִלְמָעְלָה
  choice: 从上面
  rationale: 直接保留动作的方位，说明基路伯在约柜及其杠的上方形成遮盖。
