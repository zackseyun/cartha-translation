source:
  edition: WLC
  text: וַ/יָּבִ֣אוּ הַ֠/כֹּהֲנִים אֶת אֲר֨וֹן בְּרִית יְהוָ֧ה אֶל מְקוֹמ֛/וֹ אֶל דְּבִ֥יר הַ/בַּ֖יִת אֶל קֹ֣דֶשׁ הַ/קֳּדָשִׁ֑ים אֶל תַּ֖חַת כַּנְפֵ֥י הַ/כְּרוּבִֽים־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/006.yaml
  text: Then the priests brought the ark of the covenant of Yahweh to its place[a], into the inner sanctuary of the house, into the Most Holy Place[b], under the wings of the cherubim.
translation:
  language: zh_hans
  text: 祭司把雅威的约柜带到它应放的位置：圣殿[a]的内殿，就是至圣所[b]，安放在基路伯的翅膀下。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文作“房屋”；这里指圣殿。
    reason: lexical_alternative
  - marker: b
    text: 或译“圣中之圣”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבִאוּ
  choice: 抬到
  rationale: 该叙事性动词表示祭司将约柜带入指定地点；结合约柜这一实物，用“抬到”符合现代汉语习惯，也贴合上下文中的搬运场景。
- source_word: הַכֹּהֲנִים
  choice: 祭司
  rationale: 准确表达带定冠词的复数名词，指执行圣殿职务并搬运约柜的祭司。
- source_word: אֲרוֹן בְּרִית יְהוָה
  choice: 雅威的约柜
  rationale: “约柜”是 אֲרוֹן בְּרִית 在现代汉语圣经语境中清楚而通行的表达；所属关系保留为“雅威的”。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语中较通行的音译呈现四字神名，保留其作为以色列之神专名的性质，而不以称号替代。
- source_word: מְקוֹמוֹ
  choice: 它的位置
  rationale: 阴性单数后缀回指约柜；不增添原文没有明说的“应有”或“指定”等解释性成分。
- source_word: דְּבִיר
  choice: 内殿
  rationale: 在圣殿语境中指最里面的圣所房间；“内殿”简洁、庄重，也能与随后说明性的“至圣所”自然衔接。
- source_word: הַבַּיִת
  choice: 殿
  rationale: 该词字面为“房屋”，但本段明确指圣殿；正文译作“殿”避免现代读者误解，字面形式以脚注说明。
- source_word: קֹדֶשׁ הַקֳּדָשִׁים
  choice: 至圣所
  rationale: 该希伯来语结构表达最高程度的神圣空间；“至圣所”是准确、简明且广为理解的现代汉语名称。
- source_word: תַּחַת
  choice: 在……下
  rationale: 直接表达空间方位关系。
- source_word: כַּנְפֵי הַכְּרוּבִים
  choice: 基路伯的翅膀
  rationale: “基路伯”保留该类天上活物的专门名称；“翅膀”直接对应 כַּנְפֵי。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名。译作“雅威”旨在以音译保留其专名性质；“耶和华”是汉语传统形式，但较不贴近学界通常重构的读音。
- issue: קֹדֶשׁ הַקֳּדָשִׁים 的表达
  choice: 至圣所
  alternative: 圣中之圣
  rationale: 选择现代汉语中清楚通行的功能对等表达，同时不把这一区域另作超出原文的神学解释。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。用“进入……放在……”展开连续的 אֶל 方位短语，使句法清楚，同时保留“内殿”与“至圣所”的同位说明关系。脚注标记按其实际所释词语安放；源资料中的英文脚注标记位置与脚注内容似有对调，中文稿据希伯来原文校正。
