base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/004.yaml
  text: They brought up the ark of Yahweh[a], the tent of meeting, and all the holy vessels that were in the tent[b]; the priests and the Levites brought them up.
translation:
  language: zh_hans
  text: 他们把雅威的约柜、会幕和会幕里所有的圣器都带了上去[a]；祭司和利未人把这些都带了上去[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “带了上去”也可译作“运了上去”。希伯来语动词既可表示带到高处，也可在这里指在行列中搬运上去。
    reason: lexical_alternative
  - marker: b
    text: 原文作“祭司和利未人”。有人将这说法具体理解为“利未祭司”，但原文列出了两个名称。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעֲלוּ
  choice: 抬了上去
  rationale: עלה的使役形在这里表示把物件带到高处；结合前往圣殿的礼仪行列，用“抬了上去”既保留向上的方向，也自然体现搬运这些圣物的动作，但不限定具体抬法。
- source_word: אֲרוֹן יְהוָה
  choice: 雅威的约柜
  rationale: אֲרוֹן在本语境指约柜；יְהוָה按其专名译作“雅威”，因此合译为自然清楚的“雅威的约柜”。
- source_word: אֹהֶל מוֹעֵד
  choice: 会幕
  rationale: 该词组直指以色列敬拜中的会见之帐。“会幕”是现代中文圣经语境中简洁、通行且易懂的名称。
- source_word: כָּל כְּלֵי הַקֹּדֶשׁ
  choice: 所有的圣器
  rationale: כְּלֵי泛指器具或物件，הַקֹּדֶשׁ表明其分别为圣的用途；“圣器”简洁保留礼仪含义，又不把范围限定为家具。
- source_word: אֲשֶׁר בָּאֹהֶל
  choice: 会幕里
  rationale: 关系从句最自然地修饰前面的圣器。中文将其前置为“会幕里所有的圣器”，表达顺畅且关系明确。
- source_word: וַיַּעֲלוּ אֹתָם
  choice: 把这些都抬了上去
  rationale: 保留原文重复的动词及其向上方向；“这些”清楚回指前述约柜、会幕和圣器。
- source_word: הַכֹּהֲנִים וְהַלְוִיִּם
  choice: 祭司和利未人
  rationale: 原文明列两个名称，译文不将其合并解释成“利未祭司”，从而保留原文的表述及可能存在的群体关系张力。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；以“主”代称
  rationale: 原文直接使用四字神名。音译“雅威”保留这是以色列之神的专名，而不以称号取代。
- issue: “祭司和利未人”与搬运行动的关系
  choice: 明确保留“祭司和利未人”两个名称
  alternative: 译作“利未祭司”，将二者视为同一群体的双重称谓
  rationale: 希伯来文以连词明确连接“祭司”与“利未人”。译文不替原文消解二者之间的关系，也不借其他经文预先限定各自承担的物件。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“会幕”“约柜”“圣器”保留必要的礼仪词汇；分号和末句的重复再现希伯来文先列行动对象、后点明执行者的结构。
