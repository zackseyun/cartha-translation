review_pass:
  verdict: revise
  source_fidelity: 整体准确保留了条件句、连续动作、在被掳之地的处境及三重认罪。惟“行了悖逆的事”较易指反叛；וְהֶעֱוִינוּ更确切指行事乖谬、偏离正道，宜作相应调整。
  naturalness: “回心转意，回转过来”虽对应原文的两个连续动词，但“回转过来”在现代汉语中略显悬空；置于庄重祷告语境仍可理解。将“掳掠他们之人的境内”改为“掳走他们的人之地”更自然，也更直接对应“他们的掳掠者之地”。
  terminology: 保留“回心转意”“回转”“恳求”是稳妥的，未把“回转”预设为固定教义术语。三重认罪应维持区别；以“行了悖谬的事”表达עוה，比“悖逆”更贴近其乖谬、扭曲之义。
  issues:
  - severity: medium
    issue: “行了悖逆的事”对וְהֶעֱוִינוּ的语义略偏。
    rationale: 该词主要表示行事乖谬、歪曲或偏离正道，不专指对权威的反叛；“悖谬”能较好保留其与“犯罪”“作恶”并列而不完全重合的力度。
  - severity: low
    issue: “掳掠他们之人的境内”较书面且“掳掠”可联想到劫掠财物。
    rationale: שֹׁבֵיהֶם在此指掳走、俘获他们的人；“掳走他们的人之地”更清楚自然，并保留原文重复的地点表达。
  revised_text: 他们若在被掳去的地方回心转意，回转过来，在掳走他们的人之地向你恳求，说：‘我们犯了罪，行了悖谬的事，作了恶。’
  revised_footnotes: []
  revision_rationale: 修订仅澄清两个词语：以“掳走他们的人之地”自然表达“他们的掳掠者之地”，并以“行了悖谬的事”更贴近עוה的乖谬、偏离之义。其余句法、重复、祷告式语体及不将“回转”定式化为“悔改”的处理均予保留。
