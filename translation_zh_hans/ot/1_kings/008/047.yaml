revisions:
- from: 他们若在被掳去的地方回心转意，回转过来，在掳掠他们之人的境内向你恳求，说：‘我们犯了罪，行了悖逆的事，作了恶。’
  to: 他们若在被掳去的地方回心转意，回转过来，在掳走他们的人之地向你恳求，说：‘我们犯了罪，行了悖谬的事，作了恶。’
  rationale: 修订仅澄清两个词语：以“掳走他们的人之地”自然表达“他们的掳掠者之地”，并以“行了悖谬的事”更贴近עוה的乖谬、偏离之义。其余句法、重复、祷告式语体及不将“回转”定式化为“悔改”的处理均予保留。
