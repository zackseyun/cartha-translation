  text: וְ/הֵשִׁ֨יבוּ֙ אֶל לִבָּ֔/ם בָּ/אָ֖רֶץ אֲשֶׁ֣ר נִשְׁבּוּ שָׁ֑ם וְ/שָׁ֣בוּ וְ/הִֽתְחַנְּנ֣וּ אֵלֶ֗י/ךָ בְּ/אֶ֤רֶץ שֹֽׁבֵי/הֶם֙ לֵ/אמֹ֔ר חָטָ֥אנוּ וְ/הֶעֱוִ֖ינוּ רָשָֽׁעְנוּ־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/047.yaml
  text: and if they come to their senses in the land where they were taken captive, and return and plead with you in the land of those who took them captive, saying, ‘We have sinned and acted perversely; we have acted wickedly,’
translation:
  language: zh_hans
  text: 他们若在被掳去的地方回心转意，回转过来，在掳走他们的人之地向你恳求，说：‘我们犯了罪，行了悖谬的事，作了恶。’
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהֵשִׁיבוּ אֶל־לִבָּם
  choice: 回心转意
  rationale: 该希伯来语习语直译为“使之回到心里”，意为醒悟、认真反省；“回心转意”自然表达其内省并改变心意的含义。
- source_word: וְשָׁבוּ
  choice: 回转过来
  rationale: 保留 שוב 的基本意象与前一分句形成的复现关系，不预先将其限定为某一套神学术语。
- source_word: וְהִתְחַנְּנוּ אֵלֶיךָ
  choice: 向你恳求
  rationale: התחתן 的 Hitpael 形式在此表示求恩、恳求；“向你恳求”准确且符合祷告语境。
- source_word: וְהֶעֱוִינוּ
  choice: 行了悖逆的事
  rationale: 该词指行为乖谬、偏离正道；译法保留其道德偏离之意，并与“犯了罪”“作了恶”有所区分。
- source_word: רָשָׁעְנוּ
  choice: 作了恶
  rationale: 表示行恶或有罪恶行为；简洁地保留三重认罪句的递进和节奏。
theological_decisions:
- issue: וְשָׁבוּ 是否直接译作“悔改”
  choice: 回转过来
  alternative: 悔改
  rationale: 原词基本义为“返回、回转”，语境确有悔改含义，但译作“回转过来”可保留原文的空间隐喻和语义张力，避免用后来的固定神学术语替代原词。
- issue: 三项认罪是否合并或弱化重复
  choice: 分别译为“犯了罪，行了悖逆的事，作了恶”
  alternative: 合并为“我们犯罪作恶了”
  rationale: 原文以 חטא、עוה、רשע 三个动词累积表达全面认罪，应保留其修辞力度和细微差异。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语言。“被掳去”“掳掠他们之人”贴合列王纪的历史语境；保留原文连续动作与三重认罪结构，不添加原文没有的条件词或解释。
