  text: רָעָ֞ב כִּֽי יִהְיֶ֣ה בָ/אָ֗רֶץ דֶּ֣בֶר כִּֽי יִ֠הְיֶה שִׁדָּפ֨וֹן יֵרָק֜וֹן אַרְבֶּ֤ה חָסִיל֙ כִּ֣י יִהְיֶ֔ה כִּ֧י יָֽצַר ל֛/וֹ אֹיְב֖/וֹ בְּ/אֶ֣רֶץ שְׁעָרָ֑י/ו כָּל נֶ֖גַע כָּֽל מַחֲלָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/037.yaml
  text: If there is famine in the land[a], if there is pestilence, blight, mildew, locust, or caterpillar; if his enemy besieges him in the land of his gates; whatever plague[b], whatever sickness—
translation:
  language: zh_hans
  text: “这地若有饥荒、瘟疫、焦枯、霉害、蝗虫或蚕食庄稼的虫[a]；敌人若在他境内的城邑围困他[b]；无论有什么灾祸、什么疾病——”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “蚕食庄稼的虫”所指的确切虫类不明，可能指某一种蝗虫，或蝗虫的某一生长阶段。
    reason: lexical_alternative
  - marker: b
    text: 原文直译近于“在他城门之地”；“城门”在这里可借指境内的城邑。
    reason: lexical_alternative
lexical_decisions:
- source_word: רָעָב
  choice: 饥荒
  rationale: 在灾难清单中指大范围粮食匮乏，并非个人普通的饥饿。
- source_word: דֶּבֶר
  choice: 瘟疫
  rationale: 指流行性传染病；与后文含义更广的 נֶגַע（灾祸）有所区别。
- source_word: שִׁדָּפוֹן
  choice: 旱风之灾
  rationale: 该词指作物因灼热干风而枯萎的灾害；这一译法比笼统的“枯萎病”更能保留其可能涉及热风吹损的含义。
- source_word: יֵרָקוֹן
  choice: 霉病
  rationale: 在农业灾害语境中指使作物发黄、衰败的病害，传统上常理解为霉病。
- source_word: אַרְבֶּה
  choice: 蝗虫
  rationale: 这是蝗虫的常用希伯来词；原文单数在此具有集合意义。
- source_word: חָסִיל
  choice: 毁坏虫
  rationale: 指吞食、毁坏庄稼的虫类，确切种类不明，可能是某一种或某一生长阶段的蝗虫；正文采用不虚假限定物种的概括译法。
- source_word: כִּי יָצַר לוֹ אֹיְבוֹ
  choice: 敌人若……围困他
  rationale: צור 的使役形在军事语境中表示包围、困住；“围困”自然保留攻城意味。
- source_word: בְּאֶרֶץ שְׁעָרָיו
  choice: 在他境内各城
  rationale: 直译近于“在他城门之地”；“城门”可借代设有城门的城邑，因此按现代汉语表达为境内各城，并以脚注保留原文意象。
- source_word: כָּל נֶגַע
  choice: 无论遭遇什么灾祸
  rationale: נֶגַע 可指打击、灾患或祸害，范围较广；“灾祸”适合概括前列诸灾，也避免与专指疫病的“瘟疫”混同。
- source_word: כָּל מַחֲלָה
  choice: 什么疾病
  rationale: 泛指各种疾病；与“灾祸”并列，保留两个概括性类别。
