id: 1KI.8.1
reference: 1 Kings 8:1
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: אָ֣ז יַקְהֵ֣ל שְׁלֹמֹ֣ה אֶת זִקְנֵ֣י יִשְׂרָאֵ֡ל אֶת כָּל רָאשֵׁ֣י הַ/מַּטּוֹת֩ נְשִׂיאֵ֨י הָ/אָב֜וֹת לִ/בְנֵ֧י יִשְׂרָאֵ֛ל אֶל הַ/מֶּ֥לֶךְ שְׁלֹמֹ֖ה יְרוּשָׁלִָ֑ם לְֽ/הַעֲל֞וֹת אֶת אֲר֧וֹן בְּרִית יְהוָ֛ה מֵ/עִ֥יר דָּוִ֖ד הִ֥יא צִיּֽוֹן־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/001.yaml
  text: Then Solomon assembled the elders of Israel[a], all the heads of the tribes, the leaders of the fathers’ houses of the sons of Israel, to King Solomon in Jerusalem, to bring up the ark of the covenant of Yahweh from the city of David, that is, Zion.
translation:
  language: zh_hans
  text: 那时，所罗门把以色列的长老、各支派的所有首领，以及以色列人[a]各宗族的族长，都召集到耶路撒冷所罗门王所在之处，要把雅威的约柜从大卫城，就是锡安，运上来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“以色列的众子”，这是带有家族色彩的民族称谓，也常译作“以色列的子孙”。
    reason: 保留 לִבְנֵי יִשְׂרָאֵל 的字面形式及其家族—民族意涵。
lexical_decisions:
- source_word: אָז
  choice: 那时
  rationale: 作为叙事时间标记，引出随后发生的事件；“那时”自然庄重，也可表达“于是”的时序意义。
- source_word: יַקְהֵל
  choice: 召集
  rationale: 该使役形表示使众人聚集；“召集”符合君王正式召集领袖的场景。
- source_word: זִקְנֵי יִשְׂרָאֵל
  choice: 以色列的长老
  rationale: 指以色列社会中公认的资深领袖；“长老”是准确而通行的称呼。
- source_word: כָּל רָאשֵׁי הַמַּטּוֹת
  choice: 各支派的所有首领
  rationale: מַטּוֹת 在此指支派，而非字面的杖；译文保留 כָּל“所有”的范围。
- source_word: נְשִׂיאֵי הָאָבוֹת
  choice: 各宗族的族长
  rationale: 此处指父系祖族或家族单位的首领；现代汉语“宗族的族长”比直译“父家首领”更清楚，同时保留社会结构。
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 字面为“以色列的众子”，在此是整体性的民族称谓；正文采用自然的现代汉语，并以脚注保留其家族性字面表达。
- source_word: אֶל הַמֶּלֶךְ שְׁלֹמֹה יְרוּשָׁלִָם
  choice: 到耶路撒冷所罗门王那里
  rationale: 保留 אֶל 的趋向意义，表明众领袖被召集到王所在之处，不额外解释为“在王面前”。
- source_word: לְהַעֲלוֹת
  choice: 运上来
  rationale: 保留“使上去、带上去”的方向含义；约柜需要搬运，因此“运上来”在汉语中自然准确。
- source_word: אֲרוֹן בְּרִית יְהוָה
  choice: 雅威的约柜
  rationale: 该结构指与雅威之约相关的柜；“雅威的约柜”简洁地传达希伯来语所有格结构，也是中文圣经语境中清楚的表达。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以音译呈现四字神名，保留其作为以色列之神专名的性质，而不以称号替代。
- source_word: מֵעִיר דָּוִד
  choice: 从大卫城
  rationale: 直接保留地理名称。
- source_word: הִיא צִיּוֹן
  choice: 就是锡安
  rationale: 希伯来语代词加专名说明大卫城即锡安；“就是锡安”是自然清楚的同位说明。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华／上主
  rationale: 原文直接使用四字神名。正文以“雅威”音译其专名，避免用称号替代，也不采用较晚形成的混合读音。
- issue: לִבְנֵי יִשְׂרָאֵל 的民族与家族性表达
  choice: 正文译“以色列人”，脚注说明字面为“以色列的众子”
  alternative: 以色列的众子／以色列的子孙
  rationale: 此短语在本节整体指以色列民族，而不只指男性；自然汉语正文宜用“以色列人”，同时通过脚注保存原文的家族性意象，避免无声消除其表达特色。
- issue: אֲרוֹן בְּרִית יְהוָה 的关系
  choice: 雅威的约柜
  alternative: 雅威之约的柜
  rationale: 希伯来语构造链可按关系展开为“雅威之约的柜”，但“雅威的约柜”在中文中更自然，并未将“约”误解为柜本身所有；不在正文中过度限定其语法关系。
translation_notes:
  register: 采用现代、庄重而易懂的叙事文体。句序略按汉语习惯调整，以“把……都召集到……”清楚呈现宾语范围；保留“长老、支派首领、宗族族长”三层领袖称谓，并避免古奥的“父家”。
