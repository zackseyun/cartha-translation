source:
  edition: WLC
  text: וְ/שָׁ֣בוּ אֵלֶ֗י/ךָ בְּ/כָל לְבָבָ/ם֙ וּ/בְ/כָל נַפְשָׁ֔/ם בְּ/אֶ֥רֶץ אֹיְבֵי/הֶ֖ם אֲשֶׁר שָׁב֣וּ אֹתָ֑/ם וְ/הִֽתְפַּֽלְל֣וּ אֵלֶ֗י/ךָ דֶּ֤רֶךְ אַרְצָ/ם֙ אֲשֶׁ֣ר נָתַ֣תָּה לַ/אֲבוֹתָ֔/ם הָ/עִיר֙ אֲשֶׁ֣ר בָּחַ֔רְתָּ וְ/הַ/בַּ֖יִת אֲשֶׁר בנית לִ/שְׁמֶֽ/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/048.yaml
  text: and they return to you with all their heart and with all their soul in the land of their enemies who took them captive[a], and pray to you toward their land that you gave to their fathers, the city that you chose, and the house that I have built for your name[c][b],
translation:
  language: zh_hans
  text: 他们若在仇敌把他们掳去之地，尽心尽性归向你[a]，朝着你赐给他们祖先的土地[b]、你所拣选的城，以及我为你的名建造的殿[c]，向你祷告，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “归向你”也可译作“转回到你那里”；在这里也含有悔改的意思。
    reason: lexical_alternative
  - marker: b
    text: 原文表示祷告时面向他们土地所在的方向。
    reason: lexical_alternative
  - marker: c
    text: “殿”原文直译为“房屋”；这里指为上帝的名建造的圣殿。
    reason: cultural_note
lexical_decisions:
- source_word: וְשָׁבוּ אֵלֶיךָ
  choice: 归向你
  rationale: שׁוּב的基本义是“返回、转回”；“归向你”既保留关系和方向意味，也让悔改的语境含义自然存在，而不把它明说为唯一含义。
- source_word: בְּכָל לְבָבָם וּבְכָל נַפְשָׁם
  choice: 尽心尽性
  rationale: 保留“心”和“性命/生命”两个源语意象及其经文互文，同时用现代中文圣经语体中简洁而可懂的固定表达来表示全然投入。
- source_word: בְּאֶרֶץ אֹיְבֵיהֶם אֲשֶׁר שָׁבוּ אֹתָם
  choice: 在掳走他们的仇敌之地
  rationale: 明确表达他们身处俘虏他们之人的土地；“掳走”保留被强行带离故土的流亡意味。
- source_word: וְהִתְפַּלְלוּ אֵלֶיךָ
  choice: 向你祷告
  rationale: 直接表达פלל的反身词干与介词אֶל所表示的祷告对象。
- source_word: דֶּרֶךְ אַרְצָם
  choice: 朝着……土地
  rationale: דֶּרֶךְ在地点前表示方向；“朝着”自然地保留祷告时面向该地的空间含义。
- source_word: אֲשֶׁר נָתַתָּה לַאֲבוֹתָם
  choice: 你赐给他们祖先的
  rationale: “赐给”体现土地是上帝所给予的；现代中文以“祖先”自然涵盖 covenantal forefathers，且不改变所指。
- source_word: הָעִיר אֲשֶׁר בָּחַרְתָּ
  choice: 你所拣选的城
  rationale: “拣选”保留神主动选择这城的经文用语，不额外引入后来的神学解释。
- source_word: וְהַבַּיִת אֲשֶׁר בנית לִשְׁמֶךָ
  choice: 我为你的名建造的殿
  rationale: 按所罗门祷告的说话情境保留第一人称“我”；בַּיִת在这里指圣殿，译作“殿”在现代中文中自然，也由脚注交代其字面及奉献含义。
theological_decisions:
- issue: שׁוּב所含的盟约性悔改意味
  choice: 归向你
  alternative: 向你悔改；转回到你那里
  rationale: 源语既有返回、转回的方向和关系意义，在本祷告语境中又含悔改意味。“归向你”保留二者之间的张力，不将含义收窄为抽象的悔改术语。
- issue: “为你的名建造的殿”中的建造者人称
  choice: 保留第一人称：“我……建造”
  alternative: 他们建造；为你的名建造的殿
  rationale: 所罗门正在亲自祷告，前文也陈述他建造了这殿；第一人称符合该说话情境，并避免抹平文本中的说话者指涉。
- issue: “为你的名”与圣殿的关系
  choice: 保留“为你的名”这一表述
  alternative: 献给你的圣殿；让你居住的殿
  rationale: 源语采用“名”的神学表达，并未直说上帝受空间局限而居住其中；直译可保留上帝之名、临在与圣殿之间的张力。
translation_notes:
  register: 采用现代、庄重而清楚的祷告语体。“尽心尽性”“归向你”“拣选”等词保留希伯来语意象与经文互文；长句按中文方向结构重排为“朝着……向你祷告”，以免误读，同时不改变源语各成分之间的关系。
