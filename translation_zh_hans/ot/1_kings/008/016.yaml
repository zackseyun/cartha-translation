source:
  edition: WLC
  text: מִן הַ/יּ֗וֹם אֲשֶׁ֨ר הוֹצֵ֜אתִי אֶת עַמִּ֣/י אֶת יִשְׂרָאֵל֮ מִ/מִּצְרַיִם֒ לֹֽא בָחַ֣רְתִּי בְ/עִ֗יר מִ/כֹּל֙ שִׁבְטֵ֣י יִשְׂרָאֵ֔ל לִ/בְנ֣וֹת בַּ֔יִת לִ/הְי֥וֹת שְׁמִ֖/י שָׁ֑ם וָ/אֶבְחַ֣ר בְּ/דָוִ֔ד לִֽ/הְי֖וֹת עַל עַמִּ֥/י יִשְׂרָאֵֽל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/016.yaml
  text: From the day that I brought my people Israel out of Egypt[a], I have not chosen a city from all the tribes of Israel to build a house for my name to be there[b], but I chose David to be over my people Israel.
translation:
  language: zh_hans
  text: “从我领我子民以色列出埃及之日起，我没有从以色列各支派中拣选一座城，建造殿宇，好让我的名在那里[a]；我却拣选了大卫，使他统管我子民以色列。”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “好让我的名在那里”是希伯来语表达，指为耶和华的名所设、与他的临在相关的圣所，即圣殿。
    reason: cultural_note
  - marker: b
    text: “却”也可译作“并且”：希伯来语连接词可表示并列，但上下文更倾向于对照——上帝没有拣选城邑，却拣选了大卫。
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹצֵאתִי
  choice: 把……领出来
  rationale: 使役式表达使以色列离开埃及；“领出来”自然地保留出埃及叙事中上帝亲自带领的含义。
- source_word: עַמִּי אֶת־יִשְׂרָאֵל
  choice: 我的子民以色列
  rationale: 保留同位结构，以“以色列”说明“我的子民”所指，兼顾自然中文与盟约性称谓。
- source_word: בְעִיר מִכֹּל שִׁבְטֵי יִשְׂרָאֵל
  choice: 从以色列各支派中拣选一座城
  rationale: 原文表达紧缩，意思是从属于各支派的城邑中选择一座；此译法清楚且不过度补充。
- source_word: לִבְנוֹת בַּיִת
  choice: 建造殿宇
  rationale: בַּיִת直译为“房屋”，此处明确指敬拜用的圣所；“殿宇”既符合所指，又保留“为上帝建造居所”的意象，不直接以专名“圣殿”替换。
- source_word: לִהְיוֹת שְׁמִי שָׁם
  choice: 使我的名在那里
  rationale: 按原文的“是、存在”表达，不增添“居住”等原文未明说的动作，保留圣名与所在地关系的神学张力。
- source_word: וָאֶבְחַר בְּדָוִד
  choice: 我却拣选了大卫
  rationale: 连接词可作并列或转折；上下文将未拣选城邑与拣选大卫相对照，因此正文采用“却”，并以脚注保留并列可能。
- source_word: לִהְיוֹת עַל־עַמִּי יִשְׂרָאֵל
  choice: 让他治理我的子民以色列
  rationale: 字面为“在……之上”；现代中文若直译为“在我的子民之上”不自然，“治理”准确表达大卫在百姓之上的王权职责。
theological_decisions:
- issue: “为我的名建造殿宇”的圣殿神学
  choice: 保留“使我的名在那里”的表达
  alternative: 使我的名住在那里；为我的名建造圣殿
  rationale: 原文使用“是/存在”而非“居住”，保留申命传统中上帝之名与所选之地的独特关系，不把它扩展为关于上帝临在方式的解释。
- issue: 未拣选城邑与拣选大卫之间的关系
  choice: 以“却”表达对照
  alternative: 以“并且”表达并列
  rationale: 语境突出两项选择的对照：当时没有城邑被选为建殿之地，而大卫已蒙拣选治理以色列；脚注保留希伯来连接词可作并列理解的可能。
- issue: 大卫“在百姓之上”的权柄
  choice: 译为“让他治理”
  alternative: 让他在我的子民以色列之上
  rationale: “治理”使现代读者自然理解其王权职责，但不增添具体政治或宗派性的王权理论。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“子民”“拣选”“殿宇”保留经文的盟约与圣所语域；句法略作中文化处理，同时保留原文从出埃及、未选城邑到拣选大卫的论述次序。
