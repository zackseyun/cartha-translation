id: 1KI.8.64
reference: 1 Kings 8:64
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: בַּ/יּ֣וֹם הַ/ה֗וּא קִדַּ֨שׁ הַ/מֶּ֜לֶךְ אֶת תּ֣וֹךְ הֶ/חָצֵ֗ר אֲשֶׁר֙ לִ/פְנֵ֣י בֵית יְהוָ֔ה כִּי עָ֣שָׂה שָׁ֗ם אֶת הָֽ/עֹלָה֙ וְ/אֶת הַ/מִּנְחָ֔ה וְ/אֵ֖ת חֶלְבֵ֣י הַ/שְּׁלָמִ֑ים כִּֽי מִזְבַּ֤ח הַ/נְּחֹ֨שֶׁת֙ אֲשֶׁ֣ר לִ/פְנֵ֣י יְהוָ֔ה קָטֹ֗ן מֵֽ/הָכִיל֙ אֶת הָ/עֹלָ֣ה וְ/אֶת הַ/מִּנְחָ֔ה וְ/אֵ֖ת חֶלְבֵ֥י הַ/שְּׁלָמִֽים־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/064.yaml
  text: On that day the king consecrated the middle of the court that was before the house of Yahweh[a], because there he offered the burnt offering and the grain offering and the fat portions of the peace offerings[c][b], because the bronze altar that was before Yahweh was too small to contain the burnt offering and the grain offering and the fat portions of the peace offerings.
translation:
  language: zh_hans
  text: 那一天，王把耶和华殿前院子的中央分别为圣，因为他在那里献上燔祭、素祭和平安祭的脂肪[a]；耶和华面前的铜祭坛太小，容纳不下燔祭、素祭和平安祭的脂肪。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“平安祭的脂油”。这里指献在坛上焚烧的脂肪部分。
    reason: 说明 חֶלְבֵי 的直译及其祭祀语境，避免读者把它理解为泛指祭物中最好的部分。
lexical_decisions:
- source_word: קִדַּשׁ
  choice: 分别为圣
  rationale: 此处指把一块地方划归神圣用途；“分别为圣”既保留祭祀语境，也比单说“奉献”更准确。
- source_word: תּוֹךְ הֶחָצֵר
  choice: 院子的中央
  rationale: תּוֹךְ 在这里表示院中的中央区域；译法自然，并保留空间意义。
- source_word: לִפְנֵי בֵית יְהוָה
  choice: 耶和华殿前
  rationale: לִפְנֵי 表示空间上的“在……前面”；בֵית יְהוָה 在此明确指圣殿，译作“耶和华殿”简洁自然。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代汉语圣经读者熟悉的专名形式呈现四字神名，而不以称号“主”替代。
- source_word: עָשָׂה שָׁם
  choice: 他在那里献上
  rationale: עָשָׂה 本义宽泛，但在此祭祀语境中指献祭；“献上”准确表达实际动作。
- source_word: הָעֹלָה
  choice: 燔祭
  rationale: 这是 עֹלָה 的通行祭祀术语，指焚烧献上的祭物。
- source_word: הַמִּנְחָה
  choice: 素祭
  rationale: 在祭祀语境中 מִנְחָה 指谷物祭；“素祭”是现代中文圣经中简洁而通行的术语。
- source_word: חֶלְבֵי הַשְּׁלָמִים
  choice: 平安祭的脂肪
  rationale: חֶלְבֵי 具体指祭牲中焚烧在坛上的脂肪；שְׁלָמִים 译作通行的“平安祭”，不把其意义限缩为单一解释。
- source_word: מִזְבַּח הַנְּחֹשֶׁת
  choice: 铜祭坛
  rationale: נְחֹשֶׁת 可指铜或青铜；“铜祭坛”在中文中自然，也保留原词的金属类别宽度。
- source_word: קָטֹן מֵהָכִיל
  choice: 太小，容纳不下
  rationale: 该结构表达容量不足；此译法符合现代汉语，并清楚说明祭坛不足以承载这些祭物。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。中文正文采用最广为读者识别的专名“耶和华”，保留其作为名字的功能，而不以“主”这一称号替代。
- issue: שְׁלָמִים 的祭名
  choice: 平安祭
  alternative: 团契祭
  rationale: 该词可从完整、安康或共享祭宴等角度理解；“平安祭”是较通行且不过度解释的译名，保留其神学内涵的宽度。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。保留“燔祭、素祭、平安祭、分别为圣”等必要的祭祀术语，同时用“院子的中央”“容纳不下”等自然表达提高可读性。
