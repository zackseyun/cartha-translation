  text: אֵ֚ין בָּֽ/אָר֔וֹן רַ֗ק שְׁנֵי֙ לֻח֣וֹת הָ/אֲבָנִ֔ים אֲשֶׁ֨ר הִנִּ֥חַ שָׁ֛ם מֹשֶׁ֖ה בְּ/חֹרֵ֑ב אֲשֶׁ֨ר כָּרַ֤ת יְהוָה֙ עִם בְּנֵ֣י יִשְׂרָאֵ֔ל בְּ/צֵאתָ֖/ם מֵ/אֶ֥רֶץ מִצְרָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/009.yaml
  text: There was nothing in the ark except the two stone tablets that Moses had placed there at Horeb[c][b][a], where Yahweh made a covenant with the sons of Israel when they came out from the land of Egypt.
translation:
  language: zh_hans
  text: 约柜里除了两块石版[a]，什么也没有。这两块石版是摩西在何烈山放在那里的；雅威在那里与以色列子孙[c]立了约[b]，当他们从埃及地出来的时候。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“两块石头制成的版”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来语直译“切了约”；这个习语的意思是“立约”。
    reason: lexical_alternative
  - marker: c
    text: 也可译作“以色列人”或“以色列的儿女”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵין בָּאָרוֹן רַק
  choice: 约柜里除了……什么也没有
  rationale: 以现代汉语的“除了……什么也没有”自然表达希伯来语的存在否定加限制词，同时保留其排他性。
- source_word: שְׁנֵי לֻחֹת הָאֲבָנִים
  choice: 两块石版
  rationale: “石版”简洁、庄重，并准确指向用于书写盟约文字的石质版片；量词“块”符合现代汉语习惯。
- source_word: אֲשֶׁר הִנִּחַ שָׁם מֹשֶׁה
  choice: 是摩西……放在那里的
  rationale: הִנִּיחַ表示放置、安放；“放在那里的”既自然，也保留地点回指。
- source_word: בְּחֹרֵב
  choice: 在何烈山
  rationale: “何烈山”是该地名在中文圣经语境中的通行译法；加“山”有助普通读者识别地点。
- source_word: אֲשֶׁר כָּרַת יְהוָה עִם
  choice: 雅威在那里与……立了约
  rationale: כָּרַת在盟约语境中构成“立约”的习语；关系词אֲשֶׁר在此按地点关联自然表达为“在那里”。
- source_word: יְהוָה
  choice: 雅威
  rationale: 用现代汉语音译呈现四字神名，而不以称号替代。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列子孙
  rationale: 保留原文的家族性表达，同时是自然且为中文读者熟悉的说法。
- source_word: בְּצֵאתָם מֵאֶרֶץ מִצְרָיִם
  choice: 那时他们正从埃及地出来
  rationale: 表达介词בְּ加不定式结构的时间关系，并保留“埃及地”这一完整地点表述。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用神的专名；“雅威”较贴近学界通常重构的读音，并避免将专名改成“主”等称号。
- issue: בְּנֵי יִשְׂרָאֵל的群体称谓
  choice: 以色列子孙
  alternative: 以色列人
  rationale: “以色列子孙”保留原文“以色列的儿子们/后裔”的家族与盟约色彩；脚注同时说明更自然的群体性译法。
- issue: כָּרַת所表达的盟约行动
  choice: 立了约
  alternative: 切了约
  rationale: “切约”是希伯来语的字面形式，但现代汉语不以此表示缔结盟约；“立约”准确传达该固定习语，不额外解释盟约性质。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“约柜”“石版”“立约”等词兼顾经文传统和当代可读性。分为两句以避免汉语关系从句过长；分号维持何烈山与立约事件之间的紧密联系。
