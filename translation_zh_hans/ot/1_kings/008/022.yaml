id: 1KI.8.22
reference: 1 Kings 8:22
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יַּעֲמֹ֣ד שְׁלֹמֹ֗ה לִ/פְנֵי֙ מִזְבַּ֣ח יְהוָ֔ה נֶ֖גֶד כָּל קְהַ֣ל יִשְׂרָאֵ֑ל וַ/יִּפְרֹ֥שׂ כַּפָּ֖י/ו הַ/שָּׁמָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/022.yaml
  text: Then Solomon stood before the altar of Yahweh in front of all the assembly of Israel and spread out his hands toward heaven[a].
translation:
  language: zh_hans
  text: 于是，所罗门当着以色列全体会众，站在雅威的祭坛前，向天[a]伸开双手。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“诸天”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲמֹד
  choice: 于是……站
  rationale: 该叙事形式承接前文，表示随后发生的动作；“于是……站”符合现代汉语叙事表达，不额外加入“起身”或“肃立”的含义。
- source_word: לִפְנֵי מִזְבַּח יְהוָה
  choice: 在雅威的祭坛前
  rationale: לִפְנֵי在此主要表达空间位置；构造链直译为“雅威的祭坛”，清楚自然。
- source_word: יְהוָה
  choice: 雅威
  rationale: 采用神圣四字名的现代汉语音译，以保留原文中的专名，而不以称号替代。
- source_word: נֶגֶד כָּל קְהַל יִשְׂרָאֵל
  choice: 当着以色列全体会众
  rationale: נֶגֶד在此描写所罗门处于全会众面前、公开行事；“当着”能自然表达这一场景，又不强行断定他身体朝向会众。קָהָל译为“会众”，符合以色列民正式聚集的语境。
- source_word: וַיִּפְרֹשׂ כַּפָּיו
  choice: 伸开双手
  rationale: 该搭配描写祷告时张开、伸展双手的姿态。“双手”比字面的“双掌”更符合现代汉语习惯，同时保留动作形象。
- source_word: הַשָּׁמָיִם
  choice: 天
  rationale: 在向上举手祷告的语境中，“向天”简洁自然；希伯来语的形式可直译为“诸天”，因此以脚注保留这一词形信息。
theological_decisions:
- issue: 神圣四字名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用以色列上帝的专名；正文采用较贴近常见学术重构读音的“雅威”，保留其专名性质。“耶和华”是汉语传统中广为人知的另一音译，但不是此处采用的正文形式。
- issue: הַשָּׁמָיִם 在祷告语境中的数与含义
  choice: 天
  alternative: 诸天
  rationale: 正文采用自然的现代汉语“向天”，不把该词解释成某种特定的宇宙层级；脚注说明希伯来语字面形式，以保留原文表达。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“当着……会众”表现公开场景；语序略作汉语化调整，同时保留祭坛、会众和向天伸手三个核心画面。
