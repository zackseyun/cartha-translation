  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: לִ/הְי֨וֹת עֵינֶ֤י/ךָ פְתֻחוֹת֙ אֶל תְּחִנַּ֣ת עַבְדְּ/ךָ֔ וְ/אֶל תְּחִנַּ֖ת עַמְּ/ךָ֣ יִשְׂרָאֵ֑ל לִ/שְׁמֹ֣עַ אֲלֵי/הֶ֔ם בְּ/כֹ֖ל קָרְאָ֥/ם אֵלֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/052.yaml
  text: that your eyes may be open to the plea of your servant and to the plea of your people Israel[b][a], to listen to them whenever they call to you.
translation:
  language: zh_hans
  text: 愿你的眼目向你仆人的恳求[a]和你子民以色列的恳求敞开；每当他们向你呼求时，愿你垂听[b]他们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“祈求”。希伯来语这个词指恳切地求取恩惠或怜悯。
    reason: lexical_alternative
  - marker: b
    text: 或译“听”。希伯来语动词可指“听见”“留心听”或“听从”，具体含义由上下文决定。
    reason: lexical_alternative
lexical_decisions:
- source_word: לִהְיוֹת
  choice: 愿……敞开
  rationale: 此前后均为所罗门向上帝发出的祈求；用“愿”自然表达希伯来语不定式在此承接的祈愿语气。
- source_word: עֵינֶיךָ פְתֻחוֹת
  choice: 你的眼目……敞开
  rationale: 保留原文以“眼目敞开”表达上帝留意并施恩垂听的拟人性意象。
- source_word: תְּחִנַּת
  choice: 恳求
  rationale: 该词指恳切求取恩惠或怜悯；“恳求”既通俗庄重，也保留请求的迫切意味。
- source_word: עַבְדְּךָ
  choice: 你的仆人
  rationale: 这是所罗门在上帝面前的自称；“仆人”符合语境，不刻意凸显奴役身份。
- source_word: עַמְּךָ יִשְׂרָאֵל
  choice: 你子民以色列
  rationale: 表达以色列是属上帝的子民；“子民”在现代中文中自然体现群体及归属关系。
- source_word: לִשְׁמֹעַ אֲלֵיהֶם
  choice: 垂听他们
  rationale: שׁמע可指听见、留心听或听从；祷告语境中的“垂听”既自然庄重，也表达带着关注的聆听，但不把可能的语义完全限定为应允。
- source_word: בְּכֹל קָרְאָם אֵלֶיךָ
  choice: 每当他们向你呼求时
  rationale: ב加כֹל与动词性结构在此表达反复发生的时间关系；“每当……时”准确而流畅，“呼求”符合祷告语境。
theological_decisions:
- issue: 关于上帝“眼目敞开”的拟人表达
  choice: 在正文中保留“你的眼目……敞开”
  alternative: 意译为“愿你留意”
  rationale: 原文明确使用身体意象来描述上帝的关注；保留此比喻能维护经文的文学与神学张力，而无需据此断言上帝具有物质身体。
- issue: “垂听”是否暗含应允祷告
  choice: 采用“垂听”，但脚注保留“听”的可能译法
  alternative: 译作“听他们”或“听从他们”
  rationale: 祷告语境要求表达上帝专注聆听，但原词本身未必在每处都明确表示答应请求；因此正文用自然的“垂听”，脚注提示其词义范围，避免把“应允”直接写入经文。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语言。“眼目……敞开”保留原文意象；分号及“每当……时”的结构使中文关系清晰。脚注标记均紧随其所解释的词语。
