source:
  edition: WLC
  text: וְ/יִֽהְי֨וּ דְבָרַ֜/י אֵ֗לֶּה אֲשֶׁ֤ר הִתְחַנַּ֨נְתִּי֙ לִ/פְנֵ֣י יְהוָ֔ה קְרֹבִ֛ים אֶל יְהוָ֥ה אֱלֹהֵ֖י/נוּ יוֹמָ֣ם וָ/לָ֑יְלָה לַ/עֲשׂ֣וֹת מִשְׁפַּ֣ט עַבְדּ֗/וֹ וּ/מִשְׁפַּ֛ט עַמּ֥/וֹ יִשְׂרָאֵ֖ל דְּבַר י֥וֹם בְּ/יוֹמֽ/וֹ־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/059.yaml
  text: And may these words of mine[a], with which I have pleaded before Yahweh, be near Yahweh our God day and night, that he may uphold the cause of his servant and the cause of his people Israel, as each day requires[c][b],
translation:
  language: zh_hans
  text: 愿我在雅威面前所恳求的这些话，昼夜常在雅威我们上帝面前[a]，好使他按每天的需要，为他的仆人和他的子民以色列主持公道。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在……面前”原文直译为“靠近雅威我们上帝”，描绘这些祷告的话持续留在上帝近前。
    reason: lexical_alternative
  - marker: b
    text: “按每天的需要”原文直译为“每日的事在当日”，指每天所需要处理的事。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִהְיוּ
  choice: 愿……都在
  rationale: 此处形式在祷告语境中表达愿望，用“愿”自然传达祈愿语气。
- source_word: דְבָרַי אֵלֶּה אֲשֶׁר הִתְחַנַּנְתִּי לִפְנֵי יְהוָה
  choice: 我在雅威面前恳求时所说的这些话
  rationale: 将关系从句自然化，同时保留“这些话”、恳求的强度以及在雅威面前祈求的含义。
- source_word: יְהוָה
  choice: 雅威
  rationale: 直接音译四字神名，保留其作为以色列之上帝个人名字的性质。
- source_word: קְרֹבִים אֶל יְהוָה אֱלֹהֵינוּ
  choice: 在雅威我们的上帝面前
  rationale: 字面为“靠近雅威我们的上帝”；在祷告语境中指这些话持续留在上帝近前、蒙他垂顾。正文采用自然汉语表达，并以脚注保留字面意象。
- source_word: יוֹמָם וָלָיְלָה
  choice: 昼夜
  rationale: 简洁保留希伯来语表示持续不断的成语。
- source_word: לַעֲשׂוֹת מִשְׁפַּט
  choice: 主持公道
  rationale: 此司法性习语意为维护某人的正当权益或案件；“主持公道”在现代汉语中自然且保留法律、伸冤色彩。
- source_word: עַבְדּוֹ
  choice: 他的仆人
  rationale: 王在上帝面前自称“仆人”，符合本段祷告语境。
- source_word: דְּבַר יוֹם בְּיוֹמוֹ
  choice: 按每日所需
  rationale: 原文直译为“每日的事在当日”，意指每天所需要或应办的事；此译法简洁传达逐日供应、处理之意。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华／上主
  rationale: 原文直接使用四字神名；音译“雅威”保留其专名性质，不以称号替代。
- issue: “行审判”在此处的含义
  choice: 为……主持公道
  alternative: 审判……／为……伸张正义
  rationale: מִשְׁפָּט 在此与人称所属结构连用，重点是维护仆人和以色列民的案件或正当权益，而不是对他们施行定罪性的审判。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“恳求”保留祈祷的迫切感；“主持公道”比生硬的“施行审判”更准确传达此处维护合法权益的司法习语。脚注标记均置于正文相关位置。
