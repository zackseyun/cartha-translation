  to: 愿我在雅威面前所恳求的这些话，昼夜常在雅威我们上帝面前[a]，好使他按每天的需要，为他的仆人和他的子民以色列主持公道。[b]
  rationale: 修订仅调整中文语序、目的从句和脚注锚点，不改变经文含义。“常在……面前”在保留脚注所说明的“靠近”意象之余，符合中文对祷告持续蒙垂顾的自然表达。
