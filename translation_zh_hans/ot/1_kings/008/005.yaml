  text: וְ/הַ/מֶּ֣לֶךְ שְׁלֹמֹ֗ה וְ/כָל עֲדַ֤ת יִשְׂרָאֵל֙ הַ/נּוֹעָדִ֣ים עָלָ֔י/ו אִתּ֖/וֹ לִ/פְנֵ֣י הָֽ/אָר֑וֹן מְזַבְּחִים֙ צֹ֣אן וּ/בָקָ֔ר אֲשֶׁ֧ר לֹֽא יִסָּפְר֛וּ וְ/לֹ֥א יִמָּנ֖וּ מֵ/רֹֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/005.yaml
  text: And King Solomon[a], and all the assembly of Israel who had assembled before him, were with him before the ark, sacrificing sheep and cattle that could not be counted or numbered because of their great number.
translation:
  language: zh_hans
  text: 所罗门王和所有聚集到他那里[a]的以色列会众，都与他一同在约柜前献上羊和牛为祭；这些祭牲多得无法计算，也无法数点。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“聚集在他面前”。希伯来文可表示众人聚集到所罗门那里，也可强调他们在他面前会集。
    reason: 保留 הַנּוֹעָדִים עָלָיו 在趋向性与空间性理解之间的词义可能，避免增添所罗门主动召集众人的含义。
lexical_decisions:
- source_word: עֲדַת
  choice: 会众
  rationale: 指为公共敬拜而聚集的以色列全体；“会众”在现代汉语圣经语境中庄重自然，又不把该词限定为后来的教会组织。
- source_word: הַנּוֹעָדִים עָלָיו
  choice: 聚集到他那里
  rationale: נפعل 分词表示聚集、会合，עָלָיו 表明这次聚集与所罗门相关并带有趋向意味；正文保留这种关系，脚注列出可行的空间性译法。
- source_word: אִתּוֹ
  choice: 都同他一起
  rationale: 希伯来文为无动词结构；汉语补出“都”并以“同他一起”表达会众与所罗门一同在约柜前。
- source_word: לִפְנֵי הָאָרוֹן
  choice: 在约柜前
  rationale: 准确表达空间关系；此处 אָרוֹן 依礼仪语境译为惯用的“约柜”，但不扩写为“耶和华的约柜”或其他原文未有的限定。
- source_word: מְזַבְּחִים
  choice: 献祭
  rationale: 分词表示当时持续进行的祭祀行动；“献祭”简洁、自然，并明确其礼仪性质。
- source_word: צֹאן וּבָקָר
  choice: 羊和牛
  rationale: 按原文次序具体呈现两类祭牲，比概括为“牲畜”更准确。
- source_word: אֲשֶׁר לֹא יִסָּפְרוּ וְלֹא יִמָּנוּ
  choice: 无法计算，也无法数点
  rationale: 用两个近义表达保留原文双重动词的修辞加强效果，而不压缩为单一的“数不清”。
- source_word: מֵרֹב
  choice: 多得
  rationale: 自然表达数量极多正是不能计算、数点的原因。
theological_decisions:
- issue: הָאָרוֹן 的指称
  choice: 约柜
  alternative: 柜；约柜的完整称号
  rationale: 在本段礼仪语境中，“约柜”是现代汉语对该圣物清楚而固定的称呼；同时不增添本节原文没有的更完整称号。
- issue: הַנּוֹעָדִים עָלָיו 与所罗门的关系
  choice: 聚集到他那里
  alternative: 聚集在他面前
  rationale: 介词短语可强调百姓围绕或朝向所罗门聚集，也可作较空间化的理解。正文保留趋向关系，脚注保存另一种真实可能，避免把含义定死。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“都同他一起”略保留原文结构上的重复；将后半句独立成句，使大量祭牲的强调在汉语中清楚自然。
