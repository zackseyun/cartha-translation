  terminology: “会众”“约柜”“献上……为祭”均符合现代汉语圣经叙事的庄重语域。“约柜”虽较原文“柜”具体，但在此处语境中是稳定且清楚的惯用指称；不应扩写为“耶和华的约柜”或“约柜的完整称号”。
