  text: וַ/יְהִ֕י עִם לְבַ֖ב דָּוִ֣ד אָבִ֑/י לִ/בְנ֣וֹת בַּ֔יִת לְ/שֵׁ֥ם יְהוָ֖ה אֱלֹהֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/017.yaml
  text: It was in the heart of David my father to build a house for the name of Yahweh[a], the God of Israel.
translation:
  language: zh_hans
  text: 我父亲大卫心里曾有意，要为雅威[a]——以色列的上帝——的名建造一所房屋。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “雅威”对应原文神名יהוה。这里的“房屋”原文可指房屋；在本段语境中所指为圣殿。
    reason: 说明神名的译法，并交代“房屋”的字面意义及其在上下文中的所指，而不将解释性“圣殿”置入正文。
lexical_decisions:
- source_word: וַיְהִי
  choice: 有意
  rationale: 此处与“在心里”这一希伯来语惯用表达共同说明大卫心中已有某种意愿；译为“心里有意”既自然，也保留过去存在的意向，不另加原文没有的“现在”。
- source_word: עִם לְבַב
  choice: 心里
  rationale: עִם与לְבַב组合表示某事存在于人的心中，即心愿或意图。“心里有意”保留心的意象，同时符合现代汉语。
- source_word: דָּוִד אָבִי
  choice: 我父亲大卫
  rationale: 按现代汉语通常语序表达人物与亲属关系，比机械直译为“大卫我父亲”自然。
- source_word: לִבְנוֹת
  choice: 建造
  rationale: 准确表达בנה在建造圣所语境中的通常含义。
- source_word: בַּיִת
  choice: 一座殿
  rationale: 希伯来语本义为“房屋、屋宇”，在本段明确指为上帝建造的圣殿；“殿”在汉语中既自然指向圣所，又较“圣殿”少一层解释性增补。原文字面意象在脚注中说明。
- source_word: לְשֵׁם
  choice: 为……的名
  rationale: 保留“为耶和华的名”这一重要且可理解的圣经表达，不将“名”释义化为“荣耀”或“名声”。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的形式音译四字神名，不用称号“主”取代专名。
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: 以色列的上帝
  rationale: 自然表达原文的属格结构，并以同位语说明耶和华的身份。
theological_decisions:
- issue: 如何翻译神名יְהוָה
  choice: 耶和华
  alternative: 主
  rationale: 原文直接使用四字神名，而非“主”这一称号；正文保留专名，以免把名称替换为头衔。
- issue: בַּיִת应译为“殿”还是明确译为“圣殿”
  choice: 殿
  alternative: 圣殿；房屋
  rationale: 上下文所指确为圣殿，但原词通常意为“房屋、屋宇”。“殿”兼顾中文语境的清楚性与原文“上帝之屋”的意象；脚注交代字面含义，避免完全隐去原文措辞。
- issue: לְשֵׁם中的“名”是否应释义化
  choice: 保留“为……的名”
  alternative: 为尊荣……；为彰显……的名声
  rationale: “名”在此具有丰富的身份、启示及归属含义；原文本身没有只限定为“尊荣”或“名声”，故不在正文中消解其神学张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“我父亲大卫心里有意”清楚表达原文的内在意愿；破折号标出“以色列的上帝”是对“耶和华”的同位说明，同时保留“为……的名建造”这一原文结构。
