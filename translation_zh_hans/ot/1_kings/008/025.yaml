review_pass:
  verdict: revise
  source_fidelity: 主文正确传达了祈求神实现对大卫所说之话、王朝继承的应许及其以子孙守道为条件的结构。“不断有人”基本表达了“不可被剪除”的王朝延续习语，但“你必不断有人坐……”在现代汉语中略显生硬，且不如“你必不至于……缺少……”清楚对应 לֹא יִכָּרֵת לְךָ אִישׁ 的“你不会缺少一人”这一习语义。
  naturalness: 称呼、祈求语气和“行在我面前”的庄重语域均合适。将王位继承句改为“你必不至于在我面前缺少坐以色列王位的人”可显著改善句法自然度，并保留原文的“在我面前”及“为你”的受益者意义。
  terminology: “雅威”“你仆人”“我父大卫”“子孙”“道路”及“行在我面前”的用语一致、恰当。“王位”是此处 כִּסֵּא 的自然语境化表达。脚注宜以更合乎汉语且更贴近原文关系的直译说明“从我面前为你剪除”。
  issues:
  - severity: medium
    issue: “你必不断有人坐以色列的王位”句法略生硬，且“不断有人”未明确呈现“你不会缺少继承者”的希伯来语习语结构。
    rationale: לֹא יִכָּרֵת לְךָ אִישׁ 是“不会为你剪除一人”的否定剪除习语，在此指大卫不会缺少王位继承者。以“你必不至于……缺少……”译出，既自然又不弱化条件性的应许。
  - severity: low
    issue: 脚注的“断绝一个为你坐以色列王位的人”中“为你坐”在汉语中容易被理解为代替你坐王位。
    rationale: 原文的 לְךָ 修饰“被剪除／断绝”所涉及的大卫王朝利益，而不是“坐王位”的服务对象。调整语序可避免歧义。
