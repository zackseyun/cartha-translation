  text: וְ/עַתָּ֞ה יְהוָ֣ה אֱלֹהֵ֣י יִשְׂרָאֵ֗ל שְׁ֠מֹר לְ/עַבְדְּ/ךָ֨ דָוִ֤ד אָבִ/י֙ אֵת֩ אֲשֶׁ֨ר דִּבַּ֤רְתָּ לּ/וֹ֙ לֵ/אמֹ֔ר לֹא יִכָּרֵ֨ת לְ/ךָ֥ אִישׁ֙ מִ/לְּ/פָנַ֔/י יֹשֵׁ֖ב עַל כִּסֵּ֣א יִשְׂרָאֵ֑ל רַ֠ק אִם יִשְׁמְר֨וּ בָנֶ֤י/ךָ אֶת דַּרְכָּ/ם֙ לָ/לֶ֣כֶת לְ/פָנַ֔/י כַּ/אֲשֶׁ֥ר הָלַ֖כְתָּ לְ/פָנָֽ/י׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/025.yaml
  text: And now[a], Yahweh, God of Israel, keep for your servant David my father what you spoke to him, saying, ‘A man shall not be cut off from before me for you, one sitting on the throne of Israel, if only your sons keep their way, by walking before me as you have walked before me.’
translation:
  language: zh_hans
  text: 现在，雅威以色列的神啊，求你为你仆人、我父大卫成就你对他所说的话。你曾说：‘你必不至于在我面前缺少坐以色列王位的人[a]；只要你的子孙谨守自己的道路，行在我面前，正如你行在我面前一样。’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文较直译为：“必不从我面前为你剪除一个坐以色列王位的人。”这是指大卫的王朝将继续有人承继王位。
    reason: 说明希伯来语“被剪除／断绝”的习语，并保留主文自然译法背后的字面形式。
lexical_decisions:
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语音译神的专名，避免用“主”这一称号取代原文的四字神名。
- source_word: שְׁמֹר
  choice: 成就
  rationale: 此处动词的宾语是神先前对大卫所说的话；在祷告语境中，“成就”自然表达信守并实现所说之言。
- source_word: לְעַבְדְּךָ דָוִד אָבִי
  choice: 为你仆人、我父大卫
  rationale: “仆人”保留大卫在神面前的身份与谦卑；“我父大卫”符合现代汉语称谓习惯。
- source_word: לֹא יִכָּרֵת לְךָ אִישׁ מִלְּפָנַי
  choice: 在我面前，你必不断有人
  rationale: 这是表示王朝延续的希伯来语习语；主文采用自然汉语表达，同时在脚注保留“剪除／断绝”的字面意象。
- source_word: יֹשֵׁב עַל כִּסֵּא יִשְׂרָאֵל
  choice: 坐以色列的王位
  rationale: 分词描述持续有人登位；“王位”比字面的“宝座”更直接传达此处王朝继承的含义。
- source_word: רַק אִם
  choice: 只要
  rationale: 保留原文对大卫子孙行为所提出的明确条件，又符合汉语条件句习惯。
- source_word: יִשְׁמְרוּ בָנֶיךָ אֶת דַּרְכָּם
  choice: 你的子孙谨守自己的道路
  rationale: “谨守道路”保留原文的行事为人隐喻；בָנֶיךָ在王朝延续语境中译作“子孙”较自然。
- source_word: לָלֶכֶת לְפָנַי
  choice: 行在我面前
  rationale: 保留“行走”表示生活方式的圣经意象，也清楚说明何谓谨守道路。
theological_decisions:
- issue: 大卫王朝应许在本节中的条件性
  choice: 明确保留“只要”所引出的条件，即大卫的子孙必须谨守道路、行在神面前。
  alternative: 将应许表述为完全无条件，而把顺服只解释为享受应许福分的条件。
  rationale: 原文 רַק אִם 明确引出条件；译文不借其他经文或神学体系消解本节自身的张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。祷告称呼用“啊”，请求用“求你”；保留“道路”“行在我面前”等重要的希伯来语意象，同时避免生硬照搬原文语序。
