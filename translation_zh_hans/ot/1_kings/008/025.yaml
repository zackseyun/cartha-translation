revisions:
- from: 现在，雅威以色列的神啊，求你为你仆人、我父大卫成就你对他所说的话。你曾说：‘在我面前，你必不断有人坐以色列的王位[a]；只要你的子孙谨守自己的道路，行在我面前，像你行在我面前一样。’
  to: 现在，雅威以色列的神啊，求你为你仆人、我父大卫成就你对他所说的话。你曾说：‘你必不至于在我面前缺少坐以色列王位的人[a]；只要你的子孙谨守自己的道路，行在我面前，正如你行在我面前一样。’
  rationale: 修订仅处理王朝继承句及其脚注的汉语表达。“你必不至于在我面前缺少坐以色列王位的人”自然表达“不为你剪除一人”的习语义，同时保留“在我面前”、大卫作为受益者，以及坐以色列王位的继承者。保留“只要”所引出的明确条件，未对该条件作任何神学消解。
