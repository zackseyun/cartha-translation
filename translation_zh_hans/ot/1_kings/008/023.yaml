  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יֹּאמַ֗ר יְהוָ֞ה אֱלֹהֵ֤י יִשְׂרָאֵל֙ אֵין כָּמ֣וֹ/ךָ אֱלֹהִ֔ים בַּ/שָּׁמַ֣יִם מִ/מַּ֔עַל וְ/עַל הָ/אָ֖רֶץ מִ/תָּ֑חַת שֹׁמֵ֤ר הַ/בְּרִית֙ וְֽ/הַ/חֶ֔סֶד לַ/עֲבָדֶ֕י/ךָ הַ/הֹלְכִ֥ים לְ/פָנֶ֖י/ךָ בְּ/כָל לִבָּֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/023.yaml
  text: And he said[a], “O Yahweh, God of Israel, there is no God like you in heaven above or on earth beneath[b], keeping the covenant and the steadfast love for your servants who walk before you with all their heart.”
translation:
  language: zh_hans
  text: 他说：“耶和华—以色列的上帝啊，天上地下没有神能与你相比。你向那些一心一意行在你面前的仆人守约，施慈爱[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “慈爱”所译的希伯来词也有忠诚、信实和持久之爱的含义；在这里尤其指守约的爱。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמַר
  choice: 他说
  rationale: 未在孤立经节中机械加入“于是”或“又”；中文叙事以“他说”自然承接上下文。
- source_word: יְהוָה אֱלֹהֵי יִשְׂרָאֵל
  choice: 耶和华—以色列的上帝啊
  rationale: 以“耶和华”呈现神名，并用现代中文呼语清楚表达同位关系。
- source_word: אֵין כָּמוֹךָ אֱלֹהִים
  choice: 没有神能与你相比
  rationale: 保留“神”的表述及不可比拟的断言，不擅自将其扩展为抽象的唯一性公式。
- source_word: בַּשָּׁמַיִם מִמַּעַל וְעַל הָאָרֶץ מִתָּחַת
  choice: 天上地下
  rationale: 用自然凝练的中文表达“上面的天与下面的地”这一涵盖全宇宙的两极说法。
- source_word: שֹׁמֵר הַבְּרִית וְהַחֶסֶד
  choice: 守约，施慈爱
  rationale: 将两个带定冠词的并列宾语按汉语习惯处理为相配的动宾结构，既表达信守盟约，也保留慈爱行动的意味。
- source_word: לַעֲבָדֶיךָ
  choice: 向……你的仆人
  rationale: 介词关系在中文中以“向”自然表达神对其仆人的守约施爱。
- source_word: הַהֹלְכִים לְפָנֶיךָ
  choice: 行在你面前
  rationale: 保留希伯来文“行走”的生活行为隐喻和在神面前而行的关系含义。
- source_word: בְּכָל לִבָּם
  choice: 一心一意
  rationale: 自然表达全心、专一的内在忠诚；避免把“心”收窄为单纯情感。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 采用现代中文读者最熟悉的专名形式，同时不以“主”这一称号取代原文中的神名。
- issue: אֱלֹהִים 在不可比拟公式中的数与所指
  choice: 没有神能与你相比
  alternative: 在众神中没有谁像你
  rationale: 原句可以涉及其他被称为“神”的存在，也可作为对以色列上帝独一无比的宣告；所选译法保留这层张力，不明确承认诸神具有与耶和华同等的神性。
- issue: חֶסֶד 与“约”并列时的含义
  choice: 慈爱
  alternative: 信实的爱／忠贞之爱
  rationale: “慈爱”简洁且有圣经语域；脚注说明其中兼有忠诚、信实和持久之爱的盟约含义，避免只理解为温柔情感或怜悯。
- issue: “全心”与人的整体忠诚
  choice: 一心一意
  alternative: 全心
  rationale: 此处“心”涵盖意志、思想与内在取向；“一心一意”在现代中文中自然表达不分心的忠诚。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留“行在你面前”这一重要的希伯来式生活隐喻；其余语序按自然中文调整。主文中的脚注标记[a]与脚注完全对应。
