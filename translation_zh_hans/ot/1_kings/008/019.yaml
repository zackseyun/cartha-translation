  text: רַ֣ק אַתָּ֔ה לֹ֥א תִבְנֶ֖ה הַ/בָּ֑יִת כִּ֤י אִם בִּנְ/ךָ֙ הַ/יֹּצֵ֣א מֵ/חֲלָצֶ֔י/ךָ הֽוּא יִבְנֶ֥ה הַ/בַּ֖יִת לִ/שְׁמִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/019.yaml
  text: Nevertheless[a], you shall not build the house; rather, your son who comes from your own body, he shall build the house for my name.
translation:
  language: zh_hans
  text: 只是你不可建造这殿；而是你那从你腰间所出的儿子[a]，他必为我的名建造这殿。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“从你的腰间出来的。”这是指亲生后裔的习语。
    reason: 说明“从你腰间所出”的希伯来习语含义，同时保留正文的身体意象。
lexical_decisions:
- source_word: רַק
  choice: 然而
  rationale: 此处引出对前文认可的限制，具有转折和让步意味；“然而”自然传达这种语气。
- source_word: לֹא תִבְנֶה
  choice: 你不可建造
  rationale: 否定未完成式在神的宣告中兼具禁令与既定安排的意味；“不可”保留庄重语气，也不完全消除两者之间的张力。
- source_word: הַבָּיִת
  choice: 这殿
  rationale: בַּיִת 字面为“房屋”，但本语境明确指为耶和华所建的圣殿；现代汉语称“这殿”既简洁自然，也保留“殿宇”的表达，而不使用较泛的“房屋”。
- source_word: כִּי אִם
  choice: 惟有
  rationale: 该词组构成“不是你，而是你儿子”的排他性对比；“惟有”能清楚表现这一转折。
- source_word: בִּנְךָ
  choice: 你的儿子
  rationale: 单数附属代词指向大卫的一个特定儿子；直译为“你的儿子”。
- source_word: הַיֹּצֵא מֵחֲלָצֶיךָ
  choice: 你亲生的
  rationale: 原文直指“从你的腰间出来”，是表示亲身后裔的习语；“亲生的”在现代汉语中准确而自然，字面意象收入脚注。
- source_word: הוּא
  choice: 他
  rationale: 独立人称代词带有强调作用；保留“他”，突出建殿者是这个儿子而不是大卫。
- source_word: יִבְנֶה הַבַּיִת
  choice: 他必……建造这殿
  rationale: “必”适合表达神圣宣告中的确定未来，并保留原文重复“建造这殿”的结构。
- source_word: לִשְׁמִי
  choice: 为我的名
  rationale: 直译保留圣经中关于圣殿归于耶和华之名的神学表达，不扩展解释为“尊荣我的名”。
theological_decisions:
- issue: בַּיִת 应译为“房屋”还是按语境译为“殿”
  choice: 殿
  alternative: 房屋
  rationale: 原词通常意为“房屋”，但此处特指献给耶和华之名的圣殿。中文“殿”既准确标示所指，又未额外加入原文没有的“圣”字。
- issue: לֹא תִבְנֶה 是禁令还是未来宣告
  choice: 你不可建造
  alternative: 你不会建造
  rationale: 语境是神对大卫的庄重宣告，既规定大卫不得承担建殿之工，也确定建殿者另有其人；“不可”较能保留命令和定旨之间的张力。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“然而……惟有……”呈现鲜明对比；重复“建造这殿”，并以独立的“他”保留希伯来文的强调。
