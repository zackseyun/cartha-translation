base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/012.yaml
  text: Then Solomon said[a], “Yahweh said that he would dwell in the thick darkness.”
translation:
  language: zh_hans
  text: 那时，所罗门说：“雅威曾说，他要住在幽暗中[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“暗云中”。希伯来语“עֲרָפֶל”可指浓密的黑暗，也可指暗云，尤其见于描述雅威显现的语境。
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: 那时
  rationale: 作为时间性话语标记，引出所罗门接下来的话；“那时”自然地承接上文叙事，也保留事件发生的先后关系。
- source_word: אָמַר
  choice: 说／曾说
  rationale: אמר是引介言语的常用动词。第一处译为“说”，第二处在转述雅威先前的话时译为“曾说”，使现代汉语表达自然，同时不增加原文没有的具体时间信息。
- source_word: שְׁלֹמֹה
  choice: 所罗门
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以音译保留四字神名，避免用称号代替原文中的专名。
- source_word: לִשְׁכֹּן
  choice: 他要住
  rationale: 介词לְ加不定式在“说”之后表达所说内容或意向；译成“他要住”符合现代汉语间接引语习惯，并保留居住、停驻之意。
- source_word: בָּעֲרָפֶל
  choice: 在幽暗中
  rationale: עֲרָפֶל可指浓密的黑暗、昏暗，也可在神显语境中指暗云。“幽暗”既保留遮蔽与深暗的意象，又不把含义限定为一般气象现象。
theological_decisions:
- issue: 雅威住在עֲרָפֶל中的神显意象
  choice: 他要住在幽暗中
  alternative: 他要住在暗云中
  rationale: “幽暗”保留神临在与不可见、被遮蔽并存的张力，不将原文直接化约为单纯的云层意象；脚注同时交代“暗云”这一合理译法。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“那时”承接叙事，“曾说”清楚标示所罗门在转述雅威的话；“幽暗”保持神显语境中的庄严感和原词的语义开放性。
