  text: וְ/אַתָּה֙ תִּשְׁמַ֣ע הַ/שָּׁמַ֔יִם וְ/סָ֣לַחְתָּ֔ לְ/חַטַּ֖את עַמְּ/ךָ֣ יִשְׂרָאֵ֑ל וַ/הֲשֵֽׁבֹתָ/ם֙ אֶל הָ֣/אֲדָמָ֔ה אֲשֶׁ֥ר נָתַ֖תָּ לַ/אֲבוֹתָֽ/ם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/034.yaml
  text: then may you hear in heaven and forgive the sin of your people Israel[c][b][a], and bring them back to the land that you gave to their fathers.
translation:
  language: zh_hans
  text: 求你在天上垂听[a]，赦免你子民以色列的罪，并使他们回到[b]你赐给他们列祖[c]的土地。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“求你从天上垂听。”
    reason: lexical_alternative
  - marker: b
    text: 或译：“使他们重归那地。”
    reason: lexical_alternative
  - marker: c
    text: “列祖”指上帝曾把这片土地赐给的先祖。
    reason: cultural_note
lexical_decisions:
- source_word: תִּשְׁמַע הַשָּׁמַיִם
  choice: 在天上垂听
  rationale: 希伯来文在“垂听”与“天”之间没有明示介词；“在天上垂听”保留天作为上帝居所的空间意象，也符合现代汉语祷告语体。“从天上垂听”亦属可能，列入脚注。
- source_word: וְסָלַחְתָּ לְחַטַּאת
  choice: 赦免……的罪
  rationale: סלח在此指上帝赦罪；חטאת为单数集合性用法，指以色列人的罪，而非赎罪祭。
- source_word: עַמְּךָ יִשְׂרָאֵל
  choice: 你子民以色列
  rationale: 直截了当地保留以色列作为上帝子民的身份，语序自然且未增添解释。
- source_word: וַהֲשֵׁבֹתָם
  choice: 使他们回到
  rationale: שוב的使役式表达“使……返回”；此处所指是具体回归那片土地，故用“使他们回到”，比抽象的“复兴”更准确。
- source_word: אֶל הָאֲדָמָה
  choice: 回到……土地
  rationale: אֲדָמָה虽可指地面或土壤，此处涉及赐给列祖之地，明确具有地域意义，故译为“土地”。
- source_word: אֲשֶׁר נָתַתָּ לַאֲבוֹתָם
  choice: 你赐给他们列祖的
  rationale: 保留赐地应许的措辞；“列祖”在庄重而易懂的现代汉语中可准确指承受应许的先祖。
theological_decisions:
- issue: לַאֲבוֹתָם在赐地应许中的所指
  choice: 他们列祖
  alternative: 他们的祖先
  rationale: “列祖”既保留原文阳性复数在盟约历史中的具体色彩，也自然指向承受赐地应许的先祖；不进一步限定为某几位族长，以免加入原文未明说的解释。
- issue: וַהֲשֵׁבֹתָם所表达的恢复
  choice: 使他们回到……土地
  alternative: 使他们重归那片土地
  rationale: 原文使役式与方向短语共同表达实际返回土地，而不只是抽象或属灵意义上的恢复；此译法保留空间与应许之地的关联。
- issue: 祈求语气
  choice: 求你……
  alternative: 愿你……
  rationale: 希伯来文未完成式位于所罗门的祷告中，具有祈求意味；“求你”在现代汉语中清楚自然，同时不把祈求改写为命令或确定预告。
translation_notes:
  register: 采用现代、庄重而清楚的祷告语体。“垂听”“赦免”“列祖”保留经文的礼仪与盟约语感，但句法保持现代汉语的流畅性。所有脚注标记均置于相应词语之后。
