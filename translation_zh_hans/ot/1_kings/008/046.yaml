  text: כִּ֣י יֶֽחֶטְאוּ לָ֗/ךְ כִּ֣י אֵ֤ין אָדָם֙ אֲשֶׁ֣ר לֹא יֶחֱטָ֔א וְ/אָנַפְתָּ֣ בָ֔/ם וּ/נְתַתָּ֖/ם לִ/פְנֵ֣י אוֹיֵ֑ב וְ/שָׁב֤וּ/ם שֹֽׁבֵי/הֶם֙ אֶל אֶ֣רֶץ הָ/אוֹיֵ֔ב רְחוֹקָ֖ה א֥וֹ קְרוֹבָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/046.yaml
  text: When they sin against you—for there is no one who does not sin—and you become angry with them and give them over to an enemy[a], and their captors carry them away captive to the land of the enemy, whether far away or near,
translation:
  language: zh_hans
  text: 他们若得罪你——因为没有不犯罪的人——你向他们发怒，把他们交在仇敌手中，掳掠他们的人把他们掳到仇敌之地，无论远近，
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי יֶחֶטְאוּ לָךְ
  choice: 他们若得罪你
  rationale: 句首כִּי在所罗门祷告中引出假设情形，译作“若”可保留条件意味；חטא加ל表示针对某人的罪过，“得罪你”自然且准确。
- source_word: כִּי אֵין אָדָם אֲשֶׁר לֹא יֶחֱטָא
  choice: 因为世上没有不犯罪的人
  rationale: אָדָם在此泛指人类，不限性别；“没有不犯罪的人”保留全称陈述，“世上”是符合现代汉语的自然补足，并未改变命题范围。
- source_word: וְאָנַפְתָּ בָם
  choice: 你向他们发怒
  rationale: אָנַף表达愤怒；“向他们发怒”保留怒气所针对的对象，语气庄重而不过度强化。
- source_word: וּנְתַתָּם לִפְנֵי אוֹיֵב
  choice: 把他们交在仇敌手中
  rationale: נתן加לפני在敌对语境中表示交付敌方权下；汉语“交在……手中”清楚表达被置于仇敌控制之下。
- source_word: אוֹיֵב
  choice: 仇敌
  rationale: 该名词为单数且无冠词；现代汉语通常不强制标明不定性，“仇敌”既可反映单数类指，也避免生硬的“一个仇敌”。
- source_word: וְשָׁבוּם שֹׁבֵיהֶם
  choice: 他们的俘虏者把他们掳到
  rationale: 保留希伯来语中“俘虏者”为主语、百姓为宾语的结构，并以“掳到”表达被掳迁移；词根重复所形成的强调在汉语中以同源意义的“俘虏者／掳”部分再现。
- source_word: אֶל אֶרֶץ הָאוֹיֵב
  choice: 到仇敌之地
  rationale: 忠实表达目的地及原文此处带冠词的“仇敌”；“仇敌之地”简洁庄重。
- source_word: רְחוֹקָה אוֹ קְרוֹבָה
  choice: 无论远近
  rationale: 两个阴性形容词修饰“地”；汉语“无论远近”自然保留二者的对举及范围开放性。
theological_decisions:
- issue: אָדָם的泛指范围
  choice: 人
  alternative: 男人／世人
  rationale: 此处单数אָדָם泛指全人类，译为“人”既保留普遍的人类指称，也不把经文限于男性；不借此加入任何特定的原罪论表述。
- issue: 犯罪的普遍性陈述
  choice: 没有不犯罪的人
  alternative: 无人不犯罪
  rationale: 保留原文明确的双重否定和普遍命题，不将其弱化为一般倾向，也不扩展说明其神学机制。
- issue: 上帝发怒与交付仇敌的关系
  choice: 并列连续叙述
  alternative: 把交付明确解释为发怒的惩罚结果
  rationale: 原文以连续的וְ连接动作；译文保留次序和关联，但不额外加入“因此惩罚”等解释性因果词。
translation_notes:
  register: 采用现代、庄重、易懂的祷告叙事语体。经文在本节末仍未完句，因此保留末尾逗号，与后续条件从句衔接。
