  yaml_path: translation/ot/1_kings/008/003.yaml
  text: And all the elders of Israel came[b][a], and the priests carried the ark.
translation:
  language: zh_hans
  text: 以色列的众长老都来了，祭司们便抬着约柜[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节原文只称“那柜”；根据上下文，所指为约柜。“抬着”也可译为“抬运”；该词字面可指“举起”或“抬起”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: 来了
  rationale: 这是叙事序列中的动词，基本义为“来、到来”；原文没有明说进入何处，因此译作“来了”简洁且不增添信息。
- source_word: כֹּל זִקְנֵי יִשְׂרָאֵל
  choice: 以色列的众长老都
  rationale: כֹּל 修饰“以色列的长老”，表示全体；“众长老都”在现代汉语中自然，并明确保留“全都”的范围。
- source_word: וַיִּשְׂאוּ
  choice: 就抬起
  rationale: נשׂא 可指举起、抬起或抬运；此处首先描述祭司把约柜抬起，随后语境涉及搬运。译作“抬起”贴近词义，并以脚注提示也可理解为“抬着搬运”。
- source_word: הַכֹּהֲנִים
  choice: 祭司们
  rationale: 保留原文定指复数，指在场承担此行动的祭司群体。
- source_word: אֶת הָאָרוֹן
  choice: 约柜
  rationale: אָרוֹן 单独看是“柜”，但此处有定冠词，所指对象由上下文明确为耶和华的约柜；汉语用约定俗成的“约柜”能清楚指认该对象。脚注说明本节原文仅作“柜”，避免掩盖原文措辞。
theological_decisions:
- issue: 本节是否直接补出“约”的概念
  choice: 正文译作“约柜”，并以脚注说明原文在本节只写“柜”
  alternative: 正文直译作“柜”或“那柜”
  rationale: 上下文明示所指为约柜，现代汉语若只写“柜”容易造成误解；同时脚注保留本节原文未使用完整称号这一事实，不据此加入额外神学说明。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“众长老都来了”保留全体到场之意；“祭司们就抬起”清楚呈现叙事推进。将两个相关的词汇说明合并为一个简短脚注，且正文中的[a]与脚注对应。
