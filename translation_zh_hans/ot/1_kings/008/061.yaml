source:
  edition: WLC
  text: וְ/הָיָ֤ה לְבַבְ/כֶם֙ שָׁלֵ֔ם עִ֖ם יְהוָ֣ה אֱלֹהֵ֑י/נוּ לָ/לֶ֧כֶת בְּ/חֻקָּ֛י/ו וְ/לִ/שְׁמֹ֥ר מִצְוֺתָ֖י/ו כַּ/יּ֥וֹם הַ/זֶּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/061.yaml
  text: Let your heart therefore be wholly with Yahweh our God[a], to walk in his statutes and to keep his commandments[b], as at this day.
translation:
  language: zh_hans
  text: 所以，愿你们的心全然归向雅威——我们的神，遵行他的律例，谨守他的诫命，像今日一样[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“如同这日”。这句话以当日的情形作为这种忠诚的范例或见证，具体所指仍有含蓄性。
    reason: 说明希伯来语时间短语的惯用含义，同时保留其指向的含蓄性。
lexical_decisions:
- source_word: וְהָיָה
  choice: 要
  rationale: 在所罗门劝勉的语境中，此处带有祈使、劝勉意味；用“要”自然表达，不译为单纯的将来时。
- source_word: לְבַבְכֶם
  choice: 你们的心
  rationale: לֵבָב指人的内在，包括意志、思想和忠诚；“心”保留原文意象，也符合现代汉语的经文语体。
- source_word: שָׁלֵם עִם יְהוָה אֱלֹהֵינוּ
  choice: 完全归向耶和华我们的神
  rationale: שָׁלֵם在此强调完整、毫无保留的忠诚；“完全归向”以自然汉语表达其关系性和盟约性含义，同时不将其解释为无罪的完全。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经传统中广为人知的专名“耶和华”呈现四字神名，使普通读者可辨识其为以色列之神的名，而非一般称号。
- source_word: לָלֶכֶת בְחֻקָּיו
  choice: 遵行他的律例
  rationale: 原文直译为“行走在他的律例中”；中文用“遵行”自然传达生活行事依照律例的惯用含义。
- source_word: וְלִשְׁמֹר מִצְוֺתָיו
  choice: 谨守他的诫命
  rationale: שׁמר在律法语境中表示持守、遵守；“谨守”保留认真守护并实行的意味。
- source_word: כַּיּוֹם הַזֶּה
  choice: 像今日一样
  rationale: 保留原文以当前这一天作为忠诚之实例或见证的表达，不额外限定所指的具体行为。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。正文采用中文读者最熟悉、且明确作为专名的“耶和华”；“雅威”是较接近学术重构发音的另一译法，但希伯来传统未保存其确定的原始元音。
- issue: שָׁלֵם 所表达的完整忠诚
  choice: 完全归向
  alternative: 一心一意归向／毫无二心地归向
  rationale: 这里劝勉人对神保持完整而不分裂的忠诚，并非断言达到无罪状态。“完全归向”保留这种盟约忠诚及其神学张力。
- issue: כַּיּוֹם הַזֶּה 的指向
  choice: 像今日一样
  alternative: 像今天这样
  rationale: 原文简略地以“今日”为当下的范例或见证，并未明说究竟指哪一项表现；译文保持这种含蓄，不擅自补足。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“遵行他的律例，谨守他的诫命”保留希伯来文的平行结构；“完全归向”避免生硬的“心完全与……同在”，同时保留毫无二心的盟约忠诚含义。
