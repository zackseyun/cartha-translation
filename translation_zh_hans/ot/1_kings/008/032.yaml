  text: וְ/אַתָּ֣ה תִּשְׁמַ֣ע הַ/שָּׁמַ֗יִם וְ/עָשִׂ֨יתָ֙ וְ/שָׁפַטְתָּ֣ אֶת עֲבָדֶ֔י/ךָ לְ/הַרְשִׁ֣יעַ רָשָׁ֔ע לָ/תֵ֥ת דַּרְכּ֖/וֹ בְּ/רֹאשׁ֑/וֹ וּ/לְ/הַצְדִּ֣יק צַדִּ֔יק לָ֥/תֶת ל֖/וֹ כְּ/צִדְקָתֽ/וֹ׀־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/032.yaml
  text: then hear in heaven and act[a], and judge your servants, condemning the wicked by bringing his way upon his own head[c][b], and justifying the righteous by giving to him according to his righteousness.
translation:
  language: zh_hans
  text: 求你在天上垂听并采取行动，审判你的仆人：定恶人有罪，使他的所作所为归到他自己头上[a]；判义人无罪[b]，照他的义报偿他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “使他的所作所为归到他自己头上”是希伯来语习惯说法，意思是照他所行的报应他。
    reason: cultural_note
  - marker: b
    text: 或译“宣告义人为义”或“为义人申明清白”。这里的原文是司法用语。
    reason: alternative_reading
lexical_decisions:
- source_word: תִּשְׁמַע הַשָּׁמַיִם
  choice: 在天上垂听
  rationale: 原文直译近似“听诸天”，在本祷告语境中“诸天”作处所用，指上帝在天上垂听；“垂听”符合现代汉语祷告语体，又不改变动词含义。
- source_word: וְעָשִׂיתָ
  choice: 并采取行动
  rationale: עשה含义宽泛，可指“做、行动”；此处是祈求上帝听后介入，“采取行动”比单说“做”自然清楚。
- source_word: וְשָׁפַטְתָּ אֶת עֲבָדֶיךָ
  choice: 审判你的仆人
  rationale: שׁפט引出司法裁断，后面的两个不定式说明裁断结果；保留“审判”可避免预先偏向任何一方。
- source_word: לְהַרְשִׁיעַ רָשָׁע
  choice: 定恶人有罪
  rationale: רשע的使役形式在司法语境中表示宣告有罪；“定……有罪”准确保留法庭含义。
- source_word: לָתֵת דַּרְכּוֹ בְּרֹאשׁוֹ
  choice: 使他的所作所为归到他自己头上
  rationale: דרך在此指人的行为或行径；保留“归到自己头上”的希伯来意象，同时以“所作所为”清楚表达其含义。
- source_word: וּלְהַצְדִּיק צַדִּיק
  choice: 判义人无罪
  rationale: צדק的使役形式在此与“定恶人有罪”平行，表示司法上的宣告或判定，而非使人在道德上发生改变。
- source_word: לָתֶת לוֹ כְּצִדְקָתוֹ
  choice: 照他的义报偿他
  rationale: 原文表示按义人的义给予他；汉语若直译“给他”宾语不明，“报偿”自然表达相称的回报，同时“照他的义”保留原文的判断标准。
theological_decisions:
- issue: 司法宣告还是道德转化
  choice: 将两个平行动词译作“定恶人有罪”和“判义人无罪”
  alternative: 译作“惩罚恶人”和“称义义人”
  rationale: 上下文是起誓之后求上帝裁断的法庭场景；两个使役动词在这里首先指司法判决。这样既保留其对称关系，也避免把经文解释成道德转化或引入后来的专门神学用语。
- issue: 按义报偿的含义
  choice: 保留“照他的义报偿他”
  alternative: 释义为“按他的善行奖赏他”
  rationale: 原文明确使用צדקה（义、正直）并表达相称的回报；保留“义”可维持原文的伦理与司法张力，不将其缩减为一般的善行奖赏。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“垂听”保留祷告语体；司法对句译为“定……有罪／判……无罪”，避免“称义”可能带来的专门术语色彩。主文保留“归到自己头上”的源语意象，并用脚注解释。
