  text: וְ/סָלַחְתָּ֤ לְ/עַמְּ/ךָ֙ אֲשֶׁ֣ר חָֽטְאוּ לָ֔/ךְ וּ/לְ/כָל פִּשְׁעֵי/הֶ֖ם אֲשֶׁ֣ר פָּשְׁעוּ בָ֑/ךְ וּ/נְתַתָּ֧/ם לְ/רַחֲמִ֛ים לִ/פְנֵ֥י שֹׁבֵי/הֶ֖ם וְ/רִֽחֲמֽוּ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/050.yaml
  text: and forgive your people who have sinned against you[a], and all their transgressions that they have committed against you, and grant them compassion before those who took them captive[b], so that they may have compassion on them.
translation:
  language: zh_hans
  text: 求你赦免那些得罪你的子民，以及他们一切背叛你的过犯；又使他们在掳走他们的人面前蒙怜悯，好让那些人怜悯他们。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “好让那些人怜悯他们”也可译作“那些人就会怜悯他们”；末句既可理解为目的，也可理解为结果。
    reason: alternative_reading
lexical_decisions:
- source_word: וְסָלַחְתָּ
  choice: 求你赦免
  rationale: 该第二人称阳性单数完成式在所罗门祷告的语境中承接前文请求，具有祈求意味；加“求你”可在现代汉语中自然表达其语篇功能。
- source_word: לְעַמְּךָ אֲשֶׁר חָטְאוּ לָךְ
  choice: 你的子民得罪你的罪
  rationale: לְעַמְּךָ指“你的子民”；חטא加ל标明受冒犯的一方，译作“得罪你”自然准确。补出“罪”作为“赦免”的宾语，使汉语句法顺畅，并与后面的“过犯”并列。
- source_word: וּלְכָל־פִּשְׁעֵיהֶם אֲשֶׁר פָּשְׁעוּ בָךְ
  choice: 以及他们背叛你的一切过犯
  rationale: 名词与同根动词形成强调；פשע兼有“过犯”和“背叛”之意。用“背叛你的一切过犯”既避免生硬的同词重复，也保留其针对上帝、带有悖逆色彩的含义。
- source_word: וּנְתַתָּם לְרַחֲמִים
  choice: 又使他们……蒙怜悯
  rationale: נתן加לְרַחֲמִים表示使他们处于得蒙怜悯的境况；“使……蒙怜悯”比逐字的“把他们交给怜悯”更符合现代汉语。
- source_word: לִפְנֵי שֹׁבֵיהֶם
  choice: 在掳走他们的人面前
  rationale: שֹׁבֵיהֶם是“掳掠他们的人／俘虏他们的人”；展开译为“掳走他们的人”清楚自然，并保留לִפְנֵי“在……面前”的表达。
- source_word: וְרִחֲמוּם
  choice: 好让那些人怜悯他们
  rationale: 以目的／结果从句表达末尾动词与前句的关系，并用“那些人”明确主语是掳走他们的人；“怜悯”也保留רַחֲמִים与רחם之间的词根呼应。
theological_decisions:
- issue: 上帝赦免与掳掠者施怜悯之间的关系
  choice: 译作祈求上帝使子民在掳掠者面前蒙怜悯，好让掳掠者怜悯他们。
  alternative: 末句也可按结果理解为“那些人就会怜悯他们”。
  rationale: 希伯来语以连续结构将上帝所赐的蒙怜悯处境与掳掠者的怜悯相连，但末句可表达目的，也可表达结果。正文采用自然的目的表达，脚注保留结果读法，避免把因果关系规定得过细。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“子民”“赦免”“过犯”“怜悯”保留祷告与盟约语境的分量；用“掳走他们的人”代替较书面的“掳掠者”，便于普通读者理解。
