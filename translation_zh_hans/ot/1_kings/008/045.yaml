  text: then hear in heaven their prayer and their plea[b][a], and uphold their cause.
translation:
  language: zh_hans
  text: 求你在天上垂听他们的祷告和恳求，并为他们主持公道。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“为他们施行公正”，或“维护他们的正当权益”。希伯来文直译为“施行他们的审判／公理”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁמַעְתָּ
  choice: 求你……垂听
  rationale: 这是带连接词的第二人称阳性单数完成式；在所罗门向上帝祈求的语境中，汉语用“求你……垂听”自然表达其祈愿功能，“垂听”也符合庄重而易懂的祷告语体。
- source_word: הַשָּׁמַיִם
  choice: 在天上
  rationale: 原文直译为“诸天/天”；此处无“从”所对应的介词，且在祷告公式中理解为上帝垂听所在的领域，因此译作“在天上”，既自然又贴近原文形式。
- source_word: תְּפִלָּתָם
  choice: 他们的祷告
  rationale: תְּפִלָּה是祷告的一般用语；单数名词带复数所属后缀，可自然地集体表达为“他们的祷告”。
- source_word: תְּחִנָּתָם
  choice: 他们的恳求
  rationale: תְּחִנָּה指恳切求恩、求怜悯的话；“恳求”是现代汉语中自然、庄重的表达，并保留其较“祷告”更迫切的意味。
- source_word: וְעָשִׂיתָ מִשְׁפָּטָם
  choice: 并为他们主持公道
  rationale: 字面为“施行他们的审判/公理”，是司法性习语，意为替他们施行正义、维护其案件或权利。“为他们主持公道”在现代汉语中自然，并保留上帝为他们伸张正义的含义。
theological_decisions:
- issue: 向上帝祈求时使用的司法性习语
  choice: 译为“为他们主持公道”
  alternative: “为他们施行公正”或“维护他们的正当权益”
  rationale: 原文 עשה משפטם 可指为某人施行公义、维护其诉求或案件。正文保留司法和关系层面的含义，却不预先断言他们在一切方面都无罪，也不引入更狭窄的教义解释。
translation_notes:
  register: 采用现代、庄重而通顺的祷告语体。“求你”明确汉语中的祈愿语气；“垂听”保持敬虔语域但不古奥。正文只设一个脚注，标记已在相关句末出现。
