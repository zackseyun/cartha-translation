base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/062.yaml
  text: And the king and all Israel with him were sacrificing sacrifices before Yahweh[a].
translation:
  language: zh_hans
  text: 王和与他同在的全体以色列人，都在雅威面前献祭[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文以动词与同根名词连用，字面可译作“献祭牲”，借此强调献祭这一行动；也可译作“献上祭牲”。
    reason: 说明原文同根词结构及可选译法。
lexical_decisions:
- source_word: וְהַמֶּלֶךְ
  choice: 王
  rationale: 定冠词表明是上文已经提到的王，即所罗门；汉语在语境明确时无需另加“那位”。句首连接词 וְ 在汉语叙事中可不明译，以免表达生硬。
- source_word: וְכָל יִשְׂרָאֵל
  choice: 和所有……以色列人
  rationale: יִשְׂרָאֵל 是集合性的民族称谓；译作“所有……以色列人”既保留整体含义，也符合现代汉语习惯。
- source_word: עִמּוֹ
  choice: 跟他在一起的
  rationale: 明确表达这些以色列人与王同在，同时自然地修饰“以色列人”。
- source_word: זֹבְחִים זֶבַח
  choice: 献祭
  rationale: 原文是动词与同根名词连用的结构，近似直译为“宰献祭物”。正文采用自然的汉语“献祭”，并以脚注说明原文的同根词结构及强调作用。
- source_word: לִפְנֵי
  choice: 在……面前
  rationale: 保留原文的空间及礼仪性表达，说明献祭是在雅威面前进行。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见音译呈现四字神名，而不以称号替代其专名。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。译作“雅威”可保留其作为以色列之神专名的性质，不以“主”这一称号替代；“耶和华”是传统形式，但较不贴近学界通常重构的读音。
- issue: 献祭动作的持续性
  choice: 都在……献祭
  alternative: 都献了祭
  rationale: 分词 זֹבְחִים 描写当时正在进行或持续展开的行动；“都在……献祭”保留这一体貌，不把它处理成单纯的完成事件。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。“跟他在一起的”比“与他同在的”更易懂；“在雅威面前献祭”则保留礼仪语境所需的庄重感。
