source:
  edition: WLC
  text: וַ/יְהִ֣י כְּ/כַלּ֣וֹת שְׁלֹמֹ֗ה לְ/הִתְפַּלֵּל֙ אֶל יְהוָ֔ה אֵ֛ת כָּל הַ/תְּפִלָּ֥ה וְ/הַ/תְּחִנָּ֖ה הַ/זֹּ֑את קָ֞ם מִ/לִּ/פְנֵ֨י מִזְבַּ֤ח יְהוָה֙ מִ/כְּרֹ֣עַ עַל בִּרְכָּ֔י/ו וְ/כַפָּ֖י/ו פְּרֻשׂ֥וֹת הַ/שָּׁמָֽיִם׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/054.yaml
  text: And when Solomon had finished praying to Yahweh with all this prayer and plea for favor[a], he rose from before the altar of Yahweh[b], from kneeling on his knees with his palms spread out toward heaven.
translation:
  language: zh_hans
  text: 所罗门向雅威祷告，作完这一切祷告和恳求[a]之后，就从雅威的祭坛前站起来；他原先双膝跪地，双掌[b]向天展开。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “恳求”也可译作“求恩”或“求怜悯”；希伯来语这个词指恳切请求恩惠或怜悯。
    reason: lexical_alternative
  - marker: b
    text: 希伯来语具体指“手掌”；有些译本较笼统地译作“双手”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כְּכַלּוֹת
  choice: ……作完……之后
  rationale: כְּ加不定式构成时间从句；汉语用“……之后”自然表达动作完成后的时间关系，不机械保留“事情是这样”。
- source_word: לְהִתְפַּלֵּל אֶל יְהוָה
  choice: 向雅威祷告
  rationale: אֶל表示祷告所朝向的对象；采用现代汉语常用搭配“向……祷告”。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文四字神名作音译，保留其专名性质，不以称号替代。
- source_word: אֵת כָּל הַתְּפִלָּה וְהַתְּחִנָּה הַזֹּאת
  choice: 这一切祷告和恳求
  rationale: תְּפִלָּה是一般意义的祷告，תְּחִנָּה是恳切求取恩惠或怜悯；“恳求”既保留二者区别，又不把所求内容限定得超过原文。
- source_word: קָם מִלִּפְנֵי מִזְבַּח יְהוָה
  choice: 就从雅威的祭坛前站起来
  rationale: קום在这里指由跪姿起身；“祭坛前”保留לִפְנֵי的空间含义。
- source_word: מִכְּרֹעַ עַל בִּרְכָּיו
  choice: 他原先双膝跪地
  rationale: 原文明确提到膝盖。汉语用“双膝跪地”自然呈现姿态，并借“原先”说明这是站起之前的状态。
- source_word: וְכַפָּיו פְּרֻשׂוֹת הַשָּׁמָיִם
  choice: 双掌向天展开
  rationale: כַּף具体指手掌；“向天展开”保留双掌朝向天空并张开的祷告姿势。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。音译“雅威”保留这是以色列之神专名的性质，而不以称号“主”替代。
- issue: תְּחִנָּה是否明确译出恩惠或怜悯
  choice: 恳求
  alternative: 求恩；求怜悯
  rationale: 该词含恳切求取恩惠或怜悯的意味，但本节没有明说所求的具体内容；正文采用较开放的“恳求”，脚注说明其语义色彩，以免过度限定。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“作完这一切祷告和恳求”略保留原文中“祷告”动词与名词相邻的重复；后半句调整为符合汉语叙述习惯的姿态说明，但未省略双膝、双掌及向天等细节。
