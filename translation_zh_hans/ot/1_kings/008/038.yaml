source:
  edition: WLC
  text: כָּל תְּפִלָּ֣ה כָל תְּחִנָּ֗ה אֲשֶׁ֤ר תִֽהְיֶה֙ לְ/כָל הָ֣/אָדָ֔ם לְ/כֹ֖ל עַמְּ/ךָ֣ יִשְׂרָאֵ֑ל אֲשֶׁ֣ר יֵדְע֗וּ/ן אִ֚ישׁ נֶ֣גַע לְבָב֔/וֹ וּ/פָרַ֥שׂ כַּפָּ֖י/ו אֶל הַ/בַּ֥יִת הַ/זֶּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/038.yaml
  text: whatever prayer[a], whatever plea, may be made by any man or by all your people Israel, each knowing the affliction of his own heart and spreading out his hands toward this house[c][b],
translation:
  language: zh_hans
  text: 无论任何人，还是你所有的子民以色列，所献上的什么祷告、什么恳求[a]，若各人知道自己内心的灾病[b]，向这殿[c]伸开双手，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “所献上的”也可理解为“为任何人或为你所有的子民以色列所献上的”；原文介词在此可表示祷告者，也可表示祷告所关涉的对象。
    reason: lexical_alternative
  - marker: b
    text: 直译“他心的灾病”；也可译为“内心的祸患”“内心的痛苦”。
    reason: lexical_alternative
  - marker: c
    text: “这殿”指这座圣殿；原文直译为“这房屋”。
    reason: cultural_note
lexical_decisions:
- source_word: כָּל תְּפִלָּה כָל תְּחִנָּה
  choice: 什么祷告、什么恳求
  rationale: 以“什么……什么……”自然表达 כָּל 在不定关系从句中的全面范围；“恳求”保留 תְּחִנָּה 比一般祷告更迫切的语气。
- source_word: אֲשֶׁר תִהְיֶה לְכָל הָאָדָם לְכֹל עַמְּךָ יִשְׂרָאֵל
  choice: 无论是任何一个人，还是你的全体子民以色列，献上
  rationale: 这里的 לְ 可表示祷告与祈祷者的关联，译作“献上”使现代汉语顺畅；个体与以色列全体之间的并列仍予保留。
- source_word: אֲשֶׁר יֵדְעוּן אִישׁ
  choice: 只要各人知道
  rationale: “各人”体现 אִישׁ 在群体范围内的分配性单数；“只要”将关系从句自然地表达为祈祷者所处的情形，不把原因强加给原文。
- source_word: נֶגַע לְבָבוֹ
  choice: 自己心里的灾病
  rationale: נֶגַע 的本义包括灾病、击打或祸患；“心里的灾病”保留原文强烈而略带隐喻的措辞，不将其弱化为一般的忧苦。
- source_word: וּפָרַשׂ כַּפָּיו
  choice: 伸开双手
  rationale: 表达古代祷告时展开手掌的动作；现代汉语自然，同时保留具体身体姿态。
- source_word: אֶל הַבַּיִת הַזֶּה
  choice: 向这殿
  rationale: אֶל 表示朝向；הַבַּיִת 在本段明确指所罗门所献的圣殿，汉语用“殿”既简洁又清楚。
theological_decisions:
- issue: לְכָל הָאָדָם 与 לְכֹל עַמְּךָ 的施事或受益歧义
  choice: 按祷告由个人或全体子民献上来处理
  alternative: 祷告是为任何人或为全体以色列民献上的
  rationale: 后文“各人知道自己心里的灾病，向这殿伸开双手”更自然地把这些人视为祈祷者；但介词 לְ 本身容许关联或受益意义，因此以脚注保留另一理解。
- issue: נֶגַע לְבָבוֹ 的内在含义
  choice: 心里的灾病
  alternative: 心中的苦难／心中的祸患
  rationale: 保留 נֶגַע 的“灾病、击打”意象及其神学张力，不把它限定为罪疚、良心责备或单纯的情绪痛苦。
- issue: הַבַּיִת 的译法
  choice: 这殿
  alternative: 这家／这座圣殿
  rationale: 所指是刚献上的圣殿；中文“殿”能清楚表达所指，也没有额外加入具体宗派解释。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。句子承接下一节，故末尾保留逗号。用“任何一个人／各人”准确表达代表性单数和分配意义，避免在汉语中强加不必要的性别标记。所有脚注标记均置于对应词语之后。
