  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/שָׁמַעְתָּ֤ הַ/שָּׁמַ֨יִם֙ מְכ֣וֹן שִׁבְתְּ/ךָ֔ אֶת תְּפִלָּתָ֖/ם וְ/אֶת תְּחִנָּתָ֑/ם וְ/עָשִׂ֖יתָ מִשְׁפָּטָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/049.yaml
  text: then hear in heaven[a], the place of your dwelling, their prayer and their plea, and uphold their cause[b],
translation:
  language: zh_hans
  text: 求你在天上，就是你居住的定所[a]，垂听他们的祷告和恳求，为他们主持公道[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文没有明示“在”或“从”；也可译作“求你从天上，就是你居住的定所，垂听”。“定所”所译的希伯来词强调设立稳固、固定的所在。
    reason: 保留介词省略造成的句法歧义，并说明关键词的语义。
  - marker: b
    text: 或译“为他们伸张正义”或“为他们伸冤”。原文直译近于“施行他们的公断”，是指为他们的案件采取公正行动的惯用语。
    reason: 说明司法性希伯来惯用语及可成立的译法。
lexical_decisions:
- source_word: וְשָׁמַעְתָּ
  choice: 求你……垂听
  rationale: 该词形式为第二人称阳性单数完成式，但在这一连串向上帝发出的祈求中具有请求语气。“垂听”既符合现代汉语祷告语体，也表达不只是听见、而是应允关注的含义；“求你”明确呈现其祈求功能。
- source_word: הַשָּׁמַיִם
  choice: 在天上
  rationale: 原文直译为“诸天/天”，此处与后面的“你居住的定所”同位，指上帝的天上居所。希伯来文未明示介词，因此将可能的“从天上”保留在脚注中。
- source_word: מְכוֹן שִׁבְתְּךָ
  choice: 你居住的定所
  rationale: מָכוֹן 含有设立稳固、固定所在之意；“定所”简洁保留这一语义，又比生硬的“你居住之稳固处所”自然庄重。
- source_word: תְּפִלָּתָם וְאֶת תְּחִנָּתָם
  choice: 他们的祷告和恳求
  rationale: “祷告”表达一般性的向上帝祈求；“恳求”体现 תְּחִנָּה 请求恩惠、怜悯的迫切意味，并保留两个近义词之间的区别。
- source_word: וְעָשִׂיתָ מִשְׁפָּטָם
  choice: 为他们主持公道
  rationale: 原文直译近于“施行他们的审判/公断”，是司法性惯用语，指为他们的案件采取行动、使其获得公正处理。“为他们主持公道”在现代汉语中自然，并保留法律和伸冤的色彩。
theological_decisions:
- issue: 上帝在天上居住的空间性表达
  choice: 保留“在天上，就是你居住的定所”的圣经意象
  alternative: 抽象化为“从你的圣所垂听”
  rationale: 原文明确采用上帝在天上定居并垂听的圣殿祷告语言。译文不把这一意象抽象化，也不额外断言上帝受空间限制。
- issue: מִשְׁפָּטָם 所指的司法行动
  choice: 为他们主持公道
  alternative: 为他们伸冤／维护他们的诉求
  rationale: 原文可涵盖维护其案件、施行正义或为其伸冤，未明确断定他们必然无罪。“主持公道”保留这种范围，避免将经文过度限定为宣告无罪。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语体。“垂听”“定所”略带经文庄严感，但在上下文中清楚自然；“主持公道”避免逐字翻译造成的生硬，同时保留司法含义。所有脚注标记均已置于正文相应位置。
