  terminology: “垂听”“祷告”“恳求”符合汉语圣经及现代庄重语体。“定所”有效保留מָכוֹן的固定、设立之处的语义；“主持公道”保留מִשְׁפָּט的司法性而不作过度神学或教义化解释。脚注a准确说明原文没有明示介词及关键词含义；脚注b准确说明该司法惯用语及合理替代译法。
