  source_fidelity: 译文准确反映祈求语气，并保留原文“天/诸天”与“你居住的定所”相连的圣殿祷告意象。“祷告和恳求”恰当地体现两个近义而有细微差别的名词；“为他们主持公道”自然传达“施行他们的公断/司法”的惯用语义，未不当地预设他们无罪或限定为单纯伸冤。
