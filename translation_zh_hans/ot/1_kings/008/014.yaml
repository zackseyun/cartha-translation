  text: וַ/יַּסֵּ֤ב הַ/מֶּ֨לֶךְ֙ אֶת פָּנָ֔י/ו וַ/יְבָ֕רֶךְ אֵ֖ת כָּל קְהַ֣ל יִשְׂרָאֵ֑ל וְ/כָל קְהַ֥ל יִשְׂרָאֵ֖ל עֹמֵֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/014.yaml
  text: Then the king turned around and blessed all the assembly of Israel[b][a], while all the assembly of Israel was standing.
translation:
  language: zh_hans
  text: 随后，王转过脸来[a]，祝福以色列全体会众[b]；当时，以色列全体会众都站着。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“转过他的脸”；也可意译为“转过身来”。
    reason: lexical_alternative
  - marker: b
    text: “会众”也可译作“集会的民众”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּסֵּב אֶת־פָּנָיו
  choice: 转过身来
  rationale: 原文直译为“转过他的脸”。现代汉语用“转过身来”更自然，也清楚表达王改变朝向的动作；脚注保留原文身体部位表达。
- source_word: וַיְבָרֶךְ
  choice: 祝福
  rationale: ברך在此指王向聚集的百姓施行或宣告祝福；“祝福”简洁、庄重，不额外限定祝福的具体形式。
- source_word: כָּל־קְהַל יִשְׂרָאֵל
  choice: 以色列全体会众
  rationale: קהל指聚集成会的群体。“全体会众”既保留集会群体的含义，又是现代汉语读者容易理解的表达。
- source_word: וְכָל־קְהַל יִשְׂרָאֵל עֹמֵד
  choice: 当时，以色列全体会众都站着
  rationale: 原句以分词עֹמֵד描述会众当时持续的姿态。“当时……都站着”自然呈现这一背景状态，并以复数语义表达集合名词所指的众人。
theological_decisions: []
translation_notes:
  register: 采用自然、庄重的现代标准普通话。保留“以色列全体会众”在前后两句中的重复，以反映希伯来文的强调和叙事节奏；用分号区分王的动作与会众当时的姿态。
