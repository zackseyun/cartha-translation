source:
  edition: WLC
  text: וְ/שָׁ֨מַעְתָּ֜ אֶל תְּחִנַּ֤ת עַבְדְּ/ךָ֙ וְ/עַמְּ/ךָ֣ יִשְׂרָאֵ֔ל אֲשֶׁ֥ר יִֽתְפַּֽלְל֖וּ אֶל הַ/מָּק֣וֹם הַ/זֶּ֑ה וְ֠/אַתָּה תִּשְׁמַ֞ע אֶל מְק֤וֹם שִׁבְתְּ/ךָ֙ אֶל הַ/שָּׁמַ֔יִם וְ/שָׁמַעְתָּ֖ וְ/סָלָֽחְתָּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/030.yaml
  text: And hear the plea of your servant and of your people Israel when they pray toward this place[a]. And hear in heaven, the place of your dwelling[b]; hear and forgive.
translation:
  language: zh_hans
  text: 求你垂听你仆人和你民以色列向这地方所作的恳求[a]。求你在天上，就是你的居所，垂听[b]；求你垂听并赦免。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“向这地方祷告。”
    reason: 希伯来语介词可较直译为“向、到”；正文用“向这地方所作的恳求”既表达祷告朝向这地方，也保留其修饰“恳求”的句法关系。
  - marker: b
    text: 或译：“在天上、你的居所垂听。”
    reason: 原文中“你的居所”与“天上”可按不同中文语序连接；正文将“天上”作为“你的居所”的同位说明，以求清楚自然。
lexical_decisions:
- source_word: תְּחִנַּת
  choice: 恳求
  rationale: 该词指迫切寻求恩惠或怜悯的请求。“恳求”既自然，又保留了祈求的迫切意味。
- source_word: עַבְדְּךָ
  choice: 你仆人
  rationale: 在君王向上帝祷告的语境中，这是谦卑、顺服的自称；“仆人”符合现代中文的庄重语体。
- source_word: עַמְּךָ יִשְׂרָאֵל
  choice: 你民以色列
  rationale: 简洁保留原文的所属关系，表明以色列是上帝的子民。
- source_word: יִתְפַּלְלוּ
  choice: 祷告
  rationale: 该词的Hitpael词干在此是通常表示祷告的用语；“祷告”清楚自然。
- source_word: אֶל הַמָּקוֹם הַזֶּה
  choice: 向着这地方
  rationale: 介词 אֶל 可表示“向、到”；在圣殿祷告的语境中，“向着”最能表达祷告所朝的方向，同时以脚注保留“向这地方”的较直译表达。
- source_word: מְקוֹם שִׁבְתְּךָ
  choice: 你的居所
  rationale: 准确表达“你居住之处”的结构和含义，庄重而易懂。
- source_word: אֶל הַשָּׁמַיִם
  choice: 在天上
  rationale: 虽然介词字面常为“向、到”，但与“垂听”和“你的居所”连用时，语境指上帝在天上的居所；“在天上”符合现代中文表达。
- source_word: וְשָׁמַעְתָּ
  choice: 垂听
  rationale: 这里不只是听见声音，而是上帝留意并回应祷告；“垂听”保留祷告语体的庄重和恳切。
- source_word: וְסָלָחְתָּ
  choice: 赦免
  rationale: 该词是表示上帝赦罪的常用动词；“赦免”清楚、庄重，并保留其神学分量。
theological_decisions:
- issue: 圣殿导向的祷告与上帝在天上的居所
  choice: 同时译出百姓“向着这地方”祷告，以及上帝“在天上，就是你的居所”垂听。
  alternative: 可将前者意译为“在这圣殿里祷告”，或将后者译为“从天上垂听”。
  rationale: 原文把地上的圣殿作为祷告所朝向的地点，同时称天为上帝的居所。译文保留这两方面及其张力，不把上帝局限于圣殿，也不淡化圣殿在祷告中的作用。
translation_notes:
  register: 采用现代、庄重且适合公开诵读的祷告语体。“垂听”体现向上帝祈求的语境；保留原文末尾“垂听，赦免”的重复和节奏。
