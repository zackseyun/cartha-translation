base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/024.yaml
  text: who have kept for your servant David my father what you spoke to him[a]; you spoke with your mouth, and with your hand you have fulfilled it[b], as it is this day.
translation:
  language: zh_hans
  text: 你为你仆人大卫、我父亲[a]信守了你对他说的话；你亲口说了，又亲手成全了，正如今日所见[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你向你仆人大卫、我父亲信守了你所说的话。”
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“你用你的口说，又用你的手成全”。这是一个生动的表达，表示神所说的话，他也亲自成全了。
    reason: cultural_note
lexical_decisions:
- source_word: שָׁמַרְתָּ
  choice: 成就了
  rationale: 此处指神信守并落实先前对大卫所说的话。译作“成就”比直译“守住”更符合现代汉语，同时后半句用“实现”对应 מִלֵּאתָ，以保留两个动词的区别。
- source_word: לְעַבְדְּךָ דָּוִד אָבִי
  choice: 向我父亲、你仆人大卫
  rationale: לְ 可指“向”或“为”。这里与后面的 דִּבַּרְתָּ לוֹ（对他说）相连，译作“向……应许”自然；保留“你仆人”这一谦卑而具约关系意味的称号。
- source_word: אֵת אֲשֶׁר דִּבַּרְתָּ לוֹ
  choice: 所应许的
  rationale: 字面是“对他所说的”。上下文表明所说内容具有承诺性质，现代汉语用“所应许的”更清楚；脚注保留“对他说的”这一较直译的可能。
- source_word: וַתְּדַבֵּר בְּפִיךָ
  choice: 你亲口说出
  rationale: 保留“口”的具体意象及强调作用，又以“亲口”形成自然、庄重的现代汉语。
- source_word: וּבְיָדְךָ מִלֵּאתָ
  choice: 又亲手实现
  rationale: 保留“手”的拟人化意象，并与“亲口”构成鲜明平行；מִלֵּאתָ 在此表示把所说的话落实、完成。
- source_word: כַּיּוֹם הַזֶּה
  choice: 正如今日所见
  rationale: 该希伯来习语指当下可见的实现；此译传达其见证性，比生硬的“如同今日”更符合现代汉语。
theological_decisions:
- issue: 神的“口”与“手”这一拟人化表述
  choice: 在正文中保留为“亲口”与“亲手”
  alternative: 意译为“你既已应许，也已成就”
  rationale: 原文有意以口与手对应神的言说和行动。保留具体意象可维持诗性平行和神说必行的张力，不必把它理解为对神本体形态的界定。
- issue: דִּבַּרְתָּ 的言语行为性质
  choice: 正文译为“应许”，脚注注明字面可作“对他说”
  alternative: 正文译为“对他说的”
  rationale: 上下文确属神对大卫的承诺；“应许”使普通读者容易理解，但原词本身是“说”，故以脚注保存词义宽度，避免把词汇层面的含义绝对化。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“我父亲、你仆人大卫”兼顾希伯来语次序与中文辨识度；“亲口……亲手……”保存原文平行结构和具体意象。“正如今日所见”表达当下已有可见凭据。
