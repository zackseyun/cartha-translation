  text: וַ/יְהִ֕י בְּ/צֵ֥את הַ/כֹּהֲנִ֖ים מִן הַ/קֹּ֑דֶשׁ וְ/הֶ/עָנָ֥ן מָלֵ֖א אֶת בֵּ֥ית יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/010.yaml
  text: And when the priests came out from the holy place[a], the cloud filled the house of Yahweh.
translation:
  language: zh_hans
  text: 祭司从圣所[a]出来时，云彩充满了雅威的殿。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“圣处”或“圣殿内的圣区”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בְּצֵאת
  choice: ……出来的时候
  rationale: וַיְהִי推进叙事，ב加不定式结构标示时间。汉语用“……的时候”自然表达“当……时”，无需生硬译出“事情发生了”。
- source_word: הַכֹּהֲנִים
  choice: 祭司
  rationale: 定冠词加复数名词，指上下文中的祭司群体；现代汉语通常不另译定冠词。
- source_word: מִן הַקֹּדֶשׁ
  choice: 从圣所
  rationale: קֹדֶשׁ本义为神圣之处，此处指祭司安放约柜后出来的圣殿内部神圣空间。“圣所”简洁庄重，同时保留其范围可能不完全明确之处。
- source_word: וְהֶעָנָן
  choice: 云彩
  rationale: 译出带定冠词的“云”；“云彩”在现代汉语叙事中自然，也符合神显语境，但不额外解释其性质。
- source_word: מָלֵא
  choice: 充满了
  rationale: Qal完成式第三人称阳性单数，以“云彩”为主语、圣殿为宾语；“充满了”准确表达已经发生的叙事事件。
- source_word: בֵּית יְהוָה
  choice: 雅威的殿
  rationale: בַּיִת直译为“房屋”，在此明确指圣殿，译作“殿”自然且保留宗教建筑意象。יְהוָה按其专名译作“雅威”，不以称号代替。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名。采用现代汉语中较能反映通常学术重构读音的“雅威”，保留其专名性质；不把它静默处理为称号。
- issue: 云彩的神学身份
  choice: 仅译作“云彩”
  alternative: 荣耀的云彩；雅威临在的云彩
  rationale: 本节原文只说“云”充满殿，并未明说“荣耀”或作解释性同位语，因此不把上下文可能蕴含的神显意义加入正文。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。句式依照希伯来文的时间从句与主句关系，但省去不合汉语习惯的“事情发生了”。“圣所”保留原词所指神圣空间的适度含混；“殿”比“房屋”更符合此处圣殿语境。
