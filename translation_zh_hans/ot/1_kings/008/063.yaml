revisions:
- from: 所罗门献上平安祭[a]，就是他向雅威献的：牛二万二千头，羊十二万只。王和以色列众子民[b]就这样为雅威的殿举行奉献礼。
  to: 所罗门向雅威献上平安祭[a]；他所献的有牛二万二千头，羊十二万只。王和全体以色列人[b]为雅威的殿举行了奉献礼。
  rationale: 修订以“他所献的有”自然承接原文对献祭行动的重复及其后牲畜数目，并将不自然的“以色列众子民”改为“全体以色列人”。这保留了原文所指的共同体范围；脚注继续交代其字面形式。其余祭祀、神名和圣殿术语维持不变。
