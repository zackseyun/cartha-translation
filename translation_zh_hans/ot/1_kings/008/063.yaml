  text: וַ/יִּזְבַּ֣ח שְׁלֹמֹ֗ה אֵ֣ת זֶ֣בַח הַ/שְּׁלָמִים֮ אֲשֶׁ֣ר זָבַ֣ח לַ/יהוָה֒ בָּקָ֗ר עֶשְׂרִ֤ים וּ/שְׁנַ֨יִם֙ אֶ֔לֶף וְ/צֹ֕אן מֵאָ֥ה וְ/עֶשְׂרִ֖ים אָ֑לֶף וַֽ/יַּחְנְכוּ֙ אֶת בֵּ֣ית יְהוָ֔ה הַ/מֶּ֖לֶךְ וְ/כָל בְּנֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/063.yaml
  text: 'And Solomon sacrificed the sacrifice of peace offerings that he sacrificed to Yahweh: twenty-two thousand cattle and one hundred twenty thousand sheep[b][a]. So the king and all the sons of Israel dedicated the house of Yahweh.'
translation:
  language: zh_hans
  text: 所罗门向雅威献上平安祭[a]；他所献的有牛二万二千头，羊十二万只。王和全体以色列人[b]为雅威的殿举行了奉献礼。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “平安祭”也可译作“团契祭”或“福祉祭”。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“以色列的众子”，是对以色列人的惯常称呼。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזְבַּח / זֶבַח
  choice: 献上……祭
  rationale: זבח在祭祀语境中指宰献祭牲。中文以“献上……祭”自然表达祭祀行动，同时保留原文名词与动词相互呼应的意味。
- source_word: זֶבַח הַשְּׁלָמִים
  choice: 平安祭
  rationale: שְׁלָמִים是特定祭类，含平安、福祉及共享筵席等意涵。“平安祭”是简明而通行的译名，并用脚注保留“团契祭／福祉祭”等可能表达。
- source_word: לַיהוָה / בֵּית יְהוָה
  choice: 向雅威／雅威的殿
  rationale: 将四字神名יְהוָה音译为“雅威”，直接保留其专名性质。בֵּית在此明确指所建成的圣殿，译为“殿”比机械译作“房屋”更符合现代汉语。
- source_word: בָּקָר
  choice: 牛
  rationale: 该词集合性地指牛类牲畜；配合大数目，用量词“头”表达自然。
- source_word: צֹאן
  choice: 羊
  rationale: 该集合名词可涵盖绵羊和山羊；汉语“羊”本身可作上位统称，既自然也不必把所指限缩为绵羊。
- source_word: וַיַּחְנְכוּ
  choice: 举行奉献礼
  rationale: חנך在此指圣殿落成后正式奉献、启用。译为“举行奉献礼”能自然体现礼仪事件，又不额外引入“分别为圣”等较强解释。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列众子民
  rationale: 原文直译为“以色列的众子”，但此固定称谓在语境中泛指以色列全体。“众子民”兼顾形式上的“子”与现代汉语中群体称谓的可读性，脚注说明其惯用含义。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华／上主
  rationale: 原文使用四字神名而非称号；音译“雅威”保留圣约之神的专名性质，不以称号代替。
- issue: שְׁלָמִים所指祭类的内涵
  choice: 平安祭
  alternative: 团契祭／福祉祭
  rationale: 该词兼有完整、福祉以及献祭者共享祭肉等语义联想，单一中文词难以穷尽。“平安祭”作为正文译名较为通行，其他侧重点留在脚注中，避免将其神学含义限定为某一种解释。
- issue: בְּנֵי יִשְׂרָאֵל的群体范围
  choice: 以色列众子民
  alternative: 以色列的众子／全体以色列人
  rationale: 此处参与奉献圣殿的是以色列共同体；该希伯来惯用语虽为阳性复数形式，却作为民族称谓使用。正文兼顾原文形式与群体意义，脚注保留直译。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。保留原文献祭表述的重复意味，以“就是他向雅威献的”承接；数目按现代中文完整书写。正文中的脚注标记均紧随相关词语。
