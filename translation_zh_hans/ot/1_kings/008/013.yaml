  text: בָּנֹ֥ה בָנִ֛יתִי בֵּ֥ית זְבֻ֖ל לָ֑/ךְ מָכ֥וֹן לְ/שִׁבְתְּ/ךָ֖ עוֹלָמִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/013.yaml
  text: I have indeed built you an exalted house[b][a], a settled place for you to dwell forever.
translation:
  language: zh_hans
  text: 我确实为你建造了一座崇高的殿宇[a]，作为你永远居住的稳固之所[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “崇高的殿宇”也可译作“高大的居所”或“尊荣的居所”。希伯来语 זְבֻל 指崇高、尊贵的住所。
    reason: lexical_alternative
  - marker: b
    text: “稳固之所”也可译作“固定的地方”或“确立的居所”。
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּנֹה בָנִיתִי
  choice: 我确实……建造了
  rationale: 绝对不定式置于限定动词之前，用来加强语气；“确实”以自然的现代汉语表达这一强调。
- source_word: בֵּית
  choice: 殿宇
  rationale: 本义为“房屋、家”，此处所指是为上帝建造的圣殿。“殿宇”既符合具体语境，也保留了作为上帝居所的房屋意象，而不直接加入原文没有的解释。
- source_word: זְבֻל
  choice: 崇高的
  rationale: 该词可指高耸、尊贵的居所；译作“崇高的”保留其空间与尊荣两方面的含义，脚注列出可行替代译法。
- source_word: לָךְ
  choice: 为你
  rationale: 介词表示受益对象，保留所罗门直接对上帝说话的形式。
- source_word: מָכוֹן
  choice: 稳固之所
  rationale: 该名词表示已经确立、固定的地方；“稳固之所”自然地传达稳定和持久之意。
- source_word: לְשִׁבְתְּךָ
  choice: 作为你……居住的
  rationale: ישׁב可表示坐下、居住，也可能在圣殿语境中带有登基安坐的意味；正文采用最直接的“居住”，不排除其王权意蕴。
- source_word: עוֹלָמִים
  choice: 永远
  rationale: 复数形式加强时间延续的意味；“永远”是现代汉语中自然、庄重的表达。
theological_decisions:
- issue: 是否把圣殿表述为上帝永久居住之处，从而可能显得过度限定上帝的临在
  choice: 照原文保留“你永远居住”的说法，不另加限定
  alternative: 意译为“使你的名永远居住之处”或“永远敬拜你的地方”
  rationale: 本节明确说这是为上帝居住而建造的殿宇和稳固之所。译文应保留这种圣殿与盟约临在的语言，不把上下文或后来的神学解释添加进正文。
- issue: לְשִׁבְתְּךָ是否应明确译为上帝登基安坐
  choice: 正文译作“居住”
  alternative: 译作“安坐”或“登基居住”
  rationale: 词根既可表示坐下，也常表示居住；圣殿语境容许王权含义，但原文本身没有明确要求将其单义化为登基，因此正文保留较宽的“居住”。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。句式保留希伯来诗性平行关系：先说建造殿宇，再说明它是永久居住的稳固之所；避免使用过度古雅的“永世”“爰居”等词。
