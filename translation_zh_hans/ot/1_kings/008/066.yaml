  text: בַּ/יּ֤וֹם הַ/שְּׁמִינִי֙ שִׁלַּ֣ח אֶת הָ/עָ֔ם וַֽ/יְבָרֲכ֖וּ אֶת הַ/מֶּ֑לֶךְ וַ/יֵּלְכ֣וּ לְ/אָהֳלֵי/הֶ֗ם שְׂמֵחִים֙ וְ/ט֣וֹבֵי לֵ֔ב עַ֣ל כָּל הַ/טּוֹבָ֗ה אֲשֶׁ֨ר עָשָׂ֤ה יְהוָה֙ לְ/דָוִ֣ד עַבְדּ֔/וֹ וּ/לְ/יִשְׂרָאֵ֖ל עַמּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/066.yaml
  text: On the eighth day he sent the people away[a], and they blessed the king and went to their tents, rejoicing and glad of heart because of all the good that Yahweh had done for David his servant and for Israel his people.
translation:
  language: zh_hans
  text: 第八天，所罗门让百姓离去；他们祝福王，回到自己的帐棚[a]，欢欢喜喜，心里欢畅，因为雅威向他仆人大卫和他的子民以色列所施的一切恩惠。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“回到自己的家”；原文直译“回到自己的帐棚”。
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַשְּׁמִינִי
  choice: 第八天
  rationale: 原文只说明“第八天”，并未明说“节期的第八天”，因此不在正文中补出。
- source_word: שִׁלַּח אֶת הָעָם
  choice: 所罗门让百姓离去
  rationale: שׁלח 的加强词干在此表示准许或吩咐众人离去；中文用“让……离去”自然保留这一含义。主语按上下文明确为所罗门。
- source_word: וַיְבָרֲכוּ אֶת הַמֶּלֶךְ
  choice: 他们为王祝福
  rationale: ברך 的通常意义是“祝福”。语境中也可能包含辞别致意，但不宜用“告别”取代其明确的祝福含义。
- source_word: לְאָהֳלֵיהֶם
  choice: 回到自己的帐棚
  rationale: 保留 אהל 的具体意象；介词短语在移动语境中自然译作“回到”。“帐棚”也可作回家的惯用表达，故脚注说明。
- source_word: שְׂמֵחִים וְטוֹבֵי לֵב
  choice: 欢欢喜喜，心中快慰
  rationale: 前者表达外显的喜乐，后者是有关内心状态的希伯来语表达；译文既保留二者，也避免生硬直译“心好”。
- source_word: עַל כָּל הַטּוֹבָה
  choice: 因为……这一切福祉
  rationale: עַל 在此引出喜乐的缘由；טוֹבָה 可涵盖雅威所施的美善、恩惠及其结果，以“福祉”概括而不限定为某一件善事。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代普通话中通行且贴近 YHWH 的音译呈现神的专名，不用称号替代。
- source_word: לְדָוִד עַבְדּוֹ
  choice: 赐给他仆人大卫
  rationale: עבד 在大卫与雅威的王权—盟约关系中宜译“仆人”；所属关系按中文语序表达为“他仆人大卫”。
- source_word: וּלְיִשְׂרָאֵל עַמּוֹ
  choice: 和他子民以色列
  rationale: 保留“以色列”与“他子民”的同位关系，并与前面的受惠对象并列。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文使用四字神名，而非一般称号；“雅威”直接音译专名，避免以“上主”等称号代替。
- issue: 百姓对王所作 וַיְבָרֲכוּ 的含义
  choice: 为王祝福
  alternative: 向王告别；称颂王
  rationale: 词语的核心义是“祝福”。虽然离别语境可能带有辞行意味，正文仍保留祝福这一较明确且具神学意义的行动，不把它弱化为普通告别。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。分句保持叙事节奏；用“欢欢喜喜，心中快慰”呈现希伯来文两个并列的喜乐表达。
