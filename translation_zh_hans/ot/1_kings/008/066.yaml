revisions:
- from: 第八天，所罗门让百姓离去；他们为王祝福，就回到自己的帐棚[a]。他们欢欢喜喜，心中快慰，因为雅威赐给他仆人大卫和他子民以色列这一切福祉。
  to: 第八天，所罗门让百姓离去；他们祝福王，回到自己的帐棚[a]，欢欢喜喜，心里欢畅，因为雅威向他仆人大卫和他的子民以色列所施的一切恩惠。
  rationale: 修订仅改善中文自然度，并将“雅威……所施的一切恩惠”调整为更完整对应原文“所行的一切美善／恩惠”的表述。未补入本节未明说的节期信息，保留“帐棚”、神名“雅威”、以及百姓“祝福王”的措辞。
