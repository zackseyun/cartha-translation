  text: יְהִ֨י יְהוָ֤ה אֱלֹהֵ֨י/נוּ֙ עִמָּ֔/נוּ כַּ/אֲשֶׁ֥ר הָיָ֖ה עִם אֲבֹתֵ֑י/נוּ אַל יַעַזְבֵ֖/נוּ וְ/אַֽל יִטְּשֵֽׁ/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/057.yaml
  text: May Yahweh our God be with us[a], as he was with our fathers. May he not forsake us or abandon us.
translation:
  language: zh_hans
  text: 愿雅威——我们的上帝——与我们同在，像他与我们的列祖[a]同在一样。愿他不撇下我们，也不丢弃我们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“祖先”。希伯来文作“我们的父亲们”，这里指以色列的先祖。
    reason: 词义替代；说明原文阳性复数称谓在本语境中的历史群体所指。
lexical_decisions:
- source_word: יְהִי
  choice: 愿……与我们同在
  rationale: 这是动词 היה 的祈愿式，在此表达祷告和愿望；用“愿”自然传达其意愿语气。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文四字神名作音译，保留以色列上帝的专名，而不以称号替代。
- source_word: אֱלֹהֵינוּ
  choice: 我们的上帝
  rationale: 该词带第一人称复数后缀，直指“我们的上帝”。
- source_word: עִמָּנוּ
  choice: 与我们同在
  rationale: 介词 עם 在这里表示陪伴和临在；“与我们同在”兼顾准确性与现代汉语宗教语境中的自然表达。
- source_word: כַּאֲשֶׁר הָיָה עִם אֲבֹתֵינוּ
  choice: 像他与我们的列祖同在一样
  rationale: 保留今昔对比，指出雅威过去怎样与以色列先辈同在；“列祖”既反映 אבות 的父系表达，也符合庄重而易懂的经文语体。
- source_word: אַל יַעַזְבֵנוּ
  choice: 愿他不撇下我们
  rationale: 否定祈愿式表达恳求；“撇下”保留 עזב 所含离开、不再相伴的关系意味。
- source_word: וְאַל יִטְּשֵׁנוּ
  choice: 也不丢弃我们
  rationale: 第二个否定祈愿式与前句平行；“丢弃”体现 נטש 所含弃置、离弃之意，同时不把两个近义动词译成完全相同的词。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。音译“雅威”保留其专名性质，不把神名化为称号；“耶和华”是传统形式，“主”则是替代性称呼。
- issue: אֲבֹתֵינוּ 的所指与性别表达
  choice: 我们的列祖
  alternative: 我们的祖先；我们的父辈
  rationale: 原词为阳性复数，语境中指以色列历代先辈。“列祖”保留原文的父系措辞和救赎历史色彩；脚注注明较宽泛的自然汉语译法，以免把所指误限于亲生父亲。
- issue: עזב 与 נטש 的平行关系
  choice: 撇下……丢弃
  alternative: 离弃……抛弃；撇弃……离开
  rationale: 两词意义重叠但并非完全相同。译文用两个近义而有区别的动词，既保存加强语气的平行结构，也不人为赋予两词过度精细的神学差别。
translation_notes:
  register: 采用现代、庄重而清楚的祷告语体。“愿……愿……”保留原文两组祈愿语气；“同在、列祖、撇下、丢弃”均为普通读者可理解且适合经文语境的表达。
