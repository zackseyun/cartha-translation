  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל דָּוִ֣ד אָבִ֔/י יַ֗עַן אֲשֶׁ֤ר הָיָה֙ עִם לְבָ֣בְ/ךָ֔ לִ/בְנ֥וֹת בַּ֖יִת לִ/שְׁמִ֑/י הֱטִיבֹ֔תָ כִּ֥י הָיָ֖ה עִם לְבָבֶֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/018.yaml
  text: But Yahweh said to David my father[a], ‘Because it was in your heart to build a house for my name, you did well that it was in your heart.’
translation:
  language: zh_hans
  text: 但耶和华对我父亲大卫说：“你心里有意为我的名建造殿宇[a]；你有这样的心意，实在是好的。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “殿宇”原文直译为“房屋”；这里指为耶和华的名建造的圣殿。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: 叙事中引出直接引语的常用表达，现代汉语自然简明。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的神圣名字译法，而不以称号代替专名。
- source_word: דָּוִד אָבִי
  choice: 我父亲大卫
  rationale: 保留第一人称单数所属关系，并按自然汉语调整语序。
- source_word: יַעַן אֲשֶׁר
  choice: 既
  rationale: 引出已成立的原因或事实，与后面的评价相衔接，避免汉语重复使用“因为”。
- source_word: הָיָה עִם לְבָבְךָ
  choice: 有心／有这样的心意
  rationale: 该希伯来语习语表示内在意愿或打算；译文既传达意向，也以“心意”保留“心”的意象。
- source_word: לִבְנוֹת בַּיִת
  choice: 建造殿宇
  rationale: בַּיִת字面为“房屋”，在此明确指献给上帝的圣殿；“殿宇”在现代汉语中自然庄重，同时不额外引入特定建筑细节。
- source_word: לִשְׁמִי
  choice: 为我的名
  rationale: 保留原文有关上帝之“名”的圣约性表达，不改写为较解释性的“为我”。
- source_word: הֱטִיבֹתָ
  choice: 是好的
  rationale: 希伯来语使役形在此表达认可；结合后续 כִּי 从句，译为对其心意的正面评价，而非暗示建殿行动已经完成。
- source_word: כִּי הָיָה עִם לְבָבֶךָ
  choice: 你有这样的心意是好的
  rationale: 将 כִּי 理解为引出受认可的内容，清楚表达上帝所称许的是大卫的心意。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: “耶和华”是简体中文圣经传统中最广为人知的专名形式，能够明确保留神的名字，而不是用“主”这一称号替代。
- issue: בַּיִת 在本节应译作一般“房屋”还是圣殿
  choice: 殿宇
  alternative: 房屋
  rationale: 原词字面是“房屋”，但上下文所指是为上帝之名建造的圣殿。“殿宇”既传达具体所指，也保持庄重，不改变“为我的名”这一原文意象。
- issue: 上帝所称许的是行动还是意愿
  choice: 称许大卫建殿的心意
  alternative: 称许大卫已经采取的建造行动
  rationale: 重复的 הָיָה עִם לְבָבְךָ 强调大卫心中的意愿；后文也表明实际建造者不是大卫。因此译文避免让“你做得好”被误读为建殿工程已经实施。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。保留“为我的名”这一关键圣经意象；用“有心／心意”自然重现原文的重复，同时避免生硬直译为“在你心里”。
