  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: בְּ/הֵעָצֵ֥ר שָׁמַ֛יִם וְ/לֹא יִהְיֶ֥ה מָטָ֖ר כִּ֣י יֶחֶטְאוּ לָ֑/ךְ וְ/הִֽתְפַּֽלְל֞וּ אֶל הַ/מָּק֤וֹם הַ/זֶּה֙ וְ/הוֹד֣וּ אֶת שְׁמֶ֔/ךָ וּ/מֵ/חַטָּאתָ֥/ם יְשׁוּב֖וּ/ן כִּ֥י תַעֲנֵֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/035.yaml
  text: When the heavens are shut up and there is no rain because they have sinned against you[a], and they pray toward this place and give thanks to your name and turn from their sin because you afflict them[b],
translation:
  language: zh_hans
  text: “当天闭塞，不下雨时，因他们得罪了你，他们若向这地方祷告，称谢你的名[a]，并因你使他们受苦[b]而离开自己的罪，”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“赞美你的名”或“承认你的名”。希伯来语动词可表示感谢、颂赞，也可表示公开承认。
    reason: lexical_alternative
  - marker: b
    text: 或译“使他们降卑”；也有人将这里理解为“应允他们”。
    reason: alternative_reading
lexical_decisions:
- source_word: בְּהֵעָצֵר שָׁמַיִם
  choice: 天闭塞……的时候
  rationale: בְּ 加尼法勒不定式构成时间状语；“天闭塞”保留希伯来语以天被关闭来表达雨水止住的形象。
- source_word: וְלֹא יִהְיֶה מָטָר
  choice: 不下雨
  rationale: 用现代汉语自然表达“没有雨”的结果，并与前面的“天闭塞”紧密相连。
- source_word: כִּי יֶחֶטְאוּ לָךְ
  choice: 因为他们得罪了你
  rationale: כִּי 在此表原因；לָךְ 表明罪是针对上帝的，“得罪了你”准确而自然。
- source_word: וְהִתְפַּלְלוּ אֶל הַמָּקוֹם הַזֶּה
  choice: 向着这地方祷告
  rationale: אֶל 在这里表示朝向圣殿祷告，而不是把这地方当作祷告对象。
- source_word: וְהוֹדוּ אֶת שְׁמֶךָ
  choice: 称谢你的名
  rationale: ידה 的使役形可表示感谢、赞美或公开承认；正文采用“称谢”，兼具感谢与颂赞色彩，并以脚注保留其他可能。
- source_word: וּמֵחַטָּאתָם יְשׁוּבוּן
  choice: 回转，离开自己的罪
  rationale: שׁוב 与 מִן 连用表示从罪中转回；此译既保留“回转”的动作形象，也明确其离罪方向。
- source_word: כִּי תַעֲנֵם
  choice: 因你使他们受苦
  rationale: 按 ענה 的使役形理解为使受苦或使降卑，符合旱灾管教促使人离罪的上下文；另一种“应允他们”的理解收入脚注。
theological_decisions:
- issue: 朝向圣殿祷告的含义
  choice: 向着这地方祷告
  alternative: 向这地方祷告
  rationale: 译作“向着”明确表示祷告的方向，避免让人误以为祷告是向圣殿本身发出的。
- issue: תַעֲנֵם 的语义
  choice: 使他们受苦
  alternative: 应允他们
  rationale: 马所拉读法及旱灾、认罪和回转的语境支持“使受苦／降卑”；但该形式也可被联系到“回答、应允”，故不抹去这一歧义。
- issue: ידה 在悔罪语境中的含义
  choice: 称谢你的名
  alternative: 赞美你的名；承认你的名
  rationale: 该动词语义范围涵盖感谢、颂赞和公开承认；正文不把它缩窄为专门的认罪术语，脚注保留真实的词义张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“天闭塞”保留经文意象；“称谢”略带经文语体，但在现代宗教汉语中仍清楚自然。句末逗号保留本节与下一节祈求之间尚未完结的句法关系。
