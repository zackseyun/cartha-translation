  rationale: 修订仅调整神名译形以符合项目对 יהוה／Yahweh 的既定处理，并补足已在译法说明中提出的“话语／应许”脚注。句序略作整理，使“照着自己所说的一切”明确修饰赐下安息，同时维持原文的颂赞语气、完全应验的强调和摩西的媒介角色。
