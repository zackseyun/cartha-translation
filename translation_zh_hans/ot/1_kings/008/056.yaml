id: 1KI.8.56
reference: 1 Kings 8:56
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: בָּר֣וּךְ יְהוָ֗ה אֲשֶׁ֨ר נָתַ֤ן מְנוּחָה֙ לְ/עַמּ֣/וֹ יִשְׂרָאֵ֔ל כְּ/כֹ֖ל אֲשֶׁ֣ר דִּבֵּ֑ר לֹֽא נָפַ֞ל דָּבָ֣ר אֶחָ֗ד מִ/כֹּל֙ דְּבָר֣/וֹ הַ/טּ֔וֹב אֲשֶׁ֣ר דִּבֶּ֔ר בְּ/יַ֖ד מֹשֶׁ֥ה עַבְדּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/056.yaml
  text: Blessed be Yahweh[a], who has given rest to his people Israel, according to all that he spoke. Not one word has failed of all his good words that he spoke by the hand of Moses his servant.
translation:
  language: zh_hans
  text: 雅威[a]是应当受颂赞的！他已照着自己所说的一切，赐安息给自己的子民以色列。借着他仆人摩西所说的一切美善之言[b]，没有一句落空。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “雅威”是希伯来文神名 יהוה 的音译。
    reason: 说明正文对四字神名的译形。
  - marker: b
    text: “美善之言”在这里指雅威所说、并已成就的话；也可理解为“美好的应许”。
    reason: 保留原文“话语”的用词，同时说明上下文中的应许含义。
lexical_decisions:
- source_word: בָּרוּךְ
  choice: 是当受颂赞的
  rationale: 这是颂赞性的感叹句。此译法在现代汉语中庄重自然，也比单纯的“有福”更准确地表达此处向上帝发出的称颂。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的神圣名字译形“耶和华”，而不以“主”这一称号替代专名。
- source_word: נָתַן מְנוּחָה
  choice: 使……得享安息
  rationale: 这里指上帝使以色列摆脱仇敌和动荡，得到安定，而不只是内心平静；“得享安息”兼顾原文和自然汉语。
- source_word: לְעַמּוֹ יִשְׂרָאֵל
  choice: 他的子民以色列
  rationale: 保留“子民”这一圣约关系用语，并自然呈现“以色列”与“他的子民”的同位关系。
- source_word: כְּכֹל אֲשֶׁר דִּבֵּר
  choice: 照着自己所说的一切
  rationale: 原文使用“说”而非明确表示“应许”的动词，因此正文保留言说措辞，不把语义提前收窄为“应许”。
- source_word: לֹא נָפַל דָּבָר אֶחָד
  choice: 没有一句落空
  rationale: “落空”自然传达希伯来习语中话语未失败、未不成就的含义，同时保留“一句”与言说语境的联系。
- source_word: מִכֹּל דְּבָרוֹ הַטּוֹב
  choice: 一切美善之言
  rationale: דְּבָרוֹ虽为单数形式，却在此具有集合意义；“一切美善之言”既符合上下文，也保持庄重而可懂的文体。
- source_word: בְּיַד מֹשֶׁה
  choice: 借着……摩西
  rationale: 这是表示媒介或代理的希伯来习语。直译“借摩西的手”在现代汉语中略显生硬，“借着摩西”准确表达摩西作为传达者的角色。
- source_word: עַבְדּוֹ
  choice: 自己仆人
  rationale: 此处是对摩西作为耶和华受命代表的尊称；“仆人”比“奴隶”更符合语境。
theological_decisions:
- issue: 如何翻译神名 יְהוָה
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。正文保留专名而不改用“主”；“耶和华”是现代中文读者最熟悉且已约定俗成的译形。
- issue: דָּבָר / דְּבָרוֹ 应译为“话/言”还是“应许”
  choice: 美善之言；一句
  alternative: 美好的应许；一个应许
  rationale: 上下文确有应许得到成就的含义，但原文反复使用范围更广的“话/言”。正文保留这一措辞，以免消除原文语义幅度，并在脚注说明应许意味。
translation_notes:
  register: 采用庄重、清晰的现代标准汉语。“是当受颂赞的”保留颂赞语气；“得享安息”体现国家和群体得到安定的语境；“借着自己仆人摩西”避免机械复制希伯来语“借……的手”的结构。正文中的脚注标记与脚注一一对应。
