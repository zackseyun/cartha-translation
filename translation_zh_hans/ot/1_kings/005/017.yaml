  text: אַתָּ֨ה יָדַ֜עְתָּ אֶת דָּוִ֣ד אָבִ֗/י כִּ֣י לֹ֤א יָכֹל֙ לִ/בְנ֣וֹת בַּ֗יִת לְ/שֵׁם֙ יְהוָ֣ה אֱלֹהָ֔י/ו מִ/פְּנֵ֥י הַ/מִּלְחָמָ֖ה אֲשֶׁ֣ר סְבָבֻ֑/הוּ עַ֤ד תֵּת יְהוָה֙ אֹתָ֔/ם תַּ֖חַת כַּפּ֥וֹת רגל/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/017.yaml
  text: You know that David my father could not build a house for the name of Yahweh his God because of the warfare that surrounded him[a], until Yahweh put them under the soles of his feet.
translation:
  language: zh_hans
  text: 你知道，我父亲大卫因环绕他的战事，不能为耶和华他上帝的名建造殿宇，直到耶和华把他们置于大卫脚掌之下[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可简译作“大卫脚下”。希伯来文更完整地说“大卫脚掌之下”，以此描绘敌人被征服、降服。
    reason: 说明希伯来文“脚掌”这一较完整的措辞及其征服意象；在中文中明示“大卫”以避免代词被误解为指耶和华。
lexical_decisions:
- source_word: אַתָּה יָדַעְתָּ
  choice: 你知道
  rationale: 完成式在直接陈述中具有当前认知的语用功能；明说的第二人称代词保留了希伯来文的强调。
- source_word: בַּיִת
  choice: 殿宇
  rationale: 原义为“房屋”，上下文明确指将为耶和华之名建造的圣殿；“殿宇”既自然地传达所指，又保留“建造”实体建筑的表达。
- source_word: לְשֵׁם יְהוָה אֱלֹהָיו
  choice: 为耶和华他上帝的名
  rationale: 保留“为……的名”这一立约性表达，不将其解释性地化约为“为荣耀……”。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文读者熟悉的专名形式呈现四字神名，而不以“主”这一称号代替。
- source_word: מִפְּנֵי הַמִּלְחָמָה אֲשֶׁר סְבָבֻהוּ
  choice: 因四面环绕他的战事
  rationale: “战事”表达持续冲突的集合意义；“四面环绕”保留סבב的包围意象，并与复数动词所暗示的多方敌对行动相协调。
- source_word: עַד תֵּת יְהוָה אֹתָם
  choice: 直到耶和华把他们置于
  rationale: “置于……之下”传达נתן在降服惯用语中的意义；保留“他们”而不擅自明确为某一组敌人。
- source_word: תַּחַת כַּפּוֹת רַגְלוֹ
  choice: 他脚掌之下
  rationale: כַּפּוֹת明确指脚掌；保留希伯来文以践踏表现征服、降服的完整形象。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 两者均用于音译四字神名；正文采用现代中文圣经传统中辨识度较高的“耶和华”，同时将其作为专名而非“主”的称号处理。
- issue: “他们”的所指
  choice: 保留代词“他们”
  alternative: 译为“仇敌”
  rationale: 希伯来文使用复数代词אֹתָם，却未在本句中明说复数先行词；语境显然涉及敌对者，但正文不补入原文未明说的名词，以保存语法上的含混。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“殿宇”比直译“房屋”更能让普通读者识别圣殿所指，同时避免过于口语；句法尽量保留原文从大卫受战事阻碍到耶和华使敌对者降服的时间推进。
