- from: 你知道，我父亲大卫因四面环绕他的战事，不能为耶和华他上帝的名建造殿宇，直到耶和华把他们置于他脚掌之下[a]。
  to: 你知道，我父亲大卫因环绕他的战事，不能为耶和华他上帝的名建造殿宇，直到耶和华把他们置于大卫脚掌之下[a]。
  rationale: 删除原文未明说的“四面”，并将末尾脚的所属者明示为大卫，以保持希伯来文在上下文中的指向并避免现代汉语的就近指代歧义。保留“殿宇”“为耶和华他上帝的名”“战事”“他们”及“脚掌之下”，从而维持原文的圣殿所指、名的习语、持续冲突和未明示敌对者的表达。
