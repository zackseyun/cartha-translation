  text: וְ/עַתָּ֕ה הֵנִ֨יחַ יְהוָ֧ה אֱלֹהַ֛/י לִ֖/י מִ/סָּבִ֑יב אֵ֣ין שָׂטָ֔ן וְ/אֵ֖ין פֶּ֥גַע רָֽע׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/018.yaml
  text: But now Yahweh my God has given me rest on every side[b][a]; there is neither adversary nor evil occurrence.
translation:
  language: zh_hans
  text: 但现在，雅威——我的上帝——使我四境得享安宁；既没有敌手[a]，也没有祸患[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “敌手”也可译作“对头”或“敌对者”。这里的希伯来语 שָׂטָן 是普通名词，不一定指专名“撒但”。
    reason: lexical_alternative
  - marker: b
    text: “祸患”也可译作“不幸的事”、“灾祸”或“灾难”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: 但现在
  rationale: 承接上文曾有争战的处境，并转入如今的安宁局面；“但现在”自然体现语境中的转折。
- source_word: הֵנִיחַ ... לִי
  choice: 使我……安宁
  rationale: נוח的使役式表达“使得安歇、赐予安宁”；结合君王不再受四周威胁的语境，“使我……安宁”既保留使役意义，也符合现代汉语。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以常见的现代汉语音译呈现四字神名，保留原文对上帝立约之名的直接使用。
- source_word: אֱלֹהַי
  choice: 我的上帝
  rationale: 直接表达第一人称所属关系，保留所罗门对雅威的个人认信。
- source_word: מִסָּבִיב
  choice: 四境
  rationale: 指四周各方；与“安宁”搭配，简洁表达周边威胁止息的政治与军事处境。
- source_word: אֵין ... וְאֵין
  choice: 既没有……也没有……
  rationale: 自然呈现原文两个并列否定分句。
- source_word: שָׂטָן
  choice: 敌手
  rationale: 此处是指敌对者或对手的普通名词；“敌手”适合政治军事语境，也避免误读为专名“撒但”。
- source_word: פֶּגַע רָע
  choice: 祸患
  rationale: 该词组指有害的遭遇、灾难或不幸事件；“祸患”保留其宽泛性，不把它限定为道德邪恶或某一种具体灾害。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；采用“雅威”以音译形式呈现，不以称号代替。
- issue: שָׂטָן在本节是普通名词还是专名
  choice: 译作普通名词“敌手”
  alternative: 专名“撒但”
  rationale: 上下文谈论所罗门四境安宁、没有政治或军事敌对者；原文在此不要求理解为超自然位格的专名，因此不作这一神学限定。
- issue: פֶּגַע רָע所指祸患的范围
  choice: 保留为宽泛的“祸患”
  alternative: 具体化为“灾难”或“恶事”
  rationale: 原词组可涵盖不幸、灾祸或有害事件；宽泛译法保留其语义张力，避免限定祸患的性质或来源。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“四境安宁”凝练呈现君王在周边各方不受威胁的处境；句式清楚，适合普通读者朗读和理解。
