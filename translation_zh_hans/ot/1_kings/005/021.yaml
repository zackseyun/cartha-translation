base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/021.yaml
  text: And when Hiram heard the words of Solomon, he rejoiced greatly and said, “Blessed be the LORD today, who has given David a wise son over this great people.”
translation:
  language: zh_hans
  text: 希兰听见所罗门的话，就非常欢喜，说：“愿耶和华今日受称颂！他赐给大卫一个有智慧的儿子，来治理这众多的百姓。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דִּבְרֵי שְׁלֹמֹה
  choice: 所罗门的话
  rationale: 按希伯来文直译，既可指所罗门所说的话，也可涵盖他传达的信息，不额外限定为请求或口信。
- source_word: וַיִּשְׂמַח מְאֹד
  choice: 就非常欢喜
  rationale: 准确表达动词“欢喜”及副词“极其、非常”的加强语气，并符合现代汉语叙事习惯。
- source_word: בָּרוּךְ יְהוָה הַיּוֹם
  choice: 今日当称颂耶和华
  rationale: 保留神圣名“耶和华”和“今日”的时间强调；“当称颂”自然表达希伯来语祝颂句式。
- source_word: בֵּן חָכָם
  choice: 一个有智慧的儿子
  rationale: 忠实保留“儿子”和“有智慧”两项信息，不扩展为其他身份称谓。
- source_word: עַל הָעָם הָרָב הַזֶּה
  choice: 治理这众多的百姓
  rationale: 介词 עַל 在此表达居于百姓之上掌权；译作“治理”可在自然汉语中清楚传达其统治职分，而不额外加入原文未明说的“作王”。
theological_decisions:
- issue: 希兰对耶和华的祝颂是否意味着个人信仰归属
  choice: 仅按原文译出他称颂耶和华的话
  alternative: 加入“以色列的神”等解释性限定，或将其表达处理为明确的归信宣告
  rationale: 原文记载希兰称颂耶和华，却未在本节界定其个人信仰状态；译文保留这一神学张力，不作推断。
- issue: “赐给大卫”与所罗门治理百姓的关系
  choice: 保留“赐给大卫一个有智慧的儿子，治理……”的结构
  alternative: 改写为“赐给大卫一位有智慧的继承人作王”
  rationale: 原文强调儿子是赐给大卫的，并以介词短语表明他在百姓之上；不把隐含的王位继承关系扩写进正文。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“希兰”“所罗门”“大卫”“耶和华”沿用通行圣经专名；“这众多的百姓”保留原文对百姓规模的强调。
