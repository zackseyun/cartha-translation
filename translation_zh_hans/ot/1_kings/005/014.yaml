base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/014.yaml
  text: And people from all the peoples came to hear the wisdom of Solomon[b][a], from all the kings of the earth who had heard of his wisdom.
translation:
  language: zh_hans
  text: 各族的人[a]都来聆听所罗门的智慧；他们来自天下所有听说过他智慧的君王那里[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “各族”也可译作“各国”。希伯来语עַמִּים是复数，可指不同的族群或邦国。
    reason: lexical_alternative
  - marker: b
    text: 希伯来语直译为“从天下所有听说过他智慧的君王那里”。句式较为紧缩，可能指这些来访者来自各王那里，或是由各王派来的。
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: 都来
  rationale: 该叙事性动词承接上文，表示实际发生的行动；“来”直接自然，“都”与后面的“各族”相呼应。
- source_word: מִכָּל הָעַמִּים
  choice: 各族的人
  rationale: עַמִּים为复数，可指不同的族群或邦国；“各族的人”既保留群体复数含义，也符合现代汉语表达。
- source_word: לִשְׁמֹעַ
  choice: 来聆听
  rationale: 不定式表示来访的目的。“聆听”较庄重，并尽量保留原文“听”的直接表述，而不增补“请教”或“听他讲”等原文未明说的内容。
- source_word: חָכְמַת שְׁלֹמֹה
  choice: 所罗门的智慧
  rationale: 直接呈现希伯来语属格结构，不把“智慧”具体化为言论、教导或判案，以免缩窄原意。
- source_word: מֵאֵת כָּל מַלְכֵי הָאָרֶץ
  choice: 他们来自天下所有……的君王那里
  rationale: מֵאֵת表示来源，但原句关系紧缩；正文保留“来自君王那里”的基本结构，不擅自断定来访者必为君王亲自差派。
- source_word: אֲשֶׁר שָׁמְעוּ אֶת חָכְמָתוֹ
  choice: 听说过他智慧的
  rationale: 这里是君王得知所罗门智慧的名声；现代汉语用“听说过”比字面“听见他的智慧”更自然，同时保留其声名传开的含义。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重且易懂的书面汉语。“聆听所罗门的智慧”略带原文色彩，刻意不补成“听所罗门讲论智慧”，以保留原文在所罗门的智慧、言论或智慧表现之间的概括性。
