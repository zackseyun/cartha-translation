base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/001.yaml
  text: And Solomon was ruling over all the kingdoms from the River to the land of the Philistines and as far as the border of Egypt[b][a]. They were bringing tribute and serving Solomon all the days of his life.
translation:
  language: zh_hans
  text: 所罗门统管从大河[a]到非利士人之地，直至埃及边界的所有王国。他们进贡[b]，服事所罗门，在所罗门有生之年一直如此。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “大河”指幼发拉底河。
    reason: cross_reference
  - marker: b
    text: 或译“献礼物”。希伯来语 מִנְחָה 可指礼物、供物或贡物；这里的政治语境较支持“进贡”。
    reason: lexical_alternative
lexical_decisions:
- source_word: מוֹשֵׁל
  choice: 统管
  rationale: 该分词与הָיָה连用，表示过去持续的统治状态。“统管”既体现对多个王国的权柄，也符合现代汉语表达。
- source_word: בְּכָל הַמַּמְלָכוֹת
  choice: 所有王国
  rationale: 介词בְּ与משׁל连用表示管辖对象；复数形式表明所罗门统辖多个附属王国。
- source_word: מִן הַנָּהָר
  choice: 从大河[a]
  rationale: “大河”在这一地缘语境中是幼发拉底河的惯称；正文保留原文称谓，脚注说明具体所指。
- source_word: אֶרֶץ פְּלִשְׁתִּים
  choice: 非利士人之地
  rationale: 直接反映原文的属格结构，同时采用现代读者易懂且庄重的表达。
- source_word: וְעַד גְּבוּל מִצְרָיִם
  choice: 并远至埃及边界
  rationale: 表达原文所描述的疆域范围终点，并与前面的“从……直到……”自然衔接。
- source_word: מַגִּשִׁים מִנְחָה
  choice: 进贡[b]
  rationale: מִנְחָה可指礼物、供物或贡物；在附属王国臣服的政治语境中，“进贡”最为贴切，同时以脚注保留词义的宽度。
- source_word: וְעֹבְדִים אֶת שְׁלֹמֹה
  choice: 服事所罗门
  rationale: עבד以人为宾语时可表示为上位者效力；“服事”保留臣属意味，而不擅自限定为劳役。
- source_word: כָּל יְמֵי חַיָּיו
  choice: 终其一生
  rationale: 这是希伯来语表示“一生之久”的惯用语；“终其一生”简洁、庄重，也准确表达持续时间。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而通顺的简体中文。“统管”体现持续的王权；疆域表述保留“从……直到……并远至……”的范围结构。第二句以“他们”保留原文复数主语未明确指出具体群体的特点，避免擅自补作“各国君王”或“各国人民”。
