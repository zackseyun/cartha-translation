- from: 所罗门统管从大河[a]直到非利士人之地，并远至埃及边界的所有王国。他们进贡[b]，服事所罗门，终其一生。
  to: 所罗门统管从大河[a]到非利士人之地，直至埃及边界的所有王国。他们进贡[b]，服事所罗门，在所罗门有生之年一直如此。
  rationale: 修订首句的范围连接，使其对应原文“从……到……，直到……”的地理界定，并将末句持续时间明确归于所罗门的一生。其余关键术语和脚注判断均予保留。
