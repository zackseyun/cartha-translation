base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/031.yaml
  text: Then the king commanded[a], and they quarried great stones, costly stones, cut stones[b], to lay the foundation of the house.
translation:
  language: zh_hans
  text: 王下令，他们就开采出又大又贵重的石头，都是凿好的石料[a]，用来为殿[b]奠基。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“凿成的石头”或“修整过的石头”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译为“房屋”；这里指圣殿。
    reason: cross_reference
lexical_decisions:
- source_word: וַיְצַו הַמֶּלֶךְ
  choice: 王下令
  rationale: 直接表达叙事中的命令动作；上下文已明确这位王是所罗门，无须在本节增补名字。
- source_word: וַיַּסִּעוּ
  choice: 他们就开采出
  rationale: 该使役形式本可表示移走、拔出；在预备建筑石料的语境中，指从石场取出石头，以“开采出”最自然，同时保留“取出”的动作意味。
- source_word: אֲבָנִים גְּדֹלוֹת
  choice: 又大的石头
  rationale: 忠实保留石头体积大的描述，并与下一形容语并列。
- source_word: אֲבָנִים יְקָרוֹת
  choice: 又贵重的石头
  rationale: יָקָר 可指贵重、昂贵或珍贵；“贵重”保留其价值含义，又不把建筑石料误解成宝石。
- source_word: לְיַסֵּד
  choice: 奠基
  rationale: 在建筑语境中表示安置或建造根基；现代汉语“奠基”简洁庄重。
- source_word: הַבַּיִת
  choice: 殿
  rationale: 字面为“这房屋”，上下文特指耶和华的殿；正文采用自然且明确的“殿”，脚注保留希伯来文的字面表达。
- source_word: אַבְנֵי גָזִית
  choice: 凿整齐的石料
  rationale: גָּזִית 指经过凿削、修整的建筑石材。此短语与前面的石头同位，说明其加工状态，而不是另加一种材料。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“都是”显明末尾“凿石”与前述石头的同位关系，避免误读为另一批材料；“殿”按上下文明确所指，并以脚注保留原文“房屋”的措辞。
