  yaml_path: translation/ot/1_kings/005/030.yaml
  text: besides Solomon’s chief deputies who were over the work[a], three thousand three hundred[c][b], who ruled over the people doing the work.
translation:
  language: zh_hans
  text: 此外，所罗门主管工程的督工官长[a]有三千三百人；他们管辖[b]做工的百姓[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “督工官长”也可译作“主管官”或“首领督工”。这里的希伯来行政称谓兼有官阶和监督职能的含义。
    reason: lexical_alternative
  - marker: b
    text: “管辖”所译的动词可表示掌权或支配；在这里指对做工者行使管理权。
    reason: lexical_alternative
  - marker: c
    text: 原文作“百姓”或“民”；这里指参与工程的劳役人员。
    reason: lexical_alternative
lexical_decisions:
- source_word: לְבַד
  choice: 此外，还有
  rationale: 本词表示在前述数目之外另加一项；结合本节句法，用“此外，还有”自然地承接上文。
- source_word: שָּׂרֵי הַנִּצָּבִים לִשְׁלֹמֹה
  choice: 所罗门派来的官长
  rationale: שׂר表示有地位的官员，הַנִּצָּבִים指被委派或设置任职的人；合起来译作“派来的官长”，兼顾任命关系与行政级别，避免与后文“管辖”重复。
- source_word: אֲשֶׁר עַל הַמְּלָאכָה
  choice: 主管工程的
  rationale: עַל在此表达对事务负有管理权；מְלָאכָה在建造语境中不只是一般劳动，也指整体工程。
- source_word: שְׁלֹשֶׁת אֲלָפִים וּשְׁלֹשׁ מֵאוֹת
  choice: 三千三百人
  rationale: 按希伯来文本保留人数，并补出汉语计人数所需的量词“人”。
- source_word: הָרֹדִים
  choice: 管辖
  rationale: רדה可指统治、支配或行使权柄；“管辖”保留其较强的权威意味，同时符合工程劳役的行政语境。
- source_word: בָּעָם
  choice: 民众
  rationale: 原文直称“民/百姓”，未直接使用“工人”一词；“民众”保留原词范围，具体所指由后面的“做工的”限定。
- source_word: הָעֹשִׂים בַּמְּלָאכָה
  choice: 做工的
  rationale: 按分词结构直译，说明这些民众正从事该工程；汉语表达简洁自然。
theological_decisions: []
