  text: He spoke three thousand proverbs[a], and his songs were one thousand and five.
translation:
  language: zh_hans
  text: 他说了三千句箴言[a]；他的诗歌有一千零五首。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“格言”或“比喻”；希伯来语 מָשָׁל 的含义比中文“箴言”更广。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: 讲了
  rationale: דבר 的皮勒式在此直接表示“说、讲述”。“讲了”符合现代汉语表达，也不把经文没有明说的“创作、写作”含义加入正文。
- source_word: שְׁלֹשֶׁת אֲלָפִים
  choice: 三千句
  rationale: 数词意为“三千”；中文以量词“句”搭配“箴言”，表达自然，并体现后接名词在数量结构中的可数用法。
- source_word: מָשָׁל
  choice: 箴言
  rationale: מָשָׁל 可指箴言、格言、比喻或寓言；所罗门智慧传统的语境下，“箴言”最为贴切，但以脚注保留其较宽的词义范围。
- source_word: וַיְהִי
  choice: 有
  rationale: 在数量陈述中，היה 表示存在或总数；译作“有”比直译“是”更符合现代汉语。
- source_word: שִׁירוֹ
  choice: 他的诗歌
  rationale: שִׁיר 带第三人称单数属格后缀，字面为“他的歌”；在数字之后具有集合性，中文用“诗歌……首”自然表达复数数量。
- source_word: חֲמִשָּׁה וָאָלֶף
  choice: 一千零五首
  rationale: 希伯来语字面次序为“五和一千”；按现代汉语数字顺序译为“一千零五”，并加歌曲量词“首”，准确保留总数。
