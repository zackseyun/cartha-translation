source:
  edition: WLC
  text: עֲ֠בָדַ/י יֹרִ֨דוּ מִן הַ/לְּבָנ֜וֹן יָ֗מָּ/ה וַ֠/אֲנִי אֲשִׂימֵ֨/ם דֹּבְר֤וֹת בַּ/יָּם֙ עַֽד הַ/מָּק֞וֹם אֲשֶׁר תִּשְׁלַ֥ח אֵלַ֛/י וְ/נִפַּצְתִּ֥י/ם שָׁ֖ם וְ/אַתָּ֣ה תִשָּׂ֑א וְ/אַתָּה֙ תַּעֲשֶׂ֣ה אֶת חֶפְצִ֔/י לָ/תֵ֖ת לֶ֥חֶם בֵּיתִֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/023.yaml
  text: My servants will bring them down from Lebanon to the sea[a], and I will make them into rafts on the sea to the place that you direct me, and I will break them apart there, and you will carry them away[b]. And you shall do what I desire by giving food for my household.
translation:
  language: zh_hans
  text: 我的仆人会把木料从黎巴嫩运下海。我会把木料扎成木排[a]，从海上运到你通知我的地方；我会在那里把木排拆开，你就把木料运走。你也要照我的心愿，为我的家供应食物[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “木排”指把木料捆扎在一起，使其可以在水上漂运；也可译作“木筏”。
    reason: lexical_alternative
  - marker: b
    text: 直译“给我的家饼”；这里的“饼”泛指食物或给养，“我的家”指希兰的王室家户。
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲבָדַי
  choice: 我的仆人
  rationale: 在王室行政和劳务语境中，指希兰手下办事的人；“仆人”既保留从属关系，也不武断认定其为奴隶。
- source_word: יֹרִדוּ
  choice: 会把……运下
  rationale: 该词为使役形，表示使木料从黎巴嫩山地下来；“运下”兼顾地势和运输语境。
- source_word: יָמָּה
  choice: 下海
  rationale: 该形式可表示“向海边、向西”，这里结合海运语境，译为“下海”自然地表达从山区运到海上的意思。
- source_word: אֲשִׂימֵם דֹּבְרוֹת
  choice: 把木料扎成木排
  rationale: 动词与表语名词连用，表示把木料制成可漂运的排；“扎成”明确呈现木料被连结成排。
- source_word: בַּיָּם
  choice: 从海上运
  rationale: 原文直译为“在海上”；结合木排的运输方向，译作“从海上运”符合现代汉语，同时保留海运方式。
- source_word: עַד הַמָּקוֹם אֲשֶׁר תִּשְׁלַח אֵלַי
  choice: 运到你通知我的地方
  rationale: שׁלח 的基本义为“差遣、发送”；此处显然涉及所罗门把目的地告知希兰。“通知我”表达实际含义，又不过度具体化通知方式。
- source_word: וְנִפַּצְתִּים
  choice: 把木排拆开
  rationale: נפץ 可指打碎、打散；在木排运输语境中，是到岸后把捆扎的木排拆散。
- source_word: תִשָּׂא
  choice: 把木料运走
  rationale: נשא 可指举起、携带或运走；木排拆开后由所罗门一方接运，故译为“运走”。
- source_word: חֶפְצִי
  choice: 照我的心愿
  rationale: 该词指意愿、喜悦或所求；“照我的心愿”保留希兰提出对等要求的个人意愿色彩。
- source_word: לָתֵת לֶחֶם בֵּיתִי
  choice: 为我的家供应食物
  rationale: “饼”在此以部分代整体，泛指食物或给养；“我的家”保留王室家户的表达，不把范围缩窄为家眷。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而清楚的叙事语言。为使代词所指明确，将原文的“它们”按上文语境译为“木料”；保留“我的家”的王室家户意象，并在脚注说明“饼”的转喻用法。
