base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/013.yaml
  text: He spoke about the trees[a], from the cedar that is in Lebanon to the hyssop that grows out of the wall; he also spoke about the animals and the birds and the creeping things and the fish.
translation:
  language: zh_hans
  text: 他讲论树木，从黎巴嫩的香柏树，到从墙上长出来的牛膝草[a]；他也讲论走兽、飞鸟、爬行的生物和鱼类。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “牛膝草”是传统译法；希伯来语 אֵזוֹב 所指的确切植物尚不能确定，也可能是一种小型芳香植物。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר עַל
  choice: 讲论
  rationale: 该结构表示谈论、论及某一主题；“讲论”简洁庄重，又不把含义强化为技术性的教导或科学描述。
- source_word: הָעֵצִים
  choice: 树木
  rationale: 此处指树木或木本植物；上下文以香柏树和牛膝草构成大小两端，“树木”最自然。
- source_word: הָאֶרֶז אֲשֶׁר בַּלְּבָנוֹן
  choice: 黎巴嫩的香柏树
  rationale: “香柏树”是 אֶרֶז 的通行译名；将关系从句自然压缩为现代汉语定语，同时保留地理指向。
- source_word: מִן ... וְעַד
  choice: 从……到……
  rationale: 准确表达希伯来语的范围结构，并保留从高大树木到微小植物的概括性两极表达。
- source_word: הָאֵזוֹב
  choice: 牛膝草
  rationale: 采用圣经汉语中的传统通行译名，但该植物的确切品种不明，因此以脚注保留词义的不确定性。
- source_word: יֹצֵא בַּקִּיר
  choice: 从墙里长出来
  rationale: 原文直译为“从墙中出来”；在植物语境中，“长出来”自然清楚，同时保留其从墙中生出的形象。
- source_word: הַבְּהֵמָה
  choice: 走兽
  rationale: 在与飞鸟、爬行生物和鱼类并列的分类中，指陆生动物；“走兽”既自然又能避免将其误限为牲畜。
- source_word: הָעוֹף
  choice: 飞鸟
  rationale: עוֹף 可泛指飞行生物；此处“飞鸟”符合传统分类语言，也比“禽类”更通俗。
- source_word: הָרֶמֶשׂ
  choice: 爬行动物
  rationale: 这里泛指爬行或蠕动的生物，并非现代生物分类学中严格的“爬行纲”；“爬行动物”在普通汉语中较自然，按宽泛意义理解。
- source_word: הַדָּגִים
  choice: 鱼类
  rationale: 表示鱼这一总体类别；“鱼类”与前列各类生物的分类语境协调。
