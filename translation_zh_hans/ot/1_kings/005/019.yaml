  text: וְ/הִנְ/נִ֣י אֹמֵ֔ר לִ/בְנ֣וֹת בַּ֔יִת לְ/שֵׁ֖ם יְהוָ֣ה אֱלֹהָ֑/י כַּ/אֲשֶׁ֣ר דִּבֶּ֣ר יְהוָ֗ה אֶל דָּוִ֤ד אָבִ/י֙ לֵ/אמֹ֔ר בִּנְ/ךָ֗ אֲשֶׁ֨ר אֶתֵּ֤ן תַּחְתֶּ֨י/ךָ֙ עַל כִּסְאֶ֔/ךָ הֽוּא יִבְנֶ֥ה הַ/בַּ֖יִת לִ/שְׁמִֽ/י׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/019.yaml
  text: And behold[a], I intend to build a house for the name of Yahweh my God, just as Yahweh spoke to David my father, saying, ‘Your son, whom I will set in your place on your throne[c][b], he will build the house for my name.’
translation:
  language: zh_hans
  text: 看哪，我有意为耶和华我上帝的名建造一座殿[a]，正如耶和华对我父亲大卫所说的：‘你的儿子，就是我将使他在你的宝座上接替你的那一位[b]，他必为我的名建造这殿。’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “殿”原文直译为“房屋”，这里指圣殿。
    reason: lexical_alternative
  - marker: b
    text: “使他在你的宝座上接替你”也可译作“立为你的继承人”；原文直译为“把他放在你的位置上、在你的宝座上”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנְנִי אֹמֵר
  choice: 看哪，我有意
  rationale: הִנְנִי具有提示并强调说话者当前立场的作用；אֹמֵר接不定式在此表达决意或意向，而非单纯“我说”。
- source_word: לִבְנוֹת בַּיִת
  choice: 建造一座殿
  rationale: בַּיִת字面为“房屋”，但此处明确指敬拜用的圣殿；正文用现代汉语自然的“殿”，脚注保留字面信息。
- source_word: לְשֵׁם יְהוָה אֱלֹהָי
  choice: 为耶和华我上帝的名
  rationale: 保留希伯来文“为……的名”的圣殿表达，不将其弱化为仅仅“尊崇”。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的专名“耶和华”表达四字神名，并与称号“上帝”区分。
- source_word: אֲשֶׁר אֶתֵּן תַּחְתֶּיךָ עַל כִּסְאֶךָ
  choice: 就是我将立在你的位置上、坐你宝座的那一位
  rationale: 结合王位继承语境表达“置于你的位置”，同时保留“在你宝座上”的王权意象；补出“坐”使现代汉语自然。
- source_word: הוּא יִבְנֶה
  choice: 他必……建造
  rationale: 独立代词הוּא带有强调意味，中文保留“他”，突出被指定建殿的正是这位儿子。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用以色列上帝的专名而非一般称号；“耶和华”是现代中文传统中辨识度最高的专名形式，同时不以“主”替代原文神名。
- issue: “为耶和华的名建殿”的含义
  choice: 保留“为……的名”这一原文表达
  alternative: 为尊崇耶和华而建殿
  rationale: 原文的“名”具有圣殿与神同在的神学张力，不宜简化成单纯表示尊崇的目的短语。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“看哪”保留原文提示和强调语气；引语结构略作汉语化处理，但不消除王位继承及“为神的名建殿”的原文意象。
