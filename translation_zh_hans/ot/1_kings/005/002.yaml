lexical_decisions:
- source_word: וַיְהִי
  choice: 是
  rationale: 该形式在叙事中承接上文并引出陈述；汉语无需另加“现在”或“事情是这样”，用自然判断句表达即可。
- source_word: לֶחֶם שְׁלֹמֹה
  choice: 所罗门所需的粮食
  rationale: לֶחֶם本义为“饼、食物”，此处处于王室日常供应的行政语境，泛指粮食供应；“所需的粮食”既自然，也保留其食品层面的具体含义。
- source_word: לְיוֹם אֶחָד
  choice: 一天
  rationale: 表示一日所需的数量；中文用“一天”简明自然。
- source_word: שְׁלֹשִׁים כֹּר
  choice: 三十歌珥
  rationale: כֹּר是古代大容量干量单位；正文音译为“歌珥”，不以不确定的现代容量换算取代原文数字。
- source_word: סֹלֶת
  choice: 细面
  rationale: 指精细磨制的优质面粉；“细面”是清楚而凝练的现代中文表达。
- source_word: וְשִׁשִּׁים כֹּר
  choice: 和六十歌珥
  rationale: 保留原文并列结构，并与前一处度量单位译法一致。
- source_word: קָמַח
  choice: 面粉
  rationale: 指普通磨成的粉，与前面的סֹלֶת“细面”形成原文已有的品质区别。
