  text: ten fattened cattle[a], and twenty pasture-fed cattle, and a hundred sheep[c][b], besides deer and gazelles and roebucks and fattened fowl.
translation:
  language: zh_hans
  text: 十头肥壮的牛、二十头在牧场放养的牛、一百只羊[a]，另外还有鹿、羚羊、狍子[b]和育肥的禽类[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “羊”所译的希伯来语也可泛指绵羊、山羊等小牲畜。
    reason: lexical_alternative
  - marker: b
    text: “狍子”所译的希伯来语所指的确切动物不能确定；也可能指黇鹿。
    reason: lexical_alternative
  - marker: c
    text: “禽类”所译的希伯来语所指的具体鸟类不能确定；也可译作“育肥的鹅”。
    reason: lexical_alternative
lexical_decisions:
- source_word: בָקָר בְּרִיאִים
  choice: 肥牛
  rationale: בָקָר是牛类的集合称谓，בְּרִיאִים在此指肥壮、育肥的牲畜；“肥牛”自然简洁，也符合膳食供应清单的语境。
- source_word: בָקָר רְעִי
  choice: 放牧的牛
  rationale: רְעִי与牧放、吃草有关；“放牧的牛”与前面的“肥牛”形成原文所表达的饲养方式对比。
- source_word: צֹאן
  choice: 羊
  rationale: צֹאן可统指绵羊和山羊等小型家畜；正文用自然简洁的“羊”，并以脚注保留较宽泛的词义。
- source_word: לְבַד
  choice: 另外还有
  rationale: 该词引出前述主要供应项目以外的附加项目；“另外还有”符合现代汉语清单表达。
- source_word: אַיָּל
  choice: 鹿
  rationale: 该词指鹿，可能更具体指雄鹿；此处是食物清单，用通俗的类别名称“鹿”即可。
- source_word: צְבִי
  choice: 羚羊
  rationale: 该词通常指瞪羚一类动物；“羚羊”是现代中文易懂且不过度细分的对应词。
- source_word: יַחְמוּר
  choice: 狍子
  rationale: 所指野生有蹄动物的确切种类有争议；“狍子”是可理解的传统候选译法，同时以脚注说明也可能指黇鹿。
- source_word: בַרְבֻּרִים אֲבוּסִים
  choice: 肥禽
  rationale: בַרְבֻּרִים指某种禽鸟，但具体种类不确定；אֲבוּסִים表示喂肥。“肥禽”保留泛称和育肥之意，避免武断确定为鹅。
