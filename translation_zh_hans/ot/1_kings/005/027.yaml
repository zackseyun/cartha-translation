  text: King Solomon conscripted forced labor from all Israel[b][a], and the forced labor was thirty thousand men.
translation:
  language: zh_hans
  text: 所罗门王从全以色列人中征调三万名男子服劳役[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“所罗门王从全以色列人中征发劳役人员，共三万人。”
    reason: lexical_alternative
  - marker: b
    text: 原文“劳役”所用的词指强制服役，主要不是指缴纳金钱税款。
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעַל
  choice: 征调
  rationale: 该动词在使役形中与 מַס 连用，表示征集、征发劳役人员；“征调”既体现官方强制征用，也符合现代汉语表达。
- source_word: מַס
  choice: 服劳役的人
  rationale: 在所罗门营建工程的行政语境中，该词指强制性的劳役征发，而非主要指金钱税赋。正文以人员为表达中心，贴合后文“三万人”的计数。
- source_word: מִכָּל יִשְׂרָאֵל
  choice: 从全以色列
  rationale: 保留介词所表达的来源范围，并传达征调遍及以色列整体。
- source_word: וַיְהִי הַמַּס
  choice: 共
  rationale: 希伯来文直译为“这劳役征发是……”，现代汉语用“共”自然引出总人数，同时不增加原文没有的细节。
- source_word: שְׁלֹשִׁים אֶלֶף אִישׁ
  choice: 三万人
  rationale: אִישׁ 在这里用于计数被征调的成年男性劳工；汉语“人”在此计数结构中自然，语境已明确所指劳役人员。
