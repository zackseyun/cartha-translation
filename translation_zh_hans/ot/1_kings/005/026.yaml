source:
  edition: WLC
  text: וַ/יהוָ֗ה נָתַ֤ן חָכְמָה֙ לִ/שְׁלֹמֹ֔ה כַּ/אֲשֶׁ֖ר דִּבֶּר ל֑/וֹ וַ/יְהִ֣י שָׁלֹ֗ם בֵּ֤ין חִירָם֙ וּ/בֵ֣ין שְׁלֹמֹ֔ה וַ/יִּכְרְת֥וּ בְרִ֖ית שְׁנֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/026.yaml
  text: And Yahweh gave wisdom to Solomon[a], just as he had spoken to him. And there was peace between Hiram and Solomon[b], and the two of them made a covenant.
translation:
  language: zh_hans
  text: 耶和华照着他对所罗门所说的话[a]，赐给所罗门智慧。希兰与所罗门和睦相处，二人立了约[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“照着他向所罗门所应许的。”希伯来语动词直译为“说”，但这里可指耶和华先前对所罗门所说的应许。
    reason: alternative_reading
  - marker: b
    text: 希伯来语直译为“切了约”，是“立约”的惯用说法。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代汉语圣经读者熟悉的音译来呈现以色列上帝的专名，不以“主”这一称号替代。
- source_word: נָתַן חָכְמָה
  choice: 赐给……智慧
  rationale: נָתַן本义为“给”；用于上帝施予时，“赐给”在现代汉语中自然、庄重，同时保留动作的直接性。חָכְמָה译为“智慧”，涵盖此处治理和实践方面的才智。
- source_word: כַּאֲשֶׁר דִּבֶּר לוֹ
  choice: 照着他对所罗门所说的话
  rationale: 保留דִּבֶּר“说”的基本词义，不在正文中直接限定为“应许”；上下文可能带有应许含义，列入脚注。将代词所指明示为“所罗门”，以免汉语表达含混。
- source_word: וַיְהִי שָׁלֹם בֵּין
  choice: ……与……和睦相处
  rationale: 原文直译为“两者之间有和平”。“和睦相处”自然表达两位君王之间持续的和平关系，又没有扩大为私人友谊。
- source_word: וַיִּכְרְתוּ בְרִית
  choice: 立了约
  rationale: 该希伯来语惯用语字面为“切约”。“立约”是自然、凝练的现代汉语表达，并保留בְרִית的盟约性用语，而不局限为政治“条约”。
- source_word: שְׁנֵיהֶם
  choice: 二人
  rationale: 明确表示希兰和所罗门双方共同参与立约，符合现代汉语习惯。
theological_decisions:
- issue: 如何呈现神名יְהוָה
  choice: 耶和华
  alternative: 雅威；主
  rationale: “耶和华”是现代汉语中广为人知的神名音译，可作为专名使用；不译作“主”，以免用称号取代原文专名。
- issue: דִּבֶּר在此是否明确译为“应许”
  choice: 正文译“所说的话”
  alternative: 所应许的
  rationale: 原词本身是“说”，上下文可使这话具有应许性质，但正文保留原文措辞，并以脚注说明语境性的另一译法。
- issue: בְרִית译为“约”还是政治性的“条约”
  choice: 立了约
  alternative: 缔结了条约
  rationale: 虽然这里涉及两国君王的和平关系，原文仍使用常见的盟约词בְרִית；保留“约”可维持关键用语的一致性，而不把含义缩窄为现代政治条约。
translation_notes:
  register: 采用自然、庄重而清楚的现代标准汉语。用“和睦相处”表达君王之间的和平关系；用传统而仍通行的“立约”保留原文的盟约词汇。脚注标记已按其实际对应内容放置，纠正咨询层中标记位置与注释内容不相配的问题。
