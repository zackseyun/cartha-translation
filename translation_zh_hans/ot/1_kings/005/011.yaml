  text: וַ/יֶּחְכַּם֮ מִ/כָּל הָֽ/אָדָם֒ מֵ/אֵיתָ֣ן הָ/אֶזְרָחִ֗י וְ/הֵימָ֧ן וְ/כַלְכֹּ֛ל וְ/דַרְדַּ֖ע בְּנֵ֣י מָח֑וֹל וַ/יְהִֽי שְׁמ֥/וֹ בְ/כָֽל הַ/גּוֹיִ֖ם סָבִֽיב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/011.yaml
  text: He was wiser than every man—than Ethan the Ezrahite[a], and Heman, Kalkol, and Darda[c][b], the sons of Mahol—and his name was in all the surrounding nations.
translation:
  language: zh_hans
  text: 他的智慧胜过所有人[a]，胜过以斯拉人[b]以探、希幔、甲各和达大——他们都是玛曷的儿子；他的名声传遍周围的列国[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“胜过全人类”。希伯来文 אָדָם 可指“人”，也可泛指人类；此处列举的是男性智者。
    reason: lexical_alternative
  - marker: b
    text: “以斯拉人”可能是族属或家族称号；也有人认为可与“谢拉人”有关。
    reason: lexical_alternative
  - marker: c
    text: 直译“他的名在周围列国中”，意思是他的声望传到周围各国。
    reason: literal_idiom
lexical_decisions:
- source_word: וַיֶּחְכַּם
  choice: 他的智慧胜过
  rationale: 此处 חכם 与比较介词 מִן 连用，重点是智慧超越别人，而不是单说“变得有智慧”。“智慧胜过”自然保留了比较含义。
- source_word: מִכָּל הָאָדָם
  choice: 胜过所有人
  rationale: אָדָם 在这里可以指每一个人，也可广指全人类。现代汉语“所有人”既自然，也不必在所列男性智者之外额外限定性别；脚注保留“全人类”的可能理解。
- source_word: מֵאֵיתָן הָאֶזְרָחִי
  choice: 胜过以斯拉人以探
  rationale: 将 אֵיתָן 音译为“以探”，将不确定的族属或家族称号 אֶזְרָחִי 依其字面形式译作“以斯拉人”，避免直接认定为“谢拉人”。
- source_word: וְהֵימָן וְכַלְכֹּל וְדַרְדַּע
  choice: 也胜过……希幔、甲各和达大
  rationale: 这些均为人名，采用汉语圣经传统中通行且易辨认的音译。
- source_word: בְּנֵי מָחוֹל
  choice: 玛曷的儿子
  rationale: 该结构最自然地表示父系或家族关系；虽有人把 מָחוֹל 与“舞蹈”联系起来，此处人名名单的语境更支持将“玛曷”视为专名。
- source_word: וַיְהִי שְׁמוֹ
  choice: 他的名声传遍了
  rationale: 希伯来文直译为“他的名在……”，其中“名”在此表示声望。汉语以“名声传遍”表达同一惯用含义，更自然清楚，同时在脚注说明字面形式。
- source_word: בְּכָל הַגּוֹיִם סָבִיב
  choice: 周围列国
  rationale: גּוֹיִם 在此指邻近的各民族国家，不应带入后期神学语境中的“外邦人”含义；“周围列国”简洁表达其地理范围。
theological_decisions:
- issue: 比较句中 אָדָם 的范围
  choice: 所有人
  alternative: 全人类；所有男子
  rationale: 该词既可指“人”，也可集合性地指“人类”。上下文列出男性智者，但希伯来词本身在此未必把比较范围严格限于男性；“所有人”保留普遍比较，也符合自然现代汉语。
- issue: “名”作为声望的表达
  choice: 名声传遍了
  alternative: 他的名在周围列国中
  rationale: שֵׁם 可按字面译作“名”，也常转指名望。正文采用清楚自然的汉语惯用表达，不赋予额外神学含义；脚注保留字面说法。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。比较结构通过重复“胜过”保持清晰；人名使用通行音译。“列国”在历史叙事中简洁庄重，但不带入后期关于“外邦人”的专门神学含义。
