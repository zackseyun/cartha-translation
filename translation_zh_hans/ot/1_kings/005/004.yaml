  text: כִּי ה֞וּא רֹדֶ֣ה בְּ/כָל עֵ֣בֶר הַ/נָּהָ֗ר מִ/תִּפְסַח֙ וְ/עַד עַזָּ֔ה בְּ/כָל מַלְכֵ֖י עֵ֣בֶר הַ/נָּהָ֑ר וְ/שָׁל֗וֹם הָ֥יָה ל֛/וֹ מִ/כָּל עֲבָרָ֖י/ו מִ/סָּבִֽיב־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/004.yaml
  text: For he was ruling over all the region beyond the River[a], from Tiphsah to Gaza, over all the kings beyond the River[b]; and he had peace on all sides around him.
translation:
  language: zh_hans
  text: 因为他统管大河[a]西边的全境，从提弗萨[b]直到迦萨，也统管大河西边的众王；他四境都平安。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 指幼发拉底河。
    reason: cultural_note
  - marker: b
    text: 提弗萨的具体位置尚有讨论；一般认为它在幼发拉底河附近，并标示所罗门统治范围的北端。
    reason: cultural_note
lexical_decisions:
- source_word: רֹדֶה
  choice: 统管
  rationale: 该分词表示持续施行统治或掌权；“统管”既保留政治辖治的含义，也适合现代汉语叙事。
- source_word: בְּכָל עֵבֶר הַנָּהָר
  choice: 大河西边的全境
  rationale: עֵבֶר הַנָּהָר是地域用语；按本节从提弗萨到迦萨的地理范围，所指为幼发拉底河以西地区。“全境”自然表达 territorial scope。
- source_word: הַנָּהָר
  choice: 大河
  rationale: 原文用带定冠词的普通名词“那河”，惯指幼发拉底河。正文采用汉语圣经地理语境中自然的“大河”，脚注说明所指。
- source_word: מִתִּפְסַח וְעַד עַזָּה
  choice: 从提弗萨直到迦萨
  rationale: 直接表达统治范围的两个端点；“直到”清楚传达 מִן…וְעַד 的起讫结构。
- source_word: בְּכָל מַלְכֵי עֵבֶר הַנָּהָר
  choice: 也统管大河西边的众王
  rationale: 补出前句共享的谓语“统管”，使现代汉语关系明确；“众王”保留对该地区所有诸王的宗主权含义。
- source_word: וְשָׁלוֹם הָיָה לוֹ
  choice: 他……都平安
  rationale: שָׁלוֹם在此主要指政治安定、无战事；“平安”保留该词较宽的语义，不限于主观感受。
- source_word: מִכָּל עֲבָרָיו מִסָּבִיב
  choice: 四境都
  rationale: 该短语指他周围各方；“四境都平安”是自然、庄重的汉语表达，并避免把 עֲבָרָיו 过度具体化为邻国或邻邦。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“统管”体现持续的政治统治；“四境都平安”简洁呈现周围各方安定无战事的意思。
