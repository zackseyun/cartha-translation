  text: וַ/יְהִ֨י חִיר֜וֹם נֹתֵ֣ן לִ/שְׁלֹמֹ֗ה עֲצֵ֧י אֲרָזִ֛ים וַ/עֲצֵ֥י בְרוֹשִׁ֖ים כָּל חֶפְצֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/024.yaml
  text: And Hiram was giving Solomon cedar timber and cypress timber[a], according to all his desire.
translation:
  language: zh_hans
  text: 希兰按着所罗门所要的一切，不断供给他香柏木和柏木[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “柏木”所译的希伯来语，其确切树种不能确定；也可译作“刺柏木”，传统上也译作“冷杉木”。
    reason: 保留 בְּרוֹשִׁים 在树种辨认上的词义不确定性，并将传统替代译法与英文审校轨迹的 fir 对齐。
lexical_decisions:
- source_word: וַיְהִי
  choice: （以叙事承接表达，不单独译出）
  rationale: 此处连接前文并引出过去叙事中的持续行动；现代汉语无需机械译作“事情是这样”。
- source_word: חִירוֹם
  choice: 希兰
  rationale: 采用现代中文圣经中通行的人名音译。
- source_word: נֹתֵן
  choice: 不断供给
  rationale: 分词与 וַיְהִי 连用，表示过去持续或经常发生的行动；“不断供给”既保留延续意味，也符合建材供应的语境。
- source_word: לִשְׁלֹמֹה
  choice: 给所罗门／供给他
  rationale: 介词 לְ 标明接受者；正文先点明所罗门的需求，再以“他”作间接宾语，使汉语自然且指代清楚。
- source_word: עֲצֵי אֲרָזִים
  choice: 香柏木
  rationale: 该构造短语在建筑材料语境中指香柏木材；“香柏木”是自然、通行的中文表达。
- source_word: וַעֲצֵי בְרוֹשִׁים
  choice: 和柏木[a]
  rationale: בְּרוֹשִׁים 指一种用于建筑的针叶树，但确切树种不能确定；正文采用较通行的“柏木”，并以脚注保留其他可能。
- source_word: כָּל חֶפְצוֹ
  choice: 按着所罗门所要的一切
  rationale: 保留“全部所愿、所求”的范围，并根据句法语境明确所指为所罗门；“按着”体现供应与其需求相符。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“不断供给”表达希伯来语过去叙事中分词的持续性；语序作适度调整，使“按着所罗门所要的一切”清楚修饰供应行为。
