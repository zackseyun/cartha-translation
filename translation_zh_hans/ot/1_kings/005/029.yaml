  text: And Solomon had seventy thousand burden-bearers[a], and eighty thousand stonecutters in the mountains.
translation:
  language: zh_hans
  text: 所罗门有七万名搬运工，八万名在山中凿石的工人[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文意为“在山中凿削的人”；未说明所凿之物，可能指山地采石场的工人。
    reason: 说明原文未明说所凿之物，并保留“山”这一地貌表达的含义范围。
lexical_decisions:
- source_word: וַיְהִי לִשְׁלֹמֹה
  choice: 所罗门有
  rationale: 希伯来语“היה + ל”在此表达领有或归属；译作“所罗门有”符合现代汉语，也保留叙事陈述的语气。
- source_word: שִׁבְעִים אֶלֶף
  choice: 七万名
  rationale: 按原文直译数目；加量词“名”，使汉语表达自然。
- source_word: נֹשֵׂא סַבָּל
  choice: 搬运工
  rationale: 该短语直指承担、搬运重物的人；“搬运工”简明自然，能准确表达其劳动职能。
- source_word: וּשְׁמֹנִים אֶלֶף
  choice: 八万名
  rationale: 按原文直译数目，并用“名”与前一组人员保持一致。
- source_word: חֹצֵב
  choice: 凿石的工人
  rationale: חצב意为凿、挖、开采；在建造工程和山地作业的语境中，所凿之物应为石料。“凿石的工人”比单说“开凿者”更清楚，同时避免过度专门化。
- source_word: בָּהָר
  choice: 在山中
  rationale: 原文为单数“山”，但可作地貌或集合性表达；“在山中”既贴近字面，也可自然指山地区域，不必强行确定为某一座山或多座山。
