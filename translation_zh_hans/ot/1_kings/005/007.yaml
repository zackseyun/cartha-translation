  to: 这些行政官员[a]供应所罗门王和所有到所罗门王席前来的人[b]；各人按自己的月份供应，什么也没有缺少。
  rationale: 修订以“各人按自己的月份供应”明确原文所指的按月轮值职责，并以“什么也没有缺少”自然、直接地表达供应毫无缺欠。脚注b删除了原文未明说的“由王室宴席供养”，保留王席近侍的语境含义而避免过度解释。
