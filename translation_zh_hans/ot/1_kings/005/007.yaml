base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/007.yaml
  text: These deputies provided for King Solomon and for all who came near the table of King Solomon[a], each in his month[b]; they lacked nothing.
translation:
  language: zh_hans
  text: 这些行政官员[a]供应所罗门王和所有到所罗门王席前来的人[b]；各人按自己的月份供应，什么也没有缺少。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “行政官员”也可译作“官员”或“地方长官”。希伯来文指受委派管理各行政区的人。
    reason: lexical_alternative
  - marker: b
    text: 直译为“所有到所罗门王席前来的人”，指有资格接近王席的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִלְכְּלוּ
  choice: 供应
  rationale: 该动词的加强语干在王室行政语境中指供应生活所需；“供应”简洁自然，又不额外限定供应方式。
- source_word: הַנִּצָּבִים הָאֵלֶּה
  choice: 这些行政官员
  rationale: 此词在所罗门的行政体系中指受委派管理各区的人。“行政官员”能说明其职能，并避免现代“省长”等称谓可能造成的误解。
- source_word: אֶת הַמֶּלֶךְ שְׁלֹמֹה
  choice: 所罗门王
  rationale: 符合现代汉语对君王名号的自然表达。
- source_word: וְאֵת כָּל הַקָּרֵב אֶל שֻׁלְחַן הַמֶּלֶךְ שְׁלֹמֹה
  choice: 和所有来到所罗门王席前的人
  rationale: 保留希伯来文“来到／接近席前”的形象，同时在上下文中自然指有资格接近王席、由王室供养的人。
- source_word: אִישׁ חָדְשׁוֹ
  choice: 各人负责自己的月份
  rationale: 这是分配性表达，说明官员按月轮流承担供应职责；译文保留“各人”和“自己的月份”，且使行政轮值之意清楚。
- source_word: לֹא יְעַדְּרוּ דָּבָר
  choice: 他们没有让任何东西短缺
  rationale: 该表达指所需供应毫无缺欠；此译法保留官员为行动主体，也准确表达供应充足的结果。
theological_decisions: []
