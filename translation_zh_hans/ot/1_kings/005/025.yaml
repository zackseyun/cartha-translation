base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/025.yaml
  text: And Solomon gave Hiram twenty thousand cors of wheat as food for his household[a], and twenty cors of beaten oil[b]. Thus Solomon would give to Hiram year by year.
translation:
  language: zh_hans
  text: 所罗门给希兰两万歌珥小麦，供他家用的食物[a]，又给他二十歌珥捣制的油[b]。所罗门年年都这样供给希兰。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“作他家的供应品”。这里的“家”很可能指希兰的王室家室。
    reason: lexical_alternative
  - marker: b
    text: “捣制的油”指把橄榄捣碎或击碎后制成的优质油，有别于后续压榨所得的油。
    reason: cultural_note
lexical_decisions:
- source_word: נָתַן / יִתֵּן
  choice: 给 / 供给
  rationale: 前者用完成式陈述所定的供应，后者用未完成式配合“年年”表达过去持续、惯常的供给；中文以“给”和“年年供给”自然体现这种区别。
- source_word: כֹּר
  choice: 歌珥
  rationale: 这是古代容量单位。采用音译以保留原文的具体计量名称，避免用笼统的“量器”掩盖其性质。
- source_word: חִטִּים
  choice: 小麦
  rationale: 该词特指小麦，而非泛指粮食。
- source_word: מַכֹּלֶת לְבֵיתוֹ
  choice: 作他家中的食物
  rationale: מַכֹּלֶת意为食物或供应品，לְבֵיתוֹ可指希兰的家室或王室人员；正文保持“家中”这一较宽表达，脚注说明其可能范围。
- source_word: שֶׁמֶן כָּתִית
  choice: 捣制油
  rationale: כָּתִית指以捣碎、击打橄榄的方式制得的油。“捣制油”比单说“上等油”更能保留制作方法；原文此处未明说“橄榄”，故正文不增补。
- source_word: כֹּה
  choice: 就这样
  rationale: 该词说明前述数量构成持续供应的方式或惯例，“就这样”自然衔接下文。
- source_word: שָׁנָה בְשָׁנָה
  choice: 年年
  rationale: 简明自然地表达原文逐年、每年重复的惯常行为。
