base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/020.yaml
  text: Now command that cedars from Lebanon be cut for me[a], and let my servants be with your servants, and I will give you the wages of your servants according to all that you say[b]; for you know that among us there is no man who knows how to cut timber like the Sidonians.
translation:
  language: zh_hans
  text: 现在，请下令，让人从黎巴嫩为我砍伐香柏木。让我的仆人和你的仆人一起工作；你仆人的工钱，我会照你所说的一切付给你。因为你知道，我们中间没有人[a]像西顿人那样懂得砍伐木材[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“我们中间没有一个男人”。这里的说法强调他们当中无人具有同等技能，不一定是在作排除女性的社会性声明。
    reason: lexical_alternative
  - marker: b
    text: 或译“砍伐树木”。原文的词可指树木或木料；这里的语境是采伐建筑用材。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: 现在
  rationale: 作为话语承接语，引出所罗门当前的请求；“现在”符合现代汉语表达。
- source_word: צַוֵּה וְיִכְרְתוּ לִי
  choice: 请下令为我……砍伐
  rationale: 保留צוה的命令含义，同时用“请”自然表达君王之间的请求；后接的未完成式在此受命令语境支配。
- source_word: אֲרָזִים מִן הַלְּבָנוֹן
  choice: 从黎巴嫩砍伐香柏木
  rationale: “香柏木”是圣经汉语中对אֶרֶז的通行称呼，“从黎巴嫩”明确木材来源。
- source_word: וַעֲבָדַי יִהְיוּ עִם עֲבָדֶיךָ
  choice: 我的仆人要和你的仆人在一起
  rationale: 保留两次עבד的对应关系及原文简洁的协作安排，不额外限定其身份或具体分工。
- source_word: וּשְׂכַר עֲבָדֶיךָ אֶתֵּן לְךָ
  choice: 你仆人的工钱，我会……付给你
  rationale: שכר在此指劳动报酬；“工钱”清楚自然，并保留款项付给推罗王的表达。
- source_word: כְּכֹל אֲשֶׁר תֹּאמֵר
  choice: 照你所说的一切
  rationale: 较贴近原文“按照你所说的一切”，没有将其缩窄为某种特定议价方式。
- source_word: אֵין בָּנוּ אִישׁ
  choice: 我们中间没有人
  rationale: איש在否定存在句中可泛指任何人；现代汉语“没有人”准确传达范围，也避免不必要地暗示社会性别排除。
- source_word: יֹדֵעַ לִכְרָת עֵצִים
  choice: 懂得砍伐木材
  rationale: 该结构表达掌握某种技能；עֵצִים字面可指树木或木料，建筑用材语境支持“木材”。
- source_word: כַּצִּדֹנִים
  choice: 像西顿人那样
  rationale: 直接保留对西顿人伐木技能的比较。
