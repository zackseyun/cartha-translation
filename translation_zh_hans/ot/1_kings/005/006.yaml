  text: And Solomon had forty thousand stalls of horses for his chariots[a], and twelve thousand horsemen.
translation:
  language: zh_hans
  text: 所罗门有四万个供战车用马使用的马栏[a]，又有一万二千名骑兵。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“马厩”；希伯来语更确切地指供马匹停留或进食的栏位。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי לִשְׁלֹמֹה
  choice: 所罗门有
  rationale: “וַיְהִי לְ”与所有者连用，在这里表达拥有或归属；现代汉语自然译为“所罗门有”。
- source_word: אַרְבָּעִים אֶלֶף
  choice: 四万个
  rationale: 按原文直译数词，并以量词“个”修饰“马槽”。
- source_word: אֻרְוֺת
  choice: 马槽
  rationale: 该词更具体地指马匹所在或进食的槽位，而非整个马厩建筑；“马槽”保留了这一较精确的词义。
- source_word: סוּסִים לְמֶרְכָּבוֹ
  choice: 供战车用的马槽
  rationale: 原文为“供他的战车使用的马的槽位”；这样译使中文关系清楚，同时保留其战车编制的用途。
- source_word: וּשְׁנֵים עָשָׂר אֶלֶף
  choice: 还有一万二千名
  rationale: 准确表达并列关系和数量；“还有”符合现代汉语行文。
- source_word: פָּרָשִׁים
  choice: 骑兵
  rationale: 该词通常指骑马者或骑乘作战的人；“骑兵”在此军事语境中自然明确，同时不采用词义可能性较低的“战车御者”。
