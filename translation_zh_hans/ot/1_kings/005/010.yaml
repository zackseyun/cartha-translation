  yaml_path: translation/ot/1_kings/005/010.yaml
  text: And Solomon’s wisdom surpassed the wisdom of all the people of the east and all the wisdom of Egypt[a].
translation:
  language: zh_hans
  text: 所罗门的智慧胜过东方众人的智慧，也胜过埃及的一切智慧[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “东方众人”直译为“东方众子”，是指东方地区人群的惯用地域称谓。
    reason: 说明“东方众子”（בני־קדם）的字面形式及其作为地域性集体称谓的惯用含义。
lexical_decisions:
- source_word: וַתֵּרֶב
  choice: 胜过
  rationale: 动词רבה后接比较介词מִן，在本句表达程度上的超越；“胜过”自然、准确地呈现比较关系。
- source_word: חָכְמַת
  choice: 智慧
  rationale: חָכְמָה在此广泛指智慧、学识和才智；“智慧”既符合上下文，也是庄重而通行的译法。
- source_word: שְׁלֹמֹה
  choice: 所罗门
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: כָּל בְּנֵי קֶדֶם
  choice: 东方所有人
  rationale: בְּנֵי קֶדֶם直译为“东方之子”，实为指称东方地区人群的地域性惯用语；正文译作“东方所有人”，既保留כָּל的周全语气，也符合现代汉语表达。
- source_word: וּמִכֹּל חָכְמַת מִצְרָיִם
  choice: 也胜过埃及人的一切智慧
  rationale: 第二个מִן短语与前一比较对象并列，并共同受动词支配；汉语复述“胜过”可清楚显示句法关系。“埃及人的智慧”按地域群体理解，也与前项的人群表达平行。
- source_word: מִצְרָיִם
  choice: 埃及
  rationale: 采用现代中文通行地名。
