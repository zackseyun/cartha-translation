  text: וַ/יֵּשֶׁב֩ יְהוּדָ֨ה וְ/יִשְׂרָאֵ֜ל לָ/בֶ֗טַח אִ֣ישׁ תַּ֤חַת גַּפְנ/וֹ֙ וְ/תַ֣חַת תְּאֵֽנָת֔/וֹ מִ/דָּ֖ן וְ/עַד בְּאֵ֣ר שָׁ֑בַע כֹּ֖ל יְמֵ֥י שְׁלֹמֹֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/005.yaml
  text: And Judah and Israel lived in safety[a], each man under his vine and under his fig tree, from Dan to Beer-sheba[b], all the days of Solomon.
translation:
  language: zh_hans
  text: 所罗门在世的日子，犹大人和以色列人从但到别是巴都安然居住；各人在自己的葡萄树下和无花果树下[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文为阳性单数“人”，在这里按逐一分配的方式使用，意思是“各人”或“人人”。“在自己的葡萄树下和无花果树下”是安享和平、安全与富足生活的传统图景。
    reason: 说明原文阳性单数的分配用法，并说明保留的古代和平与安居意象。
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: 居住
  rationale: 该动词基本义为“坐、居住”；与לָבֶטַח连用时，表示安定而安全地生活。“居住”既贴近原文，也符合现代汉语。
- source_word: יְהוּדָה וְיִשְׂרָאֵל
  choice: 犹大人和以色列人
  rationale: 这里指名为犹大和以色列的两方民众。汉语加“人”可避免误读为两片土地在“居住”，同时保留原文的政治—群体称谓。
- source_word: לָבֶטַח
  choice: 安然
  rationale: 此词表示安全、无所惧怕的状态；“安然居住”简洁自然，并与下文和平安定的图景呼应。
- source_word: אִישׁ
  choice: 各人
  rationale: 原文使用阳性单数“人”，在此作逐一分配用法。“各人”准确表达每一家、每个人都享有这种安稳生活，又不使现代汉语显得生硬。
- source_word: תַּחַת גַּפְנוֹ וְתַחַת תְּאֵנָתוֹ
  choice: 在自己的葡萄树下和无花果树下
  rationale: 保留原文具体而传统的意象，不将其直接释为“和平繁荣”；“自己的”自然表达两个第三人称单数后缀所强调的个人所有与安享。
- source_word: מִדָּן וְעַד בְּאֵר שָׁבַע
  choice: 从但直到别是巴
  rationale: 保留这组地名及其由北至南概括全境的表达方式，不在正文中将其解释性改写为“全国各地”。
- source_word: כֹּל יְמֵי שְׁלֹמֹה
  choice: 所罗门在世的日子一直如此
  rationale: 原文直译为“所罗门所有的日子”。此译保留持续时间的含义，又以自然汉语承接全句；不擅自把范围严格限定为某种特定的年代计算。
theological_decisions:
- issue: 如何处理分配用法的阳性单数אִישׁ
  choice: 正文译作“各人”，脚注说明原文形式
  alternative: 译作“各个男人”或“人人”
  rationale: “各个男人”会在现代汉语中过度突出性别，而“人人”又不显明原文的单数分配结构。“各人”兼顾原文形式、代表性用法和自然表达，不据此引申任何性别方面的教义。
- issue: 如何处理“在自己的葡萄树下和无花果树下”的意象
  choice: 在正文中保留字面图像
  alternative: 直接改写为“过着和平、富足的生活”
  rationale: 这一传统图像同时表达和平、安全、产业与兴盛。保留意象可维护其文学及经文互文力量，脚注仅提供文化背景，不把其意义限定为单一神学解释。
- issue: “所罗门所有的日子”的时间范围
  choice: 译作“所罗门在世的日子一直如此”
  alternative: 译作“所罗门执政期间”
  rationale: 原文没有明说“执政”或“统治”；正文避免增添该词，以保留原语较宽的表述，同时让上下文自然指向所罗门时代。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“安然居住”保持经文语体而不古奥；“从但直到别是巴”保留熟悉的地理总括表达。脚注标记均放在其实际说明的词语或意象之后。
