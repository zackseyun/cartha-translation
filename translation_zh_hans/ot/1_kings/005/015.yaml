base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/015.yaml
  text: Then Hiram king of Tyre sent his servants to Solomon[a], because he had heard that they had anointed him king in place of his father, for Hiram had always loved David.
translation:
  language: zh_hans
  text: 推罗王希兰派他的臣仆到所罗门那里，因为他听说有人已经膏立所罗门接替他父亲作王。原来希兰一向喜爱大卫[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“原来希兰一向与大卫友好。”希伯来文直译为“希兰在所有的日子爱大卫”，表示一种持续的友好关系。
    reason: 说明“喜爱”也可按关系性含义译作“友好”，并保留כָּל הַיָּמִים的较直译表达。
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: 派
  rationale: 在王室外交语境中，“派”自然表达差遣人员前往，同时保持叙事动词的简洁。
- source_word: חִירָם מֶלֶךְ צֹר
  choice: 推罗王希兰
  rationale: 采用现代中文圣经地名和人名的通行译法，并按自然汉语次序表达头衔与姓名。
- source_word: עֲבָדָיו
  choice: 他的臣仆
  rationale: 该词可指仆人、臣属或官员；外交语境中的“臣仆”既保留其隶属王室的含义，也不武断限定为奴隶或高级官员。
- source_word: אֶל שְׁלֹמֹה
  choice: 到所罗门那里
  rationale: 忠实表达方向，不增添“拜访”或谈判等原文未明说的目的。
- source_word: כִּי שָׁמַע
  choice: 因为他听说
  rationale: 首个כִּי说明希兰派人的原因；“听说”符合消息传到王宫的语境。
- source_word: אֹתוֹ מָשְׁחוּ לְמֶלֶךְ
  choice: 众人已经膏立所罗门……作王
  rationale: 希伯来文使用未指明主语的复数动词，故以泛指的“众人”表达，不擅自认定具体执行者；“已经”体现此事先于派遣发生。为避免中文代词指向含混，重述“所罗门”。
- source_word: תַּחַת אָבִיהוּ
  choice: 接替他父亲
  rationale: 在王位承继语境中，תַּחַת表示取代、继任；“接替”比直译“在他父亲之下”准确自然。
- source_word: כִּי אֹהֵב הָיָה חִירָם לְדָוִד
  choice: 原来希兰一直喜爱大卫
  rationale: 第二个כִּי补充背景原因，以“原来”衔接自然；“一直喜爱”保留分词与היה所表达的持续有利关系，而不直接收窄为政治盟友或私人朋友。
- source_word: כָּל הַיָּמִים
  choice: 一直
  rationale: 以自然现代汉语概括“所有的日子”所表示的持续性；具体关系性质及较直译说法在脚注中说明。
