  to: 推罗王希兰派他的臣仆到所罗门那里，因为他听说有人已经膏立所罗门接替他父亲作王。原来希兰一向喜爱大卫[a]。
  rationale: 将“众人”改为“有人”，以避免把原文未指明的复数主语误读为全体民众。脚注相应润饰，使较直译说明更自然，且不把“所有的日子”不必要地限定为某一人的一生。
