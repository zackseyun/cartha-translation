  text: וַֽ/יִּפְסְל֞וּ בֹּנֵ֧י שְׁלֹמֹ֛ה וּ/בֹנֵ֥י חִיר֖וֹם וְ/הַ/גִּבְלִ֑ים וַ/יָּכִ֛ינוּ הָ/עֵצִ֥ים וְ/הָ/אֲבָנִ֖ים לִ/בְנ֥וֹת הַ/בָּֽיִת׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/032.yaml
  text: So Solomon’s builders[a], Hiram’s builders[b], and the men of Gebal cut and prepared the timber and the stones to build the house.
translation:
  language: zh_hans
  text: 于是，所罗门的工匠、希兰的工匠和迦巴勒人[a]切割并预备好木料和石料，用来建造这殿[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 即来自迦巴勒（比布鲁斯）的工人；也可译作“迦巴勒族人”。
    reason: lexical_alternative
  - marker: b
    text: 即耶和华的殿，也就是圣殿。
    reason: cross_reference
lexical_decisions:
- source_word: וַיִּפְסְלוּ
  choice: 切割
  rationale: פסל在建筑语境中指切削、凿制材料。“切割”是现代汉语中的通用说法，可同时涵盖上下文中的木料和石料，又不把含义局限为采石。
- source_word: בֹּנֵי שְׁלֹמֹה
  choice: 所罗门的工匠
  rationale: 该短语在这里指所罗门属下从事建造工作的人员。“工匠”自然简洁，也保留其职业含义。
- source_word: וּבֹנֵי חִירוֹם
  choice: 希兰的工匠
  rationale: 与“所罗门的工匠”采用相同表达，以保留原文的平行结构。
- source_word: וְהַגִּבְלִים
  choice: 迦巴勒人
  rationale: 这是指来自迦巴勒（即比布鲁斯）的人。正文采用地名加“人”的现代汉语表达，具体地名信息在脚注中说明。
- source_word: וַיָּכִינוּ
  choice: 预备好
  rationale: כון的使役式在此意为使材料准备妥当；“预备好”清楚表达工程材料已可供建造使用。
- source_word: הָעֵצִים
  choice: 木料
  rationale: 建筑语境中的“木料”比泛指的“木头”更准确，也比“原木”少作额外限定。
- source_word: וְהָאֲבָנִים
  choice: 石料
  rationale: 原文直指石头；“石料”符合建筑语境，同时不擅自限定为某种尺寸或形制的石块。
- source_word: לִבְנוֹת הַבָּיִת
  choice: 用来建造这殿
  rationale: בַּיִת字面为“房屋/殿宇”，在本段特指耶和华的殿。“这殿”既符合现代汉语的圣殿语境，也避免在正文中加入原文未明说的“耶和华”或直接改作解释性的“圣殿”。
theological_decisions:
- issue: הַבָּיִת在此所指
  choice: 正文译作“这殿”，脚注说明是耶和华的殿（圣殿）
  alternative: 正文直接译作“圣殿”或“耶和华的殿”
  rationale: 上下文明确所建的是圣殿，但原文此处只用带定冠词的בַּיִת。正文保留“殿”的源文措辞，脚注补明所指，避免把解释直接写入正文。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“工匠”比“建造者”更符合实际施工人员的语境；“木料和石料”形成简明对称。正文脚注标记均紧随所解释的词语。
