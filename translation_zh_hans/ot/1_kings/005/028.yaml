revisions:
- from: 他派他们轮班到黎巴嫩去，每月一万人；他们在黎巴嫩一个月，在家两个月。亚多尼兰主管服劳役的人。[a]
  to: 他派他们轮流前往黎巴嫩，每月一万人；他们在黎巴嫩一个月，在家两个月。亚多尼兰负责管理强制劳役。[a]
  rationale: 修订仅纠正末句对 מַס 的句法和语义处理：亚多尼兰管理的是国家强制劳役，而非仅仅“服劳役的人”。同时调整脚注，使其与修订后的正文术语相对应。
