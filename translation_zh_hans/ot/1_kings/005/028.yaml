base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/028.yaml
  text: He sent them to Lebanon[a], ten thousand a month in shifts; they would be in Lebanon one month and two months at home[c][b], and Adoniram was over the forced labor.
translation:
  language: zh_hans
  text: 他派他们轮流前往黎巴嫩，每月一万人；他们在黎巴嫩一个月，在家两个月。亚多尼兰负责管理强制劳役。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “强制劳役”或译“劳役征派”；希伯来语指国家强制征用的劳力或劳役制度。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלָחֵם
  choice: 他派他们……去
  rationale: 保留第三人称复数宾语和叙事动作；“派……去”在现代汉语中自然对应差遣之意。
- source_word: לְבָנוֹנָה
  choice: 到黎巴嫩去
  rationale: 地名后的方向词尾表示朝向该地；汉语用“到……去”自然表达。
- source_word: עֲשֶׂרֶת אֲלָפִים בַּחֹדֶשׁ חֲלִיפוֹת
  choice: 轮班……每月一万人
  rationale: חֲלִיפוֹת 表示交替、轮换；将“轮班”提前与派遣连用，清楚呈现每月一万人的轮换制度。
- source_word: חֹדֶשׁ יִהְיוּ בַלְּבָנוֹן
  choice: 他们在黎巴嫩一个月
  rationale: 单数“月”在此表示一个月的时段，与下句“两个月”对应。
- source_word: שְׁנַיִם חֳדָשִׁים בְּבֵיתוֹ
  choice: 在家两个月
  rationale: 字面为“在他的家中”，单数后缀按集体中的每个人理解；“在家”最符合现代汉语，也不误指某一人的房屋。
- source_word: וַאֲדֹנִירָם
  choice: 亚多尼兰
  rationale: 按希伯来语人名音译。
- source_word: עַל הַמַּס
  choice: 主管服劳役的人
  rationale: מַס 在本段语境指国家征派的强制劳役；该表达既保留强制征调的制度背景，也自然说明亚多尼兰所主管的对象。
