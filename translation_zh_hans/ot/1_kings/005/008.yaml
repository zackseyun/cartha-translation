base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/008.yaml
  text: And the barley and the straw for the horses and the steeds were brought to the place where each man was[b][a], according to his duty.
translation:
  language: zh_hans
  text: 他们把供马匹和骏马[a]用的大麦和秸秆，送到各人所在的地方[b]；各人都按规定办理。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “骏马”所译的希伯来词也可能泛指精选的骑乘牲畜，或特指骡子、战车马。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“有一个人在那里的地方”；这里的“人”是分配性用法，指每一个负责的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַשְּׂעֹרִים
  choice: 大麦
  rationale: שְׂעֹרִים在本节指用作牲畜饲料的大麦；中文直接译作“大麦”自然准确。
- source_word: וְהַתֶּבֶן
  choice: 草料
  rationale: תֶּבֶן通常指禾秆、麦秸；本节与大麦并列作为牲畜饲料，译作“草料”较符合现代汉语语境，同时不限定具体作物。
- source_word: לַסּוּסִים
  choice: 喂马
  rationale: 介词ל表示这些供应物是给马匹使用的；在中文中以“喂马”表达用途最自然。
- source_word: וְלָרָכֶשׁ
  choice: 和骏马
  rationale: רֶכֶשׁ指王室或军旅环境中的优良骑乘牲畜，但具体类别不完全确定；正文用“骏马”保持与普通马匹的区别，脚注交代其他可能。
- source_word: יָבִיאוּ
  choice: 他们……送到
  rationale: 希伯来文是第三人称阳性复数主动式，直译为“他们送来/送到”；保留主动语态，不补明原文未明说的具体人员身份。
- source_word: אֶל־הַמָּקוֹם אֲשֶׁר יִהְיֶה שָּׁם אִישׁ
  choice: 送到各人所在的地方
  rationale: אִישׁ在这里作分配性单数，表示各个负责供应的人；“各人所在的地方”既保留这种结构，也符合现代汉语表达。
- source_word: כְּמִשְׁפָּטוֹ
  choice: 各按所定的份例
  rationale: מִשְׁפָּט在行政供应语境中指规定、定额或应尽的份额，而非司法判决；“所定的份例”保留规定与配额两方面的含义。
theological_decisions: []
