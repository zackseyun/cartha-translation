  text: וַ/יִּשְׁלַ֤ח חִירָם֙ אֶל שְׁלֹמֹ֣ה לֵ/אמֹ֔ר שָׁמַ֕עְתִּי אֵ֥ת אֲשֶׁר שָׁלַ֖חְתָּ אֵלָ֑/י אֲנִ֤י אֶֽעֱשֶׂה֙ אֶת כָּל חֶפְצְ/ךָ֔ בַּ/עֲצֵ֥י אֲרָזִ֖ים וּ/בַ/עֲצֵ֥י בְרוֹשִֽׁים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/022.yaml
  text: Then Hiram sent to Solomon[a], saying, “I have heard what you sent to me[b]. I will do all your desire concerning cedar timber and cypress timber.”
translation:
  language: zh_hans
  text: 于是，希兰派人给所罗门传话说：“你传给我的话，我已经听到了。[a] 关于香柏木和柏木[b]，凡你所愿的，我都会照办。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“你送到我这里的事（或东西）”；也可理解为“你向我提出的请求”。
    reason: 保留原文中“送来之物”究竟指消息内容还是请求的语义空间。
  - marker: b
    text: “柏木”所译的希伯来词所指树种不能确定，也有人译作“圆柏木”或“冷杉木”。
    reason: 原植物名称的确切物种存在词义与鉴定上的不确定性。
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: 于是……派人……传话
  rationale: 连续式叙事动词推进情节；“于是”自然表达事件次序。结合“给所罗门”和“说”，中文用“派人……传话”明确希兰差遣使者送信的动作，而不把它误解为希兰亲自前往。
- source_word: חִירָם
  choice: 希兰
  rationale: 采用现代中文圣经中通行且易于辨识的人名译法。
- source_word: לֵאמֹר
  choice: 说
  rationale: 按希伯来语常用引语公式，以自然中文引出直接引语。
- source_word: שָׁמַעְתִּי
  choice: 我已经听到了
  rationale: 完成式表示信息已经收到并知悉；“已经听到了”符合希兰即时回应来信的语境。
- source_word: אֵת אֲשֶׁר שָׁלַחְתָּ אֵלַי
  choice: 你传给我的话
  rationale: 保留“你送来/传来之事”的基本意象，同时以现代中文说明所指是信息，不直接解释成“你的请求”；相关歧义收入脚注。
- source_word: אֶעֱשֶׂה
  choice: 我都会照办
  rationale: עָשָׂה本义宽泛，为“做、实行”；在回应对方意愿的中文语境中，“照办”自然表达履行承诺，又不具体限定履行方式。
- source_word: כָּל חֶפְצְךָ
  choice: 凡你所愿的
  rationale: חֵפֶץ可指愿望、意愿或所喜悦之事；此译文保持较庄重的语体，并避免口语化的“你想要什么”。
- source_word: בַּעֲצֵי אֲרָזִים
  choice: 关于香柏木
  rationale: 介词ב在此表示承诺所涉及的事项；עֲצֵי在建筑材料语境中译作“木”比“树”合适。
- source_word: וּבַעֲצֵי בְרוֹשִׁים
  choice: 和柏木
  rationale: בְּרוֹשִׁים所指树种不能确定；正文采用中文较通行的“柏木”，并在脚注保留其他可能。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“派人给……传话”使叙事动作在中文中清楚自然；直接引语中的“凡你所愿的，我都会照办”兼顾原文的概括性承诺与现代可读性。脚注标记分别紧跟存在词义歧义的短语和树种名称。
