lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: 于是……派人去见
  rationale: 该叙事性连续式动词推进下一项行动。“于是”自然表达先后关系；结合后面的 אֶל 和说话内容，“派人去见”比直译“差遣到”更符合现代汉语。
- source_word: שְׁלֹמֹה
  choice: 所罗门
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: אֶל
  choice: 去见
  rationale: 该介词指明行动所朝向的对象；在“派人”这一汉语结构中译作“去见”，自然表达信息送达的对象。
- source_word: חִירָם
  choice: 希兰
  rationale: 按本节希伯来文 חִירָם 采用现代中文通行译名“希兰”；其他经文有不同形式“户兰”。
- source_word: לֵאמֹר
  choice: 说
  rationale: 该不定式用于引出随后直接引语；现代汉语以“说”简洁自然地保留其引语导入功能。
