  text: וַ/יִּתֵּן֩ אֱלֹהִ֨ים חָכְמָ֧ה לִ/שְׁלֹמֹ֛ה וּ/תְבוּנָ֖ה הַרְבֵּ֣ה מְאֹ֑ד וְ/רֹ֣חַב לֵ֔ב כַּ/ח֕וֹל אֲשֶׁ֖ר עַל שְׂפַ֥ת הַ/יָּֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/009.yaml
  text: And God gave Solomon wisdom and very great understanding[a], and breadth of heart like the sand that is on the seashore.
translation:
  language: zh_hans
  text: 上帝赐给所罗门智慧、极大的悟性，以及像海边的沙那样宽广的心智[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“心的宽广”。希伯来语的“心”也可指人的思想、理解力或内在心智。
    reason: 说明希伯来语习语，并保留较字面的译法。
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: 赐给
  rationale: נתן的基本义是“给”；在上帝赐予智慧的语境中，“赐给”自然、庄重，又不增添额外神学含义。
- source_word: אֱלֹהִים
  choice: 上帝
  rationale: 此处虽为复数形态，却与单数动词搭配，指以色列的上帝。
- source_word: חָכְמָה
  choice: 智慧
  rationale: 准确传达חָכְמָה在所罗门叙事中兼具判断、治理和实践能力的宽广含义。
- source_word: לִשְׁלֹמֹה
  choice: 所罗门
  rationale: 采用现代汉语圣经传统中通行的人名译法。
- source_word: וּתְבוּנָה
  choice: 悟性
  rationale: תְבוּנָה可指理解力、洞察力；“悟性”与“智慧”并列自然，也保留其较宽的语义范围。
- source_word: הַרְבֵּה מְאֹד
  choice: 极大的
  rationale: 两个程度成分共同加强语气；“极大的”简洁地表达程度非常高。
- source_word: וְרֹחַב לֵב
  choice: 广博的心智
  rationale: 字面为“心的宽广”。希伯来语לֵב在此涉及思想、理解和内在容量；“广博的心智”既保留宽广意象，也避免现代读者只理解为情感或气量。
- source_word: כַּחוֹל
  choice: 如同……沙一样
  rationale: 忠实表达כְּ引出的明喻，并以自然的现代汉语句式呈现。
- source_word: אֲשֶׁר עַל שְׂפַת הַיָּם
  choice: 海边的
  rationale: שְׂפַת הַיָּם字面为“海的边缘”，现代汉语以“海边”表达最自然准确。
theological_decisions:
- issue: וְרֹחַב לֵב中的人论习语
  choice: 正文译作“广博的心智”
  alternative: “宽广的心”或“宽广的心胸”
  rationale: 希伯来语“心”可指思想、理解和内在认知能力，并非仅指情感。“心智”能帮助现代读者把握此处与智慧、悟性并列的含义；脚注保留字面形式及其语义张力。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。正文保留“宽广”这一空间性比喻，并让它与“海边的沙”顺畅衔接；不把明喻明确解释为“无边无际”或“不可胜数”，以免消解原文可能兼具的广阔与众多意象。
