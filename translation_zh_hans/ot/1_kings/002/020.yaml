base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/020.yaml
  text: She said, “I am asking one small request of you; do not turn away my face.” And the king said to her, “Ask, my mother, for I will not turn away your face.”
translation:
  language: zh_hans
  text: 她说：“我向你求一件小事，请不要拒绝我。”王对她说：“你只管求，母亲，我不会拒绝你。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שְׁאֵלָה אַחַת קְטַנָּה
  choice: 一件小事
  rationale: 原文直译为“一个小请求”；结合汉语请求场景，用“有一件小事求你”自然表达请求虽小的语气。
- source_word: אַל תָּשֶׁב אֶת פָּנָי
  choice: 请不要驳我的情面
  rationale: 希伯来语字面为“不要使我的脸转回”，是请求不要被拒绝的惯用表达；“驳我的情面”既保留“脸面”意象，也让现代读者明白其含义。
- source_word: שַׁאֲלִי אִמִּי
  choice: 母亲，请说吧
  rationale: 祈使式可指“求吧、说吧”；此处承接对方要提出请求，译作“请说吧”符合自然汉语，并保留敬称“母亲”。
- source_word: לֹא אָשִׁיב אֶת פָּנָיִךְ
  choice: 我不会驳你的情面
  rationale: 与前句对应，保持原文重复和脸面意象，不简化为单纯的“不会拒绝你”。
