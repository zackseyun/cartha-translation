base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/019.yaml
  text: So Bathsheba went to King Solomon to speak to him on behalf of Adonijah. The king rose to meet her and bowed down before her. Then he sat on his throne and had a throne placed for the king's mother, and she sat at his right hand.
translation:
  language: zh_hans
  text: 于是，拔示巴到所罗门王那里，要就亚多尼雅的事同王说话。王起身迎接她，向她下拜。随后，王坐在自己的宝座上，为王母安设了一座宝座；她便坐在王的右边。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עַל אֲדֹנִיָּהוּ
  choice: 为亚多尼雅……说情
  rationale: 介词 עַל 在此可表示“关于”或“为了、代表”；结合拔示巴此行是替亚多尼雅提出请求的语境，用“为……说情”自然表达其代求性质。
- source_word: וַיִּשְׁתַּחוּ לָהּ
  choice: 向她下拜
  rationale: 该动词表示俯伏、下拜；这里描写君王对母亲的礼敬，不必解释为敬拜。
- source_word: כִּסֵּא
  choice: 宝座
  rationale: 本节两次使用同一希伯来词，分别指所罗门和王母的座位；两处均译作“宝座”，保留词语呼应及王室尊荣。
- source_word: לְאֵם הַמֶּלֶךְ
  choice: 为王母
  rationale: 直译为“为王的母亲”；“王母”是简洁、庄重且符合中文王室语境的表达。
- source_word: לִימִינוֹ
  choice: 在王的右边
  rationale: 明确代词所指，保留右边这一尊荣位置的空间描写，不额外解释其象征意义。
theological_decisions:
- issue: 所罗门向拔示巴下拜的性质
  choice: 按动作本义译为“向她下拜”
  alternative: 译为“向她鞠躬致敬”或解释为宗教敬拜
  rationale: 原文只陈述俯伏礼敬的动作；保留“下拜”既忠实于措辞，也不将宫廷礼仪误定为宗教敬拜。
- issue: 拔示巴谈论亚多尼雅还是替他求情
  choice: 译为“为亚多尼雅……说情”
  alternative: 译为“谈论亚多尼雅”或“关于亚多尼雅同王说话”
  rationale: עַל 本身具有一定幅度，但叙事语境清楚表明她是受托提出请求；“说情”保留谈话目的，而不加入请求是否正当的神学判断。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。将连续的希伯来语并列句适度分句，以符合普通话节奏；保留“王母”“宝座”“右边”等王室用语及原文动作顺序。
