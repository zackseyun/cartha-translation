base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/022.yaml
  text: King Solomon answered and said to his mother[a], “Why are you asking for Abishag the Shunammite for Adonijah? Ask for the kingship for him as well, since he is my older brother—and for him, for Abiathar the priest, and for Joab son of Zeruiah!”
translation:
  language: zh_hans
  text: 所罗门王回答母亲说：“你为什么替亚多尼雅求书念女子亚比煞呢？也把王权[a]替他、替祭司亚比亚他和洗鲁雅的儿子约押求来吧！因为他是我哥哥。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“王国”或“王位”。希伯来语此词可泛指王的统治权；在这里，所罗门以此讽刺地指出这项请求所带有的王朝权力含义。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן הַמֶּלֶךְ שְׁלֹמֹה וַיֹּאמֶר לְאִמּוֹ
  choice: 所罗门王回答母亲说
  rationale: 保留希伯来叙事中“回答……说”的表达，同时按现代汉语自然排列王号和人名；不从上下文补出“拔示巴”。
- source_word: אֲבִישַׁג הַשֻּׁנַמִּית
  choice: 书念女子亚比煞
  rationale: 将族属词译为“书念女子”，既表明她来自书念，也采用现代中文圣经人名的通行形式。
- source_word: וְשַׁאֲלִי לוֹ אֶת הַמְּלוּכָה
  choice: 也为他求王位吧
  rationale: מְלוּכָה 在这里指君王身份和统治权，而非领土；“王位”自然传达所罗门所指出的王朝政治含义。
- source_word: כִּי הוּא אָחִי הַגָּדוֹל מִמֶּנִּי
  choice: 因为他是我的哥哥
  rationale: 自然表达年龄和出生次序上的年长关系，不把希伯来比较结构生硬直译。
- source_word: וְלוֹ וּלְאֶבְיָתָר הַכֹּהֵן וּלְיוֹאָב בֶּן צְרוּיָה
  choice: ——为他，也为亚比亚他祭司和洗鲁雅的儿子约押求吧
  rationale: 原文是承接“求”的省略结构；中文补出末尾的“求吧”，使句意完整，同时用破折号保留突转和讽刺性的高潮。
theological_decisions:
- issue: 为亚比煞求婚所具有的王权含义
  choice: 译作“也为他求王位吧”
  alternative: 译作“也为他求国吧”或“也为他求王权吧”
  rationale: 原文明确以 הַמְּלוּכָה 点出这项请求的政治和王朝含义。“王位”在现代中文中清楚自然，又不额外解释所罗门的判断是否正确。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。保留所罗门反问、讽刺和逐步升级的语气；不为原文未明说的政治背景另加说明。
