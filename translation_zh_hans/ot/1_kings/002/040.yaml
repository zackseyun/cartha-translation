base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/040.yaml
  text: Then Shimei arose[a], saddled his donkey, and went to Gath, to Achish, to look for his slaves. Shimei went and brought his slaves back from Gath.
translation:
  language: zh_hans
  text: 示每起身，给驴备上鞍，前往迦特，到亚吉那里寻找他的奴隶[a]。示每去了，把奴隶从迦特带了回来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“仆人”。希伯来语עֲבָדָיו既可指仆人，也可指奴隶；这里的人从主人那里逃走，又被追回，因此正文译作“奴隶”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: 就起来
  rationale: קום在叙事中表示“起来、起身”；“就起来”自然承接上文，也保留连续动作的语气。
- source_word: וַיַּחֲבֹשׁ אֶת חֲמֹרוֹ
  choice: 给驴备上鞍
  rationale: חבש与驴连用，在出行语境中指给牲口上鞍、备妥；此译准确而符合现代汉语习惯。
- source_word: גַּתָה
  choice: 前往迦特
  rationale: 词尾的方向性־ה表示朝向迦特移动；译为“前往迦特”清楚自然。
- source_word: אָכִישׁ
  choice: 亚吉
  rationale: 按现代中文圣经人名的通行译法音译。
- source_word: לְבַקֵּשׁ
  choice: 寻找
  rationale: בקש在此为具体寻找逃走之人的行动；“寻找”既自然，又不带不必要的古雅色彩。
- source_word: עֲבָדָיו
  choice: 自己的奴仆
  rationale: עבד可指仆人或奴隶。上下文涉及逃走后被主人追回的人，受辖制的身份较突出；“奴仆”既反映这种身份，也保留词义范围，另以脚注说明可译“仆人”。
- source_word: וַיָּבֵא אֶת עֲבָדָיו מִגַּת
  choice: 把奴仆从迦特带了回来
  rationale: 使役形态的בוא意为“带来”。“回来”虽非单独对应某个希伯来词，却自然表达从迦特追回并返回这一叙事情境。
