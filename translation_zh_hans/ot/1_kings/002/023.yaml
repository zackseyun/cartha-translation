revisions:
- from: 于是，所罗门王指着耶和华[a]起誓说：“愿上帝这样惩罚我，并且加倍惩罚我！因为亚多尼雅说了这话，就使自己的性命难保[b]。”
  to: 于是，所罗门王指着耶和华[a]起誓说：“愿上帝这样惩罚我，并且更加严厉地惩罚我！因为亚多尼雅说了这话，已把自己的性命置于险境[b]。”
