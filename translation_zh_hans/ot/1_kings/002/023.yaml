  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יִּשָּׁבַע֙ הַ/מֶּ֣לֶךְ שְׁלֹמֹ֔ה בַּֽ/יהוָ֖ה לֵ/אמֹ֑ר כֹּ֣ה יַֽעֲשֶׂה לִּ֤/י אֱלֹהִים֙ וְ/כֹ֣ה יוֹסִ֔יף כִּ֣י בְ/נַפְשׁ֔/וֹ דִּבֶּר֙ אֲדֹ֣נִיָּ֔הוּ אֶת הַ/דָּבָ֖ר הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/023.yaml
  text: Then King Solomon swore by Yahweh[a], saying, “May God do so to me, and more also[b], for Adonijah has spoken this word against his own life.”
translation:
  language: zh_hans
  text: 于是，所罗门王指着耶和华[a]起誓说：“愿上帝这样惩罚我，并且更加严厉地惩罚我！因为亚多尼雅说了这话，已把自己的性命置于险境[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “耶和华”所译的希伯来文神名是 יהוה（YHWH）；其古代准确读音不能完全确定，也常拟音为“雅威”。
    reason: 说明神名的原文形式及读音上的不确定性。
  - marker: b
    text: 原文直译近于“亚多尼雅是以／针对自己的性命说了这话”，意思是他这话使自己的性命陷入危险，甚至可能因此丧命。
    reason: 说明希伯来习语，并保留其可能表示危及或赔上性命的语义范围。
lexical_decisions:
- source_word: וַיִּשָּׁבַע
  choice: 起誓
  rationale: 该动词表示发誓或立誓；“起誓”符合现代汉语叙事语体，也保留其正式意味。
- source_word: בַּיהוָה
  choice: 指着耶和华
  rationale: 介词 בְ 与神名连用，标明起誓所凭借的对象；汉语惯用“指着……起誓”。
- source_word: כֹּה יַעֲשֶׂה לִּי אֱלֹהִים וְכֹה יוֹסִיף
  choice: 愿上帝这样惩罚我，并且加倍惩罚我
  rationale: 这是固定的自咒式誓言。原文没有明说所施之事为何，语境表明是惩罚；译文保留“这样……并且加倍”的公式结构，同时使现代读者明白其咒诅意味。
- source_word: אֱלֹהִים
  choice: 上帝
  rationale: 此处虽有复数词形，却在誓言公式中单数地指上帝。
- source_word: כִּי
  choice: 因为
  rationale: 这里承接誓言并说明所罗门如此起誓的原因，宜按因果或强调用法理解，而不是补入原文没有的否定条件。
- source_word: בְנַפְשׁוֹ
  choice: 使自己的性命难保
  rationale: 字面为“以／针对自己的性命”，在此表示亚多尼雅所说的话危及其生命。该译法保留后果与司法性的语气，又符合自然汉语。
- source_word: דִּבֶּר ... אֶת־הַדָּבָר הַזֶּה
  choice: 说了这话
  rationale: 原文是“说了这话／这件事”；简洁译法在汉语中自然，并保留对具体言论的指称。
- source_word: אֲדֹנִיָּהוּ
  choice: 亚多尼雅
  rationale: 采用现代中文圣经人名的通行音译。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 耶和华
  alternative: 雅威；上主
  rationale: 正文采用中文读者熟悉且明确作为专名的“耶和华”，不以称号取代原文神名；脚注说明希伯来文形式及常见的另一拟音，以免把其确切古代读音说成毫无争议。
- issue: כִּי 在誓言后的句法功能
  choice: 因果性的“因为”
  alternative: 条件性的“如果”；强调性的“确实”
  rationale: 上下文中所罗门判定亚多尼雅的请求已使他丧命，因此这里最自然地说明起誓的理由。原文没有否定词，不应译成“如果亚多尼雅没有说……”。
- issue: בְנַפְשׁוֹ 所表达的责任与后果
  choice: 这话使亚多尼雅自己的性命陷入危险
  alternative: 他以自己的性命担保这话；他已经因此丧命
  rationale: 该短语含有因自己的话而危及或赔上性命之意，但本节尚未叙述执行结果，故避免提前写成已经死亡，也不把它误解为单纯的誓言担保。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“指着……起誓”保留正式叙事感；誓言公式略作显化，以“惩罚”表达原文含而未言的自咒内容。“性命难保”通俗易懂，但仍有严肃的司法和死亡威胁意味。
