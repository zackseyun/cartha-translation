  text: וַ/יֹּ֗אמֶר אַ֤תְּ יָדַ֨עַתְּ֙ כִּי לִ/י֙ הָיְתָ֣ה הַ/מְּלוּכָ֔ה וְ/עָלַ֞/י שָׂ֧מוּ כָֽל יִשְׂרָאֵ֛ל פְּנֵי/הֶ֖ם לִ/מְלֹ֑ךְ וַ/תִּסֹּ֤ב הַ/מְּלוּכָה֙ וַ/תְּהִ֣י לְ/אָחִ֔/י כִּ֥י מֵ/יְהוָ֖ה הָ֥יְתָה לּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/015.yaml
  text: And he said[a], “You know that the kingdom was mine, and that all Israel had set their faces on me to reign; but the kingdom turned and became my brother’s[b], for it was his from Yahweh.”
translation:
  language: zh_hans
  text: 他又说：“你知道，王位原是我的，全以色列都指望我作王；但王位转了，归给我兄弟，因为这王位归他，是出于雅威[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因为这王位是从雅威而归给他的。”原文没有明确使用“赐给”一词。
    reason: alternative_reading
lexical_decisions:
- source_word: הַמְּלוּכָה
  choice: 王位
  rationale: 此处指君王的职位和统治权；“王位”比“国度”更贴合王位继承的语境。
- source_word: וְעָלַי שָׂמוּ כָל־יִשְׂרָאֵל פְּנֵיהֶם
  choice: 全以色列也都属望我
  rationale: 希伯来语直译为“把脸转向我”，表达众人期待或认定他作王；“属望我”自然保留期待之意。
- source_word: לִמְלֹךְ
  choice: 作王
  rationale: 在继承王位的语境中，表示成为并担任君王；“作王”简洁自然。
- source_word: וַתִּסֹּב
  choice: 转归
  rationale: 保留王位发生转向、转移的意象，又符合现代汉语表达。
- source_word: וַתְּהִי לְאָחִי
  choice: 归了我兄弟
  rationale: 表达王位转到其兄弟所罗门手中，不额外说明转移方式。
- source_word: כִּי מֵיְהוָה הָיְתָה לּוֹ
  choice: 因为这是雅威赐给他的
  rationale: 表达王位由雅威而来；正文采用自然汉语，而脚注保留希伯来语未明说“赐给”的较形式对应译法。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见音译呈现四字神名，保留其专名性质，不以称号替代。
- source_word: אָחִי
  choice: 我兄弟
  rationale: 按亚多尼雅的视角直译亲属称谓，所指为所罗门。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”较贴近通常重构的读音，也明确呈现专名。
- issue: 末句是否明说神“赐给”王位
  choice: 正文译为“这是雅威赐给他的”，并以脚注保留较直译表达
  alternative: “因为这王位是从雅威而来、归给他的”
  rationale: 希伯来语没有明确的“赐”字，但说明王位从雅威而来并归于所罗门。正文以自然汉语表达其含义，脚注提示原文较含蓄，避免掩盖句法上的张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“属望”表达公众期待，略带正式色彩但仍通顺；“王位转归”保留原文的转向意象。正文中的脚注标记[a]与脚注相对应。
