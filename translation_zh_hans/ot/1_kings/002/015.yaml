revisions:
- from: 他又说：“你知道，王位本来是我的，全以色列也都属望我作王；可是王位转归了我兄弟，因为这是雅威赐给他的[a]。”
  to: 他又说：“你知道，王位原是我的，全以色列都指望我作王；但王位转了，归给我兄弟，因为这王位归他，是出于雅威[a]。”
  rationale: 修订末句以避免将神的来源性明确化为原文未使用的“赐给”动作，同时保留“王位归于兄弟”和“出于雅威”两个语义要点。将“属望”改为“指望”，使译文更符合现代标准汉语；脚注锚点仍置于末句，并保留原文句法的另一种较形式对应译法。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T05:50:32Z'
review_pass:
  verdict: revise
  source_fidelity: 末句希伯来文仅说王位“从雅威而归于他／成为他的”，并未明说雅威“赐给”他。正文的“赐给”虽可表达推论，却比原文的句法更明确；宜改为保留其来源与归属。其余各句忠实反映王位原属亚多尼雅、以色列人的期待，以及王位转归其兄弟的陈述。
  naturalness: “属望我”在现代标准汉语中略显生僻，且搭配不如“指望我”自然。“王位转归了我兄弟”可理解，但加入停顿并用“归给我兄弟”更清楚地保留原文先“转向”后“归属”的表达。
  terminology: “王位”“作王”“雅威”均合乎本段政治继承与神名的语境。“我兄弟”保留原文亲属称谓，且不应在正文补出“所罗门”。
  issues:
  - severity: medium
    issue: “这是雅威赐给他的”补入原文未明说的“赐给”动作。
    rationale: כִּי מֵיְהוָה הָיְתָה לּוֹ 直陈王位从雅威而归于/成为他所有，并无“给、赐”的动词。应以“归他，是出于雅威”等措辞保存原文的含蓄性。
  - severity: low
    issue: “属望我”在现代汉语中较不自然。
    rationale: 该词较少见；“全以色列都指望我作王”自然表达“众以色列人都把脸转向我，要我作王”的期待/拥立意涵。
  revised_text: 他又说：“你知道，王位原是我的，全以色列都指望我作王；但王位转了，归给我兄弟，因为这王位归他，是出于雅威[a]。”
  revised_footnotes:
  - marker: a
    text: 或译：“因为这王位是从雅威而归给他的。”原文没有明确使用“赐给”一词。
    reason: alternative_reading
  revision_rationale: 修订末句以避免将神的来源性明确化为原文未使用的“赐给”动作，同时保留“王位归于兄弟”和“出于雅威”两个语义要点。将“属望”改为“指望”，使译文更符合现代标准汉语；脚注锚点仍置于末句，并保留原文句法的另一种较形式对应译法。
