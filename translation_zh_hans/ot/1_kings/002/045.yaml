  text: וְ/הַ/מֶּ֥לֶךְ שְׁלֹמֹ֖ה בָּר֑וּךְ וְ/כִסֵּ֣א דָוִ֗ד יִהְיֶ֥ה נָכ֛וֹן לִ/פְנֵ֥י יְהוָ֖ה עַד עוֹלָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/045.yaml
  text: But King Solomon will be blessed[a], and the throne of David will be established before Yahweh forever.
translation:
  language: zh_hans
  text: 但所罗门王必蒙福[a]，大卫的王位必在雅威面前永远稳固。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“所罗门王是蒙福的。”希伯来语的这个无动词谓语可理解为对现状的宣告；不过，上下文也支持主文所采用的未来指向。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/הַ/מֶּלֶךְ שְׁלֹמֹה
  choice: 但所罗门王
  rationale: וְ 在此承接上文，并将示每所受的审判与所罗门所得的福分相对照，因此译为“但”；专名与王号按现代汉语习惯排列为“所罗门王”。
- source_word: בָּרוּךְ
  choice: 必蒙福
  rationale: 该词是表示“蒙福”的被动分词或谓语形容词。无动词句本身也可理解为现在状态，但与下句的未完成式及本段宣告语境相连时，“必蒙福”自然传达其面向未来的意味。
- source_word: וְ/כִסֵּא דָוִד
  choice: 大卫的王位
  rationale: כִּסֵּא 原指“座位、宝座”，在王朝语境中指王权或王位；“大卫的王位”既符合现代汉语，也保留其王朝含义。
- source_word: יִהְיֶה נָכוֹן
  choice: 必……稳固
  rationale: היה 与 נכון 的组合表示被确立、稳定或坚固。译作“必……稳固”贴合王位语境，同时避免添加原文没有明说的施事者。
- source_word: לִ/פְנֵי יְהוָה
  choice: 在雅威面前
  rationale: לִפְנֵי 表示“在……面前、在……临在中”；采用“在雅威面前”保留原文的空间性与关系性表达。
- source_word: יְהוָה
  choice: 雅威
  rationale: 直接音译四字神名，以区别于称号“主”，并保留原文所用的盟约之名。
- source_word: עַד עוֹלָם
  choice: 永远
  rationale: 该短语表示延续到无尽的将来；“永远”是现代汉语中简明而庄重的对应表达。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名。译作“雅威”保留专名性质，不将其改换为称号，也不依赖传统混合读音。
- issue: בָּרוּךְ 的时间指向
  choice: 面向未来的“必蒙福”
  alternative: 现在状态的“是蒙福的”
  rationale: 希伯来语无动词谓语可表达当前状态；但这里与随后“必……稳固”的未完成式并列，又处于所罗门对未来结果的宣告中，主文采用未来向表达，同时以脚注保留现在时理解。
- issue: 大卫王位的稳固
  choice: 必在雅威面前永远稳固
  alternative: 必在雅威面前永远被确立
  rationale: נכון 可兼有“稳固”与“被确立”的意味。“稳固”既保留状态含义，也不额外指明由谁执行确立；“在雅威面前”则完整保留其神学关系框架。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“蒙福”“王位”“稳固”属于常用圣经语体，但不过分古雅；句法简洁，并保留原文两分句的平行结构与“在雅威面前”的表达。
