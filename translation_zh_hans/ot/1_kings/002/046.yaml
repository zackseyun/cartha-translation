  text: וַ/יְצַ֣ו הַ/מֶּ֗לֶךְ אֶת בְּנָיָ֨הוּ֙ בֶּן יְה֣וֹיָדָ֔ע וַ/יֵּצֵ֕א וַ/יִּפְגַּע בּ֖/וֹ וַ/יָּמֹ֑ת וְ/הַ/מַּמְלָכָ֥ה נָכ֖וֹנָה בְּ/יַד שְׁלֹמֹֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/046.yaml
  text: Then the king commanded Benaiah son of Jehoiada[a], and he went out and struck him down, and he died. So the kingdom was established in the hand of Solomon.
translation:
  language: zh_hans
  text: 王就吩咐耶何耶大的儿子比拿雅，比拿雅便出去，击打示每，示每就死了。这样，国权就在所罗门手中得以坚立[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“所罗门的国权就得以坚立”或“国权牢牢掌握在所罗门手中”。希伯来语“在……手中”表示掌控或拥有。
    reason: 说明希伯来语“在……手中”的习语，并给出不保留该意象的可行译法。
lexical_decisions:
- source_word: וַיְצַו הַמֶּלֶךְ
  choice: 王就吩咐
  rationale: צוה表示发出命令；“吩咐”自然地体现君王的权威，叙事连接词译作“就”，承接上文行动。
- source_word: בְּנָיָהוּ בֶן־יְהוֹיָדָע
  choice: 耶何耶大的儿子比拿雅
  rationale: 采用现代中文圣经语境中通行的人名音译，并以自然汉语表达父子关系。
- source_word: וַיֵּצֵא
  choice: 比拿雅便出去
  rationale: יצא直译为“出去”；补出主语可避免现代汉语中连续男性代词所造成的指代含混。
- source_word: וַיִּפְגַּע־בּוֹ
  choice: 将示每击倒
  rationale: פגע与介词ב连用，在此处表示袭击或击打。译作“击倒”保留暴力行动，同时让下一句“就死了”明确交代结果；补出上下文所指的示每，使中文指代清楚。
- source_word: וַיָּמֹת
  choice: 示每就死了
  rationale: 直接保留原文明确陈述的死亡结果；重复姓名符合汉语清晰表达的需要。
- source_word: וְהַמַּמְלָכָה נָכוֹנָה
  choice: 于是，国权稳固
  rationale: ממלכה在这里侧重王权、统治，译作“国权”比单指疆域的“王国”更贴合语境；כון的尼法勒形表示得以确立、稳固。“于是”体现此句总结前文结果的作用。
- source_word: בְּיַד שְׁלֹמֹה
  choice: 在所罗门手中
  rationale: 保留希伯来语“在……手中”的形象，同时现代汉语也能自然表达掌控或拥有权柄。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。为避免连续男性代词造成歧义，按上下文补出“比拿雅”和“示每”；结尾保留“在所罗门手中”的希伯来语意象，并以脚注说明其含义。
