    rationale: 现代汉语通常说某权柄“在某人手中得以坚立／稳固”，而非“稳固在某人手中”。
  - severity: low
    issue: “将示每击倒”语气和动作结果的衔接稍弱。
    rationale: “击倒”通常只表示倒地，未必自然导向死亡；原文仍将攻击动作和死亡结果分开陈述，宜用较中性的“击打”，随后保留“死了”。
