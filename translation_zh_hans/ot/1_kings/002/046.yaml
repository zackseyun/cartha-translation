  source_fidelity: 译文准确交代了王命令比拿雅、比拿雅出去攻击示每、示每死亡，以及所罗门的统治得以稳固。末句的“国权稳固在所罗门手中”虽可理解，但中文搭配略生硬；改为“国权就在所罗门手中得以坚立”可更自然地表达נָכוֹנָה及“在……手中”的控制／权柄意象。
  naturalness: 人名补出清楚，符合现代汉语叙事需要。首句分号不如逗号自然；“将示每击倒”也略显口语且“击倒”未必自然引出死亡。改用“击打示每，示每就死了”保留原文行动与结果的两个叙事步骤。
  terminology: “耶何耶大、比拿雅、示每、所罗门”均采用通行的中文圣经人名译法。“国权”可表达此处王权／统治，保留；“得以坚立”恰当表达希伯来语被动的“被确立、稳固”。
