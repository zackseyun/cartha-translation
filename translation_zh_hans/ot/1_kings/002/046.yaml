  to: 王就吩咐耶何耶大的儿子比拿雅，比拿雅便出去，击打示每，示每就死了。这样，国权就在所罗门手中得以坚立[a]。
  rationale: 仅作措辞和标点调整，以提升现代标准汉语的自然度，同时保留原文攻击后死亡的叙事次序，以及王权在所罗门掌控下得以确立的意象。
