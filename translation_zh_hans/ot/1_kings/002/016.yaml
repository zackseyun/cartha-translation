  text: And now I am asking one request of you; do not turn away my face. And she said to him[a], “Speak.”
translation:
  language: zh_hans
  text: 现在，我有一个请求要向你提出；请不要拒绝我。[a]她对他说：“你说吧。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译可作“不要使我的脸转回去”。这是希伯来语习语，意思是“不要拒绝我”或“不要驳回我的请求”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: 现在
  rationale: 作为话语标记，引出谈话的下一步；现代汉语中“现在”自然地表达此处的承接和转折作用，不必机械译出连接词 וְ。
- source_word: שְׁאֵלָה אַחַת
  choice: 一件事
  rationale: שְׁאֵלָה 指请求或所求之事；结合后面的“求你”，“有一件事求你”既保留数量限定，也符合现代汉语表达。
- source_word: אָנֹכִי שֹׁאֵל מֵאִתָּךְ
  choice: 我有……求你
  rationale: 分词 שֹׁאֵל 配合独立代词 אָנֹכִי，表达当下提出请求；汉语用“我有一件事求你”简洁自然。
- source_word: אַל תָּשִׁיבִי אֶת פָּנָי
  choice: 请不要驳回我的请求
  rationale: 原文直译为“不要使我的脸返回”，是请求不被拒绝的希伯来语习语。正文采用自然汉语表达其语用含义，并在脚注保留原文意象。
- source_word: וַתֹּאמֶר אֵלָיו
  choice: 她对他说
  rationale: 忠实表达阴性主语和男性受话者；叙事连接在汉语中可由语序自然体现。
- source_word: דַּבֵּר
  choice: 你说吧
  rationale: 命令式在此是准许对方提出请求；“你说吧”比生硬的“说”更符合现代汉语对话，同时保持简洁。
