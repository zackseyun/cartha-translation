source:
  edition: WLC
  text: וְ/לִ/בְנֵ֨י בַרְזִלַּ֤י הַ/גִּלְעָדִי֙ תַּֽעֲשֶׂה חֶ֔סֶד וְ/הָי֖וּ בְּ/אֹכְלֵ֣י שֻׁלְחָנֶ֑/ךָ כִּי כֵן֙ קָרְב֣וּ אֵלַ֔/י בְּ/בָרְחִ֕/י מִ/פְּנֵ֖י אַבְשָׁל֥וֹם אָחִֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/007.yaml
  text: But show kindness to the sons of Barzillai the Gileadite[a], and let them be among those who eat at your table[c][b], for this is how they came near to me when I fled from Absalom your brother.
translation:
  language: zh_hans
  text: 至于基列人巴西莱的儿子们，你要以恩慈和忠诚待他们[a]，让他们常在你的席上吃饭[b]；因为我躲避你哥哥押沙龙的时候，他们也是这样亲近我[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“向他们施慈爱”或“以忠诚待他们”。希伯来语此语指以恩慈、忠诚相待，不只是心里的好感。
    reason: lexical_alternative
  - marker: b
    text: 直译“让他们在吃你桌子的人中”。这是指持续得到君王供养和恩待的说法。
    reason: cultural_note
  - marker: c
    text: 或译“他们曾来到我这里”或“他们曾站在我这一边”。希伯来语直译为“亲近我”，在这里暗示大卫逃亡时他们前来支持他。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלִבְנֵי
  choice: 至于……的众子
  rationale: וְ承接前文，同时由对约押的处置转到对巴西莱众子的善待；“至于”自然标示话题转换。בְּנֵי在此指巴西莱的儿子或男性后裔，译作“众子”保留其范围。
- source_word: בַרְזִלַּי הַגִּלְעָדִי
  choice: 基列人巴西莱
  rationale: 采用现代中文圣经语境中通行的人名、地名音译，并把族地称谓הַגִּלְעָדִי译为“基列人”。
- source_word: תַּעֲשֶׂה חֶסֶד
  choice: 以忠厚待他们
  rationale: עָשָׂה חֶסֶד指以仁慈而忠诚的方式行事。“忠厚”兼顾实际恩待与忠诚相报的意味，又不把此处限定为专门的圣约术语。
- source_word: וְהָיוּ
  choice: 使他们列在
  rationale: 在大卫对所罗门的嘱咐中，这一形式带有命令或预期结果的语气；“使他们列在”清楚表达所罗门应作的安排。
- source_word: בְּאֹכְלֵי שֻׁלְחָנֶךָ
  choice: 列在你席上吃饭的人中
  rationale: 保留“吃你的席”这一具体形象，并用自然中文表达持续得到君王供养和恩待的身份。
- source_word: כִּי כֵן
  choice: 因为……曾这样
  rationale: כִּי引出理由，כֵן含“如此、这样”的对应意味；译文保留其回指关系，不明确补出原文未明说的比较对象。
- source_word: קָרְבוּ אֵלַי
  choice: 他们曾这样亲近我
  rationale: קָרַב的基本义是“靠近、亲近”。上下文暗示他们前来支持大卫，但正文保留原词的含蓄表达，并在脚注说明。
- source_word: בְּבָרְחִי מִפְּנֵי
  choice: 我躲避……的时候
  rationale: 介词בְּ加不定词结构在此表时间；מִפְּנֵי在逃亡语境中表示躲避某人。“躲避……的时候”符合现代汉语。
- source_word: אַבְשָׁלוֹם אָחִיךָ
  choice: 你哥哥押沙龙
  rationale: 保留亲属称谓；押沙龙年长于所罗门，现代汉语用“哥哥”自然呈现兄弟关系与长幼之别。
theological_decisions:
- issue: חֶסֶד是否明确译为“盟约之爱”
  choice: 以忠厚待他们
  alternative: 向他们施慈爱／以忠诚待他们
  rationale: 此处强调大卫对巴西莱家忠诚恩待的回报，但上下文没有要求把חֶסֶד专门化为正式的圣约术语；“忠厚”保留仁爱和忠诚两方面。
- issue: קָרְבוּ אֵלַי是否直接解释为“帮助我”
  choice: 他们曾这样亲近我
  alternative: 他们曾前来帮助我／他们曾站在我这一边
  rationale: 历史背景支持“帮助、支持”的理解，但希伯来文本本身只说“靠近我”。正文保留这一神学和叙事上的含蓄性，脚注交代语境含义。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“至于”衔接前文并转换对象；“忠厚”避免生硬的神学术语，同时保留חֶסֶד兼具仁爱与忠诚的色彩。正文保留“亲近我”的原文含蓄性，由脚注解释其支持、帮助的语境意义。
