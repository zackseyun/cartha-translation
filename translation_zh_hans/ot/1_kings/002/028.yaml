  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/הַ/שְּׁמֻעָה֙ בָּ֣אָה עַד יוֹאָ֔ב כִּ֣י יוֹאָ֗ב נָטָה֙ אַחֲרֵ֣י אֲדֹנִיָּ֔ה וְ/אַחֲרֵ֥י אַבְשָׁל֖וֹם לֹ֣א נָטָ֑ה וַ/יָּ֤נָס יוֹאָב֙ אֶל אֹ֣הֶל יְהוָ֔ה וַֽ/יַּחֲזֵ֖ק בְּ/קַרְנ֥וֹת הַ/מִּזְבֵּֽחַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/028.yaml
  text: And the report came to Joab[a], for Joab had turned after Adonijah, though he had not turned after Absalom[b]. So Joab fled to the tent of Yahweh and took hold of the horns of the altar.
translation:
  language: zh_hans
  text: 消息传到约押那里，因为约押曾转而追随亚多尼雅，却没有转而追随押沙龙[a]。于是，约押逃到雅威的帐幕，抓住祭坛的角[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “转而追随”直译为“转向……之后”，在这里表示政治上倒向或支持某人。
    reason: lexical_alternative
  - marker: b
    text: 祭坛的“角”是祭坛四角上凸起、形似角的部分；抓住祭坛的角，是求庇护或怜悯的举动。
    reason: cultural_note
lexical_decisions:
- source_word: הַשְּׁמֻעָה
  choice: 消息
  rationale: 该词指传到某人耳中的消息或报道；此处叙事语境并不要求带有不确定意味的“传闻”或“谣言”
- source_word: בָּאָה עַד
  choice: 传到……那里
  rationale: 希伯来语直译为“来到……为止”；“传到……那里”符合现代汉语表达消息抵达某人的方式。
- source_word: נָטָה אַחֲרֵי
  choice: 转而追随
  rationale: 既保留“转向/倒向”的动态意象，也表达此处政治上追随某人的含义；两次出现采用相同措辞，以保存原文的重复。
- source_word: אֹהֶל יְהוָה
  choice: 雅威的帐幕
  rationale: 直译“雅威的帐幕”；“帐幕”保留具体名词，不以更技术性的称呼替代。
- source_word: יְהוָה
  choice: 雅威
  rationale: 采用神圣四字名的常见现代汉语音译，保留其作为以色列之神专名的性质。
- source_word: וַיַּחֲזֵק בְּקַרְנוֹת הַמִּזְבֵּחַ
  choice: 抓住祭坛的角
  rationale: 按原文呈现具体动作，不在正文中直接解释其礼仪或求庇护的含义。
theological_decisions:
- issue: 如何译出神名 יְהוָה
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文使用的是专名而非称号；音译“雅威”能保留这一点，且不以“上主”替代神名。
- issue: 是否把 נָטָה אַחֲרֵי 直接解释为政治上的支持
  choice: 转而追随
  alternative: 支持；站在……一边；倒向
  rationale: 原文的习语既有“转向”的形象，又在语境中表示政治归附；所选译法兼顾两者，并保留亚多尼雅与押沙龙两小句之间相同动词的重复。
- issue: 约押追随亚多尼雅、却未追随押沙龙这一对照
  choice: 按马所拉文本保留这一对照
  alternative: 依据其他可能的文本理解改写或省略
  rationale: WLC 明确包含“却没有转而追随押沙龙”；译文不替叙事者解释这一看似突出的对照，也不消除其张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“转而追随”在两处重复，以反映希伯来文结构；“雅威的帐幕”和“祭坛的角”保留原文具体的礼仪场景。
