  text: וְ/עַתָּה֙ אַל תְּנַקֵּ֔/הוּ כִּ֛י אִ֥ישׁ חָכָ֖ם אָ֑תָּה וְ/יָֽדַעְתָּ֙ אֵ֣ת אֲשֶׁ֣ר תַּֽעֲשֶׂה לּ֔/וֹ וְ/הוֹרַדְתָּ֧ אֶת שֵׂיבָת֛/וֹ בְּ/דָ֖ם שְׁאֽוֹל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/009.yaml
  text: But now[a], do not hold him guiltless, for you are a wise man, and you will know what you should do to him; and you shall bring his gray head down to Sheol with blood.
translation:
  language: zh_hans
  text: 如今，不要算他无罪，因为你是有智慧的人，知道该怎样处置他；你要使他的白发带着血下到阴间[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “阴间”所译的希伯来词是“示奥”，也可指“坟墓”或“死人的领域”。
    reason: 说明 שְׁאוֹל 的希伯来文化背景及其可能的词义范围。
lexical_decisions:
- source_word: תְּנַקֵּהוּ
  choice: 不要算他无罪
  rationale: נקה 的皮勒式在这里具有司法意味，可指宣告无罪或使其免受惩罚。“不要算他无罪”既贴近原文，也保留大卫命所罗门追究其罪责的语气。
- source_word: אִישׁ חָכָם
  choice: 有智慧的人
  rationale: 直译其对所罗门智慧与判断力的肯定；现代汉语不必重复标明男性，语境已清楚指向所罗门。
- source_word: וְיָדַעְתָּ אֵת אֲשֶׁר תַּעֲשֶׂה לוֹ
  choice: 知道该怎样处置他
  rationale: 希伯来语表达大卫确信所罗门有判断力，能决定如何对待示每。“处置”符合王室审判语境，“该怎样”保留应当采取适当行动的意味。
- source_word: וְהוֹרַדְתָּ
  choice: 你要让……下到
  rationale: ירד 的使役式表示“使下去、带下去”；此处承接命令，以“你要让……下到”表达指令语气。
- source_word: שֵׂיבָתוֹ
  choice: 他白发
  rationale: 原词直指白发，并以白发代指年老之人；保留希伯来语鲜明的身体意象。
- source_word: בְּדָם
  choice: 染血
  rationale: 介词短语表示伴随流血而死。“染血”以自然而庄重的汉语保留暴力死亡的鲜明含义，不弱化原文。
- source_word: שְׁאוֹל
  choice: 阴间
  rationale: שְׁאוֹל 指死人所在之境，语义不必局限于具体坟墓。“阴间”是现代汉语中较简明的对应词，脚注同时保留其他可能理解。
theological_decisions:
- issue: שְׁאוֹל 的译法
  choice: 阴间
  alternative: 坟墓；死人之地
  rationale: “阴间”保留希伯来语所指死人领域的宇宙观意涵，又不将其缩减为埋葬地点。脚注列出“坟墓”和“死人之地”，以保留该词的语义幅度，不据此引入后期或宗派性的来世教义。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“不要算他无罪”保留司法语气；“白发染血，下到阴间”保留原文严厉而鲜明的意象，并避免用冗长解释取代经文本身。
