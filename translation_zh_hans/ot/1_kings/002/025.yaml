  text: וַ/יִּשְׁלַח֙ הַ/מֶּ֣לֶךְ שְׁלֹמֹ֔ה בְּ/יַ֖ד בְּנָיָ֣הוּ בֶן יְהוֹיָדָ֑ע וַ/יִּפְגַּע בּ֖/וֹ וַ/יָּמֹֽת־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/025.yaml
  text: So King Solomon sent Benaiah son of Jehoiada[a], and he struck him down, and he died.
translation:
  language: zh_hans
  text: 于是，所罗门王差耶何耶大的儿子比拿雅去；比拿雅击杀了他，他就死了。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “差……去”直译为“借耶何耶大的儿子比拿雅的手”，是指差他作为执行者。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: 差……去
  rationale: שׁלח在连续叙事中表示“差遣”。现代汉语用“差……去”既自然，也保留了所罗门发令、比拿雅执行的关系。
- source_word: הַמֶּלֶךְ שְׁלֹמֹה
  choice: 所罗门王
  rationale: 按现代汉语称谓习惯将王号置于人名之后，同时完整保留头衔和姓名。
- source_word: בְּיַד
  choice: 差……比拿雅去
  rationale: בְּיַד直译为“借……的手”，在这里表示由比拿雅作执行者。正文按自然汉语转为差遣比拿雅，字面形式及其代理含义见脚注。
- source_word: בְּנָיָהוּ בֶן יְהוֹיָדָע
  choice: 耶何耶大的儿子比拿雅
  rationale: 用现代汉语清楚表达父子关系，并采用常见圣经人名译法。
- source_word: וַיִּפְגַּע בּוֹ
  choice: 比拿雅击杀了他
  rationale: פגע与介词ב连用可表示袭击或击打；在奉命处死的语境中，“击杀”自然表达致命攻击。明确重复“比拿雅”，避免连续代词造成施事者含混；同时保留下句对死亡的独立陈述。
- source_word: וַיָּמֹת
  choice: 他就死了
  rationale: 保留希伯来叙事链中对死亡结果的明确独立陈述，不将其完全吸收到前一动词中。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“于是”承接前文命令及其执行；分号清楚呈现差遣、击杀和死亡的连续动作。脚注标记置于整节末尾，正文与脚注相互对应。
