base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/030.yaml
  text: 'Then Benaiah came to the tent of Yahweh and said to him[a], “Thus says the king: ‘Come out.’” But he said, “No, for I will die here.” And Benaiah brought word back to the king, saying, “Thus Joab spoke, and thus he answered me.”'
translation:
  language: zh_hans
  text: 比拿雅来到雅威的帐幕，对约押说：“王这样说：‘出来！’”约押却说：“不，我要死在这里。”比拿雅便回去向王禀报说：“约押这样说，也这样回答我。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֹהֶל יְהוָה
  choice: 雅威的帐幕
  rationale: אֹהֶל直译为“帐篷”，但在此处指敬拜场所；现代中文以“帐幕”既保留其帐篷形态，也自然体现圣所语境，且不误作“殿”。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以常见的现代汉语音译呈现四字神名，保留原文所用的专名，不以称号替代。
- source_word: כֹּה אָמַר הַמֶּלֶךְ
  choice: 王这样说
  rationale: 保留使者传令公式的正式语气，同时符合现代汉语表达。
- source_word: צֵא
  choice: 出来
  rationale: 该命令要求身在帐幕中的约押离开；“出来”在对话场景中最自然。
- source_word: לֹא כִּי פֹה אָמוּת
  choice: 不，我要死在这里
  rationale: 这里的כִּי可表达强调或说明；中文不强加明确因果连词，既自然，也保留约押拒绝离开并决意死在当地的语气。
- source_word: וַיָּשֶׁב ... דָּבָר
  choice: 回去向王禀报
  rationale: 该结构表示把话带回去报告；“禀报”贴合臣下向王复命的正式场景。
- source_word: כֹּה דִבֶּר יוֹאָב וְכֹה עָנָנִי
  choice: 约押是这样说的，也是这样回答我的
  rationale: 保留两次כֹּה的重复和正式复命风格，又使现代中文通顺。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”是依据主流学术重构的现代汉语音译，可保留其专名性质。
- issue: 约押所说“我要死在这里”的语气
  choice: 保留直陈表达，不解释为主动求死或仅仅预料被杀
  alternative: “我宁愿死在这里”
  rationale: 原文只明确表达他将在这里死，并未用表示“宁愿”的词；因此不将其动机或心理选择写入正文。
translation_notes:
  register: 采用庄重、简洁的现代标准汉语。人物姓名按通行圣经译名处理；使者公式和复命语气保持正式，但避免文言化。
