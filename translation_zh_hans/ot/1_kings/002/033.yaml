id: 1KI.2.33
reference: 1 Kings 2:33
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/שָׁ֤בוּ דְמֵי/הֶם֙ בְּ/רֹ֣אשׁ יוֹאָ֔ב וּ/בְ/רֹ֥אשׁ זַרְע֖/וֹ לְ/עֹלָ֑ם וּ/לְ/דָוִ֡ד וּ֠/לְ/זַרְע/וֹ וּ/לְ/בֵית֨/וֹ וּ/לְ/כִסְא֜/וֹ יִהְיֶ֥ה שָׁל֛וֹם עַד עוֹלָ֖ם מֵ/עִ֥ם יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/033.yaml
  text: So their blood shall return on the head of Joab and on the head of his offspring forever[a], but for David and for his offspring and for his house and for his throne, there shall be peace forever from Yahweh.
translation:
  language: zh_hans
  text: 这样，他们的血债必归到约押头上和他后裔头上，直到永远[a]；但大卫和他的后裔、他的家、他的王位，必永远有从耶和华而来的平安。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“他们的血必归到约押头上和他后裔头上”；这里的“血”指流人血所招致的罪责。
    reason: 说明正文“血债”的希伯来语司法习语，并保留其直译形式。
lexical_decisions:
- source_word: וְשָׁבוּ דְמֵיהֶם בְּרֹאשׁ
  choice: 他们的血债必归到……头上
  rationale: “血”在此指流人血所招致的罪责；译作“血债”能以现代汉语清楚传达司法含义，同时保留“归到头上”的希伯来意象。
- source_word: זַרְעוֹ
  choice: 他的后裔
  rationale: 这里集合性地指约押或大卫的子孙后代；“后裔”自然、庄重，也符合王朝语境。
- source_word: לְעֹלָם / עַד עוֹלָם
  choice: 直到永远 / 永远
  rationale: 两处均表达持续无尽的时限；依各自句法分别译为“直到永远”和“永远”。
- source_word: לְדָוִד וּלְזַרְעוֹ וּלְבֵיתוֹ וּלְכִסְאוֹ
  choice: 大卫和他的后裔、他的家、他的王位
  rationale: 保留“家”和“王位”的王朝含义，并用汉语并列结构避免不必要地重复介词。
- source_word: יִהְיֶה שָׁלוֹם
  choice: 必……有……平安
  rationale: “平安”保留 שָׁלוֹם 所含的安宁、福祉与稳固等宽广含义，不将其窄化为繁荣。
- source_word: מֵעִם יְהוָה
  choice: 从耶和华而来的
  rationale: 明确平安的来源是耶和华，并按项目惯例将神名译为“耶和华”。
theological_decisions:
- issue: 约押一系受审判与大卫一系蒙平安之间的关系
  choice: 用“但”明确表达对比
  alternative: 按 וּ 的形式直译为“而且/和”
  rationale: 希伯来语连接词形式上是“和”，语境中却明显对照约押所承受的血债与大卫所得的平安；“但”自然传达这一语义关系，没有增添新的神学判断。
- issue: 约押后裔与血债的关联
  choice: 保留经文所说血债临到其后裔直到永远
  alternative: 将后裔理解为仅在参与其罪时才承担责任，并在正文中加以限定
  rationale: 原文没有明说这种限定；译文应保留本节自身的严峻张力，不用其他经文或系统解释替它消解。
- issue: שָׁלוֹם 的王朝含义
  choice: 译为“平安”
  alternative: 译为“福祉”或“兴盛”
  rationale: “平安”既自然又能容纳个人、家族和王位安稳等较广含义，避免过度具体化。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“血债”使司法含义清楚，“归到……头上”保留原文意象；后半句调整为自然汉语语序，同时保留“大卫—后裔—家—王位”的王朝层次。
