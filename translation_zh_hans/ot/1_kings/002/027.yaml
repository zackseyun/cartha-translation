  text: וַ/יְגָ֤רֶשׁ שְׁלֹמֹה֙ אֶת אֶבְיָתָ֔ר מִ/הְי֥וֹת כֹּהֵ֖ן לַֽ/יהוָ֑ה לְ/מַלֵּא֙ אֶת דְּבַ֣ר יְהוָ֔ה אֲשֶׁ֥ר דִּבֶּ֛ר עַל בֵּ֥ית עֵלִ֖י בְּ/שִׁלֹֽה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/027.yaml
  text: So Solomon drove Abiathar out from being priest to Yahweh[b][a], fulfilling the word of Yahweh that he had spoken concerning the house of Eli in Shiloh.
translation:
  language: zh_hans
  text: 所罗门就把亚比亚他逐出，使他不再作耶和华的祭司，从而应验了[a]耶和华在示罗论到以利家所说的话。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“为要应验耶和华的话。”希伯来语在这里既可表示目的，也可表示结果。
    reason: alternative_reading
  - marker: b
    text: 关于耶和华论到以利家所说的话，参撒母耳记上2:27—36；3:11—14。
    reason: cross_reference
lexical_decisions:
- source_word: וַיְגָרֶשׁ
  choice: 革除了……的职分
  rationale: גרשׁ表示赶走、逐出；结合后面的“不得再作祭司”，这里用现代汉语常见的“革除……职分”，清楚表达亚比亚他被强制撤离祭司身份，而非仅仅自愿离任。
- source_word: מִהְיוֹת כֹּהֵן
  choice: 作……祭司的职分
  rationale: 介词מִן与היה的不定式连用，表示从某种身份或状态中被除去。“作……祭司的职分”在中文中自然地表达其祭司角色被撤销。
- source_word: כֹּהֵן לַיהוָה
  choice: 作耶和华祭司
  rationale: ל在这里表示归属及事奉对象；此译既简洁自然，也保留祭司事奉耶和华的关系。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的神圣名字译法“耶和华”，以名字而非普通称号来对应四字神名。
- source_word: לְמַלֵּא
  choice: 从而应验了
  rationale: 带ל的不定式可表示目的或结果。正文采用“从而应验了”，突出所罗门的行动实际使先前的话得到实现，同时以脚注保留目的解释。
- source_word: דְּבַר יְהוָה
  choice: 耶和华……所说的话
  rationale: דָּבָר在这里指耶和华先前宣告的内容。中文将关系从句整合为“耶和华……所说的话”，比机械译作“耶和华的话”更顺畅。
- source_word: עַל בֵּית עֵלִי
  choice: 论到以利家
  rationale: עַל可表示“关于”，在审判语境中也可含“针对”之意。“论到”保留较宽的语义，不在正文中额外强化敌对色彩。
- source_word: בְּשִׁלֹה
  choice: 在示罗
  rationale: בְּ在地名之前取地点义；“在示罗”直接对应耶和华发言的地点。
theological_decisions:
- issue: 所罗门的行动与先前神谕之间的关系
  choice: 译作“从而应验了”，将所罗门的行动表述为先前审判之言得到实现的途径
  alternative: “为要应验耶和华的话”，将לְמַלֵּא理解为目的
  rationale: 希伯来语לְמַלֵּא既可表达目的，也可表达结果。叙事明显将亚比亚他被革职与针对以利家的宣告联系起来，但并未明确交代所罗门主观上是否以应验神谕为行动目的，因此正文采用结果表达，并在脚注中保留目的读法。
- issue: “论到”是否应译为“攻击／针对”以利家
  choice: 采用中性的“论到以利家”
  alternative: “针对以利家所说的话”
  rationale: 上下文确为审判宣告，但עַל本身可宽泛表示“关于、论到”。正文不把语境中的审判意味直接写入介词，以免缩窄原文可能的表达范围。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“革除了……的职分”避免生硬直译“从作祭司中赶出”，同时保留强制免职的力度；“从而应验了”使叙事衔接清晰，脚注则保存原文在目的与结果之间的语义张力。
