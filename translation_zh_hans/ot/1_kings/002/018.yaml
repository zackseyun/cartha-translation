  text: Bathsheba said[a], “Good; I will speak to the king for you.”
translation:
  language: zh_hans
  text: 拔示巴说：“好，我会为你向王说话[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我会向王谈论你（或你的事）”或“我会代表你向王说话”。希伯来语这一短语可指谈论某人；按上下文，这里很可能包含为亚多尼雅代求之意。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: 说
  rationale: 这是אמר的叙事性连续式，用来引出直接引语；现代汉语自然译为“说”。
- source_word: בַּת שֶׁבַע
  choice: 拔示巴
  rationale: 按现代中文圣经中通行的人名音译处理，不按字面义翻译。
- source_word: טוֹב
  choice: 好
  rationale: 此处是简短的肯定答复；“好”既保留原文的简洁，也符合自然对话。
- source_word: אָנֹכִי
  choice: 我
  rationale: 独立人称代词明确主语；汉语译出“我”自然合宜，不另加强调。
- source_word: אֲדַבֵּר
  choice: 说情
  rationale: 该动词本义是“说、讲话”，但与עָלֶיךָ结合，并依宫廷代求的语境，译作“说情”能自然表达这里为人出面的含义。
- source_word: עָלֶיךָ
  choice: 为你
  rationale: על与“说”连用可表示“谈到你、关于你”，在此语境中很可能表示代表亚多尼雅向王求情；“为你”保留受益、代求的方向。
- source_word: אֶל הַמֶּלֶךְ
  choice: 向王
  rationale: 介词短语直指说话对象；汉语用“向王说情”比“对王说情”更自然、庄重。
