  text: The days that David reigned over Israel were forty years. In Hebron he reigned seven years, and in Jerusalem he reigned thirty-three years.
translation:
  language: zh_hans
  text: 大卫作以色列王共四十年：他在希伯仑作王七年，在耶路撒冷作王三十三年。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהַיָּמִים אֲשֶׁר מָלַךְ דָּוִד עַל יִשְׂרָאֵל
  choice: 大卫统治以色列共
  rationale: 希伯来语直译为“大卫统治以色列的日子”，实际表达在位时长。现代汉语用“统治……共”自然清楚，也保留了מָלַךְ所指的君王统治之意。
- source_word: אַרְבָּעִים שָׁנָה
  choice: 四十年
  rationale: 准确对应原文的数目和时间单位。
- source_word: בְּחֶבְרוֹן מָלַךְ שֶׁבַע שָׁנִים
  choice: 在希伯仑统治了七年
  rationale: בְּ表示地点，מָלַךְ重复强调在该地执政；译文保留这一信息和句式对应。
- source_word: וּבִירוּשָׁלִַם מָלַךְ שְׁלֹשִׁים וְשָׁלֹשׁ שָׁנִים
  choice: 在耶路撒冷统治了三十三年
  rationale: 保留连接关系、地点和重复的统治动词，并按现代汉语表达复合数词。
