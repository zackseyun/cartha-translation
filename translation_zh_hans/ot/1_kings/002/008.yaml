source:
  edition: WLC
  text: וְ/הִנֵּ֣ה עִ֠מְּ/ךָ שִֽׁמְעִ֨י בֶן גֵּרָ֥א בֶן הַ/יְמִינִי֮ מִ/בַּחֻרִים֒ וְ/ה֤וּא קִֽלְלַ֨/נִי֙ קְלָלָ֣ה נִמְרֶ֔צֶת בְּ/י֖וֹם לֶכְתִּ֣/י מַחֲנָ֑יִם וְ/הֽוּא יָרַ֤ד לִ/קְרָאתִ/י֙ הַ/יַּרְדֵּ֔ן וָ/אֶשָּׁ֨בַֽע ל֤/וֹ בַֽ/יהוָה֙ לֵ/אמֹ֔ר אִם אֲמִֽיתְ/ךָ֖ בֶּ/חָֽרֶב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/008.yaml
  text: And behold[a], with you is Shimei son of Gera, the Benjaminite from Bahurim, and he cursed me with a grievous curse on the day I went to Mahanaim. But he came down to meet me at the Jordan, and I swore to him by Yahweh, saying, ‘I will not put you to death with the sword.’
translation:
  language: zh_hans
  text: 看哪，与你在一起的有示每，就是基拉的儿子、来自巴户琳的便雅悯人。他在我往玛哈念去的那天，用严厉的咒诅咒骂我；但他下到约旦河来迎接我，我就指着雅威向他起誓说：‘我绝不用刀杀你。’[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“如果我用刀杀你”，这是省略了自我咒诅后果的誓言格式，意思是“我绝不用刀杀你”。
    reason: 说明椭圆式希伯来誓言的字面形式与实际语义。
lexical_decisions:
- source_word: וְהִנֵּה
  choice: 看哪
  rationale: 保留提示听者注意眼前重要人物的语用功能，同时采用庄重且为现代读者可懂的表达。
- source_word: עִמְּךָ
  choice: 在你那里
  rationale: 表示示每如今处于所罗门的管辖或势力范围内；比字面的“与你同在”更符合现代汉语语境。
- source_word: שִׁמְעִי בֶן גֵּרָא בֶן הַיְמִינִי מִבַּחֻרִים
  choice: 巴户琳的便雅悯人基拉的儿子示每
  rationale: 按自然汉语次序交代籍贯、族属、父名和人名；הַיְמִינִי 作为族属词译为“便雅悯人”。
- source_word: קִלְלַנִי קְלָלָה נִמְרֶצֶת
  choice: 恶狠狠地咒骂我
  rationale: 以自然汉语传达同根宾语结构的加强语气，并体现 נִמְרֶצֶת 所含的猛烈、严厉之意，而不误指身体暴力。
- source_word: בְּיוֹם לֶכְתִּי מַחֲנָיִם
  choice: 我往玛哈念去的那天
  rationale: 清楚保留时间关系及前往玛哈念的方向含义。
- source_word: יָרַד לִקְרָאתִי הַיַּרְדֵּן
  choice: 下到约旦河迎接我
  rationale: 保留 ירד 的下行意象，也准确表达 לִקְרָאתִי 的迎接含义。
- source_word: וָאֶשָּׁבַע לוֹ בַיהוָה
  choice: 我就指着雅威向他起誓
  rationale: “指着……起誓”是自然庄重的汉语誓言表达，并直接音译神名 יהוה。
- source_word: אִם אֲמִיתְךָ בֶּחָרֶב
  choice: 我必不用刀杀你
  rationale: אִם 在此为省略咒诅后果的誓言套语，实际表达强烈否定；正文译出其语用意义，脚注保留字面结构。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；采用“雅威”音译，尽量保留其作为专名的性质，不以称号取代。
- issue: 誓言公式 אִם אֲמִיתְךָ בֶּחָרֶב 的解释
  choice: 在正文中明确译为否定誓言“我必不用刀杀你”
  alternative: 按字面译作“如果我用刀杀你”
  rationale: 希伯来语省略了誓言中的自我咒诅部分，אִם 在此实际承载强烈否定；若机械保留“如果”，现代读者容易误解。脚注说明其字面形式，以保存原文修辞。
translation_notes:
  register: 采用现代、庄重而清楚的叙事语言。“看哪”保留宫廷遗命中的郑重提示；“恶狠狠地咒骂”传达原文强烈程度而不过度书面化。专名采用常见中文圣经音译形式，神名译作“雅威”。
