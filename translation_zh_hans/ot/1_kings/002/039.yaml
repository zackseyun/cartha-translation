base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/039.yaml
  text: At the end of three years[a], two slaves of Shimei ran away to Achish son of Maacah, king of Gath. And they told Shimei, saying, “Look, your slaves are in Gath.”
translation:
  language: zh_hans
  text: 三年期满时，示每的两个奴隶[a]逃到迦特王、玛迦的儿子亚吉那里。有人告诉示每说：“看，你的奴隶在迦特。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “奴隶”也可译作“仆人”。这里二人从主人那里逃走，因此正文采用更能突出其受奴役身份的译法。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקֵּץ שָׁלֹשׁ שָׁנִים
  choice: 三年期满时
  rationale: 保留原文所表达的三年这一时段终点，同时用现代汉语自然表达。
- source_word: וַיִּבְרְחוּ
  choice: 逃到
  rationale: בּרח表示逃跑、逃离；与后面的目的地连用时，“逃到”简洁自然，也体现他们擅自离开主人的情境。
- source_word: עֲבָדִים / עֲבָדֶיךָ
  choice: 奴隶
  rationale: עבד可指仆人或奴隶；本节中二人从主人那里逃走，受奴役的身份较为突出，因此正文译作“奴隶”，并以脚注保留“仆人”这一可能译法。
- source_word: אֶל אָכִישׁ בֶּן מַעֲכָה מֶלֶךְ גַּת
  choice: 到迦特王玛迦的儿子亚吉那里
  rationale: 准确表达移动方向，并按汉语习惯排列亚吉的父系身份和王位称号。
- source_word: וַיַּגִּידוּ לְשִׁמְעִי לֵאמֹר
  choice: 有人告诉示每说
  rationale: 原文为未指明具体身份的复数主语；汉语用“有人”自然保留报告者不明确这一点，“说”则保留直接引语的引介形式。
- source_word: הִנֵּה
  choice: 看
  rationale: 保留提示听者注意的语气，同时避免古奥表达。
- source_word: בְּגַת
  choice: 在迦特
  rationale: ב在此表示地点，译为“在迦特”符合现代汉语习惯。
