  source_fidelity: 时间短语“三年期满时”、逃跑动作、奴隶身份、报告内容及“在迦特”均忠实于希伯来文。惟“迦特王玛迦的儿子亚吉”缺少必要的同位语停顿，汉语句法上可能误读为“玛迦”为迦特王，未清楚体现亚吉同时是迦特王和玛迦之子。
