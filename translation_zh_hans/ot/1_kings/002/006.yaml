  text: וְ/עָשִׂ֖יתָ כְּ/חָכְמָתֶ֑/ךָ וְ/לֹֽא תוֹרֵ֧ד שֵׂיבָת֛/וֹ בְּ/שָׁלֹ֖ם שְׁאֹֽל־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/006.yaml
  text: Act according to your wisdom[b][a], and do not let his gray head go down to Sheol in peace.
translation:
  language: zh_hans
  text: 你要照你的智慧行事，不可让[a]他的白发安然下到阴间[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“不可使……下到”。
    reason: lexical_alternative
  - marker: b
    text: “阴间”指死者所在之处；或译“坟墓”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: 你要……行事
  rationale: עָשָׂה本义宽泛，可指“做、行”。这里是大卫嘱咐所罗门采取行动，用“你要……行事”既表达命令语气，也不把具体行动说得过于明确。
- source_word: כְּחָכְמָתֶךָ
  choice: 照你的智慧
  rationale: 介词כְּ表示依照、符合；此处是要所罗门按自己的智慧和判断行事。
- source_word: וְלֹא תוֹרֵד
  choice: 不可让……下到
  rationale: תוֹרֵד是ירד的使役式，字面义为“不可使……下去”。“不可让……下到”在现代汉语中较自然，同时保留使役含义；脚注列出更直接的译法。
- source_word: שֵׂיבָתוֹ
  choice: 他的白发
  rationale: שֵׂיבָה可指白发或老年。保留“白发”的具体意象，也保留以白发代指年老之人的希伯来表达。
- source_word: בְּשָׁלֹם
  choice: 安然
  rationale: שָׁלוֹם在这里指平安无事、未受惩治地结束一生；“安然”自然地表达“不经历追讨而死”的语境含义。
- source_word: שְׁאֹל
  choice: 阴间
  rationale: שְׁאוֹל指死者所在之处，并不只等同于具体坟墓。汉语圣经语域中的“阴间”可保留这一较宽泛的源语言概念。
theological_decisions:
- issue: שְׁאֹל的译法
  choice: 阴间
  alternative: 坟墓；死者之境
  rationale: “阴间”保留该词可能指死者领域而不只是埋葬地点的含义，也避免在本节中加入更具体的死后状态教义。上下文重点是约押不可安然无罚地死去。
- issue: 使役表达与死亡责任
  choice: 不可让……下到
  alternative: 不可使……下到
  rationale: 希伯来文使用使役式，既要求所罗门确保结果，也未在本句明说执行方式。“不可让”保留这一开放性；脚注提示更直接的使役译法。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“他的白发”有意保留原文以白发代指年老之人的鲜明意象；整句不补出原文未明说的处决方式。
