  text: וְ/גַ֣ם אַתָּ֣ה יָדַ֡עְתָּ אֵת֩ אֲשֶׁר עָ֨שָׂה לִ֜/י יוֹאָ֣ב בֶּן צְרוּיָ֗ה אֲשֶׁ֣ר עָשָׂ֣ה לִ/שְׁנֵֽי שָׂרֵ֣י צִבְא֣וֹת יִ֠שְׂרָאֵל לְ/אַבְנֵ֨ר בֶּן נֵ֜ר וְ/לַ/עֲמָשָׂ֤א בֶן יֶ֨תֶר֙ וַ/יַּ֣הַרְגֵ֔/ם וַ/יָּ֥שֶׂם דְּמֵֽי מִלְחָמָ֖ה בְּ/שָׁלֹ֑ם וַ/יִּתֵּ֞ן דְּמֵ֣י מִלְחָמָ֗ה בַּ/חֲגֹֽרָת/וֹ֙ אֲשֶׁ֣ר בְּ/מָתְנָ֔י/ו וּֽ/בְ/נַעֲל֖/וֹ אֲשֶׁ֥ר בְּ/רַגְלָֽי/ו־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/005.yaml
  text: 'And you also know what Joab son of Zeruiah did to me[a], what he did to the two commanders of the armies of Israel, to Abner son of Ner and to Amasa son of Jether: he killed them and put the blood of war in peace[b], and put the blood of war on the belt that was around his waist and on the sandals that were on his feet.'
translation:
  language: zh_hans
  text: 你也知道洗鲁雅的儿子约押对我所做的事[a]，就是他怎样对待以色列军队的两位统帅——尼珥的儿子押尼珥和益帖的儿子亚玛撒：他杀了他们，在和平中染上战争的血[b]，又使战争的血沾在他腰带和脚上的鞋上[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “对我所做的事”中的希伯来语介词也可按较宽泛的关系理解为“为我所做的事”；这里依上下文译作“对我”。
    reason: lexical_alternative
  - marker: b
    text: 直译近于“把战争的血置于和平中”。这句话以“战争的血”与“和平”形成强烈对照，指约押在和平的情势中实施流血杀戮。
    reason: lexical_alternative
  - marker: c
    text: 腰带和鞋上的血既延续杀戮现场的具体画面，也可能表示这些杀人所带来的血债仍附着在约押身上。
    reason: cultural_note
lexical_decisions:
- source_word: וְגַם אַתָּה יָדַעְתָּ
  choice: 你也知道
  rationale: 自然表达连接词、附加强调和对所罗门的直接称呼；完成式在此表示当前已有的认知。
- source_word: אֵת אֲשֶׁר עָשָׂה לִי
  choice: 对我所做的事
  rationale: 按上下文将 לִי 理解为受损者或关系对象，保留约押的行为也是对大卫的冒犯这一层含义，同时以脚注说明介词本身的可能范围。
- source_word: לִשְׁנֵי שָׂרֵי צִבְאוֹת יִשְׂרָאֵל
  choice: 以色列军队的两位统帅
  rationale: שָׂרֵי צִבְאוֹת 指高级军事首领；中文用“军队的两位统帅”既清楚又避免生硬照搬复数形式。
- source_word: וַיַּהַרְגֵם
  choice: 他杀了他们
  rationale: 直接准确地表达叙事动词及其复数宾语。
- source_word: וַיָּשֶׂם דְּמֵי מִלְחָמָה בְּשָׁלֹם
  choice: 在太平时期流了战争中的血
  rationale: 原文直译近于“把战争的血置于和平中”。正文以自然中文表达约押在和平情势下实施战时杀戮的强烈反差，脚注保留原文意象。
- source_word: וַיִּתֵּן דְּמֵי מִלְחָמָה בַּחֲגֹרָתוֹ ... וּבְנַעֲלוֹ
  choice: 又使战争中的血沾在他腰间的带子和脚上的鞋上
  rationale: 保留血落在约押随身衣物上的具体意象；“沾在”比机械的“放在”更符合现代汉语，同时未把血究竟是实际血迹还是血债象征单一定死。
theological_decisions:
- issue: 约押杀人行为的定性
  choice: 保留“战争中的血”与“太平时期”的张力
  alternative: 直接译为“他在和平时期犯了谋杀罪”
  rationale: 原文借战争与和平的对照控诉约押，不宜以抽象法律或神学术语取代其意象。
- issue: 腰带和鞋上之血的性质
  choice: 正文保留可作实际血迹或血债象征理解的意象
  alternative: 明确译为“使自己承担了流血罪”
  rationale: 希伯来文本用具体的血、腰带和鞋来表达，明确抽象化会消除原文可能具有的双重意味。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。人名依中文圣经常用译名；以破折号自然引出两位统帅的姓名。正文尽量保存“战争的血”“太平时期”以及血沾腰带和鞋的希伯来意象，不用教派化或过度解释性的措辞。
