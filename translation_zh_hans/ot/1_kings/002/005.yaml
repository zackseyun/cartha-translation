- from: 你也知道洗鲁雅的儿子约押对我所做的事[a]，就是他怎样对待以色列军队的两位统帅——尼珥的儿子押尼珥和益帖的儿子亚玛撒：他杀了他们，在太平时期流了战争中的血[b]，又使战争中的血沾在他腰间的带子和脚上的鞋上[c]。
  to: 你也知道洗鲁雅的儿子约押对我所做的事[a]，就是他怎样对待以色列军队的两位统帅——尼珥的儿子押尼珥和益帖的儿子亚玛撒：他杀了他们，在和平中染上战争的血[b]，又使战争的血沾在他腰带和脚上的鞋上[c]。
  rationale: 修订仅调整战争之血与和平的短语，恢复原文“战争的血”的措辞和与后句相连的附着意象，同时以“染上”使中文自然而不预断血是实际血迹还是血债象征；“在和平中”也较“在太平时期”更贴近原文的简洁修辞对照。其余内容、姓名、脚注锚点及结构均予保留。
