base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/017.yaml
  text: And he said[a], “Please speak to King Solomon, for he will not refuse you, and let him give me Abishag the Shunammite as a wife.”
translation:
  language: zh_hans
  text: 他就说：“请你对所罗门王说，因为他不会拒绝你[a]，请他把书念的女子亚比煞给我为妻。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“他不会使你的脸转回去。”这是希伯来语习语，意思是他不会拒绝你，或驳回你的请求。
    reason: lexical_alternative
lexical_decisions:
- source_word: אִמְרִי נָא
  choice: 请你……说
  rationale: 阴性单数祈使式配合语气词 נָא，表达礼貌的请求；译作“请你……说”自然清楚。
- source_word: לִשְׁלֹמֹה הַמֶּלֶךְ
  choice: 对所罗门王
  rationale: 按现代汉语习惯将王号置于人名之后，并用“对”引出说话对象。
- source_word: כִּי
  choice: 因为
  rationale: 在此引出亚多尼雅请拔示巴代求的理由。
- source_word: לֹא יָשִׁיב אֶת פָּנָיִךְ
  choice: 他不会拒绝你
  rationale: 这是涉及“使脸转回”的希伯来语习语，语境中指不会拒绝求情者或驳回其请求；正文译出自然含义，脚注保留字面意象。
- source_word: וְיִתֶּן לִי
  choice: 请他……给我
  rationale: 前缀动词在请求语境中表达要拔示巴向所罗门提出的具体事项；汉语用“请他”衔接较自然。
- source_word: אֲבִישַׁג הַשּׁוּנַמִּית
  choice: 书念女子亚比煞
  rationale: 采用现代中文圣经人名、地名的通行音译，并明确 הַשּׁוּנַמִּית 是女性地域称谓。
- source_word: לְאִשָּׁה
  choice: 为妻
  rationale: 该结构表示婚娶关系；“给我为妻”简洁庄重，也保留原文表达。
