id: 1KI.2.3
reference: 1 Kings 2:3
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/שָׁמַרְתָּ֞ אֶת מִשְׁמֶ֣רֶת יְהוָ֣ה אֱלֹהֶ֗י/ךָ לָ/לֶ֤כֶת בִּ/דְרָכָי/ו֙ לִ/שְׁמֹ֨ר חֻקֹּתָ֤י/ו מִצְוֺתָי/ו֙ וּ/מִשְׁפָּטָ֣י/ו וְ/עֵדְוֺתָ֔י/ו כַּ/כָּת֖וּב בְּ/תוֹרַ֣ת מֹשֶׁ֑ה לְמַ֣עַן תַּשְׂכִּ֗יל אֵ֚ת כָּל אֲשֶׁ֣ר תַּֽעֲשֶׂ֔ה וְ/אֵ֛ת כָּל אֲשֶׁ֥ר תִּפְנֶ֖ה שָֽׁם־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/003.yaml
  text: And keep the charge of Yahweh your God by walking in his ways and by keeping his statutes[a], his commandments, his judgments, and his testimonies, as it is written in the Law of Moses, so that you may act wisely in all that you do and wherever you turn.
translation:
  language: zh_hans
  text: 你要谨守耶和华你上帝的吩咐，行在他的道路中，谨守他的律例、诫命、典章和法度，正如摩西律法上所写的，好叫你无论做什么、往哪里去，都能处事明智[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “处事明智”也可译作“顺利”或“成功”。这个希伯来语动词既可强调明智有效的行动，也可指由此带来的顺利结果。
    reason: 保留 לְמַעַן תַּשְׂכִּיל 在明智行事与成功结果之间的词义幅度。
lexical_decisions:
- source_word: וְשָׁמַרְתָּ אֶת מִשְׁמֶרֶת
  choice: 你要谨守……所托付的职责
  rationale: 连词加完成式在大卫连续嘱咐的语境中具有命令意味；מִשְׁמֶרֶת 指受托承担并须忠实履行的责任，用“所托付的职责”既保留受托含义，也适合现代汉语。
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: 耶和华你上帝
  rationale: 按中文圣经传统以“耶和华”音译四字神名，并直译第二人称单数所属形式“你的上帝”；句中为使领属关系自然，表达为“耶和华你上帝所托付的职责”。
- source_word: לָלֶכֶת בִּדְרָכָיו
  choice: 遵行他的道路
  rationale: 保留“道路”的希伯来语行为隐喻，同时用“遵行”使现代汉语自然，并表明这是履行所托职责的方式。
- source_word: חֻקֹּתָיו מִצְוֺתָיו וּמִשְׁפָּטָיו וְעֵדְוֺתָיו
  choice: 他的律例、诫命、典章和法度
  rationale: 用四个彼此有别、中文经文语域中易懂的法律词保留原文的并列累积；“法度”在此承载 עֵדוֹת 的约章见证和规定色彩。
- source_word: כַּכָּתוּב בְּתוֹרַת מֹשֶׁה
  choice: 正如摩西律法上所写的
  rationale: 保留书面权威的被动表达；在此王权与盟约语境中，תּוֹרָה 指摩西的成文律法，译作“摩西律法”清楚而稳妥。
- source_word: לְמַעַן תַּשְׂכִּיל
  choice: 使你……都能行事明智
  rationale: שׂכל 的使役词形可指明智有效地行事，也可引申为顺利成功；正文采用较直接的“行事明智”，并以脚注保留结果性含义。
- source_word: בְּכָל אֲשֶׁר תַּעֲשֶׂה וְאֵת כָּל אֲשֶׁר תִּפְנֶה שָׁם
  choice: 无论做什么、往哪里去
  rationale: 自然传达两个并列的全面范围表达；“往哪里去”保留“转向何处”的空间性习语。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文明确使用神的专名。中文正文采用读者最熟悉且庄重的传统音译“耶和华”，不以“主”这一称号替代专名；“雅威”是较贴近现代学术重构的可行音译。
- issue: לְמַעַן תַּשְׂכִּיל 所表达的智慧与成功
  choice: 行事明智
  alternative: 顺利／亨通
  rationale: 该动词兼具审慎有效地行事及由此取得成功的语义可能。正文不把盟约顺服简化为物质昌盛，而以脚注保留“顺利、成功”的真实语义张力。
- issue: “遵行道路”与“谨守律法条款”的关系
  choice: 将二者并列为履行受托职责的方式
  alternative: 把后者视为前者的进一步解释
  rationale: 两个不定式都可解释如何守住耶和华所托付的职责；中文保留并列结构，不强行判定二者严格的逻辑层级。
translation_notes:
  register: 采用现代、庄重而可朗读的标准普通话。法律词组保留一定经文语域，但避免晦涩古语；句法按汉语重组，同时保留原文的盟约责任、道路隐喻和四项法律术语。脚注标记置于其所说明的“行事明智”句意之后。
