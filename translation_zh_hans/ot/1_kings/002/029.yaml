id: 1KI.2.29
reference: 1 Kings 2:29
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יֻּגַּ֞ד לַ/מֶּ֣לֶךְ שְׁלֹמֹ֗ה כִּ֣י נָ֤ס יוֹאָב֙ אֶל אֹ֣הֶל יְהוָ֔ה וְ/הִנֵּ֖ה אֵ֣צֶל הַ/מִּזְבֵּ֑חַ וַ/יִּשְׁלַ֨ח שְׁלֹמֹ֜ה אֶת בְּנָיָ֧הוּ בֶן יְהוֹיָדָ֛ע לֵ/אמֹ֖ר לֵ֥ךְ פְּגַע בּֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/029.yaml
  text: And it was reported to King Solomon that Joab had fled to the tent of Yahweh[a], and behold, he was beside the altar. So Solomon sent Benaiah son of Jehoiada, saying, “Go[b], strike him down.”
translation:
  language: zh_hans
  text: 有人禀告所罗门王说：“约押逃到了雅威的帐幕[a]。看哪，他就在祭坛旁边。”于是所罗门派耶何耶大的儿子比拿雅去，吩咐说：“去，击杀他[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “帐幕”或译“会幕”。希伯来文直译为“雅威的帐幕”。
    reason: lexical_alternative
  - marker: b
    text: “击杀他”也可译作“攻击他”或“下手击打他”。原文动词可指击打或袭击；在这里的语境中，这一命令具有致命含义。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֻּגַּד
  choice: 有人禀告
  rationale: 原文是 נגד 的使役被动形式，表示消息被告知君王。汉语用“有人禀告”自然地传达被动报告的情景，也符合向君王报告的语域。
- source_word: נָס
  choice: 逃到了
  rationale: 该完成式所指的逃跑先于禀告发生；现代汉语不必另用专门的过去完成时形式。“逃到了”也保留其逃往特定地点的方向。
- source_word: אֶל אֹהֶל יְהוָה
  choice: 到了雅威的帐幕
  rationale: אֹהֶל 的基本义是“帐幕、帐篷”； יְהוָה 是上帝的专名，译作“雅威”，不以称号替代。
- source_word: וְהִנֵּה
  choice: 看哪
  rationale: 保留 הִנֵּה 引人注意、使叙述更鲜明的功能，而不将其无声省略。
- source_word: אֵצֶל הַמִּזְבֵּחַ
  choice: 就在祭坛旁边
  rationale: אֵצֶל 表示邻近、在旁；“旁边”不额外推断约押此刻的具体姿势。
- source_word: וַיִּשְׁלַח
  choice: 于是……派……去
  rationale: “于是”体现叙事推进及所罗门听到报告后的行动，“派……去”符合汉语差遣语境。
- source_word: בְּנָיָהוּ בֶן יְהוֹיָדָע
  choice: 耶何耶大的儿子比拿雅
  rationale: 以现代汉语常用的父名结构表达希伯来文的身份说明，并采用通行圣经人名译法。
- source_word: לֵאמֹר
  choice: 吩咐说
  rationale: 原文用“不定式＋说”引出直接引语；因说话者是君王、内容是命令，“吩咐说”自然且准确。
- source_word: לֵךְ
  choice: 去
  rationale: 直接保留单数阳性命令式的简洁力度。
- source_word: פְּגַע בּוֹ
  choice: 击杀他
  rationale: פגע 与介词 ב 连用可指击打、袭击或攻击；在本处奉命处死约押的语境中，动作具有致命意图。“击杀”既表达这一语境，又保留“击打”的词义色彩。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名。译作“雅威”以音译保留专名性质，不用一般称号取代。
- issue: 约押在祭坛附近的描述
  choice: 祭坛旁边
  alternative: 抓住祭坛的角
  rationale: 本节原文仅说 אֵצֶל הַמִּזְבֵּחַ（在祭坛旁边）。尽管相邻经文提到祭坛的角，本节不应自行补入该细节。
- issue: פְּגַע בּוֹ 是否明确译为处死
  choice: 击杀他
  alternative: 攻击他；杀了他
  rationale: 语境清楚显示所罗门命比拿雅执行致命行动，但动词本身具有“击打、袭击”的词义范围；“击杀”兼顾语境与词汇张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“禀告”“吩咐”体现王室场景但不过度文言化；“看哪”有意保留希伯来叙事的提示语。所有脚注标记均已置于正文相应词句之后。
