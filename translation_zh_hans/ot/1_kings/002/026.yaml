  text: וּ/לְ/אֶבְיָתָ֨ר הַ/כֹּהֵ֜ן אָמַ֣ר הַ/מֶּ֗לֶךְ עֲנָתֹת֙ לֵ֣ךְ עַל שָׂדֶ֔י/ךָ כִּ֛י אִ֥ישׁ מָ֖וֶת אָ֑תָּה וּ/בַ/יּ֨וֹם הַ/זֶּ֜ה לֹ֣א אֲמִיתֶ֗/ךָ כִּֽי נָשָׂ֜אתָ אֶת אֲר֨וֹן אֲדֹנָ֤/י יְהֹוִה֙ לִ/פְנֵי֙ דָּוִ֣ד אָבִ֔/י וְ/כִ֣י הִתְעַנִּ֔יתָ בְּ/כֹ֥ל אֲשֶֽׁר הִתְעַנָּ֖ה אָבִֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/026.yaml
  text: And to Abiathar the priest the king said[a], “Go to Anathoth, to your field, for you are a man deserving death; but on this day I will not put you to death, because you carried the ark of the Lord GOD before David my father, and because you shared in all the affliction with which my father was afflicted.”
translation:
  language: zh_hans
  text: 王对祭司亚比亚他说：“你到亚拿突你自己的田地去吧！你本是该死的人[a]，但今天我不处死你；因为你曾在我父亲大卫面前抬过主雅威的约柜，也因为我父亲所受的一切苦，你也都一同受过。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语直译为“死亡之人”，意思是应当被处死或可判死刑的人。
    reason: 解释希伯来语惯用语，防止中文“该死”被误解为单纯的咒骂。
lexical_decisions:
- source_word: עֲנָתֹת
  choice: 亚拿突
  rationale: 地名按现代中文圣经常用音译处理。
- source_word: עַל שָׂדֶיךָ
  choice: 回……自己的田地去
  rationale: 原文直译为“到你的田地上”；结合放逐回乡的语境，用“回……自己的田地去”自然表达方向，同时保留具体的“田地”，不扩大为“产业”。
- source_word: אִישׁ מָוֶת
  choice: 该死的人
  rationale: 这是希伯来语惯用语，字面为“死亡之人”，意思是应当被处死或可判死刑的人。“该死的人”在中文中简洁有力，脚注说明其司法语义，避免仅被理解为咒骂。
- source_word: אֲמִיתֶךָ
  choice: 我不处死你
  rationale: מות的使役式意为“使之死、处死”；本段具有君王裁决的司法语境，因此“处死”比一般的“杀死”准确。
- source_word: נָשָׂאתָ אֶת אֲרוֹן אֲדֹנָי יְהוִה
  choice: 你曾……抬过主耶和华的约柜
  rationale: נשא在这里指实际抬运约柜；中文用“抬”符合多人肩抬圣物的语境。复合神名אֲדֹנָי יְהוִה译为“主耶和华”，保留两个称谓。
- source_word: לִפְנֵי דָוִד אָבִי
  choice: 在我父亲大卫面前
  rationale: 保留לִפְנֵי的空间或关系含义，不额外解释为“侍奉”或“领导”。
- source_word: הִתְעַנִּיתָ ... הִתְעַנָּה
  choice: 我父亲所受的一切苦，你也都一同受过
  rationale: 两个同根动词形成呼应，表达亚比亚他与大卫共同经历苦难；中文以“受……苦／一同受过”保留重复与同受苦难之意。
- source_word: כִּי ... וְכִי
  choice: 因为……也因为
  rationale: 两个分句都说明所罗门当日不处死亚比亚他的理由，中文明确保留并列的因果关系。
theological_decisions:
- issue: 复合神名 אֲדֹנָי יְהוִה 的译法
  choice: 主耶和华
  alternative: 主雅威
  rationale: “主耶和华”在现代中文基督教文本中辨识度高，并同时呈现אֲדֹנָי与四字神名；不把两者压缩成单一称号。
- issue: 亚比亚他与大卫苦难关系的表达
  choice: 一同受过
  alternative: 凡我父亲所受的苦，你都受过
  rationale: 原文同根形式可表达亲身受苦以及与大卫共同经历苦难。“一同”呈现其连带性，但不进一步赋予代赎或宗派性含义。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。君王的命令用“去吧”，裁决用“处死”；保留“田地”“抬约柜”“在……面前”等原文具体意象，并以适度调整的中文语序确保普通读者易懂。
