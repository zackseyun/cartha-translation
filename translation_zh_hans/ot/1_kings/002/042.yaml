  text: וַ/יִּשְׁלַ֨ח הַ/מֶּ֜לֶךְ וַ/יִּקְרָ֣א לְ/שִׁמְעִ֗י וַ/יֹּ֨אמֶר אֵלָ֜י/ו הֲ/ל֧וֹא הִשְׁבַּעְתִּ֣י/ךָ בַֽ/יהוָ֗ה וָ/אָעִ֤ד בְּ/ךָ֙ לֵ/אמֹ֔ר בְּ/י֣וֹם צֵאתְ/ךָ֗ וְ/הָֽלַכְתָּ֙ אָ֣נֶה וָ/אָ֔נָה יָדֹ֥עַ תֵּדַ֖ע כִּ֣י מ֣וֹת תָּמ֑וּת וַ/תֹּ֧אמֶר אֵלַ֛/י ט֥וֹב הַ/דָּבָ֖ר שָׁמָֽעְתִּי׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/042.yaml
  text: Then the king sent and called for Shimei and said to him[a], “Did I not make you swear by Yahweh and warn you, saying, ‘On the day you go out and go anywhere at all, know for certain that you shall surely die’? And you said to me, ‘The word is good[c][b]; I have heard.’”
translation:
  language: zh_hans
  text: 王就派人把示每召来，对他说：“难道我没有叫你指着雅威起誓，又郑重警告你[a]说：‘你哪一天一出去，无论往哪里去[b]，就要清楚知道，你必死无疑’吗？你曾对我说：‘这话很好[c]，我听见了。’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “郑重警告你”也可译作“向你作证”或“郑重告诫你”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译为“到这里或那里去”，是指到任何地方去。
    reason: lexical_alternative
  - marker: c
    text: “这话很好”也可译作“这事很好”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הִשְׁבַּעְתִּיךָ בַיהוָה
  choice: 叫你指着雅威起誓
  rationale: 保留使役形式“使某人起誓”，并以自然的现代汉语表达希伯来语的起誓公式。
- source_word: בַיהוָה
  choice: 指着雅威
  rationale: 介词 בְּ 在这里引出起誓所凭的对象；יהוה 作为上帝的专名音译为“雅威”。
- source_word: וָאָעִד בְּךָ
  choice: 郑重警告你
  rationale: עוד 的使役式在此可指警告、郑重告诫或作证指控；上下文是所立誓约附带的正式禁令，因此正文采用自然且符合语境的“郑重警告”，并在脚注保留司法性较强的可能译法。
- source_word: בְּיוֹם צֵאתְךָ
  choice: 你哪一天出去
  rationale: 将带后缀的不定词结构转为自然的汉语时间从句，同时保留“在……之日”的条件意味。
- source_word: וְהָלַכְתָּ אָנֶה וָאָנָה
  choice: 到任何地方去
  rationale: אָנֶה וָאָנָה 字面为“这里或那里”，在本句中表示目的地不受限定；“到任何地方去”准确传达其范围与强调。
- source_word: יָדֹעַ תֵּדַע
  choice: 要清楚知道
  rationale: 不定词绝对式与限定动词连用以加强语气；“要清楚知道”保留郑重确认后果的意味，避免生硬重复。
- source_word: מוֹת תָּמוּת
  choice: 必死无疑
  rationale: 不定词绝对式加强“死”的确定性；“必死无疑”以庄严而自然的汉语表达这一强调。
- source_word: טוֹב הַדָּבָר
  choice: 这话很好
  rationale: דָּבָר 可指话语或事情；这里回应所宣告的条件，译为“这话”保留言语行为的指向，脚注注明另一可能。
- source_word: שָׁמָעְתִּי
  choice: 我听见了
  rationale: 按字面保留“听见”的表达；该词在法律或约定语境中或可暗含接受、服从，但正文不把这一含义明说出来。
theological_decisions:
- issue: יהוה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名 יהוה；“雅威”较贴近学界通常重构的读音，并明确保留其专名性质。
- issue: שָׁמָעְתִּי 是否明译为接受或顺从
  choice: 我听见了
  alternative: 我听从了／我接受了
  rationale: 虽然“听”在盟约和法律语境中可能蕴含接受或服从，但原文仍保有语义张力，因此不在正文中强化为“听从”。
translation_notes:
  register: 采用现代、庄重而易懂的叙事与司法语体。“派人召……来”自然表达王命差人传召；两个加强结构分别译为“要清楚知道”和“必死无疑”，既传达原文强调，也避免机械重复。所有脚注标记均置于正文相应词语之后。
