  text: As the days of David drew near for him to die[a], he commanded Solomon his son, saying,
translation:
  language: zh_hans
  text: 大卫离世的日子临近了[a]，他嘱咐儿子所罗门说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“大卫的日子临近，要死了。”这是希伯来语习惯说法，意思是大卫去世的时候近了。
    reason: 保留原文以“日子”为主语、以死亡描述死期将至的表达方式。
lexical_decisions:
- source_word: וַיִּקְרְבוּ
  choice: 临近了
  rationale: 该词是קרב的Qal连续式未完成时复数形式，以“日子”为主语，表达时间逐渐接近；“临近了”既保留空间上的接近隐喻，也符合现代汉语表达。
- source_word: יְמֵי דָוִד
  choice: 大卫……的日子
  rationale: 原文为“大卫的日子”这一领属结构；译文与לָמוּת合译为“大卫离世的日子”，保留“日子”意象，同时使汉语自然。
- source_word: לָמוּת
  choice: 离世
  rationale: 这是מות（死）的不定词，前有ל，语境指大卫将死。“离世”是现代汉语中庄重而清楚的死亡表达，未改变事件本身；脚注保留较直译的结构。
- source_word: וַיְצַו
  choice: 嘱咐
  rationale: צוה可指命令、吩咐或郑重交代。此处是父亲临终向继承人所作的严肃交代，“嘱咐”兼顾权威性、临终语境和自然汉语。
- source_word: אֶת שְׁלֹמֹה בְנוֹ
  choice: 儿子所罗门
  rationale: 原文意为“所罗门，他的儿子”。汉语用“儿子所罗门”自然表达同位关系，信息完整。
- source_word: לֵאמֹר
  choice: 说
  rationale: 该不定词是引出下文直接引语的常规形式；汉语以“说”简洁、自然地承接后文。
theological_decisions: []
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。“离世的日子临近了”保留希伯来文的时间意象，又避免逐字翻译造成生硬；“嘱咐”贴合父亲临终郑重交代后事的语境。
