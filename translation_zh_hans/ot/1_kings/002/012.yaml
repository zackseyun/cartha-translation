  text: וּ/שְׁלֹמֹ֕ה יָשַׁ֕ב עַל כִּסֵּ֖א דָּוִ֣ד אָבִ֑י/ו וַ/תִּכֹּ֥ן מַלְכֻת֖/וֹ מְאֹֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/012.yaml
  text: And Solomon sat on the throne of David his father[a], and his kingdom was firmly established.
translation:
  language: zh_hans
  text: 所罗门坐在他父亲大卫的宝座上；他的王国极其稳固。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “王国”也可译作“王权”或“统治”；末句也可译作“他的统治十分安定”或“他的王权牢固确立了”。
    reason: 原文מַלְכוּת可指王国、王权或统治；וַתִּכֹּן מְאֹד表示其处境或统治被牢固确立、十分稳固。
lexical_decisions:
- source_word: יָשַׁב
  choice: 坐在
  rationale: 与“宝座”连用，表示所罗门承接王位并占据君王之位；保留原文“坐”的形象，避免把含义扩写得过多。
- source_word: כִּסֵּא
  choice: 宝座
  rationale: 上下文是大卫王位的继承，因此指君王的宝座，而非普通座位。
- source_word: אָבִיו
  choice: 他父亲
  rationale: 大卫是所罗门的亲生父亲，此处按直接亲属关系翻译。
- source_word: וַתִּכֹּן
  choice: 就……稳固
  rationale: Nifal词形在这里表达被确立、达到安稳状态的结果；“稳固”在现代汉语中自然涵盖确立与安定之意。
- source_word: מַלְכֻתוֹ
  choice: 他的王权
  rationale: מַלְכוּת可指王权、统治或国度；此处紧接所罗门登位，重点较可能在其君王统治的稳定，但原词仍有语义幅度，故以脚注保留其他可能。
- source_word: מְאֹד
  choice: 极其
  rationale: 直接体现原文强烈的程度修饰，同时与“稳固”搭配自然庄重。
theological_decisions:
- issue: 大卫宝座继承语言的神学含义
  choice: 按历史叙事译为所罗门承接大卫的王位，并说明其王权稳固
  alternative: 在译文中强化其王朝合法性或后来的弥赛亚含义
  rationale: 本节直接陈述所罗门登位及其统治趋于稳固；虽在更广正典语境中可有进一步意义，本节本身并未明说，因此不将其加入正文。
- issue: מַלְכוּת所指范围
  choice: 王权
  alternative: 国度；统治；王位
  rationale: 本节语境主要关乎所罗门即位后君王权力的确立；但原词可兼指其统治或国度，故不把其他理解排除，而在脚注中说明。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“坐在……宝座上”保留希伯来文的王位意象；“极其稳固”简洁呈现原文的结果状态与强烈程度。脚注标记置于其所说明的分句之后。
