base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/038.yaml
  text: Shimei said to the king[a], “The word is good. Just as my lord the king has spoken, so your servant will do.” And Shimei lived in Jerusalem many days.
translation:
  language: zh_hans
  text: 示每对王说：“这话很好[a]。我主、我王怎样说，仆人必怎样做。”于是，示每在耶路撒冷住了很长一段时间。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“这事很好”或“你所说的很好”。
    reason: 词义替代：希伯来文דָּבָר可指“话”或“事”；此处示每回应王所说的条件。
lexical_decisions:
- source_word: טוֹב הַדָּבָר
  choice: 这话很好
  rationale: דָּבָר 可指“话、事情、事项”。此处示每回应王刚才所说的条件，译作“这话很好”既保留原文“话”的直接性，也符合现代汉语表达。
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: 我的主我王
  rationale: 这是对君王的恭敬称呼；“我的主我王”保留两个称谓及其宫廷语气，同时不额外强化奴役含义。
- source_word: כֵּן יַעֲשֶׂה עַבְדֶּךָ
  choice: 你仆人就怎样做
  rationale: “你仆人”是臣民在王面前谦称自己的惯用说法；未完成式在此表达将来的承诺，因此译为“就……做”。
- source_word: וַיֵּשֶׁב
  choice: 住了
  rationale: יָשַׁב 在居住语境中通常指“居住”；“住了”是清楚自然的现代汉语，并符合示每受命留在耶路撒冷的上下文。
- source_word: יָמִים רַבִּים
  choice: 许多日子
  rationale: 按原文保留“许多日子”的表达，表示一段较长但未明确限定的时间。
- source_word: שִׁמְעִי
  choice: 示每
  rationale: 采用中文圣经人名的通行译名。
- source_word: בִּירוּשָׁלִַם
  choice: 在耶路撒冷
  rationale: 采用中文圣经地名的通行译名，并直接表达原文介词。
