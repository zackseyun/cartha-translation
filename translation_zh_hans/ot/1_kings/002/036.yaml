base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/036.yaml
  text: Then the king sent and called for Shimei and said to him[a], “Build yourself a house in Jerusalem and live there, and do not go out from there anywhere.”
translation:
  language: zh_hans
  text: 于是，王派人去召示每来，对他说：“你要在耶路撒冷为自己建一座房子，住在那里，不可从那里出去，到别处去。[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语习语直译为“到这边或那边”，意思是到任何别处。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח הַמֶּלֶךְ וַיִּקְרָא לְשִׁמְעִי
  choice: 王派人去召示每来
  rationale: 两个连续动词直译为“王派遣并召来”，但现代汉语用“派人去召”即可自然保留派遣与召唤两个动作，并体现君王下令召见的语境。
- source_word: בְּנֵה לְךָ בַיִת
  choice: 你要……为自己建一座房子
  rationale: 命令式译为“你要……建”，לְךָ 表示为自身利益；“房子”保留 בַיִת 在此处作为实际住所的含义。
- source_word: בִּירוּשָׁלִַם
  choice: 在耶路撒冷
  rationale: 按标准地名和处所表达翻译。
- source_word: וְיָשַׁבְתָּ שָׁם
  choice: 住在那里
  rationale: יָשַׁב 在居住限制的语境中指持续居住；“住”是自然、明确的现代汉语。
- source_word: וְלֹא תֵצֵא מִשָּׁם
  choice: 不可从那里出去
  rationale: 贴近原文“不要从那里出去”，并清楚表达禁止离开耶路撒冷的命令。
- source_word: אָנֶה וָאָנָה
  choice: 到别处去
  rationale: 该分配性习语字面近于“这边或那边”，在禁令中意为不可去任何别处；正文采用自然汉语，并以脚注保留字面意象。
