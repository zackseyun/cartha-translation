base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/037.yaml
  text: For on the day you go out and cross the Kidron Valley[a], know for certain that you shall surely die[b]; your blood shall be on your own head.
translation:
  language: zh_hans
  text: 你要确实知道：你出去、越过汲沦谷[a]的那一天，你必死无疑；你的血必归到你自己头上[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “谷”或译“溪”“干河谷”。希伯来语 נחל 可指谷地、干河谷或季节性水道。
    reason: lexical_alternative
  - marker: b
    text: “你的血必归到你自己头上”是希伯来语的惯用说法，意思是你自己要为自己的死亡承担责任。
    reason: cultural_note
lexical_decisions:
- source_word: וְהָיָה בְּיוֹם
  choice: 因为……的那一天
  rationale: 该结构承接上文，郑重引出示每违令时必有的后果；“那一天”保留原文法律警告的庄重语气，“因为”则自然表达此句对禁令的解释。
- source_word: צֵאתְךָ
  choice: 你出去
  rationale: 直接表达带第二人称后缀的不定式结构，指离开所限定的范围。
- source_word: וְעָבַרְתָּ אֶת נַחַל קִדְרוֹן
  choice: 过了汲沦谷
  rationale: עבר表示越过；נחל可指谷地、干河谷或季节性水道。正文采用现代汉语中自然且符合地理称谓的“汲沦谷”，并以脚注保留词义范围。
- source_word: יָדֹעַ תֵּדַע
  choice: 你要确实知道
  rationale: 不定式绝对形与限定动词连用表示强调；“确实知道”传达不可怀疑、务必认清的语气。
- source_word: כִּי מוֹת תָּמוּת
  choice: 你必死无疑
  rationale: 原文再次以不定式绝对形强化死亡的确定性；“必死无疑”在现代汉语中简洁有力。
- source_word: דָּמְךָ יִהְיֶה בְרֹאשֶׁךָ
  choice: 你流血丧命的责任要归到自己头上
  rationale: 保留“血”和“头上”的希伯来意象，同时补出汉语读者理解该司法责任惯用语所需的“责任”，表明死亡后果由本人承担。
theological_decisions:
- issue: 司法处死语境中的流血责任公式
  choice: 正文保留“血”与“归到自己头上”的意象，并明确其责任含义
  alternative: 你的血要归到你头上；你要为自己的死负责
  rationale: 该表达强调示每若违令便须自行承担死亡责任。译文既不把它弱化为一般后果，也不额外判定执行方式或引入教派性解释。
translation_notes:
  register: 采用现代、庄重而易懂的司法警告语体。以两个强调表达“确实知道”“必死无疑”对应原文两处不定式绝对形；正文脚注标记[a]、[b]均已呈现。
