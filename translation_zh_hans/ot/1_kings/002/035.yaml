  yaml_path: translation/ot/1_kings/002/035.yaml
  text: And the king appointed Benaiah son of Jehoiada in his place over the army[a], and the king appointed Zadok the priest in place of Abiathar.
translation:
  language: zh_hans
  text: 王任命耶何耶大的儿子比拿雅接替他[a]统领军队；王又任命祭司撒督接替亚比亚他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“在他的位置”；这里的“他”依据紧接的上下文是指约押。
    reason: cross_reference
lexical_decisions:
- source_word: וַיִּתֵּן / נָתַן
  choice: 任命
  rationale: 该动词字面可指“给、安置”，但在这里表示将人安置在职分上；“任命”自然传达行政任职的含义。
- source_word: תַּחְתָּיו
  choice: 接替约押
  rationale: 原文直译为“代替他”；结合紧接的上下文，代词所指是已被处死并撤去军权的约押。正文明确所指，脚注保留原文的代词形式。
- source_word: עַל הַצָּבָא
  choice: 统领军队
  rationale: 介词短语字面为“在军队之上”，在此表示担任军队统帅；“统领军队”符合现代汉语表达。
- source_word: בְּנָיָהוּ בֶן־יְהוֹיָדָע
  choice: 耶何耶大的儿子比拿雅
  rationale: 按现代汉语自然语序表达希伯来语父名结构，并采用常见中文圣经人名译法。
- source_word: צָדוֹק הַכֹּהֵן
  choice: 祭司撒督
  rationale: 保留其职衔，并按现代汉语自然的同位结构排列。
- source_word: תַּחַת אֶבְיָתָר
  choice: 接替亚比亚他
  rationale: תַּחַת在此表示职位上的替代；“接替”简洁表达继任关系。
- source_word: הַמֶּלֶךְ
  choice: 王
  rationale: 定冠词加王的称号在上下文中指所罗门；依原文在第二分句再次保留“王”，兼顾忠实与节奏。
