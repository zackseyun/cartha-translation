  text: וַ/יֻּגַּ֖ד לִ/שְׁלֹמֹ֑ה כִּי הָלַ֨ךְ שִׁמְעִ֧י מִ/ירוּשָׁלִַ֛ם גַּ֖ת וַ/יָּשֹֽׁב־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/041.yaml
  text: And it was reported to Solomon that Shimei had gone from Jerusalem to Gath and had returned.
translation:
  language: zh_hans
  text: 有人禀报所罗门说，示每离开耶路撒冷去了迦特，又回来了。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֻּגַּד
  choice: 有人禀报
  rationale: 该动词是被动叙事形式，表示消息被告知，却不指出传信者。现代汉语若直译为“有人告诉”略失被动焦点；“有人禀报”自然地表达消息上达君王，同时不具体说明禀报者。
- source_word: לִשְׁלֹמֹה
  choice: 所罗门
  rationale: 介词 לִ 标明消息的接受者；在“禀报所罗门”中，汉语无需另加介词。
- source_word: כִּי
  choice: 说
  rationale: 此处引出所禀报的内容。汉语用“说”连接间接引语，比机械译作“即”或“这事”更自然。
- source_word: הָלַךְ
  choice: 离开……去了
  rationale: הלך 表示前往；结合起点 מִירוּשָׁלִַם 和无介词的目的地 גַּת，译作“离开耶路撒冷去了迦特”，清楚呈现移动的起点与终点。
- source_word: שִׁמְעִי
  choice: 示每
  rationale: 采用现代中文圣经中通行的人名音译。
- source_word: מִירוּשָׁלִַם
  choice: 离开耶路撒冷
  rationale: 前缀 מִ 表示移动的起点；“离开”与后面的“去了”搭配自然。
- source_word: גַּת
  choice: 迦特
  rationale: 该地名虽无显式方向介词，却在句中充当前往的目的地；采用通行音译“迦特”。
- source_word: וַיָּשֹׁב
  choice: 又回来了
  rationale: שׁוב 表示返回。连词 וַ 延续叙事；“又”自然连接去与回两个已经完成的动作，“回来”保留返回原处的含义。
