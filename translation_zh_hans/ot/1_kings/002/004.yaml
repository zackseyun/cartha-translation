  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: לְמַעַן֩ יָקִ֨ים יְהוָ֜ה אֶת דְּבָר֗/וֹ אֲשֶׁ֨ר דִּבֶּ֣ר עָלַ/י֮ לֵ/אמֹר֒ אִם יִשְׁמְר֨וּ בָנֶ֜י/ךָ אֶת דַּרְכָּ֗/ם לָ/לֶ֤כֶת לְ/פָנַ/י֙ בֶּ/אֱמֶ֔ת בְּ/כָל לְבָבָ֖/ם וּ/בְ/כָל נַפְשָׁ֑/ם לֵ/אמֹ֕ר לֹֽא יִכָּרֵ֤ת לְ/ךָ֙ אִ֔ישׁ מֵ/עַ֖ל כִּסֵּ֥א יִשְׂרָאֵֽל־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/004.yaml
  text: so that Yahweh may establish his word that he spoke concerning me[a], saying, ‘If your sons keep their way by walking before me in truth with all their heart and with all their soul,’ saying[c][b], ‘A man of yours shall not be cut off from upon the throne of Israel.’
translation:
  language: zh_hans
  text: 好使耶和华坚立他曾论到我所说的话[a]，说：“你的儿子们若谨守自己的道路，以全心全意的忠诚行在我面前[b]，”又说：“你的后裔必不断有人坐在以色列的王位上。”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “论到我所说”也可理解为“对我所说”。
    reason: 介词עַל在此通常表示“关于”，但语境上也有人理解为受话对象。
  - marker: b
    text: “忠诚”也可译作“真实”或“正直”；“全心全意”原文直译为“以他们全部的心和全部的生命”。
    reason: 保留אֱמֶת的语义幅度，并说明中文惯用表达背后的希伯来措辞。
  - marker: c
    text: 原文直译：“属你的人必不从以色列的王位上被剪除。”这是说，大卫的后裔不会断绝作王的人。
    reason: 正文采用自然中文表达，脚注保存被动式“被剪除”及מֵעַל的字面形态。
lexical_decisions:
- source_word: לְמַעַן
  choice: 好使
  rationale: 引出目的或结果，衔接上文自然。
- source_word: יָקִים
  choice: 坚立
  rationale: 使之站立、确立；在应许语境中兼有确认并使之实现的意味。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经传统中对四字神名的通行音译，而非以称号替代。
- source_word: דְּבָרוֹ
  choice: 他……所说的话
  rationale: 保留“话”的基本含义，同时适合本句中文结构；语境中所指为应许。
- source_word: דִּבֶּר עָלַי
  choice: 论到我所说
  rationale: עַל在此自然表示“关于、论到”，不改译为“对我说”。
- source_word: יִשְׁמְרוּ בָנֶיךָ אֶת דַּרְכָּם
  choice: 你的子孙若谨守自己的道路
  rationale: שׁמר译为“谨守”；“子孙”自然表达王朝后裔，不局限于大卫的直接儿子；“道路”保留行为方式的希伯来隐喻。
- source_word: לָלֶכֶת לְפָנַי
  choice: 行在我面前
  rationale: 保留“行走”的圣约性隐喻，并在中文中自然表达生活行事。
- source_word: בֶּאֱמֶת
  choice: 忠诚地
  rationale: 此处描述人在神面前的行事，אֱמֶת可指真实、忠信或正直；正文选“忠诚地”，脚注保留其他可能。
- source_word: בְּכָל לְבָבָם וּבְכָל נַפְשָׁם
  choice: 全心全意
  rationale: 自然表达“以全部的心和全部的生命/人”，避免现代中文把“灵魂”误解为与整个人分离的部分；脚注说明字面形式。
- source_word: לֹא יִכָּרֵת לְךָ אִישׁ מֵעַל כִּסֵּא יִשְׂרָאֵל
  choice: 你的后裔必不断有人坐在以色列的王位上
  rationale: 按希伯来习语传达王朝继承人不会断绝；“坐在王位上”自然体现מֵעַל כִּסֵּא的语境意义。
theological_decisions:
- issue: 大卫之约应许的条件性
  choice: 明确保留“若”所引出的条件
  alternative: 将条件淡化为一般劝勉，或按其他经文直接译成无条件应许
  rationale: 希伯来文明确以אִם提出条件；翻译不替读者调和其与其他大卫之约经文之间的神学张力。
- issue: 应许所指的王朝延续
  choice: 译为“你的后裔必不断有人坐在……王位上”
  alternative: 按字面结构译为“属你的人必不从以色列的王位上被剪除”
  rationale: 正文呈现希伯来习语的实际意义，不额外解释该应许最终如何实现。
translation_notes:
  register: 采用庄重而易懂的现代标准普通话。“耶和华、坚立、谨守、行在我面前”保留经文语域；同时以“子孙、全心全意、不断有人坐在王位上”避免生硬直译。所有脚注标记均置于正文相应位置。
