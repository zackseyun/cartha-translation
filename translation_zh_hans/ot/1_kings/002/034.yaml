base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/034.yaml
  text: Then Benaiah son of Jehoiada went up[a], struck him down, and put him to death[b]; and he was buried at his house in the wilderness.
translation:
  language: zh_hans
  text: 于是，耶何耶大的儿子比拿雅上去[a]，袭击约押，并把他处死；约押被葬在旷野他自己的家宅处[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “上去”也可按这里的行动语境理解为“上前”。希伯来语使用的动词基本义是“上去、登上”。
    reason: lexical_alternative
  - marker: b
    text: “家宅”也可能泛指约押家族的宅地或产业；这里不一定是说他被埋在房屋里面。
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעַל
  choice: 上去
  rationale: 保留עלה“上去、登上”的基本含义；上下文表明比拿雅是前去执行命令，但译文不额外加入原文没有明说的“奉命”或“攻上去”。
- source_word: וַיִּפְגַּע בּוֹ
  choice: 击打约押
  rationale: פגע与介词ב连用，在这里表示带敌意地袭击或击打。译作“击打”既符合处决场景，也不与下一个明确表示使其死亡的动词合并。汉语补出“约押”，使指代清楚。
- source_word: וַיְמִתֵהוּ
  choice: 把他处死
  rationale: מות的使役式意为“使他死、将他处死”。“处死”保留使役意味，并切合执行王命的语境。
- source_word: וַיִּקָּבֵר
  choice: 约押被葬
  rationale: 原文为被动式。汉语明确补出约押为被安葬者，避免连续代词造成歧义。
- source_word: בְּבֵיתוֹ
  choice: 在……自己的住所那里
  rationale: בית可指房屋、家宅或所属地产。用“住所那里”自然表达葬在其住处一带，同时不武断地说尸体埋在屋内。
- source_word: בַּמִּדְבָּר
  choice: 在旷野
  rationale: מדבר通常指旷野、荒野或人烟稀少的牧放地；“旷野”是准确而庄重的现代汉语表达，且不把地貌限定为沙漠。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。保留“击打”与“处死”两个动作，以对应希伯来语两个不同动词；为避免汉语代词含混，两处明确补出“约押”。
