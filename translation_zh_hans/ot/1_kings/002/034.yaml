  rationale: 修订仅改善汉语表达并避免将“家宅”狭义化；保留原文中“上去—袭击—处死—被葬”的叙事次序、两项不同的处决动作及埋葬地点的语义弹性。脚注锚点及其所说明的歧义均予以保留。
