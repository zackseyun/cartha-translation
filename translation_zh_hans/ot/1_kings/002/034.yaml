  source_fidelity: 译文正确保留了עלה的“上去”、פגע的攻击性动作、מות使役式的“处死”，以及ויקבר的被动语态。将约押明说出来有助于消除汉语指代歧义。原稿“旷野自己的住所那里”语序不自然，且“住所”较易限缩为居住的建筑；改为“旷野他自己的家宅处”，能较贴近בביתו并保留家宅、宅地或产业的可能范围。
  naturalness: “击打约押，把他处死”基本可懂，但“袭击约押，并把他处死”更符合现代庄重叙事汉语，也更清楚地区分前一攻击动作和后一致死动作。“约押被葬在旷野他自己的家宅处”自然且简洁。
