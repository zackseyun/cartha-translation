  text: I am going the way of all the earth. So be strong[a], and be a man,
translation:
  language: zh_hans
  text: “我将走世人都要走的路。你要刚强，做个大丈夫[a]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“显明自己是个大丈夫”或“要有男子气概”。希伯来语这一表达既指成为一个男人，也含有勇敢、成熟并担当责任的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: אָנֹכִי
  choice: 我
  rationale: 独立第一人称代词；现代汉语用“我”即可自然表达，无须另加强调。
- source_word: הֹלֵךְ
  choice: 将走
  rationale: Qal主动分词在此表达大卫临近死亡；“将走”既体现迫近性，也保留行路这一隐喻。
- source_word: בְּדֶרֶךְ כָּל הָאָרֶץ
  choice: 世人都要走的路
  rationale: 原文直译近于“全地之路”，是指一切世人共同面对的死亡。“世人都要走的路”在现代汉语中自然，并保留原文的道路隐喻，而不直接释作“死”。
- source_word: וְחָזַקְתָּ
  choice: 你要刚强
  rationale: 带连接词的完成式在语境中具有劝勉意味；“你要刚强”准确传达命令或嘱咐的语气。
- source_word: וְהָיִיתָ לְאִישׁ
  choice: 做个大丈夫
  rationale: 该短语直指成为或显为一个男人，并在语境中包含勇敢、成熟、担当责任的意味。“大丈夫”保留男性指向，同时比生硬的“做一个男人”更符合庄重、自然的现代汉语。
theological_decisions:
- issue: 劝勉语中的男性表达
  choice: 做个大丈夫
  alternative: 做一个男人；显出男子气概
  rationale: 话语由父亲对儿子所说，原文明确使用阳性单数名词 אִישׁ。译文不将其性别中性化，也不把它缩减为单纯勇敢；脚注说明其勇气、成熟和责任感等语用内涵，以避免导入现代性别刻板印象。
translation_notes:
  register: 采用现代、庄重且口语可懂的表达。“世人都要走的路”保留死亡的委婉隐喻；“刚强”符合圣经劝勉语体。“大丈夫”用于保留原文明确的男性称谓及其勇敢、成熟、负责的语境含义。句末逗号依照本节与下一节连续句法保留。
