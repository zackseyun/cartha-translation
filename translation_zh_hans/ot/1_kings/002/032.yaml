source:
  edition: WLC
  text: וְ/הֵשִׁיב֩ יְהוָ֨ה אֶת דָּמ֜/וֹ עַל רֹאשׁ֗/וֹ אֲשֶׁ֣ר פָּגַ֣ע בִּ/שְׁנֵֽי אֲ֠נָשִׁים צַדִּקִ֨ים וְ/טֹבִ֤ים מִמֶּ֨/נּוּ֙ וַ/יַּהַרְגֵ֣/ם בַּ/חֶ֔רֶב וְ/אָבִ֥/י דָוִ֖ד לֹ֣א יָדָ֑ע אֶת אַבְנֵ֤ר בֶּן נֵר֙ שַׂר צְבָ֣א יִשְׂרָאֵ֔ל וְ/אֶת עֲמָשָׂ֥א בֶן יֶ֖תֶר שַׂר צְבָ֥א יְהוּדָֽה־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/032.yaml
  text: 'And Yahweh will return his blood on his own head[a], because he struck down two men more righteous and better than he, and killed them with the sword while my father David did not know it: Abner son of Ner, commander of Israel’s army, and Amasa son of Jether, commander of Judah’s army.'
translation:
  language: zh_hans
  text: 雅威必使他所流的血归到他自己头上[a]，因为他袭击了两个比他更正直、更好的人，并用刀杀了他们；我父亲大卫对此并不知情。这两人就是以色列军队的统帅、尼珥的儿子押尼珥，以及犹大军队的统帅、益帖的儿子亚玛撒。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“雅威必使他的血债归到他头上”。这是希伯来语的惯用说法，表示杀人流血的责任和报应归到行凶者本人。
    reason: 说明希伯来语“血归到头上”的惯用含义及可选译法。
lexical_decisions:
- source_word: וְהֵשִׁיב
  choice: 必使……归到
  rationale: 该词为שוב的使役形，在这里表达报应临到的意思；“使……归到”保留希伯来文血归到凶手头上的意象。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按辅音所代表的神圣名字直接音译，而不以称号替代。
- source_word: דָּמוֹ עַל רֹאשׁוֹ
  choice: 他所流之血归到他自己头上
  rationale: 此处“他的血”在语境中指他杀人流血所负的血债；译文保留“归到头上”的原文惯用意象，并用“所流”帮助现代读者理解。
- source_word: פָּגַע
  choice: 袭击
  rationale: 该动词在此指敌意攻击；后文另以“杀了”明确结果，因此“袭击”避免把两个动词完全合并。
- source_word: צַדִּקִים וְטֹבִים מִמֶּנּוּ
  choice: 比他正直、比他良善
  rationale: 保留צדיקים的道德及司法意味和טובים的比较评价，也保留两个形容词并列的表达。
- source_word: וַיַּהַרְגֵם בַּחֶרֶב
  choice: 用刀杀了他们
  rationale: 直接表达杀害行为，并保留בַּחֶרֶב的工具意义；中文“刀”适合这里泛指用于杀人的刃器。
- source_word: וְאָבִי דָוִד לֹא יָדָע
  choice: 趁我父亲大卫不知情
  rationale: 将连接词理解为伴随情境，说明约押行凶时大卫并不知情；“趁”自然体现这种背景关系，但不表示大卫后来始终不知道。
- source_word: שַׂר צְבָא
  choice: 军队的统帅
  rationale: 以现代、庄重而清楚的军事称谓表达军队最高指挥官，并在以色列与犹大两处一致处理。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文明确使用四字神名；“雅威”直接保存其作为专名的性质，不用称号取代。
- issue: “血归到头上”惯用语的含义
  choice: 保留血归到本人头上的意象，并以“他所流之血”提示血债和报应
  alternative: 直译为“他的血归到他头上”；意译为“使他承担血债”
  rationale: 此语指杀人者为流血负责，并承受相应报应。正文兼顾原文意象和可懂度，脚注注明另一种简明解释。
- issue: 大卫“不知道”的语用关系
  choice: 大卫在行凶时不知情
  alternative: 仅作并列句“我父亲大卫不知道”
  rationale: 上下文重在表明这两次杀害未经大卫知晓或授权；译文不进一步推断大卫是否在事后得知。
translation_notes:
  register: 采用现代标准书面汉语，语气庄重而清楚。人名按常见中文圣经传统译名处理；“统帅”体现军事职衔。“正直、良善”保留原文两项比较判断，不将צדיקים缩窄为单纯“无辜”。
