  text: וַ/יֹּ֧אמֶר ל֣/וֹ הַ/מֶּ֗לֶךְ עֲשֵׂה֙ כַּ/אֲשֶׁ֣ר דִּבֶּ֔ר וּ/פְגַע בּ֖/וֹ וּ/קְבַרְתּ֑/וֹ וַ/הֲסִירֹ֣תָ דְּמֵ֣י חִנָּ֗ם אֲשֶׁר֙ שָׁפַ֣ךְ יוֹאָ֔ב מֵ/עָלַ֕/י וּ/מֵ/עַ֖ל בֵּ֥ית אָבִֽ/י־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/031.yaml
  text: Then the king said to him[a], “Do as he has said, and strike him down and bury him[b], and remove from me and from my father’s house the innocent blood that Joab shed.”
translation:
  language: zh_hans
  text: 王对他说：“照他所说的去做，击杀他[a]，将他埋葬，好从我和我父家除去约押所流的无辜之血[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里的希伯来语说法直译近似“袭击他”，在本语境中是指将他处死。
    reason: lexical_alternative
  - marker: b
    text: “无辜之血”是希伯来语的法律和道德用语，指无正当理由杀人所流的血，也含有由此产生的流血罪责。
    reason: cultural_note
lexical_decisions:
- source_word: עֲשֵׂה כַּאֲשֶׁר דִּבֶּר
  choice: 照他所说的去做
  rationale: 直接表达遵照约押刚才所说之话行事，保留命令的简洁力度。
- source_word: וּפְגַע בּוֹ
  choice: 击杀他
  rationale: פגע与ב连用在此处指以暴力击打并处死；“击杀”既传达致命结果，也保留原文动作色彩。
- source_word: וּקְבַרְתּוֹ
  choice: 将他埋葬
  rationale: 忠实保留紧接处死之后的第二项命令。
- source_word: וַהֲסִירֹתָ
  choice: 好……除去
  rationale: 命令链之后的形式在语境中可表达预期结果或目的；“好”自然呈现这一联系，同时不把因果关系说得过强。
- source_word: דְּמֵי חִנָּם
  choice: 无辜之血
  rationale: 保留希伯来语具体的法律—道德意象，指无正当理由流血杀人所带来的罪责。
- source_word: מֵעָלַי וּמֵעַל בֵּית אָבִי
  choice: 从我和我父家除去
  rationale: 保留罪责仿佛压在个人及家族之上的原文意象，不改写成较抽象的神学术语。
theological_decisions:
- issue: 无辜流血的罪责是否落在所罗门及其父家之上
  choice: 保留“从我和我父家除去……无辜之血”的具体说法
  alternative: 译作“使我和我父家脱离流无辜人之血的罪责”
  rationale: 原文以“血”被从人和家族身上除去的意象表达罪责；正文保留这一法律与神学张力，脚注说明其含义，而不将意象完全抽象化。
- issue: וַהֲסִירֹתָ与前述命令的逻辑关系
  choice: 译作“好……除去”，容纳目的与结果两层意味
  alternative: 译作“并除去”
  rationale: 该形式接续一连串命令，可指预期结果或目的；中文“好”较自然，也不把它限定为纯粹并列。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。命令句保持简洁有力；“我父家”保留古代家族与王室宗族的含义；脚注标记分别紧随其所解释的词语。
