base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/010.yaml
  text: Then David slept with his fathers and was buried in the city of David[a].
translation:
  language: zh_hans
  text: 大卫与他的列祖同睡[a]，葬在大卫城。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “与他的列祖同睡”是希伯来语中表示死亡的惯用说法。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: 同睡
  rationale: שׁכב本义为“躺卧、睡下”；在君王去世的记述中是死亡的惯用表达。保留“睡”既传达希伯来文意象，也维持此类讣告用语的文学连贯性。
- source_word: עִם אֲבֹתָיו
  choice: 与他的列祖
  rationale: 这是死亡记述中的固定表达。“列祖”在现代中文圣经语体中庄重而清楚，并保留原文的家族与世代关联；译作“祖先”虽更口语化，却会削弱该公式化表达。
- source_word: וַיִּקָּבֵר
  choice: 葬在
  rationale: Nifal形态在此表达被动意义，即“被安葬”。汉语“葬在”自然简洁，被动含义可由语境明确体现。
- source_word: בְּעִיר דָּוִד
  choice: 在大卫城
  rationale: 此处是专名式地点称谓，指大卫城。“大卫城”是准确、简洁且通行的现代汉语表达。
- source_word: וַ
  choice: 不另译
  rationale: 句首连接词推进叙事；本节在现代汉语中直接以“大卫”起句更自然，先后关系由上下文充分表达，无须机械译为“于是”或“然后”。
theological_decisions:
- issue: “与列祖同睡”是否直接意译为“死了”
  choice: 保留“与他的列祖同睡”并加注解释
  alternative: 译为“死了”或“归到他的祖先那里”
  rationale: 原文以死亡委婉语陈述大卫之死。保留意象可避免把其潜在文学和神学张力过早化约为单一解释；脚注则确保普通读者理解。
translation_notes:
  register: 采用庄重、简洁的现代标准汉语。“列祖”“同睡”保留王室讣告公式的文学色彩，并用脚注消除理解障碍；“大卫城”按专名处理。
