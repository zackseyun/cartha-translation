  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר הַ/מֶּ֜לֶךְ אֶל שִׁמְעִ֗י אַתָּ֤ה יָדַ֨עְתָּ֙ אֵ֣ת כָּל הָ/רָעָ֗ה אֲשֶׁ֤ר יָדַע֙ לְבָ֣בְ/ךָ֔ אֲשֶׁ֥ר עָשִׂ֖יתָ לְ/דָוִ֣ד אָבִ֑/י וְ/הֵשִׁ֧יב יְהוָ֛ה אֶת רָעָתְ/ךָ֖ בְּ/רֹאשֶֽׁ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/044.yaml
  text: Then the king said to Shimei[a], “You know all the evil that your heart knows, which you did to David my father[b]; and Yahweh has returned your evil on your own head.”
translation:
  language: zh_hans
  text: 王对示每说：“你自己心里清楚[a]，你向我父亲大卫所行的一切恶事；雅威已经使你的恶归到[b]你自己头上。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“你的心知道。”这句话强调示每内心明知自己的罪责。
    reason: 保留希伯来语拟人化表达及其内在道德意识的含义。
  - marker: b
    text: “归到”也可译作“归回”或“偿还”。原文动词是使役式，表示雅威使示每所行的恶返回到他本人身上。
    reason: 说明使役动词的词义与报应归回的意象。
lexical_decisions:
- source_word: וַיֹּאמֶר הַמֶּלֶךְ
  choice: 王又……说
  rationale: 叙事体的连续式推进情节；“又”自然承接上文，同时保留“王”这一确定称号。
- source_word: אַתָּה יָדַעְתָּ
  choice: 你自己……清楚
  rationale: 独立人称代词 אַתָּה 带有强调作用；“你自己”体现这种强调，“清楚”符合当面对质的现代汉语表达。
- source_word: כָּל הָרָעָה
  choice: 一切恶事
  rationale: רָעָה 在这里指示每对大卫所行的道德恶行；“恶事”既保留道德分量，也比抽象的“一切邪恶”更符合具体语境。
- source_word: אֲשֶׁר יָדַע לְבָבְךָ
  choice: 心里清楚
  rationale: 希伯来文直译为“你的心知道”，强调示每内在的知罪意识；正文采用自然汉语，直译意象收入脚注。
- source_word: אֲשֶׁר עָשִׂיתָ לְדָוִד אָבִי
  choice: 你向我父亲大卫所行的
  rationale: 忠实保留行为的对象以及“我父亲大卫”的关系表达；“向……所行”庄重而自然。
- source_word: וְהֵשִׁיב
  choice: 必使……归到
  rationale: שׁוב 的使役式表达使某事返回；“使……归到”保留恶行返回本人身上的意象。结合所罗门宣告惩罚的语境，连接式完成时采用将来性的“必”。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见音译呈现四字神名，不以称号替代专名。
- source_word: אֶת רָעָתְךָ
  choice: 你的恶
  rationale: 与前面的 רָעָה 形成有意呼应，显出所行之恶回到行为者身上的对应关系。
- source_word: בְּרֹאשֶׁךָ
  choice: 到你自己头上
  rationale: 保留希伯来语关于罪责或报应落回行为者头上的身体意象；“自己”加强归于本人之意。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；音译“雅威”保留其专名性质，不以称号代替。
- issue: 神在报应中的主动作用
  choice: 雅威必使你的恶归到你自己头上
  alternative: 你的恶必报应在你自己头上
  rationale: 使役式 הֵשִׁיב 明确以雅威为行动主体；译文保留这一神圣能动性，同时不扩展为本节以外的系统性论断。
- issue: וְהֵשִׁיב 的时间指向
  choice: 必使……归到
  alternative: 已经使……归到
  rationale: 该形式本身可依语境承载不同时间关系；在所罗门宣布即将执行判决的语境中，将来性的“必”较为贴切，但脚注保留“归还、偿还”的词义范围。
translation_notes:
  register: 采用现代、庄重而易懂的叙事与司法宣告语体。“你自己心里清楚”避免生硬直译，却通过脚注保存“你的心知道”的希伯来语意象；末句保留“归到你自己头上”的具体报应图像。
