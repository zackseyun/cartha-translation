source:
  edition: WLC
  text: וְ/עַתָּ֗ה חַי יְהוָה֙ אֲשֶׁ֣ר הֱכִינַ֗/נִי ו/יושיבי/ני עַל כִּסֵּא֙ דָּוִ֣ד אָבִ֔/י וַ/אֲשֶׁ֧ר עָֽשָׂה לִ֛/י בַּ֖יִת כַּ/אֲשֶׁ֣ר דִּבֵּ֑ר כִּ֣י הַ/יּ֔וֹם יוּמַ֖ת אֲדֹנִיָּֽהוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/024.yaml
  text: And now[a], as Yahweh lives, who has established me and seated me on the throne of David my father, and who has made for me a house as he promised, surely Adonijah shall be put to death today.
translation:
  language: zh_hans
  text: 现在，我指着永活的耶和华起誓：他坚立了我，使我坐在我父亲大卫的王位上，又照着他所说的话，为我建立了家[a]。今天，亚多尼雅必被处死！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里的“家”很可能指延续的家族世系，即王朝。
    reason: 说明王室语境中“家”的惯用含义，同时保留正文原有的意象。
lexical_decisions:
- source_word: חַי יְהוָה
  choice: 我指着永活的耶和华起誓
  rationale: 这是希伯来语常用的起誓公式。译文明确其起誓功能，同时保留“耶和华是永活的”这一措辞所表达的依据。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文中广为人知的神名音译，而不以“主”这一称号取代原文的专名。
- source_word: הֱכִינַנִי
  choice: 坚立了我
  rationale: כון的使役式表示使人稳固、确立其地位；“坚立”既贴近原义，也适合所罗门王位得到确立的语境。
- source_word: וַיּוֹשִׁיבֵנִי עַל כִּסֵּא
  choice: 使我坐在……王位上
  rationale: 保留ישׁב使役式的因果意义，并以自然中文表达登基掌权。
- source_word: כִּסֵּא דָּוִד אָבִי
  choice: 我父亲大卫的王位
  rationale: “王位”在此比实体的“宝座”更清楚地表达统治权，同时完整保留与父亲大卫的承继关系。
- source_word: עָשָׂה לִי בַּיִת
  choice: 为我建立了家
  rationale: 保留原文“家”的意象及其与大卫之约的互文联系；此处很可能指家族世系或王朝，故以脚注说明，而不在正文中将含义单一化。
- source_word: כַּאֲשֶׁר דִּבֵּר
  choice: 照着他所说的话
  rationale: 原义是“照他所说的”；此译保留“说”的措辞，也让其中承诺的语境自然显现。
- source_word: כִּי
  choice: 以冒号及陈述语气表达强调
  rationale: 这里的כִּי引出誓言所保证的内容。中文无需另加“因为”，通过起誓公式、冒号和坚定语气即可传达其强调作用。
- source_word: יוּמַת
  choice: 必被处死
  rationale: מות的使役被动式表示被人执行死刑；“被处死”准确保留被动及处决含义，“必”体现誓言的确定性。
- source_word: אֲדֹנִיָּהוּ
  choice: 亚多尼雅
  rationale: 采用该人名在现代中文圣经传统中的通行音译。
theological_decisions:
- issue: 王室语境中“家”（בַּיִת）的含义
  choice: 正文保留“家”，脚注指出王朝或延续的家族世系之义
  alternative: 正文直接译作“王朝”或“家族世系”
  rationale: 在大卫王权及应许的语境中，“家”很可能指延续的王族世系，但原词的意象也连接实体住所、家庭和王朝等意义。正文保留“家”可避免过早消除这种语义张力。
translation_notes:
  register: 采用庄重而清楚的现代标准普通话。“我指着永活的耶和华起誓”使希伯来语誓言公式对普通读者自然明白；句末感叹号传达所罗门宣判时的郑重与决绝。
