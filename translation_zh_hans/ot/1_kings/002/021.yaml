translation:
  language: zh_hans
  text: 她说：“请把书念女子亚比煞给你兄弟亚多尼雅为妻。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: 她说
  rationale: 未单独译出连接词וַ，以自然汉语承接上下文；动词阴性单数主语依语境译为“她”。
- source_word: יֻתַּן
  choice: 请把……赐给
  rationale: 该被动祈愿式表达请求。汉语采用带“请”的处置式，使请求语气自然清楚；“赐给”也符合向君王提出婚配请求的语境。
- source_word: אֲבִישַׁג
  choice: 亚比煞
  rationale: 按现代中文圣经人名的通行形式音译。
- source_word: הַשֻּׁנַמִּית
  choice: 书念女子
  rationale: 该族称表示来自书念的女子；如此翻译比音译族称更便于普通读者理解，同时保留其籍贯身份。
- source_word: לַאֲדֹנִיָּהוּ
  choice: 给……亚多尼雅
  rationale: 介词לְ标示婚配行为的接受者，译为“给”。人名采用现代中文圣经通行音译。
- source_word: אָחִיךָ
  choice: 你哥哥
  rationale: 后缀为第二人称阳性单数，指所罗门；亚多尼雅年长于所罗门，故自然译作“你哥哥”，比泛称“兄弟”更明确。
- source_word: לְאִשָּׁה
  choice: 为妻
  rationale: 该结构明确表示婚姻关系；“为妻”简洁、庄重，也保留原文正式意味。
