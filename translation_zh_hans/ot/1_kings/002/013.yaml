  yaml_path: translation/ot/1_kings/002/013.yaml
  text: Then Adonijah son of Haggith came to Bathsheba[a], the mother of Solomon, and she said, “Do you come in peace?” And he said, “In peace.”
translation:
  language: zh_hans
  text: 哈及的儿子亚多尼雅来到所罗门的母亲拔示巴那里。拔示巴问：“你来是为平安吗？”他说：“是为平安。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹא
  choice: 来见
  rationale: בוא可依叙事视角表示“来”或“去”；此处以拔示巴为趋向中心。“来见”自然表达来到某人面前的意思。
- source_word: אֲדֹנִיָּהוּ בֶן חַגִּית
  choice: 哈及的儿子亚多尼雅
  rationale: 按现代中文圣经人名惯例音译专名，并保留“某人的儿子”这一身份说明。
- source_word: בַּת שֶׁבַע
  choice: 拔示巴
  rationale: 采用现代中文圣经中通行的人名译法。
- source_word: אֵם שְׁלֹמֹה
  choice: 所罗门的母亲
  rationale: 保留原文同位语对拔示巴身份的强调，并以自然中文表达。
- source_word: הֲשָׁלוֹם בֹּאֶךָ
  choice: 你是为平安而来吗？
  rationale: 原文直译近于“你的来是平安吗”，询问来意是否和平；“为平安而来”既保留关键词和语义张力，也符合庄重的现代中文。
- source_word: שָׁלוֹם
  choice: 是为平安
  rationale: 原文答语仅重复“平安”，十分简短；补入“是为”承接问句，使中文自然，同时保留其简洁和呼应。
