revisions:
- from: 哈及的儿子亚多尼雅来见所罗门的母亲拔示巴。拔示巴问：“你是为平安而来吗？”他回答：“是为平安。”
  to: 哈及的儿子亚多尼雅来到所罗门的母亲拔示巴那里。拔示巴问：“你来是为平安吗？”他说：“是为平安。”
  rationale: 修订仅澄清问句所问的是来者的和平意图，而非其来访目的，并以更中性的动词对应“来到”。保留原文中“平安”的重复、答语的简短和同位语身份说明。增列与英文审校记录相应的字面译法脚注。
