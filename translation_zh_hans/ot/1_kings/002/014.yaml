  text: Then he said[a], “I have something to say to you.” And she said, “Speak.”
translation:
  language: zh_hans
  text: 他接着说：“我有一件事要对你说。”她说：“你说吧。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 他接着说
  rationale: 叙事性 wayyiqtol 推进接续动作；“接着说”在现代汉语中自然地保留先后关系。
- source_word: דָּבָר לִי אֵלָיִךְ
  choice: 我有一件事要对你说
  rationale: 这是希伯来语习语，字面结构近似“我有一件话/事向着你”；整体译法准确传达说话者有事相告的含义。
- source_word: דָּבָר
  choice: 一件事
  rationale: דָּבָר 可指“话、事、事情”；在本语境中“一件事”既自然，又不把所谈内容过早限定为单纯一句话。
- source_word: אֵלָיִךְ
  choice: 对你
  rationale: 介词 אֶל 加第二人称阴性单数词尾，标明拔示巴是话语所指向的对象；汉语以“对你说”自然表达。
- source_word: וַתֹּאמֶר
  choice: 她说
  rationale: 阴性单数形式明确主语为女性；汉语对话中无需机械重复连接词，也能保留紧接着回应的顺序。
- source_word: דַּבֵּר
  choice: 你说吧
  rationale: דָּבַר 的阳性单数命令式；“你说吧”比孤立的“说”更符合现代汉语对话，同时不额外增添实质含义。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。将希伯来语所有结构按汉语习惯译为“我有一件事要对你说”，无需脚注；回应译作“你说吧”，简洁且符合当代口语书面表达。
