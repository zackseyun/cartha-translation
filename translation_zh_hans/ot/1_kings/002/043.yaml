  text: וּ/מַדּ֕וּעַ לֹ֣א שָׁמַ֔רְתָּ אֵ֖ת שְׁבֻעַ֣ת יְהוָ֑ה וְ/אֶת הַ/מִּצְוָ֖ה אֲשֶׁר צִוִּ֥יתִי עָלֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/043.yaml
  text: Why then have you not kept the oath of Yahweh and the command that I commanded you?[a][b]
translation:
  language: zh_hans
  text: 那么，你为什么没有遵守雅威的誓言[a]和我向你下达的命令[b]呢？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“向雅威所起的誓”，即在雅威面前、奉他的名或在他的权柄之下所起的誓。
    reason: lexical_alternative
  - marker: b
    text: 原文在“我所命令的”之后有“在你身上”一语，表示这命令是加在他身上、要他履行的。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמַדּוּעַ
  choice: 那么，你为什么
  rationale: מַדּוּעַ是“为什么”，前缀וּ承接上文；用“那么”自然表达这一推论、追问关系。
- source_word: לֹא שָׁמַרְתָּ
  choice: 没有遵守
  rationale: שׁמר在誓言和命令的语境中表示持守、遵行；“遵守”可自然统摄两个宾语。
- source_word: אֵת שְׁבֻעַת יְהוָה
  choice: 雅威的誓言
  rationale: 按原文保留属格结构及其可能的语义张力；上下文所指是人在雅威面前或奉其名所起的誓，并非必然指雅威亲自所起的誓。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见音译呈现四字神名，保留其作为专名的性质，而不以称号替代。
- source_word: וְאֶת הַמִּצְוָה
  choice: 和……命令
  rationale: מִצְוָה在此指具有约束力的吩咐；“命令”符合君王讲话的语境。
- source_word: אֲשֶׁר צִוִּיתִי עָלֶיךָ
  choice: 我向你下达的
  rationale: צוה表示吩咐、命令，עַל带有命令加诸其身的意味；“向你下达”既自然，又保留施加义务的语气。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。音译为“雅威”可明确保留专名，避免将其无标记地改为称号。
- issue: “雅威的誓言”的施誓者
  choice: 正文保留原文属格表达，并用脚注说明语境义
  alternative: 正文直接译为“向雅威所起的誓”
  rationale: 希伯来语构造本身简洁，可能表示与雅威有关、在他面前或奉他名所起的誓。正文不暗自消除形式上的歧义，脚注则帮助读者把握本段语境。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“那么”承接前文的指控；句末“呢”体现当面追问。正文中的[a]、[b]均紧随其所解释的短语。
