base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/040.yaml
  text: And all the people went up after him[a], and the people were playing flutes and rejoicing with great joy[b], and the earth split apart at their sound.
translation:
  language: zh_hans
  text: 众民都跟随他上去。众民吹着笛子[a]，极其欢喜；他们的声响震得大地都裂开了[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“吹着管乐器”；希伯来语所指可泛指笛、管一类的管乐器。
    reason: lexical_alternative
  - marker: b
    text: “大地都裂开了”很可能是夸张说法，用来描写庆祝声势极其浩大。
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעֲלוּ
  choice: 上去
  rationale: עלה的基本义是“上去、登上”；此处保留队伍向上行进的具体画面，不将其弱化为单纯的“跟随”。
- source_word: כָל הָעָם
  choice: 众民
  rationale: 准确表达带כָל的集合意义；“众民”简洁庄重，也符合公开拥戴的场景。
- source_word: אַחֲרָיו
  choice: 跟随他
  rationale: 此处表示在队伍中跟在他后面行进；“跟随他”比直译“在他后面”更符合现代汉语，同时不增添效忠等含义。
- source_word: מְחַלְּלִים בַּחֲלִלִים
  choice: 吹着笛子
  rationale: 动词与名词共同指吹奏笛、管一类的风奏乐器；“吹着笛子”自然清楚，并以脚注保留乐器类别的宽泛性。
- source_word: וּשְׂמֵחִים שִׂמְחָה גְדוֹלָה
  choice: 极其欢喜
  rationale: 希伯来文以同根动词和名词叠加强调强烈喜悦；“极其欢喜”在现代汉语中自然地传达这一强化语气。
- source_word: וַתִּבָּקַע הָאָרֶץ
  choice: 大地都裂开了
  rationale: 保留בקע“裂开”的强烈形象，不在正文中把它解释性地改成“震动”或“响彻”；“都”传达此处夸张的强度。
- source_word: בְּקוֹלָם
  choice: 他们的声响震得
  rationale: קוֹל可涵盖人声、乐声和整体喧响；“声响”避免限缩为人的嗓音，“震得”使בְּ所表达的伴随或作用关系在汉语中自然明晰。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“众民”保留公共场面的群体感；两个短句顺承希伯来文的叙事推进。正文保留“大地裂开”的鲜明意象，解释置于脚注，以免在译文中消解原文的修辞张力。
