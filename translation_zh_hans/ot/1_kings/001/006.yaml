base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/006.yaml
  text: His father had never displeased him at any time by saying[a], “Why have you done thus?” He was also very handsome[b], and his mother had borne him after Absalom.
translation:
  language: zh_hans
  text: 他父亲从来[a]没有因说：“你为什么这样做？”而使他不快[b]。他也长得非常俊美；他的母亲是在押沙龙之后生他的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“从他的日子以来”，是指他一生中的任何时候，即“从来”。
    reason: lexical_alternative
  - marker: b
    text: “使他不快”也可译为“使他难过”或“责备他”。原文动词可指使人痛苦、忧伤或烦恼；在这里，是说大卫从未质问或约束亚多尼雅。
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲצָבוֹ
  choice: 使他不快
  rationale: 该动词可指使人痛苦、忧伤或烦恼。这里与父亲本应说出的责问相连，译为“使他不快”既保留情感层面的基本意义，也让上下文显出大卫从未约束或质问亚多尼雅。
- source_word: מִיָּמָיו
  choice: 从来
  rationale: 字面为“从他的日子以来”，在此是表示一生中任何时候都没有发生过的惯用说法；“从来没有”符合现代汉语表达。
- source_word: לֵאמֹר
  choice: 用……这样的话
  rationale: 这里引出父亲未曾说出的责问内容。汉语采用“用……这样的话使他不快”，能清楚表达说话是使其不快的方式。
- source_word: מַדּוּעַ כָּכָה עָשִׂיתָ
  choice: 你为什么这样做？
  rationale: 直译而自然，保留父亲质问其行为的语气。
- source_word: טוֹב תֹּאַר מְאֹד
  choice: 长得非常俊美
  rationale: 该短语描述优美出众的外貌；用于男性时，“俊美”准确、自然，也保持较庄重的叙事语体。
- source_word: וְאֹתוֹ יָלְדָה
  choice: 他母亲……生他的
  rationale: 希伯来文动词的女性主语未明说；从“生他”的语义和家谱语境可知是其母亲。汉语明说“他母亲”可避免悬空而不增加实质信息。
- source_word: אַחֲרֵי אַבְשָׁלוֹם
  choice: 在押沙龙之后
  rationale: 保留原文简洁表达，最自然是指亚多尼雅的出生次序在押沙龙之后，同时不扩写为更强的解释。
theological_decisions:
- issue: 大卫对亚多尼雅的管教缺失
  choice: 以“没有用……这样的话使他不快”表达
  alternative: 直接译为“从未责备/管教他”
  rationale: 原文动词本义范围包括使人痛苦、忧伤或烦恼，并未直接使用“管教”一词。正文保留这种措辞及其张力，脚注再说明语境所含的责问、约束意味，避免把解释直接写成原文。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。“用……这样的话使他不快”尽量保留希伯来文中“使其痛苦/不悦”与随后直接引语之间的关系；分号连接外貌与出生次序两项补充说明。
