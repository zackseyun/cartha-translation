  yaml_path: translation/ot/1_kings/001/015.yaml
  text: So Bathsheba went in to the king in the chamber[a]. Now the king was very old[b], and Abishag the Shunammite was attending the king.
translation:
  language: zh_hans
  text: 于是，拔示巴进到王的内室[a]。王已经十分年老，书念女子亚比煞正在服侍王。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“拔示巴到王那里，进入内室。”
    reason: 原文同时表达她到王那里并进入内室；汉语可按不同句式侧重其中的空间关系。
lexical_decisions:
- source_word: וַתָּבֹא
  choice: 于是……进了
  rationale: 叙事性连续式推动情节发展；“于是”承接上文，“进了”自然表达进入王所在的私人空间。
- source_word: בַת־שֶׁבַע
  choice: 拔示巴
  rationale: 采用现代中文圣经中通行的人名音译。
- source_word: אֶל־הַמֶּלֶךְ הַחַדְרָה
  choice: 进了内室，到王那里
  rationale: 方向词尾表明进入חֶדֶר；“内室”保留私人、内部房间的意味，并以“到王那里”明确אֶל所表达的趋向。
- source_word: וְהַמֶּלֶךְ זָקֵן מְאֹד
  choice: 王已经十分年老
  rationale: 此处是交代背景；“已经”自然体现当时的状态，“十分年老”准确传达זָקֵן מְאֹד。
- source_word: וַאֲבִישַׁג הַשּׁוּנַמִּית
  choice: 书念女子亚比煞
  rationale: 人名采用通行音译；“书念女子”清楚表达来自书念的女性，避免生硬的族称形式。
- source_word: מְשָׁרַת אֶת־הַמֶּלֶךְ
  choice: 正在服侍王
  rationale: 分词表达持续进行的动作；“服侍”适合宫廷照料语境，也不带不必要的宗教职事色彩。
