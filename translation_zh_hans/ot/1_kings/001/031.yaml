base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/031.yaml
  text: Then Bathsheba bowed with her face to the ground and prostrated herself before the king[a], and said, “May my lord King David live forever.”
translation:
  language: zh_hans
  text: 于是，拔示巴俯身，脸伏于地，又向王下拜，说：“愿我主大卫王万岁！”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“愿我主大卫王永远活着！”
    reason: 保留יְחִי与לְעֹלָם较为字面的祈愿表达，供读者与正文的汉语王室祝颂惯用语比较。
lexical_decisions:
- source_word: וַתִּקֹּד
  choice: 俯身
  rationale: קָדַד指身体俯下、躬身；“俯身”自然清楚，又不把姿势限定为跪下。
- source_word: אַפַּיִם אֶרֶץ
  choice: 脸伏于地
  rationale: 该短语直指脸面朝地，表现深度敬礼；“脸伏于地”保留了原文具体形象。
- source_word: וַתִּשְׁתַּחוּ
  choice: 下拜
  rationale: שׁחה在此表示在王面前俯伏敬礼；“下拜”既与前面的“俯身”有别，也符合宫廷语境。
- source_word: לַמֶּלֶךְ
  choice: 向王
  rationale: 介词ל表示动作所指向的对象；现代汉语用“向王下拜”自然准确。
- source_word: יְחִי
  choice: 愿……万岁
  rationale: 未完成式在此带祈愿语气；结合לְעֹלָם构成王室祝颂，汉语“愿……万岁”简洁自然。
- source_word: אֲדֹנִי
  choice: 我主
  rationale: 这是对君王的尊称；“我主”保留了第一人称所属关系及恭敬语气。
- source_word: הַמֶּלֶךְ דָּוִד
  choice: 大卫王
  rationale: 按现代汉语习惯将王号置于人名之后，同时完整保留“王”和“大卫”。
- source_word: לְעֹלָם
  choice: 万岁
  rationale: עוֹלָם本义为长久、永远；在君王祝颂中，“万岁”是现代汉语最自然的对应表达，但并非对实际寿命的字面断言。
theological_decisions: []
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“俯身，脸伏于地，又向王下拜”保留原文两个连续的敬礼动词及其加强效果；引语用“万岁”传达宫廷祝颂，同时以脚注呈现较字面的译法。
