base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/027.yaml
  text: If this thing has come from my lord the king[a], have you not made known to your servants who will sit on the throne of my lord the king after him?
translation:
  language: zh_hans
  text: 这事若是出于我主我王，难道你没有告诉你的仆人[a]，谁将在我主我王之后坐上王位吗？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 辅音文本作“你的仆人们”；马所拉诵读传统作“你的仆人”。
    reason: textual_variant
lexical_decisions:
- source_word: אִם
  choice: 若是
  rationale: 保留希伯来语条件句的形式，同时让拿单委婉而尖锐的质问在现代汉语中自然成立。
- source_word: מֵאֵת אֲדֹנִי הַמֶּלֶךְ נִהְיָה
  choice: 出于我主我王
  rationale: מֵאֵת 与 נִהְיָה 合用，表示此事源于或得到王的授意；“出于”简洁保留来源含义，不额外断定具体授权方式。
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: 我主我王
  rationale: 保留宫廷中对君王的敬称；这一表达庄重、简明，也符合现代中文圣经叙事语体。
- source_word: הַדָּבָר הַזֶּה
  choice: 这事
  rationale: דבר 在此指前文所述的王位继承事件或安排；“这事”自然且保留词义的宽泛性。
- source_word: וְלֹא הוֹדַעְתָּ
  choice: 你却没有告诉
  rationale: ידע 的使役式表示使人知道、告知；“却”传达 וְ 在条件质问中的转折张力，而不把疑问拆成陈述句。
- source_word: עבדי/ך
  choice: 你的仆人
  rationale: 正文依马所拉诵读传统采用单数，指说话者拿单以臣仆自称；辅音文本所呈现的复数形式在脚注中保留。
- source_word: מִי יֵשֵׁב עַל כִּסֵּא
  choice: 谁要……坐……王位
  rationale: 保留“坐王位”的具体登基意象，不直接释为“作王”。
- source_word: אַחֲרָיו
  choice: 接替……
  rationale: 这里指大卫之后的王位继承；“接替”在中文中清楚表达时间与继位关系，而代词所指仍由句中“我主我王”明确。
theological_decisions:
- issue: עבד 的宫廷自称及单复数文本差异
  choice: 正文作“你的仆人”，依马所拉诵读传统理解为拿单的单数自称
  alternative: “你的仆人们”，依辅音文本的复数形式
  rationale: 此处是臣子在王前的礼貌自称，并不着重奴役身份。单数诵读与叙事中拿单本人发问相符，但辅音文本的复数见证是真实的文本差异，因此不应静默消除，列入脚注。
- issue: 拿单问题的修辞力度
  choice: 保留条件问句：“若是……你却没有……吗？”
  alternative: 译作较肯定的质问：“难道这事出于……？”
  rationale: אִם 明示条件形式；中文条件问句既保留原文结构，也让上下文中的怀疑与责问自然显出，而不替读者断定拿单的语气。
translation_notes:
  register: 采用现代、庄重而易懂的宫廷叙事语体。“我主我王”保留敬称，“这事”避免将 דבר 过度限定为命令、决定或阴谋。句末用一个完整问句呈现原文的条件式修辞质问。
