base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/038.yaml
  text: So Zadok the priest[a], Nathan the prophet, Benaiah son of Jehoiada, and the Cherethites and the Pelethites went down and had Solomon ride on King David’s mule[c][b], and they brought him to Gihon.
translation:
  language: zh_hans
  text: 于是，祭司撒督、先知拿单、耶何耶大的儿子比拿雅，以及基利提人和比利提人[a]都下去，使所罗门骑上大卫王的骡子[b][c]，带他到基训。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “基利提人和比利提人”也可能指“王室卫队”；希伯来文使用的是这两个群体的名称。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译为“大卫王的骡子”。
    reason: lexical_alternative
  - marker: c
    text: 希伯来文“骡子”一词为阴性形式，可能指母骡。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרֶד
  choice: 都下去
  rationale: ירד含有向下移动之意；主语为随后列举的众人，汉语用“都下去”自然保留方向和共同动作。
- source_word: הַכֹּהֵן
  choice: 祭司
  rationale: כהן的标准译法；置于人名前符合现代汉语称谓习惯。
- source_word: הַנָּבִיא
  choice: 先知
  rationale: נביא的标准译法，并保留拿单在原文中的身份称谓。
- source_word: בֶן יְהוֹיָדָע
  choice: 耶何耶大的儿子
  rationale: 直接表达希伯来文的父子关系，清楚自然。
- source_word: הַכְּרֵתִי וְהַפְּלֵתִי
  choice: 基利提人和比利提人
  rationale: 原文使用两个群体名称，其确切族属或职能仍有争议，因此正文音译，不直接解释为王室卫队。
- source_word: וַיַּרְכִּבוּ
  choice: 让……骑上
  rationale: רכב的使役式表示使某人骑乘；“让所罗门骑上”既保留使役意义，又符合现代汉语表达。
- source_word: פִּרְדַּת
  choice: 骡子
  rationale: 该名词为阴性形式，可能特指母骡；正文采用汉语通常的统称，并以脚注说明。
- source_word: הַמֶּלֶךְ דָּוִד
  choice: 大卫王的
  rationale: 自然表达原文所属结构“王大卫的”，并保留这头骡子与王权身份的关联。
- source_word: וַיֹּלִכוּ אֹתוֹ
  choice: 带他
  rationale: הלך的使役式在此可指使其前往、领去或带去；“带他”不限定步行方式，适合骑乘 procession 的语境。
- source_word: עַל גִּחוֹן
  choice: 到基训
  rationale: 介词עַל与移动动词和地名连用时在此表达目的地；译为“到”符合汉语习惯。
