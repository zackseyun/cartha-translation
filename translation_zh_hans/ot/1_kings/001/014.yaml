  text: Look[a], while you are still speaking there with the king, I will come in after you and confirm your words.
translation:
  language: zh_hans
  text: 你看，当你还在那里同王说话时，我会在你之后进去，证实[a]你的话。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“补全你的话”或“把你所说的话补充完整”；这个希伯来语表达可以指补充细节，以印证另一个人的陈述。
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: 看
  rationale: 这是引人注意的指示语，用现代汉语“看”自然地保留了当下感，也比“看哪”更贴近日常而庄重的叙述。
- source_word: עוֹדָךְ מְדַבֶּרֶת
  choice: 你还……说话的时候
  rationale: 副词与阴性第二人称单数后缀配合分词，表示拔示巴说话的动作仍在持续；用时间从句符合现代汉语表达。
- source_word: שָׁם עִם הַמֶּלֶךְ
  choice: 在那里跟王说话
  rationale: 保留地点副词“那里”，并以“跟王”表达עִם的相伴、交谈关系，符合宫廷场景。
- source_word: וַאֲנִי אָבוֹא אַחֲרַיִךְ
  choice: 我就会跟着你进去
  rationale: בוא在此语境中指进入王所在之处；“跟着你进去”表达拿单将在拔示巴之后入内，而非与她同时进入。
- source_word: וּמִלֵּאתִי אֶת דְּבָרָיִךְ
  choice: 证实你所说的话
  rationale: 该习语可指补全、充实或通过补充陈述来确认对方的话；本处行动目的主要是为拔示巴的话提供印证。
theological_decisions: []
translation_notes:
  register: 采用现代、清楚而庄重的叙事语言。“跟王说话”自然传达宫廷对话；“证实”表达语境中的实际功能，同时用脚注保留希伯来语习语“补全、充实”的词义空间。
