  text: וַ/יִּזְבַּ֣ח אֲדֹנִיָּ֗הוּ צֹ֤אן וּ/בָקָר֙ וּ/מְרִ֔יא עִ֚ם אֶ֣בֶן הַזֹּחֶ֔לֶת אֲשֶׁר אֵ֖צֶל עֵ֣ין רֹגֵ֑ל וַ/יִּקְרָ֗א אֶת כָּל אֶחָי/ו֙ בְּנֵ֣י הַ/מֶּ֔לֶךְ וּ/לְ/כָל אַנְשֵׁ֥י יְהוּדָ֖ה עַבְדֵ֥י הַ/מֶּֽלֶךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/009.yaml
  text: Adonijah sacrificed sheep[a], cattle, and fattened animals by the stone of Zoheleth, which is beside En-rogel, and he invited all his brothers, the king’s sons, and all the men of Judah[e][d][c][b], the king’s servants.
translation:
  language: zh_hans
  text: 亚多尼雅在琐希列石旁，就是靠近隐·罗结的地方，献祭羊、牛和肥壮的牲畜；他又邀请了自己所有的兄弟，就是王的众子，以及所有作王臣仆的犹大人。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּזְבַּח
  choice: 宰献了
  rationale: זבח在这里指为祭宴宰杀祭牲；“宰献”兼顾实际宰杀和献祭含义，避免只译作普通屠宰。
- source_word: צֹאן
  choice: 羊群
  rationale: צֹאן是小型家畜的集合称谓，可包括绵羊和山羊；“羊群”自然简洁，又不把范围限定为绵羊。
- source_word: וּבָקָר
  choice: 牛
  rationale: בקר泛指牛类牲畜；汉语“牛”能自然表达其集合意义。
- source_word: וּמְרִיא
  choice: 肥畜
  rationale: מריא指育肥、供特殊筵席使用的牲畜，原文并未限定为牛犊；“肥畜”保留其较宽泛的所指。
- source_word: עִם אֶבֶן הַזֹּחֶלֶת
  choice: 在琐希列石旁
  rationale: 介词עִם在此具有地点意义；“旁”符合汉语地理表达。“琐希列”按地名音译，不强行确定其语源意义。
- source_word: עֵין רֹגֵל
  choice: 隐·罗结
  rationale: 这是地名，采用音译，并在脚注说明它与泉水有关。
- source_word: וַיִּקְרָא
  choice: 邀请
  rationale: 在献祭筵席的语境中，קרא表示叫人前来参加；“邀请”准确传达这里的社交和政治行动。
- source_word: אֶת כָּל אֶחָיו בְּנֵי הַמֶּלֶךְ
  choice: 自己所有的兄弟，就是王的众子
  rationale: 保留“兄弟”与“王的众子”之间的同位关系和原文的重复强调。
- source_word: וּלְכָל אַנְשֵׁי יְהוּדָה עַבְדֵי הַמֶּלֶךְ
  choice: 以及所有作王臣仆的犹大人
  rationale: 将“王的臣仆”理解为对“犹大人”的限定或同位说明，既保留其犹大身份，也避免误译为邀请了犹大全体男子。
theological_decisions:
- issue: אַנְשֵׁי יְהוּדָה的性别及范围
  choice: 作王臣仆的犹大人
  alternative: 犹大的所有男子，就是王的臣仆
  rationale: אנשי在形式上为阳性，语境所指又是王室服务人员。“犹大人”在现代汉语中通常可自然指这些男性而不刻意扩大为犹大全体人民；后面的“作王臣仆”明确限定其范围。
- issue: זבח的祭祀含义
  choice: 宰献
  alternative: 宰杀；献祭
  rationale: 此处既有宰杀牲畜的实际动作，也有祭牲筵席的礼仪背景；“宰献”不把动作简化为普通屠宰，也不额外说明祭祀对象或礼仪细节。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“宰献”保留礼仪色彩；“肥畜”避免把原文过度具体化为牛犊；人名和地名使用适合中文圣经语境的音译形式，并以间隔号提高复合地名的辨识度。
