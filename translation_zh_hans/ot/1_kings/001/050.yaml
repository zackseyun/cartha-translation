  text: וַ/אֲדֹ֣נִיָּ֔הוּ יָרֵ֖א מִ/פְּנֵ֣י שְׁלֹמֹ֑ה וַ/יָּ֣קָם וַ/יֵּ֔לֶךְ וַֽ/יַּחֲזֵ֖ק בְּ/קַרְנ֥וֹת הַ/מִּזְבֵּֽחַ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/050.yaml
  text: And Adonijah was afraid because of Solomon[a], so he arose and went and took hold of the horns of the altar.
translation:
  language: zh_hans
  text: 亚多尼雅因所罗门而惧怕，就起身前去，抓住了祭坛的角[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 抓住祭坛的角，是一种在圣所寻求庇护或怜悯的举动。
    reason: cultural_note
lexical_decisions:
- source_word: יָרֵא מִפְּנֵי שְׁלֹמֹה
  choice: 因所罗门而惧怕
  rationale: 将 יָרֵא 译为“惧怕”，并保留 מִפְּנֵי 在此处表示惧怕缘由或对象的作用；不把它按字面处理为“从所罗门面前”，也不额外说明惧怕的具体原因。
- source_word: וַיָּקָם
  choice: 就起身
  rationale: 符合希伯来叙事中的连续动作，也比“站起来”更自然，因为上下文未强调身体姿势。
- source_word: וַיֵּלֶךְ
  choice: 离去
  rationale: 准确表达人物起身后前往别处的动作；“离去”保持简洁庄重，同时避免补出原文未说明的目的地。
- source_word: וַיַּחֲזֵק
  choice: 抓住
  rationale: 直接表达牢牢持住某物的动作，但不采用可能带有暴力意味的“夺取”。
- source_word: קַרְנוֹת הַמִּזְבֵּחַ
  choice: 祭坛的角
  rationale: 保留古代祭坛构造的具体称谓；汉语“角”可统称这些从祭坛四角伸出的突起，无须在正文中解释或改写。
- source_word: וַאֲדֹנִיָּהוּ
  choice: 亚多尼雅
  rationale: 采用现代中文圣经语境中通行且易识别的人名音译；句首连接词则通过汉语叙事衔接自然体现。
theological_decisions:
- issue: 抓住祭坛之角所表达的避难或求怜悯含义
  choice: 正文只直译为“抓住祭坛的角”，文化含义置于脚注
  alternative: 在正文中扩译为“逃到祭坛那里寻求庇护”
  rationale: 原文明确叙述的是身体动作；该动作虽可表示寻求庇护或怜悯，但正文若直接写明其法律或礼仪意义，就会超过原文措辞并消除其含蓄性。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“因所罗门而惧怕”略带书面色彩，以保留 מִפְּנֵי 的显式关系；“祭坛的角”保留礼仪文化中的专门形象，并由脚注简要说明。
