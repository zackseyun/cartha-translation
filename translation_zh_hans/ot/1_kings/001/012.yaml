  yaml_path: translation/ot/1_kings/001/012.yaml
  text: Now come[a], please let me advise you[c][b], and save your life and the life of your son Solomon.
translation:
  language: zh_hans
  text: 现在，你去吧；让我给你出个主意，好救你自己和你儿子所罗门的性命[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“请让我劝告你一个劝告”；动词和名词同源，用以加强“给你建议／劝告你”的意思。这里“性命”所译的希伯来词可指人自身或生命；在本处指生命，并非特指脱离身体的“灵魂”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: 现在
  rationale: 在话语中引出紧迫的转折；现代汉语用“现在”自然明确，希伯来语连接词的承接作用无需机械译出。
- source_word: לְכִי
  choice: 你来
  rationale: 字面为“去／走”，但在此直接对话中是催促对方采取行动的召唤；“你来”符合现代汉语语境。
- source_word: אִיעָצֵךְ נָא עֵצָה
  choice: 我好给你出个主意
  rationale: 原文以“劝告”动词和同源名词构成强调表达，并有请求语气词 נָא；“我好给你出个主意”自然传达提议与劝告的语用力量。
- source_word: וּמַלְּטִי
  choice: 使……保全
  rationale: 该祈使式要求拔示巴采取行动，令自己和所罗门脱离致命危险；“保全……性命”准确而符合汉语惯用表达。
- source_word: נַפְשֵׁךְ
  choice: 你自己的性命
  rationale: נֶפֶשׁ 在本处指处于政治危险中的生命，而非抽象的“灵魂”。正文为行文自然，表达作“保全自己……的性命”。
- source_word: וְאֶת נֶפֶשׁ בְּנֵךְ שְׁלֹמֹה
  choice: 你儿子所罗门的性命
  rationale: 保留与拔示巴本人性命的平行关系，也明确保留所罗门的名字。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而口语自然的叙事对话体。“你来”保留紧迫召唤，“出个主意”避免生硬复现希伯来语同源结构；“保全……性命”清楚呈现宫廷继承危机中的现实生命威胁。
