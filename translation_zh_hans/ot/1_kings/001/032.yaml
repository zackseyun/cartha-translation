base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/032.yaml
  text: Then King David said, “Call Zadok the priest, Nathan the prophet, and Benaiah son of Jehoiada to me.” And they came before the king.
translation:
  language: zh_hans
  text: 大卫王说：“把祭司撒督、先知拿单和耶何耶大的儿子比拿雅叫到我这里来。”他们就来到王面前。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: 该叙事形式承接并推进情节；现代汉语无需机械译出连接词，语序本身已自然表达先后。
- source_word: הַמֶּלֶךְ דָּוִד
  choice: 大卫王
  rationale: 这是王室称号与人名的同位结构；“大卫王”符合现代汉语习惯。
- source_word: קִרְאוּ לִי
  choice: 把……叫到我这里来
  rationale: 复数祈使式配合 לִי，表示吩咐人将所指人物召到说话者面前；此译法直接、自然，也保留命令语气。
- source_word: לְצָדוֹק הַכֹּהֵן
  choice: 祭司撒督
  rationale: 保留人名与明确职分；汉语以“祭司”置于人名前更自然。
- source_word: וּלְנָתָן הַנָּבִיא
  choice: 先知拿单
  rationale: נָבִיא 直译为“先知”，并按汉语习惯置于人名前。
- source_word: וְלִבְנָיָהוּ בֶּן יְהוֹיָדָע
  choice: 和耶何耶大的儿子比拿雅
  rationale: בֶּן 表明父子身份关系；使用传统而通行的圣经人名译法。
- source_word: וַיָּבֹאוּ
  choice: 他们就来到
  rationale: 复数主语由前述三人自然补出；“就”表达叙事承接和命令随即得到执行。
- source_word: לִפְנֵי הַמֶּלֶךְ
  choice: 王面前
  rationale: לִפְנֵי 在此表示进入王的面前或临在范围；“来到王面前”简洁且庄重。
theological_decisions: []
