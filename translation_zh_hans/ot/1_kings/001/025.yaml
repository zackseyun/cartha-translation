  text: כִּ֣י יָרַ֣ד הַ/יּ֗וֹם וַ֠/יִּזְבַּח שׁ֥וֹר וּֽ/מְרִיא וְ/צֹאן֮ לָ/רֹב֒ וַ/יִּקְרָא֩ לְ/כָל בְּנֵ֨י הַ/מֶּ֜לֶךְ וּ/לְ/שָׂרֵ֤י הַ/צָּבָא֙ וּ/לְ/אֶבְיָתָ֣ר הַ/כֹּהֵ֔ן וְ/הִנָּ֛/ם אֹכְלִ֥ים וְ/שֹׁתִ֖ים לְ/פָנָ֑י/ו וַ/יֹּ֣אמְר֔וּ יְחִ֖י הַ/מֶּ֥לֶךְ אֲדֹנִיָּֽהוּ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/025.yaml
  text: For he has gone down today and sacrificed oxen[a], fattened calves, and sheep in abundance, and he has invited all the king’s sons, the commanders of the army, and Abiathar the priest. And look, they are eating and drinking before him, and they are saying[b], ‘Long live King Adonijah!’
translation:
  language: zh_hans
  text: 因为他今天下去了[a]，献祭了许多牛、肥畜和羊；又邀请了王的众子、军队的众将领和祭司亚比亚他。看哪，他们正在他面前吃喝，并说：“亚多尼雅王万岁！”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译为“今天下去（或下来）了”。希伯来语动词明确保留了向下移动的方向含义。
    reason: lexical_alternative
  - marker: b
    text: “亚多尼雅王万岁！”是希伯来语欢呼语“愿亚多尼雅王万岁”的惯用译法。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上一节，说明拿单为何判断亚多尼雅已经自立为王；中文用“因为”自然体现解释关系。
- source_word: יָרַד הַיּוֹם
  choice: 今天下去了
  rationale: 保留 יָרַד 的方向含义；叙事语境表明这是当天已经发生、且与当前局势相关的行动。
- source_word: וַיִּזְבַּח
  choice: 宰献了
  rationale: זבח 在此既涉及宰杀牲畜，也带有献祭和随后的筵席含义；“宰献”比单说“宰杀”更能保留礼仪色彩。
- source_word: שׁוֹר וּמְרִיא וְצֹאן
  choice: 牛、肥畜和羊
  rationale: 分别保留三类牲畜；מְרִיא 指养肥的牲畜，原文未明确限定为牛犊，因此译作较宽泛的“肥畜”。צֹאן 可泛指绵羊和山羊等小型牲畜，但此类献祭清单中译作“羊”自然简洁。
- source_word: לָרֹב
  choice: 许多
  rationale: 表达数量丰盛；在中文中前置于牲畜清单，比直译为“丰丰富富地”更自然。
- source_word: וַיִּקְרָא לְ
  choice: 又请了
  rationale: קרא 与介词 ל 连用，在筵席语境中表示召请或邀请，而不只是呼喊。
- source_word: שָׂרֵי הַצָּבָא
  choice: 军队的众将领
  rationale: שָׂרֵי 表示首领或长官，搭配“军队”时译为“将领”准确且符合现代汉语。
- source_word: וְהִנָּם
  choice: 看哪，他们正在
  rationale: 保留 הִנֵּה 类提示语引人注意、呈现眼前情景的功能；“正在”传达分词 אֹכְלִים וְשֹׁתִים 的持续状态。
- source_word: יְחִי הַמֶּלֶךְ אֲדֹנִיָּהוּ
  choice: 亚多尼雅王万岁
  rationale: 采用现代汉语中君王拥立欢呼的惯用表达，同时以脚注交代希伯来语的形式。
theological_decisions:
- issue: “王的众子”是否应按上下文排除所罗门
  choice: 保留“王的众子”
  alternative: 王的其他儿子
  rationale: 本节原文有 כָּל（全、众），没有“其他”一词；即使上下文显示所罗门未受邀请，正文仍不替叙述者消解这一概括性说法。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“看哪”保留叙事中的现场提示力度；“宰献”兼顾献祭与宰牲设宴的语境；人名按常见中文圣经译名处理。
