  yaml_path: translation/ot/1_kings/001/046.yaml
  text: And Solomon has also sat on the royal throne.
translation:
  language: zh_hans
  text: 所罗门也已经坐上了王位。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְגַם
  choice: 也
  rationale: 在前文所列消息之外补充另一项事实；中文用“也”自然表达累加关系。
- source_word: יָשַׁב
  choice: 已经坐上了
  rationale: 该完成式在报信语境中陈述已经发生并具有当前效力的登位事实；“坐上了”比静态的“坐在”更能体现即位语气。
- source_word: כִּסֵּא הַמְּלוּכָה
  choice: 王位
  rationale: 字面为“王国／王权的宝座”，在此是君王统治地位的惯用表达；“王位”简洁自然，并保留其政治与登基含义。
theological_decisions:
- issue: “坐上宝座”是否明确译作正式即位
  choice: 用“坐上了王位”表达已取得君王之位
  alternative: “坐在王国的宝座上”
  rationale: 本句报告所罗门已经占据王权之座，但不额外加入“正式登基”等原文没有明说的仪式性内容。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语；句式简洁，符合使者继续报告消息的叙事语境。
