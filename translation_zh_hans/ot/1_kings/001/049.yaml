  text: Then all Adonijah’s invited guests trembled and rose[a], and each man went his way.
translation:
  language: zh_hans
  text: 亚多尼雅请来的宾客全都惊惧战栗，纷纷起身，各自离去。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“各人走自己的路”，意思是众人各自散去。
    reason: 说明希伯来语习语及其分配含义。
lexical_decisions:
- source_word: וַיֶּחֶרְדוּ
  choice: 惊惧战栗
  rationale: חרד表示因恐惧或惊慌而发颤；“惊惧战栗”兼顾内心的恐惧和身体的反应，不将其弱化为一般的吃惊。
- source_word: וַיָּקֻמוּ
  choice: 纷纷起身
  rationale: קום在这里表示从席间起来；“纷纷”自然体现众宾客接连作出同一反应，但不改变“全都”的整体范围。
- source_word: כָּל הַקְּרֻאִים אֲשֶׁר לַאֲדֹנִיָּהוּ
  choice: 亚多尼雅请来的宾客全都
  rationale: הַקְּרֻאִים是“受邀者”，上下文是宴席宾客；לַאֲדֹנִיָּהוּ表示这些人是亚多尼雅所邀，译为“亚多尼雅请来的宾客”自然清楚。
- source_word: וַיֵּלְכוּ
  choice: 离去
  rationale: הלך基本义为“去、走”；在宴席散场的语境中，“离去”比单说“走”更自然，同时不额外说明目的地。
- source_word: אִישׁ לְדַרְכּוֹ
  choice: 各自离去
  rationale: 原文直译近于“各人走自己的路”，具有逐一、各自散去的分配含义；“各自离去”在现代汉语中简洁自然，也保留众人分散而去的意思。
theological_decisions: []
