base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/003.yaml
  text: So they searched throughout all the territory of Israel for a beautiful young woman[b][a], and they found Abishag the Shunammite and brought her to the king.
translation:
  language: zh_hans
  text: 于是，他们在以色列全境[a]寻找一位美丽的年轻女子，找到了书念女子[b]亚比煞，便把她带到王那里。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “全境”也可译作“全地”。
    reason: lexical_alternative
  - marker: b
    text: “书念女子”指来自书念的女子。
    reason: cultural_note
lexical_decisions:
- source_word: וַיְבַקְשׁוּ
  choice: 他们……寻找
  rationale: בקשׁ表示寻求、寻找；此处叙述一次实际展开的搜寻行动，“寻找”自然准确。
- source_word: נַעֲרָה יָפָה
  choice: 一位美貌的年轻女子
  rationale: נַעֲרָה指年轻女性，常已到适婚年龄；“年轻女子”避免“女孩”可能带来的年龄过小之感。יָפָה直接描述容貌，“美貌”符合庄重的叙事语体。
- source_word: בְּכֹל גְּבוּל יִשְׂרָאֵל
  choice: 在以色列全境
  rationale: גְּבוּל在这里指领土或地域范围，而非仅指边界线；“全境”简洁表达遍及以色列地域的意思。
- source_word: וַיִּמְצְאוּ
  choice: 找到了
  rationale: מצא是普通叙事用语，译为“找到”直接自然，并与前面的“寻找”形成顺畅呼应。
- source_word: אֲבִישַׁג הַשּׁוּנַמִּית
  choice: 书念女子亚比煞
  rationale: 人名按常用圣经译名处理；הַשּׁוּנַמִּית是地域称谓，意为来自书念的女子。“书念女子”比音译族称更易为现代汉语读者理解，同时保留原文身份标识。
- source_word: וַיָּבִאוּ אֹתָהּ לַמֶּלֶךְ
  choice: 就把她带到王那里
  rationale: 使役形态的בוא在此意为“带来”；לַמֶּלֶךְ表示朝向王。“带到王那里”清楚自然，不增添原文没有的空间信息。
theological_decisions: []
