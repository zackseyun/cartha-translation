  text: וְ/גַם כָּ֖כָה אָמַ֣ר הַ/מֶּ֑לֶךְ בָּר֨וּךְ יְהוָ֜ה אֱלֹהֵ֣י יִשְׂרָאֵ֗ל אֲשֶׁ֨ר נָתַ֥ן הַ/יּ֛וֹם יֹשֵׁ֥ב עַל כִּסְאִ֖/י וְ/עֵינַ֥/י רֹאֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/048.yaml
  text: 'And the king also said thus: ‘Blessed be Yahweh[a], the God of Israel, who today has given one to sit on my throne, and my eyes see it.’'
translation:
  language: zh_hans
  text: 王又这样说：“以色列的上帝耶和华[a]是当受颂赞的！他今日赐下一人坐在我的王位上，我亲眼看见了。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “耶和华”是希伯来文上帝之名יהוה的中文译法，也常译作“雅威”。本句也可译为：“他今日赐下一位正坐在我王位上的人，我亲眼看见。”希伯来文没有明说“看见”的宾语。
    reason: 说明神名的另一通行拟音，并保留יֹשֵׁב作为分词及“看见”省略宾语所带来的译法可能。
lexical_decisions:
- source_word: וְגַם כָּכָה אָמַר הַמֶּלֶךְ
  choice: 王又这样说
  rationale: “又”保留וְגַם的增补意味，“这样”承接下文引语，采用自然的现代汉语叙事语序。
- source_word: בָּרוּךְ
  choice: 是当受颂赞的
  rationale: 在颂赞公式中表达对上帝的称颂，既保持庄重语气，也避免把陈述式无端改成祈愿式。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经语境中通行的专名形式音译四字神名，不以头衔替代。
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: 以色列的上帝
  rationale: 直接呈现希伯来语构属关系，表达自然清楚。
- source_word: אֲשֶׁר נָתַן הַיּוֹם
  choice: 他今日赐下
  rationale: 保留נתן“赐、给”的基本意义及הַיּוֹם的时间强调；中文以“他”自然承接先行词。
- source_word: יֹשֵׁב עַל כִּסְאִי
  choice: 一人坐在我的王位上
  rationale: 将实词化分词יֹשֵׁב译为“一人坐”，不补出本节未明说的所罗门；“王位”兼顾宝座及王权语境。
- source_word: וְעֵינַי רֹאוֹת
  choice: 我也亲眼看见了
  rationale: “亲眼”自然体现希伯来语“我的眼睛看见”的亲历意味；宾语依上下文隐含，正文不另补“这事”。
theological_decisions:
- issue: 四字神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用上帝的专名而非“主”这一头衔；正文采用现代中文读者最熟悉的专名形式，并以脚注说明另一种拟音。
- issue: יֹשֵׁב的时态与功能
  choice: 赐下一人坐在我的王位上
  alternative: 赐下一位正坐在我王位上的人
  rationale: 分词既可描写“正坐着”，也可在נתן之后表达所赐的继位结果；正文保留简洁的结果性表达，脚注列出较贴近分词表层形式的译法。
- issue: וְעֵינַי רֹאוֹת中未明说的宾语
  choice: 我也亲眼看见了
  alternative: 我也亲眼看见这事了
  rationale: 希伯来文没有明说宾语，中文可自然省略，因此不在正文补出“这事”，以保留原文的省略。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“当受颂赞”保留颂赞语体；“王位”比单纯“座位”更准确体现王权语境。正文仅设一个脚注标记[a]，并已在相应位置标出。
