base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/022.yaml
  text: And behold[a], while she was still speaking with the king, Nathan the prophet came in.
translation:
  language: zh_hans
  text: 看哪[a]，她还在同王说话的时候，先知拿单进来了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“就在这时”。原文这个叙事标记使读者注意场景中突然出现的新进展。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: 看哪
  rationale: 这是引人注意的叙事标记，提示场景中突然出现的新进展；“看哪”既保留原文的临场感，也符合庄重的经文语体。
- source_word: עוֹדֶנָּה מְדַבֶּרֶת
  choice: 她还在……说话的时候
  rationale: 副词连同阴性代词后缀和分词表示这位女性的说话动作仍在持续；此译自然地表达两个动作在时间上的重叠。
- source_word: עִם הַמֶּלֶךְ
  choice: 同王
  rationale: עִם 的基本意义是“同、与”；“同王说话”既贴近原文，也适合宫廷场景。
- source_word: וְנָתָן הַנָּבִיא
  choice: 先知拿单
  rationale: 按现代汉语的自然语序，将身份称号置于人名前，同时完整保留拿单的先知身份。
- source_word: בָּא
  choice: 进来了
  rationale: 该动词可表示“来”或“进入”；在王宫觐见的场景中，“进来了”自然传达他进入王所在之处。
