base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/018.yaml
  text: And now, look, Adonijah has become king, and now, my lord the king, you do not know it.
translation:
  language: zh_hans
  text: 如今，你看，亚多尼雅已经作王了；如今，我主我王，你却不知道。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַתָּה
  choice: 现在
  rationale: 两次出现，均有推进陈述、转入当前事态的作用；中文第二处不机械重复，以保持自然，同时其转折关系由分号和“却”表达。
- source_word: הִנֵּה
  choice: 你看
  rationale: 保留引起听者注意的语用功能，比书面化的“看哪”更符合现代普通话。
- source_word: אֲדֹנִיָּה מָלָךְ
  choice: 亚多尼雅已经作王了
  rationale: מָלָךְ可表示登基或掌权；“已经作王了”保留事件已成现实的语气，不额外判定其合法性。
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: 我主我王
  rationale: 保留对大卫的双重尊称及其紧密呼语结构，语言庄重而简洁。
- source_word: לֹא יָדָעְתָּ
  choice: 你却不知道
  rationale: 直译否定完成式，并用“却”自然呈现亚多尼雅已作王与大卫不知情之间的反差。
theological_decisions:
- issue: 亚多尼雅作王之合法性
  choice: 仅陈述“已经作王了”
  alternative: “已经篡位作王了”或“已经自立为王了”
  rationale: 原文此处陈述事实而未用词明说篡位或自立；不把上下文判断嵌入本节措辞。
- issue: 大卫是否完全不知情
  choice: “你却不知道”
  alternative: “你竟不知道这事”
  rationale: 保留原文直接陈述，不借“竟”增加责备、惊讶等特定语气。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“你看”承担הִנֵּה的提示功能；分号使两个事实之间的对照清楚。
