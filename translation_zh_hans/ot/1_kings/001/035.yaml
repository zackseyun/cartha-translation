  source_fidelity: 译文准确呈现了命令序列：众人随后所罗门上去、所罗门来坐在大卫的王位上、接替大卫作王，以及大卫已指定他治理以色列和犹大。“跟着他上来”保留了אַחֲרָיו与עלה的行列和方向意味，并未擅自增译“护送”。“接替我作王”恰当表达תַּחְתָּי的职位继承意义。
