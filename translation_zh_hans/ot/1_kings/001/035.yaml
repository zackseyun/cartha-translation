  text: וַ/עֲלִיתֶ֣ם אַחֲרָ֗י/ו וּ/בָא֙ וְ/יָשַׁ֣ב עַל כִּסְאִ֔/י וְ/ה֥וּא יִמְלֹ֖ךְ תַּחְתָּ֑/י וְ/אֹת֤/וֹ צִוִּ֨יתִי֙ לִֽ/הְי֣וֹת נָגִ֔יד עַל יִשְׂרָאֵ֖ל וְ/עַל יְהוּדָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/035.yaml
  text: Then you shall go up after him[a], and he shall come and sit on my throne, and he shall reign in my place; and I have appointed him to be ruler over Israel and over Judah.
translation:
  language: zh_hans
  text: 随后，你们要跟着他上来。他要来坐在我的王位上，接替我作王；我已经立他作以色列和犹大的领袖。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我已经吩咐他作以色列和犹大的领袖。”希伯来语动词常有“吩咐、命令”的意思；“领袖”也可译作“首领”或“统治者”。
    reason: 保留צוה的常见词义以及נָגִיד的合理译法。
lexical_decisions:
- source_word: וַעֲלִיתֶם אַחֲרָיו
  choice: 你们要跟着他上来
  rationale: עלה保留“上来、上行”的方向含义；אַחֲרָיו在此表示在王家队伍中跟随所罗门。这样的译法自然，也不过度增添“护送”等原文未明说的意思。
- source_word: וּבָא וְיָשַׁב עַל־כִּסְאִי
  choice: 他要来坐在我的王位上
  rationale: בוא采用宽泛而不过度解释的“来”；“坐在我的王位上”保留原文明确的登位与继承意象。
- source_word: וְהוּא יִמְלֹךְ תַּחְתָּי
  choice: 接替我作王
  rationale: תַּחְתָּי在这里表示职位上的取代或继承；“接替我”比单纯的“在我以后”更准确，也自然表达王权交接。
- source_word: וְאֹתוֹ צִוִּיתִי
  choice: 我已经立他
  rationale: צוה通常可指“吩咐、命令”，但与“作领袖”连用时具有任立、指定其担任职分的语用力量。正文译作“立”，同时在脚注保留较直接的“吩咐”这一可能。
- source_word: לִהְיוֹת נָגִיד
  choice: 作……的领袖
  rationale: נָגִיד指被立在民众之上的领袖或统治者。译作“领袖”既通俗庄重，又与前面的“作王”（מלך）保持词义区别。
- source_word: עַל־יִשְׂרָאֵל וְעַל־יְהוּדָה
  choice: 作以色列和犹大的领袖
  rationale: 中文以“作……的领袖”自然表达对两者的治理权；以色列和犹大均予明确保留。
theological_decisions:
- issue: נָגִיד与君王职分的关系
  choice: 译作“领袖”，并将מלך另译为“作王”
  alternative: 将נָגִיד译作“君王”“统治者”或“首领”
  rationale: 同一节分别使用מלך与נָגִיד。采用不同中文词保留两者的词汇张力，避免把两个王权相关用语完全合并；这不预设任何特定宗派对王权的解释。
- issue: צִוִּיתִי在任职语境中的含义
  choice: 正文译作“我已经立他”
  alternative: 译作“我已经吩咐他”
  rationale: 正文表达大卫指定所罗门担任职分的语境功能，脚注则保留该动词常见的“命令、吩咐”义，以免消除原文真实的词义可能。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“跟着他上来”保留行进方向与队伍次序；“接替我作王”清楚表达王位继承；正文中的“领袖”与“作王”有意区分，以反映原文使用两个不同的王权相关词。
