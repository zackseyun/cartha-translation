base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/011.yaml
  text: Then Nathan said to Bathsheba[a], Solomon’s mother, “Have you not heard that Adonijah son of Haggith has become king, and our lord David does not know it?”
translation:
  language: zh_hans
  text: 拿单对所罗门的母亲拔示巴说：“你没有听说吗？哈及的儿子亚多尼雅已经作王了，我们的主大卫却不知道这事。”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “已经作王了”也可理解为“已经自立为王了”。希伯来文直译为“已经作王／为王”；上下文可能暗示他抬举自己，但本节的措辞没有明说这一点。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 拿单……说
  rationale: 未机械译出连接词“וַ”，而以现代汉语叙事的自然承接表达事件推进。
- source_word: בַּת שֶׁבַע
  choice: 拔示巴
  rationale: 采用现代中文圣经读者熟悉的人名音译。
- source_word: אֵם שְׁלֹמֹה
  choice: 所罗门的母亲
  rationale: 保留原文用于识别拔示巴身份的同位说明。
- source_word: לֵאמֹר
  choice: 不另译
  rationale: 希伯来语引语公式在汉语“说”及引号中已自然体现，若译作“说道”会显重复。
- source_word: הֲלוֹא שָׁמַעַתְּ
  choice: 你没有听说吗
  rationale: 保留预期对方确认的反问语气；“听说”在此自然表示获知消息。
- source_word: מָלַךְ
  choice: 已经作王了
  rationale: 表达动词所指的登位或开始掌权，并保留原文未明确说明其自立为王的措辞。
- source_word: אֲדֹנִיָּהוּ בֶן חַגִּית
  choice: 哈及的儿子亚多尼雅
  rationale: 按原文亲属关系表达，并采用通行中文人名音译。
- source_word: וַאֲדֹנֵינוּ דָוִד
  choice: 我们的主大卫却
  rationale: “主”保留对君王的尊称；“却”自然显明亚多尼雅作王与大卫不知情之间的反差。
- source_word: לֹא יָדָע
  choice: 不知道这事
  rationale: 以现代汉语补出语境中隐含的宾语“这事”，清楚指向亚多尼雅作王一事。
theological_decisions:
- issue: 大卫的称号 אֲדֹנֵינוּ
  choice: 我们的主大卫
  alternative: 我们的主人大卫
  rationale: 这里是对人间君王的宫廷尊称，并非神的名号；“我们的主”较庄重，也忠实保留称号与归属后缀。
- issue: מָלַךְ 是否包含篡位或自立的判断
  choice: 已经作王了
  alternative: 已经自立为王了
  rationale: 上下文可能暗示亚多尼雅擅自称王，但本节动词本身只说明作王或开始掌权，因此正文不加入原文未明说的动机和合法性判断。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。保留宫廷语境中的尊称“我们的主”，同时用“却”呈现两项事实之间的鲜明反差。脚注标记置于整句引语之后。
