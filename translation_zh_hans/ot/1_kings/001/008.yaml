base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/008.yaml
  text: But Zadok the priest[a], Benaiah son of Jehoiada, Nathan the prophet, Shimei, Rei, and the mighty men who belonged to David were not with Adonijah.
translation:
  language: zh_hans
  text: 但祭司撒督、耶何耶大的儿子比拿雅、先知拿单、示每、利以，以及大卫手下的勇士，都没有和亚多尼雅在一起。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/צָד֣וֹק הַ/כֹּהֵן
  choice: 但祭司撒督
  rationale: 句首连接词在上下文中与前一节支持亚多尼雅的人形成对比，因此译作“但”；称号前置更符合现代汉语表达。
- source_word: וּ/בְנָיָהוּ בֶן יְהוֹיָדָע
  choice: 耶何耶大的儿子比拿雅
  rationale: 保留希伯来文父子关系，按现代汉语自然语序表达。
- source_word: וְ/נָתָן הַ/נָּבִיא
  choice: 先知拿单
  rationale: 保留拿单的职分称号，并采用自然的汉语称号加姓名结构。
- source_word: וְ/שִׁמְעִי וְ/רֵעִי
  choice: 示每、利以
  rationale: 两者均按圣经人名通行形式音译，以顿号呈现名单。
- source_word: וְ/הַ/גִּבּוֹרִים אֲשֶׁר לְ/דָוִד
  choice: 以及大卫手下的勇士
  rationale: גִּבּוֹרִים 指英勇善战之人或勇士；אֲשֶׁר לְדָוִד 表明他们隶属或归于大卫。“大卫手下的勇士”既保留关系含义，也比生硬的“属于大卫的勇士”自然。
- source_word: לֹא הָיוּ עִם אֲדֹנִיָּהוּ
  choice: 都没有跟随亚多尼雅
  rationale: 原文直译为“不与亚多尼雅在一起”，在本段政治结盟的语境中表示没有加入或支持他；“没有跟随”自然呈现这一含义，同时不具体断言他们采取了何种反对行动。
theological_decisions: []
