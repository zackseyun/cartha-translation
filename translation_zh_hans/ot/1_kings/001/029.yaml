  text: וַ/יִּשָּׁבַ֥ע הַ/מֶּ֖לֶךְ וַ/יֹּאמַ֑ר חַי יְהוָ֕ה אֲשֶׁר פָּדָ֥ה אֶת נַפְשִׁ֖/י מִ/כָּל צָרָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/029.yaml
  text: And the king swore and said[a], “As Yahweh lives, who has redeemed my life from every distress,”
translation:
  language: zh_hans
  text: 王起誓说：“我指着永活、曾救赎我的性命[a]、使我脱离一切患难的耶和华起誓：”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“我的灵魂”。希伯来语“尼斐实”（נֶפֶשׁ）可指灵魂、自己或生命；这里最自然是指大卫在危险中蒙保全的性命。
    reason: 说明原词的语义范围，并避免读者把“性命”误认为原文没有“灵魂”这一可能含义。
lexical_decisions:
- source_word: וַיִּשָּׁבַע
  choice: 起誓
  rationale: 该动词在此表示郑重立誓；“起誓”简洁、自然，也符合叙事语体。
- source_word: הַמֶּלֶךְ
  choice: 王
  rationale: 原文使用带定冠词的称号“王”，上下文虽指大卫，译文仍保留原文称号。
- source_word: וַיֹּאמַר
  choice: 说
  rationale: 这是希伯来叙事中常见的言说引介，不额外加入“宣告”等原文没有明示的语气。
- source_word: חַי יְהוָה
  choice: 我指着永活的耶和华起誓
  rationale: 这是固定的起誓公式。中文采用自然的誓言表达，既传达“耶和华活着”，也明确其起誓功能。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文读者熟悉的形式音译神的专名，避免将其仅译为称号“主”。
- source_word: אֲשֶׁר פָּדָה
  choice: 他曾救赎
  rationale: 关系从句所指的是耶和华；“曾”表明所述拯救是王回顾的既成经历，“救赎”保留 פדה 的释放、赎救意味。
- source_word: נַפְשִׁי
  choice: 我的性命
  rationale: נֶפֶשׁ 在危险与获救的语境中主要指人的生命，而非专指与身体相对的灵魂；“性命”在中文中贴合蒙保全脱险的语境。
- source_word: מִכָּל צָרָה
  choice: 使我脱离一切患难
  rationale: 介词短语表达从各种困厄中被救出；补出“使我脱离”形成自然中文，同时保留 כָּל 的周全范围。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威；主
  rationale: 原文直接使用四字神名。正文保留专名而不以“主”替代；“耶和华”是现代简体中文圣经语境中最广为识别的形式，且不引入宗派性解释。
- issue: נַפְשִׁי 在本节中的含义
  choice: 我的性命
  alternative: 我的灵魂；我自己
  rationale: 本节回顾的是从患难和生命危险中蒙救赎，因此按语境译为“性命”，避免把后期的身心二分观念强加给该词；脚注保留“灵魂”这一较直译的可能。
- issue: חַי יְהוָה 的誓言功能
  choice: 我指着永活的耶和华起誓
  alternative: 耶和华是永活的；耶和华活着
  rationale: 该短语在此并非单独作一般性的神学陈述，而是引出誓言。译文明确其语用功能，同时保留“永活”所表达的内容。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“王起誓说”紧贴原文结构；引语中的誓言公式按自然中文稍作展开。句末采用句号以形成可独立刊载的经节；若与下一节连续排版，可将句号调整为逗号，使誓言内容顺接下文。
