base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/042.yaml
  text: While he was still speaking[a], behold, Jonathan son of Abiathar the priest came. And Adonijah said, “Come in, for you are a worthy man and bring good news.”
translation:
  language: zh_hans
  text: 他还在说话的时候，看哪，祭司亚比亚他的儿子约拿单来了。亚多尼雅说：“进来吧！因为你是个有才干的人[a]，必是来报好消息的。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “有才干的人”也可译作“英勇的人”或“有地位的人”（希伯来语：אִישׁ חַיִל）。这个词组可按上下文指勇武、才干或社会地位。
    reason: lexical_alternative
lexical_decisions:
- source_word: עוֹדֶנּוּ מְדַבֵּר
  choice: 他还在说话的时候
  rationale: 以自然的现代汉语表达持续中的动作，并保留另一事件正在此时发生的时间关系。
- source_word: וְהִנֵּה
  choice: 看哪
  rationale: 保留原文提示突发、引人注意之事的叙事标记及其鲜明感。
- source_word: יוֹנָתָן
  choice: 约拿单
  rationale: 采用现代中文圣经语境中通行的人名译法。
- source_word: בֶּן אֶבְיָתָר הַכֹּהֵן
  choice: 祭司亚比亚他的儿子
  rationale: 按构词关系理解“祭司”修饰亚比亚他，并以清楚自然的汉语表明父子关系。
- source_word: בָּא
  choice: 来了
  rationale: 直接呈现约拿单到来的叙事事件，也与“看哪”所引出的现场感协调。
- source_word: בֹּא
  choice: 进来吧
  rationale: 结合场景把命令式译为邀请对方进入聚集之处；语气自然且不过度发挥。
- source_word: כִּי
  choice: 因为
  rationale: 明确表达亚多尼雅邀请约拿单进来的理由。
- source_word: אִישׁ חַיִל
  choice: 有才干的人
  rationale: 此处重点较可能是约拿单可靠、能干，适合传递重要消息，而非特指战场英勇；同时以脚注保留该词组可指勇武或有地位之人的语义范围。
- source_word: וְטוֹב תְּבַשֵּׂר
  choice: 你一定会报好消息
  rationale: 表达亚多尼雅因约拿单的身份而作出的乐观判断。“报好消息”自然对应בשר；“一定会”传达话语中的确信语气，而不是把好消息当作已经证实的事实。
