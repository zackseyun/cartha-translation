base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/039.yaml
  text: Then Zadok the priest took the horn of oil from the tent and anointed Solomon[a]. Then they blew the ram’s horn, and all the people said[b], “Long live King Solomon!”
translation:
  language: zh_hans
  text: 祭司撒督从帐幕中取出盛膏油的角，膏抹所罗门[a]。随后，他们吹响号角[b]，全体民众说：“所罗门王万岁！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“膏立所罗门”。
    reason: lexical_alternative
  - marker: b
    text: “号角”原文指兽角制成的号，通常是羊角号。
    reason: lexical_clarification
lexical_decisions:
- source_word: וַיִּקַּח
  choice: 取来
  rationale: 该动词在连续叙事中表示撒督接着采取的行动；“取来”自然表达他从帐幕中拿出器物。
- source_word: צָדוֹק הַכֹּהֵן
  choice: 祭司撒督
  rationale: 按现代汉语习惯将职衔置于人名前，准确保留其身份。
- source_word: קֶרֶן הַשֶּׁמֶן
  choice: 盛膏油的角
  rationale: 保留“角”这一具体礼仪器物形象，同时用“盛膏油的”清楚表达结构关系，避免“油角”在现代汉语中费解。
- source_word: מִן הָאֹהֶל
  choice: 从帐幕里
  rationale: 原文直译为“从那帐篷”；结合此处圣所语境译作“帐幕”，并以脚注保留较宽泛的字面可能。
- source_word: וַיִּמְשַׁח
  choice: 膏立
  rationale: 此处是以膏油确立所罗门为王；“膏立”既保留膏抹行动，又自然传达王权授立语境。
- source_word: וַיִּתְקְעוּ בַּשּׁוֹפָר
  choice: 吹响号角
  rationale: שׁוֹפָר是用兽角制成的号；“号角”简明自然，脚注说明其通常为羊角号。
- source_word: כָּל הָעָם
  choice: 全体民众
  rationale: 准确表达参与欢呼者的整体性和公开性。
- source_word: יְחִי הַמֶּלֶךְ שְׁלֹמֹה
  choice: 所罗门王万岁！
  rationale: 这是汉语中自然、庄重的拥王欢呼语，对应原文祝愿君王长久存活的祈愿式。
theological_decisions:
- issue: הָאֹהֶל在膏立君王语境中的具体所指
  choice: 帐幕
  alternative: 帐篷
  rationale: 定冠词所指的帐幕处于敬拜和膏立的语境中，译作“帐幕”较为自然；但原词本身只是“帐篷、帐幕”，故脚注保留较宽泛的字面译法。
- issue: וַיִּמְשַׁח的礼仪与王权含义
  choice: 膏立
  alternative: 膏抹
  rationale: “膏立”在王权语境中兼顾实际涂膏与授立为王的意义；“膏抹”更贴近动作本身，但较少显出本节的王位确立语境。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“膏立”与“万岁”符合君王授立和民众欢呼的语境；正文中的[a]、[b]均与脚注对应。
