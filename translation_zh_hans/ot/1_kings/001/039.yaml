revisions:
- from: 祭司撒督从帐幕里取来盛膏油的角，膏立所罗门[a]。随后，人们吹响号角[b]，全体民众高呼：“所罗门王万岁！”
  to: 祭司撒督从帐幕中取出盛膏油的角，膏抹所罗门[a]。随后，他们吹响号角[b]，全体民众说：“所罗门王万岁！”
  rationale: 修订仅收回正文中超出原文直接表述的两处解释性加强：以“膏抹”对应实际礼仪动作，以“说”对应叙事动词。保留原有脚注锚点，并将“膏立”置于脚注，既照顾王权语境，也不改变正文的源语开放性。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T05:50:39Z'
