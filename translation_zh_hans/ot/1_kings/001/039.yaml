  terminology: “帐幕”适合此处带定冠词的礼仪语境，且不把原文普通名词强定为“会幕”。“膏抹”保留仪式术语的具体动作；脚注列出“膏立”这一语境化译法。“号角”对应shofar，脚注说明其通常为羊角号，避免正文过度限定。
