base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/037.yaml
  text: Just as Yahweh has been with my lord the king[a], so may he be with Solomon and make his throne greater than the throne of my lord King David.
translation:
  language: zh_hans
  text: “雅威曾怎样与我主我王同在，愿他[a]也照样与所罗门同在，使他的宝座比我主大卫王的宝座更为显赫。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“愿雅威也照样与所罗门同在。”希伯来文祈愿式“愿……同在”的主语没有明说，是承接上句的雅威。
    reason: 说明祈愿式的隐含主语及可明确表达的译法。
lexical_decisions:
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常用音译呈现四字神名，保留其专名性质，不以“主”这一称号替代。
- source_word: כַּאֲשֶׁר ... כֵּן
  choice: 怎样……也照样
  rationale: 保留希伯来语的对应比较结构，同时使祝愿在现代汉语中自然连贯。
- source_word: הָיָה ... עִם
  choice: 与……同在
  rationale: 准确表达神的陪伴与扶持；结合上下文，“怎样……同在”可涵盖雅威过去并持续与大卫同在的意思。
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: 我主我王
  rationale: 保留宫廷敬语中的第一人称所属关系和君王称号，汉语表达简洁而庄重。
- source_word: יהי
  choice: 愿他……同在
  rationale: 以“愿”表达祈愿式；保留原文未明说主语的特点，用代词承接前句的雅威。
- source_word: וִיגַדֵּל
  choice: 使……更尊大
  rationale: 该使役形式意为“使之为大”；与宝座搭配时，“更尊大”既保留比较意义，也自然指向王权的显赫与尊荣。
- source_word: כִּסְאוֹ
  choice: 他的宝座
  rationale: 保留“宝座”的具体意象，不直接改写为“王权”或“国位”，同时其转喻含义仍可由上下文理解。
- source_word: מִכִּסֵּא
  choice: 比……的宝座更
  rationale: 将介词 מן 在比较结构中的功能明确译为“比……更”。
- source_word: אֲדֹנִי הַמֶּלֶךְ דָּוִד
  choice: 我主大卫王
  rationale: 采用自然的现代汉语称谓次序，并保留说话者对大卫的尊称。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名，因此正文采用音译“雅威”，保留其作为以色列之神专名的性质。
- issue: 祈愿式 יהי 的隐含主语
  choice: 以“他”承接前句的雅威
  alternative: 明确译作“愿雅威也与所罗门同在”
  rationale: 希伯来文祈愿式未明说主语，但语境自然回指雅威；正文以代词保留原文衔接与轻微含蓄，脚注说明可明确表达的译法。
translation_notes:
  register: 采用庄重、清晰的现代标准汉语。“我主我王”保留宫廷语境中的敬称；“宝座”保留原文意象。标点与引号表明本节为比拿雅所说的话。
