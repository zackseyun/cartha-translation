id: 1KI.1.13
reference: 1 Kings 1:13
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: לְכִ֞י וּ/בֹ֣אִי אֶל הַ/מֶּ֣לֶךְ דָּוִ֗ד וְ/אָמַ֤רְתְּ אֵלָי/ו֙ הֲ/לֹֽא אַתָּ֞ה אֲדֹנִ֣/י הַ/מֶּ֗לֶךְ נִשְׁבַּ֤עְתָּ לַ/אֲמָֽתְ/ךָ֙ לֵ/אמֹ֔ר כִּֽי שְׁלֹמֹ֤ה בְנֵ/ךְ֙ יִמְלֹ֣ךְ אַחֲרַ֔/י וְ/ה֖וּא יֵשֵׁ֣ב עַל כִּסְאִ֑/י וּ/מַדּ֖וּעַ מָלַ֥ךְ אֲדֹנִיָֽהוּ׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/013.yaml
  text: Please go in to King David and say to him[a], ‘My lord the king, did you not swear to your servant, saying, “Solomon your son shall reign after me, and he shall sit on my throne”? Why then has Adonijah become king?’
translation:
  language: zh_hans
  text: 你去进见大卫王，对他说：“我主我王啊，你不是曾向你的婢女[a]起誓说：‘你儿子所罗门必接续我作王，他必坐在我的王位上’吗？那么，亚多尼雅为什么作了王呢？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “婢女”原文为阴性词，是拔示巴在王面前谦卑的女性自称；也可译作“女仆”。
    reason: 说明原文的性别信息和宫廷自谦语气。
lexical_decisions:
- source_word: לְכִי וּבֹאִי
  choice: 你去进见
  rationale: 两个阴性单数命令式连续使用，直译为“去，进去”；“去进见”既保留动作次序，也自然体现进入王前的宫廷语境。
- source_word: אֶל הַמֶּלֶךְ דָּוִד
  choice: 大卫王
  rationale: 按现代汉语的人名加头衔格式表达定冠词所标明的王号。
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: 我主我王啊
  rationale: 保留对人间君王的双重尊称，并以“啊”自然呈现当面恭敬呼告的语气；此处“主”不是上帝的名号。
- source_word: נִשְׁבַּעְתָּ
  choice: 起誓
  rationale: 该动词明确指立誓，而非一般性的承诺。
- source_word: לַאֲמָתְךָ
  choice: 向你的婢女
  rationale: 原词为阴性名词，是拔示巴在王面前谦卑的女性自称；“婢女”比笼统的“仆人”更准确。
- source_word: לֵאמֹר כִּי
  choice: 起誓说
  rationale: 引出誓言内容；כִּי在这里不必另加“确实”或“必定”，避免过度翻译。
- source_word: יִמְלֹךְ אַחֲרַי
  choice: 必接续我作王
  rationale: 兼顾动词“作王、统治”和אַחֲרַי所表达的王位继承次序。
- source_word: וְהוּא יֵשֵׁב עַל כִּסְאִי
  choice: 他必坐在我的王位上
  rationale: 保留“坐在宝座上”的登基意象，同时“王位”在现代汉语中清楚表达王权座位的含义。
- source_word: וּמַדּוּעַ מָלַךְ אֲדֹנִיָּהוּ
  choice: 那么，亚多尼雅为什么作了王呢
  rationale: “那么”体现连接词所带出的推论和质问；完成式מָלַךְ在上下文中表示已经取得王位或自立为王，译作“作了王”保留其表述张力。
theological_decisions:
- issue: 誓言引语中כִּי的力度
  choice: 不另译“确实”或“必定”；用后续两个“必”表达未完成式在誓言中的确定性
  alternative: 译为“我确实要让你儿子所罗门接续我作王”
  rationale: כִּי主要引出誓言内容；额外加入强调词会超出原文所必需的力度，而“必……必……”已自然传达庄严承诺。
- issue: 亚多尼雅王权状态的表达
  choice: 作了王
  alternative: 登基作王／自立为王
  rationale: 原文只用מָלַךְ，并未在本节明确说明其王权是否合法或采用何种程序；“作了王”保留叙事中的政治与神学张力，不擅自判定。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。宫廷称谓保留“我主我王”和“婢女”的尊卑色彩；问句用“那么……呢”呈现依据誓言提出的质问。
