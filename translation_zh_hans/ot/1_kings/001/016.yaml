  text: Bathsheba bowed down and prostrated herself before the king[a], and the king said, “What do you want?”
translation:
  language: zh_hans
  text: 拔示巴低头俯伏在王面前，王问：“你有什么事？”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译：“你有什么事？”这是一个习语，也可表示“你想要什么？”或“什么事使你烦恼？”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּקֹּד
  choice: 低头
  rationale: קָדַד表示屈身、低头行礼；译作“低头”自然地保留这一身体动作，也不额外限定为跪下。
- source_word: בַּת שֶׁבַע
  choice: 拔示巴
  rationale: 采用现代中文圣经读者熟悉的人名音译。
- source_word: וַתִּשְׁתַּחוּ
  choice: 俯伏
  rationale: שׁחה的这一词形表示俯身伏地或深深敬拜、致敬；“俯伏”与前面的“低头”有别，保留原文连续两个动作所呈现的郑重礼节。
- source_word: לַמֶּלֶךְ
  choice: 在王面前
  rationale: 介词ל在此与致敬动作连用，指动作朝向王；中文用“在王面前”自然贴合宫廷语境。
- source_word: וַיֹּאמֶר הַמֶּלֶךְ
  choice: 王问
  rationale: 原文直译为“王说”，但其后是问句，现代中文叙事用“王问”更自然，并准确表达言语功能。
- source_word: מַה לָּךְ
  choice: 你有什么事？
  rationale: 该习语字面为“你有何事／对你是什么”，可询问对方的请求或困扰；“你有什么事？”既自然得体，也保留两种语境可能性，不把意思过度限定为“想要什么”。
