base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/004.yaml
  text: The young woman was very beautiful[a], and she became the king’s attendant and served him, but the king did not know her.
translation:
  language: zh_hans
  text: 那年轻女子非常美丽。她作王的侍女，服侍王；但王没有亲近她[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“没有认识她”；“认识”在这里是发生性关系的委婉说法。
    reason: 说明原文“认识”的字面表达及其在此处指发生性关系的委婉含义。
lexical_decisions:
- source_word: הַנַּעֲרָה
  choice: 这少女
  rationale: נַעֲרָה指年轻女子；“少女”在现代汉语中简洁自然，又符合叙事语境。定冠词结合上文语境译作“这”。
- source_word: יָפָה עַד מְאֹד
  choice: 极其美丽
  rationale: עַד מְאֹד强烈加深程度；“极其美丽”既保留强调，也保持庄重自然。
- source_word: סֹכֶנֶת
  choice: 贴身侍女
  rationale: 该词在此指在王身边照料、服侍他的年轻女子。“贴身侍女”表达近身照料的职分，同时避免把她过度限定为医护人员或伴侣。
- source_word: וַתְּשָׁרְתֵהוּ
  choice: 服侍王
  rationale: שרת表示服侍、侍候；用“服侍王”自然清楚，并明确代词所指。
- source_word: יְדָעָהּ
  choice: 没有亲近她
  rationale: ידע字面为“认识”，在这里委婉指性关系。汉语“亲近她”保留委婉和一定的文学含蓄，脚注则明确原文措辞及其语境含义。
theological_decisions:
- issue: 叙事中以“认识”委婉表示性关系
  choice: 正文译作“没有亲近她”，并以脚注说明
  alternative: 没有与她同房／没有和她发生性关系／没有认识她
  rationale: “没有认识她”在现代汉语中不能自然传达希伯来语的性含义，容易造成误解；直接译作“发生性关系”则会消除原文的委婉语气。“没有亲近她”兼顾含蓄和可理解性，而脚注确保读者清楚这里是说王未与她发生性关系。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“极其美丽”保留原文的强烈程度；“贴身侍女”体现她在王身边照料和服侍的角色，但不额外加入医疗或婚姻含义。脚注标记置于“亲近她”之后，与所解释的词语直接对应。
