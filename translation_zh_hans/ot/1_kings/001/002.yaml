source:
  edition: WLC
  text: וַ/יֹּ֧אמְרוּ ל֣/וֹ עֲבָדָ֗י/ו יְבַקְשׁ֞וּ לַ/אדֹנִ֤/י הַ/מֶּ֨לֶךְ֙ נַעֲרָ֣ה בְתוּלָ֔ה וְ/עָֽמְדָה֙ לִ/פְנֵ֣י הַ/מֶּ֔לֶךְ וּ/תְהִי ל֖/וֹ סֹכֶ֑נֶת וְ/שָׁכְבָ֣ה בְ/חֵיקֶ֔/ךָ וְ/חַ֖ם לַ/אדֹנִ֥/י הַ/מֶּֽלֶךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/002.yaml
  text: So his servants said to him[a], “Let them seek for my lord the king a young virgin woman, and let her attend the king and be his caregiver, and let her lie in your bosom[c][b], so that my lord the king may be warm.”
translation:
  language: zh_hans
  text: 于是，臣仆对他说：“请让人为我主我王寻找一位年轻的处女，让她侍立在王面前[a]，照料王[b]；让她躺在你怀中[c]，好使我主我王暖和起来。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“站在王面前”。这个希伯来语说法也可指在某人面前随侍、服侍。
    reason: lexical_alternative
  - marker: b
    text: 原文所用的词很少见，也可译作“服侍王”或“作王的看护人”。
    reason: lexical_alternative
  - marker: c
    text: 直译：“躺在你的胸怀里。”
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲבָדָיו
  choice: 臣仆
  rationale: 在王宫语境中，此词指服侍君王的人，也可能包括宫廷侍从或官员；“臣仆”既符合他们对王说话的身份和语域，也不武断强调奴隶身份。
- source_word: יְבַקְשׁוּ
  choice: 请让人……寻找
  rationale: 希伯来语为第三人称阳性复数未完成式，在此带提议或劝请意味。汉语用不定指的“让人”自然表达复数行动者，同时不擅自改成“让我们”。
- source_word: לַאדֹנִי הַמֶּלֶךְ
  choice: 为我主我王
  rationale: 保留“我主”与“王”并列的宫廷敬称，以及原文第一人称所属关系。
- source_word: נַעֲרָה בְתוּלָה
  choice: 一位年轻的处女
  rationale: “年轻的”体现 נַעֲרָה 所指的年轻女性，“处女”体现 בְתוּלָה；中文无需再加“女子”也能自然保留两项语义。
- source_word: וְעָמְדָה לִפְנֵי הַמֶּלֶךְ
  choice: 让她侍立在王面前
  rationale: 原文字面是“站在王面前”，在宫廷语境中可指随侍、服侍。“侍立在……面前”兼顾具体意象与惯用含义。
- source_word: סֹכֶנֶת
  choice: 照料王
  rationale: 这是罕见词，语境表明该女子要服侍并照料年老的王。“照料”避免把词义过度限定为现代职业性的“护理员”或带其他暗示的“伴侣”。
- source_word: וְשָׁכְבָה בְחֵיקֶךָ
  choice: 让她躺在你怀中
  rationale: חֵיק 可指胸怀、怀抱或衣襟内侧；“怀中”保留身体贴近的具体画面，也符合为王取暖的上下文。
- source_word: וְחַם
  choice: 好使我主我王暖和起来
  rationale: 此处承接前面的安排，表达预期目的或结果；“好使”清楚呈现这一关系。
theological_decisions: []
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“臣仆”和“我主我王”保留宫廷对话的敬语色彩；“侍立”“怀中”略带正式感，但在叙事中自然，并贴近希伯来文意象。
