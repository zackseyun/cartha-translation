base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/005.yaml
  text: Adonijah the son of Haggith exalted himself[a], saying, “I will reign.” So he made for himself a chariot, horsemen[b], and fifty men running before him.
translation:
  language: zh_hans
  text: 哈及的儿子亚多尼雅自高[a]，说：“我要作王。”他为自己备了战车、骑兵和五十名在他前面奔跑的男子。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“自我抬举”“使自己显为高大”。原文动词含有自我高举的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִתְנַשֵּׂא
  choice: 抬高自己
  rationale: 该词是 נשׂא 的 Hitpael 分词，表达自我抬举、自我高抬；“抬高自己”保留反身含义及经文隐含的负面意味。
- source_word: לֵאמֹר אֲנִי אֶמְלֹךְ
  choice: 说：“我要作王。”
  rationale: לֵאמֹר 引出直接引语；אֶמְלֹךְ 可表示“我要作王”或“我要掌权”。“作王”在现代汉语中自然地表达其争取王位的主张，同时保留动词语气。
- source_word: וַיַּעַשׂ לוֹ
  choice: 他为自己备了
  rationale: עשה 基本义为“做”，在战车、骑兵及随从的语境中表示为自己置备、安排；“备了”简洁自然，又不过度说明取得这些事物的方式。
- source_word: רֶכֶב
  choice: 战车
  rationale: 此处为单数，按上下文指彰显王者身份的车辆；汉语“战车”无需另加数量词，也能保留单数整体概念。
- source_word: פָרָשִׁים
  choice: 骑兵
  rationale: 复数名词指骑马的随从或骑士；“骑兵”是现代汉语中简洁清楚的对应，不额外限定其具体编制。
- source_word: חֲמִשִּׁים אִישׁ
  choice: 五十名……的人
  rationale: אִישׁ 明指男性个体；“五十名……的人”在汉语中准确表达人数，并与后面的分词短语自然衔接。
- source_word: רָצִים לְפָנָיו
  choice: 在他前面奔跑的人
  rationale: 分词 רָצִים 描写这些人的持续职能或行动，即在亚多尼雅前面奔跑，构成王室排场。
theological_decisions:
- issue: 亚多尼雅行为的刻画
  choice: 抬高自己
  alternative: 自立；自高；自封为王
  rationale: 原文以反身动词暗示其野心和自我抬举，却没有在这一短语中明说他已“自封为王”。译文保留隐含批评，不将判断扩写得超过原文。
- issue: 王位宣称 אֲנִי אֶמְלֹךְ 的含义
  choice: 我要作王
  alternative: 我要掌权；我必作王
  rationale: 该动词既可着重“统治”，也可表达“成为王”。上下文涉及王位争夺，因此“作王”自然明确；“要”保留其意志与宣称，而不把结果说成必然实现。
- issue: 随从的性别表达
  choice: 五十名……的人
  alternative: 五十名随从；五十人
  rationale: 原文 אִישׁ 为阳性名词，所指是王室行列中的男性奔跑者。译文不刻意中性化，也不增添原文没有的职位称谓。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。句首连接词 וַ 不机械译为“现在”或“于是”；汉语依靠句序自然推进叙事。“哈及的儿子亚多尼雅”保留希伯来语亲属标识的清晰度。脚注仅说明 מִתְנַשֵּׂא 的真实词义幅度；不在“骑兵”处附与其无关的“我要作王”异译说明。
