base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/028.yaml
  text: Then King David answered and said[a], “Call Bathsheba to me.” So she came before the king and stood before the king.
translation:
  language: zh_hans
  text: 大卫王就回应说[a]：“把拔示巴叫到我这里来。”她便来到王面前，站在王面前。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“回答说”。希伯来文叙事常用“回答”来引出话语，即使前面没有直接的问题。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן
  choice: 回应
  rationale: ענה在叙事中常作为引出话语的惯用表达，可译为“回答”或“回应”；此处没有紧接的直接问句，“回应”在现代汉语中较自然，同时保留其承接前文情境的意味。
- source_word: הַמֶּלֶךְ דָּוִד
  choice: 大卫王
  rationale: 将头衔与人名译为“大卫王”，符合现代汉语习惯，也准确表达希伯来文的同位结构。
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: אמר是普通的言说动词，“说”最直接自然；与前面的“回应”合用，保留希伯来文“回应并说”的表达。
- source_word: קִרְאוּ לִי
  choice: 把……叫到我这里来
  rationale: קרא与ל连用表示叫来或召来某人；这一译法既传达王命，也避免使用过度正式的措辞。
- source_word: לְבַת שָׁבַע
  choice: 拔示巴
  rationale: 采用现代简体中文圣经语境中通行的人名音译。
- source_word: וַתָּבֹא לִפְנֵי הַמֶּלֶךְ
  choice: 她便来到王面前
  rationale: בוא加לפני表示来到某人面前或进入其所在之处；“来到王面前”忠实且自然。
- source_word: וַתַּעֲמֹד לִפְנֵי הַמֶּלֶךְ
  choice: 站在王面前
  rationale: עמד的基本义为“站”；保留“在王面前”的重复，以呈现原文正式的宫廷场景。
theological_decisions: []
