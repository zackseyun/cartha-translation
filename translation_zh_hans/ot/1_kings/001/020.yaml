base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/020.yaml
  text: And you[a], my lord the king, the eyes of all Israel are on you[b], to tell them who will sit on the throne of my lord the king after him.
translation:
  language: zh_hans
  text: 我主我王啊，以色列众人的眼目都注视着你[a]，要由你告诉他们：谁将继我主我王之后，坐上我主我王的宝座。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“全以色列的眼睛都在你身上。”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: 我主我王
  rationale: אֲדֹנִי 是臣下对君王的敬称；与 הַמֶּלֶךְ 连用时译作“我主我王”，既保留敬意和领属形式，也符合庄重自然的现代汉语。
- source_word: עֵינֵי כָל יִשְׂרָאֵל עָלֶיךָ
  choice: 以色列众人都仰望你
  rationale: 原文直译为“全以色列的眼睛都在你身上”，表示众人关注并等候王作出决定。“仰望你”保留期待和尊敬之意，也比逐字表达更符合现代汉语。
- source_word: לְהַגִּיד לָהֶם
  choice: 等你告诉他们
  rationale: נגד 的使役式不定词表示把事情告知人。这里结合“仰望你”的语境，用“等你告诉他们”自然表达众人期待王宣布继承人的意思。
- source_word: מִי יֵשֵׁב
  choice: 谁将坐上
  rationale: ישב 与王位连用，既有实际“坐”的意象，也指登位掌权；“将坐上”保留原文意象和将来语气。
- source_word: עַל כִּסֵּא
  choice: 坐上……王位
  rationale: כִּסֵּא 可指宝座或王位。此处关乎王位继承，“王位”在汉语中清楚自然，同时“坐上”保留登上宝座的意象。
- source_word: אַחֲרָיו
  choice: 在我主我王之后
  rationale: 该词带第三人称阳性单数后缀，最自然地回指正在受话的王，即大卫；译文保留“在……之后”的继承时间关系。
theological_decisions:
- issue: אַחֲרָיו 中代词的所指
  choice: 在我主我王之后，即大卫之后
  alternative: 此后；在这事以后
  rationale: 原文是介词加第三人称阳性单数后缀，语法和王位继承的上下文都表明所指是大卫。正文仍采用原文的人称关系，不把它泛化为单纯的时间副词。
- issue: “坐上王位”的含义
  choice: 保留坐上王位的具体意象，同时让读者理解为继承王权
  alternative: 直接译为“继承王位”或“作王”
  rationale: 原文使用 ישב 与 כִּסֵּא 的组合，明确呈现“坐在宝座上”的意象。译作“坐上他的王位”既自然，又避免用解释性措辞取代原文图像。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“我主我王啊”体现宫廷语境中的敬称；“仰望”表达全以色列对王之决定的关注和等候。正文保留王位与坐上王位的意象，脚注说明希伯来语习语及代词所指。
