  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יַּ֨עַן בְּנָיָ֧הוּ בֶן יְהֽוֹיָדָ֛ע אֶת הַ/מֶּ֖לֶךְ וַ/יֹּ֣אמֶר אָמֵ֑ן כֵּ֚ן יֹאמַ֣ר יְהוָ֔ה אֱלֹהֵ֖י אֲדֹנִ֥/י הַ/מֶּֽלֶךְ־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/036.yaml
  text: Benaiah son of Jehoiada answered the king and said[a], “Amen! May Yahweh, the God of my lord the king, say so.”
translation:
  language: zh_hans
  text: 耶何耶大的儿子比拿雅回答王说[a]：“阿们！愿雅威——我主我王的神——这样说。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “愿……这样说”也可按其语境意译为“愿雅威——我主我王的神——认可此事”。希伯来文直译是“说”，在这里含有确认或命定王所愿之事的意味。
    reason: 说明希伯来动词“说”在此祈愿语境中的字面意义与语用含义。
lexical_decisions:
- source_word: וַיַּעַן
  choice: 回答
  rationale: 这是 ענה 在叙事对话中引出回应的常见用法；“回答”直接、自然。
- source_word: בְּנָיָהוּ בֶן יְהוֹיָדָע
  choice: 耶何耶大的儿子比拿雅
  rationale: 采用现代中文圣经读者较熟悉的人名音译，并保留希伯来语父子关系结构。
- source_word: אֶת הַמֶּלֶךְ
  choice: 王
  rationale: אֶת 是直接宾语标记，不需译出；带定冠词的 הַמֶּלֶךְ 在上下文中自然译作“王”。
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: 保留希伯来叙事中常见的言说引介，同时避免中文里“回答……并说”的冗赘。
- source_word: אָמֵן
  choice: 阿们
  rationale: 此处既表达赞同，也带有愿事情如此成就的意味；“阿们”保留原词的礼仪色彩和强调语气。
- source_word: כֵּן
  choice: 这样
  rationale: 回指大卫刚才所表达的旨意；“这样”简洁自然，不额外增添内容。
- source_word: יֹאמַר
  choice: 愿……说
  rationale: 该未完成式在“阿们”之后具有祈愿或意愿色彩；“愿……说”保留动词“说”的字面形态及其确认意味。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以中文音译呈现四字神名，保留其作为以色列之神专名的性质，而不以称号代替。
- source_word: אֱלֹהֵי
  choice: ……的神
  rationale: 准确表达附属结构，并符合现代汉语习惯。
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: 我主我王
  rationale: 保留宫廷语境中的尊称和第一人称所属关系；“我主我王”庄重而简洁。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”按较通行的学术重构音译为中文，可清楚表明这是专名，而非“主”这一称号。
- issue: יֹאמַר 在此处的含义
  choice: 愿……说
  alternative: 愿……认可／成全此事
  rationale: 上下文容许把“说”理解为神确认或命定王的意愿，但正文保留原文动词的表达，不把隐含意义直接固定为“认可”或“成全”。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。保留“阿们”及神名“雅威”的宗教语域；以破折号清楚标示“我主我王的神”是对“雅威”的同位说明。
