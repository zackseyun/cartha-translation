base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/023.yaml
  text: And they told the king, saying, “Look, Nathan the prophet is here.” And he came before the king and bowed down to the king with his face to the ground.
translation:
  language: zh_hans
  text: 他们禀告王说：“看，先知拿单来了。”拿单来到王面前，俯伏在地，向王下拜。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּגִּידוּ לַמֶּלֶךְ לֵאמֹר
  choice: 有人禀告王说
  rationale: 希伯来文动词为第三人称复数，但主语未明；汉语用“有人”自然保留不特指的施事者。“禀告”符合臣下向君王报告的语境。
- source_word: הִנֵּה נָתָן הַנָּבִיא
  choice: 看，先知拿单来了
  rationale: הִנֵּה具有引起注意、提示眼前情况的作用；“看”保留其话语功能，“来了”按语境表达拿单已经到场，而不机械补出系词。
- source_word: וַיִּשְׁתַּחוּ לַמֶּלֶךְ
  choice: 向王下拜
  rationale: שׁחה在此指臣下对君王行俯伏礼；“下拜”既清楚又避免赋予该动作敬拜神的专属含义。
- source_word: עַל־אַפָּיו אָרְצָה
  choice: 俯伏在地
  rationale: 字面意象为“脸朝地”；汉语“俯伏在地”自然传达身体伏地的姿态，并与“向王下拜”共同保留动作细节。
theological_decisions:
- issue: 向君王俯伏是否译作宗教性的“敬拜”
  choice: 向王下拜
  alternative: 敬拜王
  rationale: 上下文描述宫廷礼仪，并不要求宗教崇拜含义；采用中性的礼仪用语，以免引入原文未明说的神学判断。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言；保留希伯来文的报道公式和“看”的现场提示语气，同时避免生硬直译。
