base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/041.yaml
  text: Adonijah and all the invited guests who were with him heard it as they finished eating[a]. And when Joab heard the sound of the trumpet, he said[b], “Why is the sound of the city in an uproar?”
translation:
  language: zh_hans
  text: 亚多尼雅和同他在一起的所有受邀的宾客听见了这声音；那时，他们刚吃完饭[a]。约押听见号角[b]声，就说：“城里为什么这样喧闹？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们吃完饭的时候。”希伯来文可指饭刚吃完，也可着重指出他们吃完饭的那一刻。
    reason: lexical_alternative
  - marker: b
    text: “号角”原文指用兽角制成、用于发出公共信号的角号。
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: 听见了这声音
  rationale: 动词本义是“听见”；原文未明说宾语，中文按上文语境补出“这声音”，使句意自然连贯。
- source_word: הַקְּרֻאִים
  choice: 宾客
  rationale: 这是קרא“召来、邀请”的被动分词；在宴席语境中指受邀赴席的人，译作“宾客”简洁自然。
- source_word: וְהֵם כִּלּוּ לֶאֱכֹל
  choice: 那时，他们刚吃完饭
  rationale: כִּלּוּ表示完成，לֶאֱכֹל说明所完成的是进食；“刚吃完饭”既保留完成之意，也表达声音传来时宴席正告结束。原句与前句为并列关系，译文用“那时”呈现其时间联系。
- source_word: קוֹל הַשּׁוֹפָר
  choice: 号角声
  rationale: שׁוֹפָר指用兽角制成、用于公共信号的号角；“号角声”在现代中文中清楚且符合叙事语体。
- source_word: מַדּוּעַ
  choice: 为什么
  rationale: 直接表达原因疑问，现代中文以“为什么”最自然。
- source_word: קוֹל הַקִּרְיָה הוֹמָה
  choice: 城里为什么这样喧闹
  rationale: קוֹל是声音，קִרְיָה是城，הוֹמָה表示发出嘈杂、骚动的声响；中文改用地点结构“城里……喧闹”，自然传达整句意思。
- source_word: אֲדֹנִיָּהוּ
  choice: 亚多尼雅
  rationale: 按现代中文圣经人名的通行形式音译。
- source_word: יוֹאָב
  choice: 约押
  rationale: 按现代中文圣经人名的通行形式音译。
theological_decisions: []
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“宾客”符合宴席场景；问句译作“城里为什么这样喧闹”，避免生硬直译“城的声音为何喧腾”。保留进食完成时点在希伯来文中的细微弹性，并以脚注说明。
