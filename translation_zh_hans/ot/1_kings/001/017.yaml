base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/017.yaml
  text: She said to him, “My lord, you swore by the LORD your God to your female servant, ‘Surely Solomon your son will reign after me, and he will sit on my throne.’”
translation:
  language: zh_hans
  text: 她对他说：“我主啊，你曾指着耶和华你的神向你的婢女起誓说：‘你的儿子所罗门必接续我作王，他必坐在我的王位上。’”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲדֹנִי
  choice: 我主啊
  rationale: 保留拔示巴对君王恭敬的直接称呼；“啊”使现代汉语呼语自然。
- source_word: בַּיהוָה אֱלֹהֶיךָ
  choice: 指着耶和华你的神
  rationale: נשבע ב־表示以某位为凭起誓；神名 יהוה 译作“耶和华”，既明确又符合现代中文圣经语域。
- source_word: לַאֲמָתֶךָ
  choice: 向婢女
  rationale: אָמָה是女性自谦用语，在宫廷语境中译为“婢女”兼顾性别、身份与恭敬语气。
- source_word: כִּי
  choice: （不另译为‘确实’）
  rationale: 此处引出誓言内容；希伯来语本身未必要求额外强化副词。中文用引号直接引述即可自然表达。
- source_word: יִמְלֹךְ אַחֲרָי
  choice: 必接续我作王
  rationale: 兼顾未完成式在誓言中的确定将来意义，以及 אַחֲרָי 所表达的继位次序。
- source_word: כִּסְאִי
  choice: 我的王位
  rationale: כִּסֵּא字面为“座位、宝座”，此处强调王权继承；“王位”在现代汉语中自然且准确。
theological_decisions:
- issue: 誓言引文中 כִּי 的力度
  choice: 作为引述标记处理，不添加“必定/确实”之类独立强调词
  alternative: 译作“所罗门必定……”，以“必定”对应英文咨询层的 Surely
  rationale: 原文 כִּי 在此可引出所起誓的内容；动词语境已由“必”表达确定性。避免从英文咨询层额外导入原文未明确要求的强调程度。
- issue: 神名 יהוה 的呈现
  choice: 耶和华
  alternative: 上主
  rationale: 采用现代中文读者熟悉的专名形式，保留这是以色列之神名字的指称，而非仅译作称号。
translation_notes:
  register: 采用庄重而自然的现代标准普通话，保留宫廷中的自谦称谓与君王称呼。引语层次清楚，不增添原文之外的解释，也不以宗派术语消解誓言措辞的语义空间。
