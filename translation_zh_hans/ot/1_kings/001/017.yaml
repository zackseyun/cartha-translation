  naturalness: 整体庄重、清楚，符合现代标准汉语的经文语域。补出“你的”后，自谦称谓在直接引语中的指向更自然完整。
  terminology: “我主”“耶和华你的神”“婢女”“王位”均与宫廷语境和中文圣经语域相称；不涉及需调整的神学术语。
