base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/010.yaml
  text: But he did not invite Nathan the prophet[a], Benaiah, the mighty men, or Solomon his brother.
translation:
  language: zh_hans
  text: 但他没有邀请先知拿单、比拿雅、那些勇士，也没有邀请他的兄弟所罗门。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “邀请”原文直译为“召来”或“叫来”；这里指邀请人参加亚多尼雅的宴席。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶת
  choice: 但……
  rationale: וְ承接上一节的名单，同时本节与亚多尼雅所邀请的人形成对比；用“但”自然表达语境中的转折。אֶת是宾语标记，不另译。
- source_word: נָתָן הַנָּבִיא
  choice: 先知拿单
  rationale: 按现代汉语习惯将身份称谓置于人名前，准确表达定冠词短语“那位先知拿单”。
- source_word: וּבְנָיָהוּ
  choice: 比拿雅
  rationale: 人名采用通行的中文圣经音译；前缀连词在汉语并列结构中处理。
- source_word: הַגִּבּוֹרִים
  choice: 那些勇士
  rationale: גִּבּוֹרִים在王室和军事语境中指英勇善战者，可能特指大卫麾下的勇士；“那些勇士”既自然，也保留原文定指意味。
- source_word: שְׁלֹמֹה אָחִיו
  choice: 他的兄弟所罗门
  rationale: אָחִיו中的代词按上下文指亚多尼雅；汉语将亲属称谓放在人名前更自然。“兄弟”不额外限定同父或同母，避免超出本节措辞。
- source_word: לֹא קָרָא
  choice: 没有邀请
  rationale: קָרָא字面是“叫、召”，在献祭宴席和宾客名单的语境中表示邀请赴宴；译作“邀请”准确传达此处语用含义。
