base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/044.yaml
  text: And the king sent with him Zadok the priest[a], Nathan the prophet, Benaiah son of Jehoiada, and the Cherethites and the Pelethites; and they mounted him on the king’s mule.
translation:
  language: zh_hans
  text: 王派祭司撒督、先知拿单、耶何耶大的儿子比拿雅，以及基利提人和比利提人陪他同去；他们让他骑上王的骡子[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“王的母骡。”希伯来语名词可特指雌性的骡子。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח אִתּוֹ הַמֶּלֶךְ
  choice: 王派……陪他同去
  rationale: 保留“王”这一称号，并将差派与陪同关系自然地表达出来；“陪他同去”对应 אִתּוֹ 的伴随含义。
- source_word: צָדוֹק הַכֹּהֵן
  choice: 祭司撒督
  rationale: 采用现代汉语中自然的职衔加姓名次序，并使用通行圣经人名译法。
- source_word: נָתָן הַנָּבִיא
  choice: 先知拿单
  rationale: 准确表达 נָבִיא，并使用通行圣经人名译法。
- source_word: בְּנָיָהוּ בֶּן יְהוֹיָדָע
  choice: 耶何耶大的儿子比拿雅
  rationale: 清楚表达希伯来语父子关系，姓名采用通行译法。
- source_word: הַכְּרֵתִי וְהַפְּלֵתִי
  choice: 基利提人和比利提人
  rationale: 按族群或卫队名称音译，避免加入原文没有明说的身份解释。
- source_word: וַיַּרְכִּבוּ אֹתוֹ
  choice: 他们让他骑上
  rationale: 体现 רכב 的使役形含义，同时比生硬的“使他乘骑”更符合现代汉语。
- source_word: עַל פִּרְדַּת הַמֶּלֶךְ
  choice: 王的骡子
  rationale: “骡子”是自然、准确的通称；希伯来语名词可更具体地指母骡，因此以脚注保留这一词义信息。
