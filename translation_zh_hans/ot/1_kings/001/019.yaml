base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/019.yaml
  text: And he sacrificed oxen[a], fattened cattle, and sheep in abundance, and he invited all the king’s sons, Abiathar the priest, and Joab the commander of the army[b]; but he did not invite Solomon your servant.
translation:
  language: zh_hans
  text: 他献祭了许多牛、肥壮的牲畜和羊群[a]，又邀请[b]了王的众子、祭司亚比亚他和军队统帅约押；却没有邀请你的仆人所罗门。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “羊群”所译的希伯来语词范围较广，可统指绵羊和山羊等小型群畜。
    reason: lexical_alternative
  - marker: b
    text: “邀请”也可译作“召来”或“叫来”；本节两处均使用同一个希伯来语动词。这里按献祭宴席的语境译作“邀请”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזְבַּח
  choice: 宰献了
  rationale: זבח在此指为献祭而宰杀牲畜。“宰献”既保留宰杀的具体动作，也明确其祭祀性质。
- source_word: שׁוֹר
  choice: 牛
  rationale: 该词泛指牛类牲畜；“牛”自然、准确，也避免无根据地限定为公牛。
- source_word: מְרִיא
  choice: 肥畜
  rationale: 该词指育肥的牲畜。“肥畜”保留其作为祭牲类别的含义，并与前后的集合性名词相协调。
- source_word: צֹאן
  choice: 羊群
  rationale: 该词是集合名词，指小型群畜，通常包括绵羊，也可能包括山羊；正文用自然的“羊群”，并以脚注保留其较宽泛的范围。
- source_word: לָרֹב
  choice: 许多
  rationale: 表示数量众多；将其置于牲畜清单之前，符合现代汉语语序，并传达宴祭规模盛大。
- source_word: וַיִּקְרָא / קָרָא
  choice: 邀请 / 邀请
  rationale: קרא本义为“呼叫、召来”，但在献祭宴席的语境中指请人出席。“邀请”自然表达其语用意义，并在两处保持一致。
- source_word: לְכָל בְּנֵי הַמֶּלֶךְ
  choice: 王的众子
  rationale: 保留原文明确的男性复数和王室关系；“众子”简洁庄重。
- source_word: אֶבְיָתָר הַכֹּהֵן
  choice: 祭司亚比亚他
  rationale: 按现代汉语习惯将职衔置于姓名之前，同时完整保留身份信息。
- source_word: יֹאָב שַׂר הַצָּבָא
  choice: 军队统帅约押
  rationale: שַׂר הַצָּבָא指军队的最高指挥者；“军队统帅”清楚而庄重。
- source_word: וְלִשְׁלֹמֹה עַבְדְּךָ לֹא קָרָא
  choice: 却没有邀请你的仆人所罗门
  rationale: “却”明示上下文已有的对比，但不增添因果解释；“你的仆人”保留对大卫的敬称关系。
