translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“宰献”凸显献祭性宰杀；人名依常用圣经译名，职衔置于姓名前以符合现代汉语表达。分号和“却”呈现受邀者与所罗门被排除之间的鲜明对照。
