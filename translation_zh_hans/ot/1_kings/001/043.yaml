  yaml_path: translation/ot/1_kings/001/043.yaml
  text: Jonathan answered and said to Adonijah[a], “On the contrary, our lord King David has made Solomon king.”
translation:
  language: zh_hans
  text: 约拿单回答亚多尼雅说：“不然[a]！我们的主大卫王已经立所罗门为王了。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“但我们的主大卫王已经立所罗门为王了。”希伯来语 אֲבָל 可以只译作“但”，不过在这里带有纠正、反驳的意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן וַיֹּאמֶר
  choice: 回答……说
  rationale: 两个动词分别表示“回答”和“说”；保留希伯来叙事中常见的复合引语格式，同时符合现代汉语表达。
- source_word: לַאֲדֹנִיָּהוּ
  choice: 亚多尼雅
  rationale: 介词 ל 表明话语对象，汉语以“回答亚多尼雅说”自然表达；人名按通行形式音译。
- source_word: אֲבָל
  choice: 不然
  rationale: 此处不只是一般转折，而是在纠正亚多尼雅原先的判断或期待；“不然”简洁地传达这种反驳语气，同时以脚注保留较弱的“但”这一可能译法。
- source_word: אֲדֹנֵינוּ הַמֶּלֶךְ דָּוִד
  choice: 我们的主大卫王
  rationale: אֲדֹנֵינוּ 是臣民对君王的尊称“我们的主”；“大卫王”符合现代汉语称谓习惯，并保留原文的王室语境。
- source_word: הִמְלִיךְ
  choice: 立……为王
  rationale: מלך 的使役式表示使某人成为王、确立其王位；“立……为王”准确而自然。“膏立”会加入该动词本身未明说的仪式细节。
- source_word: אֶת שְׁלֹמֹה
  choice: 所罗门
  rationale: אֶת 是直接宾语标记，汉语无需单独翻译；人名采用通行译名。
