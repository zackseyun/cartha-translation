base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/053.yaml
  text: Then King Solomon sent[a], and they brought him down from the altar. And he came and bowed down to King Solomon, and Solomon said to him, “Go to your house.”
translation:
  language: zh_hans
  text: 所罗门王就派人去，他们便把亚多尼雅从祭坛那里带下来。[a] 亚多尼雅前来向所罗门王下拜。所罗门对他说：“回你家去吧。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们便使他从祭坛上下来。”希伯来文较直译为“他们使他从祭坛上面下来”。
    reason: 保留 מֵעַל 的字面空间含义及 וַיֹּרִדֻהוּ 的使役表达；上下文则可能指他离开抓住祭坛角的位置。
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: 派人去
  rationale: 希伯来文直译为“派遣”，宾语未明说；汉语叙事中补出泛指的“人”，自然表达所罗门差遣人员执行随后行动的意思。
- source_word: וַיֹּרִדֻהוּ
  choice: 他们便把亚多尼雅……带下来
  rationale: 该动词为使役意义，复数主语未指明，表达受差遣的人使亚多尼雅下来；“带下来”兼顾使役含义与现代汉语的自然度。
- source_word: מֵעַל הַמִּזְבֵּחַ
  choice: 从祭坛那里
  rationale: מֵעַל 可指“从……上面/旁边离开”。上文说明亚多尼雅抓住祭坛的角，并不必然站在坛面上，因此正文采用不误导空间位置的“从祭坛那里”，脚注保留较直译表达。
- source_word: וַיָּבֹא
  choice: 前来
  rationale: בוא 表示“来、进入”；“前来”适合庄重叙事，也不额外指定未明说的目的地。
- source_word: וַיִּשְׁתַּחוּ
  choice: 下拜
  rationale: 该词表示俯身、伏地或行臣服礼；“下拜”保留礼敬和臣服意味，又不武断规定身体姿态的具体程度。
- source_word: לֵךְ לְבֵיתֶךָ
  choice: 回你家去吧
  rationale: 原文是“去你家”的命令；语境中是准许离开并返回住处，现代汉语用“回你家去吧”自然且保持王命的克制语气。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而清楚的叙事文体。为避免连续代词造成指代含混，在第二句重提“亚多尼雅”；“下拜”保留政治臣服礼的含义，不将其解释为敬拜。
