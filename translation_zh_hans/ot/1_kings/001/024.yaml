base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/024.yaml
  text: Then Nathan said[a], “My lord the king, have you said, ‘Adonijah will reign after me, and he will sit on my throne’?”
translation:
  language: zh_hans
  text: 拿单说：“我主我王，你曾说过[a]：‘亚多尼雅必接续我作王，坐在我的王位上’吗？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“你说过”或“你是否说过”。这里的希伯来语完成式在疑问句中可表示对先前是否作出此宣告的询问。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: 该叙事形式承接前文并推进事件；现代汉语在此无需机械译出连接词，直接用“说”更自然。
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: 我主我王
  rationale: 保留对大卫兼具臣属敬意和王室身份的宫廷称呼；“我主我王”简洁、庄重，也符合中文圣经叙事语体。
- source_word: אַתָּה אָמַרְתָּ
  choice: 你曾说过……吗
  rationale: 希伯来语完成式在疑问句中询问大卫是否确实作过这一宣告；“曾说过……吗”自然表达既往行为，同时保留疑问性质。
- source_word: אֲדֹנִיָּהוּ
  choice: 亚多尼雅
  rationale: 采用现代中文圣经中通行的人名音译。
- source_word: יִמְלֹךְ אַחֲרָי
  choice: 必接续我作王
  rationale: יִמְלֹךְ 表示“作王、掌王权”，אַחֲרָי 在这里涉及王位继承；“接续我作王”自然清楚，同时没有加入“我死后”等原文未明说的内容。
- source_word: וְהוּא יֵשֵׁב עַל כִּסְאִי
  choice: 坐在我的王位上
  rationale: 保留“坐在……宝座/王位上”的王权意象；“王位”在现代汉语中既可指君王的座位，也清楚传达统治职位。
theological_decisions:
- issue: 拿单的问题是真实询问还是带有质问意味的反问
  choice: 采用中性的疑问句式，不明示为反问
  alternative: 译成“难道你说过……吗？”
  rationale: 上下文可能带有惊讶或委婉质问的语气，但本节希伯来文本本身没有专门的反问标记；中性问句更能保留语用上的开放性。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“我主我王”保留宫廷敬称；引语中的“必”体现继位宣告的确定语气。脚注标记已置于正文对应位置。
