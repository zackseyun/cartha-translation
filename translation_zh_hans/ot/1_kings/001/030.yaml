base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/030.yaml
  text: As I swore to you by Yahweh[a], the God of Israel, saying, ‘Surely Solomon your son will reign after me[b], and he will sit on my throne in my place,’ so I will do this today.
translation:
  language: zh_hans
  text: “我曾指着雅威[a]——以色列的上帝——向你起誓，说：‘你儿子所罗门必在我之后作王；他必坐在我的王位上，代替我[b]。’我今天也必如此行。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “雅威”是希伯来文 יהוה 所表示的上帝之名，传统上也译作“耶和华”或以“主”代称。
    reason: 说明神名的原文形式及常见译法。
  - marker: b
    text: 或译“在我之后”。此处指所罗门继承大卫的王位；原文也含“代替我”的意思。
    reason: 保留 תַּחְתָּי 在王位继承语境中的替代与继承含义。
lexical_decisions:
- source_word: כִּי כַּאֲשֶׁר ... כִּי כֵן
  choice: 我曾……；我今天就必照样行
  rationale: 保留原文前后呼应的“怎样……就照样……”誓言结构，同时按现代汉语调整语序，使表达自然清楚。
- source_word: נִשְׁבַּעְתִּי לָךְ
  choice: 向你起誓
  rationale: 完成体指先前已经立下的誓言；“向你起誓”准确表达受誓者。
- source_word: בַּיהוָה
  choice: 指着……雅威起誓
  rationale: 介词 בְּ 在起誓语境中表示凭借某位起誓；“指着……起誓”是自然庄重的现代汉语。“雅威”直接呈现四字神名。
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: 以色列的上帝
  rationale: 准确表达构词关系，说明雅威是以色列的上帝。
- source_word: כִּי שְׁלֹמֹה בְנֵךְ יִמְלֹךְ אַחֲרַי
  choice: 你儿子所罗门必接续我作王
  rationale: 誓言内容中的 כִּי 带有肯定语气，用“必”体现；יִמְלֹךְ 表示作王或统治，אַחֲרַי 在这里表示王位承继。
- source_word: וְהוּא יֵשֵׁב עַל כִּסְאִי תַּחְתָּי
  choice: 他必接替我坐在我的王位上
  rationale: “坐在王位上”保留王室登基用语；תַּחְתָּי 可表示处于某人之下、代替某人或接替某人，此处按王位继承语境译为“接替我”，并用脚注保留另一种理解。
- source_word: הַיּוֹם הַזֶּה
  choice: 今天
  rationale: 以自然现代汉语表达原文强调当前这一天的指示语。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名，而不是称号“主”。译作“雅威”可保留其专名性质，并以脚注说明。
- issue: תַּחְתָּי 在王位继承语境中的含义
  choice: 接替我
  alternative: 代替我；在我之后
  rationale: 上下文重点是所罗门承继大卫作王；“接替我”兼顾继承与替代含义，但原词仍容许更直接的“代替我”，故不在正文中排除该理解。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“作王”“王位”“起誓”符合王室场景；引语和前后照应清楚呈现大卫当日履行誓言的坚定语气。
