  text: וּ/מָשַׁ֣ח אֹת֣/וֹ שָׁ֠ם צָד֨וֹק הַ/כֹּהֵ֜ן וְ/נָתָ֧ן הַ/נָּבִ֛יא לְ/מֶ֖לֶךְ עַל יִשְׂרָאֵ֑ל וּ/תְקַעְתֶּם֙ בַּ/שּׁוֹפָ֔ר וַ/אֲמַרְתֶּ֕ם יְחִ֖י הַ/מֶּ֥לֶךְ שְׁלֹמֹֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/034.yaml
  text: There Zadok the priest and Nathan the prophet shall anoint him king over Israel[a], and you shall blow the trumpet and say, ‘Long live King Solomon!’
translation:
  language: zh_hans
  text: 祭司撒督和先知拿单要在那里膏他作以色列的王；你们要吹角[a]，并说：‘所罗门王万岁！’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文为“号角”（shofar），一种用于发出公共信号或宣告的角，通常为公羊角。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמָשַׁח
  choice: 要……膏
  rationale: 连词加完成式在这一连串指令中具有命令意味；“要……膏”既保留指令语气，也符合现代汉语表达。
- source_word: שָׁם
  choice: 在那里
  rationale: 指向上文已指定的地点；“在那里”自然且明确。
- source_word: צָדוֹק הַכֹּהֵן
  choice: 祭司撒督
  rationale: 人名按通行译法音译，职衔译为“祭司”；汉语通常将职衔置于姓名之前。
- source_word: וְנָתָן הַנָּבִיא
  choice: 和先知拿单
  rationale: 与第一位施膏者并列；נָבִיא按标准译为“先知”。
- source_word: לְמֶלֶךְ
  choice: 作……的王
  rationale: 介词לְ在施膏语境中表示所授予的身份或职分；“膏他作……的王”是自然、准确的汉语。
- source_word: עַל יִשְׂרָאֵל
  choice: 以色列的王
  rationale: עַל在君王语境中表示对以色列的统治；汉语以“以色列的王”自然表达该王权关系。
- source_word: וּתְקַעְתֶּם בַּשּׁוֹפָר
  choice: 你们要吹角
  rationale: שׁוֹפָר是用于发出信号或公开宣告的角；正文译作简洁、传统且不误导的“角”，并以脚注说明。
- source_word: וַאֲמַרְתֶּם
  choice: 高声说
  rationale: 继续第二人称复数的指令链；在吹角后的公开拥王场景中，“高声说”自然传达宣告性质，而不改变所说内容。
- source_word: יְחִי
  choice: 万岁
  rationale: חיה的祈愿式在拥王欢呼公式中，现代汉语最自然的对应是“万岁”，表达愿君王长久存活。
- source_word: הַמֶּלֶךְ שְׁלֹמֹה
  choice: 所罗门王
  rationale: 按现代汉语习惯将王号置于姓名之后，准确表达拥王欢呼中的称号。
theological_decisions: []
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“膏他作……的王”保留古代授职礼仪用语；“所罗门王万岁”以自然汉语再现拥王欢呼。脚注标记已置于正文“角”之后。
