base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/007.yaml
  text: And he conferred with Joab son of Zeruiah and with Abiathar the priest[a], and they helped Adonijah.
translation:
  language: zh_hans
  text: 他同洗鲁雅的儿子约押和祭司亚比亚他商议；二人便支持亚多尼雅。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“他们在亚多尼雅之后帮助”，意思是他们支持或追随他。
    reason: lexical_alternative
lexical_decisions:
- source_word: דְבָרָיו עִם
  choice: 他同……商议
  rationale: 该表达直译近于“他的话与……同在”，在这里是商谈、议事的希伯来语习惯说法。译作“商议”既符合政治谋划的语境，也使现代汉语自然明白。
- source_word: יוֹאָב בֶּן צְרוּיָה
  choice: 洗鲁雅的儿子约押
  rationale: 按希伯来语亲属称谓的次序与功能翻译，并采用现代中文圣经中通行的人名音译。
- source_word: אֶבְיָתָר הַכֹּהֵן
  choice: 祭司亚比亚他
  rationale: הַכֹּהֵן 是带定冠词的职衔，说明亚比亚他的身份；汉语将职衔置于人名前更自然。
- source_word: וַיַּעְזְרוּ
  choice: 二人便支持
  rationale: 动词 עזר 的基本义是“帮助、协助”；结合王位争夺的政治语境，译作“支持”准确表达他们为亚多尼雅助力。主语指前述约押和亚比亚他，因此明示为“二人”。
- source_word: אַחֲרֵי אֲדֹנִיָּה
  choice: 亚多尼雅
  rationale: אַחֲרֵי 的字面义是“在……之后”，在效忠或结党的语境中可表示跟随、拥护某人。汉语正文与“支持”合译为“支持亚多尼雅”，字面形式及其含义见脚注。
theological_decisions: []
