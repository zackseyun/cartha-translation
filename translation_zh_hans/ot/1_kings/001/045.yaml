base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/045.yaml
  text: And Zadok the priest and Nathan the prophet have anointed him king at Gihon[a], and they have come up from there rejoicing, and the city is in an uproar. That is the sound that you heard.
translation:
  language: zh_hans
  text: 祭司撒督和先知拿单已经在基训膏立他作王。他们从那里欢欢喜喜地上来，城里一片喧腾。[a]你们听见的就是这声音。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“城中响起喧闹声”，或“城里骚动起来”；希伯来语动词表达喧闹骚动。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמְשְׁחוּ אֹתוֹ
  choice: 已经膏立他
  rationale: מָשַׁח在君王语境中指以膏抹设立人担任王；“已经”在中文叙述中表达此事已成，并说明眼前喧声的由来。
- source_word: צָדוֹק הַכֹּהֵן וְנָתָן הַנָּבִיא
  choice: 祭司撒督和先知拿单
  rationale: 按现代汉语习惯将职衔置于人名前，并采用通行的圣经人名译法。
- source_word: לְמֶלֶךְ
  choice: 作王
  rationale: 介词短语表示受膏所担任的身份；“膏立他作王”自然、明确，也保留王权设立的含义。
- source_word: בְּגִחוֹן
  choice: 在基训
  rationale: בְּ表示地点；基训为地名，采用通行音译。
- source_word: וַיַּעֲלוּ מִשָּׁם שְׂמֵחִים
  choice: 他们从那里欢欢喜喜地上来
  rationale: 保留עלה的上行意象；שְׂמֵחִים描述他们上来时喜乐的状态，“欢欢喜喜地”符合自然现代汉语。
- source_word: וַתֵּהֹם הַקִּרְיָה
  choice: 全城都喧腾起来
  rationale: הום兼有发出巨大声响和骚动之意；“喧腾起来”同时传达热闹声势与全城受到震动的动态感。
- source_word: הוּא הַקּוֹל אֲשֶׁר שְׁמַעְתֶּם
  choice: 你们听见的就是这声音
  rationale: הוּא在此起指示和确认作用；中文焦点句式自然地表达“这正是你们所听到的声音”。
