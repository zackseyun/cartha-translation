  yaml_path: translation/ot/1_kings/001/026.yaml
  text: But me—your servant—and Zadok the priest[a], and Benaiah son of Jehoiada, and Solomon your servant, he did not call.
translation:
  language: zh_hans
  text: 至于我——你的仆人——、祭司撒督、耶何耶大的儿子比拿雅和你的仆人所罗门，他都没有邀请[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“召来”或“叫来”。希伯来语动词可表示呼叫、召集或邀请；本段谈到亚多尼雅献祭设宴，因此正文译作“邀请”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלִי אֲנִי עַבְדֶּךָ
  choice: 至于我，就是你的仆人
  rationale: 介词短语前置并加独立代词，带有强调和语境中的对比意味；译为“至于我”自然地保留话题前置，“就是你的仆人”保留恭敬的宫廷自称。
- source_word: צָדֹק הַכֹּהֵן
  choice: 祭司撒督
  rationale: 按现代汉语常见的职衔加姓名次序表达，同时保留定指身份。
- source_word: בְנָיָהוּ בֶן יְהוֹיָדָע
  choice: 耶何耶大的儿子比拿雅
  rationale: 按汉语圣经人名惯例译出父子关系和专名。
- source_word: שְׁלֹמֹה עַבְדְּךָ
  choice: 你的仆人所罗门
  rationale: 保留所罗门相对于君王的宫廷身份称谓，并与本句前面的“你的仆人”相呼应。
- source_word: לֹא קָרָא
  choice: 他都没有邀请
  rationale: קרא可表示呼叫、召来或邀请；本段背景是亚多尼雅设宴献祭并召集宾客，因此“邀请”最符合直接语境。“都”概括前置的多人名单，使汉语句法顺畅。
theological_decisions: []
