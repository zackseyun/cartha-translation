base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/051.yaml
  text: And it was reported to Solomon, saying, “Look, Adonijah fears King Solomon, and look, he has taken hold of the horns of the altar, saying, ‘Let King Solomon swear to me today that he will not put his servant to death with the sword.’”
translation:
  language: zh_hans
  text: 有人禀告所罗门说：“看哪，亚多尼雅惧怕所罗门王；看，他正抓住祭坛的角，说：‘请所罗门王今日向我起誓，保证不用刀杀我这仆人。’”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֻּגַּד לִשְׁלֹמֹה
  choice: 有人禀告所罗门
  rationale: 希伯来文是无人称被动式“被告知”；汉语用“有人禀告”自然表达，并以“禀告”体现向君王报告的语境。
- source_word: הִנֵּה
  choice: 看哪／正
  rationale: 第一次保留提示听者注意的语气为“看哪”；第二次结合 אָחַז 所描绘的当下状态译作“正抓住”，避免现代汉语中生硬地重复“看哪”，同时保留其现场感。
- source_word: יָרֵא אֶת הַמֶּלֶךְ שְׁלֹמֹה
  choice: 惧怕所罗门王
  rationale: יָרֵא 在这里指面对新王及可能惩罚而害怕；“惧怕”比“敬畏”更符合叙事情境。
- source_word: אָחַז בְּקַרְנוֹת הַמִּזְבֵּחַ
  choice: 抓住祭坛的角
  rationale: 直译祭坛四角突起的“角”，保留古代礼仪场景，不作解释性改写。
- source_word: יִשָּׁבַע לִי כַיּוֹם
  choice: 今日向我起誓
  rationale: כַיּוֹם 在此有立即、当日作出保证之意；译为“今日”既贴近字面，也保持请求的紧迫性。
- source_word: אִם יָמִית אֶת עַבְדּוֹ בֶּחָרֶב
  choice: 必不用刀杀他的仆人
  rationale: 誓言用语中的 אִם 在间接引述的请求内容里表达否定誓词；译作“必不用”符合汉语起誓表达。“他的仆人”保留亚多尼雅对王自称臣仆的第三人称形式。
theological_decisions:
- issue: 抓住祭坛之角的意义
  choice: 仅按原文叙述“抓住祭坛的角”
  alternative: 解释为寻求庇护或援引特定律法权利
  rationale: 本节本身没有明说这一动作必然产生何种法律或神学效力；避免把背景推论写入正文。
- issue: יָרֵא 的语义
  choice: 惧怕
  alternative: 敬畏
  rationale: 亚多尼雅因担心被杀而采取避难行动，语境侧重恐惧，不宜赋予宗教性或褒义色彩。
- issue: 誓言公式 אִם 的处理
  choice: 译明为否定内容“必不用刀杀”
  alternative: 保留近似字面的条件句“若用刀杀……”
  rationale: 希伯来誓言常以 אִם 引出受咒诅式的否定承诺；汉语若照条件句直译会残缺难懂，因此表达其语用意义而不增添誓言后果。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。用“禀告”“起誓”“仆人”维持王室叙事语域；句式尽量贴近希伯来文的报告—引语—内嵌引语结构，但避免机械重复造成拗口。
