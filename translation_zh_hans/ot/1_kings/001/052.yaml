base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/052.yaml
  text: And Solomon said[a], “If he proves to be a worthy man, not one of his hairs will fall to the ground; but if evil is found in him[b], he shall die.”
translation:
  language: zh_hans
  text: 所罗门说：“他若是个有品行的人[a]，他的一根头发也不会落在地上[b]；但若发现他有恶行，他就必死。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“力量／才干之子”。这个希伯来习语可指有价值、有能力或有勇力的人；这里侧重他今后的品格和行为是否合宜。
    reason: lexical_alternative
  - marker: b
    text: “一根头发也不会落在地上”是希伯来习语，意思是他不会受到任何伤害。
    reason: idiom_explanation
lexical_decisions:
- source_word: בֶן־חַיִל
  choice: 正派人
  rationale: 这个希伯来习语直译为“力量／才干之子”，可指有能力、有勇力或有价值的人。本处所罗门以亚多尼雅今后的品行为条件，“正派人”自然地表达其品格合宜、行为可靠，同时脚注保留原文较宽的含义。
- source_word: יִהְיֶה
  choice: 作个
  rationale: 该动词本义为“是／成为”，在条件句中指亚多尼雅今后如何为人。“作个”既符合现代汉语，也保留未来表现受检验的语用意味。
- source_word: לֹא יִפֹּל מִשַּׂעֲרָתוֹ אָרְצָה
  choice: 他的一根头发也不会落在地上
  rationale: 近直译保留希伯来语形象，同时汉语读者也能理解为丝毫不受伤害；脚注明示其习语功能。
- source_word: רָעָה תִמָּצֵא בוֹ
  choice: 在他身上发现恶
  rationale: 保留“恶”的宽泛道德含义以及被发现属于他的被动表达，不擅自限定为某一种罪行、叛逆行为或内在品性。
- source_word: וָמֵת
  choice: 他就必死
  rationale: “必死”体现条件成立后的严肃司法后果，又不额外判定其语气究竟偏重预言还是正式宣判。
theological_decisions:
- issue: 所罗门应许保护与判死的条件性质
  choice: 按原文保留“若……但若……”的对称条件结构
  alternative: 将前半句解释为赦免，或将后半句明确写成处决命令
  rationale: 原文既陈明完全保全，也陈明死亡后果，却没有进一步界定王权、赦免或司法程序的神学意义，因此译文不作扩充。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“正派人”通俗而不轻佻；“在他身上发现恶”略带原文色彩，用以保留“恶”可能涵盖品性与行为的宽度。脚注标记均置于相应词句之后，并纠正了咨询层中脚注标记与内容错位的问题。
