  text: וְ/הָיָ֕ה כִּ/שְׁכַ֥ב אֲדֹנִֽ/י הַ/מֶּ֖לֶךְ עִם אֲבֹתָ֑י/ו וְ/הָיִ֗יתִי אֲנִ֛י וּ/בְנִ֥/י שְׁלֹמֹ֖ה חַטָּאִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/021.yaml
  text: And when my lord the king lies down with his fathers[a], I and my son Solomon will be counted as offenders.
translation:
  language: zh_hans
  text: 当我主我王与列祖同睡之后，我和我儿子所罗门就会被视为有罪的人[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“罪人”。希伯来语这个词可指罪人、过犯者或被认定有罪、应受惩处的人；这里王位继承的上下文显示，这主要关乎政治和法律上的处境，而不只是一般的道德描述。
    reason: 保留 חַטָּאִים 的较广词义，并说明本节语境中的政治—法律含义，避免将其限定为具体刑事犯罪。
lexical_decisions:
- source_word: וְהָיָה
  choice: 就会
  rationale: 承接前面的时间从句，引出拔示巴所担忧的结果；用现代汉语的将来结果表达比直译“事情将是”自然。
- source_word: כִּשְׁכַב ... עִם אֲבֹתָיו
  choice: 与列祖同睡以后
  rationale: 保留希伯来语以睡眠委婉指死亡、归到祖先那里去的传统表达；“以后”清楚呈现其后果关系。
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: 我主我王
  rationale: 体现拔示巴对大卫的宫廷敬称；措辞庄重，也符合中文圣经语体。
- source_word: וּבְנִי שְׁלֹמֹה
  choice: 我和我儿子所罗门
  rationale: 自然保留亲属关系和人名，并与前面的第一人称并列。
- source_word: חַטָּאִים
  choice: 被当作罪犯
  rationale: 该词本义可指“罪人、有罪者”，但在王位继承的政治处境中，重点是拔示巴和所罗门将被视为有罪、可受惩处的人；“被当作罪犯”表达这一社会政治身份，同时借脚注保留较宽的词义。
theological_decisions:
- issue: חַטָּאִים 是一般道德意义的“罪人”，还是政治法律意义上的“罪犯”
  choice: 正文译作“被当作罪犯”
  alternative: 罪人；有罪的人
  rationale: 上下文关乎王位继承及新政权可能施加的罪责与惩处，因此正文采用政治法律色彩较强的表达；脚注保留原词常见的道德性译法，避免排除原文的词义张力。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“我主我王”保留宫廷敬语，“与列祖同睡”保留希伯来语委婉指死亡的意象；“被当作”明确表达这里所说的是他人或新政权对二人的认定，而非叙述者直接宣判其有罪。
