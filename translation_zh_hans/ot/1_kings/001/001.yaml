  yaml_path: translation/ot/1_kings/001/001.yaml
  text: King David was old[a], advanced in days; and they covered him with garments, but he could not get warm.
translation:
  language: zh_hans
  text: 大卫王老了，年事已高[a]。人们用衣服给他盖上，但他还是暖和不起来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语直译为“进入日子”，是表示年纪很大、年事已高的惯用语。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/הַ/מֶּלֶךְ דָּוִד
  choice: 大卫王
  rationale: 按现代汉语称谓习惯将头衔置于姓名之后；句首וְ在此承接叙事，不必机械译作“和”或“现在”。
- source_word: זָקֵן
  choice: 老了
  rationale: 直接表达大卫已经年老，语言自然明确，并保留与后面年龄惯用语的强调性复述。
- source_word: בָּא בַּ/יָּמִים
  choice: 年事已高
  rationale: 这是表示年岁很高的希伯来语惯用语；“年事已高”既传达其意义，也保持庄重文体。
- source_word: וַ/יְכַסֻּ/הוּ
  choice: 人们给他盖上
  rationale: 希伯来语使用未明说身份的复数主语；译作“人们”不擅自认定具体照料者。“盖上”符合以衣物为人保暖的语境。
- source_word: בַּ/בְּגָדִים
  choice: 衣服
  rationale: בְּגָדִים通常指衣服或衣物；不译作“被子”，以免加入原文没有的具体物件。
- source_word: וְ/לֹא יִחַם ל/וֹ
  choice: 他却还是暖和不起来
  rationale: 自然表达无法变暖的持续状态；“却还是”呈现前面盖衣与后面未能取暖之间的语境反差。
