base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/033.yaml
  text: And the king said to them[a], “Take with you the servants of your lord, and have my son Solomon ride on the mule that is mine, and bring him down to Gihon.”
translation:
  language: zh_hans
  text: 王对他们说：“你们要带上你们主人的臣仆，让我儿子所罗门骑上那匹属于我的骡子[a]，带他下到基训去。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“把我儿子所罗门安置在那匹属于我的骡子上。”希伯来语动词是使役形式，表示他们要使所罗门骑上骡子。
    reason: 说明使役动词的语义，并提供较贴近形式的译法。
lexical_decisions:
- source_word: עַבְדֵי אֲדֹנֵיכֶם
  choice: 你们主人的臣仆
  rationale: 在王室语境中，“臣仆”比“奴隶”更能涵盖隶属于君王的侍从和官员；“你们的主人”保留君王以第三人称自称的宫廷表达。
- source_word: וְהִרְכַּבְתֶּם
  choice: 让……骑上
  rationale: 该动词为使役形式，表示受命者要使所罗门骑上骡子；此译法既自然，也保留使役意义。
- source_word: הַפִּרְדָּה אֲשֶׁר לִי
  choice: 那匹属于我的骡子
  rationale: 保留原文的定指和关系从句，突出这骡子属于王，因而承载公开授权的意味；希伯来语阴性形式在此无需特意译出性别。
- source_word: וְהוֹרַדְתֶּם
  choice: 带他下到
  rationale: 保留使役含义及从王宫区域往较低处去的地势方向。
- source_word: גִּחוֹן
  choice: 基训
  rationale: 按通行中文圣经地名音译处理。
- source_word: בְנִי
  choice: 我儿子
  rationale: 保留明确的所属关系，也凸显所罗门与王的父子关系。
- source_word: וַיֹּאמֶר הַמֶּלֶךְ
  choice: 王对他们说
  rationale: 以自然的现代汉语叙事方式表达原文连续推进的叙事句式。
theological_decisions: []
