source:
  edition: WLC
  text: וְ/גַם בָּ֜אוּ עַבְדֵ֣י הַ/מֶּ֗לֶךְ לְ֠/בָרֵךְ אֶת אֲדֹנֵ֜י/נוּ הַ/מֶּ֣לֶךְ דָּוִד֮ לֵ/אמֹר֒ יֵיטֵ֨ב אלהי/ך אֶת שֵׁ֤ם שְׁלֹמֹה֙ מִ/שְּׁמֶ֔/ךָ וִֽ/יגַדֵּ֥ל אֶת כִּסְא֖/וֹ מִ/כִּסְאֶ֑/ךָ וַ/יִּשְׁתַּ֥חוּ הַ/מֶּ֖לֶךְ עַל הַ/מִּשְׁכָּֽב־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/047.yaml
  text: And the king’s servants also came to bless our lord King David[a], saying, ‘May your God make Solomon’s name better than your name[b], and may he make his throne greater than your throne.’ And the king bowed himself on the bed.
translation:
  language: zh_hans
  text: 王的臣仆也来为我们的主大卫王祝福，说：“愿你的神使所罗门的名比你的名更受尊崇[a]，使他的王位比你的王位更尊大。”王便在床上俯伏[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “名”在这里指人的名声、声望或威望。
    reason: lexical_alternative
  - marker: b
    text: 或译：“敬拜。”原文这个动词既可指俯伏，也可按语境指敬拜。
    reason: alternative_reading
lexical_decisions:
- source_word: וְגַם
  choice: 也
  rationale: 承接前文，并保留附加语气；现代汉语中用“也”表达自然。
- source_word: עַבְדֵי הַמֶּלֶךְ
  choice: 王的臣仆
  rationale: 此处指宫廷中的王室侍从或官员；“臣仆”既符合宫廷语境，也保留服事君王的含义。
- source_word: לְבָרֵךְ
  choice: 为……祝福
  rationale: 这里是臣仆向大卫正式表达祝愿；“祝福”保留该词的宗教和礼仪意味。
- source_word: אֲדֹנֵינוּ הַמֶּלֶךְ דָּוִד
  choice: 我们的主大卫王
  rationale: 保留宫廷敬称及原文语序关系，同时符合庄重的现代汉语。
- source_word: יֵיטֵב אֱלֹהֶיךָ אֶת שֵׁם שְׁלֹמֹה מִשְּׁמֶךָ
  choice: 愿你的神使所罗门的名比你的名更受尊崇
  rationale: 使役形式与比较结构均予保留；“更受尊崇”以自然汉语传达使其名更美好、更显赫的祝愿，同时正文保留“名”的原文意象。
- source_word: וִיגַדֵּל אֶת כִּסְאוֹ מִכִּסְאֶךָ
  choice: 使他的王位比你的王位更尊大
  rationale: “王位”准确传达宝座所代表的君王权位；比较表达保留原文祝愿所罗门统治更加尊大的意思。
- source_word: וַיִּשְׁתַּחוּ הַמֶּלֶךְ
  choice: 王便……俯伏
  rationale: 该动词既可指身体俯伏，也可在特定语境中指敬拜。正文保留可观察的动作，不擅自明确其对象。
- source_word: עַל הַמִּשְׁכָּב
  choice: 在床上
  rationale: 直接对应原文，且不添加原文未明说的所有格。
theological_decisions:
- issue: וַיִּשְׁתַּחוּ 是单指俯伏动作，还是明确表示敬拜
  choice: 正文译为“俯伏”
  alternative: “敬拜”或“俯伏敬拜”
  rationale: 原文动词可以表达俯伏致敬或敬拜，而本句没有明说动作所向的对象。译作“俯伏”保留身体动作及语义张力，并以脚注说明“敬拜”的可能性。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“我们的主大卫王”保留宫廷敬称；祝福语使用对称句式，以呈现原文的正式语气。
