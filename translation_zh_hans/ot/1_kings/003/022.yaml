  yaml_path: translation/ot/1_kings/003/022.yaml
  text: But the other woman said[a], “No! My son is the living one, and your son is the dead one.” And this one said, “No! Your son is the dead one, and my son is the living one.” So they spoke before the king.
translation:
  language: zh_hans
  text: 另一个妇人却说[a]：“不！我儿子是活的那个，你儿子是死的那个。”这个妇人说：“不！你儿子是死的那个，我儿子是活的那个。”她们就这样在王面前争辩。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译得更符合汉语习惯：“我儿子是活的，你儿子是死的……你儿子是死的，我儿子是活的。”正文保留希伯来文“活的那个／死的那个”的对比结构。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: 说
  rationale: 希伯来语叙事中常用的言说动词；现代汉语用“说”自然准确。
- source_word: הָאִשָּׁה הָאַחֶרֶת
  choice: 另一个妇人
  rationale: 指争执中的另一名女子；“妇人”符合庄重叙事语体，也不额外引入婚姻身份。
- source_word: לֹא כִי
  choice: 不！
  rationale: 此组合表达强烈反驳；“不！”保留双方针锋相对的语气。
- source_word: בְּנִי הַחַי
  choice: 我儿子是活的那个
  rationale: 原文带定冠词的形容词把两个孩子明确对举；“活的那个”保留这一辨识和对比结构。
- source_word: וּבְנֵךְ הַמֵּת
  choice: 你儿子是死的那个
  rationale: 与“活的那个”形成原文中的平行对照，并保留争讼语境中对两个孩子的指认。
- source_word: וְזֹאת אֹמֶרֶת
  choice: 这个妇人说
  rationale: זֹאת具有阴性指示意义；汉语补出“妇人”比单说“这个”自然，同时保留指示性。
- source_word: הֶחָי
  choice: 活的那个
  rationale: 与前句及“死的那个”保持一致，呈现原文严整的反复和对举。
- source_word: וַתְּדַבֵּרְנָה
  choice: 她们就这样……争辩
  rationale: 阴性复数动词概括两人的交锋；上下文显示不是一般谈话，而是在王前相互反驳，因此“争辩”自然传达语境功能，“就这样”概括前述往复。
- source_word: לִפְנֵי הַמֶּלֶךְ
  choice: 在王面前
  rationale: 直接对应原文，既自然又不额外补入王的名字。
theological_decisions: []
