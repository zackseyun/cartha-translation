  rationale: 作轻微文体修订，使中文更符合现代标准汉语，同时维持原文的司法语域、因果关系、对王的敬畏，以及上帝所关联之智慧的内在属性。脚注锚点保留在相应的“敬畏王”和结尾司法短语之后。
