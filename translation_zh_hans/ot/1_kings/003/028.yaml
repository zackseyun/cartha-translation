source:
  edition: WLC
  text: וַ/יִּשְׁמְע֣וּ כָל יִשְׂרָאֵ֗ל אֶת הַ/מִּשְׁפָּט֙ אֲשֶׁ֣ר שָׁפַ֣ט הַ/מֶּ֔לֶךְ וַ/יִּֽרְא֖וּ מִ/פְּנֵ֣י הַ/מֶּ֑לֶךְ כִּ֣י רָא֔וּ כִּֽי חָכְמַ֧ת אֱלֹהִ֛ים בְּ/קִרְבּ֖/וֹ לַ/עֲשׂ֥וֹת מִשְׁפָּֽט־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/028.yaml
  text: And all Israel heard of the judgment that the king had rendered[a], and they feared the king[b], because they saw that the wisdom of God was within him to administer justice.
translation:
  language: zh_hans
  text: 以色列众人听说王所作出的判决，就都敬畏王[a]，因为他们看出王有上帝的智慧，能施行公正[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “敬畏”也可译作“惧怕”或“畏服”；原文可表达面对权威时的恐惧、尊崇或敬畏。
    reason: lexical_alternative
  - marker: b
    text: “施行公正”也可译作“施行审判”或“主持公道”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמְעוּ
  choice: 听见
  rationale: 保留שׁמע“听见、听到消息”的基本意义；在本句中自然表示全国得知这项判决。
- source_word: כָל יִשְׂרָאֵל
  choice: 以色列众人
  rationale: 表达全体百姓这一集合意义，同时比逐字译作“全以色列”更符合现代汉语叙事习惯。
- source_word: הַמִּשְׁפָּט אֲשֶׁר שָׁפַט הַמֶּלֶךְ
  choice: 王所作的判决
  rationale: מִשְׁפָּט在此指案件的司法裁决；“作出判决”准确而自然，也避免生硬复现希伯来语“审判……审判”。
- source_word: וַיִּרְאוּ מִפְּנֵי הַמֶּלֶךְ
  choice: 敬畏王
  rationale: 该短语兼有惧怕、尊崇和因权威而生敬畏之意；“敬畏”在中文中保留这种张力，不把它缩减为单纯恐惧或一般尊敬。
- source_word: כִּי רָאוּ
  choice: 因为他们看出
  rationale: 第一个כִּי表原因；“看出”自然表达百姓从判决中辨认出王所得的智慧。
- source_word: חָכְמַת אֱלֹהִים
  choice: 上帝的智慧
  rationale: 直接保留构词短语对上帝的明确指称，不弱化为泛指的“神圣智慧”。
- source_word: בְּקִרְבּוֹ
  choice: 他里面有
  rationale: 保留智慧在所罗门“里面”的内在位置意象，同时符合现代汉语表达。
- source_word: לַעֲשׂוֹת מִשְׁפָּט
  choice: 能够秉公断案
  rationale: 不定式说明这智慧使王有能力履行司法职能；“秉公断案”兼顾公正与审判两层含义，并符合本段具体语境。
theological_decisions:
- issue: אֱלֹהִים在王权与智慧语境中的译法
  choice: 上帝
  alternative: 神圣的；属神的
  rationale: 原文明确提到אֱלֹהִים，且本章把所罗门的智慧归于上帝，因此保留位格性的明确称谓。
- issue: וַיִּרְאוּ מִפְּנֵי הַמֶּלֶךְ所表达的态度
  choice: 敬畏王
  alternative: 惧怕王；尊崇王
  rationale: 百姓的反应既包含面对王权的畏惧，也包含因看见上帝所赐智慧而产生的尊崇；正文不单方面消解这种语义张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“王所作的判决”保持司法语域；“敬畏王”刻意保留恐惧与尊崇并存的含义；“秉公断案”使结尾在普通读者听来清楚自然，同时由脚注交代原文较宽的表达。
