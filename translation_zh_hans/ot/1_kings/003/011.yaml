  text: וַ/יֹּ֨אמֶר אֱלֹהִ֜ים אֵלָ֗י/ו יַעַן֩ אֲשֶׁ֨ר שָׁאַ֜לְתָּ אֶת הַ/דָּבָ֣ר הַ/זֶּ֗ה וְ/לֹֽא שָׁאַ֨לְתָּ לְּ/ךָ֜ יָמִ֣ים רַבִּ֗ים וְ/לֹֽא שָׁאַ֤לְתָּ לְּ/ךָ֙ עֹ֔שֶׁר וְ/לֹ֥א שָׁאַ֖לְתָּ נֶ֣פֶשׁ אֹיְבֶ֑י/ךָ וְ/שָׁאַ֧לְתָּ לְּ/ךָ֛ הָבִ֖ין לִ/שְׁמֹ֥עַ מִשְׁפָּֽט־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/011.yaml
  text: And God said to him, “Because you have asked for this thing, and have not asked for yourself many days, nor have asked for yourself riches, nor have asked for the life of your enemies, but have asked for yourself understanding to hear justice,”
translation:
  language: zh_hans
  text: 上帝对他说：“因为你求了这事，没有为自己求长寿，没有求财富，也没有求仇敌的性命，反倒为自己求明辨的能力，以便听讼断案[a]，”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “听讼断案”原文直译近于“听审判（司法判断）”。其中“审判”一词也可指判决、公正或案件。
    reason: 说明原文短语的字面形式及“审判”一词的语义幅度，避免将“公正”误作整个短语的逐字直译。
lexical_decisions:
- source_word: יָמִים רַבִּים
  choice: 长寿
  rationale: 字面为“许多日子”，在此指寿命长久；“长寿”是现代汉语中自然、准确的表达。
- source_word: נֶפֶשׁ אֹיְבֶיךָ
  choice: 仇敌的性命
  rationale: נֶפֶשׁ 在此指生命、性命；保留“求取仇敌性命”的直接表述，不扩写为报仇或胜利。
- source_word: הָבִין
  choice: 明辨的能力
  rationale: 该词表达理解、辨明的能力；结合君王审判案件的语境，译作“明辨的能力”既自然又不把含义缩窄为单纯知识。
- source_word: לִשְׁמֹעַ מִשְׁפָּט
  choice: 听讼断案
  rationale: 保留 שׁמע 的“听”与 משפט 的司法语境；“听讼断案”在汉语中自然地表达听取案件并作判断。
theological_decisions:
- issue: מִשְׁפָּט 可指审判、判决、公正或案件
  choice: 按所罗门治理和审判百姓的语境译为“听讼断案”
  alternative: 听明公正／听取审判
  rationale: 不把该词抽象化为单纯的“正义”，也不暗示某种特定司法制度；译文保留辨别并施行公正判断的含义。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“上帝对他说”沿用叙事语体；并列项用顿号压缩重复成分，但保留“为自己求”的对比重点。句末逗号表示上帝的话在下一节继续。
