  text: רַ֣ק הָ/עָ֔ם מְזַבְּחִ֖ים בַּ/בָּמ֑וֹת כִּ֠י לֹא נִבְנָ֥ה בַ֨יִת֙ לְ/שֵׁ֣ם יְהוָ֔ה עַ֖ד הַ/יָּמִ֥ים הָ/הֵֽם־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/002.yaml
  text: Only the people were sacrificing at the high places[a], because no house had yet been built for the name of Yahweh in those days.
translation:
  language: zh_hans
  text: 只是，百姓在丘坛献祭，因为当时还没有为耶和华的名建造殿宇[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “殿宇”原文作“房屋”；此处指将要在耶路撒冷为耶和华建造的圣殿。“为耶和华的名”是与圣殿相关的特定说法。
    reason: 说明“殿宇”所译原文的字面词义及其在本节语境中的所指。
lexical_decisions:
- source_word: רַק
  choice: 只是
  rationale: 承接上文，对所罗门时期的正面叙述作出限制；“只是”自然保留了转折和例外意味。
- source_word: הָעָם
  choice: 百姓
  rationale: 指普遍民众，并不必然表示与领袖阶层的技术性对立。
- source_word: מְזַבְּחִים
  choice: 还在……献祭
  rationale: 分词表达持续或惯常行为；“还在”也符合圣殿尚未建成的时间背景。
- source_word: בַּבָּמוֹת
  choice: 在丘坛
  rationale: במות 指用于祭祀的高处或当地祭坛场所；“丘坛”是简洁、庄重且能体现宗教场所性质的中文表达。
- source_word: כִּי
  choice: 因为
  rationale: 明确表达后句是百姓在丘坛献祭的原因。
- source_word: לֹא נִבְנָה בַיִת
  choice: 还没有……建造殿宇
  rationale: 保留被动意义和截至当时尚未建成的状态；“殿宇”既对应“房屋”，又在此处自然指向将建的圣殿。
- source_word: לְשֵׁם יְהוָה
  choice: 为耶和华的名
  rationale: 保留列王纪中重要的圣殿神学措辞，不简化为仅仅“为耶和华”。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者广泛识别的神名译法，直接对应四字神名。
- source_word: עַד הַיָּמִים הָהֵם
  choice: 直到那些日子
  rationale: 较直接地保留希伯来文的时间表达；中文虽略具古雅色彩，但清楚可懂，并避免将其无声改写为不同的时间关系。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: “耶和华”在现代简体中文基督教语境中辨识度最高，同时以专名形式呈现经文中的四字神名；不以“主”取代。
- issue: בַיִת 在本节是直译“房屋”还是明示“圣殿”
  choice: 殿宇
  alternative: 房屋；圣殿
  rationale: 原词本义是“房屋”，但“为耶和华的名”使其在语境中明确指圣殿。“殿宇”保留建筑称谓，又使普通读者不会误解为一般住宅；脚注说明原文字面意义。
- issue: 丘坛献祭是否在译文中直接定性为违法或偶像崇拜
  choice: 不在正文中增添道德定性
  alternative: 译成“非法祭坛”或“异教邱坛”
  rationale: 本节给出的直接原因是圣殿尚未建成；译文应保留叙事中的张力，不额外加入原文没有明说的宗派性或道德判断。
translation_notes:
  register: 采用现代、庄重而易懂的叙事体。“丘坛”为较凝练的圣经宗教用语；“殿宇”兼顾原文“房屋”的意象与圣殿语境。脚注标记置于相关句末。
