  text: וְ/גַ֨ם אֲשֶׁ֤ר לֹֽא שָׁאַ֨לְתָּ֙ נָתַ֣תִּי לָ֔/ךְ גַּם עֹ֖שֶׁר גַּם כָּב֑וֹד אֲ֠שֶׁר לֹא הָיָ֨ה כָמ֥וֹ/ךָ אִ֛ישׁ בַּ/מְּלָכִ֖ים כָּל יָמֶֽי/ךָ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/013.yaml
  text: And I have also given you what you did not ask for[a], both riches and honor, so that there has been no man like you among the kings all your days.
translation:
  language: zh_hans
  text: 此外，连你没有求的，我也赐给你：财富和尊荣，以致在你一生的日子里，列王中没有人像你一样。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“以致你一生在列王中，没有人像你一样。”
    reason: 汉语语序的另一种表达，保留末句的结果性说明。
lexical_decisions:
- source_word: וְגַם
  choice: 此外……也
  rationale: 承接上文并突出这是在所求之外加赐的恩典；现代汉语用“此外……也”自然地保留累加意味。
- source_word: אֲשֶׁר לֹא שָׁאַלְתָּ
  choice: 你没有求的
  rationale: 按希伯来文关系从句直译其核心意义，同时符合现代汉语表达。
- source_word: נָתַתִּי לָךְ
  choice: 我也赐给你了
  rationale: “赐给”适合上帝向王授予礼物的语境；句末“了”表达希伯来文完成式所指已经作出的赐予。
- source_word: גַּם עֹשֶׁר גַּם כָּבוֹד
  choice: 就是财富和尊荣
  rationale: 重复的גַּם并列两项加赐之物；“财富”对应物质丰盛，“尊荣”比“荣耀”更切合君王在人间所得的地位与声望。
- source_word: אֲשֶׁר לֹא הָיָה כָמוֹךָ אִישׁ
  choice: 使……没有人像你一样
  rationale: 将אֲשֶׁר理解为结果关系；“没有人”准确表达אִישׁ在否定句中的不定指用法，又不把比较对象擅自改成“没有别的王”。
- source_word: בַּמְּלָכִים
  choice: 在列王中
  rationale: 表达所比较的群体，即所罗门在众王之中无人可比。
- source_word: כָּל יָמֶיךָ
  choice: 你一生
  rationale: 这是希伯来语“一切日子”的自然汉语对应，指所罗门在世的全部年月。
theological_decisions:
- issue: אֲשֶׁר引导末句的关系：结果还是单纯说明
  choice: 使你一生在列王中没有人像你一样
  alternative: 以致你一生在列王中，没有人像你一样
  rationale: 上下文将无可比拟的王者地位表述为财富和尊荣带来的结果；正文采用“使”，脚注保留较弱的结果表达“以致”，避免赋予该连词过度精确的逻辑分类。
- issue: 否定句中אִישׁ的表达
  choice: 没有人像你一样
  alternative: 没有一个男人像你一样
  rationale: אִישׁ在此否定结构中自然表示“无人”；译成“男人”会在汉语中造成与经文无关的性别对比，而译成“没有王”又会把后面的比较范围并入主语。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“财富和尊荣”清楚易懂；“在列王中没有人像你一样”保留原文比较结构及אִישׁ的不定指意义。脚注标记置于其实际涉及的末句之后。
