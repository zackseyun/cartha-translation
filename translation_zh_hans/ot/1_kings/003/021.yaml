base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/021.yaml
  text: When I got up in the morning to nurse my son[a], behold, he was dead. But when I looked closely at him in the morning, behold, he was not my son[b], whom I had borne.
translation:
  language: zh_hans
  text: 早晨，我起来要给我儿子喂奶，谁知他已经死了。早晨，我仔细察看他，才发现他不是我所生的儿子。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וָאָקֻם בַּבֹּקֶר
  choice: 早晨，我起来
  rationale: 按叙事次序表达起身和时间；原文两次出现“早晨”，译文也保留两次，以维持原有的叙事节奏。
- source_word: לְהֵינִיק אֶת־בְּנִי
  choice: 要给我儿子喂奶
  rationale: הֵינִיק在此指给婴儿哺乳；“喂奶”是现代汉语中自然、清楚的说法。בְּנִי明确指“我儿子”。
- source_word: וְהִנֵּה מֵת
  choice: 谁知他已经死了
  rationale: וְהִנֵּה标示突然而震惊的发现；“谁知”自然传达这一语用力度。“已经死了”说明她起身时发现的状态。
- source_word: וָאֶתְבּוֹנֵן אֵלָיו
  choice: 我仔细察看他
  rationale: 该动词表示专注、审慎地观察；“仔细察看”既准确又符合庄重的现代汉语。
- source_word: וְהִנֵּה לֹא הָיָה בְנִי
  choice: 才发现他不是我所生的儿子
  rationale: 第二个וְהִנֵּה表示观察后突然确认事实；“才发现”传达这一认知转折，同时保留“他不是我儿子”的核心陈述。
- source_word: אֲשֶׁר יָלָדְתִּי
  choice: 我所生的
  rationale: 直译分娩关系，不扩写为仅表示一般亲缘的“亲生”，从而贴近原文具体的母亲陈述。
theological_decisions: []
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。保留原文两次“早晨”的重复；以“谁知”和“才发现”分别表现两处וְהִנֵּה的突现感，不使用现代汉语中较生硬的“看哪”。英文咨询层脚注[a]所列“我仔细察看他”与其标注位置及希伯来文לְהֵינִיק不符，因此未纳入译文或脚注。
