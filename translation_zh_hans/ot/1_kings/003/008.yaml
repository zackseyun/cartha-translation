base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/008.yaml
  text: And your servant is in the midst of your people whom you have chosen[a], a great people[b], too numerous to be counted or numbered.
translation:
  language: zh_hans
  text: 而你的仆人身在你所拣选的子民中间；这民人数众多[a]，多得无法计算，也无法数清。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “人数众多”也可译作“大族”。这里按上下文理解为数量庞大。
    reason: lexical_alternative
  - marker: b
    text: 直译：“因数量众多，不能计数，也不能数清。”
    reason: literal_rendering
lexical_decisions:
- source_word: וְעַבְדְּךָ
  choice: 而你的仆人
  rationale: עֶבֶד既可指奴隶，也可指臣仆；这里是所罗门向上帝谦恭自称，译作“仆人”自然，并保留其从属意味。连接词וְ译作“而”，承接上文。
- source_word: בְּתוֹךְ עַמְּךָ
  choice: 正在你的子民中间
  rationale: בְּתוֹךְ表示处于群体之中；“中间”贴近原文。עַם在此指属于上帝的百姓，译作“子民”符合现代汉语庄重语体。
- source_word: אֲשֶׁר בָּחָרְתָּ
  choice: 你所拣选的
  rationale: 直接保留上帝拣选其子民的陈述，不增添后来的神学解释。
- source_word: עַם רָב
  choice: 这民人数众多
  rationale: רַב在下文计数语境中主要表示数量庞大；补出“人数”使现代汉语意义明确，同时“这民”承接前面的“子民”。
- source_word: אֲשֶׁר לֹא יִמָּנֶה וְלֹא יִסָּפֵר מֵרֹב
  choice: 多得无法计算，也无法数清
  rationale: 两个近义被动动词形成平行，分别译为“无法计算”和“无法数清”；“多得”表达מֵרֹב所说明的原因，即因数量庞大而不能数算。
theological_decisions:
- issue: 以色列作为上帝所拣选的子民
  choice: 你所拣选的子民
  alternative: 你选择的百姓
  rationale: 原文明确兼有归属（“你的民”）与拣选（“你所拣选的”）两层意思；译文予以保留，但不扩展为任何特定宗派的拣选论。
- issue: 人数庞大的夸张性陈述
  choice: 多得无法计算，也无法数清
  alternative: 因人数众多，不能计算，也不能数清
  rationale: 保留原文两个并列的计数动词及其修辞力度，不把它严格化为关于数学上无限的教义性断言。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“仆人”“拣选”“子民”保留祷告与王室语境的正式色彩；分号呈现同位说明关系，并避免过度书面化。
