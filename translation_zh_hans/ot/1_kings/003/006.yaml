  text: וַ/יֹּ֣אמֶר שְׁלֹמֹ֗ה אַתָּ֨ה עָשִׂ֜יתָ עִם עַבְדְּ/ךָ֙ דָוִ֣ד אָבִ/י֮ חֶ֣סֶד גָּדוֹל֒ כַּ/אֲשֶׁר֩ הָלַ֨ךְ לְ/פָנֶ֜י/ךָ בֶּ/אֱמֶ֧ת וּ/בִ/צְדָקָ֛ה וּ/בְ/יִשְׁרַ֥ת לֵבָ֖ב עִמָּ֑/ךְ וַ/תִּשְׁמָר ל֗/וֹ אֶת הַ/חֶ֤סֶד הַ/גָּדוֹל֙ הַ/זֶּ֔ה וַ/תִּתֶּן ל֥/וֹ בֵ֛ן יֹשֵׁ֥ב עַל כִּסְא֖/וֹ כַּ/יּ֥וֹם הַ/זֶּֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/006.yaml
  text: And Solomon said[a], “You have shown great covenant faithfulness to your servant David my father, because he walked before you in faithfulness, in righteousness, and in uprightness of heart with you; and you have kept for him this great covenant faithfulness and have given him a son sitting on his throne[c][b], as it is this day.”
translation:
  language: zh_hans
  text: 所罗门说：“你向你的仆人、我父亲大卫施了极大的慈爱[a]；正如他在你面前行事忠信[b]、公义，心里正直，并且与你相交。你又为他保守了这极大的慈爱，赐给他一个儿子，今日坐在大卫的王位上，正如今日所见[c]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “慈爱”所译的希伯来语也可译作“坚定不移的爱”“忠贞的爱”或“恩慈”；在这里含有忠贞守约、信守应许的意味。
    reason: lexical_alternative
  - marker: b
    text: “忠信”也可译作“真实”“信实”或“正直”。
    reason: lexical_alternative
  - marker: c
    text: 希伯来语直译为“像今日一样”，指眼前的情形证实了所说的话。
    reason: cultural_note
lexical_decisions:
- source_word: חֶסֶד
  choice: 忠信之爱
  rationale: 该词在这里既指坚定、忠贞的爱，也带有守约和信守应许的关系性内涵。“忠信之爱”比单纯的“恩惠”或“慈爱”更能兼顾这些层面，同时不把原文未明说的“约”直接加入正文。
- source_word: עָשִׂיתָ עִם
  choice: 向……施以
  rationale: 这是“向某人施行 חֶסֶד”的自然汉语表达，保留了上帝主动恩待大卫的意思。
- source_word: עַבְדְּךָ
  choice: 你仆人
  rationale: 王室祷告语境中指大卫在上帝面前的臣属身份；“仆人”比“奴隶”更符合本处语用。
- source_word: כַּאֲשֶׁר
  choice: 以分号承接说明
  rationale: 本处可表达原因，也可表示与大卫行事相称的对应关系。汉语用分号并直接陈述，避免把因果关系解释得过死。
- source_word: הָלַךְ לְפָנֶיךָ
  choice: 在你面前……同行
  rationale: 保留希伯来语以“行走”描述生活和行事方式的比喻，并与后面的 עִמָּךְ“与你”自然结合。
- source_word: בֶּאֱמֶת
  choice: 以忠信
  rationale: אֱמֶת 可指真实、诚信或忠信；在描述大卫对上帝的行事时，“忠信”自然且保留关系性的含义，脚注列出其他可能。
- source_word: בִּצְדָקָה
  choice: 公义
  rationale: 直接表达合乎正道的品格与行为，符合本处希伯来语道德语境。
- source_word: וּבְיִשְׁרַת לֵבָב
  choice: 正直的心
  rationale: 保留“心”的内在品格意象，以自然汉语表达内心的端正与诚实。
- source_word: עִמָּךְ
  choice: 与你同行
  rationale: 明确保留原文“与你”的关系性成分，而不将它并入前面的“在你面前”。
- source_word: וַתִּשְׁמָר לוֹ
  choice: 一直为他持守
  rationale: שׁמר 在此表示保存并维持先前所说的忠信之爱；“一直”体现叙事中延续至今的结果。
- source_word: בֵן יֹשֵׁב עַל כִּסְאוֹ
  choice: 一个儿子坐在他的王位上
  rationale: 保留分词所呈现的当前状态，即大卫的儿子现正坐在他的王位上。
- source_word: כַּיּוֹם הַזֶּה
  choice: 正如今日
  rationale: 保留希伯来语指向当下可见事实的表达，并以脚注解释其惯用意义。
theological_decisions:
- issue: 王室语境中 חֶסֶד 的译法
  choice: 忠信之爱
  alternative: 守约的信实／坚定不移的爱／慈爱
  rationale: 本节把上帝对大卫的爱与王位延续联系起来，确有守约、信守应许的意味；但原词本身并非“约”一词，因此正文采用“忠信之爱”，在脚注说明守约内涵，避免把解释直接写成原文明说的内容。
- issue: 大卫的行为与上帝恩待之间的关系
  choice: 用并列说明而不明定为单一因果
  alternative: 译作“因为他……”或“正如他……”
  rationale: כַּאֲשֶׁר 可有“因为、照着、正如”等关联。正文保留两句之间的紧密联系，却不把恩典与人的行为之间的神学关系限定为单一因果模式。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“忠信之爱”保留关键词的关系性与守约意味；破折号清楚标明“我父亲大卫”是“你仆人”的同位说明。整体保留“在你面前”“与你同行”“坐在他的王位上”等原文意象。
