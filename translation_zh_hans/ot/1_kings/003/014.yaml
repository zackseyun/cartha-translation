base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/014.yaml
  text: And if you walk in my ways[a], keeping my statutes and my commandments, as David your father walked, then I will lengthen your days.
translation:
  language: zh_hans
  text: 你若行在我的道路上，遵守我的律例和诫命，像你父亲大卫所行的那样，我就延长你的年日[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“使你长寿”或“延长你的寿命”。
    reason: “延长你的年日”贴近原文的表达，其实际含义是延长寿命。
lexical_decisions:
- source_word: וְאִם
  choice: 并且，你若
  rationale: וְ承接上文，אִם引出条件；“并且，你若”既保留话语的连续性，也符合现代汉语表达。
- source_word: תֵּלֵךְ בִּדְרָכַי
  choice: 行我的道
  rationale: 保留希伯来语以“行走”表达生活与品行的盟约性比喻；“行……的道”在现代中文圣经语体中清楚而庄重。
- source_word: לִשְׁמֹר
  choice: 遵守
  rationale: 此不定式说明“行我的道”的具体内容或方式；“遵守”自然表达谨守并实行的含义。
- source_word: חֻקַּי
  choice: 我的律例
  rationale: חֹק是法律与盟约语境中的规定，与后面的“诫命”保持词义区分。
- source_word: וּמִצְוֺתַי
  choice: 和诫命
  rationale: מִצְוָה指所颁布的命令；“诫命”保留其盟约与法律语域。
- source_word: כַּאֲשֶׁר הָלַךְ
  choice: 像……所行的那样
  rationale: 明确表达比较关系，并复现前句“行”的动词呼应。
- source_word: דָּוִיד אָבִיךָ
  choice: 你父亲大卫
  rationale: 采用自然现代汉语词序，同时保留大卫与所罗门的父子关系。
- source_word: וְהַאַרַכְתִּי אֶת יָמֶיךָ
  choice: 我就延长你的年日
  rationale: “就”自然标明条件句的结果；“延长你的年日”贴近希伯来语措辞，同时清楚表达寿命得以延长。
theological_decisions:
- issue: 顺服之条件与长寿之应许
  choice: 按条件句直译：若所罗门遵行上帝的道，上帝就延长他的年日。
  alternative: 将本句解释为无条件的王朝应许，或泛化为一般性的赐福。
  rationale: 原文明确以אִם引出条件，并以延长“年日”为具体结果；译文不弱化此条件，也不引入后来的神学框架。
- issue: 以大卫为顺服的比较对象
  choice: 保留“像你父亲大卫所行的那样”的直接比较。
  alternative: 为协调大卫生平中的过失而加上限定或解释。
  rationale: 本节本身直接以大卫的行事作为比较标准；翻译应保留经文的神学张力，不在正文中补入未明说的限定。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“行我的道”“律例”“诫命”“年日”保留盟约与圣经叙事语域；句法经过适度调整，使条件、比较和结果关系清楚自然。
