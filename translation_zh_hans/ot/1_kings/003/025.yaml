  text: Then the king said[a], “Cut the living child in two, and give half to the one and half to the other.”
translation:
  language: zh_hans
  text: 王就说[a]：“把活着的孩子劈成两半，一半给一个，另一半给另一个。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文后半句直译为“给一个……给一个”，所用形式均为阴性，指叙事中的两个妇人。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 就说
  rationale: 叙事中的连续式推进情节；“就说”自然表达随后发生的命令。
- source_word: הַמֶּלֶךְ
  choice: 王
  rationale: 定冠词所指的王已由上下文明确；现代汉语叙事中译作“王”自然简洁。
- source_word: גִּזְרוּ
  choice: 劈
  rationale: 该复数命令式要求实际切开孩子；“劈”比“分”更明确保留动作的暴烈和具体性。
- source_word: הַיֶּלֶד הַחַי
  choice: 活着的孩子
  rationale: 形容词“活着的”将这个孩子与上下文中死去的孩子区别开来，表达自然清楚。
- source_word: לִשְׁנָיִם
  choice: 成两半
  rationale: 表示分成两部分；结合后文两次“半”，译作“成两半”准确而自然。
- source_word: וּתְנוּ
  choice: 给
  rationale: 第二个复数命令式与前一命令并列；汉语用逗号衔接即可清楚表达连续命令。
- source_word: הַחֲצִי
  choice: 一半
  rationale: 现代汉语分配语境中“一半”自然表达每一份。
- source_word: לְאַחַת ... לְאֶחָת
  choice: 给这个……给那个
  rationale: 希伯来语两处均用阴性单数“一位”，指上下文中的两个妇人；“这个……那个”保留简略的分配表达，不必在正文补出“妇人”。
