  text: Then two women who were prostitutes came to the king and stood before him[a].
translation:
  language: zh_hans
  text: 那时，两个妓女来到王那里，站在他面前。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“那时，有两个做妓女的女人来到王那里，站在他面前。”希伯来语 זֹנוֹת 可直接译作“妓女”，也可展开译作“做妓女的女人”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: 那时
  rationale: 作为叙事中的时间标记，引出接下来的事件；“那时”自然庄重，也保留与上文相接的时序关系。
- source_word: תָּבֹאנָה
  choice: 来见
  rationale: בוא表示来到、进入；此处以王为趋向目标。汉语用“来见王”既表达移动方向，也自然符合觐见或诉讼场景。
- source_word: שְׁתַּיִם נָשִׁים
  choice: 两个……女人
  rationale: 忠实保留数词和名词；因后接身份说明，译作“两个做妓女的女人”符合现代汉语语序。
- source_word: זֹנוֹת
  choice: 做妓女的
  rationale: 该分词描述两名女子的身份或职业。“做妓女的女人”准确而易懂，避免“娼妓”等略显书面或旧式的措辞；也不额外推断其道德或社会处境。
- source_word: אֶל הַמֶּלֶךְ
  choice: 来见王
  rationale: אֶל表示朝向王而来。结合汉语表达，将方向和觐见语境自然合译为“来见王”，而下一分句另行保留她们站在王面前的动作。
- source_word: וַתַּעֲמֹדְנָה
  choice: 站
  rationale: עמד的基本义是站立；这里延续叙事动作，不加译为“申诉”或“候审”，以免过度解释。
- source_word: לְפָנָיו
  choice: 在他面前
  rationale: 直译常见方位及临在表达，在此也自然适用于来到君王面前的场景。
