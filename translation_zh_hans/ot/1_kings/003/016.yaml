translation_notes:
  register: 采用现代、清楚而庄重的叙事语言。“王”沿用列王纪语境中的常用称谓；“做妓女的女人”比“娼妓”更贴近日常现代汉语，同时明确表达原文所述身份。主文中的脚注标记置于相关整句之后。
