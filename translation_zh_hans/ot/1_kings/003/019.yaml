  text: And this woman's son died in the night[b][a], because she lay on him.
translation:
  language: zh_hans
  text: 夜里，这个妇人的儿子死了，因为她压在了他身上。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“她躺在他身上”；原文连接词也可理解为“当她躺在他身上时”。这里按上下文译作因果关系。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: 死了
  rationale: 该叙事形式表示过去发生的事件，现代汉语自然译为“死了”。
- source_word: בֶּן
  choice: 儿子
  rationale: 原文明确指男性孩子，保留其性别信息。
- source_word: הָאִשָּׁה הַזֹּאת
  choice: 这个妇人的
  rationale: 自然表达原文“这个妇人的儿子”这一所属关系。
- source_word: לָיְלָה
  choice: 夜里
  rationale: 这里是时间状语；“夜里”简洁自然，也保留“在夜间”的意思。
- source_word: אֲשֶׁר
  choice: 因为
  rationale: 原词本身可引出关系或情境从句，但上下文表明妇人压在孩子身上是其死亡的原因；正文采用符合语境的因果表达，并以脚注保留句法上的歧义。
- source_word: שָׁכְבָה עָלָיו
  choice: 她压在了他身上
  rationale: 字面为“她躺在他上面”。在此语境中，“压在了他身上”用现代汉语清楚表达身体覆压及其致死作用，同时脚注保留较直译的表达。
