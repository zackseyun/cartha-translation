  yaml_path: translation/ot/1_kings/003/023.yaml
  text: Then the king said[a], “This one says, ‘This is my son, the living one, and your son is the dead one,’ and this one says, ‘No, for your son is the dead one, and my son is the living one.’”
translation:
  language: zh_hans
  text: 于是王说[a]：“这个妇人说：‘这是我的儿子，是活着的；你的儿子是死的。’另一个妇人说：‘不！你的儿子是死的；我的儿子是活着的。’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译：“这个说……这个说……”。两个阴性指示词分别指前面提到的两个妇人。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 于是……说
  rationale: 叙事性的连续式推动情节发展；“于是”自然表达先后承接。
- source_word: הַמֶּלֶךְ
  choice: 王
  rationale: 原文使用带定冠词的头衔；中文在明确语境中用“王”自然准确，无须改用专名。
- source_word: זֹאת ... וְזֹאת
  choice: 这个……那个
  rationale: 阴性指示词指向在场的两个妇人。中文用“这个……那个”保留指示和对比作用；脚注说明也可译作“这个妇人……那个妇人”。
- source_word: אֹמֶרֶת
  choice: 说
  rationale: 分词在王复述双方说法时具有生动的现在陈述功能；中文“说”无需标明时态，也自然保持现场感。
- source_word: זֶה בְּנִי הַחַי
  choice: 这是我的儿子，是活着的
  rationale: 保留原文“这是我的儿子”及后置的“活着的”这一辨认、说明结构，不改写为较扁平的“我的儿子是活的”。
- source_word: בְּנִי / בְּנֵךְ
  choice: 我的儿子／你的儿子
  rationale: בֵּן通常指“儿子”，上下文也明确是男婴。
- source_word: הַחַי
  choice: 活着的
  rationale: 带冠词的形容词具有名词性或说明性功能；“活着的”与“死的”形成清晰对照，并保留原文措辞。
- source_word: הַמֵּת
  choice: 死的
  rationale: 与הַחַי平行；在中文语境中“死的”简洁自然，所指的儿子由前文明确。
- source_word: לֹא כִי
  choice: 不！……才是……
  rationale: 该组合先否定对方，再提出相反断言。中文以“不！”和焦点词“才是”自然表达反驳与纠正；避免把כִּי机械译成因果性的“因为”。
