  text: Then one woman said, “Please, my lord, I and this woman live in one house, and I gave birth while she was in the house with me.
translation:
  language: zh_hans
  text: 其中一个妇人说：“我主啊，求你了！我和这个妇人同住一所房子；我生孩子时，她也在房子里。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּי אֲדֹנִי
  choice: 我主啊，请听！
  rationale: בִּי 是向尊长陈情时的恳求语，与 אֲדֹנִי 合用；译为自然的庭审请求语，同时保留对王的尊称。
- source_word: יֹשְׁבֹת בְּבַיִת אֶחָד
  choice: 同住一所房子
  rationale: 分词表达当时持续的居住状态；中文用“同住”比逐字译作“坐在”准确自然，也不必强行标明过去或现在时。
- source_word: וָאֵלֵד עִמָּהּ בַּבָּיִת
  choice: 我生孩子的时候，她也在房子里
  rationale: עִמָּהּ 在这里表示她在场、与说话者同处屋内；避免译成可能暗示二人共同生产的“和她一起生”。
theological_decisions: []
