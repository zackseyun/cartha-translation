id: 1KI.3.10
reference: 1 Kings 3:10
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יִּיטַ֥ב הַ/דָּבָ֖ר בְּ/עֵינֵ֣י אֲדֹנָ֑/י כִּ֚י שָׁאַ֣ל שְׁלֹמֹ֔ה אֶת הַ/דָּבָ֖ר הַ/זֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/010.yaml
  text: And the matter was good in the eyes of the Lord[a], because Solomon had asked this thing.
translation:
  language: zh_hans
  text: 这件事在主看来是好的[a]，因为所罗门求了这件事。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“这件事使主喜悦。”
    reason: 词汇与习语的替代译法；יטב与בְּעֵינֵי合用可自然表达“令某人喜悦”。
lexical_decisions:
- source_word: וַיִּיטַב
  choice: 是好的
  rationale: 该动词源于יטב，在此表达主对所罗门所求之事的正面评价；“是好的”保留原文措辞及希伯来语评价方式，没有直接改写为更具感情色彩的“使……喜悦”。
- source_word: הַדָּבָר
  choice: 这件事
  rationale: דבר语义宽泛，可指话、事情或事项。结合上下文用“这件事”自然指向所罗门所求的内容，同时不将其过度具体化为“请求”。
- source_word: בְּעֵינֵי
  choice: 在……看来
  rationale: 这是希伯来语“在……眼中”的评价习语；现代汉语以“在……看来”自然传达同一意义，避免生硬直译。
- source_word: אֲדֹנָי
  choice: 主
  rationale: 原文为אֲדֹנָי（主），并非四字神名יהוה，因此译作“主”，不译作专门对应יהוה的形式。
- source_word: כִּי
  choice: 因为
  rationale: 此处引出这件事得到正面评价的原因，因果义明确。
- source_word: שָׁאַל
  choice: 求了
  rationale: שׁאל可表示询问或求取；这里带直接宾语，语境是所罗门向主求某事，译作“求了”简洁自然，也不额外加入原文没有的“想要”。
- source_word: שְׁלֹמֹה
  choice: 所罗门
  rationale: 采用该人名通行的现代中文译法。
- source_word: אֶת הַדָּבָר הַזֶּה
  choice: 这件事
  rationale: 保留原文含指示词的完整宾语，并呈现דבר在本节中的重复，避免压缩成较含混的“这个”。
theological_decisions:
- issue: 神圣称号אֲדֹנָי的译法
  choice: 主
  alternative: 耶和华
  rationale: 马所拉文本此处明确使用אֲדֹנָי，而不是יהוה；译作“主”忠实保留两者的词汇区别。
- issue: 主对所罗门所求之事的评价
  choice: 是好的
  alternative: 使主喜悦
  rationale: “使主喜悦”在语境中成立，但会将יטב的评价性表达转为情感性表达；正文保留“好”的语义，脚注列出自然的替代译法。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“在主看来”自然传达希伯来语习语；保留“这件事”的重复，以反映原文结构。
