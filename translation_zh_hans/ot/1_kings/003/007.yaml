  text: וְ/עַתָּה֙ יְהוָ֣ה אֱלֹהָ֔/י אַתָּה֙ הִמְלַ֣כְתָּ אֶֽת עַבְדְּ/ךָ֔ תַּ֖חַת דָּוִ֣ד אָבִ֑/י וְ/אָֽנֹכִי֙ נַ֣עַר קָטֹ֔ן לֹ֥א אֵדַ֖ע צֵ֥את וָ/בֹֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/007.yaml
  text: And now[a], O Yahweh my God, you have made your servant king in place of David my father, though I am a little child[b]; I do not know how to go out or come in.
translation:
  language: zh_hans
  text: 现在，耶和华——我的上帝啊，你使你的仆人接替我父亲大卫作王；而我还十分年少[a]，不知道该怎样出入[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可指“年轻人”。希伯来语这一说法是自谦之辞，强调年轻、稚嫩和缺乏经验，并不一定是在说明确切年龄。
    reason: lexical_alternative
  - marker: b
    text: “出入”是希伯来语习语，指履行职责；在这里尤其涉及公开治理和带领百姓。
    reason: cultural_note
lexical_decisions:
- source_word: וְעַתָּה
  choice: 现在
  rationale: 承接上文并转入所罗门眼前的处境；现代汉语用“现在”自然简洁。
- source_word: יְהוָה אֱלֹהָי
  choice: 耶和华我的上帝啊
  rationale: 保留圣名 יְהוָה，并以呼格语气译出所罗门直接向上帝祷告的表达。
- source_word: הִמְלַכְתָּ אֶת־עַבְדְּךָ
  choice: 你使你的仆人……作王
  rationale: 译出 מלך 的使役形含义；“仆人”符合君王祷告中谦卑、自称服事上帝的语境。
- source_word: תַּחַת דָּוִד אָבִי
  choice: 接替我父亲大卫
  rationale: 此处 תַּחַת 表示王位承继；“接替”比逐字的“代替”更自然，也未把次序关系扩展成原文没有明说的内容。
- source_word: נַעַר קָטֹן
  choice: 年幼的孩子
  rationale: 保留年幼、微小和自谦的语气，同时不武断限定所罗门的确切年龄。
- source_word: לֹא אֵדַע צֵאת וָבֹא
  choice: 不知道怎样出入
  rationale: 保留“出去、进来”的希伯来习语，并用“怎样”表达欠缺履职经验的含义；具体领导语境置于脚注。
theological_decisions:
- issue: 如何译出神名 יְהוָה
  choice: 耶和华
  alternative: 雅威
  rationale: 正文保留专名而不以“主”替代；“耶和华”是现代简体中文圣经传统中最通行、普通读者最易识别的音译。
- issue: 所罗门自称 נַעַר קָטֹן 的年龄与自谦意味
  choice: 年幼的孩子
  alternative: 年轻人／我还很年轻
  rationale: 原词可指孩子或青年，重点包含年幼与缺乏经验；正文不据此断定确切年龄，脚注保存词义范围。
- issue: צֵאת וָבֹא 是否直接释为治理或领导
  choice: 正文保留“出入”
  alternative: 不知道怎样治理／领导
  rationale: 原文使用习语而未直接出现“治理”一词；保留形象可避免过度解释，并由脚注说明其在公共职责、尤其领导职分中的含义。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语体。“耶和华我的上帝啊”保留呼告色彩；分号呈现所罗门受立为王与自觉无经验之间的张力。所有脚注标记均置于相应正文词语之后。
