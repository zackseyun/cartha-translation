id: 1KI.3.1
reference: 1 Kings 3:1
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יִּתְחַתֵּ֣ן שְׁלֹמֹ֔ה אֶת פַּרְעֹ֖ה מֶ֣לֶךְ מִצְרָ֑יִם וַ/יִּקַּ֣ח אֶת בַּת פַּרְעֹ֗ה וַ/יְבִיאֶ֨/הָ֙ אֶל עִ֣יר דָּוִ֔ד עַ֣ד כַּלֹּת֗/וֹ לִ/בְנ֤וֹת אֶת בֵּית/וֹ֙ וְ/אֶת בֵּ֣ית יְהוָ֔ה וְ/אֶת חוֹמַ֥ת יְרוּשָׁלִַ֖ם סָבִֽיב־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/001.yaml
  text: Solomon formed a marriage alliance with Pharaoh king of Egypt[a], and he took Pharaoh’s daughter and brought her into the city of David until he had finished building his own house, and the house of Yahweh[b], and the wall around Jerusalem.
translation:
  language: zh_hans
  text: 所罗门借婚姻与埃及王法老结亲[a]，娶了法老的女儿，把她带进大卫城，让她住在那里，直到他建完自己的宫室、耶和华的殿[b]和耶路撒冷四围的城墙。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“与法老结成姻亲”。希伯来文强调进入姻亲关系；在王室语境中，这也可能带有政治联盟的意味。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“耶和华的家”，即耶和华的殿。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְחַתֵּן
  choice: 结成姻亲
  rationale: 该词表示借婚姻建立亲属关系；在王室语境中也含有政治联盟意味。“结成姻亲”兼顾婚姻关系与联盟背景，又避免把政治含义说得过满。
- source_word: אֶת פַּרְעֹה מֶלֶךְ מִצְרָיִם
  choice: 与埃及王法老
  rationale: 保留同位关系，明确法老是埃及王；现代汉语表达简洁自然。
- source_word: וַיִּקַּח אֶת בַּת פַּרְעֹה
  choice: 娶了法老的女儿
  rationale: לקח以女子为宾语在此是娶妻的惯用表达；中文直译为“带走”会造成误解，因此明确译出婚娶含义。
- source_word: וַיְבִיאֶהָ אֶל עִיר דָּוִד
  choice: 把她带进大卫城
  rationale: 准确表达使她进入目的地并居于其中的动作。
- source_word: עַד כַּלֹּתוֹ לִבְנוֹת
  choice: 住在那里，直到他建完
  rationale: 原文的“直到”标示她被安置在大卫城这一情形的终点；补出“住在那里”使中文时间关系清楚，但不改变原意。
- source_word: אֶת בֵּיתוֹ
  choice: 自己的宫室
  rationale: בַּיִת基本义为“房屋”，但在所罗门王的建筑语境中指其王宫建筑。“宫室”既符合语境，也不过度限定为单一建筑。
- source_word: וְאֶת בֵּית יְהוָה
  choice: 耶和华的殿
  rationale: 字面为“耶和华的家/殿”；此处指圣殿。“殿”在现代中文中清楚自然，同时脚注保留字面译法。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代简体中文圣经语境中广为人知的神名音译，直接呈现专名而不以“主”这一称号替代。
- source_word: וְאֶת חוֹמַת יְרוּשָׁלִַם סָבִיב
  choice: 和耶路撒冷四围的城墙
  rationale: “四围”体现סָבִיב的环绕意义；“城墙”自然表达环城防御工事，虽中文用集合性名词，仍对应希伯来文单数。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用四字神名。中文正文以“耶和华”呈现专名，符合普通现代读者的辨识习惯；“雅威”是较贴近学界常见复原读音的另一音译。
- issue: בֵּית יְהוָה 的表达
  choice: 耶和华的殿
  alternative: 耶和华的家
  rationale: “殿”明确此处所指的圣殿建筑；脚注说明字面为“家”，以保留原文意象而不使正文生硬。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。以“结成姻亲”保留婚姻关系和王室联盟之间的语义张力；正文用“殿”确保普通读者易懂，脚注补充“家”的字面意象。
