base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/005.yaml
  text: At Gibeon Yahweh appeared to Solomon in a dream at night[a], and God said, “Ask what I should give you.”
translation:
  language: zh_hans
  text: 在基遍，雅威在夜里的梦中[a]向所罗门显现。上帝说：“你求吧：要我赐给你什么？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译：“在夜里的梦中”，意思是在夜间所做的梦中。
    reason: 说明原文“梦”受“夜”限定的属格结构，并解释正文的自然汉语表达。
lexical_decisions:
- source_word: בְּ/גִבְעוֹן
  choice: 在基遍
  rationale: 介词 בְּ 表示地点；“在基遍”是现代汉语中自然、准确的地点表达。
- source_word: נִרְאָה
  choice: 显现
  rationale: ראה 的尼法勒形式在此指神向人显现；“显现”既符合圣经叙事语域，也不额外断定显现的具体方式。
- source_word: יְהֹוָה
  choice: 雅威
  rationale: 按希伯来文直接保留四字神名，以“雅威”音译，避免把专名化约为称号。
- source_word: אֶל שְׁלֹמֹה
  choice: 向所罗门
  rationale: אֶל 表示显现所指向的对象；“向所罗门显现”符合现代汉语搭配。
- source_word: בַּ/חֲל֣וֹם הַ/לָּ֑יְלָה
  choice: 在夜间的梦中
  rationale: 原文直译近于“在夜里的梦中”。正文采用自然而仍贴近原文结构的表达，并以脚注说明其字面形式。
- source_word: וַ/יֹּ֣אמֶר
  choice: 说
  rationale: 叙事性连续结构推进事件；汉语分句另起一句即可自然表达，无须机械增译“于是”或“并且”。
- source_word: אֱלֹהִים
  choice: 上帝
  rationale: 原文在前面的 יהוה 之后改用 אֱלֹהִים；译作“上帝”以保留这一称谓变化。
- source_word: שְׁאַ֖ל
  choice: 你求吧
  rationale: 阳性单数命令式语气直接；加“吧”使现代汉语自然，同时保留邀请对方提出所求的开放性。
- source_word: מָ֥ה אֶתֶּן לָךְ
  choice: 要我赐给你什么？
  rationale: 直译近于“我将赐给你什么？”在“你求吧”之后用此问句，准确、自然，并保留尚未指定所求之物的开放性。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文使用四字神名而非普通称号；音译“雅威”使读者看见此处的专名，并与本节后半的 אֱלֹהִים 区分。
- issue: 同一节中 יהוה 与 אֱלֹהִים 的称谓转换
  choice: 分别译作“雅威”和“上帝”
  alternative: 两处统一译作“上帝”或“主”
  rationale: 保留希伯来文紧邻出现的两个不同称谓，不为文体顺滑而消除原文的词汇变化。
- issue: מָה אֶתֶּן לָךְ 的语气关系
  choice: 译为直接问句“要我赐给你什么？”
  alternative: 译为间接结构“求我赐给你什么”
  rationale: 希伯来文在命令式“求”之后保留疑问词 מָה 和未完成式动词；直接问句在汉语中自然，也不把其语法关系解释得过死。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“显现”“赐给”保持经文语体，但不使用生僻或古奥句式；神名与普通神称谓的变化在译文中清楚可见。
