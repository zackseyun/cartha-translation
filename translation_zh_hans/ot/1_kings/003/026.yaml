base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/026.yaml
  text: Then the woman whose son was alive said to the king[a], because her compassion was stirred for her son, and she said, "Please, my lord, give her the living child, and do not put him to death." But the other said, "It shall be neither mine nor yours[b]; cut him in two."
translation:
  language: zh_hans
  text: 那活孩子的母亲因疼爱自己的儿子，心里万分不忍，就对王说：“求我主把活孩子给她吧，千万不要杀死他！”另一个妇人却说：“他既不归我，也不归你；把他劈开吧！”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נִכְמְרוּ רַחֲמֶיהָ
  choice: 因疼爱自己的儿子，心里万分不忍
  rationale: 该习语以“发热、激动”形容怜爱之情被强烈触动；中文用“疼爱……心里万分不忍”自然表达母亲强烈的怜惜，又保留其行动动因。
- source_word: בִּי אֲדֹנִי
  choice: 求我主
  rationale: בִּי在请求中是恳求语气；“求我主”兼顾急切与对王的敬称。
- source_word: הַיָּלוּד הַחַי
  choice: 活孩子
  rationale: יַלוּד指所生的孩子，语境未要求进一步限定年龄；“活孩子”直接保留与死孩子的对比。
- source_word: וְהָמֵת אַל תְּמִיתֻהוּ
  choice: 千万不要杀死他
  rationale: 不定式绝对形与限定动词连用，加强禁止语气；“千万不要”在现代汉语中自然传达强烈恳求。
- source_word: וְזֹאת אֹמֶרֶת
  choice: 另一个妇人却说
  rationale: 指示词在此对比两名妇人；补出“妇人”并用“却”使中文指代清楚，同时保留鲜明反差。
- source_word: גַּם לִי גַם לָךְ לֹא יִהְיֶה
  choice: 他既不归我，也不归你
  rationale: 省略的主语是男婴；以“他”保留希伯来语所指的人，而“归”自然表达争夺归属的语境。
- source_word: גְּזֹרוּ
  choice: 把他劈开吧
  rationale: 命令简短而残酷；“劈开”承接上一节把孩子分成两半的命令，不额外重复已由语境明确的信息。
