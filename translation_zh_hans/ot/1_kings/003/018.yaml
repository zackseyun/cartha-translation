base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/018.yaml
  text: And on the third day after I gave birth[a], this woman also gave birth. And we were together; there was no stranger with us in the house, only the two of us were in the house.
translation:
  language: zh_hans
  text: 我生下孩子后的第三天，这女人也生了孩子。我们在一起；屋里没有外人[a]跟我们在一起，屋里只有我们两个人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “外人”也可译作“陌生人”，指不属于她们这个小群体或住处的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַּיּוֹם הַשְּׁלִישִׁי לְלִדְתִּי
  choice: 我生产后的第三天
  rationale: 以自然的现代汉语表达叙事中的时间关系；לְ加不定词及第一人称后缀在此指以说话者生产为起点的第三天。
- source_word: וַתֵּלֶד גַּם הָאִשָּׁה הַזֹּאת
  choice: 这女人也生产了
  rationale: 保留הַזֹּאת的指示意味和גַּם的“也”；“生产”符合本段郑重而清楚的叙述语体。
- source_word: וַאֲנַחְנוּ יַחְדָּו
  choice: 我们住在一起
  rationale: יַחְדָּו本义为“在一起”。结合随后反复出现的“屋里”，译作“住在一起”在汉语中更自然，但不提前加入“独自”等下一分句才说明的信息。
- source_word: אֵין זָר אִתָּנוּ בַּבַּיִת
  choice: 屋里没有外人和我们同住
  rationale: “外人”保留זָר所含不属于这两人或该住处之人的意味；“和我们同住”表达אִתָּנוּ并贴合房屋语境。
- source_word: זוּלָתִי שְׁתַּיִם אֲנַחְנוּ בַּבָּיִת
  choice: 屋里只有我们两个人
  rationale: זוּלָתִי在此构成排除性表达；保留原文重复“屋里”的强调，突出没有其他见证人在场。
