  yaml_path: translation/ot/1_kings/003/027.yaml
  text: Then the king answered and said[a], “Give her the living child, and by no means put him to death; she is his mother.”
translation:
  language: zh_hans
  text: 王就回答说：“把活着的孩子交给她，绝不可杀死他；她才是他的母亲。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַן הַמֶּלֶךְ וַיֹּאמֶר
  choice: 王就回答说
  rationale: 保留希伯来叙事中“回答并说”的表达，同时用现代汉语自然的“回答说”避免生硬重复；“就”承接前文判决过程。
- source_word: תְּנוּ לָהּ
  choice: 把……交给她
  rationale: 复数命令式是对在场执行命令者所说；“交给她”比直译“给她”更符合王下令处置孩子的语境。
- source_word: הַיָּלוּד הַחַי
  choice: 活着的孩子
  rationale: יַלוּד指所生的婴孩，结合上下文译为“孩子”；הַחַי译作“活着的”，与死去的孩子形成清楚对照。
- source_word: וְהָמֵת לֹא תְמִיתֻהוּ
  choice: 绝不可杀死他
  rationale: 不定式绝对形与使役未完成式同根连用，加强禁止语气；“绝不可”准确传达强调，而“杀死他”保留使其死亡的含义。
- source_word: הִיא אִמּוֹ
  choice: 她才是他的母亲
  rationale: 无系词判断句直译为“她是他的母亲”；加入焦点副词“才”自然表达本句在辨认真母亲这一语境中的确认意味，并未改变所指。
theological_decisions: []
