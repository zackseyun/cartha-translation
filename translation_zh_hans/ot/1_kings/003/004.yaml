base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/004.yaml
  text: And the king went to Gibeon to sacrifice there[a], for that was the great high place. Solomon offered a thousand burnt offerings on that altar.
translation:
  language: zh_hans
  text: 王前往基遍，在那里献祭，因为那里是最重要的丘坛[a]。所罗门在那座坛上献上一千份燔祭。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“最大的丘坛。”希伯来语形容词既可指规模大，也可指地位显著。
    reason: 保留הַגְּדוֹלָה在规模与重要性之间的词义可能。
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: 到……去
  rationale: הלך在此是叙事中的普通行动动词，表示王前往基遍；“到基遍去”符合现代汉语习惯，不额外加入原文未明说的“上去”。
- source_word: גִּבְעֹנָה
  choice: 到基遍
  rationale: 地名后的方向词尾表示朝向基遍，译为“到基遍”。
- source_word: לִזְבֹּחַ
  choice: 献祭
  rationale: זבח在此泛指进行祭祀，简洁译为“献祭”，并不预先限定祭物种类。
- source_word: כִּי הִיא הַבָּמָה הַגְּדוֹלָה
  choice: 因为那里是最重要的丘坛
  rationale: במה译作“丘坛”，保留其作为特定祭祀场所的历史宗教含义；גדולה在语境中可指规模大或地位显著，正文采用自然的“最重要”，脚注保留“最大的”这一可能。代词היא在汉语中按所指地点自然译作“那里”。
- source_word: אֶלֶף עֹלוֹת
  choice: 一千只燔祭牲
  rationale: עֹלוֹת特指全部焚烧献上的祭牲；“燔祭牲”既保留祭种名称，也让量词“只”有明确所指。数字按原文直译。
- source_word: יַעֲלֶה
  choice: 献了
  rationale: עלה的使役式与燔祭搭配，惯用义为“献上”。此处未完成式位于叙事说明中，可表过去发生的行动；译作“献了”避免无充分依据地加入经常性含义。
- source_word: עַל הַמִּזְבֵּחַ הַהוּא
  choice: 在那座坛上
  rationale: 忠实表达介词、指示词和祭坛名词，并采用自然的现代汉语量词。
theological_decisions:
- issue: 圣殿建成前祭祀场所במה的译法
  choice: 丘坛
  alternative: 祭祀场所；神殿
  rationale: “丘坛”保留列王纪中这一专门术语及其相关的正典张力，不用较中性的“祭祀场所”淡化，也不以“神殿”赋予原文没有明说的性质。
- issue: הַגְּדוֹלָה所表达的是规模还是地位
  choice: 正文译“最重要的”，脚注注明“最大的”
  alternative: 最大的丘坛
  rationale: 该形容词可以表示体量之大，也可表示显要、首要。结合基遍作为主要祭祀中心的语境，正文采用“最重要的”，同时借脚注保存真实的词义歧义。
translation_notes:
  register: 采用庄重而易懂的现代标准普通话。“丘坛”“燔祭牲”保留必要的古代祭祀术语；句式简洁，适合公开诵读。
