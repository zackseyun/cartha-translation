  text: וַ/יִּקַ֥ץ שְׁלֹמֹ֖ה וְ/הִנֵּ֣ה חֲל֑וֹם וַ/יָּב֨וֹא יְרוּשָׁלִַ֜ם וַֽ/יַּעֲמֹ֣ד לִ/פְנֵ֣י אֲר֣וֹן בְּרִית אֲדֹנָ֗/י וַ/יַּ֤עַל עֹלוֹת֙ וַ/יַּ֣עַשׂ שְׁלָמִ֔ים וַ/יַּ֥עַשׂ מִשְׁתֶּ֖ה לְ/כָל עֲבָדָֽי/ו׀׀־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/015.yaml
  text: Then Solomon awoke[a], and behold, it was a dream. And he came to Jerusalem and stood before the ark of the covenant of the LORD, and offered up burnt offerings and made peace offerings, and made a feast for all his servants.
translation:
  language: zh_hans
  text: 所罗门醒来，才知道这是一场梦。他来到耶路撒冷，站在主的约柜前，献上燔祭和平安祭[a]，又为他所有的臣仆摆设筵席。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “平安祭”也可译作“团契祭”；这类祭通常包括共同享用祭肉的筵席。
    reason: 说明שְׁלָמִים的可选译法及其常见礼仪特点，避免加入本节未明示的神学性解释；标记对应“平安祭”。
lexical_decisions:
- source_word: וַיִּקַץ
  choice: 醒来
  rationale: 直接表达从睡眠中醒来的动作，符合现代汉语叙事习惯。
- source_word: וְהִנֵּה חֲלוֹם
  choice: 才发现原来是一场梦
  rationale: הִנֵּה提示人物突然意识到眼前事实；此译法自然传达这种恍然察觉，同时保留名词句“是一场梦”的简洁含义。
- source_word: וַיָּבֹא יְרוּשָׁלִַם
  choice: 来到耶路撒冷
  rationale: בוא的基本义为“来、进入”；原文没有明说“返回”，故不增添这一解释。
- source_word: וַיַּעֲמֹד לִפְנֵי
  choice: 站在……前
  rationale: 贴合原文表示来到某对象面前、在其前站立的惯用表达。
- source_word: אֲרוֹן בְּרִית אֲדֹנָי
  choice: 主的约柜
  rationale: 用汉语中自然的所有格结构表达“主之约的柜”；“约柜”是清楚而通行的祭仪用语。所据WLC正文写作אֲדֹנָי，故译作“主”，不擅自改作神名“耶和华”。
- source_word: וַיַּעַל עֹלוֹת
  choice: 献上燔祭
  rationale: עֹלָה指在坛上焚烧献上的祭物；“燔祭”是准确、简洁且通行的汉语对应词。
- source_word: שְׁלָמִים
  choice: 平安祭
  rationale: 这是该类祭物在汉语圣经语境中的通行名称，也与其词根所含的完整、安宁意义相应；其共享祭餐的团契层面用脚注说明。
- source_word: מִשְׁתֶּה
  choice: 筵席
  rationale: 该词指宴饮或宴席；“摆设筵席”在庄重叙事中自然，也符合献祭后的庆贺场景。
- source_word: לְכָל עֲבָדָיו
  choice: 为自己的众臣仆
  rationale: עֲבָדִים既可泛指仆人，也可指王室臣属；“臣仆”保留两层可能，适合所罗门的宫廷语境。
theological_decisions:
- issue: אֲדֹנָי在“约柜”短语中的译法
  choice: 主
  alternative: 耶和华
  rationale: 所提供的WLC正文明确为אֲדֹנָי（“主”），而非四字神名יהוה。依原文证据优先的原则，正文译“主”；尽管不少译本按惯用圣约称谓译作“耶和华”，这里不据传统搭配替换所给希伯来文本。
- issue: שְׁלָמִים所表达的祭礼意义
  choice: 平安祭
  alternative: 团契祭
  rationale: “平安祭”保留传统祭类名称及词根联系；“团契祭”突出了献祭者共享祭餐的一面，却可能把该祭的意义收窄，因此列入脚注而不放入正文。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“才发现原来”传达הִנֵּה带来的突然领悟；“臣仆”兼顾一般仆役与王室臣属。祭祀术语保留通行的“燔祭、平安祭”，并以脚注解释后者。
