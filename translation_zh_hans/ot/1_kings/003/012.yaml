  to: 看哪，我已经照你的话而行了。看哪，我赐给你一颗有智慧、能明辨的心[a]；在你以前，没有人像你；在你以后，也不会有人像你一样兴起。
  rationale: 修订“成就了”为“而行了”，准确且自然地表达神按所罗门所说的话采取行动；将“有辨识力”调整为“能明辨”，使修饰“心”的表达更顺畅。以分号分开前后两个时间比较分句，保持原文对所罗门在所赐智慧与明辨上无可比拟的宣告，而不额外界定其范围。
