base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/012.yaml
  text: Behold[a], I have done according to your words. Behold, I have given you a wise and discerning heart, such that no one like you has been before you, and no one like you shall arise after you.
translation:
  language: zh_hans
  text: 看哪，我已经照你的话而行了。看哪，我赐给你一颗有智慧、能明辨的心[a]；在你以前，没有人像你；在你以后，也不会有人像你一样兴起。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“明白事理的心”。“心”在希伯来语中也包括思考、判断和辨识的内在能力，并非只指情感。
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: 看哪
  rationale: 保留两次话语提示词，传达神宣告时庄重而强调的语气；“看哪”比省略不译更贴近原文。
- source_word: עָשִׂיתִי כִּדְבָרֶיךָ
  choice: 我已经照你的话成就了
  rationale: “照你的话”保留 דְבָרֶיךָ 的字面意象，不把它直接解释成“照你的请求”；“成就”自然表达神已按所言采取行动。
- source_word: נָתַתִּי לְךָ
  choice: 我赐给你
  rationale: 用“赐给”表达神向所罗门施予恩赐的语境，同时保留完成体所呈现的已然行动。
- source_word: לֵב חָכָם וְנָבוֹן
  choice: 一颗有智慧、有辨识力的心
  rationale: 保留“心”，因为希伯来语 לֵב 涵盖思想、判断与意愿，不仅指情感；“辨识力”体现 נָבוֹן 在审断语境中的洞察和分辨。
- source_word: אֲשֶׁר כָּמוֹךָ לֹא הָיָה לְפָנֶיךָ
  choice: 在你以前，没有人像你
  rationale: 将关系从句自然译成比较性的陈述，保留所赐智慧无可比拟的含义，而不译成目的关系。
- source_word: וְאַחֲרֶיךָ לֹא יָקוּם כָּמוֹךָ
  choice: 在你以后，也不会有人像你一样兴起
  rationale: “兴起”保留 יָקוּם 的意象，指后来出现于历史中的人；未来表达对应原文未完成式。
theological_decisions:
- issue: 所罗门无可比拟的范围
  choice: 让比较紧接“有智慧、有辨识力的心”，按上下文理解为在这项恩赐上无可比拟
  alternative: 理解为所罗门在一切方面都绝对无人能及
  rationale: 本节的直接主题是神所赐的智慧和辨识力。译文不额外加入“在智慧上”，以免缩窄原文句法，却借上下文联系避免扩大为经文未明确提出的全面优越。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“看哪”保留圣经宣告语体；“有智慧、有辨识力的心”兼顾希伯来语意象与现代汉语可读性。
