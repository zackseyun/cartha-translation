base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/003.yaml
  text: Solomon loved Yahweh[a], walking in the statutes of David his father; only[b], he was sacrificing and burning incense at the high places.
translation:
  language: zh_hans
  text: 所罗门爱耶和华，遵行他父亲大卫的律例；只是[a]他常在丘坛[b]献祭烧香。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“只不过他常在丘坛献祭烧香。”
    reason: alternative_reading
  - marker: b
    text: “丘坛”指地方性的高处敬拜场所。
    reason: cultural_note
lexical_decisions:
- source_word: וַיֶּאֱהַב
  choice: 爱
  rationale: אהב直接表达爱与亲爱；“爱”自然简洁，也保留叙述者对所罗门的正面评价。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文读者熟悉的专名“耶和华”译出四字神名，而不以称号替代。
- source_word: לָלֶכֶת
  choice: 遵行
  rationale: 字面为“行走”；在“律例”这一语境中指按其规范生活。“遵行”自然表达持续的生活实践及所罗门爱耶和华的表现。
- source_word: בְּחֻקּוֹת
  choice: 律例
  rationale: חֻקּוֹת指规定、法令；“律例”保留其立约与法律语境中的规范意味。
- source_word: דָּוִד אָבִיו
  choice: 他父亲大卫的
  rationale: 按现代汉语自然语序表达大卫与所罗门的父子关系，并清楚修饰“律例”。
- source_word: רַק
  choice: 只是
  rationale: רַק在此限制前面的正面评价；“只是”保留转折和限定作用，而不把语气强化为全面否定。
- source_word: בַּבָּמוֹת
  choice: 在邱坛
  rationale: בָּמוֹת指地方性的高处祭祀场所；“邱坛”是简洁且较为通行的中文圣经文化用语，并以脚注解释。
- source_word: מְזַבֵּחַ
  choice: 献祭
  rationale: 分词表示持续或惯常的行为；汉语“献祭”在本句中可自然表达这种做法。
- source_word: וּמַקְטִיר
  choice: 烧香
  rationale: קטר的使役式在敬拜语境中可指使祭物或香上升为烟；与“献祭”并列时，“烧香”是清楚自然的译法，同时不重复前一动词。
theological_decisions:
- issue: 叙述者对所罗门敬拜行为的评价
  choice: 先明确肯定所罗门爱耶和华并遵行大卫的律例，再以“只是”指出他在邱坛敬拜这一限制。
  alternative: 把开头的称赞理解为讽刺或受到严重削弱；或把当时的邱坛敬拜理解为毫无保留地获得认可。
  rationale: 句法先作正面陈述，随后由רַק引入限定。译文保留这种赞许与保留并存的张力，不将其化约为全然赞同或全然谴责。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“遵行……律例”清楚传达希伯来语“行在……律例中”的行为隐喻；“邱坛”保留传统宗教文化术语，并以脚注帮助普通读者理解。
