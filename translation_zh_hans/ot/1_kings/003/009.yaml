base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/009.yaml
  text: So give your servant a listening heart to judge your people[a], to discern between good and evil[b], for who is able to judge this great people of yours?
translation:
  language: zh_hans
  text: 所以，求你赐给你仆人一颗聆听的心[a]，好审判你的百姓，辨别善恶；因为谁能审判你这重大的百姓[b]呢？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“一颗明辨的心”；原文直译为“一颗听／聆听的心”。
    reason: lexical_alternative
  - marker: b
    text: “重大”所译的希伯来语字面意思是“沉重”或“有分量”，在这里可表达这百姓的重要性，或治理他们所负责任之重。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתָּ
  choice: 所以，求你赐给
  rationale: 这里的连词加完成式承接上文，在祷告中表达请求。译为“所以，求你赐给”，既体现与前文的因果承接，也符合现代汉语祈求的表达方式。
- source_word: לְעַבְדְּךָ
  choice: 仆人
  rationale: 所罗门在上帝面前以“仆人”自称，表达君王对神圣君王的谦卑与从属；此处不突出奴隶身份，故不用“奴隶”。
- source_word: לֵב שֹׁמֵעַ
  choice: 一颗聆听的心
  rationale: 原文直译为“听的心”，包含留心聆听、领受和作出回应的意味。“聆听的心”保留希伯来语的身体意象和一定的语义开放性，而不直接收窄为纯智力上的“聪明”。
- source_word: לִשְׁפֹּט
  choice: 审判
  rationale: שפט 可涵盖治理和施行司法，但本节紧接“辨别善恶”，译为“审判”最能保留其词义核心，同时不排除君王治理百姓的广义内涵。
- source_word: עַמְּךָ
  choice: 你的百姓
  rationale: 准确保留第二人称所属关系，也保留百姓与上帝之间的圣约及政治层面含义。
- source_word: לְהָבִין
  choice: 辨别
  rationale: 该动词在使役词干中表示具有区分性的理解和洞察；在司法语境中，“辨别”比宽泛的“明白”更贴切。
- source_word: בֵּין טוֹב לְרָע
  choice: 辨别善恶
  rationale: 保留原文“善”与“恶”的道德和评价性用语，不将其缩窄为“是非”或“对错”。
- source_word: כִּי מִי יוּכַל
  choice: 因为谁能
  rationale: 引出所罗门提出请求的理由，以反问表达他无力独自承担此任。
- source_word: הַכָּבֵד
  choice: 如此重大的
  rationale: כבד 本义为“重”，可引申为分量重、重要、负担重大或规模庞大。“重大的”在现代汉语中较自然，并保留其分量和治理责任的多重意味；脚注说明其字面意象。
theological_decisions:
- issue: 所罗门请求中的人论意象
  choice: 一颗聆听的心
  alternative: 一颗明辨的心／一颗聪明的心
  rationale: 希伯来语以“心”指认知、意志和回应的中心。保留“心”和“聆听”的意象，可避免把所求仅仅理解为智力，同时保留领受、顺从和明辨之间的张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“求你赐给”体现祷告语气；“聆听的心”保留原文鲜明意象；“审判”和“辨别善恶”保持司法及道德语境。脚注标记均置于所说明的词语之后。
