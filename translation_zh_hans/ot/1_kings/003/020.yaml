base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/020.yaml
  text: She got up in the middle of the night and took my son from beside me while your servant was sleeping[a], and she laid him in her bosom, and laid her dead son in my bosom.
translation:
  language: zh_hans
  text: 她半夜起来，当你的婢女睡着时，把我儿子从我身边抱走，放在她怀里[a]，又把她死去的儿子放在我怀里。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “怀里”所译的希伯来语也可指“膝上”；这里指贴近胸前或身体的怀抱处。
    reason: 保留חֵיק的语义范围，同时说明正文选择“怀里”的母婴语境依据。
lexical_decisions:
- source_word: בְּתוֹךְ הַלַּיְלָה
  choice: 半夜
  rationale: 此短语指夜间的中段；“半夜”是现代汉语中自然、准确的表达。
- source_word: מֵאֶצְלִי
  choice: 从我身边
  rationale: אֵצֶל 表示紧邻某人；“从我身边”符合母子同睡的语境，也保留了空间上的贴近。
- source_word: וַאֲמָתְךָ
  choice: 你的婢女
  rationale: 这是女子对王自称的谦卑宫廷用语；“你的婢女”既保留说话者的女性身份，也传达其恭敬语气。
- source_word: יְשֵׁנָה
  choice: 熟睡时
  rationale: 该形式描述当时持续的睡眠状态；语境表明她因睡着而未察觉换婴，“熟睡时”在汉语叙事中自然。
- source_word: וַתִּקַּח
  choice: 抱走
  rationale: 基本义是“拿、取”；宾语是婴儿，汉语通常说“抱走”，既自然又不改变动作的核心含义。
- source_word: וַתַּשְׁכִּיבֵהוּ / הִשְׁכִּיבָה
  choice: 放在
  rationale: שׁכב 的使役式意为使其躺下；在婴儿被调换位置的语境中，“放在”简洁自然，落点由“怀里”明确。
- source_word: בְּחֵיקָהּ / בְחֵיקִי
  choice: 在她怀里 / 在我怀里
  rationale: חֵיק 指胸前怀抱或膝上区域。“怀里”最能自然传达母婴贴身安放的情景，并在两个平行短语中保持一致。
- source_word: בְּנָהּ הַמֵּת
  choice: 她死去的儿子
  rationale: הַמֵּת 在此修饰“儿子”；“死去的儿子”是现代汉语中自然且准确的定语表达。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“你的婢女”保留女子在王前自谦的称谓；两个“怀里”形成原文中的刻意平行，清楚呈现婴儿被调换的动作。
