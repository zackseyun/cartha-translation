  yaml_path: translation/ot/1_kings/003/024.yaml
  text: Then the king said, “Bring me a sword.” So they brought the sword before the king.
translation:
  language: zh_hans
  text: 王说：“给我拿一把刀来。”他们就把刀拿到王面前。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 王说
  rationale: 叙事体中的连续式推进情节；现代汉语不必逐字译出连接词，后句的“就”已自然体现动作承接。
- source_word: הַמֶּלֶךְ
  choice: 王
  rationale: 定冠词加名词指上下文中的那位王；汉语在身份明确时通常直接说“王”，无需另加对应冠词。
- source_word: קְחוּ לִי
  choice: 给我拿……来
  rationale: לקח 的命令式字面义为“拿、取”，与 לִי 连用并结合说话者位置，语境义是叫人取来；“给我拿……来”自然保留了命令和趋向。
- source_word: חָרֶב
  choice: 一把刀
  rationale: 首次出现且无冠词，译出不定数量“一把”；חֶרֶב 可泛指刀剑类利器，此处用现代汉语常用的“刀”，避免把器物形制具体化为原文未明确限定的“剑”。
- source_word: וַיָּבִאוּ
  choice: 他们就把……拿到
  rationale: 复数动词的主语未明说，汉语补出泛指的“他们”；“就”体现奉命随即行动的叙事承接，“把……拿到”符合汉语表达。
- source_word: הַחֶרֶב
  choice: 刀
  rationale: 第二次出现带冠词，回指刚才所要的那把刀；汉语借上下文即可表达特指，不必重复“一把”。
- source_word: לִפְנֵי הַמֶּלֶךְ
  choice: 到王面前
  rationale: לִפְנֵי 在此表示带到王所在之处、进入王面前；“到王面前”简洁自然，并保留宫廷场景中的空间与临在含义。
