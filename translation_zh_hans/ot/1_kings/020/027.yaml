base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/027.yaml
  text: And the sons of Israel were mustered and supplied[a], and they went to meet them. The sons of Israel camped opposite them like two little flocks of goats[c][b], but Aram filled the land.
translation:
  language: zh_hans
  text: 以色列人被召集起来，也得到了补给[a]，就出去迎战亚兰人。他们在亚兰人对面安营，如同两小群山羊[b]；亚兰人却遍满那地。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “得到了补给”也可译作“得到了供养”或“预备妥当”。原词在这里很可能指军队获得出征所需的供应。
    reason: lexical_alternative
  - marker: b
    text: “两小群山羊”：原文用了一个罕见词，所指的具体形状或分群方式并不确定；这个比喻着重表现以色列军队人数很少，与遍满那地的亚兰军队形成对比。
    reason: textual_or_lexical_uncertainty
lexical_decisions:
- source_word: הָתְפָּקְדוּ
  choice: 被召集起来
  rationale: 此处 פקד 的 Hitpael 形式用于军事语境，指人员受点集、编组而备战；译为“被召集起来”自然清楚，也不局限于单纯计数。
- source_word: וְכָלְכְּלוּ
  choice: 得到了补给
  rationale: כלכל 在这里很可能指为出征供应物资或给养。“得到了补给”符合军事语境，并保留该动词可能涉及供养、保障的宽度。
- source_word: לִקְרָאתָם
  choice: 出去迎战亚兰人
  rationale: 该结构本义为“出去迎接他们”，在敌军相对的语境中含有迎敌之意；“迎战”以自然汉语表达此处的敌对相遇。为避免代词指向不明，译出“亚兰人”。
- source_word: נֶגְדָּם
  choice: 在亚兰人对面
  rationale: נגד 表示位于对面或面前；此处描写两军相对扎营，译为“在……对面”准确直观。
- source_word: כִּשְׁנֵי חֲשִׂפֵי עִזִּים
  choice: 像两小群山羊
  rationale: חֲשִׂפֵי 是罕见词，具体意象不完全确定，但整体比喻显出以色列军队分成两小簇，与亚兰大军形成鲜明对比。“两小群山羊”自然保留山羊意象与数量反差。
- source_word: וַאֲרָם מִלְאוּ אֶת־הָאָרֶץ
  choice: 亚兰人却遍布大地
  rationale: 原文按集合名词“亚兰”使用复数谓语，实际指亚兰军队。“遍布大地”自然呈现其人数众多、铺满地面的图景；“却”表达上下句本已明显的对比。
- source_word: בְנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 字面是“以色列之子”，在这里是全体以色列民的常用称谓。现代汉语“以色列人”清楚、庄重，且避免“以色列的儿子们”可能造成的误解。
