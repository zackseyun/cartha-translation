base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/035.yaml
  text: A certain man from the sons of the prophets said to his companion by the word of Yahweh[b][a], “Please strike me.” But the man refused to strike him.
translation:
  language: zh_hans
  text: 有一个先知门徒[a]，奉耶和华的话[b]对同伴说：“请打我。”那人却不肯打他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译“先知的众子之一”；这是指先知群体成员的惯用语，也可译作“先知团体中的一员”。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“照耶和华的话”或“照耶和华的命令”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ אֶחָד
  choice: 有一个人
  rationale: 该叙事表达引入某个未具名的人；现代汉语用“有一个”自然地传达此意，不另加原文没有的时间副词。结合后面的身份短语，正文顺畅表达为“有一个先知门徒”。
- source_word: מִבְּנֵי הַנְּבִיאִים
  choice: 先知门徒
  rationale: 字面为“先知的众子之一”，是指某个先知群体成员的惯用语。“先知门徒”在现代汉语中较易理解，但不把其组织形式说得过于确定；脚注保留字面表达及其他可能译法。
- source_word: רֵעֵהוּ
  choice: 同伴
  rationale: רֵעַ可指伙伴、同伴或朋友；“同伴”不额外暗示亲密友谊，也适合此处语境。
- source_word: בִּדְבַר יְהוָה
  choice: 奉耶和华的话
  rationale: 该短语可表示凭着耶和华所说的话或遵照他的命令。“奉……的话”保留先知受神话语授权的含义，同时以脚注说明较偏命令性的理解。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的专名“耶和华”呈现四字神名，而不以称号“主”取代。
- source_word: הַכֵּינִי נָא
  choice: 请打我
  rationale: נכה在此首先表示击打；下一节才明确伤害结果，因此不提前译作“打伤”。נָא由“请”表达。
- source_word: וַיְמָאֵן
  choice: 却不肯
  rationale: 表达明确拒绝而非仅仅犹豫；“却”自然体现叙事中的转折。
- source_word: לְהַכֹּתוֹ
  choice: 打他
  rationale: 与前面的命令保持词义一致，不提前加入“打伤”的结果。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 正文保留神的专名而非替换为“主”；“耶和华”是现代标准中文中最广为人知且庄重的形式，未改变原文的专名性质。
- issue: בְּנֵי הַנְּבִיאִים所指的身份
  choice: 先知门徒
  alternative: 先知的众子之一／先知团体中的一员
  rationale: 此惯用语很可能指先知群体中的成员，而非强调血缘关系；正文采用普通读者易懂的表达，脚注保留字面形式和群体含义，避免断定具体组织结构。
- issue: בִּדְבַר יְהוָה的力度
  choice: 奉耶和华的话
  alternative: 照耶和华的命令
  rationale: 原短语既可强调神的话语，也可在语境中具有命令效力。正文保留“话”的形式，脚注呈现“命令”的可能理解，不消除其张力。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。正文避免生硬照搬希伯来语亲属称谓，同时用脚注保留其字面形式；“打”而非“打伤”维持本节与下一节之间的叙事推进。
