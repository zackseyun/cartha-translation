base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/036.yaml
  text: Then he said to him, “Because you have not listened to the voice of the LORD, look, when you depart from me, the lion will strike you down.” And when he departed from him, the lion found him and struck him down.
translation:
  language: zh_hans
  text: 他对那人说：“你既不听从耶和华的话，看哪，你一离开我，狮子就会袭击你。”那人离开他以后，狮子遇见他，袭击了他。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׁמַעְתָּ בְּקוֹל יְהוָה
  choice: 听从耶和华的话
  rationale: 希伯来语“听……的声音”在此包含听从、顺服之意；译作“听从……的话”符合现代汉语习惯，也保留违命的语义。
- source_word: הִנְּךָ הוֹלֵךְ מֵאִתִּי
  choice: 看哪，你一离开我
  rationale: 保留הִנֵּה的提示、警告语气；用“一……就……”自然表达离开后审判随即临到的关系。
- source_word: וְהִכְּךָ / וַיַּכֵּהוּ
  choice: 袭击你／袭击了他
  rationale: נכה基本义为击打、打击，具体结果在本节没有明说。因施事者是狮子，“袭击”较自然，并避免擅自增添“打死”或“击杀”的结果。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文通行音译呈现原文中的神名四字母。
theological_decisions:
- issue: 狮子的击打是否明确表示死亡
  choice: 译为“袭击”，不明说死亡
  alternative: 译为“击杀”或“咬死”
  rationale: 原文两处均使用נכה，只明确陈述狮子击打了那人；译文不把可能的死亡结果提升为原文明说的内容。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“看哪”保留先知宣告中的警示语气；叙事后半用“果然”体现预言随即应验，但不增加具体伤亡程度。
