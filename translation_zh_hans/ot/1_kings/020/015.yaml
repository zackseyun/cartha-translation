  text: וַ/יִּפְקֹ֗ד אֶֽת נַעֲרֵי֙ שָׂרֵ֣י הַ/מְּדִינ֔וֹת וַ/יִּהְי֕וּ מָאתַ֖יִם שְׁנַ֣יִם וּ/שְׁלֹשִׁ֑ים וְ/אַחֲרֵי/הֶ֗ם פָּקַ֧ד אֶת כָּל הָ/עָ֛ם כָּל בְּנֵ֥י יִשְׂרָאֵ֖ל שִׁבְעַ֥ת אֲלָפִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/015.yaml
  text: So he mustered the young men of the provincial commanders[a], and they were two hundred and thirty-two; and after them he mustered all the people, all the sons of Israel, seven thousand.
translation:
  language: zh_hans
  text: 于是，他召集各省长官的年轻人，共二百三十二名；随后又召集全体民众，即所有以色列人[a]，共七千名。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“以色列的众子”，这是用阳性亲族称谓指以色列民众的表达。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְקֹד / פָּקַד
  choice: 召集
  rationale: 在军事动员的语境中，פקד指清点并组织人员待命；“召集”在现代汉语中自然地表达军事集结，同时不把意思缩窄为单纯数点。
- source_word: נַעֲרֵי
  choice: 年轻随从
  rationale: נַעַר既可指年轻人，也可指仆役或随从。这里这些人与各省长官相属，“年轻随从”兼顾年龄含义和职属关系，并保留原词本身的语义张力。
- source_word: שָׂרֵי הַמְּדִינוֹת
  choice: 各省长官
  rationale: שַׂר是首领或官长，מְדִינָה是行政区域；“各省长官”符合古代行政语境，也比“省级指挥官”更少添加原文未明说的军事职衔。
- source_word: מָאתַיִם שְׁנַיִם וּשְׁלֹשִׁים
  choice: 二百三十二人
  rationale: 按原文直译数目；补出量词“人”使现代汉语通顺。
- source_word: וְאַחֲרֵיהֶם
  choice: 随后
  rationale: 该短语表明第二批人的召集接在第一批之后；“随后”自然传达次序，不强行断定他们在行军队列中跟随。
- source_word: כָּל הָעָם
  choice: 全体民众
  rationale: 原文是“全体人民”，虽处军事语境，仍不改译为“全军”或“士兵”，以避免缩窄所指。
- source_word: כָּל בְּנֵי יִשְׂרָאֵל
  choice: 所有以色列人
  rationale: 希伯来语字面为“以色列的众子”，是指以色列群体的惯用亲族表达；正文译作现代汉语自然且涵盖全体的“所有以色列人”，字面形式在脚注说明。
- source_word: שִׁבְעַת אֲלָפִים
  choice: 七千人
  rationale: 准确表达原文数目，并补量词使汉语自然。
theological_decisions: []
