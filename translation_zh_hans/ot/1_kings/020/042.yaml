  text: וַ/יֹּ֣אמֶר אֵלָ֗י/ו כֹּ֚ה אָמַ֣ר יְהוָ֔ה יַ֛עַן שִׁלַּ֥חְתָּ אֶת אִישׁ חֶרְמִ֖/י מִ/יָּ֑ד וְ/הָיְתָ֤ה נַפְשְׁ/ךָ֙ תַּ֣חַת נַפְשׁ֔/וֹ וְ/עַמְּ/ךָ֖ תַּ֥חַת עַמּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/042.yaml
  text: 'And he said to him[a], “Thus says Yahweh: Because you have let go from your hand the man I had devoted to destruction, your life shall be for his life, and your people for his people.”'
translation:
  language: zh_hans
  text: 那人对他说：“耶和华如此说：‘因为你从手中放走了我已判定要毁灭的人[a]，所以你的命要代替他的命，你的百姓要代替他的百姓。’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“我所禁绝的人”。这里的希伯来语指在上帝审判之下被指定毁灭的人。
    reason: 说明חֵרֶם这一审判术语，并保留较贴近原文的另一译法。
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的专名译法，明确呈现以色列上帝的盟约之名。
- source_word: יַעַן
  choice: 因为
  rationale: 自然、简明地引出宣判的原因。
- source_word: שִׁלַּחְתָּ ... מִיָּד
  choice: 你从手中放走了
  rationale: “放走”准确表达释放之意，“从手中”保留希伯来语表示掌控或拘押的形象，不增添“逃脱”等原文未明说的情节。
- source_word: אִישׁ חֶרְמִי
  choice: 我已判定要毁灭的人
  rationale: חֵרֶם在此表示在上帝审判之下被指定毁灭；此译法避免“禁绝”等术语显得晦涩，同时保留神圣审判的力度及第一人称所属关系。
- source_word: נַפְשְׁךָ תַּחַת נַפְשׁוֹ
  choice: 你的命要代替他的命
  rationale: נֶפֶשׁ在此指生命；“代替”清楚表达תַּחַת所含的替代与对应惩罚之意。
- source_word: וְעַמְּךָ תַּחַת עַמּוֹ
  choice: 你的百姓要代替他的百姓
  rationale: 与前句保持平行，保留个人与群体相对应的审判结构。
- source_word: כֹּה אָמַר
  choice: 如此说
  rationale: 保留先知宣告中正式而庄重的使者公式。
theological_decisions:
- issue: 审判宣告中חֵרֶם术语的译法
  choice: 我已判定要毁灭的人
  alternative: 我所禁绝的人；我指定归于毁灭的人
  rationale: 该词表达上帝审判之下的毁灭性处置，而非单纯的个人敌意。“判定要毁灭”以通顺现代汉语传达此神学分量，同时脚注保留较贴近原文术语的译法。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“耶和华如此说”保留先知宣告的正式语气；其余措辞力求让普通读者无需专门术语背景也能理解。
