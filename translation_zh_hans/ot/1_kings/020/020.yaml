base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/020.yaml
  text: And each man struck down his man[a], and Aram fled, and Israel pursued them[b]. But Ben-hadad king of Aram escaped on a horse with horsemen.
translation:
  language: zh_hans
  text: 他们各自击倒迎面的敌人[a]。亚兰人逃跑，以色列人就追赶他们；但亚兰王便·哈达骑着马，和骑兵一起逃脱了[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“各人击倒他的人”，意思是各人击倒与自己交锋的对手。
    reason: lexical_alternative
  - marker: b
    text: 或译：“骑马同骑兵逃脱了。”原文可能是说便·哈达骑马逃走，并有骑兵随行。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכּוּ
  choice: 击倒
  rationale: נכה在战斗语境中表示猛烈击打并使对方败倒；“击倒”既符合军事场景，也不像“杀死”那样断定每个人都当场死亡。
- source_word: אִישׁ אִישׁוֹ
  choice: 各自……迎面的敌人
  rationale: 原文直译为“各人击打他的人”，指每名战士攻击与自己交锋的人；正文采用自然的现代汉语表达，并用脚注保留原文措辞。
- source_word: אֲרָם
  choice: 亚兰人
  rationale: 此处国名转指亚兰军队；译作“亚兰人”能自然表达复数动词所描写的逃跑者，同时保留古代名称“亚兰”，不改用后来的地理称呼。
- source_word: וַיָּנֻסוּ
  choice: 逃跑
  rationale: 该动词表示在战场上逃离；“逃跑”清楚、自然，不弱化为有秩序的“撤退”。
- source_word: וַיִּרְדְּפֵם
  choice: 追赶他们
  rationale: רדף在军事叙事中通常指追击或追赶；此处用“追赶”简明地传达动作。
- source_word: וַיִּמָּלֵט
  choice: 逃脱了
  rationale: 在战败逃亡的语境中，该词表示从危险中脱身；“逃脱”准确而不额外加入神学含义。
- source_word: בֶּן הֲדַד
  choice: 便·哈达
  rationale: 按现代汉语圣经人名音译惯例处理该专名，并以间隔号区分构词成分。
- source_word: עַל סוּס
  choice: 骑着马
  rationale: 原文为单数“在一匹马上”；汉语“骑着马”自然表达其骑乘状态，同时不把它泛化为抽象的交通方式。
- source_word: וּפָרָשִׁים
  choice: 和骑兵一起
  rationale: פָרָשִׁים指骑马的人。这里把连接词理解为伴随关系，即便·哈达骑马并由骑兵同行；脚注说明原文结构容许的另一种理解。
