base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/039.yaml
  text: As the king was passing by[a], he cried out to the king and said, “Your servant went out into the midst of the battle, and behold, a man turned aside and brought a man to me and said, ‘Guard this man. If he is ever missing, then your life shall be for his life[b], or you shall weigh out a talent of silver.’”
translation:
  language: zh_hans
  text: 王经过时，他向王高声呼喊，说：“仆人进入战场中央。这时，有一个人转到一旁，把另一个人带到我这里，对我说：‘看守这个人！他若真的不见了[a]，就要以你的命抵他的命[b]，或者你得称出一他连得银子[c]。’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文以不定式绝对形与限定动词连用加强语气，意为“若他果真不见了”或“若他的下落无从交代”。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“你的命代替他的命”，是表示以命抵命的法律性说法。
    reason: lexical_alternative
  - marker: c
    text: “他连得”是古代重量单位；这里指按重量称量的一大笔银子。其确切重量因时代和地区而异。
    reason: historical_context
lexical_decisions:
- source_word: עֹבֵר
  choice: 经过的时候
  rationale: 分词与 ויהי 连用，构成持续进行的背景动作；“经过的时候”自然表达王当时正从那里经过。
- source_word: צָעַק
  choice: 高声呼喊
  rationale: 该动词表示响亮而急切的呼求；此译保留声音和紧迫感，又不额外限定情绪。
- source_word: עַבְדְּךָ
  choice: 仆人
  rationale: 这是臣民在王面前自称的礼貌用语；译作“仆人”符合宫廷语境，比“奴隶”更准确自然。
- source_word: בְּקֶרֶב הַמִּלְחָמָה
  choice: 到战场中去
  rationale: 保留 קֶרֶב 所表达的身处战事之中的意思，同时避免生硬的逐词翻译。
- source_word: וְהִנֵּה
  choice: 忽然
  rationale: 该提示词使叙述转为眼前突现的情景；现代汉语用“忽然”自然传达这种叙事力度。
- source_word: אִישׁ סָר
  choice: 有一个人转到一旁
  rationale: סוּר 的基本义是转开、偏离；译文不擅自确定他是离开队伍、战线还是道路，保留原文的空间含混。
- source_word: וַיָּבֵא אֵלַי אִישׁ
  choice: 把另一个人带到我这里
  rationale: 第二个 אִישׁ 是“带来”的直接宾语；加“另一个”澄清原文涉及两个人，并未增加角色身份。
- source_word: שְׁמֹר
  choice: 看守
  rationale: 命令语气要求负责羁押并确保此人不逃失；“看守”切合军事拘押语境。
- source_word: אִם הִפָּקֵד יִפָּקֵד
  choice: 他若真的失踪了
  rationale: 尼法勒不定式绝对形与限定动词连用带有强调；“真的”表达强调，“失踪”保留未能找到或交代其下落的含义。
- source_word: נַפְשְׁךָ תַּחַת נַפְשׁוֹ
  choice: 以你的命抵他的命
  rationale: נֶפֶשׁ 在这里指性命，תַּחַת 表示替代；此译保留简洁的法律性抵偿公式。
- source_word: כִּכַּר כֶּסֶף
  choice: 一他连得银子
  rationale: כִּכַּר 是古代重量单位，采用中文圣经语境中较通行的音译，并用脚注说明其性质。
- source_word: תִּשְׁקוֹל
  choice: 称出
  rationale: 原文具体指按重量称量银子，而不只是笼统“付款”；“称出”保留古代以银重支付的图景。
theological_decisions:
- issue: 以命抵命的法律性表达
  choice: 以你的命抵他的命
  alternative: 你要替他偿命
  rationale: 前者更贴近原文对称结构，也不进一步解释这是正式处决、代罚还是一般性命偿还，从而保留叙事中的法律张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。王前自称保留为“仆人”；引语中的命令和惩罚简洁有力。对“一人转到一旁”的具体方向及原因不作补充，以保存希伯来文的含混；重量单位保留音译并以脚注解释。
