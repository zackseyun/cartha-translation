base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/016.yaml
  text: They went out at noon[a], while Ben-hadad was drinking himself drunk in the booths, he and the thirty-two kings who were helping him.
translation:
  language: zh_hans
  text: 他们中午出来的时候，便·哈达和那三十二个帮助他的王正在棚子[a]里喝着，已经醉了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“遮蔽处”或“帐棚”。希伯来语直译为“棚子”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצְאוּ
  choice: 他们出城
  rationale: יצא在此推进叙事，结合军事语境指从城中出去；译为“出城”自然明确，又不增添“突袭”等原文没有的色彩。
- source_word: בַּצָּהֳרָיִם
  choice: 中午
  rationale: 该词指一天的正午时分；“中午”是现代汉语中准确自然的表达。
- source_word: וּבֶן הֲדַד
  choice: ……时，便·哈达
  rationale: 连接词在这里引出与“他们出城”同时发生的背景情形，故用“……时”表达周围性关系，而非机械译作“并且”。
- source_word: שֹׁתֶה שִׁכּוֹר
  choice: 正在……喝得酩酊大醉
  rationale: 分词שֹׁתֶה表示持续进行的饮用动作，שִׁכּוֹר说明醉酒状态；这一译法同时保留过程和结果，也不擅自补出具体饮品。
- source_word: בַּסֻּכּוֹת
  choice: 在棚子里
  rationale: סֻכּוֹת的基本义是临时搭建的棚子或遮蔽处。“棚子”保留具体意象；脚注列出语境中也可能采用的较雅化表达。
- source_word: הוּא וְהַמְּלָכִים
  choice: 便·哈达和……王
  rationale: 原文明确把便·哈达与诸王并列；汉语直接重提其名，比照搬代词“他和”更清楚自然。
- source_word: שְׁלֹשִׁים וּשְׁנַיִם מֶלֶךְ
  choice: 那三十二个……王
  rationale: 希伯来语在较大数词后使用单数形式的名词是正常句法；汉语按习惯译作“三十二个王”。定指冠词用“那”体现。
- source_word: עֹזֵר אֹתוֹ
  choice: 帮助他的
  rationale: עזר表示给予帮助或支援；作定语修饰诸王，译为“帮助他的”简洁并保留持续协助的含义。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事体。“便·哈达”按希伯来语人名音译。脚注标记置于其实际说明的“棚子”之后；英文咨询层将标记置于“中午”后显然与脚注内容不符，因此未照搬其位置。
