  text: Then he found another man and said[a], “Please strike me.” So the man struck him and wounded him.
translation:
  language: zh_hans
  text: 于是他找到另一个人，对他说：“请打我吧。”那人就打他，把他打伤了。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
