- from: 于是他又遇见一个人，对他说：“请打我吧。”那人就把他打伤了。[a]
  to: 于是他找到另一个人，对他说：“请打我吧。”那人就打他，把他打伤了。[a]
  rationale: 将“又遇见一个人”改为“找到另一个人”，以更准确对应 וַיִּמְצָא אִישׁ אַחֵר，且避免把“又”当作原文的明示成分。末句改为“打他，把他打伤了”，使正文清楚表达打击及其伤害结果；脚注继续保留希伯来文重复“打”的强调特色。
