  text: 'These went out from the city: the young men of the commanders of the provinces[a], and the army that was behind them.'
translation:
  language: zh_hans
  text: 这些人从城里出来：各省长官的青年人[a]，以及跟在他们后面的军队。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“各省长官的随从”或“各省长官的仆役”。希伯来语 נַעֲרֵי 可指青年人，也可指仆人或贴身侍从。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: 这些人
  rationale: 复数指示语回指上一节刚刚数点的那一队人；中文用“这些人”即可自然承接上下文，不必机械译出句首连接词。
- source_word: יָצְאוּ מִן הָעִיר
  choice: 从城里出去
  rationale: 直接表达离开城市这一动作和起点，不额外加入“列队”或“出征”等原文未明说的军事细节。
- source_word: נַעֲרֵי
  choice: 年轻侍从
  rationale: נַעַר既可指年轻人，也可指仆人或侍从；结合这些人与省长官的从属关系，“年轻侍从”在正文中兼顾年龄和职分，而脚注保留单译“年轻人”或“仆役”的可能。
- source_word: שָׂרֵי הַמְּדִינוֹת
  choice: 各省长官
  rationale: שַׂר可指首领、官长或统帅，מְדִינוֹת指行政区域；此处译作“各省长官”符合希伯来语属格结构，也与本章上下文中的行政兼军事角色相称。
- source_word: וְהַחַיִל
  choice: 以及……军队
  rationale: חַיִל在此指随后的作战兵力；“军队”清楚自然。用“以及”连接两个出城的群体，避免中文误读。
- source_word: אֲשֶׁר אַחֲרֵיהֶם
  choice: 跟在他们后面的
  rationale: 既保留空间上的“在后面”，也自然表达行进中的跟随关系。
theological_decisions: []
