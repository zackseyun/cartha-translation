  text: So the prophet went and stood by the road for the king[a], and disguised himself with a bandage over his eyes.
translation:
  language: zh_hans
  text: 于是，那先知去了，站在路旁等候王；他把灰敷在眼睛上，乔装起来[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “灰”所译的希伯来语通常意为“灰”。由于下文说他从眼睛上除去这物，本句也可能指为乔装而覆在眼睛上的遮布或绷带。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: 于是……去
  rationale: 连续式叙事动词推进情节；“于是”自然表达事件的承接关系。
- source_word: הַנָּבִיא
  choice: 那先知
  rationale: 保留定冠词，并在现代汉语叙事中自然指回上文已经出现的先知。
- source_word: וַיַּעֲמֹד
  choice: 站
  rationale: 采用基本义，不额外引入“埋伏”或“拦截”等原文未明说的含义。
- source_word: לַמֶּלֶךְ
  choice: 等候王
  rationale: 介词短语在语境中表示先知站在王将经过之处；译出隐含目的，使汉语通顺，同时不把它解释成觐见王。
- source_word: עַל הַדָּרֶךְ
  choice: 在路旁
  rationale: 符合先知等候王经过的场景；“旁”比生硬的“在路上”更自然。
- source_word: וַיִּתְחַפֵּשׂ
  choice: 乔装起来
  rationale: 该反身形式在此指改变外表，使人不能认出自己。
- source_word: בָּאֲפֵר
  choice: 用遮布
  rationale: אֲפֵר通常可理解为“灰”，但本节及20:41的“从眼睛上除去”也支持眼部遮盖物或绷带之义。正文采用符合乔装场景的“遮布”，脚注保留“灰”的真实词义可能性。
- source_word: עַל עֵינָיו
  choice: 蒙住眼睛
  rationale: 自然表达物件覆在眼睛上的意思；未扩展为笼统的“遮住脸”。
