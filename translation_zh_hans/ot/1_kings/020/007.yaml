revisions:
- from: 以色列王召来国中所有的长老，对他们说：“请你们明白，看清楚，这个人图谋的是祸患[a]。他先前派人来索要我的妻子、儿子、银子和金子，我都没有拒绝给他。”
  to: 以色列王召来国中所有的长老，对他们说：“请你们留意，看清楚，这人是在图谋恶事[a]。他派人来向我要我的妻子、儿子、银子和金子，我也没有拒绝给他。”
  rationale: 修订“祸患”的正文表达，使其不再误示为便哈达计划一场灾难，而准确呈现以色列王对其敌对企图的指控；脚注保留该词的语义范围。其余仅作不增添时间信息的轻微措辞调整。
  reviewer_model: gpt-5.6-terra
