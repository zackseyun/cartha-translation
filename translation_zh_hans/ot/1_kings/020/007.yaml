  text: וַ/יִּקְרָ֤א מֶֽלֶךְ יִשְׂרָאֵל֙ לְ/כָל זִקְנֵ֣י הָ/אָ֔רֶץ וַ/יֹּ֨אמֶר֙ דְּעֽוּ נָ֣א וּ/רְא֔וּ כִּ֥י רָעָ֖ה זֶ֣ה מְבַקֵּ֑שׁ כִּֽי שָׁלַ֨ח אֵלַ֜/י לְ/נָשַׁ֤/י וּ/לְ/בָנַ/י֙ וּ/לְ/כַסְפִּ֣/י וְ/לִ/זְהָבִ֔/י וְ/לֹ֥א מָנַ֖עְתִּי מִמֶּֽ/נּוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/007.yaml
  text: Then the king of Israel called all the elders of the land and said, “Please know and see that this man is seeking trouble, for he sent to me for my wives, my sons, my silver, and my gold, and I did not withhold them from him.”
translation:
  language: zh_hans
  text: 以色列王召来国中所有的长老，对他们说：“请你们留意，看清楚，这人是在图谋恶事[a]。他派人来向我要我的妻子、儿子、银子和金子，我也没有拒绝给他。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “恶事”也可指伤害、祸患或麻烦。
    reason: 希伯来词 רָעָה 可含邪恶、伤害、灾祸或麻烦等意思；本句的具体所指不宜过度限定。
lexical_decisions:
- source_word: זִקְנֵי הָאָרֶץ
  choice: 国中所有的长老
  rationale: “地／国土的长老”在此指以色列境内代表民众的长老；译作“国中”符合现代汉语政治语境，又不扩大其职分。
- source_word: רָעָה זֶה מְבַקֵּשׁ
  choice: 这个人图谋的是祸患
  rationale: 保留 רָעָה 可指邪恶、祸害或灾祸的语义张力；“图谋”体现 מְבַקֵּשׁ 所表达的有意追求，且不把句意收窄为单纯“找麻烦”。
- source_word: שָׁלַח אֵלַי לְנָשַׁי
  choice: 派人来索要我的妻子
  rationale: “派人到我这里，为着我的妻子”按上下文指派使者索取；补出“人”和“索要”使现代汉语清楚自然。
- source_word: וְלֹא מָנַעְתִּי מִמֶּנּוּ
  choice: 我都没有拒绝给他
  rationale: 原文直译为“我没有从他那里扣留”；这里是说王未拒绝对方此前的索求。“都”概括前列各项。
theological_decisions:
- issue: רָעָה 的道德与灾祸含义
  choice: 祸患
  alternative: 邪恶；麻烦；加害
  rationale: “祸患”既可指恶意所造成的伤害，也可指将临的灾难，避免断定该词只是在评价便哈达的道德，或只表示一般性的麻烦。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“请你们明白，看清楚”保留原文两个并列命令及语气词 נָא；后句用“先前”交代 כִּי 在此引出判断依据，避免连续两个“因为”造成生硬。
