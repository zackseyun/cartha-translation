id: 1KI.20.29
reference: 1 Kings 20:29
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַֽ/יַּחֲנ֧וּ אֵ֦לֶּה נֹ֥כַח אֵ֖לֶּה שִׁבְעַ֣ת יָמִ֑ים וַ/יְהִ֣י בַּ/יּ֣וֹם הַ/שְּׁבִיעִ֗י וַ/תִּקְרַב֙ הַ/מִּלְחָמָ֔ה וַ/יַּכּ֨וּ בְנֵֽי יִשְׂרָאֵ֧ל אֶת אֲרָ֛ם מֵאָה אֶ֥לֶף רַגְלִ֖י בְּ/י֥וֹם אֶחָֽד׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/029.yaml
  text: And these camped opposite those for seven days[a]. Then on the seventh day the battle drew near[c][b], and the sons of Israel struck down Aram—one hundred thousand foot soldiers in one day.
translation:
  language: zh_hans
  text: 双方相对扎营七天。第七天，双方交战；以色列人[a]在一天之内击杀了亚兰[b]步兵[c]十万人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“以色列的众子”。
    reason: 说明原文的字面群体称谓。
  - marker: b
    text: “亚兰”在这里也可理解为“亚兰人”或亚兰军队。
    reason: 说明专名在上下文中可兼指国家、人民或军队。
  - marker: c
    text: “步兵”原文指徒步作战的人。
    reason: 说明军事用语的字面含义。
lexical_decisions:
- source_word: וַיַּחֲנוּ אֵלֶּה נֹכַח אֵלֶּה
  choice: 双方相对扎营
  rationale: 保留原文“这些与那些相对”的简练对照，同时用现代汉语“双方”清楚指向两军；“扎营”准确表达 חנה。
- source_word: שִׁבְעַת יָמִים
  choice: 七天
  rationale: 汉语以时间补语自然表达持续时段，不必另加“达”。
- source_word: וַיְהִי בַּיּוֹם הַשְּׁבִיעִי
  choice: 第七天
  rationale: 将希伯来叙事承接公式简洁处理，保留明确的时间推进。
- source_word: וַתִּקְרַב הַמִּלְחָמָה
  choice: 双方交战
  rationale: קרב 本义为“临近”，此处结合“战事”表示两军接战；“双方交战”在现代汉语中自然，也避免让读者误以为战斗尚未开始。
- source_word: וַיַּכּוּ
  choice: 击杀了
  rationale: נכה 在战争语境中表示击打、击倒，常含致死结果；“击杀”保留军事行动的力度，并符合此处大量步兵伤亡的语境。
- source_word: בְנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 原文直译为“以色列的众子”；现代汉语用“以色列人”自然表达这一民族与军队群体，脚注保留字面信息。
- source_word: אֲרָם
  choice: 亚兰
  rationale: 保留希伯来专名，不以后世地缘名称“叙利亚”替代；此处按语境可指亚兰人或亚兰军队。
- source_word: מֵאָה אֶלֶף רַגְלִי
  choice: 步兵十万人
  rationale: רַגְלִי 指徒步作战的士兵；“步兵”简明准确，数字按现代汉语习惯置于名词之后组成“步兵十万人”。
- source_word: בְּיוֹם אֶחָד
  choice: 在一天之内
  rationale: 清楚表达全部战果发生在单日这一时限内。
theological_decisions:
- issue: בְנֵי יִשְׂרָאֵל 的性别与群体表达
  choice: 以色列人
  alternative: 以色列的众子
  rationale: 原文采用阳性复数惯用称谓，语境指以色列作战群体。正文使用自然的现代汉语群体名称，不额外推断个体构成；脚注说明其字面形式。
- issue: אֲרָם 是专名还是族群称谓
  choice: 亚兰
  alternative: 亚兰人
  rationale: 正文保留原文专名及其可能兼指国家、人民的张力，不改用后世名称；脚注说明此处可按语境理解为亚兰人或亚兰军队。
- issue: נכה 是否明确表示杀死
  choice: 击杀了
  alternative: 击败了／击倒了
  rationale: 该动词本身语义较宽，但在此战争叙事中以十万步兵为直接宾语，致死含义很强；“击杀”既体现语境，又保留“击”的动作色彩。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。叙事按原文顺序推进，避免古奥的“于是到了第七日”一类表达；以分号连接接战与战果，使节奏清楚。所有脚注标记均紧随所注词语。
