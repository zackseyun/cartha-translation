source:
  edition: WLC
  text: כִּ֣י אִם כָּ/עֵ֣ת מָחָ֗ר אֶשְׁלַ֤ח אֶת עֲבָדַ/י֙ אֵלֶ֔י/ךָ וְ/חִפְּשׂוּ֙ אֶת בֵּ֣יתְ/ךָ֔ וְ/אֵ֖ת בָּתֵּ֣י עֲבָדֶ֑י/ךָ וְ/הָיָה֙ כָּל מַחְמַ֣ד עֵינֶ֔י/ךָ יָשִׂ֥ימוּ בְ/יָדָ֖/ם וְ/לָקָֽחוּ׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/006.yaml
  text: No[a], but about this time tomorrow I will send my servants to you, and they will search your house and the houses of your servants; and whatever is desirable in your eyes[b], they will put into their hands and take away.
translation:
  language: zh_hans
  text: 不！明天大约这个时候，我会派臣仆到你那里，搜查你的宫室和你臣仆的房屋；凡你眼中珍贵的东西[a]，他们都要拿到手里，带走[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“凡你眼中所喜爱的东西”，即你十分看重的一切。
    reason: lexical_alternative
  - marker: b
    text: 希伯来语直译为“放在他们手中，取走”，意思是拿到手并带走。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: 不！
  rationale: 结合上文，这是对先前有限要求的否定并进一步加码威胁；用独立的“不！”自然表达强烈的纠正语气。
- source_word: כָּעֵת מָחָר
  choice: 明天大约这个时候
  rationale: 保留时间表达的近似意味，也符合现代汉语习惯。
- source_word: עֲבָדַי
  choice: 臣仆
  rationale: 此处指亚兰王派出的属员或使者；“臣仆”既体现君王语境，又不突出奴隶身份。
- source_word: וְחִפְּשׂוּ
  choice: 搜查
  rationale: 该动词表示彻底查找；“搜查”适合奉王命进入宫室和房屋查取财物的情境，但不额外加入暴力程度。
- source_word: בֵּיתְךָ ... בָּתֵּי עֲבָדֶיךָ
  choice: 你的宫室和你臣仆的房屋
  rationale: 第一个“בית”在对君王说话的语境中可指宫室，第二个则是臣仆的房屋；这样译能自然呈现语境中的所指。
- source_word: כָּל מַחְמַד עֵינֶיךָ
  choice: 凡你眼中珍贵的东西
  rationale: 保留“眼中”的希伯来语意象，同时用“珍贵”表达所喜爱、看重之物，不将范围窄化为某类财物。
- source_word: יָשִׂימוּ בְיָדָם
  choice: 他们都要拿到手里
  rationale: 贴近字面“放在他们手中”，在现代汉语中以“拿到手里”自然表达取得并控制。
- source_word: וְלָקָחוּ
  choice: 带走
  rationale: 在上下文中表示将搜出的贵重物品取走；“带走”清楚表达移走和掠取的结果。
theological_decisions: []
