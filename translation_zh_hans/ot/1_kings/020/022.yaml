base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/022.yaml
  text: Then the prophet came near to the king of Israel and said to him[a], “Go, strengthen yourself, and know and see what you should do[c][b], because at the turn of the year the king of Aram will come up against you.”
translation:
  language: zh_hans
  text: 先知走近以色列王，对他说：“你当自强，要弄清楚、看明白该做什么[b]，因为到一年回转的时候[a]，亚兰[c]王必上来攻打你。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“一年回转之时”，常指军队重新出征的季节；有些译本意译为“明年春天”。
    reason: cultural_note
  - marker: b
    text: 或译：“将做什么。”希伯来文采用将来形式，但这里很可能是要王筹划自己应当采取的行动。
    reason: lexical_alternative
  - marker: c
    text: 传统译作“叙利亚”；希伯来文为“亚兰”。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּגַּשׁ
  choice: 走近
  rationale: 保留 נגשׁ 表示接近、走上前去的具体动作，也符合现代汉语叙事。
- source_word: הִתְחַזַּק
  choice: 坚固自己
  rationale: 保留 Hitpael 命令式的反身意味，并传达为下一次战争加强自身、做好准备的含义。
- source_word: וְדַע וּרְאֵה
  choice: 要弄清楚、看明白
  rationale: 分别体现“知道”和“看”的并列结构，同时避免生硬的“知道并看”。
- source_word: אֵת אֲשֶׁר תַּעֲשֶׂה
  choice: 自己该做什么
  rationale: 希伯来文形式直译为“你将做什么”，但在劝告和备战语境中具有实际筹划、应当采取行动的意味；脚注保留另一可能。
- source_word: לִתְשׁוּבַת הַשָּׁנָה
  choice: 到岁首
  rationale: 简洁保留一年循环、回转之时的习语意象；脚注说明其常指重新出征的季节，避免直接限定为“明年春天”。
- source_word: מֶלֶךְ אֲרָם
  choice: 亚兰王
  rationale: 直接反映希伯来地名 אֲרָם，不以较晚的地理名称“叙利亚”替换。
- source_word: עֹלֶה עָלֶיךָ
  choice: 必上来攻打你
  rationale: 军事语境中的 עלה על 指向某人进军、攻击；“上来攻打”保留动词意象，“必”表达分词在预告中的确定将来意义。
