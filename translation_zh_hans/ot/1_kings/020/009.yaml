  text: וַ/יֹּ֜אמֶר לְ/מַלְאֲכֵ֣י בֶן הֲדַ֗ד אִמְר֞וּ לַֽ/אדֹנִ֤/י הַ/מֶּ֨לֶךְ֙ כֹּל֩ אֲשֶׁר שָׁלַ֨חְתָּ אֶל עַבְדְּ/ךָ֤ בָ/רִֽאשֹׁנָה֙ אֶעֱשֶׂ֔ה וְ/הַ/דָּבָ֣ר הַ/זֶּ֔ה לֹ֥א אוּכַ֖ל לַ/עֲשׂ֑וֹת וַ/יֵּֽלְכוּ֙ הַ/מַּלְאָכִ֔ים וַ/יְשִׁבֻ֖/הוּ דָּבָֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/009.yaml
  text: So he said to the messengers of Ben-hadad[a], “Say to my lord the king, ‘All that you sent to your servant the first time, I will do; but this thing I cannot do.’” And the messengers went and brought back word to him.
translation:
  language: zh_hans
  text: 于是，他对便哈达的使者说：“你们要告诉我主我王：‘你先前传给仆人的一切，我都照办；但这件事[a]，我不能做。’”使者就回去，把答复带给他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “这件事”也可译作“这事”或“这项要求”。希伯来语“דָּבָר”可依上下文表示“事”“事情”或“话/信息”；此处也可按语境理解为一项要求。
    reason: 保留דָּבָר的宽泛词义，并说明“要求”是基于上下文的理解。
lexical_decisions:
- source_word: מַלְאֲכֵי
  choice: 使者
  rationale: 这里指奉王命传话的人员，并非超自然存在；“使者”既准确又符合外交语境。
- source_word: בֶן הֲדַד
  choice: 便哈达
  rationale: 采用现代中文圣经语境中通行的人名音译。
- source_word: לַאדֹנִי הַמֶּלֶךְ
  choice: 我主我王
  rationale: 保留原文恭敬而臣服的宫廷称谓，不使“主”带上神性含义。
- source_word: כֹּל אֲשֶׁר שָׁלַחְתָּ אֶל עַבְדְּךָ בָרִאשֹׁנָה
  choice: 你头一次差人向仆人提出的一切
  rationale: “差人……提出”自然表达原文“送到/传给”的外交信息语境；“头一次”明确指先前那一轮传话。
- source_word: עַבְדְּךָ
  choice: 仆人
  rationale: 这是君王外交辞令中的自谦称呼；译作“仆人”可保留臣服语气，而不将其过度具体化为奴隶身份。
- source_word: אֶעֱשֶׂה
  choice: 我都愿意照办
  rationale: 在回应对方要求的语境中，“照办”比机械的“做”更自然；“愿意”体现此处承诺执行的语用力量。
- source_word: וְהַדָּבָר הַזֶּה
  choice: 但这件事
  rationale: דָּבָר 在此指后来追加的要求；“这件事”保留其宽泛性，不直接解释成“这个要求”。
- source_word: לֹא אוּכַל לַעֲשׂוֹת
  choice: 我不能做
  rationale: 直接保留原文表达的不能或无力实行，不进一步断定是能力不足、道德拒绝还是政治上无法接受。
- source_word: וַיְשִׁבֻהוּ דָּבָר
  choice: 把这话回复他
  rationale: 按希伯来语习语表达使者把答复带回给便哈达；“这话”自然呈现 דָּבָר 在此处“话语/答复”的意义。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“我主我王”“仆人”保留古代外交辞令的等级与恭敬语气；其余措辞避免不必要的古奥表达。脚注标记置于“这件事”之后，因为脚注解释的是 דָּבָר，而不是人名“便哈达”。
