  text: And he sent messengers into the city[a], to Ahab king of Israel.
translation:
  language: zh_hans
  text: 他派使者进城[a]，去见以色列王亚哈。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“往那城去。”希伯来语“城”一词带有表示趋向的词尾，表明行动朝向那城；这不一定特别强调进入城内。
    reason: 保留趋向词尾究竟侧重进入城内还是前往该城的细微歧义。
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: 他派
  rationale: 该叙事性动词形式推动情节向前；现代汉语以“派”自然表达差遣使者之意，主语由上文承接。
- source_word: מַלְאָכִים
  choice: 使者
  rationale: 政治、军事语境表明所指是奉命传话的人，而非天使；“使者”准确且庄重。
- source_word: אֶל
  choice: 到……那里
  rationale: 介词标明使者受差遣所去见的对象；“到……那里”在汉语中清楚表达目的对象。
- source_word: אַחְאָב
  choice: 亚哈
  rationale: 采用现代中文圣经传统中通行的人名音译。
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: 以色列王
  rationale: 希伯来语组合结构说明亚哈的王室身份；“以色列王亚哈”是自然简洁的中文同位表达。
- source_word: הָעִירָה
  choice: 进城
  rationale: 名词带有表示趋向的词尾，说明朝城里移动；“进城”自然传达进入城中的方向感，同时以脚注保留也可理解为仅强调朝城而去。
theological_decisions: []
translation_notes:
  register: 采用现代、简洁而庄重的叙事语言。按希伯来语语序关系，先交代使者进城，再说明他们去见以色列王亚哈；脚注明示趋向表达的可译范围。
