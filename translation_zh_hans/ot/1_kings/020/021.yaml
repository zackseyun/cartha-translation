base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/021.yaml
  text: Then the king of Israel went out and struck the horses and the chariots[a], and inflicted a great blow on Aram.
translation:
  language: zh_hans
  text: 于是，以色列王出战，攻击战马和战车[a]，重创了亚兰。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “战马和战车”原文为集合性用法，可指骑兵和战车部队。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: 出战
  rationale: 基本义为“出去”；在军事叙事中译作“出战”自然明白，又不额外限定具体阵形或行动方式。
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: 以色列王
  rationale: 按现代汉语习惯表达这一身份明确的领属结构。
- source_word: וַיַּךְ
  choice: 击杀
  rationale: נכה可指击打、杀伤或击败；此处宾语涉及战马和战车部队，“击杀”体现战斗中的杀伤，但不将全句直接解释为彻底歼灭。
- source_word: הַסּוּס
  choice: 战马
  rationale: 原文虽为单数形式，但在军事语境中作集合名词，指马匹；“战马”比单纯“马”更清楚地呈现语境。
- source_word: הָרָכֶב
  choice: 战车兵
  rationale: רכב在军事叙事中可集合性地指战车或战车部队。由于“击杀战车”在汉语中不自然，正文采用“战车兵”，并以脚注保留形式上译作“战车”的可能。
- source_word: וְהִכָּה
  choice: 重创
  rationale: 该动词与מַכָּה构成同根表达；汉语用“重创”简洁再现“施以重大打击”的意思。
- source_word: בַאֲרָם
  choice: 亚兰
  rationale: 保留希伯来专名“亚兰”，不采用传统但容易产生时代错置的“叙利亚”；此处可指国家或其军队。
- source_word: מַכָּה גְדוֹלָה
  choice: 重创
  rationale: 原意为“重大的一击”。“重创”保留严重打击之意，同时不擅自具体化为“大屠杀”或“彻底击败”。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“于是”承接前文事件；“出战—击杀—重创”保持原文紧凑的军事叙事节奏。正文保留“亚兰”这一历史专名。
