  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יִּגַּ֞שׁ אִ֣ישׁ הָ/אֱלֹהִ֗ים וַ/יֹּאמֶר֮ אֶל מֶ֣לֶךְ יִשְׂרָאֵל֒ וַ/יֹּ֜אמֶר כֹּֽה אָמַ֣ר יְהוָ֗ה יַ֠עַן אֲשֶׁ֨ר אָמְר֤וּ אֲרָם֙ אֱלֹהֵ֤י הָרִים֙ יְהוָ֔ה וְ/לֹֽא אֱלֹהֵ֥י עֲמָקִ֖ים ה֑וּא וְ֠/נָתַתִּי אֶת כָּל הֶ/הָמ֨וֹן הַ/גָּ֤דוֹל הַ/זֶּה֙ בְּ/יָדֶ֔/ךָ וִֽ/ידַעְתֶּ֖ם כִּֽי אֲנִ֥י יְהוָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/028.yaml
  text: 'Then the man of God came near and said to the king of Israel[a], “Thus says Yahweh: Because Aram has said, ‘Yahweh is a god of the mountains, but he is not a god of the valleys,’ I will give all this great multitude into your hand[c][b], and you shall know that I am Yahweh.”'
translation:
  language: zh_hans
  text: 神人走近以色列王[a]，对他说：“耶和华如此说：‘因为亚兰人说，耶和华是山地的神，不是谷地的神，所以我要把这一大群人全都交在你手中；你们就知道我是耶和华。’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “你们就知道”中的“你们”在希伯来原文中是复数，所指超出以色列王本人，扩及以色列众人。
    reason: 说明原文从对王使用的单数称呼转为复数称呼。
lexical_decisions:
- source_word: אִישׁ הָאֱלֹהִים
  choice: 神人
  rationale: 这是希伯来圣经中对先知性人物的固定称谓；“神人”简洁、庄重，也符合中文圣经传统。
- source_word: וַיִּגַּשׁ
  choice: 走近
  rationale: 直接表达 נגשׁ 的趋近动作，不额外推断其姿态或目的。
- source_word: כֹּה אָמַר יְהוָה
  choice: 耶和华如此说
  rationale: 保留标准的先知使者宣告公式，同时以“耶和华”呈现神的专名。
- source_word: אֲרָם
  choice: 亚兰人
  rationale: 此处动词“说”为复数，指亚兰一方的人；译作“亚兰人”比单纯国名更自然地对应复数主语，也不采用后世地名“叙利亚”。
- source_word: אֱלֹהֵי הָרִים ... וְלֹא אֱלֹהֵי עֲמָקִים
  choice: 山地的神，不是谷地的神
  rationale: “山地／谷地”保留地势对照；中文“……的神”本身可表达亚兰人把耶和华视为受地域限制之神的错误观念，无须添加原文没有的不定冠词。
- source_word: כָּל הֶהָמוֹן הַגָּדוֹל הַזֶּה
  choice: 这一大群人全都
  rationale: הָמוֹן 表示人数众多的群体；上下文虽是军队，但译为“大群人”保留其词义宽度。
- source_word: בְּיָדֶךָ
  choice: 交在你手中
  rationale: 保留希伯来语“交在手中”的胜败与控制权意象，在现代中文中也自然可懂。
- source_word: וִידַעְתֶּם
  choice: 你们就知道
  rationale: 动词是第二人称阳性复数；虽由神人向王传话，结果所指扩及以色列众人。
- source_word: כִּי אֲנִי יְהוָה
  choice: 我是耶和华
  rationale: 直接保留神以其专名自我启示的宣告。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: “耶和华”是现代中文读者最普遍识别的圣经神名形式，并明确作为专名而非用“主”替代；“雅威”更接近学术界常见拟音，但在普通中文经文中较不通行。
- issue: 亚兰人是否把耶和华视为地域性神明
  choice: 山地的神，不是谷地的神
  alternative: 只管山地的神，不管谷地的神
  rationale: 原文的名词性判断确实体现地域限制观念，但没有明说“管”；正文保留原有表达及其神学张力，不作解释性扩写。
- issue: וִידַעְתֶּם 的复数对象
  choice: 你们就知道
  alternative: 你就知道
  rationale: 马所拉文本明确使用复数，表明认识耶和华的不只是受话的王，也包括以色列群体；不将其静默改为单数。
translation_notes:
  register: 采用现代、庄重而易懂的叙事与先知宣告语体。正文保留“交在你手中”等清晰的希伯来意象；避免把 הָמוֹן 过度限定为“军队”，也避免替亚兰人的错误神观添加原文未明说的解释。脚注标记置于“以色列王”之后，提示本句随后出现的数变化。
