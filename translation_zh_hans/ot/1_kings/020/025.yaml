base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/025.yaml
  text: And you, muster for yourself an army like the army that fell from you, and horse for horse and chariot for chariot; then let us fight against them on the plain. Surely we will be stronger than they are.” So he listened to their voice and did so.
translation:
  language: zh_hans
  text: 你要为自己重新编组一支军队，规模要与从你那里损失的军队相同；马匹按原数补齐，战车也按原数补齐。然后我们到平原上与他们交战；我们必定会比他们强。”王听从了他们的话，就这样做了。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תִמְנֶה לְךָ חַיִל
  choice: 为自己招募一支军队
  rationale: תמנה 有“数点、委任、征集”之意；在战败后重建军力的语境中，“招募”比直译“数点”更自然，也与军队这一宾语相配。
- source_word: כַחַיִל הַנֹּפֵל מֵאוֹתָךְ
  choice: 照着从你那里损失的军队
  rationale: נפל 字面为“倒下”，此处指先前覆灭或损失的军队；保留“从你那里”所表达的损失关系，同时采用现代汉语自然说法。
- source_word: וְסוּס כַּסּוּס וְרֶכֶב כָּרֶכֶב
  choice: 马匹照数补足，战车也照数补足
  rationale: 希伯来文是简练的“马对马、战车对战车”，意思是按原有数量或规模逐一补充；译文明确其语境功能，避免生硬。
- source_word: בַּמִּישׁוֹר
  choice: 到平原上
  rationale: מישור 在此指平坦开阔之地，与上文亚兰臣仆认为以色列的神是山神的判断相呼应。
- source_word: אִם לֹא נֶחֱזַק מֵהֶם
  choice: 我们必定能胜过他们
  rationale: אִם לֹא 在誓言式或强烈断言中表达“必定”；נחזק מהם 字面可为“比他们强”，在交战语境中自然表达为“胜过他们”。
- source_word: וַיִּשְׁמַע לְקוֹלָם
  choice: 王听从了他们的话
  rationale: “听从某人的声音”是希伯来语惯用表达，现代汉语译为“听从……的话”；根据上下文补出主语“王”以保持清楚。
