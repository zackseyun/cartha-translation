base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/026.yaml
  text: At the turn of the year[c][b][a], Ben-hadad mustered Aram and went up to Aphek for battle with Israel.
translation:
  language: zh_hans
  text: 到了一年轮回的时候[a]，便·哈达召集了亚兰[b]，上亚弗去，要与[c]以色列交战。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“在一年返回之时”，是指年度循环再次来到的说法；也可译作“到了春季”。
    reason: lexical_alternative
  - marker: b
    text: 或译“亚兰人”。希伯来文“亚兰”既可指该国，也可指其人民或军队。
    reason: lexical_alternative
  - marker: c
    text: 或译“攻打”。希伯来文直译为“与”，这里用于交战的语境。
    reason: lexical_alternative
lexical_decisions:
- source_word: לִתְשׁוּבַת הַשָּׁנָה
  choice: 到了年复一年的时节
  rationale: 原文直译为“在一年返回之时”，指年度循环再次来到。此译保留周期性而不把它明确限定为春季。
- source_word: וַיִּפְקֹד
  choice: 召集
  rationale: פקד在军事语境中指点阅、召集兵力；现代汉语以“召集”自然地表达动员军队之意。
- source_word: אֶת אֲרָם
  choice: 亚兰
  rationale: 原文直接以“亚兰”为宾语，既可能指国家，也可能转指其人民或军队；正文保留这一名称和歧义。
- source_word: וַיַּעַל
  choice: 上到
  rationale: 保留עלה“上去”的基本方向意义，避免擅自改作更具军事解释色彩的“进军”。
- source_word: אֲפֵקָה
  choice: 到亚弗
  rationale: 地名后的方向词尾表示朝亚弗而去，汉语自然表达为“到亚弗”。
- source_word: לַמִּלְחָמָה
  choice: 要……交战
  rationale: מִלְחָמָה在此指战事或战斗；结合移动目的，译作“要……交战”自然清楚。
- source_word: עִם יִשְׂרָאֵל
  choice: 与以色列
  rationale: עִם本义为“与、同”；战斗语境可理解为“对抗”，正文保留较贴近原文的“与”，脚注说明另一自然译法。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“年复一年的时节”力求保留原文年度循环的表达；“便·哈达”和“亚弗”按常见圣经地名、人名音译；正文不把“亚兰”明确化为军队，也不把时节限定为春季。
