  text: וַ/יֹּאמְר֥וּ אֵלָ֛י/ו כָּל הַ/זְּקֵנִ֖ים וְ/כָל הָ/עָ֑ם אַל תִּשְׁמַ֖ע וְ/ל֥וֹא תֹאבֶֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/008.yaml
  text: Then all the elders and all the people said to him[a], “Do not listen, and do not consent.”
translation:
  language: zh_hans
  text: 众长老和全体百姓都对他说：“不要听从，也不要答应。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: 都对他说
  rationale: 该叙事性动词承接上文；现代汉语依靠语序自然表达事件推进，无须机械加入“然后”。“说”保留原文言说动作。
- source_word: אֵלָיו
  choice: 对他说
  rationale: 原文使用第三人称单数代词，虽按上下文所指为王，正文仍保留代词，不把名字明说出来。
- source_word: כָּל הַזְּקֵנִים
  choice: 众长老
  rationale: 这里的“长老”指群体中的领袖，而不只是年长男子；“众”自然体现 כָּל 的整体含义。
- source_word: וְכָל הָעָם
  choice: 和全体百姓
  rationale: עָם 指与长老并列的广大民众；“全体百姓”准确传达 כָּל，并符合庄重而易懂的现代汉语。
- source_word: אַל תִּשְׁמַע
  choice: 不要听从
  rationale: שׁמע 可指听、听从或服从。此处针对敌王的要求，“听从”既保留听取之意，也自然表达不可依从，避免仅译“不要听”可能造成的汉语歧义。
- source_word: וְלֹא תֹאבֶה
  choice: 也不要答应
  rationale: אבה 表示愿意、同意或应允。在政治要求的语境中，“答应”自然清楚，并与前面的“听从”构成递进式拒绝。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而通顺的叙事语言。“众长老和全体百姓”保留两组人的并列；引语简洁有力。原文两个动词的语义张力分别以“听从”和“答应”呈现，无须脚注即可在中文中清楚区分。
