  text: וַ/יֹּאמְר֣וּ אֵלָי/ו֮ עֲבָדָי/ו֒ הִנֵּֽה נָ֣א שָׁמַ֔עְנוּ כִּ֗י מַלְכֵי֙ בֵּ֣ית יִשְׂרָאֵ֔ל כִּֽי מַלְכֵ֥י חֶ֖סֶד הֵ֑ם נָשִׂ֣ימָה נָּא֩ שַׂקִּ֨ים בְּ/מָתְנֵ֜י/נוּ וַ/חֲבָלִ֣ים בְּ/רֹאשֵׁ֗/נוּ וְ/נֵצֵא֙ אֶל מֶ֣לֶךְ יִשְׂרָאֵ֔ל אוּלַ֖י יְחַיֶּ֥ה אֶת נַפְשֶֽׁ/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/031.yaml
  text: And his servants said to him, “Look, please, we have heard that the kings of the house of Israel are merciful kings. Please let us put sackcloth around our waists and ropes on our heads, and let us go out to the king of Israel; perhaps he will let you live.”
translation:
  language: zh_hans
  text: 他的臣仆对他说：“请看，我们听说以色列家的诸王都是仁慈的王。请让我们腰间围上麻布，头上套上绳索，出去到以色列王那里去；也许他会饶你一命。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֲבָדָיו
  choice: 他的臣仆
  rationale: 此处指亚兰王身边的臣属；“臣仆”既保留从属关系，也符合王室语境。
- source_word: מַלְכֵי חֶסֶד
  choice: 仁慈的王
  rationale: חֶסֶד 在这里描述君王宽厚、施怜悯的品性；译作“仁慈”自然且不额外限定其神学含义。
- source_word: שַׂקִּים בְּמָתְנֵינוּ
  choice: 腰束麻布
  rationale: 保留麻布围在腰间这一表示降服、哀恳的具体动作，并采用简洁自然的汉语表达。
- source_word: חֲבָלִים בְּרֹאשֵׁנוּ
  choice: 头套绳索
  rationale: 直译绳索位于头上的形象，不擅自解释其具体仪式意义。
- source_word: יְחַיֶּה אֶת־נַפְשֶׁךָ
  choice: 饶你一命
  rationale: 该使役表达在此意为让对方存活；“饶你一命”准确传达求降语境中的实际含义。
theological_decisions:
- issue: חֶסֶד 的表达范围
  choice: 仁慈
  alternative: 有慈爱／守约施慈爱
  rationale: 本句谈论以色列诸王对战败者的宽厚，不宜把该词在其他语境中的盟约内涵强行带入。
- issue: 求降装束的象征意义
  choice: 仅翻译具体动作
  alternative: 在正文中解释为悔罪或投降
  rationale: 原文没有明说其象征意义，因此保留形象而不作神学化或礼仪化解释。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“我们听说”已自然承载 הִנֵּה־נָא 的引起注意和恳求语气，避免生硬译成“看哪，请”；两个“请”分别体现提议中的恳求色彩。
