  to: 他的臣仆对他说：“请看，我们听说以色列家的诸王都是仁慈的王。请让我们腰间围上麻布，头上套上绳索，出去到以色列王那里去；也许他会饶你一命。”
  rationale: 仅补出原文开头 הִנֵּה־נָא 所含的“请看”提示语气，并微调两项装束短语以增强现代汉语的可读性。未解释麻布和绳索的仪式含义，也未将“仁慈”扩展为特定神学术语。
