base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/010.yaml
  text: Ben-hadad sent to him and said[a], “May the gods do so to me, and more also, if the dust of Samaria will be enough for handfuls for all the people who are at my feet.”
translation:
  language: zh_hans
  text: 便·哈达派人到亚哈那里，说：“愿众神这样惩罚我，并且加倍惩罚我：如果撒马利亚的尘土够在我脚下的众人每人抓一把的话！”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译：“如果撒马利亚的尘土足够给所有在我脚下的人作手掌所容的一把之量。”这里“在我脚下的人”指受便·哈达统辖、随侍在他身边的人；“一把之量”指手掌凹处所容的量。
    reason: 说明“在我脚下”及“手掌所容的一把之量”的惯用表达，并保留其夸张语气，不加入原文未说的情节。
lexical_decisions:
- source_word: וַיִּשְׁלַח אֵלָיו
  choice: 派人去见亚哈
  rationale: 原文直译为“派到他那里”；外交传话的语境表明所派的是人。补出本节所指的亚哈，使现代汉语表达清楚自然。
- source_word: בֶּן הֲדַד
  choice: 便·哈达
  rationale: 按现代汉语圣经人名惯例音译，并以间隔号区分名字的组成部分。
- source_word: כֹּה יַעֲשׂוּן לִי אֱלֹהִים וְכֹה יוֹסִפוּ
  choice: 愿众神重重惩罚我
  rationale: 这是自我咒诅式的起誓套语。此译保留祈愿和加重惩罚的语气，同时避免生硬地直译“这样待我，并且加倍”。
- source_word: אִם
  choice: 如果……的话
  rationale: 保留誓言中以“如果”引出的省略式咒诅结构；结合前面的自我咒诅，可清楚表达便·哈达断言此事绝不可能发生。
- source_word: יִשְׂפֹּק
  choice: 够
  rationale: 该动词表示数量足够；“够”是简洁自然的现代汉语。
- source_word: עֲפַר שֹׁמְרוֹן
  choice: 撒马利亚的尘土
  rationale: 忠实表达原文的属格结构，并保留夸张意象。
- source_word: לִשְׁעָלִים
  choice: 每人抓一把
  rationale: 结合上下文取“手掌凹处所容之量、 handful”之义；此处配合“众人每人”表达尘土甚至不够每人一把的夸口。
- source_word: לְכָל הָעָם אֲשֶׁר בְּרַגְלָי
  choice: 跟随我的众人
  rationale: “在我脚下”在这里指随从便·哈达、受他统领的军众；译为“跟随我的众人”传达该惯用语的军事随从含义。
theological_decisions:
- issue: 异教君王誓言中 אֱלֹהִים 的理解
  choice: 众神
  alternative: 上帝
  rationale: 说话者是亚兰王便·哈达，且动词为复数形式；这里最自然地指他所信奉的诸神，不宜特指以色列的上帝。
- issue: 誓言中 אִם 的语力
  choice: 保留“如果”构式，以前句的自我咒诅表达强烈否定
  alternative: 直接译成“撒马利亚的尘土绝不够”
  rationale: 原文以条件句构成省略式誓言。保留这一形式，既呈现原文修辞，也不把隐含意义完全改写成直陈句。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“愿众神重重惩罚我”保留古代誓言的严肃语气；后半句用口语可懂但不轻佻的“每人抓一把”，使夸张意象清楚。脚注标记[a]置于整句引语之后。
