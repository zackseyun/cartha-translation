  source_fidelity: “派人去见亚哈”可由外交语境推知，却比原文“派到他那里”多限定了所派者的行动；“每人抓一把”基本传达手掌所容之量。主要问题是誓言套语中的“并且加倍／更多”未得到充分表达，且将条件句独立为“如果……的话！”在现代汉语中不完整。
  naturalness: 现译前句用感叹号结束、后接孤立的“如果……的话！”不够自然。将条件句作为自我咒诅公式所引出的内容，以冒号连接，可既保留原文语序与省略式誓言，又使汉语完整通顺。
  terminology: “众神”符合异教君王口中的复数神明。“便·哈达”“撒马利亚”可保留项目既有译名。脚注中“把撒马利亚夷为尘土”不是原文意象所说的内容，应删除；并应避免把“在我脚下”单向解释为“随军人数”。
