  text: So the king of Israel went to his house sullen and angry[a], and he came to Samaria.
translation:
  language: zh_hans
  text: 于是，以色列王闷闷不乐、满怀怒气地回宫去了[a]，回到了撒马利亚。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“心怀怨愤、怒气冲冲。”希伯来语סַר וְזָעֵף这一对词兼有内心不悦和显露恼怒之意。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ מֶלֶךְ יִשְׂרָאֵל
  choice: 于是，以色列王……去了
  rationale: 以自然的现代汉语叙事承接词“于是”表达连续动作；主语按希伯来语明确译出。
- source_word: עַל בֵּיתוֹ
  choice: 回宫
  rationale: עַל在运动语境中指向目的地，בֵּיתוֹ字面为“他的家／房屋”；因主体是君王，语境所指为王宫。“回宫”比“到他的房屋去”自然，同时未改变目的地。
- source_word: סַר
  choice: 闷闷不乐
  rationale: 该词在与זָעֵף搭配时表达内心郁愤、阴沉不悦；“闷闷不乐”能让现代读者自然理解这种内在情绪。
- source_word: וְזָעֵף
  choice: 满怀怒气
  rationale: 该词表示恼怒、愤懑；与“闷闷不乐”并列，保留原文对内在不悦与明显怒气的双重描写。
- source_word: וַיָּבֹא שֹׁמְרוֹנָה
  choice: 回到了撒马利亚
  rationale: בוא表示来到或抵达，地名后的方向词尾־ה表示朝向撒马利亚。结合前句的归程，译作“回到了”符合汉语叙事。
