base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/017.yaml
  text: Then the young men of the commanders of the provinces went out first[a], and Ben-hadad sent, and they reported to him, saying, “Men have come out from Samaria.”
translation:
  language: zh_hans
  text: 各省长官手下的年轻人率先出去了；本·哈达派出了人[a]，他们向他报告说：“有人从撒马利亚出来了。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文只说“本·哈达派遣”，没有明说所派的是谁；译文依据随后有人向他报告而补出“人”，但不指定他们的任务。
    reason: lexical_alternative
lexical_decisions:
- source_word: נַעֲרֵי
  choice: 手下的年轻人
  rationale: נַעַר可指年轻人、仆役或随从。这里用“手下的年轻人”，既保留年龄意味，也自然表达他们隶属于各省长官。
- source_word: שָׂרֵי הַמְּדִינוֹת
  choice: 各省长官
  rationale: שָׂרֵי可指官长、领袖或统领，מְדִינוֹת指行政区域；“各省长官”简洁保留原文的属格关系，不把其职能过度限定为军事指挥官。
- source_word: בָּרִאשֹׁנָה
  choice: 率先
  rationale: 表示次序上的在先；“率先”符合出城行动的语境，同时不额外引入“第一波”等具体战术含义。
- source_word: וַיִּשְׁלַח
  choice: 派人去察看
  rationale: 原动词本身只表示“派遣”，未明说受派者或任务；下文随即出现向本·哈达报告的人，因此正文按语境补出“人”和“察看”，并用脚注说明。
- source_word: וַיַּגִּידוּ לוֹ לֵאמֹר
  choice: 他们向他报告说
  rationale: נגד的使役式常表示禀告、报告；此处是军事情境中的情报回报。“说”保留原文引出直接引语的形式。
- source_word: אֲנָשִׁים
  choice: 有人
  rationale: 原文为复数“人/男人”，但在汉语不定指报告中，“有人”最自然，且不暗示只有一人。
- source_word: יָצְאוּ מִשֹּׁמְרוֹן
  choice: 从撒马利亚出来了
  rationale: 准确表达人员已由撒马利亚城内出来的完成动作；“撒马利亚”采用通行中文译名。
- source_word: בֶּן הֲדַד
  choice: 本·哈达
  rationale: 采用该人名的通行中文音译。
