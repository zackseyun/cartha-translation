  text: וְ/אֶת הַ/דָּבָ֥ר הַ/זֶּ֖ה עֲשֵׂ֑ה הָסֵ֤ר הַ/מְּלָכִים֙ אִ֣ישׁ מִ/מְּקֹמ֔/וֹ וְ/שִׂ֥ים פַּח֖וֹת תַּחְתֵּי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/024.yaml
  text: 'And do this thing: remove the kings[a], each from his place, and put governors in their place.'
translation:
  language: zh_hans
  text: 你要这样做：把众王各自从原来的位置上撤下，另立省长[a]代替他们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“另派地方官员代替他们。”
    reason: “省长”（פַּחוֹת）指受任命治理地区的官员；此处并非现代行政区划中“省长”的固定官名。
lexical_decisions:
- source_word: וְאֶת הַדָּבָר הַזֶּה עֲשֵׂה
  choice: 你要这样做
  rationale: 前置宾语与命令式合起来，在现代汉语中自然表达为“你要这样做”，既保留命令语气，又避免生硬的“做这件事”。
- source_word: הָסֵר
  choice: 撤下来
  rationale: 该使役命令式表示使其离开原有位置；“撤下来”符合军事和行政语境，同时不武断断定这些王是否被彻底废黜。
- source_word: הַמְּלָכִים אִישׁ מִמְּקֹמוֹ
  choice: 把那些王从各自的职位上
  rationale: “那些王”反映定冠词与复数形式，“各自”体现 אִישׁ 的逐一分配意义；מָקוֹם 在此更可能指所处职位或岗位，因此译作“职位”，而非单纯的空间地点。
- source_word: וְשִׂים
  choice: 另立
  rationale: שׂים 基本义为放置、设立；在任命替代官员的语境中，“另立”简洁自然，并清楚表达替换关系。
- source_word: פַחוֹת
  choice: 省长
  rationale: פַּחוֹת 指受任命治理地区的行政长官；“省长”比“将领”更能保留其行政官员含义，也符合列王纪中的政治语境。
- source_word: תַּחְתֵּיהֶם
  choice: 接替他们
  rationale: 该表达字面可理解为“在他们之下”，但此处惯用意义是“代替他们”；“接替他们”自然表达职位替换。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“撤下来”“另立”“接替”清楚呈现军事行政重组；脚注保留 פַּחוֹת 在具体官职范围上的词义弹性。
