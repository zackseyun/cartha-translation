- from: 幸存的人逃到亚弗，进了城。城墙倒塌，压在其余的二万七千人身上。便哈达也逃进城，进了内室[a]。
  to: 幸存的人逃往亚弗，进了城。城墙倒塌，压在剩下的二万七千人身上。便哈达也逃进城，进了内室[a]。
  rationale: 修订仅优化两处中文表达：以“逃往”贴合地名的方向性用法；以“剩下的”直接对应第二个“余下的人”，避免“其余的”可能暗示另一群人的理解。其余译文及脚注均可保留。
