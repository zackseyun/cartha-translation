base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/030.yaml
  text: The survivors fled to Aphek[a], into the city, and the wall fell on twenty-seven thousand of the remaining men. Ben-hadad also fled and entered the city, into an inner room.
translation:
  language: zh_hans
  text: 幸存的人逃往亚弗，进了城。城墙倒塌，压在剩下的二万七千人身上。便哈达也逃进城，进了内室[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译：“房中之房”，可能指最里面的房间。
    reason: 保留原文特殊表达及其可能强调的内部空间层次；不把“躲藏”这一语境推论写入正文。
lexical_decisions:
- source_word: הַנּוֹתָרִים
  choice: 幸存的人／其余的……人
  rationale: 该词指战斗后剩下的人。首次译为“幸存的人”，自然体现他们从战场逃生；第二次按修饰语结构译为“其余的……人”，既保留“剩余”之意，也避免生硬重复。
- source_word: אֲפֵקָה
  choice: 到亚弗
  rationale: 地名后的方向词尾表示朝向亚弗；采用现代中文常见的圣经地名译法。
- source_word: וַתִּפֹּל הַחוֹמָה
  choice: 城墙倒塌
  rationale: 原文“墙”带定冠词，在语境中自然指亚弗的城墙；中文译作“城墙”比“那墙”更清楚，但不具体断定是整段还是部分城墙。
- source_word: עַל עֶשְׂרִים וְשִׁבְעָה אֶלֶף אִישׁ
  choice: 压在……二万七千人身上
  rationale: 忠实保留介词“在……之上”的具体画面，并按现代中文方式表达人数；不补入原文未明说的“压死”。
- source_word: וּבֶן הֲדַד
  choice: 便哈达也
  rationale: “也”自然表达便哈达与其他逃亡者相应的行动；人名采用通行中文音译。
- source_word: חֶדֶר בְּחָדֶר
  choice: 内室
  rationale: 字面为“房中之房”，在这里指位于更里面、较隐蔽的房间。“内室”简洁自然；字面结构另见脚注，以保留其空间层次和潜在含义。
theological_decisions: []
translation_notes:
  register: 采用庄重而明白的现代标准汉语。句序保留叙事推进：幸存者逃入城、城墙倒塌、便哈达再逃入内室。正文没有补写死亡或躲藏等原文仅由语境暗示的内容。
