base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/005.yaml
  text: 'The messengers returned and said[a], “Thus says Ben-hadad: ‘Though I sent to you, saying, “You shall give me your silver and your gold and your wives and your sons,”’”'
translation:
  language: zh_hans
  text: 使者回来，说：“便·哈达这样说：‘我先前虽然派人到你那里去说：“你要把你的银子、金子、妻子和儿子交给我”，’”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּשֻׁבוּ
  choice: 回来
  rationale: 该叙事形式表示接续发生的动作；“回来”自然保留了שׁוב的返回含义。
- source_word: הַמַּלְאָכִים
  choice: 使者们
  rationale: 这里是政治、军事语境，指奉命传话的人，而非天使；“使者”准确而不过度具体化为外交官衔。
- source_word: כֹּה אָמַר
  choice: 这样说
  rationale: 这是标准的传信公式；现代汉语用“这样说”自然、庄重。
- source_word: בֶּן הֲדַד
  choice: 便·哈达
  rationale: 按现代汉语人名音译，并用间隔号标示复合音译名。
- source_word: כִּי
  choice: 虽然
  rationale: 结合第6节进一步加码的要求，将此处理解为让步语气，同时用脚注保留“因为”等可能译法。
- source_word: שָׁלַחְתִּי אֵלֶיךָ לֵאמֹר
  choice: 我先前……派人告诉你
  rationale: 完成式回指前一次差遣；“派人告诉你”在汉语中清楚表达差遣使者传话，虽补出隐含的受差者，却未改变所指事件。
- source_word: כַּסְפְּךָ וּזְהָבְךָ
  choice: 你的银子、金子
  rationale: 依原文次序保留两种具体贵重物，不笼统译为“钱财”。
- source_word: וְנָשֶׁיךָ וּבָנֶיךָ
  choice: 妻子和儿子
  rationale: 按上下文及词形分别译出“妻子”和“儿子”，不泛化为“家人”或“孩子”。
- source_word: לִי תִתֵּן
  choice: 交给我
  rationale: 此处未完成式表达命令性的要求；“交给我”符合强制索取的语境，也比“给我”更明确。
theological_decisions:
- issue: כִּי在本句中是让步、原因还是强调语气
  choice: 正文译作“虽然”
  alternative: “因为”或“确实”
  rationale: 第5节的句法延续到第6节，前一要求与随后更严厉的搜取形成让步关系；但该连词本身多义，因此不把其他解释排除在脚注之外。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“便·哈达这样说”保留古代使者宣告的正式语气。本节的话语在句法和意义上延续到下一节，因此结尾刻意保留未完的引语结构。
