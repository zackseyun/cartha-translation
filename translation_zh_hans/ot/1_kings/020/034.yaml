source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֵלָ֡י/ו הֶ/עָרִ֣ים אֲשֶׁר לָֽקַח אָבִ/י֩ מֵ/אֵ֨ת אָבִ֜י/ךָ אָשִׁ֗יב וְ֠/חוּצוֹת תָּשִׂ֨ים לְ/ךָ֤ בְ/דַמֶּ֨שֶׂק֙ כַּ/אֲשֶׁר שָׂ֤ם אָבִ/י֙ בְּ/שֹׁ֣מְר֔וֹן וַ/אֲנִ֖י בַּ/בְּרִ֣ית אֲשַׁלְּחֶ֑/ךָּ וַ/יִּכְרָת ל֥/וֹ בְרִ֖ית וַֽ/יְשַׁלְּחֵֽ/הוּ־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/034.yaml
  text: Then he said to him[a], “The cities that my father took from your father I will restore, and you may establish streets for yourself in Damascus, as my father established them in Samaria.” And I, in the treaty[c][b], will let you go.” So he made a treaty with him and let him go.
translation:
  language: zh_hans
  text: 他对他说：“我父亲从你父亲那里夺取的城邑，我必归还；你也可以在大马士革为自己设立街市[a]，正如我父亲在撒马利亚所设立的一样。”亚哈说：“至于我，我就按这约[b]放你走。”于是亚哈与他立约[c]，放他走了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “街市”也可译作“街道”或“街区”。希伯来语原词字面指街道或空旷处，在这里可能是条约所准许设立的商业区域。
    reason: lexical_alternative
  - marker: b
    text: “约”在这里指两国君王之间的条约；本句也可译作“我就凭这条约放你走”。
    reason: alternative_reading
  - marker: c
    text: “立约”按希伯来语字面是“切约”，这是正式订立具有约束力之协议的惯用说法。
    reason: cultural_note
lexical_decisions:
- source_word: הֶעָרִים
  choice: 城邑
  rationale: עִיר可指城或镇；“城邑”适合君王之间归还领土的语境，也保持庄重而易懂。
- source_word: לָקַח ... אָשִׁיב
  choice: 夺取……归还
  rationale: 这一动词组合表达先前占有与如今返还；“夺取”体现战争背景，“归还”体现领土复归。
- source_word: וְחוּצוֹת
  choice: 街市
  rationale: חוּצוֹת字面可指街道或空旷处，在条约语境中很可能指获准设立的商业街区；“街市”兼顾字面形象与实际功能。
- source_word: תָּשִׂים לְךָ בְדַמֶּשֶׂק
  choice: 你也可以在大马士革为自己设立
  rationale: שׂים在此表示设置或设立；结合城市权利的语境，“设立”比单纯“放置”自然。
- source_word: כַּאֲשֶׁר שָׂם אָבִי בְּשֹׁמְרוֹן
  choice: 正如我父亲在撒马利亚所设立的一样
  rationale: 希伯来文承接前面的חוּצוֹת，中文用“所设立的一样”自然补足省略的宾语，又保留重复动词的对应。
- source_word: בַּבְּרִית
  choice: 按这约
  rationale: בְּרִית在这里是两王之间的政治协议；“约”保留该词广泛的圣经用语和词汇联系，“按”表达以此协议为依据。
- source_word: אֲשַׁלְּחֶךָּ
  choice: 放你走
  rationale: 语境是亚哈在达成条件后释放本·哈达；“放你走”准确、自然，并与下文叙事呼应。
- source_word: וַיִּכְרָת לוֹ בְרִית
  choice: 与他立约
  rationale: כרת ברית是正式订立约定的固定习语；汉语“立约”简洁自然，也保留其约的措辞。
- source_word: וַיְשַׁלְּחֵהוּ
  choice: 放他走了
  rationale: 此句叙述前述承诺得到履行，并与“放你走”形成清楚呼应。
theological_decisions:
- issue: 政治协议语境中בְּרִית的译法
  choice: 约
  alternative: 条约；盟约
  rationale: 这里指君王之间的政治协议。“约”既能自然表达约定，也避免完全切断该词在经文其他语境中的词汇联系；脚注说明其在此具体指条约，不赋予额外神学含义。
- issue: וַאֲנִי处是否发生说话者转换
  choice: 以“亚哈说”明确第二位说话者
  alternative: 把“至于我，我就按这约放你走”连续放在前一人的引语中
  rationale: 人称和谈判逻辑表明，先提出归还城邑的一方是本·哈达，而有权释放他的是亚哈。原文仅以“至于我”标示回应，中文若不补明说话者容易误读；所补内容属于语境明示，不改变话语内容。
translation_notes:
  register: 采用现代、庄重而通顺的叙事语言。“城邑”“立约”保持经文语体，“街市”“放你走”则确保普通读者易于理解。引语分段按上下文明确说话者转换，同时保留“至于我”所体现的对答结构。
