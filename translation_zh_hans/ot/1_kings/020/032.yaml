  text: וַ/יַּחְגְּרוּ֩ שַׂקִּ֨ים בְּ/מָתְנֵי/הֶ֜ם וַ/חֲבָלִ֣ים בְּ/רָאשֵׁי/הֶ֗ם וַ/יָּבֹ֨אוּ֙ אֶל מֶ֣לֶךְ יִשְׂרָאֵ֔ל וַ/יֹּ֣אמְר֔וּ עַבְדְּ/ךָ֧ בֶן הֲדַ֛ד אָמַ֖ר תְּחִֽי נָ֣א נַפְשִׁ֑/י וַ/יֹּ֛אמֶר הַ/עוֹדֶ֥/נּוּ חַ֖י אָחִ֥/י הֽוּא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/032.yaml
  text: So they tied sackcloth around their waists and ropes on their heads[a], and they came to the king of Israel and said, “Your servant Ben-hadad says, ‘Please let me live.’” And he said[b], “Is he still alive? He is my brother.”
translation:
  language: zh_hans
  text: 于是，他们腰间束上麻布，头上套着绳索，来到以色列王那里，说：“你的仆人便·哈达说：‘求你容我活命[a]。’”王说：“他还活着吗？他是我的兄弟[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“愿我的性命存活。”也可译作：“求你饶我一命。”
    reason: 说明希伯来语惯用表达的字面形式及可接受译法。
  - marker: b
    text: “我的兄弟”在这里很可能是政治或盟约上的同侪称谓，不一定指亲生兄弟。
    reason: 说明古代君王外交称谓的语境，同时保留正文的字面表达及其含义张力。
lexical_decisions:
- source_word: וַיַּחְגְּרוּ
  choice: 束上
  rationale: חגר表示束上或系上；“束上”既保留具体动作，也符合庄重而自然的现代汉语。
- source_word: שַׂקִּים
  choice: 麻布
  rationale: שַׂקִּים在此指表示哀恸、屈服或自卑的粗糙布料；“麻布”是中文圣经语境中清楚而常见的表达。
- source_word: בְּמָתְנֵיהֶם
  choice: 腰间
  rationale: מָתְנַיִם指腰或腰部；“腰间”准确且比“腰胯”更符合现代汉语。
- source_word: וַחֲבָלִים בְּרָאשֵׁיהֶם
  choice: 头上套着绳索
  rationale: חֲבָלִים指绳索，בְּרָאשֵׁיהֶם直指其头上；“套着”自然呈现绳索置于头上的屈服姿态，但不进一步断定具体绑法。
- source_word: עַבְדְּךָ
  choice: 你的仆人
  rationale: עבד在王室外交言辞中是自谦称谓；“仆人”保留臣服语气，而不额外强调奴隶身份。
- source_word: בֶן הֲדַד
  choice: 便·哈达
  rationale: 按希伯来语人名音译，并以间隔号清楚区分复合人名的音节成分。
- source_word: תְּחִי נָא נַפְשִׁי
  choice: 求你容我活命
  rationale: 字面近于“愿我的性命存活”；这是请求保全生命的惯用表达。“求你容我活命”自然地传达恳求语气与原句含义。
- source_word: הַעוֹדֶנּוּ חַי
  choice: 他还活着吗？
  rationale: 疑问词与עוֹד、חַי合起来询问此人是否仍然活着；此译简洁准确。
- source_word: אָחִי הוּא
  choice: 他是我的兄弟
  rationale: אָחִי直译为“我的兄弟”，既可指亲属，也可能用于政治或盟约关系；保留原有亲属称谓，不在正文中消除其含义张力。
theological_decisions:
- issue: 亚哈称便·哈达为“我的兄弟”的含义
  choice: 正文直译为“他是我的兄弟”
  alternative: 他是我的盟友／他就像我的兄弟
  rationale: 原文使用普通亲属词אָחִי。上下文中它很可能表达君王之间的政治同侪或结盟关系，而非血缘关系；但经文本身未明说，因此正文保留其字面称谓，并用脚注提示语境。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。叙事衔接用“于是”，外交自谦语保留为“你的仆人”；具体动作和物件尽量直译，同时避免用现代解释替代原文含有张力的“兄弟”一词。
