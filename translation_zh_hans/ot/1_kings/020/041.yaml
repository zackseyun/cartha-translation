  text: Then he quickly removed the bandage from over his eyes[a], and the king of Israel recognized him, that he was one of the prophets.
translation:
  language: zh_hans
  text: 他赶忙除去蒙在眼睛上的遮盖物[a]。以色列王认出他是先知中的一位。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “遮盖物”：希伯来语 הָאֲפֵר 传统上也有人理解为“灰”。但按本段上下文，这里很可能指蒙在眼睛上、用来乔装的遮盖物。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמַהֵר
  choice: 就急忙
  rationale: מהר表示迅速、赶紧；“就急忙”既保留叙事承接，也自然传达动作的急切。
- source_word: וַיָּסַר
  choice: 除掉
  rationale: 此处使役形式表示移开、取下；“除掉”与蒙眼之物搭配自然。
- source_word: הָאֲפֵר
  choice: 绷带
  rationale: אֵפֶר通常可指“灰”，但本段上下文表明这是盖在眼睛上用来乔装、随后可以取下的物件，因此正文采用符合其功能的“绷带”，并以脚注保留传统词义。
- source_word: מֵעַל עֵינָיו
  choice: 蒙在眼睛上的
  rationale: מן加על表达“从……上面移开”；转化为中文定语，保留物件覆盖眼睛这一空间关系。
- source_word: וַיַּכֵּר אֹתוֹ
  choice: 认出他
  rationale: נכר的使役形式在此意为辨认、认出；“认出他”符合叙事语境。
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: 以色列王
  rationale: 以简洁、庄重的现代汉语表达原文的属格结构。
- source_word: כִּי
  choice: （融入“认出他是……”结构）
  rationale: 此处כִּי引出辨认的内容，现代汉语以“认出他是……”自然表达，无须另译连接词。
- source_word: מֵהַנְּבִאִים הוּא
  choice: 他是先知中的一位
  rationale: מן为部分用法，表示他属于先知群体；此译法明确保留“其中一位”的含义。
