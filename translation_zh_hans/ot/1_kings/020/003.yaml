base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/003.yaml
  text: 'And he said to him[a], “Thus says Ben-hadad: Your silver and your gold are mine; your wives and your sons, the best, are mine.”'
translation:
  language: zh_hans
  text: 他对亚哈说：“便哈达如此说：‘你的银子和金子都归我；你的妻子和儿子中那些最好的，也都归我。’”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר לוֹ
  choice: 他对亚哈说
  rationale: אמר ל在叙事中自然译为“对……说”。本节希伯来文只用代词“他”，但汉语若连续使用多个“他”容易指代不清；根据紧接的上文，受话者是亚哈，因此明示其名。
- source_word: כֹּה אָמַר
  choice: 如此说
  rationale: 保留使者传话的正式公式及其宣告语气。
- source_word: בֶּן הֲדַד
  choice: 便哈达
  rationale: 按现代中文圣经人名的通行音译处理。
- source_word: כַּסְפְּךָ וּזְהָבְךָ
  choice: 你的银子和金子
  rationale: 保留原文所列举的具体贵重金属，不笼统译作“钱财”。
- source_word: לִי הוּא
  choice: 都归我
  rationale: 希伯来文用所有格结构表达占有权；汉语“归我”简洁有力，“都”自然涵盖并列的银子与金子。
- source_word: וְנָשֶׁיךָ וּבָנֶיךָ
  choice: 你的妻子和儿子
  rationale: נָשִׁים在这一家庭归属语境中指“妻子”，בָּנִים明确指男性后代，故译“儿子”而不泛化为“儿女”。
- source_word: הַטּוֹבִים
  choice: 就是其中最好的
  rationale: טוֹב在强取人财的语境中指优良、上好或最可取的对象；“最好的”比道德意义的“良善”更贴切。用插入式表达尽量保留原文后置修饰所带来的范围张力。
- source_word: לִי הֵם
  choice: 也都归我
  rationale: 重复“归我”以保留原文第二次所有权宣告的强调和平行结构。
theological_decisions:
- issue: הַטּוֹבִים的修饰范围
  choice: 正文译作“你的妻子和儿子，就是其中最好的”，保留后置修饰及一定的范围开放性
  alternative: “你的妻子和你最好的儿子”或“你最好的妻子和儿子”
  rationale: 该阳性复数形容词紧随“儿子”，最直接可修饰儿子；但阳性复数也可能概括由阴性“妻子”和阳性“儿子”组成的混合群体。正文不把这一语法张力完全消除，并以脚注说明。
translation_notes:
  register: 采用现代、庄重而清楚的叙事语言。外层引语是使者对亚哈说话，内层引语是便哈达的原话；用嵌套引号清楚呈现传话层次。
