source:
  edition: WLC
  text: וְ/הִנֵּ֣ה נָבִ֣יא אֶחָ֗ד נִגַּשׁ֮ אֶל אַחְאָ֣ב מֶֽלֶךְ יִשְׂרָאֵל֒ וַ/יֹּ֗אמֶר כֹּ֚ה אָמַ֣ר יְהוָ֔ה הְֽ/רָאִ֔יתָ אֵ֛ת כָּל הֶ/הָמ֥וֹן הַ/גָּד֖וֹל הַ/זֶּ֑ה הִנְ/נִ֨י נֹתְנ֤/וֹ בְ/יָֽדְ/ךָ֙ הַ/יּ֔וֹם וְ/יָדַעְתָּ֖ כִּֽי אֲנִ֥י יְהוָֽה׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/013.yaml
  text: 'And behold[a], a certain prophet came near to Ahab king of Israel and said, “Thus says Yahweh: Have you seen all this great multitude? Behold, I am giving it into your hand today, and you shall know that I am Yahweh.”'
translation:
  language: zh_hans
  text: 看哪，有一位先知来到以色列王亚哈面前，对他说：“雅威如此说：你看见这一大群人[a]了吗？看哪，今天我要把他们交在你手中，你就会知道我是雅威。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “一大群人”也可译作“一支庞大的军队”或“一大队人马”。希伯来语原词可指大群人或大队人马；这里指敌军。
    reason: 说明集合名词在军事语境中的词义范围，避免正文过度限定。
lexical_decisions:
- source_word: וְהִנֵּה
  choice: 看哪
  rationale: 保留希伯来语的叙事提示和突现感；现代中文虽略显庄重，但在圣经叙事中清楚自然。
- source_word: נָבִיא אֶחָד
  choice: 有一个先知
  rationale: 原文直译为“一个先知”，在此用于引入身份未明的个体；“有一个先知”符合现代中文叙事习惯。
- source_word: נִגַּשׁ אֶל
  choice: 上前来见
  rationale: 既表达 נגש 的趋近动作，也自然说明先知来到亚哈面前，而不额外推断礼仪或敌意。
- source_word: כֹּה אָמַר יְהוָה
  choice: 雅威如此说
  rationale: 保留标准先知使者公式的庄重和直接性，并按项目惯例音译神名。
- source_word: הֲרָאִיתָ
  choice: 你看见……了吗
  rationale: 对应带疑问词的完成式，指亚哈眼前已经可见的敌军威胁。
- source_word: כָּל הֶהָמוֹן הַגָּדוֹל הַזֶּה
  choice: 这一大群人
  rationale: הָמוֹן 的基本意义是众多的人群或大队；上下文表明是敌军，但正文不把词义过度限定为“军队”。
- source_word: הִנְנִי נֹתְנוֹ
  choice: 看哪，……我要把他们交
  rationale: הִנְנִי 加分词强调即将发生且确定的行动；中文用“看哪”和“我要”兼顾强调、临近性及自然表达。
- source_word: בְיָדְךָ
  choice: 在你手中
  rationale: 保留希伯来语“交在某人手中”的惯用意象，中文亦可自然理解为置于其权下。
- source_word: וְיָדַעְתָּ כִּי אֲנִי יְהוָה
  choice: 你就会知道我是雅威
  rationale: “就”表达前述拯救行动所带来的结果；“知道”保留原文可能涵盖认识与亲身确认的张力。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；音译“雅威”保留其作为专名的功能，不以称号取代，也不引入特定宗派解释。
- issue: וְיָדַעְתָּ 的认识公式
  choice: 你就会知道我是雅威
  alternative: 你就会承认我是雅威
  rationale: “知道”较贴近 ידע，并保留这句话究竟侧重认知、承认还是经由事件获得亲身认识的神学张力；不将其缩窄为某一种解释。
- issue: 交付对象的指代
  choice: 把他们交在你手中
  alternative: 把它交在你手中
  rationale: 原文以阳性单数代词回指集合名词 הָמוֹן；现代中文指敌方众人时用复数“他们”更自然，同时仍保持集合性的所指。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“看哪”保留原文两处强调；先知话语以外引号包裹，内层神谕用单引号区分。正文避免古奥的“尔”“必”等表达，同时保留“雅威如此说”和“交在你手中”的希伯来语修辞质感。
