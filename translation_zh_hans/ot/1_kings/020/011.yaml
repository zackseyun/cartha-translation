  text: וַ/יַּ֤עַן מֶֽלֶךְ יִשְׂרָאֵל֙ וַ/יֹּ֣אמֶר דַּבְּר֔וּ אַל יִתְהַלֵּ֥ל חֹגֵ֖ר כִּ/מְפַתֵּֽחַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/011.yaml
  text: And the king of Israel answered and said[a], “Tell him, ‘Let not the one who girds on his armor boast like the one who takes it off.’”
translation:
  language: zh_hans
  text: 以色列王回答说：“你们告诉他：‘披挂上阵的，不要像卸下战具的那样夸口。’”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译是：“正在束上（装备）的，不要像正在解开（装备）的那样夸口。”这句谚语把准备上阵的人与战斗结束后卸下装备的人作对比。
    reason: 原文省略了所束、所解之物；脚注以括号补明军事语境中的装备，同时保留两个分词所指的是人。
lexical_decisions:
- source_word: וַיַּעַן מֶלֶךְ יִשְׂרָאֵל וַיֹּאמֶר
  choice: 以色列王回答说
  rationale: 保留希伯来叙事中“回答并说”的话语引入功能，同时用现代汉语自然简洁的“回答说”表达，避免生硬重复。
- source_word: דַּבְּרוּ
  choice: 你们告诉他
  rationale: 这是第二人称复数命令式，语境中对象是使者；补出间接宾语“他”，清楚表达让使者转告便哈达的意思。
- source_word: אַל יִתְהַלֵּל
  choice: 不要……夸口
  rationale: 准确表达否定祈使/劝戒语气；התהלל在此指自夸，“夸口”庄重且符合箴言语体。
- source_word: חֹגֵר
  choice: 披挂上阵的
  rationale: 原词字面为“束上、系上的人”，宾语未明说。军事语境表明是装备自己准备作战；“披挂上阵”以自然汉语保留备战意象，但不把所系之物限定为铠甲。
- source_word: כִּמְפַתֵּחַ
  choice: 像卸下战具的那样
  rationale: מפתח在对偶中指松开、解下装备的人；“卸下战具”清楚传达战斗结束后的状态，同时保留原文未明确宣称胜利的含蓄。
theological_decisions:
- issue: 卸下装备是否明确表示得胜
  choice: 正文只译作“卸下战具”，不直接加入“得胜”
  alternative: 像得胜后卸下战具的人那样
  rationale: 谚语语用上暗示打完仗、很可能得胜归来，但希伯来原文只说“解开/卸下的人”。不把推论写入正文，可保留原文的简练与张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“披挂上阵”与“卸下战具”构成清晰对照；保留谚语的凝练感，不把“胜利”这一语境推论直接加入正文。
