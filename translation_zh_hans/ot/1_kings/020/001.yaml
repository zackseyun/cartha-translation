base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/001.yaml
  text: Ben-hadad king of Aram gathered all his army[a], and thirty-two kings with him, and horses and chariots[b]; then he went up and besieged Samaria and fought against it.
translation:
  language: zh_hans
  text: 亚兰王便·哈达召集了他的全部军队；又有三十二位王随同他，还有战马和战车。随后，他上去围困撒马利亚，并与撒马利亚交战。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבֶן הֲדַד
  choice: 便·哈达
  rationale: 人名按希伯来语音译。句首 וּ 是叙事连接词；中文另以分句衔接体现，不机械译作“并且”。
- source_word: מֶלֶךְ אֲרָם
  choice: 亚兰王
  rationale: 采用希伯来地名“亚兰”，不使用后世传统称呼“叙利亚”；中文以“亚兰王”自然表达。
- source_word: קָבַץ אֶת כָּל חֵילוֹ
  choice: 召集了他的全部军队
  rationale: קבץ 表示召集、聚集；חַיִל 在军事语境中指军队或兵力。
- source_word: וּשְׁלֹשִׁים וּשְׁנַיִם מֶלֶךְ אִתּוֹ
  choice: 另有三十二个王……与他同行
  rationale: 保留三十二位王伴随便·哈达的意义，并用现代中文清楚呈现其同盟、随行关系，不额外界定其政治身份。
- source_word: וְסוּס וָרָכֶב
  choice: 以及战马和战车
  rationale: 希伯来语用单数集合名词；中文按军事语境自然译为集合性的“战马和战车”。
- source_word: וַיַּעַל
  choice: 随后，他上去
  rationale: 保留 עלה 的“上去”空间意象；“随后”体现叙事时序。
- source_word: וַיָּצַר עַל שֹׁמְרוֹן
  choice: 围困撒马利亚
  rationale: צור על 在军事语境中表示围城、围困。
- source_word: וַיִּלָּחֶם בָּהּ
  choice: 攻打这城
  rationale: לחם ב 表示与某对象交战或攻打；阴性代词指撒马利亚，中文明确为“这城”以避免指代生硬。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。保留“亚兰”这一源语地名及“上去”的地形叙事色彩；避免把三十二个王进一步解释为诸侯或附庸。
