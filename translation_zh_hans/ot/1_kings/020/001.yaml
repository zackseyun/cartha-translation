revisions:
- from: 亚兰王便·哈达召集了他的全部军队；另有三十二个王，以及战马和战车与他同行。随后，他上去围困撒马利亚，并攻打这城。
  to: 亚兰王便·哈达召集了他的全部军队；又有三十二位王随同他，还有战马和战车。随后，他上去围困撒马利亚，并与撒马利亚交战。
  rationale: 修订仅消除中文修饰歧义，并将末句调整为更贴近原文动词意义的表达；不增添三十二位王的政治身分，也不改变“上去”的空间意象或叙事顺序。
