  text: וַ/יֹּ֛אמֶר אִם לְ/שָׁל֥וֹם יָצָ֖אוּ תִּפְשׂ֣וּ/ם חַיִּ֑ים וְ/אִ֧ם לְ/מִלְחָמָ֛ה יָצָ֖אוּ חַיִּ֥ים תִּפְשֽׂוּ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/018.yaml
  text: And he said[a], “If they have come out for peace, seize them alive; and if they have come out for battle, seize them alive.”
translation:
  language: zh_hans
  text: 他就说：“他们若是为和平而出来[a]，就要活捉他们；若是为交战而出来，也要活捉他们。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作：“他们若是带着和平的意图出来……若是出来作战。”
    reason: לְשָׁלוֹם 和 לְמִלְחָמָה 可表达出来的目的，也可带有方式意味，即带着和平意图出来或出来作战；正文采用目的性表达，以保留两个介词短语的平行结构。
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 他就说
  rationale: 这是以叙事性 wayyiqtol 形式出现的 אמר，用“就说”自然承接前文，同时不额外强化时间先后。
- source_word: אִם
  choice: 若是
  rationale: 作为条件连词，引出两种可能情形；“若是”简洁、庄重，也符合命令语境。
- source_word: לְשָׁלוֹם
  choice: 为和平
  rationale: 保留介词 לְ 所表达的目的或意图；此处 שָׁלוֹם 指和平目的，而不只是抽象的和平状态。
- source_word: יָצָאוּ
  choice: 出来
  rationale: 从说话者观察城中人出来的视角译为“出来”最自然；汉语无需显式标出希伯来语完成式。
- source_word: תִּפְשׂוּם
  choice: 活捉他们
  rationale: תפשׂ 在军事语境中表示抓住、擒获；与 חַיִּים 合译为“活捉”，准确而自然地传达命令的力度。
- source_word: וְאִם
  choice: 若是
  rationale: 汉语分号已清楚并列第二种条件，省去直译“并且”可避免生硬，同时不添加原文没有的强烈转折。
- source_word: לְמִלְחָמָה
  choice: 为交战
  rationale: מִלְחָמָה 指战争或战斗；“为交战”与“为和平”形成紧密平行，并表达敌对目的。
- source_word: חַיִּים תִּפְשׂוּם
  choice: 也要活捉他们
  rationale: 保留第二小句重复的命令；“也”体现两种情形下命令相同。原文第二处将 חַיִּים 前置，汉语仍采用自然语序，不另行加入原文未明说的强调内容。
