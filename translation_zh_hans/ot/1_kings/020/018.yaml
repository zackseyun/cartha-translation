  source_fidelity: 正文准确保留了两个条件句、两次“活捉”的重复，以及“为和平／为交战而出来”的目的性对照。惟脚注将第一种替代读法表述为“平和地出来”，在现代汉语中较易指人的性情或态度，未能清楚表达“以和平方式／带着和平意图”的语义。
  naturalness: 正文庄重、清楚，适合现代标准汉语的叙事及军事命令语境。“为交战而出来”虽稍偏书面，但自然可懂，并与“为和平而出来”保持平行。
  terminology: “活捉”准确对应“活着抓住他们”，且两次重复得以保留。“和平”“交战”没有加入特定神学或解释性立场。
