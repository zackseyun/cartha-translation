base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/033.yaml
  text: The men were watching for an omen[a], and they quickly seized on it from him and said, “Ben-hadad is your brother.” And he said, “Come, take him.” Then Ben-hadad came out to him[c][b], and he had him come up into the chariot.
translation:
  language: zh_hans
  text: 那些人正在察言观色，看这是不是个吉兆[a]；他们立刻抓住亚哈这句话[b]，说：“便·哈达是你的兄弟。”亚哈说：“去，把他带来。”于是便·哈达出来见亚哈，亚哈让他登上战车。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“那些人正在观兆”。这里的希伯来语动词可指占卜、观兆；在本节中，他们是在留意亚哈的话，要从中找出有利的征兆。
    reason: lexical_alternative
  - marker: b
    text: “抓住亚哈这句话”所译的希伯来语表达含义较难确定；大意可能是他们迅速抓住亚哈的措辞，将其当作有利的明确表示。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְנַחֲשׁוּ
  choice: 察言观色，看这是不是个吉兆
  rationale: 该动词可指观兆或占卜；这里并非描写正式仪式，而是说众人密切留意亚哈的话，想从中找到有利的征兆。此译既保留“兆”的词义，也自然呈现场景。
- source_word: וַיַּחְלְטוּ הֲמִמֶּנּוּ
  choice: 立刻抓住亚哈这句话
  rationale: 希伯来语表达较难，语境表明他们迅速抓住亚哈称便·哈达为“兄弟”这一措辞，将其视为有利而确定的表示；“这句话”是按上下文补出的隐含宾语。
- source_word: אָחִיךָ
  choice: 你的兄弟
  rationale: 直译“你的兄弟”，保留众人借亚哈的外交性或礼貌性称呼进一步试探、确认其态度的意味。
- source_word: בֹּאוּ קָחֻהוּ
  choice: 去，把他带来
  rationale: 两个命令在本语境中是吩咐人将便·哈达带到亚哈面前；采用现代汉语中自然的命令句。
- source_word: וַיֵּצֵא אֵלָיו
  choice: 出来见亚哈
  rationale: 字面为“出来到他那里”；明确代词所指，使中文清楚，又不增加事件内容。
- source_word: וַיַּעֲלֵהוּ עַל הַמֶּרְכָּבָה
  choice: 亚哈让他登上战车
  rationale: עלה的使役形表示亚哈使或让便·哈达上车，并不必然表示亲手扶举；“登上战车”符合现代汉语习惯。
- source_word: הַמֶּרְכָּבָה
  choice: 战车
  rationale: 原文有定冠词而无明确物主；中文无需强行补作“亚哈的战车”。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“察言观色”具体呈现臣仆留意措辞的动作，“吉兆”则保留原词的观兆色彩。为避免汉语代词含混，两处补明“亚哈”；不把使役动词误解为亲手抬举。
