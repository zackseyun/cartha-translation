  text: וְ/עַבְדֵ֨י מֶֽלֶךְ אֲרָ֜ם אָמְר֣וּ אֵלָ֗י/ו אֱלֹהֵ֤י הָרִים֙ אֱלֹ֣הֵי/הֶ֔ם עַל כֵּ֖ן חָזְק֣וּ מִמֶּ֑/נּוּ וְ/אוּלָ֗ם נִלָּחֵ֤ם אִתָּ/ם֙ בַּ/מִּישׁ֔וֹר אִם לֹ֥א נֶחֱזַ֖ק מֵ/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/023.yaml
  text: And the servants of the king of Aram said to him[a], “Their gods are gods of the hills; therefore they were stronger than we were. But if we fight against them on the plain, surely we will be stronger than they are.”
translation:
  language: zh_hans
  text: 亚兰王的臣仆对他说[a]：“他们的诸神是山岭之神；所以他们比我们强。不过，我们若在平原上跟他们交战，就必定比他们强。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们的神是山岭之神……”希伯来语采用复数形式（“诸神”），反映亚兰人以异教观念谈论以色列的神。
    reason: 说明原文在语法形式与所指之间的歧义，以及说话者的多神论视角。
lexical_decisions:
- source_word: עַבְדֵי
  choice: 臣仆
  rationale: 在王室语境中可指王的仆从或臣属；“臣仆”既保留服事君王的关系，也自然适合宫廷与军事语境。
- source_word: אֲרָם
  choice: 亚兰
  rationale: 采用原名“亚兰”，不以后世地缘名称“叙利亚”代替。
- source_word: אֱלֹהֵי הָרִים אֱלֹהֵיהֶם
  choice: 他们的诸神是山岭之神
  rationale: 复数表达符合亚兰人多神论式的说法；“山岭”准确呈现 הָרִים 的复数和与平原的地势对比。
- source_word: עַל כֵּן
  choice: 所以
  rationale: 简洁自然地表达因果关系，符合现代汉语叙事语体。
- source_word: חָזְקוּ מִמֶּנּוּ
  choice: 他们比我们强
  rationale: 保留 חזק 加 מן 的比较结构，不将其过度解释为“击败”。
- source_word: וְאוּלָם
  choice: 不过
  rationale: 清楚标示从败因判断转向新作战方案的对比。
- source_word: נִלָּחֵם אִתָּם
  choice: 我们若……跟他们交战
  rationale: 按上下文将第一人称复数行动提议自然译成条件句。
- source_word: בַּמִּישׁוֹר
  choice: 在平原上
  rationale: 准确表达平坦地带，并与前文“山岭”形成鲜明对照。
- source_word: אִם לֹא
  choice: 必定
  rationale: 此处是加强断言的惯用表达，并非普通的否定条件句。
- source_word: נֶחֱזַק מֵהֶם
  choice: 比他们强
  rationale: 与前一句一致保留比较强弱的措辞和希伯来文的重复。
theological_decisions:
- issue: 亚兰人如何称说以色列的神
  choice: 他们的诸神是山岭之神
  alternative: 他们的神是山岭之神
  rationale: 经文是在转述亚兰人的异教观念，而非认可其神学判断。正文保留希伯来文复数形式所呈现的多神论视角，同时用脚注说明 אֱלֹהִים 也容许单数理解，避免消除原文的真实歧义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“臣仆”适合王室语境；“山岭”与“平原”保持地形对照。正文中的复数措辞忠实呈现亚兰人的错误认识，并以脚注保留单数译法。
