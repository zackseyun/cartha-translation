base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/040.yaml
  text: And as your servant was busy here and there[a], he was gone. Then the king of Israel said to him, “So shall your judgment be[c][b]; you yourself have decided it.”
translation:
  language: zh_hans
  text: 正当仆人在这里忙、那里忙的时候[a]，那人就不见了[b]。”以色列王对他说：“你的判决就是这样[c]；是你自己判定的。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“正当仆人忙这忙那的时候。”希伯来语这一说法表示忙于各处或各种事务。
    reason: lexical_alternative
  - marker: b
    text: 直译：“他不在了。”意思是受看守的那人已不再在那里。
    reason: lexical_alternative
  - marker: c
    text: “判决”也可译为“裁决”或“判罚”。这句话表示王按照此人自己所说的标准裁断他。
    reason: lexical_alternative
lexical_decisions:
- source_word: עַבְדְּךָ
  choice: 仆人
  rationale: 这是臣民在君王面前谦称自己；译作“仆人”既保留尊卑语气，也避免在本处过度强调奴隶身份。
- source_word: עֹשֵׂה הֵנָּה וָהֵנָּה
  choice: 在这里忙、那里忙
  rationale: עֹשֵׂה与“这里、那里”构成习语，表示忙于各处或各种事务；此译自然地保留其分心忙碌的意味。
- source_word: וְהוּא אֵינֶנּוּ
  choice: 那人就不见了
  rationale: 原文直译为“他不在了”；上下文指受看守的人已经离开，此译表达其不再在场，却不额外明说如何离开。
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: 以色列王
  rationale: 按希伯来语称号结构直接翻译。
- source_word: כֵּן
  choice: 就是如此
  rationale: 引出君王依据说话者自述所作的裁断，语气明确而庄重。
- source_word: מִשְׁפָּטְךָ
  choice: 你的判决
  rationale: מִשְׁפָּט在这里指适用于此人的司法裁断或刑罚；“判决”保留法律语境，并与下一句的自行裁定相衔接。
- source_word: אַתָּה חָרָצְתָּ
  choice: 是你自己定的
  rationale: חרץ在本语境中指决定、裁定；独立人称代词אַתָּה带强调意味，因此用“你自己”予以保留。
theological_decisions:
- issue: 君王的话是否直接说明具体刑罚
  choice: 保留“你的判决就是如此”的概括表达
  alternative: 把前文所述的死刑或赔偿内容在本节中重新明确说出
  rationale: 原文只用כֵּן指回说话者先前提出的标准，并未在本节重复具体刑罚；保留指代可避免增补原文。
- issue: 说话者在裁断中的责任
  choice: 译为“是你自己定的”
  alternative: 弱化为“已经决定了”
  rationale: 原文显式使用אַתָּה强调“你”，呈现自我定罪的张力；译文保留这种强调，但不添加进一步神学解释。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“在这里忙、那里忙”保留原文重复结构和口语化申辩感；王的答语则保持简洁、司法性的语气。引号承接上一节人物的陈述，并在“以色列王”前结束。
