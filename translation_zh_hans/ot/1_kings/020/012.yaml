base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/012.yaml
  text: And when he heard this word[a], while he and the kings were drinking in the booths, he said to his servants[c][b], “Take your positions.” So they took their positions against the city.
translation:
  language: zh_hans
  text: 他听见这话[a]时，正和众王在棚子[b]里喝酒，就对部下说：“列阵！”[c]他们便向着那城列阵。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “这话”也可译作“这个消息”或“这件事”。
    reason: lexical_alternative
  - marker: b
    text: “棚子”也可译作“临时棚屋”或“帐棚”。
    reason: lexical_alternative
  - marker: c
    text: 希伯来文的命令直译为“摆好！”在这里是简短的军事号令，意思很可能是要众人对城列阵部署。
    reason: cultural_note
lexical_decisions:
- source_word: הַדָּבָר הַזֶּה
  choice: 这话
  rationale: דָּבָר 可指“话、消息、事情”。这里所指的是亚哈传来的答复；“这话”既贴近原文，也能自然涵盖所传的信息。
- source_word: שֹׁתֶה הוּא וְהַמְּלָכִים
  choice: 正和众王……喝酒
  rationale: 分词 שֹׁתֶה 表示当时正在进行的动作。希伯来文直陈“他正在喝，他和众王”，汉语以“正和众王……喝酒”自然表达同一场景。
- source_word: בַּסֻּכּוֹת
  choice: 在棚子里
  rationale: סֻכּוֹת 指棚子或临时搭建的遮蔽处。“棚子”直接、易懂，又不把它具体化为原文未明说的豪华帐幕。
- source_word: שִׂימוּ
  choice: 列阵
  rationale: שׂים 的基本义是“放置、摆好”，此处是简短的军事命令。“列阵”保留命令的简洁和军事语境，同时不擅自补入攻城器械等细节。
- source_word: וַיָּשִׂימוּ עַל הָעִיר
  choice: 他们便对着城列阵
  rationale: 原文省略了受词，沿用上一命令的动词，并以 עַל הָעִיר 表示针对该城的敌对部署。“对着城列阵”保留这种简略和方向性，没有提前断定他们已经发动攻击。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“列阵”与后句重复，刻意对应希伯来文命令与执行之间的词语复现；“臣仆”既可涵盖王的侍从，也适合此处参与军事行动的下属。
