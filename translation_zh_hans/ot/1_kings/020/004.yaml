base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/004.yaml
  text: The king of Israel answered and said[a], “According to your word, my lord the king, I am yours, and all that is mine.”
translation:
  language: zh_hans
  text: 以色列王回答说：“我主我王，就照你的话，我和我所有的一切都归你。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמֶר
  choice: 回答说
  rationale: 保留希伯来叙事中两个连续言说动词的表达，同时符合现代汉语的自然用法。
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: 以色列王
  rationale: 准确表达属格关系，并采用现代中文圣经叙事中自然、简洁的称谓。
- source_word: כִּדְבָרְךָ
  choice: 就照你的话
  rationale: 保留介词 כְּ 与“你的话”的字面结构和顺服语气，也比单纯译作“正如你所说”更显正式。
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: 我主我王
  rationale: 这是对人间君王的恭敬称呼；“我主我王”既保留两个称谓及所属关系，又不赋予神圣含义。
- source_word: לְךָ אֲנִי
  choice: 我……归你
  rationale: 此处介词短语表达归属或臣服；“归你”简洁地传达以色列王的屈从。
- source_word: וְכָל אֲשֶׁר לִי
  choice: 和我所有的一切
  rationale: 涵盖属于说话者的一切人或物，保留原文范围宽泛的特点，不把含义局限为财物。
theological_decisions:
- issue: אֲדֹנִי 用于称呼人间君王
  choice: 我主
  alternative: 我的主人
  rationale: 所指是亚兰王便·哈达，属于宫廷中的尊称而非神的称号；“我主”保留尊卑关系，又避免误加神学含义。
- issue: לְךָ אֲנִי 所表达的归属程度
  choice: 我……归你
  alternative: 我是你的
  rationale: 原文可表达归属、效忠或臣服；“归你”保留这种张力，没有进一步解释为具体法律所有权。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“我主我王”保留宫廷式谦卑语气；分号呈现前半句应允与后半句全面归顺之间的关系。
