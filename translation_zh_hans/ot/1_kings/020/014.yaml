  text: וַ/יֹּ֤אמֶר אַחְאָב֙ בְּ/מִ֔י וַ/יֹּ֨אמֶר֙ כֹּֽה אָמַ֣ר יְהוָ֔ה בְּ/נַעֲרֵ֖י שָׂרֵ֣י הַ/מְּדִינ֑וֹת וַ/יֹּ֛אמֶר מִֽי יֶאְסֹ֥ר הַ/מִּלְחָמָ֖ה וַ/יֹּ֥אמֶר אָֽתָּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/014.yaml
  text: 'And Ahab said[a], “By whom?” And he said, “Thus says Yahweh: By the young men of the provincial officials.” Then he said, “Who will begin the battle?” And he said, “You.”'
translation:
  language: zh_hans
  text: 亚哈问：“借着谁呢？”他说：“雅威如此说：借着各省长官的年轻人[a]。”亚哈又问：“谁来开战呢？”他说：“你。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “年轻人”也可译作“侍从”或“仆役”；这里的希伯来词既可指年轻男子，也可指服侍官员的随从。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּמִי
  choice: 借着谁呢？
  rationale: 介词 בְּ 与疑问代词 מִי 连用，询问施行这事的人或凭借的媒介；“借着谁”既保留工具、代理含义，也符合现代汉语表达。
- source_word: כֹּה אָמַר יְהוָה
  choice: 雅威如此说
  rationale: 保留先知传信公式的庄重语气，并将神名 יהוה 音译为“雅威”。
- source_word: בְּנַעֲרֵי
  choice: 借着……年轻人
  rationale: נַעַר 的基本义可指年轻男子，也可按职务关系指侍从或仆役；正文保留较直接的词义，脚注说明语境中的功能性译法。
- source_word: שָׂרֵי הַמְּדִינוֹת
  choice: 各省长官
  rationale: שָׂרֵי 指掌权的官员或首领，הַמְּדִינוֹת 指行政辖区；“各省长官”简洁呈现其行政身份而不武断指定军职。
- source_word: מִי יֶאְסֹר הַמִּלְחָמָה
  choice: 谁来开战呢？
  rationale: אָסַר 本义为“捆绑”，但与“战争”连用构成习语，表示发动、开始或接战；“开战”自然且保留谁主动发起的重点。
- source_word: אָתָּה
  choice: 你
  rationale: 独立的第二人称阳性单数代词构成直接而有强调意味的回答；汉语“你”足以传达其简洁有力的语气。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；采用“雅威”作为其常见学术音译，以神名而非称号呈现，同时不把经文中的神名替换为“主”。
translation_notes:
  register: 采用现代、庄重而易懂的叙事体。连续问答以“问”“又问”标明说话关系，避免汉语中代词指向含混；保留“雅威如此说”的先知性传信公式。
