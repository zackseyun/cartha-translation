base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/006.yaml
  text: The lowest story was five cubits wide[a], the middle one six cubits wide, and the third seven cubits wide; for he made offsets around the outside of the temple[b], so that the beams would not be inserted into the walls of the temple.
translation:
  language: zh_hans
  text: 侧房的最下层宽五肘，中层宽六肘，第三层宽七肘；因为他在殿外墙四周作了退台[a]，以免梁木嵌入殿墙[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “退台”也可译作“凹进处”或“壁阶”。此词指殿外墙上为承托侧房而设置的退缩构造；其具体形制不能完全确定。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“以免接合在殿的墙中”；“梁木”是根据建筑语境补出的。
    reason: implicit_subject
lexical_decisions:
- source_word: היצוע הַתַּחְתֹּנָה
  choice: 下层
  rationale: היצוע 在本段指环绕圣殿的侧房建筑层级；与“中层、第三层”的次序相应，译作“下层”简洁自然。
- source_word: בָּאַמָּה רָחְבָּהּ
  choice: 宽……肘
  rationale: 保留古代长度单位“肘”，并按现代汉语习惯表达宽度。
- source_word: הַתִּיכֹנָה / הַשְּׁלִישִׁית
  choice: 中层 / 第三层
  rationale: 两个阴性形式承接前文所指的建筑层级；补出“层”可使汉语指代清楚。
- source_word: מִגְרָעוֹת
  choice: 逐层收进的墙阶
  rationale: 该词在此指外墙逐层内收所形成、可承托侧房梁木的阶状退台；此译比单说“凹槽”更符合上下层宽度递增的建筑语境，同时在脚注保留其他可能表述。
- source_word: לַבַּיִת סָבִיב חוּצָה
  choice: 在殿的外墙四周
  rationale: 原文意为在这座房屋外围四周；上下文明确是圣殿，译作“殿”，并用“外墙四周”自然呈现空间关系。
- source_word: לְבִלְתִּי אֲחֹז בְּקִירוֹת הַבָּיִת
  choice: 免得梁木嵌入殿墙
  rationale: 原文直译近于“为不抓住/接合在殿的墙中”。“梁木”由建筑语境补出，以说明侧房的承托构件，但用脚注标明原文未明说。
