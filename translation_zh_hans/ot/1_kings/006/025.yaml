  text: And the second cherub was ten cubits[a]; both cherubim had one measure and one form.
translation:
  language: zh_hans
  text: 第二个基路伯也是十肘；两个基路伯的尺寸和形状都相同。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעֶשֶׂר בָּאַמָּה
  choice: 也是十肘
  rationale: 原文只给出十肘这一尺寸，并未明说是高度；结合上节，译作“也是十肘”既承接比较，也避免增添“高”。
- source_word: הַכְּרוּב הַשֵּׁנִי
  choice: 第二个基路伯
  rationale: 按原文的定冠词、单数名词和序数词直译；“基路伯”采用现代中文圣经语境中通行的名称。
- source_word: מִדָּה אַחַת
  choice: 尺寸……相同
  rationale: מִדָּה在此指度量、尺寸；希伯来语“一样的度量”在现代汉语中自然表达为“尺寸相同”。
- source_word: וְקֶצֶב אֶחָד
  choice: 形状都相同
  rationale: קֶצֶב在此可指形状、式样或比例。“形状”清楚自然，同时不把词义过度限定为比例。
- source_word: לִשְׁנֵי הַכְּרֻבִים
  choice: 两个基路伯的
  rationale: 原文直译为“对于两个基路伯”；改用汉语领属结构，准确表达相同的尺寸和形状适用于二者。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“也是”体现本节与上节第一个基路伯的对应关系；不补入原文未明确说明的“高”。句末将“一个尺寸、一个形状”按汉语习惯表达为“尺寸和形状都相同”。
