translation_notes:
  register: 采用现代、庄重而易懂的圣殿建筑用语。“殿”依上下文明确הַבַּיִת所指；“贴”“包贴”避免现代工业色彩较强的“镀”。脚注标记按首次相关位置排列为[a]、[c]、[b]，各标记均在正文出现。
