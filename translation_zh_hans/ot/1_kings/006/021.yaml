base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/021.yaml
  text: Solomon overlaid the inside of the house with pure gold[a], and he drew gold chains across the front of the inner sanctuary[c][b], and overlaid it with gold.
translation:
  language: zh_hans
  text: 所罗门用纯金[a]包覆殿的内部，又在内殿[c]前横拉金链[b]，并用金包覆它[d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“精炼的金”。希伯来语直译为“封闭的金”，是指优质黄金的习语。
    reason: lexical_alternative
  - marker: b
    text: 也可较直译为“使金链经过内殿前”。原文可能是说把金链安置在内殿前；“横拉”反映该动词“使经过”的可能含义。
    reason: alternative_reading
  - marker: c
    text: “内殿”指圣殿最里面的房间，后来称为“至圣所”。
    reason: cultural_note
  - marker: d
    text: “它”所指在原文中略有含混；可指内殿，也可能指前文所说的殿或与内殿相关的部分。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְצַף
  choice: 贴了
  rationale: צפה在圣殿建造语境中指在表面覆上一层材料；“贴”能自然表达以金覆盖内壁，且不暗示现代电镀工艺。
- source_word: הַבַּיִת מִפְּנִימָה
  choice: 殿的内壁
  rationale: הַבַּיִת字面为“房屋”，此处明确指圣殿；מִפְּנִימָה指内部。结合“贴金”的动作，译为“殿的内壁”符合汉语表达，也呈现所覆盖的内部表面。
- source_word: זָהָב סָגוּר
  choice: 纯金
  rationale: 该短语字面近于“封闭的金”，是表示优质或精炼黄金的习语；“纯金”简洁自然，脚注保留“精炼的金”这一可能表达。
- source_word: וַיְעַבֵּר
  choice: 横拉
  rationale: עבר的使役形意为“使经过”；与金链及内殿前方连用时，很可能描述把链条横向牵拉过去。“横拉”既保留动作感，也避免把具体用途说得过明。
- source_word: בְרַתּוּקוֹת
  choice: 金链
  rationale: רַתּוּקוֹת是罕见名词，此处通常理解为链条；介词短语中的זָהָב说明其为金制。
- source_word: לִפְנֵי הַדְּבִיר
  choice: 在内殿前
  rationale: לִפְנֵי可直译为“在……前”；结合“横拉”自然表达链条横跨内殿前方，同时脚注说明较直译的空间理解。
- source_word: הַדְּבִיר
  choice: 内殿
  rationale: דְּבִיר指圣殿最里面的房间。“内殿”简洁、庄重且合乎上下文；脚注说明它后来称为至圣所。
- source_word: וַיְצַפֵּהוּ
  choice: 并用金包贴内殿
  rationale: 阳性单数宾语后缀最自然地回指刚提到的דְּבִיר（内殿），但具体所指仍略有含混。“包贴内殿”在正文中给出最可能所指，且不细化究竟是房间整体、入口还是相关隔断。
