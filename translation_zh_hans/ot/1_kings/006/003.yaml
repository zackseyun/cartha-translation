base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/003.yaml
  text: The portico in front of the nave of the house was twenty cubits long[a], across the width of the house[c][b], and ten cubits deep in front of the house.
translation:
  language: zh_hans
  text: 殿宇正殿[a]前的门廊[b]，沿着殿宇的宽度长二十肘；在殿宇前，进深十肘[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “正殿”指圣殿建筑的主体大厅，与门廊和内殿有别。
    reason: lexical_alternative
  - marker: b
    text: “门廊”也可译作“廊子”或“前厅”。
    reason: lexical_alternative
  - marker: c
    text: “进深”原文直译为“它的宽度”；这里指门廊从殿前向外延伸的尺寸。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָאוּלָם
  choice: 门廊
  rationale: אוּלָם指正殿前的入口建筑；“门廊”是现代汉语中自然、清楚的建筑用语，又不预设它是完全封闭的室内空间。
- source_word: עַל־פְּנֵי
  choice: 前面／前
  rationale: 该短语表达空间位置，译作“前面”或“前”自然地呈现门廊与殿宇的相对方位。
- source_word: הֵיכַל
  choice: 正殿
  rationale: 此处指圣殿建筑的主体大厅，与门廊及内殿有别；“正殿”能简明表达这一建筑区分。
- source_word: הַבַּיִת
  choice: 殿宇
  rationale: בַּיִת本义为“房屋”，在本段明确指圣殿建筑；“殿宇”既符合语境，也保留建筑物本身的含义。
- source_word: עֶשְׂרִים אַמָּה / עֶשֶׂר בָּאַמָּה
  choice: 二十肘／十肘
  rationale: 保留原文的古代长度单位，不以现代单位作未经说明的换算；第二处介词ב用于度量表达，无须逐字另译。
- source_word: עַל־פְּנֵי רֹחַב הַבָּיִת
  choice: 沿殿宇的宽度
  rationale: 说明门廊二十肘的长度横向对应殿宇正面的宽度；这一译法简洁呈现尺寸关系。
- source_word: רָחְבּוֹ
  choice: 进深
  rationale: 词面义为“它的宽度”，但就位于殿前的门廊而言，这十肘是从殿面向外的前后尺寸；“进深”能避免与殿宇横向宽度混淆，同时以脚注保留原文字面信息。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的建筑表述。“殿宇”避免把בַּיִת机械译成日常意义的“房屋”；“沿……宽度”和“进深”分别区分横向与前后两项尺寸。句式保留希伯来文以门廊为主题的尺寸说明，同时使汉语读来顺畅。
