  text: For the entrance of the inner sanctuary he made doors of olivewood[a]; the doorposts and jambs were five-sided.
translation:
  language: zh_hans
  text: 至于内殿的入口，他做了橄榄木门；门框和门柱呈五边形[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“门框和门柱占五分之一。”这是传统译法，但其所指的建筑结构不明确。
    reason: 原文末句极为简略，חֲמִשִׁית 可理解为“五边形的”，也可能表示“第五”或“五分之一”；正文采用形状解释，脚注保留传统的比例解释。
lexical_decisions:
- source_word: פֶּתַח
  choice: 入口
  rationale: 该词指供人出入的开口或入口，与后文表示门扇的 דַּלְתוֹת 区分开来。
- source_word: הַדְּבִיר
  choice: 内殿
  rationale: 在圣殿语境中指最里面的圣所；“内殿”简明自然，也不以较晚的礼仪术语取代原文。
- source_word: דַּלְתוֹת
  choice: 门
  rationale: 原文为复数，可能指成对的门扇；现代汉语用“门”即可自然涵盖，不必采用生硬的技术用语。
- source_word: עֲצֵי שָׁמֶן
  choice: 橄榄木
  rationale: 这一构词短语按惯用义指橄榄树的木材，“橄榄木”是现代汉语中准确自然的材料名称。
- source_word: הָאַיִל
  choice: 门框
  rationale: 该词在建筑语境中可指门框构件或支撑结构；译作“门框”可与相邻的 מְזוּזוֹת 保持一定区别。
- source_word: מְזוּזוֹת
  choice: 门柱
  rationale: 该词通常指门口两侧的柱或框柱；“门柱”既符合建筑语境，也与“门框”形成可理解的搭配。
- source_word: חֲמִשִׁית
  choice: 呈五边形
  rationale: 原文极为简略，字面与句法均有歧义；在建筑语境中，这可能描述入口结构的五边形状。“呈五边形”表达这一较可能的理解，同时以脚注保留传统异译。
