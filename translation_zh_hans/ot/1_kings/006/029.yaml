base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/029.yaml
  text: He carved all the walls of the house all around with engraved figures of cherubim[a], palm trees, and open flowers[c][b], on the inner and outer walls.
translation:
  language: zh_hans
  text: 他把殿[b]四围所有的墙壁，从里面到外面，都雕刻上基路伯、棕榈树和开放的花朵[a]图案。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“绽放的花朵”或“展开的花朵”。原文指花卉装饰图案，但具体形态不能确定。
    reason: lexical_alternative
  - marker: b
    text: 原文作“房屋”；在这里是对圣殿建筑的常用称呼。
    reason: cultural_note
lexical_decisions:
- source_word: קִירוֹת הַבַּיִת
  choice: 殿内……所有的墙壁
  rationale: בַּיִת直译为“房屋”，但在所罗门建殿的语境中指圣殿建筑；正文采用自然明确的“殿”，脚注保留原文用词。
- source_word: מֵסַב
  choice: 四周
  rationale: 表达环绕、遍及各面的范围，符合现代汉语建筑描写。
- source_word: קָלַע פִּתּוּחֵי מִקְלְעוֹת
  choice: 雕刻了……等图案
  rationale: 这一组词强调经过雕琢的装饰性图像；中文以“雕刻……图案”自然传达其工艺和具象内容，不过度限定为浮雕或阴刻。
- source_word: כְּרוּבִים
  choice: 基路伯
  rationale: 采用现代中文圣经语境中通行的音译，指与圣所和约柜相关的天上活物。
- source_word: תִמֹרֹת
  choice: 棕树
  rationale: 该词在装饰艺术中表示棕树形象；“棕树”清楚自然。
- source_word: פְטוּרֵי צִצִּים
  choice: 盛开的花朵
  rationale: 表达展开、开放的花形装饰；具体艺术形态并不确定，因此脚注列出较宽泛的理解。
- source_word: מִלִּפְנִים וְלַחִיצוֹן
  choice: 内殿和外殿都是如此
  rationale: 在圣殿建筑语境中自然理解为内外两个区域均有上述雕饰；脚注保留“里面和外面”这一较一般的读法。
