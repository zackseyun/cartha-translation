  text: וְ/שָׁ֣כַנְתִּ֔י בְּ/ת֖וֹךְ בְּנֵ֣י יִשְׂרָאֵ֑ל וְ/לֹ֥א אֶעֱזֹ֖ב אֶת עַמִּ֥/י יִשְׂרָאֵֽל־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/013.yaml
  text: And I will dwell among the children of Israel[a], and I will not forsake my people Israel.
translation:
  language: zh_hans
  text: 我将住在以色列人[a]中间，不离弃我的子民以色列。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译“以色列的儿女”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁכַנְתִּי
  choice: 我要住在
  rationale: שׁכן表示居住、安居；用于上帝与其子民同在时含有立约临在的意味。“住在”在现代汉语中自然清楚，又保留这一语义分量。
- source_word: בְּתוֹךְ
  choice: 中间
  rationale: 与群体名称连用时表示身处群体之中；“在……中间”准确表达上帝临在于以色列群体当中，而不额外限定其临在方式。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 原文字面为“以色列的儿女”，在此是整个以色列群体的惯用称呼。“以色列人”符合现代汉语，并避免误解为仅指直系子女或男性。脚注保留其字面形式。
- source_word: וְלֹא אֶעֱזֹב
  choice: 也不离弃
  rationale: עזב在关系和立约语境中可指抛下、弃绝；“离弃”保留应许中的关系与立约意味。“也”自然承接前一分句。
- source_word: עַמִּי
  choice: 我的子民
  rationale: 这是立约关系中的所属表达。“我的子民”既准确，又比一般的“我的人民”更能体现此处的圣经语境。
- source_word: יִשְׂרָאֵל
  choice: 以色列
  rationale: 按现代汉语通行译名处理专名；此处与“我的子民”同位，保留原文措辞。
theological_decisions:
- issue: 圣殿语境中的上帝居住与临在
  choice: 译作“我要住在以色列人中间”
  alternative: “我要居住在以色列人当中”或“我要住在以色列人之中”
  rationale: 经文在圣殿建造的语境中应许上帝与其子民同在，但措辞着重于他在以色列群体中间的临在，并未说明其临在仅局限于圣殿。译文保留这一张力，不加入后来的形而上或宗派性解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“我要……也不……”保留第一人称神圣应许的直接语气；“子民”延续立约语境，但整体句式不作古雅化处理。
