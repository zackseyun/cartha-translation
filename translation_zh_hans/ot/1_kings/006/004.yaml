  text: 他为殿造了内收式、封闭式的窗户[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里的两个希伯来语建筑术语十分罕见，确切含义和彼此关系不能确定。“内收式、封闭式”是暂定译法。这个短语传统上也译作“有斜削边框、封闭的窗户”、“窗框逐渐收窄的窗户”，或理解为“里面宽、外面窄的窗户”。第二个词也可能指固定、封住，或装有格栅；因此无法确定这些窗户的具体构造。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: 他……造了
  rationale: 叙事体 wayyiqtol，表达过去发生的动作；中文以“造了”自然承接上下文。
- source_word: לַבָּיִת
  choice: 为殿
  rationale: 介词 ל 与“造”连用，宜译“为”；בַּיִת 在本段特指圣殿建筑，译作“殿”比“房屋”更自然明确。
- source_word: חַלּוֹנֵי
  choice: 窗户
  rationale: חַלּוֹן 的复数附属形式，通常指窗或窗洞；“窗户”是现代汉语的自然表达。
- source_word: שְׁקֻפִים
  choice: 带内收边框的
  rationale: 这是罕见的建筑术语，可能指内缩、斜削或逐渐收窄的窗框、窗侧；“内收边框”提供可理解的建筑形象，同时不把具体构造说得过于确定。
- source_word: אֲטֻמִים
  choice: 纳入“内收边框”的整体表述
  rationale: 该词源于 אטם，基本义与封闭、堵住有关，但在此罕见建筑短语中其准确功能不明。正文避免另加确定的“封死”，以免误导；不确定性在脚注中说明。
