base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/023.yaml
  text: In the inner sanctuary he made two cherubim of olivewood[b][a], each ten cubits high.
translation:
  language: zh_hans
  text: 他在内殿[a]用橄榄木造了两个基路伯，每个高十肘[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“至圣所里”。
    reason: lexical_alternative
  - marker: b
    text: 原文直译：“它的高度是十肘”；这里的单数按分配意义理解，指两个基路伯各自的高度。
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּדְּבִיר
  choice: 在内殿
  rationale: דְּבִיר 指圣殿最里面的房间。“内殿”简洁、自然，也保留了其作为内部圣所的空间含义。
- source_word: כְרוּבִים
  choice: 基路伯
  rationale: 采用现代中文圣经语境中对这种特定天上活物的通行名称，避免将其泛化为普通“天使”。
- source_word: עֲצֵי שָׁמֶן
  choice: 用橄榄木
  rationale: 该短语指橄榄树的木材；“橄榄木”在现代汉语中清楚自然。
- source_word: עֶשֶׂר אַמּוֹת
  choice: 十肘
  rationale: אַמָּה 是古代长度单位，中文通常译作“肘”；保留原单位比换算成现代长度更忠实。
- source_word: קוֹמָתוֹ
  choice: 每个高十肘
  rationale: 原文直译为单数“它的高度是十肘”，但所述对象为两个基路伯；将单数按分配意义译为“每个”，使中文自然，同时以脚注保留原文形式。
- source_word: וַיַּעַשׂ
  choice: 造了
  rationale: עשה 是常用的“做、制造”；在制作木雕的语境中，“造了”简明贴切。
