  yaml_path: translation/ot/1_kings/006/034.yaml
  text: and two doors of cypress wood[a]; the one door had two folding leaves[b], and the second door had two folding leaves.
translation:
  language: zh_hans
  text: 又用柏木[a]做了两扇门；第一扇门有两片可折转的门扇[b]，第二扇门也有两片可折转的门扇。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “柏木”也可译作“冷杉木”；希伯来词所指的具体针叶树种不能确定。
    reason: lexical_alternative
  - marker: b
    text: 这里的希伯来建筑术语罕见，原文也可理解为：每扇门有两块侧板，可以转动。通常认为这是两片能够折叠或转动的门扇。
    reason: lexical_alternative
lexical_decisions:
- source_word: דַלְתוֹת
  choice: 两扇门
  rationale: 该复数名词指两组门体；下文用单数分别描述每一扇门。
- source_word: עֲצֵי בְרוֹשִׁים
  choice: 柏木
  rationale: בְּרוֹשׁ指一种针叶树木材，常理解为柏木或近似树种；“柏木”符合现代汉语圣殿建筑语境，同时以脚注保留树种的不确定性。
- source_word: צְלָעִים / קְלָעִים
  choice: 门扇
  rationale: 两词在本节均为罕见的建筑术语，彼此平行，似指每扇门的两个活动部分；“门扇”自然清楚，但不强行判定其具体构造。
- source_word: גְּלִילִים
  choice: 可折转的
  rationale: 该词含滚动、转动之意，而上下文可能描写折叠式或枢轴转动式门扇；“折转”兼顾常见的折叠门理解与原词的转动含义。
- source_word: הַדֶּלֶת הָאַחַת / הַדֶּלֶת הַשֵּׁנִית
  choice: 第一扇门 / 第二扇门
  rationale: 以自然的现代汉语表达两扇门之间的对应关系，并保留原文先后对举的结构。
