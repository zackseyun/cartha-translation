base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/024.yaml
  text: And five cubits was the one wing of the cherub[a], and five cubits the second wing of the cherub; ten cubits from the end of its wings to the end of its wings.
translation:
  language: zh_hans
  text: 基路伯的一只翅膀长五肘，第二只翅膀也长五肘；从它翅膀的一端到另一端，共十肘。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“从它翅膀的末端，直到它翅膀的末端”，指从一个翼尖到另一个翼尖的全部跨度。
    reason: 说明原文重复结构及其所表达的完整翼展。
lexical_decisions:
- source_word: חָמֵשׁ אַמּוֹת
  choice: 五肘
  rationale: 这是建筑尺寸的常规表达；“肘”是现代中文圣经语境中对古代长度单位אַמָּה的通行译法。
- source_word: כְּנַף
  choice: 翅膀
  rationale: 在基路伯造像的语境中，该词明确指翅膀，而非泛指边缘或末端。
- source_word: הַכְּרוּב
  choice: 基路伯
  rationale: 采用现代中文圣经中对单数כְּרוּב的通行音译，指这里单个雕刻的天上活物形象。
- source_word: הָאֶחָת ... הַשֵּׁנִית
  choice: 一只……第二只
  rationale: 保留原文“一只”与“第二只”的不完全对称表达，同时在中文中清楚指向同一基路伯的两只翅膀。
- source_word: עֶשֶׂר אַמּוֹת
  choice: 共十肘
  rationale: “共”自然表明这是两翼展开后的总宽度，未增加原文之外的尺寸。
- source_word: מִקְצוֹת כְּנָפָיו וְעַד קְצוֹת כְּנָפָיו
  choice: 从它翅膀的一端到另一端
  rationale: 原文重复“它翅膀的末端”，表达从一个翼端到另一个翼端的跨度；中文采用自然且不失准确的对应说法。
- source_word: כְּנָפָיו
  choice: 它翅膀
  rationale: 希伯来语后缀为阳性单数，所指是基路伯造像；中文用“它”避免无根据地强调人格性别。
theological_decisions: []
