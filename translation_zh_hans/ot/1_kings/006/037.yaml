  text: בַּ/שָּׁנָה֙ הָֽ/רְבִיעִ֔ית יֻסַּ֖ד בֵּ֣ית יְהוָ֑ה בְּ/יֶ֖רַח זִֽו׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/037.yaml
  text: In the fourth year[a], the house of Yahweh was founded in the month of Ziv.
translation:
  language: zh_hans
  text: 第四年，雅威的殿宇在西弗月奠基。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בַּשָּׁנָה הָרְבִיעִית
  choice: 第四年
  rationale: 直接保留希伯来文的时间表达；所罗门在位的信息由上下文提供，本节没有明说，因此不补入正文。
- source_word: יֻסַּד
  choice: 根基立定了
  rationale: 该动词是יסד的被动式，在建筑语境中表示奠基、立定根基。汉语用“根基立定了”既自然，也明确表达原文未另列出的基础含义。
- source_word: בֵּית יְהוָה
  choice: 雅威殿
  rationale: בַּיִת本义为“房屋”，在此特指圣殿。现代汉语“雅威殿”简洁清楚，并保留其属于雅威的关系。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以“雅威”音译四字神名，区别于称号“主”，并与所给项目方针一致。
- source_word: בְּיֶרַח זִו
  choice: 时在西弗月
  rationale: יֶרַח意为“月”，זִו是月份专名；不把上一节所说的“二月”补入本节。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名。译作“雅威”可把专名与“主”这一称号区分开来，也不引入额外的教派性解释。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。“雅威殿”比直译“雅威的房屋”更符合中文圣殿建筑语境；“根基立定了”保留被动奠基的含义。
