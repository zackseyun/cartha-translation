base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/018.yaml
  text: The cedar on the inside of the house was carved with gourds and open flowers[a]. Everything was cedar[b]; no stone was visible.
translation:
  language: zh_hans
  text: 殿内的香柏木板上雕刻着瓜形饰纹[a]和绽放的花朵[b]。殿内全都是香柏木，看不见石头。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “瓜形饰纹”或译“花蕾饰纹”。这个希伯来词指圆形的装饰图案；在这里可能是瓜形雕饰。
    reason: lexical_alternative
  - marker: b
    text: “绽放的花朵”或译“花朵（饰纹）”。希伯来语很可能指雕刻成开放、绽放形态的花卉。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶרֶז
  choice: 香柏木
  rationale: 该词指香柏木材或木板；在圣殿内部装饰的语境中译作“香柏木”自然、明确。
- source_word: אֶל־הַבַּיִת פְּנִימָה
  choice: 殿内铺着
  rationale: 该短语定位于建筑内部表面；结合下文石头完全不可见，译文明确表达内壁由木板铺覆。
- source_word: מִקְלַעַת
  choice: 雕刻着
  rationale: 该词表示雕刻或镌刻的装饰工艺；“雕刻着”符合现代汉语建筑装饰语境。
- source_word: פְּקָעִים
  choice: 瓜形饰纹
  rationale: 该词在圣殿描述中很可能指圆润的瓜形装饰；加“形饰纹”避免让人误解为真实的瓜，同时保留形状含义。
- source_word: וּפְטוּרֵי צִצִּים
  choice: 和盛开的花朵
  rationale: 该词组描述花卉形的雕饰，可能强调开放或绽放的花；此译法自然，并保留其花开形态。
- source_word: הַכֹּל אֶרֶז
  choice: 里面全都用香柏木覆盖
  rationale: 这句话概括可见的内部表面全由香柏木遮盖；补出“覆盖”与下句看不见石头的语境相连。
- source_word: אֵין אֶבֶן נִרְאָה
  choice: 看不见一块石头
  rationale: 自然地保留了原文“没有石头可见”的意思，并突出覆盖得完全。
theological_decisions: []
