  to: 殿内的香柏木板上雕刻着瓜形饰纹[a]和绽放的花朵[b]。殿内全都是香柏木，看不见石头。
  rationale: 修订仅消除“铺着”可能造成的地面铺装歧义，改为直接说明香柏木板位于殿内并带有雕饰；“殿内全都是香柏木，看不见石头”保留原文对香柏木全面遮盖石材的概括。脚注维持瓜形/花蕾及开放花卉的词汇不确定性。
