base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/007.yaml
  text: The house[a], when it was built, was built of finished stone quarried in advance; and no hammer or axe or any iron tool was heard in the house while it was being built.
translation:
  language: zh_hans
  text: 这座殿建造时，是用预先备妥的整块石头[a]建造的。建造期间，殿内没有听见锤子、斧子或任何铁制工具的声音。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“采石场预备好的石头”或“从采石场运来的石头”。希伯来语 מַסָּע 是一个含义不完全确定的专门词，可能指采石，也可能指石头在采石场已经预备妥当后运来。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבַּיִת
  choice: 这殿
  rationale: 该词本义为“房屋”，但本节语境明确指耶和华的殿；现代汉语用“这殿”既自然，也不必增添原文未明说的“耶和华”。
- source_word: בְּהִבָּנֹתוֹ
  choice: 建造时／建造期间
  rationale: 带介词 בְּ 的不定词结构表示时间情境。原文前后两次出现，分别译作“建造时”和“建造期间”，以自然汉语表达同一时间意义。
- source_word: אֶבֶן שְׁלֵמָה
  choice: 凿好的石头
  rationale: שְׁלֵמָה 表示完整、完备；在建筑语境中，指石料在运到施工处以前已经加工妥当。“凿好的石头”能清楚传达这一建筑意义。
- source_word: מַסָּע
  choice: 在采石场
  rationale: 这是一个含义不完全确定的专门词，可能关联采石场、采凿或石料从采石场运出。正文采用最符合上下文的地点性表达，并以脚注保留另一种理解。
- source_word: נִבְנָה
  choice: 建成的
  rationale: Nifal 完成式说明殿建造所用的材料和方式；“建成的”符合现代汉语句法。
- source_word: מַקָּבוֹת
  choice: 锤子
  rationale: 虽然希伯来词形为复数，这里是在列举工具类别；汉语用单数类称“锤子”自然清楚。
- source_word: הַגַּרְזֶן
  choice: 斧子
  rationale: 通常指斧一类的工具；虽也可能具体指锛等工具，“斧子”是最直接、稳妥的对应。
- source_word: כָּל כְּלִי בַרְזֶל
  choice: 任何铁制工具
  rationale: כָּל 在此具有周遍、无一例外之意；“任何铁制工具”准确表达其概括范围。
- source_word: לֹא נִשְׁמַע
  choice: 听不见……的声音
  rationale: שמע 的 Nifal 表示“被听见”。“听不见……的声音”在汉语中自然地保留被动感知和否定意义。
theological_decisions: []
