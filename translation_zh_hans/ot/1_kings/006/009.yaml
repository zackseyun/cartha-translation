  text: So he built the house and finished it, and he covered the house with beams and rows of cedar.
translation:
  language: zh_hans
  text: 他建造殿宇，并完成了建造；又用香柏木梁和成排的香柏木料覆盖殿宇。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַבַּיִת
  choice: 殿宇
  rationale: 本段语境所指为耶和华的殿；“殿宇”既明确其建筑性质，也保持庄重自然。
- source_word: וַיְכַלֵּהוּ
  choice: 直到完工
  rationale: 保留“建造”与“完成”两个动作，同时避免现代汉语中“建造……把它完成”的生硬重复。
- source_word: גֵבִים
  choice: 梁
  rationale: 该词在此处指屋顶结构中的木质构件；译作“梁”符合上下文，并避免添加原文未明说的具体形制。
- source_word: שְׂדֵרֹת
  choice: 成排的木板
  rationale: 该词基本含义与“排列、成行”有关；结合建筑语境，以“成排的木板”表达用于铺盖的平行木构件，同时保留“成排”这一形象。
- source_word: בָּאֲרָזִים
  choice: 用香柏木的
  rationale: 表示材料，语法上自然统摄“梁”和“成排的木板”。
- source_word: וַיִּסְפֹּן
  choice: 铺盖
  rationale: 在建筑语境中表示以木材覆盖或铺设；“铺盖”不强行限定为内衬、天花板或屋顶表层。
