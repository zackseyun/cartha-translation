  yaml_path: translation/ot/1_kings/006/017.yaml
  text: And the house[a], that is, the nave before the inner sanctuary, was forty cubits long.
translation:
  language: zh_hans
  text: 殿宇[a]，就是内殿前面的正殿，长四十肘。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“殿宇，也就是前面的正殿”。原文进一步把“殿宇”说明为הֵיכָל，即内殿前面的主要厅堂；“内殿”是根据上文补明的。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַרְבָּעִים בָּ/אַמָּה
  choice: 长四十肘
  rationale: אַרְבָּעִים表示“四十”，אַמָּה是长度单位“肘”；结合建筑尺寸的语境补出“长”，符合现代汉语表达。句首的וְ承接上文，在中文中无需机械译出。
- source_word: הַ/בָּיִת
  choice: 殿宇
  rationale: בַּיִת本义为“房屋”，在这里指圣殿建筑；译作“殿宇”既保留建筑物的含义，也符合本段语境。
- source_word: ה֖וּא
  choice: 就是
  rationale: 此处代词具有同位解释作用，进一步说明“殿宇”所指的具体部分；“就是”自然传达这一功能。
- source_word: הַ/הֵיכָל
  choice: 正殿
  rationale: הֵיכָל在此指内殿之外的主要厅堂。“正殿”比音译或教会传统术语更易懂，也能体现其作为主体空间的建筑含义。
- source_word: לִ/פְנָֽ/י
  choice: 内殿前面的
  rationale: 该词表示“在……前面”，所指对象由上一节的内殿补明。这样处理使空间关系清楚，同时不把הֵיכָל误解为整个圣殿。
- source_word: הָיָה
  choice: 长
  rationale: 原文使用存在动词表达尺寸；现代汉语描述建筑长度时自然译为“长”，而不必另译“是”。
theological_decisions: []
