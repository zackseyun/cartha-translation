  terminology: “布勒月”是适当的月份专名音译；“殿宇”在本段语境中恰当地指圣殿。“细节和规定”可覆盖דְּבָרָיו与מִשְׁפָּטוֹ在建筑语境下的范围，脚注保留“既定样式”的可行替代。
