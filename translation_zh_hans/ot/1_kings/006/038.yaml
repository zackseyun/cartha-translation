base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/038.yaml
  text: And in the eleventh year[a], in the month of Bul (that is, the eighth month), the house was finished in all its parts and according to all its specifications[b]. So he built it in seven years.
translation:
  language: zh_hans
  text: 第十一年，布勒月，就是第八个月，殿宇按着一切细节和规定都完成了[a]。所罗门建造这殿共用了七年。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“殿完全照着各项细节和既定样式建成了。”
    reason: 保留לְכָל דְּבָרָיו וּלְכָל מִשְׁפָּטוֹ在建筑语境中可理解为细节、规定或既定样式的词义幅度。
lexical_decisions:
- source_word: בַּשָּׁנָה הָאַחַת עֶשְׂרֵה
  choice: 第十一年
  rationale: 按现代汉语惯用的序数表达，准确保留年代信息。
- source_word: בְּיֶרַח בּוּל
  choice: 布勒月
  rationale: יֶרַח在此意为“月”，בּוּל是古代月份专名，采用音译。
- source_word: הוּא הַחֹדֶשׁ הַשְּׁמִינִי
  choice: 就是第八个月
  rationale: 自然表达原文同位解释的作用，说明布勒月在历法中的次序。
- source_word: כָּלָה הַבַּיִת
  choice: 殿……都完工了
  rationale: כלה在建造语境中指完成；הבית在本段明确指耶和华的殿，译作“殿”比孤立的“房屋”自然且清楚。
- source_word: לְכָל דְּבָרָיו
  choice: 殿的一切部分
  rationale: דבר在建筑语境中可指各项细节或组成部分；此译法清楚而不按字面误译为“话语”。
- source_word: וּלְכָל מִשְׁפָּטוֹ
  choice: 也都符合各项规定
  rationale: משפט在此指建筑所依循的规定、规范或既定样式；“符合各项规定”保留其规范性，同时避免误解为司法判决。
- source_word: וַיִּבְנֵהוּ
  choice: 所罗门建造这殿
  rationale: 原文主语承接上下文为所罗门；现代汉语补明主语可避免歧义，“这殿”对应宾语代词。
- source_word: שֶׁבַע שָׁנִים
  choice: 共用了七年
  rationale: 自然表达整个建造过程持续七年，并体现句末总结意味。
theological_decisions: []
