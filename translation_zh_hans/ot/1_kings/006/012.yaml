source:
  edition: WLC
  text: הַ/בַּ֨יִת הַ/זֶּ֜ה אֲשֶׁר אַתָּ֣ה בֹנֶ֗ה אִם תֵּלֵ֤ךְ בְּ/חֻקֹּתַ/י֙ וְ/אֶת מִשְׁפָּטַ֣/י תַּֽעֲשֶׂ֔ה וְ/שָׁמַרְתָּ֥ אֶת כָּל מִצְוֺתַ֖/י לָ/לֶ֣כֶת בָּ/הֶ֑ם וַ/הֲקִמֹתִ֤י אֶת דְּבָרִ/י֙ אִתָּ֔/ךְ אֲשֶׁ֥ר דִּבַּ֖רְתִּי אֶל דָּוִ֥ד אָבִֽי/ךָ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/012.yaml
  text: As for this house that you are building[a], if you walk in my statutes, carry out my judgments, and keep all my commandments by walking in them, then I will establish my word with you, which I spoke to David your father.
translation:
  language: zh_hans
  text: 至于你正在建造的这殿，如果你按我的律例而行，实行我的典章，谨守我的一切诫命，遵照这些诫命而行，我就必向你坚立我的话[a]，就是我对你父亲大卫所说的话。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“向你证实我的话”或“向你兑现我的应许”。希伯来语“坚立我的话”是指确认并使先前所说的话成立。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבַּיִת הַזֶּה
  choice: 这殿
  rationale: בַּיִת直译为“房屋、家”，在本节明确指所罗门正在建造的圣殿；“殿”既自然，又保留其作为耶和华居所的语境含义，而不必增添“圣”字。
- source_word: אֲשֶׁר אַתָּה בֹנֶה
  choice: 你正在建造的
  rationale: 分词בֹנֶה表示正在进行的建造行动；“正在建造”准确传达其持续性。
- source_word: אִם תֵּלֵךְ בְּחֻקֹּתַי
  choice: 如果你按我的律例而行
  rationale: הלך与介词ב连用，指人的行为方式或生活操守；“按……而行”在现代汉语中自然，并保留盟约语境中的“行走”意象。
- source_word: מִשְׁפָּטַי תַּעֲשֶׂה
  choice: 实行我的典章
  rationale: מִשְׁפָּטִים在此指具有约束力的判例、法令或规范；“典章”保留法律与盟约色彩，“实行”自然表达תעשה的付诸行动。
- source_word: וְשָׁמַרְתָּ אֶת כָּל מִצְוֺתַי
  choice: 谨守我的一切诫命
  rationale: שׁמר与诫命连用时表示留心遵守；“谨守”兼顾审慎守护与切实服从的语义。
- source_word: לָלֶכֶת בָּהֶם
  choice: 照着它们而行
  rationale: 不定式说明谨守诫命在生活中的落实方式；“照着它们而行”保留本节重复出现的הלך意象，也符合现代汉语表达。
- source_word: וַהֲקִמֹתִי אֶת דְּבָרִי אִתָּךְ
  choice: 我就必向你坚立我所说的话
  rationale: הקים דבר是“使所说的话成立、确认或实现”的惯用表达。“坚立”贴近原文并保留其语义张力；“向你”对应אִתָּךְ，且“我所说的话”与后面的דִּבַּרְתִּי形成词义呼应。
- source_word: אֲשֶׁר דִּבַּרְתִּי אֶל דָּוִד אָבִיךָ
  choice: 就是我对你父亲大卫所说的
  rationale: דבר基本义为“说”；保留“所说的”，既与前面的“话”相呼应，也不在正文中把其含义单一限定为“应许”。
theological_decisions:
- issue: 建殿、所罗门的顺服与对大卫所说之话的条件关系
  choice: 保留原文明确的“如果……我就……”结构，表明本节将上帝向所罗门坚立其话与所罗门的盟约顺服相联系。
  alternative: 将此处仅解释为对无条件之约的重申，或解释为完全有条件并取代先前的一切应许。
  rationale: 希伯来文אִם引出清楚的条件句。译文不替经文消解大卫之约中条件性与应许坚定性之间的神学张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“至于”反映原文句首主题结构；“律例、典章、诫命”区分相关盟约法律词汇。正文保留“而行”的重复，以呈现原文两次使用הלך所形成的呼应。脚注标记置于其实际解释的“坚立我所说的话”之后。
