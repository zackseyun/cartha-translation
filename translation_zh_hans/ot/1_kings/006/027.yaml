  text: וַ/יִּתֵּ֨ן אֶת הַ/כְּרוּבִ֜ים בְּ/ת֣וֹךְ הַ/בַּ֣יִת הַ/פְּנִימִ֗י וַֽ/יִּפְרְשׂוּ֮ אֶת כַּנְפֵ֣י הַ/כְּרֻבִים֒ וַ/תִּגַּ֤ע כְּנַף הָֽ/אֶחָד֙ בַּ/קִּ֔יר וּ/כְנַף֙ הַ/כְּר֣וּב הַ/שֵּׁנִ֔י נֹגַ֖עַת בַּ/קִּ֣יר הַ/שֵּׁנִ֑י וְ/כַנְפֵי/הֶם֙ אֶל תּ֣וֹךְ הַ/בַּ֔יִת נֹגְעֹ֖ת כָּנָ֥ף אֶל כָּנָֽף־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/027.yaml
  text: He placed the cherubim inside the inner house[a], and the cherubim spread out their wings, so that the wing of the one touched the wall, and the wing of the second cherub touched the other wall; and their wings toward the middle of the house were touching wing to wing.
translation:
  language: zh_hans
  text: 他把基路伯安放在殿内的内殿[a]，基路伯展开翅膀：其中一个的翅膀碰到一面墙，第二个基路伯的翅膀碰到另一面墙；它们朝向殿中央的翅膀彼此相触。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “殿内的内殿”也可译作“内殿中”或“内圣所中”。希伯来语字面为“在内殿之中”，指圣殿最里面的部分。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: 安放
  rationale: נתן在此表示把物件放置、定位；“安放”自然庄重，也符合巨型基路伯被设置在内殿的建筑语境。
- source_word: הַכְּרוּבִים
  choice: 基路伯
  rationale: 采用现代中文圣经语境中通行的音译，保留这类天上活物的专名性质；希伯来语复数由上下文表达。
- source_word: בְּתוֹךְ הַבַּיִת הַפְּנִימִי
  choice: 在殿内的内殿
  rationale: בַּיִת字面为“房屋”，在此指圣殿；הַפְּנִימִי指内部部分。“殿内的内殿”既保留原文措辞，又让现代读者明白是圣殿最里面的空间。
- source_word: וַיִּפְרְשׂוּ אֶת כַּנְפֵי הַכְּרֻבִים
  choice: 基路伯伸展开翅膀
  rationale: 原文形式上可读作“他们展开基路伯的翅膀”，但上下文自然以基路伯为动作主体；中文采用主动表达，避免歧义和生硬。
- source_word: וַתִּגַּע / נֹגַעַת
  choice: 碰到
  rationale: נגע表示实际接触；“碰到”直接清楚，适合描述翅膀与墙面的空间关系。
- source_word: כְּנַף הָאֶחָד
  choice: 一个基路伯的翅膀
  rationale: 原文直译为“那一个的翅膀”，所指是两个基路伯中的一个；补出“基路伯”可使中文指代清楚，又不把它改成原文未明说的“第一个”。
- source_word: הַכְּרוּב הַשֵּׁנִי
  choice: 第二个基路伯
  rationale: 保留希伯来语序数“第二”的明确表达。
- source_word: הַקִּיר הַשֵּׁנִי
  choice: 另一边的墙
  rationale: 字面是“第二面墙”；在两边墙壁的对照中，“另一边的墙”更符合现代汉语，并清楚呈现空间布局。
- source_word: וְכַנְפֵיהֶם אֶל תּוֹךְ הַבַּיִת
  choice: 他们朝向殿中央的翅膀
  rationale: תּוֹךְ可指内部或中央；因下文说两翼相接，“朝向殿中央”最清楚地传达空间关系。
- source_word: נֹגְעֹת כָּנָף אֶל כָּנָף
  choice: 翼尖相接
  rationale: 原文为“翅膀与翅膀相接触”。结合两翼从两侧向中央伸展的构造，“翼尖相接”用简洁自然的中文呈现其接触位置。
theological_decisions: []
translation_notes:
  register: 采用现代、清楚而庄重的叙事语体。保留“基路伯”这一传统专名；用“这边／另一边”和“殿中央”明确原文的建筑空间关系。
