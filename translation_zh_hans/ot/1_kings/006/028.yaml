lexical_decisions:
- source_word: וַיְצַף
  choice: 包裹
  rationale: 动词צפה在圣殿建造语境中指在物件表面覆盖一层材料，尤指金属；“包裹”在现代汉语中自然明确，并保留了覆盖表面的含义。
- source_word: אֶת
  choice: 不译
  rationale: אֶת是确定直接宾语标记，现代汉语没有对应的独立词。
- source_word: הַכְּרוּבִים
  choice: 基路伯
  rationale: 采用中文圣经传统中对כְּרוּבִים的通行译名；汉语名词通常不以词形标示复数，语境承接前文所述的两个基路伯。
- source_word: זָהָב
  choice: 金子
  rationale: 该名词表示覆盖基路伯所用的材料；“用金子”自然表达希伯来语中宾语之后的材料成分。
