base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/020.yaml
  text: In front of the inner sanctuary was twenty cubits in length[a], twenty cubits in width, and twenty cubits in its height. He overlaid it with pure gold[b], and he overlaid the cedar altar.
translation:
  language: zh_hans
  text: 内殿长二十肘，宽二十肘，高二十肘。他用精金[a]包贴内殿，又用精金包贴香柏木坛[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“纯金”。希伯来语指优质、精炼的金。
    reason: lexical_alternative
  - marker: b
    text: 也可理解为“一座香柏木坛”。
    reason: lexical_alternative
lexical_decisions:
- source_word: לִפְנֵי הַדְּבִיר
  choice: 内殿内部
  rationale: הַדְּבִיר指圣殿最里面的圣所；לִפְנֵי在这里的句法较为简略。结合本节所列立方体尺寸及上下文，译作“内殿内部”最能自然表达所量空间，同时以脚注保留较直译的可能。
- source_word: הַדְּבִיר
  choice: 内殿
  rationale: 该词指圣殿最里面的圣所。“内殿”简洁、庄重，也避免在原文此处没有明说时直接采用更具解释性的“至圣所”。
- source_word: עֶשְׂרִים אַמָּה ... אֹרֶךְ / רֹחַב / קוֹמָתוֹ
  choice: 长二十肘，宽二十肘，高二十肘
  rationale: 按照希伯来文的尺寸公式直译，并保留古代计量单位“肘”，不擅自换算。
- source_word: וַיְצַפֵּהוּ
  choice: 他用……包贴内殿
  rationale: צפה在建筑语境中指用贵重材料覆盖或包覆表面。“包贴”准确表达以金材覆面的做法；将代词所指明译为“内殿”，使中文清楚。
- source_word: זָהָב סָגוּר
  choice: 精金
  rationale: 该词组指优质、精炼的金。“精金”既贴合词义，又符合庄重而易懂的经文语体。
- source_word: וַיְצַף מִזְבֵּחַ אָרֶז
  choice: 又包贴香柏木坛
  rationale: 自然理解为把香柏木制成的坛包贴起来。中文用“香柏木坛”保留原文简练结构，不额外指定坛的用途。
theological_decisions:
- issue: 是否把הַדְּבִיר直接译为“至圣所”
  choice: 内殿
  alternative: 至圣所
  rationale: “至圣所”在语境中大体正确，但“内殿”更直接对应建筑术语דְּבִיר，也较少加入后来的固定称谓。
- issue: 包贴香柏木坛的定指程度
  choice: 香柏木坛
  alternative: 一座香柏木坛
  rationale: 希伯来文名词短语未带冠词，形式上可作不定理解，但上下文也可能指特定的坛；中文省略量词可保留这种张力。
translation_notes:
  register: 采用现代、庄重而简明的普通话。尺寸排列保持希伯来文节奏；两个脚注标记分别紧随“精金”和“香柏木坛”，与注释内容准确对应。
