base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/011.yaml
  text: And the word of Yahweh came to Solomon[a], saying[b],
translation:
  language: zh_hans
  text: 雅威[a]的话临到所罗门，说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “雅威”音译希伯来文神名 יהוה（YHWH）；其古代确切读音不能完全确定，汉语也常译作“耶和华”。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי
  choice: 临到
  rationale: 这里的叙事性结构 וַיְהִי 引出随后发生的事；与 דְּבַר…אֶל 合译为“……的话临到……”，既符合现代汉语，也保留了圣经中神谕临到人的固定表达。
- source_word: דְּבַר
  choice: 话
  rationale: 在 דְּבַר יְהוָה 这一神谕公式中，指来自神的言语或信息；“话”比“信息”更贴近原词，也便于保留反复出现的公式。
- source_word: יְהוָה
  choice: 雅威
  rationale: 原文使用以色列之神的专名四字神名 YHWH；“雅威”是现代汉语中较能反映其可能读音的音译。
- source_word: אֶל
  choice: 临到
  rationale: 介词 אֶל 标明神言传达的对象；在汉语固定表达“话临到某人”中自然体现为“临到”。
- source_word: שְׁלֹמֹה
  choice: 所罗门
  rationale: 采用现代汉语中通行的人名译法。
- source_word: לֵאמֹר
  choice: 说
  rationale: 该不定式引出下一节神所说的内容；译作“说”简洁自然，并保留与下文直接引语的衔接。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 正文直接音译原文的专名，以区别于“主”这一称号；脚注同时说明汉语传统译名，避免把有争议的发音问题表述为完全确定。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。“雅威的话临到……”保留原文神谕公式；句末冒号提示神的话将在下一节展开。
