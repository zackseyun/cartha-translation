  text: קוֹמַת֙ הַ/כְּר֣וּב הָֽ/אֶחָ֔ד עֶ֖שֶׂר בָּֽ/אַמָּ֑ה וְ/כֵ֖ן הַ/כְּר֥וּב הַ/שֵּׁנִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/026.yaml
  text: The height of the one cherub was ten cubits[a], and so it was with the second cherub.
translation:
  language: zh_hans
  text: 一个基路伯高十肘[a]，第二个基路伯也是如此。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “肘”是古代的长度单位，大约相当于从手肘到指尖的距离。
    reason: cultural_note
lexical_decisions:
- source_word: קוֹמַת
  choice: 高
  rationale: 该词表示高度；在描述圣殿陈设尺寸的语境中，用“高”自然、准确，并可与后面的数值直接衔接。
- source_word: הַכְּרוּב
  choice: 基路伯
  rationale: 原文为单数，指一个基路伯形像；“基路伯”是现代中文圣经语境中通行且庄重的译法。
- source_word: הָאֶחָד
  choice: 一个
  rationale: 原文直指两个基路伯中的一个，并非明确表示次序上的“第一个”；译作“一个”保留了这一措辞。
- source_word: עֶשֶׂר בָּאַמָּה
  choice: 十肘
  rationale: 原文直接给出长度数值；前面已有“高”，无须重复“高度为”。“肘”保留古代计量单位，并以脚注解释。
- source_word: וְכֵן
  choice: 也是如此
  rationale: 该词组表示第二个与前一个相同；“也是如此”简洁自然地传达等同关系。
- source_word: הַכְּרוּב הַשֵּׁנִי
  choice: 第二个基路伯
  rationale: 原文明说“第二个”，该译法保留其明确的序数表达。
theological_decisions: []
