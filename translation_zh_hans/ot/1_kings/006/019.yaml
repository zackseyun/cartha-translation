  text: וּ/דְבִ֧יר בְּ/תוֹךְ הַ/בַּ֛יִת מִ/פְּנִ֖ימָה הֵכִ֑ין לְ/תִתֵּ֣ן שָׁ֔ם אֶת אֲר֖וֹן בְּרִ֥ית יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/019.yaml
  text: And he prepared the inner sanctuary within the house[a], to place there the ark of the covenant of Yahweh.
translation:
  language: zh_hans
  text: 他在殿宇深处预备了内殿[a]，要把雅威的约柜安放在那里。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文为debir，传统上有时译作“神谕所”；这里指圣殿最里面的房间，即至圣所。
    reason: 说明较少见的圣殿建筑术语及其传统译法。
lexical_decisions:
- source_word: דְבִיר
  choice: 内殿
  rationale: 该词在圣殿语境中指最里面的房间，即至圣所。“内殿”既体现其位置，又比音译或传统的“神谕所”更容易为现代读者理解。
- source_word: בְּתוֹךְ הַבַּיִת מִפְּנִימָה
  choice: 在殿宇深处
  rationale: בַּיִת直译为“房屋”，在这里明确指圣殿建筑；“殿宇”保留建筑含义，而“深处”自然表达מִפְּנִימָה所强调的内部位置。
- source_word: הֵכִין
  choice: 预备了
  rationale: 该动词表示为特定用途做好准备，与后面的目的不定式相配，也不额外断定具体施工方式。
- source_word: לְתִתֵּן
  choice: 要……安放
  rationale: 不定式表示目的；“安放”符合将约柜置于圣所中的庄重语境。
- source_word: אֲרוֹן בְּרִית יְהוָה
  choice: 雅威的约柜
  rationale: “约柜”是现代中文圣经语境中自然且准确的固定表达；属格“雅威的”表达这是与雅威之约相关的柜，同时保持原文结构的简洁。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见音译呈现四字神名，保留其作为专名的性质，不以称号替代。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”较贴近学界通常重构的读音，并明确将其作为专名呈现。
- issue: דְבִיר是否直接译作“至圣所”
  choice: 正文译“内殿”，脚注说明即圣殿最里面的房间
  alternative: 至圣所
  rationale: “至圣所”能准确说明其功能，但比本节的空间称谓更具解释性；“内殿”保留原词的建筑空间意味，并借脚注澄清所指。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“殿宇深处”避免生硬重复“殿内的里面”，同时保留原文对内部位置的强调；句式简洁，适合公开诵读。
