id: 1KI.6.1
reference: 1 Kings 6:1
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יְהִ֣י בִ/שְׁמוֹנִ֣ים שָׁנָ֣ה וְ/אַרְבַּ֣ע מֵא֣וֹת שָׁנָ֡ה לְ/צֵ֣את בְּנֵֽי יִשְׂרָאֵ֣ל מֵ/אֶֽרֶץ מִצְרַיִם֩ בַּ/שָּׁנָ֨ה הָ/רְבִיעִ֜ית בְּ/חֹ֣דֶשׁ זִ֗ו ה֚וּא הַ/חֹ֣דֶשׁ הַ/שֵּׁנִ֔י לִ/מְלֹ֥ךְ שְׁלֹמֹ֖ה עַל יִשְׂרָאֵ֑ל וַ/יִּ֥בֶן הַ/בַּ֖יִת לַ/יהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/001.yaml
  text: And it came about in the four hundred eightieth year after the sons of Israel came out from the land of Egypt[a], in the fourth year, in the month of Ziv (that is, the second month), of Solomon’s reign over Israel[c][b], that he built the house for Yahweh.
translation:
  language: zh_hans
  text: 以色列子孙离开埃及地的第四百八十年[a]，就是所罗门统治以色列的第四年；西弗月，就是二月[b]，他为雅威建造殿宇[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文的纪年方式是“以色列子孙离开埃及地的第四百八十年”。“以色列子孙”是对以色列群体的家族性称谓。
    reason: 说明希伯来语纪年结构及“以色列子孙”的原文字面表达。
  - marker: b
    text: “西弗”是希伯来历二月的古称。
    reason: 提供理解古代月份名称所需的文化背景。
  - marker: c
    text: 原文动词只是“建造”；按上下文，这是指圣殿工程的开工，也可译作“开始建造”。
    reason: 保留原词与上下文所暗示的起始意义之间的张力。
lexical_decisions:
- source_word: וַיְהִי
  choice: （融入全句的时间叙述，不另译“事情发生了”）
  rationale: 这是引出年代记载的叙事形式。汉语直接以时间状语起句更自然，也完整保留其叙事功能。
- source_word: בִשְׁמוֹנִים שָׁנָה וְאַרְבַּע מֵאוֹת שָׁנָה
  choice: 第四百八十年
  rationale: 原文指从出埃及这一时间基点算起的特定年份，并非笼统的四百八十年之后。
- source_word: לְצֵאת בְּנֵי יִשְׂרָאֵל מֵאֶרֶץ מִצְרַיִם
  choice: 以色列子孙出埃及地后
  rationale: “出……后”自然表达介词 לְ 所标示的时间起点；“以色列子孙”保留 בְּנֵי יִשְׂרָאֵל 的家族性称谓，“埃及地”则保留 אֶרֶץ。
- source_word: בַּשָּׁנָה הָרְבִיעִית ... לִמְלֹךְ שְׁלֹמֹה עַל יִשְׂרָאֵל
  choice: 所罗门作以色列王第四年
  rationale: 按现代汉语纪年习惯重组语序，准确表达所罗门统治的第四年。
- source_word: בְּחֹדֶשׁ זִו הוּא הַחֹדֶשׁ הַשֵּׁנִי
  choice: 西弗月，就是二月
  rationale: 保留古月名 זִו，并保留原文随后的解释性同位语。
- source_word: וַיִּבֶן
  choice: 建造
  rationale: 原动词仅说“建造”，没有明说“开始建造”；不把上下文所暗示的开工之意直接写入正文。
- source_word: הַבַּיִת
  choice: 殿宇
  rationale: 原义是“房屋、殿宇”，在此专指献给雅威的圣殿。“殿宇”既保留“房屋”意象，也能让现代读者清楚理解其宗教建筑所指。
- source_word: לַיהוָה
  choice: 为雅威
  rationale: 介词 לְ 表示这殿归属或献给雅威；采用“为”保留这种关系，并音译神名 יהוה。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名。正文音译为“雅威”，以保留专名性质，而不以称号替代。
- issue: בְּנֵי יִשְׂרָאֵל 的群体称谓
  choice: 以色列子孙
  alternative: 以色列人
  rationale: “以色列子孙”保留原文“以色列的众子”的家族与盟约色彩，同时是现代中文圣经语境中可理解的表达。
- issue: וַיִּבֶן 是否明确译作开始建造
  choice: 建造
  alternative: 开始建造；动工建造
  rationale: 本节在上下文中是在给圣殿工程开工纪年，但该动词本身没有显式的“开始”成分，因此正文不消除这一语言层面的张力，并以脚注说明。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。以时间短语直接开篇，避免生硬照搬希伯来语的叙事起句；保留“以色列子孙”“西弗月”和“雅威”等具有历史及盟约色彩的用语，并用脚注补足必要说明。
