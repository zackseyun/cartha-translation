  yaml_path: translation/ot/1_kings/006/030.yaml
  text: He overlaid the floor of the house with gold[b][a], on the inside and on the outside.
translation:
  language: zh_hans
  text: 他又用金子铺了殿的地面，里面和外面都如此。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “里面和外面”原文表达简略，可能表示殿内的地面由内到外全都铺上了金子。
    reason: 原文措辞及覆盖范围的理解存在简略性；脚注保留这一可能解释。
lexical_decisions:
- source_word: קַרְקַע
  choice: 地面
  rationale: 在圣殿建筑语境中，指建筑物内部的地板表面；“地面”自然易懂，也不误作一般土地。
- source_word: הַבַּיִת
  choice: 殿
  rationale: 希伯来文直译为“这房屋”，但在本段明确指耶和华的殿；现代汉语用“殿”既简洁自然，也符合上下文。
- source_word: צִפָּה
  choice: 铺上
  rationale: 该动词表示以某种材料覆盖表面；用于金子覆盖地面时，“铺上”比“镀上”更符合汉语建筑表达。
- source_word: זָהָב
  choice: 金子
  rationale: 直接表达所用材料，措辞通俗而庄重。
- source_word: לִפְנִימָה וְלַחִיצוֹן
  choice: 从里面直到外面
  rationale: 原文以简短的内外对举描述覆盖范围；此译法保留空间对比，并自然表达地面由内至外都铺金的可能含义。
