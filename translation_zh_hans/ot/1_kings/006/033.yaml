lexical_decisions:
- source_word: וְכֵן
  choice: 照样
  rationale: 承接上文至圣所入口的建造，表达相应、类似的做法。
- source_word: עָשָׂה
  choice: 做了
  rationale: 在建筑语境中自然、直接，也不额外限定具体施工方式。
- source_word: לְפֶתַח הַהֵיכָל
  choice: 为殿堂的入口
  rationale: הֵיכָל 在此指与内殿有别的圣殿主厅；“殿堂”比专业性较强的术语更便于现代读者理解。
- source_word: מְזוּזוֹת
  choice: 门框
  rationale: 该词可指门口两侧的竖柱；结合末尾对整体形制的描述，“门框”在现代汉语建筑语境中更自然。
- source_word: עֲצֵי שָׁמֶן
  choice: 橄榄木
  rationale: 传统上在本段语境中理解为橄榄木，简洁自然。
- source_word: מֵאֵת רְבִעִית
  choice: 呈四边形
  rationale: 希伯来语字面近于“出自第四部分”，建筑含义不明确；正文采用一种常见的形制理解，并以脚注保留不确定性。
