base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/032.yaml
  text: Also[a], the two doors were of olivewood, and he carved on them engravings of cherubim and palm trees and open flowers, and overlaid them with gold[b]; and he spread the gold over the cherubim and over the palm trees.
translation:
  language: zh_hans
  text: 这两扇门也用橄榄木制成；他在门上雕刻基路伯、棕榈树和盛开的花朵，又用金子包上；他把金子敷在基路伯和棕榈树上。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “敷”所译的希伯来语动词，字面意思是“使……降下”；此处按上下文理解为把金子敷展在基路伯和棕榈树的雕刻图案上。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁתֵּי דַּלְתוֹת עֲצֵי שֶׁמֶן
  choice: 两扇门也是橄榄木做的
  rationale: דַּלְתוֹת 指门或门扇；עֲצֵי שֶׁמֶן 在此指橄榄木。用“也是”自然承接上文，并保留 וּ 的添加意味。
- source_word: וְקָלַע עֲלֵיהֶם מִקְלְעוֹת
  choice: 他在门上雕刻
  rationale: 动词与名词同源，表示在木材表面制作雕刻纹样；汉语用“雕刻”即可自然表达动作和工艺，避免同义重复。
- source_word: כְּרוּבִים
  choice: 基路伯
  rationale: 采用现代中文圣经语境中通行的音译，指圣殿图像中的特殊天上活物，不译成可能引起误解的普通“天使”。
- source_word: תִמֹרוֹת
  choice: 棕榈树
  rationale: 在圣殿装饰语境中指棕榈树形图案；直译为“棕榈树”清楚自然。
- source_word: פְּטוּרֵי צִצִּים
  choice: 盛开的花朵
  rationale: 该短语描写开放、绽放状的花卉装饰。“盛开的花朵”在现代汉语中自然，并保留其视觉形态。
- source_word: וְצִפָּה זָהָב
  choice: 又贴上金子
  rationale: צפה 在此指以金层包覆或贴饰木雕。“贴上金子”比笼统的“包金”更贴合后句将金子铺于雕纹之上的描写。
- source_word: וַיָּרֶד ... אֶת־הַזָּהָב
  choice: 他把金子铺在……上
  rationale: 该异常使役结构字面近于“使金子下去”，语境指把金层敷展在凸凹雕刻表面；正文采用可理解的“铺”，脚注保留字面意象和译法的不确定性。
theological_decisions: []
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。句式保留希伯来文连续叙述和末句对基路伯、棕榈树的重复强调；不把雕刻对象解释为实体，也不对贴金工艺作超出原文的具体化。
