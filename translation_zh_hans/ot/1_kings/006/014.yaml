  text: So Solomon built the house and finished it[a].
translation:
  language: zh_hans
  text: 于是，所罗门建造了这殿[a]，把它建成了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “殿”原文直译为“房屋”；在本章语境中，这是对圣殿的常用称呼。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבֶן
  choice: 建造了
  rationale: בנה 的 Qal 连续式叙述过去发生的行动；“建造了”自然体现叙事中的完成性动作。
- source_word: שְׁלֹמֹה
  choice: 所罗门
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: הַבַּיִת
  choice: 这殿
  rationale: בַּיִת 字面为“房屋”，但本章语境明确指耶和华的殿；中文用“殿”既自然清楚，也保留其作为建筑物称谓的简洁表达。脚注说明字面意义。
- source_word: וַיְכַלֵּהוּ
  choice: 并把它完工了
  rationale: כלה 的 Piel 形式带第三人称阳性单数宾语后缀，意为完成某物；“把它完工了”明确承接前面的殿，并准确表达完成之意。
