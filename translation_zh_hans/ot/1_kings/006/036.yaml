  text: And he built the inner court with three rows of cut stone and a row of cedar beams[a].
translation:
  language: zh_hans
  text: 他用三层凿成的石料和一层香柏木梁建造内院[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“三排凿成的石料和一排香柏木梁。”
    reason: טוּר 在此建筑语境中可指砌筑的“层”，也可直译为“排”；原文未进一步说明具体结构。
lexical_decisions:
- source_word: וַיִּבֶן
  choice: 他又建造
  rationale: 该叙事性连续动词承接前文；“又”自然表达动作推进，同时不把时间关系说得过细。
- source_word: הֶחָצֵר הַפְּנִימִית
  choice: 内院
  rationale: חָצֵר 指院落，פְּנִימִית 表明其为内侧区域；“内院”简洁且符合圣殿建筑语境。
- source_word: שְׁלֹשָׁה טוּרֵי
  choice: 三层
  rationale: טוּר 在砌筑语境中可指横向排列的一层或一排；中文建筑表达中“层”比“排”更自然。
- source_word: גָזִית
  choice: 凿好的石头
  rationale: 指经过凿削加工的建筑石料；此译法通俗清楚，并保留石头经过加工的含义。
- source_word: וְטוּר
  choice: 和一层
  rationale: 希伯来文用单数“层”与前三层相对；中文需用“一层”自然表达单数，但不强调数词。
- source_word: כְּרֻתֹת אֲרָזִים
  choice: 香柏木梁
  rationale: 该短语指切割成材的香柏木构件；按建筑语境译作“香柏木梁”，自然传达其用途，“梁”本身已含加工成材之意。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的建筑用语。“凿好的石头”避免过于专业的“琢石”，“香柏木梁”则清楚呈现建筑语境。脚注保留 טוּר 的空间排列歧义。
