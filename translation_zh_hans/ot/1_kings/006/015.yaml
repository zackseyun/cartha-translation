revisions:
- from: 他用香柏木板建造殿内的墙壁；从殿的地面直到天花板[a]，里面都用木板覆盖；殿的地面则铺上柏木板[b]。
  to: 他在殿内用香柏木板建造殿的墙壁；从殿的地面直到顶棚的墙面[a]，他在里面用木头覆盖这些墙面；又用柏木板覆盖殿的地面[b]。
  rationale: 修订仅澄清原文中由上下文隐含的“墙壁”是“用木头覆盖”的对象，并将上部界限译作“顶棚的墙面”以较完整地反映原文异常措辞。保留“建造”以对应בנה，不把建筑过程限定为单纯“镶板”；保留树种脚注的开放性。
