  text: וַ/יִּבֶן֩ אֶת קִיר֨וֹת הַ/בַּ֤יִת מִ/בַּ֨יְתָ/ה֙ בְּ/צַלְע֣וֹת אֲרָזִ֔ים מִ/קַּרְקַ֤ע הַ/בַּ֨יִת֙ עַד קִיר֣וֹת הַ/סִּפֻּ֔ן צִפָּ֥ה עֵ֖ץ מִ/בָּ֑יִת וַ/יְצַ֛ף אֶת קַרְקַ֥ע הַ/בַּ֖יִת בְּ/צַלְע֥וֹת בְּרוֹשִֽׁים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/015.yaml
  text: He built the walls of the house on the inside with cedar boards[a]; from the floor of the house to the walls of the ceiling he covered them with wood on the inside[b], and he overlaid the floor of the house with boards of cypress.
translation:
  language: zh_hans
  text: 他在殿内用香柏木板建造殿的墙壁；从殿的地面直到顶棚的墙面[a]，他在里面用木头覆盖这些墙面；又用柏木板覆盖殿的地面[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “顶棚的墙面”：原文直译近于“顶盖的墙面”。这不寻常的建筑用语可能指室内顶棚、屋顶内衬，或上部构造的相关部位。
    reason: 保留“墙面”与“顶盖”结合所造成的建筑术语不确定性。
  - marker: b
    text: “柏木”所译的希伯来语树名具体所指不确定，可能是柏树、杜松一类的针叶树；传统上也译作“松木”或“冷杉木”。
    reason: 说明树种辨认上的词汇不确定性。
lexical_decisions:
- source_word: וַיִּבֶן
  choice: 建造
  rationale: 这是בנה的叙事性动词形式，表示所罗门接着进行建造；中文不必另译句首连接词，也能自然表达叙事次序。
- source_word: קִירוֹת הַבַּיִת
  choice: 殿内的墙壁
  rationale: קִירוֹת指墙壁；הַבַּיִת在本段语境中指圣殿。译作“殿”既符合上下文，也比“房屋”更自然明确。
- source_word: מִבַּיְתָה
  choice: 殿内
  rationale: 该形式表示朝向或位于内部；与“墙壁”连用，说明木板装设在殿的内侧。
- source_word: בְּצַלְעוֹת אֲרָזִים
  choice: 用香柏木板
  rationale: צַלְעוֹת可指侧板、板材或肋状构件；在室内覆墙的建筑语境中，“木板”最自然。אֲרָזִים明确指香柏木。
- source_word: מִקַּרְקַע הַבַּיִת
  choice: 从殿的地面
  rationale: קַרְקַע在建筑内部指地面或地板表面；“地面”准确而通俗。
- source_word: עַד קִירוֹת הַסִּפֻּן
  choice: 直到天花板
  rationale: 原文结构不寻常，字面近于“直到顶盖的墙面”；这里所指很可能是室内顶棚或屋顶内衬。正文采用自然的建筑用语，并以脚注保留原文表达的不确定性。
- source_word: צִפָּה עֵץ מִבָּיִת
  choice: 里面都用木板覆盖
  rationale: צפה在这里指覆上材料；宾语由前文的墙壁和范围暗示。中文补出“里面”，自然表达殿内木板覆盖的情形。
- source_word: וַיְצַף אֶת קַרְקַע הַבַּיִת
  choice: 殿的地面则铺上
  rationale: 同一动词צפה用于地面时，中文“铺上”比“覆盖”更符合建筑表达；“则”清楚区分墙面与地面的处理。
- source_word: בְּצַלְעוֹת בְּרוֹשִׁים
  choice: 柏木板
  rationale: צַלְעוֹת仍指板材。בְּרוֹשִׁים是一种针叶树木，具体树种不能完全确定；“柏木”是简洁、常见的现代译法，脚注列出可能的其他辨认。
