  terminology: “内殿”“至圣所”可用，准确表达 דביר 与 קֹדֶשׁ הַקֳּדָשִׁים 同一内室的两个称谓。脚注c的“圣中之圣”不如现代中文圣经传统中常见的“至圣之处”自然；可保留传统英语术语的直译说明而不改变正文。
