  rationale: 修订以“建造了二十肘的空间”恢复原文两个“建造”动词中的首个动作，避免“划出”所引入的规划含义。保留马所拉文本“直到墙壁”及其建筑学上的困难，并维持“内殿／至圣所”作为同一内室的并列称谓。
