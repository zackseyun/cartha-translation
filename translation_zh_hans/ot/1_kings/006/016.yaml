base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/016.yaml
  text: He built twenty cubits at the rear of the house with cedar boards[a], from the floor to the walls, and he built it within as an inner sanctuary[c][b], as the Most Holy Place.
translation:
  language: zh_hans
  text: 他在殿后部用香柏木板建造了二十肘的空间，从地面直到墙壁[a]；又在里面建成内殿[b]，作为至圣所[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“从地面直到房梁（或椽子）。”希伯来文本作“直到墙壁”，正文照此保留。
    reason: alternative_reading
  - marker: b
    text: “内殿”译自希伯来语 דביר，指圣殿最里面的圣所。
    reason: cultural_note
  - marker: c
    text: 传统译法：“至圣之处”（字面可作“圣中之圣”）。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִירְכְּתֵי הַבַּיִת
  choice: 在殿的后部
  rationale: 该短语指建筑物最里面或后面的部分；译作“在殿的后部”自然地保留其空间含义。
- source_word: אֶת עֶשְׂרִים אַמָּה
  choice: 划出二十肘
  rationale: 此处的二十肘是从殿后部划定出来、建成内殿的空间；“划出”使汉语句法清楚，同时保留古代长度单位“肘”。
- source_word: בְּצַלְעוֹת אֲרָזִים
  choice: 用香柏木板
  rationale: צלעות 可指肋条、侧板或木板；在这里是建造内殿隔断的香柏木构件，译作“香柏木板”最符合建筑语境。
- source_word: מִן הַקַּרְקַע עַד הַקִּירוֹת
  choice: 从地面直到墙壁
  rationale: 马所拉文本明确作“直到墙壁”；尽管建筑语境较难理解，正文仍依原文保留，并在脚注列出“房梁／椽子”的常见异读或解释。
- source_word: וַיִּבֶן לוֹ מִבַּיִת
  choice: 又在殿内把这部分建成
  rationale: 原文表达简练，意思是在殿内构筑这一区域；如此翻译可自然衔接后面的用途说明，也避免把 לוֹ 误解为“为自己”。
- source_word: לִדְבִיר
  choice: 内殿
  rationale: דביר 是圣殿最里面房间的专门称谓；“内殿”简洁、庄重，也符合现代中文圣殿建筑语境。
- source_word: לְקֹדֶשׁ הַקֳּדָשִׁים
  choice: 作为至圣所
  rationale: 该希伯来语属级联结构表达最高级，指最神圣的内部空间；“至圣所”是清楚且通行的现代中文表达。
theological_decisions:
- issue: דביר 与 קֹדֶשׁ הַקֳּדָשִׁים 的关系
  choice: 译为同一空间的名称与用途：“内殿……作为至圣所”
  alternative: 把两者理解为两个不同的空间，或将后者仅作形容说明
  rationale: 原文以两个带 לְ 的短语并列说明所建内部空间；上下文支持二者同指圣殿最里面的房间，但译文保留“内殿”和“至圣所”两个不同称谓。
translation_notes:
  register: 采用现代、庄重而易懂的叙事文体，以“殿”承接圣殿语境。通过分号呈现原文两个连续建造动作；脚注标记均紧随相关词句。
