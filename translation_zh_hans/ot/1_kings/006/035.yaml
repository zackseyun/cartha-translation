  text: He carved cherubim and palm trees and open flowers, and overlaid them with gold, fitted over the carved work.
translation:
  language: zh_hans
  text: 他雕刻了基路伯、棕榈树和盛开的花，又用金子包覆这些雕刻，使金子贴合雕刻的部分。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כְרוּבִים
  choice: 基路伯
  rationale: 采用现代中文圣经读者熟悉的音译，保留原文所指的有翼天上活物，不将其泛化为普通“天使”。
- source_word: תִמֹרוֹת
  choice: 棕榈树
  rationale: 该词指棕榈树形的装饰图案；译作“棕榈树”自然明确，并与上下文的雕刻装饰相符。
- source_word: פְטֻרֵי צִצִּים
  choice: 盛开的花
  rationale: 该短语描写开放、绽放的花形装饰；“盛开的花”既保留形象，也符合现代汉语表达。
- source_word: מְיֻשָּׁר עַל הַמְּחֻקֶּה
  choice: 使金子与雕刻的纹路贴合
  rationale: מְיֻשָּׁר 在此表示金层被整平、妥帖敷设于雕刻之上；译文避免误解为单纯“均匀”，并表达金子顺着雕刻表面贴合的意思。
