revisions:
- from: 他雕刻了基路伯、棕榈树和盛开的花，又贴上金子，使金子与雕刻的纹路贴合。
  to: 他雕刻了基路伯、棕榈树和盛开的花，又用金子包覆这些雕刻，使金子贴合雕刻的部分。
  rationale: 修订仅澄清贴金覆盖的是雕刻部分而非仅是“纹路”，并以“包覆”更贴近原文的覆盖动作；保留原文及英语审校所保有的“贴合雕刻”工艺含义。
