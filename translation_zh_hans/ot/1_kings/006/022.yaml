  text: וְ/אֶת כָּל הַ/בַּ֛יִת צִפָּ֥ה זָהָ֖ב עַד תֹּ֣ם כָּל הַ/בָּ֑יִת וְ/כָל הַ/מִּזְבֵּ֥חַ אֲֽשֶׁר לַ/דְּבִ֖יר צִפָּ֥ה זָהָֽב־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/022.yaml
  text: He overlaid the whole house with gold[a], until the whole house was finished[b]; and he overlaid with gold the whole altar that belonged to the inner sanctuary.
translation:
  language: zh_hans
  text: 他用金子包覆整座殿，直到全殿都完工；又用金子包覆与内殿[a]相关的整座坛[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “内殿”译自希伯来语debir，指圣殿最里面的圣所，传统上也称“至圣所”。
    reason: lexical_alternative
  - marker: b
    text: “与内殿相关的”也可译作“属于内殿的”“内殿里的”或“内殿前的”；希伯来语可表示所属或关联，未明确说明具体位置。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבַּיִת
  choice: 殿
  rationale: 本义为“房屋”，在本段明确指耶和华的殿宇；现代汉语用“殿”既自然，也保留建筑语境。
- source_word: צִפָּה זָהָב
  choice: 用金子包覆／包上金子
  rationale: צפה在此指以金覆盖建筑或器物表面。“包覆”准确表达施工动作，后半句用“包上”避免生硬重复。
- source_word: עַד תֹּם כָּל הַבָּיִת
  choice: 直到全殿都完工
  rationale: 保留עַד תֹּם所表达的完成界限，同时采用自然的现代汉语句式；不将其简化为单纯的“完全”。
- source_word: הַמִּזְבֵּחַ
  choice: 坛
  rationale: 这是מִזְבֵּחַ在圣殿语境中的标准、简明译法。
- source_word: אֲשֶׁר לַדְּבִיר
  choice: 与内殿相属的
  rationale: 介词ל可表达所属或关联，但原文没有明确限定坛与内殿的具体空间关系；“相属”保留这种关系上的含混。
- source_word: דְּבִיר
  choice: 内殿
  rationale: 指圣殿最里面的圣所。“内殿”是清楚而庄重的现代汉语表达，也避免把词义直接解释为特定神学称号。
theological_decisions:
- issue: 坛与内殿的关系
  choice: 与内殿相属的
  alternative: 内殿里的／内殿前的
  rationale: 希伯来语לַדְּבִיר只明确表示坛与内殿有关联，未必明确表示坛位于内殿里面；正文不替原文消除这一空间或所属关系上的张力。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“殿”“内殿”“坛”符合圣殿建筑语境；用“相属”有意保留原文介词关系的含混，脚注补充较自然的其他理解。
