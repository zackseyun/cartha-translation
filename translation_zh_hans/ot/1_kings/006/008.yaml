  text: פֶּ֗תַח הַ/צֵּלָע֙ הַ/תִּ֣יכֹנָ֔ה אֶל כֶּ֥תֶף הַ/בַּ֖יִת הַ/יְמָנִ֑ית וּ/בְ/לוּלִּ֗ים יַֽעֲלוּ֙ עַל הַ/תִּ֣יכֹנָ֔ה וּ/מִן הַ/תִּֽיכֹנָ֖ה אֶל הַ/שְּׁלִשִֽׁים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/008.yaml
  text: The entrance to the middle side chamber was on the right side of the house[a], and by winding stairs they went up to the middle story[b], and from the middle to the third.
translation:
  language: zh_hans
  text: 中层旁屋的入口在殿的右侧。人沿着盘旋的楼梯[a]上到中层，再从中层上到第三层。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “盘旋的楼梯”所对应的希伯来词含义不十分确定，也可译作“螺旋楼梯”或“盘旋的通道”。
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶּתַח
  choice: 入口
  rationale: 指建筑物的开口或出入口；“入口”符合现代汉语建筑语境。
- source_word: הַצֵּלָע הַתִּיכֹנָה
  choice: 中层旁屋
  rationale: צֵלָע在圣殿建筑语境中指附设于主体建筑侧面的房间或结构，不取字面义“肋骨”；תִּיכֹנָה保留“中间、中层”之意。希伯来文本用单数，因此译作“旁屋”而非复数。
- source_word: אֶל כֶּתֶף הַבַּיִת הַיְמָנִית
  choice: 在殿的右侧
  rationale: כֶּתֶף字面为“肩”，在建筑语境中自然译为“侧”；יְמָנִית直译为“右边的”。上下文所说的“房屋”是圣殿，故用“殿”。
- source_word: וּבְלוּלִּים
  choice: 沿着盘旋的楼梯
  rationale: 该罕见词在此通常理解为盘旋或螺旋式的登楼设施；正文采用清楚自然的“盘旋的楼梯”，并以脚注保留词义的不确定性。
- source_word: יַעֲלוּ
  choice: 人……上到
  rationale: 原文为第三人称阳性复数，可作不定主语，描述人们在建筑中上楼的方式；现代汉语用“人……上到”自然表达。
- source_word: עַל הַתִּיכֹנָה
  choice: 上到中层
  rationale: 按楼层递进的建筑语境，תִּיכֹנָה在此指中间一层。保留马所拉文本从入口处“上到中层”的表述，不根据推测改成“底层”。
- source_word: וּמִן הַתִּיכֹנָה אֶל הַשְּׁלִשִׁים
  choice: 再从中层上到第三层
  rationale: 原文直称“从中间到第三”，所省略的建筑层级在上下文中明确；汉语补出“层”以便理解。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的建筑用语。“殿”承接上下文中的圣殿语境；保留希伯来文本“中层旁屋的入口”以及随后“上到中层”之间可能显得突兀的表达，不以文本校勘或解释性改写消除这一张力。
