  yaml_path: translation/ot/1_kings/006/005.yaml
  text: He built against the wall of the house a structure all around[a], against the walls of the house all around, around both the nave and the inner sanctuary[c][b]; and he made side rooms all around.
translation:
  language: zh_hans
  text: 他靠着殿墙建造了一圈附属建筑[a]，沿着殿四围的墙环绕正殿[b]和内殿[c]；又在四围造了侧室。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “附属建筑”所译的希伯来词较为罕见，或译“一圈附殿”，指环绕圣殿外墙建造的结构。
    reason: lexical_alternative
  - marker: b
    text: 这里的“正殿”指圣殿的主要厅堂，与里面的内殿有别。
    reason: cultural_note
  - marker: c
    text: “内殿”或译“至圣所”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבֶן
  choice: 他……建造了
  rationale: 叙事体未完成式承接前文，在现代汉语中自然译为完成性的过去叙述。
- source_word: עַל קִיר הַבַּיִת
  choice: 靠着殿墙
  rationale: 建筑语境中的 עַל 表示贴靠、依附于墙，而非建在墙顶；הַבַּיִת 在本段指耶和华的殿。
- source_word: יצוע
  choice: 一圈附属建筑
  rationale: 该词罕见，具体建筑形态并不完全确定；此译表达环殿而建的附属结构，同时避免提前把它等同于末句的厢房。
- source_word: סָבִיב
  choice: 四围／环绕
  rationale: 保留原文多次重复所形成的环绕意味，并按现代汉语语境交替使用自然表达。
- source_word: אֶת קִירוֹת הַבַּיִת
  choice: 殿四围的墙
  rationale: 保留 קִירוֹת 的复数和建筑外围含义。
- source_word: לַהֵיכָל
  choice: 正殿
  rationale: הֵיכָל 在这里指圣殿的主要厅堂，与内殿有别；“正殿”简洁、易懂，也符合建筑语境。
- source_word: וְלַדְּבִיר
  choice: 和内殿
  rationale: דְּבִיר 指圣殿最里面的圣所；“内殿”保留空间概念，不把较熟悉的功能性称谓直接写入正文。
- source_word: וַיַּעַשׂ צְלָעוֹת
  choice: 又……造了厢房
  rationale: צְלָעוֹת 字面可指侧部或肋部，在本节建筑语境中指殿旁的房间；“厢房”是清楚自然的现代汉语建筑用语。
theological_decisions:
- issue: דְּבִיר 的圣所称谓
  choice: 正文译作“内殿”
  alternative: “至圣所”
  rationale: 正文优先保留该词在此处的建筑与空间意义；脚注列出传统且广为人知的对应称谓，不排除其神圣功能。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“殿墙—殿四围的墙—四围”的重复有意对应原文反复出现的环绕表达；“附属建筑”与“厢房”分别对应两个不同的希伯来词，避免无根据地将二者完全等同。
