base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/002.yaml
  text: The house that King Solomon built for Yahweh was sixty cubits long[a], twenty cubits wide[c][b], and thirty cubits high.
translation:
  language: zh_hans
  text: 所罗门王为雅威[c]建造的殿[a]，长六十肘，宽二十肘[b]，高三十肘。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文开头直译为“而这殿”或“这殿”；其中的连接词在中文里可不译。
    reason: lexical_alternative
  - marker: b
    text: 原文此处直译为“宽二十”，没有重复“肘”；单位可从上下文明确得知。
    reason: supplied_unit
  - marker: c
    text: “雅威”音译希伯来文神名YHWH；传统中文常译作“耶和华”。
    reason: alternative_reading
lexical_decisions:
- source_word: וְהַבַּיִת
  choice: 殿
  rationale: בַּיִת本义为“房屋”，在本段建造圣所的语境中指圣殿建筑。译作“殿”既自然明确，也比扩译为“圣殿”更贴近原文。词首的וְ是连接词；中文在此省略，更符合自然叙述，另以脚注说明。
- source_word: אֲשֶׁר בָּנָה
  choice: 建造的
  rationale: אֲשֶׁר引出关系从句，בָּנָה为完成体，描述所罗门已经建造的殿；中文用“建造的”组成自然的定语结构。
- source_word: הַמֶּלֶךְ שְׁלֹמֹה
  choice: 所罗门王
  rationale: 按现代汉语习惯将王号置于人名之后，准确表达“王所罗门”。
- source_word: לַיהוָה
  choice: 为雅威
  rationale: 介词ל在这里表示对象、归属或奉献目的，“为”适合建殿语境。יהוה是神的专名，正文采用“雅威”音译。
- source_word: שִׁשִּׁים אַמָּה אָרְכּוֹ
  choice: 长六十肘
  rationale: 原文直译为“它的长度六十肘”；现代汉语尺寸表达以“长六十肘”最为简洁自然。
- source_word: וְעֶשְׂרִים רָחְבּוֹ
  choice: 宽二十肘
  rationale: 原文此处没有重复单位“肘”，但由前后平行的尺寸表述可明确承接。正文补出单位，避免中文产生“二十”缺少量词和单位的不自然表达，并以脚注交代。
- source_word: וּשְׁלֹשִׁים אַמָּה קוֹמָתוֹ
  choice: 高三十肘
  rationale: קוֹמָה表示高度；译作“高三十肘”准确而符合现代汉语尺寸表达。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名יהוה。正文以“雅威”音译，以体现这是专名；脚注保留中文传统常用译名“耶和华”，不将专名替换为称号“主”。
- issue: בַּיִת在圣殿语境中的译法
  choice: 殿
  alternative: 房屋
  rationale: 本节明确处于为雅威建造圣所的语境。“殿”能自然指该建筑，同时不额外加入原文没有的“圣”字；“房屋”虽较为字面，却在现代汉语中容易削弱这里的宗教与王室建筑语境。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。尺寸句使用“长……，宽……，高……”的常见并列格式；“肘”保留古代长度单位，不擅自换算为现代单位。
