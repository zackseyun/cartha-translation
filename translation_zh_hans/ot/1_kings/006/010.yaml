base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/010.yaml
  text: He built the side structure against the whole house[a], five cubits high[b], and it was fastened to the house with cedar timbers.
translation:
  language: zh_hans
  text: 他沿着整座殿建造旁屋[a]，高五肘，并用香柏木料[b]把旁屋与殿连接起来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “旁屋”也可译作“侧面附属建筑”；希伯来语所指可能是沿圣殿主体附建的整体结构，也可能着眼于其中的旁室。
    reason: lexical_alternative
  - marker: b
    text: “香柏木料”也可译作“香柏木梁”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבֶן
  choice: 建造
  rationale: 这是בנה的叙事过去时形式；中文以“建造”自然承接上下文的连续行动，无须机械译出句首连接词。
- source_word: היצוע
  choice: 旁屋
  rationale: 该词在本段指附建于圣殿主体周围的侧面建筑。“旁屋”简洁自然，同时不强行断定它仅指单间、平台或整个附属结构。
- source_word: עַל כָּל הַבַּיִת
  choice: 沿着整座殿
  rationale: 介词עַל在此表示空间上的依附或贴近；“沿着”表达附属建筑延伸于殿侧，并保留כָּל所指的整体范围。
- source_word: חָמֵשׁ אַמּוֹת קוֹמָתוֹ
  choice: 高五肘
  rationale: 直译为“它的高度是五肘”。中文用“高五肘”自然表达尺寸，也避免在正文中明确补入原文未明说的“每层”。
- source_word: וַיֶּאֱחֹז אֶת הַבַּיִת
  choice: 把旁屋与殿连接起来
  rationale: אחז本义有“抓住、扣住”，在建筑语境中表示结构上的连接。“连接起来”准确而自然；补明“旁屋”作为主语所指，以免中文歧义。
- source_word: בַּעֲצֵי אֲרָזִים
  choice: 用香柏木料
  rationale: עֲצֵי אֲרָזִים指建筑所用的香柏木材；“木料”保留其宽泛性，不将具体构件过度限定为梁、板或椽。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的建筑叙述用语。“殿”承接本章圣殿语境；正文保持希伯来语对旁屋整体、旁室及具体木构件之间的模糊性，不加入“每层”等解释性限定。
