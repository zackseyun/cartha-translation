  text: וַ/יֵּ֣לֶךְ שְׁלֹמֹ֔ה אַחֲרֵ֣י עַשְׁתֹּ֔רֶת אֱלֹהֵ֖י צִדֹנִ֑ים וְ/אַחֲרֵ֣י מִלְכֹּ֔ם שִׁקֻּ֖ץ עַמֹּנִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/005.yaml
  text: Solomon went after Ashtoreth[a], the god of the Sidonians, and after Milcom[c][b], the abomination of the Ammonites.
translation:
  language: zh_hans
  text: 所罗门随从亚斯她录[a]，就是西顿人的神[b]；又随从米勒公[c]，即亚扪人的可憎之物。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “亚斯她录”也常称为“阿斯塔特”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来语此处“神”的词形可表示“神”或“诸神”；在本句中它与具名的亚斯她录同位，指西顿人所敬奉的这位神祇。亚斯她录为女性神祇，也可译为“女神”。
    reason: lexical_alternative
  - marker: c
    text: 有人认为米勒公与摩洛有关联；但本节希伯来文本作“米勒公”。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּלֶךְ ... אַחֲרֵי
  choice: 随从
  rationale: 希伯来语“走在……之后”在此表示跟随、效忠或敬奉，而非单纯走路。“随从”在现代汉语中自然地传达这种归附之意，同时不直接扩译为“敬拜”。
- source_word: עַשְׁתֹּרֶת
  choice: 亚斯她录
  rationale: 按本节希伯来语名称音译，并采用中文圣经读者较熟悉的形式；脚注保留其常见对应名“阿斯塔特”。
- source_word: אֱלֹהֵי צִדֹנִים
  choice: 西顿人的神
  rationale: אֱלֹהֵי 在形式上可作复数附属形，但在这里与一个具名神祇同位。汉语“神”不标语法性别，也不必把原文解释性地具体化为“女神”，从而兼顾语境和形式上的含混。
- source_word: מִלְכֹּם
  choice: 米勒公
  rationale: 依据本节马所拉文本的名称音译；不在正文中改作“摩洛”，二者可能有关联，但原文在此明确写作 מִלְכֹּם。
- source_word: שִׁקֻּץ עַמֹּנִים
  choice: 亚扪人可憎之物
  rationale: שִׁקֻּץ 是强烈的贬义词，指在礼仪或道德上令人憎恶之物，常用于偶像。“可憎之物”保留原文的评价力度，也避免把名词直接扩译成原文未明说的“偶像”。
theological_decisions:
- issue: 是否把所罗门的行为明说为偶像敬拜
  choice: 保留“随从”，不扩译为“敬拜”
  alternative: 所罗门敬拜……
  rationale: 上下文确实描述背道和偶像崇拜，但本节使用的是“走在……之后”的习语。“随从”能表达归附和效忠，又不超出本节措辞。
- issue: 是否明确称亚斯她录为“女神”
  choice: 译作性别中性的“神”
  alternative: 西顿人的女神
  rationale: 亚斯她录所指神祇为女性，但希伯来语此处使用 אֱלֹהֵי，中文“神”既能准确指称，也保留原文措辞所留下的空间；脚注说明其语法与所指。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“随从”保留希伯来习语的归附意味；两个同位结构调整为自然汉语次序：“西顿人的神亚斯她录”“亚扪人可憎之物米勒公”。专名采用中文圣经传统中较易辨认的音译。
