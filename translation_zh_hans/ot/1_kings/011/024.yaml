base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/024.yaml
  text: He gathered men to himself and became commander of a band when David killed them. They went to Damascus[a], settled there, and reigned in Damascus.
translation:
  language: zh_hans
  text: 他招聚了一些人到自己身边；大卫杀他们的时候，他成了一支队伍的首领。他们前往大马士革[a]，住在那里，并在大马士革作王。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节后半部分的希伯来原文连续使用复数动词，即“他们前往……，住在那里，并在……作王”。有些译本因上下文以利逊为中心，而顺译为单数“他”。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקְבֹּץ עָלָיו אֲנָשִׁים
  choice: 他招聚了一些人归附自己
  rationale: קבץ 表示招聚，עָלָיו 在这里有聚集到他身边、归附他的意思。“归附自己”以自然中文保留这一方向和从属意味。
- source_word: אֲנָשִׁים
  choice: 一些人
  rationale: 原文为阳性复数，语境指加入其队伍的人；中文“一些人”自然且不额外添加“战士”等原文未明说的身份。
- source_word: שַׂר גְּדוּד
  choice: 一队人马的首领
  rationale: שַׂר 是首领、统领，גְּדוּד 指成队的武装人员或队伍。“一队人马的首领”既符合不正规的军事群体语境，又避免把其性质明确解释为劫掠团伙。
- source_word: בַּהֲרֹג דָּוִד אֹתָם
  choice: 在大卫杀戮他们的时候
  rationale: ב 加不定词结构表达时间背景。“他们”照原文保留复数指代；“杀戮”也保留行动具有多人受害的语感，不擅自明确其具体所指。
- source_word: וַיֵּלְכוּ דַמֶּשֶׂק
  choice: 他们往大马士革去
  rationale: 按马所拉文本保留复数动词，并自然表达朝大马士革的移动。
- source_word: וַיֵּשְׁבוּ בָהּ
  choice: 住在那里
  rationale: ישב 可指居住或定居；“住在那里”自然、准确，同时不把停留的永久程度说得过满。
- source_word: וַיִּמְלְכוּ בְּדַמָּשֶׂק
  choice: 并在大马士革掌权
  rationale: מלך 可表示作王、统治。原文动词为复数；“掌权”能与复数主语自然搭配，并保留其治理或王权意味，而不强行译成多人分别“作王”。
theological_decisions:
- issue: 后半节连续使用复数动词，但上下文叙事以利逊为中心
  choice: 保留复数主语：“他们往……去，住……并……掌权”
  alternative: 按上下文顺译为单数：“他往……去，住……并……作王”
  rationale: 马所拉文本后半节三个叙事动词均为复数。保留复数可忠实呈现文本自身的张力，不以解释性修顺消除这一现象。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“归附自己”“一队人马的首领”“掌权”兼顾叙事流畅和原文语义；正文与脚注均保留后半节复数形式所造成的叙事张力。
