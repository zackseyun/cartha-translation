revisions:
- from: 他招聚了一些人归附自己，并在大卫杀戮他们的时候成了一队人马的首领。他们往大马士革去[a]，住在那里，并在大马士革掌权。
  to: 他招聚了一些人到自己身边；大卫杀他们的时候，他成了一支队伍的首领。他们前往大马士革[a]，住在那里，并在大马士革作王。
  rationale: 修订以更自然的现代汉语表达招聚追随者和担任队伍首领，同时将“杀戮”改为中性的“杀”。末句改为“作王”，以保留原文王权动词的核心含义；复数动词及其所造成的叙事张力仍完全保留，并由脚注说明。
