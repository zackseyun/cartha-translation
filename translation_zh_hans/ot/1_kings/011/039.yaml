  text: וַֽ/אעַנֶּ֛ה אֶת זֶ֥רַע דָּוִ֖ד לְמַ֣עַן זֹ֑את אַ֖ךְ לֹ֥א כָל הַ/יָּמִֽים־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/039.yaml
  text: And I will afflict the offspring of David because of this[a], but not forever.
translation:
  language: zh_hans
  text: 我必因这事使大卫的后裔受苦，但不会永远如此。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“但不是所有的日子。”
    reason: 保留希伯来语 לֹא כָל הַיָּמִים 的字面表达，说明正文“不会永远如此”的依据。
lexical_decisions:
- source_word: וַאעַנֶּה
  choice: 我必……使……受苦
  rationale: ענה 的 Piel 形在这里表示使人遭受苦难或屈辱。译作“使……受苦”符合审判语境，又不把含义过度限定为社会性的“压迫”或内在性的“谦卑”。
- source_word: זֶרַע דָּוִד
  choice: 大卫的后裔
  rationale: זֶרַע 是集合名词，指大卫延续下去的后代。“后裔”在现代汉语中自然、庄重，也能表达其群体含义。
- source_word: לְמַעַן זֹאת
  choice: 因这事
  rationale: 该短语在此说明使大卫后裔受苦的原因，回指上文所述之事；“因这事”简洁并贴近原文。
- source_word: אַךְ
  choice: 但
  rationale: אַךְ 在这里对前述审判加以限制，具有转折意味；“但”自然地引出审判并非永久持续。
- source_word: לֹא כָל הַיָּמִים
  choice: 不会永远如此
  rationale: 字面意思是“不是所有的日子”，惯用意义为这种苦难不会永久持续。“不会永远如此”是自然现代汉语，并以“如此”明确回指前述受苦。
theological_decisions:
- issue: 对大卫后裔之审判的持续时间
  choice: 审判真实存在，却不会永远持续。
  alternative: 按字面译为“不是所有的日子”。
  rationale: 原文明确限制了苦难的期限，但没有在本节进一步说明终止的时间或方式。译文保留这种张力，不额外引入关于大卫之约的解释。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“使……受苦”避免使用可能暗示虐待的“苦待”；“不会永远如此”自然表达原文对审判期限的限制。
