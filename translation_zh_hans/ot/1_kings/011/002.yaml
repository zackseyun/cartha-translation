  to: 所罗门所爱恋、依附的，是那些民族的女子；耶和华曾论到这些民族，对以色列人说：“你们不可与他们往来，他们也不可与你们往来；他们必使你们的心转去随从他们的神。”[a]
  rationale: 调整句法，使“来自那些民族的女子”与所罗门的爱恋、依附直接相连，较好反映本节承接上一节的结构。删除原文未明示的“却”，并保留“往来”的宽泛表达，以脚注呈现原文习语和语境所指。
