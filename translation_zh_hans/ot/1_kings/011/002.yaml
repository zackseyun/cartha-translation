  text: מִן הַ/גּוֹיִ֗ם אֲשֶׁ֣ר אָֽמַר יְהוָה֩ אֶל בְּנֵ֨י יִשְׂרָאֵ֜ל לֹֽא תָבֹ֣אוּ בָ/הֶ֗ם וְ/הֵם֙ לֹא יָבֹ֣אוּ בָ/כֶ֔ם אָכֵן֙ יַטּ֣וּ אֶת לְבַבְ/כֶ֔ם אַחֲרֵ֖י אֱלֹהֵי/הֶ֑ם בָּ/הֶ֛ם דָּבַ֥ק שְׁלֹמֹ֖ה לְ/אַהֲבָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/002.yaml
  text: from the nations about which Yahweh had said to the sons of Israel[a], “You shall not go in among them, and they shall not come in among you; surely they will turn your heart after their gods”—to these Solomon clung in love.
translation:
  language: zh_hans
  text: 所罗门所爱恋、依附的，是那些民族的女子；耶和华曾论到这些民族，对以色列人说：“你们不可与他们往来，他们也不可与你们往来；他们必使你们的心转去随从他们的神。”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 按本节关于外族妻妾的上下文，这禁令具体指不可与他们通婚。希伯来文较直译为：“你们不可进入他们中间，他们也不可进入你们中间。”
    reason: 说明原文较宽泛的习语及其在上下文中的婚姻含义，避免在正文中直接限定为“通婚”。
lexical_decisions:
- source_word: מִן הַגּוֹיִם
  choice: 来自……那些民族
  rationale: גּוֹיִם 指外邦民族；结合上一节的女子名单，以“这些女子来自”自然承接上下文。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经中广为人知的神名音译，明确保留专名。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 这是现代汉语表达以色列群体的自然说法；汉语无需照搬希伯来语“以色列的众子”的性别形式。
- source_word: לֹא תָבֹאוּ בָהֶם וְהֵם לֹא יָבֹאוּ בָכֶם
  choice: 你们不可与他们往来，他们也不可与你们往来
  rationale: 原文直译近于“不可进入他们中间／他们不可进入你们中间”，语境指通婚关系；“往来”保留原句相对宽泛的表达，同时以脚注说明具体语境。
- source_word: אָכֵן
  choice: 必
  rationale: 在警告句中表达确定性，现代汉语无需另加“诚然”。
- source_word: יַטּוּ אֶת לְבַבְכֶם אַחֲרֵי אֱלֹהֵיהֶם
  choice: 他们必使你们的心转去随从他们的神
  rationale: 保留“心转去”的隐喻，并将 אַחֲרֵי 的跟随含义自然译出。
- source_word: בָּהֶם דָּבַק שְׁלֹמֹה לְאַהֲבָה
  choice: 所罗门却依恋这些女子，爱她们
  rationale: דבק 表示紧密依附；“依恋”既有强烈情感色彩，又适合婚恋语境。בָּהֶם 在语法上回指前述对象，按上下文明确为这些外族女子。
theological_decisions:
- issue: 是否在正文中把禁令明确译作禁止通婚
  choice: 正文译作“不可与他们往来”，脚注说明上下文特指通婚
  alternative: “不可与他们通婚”
  rationale: 通婚显然是本节语境，但希伯来文使用较宽泛的“进入……中间”措辞。正文保留其一定宽度，脚注帮助读者把握具体含义。
- issue: בָּהֶם 的指代对象
  choice: 按上下文译为“这些女子”
  alternative: “他们”或“这些民族”
  rationale: 形式上是阳性复数，可回指民族；然而 דבק 和 לְאַהֲבָה 在本段直接描述所罗门对外族妻妾的依恋。中文若直译“依恋这些民族”会造成错误理解，因此按所指对象明示为女子。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以“往来”保存希伯来文禁令的宽泛形式，以脚注交代通婚语境；末句用“却”凸显所罗门违背警告的张力。
