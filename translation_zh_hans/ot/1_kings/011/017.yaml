base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/017.yaml
  text: Hadad fled to Egypt[a], he and some Edomite men from among his father's servants with him[b]; and Hadad was a young boy.
translation:
  language: zh_hans
  text: 哈达逃往埃及[a]，与他同行的还有他父亲臣仆中的几个以东人；那时哈达还是个年幼的男孩[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译可作“来到埃及”。希伯来语在表示前往某地时，也可以使用通常译作“来”或“进入”的动词。
    reason: lexical_alternative
  - marker: b
    text: 或译“很小的男孩”或“年幼的男孩”。希伯来语短语强调哈达当时年纪尚小。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבְרַח
  choice: 逃往
  rationale: ברח的基本意思是“逃跑、逃离”。与目的地“埃及”连用时，“逃往”在现代汉语中简洁自然，并保留因危险而离开的含义。
- source_word: אֲדַד
  choice: 哈达
  rationale: 按希伯来语人名的常见汉语音译处理。
- source_word: הוּא וַאֲנָשִׁים אֲדֹמִיִּים
  choice: 与他同行的还有……几个以东人
  rationale: 独立代词הוּא突出哈达本人，而后接同行者。汉语用“与他同行的还有”自然表达这种并列和强调；“几个”表达该不定复数指部分人，并不暗示所有以东人。
- source_word: מֵעַבְדֵי אָבִיו
  choice: 他父亲臣仆中的
  rationale: 介词מִן在这里有部分义，即这些人出自其父亲的臣仆之中。“臣仆”适合王室叙事语境，也保留服事和隶属关系。
- source_word: אִתּוֹ
  choice: 与他同行
  rationale: 原词直译为“同他一起”。结合逃往埃及的动作，译作“与他同行”符合现代汉语表达。
- source_word: לָבוֹא מִצְרָיִם
  choice: 往埃及
  rationale: בוא的形式字面上是“来到／进入”，但在逃跑动词后表示前往的目的地；汉语用“逃往埃及”最自然，字面形式在脚注中说明。
- source_word: נַעַר קָטָן
  choice: 年幼的孩子
  rationale: נַעַר可指男孩、少年或年轻人，קָטָן在此强调年纪尚小。“年幼的孩子”准确传达年龄幼小，而不误解为身材矮小。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“臣仆”保留王室背景；分号对应原文后半句对哈达年龄的补充说明。所有脚注标记均置于其所解释的词句之后。
