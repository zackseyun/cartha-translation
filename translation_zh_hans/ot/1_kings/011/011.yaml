reference: 1 Kings 11:11
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה לִ/שְׁלֹמֹ֗ה יַ֚עַן אֲשֶׁ֣ר הָֽיְתָה זֹּ֣את עִמָּ֔/ךְ וְ/לֹ֤א שָׁמַ֨רְתָּ֙ בְּרִיתִ֣/י וְ/חֻקֹּתַ֔/י אֲשֶׁ֥ר צִוִּ֖יתִי עָלֶ֑י/ךָ קָרֹ֨עַ אֶקְרַ֤ע אֶת הַ/מַּמְלָכָה֙ מֵֽ/עָלֶ֔י/ךָ וּ/נְתַתִּ֖י/הָ לְ/עַבְדֶּֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/011.yaml
  text: So Yahweh said to Solomon[a], “Because this has been with you, and you have not kept my covenant and my statutes that I commanded you, I will surely tear the kingdom away from you and give it to your servant.”
translation:
  language: zh_hans
  text: 于是，耶和华对所罗门说：“既然你有这样的事[a]，又没有遵守我的约和我所吩咐你的律例，我必定把这国从你手中撕去，赐给你的臣仆。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译近于“既然这事在你身上（或：与你有关）”。这是一个含蓄的表达，按上下文可指所罗门持续的行为或状态。
    reason: 保留原文表达的简省与歧义，避免在正文中把所指具体化。
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文读者熟悉的专名“耶和华”译出四字神名，不以“主”这一称号替代。
- source_word: יַעַן אֲשֶׁר הָיְתָה זֹּאת עִמָּךְ
  choice: 既然你竟这样行
  rationale: 原文直译近于“既然这事与你同在”，是含义压缩的表达；上下文指所罗门背道的行为或状态。正文采用自然中文表达其因果与责备语气，同时不具体添加行为内容。
- source_word: שָׁמַרְתָּ
  choice: 遵守
  rationale: “遵守”可自然搭配“约”和“律例”，保留盟约语境中的守约含义。
- source_word: בְּרִיתִי
  choice: 我与你所立的约
  rationale: “约”保留בְּרִית的盟约和法律分量；补出中文关系结构，使“我的约”在现代中文中表达自然。
- source_word: חֻקֹּתַי
  choice: 我的律例
  rationale: “律例”是清楚而庄重的圣经法律用语，适合盟约语境。
- source_word: צִוִּיתִי עָלֶיךָ
  choice: 我吩咐你的
  rationale: 用自然中文表达神向所罗门颁布命令的含义。
- source_word: קָרֹעַ אֶקְרַע
  choice: 我必……夺去
  rationale: 原文不定式绝对形与限定动词连用，强化行动的确定性；“必”在中文中简洁传达这一强调。
- source_word: הַמַּמְלָכָה מֵעָלֶיךָ
  choice: 把这国从你手中夺去
  rationale: מַמְלָכָה在此指所罗门统治的国；“从你手中夺去”自然表达从其统治权下移除。
- source_word: לְעַבְדֶּךָ
  choice: 赐给你的臣仆
  rationale: עֶבֶד在此指王室属员耶罗波安；“臣仆”比泛称“仆人”更能体现宫廷政治语境，又不误译为奴隶。
theological_decisions:
- issue: 四字神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威；主
  rationale: 原文直接使用神的专名。中文正文以广为人知的专名“耶和华”译出，不用称号“主”替代，也不由发音重构来消除传统译名与学术音译之间的选择。
- issue: הָיְתָה זֹּאת עִמָּךְ所指的行为或状态
  choice: 既然你竟这样行
  alternative: 既然这事与你同在；既然你一直如此
  rationale: 上下文把审判缘由与所罗门的背道相连，但原句本身较为含蓄。译文表达持续行为所构成的罪责，却不在正文中明确增添“拜偶像”等解释。
- issue: מַמְלָכָה指疆土还是王权
  choice: 这国
  alternative: 王国；王权
  rationale: 语境涉及以色列国从所罗门家手中被夺走，也包含统治权的转移。“这国”保持实体国度与王权之间的语义张力。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。句式保留神谕的因果结构和审判力度；避免生硬直译“这事与你同在”，也避免把上下文解释过度写入正文。
