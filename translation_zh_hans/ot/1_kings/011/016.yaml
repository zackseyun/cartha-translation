id: 1KI.11.16
reference: 1 Kings 11:16
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כִּ֣י שֵׁ֧שֶׁת חֳדָשִׁ֛ים יָֽשַׁב שָׁ֥ם יוֹאָ֖ב וְ/כָל יִשְׂרָאֵ֑ל עַד הִכְרִ֥ית כָּל זָכָ֖ר בֶּ/אֱדֽוֹם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/016.yaml
  text: For Joab and all Israel had remained there six months[b][a], until he had cut off every male in Edom.
translation:
  language: zh_hans
  text: 因为约押和全以色列[a]在那里驻留了六个月，直到他把以东所有的男性都除灭了[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “全以色列”在这里很可能指随约押出征的以色列军队，并不一定指全国每一个人。
    reason: cultural_note
  - marker: b
    text: “除灭”也可译作“剪除”或“消灭”。希伯来文原意为“剪除”，在这里是消灭一个群体的习语。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 本词引出对上文的解释或原因；中文用“因为”自然保留其因果、说明作用。
- source_word: שֵׁשֶׁת חֳדָשִׁים יָשַׁב שָׁם
  choice: 在那里驻留了六个月
  rationale: יָשַׁב 在军事语境中表示持续留驻，而非定居；“驻留”兼顾语境与现代中文表达。
- source_word: וְכָל יִשְׂרָאֵל
  choice: 和全以色列
  rationale: 保留希伯来文的集体称谓及其可能的范围歧义；此处按语境很可能指随约押出征的以色列军队。
- source_word: עַד
  choice: 直到
  rationale: 准确标明前述驻留行动的时间终点。
- source_word: הִכְרִית
  choice: 除灭
  rationale: 该词为 כרת 的使役形，在此表示彻底消灭；“除灭”既传达其强烈含义，也保留圣经叙事的庄重语体。
- source_word: כָּל זָכָר
  choice: 所有的男性
  rationale: זָכָר 指男性，并不限定为成年男子；该译法避免给原文增加年龄范围。
- source_word: בֶּאֱדוֹם
  choice: 以东
  rationale: 介词 ב 在此具有地点意义；中文把地点置于“所有的男性”之前，以自然语序表达“以东境内所有的男性”。
theological_decisions:
- issue: “全以色列”的指称范围
  choice: 正文直译为“全以色列”，脚注说明很可能指以色列军队
  alternative: 直接译作“以色列全军”
  rationale: 原文使用民族整体称谓，虽在军事语境中可能为随约押行动的军队，但不宜在正文中消除其字面范围和修辞张力。
- issue: הִכְרִית 的消灭程度
  choice: 译作“除灭”，并以脚注提示字面意象
  alternative: 剪除／消灭
  rationale: 语境指消灭某一群体；“除灭”表达严重程度，但脚注保留“剪除”的字面习语，避免隐藏原文意象。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“驻留”体现军事行动中的持续停驻；正文保留“全以色列”的集体称谓，并用脚注解释其语境范围。所有脚注标记均已置于相应正文词语之后。
