  terminology: 人名“哈达”“大卫”“约押”“法老”及军职“军队统帅”均一致、准确。“国土”可自然表达 אַרְצִי 在此处所指的故土／本国。脚注锚点置于“与祖先同眠”这一实际需要说明的短语上，位置正确。
