base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/021.yaml
  text: When Hadad heard in Egypt that David had lain down with his fathers and that Joab[a], the commander of the army, was dead, Hadad said to Pharaoh, “Send me away[b], so that I may go to my own land.”
translation:
  language: zh_hans
  text: 哈达在埃及听说大卫已经与祖先同眠[a]，军队统帅约押也死了，就对法老说：“请准我离去，好让我回自己的国土。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “与祖先同眠”是希伯来语表示死亡的惯用说法。
    reason: 说明原文的死亡委婉语，避免现代读者误作字面理解。
lexical_decisions:
- source_word: שָׁמַע
  choice: 听说
  rationale: 这里指哈达在埃及得知消息；“听说”既保留“听”的基本义，也符合现代汉语叙事习惯。
- source_word: שָׁכַב ... עִם אֲבֹתָיו
  choice: 与祖先同眠
  rationale: 保留希伯来语表示死亡的传统委婉意象，同时用现代读者容易理解的措辞表达；脚注说明其实际含义。
- source_word: מֵת
  choice: 死了
  rationale: 原文表示约押处于死亡状态；“死了”自然简洁，也与前面的委婉说法形成原文已有的表达差异。
- source_word: שַׂר הַצָּבָא
  choice: 军队统帅
  rationale: 准确表达约押作为军队最高指挥官的职务，语言简明、庄重而不古奥。
- source_word: שַׁלְּחֵנִי
  choice: 请准我离去
  rationale: 该命令式在对法老的请求中表示请其放行；如此译法自然体现礼貌语境，不把哈达描写成奉命出使。
- source_word: וְאֵלֵךְ
  choice: 好让我回
  rationale: 未完成式在命令之后带有意愿和目的意味，“好让我”自然传达这一关系。
- source_word: אַרְצִי
  choice: 自己的国土
  rationale: אֶרֶץ 可指土地、国土；结合哈达要求返回故国的语境，“自己的国土”比单纯“我的地”更清楚。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而清楚的叙事语体。保留大卫之死的希伯来委婉意象，同时将约押之死直译为“死了”，从而维持原文措辞上的差异。原文句首仅有叙事连接词，未另加“那时”或“如今”等时间副词。
