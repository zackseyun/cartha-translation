  source_fidelity: 译文准确呈现了哈达在埃及得知两项消息：大卫“与祖先同眠”的死亡委婉语，以及约押已经死亡；也准确表达了哈达向法老请求放行、以便返回自己土地的目的。“也死了”在汉语中自然地连接两项所闻消息，未实质增添原文没有的信息。
