  text: וְ/הַ/מֶּ֣לֶךְ שְׁלֹמֹ֗ה אָהַ֞ב נָשִׁ֧ים נָכְרִיּ֛וֹת רַבּ֖וֹת וְ/אֶת בַּת פַּרְעֹ֑ה מוֹאֲבִיּ֤וֹת עַמֳּנִיּוֹת֙ אֲדֹ֣מִיֹּ֔ת צֵדְנִיֹּ֖ת חִתִּיֹּֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/001.yaml
  text: 'King Solomon loved many foreign women[a], including Pharaoh’s daughter: Moabite, Ammonite, Edomite, Sidonian, and Hittite women.'
translation:
  language: zh_hans
  text: 所罗门王爱许多外族女子[a]，其中包括法老的女儿，以及摩押人、亚扪人、以东人、西顿人和赫人的女子。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“许多外族妻子”。希伯来文直译是“许多外族女子”；上下文表明，她们是所罗门娶为妻子或纳为妃嫔的女子。
    reason: 说明原词较宽的词义，以及上下文所显示的婚姻或伴侣关系。
lexical_decisions:
- source_word: וְהַמֶּלֶךְ שְׁלֹמֹה
  choice: 所罗门王
  rationale: 按现代汉语的姓名与称号顺序表达。“王”直接对应מֶלֶךְ；句首的וְ在这里承接叙事，不必机械译成“而且”或“如今”。
- source_word: אָהַב
  choice: 爱
  rationale: 保留动词“爱”的基本词义，不弱化为“喜欢”，也不强化为带有额外评价色彩的“宠爱”。
- source_word: נָשִׁים נָכְרִיּוֹת רַבּוֹת
  choice: 许多外族女子
  rationale: נָשִׁים直译为“女子”，נָכְרִיּוֹת指属于其他民族的人。“外族女子”自然、明确，并避免在正文中将“女子”提前限定为“妻子”。
- source_word: וְאֶת בַּת פַּרְעֹה
  choice: 其中包括法老的女儿
  rationale: 将法老的女儿计入所罗门所爱的外族女子之中，同时表达וְאֶת的添加作用。
- source_word: מוֹאֲבִיּוֹת עַמֳּנִיּוֹת אֲדֹמִיֹּת צֵדְנִיֹּת חִתִּיֹּת
  choice: 摩押、亚扪、以东、西顿和赫人的女子
  rationale: 采用现代中文圣经与历史语境中通行的族名，并把前文省略承接的“女子”在汉语中补出；“西顿”保留原文的具体地域指称。
theological_decisions:
- issue: נָשִׁים应译为“女子”还是“妻子”
  choice: 女子
  alternative: 妻子
  rationale: 原文在本节使用的是一般词“女子”；婚姻或伴侣关系可由上下文说明，不在正文中把词义主动收窄。
- issue: 法老的女儿是否属于“外族女子”之列
  choice: 以“其中包括”表达其被列入其中
  alternative: 将法老的女儿作为与外族女子完全分开的类别
  rationale: 句法的添加结构最自然地把法老的女儿纳入所罗门所爱的这些外族女子之中；译文保持这种关系，但不对后续族群清单与她之间作过度解释。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“外族女子”比“异邦妇女”更贴近日常现代用语，同时保留古代民族身份的重点；全句避免文言化和宗派性措辞。
