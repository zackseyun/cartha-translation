  text: וַ/יֹּ֧אמֶר ל֣/וֹ פַרְעֹ֗ה כִּ֠י מָה אַתָּ֤ה חָסֵר֙ עִמִּ֔/י וְ/הִנְּ/ךָ֥ מְבַקֵּ֖שׁ לָ/לֶ֣כֶת אֶל אַרְצֶ֑/ךָ וַ/יֹּ֣אמֶר לֹ֔א כִּ֥י שַׁלֵּ֖חַ תְּשַׁלְּחֵֽ/נִי־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/022.yaml
  text: Then Pharaoh said to him[a], “But what do you lack with me, that you are seeking to go to your own land?” And he said, “Nothing, but please let me go.”
translation:
  language: zh_hans
  text: 法老对他说：“你跟我在一起，究竟缺少什么，竟想要到自己的国土去呢？”他回答：“什么也不缺，只是请你一定让我走[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“你务要打发我走”，用动词不定式绝对形与限定动词连用来加强语气。
    reason: 说明原文的强调句式；正文以自然汉语译出其恳求和强调意味。
lexical_decisions:
- source_word: כִּי מָה אַתָּה חָסֵר עִמִּי
  choice: 你跟我在一起，究竟缺少什么
  rationale: חָסֵר表示“缺少、欠缺”，עִמִּי直译为“与我在一起”。用“跟我在一起”保留关系语境，“究竟”则自然表达法老追问的语气。
- source_word: וְהִנְּךָ מְבַקֵּשׁ
  choice: 竟想要
  rationale: הִנֵּה在此引人注意当前情形，מְבַקֵּשׁ表示寻求、想要。汉语问句中的“竟想要”自然传达法老对哈达意愿的关注和不解，而不机械译作“看哪”。
- source_word: לָלֶכֶת אֶל־אַרְצֶךָ
  choice: 到自己的国土去
  rationale: 原文动词是“去”，并未明确使用“返回”；אַרְצֶךָ是“你的地/国土”。“到自己的国土去”既保留方向和所属关系，也避免在动词中额外加入“返回”。
- source_word: לֹא
  choice: 什么也不缺
  rationale: לֹא字面为“不”，在这里省略承接上问的内容。汉语补明为“什么也不缺”，使答话清楚，同时不改变其含义。
- source_word: שַׁלֵּחַ תְּשַׁלְּחֵנִי
  choice: 请你一定让我走
  rationale: 这是动词不定式绝对形与限定动词并用的强调结构，核心意思是强烈请求对方放行。“请你一定让我走”以自然现代汉语兼顾请求语气和强调意味。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。对话简洁直接；“国土”比“土地”更适合此处所指的本国地域，又未把“去”解释性地改成“返回”。
