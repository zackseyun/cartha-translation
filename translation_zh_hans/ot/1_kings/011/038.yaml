source:
  edition: WLC
  text: וְ/הָיָ֗ה אִם תִּשְׁמַע֮ אֶת כָּל אֲשֶׁ֣ר אֲצַוֶּ/ךָ֒ וְ/הָלַכְתָּ֣ בִ/דְרָכַ֗/י וְ/עָשִׂ֨יתָ הַ/יָּשָׁ֤ר בְּ/עֵינַ/י֙ לִ/שְׁמ֤וֹר חֻקּוֹתַ/י֙ וּ/מִצְוֺתַ֔/י כַּ/אֲשֶׁ֥ר עָשָׂ֖ה דָּוִ֣ד עַבְדִּ֑/י וְ/הָיִ֣יתִי עִמָּ֗/ךְ וּ/בָנִ֨יתִי לְ/ךָ֤ בַֽיִת נֶאֱמָן֙ כַּ/אֲשֶׁ֣ר בָּנִ֣יתִי לְ/דָוִ֔ד וְ/נָתַתִּ֥י לְ/ךָ֖ אֶת יִשְׂרָאֵֽל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/038.yaml
  text: And it shall be[a], if you listen to all that I command you, and walk in my ways, and do what is right in my eyes by keeping my statutes and my commandments, as David my servant did, then I will be with you and build for you a faithful house, just as I built for David, and I will give Israel to you.
translation:
  language: zh_hans
  text: 你若听从我吩咐你的一切，行我的道，做我眼中看为正的事，谨守我的律例和诫命，像我仆人大卫所做的那样，我就与你同在，为你建立一个稳固的家[a]，像我为大卫所建立的一样，并把以色列赐给你。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “稳固的家”也可译作“坚立的家”“可靠的家”或“长存的家”；这里的“家”指延续的王朝家系。
    reason: 说明בַּיִת נֶאֱמָן的语义范围，以及“家”在此处的王朝含义。
lexical_decisions:
- source_word: תִּשְׁמַע
  choice: 听从
  rationale: שׁמע兼有听、留心听和顺从之意；本节后续各分句具体说明顺服，因此“听从”既保留听的语义，也自然表达立约语境中的顺服。
- source_word: וְהָלַכְתָּ בִדְרָכַי
  choice: 行我的道
  rationale: 保留希伯来文“行走”的圣经性隐喻，同时用现代汉语中自然庄重的固定表达传达按上帝道路生活之意。
- source_word: הַיָּשָׁר בְּעֵינַי
  choice: 做我眼中看为正的事
  rationale: 保留“在我眼中”的评价视角，又以自然汉语清楚表达由上帝判定何为正。
- source_word: לִשְׁמֹר חֻקּוֹתַי וּמִצְוֺתַי
  choice: 谨守我的律例和诫命
  rationale: “谨守”传达持续留意并遵行；“律例”和“诫命”保留两个相关法律术语之间的区别及立约语体。
- source_word: עַבְדִּי
  choice: 我仆人
  rationale: 在大卫的王权与立约语境中，此词是尊荣性的侍奉称号；“仆人”比“奴隶”更切合此处功能。
- source_word: בַיִת נֶאֱמָן
  choice: 一个坚立的家
  rationale: בַיִת在此指王朝家系，同时保留“家”的圣经隐喻；נֶאֱמָן在此强调稳固、可靠、得以长存，“坚立”也与上文的“建立”形成自然关联。
- source_word: וְנָתַתִּי לְךָ אֶת יִשְׂרָאֵל
  choice: 并把以色列赐给你
  rationale: 直接保留以色列为上帝所赐对象的句法重点；“赐”符合上帝向君王授予统治权的庄重语境。
theological_decisions:
- issue: 应许的条件性
  choice: 用“你若……我就……”明确呈现真实的条件结构
  alternative: 将其表达为不附条件的保证
  rationale: 原文אִם及连续的顺服条款明确限定随后关于同在、王朝和以色列的应许，不应为神学协调而淡化。
- issue: “家”的含义
  choice: 正文保留“家”的隐喻，并由脚注说明这里指王朝家系
  alternative: 正文直接译为“王朝”或理解为实体房屋、宫殿
  rationale: 与大卫之“家”的比较表明此处主要指延续的王室家系；保留“家”可维持原文隐喻及与大卫之约传统的互文联系。
- issue: 以大卫为顺服典范所形成的张力
  choice: 按原文保留“像我仆人大卫所做的那样”
  alternative: 因大卫生平的过犯而弱化或限定这句话
  rationale: 本节确实将大卫作为立约忠诚的典范；翻译不应擅自加入例外说明或消解经文本身与大卫生平叙事之间的张力。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。保留“行我的道”“律例和诫命”“家”等重要圣经表达，同时避免生硬直译；以“若……就……”自然呈现希伯来文条件句。
