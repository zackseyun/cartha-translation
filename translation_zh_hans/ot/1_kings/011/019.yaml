base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/019.yaml
  text: Hadad found great favor in Pharaoh’s eyes[a], and he gave him as a wife the sister of his own wife[b], the sister of Tahpenes the queen mother.
translation:
  language: zh_hans
  text: 哈达在法老眼中大蒙恩宠；法老就把自己妻子[a]的妹妹，就是太后答比匿的妹妹[b]，嫁给他为妻。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文“他的妻子”按上下文较可能指法老的妻子；也可理解为指哈达的妻子。
    reason: alternative_reading
  - marker: b
    text: 希伯来文意为“尊贵的妇人”或“女主人”。这称号常可指王太后，也可能泛指王室中地位显赫的妇人；其在埃及宫廷中的确切职分不能确定。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמְצָא ... חֵן בְּעֵינֵי ... מְאֹד
  choice: 在……眼中大蒙恩宠
  rationale: 保留希伯来语“在某人眼中蒙恩”的惯用表达，并以“大”体现 מְאֹד 的加强语气；现代中文自然庄重。
- source_word: פַרְעֹה
  choice: 法老
  rationale: 采用现代中文圣经及历史叙述中通行的埃及君王称号。
- source_word: וַיִּתֶּן לוֹ אִשָּׁה
  choice: 嫁给他为妻
  rationale: 该结构表示法老将女子给哈达作妻子；中文用“嫁给他为妻”清楚表达婚姻关系，同时避免机械直译“给他一个妻子”。
- source_word: אֶת אֲחוֹת אִשְׁתּוֹ
  choice: 自己妻子的妹妹
  rationale: 语境及随后“答比匿的妹妹”较支持物主后缀指法老；“自己”在中文中帮助明确所指。
- source_word: תַּחְפְּנֵיס
  choice: 答比匿
  rationale: 采用该希伯来人名在简体中文圣经传统中的常见译名。
- source_word: הַגְּבִירָה
  choice: 王太后
  rationale: 该词指地位显赫的王室女性，常用作王太后的头衔；正文采用最可能的制度性含义，同时以脚注保留“王室尊贵妇人”等较宽泛可能。
theological_decisions:
- issue: “自己妻子的妹妹”中物主后缀的所指
  choice: 理解为法老的妻子，即法老把自己妻子的妹妹嫁给哈达。
  alternative: 理解为哈达的妻子，即“哈达妻子的妹妹”。
  rationale: 句子的主语是法老，紧接的同位说明“答比匿的妹妹”也支持答比匿是法老之妻；但希伯来语代词本身存在潜在歧义，故不将另一理解完全排除。
- issue: הַגְּבִירָה 的具体头衔
  choice: 王太后
  alternative: 王后；王室尊贵妇人；宫中女主人
  rationale: 该头衔在希伯来圣经中常指王太后，但在埃及宫廷语境中的确切职分不能完全确定，因此用脚注说明其较宽泛的字面范围。
translation_notes:
  register: 采用现代标准普通话，语体庄重而易懂。保留“在法老眼中蒙恩”的希伯来语意象；为免中文代词歧义，以“自己妻子”明确最可能的所指。脚注仅用于 הַגְּבִירָה 的真实词义范围；“答比匿”前置头衔后的语序依照自然中文调整为“王太后答比匿”。
