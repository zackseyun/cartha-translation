base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/003.yaml
  text: He had seven hundred wives[a], princesses, and three hundred concubines; and his wives turned away his heart.
translation:
  language: zh_hans
  text: 他有七百位妻子，都是贵族女子[a]，又有三百位妾；他的妻子使他的心偏离了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “贵族女子”或译“公主”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי לוֹ
  choice: 他有
  rationale: 希伯来语“היה + ל”是表达所有关系的惯用结构；译为“他有”自然准确。
- source_word: נָשִׁים שָׂרוֹת
  choice: 妃嫔，都是贵族女子
  rationale: נָשִׁים 在王室婚姻语境中指妻妾中的妻子；שָׂרוֹת 指身份尊贵或有地位的女子。此处避免把后者过度限定为君王之女，同时用“妃嫔”体现所罗门王室配偶的语境。
- source_word: שְׁבַע מֵאוֹת
  choice: 七百位
  rationale: 直译基数词，并以“位”搭配人物，符合现代汉语表达。
- source_word: וּפִלַגְשִׁים שְׁלֹשׁ מֵאוֹת
  choice: 又有三百位妾
  rationale: פִלַגְשִׁים 指在婚姻或性关系中地位低于正妻的妾；“妾”是简洁且符合历史语境的汉语对应词。
- source_word: וַיַּטּוּ
  choice: 使……偏离了
  rationale: נטה 的使役形在此表示使方向转偏；结合上下文，既有方向性的转变，也涉及信仰忠诚的偏离。
- source_word: נָשָׁיו
  choice: 这些妻妾
  rationale: 原文复指前述 נשים；在本句汉语中以“这些妻妾”自然承接前面两类女性，并清楚标明主语。
- source_word: אֶת לִבּוֹ
  choice: 他的心
  rationale: “心”保留希伯来语 לב 的传统意象；这里涵盖思想、意志和忠诚，不仅指情感。
theological_decisions:
- issue: “他的心”在上下文中的含义
  choice: 保留“心”，让它承载所罗门内在意志、忠诚与敬拜方向偏离的丰富含义
  alternative: 明确译成“使他不再忠于耶和华”或仅理解为情感改变
  rationale: 原文此节只说“使他的心偏离”，偏离的对象由后文说明。保留这一表达可避免提前补足对象，也不把希伯来语“心”的含义缩减为情感。
- issue: שָׂרוֹת 的身份含义
  choice: 贵族女子
  alternative: 公主
  rationale: 该词可指身份尊贵、有地位的女性；“公主”在现代汉语中通常特指君王之女，可能比原文更窄，因此正文采用较宽的“贵族女子”，脚注注明另一种译法。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“妃嫔”与“妾”适合古代王室语境；分号保持原句前后两部分的结构。“偏离”保留方向性和属灵忠诚方面的张力，不在本节提前补明偏离的对象。
