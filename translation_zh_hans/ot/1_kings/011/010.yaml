  text: וְ/צִוָּ֤ה אֵלָי/ו֙ עַל הַ/דָּבָ֣ר הַ/זֶּ֔ה לְ/בִ֨לְתִּי לֶ֔כֶת אַחֲרֵ֖י אֱלֹהִ֣ים אֲחֵרִ֑ים וְ/לֹ֣א שָׁמַ֔ר אֵ֥ת אֲשֶׁר צִוָּ֖ה יְהוָֽה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/010.yaml
  text: and had commanded him concerning this matter[a], not to go after other gods, but he did not keep what Yahweh had commanded.
translation:
  language: zh_hans
  text: 雅威曾就这件事吩咐他，不可随从别的神[a]；他却没有遵守雅威所吩咐的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “随从别的神”是盟约语境中的惯用语，指转向并敬拜其他神明。
    reason: cultural_note
lexical_decisions:
- source_word: וְצִוָּה אֵלָיו
  choice: 并且曾……吩咐他
  rationale: צוה 表示“吩咐、命令”；结合上文，完成式所指的吩咐先于所罗门的不顺服，因此用“曾”自然交代时序。אֵלָיו 按现代汉语表达为“吩咐他”。
- source_word: עַל הַדָּבָר הַזֶּה
  choice: 为这事
  rationale: דבר 在此指上文所说的事项；“为这事”简洁、自然，并保留指回上文的功能。
- source_word: לְבִלְתִּי לֶכֶת אַחֲרֵי אֱלֹהִים אֲחֵרִים
  choice: 不可随从别的神
  rationale: 该结构表达禁止；הלך אחרי 字面为“走在……之后”，在盟约语境中指转而跟从、敬拜其他神明。“随从”在中文中既自然，也保留这一惯用意象。
- source_word: וְלֹא שָׁמַר
  choice: 他却没有遵守
  rationale: שמר 在诫命语境中是“谨守、遵守”。连接词 וְ 在这里形成明显转折，译作“却”体现虽受吩咐仍不顺服的对比。
- source_word: אֵת אֲשֶׁר צִוָּה יְהוָה
  choice: 雅威所吩咐的
  rationale: אֲשֶׁר 引出吩咐的内容，译作“所吩咐的”符合现代汉语；יְהוָה 作为神的专名音译为“雅威”。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名。采用较贴近学界常见重构读音 Yahweh 的现代汉语音译“雅威”，使专名与“主”这一称号有别。
- issue: “随从别的神”的含义
  choice: 保留盟约惯用语“随从”并加注说明
  alternative: 意译为“敬拜别的神”
  rationale: הלך אחרי 的确涉及转向并敬拜其他神，但原文使用“跟随/走在……之后”的意象；正文保留该意象，脚注说明其语境含义，避免把含义收窄为单一行为。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“并且曾”承接上文并交代先后关系；分号突出神的吩咐与所罗门不遵守之间的对比。
