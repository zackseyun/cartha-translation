  text: וַ/יָּ֨קֶם יְהוָ֤ה שָׂטָן֙ לִ/שְׁלֹמֹ֔ה אֵ֖ת הֲדַ֣ד הָ/אֲדֹמִ֑י מִ/זֶּ֧רַע הַ/מֶּ֛לֶךְ ה֖וּא בֶּ/אֱדֽוֹם׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/014.yaml
  text: Then Yahweh raised up an adversary against Solomon[a], Hadad the Edomite; he was of the royal line in Edom.
translation:
  language: zh_hans
  text: 于是，耶和华兴起一个敌手[a]来对抗所罗门，就是以东人哈达；他是以东王室的后裔。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文为 satan；本节指“敌手”或“对头”，不是专名“撒但”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֶם
  choice: 兴起了
  rationale: 使役形式在此表示耶和华使一位反对者出现；“兴起”既保留神主动促成的含义，也不把它过度解释为正式任命。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经传统中对四字神名的通行音译，以保留其作为神专名的性质。
- source_word: שָׂטָן
  choice: 一个敌手
  rationale: 本处是普通名词，指与所罗门敌对的人；哈达这一同位语表明这里不是专名“撒但”。“敌手”也能自然表达政治上的对抗者。
- source_word: לִשְׁלֹמֹה
  choice: 为所罗门
  rationale: 介词 ל 在 שָׂטָן 的搭配中标明敌对所针对的人。中文“为所罗门兴起一个敌手”保留原文结构，并自然表达该敌手是针对所罗门而起。
- source_word: הֲדַד הָאֲדֹמִי
  choice: 以东人哈达
  rationale: 按现代中文习惯先给族属、后给人名，准确表达“哈达，这位以东人”的同位关系。
- source_word: מִזֶּרַע הַמֶּלֶךְ
  choice: 出自……王室
  rationale: 原文直译为“出于王的后裔”，是指王族血统；“出自王室”清楚、自然，同时保留其出身含义。
- source_word: הוּא בֶּאֱדוֹם
  choice: 以东的王室
  rationale: 原文末尾的独立代词和地点短语较凝练，可理解为强调该王族是在以东。将“在以东”与“王室”结合，符合上下文并形成自然中文。
theological_decisions:
- issue: 本节 שָׂטָן 的含义
  choice: 普通名词“敌手”
  alternative: 专名“撒但”
  rationale: 句法直接以以东人哈达说明这个 שָׂטָן 的身份，语境所指是人间政治敌手，而非魔鬼。译作“敌手”避免把后来的专名用法引入本节。
- issue: 耶和华与哈达兴起之间的关系
  choice: 保留“耶和华……兴起”的直接使役表述
  alternative: 弱化为耶和华仅仅容许哈达出现
  rationale: 希伯来文明确以耶和华为使役动词的主语。译文保留神主动促成的表达，不另行解释其方式或伦理含义。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“于是”承接叙事发展；分号保留哈达身份与王族出身两部分之间的层次。正文中的[a]与脚注标记一致。
