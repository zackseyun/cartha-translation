  text: וְ/זֶ֣ה הַ/דָּבָ֔ר אֲשֶׁר הֵרִ֥ים יָ֖ד בַּ/מֶּ֑לֶךְ שְׁלֹמֹה֙ בָּנָ֣ה אֶת הַ/מִּלּ֔וֹא סָגַ֕ר אֶת פֶּ֕רֶץ עִ֖יר דָּוִ֥ד אָבִֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/027.yaml
  text: 'And this was the reason why he raised his hand against the king: Solomon had built the Millo and closed up the breach of the city of David his father[a][b].'
translation:
  language: zh_hans
  text: 这就是他向王举手[a]的缘由：所罗门建造了米罗[b]，又封住了他父亲大卫的城的缺口。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “向王举手”也可较意译为“反抗王”或“背叛王”。希伯来语直译是“向王举手”。
    reason: alternative_reading
  - marker: b
    text: “米罗”可能是耶路撒冷一处有名称的防御工事或台地填筑结构。
    reason: cultural_note
lexical_decisions:
- source_word: הַדָּבָר
  choice: 缘由
  rationale: 该词本义为“事情、事由”，在“这就是……的事由”这一结构中引出下文的解释；译作“缘由”符合现代汉语，又不过度扩展为明确的因果判断。
- source_word: הֵרִים יָד
  choice: 举手反抗
  rationale: 保留希伯来语“举手”的形象，同时补出该习语在本处所表达的敌对、反叛含义，使普通读者能够自然理解。
- source_word: בַּמֶּלֶךְ
  choice: 反抗王
  rationale: 介词在该习语中标明敌对行动的对象；原文只说“王”，所罗门在下一分句才被点名，因此不提前补入其名。
- source_word: הַמִּלּוֹא
  choice: 米罗
  rationale: 这是耶路撒冷一处特定建筑或地形设施的名称，而其确切性质仍有不确定性，故采用音译并以脚注说明。
- source_word: בָּנָה
  choice: 修建
  rationale: 基本义为“建造”；用于名为“米罗”的工程设施时，“修建”自然且准确。
- source_word: סָגַר
  choice: 封住
  rationale: 动词本义为“关闭、封闭”；与城防“缺口”搭配时，“封住”既保留原文意象，也符合现代汉语。
- source_word: פֶּרֶץ
  choice: 缺口
  rationale: 指城墙或防御工事破开的口子；“缺口”比“裂口”更适合城防语境。
- source_word: עִיר דָּוִד
  choice: 大卫城
  rationale: 这是与大卫相关的耶路撒冷堡垒区的固定名称；“大卫城”是简洁自然的中文专名形式。
- source_word: אָבִיו
  choice: 他父亲
  rationale: 代词所指为所罗门；大卫是其父亲，按字面译出即可。
theological_decisions: []
