    issue: “我正要把这国从所罗门手中撕走”对קֹרֵעַ的处理不够贴切。
    rationale: 希伯来分词在此为宣告中的生动、迫近动作；“正要”将动作放在尚未开始的阶段，“撕走”又较口语化。译作“我正把这王国从所罗门手中撕去”更贴近原文的形象、时态效果，并呼应“撕下来的布片”。
  - severity: low
    issue: “雅威—以色列的上帝”中的破折号不自然。
    rationale: 原文是“雅威，以色列的上帝”的同位说明；中文以逗号呈现即可，避免横线造成复合名称的误读。
  - severity: low
    issue: “你拿”未显出לְךָ的个人受益/为己取得语气。
    rationale: 虽不构成意义错误，但“你自己拿”可自然保留该语气。
