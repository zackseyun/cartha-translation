  text: וַ/יֹּ֨אמֶר֙ לְ/יָֽרָבְעָ֔ם קַח לְ/ךָ֖ עֲשָׂרָ֣ה קְרָעִ֑ים כִּ֣י כֹה֩ אָמַ֨ר יְהוָ֜ה אֱלֹהֵ֣י יִשְׂרָאֵ֗ל הִנְ/נִ֨י קֹרֵ֤עַ אֶת הַ/מַּמְלָכָה֙ מִ/יַּ֣ד שְׁלֹמֹ֔ה וְ/נָתַתִּ֣י לְ/ךָ֔ אֵ֖ת עֲשָׂרָ֥ה הַ/שְּׁבָטִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/031.yaml
  text: 'And he said to Jeroboam[a], “Take for yourself ten pieces, for this is what Yahweh, the God of Israel, says: ‘Look, I am tearing the kingdom out of the hand of Solomon, and I will give you ten tribes.’”'
translation:
  language: zh_hans
  text: 他对耶罗波安说：“你自己拿十块撕下来的布片[a]，因为雅威，以色列的上帝，这样说：‘看，我正把这王国从所罗门手中撕去，把十个支派给你。’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“十块碎片”。这个希伯来词指撕裂后形成的片块，与亚希雅撕裂衣服的象征性行动相呼应。
    reason: 说明原词与“撕裂”的词源联系，并保留较宽泛的译法。
lexical_decisions:
- source_word: קַח לְךָ
  choice: 你拿
  rationale: קַח是“拿”的命令式；לְךָ带有为自己取得的意味。汉语仅说“你拿”已能在分配布片的语境中自然表达这一含义，避免生硬的“为自己拿”。
- source_word: קְרָעִים
  choice: 撕下来的布片
  rationale: 该词源自“撕裂”一词，在本段所演示的象征性行动中指衣服被撕成的片块。“撕下来的布片”既保留撕裂动作，也清楚交代所指。
- source_word: כִּי כֹה אָמַר
  choice: 因为……这样说
  rationale: 保留כִּי的因果衔接，并以现代汉语自然呈现先知宣告公式“如此说”。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以常见的现代汉语音译呈现四字神名，不以称号代替专名。
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: 以色列的上帝
  rationale: 自然表达希伯来语属格结构，并明确雅威是以色列的上帝。
- source_word: הִנְנִי קֹרֵעַ
  choice: 看，我正要……撕走
  rationale: “看”传达הִנְנִי唤起注意的作用；“正要”保留分词所具有的生动、迫近意味，而不把行动僵化为已经进行。
- source_word: הַמַּמְלָכָה
  choice: 这国
  rationale: 在上下文中指所罗门统治的王国；“这国”简洁自然，也保留特指性。
- source_word: מִיַּד שְׁלֹמֹה
  choice: 从所罗门手中
  rationale: 保留“手”的希伯来意象，表达从所罗门的权力和掌控之下夺走王国。
- source_word: וְנָתַתִּי לְךָ
  choice: 把……给你
  rationale: 以自然的现代汉语表达给予及其接受者。
- source_word: עֲשָׂרָה הַשְּׁבָטִים
  choice: 十个支派
  rationale: 准确表达十个部族单位；汉语数词结构无需另译名词前的定冠含义。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用以色列上帝的四字神名。译作“雅威”保留专名性质，避免以“主”这一称号代替；“耶和华”则反映较晚形成的混合读音。
translation_notes:
  register: 采用自然、庄重而不古奥的现代标准汉语。“看”比“看哪”更贴近日常现代汉语；“撕走”保留原文把王国从所罗门手中撕夺而去的强烈意象。破折号用于清楚标示“雅威”与“以色列的上帝”的同位关系。
