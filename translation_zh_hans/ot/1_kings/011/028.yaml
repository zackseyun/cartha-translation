base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/028.yaml
  text: The man Jeroboam was a mighty man of valor[a], and Solomon saw that the young man was industrious[b], so he appointed him over all the labor force of the house of Joseph.
translation:
  language: zh_hans
  text: 耶罗波安是个有能力的人[a]。所罗门见这年轻人勤于做工，就派他管理约瑟家[b]的一切劳役。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“勇武有力”。这个希伯来语词组可以表示力量、勇武或卓越的能力。
    reason: lexical_alternative
  - marker: b
    text: “约瑟家”指从约瑟而出的支派，特别是以法莲和玛拿西。
    reason: cultural_note
lexical_decisions:
- source_word: וְהָאִישׁ יָרָבְעָם
  choice: 耶罗波安这人
  rationale: 以自然的现代汉语引出人物，同时保留希伯来语“这人/那人”的个体指称；句首的 וְ 在此承接叙事，不另译为带时间意味的“那时”。
- source_word: גִּבּוֹר חָיִל
  choice: 很有才干
  rationale: 该词组可表示力量、勇武、财富或卓越能力。本节语境着重耶罗波安获任管理劳役，因此正文采用涵盖能力的“很有才干”，并在脚注保留“勇武有力”等可能含义。
- source_word: הַנַּעַר
  choice: 这个年轻人
  rationale: נַעַר 可指少年、年轻人或仆役；耶罗波安在此承担管理职责，译作“年轻人”最合语境，又不把身份限定为仆役。
- source_word: כִּי עֹשֵׂה מְלָאכָה הוּא
  choice: 办事勤奋
  rationale: 字面意思是“他是做工的/他在做工”。上下文说明所罗门为何任用他，故用自然汉语表达其勤于办事的评价意味，同时不扩张为特定技术或官职。
- source_word: וַיַּפְקֵד אֹתוֹ
  choice: 就派他监管
  rationale: פקד 的使役形在行政语境中表示任命、派定或使人负责；“派他监管”明确表达其被置于劳役之上。
- source_word: לְכָל סֵבֶל
  choice: 监管……一切劳役
  rationale: סֵבֶל 指负担、负重劳动或征派劳役。译作“劳役”保留沉重及受征派劳动的社会含义，却不在正文中过度限定具体组织形式。
- source_word: בֵּית יוֹסֵף
  choice: 约瑟家
  rationale: 直译这一支派性称呼，不直接替换为以法莲和玛拿西，以保留原文表达；具体所指在脚注说明。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“办事勤奋”适合普通读者理解，又保留原文因其工作表现而获任用的逻辑；“劳役”比“劳动力”更准确地反映 סֵבֶל 所含的负担与征役色彩。
