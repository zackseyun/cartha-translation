revisions:
- from: 耶罗波安这人很有才干[a]。所罗门见这个年轻人办事勤奋，就派他监管约瑟家[b]的一切劳役。
  to: 耶罗波安是个有能力的人[a]。所罗门见这年轻人勤于做工，就派他管理约瑟家[b]的一切劳役。
  rationale: 以“有能力的人”表达 גִּבּוֹר חַיִל 在本节中对耶罗波安能力的称赞，避免无依据加强程度，并由脚注保留其勇武和力量的词义范围。以“勤于做工”替代“办事勤奋”，使译文更贴近 עֹשֵׂה מְלָאכָה，同时维持现代汉语的流畅性。其余译法忠实且自然，脚注锚点与内容均保留。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T05:50:48Z'
