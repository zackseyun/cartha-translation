source:
  edition: WLC
  text: אָז֩ יִבְנֶ֨ה שְׁלֹמֹ֜ה בָּמָ֗ה לִ/כְמוֹשׁ֙ שִׁקֻּ֣ץ מוֹאָ֔ב בָּ/הָ֕ר אֲשֶׁ֖ר עַל פְּנֵ֣י יְרוּשָׁלִָ֑ם וּ/לְ/מֹ֕לֶךְ שִׁקֻּ֖ץ בְּנֵ֥י עַמּֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/007.yaml
  text: Then Solomon built a high place for Chemosh[a], the abomination of Moab, on the mountain that is opposite Jerusalem, and for Molech, the abomination of the Ammonites.
translation:
  language: zh_hans
  text: 那时，所罗门在耶路撒冷对面的山上，为摩押的可憎之物基抹，也为亚扪人的可憎之物摩洛[a]，筑了一处丘坛。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “摩洛”或作“米勒公”。此处希伯来文传统读作“摩洛”，但有人认为它与亚扪人的神“米勒公”有关。
    reason: 保留神名辨认上的另一种读法，不在正文中消除原文传统与相关经文之间的张力。
lexical_decisions:
- source_word: אָז
  choice: 那时
  rationale: 表示叙事进程中的时间推进；“那时”自然庄重，也不把连接关系说得过强。
- source_word: יִבְנֶה
  choice: 筑了
  rationale: 虽为未完成式形态，但在אָז引出的叙事语境中指过去发生的行动；汉语用完成体表达最自然。
- source_word: בָּמָה
  choice: 丘坛
  rationale: 这是供祭祀使用的高处或高地圣所；“丘坛”保留其宗教术语性质，又符合现代中文圣经语体。
- source_word: לִכְמוֹשׁ
  choice: 为……基抹
  rationale: 介词表示这座丘坛是为该神明而建；כְמוֹשׁ按通行中文译名音译为“基抹”。
- source_word: שִׁקֻּץ מוֹאָב
  choice: 摩押可憎的神
  rationale: שִׁקֻּץ带有强烈贬义，在此指受崇拜的异族神明；译作“可憎的神”既保留叙述者的神学评价，也使现代读者清楚所指。
- source_word: בָּהָר אֲשֶׁר עַל־פְּנֵי יְרוּשָׁלִָם
  choice: 在耶路撒冷对面的山上
  rationale: 直译空间关系，不在正文中进一步限定为“东边”或认定具体山名。
- source_word: וּלְמֹלֶךְ
  choice: 也为……摩洛
  rationale: 正文依马所拉传统读法译作“摩洛”；与“米勒公”相联系的异说置于脚注，以保留文本问题。
- source_word: שִׁקֻּץ בְּנֵי עַמּוֹן
  choice: 亚扪人可憎的神
  rationale: 与前半句形成平行；בְּנֵי עַמּוֹן按现代汉语习惯译为“亚扪人”。
theological_decisions:
- issue: 对外族神明的贬义称呼
  choice: 两处שִׁקֻּץ均译为“可憎的神”
  alternative: “可憎之物”或“可厌恶的神”
  rationale: 原文本身明确作出负面宗教评价；“可憎的神”既不弱化这种力度，也避免让普通读者误以为所指只是无生命物件。
- issue: מֹלֶךְ所指神名
  choice: 正文作“摩洛”
  alternative: “米勒公”
  rationale: 马所拉文本在此传统读作“摩洛”，但有学者根据相关经文将其与亚扪神米勒公联系；正文依所给希伯来文本，异说保留于脚注。
- issue: 一座丘坛是否同时供给两神
  choice: 后半句补出“筑了丘坛”
  alternative: 只在前半句出现“一座丘坛”，将两位神并列为同一丘坛的对象
  rationale: 希伯来文只明说一次בָּמָה，但介词结构依次列出两位神；中文补出谓语和宾语可自然表达分别为两神建坛的通常句法理解，同时不增添地点或数量细节。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“丘坛”作为必要的宗教术语予以保留；句式稍作展开，使两个平行的献建对象在中文中清楚可读。
