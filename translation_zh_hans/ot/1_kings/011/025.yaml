base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/025.yaml
  text: And he was an adversary to Israel all the days of Solomon[a], along with the harm that Hadad caused. And he loathed Israel and reigned over Aram.
translation:
  language: zh_hans
  text: 在所罗门有生之年，他一直是以色列的敌手[a]；此外还有哈达所造成的祸患。他憎恶以色列，并统治亚兰。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“除了哈达所造成的祸患以外。”这句希伯来文有所省略，可能是说，这位敌手的兴起是在哈达所造成的祸患之外。
    reason: 保留 וְאֶת הָרָעָה אֲשֶׁר הֲדָד 的省略结构及其与前句的附加关系所造成的句法歧义。
lexical_decisions:
- source_word: שָׂטָן
  choice: 为敌
  rationale: 这里指政治上的人类敌手，而非专名“撒但”。用“与以色列为敌”自然表达该普通名词及其关系结构。
- source_word: כָּל יְמֵי שְׁלֹמֹה
  choice: 在所罗门有生之年
  rationale: 保留时间范围的完整性；“有生之年”在现代汉语中自然庄重，同时不强行限定为在位年间。
- source_word: וְאֶת הָרָעָה אֲשֶׁר הֲדָד
  choice: 又加上哈达所造成的祸患
  rationale: 原文省略成分且句法困难；“又加上”表达附加关系，“祸患”体现此处 רָעָה 所指的敌对伤害，而非抽象的道德邪恶。
- source_word: וַיָּקָץ בְּיִשְׂרָאֵל
  choice: 他憎恶以色列
  rationale: קוץ 表达强烈厌恶；“憎恶”比“敌视”更充分保留其情感强度，也符合庄重叙事语体。
- source_word: וַיִּמְלֹךְ עַל אֲרָם
  choice: 并统治亚兰
  rationale: מלך 在此表示作王掌权；“统治亚兰”自然准确，并保留专名“亚兰”，不以较晚的地理名称“叙利亚”替代。
theological_decisions:
- issue: שָׂטָן 是否应译作专名“撒但”
  choice: 译为人类政治敌手：“与以色列为敌”
  alternative: 译作“撒但”
  rationale: 上下文讲述所罗门的政治敌人；此处是普通名词，不是超自然者的专名。译作“撒但”会引入本段没有的后期神学含义。
- issue: 省略短语 וְאֶת הָרָעָה אֲשֶׁר הֲדָד 与上下文的关系
  choice: 理解为附加关系：“又加上哈达所造成的祸患”
  alternative: 把该短语直接并入“所罗门有生之年”的范围，或补出其他谓语
  rationale: 希伯来文句法残缺而含混；正文采用最可能的附加理解，但以脚注明确保留原文的不确定性。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“为敌”“憎恶”“统治亚兰”保持历史叙事的力度，避免把 שָׂטָן 神学化。脚注标记 [a] 已置于正文相应位置。
