  text: וְ/לָקַחְתִּ֥י הַ/מְּלוּכָ֖ה מִ/יַּ֣ד בְּנ֑/וֹ וּ/נְתַתִּ֣י/הָ לְּ/ךָ֔ אֵ֖ת עֲשֶׂ֥רֶת הַ/שְּׁבָטִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/035.yaml
  text: But I will take the kingdom from the hand of his son and give it to you[b][a], the ten tribes.
translation:
  language: zh_hans
  text: 但我要从他儿子手中夺走王国，把它赐给你，就是那十个支派。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְלָקַחְתִּי
  choice: 但我要……夺走
  rationale: 连接词在上下文中带有转折意味；完成式在预言话语中表达将来的行动。לקח在此指取走、收回统治权，译作“夺走”自然明确。
- source_word: הַמְּלוּכָה
  choice: 这国
  rationale: ממלכה在此指从所罗门王朝手中移交的国度；“这国”符合现代汉语语境，也保留其政治实体与统治领域的含义。
- source_word: מִיַּד בְּנוֹ
  choice: 从他儿子手中
  rationale: 保留希伯来语“从……手中”的意象；现代汉语同样可自然表达从某人的掌控中取走。
- source_word: וּנְתַתִּיהָ לְּךָ
  choice: 把它赐给你
  rationale: 阴性代词后缀回指“国”；“赐给”适合上帝作为说话者的庄重语域，同时准确表达נתן“给予”。
- source_word: אֵת עֲשֶׂרֶת הַשְּׁבָטִים
  choice: 就是那十个支派
  rationale: 该短语同位说明所赐之国的具体范围，即十个支派；用“就是”清楚传达同位关系，避免误解为在整个国之外另赐十个支派。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“从他儿子手中”保留原文意象；“就是那十个支派”显明希伯来语同位结构而不额外解释。
