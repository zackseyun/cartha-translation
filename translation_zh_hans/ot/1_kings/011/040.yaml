base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/040.yaml
  text: Then Solomon sought to put Jeroboam to death[a], but Jeroboam arose and fled to Egypt, to Shishak king of Egypt[b], and he was in Egypt until the death of Solomon.
translation:
  language: zh_hans
  text: 于是，所罗门试图杀死耶罗波安[a]；耶罗波安便起身逃往埃及，到埃及王示撒那里去。他留在埃及，直到所罗门死去。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“所罗门设法杀死耶罗波安。”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְבַקֵּשׁ
  choice: 想要
  rationale: בקש 后接不定式在此表示寻求、企图做某事；“想要”自然表达意图，又不暗示行动已经成功。
- source_word: לְהָמִית
  choice: 杀死
  rationale: מות 的使役式不定词直指使耶罗波安死亡；现代汉语中“杀死”准确、庄重，也比“处死”更少预设司法程序。
- source_word: וַיָּקָם
  choice: 动身
  rationale: קום 在叙事中常标志采取行动，并非必须指从坐卧姿势站起；“动身”与随后的逃亡衔接自然。
- source_word: וַיִּבְרַח
  choice: 逃往
  rationale: ברח 表示因危险而逃离；结合目的地埃及译作“逃往”，简洁清楚。
- source_word: מִצְרַיִם ... אֶל שִׁישַׁק מֶלֶךְ מִצְרַיִם
  choice: 逃往埃及，投奔埃及王示撒
  rationale: 首个“埃及”是逃亡的目的地，אֶל 随后具体指出示撒；“投奔”自然表达前往某位外国君王处，同时保留国家与君王两层信息。
- source_word: וַיְהִי בְמִצְרַיִם
  choice: 他住在埃及
  rationale: 字面是“他在埃及”；后接“直到”表明持续居留，汉语用“住在”更自然。
- source_word: עַד מוֹת שְׁלֹמֹה
  choice: 直到所罗门死去
  rationale: 原文名词结构意为“直到所罗门之死”；汉语动词表达更流畅，意义不变。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“于是……就……”呈现希伯来叙事的推进关系；人名按中文圣经通行译名处理。未为“住在埃及，直到所罗门死去”另设脚注，因为正文已自然、完整地传达原文。
