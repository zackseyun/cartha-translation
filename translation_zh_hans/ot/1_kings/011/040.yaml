  source_fidelity: “想要杀死”主要表达主观意愿，较弱地体现了 וַיְבַקֵּשׁ + 不定式在此处“试图／设法”的行动意向。 “投奔”也略添原文未明说的依附、求庇护意味；原文只说耶罗波安逃往埃及、到埃及王示撒那里。修订以“试图”和“到……那里去”保留原文叙事与关系的限度。
  naturalness: 修订后的“起身逃往埃及，到埃及王示撒那里去”在现代庄重叙事汉语中顺畅，且清楚对应连续的行动与双重地点说明。“留在埃及，直到所罗门死去”自然表达持续状态。
  terminology: “所罗门”“耶罗波安”“示撒”“埃及王”均符合通行中文圣经人名及王衔表达。没有涉及需调整的神学术语。
