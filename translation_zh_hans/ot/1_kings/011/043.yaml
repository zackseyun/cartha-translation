base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/043.yaml
  text: And Solomon slept with his fathers and was buried in the city of David his father[a], and Rehoboam his son reigned in his place.
translation:
  language: zh_hans
  text: 所罗门与列祖同睡[a]，葬在他父亲大卫的城里。他儿子罗波安接替他作王。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文“与列祖同睡”是表示死亡并归到先祖之列的惯用语。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב עִם אֲבֹתָיו
  choice: 与列祖同睡
  rationale: 这是希伯来文君王讣告中的惯用语，既保留“睡”的委婉表达，也传达归到先祖之列的含义；比直接译作“去世”更能保留原文意象。
- source_word: וַיִּקָּבֵר
  choice: 葬在
  rationale: 该动词在此为被动意义；现代汉语用“葬在”简洁自然，已清楚表达被安葬。
- source_word: בְּעִיר דָּוִד אָבִיו
  choice: 在他父亲大卫的城里
  rationale: 依照原文保留“大卫”与“他父亲”的同位关系，并凸显所罗门葬于大卫王城的王朝背景。
- source_word: וַיִּמְלֹךְ
  choice: 作王
  rationale: 该词在王位承继公式中表示执掌王权；“作王”简洁、庄重，也符合现代汉语圣经叙事语体。
- source_word: תַּחְתָּיו
  choice: 接替他
  rationale: 原词表示取代某人的位置；“接替他作王”自然准确地表达王位承继，比单说“在他以后”更能保留替位含义。
theological_decisions:
- issue: 死亡公式中的“睡”是否应直接解释为“死”
  choice: 正文保留“与列祖同睡”，脚注说明其为死亡的惯用委婉语
  alternative: 正文译作“去世”或“死后归到列祖那里”
  rationale: 保留原文的死亡意象及其含蓄张力，不把“睡”额外解释为某种特定的死后状态或复活教义，同时借脚注确保现代读者不会误解为普通睡眠。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“列祖同睡”保留希伯来王室讣告的传统表达；“接替他作王”则以自然现代汉语呈现王位承继公式。
