  text: רַ֤ק אֶת כָּל הַ/מַּמְלָכָה֙ לֹ֣א אֶקְרָ֔ע שֵׁ֥בֶט אֶחָ֖ד אֶתֵּ֣ן לִ/בְנֶ֑/ךָ לְמַ֨עַן֙ דָּוִ֣ד עַבְדִּ֔/י וּ/לְמַ֥עַן יְרוּשָׁלִַ֖ם אֲשֶׁ֥ר בָּחָֽרְתִּי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/013.yaml
  text: Yet I will not tear away the whole kingdom; I will give one tribe to your son[a], for the sake of David my servant and for the sake of Jerusalem, which I have chosen.
translation:
  language: zh_hans
  text: 不过[a]，我不会把整个王国都撕裂；我要把一个支派赐给你的儿子，为了我的仆人大卫，也为了我所拣选的耶路撒冷。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “不过”或译“只是”。
    reason: רַק既可侧重转折，也可侧重限制；两种语气在这里相近，但侧重点略有不同。
lexical_decisions:
- source_word: רַק
  choice: 不过
  rationale: 此处引出对前述审判的限制，具有转折兼限定的作用；“不过”在现代汉语中自然地表达这种语气，同时以脚注保留“只是”的可能译法。
- source_word: כָּל הַמַּמְלָכָה
  choice: 整个王国
  rationale: כָּל强调王国的全部范围；“整个王国”准确而自然。
- source_word: אֶקְרָע
  choice: 撕走
  rationale: 保留קָרַע“撕裂”的鲜明比喻，并以“走”表达王国被夺离所罗门家的政治含义。
- source_word: שֵׁבֶט אֶחָד
  choice: 一个支派
  rationale: 在王国分裂的上下文中，שֵׁבֶט指以色列的支派，而非杖或权杖。
- source_word: אֶתֵּן לִבְנֶךָ
  choice: 我要把……赐给你的儿子
  rationale: 忠实表达上帝将一个支派给予所罗门之子的意思；“赐给”符合说话者为上帝的语境，又不增添额外神学含义。
- source_word: לְמַעַן דָּוִד עַבְדִּי
  choice: 这是为了我的仆人大卫
  rationale: לְמַעַן表示所顾念的对象或行动缘由；“为了”保留其宽泛含义，不把它限定为某一种神学机制。
- source_word: וּלְמַעַן יְרוּשָׁלַם
  choice: 也是为了……耶路撒冷
  rationale: 与前一个לְמַעַן平行；重复“为了”以保留原文并列的两个理由。
- source_word: אֲשֶׁר בָּחָרְתִּי
  choice: 我所拣选的
  rationale: “所拣选的”简洁表达上帝已经作出的选择及其持续效力，并保持庄重的经文语体。
theological_decisions:
- issue: 保留一个支派的原因
  choice: 并列保留上帝对其仆人大卫的顾念，以及他对耶路撒冷的拣选
  alternative: 只把这一保留归因于大卫之约，或只突出圣城与圣殿
  rationale: 希伯来文用两个平行的לְמַעַן短语陈明理由；译文不把二者合并，也不判定其中一个比另一个更根本。
translation_notes:
  register: 采用自然、庄重的现代标准普通话。“撕走”保留原文的政治性撕裂比喻；句式清楚呈现审判的限制及两个并列理由。
