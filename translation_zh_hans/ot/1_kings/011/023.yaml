  rationale: 将“给他兴起一个敌手”改为“兴起一个敌手来对付他”，消除现代汉语中可能的受益性歧义，并准确传达该敌手针对“他”（上下文指所罗门）的关系。其余人名、句法和背景时态均予保留；脚注仅作书面语措辞微调。
