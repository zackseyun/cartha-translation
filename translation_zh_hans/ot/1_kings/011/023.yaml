base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/023.yaml
  text: And God raised up for him an adversary[a], Rezon son of Eliada, who had fled from Hadadezer king of Zobah, his master.
translation:
  language: zh_hans
  text: 上帝又兴起一个敌手[a]来对付他，就是以利亚大的儿子利逊。他曾逃离自己的主人琐巴王哈大底谢。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文为 satan；在这里是普通名词，意思是“敌手”或“对手”，不是专名“撒但”。
    reason: 说明该词在本节政治叙事中的词义，避免读者误解为邪灵的专名。
lexical_decisions:
- source_word: וַיָּקֶם
  choice: 又……兴起
  rationale: 使役式在这里表示上帝使某人起来与另一人作对。“兴起”既贴近原文，也符合现代汉语的叙事语体；“又”承接本段此前另一敌手的叙述。
- source_word: אֱלֹהִים
  choice: 上帝
  rationale: 本叙事中指以色列的上帝；采用现代汉语中庄重而通行的称呼。
- source_word: לוֹ
  choice: 给他
  rationale: 保留介词ל的表层关系；结合“敌手”可自然理解为给他兴起一个与他作对的人。“他”依上下文指所罗门，不在本节擅自补明。
- source_word: שָׂטָן
  choice: 敌手
  rationale: 此处是指人间政治对手的普通名词，不是专名“撒但”。“敌手”简洁自然，并保留与某人作对的含义。
- source_word: רְזוֹן
  choice: 利逊
  rationale: 采用中文圣经传统中通行的人名音译。
- source_word: בֶּן אֶלְיָדָע
  choice: 以利亚大的儿子
  rationale: 按希伯来语父子关系结构直译，并采用通行音译。
- source_word: אֲשֶׁר בָּרַח
  choice: 他曾逃离
  rationale: “曾”表明逃离发生在上帝兴起他作敌手以前，符合该从句的背景叙事功能。
- source_word: מֵאֵת הֲדַדְעֶזֶר
  choice: 逃离……哈大底谢
  rationale: מֵאֵת表示从某人那里离开；“逃离”在汉语中自然涵盖这种分离关系。
- source_word: מֶלֶךְ צוֹבָה
  choice: 琐巴王
  rationale: 将希伯来语“琐巴的王”按自然汉语表达为“琐巴王”。
- source_word: אֲדֹנָיו
  choice: 自己的主人
  rationale: 后缀所指是利逊；“自己的”明确反身关系。“主人”符合臣属或侍从的政治语境，也避免与神圣称号混淆。
theological_decisions:
- issue: שָׂטָן在本节中的含义
  choice: 普通名词“敌手”
  alternative: 专名“撒但”
  rationale: 上下文明确把该词同人类政治人物利逊并置，故应理解为与所罗门作对的人；译成专名会把原文没有表达的邪灵身份引入经文。
- issue: 上帝兴起敌手的行动
  choice: 直译为“上帝又给他兴起”
  alternative: 弱化为“上帝容许一个敌手出现”
  rationale: 原文使役式明确以上帝为主语，不宜将其神学张力弱化为单纯许可。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。以两个短句处理较长的希伯来语句子，使人物关系清楚；保留“给他”的代词形式，不在本节正文中补入上下文所指的所罗门。所有地名、人名采用简体中文圣经传统中较通行的写法。
