  to: 因为他们离弃我，向西顿人的神亚斯她录下拜[a]，向摩押的神基抹和亚扪人的神米勒公下拜[b]，没有走在我的道路上，没有像他父亲大卫[c]那样，做我眼中看为正的事，并遵守我的律例和典章。
  rationale: 修订仅改善现代汉语的搭配和列举节奏，并补足英语审校轨迹中已有、且对中文读者同样必要的王朝先祖说明。“走在我的道路上”保留原文行走意象；将法律项目译为“遵守”是汉语自然表达，不将其解释为不同的原文动词或改变意义。
