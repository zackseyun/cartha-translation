id: 1KI.11.33
reference: 1 Kings 11:33
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: יַ֣עַן אֲשֶׁ֣ר עֲזָב֗וּ/נִי וַ/יִּֽשְׁתַּחֲווּ֮ לְ/עַשְׁתֹּרֶת֮ אֱלֹהֵ֣י צִֽדֹנִין֒ לִ/כְמוֹשׁ֙ אֱלֹהֵ֣י מוֹאָ֔ב וּ/לְ/מִלְכֹּ֖ם אֱלֹהֵ֣י בְנֵֽי עַמּ֑וֹן וְ/לֹֽא הָלְכ֣וּ בִ/דְרָכַ֗/י לַ/עֲשׂ֨וֹת הַ/יָּשָׁ֧ר בְּ/עֵינַ֛/י וְ/חֻקֹּתַ֥/י וּ/מִשְׁפָּטַ֖/י כְּ/דָוִ֥ד אָבִֽי/ו׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/033.yaml
  text: because they have forsaken me and bowed down to Ashtoreth[a], the god of the Sidonians, to Chemosh, the god of Moab, and to Milcom, the god of the Ammonites, and have not walked in my ways, to do what is right in my eyes and my statutes and my judgments[d][c][b], like David his father.
translation:
  language: zh_hans
  text: 因为他们离弃我，向西顿人的神亚斯她录下拜[a]，向摩押的神基抹和亚扪人的神米勒公下拜[b]，没有走在我的道路上，没有像他父亲大卫[c]那样，做我眼中看为正的事，并遵守我的律例和典章。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 亚斯她录是西顿人所敬奉的女神；希伯来语此处仍使用通常译作“神”的称呼。
    reason: 说明原文措辞与该神祇性别之间的关系。
  - marker: b
    text: “米勒公”是希伯来文本此处的读法；有些人认为这个名称与“摩洛”有关。
    reason: 保留读者可能熟悉的传统名称关联，同时不取代正文读法。
  - marker: c
    text: “他父亲”指大卫为所罗门的王朝先祖，并非所罗门的生父。
    reason: 说明本节末尾单数“他父亲大卫”的上下文所指，同时保留原文措辞。
lexical_decisions:
- source_word: יַעַן אֲשֶׁר
  choice: 因为
  rationale: 自然准确地表达原因，说明王国分裂的缘由。
- source_word: עֲזָבוּנִי
  choice: 他们离弃了我
  rationale: “离弃”保留盟约背叛和转离上帝的沉重含义；复数主语也按希伯来文本保留。
- source_word: וַיִּשְׁתַּחֲווּ
  choice: 下拜
  rationale: 既保留俯伏跪拜的动作，也在语境中清楚表达宗教敬拜。
- source_word: לְעַשְׁתֹּרֶת
  choice: 向……亚斯她录
  rationale: 采用现代中文圣经语境中较通行的音译。
- source_word: אֱלֹהֵי צִדֹנִין
  choice: 西顿人的神
  rationale: 忠实保留希伯来语的族群复数结构；中文“神”本身不标明性别，因此不必在正文中强行改作“女神”。
- source_word: לִכְמוֹשׁ
  choice: 向……基抹
  rationale: 采用该摩押神祇名称的通行中文音译。
- source_word: וּלְמִלְכֹּם
  choice: 亚扪人的神米勒公
  rationale: 马所拉文本此处读作“米勒公”，不以传统上相关联的“摩洛”取代正文读法。
- source_word: וְלֹא הָלְכוּ בִדְרָכַי
  choice: 他们没有遵行我的道路
  rationale: “遵行……道路”保留希伯来语有关生活和忠诚的盟约性比喻，同时符合庄重的现代中文。
- source_word: לַעֲשׂוֹת הַיָּשָׁר בְּעֵינַי
  choice: 做我眼中看为正的事
  rationale: 保留“在我眼中”的评判视角，并用自然中文表达。
- source_word: וְחֻקֹּתַי וּמִשְׁפָּטַי
  choice: 遵行我的律例和典章
  rationale: 希伯来语以一个“做/行”统摄并列成分；中文补出“遵行”，使法律用语自然清楚而不改变含义。
- source_word: כְדָוִד אָבִיו
  choice: 像他父亲大卫那样
  rationale: 按希伯来文本保留单数代词和“父亲”的直接表述，不擅自改释为较宽泛的王朝祖先。
theological_decisions:
- issue: 亚斯她录为女性神祇，而希伯来语称其为 אֱלֹהֵי
  choice: 西顿人的神
  alternative: 西顿人的女神
  rationale: 中文“神”不强制标示性别，故正文既可贴近原文，又不会像英语“god”那样明确赋予男性性别；脚注补充其历史身份。
- issue: מִלְכֹּם 的身份和名称
  choice: 米勒公
  alternative: 摩洛
  rationale: 正文遵从马所拉文本的明确读法；与摩洛的可能关联留在脚注中，不把传统认同写进正文。
- issue: 复数主语与末尾单数“他父亲”之间的张力
  choice: 保留“他们”及“他父亲”
  alternative: 统一改成“所罗门……他的父亲”
  rationale: 原文在本节中确有复数动词和末尾单数物主形式；翻译保留这一变化，不以解释性改写消除文本张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“下拜”保留敬拜动作，“律例和典章”维持法律与盟约语域。标点将偶像崇拜与不遵行上帝道路两个分句清楚分开。
