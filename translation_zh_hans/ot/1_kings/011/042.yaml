  text: And the days that Solomon reigned in Jerusalem over all Israel were forty years.
translation:
  language: zh_hans
  text: 所罗门在耶路撒冷统治全以色列，共四十年。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/הַ/יָּמִים
  choice: 共……年
  rationale: “日子”在此是表示在位时长的希伯来语惯用表达；结合句末的“四十年”，译为“共……年”更符合现代汉语的王朝纪年总结句式。句首的 וְ 承接上下文，汉语无需机械译出“而/并且”。
- source_word: אֲשֶׁר מָלַךְ
  choice: 统治
  rationale: מָלַךְ 在此指所罗门行使王权；“统治”自然、简明，并可与“全以色列”顺畅搭配。
- source_word: שְׁלֹמֹה
  choice: 所罗门
  rationale: 采用现代中文圣经传统中通行且易于辨识的人名译法。
- source_word: בִ/ירוּשָׁלִַם
  choice: 在耶路撒冷
  rationale: 介词 ב 在此表示地点，直译为“在”；“耶路撒冷”为通行地名译法。
- source_word: עַל כָּל יִשְׂרָאֵל
  choice: 全以色列
  rationale: עַל 表示王权所及的对象；汉语“统治全以色列”已自然表达“治理……之上”的关系，并保留以色列作为整体国家或民族共同体的指称。
- source_word: אַרְבָּעִים שָׁנָה
  choice: 四十年
  rationale: 按原文直译在位时长。
