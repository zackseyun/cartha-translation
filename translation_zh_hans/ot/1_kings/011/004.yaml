source:
  edition: WLC
  text: וַ/יְהִ֗י לְ/עֵת֙ זִקְנַ֣ת שְׁלֹמֹ֔ה נָשָׁי/ו֙ הִטּ֣וּ אֶת לְבָב֔/וֹ אַחֲרֵ֖י אֱלֹהִ֣ים אֲחֵרִ֑ים וְ/לֹא הָיָ֨ה לְבָב֤/וֹ שָׁלֵם֙ עִם יְהוָ֣ה אֱלֹהָ֔י/ו כִּ/לְבַ֖ב דָּוִ֥יד אָבִֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/004.yaml
  text: And when Solomon was old[a], his wives turned his heart after other gods, and his heart was not fully devoted to Yahweh his God, like the heart of David his father.
translation:
  language: zh_hans
  text: 所罗门年老的时候，他的妻子们使他的心转去跟随别的神；他的心并没有完全忠于耶和华他的神[a]，不像他父亲大卫的心那样。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“他的心并不完整地与耶和华他的神同在”，意思是他的心没有专一地忠于耶和华。
    reason: 说明שָׁלֵם的字面意象及其在本句中的关系性含义。
lexical_decisions:
- source_word: לְעֵת זִקְנַת שְׁלֹמֹה
  choice: 所罗门年老的时候
  rationale: 以自然的现代汉语表达“在所罗门年老之时”，完整保留时间意义。
- source_word: נָשָׁיו
  choice: 他的妻子们
  rationale: 直接保留复数和所属关系，不作泛化或弱化。
- source_word: הִטּוּ אֶת־לְבָבוֹ
  choice: 使他的心转去
  rationale: 保留使役语态和“心转向”的希伯来语意象；不采用解释性更强的“使他误入歧途”。
- source_word: אַחֲרֵי אֱלֹהִים אֲחֵרִים
  choice: 跟随别的神
  rationale: אַחֲרֵי在此含跟随之意；此译自然地保留背弃盟约、追随别神的含义。
- source_word: לְבָבוֹ
  choice: 他的心
  rationale: 保留圣经中“心”涵盖意志、思想和忠诚的丰富意象。
- source_word: שָׁלֵם עִם יְהוָה אֱלֹהָיו
  choice: 完全忠于耶和华他的神
  rationale: 在自然汉语中表达“心完整地与耶和华一致”所指的专一忠诚，同时借脚注说明原文的“完整”意象。
- source_word: כִּלְבַב דָּוִיד אָבִיו
  choice: 不像他父亲大卫的心那样
  rationale: 原文明确比较两人的“心”，因此不简化为仅仅比较两个人。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经传统中通行的神名译法，明确其为专名而非普通称号。
theological_decisions:
- issue: 如何表达所罗门的心 שָׁלֵם 与神的关系
  choice: 他的心并没有完全忠于耶和华他的神
  alternative: 他的心并没有完整地与耶和华他的神同在
  rationale: 正文采用自然、清楚的汉语表达盟约忠诚，同时保留“他的心”这一意象；脚注交代“完整”的字面含义，避免把经文限定为单纯情感上的虔诚。
- issue: “别的神”的指称
  choice: 别的神
  alternative: 外邦的神
  rationale: אֱלֹהִים אֲחֵרִים直译为“别的神”；不改成民族类别意义更强的“外邦的神”，以免缩窄原文对偶像崇拜的表述。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。保留两次“他的心”，以呈现原文的重复和比较结构；用分号清楚连接原因与评价。
