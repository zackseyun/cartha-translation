base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/034.yaml
  text: But I will not take the whole kingdom out of his hand, because I will make him ruler all the days of his life, for the sake of David my servant, whom I chose, who kept my commandments and my statutes.
translation:
  language: zh_hans
  text: 但我不会从他手中夺走整个王国，因为我要使他一生作首领；这是为了我的仆人大卫的缘故。我拣选了他，他遵守了我的诫命和律例。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נָשִׂיא
  choice: 统治者
  rationale: 此词可指首领、领袖或掌权者；结合所罗门继续掌管王国的语境，译作“统治者”既自然，也不把词义过度限定为特定头衔。
- source_word: מִצְוֹתַי וְחֻקֹּתָי
  choice: 我的诫命和律例
  rationale: 保留两个并列的律法术语及其传统语义区别，同时符合现代中文圣经语体。
- source_word: לְמַעַן דָּוִד עַבְדִּי
  choice: 这是为了我的仆人大卫
  rationale: לְמַעַן 表示因大卫的缘故或为了大卫；正文采用自然简洁的表达，不额外解释其盟约背景。
theological_decisions:
- issue: 大卫“遵守”诫命和律例的陈述与其生平过犯之间的张力
  choice: 按原文直译为“他也遵守了我的诫命和律例”
  alternative: 补充“总体上忠心遵守”或“除某事以外”
  rationale: 本节原文未加限定；不把其他经文的说明或系统性解释带入正文，以保留叙述本身的神学张力。
- issue: 神不夺去整个王国的理由
  choice: 保留“为了我的仆人大卫”的直接因果陈述
  alternative: 解释为“因我与大卫所立的约”
  rationale: 盟约背景虽与上下文相关，但本节只明说“为了大卫”，故不在正文中扩写。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以分号和分句调整希伯来语长句结构，使中文自然清晰；保留第一人称神谕的直接语气。
