  text: וְ/אֹתְ/ךָ֣ אֶקַּ֔ח וּ/מָ֣לַכְתָּ֔ בְּ/כֹ֥ל אֲשֶׁר תְּאַוֶּ֖ה נַפְשֶׁ֑/ךָ וְ/הָיִ֥יתָ מֶּ֖לֶךְ עַל יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/037.yaml
  text: And I will take you[a], and you shall reign over all that your soul desires, and you shall be king over Israel.
translation:
  language: zh_hans
  text: 我必取你；你将统治你心所愿的一切[a]，并作以色列的王。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“你灵魂所渴望的一切”；此处“灵魂”是表示个人内在欲求的习语。
    reason: 说明נֶפֶשׁ的字面形象及其习语用法。
lexical_decisions:
- source_word: אֶקַּח
  choice: 我必选取你
  rationale: לקח的基本义是“取、拿”，但在本段上帝任命君王的语境中，直译“取你”在现代汉语中语意不明；“选取你”既保留“取”的具体色彩，也表达上帝将他取来任用，而不把含义完全缩减为“选择”。
- source_word: וּמָלַכְתָּ
  choice: 你要管辖
  rationale: מלך表示行使王权、统治，而不只是登基或获得君王身份；“管辖”自然表达实际掌权的动作。
- source_word: בְּכֹל אֲשֶׁר
  choice: 管辖……一切
  rationale: 介词ב与“作王、掌权”连用时可标明统治的范围；译成“管辖……一切”保留其范围意义，未改写为单纯的“按着”。
- source_word: תְּאַוֶּה נַפְשֶׁךָ
  choice: 你心里所愿的
  rationale: נפש在这里构成表示个人内在愿望的希伯来语习语。现代汉语以“心里所愿”自然传达此义；脚注同时说明原文的字面表达，避免掩盖其措辞。
- source_word: וְהָיִיתָ מֶּלֶךְ
  choice: 作……的王
  rationale: היה加名词表示所得的身份或地位；“作……的王”简洁、庄重，也与前面的实际管辖相区别。
- source_word: עַל יִשְׂרָאֵל
  choice: 以色列的王
  rationale: עַל在君王语境中表示对以色列的权柄。汉语通常说“作以色列的王”，比“在以色列之上作王”自然。
theological_decisions:
- issue: נֶפֶשׁ的人论性表达
  choice: 正文译作“你心里所愿的”，脚注保留“你的生命所渴望的”这一较字面的表达。
  alternative: 你的灵魂所愿的；你所愿的
  rationale: 本句并非对“灵魂”作技术性的神学陈述；若译“灵魂”，现代读者容易读入身心二分的含义。“心里所愿”符合汉语习惯，脚注则保留原文以נפש表达整个人内在欲求的形象。
- issue: 统治范围与愿望方式之间的句法张力
  choice: 译为“管辖你心里所愿的一切”，把ב理解为统治范围。
  alternative: 随心所愿地掌权；照你一切所愿的掌权
  rationale: בְּכֹל אֲשֶׁר接在מלך之后，较自然地指向掌权所及的范围；但希伯来语也容许读者感受到按其愿望掌权的意味，因此脚注列出较顺畅的替代译法，不把张力完全消除。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“选取”比口语“挑选”庄重，也比生硬的“取你”清楚；“管辖”与“作王”分别呈现行使王权和君王身份。脚注标记置于其实际所解释的愿望与统治范围短语之后。
