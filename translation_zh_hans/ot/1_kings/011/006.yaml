  text: וַ/יַּ֧עַשׂ שְׁלֹמֹ֛ה הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה וְ/לֹ֥א מִלֵּ֛א אַחֲרֵ֥י יְהוָ֖ה כְּ/דָוִ֥ד אָבִֽי/ו׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/006.yaml
  text: So Solomon did what was evil in the eyes of Yahweh[a], and he did not fully follow Yahweh, as David his father had done.
translation:
  language: zh_hans
  text: 所罗门行了耶和华眼中看为恶的事，并没有像他父亲大卫那样全心跟随耶和华。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “全心跟随”也可译作“完全跟随”或“全然忠于”。这个希伯来语惯用语表达的是忠诚或顺服并不完全。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ שְׁלֹמֹה הָרַע
  choice: 所罗门做了……看为恶的事
  rationale: עשה与实词化的形容词 הרע构成“行恶／做恶事”的表达；结合后面的“在……眼中”，译为“做了……看为恶的事”，既保留希伯来语的评价结构，也符合现代汉语习惯。
- source_word: בְּעֵינֵי יְהוָה
  choice: 耶和华眼中看为
  rationale: 直译是“在耶和华眼中”。汉语“耶和华眼中看为恶”保留“眼中”的比喻，并自然表达这是按耶和华的判断为恶。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的专名“耶和华”翻译四字神名，区别于称号“主”。
- source_word: וְלֹא מִלֵּא אַחֲרֵי יְהוָה
  choice: 没有……全心跟随耶和华
  rationale: מלא אחרי是表示完全、忠诚跟随的惯用语。“全心跟随”自然传达完整忠诚与顺服，同时脚注保留较贴近形式的“完全跟随”等译法。
- source_word: כְּדָוִד אָבִיו
  choice: 像他父亲大卫那样
  rationale: 介词כ表示比较；“那样”承接前面的“全心跟随”，不额外补入原文没有明说的动词。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 中文正文采用长期通行、可辨识为以色列上帝专名的“耶和华”；不以“主”替代专名。
- issue: מִלֵּא אַחֲרֵי 所表达的所罗门之失败程度
  choice: 没有全心跟随耶和华
  alternative: 没有完全跟随耶和华
  rationale: 该惯用语强调他的跟随并不完全、忠诚不足；正文不把本句单独强化为彻底离弃，以保留经文本身的程度与张力。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。“眼中看为恶”保留希伯来语评价性比喻；“全心跟随”清楚易懂，又不把原文过度解释为仅指内在情感。段末的抄写标记 ס 不译入正文。
