  text: וַ/יִּתְאַנַּ֥ף יְהוָ֖ה בִּ/שְׁלֹמֹ֑ה כִּֽי נָטָ֣ה לְבָב֗/וֹ מֵ/עִ֤ם יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל הַ/נִּרְאָ֥ה אֵלָ֖י/ו פַּעֲמָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/009.yaml
  text: And Yahweh became angry with Solomon, because his heart had turned away from Yahweh, the God of Israel, who had appeared to him twice.
translation:
  language: zh_hans
  text: 耶和华向所罗门发怒，因为他的心偏离了耶和华——以色列的上帝，就是那位曾两次向他显现的。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּתְאַנַּף
  choice: 发怒
  rationale: 该形式表达怒气的发作或显露；“发怒”在现代汉语中自然、庄重，也没有强化为“震怒”。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代简体中文读者最熟悉的专名形式音译四字神名，保留其作为以色列之神圣约名字的性质，不以称号替代。
- source_word: בִּשְׁלֹמֹה
  choice: 向所罗门
  rationale: 介词 ב 与发怒动词连用，标明怒气所针对的对象；汉语“向……发怒”自然准确。
- source_word: כִּי
  choice: 因为
  rationale: 清楚引出耶和华向所罗门发怒的原因。
- source_word: נָטָה לְבָבוֹ
  choice: 他的心偏离了
  rationale: 保留“心”的原文意象，并以“偏离”表达内在倾向和忠诚关系的转移。
- source_word: מֵעִם
  choice: 偏离了
  rationale: מֵעִם 表达从与某者同在或相属的关系中离开；其分离义自然融入汉语动词“偏离”。
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: 以色列的上帝
  rationale: 直接呈现原文的属格关系以及耶和华与以色列的身份关联。
- source_word: הַנִּרְאָה אֵלָיו
  choice: 曾……向他显现
  rationale: 带冠词的分词作定语，回指耶和华；“曾”自然标示显现发生在此前。
- source_word: פַּעֲמָיִם
  choice: 两次
  rationale: 准确、自然地翻译双数形式。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用神的专名。中文正文保留专名，并采用现代中文圣经传统中最广为人知的“耶和华”，而不以“主”这一称号替代。
- issue: 上帝发怒的拟人情感语言
  choice: 发怒
  alternative: 恼怒／震怒
  rationale: 原文直接把怒气归于耶和华；译文不将其弱化为一般不悦，也不强化为更剧烈的“震怒”。
- issue: 关系从句的指代
  choice: 以重复“耶和华”明确显现者
  alternative: 译作“他曾两次向所罗门显现”
  rationale: 希伯来文的定语分词回指“耶和华——以色列的上帝”。中文若紧接“所罗门／他”容易产生代词歧义，因此重复专名，但不改变原文所指。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“向……发怒”“心偏离”保留原文的关系性和心灵意象；破折号与分号用来澄清“以色列的上帝”及后续显现者均指耶和华。
