base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/041.yaml
  text: The rest of the acts of Solomon[a], and all that he did, and his wisdom—are they not written in the Book of the Acts of Solomon?
translation:
  language: zh_hans
  text: 所罗门其余的事迹、他所做的一切，以及他的智慧，不都记在《所罗门事迹录》[a]上吗？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译《所罗门纪事录》。希伯来文书名直译含有“所罗门的话／事情”，在这里是指记载所罗门事迹的文献。
    reason: 说明书名中דִּבְרֵי的词义范围，并保留“纪事录”这一合理译法。
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי שְׁלֹמֹה
  choice: 所罗门其余的事迹
  rationale: יֶתֶר表示其余、剩余部分；דִּבְרֵי在君王生平总结的史书用语中指其事迹或政绩记录。译作“其余的事迹”既符合上下文，也避免拘泥为“话语”。句首וְ在此承担衔接作用，中文无需机械译出。
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: 他所做的一切
  rationale: 直译关系从句，并保留עָשָׂה宽泛的“做”义，不额外限定为成就或功业。
- source_word: וְחָכְמָתוֹ
  choice: 以及他的智慧
  rationale: 保留独立名词“智慧”及第三人称所属关系；“以及”自然连接并列的最后一项。
- source_word: הֲלוֹא הֵם כְּתֻבִים
  choice: 不都记……吗
  rationale: הֲלוֹא引出预期肯定回答的反问。中文“不都……吗”保留反问语气；“记”在文献语境中自然表达“写下、记载”。
- source_word: עַל סֵפֶר
  choice: 记在……上
  rationale: 保留介词עַל的基本表达，同时符合中文谈论书面记载时“记在书上”的习惯。
- source_word: סֵפֶר דִּבְרֵי שְׁלֹמֹה
  choice: 《所罗门事迹录》
  rationale: 将סֵפֶר作为文献名称处理；דִּבְרֵי在此指有关所罗门事务或事迹的记录。“事迹录”较贴近希伯来语，也避免与正典《历代志》混淆。
