source:
  edition: WLC
  text: וְ/הַ/שֵּׁ֥בֶט הָ/אֶחָ֖ד יִֽהְיֶה לּ֑/וֹ לְמַ֣עַן עַבְדִּ֣/י דָוִ֗ד וּ/לְמַ֨עַן֙ יְר֣וּשָׁלִַ֔ם הָ/עִיר֙ אֲשֶׁ֣ר בָּחַ֣רְתִּי בָ֔/הּ מִ/כֹּ֖ל שִׁבְטֵ֥י יִשְׂרָאֵֽל־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/032.yaml
  text: But one tribe will remain his[a], for the sake of my servant David and for the sake of Jerusalem, the city that I have chosen from all the tribes of Israel.
translation:
  language: zh_hans
  text: 但他仍会有一个支派[a]，这是为了我的仆人大卫，也为了耶路撒冷，就是我从以色列所有支派中拣选的城。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文作“一个支派”。这通常被理解为便雅悯归附于犹大，尤其考虑到耶路撒冷的地理位置；但原文本身写的是“一个支派”。
    reason: 保留原文数字表达，并说明常见的协调性理解，而不将其写入正文。
lexical_decisions:
- source_word: וְהַשֵּׁבֶט הָאֶחָד
  choice: 但……一个支派
  rationale: שֵׁבֶט在此指以色列的支派，而非杖或权杖。וְ结合上文表示转折，译为“但”；הָאֶחָד按原文保留“一个”，不在正文中协调相关经文的计数差异。
- source_word: יִהְיֶה לּוֹ
  choice: 他仍会有
  rationale: 字面为“将归他／将是他的”。在国度被夺去的语境中，“仍会有”自然表达保留所有权，同时不过度扩展原文。
- source_word: לְמַעַן
  choice: 这是为了
  rationale: 该词在此表示行动所顾念的对象或缘由；“为了”简洁保留“for the sake of”的语义，并适合上帝因大卫和耶路撒冷而保留一个支派的语境。
- source_word: עַבְדִּי דָוִד
  choice: 我的仆人大卫
  rationale: 保留君王及圣约语境中的尊称；“仆人”是现代汉语中庄重而自然的对应词。
- source_word: יְרוּשָׁלִַם הָעִיר
  choice: 耶路撒冷，就是……的城
  rationale: 以同位结构说明耶路撒冷是上帝所拣选的城，使汉语关系清楚自然。
- source_word: אֲשֶׁר בָּחַרְתִּי בָהּ
  choice: 我……拣选的城
  rationale: בחר译为圣经语境中自然且庄重的“拣选”。希伯来语介词及阴性代词在汉语关系从句中无需逐字呈现。
- source_word: מִכֹּל שִׁבְטֵי יִשְׂרָאֵל
  choice: 从以色列所有支派中
  rationale: מִן与בחר连用，表示从一个整体中作出选择；“从……中”准确保留这一关系。
theological_decisions:
- issue: “一个支派”与另一些经文中犹大、便雅悯同属罗波安的记载之间存在数字张力
  choice: 正文按希伯来文译作“一个支派”
  alternative: 将便雅悯视为归入犹大或耶路撒冷的支派，或在正文中改译为“一个国”或“两个支派”
  rationale: 马所拉文本明确写“一个支派”。译文应保留原文的措辞与张力，不在正文中作协调性解释；常见理解放入脚注。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“仍会有”自然表达国度被夺后尚有一个支派归他的语境；以“就是”引出同位说明，避免过度书面化。脚注标记[a]已置于正文相应位置。
