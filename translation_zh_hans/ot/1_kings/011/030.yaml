  text: וַ/יִּתְפֹּ֣שׂ אֲחִיָּ֔ה בַּ/שַּׂלְמָ֥ה הַ/חֲדָשָׁ֖ה אֲשֶׁ֣ר עָלָ֑י/ו וַ/יִּ֨קְרָעֶ֔/הָ שְׁנֵ֥ים עָשָׂ֖ר קְרָעִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/030.yaml
  text: Then Ahijah took hold of the new cloak that was on him and tore it into twelve pieces[a].
translation:
  language: zh_hans
  text: 亚希雅抓住他身上的那件新外衣，把它撕成十二片。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他所穿的。”希伯来文直译为“在他身上的”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְפֹּשׂ
  choice: 抓住
  rationale: 表示实际用手拿住；“抓住”自然、具体，又不像“夺过”那样额外强调暴力。
- source_word: שַׂלְמָה
  choice: 外衣
  rationale: 指穿在外面的衣物；“外衣”是现代汉语中清楚而庄重的表达，也符合随后将其撕开的动作。
- source_word: הַחֲדָשָׁה
  choice: 新
  rationale: 直接保留原文“新的”这一叙事上具有象征意义的细节。
- source_word: אֲשֶׁר עָלָיו
  choice: 他身上的
  rationale: 贴近原文“在他身上”，同时符合现代汉语习惯；代词“他”保留希伯来文在所指对象上的可能含混。
- source_word: וַיִּקְרָעֶהָ
  choice: 把它撕成
  rationale: 准确表达“撕裂它”，并与后面的结果“十二片”自然衔接。
- source_word: שְׁנֵים עָשָׂר קְרָעִים
  choice: 十二片
  rationale: 原文指十二个撕下来的片块；“十二片”简洁自然，保留数量及象征动作的力度。
theological_decisions:
- issue: אֲשֶׁר עָלָיו 中“他”的所指
  choice: 保留为“他”，不明确指认是谁
  alternative: 译作“亚希雅自己身上的”或“耶罗波安身上的”
  rationale: 希伯来文仅使用第三人称代词，本节本身没有明说所指；不在正文中消除这一真实含混。
translation_notes:
  register: 采用现代、简明而庄重的叙事语言。“外衣”比“斗篷”更宽泛，避免把古代服饰具体化过度；句式保留原文两个连续动作的推进感。
