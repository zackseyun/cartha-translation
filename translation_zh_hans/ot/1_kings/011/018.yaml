base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/018.yaml
  text: They arose from Midian and came to Paran[a], and they took men with them from Paran, and they came to Egypt, to Pharaoh king of Egypt, and he gave him a house and assigned him food, and gave him land.
translation:
  language: zh_hans
  text: 他们从米甸起程，来到巴兰；又从巴兰带了些人同行，来到埃及，到了埃及王法老那里。法老给他一所房子，规定供应他的食物[a]，又赐给他土地。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语字面为“饼（食物），他对他说”；意思可能是法老吩咐或指定人供应他的食物。
    reason: 原文措辞不寻常；正文按语境表达其可能含义，脚注保留字面形式及一定的不确定性。
lexical_decisions:
- source_word: וַיָּקֻמוּ מִמִּדְיָן
  choice: 他们从米甸起程
  rationale: קום在行程叙事中可表示起身出发；译为“起程”自然传达离开米甸上路的意思，同时保留复数主语。
- source_word: פָּארָן
  choice: 巴兰
  rationale: 采用现代中文圣经地名的通行音译。
- source_word: וַיִּקְחוּ אֲנָשִׁים עִמָּם מִפָּארָן
  choice: 又从巴兰带了些人同行
  rationale: אֲנָשִׁים本义为“男人、一些人”；此处重点是他们从巴兰增添同行者。“些人”符合汉语表达，也不额外断定其身份或人数。
- source_word: אֶל פַּרְעֹה מֶלֶךְ מִצְרַיִם
  choice: 去见埃及王法老
  rationale: 明确表达前往法老那里，并自然保留“埃及王”这一同位说明。
- source_word: וַיִּתֶּן לוֹ בַיִת
  choice: 法老给他一所房子
  rationale: 按前句明确补出主语“法老”；בַיִת按直接意义译为“一所房子”，不扩展为家室或府邸。
- source_word: וְלֶחֶם אָמַר לוֹ
  choice: 吩咐供应他食物
  rationale: 希伯来语字面结构异常，近于“又对他提到／吩咐饼”；结合王室供给语境，译作“吩咐供应他食物”传达命令配给口粮的含义，并以脚注保留字面难点。
- source_word: וְאֶרֶץ נָתַן לוֹ
  choice: 又赐给他土地
  rationale: אֶרֶץ在此指法老授予的土地，而非整个国家；“赐给”符合君王给予产业的语境。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。叙事连接简洁明快；专名使用简体中文通行译法。正文不补入原文未明说的同行者身份，也不把“土地”扩大解释为封地或国土。
