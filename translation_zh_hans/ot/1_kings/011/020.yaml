base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/020.yaml
  text: And the sister of Tahpenes bore him Genubath his son[a], and Tahpenes weaned him within Pharaoh’s house[b]; and Genubath was in Pharaoh’s house among the sons of Pharaoh.
translation:
  language: zh_hans
  text: 答比匿的姐妹给他生了一个儿子，名叫基努拔[a]。答比匿在法老宫中给基努拔断了奶[b]；基努拔在法老宫中，和法老的众子在一起。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文也可按语序译作：“答比匿的姐妹给他生了基努拔，就是他的儿子。”两种译法意思相同。
    reason: lexical_alternative
  - marker: b
    text: “断了奶”指孩子到了不再吃奶的阶段；此后他仍留在法老的宫廷中。
    reason: cultural_note
lexical_decisions:
- source_word: וַתֵּלֶד לוֹ
  choice: 给他生了
  rationale: 希伯来语动词“生”与间接受词“给他”连用，表示答比匿的妹妹为哈达生下孩子；中文如此表达自然，也保留了原文的关系。
- source_word: אֲחוֹת תַּחְפְּנֵיס
  choice: 答比匿的妹妹
  rationale: 原文只说“答比匿的姐妹”，未明说年长或年幼；但承接上一节，她是被赐给哈达为妻的王后之妹。现代汉语叙事中用“妹妹”自然清楚。
- source_word: גְּנֻבַת
  choice: 基努拔
  rationale: 按传统且易辨认的中文圣经人名音译处理。
- source_word: בְּנוֹ
  choice: 一个儿子，名叫基努拔
  rationale: 原文直译为“基努拔，他的儿子”，其中代词指哈达。中文重组语序，使父子关系与名字都清楚，同时不改变意义。
- source_word: וַתִּגְמְלֵהוּ
  choice: 给基努拔断了奶
  rationale: גמל在这一语境中指使幼儿停止吃奶。明确写出名字，避免连续代词在中文中造成指代含混。
- source_word: בְּתוֹךְ בֵּית פַּרְעֹה
  choice: 在法老宫中
  rationale: “法老的家”在此兼有王宫和王室家眷的含义；译作“法老宫中”符合中文习惯，也保留其宫廷环境。
- source_word: וַיְהִי
  choice: 住在
  rationale: 这里描述基努拔在法老宫廷中的居处和生活状态；“住在”比单纯的“在”更符合现代中文叙事。
- source_word: בְּתוֹךְ בְּנֵי פַרְעֹה
  choice: 与法老的众子在一起
  rationale: 保留בְּנֵי的阳性复数“众子”，并以自然中文表达他被安置在法老儿子们中间的意思。
