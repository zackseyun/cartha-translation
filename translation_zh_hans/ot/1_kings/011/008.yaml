  to: 所罗门也同样为他所有的外族妻子这样做；她们向自己的诸神烧香献祭。[a]
  rationale: 修订仅消除汉语中“也照样”为同义叠加及“做了”宾语悬空所造成的轻微不自然，同时将“神明”明确为“诸神”，以对应原文复数。保留“这样做”的指代性表达，不将省略的内容补成“建造丘坛”等具体行动；分号后的“她们”仍明确指外族妻子。
