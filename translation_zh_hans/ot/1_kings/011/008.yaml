  text: וְ/כֵ֣ן עָשָׂ֔ה לְ/כָל נָשָׁ֖י/ו הַ/נָּכְרִיּ֑וֹת מַקְטִיר֥וֹת וּֽ/מְזַבְּח֖וֹת לֵ/אלֹהֵי/הֶֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/008.yaml
  text: And so he did for all his foreign wives[a], who were burning incense and sacrificing to their gods.
translation:
  language: zh_hans
  text: 所罗门也同样为他所有的外族妻子这样做；她们向自己的诸神烧香献祭。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作：“所罗门也同样为他所有的外族妻子做了。”希伯来文没有明说他所做的具体事情，而是承接上一节。
    reason: 说明连接语的译法，并保留原文中动作宾语省略的特点。
lexical_decisions:
- source_word: וְכֵן
  choice: 也照样
  rationale: 承接上一节，表示所罗门为其他外族妻子采取了同样的行动；现代汉语自然，并保留上下文的连接作用。
- source_word: עָשָׂה
  choice: 做了
  rationale: 原动词含义宽泛，本节省略了具体所做之事，要由上一节补足；译作“做了”可避免擅自增添“建造丘坛”等内容。
- source_word: לְכָל נָשָׁיו הַנָּכְרִיּוֹת
  choice: 为他所有的外族妻子
  rationale: לְ 在此表示受益或对象关系，נָשָׁיו 在语境中明确指妻子；“外族”说明她们来自以色列之外，又比可能带贬义的“异邦”更中性。
- source_word: מַקְטִירוֹת
  choice: 烧香
  rationale: 该词在祭祀语境中通常指焚香或使祭物冒烟；“烧香”简洁、自然，且与本句的敬拜活动相符。
- source_word: וּמְזַבְּחוֹת
  choice: 献祭
  rationale: 该分词表示进行祭牲或献祭活动；“献祭”准确而简洁。
- source_word: לֵאלֹהֵיהֶן
  choice: 向自己的神明
  rationale: 阴性复数后缀指这些妻子各自所敬拜的神祇。“神明”清楚表明这里不是指以色列的上帝，也能自然涵盖复数所指。
theological_decisions:
- issue: 分词 מַקְטִירוֹת וּמְזַבְּחוֹת 的主语
  choice: 理解为外族妻子在烧香献祭
  alternative: 较宽泛地理解为所罗门为她们所设宗教场所中的祭祀活动
  rationale: 两个阴性复数分词与“外族妻子”在语法上直接呼应，因此译文让妻子作这两个动作的主语，不把行为转移给所罗门。
- issue: 所罗门“做了”什么的省略
  choice: 保留“做了”的省略表达，由上一节交代具体内容
  alternative: 明确译成“为所有外族妻子建造丘坛”或“也做了同样的事”
  rationale: 希伯来文本依赖上文而没有明说宾语。正文保留这一张力，脚注提示读者从上一节理解。
- issue: 分词所表达的持续性
  choice: 用“烧香献祭”陈述她们持续从事的祭祀活动
  alternative: 译为一次性的“烧了香，献了祭”
  rationale: 汉语不必用进行体才能表达分词；在此采用无界限的动词短语，既自然，也不把活动压缩为一次完成事件。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“也照样……做了”保留原文承上省略的结构；分号使“她们”明确回指外族妻子，避免误读为所罗门烧香献祭。
