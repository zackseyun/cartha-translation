  text: וַ/יְהִ֗י בִּֽ/הְי֤וֹת דָּוִד֙ אֶת אֱד֔וֹם בַּ/עֲל֗וֹת יוֹאָב֙ שַׂ֣ר הַ/צָּבָ֔א לְ/קַבֵּ֖ר אֶת הַ/חֲלָלִ֑ים וַ/יַּ֥ךְ כָּל זָכָ֖ר בֶּ/אֱדֽוֹם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/015.yaml
  text: And it happened[a], when David was in Edom, when Joab the commander of the army had gone up to bury the slain[b], that he struck down every male in Edom—
translation:
  language: zh_hans
  text: 事情是这样的：[a]大卫在以东[b]的时候，军队的统帅约押上去埋葬死者，并杀了以东所有的男性——
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文采用希伯来叙事中常见的表达，可直译为“事情发生了”，在这里用来引出背景说明。
    reason: lexical_alternative
  - marker: b
    text: 原文直译近似“大卫与以东同在”；结合这里的军事语境，是指大卫身处以东，或正在那里作战。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: 事情是这样的
  rationale: 这是常见的希伯来叙事公式，此处引出背景说明。译文采用自然的现代汉语表达，同时保留其承接和说明作用。
- source_word: בִּהְיוֹת דָּוִד אֶת אֱדוֹם
  choice: 大卫在以东的时候
  rationale: ב加不定式构成时间从句。אֶת אֱדוֹם在此不宜机械译为“大卫与以东同在”；军事语境表明这是指大卫身处以东或在那里作战。
- source_word: בַּעֲלוֹת יוֹאָב
  choice: 约押上去
  rationale: 保留עלה“上去”的空间性表达，并让前面的时间结构统摄该动作。
- source_word: שַׂר הַצָּבָא
  choice: 元帅
  rationale: 这是军队最高指挥官的正式称号；“元帅”简洁、庄重，符合现代汉语圣经叙事语体。
- source_word: לְקַבֵּר
  choice: 埋葬
  rationale: ל加不定式表示目的，即约押上去是为了埋葬死者。
- source_word: הַחֲלָלִים
  choice: 阵亡的人
  rationale: 该词特指被杀者，常用于战争中的死者；“阵亡的人”保留军事语境，又比文言式“被杀之人”自然。
- source_word: וַיַּךְ
  choice: 杀了
  rationale: נכה在此军事语境中指致命击杀；直译“击打”会弱化实际含义，“杀了”准确而不加修饰。
- source_word: כָּל זָכָר
  choice: 所有的男性
  rationale: זָכָר明确指男性，而非泛指“人”；“所有的男性”保留原文概括范围和严峻语气。
- source_word: בֶּאֱדוֹם
  choice: 以东
  rationale: 介词ב在这里表示地点。中文在“杀了以东所有的男性”中无需重复“在”，即可自然表达所属和地域范围，同时不扩展为“遍及以东”。
theological_decisions:
- issue: 如何翻译严酷的战争暴力陈述
  choice: 直译为“杀了以东所有的男性”
  alternative: 弱化为“击败了以东人”，或在正文中解释为彻底灭绝
  rationale: 原文直接陈述杀戮行为及其对象。译文既不以委婉语淡化暴力，也不把经文本身没有明说的解释加入正文。
- issue: “杀了”的主语是否明确写成约押
  choice: 以省略主语的并列结构承接“约押”，自然理解为约押所为
  alternative: 明确译为“约押杀了”，或使用可能产生歧义的“他杀了”
  rationale: 希伯来文动词是第三人称单数，语法上最近的显明主语是约押；下文也支持这一理解。中文用连续谓语既忠实又自然，同时不作不必要的重复强调。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“事情是这样的”自然引出背景；破折号保留原句尚未完结、继续进入下一节说明的结构。
