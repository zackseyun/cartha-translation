base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/012.yaml
  text: Nevertheless[a], in your days I will not do it, for the sake of David your father[b]; from the hand of your son I will tear it away.
translation:
  language: zh_hans
  text: 然而，在你有生之日，我不这样做[a]，因顾念你父亲大卫的缘故；我必从你儿子手中[b]把它撕去。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “这样做”指上一节所宣告的事，也就是把王国撕去。
    reason: cross_reference
  - marker: b
    text: 希伯来文直译为“从你儿子的手中”；此习语可指从他的权力或占有之下取走。
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: 然而
  rationale: 此处对上一节宣告的审判作限制性的转折；“然而”自然地表达这种转折关系。
- source_word: בְּיָמֶיךָ
  choice: 在你有生之日
  rationale: 希伯来语直译为“在你的日子里”，语境所指是所罗门在世期间；此译在现代汉语中更清楚自然。
- source_word: לֹא אֶעֱשֶׂנָּה
  choice: 我不会这样做
  rationale: 阴性宾语后缀回指上一节所宣告的行动，即撕走王国；译文保留上下文回指，不在正文中过度明说。
- source_word: לְמַעַן דָּוִד אָבִיךָ
  choice: 这是为了你父亲大卫的缘故
  rationale: לְמַעַן 表示顾念某人而采取行动；“为了……的缘故”保留这种动机和眷顾意味，而不简化为普通因果。
- source_word: מִיַּד בִּנְךָ
  choice: 从你儿子手中
  rationale: 保留希伯来语“从……手中”的形象说法，表示从其权力或占有之下取走。
- source_word: אֶקְרָעֶנָּה
  choice: 把它撕走
  rationale: קָרַע 的基本意象是“撕裂、撕开”；“撕走”既保留王国被撕裂的强烈比喻，也表达从儿子手中夺去之意。
theological_decisions:
- issue: 对所罗门的审判被推迟到何时
  choice: 审判不在所罗门有生之日施行，而将临到其儿子掌权之时。
  alternative: 可更明确译作“我不会在你有生之日撕走王国；我要从你儿子手中把王国撕走”。
  rationale: 原文将宾语留给上下文确定，所指为上一节的王国。译文保留这种照应，也保留因顾念大卫而推迟审判的张力，不额外加入神学解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“在你有生之日”自然表达希伯来语时间习语；“撕走”保留原文关于王国分裂的强烈意象。所有脚注标记均置于正文对应位置。
