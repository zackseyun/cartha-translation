base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/036.yaml
  text: But to his son I will give one tribe[a], so that David my servant may always have a lamp before me in Jerusalem, the city that I have chosen for myself to put my name there.
translation:
  language: zh_hans
  text: 但我要把一个支派赐给他的儿子，使我的仆人大卫在我面前始终有一盏灯[a]，在耶路撒冷，就是我为自己拣选、要把我的名立在那里的城。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “灯”在这里比喻大卫王朝或王室统治的延续；也可译作“光”。
    reason: 说明 נִיר 的词义选择及其王朝性比喻。
lexical_decisions:
- source_word: וְלִבְנוֹ
  choice: 但……给他的儿子
  rationale: 结合上文王国被分割的语境，וְ 带有转折意味；“但”自然体现这一联系。
- source_word: שֵׁבֶט אֶחָד
  choice: 一个支派
  rationale: 本节处于王国分裂的语境，שֵׁבֶט 指支派这一族群和政治单位，而非权杖。
- source_word: לְמַעַן הֱיוֹת
  choice: 使……有
  rationale: 保留该结构表达的目的意义，同时符合现代汉语表达。
- source_word: נִיר
  choice: 一盏灯
  rationale: 保留希伯来文具体的灯之比喻，指向大卫王朝血脉或王权的延续，而不在正文中把比喻解释掉。
- source_word: לְדָוִיד עַבְדִּי
  choice: 我的仆人大卫
  rationale: 自然、庄重地保留所属关系及“大卫是上帝仆人”的称谓。
- source_word: כָּל הַיָּמִים
  choice: 常
  rationale: 此习语表示持续不断；“常”简洁自然，也保留延续之意。
- source_word: לְפָנַי
  choice: 在我面前
  rationale: 直接保留希伯来语空间性和关系性的表达，避免将其缩减为抽象的“蒙我眷顾”。
- source_word: בָּחַרְתִּי לִי
  choice: 我为自己拣选
  rationale: “为自己”保留 לִי 的反身受益意味；“拣选”符合庄重的经文语域。
- source_word: לָשׂוּם שְׁמִי שָׁם
  choice: 要将我的名立在那里
  rationale: 保留申命记史书中重要的“名”公式，不改写为“居住”或“彰显同在”；“立”在中文里能自然表达使名安置于某处。
theological_decisions:
- issue: נִיר 的王朝比喻
  choice: 正文译作“一盏灯”，脚注说明其指大卫王朝血脉或王权的延续
  alternative: 译作“光”，或直接意译为“后裔／王位”
  rationale: 具体保留原文比喻及其神学张力，同时借脚注帮助普通读者理解，而不让解释取代正文。
- issue: “将我的名立在那里”的圣所神学
  choice: 保留“名”的原文表达
  alternative: 意译为“使我临在其中”或“使人在那里敬拜我”
  rationale: 原文强调上帝所拣选之城与其“名”的关系；直译此公式可避免把它等同于某一种关于上帝居所或临在的解释。
- issue: “一个支派”与所罗门之子的王国
  choice: 保留“一个支派”
  alternative: 按后续历史概括为“南方诸支派”或“犹大王国”
  rationale: 忠实保留本节的表述，不用后续政治格局来改写原文。
translation_notes:
  register: 采用现代、庄重而清楚的标准普通话。“赐给”“拣选”等词维持经文语体，但句法避免过度文言化；保留“在我面前”“将我的名立在那里”等关键希伯来表达。
