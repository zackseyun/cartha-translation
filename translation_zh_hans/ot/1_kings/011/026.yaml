revisions:
- from: 尼八的儿子耶罗波安是来自洗利达的以法莲人[a]；他母亲名叫洗鲁阿，是个寡妇。耶罗波安是所罗门的臣仆，却向王举手[b]。
  to: 尼八的儿子耶罗波安是来自洗利达的以法莲人[a]；他母亲名叫洗鲁阿，是个寡妇；他是所罗门的臣仆，并且举手攻击王[b]。
  rationale: 修订仅处理末句成语在现代汉语中的可理解性及连接关系。“举手攻击王”保留“举手”的原文意象，且避免将其误解为非敌对的手势；脚注继续保留“反叛王”这一较明确的释义性译法。其余内容无需改动。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T05:50:49Z'
review_pass:
  verdict: revise
  source_fidelity: 译文准确交代了耶罗波安的父名、其与洗利达及以法莲的关联、母亲洗鲁阿为寡妇、他是所罗门的臣仆，以及他对王采取敌对行动。惟“向王举手”在现代汉语中通常只是一个中性动作，未能自然表达希伯来语成语“举手攻击／敌对”的含义；改为“举手攻击王”既保留原文意象，也明确其敌对语义。
  naturalness: 整体庄重、清晰，符合现代标准汉语。将末句的“却向王举手”改为“并且举手攻击王”，避免“却”所暗示而原文未明确标示的转折，并使表达自然明确。
  terminology: “耶罗波安、尼八、洗利达、洗鲁阿、以法莲人、所罗门”均可保留。“臣仆”适合 עֶבֶד 在此王室从属语境中所含的宽泛身份。“以法他人”作为 אֶפְרָתִי 的另一词汇可能，可在脚注保留，不应置入正文。
  issues:
  - severity: medium
    issue: “向王举手”未充分传达该希伯来语成语的敌对含义。
    rationale: וַיָּרֶם יָד בַּמֶּלֶךְ 字面为“向王举手”，但在此语境是对王采取敌对行动、攻击或反叛的成语。汉语“向王举手”容易被理解为普通举手动作；“举手攻击王”保留形象并更忠实。
  - severity: low
    issue: “却”添加了原文未明示的强转折。
    rationale: 原文以 waw 连接“是所罗门的臣仆”和“举手攻击王”。二者在叙事上确有张力，但连接词本身未必要求汉语用“却”；采用“并且”更少解释性，同时保留事件推进。
  revised_text: 尼八的儿子耶罗波安是来自洗利达的以法莲人[a]；他母亲名叫洗鲁阿，是个寡妇；他是所罗门的臣仆，并且举手攻击王[b]。
