base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/026.yaml
  text: Jeroboam son of Nebat[a], an Ephraimite from Zeredah—his mother's name was Zeruah, a widow—was a servant of Solomon[c][b], and he raised his hand against the king.
translation:
  language: zh_hans
  text: 尼八的儿子耶罗波安是来自洗利达的以法莲人[a]；他母亲名叫洗鲁阿，是个寡妇；他是所罗门的臣仆，并且举手攻击王[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “以法莲人”也可译作“以法他人”；这里更可能指属于以法莲支派的人。
    reason: lexical_alternative
  - marker: b
    text: “举手攻击王”保留希伯来文的表达，也可译作“反叛王”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶפְרָתִי
  choice: 以法莲人
  rationale: 本节语境最自然地指所属支派，即以法莲；另保留“以法他人”这一可能译法于脚注，以反映词形上的歧义。
- source_word: הַצְּרֵדָה
  choice: 洗利达
  rationale: 按现代中文圣经常用音译处理地名。
- source_word: צְרוּעָה
  choice: 洗鲁阿
  rationale: 按现代中文圣经常用音译处理人名。
- source_word: אִשָּׁה אַלְמָנָה
  choice: 是个寡妇
  rationale: 希伯来文直陈她是“一个女人，一个寡妇”；现代汉语用“是个寡妇”自然、完整地表达其身份，无须生硬重复“女人”。
- source_word: עֶבֶד
  choice: 臣仆
  rationale: 此处涉及所罗门王室行政体系中的从属身份；“臣仆”既保留服事和隶属关系，又不武断限定为奴隶。
- source_word: וַיָּרֶם יָד בַּמֶּלֶךְ
  choice: 却向王举手
  rationale: 保留希伯来文“举手”的具体意象和其敌对含义，不在正文中直接消解为“背叛”；脚注说明其可表达反叛。
- source_word: וְ
  choice: 不单独译出
  rationale: 句首连接词承接上下文；现代汉语无需机械译作“于是”或“现在”，句子本身即可自然展开新的叙事人物。
theological_decisions:
- issue: 耶罗波安行为的性质
  choice: 正文保留“向王举手”的希伯来语意象
  alternative: “反叛王”或“起来反抗王”
  rationale: 该短语确有敌对、反叛之意，但直译能保留叙事表达的形象性与一定张力；明确释义置于脚注，避免正文过度解释。
translation_notes:
  register: 采用现代、庄重而易懂的叙事文体。人名和地名使用简体中文圣经传统中通行的译名；以分号和句号拆分较长的希伯来语句式，使亲属身份、母亲背景及政治行动层次清楚，同时保留原文的推进关系。
