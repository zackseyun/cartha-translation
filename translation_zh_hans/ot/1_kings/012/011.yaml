  yaml_path: translation/ot/1_kings/012/011.yaml
  text: And now[a], my father made your yoke heavy, but I will add to your yoke. My father disciplined you with whips, but I will discipline you with scorpions.
translation:
  language: zh_hans
  text: 现在，我父亲加在你们身上的轭很重；我要加重你们的轭。我父亲用鞭子管教你们；我要用蝎子[a]管教你们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或作“蝎子鞭”，即一种会造成更大痛苦的鞭子或刑鞭；希伯来文直译是“蝎子”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶעְמִיס ... עֹל כָּבֵד
  choice: 使……的轭沉重
  rationale: העמיס的使役形表示把重担加在人身上；与“轭”和“沉重”连用时，直译其负重意象，同时在现代汉语中仍然清楚自然。
- source_word: עֹל / עֻלְּכֶם
  choice: 轭
  rationale: 保留原文以轭比喻苛刻统治或劳役的具体形象，并保留两次出现所形成的修辞重复。
- source_word: אוֹסִיף עַל עֻלְּכֶם
  choice: 加重你们的轭
  rationale: 字面结构是“加在你们的轭上”；汉语说“加重……的轭”更自然，也准确表达增加其负担或严厉程度。
- source_word: יִסַּר / אֲיַסֵּר
  choice: 管教
  rationale: יסר可指管教、惩戒或责打；上下文明确涉及体罚工具，“管教”保留其词义范围，不把它限缩为司法处罚。
- source_word: בַּשּׁוֹטִים
  choice: 用鞭子
  rationale: שוט指鞭子或刑鞭；“用鞭子”直接、自然。
- source_word: בָּעַקְרַבִּים
  choice: 用蝎子
  rationale: 原词字面意为“蝎子”。正文保留鲜明而可能具有比喻性的希伯来语形象，其可能指特殊刑鞭的解释置于脚注。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留“轭”的核心隐喻及两组“我父亲……我却……”的对称结构；把连接词 וְעַתָּה 译为“现在”，不额外加入未明说的逻辑关系。脚注标记紧随“蝎子”，对应真正需要说明的词语。
