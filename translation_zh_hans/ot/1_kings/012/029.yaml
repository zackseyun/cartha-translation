base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/029.yaml
  text: He set one in Bethel[a], and the other he put in Dan.
translation:
  language: zh_hans
  text: 他把一个安置在伯特利[a]，把另一个放在但。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里的“一个”指上一节提到的两个牛犊中的一个；也可译作：“他把一个牛犊安置在伯特利，把另一个放在但。”
    reason: 说明原文省略名词的指代，并提供补明所指的译法。
lexical_decisions:
- source_word: וַיָּשֶׂם
  choice: 他把……安置
  rationale: שׂים表示“放置、安置”。这里是叙事中的具体设置行动；“安置”自然、庄重，也适合被设于特定地点的对象。
- source_word: אֶת הָאֶחָד
  choice: 一个
  rationale: 带定冠词的“一个”与后句形成成对分配关系，所指承接上一节的两个牛犊；中文用“一个”自然，并保留原文未重复名词的省略。
- source_word: בְּבֵית אֵל
  choice: 在伯特利
  rationale: 介词בְּ在此表示地点；בֵית אֵל是地名，采用通行译名“伯特利”。
- source_word: וְאֶת הָאֶחָד
  choice: 把另一个
  rationale: 原文直译近于“而那一个”，在两个对象的对应结构中，现代汉语自然表达为“另一个”。补出“把”以形成顺畅的处置式并列句，不增加实质信息。
- source_word: נָתַן
  choice: 放
  rationale: נתן常意为“给”，但在地点短语前可表示“放置”。此处译作“放”最符合具体语境，也保留它与前一动词在用词上的区别。
- source_word: בְּדָן
  choice: 在但
  rationale: 介词בְּ表示地点；דָן是地名，采用通行译名“但”。
theological_decisions:
- issue: “一个”和“另一个”的所指
  choice: 正文保留原文的名词省略，仅译作“一个……另一个”，由上下文承接上一节所说的两个牛犊。
  alternative: 在正文明确补出“一个牛犊……另一个”。
  rationale: 上下文虽清楚说明对象是两个牛犊，但本节希伯来文没有重复“牛犊”一词。保留省略既忠于原文，也避免把解释直接写入正文；脚注可说明其所指。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“安置”与“放”分别对应两个不同但语义相近的希伯来动词；保留“一个……另一个”的省略结构及其上下文张力。
