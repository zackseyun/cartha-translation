source:
  edition: WLC
  text: וַ/יַּ֖עַשׂ אֶת בֵּ֣ית בָּמ֑וֹת וַ/יַּ֤עַשׂ כֹּֽהֲנִים֙ מִ/קְצ֣וֹת הָ/עָ֔ם אֲשֶׁ֥ר לֹֽא הָי֖וּ מִ/בְּנֵ֥י לֵוִֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/031.yaml
  text: He made houses of high places[a], and he appointed priests from among all the people[b], who were not from the sons of Levi.
translation:
  language: zh_hans
  text: 他建造了丘坛的殿宇[a]，又从民众中[b]立人为祭司；这些人不是利未的子孙。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“丘坛之殿”，指与丘坛祭祀有关的殿宇或圣所。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“从民众的各端中”；此处指从民众中广泛选取。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ אֶת־בֵּית בָּמוֹת
  choice: 建造了丘坛的庙宇
  rationale: עָשָׂה本义宽泛，可指“做、造、设立”；与建筑性名词בֵּית连用时译作“建造”自然。בֵּית בָּמוֹת字面为“丘坛之殿”，在祭祀语境中指与丘坛相连的庙宇或圣所。
- source_word: וַיַּעַשׂ כֹּהֲנִים
  choice: 立人作祭司
  rationale: 同一动词עָשָׂה在此不是制造祭司，而是使人成为或任其担任祭司；“立人作祭司”既符合现代汉语，也不过度规定具体任命礼仪。
- source_word: מִקְצוֹת הָעָם
  choice: 从民众各阶层中
  rationale: קָצוֹת字面涉及“边端、各端”，此处表示祭司取自民众的广泛范围，而非特定合法祭司群体；“各阶层”保留其范围意味。
- source_word: אֲשֶׁר לֹא־הָיוּ מִבְּנֵי לֵוִי
  choice: 这些人并不是利未子孙
  rationale: 直译其宗族表述，明确这些祭司不出自利未支派，同时不添加对其制度合法性的解释。
theological_decisions:
- issue: 如何表达耶罗波安所设立的祭祀场所
  choice: 丘坛的庙宇
  alternative: 丘坛；建在高处的圣所
  rationale: “丘坛”是希伯来文בָּמוֹת在以色列祭祀语境中的惯用对应词；加上“庙宇”体现בֵּית，避免把原文简化为只有祭坛，也不在正文中额外加入“非法”等评价。
- issue: 如何表达祭司并非出自利未谱系
  choice: 并不是利未子孙
  alternative: 不是利未人
  rationale: 正文保留原文“利未之子孙”的家族、支派措辞，不把其神学和礼仪意义扩写出来。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“丘坛”保留古代以色列祭祀背景中的专门用语；用“庙宇”帮助普通读者理解其为祭祀建筑。“立人作祭司”比机械重复“造”更符合汉语，同时忠实传达上下文中的任立含义。
