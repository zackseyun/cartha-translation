  text: וַ/יְהִ֞י כִּ/שְׁמֹ֤עַ כָּל יִשְׂרָאֵל֙ כִּֽי שָׁ֣ב יָרָבְעָ֔ם וַֽ/יִּשְׁלְח֗וּ וַ/יִּקְרְא֤וּ אֹת/וֹ֙ אֶל הָ֣/עֵדָ֔ה וַ/יַּמְלִ֥יכוּ אֹת֖/וֹ עַל כָּל יִשְׂרָאֵ֑ל לֹ֤א הָיָה֙ אַחֲרֵ֣י בֵית דָּוִ֔ד זוּלָתִ֥י שֵֽׁבֶט יְהוּדָ֖ה לְ/בַדּֽ/וֹ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/020.yaml
  text: And when all Israel heard that Jeroboam had returned[a], they sent and called him to the assembly and made him king over all Israel. None followed the house of David except the tribe of Judah alone.
translation:
  language: zh_hans
  text: 以色列众人听说耶罗波安已经回来，就派人去召他到会众中来，立他作全以色列的王。除了犹大支派以外，没有人归附大卫家。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“除了犹大支派以外，没有人留在大卫家这一边。”希伯来文直译为“在大卫家之后”，在这里表示效忠或归属。
    reason: 说明希伯来习语，并保留“跟随／留在一边／归附”之间的译法空间。
lexical_decisions:
- source_word: וַיְהִי כִּשְׁמֹעַ
  choice: ……听说……就……
  rationale: 这一结构引出叙事中的时间关系；现代汉语用“听说……就……”自然表达，无须生硬译出“事情发生了”。
- source_word: כָּל יִשְׂרָאֵל
  choice: 以色列众人
  rationale: 保留以色列作为整体群体的含义，同时比“全以色列”用作主语更符合现代汉语。
- source_word: כִּי שָׁב יָרָבְעָם
  choice: 耶罗波安已经回来
  rationale: שׁוּב表示返回；“已经”表明此事先于随后召集和立王的行动。
- source_word: וַיִּשְׁלְחוּ
  choice: 就派人
  rationale: 原文只说“派遣”，宾语省略；汉语“派人”自然补出动作所隐含的人员，但不具体增添“使者”等身份。
- source_word: וַיִּקְרְאוּ אֹתוֹ אֶל הָעֵדָה
  choice: 召他到会众那里
  rationale: קרא אֶל在此表示召来，עֵדָה指聚集的共同体；“会众”保留其群体性质，而不把它窄化为某种具体政治机构。
- source_word: וַיַּמְלִיכוּ אֹתוֹ עַל כָּל יִשְׂרָאֵל
  choice: 立他作全以色列的王
  rationale: 使役形表达使其为王；“立他作王”贴近原文，也不加入加冕仪式等未明说的细节。
- source_word: לֹא הָיָה אַחֲרֵי בֵית דָּוִד
  choice: 没有人归附大卫家
  rationale: “在……之后”在此是政治效忠或结盟的习语；“归附”清楚表达阵营归属，也避免误解为单纯跟随行走。
- source_word: זוּלָתִי שֵׁבֶט יְהוּדָה לְבַדּוֹ
  choice: 除了犹大支派以外
  rationale: זוּלָתִי与לְבַדּוֹ共同强调唯一例外；汉语“除了……以外”已自然表达排他性，避免重复累赘。
theological_decisions:
- issue: 王国分裂后对大卫家的政治归属
  choice: 没有人归附大卫家
  alternative: 没有人跟随大卫家；没有人留在大卫家这一边
  rationale: 此句首先陈述政治效忠关系。“归附”传达希伯来习语的阵营意义，同时不把历史陈述扩展为额外的神学判断。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“立他作王”“大卫家”等沿用普通读者熟悉的圣经历史叙事表达；脚注标记置于其所解释的末句之后。
