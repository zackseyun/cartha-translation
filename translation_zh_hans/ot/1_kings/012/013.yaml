  text: And the king answered the people harshly, and he abandoned the counsel of the elders who had advised him.
translation:
  language: zh_hans
  text: 王严厉地回答百姓，弃绝了长老们给他的劝告。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַן
  choice: 回答
  rationale: ענה 的 Qal 形式在此表示对先前请求作出回答；“回答”自然保留叙事衔接。
- source_word: הַמֶּלֶךְ
  choice: 王
  rationale: 定指上下文中已知的君王；汉语叙事中用“王”简洁而庄重。
- source_word: הָעָם
  choice: 百姓
  rationale: עָם 在此指向王提出请求的以色列民众；“百姓”是清楚自然的对应表达。
- source_word: קָשָׁה
  choice: 严厉地
  rationale: 该词在这里修饰王回答的方式，表达强硬、苛刻的语气；“严厉地”符合现代汉语。
- source_word: וַיַּעֲזֹב
  choice: 丢弃了
  rationale: עזב 表示离弃、撇下或弃置；“丢弃了”体现王断然不采纳这项劝告。
- source_word: עֲצַת
  choice: 劝告
  rationale: עֵצָה 指所提出的建议或计策；在长老向王进言的语境中，“劝告”自然易懂。
- source_word: הַזְּקֵנִים
  choice: 长老们
  rationale: 此处不仅指年长者，也指具有资历、担任顾问角色的人；“长老们”保留其社会政治身份。
- source_word: אֲשֶׁר יְעָצֻהוּ
  choice: 给他的
  rationale: 关系从句直指长老们先前向王所提的劝告；与“劝告”合并译为“长老们给他的劝告”，既保留信息，又避免汉语重复。
