base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/006.yaml
  text: Then King Rehoboam consulted the elders who had stood before Solomon his father while he was still alive[a], saying[b], “How do you advise me to answer this people?”
translation:
  language: zh_hans
  text: 罗波安王便与那些在他父亲所罗门在世时侍立在所罗门面前[a]的长老商议，说：“你们建议我怎样答复[b]这百姓？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “侍立在……面前”也可译作“在……面前供职”。
    reason: 说明希伯来语宫廷用语既保留站立的意象，也含有侍奉、供职之意。
  - marker: b
    text: 希伯来文直译为“怎样答复这百姓一句话”，意思是给他们答复。
    reason: 交代原文在“答复”之后含有“话”一词；中文正文按现代汉语自然表达处理。
lexical_decisions:
- source_word: וַיִּוָּעַץ
  choice: 与……商议
  rationale: 该动词的尼法勒形式在此表示向别人征求意见；“与……商议”既自然，也保留共同议事的意味。
- source_word: הַמֶּלֶךְ רְחַבְעָם
  choice: 罗波安王
  rationale: 按现代汉语习惯，将王的称号置于人名之后。
- source_word: הַזְּקֵנִים
  choice: 长老
  rationale: 在王廷语境中，此词指资深的臣僚或顾问，而不只是年老的男子；“长老”保留原文的正式称谓。
- source_word: אֲשֶׁר הָיוּ עֹמְדִים אֶת־פְּנֵי שְׁלֹמֹה
  choice: 侍立在所罗门面前
  rationale: “站在某人面前”是宫廷用语，可表示在君王面前供职、侍奉；译作“侍立在……面前”兼顾原文意象与实际含义。
- source_word: אָבִיו
  choice: 他父亲
  rationale: 明确所罗门是罗波安的父亲，与原文所有格一致。
- source_word: בִּהְיֹתוֹ חַי
  choice: 所罗门在世时
  rationale: 用明确的名词消除汉语中代词可能造成的指代不清，同时准确表达这些长老是在所罗门生前供职。
- source_word: אֵיךְ אַתֶּם נוֹעָצִים
  choice: 你们建议我怎样
  rationale: 原文询问众长老所提出的方略；汉语补出语境中隐含的“我”，使问句自然，但不增加实质内容。
- source_word: לְהָשִׁיב
  choice: 回复
  rationale: 该使役形式在此指作出答复；“回复”简明自然。
- source_word: הָעָם הַזֶּה
  choice: 这百姓
  rationale: 保留原文单数集合名词及指示语的表达；“百姓”符合历史叙事的庄重语体。
- source_word: דָּבָר
  choice: 回复（见脚注）
  rationale: 此词字面为“话、言语”，在“回复……一句话”的结构中指所作的答复；正文采用自然汉语，脚注保留字面形式。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“罗波安王”“长老”“百姓”符合历史宫廷语境；“侍立在……面前”有一定古雅色彩，但现代读者仍易理解，且能保留希伯来原文的宫廷意象。
