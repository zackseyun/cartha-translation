  text: So Israel has rebelled against the house of David to this day[a].
translation:
  language: zh_hans
  text: 这样，以色列背叛大卫家，直到今日[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“这样，以色列背叛了大卫家，直到今日。”
    reason: 原文叙事动词可较形式地译为“背叛了”；“直到今日”表明这次反叛所形成的局面延续至叙述者的时代。
lexical_decisions:
- source_word: וַיִּפְשְׁעוּ
  choice: 于是……就背叛了
  rationale: פשע在此政治语境中指反叛统治者或王朝，而非泛指犯罪。“背叛”直接保留这一政治含义；“于是……就……了”体现叙事的推进和事件性。
- source_word: יִשְׂרָאֵל
  choice: 以色列
  rationale: 保留专名。这里按上下文指与大卫王朝分裂的北方支派这一群体，不改释为“以色列人”，以保留原文简洁的群体称谓。
- source_word: בְּבֵית דָּוִד
  choice: 大卫家
  rationale: 介词בְּ与פשע连用时标明反叛的对象；“大卫家”保留בֵּית דָּוִד所指的王室、王朝含义，比“大卫的家庭”准确，也不将其过度解释为政治国家。
- source_word: עַד הַיּוֹם הַזֶּה
  choice: 直到今日
  rationale: 这是希伯来文常用语，表示该事件造成的局面延续至叙述者所处的时代。“直到今日”自然、庄重，并保留原文的时间视角。
theological_decisions:
- issue: 以色列与大卫家的关系
  choice: 译作“背叛了大卫家”
  alternative: “脱离了大卫家”
  rationale: 原文פשע带有反叛权柄的评价色彩，不只是中性的政治分离；但译文不进一步判断这场反叛在神学或道德上的全部意义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事用语。“今日”比“今天”更符合经文史叙语体；句中保留“于是”和“就”，使其自然承接上文。脚注标记已置于正文相应位置。
