base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/005.yaml
  text: He said to them[a], “Go away for three more days, then return to me.” So the people went away.
translation:
  language: zh_hans
  text: 他对他们说：“你们去吧，三天后再到我这里来。”于是百姓就走了。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵיהֶם
  choice: 他对他们说
  rationale: 按希伯来语叙事体自然表达；不机械译出句首连接词 וַ，同时保留说话对象。
- source_word: לְכוּ
  choice: 你们先离开
  rationale: 复数命令式在语境中表示暂时遣散众人；“离开”比单说“去”更清楚，“先”自然带出命令的先后次序。
- source_word: עוֹד שְׁלֹשָׁה יָמִים
  choice: 再过三天
  rationale: עוֹד 与时间短语连用，表示还要经过一段时间；“再过三天”是现代汉语中自然且准确的说法。
- source_word: וְשׁוּבוּ אֵלָי
  choice: 回来见我
  rationale: שוב 表示返回，אֵלַי 表示朝向说话者；汉语“回来见我”自然表达返回他那里这一含义。
- source_word: וַיֵּלְכוּ הָעָם
  choice: 于是百姓离开了
  rationale: 以“于是”表达叙事推进和众人对命令的遵从；הָעָם 是集合名词，译作“百姓”。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。原文在“离开”与“三天”之间的结构可直译为“再去三天”，但现代汉语容易误解为空间行程；正文用“先离开，再过三天”清楚保留暂时离开、三天后返回的意思。
