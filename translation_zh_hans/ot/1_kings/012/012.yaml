base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/012.yaml
  text: So Jeroboam and all the people came to Rehoboam on the third day[a], just as the king had spoken, saying, “Return to me on the third day.”
translation:
  language: zh_hans
  text: 第三天，耶罗波安和全体百姓来到罗波安那里，正如王先前所说：“第三天再到我这里来。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: 来到
  rationale: בוא可按叙述视角译为“来”或“去”；与אֶל רְחַבְעָם连用，译作“来到罗波安那里”自然地表达朝向罗波安而去。
- source_word: יָרָבְעָם
  choice: 耶罗波安
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: וְכָל הָעָם
  choice: 和全体百姓
  rationale: עָם在此指一同向王陈情的民众；“全体百姓”既保留כָּל的整体含义，又符合庄重的现代汉语。
- source_word: אֶל רְחַבְעָם
  choice: 到罗波安那里
  rationale: אֶל表示朝向某人；中文加“那里”可自然表达来到某人面前或所在之处，而不额外引入“朝见”等含义。
- source_word: בַּיּוֹם הַשְּׁלִישִׁי
  choice: 第三天
  rationale: 直接保留希伯来语的序数时间表达，中文简洁自然。
- source_word: כַּאֲשֶׁר
  choice: 正如
  rationale: 表达百姓的行动与王先前吩咐之间的对应关系。
- source_word: דִּבֶּר הַמֶּלֶךְ
  choice: 王先前所说
  rationale: 希伯来语完成式指相对于当前事件已发生的话语；“先前”在中文中清楚呈现时间先后。
- source_word: לֵאמֹר
  choice: 所说：“……”
  rationale: 以中文引述结构自然承接直接引语，无须机械译出“说”。
- source_word: שׁוּבוּ אֵלַי
  choice: 再到我这里来
  rationale: שׁוּב含返回、再来的意思；在王要求众人过后再次来见他的语境中，“再到我这里来”既自然又保留返回之意。
theological_decisions: []
