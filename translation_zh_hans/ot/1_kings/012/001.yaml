base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/001.yaml
  text: Then Rehoboam went to Shechem, because all Israel had come to Shechem to make him king.
translation:
  language: zh_hans
  text: 罗波安到示剑去，因为以色列众人都到了示剑，要立他作王。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: 到……去
  rationale: 按叙事语境自然表达“前往”，同时保留希伯来语连续叙事的推进作用。
- source_word: כִּי
  choice: 因为
  rationale: 保留原文明确给出的原因关系，不改弱为单纯的“当时”或“原来”。
- source_word: כָל יִשְׂרָאֵל
  choice: 以色列众人
  rationale: 这里指以色列整体会众，而非必然强调毫无例外的每一个个体；此译法符合现代汉语叙事习惯。
- source_word: לְהַמְלִיךְ אֹתוֹ
  choice: 要立他作王
  rationale: 使役词形表示使他成为王；“立他作王”准确、自然，并体现公众确认王位的行动。
theological_decisions:
- issue: 罗波安王位确立过程中民众行动的性质
  choice: 立他作王
  alternative: 拥立他为王
  rationale: 原文只说明以色列众人前来使他作王，并未在本节界定其宪制或神学意义；采用较中性的“立他作王”，避免额外加入自发拥戴等含义。
translation_notes:
  register: 采用简洁庄重的现代标准汉语。“罗波安”“示剑”沿用通行圣经专名译法；语序贴近原文，又保持普通读者易读。
