source:
  edition: WLC
  text: וַ/יַּ֜עַל עַֽל הַ/מִּזְבֵּ֣חַ אֲשֶׁר עָשָׂ֣ה בְּ/בֵֽית אֵ֗ל בַּ/חֲמִשָּׁ֨ה עָשָׂ֥ר יוֹם֙ בַּ/חֹ֣דֶשׁ הַ/שְּׁמִינִ֔י בַּ/חֹ֖דֶשׁ אֲשֶׁר בָּדָ֣א מ/ל/בד וַ/יַּ֤עַשׂ חָג֙ לִ/בְנֵ֣י יִשְׂרָאֵ֔ל וַ/יַּ֥עַל עַל הַ/מִּזְבֵּ֖חַ לְ/הַקְטִֽיר־׀־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/033.yaml
  text: And he went up to the altar that he had made in Bethel on the fifteenth day in the eighth month[a], in the month that he had devised from his own heart, and he made a feast for the sons of Israel[b]; and he went up to the altar to burn incense.
translation:
  language: zh_hans
  text: 八月十五日，耶罗波安登上他在伯特利所筑的坛；这个月份是他凭自己的心意定下的[a]。他为以色列人[b]设立节期，又登上坛烧香。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“这个月份是他自行设定的”，或“是他自己选定的”。
    reason: 原文强调这个月份出于耶罗波安自己的构想；具体汉语措辞可有不同表达。
  - marker: b
    text: 原文直译“以色列的众子”，是对以色列民族的惯常称呼。
    reason: 说明希伯来语的字面形式及其整体民族所指。
lexical_decisions:
- source_word: וַיַּעַל
  choice: 登上
  rationale: עלה的基本义是“上去、登上”。此处与祭坛连用，译为“登上”既保留两次重复，也符合叙事场景。
- source_word: הַמִּזְבֵּחַ
  choice: 坛
  rationale: מזבח指献祭用的祭坛；在上下文明确时用庄重而自然的“坛”。
- source_word: אֲשֶׁר עָשָׂה בְּבֵית־אֵל
  choice: 他在伯特利所筑的
  rationale: 按关系从句直译；祭坛在汉语中通常说“筑坛”，比泛泛的“做”自然。
- source_word: בַּחֲמִשָּׁה עָשָׂר יוֹם בַּחֹדֶשׁ הַשְּׁמִינִי
  choice: 八月十五日
  rationale: 采用现代汉语自然的日期次序，准确表达“第八个月第十五日”，并非现代公历八月。
- source_word: בַּחֹדֶשׁ אֲשֶׁר בָּדָא מִלְּבַד
  choice: 这个月份是他凭自己的心意定下的
  rationale: בדא带有构想、创设之意；相关短语强调月份出于耶罗波安自己，而非神的规定。“凭自己的心意”保留叙述者隐含的批评，同时避免把含义缩减为仅仅“独自”。
- source_word: וַיַּעַשׂ חָג
  choice: 他……设立节期
  rationale: עשה与חג连用可表达举办或设立节庆；上下文着重耶罗波安自行规定宗教节期，因此“设立节期”自然且贴切。
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: 为以色列人
  rationale: 这是指以色列民族的惯用称呼。现代汉语用“以色列人”比字面译作“以色列的众子”自然，并由脚注说明原文形式。
- source_word: לְהַקְטִיר
  choice: 烧香
  rationale: הקטיר在礼仪语境中表示使祭物冒烟，也常专指焚香；本段祭坛活动的语境支持简洁自然的“烧香”。
theological_decisions:
- issue: 耶罗波安自行设定节期月份所含的评价意味
  choice: 凭自己的心意定下的
  alternative: 他自己选定的；他自行设定的
  rationale: 此译保留原文将该节期归因于耶罗波安内心谋划的意味，也维持其与神所规定节期之间的隐含张力，而不添加明说的定罪。
- issue: בני ישראל的民族称谓
  choice: 以色列人
  alternative: 以色列的众子；以色列民
  rationale: 该表达虽字面为“以色列的众子”，实际是全民族的常规称谓。“以色列人”在现代汉语中准确涵盖整体，不把经文限缩为男性。
- issue: הקטיר所指礼仪行为的范围
  choice: 烧香
  alternative: 焚烧祭物；使祭物冒烟
  rationale: 词语本身可泛指使供物冒烟，在某些语境中则指焚香。正文采用此处最自然的传统礼仪表达“烧香”，不据此引申具体香料或祭物种类。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。保留“登上”在本节中的重复，以反映希伯来文结构；日期按现代汉语语序表达。“八月”指一年中的第八个月，并非公历八月。所有脚注标记均已置于正文。
