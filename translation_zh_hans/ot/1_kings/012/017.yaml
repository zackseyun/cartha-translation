  text: But Rehoboam reigned over the Israelites who lived in the cities of Judah.
translation:
  language: zh_hans
  text: 但住在犹大各城的以色列人，罗波安作他们的王。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/בְנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 字面为“以色列的众子”，此处按民族共同体的惯用义译为“以色列人”，自然且保留其民族与圣约背景。
- source_word: הַ/יֹּשְׁבִים
  choice: 住在
  rationale: ישׁב 的分词在此表示持续居住；“住在”符合现代汉语表达。
- source_word: בְּ/עָרֵי יְהוּדָה
  choice: 犹大各城
  rationale: 准确表达地点范围；“各城”在现代汉语中比“犹大的城市”更简洁自然，也不额外界定政治疆界。
- source_word: וַ/יִּמְלֹךְ
  choice: 仍作……的王
  rationale: מלך 在此表示行使王权。结合上文北方支派反叛的对比语境，用“仍作……的王”自然呈现罗波安继续统治这一群体；“仍”是语境所要求的衔接，不改变动词本义。
- source_word: עֲלֵי/הֶם
  choice: 他们的
  rationale: 希伯来语直译为“治理他们／在他们之上作王”；汉语用“作他们的王”自然表达相同的统治关系。
- source_word: רְחַבְעָם
  choice: 罗波安
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: וּ
  choice: 但
  rationale: 连接词在此与前文北方以色列人的反叛形成对比，因此译为“但”比单纯的“和”更能体现语篇关系。
