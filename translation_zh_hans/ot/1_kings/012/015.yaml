source:
  edition: WLC
  text: וְ/לֹֽא שָׁמַ֥ע הַ/מֶּ֖לֶךְ אֶל הָ/עָ֑ם כִּֽי הָיְתָ֤ה סִבָּה֙ מֵ/עִ֣ם יְהוָ֔ה לְמַ֜עַן הָקִ֣ים אֶת דְּבָר֗/וֹ אֲשֶׁ֨ר דִּבֶּ֤ר יְהוָה֙ בְּ/יַד֙ אֲחִיָּ֣ה הַ/שִּׁילֹנִ֔י אֶל יָרָבְעָ֖ם בֶּן נְבָֽט־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/015.yaml
  text: So the king did not listen to the people[a], for it was a turn of events from Yahweh[b], in order to establish his word that Yahweh had spoken by the hand of Ahijah the Shilonite to Jeroboam son of Nebat.
translation:
  language: zh_hans
  text: 王没有听从百姓，因为这件事出于雅威，为要实现雅威借着示罗人亚希雅[a]对尼八的儿子耶罗波安所说的话。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语字面为“借示罗人亚希雅的手”，是表示“借着示罗人亚希雅”的习语。
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמַע אֶל
  choice: 听从
  rationale: 这里不是指听见声音，而是指理会并接受百姓的请求；“听从”自然地表达了这一语境含义。
- source_word: הָעָם
  choice: 百姓
  rationale: 指聚集前来向王陈情的以色列民众；“百姓”是现代中文圣经叙事中自然、庄重的表达。
- source_word: סִבָּה
  choice: 事态这样转变
  rationale: 该词可指原因、缘由，也可指局势或事情的转变。此处采用叙事性的表达，同时以脚注保留其他可能含义。
- source_word: מֵעִם יְהוָה
  choice: 是出于雅威
  rationale: מֵעִם 表明来源；“出于”忠实表达事情源自雅威，同时不额外说明神如何促成王的决定。
- source_word: לְמַעַן הָקִים
  choice: 为要使……得以实现
  rationale: לְמַעַן 表示目的，הֵקִים 与“话”连用时表示使所说的话确立、应验或实现；此译法在现代中文中清楚自然。
- source_word: דְּבָרוֹ
  choice: 他的话
  rationale: 保留“话”这一宽泛而重要的圣经用语，不将其缩窄为“应许”或“预言”。
- source_word: בְּיַד
  choice: 借着
  rationale: 这是表示中介或代理的希伯来语习语，字面为“借……的手”；正文采用自然中文，字面形式见脚注。
- source_word: הַשִּׁילֹנִי
  choice: 示罗人
  rationale: 指亚希雅来自示罗；“示罗人”准确、简洁，并符合中文称谓习惯。
- source_word: יָרָבְעָם בֶּן נְבָט
  choice: 尼八的儿子耶罗波安
  rationale: 按自然中文次序表达希伯来语父子称谓，并保留完整身份信息。
theological_decisions:
- issue: 神的主权与王的行动之间的关系
  choice: 明确说事态的转变“出于雅威”，并保留“为要”所表达的目的
  alternative: 将其弱化为雅威仅仅许可此事，或强化为雅威直接强迫王拒绝百姓
  rationale: 希伯来文明确把这件事的来源归于雅威，并将其与实现先前的话联系起来，却没有解释神圣主权与王自身决定之间的具体机制；译文保留这一张力。
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名；“雅威”较直接地呈现这一立约之名。
- issue: “使他的话得以实现”的所指
  choice: 保留“他的话”，随后明确这是雅威借亚希雅所说的话
  alternative: 直接改写为“实现他的预言”或“兑现他的应许”
  rationale: 原文使用宽泛的 דָּבָר（话），不宜缩窄为某一特定类别；后面的关系从句足以说明说话者和传达者。
translation_notes:
  register: 采用现代、庄重而易懂的叙事文体。“听从百姓”“事态这样转变”“得以实现”兼顾原文结构与自然中文；神名统一译作“雅威”。所有脚注标记均置于正文相应词语之后。
