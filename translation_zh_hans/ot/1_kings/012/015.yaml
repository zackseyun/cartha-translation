    text: 希伯来语字面为“借示罗人亚希雅的手”，是表示“借着示罗人亚希雅”的习语。
    reason: lexical_alternative
  - marker: b
    text: “这件事”所译的希伯来语 סִבָּה 可指“原因”“缘由”，也可指事情或局势的转变。
    reason: lexical_alternative
  revision_rationale: 调整正文以消除不自然的汉语句法和代词指代歧义，同时不将 סִבָּה 限定为单一义项。脚注标记移至“借着示罗人亚希雅”之后，并新增词汇脚注以保留原有对 סִבָּה 的说明；正文与脚注的锚点均已对应。
