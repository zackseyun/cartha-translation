base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/024.yaml
  text: 'Thus says Yahweh: ‘Do not go up or fight against your brothers[a], the sons of Israel. Return, each man to his house[c][b], for this thing is from me.’ So they listened to the word of Yahweh and turned back to go according to the word of Yahweh.'
translation:
  language: zh_hans
  text: 耶和华如此说：“你们不可上去，也不可同你们的弟兄[a]——以色列人交战。各人都回自己的家去，因为这事出于我。”他们听从了耶和华的话，就照耶和华的话回去了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“与你们的弟兄、以色列的众子交战”；“弟兄”强调他们要攻打的是同族同胞。
    reason: lexical_and_cultural_note
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  choice: 耶和华如此说
  rationale: 保留先知传信公式的庄重语气，并将四字神名直接译作“耶和华”。
- source_word: לֹא תַעֲלוּ וְלֹא תִלָּחֲמוּן
  choice: 你们不可上去，也不可……交战
  rationale: “上去”保留עלה的空间及军事语境；“交战”准确表达לחם的战斗含义。
- source_word: עִם אֲחֵיכֶם בְּנֵי יִשְׂרָאֵל
  choice: 与你们的弟兄以色列人交战
  rationale: עם在לחם之后按希伯来语习惯表示交战对象；保留“弟兄”的亲属称谓，并将“以色列人”视为同位说明。
- source_word: שׁוּבוּ אִישׁ לְבֵיתוֹ
  choice: 各人都回自己的家去
  rationale: איש在此作逐一分配用法；现代汉语用“各人”自然表达，而“家”兼顾בית在此所指的住所。
- source_word: כִּי מֵאִתִּי נִהְיָה הַדָּבָר הַזֶּה
  choice: 因为这事出于我
  rationale: “出于我”自然而简洁地保留事件源自上帝的含义，不额外界定其因果方式。
- source_word: וַיִּשְׁמְעוּ אֶת דְּבַר יְהוָה
  choice: 他们听从了耶和华的话
  rationale: שׁמע在上下文中包括听见并顺从；后续行动表明这里译作“听从”最符合语境。
- source_word: וַיָּשֻׁבוּ לָלֶכֶת כִּדְבַר יְהוָה
  choice: 就照耶和华的话回去了
  rationale: 以自然汉语表达他们转身离去并遵照命令的意思，同时保留“照……的话”这一顺服关系。
theological_decisions:
- issue: 四字神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: “耶和华”是现代中文圣经及普通读者最熟悉的专名形式，直接呈现神名，而不以“主”替代。
- issue: 政治分裂“出于我”的因果力度
  choice: 因为这事出于我
  alternative: 因为这事是我使它发生的
  rationale: 原文说明此事源自上帝，却未在本句细分许可、安排或直接促成等因果模式；译文保留这一神学张力。
- issue: אֲחֵיכֶם的亲属语言
  choice: 你们的弟兄
  alternative: 你们的以色列同胞
  rationale: 保留原文明确的亲属称谓，突出这场战争将是弟兄之间的内战。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。保留先知传信公式、亲属称谓和“出于我”的开放因果表达；叙事收束处则用流畅汉语表达顺命返回。
