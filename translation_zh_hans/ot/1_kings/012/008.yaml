source:
  edition: WLC
  text: וַֽ/יַּעֲזֹ֛ב אֶת עֲצַ֥ת הַ/זְּקֵנִ֖ים אֲשֶׁ֣ר יְעָצֻ֑/הוּ וַ/יִּוָּעַ֗ץ אֶת הַ/יְלָדִים֙ אֲשֶׁ֣ר גָּדְל֣וּ אִתּ֔/וֹ אֲשֶׁ֥ר הָ/עֹמְדִ֖ים לְ/פָנָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/008.yaml
  text: But he abandoned the advice of the elders that they had given him[a], and consulted with the young men who had grown up with him, who stood before him.
translation:
  language: zh_hans
  text: 可是，罗波安撇弃了长老们给他的劝告，转而同那些与他一起长大、侍立在他面前[a]的年轻人商议。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “侍立在他面前”也可译为“服侍他”；这个希伯来语惯用语可指在宫廷中任职。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲזֹב
  choice: 撇弃了
  rationale: עָזַב在这里表示有意放弃、不采纳先前所得的意见。“撇弃”比单纯的“离开”更准确，也保留了叙事中的负面力度。
- source_word: עֲצַת
  choice: 劝告
  rationale: עֵצָה在本节指向君王提出的意见或建议；“劝告”自然明确，也与下文“商议”区分。
- source_word: הַזְּקֵנִים
  choice: 长老们
  rationale: זְקֵנִים既涉及年长身份，也可指有资历的高级顾问；“长老们”保留了年龄与社会地位两方面，不把他们仅仅处理为一般老人。
- source_word: אֲשֶׁר יְעָצֻהוּ
  choice: 给他的
  rationale: 该关系从句说明这劝告是长老们向他提出的。汉语与“劝告”搭配时译作“给他的”简洁自然，避免生硬重复“劝告”。
- source_word: וַיִּוָּעַץ
  choice: 同……商议
  rationale: יעץ的尼法勒形式在此表示与人磋商、征询意见；“同……商议”准确体现互动含义。
- source_word: הַיְלָדִים
  choice: 年轻人
  rationale: יְלָדִים本可指孩子或少年，但这里所指是与罗波安一同长大并在宫廷中的同辈；“年轻人”既与长老形成对照，也不误导为儿童。
- source_word: אֲשֶׁר גָּדְלוּ אִתּוֹ
  choice: 那些与他一起长大
  rationale: 该短语明确表达共同成长的经历；这一译法自然，并保留他们与罗波安的同辈关系。
- source_word: אֲשֶׁר הָעֹמְדִים לְפָנָיו
  choice: 侍立在他面前
  rationale: 直译保留“站在他面前”的希伯来语宫廷表达；“侍立”在现代汉语中兼顾实际姿态与随侍、任职的可能含义，脚注说明其功能性解释。
theological_decisions: []
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“可是”承接上一节并突出转折；“转而”清楚呈现罗波安放弃长老意见后改向同辈求议的叙事推进。保留宫廷惯用语的具体形象，同时用脚注交代其可能的职务含义。
