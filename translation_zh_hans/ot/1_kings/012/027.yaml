  text: אִֽם יַעֲלֶ֣ה הָ/עָ֣ם הַ/זֶּ֗ה לַ/עֲשׂ֨וֹת זְבָחִ֤ים בְּ/בֵית יְהוָה֙ בִּ/יר֣וּשָׁלִַ֔ם וְ֠/שָׁב לֵ֣ב הָ/עָ֤ם הַ/זֶּה֙ אֶל אֲדֹ֣נֵי/הֶ֔ם אֶל רְחַבְעָ֖ם מֶ֣לֶךְ יְהוּדָ֑ה וַ/הֲרָגֻ֕/נִי וְ/שָׁ֖בוּ אֶל רְחַבְעָ֥ם מֶֽלֶךְ יְהוּדָֽה־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/027.yaml
  text: If this people goes up to offer sacrifices in the house of Yahweh in Jerusalem[a], then the heart of this people will return to their lord, to Rehoboam king of Judah[c][b], and they will kill me and return to Rehoboam king of Judah.
translation:
  language: zh_hans
  text: 这百姓若[a]上耶路撒冷，在雅威的殿里献祭，这百姓的心就会归向他们的主——犹大王罗波安[b]；他们会杀我，并归回犹大王罗波安那里。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “若”也可译作“当……的时候”。这里按耶罗波安所担忧的条件来理解。
    reason: lexical_alternative
  - marker: b
    text: “主”也可译作“主人”；下文明确指出这里所指的是犹大王罗波安。
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: 若
  rationale: 引出耶罗波安所担忧的条件；“若”保留条件意味，也符合庄重的现代汉语。
- source_word: יַעֲלֶה
  choice: 上耶路撒冷
  rationale: 保留עלה“上去”的地理及朝圣意味；在汉语中补出目的地，使表达自然清楚。
- source_word: לַעֲשׂוֹת זְבָחִים
  choice: 献祭
  rationale: 希伯来语字面为“做祭牲/祭”，现代汉语习惯用“献祭”。
- source_word: בְּבֵית יְהוָה
  choice: 在雅威的殿里
  rationale: בַּיִת在此指耶路撒冷圣所，即圣殿；“殿”比字面的“家”更准确自然，同时保留所属关系。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以“雅威”音译四字神名，明确其专名性质。
- source_word: וְשָׁב לֵב הָעָם הַזֶּה
  choice: 这百姓的心就会归向
  rationale: 保留“心”作为忠诚与意向中心的原文意象；“归向”表达重新效忠的含义。
- source_word: אֶל אֲדֹנֵיהֶם
  choice: 归向他们的主
  rationale: אֲדֹנֵיהֶם在这里由后面的同位语明确指罗波安；译作单数“主”既符合指称，也保留其统治者或主人的语义张力。
- source_word: וַהֲרָגֻנִי
  choice: 他们必杀我
  rationale: 直接表达הרג“杀”的意思；“必”传达耶罗波安推断中强烈的预期。
- source_word: וְשָׁבוּ
  choice: 然后归回
  rationale: 用“归回”与前面的“归向”呼应同一词根שׁוב，同时自然表达政治上的重新归属。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；音译“雅威”保留专名性质，不以称号替代。
- issue: “他们的主”的所指与含义
  choice: 保留“他们的主”，并以破折号接“犹大王罗波安”
  alternative: 他们的主人；直接译作“犹大王罗波安”
  rationale: 原文先用אֲדֹנֵיהֶם，再以罗波安作同位说明。保留两层表达，可呈现百姓与合法统治者之间的政治关系，又不额外判定其神学合法性。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“上耶路撒冷”保留朝圣与地势用语；“心归向”保留希伯来语意象；用破折号清楚呈现“他们的主”与“犹大王罗波安”的同位关系。所有脚注标记均置于相关正文之后。
