  text: וַ/יִּ֨בֶן יָרָבְעָ֧ם אֶת שְׁכֶ֛ם בְּ/הַ֥ר אֶפְרַ֖יִם וַ/יֵּ֣שֶׁב בָּ֑/הּ וַ/יֵּצֵ֣א מִ/שָּׁ֔ם וַ/יִּ֖בֶן אֶת פְּנוּאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/025.yaml
  text: Then Jeroboam built Shechem in the hill country of Ephraim and lived there[a]; and he went out from there and built Penuel.
translation:
  language: zh_hans
  text: 耶罗波安在以法莲山区修建了示剑，并住在那里。后来他从那里出去，又修建了毗努伊勒[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节的希伯来文地名形式是“毗努伊勒”（Penuel）；相关经文中也可见“毗尼伊勒”（Peniel）这一形式。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבֶן
  choice: 修建
  rationale: בנה的基本义是“建造”。用于城邑时也可能包括重建或加固，但原文没有明确限定，因此采用不作过度解释的“修建”。
- source_word: שְׁכֶם
  choice: 示剑
  rationale: 采用该地名通行的现代中文圣经译名。
- source_word: בְּהַר אֶפְרַיִם
  choice: 在以法莲山区
  rationale: הַר在这里指山地或山区，并非仅指一座山；“以法莲山区”自然、准确地表达其地理含义。
- source_word: וַיֵּשֶׁב בָּהּ
  choice: 并住在那里
  rationale: ישב在此表示居住；阴性后缀指示剑城，中文以“在那里”自然表达。
- source_word: וַיֵּצֵא מִשָּׁם
  choice: 后来他从那里出去
  rationale: 保留יצא“出去”的移动意象；“后来”自然承接希伯来叙事中的连续动作，但不把动作具体解释为迁居或永久离开。
- source_word: פְּנוּאֵל
  choice: 毗努伊勒
  rationale: 按照本节希伯来文Penuel形式音译，并采用通行中文地名写法；相关经文中的Peniel异形在脚注说明。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“修建”保留建造、重建或整修城邑之间的可能范围；句法略作中文化分句，以清楚呈现连续动作。脚注标记置于其实际说明的地名“毗努伊勒”之后。
