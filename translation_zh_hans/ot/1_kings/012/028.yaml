base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/028.yaml
  text: So the king took counsel and made two calves of gold[a], and he said to them, “It is too much for you to go up to Jerusalem. Behold your gods, O Israel[b], who brought you up from the land of Egypt.”
translation:
  language: zh_hans
  text: 王商议后，造了两只金牛犊，并对他们说：“上耶路撒冷去，对你们实在太麻烦了。看哪，以色列啊，这些是你们的神[a]，是领你们从埃及地上来的。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “你们的神”也可理解为“你们的神（单数）”。希伯来语名词形式有时可用作单数称谓；不过本节提到两只牛犊，并使用复数动词，因此语境较支持复数理解。这句话也呼应出埃及记32:4。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּוָּעַץ
  choice: 商议之后
  rationale: 该词为יעץ的尼法勒式，表示王经过咨询或权衡；“商议之后”自然地交代其决策过程。
- source_word: שְׁנֵי עֶגְלֵי זָהָב
  choice: 两只金牛犊
  rationale: 准确表达数量与材质，并保留与出埃及记32章金牛犊事件的明显呼应。
- source_word: רַב לָכֶם מֵעֲלוֹת יְרוּשָׁלִַם
  choice: 你们上耶路撒冷去，实在太麻烦了
  rationale: רַב לָכֶם可表达“对你们来说太多、太过分”，在此指继续上耶路撒冷的负担；此译法符合王劝阻百姓的语境，同时不改译成已经去得“够久了”。
- source_word: הִנֵּה
  choice: 看哪
  rationale: 保留指示、展示及郑重宣告的语气，在现代中文圣经语体中仍清楚自然。
- source_word: אֱלֹהֶיךָ יִשְׂרָאֵל
  choice: 以色列啊……你的神明
  rationale: אֱלֹהִים形式上为复数，且本节有两只牛犊和复数动词；中文“神明”可在集合或复数意义上使用，也保留一定的数歧义，脚注说明另一种理解。
- source_word: הֶעֱלוּךָ
  choice: 领你们……上来的
  rationale: 原文动词为复数，并使用“上来”这一出埃及惯用表达；中文不以动词形态标示单复数，相关依据由脚注交代。
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: 从埃及地
  rationale: 贴近希伯来文，并保留圣经中出埃及公式化用语。
theological_decisions:
- issue: אֱלֹהֶיךָ在耶罗波安宣告中应理解为单数还是复数
  choice: 正文采用可兼具集合性和复数感的“神明”，语境偏向复数
  alternative: “你的神”
  rationale: 名词在形态上为复数，本节紧接两只牛犊，且הֶעֱלוּ为复数动词，因此语法和近接语境偏向“诸神”；但אֱלֹהִים也常指独一的神，而措辞明显呼应出埃及记32:4，故不应抹去单数理解的可能，脚注予以保留。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“太麻烦了”传达王以便利为由劝阻百姓的口吻；“看哪”保留原文宣告和展示的力度。所有脚注标记均已置于正文相应位置。
