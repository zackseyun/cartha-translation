revisions:
- from: 王商议之后，造了两只金牛犊，并对百姓说：“你们上耶路撒冷去，实在太麻烦了。以色列啊，看哪，这就是领你们从埃及地上来的神明[a]！”
  to: 王商议后，造了两只金牛犊，并对他们说：“上耶路撒冷去，对你们实在太麻烦了。看哪，以色列啊，这些是你们的神[a]，是领你们从埃及地上来的。”
  rationale: 修订仅处理数的表达、未明示对象和中文措辞。“这些是你们的神”在中文中以复数指示词对应本节复数动词和两只牛犊，同时脚注保留阿莱欣可作单数称谓的解释空间；没有把争议消除为单一教义性结论。
