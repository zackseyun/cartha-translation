source:
  edition: WLC
  text: וַ/יְהִ֛י הַ/דָּבָ֥ר הַ/זֶּ֖ה לְ/חַטָּ֑את וַ/יֵּלְכ֥וּ הָ/עָ֛ם לִ/פְנֵ֥י הָ/אֶחָ֖ד עַד דָּֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/030.yaml
  text: And this thing became a sin[a], and the people went before the one as far as Dan.
translation:
  language: zh_hans
  text: 这事就成了罪；百姓前往那一个[a]面前，直到但。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“那一个”。这里很可能指耶罗波安所立的两只牛犊中的一只，尤其是设在但的那只。
    reason: 说明希伯来文省略名词的表达及其最可能的上下文所指，同时保留正文的歧义。
lexical_decisions:
- source_word: וַיְהִי
  choice: 就成了
  rationale: היה 与 לְחַטָּאת 连用，在这里表示结果，即“成为”，而非仅表示“是”；“就”衔接前文所述安排及其后果。
- source_word: הַדָּבָר הַזֶּה
  choice: 这事
  rationale: דבר 在此回指耶罗波安设立敬拜设施一事；“这事”简洁自然，也保留指示语气。
- source_word: לְחַטָּאת
  choice: 罪
  rationale: חַטָּאת 在本叙事语境中指罪，而不是“赎罪祭”；“成了罪”保留名词表达，不额外解释为“犯罪的诱因”。
- source_word: וַיֵּלְכוּ הָעָם
  choice: 百姓……去
  rationale: הלך 在叙事中表示“去、前往”；不在正文中增添原文未明说的“敬拜”。
- source_word: לִפְנֵי
  choice: 到……面前
  rationale: לפני 的基本意思是“在……面前”；与表示移动的动词连用时，“到……面前去”符合现代汉语，同时保留原文措辞。
- source_word: הָאֶחָד
  choice: 那一个
  rationale: 希伯来文只说“那一个”，省略所指名词。正文保留这一简略和歧义，脚注说明其可能所指。
- source_word: עַד דָּן
  choice: 远至但
  rationale: עד 表示所到范围或终点；“远至但”简明地保留地理延伸之意，且不强行消解本句略显突兀的句法。
theological_decisions:
- issue: 耶罗波安所设敬拜安排与“罪”的关系
  choice: 译为“这事就成了罪”，直接保留叙事对该安排的定罪。
  alternative: 译为“这事使人犯罪”或“这事成了犯罪的诱因”。
  rationale: 原文使用名词 חַטָּאת，可以表达这事本身成为罪，也可能蕴含它导致百姓犯罪的结果；正文不以解释性改写限定其范围。
- issue: “那一个”的所指
  choice: 正文保留“那一个”，由脚注指出它很可能指两只牛犊中的一只，尤其是设在但的那只。
  alternative: 正文明确译作“那一只牛犊”或“但的那只牛犊”。
  rationale: 原文省略名词且句法简略；直接补出“牛犊”虽符合上下文，却会消除原文真实存在的含混，因此只在脚注中说明。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“成了罪”保留原文的神学判断；“到……面前去，远至但”尽量呈现原文简略、略显突兀的结构，不擅自补入“敬拜”或明确所指。
