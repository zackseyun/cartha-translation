lexical_decisions:
- source_word: אֱמֹר אֶל
  choice: 你要告诉
  rationale: 祈使式与介词合起来表示向指定对象传达信息；“你要告诉”在现代汉语中自然，并保留命令语气。
- source_word: רְחַבְעָם בֶּן שְׁלֹמֹה
  choice: 所罗门的儿子……罗波安
  rationale: 按现代汉语习惯调整修饰语次序，同时保留谱系身份。
- source_word: מֶלֶךְ יְהוּדָה
  choice: 犹大王
  rationale: 直接、凝练地表达其王室头衔。
- source_word: כָּל בֵּית יְהוּדָה
  choice: 犹大全家
  rationale: 保留“家”的希伯来政治—群体性意象；这里不是单指一个家庭，而是指犹大共同体。
- source_word: וּבִנְיָמִין
  choice: 和便雅悯
  rationale: 原文仅用支派名，并未重复“家”；译文保留这种简略表达及其群体含义。
- source_word: וְיֶתֶר הָעָם
  choice: 并其余的百姓
  rationale: יֶתֶר为“其余、剩下的”，הָעָם为“百姓”；上下文可能指集结作战的人，但本节没有明确使用“军队”一词。
- source_word: לֵאמֹר
  choice: 说
  rationale: 作为引出下一节信息内容的引语标记；保留“说”可清楚表明句子尚未结束。
