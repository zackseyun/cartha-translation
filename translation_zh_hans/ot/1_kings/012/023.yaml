  text: Speak to Rehoboam son of Solomon[a], king of Judah, and to all the house of Judah and Benjamin, and the rest of the people, saying[c][b],
translation:
  language: zh_hans
  text: “你要对所罗门的儿子、犹大王罗波安，和犹大家全体、便雅悯，以及其余的百姓[a]说：”
  philosophy: optimal-equivalence
  footnotes:
