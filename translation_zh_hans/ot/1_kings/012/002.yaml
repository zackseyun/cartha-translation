base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/002.yaml
  text: When Jeroboam son of Nebat heard of it—while he was still in Egypt[a], where he had fled from King Solomon—Jeroboam was still living in Egypt.
translation:
  language: zh_hans
  text: 尼八的儿子耶罗波安听见这事[a]时，他还在埃及；他先前为了躲避所罗门王，逃到了那里。耶罗波安仍住在埃及。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来原文只说“耶罗波安听见”；所听见的内容由上下文暗示，很可能是周围叙事刚提到的消息。
    reason: 原文省略了“听见”的宾语；脚注避免把上下文所指过度具体化。
lexical_decisions:
- source_word: וַיְהִי כִּשְׁמֹעַ
  choice: 听见这事时
  rationale: וַיְהִי承接叙事，汉语不必机械译作“事情是这样”；כִּשְׁמֹעַ引出时间从句。原文未明说“听见”的宾语，正文以“这事”自然承接上下文，并用脚注说明。
- source_word: יָרָבְעָם בֶּן נְבָט
  choice: 尼八的儿子耶罗波安
  rationale: 保留父名身份说明，并采用现代汉语圣经人名的通行形式。
- source_word: וְהוּא עוֹדֶנּוּ בְמִצְרַיִם
  choice: 他还在埃及
  rationale: 保留עֹודֶנּוּ所表达的持续状态，也清楚说明他听见消息时所在之处。
- source_word: אֲשֶׁר בָּרַח מִפְּנֵי הַמֶּלֶךְ שְׁלֹמֹה
  choice: 他先前为了躲避所罗门王，逃到了那里
  rationale: אֲשֶׁר在语义上关联埃及；מִפְּנֵי表示从王的面前或权势范围逃离，译作“为了躲避”符合语境且自然。
- source_word: וַיֵּשֶׁב יָרָבְעָם בְּמִצְרָיִם
  choice: 耶罗波安仍住在埃及
  rationale: יָשַׁב在此表示居住；“仍”结合上下文呈现持续居留之意，同时保留原文重复耶罗波安姓名和埃及地点的结构。
