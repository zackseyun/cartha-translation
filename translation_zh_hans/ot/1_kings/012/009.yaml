  yaml_path: translation/ot/1_kings/012/009.yaml
  text: And he said to them[a], “What do you advise, that we may answer this people who have spoken to me, saying[b], ‘Lighten the yoke that your father put on us’?”
translation:
  language: zh_hans
  text: 他对他们说：“你们有什么建议，好让我们答复这百姓——他们曾对我说：‘请减轻你父亲加在我们身上的轭[a]。’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “轭”在这里比喻君王强加的繁重劳役和各种义务。
    reason: cultural_note
lexical_decisions:
- source_word: מָה אַתֶּם נוֹעָצִים
  choice: 你们有什么主意
  rationale: 该分词结构询问这些谋士此刻所提出的建议；译文自然地保留直接征询意见的语气。
- source_word: וְנָשִׁיב דָּבָר
  choice: 好让我们回答
  rationale: 使役式 שוב 与 דָבָר 构成“答复、回话”的惯用表达；“好让我们回答”兼顾目的意味和现代汉语表达。
- source_word: הָעָם הַזֶּה
  choice: 这民
  rationale: 保留 עָם 的集合单数以及指示语所带的距离感；“这民”也符合庄重的圣经叙事语体。
- source_word: אֲשֶׁר דִּבְּרוּ אֵלַי לֵאמֹר
  choice: 他们曾对我说
  rationale: 将希伯来语引述公式自然压缩为现代汉语，同时保留过去已提出请求的意思。
- source_word: הָקֵל
  choice: 请减轻
  rationale: 准确表达使负担变轻的命令；加入“请”符合百姓向王陈情的汉语语用，不改变请求内容。
- source_word: מִן הָעֹל
  choice: 轭
  rationale: 保留原文具体意象及其比喻意义，不将其直接释为“重担”。
- source_word: אֲשֶׁר נָתַן אָבִיךָ עָלֵינוּ
  choice: 你父亲加在我们身上的
  rationale: “加在……身上”既自然表达 נתן על，也维持轭被放置在人身上的具体画面。
