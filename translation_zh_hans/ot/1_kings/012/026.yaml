base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/026.yaml
  text: And Jeroboam said in his heart[a], “Now the kingdom will return to the house of David.”
translation:
  language: zh_hans
  text: 耶罗波安心里说[a]：“现在，王国将归回大卫家。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“心里想。”希伯来文直译为“在他心里说”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 想
  rationale: 该动词通常意为“说”，但与“在心里”连用时表示内在言语；现代汉语用“心里想”自然准确，也保留叙事推进。
- source_word: יָרָבְעָם
  choice: 耶罗波安
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: בְּלִבּוֹ
  choice: 心里
  rationale: 直译为“在他的心里”，是表示内心思量的希伯来语习语；“心里想”既保留“心”的意象，也符合现代汉语表达。
- source_word: עַתָּה
  choice: 现在
  rationale: 保留时间副词所表达的当前情势和紧迫感。
- source_word: תָּשׁוּב
  choice: 就要归回
  rationale: שוב 表示返回、归回；此处未完成式在内心判断中指预期将发生的事，“就要”体现说话者眼中的迫近性。
- source_word: הַמַּמְלָכָה
  choice: 这国
  rationale: 此处指王国或王权所辖的国度；中文“这国”自然，并与当前分裂王国的语境相称。
- source_word: לְבֵית דָּוִד
  choice: 大卫家
  rationale: “家”保留希伯来文 בֵּית 的家族、王朝双重含义，避免直接解释为“王朝”而缩窄其经文意象。
theological_decisions:
- issue: בְּלִבּוֹ 的内在言语表达
  choice: 心里想
  alternative: 对自己说；在心里说
  rationale: “心里想”清楚表达这是耶罗波安的内心判断，同时保留“心”的源文意象，不额外赋予神学含义。
- issue: הַמַּמְלָכָה 所指的是国度还是王权
  choice: 这国
  alternative: 王国；王权
  rationale: 源词可涉及王国、王权或统治领域；上下文允许一定语义张力。“这国”在现代汉语中最自然，并未明确排除政治统治权的含义。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“归回大卫家”保留经文的王朝性表达；引号呈现原文直接引述的内心言语。
