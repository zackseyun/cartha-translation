source:
  edition: WLC
  text: וַ/יַּ֣עַשׂ יָרָבְעָ֣ם חָ֡ג בַּ/חֹ֣דֶשׁ הַ/שְּׁמִינִ֣י בַּ/חֲמִשָּֽׁה עָשָׂר֩ י֨וֹם לַ/חֹ֜דֶשׁ כֶּ/חָ֣ג אֲשֶׁ֣ר בִּ/יהוּדָ֗ה וַ/יַּ֨עַל֙ עַל הַ/מִּזְבֵּ֔חַ כֵּ֤ן עָשָׂה֙ בְּ/בֵֽית אֵ֔ל לְ/זַבֵּ֖חַ לָ/עֲגָלִ֣ים אֲשֶׁר עָשָׂ֑ה וְ/הֶעֱמִיד֙ בְּ/בֵ֣ית אֵ֔ל אֶת כֹּהֲנֵ֥י הַ/בָּמ֖וֹת אֲשֶׁ֥ר עָשָֽׂה׀־׀׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/032.yaml
  text: Jeroboam made a feast in the eighth month[a], on the fifteenth day of the month, like the feast that was in Judah, and he went up to the altar. So he did in Bethel, sacrificing to the calves that he had made[b]; and he installed in Bethel the priests of the high places that he had made.
translation:
  language: zh_hans
  text: 耶罗波安在八月十五日举行节期[a]，仿照犹大的节期；他登上祭坛[b]。他在伯特利也这样做，向自己所造的牛犊献祭；又把自己所建丘坛的祭司安置在伯特利。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “犹大的节期”很可能指住棚节；住棚节从七月十五日开始，而耶罗波安把与之相仿的节期定在一个月后的八月十五日。
    reason: cross_reference
  - marker: b
    text: 或译：“他上到祭坛那里。”原文可较直译为“他上到祭坛上”；在这里也可能指他上到祭坛处主持献祭。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ ... חָג
  choice: 举行节期
  rationale: “עשה”与“חג”连用，在此惯用义为举行或庆祝节期；“举行节期”既自然，也不超前断定这是首次设立该节期。
- source_word: בַּחֹדֶשׁ הַשְּׁמִינִי בַּחֲמִשָּׁה עָשָׂר יוֹם לַחֹדֶשׁ
  choice: 在八月十五日
  rationale: 按希伯来历日期公式简洁表达，保留第八月和该月第十五日的信息。
- source_word: כֶּחָג אֲשֶׁר בִּיהוּדָה
  choice: 仿照犹大的节期
  rationale: 明确保留比较关系，但不在正文中把该节期直接命名为住棚节。
- source_word: וַיַּעַל עַל הַמִּזְבֵּחַ
  choice: 他上到祭坛那里
  rationale: “עלה על”可按字面理解为上到或登上，也可在祭祀语境中指走近祭坛主持礼仪；正文避免使读者误以为他必定踏上祭坛表面，并以脚注保留较直译的可能。
- source_word: כֵּן עָשָׂה בְּבֵית אֵל
  choice: 他在伯特利也这样做
  rationale: “כן”表示与前述行动相应；此译符合现代汉语叙事习惯。
- source_word: לְזַבֵּחַ לָעֲגָלִים אֲשֶׁר עָשָׂה
  choice: 向自己所造的牛犊献祭
  rationale: 保留祭物所指向的对象以及这些牛犊由耶罗波安制造这一信息；不在正文额外加入“偶像”一词。
- source_word: וְהֶעֱמִיד ... אֶת כֹּהֲנֵי הַבָּמוֹת
  choice: 把……丘坛的祭司安置在……
  rationale: 使役形“העמיד”在这里表示安排人员就位或任职；“安置”兼顾其位置与职务语境，而不强行解释为正式任命。
- source_word: הַבָּמוֹת אֲשֶׁר עָשָׂה
  choice: 自己所建丘坛
  rationale: “丘坛”是“במות”在列王纪祭祀语境中的通行译法；“所建”自然表达这些祭祀场所由他兴建或设立。
theological_decisions:
- issue: “犹大的节期”具体指什么
  choice: 正文只译作“犹大的节期”
  alternative: 明确译作“住棚节”
  rationale: 日期和上下文很可能暗指犹大在七月十五日开始的住棚节，但本节希伯来文本没有直接说出节名，因此正文保留泛称，脚注说明可能的指向。
- issue: 如何评价耶罗波安的祭祀活动
  choice: 正文按叙事性措辞描述，不添加“偶像”“非法”等评价词
  alternative: 译作“牛犊偶像”或“非法丘坛的祭司”
  rationale: 全书语境对这些行为有明确负面评价，但本节以叙事方式陈述行动；译文不把语境中的判断扩写进本节用词。
- issue: 耶罗波安与祭坛的空间关系
  choice: 译作“上到祭坛那里”
  alternative: 译作“登上祭坛”
  rationale: 原文介词结构具有较直译的空间含义，但在祭祀语境中也可能指走上祭坛所在处主持礼仪；正文保留动作而避免过度具体化，脚注列出直译。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“举行节期”“安置”等表达避免生硬直译，同时保留原文对节期身份、祭坛动作及祭祀评价的必要开放性。脚注标记[a]、[b]均置于正文相应位置。
