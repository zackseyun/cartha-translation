base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/014.yaml
  text: He spoke to them according to the advice of the young men[a], saying, “My father made your yoke heavy, and I will add to your yoke. My father disciplined you with whips, but I will discipline you with scorpions.”
translation:
  language: zh_hans
  text: 他照着年轻人的主意对他们说：“我父亲使你们的轭沉重，我还要加重你们的轭。我父亲用鞭子管教你们，我却要用蝎子[a]管教你们。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可能指“蝎子鞭”，即带尖刺或倒钩的鞭子；希伯来文直译为“蝎子”。
    reason: 说明原文字面意象及可能的器具含义，同时不在主文中消除歧义。
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: 对他们说
  rationale: דבר的常用义是“说、讲话”；结合汉语叙事习惯译为“对他们说”，不额外强化为正式“回答”。
- source_word: כַּעֲצַת הַיְלָדִים
  choice: 照着年轻人的主意
  rationale: עֵצָה指主意、计策或劝告；הַיְלָדִים在本段指与老年人相对的年轻谋士，因此译作“年轻人”，而不译作“孩子”。
- source_word: הִכְבִּיד אֶת־עֻלְּכֶם
  choice: 使你们的轭沉重
  rationale: 保留כבד“使沉重”和עֹל“轭”的具体意象，同时传达统治与劳役负担加重的隐喻。
- source_word: אֹסִיף עַל־עֻלְּכֶם
  choice: 我还要加重你们的轭
  rationale: 原文直译为“我要在你们的轭上增加”；汉语用“加重……的轭”更自然，并保留递增负担之意。
- source_word: יִסַּר / אֲיַסֵּר
  choice: 管教 / 管教
  rationale: יסר可指以责罚施行管束或纠正；“管教”保留其纠正与惩戒兼具的语义，没有缩减为单纯“惩罚”。
- source_word: בַּשּׁוֹטִים
  choice: 用鞭子
  rationale: שׁוֹט指鞭子或刑鞭，“鞭子”是清楚、通行的现代汉语对应词。
- source_word: בָּעַקְרַבִּים
  choice: 用蝎子
  rationale: 原文直称“蝎子”。主文保留这一鲜明而可能含有比喻性的意象，不直接把含义限定为某一种带刺刑鞭。
theological_decisions:
- issue: “蝎子”所指惩罚工具的性质
  choice: 主文保留字面意象“蝎子”
  alternative: 译作“蝎子鞭”或“带刺的鞭子”
  rationale: עַקְרַבִּים字面为“蝎子”，在这里可能指带尖刺或倒钩的刑鞭，也可能是形象化说法。原文没有明说其构造，因此在主文保留歧义，在脚注说明可能含义。
translation_notes:
  register: 采用现代、庄重且易懂的叙事语言。“轭”保留原文统治与劳役负担的比喻；两个“管教”维持平行结构。“却”明确表现后半句惩罚方式升级的对比。脚注标记置于实际受注释的“蝎子”之后。
