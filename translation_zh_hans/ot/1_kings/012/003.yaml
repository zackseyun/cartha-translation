  yaml_path: translation/ot/1_kings/012/003.yaml
  text: So they sent and called for him[a], and Jeroboam and all the assembly of Israel came and spoke to Rehoboam, saying[b],
translation:
  language: zh_hans
  text: 他们就派人去召耶罗波安[a]。耶罗波安和以色列全会众[b]都来对罗波安说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“派人去请耶罗波安来”。原文用了“派遣”和“召唤”两个动词，表示派人召他前来。
    reason: lexical_alternative
  - marker: b
    text: “会众”也可译作“集会的群众”；这里指公开聚集的以色列群体。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלְחוּ וַיִּקְרְאוּ לוֹ
  choice: 派人去召
  rationale: 两个动词合起来表达派人把耶罗波安召来；“派人去召”既保留“派遣”的动作，也自然传达קרא + ל在本语境中的召请含义。
- source_word: וַיָּבֹאוּ
  choice: 都来
  rationale: בוא通常意为“来”；加“都”自然呼应复数主语“耶罗波安和……全体会众”，并未改变动作含义。
- source_word: יָרָבְעָם
  choice: 耶罗波安
  rationale: 采用现代中文圣经人名的通行音译。
- source_word: וְכָל־קְהַל יִשְׂרָאֵל
  choice: 和以色列全体会众
  rationale: קהל指聚集起来的群体；“会众”保留其群体性，“全体”对应כָל，在此可自然指以色列公开聚集的整体。
- source_word: וַיְדַבְּרוּ אֶל־רְחַבְעָם לֵאמֹר
  choice: 对罗波安说：
  rationale: 中文用“对……说”可自然表达דבר אל与引语公式לֵאמֹר，并以冒号引出下一节的直接引语。
- source_word: רְחַבְעָם
  choice: 罗波安
  rationale: 采用现代中文圣经人名的通行音译。
