base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/018.yaml
  text: Then King Rehoboam sent Adoram[a], who was over the forced labor, and all Israel stoned him with stones, and he died[c][b]. And King Rehoboam made haste to get up into the chariot to flee to Jerusalem.
translation:
  language: zh_hans
  text: 罗波安王派掌管劳役的亚多兰[a]去；以色列众人用石头打他，他就死了。罗波安王奋力[b]登上车，逃往耶路撒冷。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文作“亚多兰”；相关经文中也见“亚多尼兰”这一人名形式。
    reason: alternative_reading
  - marker: b
    text: 或译“赶紧”。希伯来文直译近于“使自己刚强”，在这里表示竭力采取行动。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: 派……去
  rationale: 这是叙事中常见的“差派、派遣”；补出“去”符合现代汉语表达，并未添加具体任务。
- source_word: אֲדֹרָם
  choice: 亚多兰
  rationale: 依照本节马所拉文本所载的人名形式翻译；相关经文所见的另一形式放入脚注。
- source_word: אֲשֶׁר עַל הַמַּס
  choice: 掌管劳役的
  rationale: 此处指负责国家强制服役的官员。“劳役”比“贡税”更准确，也比“徭役”更易为现代普通读者理解。
- source_word: כָל יִשְׂרָאֵל
  choice: 以色列众人
  rationale: 保留该集体政治称谓的范围，同时用自然汉语表达；语境中主要指反叛罗波安的以色列群体。
- source_word: וַיִּרְגְּמוּ ... אֶבֶן
  choice: 用石头打他
  rationale: 既明确保留原文的“石头”，也避免汉语中“用石头用石刑打”之类的累赘表达；上下文随即说明其死亡。
- source_word: וַיָּמֹת
  choice: 他就死了
  rationale: “就”自然表达连续叙事中石击所导致的结果，又不把原文简单的连接结构过度解释为目的关系。
- source_word: הִתְאַמֵּץ
  choice: 奋力
  rationale: 该词的反身形表达使自己刚强、竭力行动；“奋力”保留自我用力的色彩，也符合紧急逃亡的语境。
- source_word: לַעֲלוֹת בַּמֶּרְכָּבָה
  choice: 登上战车
  rationale: 准确表达“上到车中／登车”的方向含义，且在现代汉语中简洁自然。
- source_word: לָנוּס יְרוּשָׁלָם
  choice: 逃往耶路撒冷
  rationale: נוּס强调逃离危险，不是普通出发；“逃往”保留了这种紧迫性。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。保留“以色列”作为叙事中的集体称谓；以“劳役”清楚表达国家征发的强制服役。“奋力”兼顾原词的自我强化含义和逃亡场景的紧迫感，并用脚注保留更顺畅的语境译法。
