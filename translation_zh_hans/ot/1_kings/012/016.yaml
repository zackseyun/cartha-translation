  text: וַ/יַּ֣רְא כָּל יִשְׂרָאֵ֗ל כִּ֠י לֹֽא שָׁמַ֣ע הַ/מֶּלֶךְ֮ אֲלֵי/הֶם֒ וַ/יָּשִׁ֣בוּ הָ/עָ֣ם אֶת הַ/מֶּ֣לֶךְ דָּבָ֣ר לֵ/אמֹ֡ר מַה לָּ/נוּ֩ חֵ֨לֶק בְּ/דָוִ֜ד וְ/לֹֽא נַחֲלָ֣ה בְּ/בֶן יִשַׁ֗י לְ/אֹהָלֶ֨י/ךָ֙ יִשְׂרָאֵ֔ל עַתָּ֕ה רְאֵ֥ה בֵיתְ/ךָ֖ דָּוִ֑ד וַ/יֵּ֥לֶךְ יִשְׂרָאֵ֖ל לְ/אֹהָלָֽי/ו־־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/016.yaml
  text: When all Israel saw that the king had not listened to them[a], the people answered the king, saying, “What share do we have in David? We have no inheritance in the son of Jesse. To your tents, O Israel! Now see to your own house[b], David.” So Israel went to their tents.
translation:
  language: zh_hans
  text: 以色列众人见王不听从他们，就回答王说：“我们在大卫那里有什么份呢？在耶西的儿子那里，我们也没有产业。以色列啊，各回自己的帐篷去吧！[a]大卫啊，现在你只管照料自己的家吧！[b]”于是，以色列人各回自己的帐篷去了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “各回自己的帐篷去吧”也可按其惯用含义译作“以色列啊，各回自己的家去吧！”这句话表示众人散去，并撤回效忠。
    reason: lexical_alternative
  - marker: b
    text: 这里的“家”也可指“王朝”，即“大卫啊，现在你只管照料自己的王朝吧！”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא כָּל־יִשְׂרָאֵל
  choice: 以色列众人见
  rationale: 保留“看见”的希伯来表达，同时上下文自然包含“看出、意识到”王拒绝听从的意思；“以色列众人”体现作为政治共同体的集合称谓。
- source_word: לֹא־שָׁמַע הַמֶּלֶךְ אֲלֵיהֶם
  choice: 王不听从他们
  rationale: שׁמע 与 אֶל 连用表示听取、听从，而不只是听见声音。
- source_word: וַיָּשִׁבוּ הָעָם אֶת־הַמֶּלֶךְ דָּבָר
  choice: 就回答王说
  rationale: 按现代汉语自然表达希伯来语“向王回一句话”的答复惯用语。
- source_word: מַה־לָּנוּ חֵלֶק בְּדָוִד
  choice: 我们在大卫那里有什么份呢
  rationale: חֵלֶק 是“份、分”，保留分配、归属及政治关系的意味，不弱化为一般的“与我们何干”。
- source_word: וְלֹא־נַחֲלָה בְּבֶן־יִשַׁי
  choice: 在耶西的儿子那里，我们也没有产业
  rationale: נַחֲלָה 译作“产业”，保留继承物、部族产业和归属的语义回响；“耶西的儿子”保留原文不用王号、直称父系身份的贬抑语气。
- source_word: לְאֹהָלֶיךָ יִשְׂרָאֵל
  choice: 以色列啊，各回自己的帐篷去吧
  rationale: “帐篷”直译 אֹהֶל，并保留号召众人散去、撤回政治效忠的历史性口号；“各回”使集合单数的号召在汉语中清楚自然。
- source_word: עַתָּה רְאֵה בֵיתְךָ דָּוִד
  choice: 大卫啊，现在你只管照料自己的家吧
  rationale: ראה 在这里有“留意、照管”之意；“家”保留 בַּיִת 可兼指家室与王朝的双重含义，“只管”传达决裂后的斥退语气。
- source_word: וַיֵּלֶךְ יִשְׂרָאֵל לְאֹהָלָיו
  choice: 于是，以色列人各回自己的帐篷去了
  rationale: 保留“帐篷”的重复，以呼应前面的号召；将集合名词按自然汉语表达为“以色列人”。
theological_decisions:
- issue: 对大卫家的政治决裂
  choice: 按历史叙事直接呈现众支派拒绝继续效忠大卫王朝的口号
  alternative: 将其强化为对大卫之约或弥赛亚应许的神学否定，或弱化为普通家庭纠纷
  rationale: 本节直接叙述以色列众支派反抗罗波安及大卫王室。译文保留叛离的政治力度和“家”的王朝含义，却不替叙事加入超出原文的神学裁决。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。保留“份”“产业”“帐篷”“家”等彼此呼应的原文意象，同时用“听从”“各回”“照料”等现代词语明确其语用意义；呼语“大卫啊”“以色列啊”保留公开政治口号的力度。
