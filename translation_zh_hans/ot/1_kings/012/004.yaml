base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/004.yaml
  text: Your father made our yoke heavy[a]. So now, lighten the hard service of your father and his heavy yoke that he put on us[b], and we will serve you.
translation:
  language: zh_hans
  text: “你父亲使我们所负的轭沉重[a]。现在，求你减轻你父亲严酷的苦役，以及他加在我们身上的重轭[b]，我们就服事你。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“使我们的轭难负”。希伯来语以“轭”比喻压迫人的劳役和义务。
    reason: lexical_alternative
  - marker: b
    text: “严酷的苦役”也可译作“艰苦的服役”或“严苛的劳役”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הִקְשָׁה אֶת עֻלֵּנוּ
  choice: 使我们的轭难负
  rationale: 保留“轭”的统治与劳役隐喻，并以“难负”表达使役动词“使……艰难、严酷”的含义，同时避免把此处直接改成后文不同的“重”。
- source_word: עֻלֵּנוּ
  choice: 我们的轭
  rationale: 直译核心意象；“轭”在现代汉语中虽较庄重，却是可理解的压迫性负担隐喻，并与后文“重轭”照应。
- source_word: הָקֵל
  choice: 减轻
  rationale: 准确表达命令式“使之变轻”，并与后文“重轭”构成轻重对照。
- source_word: מֵעֲבֹדַת אָבִיךָ הַקָּשָׁה
  choice: 你父亲加给我们的苦役
  rationale: עֲבֹדָה可指服役、劳役或服务义务；在王权负担的语境中，“苦役”自然传达其艰苦和压迫性。“加给我们的”由整句关系明确补出，使汉语顺畅。
- source_word: וּמֵעֻלּוֹ הַכָּבֵד
  choice: 和重轭
  rationale: 保留原文“轭”及“沉重”的修饰；汉语中承接前面的“你父亲加给我们的”，无需机械重复所属关系。
- source_word: אֲשֶׁר נָתַן עָלֵינוּ
  choice: 加给我们的
  rationale: 按汉语习惯表达“放在我们身上、施加于我们”，并统摄并列的“苦役和重轭”。
- source_word: וְנַעַבְדֶךָּ
  choice: 我们就服事你
  rationale: “就”表达请求得到满足后所作的承诺；“服事”兼有臣服与效劳之意，适合百姓对君王的政治语境。
- source_word: עַתָּה
  choice: 现在
  rationale: 保留从申诉转入请求的时间与话语标记，现代汉语自然简洁。
