  text: וַ/יְהִי֙ דְּבַ֣ר הָֽ/אֱלֹהִ֔ים אֶל שְׁמַעְיָ֥ה אִישׁ הָ/אֱלֹהִ֖ים לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/022.yaml
  text: And the word of God came to Shemaiah the man of God[a], saying,
translation:
  language: zh_hans
  text: 上帝的话临到神人示玛雅，说：[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文是“上帝的话临到示玛雅”。类似的表达中，不少译本译作“耶和华的话”，但本节原文明确使用“上帝”（אֱלֹהִים），而不是神名“耶和华”（יהוה）。
    reason: 说明原文用词，并防止读者将此处与更常见的“耶和华的话”公式混同。
lexical_decisions:
- source_word: וַיְהִי דְּבַר הָאֱלֹהִים אֶל
  choice: 上帝的话临到
  rationale: 这是希伯来文叙事中引入神圣启示的惯用结构；“临到”既保留事件性，也符合现代中文圣经语体。
- source_word: דְּבַר
  choice: 话
  rationale: 此处指上帝所赐的启示性言语；“话”比“事情”准确，也比“信息”更能保留原文惯用表达及其神学意味。
- source_word: הָאֱלֹהִים
  choice: 上帝
  rationale: 此处指独一的真神，原文用的是אֱלֹהִים，而非神名יהוה；因此按实际词形译为“上帝”，不与常见的“耶和华的话”公式协调。
- source_word: שְׁמַעְיָה
  choice: 示玛雅
  rationale: 按现代中文圣经中常见的希伯来人名音译处理。
- source_word: אִישׁ הָאֱלֹהִים
  choice: 神人
  rationale: 这是称呼先知性人物的固定称号；“神人”简洁自然，并保留其身份功能。
- source_word: לֵאמֹר
  choice: 说
  rationale: 该不定式用于引出下一节的直接引语；译作“说”能清楚衔接后文，同时符合现代中文表达。
theological_decisions:
- issue: 启示公式中אֱלֹהִים的译法
  choice: 上帝
  alternative: 耶和华
  rationale: 马所拉文本明确使用אֱלֹהִים，而不是יהוה。译文应以原文为准，不因类似经文常用“耶和华的话”而加以协调。
translation_notes:
  register: 采用现代、庄重而易懂的中文。“临到”和“神人”保留经文惯用语体；句末“说”用于承接下一节直接引语。脚注标记[a]已置于主文中。
