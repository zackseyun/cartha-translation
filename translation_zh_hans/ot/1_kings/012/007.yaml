base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/007.yaml
  text: And he spoke to him[a], saying, “If today you will be a servant to this people, and serve them, and answer them, and speak good words to them[b], then they will be your servants all your days.”
translation:
  language: zh_hans
  text: 他们[a]对他说：“你今天若作这百姓的仆人，服侍他们，答复他们，对他们说和善的话[b]，他们就会永远作你的仆人[c]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 标准《威斯敏斯特列宁格勒抄本》作“他们对他说”；所提供的希伯来文本形式若按字面读取，则是“他对他说”。
    reason: textual_form
  - marker: b
    text: 直译“好话”。
    reason: lexical_alternative
  - marker: c
    text: 或译：“他们就会一直服侍你。”
    reason: lexical_alternative
lexical_decisions:
- source_word: עֶבֶד
  choice: 仆人
  rationale: 此处是政治语境中的服务性比喻；“仆人”既保留与后文“作你的仆人”的呼应，也比“奴隶”更符合上下文。
- source_word: וַעֲבַדְתָּם
  choice: 服侍他们
  rationale: 保留与“仆人”同词根形成的名词—动词联系，并传达君王应以服务百姓的姿态回应他们。
- source_word: וַעֲנִיתָם
  choice: 答复他们
  rationale: ענה在此指对百姓的请求作出回答；“答复”比可能含有“同意”之意的“答应”更准确。
- source_word: דְּבָרִים טוֹבִים
  choice: 和善的话
  rationale: 直译为“好话”亦可；“和善的话”在现代汉语中更自然，并表达此处善意、宽和的言辞，而不把内容具体化。
- source_word: וְהָיוּ לְךָ עֲבָדִים
  choice: 他们就会……作你的仆人
  rationale: 保留名词“仆人”，使君王先作百姓仆人、百姓继而作他仆人的互惠对照清晰可见。
- source_word: כָּל הַיָּמִים
  choice: 永远
  rationale: 这是表示持续时间的惯用语；“永远”在现代汉语中自然，也不强行加入原文没有明说的“你一生”。
- source_word: אִם הַיּוֹם
  choice: 你今天若
  rationale: 保留“今天”的即时性，同时按现代汉语习惯调整条件句语序。
- source_word: וַיְדַבְּרוּ אֵלָיו לֵאמֹר
  choice: 他们对他说
  rationale: 标准WLC正文为复数“他们说”，承接上一节的众长老；用户所引形式缺少复数词尾，故在脚注说明。
theological_decisions:
- issue: 君王作百姓仆人的政治性比喻
  choice: 直接译作“作这百姓的仆人……服侍他们”
  alternative: 译成“为百姓效力”或“作百姓的臣属”
  rationale: 原文刻意重复 עבד 词族，并以百姓后来作王的仆人形成反转和呼应；直译能保存这种张力，同时不加入后来的神学含义。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“仆人／服侍／仆人”的重复有意保留原文的词根呼应；并列动词不合并，以维持劝告逐层展开的节奏。
