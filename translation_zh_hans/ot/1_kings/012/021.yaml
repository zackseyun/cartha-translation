source:
  edition: WLC
  text: ו/יבאו רְחַבְעָם֮ יְרוּשָׁלִַם֒ וַ/יַּקְהֵל֩ אֶת כָּל בֵּ֨ית יְהוּדָ֜ה וְ/אֶת שֵׁ֣בֶט בִּנְיָמִ֗ן מֵאָ֨ה וּ/שְׁמֹנִ֥ים אֶ֛לֶף בָּח֖וּר עֹשֵׂ֣ה מִלְחָמָ֑ה לְ/הִלָּחֵם֙ עִם בֵּ֣ית יִשְׂרָאֵ֔ל לְ/הָשִׁיב֙ אֶת הַ/מְּלוּכָ֔ה לִ/רְחַבְעָ֖ם בֶּן שְׁלֹמֹֽה־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/021.yaml
  text: When Rehoboam came to Jerusalem[a], he assembled all the house of Judah and the tribe of Benjamin, one hundred eighty thousand chosen warriors, to fight against the house of Israel, to restore the kingdom to Rehoboam son of Solomon.
translation:
  language: zh_hans
  text: 罗波安来到耶路撒冷，就召集犹大全家和便雅悯支派，共十八万名精锐战士[a]，要与以色列家交战，使王国重新归属所罗门的儿子罗波安。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “精锐战士”也可译作“年轻战士”。
    reason: בָּחוּר既可表示经过挑选的精锐人员，也可指年轻男子；军事语境允许这两种理解。
lexical_decisions:
- source_word: וַיָּבֹאוּ / ויבאו
  choice: 来到
  rationale: בוא以耶路撒冷为目的地，译作“来到”符合现代汉语叙事。辅音形式表面为复数，但主语“罗波安”为单数，后续动词也为单数，因此按上下文表达单数意义。
- source_word: וַיַּקְהֵל
  choice: 召集
  rationale: קהל的使役式表示使人聚集；“召集”自然地保留了主动召聚军队的含义。
- source_word: כָּל בֵּית יְהוּדָה
  choice: 犹大全家
  rationale: 保留“家”这一政治共同体意象，并与后文“以色列家”形成原文中的平行。
- source_word: שֵׁבֶט בִּנְיָמִן
  choice: 便雅悯支派
  rationale: 明确译出שֵׁבֶט“支派”，保留犹大与便雅悯之间的部族区分。
- source_word: מֵאָה וּשְׁמֹנִים אֶלֶף
  choice: 十八万名
  rationale: 采用现代汉语通行的数字表达，并用量词“名”衔接人员。
- source_word: בָּחוּר עֹשֵׂה מִלְחָמָה
  choice: 能征战的精兵
  rationale: עֹשֵׂה מִלְחָמָה直指从事战争的人；בָּחוּר在军事语境中可指精选之人，也可能带有年轻男子的意味。正文以自然简洁的“精兵”表达，脚注保留另一可能。
- source_word: לְהִלָּחֵם עִם
  choice: 与……交战
  rationale: 此处עִם在敌对语境中表示交战对象；“与……交战”准确而庄重。
- source_word: בֵּית יִשְׂרָאֵל
  choice: 以色列家
  rationale: 保留政治共同体用语“家”，并与“犹大全家”相呼应，反映王国分裂后的两方。
- source_word: לְהָשִׁיב אֶת הַמְּלוּכָה
  choice: 使王国重新归属
  rationale: שׁוב的使役式表示使之返回或恢复；此处目标是恢复罗波安对王国的统治。“使王国重新归属”既保留王国的政治含义，也符合汉语搭配。
- source_word: לִרְחַבְעָם בֶּן שְׁלֹמֹה
  choice: 归属所罗门的儿子罗波安
  rationale: 介词ל表示恢复后的归属或受益者；按汉语习惯将“所罗门的儿子”置于人名前。
theological_decisions:
- issue: מַמְלָכָה所指的是疆域政体还是王权统治
  choice: 王国
  alternative: 王权／王位
  rationale: 上下文涉及分裂后的国家统治重新归于罗波安。“王国”保留政治共同体的层面；“重新归属”同时传达恢复其统治权的含义，而不将两种侧重强行拆开。
translation_notes:
  register: 采用现代、庄重且易懂的叙事语言。“犹大全家”和“以色列家”有意保留原文平行的政治共同体称谓；数字用现代汉语简洁表达。脚注标记置于其所说明的“精兵”之后。
