base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/010.yaml
  text: 'The young men who had grown up with him spoke to him, saying, “This is what you shall say to this people who spoke to you, saying, ‘Your father made our yoke heavy, but you, make it lighter for us’: this is what you shall say to them, ‘My little finger is thicker than my father’s waist.’”'
translation:
  language: zh_hans
  text: 那些与他一同长大的年轻人对他说：“你要这样回答那些曾对你说：‘你父亲使我们的轭沉重；请你为我们减轻这轭。’的百姓：‘我的小指头比我父亲的腰还粗。’”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַיְלָדִים
  choice: 年轻人
  rationale: 此处指与罗波安一同长大、向他献策的同龄臣属；译作“年轻人”符合上下文，也比字面的“孩子们”自然。
- source_word: עֻלֵּנוּ
  choice: 我们的轭
  rationale: 保留原文“轭”的政治压迫与劳役负担隐喻；后句用“重担”自然表达 מֵעָלֵינוּ 所指从他们身上移去的负荷。
- source_word: הָקֵל מֵעָלֵינוּ
  choice: 减轻我们的重担
  rationale: 希伯来语直义为“从我们身上减轻”；补出语境中所指的“重担”，使现代汉语完整自然。
- source_word: קָטָנִּי
  choice: 我的小指头
  rationale: 该词在本句传统上理解为“小指”；其具体身体指称虽有词源讨论，但语境中的夸张比较清楚，采用通行且易懂的译法。
- source_word: מָתְנֵי אָבִי
  choice: 我父亲的腰
  rationale: מָתְנַיִם 指腰部、腰身；译作“腰”既贴近原文，也保留夸张而挑衅的比喻。
theological_decisions:
- issue: 年轻谋士之言的道德评价
  choice: 不在正文中添加“狂妄”“恶意”等评价
  alternative: 以解释性词语明确谴责他们的建议
  rationale: 本节以叙事和直接引语呈现建议，其道德与神学评价应由上下文显明，不宜在译文中额外加入。
- issue: “轭”的所指范围
  choice: 保留“轭”的隐喻，不具体限定为税赋、徭役或统治
  alternative: 译为“赋税”或“劳役”
  rationale: 原文概括性较强，可能涵盖多种王权重负；具体化会缩窄原意。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。压缩原文反复出现的“说／这样说”框架为流畅的“这样回答”，但完整保留引语层次、百姓的请求和末尾夸张比喻。
