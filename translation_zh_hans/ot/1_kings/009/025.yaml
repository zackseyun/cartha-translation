  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/הֶעֱלָ֣ה שְׁלֹמֹ֡ה שָׁלֹשׁ֩ פְּעָמִ֨ים בַּ/שָּׁנָ֜ה עֹל֣וֹת וּ/שְׁלָמִ֗ים עַל הַ/מִּזְבֵּ֨חַ֙ אֲשֶׁ֣ר בָּנָ֣ה לַ/יהוָ֔ה וְ/הַקְטֵ֣יר אִתּ֔/וֹ אֲשֶׁ֖ר לִ/פְנֵ֣י יְהוָ֑ה וְ/שִׁלַּ֖ם אֶת הַ/בָּֽיִת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/025.yaml
  text: And Solomon offered up burnt offerings and peace offerings on the altar that he had built for Yahweh three times a year[a], and he burned incense with it before Yahweh[b]. Thus he completed the house.
translation:
  language: zh_hans
  text: 所罗门每年三次在他为雅威建造的祭坛上献上燔祭和平安祭，并在雅威面前在这祭坛上焚香[a]。这样，他完成了这殿[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“把祭物焚烧成烟”。这里的希伯来语动词可泛指使祭物化为烟气，并不只指焚香。
    reason: lexical_alternative
  - marker: b
    text: 原文直译“这房屋”，这里指圣殿。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֶעֱלָה
  choice: 献上
  rationale: 该动词在使役形和献祭语境中通常指把祭物献上；“献上”既保留祭祀意味，也符合现代汉语表达。
- source_word: עֹלוֹת
  choice: 燔祭
  rationale: 这是祭物全部焚烧献上的专门礼仪用语；“燔祭”是准确且通行的中文译名。
- source_word: שְׁלָמִים
  choice: 平安祭
  rationale: 该词指一类与相交、福祉和平安有关的祭；采用读者较熟悉的传统译名“平安祭”。
- source_word: שָׁלֹשׁ פְּעָמִים בַּשָּׁנָה
  choice: 每年三次
  rationale: 直接、自然地表达原文的时间频率。
- source_word: עַל הַמִּזְבֵּחַ אֲשֶׁר בָּנָה לַיהוָה
  choice: 在他为雅威建造的祭坛上
  rationale: 如实保留祭坛、建造者和受献对象之间的关系。
- source_word: וְהַקְטֵיר
  choice: 焚香
  rationale: 该使役形动词可指焚香，也可更广泛地指使祭物化为烟气；正文采用此处圣殿礼仪语境中自然的“焚香”，脚注保留较宽的词义。
- source_word: אִתּוֹ אֲשֶׁר לִפְנֵי יְהוָה
  choice: 在雅威面前用这坛
  rationale: 希伯来语结构较为困难；译文把代词理解为回指祭坛，并保留礼仪发生在雅威面前这一空间关系，不引入执行者身份的额外判断。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以音译呈现以色列上帝的专名，而不以称号替代。
- source_word: וְשִׁלַּם אֶת הַבָּיִת
  choice: 这样，他完成了这殿
  rationale: שׁלם 的加强形在此表示完成；“这殿”既保留原文“这房屋”的表达关联，又清楚指出语境中的圣殿。
theological_decisions:
- issue: 所罗门是否亲手执行祭司礼仪
  choice: 沿用原文，直接把献祭和焚香归于所罗门，不进一步说明他是否亲手执行
  alternative: 明确译为所罗门吩咐或安排祭司献祭焚香
  rationale: 希伯来文以君王事迹摘要的方式将行动归于所罗门，既可能指亲自执行，也可能指主持或授权执行。译文不加入原文没有的主语或使役说明，以保留张力。
- issue: וְהַקְטֵיר 的礼仪含义
  choice: 正文译作“焚香”，脚注说明也可泛指把祭物焚烧成烟
  alternative: 正文译作“把祭物焚烧成烟”
  rationale: 圣殿语境支持“焚香”，但该动词并不限于香料，因此用脚注保留真实的词义范围。
- issue: 末句与前文的逻辑关系
  choice: 译作“这样，他完成了这殿”
  alternative: 仅作并列：“他完成了这殿”
  rationale: 原文以连接词承接前述行动；“这样”表达总结关系，但不进一步界定完成究竟指建筑工程还是礼仪功能的圆满实现。
translation_notes:
  register: 采用现代、庄重而清楚的普通话。“燔祭”“平安祭”保留必要的礼仪术语；“雅威”呈现神的专名。句法按汉语习惯调整为“每年三次”前置，同时保留原文各动作及其神学含混性。
