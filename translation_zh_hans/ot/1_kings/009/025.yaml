  to: 所罗门每年三次在他为雅威建造的祭坛上献上燔祭和平安祭，并在雅威面前在这祭坛上焚香[a]。这样，他完成了这殿[b]。
  rationale: 仅作低风险的中文句法调整：将“又在雅威面前用这坛焚香”改为“并在雅威面前在这祭坛上焚香”。这改善自然度，并以较少解释性的方式呈现代词回指祭坛的常见理解；不改变原文对所罗门实际执行礼仪与否所保留的含混性。其余术语、时间频率、神名和脚注锚点均予保留。
