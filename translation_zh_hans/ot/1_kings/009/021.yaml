  text: בְּנֵי/הֶ֗ם אֲשֶׁ֨ר נֹתְר֤וּ אַחֲרֵי/הֶם֙ בָּ/אָ֔רֶץ אֲשֶׁ֧ר לֹֽא יָכְל֛וּ בְּנֵ֥י יִשְׂרָאֵ֖ל לְ/הַֽחֲרִימָ֑/ם וַ/יַּעֲלֵ֤/ם שְׁלֹמֹה֙ לְ/מַס עֹבֵ֔ד עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/021.yaml
  text: their children who were left after them in the land[a], whom the sons of Israel had not been able to devote to destruction—Solomon conscripted them for forced labor, to this day.
translation:
  language: zh_hans
  text: 他们之后仍留在这地的子孙，就是以色列人未能彻底毁灭[a]的那些人，所罗门征召他们服劳役，直到今日。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “彻底毁灭”所译的希伯来语也可译作“置于禁毁之下”。这个词指把人或物不可撤回地归于毁灭，交付审判。
    reason: 说明חרם的特殊宗教—司法含义，并列出较为直译的译法。
lexical_decisions:
- source_word: בְּנֵיהֶם
  choice: 他们……的后代
  rationale: בֵּן的复数在此可泛指后代，不必限定为男性；结合上下文，“后代”比“儿子”更自然，也准确表达前述族群留存的下一代。
- source_word: נֹתְרוּ אַחֲרֵיהֶם בָּאָרֶץ
  choice: 在这地留下来的
  rationale: 保留נותר表示“剩下、存留”的结果意义，并以自然汉语表达这些人在先辈之后仍留在当地。定冠词所指的特定土地译作“这地”。
- source_word: לֹא יָכְלוּ ... לְהַחֲרִימָם
  choice: 未能尽行毁灭
  rationale: “未能”反映לא יכלו的能力含义；“尽行毁灭”兼顾חרם在征服语境中的彻底毁灭意义，而其归于禁毁、交付审判的特殊内涵在脚注中说明。
- source_word: וַיַּעֲלֵם
  choice: 征召他们
  rationale: 此处עלה的使役形与למס连用，表示把人编入劳役征调；“征召”清楚表达行政性、强制性的安排。
- source_word: לְמַס עֹבֵד
  choice: 服劳役
  rationale: מַס עֹבֵד指被征用的强制劳动。“服劳役”是现代汉语中简明且庄重的表达，同时避免把其法律身份过度具体化为奴隶。
- source_word: עַד הַיּוֹם הַזֶּה
  choice: 直到今日
  rationale: 贴合希伯来文固定时间表达，也符合中文历史叙事的庄重语体。
theological_decisions:
- issue: 征服与审判语境中 החרים 的译法
  choice: 尽行毁灭
  alternative: 置于禁毁之下；作为当毁灭之物献上
  rationale: 正文采用普通读者易懂的表达，但用脚注保留该词不只是一般军事毁灭，也含有不可撤回地归于禁毁、交付审判的宗教与司法意味，避免消解原文的神学张力。
translation_notes:
  register: 采用现代、庄重而通顺的历史叙事语体。“后代”避免不必要的男性限定；分号使前置宾语与所罗门的行动关系清楚。脚注标记紧随其所解释的“尽行毁灭”。
