base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/023.yaml
  text: 'These were the chief officers of the deputies who were over the work for Solomon: five hundred and fifty[b][a], ruling over the people who were doing the work.'
translation:
  language: zh_hans
  text: 这些是负责所罗门工程的督工官长[a]，共五百五十人；管辖[b]做工的百姓。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “督工官长”也可译作“受委任的官员中的首领”；原文用词可指被派定职位、管理他人的官员。
    reason: lexical_alternative
  - marker: b
    text: “管辖”也可译作“督管”；原文动词可表示统治、掌管或行使权柄。
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂרֵי הַנִּצָּבִים
  choice: 督工长官
  rationale: שָׂרֵי 与 הַנִּצָּבִים 构成领属结构，指受委任、负责工程之官员中的长官。“督工长官”在现代汉语中简明地保留其行政和层级含义，而不采用带军事色彩的称呼。
- source_word: אֲשֶׁר עַל הַמְּלָאכָה לִשְׁלֹמֹה
  choice: 替所罗门负责工程
  rationale: עַל 在这里表示负责、管理，לִשְׁלֹמֹה 表示为所罗门效力或与所罗门有关。“替所罗门负责工程”自然表达这种关系，又不把它限定为工程的所有权。
- source_word: חֲמִשִּׁים וַחֲמֵשׁ מֵאוֹת
  choice: 五百五十人
  rationale: 按希伯来文数词直译；补出量词“人”，符合现代汉语表达。
- source_word: הָרֹדִים
  choice: 管辖
  rationale: רדה 表示统治、掌管或对人行使权柄。在劳役管理语境中，“管辖”保留其权威意味，比单纯的“监督”更贴近原词力度。
- source_word: בָּעָם הָעֹשִׂים בַּמְּלָאכָה
  choice: 做工的百姓
  rationale: 保留 עָם 的通常含义“百姓”，并以“做工的”翻译后面的分词短语，不预先把他们窄化为某一类工人。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“督工长官”体现原文的官员层级，“做工的百姓”则保留原文对劳作者较宽泛的称呼。
