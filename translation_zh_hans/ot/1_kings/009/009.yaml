revisions:
- from: 他们就会说：“这是因为他们离弃了雅威他们的神；雅威曾把他们的先祖[a]从埃及地领出来，他们却紧紧依附别的神明，向它们俯伏下拜，事奉它们。因此，雅威使这一切灾祸[b]临到他们。”
  to: 他们就会说：“因为他们离弃了雅威他们的神——他曾把他们的父辈从埃及地领出来——，又紧紧依附别的神，向它们俯伏下拜，事奉它们；因此，雅威使这一切灾祸[a]临到他们。”
  rationale: 修订仅作安全且必要的源文对应调整：以“父辈”取代“先祖”，直接保留 אֲבֹתָם 的阳性复数祖先称谓；同时调整句法，使“曾把他们的父辈从埃及地领出来”明确修饰雅威，并统一“别的神”的术语。删除已不再必要的“父辈”脚注，保留并重编号灾祸释义脚注。
