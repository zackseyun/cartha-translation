  source_fidelity: 正文将 אֲבֹתָם 译为“先祖”，虽有脚注说明其字面为“父辈”，但原文在此明确使用“父辈／列祖”的阳性复数表达；在不损害现代汉语自然度的前提下，正文宜保留为“父辈”。其余主要语义均忠实：离弃雅威、依附别神、俯伏下拜、事奉，以及因而临到的审判性灾祸，均得到恰当呈现。
  naturalness: 原译整体庄重、流畅。“紧紧依附”“俯伏下拜”“使……临到”符合现代书面普通话。修订以破折号将“曾把他们的父辈从埃及地领出来”明确附属于“雅威”，避免分号造成该从句似乎脱离因果陈述的轻微句法松散。
  terminology: “雅威”一致对应 יהוה；“他们的神”“别的神”“事奉”“灾祸”均合适。将“神明”改为“神”，与原文 אֱלֹהִים 的通行圣经汉语表达及本节“他们的神”保持一致。“父辈”保留原文的性别化祖先术语，因此不再需要相关脚注。
