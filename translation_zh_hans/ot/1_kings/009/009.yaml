  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/אָמְר֗וּ עַל֩ אֲשֶׁ֨ר עָזְב֜וּ אֶת יְהוָ֣ה אֱלֹהֵי/הֶ֗ם אֲשֶׁ֨ר הוֹצִ֣יא אֶת אֲבֹתָ/ם֮ מֵ/אֶ֣רֶץ מִצְרַיִם֒ וַֽ/יַּחֲזִ֨קוּ֙ בֵּ/אלֹהִ֣ים אֲחֵרִ֔ים ו/ישתחו לָ/הֶ֖ם וַ/יַּעַבְדֻ֑/ם עַל כֵּ֗ן הֵבִ֤יא יְהוָה֙ עֲלֵי/הֶ֔ם אֵ֥ת כָּל הָ/רָעָ֖ה הַ/זֹּֽאת־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/009.yaml
  text: And they will say[a], ‘Because they abandoned Yahweh their God, who brought their fathers out of the land of Egypt, and they held fast to other gods and bowed down to them and served them[c][b], therefore Yahweh brought all this disaster on them.’
translation:
  language: zh_hans
  text: 他们就会说：“因为他们离弃了雅威他们的神——他曾把他们的父辈从埃及地领出来——，又紧紧依附别的神，向它们俯伏下拜，事奉它们；因此，雅威使这一切灾祸[a]临到他们。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语也可直译为“这一切恶”；这里指审判所带来的灾祸，并非道德上的邪恶。
    reason: 澄清 רָעָה 在本语境中的灾难含义。
lexical_decisions:
- source_word: וְאָמְרוּ
  choice: 他们就会说
  rationale: 承接上一节所说经过废墟并发问的人；完成式连于此处的预告语境，表达将来的回应。
- source_word: עַל אֲשֶׁר
  choice: 这是因为
  rationale: 该短语引出灾祸发生的原因；此译法符合现代汉语因果说明的表达。
- source_word: עָזְבוּ
  choice: 离弃了
  rationale: 既表达离开，也保留背弃与雅威之关系的分量，且为现代宗教语境中可理解的庄重用语。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来语四字神名的通常拟音译出其专名，而不以头衔替代。
- source_word: אֱלֹהֵיהֶם
  choice: 他们的神
  rationale: 此处以雅威为所指，虽形态为复数形式，句法和语义均为单数。
- source_word: הוֹצִיא ... מֵאֶרֶץ מִצְרַיִם
  choice: 把他们的先祖从埃及地领出来
  rationale: 保留出埃及的固定叙事内容；“领出来”自然表达使其离开该地的行动。
- source_word: אֲבֹתָם
  choice: 他们的先祖
  rationale: 希伯来语直译为“他们的父辈”，在这里泛指从埃及出来的前代；“先祖”庄重、自然，并以脚注保留字面信息。
- source_word: וַיַּחֲזִקוּ בֵּאלֹהִים אֲחֵרִים
  choice: 他们却紧紧依附别的神明
  rationale: חזק 接 ב 表示抓牢、执意依附；“紧紧依附”保留主动而坚决的归附意味。“却”显出与雅威恩惠相反的行动。
- source_word: וישתחו להם
  choice: 向它们俯伏下拜
  rationale: 保留动词所描写的身体动作，而不笼统化为“敬拜”；偶像在汉语中以“它们”指代自然。
- source_word: וַיַּעַבְדֻם
  choice: 事奉它们
  rationale: 保留 עבד 的服事、宗教性供奉含义，并与前面的俯伏动作区分。
- source_word: עַל כֵּן
  choice: 因此
  rationale: 清楚标明背弃与审判结果之间的因果关系。
- source_word: הֵבִיא ... אֵת כָּל הָרָעָה הַזֹּאת
  choice: 使这一切灾祸临到他们
  rationale: רָעָה 在此指审判性的祸患，不指道德邪恶；该表达庄重而符合现代汉语。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用以色列之神的专名。译作“雅威”保留专名及其拟音性质，不用称号“主”替换，也不采用源于 Jehovah 形式的“耶和华”。
- issue: אֲבֹתָם 的性别与群体范围
  choice: 先祖，并加脚注注明字面为“父辈”
  alternative: 父辈
  rationale: 该词为阳性复数，但在本句中指从埃及出来的前代群体。“先祖”在汉语中自然且不排除原文的父系表述，脚注则保留其字面形式。
- issue: רָעָה 是道德之恶还是审判性灾祸
  choice: 灾祸
  alternative: 恶事
  rationale: 本句说雅威使其临到百姓，语境指因背弃而来的灾难性审判，并非说雅威施行道德邪恶。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。以“离弃—紧紧依附—俯伏下拜—事奉”保留原文动作的递进；分号和分句处理使较长的因果陈述清晰，同时不消解原文将背弃与灾祸直接相连的神学张力。
