  text: כָּל הָ֠/עָם הַ/נּוֹתָ֨ר מִן הָ/אֱמֹרִ֜י הַ/חִתִּ֤י הַ/פְּרִזִּי֙ הַ/חִוִּ֣י וְ/הַ/יְבוּסִ֔י אֲשֶׁ֛ר לֹֽא מִ/בְּנֵ֥י יִשְׂרָאֵ֖ל הֵֽמָּה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/020.yaml
  text: All the people who remained of the Amorites[a], the Hittites, the Perizzites, the Hivites, and the Jebusites, who were not of the sons of Israel—
translation:
  language: zh_hans
  text: 所有从亚摩利人、赫人、比利洗人、希未人和耶布斯人中剩下的人，他们不是以色列子孙——
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כָּל הָעָם הַנּוֹתָר
  choice: 所有剩下的……人
  rationale: כָּל 表示整体范围，הַנּוֹתָר 是 יתר 的尼法勒分词，指留下来、剩余的人；汉语合译为“所有剩下的……人”自然且准确。
- source_word: מִן הָאֱמֹרִי הַחִתִּי הַפְּרִזִּי הַחִוִּי וְהַיְבוּסִי
  choice: 亚摩利人、赫人、比利洗人、希未人和耶布斯人
  rationale: 这些单数族名在此具有集合意义，按现代中文圣经人名惯例译作各族群名称；מִן 表示这些民族中剩余下来的人，中文由“剩下的”与族名列表自然体现。
- source_word: אֲשֶׁר
  choice: 就是那些……的人
  rationale: 关系词回指前述各族余民；采用“就是那些”使较长的汉语句子层次清楚。
- source_word: לֹא מִבְּנֵי יִשְׂרָאֵל הֵמָּה
  choice: 不属于以色列子孙的人
  rationale: 直译为“他们不是出自以色列子孙”。“不属于以色列子孙”保留群体归属或来源的含义，也保留 בְּנֵי יִשְׂרָאֵל 的传统表达；הֵמָּה 的强调由“就是那些”部分体现。
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל 的群体称谓
  choice: 以色列子孙
  alternative: 以色列人
  rationale: “以色列子孙”较透明地保留希伯来语“以色列的众子”的形式及其盟约群体色彩；“以色列人”更简练，但会弱化原文措辞。
- issue: לֹא מִבְּנֵי 的关系
  choice: 不属于
  alternative: 并非出自
  rationale: 介词 מִן 可表达来源或群体归属；“不属于”在此自然，却不把关系严格限定为血统来源。
translation_notes:
  register: 采用庄重、清晰的现代标准汉语。句末破折号保留希伯来文本在本节末尚未完结、下节继续说明的句法走势。
