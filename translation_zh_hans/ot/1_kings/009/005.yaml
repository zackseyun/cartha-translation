  text: וַ/הֲקִ֨מֹתִ֜י אֶת כִּסֵּ֧א מַֽמְלַכְתְּ/ךָ֛ עַל יִשְׂרָאֵ֖ל לְ/עֹלָ֑ם כַּ/אֲשֶׁ֣ר דִּבַּ֗רְתִּי עַל דָּוִ֤ד אָבִ֨י/ךָ֙ לֵ/אמֹ֔ר לֹֽא יִכָּרֵ֤ת לְ/ךָ֙ אִ֔ישׁ מֵ/עַ֖ל כִּסֵּ֥א יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/005.yaml
  text: then I will establish the throne of your kingdom over Israel forever, just as I spoke concerning David your father, saying, ‘A man of yours will not be cut off from the throne of Israel.’
translation:
  language: zh_hans
  text: 我就必使你国度的王位在以色列中永远坚立，正如我曾论到你父亲大卫说：‘必不断有属你的人坐在以色列的王位上。’
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַהֲקִמֹתִי אֶת־כִּסֵּא מַמְלַכְתְּךָ
  choice: 我就必使你在以色列的国位永远坚立
  rationale: הקים在此表示使王朝的统治地位稳固；כִּסֵּא מַמְלַכְתְּךָ直译为“你国度的宝座”，用“你的国位”自然表达王权及王朝延续。
- source_word: לֹא יִכָּרֵת לְךָ אִישׁ
  choice: 你必不断有人
  rationale: יכרת本义为“被剪除、断绝”，此固定王朝表达意为属于大卫一系的人不会断绝；“不断有人”保留延续性，又符合现代汉语。
- source_word: מֵעַל כִּסֵּא יִשְׂרָאֵל
  choice: 坐以色列的王位
  rationale: מעל כסא字面为“从以色列的宝座之上”；结合“不被断绝”的结构，指大卫后裔持续居于该王位。汉语以“坐……王位”清楚传达其意。
theological_decisions:
- issue: “永远”的应许与上下文中的条件性
  choice: 正文保留“永远”，不在本节内添加限制语
  alternative: 译作“世世代代”或在正文注明应许有条件
  rationale: לְעוֹלָם明确表达持续至永远；条件已由前一节说明，本节不应擅自弱化或补入解释。
- issue: 王朝应许中“不被剪除”的表达
  choice: 译为“你必不断有人坐以色列的王位”
  alternative: 直译为“属你的人必不从以色列的王位上被剪除”
  rationale: 所选译法表达同一王朝延续的语义，同时避免现代读者误解为某个人遭到暴力剪除；不进一步断定该应许的历史或弥赛亚实现方式。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“国位”兼顾王权与王朝含义；引语简洁，适合公开诵读。
