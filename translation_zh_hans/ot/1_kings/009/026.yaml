  text: וָ/אֳנִ֡י עָשָׂה֩ הַ/מֶּ֨לֶךְ שְׁלֹמֹ֜ה בְּ/עֶצְיֽוֹן גֶּ֨בֶר אֲשֶׁ֧ר אֶת אֵל֛וֹת עַל שְׂפַ֥ת יַם ס֖וּף בְּ/אֶ֥רֶץ אֱדֽוֹם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/026.yaml
  text: King Solomon also built a fleet of ships at Ezion-geber[a], which is beside Eloth on the shore of the Red Sea, in the land of Edom.
translation:
  language: zh_hans
  text: 所罗门王又在以旬·迦别建造了一支船队。以旬·迦别靠近以禄，位于以东地的红海[a]岸边。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文作“芦苇海”；传统译作“红海”。
    reason: 保留יַם־סוּף的字面含义及传统译名之间的差异。
lexical_decisions:
- source_word: וָאֳנִי
  choice: 又……一支船队
  rationale: אֳנִי在本语境中指船只组成的船队；前缀וָ以“又”承接上文。
- source_word: עָשָׂה
  choice: 建造了
  rationale: עָשָׂה基本义为“做、制造”，与船队连用时，现代汉语自然表达为“建造”。
- source_word: בְּעֶצְיוֹן גֶּבֶר
  choice: 在以旬·迦别
  rationale: 介词בְּ在此表示建造船队的地点；地名按通行中文形式音译，并以间隔号标明复合名称。
- source_word: אֲשֶׁר אֶת אֵלוֹת
  choice: 以旬·迦别靠近以禄
  rationale: 此处אֵת表达地点之间的邻近关系；“靠近”既自然，也不把两地视为同一地点。为避免中文关系从句冗长，另起一句并补出地名。
- source_word: עַל שְׂפַת יַם סוּף
  choice: 红海岸边
  rationale: שְׂפַת在水域语境中指边缘或岸边；יַם־סוּף采用中文传统且地理上易懂的“红海”，同时用脚注保留其字面译法。
- source_word: בְּאֶרֶץ אֱדוֹם
  choice: 位于以东地
  rationale: 保留原文“以东之地”的地域表达，并用“位于”使现代汉语地理说明清楚流畅。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。将希伯来文的长地点说明拆为两句，以提高可读性，同时保留船队、两座城、海岸及以东地之间的全部地理关系。
