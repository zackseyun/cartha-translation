  text: And it happened at the end of twenty years[b][a], in which Solomon had built the two houses—the house of Yahweh and the king's house—
translation:
  language: zh_hans
  text: 二十年期满[a]时，所罗门建成了两座建筑[b]——耶和华的殿和王宫——
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“过了二十年”。原文习语表示二十年这一时期已经结束。
    reason: lexical_alternative
  - marker: b
    text: 原文直译“那两座房屋”，下文说明是耶和华的殿和王宫。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: （以时间状语结构表达）
  rationale: 这里引出新的叙事时段，并与下节连成一句。现代汉语无需另译为“事情发生了”，以“二十年期满”起句更自然，也保留叙事承接作用。
- source_word: מִקְצֵה עֶשְׂרִים שָׁנָה
  choice: 二十年期满
  rationale: 该习语指二十年这一时期走到终点。“期满”简洁地表达期间完成，也不排除译作“过了二十年”。
- source_word: אֲשֶׁר
  choice: 在这期间
  rationale: 关系词在此把所罗门的建造活动与上述二十年相连。“在这期间”符合现代汉语表达，并避免生硬直译关系从句。
- source_word: בָּנָה
  choice: 建造了
  rationale: 该完成式陈述二十年期间的建造事实；汉语“了”自然表示事件已有整体性，但不额外断定两座建筑同时施工。
- source_word: שְׁנֵי הַבָּתִּים
  choice: 两座宫室
  rationale: בַּיִת本义为“房屋、宫室”，此处统指圣殿和王宫。“宫室”既保留二者同属“בית”的词语呼应，也比普通“房屋”更符合宏大建筑的语境。
- source_word: בֵּית יְהוָה
  choice: 耶和华的殿
  rationale: 直译结构为“耶和华的家/殿”。中文圣经语境中“殿”自然明确，且比“圣殿”少添一个原文没有的修饰语。
- source_word: בֵּית הַמֶּלֶךְ
  choice: 王宫
  rationale: 该短语字面为“王的宫室”；“王宫”是现代汉语中自然、准确的对应表达。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文读者熟悉的神名音译“耶和华”，明确将专名与一般称号“主”区分开。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用四字神名。中文正文采用历史悠久、普通读者最熟悉的专名译法“耶和华”；“雅威”更贴近学界常用的拟音，但不必据此取代成熟的中文形式。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。本节在希伯来文中是延续到下一节的时间框架，因此保留句末破折号，不把它改写成独立完整句。
