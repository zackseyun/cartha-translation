  text: And he said[a], “What are these cities that you have given me, my brother?” So he called them the land of Cabul to this day.
translation:
  language: zh_hans
  text: 他说：“我的兄弟啊，你给我的这些是什么城啊？”于是他把那些地方称为“迦步勒地”，直到今日。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “迦步勒”很可能是地名；这个希伯来词也可能含有贬义双关，或有“毫无价值”或“仿佛受束缚、受限制”之意。
    reason: lexical_alternative
lexical_decisions:
- source_word: מָה הֶעָרִים הָאֵלֶּה
  choice: 这些是什么城啊
  rationale: מָה在这里构成带有不满意味的质问；译为“这些是什么城啊”既保留直问形式，也以语气词自然传达希兰的嫌弃，而不额外解释。
- source_word: אֲשֶׁר נָתַתָּה לִּי
  choice: 你给我的
  rationale: 忠实表达已经完成且与眼前评价相关的赠与行为；现代汉语无需另加完成体标记。
- source_word: אָחִי
  choice: 我兄弟
  rationale: 保留第一人称所属关系及君王外交称呼的字面和关系色彩，不将其弱化为单纯敬称。
- source_word: וַיִּקְרָא לָהֶם
  choice: 于是他称那地方为
  rationale: קרא加介词ל表示称呼或命名。希伯来语的复数代词回指诸城，但后接单数“地”；汉语用“那地方”衔接更自然，同时不改变所指区域。
- source_word: אֶרֶץ כָּבוּל
  choice: 迦步勒之地
  rationale: כָּבוּל在此主要作为地名处理，采用传统且可辨识的音译“迦步勒”；“之地”保持庄重叙事语体。可能的贬义双关留在脚注中。
- source_word: עַד הַיּוֹם הַזֶּה
  choice: 直到今日
  rationale: 保留叙述者视角下的希伯来语时间公式，并符合现代中文圣经叙事语体。
