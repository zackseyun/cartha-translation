  text: וְ/זֶ֨ה דְבַר הַ/מַּ֜ס אֲשֶֽׁר הֶעֱלָ֣ה הַ/מֶּ֣לֶךְ שְׁלֹמֹ֗ה לִ/בְנוֹת֩ אֶת בֵּ֨ית יְהוָ֤ה וְ/אֶת בֵּית/וֹ֙ וְ/אֶת הַ/מִּלּ֔וֹא וְ/אֵ֖ת חוֹמַ֣ת יְרוּשָׁלִָ֑ם וְ/אֶת חָצֹ֥ר וְ/אֶת מְגִדּ֖וֹ וְ/אֶת גָּֽזֶר־־׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/015.yaml
  text: This is the account of the forced labor that King Solomon levied to build the house of Yahweh[a], his own house, the Millo, the wall of Jerusalem, Hazor, Megiddo[b], and Gezer.
translation:
  language: zh_hans
  text: 以下是所罗门王为建造雅威的殿、自己的宫殿、米罗[b]、耶路撒冷的城墙，以及夏琐、米吉多和基色而征调劳役[a]的记载。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “劳役”也可译作“劳役征调”，指国家强制征召百姓服劳役，并非征收货币税。
    reason: lexical_alternative
  - marker: b
    text: “米罗”可能是耶路撒冷一处防御工事或层叠的填土结构；这个希伯来词可能有“填土”之意，也可能指台地。
    reason: cultural_note
lexical_decisions:
- source_word: דְבַר
  choice: 记载
  rationale: 在“这是劳役之事”的结构中，该词引出对王室劳役工程的说明。“记载”比生硬的“事情”更符合现代汉语，同时保留其报告、说明的语气。
- source_word: הַמַּס
  choice: 劳役
  rationale: 此处指国家强制征调的劳动，而非货币税。“劳役”简洁、通行；其强制性质由动词“征调”及脚注说明。
- source_word: הֶעֱלָה
  choice: 征调
  rationale: עלה的使役式在此表示征收、征集劳役。“征调”自然表达王权为工程而调用人力的行政行为。
- source_word: לִבְנוֹת
  choice: 为建造
  rationale: 不定式表示目的，“为建造”在汉语中清楚连接征调劳役与各项工程。
- source_word: בֵּית יְהוָה
  choice: 雅威的殿
  rationale: “殿”在此自然指神的圣殿；专名“雅威”直接呈现四字神名，避免以称号代替原文专名。
- source_word: בֵּיתוֹ
  choice: 自己的宫殿
  rationale: 所指是所罗门的王宫建筑群。“自己的”保留与“雅威的殿”的对照，“宫殿”则避免现代读者误解为普通住宅。
- source_word: הַמִּלּוֹא
  choice: 米罗
  rationale: 这是耶路撒冷一处特定建筑或地形设施，其确切形态不能确定，因此采用音译，并在脚注中保留可能含义。
- source_word: חוֹמַת יְרוּשָׁלִָם
  choice: 耶路撒冷的城墙
  rationale: 直接、自然地表达原文的属格结构。
- source_word: חָצֹר
  choice: 夏琐
  rationale: 采用中文圣经传统中通行的地名译法。
- source_word: מְגִדּוֹ
  choice: 米吉多
  rationale: 采用中文圣经传统中通行的地名译法。
- source_word: גָּזֶר
  choice: 基色
  rationale: 采用中文圣经传统中通行的地名译法。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名。译作“雅威”旨在以现代汉语音译呈现这个专名，而不是用“主”等称号替代；“耶和华”是另一种历史悠久的中文音译。
- issue: “雅威的殿”中בַּיִת的语境含义
  choice: 殿
  alternative: 房屋
  rationale: 这里明确指为雅威建造的圣殿。“殿”是自然且准确的中文语境译法，同时不加入原文没有的宗派性解释。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。句子保留原文“这是……的记载”这一说明性结构，但按汉语习惯将目的短语前置。地名采用通行中文译名；对含义不确定的“米罗”不作武断解释，而以音译配合脚注。脚注标记分别紧随其实际说明对象“劳役”和“米罗”。
