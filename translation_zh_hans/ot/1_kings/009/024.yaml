base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/024.yaml
  text: But Pharaoh’s daughter went up from the City of David to her house that he had built for her[a]; then he built the Millo.
translation:
  language: zh_hans
  text: 不过，法老的女儿从大卫城上到所罗门为她建造的住所去；随后，所罗门修建了米罗[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “米罗”或可译作“填土工程”或“台地”；希伯来语所指的可能是一处防御工事，或以填土承托的台地结构。
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: 不过
  rationale: 此处承接并转折于上下文，用“不过”自然表达叙事中的转折或限定；不取“只是”，以免误加排他意味。
- source_word: בַּת פַּרְעֹה
  choice: 法老的女儿
  rationale: 忠实表达希伯来语的所属结构，也是现代汉语中自然明确的说法。
- source_word: עָלְתָה
  choice: 上到
  rationale: 保留 עלה 所表达的向上移动，可能反映耶路撒冷当地的地势。
- source_word: מֵעִיר דָּוִד
  choice: 从大卫城
  rationale: 保留专名及介词所表示的起点。
- source_word: אֶל בֵּיתָהּ
  choice: 到……为她建造的宫里
  rationale: בַּיִת 基本义为“房屋”，在王室语境中可指宫室；译作“宫”较符合人物身份和现代汉语表达，同时不具体限定其建筑性质。
- source_word: אֲשֶׁר בָּנָה לָהּ
  choice: 所罗门为她建造的
  rationale: 关系从句修饰前面的宫室。希伯来语只说“他”，汉语为避免与法老产生指代歧义，依上下文明确为所罗门；“建造的”本身已自然表示迁居前建成，无须另加完成体解释。
- source_word: אָז
  choice: 那时
  rationale: 表达叙事中的时间关联；相比“然后”，“那时”不强行断定严格的先后次序。
- source_word: בָּנָה
  choice: 修建了
  rationale: 按简单完成性叙述处理，不增译为“开始修建”。
- source_word: הַמִּלּוֹא
  choice: 米罗
  rationale: 该词可能是耶路撒冷一处特定防御或承托工程的名称，但具体建筑性质有争议，因此采用音译，并以脚注说明可能含义。
