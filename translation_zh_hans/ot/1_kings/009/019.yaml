base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/019.yaml
  text: also all the storage cities that belonged to Solomon[a], the chariot cities, the horsemen's cities, and whatever Solomon desired to build in Jerusalem, in Lebanon[c][b], and in all the land of his dominion.
translation:
  language: zh_hans
  text: 以及归所罗门所有的各仓储城[a]、战车城、骑兵城[b]，还有所罗门一心想要在耶路撒冷、黎巴嫩和他统治的全境建造的一切[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“储备城”或“供应城”。希伯来语指划作储藏物资或供应所需之用的城。
    reason: lexical_alternative
  - marker: b
    text: 或译“骑兵的城”。希伯来语在这里更具体地指骑马者或骑兵，而非泛指马匹。
    reason: lexical_alternative
  - marker: c
    text: 直译“所罗门的心愿，就是他所愿建造的”。希伯来语以同根名词和动词重复，强调所罗门强烈希望建造的项目。
    reason: lexical_alternative
lexical_decisions:
- source_word: עָרֵי הַמִּסְכְּנוֹת
  choice: 储备城
  rationale: 指划作储藏物资、供应所需之用的城邑；“储备城”在现代汉语中简明自然，也保留其行政和供应功能。
- source_word: אֲשֶׁר הָיוּ לִשְׁלֹמֹה
  choice: 所罗门所有的
  rationale: לְ 结构在此可表达归属或供其使用；“所罗门所有的”自然保留主要的归属含义。
- source_word: עָרֵי הָרֶכֶב
  choice: 战车城
  rationale: 指为战车部队及其设施而设的城，采用简洁而贴近原文结构的译法。
- source_word: עָרֵי הַפָּרָשִׁים
  choice: 骑兵城
  rationale: פָּרָשִׁים 更具体地指骑马者或骑兵，而非泛指马匹；“骑兵城”准确并与“战车城”形成对应。
- source_word: חֵשֶׁק שְׁלֹמֹה אֲשֶׁר חָשַׁק
  choice: 所罗门一心想要……的一切
  rationale: 原文以同根名词和动词构成强调。“一心想要”在现代汉语中自然传达强烈愿望，“一切”保留表达的广度。
- source_word: לִבְנוֹת
  choice: 建造
  rationale: 符合王室建筑工程语境，也是 בנה 在此处的常规译法。
- source_word: בִּירוּשָׁלִַם וּבַלְּבָנוֹן
  choice: 在耶路撒冷、黎巴嫩
  rationale: 按地点义直译；此处“黎巴嫩”可指所罗门开展建造活动的地区，不限定为黎巴嫩香柏木材料。
- source_word: בְּכֹל אֶרֶץ מֶמְשַׁלְתּוֹ
  choice: 在他统治的全境
  rationale: 兼顾 אֶרֶץ 的地域含义和 מֶמְשָׁלָה 的统治含义，现代汉语清楚自然。
