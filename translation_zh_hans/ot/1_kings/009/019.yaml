  register: 采用现代、庄重而易懂的书面汉语。经文承接上节的建造项目清单，因此以“以及”开头；并列项目使用“、”和“还有”梳理长句。“一心想要”传达原文同根重复的强调，而不在正文中保留生硬复沓。
