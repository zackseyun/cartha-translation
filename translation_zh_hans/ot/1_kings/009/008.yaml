source:
  edition: WLC
  text: וְ/הַ/בַּ֤יִת הַ/זֶּה֙ יִהְיֶ֣ה עֶלְי֔וֹן כָּל עֹבֵ֥ר עָלָ֖י/ו יִשֹּׁ֣ם וְ/שָׁרָ֑ק וְ/אָמְר֗וּ עַל מֶ֨ה עָשָׂ֤ה יְהוָה֙ כָּ֔כָה לָ/אָ֥רֶץ הַ/זֹּ֖את וְ/לַ/בַּ֥יִת הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/008.yaml
  text: And this house will become a ruin[a]. Everyone who passes by it will be appalled and will whistle, and they will say[b], ‘Why has Yahweh done thus to this land and to this house?’
translation:
  language: zh_hans
  text: 这殿必成为一片废墟[a]。凡从这殿经过的人都必惊骇，并发出尖锐的声音[b]。他们会问：“雅威为什么这样对待这片土地和这殿呢？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语按字面为“这殿必为高的（或崇高的）”。在本段审判的语境中，许多人认为这里是说它将沦为废墟，或成为令人惊骇的景象；参《历代志下》7:21。
    reason: textual_variant
  - marker: b
    text: 也可译作“吹口哨”或“发出嘘声”。这个希伯来语动词指人因惊异或嘲讽而发出尖锐的声音。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַבַּיִת הַזֶּה
  choice: 这殿
  rationale: בַּיִת本义为“房屋、家”，在本节特指为雅威建造的圣殿。译作“这殿”既符合现代汉语习惯，也保留本节前后两次出现该词的呼应。
- source_word: יִהְיֶה עֶלְיוֹן
  choice: 必成为一片废墟
  rationale: 马所拉文本按字面是“必为高的／崇高的”，但这在审判与荒凉的语境中意思突兀。结合历代对本句及《历代志下》7:21平行经文的理解，正文表达圣殿沦为废墟；原文的困难与歧义在脚注中明确保留。
- source_word: כָּל עֹבֵר עָלָיו
  choice: 凡从这里经过的人
  rationale: 这是指经过该处的每一个人。“凡……的人”自然表达כָּל的周遍意义；“这里”承接已经成为废墟的圣殿所在地。
- source_word: יִשֹּׁם
  choice: 都必惊骇
  rationale: 该动词在此表示面对毁灭景象时震惊、骇异的反应。“惊骇”兼具震惊与恐惧的语气。
- source_word: וְשָׁרָק
  choice: 并发出尖锐的口哨声
  rationale: 该动词表示因惊异或嘲讽而发出尖锐声音。“发出尖锐的口哨声”保留具体动作，并以脚注说明“发出嘘声”这一可能译法。
- source_word: וְאָמְרוּ
  choice: 他们会问
  rationale: 原文直译为“他们会说”，但后接直接问句；现代汉语用“会问”更自然，并未改变言语行为的内容。
- source_word: עַל מֶה
  choice: 为什么
  rationale: 该短语询问造成眼前审判结果的原因，现代汉语以“为什么”表达最自然。
- source_word: עָשָׂה יְהוָה כָּכָה
  choice: 雅威为什么这样对待
  rationale: עָשָׂה按字面是“做”，כָּכָה是“这样”。汉语“这样对待”自然表达雅威对土地和圣殿所施行之事，同时不另行解释其具体方式。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以“雅威”音译四字神名，保留其作为以色列之神专名的性质，不用头衔替代。
- source_word: לָאָרֶץ הַזֹּאת
  choice: 这片土地
  rationale: אֶרֶץ在这里指相关国土，而非整个地球；“这片土地”是自然、明确的现代汉语。
- source_word: וְלַבַּיִת הַזֶּה
  choice: 和这殿
  rationale: 与句首的בַּיִת一致译作“殿”，保留原文的重复和修辞呼应。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。音译为“雅威”保留启示给以色列的神之专名，避免用称号代替，也不借此加入任何宗派性解释。
- issue: 审判语境中עֶלְיוֹן的含义
  choice: 正文按语境译为“成为一片废墟”，脚注保留字面“高／崇高”
  alternative: 必为高耸的；必被高举
  rationale: 字面译法与紧接着的路人惊骇、发出尖锐声音的荒凉场景存在明显张力。正文采用语境上较可理解的废墟含义，但借脚注公开原文措辞，避免把文本困难无声消解。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“这殿”比“这房屋”更符合圣殿语境；“一片废墟”与“惊骇”清晰呈现审判场景。问句使用自然口语结构，但整体保持经文应有的凝练与尊严。
