  text: וַ/יְהִי֙ כְּ/כַלּ֣וֹת שְׁלֹמֹ֔ה לִ/בְנ֥וֹת אֶת בֵּית יְהוָ֖ה וְ/אֶת בֵּ֣ית הַ/מֶּ֑לֶךְ וְ/אֵת֙ כָּל חֵ֣שֶׁק שְׁלֹמֹ֔ה אֲשֶׁ֥ר חָפֵ֖ץ לַ/עֲשֽׂוֹת־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/001.yaml
  text: And it happened[a], when Solomon had finished building the house of Yahweh and the king’s house, and all that Solomon desired to make,
translation:
  language: zh_hans
  text: 所罗门建造完雅威的殿和王宫，并完成了他所想做的一切[a]之后，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“所罗门的一切心愿”，或“所罗门想完成的每一项工程”。
    reason: חֵשֶׁק可指“心愿、愿望”，也可指所盼望实现的事；在此结构中可理解为所罗门想要完成的一切，未必仅限于建筑工程。
lexical_decisions:
- source_word: וַיְהִי כְּכַלּוֹת
  choice: ……之后
  rationale: וַיְהִי与כְּ加不定式构成叙事过渡和时间从句，本句的主句延续到下一节。现代汉语用“……之后”自然地保留这一未完句式，无须生硬译出“事情发生了”。
- source_word: לִבְנוֹת
  choice: 建成了
  rationale: 该词本义为“建造”；与כְּכַלּוֹת（完成）连用时，译作“建成了”既表达建造行为，也体现工程已经完成。
- source_word: בֵּית יְהוָה
  choice: 雅威的殿
  rationale: בַּיִת字面为“房屋、殿宇”；此处指为雅威建造的圣殿，中文用“殿”既自然又保留与“王宫”的并列关系。神名יְהוָה音译为“雅威”。
- source_word: בֵּית הַמֶּלֶךְ
  choice: 王宫
  rationale: 字面是“王的房屋”，语境中指所罗门的王室宫殿；“王宫”是现代汉语准确自然的表达。
- source_word: כָּל חֵשֶׁק שְׁלֹמֹה
  choice: 他想做的一切
  rationale: חֵשֶׁק可指愿望、心愿或所渴望之物；结合后面的关系从句אֲשֶׁר חָפֵץ לַעֲשׂוֹת，译作“他想做的一切”通顺，并不把所指过度限定为建筑项目。
- source_word: חָפֵץ לַעֲשׂוֹת
  choice: 想做
  rationale: חָפֵץ表达愿意、喜爱或渴望，עָשָׂה可指做、制造或完成；“想做”保留其宽泛含义。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名。采用“雅威”作为现代汉语音译，以明确呈现专有神名，而不以称号替代。
- issue: בֵּית יְהוָה指建筑物还是神的家
  choice: 雅威的殿
  alternative: 雅威的家；雅威的圣殿
  rationale: 上下文明确涉及所罗门建造的圣殿。“殿”在现代汉语中自然且准确；未加入原文没有的“圣”字，也不引申为某种特定圣殿神学。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。本节在希伯来文中以时间从句开头，主句在下一节出现，因此译文以逗号收尾，保留跨节延续的句法。
