  text: וְ/אַתָּ֞ה אִם תֵּלֵ֣ךְ לְ/פָנַ֗/י כַּ/אֲשֶׁ֨ר הָלַ֜ךְ דָּוִ֤ד אָבִ֨י/ךָ֙ בְּ/תָם לֵבָ֣ב וּ/בְ/יֹ֔שֶׁר לַ/עֲשׂ֕וֹת כְּ/כֹ֖ל אֲשֶׁ֣ר צִוִּיתִ֑י/ךָ חֻקַּ֥/י וּ/מִשְׁפָּטַ֖/י תִּשְׁמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/004.yaml
  text: And as for you[a], if you walk before me as David your father walked, with integrity of heart and with uprightness, doing according to all that I have commanded you, and if you keep my statutes and my judgments[b],
translation:
  language: zh_hans
  text: 至于你，你若在我面前行事为人，像你父亲大卫那样，心里纯全[a]，秉行正直，照着我所吩咐你的一切而行，又谨守我的律例和典章[b]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “纯全”或译“完全的心”。这里强调内心的完整、忠诚和正直，并不一定表示绝对无罪。
    reason: lexical_alternative
  - marker: b
    text: “典章”或译“判例”或“法令”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתָּה
  choice: 至于你
  rationale: 突出话语转向所罗门本人，并保留轻微的强调和对比语气。
- source_word: אִם
  choice: 若
  rationale: 直接表达条件关系；语体庄重而不生硬。
- source_word: תֵּלֵךְ לְפָנַי
  choice: 在我面前行事为人
  rationale: 将希伯来语“行走在我面前”的生活行为隐喻自然转为现代汉语，同时保留人在上帝面前生活的含义。
- source_word: כַּאֲשֶׁר הָלַךְ דָּוִד אָבִיךָ
  choice: 像你父亲大卫一样
  rationale: 保留以大卫的行事方式为比较标准；前文“行事为人”已承载重复动词的意义，避免汉语赘复。
- source_word: בְּתָם לֵבָב
  choice: 心里纯全
  rationale: תָּם强调完整、专一和正直，不必指绝对无罪；“纯全”兼顾传统经文语感与原词含义。
- source_word: וּבְיֹשֶׁר
  choice: 秉持正直
  rationale: 表达道德上的正直端方，并与“心里纯全”形成自然的汉语并列。
- source_word: לַעֲשׂוֹת כְּכֹל אֲשֶׁר צִוִּיתִיךָ
  choice: 照我所吩咐你的一切去做
  rationale: 保留כְּכֹל的全面性，也清楚连接内在品格与顺服行动。
- source_word: חֻקַּי
  choice: 我的律例
  rationale: 采用盟约与法律语境中清楚、通行的译法，并与后面的מִשְׁפָּטַי有所区别。
- source_word: וּמִשְׁפָּטַי
  choice: 和典章
  rationale: 表达具有裁断、规范或条例性质的规定；“典章”在中文圣经语域中庄重且能与“律例”区分。
- source_word: תִּשְׁמֹר
  choice: 谨守
  rationale: 准确表达盟约语境中遵守、持守的意思；“谨”也传达认真守行的语气。
theological_decisions:
- issue: 如何描述大卫作为榜样
  choice: 译为“心里纯全，秉持正直”，不暗示大卫绝对无罪。
  alternative: 译为“有无可指摘的心”或“心里完全”。
  rationale: 本节称许大卫对上帝忠诚、专一的整体取向，却未宣称他在每件事上都毫无罪过；“纯全”保留这种肯定及经文中的神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“行事为人”自然传达希伯来语以“行走”比喻生活方式的惯用表达。本节的条件句延续至下一节，因此句末保留逗号，不擅自补成完整结句。
