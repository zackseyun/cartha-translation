  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֵלָ֗י/ו שָׁ֠מַעְתִּי אֶת תְּפִלָּתְ/ךָ֣ וְ/אֶת תְּחִנָּתְ/ךָ֮ אֲשֶׁ֣ר הִתְחַנַּ֣נְתָּה לְ/פָנַ/י֒ הִקְדַּ֗שְׁתִּי אֶת הַ/בַּ֤יִת הַ/זֶּה֙ אֲשֶׁ֣ר בָּנִ֔תָה לָ/שֽׂוּם שְׁמִ֥/י שָׁ֖ם עַד עוֹלָ֑ם וְ/הָי֨וּ עֵינַ֧/י וְ/לִבִּ֛/י שָׁ֖ם כָּל הַ/יָּמִֽים־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/003.yaml
  text: And Yahweh said to him[a], “I have heard your prayer and your plea for favor that you made before me. I have consecrated this house that you built, to put my name there forever[c][b], and my eyes and my heart will be there all the days.”
translation:
  language: zh_hans
  text: 耶和华对他说：“你在我面前所作的祷告和恳求，我已经听见了。我已将你建造的这殿分别为圣，把我的名安置在那里，直到永远；我的眼目和我的心也必常在那里。[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “我的眼目和我的心也必常在那里”是拟人化的说法，表达耶和华持续的看顾和关切。
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的专名形式，明确呈现希伯来文中的神圣名号，而不以“主”替代。
- source_word: שָׁמַעְתִּי
  choice: 我已经听见了
  rationale: 完成体表示听见这一行动已经发生，而当前答复突显其现今效力。
- source_word: תְּפִלָּתְךָ וְאֶת־תְּחִנָּתְךָ
  choice: 你的祷告和恳求
  rationale: 保留两个并列名词；“恳求”体现 תְּחִנָּה 谦卑求恩的意味，并与一般性的“祷告”有所区别。
- source_word: אֲשֶׁר הִתְחַנַּנְתָּה לְפָנַי
  choice: 你在我面前所作的
  rationale: 以自然中文连接前述“祷告和恳求”，同时保留 לְפָנַי 的临在性表达“在我面前”。
- source_word: הִקְדַּשְׁתִּי
  choice: 我已……分别为圣
  rationale: 表达把殿分别出来归于神圣用途的使役意义，并保留礼仪及神学色彩。
- source_word: הַבַּיִת הַזֶּה
  choice: 这殿
  rationale: בַּיִת 本义为“房屋”，但在所罗门建造的具体语境中，现代中文以“殿”既自然又准确，且没有超出所指对象。
- source_word: לָשׂוּם שְׁמִי שָׁם
  choice: 使我的名……立在那里
  rationale: 保留“名”与地点相联的圣殿公式；“立在那里”自然呈现 שׂוּם 的安置含义，而不改写成神亲自居住或受敬拜。
- source_word: עַד־עוֹלָם
  choice: 永远
  rationale: 直接呈现该时间表达的持久性，不在译文中预先限定其神学范围。
- source_word: עֵינַי וְלִבִּי
  choice: 我的眼和我的心
  rationale: 照原文保留拟人化意象，不将其解释性地化约为“关注和眷顾”。
- source_word: כָּל־הַיָּמִים
  choice: 常
  rationale: 现代中文中自然表达“所有日子、始终不断”的意思，避免生硬直译“所有的日子”。
theological_decisions:
- issue: “我的眼和我的心”对神的拟人化描述
  choice: 在正文中按意象直译，并用脚注说明其功能
  alternative: 意译为“我的关注和眷顾”
  rationale: 原文有意使用身体和内在意志的形象，表达耶和华持续的看顾与关切；保留这一张力比在正文中消解它更忠实。
- issue: “使我的名永远立在那里”的圣殿—圣名公式
  choice: 保留“我的名”这一原文表述
  alternative: 扩译为“使我永远住在那里”或“使人在那里永远敬拜我”
  rationale: 原文说的是安置神的名，并未直接等同于神受空间限制地居住其中；译文不加入相关但更具解释性的教义表述。
- issue: עַד־עוֹלָם 与 כָּל־הַיָּמִים 的时间力度
  choice: 分别译为“永远”和“常”
  alternative: 按后续圣殿历史将其条件化为“长久”
  rationale: 本节本身使用强烈、持久的时间语言；其与后文条件和审判警告之间的张力应由经文本身保留，而不在本节先行弱化。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“祷告和恳求”保留词义层次；“分别为圣”“使我的名……立在那里”保留圣殿语汇及原文神学意象。正文只设置一个确有解释需要的脚注，标记已置于相关句末。
