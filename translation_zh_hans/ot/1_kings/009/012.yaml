base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/012.yaml
  text: So Hiram went out from Tyre to see the cities that Solomon had given him[a], but they were not pleasing in his eyes.
translation:
  language: zh_hans
  text: 希兰从推罗出来，去看所罗门给他的那些城；但这些城不合他的心意[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“可是，这些城并不使他满意。”希伯来语习语直译为“它们在他眼中并不合适”。
    reason: 说明“在他眼中”这一希伯来语习语，并提供自然的直白译法；“不合适”保留原文可接受性／称心与否的语义，避免主要理解为道德上的“不正”。
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: 出来
  rationale: יצא表示出去、离开；“从推罗出来”保留了动作方向和出发地点，又不额外推断希兰的动机。
- source_word: מִצֹּר
  choice: 从推罗
  rationale: 介词מִן表示来源或起点；“从推罗”是自然、准确的现代汉语表达。
- source_word: לִרְאוֹת
  choice: 要看看
  rationale: ראה的基本义是“看”。此处语境可能含有察看之意，但“看看”保留原文较宽泛的含义，避免强化为正式“视察”。
- source_word: הֶעָרִים
  choice: 那些城
  rationale: עִיר可指城或城镇；“那些城”承接后面的关系从句，现代汉语自然，也保留其复数所指。
- source_word: אֲשֶׁר נָתַן לוֹ שְׁלֹמֹה
  choice: 所罗门给他的
  rationale: 关系从句限定前面的城；汉语以“所罗门给他的那些城”自然表达赠予先于察看的叙事关系，无须另加时态标记。
- source_word: וְלֹא יָשְׁרוּ בְּעֵינָיו
  choice: 这些城却不合他的心意
  rationale: ישר בעיני是“在某人眼中合宜、称心”的习语。译作“不合他的心意”清楚表达希兰对这些城不满意，同时脚注保留原文含“眼中”的形象。
theological_decisions: []
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“要看看”保持原文ראה的普通观察义；“不合他的心意”传达习语的实际含义，原文意象则在脚注中说明。分号体现察看与负面评价之间的转折。
