  text: And Hiram sent his servants on the ship with Solomon’s servants—men of ships, men who knew the sea.
translation:
  language: zh_hans
  text: 希兰派遣他的仆人乘船，与所罗门的仆人同行；他的仆人都是熟悉海上航行的船员。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָּאֳנִי
  choice: 上船
  rationale: 介词短语直译可作“在船上”，但在“派……去”的语境中，现代汉语用“上船”更自然，也保留随船出行之意。
- source_word: אַנְשֵׁי אֳנִיּוֹת
  choice: 水手
  rationale: 字面为“船只之人”，指有船上工作经验的人员；译作“水手”简洁自然。
- source_word: יֹדְעֵי הַיָּם
  choice: 熟悉航海的
  rationale: 字面为“熟悉海的人”；此处所指是具备海上航行知识与经验，而非仅仅认识海洋。
- source_word: עִם עַבְדֵי שְׁלֹמֹה
  choice: 与所罗门的仆人同去
  rationale: 补出“同去”使汉语句意完整，同时不增加原文之外的行动内容。
