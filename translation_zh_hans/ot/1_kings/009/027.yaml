  source_fidelity: 原文说希兰把自己的仆人派在船上／随船而去，与所罗门的仆人同在；并将希兰的仆人进一步说明为“船只之人、熟悉海的人”。修订明确这两个职业性描述所限定的是希兰的仆人，且保留与所罗门仆人同行的关系。
