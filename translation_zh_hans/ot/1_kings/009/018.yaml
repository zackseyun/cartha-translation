  text: and Baalath[a], and Tamar in the wilderness, in the land.
translation:
  language: zh_hans
  text: 又建造了巴拉，以及那地旷野中的他玛[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文本作“他玛”；《历代志下》8:4的平行经文作“达莫”。
    reason: textual_variant
lexical_decisions:
- source_word: וְ/אֶת
  choice: 又建造了
  rationale: אֵת是直接宾语标记，不另译；וְ承接上文的建城清单。为使本节片段在现代汉语中自然通顺，从上文补出省略的谓语“建造了”。
- source_word: בַּעֲלָת
  choice: 巴拉
  rationale: 专有地名按希伯来语音译，不按其词源含义意译。
- source_word: תמר
  choice: 他玛
  rationale: 马所拉文本的辅音为תמר，依本文音译作“他玛”；《历代志下》8:4的平行经文作“达莫”，该异文保留在脚注中。
- source_word: בַּ/מִּדְבָּר
  choice: 旷野中的
  rationale: מִדְבָּר指旷野或荒漠地带；“旷野”既符合常用圣经语汇，也适合此处的地理说明。
- source_word: בָּ/אָֽרֶץ
  choice: 境内
  rationale: אֶרֶץ在此表示所属地域。译作“境内”可自然表达地点关系，同时不擅自明确其究竟指哪一片土地。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事用语。因本节在希伯来文中承接上文、没有重述谓语，汉语正文补出“建造了”；将“在旷野，在那地”整合为“境内旷野中的”，避免生硬重复，同时保留地理关系及指代的开放性。
