base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/011.yaml
  text: Hiram king of Tyre had supplied Solomon with cedar timber[a], cypress timber, and gold, according to all his desire; then King Solomon gave Hiram twenty cities in the land of Galilee.
translation:
  language: zh_hans
  text: 推罗王希兰曾按所罗门一切所愿，供应给所罗门香柏木、柏木[a]和金子；那时，所罗门王把加利利境内二十座城给了希兰。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “柏木”所译的希伯来词所指树种不能确定，也可能是圆柏、冷杉或另一种针叶树。
    reason: lexical_alternative
lexical_decisions:
- source_word: נִשָּׂא
  choice: 曾……供应他
  rationale: 该动词通常表示“举起、携带、承担”，但此处以所罗门为宾语，并用介词ב引出各种材料，语境义为希兰向所罗门供应资源。“曾”体现这项供应是后面赠城事件的背景。
- source_word: בַּעֲצֵי אֲרָזִים
  choice: 香柏木
  rationale: עֵץ与树种名称构成短语时，在建筑语境中指木材；“香柏木”是现代中文圣经语体中清楚且通行的表达。
- source_word: וּבַעֲצֵי בְרוֹשִׁים
  choice: 柏木[a]
  rationale: בְּרוֹשׁ所指的具体针叶树种不能确定；正文采用简洁、通行的“柏木”，并以脚注保留其他可能。
- source_word: וּבַזָּהָב
  choice: 和金子
  rationale: 直接表达原文的材料名称，不作扩充。
- source_word: לְכָל חֶפְצוֹ
  choice: 照所罗门一切所要的
  rationale: חֵפֶץ可指愿望、喜好或所欲之物；结合供应材料的语境，“一切所要的”自然表达其范围。明确使用“所罗门”以避免中文代词指向含混。
- source_word: אָז יִתֵּן
  choice: 那时……给了
  rationale: אָז是时间或次序标记；יִתֵּן虽为未完成式形态，在此叙事语境中表示过去发生的行动。
- source_word: עֶשְׂרִים עִיר
  choice: 二十座城
  rationale: עִיר可指城或城镇；“座”符合现代汉语量词习惯，“城”保留其政治地理意味。
- source_word: בְּאֶרֶץ הַגָּלִיל
  choice: 加利利境内
  rationale: אֶרֶץ在此可表示土地或地区；“境内”自然地表达这些城位于加利利地区，同时不额外界定其行政性质。
- source_word: חִירָם / שְׁלֹמֹה / צֹר / הַגָּלִיל
  choice: 希兰 / 所罗门 / 推罗 / 加利利
  rationale: 采用现代中文圣经及一般中文语境中通行的人名、地名译法。
