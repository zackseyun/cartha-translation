  text: וּ/מִ/בְּנֵי֙ יִשְׂרָאֵ֔ל לֹֽא נָתַ֥ן שְׁלֹמֹ֖ה עָ֑בֶד כִּי הֵ֞ם אַנְשֵׁ֣י הַ/מִּלְחָמָ֗ה וַ/עֲבָדָי/ו֙ וְ/שָׂרָ֣י/ו וְ/שָׁלִשָׁ֔י/ו וְ/שָׂרֵ֥י רִכְבּ֖/וֹ וּ/פָרָשָֽׁי/ו־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/022.yaml
  text: But from the sons of Israel Solomon made no slaves[a], for they were the men of war, his slaves, his commanders, his officers, and the commanders of his chariots and his horsemen.
translation:
  language: zh_hans
  text: 但所罗门没有使以色列人作奴隶，因为他们是战士、他的臣仆、将领、军官，以及他战车部队的将领和骑兵。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּמִבְּנֵי יִשְׂרָאֵל
  choice: 但……以色列人
  rationale: וּ在此承接上文并形成对比；中文以“但”自然表达。בני ישראל按现代汉语译为“以色列人”，避免生硬的“以色列之子”。
- source_word: לֹא נָתַן שְׁלֹמֹה עָבֶד
  choice: 所罗门没有把……立为奴隶
  rationale: 直译其使役性结构“没有使/置为奴隶”；עָבֶד为单数集合用法。译文保留奴役身份，不弱化为一般劳役或仆役。
- source_word: אַנְשֵׁי הַמִּלְחָמָה
  choice: 战士
  rationale: 指从事战争的人员；现代中文“战士”简洁、自然，并准确传达军事身份。
- source_word: וַעֲבָדָיו
  choice: 他的臣仆
  rationale: 同一词根עבד在王室人员清单中指服事君王的人，而非前半句所说被立为奴隶的社会身份。“臣仆”保留服属关系，也符合王室语境。
- source_word: וְשָׂרָיו
  choice: 将领
  rationale: שׂר可指首领或官长；在军事人员清单中译为“将领”最合语境。
- source_word: וְשָׁלִשָׁיו
  choice: 军官[a]
  rationale: שָׁלִישׁ所指的确切古代军职有争议，可能是高级军事副官或与战车有关的军官；正文用宽泛而清楚的“军官”，脚注保留不确定性。
- source_word: וְשָׂרֵי רִכְבּוֹ
  choice: 战车长
  rationale: 指统领其战车或战车部队的人。“战车长”简明地表达领导职分。
- source_word: וּפָרָשָׁיו
  choice: 骑兵
  rationale: 指骑马作战者；“骑兵”是现代中文中自然、准确的军事称谓。
theological_decisions:
- issue: עָבֶד在本节前后两处的语境意义
  choice: 前者译“奴隶”，后者译“臣仆”
  alternative: 两处均译“奴仆”或“仆人”
  rationale: 前一处与上文强迫服役的非以色列人形成对照，涉及被置于奴役地位；后一处属于王室和军事职分清单，可指君王的臣属。按各自语境区分，既不淡化奴役，也不把王室臣属误解为奴隶。
- issue: אַנְשֵׁי הַמִּלְחָמָה的性别表达
  choice: 战士
  alternative: 作战的男子
  rationale: 希伯来语为语法上的阳性复数，历史语境中的这些军事职分通常由男性担任；但现代汉语“战士”本身自然对应这一称谓，无需加入原文未明说的“男子”。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。“立为奴隶”较“使作奴隶”自然，又保留身份改变的含义；职衔按军事语境依次处理，避免古奥或过度技术化。
