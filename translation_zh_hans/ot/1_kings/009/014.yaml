  text: 希兰送给王一百二十他连得的金子[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “他连得”是古代一种很大的重量单位；这里指一百二十他连得重的金子。
    reason: cultural_note
  - marker: b
    text: 或译：“给所罗门王”；希伯来文只说“给王”。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: 送给
  rationale: 该叙事形式在这里表示承接前文的过去动作；结合间接宾语“给王”和所送之物，译作“送给”自然准确。
- source_word: חִירָם
  choice: 希兰
  rationale: 按现代中文圣经人名的通行音译处理。
- source_word: לַמֶּלֶךְ
  choice: 给王
  rationale: 希伯来文直译为“给那王”，上下文所指是所罗门；正文保留原文未明说姓名的表达。
- source_word: מֵאָה וְעֶשְׂרִים
  choice: 一百二十
  rationale: 直接表达原文的基数。
- source_word: כִּכַּר
  choice: 他连得
  rationale: 这是古代的大重量单位；采用中文圣经中较为通行的音译，并以脚注说明其性质。
- source_word: זָהָב
  choice: 金子
  rationale: 该名词指黄金；“一百二十他连得金子”自然表达按重量计量的黄金。
