base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/028.yaml
  text: They went to Ophir and took from there four hundred and twenty talents of gold[a], and brought it to King Solomon.
translation:
  language: zh_hans
  text: 他们到了俄斐，从那里取得四百二十他连得金子[a]，带到所罗门王那里。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “他连得”是古代的重量单位；实际重量因时代和地区而异。四百二十他连得约合十四吨。
    reason: 说明古代计量单位，并提供便于现代读者理解的近似换算，同时保留其不确定性。
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: 他们到了
  rationale: בוא的基本意义是“来、到达”；在本句以目的地“俄斐”为补语，现代汉语用“到了俄斐”自然表达抵达，不必按叙事视角改作“去了”。
- source_word: אוֹפִירָה
  choice: 俄斐
  rationale: 地名带方向词尾־ָה，方向意义已由“到了”体现；“俄斐”采用通行中文译名。
- source_word: וַיִּקְחוּ מִשָּׁם
  choice: 从那里取得
  rationale: 保留介词מִן所表达的来源；לקח在获取金子的语境中译作“取得”比字面“拿取”更自然，同时不额外断定其获取方式。
- source_word: זָהָב
  choice: 金子
  rationale: 这是זָהָב的常用现代汉语表达，适合叙事语体。
- source_word: אַרְבַּע מֵאוֹת וְעֶשְׂרִים כִּכָּר
  choice: 四百二十他连得
  rationale: 准确保留数量，并将古代重量单位כִּכָּר音译为“他连得”；脚注说明其性质及约量，避免用现代单位取代原文。
- source_word: וַיָּבִאוּ
  choice: 带到
  rationale: 使役式בוא意为“带来、送到”；“带到……那里”在现代汉语中清楚表达金子被运至所罗门处。
- source_word: אֶל הַמֶּלֶךְ שְׁלֹמֹה
  choice: 所罗门王那里
  rationale: 按现代汉语习惯将王号置于名字之后，并与“带到”搭配为自然的处所表达。
