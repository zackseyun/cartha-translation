  text: פַּרְעֹ֨ה מֶֽלֶךְ מִצְרַ֜יִם עָלָ֗ה וַ/יִּלְכֹּ֤ד אֶת גֶּ֨זֶר֙ וַ/יִּשְׂרְפָ֣/הּ בָּ/אֵ֔שׁ וְ/אֶת הַֽ/כְּנַעֲנִ֛י הַ/יֹּשֵׁ֥ב בָּ/עִ֖יר הָרָ֑ג וַֽ/יִּתְּנָ/הּ֙ שִׁלֻּחִ֔ים לְ/בִתּ֖/וֹ אֵ֥שֶׁת שְׁלֹמֹֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/016.yaml
  text: Pharaoh king of Egypt had gone up and captured Gezer and burned it with fire[a], and he killed the Canaanites who lived in the city, and gave it as a dowry to his daughter, Solomon’s wife.
translation:
  language: zh_hans
  text: 埃及王法老先前曾上来攻取基色，用火焚烧了城，又杀死城里的迦南人，然后把基色作为嫁妆[a]送给女儿，就是所罗门的妻子。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“作为出嫁礼物”。希伯来语指与婚嫁有关的赠礼，其具体社会习俗含义未必与现代汉语所说的“嫁妆”完全相同。
    reason: lexical_alternative
lexical_decisions:
- source_word: עָלָה
  choice: 先前曾上来
  rationale: 保留“上来”这一军事行动的希伯来语表达；“先前曾”表明本句是在交代所罗门建造基色以前发生的事。
- source_word: וַיִּלְכֹּד אֶת־גֶּזֶר
  choice: 攻取基色
  rationale: לכד在攻城语境中指夺取、攻占；“攻取”简洁地呈现军事征服。
- source_word: וַיִּשְׂרְפָהּ בָּאֵשׁ
  choice: 用火焚烧了城
  rationale: 明确译出בָּאֵשׁ“用火”，并将阴性代词所指的基色自然表达为“城”。
- source_word: הַכְּנַעֲנִי הַיֹּשֵׁב בָּעִיר
  choice: 城里的迦南人
  rationale: 原文“迦南人”为集合性单数；现代汉语可用不标数的“迦南人”自然涵盖城中居民。
- source_word: הָרָג
  choice: 杀死
  rationale: 直接传达הרג的含义，不添加原文没有说明的方式或范围。
- source_word: וַיִּתְּנָהּ
  choice: 把基色……送给
  rationale: 将阴性后缀的指代“基色”明说，以免汉语中的“它”产生歧义；“送给”符合婚姻礼物的语境。
- source_word: שִׁלֻּחִים
  choice: 作为嫁妆
  rationale: 此词在这里指女儿出嫁时由父亲给出的婚姻相关财物；“嫁妆”是自然且最贴近情境的现代汉语，但以脚注保留其社会习俗含义并不完全确定。
- source_word: לְבִתּוֹ אֵשֶׁת שְׁלֹמֹה
  choice: 送给女儿，就是所罗门的妻子
  rationale: 保留同位语结构，清楚说明法老的女儿正是所罗门的妻子。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“先前曾”承接上下文中的回顾说明；“用火焚烧”保留原文略带强调的措辞。脚注标记紧随其所解释的“嫁妆”，避免误指“用火焚烧”。
