id: 1KI.9.6
reference: 1 Kings 9:6
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: אִם שׁ֨וֹב תְּשֻׁב֜וּ/ן אַתֶּ֤ם וּ/בְנֵי/כֶם֙ מֵֽ/אַחֲרַ֔/י וְ/לֹ֤א תִשְׁמְרוּ֙ מִצְוֺתַ֣/י חֻקֹּתַ֔/י אֲשֶׁ֥ר נָתַ֖תִּי לִ/פְנֵי/כֶ֑ם וַ/הֲלַכְתֶּ֗ם וַ/עֲבַדְתֶּם֙ אֱלֹהִ֣ים אֲחֵרִ֔ים וְ/הִשְׁתַּחֲוִיתֶ֖ם לָ/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/006.yaml
  text: But if you or your sons turn away from following me[a], and do not keep my commandments and my statutes that I have set before you, and go and serve other gods and bow down to them,
translation:
  language: zh_hans
  text: 但你和你的子孙若执意转离，不再跟从我[a]，不遵守我摆在你们面前的诫命和律例，反而去侍奉别的神，向它们下拜，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “你和你的子孙若……”也可按这项警告对每一方的适用方式理解为“你或你的子孙若……”。原文直译为“你们和你们的众子”。
    reason: 说明希伯来语并列措辞与条件性、王朝性范围之间的真实歧义。
lexical_decisions:
- source_word: אִם
  choice: 若
  rationale: 引出条件从句；结合上下文以“但……若”体现与前文应许相对的警告。
- source_word: שׁוֹב תְּשֻׁבוּן
  choice: 执意转离
  rationale: 不定式绝对形与限定动词连用，强化“转离”的动作；“执意”自然表达其强调意味，而“转离”结合后面的“离开跟从我”表示背道。
- source_word: אַתֶּם וּבְנֵיכֶם
  choice: 你和你的子孙
  rationale: 原文直指所罗门及其“众子”；在王朝语境中，“子孙”自然涵盖后继王系，同时保留并列形式及其条件范围。
- source_word: מֵאַחֲרַי
  choice: 不再跟从我
  rationale: 这是盟约语境中停止跟随耶和华的惯用表达；与“转离”连用，中文译为“转离，不再跟从我”清楚自然。
- source_word: וְלֹא תִשְׁמְרוּ
  choice: 不遵守
  rationale: שׁמר用于诫命时指谨守、遵行；现代中文用“不遵守”准确明白。
- source_word: מִצְוֺתַי חֻקֹּתַי
  choice: 我的诫命和律例
  rationale: 分别保留两个法律—盟约术语，避免合并其语义。
- source_word: אֲשֶׁר נָתַתִּי לִפְנֵיכֶם
  choice: 我摆在你们面前的
  rationale: נתן与לִפְנֵי连用意为置于、陈明在某人面前；“摆在……面前”保留原文具体意象。
- source_word: וַהֲלַכְתֶּם
  choice: 反而去
  rationale: הלך在此引出后续背道行为；“去侍奉”符合现代汉语，“反而”体现上下文中不守诫命与拜别神的转折，但不另增实质内容。
- source_word: וַעֲבַדְתֶּם אֱלֹהִים אֲחֵרִים
  choice: 侍奉别的神
  rationale: עבד译为“侍奉”，与随后表示俯伏的动词区分开来。
- source_word: וְהִשְׁתַּחֲוִיתֶם לָהֶם
  choice: 向它们下拜
  rationale: 保留俯伏、下拜的具体动作，也与前面的“侍奉”形成原文中的双重描述。
theological_decisions:
- issue: 警告所涵盖的王朝范围
  choice: 译作“你和你的子孙”，理解为所罗门及其王室后裔共同处于条件警告之下。
  alternative: 译作“你或你的子孙”，突出所罗门或其后裔任何一方背离都触发警告。
  rationale: 原文表层连接词是“和”，王室语境使“众子”指向所罗门的后继王系。正文保留希伯来语并列结构，不把其条件适用方式明确改成析取；脚注说明可按条件分配理解。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“诫命、律例、侍奉、下拜”保留经文的盟约与敬拜语域；句末逗号保留本节作为后续结果从句前件的未完结构。
