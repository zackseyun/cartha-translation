  text: 所罗门修建了基色和下伯和仑。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“较低处的伯和仑。”
    reason: 保留בֵּית חֹרֹן תַּחְתּוֹן较为直译的表达方式；正文将其作为地名译为“下伯和仑”。
lexical_decisions:
- source_word: וַיִּבֶן
  choice: 修建了
  rationale: בנה的Qal叙事形式通常表示“建造”。在王室工程语境中，也可能包括重建或加固，但原文没有明确使用“设防”的专门词语，因此正文采用涵盖面较宽的“修建了”。
- source_word: שְׁלֹמֹה
  choice: 所罗门
  rationale: 采用现代中文圣经中通行的人名译法。
- source_word: גָּזֶר
  choice: 基色
  rationale: 采用现代中文圣经中通行的地名译法。
- source_word: בֵּית חֹרֹן תַּחְתּוֹן
  choice: 下伯和仑
  rationale: תַּחְתּוֹן意为“下方的、较低的”，用来区分两处伯和仑；“下伯和仑”是自然、简洁且通行的中文地名表达。
- source_word: אֶת / וְאֶת
  choice: 不单独译出
  rationale: 二者是直接宾语标记，其语法功能已由中文句法体现。
