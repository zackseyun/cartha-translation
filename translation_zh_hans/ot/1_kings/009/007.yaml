id: 1KI.9.7
reference: 1 Kings 9:7
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/הִכְרַתִּ֣י אֶת יִשְׂרָאֵ֗ל מֵ/עַ֨ל פְּנֵ֤י הָ/אֲדָמָה֙ אֲשֶׁ֣ר נָתַ֣תִּי לָ/הֶ֔ם וְ/אֶת הַ/בַּ֨יִת֙ אֲשֶׁ֣ר הִקְדַּ֣שְׁתִּי לִ/שְׁמִ֔/י אֲשַׁלַּ֖ח מֵ/עַ֣ל פָּנָ֑/י וְ/הָיָ֧ה יִשְׂרָאֵ֛ל לְ/מָשָׁ֥ל וְ/לִ/שְׁנִינָ֖ה בְּ/כָל הָ/עַמִּֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/007.yaml
  text: then I will cut off Israel from the face of the land that I have given them[a], and the house that I have consecrated for my name I will cast out from before my face[d][c][b], and Israel will become a proverb and a taunt among all peoples.
translation:
  language: zh_hans
  text: 我就要把以色列从我赐给他们的土地上剪除；至于我为自己的名[c]所分别为圣的这殿[a]，我也要把它从我面前丢弃[b]。以色列必在万民中成为谚语和讥诮的话。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“这房屋”，这里指圣殿。
    reason: lexical_alternative
  - marker: b
    text: 或译：“从我面前遣走。”这里的“从我面前”也可理解为“离开我的临在”。
    reason: lexical_alternative
  - marker: c
    text: “为自己的名”是希伯来语表达，指这殿被献上，归于上帝并尊崇他的名。
    reason: cultural_note
lexical_decisions:
- source_word: וְהִכְרַתִּי
  choice: 我就要……剪除
  rationale: 使役形的 כרת 表示剪除、除去。这里保留盟约审判的力度，却不把含义扩大为彻底灭绝。
- source_word: מֵעַל פְּנֵי הָאֲדָמָה אֲשֶׁר נָתַתִּי לָהֶם
  choice: 从我赐给他们的土地上
  rationale: אֲדָמָה 在此指上帝赐给以色列的土地；汉语省去“土地的表面”这一不自然的直译，同时保留被逐离所赐之地的意思。
- source_word: הַבַּיִת
  choice: 这殿
  rationale: 原词直译为“房屋”，在本段明确指圣殿；“这殿”在现代汉语中自然明确，并以脚注保留原文措辞。
- source_word: הִקְדַּשְׁתִּי לִשְׁמִי
  choice: 我为自己的名分别为圣
  rationale: 保留“为我的名”这一贯穿《列王纪》的表达，并用“分别为圣”准确表达使之归为圣、专供神圣用途。
- source_word: אֲשַׁלַּח מֵעַל פָּנָי
  choice: 我也要把它从我面前丢弃
  rationale: שׁלח 可指送走或遣走；结合“从我面前”，此处表达拒绝和摒弃。“丢弃”在汉语中传达其审判力度，同时脚注保留较弱的可能译法。
- source_word: לְמָשָׁל וְלִשְׁנִינָה
  choice: 成为谚语和讥诮的话
  rationale: 分别保留 מָשָׁל 的“谚语、流传的话”和 שְׁנִינָה 的嘲弄含义，避免把两个词合并成单一概念。
- source_word: בְּכָל הָעַמִּים
  choice: 在万民中
  rationale: עַמִּים 指众民族或众民；“万民”简洁、庄重，也避免现代民族国家的联想。
theological_decisions:
- issue: 盟约审判是否意味着彻底灭绝
  choice: 把以色列从……土地上剪除
  alternative: 把以色列从这地消灭
  rationale: “剪除”既保留审判的严厉，也不超出原文断言以色列将被逐离所赐土地的范围。
- issue: הַבַּיִת 应译作“房屋”还是“圣殿”
  choice: 这殿
  alternative: 这房屋
  rationale: 原词是“房屋”，但上下文所指明确是圣殿。“这殿”对现代读者更自然，而脚注保留原文的字面表达及其神学意象。
- issue: “为我的名”是否应解释性改写
  choice: 为自己的名分别为圣
  alternative: 分别为圣、使它承载并尊崇我的名
  rationale: 正文保留希伯来语的重要表达，不把其含义缩窄为某一种解释；脚注说明该习语的基本文化含义。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“剪除”“分别为圣”保留经文的盟约与礼仪色彩；其余句法按自然汉语调整。正文中的所有脚注标记均有对应脚注。
