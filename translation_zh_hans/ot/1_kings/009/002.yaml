  text: וַ/יֵּרָ֧א יְהוָ֛ה אֶל שְׁלֹמֹ֖ה שֵׁנִ֑ית כַּ/אֲשֶׁ֛ר נִרְאָ֥ה אֵלָ֖י/ו בְּ/גִבְעֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/002.yaml
  text: Then Yahweh appeared to Solomon a second time[a], as he had appeared to him at Gibeon.
translation:
  language: zh_hans
  text: 雅威第二次[a]向所罗门显现，就像先前在基遍向他显现一样。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“再次”；希伯来文直译“第二次”。
    reason: 说明שֵׁנִית可自然译作“再次”，同时交代正文较贴近原文的表达。
lexical_decisions:
- source_word: וַיֵּרָא
  choice: 显现
  rationale: ראה的尼法勒形在此表示神以可感知的方式临到并让人认识；“显现”自然、庄重，也与后半句同一词根的נִרְאָה保持对应。
- source_word: יְהוָה
  choice: 雅威
  rationale: 直接音译四字神名，保留其作为以色列之神专名的性质，不以称号代替。
- source_word: שֵׁנִית
  choice: 第二次
  rationale: 该副词明确表示次序，强调这是雅威第二次向所罗门显现；比单译“再次”更贴近字面。
- source_word: כַּאֲשֶׁר
  choice: 就像……一样
  rationale: 清楚表达本次显现与先前在基遍显现之间的比较关系，符合现代汉语表达。
- source_word: נִרְאָה
  choice: 先前……显现
  rationale: 原文再次使用ראה的尼法勒形；汉语借“先前”表明这是相对于主句更早发生的事件。
- source_word: אֵלָיו
  choice: 向他
  rationale: 保留介词אֶל的方向和关系含义，不额外推断显现的具体方式。
- source_word: בְּגִבְעוֹן
  choice: 在基遍
  rationale: ב在此标示先前显现发生的地点，译作“在基遍”自然准确。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；采用“雅威”作为其常见的现代汉语音译，以保留专名性质，而不改译为“主”等称号。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“就像先前……一样”既保留比较结构，也用“先前”明确基遍的显现早于本次事件。
