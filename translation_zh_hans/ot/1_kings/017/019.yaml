  text: וַ/יֹּ֥אמֶר אֵלֶ֖י/הָ תְּנִֽי לִ֣/י אֶת בְּנֵ֑/ךְ וַ/יִּקָּחֵ֣/הוּ מֵ/חֵיקָ֗/הּ וַֽ/יַּעֲלֵ֨/הוּ֙ אֶל הָ/עֲלִיָּ֗ה אֲשֶׁר הוּא֙ יֹשֵׁ֣ב שָׁ֔ם וַ/יַּשְׁכִּבֵ֖/הוּ עַל מִטָּתֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/019.yaml
  text: And he said to her[a], “Give me your son.” Then he took him from her bosom, carried him up to the upper room where he was staying[b], and laid him on his own bed.
translation:
  language: zh_hans
  text: 以利亚对她说：“把你儿子交给我。”他就从她怀中[a]接过孩子，把他抱上自己所住的楼上房间[b]，放在自己的床上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “怀中”所译的希伯来词可指胸前、怀抱或膝上，描绘母亲贴身抱着孩子。
    reason: lexical_alternative
  - marker: b
    text: “楼上房间”也可译作“上层房间”或“屋顶房间”。
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּנִי לִי
  choice: 把……交给我
  rationale: 祈使式“给我”在此表示请母亲将儿子交到以利亚手中；“把……交给我”符合现代汉语，也保留话语的直接性而不额外增添强硬意味。
- source_word: בְּנֵךְ
  choice: 你儿子
  rationale: בֵּן明确指“儿子”，因此不泛化为“孩子”；后文为避免重复，按汉语习惯用“孩子”回指。
- source_word: מֵחֵיקָהּ
  choice: 从她怀中
  rationale: חֵיק指胸前、怀抱或膝上这一贴身承托的区域；“怀中”自然地表现母亲正贴身抱着孩子，同时保留原词的亲密意象。
- source_word: וַיִּקָּחֵהוּ
  choice: 接过孩子
  rationale: לקח表示拿取、接过；结合孩子原在母亲怀中的情境，“接过”比单纯“拿”自然，也未超出上下文所表达的动作。
- source_word: וַיַּעֲלֵהוּ
  choice: 把他抱上
  rationale: 该使役形式表达将孩子带到高处；孩子当时已经死去，且以利亚刚从母亲怀中接过他，“抱上”自然传达亲自携带上楼的动作。
- source_word: הָעֲלִיָּה
  choice: 楼上房间
  rationale: עֲלִיָּה指建筑上层的房间，也可能是屋顶上的加建房间；“楼上房间”清楚自然，并以脚注保留建筑形态上的词义范围。
- source_word: אֲשֶׁר הוּא יֹשֵׁב שָׁם
  choice: 自己所住的
  rationale: ישב在这里不是单指坐着，而是指居住或暂住；“自己”明确其先行词是以利亚，符合连续动作的主语。
- source_word: וַיַּשְׁכִּבֵהוּ
  choice: 放在
  rationale: שכב的使役形式意为使其躺下；汉语“放在床上”简洁自然，并准确表达动作结果。
- source_word: עַל מִטָּתוֹ
  choice: 在自己的床上
  rationale: 第三人称单数后缀在连续叙事中回指以利亚；“自己的”既自然，也避免被误解为孩子的床。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。用“接过……抱上……”呈现连续动作；保留原文对母子贴身相依的描写，并以脚注说明“楼上房间”可能涵盖的建筑形态。
