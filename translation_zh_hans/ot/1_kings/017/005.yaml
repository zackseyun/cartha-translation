base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/005.yaml
  text: So he went and did according to the word of Yahweh[a], and he went and stayed by the Wadi Cherith[b], which is before the Jordan.
translation:
  language: zh_hans
  text: 于是，以利亚照着雅威的话而行；他去了，住在约旦河对面的基立溪谷[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “溪谷”所译的希伯来语可指河谷、溪流或季节性水道；“对面”也可译作“前面”或“面对着”。
    reason: 说明נַחַל的词义范围，以及“在约旦河面前”这一空间短语可有的不同译法，避免将地点具体化为原文未明说的方位。
lexical_decisions:
- source_word: וַיֵּלֶךְ וַיַּעַשׂ כִּדְבַר יְהוָה
  choice: 于是，以利亚就照着雅威的话去做
  rationale: 连续叙事形式推进情节，并表明他回应上文的命令；中文补出上文明确的主语“以利亚”，使独立经节自然清楚。“照着……的话去做”保留顺服所领受话语的含义。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以通行的现代汉语音译呈现四字神名，保留其作为专名的性质，不以称号替代。
- source_word: וַיֵּלֶךְ וַיֵּשֶׁב
  choice: 他去了，住在……旁
  rationale: 保留原文第二次“去”的叙事动作；“住”可表达在当地停留居住，而不暗示永久定居。
- source_word: בְּנַחַל כְּרִית
  choice: 在基立溪谷旁
  rationale: נַחַל可指溪流、河谷或季节性水道；“溪谷”兼顾地貌与水道含义，“旁”符合此处居住地点的自然汉语表达。
- source_word: אֲשֶׁר עַל פְּנֵי הַיַּרְדֵּן
  choice: 约旦河对面的
  rationale: עַל־פְּנֵי在此可表示“在……前面、面对或对面”；译作“对面”既自然，又避免把原文未明说的方位具体化为“东边”。
- source_word: הַיַּרְדֵּן
  choice: 约旦河
  rationale: 采用现代汉语对该河流的标准名称；补出“河”可避免仅音译地名造成的不清楚。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名，因此采用音译以保留专名性质；不以称号“上主”替代，也不采用源于混合读音传统的“耶和华”。
- issue: עַל פְּנֵי הַיַּרְדֵּן的地理含义
  choice: 约旦河对面
  alternative: 约旦河前面；约旦河东边
  rationale: 希伯来语短语本身具有一定弹性。“对面”保留这种空间关系，而“东边”虽可能符合地理理解，却比原文明示的信息更具体。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。保留原文两次“去”的动作次序；地理表达不擅自确定为“约旦河东边”。
