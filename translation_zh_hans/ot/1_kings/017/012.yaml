id: 1KI.17.12
reference: 1 Kings 17:12
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/תֹּ֗אמֶר חַי יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ אִם יֶשׁ לִ֣/י מָע֔וֹג כִּ֣י אִם מְלֹ֤א כַף קֶ֨מַח֙ בַּ/כַּ֔ד וּ/מְעַט שֶׁ֖מֶן בַּ/צַּפָּ֑חַת וְ/הִנְ/נִ֨י מְקֹשֶׁ֜שֶׁת שְׁנַ֣יִם עֵצִ֗ים וּ/בָ֨אתִי֙ וַ/עֲשִׂיתִ֨י/הוּ֙ לִ֣/י וְ/לִ/בְנִ֔/י וַ/אֲכַלְנֻ֖/הוּ וָ/מָֽתְנוּ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/012.yaml
  text: And she said[a], “As Yahweh your God lives, I have no bread-cake, only a handful of flour in the jar and a little oil in the jug. And look, I am gathering two sticks, so that I may go in and prepare it for myself and for my son, and we may eat it and die.”
translation:
  language: zh_hans
  text: 她说：“我指着永活的雅威——你的神——起誓，我连一块饼[a]也没有；只有罐里的一把面粉和瓶里的一点油。你看，我正在捡两根柴，好回去为自己和儿子做饼；我们吃了，也就要死了。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “饼”所译的希伯来词指用面粉做成的小饼；也可译作“一块烤好的饼”。
    reason: 说明 מָעוֹג 的具体所指及可接受的译法。
lexical_decisions:
- source_word: חַי יְהוָה אֱלֹהֶיךָ
  choice: 我指着永活的雅威——你的神——起誓
  rationale: 这是希伯来语庄严起誓的固定表达。译文明确其起誓功能，同时保留“永活”及“你的神”，并将神名 יְהוָה 音译为“雅威”。
- source_word: אִם יֶשׁ לִי מָעוֹג
  choice: 我连一块饼也没有
  rationale: 在誓言语境中，אִם 表示强烈否定；מָעוֹג 指做成或烤成的小饼。正文用自然的“一块饼”，细义置于脚注。
- source_word: כִּי אִם מְלֹא כַף קֶמַח
  choice: 只有坛里的一把面粉
  rationale: כִּי אִם 引出唯一的例外；מְלֹא כַף 字面为满一手掌的量，以“一把”自然传达数量极少。כַּד 在此是盛面粉的家用容器，译作“坛”。
- source_word: וּמְעַט שֶׁמֶן בַּצַּפָּחַת
  choice: 瓶里的一点油
  rationale: צַפַּחַת 是盛液体的小容器；“瓶”符合现代汉语，并与盛面粉的“坛”有所区分。
- source_word: וְהִנְנִי מְקֹשֶׁשֶׁת שְׁנַיִם עֵצִים
  choice: 你看，我正在捡两根柴
  rationale: וְהִנְנִי 引人注意当前情形，分词表达正在进行的动作；“两根柴”保留原文具体数目及物资匮乏的意味。
- source_word: וּבָאתִי וַעֲשִׂיתִיהוּ לִי וְלִבְנִי
  choice: 好回去为自己和儿子做饼
  rationale: 连续动词表达她捡柴的目的和后续行动。阳性单数宾语后缀所指可理解为用现有材料做出的食物；结合 מָעוֹג，译为“做饼”清楚自然。
- source_word: וַאֲכַלְנֻהוּ וָמָתְנוּ
  choice: 我们吃了，就死吧
  rationale: 保留原文简短而沉重的先后关系，不额外解释为自然死亡、饿死或等待死亡。
theological_decisions:
- issue: 西顿寡妇在誓言中使用神名 יְהוָה
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。音译“雅威”保留其作为专名的性质，不以称号“主”替代；寡妇称其为“你的神”这一叙事张力也予以保留。
- issue: וָמָתְנוּ 所表达的死亡前景
  choice: 我们吃了，就死吧
  alternative: 我们吃完这一顿，就等死吧
  rationale: 原文只并列“吃”与“死”，并未明说“等死”或死亡方式，因此正文不增补解释，以保留其简洁和绝望感。
translation_notes:
  register: 采用现代、庄重而口语可懂的叙事语言。“你看”体现现场感；“一把面粉”“一点油”“两根柴”保持原文层层展现的匮乏。破折号标明“你的神”是对“雅威”的补充说明，避免误读。
