revisions:
- from: 她说：“我指着永活的雅威——你的神——起誓，我连一块饼[a]也没有，只有坛里的一把面粉和瓶里的一点油。你看，我正在捡两根柴，好回去为自己和儿子做饼；我们吃了，就死吧。”
  to: 她说：“我指着永活的雅威——你的神——起誓，我连一块饼[a]也没有；只有罐里的一把面粉和瓶里的一点油。你看，我正在捡两根柴，好回去为自己和儿子做饼；我们吃了，也就要死了。”
  rationale: 以“罐”纠正盛面粉容器的误译；将末句改为结果性陈述，避免“吧”造成祈使语气，同时不增补“饿死”“等死”等原文未明说的内容。其余措辞保留，以维持原有的庄重、自然和简洁。
