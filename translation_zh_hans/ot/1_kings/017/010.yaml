base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/010.yaml
  text: So he arose and went to Zarephath. When he came to the entrance of the city[a], behold, a widow was there gathering sticks. He called to her and said, “Please bring me a little water in a vessel, so that I may drink.”
translation:
  language: zh_hans
  text: 于是，以利亚起身前往撒勒法。他来到城的入口处[a]，看哪，有一个寡妇正在那里捡柴。他向她呼唤，说：“请拿一个器皿给我取一点水来，好让我喝。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“城门口”。希伯来文 פֶּתַח 的意思是“入口、开口”，比特指“门”的词含义更宽泛。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם וַיֵּלֶךְ
  choice: 起身前往
  rationale: 保留两个连续动词所表达的行动次序；“起身前往”在现代汉语叙事中自然、庄重。
- source_word: צָרְפַתָה
  choice: 撒勒法
  rationale: 方向词尾表示向该地而去；采用通行的圣经地名译法“撒勒法”。
- source_word: פֶּתַח הָעִיר
  choice: 城的入口
  rationale: פֶּתַח 泛指开口或入口，不等同于更具体的“城门”；正文保留其较宽泛的语义。
- source_word: וְהִנֵּה
  choice: 看哪
  rationale: 该叙事提示词引导读者注意突然映入眼帘的情景；“看哪”保留其强调和现场感。
- source_word: אִשָּׁה אַלְמָנָה
  choice: 一个寡妇
  rationale: 原文直译为“一个女人，一个寡妇”；现代汉语用“一个寡妇”即可自然表达完整意义。
- source_word: מְקֹשֶׁשֶׁת עֵצִים
  choice: 正在那里捡柴
  rationale: 分词表示正在进行的动作；עֵצִים 在此结合“捡拾”的语境，宜译作供燃烧的“柴”，而非大型木材。
- source_word: וַיִּקְרָא אֵלֶיהָ
  choice: 他呼唤她
  rationale: קרא אֶל 表示向某人呼叫；“呼唤她”准确且符合现代书面叙事。
- source_word: קְחִי נָא לִי
  choice: 请用器皿给我取
  rationale: לקח 基本义为“拿、取”，在为说话者取得某物的请求中译作“给我取”自然；נָא 的恳请语气由“请”表达。
- source_word: מְעַט מַיִם
  choice: 一点水
  rationale: 直接表达少量的水，简洁自然。
- source_word: בַּכְּלִי
  choice: 用器皿
  rationale: כְּלִי 是泛称的容器或器具；“器皿”保留其非特指性，不擅自具体化为瓶或罐。介词在汉语中自然处理为工具义“用”。
- source_word: וְאֶשְׁתֶּה
  choice: 让我喝
  rationale: 该形式表达说话者期望实现的结果；“让我喝”自然承接请求，同时保留意愿色彩。
