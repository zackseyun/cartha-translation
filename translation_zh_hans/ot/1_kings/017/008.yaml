  text: Then the word of Yahweh came to him[a], saying,
translation:
  language: zh_hans
  text: 雅威的话临到他，说：
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: 临到
  rationale: 该叙事形式承接前文、引出随后发生的事件；在本句中与“雅威的话”合译为自然的汉语先知话语公式。“临到”已能表达事件发生及信息到来的意思，无须另加生硬的“于是发生了”。
- source_word: דְבַר
  choice: 话
  rationale: 在结构“דְבַר יְהוָה”中指来自雅威的神圣言语或启示。“话”既保留原文惯用表达，也避免用“信息”过度解释。
- source_word: יְהוָה
  choice: 雅威
  rationale: 原文使用以色列上帝的专名四字神名；“雅威”以现代汉语音译保留其专名性质，而不以称号代替。
- source_word: אֵלָיו
  choice: 他
  rationale: 介词 אֶל 加第三人称阳性单数后缀，表示“到他/向他”；与“临到”搭配时，汉语自然表达为“临到他”。
- source_word: לֵאמֹר
  choice: 说
  rationale: 该不定式是引出下一节直接引语的常用公式。译为“说”简洁、忠实，并自然承接后文。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文明确使用神的专名，而非“主”这一称号；采用“雅威”可保留专名，并较贴近通常重构的读音。
translation_notes:
  register: 采用现代、庄重而通顺的叙事语言。“雅威的话临到……”保留希伯来先知话语公式；句末用冒号提示直接引语将在下一节开始。
