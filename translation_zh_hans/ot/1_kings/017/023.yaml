base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/023.yaml
  text: Then Elijah took the boy[a], brought him down from the upper room into the house, and gave him to his mother. And Elijah said, “See, your son is alive.”
translation:
  language: zh_hans
  text: 以利亚带着那孩子，把他从楼上的房间带下来，带进屋里，交给他母亲。以利亚说：“看，你儿子活着[a]！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你儿子活了！”
    reason: חַי既可着重表达“处于活着的状态”，在此叙事语境中也可自然译作“活了”，突出生命得到恢复。
lexical_decisions:
- source_word: וַיִּקַּח אֵלִיָּהוּ אֶת הַיֶּלֶד
  choice: 以利亚把孩子……带下来
  rationale: לקח是常见的叙事动词，יֶלֶד可指“孩子”或“男孩”。此处将“带上/取来”与下文使役式“带下来”自然合译，既保留动作，又避免用“抱起”过度限定携带方式；“孩子”也不额外推断年龄。
- source_word: וַיֹּרִדֵהוּ
  choice: 把他……带下来
  rationale: 这是ירד的使役形式，表示使其下去，即“带下来”；译文不具体说明是抱、背或领，以免超出原文。
- source_word: מִן הָעֲלִיָּה
  choice: 从楼上的房间
  rationale: עֲלִיָּה指建筑物上层的房间或屋顶上的房间。“楼上的房间”是现代汉语中清楚自然的表达，同时保留其空间位置。
- source_word: הַבַּיְתָה
  choice: 进到屋里
  rationale: בַּיְתָה带方向词尾，表示朝房屋内部移动；“进到屋里”明确传达这一方向含义。
- source_word: וַיִּתְּנֵהוּ לְאִמּוֹ
  choice: 交给他母亲
  rationale: נתן在这里是“给、交给”。“交给”符合人物动作场景，又不像“还给”那样把上下文所暗示的归还意义直接加入词义。
- source_word: רְאִי
  choice: 看
  rationale: 这是ראה的阴性单数命令式，直接对孩子的母亲说。“看”简洁自然，并保留指示和邀请确认的语气。
- source_word: חַי בְּנֵךְ
  choice: 你儿子活着
  rationale: חַי在此作谓语，直接宣告儿子处于有生命的状态。“活着”符合现代汉语，也不在正文中扩写为“复活了”或“恢复生命了”。
theological_decisions:
- issue: 是否把孩子恢复生命的神迹明说为“复活”
  choice: 你儿子活着
  alternative: 你儿子复活了／你儿子恢复生命了
  rationale: 希伯来文只直接宣告“你儿子活着”。上下文清楚表明他恢复了生命，但译文不加入原文未明说的神学术语或解释性措辞。
- issue: חַי的状态式与动态式表达
  choice: 正文采用“活着”
  alternative: 脚注列出“活了”
  rationale: “活着”较贴近谓语形容词所表达的生命状态；“活了”则以自然汉语突出上下文中的生命恢复。保留两种表达，不强行消除原文简短宣告所容纳的语感。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。句式简洁，保留原文连续动作和结尾宣告的戏剧性；不用“看哪”等较古雅表达，也不具体补出以利亚如何携带孩子。
