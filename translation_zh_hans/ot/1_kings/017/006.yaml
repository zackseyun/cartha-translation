base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/006.yaml
  text: And the ravens were bringing him bread and meat in the morning[a], and bread and meat in the evening, and he would drink from the wadi.
translation:
  language: zh_hans
  text: 乌鸦早晨给他送来饼和肉，晚上也给他送来饼和肉；他从那溪流[a]中喝水。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “溪流”也可译作“旱溪”；希伯来语 נַחַל 可指水道，常指季节性溪流或其所在的谷地。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָעֹרְבִים
  choice: 乌鸦
  rationale: עֹרְבִים通常指鸦科中的乌鸦；按其直接、普通的词义翻译，不改释为人类群体。句首连接词在中文叙事中不必机械译作“并且”。
- source_word: מְבִיאִים
  choice: 给他送来
  rationale: 分词在叙事语境中表示持续或反复发生的行动；早晚两次重复“送来”，自然地体现这种惯常性。
- source_word: לֶחֶם
  choice: 饼
  rationale: 保留具体食物名称，不泛化为“食物”；“饼”比现代汉语中的“面包”更适合古代近东语境。
- source_word: וּבָשָׂר
  choice: 和肉
  rationale: בָּשָׂר在此指可食用的肉，译作“肉”自然准确。
- source_word: בַּבֹּקֶר
  choice: 早晨
  rationale: 简明、自然地表达时间。
- source_word: וְלֶחֶם וּבָשָׂר בָּעָרֶב
  choice: 晚上也给他送来饼和肉
  rationale: 保留原文对“饼和肉”的重复，以呈现早晚供应的节奏和强调；补出“也给他送来”是中文所需的谓语承接。
- source_word: וּמִן הַנַּחַל
  choice: 那溪谷里的水
  rationale: נַחַל可指溪流，也可指有水道的谷地；“溪谷”保留地貌含义，而“里的水”按“喝”的语义自然补明所饮之物。
- source_word: יִשְׁתֶּה
  choice: 他则喝
  rationale: 未完成式在这里表达惯常、反复的行动；与前面的反复供应相配。“则”自然区分食物来源和饮水来源。
theological_decisions:
- issue: עֹרְבִים所指的供应者
  choice: 按字面译为“乌鸦”
  alternative: 解释为阿拉伯人、商旅或其他人类供应者
  rationale: 该词通常义为乌鸦，直接语境也没有要求避开神迹性质而另作人类群体解释，因此正文保留普通词义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。保留“饼和肉”在早晚句中的重复；不用较生僻的音译“旱溪”，以“溪谷”配脚注呈现 נַחַל 的语义范围。脚注标记置于“溪谷”之后，与其所解释的词直接对应。
