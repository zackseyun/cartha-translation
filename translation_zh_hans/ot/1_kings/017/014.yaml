reference: 1 Kings 17:14
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כִּ֣י כֹה֩ אָמַ֨ר יְהוָ֜ה אֱלֹהֵ֣י יִשְׂרָאֵ֗ל כַּ֤ד הַ/קֶּ֨מַח֙ לֹ֣א תִכְלָ֔ה וְ/צַפַּ֥חַת הַ/שֶּׁ֖מֶן לֹ֣א תֶחְסָ֑ר עַ֠ד י֧וֹם תתן יְהוָ֛ה גֶּ֖שֶׁם עַל פְּנֵ֥י הָ/אֲדָמָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/014.yaml
  text: 'For this is what Yahweh[a], the God of Israel, says: ‘The jar of flour will not be used up, and the jug of oil will not run dry[c][b], until the day Yahweh gives rain on the face of the ground.’'
translation:
  language: zh_hans
  text: 因为以色列的上帝雅威[a]如此说：“缸里的面粉必不耗尽[b]，瓶里的油必不减少[c]，直到雅威使雨降在地面上的那一天。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “雅威”音译自希伯来文神名יהוה（YHWH）。
    reason: divine_name
  - marker: b
    text: “必不耗尽”也可译作“必不用完”。
    reason: lexical_alternative
  - marker: c
    text: “必不减少”也可译作“必不缺少”。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: 雅威
  rationale: 以常见的现代汉语音译呈现上帝的专名，不以“耶和华”或“主”等传统形式替代原文中的四字神名。
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: 以色列的上帝
  rationale: 直接保留原文的属格结构和先知宣告中对以色列之上帝的指称。
- source_word: כַּד הַקֶּמַח
  choice: 缸里的面粉
  rationale: כַּד指家用容器；结合储存面粉的场景译作“缸”。汉语以“缸里的面粉”为主语，更自然地表达其中存粮不会用尽。
- source_word: לֹא תִכְלָה
  choice: 必不耗尽
  rationale: כלה在此表示到尽头、被用完；“耗尽”准确表达供应不会枯竭，且庄重自然。
- source_word: צַפַּחַת הַשֶּׁמֶן
  choice: 瓶里的油
  rationale: צַפַּחַת是盛液体的小型容器；译作“瓶”既符合盛油的场景，也与前面的“缸”有所区分。
- source_word: לֹא תֶחְסָר
  choice: 必不减少
  rationale: חסר的基本含义是缺少、减少。译作“减少”保留其与前句“耗尽”不同的词义色彩。
- source_word: עַד יוֹם
  choice: 直到……的那一天
  rationale: 明确保留原文“直到那日”的时间界限。
- source_word: תתן יְהוָה גֶּשֶׁם
  choice: 雅威使雨降下
  rationale: נתן字面为“给”；汉语谈及降雨时用“使雨降下”较自然，也清楚保留雅威为施行者。
- source_word: עַל פְּנֵי הָאֲדָמָה
  choice: 在地面上
  rationale: 保留原文关于土地表面的空间意象，同时避免生硬直译为“在地的脸上”。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用以色列上帝的专名。音译“雅威”保留其专名性质，不以称号替代；脚注说明其与四字神名的关系。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“如此说”保留先知宣告的正式语气；两句供应应许使用平行结构，并分别译出כלה与חסר的词义差别。
