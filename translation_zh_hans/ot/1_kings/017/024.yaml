base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/024.yaml
  text: Then the woman said to Elijah[a], “Now I know that you are a man of God, and that the word of Yahweh in your mouth is truth.”
translation:
  language: zh_hans
  text: 于是那妇人对以利亚说：“如今我知道，你是神人，雅威在你口中的话是真实的[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“雅威在你口中的话是真理”或“真实可信”。希伯来词可表示真理、真实性或可靠性。
    reason: 说明אֱמֶת作为谓语名词的语义范围，并保留较字面的“真理”与自然的中文表达。
lexical_decisions:
- source_word: וַתֹּאמֶר הָאִשָּׁה אֶל אֵלִיָּהוּ
  choice: 妇人对以利亚说
  rationale: 按希伯来叙事顺序自然表达；保留“妇人”，不把上下文中的“寡妇”补入本节。
- source_word: עַתָּה זֶה יָדַעְתִּי
  choice: 现在我知道
  rationale: 表达妇人经过刚发生的事而得到的明确认识；“现在”保留原文的强调作用。
- source_word: אִישׁ אֱלֹהִים
  choice: 神人
  rationale: 这是希伯来语中对上帝使者或先知的固定称谓；采用简洁而有圣经语体传统的中文表达。
- source_word: וּדְבַר יְהוָה בְּפִיךָ
  choice: 雅威借你的口所说的话
  rationale: “借你的口”自然传达原文“在你口中”的先知性言说意象，同时避免中文“话在口中”可能造成的生硬。
- source_word: אֱמֶת
  choice: 真理
  rationale: 保留原文谓语名词的力度，并涵盖真实、可信与可靠的语义；脚注说明另一种自然译法。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；以“雅威”音译，明确保留以色列上帝的盟约之名。
- issue: אֱמֶת 作谓语名词的理解
  choice: 是真理
  alternative: 是真的／真实可信
  rationale: 原文并非只作一般形容词，而以名词强调雅威之话的真实性与可靠性；正文保留这一力度，脚注呈现自然替代译法。
translation_notes:
  register: 采用现代、庄重而清楚的普通话。“神人”保留传统先知称谓；引语整体顺畅，神名用“雅威”。
