  text: וַ/יִּשְׁמַ֥ע יְהוָ֖ה בְּ/ק֣וֹל אֵלִיָּ֑הוּ וַ/תָּ֧שָׁב נֶֽפֶשׁ הַ/יֶּ֛לֶד עַל קִרְבּ֖/וֹ וַ/יֶּֽחִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/022.yaml
  text: And Yahweh listened to the voice of Elijah[a], and the life of the child returned to his inner being, and he lived.
translation:
  language: zh_hans
  text: 雅威听了以利亚的声音，孩子的生命[a]回到他体内，他就活了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“孩子的魂回到他体内。”希伯来语“נֶפֶשׁ”（内费什）可按语境指“生命”“魂”或“自身”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: 听了
  rationale: שׁמע在祷告语境中不仅指听见，也含有垂听并作出回应之意；“听了”简洁自然，并保留原文没有明说“应允”的克制。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常用音译呈现四字神名，保留其作为以色列之神专名的性质，不以头衔替代。
- source_word: בְּקוֹל אֵלִיָּהוּ
  choice: 以利亚的声音
  rationale: 贴近原文具体表达“以利亚的声音”，不扩展为原文未明说的“祷告”或“恳求”。
- source_word: וַתָּשָׁב
  choice: 回到
  rationale: שׁוב在此表示返回、恢复；“回到”适合生命重新临到孩子的叙事语境。
- source_word: נֶפֶשׁ
  choice: 生命
  rationale: נֶפֶשׁ可指生命、性命、自我或魂；在孩子死而复生的上下文中，“生命”最直接表达其恢复生机的意思，同时避免把某一种灵魂观预先写进正文。
- source_word: הַיֶּלֶד
  choice: 孩子
  rationale: יֶלֶד指孩子或男孩；“孩子”符合本段叙事，且是自然的现代汉语。
- source_word: עַל קִרְבּוֹ
  choice: 到他里面
  rationale: קֶרֶב指内部、里面；“到他里面”既保留生命返回其内部的空间意象，也比“回到他的内在”更自然。
- source_word: וַיֶּחִי
  choice: 他就活了
  rationale: חיה直接陈述孩子恢复生命的结果；“就”自然连接前因后果，但不增加额外神学解释。
theological_decisions:
- issue: 复生语境中נֶפֶשׁ的译法
  choice: 生命
  alternative: 魂
  rationale: 本节首先叙述孩子生命的恢复，因此正文采用“生命”。不过，“魂”在词义和传统译法上仍属可能，故以脚注保存这一词汇与人论上的张力，而不在正文中替读者裁定。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。句式保留希伯来文连续叙事的简洁推进；“听了……的声音”和“回到他里面”略带原文意象，但仍易于普通读者理解。脚注标记置于其实际说明的“生命”之后。
