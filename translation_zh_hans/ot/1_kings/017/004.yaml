base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/004.yaml
  text: And it shall be that you will drink from the brook[c][b][a], and I have commanded the ravens to provide for you there.
translation:
  language: zh_hans
  text: 你要喝那溪里的水[a]；我已经吩咐乌鸦[b]在那里供养你[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “溪”所译的希伯来语也可指季节性溪流、河谷或旱溪。
    reason: lexical_alternative
  - marker: b
    text: 有人提出这里并非指鸟类，而可能是地名或某一群人；不过，这个希伯来词通常指乌鸦，后文也支持这一理解。
    reason: alternative_reading
  - marker: c
    text: “供养”也可译作“供应你所需的”或“养活你”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: 以自然汉语句式表达，不单独译出
  rationale: 此处引出随后将发生的情形；若直译为“事情将是”，现代汉语显得生硬。用后续分句直接陈述，保留预告语气。
- source_word: מֵהַנַּחַל
  choice: 那溪里的水
  rationale: נחל可指溪流、季节性河谷或旱溪。结合“喝”，汉语自然表达为“喝那溪里的水”，同时用脚注保留地貌上的词义范围。
- source_word: תִּשְׁתֶּה
  choice: 你要喝
  rationale: 未完成式在此表示将来的行动；“要喝”兼具预告和指示意味，符合现代叙事语体。
- source_word: הָעֹרְבִים
  choice: 乌鸦
  rationale: 该词通常指鸦科鸟类，此处后文又说它们送来饼和肉，因此按普通词义译作“乌鸦”。
- source_word: צִוִּיתִי
  choice: 我已经吩咐
  rationale: 完成式表示命令已经发出，并对以利亚到达后的供应持续有效；“已经吩咐”自然传达这一点。
- source_word: לְכַלְכֶּלְךָ
  choice: 供养你
  rationale: 该动词有维持、供应所需之意。“供养”既不局限于单次喂食，也与后文持续送食物相符。
- source_word: שָׁם
  choice: 在那里
  rationale: 直接表达地点副词，并明确指向上文所说的溪旁。
theological_decisions:
- issue: 受命供养以利亚者的性质
  choice: 按通常词义理解为乌鸦
  alternative: 有人提出可指地名或某一群人
  rationale: הָעֹרְבִים的普通希伯来语义是鸦类，后续叙事又明确说它们带来饼和肉。正文保留这一直接读法，脚注说明少数替代解释而不据此改写。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“你要喝……；我已经吩咐……”保留原文两个并列分句及神已经安排供应的语气。脚注标记按其所解释的词紧邻放置。
