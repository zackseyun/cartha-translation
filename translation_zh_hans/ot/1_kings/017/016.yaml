base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/016.yaml
  text: The jar of flour was not used up[a], and the jug of oil did not run out, according to the word of Yahweh that he had spoken by the hand of Elijah.
translation:
  language: zh_hans
  text: 面粉罐里的面粉没有用尽，油瓶里的油也没有减少，正如雅威借着以利亚[a]所说的那样。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“借以利亚的手”；这是表示中介的希伯来语习语，意为“借着以利亚”。
    reason: 说明“借着以利亚”所对应的原文字面表达及其习语用法。
lexical_decisions:
- source_word: כַּד הַקֶּמַח
  choice: 面坛里的面
  rationale: כַּד指储放食物的家用容器；“面坛”在现代汉语中自然地表达盛面粉的容器，同时避免把它误解为用于倾倒液体的壶。
- source_word: לֹא כָלָתָה
  choice: 没有用完
  rationale: כלה在此表示被耗尽或到了尽头；“没有用完”清楚表达面粉持续未尽。
- source_word: צַפַּחַת הַשֶּׁמֶן
  choice: 油瓶里的油
  rationale: צַפַּחַת指盛液体的小型容器；“油瓶”符合家庭储油语境，也与“面坛”形成自然区别。
- source_word: לֹא חָסֵר
  choice: 没有减少
  rationale: חסר表示变少、欠缺；译作“没有减少”保留它与前句כלה不同的措辞，并表达油未见短少。
- source_word: כִּדְבַר יְהוָה
  choice: 正如雅威……所说的话
  rationale: כִּדְבַר表示事情按照先前所宣告的话成就；“正如……所说的话”在汉语中自然，并保留“话”这一名词。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见音译呈现四字神名，保留原文使用的专名，不以称号替代。
- source_word: בְּיַד אֵלִיָּהוּ
  choice: 借以利亚
  rationale: ביד在这里是表示中介或代理的习语；“借以利亚”自然表达雅威是说话者、以利亚是传达者。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；采用“雅威”音译，保留其作为专名的性质。
- issue: 先知中介公式בְּיַד אֵלִיָּהוּ
  choice: 借以利亚所说
  alternative: 借以利亚的手所说
  rationale: 正文采用现代汉语可理解的中介表达，不把说话归给以利亚本人；脚注保留希伯来语“借……的手”这一字面形式。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“面坛”和“油瓶”保留两种容器的区别；“没有用完／没有减少”也保留原文两个不同动词的细微差别。
