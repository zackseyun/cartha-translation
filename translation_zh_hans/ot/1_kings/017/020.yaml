source:
  edition: WLC
  text: וַ/יִּקְרָ֥א אֶל יְהוָ֖ה וַ/יֹּאמַ֑ר יְהוָ֣ה אֱלֹהָ֔/י הֲ֠/גַם עַל הָ/אַלְמָנָ֞ה אֲשֶׁר אֲנִ֨י מִתְגּוֹרֵ֥ר עִמָּ֛/הּ הֲרֵע֖וֹתָ לְ/הָמִ֥ית אֶת בְּנָֽ/הּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/020.yaml
  text: Then he cried out to Yahweh and said[a], “O Yahweh my God, have you also brought harm on the widow with whom I am staying[b], by causing her son to die?”
translation:
  language: zh_hans
  text: 于是，他向耶和华呼求说：“耶和华我的上帝啊，我寄居在这个寡妇家中[a]，你竟也降祸于她[b]，使她的儿子死去吗？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“暂住在这个寡妇家中”。原文所用的词可指以客人或依附者的身份寄居。
    reason: lexical_alternative
  - marker: b
    text: 或译：“恶待她”。原文动词可指造成伤害、带来灾祸或待人不好。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא אֶל־יְהוָה
  choice: 向耶和华呼求
  rationale: קרא与אֶל־יְהוָה连用，在祷告语境中表达迫切呼告；“呼求”既体现情感力度，也符合现代汉语宗教语境。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的神名译法，保留专名性质，不以称号替代。
- source_word: יְהוָה אֱלֹהָי
  choice: 耶和华我的上帝啊
  rationale: 保留神名、第一人称所属关系和呼格语气；句末“啊”使中文直接呼告自然庄重。
- source_word: הֲגַם
  choice: 竟也
  rationale: 疑问词与附加语气合起来带有震惊和难以置信之意；“竟也”比单纯的“也”更能体现以利亚哀诉中的强烈语气。
- source_word: מִתְגּוֹרֵר עִמָּהּ
  choice: 寄居在这个寡妇家中
  rationale: גור的Hitpael形式表示以外来者、客人或依附者身份暂住；“寄居”保留这一层含义，“家中”则使现代汉语表达顺畅。
- source_word: הֲרֵעוֹתָ עַל־הָאַלְמָנָה
  choice: 降祸于她
  rationale: רעע的使役形在此可指使人遭祸、受害，不必然指道德上的作恶；“降祸”保留灾祸出于上帝行动这一尖锐表述。
- source_word: לְהָמִית אֶת־בְּנָהּ
  choice: 使她的儿子死去
  rationale: 使役不定式表达所造成的结果或方式；该译法明确保留因果关系，同时比“杀死她的儿子”更贴合此处哀诉语境。
theological_decisions:
- issue: 以利亚是否在指控上帝行道德之恶
  choice: 译作“降祸于她”，并保留上帝使她儿子死去的直接归因
  alternative: “恶待她”或“向她行恶”
  rationale: הֲרֵעוֹתָ可表示带来灾祸或造成伤害，也可有“行恶”的字面可能。“降祸”不把经文过度解释成对上帝道德邪恶的明确指控，却仍保留以利亚大胆质问上帝、把死亡归于上帝行动的神学张力。
- issue: 是否弱化לְהָמִית所表达的神圣因果关系
  choice: “使她的儿子死去”
  alternative: “任凭她的儿子死去”
  rationale: “任凭”会把原文的使役表达改成仅仅许可，过早化解经文张力；正文因此保留明确的使役关系。
translation_notes:
  register: 采用现代、庄重而易懂的叙事与祷告语体。“耶和华我的上帝啊”保持直接呼告的郑重感；“竟也”传达震惊哀诉，“降祸”则保留原文的神学张力而不作过度裁断。
