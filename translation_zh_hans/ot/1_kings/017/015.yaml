base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/015.yaml
  text: So she went and did according to the word of Elijah[a], and she ate—he and she and her household—for many days.
translation:
  language: zh_hans
  text: 于是她照以利亚的话去做了；他、她和她全家的人都吃了多日。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文的动词为阴性单数，直译结构可作：“她吃了——他、她和她全家的人——多日。”随后列出所有吃的人。
    reason: 说明原文以阴性单数动词后接参与者名单的特殊句法；汉语动词不标示单复数，故主文按自然汉语合并表达。
lexical_decisions:
- source_word: וַתֵּלֶךְ
  choice: 于是，她去
  rationale: 该叙事性动词承接前文并推进情节；“于是”自然表达事情的先后和回应关系。
- source_word: וַתַּעֲשֶׂה
  choice: 做了
  rationale: עשה在这里指实行、照办以利亚的吩咐；“做了”简洁自然，不把含义局限为制作食物。
- source_word: כִּדְבַר אֵלִיָּהוּ
  choice: 照以利亚的话
  rationale: דבר在此指以利亚所说的指示或吩咐；此译法既贴近原文，也符合现代汉语表达。
- source_word: וַתֹּאכַל
  choice: 她便吃了
  rationale: 原文动词为阴性单数，首先指向寡妇；汉语没有动词数的一致变化，因此明确保留“她”，再用后置列举说明共同吃的人。
- source_word: הוא וְהִיא וּבֵיתָהּ
  choice: 他和她，以及她全家的人
  rationale: 保留原文“他、她、她的家”的次序；“他”按上下文自然指以利亚，而“全家的人”传达בַּיִת在这里的家庭成员义。
- source_word: יָמִים
  choice: 许多日子
  rationale: 复数“日子”在此作时间长度用语，表示一段延续的时期；“许多日子”自然呈现这种持续性，同时不规定确切天数。
