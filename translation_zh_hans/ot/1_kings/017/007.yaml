  text: And it happened after some days that the wadi dried up[a], because there was no rain in the land.
translation:
  language: zh_hans
  text: 过了些日子，溪流干涸了[a]，因为那地没有降雨。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“河谷中的溪水”。希伯来语所指的水道通常具有季节性，旱季可能断流。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: （融入叙事句式，不单独译出）
  rationale: 此处是希伯来叙事中的承接形式，用现代汉语直接进入“过了些日子”更自然，无须生硬译作“事情发生了”。
- source_word: מִקֵּץ יָמִים
  choice: 过了些日子
  rationale: 该短语表示一段未明确长度的时间过去；“过了些日子”既贴近字面，也符合现代汉语叙事表达。
- source_word: וַיִּיבַשׁ
  choice: 干涸了
  rationale: 这里描述水道失去水流；“干涸”比一般的“干了”更准确地用于河溪。
- source_word: הַנָּחַל
  choice: 溪流
  rationale: נחל可指季节性溪流、河谷或旱溪水道。“溪流”正文自然易懂，同时以脚注说明其近东地理含义。
- source_word: כִּי
  choice: 因为
  rationale: 此处引出溪流干涸的原因，具有明确的因果意义。
- source_word: לֹא הָיָה גֶשֶׁם
  choice: 没有降雨
  rationale: 自然表达当地没有雨水降下的情况，并清楚说明干涸的原因。
- source_word: בָּאָרֶץ
  choice: 那地
  rationale: 这里指以利亚叙事所涉及的土地或地区，并非整个地球；“那地”符合上下文指涉。
