base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/011.yaml
  text: As she went to get it[a], he called to her and said[b], “Please bring me a piece of bread in your hand.”
translation:
  language: zh_hans
  text: 她去取水时，他呼唤她[a]，说：“请你手里拿一块饼[b]来给我。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在她身后喊她”。
    reason: 上下文中妇人已经转身去取水，因此可理解为以利亚从她身后喊她；但希伯来文קרא אל本身通常只表示“向她呼喊”。
  - marker: b
    text: 或译：“一点饼”。
    reason: פַּת לֶחֶם可指一块、一片或少量的饼；“一点饼”更突出分量很少。
lexical_decisions:
- source_word: וַתֵּלֶךְ לָקַחַת
  choice: 她去取水时
  rationale: הלך的叙事形式接目的不定式，表示她去取前文所说的水；用“……时”自然呈现她正在去取水、以利亚随即呼唤她的场景。
- source_word: וַיִּקְרָא אֵלֶיהָ
  choice: 他呼唤她
  rationale: קרא与אֶל连用通常指向某人呼喊或呼唤；此译法保持中性，不把上下文所暗示的“从身后喊她”写死。
- source_word: לִקְחִי נָא לִי
  choice: 请……拿……来给我
  rationale: לקח在此语境中包括取来并交给说话者的动作；נָא缓和祈使语气，译作“请”；לִי表明受益者。
- source_word: פַּת לֶחֶם
  choice: 一块饼
  rationale: 该结构指一小块或一片饼；“一块饼”简明自然，也保留了数量不多的含义。
- source_word: בְּיָדֵךְ
  choice: 手里拿
  rationale: 保留希伯来文“在你手中”的具体意象，同时按现代汉语习惯组成“手里拿……来”的表达。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“呼唤她”比“叫住她”更贴近原文，因为原文未明说她停下；“手里拿……来给我”保留原文具体意象，虽略带希伯来语色彩，但汉语仍自然可懂。
