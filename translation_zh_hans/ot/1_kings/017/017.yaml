source:
  edition: WLC
  text: וַ/יְהִ֗י אַחַר֙ הַ/דְּבָרִ֣ים הָ/אֵ֔לֶּה חָלָ֕ה בֶּן הָ/אִשָּׁ֖ה בַּעֲלַ֣ת הַ/בָּ֑יִת וַ/יְהִ֤י חָלְי/וֹ֙ חָזָ֣ק מְאֹ֔ד עַ֛ד אֲשֶׁ֥ר לֹא נֽוֹתְרָה בּ֖/וֹ נְשָׁמָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/017.yaml
  text: After these things[a], the son of the woman who owned the house became sick, and his illness became very severe, until no breath was left in him.
translation:
  language: zh_hans
  text: 这些事以后，这家女主人的儿子病了；他的病势变得极其严重，直到身上再没有气息[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“直到他身上再没有生命。”希伯来文直译为：“直到他身上再没有气息。”
    reason: 说明נְשָׁמָה在本句中既可按字面理解为“气息”，又蕴含生命止息之意。
lexical_decisions:
- source_word: וַיְהִי אַחַר הַדְּבָרִים הָאֵלֶּה
  choice: 这些事以后
  rationale: 保留复数“这些事”和希伯来叙事中的时间承接，同时省去现代汉语中显得生硬的“事情发生了”。
- source_word: חָלָה
  choice: 病了
  rationale: 该动词在此表示进入患病状态；“病了”简洁自然，胜于仅描述静态状况的“有病”。
- source_word: בֶּן הָאִשָּׁה בַּעֲלַת הַבָּיִת
  choice: 这家女主人的儿子
  rationale: בַּעֲלַת הַבָּיִת 指这家的女性主人；“这家女主人”在现代汉语中自然明白，也不额外推断其法律意义上的房屋所有权。
- source_word: וַיְהִי חָלְיוֹ חָזָק מְאֹד
  choice: 他的病势变得极其严重
  rationale: “病势”自然表达病情的程度与发展，“变得”体现叙事中的恶化过程，“极其”对应 מְאֹד 的加强语气。
- source_word: עַד אֲשֶׁר לֹא נוֹתְרָה בּוֹ נְשָׁמָה
  choice: 直到身上再没有气息
  rationale: נְשָׁמָה 的基本意象是“气息”，此处意味着生命止息；正文保留原文意象，不直接改写为“死了”。“身上”自然对应 בּוֹ，避免汉语中生硬的“在他里面”。
theological_decisions:
- issue: 末句应明确译作死亡，还是保留希伯来文“气息不存”的表达
  choice: 保留“直到身上再没有气息”
  alternative: 直到他死了；直到他身上再没有生命
  rationale: 原文没有采用直接的死亡陈述，而说 נְשָׁמָה 不再留在他里面。保留“气息”既忠于原文措辞，也让其死亡含义由上下文呈现，不在正文中消除原有的表达张力。
translation_notes:
  register: 采用庄重而通顺的现代标准普通话。“这些事以后”保留叙事衔接；“病势变得极其严重”兼顾原文结构与自然表达；末句用“气息”保存希伯来文意象和语义张力。
