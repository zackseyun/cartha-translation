base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/002.yaml
  text: And the word of Yahweh came to him[a], saying,
translation:
  language: zh_hans
  text: 雅威[a]的话临到他，说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文为“YHWH”（יהוה），这里按其通行拟音译作“雅威”；传统汉译常作“耶和华”。
    reason: 说明神名的原文形式及传统译法。
lexical_decisions:
- source_word: וַיְהִי
  choice: 临到
  rationale: 该叙事形式承接上文并引出新的发展；汉语先知话语惯用“……的话临到……”自然表达，无须机械译出“于是发生”。
- source_word: דְבַר
  choice: 话
  rationale: 与神名构成固定的先知启示用语；“话”既保留原文的公式性，也不过度解释为“信息”。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按神名四字母יהוה的通行学术拟音译出专名，以区别于“主”这一称号。
- source_word: אֵלָיו
  choice: 他
  rationale: 介词אֶל加第三人称单数阳性后缀，表示话语所临到的对象；根据紧接的上文，指以利亚。
- source_word: לֵאמֹר
  choice: 说
  rationale: 该不定式是引出直接引语的标准形式；译作“说”简洁自然。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用以色列之神的专名。译作“雅威”保留专名性质，不以称号“主”取代；脚注说明传统汉译，便于读者辨识。
translation_notes:
  register: 采用现代、庄重而简洁的叙事语言，并保留“……的话临到……说”这一先知启示公式。
