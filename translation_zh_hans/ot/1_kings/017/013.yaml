base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/013.yaml
  text: And Elijah said to her[a], “Do not fear. Go, do as you have said. But first make me a small cake from there and bring it out to me[b], and afterward make some for yourself and for your son.”
translation:
  language: zh_hans
  text: 以利亚对她说：“不要怕。去吧[a]，照你所说的做。不过，要先从那里给我做一个小饼[b]，拿出来给我；然后再给你和你儿子做。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “去吧”所译的希伯来语动词字面意思是“来”，在这里用作催促对方着手行动的话。
    reason: lexical_alternative
  - marker: b
    text: “小饼”也可译作“小块烤饼”；希伯来语 עֻגָה 指烤成的饼，未明确说明具体形状。
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּירְאִי
  choice: 不要怕
  rationale: 准确表达否定命令，简洁自然，也保留先知安慰和劝勉的语气。
- source_word: בֹּאִי
  choice: 去吧
  rationale: 该词字面可译“来”，但在这一连串命令中起敦促对方行动的作用；按当前场景译为“去吧”更符合现代汉语。
- source_word: עֲשִׂי כִדְבָרֵךְ
  choice: 照你所说的做
  rationale: 自然表达“按你的话行”的意思，指照她刚才所述的打算去做。
- source_word: אַךְ
  choice: 不过
  rationale: 在此对前一句作限制和转折，引出必须先为以利亚预备食物的要求。
- source_word: מִשָּׁם
  choice: 从那里
  rationale: 保留原文的空间指示语及其简略性，不把所指对象明说为面或油。
- source_word: עֻגָה קְטַנָּה
  choice: 一个小饼
  rationale: עֻגָה指烤制的饼或小圆饼；“小饼”在现代汉语中自然，也不对形状和做法作过度限定。
- source_word: בָרִאשֹׁנָה
  choice: 先
  rationale: 明确传达时间上的优先次序。
- source_word: וְהוֹצֵאתְ לִי
  choice: 拿出来给我
  rationale: 体现יצא使役式“带出、拿出”的含义，同时符合汉语表达。
- source_word: וְלָךְ וְלִבְנֵךְ תַּעֲשִׂי
  choice: 再给你和你儿子做
  rationale: 宾语承接上文而省略，符合汉语习惯；“再”也与后面的时间顺序相呼应。
- source_word: בָאַחֲרֹנָה
  choice: 然后再
  rationale: 表达在给以利亚做完之后才为她和儿子预备的先后关系。
theological_decisions:
- issue: 以利亚要求寡妇先给自己食物可能引发的伦理或神学张力
  choice: 直接保留“先给我……然后再给你和你儿子”的次序
  alternative: 弱化、解释或合理化以利亚的要求
  rationale: 希伯来文明确强调以利亚所得在先、寡妇和儿子所得在后；译文不替原文消解这一张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。命令句保持简洁，保留原文的行动次序和“从那里”的含蓄指代；不加入对以利亚要求的解释或辩护。
