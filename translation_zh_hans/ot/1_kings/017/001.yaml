  text: וַ/יֹּאמֶר֩ אֵלִיָּ֨הוּ הַ/תִּשְׁבִּ֜י מִ/תֹּשָׁבֵ֣י גִלְעָד֮ אֶל אַחְאָב֒ חַי יְהוָ֞ה אֱלֹהֵ֤י יִשְׂרָאֵל֙ אֲשֶׁ֣ר עָמַ֣דְתִּי לְ/פָנָ֔י/ו אִם יִהְיֶ֛ה הַ/שָּׁנִ֥ים הָ/אֵ֖לֶּה טַ֣ל וּ/מָטָ֑ר כִּ֖י אִם לְ/פִ֥י דְבָרִֽ/י־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/001.yaml
  text: And Elijah the Tishbite[a], from the inhabitants of Gilead, said to Ahab, “As Yahweh, the God of Israel, lives, before whom I stand, there will be neither dew nor rain in these years[c][b], except by my word.”
translation:
  language: zh_hans
  text: 基列居民中的提斯比人以利亚[a]对亚哈说：“我指着永活的雅威——以色列的上帝、我侍立在他面前的那一位——起誓：这几年必不降露，也不下雨[b]，除非照我的话[c]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“住在基列的提斯比人”。原文所用的词可指当地居民或定居者，不一定指当地出生的人。
    reason: lexical_alternative
  - marker: b
    text: 原文采用希伯来语的起誓惯用语，直译近似“若有……”，在这里实际表示强烈否定：“绝不会有……”。
    reason: cultural_note
  - marker: c
    text: 也可译作“除非按我的话”或“除非我发话”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַתִּשְׁבִּי מִתֹּשָׁבֵי גִלְעָד
  choice: 住在基列的提斯比人
  rationale: 将身份称谓与居住地自然结合；תּוֹשָׁבֵי可指居民或定居者，不把它限定为原籍或出生地。
- source_word: חַי יְהוָה
  choice: 我指着……永活的雅威……起誓
  rationale: 这是希伯来语起誓公式；中文明确其起誓功能，同时保留“雅威活着”的核心意象。
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: 以色列的上帝
  rationale: 直接保留原文的关系性称号及其盟约意味。
- source_word: אֲשֶׁר עָמַדְתִּי לְפָנָיו
  choice: 我所侍立在他面前的
  rationale: “侍立”既保留站在上帝面前的具体意象，也传达随侍、服事的含义，而不简化为单纯“事奉”。
- source_word: אִם יִהְיֶה
  choice: 必不……
  rationale: 在起誓语境中，אִם引出省略咒诅后果的强烈否定；中文需将否定意义明说。
- source_word: טַל וּמָטָר
  choice: 不降露，也不下雨
  rationale: 分别保留露水与雨水，并用自然的中文搭配表达。
- source_word: הַשָּׁנִים הָאֵלֶּה
  choice: 这几年
  rationale: 简洁、自然地表达原文所指的一段多年时期。
- source_word: כִּי אִם לְפִי דְבָרִי
  choice: 除非照我的话
  rationale: 保留例外条件和“按我的话”的字面关系，不将先知权柄解释为独立于上帝的能力。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；音译“雅威”保留其专名性质，不以称号替代。
- issue: לְפִי דְבָרִי所表达的先知权柄
  choice: 除非照我的话
  alternative: 除非我发话／除非按我的话
  rationale: 译文保留以利亚的话作为降露下雨之条件的力度，却不额外断定该权柄是否独立行使。
- issue: אֲשֶׁר עָמַדְתִּי לְפָנָיו中的侍立意象
  choice: 我所侍立在他面前的
  alternative: 我所事奉的
  rationale: 保留原文既可指处于上帝面前、又可暗含服事身份的张力，避免只取抽象的“事奉”含义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“侍立”略带经文语体，但能准确承载站在君王或上帝面前随侍的意象；破折号标出“以色列的上帝”是对“雅威”的同位说明。
