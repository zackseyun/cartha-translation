  text: לֵ֣ךְ מִ/זֶּ֔ה וּ/פָנִ֥יתָ לְּ/ךָ֖ קֵ֑דְמָ/ה וְ/נִסְתַּרְתָּ֙ בְּ/נַ֣חַל כְּרִ֔ית אֲשֶׁ֖ר עַל פְּנֵ֥י הַ/יַּרְדֵּֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/003.yaml
  text: Go from here and turn yourself eastward[a], and hide yourself by the Wadi Cherith[c][b], which is east of the Jordan.
translation:
  language: zh_hans
  text: 你离开这里，往东去，藏在基立溪谷[a]旁；这溪谷在约旦河对面[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “溪谷”所译的希伯来语也可指旱溪、山涧或有季节性水流的河道。
    reason: lexical_alternative
  - marker: b
    text: 直译“在约旦河面前”；也可理解为“约旦河东边”。
    reason: lexical_alternative
lexical_decisions:
- source_word: לֵךְ מִזֶּה
  choice: 你离开这里
  rationale: לֵךְ是直接命令，מִזֶּה指从当前所在之处离开；“离开这里”在现代汉语中自然明确。
- source_word: וּפָנִיתָ לְּךָ קֵדְמָה
  choice: 往东去
  rationale: פנה与表示方向的קֵדְמָה合用，意为转向东方。לְּךָ带有涉及主语自身的习语色彩，汉语不必生硬译作“你自己转向”，用“往东去”即可自然表达命令。
- source_word: וְנִסְתַּרְתָּ
  choice: 藏
  rationale: סתר的Nifal形式在此表示使自己隐蔽、躲藏；“藏”简洁自然，并由主语“你”清楚表达反身意义。
- source_word: בְּנַחַל
  choice: 在……溪谷旁
  rationale: נחל可指旱溪、季节性水道、溪谷或其中的溪流。“溪谷”兼顾地形与水道含义；介词ב在此按所在位置自然译作“在……旁”。
- source_word: כְּרִית
  choice: 基立
  rationale: 按希伯来语地名音译，并采用现代中文圣经语境中较熟悉、简洁的形式。
- source_word: אֲשֶׁר עַל פְּנֵי הַיַּרְדֵּן
  choice: 这溪谷在约旦河对面
  rationale: עַל־פְּנֵי在地理描述中可表示“在……前面”或“与……相对”。“对面”较贴近原文的空间表达，也避免在正文中把它直接限定为“约旦河东边”；结合上文“往东去”，读者仍可理解其大致方位。
theological_decisions: []
translation_notes:
  register: 采用自然、庄重而简明的现代标准汉语。保留原文地理表达的开放性，不把“在约旦河面前”无提示地确定为单一方位；“溪谷”则避免让读者误以为这里必有常年流水。
