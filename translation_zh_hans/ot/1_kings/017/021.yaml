  text: וַ/יִּתְמֹדֵ֤ד עַל הַ/יֶּ֨לֶד֙ שָׁלֹ֣שׁ פְּעָמִ֔ים וַ/יִּקְרָ֥א אֶל יְהוָ֖ה וַ/יֹּאמַ֑ר יְהוָ֣ה אֱלֹהָ֔/י תָּ֥שָׁב נָ֛א נֶֽפֶשׁ הַ/יֶּ֥לֶד הַ/זֶּ֖ה עַל קִרְבּֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/021.yaml
  text: Then he stretched himself out over the boy three times[a], and he cried out to Yahweh and said, “Yahweh my God, please let this boy’s life return to him.”
translation:
  language: zh_hans
  text: 于是，他三次伸展身体伏在孩子身上，向耶和华呼求说：“耶和华，我的上帝啊，求你让这孩子的生命[a]回到他里面！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“求你让这孩子的魂回到他里面。”希伯来文直译为：“愿这孩子的 נֶפֶשׁ 回到他的里面。”נֶפֶשׁ 在这里可指“生命”，也可译作“魂”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְמֹדֵד עַל הַיֶּלֶד
  choice: 伏身在孩子身上
  rationale: 罕见的反身动词在此描述以利亚将身体伸展、俯伏在孩子身上的动作。“伏身在……身上”在现代汉语中自然，也保留了实际身体接触；不采用含义生硬的“量自己”。
- source_word: שָׁלֹשׁ פְּעָמִים
  choice: 三次
  rationale: 准确、简洁地表达动作重复三回。
- source_word: וַיִּקְרָא אֶל יְהוָה
  choice: 向耶和华呼求
  rationale: קרא אל 在祷告语境中带有恳切呼告之意；“呼求”既传达紧迫感，又不作过度发挥。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的神圣名字译法，而非以称号“主”替代专名。
- source_word: יְהוָה אֱלֹהָי
  choice: 耶和华我的上帝啊
  rationale: 保留神名、第一人称所属关系和直接呼语的语气；“啊”使现代汉语呼告自然庄重。
- source_word: תָּשָׁב נָא
  choice: 求你使……回到
  rationale: 未完成式在此有祈愿语气，נָא 表示恳求；中文用“求你使”清楚表达迫切而谦恭的请求。
- source_word: נֶפֶשׁ
  choice: 生命
  rationale: 在孩子复生的叙事中，此词首先指使人活着的生命。译作“生命”避免预先限定某种灵魂—身体的人论，同时以脚注保留“魂”这一可能译法。
- source_word: הַיֶּלֶד הַזֶּה
  choice: 这孩子
  rationale: יַלֶד 可指男孩或孩子；上下文已表明其为寡妇的儿子，中文“这孩子”自然且贴合人物直接指称。
- source_word: עַל קִרְבּוֹ
  choice: 回到他里面
  rationale: 较直译地保留“回到其内部”的空间表达，又避免生硬的“内脏”或过度抽象的“内在本体”。
theological_decisions:
- issue: 复生语境中 נֶפֶשׁ 的译法
  choice: 生命
  alternative: 魂
  rationale: “生命”最贴合叙事中孩子恢复生机的请求，并避免把经文强行纳入特定的人论体系。“魂”在词汇和传统上仍有根据，故在脚注中保留，以呈现原文可能引发的神学张力。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“伏身”呈现身体动作，“呼求”传达祷告的迫切；句末感叹号体现恳切呼告。脚注标记置于其所解释的整句之后。
