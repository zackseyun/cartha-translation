  text: וַ/תֹּ֨אמֶר֙ אֶל אֵ֣לִיָּ֔הוּ מַה לִּ֥/י וָ/לָ֖/ךְ אִ֣ישׁ הָ/אֱלֹהִ֑ים בָּ֧אתָ אֵלַ֛/י לְ/הַזְכִּ֥יר אֶת עֲוֺנִ֖/י וּ/לְ/הָמִ֥ית אֶת בְּנִֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/018.yaml
  text: She said to Elijah[a], “What do I have to do with you, man of God? Have you come to me to bring my iniquity to remembrance and to cause my son to die?”
translation:
  language: zh_hans
  text: 她对以利亚说：“神人哪，我与你有什么相干？你到我这里来，是要使人想起我的罪孽[a]，并使我的儿子死吗？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“我的罪”或“我的罪责”。这个希伯来词可以指过犯、罪责，也可以指罪责所带来的重担或后果。
    reason: 保留 עָוֹן 的词义范围，避免只取“恶行”或“罪责”之一。
lexical_decisions:
- source_word: מַה לִּי וָלָךְ
  choice: 我与你有什么相干
  rationale: 这是表达疏离、抗议或责问的希伯来习语；此译法是自然的现代汉语，同时保留寡妇话语中的对抗意味。
- source_word: אִישׁ הָאֱלֹהִים
  choice: 神人
  rationale: 这是先知或神圣使者的固定称号；“神人”保留正式称谓及其圣经语感，避免解释性改写。
- source_word: בָּאתָ אֵלַי
  choice: 你到我这里来
  rationale: 完成式在直接引语中带有针对当前处境的责问语气；汉语如此表达自然，并可与后面的目的问句顺畅衔接。
- source_word: לְהַזְכִּיר
  choice: 使……被记起
  rationale: 该词是 זכר 的使役式，表示使某事被记念或受到注意。被动表达保留使役含义，也不擅自指明是谁记起罪孽。
- source_word: עֲוֺנִי
  choice: 我的罪孽
  rationale: עָוֹן 可指恶行、罪责或罪责所带来的后果。“罪孽”保留其道德分量，又不把含义局限为行为或责任状态中的一项；脚注列出其他可能含义。
- source_word: וּלְהָמִית
  choice: 并使……死
  rationale: מות 的使役式表达导致死亡；“使……死”较贴近其形态和因果意味，而没有强化为更直接的“杀死”。
- source_word: בְּנִי
  choice: 我的儿子
  rationale: 该词明确指儿子，因此按原文性别准确翻译。
theological_decisions:
- issue: 寡妇所说 עֲוֺנִי 的含义
  choice: 我的罪孽
  alternative: 我的罪／我的罪责
  rationale: 寡妇把儿子的死与自己的道德过犯或罪责联系起来。希伯来词同时可能涉及过犯本身、由此产生的罪责以及其后果；正文和脚注保留这种神学张力，不把它单一化。
- issue: 谁记起寡妇的罪孽
  choice: 采用“被记起”，不明说施事者
  alternative: 使神想起我的罪孽／使人想起我的罪孽
  rationale: 原文没有明确说是谁记起；在语境中可能暗含神，但译文不补入原文未明说的施事者，以保存原有含蓄。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“神人”保留传统圣经称号；“我与你有什么相干”传达强烈的责问和疏离；整句按汉语习惯组织为目的问句，同时保留原文的因果控诉和未明说的施事者。
