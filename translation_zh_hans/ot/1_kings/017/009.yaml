base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/009.yaml
  text: Get up[a], go to Zarephath, which belongs to Sidon, and stay there. Look[b], I have commanded a widow there to provide for you.
translation:
  language: zh_hans
  text: “起来，往属西顿的撒勒法去[a]，住在那里。看哪，我已经吩咐[b]那里的一位寡妇供养你。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在西顿境内的撒勒法”，或“西顿附近的撒勒法”。希伯来文直译只是把撒勒法与西顿联系起来，可能表示地域或政治上的归属。
    reason: lexical_alternative
  - marker: b
    text: 或译：“我已经指定那里的一位寡妇供养你。”希伯来文作“我已经吩咐”；即使下文尚未显示寡妇自觉领受了这项吩咐，这个说法也可能是在表达上帝主权的引导。
    reason: alternative_reading
lexical_decisions:
- source_word: ק֣וּם
  choice: 起来
  rationale: קום的祈使式表示起身行动；“起来”自然、简明，并保留命令语气。
- source_word: לֵ֤ךְ
  choice: 去
  rationale: הלך的祈使式在行动命令中通常表示“去”；此处与目的地连用，译作“往……去”符合现代汉语。
- source_word: צָרְפַתָה֙
  choice: 撒勒法
  rationale: 这是地名；采用现代中文圣经读者熟悉的音译。“-ה”在此表示方向，已由“往……去”体现。
- source_word: אֲשֶׁר לְצִידוֹן
  choice: 西顿所属的
  rationale: 介词לְ在这里把撒勒法与西顿联系起来，可能表示地域或政治归属；“西顿所属的”保留这种关联，避免武断限定为城内或邻近。
- source_word: וְיָשַׁבְתָּ שָׁם
  choice: 住在那里
  rationale: 完成式接续前面的祈使式，具有命令或行动结果的功能。ישׁב在此指居留，“住在那里”比“停留”更能表达一段时间的居住。
- source_word: הִנֵּה
  choice: 看哪
  rationale: 该指示语用于唤起注意；“看哪”保留其话语功能和庄重感，又不至于晦涩。
- source_word: צִוִּיתִי
  choice: 我已经吩咐
  rationale: צוה的Piel完成式直译为“我已经吩咐/命令”。“吩咐”在上帝对人的言语中自然，并保留原文的直接力度。
- source_word: אִשָּׁה אַלְמָנָה
  choice: 一位寡妇
  rationale: 原文直为“一个女人，一个寡妇”，属同位说明；现代汉语自然合译为“一位寡妇”。
- source_word: לְכַלְכְּלֶךָ
  choice: 供养你
  rationale: כלכל表示维持生计、供应所需；“供养”涵盖食物及持续的生活供应，适合上下文。
theological_decisions:
- issue: 上帝所说“我已经吩咐”如何与寡妇后来似乎并不知情相协调
  choice: 保留“我已经吩咐”的直接表述
  alternative: 译作“我已经安排”或“我已经预备”
  rationale: 原文צוה通常表示“吩咐、命令”。后文没有明确说明寡妇此前是否自觉领受命令；翻译不替叙事化解这一张力，也不把上帝的主权引导解释性地改写成“安排”或“预备”。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“看哪”略带经文语体，用来保留הִנֵּה的提示作用；其余措辞避免古奥。“西顿所属的”有意保留原文地理或政治关系的弹性。
