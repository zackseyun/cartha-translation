  text: Then she said to the king[a], “The report that I heard in my own land about your words and your wisdom was true.”
translation:
  language: zh_hans
  text: 她对王说：“我在本国听到的有关你的事[a]和你的智慧的传闻，确实是真的。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“你的言语”或“你的事迹”。希伯来语在这里也可泛指与你有关的事情。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: 她……说
  rationale: 连续式叙事动词推进情节；现代汉语通常无需另译连接词，主语由上下文补明为“她”。
- source_word: אֶל־הַמֶּלֶךְ
  choice: 对王
  rationale: 准确表达说话的对象，并保留定指的王。
- source_word: אֱמֶת הָיָה הַדָּבָר
  choice: 传闻是真的
  rationale: אֱמֶת在此作表语；הַדָּבָר结合“听到”的语境指所听见的消息或传闻。
- source_word: אֲשֶׁר שָׁמַעְתִּי בְּאַרְצִי
  choice: 我在本国听到……的
  rationale: “本国”自然体现第一人称所属后缀，同时保持地点含义。
- source_word: עַל־דְּבָרֶיךָ
  choice: 有关你的事
  rationale: דְּבָרֶיךָ可指你的言语、事情、事迹或相关情形；正文用范围较宽的“你的事”保留语义弹性，并以脚注说明其他可能。
- source_word: וְעַל־חָכְמָתֶךָ
  choice: 和你的智慧
  rationale: 直接保留与前一短语并列的结构和本段核心概念。
