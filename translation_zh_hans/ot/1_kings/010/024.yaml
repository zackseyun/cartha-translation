base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/024.yaml
  text: And all the earth sought the presence of Solomon[a], to hear his wisdom that God had put in his heart.
translation:
  language: zh_hans
  text: 全地的人都求见所罗门[a]，要听上帝放在他心里的智慧。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“寻求所罗门的面”，是指求见他或寻求觐见的习语。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָל הָאָרֶץ
  choice: 全地的人
  rationale: 原文直译为“全地”，在王权叙事中是概括性的夸张表达，指各地的人；补出“的人”使现代汉语自然，同时保留其广泛范围，不缩窄为本地国土。
- source_word: מְבַקְשִׁים אֶת־פְּנֵי שְׁלֹמֹה
  choice: 都来求见所罗门
  rationale: 分词表示持续或惯常发生的行动；“寻求所罗门的面”是求见、求得觐见的习语。“求见”自然传达其实际含义，脚注保留原文意象。
- source_word: לִשְׁמֹעַ
  choice: 要听
  rationale: 不定式表示目的；“要听”准确而自然地表达各地之人求见所罗门的目的。
- source_word: חָכְמָתוֹ
  choice: 他的智慧
  rationale: 直接体现原文第三人称单数所有格，焦点仍在所罗门所得的智慧。
- source_word: אֲשֶׁר נָתַן אֱלֹהִים בְּלִבּוֹ
  choice: 那上帝赐在他心里的
  rationale: נָתַן 的基本义为“赐、给”；与“在他心里”连用，表达上帝把智慧赋予他的内在生命。“心”保留希伯来语涵盖思想、意志与内在生命的意象。
theological_decisions:
- issue: אֱלֹהִים 的译法
  choice: 上帝
  alternative: 耶和华
  rationale: 本节原文使用 אֱלֹהִים，而非圣约名称 יהוה；译作“上帝”保留该词汇区别，不应改成“耶和华”。
- issue: 智慧的来源
  choice: 上帝赐在他心里的智慧
  alternative: 所罗门自己的智慧
  rationale: 关系从句明确把所罗门的智慧归因于上帝的赐予；译文保持这一因果与神学陈述，不把智慧描述为纯属所罗门自身。
translation_notes:
  register: 采用现代、庄重且易懂的叙事语言。“全地的人”既保留古代王权语境中的广泛概括，又避免现代汉语把无生命的“全地”写成主动求见者。“求见”比直译“寻求……的面”自然，原文意象由脚注说明。
