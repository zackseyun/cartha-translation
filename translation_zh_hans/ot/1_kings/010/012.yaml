  text: וַ/יַּ֣עַשׂ הַ֠/מֶּלֶךְ אֶת עֲצֵ֨י הָ/אַלְמֻגִּ֜ים מִסְעָ֤ד לְ/בֵית יְהוָה֙ וּ/לְ/בֵ֣ית הַ/מֶּ֔לֶךְ וְ/כִנֹּר֥וֹת וּ/נְבָלִ֖ים לַ/שָּׁרִ֑ים לֹ֣א בָֽא כֵ֞ן עֲצֵ֤י אַלְמֻגִּים֙ וְ/לֹ֣א נִרְאָ֔ה עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/012.yaml
  text: The king made the almug wood into supports for the house of Yahweh and for the king’s house[a], and lyres and harps for the singers. Never before had such almug wood come[b], nor has any been seen to this day.
translation:
  language: zh_hans
  text: 王用阿勒木[a]为雅威的殿和王宫做了支撑构件[b]，又为歌唱的人制作里拉琴和竖琴。从未有这样的阿勒木运来，直到今日也未曾见过。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译作“亚革木”。这个树种无法确定；相关经文传统中也出现不同拼写。
    reason: 说明罕见木材名称的词形差异及物种不确定性。
  - marker: b
    text: “支撑构件”所译的希伯来词十分罕见，也可能指台阶、栏杆等建筑构件。
    reason: 保留罕见建筑术语的词义不确定性。
lexical_decisions:
- source_word: עֲצֵי הָאַלְמֻגִּים
  choice: 阿勒木
  rationale: 该词所指的具体树种不确定，因此按希伯来语音译，不贸然认定为檀香木等现代树种；在汉语中以“木”表达木材的集合意义。
- source_word: מִסְעָד
  choice: 支撑构件
  rationale: 这是罕见且含义不确定的建筑术语；“支撑构件”可涵盖支架、栏杆或台阶等可能含义，同时避免作过度具体的判断。
- source_word: לְבֵית יְהוָה
  choice: 为雅威的殿
  rationale: בֵית在此指敬拜建筑，译作“殿”比直译“家”自然，也与后面的王宫清楚区分。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见音译呈现希伯来文神名，不以称号替代专名。
- source_word: וּלְבֵית הַמֶּלֶךְ
  choice: 和王宫
  rationale: 此处“王的房屋”在语境中即王的宫殿；译作“王宫”简洁自然。
- source_word: וְכִנֹּרוֹת וּנְבָלִים
  choice: 里拉琴和竖琴
  rationale: 用两个不同的现代乐器类别对应两种古代弦乐器，保留原文的区分；具体形制仍不能完全确定。
- source_word: לַשָּׁרִים
  choice: 为歌唱的人
  rationale: 该词源自“歌唱”，直指歌唱者；如此译法比泛称“乐师”更准确。
- source_word: לֹא בָא כֵן עֲצֵי אַלְמֻגִּים
  choice: 从未有这样的阿勒木运来
  rationale: כֵן可表示“如此、这样的”；译文保留陈述的概括性，不擅自限定为数量、品质或某一明确时间方向。
- source_word: וְלֹא נִרְאָה עַד הַיּוֹם הַזֶּה
  choice: 直到今日也未曾见过
  rationale: 保留叙述者以“今日”为止的持续否定，并自然承接前句所说的这种木材。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名；音译“雅威”保留专名性质，不用称号“主”取代，也不采用较晚形成的混合读音。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“雅威的殿”和“王宫”形成自然对举；罕见木材名称采用音译，建筑术语采用较宽泛的表达，并用脚注保留真实的不确定性。
