  text: Blessed are your men; blessed are these your servants, who stand before you continually and hear your wisdom.
translation:
  language: zh_hans
  text: 你的臣属有福了！你这些臣仆有福了！他们常侍立在你面前，聆听你的智慧。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: 有福了
  rationale: 表达一种令人羡慕的蒙福、幸福状态；“有福了”既保留庄重的称福语气，也符合现代中文圣经语体。
- source_word: אֲנָשֶׁיךָ
  choice: 你的臣属
  rationale: 原词为阳性复数“你的人”，在王宫场景中指王身边的男性臣属或侍从；“臣属”比泛指全民的“百姓”更贴合语境，也比生硬的“你的男人”自然。
- source_word: עֲבָדֶיךָ
  choice: 你这些臣仆
  rationale: עֶבֶד可指奴隶、仆人或臣仆；此处是王宫侍奉场景，“臣仆”既体现从属服侍关系，又不无根据地突出奴隶身份。
- source_word: הָעֹמְדִים לְפָנֶיךָ
  choice: 侍立在你面前
  rationale: 保留“站在你面前”的具体形象，同时以“侍立”传达宫廷中随侍、供职的惯用含义。
- source_word: תָּמִיד
  choice: 常常
  rationale: 表示持续或经常性的侍奉；“常常”自然地表达反复、持续状态，而不过度强调毫无间断。
- source_word: הַשֹּׁמְעִים אֶת חָכְמָתֶךָ
  choice: 聆听你智慧的话语
  rationale: 原文直译为“听你的智慧”，是以“智慧”指智慧的言谈和教诲；中文补出“话语”以避免表达生硬，但不增添新的实质内容。
theological_decisions: []
translation_notes:
  register: 采用庄重而清楚的现代标准普通话。“有福了”保留称福句的抬高语气；“臣属、臣仆、侍立”营造王宫语境，但仍是普通读者易懂的现代表达。两个称福分句保持原文的平行与强调。
