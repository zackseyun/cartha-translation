  text: וְ/הַ/מֶּ֨לֶךְ שְׁלֹמֹ֜ה נָתַ֣ן לְ/מַֽלְכַּת שְׁבָ֗א אֶת כָּל חֶפְצָ/הּ֙ אֲשֶׁ֣ר שָׁאָ֔לָה מִ/לְּ/בַד֙ אֲשֶׁ֣ר נָֽתַן לָ֔/הּ כְּ/יַ֖ד הַ/מֶּ֣לֶךְ שְׁלֹמֹ֑ה וַ/תֵּ֛פֶן וַ/תֵּ֥לֶךְ לְ/אַרְצָ֖/הּ הִ֥יא וַ/עֲבָדֶֽי/הָ־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/013.yaml
  text: And King Solomon gave the queen of Sheba all that she desired[a], whatever she asked, besides what he gave her according to the hand of King Solomon. Then she turned and went to her own land, she and her servants.
translation:
  language: zh_hans
  text: 所罗门王把示巴女王所想要、所求的一切都给了她；此外，他还照所罗门王的财力[a]给了她别的。随后，她和她的仆从转身回自己的国去了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“照所罗门王的手”；这里的“手”可指他的能力、财力或慷慨程度。
    reason: 说明希伯来语习语的字面形式与未完全限定的含义。
lexical_decisions:
- source_word: נָתַן
  choice: 给了／赠给
  rationale: 两处均为常用动词“给”；按现代汉语搭配，前一处译“给了”，后一处涉及额外礼物，译“赠给”，不改变词义。
- source_word: מַלְכַּת שְׁבָא
  choice: 示巴女王
  rationale: 保留王室称号，并按通行圣经地名译作“示巴”。
- source_word: כָּל חֶפְצָהּ אֲשֶׁר שָׁאָלָה
  choice: 她所想要、所求的一切
  rationale: חֵפֶץ表示愿望或想要之物，שׁאל在此表示求取；并列译法保留两层表达，同时符合现代汉语。
- source_word: מִלְּבַד
  choice: 此外
  rationale: 本处表示在满足她所求之外另有赠予；“此外”简洁自然。
- source_word: כְּיַד הַמֶּלֶךְ שְׁלֹמֹה
  choice: 按自己的能力
  rationale: 原文直译为“照所罗门王的手”，其中“手”可指能力、财力或慷慨程度。正文采用自然汉语“按自己的能力”，脚注保留字面形式及其语义范围。
- source_word: וַתֵּפֶן וַתֵּלֶךְ לְאַרְצָהּ
  choice: 转身往自己的国土去了
  rationale: 分别保留“转身”和“前往”的叙事动作；“自己的国土”对应带第三人称阴性单数后缀的“她的国土”。
- source_word: הִיא וַעֲבָדֶיהָ
  choice: 她和她的仆从
  rationale: עֲבָדִים可指奴仆、臣仆或随从；王室出行语境中“仆从”既直接又不过度限定其具体社会身份。
theological_decisions:
- issue: 如何表达 כְּיַד הַמֶּלֶךְ שְׁלֹמֹה 的“手”这一习语
  choice: 正文译“按自己的能力”，并以脚注说明字面及语义范围
  alternative: 照所罗门王的手／按所罗门王的慷慨程度
  rationale: 字面译法在现代汉语中难以理解，而单译“慷慨”又可能把可指能力、财力或 generous giving 的开放语义收窄。正文采用较宽的“能力”，脚注保存原文形象和其他可能含义。
- issue: 王室语境中 עֲבָדֶיהָ 的身份
  choice: 她的仆从
  alternative: 她的仆人／她的臣仆／她的奴隶
  rationale: 上下文只表明这些人随同女王，并未具体界定其法律身份；“仆从”避免无根据地强化为奴隶，也能涵盖王室侍从。
translation_notes:
  register: 采用现代、庄重而易懂的叙事体。“转身往自己的国土去了”保留原文连续的两个动作；“按自己的能力”避免生硬直译，并借脚注呈现原文习语。
