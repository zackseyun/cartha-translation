base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/023.yaml
  text: So King Solomon surpassed all the kings of the earth in wealth and wisdom[a].
translation:
  language: zh_hans
  text: 所罗门王在财富和智慧方面，胜过地上所有的君王。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或较为直译：“所罗门王在财富和智慧方面，比地上所有的君王都更为尊大。”
    reason: 说明וַיִּגְדַּל可较形式对应地译为“变得更为尊大／更大”，正文“胜过”则自然表达其比较含义。
lexical_decisions:
- source_word: וַיִּגְדַּל
  choice: 胜过
  rationale: גדל与比较介词מִן连用，表示变得更大或高于他者；“胜过”在现代汉语中自然、明确地表达比较意义，又不额外强化原文。
- source_word: הַמֶּלֶךְ שְׁלֹמֹה
  choice: 所罗门王
  rationale: 将带定冠词的王衔与专名按现代汉语惯用次序译为“所罗门王”，兼顾准确与流畅。
- source_word: מִכֹּל מַלְכֵי הָאָרֶץ
  choice: 地上所有的君王
  rationale: אֶרֶץ可指“地”或“土地”；在国际性君王比较的语境中，“地上”保留广泛范围，也比“世界上”略贴近原文措辞。
- source_word: לְעֹשֶׁר
  choice: 在财富方面
  rationale: עֹשֶׁר指财富、富足；介词לְ在此标明比较所涉及的领域，译作“在……方面”清楚自然。
- source_word: וּלְחָכְמָה
  choice: 和智慧方面
  rationale: חָכְמָה意为“智慧”；与“财富”并列，共同限定所罗门胜过其他君王的方面。汉语中共用一个“在”和“方面”即可。
- source_word: וַ
  choice: 不单独译出
  rationale: 此处叙事连接词承接并总结上文；现代汉语可通过语篇衔接自然表达，无须机械译作“于是”或“并且”。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而通顺的标准普通话。“君王”比“国王”略具经文叙事的庄重感，但仍为普通读者易懂；脚注标记已在正文中对应出现。
