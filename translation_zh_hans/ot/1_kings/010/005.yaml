base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/005.yaml
  text: the food of his table[a], the seating of his servants, the attendance of his ministers, their clothing, his cupbearers, and his burnt offering that he offered at the house of Yahweh, there was no more breath in her.
translation:
  language: zh_hans
  text: 以及他筵席上的食物、臣仆的座次、侍从的侍立和他们的服装、司酒官，还有他在耶和华殿所献的燔祭[a]，她惊叹得透不过气来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他上耶和华殿的台阶。”
    reason: alternative_reading
lexical_decisions:
- source_word: מַאֲכַל שֻׁלְחָנוֹ
  choice: 他席上的食物
  rationale: 直译桌席上的食物，同时自然表达王室筵席的供应。
- source_word: מוֹשַׁב עֲבָדָיו
  choice: 臣仆的座次
  rationale: מוֹשָׁב可指座位或就座安排；“座次”准确传达宫廷中有秩序的席位安排。
- source_word: מַעֲמַד מְשָׁרְתָיו
  choice: 侍从的站班
  rationale: 保留מַעֲמָד所含“站立、岗位”的具体意象，也体现侍从按班侍立的宫廷场景。
- source_word: מַלְבֻּשֵׁיהֶם
  choice: 他们的服装
  rationale: 现代、清楚地表达衣着，也适合描写宫廷仪仗。
- source_word: מַשְׁקָיו
  choice: 司酒的人
  rationale: 在王室语境中该复数形式最自然地指负责奉酒的人员，而非饮料本身。
- source_word: עֹלָתוֹ אֲשֶׁר יַעֲלֶה בֵּית יְהוָה
  choice: 他在耶和华殿里献上的燔祭
  rationale: 正文依马所拉元音将עֹלָתוֹ理解为“他的燔祭”；动词יַעֲלֶה与献燔祭的表达相合。另一个基于辅音文本的“上殿台阶/上行”读法收入脚注。
- source_word: בֵּית יְהוָה
  choice: 耶和华殿
  rationale: “殿”在现代中文中自然指上帝的圣殿；将神名יהוה音译为通行的“耶和华”。
- source_word: וְלֹא הָיָה בָּהּ עוֹד רוּחַ
  choice: 她就惊叹得透不过气来
  rationale: 原文直义为“她里面再没有气息”；此译保留气息意象，并以自然中文表达因震撼而屏息的惯用含义。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: “耶和华”是现代简体中文圣经语境中辨识度最高的专名形式；不以“主”替代原文直接出现的神名。
- issue: עֹלָתוֹ在宫廷陈列末项中的含义
  choice: 他献上的燔祭
  alternative: 他上耶和华殿的台阶（或上行仪仗）
  rationale: 马所拉元音明确支持“燔祭”，故置于正文；辅音文本容许与“上行”相关的理解，且古译本存在支持，因此以脚注保留真实的文本解释歧义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“座次”“站班”“司酒的人”使宫廷场景清楚，并区分臣仆、侍从和司酒人员。结句用自然汉语传达原文“再没有气息”的惊叹效果。
