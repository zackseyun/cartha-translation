base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/016.yaml
  text: King Solomon made two hundred large shields of beaten gold[b][a]; six hundred shekels of gold went onto each shield.
translation:
  language: zh_hans
  text: 所罗门王用捶打过的金子制成二百面大盾牌[b]；每面盾牌用六百舍客勒金子[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“六百金子上在那一面盾牌上”；“舍客勒”是按上下文补出的重量单位。
    reason: lexical_alternative
  - marker: b
    text: 这里译作“大盾牌”的希伯来词，可能特指大型盾牌，与下一节提到的较小盾牌有所区别。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: 制成
  rationale: 此处 עשה 表示制作器物；“制成”既自然，也能体现制作完成的意思。
- source_word: הַמֶּלֶךְ שְׁלֹמֹה
  choice: 所罗门王
  rationale: 按现代汉语习惯将王号置于人名之后，清楚保留原文所指。
- source_word: מָאתַיִם
  choice: 二百
  rationale: 直接对应原文基数词。
- source_word: צִנָּה
  choice: 大盾牌
  rationale: צִנָּה 通常指较大的盾牌，并可能有别于下一节 מָגֵן 所指的较小盾牌；译作“大盾牌”保留这种词汇区别。
- source_word: זָהָב שָׁחוּט
  choice: 锤打的金子
  rationale: שָׁחוּט 在这里描述金子经捶打加工；“锤打的金子”保留制作工艺，又符合现代汉语表达。
- source_word: שֵׁשׁ מֵאוֹת זָהָב
  choice: 金子六百舍客勒
  rationale: 原文只说“六百金子”，未明说计量单位；上下文通常理解为重量单位“舍客勒”，正文补出以便读者理解，并以脚注说明。
- source_word: יַעֲלֶה עַל
  choice: 用
  rationale: 原文字面为“上到……之上”，在制作盾牌的语境中表示每面盾牌所耗用或覆盖的金量；译作“用”在汉语中清楚自然，不强行断定更具体的加工方式。
- source_word: הַצִּנָּה הָאֶחָת
  choice: 每面盾牌
  rationale: 字面是“那一面盾牌”，在此具有逐一分配的意思；汉语用“每面盾牌”准确表达二百面盾牌各自所用的金量。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“面”作为盾牌的量词符合当代用法；“舍客勒”保留古代重量单位，避免换算造成虚假的精确度。正文保持原文两分句结构，并用脚注保留计量单位省略和盾牌类别的词义信息。
