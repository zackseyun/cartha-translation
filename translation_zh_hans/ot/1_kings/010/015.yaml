  text: besides what came from the traveling merchants and from the trade of the merchants[c][b][a], and from all the kings of Arabia and the governors of the land.
translation:
  language: zh_hans
  text: 此外，另有来自往来商人[a]、商贩的贸易，以及阿拉伯众王[b]和各地地方长官[c]的收入。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “往来商人”或译“周游各处的人”；希伯来语原文含义较难确定，也可能泛指巡回商贩。
    reason: lexical_alternative
  - marker: b
    text: “阿拉伯”或译“混杂民族”；希伯来语 עֶרֶב 在某些语境中可有后一含义，但这里译作“阿拉伯”更切合上下文。
    reason: alternative_reading
  - marker: c
    text: “地方长官”也可译作“总督”或“行省长官”。
    reason: lexical_alternative
lexical_decisions:
- source_word: לְבַד
  choice: 此外，还有
  rationale: 承接上一节所列的金子总数，表示除该项来源之外另有收入；现代汉语中自然清楚。
- source_word: מֵאַנְשֵׁי הַתָּרִים
  choice: 从往来商人所得的
  rationale: 该短语含义较难确定；תָּרִים 基本指四处行走的人，在商业语境中很可能指巡回或往来的商人。补出“所得的”，使其作为收入来源与上下文衔接。
- source_word: וּמִסְחַר הָרֹכְלִים
  choice: 以及商贩的贸易收入
  rationale: מִסְחַר 指贸易、商业往来；רֹכְלִים 指从事贩运交易的人。译作“贸易收入”明确表达本节所列的是王室收入来源。
- source_word: וְכָל מַלְכֵי הָעֶרֶב
  choice: 并阿拉伯众王
  rationale: 在此地缘政治名单中，עֶרֶב 最可能指阿拉伯或阿拉伯诸族；译为“阿拉伯众王”简明，并保留“众王”的复数含义。
- source_word: וּפַחוֹת הָאָרֶץ
  choice: 和各地总督
  rationale: פַחוֹת 指受更高权力管辖的地方行政长官。“各地总督”自然表达其职务和辖区，又避免采用时代色彩过强的“总督/行省长官”之外来专名。
- source_word: implicit revenue relation
  choice: 所进贡的
  rationale: 原文只并列收入来源，并未明说动词；根据上一节的年度收入语境，为诸王和总督补出“所进贡的”，使汉语句法完整，同时不把它误作商贸收入。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。正文顺着上一节“每年所得的金子”来理解省略成分，以“此外，还有……所进贡的”构成完整句子。对两个商旅群体不强行合并，并以脚注保留 מֵאַנְשֵׁי הַתָּרִים 的真实歧义。
