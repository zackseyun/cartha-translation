base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/028.yaml
  text: And the importation of the horses that belonged to Solomon was from Egypt and Kue[b][a]; the king’s merchants would obtain them from Kue at a price.
translation:
  language: zh_hans
  text: 所罗门的马匹从埃及和古厄[a][b]进口；王的商人从古厄按价购入这些马匹。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节的希伯来词“מִקְוֵה”意义不确定；它可能是地名“古厄”（大概在基利家一带），也可能是普通名词，意为“马群”或“集合的一群”。
    reason: cultural_note
  - marker: b
    text: 按这句困难希伯来文的另一种读法，可译为：“所罗门的马匹从埃及进口，也来自一群马；王的商人按价购取一群马。”
    reason: lexical_alternative
lexical_decisions:
- source_word: מוֹצָא
  choice: 进口
  rationale: 该词可指“出去、来源”，在本节马匹贸易的语境中具有输入或贸易来源之意；译作“进口”自然地表明马匹进入所罗门贸易体系的方向。
- source_word: הַסּוּסִים אֲשֶׁר לִשְׁלֹמֹה
  choice: 所罗门的马
  rationale: 希伯来语直译近于“给所罗门的马”；中文所有格既简洁，也可自然涵盖归属或供其使用的意思。
- source_word: מִמִּצְרָיִם
  choice: 从埃及
  rationale: 标准地名译法。
- source_word: מִקְוֵה / מִקְוֵה
  choice: 古厄／从古厄
  rationale: 此词意义有争议；在两处均按地名理解，与“埃及”并列，且符合贸易来源地的语境。中文采用地名“古厄”，同时以脚注保留普通名词的另一种读法。
- source_word: סֹחֲרֵי הַמֶּלֶךְ
  choice: 王的商人
  rationale: 指为王室从事贸易的人员；“商人”是自然、清楚的现代中文。
- source_word: יִקְחוּ
  choice: 购取
  rationale: 该动词本义为“拿、取得”；结合“按价”这一商业表达，译作“购取”能清楚传达交易语境。
- source_word: בִּמְחִיר
  choice: 按价
  rationale: 表示以某一价格进行交易；“按价”简洁自然，又不擅自说明具体价额或固定税率。
