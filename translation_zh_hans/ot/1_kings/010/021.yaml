  text: וְ֠/כֹל כְּלֵ֞י מַשְׁקֵ֨ה הַ/מֶּ֤לֶךְ שְׁלֹמֹה֙ זָהָ֔ב וְ/כֹ֗ל כְּלֵ֛י בֵּֽית יַ֥עַר הַ/לְּבָנ֖וֹן זָהָ֣ב סָג֑וּר אֵ֣ין כֶּ֗סֶף לֹ֥א נֶחְשָׁ֛ב בִּ/ימֵ֥י שְׁלֹמֹ֖ה לִ/מְאֽוּמָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/021.yaml
  text: All King Solomon’s drinking vessels were gold[a], and all the vessels of the House of the Forest of Lebanon were pure gold[b]. Silver was not considered anything in the days of Solomon.
translation:
  language: zh_hans
  text: 所罗门王所有的饮器均为金制；黎巴嫩林宫里所有的器皿也均为精金[a]制成。在所罗门的时代，银子算不得什么[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“炼净的金子”。
    reason: lexical_alternative
  - marker: b
    text: 或译“银子不被看为有任何价值”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּלֵי מַשְׁקֵה
  choice: 饮器
  rationale: כְּלֵי泛指器皿，מַשְׁקֵה限定其供饮用；“饮器”简洁而不把范围缩窄为杯子或酒器。
- source_word: זָהָב
  choice: 金的
  rationale: 这是表示材质的普通用词；译作“金的”自然表达这些饮器由金制成，并保留本节对黄金的强调。
- source_word: בֵּית יַעַר הַלְּבָנוֹן
  choice: 黎巴嫩林宫
  rationale: 这是特指所罗门的一座王室建筑；“林宫”既保留“林”的名称特征，也用现代汉语自然表达这里的בֵּית所指的宫殿建筑。
- source_word: זָהָב סָגוּר
  choice: 精金
  rationale: סָגוּר修饰金，表示品质纯净或经过炼净的金；“精金”庄重简洁，也避免“纯金”可能过度强调器皿全为实心金制。
- source_word: לֹא נֶחְשָׁב לִמְאוּמָה
  choice: 算不得什么
  rationale: 该表达不是说银子不存在，而是说银子不被看重、算不上有价值；“算不得什么”自然保留原文轻视其价值的语气。
- source_word: בִּימֵי שְׁלֹמֹה
  choice: 所罗门在位的日子
  rationale: 原文直指“所罗门的日子”；在王室叙事中补出“在位”符合语境，使现代读者清楚这是指他统治时期。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“饮器”避免缩窄为“杯子”，“黎巴嫩林宫”作为建筑专名处理；分号呈现前两句并列，末句突出所罗门时代金银价值对比。
