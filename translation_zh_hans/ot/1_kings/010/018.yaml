lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: 又造了
  rationale: 叙事性 wayyiqtol 推进事件；结合上文，以“又”自然承接所罗门的其他建造活动。
- source_word: הַמֶּלֶךְ
  choice: 王
  rationale: 定指语境中的所罗门；现代汉语在身份明确时用“王”简洁自然。
- source_word: כִּסֵּא
  choice: 宝座
  rationale: 王室语境明确指君王的座位，“宝座”比一般的“座位”更准确。
- source_word: שֵׁן
  choice: 象牙
  rationale: 该词本义为“牙齿”，在材料名称及本结构中指象牙。
- source_word: גָּדוֹל
  choice: 宏伟的
  rationale: 此处既可能涉及尺寸，也彰显王室气派；“宏伟”比单纯的“大”更自然地保留两方面含义。
- source_word: וַיְצַפֵּהוּ
  choice: 用……包裹
  rationale: צפה 在工艺语境中表示以某种材料覆盖或包覆；“用精金包裹”符合现代汉语表达。
- source_word: זָהָב מוּפָז
  choice: 精金
  rationale: מוּפָז 表示品质上乘的金，确切技术含义并不完全确定；“精金”简洁传达精炼、纯净或优质之意，同时以脚注保留其他译法。
