- from: 王在海上有他施船只，与希兰的船只一同航行。每三年，他施船只来一次，运来金银、象牙、猿猴和孔雀。[a]
  to: 王有他施船只在海上，与希兰的船只同行。每三年一次，他施船只到达，运来金银、象牙、猿猴和孔雀。[a]
  rationale: 修正脚注中的词义错误，并将“一同航行”改为较不具体的“同行”，以更贴近原文简略表述。其余货物名称、时间间隔和“他施船只”均予保留。
