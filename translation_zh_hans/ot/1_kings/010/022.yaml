base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/022.yaml
  text: For the king had ships of Tarshish at sea with Hiram’s ships. Once every three years the ships of Tarshish would come, carrying gold and silver, ivory, apes, and peacocks.
translation:
  language: zh_hans
  text: 王有他施船只在海上，与希兰的船只同行。每三年一次，他施船只到达，运来金银、象牙、猿猴和孔雀。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “孔雀”所译的希伯来词含义不确定；也有人认为可能指鹦鹉等鸟类。
    reason: 原词תֻכִּיִּים罕见，通常译为“孔雀”，但其具体所指仍有词义争议；脚注改正了将“狒狒”误列为替代释义的问题。
lexical_decisions:
- source_word: אֳנִי תַרְשִׁישׁ
  choice: 他施船只
  rationale: 保留原文属格结构及其可能兼指航往他施或某类远洋船只的含义，不擅自改成“船队”。
- source_word: שֶׁנְהַבִּים
  choice: 象牙
  rationale: 该词在本语境中通常指象牙；用现代汉语常用名称表达。
- source_word: קֹפִים
  choice: 猿猴
  rationale: 指灵长类动物；“猿猴”比单用“猴子”更能保留物种未定的宽泛性。
- source_word: תֻכִּיִּים
  choice: 孔雀
  rationale: 传统且最常见的理解是孔雀，但该罕见词所指动物并不完全确定，故加脚注说明。
theological_decisions: []
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。“与希兰的船只一同航行”补足汉语谓语，使“在海上……与……”关系自然明确；保留“他施船只”的传统称呼和原文歧义。
