base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/011.yaml
  text: Also[a], Hiram’s fleet, which carried gold from Ophir[b], brought from Ophir a very great quantity of almug wood and precious stones.
translation:
  language: zh_hans
  text: 此外，希兰那支从俄斐运载金子的船队[a]，也从俄斐带来了极多的阿尔穆格木[b]和宝石。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“希兰的船”；希伯来语名词是单数，但这里可能是集合用法，指希兰的船队或海运事业。
    reason: lexical_alternative
  - marker: b
    text: 这种木材的确切树种无法确定；这个名称也可音译作“阿尔贡木”，有些译本译作“檀香木”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: 此外……也
  rationale: 保留承接上文并增添信息的语气，同时使现代汉语句式自然。
- source_word: אֳנִי חִירָם
  choice: 希兰的船队
  rationale: אֳנִי在形态上是单数，但此处可集合性地指希兰的海运船只或航运事业；正文采用自然的集合表达，并用脚注保留单数译法。
- source_word: אֲשֶׁר נָשָׂא זָהָב
  choice: 那支从俄斐运载金子的
  rationale: נָשָׂא的基本义为拿、负载、运载；在船运语境中译作“运载”准确自然。
- source_word: מֵאוֹפִיר
  choice: 从俄斐
  rationale: 保留介词所表达的来源意义，并采用该地名通行的中文音译。
- source_word: הֵבִיא
  choice: 带来了
  rationale: 准确表达בוא使役式在此处“带来”的意思，符合货物运输语境。
- source_word: עֲצֵי אַלְמֻגִּים
  choice: 阿勒穆木
  rationale: 按希伯来词作近似音译，以免在树种无法确定时武断译成“檀香木”等具体木材名称。
- source_word: הַרְבֵּה מְאֹד
  choice: 极多的
  rationale: 简洁保留מְאֹד对数量众多的强烈加强语气。
- source_word: וְאֶבֶן יְקָרָה
  choice: 和宝石
  rationale: אֶבֶן虽为单数形式，此处在货物清单中自然可作集合用法；汉语“宝石”本身不强制标明单复数。
