source:
  edition: WLC
  text: יְהִ֨י יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ בָּר֔וּךְ אֲשֶׁר֙ חָפֵ֣ץ בְּ/ךָ֔ לְ/תִתְּ/ךָ֖ עַל כִּסֵּ֣א יִשְׂרָאֵ֑ל בְּ/אַהֲבַ֨ת יְהוָ֤ה אֶת יִשְׂרָאֵל֙ לְ/עֹלָ֔ם וַ/יְשִֽׂימְ/ךָ֣ לְ/מֶ֔לֶךְ לַ/עֲשׂ֥וֹת מִשְׁפָּ֖ט וּ/צְדָקָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/009.yaml
  text: Blessed be Yahweh your God[a], who delighted in you to set you on the throne of Israel. Because Yahweh loved Israel forever, he has made you king to administer justice and righteousness.
translation:
  language: zh_hans
  text: 愿雅威——你的上帝——受称颂！他喜爱你，使你登上以色列的王位。因为雅威永远爱以色列[a]，他就立你为王，施行公正和公义。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作：“因雅威对以色列永远的爱。”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהִי ... בָּרוּךְ
  choice: 愿……受称颂
  rationale: 这是由 היה 的祈愿式与被动分词 בָּרוּךְ 构成的祝颂语；“愿……受称颂”自然保留了祈愿语气。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以通行的汉语音译呈现四字神名，保留其作为以色列上帝之专名的性质，而不以称号替代。
- source_word: אֲשֶׁר חָפֵץ בְּךָ
  choice: 他喜爱你
  rationale: חפץ 与介词 ב 连用，表示对某人的喜悦和悦纳；“喜爱你”简洁自然，并保留温厚的情感色彩。
- source_word: לְתִתְּךָ עַל כִּסֵּא יִשְׂרָאֵל
  choice: 使你坐在以色列的王位上
  rationale: נתן 与“在王位上”连用表达使人登位；此译保留王位意象，也符合现代汉语表达。
- source_word: בְּאַהֲבַת יְהוָה אֶת יִשְׂרָאֵל לְעֹלָם
  choice: 因为雅威永远爱以色列
  rationale: 前缀 ב 在上下文中宜按原因理解；名词 אַהֲבָה 转为汉语动词“爱”较自然，而 לְעֹלָם 修饰这份恒久的爱。
- source_word: וַיְשִׂימְךָ לְמֶלֶךְ
  choice: 所以立你为王
  rationale: שׂים 加 ל 表示任命或设立；“立你为王”准确并具有合宜的王室语体。
- source_word: לַעֲשׂוֹת מִשְׁפָּט וּצְדָקָה
  choice: 施行公平和公义
  rationale: 在君王治理语境中，עשה 表示实际施行；“公平和公义”保留 מִשְׁפָּט 与 צְדָקָה 的并列及其司法、伦理广度。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；音译“雅威”保留专名性质，不以传统音译或称号替代。
- issue: בְּאַהֲבַת יְהוָה 的句法与时态表达
  choice: 因为雅威永远爱以色列
  alternative: 因雅威对以色列永远的爱；雅威因永远爱以色列
  rationale: ב 可表达原因，אַהֲבָה 是名词“爱”。汉语以“因为……爱……”表达最自然；“永远”保留 לְעֹלָם 的持续性，同时不强行限定为只在过去发生的爱。
- issue: 君王使命中 מִשְׁפָּט וּצְדָקָה 的关系
  choice: 公平和公义
  alternative: 公正和正义；审判和公义
  rationale: 并列保留司法治理与道德正直两个相联而不完全相同的层面，避免把二者合并成单一概念。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。祝颂句用“愿……受称颂”，王权语境用“王位”“立……为王”“施行”，既保留原文意象，也避免过度古雅。
