  text: וַ/תָּבֹ֣א יְרוּשָׁלְַ֗מָ/ה בְּ/חַיִל֮ כָּבֵ֣ד מְאֹד֒ גְּ֠מַלִּים נֹשְׂאִ֨ים בְּשָׂמִ֧ים וְ/זָהָ֛ב רַב מְאֹ֖ד וְ/אֶ֣בֶן יְקָרָ֑ה וַ/תָּבֹא֙ אֶל שְׁלֹמֹ֔ה וַ/תְּדַבֵּ֣ר אֵלָ֔י/ו אֵ֛ת כָּל אֲשֶׁ֥ר הָיָ֖ה עִם לְבָבָֽ/הּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/002.yaml
  text: She came to Jerusalem with a very great retinue[a], with camels carrying spices and very much gold and precious stones. She came to Solomon and spoke with him about all that was in her heart.
translation:
  language: zh_hans
  text: 她带着一支极其庞大的随行队伍[a]来到耶路撒冷；骆驼驮着香料、大量黄金和宝石。她来到所罗门那里，同他谈论心中所想的一切。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“带着极其庞大的队伍”，较直译为“带着极大的财富／力量”。希伯来语 חַיִל 可指财富、力量或人数众多的队伍。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּחַיִל כָּבֵד מְאֹד
  choice: 带着一支极其庞大的随行队伍
  rationale: חַיִל 可指实力、财富、军队或大队人马；结合王室出行和外交场景，“随行队伍”最自然，同时不把含义限定为军事力量。“极其庞大”体现 כָּבֵד מְאֹד 所强调的规模。
- source_word: גְּמַלִּים נֹשְׂאִים בְּשָׂמִים
  choice: 骆驼驮着香料
  rationale: 分词 נֹשְׂאִים 描写骆驼当时承载货物的状态；“驮着”符合现代汉语对牲畜载货的自然表达。
- source_word: וְזָהָב רַב מְאֹד
  choice: 大量黄金
  rationale: רַב מְאֹד 强调数量极多；“大量”简洁自然，并保留丰盛之意。
- source_word: וְאֶבֶן יְקָרָה
  choice: 宝石
  rationale: אֶבֶן 虽为单数形式，此处可作集合意义；“宝石”在汉语中无需显式标示复数，也比“贵重的石头”更自然。
- source_word: וַתָּבֹא אֶל שְׁלֹמֹה
  choice: 她来到所罗门面前
  rationale: 重复译出 וַתָּבֹא，呈现叙事进入下一阶段；“来到……面前”自然表达她前去会见所罗门，但不额外暗示正式朝见礼仪。
- source_word: וַתְּדַבֵּר אֵלָיו
  choice: 告诉了他
  rationale: 与后面的内容宾语连用时，“把……都告诉了他”比直译“对他说”更符合现代汉语；仍保留她向所罗门陈说的方向性。
- source_word: אֵת כָּל אֲשֶׁר הָיָה עִם לְבָבָהּ
  choice: 把心里所有的事都告诉了他
  rationale: “心里所有的事”保留 לְבָבָהּ 所指的内在思想、疑问或关切，不将其缩窄为单纯的想法或难题。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。保留原文两次“来到”的推进结构；分号用于区分抵达耶路撒冷及所携物资的描述。脚注保留 חַיִל 的真实词义幅度，正文按旅行与外交语境译为“随行队伍”。
