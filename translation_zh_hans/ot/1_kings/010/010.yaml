base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/010.yaml
  text: And she gave the king one hundred and twenty talents of gold[a], and a very great quantity of spices, and precious stones. Never again did such an abundance of spices come as those that the queen of Sheba gave to King Solomon.
translation:
  language: zh_hans
  text: 她送给王一百二十他连得金子、大量香料和宝石。此后，再没有如此大量的香料[a]来到，像示巴女王送给所罗门王的那样。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 比较句中的希伯来语“香料”是单数（直译“像那香料”），但很可能具有集合含义，所以译作“如此大量的香料”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּתֵּן לַמֶּלֶךְ
  choice: 她送给王
  rationale: 未完成式连续体推进叙事；现代汉语用“她送给王”自然表达动作及间接宾语。
- source_word: מֵאָה וְעֶשְׂרִים כִּכַּר זָהָב
  choice: 一百二十他连得金子
  rationale: כִּכָּר是古代重量单位；保留传统音译“他连得”，避免用不确定的现代重量换算取代原文单位。
- source_word: וּבְשָׂמִים הַרְבֵּה מְאֹד
  choice: 大量香料
  rationale: בְשָׂמִים指芳香香料或香膏类物品；הַרְבֵּה מְאֹד强调数量极多，汉语“大量”简洁自然。
- source_word: וְאֶבֶן יְקָרָה
  choice: 和宝石
  rationale: אֶבֶן虽为单数，在礼物清单中可作集合用法；“宝石”在现代汉语中也可统称此类贵重石料。
- source_word: לֹא בָא ... עוֹד
  choice: 此后，再也没有运来过
  rationale: בוא表示来到或被送到；结合否定词与עוֹד，译为“再也没有运来过”符合礼物进入王国的语境。
- source_word: כַבֹּשֶׂם הַהוּא ... לָרֹב
  choice: 如此大量的香料
  rationale: בֹּשֶׂם在此虽为单数，却很可能作集合名词；לָרֹב表达数量之多，合译为“如此大量的香料”较自然。
- source_word: אֲשֶׁר נָתְנָה מַלְכַּת שְׁבָא לַמֶּלֶךְ שְׁלֹמֹה
  choice: 可与示巴女王送给所罗门王的相比
  rationale: 关系从句给出香料数量比较的基准；如此处理既保留比较关系，也避免汉语中生硬重复“那些香料”。
