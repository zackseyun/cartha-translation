base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/027.yaml
  text: The king made silver as common in Jerusalem as stones[b][a], and he made cedars as plentiful as the sycamore trees that are in the Shephelah.
translation:
  language: zh_hans
  text: 王使银子在耶路撒冷多如石头，又使香柏木多如低地盛产的桑叶无花果树[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文的“桑叶无花果树”（sycamore fig）不是现代汉语中有时称为“洋梧桐”的悬铃木。“低地”通常指犹大山地与沿海平原之间的低丘地带。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן / נָתַן
  choice: 使……多如
  rationale: נתן本义为“给、放置”，但本节两处与比较结构连用，表达君王使银子和香柏木变得极其普遍、丰富；译作“使……多如”既保留使役意味，也符合现代汉语表达。
- source_word: הַמֶּלֶךְ
  choice: 王
  rationale: 原文只称“王”，上下文所指虽是所罗门，本节并未直呼其名，因此不在正文中补出。
- source_word: הַכֶּסֶף
  choice: 银子
  rationale: 这里指作为贵金属和财富的银，现代中文圣经语体中“银子”自然清楚。
- source_word: בִּירוּשָׁלִַם
  choice: 在耶路撒冷
  rationale: 按原文介词的处所意义直译。
- source_word: כָּאֲבָנִים
  choice: 多如石头
  rationale: כ־表示比较；结合נתן所表达的丰富程度，译成“多如石头”简洁自然。
- source_word: הָאֲרָזִים
  choice: 香柏木
  rationale: 原文为“香柏”的复数，在财富和建筑材料的语境中指香柏木材；中文译作“香柏木”比单说“香柏”更清楚。
- source_word: כַּשִּׁקְמִים
  choice: 多如……桑叶无花果树
  rationale: שקמים指近东常见的sycamore fig（Ficus sycomorus），不是现代汉语通常所说的悬铃木；“桑叶无花果树”较准确地区分这一树种。
- source_word: אֲשֶׁר בַּשְּׁפֵלָה
  choice: 谢非拉的
  rationale: שפלה在此特指犹大山地与沿海平原之间的低丘地区，采用音译保留地理专名，并以脚注说明。
- source_word: לָרֹב
  choice: 多如
  rationale: 该短语强调数量繁多；中文将这一意义融入比较式“多如……”，避免生硬地另加“极其繁多”。
