  text: וּ/שְׁלֹשׁ מֵא֤וֹת מָֽגִנִּים֙ זָהָ֣ב שָׁח֔וּט שְׁלֹ֤שֶׁת מָנִים֙ זָהָ֔ב יַעֲלֶ֖ה עַל הַ/מָּגֵ֣ן הָ/אֶחָ֑ת וַ/יִּתְּנֵ֣/ם הַ/מֶּ֔לֶךְ בֵּ֖ית יַ֥עַר הַ/לְּבָנֽוֹן־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/017.yaml
  text: and three hundred shields of beaten gold[a]; three minas of gold went onto each shield[c][b]. And the king put them in the House of the Forest of Lebanon.
translation:
  language: zh_hans
  text: 又造了三百面锤成薄片的金盾牌[a]；每面盾牌用金三弥那[b]。王把这些盾牌放在黎巴嫩林宫[c]里。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “锤成薄片的金”也可译作“锤打的金”。指把金锤薄后覆在盾牌上。
    reason: lexical_alternative
  - marker: b
    text: 原文直译：“三弥那金上到每一面盾牌上。”意思是每面盾牌都用了三弥那金。“弥那”是古代重量单位。
    reason: lexical_alternative
  - marker: c
    text: “黎巴嫩林宫”是所罗门王宫建筑群中一座建筑的名称，也可能用于存放兵器（参王上7:2）。
    reason: cross_reference
lexical_decisions:
- source_word: מָגִנִּים
  choice: 盾牌
  rationale: מָגֵן 指较大的防御性盾牌，与上一节另一类较小的盾牌相对；现代汉语用“盾牌”自然清楚。
- source_word: זָהָב שָׁחוּט
  choice: 锤成薄片的金
  rationale: שָׁחוּט 在这里描述金经捶打、锤薄而制成金片；此译保留加工方式，避免误解为纯金铸成的整面盾牌。
- source_word: שְׁלֹשֶׁת מָנִים
  choice: 三弥那
  rationale: מָנֶה 是古代重量单位；音译为“弥那”可保留历史计量名称，不擅自换算为存在不确定性的现代重量。
- source_word: יַעֲלֶה עַל
  choice: 用金
  rationale: 原文直译为金“上到”盾牌上，表示施加在每面盾牌上的用量；正文以自然汉语表达，脚注保留原文意象。
- source_word: הַמָּגֵן הָאֶחָת
  choice: 每面盾牌
  rationale: 形式上是单数“那一面盾牌”，在此为逐一分配用量的表达，汉语以“每面盾牌”准确传达。
- source_word: וַיִּתְּנֵם
  choice: 把这些盾牌放在
  rationale: נתן 在地点结构中表示放置；补明宾语为盾牌，使现代汉语指代清楚。
- source_word: בֵּית יַעַר הַלְּבָנוֹן
  choice: 黎巴嫩林宫
  rationale: 这是所罗门宫殿建筑群中一座特定建筑的名称；“黎巴嫩林宫”在汉语中简洁庄重，也保留“林”的名称意象。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。开头补出承接上下文的“造了”，使残句在单节引用时通顺；“锤成薄片”明确 שָׁחוּט 的加工含义；计量单位保留音译，并用脚注解释。所有脚注标记均在正文出现。
