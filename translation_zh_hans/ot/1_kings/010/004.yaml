  text: וַ/תֵּ֨רֶא֙ מַֽלְכַּת שְׁבָ֔א אֵ֖ת כָּל חָכְמַ֣ת שְׁלֹמֹ֑ה וְ/הַ/בַּ֖יִת אֲשֶׁ֥ר בָּנָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/004.yaml
  text: When the queen of Sheba saw all the wisdom of Solomon and the house that he had built,[a]
translation:
  language: zh_hans
  text: 示巴女王看见所罗门的一切智慧和他所建造的宫室[a]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他所建造的房屋”。希伯来语“房屋”在这里也可指王宫。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּרֶא
  choice: 看见
  rationale: 该叙事形式推进情节；本节在句法上延续到下一节，因此以“看见”起句并用逗号收束，既自然又保留未完句式。
- source_word: מַלְכַּת שְׁבָא
  choice: 示巴女王
  rationale: 这是表示示巴统治者的组合语；“示巴女王”符合现代汉语通常表达。
- source_word: אֵת
  choice: 不单独译出
  rationale: 这是确定直接宾语标记，现代汉语无需另加对应词。
- source_word: כָּל חָכְמַת שְׁלֹמֹה
  choice: 所罗门的一切智慧
  rationale: 保留כָּל所表达的总体性，并以自然的汉语所属结构呈现原文组合关系。
- source_word: וְהַבַּיִת
  choice: 和……宫室
  rationale: בַּיִת的基本义是“房屋、宅第”；在王室语境中很可能指所罗门的王宫。正文用较庄重且不把范围限定得过窄的“宫室”，脚注保留更直译的可能。
- source_word: אֲשֶׁר בָּנָה
  choice: 他所建造的
  rationale: 作为关系从句修饰前面的宫室；“所”字结构简洁自然，也清楚表明建筑在女王观看之前已经建成。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。因本节的句子延续到下一节，末尾保留逗号。
