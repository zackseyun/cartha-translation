base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/007.yaml
  text: But I did not believe the reports until I came and my own eyes saw it; and behold[a], not even half was told to me. You have surpassed the report that I heard in wisdom and prosperity.
translation:
  language: zh_hans
  text: 我原不相信那些消息，直到亲自前来，亲眼看见；谁知，人告诉我的，连一半也不到。你的智慧和昌盛[a]，超过了我所听到的消息。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “昌盛”或译“富足”或“美好”。希伯来语 טוֹב 含义较广；在这里可指所罗门整体的兴盛与福祉，其中也包括财富。
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶאֱמַנְתִּי
  choice: 相信
  rationale: 此处使役词形表示把所听见的当作真实可信；“相信”自然准确，不额外加入难以置信之类的情绪色彩。
- source_word: לַדְּבָרִים
  choice: 那些传闻
  rationale: 字面可指“那些话”或“那些事”，上下文所指是人们关于所罗门的叙述；“传闻”在现代汉语中能自然表达这一含义。
- source_word: עַד אֲשֶׁר בָּאתִי וַתִּרְאֶינָה עֵינַי
  choice: 直到亲自前来，亲眼看见
  rationale: 原文直译为“直到我来，我的眼睛看见”；两个“亲”突出由耳闻转为亲历亲见，也符合自然汉语表达。
- source_word: וְהִנֵּה
  choice: 谁知
  rationale: 该话语标记在这里引出亲眼所见后的惊讶发现；“谁知”比单纯的“看哪”更符合现代汉语叙事，同时保留惊叹语气。
- source_word: לֹא הֻגַּד לִי הַחֵצִי
  choice: 人告诉我的还不到一半
  rationale: 原文是被动结构“那一半没有被告诉我”，实际表达先前所得消息连实情的一半都不到；转换为汉语泛指主语句更自然，并保留强调。
- source_word: הוֹסַפְתָּ ... אֶל
  choice: 远远超过了
  rationale: יסף与介词אֶל构成比较，表示超出或胜过；“远远”传达前句“不到一半”所加强的程度。
- source_word: חָכְמָה וָטוֹב
  choice: 智慧和昌盛
  rationale: חָכְמָה是“智慧”；טוֹב本义范围较广，可指美好、福祉或兴盛。结合王室荣华与成就的语境，“昌盛”既包含富足，也不把含义缩窄为金钱财富。
- source_word: הַשְּׁמוּעָה אֲשֶׁר שָׁמָעְתִּי
  choice: 我所听到的传闻
  rationale: שְׁמוּעָה指听来的消息或传闻；此译与前文形成首尾呼应，并保持正式而自然的语体。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“亲自前来，亲眼看见”突出耳闻与目睹的对照；“谁知”保留וְהִנֵּה所表达的惊讶。末句维持“智慧”和含义较宽的טוֹב并列，不将后者单一定义为财富。
