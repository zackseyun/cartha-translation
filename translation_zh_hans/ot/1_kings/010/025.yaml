base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/025.yaml
  text: 'And they were bringing[a], each man his tribute: articles of silver, articles of gold, garments, weapons, spices, horses, and mules[c][b], year by year.'
translation:
  language: zh_hans
  text: 他们各人都带来自己的贡礼[a]：银器、金器、衣服[b]、兵器[c]、香料、马和骡子；年年如此。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “贡礼”也可译作“礼物”或“礼品”；希伯来语 מִנְחָה 可指礼物、供物或贡礼。这里按君王受献礼的语境译作“贡礼”。
    reason: lexical_alternative
  - marker: b
    text: “衣服”也可译作“外衣”或“袍服”。
    reason: lexical_alternative
  - marker: c
    text: “兵器”也可译作“军械”或“铠甲”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵמָּה מְבִאִים
  choice: 他们……带来
  rationale: 分词与独立代词连用，在上下文中表示持续或惯常的行动；中文以“年年如此”自然显明反复发生的意味，无须使用生硬的进行体。
- source_word: אִישׁ מִנְחָתוֹ
  choice: 各自把贡礼
  rationale: אִישׁ 在此作分配用法，意为“各自”；מִנְחָה 可指礼物、供物或贡礼，君王受各国人士进献的语境支持“贡礼”，同时用脚注保留“礼物”的可能。
- source_word: כְּלֵי כֶסֶף וּכְלֵי זָהָב
  choice: 银器、金器
  rationale: כְּלִי 泛指器物、物件或用具；“银器、金器”简洁自然，并保留物品类别未具体说明的宽泛性。
- source_word: שְׂלָמוֹת
  choice: 衣服
  rationale: 该词指衣物，可能更具体是外衣或袍服；正文用现代中文较自然且宽泛的“衣服”，脚注列出具体可能。
- source_word: נֵשֶׁק
  choice: 兵器
  rationale: 该词可泛指军事装备；“兵器”在清单中自然清楚，也保留可解释为“军械”或“铠甲”的余地。
- source_word: בְשָׂמִים
  choice: 香料
  rationale: 指有香气的贵重物质，在贸易和进贡语境中译作“香料”自然且范围适当。
- source_word: סוּסִים וּפְרָדִים
  choice: 马和骡子
  rationale: 采用两个词的标准词义。
- source_word: דְּבַר שָׁנָה בְּשָׁנָה
  choice: 年年如此
  rationale: 该习语表示每年反复发生；“年年如此”既自然，又体现惯常性。
