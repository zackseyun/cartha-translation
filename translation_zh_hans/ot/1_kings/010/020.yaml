  text: And twelve lions were standing there on the six steps[a], on this side and on that side[b]; nothing like it had been made in any kingdom.
translation:
  language: zh_hans
  text: 又有十二只狮子立在六级台阶上[a]，这边和那边都有；各国都未曾造出过这样的[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在六级台阶旁”。
    reason: 介词עַל在此可表示位于台阶之上，也可按空间关系理解为沿着或靠着台阶。
  - marker: b
    text: 直译：“所有王国都没有这样造过。”原文没有明说所造之物；“这样”回指上文所描述的王座及其陈设。
    reason: 保留希伯来文未明说宾语的表达，同时说明其语境所指。
lexical_decisions:
- source_word: וּ/שְׁנֵים עָשָׂר אֲרָיִים
  choice: 又有十二只狮子
  rationale: 承接上文，并以现代汉语自然的存现句引出十二个狮子形象；“狮子”按上下文指王座旁的狮子造像。
- source_word: עֹמְדִים שָׁם
  choice: 立在
  rationale: 分词描绘静态场景；地点已由后面的“六级台阶上”明确，汉语不必另译“那里”。
- source_word: עַל שֵׁשׁ הַמַּעֲלוֹת
  choice: 在六级台阶上
  rationale: מַעֲלוֹת指通往王座的阶级；“在……上”保留עַל的空间关系。
- source_word: מִ/זֶּה וּ/מִ/זֶּה
  choice: 这边和那边都有
  rationale: 这是表示两侧对称分布的空间惯用语；译文保留其直观性，同时符合现代汉语表达。
- source_word: לֹא נַעֲשָׂה כֵן
  choice: 都没有造过这样的王座
  rationale: 直译为“没有这样造过”；结合本段所述对象，以“这样的王座”补明省略的所指，使汉语清楚自然。
- source_word: לְ/כָל מַמְלָכוֹת
  choice: 在任何国中
  rationale: 否定句中的כָל具有周遍、任指意义；“在任何国中”自然表达没有一个王国有同类作品。
theological_decisions: []
