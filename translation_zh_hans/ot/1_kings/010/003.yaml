  text: And Solomon answered all her questions[a]; there was nothing hidden from the king that he did not tell her.
translation:
  language: zh_hans
  text: 所罗门回答了她所有的问题[a]；没有一件事是王所不知道、而没有告诉她的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或较直译：“所罗门把她一切的话语（或事情）都告诉了她。”希伯来文可作这样的直译；但按上下文，是指所罗门回应女王的考问。
    reason: 保留וַיַּגֶּד与דְּבָרֶיהָ较形式对应的词义，并说明正文按语境译为“回答……问题”。
lexical_decisions:
- source_word: וַיַּגֶּד לָהּ
  choice: 回答了她
  rationale: נגד通常指“告诉、说明”，但这里承接女王以难题考问所罗门的语境，译作“回答”自然地表达回应之意。
- source_word: אֶת כָּל דְּבָרֶיהָ
  choice: 她所有的问题
  rationale: דבר可指言语、事情或问题；结合上一节女王提出的考问，语境中以“问题”最为清楚，同时用脚注保留较形式对应的译法。
- source_word: לֹא הָיָה דָּבָר נֶעְלָם מִן־הַמֶּלֶךְ
  choice: 没有一件事是王所不明白的
  rationale: נעלם字面为“被隐藏”，与מן־המלך连用表示没有任何事对王是隐藏或不能理解的；中文用“不明白”表达其语境含义。
- source_word: אֲשֶׁר לֹא הִגִּיד לָהּ
  choice: 不能为她解答的
  rationale: 希伯来文直译为“是他没有告诉她的”；在问答语境中，“为她解答”衔接自然，也保留王将答案说明给她的含义。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而清楚的叙事语言。“王”保留原文的称谓；后半句避免生硬重复“告诉”，以“不明白、不能为她解答”传达原文先否定隐藏、再说明告知的结构。
