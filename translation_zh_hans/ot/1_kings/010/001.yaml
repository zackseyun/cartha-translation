base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/001.yaml
  text: The queen of Sheba heard of Solomon’s fame concerning the name of Yahweh[b][a], and she came to test him with riddles.
translation:
  language: zh_hans
  text: 示巴女王听闻所罗门的名声与雅威的名有关[a]，便来用谜语[b]考验他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“所罗门那与雅威之名相关的名声。”希伯来语短语十分凝练，可能表示所罗门的名声与雅威的名或声誉相联系。
    reason: lexical_alternative
  - marker: b
    text: 或译“难题”。希伯来语直译为“谜语”或“隐语”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמַלְכַּת שְׁבָא
  choice: 示巴女王
  rationale: 以现代汉语自然表达属格结构“示巴的女王”；句首的 וּ 表示叙事衔接，无须机械译作“并且”。
- source_word: שֹׁמַעַת אֶת שֵׁמַע שְׁלֹמֹה
  choice: 听说所罗门的名声
  rationale: שֵׁמַע 可指传闻、消息或名声；上下文强调远方女王因所听见的声誉前来查验，因此译作“名声”，并用“听说”构成自然汉语。
- source_word: לְשֵׁם יְהוָה
  choice: 与雅威的名有关
  rationale: 介词 לְ 在此处所表达的具体关系并不明确；此译法保留所罗门的名声与雅威之名相联系这一点，而不擅自判定为原因、目的或内容。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来语四字神名的常见现代汉语音译处理，保留其作为专名的性质，不以称号代替。
- source_word: וַתָּבֹא לְנַסֹּתוֹ
  choice: 就来……考验他
  rationale: וַתָּבֹא 推进叙事，“就来”自然承接前面的听闻；נסה 在此指通过问答检验所罗门。
- source_word: בְּחִידוֹת
  choice: 用谜语
  rationale: חִידוֹת 的直接意义是谜语、隐语或难解之言；“谜语”较贴近词义，“难题”则更偏解释性。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用神的专名；译作“雅威”既保留专名性质，也避免以称号取代。
- issue: 所罗门的名声与雅威之名的关系
  choice: 与雅威的名有关
  alternative: 因雅威的名而有的名声；关于雅威之名的所罗门声望
  rationale: 希伯来语短语 לְשֵׁם יְהוָה 高度凝练，可表达关联、所涉对象或原因等关系；正文采用不强行消除歧义的关系性表达。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“听说……名声”符合普通读者习惯；“与……有关”有意保留原文介词关系的含混性。脚注标记分别紧随其所说明的短语。
