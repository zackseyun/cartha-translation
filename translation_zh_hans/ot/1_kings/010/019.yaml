base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/019.yaml
  text: The throne had six steps[a], and the throne had a rounded top at its back, and armrests on this side and on that beside the seat[b], and two lions standing beside the armrests.
translation:
  language: zh_hans
  text: 王座有六级台阶，王座后部有圆形的顶部[a]；座位两边有扶手，两只狮子站在扶手旁。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“圆的头”，在这里可能指王座圆形的顶部或后部上端。
    reason: lexical_alternative
lexical_decisions:
- source_word: מַעֲלוֹת
  choice: 台阶
  rationale: 在王座构造的语境中，指通向王座的六级阶梯；“台阶”具体、自然。
- source_word: לַכִּסֵּה
  choice: 王座有
  rationale: 介词 ל 在此用于说明王座的构造，译成汉语领有句“王座有”比直译“给王座”自然。
- source_word: רֹאשׁ עָגֹל
  choice: 圆形的顶部
  rationale: 原文直译为“圆的头／顶部”；此处指王座上部，但不足以确定是头枕，故不作过度限定。
- source_word: מֵאַחֲרָיו
  choice: 后面
  rationale: 表示圆形顶部位于王座后部；简洁保留其空间关系。
- source_word: יָדֹת
  choice: 扶手
  rationale: 该词本义与“手”有关，在座椅家具语境中指两侧供手臂倚靠的部分。
- source_word: מִזֶּה וּמִזֶּה
  choice: 两边
  rationale: 表达一边和另一边的对称分布，现代汉语以“两边”最自然。
- source_word: אֶל מְקוֹם הַשָּׁבֶת
  choice: 座位
  rationale: 原文较直译为“坐的地方”；在王座语境中以“座位”清楚表达其功能，并以脚注保留字面信息。
- source_word: אֲרָיוֹת
  choice: 狮子
  rationale: 直接对应复数名词；上下文所描述的应是王座装饰中的狮子形象，但原文仅称“狮子”，正文不额外添加“雕像”。
- source_word: עֹמְדִים
  choice: 站在
  rationale: 保留分词所描绘的直立姿态。
- source_word: אֵצֶל הַיָּדוֹת
  choice: 在扶手旁
  rationale: 准确表达两只狮子紧邻王座扶手的位置，并与前文术语保持一致。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。句式依照希伯来文的构造顺序展开，同时用分号区分王座本体与狮子装饰。没有把“狮子”明确增译为雕像，也没有把“圆形的顶部”限定为头枕，以保留原文未完全确定的细节。英语咨询层中脚注[a]的位置与内容不一致；本稿依据希伯来文把该脚注标在“圆形的顶部”之后。
