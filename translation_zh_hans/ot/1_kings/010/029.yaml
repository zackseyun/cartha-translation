base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/029.yaml
  text: And a chariot was imported from Egypt for six hundred shekels of silver[a], and a horse for a hundred and fifty[c][b]; and so they exported them to all the kings of the Hittites and to the kings of Aram by their hand.
translation:
  language: zh_hans
  text: 一辆战车从埃及进口，价银六百舍客勒[a]；一匹马，价银一百五十舍客勒。照样，这些车马由他们经手转运给赫人的众王和亚兰诸王[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文在第一项直译为“六百银子”，第二项只作“一百五十”；两处均未明说重量货币单位。这里按上下文惯例补作“舍客勒”。
    reason: implicit_unit
  - marker: b
    text: 原文直译为“借他们的手使之出去”。“由他们经手”可指他们本人或其代理人；原文没有明确说明“他们”是谁。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּעֲלֶה וַתֵּצֵא
  choice: 进口
  rationale: 两个移动动词直译涉及“上来、出来”；在埃及车马贸易的语境中，合译为“进口”自然地表达货物从埃及运入，同时把较直译的说法保留在脚注。
- source_word: מֶרְכָּבָה
  choice: 一辆战车
  rationale: 单数形式在此表示每辆的单价；“战车”符合该词在王室军事贸易语境中的通常含义。
- source_word: בְּשֵׁשׁ מֵאוֹת כֶּסֶף
  choice: 六百舍客勒银子
  rationale: 原文直为“六百银子”，计价单位省略；依古代以色列重量货币惯例补出“舍客勒”，并用脚注说明。
- source_word: וְסוּס בַּחֲמִשִּׁים וּמֵאָה
  choice: 一匹马要一百五十舍客勒银子
  rationale: 保留“马”的宽泛词义，不擅自限定为战马；从平行计价结构补出同一银重单位，使中文清楚。
- source_word: וְכֵן
  choice: 也
  rationale: 连接前述进口和后续转售，表示同样的贸易活动。
- source_word: לְכָל מַלְכֵי הַחִתִּים
  choice: 给赫人的众王
  rationale: לְ标示货物的接受者；“赫人”沿用该族名在现代中文圣经语境中的通行译法。
- source_word: וּלְמַלְכֵי אֲרָם
  choice: 给亚兰诸王
  rationale: 按希伯来专名译作“亚兰”，不以较具解释性的“叙利亚”代替。
- source_word: בְּיָדָם יֹצִאוּ
  choice: 所罗门的商人也经手把这些车马卖给
  rationale: 字面为“借他们的手使之出去”。结合上文贸易主体，中文以“商人经手……卖给”表达代理及向外转售之意；“所罗门的商人”由近文所指补明，并在脚注交代原文字面。
