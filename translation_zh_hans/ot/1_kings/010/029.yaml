- from: 从埃及进口一辆战车，要六百舍客勒银子[a]；一匹马要一百五十舍客勒银子。所罗门的商人也经手把这些车马卖给赫人的众王和亚兰诸王[b]。
  to: 一辆战车从埃及进口，价银六百舍客勒[a]；一匹马，价银一百五十舍客勒。照样，这些车马由他们经手转运给赫人的众王和亚兰诸王[b]。
  rationale: 删去无明文依据的“所罗门的商人”，并把“卖给”改为“转运给”，以保留希伯来文第三人称复数的指称不确定性及商业性“运出”的宽泛含义。重写两条脚注，使单位补足和“借他们的手”的习语说明准确对应原文。
