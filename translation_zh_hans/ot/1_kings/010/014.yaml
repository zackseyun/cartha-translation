base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/014.yaml
  text: The weight of the gold that came to Solomon in one year was six hundred sixty-six talents of gold,[a]
translation:
  language: zh_hans
  text: 所罗门一年所得的金子，按重量计算，共有六百六十六他连得[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “他连得”是古代较大的重量单位。本节按古代计量方式记载一年的数量，没有换算成现代单位。
    reason: cultural_note
lexical_decisions:
- source_word: וַיְהִי
  choice: （不单独译出）
  rationale: 此处的叙事连接形式引出新的陈述；现代汉语无需添加“如今”或“事情是这样”等词，句子可自然承接上下文。
- source_word: מִשְׁקַל
  choice: 按重量计算
  rationale: 该名词指重量或称量所得的数值。在本节账目语境中，“按重量计算”比生硬的“重量是”更符合现代汉语，同时保留原文以重量统计的意思。
- source_word: הַזָּהָב ... זָהָב
  choice: 金子……（他连得）
  rationale: 首处说明所统计的物品是金子；末处再次标明计量对象为金子。汉语句中前文已明确物品，“他连得”紧接其后，若再说“金子的他连得”会显得累赘，故不机械重复。
- source_word: אֲשֶׁר בָּא לִשְׁלֹמֹה
  choice: 所罗门……所得的
  rationale: 原文表示金子来到或归到所罗门那里。“所得的”自然表达归入其手中的含义，又不具体断定是由谁送来。
- source_word: בְּשָׁנָה אֶחָת
  choice: 一年
  rationale: 忠实表达在一年之内所得的数量；汉语置于“所得”之前，语序自然。
- source_word: שֵׁשׁ מֵאוֹת שִׁשִּׁים וָשֵׁשׁ
  choice: 六百六十六
  rationale: 直接、准确地呈现原文基数。
- source_word: כִּכַּר
  choice: 他连得
  rationale: 这是古代的大重量单位。沿用中文圣经读者较熟悉的音译，并以脚注解释，避免将不确定且因时代地域而异的重量强行换算为现代单位。
