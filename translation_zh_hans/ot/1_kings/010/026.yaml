base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/026.yaml
  text: Solomon gathered chariots and horsemen[a], and he had 1,400 chariots and 12,000 horsemen, and he stationed them in the chariot cities and with the king in Jerusalem.
translation:
  language: zh_hans
  text: 所罗门聚集战车和骑兵[a]；他有一千四百辆战车和一万二千名骑兵。他把它们驻扎在战车城，并留一部分随王在耶路撒冷。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “骑兵”也可译为“骑手”；希伯来语字面指“骑马的人”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּאֱסֹף
  choice: 聚集
  rationale: אסף在此指聚集、积聚军事力量；“聚集”既贴近原文，又自然易懂。
- source_word: רֶכֶב
  choice: 战车
  rationale: 该词虽以单数形式出现，却具有集合意义；在具体数目之后译作“辆战车”，清楚呈现所指的军事装备。
- source_word: פָרָשִׁים
  choice: 骑兵
  rationale: 该词指骑马的人或骑手，而非单指马匹；“骑兵”符合军事语境，同时脚注保留“骑手”的较直译表达。
- source_word: וַיְהִי לוֹ
  choice: 他拥有
  rationale: 这一希伯来语结构表达所有关系；“他拥有”是自然、明确的现代汉语。
- source_word: אֶלֶף וְאַרְבַּע מֵאוֹת רֶכֶב
  choice: 一千四百辆战车
  rationale: 直接表达原文数目，并按现代汉语为战车加量词“辆”。
- source_word: וּשְׁנֵים עָשָׂר אֶלֶף פָּרָשִׁים
  choice: 一万二千名骑兵
  rationale: 准确传达数目，并以“名”搭配指人的“骑兵”。
- source_word: וַיַּנְחֵם
  choice: 把他们安置
  rationale: נוח的使役式在此有使之驻留、安置之意；“安置”保留原词较宽泛的意义，不把军事部署的含义说得过满。
- source_word: בְּעָרֵי הָרֶכֶב
  choice: 在战车城
  rationale: 指专用于或与战车部队相关的城邑；“战车城”简洁，并保留原文的军事行政称谓。
- source_word: וְעִם הַמֶּלֶךְ בִּירוּשָׁלָם
  choice: 和耶路撒冷王的身边
  rationale: 表达其中一部分人与车辆留在耶路撒冷、随侍君王；调整汉语语序以避免误读为“战车城和王都同在耶路撒冷”。
theological_decisions: []
