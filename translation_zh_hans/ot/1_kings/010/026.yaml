revisions:
- from: 所罗门聚集了战车和骑兵[a]。他拥有一千四百辆战车和一万二千名骑兵，把他们安置在战车城和耶路撒冷王的身边。
  to: 所罗门聚集战车和骑兵[a]；他有一千四百辆战车和一万二千名骑兵。他把它们驻扎在战车城，并留一部分随王在耶路撒冷。
  rationale: 修正末句的汉语句法，使“在耶路撒冷”明确修饰“随王”，忠实反映原文地点信息，避免将所罗门称作“耶路撒冷王”。以“驻扎”表达军事部署；“留一部分”仅将原文在战车城与王身边之间所隐含的分置关系在汉语中明示，未增添人数或单位分配。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T05:50:44Z'
