source:
  edition: WLC
  text: זְד֤וֹן לִבְּ/ךָ֙ הִשִּׁיאֶ֔/ךָ שֹׁכְנִ֥י בְ/חַגְוֵי סֶּ֖לַע מְר֣וֹם שִׁבְתּ֑/וֹ אֹמֵ֣ר בְּ/לִבּ֔/וֹ מִ֥י יוֹרִדֵ֖/נִי אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/obadiah/001/003.yaml
  text: The pride of your heart has deceived you[a], you who dwell in the clefts of the rock, whose dwelling is on high, who say in your heart[c][b], “Who will bring me down to the ground?”
translation:
  language: zh_hans
  text: 你心里的狂傲[a]欺骗了你。你住在岩石的裂缝中[b]，居所高高在上，心里说：“谁能使我降到地上[c]？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “狂傲”或译“骄傲”、“狂妄”或“自恃”。
    reason: lexical_alternative
  - marker: b
    text: “裂缝”也可理解为岩石的缝穴或隐蔽处；这句话使人想到以东险峻、易守的岩石居所。
    reason: cultural_note
  - marker: c
    text: “地上”或译“大地”或“地面”。
    reason: lexical_alternative
lexical_decisions:
- source_word: זְדוֹן
  choice: 狂傲
  rationale: 该词指骄傲、狂妄或自恃；“狂傲”比一般的“骄傲”更能体现先知对以东自高自大的谴责。
- source_word: לִבְּךָ
  choice: 你心里
  rationale: 希伯来语“心”可指人的内在思想、意志与态度；保留“心”这一意象，也与后文“心里说”相呼应。
- source_word: הִשִּׁיאֶךָ
  choice: 欺骗了你
  rationale: 此处使役式表达使人受骗、被引入歧途之意；“欺骗了你”自然清楚，并凸显狂傲造成的自我蒙蔽。
- source_word: שֹׁכְנִי
  choice: 你住在
  rationale: 分词在语境中描述受话者以东；译为直接的第二人称，可保持全节责问的连贯性。
- source_word: בְחַגְוֵי סֶּלַע
  choice: 在岩石的裂缝中
  rationale: חגוי 指岩石的裂缝、凹穴或隐蔽处；此译保留以东山岩堡垒险峻、易守的画面。
- source_word: מְרוֹם שִׁבְתּוֹ
  choice: 居所高高在上
  rationale: 该短语强调居处位于高处；采用简洁的描述句，保留它与“地上”之间的垂直对比。
- source_word: אֹמֵר בְּלִבּוֹ
  choice: 心里说
  rationale: 原文形式转为第三人称单数，但仍是在描述作为集体受话者的以东；汉语省略代词，既自然，也不必强行消除原文人称转换的痕迹。
- source_word: מִי יוֹרִדֵנִי
  choice: 谁能使我降到
  rationale: ירד 的使役式意为使之下去；“谁能使我降到”保留因果形式和说话者自以为无人能敌的反问语气。
- source_word: אָרֶץ
  choice: 地上
  rationale: 这里与高处的居所形成鲜明对比；“地上”在现代汉语中自然，也保留“地、土地、大地”之间一定的词义空间。
theological_decisions:
- issue: 本节第二人称称呼与第三人称形式之间的转换
  choice: 整体维持对以东的第二人称直接宣告，同时在“居所高高在上，心里说”中省略所属代词。
  alternative: 逐字保留第三人称，译作“他的居所在高处，他心里说”。
  rationale: 本节开头的“你”和动词中的“你”明确表明以东是直接受话者；中间第三人称形式可视为对这一集体受话者的描述。汉语用省略主语和所属代词的方式既保持直接责问，也不额外规定该人称转换的解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。用“狂傲”保留先知责备的力度；“岩石的裂缝”“居所高高在上”形成鲜明空间画面；末句使用反问，传达以东自恃地势险固的语气。
