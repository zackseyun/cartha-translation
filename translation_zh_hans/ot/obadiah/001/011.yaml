source:
  edition: WLC
  text: בְּ/יוֹם֙ עֲמָֽדְ/ךָ֣ מִ/נֶּ֔גֶד בְּ/י֛וֹם שְׁב֥וֹת זָרִ֖ים חֵיל֑/וֹ וְ/נָכְרִ֞ים בָּ֣אוּ שער/ו וְ/עַל יְרוּשָׁלִַ֨ם֙ יַדּ֣וּ גוֹרָ֔ל גַּם אַתָּ֖ה כְּ/אַחַ֥ד מֵ/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/obadiah/001/011.yaml
  text: On the day when you stood aloof[a], on the day strangers carried off his wealth, and foreigners entered his gates and cast lots over Jerusalem[c][b], you too were like one of them.
translation:
  language: zh_hans
  text: 在你袖手旁观[a]的那一天，外人掳走他的财物[c]，异族人进入他的城门[b]，为耶路撒冷抽签；那时，连你也与他们中的一个无异。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“站在对面”或“站在远处”。希伯来文短语字面描述站在对面或远处；在这里含有冷漠旁观、不加援手的意味。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文作“他的城门”，可能把耶路撒冷或犹大人格化。中文“城门”本身不标明单复数。
    reason: lexical_alternative
  - marker: c
    text: “财物”也可译作“军力”“力量”或“资源”。希伯来文 חֵיל 可指军队、力量或财富；在这里的劫掠语境中，“财物”较为合适。
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲמָדְךָ מִנֶּגֶד
  choice: 你袖手旁观
  rationale: 该短语字面表示“站在对面／远处”，但上下文以“你也与他们中的一个无异”揭示其道德含义，即以不干预的姿态旁观。“袖手旁观”在现代汉语中自然传达这种负有责任的冷漠，同时脚注保留空间意义。
- source_word: שְׁבוֹת
  choice: 掳走
  rationale: שׁבה 常指掳获；此处宾语是财物或实力，并非明确指人，因此“掳走”既保留强行夺取之意，也适合财物这一宾语。
- source_word: זָרִים
  choice: 外人
  rationale: 表示本族以外的人；译作“外人”，并与后面的 נָכְרִים“异族人”有所区分，以保留希伯来文用词的变化和平行关系。
- source_word: חֵילוֹ
  choice: 他的财物
  rationale: חֵיל 可指军力、力量或财富。侵入城门并为耶路撒冷抽签的劫掠语境较支持“财物”，但脚注保留其他真实可能。阳性单数后缀按原文译为“他的”。
- source_word: נָכְרִים
  choice: 异族人
  rationale: 指外国或异族之人；“异族人”可与前面的“外人”相区别，又符合本节入侵语境。
- source_word: בָּאוּ שַׁעֲרוֹ
  choice: 进入他的城门
  rationale: 马所拉文本所呈现的形式为带第三人称阳性单数后缀的“他的门／城门”。中文“城门”单复数形式相同，既自然，也不必擅自明确数量；“他的”保留原文的人格化表达。
- source_word: יַדּוּ גוֹרָל
  choice: 抽签
  rationale: 这是以签决定分配或归属的惯用表达；“抽签”是现代汉语清楚自然的对应说法。
- source_word: גַּם אַתָּה
  choice: 连你也
  rationale: 突出以东也被列入侵略者的罪责之中；“连你也”自然保留强调语气。
- source_word: כְּאַחַד מֵהֶם
  choice: 与他们中的一个无异
  rationale: 保留比较而不将其强化为本体身份，表达以东在道德上与入侵者同列。
theological_decisions:
- issue: עמד מנגד 所表达的以东姿态
  choice: 译作“袖手旁观”，表达应受责备的不干预
  alternative: 仅描述以东站在对面或远处
  rationale: 本节末句“连你也与他们中的一个无异”表明这种站立并非中性的位置说明，而是使以东在道德上与攻击者同列；脚注仍保留原短语的空间含义，避免抹去其意象。
- issue: כְּאַחַד מֵהֶם 对以东与入侵者关系的界定
  choice: 保留“无异”的比较性定罪
  alternative: 直译为“成了他们中的一个”，将比较理解为完全身份认同
  rationale: 介词 כְּ 明示比较；译文表达道德等同，却不越过原文而断言身份上的完全合一。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以“袖手旁观”传达先知谴责的力度，以“与……无异”保留比较结构；“他的城门”保存原文的人格化指代。正文所有脚注标记均与脚注对应。
