id: OBA.1.18
reference: Obadiah 1:18
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/הָיָה֩ בֵית יַעֲקֹ֨ב אֵ֜שׁ וּ/בֵ֧ית יוֹסֵ֣ף לֶהָבָ֗ה וּ/בֵ֤ית עֵשָׂו֙ לְ/קַ֔שׁ וְ/דָלְק֥וּ בָ/הֶ֖ם וַ/אֲכָל֑וּ/ם וְ/לֹֽא יִֽהְיֶ֤ה שָׂרִיד֙ לְ/בֵ֣ית עֵשָׂ֔ו כִּ֥י יְהוָ֖ה דִּבֵּֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/obadiah/001/018.yaml
  text: The house of Jacob will be a fire[a], and the house of Joseph a flame, and the house of Esau stubble. They will burn them and consume them, and there will be no survivor for the house of Esau[b], for Yahweh has spoken.
translation:
  language: zh_hans
  text: 雅各家必成为火，约瑟家必成为火焰；以扫家必成为碎秸。他们必在以扫家中燃烧[a]，将以扫家吞灭；以扫家必不留下一个幸存者[b]，因为耶和华已经说了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“他们必焚烧以扫家，将其吞灭”。原文“在他们中／内燃烧”的表达紧凑；其中的介词也可理解为火焰直接向以扫家施行焚烧。
    reason: lexical_alternative
  - marker: b
    text: “幸存者”也可译作“余民”或“遗民”。希伯来语 שָׂרִיד 可指幸存者或留下的人；本节采用“幸存者”，以表达对以扫家不留存者的宣告。
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵית יַעֲקֹב
  choice: 雅各家
  rationale: 保留“家”的群体性和族裔性含义，同时符合现代汉语圣经语体。
- source_word: אֵשׁ
  choice: 火
  rationale: 保持谓语隐喻的简洁有力，不额外具体化。
- source_word: בֵית יוֹסֵף
  choice: 约瑟家
  rationale: 与“雅各家”保持平行，指以约瑟为代表的以色列群体。
- source_word: לֶהָבָה
  choice: 火焰
  rationale: 与“火”形成诗歌式递进和平行。
- source_word: בֵית עֵשָׂו
  choice: 以扫家
  rationale: 保留先知文本的家族—民族称谓，语境中指以东群体。
- source_word: לְקַשׁ
  choice: 碎秸
  rationale: 指收割后易燃的秸秆残余，比“糠秕”更贴近 קַשׁ，并能清楚呈现迅速焚毁的意象。
- source_word: וְדָלְקוּ בָהֶם
  choice: 他们要在其中燃烧
  rationale: 保留介词 ב 的空间表达及原文紧凑性，不武断改成使役式“点燃他们”；其敌对焚烧含义由上下文和后句显明。
- source_word: וַאֲכָלוּם
  choice: 把他们吞灭
  rationale: 在火的隐喻中，“吞灭”自然地表达 אכל 的吞噬和彻底毁灭之意。
- source_word: שָׂרִיד
  choice: 幸存者／幸存的人
  rationale: 正文采用“无一人幸存”，避免“余民”可能带入的蒙保全含义，同时准确表达此处彻底审判的语境。
- source_word: כִּי יְהוָה דִּבֵּר
  choice: 因为耶和华已经说了
  rationale: 以“耶和华”音译神名，保留盟约名称；完成体译作“已经说了”，突出宣告的确定性。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: “耶和华”是现代汉语读者最熟悉且庄重的专名形式；不以“主”替代，因而仍保留原文专名的功能。
- issue: “雅各家”和“约瑟家”的所指
  choice: 保留群体性的“家”称谓
  alternative: 直接解释为以色列民族或特定支派
  rationale: 原文平行结构指向族群共同体，但正文不把其具体范围解释得超过经文本身。
- issue: שָׂרִיד 在审判语境中的含义
  choice: 无一人幸存
  alternative: 没有余民
  rationale: 两者在词义上都可能，但“幸存”更直接传达本节对以扫家的彻底毁灭，也避免“余民”常有的正面神学联想。
- issue: וְדָלְקוּ בָהֶם 的施受关系
  choice: 在其中燃烧
  alternative: 点燃他们／向他们猛烈燃烧
  rationale: 希伯来语表达紧凑，介词 ב 可容许不同理解；正文保留其空间性和歧义，脚注说明直接敌对焚烧的可能。
translation_notes:
  register: 采用现代、庄重而清楚的普通话书面语，保留原文三组“家”的平行结构和火、火焰、碎秸的诗性意象。正文中的脚注标记与脚注完全对应。
