  text: וְ/גָלֻ֣ת הַֽ/חֵל הַ֠/זֶּה לִ/בְנֵ֨י יִשְׂרָאֵ֤ל אֲשֶֽׁר כְּנַעֲנִים֙ עַד צָ֣רְפַ֔ת וְ/גָלֻ֥ת יְרוּשָׁלִַ֖ם אֲשֶׁ֣ר בִּ/סְפָרַ֑ד יִֽרְשׁ֕וּ אֵ֖ת עָרֵ֥י הַ/נֶּֽגֶב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/obadiah/001/020.yaml
  text: And the exiles of this host of the sons of Israel, who are among the Canaanites as far as Zarephath, and the exiles of Jerusalem who are in Sepharad, will possess the cities of the Negev.
translation:
  language: zh_hans
  text: 这群被掳的以色列人，就是在迦南人中、远至撒勒法的；还有身在西法拉的耶路撒冷被掳者，他们都必占有南地的城邑。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节希伯来文句法简略，部分词义和地名的确切所指不确定。“这群”也可理解为“这支队伍”；“西法拉”的具体位置不详。
    reason: 提示原文中חֵל的词义歧义以及סְפָרַד的地理不确定性，避免正文作过度确定的解释。
lexical_decisions:
- source_word: גָלֻת
  choice: 被掳的……人
  rationale: 该词指被迫离乡的流亡群体；用现代汉语的人称表达比抽象的“流亡者群体”更自然，并在两处保持对应。
- source_word: הַחֵל הַזֶּה
  choice: 这群
  rationale: חֵל在此处含义不确定，可能指队伍、军旅或群体；结合“被掳的以色列人”，正文采用不把军事含义说死的“这群”。
- source_word: כְּנַעֲנִים
  choice: 迦南人中
  rationale: 按马所拉文本的复数形式理解为“迦南人”，并补出汉语所需的方位关系“中”；原文关系略有省略。
- source_word: יִרְשׁוּ
  choice: 必占有
  rationale: 该动词可指承受产业、取得或占有；此处宾语为城邑，“占有”既传达实际取得，也不额外限定取得方式。
- source_word: עָרֵי הַנֶּגֶב
  choice: 南地的城邑
  rationale: הַנֶּגֶב在此可作地名，指犹大南部的南地；保留传统地理称呼“南地”。
theological_decisions:
- issue: 归回群体与占有城邑的关系
  choice: 保留两个被掳群体共同作“必占有”的主语
  alternative: 把前半句理解为地点或被占有的对象
  rationale: 马所拉文本的句法虽紧凑且有省略，但复数动词יִרְשׁוּ最自然地承接前述两个被掳群体；不进一步赋予末世论或特定教派解释。
- issue: חֵל的军事色彩
  choice: 正文译为中性的“群”
  alternative: 译为“军队”或“队伍”
  rationale: 该词的具体所指并不确定；中性表达避免把被掳者明确军事化，同时保留群体概念。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“城邑”略带经文文体色彩，但普通读者容易理解；“南地”作为地理专名处理。脚注标记已在正文出现。
