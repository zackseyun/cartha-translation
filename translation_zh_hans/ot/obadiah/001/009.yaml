base_translation:
  language: en
  yaml_path: translation/ot/obadiah/001/009.yaml
  text: And your mighty men[a], Teman, will be shattered[c][b], so that every man from the mountain of Esau may be cut off by slaughter.
translation:
  language: zh_hans
  text: 提幔啊，你的勇士必惊惶[a]，以致以扫山上的男丁都必因杀戮而被剪除。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “惊惶”也可译作“崩溃”或“吓破胆”；这个希伯来语动词兼有恐慌与败亡的意味。
    reason: lexical_alternative
  - marker: b
    text: 末句也可译作：“好叫以扫山上的男丁都必因杀戮而被剪除。”原文可理解为目的或结果；“因杀戮而”也可理解为借着杀戮或由于杀戮。
    reason: alternative_reading
lexical_decisions:
- source_word: וְחַתּוּ
  choice: 必惊惶
  rationale: חתת在此形态可表示因恐惧而崩溃、丧胆。译作“惊惶”保留心理恐慌的核心，也符合针对勇士的军事语境；其结果性的溃败含义由上下文显明。
- source_word: גִבּוֹרֶיךָ
  choice: 你的勇士
  rationale: גִּבּוֹר常指强壮善战的人；“勇士”在现代汉语中自然、庄重，并保留军事含义。
- source_word: תֵּימָן
  choice: 提幔啊
  rationale: 此处最自然地理解为对以东地区或城邑提幔的直接称呼。汉语用语气词“啊”标明呼语功能，并不把它误译成“南方”。
- source_word: לְמַעַן
  choice: 以致
  rationale: לְמַעַן可引出目的或结果。这里“以致”既符合审判宣告的语流，也避免在目的与结果之间作过度限定。
- source_word: יִכָּרֶת
  choice: 被剪除
  rationale: כרת的尼法勒形常表示“被剪除、被除灭”；“被剪除”保留原文惯用意象及被动形式。
- source_word: אִישׁ
  choice: 男丁都
  rationale: אִישׁ为阳性单数，在此具分配或集合意义。结合军事审判语境，“男丁都”既保留男性指向，也自然表达全面性。
- source_word: מֵהַר עֵשָׂו
  choice: 以扫山上的
  rationale: 直译为“从以扫之山”，所指是以东山区。中文按被剪除者所属地点自然表达为“以扫山上的”，保留单数地貌称谓。
- source_word: מִקָּטֶל
  choice: 在杀戮中
  rationale: 介词מִן在这里可表达原因、手段或伴随情形。“在杀戮中”保留其句法弹性，不强行限定为单一关系。
theological_decisions:
- issue: אִישׁ在集体审判中的性别与范围
  choice: 男丁都
  alternative: 人人／每一个人
  rationale: 原文明确使用阳性名词，且勇士与杀戮的语境支持对以东男性人口、尤其战斗人员的指向；译文不将其泛化为无性别的“人人”。
- issue: לְמַעַן所引分句是目的还是结果
  choice: 以致
  alternative: 为要／好叫
  rationale: 原文连接词可表达目的或结果；“以致”在汉语中容纳结果色彩，同时不把神学因果关系解释得过死。
- issue: תֵּימָן的专名与呼语功能
  choice: 提幔啊
  alternative: 提幔／南方
  rationale: 在本节中它最可能是以东地名，并用作呼语。添加汉语呼语助词是句法显化，不是向原文加入新的称号。
translation_notes:
  register: 采用现代、庄重且可朗读的标准普通话。“提幔啊”清楚呈现呼语；“男丁都”保留原文阳性集合表达；避免用过于古奥的“骁勇者”或过度解释性的“全体士兵”。所有脚注标记均已置于正文。
