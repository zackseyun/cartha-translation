source:
  edition: WLC
  text: וְ/אַל תֵּ֤רֶא בְ/יוֹם אָחִ֨י/ךָ֙ בְּ/י֣וֹם נָכְר֔/וֹ וְ/אַל תִּשְׂמַ֥ח לִ/בְנֵֽי יְהוּדָ֖ה בְּ/י֣וֹם אָבְדָ֑/ם וְ/אַל תַּגְדֵּ֥ל פִּ֖י/ךָ בְּ/י֥וֹם צָרָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/obadiah/001/012.yaml
  text: Do not look on your brother in the day of his misfortune[a], and do not rejoice over the sons of Judah in the day of their destruction[c][b]; and do not make your mouth great in the day of distress.
translation:
  language: zh_hans
  text: 不可在你的兄弟遭难[a]的日子幸灾乐祸；不可在犹大子民灭亡的日子为他们的灭亡而欢喜；不可在患难的日子夸口[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文动词直译为“看见”或“观看”；结合下文的欢喜和夸口，此处指带着恶意、得意地旁观，故译作“幸灾乐祸”。“遭难”所译的词也可能指“变成异乡人”或“被疏离”。
    reason: 保留תֵּרֶא的字面意义，并说明נָכְרוֹ的词义歧义。
  - marker: b
    text: “夸口”原文直译为“使你的口变大”，意为傲慢、夸耀地说话。
    reason: 说明希伯来语习语的原始意象。
lexical_decisions:
- source_word: תֵּרֶא
  choice: 幸灾乐祸
  rationale: 该动词字面为“看、观看”，但与下文“欢喜”和“夸口”平行，在禁令语境中表示带着恶意得意地旁观。“幸灾乐祸”自然传达其语用含义，字面译法留在脚注。
- source_word: אָחִיךָ
  choice: 你兄弟
  rationale: 保留原文“兄弟”的亲属意象，凸显以东与犹大之间兄弟民族关系及背叛的道德分量。
- source_word: נָכְרוֹ
  choice: 遭难
  rationale: 此词形语义较难确定，可涉及变为异乡人、被疏离或遭逢灾祸；结合“灭亡”“患难”的平行语境，正文采用自然而不过度具体的“遭难”，并在脚注保留歧义。
- source_word: לִבְנֵי יְהוּדָה
  choice: 犹大子民
  rationale: 原文直译“犹大的众子”。现代汉语以“犹大子民”保留其群体和亲属性表达，同时避免“儿子们”被误解为仅指男性个体。
- source_word: אָבְדָם
  choice: 他们灭亡
  rationale: אבד 表示灭亡、毁坏或败亡；此处指犹大群体遭受的国家性灾难。
- source_word: תַּגְדֵּל פִּיךָ
  choice: 夸口
  rationale: 原文直译为“使你的口变大”，是指傲慢、夸耀地说话的习语。正文采用现代汉语“夸口”，原文意象在脚注说明。
- source_word: צָרָה
  choice: 患难
  rationale: 该词表示困苦、危难或灾患；“患难”符合庄重的先知性语体，也与前文灾难用语形成呼应。
theological_decisions:
- issue: 以东与犹大的亲属称谓
  choice: 你兄弟
  alternative: 你的同族
  rationale: 保留“兄弟”可呈现原文借以东与雅各的亲缘关系谴责背叛的修辞力量，不将其泛化。
- issue: תֵּרֶא 所表达的行为性质
  choice: 幸灾乐祸
  alternative: 观看
  rationale: 上下文禁止的并非单纯看见，而是面对兄弟灾祸时恶意旁观、欢喜并夸口；但因动词本身字面仅为“看”，脚注明确交代这一层解释。
translation_notes:
  register: 采用现代、庄重而易懂的先知性语体。三个“不可”保持原文排比和递进；“遭难—灭亡—患难”保留灾祸语汇的变化。正文以自然汉语传达习语，同时用脚注呈现重要的字面形式和真实歧义。
