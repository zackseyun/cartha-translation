- from: 以扫[a]竟被搜查净尽！他隐藏的财宝竟被查了出来！[b]
  to: 以扫[a]竟被搜遍了！他隐藏的财宝被搜寻出来了！[b]
  rationale: 修订保留原文开头的惊叹、以扫这一人名以及两组被动完成式的平行。以“被搜遍了”替换不够地道的“被搜查净尽”，以“被搜寻出来了”表达隐藏财宝被发现，并维持庄重、现代的书面语体。第二分句不重复“竟”，使汉语节奏更自然；全节的感叹范围仍由首句统摄。
