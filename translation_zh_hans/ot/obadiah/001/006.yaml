  text: How Esau has been searched out! His hidden treasures have been sought out![a][b]
translation:
  language: zh_hans
  text: 以扫[a]竟被搜遍了！他隐藏的财宝被搜寻出来了！[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里的“以扫”统指以扫的后裔，也就是以东的居民或土地。
    reason: cross_reference
  - marker: b
    text: 或译：“以扫竟被洗劫一空！他秘密储藏的东西竟被翻了出来！”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵיךְ
  choice: 竟
  rationale: 这里不是询问信息，而是引出惊叹，表达对以扫遭彻底搜查的震惊；用“竟”能以自然的现代汉语保留这种感叹语气。
- source_word: נֶחְפְּשׂוּ
  choice: 被搜查净尽
  rationale: 该词为被动形式，表示遭到彻底搜寻。“被搜查净尽”既保留被动和完成意味，也传达无处遗漏的语境含义。
- source_word: עֵשָׂו
  choice: 以扫
  rationale: 保留希伯来文本中的人名，不在正文中直接改译为“以东”；此处所指的群体性含义由脚注说明。
- source_word: נִבְעוּ
  choice: 被查了出来
  rationale: 该词在此表示隐秘之物经搜索而被发现或显露。“被查了出来”与前句“被搜查净尽”有所区别，同时保留平行结构及被动结果。
- source_word: מַצְפֻּנָיו
  choice: 他隐藏的财宝
  rationale: 字面指他所隐藏、储藏的东西；在敌人掠夺的语境中，自然指秘密藏起的贵重物品。“隐藏的财宝”兼顾隐蔽性和上下文所含的价值意味。
theological_decisions: []
