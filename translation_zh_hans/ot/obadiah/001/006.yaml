    rationale: “搜查”通常带及物宾语，如“搜查某处”；用于“以扫”这一集体称谓时，“被搜遍了”更符合现代汉语，同时表达彻底搜查的结果。
  - severity: low
    issue: “被查了出来”较口语，且与前句的搜查语义衔接稍弱
    rationale: 原文第二动词在此指隐藏之物被搜出、发现或暴露。“被搜寻出来”既自然庄重，又保留与前句相近而不完全相同的平行。
  - severity: low
    issue: 脚注a的指称说明可更均衡
    rationale: 原文中的“以扫”可集合性地指其后裔／以东。以“以东的居民或土地”说明，可避免“以东人或以东地”的构词层次不一致。
