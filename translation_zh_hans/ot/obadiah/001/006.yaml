review_pass:
  verdict: revise
  source_fidelity: 正文基本准确地传达了希伯来文的感叹语气、两个被动完成式，以及“以扫”作为集体性名称的用法。不过“被搜查净尽”搭配略不自然，且“查了出来”在现代汉语中较口语化、动作主体不够明确；可用“被搜遍了”和“被搜寻出来”更贴近原文的平行与语体。
  naturalness: “以扫竟被搜查净尽”不如“以扫竟被搜遍了”自然。“他隐藏的财宝竟被查了出来”可理解，但“被搜寻出来”更庄重，也更连贯地表达隐藏之物被发现。开头的“竟”可承载感叹，但不必在两分句重复，以免弱化诗性节奏。
  terminology: “以扫”“以东”及“财宝”均恰当。脚注a应保留以扫可指其后裔或以东之地的说明；“以东人或以东地”可调整为“以东的居民或土地”，以避免把“以东”与“以东人”并列造成指称层次不齐。脚注b的“秘密储藏的东西”准确但略泛；保留其作为词义替代可接受。
  issues:
