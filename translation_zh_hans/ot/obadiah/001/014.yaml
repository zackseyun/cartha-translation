  text: וְ/אַֽל תַּעֲמֹד֙ עַל הַ/פֶּ֔רֶק לְ/הַכְרִ֖ית אֶת פְּלִיטָ֑י/ו וְ/אַל תַּסְגֵּ֥ר שְׂרִידָ֖י/ו בְּ/י֥וֹם צָרָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/obadiah/001/014.yaml
  text: Do not stand at the crossroads to cut off his fugitives[c][b][a], and do not hand over his survivors in the day of distress.
translation:
  language: zh_hans
  text: 不可站在岔路口[a]，截杀他的逃亡者[c]；在患难的日子，也不可把他的幸存者交出去[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“道路分岔处”，也可能指“山口”。希伯来语所指的是可以拦截逃亡者的地方。
    reason: lexical_alternative
  - marker: b
    text: 或译“交给敌人”“出卖”。原文动词字面义为“关闭、禁闭”，这里指把人交到敌人手中。
    reason: lexical_alternative
  - marker: c
    text: 或译“他逃脱的人”；也可译“他余下的人”。
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּעֲמֹד
  choice: 站在
  rationale: 保留“站立、站定”的具体动作，并在禁令中自然表达为了拦截逃亡者而占据某处。
- source_word: הַפֶּרֶק
  choice: 岔路口
  rationale: 该词在本节指可拦截逃亡者的道路分岔处；“岔路口”既自然，又不把地形限定为未经确定的山口。
- source_word: לְהַכְרִית
  choice: 截杀
  rationale: כרת有“剪除、断绝”之意；结合在道路上拦截逃亡者的语境，“截杀”同时表达拦截和除灭，比单说“杀害”更贴近此处画面。
- source_word: פְּלִיטָיו
  choice: 他那些逃亡的人
  rationale: פליט指从灾祸或攻击中逃出的人；此译清楚呈现其正在逃难的处境，且符合现代汉语。
- source_word: תַּסְגֵּר
  choice: 把……交出去
  rationale: סגר本义为“关闭、禁闭”，本处在语境中指把人交到敌方手中；“交出去”准确传达其惯用意义，同时以脚注保留字面与其他译法。
- source_word: שְׂרִידָיו
  choice: 他的幸存者
  rationale: שרד所指的是灾难后剩下的人；“幸存者”清楚自然，也避免“余民”在先知文学中可能额外引发的专门神学含义。
- source_word: בְּיוֹם צָרָה
  choice: 在他遭难的日子
  rationale: 用自然汉语表达时间短语及צָרָה的困厄、危难含义，并由代词承接上下文所指的雅各。
theological_decisions:
- issue: שְׂרִידָיו是否应译作带有专门神学色彩的“余民”
  choice: 译作“他的幸存者”
  alternative: 他的余民／他剩下的人
  rationale: 本节直接谴责以东出卖从灾祸中存活的犹大人。原词可以指“剩下的人”，但上下文并不要求将其解释为蒙保守的忠信余民；采用“幸存者”可避免加入文本未明确表达的神学限定。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“不可……也不可……”保留希伯来文两项平行禁令；“岔路口—截杀”维持埋伏拦截的具体画面。“遭难的日子”比单纯的“困难时”更符合先知话语的严肃语域。
