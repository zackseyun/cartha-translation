  rationale: 删除原文未明说的“他遭难”的所有格，使时间短语与 בְּיוֹם צָרָה 一致；同时微调“逃亡者”和脚注 c，使行文更自然，并避免把“余下者”预先解释为技术性的“余民”。其余译法保留原稿对拦截、剪除和交付的具体语境呈现。
