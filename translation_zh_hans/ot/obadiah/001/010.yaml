  text: מֵ/חֲמַ֛ס אָחִ֥י/ךָ יַעֲקֹ֖ב תְּכַסְּ/ךָ֣ בוּשָׁ֑ה וְ/נִכְרַ֖תָּ לְ/עוֹלָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/obadiah/001/010.yaml
  text: Because of the violence done to your brother Jacob[a], shame will cover you, and you will be cut off forever.
translation:
  language: zh_hans
  text: 因你以暴力对待你的兄弟雅各，羞耻必遮盖你，你也必永远被剪除。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מֵ/חֲמַס
  choice: 因你以暴力对待
  rationale: חָמָס表示暴力、强暴或暴行；前缀מִן在此表原因。译文明确暴力所针对的对象，同时保留因果关系。
- source_word: אָחִי/ךָ
  choice: 你的兄弟
  rationale: 直译亲属称谓，保留以东与雅各之间的手足关系及由此产生的道德控诉。
- source_word: יַעֲקֹב
  choice: 雅各
  rationale: 原文使用族长之名“雅各”；保留此名，不以解释性的“以色列”替换，使个人名与民族所指之间的张力仍由上下文呈现。
- source_word: תְּכַסְּ/ךָ
  choice: 必遮盖你
  rationale: כסה基本义为遮盖；以“羞耻”为主语时，表达羞耻笼罩人的意象。
- source_word: בוּשָׁה
  choice: 羞耻
  rationale: בּוּשָׁה兼具内在羞愧与公开受辱的意味；“羞耻”简洁并保留其道德和社会层面。
- source_word: וְ/נִכְרַתָּ
  choice: 你也必……被剪除
  rationale: כרת的尼法勒式意为“被剪除、被除掉”；采用“被剪除”保留希伯来语意象，不将其范围预先限定为死亡或毁灭。
- source_word: לְ/עוֹלָם
  choice: 永远
  rationale: עוֹלָם在此审判语境中表示持续而无终止的期限；“永远”是现代汉语中自然、庄重的对应表达。
theological_decisions:
- issue: “雅各”的所指与兄弟关系的力度
  choice: 保留“你的兄弟雅各”，让雅各既作为具名兄弟，也在语境中代表其后裔之民。
  alternative: 在正文中改译为“你的兄弟以色列”，以直接点明民族所指。
  rationale: 希伯来文明确写作“你的兄弟雅各”。保留族长名可维持对以东背弃手足关系的控诉，也避免用解释替换原文。
translation_notes:
  register: 采用现代、庄重而易懂的普通话书面语。“以暴力对待”较自然地传达原文简练的“因针对……的暴力”；后半句保留“羞耻遮盖”和“被剪除”的先知性意象。正文无脚注标记，因此不设置脚注。
