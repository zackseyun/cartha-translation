base_translation:
  language: en
  yaml_path: translation/ot/obadiah/001/016.yaml
  text: For just as you drank on my holy mountain[a], all the nations will drink continually; they will drink and swallow[b], and they will be as though they had never been.
translation:
  language: zh_hans
  text: 因为你们怎样在我的圣山上喝了，列国也必照样不断地喝；他们必喝，必吞下去[a]，并且仿佛从未存在过。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里反复出现的“喝”和“吞下去”的意象，很可能指列国承受上帝的审判；原文在此没有明说“杯”。
    reason: cross_reference
lexical_decisions:
- source_word: כִּי כַּאֲשֶׁר
  choice: 因为……怎样……也必照样
  rationale: כִּי承接上文并说明审判的依据，כַּאֲשֶׁר则建立对应关系；中文以“因为……怎样……也必照样”自然保留因果与比较。
- source_word: שְׁתִיתֶם
  choice: 你们……喝了酒
  rationale: 这是第二人称复数完成式，语境中指以东先前在锡安陷落时的行为；补出“酒”使汉语意象自然，但不把审判含义直接写进正文。
- source_word: עַל הַר קָדְשִׁי
  choice: 在我的圣山上
  rationale: 保留具体地点及第一人称所属关系，不直接将“圣山”解释为锡安或耶路撒冷。
- source_word: יִשְׁתּוּ כָל הַגּוֹיִם תָּמִיד
  choice: 列国也必照样不断地喝
  rationale: “列国”准确表达גּוֹיִם；“必”体现预告性的未完成式，“不断地”传达תָּמִיד的持续意味。
- source_word: וְשָׁתוּ וְלָעוּ
  choice: 他们必喝，必吞下去
  rationale: 保留希伯来文对“喝”的重复以呈现修辞加强；“吞下去”表达לָעוּ较可能的吞咽、喝尽之义，同时不采用带有较多推断色彩的“踉跄”或“昏乱”。
- source_word: וְהָיוּ כְּלוֹא הָיוּ
  choice: 并且归于无有，仿佛从未存在过
  rationale: 兼顾结果与比较结构；“归于无有”传达彻底消亡的力度，“仿佛”保留כְּ的比较性质。
theological_decisions:
- issue: “喝”的意象所指
  choice: 正文保留饮酒、吞咽的形象，并以脚注说明其很可能象征承受上帝的审判。
  alternative: 在正文直接译成“承受上帝的烈怒”或仅按字面理解为饮酒。
  rationale: 先知文学常以饮杯描绘审判，但本节并未明说“杯”或“烈怒”；保留原有形象可避免把合理解释变成正文措辞。
- issue: 第二人称复数“你们”的指代
  choice: 正文只保留“你们”，按上下文理解为以东。
  alternative: 在正文明确改写为“你们以东人”，或理解为列国、犹大。
  rationale: 上下文主要向以东说话，但原文本节没有重述名称；保留代词既忠实又维持篇章衔接。
- issue: “归于无有”的范围
  choice: 按经文强烈措辞译为彻底消亡，但保留“仿佛”的比较表达。
  alternative: 将其系统化解释为民族政治实体的终结、肉身灭亡或永恒刑罚。
  rationale: 本节本身没有界定消亡的具体层面，不宜在翻译中加入教义性限定。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“喝了酒”使前半句在汉语中自然，“喝”和“吞下去”的重复则保留原文的节奏与力度。脚注标记置于整节末尾，所注内容涵盖本节反复出现的饮喝意象。
