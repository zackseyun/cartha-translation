  text: עַֽד הַ/גְּב֣וּל שִׁלְּח֗וּ/ךָ כֹּ֚ל אַנְשֵׁ֣י בְרִיתֶ֔/ךָ הִשִּׁיא֛וּ/ךָ יָכְל֥וּ לְ/ךָ֖ אַנְשֵׁ֣י שְׁלֹמֶ֑/ךָ לַחְמְ/ךָ֗ יָשִׂ֤ימוּ מָזוֹר֙ תַּחְתֶּ֔י/ךָ אֵ֥ין תְּבוּנָ֖ה בּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/obadiah/001/007.yaml
  text: All the men of your covenant have sent you to the border[a]; the men at peace with you have deceived you and prevailed against you[c][b]. Those who eat your bread have set a trap under you—there is no understanding in him.
translation:
  language: zh_hans
  text: 与你立约的人都把你送到边境[a]；与你和睦的人欺骗了你，胜过了你。吃你饭的人在你脚下设下陷阱[b]——他毫无洞察力[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“把你赶到边境”，也可理解为“把你护送到边境”。原文动词在此既可能是中性的，也可能带有敌意。
    reason: lexical_alternative
  - marker: b
    text: 或译“在你脚下设下网罗”。译作“陷阱”的原文词十分罕见，确切含义不确定。
    reason: lexical_alternative
  - marker: c
    text: 或译“他毫无辨识力”。“他”可能指以东；也有人理解为“其中”，或因原文所指不明确而用其他方式断句。
    reason: alternative_reading
lexical_decisions:
- source_word: עַד הַגְּבוּל
  choice: 到边境
  rationale: 保留具体的空间终点；“边境”在现代汉语中自然，也不预先判定这是护送还是驱逐。
- source_word: שִׁלְּחוּךָ
  choice: 把你送到
  rationale: 使役强化式在此可指送走、遣走，语境也可能带有驱逐意味；正文采用较宽泛的译法，把敌意程度留在注释中。
- source_word: אַנְשֵׁי בְרִיתֶךָ
  choice: 与你立约的人
  rationale: 保留“约”的明确措辞及政治盟约意味，而不简化为“盟友”。
- source_word: הִשִּׁיאוּךָ
  choice: 欺骗了你
  rationale: 该使役形式在本语境中表示使人受骗或误入歧途；“欺骗”清楚表达盟友背叛。
- source_word: יָכְלוּ לְךָ
  choice: 胜过了你
  rationale: 贴近“胜过、占上风”的惯用意义，且比“制服”少作进一步解释。
- source_word: אַנְשֵׁי שְׁלֹמֶךָ
  choice: 与你和睦的人
  rationale: 保留“与你处于和平关系”的关系性含义，不缩窄为私人朋友。
- source_word: לַחְמְךָ
  choice: 吃你饭
  rationale: “饭”自然传达同桌进食和受款待的意象；以“吃你饭的人”表达原文省略而语义所需的动词关系。
- source_word: יָשִׂימוּ מָזוֹר תַּחְתֶּיךָ
  choice: 在你脚下设下陷阱
  rationale: מָזוֹר罕见且含义不确定；“陷阱”符合背叛语境，“在你脚下”保留תחתיך的空间图像。
- source_word: אֵין תְּבוּנָה בּוֹ
  choice: 他毫无见识
  rationale: 保留阳性单数指代及对辨识能力的否定，同时用自然、庄重的现代汉语表达；具体所指仍有歧义。
theological_decisions:
- issue: בּוֹ的指代对象
  choice: 正文译作“他”，不明确补出“以东”
  alternative: 译作“以东毫无见识”或“其中毫无明智可言”
  rationale: 希伯来文只有阳性单数代词，可能指以东或被背叛者；直接补出专名会消除原文的真实歧义，因此正文保留代词并以脚注说明。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。平行分句保持先知诗歌的紧凑节奏；保留“立约”“和睦”“脚下”等原文关系与空间意象，不以解释性称谓消除歧义。
