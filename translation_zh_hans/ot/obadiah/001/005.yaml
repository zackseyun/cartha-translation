  to: 若有盗贼来到你这里，若有夜间劫掠者来到你这里——你竟被毁灭！[a]——他们岂不只偷够他们所需的吗？[b]若有摘葡萄的人来到你这里，他们岂不还会留下一些残余的葡萄吗？
