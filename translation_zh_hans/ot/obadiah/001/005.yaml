base_translation:
  language: en
  yaml_path: translation/ot/obadiah/001/005.yaml
  text: If thieves came to you[a], if robbers by night—how you have been destroyed!—would they not steal only enough for themselves? If grape gatherers came to you[b], would they not leave gleanings?
translation:
  language: zh_hans
  text: 若有盗贼来到你这里，若有夜间劫掠者来到你这里——你竟被毁灭！[a]——他们岂不只偷够他们所需的吗？[b]若有摘葡萄的人来到你这里，他们岂不还会留下一些残余的葡萄吗？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你竟被剪除！”或“你竟被毁坏！”这里的希伯来语动词在灾毁的语境中可有几个彼此相近的意思。
    reason: lexical_alternative
  - marker: b
    text: 直译：“他们的够用之量。”即只偷取够他们自己所需的。
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּנָּבִים
  choice: 贼
  rationale: 指偷窃之人；“贼”是自然、简洁的现代汉语对应词。
- source_word: שֹׁדְדֵי לַיְלָה
  choice: 强盗夜间来袭
  rationale: שׁדד含暴力劫掠之意；此译既表达劫掠者的性质，也保留“夜间”的时间信息。
- source_word: אֵיךְ נִדְמֵיתָה
  choice: 你竟遭毁灭
  rationale: 此处נִדְמֵיתָה在以东遭彻底灾毁的语境中可指被毁灭、被剪除或沦为废墟；“竟”体现אֵיךְ所引出的惊叹哀叹语气。
- source_word: הֲלוֹא יִגְנְבוּ דַּיָּם
  choice: 他们岂不只偷到够用为止吗
  rationale: דַּיָּם直指“他们所够用的量”；译文保留普通盗贼只取到满足自身为止、不会搜刮殆尽的对比。
- source_word: בֹּצְרִים
  choice: 摘葡萄的人
  rationale: 该词特指葡萄收成时采摘葡萄的人；此表达比泛称“收割的人”更准确，也比术语化表达更易懂。
- source_word: יַשְׁאִירוּ עֹלֵלוֹת
  choice: 还会留下一些余穗
  rationale: עֹלֵלוֹת指葡萄采摘后留下、可供拾取的少量果实；“余穗”在汉语圣经语体中能简洁传达收获后残留可拾取之物，但具体为葡萄由上下文限定。
- source_word: לְךָ / לָךְ
  choice: 来到你这里
  rationale: 保留介词ל与“来”搭配的基本方向含义；敌意在夜间强盗和全节灾毁的语境中已经清楚，无须一律明译为“攻击你”。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重且易懂的简体中文。保留本节两个反问句和中间突入的哀叹，以呈现原文的修辞张力；“你”按上下文指以东。
