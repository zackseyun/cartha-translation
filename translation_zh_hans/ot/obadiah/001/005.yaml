  terminology: “盗贼”“劫掠者”“摘葡萄的人”均合乎上下文。“残余的葡萄”在此比技术性较强而又易引起谷物联想的“余穗”更准确。补足“够他们所需”的词汇注，反映 דַּיָּם 的“他们的够用之量”。
