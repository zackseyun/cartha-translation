  text: וְ/עָל֤וּ מֽוֹשִׁעִים֙ בְּ/הַ֣ר צִיּ֔וֹן לִ/שְׁפֹּ֖ט אֶת הַ֣ר עֵשָׂ֑ו וְ/הָיְתָ֥ה לַֽ/יהוָ֖ה הַ/מְּלוּכָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/obadiah/001/021.yaml
  text: Deliverers will go up on Mount Zion to judge the hill country of Esau[c][b][a], and the kingdom will belong to Yahweh.
translation:
  language: zh_hans
  text: 拯救者[a]必登上锡安山，审判以扫山区[b]；王权[c]必归耶和华。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“施行拯救的人”。原文为复数，指带来解救的执行者，并非否认最终的拯救属于耶和华。
    reason: lexical_alternative
  - marker: b
    text: 也可译“以扫的山”或“以扫山”；原文可能指以东的山地。
    reason: lexical_alternative
  - marker: c
    text: 或译“国度”或“统治权”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָלוּ
  choice: 必登上
  rationale: 该动词在先知性语序中表达将来的行动；“登上”保留了向锡安山上行的具体空间意象。“必”自然传达预言所宣告之事的确定性。
- source_word: מוֹשִׁעִים
  choice: 拯救者
  rationale: 这是复数使役分词名词，指施行解救的人或代理者。“拯救者”既保留复数的人间执行者，也不把其作用与耶和华最终的拯救主权混同。
- source_word: בְּהַר צִיּוֹן
  choice: 在锡安山（由“登上锡安山”整体表达）
  rationale: 介词短语表示这些人登上后所在或施行行动的地点；现代汉语用“登上锡安山”即可自然涵盖原文的地点关系。
- source_word: לִשְׁפֹּט
  choice: 审判
  rationale: 保留 שפט 的核心司法意义；该词在语境中也可能含有治理或统治之意，但正文不将这一层面过度明确化。
- source_word: אֶת הַר עֵשָׂו
  choice: 以扫山
  rationale: 形式上贴近原文“以扫之山”，并保留它可能指一座山、山区或以东山地的开放性；地域含义在脚注说明。
- source_word: וְהָיְתָה לַיהוָה
  choice: 必归耶和华
  rationale: 原文系词配合表示归属的 ל；汉语“归耶和华”自然表达所属，同时保留末句庄严、宣告性的语气。
- source_word: הַמְּלוּכָה
  choice: 王权
  rationale: 该名词核心指君王的统治权、王权或王的统治。“王权”比“国度”更直接表达此处抽象的统治主权，同时以脚注保留“国度、统治”的可能译法。
theological_decisions:
- issue: 复数 מוֹשִׁעִים 所指的人间施救者与耶和华主权之间的关系
  choice: 拯救者
  alternative: 救主；施行拯救的人
  rationale: 原文明确使用复数，指执行解救的代理者；末句则把王权归于耶和华。译文保留这两者之间的张力，不暗示这些人拥有与耶和华竞争的终极救恩地位。
- issue: הַמְּלוּכָה 是领域、身份还是统治权
  choice: 王权必归耶和华
  alternative: 国度必归耶和华；统治权必归耶和华
  rationale: 原词可以指王权、王的统治或国度。“王权”在这里较凝练地呈现全书末尾对耶和华掌权的宣告，同时脚注保留其语义范围。
- issue: לִשְׁפֹּט 的司法与治理含义
  choice: 审判
  alternative: 治理；统治
  rationale: “审判”是最直接的词义，也与以扫受审的语境契合；不在正文中将其扩展为单纯的政治治理，以免消除原文可能兼具的含义。
translation_notes:
  register: 采用庄重而简明的现代标准汉语。“必……；……必……”形成适合先知性宣告的节奏。“以扫山”刻意保留原文地理表达的简洁与一定歧义，脚注再说明其地域性可能。“耶和华”采用简体中文圣经语境中对四字神名 יהוה 的通行专名译法。
