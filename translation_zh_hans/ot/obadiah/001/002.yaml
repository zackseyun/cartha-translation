  yaml_path: translation/ot/obadiah/001/002.yaml
  text: Look[a], I have made you small among the nations[b]; you are greatly despised.
translation:
  language: zh_hans
  text: 看哪，我已使你在列国中变得渺小[a]；你大受藐视。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “渺小”也可译作“微不足道”。原文可直译为“我已使你在列国中为小”，这里表达“使你在列国中变得渺小”。
    reason: 说明“渺小”的语义替代，并以不实体化形容词的方式说明原文习语结构。
lexical_decisions:
- source_word: הִנֵּה
  choice: 看哪
  rationale: 这是引人注意并加强宣告语气的提示词。“看哪”简洁、庄重，也保留了原文的指示性和修辞力度。
- source_word: קָטֹן
  choice: 渺小
  rationale: 此处不只涉及体量小，更侧重在列国中的地位卑微、无足轻重。“渺小”既保留“小”的基本意象，又能自然表达地位低微；“微不足道”则解释性更强，列入脚注。
- source_word: נְתַתִּיךָ
  choice: 我已使你……变得
  rationale: 动词字面为“我已给/置”，但与表语“渺小”连用时具有使成或结果含义。译作“使你……变得”符合现代汉语，也准确传达此处的习语结构。
- source_word: בַּגּוֹיִם
  choice: 在列国中
  rationale: גּוֹיִם在此泛指各国或各民族，并非后期犹太—外邦人对举意义上的“外邦人”。“列国”适合先知书的庄重语体。
- source_word: בָּזוּי
  choice: 受藐视
  rationale: 被动分词表示处于被轻看、被鄙弃的状态。“受藐视”简洁地保留了被动和关系性的贬抑含义。
- source_word: מְאֹד
  choice: 大受
  rationale: 该副词强化“受藐视”的程度。汉语“大受藐视”自然凝练，并保留“非常、极其”的强调。
theological_decisions:
- issue: 神谕中完成体的时间与语气
  choice: 译作“我已使你”，表达已经确立并具有当前效力的神圣行动或判决。
  alternative: “我将使你”或“我使你”
  rationale: נְתַתִּיךָ是第一人称单数完成体。在先知性宣告中，它既可描述已成之事，也可把确定的判决作为已经确立来宣告。采用“已”保留其完成性和既定性，不擅自改译为单纯将来时。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“看哪”和“列国”保留先知书宣告的力度；其余表达避免古奥。“渺小”与“大受藐视”形成简洁的平行推进。
