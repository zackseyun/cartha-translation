source:
  edition: WLC
  text: וְ/יָרְשׁ֨וּ הַ/נֶּ֜גֶב אֶת הַ֣ר עֵשָׂ֗ו וְ/הַ/שְּׁפֵלָה֙ אֶת פְּלִשְׁתִּ֔ים וְ/יָרְשׁוּ֙ אֶת שְׂדֵ֣ה אֶפְרַ֔יִם וְ/אֵ֖ת שְׂדֵ֣ה שֹׁמְר֑וֹן וּ/בִנְיָמִ֖ן אֶת הַ/גִּלְעָֽד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/obadiah/001/019.yaml
  text: Those of the Negev will possess the hill country of Esau[a], and those of the Shephelah the land of the Philistines; they will also possess the territory of Ephraim and the territory of Samaria[b], and Benjamin will possess Gilead.
translation:
  language: zh_hans
  text: 南地的人必占有[a]以扫山地，低地的人必占有非利士人的土地[b]；他们也必占有以法莲地区和撒马利亚地区，便雅悯人必占有基列。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “占有”也可译作“承受为业”；本节下同。希伯来语动词既可表示承受土地，也可表示取得并占有土地。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译为“非利士人”；正文按地域含义补出“土地”。
    reason: lexical_explication
lexical_decisions:
- source_word: יָרְשׁוּ
  choice: 必占有
  rationale: 该动词可指承受产业，也可指取得并占有土地；本节聚焦地域归属，“占有”自然且不限定取得方式。
- source_word: הַנֶּגֶב
  choice: 南地的人
  rationale: “南地”在此借地域指当地居民；补出“的人”可清楚表达其作为动词主语的功能。
- source_word: הַר עֵשָׂו
  choice: 以扫山地
  rationale: 这里的“山”可指山地区域，而非单独一座山峰；“以扫山地”保留地名关联及地域含义。
- source_word: הַשְּׁפֵלָה
  choice: 低地的人
  rationale: 该地理名称指犹大西部低地，此处借地域指其居民；译作“低地的人”既清楚又避免生硬音译。
- source_word: פְּלִשְׁתִּים
  choice: 非利士人的土地
  rationale: 希伯来文直称“非利士人”，但作为“占有”的宾语，语境所指是其土地；正文补出“土地”，并以脚注说明原文形式。
- source_word: שְׂדֵה אֶפְרַיִם
  choice: 以法莲地区
  rationale: שְׂדֵה 字面可指田野，在此土地归属语境中泛指以法莲的地域，并非一块田。
- source_word: שְׂדֵה שֹׁמְרוֹן
  choice: 撒马利亚地区
  rationale: 该短语指与撒马利亚相关的地域；“地区”比字面的“田野”更符合本节语境。
- source_word: בִנְיָמִן
  choice: 便雅悯人
  rationale: 支派名在此集体指便雅悯支派的人；补出“人”符合现代汉语表达。
- source_word: הַגִּלְעָד
  choice: 基列
  rationale: 这是约旦河东的地域名称，采用通行中文译名即可，无须把希伯来语定冠词另行译出。
theological_decisions:
- issue: 土地取得方式是否应明确为继承或征服
  choice: 采用中性的“占有”
  alternative: “承受为业”或“夺取”
  rationale: 希伯来动词 יָרַשׁ 可涵盖继承、取得和占有土地等意义；上下文未要求在继承与征服之间作单一判定，因此保留其张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。地域名称尽量使用普通读者可理解的表达；在地名借指居民之处补出“的人”，并用“地区”传达 שְׂדֵה 在本节中的地域意义。
