  text: אִם תַּגְבִּ֣יהַּ כַּ/נֶּ֔שֶׁר וְ/אִם בֵּ֥ין כּֽוֹכָבִ֖ים שִׂ֣ים קִנֶּ֑/ךָ מִ/שָּׁ֥ם אוֹרִֽידְ/ךָ֖ נְאֻם יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/obadiah/001/004.yaml
  text: Though you soar high like the eagle[a], and though you set your nest among the stars, from there I will bring you down, declares Yahweh.
translation:
  language: zh_hans
  text: 即使你如鹰般高飞[a]，即使你把巢安在群星之间，我也必从那里使你降下。这是耶和华的宣告。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“如果你像鹰一样升到高处，如果你把巢安在群星之间。”希伯来语的条件词可译作“如果”，但这里也可理解为让步语气，意思是：即使以东升到最高之处，耶和华仍要使它降下。
    reason: 保留 אִם 的条件式直译及其在本句中可能具有的让步功能。
lexical_decisions:
- source_word: אִם / וְאִם
  choice: 即使……即使……
  rationale: 此处条件词在先知诗歌中表达让步意味：无论以东升到多高，结局仍不会改变；同时脚注保留直译为“如果”的可能。
- source_word: תַּגְבִּיהַּ כַּנֶּשֶׁר
  choice: 如鹰高飞
  rationale: 动词是 גבה 的使役式，表达升高；结合“鹰”的明喻，用“高飞”自然呈现空间意象，不过度加入“自高”的解释。
- source_word: בֵּין כּוֹכָבִים
  choice: 在群星之间
  rationale: בֵּין 与复数“星辰”连用，表示处于群星之中；“群星之间”既贴近原文，又符合现代汉语。
- source_word: שִׂים קִנֶּךָ
  choice: 把巢安在
  rationale: שׂים 是“放置、安放”；“把巢安在”在汉语中自然，并保留鹰巢及安全居所的比喻。
- source_word: מִשָּׁם אוֹרִידְךָ
  choice: 我也必从那里把你拉下来
  rationale: ירד 的使役式意为“使之下来”。“拉下来”清楚表达上升与降下的反转，又不额外加入“摔落”或“抛下”的强烈动作。
- source_word: נְאֻם יְהוָה
  choice: 这是耶和华的宣告
  rationale: נְאֻם 是典型先知宣告公式；“这是……的宣告”庄重而清楚。神名 יְהוָה 采用现代中文广为人知的音译“耶和华”，直接呈现专名。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威；上主
  rationale: 原文直接使用四字神名。中文正文采用广为人知的专名形式“耶和华”，避免以称号替代专名；“雅威”是另一种较接近学术重构读音的译法。
- issue: 两个 אִם 的条件或让步语气
  choice: 即使
  alternative: 如果
  rationale: 上下文的修辞重点是：纵使以东处于不可企及的高处，耶和华仍必使其降下。因此正文用让步式“即使”，但不否认其形式上的条件含义，并在脚注中保留。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“如鹰高飞”“群星之间”保留诗歌意象；“拉下来”直观呈现 אוֹרִידְךָ 的使役意义。脚注标记已置于正文相关分句之后。
