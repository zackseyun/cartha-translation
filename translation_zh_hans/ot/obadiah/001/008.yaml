  text: הֲ/ל֛וֹא בַּ/יּ֥וֹם הַ/ה֖וּא נְאֻם יְהוָ֑ה וְ/הַאֲבַדְתִּ֤י חֲכָמִים֙ מֵֽ/אֱד֔וֹם וּ/תְבוּנָ֖ה מֵ/הַ֥ר עֵשָֽׂו־׃
base_translation:
  language: en
  yaml_path: translation/ot/obadiah/001/008.yaml
  text: Will I not[a], on that day, declares Yahweh, destroy the wise men from Edom, and understanding from the mountain of Esau?
translation:
  language: zh_hans
  text: 耶和华宣告：“在那日，我岂不从以东除灭智者，从以扫山[a]除去悟性吗？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“以扫的山”；也可译作“以扫山区”。此处可能指以扫（即以东）所属的山地。
    reason: 说明希伯来文地理表达可按字面译为单数的“山”，也可指以扫／以东的山地范围。
lexical_decisions:
- source_word: הֲלוֹא
  choice: 岂不……吗
  rationale: 引出预期肯定回答的反问；这一表达既保留希伯来文的疑问形式，也自然传达强烈的肯定意味。
- source_word: בַּיּוֹם הַהוּא
  choice: 到那日
  rationale: 这是先知书常见的时间表达；“到那日”在现代汉语中自然庄重，并保留指向将来审判之日的语气。
- source_word: נְאֻם יְהוָה
  choice: 耶和华宣告
  rationale: 这是标明神圣话语的先知性套语；“宣告”比普通的“说”更能体现其庄严和权威。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代简体中文读者熟悉的专名形式音译四字神名，不以称号替代。
- source_word: וְהַאֲבַדְתִּי
  choice: 除灭
  rationale: 该使役形式表示耶和华主动使之消失或灭亡；“除灭”准确体现审判语境中的力度。
- source_word: חֲכָמִים
  choice: 智慧人
  rationale: 保留指人的复数名词含义，并与后面的抽象名词“聪明”形成原文中的对应关系；中文无需另加性别标记。
- source_word: מֵאֱדוֹם
  choice: 从以东
  rationale: 介词表示从某地移除；“从以东除灭”直接保留其来源或范围意义。
- source_word: וּתְבוּנָה
  choice: 聪明
  rationale: 该词指理解力、洞察力或明辨能力；“聪明”保留抽象名词形式，也与“智慧人”构成自然平行。
- source_word: מֵהַר עֵשָׂו
  choice: 从以扫山
  rationale: 直译为“从以扫之山”；“以扫山”保留山的意象和与“以东”的平行，同时脚注说明它也可能泛指以扫的山区。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。正文采用现代中文圣经传统中最广为人知的专名“耶和华”，保留其作为名字而非称号的性质；“雅威”是较贴近学术重构发音的另一种音译。
- issue: חֲכָמִים 所指群体的表达
  choice: 智慧人
  alternative: 智者
  rationale: 原文为语法上的阳性复数，语境可能指以东著名的智者阶层；“智慧人”保留指人的形式，但不在缺乏明确语境依据时额外限定为成年男性。
- issue: מֵהַר עֵשָׂו 的地理范围
  choice: 以扫山
  alternative: 以扫山区
  rationale: 正文保留原文单数“山”的具体意象，不把它直接解释为整个山区；脚注呈现其可能泛指山地的理解。
translation_notes:
  register: 采用现代、庄重而易懂的先知宣告语体。将整句处理为反问，以对应原文预期肯定回答的结构；用“除灭……除掉……”避免汉语中过度重复，同时保留两个并列受词及其审判力度。脚注标记紧随其所解释的“以扫山”。
