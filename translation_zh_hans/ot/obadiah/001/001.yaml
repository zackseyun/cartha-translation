  text: חֲז֖וֹן עֹֽבַדְיָ֑ה כֹּֽה אָמַר֩ אֲדֹנָ֨/י יְהוִ֜ה לֶ/אֱד֗וֹם שְׁמוּעָ֨ה שָׁמַ֜עְנוּ מֵ/אֵ֤ת יְהוָה֙ וְ/צִיר֙ בַּ/גּוֹיִ֣ם שֻׁלָּ֔ח ק֛וּמוּ וְ/נָק֥וּמָה עָלֶי/הָ לַ/מִּלְחָמָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/obadiah/001/001.yaml
  text: 'The vision of Obadiah[a]. Thus says the Lord GOD concerning Edom: We have heard a report from Yahweh, and a messenger has been sent among the nations: “Rise up[c][b], and let us rise against her for battle.”'
translation:
  language: zh_hans
  text: '俄巴底亚的异象。主耶和华论以东如此说：


    我们[c]从耶和华听见了消息；

    有一位使者[a]奉差遣到列国中：


    “起来吧！让我们起来攻击她[b]，

    跟她作战！”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “使者”也可译作“使节”或“特使”。
    reason: lexical_alternative
  - marker: b
    text: 原文作“攻击她”；“她”指作为一个国家的以东，也可按中文习惯译作“攻击它”。
    reason: lexical_alternative
  - marker: c
    text: 原文没有说明“我们听见了”和后文“让我们起来”中的“我们”分别指谁，因此可以有不止一种理解。
    reason: alternative_reading
lexical_decisions:
- source_word: חֲזוֹן
  choice: 异象
  rationale: 该词通常指先知所得的启示性异象；“异象”直接保留其先知文献色彩，同时不武断限定启示的具体方式。
- source_word: עֹבַדְיָה
  choice: 俄巴底亚
  rationale: 采用现代中文圣经传统中通行的人名音译。
- source_word: כֹּה אָמַר
  choice: 如此说
  rationale: 保留先知宣告的惯用公式，语言庄重而清楚。
- source_word: אֲדֹנָי יְהוִה
  choice: 主耶和华
  rationale: 分别表达 אֲדֹנָי 的“主”和神圣名 יהוה 的“耶和华”，并保留复合称号。
- source_word: לֶאֱדוֹם
  choice: 论以东
  rationale: 此处介词引出神谕所针对的对象或主题，并非直接向以东说话；“论以东”简洁自然。
- source_word: שְׁמוּעָה
  choice: 消息
  rationale: 该词指所听见的消息、报道或音讯；“消息”在现代中文中中性自然，不含“谣言”的不确定意味。
- source_word: שָׁמַעְנוּ
  choice: 我们听见了
  rationale: 按希伯来语完成式表达已经听见这一事实，同时保留原文未说明身份的第一人称复数。
- source_word: מֵאֵת יְהוָה
  choice: 从耶和华
  rationale: 明确保留消息来自 יהוה，并将神圣名译作“耶和华”。
- source_word: וְצִיר
  choice: 有一位使者
  rationale: צִיר 可指使者、使节或特使；“使者”涵盖面较广，不会过度限定其外交身份。
- source_word: בַּגּוֹיִם
  choice: 到列国中
  rationale: “列国”准确表达 גּוֹיִם 在此处的国际政治语境，也符合庄重的先知文体。
- source_word: שֻׁלָּח
  choice: 奉差遣
  rationale: 保留被动语态所表达的受差派含义，不擅自补明差遣者。
- source_word: קוּמוּ
  choice: 起来吧
  rationale: 这是复数命令式和军事号召；“起来吧”有号召力，又符合现代汉语。
- source_word: וְנָקוּמָה עָלֶיהָ לַמִּלְחָמָה
  choice: 让我们起来攻击她，跟她作战
  rationale: 保留第一人称复数劝勉式、阴性单数代词以及军事行动的含义；不明确代词以外的参与者身份。
theological_decisions:
- issue: 神圣名 יהוה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 采用现代中文读者最熟悉的传统专名“耶和华”，将其作为专名而非普通称号；同时在 אֲדֹנָי יְהוִה 中译作“主耶和华”。
- issue: “我们听见了”与“让我们起来”中第一人称复数的所指
  choice: 保留原文的第一人称复数，不说明说话者是谁
  alternative: 将其解释为先知群体、天上议会或响应号召的列国
  rationale: 希伯来文没有明说两个复数的身份，也没有明确断定它们是否指同一群体；译文保留这种文学和神学上的开放性。
- issue: 阴性单数代词 עָלֶיהָ 的所指
  choice: 译作“攻击她”
  alternative: 按所指对象译作“攻击以东”或“攻击它”
  rationale: 原文以阴性单数代词拟人化地指向以东；正文保留“她”，脚注说明所指，避免抹平原文的语法形象。
translation_notes:
  register: 采用现代、庄重而易懂的先知文体，并按希伯来诗行分行。保留“如此说”“列国”等经文语域中的常用表达，但避免生硬古语。正文中的脚注标记与脚注内容逐一对应；同时纠正咨询层中脚注标记位置与内容不相符的问题。
