  source_fidelity: 译文整体准确传达了题注、神谕对象、来自耶和华的消息、使者被遣往列国，以及未指明所指的复数号召。惟“说”把引号内的号召明确归给“使者”，而希伯来文在“使者被差到列国中”后直接引出号召，并未明说使者是该引语的说话者；应以冒号直接引出，以保留原文的句法与说话者开放性。
  naturalness: 整体为自然、庄重的现代汉语。“起来吧！让我们起来攻击她，跟她作战！”顺畅且保留先知性号召语气。将“说”改为冒号后，行文仍自然。
  terminology: “异象”“主耶和华”“以东”“列国”“使者”均恰当；“耶和华”在两处一致保留神名。“她”保留原文阴性单数、拟人化指称，并由脚注说明，处理合宜。
