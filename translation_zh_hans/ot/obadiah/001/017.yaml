  text: וּ/בְ/הַ֥ר צִיּ֛וֹן תִּהְיֶ֥ה פְלֵיטָ֖ה וְ/הָ֣יָה קֹ֑דֶשׁ וְ/יָֽרְשׁוּ֙ בֵּ֣ית יַֽעֲקֹ֔ב אֵ֖ת מוֹרָֽשֵׁי/הֶם׃
base_translation:
  language: en
  yaml_path: translation/ot/obadiah/001/017.yaml
  text: But on Mount Zion there will be deliverance[a], and it will be holy[c][b], and the house of Jacob will possess their possessions.
translation:
  language: zh_hans
  text: 但在锡安山必有拯救[a]，那里必为圣；雅各家必占有自己的产业[b][c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“必有逃脱的人。”希伯来语名词既可指逃脱、获救，也可指逃脱的人。
    reason: lexical_alternative
  - marker: b
    text: 或译：“必承受自己的产业。”
    reason: lexical_alternative
  - marker: c
    text: 若把末尾的词理解为施事者，也可能译作：“雅各家必赶走那些夺取他们产业的人。”
    reason: alternative_reading
lexical_decisions:
- source_word: וּ/בְ/הַר צִיּוֹן
  choice: 但在锡安山
  rationale: 前缀连词字面可译“而/并且”，但本节与前文以东受审判形成明显转折，因此用“但”自然传达语篇对比；“锡安山”保留标准地名。
- source_word: תִּהְיֶה פְלֵיטָה
  choice: 必有拯救
  rationale: 未完成式在此表达将来的存在；פְלֵיטָה可指逃脱、获救，也可具体指逃脱的人。“必有拯救”在中文中保留事件或状态层面的宽度，不把所指限定为幸存者；具体的人群义列入脚注。
- source_word: וְ/הָיָה קֹדֶשׁ
  choice: 那里必成为圣地
  rationale: 阳性单数动词最自然地回指锡安山。קֹדֶשׁ表示圣洁或分别为圣之物、之地；译作“那里必成为圣地”既自然，也清楚表达锡安山分别为圣的地位。
- source_word: וְ/יָרְשׁוּ
  choice: 必占有
  rationale: ירשׁ可表示占有、承受产业，也可在某些结构中表示夺取或赶出。“占有”与宾语“产业”搭配自然，同时不强行限定为法律性的继承。
- source_word: בֵּית יַעֲקֹב
  choice: 雅各家
  rationale: 这是指雅各后裔、以色列的盟约性民族称呼；“雅各家”是庄重而通行的先知文体表达。
- source_word: אֵת מוֹרָשֵׁי/הֶם
  choice: 自己的产业
  rationale: מוֹרָשָׁה通常指产业、所有物或承受之业，复数后缀表明这些产业属于雅各家。“自己的”明确反映希伯来语后缀；另有施事性理解，见脚注。
theological_decisions:
- issue: 锡安所应许之复兴的性质
  choice: 经文宣告以锡安山为中心的真实拯救与恢复，并称那里为圣地，但正文不把“拯救”仅限定为逃脱者、营救行动或圣所地位中的某一方面。
  alternative: 可侧重理解为锡安山上将有逃脱的余民，或侧重理解为锡安本身成为圣所。
  rationale: 希伯来语容许逃脱、获救者和圣洁之地等彼此重叠的观念；译文保留这种先知性张力，不以特定教义框架加以收窄。
- issue: 雅各家重新得产业还是使掠夺者失去所有
  choice: 正文按名词义理解מוֹרָשֵׁיהֶם，译为雅各家占有自己的产业。
  alternative: 也可能按施事性含义理解为“雅各家必赶走那些夺取他们产业的人”。
  rationale: 名词“产业”在形态和复兴语境中更为直接，但另一读法会显著影响解释，因此保留在脚注中。
translation_notes:
  register: 采用现代、庄重而易懂的先知文体。“但”突出与前文审判的对比；“那里”自然回指锡安山，避免生硬重复。脚注标记紧随各自所说明的词句，并在正文中全部出现。
