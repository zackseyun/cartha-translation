base_translation:
  language: en
  yaml_path: translation/ot/obadiah/001/013.yaml
  text: Do not enter the gate of my people in the day of their disaster[a]; do not look on his calamity, even you, in the day of his disaster[b]; and do not lay hands on his wealth in the day of his disaster.
translation:
  language: zh_hans
  text: 在我子民遭难的日子[a]，你不可进入我子民的城门；在他遭难的日子，连你也不可看着[b]他的灾祸；在他遭难的日子，你不可伸手夺取他的财物[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文此处说“他们遭难”，后两句则转用单数“他”，可能是在群体百姓与人格化的民族之间转换。
    reason: textual_rhetorical_feature
  - marker: b
    text: 原文直译为“看着”；上下文显示，这种观看可能带有幸灾乐祸的意味。
    reason: lexical_alternative
  - marker: c
    text: “财物”所译的希伯来词也可指“实力”“军队”或“资源”；此处按灾后抢掠的语境译为“财物”。
    reason: lexical_alternative
lexical_decisions:
- source_word: תָּבוֹא בְשַׁעַר עַמִּי
  choice: 进入我子民的城门
  rationale: 保留“城门”的具体意象；在先知书语境中，进入城门也意味着进入城中。
- source_word: אֵיד
  choice: 遭难／灾祸
  rationale: אֵיד指灾难、祸患；译文以“遭难的日子”形成自然而庄重的反复，并用“灾祸”表达רָעָה在此所指的受害境遇。
- source_word: תֵּרֶא
  choice: 幸灾乐祸地看着
  rationale: ראה字面是“看、看见”，但上下文带有敌意旁观的意味；此译既保留“看”的词义，又表达语境中的恶意欣赏。
- source_word: גַם אַתָּה
  choice: 连你也
  rationale: 保留对以东格外尖锐的责备和强调。
- source_word: תִּשְׁלַחְנָה בְחֵילוֹ
  choice: 伸手夺取他的财物
  rationale: שׁלח与介词ב连用可表示伸手侵害或攫取；חַיִל在此可指财物、实力或军队，抢掠语境使“财物”最为贴切。
theological_decisions:
- issue: 本节代词由复数转为单数
  choice: 首句译作“我子民遭难”，后两句保留“他／他的”
  alternative: 将全节统一译成复数或单数
  rationale: 希伯来文先用复数后缀“他们”，随后改用单数“他”，可能在群体百姓与人格化的雅各／民族之间转换；保留这一变化，不擅自消除经文的修辞张力。
- issue: 敌意观看的语气
  choice: 译作“幸灾乐祸地看着”
  alternative: 仅译作“看着”或直接译作“幸灾乐祸”
  rationale: 原动词本义是“看”，语境却明显含敌意；合并表达可同时保留词面动作和语用含义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。三次以“遭难的日子”形成反复，尽量保存原文的警告节奏；“进入城门”“伸手夺取”等表达保留具体动作意象。
