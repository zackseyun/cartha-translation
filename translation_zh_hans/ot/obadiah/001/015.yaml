base_translation:
  language: en
  yaml_path: translation/ot/obadiah/001/015.yaml
  text: For the day of Yahweh is near upon all the nations[a]. As you have done, it will be done to you[b]; your recompense will return on your own head.
translation:
  language: zh_hans
  text: 因为雅威的日子临近，必临到万国[a]。你怎样行，也必照样施行在你身上；你的报偿[b]必归到你自己头上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“针对万国”。这里的介词可以表示审判所针对的对象。
    reason: lexical_alternative
  - marker: b
    text: 或译“报应”“回报”。原文所指的是一个人因自己所行而得到的回应。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，为先前的警告说明根据；“因为”自然保留解释或因果作用。
- source_word: קָרוֹב
  choice: 临近
  rationale: 作谓语表示迫近；“临近”既简明，也保留先知宣告的庄重语气。
- source_word: יוֹם יְהוָה
  choice: 雅威的日子
  rationale: 保留先知书中指向雅威施行决定性审判的固定表达，并将神名 יְהוָה 音译为“雅威”。
- source_word: עַל כָּל הַגּוֹיִם
  choice: 临到万国
  rationale: עַל 在此可表示事件临到其对象，也可能带有针对、审判的意味；正文采用自然且不将敌对意味绝对化的表达，脚注保留“攻击”的可能。
- source_word: כַּאֲשֶׁר עָשִׂיתָ
  choice: 你怎样行
  rationale: 保留比较结构和对以东的单数直接称呼，并以庄重自然的现代汉语表达其所作所为。
- source_word: יֵעָשֶׂה לָּךְ
  choice: 也必照样施行在你身上
  rationale: 保留尼法勒未完成式的被动含义，不擅自补出施行者，同时与前半句形成对应。
- source_word: גְּמֻלְךָ
  choice: 你的报偿
  rationale: 该词指一个人因其行为而得到的回报；“报偿”能涵盖回报和报应，在本处语境中自然带有审判意味。
- source_word: יָשׁוּב
  choice: 必归到
  rationale: 表达后果返回行为者自身，较直译的“返回”更符合现代汉语搭配，同时保留回转归还之意。
- source_word: בְּרֹאשֶׁךָ
  choice: 你自己头上
  rationale: 保留希伯来语关于后果落在责任者头上的形象，并用“自己”显明其归于行为者本人。
theological_decisions:
- issue: “雅威的日子”的范围与作用
  choice: 宣告迫近的神圣审判将临到万国，同时下半节继续直接对以东说话。
  alternative: 仅指眼前临到以东的狭义审判。
  rationale: “万国”明确扩大了范围，而第二人称单数又维持对以东的直接警告；译文同时保留这两层，不缩窄其中的张力。
- issue: 报偿原则的性质
  choice: 以对应句式表达：以东怎样行，也必照样施行在它身上，其行为的报偿归回自身。
  alternative: 理解为脱离神审判语境的非人格化因果或所谓业报。
  rationale: 上下文以“雅威的日子”为框架，表明这是神审判中的报偿；正文不额外补入解释，却保留司法与神学意味。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。保留先知宣告的简洁和平行结构；以“雅威”呈现神的专名，不用称号替代。正文中的两个脚注标记均置于相关词语之后。
