  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/רָע֞וּ אֶת אֶ֤רֶץ אַשּׁוּר֙ בַּ/חֶ֔רֶב וְ/אֶת אֶ֥רֶץ נִמְרֹ֖ד בִּ/פְתָחֶ֑י/הָ וְ/הִצִּיל֙ מֵֽ/אַשּׁ֔וּר כִּֽי יָב֣וֹא בְ/אַרְצֵ֔/נוּ וְ/כִ֥י יִדְרֹ֖ךְ בִּ/גְבוּלֵֽ/נוּ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/micah/005/005.yaml
  text: They will shepherd the land of Assyria with the sword[a], and the land of Nimrod at its entrances; and he will deliver us from Assyria when he comes into our land[b], and when he treads within our border.
translation:
  language: zh_hans
  text: 他们必用刀牧养亚述之地，又在宁录之地的各入口[a]牧养那地。他必救我们脱离亚述[b]；当亚述侵入我们的国土，踏进我们的疆界时。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“在宁录之地的各城门”。希伯来语原意为“入口、开口”，并未使用通常表示“城门”的词。
    reason: lexical_alternative
  - marker: b
    text: “亚述”也可理解为人格化的入侵者，译作“亚述人”。
    reason: alternative_reading
lexical_decisions:
- source_word: וְרָעוּ
  choice: 他们必……牧养
  rationale: רעה通常指“牧养、放牧”。这里与“用刀”连用，带有以武力制伏、治理之意；保留“牧养”的意象，可延续上下文中的牧者主题，又不把含义直接限定为“统治”或“毁灭”。
- source_word: אֶרֶץ אַשּׁוּר
  choice: 亚述地
  rationale: 保留אֶרֶץ的地域含义，同时采用现代汉语中简洁自然的地名表达。
- source_word: בַּחֶרֶב
  choice: 用刀
  rationale: 介词ב在此表示手段；“刀”保留原文具体的军事意象。
- source_word: אֶרֶץ נִמְרֹד
  choice: 宁录地
  rationale: 保留原文以“宁录”指称该地域的历史性典故，不将其直接解释为巴比伦或美索不达米亚。
- source_word: בִּפְתָחֶיהָ
  choice: 在……的各入口
  rationale: פתח本义为“开口、入口”，并非通常表示城门的שׁער；“各入口”既反映复数形式，也保留其宽泛含义。
- source_word: וְהִצִּיל
  choice: 他必救我们
  rationale: נצל的使役式表示“搭救、解救”。原文没有明说受词，译文依上下文补出“我们”；单数主语“他”则予以保留。
- source_word: מֵאַשּׁוּר
  choice: 脱离亚述
  rationale: מן表示从某威胁或势力之下被救出。אַשּׁוּר可指国家或被人格化的亚述敌军，正文采用国名，另一理解列入注释。
- source_word: כִּי יָבוֹא בְאַרְצֵנוּ
  choice: 当亚述侵入我们的国土
  rationale: כִּי在此按时间关系译为“当……时”。为使汉语所指清楚，以“亚述”承接前句的敌对势力；“侵入”符合军事语境，而“国土”自然表达אַרְצֵנוּ。
- source_word: וְכִי יִדְרֹךְ בִּגְבוּלֵנוּ
  choice: 踏进我们的疆界
  rationale: דרך保留“踩踏、踏入”的具体意象；גבול在这里指边界以内的疆域，“疆界”兼顾边界和领土含义。
theological_decisions:
- issue: 本节由复数主语转为单数主语
  choice: 保留“他们必……他必……”的转换
  alternative: 统一译为复数主语，或全节统一为单数王者
  rationale: 希伯来文先用复数וְרָעוּ，随后用单数וְהִצִּיל。这个转换可能区分前文的众牧者与那位统治者；译文不加以调和，以保留原文的张力。
- issue: אַשּׁוּר在拯救语句中指国家还是人格化的入侵者
  choice: 正文译作“亚述”
  alternative: 译作“亚述人”或“那亚述人”
  rationale: 本节前半明确谈到“亚述地”，但后半又把入侵行动归给一个阳性单数主体。正文保留国家名称，注释说明人格化理解的可能性。
- issue: וְהִצִּיל之后未明说受词
  choice: 按上下文补译“我们”
  alternative: 译作“他必施行拯救”，不明说受益者
  rationale: 第一人称复数的“我们的国土、我们的疆界”清楚表明受拯救的是说话群体。补出“我们”使现代汉语完整，但末句同时采用不带受词的表达，以显出原文措辞。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“用刀牧养”刻意保留原文强烈而反常的意象；后半用分号和时间从句呈现入侵与拯救的关系。正文保留复数“他们”到单数“他”的主语转换，不予顺平。
