  text: וְ/הִכְרַתִּ֥י כְשָׁפִ֖ים מִ/יָּדֶ֑/ךָ וּֽ/מְעוֹנְנִ֖ים לֹ֥א יִֽהְיוּ לָֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/005/011.yaml
  text: And I will cut off sorceries from your hand[b][a], and you will have no soothsayers.
translation:
  language: zh_hans
  text: 我必从你手中除掉巫术[a]；你那里也不再有占卜的人[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “巫术”或译“法术”。
    reason: lexical_alternative
  - marker: b
    text: “占卜的人”或译“观兆者”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִכְרַתִּי
  choice: 我必……除掉
  rationale: 使役式在这里表示使某物断绝、消失。“除掉”自然地传达彻底清除之意，同时保留审判性的语气。
- source_word: כְשָׁפִים
  choice: 巫术
  rationale: 该复数名词泛指施行法术一类的活动。“巫术”是现代汉语中简明、庄重且不过度限定具体形式的表达。
- source_word: מִיָּדֶךָ
  choice: 从你手中
  rationale: 直译并保留希伯来文“手”的意象，表示这些巫术处在受话者的掌握、使用或支配之下。
- source_word: וּמְעוֹנְנִים
  choice: 占卜的人
  rationale: 该词指凭征兆等方式占卜的人。“占卜的人”通俗清楚，又不武断限定为占星者或某一种特定术士。
- source_word: לֹא יִהְיוּ לָךְ
  choice: 你那里也不再有
  rationale: 原文直译为“他们将不再属于你／在你那里”。此译自然表达这些人将不再存在于受话群体之中，同时没有把关系狭义化为个人所有。
theological_decisions:
- issue: 受谴责之行为的具体范围
  choice: 将相关词语译为广义的“巫术”和“占卜的人”，表明上帝要从其子民中清除这类隐秘法术及其从业者。
  alternative: 按某些语境更具体地译为“观兆者”“算命的人”或“占星者”。
  rationale: 希伯来词能够指涉观兆等占卜活动，但本节并未明确限定具体方法；采用较宽泛的表达可避免加入原文没有说明的技术分类。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“从你手中”保留原文意象；分号呈现两个并列的清除宣告。汉语代词不标示性别，因此原文两个第二人称单数后缀在语法性别上的变化无法直接显出，但所指的集体对象仍保持开放。
