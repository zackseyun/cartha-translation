  text: וְ/הָיָה֩ שְׁאֵרִ֨ית יַעֲקֹ֜ב בַּ/גּוֹיִ֗ם בְּ/קֶ֨רֶב֙ עַמִּ֣ים רַבִּ֔ים כְּ/אַרְיֵה֙ בְּ/בַהֲמ֣וֹת יַ֔עַר כִּ/כְפִ֖יר בְּ/עֶדְרֵי צֹ֑אן אֲשֶׁ֧ר אִם עָבַ֛ר וְ/רָמַ֥ס וְ/טָרַ֖ף וְ/אֵ֥ין מַצִּֽיל׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/005/007.yaml
  text: And the remnant of Jacob will be among the nations[a], in the midst of many peoples, like a lion among the beasts of the forest, like a young lion among flocks of sheep, which, if it passes through, tramples and tears[b], and there is none to rescue.
translation:
  language: zh_hans
  text: 雅各的余民必在列国中，在许多民族当中，如狮子在林间走兽中，又如少壮狮子在羊群中；它若经过，就必践踏撕裂，无人能搭救。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָיָה
  choice: 必在
  rationale: 和合式未来结果在先知话语中可用“必”自然表达；结合后面的介词结构译作“必在”，简洁保留预告语气。
- source_word: שְׁאֵרִית יַעֲקֹב
  choice: 雅各的余民
  rationale: “余民”是现代中文圣经语境中简明而确切的对应，保留先知文学中劫后存留群体的含义。
- source_word: בַּגּוֹיִם
  choice: 在列国中
  rationale: גּוֹיִם泛指各国或各民族；“列国”庄重简洁，也不引入后期“外邦人”的特定宗教对比。
- source_word: בְּקֶרֶב עַמִּים רַבִּים
  choice: 在许多民族当中
  rationale: 保留בְּקֶרֶב“在……当中”的空间意象，并以“民族”与前面的“列国”形成自然对应。
- source_word: כְּאַרְיֵה בְּבַהֲמוֹת יַעַר
  choice: 如狮子在林间走兽中
  rationale: בְּהֵמוֹת在这里泛指林中的动物；“走兽”符合狮子与其他野生动物的对比，且比“牲畜”准确。
- source_word: כִּכְפִיר
  choice: 又如少壮狮子
  rationale: כְּפִיר指年轻而有力量的狮子；“少壮狮子”比“幼狮”更能传达其强健和捕食能力。
- source_word: בְּעֶדְרֵי צֹאן
  choice: 在羊群中
  rationale: עֶדְרֵי צֹאן指成群的羊或小型牲畜；“羊群”自然明确，并保留捕食者与猎物的鲜明反差。
- source_word: אֲשֶׁר אִם עָבַר
  choice: 它若经过
  rationale: 以“若”保留אִם的条件性，不把原文开放的条件关系强化为确定时间意义的“当……时”。
- source_word: וְרָמַס וְטָרַף
  choice: 就必践踏撕裂
  rationale: “践踏”准确表达רמס，“撕裂”保留טרף在猛兽捕食语境中的暴烈形象；“必”使中文条件句完整，并表达结果而非另加神学断言。
- source_word: וְאֵין מַצִּיל
  choice: 无人能搭救
  rationale: 准确表达没有施救者或没有人能够救出的意思；“搭救”适合眼前猎物受攻击的图景，也避免过度神学化。
theological_decisions:
- issue: 余民如狮子在列国中的比喻
  choice: 直接保留其压倒性的猛兽意象，不限定为军事征服、政治支配或某一具体末世方案。
  alternative: 将此比喻明确解释为军事征服，或弱化为纯粹的影响力。
  rationale: 希伯来文本描绘余民强大、无人能救其猎物的形象，却没有在本节界定这种力量的具体实现方式；直译比喻可保留其神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“列国—许多民族”“狮子—少壮狮子”保留诗歌平行结构；不添加原文没有的具体历史或末世解释。
