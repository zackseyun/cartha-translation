  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/הָיָ֥ה זֶ֖ה שָׁל֑וֹם אַשּׁ֣וּר כִּֽי יָב֣וֹא בְ/אַרְצֵ֗/נוּ וְ/כִ֤י יִדְרֹךְ֙ בְּ/אַרְמְנֹתֵ֔י/נוּ וַ/הֲקֵמֹ֤נוּ עָלָי/ו֙ שִׁבְעָ֣ה רֹעִ֔ים וּ/שְׁמֹנָ֖ה נְסִיכֵ֥י אָדָֽם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/005/004.yaml
  text: And he will be peace[a]. When Assyria comes into our land and treads in our citadels[c][b], then we will raise up against him seven shepherds and eight princes of men.
translation:
  language: zh_hans
  text: 这位必作平安[a]。当亚述[b]进入我们的国土，践踏我们的城堡[c]时，我们就要兴起七位牧者和八位人间的首领来抵挡他。[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “这位”也可译为“他”，回指上文所说的掌权者。“必作平安”保留原文直接以“平安”描述这位掌权者的表达；也可译为“必成为平安”。
    reason: 指代与表达方式说明
  - marker: b
    text: “亚述”也可指“亚述人”或人格化的亚述入侵者。
    reason: 原文所指具有歧义
  - marker: c
    text: “城堡”原词也可指宫殿，或设防的堡垒、坚固据点。
    reason: 词义范围说明
  - marker: d
    text: “七个……八个……”是希伯来语递增数字表达，可能表示人数充足，甚至绰绰有余；正文仍保留原数目。
    reason: 文化与修辞说明
lexical_decisions:
- source_word: וְהָיָה זֶה שָׁלוֹם
  choice: 他必成为和平
  rationale: וְהָיָה在预言语境中表达将来，זֶה回指上文那位将要掌权者。“成为和平”保留名词性断言的力度，不弱化为仅仅“带来和平”。
- source_word: אַשּׁוּר
  choice: 亚述
  rationale: 该词可指亚述国，也可借代或人格化地指亚述入侵者；正文采用地名，歧义在脚注说明。
- source_word: כִּי יָבוֹא בְאַרְצֵנוּ
  choice: 当亚述进入我们的国土
  rationale: כִּי在平行入侵情景中取时间义；ב与运动动词连用，译作“进入”。“国土”自然表达遭外敌侵入的土地。
- source_word: וְכִי יִדְרֹךְ
  choice: 践踏
  rationale: דרך本义为踩踏；军事语境含侵入、蹂躏之意。“践踏”保留具体而有敌意的图像。
- source_word: בְאַרְמְנֹתֵינוּ
  choice: 我们的宫堡
  rationale: אַרְמוֹן兼有宫殿与坚固堡垒的语义。“宫堡”凝练保留王室建筑和防御据点两方面，不把含义限定为普通宫殿。
- source_word: וַהֲקֵמֹנוּ עָלָיו
  choice: 我们就要兴起……来抵挡他
  rationale: קום的使役式表示使人起来或设立；עָלָיו在军事语境中为“抵挡他”。“就要”体现事件次序。
- source_word: שִׁבְעָה רֹעִים
  choice: 七个牧者
  rationale: 保留“牧者”这一治理者的隐喻，不直接改译为君王或领袖。
- source_word: וּשְׁמֹנָה נְסִיכֵי אָדָם
  choice: 八个人间的领袖
  rationale: נְסִיכֵי指首领、统治者；אָדָם为泛指人类或世人。“人间的领袖”比生硬的“人的王子”更合现代汉语，也不额外赋予受膏等原文未明说的含义。
theological_decisions:
- issue: “他必成为和平”的主语与含义
  choice: 以“他”回指上文从伯利恒而出的掌权者，并保留“成为和平”的强断言。
  alternative: 可更形式化地译作“这一位必成为和平”；也可意译为“他必带来平安”。
  rationale: 上下文明确提供男性单数的掌权者作为回指对象；但本节本身不另加“弥赛亚”等解释性称号。“成为和平”比“带来平安”更贴近名词谓语，保留其神学张力。
- issue: “亚述”的所指
  choice: 正文译作国家“亚述”，随后以“他”体现敌军的单数人格化表达。
  alternative: 全句可译为“亚述人”或“那亚述敌人”。
  rationale: 原词既可表示国家，也可转指其入侵者。正文与脚注共同保存这一真实歧义，不把它固定为单一历史人物。
- issue: “七个……八个……”的数目表达
  choice: 正文照译具体数字，以脚注说明可能表示人数充足、绰绰有余。
  alternative: 可纯粹理解为严格的七人和八人计数。
  rationale: 保留原文数字结构，避免在正文中将习语解释直接取代经文，也不排除读者作严格计数理解。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“和平”呼应 שָׁלוֹם 的传统核心含义；“宫堡”兼顾宫殿与堡垒；“人间的领袖”避免文言化的“人中君王”和不自然的“人的王子”。脚注标记均在正文按首次相关位置出现。
