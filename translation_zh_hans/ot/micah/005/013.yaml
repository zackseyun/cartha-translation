  yaml_path: translation/ot/micah/005/013.yaml
  text: And I will uproot your Asherah poles from your midst[a], and I will destroy your cities.
translation:
  language: zh_hans
  text: 我必从你中间拔除你的亚舍拉木柱[a]，也必摧毁你的城邑。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“你的亚舍拉”或“你的神木”。这个希伯来词可指女神亚舍拉，也可指与敬拜她有关的木制祭祀物。
    reason: 保留אֲשֵׁירֶיךָ可指女神名称或相关祭祀物件的词义差异，避免以“诸像”将其不必要地限为神像。
lexical_decisions:
- source_word: וְנָתַשְׁתִּי
  choice: 我必……拔除
  rationale: נתשׁ表示把已经栽立或设立之物连根拔起、扯除；“拔除”既保留原文意象，也适合本节清除祭祀物件的语境。
- source_word: אֲשֵׁירֶיךָ
  choice: 你的亚舍拉木柱
  rationale: 该复数形式在此最可能指与女神亚舍拉崇拜有关的木制祭祀物。“亚舍拉木柱”保留其特定宗教背景，又让现代读者知道这里主要是具体物件，而非泛指偶像。
- source_word: מִקִּרְבֶּךָ
  choice: 从你中间
  rationale: 直译为“从你的中间”；中文“从你中间”自然简洁，并保留先知审判宣告中针对群体内部的意味。
- source_word: וְהִשְׁמַדְתִּי
  choice: 也必摧毁
  rationale: שׁמד的使役式表示使之灭亡或彻底毁坏。“摧毁”力度明确，适合以城邑为宾语。
- source_word: עָרֶיךָ
  choice: 你的城邑
  rationale: עִיר通常指城或城镇。“城邑”准确、庄重，也适合先知文学的语体；不因上下文主要谈祭祀物而改写这一明确的马所拉文本读法。
theological_decisions:
- issue: אֲשֵׁירֶיךָ的所指
  choice: 译为与亚舍拉崇拜相关的祭祀木柱
  alternative: 可理解为“亚舍拉诸像”或较笼统的“神木／圣柱”
  rationale: 上下文列举将被除去的偶像崇拜设施，因此具体祭祀物最符合语境；但希伯来词既与女神亚舍拉有关，也可指其崇拜物件，故用脚注保留词义范围。
- issue: “你的城邑”与上下文之间的张力
  choice: 按马所拉文本直译为“你的城邑”
  alternative: 可依据推测性校勘寻求与偶像或祭祀设施有关的读法
  rationale: 现有WLC希伯来文本清楚写作עָרֶיךָ（你的城邑）。尽管这在清除祭祀物件的上下文中显得突兀，译文不以未经说明的推测性改文消除这种张力。
translation_notes:
  register: 采用现代、庄重而易懂的先知宣告语体。“我必……也必……”呈现两个连续的第一人称审判行动；“城邑”比“城市”更符合古代语境，又不显生僻。脚注标记[a]已置于对应词组之后。
