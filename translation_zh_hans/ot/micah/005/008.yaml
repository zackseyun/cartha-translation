base_translation:
  language: en
  yaml_path: translation/ot/micah/005/008.yaml
  text: May your hand be lifted up over your adversaries[a], and may all your enemies be cut off.
translation:
  language: zh_hans
  text: 愿你的手高举在敌对你的人之上[a]；愿你所有的仇敌都被剪除。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你的手必高举在敌对你的人之上；你所有的仇敌都必被剪除。”希伯来语的未完成式也可理解为对将来的陈述。
    reason: alternative_reading
lexical_decisions:
- source_word: תָּרֹם
  choice: 高举
  rationale: רוּם的Qal未完成式，阴性单数，与“你的手”一致。“手高举在……之上”保留具体的胜利与居上意象；中文用“高举”比抽象的“被尊崇”更贴合此处语境。
- source_word: יָדְךָ
  choice: 你的手
  rationale: 直译，并保留希伯来语以“手”象征力量、权能或军事能力的形象。
- source_word: עַל
  choice: 在……之上
  rationale: 既可表达针对，也带有凌驾、制胜的空间意象；此译法与“手高举”自然搭配。
- source_word: צָרֶיךָ
  choice: 敌对你的人
  rationale: צַר指对头、敌手或使人受困者。译作“敌对你的人”可与下句的אֹיְבֶיךָ“仇敌”略作区分，避免完全抹平平行句中的词汇变化。
- source_word: וְכָל
  choice: 所有的
  rationale: 表达范围的完整性；分号已经承担连接作用，因此不必机械译出连接词וְ。
- source_word: אֹיְבֶיךָ
  choice: 你的仇敌
  rationale: אֹיֵב的常用对应词。“仇敌”庄重而自然，并与前句“敌对你的人”保持轻微差别。
- source_word: יִכָּרֵתוּ
  choice: 被剪除
  rationale: כרת的Niphal未完成式，基本义为“被砍断、被剪除”。“被剪除”保留原文的被动形式及审判、灭绝色彩，又不额外限定具体方式。
theological_decisions:
- issue: 两个未完成式在先知语境中的语气
  choice: 按愿望或祈愿语气译为“愿……；愿……”。
  alternative: 按将来陈述译为“你的手必高举……；你所有的仇敌都必被剪除”。
  rationale: 两个动词在形态上是未完成式，语境中既可能带祈愿式意味，也可能陈述将来的得胜。正文采用祈愿读法，同时以脚注保留将来陈述的可能，避免消除原文的语气歧义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“手高举在……之上”刻意保留希伯来语的具体胜利意象；“剪除”保留先知审判语言的力度。正文与脚注共同呈现祈愿和将来预告两种可能读法。
