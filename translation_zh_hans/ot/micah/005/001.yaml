  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/אַתָּ֞ה בֵּֽית לֶ֣חֶם אֶפְרָ֗תָה צָעִיר֙ לִֽ/הְיוֹת֙ בְּ/אַלְפֵ֣י יְהוּדָ֔ה מִמְּ/ךָ֙ לִ֣/י יֵצֵ֔א לִֽ/הְי֥וֹת מוֹשֵׁ֖ל בְּ/יִשְׂרָאֵ֑ל וּ/מוֹצָאֹתָ֥י/ו מִ/קֶּ֖דֶם מִ/ימֵ֥י עוֹלָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/005/001.yaml
  text: But you[a], Bethlehem Ephrathah, too small to be among the clans of Judah, from you one will come out for me to be ruler in Israel, whose goings forth are from of old[b], from the days of eternity.
translation:
  language: zh_hans
  text: 但是你，伯利恒·以法他啊，虽小得不足以列在犹大的宗族中，必有一位从你那里出来，为我作以色列的掌权者；他的来历可追溯到远古，追溯到亘古的岁月。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“小，不能列在犹大的千族中。”“千”在这里可指宗族或行政单位。
    reason: lexical_alternative
  - marker: b
    text: “来历”也可译作“出去”“发端”或“起源”；末句也可理解为“他的起源可追溯到古时，追溯到久远的年代”。希伯来文也可能更强地指向“从永恒就有”。
    reason: alternative_reading
lexical_decisions:
- source_word: בֵּית לֶחֶם אֶפְרָתָה
  choice: 伯利恒·以法他
  rationale: 保留两个地名成分，以“以法他”限定此处的伯利恒，并采用现代中文圣经读者较熟悉的音译。
- source_word: צָעִיר לִהְיוֹת בְּאַלְפֵי יְהוּדָה
  choice: 在犹大的宗族中实在太小
  rationale: “太小”体现不定式结构所表达的不足；אַלְפֵי 在此指犹大内部的宗族或行政群体，而非单纯的数目“一千”。
- source_word: מִמְּךָ לִי יֵצֵא
  choice: 必有一位为我从你那里出来
  rationale: “从你那里出来”保留 יָצָא 的具体动态含义；“为我”直接保留 לִי，不进一步解释其委任或归属关系。
- source_word: לִהְיוֹת מוֹשֵׁל בְּיִשְׂרָאֵל
  choice: 要在以色列中掌权
  rationale: 以自然中文表达 מוֹשֵׁל 的治理含义，同时用“在……中”保留介词 ב 的空间或群体内涵。
- source_word: מוֹצָאֹתָיו
  choice: 他的所出
  rationale: “所出”保留该词与“出来”之间的词根联系，也可指其发出、出处或由来；虽略带庄重书面色彩，却避免直接限定为单一的“起源”。
- source_word: מִקֶּדֶם
  choice: 源自远古
  rationale: 按时间意义理解 קֶדֶם，表达久远的过去，不采用此处不合语境的方位义“东方”。
- source_word: מִימֵי עוֹלָם
  choice: 源自亘古的岁月
  rationale: “亘古”既可表达极其久远的古代，也可承载永恒意味，从而保留 עוֹלָם 在本句中的语义张力。
theological_decisions:
- issue: 末句是在陈述这位掌权者久远的历史渊源，还是暗示其永恒先存
  choice: 译作“他的所出源自远古，源自亘古的岁月”
  alternative: “他的起源可追溯到古时，追溯到久远的年代”；或“他的所出自亘古、从永恒就有”
  rationale: 希伯来文既容许“古老渊源”的理解，也能承载更强的永恒意味。正文以“所出”和“亘古”保留两者之间的张力，不将经文预先限定为纯粹历史性起源，也不把永恒先存说得比原文更明确。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“伯利恒·以法他”保留地点的先知性特指；“掌权”比名词化的“统治者”更自然。“所出”刻意保留少量经文式书面色彩，以维持原文的词根联系与神学歧义；所有脚注标记均已置于正文。
