  text: וְ/עָשִׂ֜יתִי בְּ/אַ֧ף וּ/בְ/חֵמָ֛ה נָקָ֖ם אֶת הַ/גּוֹיִ֑ם אֲשֶׁ֖ר לֹ֥א שָׁמֵֽעוּ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/micah/005/014.yaml
  text: And I will execute vengeance in anger and wrath on the nations that have not listened[a].
translation:
  language: zh_hans
  text: 我要在怒气和烈怒中，向那些不听从的列国施行报复。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “不听从”也可理解为“没有听见”“不理会”或“不顺服”。希伯来语这个动词可指听见，也可指听后理会、听从；原文没有明说所听从的对象。
    reason: 保留שמע可指听见及听从／顺服的词义幅度，并避免把原文未明说的对象补入正文。
lexical_decisions:
- source_word: וְעָשִׂיתִי
  choice: 我要……施行
  rationale: עשה与“报复”搭配，表示实行、施行；中文以“施行报复”自然表达这一组合。句首连接词在单节呈现中不必机械译作“并且”。
- source_word: בְּאַף וּבְחֵמָה
  choice: 在怒气和烈怒中
  rationale: אַף与חֵמָה都表达愤怒，后者语气较强；译作“怒气和烈怒”既保留并列和加强关系，也符合先知性宣告的庄重语体。
- source_word: נָקָם
  choice: 报复
  rationale: נָקָם指报复、复仇或报应；“报复”直接保留其追讨和惩治意味，不弱化为一般性的“惩罚”。
- source_word: אֶת הַגּוֹיִם
  choice: 向……列国
  rationale: אֶת标示施行报复所针对的对象；中文“向列国施行报复”自然明确。“列国”比“各国”更贴合先知书语域。
- source_word: אֲשֶׁר לֹא שָׁמֵעוּ
  choice: 那些不听从我的
  rationale: שמע可指听、听从或顺服；此处“不听从”兼顾听见与回应的含义。希伯来文未明说宾语，但语境中的说话者是上帝，中文补出“我的”使关系自然清楚，并在脚注说明。
theological_decisions:
- issue: שָׁמֵעוּ在受审判列国身上的含义
  choice: 不听从我的
  alternative: 没有听见／不顺服
  rationale: “听从”保留“听”这一词义基础，也传达先知性语境中拒绝理会、顺服的意味；脚注列出可能理解，以免把语义范围收窄为单纯听觉或单纯服从。
- issue: 未明说的聆听对象
  choice: 正文补出“我的”
  alternative: 不听从的列国
  rationale: 原文关系从上帝第一人称宣告中可推知；现代中文若完全省略对象略显悬空，因此补出“我的”，并用脚注标明原文没有明说。
translation_notes:
  register: 采用现代、庄重而易懂的先知宣告语体。“怒气和烈怒”保留原文同义词叠加强调；“列国”和“施行报复”维持审判语境的力度。
