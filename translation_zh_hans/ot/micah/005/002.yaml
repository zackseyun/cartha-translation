id: MIC.5.2
reference: Micah 5:2
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: לָ/כֵ֣ן יִתְּנֵ֔/ם עַד עֵ֥ת יוֹלֵדָ֖ה יָלָ֑דָה וְ/יֶ֣תֶר אֶחָ֔י/ו יְשׁוּב֖וּ/ן עַל בְּנֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/005/002.yaml
  text: Therefore he will give them up until the time when she who is in labor has given birth[c][b][a]; then the rest of his brothers will return to the sons of Israel.
translation:
  language: zh_hans
  text: 因此，他必把他们交出去[a]，直到那临产的妇人生产的时候[b]；那时，他其余的弟兄必归回到以色列子孙那里[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“把他们交在别人手中”，或“撇弃他们”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文没有明确说明“那临产的妇人”是谁；有人将她理解为人格化的锡安或犹大、所应许之统治者的母亲，或另一位人物。
    reason: alternative_reading
  - marker: c
    text: “以色列子孙”也可译作“以色列子民”；希伯来文直译为“以色列的儿子们”。
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: 因此
  rationale: 明确承接上文所形成的推论关系，符合现代汉语表达。
- source_word: יִתְּנֵם
  choice: 他必把他们交出去
  rationale: נתן在此带有交付、任其落入他者之手的含义；“交出去”保留审判或管教的意味，又不把它强化为彻底遗弃。
- source_word: עַד עֵת
  choice: 直到……的时候
  rationale: 既体现“直到某一时刻”的时间界限，也使汉语句式自然。
- source_word: יוֹלֵדָה
  choice: 那临产的妇人
  rationale: 保留分词所指正在生产或即将生产的女性，并不擅自确定其身份。
- source_word: יָלָדָה
  choice: 生下孩子
  rationale: 表达生产事件已经发生，并作为前述时期终止的界点；“孩子”是汉语中依据生育语境自然补出的宾语，不限定孩子的身份或性别。
- source_word: וְיֶתֶר
  choice: 那时……其余的
  rationale: “其余的”自然表达剩下的人，避免使用可能带有专门神学意味的“余民”；“那时”清楚呈现事件的时间推进。
- source_word: אֶחָיו
  choice: 他的弟兄
  rationale: 保留希伯来文阳性复数亲属称谓及其可能具有的家族性关联，不扩写为同胞、族人或全体百姓。
- source_word: יְשׁוּבוּן
  choice: 必归回
  rationale: שוב可兼有返回和回转的意味；“归回”在汉语中保留这两层潜在色彩。
- source_word: עַל
  choice: 到……那里
  rationale: 在שוב与群体名称的搭配中表达返回所趋向的群体；避免按字面译成生硬的“在……之上”。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列众子
  rationale: 贴近字面的“以色列的儿子们”，同时采用较凝练庄重的汉语表达；脚注说明也可理解为“以色列子民”。
theological_decisions:
- issue: “那临产的妇人”的身份
  choice: 正文不明确其具体身份
  alternative: 可理解为人格化的锡安或犹大、所应许之统治者的母亲，或较近历史处境中的另一人物
  rationale: 希伯来文本没有明说她是谁；保留不确定性可避免把某一解释传统写入正文。
- issue: “他的弟兄”的范围
  choice: 保留为“他的弟兄”
  alternative: 可理解为那位统治者的同胞、亲族，或重新联合的以色列人
  rationale: 上下文可能将他们与所应许的统治者联系起来，但本节没有进一步界定这种关系，因此不作解释性扩写。
- issue: “归回以色列众子那里”的性质
  choice: 保留“归回”的空间与关系性双重可能
  alternative: 可明确译为重新加入以色列子民，或按属灵意义理解为回转归向他们
  rationale: שוב与介词עַל在此可指返回并与群体会合；正文不限定为纯地理行动或纯属灵回转。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“弟兄”“归回”“以色列众子”保留原文的亲属意象和经文语感；句法适度调整，以清楚表达时间关系，同时不消除人物身份及归回性质上的真实歧义。
