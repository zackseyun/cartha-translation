  text: וְ/הָיָ֤ה בַ/יּוֹם הַ/הוּא֙ נְאֻם יְהוָ֔ה וְ/הִכְרַתִּ֥י סוּסֶ֖י/ךָ מִ/קִּרְבֶּ֑/ךָ וְ/הַאֲבַדְתִּ֖י מַרְכְּבֹתֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/005/009.yaml
  text: And in that day[a], declares Yahweh, I will cut off your horses from among you, and I will destroy your chariots.
translation:
  language: zh_hans
  text: 到那日，雅威宣告：“我必从你中间[a]除掉你的马匹，也必摧毁你的战车。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“从你当中”。
    reason: מִקִּרְבְּךָ 字面可译为“从你的中间”；正文采用较自然的“从你中间”。
lexical_decisions:
- source_word: וְהָיָה בַיּוֹם הַהוּא
  choice: 到那日
  rationale: 这是先知书常见的未来时间公式。将 וְהָיָה 的事件引介作用融入“到那日”，比直译为“事情将会发生”更符合现代汉语，同时保留预告未来的语气。
- source_word: נְאֻם יְהוָה
  choice: 雅威宣告
  rationale: נְאֻם 是标明神谕的庄严发言公式；“宣告”自然且保留权威语气。神名 יְהוָה 音译为“雅威”。
- source_word: וְהִכְרַתִּי
  choice: 我必……除掉
  rationale: 使役形态在此表达彻底移除；“除掉”既体现行动的决绝，也比机械地译成“剪除”更适合马匹这一宾语。
- source_word: סוּסֶיךָ
  choice: 你的马匹
  rationale: 按复数名词及第二人称阳性单数后缀翻译；单数“你”保留对锡安或以色列这一集体对象的称呼。
- source_word: מִקִּרְבֶּךָ
  choice: 从你中间
  rationale: 贴近“从你的内部／当中”的空间表达，也能自然表示从群体内部移除。
- source_word: וְהַאֲבַדְתִּי
  choice: 也必摧毁
  rationale: אבד 的使役形态表示使之灭亡或毁坏；“摧毁”与军事器具“战车”搭配自然，并保留彻底毁坏的力度。
- source_word: מַרְכְּבֹתֶיךָ
  choice: 你的战车
  rationale: 直接表达复数名词及第二人称单数后缀；语境指军事用途的车辆。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；采用“雅威”音译以明确呈现盟约之神的专名。
- issue: 除掉马匹、摧毁战车的含义
  choice: 只陈述雅威移除军事装备的行动
  alternative: 明确解释为审判人倚靠军力，或洁净百姓对战争的依赖
  rationale: 上下文可能使这些解释成立，但本节本身只明说神将除掉马匹、摧毁战车，因此正文不额外加入动机，以保留原文的神学张力。
- issue: 第二人称单数后缀的对象
  choice: 保留单数“你”
  alternative: 译为复数“你们”以明示群体
  rationale: 原文连续使用第二人称阳性单数后缀，以集体单数称呼受话对象；保留“你”可再现这一修辞形式，而不擅自限定具体指称。
translation_notes:
  register: 采用现代、庄重而易懂的先知宣告语体；以“必”表达确定的未来行动，并用“也必”呈现两个并列动词的对应关系。引号清楚标示雅威的直接发言。
