revisions:
- from: 他必站立，倚仗耶和华的力量，凭他的上帝耶和华之名的威严牧养。他们必安然居住[a]，因为如今[b]，他必尊大，直到地极。
  to: 他必站立，倚仗耶和华的力量，以耶和华他上帝之名的威严牧养。他们必安然居住[a]，因为如今[b]，他必尊大，直到地极。
  rationale: 仅调整第二个介词短语的汉语语序，将“耶和华他上帝”明确呈现为同一位神的称谓，并使其自然限定“名”。这保留了原文“耶和华他的上帝”的神学张力，也没有改变“在／以其名的威严中牧养”的语义。脚注标记及其所指内容均保持对应。
