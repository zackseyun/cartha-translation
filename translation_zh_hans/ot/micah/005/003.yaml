source:
  edition: WLC
  text: וְ/עָמַ֗ד וְ/רָעָה֙ בְּ/עֹ֣ז יְהוָ֔ה בִּ/גְא֕וֹן שֵׁ֖ם יְהוָ֣ה אֱלֹהָ֑י/ו וְ/יָשָׁ֕בוּ כִּֽי עַתָּ֥ה יִגְדַּ֖ל עַד אַפְסֵי אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/005/003.yaml
  text: And he will stand and shepherd in the strength of Yahweh[a], in the majesty of the name of Yahweh his God. And they will dwell secure[b], for now he will be great to the ends of the earth.
translation:
  language: zh_hans
  text: 他必站立，倚仗耶和华的力量，以耶和华他上帝之名的威严牧养。他们必安然居住[a]，因为如今[b]，他必尊大，直到地极。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“他们必居住”。原文动词的基本义是“居住”或“坐下”；安稳之意由上下文体现。
    reason: lexical_alternative
  - marker: b
    text: 原文是“如今”；有些译本为使预言的时序更顺畅而译作“那时”。
    reason: alternative_reading
lexical_decisions:
- source_word: וְעָמַד
  choice: 他必站立
  rationale: עמד的基本义是“站立”。这里保留具体意象，也可传达这位统治者立定并履行职分之意，而不扩译为“兴起”。
- source_word: וְרָעָה
  choice: 牧养
  rationale: רעה可指放牧、照料羊群；在君王语境中，“牧养”同时保留牧者与治理者的意象。
- source_word: בְּעֹז יְהוָה
  choice: 倚仗耶和华的力量
  rationale: עֹז意为力量、能力；介词ב可表示凭借或依靠。“倚仗”在现代汉语中自然地表达其施行牧养所凭借的力量。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的形式音译上帝的专名，区别于“主”这一称号。
- source_word: בִּגְאוֹן שֵׁם יְהוָה אֱלֹהָיו
  choice: 凭他的上帝耶和华之名的威严
  rationale: גאון在此指威严、尊荣。“他的上帝耶和华”忠实保留אֱלֹהָיו与专名的关系，不回避原文所保留的神学张力。
- source_word: וְיָשָׁבוּ
  choice: 他们必安然居住
  rationale: ישב本义为居住、坐下或停留；上下文含有蒙保守、得安稳之意，因此正文采用自然的“安然居住”，并以脚注说明其字面范围。
- source_word: כִּי עַתָּה
  choice: 因为如今
  rationale: כִּי引出原因，עַתָּה通常意为“如今、现在”。保留原文的时间副词，不为使预言时序更顺畅而改成“那时”。
- source_word: יִגְדַּל
  choice: 他必尊大
  rationale: גדל在此表示变得重大、显为伟大或受到尊崇。“尊大”符合庄重语域，也避免把重点误解为身体或数量上的增长。
- source_word: עַד אַפְסֵי אָרֶץ
  choice: 直到地极
  rationale: 这是指大地最远之处的惯用表达；“直到地极”准确、简洁，并为现代中文读者所熟悉。
theological_decisions:
- issue: 单数动词所指的人物
  choice: 仅译为“他”，由上文确定其为那位将来的统治者
  alternative: 在本节明译为“弥赛亚”或“君王”
  rationale: 本节原文本身只有第三人称单数动词，没有出现“弥赛亚”或“君王”等称号。保留“他”既与上文相连，也不把传统解释直接写入正文。
- issue: אֱלֹהָיו与这位统治者的关系
  choice: 保留“他的上帝”
  alternative: 改写或省略这一表达，以消除基督论上的张力
  rationale: 原文明说“耶和华他的上帝”。译文照实保留，不借翻译预先解决这一表达可能引发的神学问题。
- issue: עַתָּה的预言时序
  choice: 译为“如今”
  alternative: 译为“那时”以配合将来时语境
  rationale: 希伯来文明确使用通常表示“现在、如今”的副词。译文保存先知话语中的临近感，不以顺畅为由改动时序。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“站立”“牧养”“地极”保留先知文学的具体意象；句法略作汉语化处理，以“倚仗”“凭”清楚表达两个介词短语与“牧养”的关系。所有脚注标记均置于相关正文之后。
