base_translation:
  language: en
  yaml_path: translation/ot/micah/005/012.yaml
  text: And I will cut off your carved images and your pillars from your midst[b][a], and you will no longer bow down to the work of your hands.
translation:
  language: zh_hans
  text: 我必从你中间除掉你雕刻的神像和石柱[a]；你必不再向自己手所造的东西下拜[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “石柱”也可译为“祭祀石柱”或“立石”；原文指在敬拜语境中竖立的石柱。
    reason: lexical_alternative
  - marker: b
    text: “下拜”也可按其宗教含义译作“敬拜”；原文直接描写俯伏下拜的动作。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִכְרַתִּי
  choice: 我要……除掉
  rationale: הכרית在此表示使某物从群体中消失、清除；现代汉语用“除掉”既自然，也保留彻底移除的力度。
- source_word: פְסִילֶיךָ
  choice: 你雕刻的神像
  rationale: פֶּסֶל指雕刻而成、作为敬拜对象的像；“雕刻的神像”同时表达制作方式和宗教性质，比泛称“偶像”更具体。
- source_word: וּמַצֵּבוֹתֶיךָ
  choice: 你的神柱
  rationale: מַצֵּבָה是立起用于宗教活动的石柱或立石；“神柱”简洁体现祭祀用途，脚注补充其他可行译法。
- source_word: מִקִּרְבֶּךָ
  choice: 从你中间
  rationale: 直译该短语，保留从共同体或其境内清除这些物件的空间意象；第二人称单数的具体指向仍由上下文决定。
- source_word: וְלֹא תִשְׁתַּחֲוֶה עוֹד
  choice: 你必不再……下拜
  rationale: 该动词表示俯伏、下拜，常具有敬拜含义；“下拜”保留身体动作及其宗教意味。
- source_word: לְמַעֲשֵׂה יָדֶיךָ
  choice: 向自己手所造的
  rationale: 保留“手所造”的希伯来表达及其反偶像崇拜的讽刺力量；汉语中省略重复的名词，仍可自然指向人造敬拜物。
theological_decisions:
- issue: 如何处理两类宗教物件
  choice: 分别译作“雕刻的神像”和“神柱”
  alternative: 合并或泛译为“偶像”；或译作“雕像和圣石”
  rationale: 原文使用两个不同名词，分别指雕刻像和竖立的祭祀石柱。保留区分可避免把经文具体列举的对象笼统化。
- issue: 末句的敬拜动作
  choice: 译作“下拜”
  alternative: 译作“敬拜”
  rationale: 原文直接描写俯伏下拜这一身体动作，同时在语境中具有敬拜含义；译作“下拜”可保留两层意义，不将其抽象化。
- issue: 预言语气
  choice: 译作“你必不再”
  alternative: 译作“使你不再”或“你将不再”
  rationale: 原文以否定未完成式承接上帝清除这些物件的行动，可表达预告的结果；“必不再”保持确定语气，但不额外说明这是命令、能力丧失还是内在悔改。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“雕刻的神像”与“神柱”保留原文对不同祭祀物件的区分；“自己手所造的”保留希伯来语惯用表达的反讽力度。所有脚注标记均置于相关词句之后。
