  text: וְ/הָיָ֣ה שְׁאֵרִ֣ית יַעֲקֹ֗ב בְּ/קֶ֨רֶב֙ עַמִּ֣ים רַבִּ֔ים כְּ/טַל֙ מֵ/אֵ֣ת יְהוָ֔ה כִּ/רְבִיבִ֖ים עֲלֵי עֵ֑שֶׂב אֲשֶׁ֤ר לֹֽא יְקַוֶּה֙ לְ/אִ֔ישׁ וְ/לֹ֥א יְיַחֵ֖ל לִ/בְנֵ֥י אָדָֽם׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/005/006.yaml
  text: And the remnant of Jacob will be among many peoples like dew from Yahweh[a], like showers upon the grass[b], which do not wait for a man or delay for the sons of man.
translation:
  language: zh_hans
  text: 雅各的余民必在许多民族中，如同从雅威而来的露水，又像降在草上的阵雨；不等候人，也不指望世人。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “不等候……不指望……”也可译作“不仰望人，也不等待世人”。两个希伯来语动词都可含有等候或盼望的意思；这里着重说明露水和雨水的来临不靠人的作为。
    reason: lexical_alternative
  - marker: b
    text: “世人”原文直译为“人的子孙”，是指人类。原文的关系从句通常承接露水和阵雨的意象，但也可能较宽泛地与雅各的余民相连。
    reason: textual_ambiguity
lexical_decisions:
- source_word: וְהָיָה
  choice: 必在
  rationale: 先知话语中的连接词加完成式在此引出将来的情形；“必在”以自然现代汉语表达其预告语气。
- source_word: שְׁאֵרִית יַעֲקֹב
  choice: 雅各的余民
  rationale: 保留先知文学中“余民”的重要意象，也照原文保留“雅各”这一名称，不泛化为“以色列”。
- source_word: בְּקֶרֶב עַמִּים רַבִּים
  choice: 在许多民族中
  rationale: בקרב意为“在……中间”；עמים在这里指众多族群，“民族”比现代政治意义较强的“国家”更贴切。
- source_word: כְּטַל מֵאֵת יְהוָה
  choice: 如同从雅威而来的露水
  rationale: מֵאֵת表明露水的来源；以“雅威”音译יהוה，保留原文直接使用的神名。
- source_word: כִּרְבִיבִים עֲלֵי עֵשֶׂב
  choice: 又像降在草上的甘霖
  rationale: רְבִיבִים指充沛的雨或阵雨；“甘霖”自然、庄重，并保留滋润草地的正面图景。
- source_word: לֹא יְקַוֶּה לְאִישׁ
  choice: 不等候人
  rationale: קוה可表示“等候”或“指望”；在露水和雨水的意象中，“等候”清楚表达其来临无须等待人的行动。
- source_word: וְלֹא יְיַחֵל לִבְנֵי אָדָם
  choice: 也不指望世人
  rationale: יחל兼有“等候、盼望、指望”等义；“指望”保留与前一动词重叠而不完全相同的语义。“世人”自然表达“人的子孙”，即人类。
theological_decisions:
- issue: 关系从句“不等候人……”所指为何
  choice: 正文以“这些”承接露水和甘霖，强调它们来自神，并不依赖人的作为
  alternative: 也可把这句话较宽泛地理解为描述雅各的余民不倚赖人的支持
  rationale: 露水和甘霖是最近的先行意象，而且“不等候人”很自然地说明降露下雨不由人促成；同时以脚注保留原文句法可能产生的另一种关联，不把神学张力悄然消除。
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；“雅威”较直接地以现代汉语音译其通常重构的读音，并保留其作为专名的性质。
- issue: 两个近义动词קוה与יחל的关系
  choice: 译作“不等候……也不指望……”
  alternative: 两者都可译作“等候”，也都可能带有“盼望、倚赖”的意味
  rationale: 用两个相关但不同的汉语动词保存希伯来文的平行和语义重叠，避免把它们武断地压成完全相同或完全不同的概念。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“余民”保留先知文学的核心术语；“甘霖”维持诗歌意象而不过度古雅。句尾双脚注分别说明动词的词义范围和关系从句的潜在歧义。
