  naturalness: 修订后的句子在现代书面普通话中自然、庄重。“不等候人，也不指望世人”保留平行结构，且不必以“这些”作不够必要的指代。
  terminology: “雅各的余民”“雅威”“民族”均恰当。“阵雨”比“甘霖”更准确对应רְבִיבִים；“世人”可自然表达“人的子孙”。
