base_translation:
  language: en
  yaml_path: translation/ot/micah/005/010.yaml
  text: And I will cut off the cities of your land, and I will tear down all your strongholds.
translation:
  language: zh_hans
  text: 我要除掉你境内的城邑，拆毁你所有的堡垒。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִכְרַתִּי
  choice: 我要除掉
  rationale: הכרית在此表示使某物不复存在，即除去、消灭；“除掉”既保留彻底移除的力度，也比直译“剪除”更符合现代汉语表达。
- source_word: עָרֵי אַרְצֶךָ
  choice: 你境内的城邑
  rationale: עָרֵי是“城”的复数构造式，אַרְצֶךָ意为“你的地”；“你境内的城邑”自然表达这些城位于对方的土地之中，并保留领土含义。
- source_word: וְהָרַסְתִּי
  choice: 拆毁
  rationale: הרס具体指推倒、拆毁建筑或防御设施；“拆毁”保留其具象动作和审判力度。
- source_word: כָּל מִבְצָרֶיךָ
  choice: 你所有的堡垒
  rationale: מִבְצָר指设防之地、堡垒；“堡垒”简明地体现军事防御性质，כָּל译为“所有的”。
theological_decisions:
- issue: 毁城与拆毁堡垒的行动者及意义
  choice: 保留第一人称神谕“我要”，不在正文中解释其目的
  alternative: 增译为神要清除百姓所倚靠的军事力量
  rationale: 原文明确行动者以第一人称说话，但本节本身没有明说行动的神学目的；不把上下文推断写入正文，可保留经文的简洁与张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“城邑”略带经文语体但普通读者易懂；两个并列动词“除掉／拆毁”分别体现כרת与הרס的语义差异。
