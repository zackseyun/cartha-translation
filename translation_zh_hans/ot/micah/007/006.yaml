source:
  edition: WLC
  text: כִּֽי בֵן֙ מְנַבֵּ֣ל אָ֔ב בַּ֚ת קָמָ֣ה בְ/אִמָּ֔/הּ כַּלָּ֖ה בַּ/חֲמֹתָ֑/הּ אֹיְבֵ֥י אִ֖ישׁ אַנְשֵׁ֥י בֵיתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/007/006.yaml
  text: For a son treats his father with contempt[a]; a daughter rises up against her mother; a daughter-in-law against her mother-in-law[b]; a man's enemies are the men of his own house.
translation:
  language: zh_hans
  text: 因为儿子藐视父亲[a]，女儿起来反对母亲，儿媳起来反对婆婆；一个人的仇敌，就是他自己家里的人[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“羞辱父亲。”这个希伯来语动词可表示以轻蔑或使人蒙羞的方式对待某人。
    reason: lexical_alternative
  - marker: b
    text: 直译：“他家中的男人们。”这个希伯来语短语也可按习语泛指家中的成员。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文并说明前述哀叹的缘由；现代汉语用“因为”能自然表达这里的解释关系。
- source_word: בֵן מְנַבֵּל אָב
  choice: 儿子藐视父亲
  rationale: מְנַבֵּל 是 נבל 的 Piel 分词，表示以轻蔑、羞辱的态度对待人；“藐视”简洁而有力度，也保留持续或典型行为的意味。
- source_word: בַּת קָמָה בְאִמָּהּ
  choice: 女儿起来反对母亲
  rationale: קום 配合介词 ב 在此表示敌对地起来；“起来反对”保留原文的动作形象，又不强化成更具体的“背叛”或“造反”。
- source_word: כַּלָּה בַּחֲמֹתָהּ
  choice: 儿媳起来反对婆婆
  rationale: כַּלָּה 在家庭关系语境中指儿媳，חֲמוֹת 指婆婆；承接上一分句补出“起来反对”，使汉语句意完整。
- source_word: אֹיְבֵי אִישׁ
  choice: 一个人的仇敌
  rationale: אִישׁ 在此为泛指单数；“一个人”在现代汉语中自然保留其代表性，不必限定为某一特定男子。
- source_word: אַנְשֵׁי בֵיתוֹ
  choice: 他自己家里的人
  rationale: 字面为“他家中的人/男人们”，但 אַנְשֵׁי בֵיתוֹ 是可指家庭成员的习语；译作“家里的人”准确传达家庭内部的范围，“自己”突出反常与背叛感。
theological_decisions:
- issue: 家庭成员用语中的性别与范围
  choice: 将 אִישׁ 译为“一个人”，将 אַנְשֵׁי בֵיתוֹ 译为“他自己家里的人”
  alternative: “一个男人的仇敌，就是他自己家中的男人”
  rationale: 原文虽使用阳性形式，但 אִישׁ 可作泛指，而 אַנְשֵׁי בֵיתוֹ 是表示家中成员的常见组合。按字面重复“男人”会使现代汉语误以为只包括男性，反而缩窄原文在家庭崩解语境中的通常所指。脚注保留其字面形式。
- issue: 家庭冲突的强度
  choice: 译作“起来反对”
  alternative: “背叛”或“造反”
  rationale: 原文描写敌对而起，但未明确规定政治性反叛或彻底背叛；较直译的表达保留其张力与开放性。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“藐视”保留原文的严重程度；三个家庭关系分句保持紧凑的平行结构。末句用“就是”形成断言力度，并以“他自己家里的人”呈现亲近关系反成敌对关系的冲击。
