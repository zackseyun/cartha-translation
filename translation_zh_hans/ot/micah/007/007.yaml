  text: וַ/אֲנִי֙ בַּ/יהוָ֣ה אֲצַפֶּ֔ה אוֹחִ֖ילָה לֵ/אלֹהֵ֣י יִשְׁעִ֑/י יִשְׁמָעֵ֖/נִי אֱלֹהָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/007/007.yaml
  text: But as for me[a], I will watch for Yahweh; I will wait for the God of my salvation. My God will hear me.
translation:
  language: zh_hans
  text: 至于我，我要仰望耶和华；我要等候[a]赐我救恩的上帝。我的上帝必听我。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我要盼望赐我救恩的上帝。”这里的希伯来语动词也可表示怀着盼望等候。
    reason: 保留אוֹחִילָה兼有“等候”和“盼望”的词义幅度。
lexical_decisions:
- source_word: וַאֲנִי
  choice: 至于我，我却
  rationale: 独立代词带出强调，与上文社会败坏、人与人不可信的处境形成鲜明对比；这一译法在现代汉语中自然地保留了这种转折和强调。
- source_word: בַּיהוָה אֲצַפֶּה
  choice: 向耶和华守望
  rationale: צפה描写警醒观望、期待某位对象；“守望”保留其生动意象，“向耶和华”则自然表达期待所指向的对象。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文读者熟悉的专名“耶和华”音译四字神名，保留它作为以色列之上帝专有名字的性质，而不以称号代替。
- source_word: אוֹחִילָה
  choice: 我要等候
  rationale: יחל兼有等候和盼望的语义；正文采用“等候”，与前句“守望”构成自然递进，并以脚注保留盼望的含义。
- source_word: לֵאלֹהֵי יִשְׁעִי
  choice: 赐我救恩的上帝
  rationale: 希伯来语直译为“我救恩的上帝”；现代汉语用“赐我救恩的上帝”更自然，同时保留救恩源于上帝的核心关系，避免较生硬的“我救恩的上帝”。
- source_word: יִשְׁמָעֵנִי
  choice: 必听我
  rationale: שמע的基本义是听、聆听；“必听我”直接保留原文措辞及其在祷告语境中可能蕴含的回应意味，而不明确改译为“必应允我”。
- source_word: אֱלֹהָי
  choice: 我的上帝
  rationale: 保留第一人称所属关系和个人信靠的宣告；按自然汉语语序置于末句句首。
theological_decisions:
- issue: 四字神名יהוה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用以色列之上帝的专名。中文正文采用读者最熟悉且具有专名功能的“耶和华”，不以“主”等称号取代。
- issue: אוֹחִילָה中“等候”与“盼望”的双重意味
  choice: 正文译“等候”，脚注说明盼望意味
  alternative: 正文译“盼望”
  rationale: 该动词可表示带着盼望等候。前句已经用“守望”表达期待，正文用“等候”较好地保留平行诗句而不造成重复；脚注则避免丢失“盼望”的真实语义。
- issue: יִשְׁמָעֵנִי是否译成“应允我”
  choice: 必听我
  alternative: 必应允我
  rationale: 祷告语境中的“听”可能暗含有利回应，但原文没有直接使用“回答”或“应允”的动词，因此保留较宽的“听”，不替原文消除这一含蓄空间。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“守望”保留先知诗歌的观望意象；全句维持三分句的诗性推进：与世人形成对比、等候施救的上帝、确信上帝必听。
