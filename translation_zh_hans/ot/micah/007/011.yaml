  yaml_path: translation/ot/micah/007/011.yaml
  text: A day for building your walls—on that day the boundary will be far removed[a].
translation:
  language: zh_hans
  text: 有一日，要建造你的城墙；到那日，界限必远远移开。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“法令必远离。”希伯来语“חֹק”可指“界限、边界”，也可指“法令、定例”。
    reason: lexical_alternative
lexical_decisions:
- source_word: י֖וֹם
  choice: 日子必将来到
  rationale: 原文以“日子”作省略式的先知性宣告。汉语若只译“一个日子”不够自然，补出“必将来到”可传达其未来指向，同时不改变核心意义。
- source_word: לִ/בְנ֣וֹת
  choice: 建造
  rationale: ל 加 בנה 的不定式结构表示“建造……的时候／为建造”。不译作“重建”，因为“重新”的含义虽符合语境，却不在该动词本身明说。
- source_word: גְּדֵרָ֑יִ/ךְ
  choice: 你的城墙
  rationale: גדר 可指围墙、墙垣或屏障；在复兴的城邑语境中，“城墙”自然且具体，又不采用含义更窄的“防御工事”。
- source_word: י֥וֹם הַ/ה֖וּא
  choice: 到那日
  rationale: 这是先知文体中常见的时间表达；“到那日”既承接前半句，也保持庄重自然。
- source_word: יִרְחַק
  choice: 远远扩展
  rationale: רחק 的基本意义是变远、远离。与“疆界”连用时，汉语以“远远扩展”自然表达界线向远处推移的结果，但不明说施动者。
- source_word: חֹֽק
  choice: 疆界
  rationale: חֹק 可指界限、规定，也可指法令。紧接“建造城墙”的空间意象，“疆界”较合语境；“法令”这一真实可能性保留在脚注中。
theological_decisions:
- issue: 末句 חֹק 的含义
  choice: 理解为空间上的疆界或界限
  alternative: 法令／定例
  rationale: 本节前半句谈建造城墙，空间性的“疆界”与复兴、拓展的图景衔接较自然；但 חֹק 确实也常有“法令、定例”之义，因此不将另一读法排除，而以脚注保留经文的词义张力。
translation_notes:
  register: 采用现代、庄重而易懂的先知文体。“必将来到”使希伯来语省略句在汉语中完整自然；分号保留原文两次“日子”的递进关系。主文采用空间性读法，并以脚注明确保存“法令”的词义可能。
