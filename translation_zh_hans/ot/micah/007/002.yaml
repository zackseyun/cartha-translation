  to: 忠信的人已经从这地绝迹[a]，人中再没有正直的人。人人都埋伏着，要流人血；各人用网罗[c]猎取自己的弟兄[b]。
  rationale: 本次仅作保守的措辞修订：以“要流人血”替代“要杀人流血”，避免将原文的“血／流血”进一步明确化为未直接出现的“杀人”；并微调首句语序及末句动词搭配，使汉语更自然。脚注锚点及其内容均予保留。
