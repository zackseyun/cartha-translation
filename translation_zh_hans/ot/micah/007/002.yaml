id: MIC.7.2
reference: Micah 7:2
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: אָבַ֤ד חָסִיד֙ מִן הָ/אָ֔רֶץ וְ/יָשָׁ֥ר בָּ/אָדָ֖ם אָ֑יִן כֻּלָּ/ם֙ לְ/דָמִ֣ים יֶאֱרֹ֔בוּ אִ֥ישׁ אֶת אָחִ֖י/הוּ יָצ֥וּדוּ חֵֽרֶם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/007/002.yaml
  text: The faithful has perished from the land[a], and there is no upright one among mankind. All of them lie in wait for blood[c][b]; each hunts his brother with a net.
translation:
  language: zh_hans
  text: 忠信的人已经从这地绝迹[a]，人中再没有正直的人。人人都埋伏着，要流人血；各人用网罗[c]猎取自己的弟兄[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “这地”或译“全地”或“大地”。
    reason: 希伯来语 הָאָרֶץ 可指特定的土地、国土，也可泛指全地或大地。
  - marker: b
    text: 原文直译“他的弟兄”；这里也可泛指同胞或群体中的同伴，并不一定是亲生兄弟。
    reason: 保留亲属称谓所强调的内部背叛，同时说明其语义范围可能较广。
  - marker: c
    text: “网罗”或译“陷阱”。
    reason: חֵרֶם 指捕捉猎物的网，语境中也可按其设伏捕捉的功能理解为陷阱。
lexical_decisions:
- source_word: אָבַד
  choice: 已……绝迹
  rationale: 该词为 Qal 完成式，表达已经发生的消失或毁灭；“绝迹”保留哀歌式的强烈语气，也符合现代汉语表达。
- source_word: חָסִיד
  choice: 忠信的人
  rationale: 指以忠诚、信实和敬虔为特征的人；“忠信”兼顾盟约忠诚与伦理品格，又避免过度限定为某一宗派用语。原文单数在这里具有代表性。
- source_word: מִן הָאָרֶץ
  choice: 从这地
  rationale: 结合先知对以色列社会的批判，主要理解为当地或国土；“这地”简洁自然，同时以脚注保留“全地／大地”的较广义理解。
- source_word: וְיָשָׁר
  choice: 正直的人
  rationale: 形容词名词化，指品行端正者；汉语补出“的人”自然清楚，并不额外限定性别。
- source_word: בָּאָדָם
  choice: 人中
  rationale: אָדָם 在此泛指人类或人群，并非专指男性；“人中”简洁保留其集合性和普遍范围。
- source_word: אָיִן
  choice: 再没有
  rationale: 表达存在性的否定；结合前句“绝迹”，“再没有”在汉语中衔接自然。
- source_word: כֻּלָּם
  choice: 人人都
  rationale: 明确表达原文的全体性，并自然引出复数行动。
- source_word: לְדָמִים יֶאֱרֹבוּ
  choice: 埋伏着要杀人流血
  rationale: 保留“埋伏”与“血”的暴力意象；“杀人流血”在现代汉语中清楚传达蓄意谋害的含义。
- source_word: אִישׁ
  choice: 各人都
  rationale: 在此具有逐一分配的作用；“各人都”既承接前面的全体，也突出个人责任。
- source_word: אָחִיהוּ
  choice: 自己的弟兄
  rationale: 直译亲属称谓，以保留群体内部彼此残害所造成的震撼；脚注说明其范围也可扩展到同胞或同伴。
- source_word: יָצ֥וּדוּ חֵרֶם
  choice: 用网罗捕猎
  rationale: 动词含猎捕、设法捕获之意，חֵרֶם 指捕猎用的网；“用网罗捕猎”保留原文的捕猎隐喻。
theological_decisions:
- issue: אָדָם 的泛指范围
  choice: 人中
  alternative: 人类中／世人中
  rationale: 原文虽使用语法上的阳性形式，却泛指人群或人类，并非仅指男性；“人中”准确而不作不必要的性别限定。
- issue: חָסִיד 的宗教伦理含义
  choice: 忠信的人
  alternative: 敬虔的人／忠诚的人
  rationale: 该词可兼有对上帝忠诚和群体伦理忠实的含义；“忠信”保留这种复合意味，不将其缩减为内在虔敬或一般可靠。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。前半句以“绝迹／再没有”保持哀叹的力度，后半句保留“埋伏、流血、捕猎、网罗”等连续的暴力与狩猎意象。标点用分号呈现由普遍败坏转向彼此残害的推进。
