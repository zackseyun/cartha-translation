base_translation:
  language: en
  yaml_path: translation/ot/micah/007/015.yaml
  text: As in the days when you came out from the land of Egypt[a], I will show him wondrous things.
translation:
  language: zh_hans
  text: 如同你从埃及地出来的那些日子，我必使他[a]看见奇事。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我必使他们看见奇事。”希伯来文的宾语后缀为单数“他”，但可能以集合性单数指以色列民。
    reason: 说明第三人称单数后缀可能具有集合性所指，并提供复数译法。
lexical_decisions:
- source_word: כִּימֵי
  choice: 如同……的日子
  rationale: 介词כְּ与“日子”构成比较，回指以色列出埃及时期；此译保留比较结构，也符合现代汉语的庄重表达。
- source_word: צֵאתְךָ
  choice: 你……出来
  rationale: 这是带第二人称阳性单数后缀的不定式构造，直译为“你的出来”；用时间性表达“你……出来”在汉语中更自然，同时保留单数称呼。
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: 从埃及地
  rationale: 保留原文中的“地”，延续出埃及叙事的郑重措辞，而不简化为“从埃及”。
- source_word: אַרְאֶנּוּ
  choice: 我要使他看见
  rationale: ראה的使役式表达“使……看见”；宾语后缀在语法上是第三人称阳性单数，因此正文保留“他”，不擅自改成复数。
- source_word: נִפְלָאוֹת
  choice: 奇事
  rationale: 该词指令人惊叹的非凡作为；“奇事”范围较宽，不把含义限定为某一种形式的神迹，并能呼应出埃及传统。
theological_decisions:
- issue: אַרְאֶנּוּ中第三人称阳性单数后缀的所指
  choice: 正文译作“他”，保留希伯来文的语法单数，可按上下文理解为以色列这一集合性个体。
  alternative: 译作“他们”，明确指以色列众民。
  rationale: 原文先以第二人称单数“你”称呼，随后使用第三人称单数宾语后缀。正文保留这种人称张力，不以复数解释取代原文形式；脚注说明可能的集合性所指。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“使他看见奇事”较贴近原文使役结构，并刻意保留第二人称“你”转为第三人称“他”的变化。
