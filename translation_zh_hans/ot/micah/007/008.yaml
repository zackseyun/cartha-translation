source:
  edition: WLC
  text: אַֽל תִּשְׂמְחִ֤י אֹיַ֨בְתִּ/י֙ לִ֔/י כִּ֥י נָפַ֖לְתִּי קָ֑מְתִּי כִּֽי אֵשֵׁ֣ב בַּ/חֹ֔שֶׁךְ יְהוָ֖ה א֥וֹר לִֽ/י־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/micah/007/008.yaml
  text: Do not rejoice over me[a], my enemy; though I have fallen, I will rise. Though I sit in darkness[b], Yahweh will be a light to me.
translation:
  language: zh_hans
  text: 我的仇敌啊，不要因我欢喜[a]！我虽跌倒，却必起来；我虽坐在黑暗中，耶和华必作我的光[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“不要因我幸灾乐祸”。原文动词本义是“欢喜、快乐”；“幸灾乐祸”更突出敌意语境，但解释性也更强。
    reason: lexical_alternative
  - marker: b
    text: “跌倒”和“起来”在原文中都是完成式，直译可作“我跌倒了，我起来了”。这里的诗歌语境表达对逆转的确信，因此正文译作“我虽跌倒，却必起来”。
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: תִּשְׂמְחִי ... לִי
  choice: 因我欢喜
  rationale: 动词本义是“欢喜、快乐”，介词短语指出欢喜所针对的对象。译作“因我欢喜”既保留基本词义，也让敌意得胜的语境自然显明，避免直接采用解释性更强的“幸灾乐祸”。
- source_word: אֹיַבְתִּי
  choice: 我的仇敌
  rationale: 原文为阴性单数并带第一人称单数后缀，是对敌人的直接呼语；现代汉语用“我的仇敌啊”庄重而清楚，不必在译文中标明语法性别。
- source_word: כִּי נָפַלְתִּי קָמְתִּי
  choice: 我虽跌倒，却必起来
  rationale: 两个动词形态均为完成式，但诗歌语境表达从跌倒到复起的确信。“虽……却……”传达上下文中的让步关系，“必起来”表达笃定的逆转，同时以脚注保留形态上的直译可能。
- source_word: אֵשֵׁב בַּחֹשֶׁךְ
  choice: 我虽坐在黑暗中
  rationale: 保留 ישׁב 的具体意象“坐”，并保留“黑暗”的诗性隐喻；结合上下文，以“虽”自然呈现与下句光明之间的让步和转折。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 原文直接使用以色列上帝的专名四字神名。简体中文圣经语体中“耶和华”是最通行、最易识别的专名形式，避免以称号“主”替代原文专名。
- source_word: אוֹר לִי
  choice: 作我的光
  rationale: 原文是名词性断句，直指耶和华对于说话者就是光。汉语“作我的光”凝练自然，并保留拯救、引导与盼望的开放性隐喻。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 译文保留神的专名而不以“主”替换。“耶和华”在现代中文读者中辨识度最高；“雅威”较接近学界常用的拟音，但中文传统接受度较低。
- issue: “起来”所指的复兴是否具体限定
  choice: 保留为“必起来”
  alternative: 必重新得势／必得拯救
  rationale: 原文只用“起来”与“跌倒”形成对照，并未明确限定为政治复兴、道德更新或个人获救；译文不将这一开放意象收窄为某种特定教义解释。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语体。以“仇敌啊”保留直接呼语，以分号呈现两组平行对比；“跌倒／起来”和“黑暗／光”的核心意象均按原文保留。脚注标记[a]置于相关短语后，[b]置于整节末，且均在正文出现。
