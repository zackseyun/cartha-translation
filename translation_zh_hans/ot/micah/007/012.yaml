  text: י֥וֹם הוּא֙ וְ/עָדֶ֣י/ךָ יָב֔וֹא לְ/מִנִּ֥י אַשּׁ֖וּר וְ/עָרֵ֣י מָצ֑וֹר וּ/לְ/מִנִּ֤י מָצוֹר֙ וְ/עַד נָהָ֔ר וְ/יָ֥ם מִ/יָּ֖ם וְ/הַ֥ר הָ/הָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/007/012.yaml
  text: That day—they will come to you from Assyria and the cities of Egypt[a], and from Egypt to the River, from sea to sea[b], and from mountain to mountain.
translation:
  language: zh_hans
  text: 那一天，人们必从亚述和埃及的城邑[a]来到你这里；从埃及直到大河[b]，又从这海到那海，从这山到那山。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “埃及”所对应的希伯来词 מָצוֹר 也可理解为“堡垒”“围困之地”或“坚城（群）”，而不作埃及的名称。
    reason: lexical_alternative
  - marker: b
    text: “大河”很可能指幼发拉底河。
    reason: cross_reference
lexical_decisions:
- source_word: י֥וֹם הוּא֙
  choice: 到那日
  rationale: 这是先知话语中自然的时间表达，既保留“那日”的指向性，也符合现代汉语习惯。
- source_word: וְעָדֶיךָ יָבוֹא
  choice: 人们必……来到你这里
  rationale: 动词在形态上是单数，但下文列举多个来处，语境适合按集合意义表达为“人们”；“你”保留原文第二人称单数所指的城或群体人格。
- source_word: לְמִנִּי אַשּׁוּר
  choice: 从亚述
  rationale: 介词短语表示来处；“亚述”是该地名的现代汉语标准译名。
- source_word: וְעָרֵי מָצוֹר
  choice: 和埃及的城邑
  rationale: 地理并列结构支持把 מָצוֹר 视为埃及的称谓；“城邑”庄重而易懂。原词也可作“堡垒、被围困之地或坚城”，故以脚注保留歧义。
- source_word: וּלְמִנִּי מָצוֹר
  choice: 从埃及
  rationale: 与亚述、大河等地理名称平行，宜理解为埃及；同时在脚注保留普通名词的可能含义。
- source_word: וְעַד נָהָר
  choice: 直到大河
  rationale: 圣经地缘语境中单独使用“河”通常指幼发拉底河；正文以“大河”保留简洁的专称用法，脚注说明其可能所指。
- source_word: וְיָם מִיָּם
  choice: 从这海到那海
  rationale: 用自然汉语表达两端延展的范围，并保留原文的广阔性。
- source_word: וְהַר הָהָר
  choice: 从这山到那山
  rationale: 与“从这海到那海”形成平行，表达范围遍及各山之间。
theological_decisions:
- issue: 多处地域来者与单数动词 יָבֹוא 的关系
  choice: 按集合意义译作“人们必……来到你这里”
  alternative: 按形态直译为“他必来到你这里”，或译作“有人必来到你这里”
  rationale: 原文动词虽为单数，但地域清单暗示来自各地的人群。集合式译法在现代汉语中较不易误解，同时不限定这些人的具体身份。
- issue: 本节 מָצוֹר 的含义
  choice: 作为地名或诗性称谓，译为“埃及”
  alternative: 译作“堡垒”“围困之地”或“坚城”
  rationale: 它与亚述、大河、海和山构成地理平行，因此“埃及”较符合上下文；但词汇歧义真实存在，故在脚注中明确保留另一种理解。
- issue: נָהָר 所指的河流
  choice: 正文译作“大河”，理解为很可能指幼发拉底河
  alternative: 泛指某一条河
  rationale: 在圣经地缘表达中，此类绝对用法常指幼发拉底河；正文不直接补出专名，以免把可能性提升为绝对确定。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“城邑”略具经文文体色彩，但仍属常用书面语。以“人们”呈现单数动词的集合意义；以“从这海到那海、从这山到那山”自然表达希伯来语的范围结构。正文中的脚注标记与脚注一一对应。
