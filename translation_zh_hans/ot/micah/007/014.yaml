  text: רְעֵ֧ה עַמְּ/ךָ֣ בְ/שִׁבְטֶ֗/ךָ צֹ֚אן נַֽחֲלָתֶ֔/ךָ שֹׁכְנִ֣י לְ/בָדָ֔ד יַ֖עַר בְּ/ת֣וֹךְ כַּרְמֶ֑ל יִרְע֥וּ בָשָׁ֛ן וְ/גִלְעָ֖ד כִּ/ימֵ֥י עוֹלָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/007/014.yaml
  text: Shepherd your people with your staff[a], the flock of your inheritance, dwelling alone in a forest in the midst of Carmel; let them graze in Bashan and Gilead as in days of old.
translation:
  language: zh_hans
  text: 求你用你的杖牧养你的子民，就是你产业的羊群；他们独自住在迦密[a]境内的林中。愿他们在巴珊和基列吃草，如古时一样。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “迦密”也可译作“肥沃之地”或“牧场”；原文这个词既可指迦密地区，也可泛指丰饶之地。
    reason: 保留 כַּרְמֶל 在专有地名与普通名词之间的词义歧义。
lexical_decisions:
- source_word: רְעֵה
  choice: 牧养
  rationale: 这是向上帝发出的命令式祈求；“牧养”保留牧人的比喻，并兼含引导、保护和喂养。
- source_word: בְשִׁבְטֶךָ
  choice: 用你的杖
  rationale: שֵׁבֶט 可指杖、棍或权杖；在牧养语境中译作“杖”最贴切，同时仍保留其权柄意味。
- source_word: צֹאן נַחֲלָתֶךָ
  choice: 你产业的羊群
  rationale: 保留原文把百姓比作羊群、又称他们为上帝产业的双重意象。
- source_word: שֹׁכְנִי לְבָדָד
  choice: 他们独自住
  rationale: 表达羊群处于独居、隔离状态；补出“他们”使现代汉语指代清楚。
- source_word: יַעַר בְּתוֹךְ כַּרְמֶל
  choice: 迦密腹地的林中
  rationale: 按地名理解 כַּרְמֶל，并用“腹地的林中”自然表达树林位于迦密之中的空间关系；其普通名词义见脚注。
- source_word: יִרְעוּ
  choice: 愿他们……吃草
  rationale: 未完成式在此承接祈求，带愿望意味；“吃草”保持羊群和牧场的具体图景。
- source_word: בָשָׁן וְגִלְעָד
  choice: 巴珊和基列
  rationale: 保留两个以丰美牧场著称的地名。
- source_word: כִּימֵי עוֹלָם
  choice: 如古时一样
  rationale: 此处 עוֹלָם 指久远的过去，并非形而上的永恒；该译法简洁自然。
theological_decisions:
- issue: שֵׁבֶט 所表现的是牧养照顾还是管教惩罚
  choice: 在牧人意象中译为“杖”
  alternative: 译为“棍”，突出权威或管教
  rationale: 上下文祈求上帝牧养百姓并让他们在丰美之地吃草，因此以牧杖为主要图景；“杖”又没有完全排除权柄的含义。
- issue: כַּרְמֶל 是专名还是普通名词
  choice: 正文作地名“迦密”
  alternative: 译为“肥沃之地”或“牧场”
  rationale: 下文紧接巴珊和基列两个地名，按地名理解能保留经文的地理诗意；普通名词义则以脚注保存，避免消除原文歧义。
translation_notes:
  register: 采用现代、庄重而易懂的祈求语体。“求你”明确命令式在语境中的祷告功能；分号连接牧养请求与羊群现状，末句以“愿”呈现希伯来语的愿望语气。脚注标记置于实际存在词义歧义的“迦密”之后。
