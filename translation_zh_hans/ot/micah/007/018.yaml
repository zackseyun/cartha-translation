base_translation:
  language: en
  yaml_path: translation/ot/micah/007/018.yaml
  text: Who is a God like you[a], bearing iniquity and passing over transgression for the remnant of his inheritance? He does not retain his anger forever[b], because he delights in steadfast love.
translation:
  language: zh_hans
  text: 有哪一位神像你，担当罪孽，越过他产业中所余之民的过犯？他不永远怀怒，因为他喜爱慈爱[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “慈爱”译自希伯来语 חֶסֶד；这个词也可译作“怜悯”“坚定的爱”或“圣约之爱”。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי אֵל כָּמוֹךָ
  choice: 有哪一位神像你
  rationale: 保留感叹性的反问和“神”作为类属谓语的表达，突出以色列之神无可比拟；中文用“一位神”自然明晰。
- source_word: נֹשֵׂא עָוֹן
  choice: 担当罪孽
  rationale: 保留 נֹשֵׂא“承担、背负”的具体意象，同时该习语在语境中表达赦免或除去罪责。
- source_word: עָוֹן
  choice: 罪孽
  rationale: 既可涵盖恶行，也保留其罪责意味，并与后面的“过犯”有所区别。
- source_word: וְעֹבֵר עַל פֶּשַׁע
  choice: 越过……的过犯
  rationale: 贴近“从……之上经过”的希伯来语意象；在此语境中意为不追究、赦免。
- source_word: לִשְׁאֵרִית נַחֲלָתוֹ
  choice: 他产业的余民
  rationale: 保留先知书中重要的“余民”概念，并以“产业”表达上帝所属子民的圣约性归属。
- source_word: לֹא הֶחֱזִיק לָעַד אַפּוֹ
  choice: 他不永远怀怒
  rationale: 自然表达“并不永远持守其怒气”；“怀怒”简洁而庄重。
- source_word: כִּי חָפֵץ חֶסֶד הוּא
  choice: 因为他喜爱慈爱
  rationale: חָפֵץ 表达喜悦、乐意；“慈爱”在中文圣经语境中可承载 חֶסֶד 的怜悯、忠贞与圣约之爱等层面。
theological_decisions:
- issue: חֶסֶד 的译法
  choice: 慈爱
  alternative: 怜悯；信实的爱；圣约之爱
  rationale: “慈爱”简洁、庄重且不把词义收窄为单次怜悯行为，也不在正文中加入原词未明说的解释性限定；脚注说明其丰富含义。
- issue: עָוֹן 与 פֶּשַׁע 的区分
  choice: 罪孽……过犯
  alternative: 罪……悖逆；罪责……背叛
  rationale: 保留原文两个不同罪恶用语的纹理，但不强行建立超出经文的系统神学区别。
- issue: נֹשֵׂא 与 עֹבֵר עַל 的意象
  choice: 担当……越过
  alternative: 赦免……不追究
  rationale: 正文保留原文两个并列的具体意象，避免把二者都平化为“赦免”；同时承认其语境功能是宽恕。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。正文保留“担当罪孽”和“越过过犯”的希伯来语意象；语序稍作汉语化处理。“他产业的余民”保留先知书和圣约归属的表达。脚注标记置于“慈爱”之后，以准确对应注释对象。
