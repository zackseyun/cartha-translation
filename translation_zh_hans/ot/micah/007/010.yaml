  to: 那时，我的仇敌必看见，羞耻必遮盖她；就是那曾对我说：“雅威——你的上帝在哪里？”的仇敌。我必亲眼看见她；如今，她必被践踏，如同街上的泥泞。
  rationale: 删除无实质原文依据的脚注a及其锚点，并删除脚注b和锚点，因为修订后的“我必亲眼看见她”已经自然、准确地表达原文“我的眼睛必看见她”，无需另设直译注。修订“看着”为“看见”，使其不含持续凝视的额外含义；重组结尾以清楚表达她将像街上的泥泞一样被践踏。
