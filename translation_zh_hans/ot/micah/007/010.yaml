  naturalness: “雅威——你的上帝在哪里？”中的破折号在引语内不符合自然汉语标点和语气；直接发问即可。以“她必被践踏，如同街上的泥泞”表达，较为庄重、流畅且不改变意象。
  terminology: “雅威”恰当保留יהוה这一专名；“上帝”“仇敌”“羞耻”均适合现代庄重的经文语体。
