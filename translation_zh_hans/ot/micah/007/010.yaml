  text: וְ/תֵרֶ֤א אֹיַ֨בְתִּ/י֙ וּ/תְכַסֶּ֣/הָ בוּשָׁ֔ה הָ/אֹמְרָ֣ה אֵלַ֔/י אַיּ֖/וֹ יְהוָ֣ה אֱלֹהָ֑יִ/ךְ עֵינַ/י֙ תִּרְאֶ֣ינָּה בָּ֔/הּ עַתָּ֛ה תִּֽהְיֶ֥ה לְ/מִרְמָ֖ס כְּ/טִ֥יט חוּצֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/007/010.yaml
  text: Then my enemy will see[a], and shame will cover her—the one who said to me, “Where is Yahweh your God?” My eyes will look on her[b]; now she will be trampled down like mud in the streets.
translation:
  language: zh_hans
  text: 那时，我的仇敌必看见，羞耻必遮盖她；就是那曾对我说：“雅威——你的上帝在哪里？”的仇敌。我必亲眼看见她；如今，她必被践踏，如同街上的泥泞。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְתֵרֶא
  choice: 那时……必看见
  rationale: 这是ראה的Qal未完成式阴性单数第三人称，承接上文所述的将来转折；“那时”自然体现叙事推进。
- source_word: אֹיַבְתִּי
  choice: 我的仇敌
  rationale: 原词为阴性单数并带第一人称单数词尾；汉语“仇敌”不标性别，后文以“她”保留其阴性指称。
- source_word: וּתְכַסֶּהָ בוּשָׁה
  choice: 羞耻必遮盖她
  rationale: 贴近原文“羞耻覆盖她”的意象，同时在现代汉语中清楚庄重。
- source_word: הָאֹמְרָה אֵלַי
  choice: 她曾对我说
  rationale: 定冠词加阴性单数分词用于指认这位仇敌；“曾”符合其先前讥讽的语境。
- source_word: אַיּוֹ
  choice: 在哪里
  rationale: 直接传达带有讥讽意味的询问，不额外添加原文没有明说的强调。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常用音译呈现四字神名，而不以称号替代专名。
- source_word: אֱלֹהָיִךְ
  choice: 你的上帝
  rationale: 忠实保留第二人称阴性单数领属形式在语境中的直接称呼；汉语代词本身无需标出听者性别。
- source_word: עֵינַי תִּרְאֶינָּה בָּהּ
  choice: 我必亲眼看着她
  rationale: 用“亲眼”保留原文显式的“我的眼睛”，并以“看着”传达带有见证其败落意味的持续注视。
- source_word: עַתָּה
  choice: 如今
  rationale: 直接呈现局势逆转的当前阶段；“如今”比口语性的“现在”更符合经文语体。
- source_word: תִּהְיֶה לְמִרְמָס
  choice: 被人践踏
  rationale: לְמִרְמָס表示成为践踏的对象；汉语被动表达自然，并保留受践踏的结果义。
- source_word: כְּטִיט חוּצוֹת
  choice: 像街上的泥泞
  rationale: 保留泥泞与街道的意象，也自然衔接“被人践踏”。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名；采用“雅威”保留专名性质，避免以称号“主”取代，也不把较晚形成的混合读音作为正文。
- issue: 对仇敌败落的观看语气
  choice: 我必亲眼看着她
  alternative: 我的眼睛必看见她
  rationale: 保留原文强调亲眼见证的含义，但不额外加入“幸灾乐祸”或“报仇”等神学判断。
translation_notes:
  register: 采用现代、庄重且易懂的标准普通话。“雅威——你的上帝”以破折号略作停顿，突出讥讽所针对的是说话者所信奉的上帝；全节保留女性单数指称“她”，并保持从仇敌讥讽到其受辱被践踏的逆转意象。
