  text: וְ/הָיְתָ֥ה הָ/אָ֛רֶץ לִ/שְׁמָמָ֖ה עַל יֹֽשְׁבֶ֑י/הָ מִ/פְּרִ֖י מַֽעַלְלֵי/הֶֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/micah/007/013.yaml
  text: But the land will become a desolation because of its inhabitants[b][a], because of the fruit of their deeds.
translation:
  language: zh_hans
  text: 然而，这地必因其中居民的行为所结的果子而荒凉[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “这地”也可译作“大地”。希伯来语 אֶרֶץ 可指“地、土地”或“大地”；这里的审判语境较支持“这地”。
    reason: lexical_alternative
  - marker: b
    text: 直译：“因他们行为的果子。”这是以“果子”比喻他们所作所为产生的后果。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיְתָה
  choice: 必……荒凉
  rationale: 连词加完成式在预言语境中指向将来的结果；“必”表达确定的未来，“荒凉”自然呈现进入荒废状态的含义。
- source_word: הָאָרֶץ
  choice: 这地
  rationale: אֶרֶץ 可指“地、土地”或“全地、大地”；本节紧接审判语境，“这地”较贴合受审判的地域，同时以脚注保留另一可能。
- source_word: לִשְׁמָמָה
  choice: 荒凉
  rationale: 该名词表示荒废、毁坏的状态。汉语用“成为荒凉”不够自然，故在“必……荒凉”中以谓语形容词表达，同时保留其严重程度。
- source_word: עַל יֹשְׁבֶיהָ
  choice: 因其中的居民
  rationale: עַל 在此表示原因；“其中的居民”准确传达带阴性单数后缀的分词，所指为住在这地的人。
- source_word: מִפְּרִי
  choice: 这是……所结的果子
  rationale: מִן 可表达来源或原因，פְּרִי 是“果子”。采用独立说明句，既保留行为产生后果的比喻，又使两个相连的原因短语在现代汉语中清楚自然。
- source_word: מַעַלְלֵיהֶם
  choice: 他们行为
  rationale: מַעֲלָלִים 指人的所作所为，在审判语境中带有道德分量；“行为”自然庄重，且不预先添加“恶”等原文未明说的限定。
theological_decisions:
- issue: 审判的因果结构
  choice: 将荒凉明确呈现为居民行为所产生的后果，同时保留“果子”的比喻。
  alternative: 可更贴近希伯来语短语排列，译为“这地必因其中的居民，因他们行为的果子而荒凉”。
  rationale: 原文叠加 עַל 与 מִן 两个带因果或来源意味的短语。正文拆为前因后果的两个分句，使汉语通顺，却不超出原文所表达的道德因果关系。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“然而”承接上文的转折；正文保留“果子”这一希伯来语意象，并用自然句法说明其因果关系。所有脚注标记均置于相关正文之后。
