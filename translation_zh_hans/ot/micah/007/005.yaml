revisions:
- from: 不要相信邻舍[a]，不要倚赖密友[b]；即使对怀中躺卧的女人[c]，也要守住你口中的门[d]。
  to: 不要信赖邻舍[a]，不要倚赖密友[b]；连对那躺在你怀中的女人[c]，也要守住你口的门[d]。
  rationale: 修订“相信”为“信赖”，以准确表达对人的信任；微调末句属格结构，并更正相关注释的替代译法。其余措辞、关系递进和口门的具象隐喻均予保留。
