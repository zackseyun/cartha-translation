source:
  edition: WLC
  text: אַל תַּאֲמִ֣ינוּ בְ/רֵ֔עַ אַֽל תִּבְטְח֖וּ בְּ/אַלּ֑וּף מִ/שֹּׁכֶ֣בֶת חֵיקֶ֔/ךָ שְׁמֹ֖ר פִּתְחֵי פִֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/007/005.yaml
  text: Do not trust in a neighbor[a]; do not put confidence in a close companion. From the woman who lies in your bosom[d][c][b], guard the doors of your mouth.
translation:
  language: zh_hans
  text: 不要信赖邻舍[a]，不要倚赖密友[b]；连对那躺在你怀中的女人[c]，也要守住你口的门[d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “邻舍”也可译作“朋友”。
    reason: lexical_alternative
  - marker: b
    text: “密友”也可译作“亲密的同伴”。
    reason: lexical_alternative
  - marker: c
    text: 直译“躺卧在你怀中的女人”，指最亲密的伴侣，很可能是妻子。
    reason: cultural_note
  - marker: d
    text: “你口的门”是控制言语的比喻；也可译作“你口的开口”。
    reason: metaphor_note
lexical_decisions:
- source_word: רֵעַ
  choice: 邻舍
  rationale: 该词可指朋友、同伴或邻舍；“邻舍”保留较宽泛的社会关系，也与下句更亲密的 אַלּוּף 形成递进。
- source_word: אַלּוּף
  choice: 密友
  rationale: 此处指熟识而亲近、通常受人信赖的同伴，并非“首领”；“密友”简洁地表达亲密关系。
- source_word: תַּאֲמִינוּ
  choice: 相信
  rationale: אמן 的使役式与介词 ב 连用，表示把信任放在某人身上；现代汉语“相信”自然贴切。
- source_word: תִּבְטְחוּ
  choice: 倚赖
  rationale: בטח 表示信赖、依靠；用“倚赖”既保留依靠之意，也呈现与上句近义而不完全重复的平行。
- source_word: מִשֹּׁכֶבֶת חֵיקֶךָ
  choice: 即使对怀中躺卧的女人
  rationale: 直译保留原文所指的女性及亲密身体意象；介词 מִן 在语境中表示连这样亲近的人也应防备，故以“即使对……也”自然表达。
- source_word: חֵיק
  choice: 怀中
  rationale: חֵיק 可指胸怀、怀抱；“怀中”在现代汉语中自然，并保留亲密相拥的意象。
- source_word: שְׁמֹר
  choice: 守住
  rationale: 命令式要求谨慎保护、约束；“守住”能与后面的门之比喻自然搭配。
- source_word: פִּתְחֵי פִיךָ
  choice: 你口中的门
  rationale: 原文为复数“你口的门/开口”，是控制言语的鲜明隐喻；汉语用单数“门”更自然，同时不把意象释成抽象的“言语”。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“邻舍—密友—怀中躺卧的女人”保留原文关系逐步亲密的结构；末句保留“口中的门”这一具体意象。
