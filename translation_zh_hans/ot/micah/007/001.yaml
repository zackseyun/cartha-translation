  text: אַ֣לְלַי לִ֗/י כִּ֤י הָיִ֨יתִי֙ כְּ/אָסְפֵּי קַ֔יִץ כְּ/עֹלְלֹ֖ת בָּצִ֑יר אֵין אֶשְׁכּ֣וֹל לֶ/אֱכ֔וֹל בִּכּוּרָ֖ה אִוְּתָ֥ה נַפְשִֽׁ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/007/001.yaml
  text: 'Woe is me! For I have become like the gatherers of summer fruit[a], like the gleanings of the grape harvest: there is no cluster to eat[b], no first-ripe fig that my soul desires.'
translation:
  language: zh_hans
  text: 我有祸了！因为我好像夏果已经收尽，又像葡萄收获后所剩的余果：没有一串葡萄可吃，也没有我心所渴望的初熟无花果。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “夏果已经收尽”原文也可理解为“采收夏果的人”。原文名词形式的具体指向有歧义；正文按上下文译出采收后无果可寻的景况。
    reason: 保留אָספי קיץ可指采收者或采收后景况的歧义。
  - marker: b
    text: “初熟无花果”原文直译为“初熟的果子”，很可能指备受珍视的早熟无花果。
    reason: 说明בכורה的字面较宽含义及语境中最可能的具体所指。
lexical_decisions:
- source_word: אַלְלַי לִי
  choice: 我有祸了！
  rationale: 这是强烈的哀叹语。“我有祸了”保留原文的痛苦与危迫感，也符合先知文学庄重而自然的汉语表达。
- source_word: כִּי הָיִיתִי
  choice: 因为我如今就像
  rationale: 完成式在此指已经形成且持续至今的处境；“如今”自然传达结果状态，避免生硬直译为“我已经成为”。
- source_word: כְאָסְפֵּי קַיִץ
  choice: 像收过夏果之后
  rationale: 该短语的形态和所描绘的主体存在一定歧义，可指收集夏果的人，也可借以描写采收后的景象。下文强调找不到果实，因此译出采收过后的空乏处境，更贴合整句意象。
- source_word: כְעֹלְלֹת בָּצִיר
  choice: 又像摘过葡萄之后所剩的零落果子
  rationale: עֹלְלֹת 指主要采收后余下、可供拾取的少量果实；此译明确葡萄收获背景，并保留残余稀少的画面。
- source_word: אֵין אֶשְׁכּוֹל לֶאֱכֹל
  choice: 没有一串葡萄可以吃
  rationale: אֶשְׁכּוֹל 是一簇果实，在葡萄收获语境中特指一串葡萄；汉语明说“葡萄”可避免“果串”的含混。
- source_word: בִּכּוּרָה
  choice: 初熟无花果
  rationale: 该词字面为初熟之物，但在此语境及希伯来语常见用法中很可能指备受珍视的早熟无花果。正文采用最可能所指，并以脚注保留较宽泛的字面可能。
- source_word: אִוְּתָה נַפְשִׁי
  choice: 我心里渴望的
  rationale: נֶפֶשׁ 此处表达人的欲望或胃口。“我心里渴望”在现代汉语中自然庄重，并保留内在强烈愿望，而不将“魂”实体化。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以“收过……之后”和“所剩的零落果子”连贯呈现采收后的荒凉景象；保留先知第一人称强烈哀叹，并用脚注标明原文中有关收果者及初熟果子的词义空间。
