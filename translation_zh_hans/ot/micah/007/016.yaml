  text: יִרְא֤וּ גוֹיִם֙ וְ/יֵבֹ֔שׁוּ מִ/כֹּ֖ל גְּבֽוּרָתָ֑/ם יָשִׂ֤ימוּ יָד֙ עַל פֶּ֔ה אָזְנֵי/הֶ֖ם תֶּחֱרַֽשְׁנָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/007/016.yaml
  text: Nations will see and be ashamed of all their might[a]; they will put their hand over their mouth[c][b]; their ears will become deaf.
translation:
  language: zh_hans
  text: 列国必看见，并因自己的一切力量而羞愧[a]；他们必用手捂住嘴[b]，耳朵也必失聪[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“为自己的一切力量蒙羞。”希伯来语此处可表示他们因自己拥有的力量而羞愧，或表示羞愧与他们的一切力量有关。
    reason: lexical_alternative
  - marker: b
    text: “用手捂住嘴”是一种动作表达，可表示震惊得无话可说、保持缄默或表示降服。
    reason: cultural_note
  - marker: c
    text: 或译：“耳朵必闭塞”或“耳朵必变得迟钝。”
    reason: lexical_alternative
lexical_decisions:
- source_word: יִרְאוּ
  choice: 看见了
  rationale: ראה的Qal未完成式第三人称阳性复数表示看见、察觉；置于预言语境中，以“看见了”配合“就”自然呈现将来事件发生后的反应。
- source_word: גוֹיִם
  choice: 列国
  rationale: גּוֹיִם指诸国、万邦；本节语境侧重各民族国家，以“列国”简洁而庄重，也避免引入特定犹太人与外邦人的神学对照。
- source_word: וְיֵבֹשׁוּ
  choice: 就……羞愧
  rationale: בוש的Qal常指羞愧、蒙羞；“羞愧”保留其可指内在羞耻或客观受辱的张力。
- source_word: מִכֹּל גְּבוּרָתָם
  choice: 因自己的一切勇力
  rationale: 介词מִן在此可表示原因或关联；“因……而”是自然汉语，并由脚注保留“在自己的勇力上蒙羞”等关系性理解。גְּבוּרָה译为“勇力”，兼具力量与所夸耀的强盛之意。
- source_word: יָשִׂימוּ יָד עַל־פֶּה
  choice: 他们必用手捂口
  rationale: 直译该希伯来习语，同时使用自然现代汉语；此动作可表示震惊无言、缄默或降服，具体含义不在正文中限定。
- source_word: אָזְנֵיהֶם תֶּחֱרַשְׁנָה
  choice: 耳朵也必失聪
  rationale: חרשׁ与“耳朵”连用，表示变聋、听不见；“失聪”保留身体意象及状态变化，脚注列出“闭塞、迟钝”的可能理解。
theological_decisions:
- issue: 列国因其勇力羞愧的因果或关联含义
  choice: 正文采用“因自己的一切勇力而羞愧”
  alternative: “在自己的一切勇力上蒙羞”或“尽管有一切勇力，仍然蒙羞”
  rationale: 希伯来介词מִן允许原因、来源或关联等细微差别；正文选择通顺的原因性表达，同时以脚注保存未完全确定的语义范围，不将其解释为某一特定神学命题。
- issue: 捂口动作的具体意义
  choice: 保留动作图像，不在正文明确解释
  alternative: 直接译作“默不作声”“惊愕无言”或“降服”
  rationale: 该动作可表达缄默、惊愕或顺服；直译能保存原文的多义性和修辞力度。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“列国”“勇力”保持先知文学的凝练感；分号呈现三个连续反应。所有脚注标记均置于对应正文之后。
