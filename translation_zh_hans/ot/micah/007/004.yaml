  text: טוֹבָ֣/ם כְּ/חֵ֔דֶק יָשָׁ֖ר מִ/מְּסוּכָ֑ה י֤וֹם מְצַפֶּ֨י/ךָ֙ פְּקֻדָּתְ/ךָ֣ בָ֔אָה עַתָּ֥ה תִהְיֶ֖ה מְבוּכָתָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/007/004.yaml
  text: The best of them is like a brier; the upright is worse than a thorn hedge. The day of your watchmen[a], your punishment, has come; now their confusion will be.
translation:
  language: zh_hans
  text: 他们中最好的像荆棘；正直的人还不如荆棘篱笆。你守望者所预告的日子，就是惩罚你[a]的日子，已经来到；如今他们必陷入混乱。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “惩罚”所译的希伯来词也可指“巡察”或“追讨”；这里指审判临到。
    reason: 保留פְּקֻדָּה在巡察、追讨和惩罚之间的词义幅度。
lexical_decisions:
- source_word: טוֹבָם
  choice: 他们当中最好的
  rationale: טוֹב带第三人称阳性复数后缀，在此指前文所说的人中相对最好者；译作“他们当中最好的”自然且保留比较意味。
- source_word: כְּחֵדֶק
  choice: 像蒺藜
  rationale: חֵדֶק指带刺、会伤人的植物；“蒺藜”在现代汉语中简洁地保留这一意象。
- source_word: יָשָׁר
  choice: 最正直的
  rationale: 该形容词在此作名词使用，指被视为正直的人；结合与“最好”平行的语境，译作“最正直的”。
- source_word: מִמְּסוּכָה
  choice: 比荆棘篱笆还坏
  rationale: מִן表达比较，מְסוּכָה指篱笆或围篱；上下文的刺状意象表明是荆棘篱笆。“还坏”将原文隐含的负面比较自然表达出来。
- source_word: מְצַפֶּיךָ
  choice: 你守望者所宣告的
  rationale: 该词源于צפה，可指守望者；在先知性审判语境中，守望者负责警告、宣告将临之日。补出“所宣告的”使“守望者的日子”在现代汉语中通顺，同时不把守望者等同于审判者。
- source_word: פְּקֻדָּתְךָ
  choice: 你受惩罚的日子
  rationale: פְּקֻדָּה可指鉴察、追讨或惩罚；本段谴责社会败坏并宣告灾祸，因此“受惩罚”最清楚地传达此处的审判含义。
- source_word: בָאָה
  choice: 已经来到
  rationale: 完成式在此表达所宣告之事已经临到或确定实现；“已经来到”保留其完成性。
- source_word: עַתָּה תִהְיֶה מְבוּכָתָם
  choice: 如今他们必陷入混乱
  rationale: 原文直译近于“如今他们的混乱必发生”；转为自然的汉语动词结构，同时保留将来或必然结果的语气。
theological_decisions:
- issue: 审判宣告中פְּקֻדָּתְךָ的含义
  choice: 你受惩罚的日子
  alternative: 你受鉴察（或追讨）的日子
  rationale: 上下文明确指向因败坏而来的灾祸，“惩罚”呈现其司法性，却不额外引入特定教义；脚注保留希伯来词较宽的语义范围。
- issue: “守望者的日子”与“惩罚”的关系
  choice: 理解为守望者所宣告的日子，并以“受惩罚的日子”作同位说明
  alternative: 你的守望者之日，你受鉴察的时候，已经来到
  rationale: 希伯来语短语十分凝练，标点关系需由语境判断。守望者在先知传统中发出警告；本译文让两个短语共同指向临到的审判之日，同时不把守望者本身说成惩罚的执行者。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“蒺藜—荆棘篱笆”保留连续的刺状意象；末句用“陷入混乱”避免生硬照译名词结构。
