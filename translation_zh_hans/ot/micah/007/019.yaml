base_translation:
  language: en
  yaml_path: translation/ot/micah/007/019.yaml
  text: He will again have compassion on us[a]; he will subdue our iniquities[b]. He will cast all their sins into the depths of the sea.
translation:
  language: zh_hans
  text: 他必再一次怜悯我们；他必制伏我们的罪孽。你必[a]把他们所有的罪[b]投在海的深处。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文在这里从“他必”突然转为直接称呼的“你必把……投进”。一些古代文本见证和译本将其协调为“他必把……投进”。
    reason: alternative_reading
  - marker: b
    text: 希伯来文作“他们所有的罪”；许多译本根据前面的“我们的罪孽”译作“我们所有的罪”。
    reason: textual_variant
lexical_decisions:
- source_word: יָשׁוּב
  choice: 再次
  rationale: 该动词本义为“返回”，与后面的限定动词连用时表示动作重现；译作“再次”符合现代汉语，也保留原意。
- source_word: יְרַחֲמֵנוּ
  choice: 怜悯我们
  rationale: רחם表达深切的怜悯与慈悲；“怜悯我们”自然、庄重，并准确保留其情感力度。
- source_word: יִכְבֹּשׁ
  choice: 制伏
  rationale: כבש意为征服、使之受控制；以“罪孽”为宾语时，“制伏”保留征服性的意象，又不作过度解释。
- source_word: עֲוֺנֹתֵינוּ
  choice: 我们的罪孽
  rationale: עון可指罪孽及其罪责；译作“罪孽”并与后文חטאת“罪”保持词汇区别。
- source_word: וְתַשְׁלִיךְ
  choice: 你必把……投进
  rationale: 马所拉文本的动词形态是第二人称阳性单数，故保留从“他”突然转为直接称呼上帝“你”的人称变化。
- source_word: בִּמְצֻלוֹת יָם
  choice: 深海之中
  rationale: מצולות指海的深处；“深海之中”简洁自然，并保留罪被彻底除去的鲜明图像。
- source_word: כָּל
  choice: 一切
  rationale: 保留该词涵盖全部的强调意味。
- source_word: חַטֹּאותָם
  choice: 他们一切的罪
  rationale: 后缀按马所拉文本为第三人称阳性复数“他们的”，不将其协调为“我们的”；חטאת译为“罪”，与前面的“罪孽”有所区别。
theological_decisions:
- issue: 本节内部的人称和代词后缀转换
  choice: 保留马所拉文本的转换：先用第三人称“他必”，随后转为第二人称“你必”，最后保留第三人称复数“他们……的罪”。
  alternative: 协调为一致的人称和指代：“他必再次怜悯我们……他必把我们一切的罪投进深海之中。”
  rationale: 原文确有突兀的人称与指代变化。正文保留这种真实张力，不根据上下文静默协调；脚注说明古代见证及常见协调译法。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“制伏”保留征服罪孽的原文意象；“深海之中”传达海洋深处的画面。正文有意保留“他—你—他们”的突变，并以脚注帮助普通读者理解。
