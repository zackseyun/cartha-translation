language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: זַ֤עַף יְהוָה֙ אֶשָּׂ֔א כִּ֥י חָטָ֖אתִי ל֑/וֹ עַד֩ אֲשֶׁ֨ר יָרִ֤יב רִיבִ/י֙ וְ/עָשָׂ֣ה מִשְׁפָּטִ֔/י יוֹצִיאֵ֣/נִי לָ/א֔וֹר אֶרְאֶ֖ה בְּ/צִדְקָתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/007/009.yaml
  text: I will bear the indignation of Yahweh[a], because I have sinned against him, until he pleads my case and executes justice for me. He will bring me out to the light; I will look upon his righteousness.
translation:
  language: zh_hans
  text: 我要承受耶和华的震怒，因为我得罪了他，直到他为我申辩，为我主持公道。他必带我出来，进入光明；我必看见他的公义[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“他的公正”。这里的希伯来词既可指公义，也可指公正，尤其可指在审判中为人伸冤的公正行动。
    reason: 保留צדקה在法律性昭雪语境中的词义选择。
lexical_decisions:
- source_word: זַעַף יְהוָה
  choice: 耶和华的震怒
  rationale: זַעַף表示强烈的愤怒，也带有因罪而施行惩治的意味；“震怒”庄重而自然。专名יהוה译作“耶和华”，保留经文中的上帝圣名。
- source_word: אֶשָּׂא
  choice: 我要承受
  rationale: נשא在此指承担、忍受愤怒所带来的后果；“承受”既保留负重意象，也符合现代汉语表达。
- source_word: כִּי חָטָאתִי לוֹ
  choice: 因为我得罪了他
  rationale: כִּי在此表示原因；חטא与介词ל连用，指向受冒犯的对象，译作“得罪了他”自然准确。
- source_word: יָרִיב רִיבִי
  choice: 他为我申辩
  rationale: 动词ריב与同根名词构成法律用语，意为承办或辩护某人的案件；“为我申辩”简洁保留法庭语境。
- source_word: וְעָשָׂה מִשְׁפָּטִי
  choice: 为我主持公道
  rationale: מִשְׁפָּטִי在此不是抽象的审判，而是对说话者有利的公正裁断；“主持公道”清楚传达伸冤与裁决之意。
- source_word: יוֹצִיאֵנִי לָאוֹר
  choice: 他必领我走出黑暗，进入光明
  rationale: 原文直译为“使我出来，到光中”。汉语补出与“光明”相对的“黑暗”，使“出来”的起点自然显明，同时保留从患难转向昭雪的诗性图景。
- source_word: אֶרְאֶה בְּצִדְקָתוֹ
  choice: 我必看见他的公义
  rationale: ראה译作“看见”；介词ב在此可表达观看、经历其彰显。צדקה兼有公义与公正的语义，在法律性昭雪语境中仍保留“公义”为正文，并以脚注说明“公正”这一可能。
theological_decisions:
- issue: 上帝圣名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字圣名。中文圣经传统中“耶和华”最为普通读者熟悉，也明确将其作为专名呈现，而非以“主”替代。
- issue: בְּצִדְקָתוֹ 在昭雪语境中的含义
  choice: 他的公义
  alternative: 他的公正
  rationale: צדקה既可指上帝本性的公义，也可指其在审判中彰显的公正行动。正文采用较宽广的“公义”，脚注保留本节法律语境下“公正”的译法，避免消除语义张力。
- issue: 认罪与后来获判公道之间的张力
  choice: 同时保留说话者承认得罪上帝，以及上帝为其申辩、主持公道
  alternative: 将申辩解释为免除其对上帝所犯之罪
  rationale: 经文本身并列了应受上帝震怒与等待上帝对敌方伸冤两方面；译文不把后者误解为否认前者，也不额外说明案件对象。
translation_notes:
  register: 采用庄重、清晰的现代标准汉语，保持第一人称诗歌告白的节奏和法律性意象。“申辩”“主持公道”使连续的法庭语言自然可懂；正文中的脚注标记与脚注相对应。
