  text: תִּתֵּ֤ן אֱמֶת֙ לְ/יַֽעֲקֹ֔ב חֶ֖סֶד לְ/אַבְרָהָ֑ם אֲשֶׁר נִשְׁבַּ֥עְתָּ לַ/אֲבֹתֵ֖י/נוּ מִ֥/ימֵי קֶֽדֶם־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/007/020.yaml
  text: You will show faithfulness to Jacob and steadfast love to Abraham, which you swore to our fathers from days of old.
translation:
  language: zh_hans
  text: 你必向雅各显出信实，向亚伯拉罕显出慈爱，就是你从古时向我们列祖所起誓应许的。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֱמֶת
  choice: 信实
  rationale: 此处指上帝忠于自己的约和应许；“信实”比单纯的“真实”更准确地表达关系与立约语境。
- source_word: חֶסֶד
  choice: 慈爱
  rationale: 该词兼有坚定、忠诚与恩慈之意；“慈爱”自然庄重，并能在本节与立约应许的语境中承载其含义。
- source_word: אֲבֹתֵינוּ
  choice: 我们列祖
  rationale: 保留群体历史和先祖传承的含义；“列祖”是现代中文圣经语体中清楚而庄重的表达。
- source_word: מִימֵי קֶדֶם
  choice: 从古时
  rationale: 直译其时间意义，指久远的先祖时代，同时保持诗句简洁。
theological_decisions:
- issue: 关系代词 אֲשֶׁר 的指向
  choice: 译作“就是你……所起誓应许的”，使其概括前述对雅各的信实和对亚伯拉罕的慈爱
  alternative: 译作“正如你……所起的誓”，将其处理为方式或比较关系
  rationale: 希伯来文关系词本身可有一定弹性；这里以概括前述恩惠内容的关系从句来表达，与原句结构及英语审校层的“which”相合，同时不把誓言内容过度具体化。
- issue: 雅各与亚伯拉罕的所指
  choice: 保留人名，不明确限定为个人或其后裔
  alternative: 译为“雅各的子孙”和“亚伯拉罕的后裔”
  rationale: 原文直接使用祖先姓名，可能兼具祖先本人和以其代表的群体之意；保留原有表达可保存这种诗性与代表性张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“起誓应许”补出汉语中誓言所关涉的应许关系，使末句自然，并避免误读为“所起誓的慈爱”这一生硬结构。
