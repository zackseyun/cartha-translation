    issue: “审判官为着报酬”在中文正文中为不完整且不自然的名词性短语。
    rationale: 原文虽省略动词，但中文不宜机械保留至无法成句。其与“官长索求”并列，主流语法理解为审判官索取不正当报酬；脚注可保留其也可能指为报酬判案的歧义。
