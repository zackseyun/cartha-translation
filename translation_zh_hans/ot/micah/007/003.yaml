base_translation:
  language: en
  yaml_path: translation/ot/micah/007/003.yaml
  text: 'Their hands are on evil[a], to do it well: the prince asks, and the judge is for a bribe, and the great man speaks the desire of his soul[c][b]; thus they weave it together.'
translation:
  language: zh_hans
  text: 他们双手都用来作恶，而且做得娴熟：官长索求，审判官索取贿赂[b]，权贵说出自己心中的欲望；他们便把这事交织起来[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 希伯来文十分简略，直译为“审判官在／为报酬”。也可能指“审判官收受贿赂而判案”。
    reason: lexical_alternative
  - marker: c
    text: 或译：“他们把它扭结在一起。”这里描绘彼此配合的腐败，如同把一项阴谋编织或扭结起来。
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל הָרַע כַּפַּיִם
  choice: 他们双手作恶
  rationale: כַּפַּיִם 是双数，可自然译为“双手”；עַל הָרַע 在此表达积极参与恶事。译文保留全力投入作恶的意味。
- source_word: לְהֵיטִיב
  choice: 还做得很娴熟
  rationale: 该词字面为“做得好”，在作恶语境中带有强烈反讽；“娴熟”传达其精于恶事。
- source_word: הַשַּׂר שֹׁאֵל
  choice: 官长索求
  rationale: שַׂר 可指官长、首领；שֹׁאֵל 本为“求、索取”，腐败语境下“索求”比单纯“询问”自然，同时不明加所索何物。
- source_word: וְהַשֹּׁפֵט בַּשִּׁלּוּם
  choice: 审判官为着报酬
  rationale: 原文省略谓语，בַּשִּׁלּוּם 可指报酬或贿赂。正文保留省略和词义张力，脚注说明可能解释。
- source_word: וְהַגָּדוֹל
  choice: 权贵
  rationale: 形容词名词化，指有社会地位或势力的人；“权贵”在现代汉语中简洁自然。
- source_word: דֹּבֵר הַוַּת נַפְשׁוֹ
  choice: 说出心中的欲望
  rationale: הַוַּת 可涉及欲望、祸害或恶谋；结合 נַפְשׁוֹ，译为“心中的欲望”保留其自利意味，又不把具体罪行说死。
- source_word: וַיְעַבְּתוּהָ
  choice: 他们便把这一切串连起来
  rationale: עבת 有扭结、编织之意，描绘多人协同把腐败安排连成一体；“串连起来”在现代汉语中保留这一意象并较自然。
