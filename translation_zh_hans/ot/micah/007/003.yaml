revisions:
- from: 他们双手作恶[a]，还做得很娴熟：官长索求，审判官为着报酬[b]，权贵说出心中的欲望；他们便把这一切串连起来[c]。
  to: 他们双手都用来作恶，而且做得娴熟：官长索求，审判官索取贿赂[b]，权贵说出自己心中的欲望；他们便把这事交织起来[c]。
  rationale: 修订使中文句法完整、自然，同时维持原文对官长、审判官和权贵协同腐败的简洁谴责。将末句改为“交织起来”以保留原文的编织／扭结比喻；脚注保留审判官短语的省略性与可行替代解释。脚注a仅重复正文的“双手”含义，非必要的词义替代，故删除。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T08:15:57Z'
review_pass:
  verdict: revise
  source_fidelity: 译文准确呈现了全力而熟练地作恶、官长与审判官及权贵彼此配合的谴责。惟“审判官为着报酬”在现代汉语中缺少可理解的谓语，也未清楚表达此处与不正当报酬相关的腐败语境；据平行结构，可安全译为“审判官索取贿赂”，并以脚注保留“为报酬判案”的解释可能。末句的עבת意象宜保留“交织／编织”，不宜用较抽象的“串连”。
  naturalness: “双手作恶”及“还做得很娴熟”稍显生硬；改为“他们双手都用来作恶，而且做得娴熟”更合现代庄重汉语。“把这事交织起来”也比“把这一切串连起来”更贴近原文的编织、扭结意象。
  terminology: “官长”“审判官”“权贵”恰当。“贿赂”在正文中明确本节的司法腐败语境；脚注说明希伯来文的省略句式及另一种可行理解。
  issues:
