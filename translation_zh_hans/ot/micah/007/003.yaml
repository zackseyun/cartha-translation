  register: 采用现代、庄重而易懂的普通话。“双手作恶……做得很娴熟”保留原文反讽；“官长—审判官—权贵”呈现社会上层彼此配合的结构。正文不替原文省略处补定唯一动作，相关可能性置于脚注。
