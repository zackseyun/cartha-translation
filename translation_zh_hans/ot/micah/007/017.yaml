source:
  edition: WLC
  text: יְלַחֲכ֤וּ עָפָר֙ כַּ/נָּחָ֔שׁ כְּ/זֹחֲלֵ֣י אֶ֔רֶץ יִרְגְּז֖וּ מִ/מִּסְגְּרֹֽתֵי/הֶ֑ם אֶל יְהוָ֤ה אֱלֹהֵ֨י/נוּ֙ יִפְחָ֔דוּ וְ/יִֽרְא֖וּ מִמֶּֽ/ךָּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/007/017.yaml
  text: They will lick the dust like a snake[a]; like crawling things of the earth they will come trembling out of their strongholds. To Yahweh our God they will turn in dread[d][c][b], and they will be afraid because of you.
translation:
  language: zh_hans
  text: 他们必像蛇一样舔尘土；又像地上爬行之物一般，战战兢兢地从自己的堡垒[a]中出来。他们必惶恐地来到雅威——我们的上帝面前[b]，并因你而惧怕[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “堡垒”也可译作“围护之处”“藏身之处”或“禁闭之所”。
    reason: lexical_alternative
  - marker: b
    text: “雅威”是希伯来文中上帝的专有名 יהוה（YHWH）的音译。
    reason: divine_name
  - marker: c
    text: “因你而惧怕”也可译作“惧怕你”或“在你面前敬畏”。希伯来文既可表达恐惧的原因或对象，也可能带有敬畏的意味。
    reason: lexical_ambiguity
lexical_decisions:
- source_word: יְלַחֲכוּ עָפָר
  choice: 舔土
  rationale: 保留“舔”与“尘土”的具体受辱意象；现代汉语中“舔土”简洁自然，也与蛇的比喻紧密相连。
- source_word: כַּנָּחָשׁ
  choice: 像蛇一样
  rationale: נָחָשׁ是“蛇”的常用词；不特指创世记中的那一条蛇，因此不用“那蛇”。
- source_word: כְּזֹחֲלֵי אֶרֶץ
  choice: 像地上爬行之物一般
  rationale: 保留低伏爬行的形象，同时避免将所指过度限定为爬行动物或昆虫。
- source_word: יִרְגְּזוּ
  choice: 战战兢兢地……出来
  rationale: רגז表达震颤、惊惶；结合表示来源的介词מִן，以“战战兢兢地……出来”自然呈现带着恐惧离开的动作。
- source_word: מִמִּסְגְּרֹתֵיהֶם
  choice: 从自己的堡垒中
  rationale: 该词可指封闭、防护或拘束之处；上下文涉及列国因惧怕而从安全处出来，“堡垒”能表达其防护性质，但在脚注保留其他可能。
- source_word: אֶל יְהוָה אֱלֹהֵינוּ יִפְחָדוּ
  choice: 惶恐地来到雅威我们的上帝面前
  rationale: פחד表示恐惧，אֶל表示朝向；汉语以“惶恐地来到……面前”兼顾方向和惧怕，且避免生硬地译成“向……恐惧”。
- source_word: וְיִרְאוּ מִמֶּךָּ
  choice: 并因你而惧怕
  rationale: ירא在此与פחד平行，主要表示惧怕；מן可表示恐惧的原因或对象，正文采用自然的原因表达，并以脚注保留“惧怕你”的可能。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 以音译保留专有神名，与源文对神名和通称“上帝”的并列相对应；脚注说明其性质。
- issue: 末句两个惧怕动词的语气
  choice: 惶恐／惧怕
  alternative: 敬畏
  rationale: פחד与ירא在这里彼此平行，且上下文描述受降服的列国，主要语气是惊恐；不过ירא本身可含敬畏意味，脚注不排除这一语义余韵。
- issue: אֶל所表达的朝向
  choice: 来到……面前
  alternative: 转向……；向……
  rationale: 源文明确含朝向雅威之意，但动词本身是“惧怕”而非“来”或“转”；正文采用汉语所需的动作表达，不把它解释为悔改归信。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。以两个分句保持希伯来诗句的平行结构；“战战兢兢”“惶恐”“惧怕”呈现递进的恐惧语气，同时不把ירא可能具有的敬畏意味从译注中抹去。
