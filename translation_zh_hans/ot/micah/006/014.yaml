base_translation:
  language: en
  yaml_path: translation/ot/micah/006/014.yaml
  text: You will eat[a], but you will not be satisfied, and your emptiness will remain within you; you will move away, but you will not rescue anything, and what you do rescue I will give to the sword.
translation:
  language: zh_hans
  text: 你要吃，却吃不饱；你里面仍旧空虚[a]。你要撤离，却什么也救不出；你所救出的，我必把它交给刀剑。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “你里面仍旧空虚”所对应的希伯来语难以确定，也可理解为“羞辱在你当中”或“你里面有下沉”。
    reason: alternative_reading
lexical_decisions:
- source_word: תֹאכַל
  choice: 你要吃
  rationale: 该词是 אכל 的 Qal 未完成式第二人称阳性单数；在审判预言中表达将要发生的事。
- source_word: תִשְׂבָּע
  choice: 吃不饱
  rationale: שׂבע 指吃饱、满足；结合前面的“吃”，译为“吃不饱”简明自然，并保留吃了仍不得饱足的反差。
- source_word: יֶשְׁחֲךָ
  choice: 仍旧空虚
  rationale: 该词形罕见且含义不确定；按上下文可理解为内在的空乏。加入“仍旧”使希伯来语中无显式动词的短语在汉语中通顺，但不把含义说得过于具体。
- source_word: בְּקִרְבֶּךָ
  choice: 你里面
  rationale: קֶרֶב 可指内部或中间；此处与饥饿、空乏相连，“你里面”保留身体或内在状态两方面的可能。
- source_word: תַסֵּג
  choice: 你要撤离
  rationale: סוג 的 Hiphil 可指使退后、挪走或撤走。此处采用不过度指明被转移对象的译法，并与随后试图救出人或物的情境衔接。
- source_word: תַפְלִיט / תְּפַלֵּט
  choice: 救不出 / 救出
  rationale: פלט 的 Hiphil 表示使之逃脱、救出。前后重复译为“救出”，保留原文的重复和审判推进；“什么”补足汉语所需的隐含宾语。
- source_word: לַחֶרֶב
  choice: 交给刀剑
  rationale: “刀剑”是先知文学中战争与暴力毁灭的常见转喻，保留原文意象。
- source_word: אֶתֵּן
  choice: 我也必把它交给
  rationale: נתן 的 Qal 未完成式第一人称单数表明审判中的第一人称施事者；“交给”比生硬的“给刀剑”更符合现代汉语，同时保留主动交付之意。
theological_decisions:
- issue: 难解短语 וְיֶשְׁחֲךָ בְּקִרְבֶּךָ 的解释
  choice: 理解为持续存在于里面的空虚或空乏
  alternative: 可理解为“羞辱在你中间”或“衰败／下沉在你里面”
  rationale: 紧邻上下文描写吃而不得饱足、逃离与救援失败，因此“里面仍旧空虚”符合审判语境；同时以脚注说明原文的词义困难，避免把不确定处定得过死。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“吃不饱”自然呈现动作与结果的反差；“撤离”避免擅自确定所转移的是财物还是人员；前后均用“救出”保留原文复现同一词根的效果。脚注标在实际有歧义的短语之后。
