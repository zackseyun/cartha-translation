  to: 你要吃，却吃不饱；你里面仍旧空虚[a]。你要撤离，却什么也救不出；你所救出的，我必把它交给刀剑。
  rationale: 修订仅纠正末句关系从句被误作让步句的问题，并使脚注的替代释义更准确地反映原文难词及英语审校记录中的“下沉／陷落”可能性。保留“撤离”的谨慎译法，不擅自指定被转移的是人或财物；保留“救出”的词汇重复和“刀剑”的意象。
