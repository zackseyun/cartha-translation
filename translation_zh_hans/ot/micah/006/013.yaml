  text: וְ/גַם אֲנִ֖י הֶחֱלֵ֣יתִי הַכּוֹתֶ֑/ךָ הַשְׁמֵ֖ם עַל חַטֹּאתֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/006/013.yaml
  text: Therefore I too have begun to strike you[a], making you desolate because of your sins.
translation:
  language: zh_hans
  text: 所以，我也开始击打你[a]，使你因自己的罪而荒凉。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我因击打你而使你患病。”这个希伯来语动词也可表示使人患病或衰弱。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: 所以……也
  rationale: 结合前文的指控与审判，译出承接中的推论意味；“也”保留 גַם 的追加和强调作用。
- source_word: אֲנִי
  choice: 我
  rationale: 保留原文明确出现的第一人称代词，以突出是说话者亲自施行审判。
- source_word: הֶחֱלֵיתִי
  choice: 开始
  rationale: חלה 的使役式在此与后接的“击打你”构成起始用法，可理解为“开始击打”；同时以脚注保留“使患病／衰弱”的词义可能。
- source_word: הַכּוֹתֶךָ
  choice: 击打你
  rationale: 准确表达 נכה 不定式附第二人称阳性单数词尾的含义，并保留惩罚和审判的力度。
- source_word: הַשְׁמֵם
  choice: 使你荒凉
  rationale: 表达 שמם 使役式所指的毁坏结果；“荒凉”保留先知书中严厉审判的意象。
- source_word: עַל
  choice: 因
  rationale: 此处引出审判的原因，“因”以简洁、自然的现代汉语表达其因果意义。
- source_word: חַטֹּאתֶךָ
  choice: 你的罪
  rationale: 中文“罪”可作集合名词，既贴近该形式，也自然涵盖前文所列的多项违约恶行。
theological_decisions:
- issue: הֶחֱלֵיתִי הַכּוֹתֶךָ 所表达的神圣审判
  choice: 译为“我也开始击打你”
  alternative: “我击打你，使你患病”或“我使你衰弱”
  rationale: 该希伯来语形式既可能表示使患病或衰弱，也可在后接击打类不定式时表达动作开始。正文采用较符合句法关系的起始义，同时用脚注保存真实的词义歧义，避免把审判限定为身体疾病。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“击打”保留审判力度而不使用过于古雅的“击杀”或“击杖”；“使你荒凉”保留先知文学的灾荒与毁灭意象。
