revisions:
- from: 我拿什么来朝见雅威，在高天之上的上帝[a]面前俯伏呢？我该带着燔祭，带着一岁的牛犊来朝见他吗？
  to: 我拿什么来到雅威面前，向高天上的上帝俯伏呢？我该带着燔祭，带着一岁的牛犊来朝见他吗？
  rationale: 将“在高天之上的上帝”改为“向高天上的上帝”，避免在汉语中产生“高天之外／之上”的额外空间含义；同时调整首句结构，使“来到……面前”与“向……俯伏”分别对应原文两项动作。其余措辞忠实且自然，予以保留。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T08:21:15Z'
review_pass:
  verdict: revise
  source_fidelity: 原文两个问句及קדם（来到／进见）的重复、俯伏的敬拜姿态、燔祭和一岁牛犊均已基本表达。不过“在高天之上的上帝”在现代汉语中通常意为“在高天之上、又更高处的上帝”，多添了一层原文没有的空间关系；מָרוֹם宜译为“高天上的”或类似描述。
  naturalness: 原译整体庄重通顺，但“来朝见雅威，在高天之上的上帝面前俯伏”中两个动作的连接略显松散；改为“来到雅威面前，向高天上的上帝俯伏”更自然，也清楚呈现原文的两个介词短语。
  terminology: “雅威”“俯伏”“燔祭”均合适，并保留了相应的专名与祭祀、敬拜语域。“高天上的上帝”保留描述性措辞，避免将מָרוֹם不必要地定为固定称号。
  issues:
  - severity: medium
    issue: “高天之上的上帝”可能误示上帝位于高天之外或之上。
    rationale: 希伯来文לֵאלֹהֵי מָרוֹם意为“向／在高处、高天的上帝面前”，其中מָרוֹם描述高处或高天；“高天之上的”在汉语中额外表达“在高天以上”的位置。
  - severity: low
    issue: 首句两个敬拜动作的汉语衔接可更明确。
    rationale: 以“来到雅威面前，向高天上的上帝俯伏”分别对应אֲקַדֵּם יהוה与אִכַּף לֵאלֹהֵי מָרוֹם，语法关系更清楚。
  revised_text: 我拿什么来到雅威面前，向高天上的上帝俯伏呢？我该带着燔祭，带着一岁的牛犊来朝见他吗？
  revised_footnotes:
  - marker: a
    text: 或译“至高的上帝”。希伯来文直译为“高处（或高天）之神”。
    reason: 说明מָרוֹם可保留为高处、高天的描述，也可理解为表达上帝崇高地位；原文未明确将其限定为固定称号。
  revision_rationale: 将“在高天之上的上帝”改为“向高天上的上帝”，避免在汉语中产生“高天之外／之上”的额外空间含义；同时调整首句结构，使“来到……面前”与“向……俯伏”分别对应原文两项动作。其余措辞忠实且自然，予以保留。
