base_translation:
  language: en
  yaml_path: translation/ot/micah/006/006.yaml
  text: With what shall I come before Yahweh[a], and bow myself before God on high? Shall I come before him with burnt offerings, with year-old calves?
translation:
  language: zh_hans
  text: 我拿什么来到雅威面前，向高天上的上帝俯伏呢？我该带着燔祭，带着一岁的牛犊来朝见他吗？
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בַּמָּה
  choice: 拿什么
  rationale: 保留疑问短语的工具、伴随意味，并采用现代汉语中询问所带礼物或献物时自然的说法。
- source_word: אֲקַדֵּם / הַאֲקַדְּמֶנּוּ
  choice: 来朝见／来朝见他
  rationale: קדם在此表示来到某位尊者面前；“朝见”符合敬拜和觐见语境，也保留前后重复所形成的修辞呼应。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见音译呈现四字神名，不用称号替代经文中的专名。
- source_word: אִכַּף
  choice: 俯伏
  rationale: 表达身体屈身、低伏的敬拜姿态，不把它仅解释为内在谦卑。
- source_word: לֵאלֹהֵי מָרוֹם
  choice: 在高天之上的上帝面前
  rationale: 以描述性表达保留מָרוֹם的高处、崇高意象，避免直接把它固定化为“至高者”这一称号。介词结构按自然汉语补出“面前”。
- source_word: בְעוֹלוֹת
  choice: 带着燔祭
  rationale: “燔祭”是עֹלָה的通行祭祀术语；“带着”体现ב的伴随或凭借意味。
- source_word: בַּעֲגָלִים בְּנֵי שָׁנָה
  choice: 带着一岁的牛犊
  rationale: 准确保留牛犊及其一岁年龄限定；汉语中“一岁的牛犊”简洁自然。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用以色列上帝的专名，因此采用音译而非以“主”等称号替代；“雅威”较贴近学界通行的复原读音。
- issue: מָרוֹם是否译作固定神圣称号
  choice: 高天之上的上帝
  alternative: 至高的上帝
  rationale: 原文是描述性的“高处／高天之神”，并未使用常见的עֶלְיוֹן“至高者”；正文保留空间与尊崇兼具的意象，脚注说明另一种理解。
- issue: 献祭问题是否含有否定判断
  choice: 我该……吗？
  alternative: 难道我要……吗？
  rationale: 本节本身提出询问，尚未明说否定答案；避免用“难道”提前强化反问或否定语气，从而保留后文逐步展开的张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“朝见”保留敬拜者来到君王般尊者面前的语感；“俯伏”“燔祭”属于圣经语境中通行且可理解的用语。两次“朝见”对应原文重复，并以连续问句保留本节的修辞推进。
