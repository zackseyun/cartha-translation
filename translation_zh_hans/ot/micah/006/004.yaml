base_translation:
  language: en
  yaml_path: translation/ot/micah/006/004.yaml
  text: For I brought you up from the land of Egypt[a], and from the house of slavery I redeemed you; and I sent before you Moses, Aaron, and Miriam.
translation:
  language: zh_hans
  text: 因为我曾把你从埃及地领上来，从为奴之家救赎了你；我又差遣摩西、亚伦和米利暗在你前面。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，说明耶和华质问和申诉的根据；“因为”自然保留了论证关系。
- source_word: הֶעֱלִתִיךָ
  choice: 我曾把你……领上来
  rationale: 保留עלה使役形“使上去、领上来”的出埃及惯用表达；“领”也符合上帝带领百姓的语境。
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: 从埃及地
  rationale: 直接对应原文，并与表示移动的“领上来”自然搭配。
- source_word: מִבֵּית עֲבָדִים
  choice: 从为奴之家
  rationale: 该结构直译为“奴隶之屋”，实际指受奴役之地；“为奴之家”兼顾具体的奴役处境、原文的“家”意象和现代汉语的可读性。
- source_word: פְּדִיתִיךָ
  choice: 救赎了你
  rationale: פדה表示赎回、解救；“救赎”保留其赎回语义及出埃及的盟约分量，又不额外规定赎价细节。
- source_word: וָאֶשְׁלַח
  choice: 我又差遣
  rationale: 准确表达שלח；“又”自然呈现连续的神圣行动。
- source_word: לְפָנֶיךָ
  choice: 走在你前面
  rationale: 将字面的“在你面前”按语境表达为领袖走在百姓前面，保留空间性和引领含义。
- source_word: אֶת מֹשֶׁה אַהֲרֹן וּמִרְיָם
  choice: 摩西、亚伦和米利暗
  rationale: 按现代中文圣经通行译名明确保留三位领袖，包括原文特别列出的米利暗。
theological_decisions:
- issue: עֲבָדִים在出埃及固定表达中的译法
  choice: 为奴
  alternative: 奴隶；受奴役
  rationale: “为奴之家”清楚指向以色列人实际受奴役的身份，同时避免把“家”完全抽象化为单纯的“奴役”。
- issue: פדה的译法
  choice: 救赎
  alternative: 赎回；解救
  rationale: “救赎”保留原词的赎回意味及其在出埃及叙事中的神学分量，但不引入本节未说明的赎价或后期教义细节。
- issue: לְפָנֶיךָ所表达的领袖角色
  choice: 走在你前面
  alternative: 在你面前；作你的先导
  rationale: 原文可以表示在前方或在某人面前；正文保留“前面”的开放性，不把摩西、亚伦和米利暗的角色限定为某一种职分。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“曾”标示回顾性的历史行动；分号呈现救赎行动与差遣领袖之间的并列推进。
