  text: עַמִּ֗/י זְכָר נָא֙ מַה יָּעַ֗ץ בָּלָק֙ מֶ֣לֶךְ מוֹאָ֔ב וּ/מֶה עָנָ֥ה אֹת֖/וֹ בִּלְעָ֣ם בֶּן בְּע֑וֹר מִן הַ/שִּׁטִּים֙ עַד הַ/גִּלְגָּ֔ל לְמַ֕עַן דַּ֖עַת צִדְק֥וֹת יְהוָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/006/005.yaml
  text: My people[a], please remember what Balak king of Moab planned[c][b], and what Balaam son of Beor answered him—from Shittim to Gilgal—so that you may know the righteous acts of Yahweh.
translation:
  language: zh_hans
  text: 我的子民啊，请回想摩押王巴勒谋划了什么[a]，比珥的儿子巴兰回答了他什么，以及从什亭到吉甲所发生的事[b]，好使你知道耶和华公义的作为[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “谋划”也可译作“商议”或“设谋”。
    reason: lexical_alternative
  - marker: b
    text: 什亭和吉甲都是地名，使人想起以色列人从摩押平原进入那地的历程。
    reason: cultural_note
  - marker: c
    text: “公义的作为”也可译作“拯救的作为”或“所行的义举”。
    reason: alternative_reading
lexical_decisions:
- source_word: עַמִּי
  choice: 我的子民啊
  rationale: 这是上帝对以色列的呼语；“子民”保留盟约关系和归属意味，“啊”自然标示呼语。
- source_word: זְכָר נָא
  choice: 请回想
  rationale: 命令式配合 נָא 带有恳切劝请的语气；“请回想”既自然，也适合随后列举的历史事件。
- source_word: מַה יָּעַץ
  choice: 谋划了什么
  rationale: יעץ 可指商议、筹划或设谋；这里涉及巴勒对以色列的敌对意图，“谋划”保留计划与计谋之间的语义空间。
- source_word: וּמֶה עָנָה אֹתוֹ
  choice: 回答了他什么
  rationale: 直译原文的“什么”，不改成较具解释性的“怎样回答”，并明确巴兰是回答巴勒。
- source_word: מִן הַשִּׁטִּים עַד הַגִּלְגָּל
  choice: 从什亭到吉甲
  rationale: 将两地按通行中文音译处理，并保留原文简略的地理表达，不在正文中补入未明说的事件。
- source_word: לְמַעַן דַּעַת
  choice: 为要使你知道
  rationale: 保留目的从句；“你”承接集合单数的“我的子民”，体现原文对整体以色列的直接称呼。
- source_word: צִדְקוֹת
  choice: 公义的作为
  rationale: 该复数名词可涵盖耶和华公正、信实并施行拯救的历史行动；此译法保留其较宽广的含义。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代简体中文圣经语境中广为人知的神名译法，作为四字神名的专名表达。
theological_decisions:
- issue: צִדְקוֹת יְהוָה 的含义
  choice: 耶和华公义的作为
  alternative: 耶和华拯救的作为；耶和华所行的义举
  rationale: 上下文确有护佑、带领和拯救以色列的意味，但 צִדְקוֹת 不只表达拯救，也可指耶和华按公义和信实施行的事。因此正文采用较宽的“公义的作为”，另以脚注保留“拯救的作为”这一语境化理解。
- issue: “从什亭到吉甲”所修饰的内容
  choice: 保留为简略的独立地理短语
  alternative: 补译为“要回想从什亭到吉甲所发生的事”
  rationale: 希伯来文没有明说该短语具体修饰哪个事件，可能概括以色列从摩押平原进入应许之地的历程。正文以分号保留其压缩和一定程度的歧义，脚注提供历史背景而不在正文中定死句法关系。
translation_notes:
  register: 采用庄重而清楚的现代标准普通话。“我的子民啊”保留先知书中上帝直接呼唤百姓的郑重语气；全句尽量贴近希伯来文结构，同时用分号处理“从什亭到吉甲”与前后语句之间未完全明说的关系。
