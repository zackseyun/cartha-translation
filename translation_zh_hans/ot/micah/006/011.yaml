  yaml_path: translation/ot/micah/006/011.yaml
  text: Shall I acquit one with wicked scales and with a bag of deceptive weights?[a][b]
translation:
  language: zh_hans
  text: 我岂能把使用不义的天平、袋中装有诡诈砝码的人算为无罪呢？[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我岂能因不义的天平和袋中诡诈的砝码而算为清白呢？”希伯来语动词可指“清白”，也可指“被判为无罪”；上下文较支持司法性的含义。
    reason: alternative_reading
  - marker: b
    text: “砝码”原文直译为“石头”，指交易称量所用的石制砝码。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַאֶזְכֶּה
  choice: 我岂能……算为无罪呢
  rationale: זכה在此为第一人称单数未完成式，前有疑问词缀，形成带否定意味的反问。该词可表示“清白”或“被判为无罪”；结合本章诉讼语境，译作“算为无罪”较自然，同时在脚注保留“清白”的可能理解。
- source_word: בְּמֹאזְנֵי רֶשַׁע
  choice: 使用邪恶天平
  rationale: מֹאזְנַיִם指交易中称量用的天平；רֶשַׁע带有邪恶、罪恶或不义的道德评价。“邪恶天平”保留原文强烈的道德措辞，而“使用”使中文句法通顺。
- source_word: וּבְכִיס
  choice: 袋里装着
  rationale: כִּיס指袋子或囊，这里是商人盛放砝码的袋子。“袋里装着”自然表达原文介词结构与其实际用途。
- source_word: אַבְנֵי מִרְמָה
  choice: 欺诈砝码
  rationale: אַבְנֵי直译“石头”，在天平交易语境中指石制砝码；מִרְמָה意为欺骗或欺诈。“欺诈砝码”直接传达这些砝码被用于骗人，字面信息另见脚注。
theological_decisions:
- issue: 反问句的主语及司法含义
  choice: 理解为上主发问：他岂能把使用不诚实度量衡的人算为无罪
  alternative: 理解为说话者问自己使用这种器具是否还能保持清白
  rationale: 弥迦书第6章的盟约诉讼语境以及上主的第一人称话语支持司法性的理解；不过希伯来动词本身也可作“清白”，因此用脚注保留另一种句法和含义，避免消除原文张力。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“岂能……呢”保留原文反问语气；“邪恶天平”保留道德力度，“欺诈砝码”明确商业舞弊场景。脚注明示动词与句法上的真实歧义。
