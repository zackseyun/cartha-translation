  text: אֲשֶׁ֤ר עֲשִׁירֶ֨י/הָ֙ מָלְא֣וּ חָמָ֔ס וְ/יֹשְׁבֶ֖י/הָ דִּבְּרוּ שָׁ֑קֶר וּ/לְשׁוֹנָ֖/ם רְמִיָּ֥ה בְּ/פִי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/006/012.yaml
  text: whose rich men are full of violence[a], and her inhabitants speak lies; their tongue is deceitful in their mouth.
translation:
  language: zh_hans
  text: 这城的富人充满强暴，城里的居民口吐谎言；他们口舌诡诈。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“他们的舌头在他们口中是诡诈。”
    reason: 说明原文的具体措辞；正文以自然汉语“口舌诡诈”表达同一意象。
lexical_decisions:
- source_word: אֲשֶׁר
  choice: 这城的
  rationale: 关系词承接上文所说的城；汉语用“这城的”明确自然地表达其关系，同时不把它解释为因果连词。
- source_word: עֲשִׁירֶיהָ
  choice: 富人
  rationale: 指城中的富有者。希伯来语为阳性复数，但在此作为社会群体称谓；现代汉语“富人”既准确又自然，无须额外加入“男人”。
- source_word: מָלְאוּ חָמָס
  choice: 充满强暴
  rationale: 保留“充满”的结果状态以及 חָמָס 所含的暴力、欺压和凶暴恶行之意；“强暴”在先知性的社会控诉中简洁而有力度。
- source_word: וְיֹשְׁבֶיהָ
  choice: 城里的居民
  rationale: 分词在此作名词，泛指住在城中的人；补出“城里”可自然呈现阴性单数后缀所指的城。
- source_word: דִּבְּרוּ שָׁקֶר
  choice: 口吐谎言
  rationale: 完成式在此描述一贯、典型的罪行，汉语不必标明过去时；“口吐谎言”自然地表达“说虚假之言”，并与下句口舌意象衔接。
- source_word: וּלְשׁוֹנָם רְמִיָּה בְּפִיהֶם
  choice: 他们口舌诡诈
  rationale: 原文直陈“他们的舌头在他们口中是诡诈”，以舌头代表欺骗性的言语。“口舌诡诈”在现代汉语中凝练自然，并保留口与舌的具体意象。
theological_decisions: []
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“强暴”“口吐谎言”“口舌诡诈”保持先知控诉的力度和排比节奏；不额外限定富人的性别，也不把关系词解释成因果关系。
