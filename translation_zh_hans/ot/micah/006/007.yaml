source:
  edition: WLC
  text: הֲ/יִרְצֶ֤ה יְהוָה֙ בְּ/אַלְפֵ֣י אֵילִ֔ים בְּ/רִֽבְב֖וֹת נַֽחֲלֵי שָׁ֑מֶן הַ/אֶתֵּ֤ן בְּכוֹרִ/י֙ פִּשְׁעִ֔/י פְּרִ֥י בִטְנִ֖/י חַטַּ֥את נַפְשִֽׁ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/006/007.yaml
  text: Will Yahweh be pleased with thousands of rams[a], with ten thousands of streams of oil? Shall I give my firstborn for my transgression[c][b], the fruit of my body for the sin of my soul?
translation:
  language: zh_hans
  text: 耶和华岂会喜悦成千的公羊，和数万道油的溪流[a]吗？我岂要为自己的过犯献上我的长子，为我性命的罪献上我身所生的果实[b][c]？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“数万条油河。”希伯来语以夸张的说法描绘极其丰盛的油。
    reason: lexical_alternative
  - marker: b
    text: 希伯来语直译为“我腹中的果实”，是指自己所生的后代。
    reason: lexical_alternative
  - marker: c
    text: “罪”也可译为“赎罪祭”；不过这里与前面的“过犯”平行，译作“罪”较自然。“性命”所译的词也可指“灵魂”或“生命”。
    reason: alternative_reading
lexical_decisions:
- source_word: הֲיִרְצֶה
  choice: 岂会喜悦
  rationale: 疑问词与רצה构成反问，所问不只是是否收下祭物，也包括是否悦纳、以之为喜；“岂会喜悦”保留了评价意味和反问语气。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代简体中文读者熟悉的形式音译四字神名，不以称号代替专名。
- source_word: בְּאַלְפֵי אֵילִים
  choice: 成千的公羊
  rationale: אֵילִים在献祭语境中指公羊；“成千的”自然表达数量极其庞大，并与下句递进。
- source_word: בְּרִבְבוֹת נַחֲלֵי שָׁמֶן
  choice: 万万条油河
  rationale: רִבְבוֹת表示以万计的巨大数目，נַחֲלֵי可指溪流、河谷中的水流；“油河”保留原文夸张而鲜明的图景。
- source_word: הַאֶתֵּן
  choice: 我岂可……献上
  rationale: 延续反问并体现献祭语境；“献上”比一般的“给出”更明确地表达此处所设想的祭献行为，却不表示上帝认可。
- source_word: בְּכוֹרִי
  choice: 长子
  rationale: בכור指头生者；在所设想的献祭语境中，中文“长子”自然明确。原文并未另写“儿子”，但该词的阳性单数形式在此通常指头生的儿子。
- source_word: פִּשְׁעִי
  choice: 自己的过犯
  rationale: פשע可指越界、悖逆或过犯；“过犯”保留其道德分量，也与后面的“罪”形成诗行平行。
- source_word: פְּרִי בִטְנִי
  choice: 亲生骨肉
  rationale: 原文字面为“我腹中的果实”，是指亲生后代的习语。“亲生骨肉”在现代汉语中自然、庄重，也避免把未明确性别的说话者限定为母亲。
- source_word: חַטַּאת נַפְשִׁי
  choice: 自己的罪
  rationale: חטאת在此与“我的过犯”平行，宜理解为罪；נפש在本语境强调说话者本人，译作“自己的”比“灵魂的罪”更符合现代汉语，同时保留罪归于本人的含义。
theological_decisions:
- issue: חַטַּאת应译为“罪”还是“赎罪祭”
  choice: 罪
  alternative: 赎罪祭
  rationale: 该短语与前面的“我的过犯”构成平行，抽象的道德意义更切合上下文；但该词本身确可指赎罪祭，因此以脚注保留另一读法。
- issue: 反问是否暗示上帝赞同大量献祭或献长子
  choice: 保持逐层升级的反问，不加入赞同意味
  alternative: 把问题改写成上帝明确拒绝这些祭物的陈述
  rationale: 原文以夸张数量递进至献上长子，借震撼性的设问揭露这种思路；译文保持问题形式，既不淡化所指，也不替经文提前作解释。
- issue: בְּכוֹרִי是否应明确为“长子”
  choice: 长子
  alternative: 头生的孩子／我的头生者
  rationale: 该词的形式与通常用法支持“长子”，且中文自然；译文不进一步说明献祭对象的年龄或仪式性质。
translation_notes:
  register: 采用现代、庄重而易懂的反问句式。“成千……万万……”保留原文的夸张递进；“亲生骨肉”兼顾希伯来习语的具体性、中文自然度及说话者性别未明这一点。所有脚注标记均置于正文相应位置。
