    issue: “或”将原文两个祭物数量短语处理为选择关系。
    rationale: 希伯来文 בְּאַלְפֵי אֵילִים וּבְרִבְבוֹת נַחֲלֵי שָׁמֶן 是并列递进，不是二选一。
  - severity: low
    issue: “万万条油河”的数量表达不够清楚。
    rationale: רִבְבוֹת指以万计/数万；现代普通话中的“万万”通常不如“数万”直接，且“油河”可保留为脚注替代译法。
  - severity: medium
    issue: 脚注 c 错称“自己”所译的词可指“性命”或“灵魂”。
    rationale: 正文“自己的罪”中“自己”并非 נַפְשִׁי 的明确对应；该词实际在该结构中修饰“罪”。须使脚注锚点和说明准确对应。
