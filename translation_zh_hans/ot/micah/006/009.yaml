source:
  edition: WLC
  text: ק֤וֹל יְהוָה֙ לָ/עִ֣יר יִקְרָ֔א וְ/תוּשִׁיָּ֖ה יִרְאֶ֣ה שְׁמֶ֑/ךָ שִׁמְע֥וּ מַטֶּ֖ה וּ/מִ֥י יְעָדָֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/006/009.yaml
  text: 'The voice of the LORD cries out to the city—and sound wisdom fears your name: hear the rod and him who appointed it.'
translation:
  language: zh_hans
  text: '耶和华的声音向城呼喊；

    健全的智慧看见你的名[a]。

    你们要听杖，

    以及指定它的是谁。[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “看见”按马所拉元音直译。由于原文辅音也可作不同读法，本句亦可理解为：“敬畏你的名才是智慧。”
    reason: 保留יִרְאֶה按WLC元音的通常意义，同时说明这个长期存在且会影响句法的替代读法，不在正文武断消除歧义。
  - marker: b
    text: “杖”在此语境可象征管教或惩罚；“它”也可能泛指所临到的事。原文没有明确说明指定者是谁。
    reason: 说明מַטֶּה及阴性后缀-הּ的可能所指，避免将杖、具体灾祸或指定者作超出本节的限定。
lexical_decisions:
- source_word: קול יהוה
  choice: 耶和华的声音
  rationale: 按原文保留“声音”这一具体表达，并以现代中文圣经语体常用的“耶和华”呈现神名。
- source_word: לָעִיר יִקְרָא
  choice: 向城中呼喊
  rationale: “城”在此是呼喊的对象；“向城中”自然地表达对城及其中居民发声。
- source_word: תּוּשִׁיָּה
  choice: 真智慧
  rationale: 该词可指健全、实在的智慧或谋略；“真智慧”简洁地表达其积极、可靠的性质。
- source_word: יִרְאֶה שְׁמֶךָ
  choice: 必留意你的名
  rationale: WLC元音所示动词是“看见”；在此用“留意”表达“看见、重视”的语境含义，同时以脚注保留直译及另一种读法。
- source_word: שִׁמְעוּ מַטֶּה
  choice: 你们要听那刑杖
  rationale: 保留原文突出的“听杖”拟人化说法；“刑杖”表明杖在语境中代表管教或惩罚，却不把比喻完全释义化。
- source_word: וּמִי יְעָדָהּ
  choice: 也要听那位指定它的
  rationale: 把מִי理解为“那位……的”，把动词理解为指定、安排；补出重复的“听”，使中文关系清楚。
theological_decisions:
- issue: יִרְאֶה应译“看见”还是“敬畏”
  choice: 正文采用基于马所拉元音的“留意”，脚注说明直译为“看见”
  alternative: 按另一种元音理解为“敬畏”，译作“敬畏你的名才是真智慧”
  rationale: 所给WLC文本明确标为יִרְאֶה（他看见），不宜仅凭较顺畅的神学表达改读为“敬畏”；但辅音形式容许传统上的另一理解，故以脚注保存歧义。
- issue: “刑杖”与“指定它的”所指
  choice: 保留刑杖及其指定者之间的区分
  alternative: 把整句解释为“留意惩罚以及施罚者”
  rationale: 原文没有明说刑杖具体指哪场灾祸，也没有在本节直接明说指定者是谁；正文不作超出文本的限定。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语；以诗行呈现先知宣告。保留“听那刑杖”的强烈意象，不将其平铺为解释性散文；第二人称“你的名”按原文突然转向对神的称呼，不予消解。
