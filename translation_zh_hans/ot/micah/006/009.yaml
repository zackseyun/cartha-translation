  terminology: “耶和华”与本项目既有神名惯例一致。“健全的智慧”较“真智慧”更贴近תּוּשִׁיָּה所含的稳健、有效、可靠之智慧；“杖”不预先限定为某一种具体刑罚，脚注说明其语境功能。
