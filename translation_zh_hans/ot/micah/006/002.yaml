  text: שִׁמְע֤וּ הָרִים֙ אֶת רִ֣יב יְהוָ֔ה וְ/הָ/אֵתָנִ֖ים מֹ֣סְדֵי אָ֑רֶץ כִּ֣י רִ֤יב לַֽ/יהוָה֙ עִם עַמּ֔/וֹ וְ/עִם יִשְׂרָאֵ֖ל יִתְוַכָּֽח־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/006/002.yaml
  text: Hear[a], O mountains, the case of Yahweh, and you enduring foundations of the earth; for Yahweh has a case against his people[c][b], and he will contend with Israel.
translation:
  language: zh_hans
  text: 众山哪，要听雅威的争讼；大地坚固的根基[a]啊，也要听！因为雅威要与他的子民争讼，要同以色列辩论。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “坚固的”或译“恒久的”或“古老的”。
    reason: 原词הָאֵתָנִים可表示坚固、持久或年代久远；此处用“大地的根基”作见证者的意象，无法完全排除这些相近含义。
lexical_decisions:
- source_word: שִׁמְעוּ
  choice: 要听
  rationale: 复数祈使式，向众山和大地的根基发出先知性的传唤；“要听”简洁自然，并保留命令语气。
- source_word: הָרִים
  choice: 众山哪
  rationale: 这是对受造界的直接呼告；“哪”自然体现呼格，“众山”也与复数形式相称。
- source_word: רִיב
  choice: 控诉／争讼
  rationale: 该词具有争端、诉讼和立约法律指控的语义。前句用“控诉”使“听”后的宾语自然明确，后句用“争讼”表达雅威与其子民之间的司法性争辩。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文四字神名作中文音译，以保留经文使用的上帝专名，而不以头衔替代。
- source_word: הָאֵתָנִים
  choice: 恒久的
  rationale: 该词可表示坚固、持久或古老；“恒久的”兼顾稳固与长存的意象，并适合修饰大地的根基。
- source_word: מֹסְדֵי אָרֶץ
  choice: 大地……的根基
  rationale: 该组合词指大地的基础部分；与众山共同充当见证者，具有宇宙性的受造界意象。
- source_word: עִם עַמּוֹ
  choice: 与他的子民争讼
  rationale: עִם字面为“与”，但在רִיב的法律语境中具有对抗关系；此译既保留介词形式，也由“争讼”显明敌对的司法含义。
- source_word: יִתְוַכָּח
  choice: 要同……辩论
  rationale: 该动词可指争辩、申辩或进行法律争论；“辩论”保留司法语气，又不预先限定具体诉讼程序。
- source_word: יִשְׂרָאֵל
  choice: 以色列
  rationale: 采用现代中文通行的专名译法。
theological_decisions:
- issue: 四字神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用上帝的立约专名；“雅威”较贴近学界通常重构的读音，并避免用“主”等头衔取代专名。
- issue: 雅威与其子民之间关系的司法色彩
  choice: 与他的子民争讼
  alternative: 控告他的子民
  rationale: 原文介词字面是“与”，而רִיב使关系带有对抗和诉讼意味；“与……争讼”既呈现法律语境，也不把含义收窄为单向起诉。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以“众山哪……根基啊”保留先知诗歌中对受造界的呼告，并用“控诉、争讼、辩论”维持原文的立约—司法语域。
