id: MIC.6.1
reference: Micah 6:1
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: שִׁמְעוּ נָ֕א אֵ֥ת אֲשֶׁר יְהוָ֖ה אֹמֵ֑ר ק֚וּם רִ֣יב אֶת הֶ/הָרִ֔ים וְ/תִשְׁמַ֥עְנָה הַ/גְּבָע֖וֹת קוֹלֶֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/006/001.yaml
  text: 'Hear now what Yahweh says: Arise[a], contend before the mountains, and let the hills hear your voice.'
translation:
  language: zh_hans
  text: '你们现在要听雅威所说的话：

    “起来，在群山面前申诉[a]，

    让丘陵听见你的声音。”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“与群山争辩”或“控告群山”。“申诉”所译的希伯来语动词带有争讼、诉讼的意味；这里的群山很可能是被召来为雅威的立约诉讼作见证。
    reason: 保留介词结构及司法用语的词义歧义，并说明上下文所暗示的见证者角色。
lexical_decisions:
- source_word: שִׁמְעוּ נָא
  choice: 你们现在要听
  rationale: 复数命令式要求众人留心听；נָא在此增添催促、恳切的语气。“现在要听”自然地传达先知宣告的郑重感。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文直接保留上帝的专名，以现代汉语通行音译“雅威”呈现，而不以称号替代。
- source_word: אֹמֵר
  choice: 所说的话
  rationale: 该分词在引出神谕的结构中表示当前所说的内容；译作“所说的话”符合现代汉语引语习惯。
- source_word: קוּם
  choice: 起来
  rationale: 阳性单数命令式召唤受话者采取行动；“起来”简洁自然，并保留由复数听众转向单数受命者的人称变化。
- source_word: רִיב
  choice: 申诉
  rationale: 该词具有争讼、诉讼的司法色彩。“申诉”既能表达提出案件或陈明诉求，又不把群山明确判定为对手。
- source_word: אֶת הֶהָרִים
  choice: 在群山面前
  rationale: אֶת与ריב连用时可指争讼所涉及的一方；上下文很可能把群山召作见证者，因此正文采用“在……面前”，同时以脚注保留“与……争辩”和“控告……”的可能。
- source_word: וְתִשְׁמַעְנָה
  choice: 让……听见
  rationale: 连接于命令式后的未完成式带有祈使或愿望色彩；“让……听见”准确而符合汉语表达。
- source_word: הַגְּבָעוֹת
  choice: 丘陵
  rationale: 与“群山”构成地貌上的诗歌平行，词义直接且庄重。
- source_word: קוֹלֶךָ
  choice: 你的声音
  rationale: 保留原文阳性单数第二人称，并直译“声音”，不将其解释性改写为“你所说的话”。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。译作“雅威”保留其作为以色列之神立约专名的性质，避免以称号“主”取代；“耶和华”则反映较晚形成的混合读音。
- issue: 群山在争讼场景中的角色
  choice: 在群山面前申诉
  alternative: 与群山争辩；控告群山
  rationale: ריב与אֶת容许不同句法理解。后续经文显示山岭较可能是立约争讼的见证者，但本节本身仍有歧义，因此正文采用较符合语境的读法，并在脚注保留其他可能。
translation_notes:
  register: 采用现代、庄重而易懂的先知宣告语体。首句的“你们”与随后“起来”“你的”的单数形式，保留原文从复数听众转向单数受命者的变化；诗行分排以显出“群山／丘陵”和“申诉／听见”的平行结构。
