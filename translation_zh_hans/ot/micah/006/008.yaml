id: MIC.6.8
reference: Micah 6:8
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: הִגִּ֥יד לְ/ךָ֛ אָדָ֖ם מַה טּ֑וֹב וּ/מָֽה יְהוָ֞ה דּוֹרֵ֣שׁ מִמְּ/ךָ֗ כִּ֣י אִם עֲשׂ֤וֹת מִשְׁפָּט֙ וְ/אַ֣הֲבַת חֶ֔סֶד וְ/הַצְנֵ֥עַ לֶ֖כֶת עִם אֱלֹהֶֽי/ךָ־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/micah/006/008.yaml
  text: He has told you[a], O man, what is good; and what does Yahweh require of you but to do justice, and to love steadfast love[b], and to walk humbly with your God?
translation:
  language: zh_hans
  text: 人哪，耶和华已经指示你何为善；耶和华向你所要的是什么呢？无非是秉行公正，喜爱忠贞的爱[a]，谦卑地与你的上帝同行[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “忠贞的爱”也可译作“怜悯”“仁慈”或“盟约忠诚”。希伯来文 חֶסֶד 含有在关系中持久、忠诚地施爱的意思。
    reason: lexical_alternative
  - marker: b
    text: “谦卑地……同行”也可理解为“谨慎地与你的上帝同行”；这里的希伯来语形容人在上帝面前行事的谦逊、端正姿态。
    reason: lexical_alternative
lexical_decisions:
- source_word: הִגִּיד לְךָ
  choice: 已经告诉你
  rationale: 使役形表达“使人知道、宣告”；“已经告诉”自然地体现先前启示对当前仍然有效。
- source_word: אָדָם
  choice: 世人哪
  rationale: 保留单数呼语的修辞作用，同时以现代汉语自然地指向作为代表的人类听者，而非限定为某一男性。
- source_word: מַה טּוֹב
  choice: 什么是善
  rationale: טוֹב是宽泛的道德用语；“善”保留其概括性，不收窄为“正确”或“有益”。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经语境中广为人知的专名形式，明确呈现希伯来文的神名。
- source_word: דּוֹרֵשׁ מִמְּךָ
  choice: 向你所要的
  rationale: 本语境中的דרש加מן表示要求或期望；“向你所要的”既自然，也保留盟约伦理语气。
- source_word: כִּי אִם
  choice: 无非是
  rationale: 在修辞问句后引出唯一要求的内容，传达“除了……以外并无别的”的限定意味。
- source_word: עֲשׂוֹת מִשְׁפָּט
  choice: 行公正
  rationale: 同时保留עשה的行动性和מִשְׁפָּט的伦理、公义维度；“行公正”简洁而自然。
- source_word: אַהֲבַת חֶסֶד
  choice: 喜爱忠贞之爱
  rationale: 保留原文“爱/喜爱”与חֶסֶד之间的表达张力；“忠贞之爱”兼顾坚定的爱、仁慈和盟约忠诚等内涵。
- source_word: הַצְנֵעַ לֶכֶת
  choice: 谦卑地……同行
  rationale: 该结构以副词方式描述行走的姿态；“谦卑地”符合语境，同时“同行”承接הלך与עם的组合。
- source_word: עִם אֱלֹהֶיךָ
  choice: 与你的上帝同行
  rationale: עִם通常意为“与……一起”；如此翻译保留人与上帝同行的关系性，不改释为“在……面前”。
theological_decisions:
- issue: חֶסֶד的译法
  choice: 忠贞之爱
  alternative: 怜悯、慈爱、仁慈、盟约忠诚
  rationale: חֶסֶד不只指同情怜悯，也常包含持久的爱与关系中的忠诚。“忠贞之爱”保留这种丰富性；脚注列出常见替代译法，避免把词义锁定在单一神学解释上。
- issue: אָדָם的代表性单数呼语
  choice: 世人哪
  alternative: 人哪、人类啊
  rationale: 希伯来文以单数个体作为代表向人说话。“世人哪”在现代汉语中既有呼语力度，又能表达普遍的人类指向，而不必把原文误解为只对男性说话。
- issue: הלך עם的关系性表达
  choice: 与你的上帝同行
  alternative: 谦卑地行在你的上帝面前
  rationale: 原文介词עִם直译为“与”，因此保留“同行”，不将其神学化地改写为“在……面前”。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。三个并列要求以“行……，喜爱……，谦卑地……同行”呈现，保留原文伦理三联结构；用“世人哪”体现代表性呼语，用“耶和华”呈现神名。
