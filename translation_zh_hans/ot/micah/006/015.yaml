  text: אַתָּ֥ה תִזְרַ֖ע וְ/לֹ֣א תִקְצ֑וֹר אַתָּ֤ה תִדְרֹֽךְ זַ֨יִת֙ וְ/לֹא תָס֣וּךְ שֶׁ֔מֶן וְ/תִיר֖וֹשׁ וְ/לֹ֥א תִשְׁתֶּה יָּֽיִן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/006/015.yaml
  text: You will sow[a], but you will not reap; you will tread olives, but you will not anoint yourself with oil; and you will tread out new wine, but you will not drink wine.
translation:
  language: zh_hans
  text: 你要撒种，却不得收割；你要踩榨橄榄，却不得用油抹身；你又要踩榨葡萄制新酒[a]，却不得喝酒。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“你要踩榨橄榄……和新酒”；“踩榨”这个动词很可能也适用于后一项。译文为使汉语语意完整，补出“葡萄制”。
    reason: 说明原文的动词省略，以及为使汉语表达自然完整而补出的“葡萄制”。
lexical_decisions:
- source_word: תִזְרַע
  choice: 撒种
  rationale: זרע通常指播撒种子；“撒种”保留农业意象，并与“收割”自然对应。
- source_word: תִקְצוֹר
  choice: 不得收割
  rationale: קצר是收割庄稼的常用动词；“收割”准确而自然。
- source_word: תִדְרֹךְ זַיִת
  choice: 踩榨橄榄
  rationale: דרך字面义为“踩踏”；在橄榄加工语境中，“踩榨”兼顾动作形象与实际目的，比单说“踩橄榄”更易懂。
- source_word: תָסוּךְ שֶׁמֶן
  choice: 不得用油抹身
  rationale: סוך指把油涂抹在身体上；“用油抹身”保留其日常身体护理含义，避免“膏立”可能带来的礼仪或职分联想。
- source_word: תִירוֹשׁ
  choice: 新酒
  rationale: תירוש指葡萄的新产物或新酒；“新酒”保留原词在葡萄汁与酒之间的语义范围，不将其限缩为未发酵葡萄汁。
- source_word: וְתִירוֹשׁ
  choice: 踩榨葡萄，酿成新酒
  rationale: 原文此处省略动词，通常承接前面的“踩榨”。汉语若直译为“和新酒”语意不完整，因此明示所踩榨的是葡萄及其产物，同时用脚注说明原文形式。
- source_word: תִשְׁתֶּה יַיִן
  choice: 不得喝酒
  rationale: יין是普通的“酒”；此处与前面的“新酒”形成从生产到享用的对照。
- source_word: אַתָּה
  choice: 你要
  rationale: 原文重复独立代词以加强直接指向；译文在前两分句保留重复句式，使审判宣告有力度而不过度添加“你自己”。
theological_decisions:
- issue: 审判意象的性质
  choice: 以劳作有投入却不能收获或享用产物来表达审判
  alternative: 仅视为不带盟约背景的一般灾祸
  rationale: 本节呈现典型的咒诅式逆转：撒种而不收割，生产而不能享用。译文保留这种严厉张力，但不在正文中额外标明其神学体系。
- issue: “抹油”的含义
  choice: 身体涂油与日常享用
  alternative: 宗教性的膏立或礼仪性涂抹
  rationale: 动词סוך在此农业产物与个人享用的语境中，最自然地指以油抹身；译为“抹身”可避免无根据地导入礼仪或职分含义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“却不得”保持先知审判宣告的凝练力度；“踩榨”保留原文具体动作，又符合现代读者对榨取橄榄油和葡萄汁的理解。所有脚注标记均已置于正文。
