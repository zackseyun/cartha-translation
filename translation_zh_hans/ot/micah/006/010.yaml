  text: ע֗וֹד הַ/אִשׁ֙ בֵּ֣ית רָשָׁ֔ע אֹצְר֖וֹת רֶ֑שַׁע וְ/אֵיפַ֥ת רָז֖וֹן זְעוּמָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/006/010.yaml
  text: Are there still in the house of the wicked treasures of wickedness[b][a], and a scant measure that is accursed?
translation:
  language: zh_hans
  text: 恶人的家中难道仍有不义之财，以及可憎的不足量器[a]吗？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “量器”原文为“伊法”，是古代量干货的容量单位；此处指商人使用的量具所量出的容量。“不足量器”指容量不足、用来克扣分量的量器。
    reason: lexical_alternative
lexical_decisions:
- source_word: עוֹד
  choice: 仍
  rationale: 表示不义之事持续存在；“仍”简洁自然，保留其延续意味。
- source_word: הַאִשׁ
  choice: 岂不……吗
  rationale: 原文形式有困难，但上下文最适合理解为带责问意味的疑问句；此译法在现代汉语中自然地表达修辞性诘问。
- source_word: בֵּית רָשָׁע
  choice: 恶人的家里
  rationale: 保留单数集合性表达，可指恶者的住所或家业，不额外限定性别。
- source_word: אֹצְרוֹת רֶשַׁע
  choice: 不义之财
  rationale: 字面为“不义的积存／财宝”，语境指以不义手段积聚的财富；“不义之财”兼顾具体财富与道德谴责。
- source_word: אֵיפַת
  choice: 量器
  rationale: “伊法”本是干货容量单位，在本处也涉及商人实际使用的量具；正文译为“量器”更易懂，脚注说明其专名。
- source_word: רָזוֹן
  choice: 短
  rationale: 形容量器容量不足，即克扣分量；“短量器”在语境中清楚表达欺诈性的不足量。
- source_word: זְעוּמָה
  choice: 受咒诅的
  rationale: 表达该量器因邪恶欺诈而遭谴责、处于咒诅之下，保留原文强烈的审判色彩。
theological_decisions:
- issue: 开头疑难形式是否按疑问句处理
  choice: 译作修辞性责问：“岂不仍有……吗？”
  alternative: 译作陈述句：“恶人的家里仍有……”
  rationale: 《弥迦书》6章这一段以连续责问揭露罪恶，下一节也采用问句；疑问读法更符合话语脉络，同时以修辞问句保留控诉力度。
- issue: אֹצְרוֹת רֶשַׁע 所指为何
  choice: 译作“不义之财”
  alternative: 较字面译作“不义的财宝／积存”
  rationale: 该短语可能指本质邪恶的财物，也可能指以不义取得的财富；“不义之财”在汉语中保留这种关联，不具体断定取得方式。
translation_notes:
  register: 采用现代、庄重而易懂的责问语气。“短量器”简明呈现商业欺诈，并用脚注交代“伊法”的古代度量背景。
