  text: וְ/יִשְׁתַּמֵּ֞ר חֻקּ֣וֹת עָמְרִ֗י וְ/כֹל֙ מַעֲשֵׂ֣ה בֵית אַחְאָ֔ב וַ/תֵּלְכ֖וּ בְּ/מֹֽעֲצוֹתָ֑/ם לְמַעַן֩ תִּתִּ֨/י אֹתְ/ךָ֜ לְ/שַׁמָּ֗ה וְ/יֹשְׁבֶ֨י/הָ֙ לִ/שְׁרֵקָ֔ה וְ/חֶרְפַּ֥ת עַמִּ֖/י תִּשָּֽׂאוּ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/micah/006/016.yaml
  text: The statutes of Omri are kept[a], and all the works of the house of Ahab; and you walk in their counsels, so that I may make you a desolation, and her inhabitants an object of hissing[c][b], and you will bear the reproach of my people.
translation:
  language: zh_hans
  text: 暗利的律例仍被遵守，亚哈家的一切作为也都被效法；你们照着他们的谋略行事，以致我要使你成为荒凉，使其中的居民成为人嗤笑的对象[a]；你们必担当我子民的羞辱。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“成为嘘声”；指人因鄙夷或惊骇而向她发出嘘声、嗤声。
    reason: cultural_note
  - marker: b
    text: “我子民的羞辱”也可理解为“对我子民的羞辱”或“我子民所受的羞辱”。希伯来原文十分简洁，可有不止一种理解。
    reason: alternative_reading
lexical_decisions:
- source_word: וְיִשְׁתַּמֵּר
  choice: 人谨守
  rationale: 尼法勒未完成式在此具有非人称、近似被动的用法。汉语若直译为“被谨守”较生硬，译作“人谨守”自然地表达这些律例一直受到遵行，同时不另行指定主语。
- source_word: חֻקּוֹת עָמְרִי
  choice: 暗利的律例
  rationale: חֻקּוֹת 带有规定、法令的正式色彩；“律例”既保留这一语义，也适合先知对王室政策的控诉。עָמְרִי 按通行中文圣经人名译作“暗利”。
- source_word: מַעֲשֵׂה בֵית אַחְאָב
  choice: 亚哈家的种种作为
  rationale: מַעֲשֵׂה 可指行为、作为或惯行；“种种作为”保留其广度。“亚哈家”保留 בֵית 的家族、王朝含义。
- source_word: וַתֵּלְכוּ בְּמֹעֲצוֹתָם
  choice: 你们照着他们的计谋行事
  rationale: “照着……行事”用自然现代汉语传达“行走在……之中”的行为隐喻；מֹעֲצוֹתָם 译为“他们的计谋”，保留其谋划、方略的含义及贬义语境。
- source_word: לְמַעַן תִּתִּי אֹתְךָ לְשַׁמָּה
  choice: 因此我要使你成为荒凉之地
  rationale: לְמַעַן 在此可表示目的或结果；“因此”较自然地呈现行为与审判的结果关系，而不把人的犯罪说成上帝命令人犯罪的目的。אֹתְךָ 为单数，故保留“你”，指向被人格化的城或群体。
- source_word: וְיֹשְׁבֶיהָ לִשְׁרֵקָה
  choice: 使其中的居民成为人嗤笑的对象
  rationale: שְׁרֵקָה 指人面对废墟时发出的嘘声、嗤声。“嗤笑的对象”在现代汉语中清楚传达公开嘲弄，具体文化意象另见脚注。
- source_word: וְחֶרְפַּת עַמִּי תִּשָּׂאוּ
  choice: 你们也必担当我子民的羞辱
  rationale: חֶרְפָּה 可指羞辱、耻辱或责骂；“担当……的羞辱”保留 תִּשָּׂאוּ“背负、承受”的意象，并维持属格结构的歧义。
theological_decisions:
- issue: “我子民的羞辱”（חֶרְפַּת עַמִּי）的所指和关系
  choice: 我子民的羞辱
  alternative: 对我子民的羞辱／我子民所受的羞辱／我子民带来的耻辱
  rationale: 希伯来语组合简洁，既可能指临到上帝子民的羞辱，也可能指与他们有关或由他们承担的耻辱。正文保留紧凑的属格表达，不替读者决定其方向。
- issue: לְמַעַן 所表达的目的或结果
  choice: 因此我要使你成为荒凉之地
  alternative: 好使我把你变为荒凉之地
  rationale: 该连接词通常表达目的，也可在此语境中突出行为导致审判的结果。“因此”避免暗示百姓犯罪是上帝促成审判的工具，同时仍明确将他们效法暗利、亚哈与随后的审判相连。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“律例”“担当”保留先知话语的正式力度；其余句法尽量自然。正文通过单数“你”与复数“你们”的转换，保留原文先把城或群体视为一个整体、随后又向众人说话的变化。所有脚注标记均已置入正文。
