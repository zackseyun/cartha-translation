revisions:
- from: 人谨守暗利的律例和亚哈家的种种作为；你们照着他们的计谋行事，因此我要使你成为荒凉之地，使其中的居民成为人嗤笑的对象[a]；你们也必担当我子民的羞辱。[b]
  to: 暗利的律例仍被遵守，亚哈家的一切作为也都被效法；你们照着他们的谋略行事，以致我要使你成为荒凉，使其中的居民成为人嗤笑的对象[a]；你们必担当我子民的羞辱。[b]
  rationale: 修订首句，使汉语明确表达暗利的律例受到遵守、亚哈家的作为受到效法，并保留原文的持续性控诉。以“谋略”覆盖“计谋/方针”的语义范围；以“以致”较贴近לְמַעַן的目的—结果关系；删去“之地”以免将“荒凉”过度具体化。末句及两则脚注保留原有的歧义与文化说明，脚注锚点均与正文对应。
