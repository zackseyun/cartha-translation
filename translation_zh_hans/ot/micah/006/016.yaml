    issue: 首句“人谨守暗利的律例和亚哈家的种种作为”句法不够清楚。
    rationale: 希伯来文以单数、近被动的“被遵守”统摄后面的两项；现代汉语宜分别明示“律例被遵守”及“作为被效法”，以免“作为”看似只是被‘谨守’的并列宾语。
  - severity: low
    issue: “因此”未充分保留לְמַעַן的目的—结果衔接。
    rationale: 可用“以致”表达此处行为与宣告审判之间的结果性联系，同时避免将其处理成单纯逻辑结论。
  - severity: low
    issue: “荒凉之地”较原文具体。
    rationale: לְשַׁמָּה指荒凉、凄凉可怖的景况；译作“成为荒凉”保留其开放性。
