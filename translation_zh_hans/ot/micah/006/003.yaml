  text: עַמִּ֛/י מֶה עָשִׂ֥יתִי לְ/ךָ֖ וּ/מָ֣ה הֶלְאֵתִ֑י/ךָ עֲנֵ֥ה בִּֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/006/003.yaml
  text: My people[b][a], what have I done to you? How have I wearied you? Answer me.
translation:
  language: zh_hans
  text: “我的子民，我向你做了什么？我哪里使你疲乏了[a]？回答我吧[b]！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“使你不堪重负了”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“指证我吧”或“作证反驳我吧”；这种译法反映本段可能具有法庭对质的背景。
    reason: alternative_reading
lexical_decisions:
- source_word: עַמִּי
  choice: 我的子民
  rationale: 这是带第一人称单数后缀的呼语，表达上帝与以色列之间亲近而具约的关系；“我的子民”在现代汉语中自然、庄重，也保留了集体称谓。
- source_word: מֶה עָשִׂיתִי לְךָ
  choice: 我向你做了什么
  rationale: 忠实表达疑问词、עשה的第一人称单数完成式及指向听者的介词ל；这里是回顾上帝对其子民的作为，并以反问要求回应。
- source_word: וּמָה הֶלְאֵתִיךָ
  choice: 我哪里使你疲乏了
  rationale: לאה的使役式表示“使疲乏、使厌倦”；将形式上的“而什么”按汉语反问习惯译作“哪里”，保留对方式或缘由的追问。
- source_word: עֲנֵה בִּי
  choice: 回答我吧
  rationale: ענה的命令式在当前语境中首先是要求对方作答；语气词“吧”使汉语命令自然，同时仍保持郑重的挑战意味。介词ב可能带有“针对我作证”的司法色彩，另见脚注。
theological_decisions:
- issue: 上帝与其子民对质时的立约及司法语气
  choice: 正文保留直接而带挑战性的问答形式，不明加“控告”或“作证”等法庭术语。
  alternative: 将“回答我吧”译作“你可以指证我”或“作证反驳我”。
  rationale: 本段整体可能构成立约诉讼场景，但本节的עֲנֵה בִּי本身既可理解为一般的“回答我”，也可能具有“针对我作证”的司法意味。正文不消除这种张力，脚注说明另一种读法。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“我的子民”体现先知话语中的立约称呼；两个反问保持简洁和直接。“回答我吧”既自然，又不在正文中过度限定潜在的司法语境。
