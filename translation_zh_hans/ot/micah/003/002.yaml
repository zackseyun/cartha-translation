  terminology: “善／恶”准确保留原文的伦理对立；“皮”“肉”“骨头”准确对应身体意象。“剥下”适合此处强行夺取、剥离的画面。脚注所给“强行扯下”是可行的词汇性替代，并说明了原词的抢夺、强取含义。
