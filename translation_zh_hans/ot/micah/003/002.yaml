  text: שֹׂ֥נְאֵי ט֖וֹב וְ/אֹ֣הֲבֵי רעה גֹּזְלֵ֤י עוֹרָ/ם֙ מֵֽ/עֲלֵי/הֶ֔ם וּ/שְׁאֵרָ֖/ם מֵ/עַ֥ל עַצְמוֹתָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/003/002.yaml
  text: you who hate good and love evil[a], who strip their skin from off them and their flesh from off their bones—
translation:
  language: zh_hans
  text: 你们这些恨善爱恶的人，竟从他们身上剥下皮[a]，又从他们骨头上剥下肉——
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “剥下”也可译作“强行扯下”；原词含抢夺、强取之意。
    reason: lexical_alternative
lexical_decisions:
- source_word: שֹׂנְאֵי טוֹב
  choice: 恨善
  rationale: 两个词构成简洁的分词短语，承接上文对领袖的直接斥责；“恨善”保留希伯来文凝练的道德判断。
- source_word: וְאֹהֲבֵי רעה
  choice: 爱恶
  rationale: 与“恨善”形成严整对照；רעה在此指道德上的恶，而不只是伤害或灾祸。
- source_word: גֹּזְלֵי
  choice: 剥下
  rationale: 该词有抢夺、强行取走之意；与皮、肉和骨头连用时，“剥下”既自然又保留暴力掠夺的画面。
- source_word: עוֹרָם מֵעֲלֵיהֶם
  choice: 从他们身上剥下皮
  rationale: 保留身体部位和空间关系；中文省去第二个“他们的”，避免累赘而不损失所指。
- source_word: וּשְׁאֵרָם מֵעַל עַצְמוֹתָם
  choice: 又从他们骨头上剥下肉
  rationale: שְׁאֵר在皮与骨头的语境中指肉体的肉；重复“剥下”体现同一分词统摄两个并列宾语，并保存残酷的宰割意象。
theological_decisions:
- issue: 以剥皮剔肉的暴力画面描写腐败领袖
  choice: 保留皮、肉、骨头的具体意象，将其呈现为对残酷压迫的震撼性控诉
  alternative: 意译为“彻底剥削他们”
  rationale: 原文刻意采用近乎宰割人的比喻；抽象化会削弱先知谴责的力度，也会过早替读者解释比喻。
- issue: 分词短语与上文的句法关系
  choice: 译作“你们这些……的人”，视为承接上文受斥责者的直接称呼
  alternative: 译作独立陈述：“他们恨善爱恶”
  rationale: 复数分词在上下文中自然承接上一节对首领和官长的呼告；直接称呼也保留原文的责问力度。
translation_notes:
  register: 采用现代、庄重而易懂的先知性语言。“恨善爱恶”保持原文简练对仗；“竟”以自然中文显出控诉语气，但不改变命题内容。句末破折号表明本句的宰割意象在下一节继续展开。
