  source_fidelity: 忠实呈现希伯来文对受斥责者的直接称呼，以及“恨善爱恶”的道德对照。“从他们身上剥下皮，又从他们骨头上剥下肉”保留了גזל所表达的强行夺取和原文皮、肉、骨头的骇人并列意象；没有把它弱化为抽象的“剥削”。句末破折号也恰当保留与下一节的延续关系。
