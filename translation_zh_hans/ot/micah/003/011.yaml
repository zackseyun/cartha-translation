  text: רָאשֶׁ֣י/הָ בְּ/שֹׁ֣חַד יִשְׁפֹּ֗טוּ וְ/כֹהֲנֶ֨י/הָ֙ בִּ/מְחִ֣יר יוֹר֔וּ וּ/נְבִיאֶ֖י/הָ בְּ/כֶ֣סֶף יִקְסֹ֑מוּ וְ/עַל יְהוָה֙ יִשָּׁעֵ֣נוּ לֵ/אמֹ֔ר הֲ/ל֤וֹא יְהוָה֙ בְּ/קִרְבֵּ֔/נוּ לֹֽא תָב֥וֹא עָלֵ֖י/נוּ רָעָֽה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/003/011.yaml
  text: Her leaders judge for a bribe[a], and her priests teach for a price, and her prophets practice divination for silver; yet they lean on Yahweh, saying[b], “Is not Yahweh in our midst? No disaster will come upon us.”
translation:
  language: zh_hans
  text: 她的首领为贿赂审判；她的祭司为报酬教导；她的先知为银钱占卜。然而，他们却倚靠雅威[a]，说：“雅威不是在我们中间吗？灾祸不会临到我们。”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “倚靠”也可译作“信赖”；原文动词带有靠着某人获得支撑的形象。
    reason: lexical_alternative
  - marker: b
    text: “灾祸”也可译作“灾难”或“祸患”；这里指将要临到的灾害或审判。
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאשֶׁיהָ
  choice: 她的首领
  rationale: רֹאשׁ的复数在此指城中掌权的官长；“首领”自然地表达其政治和司法身份，并保留阴性单数后缀所指的锡安/耶路撒冷。
- source_word: בְּשֹׁחַד יִשְׁפֹּטוּ
  choice: 收受贿赂才审判
  rationale: שֹׁחַד明确指贿赂；介词בְּ在此表明审判受贿赂驱动。“才”突出唯利是图的腐败情形。
- source_word: בִּמְחִיר יוֹרוּ
  choice: 为报酬才教导
  rationale: מְחִיר是价钱或报酬；ירה的使役式在祭司语境中指教导、训诲。译文保留其宗教教导职能，同时呈现商业化的腐败。
- source_word: בְּכֶסֶף יִקְסֹמוּ
  choice: 为了银钱而占卜
  rationale: כֶּסֶף可指银子或钱财，“银钱”兼顾具体意象和货币意义；קסם指占卜，不泛化为普通预言。
- source_word: וְעַל־יְהוָה יִשָּׁעֵנוּ
  choice: 然而，他们竟倚靠雅威
  rationale: שׁען的被动词干含倚靠、靠着得支持之意；“倚靠”保留身体倚靠的隐喻。“然而……竟”传达他们一面腐败、一面自恃有神同在的强烈反差。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见音译呈现四字神名，区别于作为称号的“主”。
- source_word: רָעָה
  choice: 灾祸
  rationale: 此处指将临的灾难或审判，并非道德意义上的邪恶；“灾祸”保留其广义祸患色彩。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华／上主
  rationale: 原文直接使用四字神名；音译“雅威”保留其专名性质，不以称号代替。
- issue: 末句רָעָה的语义
  choice: 灾祸
  alternative: 邪恶／灾难
  rationale: 上下文是领袖否认神的审判会临到，因此采用表示祸患的“灾祸”，避免误解为道德之恶，同时不把它过度限定为某一种灾难。
- issue: וְ的篇章关系
  choice: 然而，他们竟
  alternative: 并且他们
  rationale: 原文连词本身可作普通连接，但上下文显出腐败行为与自称倚靠雅威之间的讽刺性反差；译文使该语用关系清楚，却不改变命题内容。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。三个分句保持平行，并用“才／而”呈现官长、祭司和先知因钱财履职的腐败。引语使用自然的反问与断言，传达其虚假的安全感。
