  text: אָ֚ז יִזְעֲק֣וּ אֶל יְהוָ֔ה וְ/לֹ֥א יַעֲנֶ֖ה אוֹתָ֑/ם וְ/יַסְתֵּ֨ר פָּנָ֤י/ו מֵ/הֶם֙ בָּ/עֵ֣ת הַ/הִ֔יא כַּ/אֲשֶׁ֥ר הֵרֵ֖עוּ מַעַלְלֵי/הֶֽם־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/micah/003/004.yaml
  text: Then they will cry out to Yahweh[a], but he will not answer them; he will hide his face from them at that time, because they made their deeds evil.
translation:
  language: zh_hans
  text: 那时，他们必向耶和华呼求，他却不应允他们；那时，他必掩面不顾他们，因为他们使自己的行为变得邪恶。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因为他们行事邪恶。”
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: 那时
  rationale: 表示前述罪行所招致审判的时刻和后果；现代汉语中简洁自然。
- source_word: יִזְעֲקוּ
  choice: 必……呼求
  rationale: זעק指人在危难中迫切求助；“呼求”既保留强烈语气，也符合圣经语境。
- source_word: אֶל יְהוָה
  choice: 向耶和华
  rationale: אֶל表示动作的方向；专名יהוה音译为“耶和华”，使普通中文读者能够识别此处为以色列上帝的专名。
- source_word: וְלֹא יַעֲנֶה אוֹתָם
  choice: 他却不应允他们
  rationale: 连词在上下文中有转折作用；ענה在祈求语境中译作“应允”自然，并保留求告而得不到回应的意味。
- source_word: וְיַסְתֵּר פָּנָיו מֵהֶם
  choice: 他必向他们掩面
  rationale: 保留希伯来文“隐藏面”的形象性惯用语，表达上帝不再垂顾，而不将其解释性地改写。
- source_word: בָּעֵת הַהִיא
  choice: 那时
  rationale: 自然表达所指的审判时刻；与句首“那时”呼应，保留原文的时间标记。
- source_word: כַּאֲשֶׁר
  choice: 因为
  rationale: 此处最可能引出审判的原因；“因为”清楚表达因果关系。
- source_word: הֵרֵעוּ מַעַלְלֵיהֶם
  choice: 他们使自己的行为变得邪恶
  rationale: 保留רעע使役形的因果力度及מעללים这一明确宾语，没有简化成静态的“他们的行为是恶的”。
theological_decisions:
- issue: 上帝掩面的拟人性意象
  choice: 在正文保留“他必向他们掩面”
  alternative: 他必转脸不顾他们／不再施恩给他们
  rationale: 原文使用具有盟约和审判色彩的形象表达。保留意象可维持经文的神学质感，避免把它缩减为单一解释。
- issue: 末句的因果关系及使役语气
  choice: 因为他们使自己的行为变得邪恶
  alternative: 因为他们行事邪恶／照着他们作恶的行为
  rationale: 正文采用因果理解，同时尽量保留使役动词和“行为”这一宾语；脚注注明另一种较自然且可能的理解，以保存措辞上的张力。
translation_notes:
  register: 采用现代、庄重且易懂的标准普通话。“呼求”“应允”“掩面”保留经文的力度和意象；末句略带形式对应，以呈现希伯来文使役结构。
