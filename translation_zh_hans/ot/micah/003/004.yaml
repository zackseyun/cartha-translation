review_pass:
  verdict: revise
  source_fidelity: 整体准确呈现了审判的时序、向耶和华迫切呼求而不蒙回应，以及行为邪恶作为原因。惟“向他们掩面”在现代汉语中容易理解为“蒙脸”，未清楚表达希伯来语“从他们面前隐藏自己的脸／不顾他们”的惯用意象；改为“掩面不顾他们”可保留意象并明确其对象。
  naturalness: “必向他们掩面”不够合乎现代汉语惯用表达，且语义略显含混。“必掩面不顾他们”庄重、自然，也适合先知书的审判语体。末句“使自己的行为变得邪恶”虽可反映使役形，但稍显生硬；保留亦尚可，因其有意传达原文措辞张力。
  terminology: “耶和华”“呼求”“应允”均恰当。“掩面不顾”既保留神隐藏脸面的圣经意象，也避免将其过度释义为单纯“不施恩”。脚注所列“行事邪恶”是可接受的自然表达。
  issues:
  - severity: medium
    issue: “他必向他们掩面”未充分表达“从他们面前隐藏自己的脸”。
    rationale: “掩面”在现代汉语通常指以手或物遮脸，也可表示羞惭、悲伤；加上“向他们”仍不够清楚地体现原文מֵהֶם（“离开他们／不顾他们”）及其审判语境。改为“他必掩面不顾他们”保留形象并使关系明确。
  revised_text: 那时，他们必向耶和华呼求，他却不应允他们；那时，他必掩面不顾他们，因为他们使自己的行为变得邪恶。[a]
  revised_footnotes:
