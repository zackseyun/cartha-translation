revisions:
- from: 那时，他们必向耶和华呼求，他却不应允他们；那时，他必向他们掩面，因为他们使自己的行为变得邪恶。[a]
  to: 那时，他们必向耶和华呼求，他却不应允他们；那时，他必掩面不顾他们，因为他们使自己的行为变得邪恶。[a]
  rationale: 仅修改“掩面”短语，使其在现代标准汉语中明确表达上帝在审判中不顾他们，同时保留原文的拟人性意象。其余译文忠实反映原文的时间重复、呼求与不回应的转折，以及末句带有使役色彩的措辞。
