id: MIC.3.8
reference: Micah 3:8
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/אוּלָ֗ם אָנֹכִ֞י מָלֵ֤אתִי כֹ֨חַ֙ אֶת ר֣וּחַ יְהוָ֔ה וּ/מִשְׁפָּ֖ט וּ/גְבוּרָ֑ה לְ/הַגִּ֤יד לְ/יַֽעֲקֹב֙ פִּשְׁע֔/וֹ וּ/לְ/יִשְׂרָאֵ֖ל חַטָּאתֽ/וֹ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/micah/003/008.yaml
  text: But as for me[a], I am filled with power, with the Spirit of Yahweh, and with justice and might[b], to declare to Jacob his transgression and to Israel his sin.
translation:
  language: zh_hans
  text: 但至于我，我借着耶和华的灵满有力量[a]，又有公正和勇力，为要向雅各宣告他的悖逆[b]，向以色列宣告他的罪。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我满有力量、耶和华的灵、公正和勇力。”希伯来语的句法既可把“耶和华的灵”理解为力量的来源，也可把这些词看作并列的内容。
    reason: alternative_reading
  - marker: b
    text: “悖逆”也可译作“过犯”，原词常含反抗神的意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאוּלָם אָנֹכִי
  choice: 但至于我
  rationale: 保留强烈转折与第一人称强调，与上文腐败的领袖和先知形成鲜明对照。
- source_word: מָלֵאתִי כֹחַ אֶת רוּחַ יְהוָה
  choice: 我因耶和华的灵充满力量
  rationale: 将“耶和华的灵”理解为先知得着力量的来源；这种读法符合先知受神之灵赋能的语境，同时以脚注保留希伯来语句法的另一种可能。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的神名译法，明确这是专名而非普通称号。
- source_word: וּמִשְׁפָּט
  choice: 又有公正
  rationale: 此处指先知辨明并秉持正义的能力；“公正”自然传达其伦理与司法内涵。
- source_word: וּגְבוּרָה
  choice: 和勇力
  rationale: 既表达面对权势、公开斥责罪恶所需的力量与勇气，又避免与前面的“力量”完全重复。
- source_word: לְהַגִּיד
  choice: 宣告
  rationale: 符合先知公开传达神信息的正式语境。
- source_word: פִּשְׁעוֹ
  choice: 他的悖逆
  rationale: פשע常含蓄意反抗、背叛神之意；“悖逆”比泛指过错的词更能呈现其严重性。
- source_word: חַטָּאתוֹ
  choice: 他的罪
  rationale: 使用清楚、常用的道德与宗教用语，并保留与“悖逆”的平行和区别。
theological_decisions:
- issue: רוּחַ יְהוָה 是指神的灵，还是一种来自神的非人格力量
  choice: 耶和华的灵
  alternative: 耶和华所赐的精神／气息
  rationale: 在先知蒙赋能的语境中，该短语自然指神的灵；中文无需借助英文式大小写，也不把经文缩减为非人格冲动。
- issue: כֹחַ אֶת רוּחַ יְהוָה 的句法关系
  choice: 力量由耶和华的灵而来
  alternative: 力量、耶和华的灵、公正和勇力并列为先知所充满的内容
  rationale: 希伯来语序允许两种理解。正文采用来源性读法，因其在语境中自然顺畅；脚注明确保留并列读法，避免消除原文歧义。
- issue: “雅各”与“以色列”的所指
  choice: 保留两个盟约群体名称，不扩写
  alternative: 雅各家／以色列家
  rationale: 原文没有“家”，两个名称在诗性平行中共同指向神的子民，直译可保留其修辞效果。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“但至于我”突出上下文的对比；“好向……宣告”保留目的结构。正文避免过度古雅，同时维持先知性宣告的力度。
