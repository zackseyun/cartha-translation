id: MIC.3.1
reference: Micah 3:1
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וָ/אֹמַ֗ר שִׁמְעוּ נָא֙ רָאשֵׁ֣י יַעֲקֹ֔ב וּ/קְצִינֵ֖י בֵּ֣ית יִשְׂרָאֵ֑ל הֲ/ל֣וֹא לָ/כֶ֔ם לָ/דַ֖עַת אֶת הַ/מִּשְׁפָּֽט־־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/003/001.yaml
  text: 'And I said[a], “Hear now, heads of Jacob and rulers of the house of Israel: is it not for you to know justice?”'
translation:
  language: zh_hans
  text: 我说：“雅各的首领、以色列家的官长啊，现在你们要听！你们岂不应当明白公正[a]吗？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“审判”。希伯来语 mishpat 可指司法审判、公正，或正当之事。
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמַר
  choice: 我说
  rationale: 未用汉语中显得生硬的“而我说”；上下文承接关系可由语序自然体现，也不把 waw-consecutive 过度解释为严格的时间先后。
- source_word: שִׁמְעוּ נָא
  choice: 现在你们要听
  rationale: “听”保留命令语气；נָא 在先知责问中主要加强迫切感，译作“现在……要”比礼貌性的“请”更合适。
- source_word: רָאשֵׁי יַעֲקֹב
  choice: 雅各的首领
  rationale: רֹאשׁ 在此为领袖之义。现代汉语若直译“头”会造成不自然或误解，因此采用自然庄重的“首领”，并保留“雅各”这一群体名称。
- source_word: וּקְצִינֵי בֵּית יִשְׂרָאֵל
  choice: 以色列家的官长
  rationale: קָצִין 指掌权者、官员或统治者；“官长”适合这里的治理和司法语境。“以色列家”保留原文正式的民族—盟约称谓。
- source_word: הֲלוֹא לָכֶם
  choice: 你们岂不应当
  rationale: הֲלוֹא 所引反问期待肯定回答；לָכֶם 在此表达职责归属。汉语“岂不应当”清楚传达领袖负有此责任。
- source_word: לָדַעַת
  choice: 明白
  rationale: יָדַע 基本义是“知道”，但此处涉及官长对其职责的实际认识；“明白”在现代汉语中较自然，同时没有把它强化为具体的执行行为。
- source_word: הַמִּשְׁפָּט
  choice: 公正
  rationale: מִשְׁפָּט 可指审判、司法裁断、公正或正当之事。此处责备掌权者，采用“公正”能兼顾公共治理中的伦理和司法内涵，并以脚注保留“审判”的可能。
theological_decisions:
- issue: 领导与司法语境中 מִשְׁפָּט 的译法
  choice: 公正
  alternative: 审判
  rationale: 上下文聚焦以色列领袖应当认识并维护正当秩序。“公正”较完整地表达其公共、伦理及司法责任；但原词也可指“审判”，故不在正文中排除该义，而以脚注明示。
translation_notes:
  register: 采用现代、庄重而易懂的先知话语。“啊”标示呼语，“现在你们要听”传达迫切命令；反问句保留原文责备和要求承担职责的力度。
