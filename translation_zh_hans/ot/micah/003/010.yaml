  text: who builds Zion with bloodshed and Jerusalem with injustice[a].
translation:
  language: zh_hans
  text: 你们靠流血[a]建造锡安，靠不义建造耶路撒冷。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “流血”或译“血”。希伯来语原文用复数形式的“血”，常指流血杀人或所负的血债。
    reason: lexical_alternative
lexical_decisions:
- source_word: בֹּנֶה
  choice: 你们……建造
  rationale: 阳性单数分词承接上一节对首领和官长的复数呼告，并与下一分句共同描述他们的作为。中文用复数主语“你们”使上下文衔接自然；译作“建造”保留其建城意象。
- source_word: צִיּוֹן
  choice: 锡安
  rationale: 采用现代中文圣经和一般读者熟悉的标准地名译法。
- source_word: בְּדָמִים
  choice: 以流血
  rationale: 希伯来语复数“血”常指流血杀人或血债；“以流血”既表达手段，也保留先知话语简洁有力的意象。
- source_word: וִירוּשָׁלִַם
  choice: 耶路撒冷
  rationale: 采用通行的现代中文地名译法，并在句法中保留与锡安对应的并列结构。
- source_word: בְּעַוְלָה
  choice: 以不义
  rationale: עַוְלָה表示不公、不义或邪恶；本章聚焦统治者在社会和司法层面的败坏，“不义”兼具广度和庄重语体。
- source_word: בֹּנֶה … וִירוּשָׁלִַם
  choice: 建造……建立
  rationale: 原文第二分句省略动词，由第一分句的分词统摄。中文第二处用近义词“建立”，既补足自然句法，又保留平行关系，且避免机械重复。
theological_decisions:
- issue: 先知控诉中“以血建城”的性质
  choice: 理解为领袖以流血和不义的手段建立、壮大圣城
  alternative: 按字面译作“用血建造”，不说明这是流血或血债的惯用表达
  rationale: 复数 דָמִים 在此语境通常表示流血事件或血债，而非把血当作建筑材料。正文译出惯用含义，同时脚注保留较贴近形式的译法。
- issue: 分词主语的指向
  choice: 依上文将隐含主语显明为“你们”，即锡安的首领和以色列家的官长
  alternative: 保留单数形式，译作“那建造锡安的人”或“他建造锡安”
  rationale: 上一节以复数命令“你们要听”直接斥责众首领；本节分词虽为阳性单数，却可在集合性或分配性控诉中描述这一群体。中文显出“你们”更自然，也不改变控诉对象。
translation_notes:
  register: 采用现代、庄重而直接的先知性语体。两组“以……建造／建立……”保持原文平行结构；“流血”与“不义”准确传达暴力和社会司法败坏。脚注标记已置于正文句末。
