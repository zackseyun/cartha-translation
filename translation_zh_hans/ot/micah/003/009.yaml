  text: שִׁמְעוּ נָ֣א זֹ֗את רָאשֵׁי֙ בֵּ֣ית יַעֲקֹ֔ב וּ/קְצִינֵ֖י בֵּ֣ית יִשְׂרָאֵ֑ל הַֽ/מֲתַעֲבִ֣ים מִשְׁפָּ֔ט וְ/אֵ֥ת כָּל הַ/יְשָׁרָ֖ה יְעַקֵּֽשׁוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/003/009.yaml
  text: 'Hear this[a], please, heads of the house of Jacob and rulers of the house of Israel[b], who detest justice and make crooked all that is straight:'
translation:
  language: zh_hans
  text: 请听这话[a]，雅各家的首领、以色列家的官长啊！你们厌恶公正，把一切正直的事[b]都扭曲：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“现在要听这话”。נָא既可表达恳请，也可表达急迫。
    reason: lexical_alternative
  - marker: b
    text: 或译“一切正确的事”。原文采用“正直（平直）”与“扭曲（使弯曲）”相对的形象。
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעוּ נָא זֹאת
  choice: 请听这话
  rationale: שִׁמְעוּ是复数命令式，זֹאת是其宾语；נָא可表达恳请或急迫。“请听这话”自然保留先知呼吁的语气，又不把נָא仅仅解释为时间性的“现在”。
- source_word: רָאשֵׁי בֵּית יַעֲקֹב
  choice: 雅各家的首领
  rationale: רָאשֵׁי字面为“头”，在此指群体的领袖；“首领”在现代汉语中清楚庄重，并保留“雅各家”的群体与盟约称谓。
- source_word: וּקְצִינֵי בֵּית יִשְׂרָאֵל
  choice: 以色列家的官长
  rationale: קְצִינֵי可指统治者、官员或首长；上下文涉及司法与社会治理，“官长”既符合职责语境，也与前句“首领”形成对应。
- source_word: הַמֲתַעֲבִים מִשְׁפָּט
  choice: 厌恶公正
  rationale: תעב表达强烈嫌恶；מִשְׁפָּט在先知对掌权者的谴责中指司法及社会层面的公正。“厌恶公正”简洁有力。
- source_word: וְאֵת כָּל הַיְשָׁרָה יְעַקֵּשׁוּ
  choice: 把一切正直的都扭曲
  rationale: הַיְשָׁרָה指正直、平直之物，יְעַקֵּשׁוּ指使之弯曲或扭曲；此译保留“正直—扭曲”的形象性对照，同时符合现代汉语表达。
theological_decisions:
- issue: 雅各与以色列的群体称谓
  choice: 雅各家……以色列家
  alternative: 雅各的人民……以色列的人民
  rationale: 原文两处都明确使用בֵּית（家）；保留“家”可呈现诗句的平行结构和共同体含义，而不额外限定这两个称谓之间的关系。
- issue: מִשְׁפָּט的语义范围
  choice: 公正
  alternative: 审判
  rationale: 本节谴责治理者厌弃应有的正直秩序，含司法及社会伦理层面；“公正”保留较宽的语义范围，不将其局限为一次具体审判。
translation_notes:
  register: 采用现代、庄重且适合公开诵读的普通话。“首领……官长”保留平行结构；“正直……扭曲”重现希伯来文的空间隐喻。句末冒号表明责备仍在下文继续。
