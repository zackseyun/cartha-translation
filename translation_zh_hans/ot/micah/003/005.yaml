  to: 耶和华论到那些使我子民走迷的先知，如此说：他们用牙齿咬[a]，就呼喊“平安”；谁若不把东西放进他们嘴里[b]，他们就为攻击那人而备战[c]。
  rationale: 修订恢复原文“咬”与“呼喊平安”的直接并列，而不把条件性解释写入正文；同时明确末句是针对拒绝供给者的备战。脚注保留食物或报酬的可能含义，以及“使战争分别为圣”的修辞与替代译法。
