source:
  edition: WLC
  text: כֹּ֚ה אָמַ֣ר יְהוָ֔ה עַל הַ/נְּבִיאִ֖ים הַ/מַּתְעִ֣ים אֶת עַמִּ֑/י הַ/נֹּשְׁכִ֤ים בְּ/שִׁנֵּי/הֶם֙ וְ/קָרְא֣וּ שָׁל֔וֹם וַ/אֲשֶׁר֙ לֹא יִתֵּ֣ן עַל פִּי/הֶ֔ם וְ/קִדְּשׁ֥וּ עָלָ֖י/ו מִלְחָמָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/003/005.yaml
  text: Thus says Yahweh concerning the prophets who lead my people astray[a], who bite with their teeth and cry, “Peace,” but against anyone who does not put something into their mouths[d][c][b], they consecrate war.
translation:
  language: zh_hans
  text: 耶和华论到那些使我子民走迷的先知，如此说：他们用牙齿咬[a]，就呼喊“平安”；谁若不把东西放进他们嘴里[b]，他们就为攻击那人而备战[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“用牙齿咬”。这可能描写这些先知的掠夺性；在得到食物或报酬时，他们就向供给他们的人宣告平安。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“不放在他们口上”。意思可能是不给他们食物或报酬。
    reason: lexical_alternative
  - marker: c
    text: 原文直译为“为攻击他而使战争分别为圣”。这里以带祭仪色彩的语言表达郑重备战；也可译作“向他宣告圣战”。
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的神圣名传统译法，明确对应希伯来文的立约之名。
- source_word: עַל הַנְּבִיאִים
  choice: 论到那些……先知
  rationale: עַל在这里引出神谕所针对的对象；“论到”既贴合句法，也由后文自然表达谴责语气。
- source_word: הַמַּתְעִים אֶת עַמִּי
  choice: 使我子民走迷
  rationale: 保留תעה使役分词的主动致使含义，也保留“走迷”的路径意象。
- source_word: הַנֹּשְׁכִים בְּשִׁנֵּיהֶם
  choice: 有东西可咬时
  rationale: 保留“咬”的具体形象，并结合后句看出其条件性；不在正文中直接限定为收受贿赂。
- source_word: וְקָרְאוּ שָׁלוֹם
  choice: 就宣告“平安”
  rationale: קרא在此表示公开宣告；שָׁלוֹם可涵盖平安、安稳与福祉，正文保留凝练的传统词语“平安”。
- source_word: וַאֲשֶׁר לֹא יִתֵּן עַל פִּיהֶם
  choice: 谁若不把东西送到他们嘴边
  rationale: 尽量保留希伯来文“放在他们口上”的口食意象，同时用“送到嘴边”形成自然中文；“东西”补出原文省略的宾语而不把它窄化为钱财。
- source_word: וְקִדְּשׁוּ עָלָיו מִלְחָמָה
  choice: 他们就预备攻击他
  rationale: קדשׁ战争在此为备战惯用语，含有把战争分别出来、郑重筹备之意；中文正文译其语境功能，以避免“使战争成圣”的误解，祭仪色彩由脚注说明。
theological_decisions:
- issue: 腐败先知的经济动机及掠夺意象
  choice: 正文保留“咬”和“送到嘴边”的连贯口食意象，但不明说是收钱或受贿
  alternative: 直接译作“谁供养他们，他们就报平安；谁不给他们报酬，他们就宣战”
  rationale: 上下文强烈暗示信息随所得而改变，但原文并未明确把所给之物限定为金钱。保留形象可避免把谴责缩窄为某一种现代交易。
- issue: קִדְּשׁוּ מִלְחָמָה的祭仪性战争用语
  choice: 正文译为“预备攻击”，脚注保留字面和“宣告圣战”的可能表达
  alternative: 正文译为“使战争成圣”或“向他宣告圣战”
  rationale: 该搭配指郑重筹备战争，确有祭仪色彩；但直译在现代中文中容易被理解为认可战争的神圣性。正文传达行动，脚注保存修辞张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“如此说”保留先知宣告的正式语气；以分号呈现先知因所得不同而给出相反信息的鲜明对照。所有正文脚注标记均按首次相关位置顺序列出。
