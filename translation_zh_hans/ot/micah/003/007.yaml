  text: וּ/בֹ֣שׁוּ הַ/חֹזִ֗ים וְ/חָֽפְרוּ֙ הַ/קֹּ֣סְמִ֔ים וְ/עָט֥וּ עַל שָׂפָ֖ם כֻּלָּ֑/ם כִּ֛י אֵ֥ין מַעֲנֵ֖ה אֱלֹהִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/003/007.yaml
  text: The seers will be put to shame[a], and the diviners will be disgraced; all of them will cover their lips, because there is no answer from God.
translation:
  language: zh_hans
  text: 先见必蒙羞，占卜者必受辱；他们全都要遮住上唇[a]，因为没有从上帝而来的回答。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“遮住嘴唇”或“遮住胡须”；这可能是表示羞耻、哀悼或不洁的动作。
    reason: 保留 שָׂפָם 可指上唇、嘴唇或胡须区域的解剖部位歧义，以及该动作象征意义的不确定性。
lexical_decisions:
- source_word: וּבֹשׁוּ
  choice: 必蒙羞
  rationale: בוש表示羞愧或蒙受羞辱；“蒙羞”既保留结果意味，也符合先知审判宣告的语境。
- source_word: הַחֹזִים
  choice: 先见
  rationale: חֹזִים指领受异象、宣称能看见启示的人。“先见”是简洁而有传统依据的术语，并未将其直接等同于真先知。
- source_word: וְחָפְרוּ
  choice: 必受辱
  rationale: חפר在此表示羞惭、受辱；“受辱”与前句“蒙羞”形成自然平行，也凸显公开失去颜面的意味。
- source_word: הַקֹּסְמִים
  choice: 占卜者
  rationale: קסם特指占卜；“占卜者”直接、清楚，并保留该词在本语境中的负面宗教含义。
- source_word: וְעָטוּ עַל שָׂפָם
  choice: 要遮住上唇
  rationale: 该短语字面涉及遮盖嘴唇、上唇或髭须所在之处。“遮住上唇”保留希伯来语的身体意象，不在正文中断定这一动作究竟表示羞耻、哀悼还是不洁。
- source_word: כֻּלָּם
  choice: 他们全都
  rationale: 保留附加代词所加强的整体性，明确指出先见和占卜者无一例外。
- source_word: כִּי
  choice: 因为
  rationale: 此处引出他们蒙羞受辱的原因，现代汉语用“因为”最清楚自然。
- source_word: אֵין מַעֲנֵה אֱלֹהִים
  choice: 没有从上帝而来的回答
  rationale: מַעֲנֵה意为回答或回应；这一表达保留希伯来语名词句的形式和来源关系，不额外说明上帝为何不回答。
- source_word: אֱלֹהִים
  choice: 上帝
  rationale: 虽然词形为复数形式，但此处语境中的意义为单数，指那位没有向这些人作出回应的真神。
theological_decisions:
- issue: 末句应理解为上帝保持沉默，还是根本没有任何有效的神谕
  choice: 没有从上帝而来的回答
  alternative: 上帝没有回答；没有神圣的回应
  rationale: 希伯来语容许较直译的名词句，也可动态表达为“上帝不回答”。所选译法保留其开放性：这些人因得不到来自上帝的真实回应而蒙羞，但正文不进一步解释这是暂时沉默、拒绝回应，还是揭露其神谕虚假。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。以“必……必……”呈现先知性审判宣告，以分号保留两组平行分句；正文维持“遮住上唇”的希伯来意象，并用脚注说明可能译法及语用歧义。
