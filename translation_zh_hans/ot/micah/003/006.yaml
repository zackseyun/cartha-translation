base_translation:
  language: en
  yaml_path: translation/ot/micah/003/006.yaml
  text: Therefore it will be night for you[a], without vision, and darkness for you, without divination; the sun will go down on the prophets[b], and the day will grow dark over them.
translation:
  language: zh_hans
  text: 因此，黑夜必临到你们，使你们没有异象；幽暗必临到你们，使你们不能占卜[a]。太阳必向这些先知落下[b]；白昼必在他们上面变黑。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “没有异象”和“不能占卜”也可较直译为“远离异象”和“远离占卜”；这里的希伯来介词可能表示剥夺，即他们将得不到异象，也不能占卜。
    reason: lexical_alternative
  - marker: b
    text: 字面为“太阳必来到这些先知身上”；太阳“来到”在这里按惯用法理解为太阳落下。
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: 因此
  rationale: 承接上文对先知的指控，表明本节所宣告的是由此而来的审判后果。
- source_word: לַיְלָה לָכֶם
  choice: 你们必遭遇黑夜
  rationale: 希伯来文是无系词的名词句；结合审判语境，用将来表达，并以“遭遇黑夜”自然传达黑夜临到他们的意思。
- source_word: מֵחָזוֹן
  choice: 不再有异象
  rationale: 介词 מִן 在这里最可能表示剥夺，即这些先知将失去异象；“不再有”也体现审判所带来的终止。
- source_word: וְחָשְׁכָה לָכֶם
  choice: 你们必陷入幽暗
  rationale: 与前句“遭遇黑夜”形成诗意平行，并表达逐渐被黑暗笼罩的审判景象。
- source_word: מִקְּסֹם
  choice: 不再能占卜
  rationale: 与 מֵחָזוֹן 平行，将介词理解为表示剥夺；动词“占卜”准确而自然地表达 קסם。
- source_word: וּבָאָה הַשֶּׁמֶשׁ עַל הַנְּבִיאִים
  choice: 太阳必在这些先知头上落下
  rationale: בוא 字面为“来到”，但以太阳为主语时可表示日落；“在……头上”保留 עַל 的空间意象，并与下句平行。
- source_word: הַנְּבִיאִים
  choice: 这些先知
  rationale: 定冠词指向上下文中正受责备的那一群先知；中文用“这些”可清楚体现其特指性。
- source_word: וְקָדַר עֲלֵיהֶם הַיּוֹם
  choice: 白昼也必在他们头上变黑
  rationale: קדר 表示变暗、阴沉；译文保留“白昼变黑”的强烈反常意象以及 עַל 的表达。
theological_decisions:
- issue: 审判中黑暗意象的性质
  choice: 将黑夜、幽暗、日落和白昼变黑理解为对败坏先知的审判意象，突出他们失去异象和占卜能力。
  alternative: 仅指社会声誉受损，或指一场字面意义上的天文现象。
  rationale: 上下文直接谈到异象、占卜和先知，因此意象首先指他们所谓启示来源的断绝；译文同时保留诗歌意象，不把它改写成单一的神学解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。前两分句以“遭遇／陷入”和“不再……”构成清晰平行；后两分句保留太阳、白昼以及“在……头上”的审判意象，避免把诗意语言完全解释化。
