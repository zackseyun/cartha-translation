id: MIC.3.12
reference: Micah 3:12
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: לָ/כֵן֙ בִּ/גְלַלְ/כֶ֔ם צִיּ֖וֹן שָׂדֶ֣ה תֵֽחָרֵ֑שׁ וִ/ירוּשָׁלִַ֨ם֙ עִיִּ֣ין תִּֽהְיֶ֔ה וְ/הַ֥ר הַ/בַּ֖יִת לְ/בָמ֥וֹת יָֽעַר׃פ
base_translation:
  language: en
  yaml_path: translation/ot/micah/003/012.yaml
  text: Therefore[a], because of you, Zion will be plowed like a field, and Jerusalem will become ruins[b], and the mountain of the house will become wooded heights.
translation:
  language: zh_hans
  text: 所以，因你们的缘故，锡安必被犁成田地，耶路撒冷必变成废墟，圣殿山[a]必成为林木丛生的高冈[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“殿宇的山”；也可译“圣殿所在的山”。
    reason: 保留הַר הַבַּיִת的字面措辞，并说明“圣殿山”这一自然中文表达。
  - marker: b
    text: 也可译“森林的高处”或“森林中的高地”。原文描绘圣殿山荒废后成为林木丛生之地。
    reason: 保留לְבָמוֹת יָעַר在“高处／高地”与森林意象上的表达幅度，且不强加祭祀场所的含义。
lexical_decisions:
- source_word: לָכֵן
  choice: 所以
  rationale: 承接上文领袖和宗教人员的罪，明确引出审判的后果；“所以”自然、直接，并保留先知宣告的力度。
- source_word: בִּגְלַלְכֶם
  choice: 因你们的缘故
  rationale: 直接把灾祸归因于受责备的人；“你们”保留原文第二人称复数的指控性。
- source_word: צִיּוֹן
  choice: 锡安
  rationale: 采用现代中文圣经中通行的地名音译。
- source_word: שָׂדֶה תֵחָרֵשׁ
  choice: 必被犁成田地
  rationale: תֵחָרֵשׁ是农业意义上חרשׁ的尼法勒未完成式，表达被犁的被动结果；“犁成田地”自然呈现城邑被夷平、沦为耕地的意象。
- source_word: וִירוּשָׁלִַם עִיִּין תִּהְיֶה
  choice: 耶路撒冷必变成废墟
  rationale: עִיִּין指废墟或瓦砾堆；“变成”清楚表达审判所造成的状态转变。
- source_word: הַר הַבַּיִת
  choice: 圣殿所在的山
  rationale: 原文直译为“那殿的山”；这里“殿”所指的是圣殿。正文采用自然清楚的中文，同时用脚注保存原文措辞。
- source_word: לְבָמוֹת יָעַר
  choice: 成为丛林覆盖的高地
  rationale: בָּמוֹת可指高处或高地，יָעַר意为树林、森林；结合审判语境，此短语描绘圣殿山荒废后林木丛生的景象，而不必带入祭祀“邱坛”的含义。
theological_decisions:
- issue: 是否在正文中把הַבַּיִת明确译为“圣殿”
  choice: 译作“圣殿所在的山”，并在脚注注明直译
  alternative: 那殿的山；圣殿山
  rationale: “殿”在此语境中通常指耶和华的圣殿。正文以自然现代中文说明所指，脚注保留原文较含蓄的表达，避免掩盖其字面形式。
- issue: לְבָמוֹת是否应带有祭祀场所“邱坛”的含义
  choice: 按地貌和荒芜意象译作“丛林覆盖的高地”
  alternative: 森林的高处；林木丛生的山冈；森林中的邱坛
  rationale: 紧随其后的יָעַר使短语重点落在荒芜、林木滋生的地貌上。译作“邱坛”容易加入此处未必具有的祭祀含义，因此将较直译的可能性列入脚注。
translation_notes:
  register: 采用庄重而易懂的现代标准普通话。“必”保留先知审判宣告的确定语气；三个并列分句形成层层推进的毁灭图景。避免使用可能让普通读者误解为祭祀场所的“邱坛”，并以脚注保留原文表达的可能范围。
