  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: דְּבַר יְהוָ֣ה אֲשֶׁ֣ר הָיָ֗ה אֶל מִיכָה֙ הַ/מֹּ֣רַשְׁתִּ֔י בִּ/ימֵ֥י יוֹתָ֛ם אָחָ֥ז יְחִזְקִיָּ֖ה מַלְכֵ֣י יְהוּדָ֑ה אֲשֶׁר חָזָ֥ה עַל שֹׁמְר֖וֹן וִ/ירֽוּשָׁלִָֽם־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/001/001.yaml
  text: The word of Yahweh that came to Micah the Morashtite in the days of Jotham[a], Ahaz, and Hezekiah, kings of Judah[b], which he saw concerning Samaria and Jerusalem.
translation:
  language: zh_hans
  text: 犹大诸王约坦、亚哈斯和希西家在位期间，雅威的话临到摩利沙人弥迦[a]；他所看见的，关乎撒马利亚和耶路撒冷[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “摩利沙人”即来自摩利设的人。
    reason: cultural_note
  - marker: b
    text: “关乎”也可译作“针对”。原文介词既可表示异象的主题，也可在这里带有针对、反对的意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: דְּבַר יְהוָה
  choice: 雅威的话
  rationale: 保留先知书标题中“雅威的话”这一固定表达；“话”既贴近 דְּבַר，也能自然表示从上帝而来的启示信息。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见音译呈现四字神名，保留其作为专名的性质，不以称号代替。
- source_word: אֲשֶׁר הָיָה אֶל
  choice: 临到
  rationale: “临到”准确表达先知领受神谕的惯用结构，在现代中文圣经语体中清楚而庄重。
- source_word: הַמֹּרַשְׁתִּי
  choice: 摩利沙人
  rationale: 保留表示籍贯的族称形式；脚注说明他是来自摩利设的人。
- source_word: בִּימֵי
  choice: 在位期间
  rationale: 在列举君王的年代公式中，用“在位期间”自然传达“在……的日子”，同时不改变其历史定位功能。
- source_word: יוֹתָם אָחָז יְחִזְקִיָּה
  choice: 约坦、亚哈斯和希西家
  rationale: 采用现代中文圣经中通行的人名译法。
- source_word: מַלְכֵי יְהוּדָה
  choice: 犹大诸王
  rationale: 准确表达复数构词关系，并自然统领随后列出的三位君王。
- source_word: אֲשֶׁר חָזָה
  choice: 他所看见的
  rationale: 保留先知领受异象时所用的“看见”意象，不改写为较抽象的“领受信息”。
- source_word: עַל
  choice: 关乎
  rationale: 保留介词既可标明主题、又可能带有针对意味的宽度；另一种可能译法置于脚注。
- source_word: שֹׁמְרוֹן וִירוּשָׁלָם
  choice: 撒马利亚和耶路撒冷
  rationale: 采用通行地名译法，并按原文保留两座城市的名称，不直接释为南北两国。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。译作“雅威”可将其作为以色列上帝的专名呈现，而不以“主”这一称号取代；“耶和华”是传统汉译，但较不贴近通常重构的发音。
- issue: עַל 对两座城市所表达的关系
  choice: 关乎
  alternative: 针对
  rationale: 本节可将撒马利亚和耶路撒冷理解为异象的主题，也可因后文审判语境而理解为异象所针对的对象。正文采用较宽的“关乎”，脚注保留“针对”的可能性。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。以“临到”保留先知书标题的传统语感，以分号清楚区分年代与领受神谕的陈述和异象对象，同时保留“话”与“看见”并置所形成的先知性表达。
