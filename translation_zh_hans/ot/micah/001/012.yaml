  yaml_path: translation/ot/micah/001/012.yaml
  text: For the inhabitant of Maroth writhes for good, because disaster has come down from the LORD to the gate of Jerusalem.
translation:
  language: zh_hans
  text: 玛罗的居民为福祉而痛苦挣扎，因为灾祸从耶和华那里降下，临到耶路撒冷的城门。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חָלָה לְטוֹב
  choice: 为得好处而痛苦挣扎
  rationale: חָלָה通常指患病、软弱或痛苦；这里保留其强烈的身体性和痛苦感，并保留לְטוֹב所表达的“为好处、为美善”的张力，不改译成较弱的“焦急等候”。
- source_word: רָע
  choice: 灾祸
  rationale: 此处与从耶和华那里临到城门的审判事件相关，指灾难或祸患，而非抽象的道德邪恶。
- source_word: יָרַד
  choice: 降下
  rationale: 保留原文“下来、降下”的空间意象。
- source_word: מֵאֵת יְהוָה
  choice: 从耶和华那里
  rationale: 明确保留灾祸来源于耶和华这一原文表述；יהוה按现代中文圣经的通行专名译作“耶和华”。
- source_word: לְשַׁעַר יְרוּשָׁלִָם
  choice: 临到耶路撒冷的城门
  rationale: 介词לְ在此表达灾祸降至、抵达城门；“临到”使现代汉语自然，同时保留目标含义。
theological_decisions:
- issue: 灾祸与耶和华的关系
  choice: 直译为“灾祸从耶和华那里降下”
  alternative: “耶和华容许灾祸降下”
  rationale: 原文直接使用מֵאֵת יְהוָה说明来源，没有“容许”一词；不以解释性措辞削弱先知书中的神学张力。
- issue: 玛罗居民所盼求的“好处”
  choice: 保留“为得好处”这一含混表达
  alternative: “盼望平安”或“等候救援”
  rationale: טוֹב可泛指好处、福祉或顺境；原文未具体说明所求为何，因此不将其限定为平安或救援。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“痛苦挣扎”传达חָלָה的强烈痛楚，句式保留原文两个כִּי分句之间的因果推进。
