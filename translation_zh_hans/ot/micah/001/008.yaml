id: MIC.1.8
reference: Micah 1:8
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: עַל זֹאת֙ אֶסְפְּדָ֣ה וְ/אֵילִ֔ילָה אֵילְכָ֥ה שילל וְ/עָר֑וֹם אֶעֱשֶׂ֤ה מִסְפֵּד֙ כַּ/תַּנִּ֔ים וְ/אֵ֖בֶל כִּ/בְנ֥וֹת יַעֲנָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/001/008.yaml
  text: Because of this I will lament and wail[a]; I will go stripped and naked. I will make a lament like the jackals[b], and mourning like the daughters of the ostrich.
translation:
  language: zh_hans
  text: 因此，我要哀哭号啕；我要赤足[a]赤身而行。我要像豺狼一样哀号，像鸵鸟[b]一样悲鸣。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “赤足”所译的希伯来词含义不确定；也可译作“衣衫被剥去”。这两种理解都体现了举哀和受辱的状态。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译为“鸵鸟的女儿们”，是指鸵鸟或雌鸵鸟的诗意表达。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶסְפְּדָה
  choice: 哀哭
  rationale: ספד常指为死亡或灾祸举哀；“哀哭”自然传达哀悼之意，并与后面声音更强烈的“号啕”有所区别。
- source_word: וְאֵילִילָה
  choice: 号啕
  rationale: ילל指高声、凄厉地哀叫；“号啕”保留其强烈程度，也符合现代汉语哀痛语境。
- source_word: אֵילְכָה שילל וְעָרוֹם
  choice: 我要赤足赤身而行
  rationale: עָרוֹם明确指赤身；辅音文本中的 שילל 词义困难，可能指赤足，也可能指被剥去衣物。结合公开举哀和受辱的语境，正文采用“赤足”，并在脚注保留另一种理解。
- source_word: מִסְפֵּד
  choice: 哀号
  rationale: 该名词指哀悼、哀哭；这里与发出凄厉叫声的豺狼相比，“哀号”比抽象的“哀悼”更能呈现听觉意象。
- source_word: כַתַּנִּים
  choice: 像豺狼一样
  rationale: תַּנִּים在先知诗歌中通常指豺狼，其叫声与荒凉之地的意象相合。
- source_word: וְאֵבֶל
  choice: 悲鸣
  rationale: אֵבֶל通常指悲哀或举哀；受后面动物比喻影响，“悲鸣”自然呈现可听见的哀声，同时不把它与前一分句完全合并。
- source_word: כִּבְנוֹת יַעֲנָה
  choice: 像鸵鸟一样
  rationale: 字面为“鸵鸟的女儿们”，是希伯来诗歌中指鸵鸟或雌鸵鸟的表达。正文采用自然、易懂的动物名称，字面形式收入脚注。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。以“哀哭—号啕”和“哀号—悲鸣”保留希伯来诗句近义词之间的层次及声音意象；对词义困难的 שילל 不作无提示的确定化处理。
