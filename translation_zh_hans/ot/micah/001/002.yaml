language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: שִׁמְעוּ֙ עַמִּ֣ים כֻּלָּ֔/ם הַקְשִׁ֖יבִי אֶ֣רֶץ וּ/מְלֹאָ֑/הּ וִ/יהִי֩ אֲדֹנָ֨/י יְהוִ֤ה בָּ/כֶם֙ לְ/עֵ֔ד אֲדֹנָ֖/י מֵ/הֵיכַ֥ל קָדְשֽׁ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/001/002.yaml
  text: Hear[a], all you peoples; pay attention, O earth, and all that fills it. And let the Lord GOD be a witness against you[d][c][b], the Lord from his holy temple.
translation:
  language: zh_hans
  text: 万民啊，你们全都要听[a]！大地和其中的一切啊，要留心！愿主耶和华[b]从他的圣殿[d]作见证，指控你们[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“所有民族都要听。”
    reason: lexical_alternative
  - marker: b
    text: 原文为“主耶和华”，由表示“主”的称号和神的名字“耶和华”组成。
    reason: lexical_alternative
  - marker: c
    text: 或译：“在你们中间作证”；按本节的审判语境，“指控你们”较为可能。
    reason: alternative_reading
  - marker: d
    text: “圣殿”也可译作“圣宫”或“圣所”。
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעוּ
  choice: 要听
  rationale: 复数命令式，既是要求聆听，也是先知审判宣告中的正式传唤；“要听”简洁、庄重。
- source_word: עַמִּים כֻּלָּם
  choice: 万民哪，你们都
  rationale: 保留对众多族群的直接呼告和复数含义；“万民”在现代中文中自然，也不把该词过度限定为政治意义上的国家。
- source_word: הַקְשִׁיבִי
  choice: 要留心
  rationale: 使役词干阴性单数命令式，以“大地”为受话者；“留心”表达专注听取正式宣告的语气。
- source_word: אֶרֶץ וּמְלֹאָהּ
  choice: 大地和其中所充满的一切
  rationale: 与“万民”平行，אֶרֶץ在此宜取普世意义的“大地”；译文也保留מְלֹאָהּ“充满其中之物”的形象。
- source_word: וִיהִי
  choice: 愿……作
  rationale: 该形式具有祈愿式或命令式语气；“愿”保留这一语气，而不把它平直化为单纯的未来陈述。
- source_word: אֲדֹנָי יְהוִה
  choice: 主耶和华
  rationale: 分别呈现“主”和神圣名יהוה两个成分，并符合现代中文圣经语域；脚注说明原文构词。
- source_word: בָּכֶם לְעֵד
  choice: 作证指控你们
  rationale: עֵד是法律用语；结合先知审判语境，בָּכֶם最可能带有不利于受审者的司法含义。“作证指控”清楚表达这一点，同时以脚注保留“在你们中间作证”的语法可能。
- source_word: אֲדֹנָי מֵהֵיכַל קָדְשׁוֹ
  choice: 主从他的圣殿作证
  rationale: הֵיכָל可指殿、宫殿或圣所；用于神圣居所时，“圣殿”最易理解。补出“作证”承接前句，使中文完整自然。
theological_decisions:
- issue: 复合称号אֲדֹנָי יְהוִה中神圣名יהוה的译法
  choice: 主耶和华
  alternative: 主上帝；主雅威
  rationale: “主耶和华”既保留两个原文成分，又采用普通中文读者熟悉的神圣名形式；不以“上帝”取代原文专名。
- issue: אֶרֶץ的范围
  choice: 大地
  alternative: 这地
  rationale: 前句呼告“万民”，后句又包括充满其中的一切，因此这里较可能是普世性的“大地”，而非仅指以色列地。
- issue: בָּכֶם的司法指向
  choice: 指控你们
  alternative: 在你们中间
  rationale: 全节是传唤万民和大地听取神作证的司法场景，敌对或不利于受话者的含义较合语境；但介词本身可作方位理解，故在脚注保留另一译法。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语，以“万民哪”“愿……作证”保留先知宣告和法庭传唤的语气。避免古奥表达，同时保留祈愿式语气、司法意象及הֵיכָל的词义张力。
