base_translation:
  language: en
  yaml_path: translation/ot/micah/001/014.yaml
  text: Therefore you will give parting gifts for Moresheth-gath[b][a]; the houses of Achzib will prove deceptive to the kings of Israel.
translation:
  language: zh_hans
  text: 因此，你必为摩利设迦特送上临别的礼物[a]；亚革悉的各家必使以色列诸王失望[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “临别的礼物”也可译作“送别礼物”。原文可指送人离开时所赠的礼物，并可能隐约带有离婚的意象。
    reason: lexical_alternative
  - marker: b
    text: “亚革悉”的希伯来语读音与表示“欺骗、虚假或令人失望之物”的词相近；这里运用了双关。
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: 因此
  rationale: 自然表达该推论连接词，表明本节是前述审判宣告所带来的结果。
- source_word: תִּתְּנִי
  choice: 你要……送上
  rationale: 保留第二人称阴性单数所体现的直接称呼，但不在正文中明确其所指，以保存原文可能指拟人化的犹大、锡安或相关城邑的含混性。
- source_word: שִׁלּוּחִים
  choice: 临别的礼物
  rationale: 该复数名词源于“差遣、送走”，可指离别时赠送的礼物；此译法保留送别含义，又不把可能存在的休妻意象定为唯一解释。
- source_word: עַל מוֹרֶשֶׁת גַּת
  choice: 为摩利沙迦特
  rationale: 介词 עַל 在此结合赠礼语境，译作“为”较自然，并避免把摩利沙迦特明确处理为礼物的直接接受者。地名按复合名称音译。
- source_word: בָּתֵּי אַכְזִיב
  choice: 亚革悉的各家
  rationale: 直译其结构为“亚革悉的家”，加“各”体现复数；“家”可涵盖房屋、家族或聚落，不在正文中过度限定。
- source_word: לְאַכְזָב
  choice: 必使……失望
  rationale: אַזְכָב 可指虚假、欺骗或令人失望之物；“使……失望”符合上下文，也能通过脚注说明它与地名“亚革悉”的希伯来语双关。
- source_word: לְמַלְכֵי יִשְׂרָאֵל
  choice: 使以色列诸王
  rationale: 将希伯来语关系表达自然转换为汉语使动结构；“诸王”准确反映复数。
theological_decisions:
- issue: 阴性单数动词所指的受话者
  choice: 正文仅保留“你”，不明确指定受话者
  alternative: 明说“犹大”“耶路撒冷/锡安”或“摩利沙迦特”
  rationale: 原文动词为第二人称阴性单数，可能称呼拟人化的犹大、锡安或某座城；上下文不足以排除所有其他理解，因此不在译文中消除这一真实含混性。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。地名按常见圣经汉语形式音译；以“临别的礼物”保留离别语义，以“失望”传达双关所含的落空感，并由脚注补足原文的欺骗、虚假含义。
