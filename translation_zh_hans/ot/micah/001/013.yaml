id: MIC.1.13
reference: Micah 1:13
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: רְתֹ֧ם הַ/מֶּרְכָּבָ֛ה לָ/רֶ֖כֶשׁ יוֹשֶׁ֣בֶת לָכִ֑ישׁ רֵאשִׁ֨ית חַטָּ֥את הִיא֙ לְ/בַת צִיּ֔וֹן כִּי בָ֥/ךְ נִמְצְא֖וּ פִּשְׁעֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/001/013.yaml
  text: Harness the chariot to the swift horse[a], inhabitant of Lachish; she was the beginning of sin to daughter Zion[d][c][b], for in you were found the transgressions of Israel.
translation:
  language: zh_hans
  text: 拉吉的居民啊[a]，把快马套在战车上！拉吉是锡安女子[b]犯罪的开端[c]，因为在你那里发现了以色列的悖逆之事[d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文用阴性单数形式称呼拉吉的居民，把这座城人格化为女子；也可译作“住在拉吉的女子啊”。
    reason: cultural_note
  - marker: b
    text: “锡安女子”是希伯来诗歌中对锡安或耶路撒冷的拟人称呼。
    reason: cultural_note
  - marker: c
    text: 也可理解为“拉吉是锡安女子犯罪的最初根源”；这句话可能表示，锡安的罪从拉吉开始，或经拉吉传入。
    reason: alternative_reading
  - marker: d
    text: “悖逆之事”也可译作“过犯”；原词常强调蓄意反叛，而不只是一般的错误。
    reason: lexical_alternative
lexical_decisions:
- source_word: רְתֹם הַמֶּרְכָּבָה לָרֶכֶשׁ
  choice: 给快马套上战车
  rationale: רְתֹם是“套上、系上”的命令式，הַמֶּרְכָּבָה指战车，רֶכֶשׁ指善于疾驰的坐骑。此译符合现代汉语驾车用语，也保留了原文紧迫的命令语气。
- source_word: יוֹשֶׁבֶת לָכִישׁ
  choice: 拉吉的居民啊
  rationale: 阴性单数分词在此作呼语，把拉吉城及其居民人格化为女子；“居民啊”自然地表达直接呼告，阴性特点另以脚注说明。
- source_word: רֵאשִׁית חַטָּאת הִיא
  choice: 她是……犯罪的开端
  rationale: רֵאשִׁית表示开端、起始，חַטָּאת在先知谴责的语境中指罪而非赎罪祭。“犯罪的开端”保留拉吉作为罪恶起始点或传播源头的含义，同时不限定具体历史机制。
- source_word: לְבַת צִיּוֹן
  choice: 锡安女子
  rationale: 这是希伯来诗歌中将锡安或耶路撒冷人格化为女子的惯用表达；保留“女子”可呈现原文意象。
- source_word: בָךְ נִמְצְאוּ
  choice: 在你那里被发现了
  rationale: בָךְ为阴性单数第二人称，继续直接对人格化的拉吉说话；נִמְצְאוּ是被动形式，“被发现了”贴近原文，也含有罪证显露的语气。
- source_word: פִּשְׁעֵי יִשְׂרָאֵל
  choice: 以色列的悖逆之事
  rationale: פֶּשַׁע常指有意的反叛或违逆，不只是一般过错；“悖逆之事”既清楚又保留其郑重分量。
theological_decisions:
- issue: חַטָּאת在先知控诉中的含义
  choice: 犯罪
  alternative: 赎罪祭
  rationale: 上下文是在控诉拉吉和锡安的罪，并说明以色列的悖逆在那里出现；这里不是讨论献祭，因此采用道德意义的“犯罪”。
- issue: רֵאשִׁית חַטָּאת的所指
  choice: 拉吉是锡安女子犯罪的开端
  alternative: 拉吉是首要的罪，或是最先受审判的城
  rationale: 句法最自然地把拉吉说成锡安犯罪的起始点，后面的理由从句也支持这一理解；译文不进一步断定罪如何或何时从拉吉传入，以保留文本的张力。
- issue: פֶּשַׁע的力度
  choice: 悖逆之事
  alternative: 过犯
  rationale: 该词可以突出蓄意反叛，尤其在先知性的圣约控诉中如此；“悖逆”比泛称的“过错”更能保留这一力度，又不加入特定宗派解释。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。以“啊”和感叹号呈现先知对城邑的直接呼告及命令的紧迫感；保留“锡安女子”的诗歌意象，并以“她／你”的转换忠实反映原文先谈论拉吉、随后又直接对拉吉说话的修辞变化。
