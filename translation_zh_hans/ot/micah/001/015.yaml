  text: עֹ֗ד הַ/יֹּרֵשׁ֙ אָ֣בִי לָ֔/ךְ יוֹשֶׁ֖בֶת מָֽרֵשָׁ֑ה עַד עֲדֻּלָּ֥ם יָב֖וֹא כְּב֥וֹד יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/001/015.yaml
  text: I will yet bring an heir against you[a], inhabitant of Mareshah[b]; the glory of Israel will come as far as Adullam.
translation:
  language: zh_hans
  text: 玛利沙的居民啊，我还要带一个占有者来攻击你[a]；以色列的荣耀[b]必来到亚杜兰。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “占有者”也可译作“继承者”、“取得产业的人”或“征服者”。这里的希伯来语很可能与“玛利沙”这个地名形成文字游戏。
    reason: lexical_alternative
  - marker: b
    text: “以色列的荣耀”也可理解为“以色列的显贵者”或“以色列的财富／荣华”。
    reason: alternative_reading
lexical_decisions:
- source_word: עֹד
  choice: 还要
  rationale: 表示审判仍将继续或进一步临到；“还要”在现代汉语的预告语气中自然，也保留延续、追加之意。
- source_word: הַיֹּרֵשׁ
  choice: 一个占有者
  rationale: 源自动词 ירשׁ，可指承受、占有或夺取产业的人；此处与地名“玛利沙”构成希伯来语文字游戏。“占有者”虽不能复制原文音韵，却保留其核心的占有语义及原文在继承者与征服者之间的张力。
- source_word: אָבִי לָךְ
  choice: 我……带……来攻击你
  rationale: 使役形动词 בוא 搭配 ל，在审判和入侵语境中表示把敌对者带到某人那里；“来攻击你”自然呈现其敌对指向。
- source_word: יוֹשֶׁבֶת
  choice: 居民
  rationale: 阴性单数分词直接称呼被拟人化为女子的城；“玛利沙的居民啊”既保留呼语，也符合现代汉语表达。
- source_word: מָרֵשָׁה
  choice: 玛利沙
  rationale: 按现代汉语圣经地名习惯音译；原文与“占有者”之间的语音文字游戏无法在汉语正文中完整重现，故在脚注说明。
- source_word: עַד
  choice: 来到
  rationale: 与 יָבֹא 合译，表达移动所达到的空间终点；此处不取时间性的“直到”。
- source_word: עֲדֻּלָּם
  choice: 亚杜兰
  rationale: 按现代汉语圣经地名习惯音译该地名。
- source_word: יָבֹא
  choice: 必来到
  rationale: 保留 בוא 的移动意象；“必”体现先知预告的确定语气，而不额外界定来到者为何来到。
- source_word: כְּבוֹד יִשְׂרָאֵל
  choice: 以色列的荣耀
  rationale: כבוד 可指荣耀、尊荣、显贵者或财富；直译可保留所指对象的开放性，避免武断限定为贵族、财富或国家精华。
theological_decisions:
- issue: “以色列的荣耀”所指为何
  choice: 正文直译为“以色列的荣耀”，不明确限定其所指。
  alternative: 可理解为“以色列的显贵者”或“以色列的财富／荣华”。
  rationale: 希伯来语 כבוד 的语义范围容许这些相关理解；上下文可能暗示领袖、显贵或国家中最贵重显赫之物来到亚杜兰，但原文没有明确收窄，因此正文保留其文学和神学张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“玛利沙的居民啊”保留先知对拟人化城邑的直接呼告；分号呈现两小句之间紧密而未完全明说的关系。正文保留“占有者”的非常规措辞，以尽量传达原文的占有语义和文字游戏，并由脚注帮助普通读者理解。
