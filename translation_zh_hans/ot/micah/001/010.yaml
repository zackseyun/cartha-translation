  text: בְּ/גַת֙ אַל תַּגִּ֔ידוּ בָּכ֖וֹ אַל תִּבְכּ֑וּ בְּ/בֵ֣ית לְעַפְרָ֔ה עָפָ֖ר התפלשתי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/001/010.yaml
  text: In Gath[a], do not tell it; in Acco, do not weep.[b] In Beth-leaphrah[c], roll yourself in the dust.
translation:
  language: zh_hans
  text: 不要在迦特传扬；千万不要哭泣。[a] 在伯·亚弗拉[b]，要在尘土中打滚。[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “千万不要哭泣”直译可作“哭泣——不要哭泣”，是加强语气的说法。也有人把前一个词理解为地名“亚柯”，译作“不要在亚柯哭泣”，以形成这一段的地名双关。
    reason: alternative_reading
  - marker: b
    text: “伯·亚弗拉”这个地名可能令人联想到“尘土之家”，与下文的“尘土”相呼应。
    reason: cultural_note
  - marker: c
    text: 这里按上下文译作命令语气。希伯来语辅音文本的字形表面上是第一人称：“我已打滚”；传统读法则将它理解为“要打滚”。
    reason: textual_variant
lexical_decisions:
- source_word: בְּגַת
  choice: 在迦特
  rationale: 专名按现代中文圣经地名习惯音译；介词 בְּ 在此自然译作“在”。
- source_word: אַל תַּגִּידוּ
  choice: 不要传扬
  rationale: Hifil 形态表示告知、报告或传扬；中文用“传扬”既简洁庄重，也保留可能与《撒母耳记下》1:20相呼应的措辞，不补明原文省略的宾语。
- source_word: בָּכוֹ אַל תִּבְכּוּ
  choice: 千万不要哭泣
  rationale: 按马所拉元音将 בָּכוֹ 视为动词 בכה 的绝对不定式，与后面的未完成式构成加强语气的禁令；“千万不要”自然表达这种强调。所谓“亚柯”地名读法需要改变现有元音划分，故放入脚注而不列正文。
- source_word: בְּבֵית לְעַפְרָה
  choice: 在伯·亚弗拉
  rationale: 作为地名音译，并用间隔号帮助现代读者辨认复合专名；其名称可能令人联想到“尘土之家”，与下文 עָפָר 构成双关。
- source_word: עָפָר
  choice: 尘土
  rationale: עָפָר 的常用义为尘土；“尘土”兼具哀悼、降卑的语境色彩，也保存与地名伯·亚弗拉的文字游戏。
- source_word: התפלשתי
  choice: 要……打滚
  rationale: 上下文连续使用命令语气，传统读法亦理解为阴性单数命令式；“在尘土中打滚”比“翻滚自己”更符合现代汉语，同时保留哀悼动作的强烈形象。辅音文本表面的第一人称形式在脚注说明。
theological_decisions:
- issue: בָּכוֹ 是否作为地名“亚柯”处理
  choice: 正文采用马所拉文本的动词强调读法“千万不要哭泣”
  alternative: “不要在亚柯哭泣”
  rationale: WLC 的元音文本直接支持绝对不定式加未完成式的强调结构；地名读法能强化本段城镇双关，但不宜在正文中取代现存元音所示读法，因此以脚注保留。
- issue: התפלשתי 的人称与语气
  choice: 依上下文译为命令“要……打滚”
  alternative: 按辅音文本表面形式译为“我已在尘土中打滚”
  rationale: 前文两个禁令以及对伯·亚弗拉的拟人称呼强烈支持命令语气；同时脚注保留第一人称形式，避免掩盖文本问题。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“传扬”保留先知话语的凝练感；“千万不要”传达希伯来语强调禁令；地名依中文音译，并以脚注解释双关及文本歧义。
