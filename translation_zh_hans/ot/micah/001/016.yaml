  to: 你要剃光头，剪去头发，为你所喜爱的儿女；要使你头上的秃处扩大，像鹰[a]一样，因为他们已离开你，流亡而去。
  rationale: 删去原文未明说的“哀哭”，以分号保留“为你所喜爱的儿女”与剃发命令的因由关系。调整第二命令的语序，使“像鹰一样”明确关联于秃处的扩大；将“被掳去了”改为“流亡而去”，更贴合希伯来语主动式，同时保留离开受话者并进入流亡的含义。
