base_translation:
  language: en
  yaml_path: translation/ot/micah/001/016.yaml
  text: Make yourself bald and shave your head for the children of your delight; enlarge your baldness like the eagle[a], for they have gone from you into exile.
translation:
  language: zh_hans
  text: 你要剃光头，剪去头发，为你所喜爱的儿女；要使你头上的秃处扩大，像鹰[a]一样，因为他们已离开你，流亡而去。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “鹰”也可译作“秃鹫”。希伯来语 נֶשֶׁר 可能指大型食腐鸟，而不一定特指鹰；这里的比喻着重于显眼的光秃。
    reason: lexical_alternative
lexical_decisions:
- source_word: קָרְחִי
  choice: 你要剃光头发
  rationale: 阴性单数命令式，指以剃发表示哀悼；此译保留直接命令，也自然表达使自己光秃的含义。
- source_word: וָגֹזִּי
  choice: 把头发剪去
  rationale: גזז 本义为剪、剪除；与前一命令平行，在哀悼语境中指剪去头发。
- source_word: עַל בְּנֵי תַּעֲנוּגָיִךְ
  choice: 为你所珍爱的儿女哀哭
  rationale: עַל 表示哀悼的对象或缘由；בְּנֵי 可泛指儿女，תַּעֲנוּגָיִךְ 表达喜爱、珍爱。补出“哀哭”使汉语清楚呈现剃发行为的哀悼功能，而不改变命令的内容。
- source_word: הַרְחִבִי קָרְחָתֵךְ
  choice: 要使你头上的光秃之处宽
  rationale: 直译为“使你的秃处扩大”。加入“头上的”是由上下文明确的信息，使现代汉语表达自然。
- source_word: כַּנֶּשֶׁר
  choice: 如鹰
  rationale: נֶשֶׁר 传统上译作鹰，也可能指秃鹫一类的大型食腐鸟；正文采用常见译法，脚注保留动物辨识上的不确定性。
- source_word: כִּי גָלוּ מִמֵּךְ
  choice: 因为他们已经离开你，被掳去了
  rationale: גלה 在此表示离乡、被放逐或被掳；结合 מִמֵּךְ，译文同时表达与被称作“你”的城邑或群体分离，以及被掳流亡的处境。
theological_decisions: []
