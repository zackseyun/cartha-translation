  text: כִּֽי הִנֵּ֥ה יְהוָ֖ה יֹצֵ֣א מִ/מְּקוֹמ֑/וֹ וְ/יָרַ֥ד וְ/דָרַ֖ךְ עַל במותי אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/001/003.yaml
  text: For look, the LORD is coming out from his place; he will come down and tread on the high places of the earth.
translation:
  language: zh_hans
  text: 看哪，耶和华从他的居所出来；他必下来，踏在大地的高处。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי הִנֵּה
  choice: 看哪
  rationale: 这里的כִּי与הִנֵּה共同引出值得注意的宣告；中文用“看哪”自然保留先知话语的庄重和警示语气，不必机械另译“因为”。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的专名形式，明确对应四字神名。
- source_word: מִמְּקוֹמוֹ
  choice: 从他的居所
  rationale: מָקוֹם本义为“地方、所在”；在此神显语境中译作“居所”较自然，同时不具体限定为天上或圣殿。
- source_word: יֹצֵא
  choice: 出来
  rationale: 该分词描绘行动正要展开或正在展开；与“看哪”连用时，中文“出来”保持鲜明临场感。
- source_word: וְיָרַד
  choice: 他必降临
  rationale: יָרַד意为“下来”；在耶和华显现的语境中，“降临”既自然庄重，又保留向下而来的动态。
- source_word: וְדָרַךְ
  choice: 踏在……之上
  rationale: דָרַךְ表示踩踏、行走于其上；此处译法保留神威严临到并践踏高处的意象。
- source_word: במותי אָרֶץ
  choice: 大地的高处
  rationale: 马所拉文本的词形在此对应במותי，按上下文理解为במותֵי“……的高处”；译文保留“高处”的空间及可能的宗教含义，不将其缩窄为“丘坛”。
theological_decisions:
- issue: 耶和华从“他的居所”出来所指何处
  choice: 保留为“他的居所”
  alternative: 从天上／从圣殿出来
  rationale: 原文未明确界定该处所；不把神显场景限定为天上或地上圣殿。
- issue: “大地的高处”的含义
  choice: 直译为“大地的高处”
  alternative: 大地的山岭／地上的丘坛
  rationale: במות可指地势高处，也可带有敬拜场所的意味；直译可保留地理意象与潜在宗教内涵之间的张力。
translation_notes:
  register: 采用庄重而清晰的现代标准汉语。“看哪”保留先知宣告的警示感；分号连接神从居所出来与随后的降临、踏行，体现希伯来诗句的推进。
