  text: כִּ֥י אֲנוּשָׁ֖ה מַכּוֹתֶ֑י/הָ כִּי בָ֨אָה֙ עַד יְהוּדָ֔ה נָגַ֛ע עַד שַׁ֥עַר עַמִּ֖/י עַד יְרוּשָׁלִָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/001/009.yaml
  text: For her wound is incurable[a], for it has come as far as Judah; it has reached to the gate of my people[b], to Jerusalem.
translation:
  language: zh_hans
  text: 因为她的创伤无法医治[a]；因为灾祸已经临到犹大，已经直抵[b]我百姓的城门——耶路撒冷。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“她的创伤极其严重”。“创伤”原文为复数形式，也可译作“她的多处创伤无法医治”。
    reason: lexical_alternative
  - marker: b
    text: “直抵”也可译作“触及”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲנוּשָׁה
  choice: 无法医治
  rationale: 该词在此表示病情或创伤严重到不能治愈；“无法医治”自然、庄重，并与“创伤”搭配清楚。
- source_word: מַכּוֹתֶיהָ
  choice: 她的创伤
  rationale: 原文名词为复数形式，但可表达集合意义；中文单数“创伤”能概括这场整体性的灾难，同时保留阴性后缀所体现的拟人表达。
- source_word: בָאָה
  choice: 灾祸已经临到
  rationale: 原文阴性单数动词的主语在语法和意象上存在张力，可能承接拟人化对象，也可能指所受的灾祸；中文明示“灾祸”使推进的审判意象自然，但不具体限定灾祸的形式。
- source_word: עַד יְהוּדָה
  choice: 临到犹大
  rationale: עַד 表示延伸所达到的范围或界限；“临到犹大”既表达灾祸扩展至南国，也符合先知书语体。
- source_word: נָגַע
  choice: 直抵
  rationale: נגע 可指触及、到达或击打；“直抵”保留灾祸逼近边界的力度，又不武断译成具体的攻击动作。
- source_word: שַׁעַר
  choice: 城门
  rationale: 耶路撒冷语境中的“门”是城市的门；译作“城门”使现代读者立刻明白具体意象。
- source_word: עַמִּי
  choice: 我百姓
  rationale: 保留第一人称及立约群体的色彩；“我百姓”比“我的国家”更贴近原文先知性表达。
- source_word: יְרוּשָׁלִָם
  choice: 耶路撒冷
  rationale: 采用现代中文圣经地名的通行译法。
theological_decisions:
- issue: 阴性后缀及动词所指对象
  choice: 以“她的创伤”保留城市或群体的拟人化，再以“灾祸已经临到”表达向犹大推进的审判。
  alternative: 可更严格地把阴性形式连续理解为拟人化的撒马利亚，或把后半节的主语理解为伤患、打击或审判本身。
  rationale: 希伯来文在拟人化对象与临到的灾祸之间有所转换，且 נָגַע 又使用阳性形式。译文不把“她”明确认定为某一座城，也不把灾祸具体化，从而保留原文的指称张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“临到”“百姓”保留先知文学的肃穆语感；分号呈现两重“因为”所构成的因果推进。
