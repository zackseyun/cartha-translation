  source_fidelity: 原文宣告耶和华将使撒马利亚沦为田野中的废墟堆，成为葡萄园的栽植地；又使其石头倾泻至山谷，并使其根基显露。草稿整体忠实，但“城中的石头”将原文“她的／其石头”具体化为城内的石头，增加了原文未明说的空间限定；“废墟”也略弱化了עִי所含的“废墟堆、瓦砾堆”意象。
