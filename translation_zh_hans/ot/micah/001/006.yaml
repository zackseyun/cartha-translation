base_translation:
  language: en
  yaml_path: translation/ot/micah/001/006.yaml
  text: So I will make Samaria a heap in the open country[a], a place for planting vineyards[b]; I will pour her stones down into the valley and uncover her foundations.
translation:
  language: zh_hans
  text: 所以，我必使撒马利亚成为田野中的废墟堆[a]，成为葡萄园的栽植地；我必把她的石头倾倒[b]进山谷，使她的根基显露出来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“田野中的乱石堆。”希伯来语原文十分凝练；עִי可指废墟形成的石堆。
    reason: lexical_alternative
  - marker: b
    text: “倾倒”原文有使其流下的意思；也可译作：“使她的石头滚落进沟壑。”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׂמְתִּי
  choice: 所以，我必使
  rationale: 第一人称单数完成式在先知宣告中表达确定的将来行动；句首连接词按上下文自然译为“所以”，但不强化为更严格的因果关系。
- source_word: שֹׁמְרוֹן
  choice: 撒马利亚
  rationale: 采用现代中文圣经传统中通行的地名译法。
- source_word: לְעִי הַשָּׂדֶה
  choice: 成为田野中的废墟
  rationale: עִי指乱石堆或废墟；הַשָּׂדֶה直指田野。合译既表达城市被毁为废墟，也保留其落在野地的空间图景。
- source_word: לְמַטָּעֵי כָרֶם
  choice: 成为栽种葡萄园的地方
  rationale: 该短语可表示葡萄园的栽植地；此译自然传达昔日城址将变为农业用地的结果。
- source_word: וְהִגַּרְתִּי
  choice: 我必……倾倒
  rationale: נגר的使役式表达使某物倾流而下；以石头为宾语时，“倾倒”保留石块如水般滚落的强烈意象。
- source_word: לַגַּי
  choice: 进山谷
  rationale: גַּי可指山谷或沟壑；“山谷”通俗且不把地貌限定得过窄。
- source_word: אֲבָנֶיהָ
  choice: 城中的石头
  rationale: 阴性单数后缀回指撒马利亚。中文不必用“她”标示名词的语法性别，以“城中”明确所指，同时避免生硬或过度人格化。
- source_word: וִיסֹדֶיהָ אֲגַלֶּה
  choice: 显露城的根基
  rationale: גלה的加强词干意为揭开、使裸露；“显露”表达拆毁彻底，以致根基暴露。复数形式在中文集合名词“根基”中自然体现。
theological_decisions:
- issue: 撒马利亚的阴性单数后缀是否译为人格化的“她”
  choice: 译作“城中的石头”和“城的根基”
  alternative: 译作“她的石头”和“她的根基”
  rationale: 希伯来语阴性后缀与城市名的语法性别一致，本节本身未明确把撒马利亚描写成女性。中文采用“城”既准确回指撒马利亚，也不把可能仅属语法形式的人格化程度扩大；同时不妨碍读者感受到先知审判宣告的力度。
translation_notes:
  register: 采用庄重而通俗的现代标准汉语。“我必”保留先知宣告的确定语气；分号呈现从城址变为废墟到石块滚落、根基暴露的递进画面。脚注标记均放在其实际解释的词语之后。
