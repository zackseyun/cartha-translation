  text: עִבְרִ֥י לָ/כֶ֛ם יוֹשֶׁ֥בֶת שָׁפִ֖יר עֶרְיָה בֹ֑שֶׁת לֹ֤א יָֽצְאָה֙ יוֹשֶׁ֣בֶת צַֽאֲנָ֔ן מִסְפַּד֙ בֵּ֣ית הָאֵ֔צֶל יִקַּ֥ח מִ/כֶּ֖ם עֶמְדָּתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/001/011.yaml
  text: Pass on[a], naked and in shame, inhabitant of Shaphir. The inhabitant of Zaanan has not come out[c][b]. The lamentation of Beth-ezel will take away from you its support.
translation:
  language: zh_hans
  text: 沙斐的居民啊，你们要赤身蒙羞地走过去[a][b]！撒南的居民没有出来。伯以薛的哀号要从你们那里夺去它的立足之处[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 沙斐、撒南和伯以薛都是地名。弥迦可能借这些名称的声音或含义作双关：沙斐可能使人联想到“美丽”，撒南的读音可能呼应“出来”，伯以薛可能有“邻近的房屋”或“身旁之地”的意思。
    reason: cultural_note
  - marker: b
    text: “走过去”也可译作“经过”或“离去”；这里的命令可能暗示居民将被迫离乡、遭到放逐。
    reason: lexical_alternative
  - marker: c
    text: 本句希伯来语含义不明确，也可译作：“伯以薛的哀号，要使你们失去它的支援。”这可能指邻近的支援或避难之所已经丧失。
    reason: lexical_alternative
lexical_decisions:
- source_word: עִבְרִי לָכֶם
  choice: 你们要……过去
  rationale: עִבְרִי是阴性单数命令式，把城镇人格化；לָכֶם则是复数，指其中的居民。中文用复数“你们”自然表达集体受命离去的意思，同时不把动作具体限定为出征或被掳。
- source_word: יוֹשֶׁבֶת שָׁפִיר
  choice: 沙斐的居民
  rationale: 保留地名，并以“居民”表达阴性单数分词对城镇的拟人化称呼。
- source_word: עֶרְיָה בֹשֶׁת
  choice: 赤身蒙羞
  rationale: 同时保留身体暴露与受辱两层含义，中文简洁而庄重。
- source_word: לֹא יָצְאָה
  choice: 没有出来
  rationale: 直译完成式，不擅自判定是没有出来作战、援助、逃亡，还是参加哀悼。
- source_word: יוֹשֶׁבֶת צַאֲנָן
  choice: 撒南的居民
  rationale: 保留地名及拟人化的城镇称呼，并让“没有出来”与地名潜在的谐音留待脚注说明。
- source_word: מִסְפַּד בֵּית הָאֵצֶל
  choice: 伯以薛的哀号
  rationale: מִסְפַּד可指哀悼、哭号；“伯以薛的”有意保留是在当地哀哭还是为当地哀哭的歧义。
- source_word: יִקַּח מִכֶּם עֶמְדָּתוֹ
  choice: 要使你们失去它的支援
  rationale: 此句字面涉及“从你们取走它的站立之处/支撑”，语义艰深。“使你们失去它的支援”在现代中文中较自然，并表达邻近据点不再提供依靠的可能含义；其他读法在脚注保留。
