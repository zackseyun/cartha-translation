  text: וְ/כָל פְּסִילֶ֣י/הָ יֻכַּ֗תּוּ וְ/כָל אֶתְנַנֶּ֨י/הָ֙ יִשָּׂרְפ֣וּ בָ/אֵ֔שׁ וְ/כָל עֲצַבֶּ֖י/הָ אָשִׂ֣ים שְׁמָמָ֑ה כִּ֠י מֵ/אֶתְנַ֤ן זוֹנָה֙ קִבָּ֔צָה וְ/עַד אֶתְנַ֥ן זוֹנָ֖ה יָשֽׁוּבוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/001/007.yaml
  text: All her carved images will be smashed[a], and all her prostitute’s wages will be burned with fire; all her idols I will make desolate. For from the wages of a prostitute she gathered them[c][b], and to the wages of a prostitute they will return.
translation:
  language: zh_hans
  text: 她所有的雕刻偶像[a]都必被打碎；她所有作妓女所得的酬金都必被火烧；我必使她所有的神像成为荒凉。因为她是用妓女的酬金聚集这些的[b]，这些也必归回作妓女的酬金[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“雕刻的像”。
    reason: lexical_alternative
  - marker: b
    text: “妓女的酬金”在这里是比喻说法，指撒马利亚因拜偶像而聚敛的财物。
    reason: cultural_note
  - marker: c
    text: 或译：“这些又必成为妓女的酬金。”
    reason: alternative_reading
lexical_decisions:
- source_word: פְּסִילֶיהָ
  choice: 她所有的雕刻偶像
  rationale: פֶּסֶל指雕刻或凿成的像，尤指偶像；“雕刻偶像”兼顾具体制作方式和敬拜语境。
- source_word: יֻכַּתּוּ
  choice: 都必被打碎
  rationale: 该被动式表达猛烈、彻底的毁坏；“被打碎”自然且有力度。
- source_word: אֶתְנַנֶּיהָ
  choice: 她所有作妓女所得的酬金
  rationale: אֶתְנַן指卖淫所得的报酬；明确保留先知信息中刻意使用的性不忠隐喻。
- source_word: יִשָּׂרְפוּ בָאֵשׁ
  choice: 都必被火烧
  rationale: 保留בָאֵשׁ的火焚意象，同时采用自然的现代汉语表达。
- source_word: עֲצַבֶּיהָ
  choice: 她所有的神像
  rationale: 此词在本节指偶像或造出的神像；译作“神像”既与前面的“雕刻偶像”有所区分，也保留原文语义重叠。
- source_word: אָשִׂים שְׁמָמָה
  choice: 我都要使其荒废
  rationale: 表达说话者亲自使这些神像落入荒凉、毁弃状态，保留第一人称审判宣告。
- source_word: קִבָּצָה
  choice: 她……聚集这些
  rationale: 阴性单数主语指人格化的撒马利亚；“这些”承接前文财物或物件，不把所指限定得过窄。
- source_word: וְעַד אֶתְנַן זוֹנָה יָשׁוּבוּ
  choice: 这些也必归回作妓女的酬金
  rationale: 保留שוב“返回、归回”的基本意义，并在汉语中表达这些财物将重新进入妓女酬金的领域。
theological_decisions:
- issue: 以卖淫比喻偶像崇拜和由此所得的财富
  choice: 正文明确保留“妓女”和“酬金”的措辞
  alternative: 意译为“不义之财”或“拜偶像所得”
  rationale: 原文反复使用אֶתְנַן和זוֹנָה，强烈的性不忠隐喻是先知谴责的一部分，不宜在正文中弱化。
- issue: 阴性形式的所指
  choice: 以“她”指人格化的撒马利亚
  alternative: 以“它”指城市
  rationale: 原文持续使用阴性形式，且与妓女隐喻相连；“她”更能保留人格化城市的修辞。
- issue: 末句“归回”的具体含义
  choice: 正文译为“归回作妓女的酬金”
  alternative: 译为“又要成为妓女的酬金”或理解为战利品转作异地庙妓收入
  rationale: 原文明确表达返回，却没有说明具体实现机制；译文保留其开放性，不擅自确定历史或祭仪细节。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。保留人格化城市的“她”、卖淫酬金的尖锐隐喻，以及末句关于财物如何“归回”的真实含混；避免古奥措辞和宗派化解释。
