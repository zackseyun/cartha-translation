  text: וְ/נָמַ֤סּוּ הֶֽ/הָרִים֙ תַּחְתָּ֔י/ו וְ/הָ/עֲמָקִ֖ים יִתְבַּקָּ֑עוּ כַּ/דּוֹנַג֙ מִ/פְּנֵ֣י הָ/אֵ֔שׁ כְּ/מַ֖יִם מֻגָּרִ֥ים בְּ/מוֹרָֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/001/004.yaml
  text: And the mountains will melt beneath him, and the valleys will split open, like wax before the fire, like waters poured down a slope.
translation:
  language: zh_hans
  text: 群山要在他脚下熔化，山谷要裂开，如蜡在火中熔化，又如水沿斜坡倾泻而下。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְנָמַסּוּ
  choice: 要……熔化
  rationale: נמס表示熔化或溶解；“熔化”既自然，也与后面的蜡之比喻直接呼应。
- source_word: הֶהָרִים
  choice: 群山
  rationale: 以现代汉语自然表达带定冠词的复数名词，同时保留诗歌的宏大意象。
- source_word: תַּחְתָּיו
  choice: 在他脚下
  rationale: 原文为“在他下面”，三单阳性后缀承接上文的耶和华；“在他脚下”在汉语中自然地表现大地位于他下方并因他临到而震动的图景。
- source_word: וְהָעֲמָקִים
  choice: 山谷
  rationale: עֲמָקִים指谷地、低洼深处；“山谷”与前面的“群山”形成清楚而自然的对应。
- source_word: יִתְבַּקָּעוּ
  choice: 要裂开
  rationale: 该词表达裂开、迸裂；“裂开”简洁有力，并保留原文没有明说施动者的形式。
- source_word: כַּדּוֹנַג
  choice: 如蜡
  rationale: דּוֹנַג即蜡；直译保留比喻。
- source_word: מִפְּנֵי הָאֵשׁ
  choice: 在火前
  rationale: 字面是“从火面前”，表示处于火的作用或临在之下；“在火前”简洁，并保留与神临在意象可能形成的措辞呼应。
- source_word: כְּמַיִם מֻגָּרִים
  choice: 又如水……倾泻
  rationale: מֻגָּרִים是由נגר而来的被动分词，表示被倾倒或使之流下；“水……倾泻”在汉语中生动自然。
- source_word: בְּמוֹרָד
  choice: 顺坡
  rationale: מוֹרָד指下坡、斜坡或下降之处；“顺坡”清楚表达水向下流泻的方向。
theological_decisions:
- issue: “在他脚下”中代词的指代
  choice: 保留第三人称“他”，承接上文临到的耶和华
  alternative: 直接改写为“在耶和华脚下”
  rationale: 原文使用代词，指向弥迦书1:3的耶和华。保留“他”维持经文之间的衔接，也避免在本节重复原文未重复的神名。
- issue: 两个比喻与前两分句的对应关系
  choice: 按原文次序并列呈现，不明确限定每个比喻只修饰某一个地貌变化
  alternative: 明确解释为群山像蜡熔化、山谷像水流泻
  rationale: 希伯来诗句容许读者把两个比喻分别对应前文，也可能把它们共同视为大地崩解的整体描写；译文保留这种诗性张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“群山”“倾泻”保留先知诗歌的力度；全句节奏紧凑，没有加入解释性神学术语。
