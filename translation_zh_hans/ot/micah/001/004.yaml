revisions:
- from: 群山要在他脚下熔化，山谷要裂开，如蜡在火前熔化，又如水顺坡倾泻。
  to: 群山要在他脚下熔化，山谷要裂开，如蜡在火中熔化，又如水沿斜坡倾泻而下。
  rationale: 修订仅消除“在火前”的现代汉语歧义，并使水流下坡的表达更自然。仍按原文次序并列两个比喻，未把它们解释性地一一限定于前面的某个地貌变化；也保留上文语境所指的代词“他”。
