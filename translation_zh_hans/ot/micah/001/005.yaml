id: MIC.1.5
reference: Micah 1:5
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: בְּ/פֶ֤שַׁע יַֽעֲקֹב֙ כָּל זֹ֔את וּ/בְ/חַטֹּ֖אות בֵּ֣ית יִשְׂרָאֵ֑ל מִֽי פֶ֣שַׁע יַעֲקֹ֗ב הֲ/לוֹא֙ שֹֽׁמְר֔וֹן וּ/מִי֙ בָּמ֣וֹת יְהוּדָ֔ה הֲ/ל֖וֹא יְרוּשָׁלִָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/001/005.yaml
  text: All this is because of Jacob’s transgression[a], and because of the sins of the house of Israel[b]. What is Jacob’s transgression? Is it not Samaria? And what are the high places of Judah? Are they not Jerusalem?
translation:
  language: zh_hans
  text: 这一切，都是因雅各的悖逆[a]，因以色列家的罪。雅各的悖逆是什么呢？不就是撒玛利亚吗？犹大的丘坛[b]是什么呢？不就是耶路撒冷吗？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “悖逆”也可译作“过犯”；本节两处均译自同一个希伯来词。
    reason: lexical_alternative
  - marker: b
    text: “丘坛”指设在高处或高地的敬拜场所，常与未经许可或偶像崇拜的祭祀有关。
    reason: cultural_note
lexical_decisions:
- source_word: בְּ/פֶשַׁע
  choice: 因……的悖逆
  rationale: 介词 בְּ 在此依上下文表示原因；פֶשַׁע 指向对上帝的背叛，以“悖逆”表达其主动反叛的力度，也适合现代汉语。
- source_word: יַעֲקֹב
  choice: 雅各
  rationale: 保留希伯来原文的专名，不将其同化为“以色列”，以保存与“以色列家”之间的诗体平行和修辞张力。
- source_word: כָּל זֹאת
  choice: 这一切
  rationale: 自然承接上文审判景象，同时不在正文中增添原文没有明说的“审判”等解释性名词。
- source_word: וּ/בְ/חַטֹּאות
  choice: 因……的罪
  rationale: 与前一分句平行，介词同样表原因；חַטֹּאות 在控罪语境中指“罪”，并非“赎罪祭”。
- source_word: בֵּית יִשְׂרָאֵל
  choice: 以色列家
  rationale: 保留原文的家族—民族表达及其盟约语感，也与“雅各”形成平行。
- source_word: מִי
  choice: 是什么
  rationale: 原文字面可作“谁”，但这里的问句要求辨明悖逆的所在或代表；现代汉语用“是什么”较自然，并保留修辞性认定。
- source_word: פֶשַׁע
  choice: 悖逆
  rationale: 与前一处用词一致，以显出原文重复；此词也可译“过犯”，故设脚注说明。
- source_word: הֲ/לוֹא
  choice: 不就是……吗
  rationale: 该疑问形式预期肯定回答；“不就是……吗”自然传达希伯来文反问语气。
- source_word: שֹׁמְרוֹן
  choice: 撒玛利亚
  rationale: 采用通行中文地名，正文保留其作为北国首都、代表罪恶中心的转喻表达。
- source_word: בָּמוֹת
  choice: 丘坛
  rationale: 指用于祭祀的高处或高地敬拜场所；“丘坛”是简洁、较为通行的圣经汉语表达，并由脚注补充文化背景。
- source_word: יְהוּדָה
  choice: 犹大
  rationale: 采用通行中文专名。
- source_word: יְרוּשָׁלִָם
  choice: 耶路撒冷
  rationale: 采用通行中文地名，并保留其作为犹大宗教与政治中心的转喻作用。
theological_decisions:
- issue: “雅各的悖逆”与“犹大的丘坛”所指为何
  choice: 保留反问结构，以撒玛利亚和耶路撒冷作为北国、南国罪恶及不当敬拜中心的转喻性答案。
  alternative: 可将其解释性地改写为“雅各悖逆的根源在哪里”或把复数“丘坛”调整为单数“丘坛”。
  rationale: 希伯来文本直接用两座首都回答反问，形成刻意而尖锐的认定；正文不展开解释，也不消除“丘坛”复数与“耶路撒冷”单一城名之间的张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“这一切，都是因……”明确表达原文的因果关系；反问句用“不就是……吗”呈现预期肯定回答的语气。保留“雅各”“以色列家”及“丘坛”复数所形成的原文结构与张力。
