id: MIC.4.3
reference: Micah 4:3
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/שָׁפַ֗ט בֵּ֚ין עַמִּ֣ים רַבִּ֔ים וְ/הוֹכִ֛יחַ לְ/גוֹיִ֥ם עֲצֻמִ֖ים עַד רָח֑וֹק וְ/כִתְּת֨וּ חַרְבֹתֵי/הֶ֜ם לְ/אִתִּ֗ים וַ/חֲנִיתֹֽתֵי/הֶם֙ לְ/מַזְמֵר֔וֹת לֹֽא יִשְׂא֞וּ גּ֤וֹי אֶל גּוֹי֙ חֶ֔רֶב וְ/לֹא יִלְמְד֥וּ/ן ע֖וֹד מִלְחָמָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/004/003.yaml
  text: And he will judge between many peoples[a], and will arbitrate for strong nations far away; and they will beat their swords into plowshares and their spears into pruning hooks. Nation will not lift up sword against nation[c][b], nor will they learn war anymore.
translation:
  language: zh_hans
  text: 他必在许多民族之间施行审判，也必为远方的强国断定是非[a]；他们要把刀剑打成犁头[b]，把长矛打成修枝刀。国与国不再举刀相向，也不再学习战争[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “断定是非”也可译作“责备”或“仲裁”。
    reason: lexical_alternative
  - marker: b
    text: “犁头”也可译作“犁刃”。
    reason: lexical_alternative
  - marker: c
    text: “学习战争”也可理解为“训练作战”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁפַט בֵּין עַמִּים רַבִּים
  choice: 他必在许多民族之间施行审判
  rationale: שׁפט保留司法性的“审判”，不扩展为“统治”；עַמִּים译作“民族”，以区别于后文更偏政治实体的גּוֹיִם。未明说“他”的身份，保留原文在本节中的含蓄。
- source_word: וְהוֹכִיחַ לְגוֹיִם עֲצֻמִים עַד רָחוֹק
  choice: 为远方强盛的国家裁定是非
  rationale: 使役式הוֹכִיחַ在与“施行审判”平行的语境中具有裁断、仲裁之意；“裁定是非”兼顾司法语义和现代汉语的自然表达。עֲצֻמִים译为“强盛”，עַד רָחוֹק译为“远方”。
- source_word: וְכִתְּתוּ חַרְבֹתֵיהֶם לְאִתִּים
  choice: 他们要把刀剑打成犁头
  rationale: כתת表示敲打、打制；אִתִּים指耕作用具或其刃部，“犁头”是中文中准确而自然的对应。
- source_word: וַחֲנִיתֹתֵיהֶם לְמַזְמֵרוֹת
  choice: 把长矛打成修枝刀
  rationale: חֲנִיתֹת为“长矛”，מַזְמֵרוֹת为修剪葡萄藤或枝条的工具；“修枝刀”较“修枝钩”更符合现代普通读者的表达习惯。
- source_word: לֹא יִשְׂאוּ גּוֹי אֶל גּוֹי חֶרֶב
  choice: 国与国不再刀剑相向
  rationale: נשא חרב是举刀敌对的习语；“刀剑相向”自然传达敌对攻击之意，并以“国与国”保留单数名词的分配性表达。
- source_word: וְלֹא יִלְמְדוּן עוֹד מִלְחָמָה
  choice: 也不再学习作战
  rationale: למד מלחמה既可指学习战争，也可指接受作战训练；正文采用较贴近原文的“学习作战”，脚注保留“训练作战”的可能。
theological_decisions:
- issue: 本节开头两个单数动词的主语
  choice: 使用“他”，不在本节中明确其身份
  alternative: 明确译为“耶和华”、弥赛亚君王，或人格化的锡安／耶路撒冷
  rationale: 希伯来文本的主语未明说，须由上文补足。译文不把某一神学认定直接加入本节，以保留原文的指涉张力。
- issue: 和平图景的性质与范围
  choice: 按先知性陈述直译为列国停止武装敌对和学习作战
  alternative: 将其解释性改写为纯属灵和平、特定历史时期，或某种末世时间表
  rationale: 本节本身描绘国际审判、武器改作农具和战争教育终止；译文不额外限定其实现方式或时间框架。
translation_notes:
  register: 采用庄重、清晰的现代标准汉语。“施行审判”“裁定是非”保持先知文本的司法语域；“刀剑相向”使希伯来习语在中文中自然有力。所有脚注标记均置于其所说明的词语之后。
