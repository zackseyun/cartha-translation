  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/יָשְׁב֗וּ אִ֣ישׁ תַּ֧חַת גַּפְנ֛/וֹ וְ/תַ֥חַת תְּאֵנָת֖/וֹ וְ/אֵ֣ין מַחֲרִ֑יד כִּי פִ֛י יְהוָ֥ה צְבָא֖וֹת דִּבֵּֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/004/004.yaml
  text: And each will sit under his vine and under his fig tree[a], and there will be no one to make them afraid[b], for the mouth of Yahweh of Armies has spoken.
translation:
  language: zh_hans
  text: 各人[a]都要坐在自己的葡萄树下和无花果树下，无人使他们惊恐；因为万军之雅威[b]亲口说了这话。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文用阳性单数“一个男人／人”，在这里具有逐一分配的作用，即群体中的各人。
    reason: lexical_alternative
  - marker: b
    text: “万军之雅威”传统译作“万军之耶和华”；“万军”也可理解为“众军”。
    reason: alternative_reading
lexical_decisions:
- source_word: וְיָשְׁבוּ
  choice: 都要坐
  rationale: 保留“坐”的具体画面；在此和平预言中，这也含有安居、定居之意。
- source_word: אִישׁ
  choice: 各人
  rationale: 单数名词与复数动词搭配，具有逐一分配的作用。“各人”自然表达每一个人，同时不抹去原文形式，具体语法信息见脚注。
- source_word: תַּחַת גַּפְנוֹ וְתַחַת תְּאֵנָתוֹ
  choice: 在自己的葡萄树下和无花果树下
  rationale: 保留葡萄树与无花果树这一象征平安、安稳和丰足的具体图景；“自己的”统摄两个并列短语，符合现代汉语表达。
- source_word: וְאֵין מַחֲרִיד
  choice: 无人使他们惊恐
  rationale: מַחֲרִיד指使人战栗或害怕者；“他们”承接前面具有分配意义的“各人”。
- source_word: כִּי
  choice: 因为
  rationale: 在这里引出上述应许可靠的根据。
- source_word: פִּי יְהוָה צְבָאוֹת
  choice: 万军之雅威亲口
  rationale: “亲口”自然保留希伯来文“……的口”所强调的亲自宣告及其确定性；יְהוָה按其专名译作“雅威”，צְבָאוֹת译作“万军”。
- source_word: דִּבֵּר
  choice: 说了这话
  rationale: 希伯来文完成式在预言宣告中强调话语已经发出、必然可靠；补出“这话”使“亲口说了”在汉语中完整自然。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名。音译“雅威”保留其作为盟约专名的性质；脚注列出中文传统译法。
- issue: אִישׁ 的阳性形式与分配意义
  choice: 各人
  alternative: 各个男人；每一个人
  rationale: 此处重点是复数群体中的每一个个体。正文用自然的“各人”，脚注说明希伯来文为阳性单数，避免把语法形式误解为只限男性，也不隐去其原文形态。
- issue: יְהוָה צְבָאוֹת 的称号
  choice: 万军之雅威
  alternative: 万军之耶和华；雅威——众军之主
  rationale: “万军”保留 צְבָאוֹת 的军旅及天上众军意象，不把其范围限定为单一解释。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“坐在自己的葡萄树下和无花果树下”保留先知文学的具体和平图景；分号划分应许与其神圣保证。“亲口说了这话”既传达原文“口”的强调，也避免生硬直译。
