id: MIC.4.5
reference: Micah 4:5
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כִּ֚י כָּל הָ֣/עַמִּ֔ים יֵלְכ֕וּ אִ֖ישׁ בְּ/שֵׁ֣ם אֱלֹהָ֑י/ו וַ/אֲנַ֗חְנוּ נֵלֵ֛ךְ בְּ/שֵׁם יְהוָ֥ה אֱלֹהֵ֖י/נוּ לְ/עוֹלָ֥ם וָ/עֶֽד־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/micah/004/005.yaml
  text: For all the peoples walk[a], each in the name of his god[c][b], but we will walk in the name of Yahweh our God forever and ever.
translation:
  language: zh_hans
  text: 因为万民都各自奉自己的神的名而行[a]；但我们要奉耶和华[b]我们上帝的名而行，直到永永远远。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “万民”也可译作“列国”。原文“行”在这里可包含按某种道路生活、效忠的意思，不只是步行。
    reason: lexical_alternative
  - marker: b
    text: “耶和华”音译希伯来文的神名יהוה（YHWH）；也常按其可能的古代读音译作“雅威”。
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文并为先前的应许提供说明或依据；“因为”自然保留这一话语联系。
- source_word: כָּל הָעַמִּים
  choice: 万民
  rationale: עַמִּים可指不同族群或列国；“万民”在现代中文中简洁庄重，并保留复数群体的意味。
- source_word: יֵלְכוּ / נֵלֵךְ
  choice: 而行 / 要……而行
  rationale: הלך在“奉……的名”这一宗教语境中不只表示移动，也涉及生活方式和效忠；重复译作“行”保留两半句的平行。
- source_word: אִישׁ
  choice: 各自
  rationale: 此处אִישׁ对复数主语起逐一分配作用，并非特指男性；“各自”准确表达每一群体分别有所归属。
- source_word: בְּשֵׁם
  choice: 奉……的名
  rationale: 该短语可表达凭借、归属、呼求或效忠；“奉……的名”是自然且透明的中文表达，并保留两半句的重复。
- source_word: אֱלֹהָיו
  choice: 自己神
  rationale: 单数名词和第三人称阳性单数后缀与分配性的אִישׁ相应；中文用“自己神”表达各自所奉的神，不擅自改为复数。
- source_word: וַאֲנַחְנוּ
  choice: 但我们
  rationale: ו形式上是“和”，此处却明显对照万民与“我们”的选择，故用“但”表达语境中的转折。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文读者熟悉的专名形式音译四字神名，避免用称号取代原文中的名字。
- source_word: אֱלֹהֵינוּ
  choice: 我们上帝
  rationale: 直接表达带第一人称复数后缀的盟约归属关系；“上帝”是现代标准汉语中庄重自然的称呼。
- source_word: לְעוֹלָם וָעֶד
  choice: 直到永永远远
  rationale: 原文成对表达强化持续不止的时间；“直到永永远远”保留这种强调和庄重语气。
theological_decisions:
- issue: 四字神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用以色列上帝的专名。中文正文采用广为人知的“耶和华”，同时以脚注说明另一种按学界常见重构的音译“雅威”，不以“主”这一称号代替神名。
- issue: 万民奉各自之神的名而行，是陈述还是认可
  choice: 按原文保留陈述性的对照，不加入赞许或谴责
  alternative: 将前半句解释为对异教道路的明确认可或明确斥责
  rationale: 本节以万民现有或惯常的宗教归属，对照“我们”坚定持久的委身。原文在本句中没有明说认可这些神真实存在或赞许这种行为，因此译文不替经文消解这一神学张力。
- issue: 分配性的אִישׁ是否译成男性个体
  choice: 各自
  alternative: 各人／每个男人
  rationale: 该词在这里配合“万民”起分配作用，焦点是每一族群或其中各方的归属，并不专指男性。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。两次使用“奉……的名而行”以保存希伯来文的平行结构；用“万民”“永永远远”维持先知文本的凝练和力度。
