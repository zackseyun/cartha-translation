source:
  edition: WLC
  text: עַתָּ֕ה לָ֥/מָּה תָרִ֖יעִי רֵ֑עַ הֲ/מֶ֣לֶךְ אֵֽין בָּ֗/ךְ אִֽם יוֹעֲצֵ/ךְ֙ אָבָ֔ד כִּֽי הֶחֱזִיקֵ֥/ךְ חִ֖יל כַּ/יּוֹלֵדָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/004/009.yaml
  text: Why do you cry out so loudly? Is there no king in you? Has your counselor perished[c][b][a], that labor pains have seized you like a woman giving birth?
translation:
  language: zh_hans
  text: 现在，你为什么大声呼喊[a]？难道你中间[b]没有君王吗？你的谋士灭亡了吗，以致产痛像抓住临产的妇人那样抓住了你[c]？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “大声呼喊”也可译作“高声喊叫”或“发出响亮的呼声”；原词既可指呼喊，也可指呐喊，此处语境偏向痛苦中的呼声。
    reason: lexical_alternative
  - marker: b
    text: 直译“在你里面”。这里可能指城中或百姓中间，因此正文译作“你中间”。
    reason: lexical_alternative
  - marker: c
    text: “抓住了你”也可译作“攫住了你”或“紧紧抓住你”。
    reason: lexical_alternative
lexical_decisions:
- source_word: עַתָּה לָמָּה
  choice: 现在，你为什么
  rationale: עַתָּה明确具有“现在、如今”之意，并与לָמָּה构成带有转折推进意味的反问；译出“现在”既忠于原文，也适合本节的语篇转折。
- source_word: תָרִיעִי רֵעַ
  choice: 大声呼喊
  rationale: 动词可指发出呼声或喊声，רֵעַ在此强化声音的响亮程度；上下文是苦难中的呼喊，因此译作“大声呼喊”。
- source_word: הֲמֶלֶךְ אֵין בָּךְ
  choice: 难道你中间没有君王吗
  rationale: 保留原文“在你里面／中间”的空间表达，同时用“难道……吗”传达希伯来语疑问词所带的反问语气；“你”所指的城仍按阴性拟人来理解，但不在正文中增添名称。
- source_word: יוֹעֲצֵךְ אָבָד
  choice: 你的谋士灭亡了吗
  rationale: יוֹעֵץ指提供谋略或劝告的人；“谋士”比现代心理辅导语境中的“咨询者”更符合君王与城邦背景。אָבַד保留为较强烈的“灭亡”，不弱化成“离开了”。
- source_word: הֶחֱזִיקֵךְ חִיל
  choice: 产痛抓住了你
  rationale: חִיל在分娩比喻中指生产的阵痛；הֶחֱזִיק表达强力抓住、攫住。中文以“产痛抓住了你”保留原文鲜明的拟人意象。
- source_word: כַּיּוֹלֵדָה
  choice: 如同抓住临产的妇人一样
  rationale: 分词指正在生产的女子。“临产的妇人”自然明确；补出比较结构中的“抓住”，使中文关系清楚，而未增加新的事件内容。
theological_decisions:
- issue: 锡安／耶路撒冷以女性形象受呼语
  choice: 保留第二人称称呼及临产妇人的比喻，不在本节正文中补出“锡安女子”或“耶路撒冷”。
  alternative: 在正文中直接写明“锡安女子”或“耶路撒冷”。
  rationale: 希伯来语动词和代词为阴性单数，结尾又明说临产妇人，但本节本身没有写出受话者名称。保留拟人意象而不补名，可避免把上下文判断写进经文本身。
- issue: 君王与谋士是否指向特定人物
  choice: 按原文保留普通称谓“君王”和“谋士”。
  alternative: 将两者明确解释为上帝、弥赛亚或某位历史君王及其顾问。
  rationale: 本节的反问可容纳政治与神学层面的张力，但原文未在此直接指定人物；翻译不应替读者排除可能的指涉。
- issue: כִּי引出的末句与前面反问的关系
  choice: 译作另一个承接性的反问“为何……”，呈现痛苦与前述疑问之间的因果／说明关系。
  alternative: 译作“以致产痛抓住了你”或“因为产痛抓住了你”。
  rationale: כִּי在此可作因果或说明连接，整体又延续לָמָּה开启的质问。中文“为何”使反问自然连贯，但不把逻辑关系限定为单一的机械因果。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。保留“现在”以对应原文עַתָּה；三个连续问句呈现先知话语的急迫感。以“谋士”“产痛”“临产的妇人”维持古代政治语境与分娩意象，同时避免生硬的逐词仿译。
