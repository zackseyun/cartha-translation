    rationale: “为何产痛抓住了你，如同抓住临产的妇人一样？”没有明确比较分句的施事与动作衔接。原文是“产痛抓住你，如同［抓住］临产妇人”；应将省略的动作在中文中明确，以免损失比较关系。
  - severity: low
