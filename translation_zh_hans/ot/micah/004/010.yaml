  source_fidelity: 整体忠实呈现了两项阴性单数命令、锡安的人格化称呼、离城—田野—巴比伦的进程，以及在巴比伦获救并由雅威救赎的双重应许。“获救”与“救赎”也恰当地保留了 נצל 与 גאל 的区别。不过，“直到巴比伦”在汉语中没有明确表达 וּבָאת（你将来到／到达）的动作，容易被理解为前述“住在田野”持续至巴比伦；应补出“到巴比伦去”。
