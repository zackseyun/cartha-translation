reference: Micah 4:10
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: ח֧וּלִי וָ/גֹ֛חִי בַּת צִיּ֖וֹן כַּ/יּֽוֹלֵדָ֑ה כִּֽי עַתָּה֩ תֵצְאִ֨י מִ/קִּרְיָ֜ה וְ/שָׁכַ֣נְתְּ בַּ/שָּׂדֶ֗ה וּ/בָ֤את עַד בָּבֶל֙ שָׁ֣ם תִּנָּצֵ֔לִי שָׁ֚ם יִגְאָלֵ֣/ךְ יְהוָ֔ה מִ/כַּ֖ף אֹיְבָֽיִ/ךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/004/010.yaml
  text: Writhe and groan[a], daughter Zion, like a woman giving birth; for now you will go out from the city and dwell in the field, and you will go as far as Babylon. There you will be rescued[b]; there Yahweh will redeem you from the hand of your enemies.
translation:
  language: zh_hans
  text: 锡安女子啊，要像临产的妇人一样痛苦地翻腾，发出呻吟[a]；因为现在你要从城里出去，住在田野，并要到巴比伦去。你必在那里获救[b]；雅威必在那里把你从仇敌手中救赎出来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “呻吟”也可译作“呼喊”；希伯来语动词可指因疼痛而发出的叫声，与分娩的比喻相合。
    reason: lexical_alternative
  - marker: b
    text: “获救”也可译作“被解救”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ח֧וּלִי
  choice: 辗转痛苦
  rationale: 阴性单数命令式；在分娩语境中表示因剧痛而扭动、翻腾。“辗转痛苦”保留身体与痛楚两方面的含义。
- source_word: וָ/גֹ֛חִי
  choice: 发出呻吟
  rationale: 与前一命令式并列，表示疼痛中的呻吟或呼喊；正文采用自然的汉语表达，并以脚注保留“呼喊”的可能。
- source_word: בַּת צִיּ֖וֹן
  choice: 锡安女子
  rationale: 这是将锡安人格化的先知性称呼。“锡安女子”简洁自然，也避免把它误解为单指某个女儿。
- source_word: כַּ/יּֽוֹלֵדָ֑ה
  choice: 像临产的妇人一样
  rationale: 明确保留分娩的比喻；“临产的妇人”在现代汉语中自然且庄重。
- source_word: מִ/קִּרְיָ֜ה
  choice: 从城里
  rationale: 此处的“城”按上下文指耶路撒冷；不在正文中补出专名，以保留原文表达。
- source_word: וְ/שָׁכַ֣נְתְּ בַּ/שָּׂדֶ֗ה
  choice: 住在田野
  rationale: 动词意为居住、停留，名词为田野；直译即可传达离开城防、暴露在野外的处境，无须额外加入“露天”。
- source_word: וּ/בָ֤את עַד בָּבֶל֙
  choice: 直到巴比伦
  rationale: עַד 表示所到达的界限或目的地；与前面的“出去”连读时，“直到巴比伦”简练地保留其终点意味。
- source_word: שָׁ֣ם תִּנָּצֵ֔לִי
  choice: 你必在那里获救
  rationale: נצל 的尼法勒形表示从危险或权势下被解救。“获救”是清楚、现代的被动结果表达。
- source_word: יִגְאָלֵ֣/ךְ
  choice: 把你……救赎出来
  rationale: גאל 带有亲属赎回、收回及恢复归属的分量；“救赎”与前句“获救”区分开来，并保留其关系性和盟约性内涵。
- source_word: יְהוָ֔ה
  choice: 雅威
  rationale: 以现代汉语常用音译呈现四字神名，保留其作为专名的性质，而不以称号替代。
- source_word: מִ/כַּ֖ף אֹיְבָֽיִ/ךְ
  choice: 从仇敌手中
  rationale: 保留希伯来语以“手”表示权势和控制的惯用比喻；这一说法在汉语中也很自然。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。正文采用“雅威”，既保留专名，也避免用称号“主”取代；“耶和华”是传统音译，但较少反映通常重构的读音。
- issue: 流亡与复兴语境中 גאל 的力度
  choice: 救赎
  alternative: 拯救；赎回；领回
  rationale: 本节先用 נצל 表示“获救”，随后用 גאל。分别译作“获救”和“救赎”，可避免抹平两个动词，并保留 גאל 所含的赎回和恢复归属意味。
- issue: 预言中痛苦与拯救的张力
  choice: 保留“现在”受苦、到巴比伦后获救的次序
  alternative: 将巴比伦淡化为一般性流亡之地
  rationale: 原文明确指出离城、田野、巴比伦以及在那里得救的进程；不应为消解张力而弱化具体地点或调整事件次序。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。句式保留先知话语的直接呼告和由苦难转向救赎的节奏；“锡安女子”保持人格化意象，“雅威”作为神名处理。
