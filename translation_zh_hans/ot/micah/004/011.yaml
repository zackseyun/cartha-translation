  text: וְ/עַתָּ֛ה נֶאֶסְפ֥וּ עָלַ֖יִ/ךְ גּוֹיִ֣ם רַבִּ֑ים הָ/אֹמְרִ֣ים תֶּחֱנָ֔ף וְ/תַ֥חַז בְּ/צִיּ֖וֹן עֵינֵֽי/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/004/011.yaml
  text: And now many nations have gathered against you[a], saying, “Let her be defiled[b], and let our eyes look on Zion.”
translation:
  language: zh_hans
  text: 如今，许多列国聚集起来攻击你，说：“任她受玷污吧[a]！愿我们亲眼看着锡安[b]！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“愿她被污染”或“愿她遭亵渎。”这个希伯来语动词可以指在道德上或礼仪上陷入污秽。
    reason: lexical_alternative
  - marker: b
    text: 直译：“愿我们的眼睛看着锡安。”这句话表达列国怀着敌意，想要目睹锡安受辱。
    reason: idiom_and_implicit_sense
lexical_decisions:
- source_word: וְעַתָּה
  choice: 如今
  rationale: 既保留话语转折和当前时点，也符合现代汉语叙事表达；句首承接关系可由语境自然体现。
- source_word: נֶאֶסְפוּ עָלַיִךְ
  choice: 聚集起来攻击你
  rationale: נֶאֶסְפוּ 表示已经聚集而形成当前局面；敌对语境使 עָלַיִךְ 具有“攻击、敌对”的含义。
- source_word: גּוֹיִם רַבִּים
  choice: 许多国
  rationale: 这里指多个政治或族群共同体；“国”简洁地对应 גּוֹיִם，并避免不必要地解释为个人群体。
- source_word: תֶּחֱנָף
  choice: 任她受玷污吧
  rationale: חנף 在此可指陷入污秽、被亵渎的状态；“受玷污”保留礼仪与道德层面的语义空间，“任……吧”传达列国恶意期盼的口吻。
- source_word: וְתַחַז בְּצִיּוֹן עֵינֵינוּ
  choice: 愿我们亲眼看着锡安
  rationale: 以“亲眼”自然地保留希伯来文“我们的眼睛”这一身体部位表达；“看着”不把锡安受辱的含义直接增补进正文，保留原文含蓄而敌对的语气。
theological_decisions:
- issue: 叙述中的第二人称与引语中的阴性第三人称是否统一
  choice: 保留“你”到“她”的转换
  alternative: 全句统一译为“你”
  rationale: עָלַיִךְ 直接称呼锡安为“你”，而引语中的 תֶּחֱנָף 是阴性单数，列国转而谈论锡安为“她”；保留转换能反映原文的修辞视角。
- issue: 是否在正文中明说列国观看的是锡安受辱或遭难
  choice: 正文只译“亲眼看着锡安”
  alternative: 译作“亲眼看锡安遭难”
  rationale: 敌意和幸灾乐祸可由上下文推知，但“遭难”不是该短语明说的宾语内容；不增补可保留原文的含蓄与张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“任她受玷污吧”表现列国冷酷的愿望；“亲眼看着”比逐字的“我们的眼睛看着”更自然，同时未将隐含的受辱情景写入正文。
