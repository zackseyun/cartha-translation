base_translation:
  language: en
  yaml_path: translation/ot/micah/004/014.yaml
  text: Now muster yourself in troops[a], daughter of troops; a siege is set against us[c][b]. With a rod they strike the judge of Israel on the cheek.
translation:
  language: zh_hans
  text: 现在，你要集结成队[a]，军队之女啊！我们已经遭到围困。他们要用杖击打[b]以色列的审判者[c]的脸颊。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“割伤自己吧”或“割划自己吧”。这个动词也可指结队集结；此处的军事和围城语境较支持后者。
    reason: lexical_alternative
  - marker: b
    text: 或译：“他们用杖击打。”希伯来语未完成式在这里既可表达将来的动作，也可生动呈现正在发生的事。
    reason: lexical_alternative
  - marker: c
    text: “以色列的审判者”可泛指以色列的统治者或领袖；结合下文，也有解释认为这里带有弥赛亚的预表意义。
    reason: alternative_reading
lexical_decisions:
- source_word: תִּתְגֹּדְדִי
  choice: 集结成队吧
  rationale: 该词形可指割伤自己，也可指结队集结。紧接着的“军队之女”和围城语境支持军事集结之义；“集结成队”也尽量保留其反身、聚合的色彩。
- source_word: בַת גְּדוּד
  choice: 军队之女
  rationale: 保留希伯来语“……之女”的拟人表达，不直接把所指解释为某一座城；גְּדוּד在围城语境中取“军队、队伍”之义。
- source_word: מָצוֹר
  choice: 围城之势
  rationale: 该名词可指围城、围城工事或围困状态。“围城之势”在中文中自然，也避免把具体所指限缩为某种器械或工事。
- source_word: שָׂם עָלֵינוּ
  choice: 已经临到我们
  rationale: 希伯来语动词为完成式，施事者未明说。中文采用不点明施事者的表达，保留原文的信息范围。
- source_word: בַּשֵּׁבֶט
  choice: 用棍杖
  rationale: שֵׁבֶט可指棍、杖或权杖；在击打动作中，“棍杖”最直接，同时不完全排除杖所具有的权力象征。
- source_word: יַכּוּ
  choice: 他们要……击打
  rationale: 未完成式在预言语境中可有将来意味，故正文用“要……击打”；其动作也可被理解为生动呈现的当前事件，脚注保留这一可能。
- source_word: עַל הַלְּחִי
  choice: 脸颊
  rationale: לְחִי可指脸颊或下颌；“脸颊”较能传达当众击打领袖所含的羞辱意味。
- source_word: שֹׁפֵט יִשְׂרָאֵל
  choice: 以色列的审判者
  rationale: 按שׁפט的词义直译为“审判者”，保留它与以色列早期领袖称谓的联系，不在正文中直接改释为君王或统治者。
theological_decisions:
- issue: “以色列的审判者”是否明确指弥赛亚
  choice: 正文采用不作身份判定的“以色列的审判者”
  alternative: 犹大当时的君王或领袖；预表弥赛亚的统治者
  rationale: 本节直接描写围城中以色列领袖受辱；下文伯利恒统治者的语境使一些读者看见弥赛亚意义，但本节本身没有明确确认该身份。因此译文保留原称谓，并以脚注说明可能范围。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“军队之女”刻意保留希伯来语拟人意象；“围城之势已经临到我们”避免擅自补出原文未明说的敌方施事者。
