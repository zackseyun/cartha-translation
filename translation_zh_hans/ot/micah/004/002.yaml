revisions:
- from: 许多民族必前来，说：“来吧，我们登上雅威的山，到雅各之上帝的殿去。他必把他的道路教导我们，我们也要行在他的路径上。”因为训诲[a]必从锡安而出，雅威的话必从耶路撒冷发出。
  to: 许多民族必前来，说：“来吧，我们登上雅威的山，到雅各之上帝的殿去，好让他将自己的道路指教我们，使我们行在他的路径上。”因为训诲[a]必从锡安而出；雅威的话必从耶路撒冷发出。
  rationale: 修订仅调整后续动词的句法关系及“教导”的中文搭配：以“好让……使……”呈现邀请前往敬拜之所、接受教导并遵行路径的连贯目的／期望，且不加入特定教义解释。脚注标记与内容均保留，仍准确对应“训诲”。
