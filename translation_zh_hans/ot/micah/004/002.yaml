  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְֽ/הָלְכ֞וּ גּוֹיִ֣ם רַבִּ֗ים וְ/אָֽמְרוּ֙ לְכ֣וּ וְ/נַעֲלֶ֣ה אֶל הַר יְהוָ֗ה וְ/אֶל בֵּית֙ אֱלֹהֵ֣י יַעֲקֹ֔ב וְ/יוֹרֵ֨/נוּ֙ מִ/דְּרָכָ֔י/ו וְ/נֵלְכָ֖ה בְּ/אֹֽרְחֹתָ֑י/ו כִּ֤י מִ/צִּיּוֹן֙ תֵּצֵ֣א תוֹרָ֔ה וּ/דְבַר יְהוָ֖ה מִ/ירוּשָׁלִָֽם׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/004/002.yaml
  text: And many nations will come and say[a], “Come, let us go up to the mountain of Yahweh, to the house of the God of Jacob, that he may teach us his ways and that we may walk in his paths.” For from Zion Torah will go out, and the word of Yahweh from Jerusalem.
translation:
  language: zh_hans
  text: 许多民族必前来，说：“来吧，我们登上雅威的山，到雅各之上帝的殿去，好让他将自己的道路指教我们，使我们行在他的路径上。”因为训诲[a]必从锡安而出；雅威的话必从耶路撒冷发出。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “训诲”原文为“妥拉”，也可译作“律法”或“教导”。
    reason: 保留תּוֹרָה兼具律法、教导及圣约传统的语义范围。
lexical_decisions:
- source_word: וְהָלְכוּ
  choice: 必前来
  rationale: 该词本义为“走、去”，但这里各民族朝锡安这一目的地而行；汉语从目的地视角说“前来”自然，也保留了迁移与朝圣的动态。
- source_word: גּוֹיִם רַבִּים
  choice: 许多民族
  rationale: 直接表达众多外邦民族的国际性范围；“民族”比“国家”更贴近这里作为人群共同体的含义。
- source_word: לְכוּ וְנַעֲלֶה
  choice: 来吧，我们登上
  rationale: 保留命令式与共同意愿的邀请语气，也保留前往耶路撒冷所用的“上行、登上”意象。
- source_word: הַר יְהוָה
  choice: 雅威的山
  rationale: הַר直译为“山”；יהוה按其专名音译为“雅威”，不以称号替代。
- source_word: בֵּית אֱלֹהֵי יַעֲקֹב
  choice: 雅各之上帝的殿
  rationale: בַּיִת字面是“家、房屋”，在此指敬拜之所；“殿”在现代汉语中自然地表达这一所指，同时没有扩写其功能。
- source_word: וְיוֹרֵנוּ מִדְּרָכָיו
  choice: 他必把他的道路教导我们
  rationale: ירה的使役形在此表示教导；介词מן在这一搭配中引出教导的内容。译文保留“道路”这一行为与生活方式的隐喻。
- source_word: וְנֵלְכָה בְּאֹרְחֹתָיו
  choice: 我们也要行在他的路径上
  rationale: 保留意愿语气及“行走”作为生活实践的隐喻，并用“路径”与前句“道路”形成诗意平行。
- source_word: כִּי
  choice: 因为
  rationale: 引出各民族寻求教导的理由，在现代汉语中清楚自然。
- source_word: תּוֹרָה
  choice: 训诲
  rationale: תּוֹרָה在此不只指成文法规，也可泛指来自上帝的教导。“训诲”既保留其权威性，又避免把意义缩窄为法律条文；脚注说明其他可能译法。
- source_word: וּדְבַר יְהוָה
  choice: 雅威的话
  rationale: 保留与“训诲”平行的表达，并将神名יהוה译为“雅威”。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文使用四字神名。音译“雅威”保留其专名性质，不以“主”这一称号替代；“耶和华”是另一传统音译。
- issue: 锡安语境中תּוֹרָה的译法
  choice: 训诲
  alternative: 妥拉；律法；教导
  rationale: 此处所指是从锡安发出的神圣教导，语义比法规更宽。“训诲”适合普通现代读者，并借脚注保留“妥拉／律法／教导”的词义张力。
- issue: ויורנו与ונלכה的语气关系
  choice: “他必……，我们也要……”
  alternative: “好让他……，好让我们……”
  rationale: 这些形式可理解为期待的将来行动，也可带目的或意愿色彩。正文采用自然的预期与响应表达，不把句法关系过度限定为单一目的结构。
translation_notes:
  register: 采用现代、庄重而清楚的普通话。以“来吧”“登上”“行在……路径上”保留朝圣邀请和诗歌意象；使用“雅威”呈现神的专名。脚注标记紧随“训诲”，与注释所解释的词准确对应。
