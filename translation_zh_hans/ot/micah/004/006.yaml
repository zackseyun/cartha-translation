  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: בַּ/יּ֨וֹם הַ/ה֜וּא נְאֻם יְהוָ֗ה אֹֽסְפָה֙ הַ/צֹּ֣לֵעָ֔ה וְ/הַ/נִּדָּחָ֖ה אֲקַבֵּ֑צָה וַ/אֲשֶׁ֖ר הֲרֵעֹֽתִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/004/006.yaml
  text: In that day[a], declares Yahweh, I will gather the lame, and I will assemble the outcast[c][b], even those whom I have afflicted.
translation:
  language: zh_hans
  text: “到那日，”耶和华宣告，“我必聚集瘸腿的[a]，招聚被赶逐的[b]，以及那些我曾使其遭难的人[c]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “瘸腿的”也可译作“跛行的”。希伯来文用阴性单数分词表达集合意义。
    reason: lexical_alternative
  - marker: b
    text: “被赶逐的”也可译作“被驱散的”或“被放逐的”。
    reason: lexical_alternative
  - marker: c
    text: “我曾使其遭难”也可译作“我曾使其受苦”。原文明确把先前的灾难归于耶和华；这句话也可能进一步描述前面的“被赶逐的”，而不一定另指一群人。
    reason: alternative_reading
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: 到那日
  rationale: 保留先知书常见的时间公式，现代汉语自然，同时维持庄重的预言语气。
- source_word: נְאֻם יְהוָה
  choice: 耶和华宣告
  rationale: נְאֻם是郑重的先知宣告公式；“宣告”比普通的“说”更能传达其庄严语气。
- source_word: אֹסְפָה
  choice: 我必聚集
  rationale: 准确表达אָסַף的聚拢、收集之意，并与本节复兴群体的语境相合。
- source_word: הַצֹּלֵעָה
  choice: 瘸腿的
  rationale: 该阴性单数分词具有集合意义，指以跛行、行动不便为特征的一群人；“瘸腿的”通俗而不失尊严。
- source_word: וְהַנִּדָּחָה
  choice: 被赶逐的
  rationale: 保留נדח的被动意味，即遭人驱赶、被逐离原处；不将它泛化为仅仅“分散的”。
- source_word: אֲקַבֵּצָה
  choice: 招聚
  rationale: 表达קבץ的召集、聚拢之意，并与前面的“聚集”形成自然而适度的词汇区别。
- source_word: וַאֲשֶׁר
  choice: 以及那些……的人
  rationale: 自然引入附加对象，同时保留它可能是又一群人、也可能进一步说明前述被赶逐者的语法开放性。
- source_word: הֲרֵעֹתִי
  choice: 我曾使其遭难
  rationale: 保留רעע使役式第一人称所表达的主动致灾或使受苦之意，也清楚呈现先前行动对当前对象的影响。
theological_decisions:
- issue: 上帝在“我曾使其遭难”中的直接施事作用
  choice: 明确译为“我曾使其遭难”
  alternative: 我曾容许其遭难
  rationale: 希伯来文使用使役式第一人称单数，明确把先前的灾难归于耶和华的行动。译文保留审判与随后复兴之间的神学张力，不弱化为单纯的许可。
- issue: וַאֲשֶׁר所指的是独立的第三群人，还是对“被赶逐的”的进一步描述
  choice: 正文用“以及那些……”保持可作为附加对象理解的表达
  alternative: 被赶逐、就是我曾使其遭难的
  rationale: 原文句法允许一定关联空间；正文不把两者强行等同，脚注说明这种可能性。
translation_notes:
  register: 采用现代、庄重而清楚的普通话。“聚集／招聚”保留原文两个近义动词的轻微差别；“瘸腿的”“被赶逐的”作为集合称谓，既贴近原文形式，也便于普通读者理解。
