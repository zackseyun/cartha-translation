id: MIC.4.1
reference: Micah 4:1
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/הָיָ֣ה בְּ/אַחֲרִ֣ית הַ/יָּמִ֗ים יִ֠הְיֶה הַ֣ר בֵּית יְהוָ֤ה נָכוֹן֙ בְּ/רֹ֣אשׁ הֶ/הָרִ֔ים וְ/נִשָּׂ֥א ה֖וּא מִ/גְּבָע֑וֹת וְ/נָהֲר֥וּ עָלָ֖י/ו עַמִּֽים׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/004/001.yaml
  text: And it will happen in the latter days that the mountain of the house of Yahweh will be established as the chief of the mountains[a], and it will be lifted up above the hills[c][b], and peoples will stream to it.
translation:
  language: zh_hans
  text: 在末后的日子[a]，耶和华殿的山必坚立，居众山之首[b]，高过众岭；万民都要如水涌向它[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “末后的日子”也可译作“最后的日子”或“将来的日子”。
    reason: alternative_reading
  - marker: b
    text: 希伯来文直译为“在众山的头上（或首位）”；可指位置最高，也可指地位最显著。
    reason: lexical_alternative
  - marker: c
    text: “如水涌向”原文用水流的动词描写万民前往这山。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: 到……，……必
  rationale: 这是引出未来先知性情景的惯用结构；融入现代汉语句式，以“到……必……”自然表达事件将要发生。
- source_word: בְּאַחֲרִית הַיָּמִים
  choice: 到末后的日子
  rationale: 保留先知性用语及其末世意味，同时不限定某一种末世论解释。
- source_word: הַר בֵּית יְהוָה
  choice: 耶和华殿的山
  rationale: בַּיִת 在此指耶和华的殿；此译法清楚表达这座山与圣殿的关系，也符合简明庄重的现代汉语。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经传统中对神圣四字名的通行音译，以区别于一般称号“主”。
- source_word: נָכוֹן
  choice: 坚立
  rationale: 表达稳固、确立的状态，并保留先知文学的庄重语体。
- source_word: בְּרֹאשׁ הֶהָרִים
  choice: 居众山之首
  rationale: 既保留“在众山之首”的空间意象，也可表达地位上的首要与尊荣，不将经文缩窄为纯粹地形或纯粹象征。
- source_word: וְנִשָּׂא הוּא מִגְּבָעוֹת
  choice: 高过众岭
  rationale: 简洁表达这山被高举、超越诸岭的状态，同时保持空间与尊荣两方面的开放性。
- source_word: וְנָהֲרוּ
  choice: 如水涌向
  rationale: 原动词以水流描绘万民前来；加“如水”使这一反常而鲜明的比喻在中文中清楚可感。
- source_word: עַמִּים
  choice: 万民
  rationale: 表达多个族群共同前来，且比偏政治性的“列国”更贴近“众民、各族人民”的词义。
- source_word: עָלָיו
  choice: 向它
  rationale: 所指为前述的山；用“向它”符合现代汉语移动表达。
theological_decisions:
- issue: 先知公式所指的未来时期
  choice: 末后的日子
  alternative: 最后的日子；将来的日子
  rationale: 保留该词组可能具有的末世性与较广义未来指向，不预先规定具体的时代体系。
- issue: 耶和华殿之山被高举的性质
  choice: 以“居众山之首，高过众岭”同时保留空间与尊荣的意象
  alternative: 只理解为地形上的升高；只理解为象征性的至高地位
  rationale: 希伯来语容许地理图像和地位显赫彼此交织；译文不替读者排除其中任何一面。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“坚立”“众山之首”“众岭”保留先知诗歌的凝练与平行结构；“如水涌向”显明原文刻意使用的水流意象。
