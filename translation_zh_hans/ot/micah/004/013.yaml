  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: ק֧וּמִי וָ/ד֣וֹשִׁי בַת צִיּ֗וֹן כִּֽי קַרְנֵ֞/ךְ אָשִׂ֤ים בַּרְזֶל֙ וּ/פַרְסֹתַ֨יִ/ךְ֙ אָשִׂ֣ים נְחוּשָׁ֔ה וַ/הֲדִקּ֖וֹת עַמִּ֣ים רַבִּ֑ים וְ/הַחֲרַמְתִּ֤י לַֽ/יהוָה֙ בִּצְעָ֔/ם וְ/חֵילָ֖/ם לַ/אֲד֥וֹן כָּל הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/004/013.yaml
  text: Rise and thresh[a], daughter Zion, for I will make your horn iron, and I will make your hooves bronze; you will crush many peoples, and I will devote their gain to Yahweh[b], and their wealth to the Lord of all the earth.
translation:
  language: zh_hans
  text: 锡安女子啊，起来踹谷吧！因为我要使你的角成为铁，使你的蹄成为青铜；你必碾碎众多民族。我必将他们的财利[a]全然归给[b]耶和华，将他们的财富归给全地之主。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “财利”或译“所得”或“掠物”。原文一词常指因贪求而得的利益，也可在本节语境中指战利品。
    reason: lexical_alternative
  - marker: b
    text: “全然归给”所译的希伯来语，指把某物完全划归上帝；在一些语境中也包含置于禁毁之下的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: ק֧וּמִי וָד֣וֹשִׁי
  choice: 起来踹谷吧
  rationale: 两个阴性单数命令式呼唤拟人化的锡安采取行动。“踹谷”保留牲畜踩踏脱粒的农业图像，并与下文的“蹄”及“碾碎”相呼应。
- source_word: בַת צִיּ֗וֹן
  choice: 锡安女子
  rationale: 这是先知书中把锡安人格化的称呼；“锡安女子”保留呼格作用，也符合现代中文圣经语体。
- source_word: קַרְנֵ֞ךְ אָשִׂ֤ים בַּרְזֶל֙
  choice: 我要使你的角如铁
  rationale: 保留“角”所表达的力量与攻击能力之比喻，不直接释作“力量”；“如铁”以自然中文传达赋予铁一般强度的意思。
- source_word: וּפַרְסֹתַ֨יִךְ֙ אָשִׂ֣ים נְחוּשָׁ֔ה
  choice: 使你的蹄如铜
  rationale: “蹄”延续踹谷牲畜的图像；נְחוּשָׁה 可指铜或青铜，此处用传统而简洁的“铜”，保留坚硬的金属意象。
- source_word: וַהֲדִקּ֖וֹת
  choice: 你必碾碎
  rationale: 该动词表达捣碎、压碎；“碾碎”力度鲜明，并自然延续踹谷的图像。
- source_word: עַמִּ֣ים רַבִּ֑ים
  choice: 众多民族
  rationale: עַמִּים 指多个族群或人民共同体；“众多民族”比“许多国家”更贴近原词。
- source_word: בִּצְעָ֔ם
  choice: 他们所得的财利
  rationale: בֶּצַע 可指利益、财利，也常带贪求或不义所得的负面色彩；正文不强行加入“不义”，而以脚注保留“掠物”等语境可能。
- source_word: וְהַחֲרַמְתִּ֤י לַֽיהוָה֙
  choice: 我必把……全然归给耶和华
  rationale: חרם 的使役形在此表示把财物彻底划归上帝，常含禁毁制度背景。“全然归给”保留彻底奉献之义，又不把作为宾语的财物直接译成“毁灭”。
- source_word: וְחֵילָ֖ם
  choice: 他们的财富
  rationale: חֵיל 可指实力、资源或财富；这里与“财利”平行，并作为归给上帝之物，“财富”最合语境。
- source_word: לַ/אֲד֥וֹן כָּל הָ/אָֽרֶץ
  choice: 归给全地之主
  rationale: 直译其普世主权称号，保留“耶和华”与“全地之主”的平行表达。
theological_decisions:
- issue: 战争得胜语境中 חרם 的译法
  choice: 全然归给
  alternative: 置于禁毁之下；彻底毁灭
  rationale: חרם 可表示将某物专归上帝，并常因而涉及禁毁；但本句的直接宾语是财利与财富，不是众民族。正文采用“全然归给”保留奉献和归属意义，脚注说明其较强的禁毁含义，避免把歧义单方面化解为毁灭。
- issue: בֶּצַע 是否明译为不义之财
  choice: 所得的财利
  alternative: 不义之财；掠物
  rationale: 该词常带贪婪、不正当获利的色彩，但也可较一般地指所得或利润。本节得胜语境容许理解为战利品；正文保持较宽的意义范围，脚注列出主要可能。
- issue: 第一人称“我”与第三人称“耶和华”并列
  choice: 保留“我必……归给耶和华”
  alternative: 把主语改作锡安，译为“你必……归给耶和华”
  rationale: 马所拉文本明确使用第一人称单数 וְהַחֲרַמְתִּי，因此保留突出的主语转换及其神学张力，不按上下文擅自改成第二人称。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“踹谷—蹄—碾碎”维持贯穿全句的农业及牲畜意象；分号划分上帝赋能、锡安行动与财物归属三个层次。保留“耶和华”这一专名，并保留原文第一人称说话者又提及耶和华的表达张力。
