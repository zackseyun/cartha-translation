  text: וְ/שַׂמְתִּ֤י אֶת הַ/צֹּֽלֵעָה֙ לִ/שְׁאֵרִ֔ית וְ/הַ/נַּהֲלָאָ֖ה לְ/ג֣וֹי עָצ֑וּם וּ/מָלַ֨ךְ יְהוָ֤ה עֲלֵי/הֶם֙ בְּ/הַ֣ר צִיּ֔וֹן מֵ/עַתָּ֖ה וְ/עַד עוֹלָֽם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/micah/004/007.yaml
  text: And I will make the lame a remnant[a], and the outcast a strong nation[b]; and Yahweh will reign over them on Mount Zion from now and forever.
translation:
  language: zh_hans
  text: 我必使那瘸腿的[a]成为余民，使那被赶走的[b]成为强盛之国；雅威必在锡安山作王，统治他们，从今直到永远。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “那瘸腿的”在原文中为阴性单数，很可能将受苦的锡安群体人格化。
    reason: 说明原文的语法形式及其集体指向，避免汉语读者误以为这里只指一个人。
  - marker: b
    text: 或译“那被放逐的”或“那被驱散的”。原词表示被迫离开或被赶走的人。
    reason: 保留该希伯来词在放逐、驱散与被赶走之间的词义幅度。
lexical_decisions:
- source_word: וְשַׂמְתִּי
  choice: 我要使……成为
  rationale: שׂוּם与结果性的介词לְ连用，表示“使……成为”；此译法准确而符合现代汉语。
- source_word: הַצֹּלֵעָה
  choice: 那瘸腿的
  rationale: 源自动词צלע“跛行、瘸腿”。原文为阴性单数，可能将受苦的群体人格化；汉语用“那瘸腿的”保留单数形象及其群体指向。
- source_word: לִשְׁאֵרִית
  choice: 成为余民
  rationale: שְׁאֵרִית是先知书中指审判后存留下来之人的重要用语；“余民”简洁保留其术语色彩。
- source_word: הַנַּהֲלָאָה
  choice: 那被赶到远方的
  rationale: 该形式指被迫离开、被驱散或放逐者；“被赶到远方”既保留被动含义，也契合流亡与复兴的语境。
- source_word: לְגוֹי עָצוּם
  choice: 成为强盛之国
  rationale: גּוֹי指国家或民族，עָצוּם在此表示强大、有力量；“强盛之国”自然保留其政治和群体意义。
- source_word: וּמָלַךְ יְהוָה עֲלֵיהֶם
  choice: 雅威必……作王治理他们
  rationale: מלך表示作王、掌权，עַל标明统治的对象；“作王治理他们”明确表达王权关系。יְהוָה以专名“雅威”音译，不以称号替代。
- source_word: בְּהַר צִיּוֹן
  choice: 在锡安山
  rationale: 介词בְּ在此标明雅威作王的地点；“在锡安山”符合现代汉语地名表达。
- source_word: מֵעַתָּה וְעַד עוֹלָם
  choice: 从今直到永远
  rationale: 该短语表示由现在延伸至无尽将来的持续时间；此译法庄重、清楚且贴近原文结构。
theological_decisions:
- issue: 受复兴者应译为单数人格化形象，还是明确改成复数群体
  choice: 保留“那瘸腿的”“那被赶到远方的”两个单数形象，同时用脚注说明其群体指向
  alternative: 译作“瘸腿的人……被赶到远方的人”，明确处理为复数群体
  rationale: 希伯来文两个表达均为阴性单数，很可能把锡安受苦的百姓人格化。保留单数可避免消除原文的诗性张力，而后文“他们”也显出其集体所指。
- issue: יהוה的译法
  choice: 译作专名“雅威”
  alternative: 译作称号“耶和华”或“主”
  rationale: 原文使用以色列上帝的四字神名；音译为“雅威”保留其作为专名的功能，不以称号代替。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“余民”“锡安山”“作王”等保留先知文学的核心意象；句式尽量贴近希伯来文的两组平行结构，同时避免生硬直译。
