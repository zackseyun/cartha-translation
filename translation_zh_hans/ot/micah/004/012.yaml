id: MIC.4.12
reference: Micah 4:12
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/הֵ֗מָּה לֹ֤א יָֽדְעוּ֙ מַחְשְׁב֣וֹת יְהוָ֔ה וְ/לֹ֥א הֵבִ֖ינוּ עֲצָת֑/וֹ כִּ֥י קִבְּצָ֖/ם כֶּ/עָמִ֥יר גֹּֽרְנָ/ה׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/004/012.yaml
  text: But they do not know the thoughts of Yahweh[a], and they do not understand his plan[b], for he has gathered them like sheaves to the threshing floor.
translation:
  language: zh_hans
  text: 然而，他们不知道耶和华的意念，也不明白他的谋划[a]；因为他把他们聚集起来，如同把禾捆聚到打谷场上[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “谋划”也可译作“旨意”或“计划”。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“像禾捆到打谷场”。禾捆被集中到打谷场接受打碾；这里的图像暗示列国被聚集起来接受审判。
    reason: cultural_note
lexical_decisions:
- source_word: וְהֵמָּה
  choice: 然而，他们
  rationale: וְ在上下文中带有转折意味，显明列国的行动与他们对耶和华旨意的无知形成对比；“然而”自然地传达这一语气。
- source_word: יָדְעוּ
  choice: 不知道
  rationale: 完成式在此表达当前持续的认知状态，现代汉语用“不知道”最为自然。
- source_word: מַחְשְׁבוֹת
  choice: 意念
  rationale: 该词可指思想、意图或计划；“意念”保留较宽的语义范围，并与后面的עֲצָה有所区别。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文读者熟悉的神圣名字译写，而不以“主”这一称号替代原文专名。
- source_word: הֵבִינוּ
  choice: 不明白
  rationale: בין强调理解或领会；“不明白”清楚自然，也与前句“不知道”形成恰当的平行。
- source_word: עֲצָתוֹ
  choice: 他的谋划
  rationale: עֵצָה可指筹划、计策、旨意或目的；“谋划”在此表达耶和华针对列国的安排，同时不把它与“意念”完全等同。
- source_word: כִּי
  choice: 因为
  rationale: 这里引出列国所不明白之神圣谋划的依据或说明；“因为”明确呈现句间逻辑。
- source_word: קִבְּצָם
  choice: 他把他们聚集起来
  rationale: 动词主语依上下文自然指耶和华，宾语后缀指敌对列国；“聚集起来”也为后面的打谷比喻作铺垫。
- source_word: כֶּעָמִיר
  choice: 如同把禾捆
  rationale: עָמִיר可指收割后成捆或成堆的谷物；“禾捆”简洁地保留农业图像。
- source_word: גֹּרְנָה
  choice: 聚到打谷场上
  rationale: 词尾-ה表示朝向某处的运动；“到……上”准确呈现被聚集到打谷场的方向。
theological_decisions:
- issue: 神圣名字יְהוָה的译法
  choice: 耶和华
  alternative: 雅威；主
  rationale: 原文使用神的专名，而非称号，因此正文保留专名；“耶和华”是现代中文中最广为人知的专名译写。
- issue: “他把他们聚集起来”的主语
  choice: “他”指耶和华，他把列国聚集起来
  alternative: 主语不明确；“他”指锡安
  rationale: 最近且最连贯的指称对象是耶和华；本节说明列国不明白他的谋划，而聚集到打谷场的图像揭示这聚集是在他的掌管之下，并带有审判意味。
- issue: 打谷图像所表达的含义
  choice: 保留图像，并在脚注说明它暗示审判
  alternative: 在正文直接译成“聚集起来受审判”
  rationale: 原文以农业比喻表达神学含义；正文保留其生动性和一定程度的含蓄，脚注帮助不熟悉古代农业背景的读者理解。
translation_notes:
  register: 采用庄重而自然的现代标准汉语，以“意念／谋划”保留原文两个近义词之间的区别；句式维持希伯来诗歌的平行结构，并保留禾捆与打谷场的农业图像。
