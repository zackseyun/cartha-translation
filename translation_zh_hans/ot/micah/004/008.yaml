id: MIC.4.8
reference: Micah 4:8
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/אַתָּ֣ה מִגְדַּל עֵ֗דֶר עֹ֛פֶל בַּת צִיּ֖וֹן עָדֶ֣י/ךָ תֵּאתֶ֑ה וּ/בָאָ֗ה הַ/מֶּמְשָׁלָה֙ הָ/רִ֣אשֹׁנָ֔ה מַמְלֶ֖כֶת לְ/בַ֥ת יְרוּשָׁלִָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/004/008.yaml
  text: And you[a], tower of the flock, hill of daughter Zion—to you it will come, yes, the former dominion will come[c][b], the kingdom of the daughter of Jerusalem.
translation:
  language: zh_hans
  text: 至于你，羊群的塔楼[a]，锡安女子的山冈[b]，它必临到你；从前的统治也必来到[c]，就是归给耶路撒冷女子的国度。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“以得台”（地名）；也可能指“羊群的瞭望塔”。
    reason: alternative_reading
  - marker: b
    text: 或译“锡安女子的俄斐勒”，把“俄斐勒”看作地名，而不是普通名词“山冈”。
    reason: alternative_reading
  - marker: c
    text: “从前的统治”很可能指耶路撒冷早先王权的恢复。
    reason: cross_reference
lexical_decisions:
- source_word: מִגְדַּל עֵדֶר
  choice: 羊群的高塔
  rationale: 该结构直译为“羊群之塔”。正文采用普通名词含义，以保留先知话语中的牧养与守望意象；它也可能是地名，因此在脚注中保留这一可能。
- source_word: עֹפֶל
  choice: 山冈
  rationale: 该词可指隆起的山丘、土冈，也可作耶路撒冷一处地点的专名。正文采用清楚自然的地形称谓，专名读法列入脚注。
- source_word: בַּת צִיּוֹן
  choice: 锡安女子
  rationale: 保留先知书中将锡安人格化为女子的比喻，不简化为单纯的“锡安”。
- source_word: עָדֶיךָ
  choice: 临到你
  rationale: 介词短语表达朝向、直至某对象的意思；与来临动词合译为“临到你”，符合现代汉语表达。
- source_word: תֵּאתֶה
  choice: 它必临到
  rationale: 动词为阴性单数，所指最自然地是随后说明的统治或国权。汉语以“它”保留先行指代以及原文稍带悬念的结构。
- source_word: הַמֶּמְשָׁלָה הָרִאשֹׁנָה
  choice: 从前的统治
  rationale: ממשלה表示治理、统治或权柄；הראשנה在此较可能是时间意义的“从前的、先前的”，而非序数意义的“第一个”。
- source_word: מַמְלֶכֶת
  choice: 国权
  rationale: 该词可指王国、王权或君王统治。此处与“统治”同位，“国权”既保留政治和王权色彩，也能自然接续前句。
- source_word: לְבַת יְרוּשָׁלִָם
  choice: 耶路撒冷女子的
  rationale: לְ可表达归属、方向或受益关系；在此结合“国权”译作领属结构，表达这国权属于或归给人格化的耶路撒冷，同时避免过度限定介词功能。
theological_decisions:
- issue: 开头两个称谓应按普通名词翻译，还是按与特定弥赛亚或地理传统相关的专名处理
  choice: 正文采用地形和意象性的普通名词“羊群的高塔”“锡安女子的山冈”
  alternative: 采用专名“以得台”和／或“锡安女子的俄斐勒”
  rationale: 希伯来词语本身具有清楚的普通名词意义，正文优先呈现这一意义；但它们也可能指具体地点，因此专名读法在脚注中保留，不在正文中将某一地理或弥赛亚解释定为唯一答案。
- issue: “从前的统治”是否应明确解释为复兴的大卫王朝
  choice: 正文仅译出政治与王权复兴的语言，不明说“大卫的统治”
  alternative: 扩译为“从前大卫王朝的统治”
  rationale: 上下文很可能指耶路撒冷昔日王权的恢复，但本节希伯来文没有直接提到大卫。正文保持克制，以免把合理的神学解释写成经文本身的明说内容。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“至于你”保留原文直接转向第二人称的语气；分号和“是的”呈现原文重复“来到”所形成的强调。保留“锡安女子”“耶路撒冷女子”的人格化表达，不以解释性名称替代。
