  text: ק֣וּמוּ וּ/לְכ֔וּ כִּ֥י לֹא זֹ֖את הַ/מְּנוּחָ֑ה בַּ/עֲב֥וּר טָמְאָ֛ה תְּחַבֵּ֖ל וְ/חֶ֥בֶל נִמְרָֽץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/002/010.yaml
  text: Rise and go[a], for this is not the resting place; because of uncleanness it brings destruction[b], even grievous destruction.
translation:
  language: zh_hans
  text: 你们起来，走吧！因为这里不是安歇之地[a]；因着污秽，这地必带来毁灭[b]，而且是惨重的毁灭。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“安歇之处”。原文此词可指“安歇”，也可指“安歇之地”；在此处很可能指以色列人得以安居的土地。
    reason: lexical_alternative
  - marker: b
    text: 原文连续使用“毁灭”的动词和同根名词来加强语气；也可译作：“必毁灭，而且是惨重的毁灭。”
    reason: lexical_alternative
lexical_decisions:
- source_word: ק֣וּמוּ וּ/לְכ֔וּ
  choice: 你们起来，走吧
  rationale: 两个复数命令式连用，发出离开的命令。“起来，走吧”自然简洁，也保留原文的推进力。
- source_word: הַ/מְּנוּחָ֑ה
  choice: 安歇之地
  rationale: מְנוּחָה既可指“安歇”，也可具体指“安歇之地”；本节以“这里”指向土地，具体地点义较合语境。
- source_word: בַּ/עֲב֥וּר טָמְאָ֛ה
  choice: 因它已被玷污
  rationale: טָמְאָה为阴性形式，可与阴性的מְנוּחָה呼应，较自然地指这里所说的安歇之地；“玷污”保留道德与礼仪层面的分量。
- source_word: תְּחַבֵּ֖ל וְ/חֶ֥בֶל
  choice: 必带来毁灭，而且是……的毁灭
  rationale: 动词与同根名词相继出现，形成强调；中文以重复“毁灭”并加“而且”再现这种递进。
- source_word: נִמְרָֽץ
  choice: 惨重的
  rationale: 该词表达强烈、严重的程度；“惨重”自然修饰“毁灭”，并符合先知宣告的庄重语气。
theological_decisions:
- issue: 因果分句中阴性形式所指
  choice: 理解为安歇之地（即这里所指的土地）已被玷污，并将带来毁灭
  alternative: 也可把该句较抽象地理解为“因污秽而毁灭”，不明确补出所指对象
  rationale: 阴性形式与מְנוּחָה在语法上自然呼应，但译文只用“它”，避免把“土地”明说得超过原文。
- issue: וְחבל נמרץ的修辞作用
  choice: 作为同根词重复所形成的强调和递进
  alternative: 可译为“以猛烈的毁灭”或“彻底毁灭”
  rationale: 保留两次“毁灭”，更能体现原文动词与同根名词的修辞力量，同时不把נִמְרָץ过度限定为某一种毁灭方式。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“安歇之地”保留应许之地作为安居所在的语境意味；标点体现命令、原因和末尾递进强调。
