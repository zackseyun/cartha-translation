  to: '到那日，必有人拿你们作讽刺的话题，又哀唱一首哀歌[a]，说：


    “我们彻底毁了！


    他改变了我百姓的份；


    他竟将它从我这里移走！


    他把我们的田地分给背离者[b]。”'
  rationale: 修订只处理汉语表达和直接对应原文的措辞：“拿你们作讽刺的话题”替代不自然的“唱起讽喻”；删去“所得”；以“改变了”对应יָמִיר，并以“将它从我这里移走”对应带使役意味的יָמִישׁ。争议短语“给背离者”及其脚注维持不变，以保留原文歧义。
