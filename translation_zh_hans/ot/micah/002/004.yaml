source:
  edition: WLC
  text: בַּ/יּ֨וֹם הַ/ה֜וּא יִשָּׂ֧א עֲלֵי/כֶ֣ם מָשָׁ֗ל וְ/נָהָ֨ה נְהִ֤י נִֽהְיָה֙ אָמַר֙ שָׁד֣וֹד נְשַׁדֻּ֔נוּ חֵ֥לֶק עַמִּ֖/י יָמִ֑יר אֵ֚יךְ יָמִ֣ישׁ לִ֔/י לְ/שׁוֹבֵ֥ב שָׂדֵ֖י/נוּ יְחַלֵּֽק׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/002/004.yaml
  text: On that day one will take up a taunt against you and lament a lament[a], saying, “We are utterly ruined! He changes the portion of my people[b]. How he removes it from me! To the one who turns away he divides our fields.”
translation:
  language: zh_hans
  text: '到那日，必有人拿你们作讽刺的话题，又哀唱一首哀歌[a]，说：


    “我们彻底毁了！


    他改变了我百姓的份；


    他竟将它从我这里移走！


    他把我们的田地分给背离者[b]。”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“悲声哀号”或“吟唱挽歌”。希伯来文重复同源的哀悼词，以加强语气。
    reason: lexical_alternative
  - marker: b
    text: “背离者”所对应的希伯来词含义不确定，也可理解为“反叛者”，或较不可能地理解为“掳掠者／转回的人”。
    reason: alternative_reading
lexical_decisions:
- source_word: יִשָּׂא ... מָשָׁל
  choice: 唱起讽喻
  rationale: 该习语指说出一种格言式、讥讽式或哀歌式的话；本节是针对受审判者的公开言辞，“唱起讽喻”兼顾其诗歌形式与讥刺意味。
- source_word: וְנָהָה נְהִי נִהְיָה
  choice: 哀唱一首哀歌
  rationale: 希伯来文密集重复同源的哀悼词，以加强悲恸语气；译文保留动词与名词的呼应，同时符合现代汉语表达。
- source_word: שָׁדוֹד נְשַׁדֻּנוּ
  choice: 我们彻底毁了
  rationale: 不定式绝对形与限定动词连用，强化毁坏、掠夺的程度；“彻底毁了”自然传达全面遭灾和丧失土地的含义。
- source_word: חֵלֶק עַמִּי
  choice: 我百姓所得的份
  rationale: חֵלֶק直指分得的份额，在这里尤指土地；不用更具解释性的“产业”，以保留原词的范围。
- source_word: יָמִיר
  choice: 转走了
  rationale: 该使役形可指更换、交换或转移；结合土地易手的上下文，“转走了”在汉语中清楚表达所有权被改变，同时不过度说明具体方式。
- source_word: אֵיךְ יָמִישׁ לִי
  choice: 他竟把它从我这里挪走
  rationale: אֵיךְ在此表达震惊和悲叹，译为“竟”比字面“如何”更符合现代汉语感叹句；“它”回指百姓所得的份。
- source_word: לְשׁוֹבֵב
  choice: 给背离者
  rationale: 该词形含义有争议，可能指背离、反叛或转回的人；“背离者”较透明地保留“转离”的词义，又避免直接限定为宗教意义上的“叛教者”。
- source_word: שָׂדֵינוּ יְחַלֵּק
  choice: 他把我们的田地分给
  rationale: יְחַלֵּק表示分割或分配；补出“给”与前面的לְ相应，使汉语句法完整。
theological_decisions:
- issue: לְשׁוֹבֵב所指对象的身份
  choice: 背离者
  alternative: 反叛者；掳掠者；转回的人
  rationale: 希伯来词的词源与句法均有争议。“背离者”保留其最可能的“转离”含义，却不把对象明确认定为叛教者、外敌或掳掠者；脚注列出其他合理理解，以保留经文的解释张力。
- issue: 执行转移土地之人的身份
  choice: 保留无明确先行词的“他”
  alternative: 明确译作“上帝”或“敌人”
  rationale: 希伯来文使用第三人称单数动词，却未在本节明说主语。译文不将“他”解释为上帝或征服者，以免补入原文没有明示的神学判断。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语，并以诗行呈现哀歌。“针对你们”表达עֲלֵיכֶם的敌对指向；“讽喻”保留מָשָׁל兼具格言、比喻和讥刺歌的宽度。两处脚注标记均紧随所解释的正文词句。
