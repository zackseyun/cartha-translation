  text: עָלָ֤ה הַ/פֹּרֵץ֙ לִ/פְנֵי/הֶ֔ם פָּֽרְצוּ֙ וַֽ/יַּעֲבֹ֔רוּ שַׁ֖עַר וַ/יֵּ֣צְאוּ ב֑/וֹ וַ/יַּעֲבֹ֤ר מַלְכָּ/ם֙ לִ/פְנֵי/הֶ֔ם וַ/יהוָ֖ה בְּ/רֹאשָֽׁ/ם׃פ
base_translation:
  language: en
  yaml_path: translation/ot/micah/002/013.yaml
  text: The one who breaks through has gone up before them[a]; they have broken through and passed through the gate, and gone out by it. Their king passes on before them[c][b], and Yahweh is at their head.
translation:
  language: zh_hans
  text: 那位冲破开路者已经上去，在他们前面[a]；他们冲破，穿过那门，从门出去。他们的王走在他们前面[b]，耶和华在他们最前头[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“那冲破者”。希伯来文是作名词使用的分词，可像称号一样指冲破障碍、打开通路的一位。
    reason: lexical_alternative
  - marker: b
    text: “那位冲破开路者”究竟是谁，解释不一：有人理解为军事领袖，有人理解为这里的王，也有人理解为耶和华亲自开路。希伯来文没有明说这些称谓之间的关系。
    reason: alternative_reading
  - marker: c
    text: “耶和华”所译的是希伯来文神名יהוה（YHWH）。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַפֹּרֵץ
  choice: 那冲破开路的
  rationale: 这是带定冠词、作名词使用的分词，源于פרץ，意为冲破、突破。译文既保留冲破障碍的意象，又以现代汉语自然表达其开路作用，不把它固定为专名或特定身份。
- source_word: עָלָה
  choice: 已经上到
  rationale: Qal完成式第三人称阳性单数。保留“上去、上来”的空间意象及完成语气；先知话语也可能用完成式生动表达确定将发生之事。
- source_word: לִפְנֵיהֶם
  choice: 在他们前面
  rationale: 这是表示空间和带领位置的常用短语；两次出现采用相同译法，以保存经文的呼应。
- source_word: פָּרְצוּ
  choice: 他们冲破缺口
  rationale: 与הַפֹּרֵץ同源，重复“冲破”以保留希伯来文的词根联系。“缺口”依据该动词在场景中所表达的破口意象，使汉语动作关系清楚。
- source_word: וַיַּעֲבֹרוּ שַׁעַר
  choice: 穿门而过
  rationale: עבר在此表示经过、穿过；שַׁעַר是门或城门。译作“门”避免在原文未明说时擅自限定为城门。
- source_word: וַיֵּצְאוּ בוֹ
  choice: 从那里出去
  rationale: בוֹ回指前述的门，表示由该处出去。现代汉语用“从那里”比逐字译作“在它里面”或“借着它”更自然。
- source_word: מַלְכָּם
  choice: 他们的王
  rationale: מֶלֶךְ明确指王；保留王权含义，不弱化为一般的领袖或统治者。
- source_word: וַיהוָה
  choice: 耶和华
  rationale: 以简体中文圣经读者熟悉的形式表示神名יהוה，并在脚注说明其性质。
- source_word: בְּרֹאשָׁם
  choice: 在他们最前头
  rationale: 字面为“在他们的头部／前头”，表示队伍的领先位置。此译法保留空间隐喻，而不直接释义为“率领他们”。
theological_decisions:
- issue: “那冲破开路的”（הַפֹּרֵץ）的身份
  choice: 正文作描述性翻译，不指明其具体身份。
  alternative: 可理解为军事领袖、他们的王，或耶和华亲自开路。
  rationale: 本节依次提到“那冲破开路的”“他们的王”和“耶和华”，却没有明说三者彼此相同还是有别。译文保留这种关系上的含蓄，不预先作弥赛亚论、神显或纯军事性的判定。
- issue: “他们的王”与“耶和华”的关系
  choice: 在正文中保留为两个并列而不同的称谓。
  alternative: 可将两者理解为同一位的同位表达，或在神学解释中认为二者存在身份上的重合。
  rationale: 希伯来文分别说“他们的王走在他们前面”以及“耶和华在他们最前头”。翻译不应把两个表达合并，也不应排除经文可能蕴含的神学关联。
translation_notes:
  register: 采用现代、庄重而可朗读的普通话。“冲破开路”保留פרץ的突破意象，“穿门而过”使连续动作简洁有力；末句以“在他们最前头”保存原文队伍行进的空间画面。
