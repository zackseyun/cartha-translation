  text: וְ/אֶתְמ֗וּל עַמִּ/י֙ לְ/אוֹיֵ֣ב יְקוֹמֵ֔ם מִ/מּ֣וּל שַׂלְמָ֔ה אֶ֖דֶר תַּפְשִׁט֑וּ/ן מֵ/עֹבְרִ֣ים בֶּ֔טַח שׁוּבֵ֖י מִלְחָמָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/002/008.yaml
  text: But lately my people have risen up as an enemy; from off the garment you strip the robe from those who pass by securely[a], those returning from war.
translation:
  language: zh_hans
  text: 但近来，我的百姓起来如同仇敌；你们从那些安然经过、从战场归来的人[a]身上剥去外衣和袍子。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“从那些安然经过、避开战事的人身上。”希伯来语末尾的短语含义不确定，也可能指远离战事的和平百姓，而不是从战场归来的人。
    reason: alternative_reading
lexical_decisions:
- source_word: וְאֶתְמוּל
  choice: 但近来
  rationale: אֶתְמוּל本义为“昨天”，在此可指近期；结合וְ的转折语气，译作“但近来”自然且保留时间对比。
- source_word: עַמִּי
  choice: 我的百姓
  rationale: 保留第一人称所属关系及其圣约语气。
- source_word: לְאוֹיֵב יְקוֹמֵם
  choice: 起来如同仇敌
  rationale: קום表达敌对地起来；לְאוֹיֵב作表语或比较性用法。译作“如同仇敌”避免把身份转变说得过实。
- source_word: מִמּוּל שַׂלְמָה אֶדֶר תַּפְשִׁטוּן
  choice: 连外衣带袍子都剥去
  rationale: 该短语描绘从人身上剥去衣物。שַׂלְמָה与אֶדֶר均可指衣袍；汉语用“连……带……都”自然呈现彻底剥夺的画面，同时涵盖两个衣物名词及移除关系。
- source_word: מֵעֹבְרִים בֶּטַח
  choice: 从安然路过的人身上
  rationale: עבר的分词指路过者，בֶּטַח指安全、无所戒备的状态；“安然路过”简洁自然。
- source_word: שׁוּבֵי מִלְחָמָה
  choice: 从战场归来的人
  rationale: 正文采用שוב“返回”的常见意义，以מִלְחָמָה为返回之处；因希伯来语短语有解释争议，另在脚注保留其他可能。
theological_decisions:
- issue: שׁוּבֵי מִלְחָמָה这一疑难短语的解释
  choice: 从战场归来的人
  alternative: 躲避战争的人／离开战事的人
  rationale: 正文采用שוב表示“归回”的直接读法，但不把有争议的句法和语义静默定论；脚注保存和平路人或非战斗人员的可能解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“安然路过”保留受害者毫无戒备的状态；“连外衣带袍子都剥去”以自然汉语重现希伯来文两个衣物名词和强烈的掠夺画面。
