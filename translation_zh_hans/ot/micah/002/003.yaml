reference: Micah 2:3
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: לָ/כֵ֗ן כֹּ֚ה אָמַ֣ר יְהוָ֔ה הִנְ/נִ֥י חֹשֵׁ֛ב עַל הַ/מִּשְׁפָּחָ֥ה הַ/זֹּ֖את רָעָ֑ה אֲ֠שֶׁר לֹֽא תָמִ֨ישׁוּ מִ/שָּׁ֜ם צַוְּארֹֽתֵי/כֶ֗ם וְ/לֹ֤א תֵֽלְכוּ֙ רוֹמָ֔ה כִּ֛י עֵ֥ת רָעָ֖ה הִֽיא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/002/003.yaml
  text: 'Therefore[a], this is what Yahweh says: Look, I am planning disaster against this family, from which you will not remove your necks, and you will not walk haughtily[d][c][b], for it is an evil time.'
translation:
  language: zh_hans
  text: 因此，耶和华这样说：“看哪，我正谋划使这族[a]遭灾；你们不能从其中把颈项抽出来[b]，也不能昂首而行[c]，因为这是灾祸的时候[d]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “族”所译的希伯来词可指一家、家族、宗族，也可指范围更大的群体。
    reason: lexical_alternative
  - marker: b
    text: 直译是“你们不能从那里把你们的颈项抽出来”，形象地表示无法逃脱所加的轭或重担。
    reason: cultural_note
  - marker: c
    text: 或译“傲然行走”。原文既可使人想到骄傲自高，也保留昂首的身体姿态。
    reason: lexical_alternative
  - marker: d
    text: “灾祸”与前面的“灾”译自同一个希伯来词；原文的重复把耶和华所宣告的灾难与即将来到的灾祸时候联系起来。
    reason: literary_note
lexical_decisions:
- source_word: לָכֵן
  choice: 因此
  rationale: 承接上文所述的不义行为，引出耶和华相应的审判。
- source_word: כֹּה אָמַר יְהוָה
  choice: 耶和华这样说
  rationale: 以自然、庄重的现代汉语表达先知性的传信公式，并音译神名。
- source_word: הִנְנִי
  choice: 看哪，我正
  rationale: 保留强调和唤起注意的功能；“正”也与后面的分词相配。
- source_word: חֹשֵׁב
  choice: 谋划
  rationale: 保留与上文同一词根形成的反照：恶人谋划恶事，耶和华则谋划对他们的审判。
- source_word: עַל הַמִּשְׁפָּחָה הַזֹּאת
  choice: 降灾给这族
  rationale: מִשְׁפָּחָה可指家庭、宗族或较大的群体；本处用“族”保留集体范围上的弹性。“降灾给”自然表达עַל在敌对审判语境中的含义。
- source_word: רָעָה
  choice: 灾／灾祸
  rationale: 在神所宣告的审判语境中指灾难而非道德邪恶；两个译词保持同一语义场，并避免暗示神施行道德上的恶。
- source_word: אֲשֶׁר לֹא תָמִישׁוּ מִשָּׁם צַוְּארֹתֵיכֶם
  choice: 你们不能从其中把颈项抽出来
  rationale: 较直译地保留颈项无法脱离所加之轭或重担的意象。אֲשֶׁר的所指略有张力，译作“其中”而不补明具体事物。
- source_word: וְלֹא תֵלְכוּ רוֹמָה
  choice: 也不能再昂首而行
  rationale: רוֹמָה含高举、傲然之意；“昂首而行”既保留身体姿态，也可传达骄傲自高。补“再”使审判导致的处境转变在汉语中自然呈现。
- source_word: כִּי עֵת רָעָה הִיא
  choice: 因为那是灾祸的时刻
  rationale: 表达即将临到的灾难时期，并与前面的“灾”形成词汇呼应。
theological_decisions:
- issue: 神所谋划的רָעָה是否译作道德上的“恶”
  choice: 译为“灾／灾祸”
  alternative: 两处均译为“恶”，或译为“祸患”
  rationale: 此处指耶和华对不义者施行的灾难性审判，不是说神谋划道德上的邪恶；同时以“灾／灾祸”保留两处重复的修辞联系。
- issue: מִשְׁפָּחָה所指群体的范围
  choice: 译为“这族”，脚注说明可指家族、宗族或更大的群体
  alternative: “这家”或“这个家族”
  rationale: 上下文可能指向比单一家庭更广的共同体；原词本身范围可变，不在正文中将其过度限定。
- issue: רוֹמָה所表达的是骄傲还是直立姿态
  choice: 译为“昂首而行”
  alternative: “傲然行走”或“挺直身子行走”
  rationale: 该表达可能兼具外在高昂姿态与内在骄傲意味；“昂首而行”保留这种形象与语义张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“看哪”保留先知宣告的强调色彩；“谋划”呼应上文；颈项和昂首的意象均予保留。正文不过度限定“族”的范围，也不把רוֹמָה单纯解释成内在骄傲。
