source:
  edition: WLC
  text: לוּ אִ֞ישׁ הֹלֵ֥ךְ ר֨וּחַ֙ וָ/שֶׁ֣קֶר כִּזֵּ֔ב אַטִּ֣ף לְ/ךָ֔ לַ/יַּ֖יִן וְ/לַ/שֵּׁכָ֑ר וְ/הָיָ֥ה מַטִּ֖יף הָ/עָ֥ם הַ/זֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/002/011.yaml
  text: If a man should go about with wind and falsehood[a], lying, ‘I will preach to you of wine and strong drink,’ he would be the preacher of this people.
translation:
  language: zh_hans
  text: 假如有人满口空话和谎言，撒谎说：“我要向你宣讲酒和浓酒。”那么，这人就会成为这百姓的宣讲者。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可较正式地译作：“我要向你预言关于酒和浓酒的事……这人就会成为这百姓的先知。”原文两处使用同一词根的动词；这个词常用于先知性言说，在这里带有尖锐的讽刺意味。
    reason: 说明先知性动词的词义选择，并保留两处动词对应关系。
lexical_decisions:
- source_word: לוּ
  choice: 假如
  rationale: 引出与事实相对的假设情形；“假如”自然地保留了本节讽刺性的条件语气，而不加入“但愿”的愿望色彩。
- source_word: אִישׁ
  choice: 有人／这人
  rationale: 希伯来文为阳性单数，但此处重点在假设中的某个人；现代汉语用“有人”，后文以“这人”回指，既保留单数，也避免生硬的“一个男人”。
- source_word: הֹלֵךְ רוּחַ וָשֶׁקֶר
  choice: 追逐虚空和虚假
  rationale: רוּחַ本义可指“风”或“气息”，此处带有空泛、无实质之意。“追逐虚空和虚假”保留两个并列概念及行动意象，同时使中文可懂；不直接意译为“满口空话”，以免过度限定。
- source_word: כִּזֵּב
  choice: 撒谎说
  rationale: 明确表达说假话、欺骗的动作，并自然引出后面的直接引语。
- source_word: אַטִּף / מַטִּיף
  choice: 宣讲／宣讲者
  rationale: נטף字面有“滴下”之意，也用于先知性言说。本译文在两处用同一词根相连的“宣讲／宣讲者”，保留原文反复与讽刺；脚注说明“说预言／先知”的正式替代译法。
- source_word: לְךָ
  choice: 向你
  rationale: 保留第二人称阳性单数形式；在上下文中可视为对百姓这一集合体的单数称呼。
- source_word: לַיַּיִן וְלַשֵּׁכָר
  choice: 酒和浓酒
  rationale: יַיִן为酒，שֵׁכָר泛指使人醉的浓烈饮料。“浓酒”比现代通常指蒸馏酒的“烈酒”更能避免时代错置，也保留两类饮品的区分。
- source_word: הָעָם הַזֶּה
  choice: 这百姓
  rationale: 贴近希伯来文单数集合名词及指示语，保留先知责备的庄重语气。
theological_decisions:
- issue: 在讽刺性谴责中如何翻译先知性动词 נטף
  choice: 宣讲／宣讲者
  alternative: 说预言／先知；滴下话语的人
  rationale: 上下文讽刺百姓所欢迎的虚假宗教发言者。“宣讲”既可表达公开传话，又不预先授予此人真实先知的权威；同时用脚注保留该动词与先知性言说的关联及原文两次重复。
- issue: “酒和浓酒”是信息内容还是所许诺的福乐
  choice: 按所宣讲的内容直译，不进一步解释
  alternative: 宣告酒和浓酒必丰富；迎合人饮酒的欲望
  rationale: 介词ל可表示言说所涉及的内容，但原文没有明说该人是在应许丰收还是纵容饮酒，因此正文保留简洁和含混性。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“假如……那么……”呈现讽刺性的假设；“这百姓”保持先知谴责的语体。直接引语和句末脚注标记清楚，避免使用过于教派化或替原文消除歧义的措辞。
