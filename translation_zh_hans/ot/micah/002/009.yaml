  text: נְשֵׁ֤י עַמִּ/י֙ תְּגָ֣רְשׁ֔וּ/ן מִ/בֵּ֖ית תַּֽעֲנֻגֶ֑י/הָ מֵ/עַל֙ עֹֽלָלֶ֔י/הָ תִּקְח֥וּ הֲדָרִ֖/י לְ/עוֹלָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/002/009.yaml
  text: You drive the women of my people out from their delightful houses[b][a]; from their children you take away my splendor forever.
translation:
  language: zh_hans
  text: 你们把我子民中的妇女[a]从她们安乐的家中赶出去；又从她们的幼儿身上，永远夺去我的荣美[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “妇女”或译“妻子”。希伯来语在这里既可泛指妇女，也可特指妻子。
    reason: lexical_alternative
  - marker: b
    text: “荣美”或译“荣耀”“威荣”或“尊荣”。
    reason: lexical_alternative
lexical_decisions:
- source_word: נְשֵׁי עַמִּי
  choice: 我子民中的妇女
  rationale: נְשֵׁי 是 אִשָּׁה 的复数附属形，既可指“妇女”，也可特指“妻子”。正文采用范围较广的“妇女”，并以脚注保留另一可能。
- source_word: תְּגָרְשׁוּן
  choice: 赶出去
  rationale: גרשׁ 的强意形表达强行驱逐；“赶出去”在现代汉语中自然，并保留其强制意味。
- source_word: מִבֵּית תַּעֲנֻגֶיהָ
  choice: 从她们安乐的家中
  rationale: בַּיִת 指房屋或家，תַּעֲנֻגִים 指愉悦、舒适之物。阴性单数后缀在这里集合性地回指这些妇女，汉语用复数“她们”表达自然；“安乐的家”也兼顾住所的舒适与安全感。
- source_word: מֵעַל עֹלָלֶיהָ
  choice: 从她们的幼儿身上
  rationale: עוֹלָל 指年幼的孩子或幼儿；保留 מֵעַל 的“从……身上”意象，比单说“从孩子那里”更贴近原文。
- source_word: תִּקְחוּ
  choice: 夺去
  rationale: לקח 基本义为“取、拿”，在剥夺弱者的控诉语境中译作“夺去”，准确传达伤害性动作。
- source_word: הֲדָרִי
  choice: 我的荣美
  rationale: הָדָר 可指荣美、荣耀、威荣或尊荣。“荣美”保留庄重语体，又不过早限定它究竟指上主自己的荣耀，还是他所赐予幼儿的尊荣。
- source_word: לְעוֹלָם
  choice: 永远
  rationale: עוֹלָם 在此表示持续不止或永久性的结果；“永远”符合先知控诉的强烈语气。
theological_decisions:
- issue: “我子民”与“我的荣美”中第一人称的所指
  choice: 保留上主第一人称的“我”，直译为“我子民”和“我的荣美”
  alternative: 将“我的荣美”解释性地译为“我所赐的尊荣”或“他们的尊严”
  rationale: 上下文中的说话者是上主。原文“我的荣美”既可着重于属于上主的荣美，也可能指他赋予这些幼儿的尊荣；正文不作解释性扩展，以保留这种神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“赶出去”呈现强制驱逐，“幼儿”准确表达年幼孩子；分号保持原文两项控诉的平行结构。脚注标记均置于正文相关词语之后。
