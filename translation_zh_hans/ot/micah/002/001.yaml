  source_fidelity: 末句“因为他们手中有权力”恰当传达 כי יש לאל ידם 的惯用含义，即他们有实行恶谋的能力或权势；脚注也适当地保存了“神”的另一种修辞性理解。不过，第二个分词 ופעלי רע 不宜简单弱化为与“图谋”完全同义的“策划坏事”；它表示对恶事的着手、经营或作成，并与清晨的实行形成递进。
  naturalness: 原译整体通顺，语体庄重。“坏事”在此先知谴责语境中稍显口语且力度偏弱；“恶行”更合适。“天一亮”和“付诸行动”自然。
  terminology: “祸哉”准确保留先知性祸告的庄严语气。“罪孽／恶行”可分别对应 אָוֶן 与 רָע，既避免机械重复，也保留道德谴责的力度。脚注的“以自己的手为神”可更贴近原文的单数“手”及其作为神的修辞性表述。
