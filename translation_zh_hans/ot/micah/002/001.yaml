id: MIC.2.1
reference: Micah 2:1
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: ה֧וֹי חֹֽשְׁבֵי אָ֛וֶן וּ/פֹ֥עֲלֵי רָ֖ע עַל מִשְׁכְּבוֹתָ֑/ם בְּ/א֤וֹר הַ/בֹּ֨קֶר֙ יַעֲשׂ֔וּ/הָ כִּ֥י יֶשׁ לְ/אֵ֖ל יָדָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/002/001.yaml
  text: Woe to those who devise wickedness and work out evil on their beds! At the light of morning they do it[a], because it is in the power of their hand.
translation:
  language: zh_hans
  text: 祸哉，那些在床上图谋罪孽、经营恶行的人！天一亮，他们就付诸实行[a]，因为他们手中有权势。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因为他们的手就是他们的神。”这是把“神”理解为对他们自高自恃之权势的比喻性说法。
    reason: alternative_reading
lexical_decisions:
- source_word: הוֹי
  choice: 祸哉
  rationale: 先知性叹词，在此引出审判性的谴责；“祸哉”保留其庄重而强烈的宣告语气。
- source_word: חֹשְׁבֵי אָוֶן
  choice: 图谋恶事
  rationale: חשב的分词表示有意筹谋；אָוֶן在此指邪恶、不义之事。“图谋恶事”自然表达蓄意谋划，也与下句保持关联。
- source_word: וּפֹעֲלֵי רָע
  choice: 策划坏事
  rationale: פעל在此与前面的“图谋”构成近义并列，并由后文יַעֲשׂוּהָ描述清晨实际施行；故此处理解为夜间筹划恶行，避免误译成已经在床上实行恶事。
- source_word: עַל מִשְׁכְּבוֹתָם
  choice: 躺在床上
  rationale: 保留夜间卧床筹谋的具体图景，同时使现代汉语语序自然。
- source_word: בְּאוֹר הַבֹּקֶר
  choice: 天一亮
  rationale: 准确传达“晨光出现时”的时间和鲜明意象，在现代汉语中简洁自然。
- source_word: יַעֲשׂוּהָ
  choice: 他们就付诸行动
  rationale: 阴性单数宾语后缀回指所谋划的恶事；“付诸行动”清楚呈现从夜间筹谋到清晨实施的推进。
- source_word: כִּי יֶשׁ לְאֵל יָדָם
  choice: 因为他们手中有权力
  rationale: 将לְאֵל按表示能力、力量的惯用意义理解，并保留“手”的意象；说明他们施恶是因为掌握实行的权力。
theological_decisions:
- issue: 末句לְאֵל的含义
  choice: 按惯用义译为“有权力”
  alternative: “因为他们以自己的手为神”
  rationale: 上下文是在解释他们为何能在天亮时实行恶谋：他们手中掌握实施的能力或权势。אֵל也可引出“神”的修辞性理解，但该读法在此句法中不如“能力、权力”直接，因此保留于脚注，以呈现原文的真实歧义。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“祸哉”保留先知宣告的力度；其余措辞避免古奥。“天一亮”与“付诸行动”自然呈现夜间谋划、清晨实行的结构。
