revisions:
- from: 祸哉，那些躺在床上图谋恶事、策划坏事的人！天一亮，他们就付诸行动[a]，因为他们手中有权力。
  to: 祸哉，那些在床上图谋罪孽、经营恶行的人！天一亮，他们就付诸实行[a]，因为他们手中有权势。
  rationale: 将“策划坏事”改为“经营恶行”，以保留原文两个分词由谋划到着手作恶的递进，并以“付诸实行”承接阴性单数宾语所指的恶谋。将“坏事”改为“恶行”，使语域和先知谴责的力度更恰当。末句维持“手中有权势”的主译，并在脚注中保留“手就是他们的神”的可能修辞性读法。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T08:15:51Z'
