  text: אָסֹ֨ף אֶאֱסֹ֜ף יַעֲקֹ֣ב כֻּלָּ֗/ךְ קַבֵּ֤ץ אֲקַבֵּץ֙ שְׁאֵרִ֣ית יִשְׂרָאֵ֔ל יַ֥חַד אֲשִׂימֶ֖/נּוּ כְּ/צֹ֣אן בָּצְרָ֑ה כְּ/עֵ֨דֶר֙ בְּ/ת֣וֹךְ הַ/דָּֽבְר֔/וֹ תְּהִימֶ֖נָה מֵ/אָדָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/002/012.yaml
  text: I will surely gather all of you[a], Jacob; I will surely collect the remnant of Israel. Together I will set them like the sheep of Bozrah, like a flock in the midst of its pasture[c][b]; they will be noisy with men.
translation:
  language: zh_hans
  text: 我必把你全都聚拢，雅各啊；我必把以色列的余民召集起来。我要使他们聚在一处，如波斯拉的羊群[a]，又如草场中的群羊；他们必因人多而喧腾[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“如圈里的羊群。”希伯来语传统上读作地名“波斯拉”，也有人认为这里与“围栏、羊圈”一词有关。
    reason: lexical_alternative
  - marker: b
    text: 希伯来语本句含义较难确定，也可较直译为：“他们必因人而喧腾”；或理解为：“那里将挤满人。”
    reason: alternative_reading
lexical_decisions:
- source_word: אָסֹף אֶאֱסֹף
  choice: 我必……聚拢
  rationale: 不定式绝对形与限定动词连用，强化动作的确定性；“必”自然传达这种强调，“聚拢”也符合召回分散群体的语境。
- source_word: יַעֲקֹב כֻּלָּךְ
  choice: 把你全都……雅各啊
  rationale: 保留对作为集体人格之“雅各”的直接呼语，并以“你全都”反映单数第二人称后缀所指的整个群体。
- source_word: קַבֵּץ אֲקַבֵּץ
  choice: 我必……召集起来
  rationale: 同样保留强调结构，并用“召集”与前句“聚拢”形成自然的平行变化。
- source_word: שְׁאֵרִית יִשְׂרָאֵל
  choice: 以色列的余民
  rationale: “余民”是先知语境中自然且准确的表达，指存留下来或将被恢复的那部分百姓。
- source_word: יַחַד אֲשִׂימֶנּוּ
  choice: 我要使他们聚在一处
  rationale: 将יַחַד的共同、集中之意自然融入句中；宾语形式虽为单数，但所指是作为整体的余民，故译作“他们”。
- source_word: כְּצֹאן בָּצְרָה
  choice: 如波斯拉的羊群
  rationale: 按马所拉文本优先把בָּצְרָה理解为地名“波斯拉”；“羊圈”的词源性或双关性理解收入脚注。
- source_word: כְּעֵדֶר בְּתוֹךְ הַדָּבְרוֹ
  choice: 又如草场中的群羊
  rationale: 此处הַדָּבְרוֹ宜按牧养意象理解为其草场或牧地；译文以简洁自然的汉语保留平行图景。
- source_word: תְּהִימֶנָה מֵאָדָם
  choice: 那里必因人多而喧腾
  rationale: 该表达较难确定；结合聚集的羊群和百姓众多的图景，译为因人群众多而发出喧闹声，同时在脚注保留较直译的可能。
theological_decisions:
- issue: 向雅各／以色列发出的复兴与招聚应许
  choice: 保留经文直接指向雅各、以色列及其余民的群体性应许，不进一步限定其实现方式或时间。
  alternative: 将其专门解释为纯属属灵的复兴，或仅限于某一末世体系。
  rationale: 希伯来文本明确使用“雅各”“以色列的余民”及招聚图像；翻译应保存这一历史—群体指向及其开放的神学张力，而不加入经文本身未明说的体系。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“聚拢／召集”保留两个近义动词的平行变化；“因人多而喧腾”使末句在中文中通顺，同时用脚注保存原文介词关系和动词语义的不确定性。
