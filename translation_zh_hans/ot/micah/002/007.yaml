  terminology: “雅威”与项目神名政策一致；“灵”保留了 רוּחַ 的词汇表层，而“不耐烦”传达 קצר רוח 的习语效果。脚注恰当呈现“受限制”和“忍耐有限”的可行替代，不应将争议解释定论化。
