  text: הֶ/אָמ֣וּר בֵּֽית יַעֲקֹ֗ב הֲ/קָצַר֙ ר֣וּחַ יְהוָ֔ה אִם אֵ֖לֶּה מַעֲלָלָ֑י/ו הֲ/ל֤וֹא דְבָרַ֨/י יֵיטִ֔יבוּ עִ֖ם הַ/יָּשָׁ֥ר הוֹלֵֽךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/002/007.yaml
  text: Should it be said[a], O house of Jacob, “Is the Spirit of Yahweh impatient? Are these his deeds?” Do not my words do good to the one who walks uprightly?
translation:
  language: zh_hans
  text: 雅各家啊，难道该说：“雅威的灵不耐烦了吗[a]？这些是他所做的事吗？”我的话岂不使行为正直的人得益处吗？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“雅威的灵受限制了吗？”这一希伯来语表达也可指：“雅威的忍耐有限吗？”
    reason: 保留 קצר רוח 在字面意义与习语意义之间的真实歧义。
lexical_decisions:
- source_word: הֶאָמ֣וּר
  choice: 难道可以说
  rationale: 该形式引出带有质问意味的引语；用“难道可以说”既保留反问语气，也符合现代汉语表达。
- source_word: בֵּית יַעֲקֹב
  choice: 雅各家啊
  rationale: 这是直接呼语；“家”保留以祖先雅各之名指其后裔群体的希伯来表达。
- source_word: הֲקָצַר רוּחַ יְהוָה
  choice: 雅威的灵不耐烦了吗
  rationale: קצר רוח字面有“灵短促、受限”之意，作为习语可表达不耐烦或忍耐有限；正文采用自然汉语“不耐烦”，脚注保留其他可能含义。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以“雅威”音译四字神名，区别于用称号“主”替代神名。
- source_word: אִם אֵלֶּה מַעֲלָלָיו
  choice: 这些是他所做的事吗
  rationale: מַעֲלָלָיו指“他的行为、所做的事”；译成平行的反问句，不进一步限定所指为何。
- source_word: דְבָרַי יֵיטִיבוּ
  choice: 我的话……使……得益处
  rationale: 保留“我的话”的复数总体意义，并用“使……得益处”自然表达יטב使人得好处、蒙益的使役含义。
- source_word: עִם הַיָּשָׁר הוֹלֵךְ
  choice: 行为正直的人
  rationale: הוֹלֵךְ以“行走”比喻持续的生活方式；汉语“行为正直”自然传达这一伦理和持续性的含义。
theological_decisions:
- issue: רוּחַ יְהוָה应理解为雅威的“灵”，还是他的“忍耐、性情”
  choice: 正文译作“雅威的灵”，同时以“不耐烦”传达习语作用
  alternative: “雅威的忍耐有限吗”或“雅威的灵受限制了吗”
  rationale: 保留רוּחַ作为“灵”的明确词汇形式，避免把它完全化约为抽象的“忍耐”；同时承认קצר רוח这一组合具有习语色彩，可能强调忍耐短促或受限制。
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 正文以音译呈现立约神名，而不以称号“主”替代；“雅威”较直接对应YHWH的通行学术复原读音。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“雅各家啊”保留先知直接呼告的语气；连续使用反问句，呈现原文的责问力度。
