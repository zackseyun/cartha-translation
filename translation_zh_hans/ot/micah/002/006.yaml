  - severity: low
    issue: “为这些事”略不自然
    rationale: 介词短语在现代汉语中以“关于这些事”更自然；这不消除原文所指对象与话语结构的歧义，脚注仍应说明。
  revised_text: “不要说预言！”他们却说预言：“不可关于这些事说预言；羞辱不会临到我们。”
