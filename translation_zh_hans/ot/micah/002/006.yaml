base_translation:
  language: en
  yaml_path: translation/ot/micah/002/006.yaml
  text: “Do not preach,” they preach. “One should not preach about these things; disgrace will not overtake us.”
translation:
  language: zh_hans
  text: “不要说预言！”他们却说预言：“不可关于这些事说预言；羞辱不会临到我们。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תַּטִּפוּ / יַטִּיפוּן / יַטִּיפוּ
  choice: 说预言
  rationale: נטף本义为“滴下”，在先知语境中引申为宣讲、说预言；此处重复同一词根，译文三处统一用“说预言”，保留原文的反复。
- source_word: לָאֵלֶּה
  choice: 为这些事
  rationale: 介词ל与指示代词的组合可指“针对这些事、论到这些事”；译作“为这些事”保留其简约性及所指略有含混的特点。
- source_word: יִסַּג כְּלִמּוֹת
  choice: 羞辱不会临到我们
  rationale: 该短语表达羞辱追上、临到之意；“我们”依话语主体和语境补出，使现代汉语自然，同时不把羞辱具体化为某一种审判。
theological_decisions:
- issue: 说话者及引语层次
  choice: 将反对者的话理解为：“不要说预言……不可为这些事说预言；羞辱不会临到我们。”
  alternative: 把后半句理解为先知对禁令的回应，或将“他们说预言”视为叙述者的讽刺评语。
  rationale: 原文极其紧凑，说话者转换并不完全明示；所采用的标点与英语审校层一致，也符合上下文中听众拒绝先知警告的情景，但脚注提示其结构歧义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“不要说预言”直接表现听众的禁令；分号连接他们拒绝信息与自信不会蒙羞的态度。
