base_translation:
  language: en
  yaml_path: translation/ot/micah/002/005.yaml
  text: Therefore you will have no one to cast the measuring line by lot in the assembly of Yahweh[a][b].
translation:
  language: zh_hans
  text: 所以，在耶和华的会众中，必没有人按阄为你拉量地线[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“量地绳”“绳索”或“划分份地的线”。希伯来语所用的词可指丈量并划分承受之地所用的绳索或量线。
    reason: lexical_alternative
  - marker: b
    text: 这里可能指盟约群体聚集、按阄分配土地的场合。
    reason: cultural_note
lexical_decisions:
- source_word: לָכֵן
  choice: 所以
  rationale: 承接上文的控诉与审判，表明本节是由此产生的后果；“所以”自然且保留先知话语的推论力度。
- source_word: לֹא יִהְיֶה לְךָ
  choice: 必没有人为你
  rationale: 原文直译为“对你而言必没有”，其中“你”为阳性单数。“必没有人为你”符合现代汉语，也保留直接宣判的语气。
- source_word: מַשְׁלִיךְ
  choice: 抛出
  rationale: 该分词在此作名词性用法，指执行动作的人；与后面的量地绳索连用，保留实际拉出或投放绳索的图像。
- source_word: חֶבֶל
  choice: 量地的绳索
  rationale: 在分配土地的语境中，此词可指丈量土地的绳索或由它划定的地界、份地。“量地的绳索”既具体，又不把隐含意义直接改写进正文。
- source_word: בְּגוֹרָל
  choice: 按阄
  rationale: 指借抽签决定土地分配；“按阄”简洁地保留古代以抽签定份的制度背景。
- source_word: בִּקְהַל יְהוָה
  choice: 在耶和华的会众中
  rationale: קהל 指聚集起来的共同体；“会众”庄重而易懂，也保留这是共同体正式分地场合的含义。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的形式音译神的专名，不以称号替代。
theological_decisions:
- issue: 第二人称单数“你”的所指
  choice: 保留单数“你”，将审判直接宣告给上文所针对的夺地者或以单数代表的群体
  alternative: 明确译为“你们中必没有人”，或限定为假先知、领袖等特定群体
  rationale: 原文使用阳性单数，紧接上文对侵占土地之人的审判。正文保留单数，不把群体范围或具体身份解释得超过上下文证据。
- issue: “耶和华的会众”与土地分配的关系
  choice: 保留“在耶和华的会众中”，由脚注说明其可能涉及盟约群体聚集分地的场合
  alternative: 正文扩译为“在耶和华的会众聚集分地时”
  rationale: 原文只明说会众，并未在这一短语中明说“盟约”或“聚集分地时”；注释可交代文化语境，同时避免正文过度解释。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“按阄”保留古代抽签分地的文化色彩；“抛出量地的绳索”略具具体图像感，以对应原文动词和名词的搭配。两个脚注标记均置于相关句末。
