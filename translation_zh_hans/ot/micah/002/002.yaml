  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/חָמְד֤וּ שָׂדוֹת֙ וְ/גָזָ֔לוּ וּ/בָתִּ֖ים וְ/נָשָׂ֑אוּ וְ/עָֽשְׁקוּ֙ גֶּ֣בֶר וּ/בֵית֔/וֹ וְ/אִ֖ישׁ וְ/נַחֲלָתֽ/וֹ׃פ
base_translation:
  language: en
  yaml_path: translation/ot/micah/002/002.yaml
  text: They covet fields and seize them[a], and houses and take them away; they oppress a man and his house[c][b], a man and his inheritance.
translation:
  language: zh_hans
  text: 他们贪图田地，就强夺[a]；贪图房屋，就夺走[b]。他们欺压人和他的家[c]，欺压人和他的祖业[d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “强夺”也可译作“抢夺”或“强行夺取”。
    reason: lexical_alternative
  - marker: b
    text: “夺走”也可译作“带走”；这里指把房屋从原主手中夺去。
    reason: lexical_alternative
  - marker: c
    text: “家”也可指“房屋”或“家室”。
    reason: lexical_ambiguity
  - marker: d
    text: “祖业”指承受而来的产业，尤其可指家族土地，并非泛指一切财物。
    reason: cultural_note
lexical_decisions:
- source_word: חָמְדוּ
  choice: 贪图
  rationale: 该动词在这里指觊觎他人所有之物，并随即付诸强夺；“贪图”既自然，也保留其道德谴责意味。
- source_word: שָׂדוֹת
  choice: 田地
  rationale: 准确表达可耕种的土地或地块，并与后文的房屋、祖业共同呈现侵占产业的主题。
- source_word: גָזָלוּ
  choice: 强夺
  rationale: 该词表示以暴力或不正当手段夺取；“强夺”保留了强制剥夺的力度。
- source_word: בָתִּים
  choice: 房屋
  rationale: 采用具体、直接的对应词，使经文对土地与住宅的侵占清楚可见。
- source_word: נָשָׂאוּ
  choice: 夺走
  rationale: 该动词本可指拿起、带走；在此语境中表示将房屋据为己有或从原主手中夺去。“夺走”自然且不暗示真的搬动物理建筑。
- source_word: עָשְׁקוּ
  choice: 欺压
  rationale: 该词可涵盖压迫、欺诈和经济剥削；“欺压”保留较宽的社会不义含义，并适合本节的财产侵占语境。
- source_word: גֶּבֶר
  choice: 人
  rationale: 此处是受害者的单数代表性称谓。现代汉语的“人”自然，无须添加原文没有明说的“强壮”含义。
- source_word: בֵיתוֹ
  choice: 他的家
  rationale: בַּיִת既可指房屋，也可指家庭或家室；“家”在中文中保留了这两方面的可能性。
- source_word: אִישׁ
  choice: 人
  rationale: 与前面的גֶּבֶר构成平行，指一个代表性的受害者；中文重复“人”可保留平行结构。
- source_word: נַחֲלָתוֹ
  choice: 他的祖业
  rationale: 该词常指承受而来的土地、家产或分得的产业。“祖业”比一般的“财产”更能体现世代承受的含义。
theological_decisions:
- issue: גֶּבֶר与אִישׁ的阳性单数形式
  choice: 人……人
  alternative: 男人……男人
  rationale: 两词在这里以单数代表受欺压者，重点不在强调其男性身份。现代汉语“人”不改变单数代表性，也避免用“男人”造成原文没有的性别对比。
- issue: נַחֲלָה的土地、法律与承受产业意涵
  choice: 祖业
  alternative: 产业／继承之地
  rationale: “祖业”保留从家族承受土地或产业的法律和社会背景，同时不把其含义限定为一般个人财物，也不额外加入特定神学解释。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。前两分句补出汉语自然表达所需的“贪图”，以呈现希伯来语并列结构中的省略；后两分句重复“欺压人”，保留原文平行和递进的节奏。
