  text: וַ/יֹּאמְר֤וּ אֵלָי/ו֙ מַה נַּ֣עֲשֶׂה לָּ֔/ךְ וְ/יִשְׁתֹּ֥ק הַ/יָּ֖ם מֵֽ/עָלֵ֑י/נוּ כִּ֥י הַ/יָּ֖ם הוֹלֵ֥ךְ וְ/סֹעֵֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/001/011.yaml
  text: Then they said to him[b][a], “What should we do to you so that the sea may quiet down for us?” For the sea was growing more and more stormy.
translation:
  language: zh_hans
  text: 他们对他说：“我们该拿你怎么办，才能使海为我们平静下来呢？”因为海越来越汹涌。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “越来越汹涌”直译为“不断前进并汹涌”；这个希伯来语结构表示风浪持续加剧。
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה נַּעֲשֶׂה לָּךְ
  choice: 我们该拿你怎么办
  rationale: 保留针对约拿采取行动的商议语气；现代汉语中“拿你怎么办”比生硬的“对你做什么”更自然，同时仍为下文的具体行动留下空间。
- source_word: וְיִשְׁתֹּק הַיָּם מֵעָלֵינוּ
  choice: 才能使海不再冲击我们
  rationale: וְיִשְׁתֹּק 表示海安静、平息；מֵעָלֵינוּ 字面有“从我们上面离开”的空间意象。此处用“不再冲击我们”自然表达目的关系，也保留海势压迫、威胁他们的生动画面。
- source_word: כִּי
  choice: 因为
  rationale: 引出水手急切发问的原因，符合本节叙事逻辑。
- source_word: הַיָּם הוֹלֵךְ וְסֹעֵר
  choice: 海浪越来越汹涌
  rationale: הוֹלֵךְ 加分词表达持续加剧；“越来越汹涌”准确传达风暴不断增强，而“海浪”在汉语中自然呈现海面风浪的状态。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“该拿你怎么办”保留水手商议如何处置约拿的直接语气；“不再冲击我们”传达 מֵעָלֵינוּ 所含海势压在他们身上、威胁他们的意象。
