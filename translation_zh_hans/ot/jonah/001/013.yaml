id: JON.1.13
reference: Jonah 1:13
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יַּחְתְּר֣וּ הָ/אֲנָשִׁ֗ים לְ/הָשִׁ֛יב אֶל הַ/יַּבָּשָׁ֖ה וְ/לֹ֣א יָכֹ֑לוּ כִּ֣י הַ/יָּ֔ם הוֹלֵ֥ךְ וְ/סֹעֵ֖ר עֲלֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/001/013.yaml
  text: But the men rowed hard to return to the dry land[a], but they could not[c][b], because the sea kept growing more and more stormy against them.
translation:
  language: zh_hans
  text: 那些人却奋力划桨[a]，想回到旱地[b]，但办不到，因为海越发汹涌[c]，冲击着他们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这个希伯来语动词本义是“挖”，在这里的航海语境中指用很大的力气划桨。也可译作“拼命划桨”。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“岸上”。原文直译为“旱地”。
    reason: lexical_alternative
  - marker: c
    text: 原文的表达表示海势不断加剧，即海越来越汹涌。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּחְתְּרוּ
  choice: 奋力划桨
  rationale: חָתַר本义与“挖掘”有关，但在航海语境中指用力划桨。“奋力划桨”既保留具体动作，也传达竭力而为的强度。
- source_word: הָאֲנָשִׁים
  choice: 那些人
  rationale: 原文用普通名词“人／男人”，并未在本节使用“水手”这一专称；“那些人”自然承接上文，也避免增添原文没有的称谓。
- source_word: לְהָשִׁיב אֶל הַיַּבָּשָׁה
  choice: 想回到旱地
  rationale: 该短语表达他们试图返回陆地；“旱地”保留יַבָּשָׁה所强调的海与干地之间的对照。希伯来语使役形式也可理解为把船驶回旱地，但船在原文中没有明说。
- source_word: וְלֹא יָכֹלוּ
  choice: 但办不到
  rationale: 简洁自然地表达他们虽努力却无能为力，并保留叙事中的转折。
- source_word: כִּי
  choice: 因为
  rationale: 此处引出他们无法返回旱地的原因。
- source_word: הַיָּם
  choice: 海
  rationale: 按其通常含义直译，并符合航海场景。
- source_word: הוֹלֵךְ וְסֹעֵר
  choice: 越发汹涌
  rationale: הוֹלֵךְ加分词表示持续发展或程度递增；“越发汹涌”准确而简练地传达海势不断加剧。
- source_word: עֲלֵיהֶם
  choice: 冲击着他们
  rationale: 此处介词短语描写海的猛烈力量向他们袭来；这一译法保留敌对、压迫性的方向感。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“奋力划桨”“办不到”“越发汹涌”均为普通读者容易理解的表达；同时保留“旱地”这一较具经文色彩、并与“海”形成鲜明对照的用语。
