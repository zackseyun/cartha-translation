  text: וַ/יֹּאמְר֣וּ אֵלָ֔י/ו הַגִּידָ/ה נָּ֣א לָ֔/נוּ בַּ/אֲשֶׁ֛ר לְ/מִי הָ/רָעָ֥ה הַ/זֹּ֖את לָ֑/נוּ מַה מְּלַאכְתְּ/ךָ֙ וּ/מֵ/אַ֣יִן תָּב֔וֹא מָ֣ה אַרְצֶ֔/ךָ וְ/אֵֽי מִ/זֶּ֥ה עַ֖ם אָֽתָּה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/001/008.yaml
  text: Then they said to him[a], “Please tell us on whose account this trouble has come upon us. What is your occupation, and where do you come from? What is your land[b], and from what people are you?”
translation:
  language: zh_hans
  text: 他们对他说：“请告诉我们，我们遭遇这场灾祸是因谁的缘故[a]？你是做什么的？从哪里来？你的国土是哪里[b]？你是哪一族的人？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“这场灾祸临到我们，究竟是因谁的缘故？”这里的希伯来语“灾祸”指水手所面对的危险，不一定指道德上的恶。
    reason: lexical_alternative
  - marker: b
    text: “你的国土”也可译为“你的国家”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ אֵלָיו
  choice: 他们对他说
  rationale: 未将叙事连接词机械译为“然后”；中文上下文可自然表达连续动作，同时保留复数主语和对约拿说话的对象。
- source_word: הַגִּידָה נָּא לָנוּ
  choice: 请告诉我们
  rationale: הגיד 的使役式表示“告知、说明”，נָא 带有请求或催促语气；“请告诉我们”自然保留了这一语气。
- source_word: בַּאֲשֶׁר לְמִי הָרָעָה הַזֹּאת לָנוּ
  choice: 这场灾祸临到我们，究竟是因谁而起
  rationale: 该短语追问灾祸与何人有关。רָעָה 在此指水手正面对的灾难，而非必然指道德上的邪恶；“因谁而起”保留责任归属的问法，又不额外断定具体因果机制。
- source_word: מַה מְּלַאכְתְּךָ
  choice: 你是做什么的
  rationale: מְלָאכָה 指工作、职业；此译符合现代汉语询问职业的常用表达。
- source_word: וּמֵאַיִן תָּבוֹא
  choice: 从哪里来
  rationale: מֵאַיִן 询问来源或来处；在连续提问中省略重复的“你”，使中文简洁自然。
- source_word: מָה אַרְצֶךָ
  choice: 你的土地在哪里
  rationale: אֶרֶץ 可指土地、地方或国家；正文采用较贴近原词且不预设现代民族国家概念的“土地”，脚注注明自然的替代译法。
- source_word: וְאֵי מִזֶּה עַם אָתָּה
  choice: 你是哪一族的人
  rationale: עַם 指一个人民群体、民族或族群；“哪一族的人”在现代汉语中清楚表达其群体身份含义。
theological_decisions:
- issue: רָעָה 的性质
  choice: 译为“灾祸”
  alternative: 译为“恶”或“祸患”
  rationale: 本节语境是风暴对船员造成的现实威胁，因此“灾祸”准确传达处境含义，同时不把该词预先解释为道德邪恶。
translation_notes:
  register: 采用现代、庄重而口语可懂的连续问句。“你是做什么的”避免生硬的“你的职业是什么”；“土地”保留 אֶרֶץ 的宽泛含义，并用脚注说明其他可能译法。
