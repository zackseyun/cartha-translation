base_translation:
  language: en
  yaml_path: translation/ot/jonah/001/005.yaml
  text: Then the sailors were afraid[a], and each cried out to his god. They threw the cargo that was in the ship into the sea to lighten it for themselves. But Yonah had gone down into the innermost parts of the vessel[b], and he lay down and fell fast asleep.
translation:
  language: zh_hans
  text: 水手们害怕起来，各人都向自己的神呼求。他们把船上的器物[a]抛进海里，好使船轻些。约拿却下到船舱深处[b]，躺下，睡得很沉。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“装备”“物件”，也可能指“货物”。希伯来语原词含义宽泛；这里指为减轻船载而被抛入海中的东西。
    reason: lexical_alternative
  - marker: b
    text: 或译“船的内部深处”或“船舱最里面”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּירְאוּ הַמַּלָּחִים
  choice: 水手们害怕起来
  rationale: וַיִּירְאוּ表示面对危险产生惧怕；“害怕起来”自然呈现叙事中的状态变化。הַמַּלָּחִים明确指水手。
- source_word: וַיִּזְעֲקוּ אִישׁ אֶל־אֱלֹהָיו
  choice: 各人都向自己的神呼求
  rationale: זעק是在危急中大声求告；אִישׁ具有逐一、分配意义，单数后缀则表明每个人向自己所信的神求告。
- source_word: הַכֵּלִים
  choice: 器物
  rationale: כֵּלִים语义宽泛，可指器具、物件、装备或货物；“器物”保留这种宽度，不把所抛之物限定为商业货物。
- source_word: לְהָקֵל מֵעֲלֵיהֶם
  choice: 好减轻船的负载
  rationale: 原短语表达使压在他们那里的重量减轻；中文明确其实际目的为减轻船载，既自然，也不把宾语武断限定为某一类物品。
- source_word: יַרְכְּתֵי הַסְּפִינָה
  choice: 船舱深处
  rationale: יַרְכְּתֵי指内部、尽头或隐蔽深处；结合船只语境，“船舱深处”是自然而不过度技术化的表达。
- source_word: וַיִּשְׁכַּב וַיֵּרָדַם
  choice: 躺下，睡得很沉
  rationale: 分别保留“躺下”和进入沉睡的连续动作；“睡得很沉”准确传达רדם所表示的酣睡。
theological_decisions:
- issue: 异教神祇 אֱלֹהָיו 的表达
  choice: 自己的神
  alternative: 自己的神明／自己的诸神
  rationale: אִישׁ的分配用法和第三人称单数后缀支持“各人……自己的神”，而不是“各人……自己的诸神”。中文不以大小写区分神名，语境已清楚表明这是水手各自所敬奉的神。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。使用中文圣经传统通行名“约拿”。将脚注[a]置于“器物”之后，使标记与其实际解释的希伯来词对应；“却”表现水手慌乱行动与约拿沉睡之间的鲜明对比。
