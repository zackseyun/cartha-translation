  rationale: 修订只收回两处较明确的解释性添加：删去“已经”，并将“减轻船的负载”改为“使船轻些”。同时调整[b]脚注，避免把“内里／深处”限定为“船底”。其余表达及[a]脚注均忠实、自然，无须改动。
