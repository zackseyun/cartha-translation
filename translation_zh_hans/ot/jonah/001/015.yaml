source:
  edition: WLC
  text: וַ/יִּשְׂאוּ֙ אֶת יוֹנָ֔ה וַ/יְטִלֻ֖/הוּ אֶל הַ/יָּ֑ם וַ/יַּעֲמֹ֥ד הַ/יָּ֖ם מִ/זַּעְפּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/001/015.yaml
  text: So they picked up Jonah and threw him into the sea[a], and the sea ceased from its raging.
translation:
  language: zh_hans
  text: 于是，他们抬起约拿，把他扔进海里[a]，海便不再狂怒。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“把他投入海中，海的狂怒便止息了。”
    reason: 保留טול可译为“投入”，以及וַיַּעֲמֹד...מִזַּעְפּוֹ可较形式对应地译为“狂怒便止息了”的表达可能。
lexical_decisions:
- source_word: וַיִּשְׂאוּ
  choice: 抬起
  rationale: נשׂא在这里指具体地把约拿抬起来，以便将他投入海中。“抬起”既保留动作含义，也符合现代汉语表达。
- source_word: וַיְטִלֻהוּ
  choice: 把他扔进
  rationale: טול意为扔、投掷；“扔进”清楚自然，不额外强化为更猛烈的动作。
- source_word: אֶל הַיָּם
  choice: 海里
  rationale: אֶל本可表示“向、到”，但与投掷动作连用时，汉语自然表达为“扔进海里”。
- source_word: וַיַּעֲמֹד הַיָּם
  choice: 海便不再
  rationale: עמד字面有“站住、停止”之意；结合后面的介词短语，表示海停止了先前的狂暴状态。译作“不再”在现代汉语中自然，并保留停止之意。
- source_word: מִזַּעְפּוֹ
  choice: 狂怒
  rationale: זעף可指愤怒、暴烈或狂暴。用于海时，“狂怒”保留原文对海的拟人化，也能传达风浪的猛烈。
theological_decisions:
- issue: 海的狂暴状态所带有的拟人化表达
  choice: 海便不再狂怒
  alternative: 海的狂怒便止息了
  rationale: 原文以זעף描写海，带有鲜明的拟人色彩。“海便不再狂怒”保留这种文学张力，同时没有把经文扩展为关于海具有意志或情感的神学陈述。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“于是”承接前文事件；“抬起……把他扔进……”保持动作次序；末句保留原文对海的拟人化，避免淡化为单纯的“海面平静了”。
