base_translation:
  language: en
  yaml_path: translation/ot/jonah/001/004.yaml
  text: But Yahweh hurled a great wind onto the sea[a], and there was a great storm on the sea[b], so that the ship seemed about to be broken up.
translation:
  language: zh_hans
  text: 但[a]雅威向海上猛掷了一阵大风，海上就起了大风暴，船眼看要破裂了[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“而雅威……”。希伯来语连词וַ־也可仅作叙事承接；这里译为“但”，突出了雅威的行动与约拿逃跑之间的叙事转折。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“船想着要被破坏”，以拟人手法形容船似乎快要破裂。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיהוָה
  choice: 然而，雅威
  rationale: וַ־承接叙事，但在约拿逃避雅威的背景下带出转折，译作“然而”自然呈现这种对比；专名יהוה音译为“雅威”，以保留经文中的神圣名字。
- source_word: הֵטִיל
  choice: 猛掷
  rationale: 该动词表示用力投掷；“猛掷”保留原文鲜明而有力的动作和雅威主动施行的意味，避免弱化为一般的“使……刮起”。
- source_word: רוּחַ גְּדוֹלָה
  choice: 一阵大风
  rationale: 航海语境明确表明רוּחַ在此指风；“大风”也保留本节גָּדוֹל一词的重复。
- source_word: אֶל הַיָּם
  choice: 向海上
  rationale: אֶל与投掷动词连用，表达朝向海面而去的动态，不仅是静态地位于海上。
- source_word: וַיְהִי סַעַר גָּדוֹל
  choice: 于是海上起了大风暴
  rationale: וַיְהִי在这里引出随之发生的情形；“于是……起了”清楚表达结果，“大风暴”保留与前句“大风”的词语呼应。
- source_word: חִשְּׁבָה לְהִשָּׁבֵר
  choice: 眼看就要碎裂了
  rationale: 原文以船为主语，字面是船“想着”要被折断，属于拟人表达；现代汉语用“眼看就要”自然传达迫近的危险，“碎裂”适合描述船体在风暴中解体。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。译作“雅威”旨在以现代汉语音译保留这一盟约名字，而不以称号“主”替代，也不采用源自较晚混合读音传统的“耶和华”。
- issue: 雅威对风暴的主动作用
  choice: 保留“猛掷”的直接施事表达
  alternative: 使海上刮起大风
  rationale: 原文明确以雅威为主语，并用有力的投掷动词。译文保留直接的神圣行动，不把它淡化为间接许可，同时也不增添原文未说明的动机。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“猛掷”有意保留希伯来文的强烈意象；“眼看就要碎裂”则将不宜生硬直译的拟人习语自然传达出来，并由脚注保存其字面形象。
