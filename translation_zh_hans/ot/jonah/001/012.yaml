  text: וַ/יֹּ֣אמֶר אֲלֵי/הֶ֗ם שָׂא֨וּ/נִי֙ וַ/הֲטִילֻ֣/נִי אֶל הַ/יָּ֔ם וְ/יִשְׁתֹּ֥ק הַ/יָּ֖ם מֵֽ/עֲלֵי/כֶ֑ם כִּ֚י יוֹדֵ֣עַ אָ֔נִי כִּ֣י בְ/שֶׁ/לִּ֔/י הַ/סַּ֧עַר הַ/גָּד֛וֹל הַ/זֶּ֖ה עֲלֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/001/012.yaml
  text: And he said to them[a], “Pick me up and throw me into the sea, and the sea will become calm for you[c][b], for I know that this great storm is upon you because of me.”
translation:
  language: zh_hans
  text: 他对他们说：“把我抬起来，扔进海里，海就会为你们平静下来[a]，因为我知道，这场大风暴临到你们，是因我的缘故。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“海就会从你们身上安静下来。”
    reason: 保留 מֵעֲלֵיכֶם 的空间意象及 שׁתק 的字面表达。
lexical_decisions:
- source_word: שָׂאוּנִי
  choice: 把我抬起来
  rationale: 此处指水手先将约拿抬起，再把他投入海中；“抬起来”既保留具体动作，也符合现代汉语。
- source_word: וַהֲטִילֻנִי
  choice: 扔进海里
  rationale: טול 的使役式表示投掷；“扔进”清楚自然，又不额外强化动作的猛烈程度。
- source_word: וְיִשְׁתֹּק הַיָּם מֵעֲלֵיכֶם
  choice: 海就会为你们平静下来
  rationale: שׁתק 字面为“安静”，以海为主语时表示风浪止息；מעליכם 字面带有“从你们身上离开”的意象，正文按汉语习惯表达其结果，并以脚注保留原文措辞。
- source_word: בְשֶׁלִּי
  choice: 因我的缘故
  rationale: 该词组表示原因或责任；这一译法自然、庄重，并明确保留约拿承认自己是风暴缘由的意思。
- source_word: הַסַּעַר הַגָּדוֹל הַזֶּה
  choice: 这场大风暴
  rationale: 保留指示词及“强大、猛烈”的程度描述，同时采用现代汉语常用量词。
- source_word: עֲלֵיכֶם
  choice: 临到你们
  rationale: על 字面有“在……之上”的意象；“临到”在此能自然表达风暴落在他们身上的处境，而不把它解释为敌对行动。
theological_decisions:
- issue: 约拿对风暴责任的承认
  choice: 明确译为风暴临到水手“是因我的缘故”
  alternative: 仅表达风暴与约拿有关，而不明确表示他的责任
  rationale: בשלי 在本句中明确表示原因或归责；译文应保留约拿的自我承认，不将其淡化为单纯关联。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“抬起来，扔进海里”保留连续动作；“为你们平静下来”使希伯来语习语在汉语中自然通顺，脚注则呈现其较直译的形式。
