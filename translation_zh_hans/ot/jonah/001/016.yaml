  text: וַ/יִּֽירְא֧וּ הָ/אֲנָשִׁ֛ים יִרְאָ֥ה גְדוֹלָ֖ה אֶת יְהוָ֑ה וַ/יִּֽזְבְּחוּ זֶ֨בַח֙ לַֽ/יהוָ֔ה וַֽ/יִּדְּר֖וּ נְדָרִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/001/016.yaml
  text: Then the men feared Yahweh with great fear[a], and they offered a sacrifice to Yahweh and made vows.
translation:
  language: zh_hans
  text: 那些人就大大敬畏雅威[a]，向雅威献祭，并且许愿。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“非常害怕雅威”，或“极其尊崇雅威”。希伯来文直译为“那些人对雅威惧怕了极大的惧怕”。
    reason: 保留 ירא 既可侧重恐惧、也可侧重敬畏的语义幅度，并说明动词与同根名词构成的强调表达。
lexical_decisions:
- source_word: וַיִּירְאוּ ... יִרְאָה גְדוֹלָה
  choice: 大大敬畏
  rationale: 动词 ירא 与同根名词 יִרְאָה 构成强调表达，直译近似“惧怕了极大的惧怕”。“大大敬畏”在现代汉语中既保留强烈程度，也能容纳惧怕、震撼与崇敬的复合意味，并与随后献祭、许愿的敬拜反应相称。
- source_word: הָאֲנָשִׁים
  choice: 众人
  rationale: 原文为普通名词“那些人／众人”。上下文虽表明他们是船员，本节仍不必将原词具体化为“水手”；“众人”自然地承接前文群体。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以音译呈现四字神名，区别于称号“主”，保留原文使用上帝专名的特点。
- source_word: וַיִּזְבְּחוּ זֶבַח
  choice: 献祭
  rationale: 希伯来语动词与同根名词连用，表达举行祭献；汉语“献祭”简洁自然，并保留礼仪含义。
- source_word: לַיהוָה
  choice: 向雅威
  rationale: 介词 ל 标明祭物奉献的对象；“向雅威”准确表达献祭的指向。
- source_word: וַיִּדְּרוּ נְדָרִים
  choice: 许愿
  rationale: 动词与同根复数名词组成惯用表达，指向上帝作出庄重承诺；“许愿”是现代中文圣经语境中自然且准确的说法。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华／上主
  rationale: 原文直接使用四字神名。采用“雅威”作为现代汉语音译，保留专名性质，不以称号替代，也不赋予额外宗派含义。
- issue: 对雅威之“惧怕”的性质
  choice: 大大敬畏
  alternative: 非常害怕雅威／极其尊崇雅威
  rationale: 原文的 ירא 可包含恐惧与敬畏；海面平静引起震撼，而献祭、许愿又体现崇敬。“敬畏”不把语义缩减为单纯惊恐或纯粹尊崇，脚注进一步保留两种侧重。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“众人就”承接上一节海浪平息后的即时反应；两个“雅威”依原文重复，不以代词替换。“献祭，并且许愿”保持两个连续行动的并列关系。
