id: JON.1.14
reference: Jonah 1:14
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יִּקְרְא֨וּ אֶל יְהוָ֜ה וַ/יֹּאמְר֗וּ אָנָּ֤ה יְהוָה֙ אַל נָ֣א נֹאבְדָ֗ה בְּ/נֶ֨פֶשׁ֙ הָ/אִ֣ישׁ הַ/זֶּ֔ה וְ/אַל תִּתֵּ֥ן עָלֵ֖י/נוּ דָּ֣ם נָקִ֑יא כִּֽי אַתָּ֣ה יְהוָ֔ה כַּ/אֲשֶׁ֥ר חָפַ֖צְתָּ עָשִֽׂיתָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/001/014.yaml
  text: Then they cried out to Yahweh and said[a], “Please, Yahweh, do not let us perish on account of this man's life, and do not put innocent blood on us, for you, Yahweh[b], have done as you pleased.”
translation:
  language: zh_hans
  text: 于是，他们向雅威呼求说：“雅威啊，求你不要让我们因这人的性命[a]而丧命，也不要把无辜人的血归在我们身上[b]，因为你，雅威，所喜悦的，你已经做了。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “因这人的性命”也可理解为“因取这人的性命”或“因这个人”。
    reason: lexical_alternative
  - marker: b
    text: “把无辜人的血归在我们身上”意思是“使我们担当流无辜人之血的罪”，也可译作“追究我们流无辜人之血的罪”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרְאוּ אֶל־יְהוָה
  choice: 他们向雅威呼求
  rationale: קרא אל 在风暴与危急的语境中表示向上帝发出迫切恳求；“呼求”兼顾紧迫感、祷告意味和现代汉语的自然表达。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常用音译呈现四字神名，保留其作为专名的性质，不以称号替代。
- source_word: אָנָּה
  choice: 求你
  rationale: 该语气词表达急切恳求；“求你”在现代汉语祷告语境中自然、庄重。
- source_word: אַל־נָא נֹאבְדָה
  choice: 求你不要……让我们丧命
  rationale: 否定词与祈愿式表达恳求他们不要灭亡；“不要让我们丧命”不额外限定上帝致使或许可的方式。
- source_word: בְּנֶפֶשׁ הָאִישׁ הַזֶּה
  choice: 因这人的性命
  rationale: נפש 在这里主要指人的生命；这一较贴近原文的表达保留了介词短语可能表示“因这人的性命”或“因取这人的性命”的张力，并以脚注说明。
- source_word: וְאַל־תִּתֵּן עָלֵינוּ דָּם נָקִיא
  choice: 也不要把无辜人的血归在我们身上
  rationale: 保留希伯来语“把血加在／归在某人身上”的血债意象，同时用汉语可理解的“归在我们身上”表达承担流血罪责。
- source_word: כִּי אַתָּה יְהוָה
  choice: 因为你雅威
  rationale: כִּי 引出他们恳求的根据；保留神名，并维持原句直接对上帝说话的语气。
- source_word: כַּאֲשֶׁר חָפַצְתָּ עָשִׂיתָ
  choice: 照自己所喜悦的做了
  rationale: חפץ 指意愿、喜悦之事，עשה 为完成式；此译法保留已成事实的语气及上帝行动不受人支配的含义，而不引入后来的系统神学术语。
theological_decisions:
- issue: 如何译出神名 יְהוָה
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。采用“雅威”保留专名，并避免以称号“主”替代；“耶和华”是传统形式，但与学界通常重构的发音距离较远。
- issue: 是否在正文中明确解释“无辜之血”为血债或罪责
  choice: 保留“把无辜人的血归在我们身上”的血之意象
  alternative: 不要使我们担当杀害无辜者的罪
  rationale: 原文使用具体而带法律伦理色彩的“血”语汇。正文保留这一意象，脚注再说明其罪责含义，避免把解释直接取代原文。
- issue: בְּנֶפֶשׁ הָאִישׁ הַזֶּה 是否明确指“杀死这人”
  choice: 正文译作“因这人的性命”，保留关系上的含混
  alternative: 因取这人的性命；因这个人
  rationale: 该短语在当前情境中很可能涉及把约拿抛入海中而夺去其生命，但原文本身没有明说“取走”。较形式对应的正文配合脚注，可同时保留词义和语境解释。
translation_notes:
  register: 采用现代、庄重且易懂的祷告语体。“呼求”“丧命”“归在我们身上”保留叙事的危急感和原文的血债意象；句法略贴近希伯来语，但避免生硬的逐词翻译。脚注标记均置于其实际说明的短语之后。
