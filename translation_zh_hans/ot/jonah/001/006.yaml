- from: 船长走近约拿，对他说[a]：“你怎么还在睡觉？起来，求告你的神！或许那神会顾念我们[b]，使我们不至灭亡。”
  to: 船长走近约拿，对他说[a]：“你怎么还在睡觉？起来，求告你的神！或许那位神会顾念我们[b]，使我们不至灭亡。”
  rationale: 仅作两项安全的语言修订：以“那位神”提升定指表达的现代汉语自然度；并修正脚注a中不通顺、可能误导的替代译法。其余正文保留，因为其准确反映原文的急迫责问、祈求命令、可能性语气和避免灭亡的盼望。
