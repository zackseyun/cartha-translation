  text: וַ/יִּקְרַ֤ב אֵלָי/ו֙ רַ֣ב הַ/חֹבֵ֔ל וַ/יֹּ֥אמֶר ל֖/וֹ מַה לְּ/ךָ֣ נִרְדָּ֑ם ק֚וּם קְרָ֣א אֶל אֱלֹהֶ֔י/ךָ אוּלַ֞י יִתְעַשֵּׁ֧ת הָ/אֱלֹהִ֛ים לָ֖/נוּ וְ/לֹ֥א נֹאבֵֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/001/006.yaml
  text: So the captain came near to him and said to him[a], “What do you mean, sleeper? Get up, call on your god. Perhaps the god will give thought to us[c][b], so that we may not perish.”
translation:
  language: zh_hans
  text: 船长走近约拿，对他说[a]：“你怎么还在睡觉？起来，求告你的神！或许那位神会顾念我们[b]，使我们不至灭亡。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “船长”原文直译为“水手之首”，也可译作“水手长”或“船上的主事者”。
    reason: lexical_alternative
  - marker: b
    text: “顾念”所译的希伯来语动词较为罕见，也可理解为“留意”或“关切”。
    reason: lexical_alternative
lexical_decisions:
- source_word: רַב הַחֹבֵל
  choice: 船长
  rationale: 原文直指水手之首；“船长”是现代汉语中自然、准确的职务称谓。
- source_word: וַיִּקְרַב אֵלָיו
  choice: 走近约拿
  rationale: 保留“靠近、走近”的实际动作；按中文叙事习惯以“约拿”明确代词所指。
- source_word: מַה לְּךָ נִרְדָּם
  choice: 你怎么还在睡觉？
  rationale: 原文是简短而尖锐的责问，字面结构非常凝练；此译自然传达惊讶和斥责，也保留他此刻正在沉睡之意。
- source_word: קוּם
  choice: 起来
  rationale: 直接、急迫的命令，符合现代汉语。
- source_word: קְרָא אֶל אֱלֹהֶיךָ
  choice: 求告你的神
  rationale: קרא אל 在此指向神呼求、祈求；“求告”既自然又准确体现宗教语境。
- source_word: אוּלַי
  choice: 或许
  rationale: 保留说话者的不确定和微弱盼望。
- source_word: יִתְעַשֵּׁת
  choice: 会顾念
  rationale: 这个罕见动词在语境中可指留意、想到或关切；“顾念”简洁地兼顾注意与关怀，而不预先断定具体行动。
- source_word: הָאֱלֹהִים
  choice: 那神
  rationale: 船长是在泛指约拿刚被要求呼求的那位神；“那神”保留定指关联，又不把船长的话改写成明确承认耶和华。
- source_word: לָנוּ
  choice: 我们
  rationale: 作为“顾念”的对象，现代汉语无需把希伯来语介词逐字译出。
- source_word: וְלֹא נֹאבֵד
  choice: 使我们不至灭亡
  rationale: 自然表达所盼望的结果，并保留“灭亡”的严重语气。
theological_decisions:
- issue: 异教船长话语中 אֱלֹהֶיךָ 与 הָאֱלֹהִים 的所指
  choice: 译作“你的神……那神”
  alternative: “你的上帝……上帝”或“你的神……上帝”
  rationale: 船长要求约拿呼求他自己的神，尚未按名承认以色列的耶和华。“那神”承接“你的神”，保留叙事中的泛指视角，同时不妨碍读者明白约拿所信的是耶和华。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。责问句保持急迫感，不机械复制希伯来语“你怎么了，沉睡的人？”的生硬结构；神称采用“你的神／那神”，保留异教船长的言语视角与原文张力。
