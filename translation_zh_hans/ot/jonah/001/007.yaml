  text: וַ/יֹּאמְר֞וּ אִ֣ישׁ אֶל רֵעֵ֗/הוּ לְכוּ֙ וְ/נַפִּ֣ילָה גֽוֹרָל֔וֹת וְ/נֵ֣דְעָ֔ה בְּ/שֶׁ/לְּ/מִ֛י הָ/רָעָ֥ה הַ/זֹּ֖את לָ֑/נוּ וַ/יַּפִּ֨לוּ֙ גּֽוֹרָל֔וֹת וַ/יִּפֹּ֥ל הַ/גּוֹרָ֖ל עַל יוֹנָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/001/007.yaml
  text: And they said[a], each man to his companion, “Come, let us cast lots, so that we may know on whose account this evil has come upon us.” So they cast lots, and the lot fell on Jonah.
translation:
  language: zh_hans
  text: 他们彼此说：“来吧，我们抽签，好知道这场临到我们的灾祸[a]是因谁而起。”于是他们抽签，签就落在约拿身上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “灾祸”所译的希伯来词也可表示“恶”“祸患”或“灾难”，具体含义取决于上下文。
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ אֶל־רֵעֵהוּ
  choice: 彼此说
  rationale: 这是希伯来语表示众人互相说话的惯用结构；译为“彼此”比逐字译作“各人对同伴”更符合现代汉语，同时保留相互交流的含义。
- source_word: לְכוּ
  choice: 来吧
  rationale: 该命令式在此用于发起共同的行动；“来吧”自然传达劝请和号召的语气。
- source_word: וְנַפִּילָה גוֹרָלוֹת
  choice: 我们抽签
  rationale: 动词形式表达共同意愿；“抽签”是现代汉语对此做法的通常说法。
- source_word: וְנֵדְעָה
  choice: 好知道
  rationale: 连接词加意愿式在这里表明抽签的目的；“好知道”简洁地保留目的关系。
- source_word: בְּשֶׁלְּמִי
  choice: 是因谁而起
  rationale: 该表达询问灾祸因谁而临到，指出原因或责任来源，但不额外强化道德定罪。
- source_word: הָרָעָה הַזֹּאת
  choice: 这场灾祸
  rationale: רָעָה 可指恶、伤害或灾难；在风暴语境中，“灾祸”最自然地指他们正在遭遇的危难，同时用脚注保留原词的语义范围。
- source_word: לָנוּ
  choice: 临到我们
  rationale: 希伯来文在此没有明说“临到”，但与“灾祸”搭配时，现代汉语需要补出合乎语境的谓语；此译法准确表达其落在众人身上的意思。
- source_word: וַיַּפִּלוּ גּוֹרָלוֹת
  choice: 于是他们抽签
  rationale: 叙事动词推进事件；“于是”既表达先后，也承接他们刚才提出的做法。
- source_word: וַיִּפֹּל הַגּוֹרָל עַל־יוֹנָה
  choice: 签就落在约拿身上
  rationale: 较贴近希伯来文“签落在……之上”的表达，并在现代汉语中清楚传达抽签结果指向约拿。
theological_decisions:
- issue: 在具有神意背景的灾难语境中如何翻译 רָעָה
  choice: 这场灾祸
  alternative: 这恶事；这场灾难
  rationale: 水手所说的是临到他们的危难，而不是他们正在实施的道德恶行。“灾祸”符合直接语境，也不预先解释神的作为或人的罪责；脚注保留该希伯来词可指“恶”的词义张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“来吧”保留共同提议的语气；“签就落在约拿身上”略带经文叙事色彩，但含义清楚，并贴近原文意象。
