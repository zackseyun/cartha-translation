  text: וַ/יִּֽירְא֤וּ הָֽ/אֲנָשִׁים֙ יִרְאָ֣ה גְדוֹלָ֔ה וַ/יֹּאמְר֥וּ אֵלָ֖י/ו מַה זֹּ֣את עָשִׂ֑יתָ כִּֽי יָדְע֣וּ הָ/אֲנָשִׁ֗ים כִּֽי מִ/לִּ/פְנֵ֤י יְהוָה֙ ה֣וּא בֹרֵ֔חַ כִּ֥י הִגִּ֖יד לָ/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/001/010.yaml
  text: Then the men were greatly afraid[a], and they said to him, “What is this that you have done?” For the men knew that he was fleeing from the presence of Yahweh, because he had told them.
translation:
  language: zh_hans
  text: 众人就非常惧怕[a]，对他说：“你做的这是什么事？”原来众人知道他正从雅威面前逃走，因为他已经告诉了他们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“惧怕了极大的惧怕。”
    reason: 说明希伯来文以同源词重复来加强语气。
lexical_decisions:
- source_word: וַיִּירְאוּ ... יִרְאָה גְדוֹלָה
  choice: 非常惧怕
  rationale: 原文以同源宾语直译为“惧怕了极大的惧怕”，用来加强语气；“非常惧怕”以自然现代汉语保留这种强烈程度。
- source_word: הָאֲנָשִׁים
  choice: 众人
  rationale: 该词在此是普通的“人们／众人”，并未明确使用“水手”一词；译作“众人”既符合上下文，也避免增添原文没有的身份称谓。
- source_word: מַה זֹּאת עָשִׂיתָ
  choice: 你做的这是什么事？
  rationale: 保留原文“这”的指示意味和责问语气，同时采用自然清楚的现代汉语表达。
- source_word: מִלִּפְנֵי יְהוָה
  choice: 逃离雅威面前
  rationale: לִפְנֵי表示“在……面前／临在之处”；这一译法保留约拿企图逃离上帝面前的神学张力，而不将其弱化为单纯逃避任务。
- source_word: יְהוָה
  choice: 雅威
  rationale: 原文使用四字神名，译作“雅威”以保留其作为以色列上帝专名的性质，不以称号替代。
- source_word: בֹרֵחַ
  choice: 正在逃离
  rationale: 原文分词呈现持续进行的行动；“正在逃离”明确传达这一体貌。
- source_word: כִּי ... כִּי
  choice: 原来……因为
  rationale: 第一个כִּי说明众人发问的背景，第二个כִּי说明他们得知此事的原因；分别译作“原来”和“因为”，清楚呈现两层逻辑关系。
- source_word: הִגִּיד לָהֶם
  choice: 他已经告诉了他们
  rationale: 该行动先于众人的得知与发问；“已经”自然表达这种先后关系。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”较贴近通常重构的希伯来语读音，也保留专名性质。
- issue: מִלִּפְנֵי יְהוָה所表达的逃离对象
  choice: 逃离雅威面前
  alternative: 逃避雅威
  rationale: 选择保留“面前／临在”的空间性和神学反讽，不把原文简化为一般意义的违抗或逃避。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“你做的这是什么事？”保留责问力度；“逃离雅威面前”略带经文语体，以承载原文“从……面前”的意象。
