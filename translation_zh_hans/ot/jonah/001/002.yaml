  rationale: 将“大声斥责它”调整为“向它发出谴责的宣告”，以更完整地反映קרא的公开宣告功能及על在本语境中的针对性；将“上达到”简化为“上达”，改善现代汉语的自然度。其余表达保留原译对城市单数“它”与居民复数“他们”的区分，并不添加特定神学解释。
