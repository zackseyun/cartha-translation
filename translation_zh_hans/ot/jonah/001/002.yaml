id: JON.1.2
reference: Jonah 1:2
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: ק֠וּם לֵ֧ךְ אֶל נִֽינְוֵ֛ה הָ/עִ֥יר הַ/גְּדוֹלָ֖ה וּ/קְרָ֣א עָלֶ֑י/הָ כִּֽי עָלְתָ֥ה רָעָתָ֖/ם לְ/פָנָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/001/002.yaml
  text: Arise[a], go to Nineveh, the great city, and cry out against it[b], because their evil has come up before me.
translation:
  language: zh_hans
  text: 起来，到尼尼微那座大城去，向它发出谴责的宣告[a]，因为他们的恶行[b]已经上达我面前。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“向它大声宣告”。这里的希伯来语也可作较一般的“关于它”或“向它”宣告；但结合下文，较可能带有针对尼尼微、谴责其罪恶的意味。
    reason: 保留קרא על在此处较一般的宣告与针对性谴责两种语义幅度。
  - marker: b
    text: 或译“邪恶”。
    reason: רָעָה可指道德上的邪恶；“恶行”突出其具体行为面，“邪恶”则更概括。
lexical_decisions:
- source_word: ק֠וּם
  choice: 起来
  rationale: 命令式在这里发出突然、有力的先知性召唤；“起来”庄重而自然，也与后面的“去”衔接。
- source_word: לֵ֧ךְ אֶל
  choice: 到……去
  rationale: 表达朝目的地前往；现代汉语用“到……去”比逐字译作“往……去”更流畅。
- source_word: נִֽינְוֵ֛ה
  choice: 尼尼微
  rationale: 采用现代中文圣经传统中通行的专名译法。
- source_word: הָעִ֥יר הַגְּדוֹלָ֖ה
  choice: 那座大城
  rationale: 保留同位语结构；“大”既可指规模，也可含重要、显著之意，不将语义缩限为面积庞大。
- source_word: וּקְרָ֣א עָלֶ֑יהָ
  choice: 大声斥责它
  rationale: קרא具有公开、大声宣告的意味；在本句以尼尼微的恶行为理由，על很可能带有针对、反对的语气。“斥责”自然传达审判性的宣告，同时以脚注保留较一般的理解。
- source_word: כִּֽי
  choice: 因为
  rationale: 引出差遣约拿前往尼尼微的原因，现代汉语因果关系清楚。
- source_word: עָלְתָ֥ה
  choice: 已经上达到
  rationale: 既表达完成体所呈现的既成事实，也保留原文“上升、达到”的垂直意象。
- source_word: רָעָתָ֖ם
  choice: 他们的恶行
  rationale: 此处指尼尼微居民招致神审判的道德败坏；“恶行”在现代汉语中明确、自然，也保留集合性含义。
- source_word: לְפָנָֽי
  choice: 我面前
  rationale: 保留原文关系性和审判性的临在表达，比单译“被我知道”更贴近源语意象。
theological_decisions:
- issue: וּקְרָא עָלֶיהָ所表达的宣告性质
  choice: 译作“大声斥责它”，体现针对尼尼微的审判性宣告
  alternative: 译作“向它大声宣告”，不明说宣告带有反对或斥责意味
  rationale: קרא与על的组合，加上后句说明尼尼微人的恶行已经达到神面前，较强地支持谴责性理解；但介词על也可作较宽泛的“关于、向着”理解，因此以脚注保留该词组的真实语义幅度。
- issue: 城市的单数指称与居民的复数指称
  choice: 保留“它”与“他们”的转换
  alternative: 统一译成“那里的人”或“尼尼微人”
  rationale: 原文先以阴性单数代词指向尼尼微城，随后以阳性复数所有后缀指向城中居民；保留转换可呈现原文从城市到居民的焦点移动，不予消除。
- issue: רָעָה在本节中的含义
  choice: 按道德意义译作“恶行”
  alternative: 译作“灾祸”
  rationale: 这里该词是神差遣先知针对尼尼微发出宣告的原因，复数所有后缀又指向居民，因此上下文支持“邪恶、恶行”，而不是临到他们的灾祸。
translation_notes:
  register: 采用现代、庄重而易懂的普通话书面语。保留命令句的急迫感、原文“上达到我面前”的空间意象，以及从城的单数指称转向居民复数指称的变化；避免古奥表达，也不额外加入特定宗派解释。
