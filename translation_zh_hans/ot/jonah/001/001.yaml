  yaml_path: translation/ot/jonah/001/001.yaml
  text: The word of Yahweh came to Jonah son of Amittai[a], saying[b],
translation:
  language: zh_hans
  text: 耶和华的话临到亚米太的儿子约拿，说：[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译可作：“于是，耶和华的话临到……说。”句首结构是希伯来叙事常用的开篇方式。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: （融入“临到”）
  rationale: 这是希伯来叙事常用的起始结构；汉语不必生硬译作“事情发生了”，其叙事推进作用可由整句自然表达。
- source_word: דְּבַר יְהוָה
  choice: 耶和华的话
  rationale: 保留先知书中固定表达的具体词义及互文色彩；“信息”虽通顺，却弱化了“话”的原文意象。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经语境中通行的专名形式表达四字神名，而不改作称号“主”。
- source_word: אֶל
  choice: 临到
  rationale: 与“话”搭配时，“临到”自然表达启示传向领受者的关系，并符合庄重的先知叙事语体。
- source_word: יוֹנָה בֶן אֲמִתַּי
  choice: 亚米太的儿子约拿
  rationale: 按现代汉语自然次序表达希伯来文父系身份说明，并采用通行中文人名。
- source_word: לֵאמֹר
  choice: 说：
  rationale: 该不定式引出下一节的直接话语；用“说：”清楚保留其引语功能。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威；主
  rationale: 原文直接使用四字神名。正文保留其专名性质；“耶和华”是现代中文读者最熟悉且可辨识的形式，同时不以称号“主”替代。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“耶和华的话临到”保留先知书公式化表达；句末用冒号承接下一节神的话。
