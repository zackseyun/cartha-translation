  text: וַ/יֹּ֥אמֶר אֲלֵי/הֶ֖ם עִבְרִ֣י אָנֹ֑כִי וְ/אֶת יְהוָ֞ה אֱלֹהֵ֤י הַ/שָּׁמַ֨יִם֙ אֲנִ֣י יָרֵ֔א אֲשֶׁר עָשָׂ֥ה אֶת הַ/יָּ֖ם וְ/אֶת הַ/יַּבָּשָֽׁה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/001/009.yaml
  text: He said to them[a], “I am a Hebrew, and I fear Yahweh, the God of heaven[b], who made the sea and the dry land.”
translation:
  language: zh_hans
  text: 他对他们说：“我是希伯来人；我敬畏[a]雅威[b]——天上的上帝，就是那造海和干地的。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “敬畏”也可译作“惧怕”“尊崇”或“敬拜”。这里保留其较宽的含义。
    reason: lexical_alternative
  - marker: b
    text: “雅威”是希伯来文神名“YHWH”的音译；传统译本常译作“耶和华”或以“主”代替。
    reason: divine_name
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵיהֶם
  choice: 他对他们说
  rationale: 自然表达希伯来叙事句式；句首连接词在此主要承接叙事，无须机械译出。
- source_word: עִבְרִי אָנֹכִי
  choice: 我是希伯来人
  rationale: “希伯来人”是现代汉语中清楚、通行的族群自称；显式保留第一人称，体现原文强调。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以常见汉语音译保留四字神名的专名性质，而不以称号代替。
- source_word: אֱלֹהֵי הַשָּׁמַיִם
  choice: 天上的上帝
  rationale: 这是现代汉语自然表达；原文“天”在形态上为复数，但此处不必生硬译作“诸天”。
- source_word: יָרֵא
  choice: 敬畏
  rationale: 该词用于人对上帝的态度，可涵盖畏惧、尊崇乃至敬拜。“敬畏”既自然又保留较宽语义，不把约拿的宣称简化成单纯害怕或宗教礼仪。
- source_word: עָשָׂה
  choice: 造
  rationale: 简洁对应常用动词“做、造”，不额外强化为更具术语色彩的“创造”。
- source_word: הַיָּם
  choice: 海
  rationale: 准确、自然，并符合本段航海语境。
- source_word: הַיַּבָּשָׁה
  choice: 旱地
  rationale: 明确表达与海相对的干燥陆地，也呼应创世叙述中的常用概念。
- source_word: אָנֹכִי ... אֲנִי
  choice: 我是……我敬畏
  rationale: 两个分句都明确使用第一人称，以自然汉语保留原文重复代词所带的自我陈述色彩。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用以色列上帝的专名。音译“雅威”保留其专名性质；脚注说明其他常见处理，避免读者误以为原文只是称号。
- issue: 约拿自称 יָרֵא יְהוָה 的语义力度
  choice: 敬畏雅威
  alternative: 惧怕雅威；敬拜雅威
  rationale: 原词可指畏惧、尊崇或敬拜性的忠诚。上下文使约拿的自称与其行为之间形成张力，因此正文不将它限定为单纯“敬拜”，也不解释掉其中的反讽。
- issue: אֱלֹהֵי הַשָּׁמַיִם 与造海、旱地的关系
  choice: 天上的上帝，就是那造海和旱地的
  alternative: 天的上帝，他造了海和旱地
  rationale: 用同位说明自然连接神的称号与造物主身份，同时保留关系从句对雅威的限定描述。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。“希伯来人”“天上的上帝”“海和旱地”均为普通读者易懂的表达。破折号帮助读者识别“天上的上帝”与后续造物描述的同位关系。脚注标记按正文实际所释词语安置：神名后为[a]，全句末为涉及“敬畏”的[b]。
