id: JON.1.3
reference: Jonah 1:3
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יָּ֤קָם יוֹנָה֙ לִ/בְרֹ֣חַ תַּרְשִׁ֔ישָׁ/ה מִ/לִּ/פְנֵ֖י יְהוָ֑ה וַ/יֵּ֨רֶד יָפ֜וֹ וַ/יִּמְצָ֥א אָנִיָּ֣ה בָּאָ֣ה תַרְשִׁ֗ישׁ וַ/יִּתֵּ֨ן שְׂכָרָ֜/הּ וַ/יֵּ֤רֶד בָּ/הּ֙ לָ/ב֤וֹא עִמָּ/הֶם֙ תַּרְשִׁ֔ישָׁ/ה מִ/לִּ/פְנֵ֖י יְהוָֽה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/001/003.yaml
  text: But Jonah rose to flee to Tarshish from the presence of Yahweh[a]. He went down to Joppa and found a ship going to Tarshish. He paid its fare and went down into it to go with them to Tarshish[c][b], away from the presence of Yahweh.
translation:
  language: zh_hans
  text: 约拿却起来，逃往他施，躲避耶和华[a]。他下到约帕，找到一艘正驶往他施的船[c]；他付了船费，就下到船里[b]，好和他们一同往他施去，躲避耶和华。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“离开耶和华”；原文直译为“从耶和华面前”。
    reason: lexical_alternative
  - marker: b
    text: 原文在这里再次使用“下去”。这一重复延续了本章叙事中不断向下的动势。
    reason: literary_feature
  - marker: c
    text: 或译“正驶向他施”。原文的表达直译为“一艘来／往他施的船”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: 起来
  rationale: 保留希伯来语“起来”的叙事表达，并以“却”体现约拿的行动与上文命令相逆。
- source_word: לִבְרֹחַ
  choice: 要逃往
  rationale: “逃”准确表达 ברח 的逃离含义；与目的地“他施”自然衔接。
- source_word: תַּרְשִׁישָׁה
  choice: 往他施
  rationale: 方向词尾表示朝向他施；“往他施”是自然、简洁的现代汉语。
- source_word: מִלִּפְנֵי יְהוָה
  choice: 躲避耶和华的面
  rationale: 保留“面”这一具体意象及试图逃离上帝临在的神学张力；“躲避”在汉语中清楚表达 מִן 的离开意味。
- source_word: יָפוֹ
  choice: 约帕
  rationale: 采用中文圣经传统中该古代港口的通行译名。
- source_word: אָנִיָּה
  choice: 船
  rationale: 该词指航海船只；“船”在现代汉语中自然且足够明确。
- source_word: בָּאָה תַרְשִׁישׁ
  choice: 要开往他施
  rationale: בוא 在带目的地的航行情境中表示朝该地行进；“开往”符合现代汉语对船只航向的表达，同时用脚注保留其字面形式的歧义。
- source_word: שְׂכָרָהּ
  choice: 船费
  rationale: שׂכר 在此指搭船所付费用；“船费”明确自然，不额外断定他是否包下整艘船。
- source_word: וַיֵּרֶד בָּהּ
  choice: 下到船里
  rationale: 保留 ירד“下去”的重复及 בָּהּ“进入其中”的空间表达，延续本章向下的叙事运动。
- source_word: לָבוֹא עִמָּהֶם
  choice: 要同船上的人一起往……去
  rationale: “同……一起去”自然传达同行之意；“船上的人”清楚交代复数代词“他们”的所指而不武断限定其身份。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代简体中文圣经语境中对四字神名的通行音译，明确将其作为专名呈现。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威；上主
  rationale: 原文直接使用四字神名。中文正文采用读者最熟悉的专名形式“耶和华”，不以称号代替，也不借此引入特定宗派解释。
- issue: מִלִּפְנֵי יְהוָה 是否解释为能够逃离上帝的临在
  choice: 躲避耶和华的面
  alternative: 离开耶和华；躲避耶和华的同在
  rationale: 保留原文“从耶和华面前”的具体意象和约拿行动中的反讽，不把叙述误解成神学断言，也不在正文中消解其张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“起来”“下到船里”“耶和华的面”等表达适度保留希伯来叙事的重复和具体意象；“开往”“船费”等则确保普通现代读者易于理解。脚注标记依正文首次涉及之处按 [a]、[b]、[c] 呈现。
