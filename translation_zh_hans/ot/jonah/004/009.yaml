base_translation:
  language: en
  yaml_path: translation/ot/jonah/004/009.yaml
  text: Then God said to Jonah[a], “Is it right for you to be angry about the plant?” And he said, “It is right for me to be angry, even to death.”
translation:
  language: zh_hans
  text: 神对约拿说：“你因这株植物[a]发怒，这样做对吗？”约拿说：“我这样发怒，直到死都是对的。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “植物”：希伯来文为 קִיקָיוֹן（qiqayon），具体是哪一种植物不能确定；传统译法包括“葫芦”或“藤”，也有人认为是蓖麻。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַהֵיטֵב חָרָה לְךָ
  choice: 你……发怒，合理吗
  rationale: 该结构询问约拿的愤怒是否正当；译为“合理吗”既传达评价意味，也符合现代汉语表达。
- source_word: חָרָה
  choice: 发怒／气
  rationale: 此处指愤怒，不是字面的燃烧；在问句中用“发怒”较庄重，在强化语中用“气到死”较自然。
- source_word: עַל הַקִּיקָיוֹן
  choice: 因这株植物
  rationale: עַל在此表示愤怒的缘由；קִיקָיוֹן的具体植物种类无法确定，因此正文采用不作过度认定的泛称。
- source_word: הֵיטֵב חָרָה לִי
  choice: 我发怒是合理的
  rationale: 保留约拿对上帝问句的直接呼应，以及他坚持自己的愤怒正当这一语气。
- source_word: עַד מָוֶת
  choice: 甚至气到死也合理
  rationale: 保留“直到死亡”的极端强化，同时不武断判定约拿究竟是说自己气得要死，还是宁愿死去。
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: 希伯来叙事连接词在本节无需逐一译为“于是／然后”；简洁的“说”在现代汉语中自然，并保持对话推进。
theological_decisions:
- issue: 上帝的问题和约拿回答中的道德评价
  choice: 以“合理吗／是合理的”表达愤怒是否正当
  alternative: 译作“你这样发怒好吗／我这样发怒很好”
  rationale: 原文不仅陈述愤怒，还追问其正当性。采用“合理”能保留上帝的伦理质问以及约拿针锋相对的自我辩护。
- issue: קִיקָיוֹן的植物种类
  choice: 正文译作“植物”
  alternative: 葫芦、藤、蓖麻或音译“基卡永”
  rationale: 具体物种不确定，正文不宜制造虚假的植物学精确性；传统及可能的辨认置于脚注。
- issue: עַד מָוֶת的含义张力
  choice: 译作“甚至气到死也合理”
  alternative: “我气得要死也有理”或“我发怒以至于死也是合理的”
  rationale: 原文简短且可表达怒至极点，也可能涉及求死心态。所选译法保留这种张力，不把它缩减为单纯的习语“气死了”。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。问答双方重复“合理”，以保留原文的鲜明平行；末句略带口语自然度，但避免使用过轻的惯用语而削弱约拿言辞的极端性。
