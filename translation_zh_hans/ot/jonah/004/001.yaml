  text: וַ/יֵּ֥רַע אֶל יוֹנָ֖ה רָעָ֣ה גְדוֹלָ֑ה וַ/יִּ֖חַר לֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/004/001.yaml
  text: But it was greatly displeasing to Jonah[a], and he became angry.
translation:
  language: zh_hans
  text: 但这事令约拿极其不悦[a]，他就发怒。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译近似“这在约拿看来是极大的恶”，重复使用“恶／坏”一词，形成文字呼应；这里表达约拿对这事的看法和感受。
    reason: 保留希伯来语的词语重复、文字呼应及主观评价所形成的神学张力。
lexical_decisions:
- source_word: וַיֵּרַע אֶל יוֹנָה רָעָה גְדוֹלָה
  choice: 这事令约拿极其不悦
  rationale: 希伯来语以同根或近义的“坏／恶”词语叠加强调，直译近似“这在约拿看来是极大的恶”。这里描述的是约拿对上文事件的反应，并非叙述者认定上帝的作为是恶；“极其不悦”自然表达其主观感受，同时以脚注保留原文的措辞和文字呼应。
- source_word: יוֹנָה
  choice: 约拿
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: וַיִּחַר לוֹ
  choice: 他就发怒
  rationale: 这是表达发怒的希伯来语惯用语，字面近似“向他烧起来”。“发怒”清楚自然；“就”体现叙事中的承接关系。
- source_word: וַ
  choice: 但……就
  rationale: 句首连接词结合上文构成鲜明转折：尼尼微人蒙怜悯，约拿却不悦。第二个连接词用“就”自然承接他的情绪反应。
theological_decisions:
- issue: רָעָה是否应译成对上帝作为的客观道德判断
  choice: 按约拿的主观反应译为“极其不悦”
  alternative: “约拿以此为大恶”或“这在约拿看来是极大的恶”
  rationale: 上下文是在叙述约拿对上帝怜悯尼尼微的反应，并不表示叙述者赞同他对这事的评价。正文避免把上帝的作为直接定性为恶，脚注则保留原文有意使用的“恶／坏”措辞及其张力。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。“这事”明确承接上文上帝不降所说的灾祸；“极其不悦”适合普通读者，又避免生硬直译。脚注标记已在正文中以[a]出现。
