base_translation:
  language: en
  yaml_path: translation/ot/jonah/004/008.yaml
  text: When the sun rose[a], God appointed a scorching east wind, and the sun beat down on Jonah’s head so that he grew faint. And he asked that he might die, and said[b], “My death is better than my life.”
translation:
  language: zh_hans
  text: 太阳升起时，上帝安排了一股灼热的东风[a]。太阳直晒在约拿头上，他便昏眩了。他便求死，说：“我死了比活着好。”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“一股闷热的东风”“一股猛烈的东风”。这里的希伯来语形容词罕见，含义难定；正文按上下文译作“灼热”。
    reason: lexical_alternative
  - marker: b
    text: 直译：“我的死比我的生命好。”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּזְרֹחַ הַשֶּׁמֶשׁ
  choice: 太阳升起时
  rationale: 以自然的现代汉语表达叙事公式与时间关系，不额外强化“开始升起”等原文未必要求的阶段意义。
- source_word: וַיְמַן
  choice: 安排了
  rationale: 该动词在《约拿书》中反复用于上帝有意调动受造之物；“安排”既保留主动统摄之意，也比“预备”更符合此处现代汉语语境。
- source_word: רוּחַ קָדִים חֲרִישִׁית
  choice: 一股灼热的东风
  rationale: “东风”直接对应 רוּחַ קָדִים；罕见形容词 חֲרִישִׁית 词义有争议，正文依炎热致人昏弱的语境译作“灼热”，并以脚注保留其他可能。
- source_word: וַתַּךְ הַשֶּׁמֶשׁ עַל רֹאשׁ יוֹנָה
  choice: 太阳直晒约拿的头
  rationale: 原文动词带有击打之意；“直晒……的头”是自然汉语，也传达烈日持续冲击头部的强烈感。
- source_word: וַיִּתְעַלָּף
  choice: 使他渐渐昏弱
  rationale: 表达变得衰弱、近乎昏厥的过程，避免断定他已经完全失去知觉。
- source_word: וַיִּשְׁאַל אֶת נַפְשׁוֹ לָמוּת
  choice: 他便求死
  rationale: 这是希伯来语中涉及 נֶפֶשׁ 的求死表达；简洁译为“求死”准确而自然，不把 נֶפֶשׁ 生硬译成“灵魂”。
- source_word: טוֹב מוֹתִי מֵחַיָּי
  choice: 我死了比活着好
  rationale: 正文用自然汉语保留死亡与生存之间简短而强烈的比较；脚注列出较贴近原文名词结构的直译。
theological_decisions:
- issue: וַיְמַן אֱלֹהִים 中上帝的行动主体性
  choice: 上帝安排了
  alternative: 上帝预备了／上帝使……来到
  rationale: 原文明确以上帝为主动者，调动自然之风服务于叙事；“安排”保留这种有意的行动，但不把经文扩展为更系统性的教义陈述。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“直晒”体现烈日击打的形象，“渐渐昏弱”避免把状态过度明确为完全昏厥。脚注标记均置于正文相关位置；[a] 紧随有词义争议的“东风”，[b] 说明末句的希伯来语名词式表达。
