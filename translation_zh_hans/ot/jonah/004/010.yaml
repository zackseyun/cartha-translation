source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יְהוָ֔ה אַתָּ֥ה חַ֨סְתָּ֙ עַל הַ/קִּ֣יקָי֔וֹן אֲשֶׁ֛ר לֹא עָמַ֥לְתָּ בּ֖/וֹ וְ/לֹ֣א גִדַּלְתּ֑/וֹ שֶׁ/בִּן לַ֥יְלָה הָיָ֖ה וּ/בִן לַ֥יְלָה אָבָֽד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/004/010.yaml
  text: Then Yahweh said[a], "You had compassion on the plant, for which you did not labor and which you did not make grow, which came up in a night and perished in a night."
translation:
  language: zh_hans
  text: 雅威说：“你怜惜这株植物[a]；你没有为它劳作，也没有使它长大；它一夜之间出现，又一夜之间消亡。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语为“qiqayon”；这种植物的确切种类无法确定。有译本译作“蓖麻”“葫芦”或“藤”。
    reason: 说明原文植物名称的词义不确定性，避免正文采用未经证实的物种认定。
lexical_decisions:
- source_word: יְהוָה
  choice: 雅威
  rationale: 以常见的中文音译呈现上帝的专名，而不以称号替代。
- source_word: חַסְתָּ
  choice: 怜惜
  rationale: 既表达因同情而爱惜、顾念的意思，也自然衔接下一节雅威对尼尼微的顾惜。
- source_word: הַקִּיקָיוֹן
  choice: 这棵植物
  rationale: 该植物的确切种类无法确定；用泛称避免武断地认定为蓖麻、葫芦或藤本植物。
- source_word: אֲשֶׁר לֹא עָמַלְתָּ בּוֹ
  choice: 并没有为它劳作
  rationale: 保留 עמל 所表达的劳作、付出辛劳之意，强调约拿没有为这植物付出劳动。
- source_word: וְלֹא גִדַּלְתּוֹ
  choice: 也没有使它长大
  rationale: 准确表达 גדל 的使役含义，即约拿并未促成或培育它生长。
- source_word: שֶׁבִּן לַיְלָה הָיָה וּבִן לַיְלָה אָבָד
  choice: 它一夜之间出现，又一夜之间消亡
  rationale: 以简洁、对称的现代汉语传达两次 בִּן־לַיְלָה 所强调的短暂无常，同时不把 הָיָה 过度具体化为“发芽”。
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: 汉语叙事中无需机械译出连接词；上下文已能清楚表达叙事推进。
theological_decisions:
- issue: 神圣名字的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文使用四字神名 יְהוָה；采用音译以保留其专名性质，不以“主”这一称号替代。
- issue: חוס 与下一节的呼应
  choice: 怜惜
  alternative: 可惜；同情；顾惜
  rationale: “怜惜”既保留约拿对植物的情感，又让本节与下一节雅威对尼尼微的反问形成词义上的平行，不预先消解两者之间的张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“一夜之间出现，又一夜之间消亡”保持原文两分句的对称和短促感；分号呈现雅威论证中从约拿未曾付出劳动到植物转瞬即逝的推进。
