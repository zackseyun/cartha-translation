  text: וַֽ/אֲנִי֙ לֹ֣א אָח֔וּס עַל נִינְוֵ֖ה הָ/עִ֣יר הַ/גְּדוֹלָ֑ה אֲשֶׁ֣ר יֶשׁ בָּ֡/הּ הַרְבֵּה֩ מִֽ/שְׁתֵּים עֶשְׂרֵ֨ה רִבּ֜וֹ אָדָ֗ם אֲשֶׁ֤ר לֹֽא יָדַע֙ בֵּין יְמִינ֣/וֹ לִ/שְׂמֹאל֔/וֹ וּ/בְהֵמָ֖ה רַבָּֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/004/011.yaml
  text: And should I not have compassion on Nineveh[a], the great city, in which there are more than one hundred twenty thousand people who do not know their right hand from their left[b], and many animals?
translation:
  language: zh_hans
  text: 我岂不该怜悯尼尼微[a]这座大城吗？其中有超过十二万人，分不清右手和左手[b]，还有许多牲畜。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “怜悯”也可译为“顾惜”或“饶惜”，可着重不加毁灭的意思。
    reason: lexical_alternative
  - marker: b
    text: “分不清右手和左手”可能特指年幼的孩子，也可能泛指缺乏辨别力的人。
    reason: alternative_reading
lexical_decisions:
- source_word: אָחוּס
  choice: 怜悯
  rationale: חוּס可表示怜惜、怜悯或顾惜而不毁灭。上下文将约拿对蓖麻的顾惜与上帝对尼尼微的关切相对照；“怜悯”自然地表达慈悲关切，同时保留不施毁灭的含义。
- source_word: הָעִיר הַגְּדוֹלָה
  choice: 这座大城
  rationale: “大城”保留גָּדוֹל的基本意义，也呼应《约拿书》中对尼尼微的反复称呼；“这座”使汉语指称自然。
- source_word: יֶשׁ בָּהּ
  choice: 其中有
  rationale: 以自然简洁的现代汉语表达“在其中存在”的结构，并将注意力保持在城内的人与牲畜上。
- source_word: הַרְבֵּה מִשְׁתֵּים עֶשְׂרֵה רִבּוֹ
  choice: 十二万多人
  rationale: 希伯来文直译为“多于十二个万”；“十二万多人”是清楚、自然的汉语数量表达，并保留“超过”的意思。
- source_word: אָדָם
  choice: 人（在“十二万多人”中）
  rationale: 这里指尼尼微城内被计数的人口；“人”准确自然，也不限定为男性。
- source_word: אֲשֶׁר לֹא יָדַע בֵּין יְמִינוֹ לִשְׂמֹאלוֹ
  choice: 分不清右手和左手
  rationale: 保留原文鲜明的身体方位说法，同时用现代汉语自然表达“不能辨别”；不在正文中断定这是幼童还是泛指缺乏辨别力的人。
- source_word: וּבְהֵמָה רַבָּה
  choice: 还有许多牲畜
  rationale: בְּהֵמָה通常指走兽，语境中很可能侧重家畜。“牲畜”比宽泛的“动物”更贴近常见词义，同时不缩窄为牛。
theological_decisions:
- issue: “分不清右手和左手”的所指
  choice: 正文保留这一表达，不明确限定所指人群
  alternative: 特指幼童；或泛指缺乏道德、属灵或一般辨别力的居民
  rationale: 原文允许不止一种理解。译文保留其具体意象与解释空间，脚注说明主要可能性，避免替文本消除真实的含混。
- issue: אָחוּס所表达的上帝态度
  choice: 译为“怜悯”
  alternative: 译为“顾惜”或“不饶惜/不放过”的正面形式“饶惜”
  rationale: 本章以约拿对蓖麻的顾惜衬托上帝对尼尼微的慈悲关切。“怜悯”凸显此处的慈悲维度；脚注保留“顾惜”的合法译法，因为该词也可着重于不加毁灭。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“我岂不该……吗”保留原文反问的力度；“这座大城”维持全书的文学呼应。所有脚注标记均置于正文相关词句之后。
