  text: וַ/יֹּ֣אמֶר יְהוָ֔ה הַ/הֵיטֵ֖ב חָ֥רָה לָֽ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/004/004.yaml
  text: And Yahweh said[a], “Is it right for you to be angry?”
translation:
  language: zh_hans
  text: 耶和华说：“你发怒合适吗？”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: 未单独译出连接词וַ；在中文叙事中直接用“说”自然承接上文，也保留了叙事推进。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的神名形式“耶和华”，将四字神名作为专名表达，而不是以“主”这一称号替代。
- source_word: הֲהֵיטֵב
  choice: 对吗
  rationale: 疑问词与יטב的使役式绝对不定词在这里构成惯用的评价性问句，询问约拿如此发怒是否正当；“对吗”简洁自然，并保留责问意味。
- source_word: חָרָה
  choice: 发怒
  rationale: 该词本义涉及燃烧、发热，在此为表达愤怒的惯用语，故按语义译作“发怒”。
- source_word: לָךְ
  choice: 你这样
  rationale: 介词ל与第二人称后缀标明所涉及的人；结合中文表达，以“你这样发怒”自然呈现“对你而言如此发怒”的含义，不将异常的阴性单数词形机械反映到译文中。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威；主
  rationale: “耶和华”是简体中文圣经语境中通行且易识别的专名形式；避免用称号“主”替代原文神名。
- issue: הֲהֵיטֵב חָרָה לָךְ问句的力度
  choice: 你这样发怒对吗？
  alternative: 你发怒有理吗？；你发怒是好的吗？
  rationale: 原文是对约拿发怒是否合宜、正当的评价性反问。“对吗”保留道德与合宜性层面的开放度，未进一步断定其愤怒完全无理。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。“你这样发怒对吗？”口吻直接，符合上帝对约拿的追问，也便于普通读者理解。
