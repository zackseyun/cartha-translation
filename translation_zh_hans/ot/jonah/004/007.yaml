  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יְמַ֤ן הָֽ/אֱלֹהִים֙ תּוֹלַ֔עַת בַּ/עֲל֥וֹת הַ/שַּׁ֖חַר לַֽ/מָּחֳרָ֑ת וַ/תַּ֥ךְ אֶת הַ/קִּֽיקָי֖וֹן וַ/יִּיבָֽשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/004/007.yaml
  text: But God appointed a worm at the rising of dawn the next day[a], and it struck the plant so that it withered.
translation:
  language: zh_hans
  text: 但第二天黎明时，神安排了一条虫子；虫子袭击了那棵植物[a]，植物就枯萎了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“蓖麻”。希伯来语 qiqayon 指一种植物，但其确切种类不明。
    reason: 原词的植物学所指不确定；脚注保留常见的具体译法，同时避免正文作过度确定的判断。
lexical_decisions:
- source_word: וַיְמַן
  choice: 安排
  rationale: 该动词表示神主动指定或调度某事物；“安排”既保留神有意施行的作为，也符合现代汉语表达，并与《约拿书》中神安排各种受造物的反复用法相呼应。
- source_word: הָאֱלֹהִים
  choice: 神
  rationale: 原文使用אֱלֹהִים，而非耶和华的专名，因此直译为“神”。
- source_word: תּוֹלַעַת
  choice: 一条虫子
  rationale: 该词泛指蠕虫一类的小生物，具体种类不明；“虫子”自然易懂，且不作无根据的物种限定。
- source_word: בַּעֲלוֹת הַשַּׁחַר לַמָּחֳרָת
  choice: 第二天黎明升起时
  rationale: 保留“黎明升起”的原文意象及“第二天”的时间顺序，同时形成自然的现代汉语。
- source_word: וַתַּךְ
  choice: 咬了
  rationale: 该动词本义为“击打、打击”；以虫子为施事、植物为受事时，“咬了”自然表达虫子对植物造成伤害，又不过度限定虫的具体种类。
- source_word: הַקִּיקָיוֹן
  choice: 那棵植物
  rationale: קִיקָיוֹן所指植物的确切种类无法确定；正文用“那棵植物”避免虚假的植物学精确性，并以脚注保留传统识别。
- source_word: וַיִּיבָשׁ
  choice: 植物就枯萎了
  rationale: 该动词意为“干枯、枯萎”。重复“植物”可清楚标明主语，避免汉语中误解为虫子枯萎。
theological_decisions:
- issue: 神在事件中的主动作为
  choice: 神“安排”虫子
  alternative: 神只是容许虫子出现
  rationale: וַיְמַן明确表达神主动指定或调度；这也符合本段中神接连安排植物、虫子和风的叙事模式，不应弱化为单纯许可。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“黎明升起时”保留希伯来语意象；分号清楚呈现神安排虫子及虫子使植物枯萎这两个连续动作。脚注标记置于其实际说明的“植物”之后。
