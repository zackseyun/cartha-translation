id: JON.4.3
reference: Jonah 4:3
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/עַתָּ֣ה יְהוָ֔ה קַח נָ֥א אֶת נַפְשִׁ֖/י מִמֶּ֑/נִּי כִּ֛י ט֥וֹב מוֹתִ֖/י מֵ/חַיָּֽ/י־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jonah/004/003.yaml
  text: And now[a], Yahweh, please take my life from me, for my dying is better than my living.
translation:
  language: zh_hans
  text: 现在，耶和华啊，求你取走我的性命，因为对我来说，死比活着更好。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַתָּה
  choice: 现在
  rationale: וְ在此承接前文并推进约拿的请求；现代汉语用“现在”即可自然表达这种承接和当下的紧迫感，不必生硬译出“和”。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 直接音译四字神名，采用现代中文圣经读者熟悉的形式，而不以“主”这一称号代替。
- source_word: קַח נָא
  choice: 求你取走
  rationale: קַח是命令式“取”，נָא使语气成为恳求；“求你取走”自然传达约拿急切的请求。
- source_word: אֶת נַפְשִׁי מִמֶּנִּי
  choice: 我的性命
  rationale: נֶפֶשׁ在这里指人的生命，而非与身体相对的抽象“灵魂”；“取走我的性命”也自然包含מִמֶּנִּי所表达的从约拿身上取去之意。
- source_word: כִּי
  choice: 因为
  rationale: 引出约拿请求上帝取走其性命的理由。
- source_word: טוֹב מוֹתִי מֵחַיָּי
  choice: 对我来说，死比活着更好
  rationale: טוֹב与比较介词מִן构成“比……更好”；汉语以“死比活着更好”清楚而自然地保留“死／活”的对照，第一人称后缀则由“对我来说”表达。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 主
  rationale: 原文直接使用以色列上帝的专名；译作“耶和华”保留专名性质，不以称号替换。
- issue: 约拿求死之言的表达
  choice: 按原文直陈“求你取走我的性命”
  alternative: 弱化为“让我离世”
  rationale: 原文是向耶和华提出直接而强烈的请求；译文不淡化约拿的绝望，也不添加对其请求的神学评价。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“耶和华啊”保留呼语语气；后半句避免不自然的“我的死比我的生命更好”，改用汉语惯用的“对我来说，死比活着更好”，同时保留原文的鲜明对照。
