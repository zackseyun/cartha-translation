base_translation:
  language: en
  yaml_path: translation/ot/jonah/004/005.yaml
  text: Then Jonah went out from the city and sat east of the city[b][a]. There he made himself a shelter and sat under it in the shade until he would see what would happen in the city.
translation:
  language: zh_hans
  text: 约拿出了城，坐在城东。他在那里为自己搭了一座棚[a]，坐在棚下的荫凉处，等着看城里将会发生什么[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“临时搭的棚子”。希伯来语指一种临时遮蔽物，通常用树枝搭成。
    reason: lexical_alternative
  - marker: b
    text: 或译“这城会有怎样的结局”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא יוֹנָה מִן־הָעִיר
  choice: 约拿出了城
  rationale: יצא与מן共同表达从城中出去；“出了城”简洁自然，并保留叙事动作。
- source_word: וַיֵּשֶׁב מִקֶּדֶם לָעִיר
  choice: 坐在城东
  rationale: ישב在此首先指坐下；מִקֶּדֶם לָעִיר表示位于城的东面，“坐在城东”准确而自然。
- source_word: וַיַּעַשׂ לוֹ שָׁם סֻכָּה
  choice: 他在那里为自己搭了一座棚
  rationale: לוֹ表示为自己受益；סֻכָּה指以树枝等搭成的临时遮蔽物。“搭了一座棚”既贴近具体形态，也符合现代汉语。
- source_word: וַיֵּשֶׁב תַּחְתֶּיהָ בַּצֵּל
  choice: 坐在棚下的荫凉处
  rationale: תַּחְתֶּיהָ回指阴性名词סֻכָּה；צֵל在此指躲避日晒的阴影、荫凉。“棚下的荫凉处”清楚表达其功能。
- source_word: עַד אֲשֶׁר יִרְאֶה
  choice: 等着看
  rationale: 该结构表达约拿停留在那里，以便观看后续结果；“等着看”自然传达持续等待和前瞻意味。
- source_word: מַה־יִּהְיֶה בָּעִיר
  choice: 城里将会发生什么
  rationale: 字面为“城中会有什么／会怎样”，在语境中询问事情的结果；本译保留地点焦点，并用现代汉语清楚表达。
