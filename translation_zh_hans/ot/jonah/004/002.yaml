  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יִּתְפַּלֵּ֨ל אֶל יְהוָ֜ה וַ/יֹּאמַ֗ר אָנָּ֤ה יְהוָה֙ הֲ/לוֹא זֶ֣ה דְבָרִ֗/י עַד הֱיוֹתִ/י֙ עַל אַדְמָתִ֔/י עַל כֵּ֥ן קִדַּ֖מְתִּי לִ/בְרֹ֣חַ תַּרְשִׁ֑ישָׁ/ה כִּ֣י יָדַ֗עְתִּי כִּ֤י אַתָּה֙ אֵֽל חַנּ֣וּן וְ/רַח֔וּם אֶ֤רֶךְ אַפַּ֨יִם֙ וְ/רַב חֶ֔סֶד וְ/נִחָ֖ם עַל הָ/רָעָֽה־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/004/002.yaml
  text: And he prayed to Yahweh and said[a], “Please, Yahweh, was this not what I said while I was still in my own land? That is why I acted first to flee to Tarshish, because I knew that you are a gracious and compassionate God, slow to anger and abundant in steadfast love[c][b], and relenting concerning the disaster.”
translation:
  language: zh_hans
  text: 他向雅威祷告说：“雅威啊，我在本国时所说的话，不就是这个吗？所以我抢先逃往他施，因为我知道你是施恩、有怜悯的上帝，不轻易发怒，有丰盛的信实之爱，并且会改变心意，不降灾祸。[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “会改变心意，不降灾祸”也可译作“会就那灾祸转意”。原文用“恶／灾祸”一词，在这里指所宣告的审判，并非说道德上的恶出于上帝。
    reason: 保留 נחם 的拟人化张力，并说明 רָעָה 在语境中的审判含义。
lexical_decisions:
- source_word: וַיִּתְפַּלֵּל
  choice: 祷告
  rationale: 该词在此指向上帝祷告；虽然约拿的话带有抱怨，仍不宜改译为“申诉”而削弱其基本含义。
- source_word: יְהוָה
  choice: 雅威
  rationale: 直接音译四字神名，保留其作为以色列之上帝专名的性质，而不以称号代替。
- source_word: אָנָּה
  choice: 啊
  rationale: 这是表达恳求或强烈感叹的语气词；此处约拿是在激动地向雅威陈说，“啊”较自然，也不把语气限定为礼貌请求。
- source_word: הֲלוֹא זֶה דְבָרִי
  choice: 不就是这样说的吗
  rationale: 保留期待肯定回答的反问语气；“这样说”自然表达字面的“这是我的话”。
- source_word: עַד הֱיוֹתִי עַל אַדְמָתִי
  choice: 我还在本国的时候
  rationale: 表达约拿离开故土以前仍身在自己土地上的时间背景；“本国”在现代汉语中简洁自然。
- source_word: קִדַּמְתִּי לִבְרֹחַ
  choice: 才抢先逃往
  rationale: קדם 在这里含预先采取行动、抢在事情发生前行动之意；“抢先逃往”既保留预先性，也比“先行采取逃跑行动”自然。
- source_word: חַנּוּן וְרַחוּם
  choice: 有恩典、有怜悯
  rationale: 分别传达乐意施恩与深怀怜悯的属性，并保留两个并列形容词的结构。
- source_word: אֶרֶךְ אַפַּיִם
  choice: 不轻易发怒
  rationale: 这是该希伯来习语在现代汉语中的自然对应，表达忍耐和克制怒气。
- source_word: רַב חֶסֶד
  choice: 有丰盛的信实之爱
  rationale: חֶסֶד 包含坚定、忠诚而施予的爱；“信实之爱”保留其关系性与持久性，避免只译作一般的“慈爱”。
- source_word: וְנִחָם עַל הָרָעָה
  choice: 会为所降的灾祸回心转意
  rationale: 保留 נחם 所呈现的转意张力；רָעָה 在本语境中指所宣告的灾祸或审判，并非上帝所行的道德恶。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文使用上帝的专名，故以现代汉语音译“雅威”保留专名性质。
- issue: וְנִחָם 所表达的上帝转意
  choice: 回心转意
  alternative: 不降灾祸；后悔降灾
  rationale: “回心转意”保留原文拟人化表达及其神学张力，又不暗示上帝犯了道德错误；“不降灾祸”则会过早化解原文的张力。
- issue: הָרָעָה 的语义
  choice: 所降的灾祸
  alternative: 恶；灾难
  rationale: 在尼尼微受审判的上下文中，该词指上帝所宣告要降的灾祸，而不是上帝自身的邪恶行为。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“雅威啊”自然传达感叹语气；“抢先逃往”凸显约拿预先行动的意思。“有恩典、有怜悯……有丰盛的信实之爱”有意保留希伯来文信条式的并列节奏。唯一脚注标记[a]已置于对应主句之后。
