  to: 他向雅威祷告说：“雅威啊，我在本国时所说的话，不就是这个吗？所以我抢先逃往他施，因为我知道你是施恩、有怜悯的上帝，不轻易发怒，有丰盛的信实之爱，并且会改变心意，不降灾祸。[a]”
  rationale: 修正末句对“灾祸”状态及介词关系的误导性表达，以准确反映上帝就所宣告灾祸转意的含义；同时微调前段措辞，使其更贴近希伯来文的“我的话”及预先逃离的因果关系。
