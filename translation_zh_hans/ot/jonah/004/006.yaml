- from: 雅威上帝安排了一株基加永植物[a]，让它长到约拿上方，遮住他的头，好救他脱离困苦。约拿因这株基加永植物而大大欢喜。
  to: 雅威上帝安排了一株基加永植物[a]，使它长到约拿上方，在他头上遮荫，好救他脱离困苦。约拿因这株基加永植物而大大欢喜。
  rationale: 修订仅澄清植物所提供的是“荫”而非单纯覆盖头部，并收紧脚注，使其准确保留原词植物鉴定的不确定性且与审校记录一致；其余译文保留原有的忠实和自然表达。
