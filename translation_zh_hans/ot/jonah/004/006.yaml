base_translation:
  language: en
  yaml_path: translation/ot/jonah/004/006.yaml
  text: And Yahweh God appointed a qiqayon plant[a], and it grew up over Jonah to be a shade over his head, to deliver him from his discomfort. And Jonah rejoiced over the qiqayon plant with great joy.
translation:
  language: zh_hans
  text: 雅威上帝安排了一株基加永植物[a]，使它长到约拿上方，在他头上遮荫，好救他脱离困苦。约拿因这株基加永植物而大大欢喜。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文为“基加永”（qiqayon），究竟是哪一种植物不能确定；传统上译作“藤”，也有人认为是蓖麻。
    reason: 原词所指植物的品种存在词汇与植物学上的不确定性。
lexical_decisions:
- source_word: וַיְמַן
  choice: 安排了
  rationale: מנה在《约拿书》中反复表示上帝特意指派或安排鱼、植物、虫和东风；“安排”自然地保留了这种有意的行动。
- source_word: יְהוָה אֱלֹהִים
  choice: 雅威上帝
  rationale: 将四字神名按其专名音译为“雅威”，并保留与אֱלֹהִים并列的形式。
- source_word: קִיקָיוֹן
  choice: 基加永植物
  rationale: 这种植物的确切种类不能确定；音译“基加永”并补上“植物”，既保留原文特指，又不武断认定其品种。
- source_word: וַיַּעַל מֵעַל לְיוֹנָה
  choice: 让它长到约拿上方
  rationale: עלה用于植物可自然译为“长”；“上方”表达植物生长后覆盖约拿的位置，也与下文遮荫相接。
- source_word: לִהְיוֹת צֵל עַל רֹאשׁוֹ
  choice: 遮住他的头
  rationale: 原文直指成为他头上的荫影；此译在现代汉语中简洁自然，并保留实际遮荫的功能。
- source_word: לְהַצִּיל לוֹ מֵרָעָתוֹ
  choice: 好救他脱离困苦
  rationale: רָעָה可指祸患、苦楚或困境；“困苦”不把意义限定为单纯身体不适，也避免在这里误读为约拿本人的道德邪恶。
- source_word: וַיִּשְׂמַח ... שִׂמְחָה גְדוֹלָה
  choice: 大大欢喜
  rationale: 原文以同根词结构加强语气；“大大欢喜”用自然庄重的汉语传达强烈喜悦。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文使用四字神名；“雅威”按较通行的学术重构发音音译，保留其作为专名的性质，而不以称号替代。
- issue: מֵרָעָתוֹ所指的苦难
  choice: 困苦
  alternative: 不适；祸患；苦楚
  rationale: 植物所提供的荫凉表明此处包括约拿当下的身体苦楚，但该词本身范围较宽；“困苦”保留这种张力，不将含义缩窄为轻微不适。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“安排”与本章上帝先后支配植物、虫和风的叙事用语保持一致；对植物名称采用音译加类称，正文不作未经证实的品种判定。
