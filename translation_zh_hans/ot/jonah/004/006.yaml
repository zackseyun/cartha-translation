  naturalness: “雅威上帝”“基加永植物”“大大欢喜”均合乎庄重、现代的圣经汉语。“使它长到约拿上方，在他头上遮荫”比“让它长到约拿上方，遮住他的头”更准确自然。
  terminology: “雅威”一致呈现יהוה；“基加永植物”恰当保留植物名称的不确定性；“困苦”可涵盖רָעָה在此处的患难、苦楚，不误作道德上的邪恶。脚注宜避免将“葫芦”列为原词的传统对应，以免扩大英文审校记录所说明的传统“藤”与“蓖麻”学术辨认。
