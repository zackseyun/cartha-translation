  text: מִֽי יוֹדֵ֣עַ יָשׁ֔וּב וְ/נִחַ֖ם הָ/אֱלֹהִ֑ים וְ/שָׁ֛ב מֵ/חֲר֥וֹן אַפּ֖/וֹ וְ/לֹ֥א נֹאבֵֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/003/009.yaml
  text: Who knows? God may turn and relent[a], and turn from the burning of his anger[b], so that we do not perish.
translation:
  language: zh_hans
  text: 谁知道呢？上帝也许会回转，改变心意[a]，转离他的烈怒[b]，使我们不至灭亡。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “改变心意”也可译作“回心转意”或“后悔”；这里是指上帝不施行已经宣告的审判。
    reason: alternative_reading
  - marker: b
    text: “烈怒”原文带有怒气如火燃烧的意象，也可译作“怒火”。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי יוֹדֵעַ
  choice: 谁知道呢？
  rationale: 保留原文表示不确定而又怀有盼望的反问语气，比直接译成“也许”更有修辞力量。
- source_word: יָשׁוּב
  choice: 也许会回转
  rationale: 在“谁知道呢”之后，未完成式表达可能性而非确定性；“回转”保留שׁוב的基本意象。
- source_word: וְנִחַם
  choice: 改变心意
  rationale: נחם在此描写上帝可能不施行所宣告的审判；“改变心意”保留原文对上帝回应人悔改的真实表述，不以系统神学解释消除其中的张力。
- source_word: הָאֱלֹהִים
  choice: 上帝
  rationale: 定冠词形式的אֱלֹהִים在此指尼尼微人所求告的上帝；采用现代汉语通行称谓。
- source_word: וְשָׁב
  choice: 转离
  rationale: 这是本节第二次使用שׁוב；“转离”既与前面的“回转”形成呼应，也自然连接“烈怒”。
- source_word: מֵחֲרוֹן אַפּוֹ
  choice: 他的烈怒
  rationale: חֲרוֹן אַף是表示强烈愤怒的惯用语；正文采用自然的“烈怒”，脚注说明其“燃烧”意象。
- source_word: וְלֹא נֹאבֵד
  choice: 使我们不至灭亡
  rationale: 明确表达他们所盼望的结果，同时保留第一人称复数及“灭亡”的语义。
theological_decisions:
- issue: 如何翻译上帝的נחם
  choice: 改变心意
  alternative: 回心转意；后悔；不降灾
  rationale: 原文确实描写人所盼望的上帝态度转变。“改变心意”较直接地保留这种神圣回应性及其神学张力；脚注交代其他可能译法，并仅按上下文说明其结果，不把经文改写成某种预设的神学结论。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“谁知道呢”保留反问和盼望；“回转……转离”尽量再现原文两次使用שׁוב的重复，同时避免过度生硬。所有脚注标记均已置于正文相应词语之后。
