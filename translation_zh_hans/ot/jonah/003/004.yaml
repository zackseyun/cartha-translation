  text: וַ/יָּ֤חֶל יוֹנָה֙ לָ/ב֣וֹא בָ/עִ֔יר מַהֲלַ֖ךְ י֣וֹם אֶחָ֑ד וַ/יִּקְרָא֙ וַ/יֹּאמַ֔ר ע֚וֹד אַרְבָּעִ֣ים י֔וֹם וְ/נִֽינְוֵ֖ה נֶהְפָּֽכֶת׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/003/004.yaml
  text: Jonah began to go into the city a day's journey[a], and he cried out and said, “Yet forty days[b], and Nineveh will be overturned.”
translation:
  language: zh_hans
  text: 约拿开始进城，走了一天的路程[a]，就高声宣告说：“再过四十天[b]，尼尼微必被倾覆[c]！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译可作“一天的行程”，可指一天步行所走的距离或范围。
    reason: idiom_clarification
  - marker: b
    text: 或译“四十天以后”。原文的表达强调在所剩的四十天之后，所宣告的事便会发生。
    reason: lexical_alternative
  - marker: c
    text: 或译“被推翻”。原文动词也可表示“被翻转”，既能指审判中的倾覆，也保留更广泛的反转意味。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּחֶל
  choice: 开始
  rationale: 此处使役式与不定式连用，惯常表示开始某一行动；译作“开始”自然且贴近原文。
- source_word: לָבוֹא בָעִיר
  choice: 进城
  rationale: בוא与介词ב连用，表示进入城中；“进城”简洁自然，并保留方向性。
- source_word: מַהֲלַךְ יוֹם אֶחָד
  choice: 走了一天的路程
  rationale: 该短语指一天行程所涵盖的距离或范围；这样表达符合现代汉语，也保留空间意义。
- source_word: וַיִּקְרָא וַיֹּאמַר
  choice: 高声宣告说
  rationale: קרא在此指公开呼喊、宣告；保留“说”可反映原文两个连续动词的引语铺垫，而“高声宣告”传达公开而有力的呼喊。
- source_word: עוֹד אַרְבָּעִים יוֹם
  choice: 再过四十天
  rationale: עוֹד在此标示所剩时间和倒计时；“再过四十天”比单纯“四十天以后”更能传达这一语气。
- source_word: נֶהְפָּכֶת
  choice: 必被倾覆
  rationale: הפך的受动形式可指翻转、倾覆或毁灭。“倾覆”适合针对城的审判宣告，同时比“毁灭”保留更宽的词义范围；“必”在汉语中自然表达此处预告的将来结果。
theological_decisions:
- issue: נֶהְפָּכֶת在约拿警告中的语义张力
  choice: 必被倾覆
  alternative: 必被毁灭；必被翻转
  rationale: 原词可以表示灾难性的倾覆，也可带有更广泛的翻转、转变之意。正文采用“倾覆”，既传达审判威胁，又不把含义缩窄为彻底毁灭；脚注说明其较宽的语义，以保留叙事中的反转张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“高声宣告说”保留先知公开呼喊及随后引语的原文结构；“倾覆”避免把原文可容纳的审判与反转意味单一化。所有脚注标记均置于正文相应词语之后。
