  source_fidelity: 译文整体准确传达了消息传至尼尼微的王、王离开宝座、脱去外袍、以麻布遮身并坐于灰中的连续动作。惟“用麻布裹身”较容易使人理解为用布缠裹身体；原文此处是穿上／披覆粗麻布的哀恸举动，译作“披上麻布”更贴切、也更合乎汉语圣经叙事惯例。
  naturalness: “尼尼微王”“从宝座上起来”“脱下外袍”均庄重自然。“披上麻布”比“用麻布裹身”更简洁自然；“坐在灰烬中”也比孤立的“灰中”更清楚顺畅，同时保留哀恸意象。
  terminology: “尼尼微王”“宝座”“外袍”处理恰当，未将外袍不当限定为王袍。“麻布”是译述 שַׂק 的常用术语；改用“披上”能更准确呈现其作为哀恸服饰的功能。脚注 a 中“传闻”带有未经证实的语义，较不适合此处已传到王前的宣告；以“报告”保留 דבר 的另一语义范围更中性。
