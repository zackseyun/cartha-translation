- from: 这消息传到尼尼微王那里[a]，他就从宝座上起来，脱下外袍[b]，用麻布裹身，坐在灰中[c]。
  to: 这消息传到尼尼微王那里[a]，他就从宝座上起来，脱下外袍[b]，披上麻布，坐在灰烬中[c]。
  rationale: 修订仅调整麻布动作和相关词义脚注：“披上麻布”既保留“遮盖”的语义，也避免“裹身”所暗示的缠裹动作；“灰烬中”使意象在现代汉语中更明晰。其余措辞、叙事次序、王者称谓和脚注锚点均予保留。
