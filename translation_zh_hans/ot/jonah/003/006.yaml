  text: וַ/יִּגַּ֤ע הַ/דָּבָר֙ אֶל מֶ֣לֶך נִֽינְוֵ֔ה וַ/יָּ֨קָם֙ מִ/כִּסְא֔/וֹ וַ/יַּעֲבֵ֥ר אַדַּרְתּ֖/וֹ מֵֽ/עָלָ֑י/ו וַ/יְכַ֣ס שַׂ֔ק וַ/יֵּ֖שֶׁב עַל הָ/אֵֽפֶר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/003/006.yaml
  text: When the message reached the king of Nineveh[a], he rose from his throne, removed his robe, covered himself with sackcloth[c][b], and sat in the ashes.
translation:
  language: zh_hans
  text: 这消息传到尼尼微王那里[a]，他就从宝座上起来，脱下外袍[b]，披上麻布，坐在灰烬中[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “消息”也可译作“事情”或“报告”。
    reason: lexical_alternative
  - marker: b
    text: “外袍”所译的希伯来语可指披在外面的袍服，有时是显贵者所穿的华贵衣袍。
    reason: lexical_alternative
  - marker: c
    text: 直译：“坐在灰上。”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגַּע הַדָּבָר
  choice: 这消息传到
  rationale: נגע在此与אֶל连用，表示某事传到某人那里；דבר可指“话、事情、消息”。上下文所指是约拿宣告的内容，因此译为“消息”最自然，同时在脚注保留“事情、传闻”等可能。
- source_word: מֶלֶךְ נִינְוֵה
  choice: 尼尼微王
  rationale: 这是清楚的构属结构；“尼尼微王”符合现代汉语表达，也不额外判断其政治头衔的具体性质。
- source_word: וַיָּקָם מִכִּסְאוֹ
  choice: 他就从宝座上起来
  rationale: כִּסֵּא可指座位或宝座；主语既是王，译作“宝座”准确体现王者身份及其起身的场景。
- source_word: וַיַּעֲבֵר אַדַּרְתּוֹ מֵעָלָיו
  choice: 脱下外袍
  rationale: עבר的使役形在这里表示使衣物从身上离开，即脱下；אַדֶּרֶת指披在外面的袍服，也可带有华贵、显赫意味。“外袍”既自然又避免把原文未明确说明的性质直接译成“王袍”。
- source_word: וַיְכַס שַׂק
  choice: 用麻布裹身
  rationale: כסה本义是遮盖，原文宾语为麻布；汉语“用麻布裹身”保留遮盖身体的动作，也清楚呈现哀恸与自卑的外在举动。
- source_word: וַיֵּשֶׁב עַל הָאֵפֶר
  choice: 坐在灰中
  rationale: 介词עַל直译为“在……上”，但这一哀恸场景用现代汉语说“坐在灰中”更自然；脚注保留原文较直译的表达。
theological_decisions:
- issue: 王自卑及悔改的象征动作
  choice: 只叙述他起身、脱袍、裹麻布和坐在灰中的具体行动
  alternative: 在正文中直接增译为“他悔改自卑”
  rationale: 这些动作在上下文中具有哀恸、自卑和悔改的含义，但本节本身以叙事方式呈现行动，并未直接作神学解释；译文应让意象自行表达，不把推论增入正文。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“尼尼微王”“宝座”“麻布”等词保留叙事的古代背景；句式简洁，连续动作以逗号衔接。脚注标记均置于正文对应词语之后。
