source:
  edition: WLC
  text: וַ/יְהִ֧י דְבַר יְהוָ֛ה אֶל יוֹנָ֖ה שֵׁנִ֥ית לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/003/001.yaml
  text: Then the word of Yahweh came to Jonah a second time[a], saying,
translation:
  language: zh_hans
  text: 耶和华的话第二次[a]临到约拿，说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“再次”。原文明确表示这是约拿先前受命之后的重复行动。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: 临到
  rationale: 此处与后面的“耶和华的话”共同构成先知叙事中的惯用表达；中文用“临到”既自然，也保留神的话主动传达给先知的意味。句首不另译“于是”，以免行文累赘。
- source_word: דְבַר יְהוָה
  choice: 耶和华的话
  rationale: 保留先知书常见公式及“话”的经典共鸣，不将其解释性地改译为“信息”。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者最熟悉的神名音译“耶和华”，将其作为专名而非称号处理。
- source_word: אֶל
  choice: 临到
  rationale: 希伯来语介词标示神言所达到的对象；在现代中文先知书语体中，与“临到约拿”合译最自然。
- source_word: יוֹנָה
  choice: 约拿
  rationale: 采用该人名通行的现代中文圣经译名。
- source_word: שֵׁנִית
  choice: 第二次
  rationale: 明确保留原文所强调的重复行动，并与约拿先前所受的差遣相呼应。
- source_word: לֵאמֹר
  choice: 说：
  rationale: 引出下一节神言的具体内容；中文以“说：”简洁自然。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用四字神名，应译作专名而非“主”这一称号。“耶和华”是现代简体中文圣经传统中最广为识别的形式；“雅威”更贴近学术界常见的拟音，但尚未成为普通中文读者最自然的通行形式。
- issue: שֵׁנִית 所表达的再次差遣
  choice: 第二次
  alternative: 再次
  rationale: “第二次”直接保留序数含义，突显这是约拿先前受命之后的再度委任，而不进一步解释神为何重新差遣他。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准普通话。“耶和华的话临到……”保留先知书公式化表达；冒号清楚引出下一节的直接话语。
