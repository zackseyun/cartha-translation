id: JON.3.10
reference: Jonah 3:10
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יַּ֤רְא הָֽ/אֱלֹהִים֙ אֶֽת מַ֣עֲשֵׂי/הֶ֔ם כִּי שָׁ֖בוּ מִ/דַּרְכָּ֣/ם הָ/רָעָ֑ה וַ/יִּנָּ֣חֶם הָ/אֱלֹהִ֗ים עַל הָ/רָעָ֛ה אֲשֶׁר דִּבֶּ֥ר לַ/עֲשׂוֹת לָ/הֶ֖ם וְ/לֹ֥א עָשָֽׂה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/003/010.yaml
  text: When God saw their deeds[a], that they had turned from their evil way, God relented concerning the disaster that he had spoken to bring on them[b], and he did not do it.
translation:
  language: zh_hans
  text: 上帝看见他们所做的事，见他们离开了恶道；上帝就转意，不把他所说要降给他们的灾祸降下[a]；他没有这样做。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “恶道”和“灾祸”在希伯来原文中使用同一个词；前者指道德上的恶，后者指将临的灾难或审判。“转意”也可译作“改变心意”，指上帝因尼尼微人的回转而不实行所宣告的灾祸，并不表示上帝有道德过失。
    reason: 说明同一词的语境差异，并保留有关上帝回应的原文张力。
lexical_decisions:
- source_word: וַיַּרְא
  choice: 看见
  rationale: 采用叙事中最直接的常用义，保留原文简洁的表达。
- source_word: מַעֲשֵׂיהֶם
  choice: 他们的行为
  rationale: 既指他们实际所做的事，也保留其道德分量；现代汉语自然明白。
- source_word: כִּי שָׁבוּ
  choice: 知道他们已经离开
  rationale: כִּי在这里说明上帝从他们行为中所看见的内容；שׁוּב表示转回、离开原来的道路。中文补出“知道”使句法自然，却不把“看见”削弱为纯粹认知。
- source_word: מִדַּרְכָּם הָרָעָה
  choice: 离开恶道
  rationale: 保留单数“道路”的道德隐喻，并将רָעָה按此处的伦理意义译为“恶”。
- source_word: וַיִּנָּחֶם
  choice: 转意
  rationale: 表达上帝对尼尼微人回转所作的真实回应，以及不再执行所宣告灾祸的叙事张力；不暗示上帝犯错或有道德过失。
- source_word: עַל הָרָעָה
  choice: 不把……灾祸降下
  rationale: 第二个רָעָה在语境中指将临的灾难或审判，并非道德邪恶；中文将动词与其内容合并表达更自然。
- source_word: אֲשֶׁר דִּבֶּר לַעֲשׂוֹת לָהֶם
  choice: 先前所说要降给他们的
  rationale: “降给他们”自然表达灾祸临到他们，同时保留这是上帝先前宣告之事。
- source_word: וְלֹא עָשָׂה
  choice: 他没有这样做
  rationale: 保留原文末句的简短直接，以“这样”承接前述要降下的灾祸。
- source_word: הָאֱלֹהִים
  choice: 上帝
  rationale: 现代标准汉语中对以色列之神庄重而通行的称呼。
theological_decisions:
- issue: וַיִּנָּחֶם所表达的上帝回应
  choice: 译作“上帝……就转意”
  alternative: “上帝后悔了”或“上帝改变了主意”
  rationale: “转意”保留上帝因尼尼微人的回转而不实行已宣告审判的真实变化，同时不额外暗示上帝犯错、犯罪或获得了新信息。
- issue: רָעָה在本节两处的不同语境义
  choice: 第一处译为道德意义的“恶”，第二处译为“灾祸”
  alternative: 两处都译为“恶”
  rationale: 同一希伯来词在相邻语境中分别指人的道德邪恶和上帝所宣告的灾难性审判。区别翻译可避免误解，同时以脚注说明原文的词语呼应。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“恶道”保留圣经常见的道路隐喻；“转意”比“后悔”更少产生道德过失的误解，又不消除原文所陈述的回应与行动变化。脚注标记[a]置于相关分句之后。
