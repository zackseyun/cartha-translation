base_translation:
  language: en
  yaml_path: translation/ot/jonah/003/005.yaml
  text: And the people of Nineveh believed God[a], and they proclaimed a fast and put on sackcloth, from their greatest to their least.
translation:
  language: zh_hans
  text: 尼尼微人相信上帝[a]，便宣告禁食，从最大的到最小的都穿上麻衣。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“信靠上帝”。希伯来语的这种表达既可指相信上帝所说的话，也可指信靠上帝。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּאֲמִינוּ
  choice: 信了
  rationale: אמן 的使役形与介词 ב 连用，可表达相信某人所说的话，也可表达信靠某人。“信了”自然简洁，并保留这两方面可能重叠的含义。
- source_word: אַנְשֵׁי נִינְוֵה
  choice: 尼尼微人
  rationale: 该词组字面为“尼尼微的男子／人”，在这里整体指城中居民；“尼尼微人”既自然，也不把经文所涵盖的群体限于成年男性。
- source_word: בֵּאלֹהִים
  choice: 上帝
  rationale: אמן + ב 可理解为“相信上帝”或“信靠上帝”。正文采用现代汉语自然的“信了上帝”，脚注说明另一层可能含义。
- source_word: וַיִּקְרְאוּ צוֹם
  choice: 宣告禁食
  rationale: קרא 与 צום 搭配，指公开宣布共同禁食；“宣告禁食”准确体现这项公共行动。
- source_word: וַיִּלְבְּשׁוּ שַׂקִּים
  choice: 穿上麻衣
  rationale: שַׂקִּים 指粗麻布衣服，在此是谦卑哀痛的外在表示；“穿上麻衣”符合中文圣经语域，也清楚易懂。
- source_word: מִגְּדוֹלָם וְעַד קְטַנָּם
  choice: 从最大的到最小的，人人都这样做
  rationale: 这是表示全体的两极表达，可能涉及身份、地位或年龄。“最大的到最小的”保留原文措辞，“人人都这样做”使其对前述禁食和穿麻衣的涵盖关系在中文中清楚自然。
theological_decisions:
- issue: 尼尼微人回应上帝的性质
  choice: 译作“信了上帝”，不扩展为悔改、归信或得救之信。
  alternative: 译作“悔改归向上帝”或明确译成完整的信仰归依。
  rationale: 本节明确记载相信、禁食和穿麻衣；上下文虽显示悔改行动，译文仍不应把本节没有明说的神学结论加入正文。
- issue: אמן + ב 的语义张力
  choice: 正文采用“信了上帝”，脚注保留“信靠上帝”的可能。
  alternative: 只译作“信靠上帝”。
  rationale: 该结构既可表示相信上帝的话，也可带有信靠上帝之意；正文与脚注共同保留原文真实的语义幅度。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“麻衣”保留常见圣经文化用语；分号使末尾的全体性表达清晰地概括前述行动。
