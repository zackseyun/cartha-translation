  text: וְ/יִתְכַּסּ֣וּ שַׂקִּ֗ים הָֽ/אָדָם֙ וְ/הַ/בְּהֵמָ֔ה וְ/יִקְרְא֥וּ אֶל אֱלֹהִ֖ים בְּ/חָזְקָ֑ה וְ/יָשֻׁ֗בוּ אִ֚ישׁ מִ/דַּרְכּ֣/וֹ הָֽ/רָעָ֔ה וּ/מִן הֶ/חָמָ֖ס אֲשֶׁ֥ר בְּ/כַפֵּי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/003/008.yaml
  text: Let both man and beast be covered with sackcloth[a], and let them call out mightily to God[c][b], and let each man turn from his evil way and from the violence that is in their hands.
translation:
  language: zh_hans
  text: 人和牲畜都要披上麻布；都要竭力向上帝呼求[a]。各人要回转，离开自己的恶道[b]，离开他们手中的强暴。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“大声向上帝呼求”。
    reason: בְּחָזְקָה可侧重呼求的力度或迫切程度。
  - marker: b
    text: “恶道”指邪恶的行为和生活方式。
    reason: 说明希伯来语“道路”的伦理性比喻，同时保留正文意象。
lexical_decisions:
- source_word: וְיִתְכַּסּוּ שַׂקִּים
  choice: 披上麻布
  rationale: Hitpael在此可作反身或中间态理解；“披上麻布”自然表达哀悼、悔改的举动，也保留命令语气。
- source_word: הָאָדָם וְהַבְּהֵמָה
  choice: 无论人还是牲畜
  rationale: 清楚保留人类与家畜的对举；בְּהֵמָה在此主要指牲畜。
- source_word: וְיִקְרְאוּ אֶל אֱלֹהִים בְּחָזְקָה
  choice: 竭力向上帝呼求
  rationale: בְּחָזְקָה表示强烈、有力；“竭力……呼求”在现代汉语中自然，并传达恳切迫切之意。
- source_word: וְיָשֻׁבוּ
  choice: 要回转
  rationale: 保留שׁוב的转回意象；上下文表明这是离弃恶行，而不以较窄的神学术语替代原文。
- source_word: אִישׁ
  choice: 各人
  rationale: 表达分配性的单数，即群体中的每一个人；现代汉语无需复制希伯来语的语法性别。
- source_word: מִדַּרְכּוֹ הָרָעָה
  choice: 离开自己的恶道
  rationale: “道”保留希伯来语以道路喻行为与生活方式的意象；“恶”直接对应רָעָה。
- source_word: וּמִן הֶחָמָס אֲשֶׁר בְּכַפֵּיהֶם
  choice: 离开他们手中的强暴
  rationale: “强暴”直接表达חָמָס所指的暴力恶行；“手中”保留原文意象，复数“他们”对应כַּפֵּיהֶם。
theological_decisions:
- issue: שׁוב的悔改含义
  choice: 译作“回转”
  alternative: 悔改；归回
  rationale: 经文确实要求道德上的转变，但原动词的基本意象是转回；如此既传达语境，也不把更专门的神学术语直接置入正文。
- issue: 人和牲畜是否同为呼求上帝的主语
  choice: 保留复数主语可自然涵盖前述“人和牲畜”的句法
  alternative: 明确限定只有人向上帝呼求
  rationale: 希伯来语连续使用复数动词，形式上承接“人和牲畜”；虽牲畜如何呼求具有语义张力，译文不擅自消解。
- issue: אִישׁ与后接复数כַּפֵּיהֶם的数不一致
  choice: 译作“各人……自己的恶道……他们手中的强暴”
  alternative: 各人……自己手中的强暴
  rationale: 原文先用分配性单数“各人/他的”，随后转为群体复数“他们的手”；译文保留这一变化，而不强行统一。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“麻布”“恶道”“强暴”保留经文的文化与伦理意象；句式按诏令语气处理。
