  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: ק֛וּם לֵ֥ךְ אֶל נִֽינְוֵ֖ה הָ/עִ֣יר הַ/גְּדוֹלָ֑ה וִּ/קְרָ֤א אֵלֶ֨י/הָ֙ אֶת הַ/קְּרִיאָ֔ה אֲשֶׁ֥ר אָנֹכִ֖י דֹּבֵ֥ר אֵלֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/003/002.yaml
  text: Arise[a], go to Nineveh, the great city, and proclaim to it the proclamation that I speak to you.
translation:
  language: zh_hans
  text: 起来，到大城尼尼微去，向尼尼微宣告[a]我对你说的信息。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“向它呼喊”。1:2用的介词可表示“攻击、针对”，本节希伯来文却用“向、对”；因此正文保留本节的措辞。
    reason: 说明本节אֶל与1:2之עַל的差异，并保留“呼喊”这一不预断信息性质的替代译法。
lexical_decisions:
- source_word: ק֛וּם
  choice: 起来
  rationale: 该命令式表示起身行动；“起来”在现代汉语中自然、庄重，也保留命令的紧迫感。
- source_word: לֵ֥ךְ
  choice: 去
  rationale: 此处是普通的移动命令；与“起来”连用译作“起来……去”最自然。
- source_word: נִֽינְוֵ֖ה
  choice: 尼尼微
  rationale: 采用现代中文圣经传统中通行的专名音译。
- source_word: הָעִ֣יר הַגְּדוֹלָ֑ה
  choice: 大城
  rationale: גדול既可指规模宏大，也可含地位重要之意；“大城”简洁地保留这种表达及其在《约拿书》中的重复。
- source_word: וּקְרָ֤א אֵלֶ֨יהָ֙
  choice: 向城里宣告
  rationale: קרא在此可指呼喊或宣告，介词 אֶל 表示“向、对”，并非1:2所用表示“攻击、针对”的 עַל；因此不在正文中加入“斥责”或“攻击”的意思。
- source_word: אֶת הַקְּרִיאָ֔ה
  choice: 信息
  rationale: 该名词指所宣告的内容。中文若直译为“宣告那宣告”十分生硬；“宣告……信息”自然地传达其语义。
- source_word: אֲשֶׁ֥ר אָנֹכִ֖י דֹּבֵ֥ר אֵלֶֽיךָ
  choice: 我对你说的
  rationale: דבר אֶל 的基本意思是“对……说”。此译法贴近原文，并保留分词所呈现的直接发言语境，不额外解释为“吩咐”。
theological_decisions:
- issue: 上帝的信息与尼尼微的关系
  choice: 向城里宣告
  alternative: 向城发出呼喊，斥责它
  rationale: 本节使用介词 אֶל（“向、对”），不同于1:2的 עַל（“攻击、针对”）。正文保留这一变化，不预先把信息明确解释为斥责；信息仍可能包含审判，但本节的介词本身没有明说。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“起来……去”保留连续命令的力度；“大城尼尼微”兼顾汉语习惯和全书的文学重复；避免生硬复制希伯来文同源词而译成“宣告……信息”。
