  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יָּ֣קָם יוֹנָ֗ה וַ/יֵּ֛לֶךְ אֶל נִֽינְוֶ֖ה כִּ/דְבַ֣ר יְהוָ֑ה וְ/נִֽינְוֵ֗ה הָיְתָ֤ה עִיר גְּדוֹלָה֙ לֵֽ/אלֹהִ֔ים מַהֲלַ֖ךְ שְׁלֹ֥שֶׁת יָמִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/003/003.yaml
  text: So Jonah arose and went to Nineveh[a], according to the word of Yahweh. Now Nineveh was an exceedingly great city before God[b], a journey of three days.
translation:
  language: zh_hans
  text: 于是，约拿起来，照着雅威的话往尼尼微去。尼尼微在上帝面前是一座极大的城[a]，要走三天的路程[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“在上帝面前是一座大城”，也可能是表示“极其宏大”的惯用说法。
    reason: alternative_reading
  - marker: b
    text: 也可译作“三天的行程”。这可能指横穿该城所需的时间，也可能指走遍或巡行全城所需的时间。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: 起来
  rationale: קום在连续叙事中表示约拿响应命令而行动；“起来”既直接，也与前文的叙事呼应。
- source_word: וַיֵּלֶךְ אֶל נִינְוֶה
  choice: 往尼尼微去
  rationale: הלך是普通的“去、行走”；此译自然保留行动方向及简洁的叙事次序。
- source_word: כִּדְבַר יְהוָה
  choice: 照着雅威的话
  rationale: 贴近“按照雅威的话”，表达约拿依照神的命令行动，并保留“话”这一原文意象。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以通行的汉语音译呈现四字神名，区别于作为称号的“主”。
- source_word: עִיר גְּדוֹלָה לֵאלֹהִים
  choice: 在上帝面前是一座极大的城
  rationale: 保留原文明确的“上帝”成分，同时以“极大的”传达该短语可能具有的最高级强化作用；脚注说明另一种理解。
- source_word: מַהֲלַךְ שְׁלֹשֶׁת יָמִים
  choice: 要走三天的路程
  rationale: מַהֲלָךְ可指行程、距离或行走所需时间；此译不限定它是城市的直径、周长，还是走遍或巡行全城所需的时间。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用以色列上帝的专名；音译“雅威”保留其专名性质，而不以称号代替。
- issue: לֵאלֹהִים在עִיר גְּדוֹלָה לֵאלֹהִים中的意义
  choice: 在上帝面前是一座极大的城
  alternative: 是一座极大的城；对上帝而言是一座大城
  rationale: 该短语可按字面理解为“在／对上帝面前”，也可能是表达极大的惯用强化语。正文保留上帝指向并传达强化意味，脚注呈现歧义，避免只取一种解释。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“于是”承接叙事，“起来……去”保留希伯来文连续动作的节奏；正文不把“大城在上帝面前”和“三天路程”的含义解释得过窄。
