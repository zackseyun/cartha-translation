base_translation:
  language: en
  yaml_path: translation/ot/jonah/003/007.yaml
  text: 'And he proclaimed and said in Nineveh[a], by decree of the king and his nobles: “Let neither man nor beast, herd nor flock, taste anything. Let them not graze[b], and let them not drink water.”'
translation:
  language: zh_hans
  text: 他在尼尼微宣告说：“奉王和他的大臣之命：无论人还是牲畜，牛群还是羊群，都不可尝任何东西；不可吃草，也不可喝水。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּזְעֵק וַיֹּאמֶר
  choice: 宣告说
  rationale: 保留“公开宣告”与“说”两个动作，同时用现代汉语中自然庄重的表达呈现王令颁布的语境。
- source_word: מִטַּעַם
  choice: 奉……之命
  rationale: 该词在行政语境中指正式决定或命令；“奉……之命”自然体现公告所依据的权威。
- source_word: הַמֶּלֶךְ וּגְדֹלָיו
  choice: 王和他的大臣
  rationale: “大臣”自然表达字面为“他的大人物”的王国显要或高级官员，而不把其身份限定为世袭贵族。
- source_word: הָאָדָם וְהַבְּהֵמָה
  choice: 人还是牲畜
  rationale: אָדָם在这里是集合用法，泛指人类，与牲畜相对；汉语“人”准确而不必标示性别。
- source_word: הַבָּקָר וְהַצֹּאן
  choice: 牛群还是羊群
  rationale: 分别呈现大牲畜群与羊群这两个集合类别，并保持诏令的并列节奏。
- source_word: אַל יִטְעֲמוּ מְאוּמָה
  choice: 都不可尝任何东西
  rationale: 保留טעם“尝”的字面意象，并由“任何东西”明确表达彻底禁食。
- source_word: אַל יִרְעוּ
  choice: 不可吃草
  rationale: 该动词指牲畜放牧、吃草；在中文禁令中，“不可吃草”比“不许放牧”更直接对应动物自身的动作。
- source_word: וּמַיִם אַל יִשְׁתּוּ
  choice: 也不可喝水
  rationale: 明确保留“水”这一宾语及递进的禁令结构。
theological_decisions:
- issue: אָדָם在人与动物对举中的集合意义
  choice: 人
  alternative: 人类；世人
  rationale: 原文单数集合名词在此泛指所有人。现代汉语“人”既保留简洁对举，也不会误解为仅指男性。
- issue: 禁令是否适用于人和牲畜，包括后续的吃草
  choice: 依原文保留连续禁令，不另行限定主语
  alternative: 把“不可吃草”明确限定为牲畜
  rationale: 希伯来文采用复数动词承接前述各类对象，语法上未另立主语；译文不额外补入解释，以保留原文略显突兀的范围关系。
translation_notes:
  register: 采用现代、庄重而清楚的公告体。以冒号和引号标明命令内容；不使用文言色彩过重的“谕令”“百姓与走兽”等词。
