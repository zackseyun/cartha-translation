  source_fidelity: “我却说”将 וַאֲנִי 的连续/强调性连接明确化为转折，原文并未要求此处的“却”。“仰望”可自然理解为向上仰视，较“look toward”所表达的朝向圣殿观看稍窄。其余核心意思，包括被动的“被赶逐”、具体的“从你眼前”以及由 אַךְ 引出的转折，均基本忠实。
  naturalness: 原译整体庄重通顺，适合祷告诗歌语体。“我曾说”更自然地反映回顾性的自述；“望向”在现代汉语中清楚表达朝向某处观看，避免“仰望”可能带来的垂直方向或抽象敬仰联想。
  terminology: “圣殿”准确对应 הֵיכַל קָדְשֶׁךָ，并保留对上帝的第二人称。“从你眼前”恰当地保留原文的视觉意象；脚注可保留“临在/眷顾”的可能范围，但不宜把它定为正文含义。
