  text: וַ/אֲנִ֣י אָמַ֔רְתִּי נִגְרַ֖שְׁתִּי מִ/נֶּ֣גֶד עֵינֶ֑י/ךָ אַ֚ךְ אוֹסִ֣יף לְ/הַבִּ֔יט אֶל הֵיכַ֖ל קָדְשֶֽׁ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/002/005.yaml
  text: And I said[a], ‘I have been driven out from before your eyes; yet I will again look toward your holy temple.’
translation:
  language: zh_hans
  text: 我曾说：“我从你眼前[a]被赶逐；然而，我还要再望向你的圣殿。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“离开你的视线”或“被逐出你面前”。也可指离开你的临在或不再蒙你眷顾。
    reason: 保留 מִנֶּגֶד עֵינֶיךָ 的具体视觉意象，并说明其在语境中可能含有临在或眷顾的引申，且不将该引申强加于正文。
lexical_decisions:
- source_word: וַאֲנִי אָמַרְתִּי
  choice: 我却说
  rationale: 连词、独立代词与动词延续诗句，同时突出说话者；结合前后语意，用“却”自然表达轻微转折，但不将其强化为绝对对立。“说”保留 אָמַר 的通常意义，也容许这是祷告中的内心言语。
- source_word: נִגְרַשְׁתִּי
  choice: 我已……被赶逐
  rationale: 该词是 גרש 的尼法勒式，表达被驱赶、被逐离。“被赶逐”保留被动和强烈的空间排斥感；“已”体现完成式在此所表达的既成处境。
- source_word: מִנֶּגֶד עֵינֶיךָ
  choice: 从你眼前
  rationale: 直译为“从你眼睛面前”。“从你眼前”在现代汉语中自然，并保留希伯来文具体的“眼”之意象，而不直接解释成抽象的神学概念。
- source_word: אַךְ
  choice: 然而
  rationale: 此处引出从被逐之感转向盼望的明显转折；“然而”庄重、自然，也未把该语气词解释成表示确定的“必定”。
- source_word: אוֹסִיף לְהַבִּיט
  choice: 还要再仰望
  rationale: יסף 的使役式接不定词可表示“再次”或“继续”。本句在遭拒与盼望之间形成转折，“还要再”保留再次行动的主要含义；“仰望”既表达朝向圣殿观看，也符合祷告语境，但不把动作纯粹抽象化为信靠。
- source_word: הֵיכַל קָדְשֶׁךָ
  choice: 你的圣殿
  rationale: הֵיכָל 用于上帝时通常指圣殿；“你的圣殿”是“你圣洁的殿”在现代汉语中的自然表达。
theological_decisions:
- issue: “从你眼前”是空间性的视觉意象，还是指离开上帝的临在
  choice: 正文保留“从你眼前”
  alternative: “离开你的视线”或“被逐出你的面前”
  rationale: 希伯来文使用具体的“眼”之意象，可能兼含不再蒙上帝眷顾或被排除于其临在之外的意味。正文不把此意象化约为单一神学解释，脚注提供自然的语义替代。
- issue: אוֹסִיף 表示“再次”还是“继续”
  choice: 还要再仰望
  alternative: 还要继续仰望
  rationale: 该结构本身可有“再次做”或“继续做”的语义范围。上下文从“被赶逐”转向盼望再朝圣殿观看，正文采用“再”，但不据此断定约拿对上帝临在的理解或最终结局。
translation_notes:
  register: 采用现代、庄重而易懂的祷告诗歌语体。“赶逐”比“驱逐”稍具文学感，却仍为普通读者所熟悉；分号呈现绝望与盼望之间的强烈转折。
