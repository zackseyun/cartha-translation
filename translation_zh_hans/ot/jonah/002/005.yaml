revisions:
- from: 我却说：“我已从你眼前[a]被赶逐；然而，我还要再仰望你的圣殿。”
  to: 我曾说：“我从你眼前[a]被赶逐；然而，我还要再望向你的圣殿。”
  rationale: 修订去除“却”所加入的非必要转折，以“我曾说”自然呈现诗中的回顾性自述；将“仰望”改为“望向”，更贴近 לְהַבִּיט אֶל 的方向性。其余措辞维持原译对被逐、眼前意象、盼望性转折和圣殿术语的忠实表达。
