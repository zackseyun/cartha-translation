id: JON.2.10
reference: Jonah 2:10
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/אֲנִ֗י בְּ/ק֤וֹל תּוֹדָה֙ אֶזְבְּחָה לָּ֔/ךְ אֲשֶׁ֥ר נָדַ֖רְתִּי אֲשַׁלֵּ֑מָה יְשׁוּעָ֖תָ/ה לַ/יהוָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jonah/002/010.yaml
  text: But as for me[a], with the voice of thanksgiving I will sacrifice to you; what I have vowed I will pay. Salvation belongs to Yahweh.
translation:
  language: zh_hans
  text: 但我必以感谢的声音向你献祭；我所许的愿，我必履行。拯救出于雅威。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“解救属于雅威”，也可译：“救恩来自雅威。”希伯来语 יְשׁוּעָה 在本语境中可指解救、救助，也可有较广的“救恩”之意。
    reason: 保留 יְשׁוּעָה 的词义范围，以及介词 לְ 所容许的归属与来源两种理解。
lexical_decisions:
- source_word: וַאֲנִי
  choice: 但我
  rationale: 连词加独立代词带有强调和对比作用，承接上文而突出约拿自己的回应；“但我”在现代汉语中简洁自然。
- source_word: בְּקוֹל תּוֹדָה
  choice: 在感谢声中
  rationale: 保留 קוֹל“声音”的听觉意象，同时将 תּוֹדָה 理解为发声表达的感谢；比直译“以感谢的声音”更符合现代汉语。
- source_word: אֶזְבְּחָה לָּךְ
  choice: 必向你献祭
  rationale: זבח 指献上祭物，לָּךְ 表明献祭的对象；“必”传达此处坚定的意愿和承诺语气。
- source_word: אֲשֶׁר נָדַרְתִּי אֲשַׁלֵּמָה
  choice: 我所许的愿，我必偿还
  rationale: 在许愿语境中，שלם 的加强词干指偿付或履行所许之愿；“偿还”保留希伯来语具体的履约表达。
- source_word: יְשׁוּעָתָה לַיהוָה
  choice: 拯救出于雅威
  rationale: יְשׁוּעָה 在本段首先指脱险、蒙救，也可有更广的“救恩”含义；לַיהוָה 可表达归属或来源，“出于雅威”是自然且合乎语境的汉语表述。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”按其较通行的学术复原音译，保留其作为盟约神名的性质，而不以称号替代。
- issue: יְשׁוּעָה 的语境义与广义
  choice: 拯救
  alternative: 救恩
  rationale: 约拿在鱼腹中祷告的直接语境强调实际的解救，因此正文采用“拯救”；脚注保留其可指更广义“救恩”的语义张力。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“在感谢声中”保留原文的声音意象；两个“必”体现祷告中坚定的献祭和还愿承诺。
