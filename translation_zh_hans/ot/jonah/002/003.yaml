id: JON.2.3
reference: Jonah 2:3
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר קָ֠רָאתִי מִ/צָּ֥רָה לִ֛/י אֶל יְהוָ֖ה וַֽ/יַּעֲנֵ֑/נִי מִ/בֶּ֧טֶן שְׁא֛וֹל שִׁוַּ֖עְתִּי שָׁמַ֥עְתָּ קוֹלִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/002/003.yaml
  text: And he said[a], “I called to Yahweh out of my distress, and he answered me. From the belly of Sheol I cried out[b]; you heard my voice.”
translation:
  language: zh_hans
  text: 他说：“我在患难中求告雅威，他就应允了我；我从示俄勒[b]的腹中[a]呼求，你听见了我的声音。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“示俄勒的母腹中”；希伯来语“腹”也可指“母腹”。
    reason: lexical_alternative
  - marker: b
    text: “示俄勒”是希伯来语对死者所在领域的称呼；较具解释性的译法是“阴间”，也有人译作“坟墓”。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 他说
  rationale: 保留希伯来叙事中引出祷告的表达；现代汉语无需机械补出连接词“于是”或“并且”。
- source_word: קָרָאתִי מִצָּרָה לִי
  choice: 我在患难中求告
  rationale: “求告”自然体现向神呼喊、祷告的语境；“在患难中”传达 מִן 的处境来源含义及 לִי 所表达的切身患难。
- source_word: אֶל יְהוָה
  choice: 求告雅威
  rationale: “雅威”直接呈现四字神名；汉语“求告”已自然包含向某位对象呼求的方向。
- source_word: וַיַּעֲנֵנִי
  choice: 他就应允了我
  rationale: “应允”符合神回应祷告的语境，并保留第一人称宾语；“就”自然表达诗句中的回应关系。
- source_word: מִבֶּטֶן שְׁאוֹל
  choice: 从示俄勒的腹中
  rationale: “腹中”保留 בֶּטֶן 的具体诗性意象，也与约拿身处鱼腹的叙事背景形成呼应；“示俄勒”以音译保留该词所指死者领域的古代概念，不把它窄化为坟墓或后世意义上的地狱。
- source_word: שִׁוַּעְתִּי
  choice: 呼求
  rationale: 该动词含因急难而呼救的意味；“呼求”在中文中既传达迫切呼喊，也适合祷告语境，而不额外补入原文未明说的“帮助”。
- source_word: שָׁמַעְתָּ קוֹלִי
  choice: 你听见了我的声音
  rationale: 紧贴原文，并保留诗句从第三人称“他”转为第二人称“你”的直接称呼。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华／主
  rationale: 原文直接使用四字神名；采用“雅威”而非称号“主”，以保留其作为神之名的性质，同时避免把后起形式当作原始读音。
- issue: שְׁאוֹל 的译法
  choice: 示俄勒
  alternative: 阴间／坟墓／地狱
  rationale: 音译避免把该词等同于单一坟墓，也避免导入后世关于“地狱”的完整观念；脚注说明其基本所指，以兼顾可懂度。
- issue: 叙述人称转为直接称呼
  choice: 他就应允了我……你听见了我的声音
  alternative: 你应允了我……你听见了我的声音
  rationale: 保留希伯来诗句真实存在的第三人称到第二人称转换，不为追求人称整齐而改写。
translation_notes:
  register: 采用现代、庄重而易懂的祷告诗体。分号维持两组平行句的节奏；“求告—应允”与“呼求—听见”形成原文的对应。脚注标记紧跟各自所释词语，避免英文咨询层中标记位置与脚注内容错配的问题。
