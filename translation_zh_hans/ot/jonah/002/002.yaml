  text: Then Jonah prayed to Yahweh his God from the belly of the fish[a].
translation:
  language: zh_hans
  text: 于是，约拿从鱼腹中向雅威——他的上帝——祷告[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译：“从鱼的内脏中”；这里按语境译作“从鱼腹中”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְפַּלֵּל
  choice: 于是……祷告
  rationale: 未完成式连续体推进叙事；“于是”自然表达先后关系，התפעל词形在此意为“祷告”。
- source_word: יוֹנָה
  choice: 约拿
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: אֶל
  choice: 向
  rationale: 与“祷告”搭配时，“向”是自然、准确的现代汉语表达。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文直接呈现四字神名，保留其作为专名的性质，不以称号替代。
- source_word: אֱלֹהָיו
  choice: 他的上帝
  rationale: 保留第三人称阳性单数所有格，直接表达约拿与上帝的关系。
- source_word: מִמְּעֵי
  choice: 从……腹中
  rationale: מֵעֶה可指内脏、腹部或子宫；在鱼吞下约拿的语境中，“腹中”最自然，同时保留“从……里面”的空间含义。
- source_word: הַדָּגָה
  choice: 鱼
  rationale: 原文只有带定冠词的“鱼”，本节不应从前文补入“大”；该名词的阴性语法形式在中文中无须标出。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文明确使用四字神名。音译为“雅威”可保留其专名性质，避免用“主”这一称号代替；“耶和华”虽为中文传统译名，但较不贴近目前通常重构的读音。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“雅威”呈现神的专名；“鱼腹中”清楚易懂，并以脚注保留原词更具体的“内脏”含义。
