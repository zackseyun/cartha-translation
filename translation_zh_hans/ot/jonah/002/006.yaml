  text: אֲפָפ֤וּ/נִי מַ֨יִם֙ עַד נֶ֔פֶשׁ תְּה֖וֹם יְסֹבְבֵ֑/נִי ס֖וּף חָב֥וּשׁ לְ/רֹאשִֽׁ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/002/006.yaml
  text: Waters closed in around me to my very life[a]; the deep surrounded me[b]; seaweed was wrapped around my head.
translation:
  language: zh_hans
  text: 水包围我，直逼我的性命[a]；深水环绕我；海草[b]缠住我的头。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “性命”原文可指“生命”或“自身”；也常译作“魂”。
    reason: lexical_alternative
  - marker: b
    text: “海草”也可译作“芦苇”或“灯心草”；约拿身在海中的语境较支持“海草”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲפָפוּנִי
  choice: 从四面困住我
  rationale: 该动词表示包围、环绕；“从四面困住”既保留受围困的威胁感，也符合现代汉语表达。
- source_word: מַיִם
  choice: 水
  rationale: 希伯来语虽采用复数形式，但在现代汉语中用“水”即可自然呈现四周海水逼迫的意象。
- source_word: עַד נֶפֶשׁ
  choice: 危及我的性命
  rationale: נֶפֶשׁ 在此指人的生命或自身，而非抽象的非物质“灵魂”；整句表达海水已经威胁到生命。
- source_word: תְּהוֹם
  choice: 深渊
  rationale: 该词指深处的大水或海洋深处；“深渊”简洁保留了诗歌中幽深、可怖的水域意象。
- source_word: יְסֹבְבֵנִי
  choice: 环绕我
  rationale: 直接表达环绕、包围之意，并与前一分句形成诗体平行而不过度重复。
- source_word: סוּף
  choice: 海草
  rationale: 该词也可指芦苇或灯心草，但约拿沉在海中的语境更支持“海草”。
- source_word: חָבוּשׁ
  choice: 缠裹着
  rationale: 被动分词表达被束住或包裹的状态；“缠裹着”自然且形象。
- source_word: לְרֹאשִׁי
  choice: 我的头
  rationale: 按具体身体意象直译，无需增添“头顶”等原文未明确表达的细节。
theological_decisions:
- issue: נֶפֶשׁ 的含义
  choice: 性命
  alternative: 灵魂／我自己
  rationale: 此处语境是溺水对生命的威胁；译作“性命”避免把希伯来语的人或生命概念限定为后来的身心二分意义，同时脚注保留其词义幅度。
translation_notes:
  register: 采用庄重而清晰的现代标准汉语，保留三分句的诗体平行。“从四面困住”传达逼迫感，“危及我的性命”明确表达 עַד נֶפֶשׁ 的极端处境；脚注标记均置于相应词语之后。
