source:
  edition: WLC
  text: מְשַׁמְּרִ֖ים הַבְלֵי שָׁ֑וְא חַסְדָּ֖/ם יַעֲזֹֽבוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/002/009.yaml
  text: Those who cling to worthless idols forsake their own mercy[a].
translation:
  language: zh_hans
  text: 那些依附虚妄偶像的人，离弃自己的慈爱[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“离弃属于他们的忠贞之爱。”也可能指他们放弃了本可从上帝得到的慈爱。
    reason: 原文“自己的慈爱”既可能指他们本应持守的忠贞之爱，也可能指上帝向他们所施、却被他们舍弃的慈爱。
lexical_decisions:
- source_word: מְשַׁמְּרִים
  choice: 持守
  rationale: שמר通常表示“守、持守、看守”。这里与“虚妄偶像”连用，指持续忠于或依附它们；“持守”既保留原词意味，也符合庄重的现代汉语。
- source_word: הַבְלֵי שָׁוְא
  choice: 虚妄偶像
  rationale: הבל有虚空、虚幻之意，שוא有虚假、徒然之意；在先知性语境中，这一组合指虚假而毫无价值的偶像。“虚妄偶像”明确所指，同时保留其空虚、欺骗人的色彩。
- source_word: חַסְדָּם
  choice: 自己的慈爱
  rationale: חסד可表示慈爱、忠贞之爱、恩慈或盟约忠诚，后缀为第三人称阳性复数。“自己的慈爱”保留所有关系和原文的简练，不在正文中断定这是他们应有的忠贞，还是上帝赐给他们的慈爱。
- source_word: יַעֲזֹבוּ
  choice: 离弃
  rationale: עזב表示离开、抛弃、离弃；“离弃”符合诗歌和先知话语的庄重语体，也能体现关系上的背弃。
theological_decisions:
- issue: חַסְדָּם所指的慈爱与偶像崇拜者、上帝之间的关系
  choice: 正文译作“自己的慈爱”，保留原文所有关系及חסד的关系性含义
  alternative: 可理解为他们所舍弃、原可从上帝得到的慈爱；也可理解为他们本应持守的忠贞之爱
  rationale: 希伯来语允许多种理解：חסד既可指慈爱、恩慈，也可指忠贞之爱或盟约忠诚；第三人称复数后缀本身没有说明这种慈爱来自谁或应由谁实行。因此正文不将其中一种神学解释绝对化，脚注说明主要可能性。
translation_notes:
  register: 采用现代、庄重而简洁的汉语。“持守……离弃……”形成清晰对照；正文保留希伯来诗句的凝练与神学张力，脚注交代歧义。
