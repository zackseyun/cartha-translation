id: JON.2.7
reference: Jonah 2:7
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: לְ/קִצְבֵ֤י הָרִים֙ יָרַ֔דְתִּי הָ/אָ֛רֶץ בְּרִחֶ֥י/הָ בַעֲדִ֖/י לְ/עוֹלָ֑ם וַ/תַּ֧עַל מִ/שַּׁ֛חַת חַיַּ֖/י יְהוָ֥ה אֱלֹהָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/002/007.yaml
  text: I went down to the roots of the mountains[a]; the earth with its bars was around me forever, but you brought up my life from the pit[c][b], O Yahweh my God.
translation:
  language: zh_hans
  text: 我下到群山的根基[a]；大地的门闩把我永远围困[b]。然而，雅威我的上帝啊，你却从深坑中把我的性命救上来[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“群山的尽头”“群山的底部”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“大地——它的门闩在我身后永远关上。”原文描绘大地以门闩或横闩把人囚禁的景象。
    reason: lexical_alternative
  - marker: c
    text: “深坑”也可译作“坟墓”或“毁灭”。
    reason: lexical_alternative
lexical_decisions:
- source_word: לְקִצְבֵי הָרִים
  choice: 群山的根基
  rationale: קֶצֶב可指尽头、边缘或界限；与“群山”和“下到”连用时，指向山体最深、最底部的所在。“根基”在现代汉语中自然保留了山向下延伸的诗歌意象。
- source_word: יָרַדְתִּי
  choice: 我下到
  rationale: 直译Qal完成式第一人称单数，保留向下运动的核心意象，同时符合现代汉语表达。
- source_word: הָאָרֶץ
  choice: 大地
  rationale: 此处与群山、门闩和深坑共同构成死亡与地下领域的诗歌图景；“大地”比“土地”更能承载这种宏观意象。
- source_word: בְּרִחֶיהָ בַעֲדִי
  choice: 大地的门闩把我……围困
  rationale: בְּרִיחַ是门闩或横闩，בַעֲדִי在本语境中表达环绕、封闭或在身后关上的状态。“围困”保留囚禁意象，同时不把具体空间关系限定为唯一解释。
- source_word: לְעוֹלָם
  choice: 永远
  rationale: 保留说话者面对死亡时所感受到的终局性；这里不必据此断定其所描述的是严格意义上的无尽时长。
- source_word: וַתַּעַל
  choice: 你却……救上来
  rationale: עלה的Hiphil形式表示“使上升、带上来”。结合从深坑脱离的语境，“救上来”既保留向上的动作，也自然表达上帝施行拯救。
- source_word: מִשַּׁחַת
  choice: 从深坑中
  rationale: שַׁחַת可指坑、坟墓或毁灭。“深坑”保留具体的垂直空间意象，并让死亡和毁灭的含义保持含蓄。
- source_word: חַיַּי
  choice: 我的性命
  rationale: 原文直指“我的生命”，在此也近于“我本人”。“性命”既保持生命受死亡威胁的意味，又符合中文诗歌祷告语境。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代中文常见音译呈现四字神名，而不以称号替代专名。
- source_word: אֱלֹהָי
  choice: 我的上帝
  rationale: 忠实呈现第一人称所属形式，并保留约拿对上帝的直接呼告。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文使用神的专名。译作“雅威”可在中文中保留专名性质，避免以“主”这一称号取代；“耶和华”是传统形式，但较少反映学界通常重建的读音。
- issue: לְעוֹלָם在死亡祷告中的时长含义
  choice: 永远
  alternative: 长久；直到永世
  rationale: “永远”保留诗人所感受到的死亡终局性和原文的强烈语气，但不在译文中额外裁定这是否是对阴间持续时间的字面教义陈述。
- issue: וַתַּעַל所表达的拯救动作
  choice: 救上来
  alternative: 使……上升；带上来
  rationale: 原文明确表达从下方被带上来的动作；在祷告语境中，“救上来”自然呈现这一动作的拯救性质，同时仍保留上下方向的对照。
translation_notes:
  register: 采用现代、庄重而易懂的祷告诗体。“群山的根基—大地的门闩—深坑—救上来”维持原文连续的下降、囚禁与上升意象；用“然而”“却”清楚呈现拯救的转折。
