  text: בְּ/הִתְעַטֵּ֤ף עָלַ/י֙ נַפְשִׁ֔/י אֶת יְהוָ֖ה זָכָ֑רְתִּי וַ/תָּב֤וֹא אֵלֶ֨י/ךָ֙ תְּפִלָּתִ֔/י אֶל הֵיכַ֖ל קָדְשֶֽׁ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/002/008.yaml
  text: When my life was fainting away within me[a], I remembered Yahweh, and my prayer came to you[b], into your holy temple.
translation:
  language: zh_hans
  text: 当我的生命渐渐消逝时[a]，我就想起雅威；我的祷告来到你面前，并进入你的圣殿[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“当我的心灵渐渐衰微时。”希伯来语 נֶפֶשׁ 可按语境指生命、心灵或自己。
    reason: lexical_alternative
  - marker: b
    text: “圣殿”也可译作“圣宫”或“圣所”。这里的希伯来语可指君王的宫殿或神的殿；本句并未明确限定是地上的圣殿还是神天上的居所。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּהִתְעַטֵּף עָלַי נַפְשִׁי
  choice: 当我的生命在我里面渐渐衰微时
  rationale: בְּ加不定式构成时间从句；הִתְעַטֵּף在患难语境中表示逐渐衰弱、昏沉。נַפְשִׁי在约拿濒死的语境中以“我的生命”最贴切；עָלַי按此习语自然译为“在我里面”。“渐渐衰微”保留过程感和濒危意味。
- source_word: אֶת־יְהוָה זָכָרְתִּי
  choice: 我就想起雅威
  rationale: זָכָרְתִּי直译为“我想起”；“就”自然承接前面的时间从句。按所给神名处理原则，将四字神名译作“雅威”。
- source_word: וַתָּבוֹא אֵלֶיךָ תְּפִלָּתִי
  choice: 我的祷告来到你面前
  rationale: בוא的基本义为“来、来到”，אֵלֶיךָ表示朝向“你”。“来到你面前”符合现代汉语祷告语境，又不把动词加强为“蒙垂听”。
- source_word: אֶל־הֵיכַל קָדְשֶׁךָ
  choice: 进入你的圣殿
  rationale: אֶל表示趋向；与前面的“来到”相连时，“进入”保留祷告进入神圣居所的空间意象。הֵיכָל可指宫殿或圣殿，此处祷告语境中译“圣殿”最合适，同时不限定为地上或天上的居所。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文明确使用四字神名。采用“雅威”以保留专名性质，不以称号“主”替代。
- issue: נֶפֶשׁ 的人论含义
  choice: 生命
  alternative: 灵魂；自己
  rationale: 本节处于濒死祷告的语境，“生命”表达具体生命逐渐衰微，不把 נֶפֶשׁ 限定为与身体分离的技术性“灵魂”概念；脚注保留另一种直译可能。
- issue: הֵיכָל 所指的居所
  choice: 圣殿
  alternative: 圣宫；圣所
  rationale: “圣殿”符合向以色列之神祷告的语境，也保留其可能指地上圣殿或神天上居所的张力，不在正文中强行判定。
translation_notes:
  register: 采用现代、庄重而通顺的普通话。“渐渐衰微”呈现濒死过程而不过度口语化；分号保留两个主要分句的诗性推进。正文中的[a]、[b]均与脚注对应。
