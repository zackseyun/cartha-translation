  text: וַ/יְמַ֤ן יְהוָה֙ דָּ֣ג גָּד֔וֹל לִ/בְלֹ֖עַ אֶת יוֹנָ֑ה וַ/יְהִ֤י יוֹנָה֙ בִּ/מְעֵ֣י הַ/דָּ֔ג שְׁלֹשָׁ֥ה יָמִ֖ים וּ/שְׁלֹשָׁ֥ה לֵילֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/002/001.yaml
  text: And Yahweh appointed a great fish to swallow Jonah[d][c][b][a], and Jonah was in the belly of the fish three days and three nights.
translation:
  language: zh_hans
  text: 雅威安排[a]了一条大鱼[c]吞下约拿；约拿在鱼腹[b]中三天三夜[d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “安排”也可译作“预备”或“指派”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译为“在鱼的内部（内脏）”；正文按汉语习惯译作“在鱼腹中”。
    reason: lexical_alternative
  - marker: c
    text: 希伯来文说的是“大鱼”，并未特指“鲸”。
    reason: alternative_reading
  - marker: d
    text: “三天三夜”依原文直译；译文不在此判定是否采用首尾日均计入的计算方式。
    reason: cross_reference
lexical_decisions:
- source_word: וַיְמַן
  choice: 安排了
  rationale: 该动词在这里表示雅威有意安排、指定这条鱼执行任务，而非偶然出现。“安排”在现代汉语中自然，也保留了神主动支配事件的含义。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文直接音译神的专名，不以“主”这一称号替代。
- source_word: דָּג גָּדוֹל
  choice: 一条大鱼
  rationale: דָּג是泛指“鱼”的普通词，גָּדוֹל意为“大”；原文并未具体说明是鲸。
- source_word: לִבְלֹעַ
  choice: 来吞下
  rationale: 该不定式直指吞咽动作；“吞下”简洁自然，并清楚表达安排这条鱼的目的。
- source_word: בִּמְעֵי הַדָּג
  choice: 在鱼腹中
  rationale: מֵעֶה字面可指内脏或内部；“鱼腹”既符合现代汉语习惯，也保留了具体的身体内部意象。
- source_word: שְׁלֹשָׁה יָמִים וּשְׁלֹשָׁה לֵילוֹת
  choice: 三天三夜
  rationale: 直接保留希伯来文的时间表达，不在正文中将其解释为不足三个整日或其他计时方式。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文使用四字神名，译作“雅威”可明确呈现其专名性质，而不以称号替代。
- issue: 海中生物的具体种类
  choice: 大鱼
  alternative: 鲸
  rationale: 希伯来文只说“鱼”，没有把该生物界定为鲸；译文不引入后来的具体化理解。
- issue: “三天三夜”的时间计算
  choice: 按原文译为“三天三夜”
  alternative: 三日之内的一段时间；约三天
  rationale: 正文保留原文措辞及其可能引发的计时问题，不以译文预先解决包容式计日等解释争议。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“安排了一条大鱼来……”自然表达雅威主动指定其任务；“鱼腹”比“鱼的内脏”更符合普通读者的语言习惯，同时以脚注交代字面含义。
