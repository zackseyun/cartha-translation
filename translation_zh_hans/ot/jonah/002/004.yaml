  text: וַ/תַּשְׁלִיכֵ֤/נִי מְצוּלָה֙ בִּ/לְבַ֣ב יַמִּ֔ים וְ/נָהָ֖ר יְסֹבְבֵ֑/נִי כָּל מִשְׁבָּרֶ֥י/ךָ וְ/גַלֶּ֖י/ךָ עָלַ֥/י עָבָֽרוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/002/004.yaml
  text: You cast me into the deep[a], into the heart of the seas, and the current surrounded me; all your breakers and your waves passed over me.
translation:
  language: zh_hans
  text: 你把我投进深渊，投到众海的中心；海流[a]环绕着我；你的一切激浪和波涛都漫过我。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“河流”。נָהָר通常指“河流”，但在这里的海洋诗歌语境中，很可能指海中的水流或奔涌的水势。
    reason: 词义异译
lexical_decisions:
- source_word: וַתַּשְׁלִיכֵנִי
  choice: 你把我投进
  rationale: 动词 שלך 表示“投、扔”；“投进”既保留力度，也符合庄重的祷告诗体。第二人称阳性单数主语明确译作“你”，保留对上帝的直接称呼。
- source_word: מְצוּלָה
  choice: 深渊
  rationale: 该词在这里指海的深处；“深渊”简洁有力，传达被投入深水绝境的意象。
- source_word: בִּלְבַב יַמִּים
  choice: 海洋的中心
  rationale: לְבַב 字面为“心、中心”，יַמִּים 为复数“海洋/诸海”；译文保留“中心”的空间隐喻，同时用自然的现代汉语表达。
- source_word: וְנָהָר
  choice: 海流
  rationale: נָהָר 通常意为“河流”，但在海洋诗境中可指流动的水势；“海流”与上下文中的巨浪、波涛协调，同时以脚注保留通常词义。
- source_word: יְסֹבְבֵנִי
  choice: 环绕我
  rationale: סבב 表示“围绕、环绕”；“环绕我”贴近原文，且适合诗歌语体。
- source_word: מִשְׁבָּרֶיךָ
  choice: 你的巨浪
  rationale: מִשְׁבָּר 指破碎冲击的浪涛；现代汉语没有完全对应且自然的单词，“巨浪”能清楚传达其冲击力。
- source_word: וְגַלֶּיךָ
  choice: 和波涛
  rationale: גַּל 指波浪；与“巨浪”并列译作“波涛”，保留诗歌中的近义叠加，并自然承接共同的第二人称所属关系。
- source_word: עָלַי עָבָרוּ
  choice: 都漫过我
  rationale: 字面为“从我上面经过”；“漫过我”自然表达水浪淹没、越过说话者的景象，并保留 כָּל 的全称意味“都”。
theological_decisions:
- issue: 约拿下沉入海时上帝的主动作用
  choice: 保留对上帝的直接称呼：“你把我投进……你的巨浪和波涛”
  alternative: 弱化上帝的主动作用，把水手视为投掷动作的隐含主语
  rationale: 希伯来文明确使用第二人称阳性单数动词和第二人称所有格词尾。叙事层面虽由水手执行抛海动作，祷告却把此事归于上帝的主权行动；译文保留这一神学张力，不加以消解。
translation_notes:
  register: 采用现代、庄重而易懂的祷告诗体。“海洋的中心”保留希伯来文“海之心”的意象而避免生硬直译；分号呈现原诗从下沉处境转向四面水势的推进。主文中的脚注标记[a]与脚注对应。
