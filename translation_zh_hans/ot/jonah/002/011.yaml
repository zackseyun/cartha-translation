  yaml_path: translation/ot/jonah/002/011.yaml
  text: Then Yahweh spoke to the fish[a], and it vomited Jonah onto the dry land.
translation:
  language: zh_hans
  text: 于是，雅威对那条鱼说，鱼就把约拿吐到干地上。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 对……说了话
  rationale: אמר的基本义是“说”。这里没有引出直接引语；译作“对……说了话”既符合原文结构，也不把上下文所暗示的权柄强化为原文未明说的“命令”或“吩咐”。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语音译上帝向以色列启示的专名，保留其作为名字而非称号的性质。
- source_word: לַדָּג
  choice: 对那条鱼
  rationale: דג在本节只表示“鱼”，并带定冠词；因此译为“那条鱼”，不从前文补入本节没有的“大”。介词ל在此标示说话的对象。
- source_word: וַיָּקֵא
  choice: 吐
  rationale: קיא明确表示呕吐；“吐”在现代汉语中直接、自然，并保留原词的力度，不弱化为“吐出”以外的委婉表达。
- source_word: אֶת יוֹנָה
  choice: 把约拿
  rationale: אֶת标示确定的直接宾语；用现代汉语“把”字句自然呈现约拿是被吐出的对象。
- source_word: אֶל הַיַּבָּשָׁה
  choice: 到干地上
  rationale: יַבָּשָׁה指与海相对的干地；“到……上”表达אֶל在本语境中的趋向。
- source_word: וַ
  choice: 于是／就
  rationale: 连续的叙事连接词推动事件发展；句首用“于是”，后句用“就”，自然表达先后关系。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: “雅威”较直接地音译四字神名，保留其专名性质；“耶和华”是汉语传统中广为人知的形式，但其读音源自较晚的混合读法。这里优先依据希伯来语名称本身翻译。
- issue: 雅威对鱼所说之话的性质
  choice: 不明说为命令
  alternative: 吩咐那条鱼
  rationale: 上下文显示鱼顺从了神，但אמר本身是“说”，原文没有使用明确表示“命令”的动词；因此保留词义和叙述中的含蓄，不将神的权柄表达得比原文更具体。
translation_notes:
  register: 采用简洁、庄重而通顺的现代标准汉语。“吐到干地上”保留原文鲜明的动作描写；没有从前文补入“大鱼”。
