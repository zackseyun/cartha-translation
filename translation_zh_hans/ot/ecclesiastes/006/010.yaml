  text: מַה שֶּֽׁ/הָיָ֗ה כְּבָר֙ נִקְרָ֣א שְׁמ֔/וֹ וְ/נוֹדָ֖ע אֲשֶׁר ה֣וּא אָדָ֑ם וְ/לֹא יוּכַ֣ל לָ/דִ֔ין עִ֥ם ש/התקיף מִמֶּֽ/נּוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/006/010.yaml
  text: Whatever has come to be has already been named[a], and it is known what man is[b]; and he cannot contend with one stronger than he.
translation:
  language: zh_hans
  text: 凡已经存在的事物，早已被命名[a]；人是什么，已经知道了[b]；人不能与比自己更强的那一位争辩。[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “被命名”也可含有“已被界定”或“已被决定”的意味。
    reason: lexical_alternative
  - marker: b
    text: 原文用单数“人”，在这里代表全人类。此句也可译作：“他是人，这一点已经知道了。”
    reason: lexical_and_syntactic_alternative
  - marker: c
    text: “比自己更强的那一位”很可能指上帝，但希伯来文在这里没有明确说出其身份。
    reason: theological_ambiguity
lexical_decisions:
- source_word: מַה שֶּׁהָיָה
  choice: 凡已经存在的
  rationale: 概括一切已经出现或存在的事物，保留 היה 的完成意味和这句话的普遍性，同时避免生硬直译。
- source_word: כְּבָר
  choice: 早已
  rationale: 表达事情在此之前已经确定或成立，符合本节简洁的箴言式语气。
- source_word: נִקְרָא שְׁמוֹ
  choice: 被命名
  rationale: 保留希伯来文“名字被叫出”的被动命名意象；这一说法也可能含有被界定或决定的意味，但正文不将该隐喻解释掉。
- source_word: וְנוֹדָע אֲשֶׁר הוּא אָדָם
  choice: 人是什么，也早已为人所知
  rationale: 将被动式 וְנוֹדָע 译为既定的“为人所知”，并把从句理解为人之身份或处境的内容；脚注保留“他是人”这一较贴近句法的可能译法。
- source_word: אָדָם
  choice: 人
  rationale: 此处用单数代表全人类；现代汉语“人”自然保留这种代表性和普遍性。
- source_word: וְלֹא יוּכַל לָדִין
  choice: 不能……争辩
  rationale: דין 在这里指与对方抗辩或争论，不必限定为正式诉讼；“争辩”保留其对抗意味。
- source_word: עִם שֶׁהִתְקִיף מִמֶּנּוּ
  choice: 与比自己更强的那一位
  rationale: 保留比较关系以及对方身份未明的特点，不在正文中直接补出“上帝”。“那一位”在中文中自然指向某个更强者，同时不强行确定其身份。
theological_decisions:
- issue: 是否明确把“更强的那一位”认定为上帝
  choice: 正文保留身份不明，只译作“比自己更强的那一位”
  alternative: 直接译作“上帝”或在正文中说明此处指上帝
  rationale: 上下文很可能指上帝，但本节希伯来文本身没有明说。保留含蓄说法，既维持其神学张力，也避免把合理推断写成明文。
- issue: אֲשֶׁר הוּא אָדָם 的理解
  choice: 人是什么，也早已为人所知
  alternative: 他是人，这一点也早已为人所知
  rationale: 前者较自然地表达智慧文学对人类身份和限度的概括；后者更贴近从句表面的“他是人”。因句法容许不同理解，正文采用自然且符合语境的译法，并以脚注明示另一可能。
translation_notes:
  register: 采用现代、庄重而易懂的普通话，保留原文简洁的智慧箴言语气。以分号呈现三层递进：既有之事早被命名、人的身份或处境已为人所知、人的力量又不足以同更强者争辩。
