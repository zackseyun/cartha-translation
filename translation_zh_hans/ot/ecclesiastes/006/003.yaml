source:
  edition: WLC
  text: אִם יוֹלִ֣יד אִ֣ישׁ מֵאָ֡ה וְ/שָׁנִים֩ רַבּ֨וֹת יִֽחְיֶ֜ה וְ/רַ֣ב שֶׁ/יִּהְי֣וּ יְמֵֽי שָׁנָ֗י/ו וְ/נַפְשׁ/וֹ֙ לֹא תִשְׂבַּ֣ע מִן הַ/טּוֹבָ֔ה וְ/גַם קְבוּרָ֖ה לֹא הָ֣יְתָה לּ֑/וֹ אָמַ֕רְתִּי ט֥וֹב מִמֶּ֖/נּוּ הַ/נָּֽפֶל־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/006/003.yaml
  text: If a man fathers a hundred children and lives many years[a], however many the days of his years may be, but his soul is not satisfied with good, and he does not even have burial[c][b], I say that the stillborn child is better off than he.
translation:
  language: zh_hans
  text: 一个男子若生了一百个儿女，又活了许多年；不论他一生的日子有多长，他的心[a]却没有因福乐而满足，甚至得不到安葬，我说[b]，死胎[c]的境况比他更好。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “心”所译的希伯来语也可指“自己”、“生命”，在本处也可能着重于人的欲求。
    reason: lexical_alternative
  - marker: b
    text: “我说”也可译作“我曾说”。希伯来语的完成式在此既可理解为过去的陈述，也可理解为论述中当前的判断。
    reason: lexical_alternative
  - marker: c
    text: “死胎”也可译作“流产的胎儿”或“夭折的胎儿”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: 若
  rationale: 引出假设性的条件情形；“若”简洁庄重，也保留原文的条件语气。
- source_word: יוֹלִיד אִישׁ מֵאָה
  choice: 一个人若生了一百个儿女
  rationale: הוליד表示生育、使出生；“生了”在现代汉语中自然，并保留人数众多的强调。“儿女”使省略的宾语在汉语中明确。
- source_word: וְשָׁנִים רַבּוֹת יִחְיֶה וְרַב שֶׁיִּהְיוּ יְמֵי שָׁנָיו
  choice: 又活了许多年，不论他一生的日子有多长
  rationale: 保留原文先说“许多年”、再以“一生的日子”加以强化的重复，同时用“不论……多长”自然表达其让步意味。
- source_word: וְנַפְשׁוֹ
  choice: 他的心
  rationale: נפש在此可指人的内在自我、欲求或生命。“心”符合现代汉语表达，又避免把该词限定为一套技术性的灵魂观；脚注保留其语义幅度。
- source_word: לֹא תִשְׂבַּע מִן הַטּוֹבָה
  choice: 却没有因福乐而满足
  rationale: שבע意为饱足、满足；הטובה在《传道书》中常指人生可享的好处与福乐。“因福乐而满足”兼顾原文措辞和汉语可读性。
- source_word: וְגַם קְבוּרָה לֹא הָיְתָה לּוֹ
  choice: 甚至得不到安葬
  rationale: 表达此人连安葬也未能获得这一进一步的剥夺；“甚至”传达גם的递进强调。
- source_word: אָמַרְתִּי
  choice: 我说
  rationale: 该完成式可在传道者的论述中作为当前判断的引介语；正文采用自然的“我说”，脚注注明也可译为过去时。
- source_word: טוֹב מִמֶּנּוּ
  choice: 比他的境况更好
  rationale: 比较的是两者所处的境况，而非道德品质；补出“境况”可避免把“更好”误解为品格评价。
- source_word: הַנָּפֶל
  choice: 死胎
  rationale: 此词指未足月出生、流产或出生时已死的胎儿。“死胎”简明具体；脚注列出“流产的胎儿”等可能译法。
theological_decisions:
- issue: 智慧文学中נפש的人观含义
  choice: 正文译作“他的心”，并以脚注说明可指“生命、自己”或“欲求”。
  alternative: 译作“他的灵魂”或直接译成“他”。
  rationale: 本节并非在技术性地界定灵魂与身体的关系。译作“心”可保留内在主体的意味，又不把后期神学体系强加于经文；脚注保存原词的多义性。
- issue: 死胎与长寿多子者的比较性质
  choice: 译作“死胎比他的境况更好”。
  alternative: 译作“死胎比他更好”。
  rationale: 原文的טוב מן表达处境上的优劣比较，并非宣称死胎在道德或本体上优于那人；“境况”使现代读者准确把握比较焦点。
- issue: 未获安葬的陈述
  choice: 保持为实际境遇上的剥夺：“甚至得不到安葬”。
  alternative: 将其解释为无人纪念、无尊荣的比喻。
  rationale: 原文直接提及安葬。虽然这也蕴含羞辱与凄凉，正文不把这些文化和神学含义扩写成经文未明说的解释。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。保留原文关于长寿的强化性重复，并以“福乐”“安葬”等常用词呈现智慧文学的凝练语气。正文不使用过度技术化的神学术语；有必要的词义歧义均置于脚注。
