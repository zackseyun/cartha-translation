  terminology: “福乐”“安葬”适合本段智慧文学语域。“心”可作为נפש的汉语表述，但脚注宜说明其可指“自己／生命／欲求”，而不将其固定为技术性的“灵魂”。“死胎”可保留，脚注须避免将“untimely birth”误限为“未足月而生”。
