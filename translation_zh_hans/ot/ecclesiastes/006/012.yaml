  naturalness: 修订后的中文保持现代普通话的庄重、顺畅语气；“年日”适合《传道书》语境而不致过分文言。
  terminology: 保留本书的核心术语“虚空”及惯用表达“日光之下”。“什么对人是好的”不把 טוֹב 限缩为道德善、利益或幸福。
