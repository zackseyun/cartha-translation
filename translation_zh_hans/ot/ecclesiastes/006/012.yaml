  to: 谁知道人在世时，在他虚空人生的年日中，什么对人是好的呢？他如影般度过这些日子。谁能告诉人，在他以后，日光之下会有什么事发生呢？
  rationale: 修订以“虚空人生的年日”对应 חַיֵּי הֶבְלוֹ，以“他如影般度过这些日子”对应 וְיַעֲשֵׂם כַּצֵּל，避免把原文的动作关系改写为日子自行消逝；同时维持两句反问、泛指的“人”、以及“在他以后”未限定为死后的时间含义。
