  text: כִּ֣י מִֽי יוֹדֵעַ֩ מַה טּ֨וֹב לָֽ/אָדָ֜ם בַּֽ/חַיִּ֗ים מִסְפַּ֛ר יְמֵי חַיֵּ֥י הֶבְל֖/וֹ וְ/יַעֲשֵׂ֣/ם כַּ/צֵּ֑ל אֲשֶׁר֙ מִֽי יַגִּ֣יד לָֽ/אָדָ֔ם מַה יִּהְיֶ֥ה אַחֲרָ֖י/ו תַּ֥חַת הַ/שָּֽׁמֶשׁ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/006/012.yaml
  text: For who knows what is good for man in life, during the number of the days of his fleeting life, which he spends like a shadow? For who can tell man what will be after him under the sun?
translation:
  language: zh_hans
  text: 谁知道人在世时，在他虚空人生的年日中，什么对人是好的呢？他如影般度过这些日子。谁能告诉人，在他以后，日光之下会有什么事发生呢？
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַה טּוֹב לָאָדָם
  choice: 什么对他是好的
  rationale: 保留“何为对人有益/好”的开放性，不把 טוֹב 限定为道德上的善或物质利益；中文补出代词，使句意自然。
- source_word: בַּחַיִּים
  choice: 在世的一生中
  rationale: 这里指人在有生之年的生活处境；译法兼顾“在生命中”和“活在世上”的含义。
- source_word: חַיֵּי הֶבְלוֹ
  choice: 虚空一生
  rationale: הֶבֶל 本义为气息、雾气，引申为短暂、虚幻、难以把握；“虚空”呼应《传道书》的核心用语，同时保留其多义张力。
- source_word: וְיַעֲשֵׂם כַּצֵּל
  choice: 如影消逝
  rationale: 该短语字面近于“他使/度过这些日子如影”；中文以“如影消逝”表达日子像影子般迅速过去，并避免生硬直译。
- source_word: אַחֲרָיו
  choice: 在他以后
  rationale: 保留既可指他死后、也可指他离去之后的时间开放性。
- source_word: תַּחַת הַשָּׁמֶשׁ
  choice: 日光之下
  rationale: 采用本书反复出现的标志性表达，指人世经验的范围。
theological_decisions:
- issue: הֶבֶל 的神学与语义范围
  choice: 虚空
  alternative: 短暂／如雾
  rationale: “虚空”保持全书传统而核心的互文联系，但上下文以“如影消逝”同时显出短暂无常，避免将其仅解释为毫无价值。
- issue: “什么是好的”的指向
  choice: 不具体限定
  alternative: 什么是幸福的／什么最有益
  rationale: 原文没有界定“好”的性质，应保留其存在性、实践性和价值判断上的张力。
- issue: “在他以后”的范围
  choice: 保持时间上的含混
  alternative: 他死后
  rationale: 原文 אַחֲרָיו 未明说死亡，虽可包含死后之意，却也可能泛指其身后未来，故不宜收窄。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“屈指可数”自然表达 מִסְפַּר יְמֵי（有数的日子），并强化人生有限；两处反问维持希伯来文结构与语气。
