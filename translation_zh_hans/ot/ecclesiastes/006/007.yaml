revisions:
- from: 人的一切劳碌都是为了口腹，然而他的欲望仍填不满。[a]
  to: 人一切的劳碌都是为自己的口，然而他的欲求仍不得满足。[a]
  rationale: 修订恢复“口”的具体形象，消除“欲望仍填不满”的现代汉语搭配问题，并将未满足的 נֶפֶשׁ 译为“欲求仍不得满足”。脚注保留词义歧义，既不把该词限定为食欲，也不预设身心二分。
