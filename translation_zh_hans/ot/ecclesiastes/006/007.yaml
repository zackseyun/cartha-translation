  text: כָּל עֲמַ֥ל הָ/אָדָ֖ם לְ/פִ֑י/הוּ וְ/גַם הַ/נֶּ֖פֶשׁ לֹ֥א תִמָּלֵֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/006/007.yaml
  text: All a man's labor is for his mouth[a], yet even his appetite is not filled.
translation:
  language: zh_hans
  text: 人一切的劳碌都是为自己的口，然而他的欲求仍不得满足。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “欲求”原文也可译作“生命”、“自身”或“灵魂”。此处与“口”和“满足”相连，可能指食欲，也可能指人持续的欲求。
    reason: 说明 נֶפֶשׁ 的多义性，保留其与饮食及更广泛渴求有关的语境含义，并记录“灵魂”这一传统替代译法而不将其强加于正文。
lexical_decisions:
- source_word: כָּל
  choice: 一切
  rationale: 概括下文所说劳碌的全部范围；“一切”在现代汉语中简洁自然。
- source_word: עֲמַל
  choice: 劳碌
  rationale: 传道书中此词常带有辛苦操劳的意味；“劳碌”比普通的“工作”更能保留这种分量。
- source_word: הָאָדָם
  choice: 人
  rationale: 此处是泛指人类共同的处境，并非某个特定男子；汉语用单数泛称“人”既贴近原文形式，也自然包容。
- source_word: לְפִיהוּ
  choice: 为了口腹
  rationale: 原文直译为“为了他的口”。“口腹”保留进食的具体意象，同时在现代汉语中自然表达维持饮食与生计之意。
- source_word: וְגַם
  choice: 然而……仍
  rationale: 连词与强调词在语境中形成反讽性的转折：人虽为口腹劳碌，欲望却依旧未满；“然而……仍”自然呈现这一张力。
- source_word: הַנֶּפֶשׁ
  choice: 欲望
  rationale: נֶפֶשׁ 可指生命、自我、喉咙或欲求。这里与“口”和“填满”相连，“欲望”既适合语境，又避免把经文强行解释为身体与灵魂的二分；字面性更强的译法在脚注说明。
- source_word: לֹא תִמָּלֵא
  choice: 填不满
  rationale: 保留 Niphal 形式所表达的“未被充满”意象，并用自然汉语呈现持续无法满足的状态。
theological_decisions:
- issue: אָדָם 在普遍性陈述中的译法
  choice: 人
  alternative: 男人；世人
  rationale: 原文所说是普遍的人类经验，不强调男性身份。汉语“人”可自然保留泛指单数，也不把范围错误缩窄为男性。
- issue: נֶפֶשׁ 在口腹与满足语境中的译法
  choice: 欲望
  alternative: 心灵；性命；胃口
  rationale: 此处词义具有一定开放性，但上下文突出进食、欲求与无法填满。“欲望”保留超过单纯饥饿的含义，也不引入原文未明确建立的身心二元论；脚注保留“自身／生命”等可能性。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“口腹”保留原文“口”的具体意象；“填不满”与之呼应。脚注标记置于正文句末，以说明 נֶפֶשׁ 的词义选择。
