  text: וְ/אִלּ֣וּ חָיָ֗ה אֶ֤לֶף שָׁנִים֙ פַּעֲמַ֔יִם וְ/טוֹבָ֖ה לֹ֣א רָאָ֑ה הֲ/לֹ֛א אֶל מָק֥וֹם אֶחָ֖ד הַ/כֹּ֥ל הוֹלֵֽךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/006/006.yaml
  text: Even if he should live a thousand years twice over and not see good[c][b][a], do not all go to one place?
translation:
  language: zh_hans
  text: 即使他活了一千年又一千年[a]，仍未享受美好[b]，所有人不都到同一个地方去吗？[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“活了两千年”；原文直译为“一千年两次”。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“没有看见好”；这里的“看见好”是指经历或享受美好。
    reason: lexical_alternative
  - marker: c
    text: 这里暗指众人在死亡中有共同的归宿；希伯来文只说“一个地方”。
    reason: alternative_reading
lexical_decisions:
- source_word: וְאִלּוּ
  choice: 即使
  rationale: 引出让步性的假设，现代汉语用“即使”自然准确。
- source_word: חָיָה
  choice: 他活了
  rationale: 在让步假设结构中表达设想的寿命；汉语无需另加虚拟语气标记。
- source_word: אֶלֶף שָׁנִים פַּעֲמַיִם
  choice: 两次一千年
  rationale: 保留希伯来语“一千年两次”的强调方式，而非直接化约为“两千年”。
- source_word: וְטוֹבָה לֹא רָאָה
  choice: 却没有享受到福乐
  rationale: “看见好处”是经历、享受美好的惯用表达；译为“享受到福乐”使现代读者易懂，同时保留较宽泛的正面含义。
- source_word: הֲלֹא
  choice: 不都……吗
  rationale: 以反问句表达原文预期肯定回答的语气。
- source_word: אֶל מָקוֹם אֶחָד
  choice: 归往同一个地方
  rationale: “同一个地方”自然呈现共同归宿，同时不在正文中明确解释为死亡、坟墓或阴间。
- source_word: הַכֹּל
  choice: 众人
  rationale: 上下文所指是所有人；“众人”比可能涵盖万物的“一切”更清楚。
- source_word: הוֹלֵךְ
  choice: 归往
  rationale: 分词陈述普遍事实；“归往”符合共同终局的语境，并保持庄重。
theological_decisions:
- issue: “一个地方”所暗示的归宿
  choice: 正文保留为“同一个地方”，不明说死亡、坟墓或阴间
  alternative: 译作“死亡”“坟墓”或“阴间”
  rationale: 希伯来文只说“一个地方”，具体所指由上下文暗示；明确化会消除原文有意保留的含蓄。
- issue: “看见福乐”的含义
  choice: 译为“享受到福乐”
  alternative: 直译为“看见好处”
  rationale: 这是表示经历或享受美好事物的希伯来语惯用表达；意译可避免现代汉语误解，但不把它窄化为财富、幸福或顺境中的某一种。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“福乐”呼应《传道书》关于人生益处与享受的语境；反问句保留原文的修辞力度。所有脚注标记均置于相关正文位置。
