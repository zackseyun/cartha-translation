  rationale: 修订使汉语更自然，同时更严格贴近原文：以“一千年又一千年”保留重复强调；以“美好”维持טוֹבָה的宽泛含义；以“到……去”忠实表达“去往”而不加入“归返”。脚注保留原文的字面措辞、惯用语说明和“一个地方”未明说的指向。
