base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/006/008.yaml
  text: For what advantage does the wise man have over the fool? What does the poor man have who knows how to conduct himself before the living?[a]
translation:
  language: zh_hans
  text: 因为智慧人比愚昧人多得什么呢？知道怎样在众人面前行事的穷人，又有什么呢？[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或较直译：“知道怎样在活着的人面前行走的穷人，有什么呢？”“行走”在希伯来语中可指为人处世或行事；“活着的人”也可译作“众人”。
    reason: 保留“行走”和“活着的人”的字面表达，并呈现第二问较贴近原文语序的可能译法。
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，为前面的论述提供理由；现代汉语用“因为”能自然表达这一论证关系。
- source_word: מַה יּוֹתֵר לֶחָכָם מִן הַכְּסִיל
  choice: 智慧人比愚昧人多得什么呢
  rationale: מַה יּוֹתֵר 表示所多有的收益或优势，מן 标示比较；“多得什么”既保留比较结构，也呼应《传道书》对所得与益处的追问。
- source_word: לֶחָכָם / הַכְּסִיל
  choice: 智慧人／愚昧人
  rationale: 两个单数名词化称谓形成鲜明对照；此译法自然、庄重，并保留原文的代表性单数。
- source_word: מַה לֶּעָנִי
  choice: 穷人……又得了什么呢
  rationale: 原文极为简练，第二问可理解为省略了与前句相应的“所得、优势”概念；“又得了什么”保留省略感，同时使中文完整。
- source_word: עָנִי
  choice: 穷人
  rationale: 本处最自然的是社会经济意义上的贫穷者；该词也可有“受苦、困苦”之意，但上下文不足以要求采用后者。
- source_word: יוֹדֵעַ לַהֲלֹךְ
  choice: 知道怎样……行事
  rationale: הלך 字面为“行走”，也常指生活方式或处世行为；“行事”在现代汉语中清楚传达其习语意义，脚注保留直译。
- source_word: נֶגֶד הַחַיִּים
  choice: 在众人面前
  rationale: נגד 表示“在……面前”，הַחַיִּים 字面为“活着的人”；此处较自然地指人群或社会中的活人。“众人”使中文顺畅，脚注说明字面形式。
theological_decisions:
- issue: 第二问中“穷人”的所得是否明确为“优势”
  choice: 译作“又得了什么”，不明说“优势”
  alternative: “穷人……又有什么优势呢”
  rationale: 原文第二问只有 מַה לֶּעָנִי，语义可能承接首问的“多得、优势”，但并未重复该词；保留较宽泛的“得了什么”可避免把省略内容解释得过满。
- issue: יוֹדֵעַ 所引从句与“穷人”的关系
  choice: 用“即使……又……”表达让步性的反问
  alternative: “知道怎样……的穷人有什么呢”
  rationale: 原文语序容许把“知道怎样行事”视为修饰穷人的分词短语；在整体反问中，让步理解最符合语势，但并非唯一句法分析，因此脚注保留更形式对应的译法。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。首问以“多得什么”保留比较与收益的双重意味；第二问不补出“优势”，以保存原文的简练和潜在歧义。
