id: ECC.6.1
reference: Ecclesiastes 6:1
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: יֵ֣שׁ רָעָ֔ה אֲשֶׁ֥ר רָאִ֖יתִי תַּ֣חַת הַ/שָּׁ֑מֶשׁ וְ/רַבָּ֥ה הִ֖יא עַל הָ/אָדָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/006/001.yaml
  text: 'There is an evil that I have seen under the sun[a], and it is heavy upon man:'
translation:
  language: zh_hans
  text: 有一件祸患，是我在日光之下所见的；它重重压在世人身上[a]：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“这在人间十分普遍”或“这对世人影响很大”。希伯来语可着重表示程度严重，也可能表示范围广泛。
    reason: 保留 רַבָּה הִיא עַל הָאָדָם 在严重程度与普遍范围之间的词义歧义。
lexical_decisions:
- source_word: יֵשׁ
  choice: 有一件
  rationale: 以现代汉语自然的存在句引出传道者所观察到的现象，并与后面的单数名词衔接。
- source_word: רָעָה
  choice: 祸患
  rationale: 该词在本书语境中可指邪恶、灾祸或令人痛苦的坏事；“祸患”保留负面与灾难性的分量，又不把含义限定为道德罪恶。
- source_word: אֲשֶׁר רָאִיתִי
  choice: 是我……所见的
  rationale: 对应关系从句及第一人称完成式，以庄重而自然的汉语表达亲眼观察所得。
- source_word: תַּחַת הַשָּׁמֶשׁ
  choice: 在日光之下
  rationale: 保留《传道书》反复出现的标志性表达，指人世间的生活领域。
- source_word: וְרַבָּה הִיא עַל הָאָדָם
  choice: 它重重压在世人身上
  rationale: רַבָּה 的基本义为“大、多”，与 עַל 连用时可表达严重压在人身上的情形；此译文在汉语中自然地传达其沉重程度，同时用脚注保留“普遍”或“影响很大”的可能理解。
- source_word: הָאָדָם
  choice: 世人
  rationale: 此处为泛指集合意义，所指是一般人类；“世人”既符合现代汉语，也保留经文对人类普遍处境的陈述。
theological_decisions:
- issue: הָאָדָם 的泛指范围
  choice: 世人
  alternative: 人／人类
  rationale: 定冠词单数 אָדָם 在此泛指全体人类，并非特指男性个体；“世人”准确表达其普遍代表意义。
- issue: רַבָּה עַל 所表达的是沉重程度还是普遍范围
  choice: 重重压在……身上
  alternative: 在人间十分普遍／对世人影响很大
  rationale: 希伯来语措辞容许把 רַבָּה 理解为程度严重或数量、范围广大。正文依照 עַל 的表面结构表达沉重压迫感，但不在正文中排除范围广泛的读法，故将其他可能译法列入脚注。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“日光之下”保留本书的核心惯用语；分号呈现观察对象与其严重性的递进关系，句末冒号表明思想在下一节继续。
