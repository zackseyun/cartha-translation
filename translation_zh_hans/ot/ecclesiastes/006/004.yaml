  text: For he comes in vanity and goes in darkness[b][a], and in darkness his name is covered.
translation:
  language: zh_hans
  text: 因为他在虚空中来，又在黑暗中去；他的名字也被黑暗遮盖。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “他的名字被黑暗遮盖”可能表示他的身份无人知晓，也无人记念。
