lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，说明为何死胎的境况反而更好，保留原文的因果或解释作用。
- source_word: הֶבֶל
  choice: 虚空
  rationale: 传道书的主题词，兼有短暂无常、空虚和徒劳之意；“虚空”既延续全书术语一致性，也适合“在虚空中来”的语境。
- source_word: בָּא
  choice: 来
  rationale: 直译其进入世间或存在的动作，并与后面的“去”形成对称。
- source_word: חֹשֶׁךְ
  choice: 黑暗
  rationale: 原文重复两次，既可指幽暗，也可象征无名、无人记念的状态；译文保留重复及其意象。
- source_word: יֵלֵךְ
  choice: 去
  rationale: 与“来”对应，同时不把原文进一步解释为“死去”。
- source_word: שְׁמוֹ
  choice: 他的名字
  rationale: 保留原文“名字”的具体表达，使身份与记忆的含义保持含蓄。
- source_word: יְכֻסֶּה
  choice: 被……遮盖
  rationale: 保留被动形式和覆盖的图像；结合介词短语译作“被黑暗遮盖”，自然而不消解隐喻。
theological_decisions:
- issue: “名字被黑暗遮盖”的含义
  choice: 保留原文意象，不在正文中明确解释
  alternative: 直译为“他的身份或记忆湮没无闻”
  rationale: 原文可能指其身份无人知晓或不被记念，但并未明确限定；正文保留神学和诗意上的含混，脚注提示可能含义。
translation_notes:
  register: 采用庄重、自然的现代汉语。“在虚空中来……在黑暗中去”保留希伯来文简洁而对称的结构；分号呈现末句对前两句的推进。正文中的脚注标记置于相关整句之后。
