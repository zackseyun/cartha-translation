base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/006/005.yaml
  text: Though it has not seen the sun or known anything[b][a], it has more rest than that man.
translation:
  language: zh_hans
  text: 它虽未见过日光，也一无所知[b]，却比那人更得安宁[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“这个比那个更得安宁”。两个指示词分别指前一节所说的未产而死的孩子和前文所说的那个人。
    reason: lexical_alternative
  - marker: b
    text: “见日光”是希伯来语中描述经历今世人生的一种说法。
    reason: cultural_note
lexical_decisions:
- source_word: גַּם
  choice: 虽
  rationale: 结合上下文取让步意味：这个未能经历人生的孩子，反而比那人更安息；“虽”在现代汉语中自然地表达这种张力。
- source_word: שֶׁמֶשׁ
  choice: 日光
  rationale: 保留希伯来文“见日光”的具体意象；在《传道书》中，这一说法指经历世上的人生。
- source_word: לֹא רָאָה
  choice: 未见过
  rationale: 指前一节所说的未能活着出生或早逝的孩子，从未经历世上生活；“未见过”简洁自然。
- source_word: וְלֹא יָדָע
  choice: 也一无所知
  rationale: 原文没有明说宾语，ידע在此宽泛指认知或人生经验；“一无所知”使汉语完整，同时不限定具体所知之事。
- source_word: נַחַת
  choice: 安息
  rationale: 表达安静、休歇的状态，并与那人劳碌而不得享用的处境形成对比。
- source_word: לָזֶה מִזֶּה
  choice: 却比那人更安息
  rationale: 原文直译近于“这个比那个有安息”；根据上下文，“这个”指前述孩子，“那个”指此前所说的富有却不能享福之人。正文适度明示后者，脚注保留原文的指示代词结构。
