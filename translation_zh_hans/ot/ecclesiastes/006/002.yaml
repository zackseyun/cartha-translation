id: ECC.6.2
reference: Ecclesiastes 6:2
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: אִ֣ישׁ אֲשֶׁ֣ר יִתֶּן ל֣/וֹ הָ/אֱלֹהִ֡ים עֹשֶׁר֩ וּ/נְכָסִ֨ים וְ/כָב֜וֹד וְֽ/אֵינֶ֨/נּוּ חָסֵ֥ר לְ/נַפְשׁ֣/וֹ מִ/כֹּ֣ל אֲשֶׁר יִתְאַוֶּ֗ה וְ/לֹֽא יַשְׁלִיטֶ֤/נּוּ הָֽ/אֱלֹהִים֙ לֶ/אֱכֹ֣ל מִמֶּ֔/נּוּ כִּ֛י אִ֥ישׁ נָכְרִ֖י יֹֽאכֲלֶ֑/נּוּ זֶ֥ה הֶ֛בֶל וָ/חֳלִ֥י רָ֖ע הֽוּא־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/006/002.yaml
  text: There is a man to whom God gives riches[a], possessions, and honor, so that he lacks nothing for himself of all that he desires, yet God does not empower him to eat from them, because a foreign man eats them[c][b]. This is vanity and a grievous sickness.
translation:
  language: zh_hans
  text: 有一个人，神赐给他财富、财物和尊荣，以致他凡所想要的，一样也不缺；神却没有使他有能力享用这些，因为一个外来人享用这些。[a]这是虚空[b]，也是一种恶疾。[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “外来人”也可译作“陌生人”或“异乡人”。“享用”原文直译为“从其中吃”。
    reason: 说明 אִישׁ נָכְרִי 的语义范围，并保留 אכל 的具体进食意象。
  - marker: b
    text: “虚空”所译的希伯来词也有“雾气”或“徒然”的含义，是《传道书》的关键词。
    reason: 保留 הֶבֶל 的意象和多义性。
  - marker: c
    text: “恶疾”也可译作“严重的疾病”。
    reason: 反映 חֳלִי רָע 的字面疾病意象及形容词强度。
lexical_decisions:
- source_word: אִישׁ אֲשֶׁר
  choice: 有一个人
  rationale: 希伯来文以不定指单数“一个人”起句；补出“有”符合现代汉语叙述习惯，也保留智慧文学中代表性的个案表达。
- source_word: עֹשֶׁר וּנְכָסִים וְכָבוֹד
  choice: 财富、产业和尊荣
  rationale: 分别表达物质财富、所拥有的财产及社会地位，保留原文三项并列的层次。
- source_word: וְאֵינֶנּוּ חָסֵר לְנַפְשׁוֹ מִכֹּל אֲשֶׁר יִתְאַוֶּה
  choice: 使他心里所想要的，一样也不缺
  rationale: נפש 在这里指人的自身或内在愿望，并非专门论述“灵魂”；此译自然表达他想要的一切都不缺。
- source_word: וְלֹא יַשְׁלִיטֶנּוּ הָאֱלֹהִים
  choice: 神却没有使他有能力
  rationale: 保留 שלט 使役形所含“使之有权能、支配力”的意义，不简化成单纯的许可。
- source_word: לֶאֱכֹל מִמֶּנּוּ
  choice: 享用这些
  rationale: 原文直译是“从其中吃”，在传道书中具体指从财物获益并享受；正文采用自然汉语，直译意象收入脚注。
- source_word: אִישׁ נָכְרִי
  choice: 一个外人
  rationale: “外人”既保留 איש 的单数人物指称，也表达 נכרי 所指不属于本人或其圈子的人，同时避免无根据地限定为某一国籍。
- source_word: זֶה הֶבֶל
  choice: 这是虚空
  rationale: “虚空”是传道书关键词 הבל 的简洁传统译法；脚注保留“雾气、徒然”等语义面向。
- source_word: וָחֳלִי רָע
  choice: 也是一种恶疾
  rationale: חֳלִי 的基本意象是疾病，רָע 表示恶劣、严重；“恶疾”凝练地保留疾病隐喻及负面评价。
theological_decisions:
- issue: לְנַפְשׁוֹ 是否译作“灵魂”
  choice: 心里
  alternative: 为自己的灵魂
  rationale: 本处 נֶפֶשׁ 与人的欲望相连，指本人或其内在愿望；译作“心里”避免把经文变成关于灵魂构成的技术性陈述。
- issue: 神没有使人享用财富的能力
  choice: 没有使他有能力
  alternative: 不准他
  rationale: 原文使役动词强调神没有赋予实际掌控和享用的能力，不仅是法律或意志层面的禁止；译文保留这一张力。
- issue: הֶבֶל 的多义性
  choice: 虚空
  alternative: 雾气；徒然
  rationale: 不将该词只锁定为短暂无常或毫无效果；正文沿用能涵盖多重意味的“虚空”，并以脚注提示其意象与语义范围。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。句式保留原文从神的赐予、人的不缺，到不能享用、外人享用的强烈转折；避免生硬直译，同时通过脚注保存“吃”和“疾病”等具体意象。
