    rationale: 原文 כִּי 表示“因为”：此人不能享用，是因为另一个外来者享用。译作“反而由”强化了转折并改为被动结构，虽大意相关，却弱化了原文明确的因果关系。
  - severity: low
    issue: “产业”对 נְכָסִים 略显狭窄。
    rationale: נְכָסִים 指财产、资产、所有物；“产业”在现代汉语中容易联想到祖业、地产或行业。“财物”较全面地保留其物质拥有物的含义，并与“财富”构成原文的累加。
  - severity: low
    issue: “外人”在现代汉语中有歧义。
    rationale: “外人”常指非家庭成员、局外人，未必表示 נָכְרִי 所含的外来者或外国人意味。改为“外来人”能较少限定地保留该词语义范围。
