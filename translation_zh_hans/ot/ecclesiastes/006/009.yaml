source:
  edition: WLC
  text: ט֛וֹב מַרְאֵ֥ה עֵינַ֖יִם מֵֽ/הֲלָךְ נָ֑פֶשׁ גַּם זֶ֥ה הֶ֖בֶל וּ/רְע֥וּת רֽוּחַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/006/009.yaml
  text: Better is the sight of the eyes than the wandering of the soul[c][b][a]; this too is vapor and a chasing after wind.
translation:
  language: zh_hans
  text: 眼睛所见的，胜过欲望的游移[a]；这也是雾气，也是追逐风[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “欲望的游移”按字面近于“生命（或心灵）的行走／游移”。这里的希伯来词也可指“欲求”或“自我”。
    reason: lexical_alternative
  - marker: b
    text: “追逐风”也可译作“为风劳碌”或“与风争竞”；按词语另一种较字面的理解，或作“牧养风”。
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב ... מִן
  choice: 胜过
  rationale: טוֹב与后面的比较介词מִן构成比较句；译为“胜过”符合现代汉语表达，也保留原文的价值判断。
- source_word: מַרְאֵה עֵינַיִם
  choice: 眼睛所见的
  rationale: מַרְאֶה可指景象、所见之物；这一译法保留“眼睛”的具体意象，同时比生硬的“眼睛的观看”自然。
- source_word: מֵהֲלָךְ נָפֶשׁ
  choice: 欲望四处游荡
  rationale: הֲלָךְ表示行走、游移；נֶפֶשׁ在此很可能指人的欲求或渴望，而非专指非物质的“灵魂”。译文表达欲望不断转向尚未得到之物的动态，但以脚注保留原文歧义。
- source_word: גַּם זֶה
  choice: 这也是
  rationale: 保留传道者反复使用的评断句式，并采用自然的现代汉语。
- source_word: הֶבֶל
  choice: 雾气
  rationale: 保留该词本义中短暂、难以把握的气息或蒸气意象，避免只用抽象的“虚空”而消除原有比喻。
- source_word: וּרְעוּת רוּחַ
  choice: 是追逐风
  rationale: 按本书反复出现的表达译作徒劳追赶不可捕捉之风；汉语简洁自然，也保留原文意象。
theological_decisions:
- issue: נֶפֶשׁ在本节所指为何
  choice: 正文译为“欲望”
  alternative: “心灵”“生命”“自我”
  rationale: 上下文谈论人的欲求不能满足，故“欲望”最切合语境；但נֶפֶשׁ语义宽广，脚注明确保留其他理解，避免把后期灵魂观强加于经文。
- issue: הֶבֶל应译作抽象判断还是具体比喻
  choice: 正文译为“雾气”
  alternative: “虚空”“气息”
  rationale: 具体意象能同时承载短暂、无常、难以掌握等含义，不把传道者的复杂评断缩减为单一的“毫无意义”。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。前半句保留“眼睛所见”与内在欲求游移之间的具体对照；后半句以“雾气”和“追逐风”保存传道书连续而开放的意象，不用传统术语预先限定其含义。
