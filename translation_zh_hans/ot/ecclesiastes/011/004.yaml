  text: שֹׁמֵ֥ר ר֖וּחַ לֹ֣א יִזְרָ֑ע וְ/רֹאֶ֥ה בֶ/עָבִ֖ים לֹ֥א יִקְצֽוֹר׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/011/004.yaml
  text: Whoever watches the wind will not sow[a], and whoever looks at the clouds will not reap.
translation:
  language: zh_hans
  text: 留意风的人不会撒种[a]，观看云彩的人不会收割。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“观察风的人不撒种，看云彩的人不收割。”
    reason: 词汇和体貌表达上的另一种译法；“观察”更直接对应持续察看，而“不撒种／不收割”也可表达箴言式的一般事实。
lexical_decisions:
- source_word: שֹׁמֵר
  choice: 留意
  rationale: 该分词指持续察看、密切注意的人。“留意”保留这种习惯性关注，又避免“看守”所带有的保护意味。
- source_word: רוּחַ
  choice: 风
  rationale: 撒种、云彩和收割共同构成农业与天气的语境，因此这里采用气象意义“风”，不取“灵”或“气息”。
- source_word: יִזְרָע
  choice: 不会撒种
  rationale: 未完成体在此表达箴言式的一般结果；“不会”自然传达因持续留意天气而不采取行动的结果。
- source_word: וְרֹאֶה
  choice: 观看
  rationale: 分词与前句的 שֹׁמֵר 平行，表示泛指、持续察看的人；“观看”既贴近“看见/看”，又与前句“留意”略作区分。
- source_word: בֶעָבִים
  choice: 云彩
  rationale: 介词 ב 与视觉动词连用时，汉语无需另译介词；“云彩”准确保留天气意象，也符合现代普通话。
- source_word: יִקְצוֹר
  choice: 不会收割
  rationale: 该词意为收割庄稼；“收割”与“撒种”构成清楚的农业对应，“不会”同样表达一般性的结果。
theological_decisions: []
translation_notes:
  register: 采用简洁、对称的现代标准普通话，保持原文的农业意象和箴言语气；不加入“只顾”“等待合适时机”等解释性措辞，以免把经文本身含蓄的劝诫说得过明。
