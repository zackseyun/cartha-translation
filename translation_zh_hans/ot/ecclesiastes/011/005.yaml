base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/011/005.yaml
  text: Just as you do not know the way of the wind[a], or how the bones form in the womb of a pregnant woman, so you do not know the work of God[b], who makes everything.
translation:
  language: zh_hans
  text: 正如你不知道风的行踪[a]，也不知道骨头如何在孕妇腹中形成[b]，同样，你也不知道那成就万有之上帝的作为。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “风”所译的希伯来语也可指“气息”或“灵”；“风的行踪”也可译为“气息的运行”或“灵的道路”。
    reason: 保留רוּחַ的词义歧义，并说明“道路／行踪”对דֶּרֶךְ的表达。
  - marker: b
    text: 希伯来语字面为“在那充满者的腹中”，指怀孕妇人的腹中。
    reason: 说明原文习语及正文采用自然中文表达的依据。
lexical_decisions:
- source_word: דֶּרֶךְ הָרוּחַ
  choice: 风的路径
  rationale: דֶּרֶךְ意为“道路、路径”，רוּחַ在此可指“风、气息、灵”。上下文以人无法洞悉受造界的隐秘过程为喻，因此正文采用“风”，同时在脚注保留其他可能。
- source_word: כַּעֲצָמִים
  choice: 也不知道骨骼怎样……形成
  rationale: 希伯来语表达简略，字面近于“如同骨骼”。中文若照字直译会晦涩，因此补出语境所含的“怎样形成”，使其与“不知道”自然衔接，而不额外说明形成机制。
- source_word: בְּבֶטֶן הַמְּלֵאָה
  choice: 在孕妇腹中
  rationale: 字面为“在那充满者的腹中”，在本句中是指怀有胎儿的妇人；译作“孕妇腹中”符合现代汉语习惯并准确表达所指。
- source_word: מַעֲשֵׂה הָאֱלֹהִים
  choice: 上帝有何作为
  rationale: מַעֲשֵׂה表示所做之事或作为。“有何作为”既自然，又保留本节强调人不能洞悉上帝工作的含义。
- source_word: אֲשֶׁר יַעֲשֶׂה אֶת־הַכֹּל
  choice: 那位成就万事的上帝
  rationale: 关系从句最自然地修饰“上帝”，יַעֲשֶׂה可指做成、成就，אֶת־הַכֹּל表示一切、万事。“成就万事”保留其涵盖一切的力度，也符合庄重而现代的中文表达。
theological_decisions:
- issue: 本节רוּחַ的含义
  choice: 风
  alternative: 气息；灵；或把相关短语理解为胎儿的气息如何临到骨骼
  rationale: “风”与本节所列人不能掌握的自然奥秘最相称，也避免在正文中引入经文未明确要求的圣灵论或人论解释。不过רוּחַ本身确有“气息”与“灵”的语义，且句法简略，故在脚注中保留这种真实歧义。
- issue: 上帝与“万事”的关系
  choice: 那位成就万事的上帝
  alternative: 上帝所做的一切工作
  rationale: 关系从句可自然理解为以上帝为主语、以“万事”为宾语；正文依此翻译，但不进一步界定“万事”在神学上的范围或方式。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“正如……同样……”保留原文比较结构；“路径”“作为”“成就万事”维持智慧文学的凝练语气。正文不消除רוּחַ的词义歧义，相关可能读法置于脚注。
