id: ECC.11.10
reference: Ecclesiastes 11:10
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/הָסֵ֥ר כַּ֨עַס֙ מִ/לִּבֶּ֔/ךָ וְ/הַעֲבֵ֥ר רָעָ֖ה מִ/בְּשָׂרֶ֑/ךָ כִּֽי הַ/יַּלְד֥וּת וְ/הַֽ/שַּׁחֲר֖וּת הָֽבֶל־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/011/010.yaml
  text: So remove vexation from your heart, and put away harm from your flesh, for youth and the dawn of life are vapor.
translation:
  language: zh_hans
  text: 所以，要除掉你心中的烦恼，也要使你的身体远离祸患，因为青春和人生的黎明都是虚空。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כַּעַס
  choice: 烦恼
  rationale: 该词可指恼怒、忧愁或烦扰；本节语境是劝年轻人除去内心的困扰，译为“烦恼”既自然，也保留较宽的语义范围。
- source_word: רָעָה
  choice: 祸患
  rationale: 阴性名词在此可表示邪恶、痛苦、伤害或灾祸。与“身体”搭配时，“祸患”比道德性的“邪恶”更贴合，同时不把含义缩限为疾病。
- source_word: בָּשָׂר
  choice: 身体
  rationale: 字面为“肉体”；现代汉语中“身体”更自然，并与前句的“心”形成内在与外在的对应。
- source_word: הַיַּלְדוּת
  choice: 青春
  rationale: 该词指童年、少年或年轻时期；本段直接劝告青年人，译为“青春”符合语境并保持凝练。
- source_word: הַשַּׁחֲרוּת
  choice: 人生的黎明
  rationale: 这是罕见词，可能与“黎明、黑发、青春活力”相关。采用“人生的黎明”保留其诗性和对生命早期的指向，但不声称词源争议已经解决。
- source_word: הָבֶל
  choice: 虚空
  rationale: 本书关键词，字面意象是气息、雾气或蒸汽，并可引申为短暂、难以把握。“虚空”延续全书术语一致性，同时此处也含青春转瞬即逝之意。
theological_decisions:
- issue: רָעָה是道德之恶还是临到身体的伤害
  choice: 译作“祸患”，理解为应当避开的身体伤害、痛苦或灾祸
  alternative: 译作“邪恶”或“痛苦”
  rationale: 原词本身具有宽广语义，而“从你的身体除去”的搭配更偏向有害后果；“祸患”保留其负面和灾害性质，不额外引入禁欲主义解释。
- issue: הָבֶל在此强调无意义还是短暂易逝
  choice: 正文保留“虚空”，让全书关键词的多重张力继续存在
  alternative: 译作“转瞬即逝”或“如雾气”
  rationale: 本节显然涉及青春的短暂，但该词在传道书中也表达难以掌控、无法持久和令人困惑；不宜只固定为单一解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“除掉你心中的烦恼”较贴近希伯来语命令式；“使你的身体远离祸患”自然呈现第二个使役命令。末句保留诗性表达和传道书核心术语。
