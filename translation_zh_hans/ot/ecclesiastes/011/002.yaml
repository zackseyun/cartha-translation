base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/011/002.yaml
  text: Give a portion to seven[a], and even to eight, for you do not know what disaster will happen on the earth.
translation:
  language: zh_hans
  text: 要分给七人，甚至八人，因为你不知道地上[a]会发生什么灾祸。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “地上”也可译作“土地上”。希伯来语 אֶרֶץ 可指大地，也可指某一地域。
    reason: lexical_alternative
lexical_decisions:
- source_word: תֶּן
  choice: 要分给
  rationale: 这是נתן的第二人称阳性单数祈使式；结合חֵלֶק及多个接受者，用“要分给”自然表达劝勉和分配之意。
- source_word: חֵלֶק
  choice: 分（隐含“一份”）
  rationale: חֵלֶק指份额或一份；汉语“分给七人”已经自然包含把份额分出的意思，避免生硬的“给一份给七人”。
- source_word: לְשִׁבְעָה וְגַם לִשְׁמוֹנָה
  choice: 给七人，甚至八人
  rationale: 保留原文从七到八的递进数字格式；依语境补出量词“人”，使现代汉语清楚自然，同时不把该修辞直接意译为“许多人”。
- source_word: כִּי
  choice: 因为
  rationale: 引出前述劝勉的理由。
- source_word: לֹא תֵדַע
  choice: 你不知道
  rationale: 直接保留否定式所表达的未知，不强化为“你无法知道”。
- source_word: מַה יִּהְיֶה
  choice: 会发生什么
  rationale: היה在这里指将来的发生，以现代汉语事件表达最自然。
- source_word: רָעָה
  choice: 灾祸
  rationale: 此处指有害的境遇或灾难，而非道德意义的邪恶；“灾祸”兼具准确性和庄重感。
- source_word: עַל הָאָרֶץ
  choice: 地上
  rationale: אֶרֶץ可指大地或特定土地；“地上”在正文中保留较广范围，另以脚注注明“这地”的可能。
theological_decisions:
- issue: הָאָרֶץ的范围
  choice: 地上
  alternative: 这地／这片土地上
  rationale: 传道书在此作普遍性的智慧劝勉，广义的“地上”较合语境；但希伯来词也可指特定地域，因此保留脚注中的词义选择。
- issue: “七……八”的含义
  choice: 保留数字递进格式
  alternative: 分给许多人／广为分散
  rationale: 该数字格局可能暗示充足之外再有增加，也可能强调广泛分配；正文不把其修辞功能固定为单一解释。
translation_notes:
  register: 采用现代、简洁而庄重的劝诫语体。“要分给”比逐字的“给一份”更符合汉语分配语境；保留“七人，甚至八人”的原文修辞，不作解释性改写。脚注标记置于相关分句末。
