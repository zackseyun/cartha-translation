id: ECC.11.8
reference: Ecclesiastes 11:8
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כִּ֣י אִם שָׁנִ֥ים הַרְבֵּ֛ה יִחְיֶ֥ה הָ/אָדָ֖ם בְּ/כֻלָּ֣/ם יִשְׂמָ֑ח וְ/יִזְכֹּר֙ אֶת יְמֵ֣י הַ/חֹ֔שֶׁךְ כִּֽי הַרְבֵּ֥ה יִהְי֖וּ כָּל שֶׁ/בָּ֥א הָֽבֶל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/011/008.yaml
  text: For if a man lives many years[a], let him rejoice in them all; but let him remember the days of darkness, for they will be many. All that comes is vapor.
translation:
  language: zh_hans
  text: 人若活许多年，就当在所有这些年日中喜乐；却要记住黑暗的日子，因为这样的日子必多。一切将临的事，都是虚空[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “虚空”所译的希伯来语也可译作“雾气”或“气息”。这是《传道书》中反复出现的关键词，形容事物短暂、虚浮、难以捉摸；传统常译作“虚空”。
    reason: 说明 הָבֶל 的具体意象、语义范围及传统译法，防止读者把它过度理解为“毫无意义”。
lexical_decisions:
- source_word: כִּי אִם
  choice: 人若
  rationale: 该组合在此引出带有说明意味的条件句。汉语以“若”自然表达条件；前面的因果连接不宜机械译作“因为”，以免句首生硬。
- source_word: שָׁנִים הַרְבֵּה
  choice: 许多年
  rationale: 直接指长久的寿命；“许多年”准确、自然，并保留数量上的概括。
- source_word: הָאָדָם
  choice: 人
  rationale: 此处单数名词作泛指，所论适用于一般人类；现代汉语“人”既保持单数泛指功能，也不额外限定为男性。
- source_word: בְּכֻלָּם
  choice: 在这一切年日中
  rationale: 代词回指前面的“许多年”。补出“年日”使汉语指代清楚，同时保留介词所表达的时间范围。
- source_word: יִשְׂמָח
  choice: 就当……喜乐
  rationale: 未完成式在语境中带劝勉意味；“就当”比单纯将来式更能传达劝告语气。
- source_word: וְיִזְכֹּר
  choice: 却要记住
  rationale: 连接词形式上是“和”，但上下文构成转折：享受长寿的同时不可忘记黑暗的日子。“却”自然呈现这种张力。
- source_word: יְמֵי הַחֹשֶׁךְ
  choice: 黑暗的日子
  rationale: 保留原文诗性隐喻，不把它限定为患难、衰老、死亡或阴间中的任何一种解释。
- source_word: כִּי הַרְבֵּה יִהְיוּ
  choice: 因为这样的日子必多
  rationale: 该分句说明为何必须记住黑暗的日子；补出“这样的日子”可避免汉语代词含混。“必多”保留预期将来的语气。
- source_word: כָּל שֶׁבָּא
  choice: 凡将要来的
  rationale: 保留原文广泛、概括性的表达以及分词所具有的趋向或将来意味，不擅自把所指缩窄为某类事件。
- source_word: הָבֶל
  choice: 虚空
  rationale: “虚空”是汉语《传道书》中辨识度较高的关键词，也能表达空泛、短暂和难以把握；脚注补明其具体意象为气息或雾气，避免将其误解为单纯“毫无意义”。
theological_decisions:
- issue: הָאָדָם 的泛指范围
  choice: 人
  alternative: 男人／一个人／世人
  rationale: 原文阳性单数在此是代表性、泛指用法，并非特指男性。汉语“人”忠实保留普遍适用范围，又无需添加原文没有的性别限定。
- issue: “黑暗的日子”的所指
  choice: 保留隐喻，不加解释
  alternative: 患难的日子／衰老之日／死亡与坟墓中的日子
  rationale: 语境容许患难、衰老和死亡等彼此重叠的理解；正文不应只选其中一种而消除原有含混与张力。
- issue: הָבֶל 的神学与文学含义
  choice: 虚空
  alternative: 雾气／气息／虚幻／毫无意义
  rationale: 避免译成“毫无意义”，因为该词首先是短暂、无定形、难以掌握的具体意象，并不必然断言万事绝对没有意义。以“虚空”维持全书关键词的文学连贯性，并用脚注交代意象。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“喜乐”“虚空”保留智慧文学语体与全书关键词的辨识度；句式清晰，不以解释性措辞消除原文对喜乐与黑暗、长寿与短暂之间的张力。
