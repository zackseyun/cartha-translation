base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/011/006.yaml
  text: In the morning sow your seed[a], and in the evening do not let your hand rest, for you do not know which will succeed, this or that[b], or whether both alike will be good.
translation:
  language: zh_hans
  text: 早晨要撒下你的种子，晚上也不要让你的手歇着[a]，因为你不知道哪一样会成功[b]：是这个还是那个，还是两样都同样好。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “不要让你的手歇着”原文直译如此，是指不要停下手中的工作。
    reason: cultural_note
  - marker: b
    text: “成功”也可译作“顺利”或“有成效”。
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּבֹּקֶר
  choice: 早晨
  rationale: 保留时间短语，并与后文“晚上”形成平衡的对句。
- source_word: זְרַע אֶת זַרְעֶךָ
  choice: 撒下你的种
  rationale: 保留动词与名词之间“撒种—种子”的农业意象；“撒下”在现代汉语中自然，也不把本节的广泛智慧应用限定为某一种工作。
- source_word: וְלָעֶרֶב
  choice: 晚上也
  rationale: “晚上”与“早晨”对应；用“也”自然表达希伯来文连接词在此处所含的持续、并行动作。
- source_word: אַל תַּנַּח יָדֶךָ
  choice: 不要让你的手歇着
  rationale: 贴近原文具体意象，同时现代读者也能理解为不要停止劳作；脚注说明其惯用含义。
- source_word: כִּי אֵינְךָ יוֹדֵעַ
  choice: 因为你不知道
  rationale: 明确保留劝告与理由之间的因果关系。
- source_word: אֵי זֶה יִכְשָׁר
  choice: 哪一样会成功
  rationale: אֵי זֶה 在两个可能性之间询问“哪一个”；יִכְשָׁר 表示取得成效、进展顺利，译作“成功”简洁自然。
- source_word: הֲזֶה אוֹ זֶה
  choice: 是这个还是那个
  rationale: 保留两个未具体说明的行动或结果之间的开放性对比。
- source_word: וְאִם שְׁנֵיהֶם כְּאֶחָד טוֹבִים
  choice: 还是两样都同样好
  rationale: 保留另一种可能：并非只有一个成功，而是两者都好；“同样”对应 כְּאֶחָד，不强行说明两者究竟指什么。
theological_decisions: []
