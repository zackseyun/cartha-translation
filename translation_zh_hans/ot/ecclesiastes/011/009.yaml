  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: שְׂמַ֧ח בָּח֣וּר בְּ/יַלְדוּתֶ֗י/ךָ וִֽ/יטִֽיבְ/ךָ֤ לִבְּ/ךָ֙ בִּ/ימֵ֣י בְחוּרוֹתֶ֔/ךָ וְ/הַלֵּךְ֙ בְּ/דַרְכֵ֣י לִבְּ/ךָ֔ וּ/בְ/מַרְאֵ֖י עֵינֶ֑י/ךָ וְ/דָ֕ע כִּ֧י עַל כָּל אֵ֛לֶּה יְבִֽיאֲ/ךָ֥ הָ/אֱלֹהִ֖ים בַּ/מִּשְׁפָּֽט־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/011/009.yaml
  text: Rejoice[a], young man, in your youth, and let your heart cheer you in the days of your young manhood. Walk in the ways of your heart and in the sight of your eyes[d][c][b], but know that for all these things God will bring you into judgment.
translation:
  language: zh_hans
  text: 年轻人啊，要在你年少时喜乐；在青春的日子，愿你的心使你欢畅。要行在你心所向的道路上，也随你眼目所见的而行[a]；但要知道，神必使你因这一切接受审判。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “眼目所见”直译为“你眼睛所见的景象”或“显现在你眼前的事物”。
    reason: lexical_alternative
  - marker: b
    text: 本节把享受青春与在神面前承担责任并置。前面的命令既可看作受审判警告所限定的许可，也可读作带有警戒意味的劝勉；原文没有明说这些命令是反讽。
    reason: alternative_reading
lexical_decisions:
- source_word: שְׂמַח
  choice: 喜乐
  rationale: 译出Qal命令式的主动劝勉，也与《传道书》中享受生命的主题相称。
- source_word: בָּחוּר
  choice: 年轻人
  rationale: 原文为阳性单数名词，直接称呼男性青年；此译法准确保留其性别和称呼语气。
- source_word: בְּיַלְדוּתֶיךָ
  choice: 在你年少时
  rationale: 在本语境中指年少时期，并非仅指幼年；现代汉语表达自然。
- source_word: וִיטִיבְךָ לִבְּךָ
  choice: 让你的心使你欢畅
  rationale: 保留יטב使役形的致使意义，并保留“你的心”作主语，而不简化为单纯的“心里快乐”。
- source_word: בִּימֵי בְחוּרוֹתֶךָ
  choice: 在青春的日子
  rationale: 表达年轻而有活力的人生阶段，并与前句“年少时”形成有变化的平行表达。
- source_word: וְהַלֵּךְ
  choice: 而行
  rationale: 保留הלך以“行走”喻生活行为的圣经性隐喻；结合“道路”译为“按……道路而行”。
- source_word: בְּדַרְכֵי לִבְּךָ
  choice: 按你心所向的道路
  rationale: 保留“心”和“道路”的意象，同时用“所向”使现代汉语读者明白这里涉及内心的意愿和趋向。
- source_word: וּבְמַרְאֵי עֵינֶיךָ
  choice: 照你眼中所见的
  rationale: מַרְאֶה可指所见、景象或呈现于眼前之物；正文采用自然中文，并以脚注提示更贴近字面的表达。
- source_word: וְדָע
  choice: 但要知道
  rationale: וְ形式上是连接词；此处语篇功能引入制衡性的警告，译作“但”能自然呈现转折，同时不抹去前面的真实命令。
- source_word: עַל כָּל אֵלֶּה
  choice: 为这一切
  rationale: 在审判语境中表示就这些事承担责任；“为这一切”简洁且保留所指范围可能涵盖前述一切行为的特点。
- source_word: יְבִיאֲךָ הָאֱלֹהִים בַּמִּשְׁפָּט
  choice: 神必带你受审判
  rationale: 保留使役动词“带你进入”的司法方向，同时以自然中文“带你受审判”表达神使人面对审判。
theological_decisions:
- issue: 本节是在许可年轻人享乐，还是以反讽警告放纵
  choice: 正文同时保留真切的喜乐命令与神审判的警告，不替读者消解二者的张力。
  alternative: 可将前半读作反讽，主要意在谴责年轻人的任性；也可读作真诚鼓励享受生命，而审判构成道德边界。
  rationale: 希伯来文的命令式本身没有明确标示反讽；《传道书》也常把享受生命与向神负责并置。因此不把前半弱化为讥讽，也不把它扩大为不受约束的许可。
- issue: 称呼对象的性别
  choice: 译作“年轻人”，保留原文阳性单数称呼。
  alternative: 可概括译作“青年人”或“年轻的人”，但会弱化原文明确的男性单数形式。
  rationale: בָּחוּר及随后的第二人称词尾均为阳性单数，准确翻译应予保留。
- issue: 连接词וְ在“要知道”前的关系
  choice: 译作“但要知道”，显出后句对前述劝勉的制衡。
  alternative: 可形式对应为“也要知道”，让读者自行判断逻辑关系。
  rationale: “但”符合中文语篇中的转折功能，却不把前后命题处理为彼此否定；享受与问责仍同时成立。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“年轻人啊”保留直接呼告；“心所向的道路”兼顾希伯来语意象与中文可读性。正文避免古奥的“少壮之日”等表达，也不以道德化增译预先裁定本节的张力。
