base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/011/003.yaml
  text: If the clouds are full of rain[a], they pour it out on the earth; and if a tree falls to the south or to the north, in the place where the tree falls, there it will lie.
translation:
  language: zh_hans
  text: 云若充满雨水，就把雨倾倒在地上；树若倒向南边，或倒向北边，树倒在什么地方，就会在那里。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或直译：“就在那里。”希伯来文的动词只表示“是／在”；按倒下之树的语境，正文译作“就会在那里”。
    reason: lexical_alternative
lexical_decisions:
- source_word: יִמָּלְאוּ
  choice: 满了
  rationale: 该词为 מלא 的尼法勒未完成式，在条件句中表示达到充满的状态；“满了”自然简洁，并保留动态与结果状态。
- source_word: הֶעָבִים
  choice: 云
  rationale: עבים 在天气语境中指云；现代汉语用“云”比“云彩”更凝练庄重。
- source_word: גֶּשֶׁם
  choice: 雨水
  rationale: 作为“充满”的内容，译作“雨水”符合汉语搭配“云满了雨水”，也明确指云中所含之雨。
- source_word: יָרִיקוּ
  choice: 倾倒
  rationale: ריק 的使役式表示倒空、倾出；“倾倒”保留云把所盛之雨倾出的形象，宾语可由上文自然领会。
- source_word: עַל הָאָרֶץ
  choice: 在地上
  rationale: ארץ 此处泛指地面或大地；“在地上”符合降雨语境，且不将其限缩为某一片土地。
- source_word: יִפּוֹל עֵץ
  choice: 树若倒
  rationale: 未完成式置于条件结构中表达一般可能发生的情形；汉语用“若倒”自然呈现箴言式条件。
- source_word: בַּדָּרוֹם
  choice: 倒向南边
  rationale: 与 נפל 连用时宜理解为树倒落的方向；补出“倒向”使汉语方向关系清楚。
- source_word: בַּצָּפוֹן
  choice: 倒向北边
  rationale: 与前句平行，保留南北两种方向的对举。
- source_word: מְקוֹם שֶׁיִּפּוֹל הָעֵץ
  choice: 倒在哪里
  rationale: 希伯来文直陈“树倒下的地方”；汉语压缩为“倒在哪里”而不损失地点意义，并避免重复累赘。
- source_word: שָׁם יְהוּא
  choice: 就会留在哪里
  rationale: 原文动词只是“是、在”；就倒下的树而言，“留在”自然表达其结果状态，同时用脚注保留较直译的可能。
