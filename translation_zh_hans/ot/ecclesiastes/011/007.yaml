  yaml_path: translation/ot/ecclesiastes/011/007.yaml
  text: And the light is sweet[b][a], and it is good for the eyes to see the sun.
translation:
  language: zh_hans
  text: 光是甜美的[a]；看见太阳，对眼睛也很好[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “甜美”也可译作“令人愉悦”；原文用“甜”比喻光带给人的愉悦。
    reason: lexical_alternative
  - marker: b
    text: “看见太阳”是直译，也可含蓄地指活着并享受世间的生活。
    reason: cultural_note
lexical_decisions:
- source_word: וּמָתוֹק
  choice: 甘美
  rationale: מָתוֹק本义为“甜”，也可比喻令人愉悦；“甘美”既保留甜美的具体隐喻，又符合现代中文的庄重诗意。
- source_word: הָאוֹר
  choice: 光
  rationale: 定冠词所指的是可见、赐人愉悦的光；中文通常无需以“这光”机械表达冠词。
- source_word: וְטוֹב
  choice: 美好
  rationale: טוֹב语义宽泛，可指好、愉悦或有益；“美好”在此自然表达视觉经验所带来的愉悦，同时不将含义缩窄为单纯“舒服”。
- source_word: לָעֵינַיִם
  choice: 眼睛
  rationale: 介词ל表示关联或受益对象。采用“眼睛得见……也是美好的”重组句式，在自然中文中保留“对眼睛而言是好事”的意思。
- source_word: לִרְאוֹת
  choice: 得见
  rationale: ראה的不定式意为“看见”。“得见”简洁自然，并略微体现能够看见太阳是一种可喜的经历，而未额外加入原文没有的解释。
- source_word: אֶת־הַשָּׁמֶשׁ
  choice: 太阳
  rationale: 这是带定冠词的直接宾语“太阳”。正文保留具体的太阳意象，不将其释义为“人生”或“活着”。
theological_decisions:
- issue: 是否在正文中明确“看见太阳”所暗示的活着并享受尘世生命
  choice: 正文保留具体表达“得见太阳”
  alternative: 译作“享受人生”或“活着见到阳光”
  rationale: 这句话可引发对活着和享受尘世生命的联想，但希伯来文的表达具体而富有诗意。保留太阳意象，既不压缩其含义，也不把一种合理的语境推论变成唯一解释。
translation_notes:
  register: 采用现代、简洁而庄重的中文，并保留希伯来诗句中“光是甘美的”和“看见太阳”的具体意象。将后半句调整为自然汉语语序，避免生硬的“对眼睛是好的”，同时未消除原文中感官愉悦与生命体验之间的张力。
