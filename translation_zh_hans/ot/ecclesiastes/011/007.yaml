- from: 光本是甘美的[a]，眼睛得见太阳，也是美好的[b]。
  to: 光是甜美的[a]；看见太阳，对眼睛也很好[b]。
  rationale: 修订删除原文未表达的“本是”，并以更自然、明确的现代汉语重现后半句的“对眼睛而言，看见太阳是好的”。“甜美”“光”“太阳”保留原文具体而诗性的意象；脚注继续将生命意涵作为可能的含蓄联想，而不置入正文。
