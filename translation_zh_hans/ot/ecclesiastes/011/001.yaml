  yaml_path: translation/ot/ecclesiastes/011/001.yaml
  text: Cast your bread upon the surface of the waters, for after many days you will find it.
translation:
  language: zh_hans
  text: 把你的粮食撒在水面上[a]，因为过了许多日子，你必会找到它。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“把你的粮食送到水面上。”这个希伯来语意象可能指慷慨施予、经营投资，或兼有两者之意；正文保留其比喻说法。
    reason: 词义备选及比喻歧义
lexical_decisions:
- source_word: שַׁלַּח
  choice: 撒
  rationale: 该命令式基本义为“送出、放出”；与粮食和水面构成意象时，“撒”在现代汉语中自然鲜明，又不把比喻限定为施舍或经商。
- source_word: לַחְמְךָ
  choice: 你的粮食
  rationale: לֶחֶם可指面包，也可泛指食物或粮食。此处“粮食”既保留具体物象，也比“面包”更适合与“撒在水面上”的古代智慧文学意象相连，但不将其具体化为谷种。
- source_word: עַל פְּנֵי הַמָּיִם
  choice: 在水面上
  rationale: פְּנֵי直指“面、表面”；“水面上”准确而自然地传达希伯来语意象。汉语无需用复数形式表达הַמָּיִם。
- source_word: כִּי
  choice: 因为
  rationale: 此处引出前述命令的理由；“因为”在现代汉语中清楚自然。
- source_word: בְרֹב הַיָּמִים
  choice: 过了许多日子
  rationale: 保留“许多日子”的具体时间表达以及延后回报的含义，不改写为较抽象的“很久以后”。
- source_word: תִּמְצָאֶנּוּ
  choice: 你必能找回它
  rationale: 动词基本义为“找到”，阳性单数后缀自然回指לֶחֶם。“找回”在汉语中能表达先送出、后来再得着的语境；“必能”传达未完成式在箴言式陈述中的预期结果，而不进一步解释回报的性质。
theological_decisions:
- issue: 本节比喻的具体所指
  choice: 正文保留把粮食撒在水面上的比喻，不限定为慷慨施舍、商业投资或冒险行动。
  alternative: 可解释为鼓励慷慨，也可解释为鼓励商业经营或承担风险。
  rationale: 希伯来文本本身没有明说其应用，意象容许多种理解；翻译应保存这种开放性，不把某一解释写入正文。
translation_notes:
  register: 采用现代、庄重而易懂的智慧文学语体。“撒”“水面”“许多日子”保留原文的具体意象；脚注说明可能含义而不替正文作定论。
