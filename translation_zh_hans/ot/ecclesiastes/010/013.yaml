  text: The beginning of the words of his mouth is foolishness[a], and the end of his speech is evil madness.
translation:
  language: zh_hans
  text: 他口中所说的话，开头是愚昧；到末尾则是邪恶的疯狂。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “邪恶的疯狂”或译“有害的疯狂”。原文两次直译均为“他的口”；רָעָה既可指“邪恶”，也可较广义地指“有害、带来祸患”。
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּחִלַּת דִּבְרֵי פִיהוּ
  choice: 他开口说的，起初
  rationale: 原文直译近于“他口中话语的开端”。译作“他开口说的，起初”保留“口”的意象及起初与末了的对称，同时符合现代汉语表达。
- source_word: סִכְלוּת
  choice: 愚昧
  rationale: 此词表示愚拙、愚昧，与《传道书》中智慧和愚昧的对照相符；“愚昧”庄重而易懂。
- source_word: וְאַחֲרִית פִיהוּ
  choice: 他说到末了
  rationale: 原文再次使用“他的口”，表达他话语的末尾或最终走向。汉语不宜直译为“他口的末了”，故以自然措辞传达重复的言语意象，并与“起初”对应。
- source_word: הוֹלֵלוּת
  choice: 疯狂
  rationale: 该词在《传道书》中常指失去理性的狂妄或疯狂；这里较前面的“愚昧”语气加重，因此译为“疯狂”。
- source_word: רָעָה
  choice: 邪恶的
  rationale: 该形容词可指道德上的恶，也可指造成祸害、有害。正文采用“邪恶的”保留其强烈的道德色彩，脚注列出“害人的”这一语义可能。
