base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/010/008.yaml
  text: Whoever digs a pit will fall into it[b][a], and whoever breaks through a wall will be bitten by a snake.
translation:
  language: zh_hans
  text: 挖坑的，必掉进坑里；破开墙垣[a]的，蛇必咬他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “墙垣”也可指篱笆或划定边界的围墙；在古代环境中，这类屏障可以是石砌的。
    reason: cultural_note
lexical_decisions:
- source_word: חֹפֵר
  choice: 挖坑的
  rationale: Qal主动分词在箴言语境中泛指任何做这事的人；“挖坑的”简洁自然，并保留泛指意味。
- source_word: גּוּמָּץ
  choice: 坑
  rationale: 指挖出的坑穴，也可能带有陷阱性质；“坑”最符合现代汉语中的箴言表达。
- source_word: בּוֹ יִפּוֹל
  choice: 必掉进坑里
  rationale: 介词短语直指前面的坑；汉语以“掉进坑里”自然表达落入自己所挖之坑的结果。未添加原文没有明说的“自己”。
- source_word: וּפֹרֵץ
  choice: 拆开的
  rationale: 该分词同样具有泛指作用。פרץ在此指破开或拆开屏障；“拆开”比单纯“拆毁”更能涵盖在墙上打开缺口的意思。
- source_word: גָּדֵר
  choice: 围墙
  rationale: 可指墙或围篱，在古代语境中常是划定边界的石墙；“围墙”既保留实体屏障的意象，也适合现代汉语。
- source_word: יִשְּׁכֶנּוּ
  choice: 必咬他
  rationale: נשך意为“咬”，宾语后缀回指拆墙的人；“他”保留希伯来语的明确回指。
- source_word: נָחָשׁ
  choice: 蛇
  rationale: 这是该词最直接、最通行的现代汉语对应词，不额外限定为毒蛇。
