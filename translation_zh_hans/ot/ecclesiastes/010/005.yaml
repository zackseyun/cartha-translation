base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/010/005.yaml
  text: 'There is an evil I have seen under the sun[a], like an error that goes out from before the ruler:'
translation:
  language: zh_hans
  text: 我在日光之下看见一件恶事，仿佛是一个从统治者面前传出来的错误[a]：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“像一个从统治者面前发出的过失。”希伯来语此处的“过失”可指实际无心造成的错误；在本句的比较表达中，也可理解为某事看来像是这样的错误。
    reason: 词义与比较句法容许不同理解，需保留该事是否实际属于无心之失的歧义。
lexical_decisions:
- source_word: יֵשׁ
  choice: 有一件
  rationale: 以自然的汉语存在句引出传道者所观察到的现象，并与后面的“恶事”搭配。
- source_word: רָעָה
  choice: 恶事
  rationale: 保留该词兼具道德负面与祸害意味的宽泛语义，不把它限缩为单纯的灾祸或行政错误。
- source_word: רָאִיתִי
  choice: 我见
  rationale: 简洁表达传道者亲自观察所得；在现代汉语中也适合本书反思性的叙述语气。
- source_word: תַּחַת הַשָּׁמֶשׁ
  choice: 日光之下
  rationale: 这是《传道书》的标志性表达，准确、凝练，也为现代读者所熟悉。
- source_word: כִּשְׁגָגָה
  choice: 仿佛是……过失
  rationale: כְּ 表示比拟，שְׁגָגָה 可指无意的错误或过失；“仿佛”保留其比较意味，也不武断认定此事确实出于无心。
- source_word: שֶׁיֹּצָא
  choice: 发出的
  rationale: 对应“出去、发出”的动态意象，同时以自然汉语表达某事由权力中心传出。
- source_word: מִלִּפְנֵי
  choice: 从……面前
  rationale: 保留原文“从面前、从在场之处”的宫廷空间意象，而不简化为普通的“出自”。
- source_word: הַשַּׁלִּיט
  choice: 统治者
  rationale: 表达行使权力的人，范围足够宽泛，不额外指定其为君王或某种特定官职。
theological_decisions:
- issue: 统治者与过失之间的责任关系
  choice: 译作“仿佛是从统治者面前发出的过失”
  alternative: 译作“统治者所犯的错误”
  rationale: 原文说明过失从统治者面前发出，却没有直接断定统治者本人无意犯错；所选译法保留其来源、责任和是否无心等方面的张力。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“日光之下”保留《传道书》的传统固定表达；“从统治者面前发出”略带宫廷语感，以再现原文的空间与权力意象。句末冒号承接下一节对这件恶事的具体说明。
