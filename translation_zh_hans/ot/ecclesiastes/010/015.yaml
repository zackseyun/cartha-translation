  timestamp: '2026-07-14T06:59:50Z'
review_pass:
  verdict: revise
  source_fidelity: 正文将关系从句“那不知道怎样前往一座城的人”直接关联到动词的单数宾语，较准确保留希伯来文“劳碌使他疲乏，〔他〕不知道怎样去一座城”的句法。原稿的“因为”把关系从句明确改作因果说明，“进城”又比“前往一座城”更具体；并且原稿词汇说明误称 עִיר 带定冠词，WLC 此处为无冠词形式。
  naturalness: 修订后的句子在现代汉语中通顺、庄重，并保留箴言式的简练。用“前往一座城”表达泛指目的地，虽略正式，仍自然且避免“进城”所带的进入城内之义。
  terminology: “愚昧人”“劳碌”“疲惫不堪”适合传达智慧文学中 כְּסִיל、עָמָל 与 יגע 的语义及语体。
