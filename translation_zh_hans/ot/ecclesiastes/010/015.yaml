revisions:
- from: 愚昧人的劳碌使他疲惫不堪[a]，因为他连怎样进城都不知道。
  to: 愚昧人的劳碌使那不知怎样前往一座城的人疲惫不堪[a]。
  rationale: 修订保留复数“愚昧人”与单数受事之间的原文张力，以关系从句而非因果连词表达 אֲשֶׁר；同时将目的地译为“一座城”，反映无冠词的泛指，并避免“进城”增加的“进入城内”含义。脚注也改正了对希伯来文形态和替代性集体理解的说明。
