  yaml_path: translation/ot/ecclesiastes/010/015.yaml
  text: The labor of fools wearies them[a], for he does not know how to go to the city.
translation:
  language: zh_hans
  text: 愚昧人的劳碌使那不知怎样前往一座城的人疲惫不堪[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“愚昧人的劳碌使他们疲惫不堪；他们不知道怎样前往一座城。”希伯来文“愚昧人”为复数，但“使……疲惫不堪”的宾语后缀及其后的动词均为单数。正文按较直接的语法关联，将单数理解为一个典型的愚昧人；另一译法则按整体意义处理为复数。
    reason: alternative_reading
lexical_decisions:
- source_word: עֲמַל
  choice: 劳碌
  rationale: 该词指辛苦的劳作与付出的苦力；“劳碌”既保留实际劳作的含义，也带出徒劳耗损的语气。
- source_word: הַכְּסִילִים
  choice: 愚昧人
  rationale: 在智慧文学中，כְּסִיל 指在道德和判断上愚顽的人，并非单指智力不足；“愚昧人”符合这一固定范畴。
- source_word: תְּיַגְּעֶנּוּ
  choice: 使他疲惫不堪
  rationale: Piel 词形表达“使疲倦、使筋疲力尽”，三单阳性宾语后缀直译为“他”；中文用“疲惫不堪”自然传达其强度。
- source_word: אֲשֶׁר לֹא יָדַע
  choice: 因为他……不知道
  rationale: 关系词 אֲשֶׁר 在此可承接前面的单数宾语，也可带出解释其疲惫缘由的分句；译作“因为他”使中文通顺，同时保留单数所指。
- source_word: לָלֶכֶת
  choice: 怎样进
  rationale: ידע 与不定式连用表示“知道怎样去”；结合目的地“城”，中文“怎样进城”比“怎样走到城里”更凝练自然。
- source_word: אֶל־עִיר
  choice: 进城
  rationale: 介词 אֶל 表示朝向，עִיר 在马所拉文本中带定冠词；中文惯用的无冠词表达“进城”可自然传达前往那城的意思。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的智慧文学语体。“连……都……”突出连最基本的寻路能力也欠缺，与本句讽刺性的箴言语气相符；不进一步解释“城”的象征意义，以免消除原文的开放性。
