base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/010/002.yaml
  text: A wise man's heart is at his right hand[a], but a fool's heart is at his left.
translation:
  language: zh_hans
  text: 智慧人的心在他右边[a]，愚昧人的心却在他左边。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “右边”也可译作“右手边”。原文以右边和左边构成方位上的对照，可能暗示判断得当与判断失当。
    reason: 说明“右边”的可选具体译法，并保留左右方位可能具有象征意义而不将其限定为唯一解释。
lexical_decisions:
- source_word: לֵב
  choice: 心
  rationale: 希伯来语“心”指人的内在思想、判断和倾向；保留“心”既符合原文意象，也避免把含义缩减为单纯的理智。
- source_word: חָכָם
  choice: 智慧人
  rationale: 该形容词在此作名词用，与“愚昧人”形成智慧文学中常见的对应；“智慧人”自然且庄重。
- source_word: לִימִינוֹ
  choice: 向着右边
  rationale: 介词与“右边”构成方向或取向的表达。“向着”能保留空间隐喻，同时在现代汉语中比“在他的右手边”更适合描述内心的倾向。
- source_word: כְּסִיל
  choice: 愚昧人
  rationale: 该词兼有思想和道德判断上的愚顽之意；“愚昧人”符合智慧文学语域，又避免使用纯粹辱骂性的口语。
- source_word: לִשְׂמֹאלוֹ
  choice: 向着左边
  rationale: 与“向着右边”保持平行，保留原文左右两方的象征性对照，不在正文中把隐喻解释死。
theological_decisions:
- issue: 智慧人与愚昧人的阳性单数形式
  choice: 译作“智慧人”和“愚昧人”
  alternative: 译作“有智慧的人”和“愚昧的人”，或抽象化为“智慧”与“愚昧”
  rationale: 原文以阳性单数的代表性人物构成格言式对照。现代汉语的“人”本身不标示生理性别，既能反映人物化表达，也不必无根据地加上“男人”。
- issue: 右边与左边的象征意义
  choice: 正文保留空间和方向隐喻，以脚注说明其可能含义
  alternative: 正文直接译为“作出正确判断”与“作出错误判断”
  rationale: 原文没有明说具体所指；左右很可能象征正确、得宜的取向与错误、不当的取向。保留隐喻可维护其诗性、含混性及神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的智慧文学语体。两句结构严格平行，以“却”显明对比；保留“心”和左右方向的原文意象，并用脚注交代可行的直译及象征含义。
