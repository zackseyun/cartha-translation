base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/010/014.yaml
  text: And the fool multiplies words[a]. A man does not know what will be[b], and who can tell him what will be after him?
translation:
  language: zh_hans
  text: 愚昧人话越来越多。人不知道将来会发生什么；在他之后[a]会发生什么，谁能告诉他呢？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在他之后”也可理解为“他离世以后”。希伯来语没有明确限定是哪一种。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַסָּכָל
  choice: 愚昧人却
  rationale: הַסָּכָל是带定冠词的单数名词，指“愚昧人”。וְ在此承接上下文并带有对比意味，译作“却”符合现代汉语篇章衔接。
- source_word: יַרְבֶּה דְבָרִים
  choice: 说个不停
  rationale: רבה的使役形与דְבָרִים连用，表示话语繁多。译作“说个不停”自然表达其持续多言之意，同时避免生硬的“增多言语”。
- source_word: לֹא יֵדַע הָאָדָם
  choice: 人不知道
  rationale: הָאָדָם在这里是代表全人类的单数泛称；汉语“人”既保留单数形式，也自然表达普遍意义。
- source_word: מַה שֶׁיִּהְיֶה
  choice: 将来会发生什么
  rationale: 直陈未来未知之事；“会发生什么”比“将会是什么”更符合现代汉语，同时保留开放指向。
- source_word: וַאֲשֶׁר יִהְיֶה מֵאַחֲרָיו
  choice: 在他之后会发生什么
  rationale: מֵאַחֲרָיו字面为“在他之后”，可能指他此后的时间，也尤其可能指他离世以后。正文保留这一时间关系，不把含义限定为死亡之后。
- source_word: מִי יַגִּיד לוֹ
  choice: 谁能告诉他呢
  rationale: 疑问词与נגד的使役形构成反问，强调无人能把未来告知他；“谁能告诉他呢”自然传达这种修辞力量。
