base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/010/020.yaml
  text: Even in your thoughts[a], do not curse a king, and in your bedroom do not curse a rich man, for a bird of the heavens may carry the sound[c][b], and a winged creature may report the matter.
translation:
  language: zh_hans
  text: 即使在心里[a]，也不要咒骂君王；在你的卧房里[b]，也不要咒骂富人。因为天空的飞鸟[c]会把声音传出去，有翅膀的飞鸟会把这事说出去。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在心里”也可译作“在思想中”或“在心思里”。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“在你床榻的内室中”，指卧房这一私密空间。
    reason: cultural_note
  - marker: c
    text: 原文直译为“诸天的飞鸟”；这里借飞鸟传声的形象说明，最隐秘的话也可能泄露。
    reason: literary_note
lexical_decisions:
- source_word: בְּמַדָּעֲךָ
  choice: 在心里
  rationale: מַדָּע可指知识、思想或内在意识；本节与私密卧房并列，重点是最隐秘的内心活动。“在心里”符合现代汉语，也保留这种内在、私下的语境。
- source_word: מֶלֶךְ
  choice: 君王
  rationale: 希伯来文无定冠词，格言泛指掌权的君王；汉语“君王”自然保留其泛指性质。
- source_word: תְּקַלֵּל
  choice: 咒骂
  rationale: קלל的Piel词形可表示诅咒、辱骂或蔑视。“咒骂”兼顾言语上的诅咒与恶言攻击，并与两处平行禁令相配。
- source_word: בְחַדְרֵי מִשְׁכָּבְךָ
  choice: 在你的卧房里
  rationale: 字面为“在你床榻的内室中”，指住宅中最私密的睡卧空间。“卧房”简洁、庄重且为现代读者易懂。
- source_word: עָשִׁיר
  choice: 富人
  rationale: 阳性单数形容词在此作名词使用，指一个富有的人；汉语“富人”无需额外标明性别，并与“君王”形成自然平行。
- source_word: עוֹף הַשָּׁמַיִם
  choice: 天空的飞鸟
  rationale: 直译为“诸天的飞鸟”。“天空的飞鸟”保留希伯来文的空中飞鸟意象，同时符合自然汉语。
- source_word: יוֹלִיךְ אֶת־הַקּוֹל
  choice: 可能把声音带走
  rationale: קוֹל是“声音、嗓音”，יוֹלִיךְ是“带走、传送”。译文保留声音被带走的具体意象；“可能”表达格言中的警告意味，而不把未来式机械处理为必然事件。
- source_word: בַעַל הַכְּנָפַיִם
  choice: 有翅膀的
  rationale: 字面为“翅膀的拥有者”，是对飞禽的迂回称呼。“有翅膀的”保留原文形象和与前句的诗性平行。
- source_word: יַגֵּיד דָּבָר
  choice: 可能把这事说出去
  rationale: נגד意为告诉、报告，דָּבָר在此指先前所说的话或整件事。“把这事说出去”自然表达私语外泄，也保留“声音”与“事情”之间的推进。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而清晰的普通话。两个“也不要”保留希伯来文平行禁令；后半句用“可能”呈现格言式警告，而非断言飞鸟必然传话。“有翅膀的”略带诗性，以保存原文迂回称谓和意象。
