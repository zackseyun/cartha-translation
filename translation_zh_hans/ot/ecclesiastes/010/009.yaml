  text: מַסִּ֣יעַ אֲבָנִ֔ים יֵעָצֵ֖ב בָּ/הֶ֑ם בּוֹקֵ֥עַ עֵצִ֖ים יִסָּ֥כֶן בָּֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/010/009.yaml
  text: Whoever quarries stones may be hurt by them, and whoever splits logs may be endangered by them.
translation:
  language: zh_hans
  text: 搬动石头的人，可能被石头弄伤；劈柴的人，可能因此遇险。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “遇险”所译的希伯来词含义不确定；也有人理解为“从中得益”或“因它得暖”。
    reason: יִסָּכֶן的形式和词义有争议。正文依上下句的劳动风险平行译为“遇险”，脚注保留其他有文本依据的理解。
lexical_decisions:
- source_word: מַסִּיעַ אֲבָנִים
  choice: 凿取石头的
  rationale: מַסִּיעַ在这里指移取、采取石块；结合劳动场景译为“凿取”，比单纯“搬动”更贴近采石语境，同时不把动作过度具体化为某种现代工艺。
- source_word: יֵעָצֵב בָּהֶם
  choice: 可能被石头所伤
  rationale: 动词可表达受痛苦、受伤害；未完成式在格言中表示可能发生的后果，故用“可能”。介词短语保留石头作为致害因素。
- source_word: בּוֹקֵעַ עֵצִים
  choice: 劈开木头的
  rationale: בקע意为劈开、裂开；עֵצִים可指木头、木材或树木。此处与劳动风险相连，“劈开木头”自然且不限定为原木。
- source_word: יִסָּכֶן בָּם
  choice: 可能因木头遇险
  rationale: 按古代译本和上下文中的劳动危险理解为“遭遇危险”；以“因木头”保留בָּם所表达的关联或致险关系，并以脚注注明该罕见形式的另一种词义分析。
theological_decisions:
- issue: 本节是劳动风险的格言，还是关于劳动收益的陈述
  choice: 正文采用“遇险”，呈现与上半句平行的劳动风险
  alternative: “可能从木头得益”或“可能因木头得暖”
  rationale: יִסָּכֶן的形式罕见，但古代译本及与“可能被石头所伤”的平行结构支持危险义；因词义仍有争议，未在正文中绝对化，而以脚注保留另一理解。
translation_notes:
  register: 采用现代、简洁而庄重的格言体；两个分句保持平行。“可能”准确传达行为所伴随的风险，而不是宣称结果必然发生。
