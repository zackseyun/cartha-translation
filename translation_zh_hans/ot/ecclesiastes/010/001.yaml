id: ECC.10.1
reference: Ecclesiastes 10:1
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: זְב֣וּבֵי מָ֔וֶת יַבְאִ֥ישׁ יַבִּ֖יעַ שֶׁ֣מֶן רוֹקֵ֑חַ יָקָ֛ר מֵ/חָכְמָ֥ה מִ/כָּב֖וֹד סִכְל֥וּת מְעָֽט׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/010/001.yaml
  text: Dead flies make a perfumer’s oil stink and bubble up[b][a]; so a little folly outweighs wisdom and honor.
translation:
  language: zh_hans
  text: 死苍蝇使调香人的膏油发臭、冒泡[a]；一点愚昧，比智慧和尊荣更有分量[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“发酵”“涌出”，也可较笼统地理解为“败坏”。希伯来语动词带有向外发出或涌冒的动态意味。
    reason: lexical_alternative
  - marker: b
    text: 或译“一点愚昧，比智慧和尊荣更宝贵（或更贵重）”。希伯来语可作价值比较，也可理解为愚昧的影响或后果更有分量。
    reason: lexical_alternative
lexical_decisions:
- source_word: זְבוּבֵי מָוֶת
  choice: 死苍蝇
  rationale: 该结构直译为“死亡的苍蝇”，结合苍蝇使膏油腐坏的图景，理解为落入其中的死苍蝇最自然；“死苍蝇”简洁而具体。
- source_word: יַבְאִישׁ
  choice: 使……发臭
  rationale: 使役式明确表示“使之产生恶臭”；“使……发臭”保留使役含义，也符合现代汉语。
- source_word: יַבִּיעַ
  choice: 冒泡
  rationale: 该动词可指涌出、发出或冒泡；在膏油败坏的语境中，“冒泡”保留原文动态而较为具体的意象。
- source_word: שֶׁמֶן רוֹקֵחַ
  choice: 调香人的膏油
  rationale: 原文为调制香料者的油；“调香人的膏油”既保留工匠含义，也自然表达经过调制、带香气的油膏。
- source_word: יָקָר
  choice: 更有分量
  rationale: 该词通常表示贵重、珍贵，也可在比较中表达更重、更有影响；这里用“更有分量”保留价值与后果轻重之间的双关张力，不把意思局限为正面的“更宝贵”。
- source_word: מֵחָכְמָה מִכָּבוֹד
  choice: 比智慧和尊荣
  rationale: 两个带比较介词的名词共同构成比较对象；在人际和社会语境中，כָּבוֹד 译为“尊荣”比“荣耀”更贴切。
- source_word: סִכְלוּת מְעָט
  choice: 一点愚昧
  rationale: 直接保留名词与数量修饰语，突出少量愚昧也会产生不成比例影响的箴言式反差。
theological_decisions:
- issue: 后半句 יָקָר 的比较含义
  choice: 一点愚昧，比智慧和尊荣更有分量
  alternative: 一点愚昧，比智慧和尊荣更宝贵
  rationale: 原文在“贵重”与“有分量、影响更大”之间存在词义张力。上下文强调微小败坏造成巨大损害，因此正文采用不带褒义的“更有分量”，并以脚注保留价值比较的另一读法。
translation_notes:
  register: 采用庄重而通俗的现代标准汉语。“发臭、冒泡”保留原文鲜明且动态的腐坏图景；后半句用“更有分量”维持希伯来语 יָקָר 在价值和影响轻重之间的歧义。所有脚注标记均置于相关正文之后。
