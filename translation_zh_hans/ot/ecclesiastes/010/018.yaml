base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/010/018.yaml
  text: Through laziness the roof sags[b][a], and through idle hands the house leaks.
translation:
  language: zh_hans
  text: 因人懒惰，房顶就下陷[a]；因双手懈怠[b]，房屋就漏水。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“房顶就下沉”。原文动词可指变低、下沉或开始塌陷；“房顶”一词也可能更具体地指屋顶结构或椽木。
    reason: lexical_alternative
  - marker: b
    text: 原文直译近于“双手低垂”，是指懈怠、疏忽，不肯动手做工。
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּעֲצַלְתַּיִם
  choice: 因人懒惰
  rationale: 介词ב表示原因或方式；עֲצַלְתַּיִם指懒惰、怠惰。译为“因人懒惰”既自然，也清楚表达因果关系。
- source_word: יִמַּךְ
  choice: 下陷
  rationale: 该动词在此表示变低、下沉或结构逐渐塌陷；“下陷”保留渐进性，不把意思强化为彻底倒塌。
- source_word: הַמְּקָרֶה
  choice: 房顶
  rationale: 该词指屋顶或其支撑、覆盖结构。“房顶”符合上下文，也便于现代读者理解，同时不限定为椽子或横梁。
- source_word: וּבְשִׁפְלוּת יָדַיִם
  choice: 因双手懈怠
  rationale: 原文直译近于“双手低垂”，是疏懒、不动手做工的形象表达。“双手懈怠”保留身体意象并传达疏于维护之意。
- source_word: יִדְלֹף
  choice: 漏水
  rationale: דלף表示滴漏；以房屋为主语时，“漏水”是自然、准确的中文表达。
- source_word: הַבָּיִת
  choice: 房屋
  rationale: בַּיִת通常指房屋；此处采用“房屋”以保持具体的建筑意象。
