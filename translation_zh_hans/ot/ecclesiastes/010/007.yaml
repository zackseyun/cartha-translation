  text: I have seen slaves on horses[c][b][a], and princes walking on the ground like slaves.
translation:
  language: zh_hans
  text: 我见过奴隶[a]骑在马上，权贵像奴隶一样在地上步行[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “奴隶”也可译作“仆人”或“奴仆”；原文词语可指受役使的低下身份者。这里的语境突出社会地位的强烈倒置。
    reason: lexical_alternative
  - marker: b
    text: 直译为“在地上／土地上行走”；这与前面的“骑在马上”形成对照。
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאִיתִי
  choice: 我见过
  rationale: 该词是ראה的Qal完成式第一人称单数；“我见过”自然表达传道者基于亲身观察所作的陈述，并保留其对当前论述的关联。
- source_word: עֲבָדִים
  choice: 奴仆
  rationale: עֶבֶד的复数，可指奴隶或仆役。此处重点是社会地位的强烈倒置；“奴仆”既保留低下、受役使的身份，也避免在语境未明说其法律身份时过度限定。
- source_word: עַל סוּסִים
  choice: 骑在马上
  rationale: 原文直译为“在马上”，语境明确描写乘马；汉语用“骑在马上”自然、具体，并显出尊荣地位的反常配置。
- source_word: שָׂרִים
  choice: 王公
  rationale: 该词指居高位、有权势的人，可译首领、贵族或官长。“王公”以凝练而庄重的现代汉语表现其显赫身份，并与“奴仆”形成鲜明对照。
- source_word: הֹלְכִים
  choice: 步行
  rationale: הלך的分词描写持续进行的行动。结合与骑马的对照，“步行”比笼统的“行走”更清楚，也符合汉语习惯。
- source_word: כַּעֲבָדִים
  choice: 像奴仆一样
  rationale: 前缀כ是比较用法；王公并非被直接认定为奴仆，而是其处境或行止被比作奴仆，因此保留明晰的比较表达。
- source_word: עַל הָאָרֶץ
  choice: 在地上
  rationale: 原文是“在地上／土地上”，与“在马上”构成具体对照；不直接译作“徒步”，以免完全消除原文的空间意象。
