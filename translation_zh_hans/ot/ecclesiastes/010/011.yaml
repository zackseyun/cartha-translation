  text: 蛇若在受到咒语控制以前咬人，弄蛇人[a]就得不到益处。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “弄蛇人”原文直译为“舌头的主人”，可能指善于用言语或咒语制蛇的人。
    reason: lexical_alternative
  - marker: b
    text: 本句也可译为：“蛇若在没有咒语时咬人，舌头的主人就得不到益处。”
    reason: alternative_reading
lexical_decisions:
- source_word: אִם
  choice: 若
  rationale: 引出箴言式的条件情形；“若”简洁庄重，也符合现代中文表达。
- source_word: יִשֹּׁךְ הַנָּחָשׁ
  choice: 蛇若……咬人
  rationale: נשׁך通常指蛇咬；原文未明说受事，中文补出“人”可使句意自然，并不限定具体对象。
- source_word: בְּלוֹא לָחַשׁ
  choice: 在念咒以前
  rationale: לחש可指低语、咒语或以咒语制蛇；在本句实际语境中，译作“在念咒以前”表达行动若不及时便失效的含义，同时以脚注保留“没有咒语”的较形式对应译法。
- source_word: וְאֵין יִתְרוֹן
  choice: 就得不到益处
  rationale: יתרון是《传道书》的关键词，可指益处、优势或收益；这里用“得不到益处”既自然，又保留其广义。
- source_word: לְבַעַל הַלָּשׁוֹן
  choice: 弄蛇人
  rationale: 字面是“舌头的主人”，在蛇与咒语的语境中很可能指凭言语或咒语制蛇的人；正文采用易懂的语境译法，脚注保留字面表达及歧义。
