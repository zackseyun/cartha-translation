  text: לִ/שְׂחוֹק֙ עֹשִׂ֣ים לֶ֔חֶם וְ/יַ֖יִן יְשַׂמַּ֣ח חַיִּ֑ים וְ/הַ/כֶּ֖סֶף יַעֲנֶ֥ה אֶת הַ/כֹּֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/010/019.yaml
  text: They make bread for laughter[a], and wine gladdens life[b], and money answers everything.
translation:
  language: zh_hans
  text: 人预备饭食[a]，是为了欢笑；酒使人生快活[b]；钱能应付一切[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “饭食”原文是“饼”，也可泛指食物或一顿饭。
    reason: lexical_alternative
  - marker: b
    text: “人生”也可译作“活着的人”。
    reason: lexical_alternative
  - marker: c
    text: “钱能应付一切”原文直译为“钱回答一切”。
    reason: literal_rendering
lexical_decisions:
- source_word: לִשְׂחוֹק
  choice: 为要欢笑
  rationale: לְ 表示目的或结果；שְׂחוֹק 可指欢笑、欢乐。译作“为要欢笑”保留原文简练而略带箴言式的表达，不扩写为“享乐”。
- source_word: עֹשִׂים לֶחֶם
  choice: 人预备饭食
  rationale: 复数动词可用泛指主语“人”表达。לֶחֶם 字面是“饼、食物”，在此可泛指饭食或宴席；“预备饭食”比“制作饼”更符合现代汉语，同时未直接把它限定为盛宴。
- source_word: וְיַיִן יְשַׂמַּח חַיִּים
  choice: 酒使人生快活
  rationale: שׂמח 的加强词干表示“使……欢喜、快活”；חַיִּים 可指“生命、人生”，也可能指“活着的人”。正文采用自然的“人生”，脚注保留另一可能。
- source_word: וְהַכֶּסֶף
  choice: 钱
  rationale: כֶּסֶף 可指银子或货币；此处语境重在其经济用途，现代汉语用“钱”最直接自然。
- source_word: יַעֲנֶה אֶת־הַכֹּל
  choice: 能应对一切
  rationale: ענה 通常意为“回答、回应”。“应对一切”既保留其回应之意，又能在汉语中表达钱对各种事情起作用的语境含义；脚注注明更贴字面的译法。
theological_decisions:
- issue: 末句的语气和绝对性
  choice: 按原文直接陈述“钱能应对一切”，不添加“似乎”“人以为”等限定语。
  alternative: 明确译成反讽，或弱化为“钱能满足各种需要”。
  rationale: 希伯来文以简短的陈述句呈现这句话，本节语法本身没有明示反讽。正文应保留其尖锐性及可能的张力，让《传道书》的上下文引导读者理解。
translation_notes:
  register: 采用现代、简洁而庄重的箴言式汉语。分号呈现前两句与末句之间的推进关系；不在正文中说明末句是否带有反讽，以保留原文的含混和神学张力。
