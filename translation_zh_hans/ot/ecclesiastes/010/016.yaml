base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/010/016.yaml
  text: Woe to you[a], O land[b], when your king is a youth and your princes eat in the morning.
translation:
  language: zh_hans
  text: 国啊，你有祸了！[a]你的王若是少年，你的官长早晨就进食。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “有祸了”也可译作“可悲啊”。“少年”原文可指孩童、少年或年轻人；这里很可能强调执政者不成熟。
    reason: lexical_alternative
  - marker: b
    text: 官长“早晨就进食”，很可能指他们在不合宜的时间纵情宴饮；下一节与此形成对比。
    reason: cultural_note
lexical_decisions:
- source_word: אִי לָךְ אֶרֶץ
  choice: 国啊，你有祸了
  rationale: אִי是哀叹或宣告灾祸的感叹词；与לָךְ连用，直接对阴性名词אֶרֶץ发出警告。此处אֶרֶץ指政治共同体，译为“国”比“地”更清楚自然。
- source_word: שֶׁמַּלְכֵּךְ
  choice: 你的王若是
  rationale: 关系词שֶׁ引出该国蒙祸的处境或条件。汉语用“若是”自然表达这种情境，同时不把它限定为纯粹时间关系。
- source_word: נָעַר
  choice: 少年
  rationale: 该词可指孩童、少年或年轻人；这里可能着重于执政者年少或不成熟。“少年”保留年龄范围及语境中的负面暗示，而不直接释为“幼稚”。
- source_word: וְשָׂרַיִךְ
  choice: 你的官长
  rationale: שָׂרִים指君王之下的统治者或高级官员。“官长”既保留其治理身份，也避免“王子”可能造成的血缘误解。
- source_word: בַּבֹּקֶר יֹאכֵלוּ
  choice: 早晨就吃喝
  rationale: 原文动词基本义为“吃”。汉语“吃喝”在此可自然涵盖席宴活动，但不直接加入“纵饮”“宴乐”等原文未明说的判断；“就”突出时间之早。
theological_decisions:
- issue: “少年”是否应解释为道德或政治上的幼稚
  choice: 正文保留“少年”
  alternative: 译为“幼稚无能的人”或“孩子”
  rationale: 原词首先是年龄或身份用语，语境虽暗示治理不成熟，却没有明确把年龄完全转化为道德评语；正文保留张力，脚注说明可能含义。
- issue: 早晨进食的负面含义
  choice: 正文直译时间和行为，以脚注交代语境暗示
  alternative: 正文译为“清早就纵情宴乐”
  rationale: 本节本身只说官长早晨吃；其不当与放纵的含义主要由下一节的对比显明，不宜在正文中将推论写成明说。
translation_notes:
  register: 采用现代、庄重而通顺的汉语。“国啊”保留原文直接呼告；“官长”适合智慧文学中的王国治理语境。“吃喝”自然表达席宴场景，但将放纵之意留在脚注中，避免正文过度解释。
