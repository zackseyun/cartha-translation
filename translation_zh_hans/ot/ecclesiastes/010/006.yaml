  text: נִתַּ֣ן הַ/סֶּ֔כֶל בַּ/מְּרוֹמִ֖ים רַבִּ֑ים וַ/עֲשִׁירִ֖ים בַּ/שֵּׁ֥פֶל יֵשֵֽׁבוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/010/006.yaml
  text: Folly is set in many high places[a], and the rich sit in a low place.
translation:
  language: zh_hans
  text: 愚昧被置于许多高位[a]，富足的人却坐在低位。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“愚昧被安置在许多尊位上。”希伯来文以“高位”和“低位”的空间说法，比喻社会地位或职分。
    reason: lexical_alternative
lexical_decisions:
- source_word: נִתַּן
  choice: 被置于
  rationale: 该词为נתן的尼法勒完成式，表达被动的“被放置、被安置”；“被置于”保留被动语态，不擅自说明施事者。
- source_word: הַסֶּכֶל
  choice: 愚昧
  rationale: 此名词指愚昧或愚妄，而非明确指某个愚昧的人；“愚昧”也符合《传道书》中智慧与愚昧的主题对照。
- source_word: בַּמְּרוֹמִים רַבִּים
  choice: 于许多高位
  rationale: מְרוֹמִים本指高处，此处以空间意象喻指显要地位；“许多”对应רַבִּים，并保留原文高低相对的表达。
- source_word: וַעֲשִׁירִים
  choice: 富足的人
  rationale: 阳性复数形容词在此作名词用，泛指富有者；译作“富足的人”自然清楚，也不额外强化性别。
- source_word: בַּשֵּׁפֶל
  choice: 在低位
  rationale: שֵׁפֶל表示低处、卑下的处境；“低位”与前半句“高位”形成鲜明对应，同时传达社会地位的隐喻。
- source_word: יֵשֵׁבוּ
  choice: 坐
  rationale: ישב常指坐下或居于某处；“坐在”保留具体意象，也可自然暗示所处的位置或身份。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“高位／低位”保留希伯来文的空间隐喻和诗句对称；用“却”明确原文两分句之间的反差，但不补入具体施事者或因果解释。
