base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/010/017.yaml
  text: Happy are you[a], O land, when your king is a son of nobles, and your princes eat at the proper time[c][b], for strength and not for drunkenness.
translation:
  language: zh_hans
  text: 国啊，你的王出身贵族[a]，你的群臣在适当的时候进食，为要得力，不是为了醉酒[b]，你就有福了！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“是贵族之子”；也可理解为“生于自由人之家”。
    reason: lexical_alternative
  - marker: b
    text: “不是为了醉酒”原文较直译为“不为饮酒”；语境所指是纵饮而非单纯饮用。
    reason: lexical_alternative
lexical_decisions:
- source_word: אַשְׁרֵיךְ
  choice: 你就有福了
  rationale: 该智慧文学感叹语表示一种令人羡慕的顺遂、福乐状态；这里关乎国家治理之福，并非明确宣告神的赐福。“有福了”既保留格言语气，也适合现代汉语。
- source_word: אֶרֶץ
  choice: 国啊
  rationale: 此处拟人化地呼唤由君王和群臣治理的政治共同体。“国”比“地”更能显明语境，“啊”保留直接呼语。
- source_word: שֶׁמַּלְכֵּךְ
  choice: 你的王
  rationale: 希伯来语关系结构描述这个国家的君王；汉语采用顺承条件式句法，到句末以“你就有福了”收束，自然而不改变关系含义。
- source_word: בֶּן חוֹרִים
  choice: 出身尊贵
  rationale: 字面为“贵族之子”，指自由人或贵族的后裔；在王权语境中，“出身尊贵”自然传达高贵、体面家世，同时以脚注保留较直译形式。
- source_word: וְשָׂרַיִךְ
  choice: 你的群臣
  rationale: שָׂרִים可指首领、官长或王公；“群臣”符合君王朝廷语境，也比现代行政性的“官员”更有经文体庄重感。
- source_word: בָּעֵת
  choice: 按时
  rationale: 原文意为在合宜的时候，与上一节一早宴乐形成对照。“按时”简洁自然，并含合宜时机之意。
- source_word: יֹאכֵלוּ
  choice: 进食
  rationale: 保留基本义“吃”；“进食”在此政治格言语境中较庄重，且不把普通动作强化为“宴饮”。
- source_word: בִּגְבוּרָה
  choice: 为要得力
  rationale: גְּבוּרָה表示力量、能力或勇力；介词结构在此最自然地理解为目的，即借饮食获得体力，而非放纵。
- source_word: וְלֹא בַשְּׁתִי
  choice: 不为醉酒
  rationale: 字面涉及“饮酒/饮用”，在与得力相对的宴饮语境中指向纵饮及醉酒；译文表达其对比含义，脚注保留字面可能性。
theological_decisions: []
