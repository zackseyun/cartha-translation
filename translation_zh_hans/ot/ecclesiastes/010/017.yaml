  register: 采用现代、庄重而易懂的智慧文学语体。将希伯来语开头的“有福”感叹移至汉语句末，使国家蒙福的条件层次清楚；保留“国啊”的拟人呼语，以及“得力”与“醉酒”的鲜明对照。
