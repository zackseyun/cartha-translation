  to: 铁器[a]若钝了，若没有把刃口磨利，就得多用力气；智慧的益处，在于使事情成功[b]。
  rationale: 修订仅澄清首句的条件关系，并使末句避免补入原文未明说的“人”。“使事情成功”对应该动词所表达的使之有效、顺利或成功，且保留智慧带来实际成效这一格言的宽泛含义。
