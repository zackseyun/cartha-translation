  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: אִם קֵהָ֣ה הַ/בַּרְזֶ֗ל וְ/הוּא֙ לֹא פָנִ֣ים קִלְקַ֔ל וַ/חֲיָלִ֖ים יְגַבֵּ֑ר וְ/יִתְר֥וֹן הכשיר חָכְמָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/010/010.yaml
  text: If the iron is dull and one has not sharpened its edge[a], then he must use more strength[b]; but wisdom brings success.
translation:
  language: zh_hans
  text: 铁器[a]若钝了，若没有把刃口磨利，就得多用力气；智慧的益处，在于使事情成功[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“铁”，这里很可能指铁制的刀刃或工具。
    reason: cultural_note
  - marker: b
    text: “使事情成功”也可译作“使人行事顺利”或“使事情办得合宜”。
    reason: lexical_alternative
lexical_decisions:
- source_word: קֵהָה
  choice: 钝了
  rationale: 表示刀刃不锋利；“钝了”自然、准确，也保留可能已经变钝的语感。
- source_word: הַבַּרְזֶל
  choice: 铁器
  rationale: 原文直译为“铁”，此处借指带刃的铁制工具；译作“铁器”既保留原文意象，也避免误解为抽象的铁材料。
- source_word: פָנִים
  choice: 刃口
  rationale: 字面义为“面”，在铁制工具的语境中指其工作面或锋刃；“刃口”符合现代汉语表达。
- source_word: קִלְקַל
  choice: 没有磨利
  rationale: 该词在这里表示没有把刀刃整治妥当，即没有磨快；“磨利”与前文“钝了”形成清楚对应。
- source_word: וַחֲיָלִים יְגַבֵּר
  choice: 就得多用力气
  rationale: חַיִל在此指力量，גבר的加强形式表达加大或增强；整句说明工具钝时必须施加更多力量。
- source_word: וְיִתְרוֹן
  choice: 益处
  rationale: 该名词意为优势、益处或收益。明译“益处”比只用转折词更完整地保留希伯来文措辞。
- source_word: הכשיר
  choice: 使人行事顺利
  rationale: 源自动词כשר的使役形式，可指使某事合宜、有效或成功；此处强调智慧使行动达到良好成效。
- source_word: חָכְמָה
  choice: 智慧
  rationale: 标准译法；在本节尤其指实际的技能、判断力和明智做法。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“铁器若钝了”保留原文的工具意象；末句明确译出“益处”，同时用“使人行事顺利”表达כשר使役形式所包含的合宜、有效和成功之意，不把格言限定为必然获得某种神学意义上的成功。
