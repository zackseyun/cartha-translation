base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/010/003.yaml
  text: Even on the road[a], when the fool walks, his heart lacks sense, and he says to everyone that he is a fool.
translation:
  language: zh_hans
  text: 愚昧人甚至在路上行走时，心里也缺少见识；他还对众人说自己是愚昧人。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他还对众人说：‘他是愚昧人。’”原文既可理解为愚昧人显露自己是愚昧人，也可理解为他称别人是愚昧人；前一种理解较符合上下文所说愚昧会自行显露。
    reason: alternative_reading
lexical_decisions:
- source_word: וְגַם
  choice: 即使……也
  rationale: 这里带有递进强调：愚昧人的缺陷甚至在走路这样的公开、日常场景中也会显露出来。
- source_word: בַּדֶּרֶךְ
  choice: 走在路上
  rationale: 保留道路和行走的具体意象，同时符合现代汉语表达。
- source_word: כשהסכל הֹלֵךְ
  choice: 愚昧人……走
  rationale: 将 כְּשֶׁ 理解为时间性或情境性连接词，并把 הֹלֵךְ 按其通常意义译为“走”。
- source_word: לִבּוֹ חָסֵר
  choice: 心里缺少见识
  rationale: “心”在希伯来语中可指思想、判断和理解；“见识”自然传达其判断力不足，又保留“心里”的源文意象。
- source_word: וְאָמַר לַכֹּל
  choice: 他还对众人说
  rationale: 保留 אָמַר 的言说含义和 לַכֹּל 的广泛对象，不改译为仅由行为“显明”。
- source_word: סָכָל הוּא
  choice: 他是愚昧人
  rationale: 保留名词“愚昧人”以及第三人称代词所形成的指称张力；正文按较符合上下文的理解，指愚昧人暴露自己。
theological_decisions:
- issue: “他是愚昧人”所指为何人
  choice: 正文理解为愚昧人向众人表明自己是愚昧人
  alternative: 愚昧人对众人说另一个人（或别人）是愚昧人
  rationale: 希伯来语 סָכָל הוּא 的第三人称指称存在歧义；自我暴露的理解较符合本节论述愚昧如何公开显出的语境，但不应抹去另一种可能。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“心里缺少见识”兼顾希伯来文的“心”意象和现代读者对理智、判断力不足的理解；分号呈现两个紧密相连的判断。
