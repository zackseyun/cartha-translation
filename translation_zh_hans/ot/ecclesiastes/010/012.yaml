  text: דִּבְרֵ֥י פִי חָכָ֖ם חֵ֑ן וְ/שִׂפְת֥וֹת כְּסִ֖יל תְּבַלְּעֶֽ/נּוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/010/012.yaml
  text: The words of the mouth of a wise man are gracious[a], but the lips of a fool swallow him up.
translation:
  language: zh_hans
  text: 智慧人口中的话满有恩惠[a]，愚昧人的嘴唇却吞噬自己。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“智慧人口中的话带来恩惠”，也可理解为“赢得好感”。
    reason: חֵן既可表示话语本身具有恩惠、可悦的特质，也可较具体地表示所带来的恩惠或好感。
lexical_decisions:
- source_word: דִּבְרֵי פִי חָכָם
  choice: 智慧人口中的话
  rationale: 保留“口”这一具体意象，并以现代汉语自然的领属结构表达“智慧人之口的话”；חָכָם在此为名词化的阳性单数形容词，泛指智慧人。
- source_word: חֵן
  choice: 满有恩惠
  rationale: 该谓语名词可指恩惠、悦人之处或由此而来的好感。“满有恩惠”在汉语中自然地描述智慧人的话具有恩慈、可悦的特质，同时以脚注保留“带来恩惠／赢得好感”的具体结果义。
- source_word: שִׂפְתוֹת כְּסִיל
  choice: 愚昧人的嘴唇
  rationale: 直译“嘴唇”，保留其与上半句“口”的诗意平行；כְּסִיל是智慧文学中兼具道德与认知意味的“愚昧人”。
- source_word: תְּבַלְּעֶנּוּ
  choice: 吞噬自己
  rationale: 保留בלע“吞下、吞没”的强烈比喻；宾语后缀指向愚昧人，汉语用“自己”明确表达其言语反过来毁灭自身。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准汉语；保留“口／嘴唇”和“吞噬”的诗性意象，并避免把חֵן的多义性限定为单一解释。
