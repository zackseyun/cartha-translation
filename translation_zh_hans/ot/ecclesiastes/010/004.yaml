  text: אִם ר֤וּחַ הַ/מּוֹשֵׁל֙ תַּעֲלֶ֣ה עָלֶ֔י/ךָ מְקוֹמְ/ךָ֖ אַל תַּנַּ֑ח כִּ֣י מַרְפֵּ֔א יַנִּ֖יחַ חֲטָאִ֥ים גְּדוֹלִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/010/004.yaml
  text: If the ruler’s anger rises against you[a], do not leave your place[d][c][b], for calmness lays great offenses to rest.
translation:
  language: zh_hans
  text: 掌权者若向你发怒[a]，不要离开你的位置[b]；因为沉着[c]能使重大的过错[d]平息下来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“掌权者的灵／脾气向你升起”。希伯来语 רוּחַ 本义可指“灵、气息、风”，这里很可能指被激起的怒气或暴躁情绪。
    reason: lexical_alternative
  - marker: b
    text: 直译“你的地方”，也可理解为“你所处的位置”。
    reason: lexical_alternative
  - marker: c
    text: 或译“温和”“舒缓”或“医治”。希伯来语 מַרְפֵּא 含有医治、缓和的意思，这里可能指镇定柔和的回应。
    reason: lexical_alternative
  - marker: d
    text: 直译“大罪”，也可译“重大的过失”。
    reason: lexical_alternative
lexical_decisions:
- source_word: רוּחַ
  choice: 怒
  rationale: 该词本义为“灵、气息、风”，在“升到／临到你身上”的语境中指掌权者被激起的怒气；译为“发怒”符合现代汉语表达，同时以脚注保留原词的多义性。
- source_word: הַמּוֹשֵׁל
  choice: 掌权者
  rationale: 分词形式指实行统治或拥有权柄的人；“掌权者”既涵盖君王、官长等身份，又不把语境限定于某一种官职。
- source_word: תַּעֲלֶה עָלֶיךָ
  choice: 向你发
  rationale: 直译为“升到／临到你身上”；与“怒”组合为“向你发怒”，自然表达怒气针对听者而起。
- source_word: מְקוֹמְךָ
  choice: 你的岗位
  rationale: 字面是“你的地方”；在下属面对掌权者的语境中，“岗位”较自然地表达其所处的位置或职分，脚注保留直译。
- source_word: אַל תַּנַּח
  choice: 不要离开
  rationale: 此处表示不要放弃或离开所在之处；“不要离开”简洁保留劝诫语气。
- source_word: מַרְפֵּא
  choice: 沉着
  rationale: 该名词可指医治、舒缓之物或温和的态度；这里指面对怒气时镇定柔和的回应，“沉着”贴合上下文，而脚注列出其他可能译法。
- source_word: יַנִּיחַ
  choice: 使……平息下来
  rationale: 使役形式含有使安歇、放下或止息之意；此译保留“安息／止息”的意象，并符合汉语习惯。
- source_word: חֲטָאִים גְּדוֹלִים
  choice: 严重的过错
  rationale: 该短语可直译为“大罪”；在智慧文学的政治与人际语境中也可指重大过失。“严重的过错”保留道德分量而不过度限定，脚注注明直译。
theological_decisions:
- issue: חֲטָאִים 是宗教意义的“罪”还是行政、人际意义的“过错”
  choice: 正文译作“严重的过错”
  alternative: “大罪”
  rationale: 上下文谈掌权者与属下之间的冲突，词义可涵盖严重过失；正文采用较宽的“过错”，脚注保留更具神学色彩的直译“大罪”，避免消除原文张力。
translation_notes:
  register: 采用现代、庄重而通顺的箴言式表达。“掌权者”“岗位”清楚呈现权力关系；“沉着……平息下来”保留原文舒缓、止息的意象。所有具有实质意义的词义分歧均以脚注呈现，未把经文限定为特定宗派或神学解释。
