  text: שַׁ֜בְתִּי וְ/רָאֹ֣ה תַֽחַת הַ/שֶּׁ֗מֶשׁ כִּ֣י לֹא֩ לַ/קַּלִּ֨ים הַ/מֵּר֜וֹץ וְ/לֹ֧א לַ/גִּבּוֹרִ֣ים הַ/מִּלְחָמָ֗ה וְ֠/גַם לֹ֣א לַ/חֲכָמִ֥ים לֶ֨חֶם֙ וְ/גַ֨ם לֹ֤א לַ/נְּבֹנִים֙ עֹ֔שֶׁר וְ/גַ֛ם לֹ֥א לַ/יֹּדְעִ֖ים חֵ֑ן כִּי עֵ֥ת וָ/פֶ֖גַע יִקְרֶ֥ה אֶת כֻּלָּֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/009/011.yaml
  text: I again saw under the sun that the race is not to the swift[a], nor the battle to the mighty, and also bread is not to the wise, nor riches to the discerning, nor favor to those who know; for time and chance happen to them all.
translation:
  language: zh_hans
  text: 我又看见日光之下：跑得快的人未必赢得赛跑，勇士未必打胜仗；智慧人未必有饭吃，明辨的人未必富足，有知识的人也未必蒙人青睐；因为时机和际遇[a]都会临到众人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “时机和际遇”或译“时间和偶发之事”“时日和遭遇”。希伯来语这一表达强调，不可预料的境遇会临到每一个人。
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׁבְתִּי וְרָאֹה
  choice: 我又看见
  rationale: 该组合字面近于“我返回并看见”，在《传道书》中用于引出再次观察；“我又看见”自然地表达重复观察，而非身体移动。
- source_word: תַחַת הַשֶּׁמֶשׁ
  choice: 日光之下
  rationale: 保留《传道书》的标志性表达，指人世间可观察的生活领域。
- source_word: לֹא לַקַּלִּים הַמֵּרוֹץ
  choice: 快跑的未必赢得赛跑
  rationale: 希伯来文直译近于“赛跑不归快的人”；“未必赢得”传达结果并非必然属于最有优势者，符合后文整体论旨。
- source_word: לֹא לַגִּבּוֹרִים הַמִּלְחָמָה
  choice: 勇士未必打胜仗
  rationale: גִּבּוֹרִים可指强者或勇士；在战争语境中译作“勇士”自然。“打胜仗”表达战事结果不必然归于他们。
- source_word: לַחֲכָמִים לֶחֶם
  choice: 智慧人未必有饭吃
  rationale: לֶחֶם字面为“饼、食物”，在此指维生之食；现代汉语“有饭吃”保留具体意象并自然表达生计。
- source_word: לַנְּבֹנִים עֹשֶׁר
  choice: 明辨的人未必富足
  rationale: נבון强调理解力和辨别力，译作“明辨的人”；עֹשֶׁר译作“富足”，既涵盖财富，也符合本句状态性的表达。
- source_word: לַיֹּדְעִים חֵן
  choice: 有知识的人也未必蒙人青睐
  rationale: יֹדְעִים保持宽泛的“有知识的人”；חֵן在此指 favorable reception，译作“蒙人青睐”避免在智慧文学语境中引入“恩典”的神学专义。
- source_word: עֵת וָפֶגַע
  choice: 时机和意外
  rationale: עֵת指时间或时机；פֶגַע在此指突然遭遇、偶发事件。“时机和意外”保留人生境遇不可预测的张力，而不把经文改写成关于盲目偶然性的哲学断言。
- source_word: יִקְרֶה אֶת כֻּלָּם
  choice: 临到众人
  rationale: יִקְרֶה表达发生、遭逢；“临到众人”简洁保留事件及于所有人的含义。
theological_decisions:
- issue: 经文是否否定上帝的护理，宣称人生只由盲目偶然支配
  choice: 按“日光之下”的观察视角，陈述人的优势不能保证结果，人人都会遭遇不可预测的时机与事件。
  alternative: 将本句解释为一切都受盲目机运支配，与上帝的主权无关。
  rationale: 希伯来文本强调经验世界中结果的不可预料，却没有在本节明确作出否定上帝护理的教义判断；译文保留这种神学张力，不额外解决。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。前五个分句用“未必”呈现希伯来文“并不归于……”所表达的非必然关系，避免误读为快者绝不获胜、勇士绝不胜仗。保留“日光之下”的书卷特色，并以整齐平行的句式体现原文节奏。
