id: ECC.9.10
reference: Ecclesiastes 9:10
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כֹּ֠ל אֲשֶׁ֨ר תִּמְצָ֧א יָֽדְ/ךָ֛ לַ/עֲשׂ֥וֹת בְּ/כֹחֲ/ךָ֖ עֲשֵׂ֑ה כִּי֩ אֵ֨ין מַעֲשֶׂ֤ה וְ/חֶשְׁבּוֹן֙ וְ/דַ֣עַת וְ/חָכְמָ֔ה בִּ/שְׁא֕וֹל אֲשֶׁ֥ר אַתָּ֖ה הֹלֵ֥ךְ שָֽׁמָּ/ה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/009/010.yaml
  text: Whatever your hand finds to do, do it with your strength, for there is no work or planning or knowledge or wisdom in Sheol, where you are going.
translation:
  language: zh_hans
  text: 凡你手所能做的事，都要尽力去做，因为在你将要去的阴间[a]，没有工作，没有筹划，没有知识，也没有智慧。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“坟墓”或“死人所在之处”。希伯来语“示阿勒”在旧约中指死人所在之处或状态。
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּל אֲשֶׁר
  choice: 凡……的事，都
  rationale: 表达不受限制的关系范围，既保留“凡是／一切”的全面意味，也符合现代汉语表达。
- source_word: תִּמְצָא יָדְךָ
  choice: 你手所能
  rationale: 希伯来语直译为“你手所找到的”，是指手边有机会、有能力从事的事；译作“你手所能”保留“手”的意象，同时避免生硬误解。
- source_word: לַעֲשׂוֹת
  choice: 做
  rationale: עשה在此意义宽泛，泛指从事或完成某事，“做”最自然贴切。
- source_word: בְּכֹחֲךָ
  choice: 尽力
  rationale: 指运用自己所有或现有的力量去行动；“尽力”是简洁自然的现代汉语，没有把重点转为结果保证。
- source_word: עֲשֵׂה
  choice: 去做
  rationale: 命令式承接前面的事项；加“去”使汉语劝勉语气自然有力。
- source_word: כִּי אֵין
  choice: 因为……没有
  rationale: כִּי在此说明劝勉的理由，译作“因为”清楚直接。
- source_word: מַעֲשֶׂה
  choice: 工作
  rationale: 在此指实际活动或作为，“工作”贴合上下文，且不额外赋予道德含义。
- source_word: חֶשְׁבּוֹן
  choice: 筹划
  rationale: 该词可指计算、谋划或筹算；此处与工作、知识和智慧并列，“筹划”最符合语境。
- source_word: דַעַת
  choice: 知识
  rationale: 保留该词通常的认知含义，并与“智慧”形成自然并列。
- source_word: חָכְמָה
  choice: 智慧
  rationale: 符合传道书的智慧文学语境，也是该词稳定而宽泛的对应表达。
- source_word: בִּשְׁאוֹל
  choice: 在……阴间
  rationale: “阴间”是现代中文圣经语境中对Sheol较为简洁且不等同于“地狱”的表达，指死人所在之处或状态；以脚注说明其语义范围。
- source_word: אֲשֶׁר אַתָּה הֹלֵךְ שָׁמָּה
  choice: 你将要去的
  rationale: 自然表达该关系从句所指的目的地；“将要去”也传达分词所呈现的趋向。
theological_decisions:
- issue: שְׁאוֹל的译法
  choice: 阴间
  alternative: 坟墓；死人所在之处；音译“示阿勒”
  rationale: 经文从传道书的视角谈死亡之后地上活动的止息。“阴间”保留其作为死人领域的广义概念，又避免误译为带有后期惩罚含义的“地狱”；脚注列出解释性替代说法，以保留词义范围。
translation_notes:
  register: 采用庄重、简洁而自然的现代标准汉语。“凡……都要……”保留劝勉的全面性；“你手所能”保留原文“手”的意象，并传达实际能力与机会；四个否定成分逐项重复“没有”，增强清晰度和节奏。
