base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/009/007.yaml
  text: Go[a], eat your bread with joy, and drink your wine with a glad heart, for God has already approved your works.
translation:
  language: zh_hans
  text: 去吧，欢欢喜喜地吃你的饼，带着欢畅的心喝你的酒，因为上帝已经悦纳[a]你的作为。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“已经认可你所做的事”或“已经喜悦你的作为”。
    reason: 原文动词 רָצָה 可指悦纳、认可或喜悦；这些译法分别突出其语义的不同侧面。
lexical_decisions:
- source_word: לֵךְ
  choice: 去吧
  rationale: 命令式在这里惯用于引出劝勉；“去吧”既保留原文的推动语气，也符合现代汉语表达。
- source_word: בְּשִׂמְחָה
  choice: 欢欢喜喜地
  rationale: 介词短语表示方式；叠词表达自然、明快，准确传达喜乐地享用之意。
- source_word: לַחְמֶךָ
  choice: 你的饼
  rationale: 保留“饼”的具体意象；此词虽可泛指食物，但本句与酒并列，直译清楚自然。
- source_word: בְלֶב טוֹב
  choice: 心里欢畅地
  rationale: 原文直译为“以美好的心”，是指内心喜悦、畅快；译文保留“心”的意象，同时避免生硬的“好心”。
- source_word: יֵינֶךָ
  choice: 你的酒
  rationale: 按原文直译，语境明确，无须泛化为饮料。
- source_word: כְבָר
  choice: 已经
  rationale: 表达上帝的悦纳先于并构成前面劝勉的根据。
- source_word: רָצָה
  choice: 悦纳
  rationale: 该动词可表示喜悦、赞许或接纳；“悦纳”兼具恩宠与接受的语义，也不把经文限定为单纯的道德审批。
- source_word: מַעֲשֶׂיךָ
  choice: 你的作为
  rationale: 概括人的行动与所做之事，较“工作”宽泛，也比“功德”中性，避免引入赚取救恩的含义。
theological_decisions:
- issue: 末句所说上帝悦纳人的作为有何含义
  choice: 译作“上帝已经悦纳了你的作为”，表达上帝先有的有利看顾，并以此作为享受生活恩赐的根据。
  alternative: 也可理解为“上帝喜悦你的作为”或“上帝认可你所做的事”。
  rationale: רָצָה 的含义涵盖喜悦、认可和有利地接纳。经文本身没有说明这种悦纳是礼仪性的，也没有教导人靠行为赚取救恩，因此保留其正面而开放的语义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“欢欢喜喜地”使劝勉语气自然鲜明；“心里欢畅地”保留希伯来文的“心”意象；“悦纳”适度保留神学张力，并用脚注列出主要词义选择。
