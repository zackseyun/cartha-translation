  yaml_path: translation/ot/ecclesiastes/009/017.yaml
  text: The words of the wise are heard in quiet more than the shouting of a ruler among fools[a][b].
translation:
  language: zh_hans
  text: 在安静中听来的智慧人的话，胜过统治者在愚昧人中的呼喊。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“智慧人的话在安静中更被听见，胜过统治者在愚昧人中的呼喊。”希伯来文在“被听见”后用比较结构；这可译为“更被听见”，也可按中文习惯表达为智慧人的话“胜过”那呼喊。
    reason: lexical_alternative
  - marker: b
    text: “在愚昧人中”也可被理解为“统管愚昧人”，但这里的介词更自然地表示所在之处或与某群人的关联。
    reason: lexical_alternative
lexical_decisions:
- source_word: דִּבְרֵי חֲכָמִים
  choice: 智慧人的话
  rationale: 保留名词性结构及复数形容词作实体名词的概括意义，不额外限定性别。
- source_word: בְּנַחַת
  choice: 在安静中
  rationale: נַחַת表示安静、平和或从容；此译保留介词加名词的形式，并与后文的大声呼喊形成对照。
- source_word: נִשְׁמָעִים
  choice: 被听见
  rationale: 按שׁמע的Niphal被动分词直译，避免提前解释为“被听从”或“受重视”。
- source_word: מִזַּעֲקַת
  choice: 胜过……大声呼喊
  rationale: מִן在此构成比较；זַעֲקָה指呼喊、叫嚷。中文用“胜过”自然表达比较，同时脚注保留另一种句法理解。
- source_word: מוֹשֵׁל
  choice: 统治者
  rationale: 该分词名词指行使权柄的人；“统治者”宽泛而贴近原义。
- source_word: בַּכְּסִילִים
  choice: 在愚昧人中
  rationale: בְּ较自然地表示位置或群体关联，即“在……中”；不直接解释为支配关系。
theological_decisions:
- issue: 比较结构的含义
  choice: 译为“被听见，胜过”
  alternative: “安静听到的智慧人的话，比……更好”
  rationale: 原文保留被动的“被听见”并以מִן引出比较对象；正文尽量维持这一结构，不把比较明确改写成价值判断。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“在安静中被听见”略带原文式凝练，以保存被动语态及“安静”与“呼喊”的鲜明对照；脚注说明比较结构和介词的真实歧义。
