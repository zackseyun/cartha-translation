base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/009/004.yaml
  text: For whoever is joined to all the living has hope[b][a], because a living dog is better than a dead lion.
translation:
  language: zh_hans
  text: 凡仍归在活人之列的，都还有指望[b][a]；因为活狗胜过死狮。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或作：“凡在众活人中被拣选的，就有把握。”开头分句的希伯来语形式较难确定，也有人作其他理解。
    reason: alternative_reading
  - marker: b
    text: “指望”也可译作“把握”、“信心”或“保障”。
    reason: lexical_alternative
lexical_decisions:
- source_word: יבחר
  choice: 仍与……同在
  rationale: 该词的辅音形式与马所拉读法所表达的“被拣选”在此语境中较难理解；上下文及古代译本支持把整句理解为仍归在活人之列。译作“仍与……同在”使生者与死者的对比清楚，同时不把有争议的词义说得过死。
- source_word: אֶל כָּל הַחַיִּים
  choice: 与一切活人同在
  rationale: 该短语表示与活人群体的关联；“与一切活人同在”在现代汉语中自然，也保留介词 אֶל 的关系意味。
- source_word: בִּטָּחוֹן
  choice: 指望
  rationale: 该名词可表示把握、安全或信心；本节强调只要活着，可能性仍未断绝，因此“指望”最切合上下文，同时以脚注保留其他词义。
- source_word: לְכֶלֶב חַי
  choice: 活狗
  rationale: 直译并保持格言式的简洁。古代语境中狗地位卑下，正与狮子的尊贵形成强烈反差。
- source_word: טוֹב מִן
  choice: 胜过
  rationale: 这是标准比较结构；“胜过”简练有力，适合本句的箴言式表达。
- source_word: הָאַרְיֵה הַמֵּת
  choice: 死狮
  rationale: 希伯来语虽有定冠词，汉语格言式比较不必显明定指；“死狮”自然地表达类别性的对照。
theological_decisions:
- issue: 开头 יבחר 所在分句的含义
  choice: 凡仍与一切活人同在的
  alternative: 凡在一切活人中被拣选的；凡仍算在一切活人之中的
  rationale: 马所拉文本按通常“拣选”的词义理解时句意艰涩，而上下文着重说明生存本身相对于死亡的优势。正文采用“仍与……同在”，但以脚注明示原文困难及另一种可能，避免把释义上的判断变成教义断言。
translation_notes:
  register: 采用现代、庄重而简明的普通话。保留原文格言的鲜明对比，以“活狗胜过死狮”呈现简洁力度；两个脚注标记均置于相关正文“指望”之后，并按用户所给英文咨询层的顺序标为[b][a]。
