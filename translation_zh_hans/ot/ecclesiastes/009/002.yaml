reference: Ecclesiastes 9:2
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: הַ/כֹּ֞ל כַּ/אֲשֶׁ֣ר לַ/כֹּ֗ל מִקְרֶ֨ה אֶחָ֜ד לַ/צַּדִּ֤יק וְ/לָ/רָשָׁע֙ לַ/טּוֹב֙ וְ/לַ/טָּה֣וֹר וְ/לַ/טָּמֵ֔א וְ/לַ/זֹּבֵ֔חַ וְ/לַ/אֲשֶׁ֖ר אֵינֶ֣/נּוּ זֹבֵ֑חַ כַּ/טּוֹב֙ כַּֽ/חֹטֶ֔א הַ/נִּשְׁבָּ֕ע כַּ/אֲשֶׁ֖ר שְׁבוּעָ֥ה יָרֵֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/009/002.yaml
  text: 'All is the same for all: one fate comes to the righteous and to the wicked[a], to the good and to the clean and to the unclean, to the one who sacrifices and to the one who does not sacrifice; as the good one, so the sinner[b]; the one who swears is as the one who fears an oath.'
translation:
  language: zh_hans
  text: 众人的遭遇都一样：义人和恶人、好人、洁净的人和不洁净的人、献祭的和不献祭的，都有同一个遭遇[a]；好人怎样，罪人也怎样；起誓的怎样，惧怕誓言的也怎样[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “同一个遭遇”也可译作“同一件事”或“同样的命运”。
    reason: lexical_alternative
  - marker: b
    text: “惧怕誓言的”也可理解为“不敢起誓的”。
    reason: alternative_reading
lexical_decisions:
- source_word: הַכֹּל כַּאֲשֶׁר לַכֹּל
  choice: 众人所遭遇的全都一样
  rationale: 希伯来语开头高度省略；此译以自然现代汉语表达其总括性判断，同时与下文“同一个结局”衔接。
- source_word: מִקְרֶה אֶחָד
  choice: 同一个结局
  rationale: מִקְרֶה 指临到人的遭遇；结合上下文，尤其死亡这一共同归宿在望。“结局”比“事件”自然，也避免“命运”可能带来的宿命论色彩；脚注保留其他可能。
- source_word: לַצַּדִּיק וְלָרָשָׁע
  choice: 义人和恶人
  rationale: 保留经文中标准的伦理对举，不将其弱化为一般性的好坏评价。
- source_word: לַטּוֹב
  choice: 好人
  rationale: 不与“义人”合并，保留原文连续列举、语义有所重叠的修辞效果。
- source_word: לַטָּהוֹר וְלַטָּמֵא
  choice: 洁净的人和不洁净的人
  rationale: “洁净／不洁净”能保留礼仪范畴，也不把词义限定为纯粹道德意义。
- source_word: לַזֹּבֵחַ וְלַאֲשֶׁר אֵינֶנּוּ זֹבֵחַ
  choice: 献祭的和不献祭的
  rationale: 直接保留两种礼仪行为的对比，并采用简洁自然的汉语结构。
- source_word: כַּטּוֹב כַּחֹטֶא
  choice: 好人怎样，罪人也怎样
  rationale: 重现希伯来语的比较结构，并保留 חֹטֵא 的传统圣经用语“罪人”。
- source_word: הַנִּשְׁבָּע כַּאֲשֶׁר שְׁבוּעָה יָרֵא
  choice: 起誓的怎样，惧怕誓言的也怎样
  rationale: 尽量保留原文“惧怕誓言”的含混性，既可能指不敢起誓，也可能含有敬畏、谨慎对待誓言之意。
theological_decisions:
- issue: מִקְרֶה אֶחָד 所指的共同遭遇
  choice: 同一个结局
  alternative: 同一件事；同样的命运
  rationale: 上下文很可能以死亡这一共同归宿为焦点，但本节本身使用的是较宽泛的“遭遇”用语。“结局”能传达其指向，又不引入一套非人格的宿命论。
- issue: 洁净与不洁净的性质
  choice: 保留“洁净／不洁净”的礼仪性措辞
  alternative: 纯洁／污秽；道德清白／败坏
  rationale: 原文把礼仪类别置于伦理和敬拜类别之间，不应擅自将其纯粹道德化。
- issue: 末尾关于誓言的比较
  choice: 正文作“惧怕誓言”
  alternative: 不敢起誓；敬畏誓言
  rationale: 希伯来语可指害怕起誓，也可表达对誓言谨慎或敬畏的态度；正文保留张力，脚注说明较明确的理解。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。通过成对列举和“怎样……也怎样”的句式保留原文的节奏；避免使用带有强烈哲学宿命论色彩的“命运”作为正文措辞。
