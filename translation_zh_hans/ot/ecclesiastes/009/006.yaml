source:
  edition: WLC
  text: גַּ֣ם אַהֲבָתָ֧/ם גַּם שִׂנְאָתָ֛/ם גַּם קִנְאָתָ֖/ם כְּבָ֣ר אָבָ֑דָה וְ/חֵ֨לֶק אֵין לָ/הֶ֥ם עוֹד֙ לְ/עוֹלָ֔ם בְּ/כֹ֥ל אֲשֶֽׁר נַעֲשָׂ֖ה תַּ֥חַת הַ/שָּֽׁמֶשׁ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/009/006.yaml
  text: Their love[a], their hatred, and their jealousy have already perished, and they no longer have a share forever in anything that is done under the sun.
translation:
  language: zh_hans
  text: 他们的爱、恨和嫉妒[a]早已消逝；他们永远不再有份于日光之下所发生的一切。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “嫉妒”或译“热忱”或“妒忌”。
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם אַהֲבָתָם גַּם שִׂנְאָתָם גַּם קִנְאָתָם
  choice: 他们的爱、恨和嫉妒
  rationale: 重复的גַּם逐项连接并强调三个名词。汉语用并列结构自然表达其累积语气；三个带3复阳词尾的抽象名词译作“他们的爱、恨和嫉妒”。
- source_word: קִנְאָתָם
  choice: 他们的嫉妒
  rationale: קִנְאָה可指嫉妒、热忱或妒忌；本节与爱、恨并列，描写人死后不复参与世上事务时消逝的情感，“嫉妒”最切合语境，同时以脚注保留其他词义。
- source_word: כְּבָר אָבָדָה
  choice: 早已消逝
  rationale: כְּבָר表示状态已经形成，אָבַד表示灭失、不复存在；“早已消逝”既自然，也保留完成和丧失之意。希伯来语动词为阴性单数，可视为统摄前述并列诸项，汉语无需标示数的一致。
- source_word: וְחֵלֶק אֵין לָהֶם עוֹד לְעוֹלָם
  choice: 他们永远不再有份于
  rationale: חֵלֶק在《传道书》中常指人在生活和劳作中的份；אֵין לָהֶם עוֹד表示“不再有”，לְעוֹלָם强调这种排除的持久性。
- source_word: בְּכֹל אֲשֶׁר נַעֲשָׂה
  choice: 所发生的一切
  rationale: 该短语涵盖全面；נַעֲשָׂה为被动形式，在此可自然理解为世上所做、所发生的一切。“所发生的一切”在现代汉语中流畅且不缩窄范围。
- source_word: תַּחַת הַשָּׁמֶשׁ
  choice: 日光之下
  rationale: 这是《传道书》的关键惯用语，指地上的生活领域；“日光之下”庄重、清楚，并能保持全书用语一致。
theological_decisions:
- issue: 本节对死者与世上事务之关系的陈述范围
  choice: 译文表明死者永远不再有份于“日光之下”发生的事。
  alternative: 将本节理解为关于死者在一切层面都毫无意识的普遍形而上陈述。
  rationale: 原文以“日光之下”明确限定陈述范围，重点是死者不再参与地上的生活和事务。译文保留这一界限，不据此额外判定死后中间状态。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“爱、恨和嫉妒”保持原文三项并列；分号清楚呈现情感消逝与不再参与世事之间的推进关系。
