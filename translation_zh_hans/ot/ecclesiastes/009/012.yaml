revisions:
- from: 因为人连自己的时刻也不知道：鱼怎样被恶网捕住[a]，鸟怎样被网罗捉住，世人也照样在祸患的时刻陷入网罗[b]；这时刻忽然临到他们。
  to: 因为人连自己的时刻也不知道：正如鱼被捕在凶险的网中，又如鸟被捉在网罗里，世人也照样在祸患的时刻被网罗住；这时刻忽然临到他们。
  rationale: 调整比喻句式，使其符合原文“如同鱼……又如鸟……世人也如此”的平行结构；并将“陷入网罗”改为“被网罗住”，恢复原文被动的受捕含义。脚注标记应分别置于“凶险的网[a]”和“被网罗住[b]”之后。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T06:59:41Z'
review_pass:
  verdict: revise
  source_fidelity: 译文总体准确地保留了泛指的“人”、未知的“自己的时刻”、鱼与鸟被捕的比喻，以及祸患时刻猝然临到的意思。但“鱼怎样……鸟怎样……”在现代汉语陈述句中易被读成疑问式比较；“世人……陷入网罗”又将希伯来文被动的“被捕获／被网住”弱化为较主动的“陷入”。
  naturalness: “正如……又如……世人也照样……”更符合现代标准汉语中比喻—结论的句法，并清楚呈现原文平行结构。“被网罗住”保留意象且自然；以分号连接末句，突出突发临到的时刻。
  terminology: “人／世人”恰当地分别反映泛指单数 הָאָדָם 和集体惯用语 בְּנֵי הָאָדָם。“凶险的网”表达 רָעָה 在此处的伤害性，不将网道德化。“祸患的时刻”可准确表达 לְעֵת רָעָה，末句仍明确回指“时刻”，未擅自补入“灾难”。
  issues:
  - severity: medium
    issue: “鱼怎样被……，鸟怎样被……”的比较结构不自然。
    rationale: 原文的 כַּ／וְכַ 引出的是“正如……又如……”的明喻，不是询问或说明“怎样”被捕。改为明确的比喻结构可避免汉语歧义。
  - severity: medium
    issue: “世人……陷入网罗”没有充分表达 יֻקָּשִׁים 的被动捕捉意义。
    rationale: 该词表示被设网捕获、被罗住；“陷入”在汉语中较易使人理解为主体自行落入，且淡化了与鱼鸟“被捕”的平行。
  revised_text: 因为人连自己的时刻也不知道：正如鱼被捕在凶险的网中，又如鸟被捉在网罗里，世人也照样在祸患的时刻被网罗住；这时刻忽然临到他们。
  revised_footnotes:
  - marker: a
    text: “凶险的网”也可译作“恶网”或“致命的网”。希伯来文的“恶”在这里强调这网所带来的伤害。
    reason: 说明“恶”在此并非指网具有道德责任，而指其有害、致命的性质。
  - marker: b
    text: “被网罗住”直译为“被设网捕住”。
    reason: 交代希伯来文被动动词所保留的捕捉意象。
  revision_rationale: 调整比喻句式，使其符合原文“如同鱼……又如鸟……世人也如此”的平行结构；并将“陷入网罗”改为“被网罗住”，恢复原文被动的受捕含义。脚注标记应分别置于“凶险的网[a]”和“被网罗住[b]”之后。
