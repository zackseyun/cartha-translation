  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כִּ֡י גַּם֩ לֹֽא יֵדַ֨ע הָ/אָדָ֜ם אֶת עִתּ֗/וֹ כַּ/דָּגִים֙ שֶׁ/נֶּֽאֱחָזִים֙ בִּ/מְצוֹדָ֣ה רָעָ֔ה וְ/כַ֨/צִּפֳּרִ֔ים הָ/אֲחֻז֖וֹת בַּ/פָּ֑ח כָּ/הֵ֗ם יֽוּקָשִׁים֙ בְּנֵ֣י הָֽ/אָדָ֔ם לְ/עֵ֣ת רָעָ֔ה כְּ/שֶׁ/תִּפּ֥וֹל עֲלֵי/הֶ֖ם פִּתְאֹֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/009/012.yaml
  text: 'For man does not even know his time: like fish that are caught in a cruel net[a], and like birds that are caught in a snare, so the sons of man are trapped at an evil time[c][b], when it suddenly falls upon them.'
translation:
  language: zh_hans
  text: 因为人连自己的时刻也不知道：正如鱼被捕在凶险的网中，又如鸟被捉在网罗里，世人也照样在祸患的时刻被网罗住；这时刻忽然临到他们。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָאָדָם
  choice: 人
  rationale: 此处是泛指单数，现代汉语用“人”既能保留单数表达，也自然涵盖全人类。
- source_word: עִתּוֹ
  choice: 自己的时刻
  rationale: עֵת可指时候、时刻；结合后文突然而至的灾祸，此处保留“时刻”的开放性，不擅自限定为死亡日期。
- source_word: מְצוֹדָה רָעָה
  choice: 恶网
  rationale: 直译保留רָעָה与后文“祸患的时刻”之间的词汇呼应；这里的“恶”指网具有伤害、致命的性质，并非网具备道德责任。
- source_word: פָּח
  choice: 网罗
  rationale: “网罗”是现代汉语中庄重且易懂的捕鸟器具表达，也能承接本节反复出现的设网捕捉意象。
- source_word: יֽוּקָשִׁים
  choice: 陷入网罗
  rationale: 该动词为被动意义，表示被设网捕获；汉语以“陷入网罗”自然传达被困、被捕的意象。
- source_word: בְּנֵי הָאָדָם
  choice: 世人
  rationale: 这是指人类的希伯来语惯用语。“世人”比逐字译作“人的众子”更符合现代汉语，同时保留集体所指。
- source_word: לְעֵת רָעָה
  choice: 在祸患的时刻
  rationale: רָעָה在此语境指灾祸或不幸。“祸患”避免把时间本身理解成道德上的邪恶。
- source_word: כְּשֶׁתִּפּוֹל עֲלֵיהֶם פִּתְאֹם
  choice: 这时刻忽然临到他们
  rationale: 阴性单数动词最自然地回指阴性名词עֵת“时刻”；明说“这时刻”使汉语指代清楚，又不增添“灾难”等原文未在该分句重述的名词。
theological_decisions:
- issue: “自己的时刻”是否特指死亡时刻
  choice: 保留为“自己的时刻”
  alternative: 自己的死期
  rationale: 上下文可使人联想到死亡或灾祸，但希伯来文本只说“他的时刻”，不应把潜在含义收窄为唯一解释。
- issue: הָאָדָם与בְּנֵי הָאָדָם的人类指称
  choice: 分别译为“人”和“世人”
  alternative: 人／人的众子
  rationale: 既反映前者的泛指单数和后者的集体惯用语，也避免在汉语中制造不必要的性别限定或生硬的希伯来式表达。
- issue: 突然而临者的指代
  choice: 理解为前述“祸患的时刻”
  alternative: 补译为“灾祸忽然临到他们”
  rationale: 动词的阴性单数形式与עֵת相合；译文明确回指“时刻”，不把隐含灾祸实体化为原文未明说的主语。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。以冒号和分号呈现比喻与结论的结构；避免生硬照搬“人的众子”，并保留“恶网／祸患的时刻”的语义呼应。
