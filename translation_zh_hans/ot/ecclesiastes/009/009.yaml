source:
  edition: WLC
  text: רְאֵ֨ה חַיִּ֜ים עִם אִשָּׁ֣ה אֲשֶׁר אָהַ֗בְתָּ כָּל יְמֵי֙ חַיֵּ֣י הֶבְלֶ֔/ךָ אֲשֶׁ֤ר נָֽתַן לְ/ךָ֙ תַּ֣חַת הַ/שֶּׁ֔מֶשׁ כֹּ֖ל יְמֵ֣י הֶבְלֶ֑/ךָ כִּ֣י ה֤וּא חֶלְקְ/ךָ֙ בַּֽ/חַיִּ֔ים וּ/בַ/עֲמָ֣לְ/ךָ֔ אֲשֶׁר אַתָּ֥ה עָמֵ֖ל תַּ֥חַת הַ/שָּֽׁמֶשׁ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/009/009.yaml
  text: Enjoy life with the wife whom you love all the days of your fleeting life that he has given you under the sun—all your fleeting days—for that is your portion in life and in your labor at which you toil under the sun[a][b][c].
translation:
  language: zh_hans
  text: 要与你所爱的妻子一同享受人生，度过他在日光之下赐给你的虚空人生中的所有日子，就是你一切虚空的日子；因为这是你在生命中和在日光之下劳碌中的份。[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “享受人生”直译为“看生命”或“看生活”，是指经历或享受生活。
    reason: lexical_alternative
  - marker: b
    text: “虚空”原文为希伯来语 hebel，字面意象是气息或雾气；在这里强调生命短暂、虚幻而难以把握。
    reason: lexical_alternative
  - marker: c
    text: “他赐给”中的主语在希伯来文里没有明说；从上下文看是指神。
    reason: alternative_reading
lexical_decisions:
- source_word: רְאֵה חַיִּים
  choice: 享受人生
  rationale: 字面为“看见生命”，在此是希伯来语习语，指亲身经历并享受生活；“享受人生”在现代汉语中自然，也符合本段劝人领受生活之乐的语境。
- source_word: עִם אִשָּׁה אֲשֶׁר אָהַבְתָּ
  choice: 与你所爱的妻子一同
  rationale: אִשָּׁה 本身没有冠词，形式上也可译“一个女子”，但第二人称语境及“你所爱的”表明所指是配偶；译作“妻子”最自然。完成式 אָהַבְתָּ 在这一劝勉中表达持续的关系，译作“所爱的”。
- source_word: חַיֵּי הֶבְלֶךָ / יְמֵי הֶבְלֶךָ
  choice: 你虚空的一生／你一切虚空的日子
  rationale: הֶבֶל 的基本意象是气息、雾气，引申为短暂、虚幻、难以把握。“虚空”保留《传道书》的关键词及其多义张力，不单方面限定为“毫无意义”；脚注说明其意象。
- source_word: אֲשֶׁר נָתַן לְךָ
  choice: 他赐给你的
  rationale: 希伯来文动词的主语是未明说的第三人称阳性单数；上下文可理解为神，但本句没有明说，故正文保留“他”，并在脚注交代。
- source_word: תַּחַת הַשֶּׁמֶשׁ
  choice: 日光之下
  rationale: 这是《传道书》的标志性表达，指现世生活的领域；“日光之下”既准确又有庄重的文学感。
- source_word: כִּי הוּא חֶלְקְךָ
  choice: 因为这是……所得的一份
  rationale: חֵלֶק 指分得、获派的一份。“所得的一份”在汉语中可涵盖人生与劳碌中的份额，也避免把它过度解释为命定的“福分”。
- source_word: בַּחַיִּים וּבַעֲמָלְךָ אֲשֶׁר אַתָּה עָמֵל
  choice: 在一生中，以及……劳碌所得的一份
  rationale: עָמָל 兼有劳动、辛劳之意；名词和同根分词相连，直译会形成生硬重复。此处以“劳碌所得”传达持续辛劳及其中所得份额，保持自然汉语。
theological_decisions:
- issue: נָתַן（“赐给”）的隐含主语
  choice: 正文译作“他赐给你的”，不直接补出“神”。
  alternative: 译作“神赐给你的”，明确上下文所暗示的赐予者。
  rationale: 《传道书》上下文把生命和享受视为神所赐，但此分句没有明确写出“神”。保留代词可忠实呈现原文的含蓄，同时由脚注说明语境。
- issue: הֶבֶל 在本节中的含义
  choice: 正文保留“虚空”，脚注说明气息、雾气以及短暂无常的意象。
  alternative: 译作“短暂”或“转瞬即逝”，将重点明确放在生命的短促上。
  rationale: 本节确实突出日子的短暂，但 הֶבֶל 在全书中也包含虚幻、难以把握和令人挫败等张力；“虚空”配合脚注比单一释义更能保存其神学与文学多义性。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“日光之下”“虚空”保留《传道书》的标志性措辞；调整长句语序，使劝勉主干“要……享受人生”清楚可读，同时保留原文两次“虚空”及两次“日光之下”的回环。
