- from: 在他赐给你的、日光之下这虚空一生的所有日子，就是你一切虚空的日子，要与你所爱的妻子一同享受人生；因为这是你在一生中，以及在日光之下劳碌所得的一份。[a][b][c]
  to: 要与你所爱的妻子一同享受人生，度过他在日光之下赐给你的虚空人生中的所有日子，就是你一切虚空的日子；因为这是你在生命中和在日光之下劳碌中的份。[a][b][c]
  rationale: 修订将“要与你所爱的妻子一同享受人生”置于句首，反映原文祈使语气并改善汉语可读性。“他在日光之下赐给你的虚空人生中的所有日子”对应“他在日光之下赐给你的虚空生命的一切日子”；随后保留“你一切虚空的日子”的重复。末句以“在生命中和在日光之下劳碌中的份”对应原文的两个介词短语和“份”，不添加“劳动报酬”的含义。
