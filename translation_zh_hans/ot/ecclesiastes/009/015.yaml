base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/009/015.yaml
  text: And there was found in it a poor wise man[a], and he delivered the city by his wisdom; yet no one remembered that poor man.
translation:
  language: zh_hans
  text: 城里曾有[a]一个贫穷而有智慧的人；他凭自己的智慧救了那城，可是没有人记得那个贫穷人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “城里曾有”原文也可译作“他在城里找到一个贫穷而有智慧的人”；原文没有说明“他”是谁。
    reason: 保留וּמָצָא主动词形与不定存在式理解之间的真实歧义。
lexical_decisions:
- source_word: וּמָצָא בָהּ
  choice: 城里有
  rationale: 原文动词是Qal完成式第三人称阳性单数，字面可作“他在其中找到了”；但主语并未明说，语境中也可作不定存在表达。正文用自然的现代汉语“城里有”，不擅自补出主语，并以脚注保留较贴近词形的译法。
- source_word: אִישׁ מִסְכֵּן חָכָם
  choice: 一个贫穷而有智慧的人
  rationale: אִישׁ指一名男子，但现代汉语“一个……的人”已能自然指称该男性个体；מִסְכֵּן表示贫穷或社会地位卑微，חָכָם表示有智慧。“贫穷而有智慧”清楚保留两项描述。
- source_word: וּמִלַּט הוּא אֶת־הָעִיר
  choice: 他……救了那城
  rationale: Piel形态的מלט带直接宾语“城”，表示解救、救出；“救了那城”简洁自然。独立代词הוּא加强主语，汉语以“他”明确承接前述智慧人。
- source_word: בְּחָכְמָתוֹ
  choice: 凭自己的智慧
  rationale: 介词בְּ在此表示手段；“凭”自然传达工具或凭借之意，“自己的”准确回指该人的智慧。
- source_word: וְאָדָם לֹא זָכַר
  choice: 可是没有人记得
  rationale: אָדָם在否定句中泛指任何人，并非专指男性；“没有人”是现代汉语准确自然的表达。连接词וְ在此形成反差，译作“可是”。זָכַר直译为“记得”。
- source_word: הָאִישׁ הַמִּסְכֵּן הַהוּא
  choice: 那个贫穷人
  rationale: 定冠词和指示成分הַהוּא共同指回前述特定人物；“那个贫穷人”保留原文重复“贫穷”所形成的强调。
theological_decisions:
- issue: וּמָצָא的未明主语及存在式理解
  choice: 正文译作“城里有”，保留不定存在意义
  alternative: “他在城里找到一个贫穷而有智慧的人”
  rationale: 马所拉文本的词形为主动第三人称阳性单数，但句中没有明确主语，历来可按不定用法理解。正文不把上一节的“大王”强行设为主语；脚注保留严格按词形理解的可能。
- issue: אָדָם在否定泛指句中的范围
  choice: 没有人
  alternative: 没有一个男人
  rationale: 此处אָדָם泛指人类中的任何个体。“没有人”既准确反映范围，也避免现代读者误解为只有男性没有记得他，不涉及额外的教派性解释。
translation_notes:
  register: 采用现代、庄重而易懂的叙述语体。“贫穷而有智慧的人”比堆叠形容词更符合普通话习惯；分号突出他救城与无人记得他之间的反差。
