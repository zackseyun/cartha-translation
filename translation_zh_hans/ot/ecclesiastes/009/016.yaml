base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/009/016.yaml
  text: And I said[a], “Wisdom is better than strength,” but the wisdom of the poor man is despised[c][b], and his words are not heard.
translation:
  language: zh_hans
  text: 我说：“智慧胜过力量[a]；然而，穷人的智慧受人轻视[b]，没有人听他的话[c]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “力量”也可译作“勇力”或“权势”。
    reason: lexical_alternative
  - marker: b
    text: 原文为单数“那穷人”，很可能回指上一节那位贫穷的智慧人。
    reason: cross_reference
  - marker: c
    text: 也可译作“他的话不被听取”或“无人理会他的话”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמַרְתִּי אָ֔נִי
  choice: 于是我说
  rationale: 第一人称完成式配合连接词，引出传道者根据前文所得的反思或结论；“于是”在现代汉语中自然，又不把逻辑关系说得过强。
- source_word: טוֹבָה חָכְמָה מִגְּבוּרָה
  choice: 智慧胜过勇力
  rationale: 形容词加比较介词表达优越性。“勇力”既保留גְּבוּרָה所含的力量、能力意味，也适合前文以智慧救城与强力相对照的语境。
- source_word: וְחָכְמַת
  choice: 然而，……的智慧
  rationale: 连接词字面可译“而/和”，但上下文形成明显转折：智慧虽更优越，穷人所具的智慧却遭轻视；“然而”自然呈现这一张力。
- source_word: הַמִּסְכֵּן
  choice: 穷人
  rationale: 定冠词加阳性单数名词化形容词，指一个贫穷的人；语境很可能回指上一节那位“贫穷的智慧人”。汉语“穷人”自然且不必重复性别。
- source_word: בְּזוּיָה
  choice: 受人轻视
  rationale: 该被动分词表示处于被鄙视、轻看的状态。“受人轻视”保留被动意义，也符合现代汉语表达。
- source_word: וּדְבָרָיו
  choice: 他的话
  rationale: דָּבָר复数加第三人称单数阳性后缀，在此指这人的言语或劝告；直译为“他的话”简洁自然。
- source_word: אֵינָם נִשְׁמָעִים
  choice: 无人听从
  rationale: 否定存在词与נשׁמע的被动分词表示他的话得不到听取。此处语境侧重不被采纳，“无人听从”较自然，同时以脚注保留“无人听见/无人肯听”的语义可能。
theological_decisions:
- issue: 智慧的优越与智慧者遭轻视之间的张力
  choice: 以“然而”明确句内转折，同时保留两项陈述并置
  alternative: 把后半句解释成智慧只在受尊重时才有价值
  rationale: 原文既断言智慧胜过勇力，又观察穷人的智慧被轻视，并未消解两者之间的张力；译文不加入额外的神学或哲学结论。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“勇力”略带经文语体但仍易懂；“受人轻视”“无人听从”清晰呈现社会对穷人智慧及言语的漠视。所有脚注标记均置于对应词句之后。
