id: ECC.9.1
reference: Ecclesiastes 9:1
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כִּ֣י אֶת כָּל זֶ֞ה נָתַ֤תִּי אֶל לִבִּ/י֙ וְ/לָ/ב֣וּר אֶת כָּל זֶ֔ה אֲשֶׁ֨ר הַ/צַּדִּיקִ֧ים וְ/הַ/חֲכָמִ֛ים וַ/עֲבָדֵי/הֶ֖ם בְּ/יַ֣ד הָ/אֱלֹהִ֑ים גַּֽם אַהֲבָ֣ה גַם שִׂנְאָ֗ה אֵ֤ין יוֹדֵ֨עַ֙ הָֽ/אָדָ֔ם הַ/כֹּ֖ל לִ/פְנֵי/הֶֽם־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/009/001.yaml
  text: 'For I laid all this to my heart[a], even to examine all this: that the righteous and the wise and their works are in the hand of God. Whether love or hate, man does not know[b]; everything is before them.'
translation:
  language: zh_hans
  text: 因为我把这一切放在心上，仔细考察这一切：义人、智慧人和他们的作为[a]都在上帝手中。是爱是恨，人都不知道[b]；一切都在他们面前。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“他们的仆人”。这里的希伯来语形式可以这样理解，但许多人按上下文理解为“他们的行为”或“他们的工作”。
    reason: alternative_reading
  - marker: b
    text: 本节末尾的希伯来文含义较难确定。可能是说，人预先不知道等着自己的是爱还是恨；也可能是说，人不能根据眼前的境遇判断自己是蒙爱还是被恨。
    reason: alternative_reading
lexical_decisions:
- source_word: נָתַתִּי אֶל לִבִּי
  choice: 把……放在心上
  rationale: 保留希伯来语“放在心上”的具体比喻，同时自然表达认真思量之意。
- source_word: וְלָבוּר
  choice: 仔细考察
  rationale: 表达辨明、查究的含义，符合传道者反思探究的语境。
- source_word: הַצַּדִּיקִים
  choice: 义人
  rationale: 智慧文学中的通行译法，保留其道德和宗教含义。
- source_word: הַחֲכָמִים
  choice: 智慧人
  rationale: 与“义人”并列自然，也保留原文对一类人的指称。
- source_word: וַעֲבָדֵיהֶם
  choice: 他们的作为
  rationale: 结合上下文理解为义人和智慧人的行为或工作；但希伯来语形式也可读作“他们的仆人”，故以脚注保留。
- source_word: בְּיַד הָאֱלֹהִים
  choice: 在上帝手中
  rationale: 保留原文关于上帝掌管与看顾的具体比喻，不进一步限定其神学细节。
- source_word: גַּם אַהֲבָה גַם שִׂנְאָה
  choice: 是爱是恨
  rationale: 简洁保留爱与恨的对举，并让下文的不确定性保持开放。
- source_word: הָאָדָם
  choice: 人
  rationale: 现代汉语中自然涵盖一般人类，不引入原文没有的性别限定。
- source_word: הַכֹּל לִפְנֵיהֶם
  choice: 一切都在他们面前
  rationale: 末句语义困难；采取贴近原文的译法，避免在正文中强行确定是未来遭遇还是眼前境况。
theological_decisions:
- issue: וַעֲבָדֵיהֶם 的含义
  choice: 他们的作为
  alternative: 他们的仆人
  rationale: 上下文聚焦义人、智慧人及其所行都在上帝手中，“作为”衔接较顺；不过辅音及马所拉读法自然支持“仆人”，因此不抹去这一真实歧义。
- issue: 爱、恨与末句的关系
  choice: 正文直译为“是爱是恨，人都不知道；一切都在他们面前”
  alternative: 人不知道将有爱还是恨等着他们；或人不能从当前境遇判断自己蒙爱还是被恨
  rationale: 希伯来文结构压缩且指向不明确。正文保留张力，脚注列出主要理解，不将其教义化为上帝爱或恨某人的确定陈述。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“放在心上”“在上帝手中”保留原文意象；末句刻意采用较贴近原文的表达，并借脚注说明歧义。正文中的[a]、[b]均与脚注对应。
