  text: עִ֣יר קְטַנָּ֔ה וַ/אֲנָשִׁ֥ים בָּ֖/הּ מְעָ֑ט וּ/בָֽא אֵלֶ֜י/הָ מֶ֤לֶךְ גָּדוֹל֙ וְ/סָבַ֣ב אֹתָ֔/הּ וּ/בָנָ֥ה עָלֶ֖י/הָ מְצוֹדִ֥ים גְּדֹלִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/009/014.yaml
  text: There was a small city[a], and few men were in it; and a great king came against it, surrounded it, and built great siegeworks against it.
translation:
  language: zh_hans
  text: 有一座小城，城里的人很少；有一位大君王前来攻打，把城围住，又修筑大型围城工事[a]来对付它。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“坚固的堡垒”，又或“巨大的攻城坡道”。希伯来语“מְצוֹדִים”可泛指围城设施或防御工事。
    reason: lexical_alternative
lexical_decisions:
- source_word: עִיר קְטַנָּה
  choice: 一座小城
  rationale: 直译该短语，并以现代汉语量词“座”自然表达；“小”也与后文君王之“大”形成对比。
- source_word: וַאֲנָשִׁים בָּהּ מְעָט
  choice: 城里的人很少
  rationale: אֲנָשִׁים在此指城中的人或居民；译作“人”符合现代汉语通常用法，也不额外限定为士兵或男丁。
- source_word: וּבָא אֵלֶיהָ
  choice: 前来攻打
  rationale: 字面可作“来到它那里”，但围城及修筑工事的军事语境清楚表明敌对行动；“前来攻打”自然呈现这一语境含义。
- source_word: מֶלֶךְ גָּדוֹל
  choice: 一位大君王
  rationale: 保留“君王”及“大”的基本意义，并与“小城”形成原文的鲜明反差。
- source_word: וְסָבַב אֹתָהּ
  choice: 把城围住
  rationale: 准确表达סבב在围城语境中的“环绕、包围”；重复“城”可避免连续代词在中文中指向不清。
- source_word: וּבָנָה עָלֶיהָ
  choice: 又修筑……来对付它
  rationale: בנה意为“建造、修筑”；עַל在此表示敌对指向。译文以“来对付它”明确工事针对该城，同时保持军事语境。
- source_word: מְצוֹדִים גְּדֹלִים
  choice: 大型围城工事
  rationale: מְצוֹדִים可泛指围城设施、堡垒或攻城坡道；“围城工事”不武断限定具体结构，“大型”保留גְּדֹלִים。
theological_decisions: []
