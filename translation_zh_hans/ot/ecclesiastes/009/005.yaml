id: ECC.9.5
reference: Ecclesiastes 9:5
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כִּ֧י הַֽ/חַיִּ֛ים יוֹדְעִ֖ים שֶׁ/יָּמֻ֑תוּ וְ/הַ/מֵּתִ֞ים אֵינָ֧/ם יוֹדְעִ֣ים מְא֗וּמָה וְ/אֵֽין ע֤וֹד לָ/הֶם֙ שָׂכָ֔ר כִּ֥י נִשְׁכַּ֖ח זִכְרָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/009/005.yaml
  text: For the living know that they will die[a], but the dead know nothing at all, and there is no longer any reward for them, because their memory is forgotten.
translation:
  language: zh_hans
  text: 因为活着的人知道自己必死，死人却一无所知[a]；他们也不再有任何报偿，因为人们对他们的记忆已经消逝。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“什么也不知道。”希伯来文的表达带有强调语气。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文并说明理由；现代汉语用“因为”能自然保留这一解释关系。
- source_word: הַחַיִּים
  choice: 活着的人
  rationale: 这是带定冠词的复数名词化形式，统指仍然活着的人；译法自然清楚。
- source_word: יוֹדְעִים שֶׁיָּמֻתוּ
  choice: 知道自己必死
  rationale: 准确表达“知道他们将会死”的内容；“必死”简洁地传达未完成式在此所指的确定未来。
- source_word: וְהַמֵּתִים
  choice: 死人却
  rationale: וְ 在此连接鲜明对比的分句，用“却”比机械译作“和”更符合汉语，同时不增添原文没有的内容。
- source_word: אֵינָם יוֹדְעִים מְאוּמָה
  choice: 一无所知
  rationale: 否定结构与 מְאוּמָה 合用，语气强烈，意为“什么也不知道”；“一无所知”自然保留这种强调。
- source_word: וְאֵין עוֹד לָהֶם שָׂכָר
  choice: 他们也不再有任何报偿
  rationale: שָׂכָר 可指工价、酬劳或报偿；此处“报偿”较能保留其宽泛含义，“不再”对应 עוֹד。
- source_word: כִּי נִשְׁכַּח זִכְרָם
  choice: 因为人们对他们的记忆已经消逝
  rationale: 保留 נִשְׁכַּח 的被遗忘结果与 זִכְרָם 所指“对他们的记念”；此译避免生硬的“他们的记忆被忘记”，并清楚表明是他们被世人遗忘。
theological_decisions:
- issue: 本节是否应被译成关于死者在所有层面绝对不存在或毫无意识的系统教义
  choice: 按传道者在本段中的直白陈述译为“死人却一无所知”，不添加限制语，也不作教义扩展。
  alternative: 增译“对于日光之下所发生的事”，或弱化措辞，以协调其他涉及死后存在的经文。
  rationale: 希伯来文本的表达本来就十分鲜明。译文应保留其文学语境中的张力，既不加入原文没有的限定，也不把本节扩大为超出其陈述范围的系统教义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“活着的人／死人”呈现原文的群体对照；“一无所知”保留强调语气。分号划分两组相连的陈述，使长句清楚流畅。脚注标记置于其实际说明的“一无所知”之后。
