  yaml_path: translation/ot/ecclesiastes/009/008.yaml
  text: Let your garments always be white[b][a], and do not let oil be lacking on your head.
translation:
  language: zh_hans
  text: 你的衣服要常常洁白[a]，你头上也不要缺少油[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你的衣服要时时洁白。”
    reason: lexical_alternative
  - marker: b
    text: 洁白的衣服和头上的油，使人联想到喜庆、欢乐和安康，与哀悼的情景相对。
    reason: cultural_note
lexical_decisions:
- source_word: בְּכָל עֵת
  choice: 常常
  rationale: 原意为“在每一个时候”，在此表达持续、经常的状态；“常常”比“每时每刻”自然，也保留劝勉语气。
- source_word: יִהְיוּ
  choice: 要……
  rationale: 此处未完成式在上下文中带祈使、劝勉意味；汉语用“要”可自然表达这种命令式语气。
- source_word: בְגָדֶיךָ
  choice: 你的衣服
  rationale: 准确保留复数集合意义，并比“衣裳”更符合现代标准普通话。
- source_word: לְבָנִים
  choice: 洁白
  rationale: 基本意义是“白”；“洁白”既保留颜色意象，又符合汉语对衣服的自然描述，但不把其象征意义直接写入正文。
- source_word: וְשֶׁמֶן
  choice: 膏油
  rationale: 希伯来文泛指油，在头上的语境中指用于涂抹身体的油；“膏油”在中文圣经语域中自然，同时不限定为橄榄油或礼仪性的受膏之油。
- source_word: עַל רֹאשְׁךָ
  choice: 你头上
  rationale: 直接而自然地表达介词短语“在你头上”。
- source_word: אַל יֶחְסָר
  choice: 不要缺少
  rationale: 否定词与未完成式构成禁止或劝戒；“不要缺少”保留“欠缺、不在”的词义和劝勉力度。
theological_decisions:
- issue: 白衣与头上膏油的象征意义
  choice: 正文保留具体意象，在脚注说明其文化含义
  alternative: 直接译成“要常常喜乐欢庆”
  rationale: 原文使用具体生活图景，而非抽象陈述；保留意象可避免把可能包含的喜庆、安康和非哀悼意义压缩为单一解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“衣服”避免过度古雅；“膏油”保留古代生活背景。脚注标记按其在正文中的相关位置排列。
