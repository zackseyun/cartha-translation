  yaml_path: translation/ot/ecclesiastes/009/013.yaml
  text: 'I also saw this example of wisdom under the sun[a], and it was great to me:'
translation:
  language: zh_hans
  text: 我在日光之下也见过这样的智慧[a]，在我看来，它很了不起：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我在日光之下也看见了这智慧，并且我认为它很了不起。”希伯来文直接以“智慧”为“看见”的对象，并未明说“智慧的例子”。
    reason: 说明“这样的智慧”既可理解为下文所述的一次智慧表现，也可更贴近原文直译为“这智慧”。
lexical_decisions:
- source_word: גַּם
  choice: 也
  rationale: 保留附加语气，把这一观察与前文的思考连接起来。
- source_word: זֹה
  choice: 这样的
  rationale: 指向下文将要叙述的具体事例；与“智慧”搭配，在现代汉语中比生硬的“这智慧”自然。
- source_word: רָאִיתִי
  choice: 我见过
  rationale: 体现ראה的直接观察意味，并以“见过”自然表达传道者回顾亲身观察的语气。
- source_word: חָכְמָה
  choice: 智慧
  rationale: 保留希伯来文的抽象名词，不在正文中明确增添“例子”；“这样的”与下文足以表明这里所指的是智慧的一次具体展现。
- source_word: תַּחַת הַשָּׁמֶשׁ
  choice: 日光之下
  rationale: 保留《传道书》中反复出现的核心表达及其尘世生活范围的含义。
- source_word: וּגְדוֹלָה הִיא
  choice: 它很了不起
  rationale: גָּדוֹל含义宽泛，此处表达说话者对这智慧的高度评价；“了不起”在现代汉语中自然，又不限定为规模、道德或影响力方面的“大”。
- source_word: אֵלָי
  choice: 在我看来
  rationale: 自然表达介词短语所标示的个人判断，同时保留这是传道者主观评价的意味。
theological_decisions: []
