  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: זֶ֣ה רָ֗ע בְּ/כֹ֤ל אֲשֶֽׁר נַעֲשָׂה֙ תַּ֣חַת הַ/שֶּׁ֔מֶשׁ כִּֽי מִקְרֶ֥ה אֶחָ֖ד לַ/כֹּ֑ל וְ/גַ֣ם לֵ֣ב בְּֽנֵי הָ֠/אָדָם מָלֵא רָ֨ע וְ/הוֹלֵל֤וֹת בִּ/לְבָבָ/ם֙ בְּ/חַיֵּי/הֶ֔ם וְ/אַחֲרָ֖י/ו אֶל הַ/מֵּתִֽים׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/009/003.yaml
  text: 'This is the evil in all that is done under the sun: that one fate comes to all[a]. Also, the heart of the sons of man is full of evil, and madness is in their hearts during their lives—and afterward[c][b], they go to the dead.'
translation:
  language: zh_hans
  text: 在日光之下所发生的一切事中，这是一件祸患：众人同有一个遭遇[a]。世人的心[b]也充满邪恶，他们一生心里尽是狂乱；此后[c]，他们便归到死人那里。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“众人所遭遇的都是一样”或“同一个结局临到众人”。希伯来语 מִקְרֶה 可指所发生的事、人的遭遇或共同结局。
    reason: lexical_alternative
  - marker: b
    text: “世人”原文直译为“人的众子”，在这里泛指全人类。
    reason: source_form
  - marker: c
    text: 原文在这里十分简略，直译近于“在它之后，到死人那里”；“它”可能回指一生或活着的时期，移动的动词则由上下文补出。
    reason: textual_ellipsis
lexical_decisions:
- source_word: זֶה רָע
  choice: 这是一件祸患
  rationale: 按上下文将形容性的 רָע 理解为一件令人痛苦、可悲的恶事。“祸患”既保留负面评价，也比单说“恶”更符合现代汉语表达。
- source_word: בְּכֹל אֲשֶׁר נַעֲשָׂה תַּחַת הַשֶּׁמֶשׁ
  choice: 在日光之下所发生的一切事中
  rationale: 保留《传道书》反复出现的“日光之下”，并以“所发生的”表达原文被动、非特定施事者的语气。
- source_word: כִּי מִקְרֶה אֶחָד לַכֹּל
  choice: 众人所遭遇的都一样
  rationale: מִקְרֶה 可指临到人的事件、遭遇或共同结局；正文采用自然汉语，同时不把它限定为抽象的宿命观。
- source_word: לֵב בְּנֵי הָאָדָם
  choice: 世人的心
  rationale: 原文为单数“心”配集合性短语“人的众子”。“世人的心”在现代汉语中自然地表达全人类的共同内在状况，并保留集合性的单数意象。
- source_word: מָלֵא רָע
  choice: 充满邪恶
  rationale: 直接表达内心充满道德之恶；“邪恶”在此比泛指灾祸的“祸患”更准确。
- source_word: וְהוֹלֵלוֹת
  choice: 尽是狂乱
  rationale: 该复数抽象名词表示失去理性、鲁莽悖谬的状态。“狂乱”保留强烈程度，又避免把经文医学化为精神疾病诊断。
- source_word: בְּחַיֵּיהֶם
  choice: 他们一生
  rationale: 以简洁自然的现代汉语表达“在他们活着的时候”。
- source_word: וְאַחֲרָיו אֶל הַמֵּתִים
  choice: 此后，他们便归到死人那里
  rationale: 原文末句高度省略，直译近于“在它之后，到死人那里”。正文补出汉语所需的主语和移动含义，但用脚注保留其突兀和指代含混。
theological_decisions:
- issue: בְּנֵי הָאָדָם 的人类范围与性别表达
  choice: 世人
  alternative: 人的众子
  rationale: 该短语泛指人类，并非只指男性。现代汉语“世人”自然、庄重，也没有抹去原文对全体人类的概括；脚注说明其字面形式。
- issue: מִקְרֶה 的含义
  choice: 所遭遇的都一样
  alternative: 众人都有同一个结局
  rationale: 上下文很可能指共同面对死亡，但该词本身也可表示事件或遭遇。正文不把“死亡”直接写入这一分句，以保留原文词义范围和论述张力。
- issue: 末句是否明确补出死亡后的去向
  choice: 他们便归到死人那里
  alternative: 此后，到死人那里
  rationale: 希伯来文省略谓语，语意突兀。中文正文为可读性补出移动关系，却不扩写为特定的来世教义；脚注交代原文形式。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语；保留“日光之下”这一全书标志性措辞。正文避免生硬照搬希伯来语结构，但用脚注呈现 מִקְרֶה 的多义性、“人的众子”的原文形式，以及末句故意突兀的省略。
