  text: טוֹבָ֥ה חָכְמָ֖ה מִ/כְּלֵ֣י קְרָ֑ב וְ/חוֹטֶ֣א אֶחָ֔ד יְאַבֵּ֥ד טוֹבָ֥ה הַרְבֵּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/009/018.yaml
  text: Wisdom is better than weapons of war[a], but one sinner destroys much good.
translation:
  language: zh_hans
  text: 智慧胜过作战的兵器；但[a]一个罪人毁掉许多益处。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “但”也可译作“和”或“而”。希伯来语连接词本身可表示一般的连接关系，但在这里按上下文也可理解为转折。
    reason: 保留 וְ 的词汇与语篇歧义。
lexical_decisions:
- source_word: טוֹבָה חָכְמָה מִן
  choice: 智慧胜过
  rationale: 形容词 טוֹבָה 与比较介词 מִן 连用，表达“比……更好”；现代汉语用“胜过”自然、凝练。
- source_word: חָכְמָה
  choice: 智慧
  rationale: 这是传道书的核心反复用语；“智慧”既保留其思想主题，也涵盖实际判断与反思能力。
- source_word: כְּלֵי קְרָב
  choice: 争战的兵器
  rationale: כְּלֵי 指器具或装备，与 קְרָב 连用时指用于战斗的装备；“争战的兵器”保留军事含义，并符合庄重的现代汉语。
- source_word: וְחוֹטֶא אֶחָד
  choice: 但一个犯罪的人
  rationale: וְ 字面可作“和”，但上下文构成智慧之益与犯罪者之害的对比，因此正文译作“但”；חוֹטֶא 是名词化分词，译作“犯罪的人”比带有固定身份色彩的“罪人”更直接体现其行为含义。
- source_word: יְאַבֵּד
  choice: 能毁掉
  rationale: אבד 的 Piel 形式表示使某物灭失或遭到破坏；“毁掉”清楚传达强烈的破坏结果，“能”体现此处格言式陈述所说的作用或后果。
- source_word: טוֹבָה הַרְבֵּה
  choice: 许多美好的成果
  rationale: טוֹבָה 在此可指大量的好处、善果或有益成果。结合前文智慧所成就的益处，译作“许多美好的成果”自然，同时避免仅限于抽象道德意义。
theological_decisions:
- issue: חוֹטֵא 的表达是否应固化为身份称谓
  choice: 犯罪的人
  alternative: 罪人
  rationale: 希伯来语为名词化分词，既可称“罪人”，也可着重描述实施犯罪或犯错的人。正文采用“犯罪的人”，避免额外引入特定神学身份范畴，同时保留行为的道德严重性。
- issue: וְ 的逻辑关系
  choice: 但
  alternative: 和
  rationale: 连接词本身可作一般并列，但本节两句在语境中形成明显反差。正文呈现对比关系，脚注保留形式上较直译的可能。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“智慧胜过……”保持箴言式的简洁力度；“争战的兵器”与“美好的成果”兼顾原文意象和自然表达。脚注标记已置于正文相关句末。
