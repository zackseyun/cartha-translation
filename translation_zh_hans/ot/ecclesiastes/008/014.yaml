  text: יֶשׁ הֶבֶל֮ אֲשֶׁ֣ר נַעֲשָׂ֣ה עַל הָ/אָרֶץ֒ אֲשֶׁ֣ר יֵ֣שׁ צַדִּיקִ֗ים אֲשֶׁ֨ר מַגִּ֤יעַ אֲלֵ/הֶם֙ כְּ/מַעֲשֵׂ֣ה הָ/רְשָׁעִ֔ים וְ/יֵ֣שׁ רְשָׁעִ֔ים שֶׁ/מַּגִּ֥יעַ אֲלֵ/הֶ֖ם כְּ/מַעֲשֵׂ֣ה הַ/צַּדִּיקִ֑ים אָמַ֕רְתִּי שֶׁ/גַּם זֶ֖ה הָֽבֶל־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/008/014.yaml
  text: 'There is a vanity that is done on the earth: there are righteous people to whom it happens according to the deeds of the wicked[a], and there are wicked people to whom it happens according to the deeds of the righteous. I said that this too is vanity.'
translation:
  language: zh_hans
  text: 世上有一件虚空[a]的事：有义人所遭遇的，竟与恶人所行的相称；也有恶人所遭遇的，竟与义人所行的相称。我说，这也是虚空。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “虚空”也可译作“徒然”或“雾气”。希伯来词הֶבֶל是《传道书》的关键词，可指短暂、难以捉摸，或令人困惑不平的现象。
    reason: 说明核心词的多重含义及可选译法，避免读者把“虚空”仅理解为毫无意义。
lexical_decisions:
- source_word: הֶבֶל
  choice: 虚空
  rationale: 这是《传道书》的核心词，兼有短暂、难以捉摸和令人困惑不平之意。“虚空”既延续全书反复出现的庄重用语，也不把含义收窄为单纯的“毫无意义”。
- source_word: נַעֲשָׂה
  choice: 有……的事
  rationale: 此处为被动形式，指世上发生或出现的现象。译作“有……的事”符合现代汉语表达，并保留其客观发生之意。
- source_word: עַל הָאָרֶץ
  choice: 世上
  rationale: 直译为“在地上”；“世上”在现代汉语中自然，也避免误解为某一特定地域。
- source_word: צַדִּיקִים / רְשָׁעִים
  choice: 义人／恶人
  rationale: 保留智慧文学中鲜明的伦理对照，表达简洁、庄重，且为普通读者所熟悉。
- source_word: מַגִּיעַ אֲלֵהֶם
  choice: 所遭遇的
  rationale: 该表达指临到某人的境遇或结果。“所遭遇的”自然地涵盖好坏两类际遇，不预先限定具体报应。
- source_word: כְּמַעֲשֵׂה
  choice: 与……所行的相称
  rationale: 保留介词כְּ的比较关系及מַעֲשֶׂה的行为含义，同时呈现本节所说行为与遭遇错置的不协调现象，未补入原文没有明说的“应得报应”。
- source_word: אָמַרְתִּי
  choice: 我说
  rationale: 按原文直陈，保留传道者第一人称的克制语气，不强化为“我断定”或“我得出结论”。
- source_word: שֶׁגַּם זֶה הָבֶל
  choice: 这也是虚空
  rationale: 自然表达גם的“也”意，并与前句的关键词形成首尾呼应。
theological_decisions:
- issue: 《传道书》中הֶבֶל的译法
  choice: 虚空
  alternative: 徒然、雾气、毫无意义
  rationale: “虚空”能承载短暂、难以把握及现实秩序令人困惑等多重意味，也维持全书关键词的一致性；“毫无意义”会把本节的神学张力过度解释成彻底的意义否定。
- issue: 义人与恶人的行为和遭遇之间的关系
  choice: 译为“所遭遇的……与……所行的相称”
  alternative: 明确译为“遭受了对方应得的报应”
  rationale: 原文呈现行为与临到之事之间令人困惑的倒置，却没有在本句明确使用“报应”或“应得”等词，因此不把隐含的因果报偿观写死。
translation_notes:
  register: 采用现代、庄重而通顺的普通话。“义人／恶人”保留智慧文学的伦理对照；两个“竟”凸显原文所描述的反常与张力，但不额外断言这种现象的神学原因。
