  source_fidelity: 译文准确呈现了原文的结构与对照：世上存在一种“虚空”，义人所遭遇的与恶人的行为相称，恶人所遭遇的与义人的行为相称；结尾第一人称判断及“这也是虚空”均得到保留。“所遭遇的”恰当地表达מַגִּיעַ אֲלֵהֶם所指临到人的际遇，未擅自限定为具体的赏罚或报应。“竟”自然传达上下文所凸显的反常，虽属轻微语气补足，未改变原意。
