  terminology: “虚空”作为הֶבֶל的全书性对应词一致且合适；脚注准确提示其可含短暂、难以捉摸和令人困惑的不协调等层面，并给出“徒然”“雾气”的替代译法。义人、恶人的伦理性术语也保持了原文的对照与智慧文学语域。
