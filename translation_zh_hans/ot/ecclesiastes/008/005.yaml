language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: שׁוֹמֵ֣ר מִצְוָ֔ה לֹ֥א יֵדַ֖ע דָּבָ֣ר רָ֑ע וְ/עֵ֣ת וּ/מִשְׁפָּ֔ט יֵדַ֖ע לֵ֥ב חָכָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/008/005.yaml
  text: Whoever keeps a command will not know an evil thing[b][a], and a wise heart knows the proper time and judgment.
translation:
  language: zh_hans
  text: 遵守命令的人，不会遭遇祸患[a]；智慧人的心知道时机和判断[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“不知道坏的／恶的事”，既可能指恶事，也可能指有害的后果、灾祸；这里译作“不会遭遇祸患”。
    reason: lexical_alternative
  - marker: b
    text: “时机和判断”也可理解为“适当的时机和正确的裁断（或处置方式）”。
    reason: lexical_alternative
lexical_decisions:
- source_word: שׁוֹמֵר מִצְוָה
  choice: 遵守命令的人
  rationale: שׁוֹמֵר是表示持续或典型行为的分词，מִצְוָה为无定冠词的单数，可作泛指。“遵守命令的人”既自然表达服从之意，也不把它限定为某一条特定诫命。
- source_word: לֹא יֵדַע
  choice: 不会遭遇
  rationale: יָדַע字面为“知道”，但与“祸患”搭配时可表达亲身经历。译作“不会遭遇”符合现代汉语，同时以脚注保留字面表达及其可能的认识层面。
- source_word: דָּבָר רָע
  choice: 祸患
  rationale: 该短语字面为“坏的／恶的事”，在此语境中较可能指有害后果或灾祸。“祸患”简洁自然，但脚注保留道德之恶与坏事的词义空间。
- source_word: עֵת
  choice: 时机
  rationale: עֵת可指时间、时候或合宜的时机；与智慧辨别相连时，“时机”自然地传达应时而行的含义，又未直接添加“适当”一词。
- source_word: מִשְׁפָּט
  choice: 判断
  rationale: מִשְׁפָּט语义范围包括审判、公正、裁决、规程及正确处置。此处与“时机”并列，“判断”较为通顺，也保留一定宽度；其他可能含义列入脚注。
- source_word: יֵדַע לֵב חָכָם
  choice: 智慧人的心知道
  rationale: 保留希伯来文以“心”为理解、判断和辨识中心的表达，不将其简化为纯粹理智活动。中文虽略带智慧文学风格，仍清楚可懂。
theological_decisions:
- issue: 遵命者“不知坏事”的含义
  choice: 不会遭遇祸患
  alternative: 不知道恶事／坏事
  rationale: 上下文谈到君王的命令以及行动的时机和判断，较可能指遵命者免受不利后果；但原文也可按字面理解为“不知道恶事”。正文采用语境中更自然的经验性含义，脚注明确保留歧义，避免把它绝对化为关于道德无知的命题。
- issue: “智慧人的心”的人论意象
  choice: 智慧人的心知道
  alternative: 智慧人知道
  rationale: 原文的“心”是辨识与决断的中心。保留这一意象可呈现希伯来智慧传统的人观，又不引入身心二分等后来的体系。
- issue: “时机和判断”的关系
  choice: 时机和判断
  alternative: 适当的时机和正确的做法
  rationale: 原文只并列עֵת与מִשְׁפָּט，并未明说两个形容词。正文不补足“适当／正确”，以保留简洁和开放性；脚注说明在语境中可理解为合宜时机与正确裁断或处置。
translation_notes:
  register: 采用现代、庄重而简洁的智慧文学语体。“遵守命令的人”表达泛指，不限于男性；分号呈现原文两个平衡分句。正文保留“智慧人的心”这一希伯来意象，并以脚注说明关键词的语义范围。
