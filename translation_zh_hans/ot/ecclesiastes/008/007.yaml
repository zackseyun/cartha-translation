  yaml_path: translation/ot/ecclesiastes/008/007.yaml
  text: For he does not know what will be, for who can tell him how it will be?
translation:
  language: zh_hans
  text: 因为他不知道将来会发生什么；事情将会怎样[a]，谁能告诉他呢？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“事情会在何时发生，谁能告诉他呢？”这里的希伯来语也可较笼统地理解为“将要发生什么，谁能告诉他呢？”。
    reason: 原文 כַּאֲשֶׁר 可侧重事情发生的方式、情形或时间，句法存在真实歧义。
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 句首作解释性连词，承接上文并说明理由；“因为”在现代汉语中自然保留了这一逻辑关系。
- source_word: אֵינֶנּוּ יֹדֵעַ
  choice: 他不知道
  rationale: 否定形式带第三人称阳性单数后缀，ידע在此指对未来之事的认知；按上下文译作泛指性的“他不知道”。
- source_word: מַה שֶּׁיִּהְיֶה
  choice: 将来会发生什么
  rationale: 直译近于“将要有的是什么”。“将来会发生什么”符合现代汉语，同时准确表达对未来事件的无知。
- source_word: כַּאֲשֶׁר יִהְיֶה
  choice: 事情会怎样发生
  rationale: כַּאֲשֶׁר 在此可表达方式或情形，也可能具有时间意味。“会怎样发生”保留其较开放的方式义，并与前句“发生什么”形成递进而不完全重复。
- source_word: מִי יַגִּיד לוֹ
  choice: 谁能告诉他呢
  rationale: נגד 的使役式意为“告知、说明”。反问句隐含无人能够告知，因此用“能”自然传达其修辞力量。
