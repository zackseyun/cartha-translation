  rationale: 修订仅纠正首句将“看见”误强化为“明白”的问题，并以冒号清楚呈现原文的陈述关系。后文把“也查不出来”调整为“也查不透”，使其与本节反复出现的“无法查透”一致，同时仍自然表达探求失败。
