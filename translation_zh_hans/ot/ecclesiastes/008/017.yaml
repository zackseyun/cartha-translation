reference: Ecclesiastes 8:17
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/רָאִיתִי֮ אֶת כָּל מַעֲשֵׂ֣ה הָ/אֱלֹהִים֒ כִּי֩ לֹ֨א יוּכַ֜ל הָ/אָדָ֗ם לִ/מְצוֹא֙ אֶת הַֽ/מַּעֲשֶׂה֙ אֲשֶׁ֣ר נַעֲשָׂ֣ה תַֽחַת הַ/שֶּׁ֔מֶשׁ בְּ֠/שֶׁ/ל אֲשֶׁ֨ר יַעֲמֹ֧ל הָ/אָדָ֛ם לְ/בַקֵּ֖שׁ וְ/לֹ֣א יִמְצָ֑א וְ/גַ֨ם אִם יֹאמַ֤ר הֶֽ/חָכָם֙ לָ/דַ֔עַת לֹ֥א יוּכַ֖ל לִ/מְצֹֽא־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/008/017.yaml
  text: 'Then I saw all the work of God: that man cannot find out the work that is done under the sun[a]. However much man labors to seek it out, he will not find it; and even if the wise man says he knows[b], he cannot find it out.'
translation:
  language: zh_hans
  text: 于是我看见上帝一切的作为：人无法查透日光之下所做的事。无论人怎样劳碌探求，也查不透；即使智慧人说自己知道[a]，也无法查透。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“自称知道”。
    reason: 原文“说……知道”较为省略，也可带有宣称自己知道的意味。
lexical_decisions:
- source_word: וְרָאִיתִי
  choice: 于是我察看
  rationale: 承接上文并引出传道者观察所得的结论；“察看”保留审视、考察的语气。
- source_word: מַעֲשֵׂה הָאֱלֹהִים
  choice: 上帝一切的作为
  rationale: מַעֲשֶׂה 可指工作、行动或作为；此处用“作为”自然涵盖上帝所行的一切，并与后文同词相呼应。
- source_word: הָאָדָם
  choice: 人
  rationale: 希伯来文以带冠词的单数作泛指，所指是人类普遍的限制；现代汉语“人”既可保持单数形式，也自然具有泛指意义。
- source_word: לִמְצוֹא
  choice: 查透
  rationale: 上下文所说不是找到某个物件，而是经探求后充分理解；“查透”兼顾寻找和领会的含义。
- source_word: הַמַּעֲשֶׂה אֲשֶׁר נַעֲשָׂה תַחַת הַשֶּׁמֶשׁ
  choice: 日光之下所做的事
  rationale: 保留《传道书》反复出现的“日光之下”，并以“所做的事”自然表达名词与被动动词的组合。
- source_word: בְּשֶׁל אֲשֶׁר יַעֲמֹל הָאָדָם לְבַקֵּשׁ
  choice: 无论人怎样劳碌探求
  rationale: 该结构在语境中强调人付出再多努力仍不能成功；“无论……怎样”清楚表达让步程度，“劳碌探求”保留 עמל 的费力意味。
- source_word: וְלֹא יִמְצָא
  choice: 也查不出来
  rationale: 表达持续探求仍告失败的普遍事实，并与前文“查透”保持语义联系。
- source_word: וְגַם אִם יֹאמַר הֶחָכָם לָדַעַת
  choice: 即使智慧人说自己知道
  rationale: לָדַעַת 在此结构中较为省略，可理解为智慧人声称自己知道；正文采用较少解释性的“说自己知道”，保留其可能只是自我宣称的张力。
- source_word: לֹא יוּכַל לִמְצֹא
  choice: 也无法查透
  rationale: 重申人的认识能力有限，以重复的“查透”收束本节并保留原文强调。
theological_decisions:
- issue: הָאָדָם 在论述人类认识局限时的泛指意义
  choice: 人
  alternative: 人类；世人
  rationale: 原文使用单数泛指，并非特指男性。汉语“人”可自然兼具单数形式与全人类范围，无须加注性别说明。
- issue: 智慧人“知道”的表述是否认定其确实知道
  choice: 说自己知道
  alternative: 自称知道；说要明白
  rationale: 原文 יֹאמַר לָדַעַת 具有省略性，可能是说自己知道，也可能带有声称的意味。正文不判定其知识真实与否，脚注提示“自称知道”的语气可能。
- issue: 人不能查透的对象与上帝作为之间的关系
  choice: 保留“上帝一切的作为”与“日光之下所做的事”的并列关联
  alternative: 将两者明确等同为“上帝在日光之下所做的一切”
  rationale: 原文先总提上帝的作为，再说明人不能查透日光之下所做的事。译文不额外补入关系词，以免过度限定或系统化二者的关系。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“上帝”对应 אֱלֹהִים；“日光之下”保留全书标志性措辞。“查透”表达探寻并充分理解，而不只是寻获。正文中的脚注标记[a]与脚注完全对应。
