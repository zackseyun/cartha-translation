  text: אֲשֶׁר֙ אֵין נַעֲשָׂ֣ה פִתְגָ֔ם מַעֲשֵׂ֥ה הָ/רָעָ֖ה מְהֵרָ֑ה עַל כֵּ֡ן מָלֵ֞א לֵ֧ב בְּֽנֵי הָ/אָדָ֛ם בָּ/הֶ֖ם לַ/עֲשׂ֥וֹת רָֽע־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/008/011.yaml
  text: Because the sentence against an evil deed is not carried out quickly[b][a], therefore the heart of the sons of man is fully set in them to do evil.
translation:
  language: zh_hans
  text: 因为对恶行的判决没有迅速执行，所以世人的心便充满了作恶的意念。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译作“世人的心在他们里面充满了作恶的意向”。这也可表达“他们一心作恶”或“他们放胆作恶”。
    reason: lexical_alternative
lexical_decisions:
- source_word: פִתְגָם
  choice: 判决
  rationale: 此处指针对恶行所作的司法裁定；“判决”在现代汉语中自然、明确，也与后面的“执行”搭配。
- source_word: מַעֲשֵׂה הָרָעָה
  choice: 恶行
  rationale: 原文为单数结构“恶的行为”，在这里具有泛指作用；“恶行”简洁地保留其道德含义。
- source_word: אֵין נַעֲשָׂה ... מְהֵרָה
  choice: 没有迅速执行
  rationale: 被动形式在司法语境中指判决未获施行，而非仅仅“没有做成”；“迅速”准确表达 מְהֵרָה。
- source_word: בְּנֵי הָאָדָם
  choice: 世人
  rationale: 这是《传道书》中泛指人类的惯用表达。“世人”既保留传统圣经语体，又能让现代读者自然理解其普遍所指。
- source_word: מָלֵא לֵב ... בָּהֶם לַעֲשׂוֹת רָע
  choice: 世人的心就充满了作恶的念头
  rationale: 尽量保留“心充满”的希伯来语意象，同时用“作恶的念头”说明其意向性；脚注交代该措辞也可表达胆大或决意作恶。
- source_word: רָע
  choice: 恶
  rationale: 与前面的“恶行”保持词义呼应，并保留原文鲜明的道德判断。
theological_decisions:
- issue: בְּנֵי הָאָדָם 的泛指范围与形式
  choice: 世人
  alternative: 人的众子／人类
  rationale: 原表达字面为“人的众子”，实际泛指全体人类。中文若直译为“人的众子”生硬且可能误导；“世人”不把范围局限于男性，也符合该书的普遍人论语境。
- issue: “心充满”所表达的是念头、决意还是胆量
  choice: 正文保留“心……充满”的意象，并译作“充满了作恶的念头”
  alternative: 就一心作恶／便胆大作恶
  rationale: 原文可强调内心被作恶意向占满，也可能含有因惩罚延迟而变得放胆、决意作恶的意味。正文不把这一张力限定为单一心理状态，脚注提示其语义范围。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“判决—执行”清楚呈现司法语境；“世人”表达泛指人类；正文保留“心充满”的原文意象，并以脚注说明其中决意或放胆作恶的可能含义。
