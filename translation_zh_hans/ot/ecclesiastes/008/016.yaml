source:
  edition: WLC
  text: כַּ/אֲשֶׁ֨ר נָתַ֤תִּי אֶת לִבִּ/י֙ לָ/דַ֣עַת חָכְמָ֔ה וְ/לִ/רְאוֹת֙ אֶת הָ֣/עִנְיָ֔ן אֲשֶׁ֥ר נַעֲשָׂ֖ה עַל הָ/אָ֑רֶץ כִּ֣י גַ֤ם בַּ/יּוֹם֙ וּ/בַ/לַּ֔יְלָה שֵׁנָ֕ה בְּ/עֵינָ֖י/ו אֵינֶ֥/נּוּ רֹאֶֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/008/016.yaml
  text: When I applied my heart to know wisdom and to observe the activity that is done on the earth—for even by day and by night his eyes do not see sleep—[a]
translation:
  language: zh_hans
  text: 当我专心认识智慧，察看世上所做的事时——因为他的眼睛昼夜也看不见睡眠——[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可按惯用说法译作：“他昼夜都睡不着。”原文直译为“睡眠，他的眼睛看不见”。“他的”所指未明：可能指传道者，也可能泛指人。
    reason: 说明希伯来语意象、惯用译法及第三人称单数所指的歧义。
lexical_decisions:
- source_word: כַּאֲשֶׁר
  choice: 当……时
  rationale: 按上下文取时间或情境义，引出传道者专心考察时的经历；汉语正文以“当我……”自然表达。
- source_word: נָתַתִּי אֶת־לִבִּי
  choice: 我专心
  rationale: 希伯来语直译为“我把我的心交出来”，指有意识地集中内在心思。“专心”是现代汉语的自然对应，也保留刻意投入之意。
- source_word: לָדַעַת חָכְמָה
  choice: 要认识智慧
  rationale: 保留ידע“认识、知道”和חָכְמָה“智慧”的基本词义，不将其缩窄为单纯的知识理解。
- source_word: וְלִרְאוֹת
  choice: 并观察
  rationale: 字面为“并看”，此处指留心察看、考察，用“观察”传达其探究语气。
- source_word: הָעִנְיָן
  choice: 事
  rationale: 该词在《传道书》中可指事务、劳碌或活动；“事”在本句中自然宽泛，不把含义限定为商业或某项任务。
- source_word: אֲשֶׁר נַעֲשָׂה עַל־הָאָרֶץ
  choice: 世上所做的事
  rationale: 保留被动表达及其广泛范围；“世上”自然对应“在地上”，指人世间。
- source_word: כִּי גַם
  choice: 原来……连……也
  rationale: “原来”体现כִּי在此的说明作用，“连……也”表达גַם的递进强调。
- source_word: בַּיּוֹם וּבַלַּיְלָה
  choice: 昼夜
  rationale: 简洁自然地表达白天和夜间持续不断的时段。
- source_word: שֵׁנָה
  choice: 觉
  rationale: 在“看不见觉”这一汉语表达中，“觉”自然指睡眠，并能承接原文生动而反常的意象。
- source_word: בְּעֵינָיו אֵינֶנּוּ רֹאֶה
  choice: 有人……连觉也看不见
  rationale: 保留第三人称单数及“看不见睡眠”的希伯来语意象；用“有人”避免中文无先行词的“他的眼睛”造成误解，同时不指定此人必为传道者或泛指任何人。
theological_decisions:
- issue: “他的眼睛看不见睡眠”中第三人称阳性单数的所指
  choice: 译为不定指的“有人”，保留第三人称而不确定具体所指
  alternative: 按传道者本人理解为“我昼夜不能入睡”，或明确泛指为“人昼夜不能入睡”
  rationale: 马所拉文本使用第三人称阳性单数形式，而不是第一人称。正文不作人称校改，也不把该人明确等同于传道者；“有人”在自然汉语中保留了未明确所指的第三人称。
- issue: 末句是否保留“看见睡眠”的意象
  choice: 保留为“连觉也看不见”
  alternative: 意译为“昼夜都睡不着”或“昼夜不得睡觉”
  rationale: 原文有意使用“睡眠，他的眼睛不看见”这一鲜明表达。正文保存其修辞张力，脚注提供更惯用的汉语释义。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“专心”“认识智慧”“观察”体现考察语境；破折号保留解释性转折。末句略带陌生感，是为保存希伯来语“眼睛看不见睡眠”的原始意象；脚注补充惯用表达和代词歧义。
