base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/008/008.yaml
  text: No man has power over the wind to restrain the wind[a], and there is no authority over the day of death, and there is no discharge in war, and wickedness will not deliver its master.
translation:
  language: zh_hans
  text: 没有人有权掌控风，把风约束住；没有人能支配死亡之日；战争中没有人能获准离开；邪恶不能救它的主人。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָדָם
  choice: 人
  rationale: 希伯来语单数在此泛指任何人；现代汉语用“人”自然、准确，也不额外突出性别。
- source_word: שַׁלִּיט
  choice: 能掌控
  rationale: 该词表示拥有支配权或控制力；与否定式连用时，“没有人能掌控”符合现代汉语表达。
- source_word: רוּחַ
  choice: 风
  rationale: 与“扣住”连用，并与死亡、战争等人无法控制之事并列，语境较支持“风”；“灵”或“气息”的可能性以脚注保留。
- source_word: לִכְלוֹא
  choice: 把……扣住
  rationale: 原词有禁闭、拘束、阻住之意；“扣住风”既保留形象，也表达风无法被禁锢。
- source_word: שִׁלְטוֹן
  choice: 掌控
  rationale: 指权力、支配权；在“死亡之日”这一语境中，译作“掌控”清楚表达无人能支配死亡时刻。
- source_word: בְּיוֹם הַמָּוֶת
  choice: 死亡之日
  rationale: 指死亡临到的日子或时刻；“掌控死亡之日”保留介词所表达的管辖关系。
- source_word: מִשְׁלַחַת
  choice: 免役
  rationale: 在战争语境中指获准离开或免除服役；“免役”简洁地表达军事上的豁免或释放。
- source_word: בַּמִּלְחָמָה
  choice: 战争中
  rationale: 直接表达处于战争期间或战争情境之中，不把范围缩窄为单次战斗。
- source_word: רֶשַׁע
  choice: 邪恶
  rationale: 保留原文的抽象名词及其拟人化表达，不改译为“恶人”。
- source_word: יְמַלֵּט
  choice: 救不了
  rationale: 该动词表示使人脱险、救出；“救不了”自然有力，也避免加入原文未明说的宗教性含义。
- source_word: בְּעָלָיו
  choice: 它的主人
  rationale: 原词意为主人或所有者；以“它”回指拟人化的“邪恶”，保留原文中邪恶不能救其主人的反讽。
theological_decisions:
- issue: 开头两处 רוּחַ 的含义
  choice: 风
  alternative: 灵；气息（即生命气息）
  rationale: 动词“扣住”以及与死亡、战争并列的结构较支持自然现象“风”。但 רוּחַ 本身确可指灵或气息，若取后者，句子也可能涉及人不能控制或留住自己的生命气息，因此不应消除这一真实歧义。
translation_notes:
  register: 采用现代、庄重而通顺的普通话。“掌控”贯穿前两分句，反映同一语义场；“免役”保留战争语境的制度性含义；末句保留“邪恶—主人”的拟人化和反讽。
