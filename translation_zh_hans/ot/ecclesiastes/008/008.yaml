revisions:
- from: 没有人能掌控风，把风扣住[a]；没有人能掌控死亡之日；战争中无人可以免役；邪恶也救不了它的主人。
  to: 没有人有权掌控风，把风约束住；没有人能支配死亡之日；战争中没有人能获准离开；邪恶不能救它的主人。
  rationale: 修订仅改善汉语搭配并更精确呈现军事语境，不改变原文的四项并列断言。“风”仍作为正文中最合语境的主译；脚注保留“灵”和“气息”的词义可能性。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T06:59:35Z'
review_pass:
  verdict: revise
  source_fidelity: 草稿总体准确地传达了人不能控制风、死亡之日和战争中的离开，以及邪恶不能救其主人的四重断言；并且以脚注保留了רוּחַ的“灵／气息”可能义。需微调“扣住风”和“免役”，使其更贴近希伯来文的“约束／禁闭”及军事语境中的“获准离开／解除服役”。
  naturalness: “把风扣住”在现代普通话中较口语且搭配生硬，易联想到扣押具体物品。“约束住风”更自然，也保留原文的禁锢意象。“战争中无人可以免役”可理解为战前或战时的兵役豁免，较弱化原文“没有遣散／离开”的意思；“战争中没有人能获准离开”更自然准确。
  terminology: “掌控”“死亡之日”“邪恶”“主人”均可接受。为反映前两句同源的权柄／支配语义，采用“有权掌控”和“能支配”。末句保留“邪恶”的抽象拟人化，避免改为“恶人”。
  issues:
  - severity: medium
    issue: “把风扣住”搭配不自然，且“扣住”带有口语和具体扣押物件的色彩。
    rationale: לִכְלוֹא表示限制、禁闭或约束；“把风约束住”在现代汉语中更自然，并保留无法禁锢风的形象。
  - severity: medium
    issue: “免役”未充分表达战争中不得获准离开或解除服役的含义。
    rationale: מִשְׁלַחַת在此军事语境指遣散、释放或准许离开，不只是广义的免除兵役；“没有人能获准离开”能避免加入特定制度细节，同时保留原意。
  revised_text: 没有人有权掌控风，把风约束住；没有人能支配死亡之日；战争中没有人能获准离开；邪恶不能救它的主人。
  revised_footnotes:
  - marker: a
    text: 或译：“没有人有权掌控灵，把灵约束住。”希伯来语 רוּחַ 可指“风”、“灵”或“气息”。
    reason: 保留原词在此处可能具有的多重含义，尤其是其可指灵或生命气息的真实歧义。
  revision_rationale: 修订仅改善汉语搭配并更精确呈现军事语境，不改变原文的四项并列断言。“风”仍作为正文中最合语境的主译；脚注保留“灵”和“气息”的词义可能性。
