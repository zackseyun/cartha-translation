source:
  edition: WLC
  text: וְ/שִׁבַּ֤חְתִּֽי אֲנִי֙ אֶת הַ/שִּׂמְחָ֔ה אֲשֶׁ֨ר אֵֽין ט֤וֹב לָֽ/אָדָם֙ תַּ֣חַת הַ/שֶּׁ֔מֶשׁ כִּ֛י אִם לֶ/אֱכ֥וֹל וְ/לִ/שְׁתּ֖וֹת וְ/לִ/שְׂמ֑וֹחַ וְ/ה֞וּא יִלְוֶ֣/נּוּ בַ/עֲמָל֗/וֹ יְמֵ֥י חַיָּ֛י/ו אֲשֶׁר נָֽתַן ל֥/וֹ הָ/אֱלֹהִ֖ים תַּ֥חַת הַ/שָּֽׁמֶשׁ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/008/015.yaml
  text: So I commended joy[a], because there is nothing better for man under the sun than to eat and to drink and to rejoice[c][b]; and this will accompany him in his labor during the days of his life that God has given him under the sun.
translation:
  language: zh_hans
  text: 所以，我称许[a]喜乐，因为人在日光之下没有什么比吃、喝、欢乐更好；这喜乐会在他劳碌中伴随他，贯穿上帝赐给他在日光之下的一生[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “称许”或译“赞美”。
    reason: lexical_alternative
  - marker: b
    text: “伴随他”或译“与他同行”。原文直译为“在他劳碌中伴随他，在上帝赐给他在日光之下的一生年日中”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשִׁבַּחְתִּי
  choice: 我称许
  rationale: שׁבח 的皮勒词干可表示“赞美、称许”。此处对象是“喜乐”，“称许”自然表达传道者的正面评价，同时避免不必要的礼仪色彩。
- source_word: הַשִּׂמְחָה
  choice: 喜乐
  rationale: 该词表示喜悦、欢乐；“喜乐”既庄重又通俗，并与《传道书》中享受上帝所赐美好事物的主题相符。
- source_word: אֵין טוֹב לָאָדָם ... כִּי אִם
  choice: 人……莫过于
  rationale: 该结构在这里具有比较意味，即“没有什么比……更好”。“莫过于”简洁自然，保留其评价力度。
- source_word: לָאָדָם
  choice: 人
  rationale: אָדָם 在此是泛指单数，指一般人类，并非仅指男性；现代汉语的“人”准确保留这一泛指意义。
- source_word: תַּחַת הַשֶּׁמֶשׁ
  choice: 在日光之下
  rationale: 这是《传道书》的关键反复用语，指现世生活领域；采用较为直译且已为读者熟悉的表达，以保持全书主题一致。
- source_word: לֶאֱכֹל וְלִשְׁתּוֹת וְלִשְׂמוֹחַ
  choice: 吃喝欢乐
  rationale: 用简洁的并列动词结构传达三个不定式；“欢乐”在汉语中可作谓语，保留 לִשְׂמוֹחַ 的行动意味。
- source_word: וְהוּא יִלְוֶנּוּ
  choice: 这喜乐也会……伴随他
  rationale: לוה 表示陪伴、相随。阳性代词 הוּא 最自然地回指前述喜乐；明说“这喜乐”可消除汉语代词指向不清，但不改变原意。
- source_word: בַעֲמָלוֹ
  choice: 在他的劳碌中
  rationale: עָמָל 在《传道书》中常含辛劳、费力之意；“劳碌”比单纯的“工作”更能保留其沉重色彩。
- source_word: יְמֵי חַיָּיו
  choice: 度过……一生
  rationale: 原文直译为“他一生的日子”。结合“伴随”用“度过……一生”符合现代汉语习惯，并表达陪伴贯穿其生命岁月。
- source_word: אֲשֶׁר נָתַן לוֹ הָאֱלֹהִים
  choice: 上帝赐给他
  rationale: 关系从句表明人的生命年日来自上帝；“赐给”自然传达 נָתַן 在此语境中的赠予意味。
theological_decisions:
- issue: “人在日光之下，莫过于……”是否表示绝对最高善
  choice: 保留经文在“日光之下”范围内的比较性判断
  alternative: 译作“人没有别的好处，只有……”
  rationale: אֵין טוֹב ... כִּי אִם 可作“没有什么更好，莫过于”，也可较直译为“没有好处，只有”。上下文支持比较意义；保留“在日光之下”的限定，避免把这句话扩展成关于终极善的无条件教义断言。
- issue: וְהוּא 的指代
  choice: 理解为前述“喜乐”
  alternative: 理解为概括性的“这件事”，或形式上译作“它”
  rationale: הַשִּׂמְחָה 是阳性名词，与 הוּא 在语法上相合，且“喜乐伴随他劳碌”语境顺畅；译文用“这喜乐”明确这一较可能的回指。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。保留《传道书》标志性的“日光之下”和“劳碌”，以维持全书语汇一致；通过“人在……莫过于”自然表达希伯来语的泛指单数与比较结构。所有脚注标记均已置于正文相应位置。
