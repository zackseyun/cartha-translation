  text: בַּ/אֲשֶׁ֥ר דְּבַר מֶ֖לֶךְ שִׁלְט֑וֹן וּ/מִ֥י יֹֽאמַר ל֖/וֹ מַֽה תַּעֲשֶֽׂה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/008/004.yaml
  text: For the word of a king is authority[a], and who may say to him, “What are you doing?”
translation:
  language: zh_hans
  text: 因为王的话就是权柄[a]，谁能对他说：“你在做什么？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“王的话在哪里，权柄就在哪里。”希伯来文开头也可按这种较为直译的方式理解。
    reason: 保留 בַּאֲשֶׁר 的处所性句法可能，以及 שִׁלְטוֹן 与前句之间的另一种构造。
lexical_decisions:
- source_word: בַּאֲשֶׁר
  choice: 因为
  rationale: 该复合形式在上下文中引出前面劝告的理由；“因为”自然表达解释或因果关系，同时将更贴近字面的处所性理解保留在脚注中。
- source_word: דְּבַר
  choice: 话
  rationale: דָּבָר 可指话语、事情或命令；在王权语境中含有命令效力，但译作“话”可保留原文宽度，并由“带有权柄”说明其效力。
- source_word: מֶלֶךְ
  choice: 王
  rationale: 希伯来文无冠词，具有泛指、格言式意味；现代汉语用“王”即可自然表达泛指，无须强加“一位”或“那位”。
- source_word: שִׁלְטוֹן
  choice: 权柄
  rationale: 该词表示统治权、支配力或权威；“权柄”适合王权语境，也表达王的话具有约束力。
- source_word: וּמִי
  choice: 谁
  rationale: 保留原文的反问形式；汉语中无需机械译出连接词“和”，句意仍连贯。
- source_word: יֹאמַר לוֹ
  choice: 能对他说
  rationale: 未完成式在此反问中表达可能性；“能”自然传达无人可以质问或挑战王的意味。
- source_word: מַה תַּעֲשֶׂה
  choice: 你在做什么？
  rationale: 直译并保留当面质问的语气；现代汉语进行式自然对应此处对行动的挑战。
theological_decisions:
- issue: 本节是否绝对肯定王权不可受质问
  choice: 按经文保留其关于王命权威的格言式陈述，不添加神学限制或政治评断
  alternative: 补译为王拥有绝对且不受约束的权力，或反过来弱化为仅描述一般行政权威
  rationale: 原文强调王的话具有统治效力，以及质问王的困难；本节自身没有明说这种权力在道德或神学上毫无限制，因此不应超出文本作教义化处理。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“带有权柄”比生硬的“就是权柄”更符合汉语表达，同时仍保留王言具有实际统治效力的核心意思；脚注标记已置于正文相应位置。
