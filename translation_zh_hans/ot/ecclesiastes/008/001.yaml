  text: מִ֚י כְּ/הֶ֣/חָכָ֔ם וּ/מִ֥י יוֹדֵ֖עַ פֵּ֣שֶׁר דָּבָ֑ר חָכְמַ֤ת אָדָם֙ תָּאִ֣יר פָּנָ֔י/ו וְ/עֹ֥ז פָּנָ֖י/ו יְשֻׁנֶּֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/008/001.yaml
  text: Who is like the wise man[a], and who knows the interpretation of a matter? A man's wisdom lights up his face[b], and the hardness of his face is changed.
translation:
  language: zh_hans
  text: 谁能像智慧人呢？谁知道一件事的解释呢？人的[a]智慧使他的脸发光；他脸上的刚硬[b]也会改变。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “人的智慧”也可理解为“一个人的智慧”；希伯来文采用单数泛指的“人”。
    reason: 说明原文 חָכְמַת אָדָם 中“人”的单数泛指用法。
  - marker: b
    text: “刚硬”也可译作“强势”或“严厉”。希伯来文直译近于“他脸上的力量被改变”，所指可能是刚硬、严厉的神情因智慧而改变。
    reason: 保留 עֹז פָּנָיו 这一习语的词义范围与不确定性。
lexical_decisions:
- source_word: מִי כְּהֶחָכָם
  choice: 谁能像智慧人
  rationale: 保留疑问代词与比较结构；“智慧人”体现定冠词修饰的单数代表性用法，现代中文自然且庄重。
- source_word: וּמִי יוֹדֵעַ פֵּשֶׁר דָּבָר
  choice: 谁知道一件事的解释呢
  rationale: “知道”直接对应 יוֹדֵעַ；“一件事的解释”保留 פֵּשֶׁר דָּבָר 的构造关系及“事”所具有的宽泛含义。
- source_word: חָכְמַת אָדָם
  choice: 人的智慧
  rationale: אָדָם 在此为单数泛指；中文“人的智慧”可自然表达全人类或一般人的代表性意义，无须强加男性限定。
- source_word: תָּאִיר פָּנָיו
  choice: 使他的脸发光
  rationale: תָּאִיר 是 אור 的使役形，直译为“使……发光”；既保存形象，也符合中文表达。
- source_word: וְעֹז פָּנָיו
  choice: 他脸上的刚硬
  rationale: עֹז 本义涉及力量、强硬；与“脸”连用时可指刚硬、严厉或强势的面容。“脸上的刚硬”保留原文略带异常的习语张力。
- source_word: יְשֻׁנֶּא
  choice: 改变
  rationale: 该词是 שנה 的被动形式，意为“被改变”。中文在“使……改变”的并列结构中自然传达其结果而不过度强化为“彻底转化”。
theological_decisions:
- issue: אָדָם 在智慧格言中的单数泛指
  choice: 人的智慧
  alternative: 一个男人的智慧／人类的智慧
  rationale: 原文 אָדָם 为泛指的人，并不在此突出男性；“人的智慧”既保留单数名词的代表性，也避免把经文范围误限于男性。
- issue: 智慧对 עֹז פָּנָיו 所产生改变的性质
  choice: 使他脸上的刚硬改变
  alternative: 使他严厉的面容柔和／他脸上的威严改变
  rationale: 原文只说面容的“刚强、强硬”被改变，并未明说变得柔和，也可能包含威严或强势之意，因此正文不补足改变的具体方向，以保留语义张力。
translation_notes:
  register: 采用现代、清楚而庄重的普通话。“谁能像智慧人”保留修辞问句；后半句尽量维持原文面部意象，不把“改变”解释性扩写为“柔和”。所有脚注标记均已置于正文。
