id: ECC.8.3
reference: Ecclesiastes 8:3
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: אַל תִּבָּהֵ֤ל מִ/פָּנָי/ו֙ תֵּלֵ֔ךְ אַֽל תַּעֲמֹ֖ד בְּ/דָבָ֣ר רָ֑ע כִּ֛י כָּל אֲשֶׁ֥ר יַחְפֹּ֖ץ יַעֲשֶֽׂה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/008/003.yaml
  text: Do not be hasty to leave his presence[a]. Do not take your stand in an evil matter[b], for he does whatever he pleases.
translation:
  language: zh_hans
  text: 不要急着从他面前离开[a]；不要在恶事上坚持[b]，因为他想做什么，就做什么。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“不要惊慌着从他面前离开。”希伯来语动词既可表示仓促急躁，也可表示烦乱或惊慌。
    reason: lexical_alternative
  - marker: b
    text: 或译：“不要站在恶事一边”，或“不要固守恶事。”
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּבָּהֵל
  choice: 急着
  rationale: בהל可表示惊慌、烦乱，也可指因急躁或慌乱而仓促行动。结合后面的“离开”，正文用“急着”自然表达实际劝诫，同时以脚注保留“惊慌”的可能。
- source_word: מִפָּנָיו תֵּלֵךְ
  choice: 离开他面前
  rationale: 原文直译为“从他面前走开”。“离开他面前”既符合现代汉语，也保留君王面前这一朝廷语境及关系意味。
- source_word: תַּעֲמֹד
  choice: 执意不退
  rationale: עמד在这里不必仅指身体站立，也可表示坚持、停留或维持立场。“执意不退”传达在某事上固守的劝诫意味，又不把所涉及的行为说得过细。
- source_word: בְּדָבָר רָע
  choice: 在恶事上
  rationale: דבר含义宽泛，可指事情、主张、缘由或行动；“恶事”保留这种一定程度的宽泛性，并保存רע的道德分量。
- source_word: כִּי כָּל אֲשֶׁר יַחְפֹּץ יַעֲשֶׂה
  choice: 因为他想做什么，就做什么
  rationale: 这一表达自然简洁，传达君王能实行自己意愿的强势权柄；没有额外限定其意愿的内容。
- source_word: כִּי
  choice: 因为
  rationale: 作为说明前述禁令理由的连接词，“因为”准确而自然。
theological_decisions:
- issue: 本节第三人称单数代词所指
  choice: 正文保留“他”，按紧邻语境指君王
  alternative: 泛指统治者或掌权者
  rationale: 传道书8:2、8:4明确处于君王权柄的语境中，因此君王是最自然的所指；但正文沿用原文代词，不把“他”直接改写为“君王”，避免超出本节措辞。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“急着离开”与“想做什么，就做什么”符合自然汉语；“在恶事上执意不退”则保留原文“站立、坚持”与“事情、主张、行动”之间的语义张力。所有脚注标记均已置于正文相应位置。
