  text: וְ/טוֹב֙ לֹֽא יִהְיֶ֣ה לָֽ/רָשָׁ֔ע וְ/לֹֽא יַאֲרִ֥יךְ יָמִ֖ים כַּ/צֵּ֑ל אֲשֶׁ֛ר אֵינֶ֥/נּוּ יָרֵ֖א מִ/לִּ/פְנֵ֥י אֱלֹהִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/008/013.yaml
  text: But it will not go well for the wicked[a], and he will not prolong his days like a shadow[b], because he does not fear before God.
translation:
  language: zh_hans
  text: 然而，恶人不得好处，也不会延长年日，如同影子[a]；因为他在上帝面前没有敬畏之心。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“也不会像影子那样延长年日。”原文“如同影子”的句法关系有不同理解：可指年日如影子般短暂，也可连于“延长”。
    reason: 句法关系存在歧义；保留“如同影子”修饰年日或延长动作的不同理解。
lexical_decisions:
- source_word: וְטוֹב לֹא יִהְיֶה לָרָשָׁע
  choice: 然而，恶人不会有好结局
  rationale: טוֹב与היה连用，在这里指顺遂、福祉或有利结局，而不是抽象的“善”。结合上节，וְ译作“然而”以显明对比；“不会有好结局”是自然的现代汉语，也保留智慧文学对恶人命运的概括性断言。
- source_word: וְלֹא יַאֲרִיךְ יָמִים
  choice: 也不能延长自己的年日
  rationale: 使役式יַאֲרִיךְ与יָמִים连用，字面为“延长年日”。“延长自己的年日”保留希伯来语意象，比单译“不能长寿”更贴近原文。
- source_word: כַּצֵּל
  choice: 如影子般
  rationale: 直接保留“影子”的比喻，不把它解释性改写为“短暂”或“虚空”；其与“年日”及“延长”的具体关系由脚注说明。
- source_word: אֲשֶׁר אֵינֶנּוּ יָרֵא
  choice: 因为他……并不敬畏
  rationale: 此处אֲשֶׁר最自然地引出恶人结局的原因；“并不敬畏”保留持续性的品格描述。
- source_word: מִלִּפְנֵי אֱלֹהִים
  choice: 在上帝面前
  rationale: 保留לִפְנֵי所表达的临在场景；不简化为仅仅“敬畏上帝”，以免丢失原文“在上帝面前”的措辞。
theological_decisions:
- issue: 智慧文学中恶人受报的性质
  choice: 按原文直陈恶人不会有好结局、不能延长年日
  alternative: 增添“最终”“通常”等限定，或解释为每一个恶人都必在今生早逝
  rationale: 经文本身作出概括性的道德断言，却没有说明应验的时间和方式。译文既不削弱断言，也不把它扩展为机械性的今世保证，从而保留《传道书》内部对经验现实与道德秩序的张力。
- issue: 影子比喻的所指
  choice: 主文将“如影子般”连接于“年日”，并以脚注保留另一种句法理解
  alternative: 明确断定影子只象征人生短暂，或只表示影子被拉长
  rationale: 希伯来语כַּצֵּל的位置允许对其修饰关系产生不同理解；译文不把比喻的张力化约为单一解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“好结局”自然传达טוֹב所指的顺遂结果；“年日”保留智慧文学的传统意象而不过分古雅。句末“在上帝面前并不敬畏”略带经文语体，以忠实保留原文的临在表达。
