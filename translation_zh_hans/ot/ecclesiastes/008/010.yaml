id: ECC.8.10
reference: Ecclesiastes 8:10
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וּ/בְ/כֵ֡ן רָאִיתִי֩ רְשָׁעִ֨ים קְבֻרִ֜ים וָ/בָ֗אוּ וּ/מִ/מְּק֤וֹם קָדוֹשׁ֙ יְהַלֵּ֔כוּ וְ/יִֽשְׁתַּכְּח֥וּ בָ/עִ֖יר אֲשֶׁ֣ר כֵּן עָשׂ֑וּ גַּם זֶ֖ה הָֽבֶל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/008/010.yaml
  text: And so I saw the wicked buried[a]; they had come and gone from the holy place, and they were forgotten in the city where they had done so[c][b]. This too is vanity.
translation:
  language: zh_hans
  text: 于是，我看见恶人被安葬；他们来过，又从圣地[b]离去，后来在他们如此行事的城里被人遗忘[a]。这也是虚空[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些古代译本，以及对希伯来文的另一种理解，作：“却在他们如此行事的城里受人称赞。”
    reason: textual_variant
  - marker: b
    text: “圣地”可能指圣殿范围，也可能指另一处神圣场所。
    reason: cultural_note
  - marker: c
    text: 希伯来文为hebel，常译作“虚空”，原指“气息、雾气”，可表达短暂无常或难以捉摸。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְכֵן
  choice: 于是
  rationale: 既承接上文，也自然引出传道者接下来的观察，保留连接和推论意味。
- source_word: רָאִיתִי
  choice: 我看见
  rationale: 按叙述中的亲身观察处理，简洁自然。
- source_word: רְשָׁעִים
  choice: 恶人
  rationale: 这是现代中文圣经语体中清楚而凝练的道德类别称谓。
- source_word: קְבֻרִים
  choice: 被安葬
  rationale: 保留被动含义；“安葬”比单说“埋葬”更符合人的葬礼语境。
- source_word: וָבָאוּ
  choice: 他们来过
  rationale: 保留“来、进入”的基本动作，并以“过”表明这是安葬前曾发生的活动。
- source_word: וּמִמְּקוֹם קָדוֹשׁ יְהַלֵּכוּ
  choice: 又从圣地离去
  rationale: 贴近“从圣洁之地走去”的结构，不把具体地点过早限定为圣殿。
- source_word: וְיִשְׁתַּכְּחוּ
  choice: 被人遗忘
  rationale: 依马所拉文本按שׁכח的通常意义翻译；古译本所支持的“受人称赞”另列脚注。
- source_word: בָעִיר
  choice: 在……城里
  rationale: 定冠词所指的特定城市在中文中由上下文和关系从句自然体现。
- source_word: אֲשֶׁר כֵּן עָשׂוּ
  choice: 他们如此行事的
  rationale: 保留原文的压缩和指代模糊，不擅自说明“如此”具体指什么。
- source_word: גַּם זֶה הָבֶל
  choice: 这也是虚空
  rationale: “虚空”保留《传道书》的反复用语及其无常、难以把握的意味，具体意象另在脚注说明。
theological_decisions:
- issue: 恶人与圣地之间关系的难解从句
  choice: 译作他们曾来过并从圣地离去，随后在当地被遗忘
  alternative: 可将其解释为恶人经常出入圣所，甚至暗示宗教上的虚伪
  rationale: 原文没有明确说明他们为何到圣地，也没有明说其宗教行为的性质；正文保留这种张力，不加入对其罪行的具体判断。
- issue: וְיִשְׁתַּכְּחוּ的文本与解释分歧
  choice: 正文采用马所拉文本的“被人遗忘”
  alternative: 部分古代译本及另一种希伯来文理解支持“受人称赞”
  rationale: 以所给WLC文本为正文依据，同时用脚注完整保留重要的古代见证和相反含义。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“他们来过，又从圣地离去”较直接地保留希伯来语的移动顺序；“如此行事”有意保持原文指代不明。分号承接同一观察中的后续描述。
