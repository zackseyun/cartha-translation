language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כִּ֣י לְ/כָל חֵ֔פֶץ יֵ֖שׁ עֵ֣ת וּ/מִשְׁפָּ֑ט כִּֽי רָעַ֥ת הָ/אָדָ֖ם רַבָּ֥ה עָלָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/008/006.yaml
  text: For every matter there is a time and a judgment[b][a], because the evil of man weighs heavily upon him.
translation:
  language: zh_hans
  text: 因为凡事都有时候和裁断[a]，因为人的祸患重重地压在他身上[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “裁断”或译“审判”“公正”或“合宜的程序”；“凡事”也可译“每个目的”或“每件事务”。
    reason: 保留 חֵפֶץ 和 מִשְׁפָּט 的语义范围。
  - marker: b
    text: “人的祸患”也可译“人的恶”“人的苦难”或“人类的困境”；原文直译近于“在他身上很大”。
    reason: רָעָה 可兼指道德之恶与灾祸、苦难；רַבָּה עָלָיו 也可表达程度或加诸其身的沉重负担。
lexical_decisions:
- source_word: כִּי（第一处）
  choice: 因为
  rationale: 此词承接上一节并引出解释；现代汉语用“因为”可保留其说明、因由功能。
- source_word: לְכָל חֵפֶץ
  choice: 凡事
  rationale: חֵפֶץ 在这里与“时机”并列，泛指各种事情、事务或所要成就的事；“凡事”简洁自然，并保留其广泛所指。
- source_word: יֵשׁ עֵת
  choice: 都有时机
  rationale: 直译为“有时候”；结合语境，“时机”既表达时间，也不额外断定这是预先指定的时刻。
- source_word: וּמִשְׁפָּט
  choice: 和定规
  rationale: מִשְׁפָּט 可指审判、裁断、公正或合宜的程序与秩序。“定规”与“时机”搭配自然，又不把语义局限于法庭审判；其他可能性收入脚注。
- source_word: כִּי（第二处）
  choice: 因为
  rationale: 第二个 כִּי 最自然地说明前句的理由；保留重复的“因为”，也反映原文的论证结构。
- source_word: רָעַת הָאָדָם
  choice: 人的祸患
  rationale: רָעָה 可表示恶、灾祸、苦难或困境。本句的负担意象较适合“祸患”，但“人的恶”仍是可能读法，因此在脚注中保留。
- source_word: רַבָּה עָלָיו
  choice: 压在他身上，十分沉重
  rationale: 原文直义近于“在他身上很大”。此译用自然汉语表达其加在人身上的沉重程度，同时避免误解为单纯数量众多。
theological_decisions:
- issue: הָאָדָם 的泛指范围
  choice: 人／他
  alternative: 人类／他们
  rationale: 原文使用单数泛指，现代汉语“人”既可涵盖全人类，也能保留单数代表性；后文以“他”照应原文单数，不限定为某一男性个体。
- issue: רָעָה 在本节是道德之恶还是所遭祸患
  choice: 祸患
  alternative: 恶；苦难；困境
  rationale: 与“压在他身上，十分沉重”相连时，所遭受的祸患或苦难更顺合语境；但该词也可能指人的恶，因此用脚注明示，不把经文的张力消解掉。
- issue: מִשְׁפָּט 的含义
  choice: 定规
  alternative: 审判；裁断；合宜的程序
  rationale: 本节将其与“时机”并列，可能强调每件事都有适当的处置、程序或裁断。“定规”保留秩序性的含义，而脚注列出司法意味较强的读法。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“因为……因为……”有意保留希伯来文两个 כִּי 的解释链条；“人／他”为单数泛指。脚注标记按正文出现顺序置于相关词句之后。
