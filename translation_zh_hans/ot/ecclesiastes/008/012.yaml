source:
  edition: WLC
  text: אֲשֶׁ֣ר חֹטֶ֗א עֹשֶׂ֥ה רָ֛ע מְאַ֖ת וּ/מַאֲרִ֣יךְ ל֑/וֹ כִּ֚י גַּם יוֹדֵ֣עַ אָ֔נִי אֲשֶׁ֤ר יִהְיֶה טּוֹב֙ לְ/יִרְאֵ֣י הָ/אֱלֹהִ֔ים אֲשֶׁ֥ר יִֽירְא֖וּ מִ/לְּ/פָנָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/008/012.yaml
  text: Though a sinner does evil a hundred times and prolongs his life[a], yet I also know that it will be well for those who fear God[b], who fear before him.
translation:
  language: zh_hans
  text: 尽管罪人作恶一百次，仍得以长久存活[a]，但我也知道，敬畏上帝的人，就是在他面前心存敬畏的人，必然安好[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“仍活得长久。”
    reason: lexical_alternative
  - marker: b
    text: 或译：“敬畏上帝的人必得好处。”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר
  choice: 尽管
  rationale: 在上下文中引出让步从句，承接恶人作恶而长久存活这一反常现象，并与后面的确信形成对照。
- source_word: חֹטֶא
  choice: 罪人
  rationale: 分词在此作实体用法，指以犯罪为特征的人；中文用“罪人”简洁自然。
- source_word: עֹשֶׂה רָע
  choice: 作恶
  rationale: 直接保留“行做”与“恶”的动词性表达，庄重而符合现代汉语。
- source_word: מְאַת
  choice: 一百次
  rationale: 保留原文明确的数字及其副词性用法，表达反复作恶，不弱化为泛指“多次”。
- source_word: וּמַאֲרִיךְ לוֹ
  choice: 仍得以长久存活
  rationale: 希伯来语字面含“为自己延长”的意思，语境中通常指寿命延长或长久活着；采用较自然且不暗示罪人自主延寿的中文。
- source_word: כִּי גַּם
  choice: 但我也
  rationale: “但”体现上下文的转折，“也”保留 גַּם 的附加或强调意味。
- source_word: יוֹדֵעַ אָנִי
  choice: 我也知道
  rationale: 以明确主语表达原文谓语分词加代词的强调，同时保持自然中文语序。
- source_word: אֲשֶׁר יִהְיֶה טּוֹב
  choice: 终必安好
  rationale: 表达事情最终会对某人有好结果；“终必”显出面向将来的确信，“安好”比抽象的“有好处”更自然。
- source_word: לְיִרְאֵי הָאֱלֹהִים
  choice: 敬畏上帝的人
  rationale: 保留分词的持续特征，清楚表达这群人以敬畏上帝为其特征。
- source_word: אֲשֶׁר יִירְאוּ מִלְּפָנָיו
  choice: 就是在他面前心存敬畏的人
  rationale: 保留“敬畏”词根的重复及“在他面前”的临在、恭敬意味；“心存”使现代汉语通顺而不改变核心意义。
theological_decisions:
- issue: מִלְּפָנָיו 中代词后缀的所指
  choice: 译作“在他面前”，其中“他”指上帝
  alternative: 为明确起见译作“在上帝面前”
  rationale: 最近且最自然的先行词是“上帝”；保留代词可维持原文衔接，并避免不必要的重复。
- issue: 罪人“长久”的因果主体
  choice: 译作“仍得以长久存活”
  alternative: 译作“延长自己的寿命”或“活得长久”
  rationale: 原文表达可指寿命被延长或长久活着，并未明确说明是谁使其延长；“得以”避免把延寿能力明确归给罪人，也不额外指定上帝为直接施行者。
- issue: “终必安好”的时间与报偿含义
  choice: 保留概括性的未来确信
  alternative: 明确解释为今生兴盛或末后奖赏
  rationale: 经文本身断言敬畏上帝者将有好的结局，却未在本节限定实现方式或时间；译文不导入特定的报偿体系。
translation_notes:
  register: 采用现代、庄重且易懂的标准普通话。“尽管……但……”清楚呈现让步与转折；保留“一百次”和两次“敬畏”的修辞力度。正文中的所有脚注标记均已对应列出。
