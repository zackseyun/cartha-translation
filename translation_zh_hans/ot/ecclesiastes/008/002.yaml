base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/008/002.yaml
  text: I say[a], keep the king’s command[c][b], because of your oath before God.
translation:
  language: zh_hans
  text: 我说[a]，你要遵守王的命令[b]，因为你在上帝面前所起的誓[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或可译：“我说：你要遵守王的命令；这也因上帝的誓而定。”希伯来文句式紧缩，可以有略微不同的句法划分。
    reason: alternative_reading
  - marker: b
    text: 希伯来文直译为“王的口”。
    reason: lexical_alternative
  - marker: c
    text: “在上帝面前所起的誓”也可理解为“向上帝所起的誓”或“上帝的誓”。
    reason: alternative_reading
lexical_decisions:
- source_word: אֲנִי
  choice: 我说
  rationale: 希伯来文以独立代词“我”突兀起句，谓语需要从语境中补出。译作“我说”以最少的增补形成自然汉语，同时保留说话者的自我强调；原文也可能按不同句法理解，故加注说明。
- source_word: פִּי מֶלֶךְ
  choice: 王的命令
  rationale: 字面为“王的口”，在此指王口中所出的话或命令。“王的命令”在现代汉语中自然，也传达其权威含义。
- source_word: שְׁמֹר
  choice: 遵守
  rationale: 该动词可指看守、谨守或遵行；与“命令”搭配时，“遵守”准确表达这里所要求的顺服行动，同时不作过度发挥。
- source_word: וְעַל דִּבְרַת
  choice: 因为
  rationale: 这一连接词与介词性短语结构紧缩，在此最可能说明遵守王命的缘由。译作“因为”使汉语顺畅；“也要顾念”等并列式理解仍属可能，故在脚注保留。
- source_word: שְׁבוּעַת אֱלֹהִים
  choice: 你在上帝面前所起的誓
  rationale: 该组合可理解为在上帝面前所起的誓、向上帝所起的誓，或“上帝的誓”。正文依据第二人称命令的语境，采用听者在上帝面前起誓的理解；“你”是由命令句隐含的主语补出。
theological_decisions:
- issue: שְׁבוּעַת אֱלֹהִים 与服从王命之间的关系
  choice: 听者在上帝面前所起的誓，是遵守王命的缘由
  alternative: 向上帝所起的誓，或属于上帝／由上帝所起的誓
  rationale: 命令语境下，正文所选读法最连贯，但原文的属格关系并不明确。脚注保留其他可能，避免把本节扩展为无条件服从王权的教义。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“遵守王的命令”清楚表达希伯来习语；正文补出“我说”和“你”，以满足汉语表达需要，并用脚注保留原文的省略与句法歧义。
