  text: אֶת כָּל זֶ֤ה רָאִ֨יתִי֙ וְ/נָת֣וֹן אֶת לִבִּ֔/י לְ/כָֽל מַעֲשֶׂ֔ה אֲשֶׁ֥ר נַעֲשָׂ֖ה תַּ֣חַת הַ/שָּׁ֑מֶשׁ עֵ֗ת אֲשֶׁ֨ר שָׁלַ֧ט הָ/אָדָ֛ם בְּ/אָדָ֖ם לְ/רַ֥ע לֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/008/009.yaml
  text: All this I have seen[a], while applying my heart to every deed that is done under the sun, at a time when man has ruled over man to his harm.
translation:
  language: zh_hans
  text: 这一切我都看见了，并且专心考察日光之下所做的一切事：有时，人辖制人，以致他受害。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “他”通常理解为受辖制的人；也可能指掌权者本人，即“给自己带来祸害”。
    reason: 保留 לְרַע לוֹ 中代词所指对象的真实歧义。
lexical_decisions:
- source_word: רָאִיתִי
  choice: 我都看见了
  rationale: 完成式在传道者回顾累积观察的语境中译为“看见了”自然直接；“都”与前面的“这一切”呼应。
- source_word: וְנָתוֹן אֶת־לִבִּי
  choice: 也用心察看
  rationale: 此习语表示把内心、思想转向某事并加以考察。“用心察看”既保留“心”的意象，又符合现代汉语表达；“也”承接前句的观察活动。
- source_word: מַעֲשֶׂה / נַעֲשָׂה
  choice: 所做的一切事
  rationale: 以“所做的事”自然表达名词“行为、事情”与被动动词“被做”的组合，不把范围限缩为劳动或工作。
- source_word: תַּחַת הַשָּׁמֶשׁ
  choice: 日光之下
  rationale: 保留传道书反复出现的特征性表达，同时维持庄重而通顺的中文。
- source_word: עֵת אֲשֶׁר
  choice: 那时
  rationale: 明确保留原文的时间名词结构，并将其理解为对所观察情形的时间说明。
- source_word: שָׁלַט
  choice: 辖制
  rationale: 该词指对他人行使权力或支配。“辖制”比单纯“管理”更能体现权力关系，又未额外加入暴虐等评价。
- source_word: הָאָדָם בְּאָדָם
  choice: 人辖制人
  rationale: 两个 אָדָם 均以单数作代表性用法。“人……人”在中文中自然涵盖人类个体，也保留原文简洁、警句式的重复结构。
- source_word: לְרַע לוֹ
  choice: 使他受害
  rationale: 表达该权力关系导致伤害，同时用“他”保留 לוֹ 的单数形式及其指代可能存在的歧义，不擅自补成“使别人”或“害了自己”。
theological_decisions:
- issue: אָדָם 在代表性陈述中的表达
  choice: 人辖制人
  alternative: 一个人辖制另一个人
  rationale: 现代汉语的“人”本身不标示性别，既准确表达原文所指的人类个体，又保留两个相同名词构成的警句式张力。
- issue: לוֹ 所指的受害者
  choice: 正文保留“使他受害”的指代歧义
  alternative: 使受辖制的人受害；或使掌权者自己受害
  rationale: 语法上的单数代词可能回指掌权者，也可能按语境指受其辖制者。多数语境理解偏向后者，但原文没有以反身形式完全排除前者，因此不在正文中强行判定。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“日光之下”保留传道书的固定文学表达；“用心察看”兼顾希伯来语心智意象和中文自然度。分号呈现观察内容与随后时间情形之间的联系，避免把经文拆成彼此无关的句子。
