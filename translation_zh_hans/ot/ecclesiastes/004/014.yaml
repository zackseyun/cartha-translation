revisions:
- from: 因为他从监牢里出来作王[a]，尽管他在自己的国中出生时也很贫穷[b]。
  to: 因为他从监牢[a]出来作王；即使在自己的国中[b]，他也是生来贫穷的。
  rationale: 修订保留“从……出来作王”的原文意象和第二分句的让步语气；以“生来贫穷”自然表达被动完成体“被生为贫穷”，并不以汉语过去完成式作不必要的强化。“即使在自己的国中”保留正文所采用的空间性读法，同时以脚注呈现该词的其他合理范围；锚点移至对应词语之后。
