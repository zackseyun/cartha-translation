  source_fidelity: 草稿准确表达了“从被囚之处出来作王”和“生来贫穷”的基本意思，也恰当地将第二个 כִּי 按让步关系处理。不过，“他在自己的国中出生时也很贫穷”把 בְּמַלְכוּתוֹ 直接修饰为出生地点，较原文更明确，且汉语语义不顺；应保留其与“国度／王权／在位时期”相关的歧义。
  naturalness: “在自己的国中出生时也很贫穷”不够自然，容易理解为他出生在自己的国家。改为“即使在自己的国中，他也是生来贫穷的”较通顺，并避免把“国中”限定为出生地点。
  terminology: “监牢”“作王”“贫穷”均适合庄重、现代的经文语体。“被囚者之屋”可在脚注中作为直译说明。脚注标记应紧随其所说明的词语：a 应置于“监牢”后，b 应置于“国中”后。
