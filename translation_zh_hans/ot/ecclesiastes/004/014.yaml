source:
  edition: WLC
  text: כִּֽי מִ/בֵּ֥ית הָ/סוּרִ֖ים יָצָ֣א לִ/מְלֹ֑ךְ כִּ֛י גַּ֥ם בְּ/מַלְכוּת֖/וֹ נוֹלַ֥ד רָֽשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/004/014.yaml
  text: For he came out from the house of prisoners to reign[b][a], though even in his kingdom he had been born poor.
translation:
  language: zh_hans
  text: 因为他从监牢[a]出来作王；即使在自己的国中[b]，他也是生来贫穷的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “监牢”按希伯来语直译为“被囚者之屋”。
    reason: lexical_alternative
  - marker: b
    text: “在自己的国中”或译“在他的王权之下”或“在位期间”；原词可指国度、王权或统治时期。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִבֵּית הָסוּרִים
  choice: 从监牢里
  rationale: 希伯来语直译为“从被囚者之屋”，现代汉语以“监牢”自然表达该惯用语，并保留受囚禁之处的意象；脚注注明字面形式。
- source_word: יָצָא
  choice: 出来
  rationale: 准确表达从囚禁之处离开的动作，符合现代汉语习惯。
- source_word: לִמְלֹךְ
  choice: 作王
  rationale: 该不定式意为“作王、掌王权”；“作王”简洁自然，并保留明确的君王语义。
- source_word: גַּם
  choice: 也
  rationale: 保留原文的附加强调，而不把其解释力度过度固定；与“尽管”搭配可自然呈现让步关系。
- source_word: בְּמַלְכוּתוֹ
  choice: 在自己的国中
  rationale: מַלְכוּת 可指国度、王权或在位时期；正文采用空间性的“国中”，同时用脚注保留“在位期间”的可能读法。
- source_word: נוֹלַד
  choice: 出生时
  rationale: 完成体所述出生早于后来作王；汉语借语境和“出生时”即可自然表达，无须机械添加过去完成标记。
- source_word: רָשׁ
  choice: 贫穷
  rationale: 直接表达 רָשׁ 的常见意义，庄重且为现代读者熟悉。
- source_word: כִּי ... כִּי
  choice: 因为……尽管
  rationale: 首个 כִּי 引出对上文的解释，第二个 כִּי 在此适合按让步关系理解；如此既呈现经文逻辑，也避免生硬重复“因为”。
theological_decisions: []
