source:
  edition: WLC
  text: אֵֽין קֵ֣ץ לְ/כָל הָ/עָ֗ם לְ/כֹ֤ל אֲשֶׁר הָיָה֙ לִ/פְנֵי/הֶ֔ם גַּ֥ם הָ/אַחֲרוֹנִ֖ים לֹ֣א יִשְׂמְחוּ ב֑/וֹ כִּֽי גַם זֶ֥ה הֶ֖בֶל וְ/רַעְי֥וֹן רֽוּחַ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/004/016.yaml
  text: There was no end to all the people[a], to all who were before them; yet those who come later will not rejoice in him[c][b]. For this too is vanity and a chasing after wind.
translation:
  language: zh_hans
  text: 所有百姓多得没有尽头[a]，所有在他们以前的人也是如此。然而，后来的人不会因他欢喜[b]。这也是虚空[c]，是捕风。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“所有百姓，就是所有在他们以前的人，都多得没有尽头。”本句的希伯来文句法艰深，可有不止一种理解。
    reason: alternative_reading
  - marker: b
    text: “因他欢喜”也可译为“为他欢喜”或“以他为乐”。
    reason: lexical_alternative
  - marker: c
    text: 希伯来文为“hebel”，是《传道书》的主题词，指短暂、虚幻、难以把握或令人徒劳受挫的事物。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵין קֵץ
  choice: 无穷无尽
  rationale: 该存在否定式与“尽头”连用，表示没有限度、人数不可胜数；中文以“无穷无尽”自然传达其意义，同时不强行限定为过去或现在。
- source_word: לְכָל הָעָם
  choice: 在所有百姓中，人多得
  rationale: 介词 לְ 在此表示所论及的对象。结合 אֵין קֵץ，译为“在所有百姓中，人多得无穷无尽”既照顾希伯来语关系，也使现代中文通顺。
- source_word: לְכֹל אֲשֶׁר הָיָה לִפְנֵיהֶם
  choice: 在他们以前的众人也是如此
  rationale: 原句结构紧缩且指代含混；此译保留“他们以前”这一关系，不明确补出某位统治者，也不采用解释性较强的“他所统治的众人”。
- source_word: הָאַחֲרוֹנִים
  choice: 后来的人
  rationale: 该形容词指时间上在后的人，可能是后来的世代；“后来的人”简洁自然，并与“以前”形成对照。
- source_word: לֹא יִשְׂמְחוּ בוֹ
  choice: 不会因他欢喜
  rationale: שׂמח 表示欢喜，בּוֹ 可表达因他、为他或对他欢喜。“因他欢喜”保留男性单数所指，同时避免过度确定其关系。
- source_word: הֶבֶל
  choice: 虚空
  rationale: 这是《传道书》的主题词，涵盖短暂、空幻、难以把握和令人徒劳受挫等意蕴；“虚空”保留传统经文共鸣，又不缩减为单纯“毫无意义”。
- source_word: רַעְיוֹן רוּחַ
  choice: 捕风
  rationale: 该固定表达描绘追逐、抓取风的徒劳。“捕风”凝练自然，保留原文意象，并与“虚空”相称。
theological_decisions:
- issue: 本节复数与单数代词的所指
  choice: 保留“他们”和“他”，不明确指定为那位贫穷而有智慧的青年、君王或其他群体。
  alternative: 明确译成“在那青年以前的人”及“后来的人不会为这位新王欢喜”，或将前半句理解为“他所统治的所有百姓”。
  rationale: 希伯来文句法高度压缩，代词所指存在真实争议。正文采用最自然的上下文理解，却不加入原文没有明说的身份，以保留经文本身的张力。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“无穷无尽”“后来的人”“因他欢喜”保持经文语气；“虚空”“捕风”保留《传道书》的主题词与核心意象。所有脚注标记均已置于正文相应位置。
