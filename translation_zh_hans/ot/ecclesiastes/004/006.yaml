base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/004/006.yaml
  text: Better is a handful with rest than two handfuls with toil and a striving after wind[a][b].
translation:
  language: zh_hans
  text: 满了一把，得享安静，强如满了两把，劳碌捕风。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “安静”或译“安宁”。
    reason: lexical_alternative
  - marker: b
    text: “捕风”也可译作“追逐风”；传统译法作“心灵的烦恼”。
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב
  choice: 胜过
  rationale: 该形容词在此引出箴言式比较；用“胜过”自然表达希伯来文的比较结构。
- source_word: מְלֹא כַף
  choice: 一把
  rationale: 字面为“一掌之满”，指一只手所能盛的量；“一把”简洁自然，并与下文“两手满”形成鲜明对照。
- source_word: נָחַת
  choice: 安宁
  rationale: 该名词表示安静、休息或从容的状态；“安宁”既保留内外平静之意，也适合本节庄重的格言语体。
- source_word: מִמְלֹא חָפְנַיִם
  choice: 胜过两手满
  rationale: 介词 מִן 表比较；חָפְנַיִם 是双数，指双手捧满。译作“两手满”保留具体意象。
- source_word: עָמָל
  choice: 劳碌
  rationale: 在《传道书》中常指令人疲惫、困苦的劳作；“劳碌”兼具劳动及其重负的意味。
- source_word: וּרְעוּת רוּחַ
  choice: 和捕风
  rationale: 这是《传道书》中反复出现的隐喻，表达追逐风一般徒劳无获；“捕风”凝练、形象，也不把 רוּחַ 解释为人的“心灵”。
theological_decisions:
- issue: רוּחַ 在固定短语中的含义
  choice: 风
  alternative: 心灵／精神
  rationale: 与 רְעוּת 组合时，语境呈现对无法抓住之物的徒劳追逐；保留“风”的具体意象，避免采用带解释性的传统译法“烦恼心灵”。
translation_notes:
  register: 采用现代、凝练而庄重的箴言式表达。“一把”与“两手满”保持数量和意象上的对照；“捕风”保留原文刻意而富张力的隐喻。
