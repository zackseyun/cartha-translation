  text: ט֛וֹב יֶ֥לֶד מִסְכֵּ֖ן וְ/חָכָ֑ם מִ/מֶּ֤לֶךְ זָקֵן֙ וּ/כְסִ֔יל אֲשֶׁ֛ר לֹא יָדַ֥ע לְ/הִזָּהֵ֖ר עֽוֹד־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/004/013.yaml
  text: Better is a poor but wise youth than an old and foolish king who no longer knows how to heed warning[a].
translation:
  language: zh_hans
  text: 贫穷而有智慧的少年，胜过年老又愚昧、不再懂得接受劝诫的君王[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“不再懂得接受教导”；或“不再懂得听从警告”。
    reason: לְהִזָּהֵר在此可侧重接受劝诫、受教或听从警告，原文容许这些相近理解。
lexical_decisions:
- source_word: טוֹב ... מִן
  choice: ……胜过……
  rationale: טוֹב与比较用的מִן构成比较句；“胜过”在现代汉语中自然、简洁地表达“更好”。
- source_word: יֶלֶד
  choice: 少年
  rationale: 该词指年轻人；“少年”既与“年老”形成鲜明对照，也不把年龄限定为幼童或成年男子。
- source_word: מִסְכֵּן
  choice: 贫穷
  rationale: 此处主要表示贫困或社会地位低微；“贫穷”直接保留其经济处境。
- source_word: וְחָכָם
  choice: 而有智慧
  rationale: 连接词在这里把与贫穷形成反差的特质并列出来；“而”自然呈现这种转折意味，又不增加原文内容。
- source_word: מֶלֶךְ זָקֵן וּכְסִיל
  choice: 年老又愚昧的君王
  rationale: 依次保留“君王、年老、愚昧”的信息；“愚昧”符合智慧文学中כְּסִיל所含的判断与品格层面的负面含义，不只指智力不足。
- source_word: אֲשֶׁר לֹא יָדַע ... עוֹד
  choice: 不再懂得
  rationale: 否定词与עוֹד合用，表示这种能力或态度已经不复存在；“不再”准确表达时间上的延续终止。
- source_word: לְהִזָּהֵר
  choice: 接受劝诫
  rationale: 该Niphal不定式在此语境中指让自己受到警戒、告诫或纠正；“接受劝诫”突出君王不肯或不会受人规劝的含义，同时以脚注保留其他可能译法。
