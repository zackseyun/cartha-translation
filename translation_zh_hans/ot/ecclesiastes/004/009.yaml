  yaml_path: translation/ot/ecclesiastes/004/009.yaml
  text: Two are better than one[a], because they have a good reward for their labor.
translation:
  language: zh_hans
  text: 两个人胜过一个人，因为他们劳碌会有美好的回报。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因为他们从劳碌中得到美好的收益。”
    reason: בַּעֲמָלָם中的ב可侧重回报源自劳碌；שָׂכָר也可译为“收益”。
lexical_decisions:
- source_word: טוֹבִים הַשְּׁנַיִם מִן הָאֶחָד
  choice: 两个人胜过一个人
  rationale: טוֹבִים 与 מִן 构成比较，译为“胜过”；两个带冠词的数词在此表达泛指的格言性对比，并非指先前提到的特定人物。
- source_word: אֲשֶׁר
  choice: 因为
  rationale: 这里引出前句判断的理由，现代汉语用“因为”能自然表达其因果关系。
- source_word: יֵשׁ לָהֶם
  choice: 他们……能得到
  rationale: 希伯来语存在句配 ל 表示拥有或所得；结合 שָׂכָר，译作“能得到”比直译“有”更符合现代汉语。
- source_word: שָׂכָר טוֹב
  choice: 美好的回报
  rationale: שָׂכָר 可指劳动所得、报偿或收益，不必限于工资；“回报”保留其宽泛含义，טוֹב 译为“美好的”。
- source_word: בַּעֲמָלָם
  choice: 劳碌
  rationale: עָמָל 在《传道书》中常指辛劳、劳作；前置词 ב 可表达回报与劳动之间的关联。正文采用汉语因果结构整合为“劳碌能得到”。
theological_decisions: []
translation_notes:
  register: 采用简洁、格言式的现代标准汉语。“两个人”避免生硬照搬定冠词；“劳碌”保留《传道书》中 עָמָל 的辛劳色彩；“美好的回报”兼顾庄重与通俗。
