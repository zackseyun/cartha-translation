  rationale: 修订仅将“可以”改为表结果的“会”，并以“跌倒时没有另一个人扶他起来”直接对应“跌倒的人”和“没有第二个扶起他的人”。保留原文的具体跌倒意象、数目对照、同伴关系和哀叹式警告，不将跌倒解释为身体、道德或其他特定情形。
