base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/004/010.yaml
  text: For if they fall[a], one will lift up his companion[b]; but woe to the one who falls when there is not a second to lift him up.
translation:
  language: zh_hans
  text: 因为他们若跌倒，一个会扶起同伴；但那跌倒时没有另一个人扶他起来的，就有祸了！
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי אִם
  choice: 因为……若
  rationale: 引出说明性的条件句，承接上文“两个人总比一个人好”的论证；“因为……若”既保留逻辑联系，也符合现代汉语表达。
- source_word: יִפֹּלוּ
  choice: 他们若跌倒
  rationale: 保留נפל的具体“跌倒”意象，并与后半句的单数形式形成清楚呼应。
- source_word: הָאֶחָד
  choice: 一个
  rationale: 在两人语境中表达其中一人，简洁自然，不额外限定身份。
- source_word: יָקִים
  choice: 可以扶起
  rationale: קום的使役式表示使人站起来；“扶起”准确体现同伴相助的动作，“可以”自然传达条件句中的实际益处。
- source_word: אֶת חֲבֵרוֹ
  choice: 同伴
  rationale: חבר在此指相伴之人；“同伴”比“朋友”更宽泛，也更贴合两人同行或共事的语境。
- source_word: וְאִילוֹ
  choice: 但……就有祸了
  rationale: 保留哀叹兼警告的强烈语气；汉语以“有祸了”自然表达希伯来语的祸哉句式。
- source_word: הָאֶחָד שֶׁיִּפּוֹל
  choice: 那独自一人跌倒
  rationale: 结合后文“没有第二人”显明其孤身处境，同时保留与前句“跌倒”的词语重复。
- source_word: וְאֵין שֵׁנִי
  choice: 没有另一个人
  rationale: 希伯来语直译为“没有第二个”；现代汉语用“没有另一个人”较为自然，并保留两人与一人的数目对比。
- source_word: לַהֲקִימוֹ
  choice: 扶他
  rationale: 与前面的“扶起”保持动作上的呼应；宾语已明确时省去第二个“起”更符合汉语节奏，含义不变。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。保留“跌倒—扶起”的具体意象、前后数目对比及末句的警告力度；不将“跌倒”限定为道德失败或身体事故，以保存原文可兼具实际与比喻应用的开放性。
