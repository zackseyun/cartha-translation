  naturalness: 整体为自然、庄重的现代汉语。“那跌倒时没有另一个人扶他起来的，就有祸了”比以“独自一人”作定语更顺畅，也更紧贴原文句法关系。
  terminology: “同伴”恰当对应חבר，避免将关系限定为情感意义较强的“朋友”。“有祸了”可表达אילוֹ的哀叹和警告，不应理解为特定教义性的刑罚宣告。
