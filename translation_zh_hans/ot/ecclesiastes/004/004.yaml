  text: וְ/רָאִ֨יתִֽי אֲנִ֜י אֶת כָּל עָמָ֗ל וְ/אֵת֙ כָּל כִּשְׁר֣וֹן הַֽ/מַּעֲשֶׂ֔ה כִּ֛י הִ֥יא קִנְאַת אִ֖ישׁ מֵ/רֵעֵ֑/הוּ גַּם זֶ֥ה הֶ֖בֶל וּ/רְע֥וּת רֽוּחַ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/004/004.yaml
  text: And I saw that all labor and all skillful work come from a man's envy of his neighbor[c][b][a]. This too is vanity and a chasing after wind.
translation:
  language: zh_hans
  text: 我又看见，一切劳碌和一切工作上的才干[a]，都出于人对邻舍的嫉妒[b]。这也是虚空，也是捕风[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“一切工作上的成就”；希伯来语 כִּשְׁרוֹן 可指才干、胜任能力，也可指由此产生的成就。
    reason: lexical_alternative
  - marker: b
    text: 希伯来语直译近于“一个男人对他同伴的嫉妒”；这里的阳性单数很可能具有代表性。
    reason: lexical_alternative
  - marker: c
    text: 或译“追逐风”；这一希伯来语短语也可能带有“牧风”的字面意象。
    reason: lexical_alternative
lexical_decisions:
- source_word: עָמָל
  choice: 劳碌
  rationale: 在《传道书》中常指辛苦、令人疲惫的劳作；“劳碌”既保留这种负重感，也符合现代汉语圣经语体。
- source_word: כִּשְׁרוֹן הַמַּעֲשֶׂה
  choice: 做工的才干
  rationale: כִּשְׁרוֹן 可指技能、胜任能力，也可指由此取得的成就；正文采用“才干”以突出工作的熟练与能力，并在脚注保留“成就”的可能。
- source_word: כִּי הִיא
  choice: 都出于
  rationale: 希伯来语直译近于“因为这是”，此处无系词结构表达劳碌和才干与嫉妒的关联；“都出于”在汉语中自然地传达其所暗示的动因，但不扩展为更具体的心理理论。
- source_word: קִנְאַת
  choice: 嫉妒
  rationale: 语境涉及人与邻舍之间的比较和竞争，“嫉妒”比“热心”或“妒忌心”更准确、自然。
- source_word: אִישׁ מֵרֵעֵהוּ
  choice: 人对邻舍
  rationale: אִישׁ 为阳性单数，但在此很可能具有代表性；正文用“人”自然表达泛指，脚注说明原文形式。רֵעַ 可指邻舍、同伴，正文选用“邻舍”以保留人际比较的语境。
- source_word: הֶבֶל
  choice: 虚空
  rationale: 这是《传道书》的主题词，涵盖短暂、徒然和难以把握等含义；“虚空”保留其丰富张力，避免仅译成“毫无意义”而缩窄词义。
- source_word: רְעוּת רוּחַ
  choice: 捕风
  rationale: 该短语描绘徒劳地企图抓住风；“捕风”简洁、形象，也符合庄重而易懂的现代汉语表达。
theological_decisions:
- issue: 劳碌和工作才干与嫉妒之间关系的范围
  choice: 译作“都出于人对邻舍的嫉妒”
  alternative: “都是人对邻舍的嫉妒”或仅让“做工的才干”与嫉妒相连
  rationale: 句法中的阴性单数“הִיא”可能回指最近的 כִּשְׁרוֹן，也可能概括前述整件事；上下文和并列宾语支持将评断涵盖“劳碌”和“做工的才干”，但正文不进一步把这句话绝对化为关于所有工作的系统性教义。
translation_notes:
  register: 采用现代、庄重而通顺的普通话。“劳碌”“虚空”“捕风”保留《传道书》的主题性表达；“做工的才干”较贴近原文结构，同时以脚注交代“成就”的可能。所有脚注标记均置于相关词句之后。
