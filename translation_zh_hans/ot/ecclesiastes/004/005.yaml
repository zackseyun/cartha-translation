  text: The fool folds his hands and eats his own flesh[a][b].
translation:
  language: zh_hans
  text: 愚昧人双手交抱[a]，吃自己的肉[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“合拢双手”或“抱住双手”；这里描绘闲懒、不做事的姿态。
    reason: lexical_alternative
  - marker: b
    text: 意思是：他因自己的愚昧或懒惰而毁坏自己。
    reason: metaphor_explanation
lexical_decisions:
- source_word: הַכְּסִיל
  choice: 愚昧人
  rationale: 在智慧文学中指道德和判断上愚昧的人，不只是智力不足者；“愚昧人”符合中文箴言式语气。
- source_word: חֹבֵק אֶת־יָדָיו
  choice: 抱着双手
  rationale: חֹבֵק本义为“抱、搂、环抱”；与“双手”连用，描绘双手相抱、无所作为的姿态。正文保留具体形象，脚注说明其含义。
- source_word: וְאֹכֵל
  choice: 吃
  rationale: 分词在这里表达格言性、持续性的典型行为；中文用一般陈述“吃”自然简洁，并保留与前句并列的结构。
- source_word: בְּשָׂרוֹ
  choice: 自己的肉
  rationale: בָּשָׂר直译为“肉”；第三人称单数所有格在此具有明显的自身指向。保留强烈的身体隐喻，而不在正文中改写为抽象的“毁灭自己”。
theological_decisions:
- issue: “吃自己的肉”的隐喻含义
  choice: 正文保留字面的身体隐喻，脚注指出它表达愚昧或懒惰导致的自我毁坏。
  alternative: 在正文中意译为“毁掉自己”或“消耗自己”。
  rationale: 希伯来文刻意采用尖锐而开放的形象。保留该形象既呈现自我伤害的含义，又不把它限定为某一种具体后果。
translation_notes:
  register: 采用现代、简洁而庄重的智慧文学语体。“抱着双手”贴近原文动词的具体形象；两个脚注分别说明动作的惯用含义和后半句的隐喻意义。
