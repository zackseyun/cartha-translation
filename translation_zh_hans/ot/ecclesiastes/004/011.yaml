  yaml_path: translation/ot/ecclesiastes/004/011.yaml
  text: Again[a], if two lie down together, they keep warm; but how can one keep warm alone?
translation:
  language: zh_hans
  text: 再者，若两个人躺在一起，便有暖意；一个人怎能暖和呢？
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: גַּם
  choice: （不单独译出）
  rationale: 此词承接上文，表示递进或补充。现代汉语中直接续述这一例证已能自然体现其衔接作用；若硬译“再者”略显生硬。
- source_word: אִם יִשְׁכְּבוּ שְׁנַיִם
  choice: 两个人若躺在一起
  rationale: 保留条件结构“若”，并将实词意义为“躺下”的 שׁכב 译作“躺”；“两个人”比单说“两个”更符合现代汉语。原文并未明确指睡眠，故不译作“同睡”。
- source_word: וְחַם לָהֶם
  choice: 就能暖和
  rationale: 原文近于“他们便有暖意／他们暖和”，译作“就能暖和”既自然，又表达两人同卧所产生的结果，不额外限定为持续保暖。
- source_word: וּלְאֶחָד
  choice: 一个人独自一人
  rationale: 原文直译近于“但对于一个人”。汉语补出“独自一人”，明确呈现与“两个人”的对比，而不改变原意。
- source_word: אֵיךְ יֵחָם
  choice: 怎能暖和呢
  rationale: 保留反问语气；יֵחָם 可指变暖或暖和，译文不将其收窄为单纯“保持温暖”。
