id: ECC.4.1
reference: Ecclesiastes 4:1
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/שַׁ֣בְתִּֽי אֲנִ֗י וָ/אֶרְאֶה֙ אֶת כָּל הָ֣/עֲשֻׁקִ֔ים אֲשֶׁ֥ר נַעֲשִׂ֖ים תַּ֣חַת הַ/שָּׁ֑מֶשׁ וְ/הִנֵּ֣ה דִּמְעַ֣ת הָ/עֲשֻׁקִ֗ים וְ/אֵ֤ין לָ/הֶם֙ מְנַחֵ֔ם וּ/מִ/יַּ֤ד עֹֽשְׁקֵי/הֶם֙ כֹּ֔חַ וְ/אֵ֥ין לָ/הֶ֖ם מְנַחֵֽם־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/004/001.yaml
  text: 'Then I turned and saw all the oppressions that are done under the sun: and behold[a], the tears of the oppressed, and they had no comforter. Power was in the hand of their oppressors[b], and they had no comforter.'
translation:
  language: zh_hans
  text: 我又转而察看日光之下所发生的一切欺压：看哪[a]，受欺压之人的眼泪！他们无人安慰。欺压他们的人手中有权势[b]，他们却无人安慰。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “一切欺压”或译“一切受欺压的人”。希伯来语的被动分词既可指受欺压的人，也可引申指欺压之事。
    reason: alternative_reading
  - marker: b
    text: 直译：“从欺压他们之人的手中，是权势。”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׁבְתִּי אֲנִי
  choice: 我又转而
  rationale: שוב在此引出传道者新一轮的观察，不一定指实际返回；“又转而”既保留转向的意象，也自然承接上下文。
- source_word: כָּל הָעֲשֻׁקִים אֲשֶׁר נַעֲשִׂים
  choice: 所发生的一切欺压
  rationale: הָעֲשֻׁקִים形式上可指“受欺压的人”，也可延伸指欺压之事；与“发生/被做”搭配时，正文采用后者，使汉语通顺，并以脚注保留另一读法。
- source_word: תַּחַת הַשָּׁמֶשׁ
  choice: 日光之下
  rationale: 保留《传道书》的标志性表达，庄重而为现代读者所理解。
- source_word: וְהִנֵּה
  choice: 看哪
  rationale: 该词唤起读者注意，并使眼前景象更鲜明；“看哪”保留其修辞力度。
- source_word: דִּמְעַת הָעֲשֻׁקִים
  choice: 受欺压之人的眼泪
  rationale: דִּמְעַת虽为单数构造形式，在此具有集合意义；汉语“眼泪”自然表达持续和普遍的哀哭。
- source_word: וְאֵין לָהֶם מְנַחֵם
  choice: 他们无人安慰
  rationale: 存在句表达没有任何安慰他们的人；此译简洁自然，并在两处保持同样措辞，凸显重复的哀叹。
- source_word: וּמִיַּד עֹשְׁקֵיהֶם כֹּחַ
  choice: 欺压他们的人手中有权势
  rationale: 保留“手中”这一权力掌控的意象，同时按现代汉语语序表达压迫者占据权势的不平衡局面。
- source_word: עֹשְׁקֵיהֶם
  choice: 欺压他们的人
  rationale: 主动分词指实施欺压者；用短语可与前文“受欺压之人”形成清楚对应，且比“欺压者”略为口语易懂。
theological_decisions:
- issue: 开头הָעֲשֻׁקִים的所指
  choice: 正文译为“一切欺压”，指欺压之事
  alternative: “一切受欺压的人”
  rationale: 其形态本可具体指受欺压者，但与אֲשֶׁר נַעֲשִׂים（所发生/被做的）连用，更容易理解为种种欺压之事；脚注保留人的读法，不消除原文歧义。
- issue: 安慰者缺席的时态
  choice: 用无显式时态的汉语“他们无人安慰”
  alternative: “那时没有人安慰他们”或“他们没有安慰者”
  rationale: 汉语无需强加过去或现在时，既适合叙述中的所见，也保留这句话可表达持续普遍处境的张力。
- issue: 压迫者权势的来源或所在
  choice: 译作“手中有权势”
  alternative: “从欺压他们之人的手中而来的，是权势”
  rationale: 原文介词מִן可形成较生硬的“从……手中”，但语义重点是权势掌握在压迫者一方；正文采用自然汉语，脚注注明字面结构。
translation_notes:
  register: 采用现代、庄重且易懂的标准普通话。“日光之下”保留全书的固定表达；重复“他们无人安慰”，重现原文的沉重节奏。正文中的[a]、[b]均与脚注对应。
