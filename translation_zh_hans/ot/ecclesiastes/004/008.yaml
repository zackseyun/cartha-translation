  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: יֵ֣שׁ אֶחָד֩ וְ/אֵ֨ין שֵׁנִ֜י גַּ֣ם בֵּ֧ן וָ/אָ֣ח אֵֽין ל֗/וֹ וְ/אֵ֥ין קֵץ֙ לְ/כָל עֲמָל֔/וֹ גַּם עיני/ו לֹא תִשְׂבַּ֣ע עֹ֑שֶׁר וּ/לְ/מִ֣י אֲנִ֣י עָמֵ֗ל וּ/מְחַסֵּ֤ר אֶת נַפְשִׁ/י֙ מִ/טּוֹבָ֔ה גַּם זֶ֥ה הֶ֛בֶל וְ/עִנְיַ֥ן רָ֖ע הֽוּא־־־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/004/008.yaml
  text: There is one man[a], and he has no second; he has neither son nor brother, and there is no end to all his labor[c][b]. Yet his eyes are not satisfied with wealth, and he says, “And for whom am I laboring and depriving myself of good?” This too is vanity and a grievous business.
translation:
  language: zh_hans
  text: 有一个人[a]，没有第二个；他既没有儿子，也没有兄弟。他的一切劳碌没有尽头；他的眼目也不以财富为满足：“我为谁劳碌，使自己缺少好处呢？”这也是虚空[b]，是件苦恼的事。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译：“有一个，没有第二个”；可指有一个人而没有同伴或相伴的人。
    reason: 保留原文简练而略带歧义的表达及“第二个”的意象。
  - marker: b
    text: “虚空”所译的希伯来词也可指气息、雾气，因而可含短暂、难以把握或徒然之意。
    reason: 说明传道书核心词 הֶבֶל 的多层含义。
lexical_decisions:
- source_word: יֵשׁ אֶחָד וְאֵין שֵׁנִי
  choice: 有一个孤单的人，没有第二个人
  rationale: 前半句直译为“有一个”，后句“没有第二个”表明此人孤单无伴；中文补出“孤单的人”使所指自然，同时保留“没有第二个人”的希伯来意象。
- source_word: גַּם בֵּן וָאָח אֵין לוֹ
  choice: 他既没有儿子，也没有兄弟
  rationale: 按原文保留两种男性近亲，不泛化为“家人”；“既没有……也没有……”符合现代汉语。
- source_word: וְאֵין קֵץ לְכָל עֲמָלוֹ
  choice: 他的一切劳碌没有尽头
  rationale: עָמָל带有辛劳、劳苦之意；“劳碌”也与后文分词עָמֵל形成词汇呼应。
- source_word: גַּם עֵינָיו לֹא תִשְׂבַּע עֹשֶׁר
  choice: 眼睛也不因财富而满足
  rationale: 保留גַּם的附加语气及“眼睛不满足”的原文表达；“财富”准确传达עֹשֶׁר。
- source_word: וּלְמִי אֲנִי עָמֵל
  choice: 我为谁劳碌
  rationale: 保留“为谁”的受益者含义，并与前文“劳碌”衔接。
- source_word: וּמְחַסֵּר אֶת נַפְשִׁי מִטּוֹבָה
  choice: 不让自己享福
  rationale: 字面义为“使自己缺少好处”。此处נֶפֶשׁ指本人，“不让自己享福”以自然汉语表达主动剥夺自己所得之美好。
- source_word: גַּם זֶה הֶבֶל
  choice: 这也是虚空
  rationale: “虚空”保留传道书中הֶבֶל的主题性传统译法；脚注提示其“气息、转瞬即逝”的形象和徒然意味。
- source_word: וְעִנְיַן רָע הוּא
  choice: 是件苦恼的事
  rationale: עִנְיָן可指事务、所从事之事，רָע在此强调其令人痛苦、不幸的性质；此译自然且不把它缩窄为商业意义。
theological_decisions:
- issue: נַפְשִׁי的人论含义
  choice: 自己
  alternative: 我的灵魂
  rationale: 在此智慧文学语境中，נֶפֶשׁ指整个人或本人；译作“自己”避免加入原文未要求的灵魂—身体二分。
- issue: הֶבֶל的主题性含义
  choice: 虚空
  alternative: 雾气／徒然
  rationale: 该词兼有气息般短暂、难以把握和徒然等层次；正文用传道书中易于识别的“虚空”，脚注保留其形象与语义张力。
- issue: 内心问句的引入方式
  choice: 他问
  alternative: 不补引语提示，直接接问句
  rationale: 希伯来文没有明写“他说/他问”，但人称从第三人称转为第一人称；中文补出“他问”仅标明话语转换，不把问题解释为必然说出口。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“劳碌”“虚空”维持传道书的主题用语；句法避免文言化。正文中的脚注标记均与脚注对应。
