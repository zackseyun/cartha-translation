  to: 有一个人[a]，没有第二个；他既没有儿子，也没有兄弟。他的一切劳碌没有尽头；他的眼目也不以财富为满足：“我为谁劳碌，使自己缺少好处呢？”这也是虚空[b]，是件苦恼的事。
  rationale: 修订避免在正文预先释义“没有第二个”，删去原文未明说的引语提示，并以“使自己缺少好处”保留原文对“好”的宽泛表达；同时微调“眼目”的搭配，使中文更自然而不损失原文意象。脚注标记与脚注内容均完整对应。
