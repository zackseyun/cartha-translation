base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/004/003.yaml
  text: But better than both of them is the one who has not yet been[a], who has not seen the evil deed that is done under the sun.
translation:
  language: zh_hans
  text: 但比这两者都更好的是那尚未存在、没有见过日光之下所行恶事的人[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或较为解释性地译作“尚未出生的人”。希伯来文较直译为“尚未存在的人”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְטוֹב
  choice: 但……更好
  rationale: טוֹב 在上下文中表达比较；“但”自然承接并推进第2节对活人和死人的比较。
- source_word: מִשְּׁנֵיהֶם
  choice: 比这两者
  rationale: 明确指回上一节的活人和死人，并保留与双方比较的含义。
- source_word: אֵת אֲשֶׁר עֲדֶן לֹא הָיָה
  choice: 那还未曾有过的人
  rationale: 尽量保留希伯来文“尚未存在／有过”的字面开放性，不在正文中直接限定为“尚未出生”。
- source_word: אֲשֶׁר לֹא רָאָה
  choice: 他没有见过
  rationale: 用自然现代汉语表达其未曾目睹的状态，并使关系从句清晰。
- source_word: הַמַּעֲשֶׂה הָרָע
  choice: 恶事
  rationale: מַעֲשֶׂה 可指行为、作为或所做之事；“恶事”简洁自然，也能涵盖上下文中的压迫恶行。
- source_word: אֲשֶׁר נַעֲשָׂה
  choice: 所行的
  rationale: 保留被动或非特定施事的意味，同时符合汉语对一般性行为的表达。
- source_word: תַּחַת הַשָּׁמֶשׁ
  choice: 日光之下
  rationale: 这是《传道书》的反复用语；“日光之下”庄重、清楚，适合全书一致使用。
theological_decisions:
- issue: “还未曾有过的人”具体指谁
  choice: 正文保留存在层面的宽泛说法
  alternative: 译作“尚未出生的人”
  rationale: 上下文很可能指未出生者，但希伯来文只直说“尚未有过／存在”；脚注给出解释性译法，以免正文过度明确。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“还未曾有过的人”略带陌生感，是为保留原文措辞及其含义张力；脚注提供更自然、解释性更强的理解。
