base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/004/015.yaml
  text: I saw all the living[a], those walking under the sun, with the second youth who would stand in his place.
translation:
  language: zh_hans
  text: 我看见日光之下所有活着的人，都与那第二个年轻人[a]在一起；他将取而代之。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “第二个年轻人”也可译为“第二个孩子”。“第二个”在这里可能指后来接替前一位统治者的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאִיתִי
  choice: 我看见
  rationale: 直接对应ראה的第一人称单数完成式，也符合《传道书》中说话者陈述观察所得的语气。
- source_word: כָּל הַחַיִּים
  choice: 一切活着的人
  rationale: 保留“所有活着者”的希伯来语表达，同时明确这里所指的是人。
- source_word: הַמְהַלְּכִים
  choice: 那些……行走的人
  rationale: 保留הלך分词所表达的持续活动状态，并在现代汉语中与前面的“活着的人”自然衔接。
- source_word: תַּחַת הַשָּׁמֶשׁ
  choice: 在日光之下
  rationale: 这是《传道书》的标志性反复用语；采用庄重且易懂的固定译法。
- source_word: עִם
  choice: 与……在一起
  rationale: 保留介词“同、与”的基本含义，不把众人与年轻人的关系过度解释为拥护、跟随或归顺。
- source_word: הַיֶּלֶד הַשֵּׁנִי
  choice: 那第二位年轻人
  rationale: ילד在此可指孩子或年轻人；政治承继的语境使“年轻人”较自然，而“第二位”保留序数词的真实含混，不直接改译为“继任者”。
- source_word: אֲשֶׁר יַעֲמֹד
  choice: 他将起来
  rationale: עמד的未完成式在此指此人将出现并取得位置；“起来”既可表达兴起，也与后面的接替关系相合。
- source_word: תַּחְתָּיו
  choice: 接替那人的位置
  rationale: 该词字面可作“在他之下”，但在承继语境中可表示代替某人；用“那人”保留代词指向在篇章中的含蓄性。
theological_decisions:
- issue: “第二位年轻人”的身份及群众与他的关系
  choice: 正文保留“第二位”和“与……在一起”，不明说他是受拥戴的继承人
  alternative: 译为“跟随那位继任的年轻人”或“拥护那位年轻继承人”
  rationale: 希伯来文只明确使用序数词שני和介词עם；将其解释为政治追随或拥戴虽符合上下文的一种理解，却超出词面，故不在正文中定论。
translation_notes:
  register: 采用现代、庄重而通顺的书面普通话。“日光之下”保持全书关键词的一致性；分号划分观察对象与年轻人将接位的说明。
