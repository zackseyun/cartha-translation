  yaml_path: translation/ot/ecclesiastes/004/012.yaml
  text: And if someone overpowers one[a], two will stand against him; and a threefold cord is not quickly broken.
translation:
  language: zh_hans
  text: 若有人制伏一个人，两个人也能抵挡他；三股合成的绳[a]不会很快被扯断。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“三重的绳。”希伯来文描述的是一根做成三重的绳。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: 即使
  rationale: 承接上文并引出假设情形；现代汉语用“即使”能自然表达这里带让步意味的条件关系。
- source_word: יִתְקְפוֹ הָאֶחָד
  choice: 有人制伏一个人
  rationale: תקף表示以强力胜过或制伏；动词主语未明说，因此用泛指的“有人”，并以“一个人”呈现单数受事及其与下文“两个人”的对比。
- source_word: הַשְּׁנַיִם
  choice: 两个人
  rationale: 保留原文“一”与“二”的鲜明对照，同时补出量词和名词，使现代汉语清楚自然。
- source_word: יַעַמְדוּ נֶגְדּוֹ
  choice: 能抵挡他
  rationale: 原义为“站在他对面／与他对立”；“抵挡”保留对抗之意，并符合这一格言的语境。
- source_word: הַחוּט הַמְשֻׁלָּשׁ
  choice: 三股合成的绳
  rationale: חוּט可指线或绳，强度比喻中译作“绳”更自然；מְשֻׁלָּשׁ表示做成三重，正文用“三股合成”清楚传达意象，同时在脚注保留较字面的译法。
- source_word: לֹא בִמְהֵרָה יִנָּתֵק
  choice: 不会很快被扯断
  rationale: “不会很快”直接保留בִמְהֵרָה的速度含义；“被扯断”反映נתק的尼法勒形式及绳索被拉断的具体意象。
