base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/004/017.yaml
  text: Guard your steps when you go to the house of God[a], and draw near to listen rather than to offer the sacrifice of fools[c][b], for they do not know that they are doing evil.
translation:
  language: zh_hans
  text: 你到上帝的殿去时，要谨慎脚步[a]；近前聆听[b]，胜过献上愚昧人的祭，因为他们不知道自己是在作恶[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“要看守你的脚”。
    reason: lexical_alternative
  - marker: b
    text: “聆听”也可译为“听”。
    reason: lexical_alternative
  - marker: c
    text: 希伯来文直译“因为他们不知道作恶”；意思可能是他们没有意识到自己的行为是恶。
    reason: source_ambiguity
lexical_decisions:
- source_word: שְׁמֹר רגליך
  choice: 要谨慎脚步
  rationale: 原文直译为“看守你的脚”，在此是告诫人谨慎自己的行止和敬拜态度。“谨慎脚步”既保留具体意象，也符合现代汉语表达。
- source_word: כַּאֲשֶׁר תֵּלֵךְ
  choice: 你……去时
  rationale: 按时间意义处理，表示人在前往敬拜场所时应当谨慎。
- source_word: בֵּית הָאֱלֹהִים
  choice: 上帝的殿
  rationale: 保留“上帝之家”的敬拜场所含义，同时以现代汉语常用的“殿”自然表达；不直接限定为某一具体圣殿。
- source_word: וְקָרוֹב לִשְׁמֹעַ
  choice: 近前聆听
  rationale: וְקָרוֹב 形式简练，可理解为劝勉性的“近前”；לִשְׁמֹעַ 在智慧文学语境中不仅是听见，也含专心领受之意，因此译作“聆听”。
- source_word: מִתֵּת הַכְּסִילִים זָבַח
  choice: 胜过献上愚昧人的祭
  rationale: מִן 表达比较，“胜过”清楚呈现对比；נתן 与“祭”连用时指献上。“愚昧人”是智慧文学中道德和属灵迟钝者，并非仅指智力不足。
- source_word: כִּי אֵינָם יוֹדְעִים לַעֲשׂוֹת רָע
  choice: 因为他们不知道自己是在作恶
  rationale: 希伯来文压缩地说“他们不知道作恶”。此译表达较可能的意思，即他们没有意识到自己的行为是恶，同时用脚注保留原文句法的歧义。
theological_decisions:
- issue: 聆听与献祭之间的关系
  choice: 经文强调近前聆听胜过愚昧人无知地献祭，并未断言一切献祭本身都应被否定。
  alternative: 将本句理解为全面否定献祭。
  rationale: 修饰献祭的是“愚昧人的”，末句又聚焦于他们不知道自己在作恶；因此批评的重点是无知而邪恶的敬拜行为。
- issue: “不知道作恶”的句法含义
  choice: 正文采用“没有意识到自己正在作恶”的理解。
  alternative: 理解为“他们不懂得如何作恶”或“他们只知道作恶”。
  rationale: 上下文最自然地说明愚昧人没有察觉其献祭行为的邪恶，但原文不定式结构简练，故在脚注中说明直译，以保留张力。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。“谨慎脚步”保留希伯来文的身体意象；“近前聆听，胜过……”形成清楚、简洁的智慧文学劝诫语气。所有脚注标记均已置于正文对应位置。
