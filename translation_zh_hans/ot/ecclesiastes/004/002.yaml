  text: וְ/שַׁבֵּ֧חַ אֲנִ֛י אֶת הַ/מֵּתִ֖ים שֶׁ/כְּבָ֣ר מֵ֑תוּ מִן הַ֣/חַיִּ֔ים אֲשֶׁ֛ר הֵ֥מָּה חַיִּ֖ים עֲדֶֽנָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/004/002.yaml
  text: And I considered the dead[a], who have already died, more fortunate than the living, who are still alive.
translation:
  language: zh_hans
  text: 我认为，那些已经死去的人，比仍然活着的人更有福。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我称许那些已经死去的人，胜过仍然活着的人。”希伯来语动词更直译为“赞美”或“称许”；这里表达的是传道者认为死者的处境更好。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׁבֵּחַ
  choice: 我认为……更有福
  rationale: שׁבח 的加强词干通常表示“赞美、称许”；在这里结合比较结构和上下文，表达传道者认定死者的处境优于仍受欺压的活人。译作“认为……更有福”既自然，也避免让人误解为对死者品德的赞扬。
- source_word: אֲנִי
  choice: 我
  rationale: 保留原文明确的第一人称代词，突出传道者本人的判断。
- source_word: אֶת הַמֵּתִים
  choice: 那些……死去的人
  rationale: 原文指死者这一类人；结合后面的关系从句译出，符合现代汉语表达。
- source_word: שֶׁכְּבָר מֵתוּ
  choice: 已经死去
  rationale: כבר 表示“已经”，מות 的完成式表示死亡已经发生，故保留其时间与完成意味。
- source_word: מִן הַחַיִּים
  choice: 比……活着的人更有福
  rationale: 介词 מן 在评价性动词之后表示比较；汉语需要用“比……更……”明确表达比较关系。
- source_word: אֲשֶׁר הֵמָּה חַיִּים עֲדֶנָה
  choice: 仍然活着的人
  rationale: עֲדֶנָה 表示“仍、尚且、直到如今”；“仍然活着”自然地保留了原文对持续生存状态的强调。
theological_decisions:
- issue: 死者与活人的处境比较
  choice: 把本节译为传道者在受欺压的现实中认定死者比活人更有福
  alternative: 把本节理解为对死后福乐状态的教义陈述，或仅视为没有实际比较意义的夸张话
  rationale: 紧邻上下文讨论日光之下的欺压。译文保留其尖锐的生存处境判断，却不把它扩展为关于死后状态的系统教义，也不消解其真实的比较意味。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“更有福”表达处境上的相对有利，并借脚注保留“赞美／称许”的较直译方案。
