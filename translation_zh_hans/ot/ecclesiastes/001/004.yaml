base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/001/004.yaml
  text: A generation goes[a], and a generation comes[b], but the earth stands forever.
translation:
  language: zh_hans
  text: 一代人离去，一代人到来，大地却永远[a]长存[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “永远”也可理解为“长久不断”或“世世代代”；这里强调大地与不断更替的人类世代相比显得恒久。
    reason: cultural_note
  - marker: b
    text: “长存”原文直译为“站立”，也可译作“存立”；这一具体意象表现大地持久而稳定。
    reason: lexical_alternative
lexical_decisions:
- source_word: דּוֹר
  choice: 一代人
  rationale: 这里指同一时期生活的一代人；重复“一代人”保留原文的平行结构，也比单说“一代”更清楚。
- source_word: הֹלֵךְ
  choice: 离去
  rationale: 该分词表达不断重复、具有普遍性的动作。“离去”保留“走”的基本意象，同时在现代汉语中自然地表示一代人的退场，不明确加上“死亡”等解释。
- source_word: בָּא
  choice: 到来
  rationale: 与“离去”构成简洁对照，保留原文一去一来的节奏。
- source_word: הָאָרֶץ
  choice: 大地
  rationale: 本段是普遍性的宇宙观察，并非指某一特定地域；“大地”既自然又符合诗性智慧文学的语域。
- source_word: לְעוֹלָם
  choice: 永远
  rationale: 这是表示长久延续的希伯来语惯用表达；“永远”保留原文强烈的修辞对比，而不在正文中限定其为绝对的形而上命题。
- source_word: עֹמָדֶת
  choice: 屹立
  rationale: עמד的具体意象是“站立”。“屹立”在汉语中能自然表达稳固长存，也比单纯的“长存”更好地保留原文意象。
theological_decisions:
- issue: לְעוֹלָם是否陈述大地在绝对、形而上意义上的永恒
  choice: 正文译作“永远”，保留智慧文学中的强烈修辞表达。
  alternative: 世世代代长存；长久存在
  rationale: 本节着重对照人类世代的更替与大地相对持久的稳定，并非在系统阐述宇宙最终命运。译文不削弱“永远”的力度，也不额外把它解释成绝对的宇宙论断。
translation_notes:
  register: 采用简洁、凝练而庄重的现代汉语，保留原文三句式对照和具体的“站立”意象。“离去／到来”比“走／来”更符合现代汉语描述世代更替的习惯，同时不把“离去”明确解释为死亡。
