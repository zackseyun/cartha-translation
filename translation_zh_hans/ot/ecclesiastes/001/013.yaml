  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/נָתַ֣תִּי אֶת לִבִּ֗/י לִ/דְר֤וֹשׁ וְ/לָ/תוּר֙ בַּֽ/חָכְמָ֔ה עַ֛ל כָּל אֲשֶׁ֥ר נַעֲשָׂ֖ה תַּ֣חַת הַ/שָּׁמָ֑יִם ה֣וּא עִנְיַ֣ן רָ֗ע נָתַ֧ן אֱלֹהִ֛ים לִ/בְנֵ֥י הָ/אָדָ֖ם לַ/עֲנ֥וֹת בּֽ/וֹ־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/001/013.yaml
  text: And I set my heart to seek and to explore by wisdom all that is done under heaven[b][a]. It is an unhappy task God has given to the sons of man to be occupied with.
translation:
  language: zh_hans
  text: 我专心用智慧考察、探究天下所做的一切。上帝把这苦恼的事务交给世人[a]，使他们为之劳苦[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “世人”原文直译为“人的众子”，在这里泛指全人类。
    reason: lexical_alternative
  - marker: b
    text: “为之劳苦”也可译作“忙于此事”或“因它受苦”；原文兼有从事某事和被其重压的意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי אֶת לִבִּי
  choice: 我专心
  rationale: 希伯来语直译为“我把我的心交出来”，指有意识地投入心思与意志；现代汉语用“专心”自然表达这一惯用含义。
- source_word: לִדְרוֹשׁ וְלָתוּר
  choice: 考察、探究
  rationale: 两个近义动词共同强化调查研究之意；分别译出，以保留原文的双重表达。
- source_word: בַּחָכְמָה
  choice: 用智慧
  rationale: 介词 בְּ 在此表示手段或方式，智慧是考察的工具与途径。
- source_word: עַל כָּל אֲשֶׁר נַעֲשָׂה
  choice: 天下所做的一切
  rationale: 保留原文被动、概括性的范围，同时使汉语顺畅。
- source_word: תַּחַת הַשָּׁמָיִם
  choice: 天下
  rationale: “天下”是自然、庄重的现代汉语表达，指天之下的人类领域，也便于在《传道书》中保持固定用语。
- source_word: עִנְיַן רָע
  choice: 苦恼的事务
  rationale: עִנְיַן 指使人从事或忙碌的事务，רָע 在此更侧重其痛苦、艰难的性质，而不必断定为道德上的邪恶。
- source_word: לִבְנֵי הָאָדָם
  choice: 世人
  rationale: 字面为“人的众子”，在此泛指全人类；“世人”既简洁自然，又保留其普遍所指。
- source_word: לַעֲנוֹת בּוֹ
  choice: 使他们为之劳苦
  rationale: 该形式可表示忙于、受苦于或劳碌其中；“为之劳苦”保留参与事务和承受重担两方面的含义。
theological_decisions:
- issue: רָע 是否应译成带有道德定性的“邪恶”
  choice: 译为“苦恼的”，描述这事务令人痛苦、艰难
  alternative: 邪恶的；不幸的；沉重的
  rationale: 上下文着眼于人在日光之下考察与劳碌所承受的重担。原文虽用 רָע，却不要求译文断言上帝所给的是道德上的邪恶。
- issue: לַעֲנוֹת בּוֹ 的主动投入与被动受苦之张力
  choice: 译为“使他们为之劳苦”
  alternative: 使他们忙于此事；使他们因它受苦
  rationale: “劳苦”兼顾从事、操劳和受重压的语义，不把原文的多义性单向化。
- issue: לִבְנֵי הָאָדָם 的性别形式与泛指意义
  choice: 正文译为“世人”，脚注说明字面形式
  alternative: 人的众子；人类
  rationale: 此处希伯来语阳性表达具有全人类的泛指作用；中文“世人”准确传达所指，脚注则保存原文形式。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“专心”避免生硬直译“把心交出来”；“考察、探究”保留两个希伯来动词；“苦恼的事务”和“为之劳苦”共同呈现本节沉重而不武断的语气。
