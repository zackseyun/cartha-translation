  rationale: 仅作安全的汉语表达修订：将“中的”改为“之”，使绝对最高级在现代而庄重的汉语中更清楚自然；并小幅润饰脚注的词汇说明。其余正文、名称音译、脚注锚点及末句的“不过”均应保留。
