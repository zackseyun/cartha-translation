  text: הֲבֵ֤ל הֲבָלִים֙ אָמַ֣ר קֹהֶ֔לֶת הֲבֵ֥ל הֲבָלִ֖ים הַ/כֹּ֥ל הָֽבֶל׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/001/002.yaml
  text: Breath of breaths[a], says Qoheleth[b]; breath of breaths, all is mere breath.
translation:
  language: zh_hans
  text: “气息之气息[a]！”科赫莱特[b]说，“气息之气息！一切不过是气息。”
  philosophy: optimal-equivalence
  footnotes: &id001
  - marker: a
    text: 希伯来语 הֶבֶל（hevel）本义是“气息”或“雾气（蒸汽）”。科赫莱特在本书中反复使用这个词；它可同时使人想到气息般的短暂、难以捉摸，以及所期待的与实际发生的并不相合。这里的“气息之气息”是希伯来语表达最高程度的结构，类似“歌中之歌”或“至圣之所”。传统译法“虚空”容易被理解为单纯的空无；“徒劳”或“毫无意义”则会把原词的多重含义缩窄。
    reason: lexical_choice
lexical_decisions:
- source_word: הֶבֶל / הֲבֵל
  choice: 气息
  rationale: 该词本义为气息、蒸气；在本书中反复用作核心意象，同时可让人联想到短暂、难以把握，以及期望与现实之间的落差。“气息”保留具体意象和多重含义，避免用“虚空”“徒劳”或“毫无意义”过早限定解释。
- source_word: הֲבֵל הֲבָלִים
  choice: 气息中的气息
  rationale: 原文是“X中的X”式最高级结构，类似“歌中之歌”“至圣之所”。此译保留原文结构与气息的具体意象；重复出现时加感叹号，使汉语中的强烈断语自然可感。
- source_word: אָמַר
  choice: 说
  rationale: 虽为完成式，文学题署中的言说公式可自然译作现在性的“说”，使宣告保持鲜明。
- source_word: קֹהֶלֶת
  choice: 科赫莱特
  rationale: 音译这一含义未完全确定的希伯来称号或名称，避免以“传道者”“教师”或“召集者”提前缩窄其语义。
- source_word: הַכֹּל
  choice: 一切
  rationale: 简洁自然地保留原文包举万有的总体性。
- source_word: הָבֶל
  choice: 不过是气息
  rationale: 谓语位置加入“不过”，传达原文在语境中的贬抑和消解语气，同时不把 הֶבֶל 抽象化为“徒劳”或“毫无意义”。
theological_decisions:
- issue: 如何翻译本书核心意象 הֶבֶל
  choice: 保留具体意象，译作“气息”；在末句译作“不过是气息”
  alternative: 虚空、徒劳、毫无意义、荒谬、转瞬即逝
  rationale: 原词可同时承载短暂、不可捉摸和反讽性的落差。抽象译词往往只保留其中一面；尤其“毫无意义”容易把经文处理成原文并未明确断言的虚无主义命题。具体意象让本书后文逐步展开其意义。
- issue: קֹהֶלֶת 是名称还是职衔
  choice: 音译为“科赫莱特”
  alternative: 传道者、教师、召集者
  rationale: 其词形与 קהל（聚集、会众）相关，但确切功能和称谓性质仍有开放性。音译可保存这种不确定性，不把某一种解释写入正文。
translation_notes:
  register: 采用现代、庄重而可朗读的普通话。以引号和感叹号呈现诗性宣告的力度；“气息中的气息”有意保留希伯来语最高级结构及陌生化的具体意象，末句用“不过”补足汉语所需的贬抑语气。
