  - severity: low
    issue: 脚注的“蒸气”用词和释义可微调。
    rationale: 现代简体规范通常写作“蒸汽”；但 הֶבֶל 的具象范围也包括雾气、轻烟般的消散感，脚注以“雾气（或蒸汽）”说明更贴切。
