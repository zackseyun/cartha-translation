base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/001/008.yaml
  text: All things are wearisome; a man cannot speak of it. The eye is not satisfied with seeing, nor is the ear filled with hearing.
translation:
  language: zh_hans
  text: 万事都令人疲乏[a]，人无法说尽[b]；眼睛看不饱，耳朵听不满。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“所有话语都令人疲乏”。希伯来语“דְּבָרִים”可指“话语”“事情”或“事物”。
    reason: lexical_alternative
  - marker: b
    text: 直译：“人不能说”。这句话可能指人无法把这一切充分说尽，也可能指这些事令人疲乏，难以言说。
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הַדְּבָרִים
  choice: 万事
  rationale: דְּבָרִים 可指“话语、事情、事物”；结合上下文对世间循环和经验的概括，“万事”自然简洁，同时保留广泛所指。脚注说明“万语”的可能。
- source_word: יְגֵעִים
  choice: 都令人疲乏
  rationale: 该形容词表达疲惫、劳顿或使人厌倦；译作“令人疲乏”能自然表达万事给人带来的耗竭感，同时不把它弱化为单纯的“繁忙”。
- source_word: לֹא יוּכַל אִישׁ לְדַבֵּר
  choice: 人无法尽述
  rationale: 直义为“人不能说”；上下文可能指人无法把这一切充分说尽，也可能强调题材疲乏得难以言说。“无法尽述”在中文中衔接自然，脚注保留较直译的可能。
- source_word: לֹא תִשְׂבַּע עַיִן לִרְאוֹת
  choice: 眼看不饱
  rationale: שׂבע 表示吃饱、满足；“眼看不饱”保留饱足意象和泛指单数，又符合现代汉语表达。
- source_word: וְלֹא תִמָּלֵא אֹזֶן מִשְּׁמֹעַ
  choice: 耳听不足
  rationale: מלא 的基本意思是“充满”。“耳听不足”以简练对句表达耳朵不会因听见而达到满溢或满足，并与“眼看不饱”形成自然平行。
