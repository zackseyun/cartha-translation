base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/001/010.yaml
  text: Is there a thing of which one says[a], “See, this is new”? It has already been in the ages before us.
translation:
  language: zh_hans
  text: 有什么事，人会说：“看，这是新的”？它在我们以前的世代早已有了。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יֵשׁ דָּבָר
  choice: 有没有一件事
  rationale: 结合上下文译作反问句，保留存在句的开放性，也自然衔接上一节关于“没有新事”的论述。
- source_word: שֶׁיֹּאמַר
  choice: 人会说
  rationale: 未明确主语，表达泛指、非特定的人；现代汉语用“人会说”简洁自然。
- source_word: רְאֵה זֶה חָדָשׁ הוּא
  choice: 看，这是新的
  rationale: 保留命令式的引人注意语气和指示词；“看”比“看哪”更符合现代标准普通话，同时不削弱原文的直接感。
- source_word: כְּבָר הָיָה
  choice: 其实它早已存在
  rationale: כְּבָר 强调先前已经如此；加入“其实”显明对所谓新事的反驳，而“早已存在”准确表达 הָיָה 的存在义。
- source_word: לְעֹלָמִים אֲשֶׁר הָיָה מִלְּפָנֵינוּ
  choice: 在我们以前的世代就有了
  rationale: 这里的 עֹלָמִים 指过去的久远世代，而非无穷的永恒；译文保留复数世代和“在我们以前”的时间关系。
theological_decisions: []
