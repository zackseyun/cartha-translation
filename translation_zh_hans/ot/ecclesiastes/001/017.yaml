base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/001/017.yaml
  text: And I set my heart to know wisdom[a], and to know madness and folly; I came to know that this too is a chasing after wind.
translation:
  language: zh_hans
  text: 我专心去认识智慧，也去认识疯狂和愚昧；我认识到，这也是追逐风[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“捕风”；传统译作“心灵的烦恼”。
    reason: “追逐风”保留此处希伯来语短语所表达的徒劳追求之比喻；“捕风”是相近的译法，“心灵的烦恼”则反映传统译法。
lexical_decisions:
- source_word: וָאֶתְּנָה לִבִּי
  choice: 我专心
  rationale: 这是希伯来语惯用表达，指把内心、注意力和意志投入某事。“专心”在现代汉语中自然，也保留了有意识投入探究的含义。
- source_word: לָדַעַת
  choice: 要认识
  rationale: ידע在此指通过考察和体验而获得认识；译作“认识”既贴近原词，也能与后面的יָדַעְתִּי形成呼应。
- source_word: חָכְמָה
  choice: 智慧
  rationale: 这是传道书中表示思想洞见和实际明智的标准智慧文学用语。
- source_word: וְדַעַת
  choice: 也要认识
  rationale: 按上下文与前面的לָדַעַת并列理解，以动词形式重现，可清楚表达两方面的考察，并保留原文的平行结构。
- source_word: הוֹלֵלוֹת
  choice: 疯狂
  rationale: 该词侧重失常、狂乱或不理性的状态，与后面的“愚昧”有所区别。
- source_word: שִׂכְלוּת
  choice: 愚昧
  rationale: 这是智慧文学中与智慧相对的常用概念；“愚昧”简洁、庄重，并保留其道德与认知层面的分量。
- source_word: יָדַעְתִּי
  choice: 我认识到
  rationale: 完成式在此陈述考察所得的结论；“认识到”自然地表达经探究而得知的结果。
- source_word: שֶׁגַּם זֶה הוּא
  choice: 这也是
  rationale: 准确体现גַּם的附加意味，并以自然汉语引出结论。
- source_word: רַעְיוֹן רוּחַ
  choice: 追逐风
  rationale: 该短语描绘徒劳地追求无法捉住之物。“追逐风”保留原文意象，在现代汉语中也清楚自然；原词所含“追求、劳碌、挣扎”的细微差别以脚注保留。
theological_decisions:
- issue: 对智慧、疯狂和愚昧的“认识”是否暗示赞同或亲身践行
  choice: 保持中性的“认识”，不补入“赞同”“实践”或纯理论研究等解释
  alternative: 译作“体验”或“研究”，从而更明确限定认识的方式
  rationale: ידע本身可涵盖考察与经验性认识，但本节未明确说明具体方式；保持较宽的措辞可避免替原文消除张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“我专心要认识……也要认识……”保留原文重复和探究语气；“疯狂”和“愚昧”刻意区分两个相邻概念。脚注标记置于其实际所注释的“追逐风”之后。
