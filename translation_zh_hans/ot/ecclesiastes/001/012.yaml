base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/001/012.yaml
  text: I[a], Qoheleth, was king over Israel in Jerusalem.
translation:
  language: zh_hans
  text: 我，科赫莱特[a]，曾在耶路撒冷作以色列的王。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “科赫莱特”也可译作“教师”“传道者”或“召集者”。
    reason: 词义存在多种合理理解；脚注列出主要译法，同时正文以音译保留原文的歧义。
lexical_decisions:
- source_word: אֲנִי
  choice: 我
  rationale: 保留句首独立人称代词所带的强调，突出说话者的自我陈述。
- source_word: קֹהֶלֶת
  choice: 科赫莱特
  rationale: 采用接近希伯来语的音译，因为该词在本书中具有称号或名号般的功能，而其确切含义仍有争议；音译可避免把它过早限定为“教师”“传道者”或“召集者”。
- source_word: הָיִיתִי
  choice: 曾……作
  rationale: 希伯来语完成式在此回顾说话者先前的身份；“曾……作”既表达过去状态，也符合现代汉语叙述习惯。
- source_word: מֶלֶךְ
  choice: 王
  rationale: 准确表达君王职分；与“作”搭配，形成自然的汉语表语结构。
- source_word: עַל
  choice: 以色列的王
  rationale: 原介词表示对以色列的统治权。汉语用“以色列的王”自然表达这一关系，虽未逐字译作“治理”，但保留了君王辖治以色列之意。
- source_word: יִשְׂרָאֵל
  choice: 以色列
  rationale: 采用该专名在现代中文圣经及通用语境中的标准译法。
- source_word: בִּירוּשָׁלָם
  choice: 在耶路撒冷
  rationale: 介词 בְּ 在此表示地点；“在耶路撒冷”是准确、自然的现代汉语表达。
theological_decisions:
- issue: קֹהֶלֶת 应译为具体称号，还是保留音译名称
  choice: 科赫莱特
  alternative: 教师；传道者；召集者
  rationale: 该词的词源意义和在本书中的称号功能并不能确定支持某一个单一译法。保留音译可维持原文的语义开放性，避免引入特定传统对说话者身份或职能的解释。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“我，科赫莱特”保留原文强调性的自我介绍；“曾在耶路撒冷作以色列的王”简洁自然，并维持回顾性的叙述语气。
