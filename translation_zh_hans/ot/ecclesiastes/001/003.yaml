base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/001/003.yaml
  text: What profit does man have in all his labor at which he toils under the sun?[a]
translation:
  language: zh_hans
  text: 人从他在日光之下所劳碌的一切劳碌中，能得什么益处呢？
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַה
  choice: 什么
  rationale: 以简洁的疑问词引出反问，保留希伯来文凝练直接的语气。
- source_word: יִתְרוֹן
  choice: 益处
  rationale: 该词是《传道书》的关键词，指劳碌之后所得的净收益或存留的好处；“益处”既保留收益意味，又符合现代汉语表达。
- source_word: לָאָדָם
  choice: 人……能得
  rationale: אָדָם在此为单数形式，但具有代表全人类的泛指作用；汉语“人”自然兼具单数代表性和普遍含义。
- source_word: בְּכָל עֲמָלוֹ
  choice: 从他……一切劳碌中
  rationale: 结合יִתְרוֹן的收益语义，将介词表达为收益所从出的范围；“一切”保留כָל的整体性。
- source_word: שֶׁיַּעֲמֹל
  choice: 所劳碌的
  rationale: 保留关系结构，并以“劳碌—劳碌”重现原文同词根的名词与动词呼应，虽略有重复，却是原文有意的修辞。
- source_word: תַּחַת הַשָּׁמֶשׁ
  choice: 在日光之下
  rationale: 这是《传道书》中具有纲领意义的固定表达，指人在可观察的现世范围内的生活；采用庄重而通行的“日光之下”。
theological_decisions:
- issue: אָדָם在关于全人类的泛指陈述中的译法
  choice: 人
  alternative: 世人；一个人
  rationale: 原文为单数且具代表性。现代汉语“人”无需标明性别，既能保留单数代表式表达，也不会被自然理解为仅指男性。
- issue: יִתְרוֹן所问的是一般好处还是劳碌后存留的净收益
  choice: 益处
  alternative: 利润；收获；优势
  rationale: “益处”维持原文经济性隐喻与更宽泛的人生追问之间的张力，不把问题缩窄为金钱利润，也不预先断定答案。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。保留“劳碌”名词与动词的重复，以反映希伯来文עָמָל／עָמַל的修辞呼应；“日光之下”作为全书反复出现的关键词组保持固定译法。
