base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/001/018.yaml
  text: For with much wisdom comes much vexation[b][a], and he who increases knowledge increases pain.
translation:
  language: zh_hans
  text: 因为智慧越多，烦恼也越多；增加知识的人，也增加痛苦。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “烦恼”或译“愁烦”“忧愁”；“痛苦”也可译“伤痛”，可涵盖身心的痛楚。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，说明传道者何以认为追求智慧也是捕风，保留原文的解释性连接。
- source_word: בְּרֹב חָכְמָה רָב כָּעַס
  choice: 智慧越多，烦恼也越多
  rationale: 以现代汉语自然的递增关联表达原文“多有智慧，就多有כָּעַס”的平行关系；“烦恼”兼顾忧愁、困扰和恼怒等语义。
- source_word: חָכְמָה
  choice: 智慧
  rationale: 这是《传道书》中该词的常规译法，并与后半句的“知识”保持词汇区别。
- source_word: כָּעַס
  choice: 烦恼
  rationale: 该词在此不只指外显的愤怒，也可指忧愁、苦恼或困扰；“烦恼”在现代汉语中较自然，并保留其宽泛的情绪内涵。
- source_word: וְיוֹסִיף דַּעַת
  choice: 增加知识的
  rationale: 保留原文分词式、格言式的泛指表达，也与后面重复的“增加”形成对应。
- source_word: דַּעַת
  choice: 知识
  rationale: 采用标准译义，并与חָכְמָה“智慧”保持原文中的词汇区分。
- source_word: יוֹסִיף מַכְאוֹב
  choice: 也增加痛苦
  rationale: 重复“增加”以再现原文两次יוֹסִיף的修辞平行；“痛苦”可涵盖身体和内心的疼痛。
theological_decisions:
- issue: 智慧和知识与痛苦之间的关系
  choice: 保留格言式的关联陈述，不补成对智慧或知识本身的绝对否定
  alternative: 解释为智慧必然导致痛苦，或解释为只有某类世俗知识才导致痛苦
  rationale: 原文简洁地陈述增多智慧、知识与增多烦恼、痛苦的对应关系，并未在本节限定智慧的类别，也未展开一套绝对因果理论；译文不应替作者消解这一张力。
translation_notes:
  register: 采用简洁、对称的现代标准汉语，保留希伯来文格言般的节奏和“增加……增加……”的重复。措辞庄重但不古奥；脚注标记置于正文句末。
