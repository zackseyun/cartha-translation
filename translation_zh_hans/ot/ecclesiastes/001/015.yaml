base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/001/015.yaml
  text: What is crooked cannot be made straight[b][a], and what is lacking cannot be counted.
translation:
  language: zh_hans
  text: 弯曲的不能变直；所缺少的无法数算。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מְעֻוָּת
  choice: 弯曲的
  rationale: 该词是עוה的被动分词，指已经弯曲、扭曲之物。译作“弯曲的”保留格言式的抽象表达，也与下文“变直”形成鲜明对应。
- source_word: לֹא יוּכַל לִתְקֹן
  choice: 不能使它变直
  rationale: יוּכַל表达能力上的不能；תקן在此有使之笔直、整正之意。“不能使它变直”保留原文由弯到直的形象及主动不定式的表达，不扩展为较抽象的“纠正”。
- source_word: וְחֶסְרוֹן
  choice: 缺少的
  rationale: חֶסְרוֹן表示欠缺、缺失。译作“缺少的”与前句“弯曲的”构成平行，也避免把它限定为某一种具体缺陷。
- source_word: לְהִמָּנוֹת
  choice: 把它数上
  rationale: 这是מנה的尼法勒不定式，意为被数算、被列入数目。“数上”在现代汉语中自然表达因不存在或欠缺而无法计入数目的含义，同时保留原文“数算”的意象。
theological_decisions:
- issue: 本节所说的不能，是普遍命题还是传道者对日光之下处境的观察
  choice: 保持格言式绝对措辞，不在正文中补入范围限定
  alternative: 译作“在人力之下，弯曲的不能变直”等，明确限定人的能力
  rationale: 希伯来文本本身没有明说施事者，也没有在本节重复“日光之下”的范围语。正文应保留这种张力，不把它预先解释为神学上的绝对不能或仅指人的不能。
translation_notes:
  register: 采用简洁、对称的格言体，语言现代而庄重。“弯曲的／缺少的”保留原文两个名词性表达的平行结构；分号体现两分句的紧密对应。
