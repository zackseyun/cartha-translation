base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/001/007.yaml
  text: All the streams flow into the sea[a], yet the sea is not full; to the place where the streams flow[b], there they return to flow again.
translation:
  language: zh_hans
  text: 所有溪流都流入海中[a]，海却没有满；溪流流往的地方[b]，它们还回到那里，再流下去。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “溪流”所译的希伯来语也可指河流、季节性水道或河床。
    reason: lexical_alternative
  - marker: b
    text: 直译：“溪流所流往的地方，它们在那里返回去流。”这种刻意重复的措辞可能唤起水不断循环的图景，但没有明确说明循环的机制。
    reason: lexical_alternative
lexical_decisions:
- source_word: נְחָלִים
  choice: 河流
  rationale: 该词可指溪流、河川、季节性水道或河床。此处“河流”自然易懂，适合整体水流意象，同时以脚注保留其较宽的语义范围。
- source_word: הֹלְכִים
  choice: 流入／流往
  rationale: הלך本义为“去、行走”，但主语是河流，现代汉语以“流入、流往”表达最自然，也不改变原文所描写的运动。
- source_word: יָם
  choice: 海
  rationale: 这是该词的通常含义；译作“海洋”会比原文更具体。
- source_word: אֵינֶנּוּ מָלֵא
  choice: 海却没有满
  rationale: 直陈海并未满溢的状态，不额外加入“永远”等原文未明说的时间限定。
- source_word: מְקוֹם
  choice: 地方
  rationale: 保留原文宽泛的“地方”，不将其解释性地改译为“源头”，以免把水循环的具体机制写入正文。
- source_word: שָׁם
  choice: 那里
  rationale: 保留原文重复指示地点的表达，使循环往复的意味仍然可见。
- source_word: שָׁבִים
  choice: 又回到
  rationale: שוב通常表示“返回”。“又”自然传达此处反复、循环的语境。
- source_word: לָלָכֶת
  choice: 继续流淌
  rationale: 字面为“去”，但以河流为主语时译作“流淌”更符合汉语；“继续”传达“返回而再去”的迭代意味。
theological_decisions:
- issue: 水流返回的具体机制
  choice: 正文保留“回到那里，继续流淌”的诗性陈述，不解释其机制
  alternative: 明确译成蒸发、降雨后返回源头，构成现代水循环
  rationale: 原文描绘水流周而复始，却没有明确说明其自然机制；保留这种含蓄可避免把后来的科学解释或特定诠释写入经文。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“流入海中”符合自然汉语；后半句保留原文略显奇特的地点重复与循环张力，并借脚注交代其近乎直译的结构。
