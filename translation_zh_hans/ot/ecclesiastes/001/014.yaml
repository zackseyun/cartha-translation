  text: רָאִ֨יתִי֙ אֶת כָּל הַֽ/מַּעֲשִׂ֔ים שֶֽׁ/נַּעֲשׂ֖וּ תַּ֣חַת הַ/שָּׁ֑מֶשׁ וְ/הִנֵּ֥ה הַ/כֹּ֛ל הֶ֖בֶל וּ/רְע֥וּת רֽוּחַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/001/014.yaml
  text: I have seen all the works that are done under the sun[a], and behold[b], all is vanity and a striving after wind.
translation:
  language: zh_hans
  text: 我看过日光之下所做的一切事；看哪，这一切都是虚空[a]，都是捕风[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “虚空”也可译作“气息”“雾气”或“徒然”。希伯来词 הֶבֶל 在《传道书》中所表达的，不只是“毫无意义”，也包括短暂、虚浮、难以把握和令人受挫等意味。
    reason: lexical_alternative
  - marker: b
    text: “捕风”也可译作“追逐风”。希伯来语 רְעוּת רוּחַ 很可能指徒劳的追求；若按字面理解，也可能是“牧放风”。
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאִיתִי
  choice: 我看过
  rationale: Qal完成式第一人称单数；“我看过”自然表达传道者回顾观察所得，并保留其对当前结论的关联。
- source_word: כָּל הַמַּעֲשִׂים שֶׁנַּעֲשׂוּ
  choice: 所做的一切事
  rationale: 概括日光之下全部作为与活动；中文以“事”保持范围宽广，避免限于道德意义的“行为”。
- source_word: תַּחַת הַשָּׁמֶשׁ
  choice: 日光之下
  rationale: 保留《传道书》中反复出现的核心空间性表达，指人世生活的领域。
- source_word: וְהִנֵּה
  choice: 看哪
  rationale: 保留引人注意并强调观察结论的篇章功能，同时符合庄重的经文语体。
- source_word: הַכֹּל
  choice: 这一切
  rationale: 明确回指前述“所做的一切事”，中文表达自然。
- source_word: הֶבֶל
  choice: 虚空
  rationale: 保留《传道书》的传统关键词及其意象张力；该词不只表示“毫无意义”，还涵盖短暂、如气息般难以把握和令人受挫等意味，故以脚注说明。
- source_word: רְעוּת רוּחַ
  choice: 捕风
  rationale: 以简洁而鲜明的中文表达追逐风却无法得着的徒劳；原文也可能较直译为“牧放风”，故保留脚注。
theological_decisions:
- issue: הֶבֶל是否应直接解释为“毫无意义”
  choice: 虚空
  alternative: 徒然／毫无意义
  rationale: 不把该词丰富而有意含混的意象压缩成单一哲学判断，保留短暂、难以把握与令人受挫的张力。
- issue: רְעוּת רוּחַ的罕见搭配
  choice: 捕风
  alternative: 追逐风／牧放风
  rationale: “捕风”传达徒劳追求的主要意象，同时脚注交代更字面的可能性，不将词源争议绝对化。
translation_notes:
  register: 采用现代、庄重而通顺的普通话。“日光之下”“看哪”“虚空”“捕风”保留本节鲜明的文学意象和《传道书》的关键词，同时借脚注说明原文的语义范围与真实歧义。
