  yaml_path: translation/ot/ecclesiastes/001/001.yaml
  text: The words of Qoheleth[a], son of David, king in Jerusalem.
translation:
  language: zh_hans
  text: 大卫的儿子、在耶路撒冷作王的科赫莱特[a]的话。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “科赫莱特”是这位发言者的希伯来称谓，可能意为“教师”“传道者”，或指召集会众、在会众中发言的人。
    reason: 词义存在多种合理解释，正文用音译保留原文的含混。
lexical_decisions:
- source_word: דִּבְרֵי
  choice: ……的话
  rationale: 这是דָּבָר的复数附属形式，在这里引出全书的内容。“话”既贴近原文，又比“言论”或“语录”更自然。
- source_word: קֹהֶלֶת
  choice: 科赫莱特
  rationale: 该词是本书发言者独特的希伯来称号或称谓，其确切含义有争议。正文采用音译，以免预先断定为“教师”“传道者”或“召集会众的人”；主要释义列于脚注。
- source_word: בֶּן דָּוִד
  choice: 大卫的儿子
  rationale: 直接保留原文的亲子表达及其王室意味，不扩展解释“儿子”是否可指后裔。
- source_word: מֶלֶךְ
  choice: 作王
  rationale: מֶלֶךְ意为“王”。结合地点短语，在现代汉语中译为“在耶路撒冷作王”自然清楚，同时不改变其王者身份。
- source_word: בִּירוּשָׁלִָם
  choice: 在耶路撒冷
  rationale: 介词ב在此表示地点；“在耶路撒冷”是现代汉语中直接自然的表达。
theological_decisions:
- issue: קֹהֶלֶת应译成功能性称号，还是保留为音译称谓
  choice: 正文音译为“科赫莱特”
  alternative: “教师”“传道者”或“召集会众的人”
  rationale: 原词的词义、功能和文学身份均存在真实的解释空间。音译可以保留这种含混，避免正文过早选定某一种神学或职分理解；脚注则向读者说明主要可能含义。
- issue: בֶּן דָּוִד是否应解释为更宽泛的王室后裔
  choice: 译为“大卫的儿子”
  alternative: “大卫的后裔”
  rationale: 原文使用通常表示“儿子”的בֶּן。直译保留其表面所指以及可能产生的身份张力，不在正文中替作者解决历史或文学身份问题。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。以“大卫的儿子、在耶路撒冷作王的……”保留原文连续的同位说明；音译“科赫莱特”虽略带陌生感，但配合脚注可保留关键的词义张力。
