  text: הוֹלֵךְ֙ אֶל דָּר֔וֹם וְ/סוֹבֵ֖ב אֶל צָפ֑וֹן סוֹבֵ֤ב סֹבֵב֙ הוֹלֵ֣ךְ הָ/ר֔וּחַ וְ/עַל סְבִיבֹתָ֖י/ו שָׁ֥ב הָ/רֽוּחַ־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/001/006.yaml
  text: Going toward the south and turning toward the north[a], turning and turning goes the wind[b]; and on its circuits the wind returns.
translation:
  language: zh_hans
  text: 风[a]往南去，又转向北；风转了又转，沿着自己的循环路线[b]返回。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语רוּחַ也可译为“灵”或“气息”；本节描写自然界的循环，因此译作“风”。
    reason: lexical_alternative
  - marker: b
    text: “循环路线”也可译为“环行路线”或“转动的路线”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹלֵךְ
  choice: 去／运行
  rationale: 该词是הלך的主动分词，表示持续进行的运动。前半句译作“去”，保留方向性；后半句译作“运行”，使现代汉语自然，同时表达风不断运动。
- source_word: דָּרוֹם
  choice: 南
  rationale: 该名词表示南方或向南的方向；与介词אֶל连用，直译为“往南”，不增添原文没有的“南风”。
- source_word: וְסוֹבֵב / סוֹבֵב סֹבֵב
  choice: 又转向／转了又转
  rationale: סבב表示转动、环绕。译文保留连续重复的形式，以再现风不断回旋的节奏和意象。
- source_word: צָפוֹן
  choice: 北
  rationale: 表示北方或向北的方向；与אֶל连用，译为“转向北”。
- source_word: הָרוּחַ
  choice: 风
  rationale: רוּחַ也可指灵或气息，但上下文依次描写太阳、风和河流等自然循环，因此此处以“风”最贴切。
- source_word: וְעַל
  choice: 又沿着
  rationale: 介词עַל在此描述风循其路线运动；“沿着”比机械直译为“在……上”更符合现代汉语，同时保留路径含义。
- source_word: סְבִיבֹתָיו
  choice: 自己的循环路线
  rationale: 该词与סבב同属转动、环绕的语义范围，复数形式指反复环行的路径。“循环路线”传达周期运动，并与前面的“转了又转”呼应。
- source_word: שָׁב
  choice: 返回
  rationale: שוב表示返回、回转；“返回”简洁地呈现本节的循环主题。
theological_decisions:
- issue: 本节רוּחַ的含义
  choice: 气象意义的“风”
  alternative: “灵”或“气息”
  rationale: 虽然רוּחַ在别处可有神学含义，但传道书1:5–7列举可观察的自然循环；此处译作“风”最符合直接语境，同时不引入上下文没有提示的神学解释。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。保留“转了又转”的重复，以呈现希伯来文的节奏和持续回旋之感；用“去／运行”而不用“吹”，避免添加原文动词本身未明说的气象动作。
