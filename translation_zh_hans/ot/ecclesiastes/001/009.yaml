  text: מַה שֶּֽׁ/הָיָה֙ ה֣וּא שֶׁ/יִּהְיֶ֔ה וּ/מַה שֶׁ/נַּֽעֲשָׂ֔ה ה֖וּא שֶׁ/יֵּעָשֶׂ֑ה וְ/אֵ֥ין כָּל חָדָ֖שׁ תַּ֥חַת הַ/שָּֽׁמֶשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/001/009.yaml
  text: What has been is what will be[a], and what has been done is what will be done; and there is nothing new under the sun.
translation:
  language: zh_hans
  text: 已有的事，将来还会有；已经做过的事，将来还会被做〔a〕；日光之下并没有新事。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַה שֶּׁהָיָה
  choice: 已有的事
  rationale: 该关系结构指“已经存在或发生过的事”。“已有的事”在现代汉语中简洁自然，也保留了概括性的格言语气。
- source_word: הוּא שֶׁיִּהְיֶה
  choice: 将来还会有
  rationale: 代词加关系从句构成等同判断。汉语用“将来还会有”表达过去已有之事仍会再现，并以“还”体现循环和重复的语意。
- source_word: וּמַה שֶׁנַּעֲשָׂה
  choice: 已经做过的事
  rationale: עשה的尼法勒式在此具有被动或结果意味；“已经做过的事”既自然，又与前句形成工整平行。
- source_word: הוּא שֶׁיֵּעָשֶׂה
  choice: 将来还会有人做
  rationale: 原文是尼法勒未完成式，直译可作“还会被做”。现代汉语通常以泛指施事“有人做”表达这种不点明施事的被动意义，避免生硬，同时不把它泛化为“还会发生”。
- source_word: וְאֵין כָּל חָדָשׁ
  choice: 并没有什么新事
  rationale: אֵין加כָּל表达全面否定。“没有什么新事”符合现代汉语习惯，并保留原文修辞上的普遍语气。
- source_word: תַּחַת הַשָּׁמֶשׁ
  choice: 日光之下
  rationale: 这是《传道书》的关键词组，指人所观察到的尘世生活领域。“日光之下”庄重、清楚，也能在全书中稳定复现。
theological_decisions:
- issue: “日光之下”这一断言的范围
  choice: 按经文原样保留强烈的普遍陈述，同时让“日光之下”界定其观察范围。
  alternative: 将其译成对一切层面绝对没有任何新事物的形而上断言。
  rationale: “日光之下”将话语置于可观察的尘世人生之中。译文不削弱“没有什么新事”的修辞力度，也不额外扩展为对所有存在领域的绝对判断。
translation_notes:
  register: 采用现代、庄重而易懂的格言体。前两分句保持平行，以“已有／已经做过”和“将来还会”突出重复循环；末句稍具经典色彩，以维持《传道书》关键词组“日光之下”的辨识度。
