base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/001/005.yaml
  text: And the sun rises[a], and the sun goes down, and hastening to its place, it rises there again.
translation:
  language: zh_hans
  text: 太阳升起，太阳落下；它急切地赶往自己的地方，在那里升起。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “急切地赶往”也可译作“喘息着奔向”。希伯来语分词 שׁוֹאֵף 可表示“喘息”，也可按语境理解为“急切赶赴”。后半句也可按其紧凑的语序理解为：“它赶往自己的地方；它在那里升起。”
    reason: 保留 שׁוֹאֵף 的词义幅度，并说明后半句紧凑语序所容许的理解，同时避免将“那里”译成“从那里”。
lexical_decisions:
- source_word: וְזָרַח
  choice: 太阳升起
  rationale: זרח用于太阳时表示发光升起；完成式在本节的普遍观察中宜译作陈述反复规律的现在时。
- source_word: וּבָא
  choice: 太阳落下
  rationale: בוא本义为“进入、来到”，以太阳为主语时惯指落下；中文“落下”自然，并保留运动意象。
- source_word: מְקוֹמוֹ
  choice: 原处
  rationale: 字面是“它的地方”。结合太阳循环往复的语境，“原处”简洁表达其返回之地，又不把它具体解释成“升起之处”。
- source_word: שׁוֹאֵף
  choice: 喘息着奔向
  rationale: 该分词可描写喘息，也可引申为急切赶赴；此译兼顾鲜明的拟人意象和现代汉语的可理解性。
- source_word: זוֹרֵחַ
  choice: 升起
  rationale: 该分词与开头的זרח相呼应，表示太阳在那里持续或再次升起。
- source_word: הוּא שָׁם
  choice: 从那里再次
  rationale: הוּא具有复指或强调作用，שָׁם意为“那里”。“从那里再次”顺应中文表达，凸显上下文中的循环；“再次”是语境所含，并非独立词项。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语；以短句和重复保留希伯来诗句的循环节奏，并用“喘息着奔向”保留太阳拟人化的力度。
