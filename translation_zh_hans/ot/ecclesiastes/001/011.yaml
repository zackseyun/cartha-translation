base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/001/011.yaml
  text: There is no remembrance of the former ones[a], and even of the later ones who will be, there will be no remembrance among those who will come afterward.
translation:
  language: zh_hans
  text: 从前的人无人记念[a]；连将来的人，也不会被后来的人记念。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“先前的事无人记念；将来的事也不会被后来的人记念。”
    reason: “先前的”和“后来的”在希伯来语中是名词化的复数形容词，可指人，也可能泛指先前和后来的事。正文按语境译作人；脚注保留另一种可能。
lexical_decisions:
- source_word: אֵין
  choice: 无人
  rationale: 与“记念”搭配，简洁自然地表达希伯来语的存在否定，即没有人记得。
- source_word: זִכְרוֹן / זִכָּרוֹן
  choice: 记念
  rationale: 兼具“记得、追念”和留下名声的意味，也保留全句反复出现的关键词。
- source_word: לָרִאשֹׁנִים
  choice: 先前的人
  rationale: 保留复数形容词名词化的宽泛所指，可指前人或较早的世代，不限定为事物。
- source_word: וְגַם
  choice: 也
  rationale: 承接并推进平行句；现代汉语中“也”已能自然体现连带强调。
- source_word: לָאַחֲרֹנִים
  choice: 后来……的人
  rationale: 与“先前的人”构成时间对照，同时不把所指过度具体化。
- source_word: שֶׁיִּהְיוּ
  choice: 将有
  rationale: 保留存在动词的将来意义；“后来将有的人”在语境中指将来出现的人。
- source_word: לֹא יִהְיֶה לָהֶם זִכָּרוֹן
  choice: 也不会被……记念
  rationale: 用汉语被动式自然表达“不会有关于他们的记念”，并明确代词所指为后来的人。
- source_word: עִם
  choice: 被……的人
  rationale: 原词表示与后续群体的关联；依汉语习惯转换为施事关系，说明记念是在后来的群体中发生。
- source_word: שֶׁיִּהְיוּ לָאַחֲרֹנָה
  choice: 更后来的人
  rationale: 清楚呈现其相对于前述“后来的人”还要更晚，同时保留简练的时间层次。
