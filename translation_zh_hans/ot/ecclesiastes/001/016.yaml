  to: 我心里说：“看哪，我已经变得伟大，智慧也大有增进，超过所有在我以前统管耶路撒冷的人；我的心看见了许多智慧和知识。”
  rationale: 修订将“变得伟大”和“增加智慧”分别译出，并使“超过所有在我以前统管耶路撒冷的人”明确修饰智慧的增进。“统管”保留עַל耶路撒冷所含的在其上、管辖之意，而不将比较对象具体化为某一身份类别。
