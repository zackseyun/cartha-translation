  text: דִּבַּ֨רְתִּי אֲנִ֤י עִם לִבִּ/י֙ לֵ/אמֹ֔ר אֲנִ֗י הִנֵּ֨ה הִגְדַּ֤לְתִּי וְ/הוֹסַ֨פְתִּי֙ חָכְמָ֔ה עַ֛ל כָּל אֲשֶׁר הָיָ֥ה לְ/פָנַ֖/י עַל יְרוּשָׁלִָ֑ם וְ/לִבִּ֛/י רָאָ֥ה הַרְבֵּ֖ה חָכְמָ֥ה וָ/דָֽעַת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/001/016.yaml
  text: I said in my heart, saying, “I—look—I have become great and increased in wisdom beyond all who were before me over Jerusalem, and my heart has seen much wisdom and knowledge.”
translation:
  language: zh_hans
  text: 我心里说：“看哪，我已经变得伟大，智慧也大有增进，超过所有在我以前统管耶路撒冷的人；我的心看见了许多智慧和知识。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דִּבַּרְתִּי אֲנִי עִם־לִבִּי לֵאמֹר
  choice: 我心里说
  rationale: 按现代汉语自然表达传达“我与自己的心说话”的内在自语；不机械重复希伯来语引语公式“说”。
- source_word: אֲנִי הִנֵּה
  choice: 看哪，我
  rationale: 保留 הִנֵּה 的提示和强调作用，并保留独立人称代词带来的自我强调。
- source_word: הִגְדַּלְתִּי וְהוֹסַפְתִּי חָכְמָה
  choice: 我越发伟大，所得的智慧
  rationale: הִגְדַּלְתִּי 表示“变得伟大/成就卓越”，וְהוֹסַפְתִּי חָכְמָה 表示智慧有所增添；译文用“所得的智慧”与后面的比较结构顺畅衔接。
- source_word: עַל כָּל אֲשֶׁר הָיָה לְפָנַי עַל יְרוּשָׁלִָם
  choice: 超过所有在我以前治理耶路撒冷的人
  rationale: עַל יְרוּשָׁלִָם 在王者语境中可表达对耶路撒冷的管辖；补出“治理”使现代汉语意思完整，同时不限定这些前人为某一特定身份。
- source_word: וְלִבִּי רָאָה הַרְבֵּה חָכְמָה וָדָעַת
  choice: 我的心也见识了许多智慧和知识
  rationale: 保留“心看见”的希伯来语认知隐喻，以“见识”自然表达亲身经历、认识之意。
theological_decisions:
- issue: “在我以前……耶路撒冷的人”的历史范围
  choice: 所有在我以前治理耶路撒冷的人
  alternative: 所有在我以前住在耶路撒冷的人
  rationale: 介词 עַל 通常有“在……之上、管辖……”之意，且上下文采用王者身份；但不进一步把人物明确限定为“众王”，以免消除原文较宽的措辞。
translation_notes:
  register: 采用现代、庄重而通顺的简体中文。“看哪”略带经文庄重色彩，用来保留原文突出的提示语；其余措辞避免古奥。
