base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/005/002.yaml
  text: For a dream comes with much preoccupation[a], and a fool’s voice with many words.
translation:
  language: zh_hans
  text: 因为梦伴随着许多事务而来；愚昧人的声音伴随着许多言语而来。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因为梦因许多事务而来，愚昧人的声音因许多言语而来。” “事务”也可译为“操劳”或“挂心的事”。原文介词可表示伴随，也可带有原因或途径的意味。
    reason: 原文的介词关系可作伴随性理解，也可作原因或途径理解；脚注保留这一不宜在正文中强行判定的歧义。
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，说明先前劝戒的缘由；“因为”自然保留了解释性的逻辑关系。
- source_word: בָּא
  choice: 就来了／也随之而来
  rationale: בוא为完成式，但此处表达格言性的一般规律；汉语用“就来了”较自然。第二分句省略谓语，译文依平行结构补出“也随之而来”。
- source_word: הַחֲלוֹם
  choice: 梦
  rationale: 虽有定冠词，此处为泛指，指一般意义上的梦；汉语直接说“梦”即可自然表达。
- source_word: בְּרֹב עִנְיָן
  choice: 事务繁多
  rationale: עִנְיָן可指事务、操劳、活动或使人挂心之事；“事务繁多”保留其较宽泛的意义，避免仅解释为情绪上的焦虑。
- source_word: וְקוֹל כְּסִיל
  choice: 愚昧人的声音
  rationale: 保留原文“声音”的意象，并以现代汉语所有关系表达“愚昧人的声音”。
- source_word: כְּסִיל
  choice: 愚昧人
  rationale: 这是智慧文学中兼具道德与认知意味的固定人物类型；“愚昧人”比单纯的“笨人”更能保留该范畴。
- source_word: בְּרֹב דְּבָרִים
  choice: 言语繁多
  rationale: 与前半句“事务繁多”形成紧密平行，同时保留原文对话语过多的强调。
theological_decisions: []
