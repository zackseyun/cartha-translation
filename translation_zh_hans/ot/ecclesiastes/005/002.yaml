- from: 因为事务繁多，梦就来了[a]；言语繁多，愚昧人的声音也随之而来。
  to: 因为梦伴随着许多事务而来；愚昧人的声音伴随着许多言语而来。[a]
  rationale: 修订将两行统一译为“伴随着……而来”，保留原文格言体的平行和省略结构，也避免将介词关系限定为明确的先后因果。脚注提供因果性译法，并说明“事务”的语义范围。
