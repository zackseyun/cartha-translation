source:
  edition: WLC
  text: כִּ֚י לֹ֣א הַרְבֵּ֔ה יִזְכֹּ֖ר אֶת יְמֵ֣י חַיָּ֑י/ו כִּ֧י הָ/אֱלֹהִ֛ים מַעֲנֶ֖ה בְּ/שִׂמְחַ֥ת לִבּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/005/019.yaml
  text: For he will not remember much the days of his life[b][a], because God keeps him occupied with the joy of his heart.
translation:
  language: zh_hans
  text: 因为他不大记念自己一生的年日[a]；这是因为上帝使他忙于心中的喜乐[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他不会多记念自己一生的年日。”这里的动词也可译为“记得”或“记念”；“不大”保留了原文所表达的程度（也可能带频率）限定。
    reason: 保留יִזְכֹּר的基本词义，并说明לֹא הַרְבֵּה不宜仅限于“常常”的频率意义。
  - marker: b
    text: 或译：“上帝以他心中的喜乐回应他。”这里的希伯来语动词较字面可译为“回应”；按本段语境，也可理解为上帝使他忙于或专注于心中的喜乐。
    reason: 保留מַעֲנֶה的真实词汇歧义，并说明正文采用的语境性理解。
lexical_decisions:
- source_word: כִּי（首个）
  choice: 因为
  rationale: 承接上文，为人能够享受所得这一福分作出解释；现代汉语用“因为”能清楚表达这一关系。
- source_word: לֹא הַרְבֵּה
  choice: 不会常常
  rationale: 这里修饰“回想”，可表示程度或频率；“不会常常”在汉语中自然，也避免误解为人生年日不多。
- source_word: יִזְכֹּר
  choice: 回想
  rationale: 该词基本义为“记得、记念”。在本语境中，所指不是失去记忆，而是不常把一生的年日放在心上；“回想”既贴近词义，也符合汉语表达。
- source_word: אֶת יְמֵי חַיָּיו
  choice: 自己一生的年日
  rationale: 保留希伯来语“生命的日子”这一具体表达及传道书的文体，同时用“自己”明确代词所指。
- source_word: כִּי（第二个）
  choice: 隐含的因果关系
  rationale: 第二个כִּי说明前句的原因。汉语连续两次使用“因为”较显生硬，因此借由分句次序直接表达因果，不损失语义。
- source_word: הָאֱלֹהִים
  choice: 上帝
  rationale: 在本节中明确指上帝；“上帝”是现代标准汉语中自然、庄重且通行的称呼。
- source_word: מַעֲנֶה
  choice: 使他沉浸
  rationale: 此处动词的具体语义有争议；结合上文上帝赐人享受劳碌所得的语境，较可能表示使人被喜乐占据或专注于喜乐。“使他沉浸”自然传达这一使役意义，同时将更贴字面的译法列入脚注。
- source_word: בְּשִׂמְחַת לִבּוֹ
  choice: 在心中的喜乐里
  rationale: 介词ב可表示范围、状态或凭借；此译保留“心中的喜乐”意象，并与“沉浸”自然搭配。
theological_decisions:
- issue: מַעֲנֶה所表达的上帝行动
  choice: 上帝使人沉浸在心中的喜乐里
  alternative: 上帝以他心中的喜乐回应他
  rationale: 5:18—19的上下文将享受饮食、劳碌所得和喜乐视为上帝的恩赐，因此正面的“使他沉浸”最合语境。不过，动词也可能按较通常的词义理解为“回应”，故在脚注保留这一真实歧义。
- issue: 人“不回想”一生年日的含义
  choice: 不常回想，而非完全忘记
  alternative: 不大记得自己一生的年日
  rationale: 希伯来语לֹא הַרְבֵּה限定回想的程度或频率，并非断言记忆消失。译文避免把这句话解释成健忘，也不进一步断定它专指忧虑或反省。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“一生的年日”保留传道书略带诗性的表达；“沉浸在心中的喜乐里”则使有争议的动词在正文中读来自然。脚注标记按[a]、[b]置于相应短语之后。
