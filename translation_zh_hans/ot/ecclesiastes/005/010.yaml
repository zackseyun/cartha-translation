base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/005/010.yaml
  text: When goods increase[a], those who consume them increase[b]; and what advantage is there to their owners except the seeing of their eyes?
translation:
  language: zh_hans
  text: 财物增多[a]，消耗它的人也增多[b]；它的主人除了眼看[c]以外，还能得到什么益处呢？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “财物”也可译作“好东西”“财富”或“兴盛”。原词含义较广，但本节提到消耗者和主人，因此这里侧重物质财产。
    reason: lexical_alternative
  - marker: b
    text: “消耗它的人”直译为“吃它的人”，可包括享用、依赖或耗费这些财物的人。
    reason: lexical_alternative
  - marker: c
    text: 原文直译近于“他眼睛的观看”，表示主人所得的益处可能不过是眼看着自己拥有的财物。
    reason: idiom
lexical_decisions:
- source_word: בִּרְבוֹת הַטּוֹבָה
  choice: 财物增多
  rationale: בְּ加不定式在此表示时间或伴随情形；הַטּוֹבָה本可指“好处、福乐、兴盛”，但与“消耗者”和“主人”相连，语境更偏向可拥有、可耗用的物质财富。“财物”自然且不过度限缩为金钱。
- source_word: רַבּוּ אֹכְלֶיהָ
  choice: 消耗它的人也增多
  rationale: 原文重复רבה，形成“增多……也增多”的对应。אכל字面是“吃”，在财富语境中可泛指享用、耗用财物的人；“消耗”保留资源被用去的意味。
- source_word: וּמַה כִּשְׁרוֹן לִבְעָלֶיהָ
  choice: 它的主人……还能得到什么益处呢？
  rationale: כִּשְׁרוֹן可指益处、利益或收益。疑问句具有反问语气；“益处”既自然，也保留较宽的语义。בעל在此指拥有者，译为“主人”。
- source_word: כִּי אִם רְאִית עֵינָיו
  choice: 除了亲眼看看以外
  rationale: כִּי אִם引出唯一例外。原文近于“他眼睛的观看”，意指拥有者所得似乎只剩看着自己的财物；“亲眼看看”在现代汉语中自然，并保留其有限、近乎徒然的意味。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“增多……也增多”保留原文的重复和对应；“除了……还能……”呈现反问力度，同时不把经文的讽刺意味解释得过满。
