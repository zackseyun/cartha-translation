  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: הִנֵּ֞ה אֲשֶׁר רָאִ֣יתִי אָ֗נִי ט֣וֹב אֲשֶׁר יָפֶ֣ה לֶֽ/אֶכוֹל וְ֠/לִ/שְׁתּוֹת וְ/לִ/רְא֨וֹת טוֹבָ֜ה בְּ/כָל עֲמָל֣/וֹ שֶׁ/יַּעֲמֹ֣ל תַּֽחַת הַ/שֶּׁ֗מֶשׁ מִסְפַּ֧ר יְמֵי חי/ו אֲשֶׁר נָֽתַן ל֥/וֹ הָ/אֱלֹהִ֖ים כִּי ה֥וּא חֶלְקֽ/וֹ־־־־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/005/017.yaml
  text: Behold[a], what I myself have seen to be good and fitting is to eat and to drink and to see good in all the labor at which he labors under the sun during the number of the days of his life that God has given him, for this is his portion.
translation:
  language: zh_hans
  text: 看哪，我亲自看见：美好而合宜的事乃是，人在日光之下、在上帝赐给他一生的日子中吃喝，并在自己一切劳碌中享福[a]；因为这是他的分。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“经历美好”或“享受美好”。希伯来文直译为“看见美好”。
    reason: 保留源语习语的字面表达，并说明其在此语境中可指经历或享受美好。
lexical_decisions:
- source_word: הִנֵּה
  choice: 看哪
  rationale: 保留强调性的篇章提示语及庄重语气，在现代中文中仍自然可懂。
- source_word: רָאִיתִי אָנִי
  choice: 我亲自看出
  rationale: “亲自”体现独立人称代词的强调；“看出”既保留观察意象，也符合中文表达。
- source_word: טוֹב אֲשֶׁר יָפֶה
  choice: 美好而合宜
  rationale: 分别表达“好”与“适宜、恰当”的并列含义，避免把后者仅理解为外表美丽。
- source_word: לֶאֱכוֹל וְלִשְׁתּוֹת
  choice: 吃喝
  rationale: 简洁自然地表达两个并列不定式，并保留《传道书》中反复出现的主题用语。
- source_word: וְלִרְאוֹת טוֹבָה
  choice: 享福
  rationale: 希伯来语字面为“看见好处/美好”，在此是经历、享受美好之意；中文“享福”自然地传达该习语，同时以脚注保留字面形式及语义范围。
- source_word: בְּכָל עֲמָלוֹ שֶׁיַּעֲמֹל
  choice: 在自己一切劳碌中
  rationale: “劳碌”体现名词与同根动词的辛劳意味；中文不机械重复同根词，以免拗口，但保留所属关系和范围。
- source_word: תַּחַת הַשֶּׁמֶשׁ
  choice: 在日光之下
  rationale: 保留《传道书》的标志性反复用语。
- source_word: מִסְפַּר יְמֵי חַיָּו
  choice: 尽他一生的日数
  rationale: 保留“日数”的源语形式，不擅自加入“短暂”或“寥寥可数”的解释。
- source_word: אֲשֶׁר נָתַן לוֹ הָאֱלֹהִים
  choice: 就是上帝赐给他的日子
  rationale: 明确关系从句所修饰的是一生的日子，并自然呈现上帝为赐予者。
- source_word: כִּי הוּא חֶלְקוֹ
  choice: 因为这是他的分
  rationale: “分”保留 חֵלֶק 所含受分配之份额的主题意义，也避免把它仅解释为命运。
theological_decisions:
- issue: 智慧文学中的阳性单数代表性表达
  choice: 人在……尽他一生的日数……赐给他的日子
  alternative: 他在……一生的日数
  rationale: 以“人”标明这里是代表性、普遍性陈述，同时用单数“他”延续源语的单数形式，不限定为某一特定男子。
- issue: 习语 וְלִרְאוֹת טוֹבָה 的含义
  choice: 享福
  alternative: 看见美好；经历美好
  rationale: 该短语字面为“看见美好”，语境中可指经历或享受劳碌所得的好处。正文采用自然中文“享福”，脚注保留字面表达和真实语义范围，不进一步限定福乐的性质。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“看哪”“日光之下”“他的分”保留《传道书》的篇章语气和主题词；句式经中文化处理，避免照搬希伯来语同根词重复所造成的生硬。
