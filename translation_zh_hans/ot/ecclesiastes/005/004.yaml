  yaml_path: translation/ot/ecclesiastes/005/004.yaml
  text: It is better that you should not vow than that you should vow and not fulfill it[a].
translation:
  language: zh_hans
  text: 与其许愿却不还愿[a]，不如不许愿。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译可作“偿还”或“支付”；此处指履行所许的愿。
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב אֲשֶׁר ... מִשֶׁ...
  choice: 与其……不如……
  rationale: 原文以 טוֹב 配合比较用的 מִן־שֶׁ 构成优劣比较；汉语用“与其……不如……”自然、准确地保留这一箴言式对比。
- source_word: לֹא תִדֹּר
  choice: 不许愿
  rationale: נדר 的 Qal 未完成式第二人称阳性单数在此表达普遍性的判断；“不许愿”简洁保留原义，不额外改写成命令。
- source_word: תִדּוֹר
  choice: 许愿
  rationale: 与前一分句重复同一动词，在译文中保留词汇对应和对比结构。
- source_word: וְלֹא תְשַׁלֵּם
  choice: 却不偿还
  rationale: שלם 的 Piel 在许愿语境中指偿付、履行所许之愿。“偿还”保留原文“支付”的具体意象，并由上下文清楚指向还愿；“却”自然呈现许愿与未偿还之间的反差。
