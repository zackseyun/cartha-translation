source:
  edition: WLC
  text: כִּ֣י בְ/רֹ֤ב חֲלֹמוֹת֙ וַ/הֲבָלִ֔ים וּ/דְבָרִ֖ים הַרְבֵּ֑ה כִּ֥י אֶת הָ/אֱלֹהִ֖ים יְרָֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/005/006.yaml
  text: For in many dreams and vanities there are also many words[b][a]; but fear God.
translation:
  language: zh_hans
  text: 因为梦多，虚空的事也多，话语也多[a][b]；但你要敬畏上帝。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因为梦多，就有虚空的事和许多话；所以要敬畏上帝。”希伯来文在这里有所省略，第二个“因为”既可能带有转折意味，也可能引出结论。
    reason: alternative_reading
  - marker: b
    text: “虚空的事”所译的希伯来词是 הֶבֶל 的复数；这个词在《传道书》中反复出现，可指短暂、无实质或空幻的事物。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי（句首）
  choice: 因为
  rationale: 句首的 כִּי 承接上文，为先前关于谨慎言语和许愿的劝诫说明理由；“因为”自然保留这一连接作用。
- source_word: בְרֹב חֲלֹמוֹת
  choice: 梦多
  rationale: בְרֹב 表示数量众多；采用简洁的汉语结构，以保留希伯来文凝练而略带省略的表达。
- source_word: הֲבָלִים
  choice: 虚空的事
  rationale: הֶבֶל 是《传道书》的主题词，可指短暂、无实质或空幻之物；“虚空”保留全书的词语呼应，加上“的事”使复数名词在现代汉语中自然可懂。
- source_word: וּדְבָרִים הַרְבֵּה
  choice: 话语也多
  rationale: 原文直指言语数量繁多；“话语也多”既贴近字面，又与前两个分句形成整齐节奏。
- source_word: כִּי（第二处）
  choice: 但
  rationale: 第二个 כִּי 在这个省略结构中可表达对比或推论；正文依语境采用转折性的“但”，同时在脚注说明其他可能理解。
- source_word: אֶת הָאֱלֹהִים
  choice: 上帝
  rationale: 带定冠词的 אֱלֹהִים 在此明确指上帝，是命令所指向的对象。
- source_word: יְרָא
  choice: 你要敬畏
  rationale: 这是 ירא 的阳性单数命令形式；“敬畏”兼具惧怕、尊崇和顺服的含义，也保留智慧文学中的重要神学用语。
theological_decisions:
- issue: 智慧文学中 ירא 的译法
  choice: 敬畏上帝
  alternative: 惧怕上帝；尊崇上帝
  rationale: “敬畏”不会把该词缩减为单纯恐惧或一般尊重，而能表达人在上帝面前怀着畏惧、尊崇并顺服的整体态度。
- issue: 第二个 כִּי 与命令之间的逻辑关系
  choice: 译作转折性的“但”
  alternative: 译作推论性的“所以”或不明示连接关系
  rationale: 原文结构高度省略，既可理解为与前述繁多而虚空的现象形成对比，也可理解为由此得出的劝告。正文采用语境自然的转折表达，脚注保留推论读法，避免将歧义定死。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。三个“多”形成简洁的排比，呼应原文的数量堆叠；命令句使用“你要敬畏上帝”，明确单数第二人称而不添加宗派性解释。
