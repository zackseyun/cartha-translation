revisions:
- from: 并且，凡蒙上帝赐予财富和产业，又蒙他赐能力享用这些、取得自己那一份[a]、在自己的劳碌中喜乐的人——这就是上帝的恩赐。
  to: 并且，凡是上帝赐给他财富和财产，又使他能享用这些、取得自己那一份[a]、并在自己的劳碌中喜乐的人，这一切都是上帝的恩赐。
  rationale: 修订仅澄清中文句法与指代，并将“产业”调整为涵义更贴近原文的“财产”。“这一切”概括财富、财产、享用的能力、所得之份及在劳碌中喜乐，准确对应原文末句对前述整体的总结；脚注锚点仍紧接“自己那一份”。
