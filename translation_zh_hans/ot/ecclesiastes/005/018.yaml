  text: גַּ֣ם כָּֽל הָ/אָדָ֡ם אֲשֶׁ֣ר נָֽתַן ל֣/וֹ הָ/אֱלֹהִים֩ עֹ֨שֶׁר וּ/נְכָסִ֜ים וְ/הִשְׁלִיט֨/וֹ לֶ/אֱכֹ֤ל מִמֶּ֨/נּוּ֙ וְ/לָ/שֵׂ֣את אֶת חֶלְק֔/וֹ וְ/לִ/שְׂמֹ֖חַ בַּ/עֲמָל֑/וֹ זֹ֕ה מַתַּ֥ת אֱלֹהִ֖ים הִֽיא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/005/018.yaml
  text: Also[a], every man to whom God has given wealth and possessions, and has empowered him to eat from them, and to take his portion[c][b], and to rejoice in his labor—this is the gift of God.
translation:
  language: zh_hans
  text: 并且，凡是上帝赐给他财富和财产，又使他能享用这些、取得自己那一份[a]、并在自己的劳碌中喜乐的人，这一切都是上帝的恩赐。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “自己那一份”也可译作“自己所得的份”或“自己的份额”。这是《传道书》中常用的说法，指一个人在生活中所得以享用的那一份。
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: 并且
  rationale: 承接上一节，保留附加、推进论述的作用；现代汉语中自然庄重。
- source_word: כָּל הָאָדָם
  choice: 凡……的人
  rationale: 希伯来语以阳性单数作泛指，表达分配性的“每一个人”；汉语用“凡……的人”自然涵盖所有人，同时保留概括性的单数结构。
- source_word: עֹשֶׁר וּנְכָסִים
  choice: 财富和产业
  rationale: “财富”表达物质丰裕，“产业”表达所拥有的财物或家产，保留两词的区分。
- source_word: וְהִשְׁלִיטוֹ
  choice: 蒙他赐能力
  rationale: 使役形动词强调上帝使人有能力或支配力，不只是准许；“赐能力”准确而易懂。
- source_word: לֶאֱכֹל מִמֶּנּוּ
  choice: 享用这些
  rationale: 字面为“从其中吃”，在此指实际取用并享受财富与产业；直译成“吃这些”在汉语中易被误解，故按语境译为“享用这些”。
- source_word: וְלָשֵׂאת אֶת חֶלְקוֹ
  choice: 取得自己那一份
  rationale: 保留 נשׂא 的主动领受、取得之意，并以“那一份”呈现 חלק 在《传道书》中指人生所得份额的关键词义。
- source_word: וְלִשְׂמֹחַ בַּעֲמָלוֹ
  choice: 在自己的劳碌中喜乐
  rationale: “劳碌”保留 עמל 所含辛劳意味，“喜乐”对应 שמח，而不把张力弱化为一般的满意。
- source_word: זֹה מַתַּת אֱלֹהִים הִיא
  choice: 这就是上帝的恩赐
  rationale: 直接呈现判断句；“恩赐”在现代中文中自然表达来自上帝的赠予，且指向前述整体现实。
theological_decisions:
- issue: 财富与享用能力是否都来自上帝
  choice: 明确表达上帝既赐财富产业，也赐人享用的能力
  alternative: 把 וְהִשְׁלִיטוֹ 弱译为“准许他”
  rationale: 原文使役形强调上帝使人能够实际享用所得；译文保留这一神学重点，但不扩展为原文没有说明的特殊能力或权柄。
- issue: כָּל הָאָדָם 的泛指性别表达
  choice: 译为“凡……的人”
  alternative: 译为“每个男人”或“人人”
  rationale: 原文阳性单数在智慧文学中泛指人类个体；现代汉语“凡……的人”既忠实表达普遍范围，也避免把泛指误限为男性。
- issue: חֶלְקוֹ 所指的“份”
  choice: 保留为“自己那一份”，并以脚注提示可理解为所得的份额
  alternative: 直接解释成“人生中命定的份”
  rationale: 原文在《传道书》中具有分得、所得之份的含义，但本节未明确说明其范围或命定方式，故不在正文中作神学化扩展。
translation_notes:
  register: 采用现代、庄重而通顺的普通话。“凡……的人——这就是……”既保留原文长句的智慧文学节奏，也避免生硬的逐词直译；破折号突出末句对前述整体的总结。
