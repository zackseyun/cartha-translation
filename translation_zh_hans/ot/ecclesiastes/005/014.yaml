base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/005/014.yaml
  text: As he came from his mother’s womb[a], naked he will return, going as he came; and he will carry away nothing from his labor that he can take in his hand.
translation:
  language: zh_hans
  text: 他怎样赤身从母腹出来，也必照样赤身而去；他劳碌所得的，没有一样能带在手中带走。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他从劳碌中不能带走任何可以拿在手里的东西。”
    reason: 希伯来语末句可理解为修饰“劳碌所得的”，即没有任何劳碌所得能由他拿在手中带走。
lexical_decisions:
- source_word: כַּאֲשֶׁר יָצָא מִבֶּטֶן אִמּוֹ
  choice: 他怎样从母腹中出来
  rationale: 保留比较结构和具体的出生意象；“母腹”简洁、庄重，符合现代汉语圣经语体。
- source_word: עָרוֹם יָשׁוּב לָלֶכֶת
  choice: 也必赤身而去
  rationale: עָרוֹם直指赤身；יָשׁוּב与לָלֶכֶת合用，表达最终离去及回到起初一无所有的状态。汉语不机械译出“返回去走”，以免生硬。
- source_word: כְּשֶׁבָּא
  choice: 仍像来时一样
  rationale: 承接前句的出生意象，清楚保留离去与来时相同的比较关系。
- source_word: וּמְאוּמָה לֹא יִשָּׂא בַעֲמָלוֹ
  choice: 他劳碌所得的，什么也带不走
  rationale: עָמָל可指劳碌及其所得；此处“劳碌所得的”使中文关系明确，同时保留传道书中劳碌的负重意味。יִשָּׂא按离世语境译为“带走”。
- source_word: שֶׁיֹּלֵךְ בְּיָדוֹ
  choice: 手中什么也带不去
  rationale: 保留“手中”的具体形象，并将希伯来语略显浓缩的关系从句译成自然的汉语平行句。
theological_decisions:
- issue: 人死时的“归回”所指
  choice: 译作“赤身而去，仍像来时一样”
  alternative: 直译为“赤身返回而去”
  rationale: 经文本身着重说明人离世时无法携带劳碌所得，并未在本节明确界定死后归往何处；因此不加入特定的死后状态解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“赤身”保留原文的鲜明意象；“劳碌所得”兼顾עָמָל所含的辛劳与成果。正文略作汉语平行化处理，不额外解释死亡或来世教义。
