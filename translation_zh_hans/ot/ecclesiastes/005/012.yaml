    reason: lexical_alternative
lexical_decisions:
- source_word: יֵשׁ רָעָה חוֹלָה
  choice: 有一件令人痛心的祸患
  rationale: יֵשׁ引出存在性的观察；רָעָה在此指人世间严重有害的现象，译作“祸患”；חוֹלָה本义与疾病有关，在此加强语气，以“令人痛心”自然表达其严重、可悲的意味。
- source_word: רָאִיתִי
  choice: 我见
  rationale: 保留传道者亲自观察所得的见证语气，并以简洁庄重的现代汉语表达完成体动词。
- source_word: תַּחַת הַשָּׁמֶשׁ
  choice: 日光之下
  rationale: 这是《传道书》反复出现的固定表达；“日光之下”自然、庄重，并有利于全书用语一致。
- source_word: עֹשֶׁר
  choice: 财富
  rationale: 指财物或富有的状态；“财富”是清楚、现代且不过分古雅的对应词。
- source_word: שָׁמוּר
  choice: 积存起来
  rationale: 被动分词表示财富被保留、守住；上下文含为自己留存的意味，“积存起来”比单纯“保存”更能传达持续囤积，却不强行断定其动机。
- source_word: לִבְעָלָיו
  choice: 被它的主人……起来
  rationale: בעליו指财富的拥有者。לִ前缀可表达与拥有者的关系或为其利益；正文按语境将其自然处理为积存财富的主体，同时由脚注保留“为主人存留”的句法可能。
- source_word: לְרָעָתוֹ
  choice: 反倒害了自己
  rationale: 表达最终造成拥有者受害的结果。“反倒”凸显原本为己保留却适得其反的张力；“自己”明确回指财富的主人。
