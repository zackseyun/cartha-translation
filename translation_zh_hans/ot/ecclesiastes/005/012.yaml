translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“令人痛心的祸患”保留原文“患病般严重的恶事”这一强化表达的情感重量；句末用“反倒”呈现财富本为主人保留却伤害主人的反常张力。
