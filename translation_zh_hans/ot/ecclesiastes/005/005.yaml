  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: אַל תִּתֵּ֤ן אֶת פִּ֨י/ךָ֙ לַ/חֲטִ֣יא אֶת בְּשָׂרֶ֔/ךָ וְ/אַל תֹּאמַר֙ לִ/פְנֵ֣י הַ/מַּלְאָ֔ךְ כִּ֥י שְׁגָגָ֖ה הִ֑יא לָ֣/מָּה יִקְצֹ֤ף הָֽ/אֱלֹהִים֙ עַל קוֹלֶ֔/ךָ וְ/חִבֵּ֖ל אֶת מַעֲשֵׂ֥ה יָדֶֽי/ךָ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/005/005.yaml
  text: Do not let your mouth cause your flesh to sin[a], and do not say before the messenger, “It was a mistake.” Why should God be angry at your voice and destroy the work of your hands?
translation:
  language: zh_hans
  text: 不要让你的口使你的肉身犯罪，也不要在使者[a]面前说：“这是无心之过。”上帝何必因你的声音发怒，毁坏你手所做的工呢？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“天使”。希伯来语 מַלְאָךְ 既可指人的使者，也可指天上的使者。
    reason: 保留原词在此处可能指人间使者或天使的歧义。
lexical_decisions:
- source_word: תִּתֵּן אֶת־פִּיךָ
  choice: 让你的口
  rationale: 希伯来语直译为“把你的口交给”，在这里表达容许之意；“让你的口”在现代汉语中自然，并保留原文以“口”为行为主体的具体表达。
- source_word: לַחֲטִיא
  choice: 使……犯罪
  rationale: 这是 חטא 的使役式，明确表达“使……陷入罪中”的因果关系；译作“使……犯罪”简洁且不额外解释犯罪的具体方式。
- source_word: בְּשָׂרֶךָ
  choice: 你的肉身
  rationale: 原词本义为“肉、肉身”，此处可指人的身体或有形的自身；保留“肉身”既反映原文措辞，也避免直接化约为“你自己”。
- source_word: הַמַּלְאָךְ
  choice: 使者
  rationale: מַלְאָךְ 可指人的使者，也可指天上的使者。誓愿与圣所的语境容许将其理解为处理相关事务的人间使者，但原文没有排除天使，因此正文采用较宽泛的“使者”，脚注保留另一可能。
- source_word: שְׁגָגָה
  choice: 无心之过
  rationale: 该词指误失、疏忽或非故意的过错。“无心之过”自然地呈现说话者试图以非故意为由开脱，同时不将其限定为某种专门的祭祀法规术语。
- source_word: קוֹלֶךָ
  choice: 你的声音
  rationale: 原文直译为“你的声音”，在此借具体的声音指已经说出的誓言或辩解；保留这一表达可呈现原文的修辞质感。
- source_word: וְחִבֵּל
  choice: 毁坏
  rationale: 该动词表示损坏、败坏或毁灭；“毁坏”准确传达上帝审判对劳作成果造成的严重后果。
- source_word: מַעֲשֵׂה יָדֶיךָ
  choice: 你手所做的工
  rationale: 这是表示人的劳作及其成果的常见希伯来语表达；此译法在现代汉语中清楚，也保留“手”这一具体意象。
theological_decisions:
- issue: 誓愿语境中 הַמַּלְאָךְ 的身份
  choice: 使者
  alternative: 天使
  rationale: 原词同时可用于人间使者和天上使者。上下文涉及敬拜与誓愿，人间负责相关事务的使者在语境上合理，但经文本身并未明确其身份。正文采用语义范围较宽的“使者”，并用脚注保留“天使”，以免消除原文的神学与解释张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“肉身”“声音”“手所做的工”保留原文的具体意象；“何必……呢”传达原文反问语气。脚注标记置于“使者”之后，与所解释的词直接对应。
