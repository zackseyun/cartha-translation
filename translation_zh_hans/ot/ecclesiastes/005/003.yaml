  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כַּ/אֲשֶׁר֩ תִּדֹּ֨ר נֶ֜דֶר לֵֽ/אלֹהִ֗ים אַל תְּאַחֵר֙ לְ/שַׁלְּמ֔/וֹ כִּ֛י אֵ֥ין חֵ֖פֶץ בַּ/כְּסִילִ֑ים אֵ֥ת אֲשֶׁר תִּדֹּ֖ר שַׁלֵּֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/005/003.yaml
  text: When you make a vow to God[a], do not delay in paying it, for he takes no pleasure in fools[b]. Pay what you vow.
translation:
  language: zh_hans
  text: 你向上帝许愿时，不可迟延履行[a]，因为他不喜悦愚昧人[b]。你许的愿，务要履行。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “履行”所译的希伯来语动词也可指偿付、完成或兑现所许的愿。
    reason: lexical_alternative
  - marker: b
    text: 原文直译近似“因为在愚昧人中没有喜悦”，没有明说喜悦的主体；按上下文，这里是指上帝不喜悦愚昧人。
    reason: alternative_reading
lexical_decisions:
- source_word: כַּאֲשֶׁר
  choice: ……时
  rationale: 引出许愿发生之时的劝诫情境；用“……时”自然表达时间关系，不把句意收窄为假设条件。
- source_word: תִּדֹּר נֶדֶר
  choice: 许愿
  rationale: 原文是同根动词与名词连用，直译近似“许一个愿”；现代汉语用“许愿”即可自然表达正式立愿的行为。
- source_word: לֵאלֹהִים
  choice: 向上帝
  rationale: 敬拜与许愿的语境明确指向以色列的上帝；“向”准确表达许愿的对象。
- source_word: אַל תְּאַחֵר
  choice: 不可迟延
  rationale: 保留原文禁止命令的直接语气，也清楚表达不得拖延。
- source_word: לְשַׁלְּמוֹ / שַׁלֵּם
  choice: 履行
  rationale: שׁלם在此可指偿付、完成或履行所许之愿。愿的内容未必仅是钱财或祭物，因此“履行”比单用“偿还”更全面；前后重复同一译词，也保留原文的强调。
- source_word: כִּי אֵין חֵפֶץ
  choice: 因为他不喜悦
  rationale: 希伯来文没有明说“喜悦”的主体；按紧邻的“上帝”及论述关系，译文以“他”补出自然含义，同时用脚注保留原文的省略。
- source_word: בַּכְּסִילִים
  choice: 愚昧人
  rationale: 在智慧文学中，该词主要指道德与属灵判断错误的人，并非单指智力不足；“愚昧人”保留这一传统智慧范畴且语体庄重。
- source_word: אֵת אֲשֶׁר תִּדֹּר שַׁלֵּם
  choice: 你许的愿，务要履行
  rationale: 以话题前置保留原文突出“你所许的”这一宾语的结构；“务要”传达结尾命令的简洁与力度。
theological_decisions:
- issue: “因为在愚昧人中没有喜悦”之省略主语
  choice: 正文按语境译为“因为他不喜悦愚昧人”
  alternative: 保留无人称表达，如“因为愚昧人中没有喜悦”
  rationale: 上下文谈向上帝许愿，警告的合理依据是上帝不喜悦轻率许愿而不履行的愚昧人。不过原文在语法上没有明说主体，因此以脚注交代其形式，避免掩盖真实的省略与可能张力。
- issue: כְּסִילִים的道德含义
  choice: 愚昧人
  alternative: 愚蠢的人；无知的人
  rationale: 《传道书》的智慧语境赋予该词道德和属灵层面的负面含义；“愚昧人”不会把它误解为单纯智力低下，也避免口语化贬骂。
- issue: 许愿义务的表达范围
  choice: 履行所许的愿
  alternative: 偿还所许的愿
  rationale: 原文动词含偿付和完成之义，但许愿内容可能包括奉献、行动或其他承诺。“履行”既不把义务局限于钱物，也不削弱必须兑现的要求。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“不可迟延”保留劝诫的严肃性；末句用“你许的愿，务要履行”保持原文宾语前置和命令式强调。正文中的脚注标记[a]、[b]均与脚注对应。
