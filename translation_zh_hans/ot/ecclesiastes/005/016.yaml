  text: גַּ֥ם כָּל יָמָ֖י/ו בַּ/חֹ֣שֶׁךְ יֹאכֵ֑ל וְ/כָעַ֥ס הַרְבֵּ֖ה וְ/חָלְי֥/וֹ וָ/קָֽצֶף־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/005/016.yaml
  text: Also[a], all his days he eats in darkness[b], with much vexation and sickness and anger.
translation:
  language: zh_hans
  text: 并且，他一生都在黑暗中吃饭[a]，多有烦恼[b]，又有疾病和愤怒。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在黑暗中”既可按字面理解，也可比喻阴郁、没有喜乐的人生。
    reason: lexical_alternative
  - marker: b
    text: “烦恼”也可译作“愁苦”“恼怒”或“挫折”；希伯来文表达紧缩，所指范围较宽。
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: 并且
  rationale: 承接上文，补充说明这个人悲惨处境的另一面，保留原词的递进、附加作用。
- source_word: כָּל יָמָיו
  choice: 他一生
  rationale: 这是“他所有的日子”的自然现代汉语表达，完整传达其贯穿一生的含义。
- source_word: בַּחֹשֶׁךְ
  choice: 在黑暗中
  rationale: 保留希伯来文具体的“黑暗”意象，不把它限定为字面环境或比喻性的阴郁人生。
- source_word: יֹאכֵל
  choice: 吃饭
  rationale: 此处未完成式表示惯常、持续的行为；“吃饭”在现代汉语中比单用“吃”自然，同时没有加入“喝”的意思。
- source_word: וְכָעַס הַרְבֵּה
  choice: 多有烦恼
  rationale: 原文表达紧缩，כעס可指烦恼、愁苦、恼怒或挫折感；“多有烦恼”保留“许多”的程度，也符合本段描述的内在困苦。
- source_word: וְחָלְיוֹ
  choice: 又有疾病
  rationale: חֳלִי指疾病或病痛；第三人称单数后缀在汉语句法中由共同主语“他”自然体现。
- source_word: וָקָצֶף
  choice: 和愤怒
  rationale: קֶצֶף可指愤怒或震怒；在此语境中较自然地描述这个人的愤懑状态，并不明确指向上帝的震怒。
theological_decisions:
- issue: “黑暗”是字面还是比喻
  choice: 在正文中保留“黑暗”这一意象，不作单一解释
  alternative: 直接译为“在阴郁、毫无喜乐的生活中”
  rationale: 原文容许字面和比喻两种理解；直译意象可避免消除这种张力。
- issue: 末尾“愤怒”的主体或指向
  choice: 按并列名词理解为这个人生活中的愤怒或愤懑
  alternative: 理解为临到他的震怒，甚至特指上帝的震怒
  rationale: 上下文主要描写这个人的痛苦处境，原文并未明说愤怒来自上帝，因此不宜加入神学限定。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“他一生”避免生硬照搬“他所有的日子”；“吃饭”清楚表达惯常生活行为。“多有……又有……”既反映原文紧缩的并列结构，又保持普通读者可读性。
