  text: אִם עֹ֣שֶׁק רָ֠שׁ וְ/גֵ֨זֶל מִשְׁפָּ֤ט וָ/צֶ֨דֶק֙ תִּרְאֶ֣ה בַ/מְּדִינָ֔ה אַל תִּתְמַ֖הּ עַל הַ/חֵ֑פֶץ כִּ֣י גָבֹ֜הַּ מֵ/עַ֤ל גָּבֹ֨הַ֙ שֹׁמֵ֔ר וּ/גְבֹהִ֖ים עֲלֵי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/005/007.yaml
  text: If you see the oppression of the poor and the robbery of justice and righteousness in the province, do not be astonished at the matter; for a high official is watched by one higher, and there are even higher ones over them.
translation:
  language: zh_hans
  text: 你若在省内看见穷人受欺压[a]，公理和正义遭劫夺[b]，不要对此感到惊讶；因为有一位高位者在监察另一位高位者，在他们之上还有更高位者[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“穷人遭勒索”。原文可指一般性的欺压，也可强调以强势手段剥削、夺取。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“对公理和正义的劫掠”。
    reason: lexical_alternative
  - marker: c
    text: 原文直译为：“因为高者在高者之上监察，在他们之上还有更高者。”这可能指人间官员的层层监督，也可能暗示上帝最终的监察。
    reason: alternative_reading
lexical_decisions:
- source_word: עֹשֶׁק רָשׁ
  choice: 穷人受欺压
  rationale: עֹשֶׁק可指压迫、剥削或勒索，רָשׁ指贫穷者；此译自然表达社会性压迫，同时以脚注保留“遭勒索”的词义可能。
- source_word: גֵזֶל מִשְׁפָּט וָצֶדֶק
  choice: 公理和正义被剥夺
  rationale: גֵזֶל含抢夺、劫掠之意；与“公理和正义”搭配时，用“被剥夺”既保留强行夺去的意象，也符合现代汉语。מִשְׁפָּט侧重司法与公平秩序，צֶדֶק侧重正直、公义。
- source_word: מְדִינָה
  choice: 省内
  rationale: 该词在行政语境中指省或行政区；“省内”简洁贴合官僚层级的背景。
- source_word: תִּתְמַהּ עַל־הַחֵפֶץ
  choice: 不要对此感到惊讶
  rationale: תִּתְמַהּ表示惊奇、诧异；הַחֵפֶץ在这里自然指前述事情或现象，“对此”符合现代汉语表达。
- source_word: גָבֹהַּ מֵעַל גָּבֹהַּ שֹׁמֵר
  choice: 高位者有更高位者监察
  rationale: 两个גָבֹהַּ均为实体化形容词，指地位较高者；שֹׁמֵר表示看守、留意或监察。此译保留层级关系及主动分词本身可能具有的监督含义。
- source_word: וּגְבֹהִים עֲלֵיהֶם
  choice: 在他们之上还有更高位者
  rationale: 复数“更高位者”延续逐层向上的权力结构，不在正文中限定为人间官员，也不直接补入上帝。
theological_decisions:
- issue: 末句是否应在正文中明确指上帝为最终监察者
  choice: 保留“更高位者”的层级性措辞，不增译“上帝”
  alternative: 将最高者明确解释为上帝，或译作“至高者”
  rationale: 希伯来文本只反复使用“高的／更高者”，并未在本节明说上帝。官僚体系的层层监察与神最终鉴察的暗示都可能存在，因此正文保留张力，脚注说明两种理解。
- issue: שֹׁמֵר所表达的是监督、保护还是窥伺
  choice: 译作“监察”
  alternative: 译作“看守”“留意”或“监视”
  rationale: 该词语义可涵盖看守与观察；本句的权力层级语境支持“监察”，但不进一步判断这种监察是伸张正义还是维持压迫体系。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“公理和正义”区分司法公平与道德正直；“高位者／更高位者”保留原文反复和层级感。正文避免使用“官员”来封闭“更高者”可能兼含神圣监察的含义。
