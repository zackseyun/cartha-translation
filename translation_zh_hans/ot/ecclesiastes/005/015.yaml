id: ECC.5.15
reference: Ecclesiastes 5:15
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/גַם זֹה֙ רָעָ֣ה חוֹלָ֔ה כָּ/ל עֻמַּ֥ת שֶׁ/בָּ֖א כֵּ֣ן יֵלֵ֑ךְ וּ/מַה יִּתְר֣וֹן ל֔/וֹ שֶֽׁ/יַּעֲמֹ֖ל לָ/רֽוּחַ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/005/015.yaml
  text: 'This too is a grievous evil: exactly as he came[a], so he will go. And what profit is there for him who toils for the wind?'
translation:
  language: zh_hans
  text: 这也是一件惨痛的祸患：他怎样来，也必照样去。他为风[a]劳碌，究竟有什么益处呢？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “风”也可译作“气息”或“灵”；希伯来语 רוּחַ 可有这些含义。此处译作“风”，最符合劳碌归于徒然的语境。
    reason: 词义有多种可能
lexical_decisions:
- source_word: רָעָה חוֹלָה
  choice: 惨痛的祸患
  rationale: רָעָה指祸患、坏事，חוֹלָה本与患病有关，在此构成强调性的表达，指令人痛苦、严重的祸患；“惨痛的祸患”既保留沉重感，又避免误解为身体疾病。
- source_word: כָּל עֻמַּת שֶׁבָּא
  choice: 他怎样来，也必照样
  rationale: עֻמַּת表达对应、相称之意；此译简明地呈现来与去之间完全对应的关系。
- source_word: יֵלֵךְ
  choice: 去
  rationale: 原词简洁地表示离去，在语境中暗指死亡；不把隐含意义直接译成“死”，以保留原文措辞。
- source_word: יִתְרוֹן
  choice: 益处
  rationale: 这是《传道书》中反复出现的关键词，表示劳作所得的盈余、利益或优势；“益处”自然且适合此处反问语气。
- source_word: שֶׁיַּעֲמֹל
  choice: 劳碌
  rationale: עמל带有辛劳、劳苦的意味；“劳碌”符合《传道书》的语域，并体现工作的沉重感。
- source_word: לָרוּחַ
  choice: 为风
  rationale: רוּחַ可指风、气息或灵；此处讨论人至死不能保有所得，“为风劳碌”形成追逐无形之物的具体意象，最切合徒劳的语境，同时以脚注保留其他词义。
theological_decisions:
- issue: 智慧文学中 רוּחַ 的所指
  choice: 风
  alternative: 气息；灵
  rationale: “风”保留劳碌却无所得的具体意象，也避免在上下文没有明确依据时将其灵性化；由于该词确有“气息”和“灵”的语义，脚注予以说明。
- issue: “去”是否明确译为死亡
  choice: 保留“去”的含蓄表达
  alternative: 死去
  rationale: 上下文表明此处指死亡，但原文使用普通动词“去”，与“来”形成对称；保留这一张力和委婉语更贴近原文。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“他怎样来，也必照样去”保留原文来去对称的格言式表达；反问句以“究竟”凸显徒劳感。脚注标记置于其实际解释的“风”之后。
