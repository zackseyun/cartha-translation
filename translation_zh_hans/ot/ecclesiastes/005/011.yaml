  yaml_path: translation/ot/ecclesiastes/005/011.yaml
  text: Sweet is the sleep of the worker[a], whether he eats little or much, but the abundance of the rich man does not let him sleep.
translation:
  language: zh_hans
  text: 劳作的人睡得香甜，无论吃得少还是多；富人的丰裕[a]却不让他入睡。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “丰裕”或译“饱足”“充裕”。希伯来语词可指饱足、满足或充裕；这里可能指富人的丰裕，也可能指他的饱足。
    reason: lexical_alternative
lexical_decisions:
- source_word: מְתוּקָה
  choice: 香甜
  rationale: 原词本义为“甜”，在这里比喻睡眠舒适宜人；“香甜”是现代汉语描述睡眠的自然表达，也保留了希伯来文的具体意象。
- source_word: שְׁנַת הָעֹבֵד
  choice: 劳作的人睡得
  rationale: 这是“睡眠”与“劳作者”构成的属格结构。译为“劳作的人睡得”符合现代汉语习惯，并保留其与富人的对照。
- source_word: אִם מְעַט וְאִם הַרְבֵּה יֹאכֵל
  choice: 无论吃得少还是多
  rationale: 原文的对应条件结构表示两种数量情形都不影响结论；此译简洁自然，且明确“少、多”指所吃的量。
- source_word: הַשָּׂבָע לֶעָשִׁיר
  choice: 富人的丰足
  rationale: שׂבע可指饱足、饱胀或丰裕。正文采用“丰足”，既能表达富人拥有的充裕，也不完全排除过度饱足的意味；其他可能含义列入脚注。
- source_word: אֵינֶנּוּ מַנִּיחַ לוֹ לִישׁוֹן
  choice: 却使他不能入睡
  rationale: 原文使役结构表示某事不让富人睡觉。“使他不能入睡”准确而自然，保留了丰足成为睡眠阻碍的因果关系。
