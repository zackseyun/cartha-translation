  yaml_path: translation/ot/ecclesiastes/005/009.yaml
  text: Whoever loves silver will not be satisfied with silver[a], nor whoever loves abundance with income[b]; this too is vapor.
translation:
  language: zh_hans
  text: 爱银子的人，银子不能使他知足；爱财富的人，收益也不能使他知足。[a]这也是雾气。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 第二分句的希伯来语句法较难确定，原文未明说与前句对应的谓语；这里按平行结构补作“收益也不能使他知足”。“财富”也可译作“丰盛”或“众多”，“收益”也可译作“出产”“增益”或“所得”。
    reason: alternative_reading
  - marker: b
    text: 希伯来语意为“雾气”（传统常译“虚空”）；这是《传道书》反复使用的词，描写短暂、难以捉摸或不实在的事物。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹהֵב
  choice: 爱……的
  rationale: 希伯来语分词泛指以爱恋某物为特征的人；“爱……的”是自然、简洁的现代汉语表达。
- source_word: כֶּסֶף
  choice: 银子
  rationale: 该词本义为“银”，又常转指钱财。“银子”既保留原文意象和重复，又能让现代读者从上下文理解为钱财。
- source_word: יִשְׂבַּע
  choice: 知足
  rationale: 该动词表示吃饱、满足；在贪爱钱财的语境中，“知足”自然地表达无法得到满足的含义。
- source_word: וּמִי
  choice: 也……的
  rationale: 此处句法困难；结合前后平行结构，将连词与代词理解为引出第二类泛指之人，而不硬译为疑问句。
- source_word: בֶּהָמוֹן
  choice: 财富
  rationale: הָמוֹן可指众多、丰盛或财富；本节围绕钱财与所得，“财富”符合语境，同时在脚注保留“丰盛”等可能。
- source_word: תְבוּאָה
  choice: 收益
  rationale: 该词本指农产、出产或增益，在财富语境中可指所得或收益；“收益”能清楚表达此处的经济含义。
- source_word: הָבֶל
  choice: 雾气
  rationale: 这是《传道书》的关键词，本义意象为气息、蒸气；“雾气”保留其短暂、难以捉摸和虚幻不实的比喻，避免直接解释成“毫无意义”。
theological_decisions:
- issue: 《传道书》反复出现的הָבֶל如何译出
  choice: 雾气
  alternative: 虚空、气息、毫无意义
  rationale: “雾气”保留原文具体比喻及其短暂、难以把握的张力，不把作者的判断收窄为单一的抽象结论。
- issue: 第二分句的省略与句法困难
  choice: 按与第一分句平行的陈述句翻译，并补出“因……而知足”
  alternative: 直译成疑问式或译为“爱丰盛的，没有出产”
  rationale: 原文第二分句缺少与第一分句对应的谓语，且结构不寻常。按诗句平行关系补足含义，可形成通顺汉语，同时用脚注明示原文的困难和其他词义，避免把解释伪装成确定无疑的原文。
translation_notes:
  register: 采用庄重而通俗的现代标准汉语。两个平行分句以“爱……的，不会因……而知足”呈现，节奏清楚；保留“银子”的原文意象，并以“雾气”维持全书核心比喻。
