  text: אַל תְּבַהֵ֨ל עַל פִּ֜י/ךָ וְ/לִבְּ/ךָ֧ אַל יְמַהֵ֛ר לְ/הוֹצִ֥יא דָבָ֖ר לִ/פְנֵ֣י הָ/אֱלֹהִ֑ים כִּ֣י הָ/אֱלֹהִ֤ים בַּ/שָּׁמַ֨יִם֙ וְ/אַתָּ֣ה עַל הָ/אָ֔רֶץ עַֽל כֵּ֛ן יִהְי֥וּ דְבָרֶ֖י/ךָ מְעַטִּֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/005/001.yaml
  text: Do not be hasty with your mouth[a], and do not let your heart be quick to bring forth a word before God, for God is in heaven and you are on earth. Therefore let your words be few.
translation:
  language: zh_hans
  text: 你不可贸然开口[a]，你的心也不可急于在上帝面前说出话来；因为上帝在天上，你在地上，所以你的话要少。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“不可急着开口”。这里可能包括仓促许愿，但希伯来原文更广泛地指在上帝面前说出话来。
    reason: 说明“不可贸然开口”所译希伯来语表达的可行替代译法，并避免将本节含义过早限缩为许愿。
lexical_decisions:
- source_word: תְּבַהֵל עַל־פִּיךָ
  choice: 你开口不可急躁
  rationale: בהל在此表示仓促、冒失；结合“口”这一意象，译为“开口不可急躁”，既自然，又保留对冲动发言的警告。
- source_word: וְלִבְּךָ אַל־יְמַהֵר
  choice: 你的心也不可急于
  rationale: “心”在希伯来语中涵盖思想、意志和内在倾向；保留“心”，并以“急于”表达מהר的仓促之意。
- source_word: לְהוֹצִיא דָבָר
  choice: 说出话来
  rationale: 原文直译为“把话带出来”。现代汉语用“说出话来”能自然地保留言语从内心发出的动态，又不把含义限缩为许愿。
- source_word: לִפְנֵי הָאֱלֹהִים
  choice: 在上帝面前
  rationale: 直接表达身处上帝面前、在其临在中发言的庄重语境。
- source_word: כִּי הָאֱלֹהִים בַּשָּׁמַיִם וְאַתָּה עַל־הָאָרֶץ
  choice: 因为上帝在天上，你在地上
  rationale: 保留原文简洁鲜明的天上与地上之对照，不额外解释其神学含义。
- source_word: עַל־כֵּן יִהְיוּ דְבָרֶיךָ מְעַטִּים
  choice: 所以你的话要少
  rationale: “所以”清楚表达推论关系；“要少”自然传达祈使性的约束，并保留原文的简洁力度。
theological_decisions:
- issue: 本节是否应明确限定为敬拜中的许愿或誓言
  choice: 正文保留“说出话来”这一较宽泛的言语范畴
  alternative: 译成“许愿”或“起誓”
  rationale: 下文确实谈及许愿，但本节原文本身只说“说出话来”。不在正文中加入“许愿”，可保留语境关联与字面广义之间的张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“开口不可急躁”保留原文“口”的身体意象；“说出话来”比生硬的“带出一句话”自然，同时不作超出原文的具体化。
