base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/005/013.yaml
  text: And that wealth was lost in a bad venture[b][a], and he fathered a son and had nothing in his hand.
translation:
  language: zh_hans
  text: 那笔财富因一桩不幸的事[a]而失去了；他生了一个儿子，手里却一无所有[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因一桩有害的营生”，或“在一件不幸的事情中”。希伯来语可指造成损失的经营活动，也可泛指有害或不幸的境遇。
    reason: lexical_alternative
  - marker: b
    text: 直译：“他手里什么也没有。”这是表示他一无所有的说法。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָבַד
  choice: 损失了
  rationale: 此处财富是动词的主语，表达财富失去、荡然无存的结果；“损失了”在现代汉语中自然，也不额外指明责任主体。
- source_word: הָעֹשֶׁר הַהוּא
  choice: 那财富
  rationale: 保留定冠词与指示成分所表达的特指；“财富”准确对应 עֹשֶׁר。
- source_word: בְּעִנְיַן רָע
  choice: 因一桩不幸的事
  rationale: עִנְיָן 可指事务、事情或经营活动，רָע 在此可表示有害或不幸；正文采用较宽泛的译法，以免把语境限定为投资或生意。
- source_word: וְהוֹלִיד בֵּן
  choice: 他生了一个儿子
  rationale: 希伯来语使役形在此表示男子生养、成为父亲；现代汉语“生了一个儿子”自然，并保留 בֵּן 的男性所指。
- source_word: וְאֵין בְּיָדוֹ מְאוּמָה
  choice: 手里却一无所有
  rationale: 保留“手里”的具体意象，同时以“一无所有”自然表达没有任何财物；“却”显明父亲有儿子但无物可留给他的反差。
