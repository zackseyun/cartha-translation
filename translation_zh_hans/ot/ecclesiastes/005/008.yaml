  yaml_path: translation/ot/ecclesiastes/005/008.yaml
  text: The land’s profit is for everyone; even a king is served by the field.[a]
translation:
  language: zh_hans
  text: 土地的收益人人都有份；连君王也受田地供养。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这句希伯来文十分难解。另一种译法是：“一国在各方面的益处，是有一位致力于耕地的君王。”末句也可理解为：“连君王也依赖田地。”
    reason: alternative_reading
lexical_decisions:
- source_word: וְיִתְרוֹן אֶרֶץ
  choice: 土地的收益
  rationale: יִתְרוֹן是《传道书》中反复出现的词，可指“益处、收益、所得”；此处译作“收益”，既呼应土地出产的语境，也保留其核心含义。
- source_word: בַּכֹּל
  choice: 人人都有份
  rationale: 按主译所采用的分句方式，将בַּכֹּל理解为“归众人、人人共享”；另一种“在各方面”的副词性理解保留在脚注中。
- source_word: מֶלֶךְ לְשָׂדֶה נֶעֱבָד
  choice: 连君王也受田地供养
  rationale: 将“君王”理解为被动分词נֶעֱבָד的对象，并以田地为供养他的来源。“供养”比直译“服侍”更自然地表达君王也依赖土地出产，同时不消除原文压缩句法所造成的歧义。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而通顺的普通话。“人人都有份”自然表达普遍受益；“受田地供养”保留农业意象，并清楚传达君王也不能脱离土地出产。脚注明示原文句法的显著歧义。
