  text: before the silver cord is snapped[a], and the golden bowl is shattered, and the jar is broken at the spring[d][c][b], and the wheel is crushed at the pit.
translation:
  language: zh_hans
  text: 趁银索还没有断裂[a]，金碗还没有破碎，水罐还没有在泉边破碎[b]，轮子还没有在井边碎裂[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “断裂”的希伯来文在此语境中较难确定；也可理解为“松开”“切断”或“挪去”。
    reason: lexical_alternative
  - marker: b
    text: “水罐”也可译作“水瓶”。
    reason: lexical_alternative
  - marker: c
    text: “轮子”可能特指井上的辘轳或滑轮；“井边”也可理解为“坑边”或“蓄水池边”。
    reason: lexical_alternative
lexical_decisions:
- source_word: עַד אֲשֶׁר לֹא
  choice: 趁……还没有
  rationale: 承接上文“当记念你的创造主”的劝勉，表达这些死亡意象发生之前；现代汉语用“趁……还没有”自然保留劝勉语气。
- source_word: ירחק
  choice: 断开
  rationale: 该动词通常表示“远离”，但此处语义和文本理解困难；“断开”符合绳索意象及后续一连串毁坏动作，同时以脚注保留其他可能。
- source_word: חֶבֶל הַכֶּסֶף
  choice: 银链
  rationale: חֶבֶל本义为绳、索；“银链”在中文中简洁而具诗意，也保留传统意象。
- source_word: וְתָרֻץ
  choice: 破碎
  rationale: 源自动词 רצץ，表示击碎、压碎；用于金碗时，“破碎”自然且有力度。
- source_word: גֻּלַּת הַזָּהָב
  choice: 金碗
  rationale: גֻּלָּה可指碗、盆，也可能是灯盏的储油器；正文采用不过度限定用途的“金碗”。
- source_word: וְתִשָּׁבֶר כַּד
  choice: 水罐……摔破
  rationale: כַּד是取水用的罐或瓶；“水罐”交代功能，“摔破”贴合器皿在水源旁破裂的画面。
- source_word: עַל הַמַּבּוּעַ
  choice: 在泉边
  rationale: מַבּוּעַ指泉源、涌泉；“泉边”准确且符合现代汉语搭配。
- source_word: וְנָרֹץ
  choice: 砸碎
  rationale: 同样源自 רצץ，表达猛烈毁坏；“砸碎”用于轮子自然，也避免与前句机械重复。
- source_word: הַגַּלְגַּל
  choice: 水轮
  rationale: 该词基本义为“轮”；在取水场景中可能具体指井上的辘轳或滑轮。“水轮”保留轮状取水装置的画面，具体构造仍不确定。
- source_word: אֶל הַבּוֹר
  choice: 在井口
  rationale: בּוֹר可指坑、井或蓄水池；结合水罐和取水轮的语境，译作“井口”形成自然场景。介词 אֶל 在此可按动作所临到之处理解，而不必断定轮子落入井中。
theological_decisions:
- issue: 本节一系列器物意象的解释
  choice: 正文保留银链、金碗、水罐和水轮毁坏的诗性画面，作为死亡临近的整体意象，不逐一对应人体部位。
  alternative: 把每件器物明确解释为衰老身体的特定器官或机能。
  rationale: 这些意象显然处于衰老与死亡的语境中，但各物件与身体部位之间的具体对应缺乏共识；直译意象可保留诗歌的含混与神学张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。用“趁……还没有”承接上文劝勉，并以四个并列分句保存原文节奏。正文不把诗性意象解释成具体人体寓意；困难词义集中置于脚注。
