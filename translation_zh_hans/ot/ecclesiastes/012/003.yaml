revisions:
- from: 在那日，看守房屋的发颤[a]，有力的汉子屈身，推磨的因人数稀少而停歇，从窗户[b]往外观看的也昏暗起来；
  to: 在那日，看守房屋的人发颤[a]，强壮的男子弯曲，推磨的因人数减少而停歇，从窗户向外看的，眼前也昏暗起来[b]；
  rationale: 修订只处理汉语表达和末句的语义指向：以“眼前也昏暗起来”传达观看者视见变暗的诗性效果，而不在正文指定其为眼睛；其余意象、因果关系和开放性均予保留。
