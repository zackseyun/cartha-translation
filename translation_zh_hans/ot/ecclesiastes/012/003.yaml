  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: בַּ/יּ֗וֹם שֶׁ/יָּזֻ֨עוּ֙ שֹׁמְרֵ֣י הַ/בַּ֔יִת וְ/הִֽתְעַוְּת֖וּ אַנְשֵׁ֣י הֶ/חָ֑יִל וּ/בָטְל֤וּ הַ/טֹּֽחֲנוֹת֙ כִּ֣י מִעֵ֔טוּ וְ/חָשְׁכ֥וּ הָ/רֹא֖וֹת בָּ/אֲרֻבּֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/012/003.yaml
  text: on the day when the keepers of the house tremble[a], and the men of strength are bent, and the grinders cease because they are few, and those looking through the windows grow dark[b],
translation:
  language: zh_hans
  text: 在那日，看守房屋的人发颤[a]，强壮的男子弯曲，推磨的因人数减少而停歇，从窗户向外看的，眼前也昏暗起来[b]；
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这些意象很可能描绘年老体衰：“看守房屋的人”可能指手臂或双手，“强壮的男子”指双腿，“推磨的”指牙齿，“从窗户向外看的”指眼睛。
    reason: alternative_reading
  - marker: b
    text: “窗户”也可译作“窗格”。
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם
  choice: 在那日
  rationale: 保留原文的时间框架，也自然承接上下文对衰老之日的描写。
- source_word: יָזֻעוּ
  choice: 发颤
  rationale: 准确表达身体颤抖，并符合本节衰老意象的语境。
- source_word: שֹׁמְרֵי הַבַּיִת
  choice: 看守房屋的
  rationale: 贴近希伯来语的房屋意象，不在正文中直接解释为手或手臂。
- source_word: הִתְעַוְּתוּ
  choice: 屈身
  rationale: 表现身体弯曲、佝偻的状态，同时避免把原文的诗性意象解释得过死。
- source_word: אַנְשֵׁי הֶחָיִל
  choice: 有力的汉子
  rationale: 保留原文阳性人物称谓和力量意味；在现代汉语中自然且具有诗歌画面感。
- source_word: בָטְלוּ
  choice: 停歇
  rationale: 表达停止活动或闲置的意思，语气适合诗体。
- source_word: הַטֹּחֲנוֹת
  choice: 推磨的
  rationale: 保留磨粮者的形象，不在正文中直接替换为“牙齿”；汉语可借“的”概括从事该动作的人。
- source_word: כִּי מִעֵטוּ
  choice: 因人数稀少
  rationale: 明确保留因果关系，并使所指为推磨者的数量减少，在汉语中清楚自然。
- source_word: חָשְׁכוּ
  choice: 昏暗起来
  rationale: 保留变得昏暗的动态结果，也与视力衰退的潜在意象相合。
- source_word: הָרֹאוֹת
  choice: 往外观看的
  rationale: 保留分词式的人物化表达，不在正文中直接认定为眼睛。
- source_word: בָּאֲרֻבּוֹת
  choice: 从窗户
  rationale: “窗户”是最直接、易懂的译法；介词“从”符合由屋内向外观看的画面。
theological_decisions:
- issue: 是否在正文中明确解开房屋与人体的寓意对应
  choice: 保留看守房屋、壮汉、推磨者和观看者等诗性意象
  alternative: 把这些形象分别直译为手臂或双手、双腿、牙齿和眼睛
  rationale: 原文很可能借整座房屋的景象描绘衰老，但并未明说各意象对应的身体部位；正文保留其含混性，注释说明常见理解。
- issue: אַנְשֵׁי הֶחָיִל 的性别与力量意味
  choice: 有力的汉子
  alternative: 强壮的人；壮士
  rationale: 原文使用阳性的人物称谓；“有力的汉子”既保留性别和力量意味，又不额外引入军事英雄色彩。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语，保留原文延展的房屋意象和分句节奏。以“发颤”“屈身”“停歇”“昏暗起来”形成逐步衰败的动态画面；分号表示本节仍与上下文长句相连。
