  text: וְ/סֻגְּר֤וּ דְלָתַ֨יִם֙ בַּ/שּׁ֔וּק בִּ/שְׁפַ֖ל ק֣וֹל הַֽ/טַּחֲנָ֑ה וְ/יָקוּם֙ לְ/ק֣וֹל הַ/צִּפּ֔וֹר וְ/יִשַּׁ֖חוּ כָּל בְּנ֥וֹת הַ/שִּֽׁיר־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/012/004.yaml
  text: and the doors on the street are shut when the sound of the grinding is low[a], and one rises at the sound of a bird[c][b], and all the daughters of song are brought low.
translation:
  language: zh_hans
  text: 街上的双门[a]都关上了，磨声渐低[b]；人听见鸟叫便起身[c]，歌唱的众女都被压低了[d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “双门”也可译作“两扇门”。在描绘衰老的语境中，许多解释者认为这里的门暗指嘴唇或口；原文并未明确说明这一对应。
    reason: 说明双数形式及常见但不确定的身体隐喻。
  - marker: b
    text: 也可译作“磨坊的声音渐弱”或“磨制的声音渐低”。许多解释者将此视为牙齿减少、咀嚼声变弱的意象，但这并非原文明确说明。
    reason: 保留“磨制／磨坊”之词义范围，并说明常见但不确定的身体隐喻。
  - marker: c
    text: 原文直译为“因鸟的声音而起身”。这可能描写人因轻微的声音而醒来，但原文没有明确说明原因。
    reason: 保留介词结构的字面意义，并提示可能的语境含义而不将其定论化。
  - marker: d
    text: 原文直译为“所有歌之众女”。这可能指歌女、歌唱的能力，或与歌唱有关的声音。
    reason: 说明独特诗语的字面形式及主要解释可能。
lexical_decisions:
- source_word: וְסֻגְּרוּ
  choice: 关闭
  rationale: סגר的被动完成式描述门被关上的状态；“关闭”自然、庄重，也保留原文的被动结果意味。
- source_word: דְלָתַיִם
  choice: 两扇门
  rationale: 该词为双数形式，直译为“两扇门”或“双门”。正文保留具体意象，不直接解释为嘴唇或口。
- source_word: בַּשּׁוּק
  choice: 街上的
  rationale: שׁוּק可指街道或市集；此处译作“街上”较宽泛，也自然表达面向公共空间的场景。
- source_word: בִּשְׁפַל קוֹל הַטַּחֲנָה
  choice: 磨声渐低
  rationale: שְׁפַל表示低下、减弱，טַחֲנָה指磨制或磨坊发出的声音。“磨声渐低”简洁地保留声音减弱的动态，也未断定其身体隐喻。
- source_word: וְיָקוּם
  choice: 人……便起身
  rationale: 动词为第三人称阳性单数；汉语以泛指的“人”表达未明说的主体，比强行指定“他”更妥当。
- source_word: לְקוֹל הַצִּפּוֹר
  choice: 听见鸟叫
  rationale: 原文直指“鸟的声音”。“听见鸟叫”是自然的现代汉语，同时保留单数泛指，并避免限定为悦耳的鸟鸣。
- source_word: וְיִשַּׁחוּ
  choice: 衰微了
  rationale: 该动词核心义为低下、屈身或被压低；与歌声意象相连时，“衰微”既传达减弱，也不把表达局限为身体上的弯腰。
- source_word: כָּל בְּנוֹת הַשִּׁיר
  choice: 歌唱的众女
  rationale: 原文直译为“歌之众女”。“歌唱的众女”保留其拟人化和女性复数意象，同时比生硬的“歌之女儿”更符合现代汉语。
theological_decisions:
- issue: 传道书12章衰老诗喻的具体对应
  choice: 正文保留门、磨声、鸟叫和歌唱众女等诗歌意象，不逐一落实为身体器官。
  alternative: 将“两扇门”译为嘴唇或口，将“磨声”译为牙齿咀嚼声，并将“歌唱的众女”解释为歌唱能力、听觉或声音。
  rationale: 本段通常被理解为描绘衰老，但各意象具体对应何种身体功能仍有争议。保留原文意象可避免把可能的解释写进正文。
translation_notes:
  register: 采用现代、凝练而庄重的诗体汉语；以分号呈现三个并列画面。正文尽量保留希伯来文的具象诗意，对有争议的衰老隐喻仅在脚注说明。
