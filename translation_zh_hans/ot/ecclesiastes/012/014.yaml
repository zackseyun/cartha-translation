id: ECC.12.14
reference: Ecclesiastes 12:14
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כִּ֤י אֶת כָּל מַֽעֲשֶׂ֔ה הָ/אֱלֹהִ֛ים יָבִ֥א בְ/מִשְׁפָּ֖ט עַ֣ל כָּל נֶעְלָ֑ם אִם ט֖וֹב וְ/אִם רָֽע־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/012/014.yaml
  text: For God will bring every deed into judgment[a], with every hidden thing, whether good or evil.
translation:
  language: zh_hans
  text: 因为上帝必审判一切行为[a]，连一切隐藏的事，无论是善是恶。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “连一切隐藏的事”也可译作“包括一切隐藏的事”，或“就一切隐秘的事而言”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上一节的劝诫并说明其理由；现代汉语用“因为”能自然保留这一解释性关系。
- source_word: אֶת כָּל מַעֲשֶׂה
  choice: 一切行为
  rationale: כָּל 与单数名词组合具有周遍意义。“一切行为”既涵盖每一项所行之事，也适合受审判的语境。
- source_word: הָאֱלֹהִים
  choice: 上帝
  rationale: 希伯来语带冠词的称谓在此指独一的上帝；译作“上帝”自然明确。
- source_word: יָבִא בְמִשְׁפָּט
  choice: 必审判
  rationale: 原文直译近于“必带入审判”。汉语用“必审判”简洁自然地表达使一切行为进入司法审察之意，同时以“必”体现未完成式在语境中的确定将来意义。
- source_word: עַל כָּל נֶעְלָם
  choice: 连一切隐藏的事
  rationale: נֶעְלָם 指被隐藏或不为人知之事；עַל 在此与前句的确切关系可理解为“连同、包括”或“关于”。正文采用自然的包举表达“连”，脚注保留其他可能。
- source_word: אִם טוֹב וְאִם רָע
  choice: 无论是善是恶
  rationale: 保留希伯来语涵盖全部道德范围的两极表达；“善”“恶”庄重而通俗。
theological_decisions:
- issue: 上帝审判的范围与时间
  choice: 陈明上帝审判一切行为，也不遗漏隐藏之事，但不限定审判发生的机制或时间。
  alternative: 专指末后的审判；或兼指历史中的审判与末后的审判。
  rationale: 本节强调审判的全面性，却没有明说其时间框架，因此译文不加入特定末世论解释。
- issue: 隐藏之事与行为的句法关系
  choice: 将隐藏之事理解为同样纳入审判范围。
  alternative: 将其理解为上帝就一切隐藏之事审判每项行为。
  rationale: 介词 עַל 容许“关于、就……而言”等理解，也可能在此表示附加范围；正文保持包举意义，脚注注明句法上的其他可能。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“必审判”避免生硬照译“带入审判”；“一切隐藏的事”不把范围缩窄为内心秘密。脚注标记已在正文“行为”之后标出。
