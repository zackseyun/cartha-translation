- source_word: אֵין קֵץ
  choice: 没有穷尽
  rationale: 准确表达不存在尽头或限度；“穷尽”与著书不断的语境相配，且保持庄重。
- source_word: וְלַהַג הַרְבֵּה
  choice: 研读过多
  rationale: לַהַג 是罕见词，语境指向对书卷或言语的投入、研读；正文采用最符合上下文的译法，同时以脚注保留词义不确定性。
- source_word: יְגִעַת בָּשָׂר
