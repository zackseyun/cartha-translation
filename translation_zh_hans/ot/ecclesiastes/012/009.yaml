base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/012/009.yaml
  text: And beyond that[a], because Qoheleth was wise, he still taught the people knowledge; he also weighed, searched out, and arranged many proverbs.
translation:
  language: zh_hans
  text: 此外[a]，因科希列有智慧，他还教导百姓知识；又审度、考究，编排了许多箴言。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“再者，科希列是有智慧的；他也教导百姓知识；他反复思量、仔细考察，并编排了许多箴言。”“科希列”是希伯来文称谓的音译，也可译作“传道者”或“教师”。
    reason: 开头连接语及其后关系词的句法关系可以有不同理解；“审度”和“编排”也分别反映相关动词的不同语义侧面。
lexical_decisions:
- source_word: וְיֹתֵר
  choice: 此外
  rationale: 承接上文并引出进一步的评述，简洁自然；其具体句法关系存在一定歧义，另见脚注。
- source_word: שֶׁהָיָה
  choice: 既有
  rationale: 将שֶׁ理解为带原因或背景意味的关系词；“既有智慧”既自然，也不过度强化严格的因果逻辑。
- source_word: קֹהֶלֶת
  choice: 传道者
  rationale: 作为本书核心人物的称号处理；沿用现代中文圣经读者熟悉的书名关联称谓，同时避免把它当作普通专名音译。
- source_word: חָכָם
  choice: 有智慧
  rationale: 自然表达希伯来文的谓语形容词，并保留与后文“知识”的词义区别。
- source_word: עוֹד
  choice: 还
  rationale: 表达附加和继续之意：除了自身有智慧，他也进一步教导百姓。
- source_word: לִמַּד דַּעַת אֶת הָעָם
  choice: 把知识教导百姓
  rationale: 直接保留דַּעַת“知识”，不与本节的חָכָם“智慧”混同。
- source_word: וְאִזֵּן
  choice: 衡量
  rationale: 保留该动词可能含有的称量、审度之比喻，反映编纂箴言时的审慎工作。
- source_word: וְחִקֵּר
  choice: 考察
  rationale: 表达仔细查究和探寻，适合庄重而清晰的现代汉语。
- source_word: תִּקֵּן
  choice: 整理
  rationale: 体现使之有序、编排整理的含义，而不武断限定为原创写作。
- source_word: מְשָׁלִים הַרְבֵּה
  choice: 许多箴言
  rationale: 直接、自然地表达数量和文类。
theological_decisions: []
