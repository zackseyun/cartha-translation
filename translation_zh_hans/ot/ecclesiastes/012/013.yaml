source:
  edition: WLC
  text: ס֥וֹף דָּבָ֖ר הַ/כֹּ֣ל נִשְׁמָ֑ע אֶת הָ/אֱלֹהִ֤ים יְרָא֙ וְ/אֶת מִצְוֺתָ֣י/ו שְׁמ֔וֹר כִּי זֶ֖ה כָּל הָ/אָדָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/012/013.yaml
  text: 'The end of the matter, when all has been heard: fear God and keep his commandments, for this is the whole of man.[a]'
translation:
  language: zh_hans
  text: 这件事的结论，一切都已听过：要敬畏上帝，遵守他的诫命，因为这就是人的全部。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “人的全部”也可理解为“人的全部本分”，或“这是每个人都当行的事”。
    reason: כָּל־הָאָדָם是高度凝练且有歧义的表达；脚注呈现主要可能含义，避免正文擅自限定。
lexical_decisions:
- source_word: סוֹף דָּבָר
  choice: 这件事的结论
  rationale: סוֹף在此指最终结论，דָּבָר可指所论之事；译法自然地表达全书论述收束之意。
- source_word: הַכֹּל נִשְׁמָע
  choice: 全部都听过了
  rationale: 保留נִשְׁמָע的被动形式及完成意味；“全部”可涵盖先前整段论述，而不额外指定是谁听见或宣告。
- source_word: יְרָא
  choice: 敬畏
  rationale: “敬畏”兼具敬重、畏惧与顺服的宗教语义，比单纯“害怕”更贴合希伯来语用法。
- source_word: מִצְוֹתָיו שְׁמוֹר
  choice: 遵守他的诫命
  rationale: שָׁמַר在诫命语境中指谨守、实行；现代汉语以“遵守”最为清楚自然。
- source_word: כִּי זֶה כָּל־הָאָדָם
  choice: 因为这就是人的全部
  rationale: 直译保留希伯来语简洁而开放的表达，不把原文未明说的“本分”“责任”或“意义”补入正文。
theological_decisions:
- issue: כָּל־הָאָדָם所指的范围
  choice: 人的全部
  alternative: 人的全部本分／每个人都当如此
  rationale: 原文没有“本分”等名词，也可能表达人的整体、人生之全部意义，或关乎所有人；正文保留其神学张力，脚注列出主要理解。
translation_notes:
  register: 采用现代、庄重而易懂的书面语。“上帝”对应אֱלֹהִים；句式保持箴言式的凝练。正文中的“人的全部”略显突兀，但这是为保留原文刻意的简洁与歧义。
