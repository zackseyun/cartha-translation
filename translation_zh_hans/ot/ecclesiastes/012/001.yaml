revisions:
- from: 在你年轻的日子，要记念你的创造主[a]；不要等到灾祸的日子来到，那些年岁临近，那时你会说：“我不喜欢这些年日。”
  to: 在你年轻的日子，要记念你的创造主[a]，趁着艰难的日子还没有来到、你会说“我在其中毫无喜乐”的年岁还没有临近。
  rationale: 修订以“趁着……还没有”准确而自然地表达 עַד אֲשֶׁר לֹא 的警诫性时间界限；以“艰难的日子”保留 רָעָה 所含困苦、逆境的宽泛意义；以“我在其中毫无喜乐”传达 חֵפֶץ 的个人感受，并明确“其中”回指年岁。复数词形以中性脚注保留，正文仍依语境采用单数称谓。
  reviewer_model: gpt-5.6-terra
