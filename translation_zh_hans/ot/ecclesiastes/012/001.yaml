  text: וּ/זְכֹר֙ אֶת בּ֣וֹרְאֶ֔י/ךָ בִּ/ימֵ֖י בְּחוּרֹתֶ֑י/ךָ עַ֣ד אֲשֶׁ֤ר לֹא יָבֹ֨אוּ֙ יְמֵ֣י הָֽ/רָעָ֔ה וְ/הִגִּ֣יעוּ שָׁנִ֔ים אֲשֶׁ֣ר תֹּאמַ֔ר אֵֽין לִ֥/י בָ/הֶ֖ם חֵֽפֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/012/001.yaml
  text: And remember your Creator in the days of your youth[a], before the evil days come and the years arrive of which you will say, “I have no pleasure in them.”
translation:
  language: zh_hans
  text: 在你年轻的日子，要记念你的创造主[a]，趁着艰难的日子还没有来到、你会说“我在其中毫无喜乐”的年岁还没有临近。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “创造主”在希伯来原文中为复数形式，直译为“你的创造者们”；本处按语境译为单数“你的创造主”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּזְכֹר
  choice: 要记念
  rationale: זכר的Qal祈使式要求直接劝勉；中文以“要”自然表达命令语气。句首连接词承接上文，在独立呈现本节时不机械译作“并且”。
- source_word: אֶת בּוֹרְאֶיךָ
  choice: 你的创造主
  rationale: 该词形态上是复数，但在以色列一神信仰的智慧文学语境中指独一的上帝。译作单数“创造主”可准确传达所指，同时以脚注保留特殊的复数形式。
- source_word: בִּימֵי בְּחוּרֹתֶיךָ
  choice: 在你年轻的日子
  rationale: 贴近希伯来文“在你青春的日子里”的时间意象，同时使用普通现代中文。
- source_word: עַד אֲשֶׁר לֹא יָבֹאוּ
  choice: 不要等到……来到
  rationale: 该结构在此表示应在不利事件发生以前行动；“不要等到”既保留劝诫力度，也比逐字译作“直到尚未”自然。
- source_word: יְמֵי הָרָעָה
  choice: 灾祸的日子
  rationale: רָעָה在上下文中主要指衰老所伴随的艰难、痛苦或不幸，而非专指道德邪恶；“灾祸”保留其沉重和宽泛含义。
- source_word: וְהִגִּיעוּ שָׁנִים
  choice: 那些年岁临近
  rationale: Hiphil形式表达年岁抵达、临到；“临近”与前面的未来警告衔接自然，并保留时间逼近之感。
- source_word: אֵין לִי בָהֶם חֵפֶץ
  choice: 我不喜欢这些年日
  rationale: חֵפֶץ可指喜悦、乐趣或意愿。此处表达对那些年岁的个人感受；“不喜欢”清楚自然，又不额外规定是身体享乐还是更广泛的满足。
theological_decisions:
- issue: בּוֹרְאֶיךָ的数（“创造主”或“创造者们”）
  choice: 单数“你的创造主”
  alternative: 按形态译作复数“你的创造者们”
  rationale: 尽管马所拉文本的形式是复数，本节在以色列一神信仰语境中所指仍是独一的上帝。正文采用单数以免造成多神含义，脚注则透明保留原文的复数形式。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“记念”保留智慧文学劝诫的郑重感；整体句式避免过度古雅，也不把衰老处境解释得比原文更具体。
