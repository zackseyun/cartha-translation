  text: דִּבְרֵ֤י חֲכָמִים֙ כַּ/דָּ֣רְבֹנ֔וֹת וּֽ/כְ/מַשְׂמְר֥וֹת נְטוּעִ֖ים בַּעֲלֵ֣י אֲסֻפּ֑וֹת נִתְּנ֖וּ מֵ/רֹעֶ֥ה אֶחָֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/012/011.yaml
  text: The words of the wise are like goads[a], and like firmly planted nails are the collected sayings[b]; they are given by one shepherd.
translation:
  language: zh_hans
  text: 智慧人的话好像赶牲口的刺棒；成集的言语[a]如同牢牢钉住的钉子；这些都出于一位牧者[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “成集的言语”所对应的希伯来语短语含义较难确定；也可理解为“成集之言的编集者”，或“集会的主持者”。
    reason: alternative_reading
  - marker: b
    text: “一位牧者”可能指上帝是智慧的最终来源，但原文没有明确说明这位牧者是谁。
    reason: theological_ambiguity
lexical_decisions:
- source_word: דִּבְרֵי חֲכָמִים
  choice: 智慧人的话
  rationale: 保留“话／言语”的宽泛含义，也自然表达智慧人所发出的教导。
- source_word: כַּדָּרְבֹנוֹת
  choice: 好像赶牲口的刺棒
  rationale: דָּרְבֹן指用来驱赶牲畜的尖棒；补出用途，使现代普通读者能明白这个较陌生的意象，而不限定为只赶牛。
- source_word: וּכְמַשְׂמְרוֹת נְטוּעִים
  choice: 如同牢牢钉下的钉子
  rationale: מַשְׂמְרוֹת可指钉子或木橛；נְטוּעִים字面为“栽下的”，在钉子的比喻中表示稳固安置。“牢牢钉下”在中文中自然地传达其稳固性。
- source_word: בַּעֲלֵי אֲסֻפּוֹת
  choice: 汇集的箴言
  rationale: 该短语含义困难；结合上下文，理解为被汇集的智慧言论，中文以“汇集的箴言”表达文学性集合，同时用脚注保留“汇集者／集会主持者”等可能。
- source_word: נִתְּנוּ מֵרֹעֶה אֶחָד
  choice: 都是从一位牧者而来的
  rationale: מִן强调来源，因此用“从……而来”；“一位牧者”保持小写概念和身份上的开放性。中文改用来源表达，避免生硬的“从……被赐下”。
theological_decisions:
- issue: “一位牧者”的身份
  choice: 正文不明确其身份，只译作“一位牧者”
  alternative: 将其明确解释为上帝、所罗门／传道者，或智慧教导的统一来源
  rationale: 原文没有直接说明这位牧者是谁。保留身份上的含混，既容许神学性的理解，也不把这种理解写入正文。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“赶牲口的刺棒”解释古代器具的用途；“牢牢钉下”使钉子稳固的比喻自然可感。分号呈现两组平行意象，末句归结它们共同的来源。
