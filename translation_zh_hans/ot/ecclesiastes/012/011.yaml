revisions:
- from: 智慧人的话好像赶牲口的刺棒；汇集的箴言[a]如同牢牢钉下的钉子，都是从一位牧者而来的[b]。
  to: 智慧人的话好像赶牲口的刺棒；成集的言语[a]如同牢牢钉住的钉子；这些都出于一位牧者[b]。
  rationale: 以“成集的言语”取代“汇集的箴言”，避免把原文较宽泛的智慧话语限定成格言，同时在脚注中保留该困难短语可指编集者或集会主持者的主要可能。将结尾修为“这些都出于”，使复数回指和来源关系在中文中更清晰，并保留“一位牧者”的身份含混。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T06:59:56Z'
