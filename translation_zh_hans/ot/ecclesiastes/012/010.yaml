  text: בִּקֵּ֣שׁ קֹהֶ֔לֶת לִ/מְצֹ֖א דִּבְרֵי חֵ֑פֶץ וְ/כָת֥וּב יֹ֖שֶׁר דִּבְרֵ֥י אֱמֶֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/012/010.yaml
  text: Qoheleth sought to find delightful words[b][a], and to write uprightly words of truth.
translation:
  language: zh_hans
  text: 传道者力求找到令人喜悦的话[a]，并正直地写下真实的话[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “令人喜悦的话”也可译作“可喜的话”或“合意的话”。
    reason: lexical_alternative
  - marker: b
    text: 也可理解为：“所写的是正直的话，是真实的话。”希伯来文句法简练，可有不同的连接方式。
    reason: alternative_reading
lexical_decisions:
- source_word: בִּקֵּשׁ
  choice: 力求
  rationale: 表达有目的、主动而审慎的寻求，比单纯“尝试”更能体现其文学努力。
- source_word: קֹהֶלֶת
  choice: 传道者
  rationale: 该词在中文《传道书》的书名与传统称谓中已有稳定对应；这里按称号处理，同时不进一步限定为某种教职。
- source_word: לִמְצֹא
  choice: 找到
  rationale: 直接对应不定式“寻找并获得”，现代汉语自然清楚。
- source_word: דִּבְרֵי חֵפֶץ
  choice: 悦人的话
  rationale: חֵפֶץ可指喜悦、可喜或合意；“悦人的话”保留这些范围，也符合中文表达。
- source_word: וְכָתוּב
  choice: 并……写下
  rationale: 该形式在紧凑句法中可按书写行为理解；中文补足隐含主体，使句子完整自然，但以脚注保留另一种句法分析。
- source_word: יֹשֶׁר
  choice: 正直地
  rationale: 保留“正直、端正”的伦理及形式意味，不把它窄化为仅仅“正确地”或“清楚地”。
- source_word: דִּבְרֵי אֱמֶת
  choice: 真实的话
  rationale: 既可表达内容真实，也可含话语诚实可靠之意，保留原文张力。
theological_decisions:
- issue: קֹהֶלֶת的身份称谓
  choice: 传道者
  alternative: 科赫莱特；教师；宣讲者
  rationale: 现代中文读者可自然识别“传道者”为本书文学人物的传统称号；此处不据此断定其制度性职分。
- issue: וְכָתוּב יֹשֶׁר的句法关系
  choice: 并正直地写下
  alternative: 所写的是正直的——真实的话
  rationale: 原文高度凝练，可将כָתוּב作具有动词作用的形式来理解；正文采用流畅的中文动词结构，脚注保留偏静态或结果性的分析。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“力求”体现有意识的寻求；“正直地写下”保留יֹשֶׁר兼具端正与伦理正直的意味。脚注标记依对应短语次序置于正文中。
