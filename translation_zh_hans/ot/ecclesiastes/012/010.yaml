  to: 传道者力求找到令人喜悦的话[a]，并正直地写下真实的话[b]。
  rationale: 修订“悦人的话”为“令人喜悦的话”，以更贴近חֵפֶץ的描述性语义，并避免加入“取悦人”的目的性含义。将脚注b移至后半句，并调整其措辞，使其确实说明כָתוּב יֹשֶׁר与“真实的话”之间可有的另一种紧凑句法关系。
