  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: גַּ֣ם מִ/גָּבֹ֤הַּ יִרָ֨אוּ֙ וְ/חַתְחַתִּ֣ים בַּ/דֶּ֔רֶךְ וְ/יָנֵ֤אץ הַ/שָּׁקֵד֙ וְ/יִסְתַּבֵּ֣ל הֶֽ/חָגָ֔ב וְ/תָפֵ֖ר הָֽ/אֲבִיּוֹנָ֑ה כִּֽי הֹלֵ֤ךְ הָ/אָדָם֙ אֶל בֵּ֣ית עוֹלָמ֔/וֹ וְ/סָבְב֥וּ בָ/שּׁ֖וּק הַ/סֹּפְדִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/012/005.yaml
  text: Also they are afraid of heights[a], and terrors are on the road; the almond tree blossoms, the grasshopper drags itself along, and the caper berry fails, because man is going to his eternal house[c][b], and the mourners go about in the street.
translation:
  language: zh_hans
  text: 人也怕高处，路上有惊恐的事；杏树开花[a]，蚱蜢拖着身子走[b]，刺山柑果失效了[c]。因为人正走向自己永远的家，哀哭的人在街上来往[d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “开花”所译的希伯来语动词含义困难；也可按其通常词义理解为“受轻视”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“蚱蜢也成了重担。”希伯来语表达较难确定；这意象可能指行动衰弱，也可能指年老时连极轻微的东西都成为负担。
    reason: lexical_alternative
  - marker: c
    text: 或译：“欲望也消退了。”希伯来语直指“刺山柑果”，可能借其刺激食欲的作用来描写食欲或欲望衰退。
    reason: lexical_alternative
  - marker: d
    text: “哀哭的人”可能包括受雇在公开场合为死者举哀的人。
    reason: cultural_note
lexical_decisions:
- source_word: מִגָּבֹהַּ יִרָאוּ
  choice: 怕高处
  rationale: מִן与“高处”相连，表示因高处而惧怕；在衰老的语境中，“怕高处”自然且具体。
- source_word: חַתְחַתִּים בַּדֶּרֶךְ
  choice: 路上处处令他惊恐
  rationale: חַתְחַתִּים指令人害怕的事物或危险；译文保留道路这一具体场景，并以自然汉语表达年老者出行时的恐惧。
- source_word: יָנֵאץ הַשָּׁקֵד
  choice: 杏树开花
  rationale: 动词含义困难；在一连串衰老意象中，传统所理解的“开花”最为连贯，也可能令人联想到白发。另在脚注保留较直译的可能。
- source_word: יִסְתַּבֵּל הֶחָגָב
  choice: 蚱蜢拖着身子走
  rationale: 该反身形式含义不确定；此译法传达动作衰弱迟缓的形象，同时在脚注保留“成为重担”的可能。
- source_word: תָפֵר הָאֲבִיּוֹנָה
  choice: 刺山柑也失效了
  rationale: אֲבִיּוֹנָה很可能指刺山柑的果实，古时与食欲或刺激作用相关；“失效”保留具体意象及其功能不再奏效之意。
- source_word: הָאָדָם
  choice: 人
  rationale: 此处是指走向死亡的单数、泛指的人；现代汉语用“人”既自然，也不把它误解为某一特定男性。
- source_word: בֵּית עוֹלָמוֹ
  choice: 自己永远的家
  rationale: 直译为“他永恒的家”；保留“家”的隐喻和庄严语气，不进一步界定死后的状态。
- source_word: סָבְבוּ בַשּׁוּק
  choice: 在街上来往
  rationale: סבב可指四处走动，שׁוּק可指街道或市场；这里重点是公开场所中的哀悼活动。
theological_decisions:
- issue: “人”（הָאָדָם）的泛指范围
  choice: 人
  alternative: 那人；世人
  rationale: 经文描绘一个代表所有人的个体走向死亡。“人”保留单数泛指意味，又避免将其限定为某一性别或抽象集体。
- issue: “永远的家”（בֵּית עוֹלָמוֹ）的含义
  choice: 保留原文隐喻，不明确解释为坟墓或某种特定来世观
  alternative: 永久的坟墓；长久的归宿
  rationale: 原文表达庄严而含蓄，指向死亡后的长久归宿，却没有在本句中精确说明其性质；直保隐喻可避免替经文消除神学张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语，以短句保持诗性意象的连续推进。“处处令他惊恐”补出汉语所需的指向，但不把“路上的惊恐”具体化为某类危险；“已”表现送葬哀悼仿佛迫近眼前。
