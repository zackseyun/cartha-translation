review_pass:
  verdict: revise
  source_fidelity: 原文以“在……以前”引出两个并列的未来/结果性意象：天体变暗，以及雨后云彩返回。草稿的“趁……尚未……，……之前”将两个分句拆开处理，虽可理解，但时间结构不够严整；“乌云”则比原文泛指的“云”增添了“黑暗”的色彩。
  naturalness: 改为“在……变暗，雨后云彩再度归来以前”可自然地统摄两个并列分句，且保留中文诗性和与上文相连的未竟劝勉语气。
  terminology: “太阳、光、月亮和星辰”准确保留原文并列意象；“云彩”比“乌云”更中性地对应הֶעָבִים；“再度归来”明确表达שׁוּבוּ的“返回/再来”，不额外解释意象。
  issues:
