  yaml_path: translation/ot/ecclesiastes/012/002.yaml
  text: before the sun and the light and the moon and the stars grow dark[a], and the clouds return after the rain.
translation:
  language: zh_hans
  text: 在太阳、光、月亮和星辰变暗，雨后云彩再度归来以前。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עַד אֲשֶׁר לֹא
  choice: 趁……尚未……之前
  rationale: 这一结构承接上文的劝告，表示某事发生以前；用“趁……尚未……之前”既自然，也保留及时行动的语气。
- source_word: תֶחְשַׁךְ
  choice: 变暗
  rationale: חשׁך 的 Qal 形式在此表示变得昏暗；“变暗”保留其不及物含义，避免暗示外在施动者。
- source_word: הַשֶּׁמֶשׁ וְהָאוֹר וְהַיָּרֵחַ וְהַכּוֹכָבִים
  choice: 太阳、光、月亮和星辰
  rationale: 逐项保留原文的宇宙性意象。“光”不限定为日光，以保存 אוֹר 的宽泛含义；“星辰”符合庄重诗体。
- source_word: וְשָׁבוּ
  choice: 又聚拢
  rationale: שׁוב 基本义为“返回、再来”；与“乌云”搭配时，“又聚拢”以自然汉语表达云雨过后再次出现，同时保留反复之意。
- source_word: הֶעָבִים
  choice: 乌云
  rationale: עָב 指云、密云；雨后再来的语境带有阴沉意象，译作“乌云”自然且贴合诗境。
- source_word: אַחַר הַגָּשֶׁם
  choice: 雨后
  rationale: 简洁对应“在雨之后”，并与“乌云又聚拢”构成自然汉语表达。
theological_decisions:
- issue: 天体变暗和雨后云归的意象如何解释
  choice: 正文保留诗歌意象，不明说其象征老年、感官衰退、审判或人生苦难。
  alternative: 在正文中把这些意象直接解释为衰老及接连而来的患难。
  rationale: 本节常被理解为描写衰老，但本句本身只陈述意象。保留意象可避免把一种解释写入正文，并保存经文的诗性和诠释张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话；以“趁……尚未……之前”承接上一节未完的劝告句式。保留天体和风雨意象的并列节奏，不在正文中解释其象征意义。
