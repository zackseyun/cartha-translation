  text: הֲבֵ֧ל הֲבָלִ֛ים אָמַ֥ר הַ/קּוֹהֶ֖לֶת הַ/כֹּ֥ל הָֽבֶל׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/012/008.yaml
  text: “Vapor of vapors,” says the Teacher[a]; “everything is vapor.”
translation:
  language: zh_hans
  text: “虚空的虚空！”传道者说[a]，“一切都是虚空。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “传道者”也可译作“召集者”或“教师”。这里译作“虚空”的希伯来词，原本使人想到气息或雾气，可表示短暂、空幻或难以把握；本句也可译作：“气息的气息……一切都是气息。”
    reason: 说明“传道者”这一称号的语义范围，并保留 הבל 的具体意象及可选译法；同时以“的”反映希伯来语加强式构成链。
lexical_decisions:
- source_word: הֲבֵל הֲבָלִים
  choice: 虚空中的虚空
  rationale: 保留希伯来语“X中的X”这一加强式结构，并沿用《传道书》在中文中的关键词“虚空”。此词既能指向如气息般短暂、难以把握和不实在，也不把含义局限为单纯的徒劳。
- source_word: אָמַר
  choice: 说
  rationale: 希伯来语完成式在此引出全书结尾处重申的格言式宣告；现代汉语用“说”自然简洁，也保留其鲜明的引语功能。
- source_word: הַקּוֹהֶלֶת
  choice: 传道者
  rationale: 该词在这里是称号，指向会众发言的人。“传道者”是中文读者熟悉的书名关联用语，同时不将其处理为专名。其具体角色也可理解为召集者或教师，故以脚注保留余地。
- source_word: הַכֹּל
  choice: 一切
  rationale: 表达无所不包的总体判断，符合现代汉语简洁而庄重的表达。
- source_word: הָבֶל
  choice: 虚空
  rationale: 与句首关键词保持一致。中文“虚空”兼有空幻、短暂、难以捉摸等意味，能承载原词的多义张力；脚注补明其具体意象近于气息或雾气。
theological_decisions:
- issue: 《传道书》主题词 הבל 的译法
  choice: 虚空
  alternative: 气息、雾气、徒然
  rationale: 选择中文传统且具有文学承载力的“虚空”，但不把它解释为单一的哲学虚无或道德意义上的徒然；借脚注指出原词的具体意象和多重意味，以保留全书的神学与文学张力。
- issue: הַקּוֹהֶלֶת 的身份称谓
  choice: 传道者
  alternative: 召集者、教师、哥赫列
  rationale: 原词可能涉及召集会众或向会众发言、教导的角色，语义并不完全等同于现代宗教职位。正文采用中文传统称谓，脚注说明其他理解，避免导入特定教派职分。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。正文保留原文简短、格言式的重复和加强结构；以“虚空”维持中文《传道书》的文学连贯性，同时用脚注防止读者将其误解为单一的“毫无意义”。
