base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/012/007.yaml
  text: and the dust returns to the earth as it was[a], and the spirit returns to God who gave it.
translation:
  language: zh_hans
  text: 尘土归回大地，像它从前那样；灵[a]也归回那赐给它的上帝。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“气息”。希伯来语 רוּחַ 可指“灵”“气息”或“风”；这里谈到死亡，译作“灵”较合语境，但“气息”仍是可能的译法。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָשֹׁב
  choice: 归回
  rationale: שוב在这里描写死亡时必然发生的归返；用“归回”既保留方向感，也与后半句同一动词的重复和诗意平行相呼应。
- source_word: הֶעָפָר
  choice: 尘土
  rationale: 指构成人身体的物质，保留希伯来文的创造与死亡意象，并呼应人归于尘土的传统表达。
- source_word: עַל הָאָרֶץ
  choice: 大地
  rationale: 介词与“归回”连用时表示归返的所在；אֶרֶץ直译为“地、大地”，此处译作“大地”自然，也不将其换成原文未用的“土壤”。
- source_word: כְּשֶׁהָיָה
  choice: 仍像原来一样
  rationale: 表达恢复到先前状态；“仍像原来一样”在现代汉语中清楚自然。
- source_word: וְהָרוּחַ
  choice: 灵
  rationale: רוּחַ可指灵、气息或风；在尘土与非物质生命层面的对照中，“灵”最贴合语境，但“气息”仍作为脚注中的合理译法保留。
- source_word: תָּשׁוּב
  choice: 也归回
  rationale: 与前半句的שוב同词复现，译文重复“归回”以保留平行结构；“也”自然传达两个归返动作的对应关系。
- source_word: אֶל הָאֱלֹהִים
  choice: 归回……上帝
  rationale: אֶל表示朝向；“归回……上帝”在汉语中自然表达向赐予者返回。
- source_word: אֲשֶׁר נְתָנָהּ
  choice: 赐它的
  rationale: 关系从句说明上帝是灵的赐予者；“它”照应“灵”，不额外解释赐予的方式或时间。
theological_decisions:
- issue: רוּחַ在人死亡语境中的含义
  choice: 灵
  alternative: 气息
  rationale: 本节把尘土归回大地与רוּחַ归回上帝并列，“灵”较能呈现这种对照，却不进一步规定人的构成或死后状态。由于该词也确实可指“气息”，脚注保留这一词义张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“归回”重复出现，以保留希伯来诗句的平行结构；分号突出尘土与灵的对应。
