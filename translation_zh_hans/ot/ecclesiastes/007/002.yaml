  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: ט֞וֹב לָ/לֶ֣כֶת אֶל בֵּֽית אֵ֗בֶל מִ/לֶּ֨כֶת֙ אֶל בֵּ֣ית מִשְׁתֶּ֔ה בַּ/אֲשֶׁ֕ר ה֖וּא ס֣וֹף כָּל הָ/אָדָ֑ם וְ/הַ/חַ֖י יִתֵּ֥ן אֶל לִבּֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/007/002.yaml
  text: It is better to go to a house of mourning than to go to a house of feasting[a], because that is the end of every person, and the living should take it to heart.
translation:
  language: zh_hans
  text: 到办丧事的人家去，胜过到办宴席的人家去，因为死亡是每个人的结局；活着的人应当把这事放在心上。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: טוֹב
  choice: 胜过
  rationale: 该词在本句引出比较性的智慧判断；“胜过”自然表达“更好”，并与后面的两个不定式结构顺畅衔接。
- source_word: לָלֶכֶת / מִלֶּכֶת
  choice: 去……去……
  rationale: הלך虽可指“行走”，但这里是前往并参与丧事或宴席，“去”最符合现代汉语。
- source_word: בֵּית אֵבֶל
  choice: 丧家
  rationale: 构词短语直指哀悼、治丧之处；“丧家”是简洁自然的现代汉语，既可指办丧事的人家，也保留前往哀悼场所的语境。
- source_word: בֵּית מִשְׁתֶּה
  choice: 宴乐之家
  rationale: מִשְׁתֶּה指设宴饮酒的筵席；“宴乐”兼顾饮宴与欢庆，且与“丧家”形成鲜明对照。
- source_word: בַּאֲשֶׁר
  choice: 因为
  rationale: 在此引出前述比较判断的原因，译作“因为”清楚保留因果关系。
- source_word: סוֹף כָּל הָאָדָם
  choice: 死亡是每个人的结局
  rationale: 原文直译为“这是所有人的结局”，其中“这”承接丧事所显明的死亡。汉语明说“死亡”可使指代清楚，同时“每个人”准确表达אָדָם在这里泛指全人类。
- source_word: וְהַחַי
  choice: 活着的人
  rationale: 带冠词的单数形式具有类指作用；“活着的人”自然表达所有尚在人世者。
- source_word: יִתֵּן אֶל לִבּוֹ
  choice: 应当把这事放在心上
  rationale: 希伯来语惯用语字面为“放到心里”，表示认真思想、牢记；“应当”传达智慧劝诫的语气，而非单纯预测。
theological_decisions:
- issue: אָדָם在普遍死亡陈述中的所指
  choice: 每个人
  alternative: 所有人／全人类
  rationale: 这里的אָדָם泛指人类，并非特指男性；“每个人”在现代汉语中自然、准确，也保留逐一临到所有人的普遍性。
- issue: “这是所有人的结局”中指示词的所指
  choice: 死亡是每个人的结局
  alternative: 这是每个人的结局
  rationale: 语境中的“这”可指丧家所呈现的死亡结局。正文将其明确为“死亡”，避免现代读者误把“这”理解为前往丧家这一行动，同时不改变原句论旨。
- issue: 未完成式יִתֵּן的语气
  choice: 应当……放在心上
  alternative: 会……放在心上
  rationale: 本句属于智慧劝诫，既可读为结果，也可含规范性劝告；“应当”较好传达劝诫力度，但不把它提升为宗派性教义命令。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“丧家”与“宴乐之家”保持智慧文学的对仗感；分号使死亡的普遍事实与对活人的劝诫层次清楚。
