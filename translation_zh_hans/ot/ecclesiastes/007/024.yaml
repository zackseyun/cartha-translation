  text: What has been is far off and very deep—who can find it out?[a]
translation:
  language: zh_hans
  text: 已经存在的，遥不可及，又深不可测——谁能探明呢？[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来原文直译为“又深，深”；重复“深”是为了加强语气，意思是“极其深奥”或“深不可测”。
    reason: lexical_alternative
lexical_decisions:
- source_word: רָחוֹק
  choice: 遥不可及
  rationale: 作谓语形容词，表示遥远、难以接近；“遥不可及”既保留距离隐喻，也自然传达认知上的不可企及。
- source_word: מַה שֶּׁהָיָה
  choice: 已经存在的
  rationale: 关系结构加היה完成式，可指“已经存在的”或“已经发生的”。结合上下文，这里宽泛指既成的现实或事物的秩序，译文不将其限缩为单一事件。
- source_word: וְעָמֹק עָמֹק
  choice: 又深不可测
  rationale: 原文重复“深”以加强语气；“深不可测”用自然现代汉语表达极深而难以探究的意思，原文的重复形式在脚注说明。
- source_word: מִי
  choice: 谁
  rationale: 保留疑问代词及反问语气。
- source_word: יִמְצָאֶנּוּ
  choice: 能探明呢
  rationale: מצא在此指寻找、发现或查明；“探明”适合智慧文学中对现实根本秩序的认知性探究。阳性单数后缀按其所回指的事项处理，不译成男性人物。
