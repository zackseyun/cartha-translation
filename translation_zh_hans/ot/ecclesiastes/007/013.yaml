  text: רְאֵ֖ה אֶת מַעֲשֵׂ֣ה הָ/אֱלֹהִ֑ים כִּ֣י מִ֤י יוּכַל֙ לְ/תַקֵּ֔ן אֵ֖ת אֲשֶׁ֥ר עִוְּתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/007/013.yaml
  text: Consider the work of God[a], for who can straighten what he has made crooked?
translation:
  language: zh_hans
  text: 要省察上帝的作为，因为谁能把上帝所使之弯曲的[a]变直呢？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“谁能使上帝所弯的变直呢？”
    reason: lexical_alternative
lexical_decisions:
- source_word: רְאֵה
  choice: 省察
  rationale: 这里的命令不只是要求用眼观看，而是要人留心思考；“省察”保留了智慧文学中审慎反思的语气。
- source_word: מַעֲשֵׂה
  choice: 作为
  rationale: 单数名词在这里概括上帝所做或所安排的一切；“作为”在现代汉语中自然、庄重，范围也足够宽。
- source_word: הָאֱלֹהִים
  choice: 上帝
  rationale: 此处所指是上帝，原文使用的是通称 אֱלֹהִים，并非耶和华这一专名。
- source_word: כִּי
  choice: ：
  rationale: כִּי 引出前一命令的理由。汉语用冒号衔接，更自然地呈现“省察”的内容及其根据，同时保留紧密的逻辑关系。
- source_word: מִי יוּכַל
  choice: 谁能
  rationale: 以简洁自然的反问表达能力上的不可能，保留原文的修辞力度。
- source_word: לְתַקֵּן
  choice: 使它变直
  rationale: 与后面的“使之弯曲”构成鲜明对照，保留原文具体的曲直意象，避免抽象化为“纠正”或“修复”。
- source_word: אֲשֶׁר
  choice: 他所……的
  rationale: 用现代汉语关系结构引出反问的对象，简明而自然。
- source_word: עִוְּתוֹ
  choice: 他所使之弯曲的
  rationale: 保留使役意义、曲直意象及第三人称阳性单数主语；按紧邻的“上帝的作为”，主语自然指上帝，而不改写成无人称被动。
theological_decisions:
- issue: עִוְּתוֹ 中第三人称阳性单数主语的所指及其神学张力
  choice: 明确译为“他所使之弯曲的”，其中“他”指上帝。
  alternative: 译为“已经弯曲的”，不明说施事者；或译为“他所弄弯的”。
  rationale: 紧接“上帝的作为”，原文语法和上下文都支持以上帝为主语。明译“他”既忠实于希伯来文，也保留无人能够改变上帝所安排之事的张力，不将其淡化为无人称陈述。
translation_notes:
  register: 采用现代、庄重而易懂的智慧文学语体。“省察”传达反思性的命令；“使之弯曲／使它变直”保留原文贯穿全句的具体对照。正文中的代词“他”承接“上帝”，不回避原文所呈现的神学张力。
