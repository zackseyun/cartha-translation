revisions:
- from: 要省察上帝的作为：他所使之弯曲的[a]，谁能使它变直呢？
  to: 要省察上帝的作为，因为谁能把上帝所使之弯曲的[a]变直呢？
  rationale: 修订以“因为”明确表达 כִּי 的理由关系，并将“上帝所使之弯曲的”置入“把”字结构，使现代汉语更流畅。重复“上帝”而非使用“他”，明确保留 עִוְּתוֹ 的主语所指。脚注提供“弯／变直”的简洁替代表达，不改变曲直对照或神学张力。
