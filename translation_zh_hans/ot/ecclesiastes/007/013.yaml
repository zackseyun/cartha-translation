  naturalness: “要省察”与全句庄重语体相称，但“他所使之弯曲的，谁能使它变直呢”不如“谁能把上帝所使之弯曲的变直呢”自然顺畅。
  terminology: “上帝”“作为”“弯曲”“变直”均合适，并保留原文将第三人称主语指向上帝的张力。为避免“他”的近指歧义，正文直接重提“上帝”更清楚，且不改变原意。
