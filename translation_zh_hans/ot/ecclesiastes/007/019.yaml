  text: Wisdom gives strength to a wise man more than ten rulers who were in a city[a].
translation:
  language: zh_hans
  text: 智慧使智慧人比城里的十位掌权者更有力量。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“那城中十位掌权者”。原文“城”带定冠词，可理解为特指；但这句格言似乎泛指一般情形，未必指某一座特定的城。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחָכְמָה
  choice: 智慧
  rationale: 保留抽象名词的箴言式表达；希伯来语虽有定冠词，现代汉语通常不另行标示。
- source_word: תָּעֹז
  choice: 使……得力
  rationale: 表达该动词使人强健、赋予力量的含义，也比单说“胜过”更清楚地呈现智慧对智慧人的作用。
- source_word: לֶחָכָם
  choice: 智慧人
  rationale: ל 表示受益或作用对象；“智慧人”保留单数个体指称，并符合传道书的庄重语体。
- source_word: מֵעֲשָׂרָה
  choice: 胜过……十个
  rationale: מ 在此表示比较，说明智慧所赋予的力量超过十位掌权者所代表的力量。
- source_word: שַׁלִּיטִים
  choice: 掌权者
  rationale: 该词指行使权柄、统治或管辖的人；“掌权者”既宽泛又符合城市治理的语境。
- source_word: אֲשֶׁר הָיוּ בָּעִיר
  choice: 城里的
  rationale: 用简洁自然的定语修饰“十个掌权者”；בָּעִיר 在形式上可理解为“那城里”，但本句也可能是泛指性的格言。
