  text: It is better to hear the rebuke of a wise man than to hear the song of fools[a].
translation:
  language: zh_hans
  text: 听智慧人的责备，胜过听愚昧人的歌唱。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“听智慧人的责备，胜过一个人听愚昧人的歌。”希伯来文后半句直译为“胜过一个听愚昧人的歌的人”。
    reason: 保留希伯来文第二行名词加分词结构所产生的句法差异；正文则采用自然、对称的汉语表达。
lexical_decisions:
- source_word: טוֹב
  choice: 胜过
  rationale: 该形容词在比较结构中表示“更好”；用“胜过”自然地构成现代汉语比较句。
- source_word: לִשְׁמֹעַ
  choice: 听
  rationale: 不定式表示更可取的行动；“听”简洁自然，并与后半句的 שֹׁמֵעַ 保持词语呼应。
- source_word: גַּעֲרַת
  choice: 责备
  rationale: 该词指言语上的斥责或纠正；“责备”既保留力度，也符合现代汉语智慧文学的庄重语体。
- source_word: חָכָם
  choice: 智慧人
  rationale: 希伯来文为阳性单数，指一位有智慧的人；“智慧人”保留单数人物指称，又不额外强化其性别。
- source_word: מֵאִישׁ
  choice: 胜过听
  rationale: 介词 מִן 标示比较；后接“一个听……的人”的名词—分词结构。正文按汉语习惯将两项平衡为“听……胜过听……”，具体句法另注。
- source_word: שֹׁמֵעַ
  choice: 听
  rationale: 形式上是分词“正在听／听着”；正文用动词“听”与前半句形成紧凑对称。
- source_word: שִׁיר
  choice: 歌唱
  rationale: 单数名词可指歌或歌唱之声；“歌唱”在此更自然地与“听”搭配，并可涵盖集合或泛指用法。
- source_word: כְּסִילִים
  choice: 愚昧人
  rationale: 该复数名词在智慧文学中指道德与判断上愚钝的人；“愚昧人”保留其伦理色彩，避免仅表示智力不足。
