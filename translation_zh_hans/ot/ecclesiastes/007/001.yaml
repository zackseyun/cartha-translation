  text: ט֥וֹב שֵׁ֖ם מִ/שֶּׁ֣מֶן ט֑וֹב וְ/י֣וֹם הַ/מָּ֔וֶת מִ/יּ֖וֹם הִוָּלְדֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/007/001.yaml
  text: A good name is better than good oil[a], and the day of death than the day of one's birth.
translation:
  language: zh_hans
  text: 美名胜过上好的膏油[a]；死亡之日胜过人出生之日。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“上好的香油”或“珍贵的香膏”；希伯来文直译为“上好的油”。
    reason: 说明 שֶׁמֶן טוֹב 的字面意义，并保留其可指带香气、较为贵重的油性膏抹品这一语境义。
lexical_decisions:
- source_word: טוֹב שֵׁם
  choice: 美名
  rationale: 原文直译为“好的名”，在智慧文学中指良好的名声或声誉。“美名”既保留“名”的意象，也符合现代汉语的箴言体表达。
- source_word: מִשֶּׁמֶן טוֹב
  choice: 胜过上好的膏油
  rationale: 介词 מִן 表示比较；שֶׁמֶן 是油，也可指用于膏抹、宴乐或增添香气的膏油。“上好的膏油”保留原文形象，同时比“好的油”更自然；其他语境义见脚注。
- source_word: וְיוֹם הַמָּוֶת
  choice: 死亡之日
  rationale: 保留原文定冠词所表达的泛指定表达，并采用庄重、简洁的汉语。
- source_word: מִיּוֹם
  choice: 胜过……之日
  rationale: 此处的 מִן 与前半句平行，标示比较。原文省略谓语，汉语补出“胜过”，使平行关系清楚自然。
- source_word: הִוָּלְדוֹ
  choice: 人出生
  rationale: 该词是带第三人称阳性单数后缀的不定式结构，字面为“他被生下”。此处是箴言式的泛指，译作“人出生”既传达代表性单数的意义，也避免现代汉语中不自然或可能误指特定男性的“他出生”。
theological_decisions:
- issue: 末词第三人称阳性单数后缀的代表性用法
  choice: 人出生之日
  alternative: 他出生之日
  rationale: 原文形式为第三人称阳性单数，但在智慧文学的普遍性格言中可代表一般的人。现代汉语用“人出生之日”准确表达泛指，不把经文范围无根据地限定为男性。
- issue: “死亡之日胜过出生之日”的张力
  choice: 直接保留比较，不加解释或限制
  alternative: 解释为“死得尊荣之日胜过出生之日”
  rationale: 原文以简练而尖锐的比较开启本段，没有明说死亡在何种条件下更好。译文保留这种智慧文学中的张力，不将后文可能提供的语境预先写入本节。
translation_notes:
  register: 采用现代、庄重而易懂的箴言体。“美名”与“膏油”保留原文的核心意象；两个“胜过”形成清楚的平行结构。原文 שֵׁם（名）与 שֶׁמֶן（油）有近似音响，汉语无法自然复制，故不勉强制造文字游戏。
