  yaml_path: translation/ot/ecclesiastes/007/008.yaml
  text: The end of a matter is better than its beginning[a]; patience is better than a proud spirit.
translation:
  language: zh_hans
  text: 一件事的结局胜过它的开端；耐心[a]胜过心高气傲。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“长的灵（或心）”，是指有耐心、能宽忍，也可指不轻易发怒。
    reason: 保留希伯来语习语的字面意象及其语义范围。
lexical_decisions:
- source_word: אַחֲרִית
  choice: 结局
  rationale: 该词可指末后、终局或结果；“结局”既保留与“开端”的时间性对照，也容许包含最终结果的含义。
- source_word: דָּבָר
  choice: 一件事
  rationale: 该词语义广泛，可指话语、事物或事情；本节谈论一件事情从开端到结局的过程，“一件事”自然且切合语境。
- source_word: מֵרֵאשִׁיתוֹ
  choice: 胜过它的开端
  rationale: 介词 מִן 在比较结构中表示“胜过／比……更好”；第三人称单数后缀回指前面的“事”。
- source_word: אֶרֶךְ רוּחַ
  choice: 恒久忍耐
  rationale: 该希伯来语习语直译为“灵长”，表示有耐心、能忍耐，也可含不轻易发怒之意；正文采用清楚自然的现代汉语，脚注保留字面意象。
- source_word: מִגְּבַהּ רוּחַ
  choice: 胜过心高气傲
  rationale: 该短语描写人的心灵高傲；“心高气傲”是自然的现代汉语，并保留内在态度而非仅指外在行为。
- source_word: טוֹב
  choice: 胜过
  rationale: 两处 טוֹב 都处于比较结构中，中文用“胜过”比直译为“好”更自然明确。
