  yaml_path: translation/ot/ecclesiastes/007/022.yaml
  text: For your heart knows that many times you yourself have also cursed others[a].
translation:
  language: zh_hans
  text: 因为你心里也知道，许多次你自己也曾咒骂别人[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“辱骂别人”或“说别人的坏话”。这个希伯来语动词可指用言语咒诅；但按上下文，也可能较广泛地指侮辱或说人坏话。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上一节的劝告并说明理由；现代汉语用“因为”清楚自然。
- source_word: פְּעָמִים רַבּוֹת
  choice: 许多次
  rationale: 较贴近希伯来语“许多时候／次数”的表达，并保留反复发生之意。
- source_word: יָדַע לִבֶּךָ
  choice: 你心里知道
  rationale: “心”在希伯来语中指人的内在认知与良知；译作“心里知道”既保留意象，又符合现代汉语习惯。
- source_word: גַּם אַתָּה
  choice: 你自己也
  rationale: 独立代词与“也”共同加强语气，指出听者本人同样做过此事。
- source_word: קִלַּלְתָּ
  choice: 曾咒骂
  rationale: 该动词可指以言语咒诅或辱骂；“咒骂”保留其言语行为和较强烈的贬斥色彩，“曾”表达完成体在此处的经验性回顾。
- source_word: אֲחֵרִים
  choice: 别人
  rationale: 自然简洁地表达不特定的其他人。
