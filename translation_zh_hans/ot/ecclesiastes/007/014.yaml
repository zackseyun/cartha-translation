- from: 顺境时，要享受美好；逆境时，要思想：这一样和那一样都是上帝所造的，为使人无法查明自己以后会发生的事。[a]
  to: 顺境时，要欢喜；逆境时，要思想：上帝造了彼此相对的这两样，为要使人不能查明日后会发生什么事。[a]
  rationale: 修订仅改善现代汉语的自然度和指代清晰度：“欢喜”直接传达在顺境中积极回应的祈使；“彼此相对的这两样”保留לְעֻמַּת的对应／对照意味，并继续明确上帝对两种处境的作为；“日后”避免生硬的“自己以后”，脚注则保留אַחֲרָיו关于未来或身后之事的真实歧义。
