  text: בְּ/י֤וֹם טוֹבָה֙ הֱיֵ֣ה בְ/ט֔וֹב וּ/בְ/י֥וֹם רָעָ֖ה רְאֵ֑ה גַּ֣ם אֶת זֶ֤ה לְ/עֻמַּת זֶה֙ עָשָׂ֣ה הָֽ/אֱלֹהִ֔ים עַל דִּבְרַ֗ת שֶׁ/לֹּ֨א יִמְצָ֧א הָֽ/אָדָ֛ם אַחֲרָ֖י/ו מְאֽוּמָה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/007/014.yaml
  text: 'In a day of prosperity[a], be joyful; and in a day of adversity, consider: God has made the one as well as the other[c][b], so that man may not find out anything that will come after him.'
translation:
  language: zh_hans
  text: 顺境时，要欢喜；逆境时，要思想：上帝造了彼此相对的这两样，为要使人不能查明日后会发生什么事。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “日后”直译作“在他之后”；原文也可指一个人身后所发生的事。
    reason: alternative_reading
lexical_decisions:
- source_word: בְּיוֹם טוֹבָה
  choice: 顺境时
  rationale: “日子”与抽象名词连用可指某种时期或处境；טוֹבָה在此与逆境相对，指有利、亨通的处境。
- source_word: הֱיֵה בְטוֹב
  choice: 要享受美好
  rationale: 这是较难直译的习语，字面近似“处于美好之中”；译为“享受美好”既自然，也保留对顺境作积极回应的劝勉。
- source_word: וּבְיוֹם רָעָה
  choice: 逆境时
  rationale: רָעָה在此并非道德意义的邪恶，而是灾祸、患难或不利处境，与前句形成对照。
- source_word: רְאֵה
  choice: 要思想
  rationale: ראה在这里不只是视觉上的“看”，而是要求人留意并反思随后关于上帝作为的陈述。
- source_word: גַּם אֶת־זֶה לְעֻמַּת זֶה
  choice: 这一样和那一样
  rationale: 保留原文“这—那”的对应结构，指上文的顺境和逆境彼此相对而并列。
- source_word: עָשָׂה הָאֱלֹהִים
  choice: 都是上帝所造的
  rationale: 明确保留原文把两种处境都归于上帝作为的表述，不将其弱化为仅仅容许或利用。
- source_word: עַל דִּבְרַת שֶׁלֹּא יִמְצָא
  choice: 为使……无法查明
  rationale: עַל דִּבְרַת在此引出目的或结果；מצא表示发现、查明。
- source_word: הָאָדָם
  choice: 人
  rationale: 这里是代表全人类的集合性、泛指用法；现代汉语“人”自然保留其单数泛指意义，无须加入性别。
- source_word: אַחֲרָיו מְאוּמָה
  choice: 自己以后会发生的事
  rationale: אַחֲרָיו可指“在他之后”，语义可能是个人未来，也可能更宽泛地指身后之事；正文采用上下文中自然的未来指向，并以脚注保留歧义。
theological_decisions:
- issue: 上帝与顺境、逆境的关系
  choice: 这一样和那一样都是上帝所造的
  alternative: 上帝使这一样与那一样彼此对应
  rationale: 原文直接以עשה描述上帝对两种相反处境的作为。译文保留其神学张力，不另行解释上帝造成逆境的方式或目的。
- issue: אַחֲרָיו的时间指向
  choice: 自己以后会发生的事
  alternative: 在他之后的任何事
  rationale: 上下文强调人不能掌握未来，但原词也可能涵盖一个人身后发生的事；脚注说明这一真实歧义，避免在正文中过度展开。
translation_notes:
  register: 采用现代、庄重而通顺的普通话。“顺境／逆境”凝练呈现智慧文学的对照；“要享受美好／要思想”保留两个祈使语气。脚注标记置于所解释的末句之后。
