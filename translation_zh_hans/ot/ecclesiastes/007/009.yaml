base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/007/009.yaml
  text: Do not be quick in your spirit to become angry[a], for anger rests in the bosom of fools.
translation:
  language: zh_hans
  text: 不要在心里急着动怒，因为怒气停留在愚昧人的怀中[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译作“膝上”。希伯来语的画面是：怒气安顿在愚昧人贴身之处，亲近其内在。
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּבַהֵל
  choice: 急着
  rationale: 此处在 אַל 引导的禁令中，表示仓促、急切；结合后面的“动怒”，指人太快进入愤怒状态，而非惊慌。
- source_word: בְּרוּחֲךָ
  choice: 心里
  rationale: רוּחַ 在此指人的内在性情或内在自我。“心里”是现代汉语中自然易懂的表达，也避免把这里误解为风、气息或专门的神学术语。
- source_word: לִכְעוֹס
  choice: 动怒
  rationale: 该不定式表达进入愤怒状态；“动怒”简洁地保留了这种起始意味。
- source_word: כִּי
  choice: 因为
  rationale: 引出前一句禁令的理由，符合希伯来语论证关系和现代汉语习惯。
- source_word: כַעַס
  choice: 怒气
  rationale: 与前句“动怒”相呼应，并适合在后句中作为“停留”的主语。
- source_word: בְּחֵיק
  choice: 在……怀中
  rationale: חֵיק 可指怀中或膝上，形象地表示把某物留在贴近自身之处；“怀中”保留了这一具体意象。
- source_word: כְּסִילִים
  choice: 愚昧人
  rationale: 这是智慧文学中常见的道德与认知评价语；“愚昧人”比单纯指智力不足的“笨人”更准确。
- source_word: יָנוּחַ
  choice: 停留
  rationale: נוח 可指安歇、落定或留驻。“停留”保留怒气在愚昧人里面安顿下来、并非转瞬即逝的含义。
theological_decisions:
- issue: רוּחַ 是否应译为带有专门神学色彩的“灵”
  choice: 译作“心里”，指人的内在性情
  alternative: 译作“灵里”或“在你的灵中”
  rationale: 上下文谈的是容易动怒的内在倾向，并未要求把 רוּחַ 理解为独立的灵性实体；采用日常而庄重的“心里”可避免过度神学化。
translation_notes:
  register: 采用现代、简洁而庄重的智慧文学语体。“心里急着动怒”自然呈现原文对仓促发怒的禁戒；“停留在……怀中”保留怒气安顿、久驻以及被贴身容留的意象。
