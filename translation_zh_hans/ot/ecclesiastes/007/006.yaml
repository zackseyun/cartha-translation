source:
  edition: WLC
  text: כִּ֣י כְ/ק֤וֹל הַ/סִּירִים֙ תַּ֣חַת הַ/סִּ֔יר כֵּ֖ן שְׂחֹ֣ק הַ/כְּסִ֑יל וְ/גַם זֶ֖ה הָֽבֶל־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/007/006.yaml
  text: For like the crackling of thorns under a pot[a], so is the laughter of the fool[b]; this too is vapor.
translation:
  language: zh_hans
  text: 荆棘在锅底下噼啪作响[a]，愚昧人的笑声也是如此；这也是虚空[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“荆棘在锅底下发出的声音。”希伯来文直译为“荆棘的声音”；这里按燃烧时发出的尖促爆裂声译为“噼啪作响”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文为“赫伯尔”（hebel），本义可指气息、雾气，常用来表达短暂、虚幻或难以把握；也可译为“雾气”或“徒然”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כְקוֹל הַסִּירִים
  choice: 荆棘……噼啪作响
  rationale: קוֹל本义为“声音”，结合荆棘作为燃料的语境，具体指燃烧时短促刺耳的噼啪声；译文既保留声音意象，也使比喻自然可感。
- source_word: הַסִּירִים
  choice: 荆棘
  rationale: 此复数名词指可作速燃燃料的多刺植物；“荆棘”是现代汉语中准确而常见的对应词。
- source_word: תַּחַת הַסִּיר
  choice: 在锅底下
  rationale: 直译为“在锅下面”；“锅底下”符合汉语表达，并清楚呈现燃料在炊具下燃烧的画面。
- source_word: שְׂחֹק הַכְּסִיל
  choice: 愚昧人的笑声
  rationale: שְׂחֹק可指笑声或欢笑；此处与前面的声响对应，译为“笑声”最贴切。כְּסִיל是智慧文学中兼具道德与认知含义的“愚昧人”。
- source_word: וְגַם זֶה
  choice: 这也是
  rationale: 保留原文追加判断的语气，简洁自然。
- source_word: הָבֶל
  choice: 虚空
  rationale: 该词本义涉及气息、雾气，进而表示短暂、虚幻或难以把握。“虚空”承接《传道书》的关键词用法，同时以脚注提示其具体意象与其他可能译法。
