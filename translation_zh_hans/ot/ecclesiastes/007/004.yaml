  text: לֵ֤ב חֲכָמִים֙ בְּ/בֵ֣ית אֵ֔בֶל וְ/לֵ֥ב כְּסִילִ֖ים בְּ/בֵ֥ית שִׂמְחָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/007/004.yaml
  text: The heart of the wise is in the house of mourning[a], but the heart of fools is in the house of mirth.
translation:
  language: zh_hans
  text: 智慧人的心在哀丧之家，愚昧人的心却在欢乐之家[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “欢乐”也可译作“喜乐”“欢庆”。这个希伯来词的含义较广；在这里与“哀丧”相对，可能特指欢宴作乐。
    reason: lexical_alternative
lexical_decisions:
- source_word: לֵב
  choice: 心
  rationale: 保留希伯来语的核心意象，指人的内在关注、思想取向和心志，不仅指情感。
- source_word: חֲכָמִים
  choice: 智慧人
  rationale: 复数形容词在此作名词用；“智慧人”简洁地保留智慧文学中的人物类别，也不额外限定性别。
- source_word: בֵּית
  choice: 之家
  rationale: 直译“房屋、家”，并保留“哀丧之家／欢乐之家”的对称空间意象；这里所指不一定是固定住所，也可以是举行相关活动的场所。
- source_word: אֵבֶל
  choice: 哀丧
  rationale: 该词特指哀悼，常与丧亲和治丧情境有关；“哀丧”比泛指内心感受的“悲伤”更贴近原文。
- source_word: וְ
  choice: 却
  rationale: 希伯来语连词本义可作“和”，但在这一对偶句中表达鲜明对比；“却”符合现代汉语表达。
- source_word: כְּסִילִים
  choice: 愚昧人
  rationale: 采用汉语智慧文学中自然、庄重的对应词，表达道德与判断层面的愚昧，而不只是智力不足。
- source_word: שִׂמְחָה
  choice: 欢乐
  rationale: 该词可泛指喜乐、欢欣，也可指宴乐欢庆；“欢乐”保留其较宽语义，同时在与“哀丧”对照的语境中自然带出欢宴作乐之意。
theological_decisions:
- issue: “心在某之家”的含义
  choice: 保留原文空间隐喻，不改写为“常思想”或“喜欢去”
  alternative: 智慧人关注哀丧，愚昧人只顾享乐
  rationale: 原文有意用“心在”表达内在倾向和关注所在；直保这一张力，避免把经文收窄为单一的心理活动或行为习惯。
translation_notes:
  register: 采用现代、简洁而庄重的箴言式表达。“哀丧之家／欢乐之家”保留原文平行结构和具体意象；“却”清楚呈现两类人的对照。
