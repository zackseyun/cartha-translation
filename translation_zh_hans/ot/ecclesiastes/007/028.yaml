base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/007/028.yaml
  text: 'which my soul still sought[a], but I did not find: one man among a thousand I found[b], but a woman among all these I did not find.'
translation:
  language: zh_hans
  text: 我心仍在寻求、却没有找到的事，就是：一千人中，我找到一个男人[a]；但在这些人当中，我一个女人也没有找到[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译为“一千人中有一个”。由于这里与下句“女人”对举，正文译作“一个男人”。
    reason: lexical_alternative
  - marker: b
    text: “这些人”很可能是指传道者考察范围内的整个群体；本句是在报告他的考察结果，不一定是对世上所有女性的普遍断言。
    reason: cultural_note
lexical_decisions:
- source_word: אֲשֶׁר
  choice: ……的，就是这个
  rationale: 作为关系词承接上文所寻求的事，并用现代汉语自然地引出本节后续陈述。
- source_word: עוֹד
  choice: 仍
  rationale: 表达寻求这一行动仍在继续。
- source_word: בִּקְשָׁה נַפְשִׁי
  choice: 我心里……寻求
  rationale: נֶפֶשׁ在此是指说话者内在的自我；译作“我心里”既保留希伯来语的表达色彩，也符合现代汉语习惯。
- source_word: וְלֹא מָצָאתִי
  choice: 却没有找到
  rationale: 和前面的“寻求”构成转折；“却”准确传达语境中的反差。
- source_word: אָדָם
  choice: 男人
  rationale: 本词在此与后面的“女人”直接对举，因此采用带有性别含义的译法，而不译作泛指的“人”。
- source_word: אֶחָד מֵאֶלֶף
  choice: 一千人中……一个
  rationale: 自然呈现希伯来语“从一千中一个”的数量表达和群体内寻找的语境。
- source_word: וְאִשָּׁה
  choice: 但……一个女人
  rationale: 原文连接词在语境中带有与前句对比的作用，译作“但”使汉语关系清楚。
- source_word: בְכָל אֵלֶּה
  choice: 在这一切人中
  rationale: 指说话者考察范围内的整个群体；补出“人”使现代汉语清晰，但不扩大其所指范围。
- source_word: לֹא מָצָאתִי
  choice: 连……也没有找到
  rationale: 准确表达否定，并以自然汉语突出与前句“找到一个男人”的对照。
theological_decisions:
- issue: 本节可能被理解为对所有女性的普遍评价
  choice: 按原文保留传道者对自己考察结果的直接陈述，并以“在这一切人中”限定其所述群体
  alternative: 弱化措辞以减少冒犯，或将其扩展为对所有女性的普遍道德判断
  rationale: 原文报告说话者在其考察范围内所得的结果。译文既不淡化这句带来张力的话，也不把它强化为有关所有女性的普遍教义。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“我心里”保留原文“我的性命／内在自我”的表达色彩；分号呈现“找到一个男人”与“没有找到一个女人”之间鲜明但未被解释化的对照。
