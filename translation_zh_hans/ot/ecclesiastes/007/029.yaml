  text: לְ/בַד֙ רְאֵה זֶ֣ה מָצָ֔אתִי אֲשֶׁ֨ר עָשָׂ֧ה הָ/אֱלֹהִ֛ים אֶת הָ/אָדָ֖ם יָשָׁ֑ר וְ/הֵ֥מָּה בִקְשׁ֖וּ חִשְּׁבֹנ֥וֹת רַבִּֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/007/029.yaml
  text: 'Only see this: I have found that God made man upright[b][a], but they have sought out many schemes.'
translation:
  language: zh_hans
  text: 不过你看，这一点我发现了：上帝造人[a]本是正直的，他们却寻求许多计谋[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “人”也可译作“人类”。这里的希伯来语单数名词泛指全人类。
    reason: alternative_reading
  - marker: b
    text: “计谋”也可译作“筹算”、“构想”或“计划”。
    reason: lexical_alternative
lexical_decisions:
- source_word: לְבַד רְאֵה זֶה מָצָאתִי
  choice: 看哪，我只发现了这一点
  rationale: לְבַד限定并总结所得结论；רְאֵה是唤起注意的命令语。合译既保留原文的直接语气，也符合现代汉语表达。
- source_word: עָשָׂה ... אֶת־הָאָדָם יָשָׁר
  choice: 造人本是正直的
  rationale: הָאָדָם在这里泛指人或人类；יָשָׁר本义为正直、端正，在本节带有明显的道德含义。“本是”自然表达受造时的状态，但不额外规定这种状态后来如何改变。
- source_word: הָאֱלֹהִים
  choice: 上帝
  rationale: 在本语境中是对以色列之上帝的标准称呼；“上帝”庄重且为现代普通读者熟悉。
- source_word: וְהֵמָּה
  choice: 他们却
  rationale: 复数代词回指前面集合意义的“人”；“却”准确表达与上帝所造之正直状态的转折对照。
- source_word: בִּקְשׁוּ
  choice: 寻求
  rationale: 保留动词“寻求、探求”的基本意义，也呈现人的主动追逐，而不直接改译为“发明”或“设计”。
- source_word: חִשְּׁבֹנוֹת רַבִּים
  choice: 许多计谋
  rationale: חִשְּׁבֹנוֹת可指筹算、构想、计划或计谋。上下文将其与“正直”对置，因此“计谋”能传达带有负面色彩的人为筹划，同时以脚注保留词义范围。
theological_decisions:
- issue: הָאָדָם是泛指单数还是集合意义的人类
  choice: 人
  alternative: 人类
  rationale: “人”在现代汉语中既可指个体，也可泛指全人类，因而保留希伯来文单数形式及其集合意义；脚注说明“人类”这一明确译法。
- issue: 正直与许多计谋之间的关系
  choice: 以“本是……却……”呈现对照
  alternative: 原是……而他们……
  rationale: 原文明确对比上帝的创造与人类后来的寻求，但没有进一步说明罪如何起源或正直如何丧失；译文只保留这一张力，不加入特定教义解释。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“看哪”保留智慧文学中直接唤起读者注意的语气；全句维持原文从单数集合名词“人”转为复数代词“他们”的表达。
