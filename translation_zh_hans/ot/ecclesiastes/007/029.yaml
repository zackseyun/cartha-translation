  naturalness: 整体庄重通顺。“看哪”可用，但“不过你看”在现代标准书面汉语中更自然，也较准确地表达该句的总结、提示功能。
  terminology: “上帝”“正直”均合宜。“许多计谋”可表达上下文中的负面倾向，但原词本身也可指筹算、计划或构想；脚注应保留这些较中性的可能性。“人”作为泛指与后文“他们”的集合回指可成立。
