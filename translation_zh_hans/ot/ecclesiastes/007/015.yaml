  to: 在我虚空的年日中[a]，我见过这一切：有义人在正直中灭亡[b]，也有恶人在邪恶中长久活着[c]。
  rationale: 修订仅改善现代汉语的语序和搭配。“在正直中／在邪恶中”继续对应原文两个平行的ב介词短语，保留其可表示处境、关联、让步或其他关系的开放性；脚注明确替代性理解而不在正文裁定。
