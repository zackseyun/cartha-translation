  naturalness: “我在自己虚空的一生中，这一切都见过”语序略显倒置且“自己”冗余。“在我虚空的年日中，我见过这一切”更符合现代庄重书面语。“在……中灭亡”仍略文言化，但在本节格言式、诗性语境中可接受；用“正直／邪恶”改善搭配。
  terminology: “虚空”适合作为הֶבֶל在《传道书》中的主题词；“义人／恶人”也可保留。将“他的义／他的恶”在正文中调整为“正直／邪恶”，不改变其道德范畴，也避免中文里“在他的恶中”的不自然表达。
