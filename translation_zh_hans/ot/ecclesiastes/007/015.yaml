  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: אֶת הַ/כֹּ֥ל רָאִ֖יתִי בִּ/ימֵ֣י הֶבְלִ֑/י יֵ֤שׁ צַדִּיק֙ אֹבֵ֣ד בְּ/צִדְק֔/וֹ וְ/יֵ֣שׁ רָשָׁ֔ע מַאֲרִ֖יךְ בְּ/רָעָתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/007/015.yaml
  text: 'I have seen it all in the days of my vanity: there is a righteous man perishing in his righteousness[c][b][a], and there is a wicked man prolonging his life in his evil.'
translation:
  language: zh_hans
  text: 在我虚空的年日中[a]，我见过这一切：有义人在正直中灭亡[b]，也有恶人在邪恶中长久活着[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “虚空”所译的希伯来语是הֶבֶל，也可理解为“短暂无常”或“如气息般消逝”。这是《传道书》的关键词，包含短暂、难以捉摸和令人受挫等意味。
    reason: lexical_alternative
  - marker: b
    text: 或译：“义人尽管正直，仍然灭亡。”原文也可理解为“因他的正直而灭亡”；这里保留其歧义。
    reason: alternative_reading
  - marker: c
    text: 或译：“恶人尽管邪恶，仍然长寿”，又或：“在邪恶中延长年日。”
    reason: alternative_reading
lexical_decisions:
- source_word: אֶת הַכֹּל רָאִיתִי
  choice: 这一切都见过
  rationale: 表达传道者回顾亲身观察所得；“这一切”保留概括范围，又自然承接下文列举的两种反常现象。
- source_word: בִּימֵי הֶבְלִי
  choice: 在自己虚空的一生中
  rationale: “虚空”保留הֶבֶל在《传道书》中的主题性用语；“一生”按“我的年日”在此所指的生命历程自然表达，避免把“虚空”误解为道德上的虚荣。
- source_word: יֵשׁ ... וְיֵשׁ
  choice: 有……也有……
  rationale: 保留希伯来文并列呈现两个观察实例的平衡结构，符合现代汉语格言式表达。
- source_word: צַדִּיק
  choice: 义人
  rationale: 准确表达阳性单数实体化形容词；“义人”是自然、庄重且通行的中文圣经用语。
- source_word: אֹבֵד
  choice: 灭亡
  rationale: 该分词可指走向毁灭、丧亡，不宜仅限缩为当下死亡；“灭亡”保留其较宽的语义。
- source_word: בְּצִדְקוֹ
  choice: 在他的义中
  rationale: 较形式地保留介词ב的弹性，不武断判定为“尽管有义”或“因为行义”。
- source_word: רָשָׁע
  choice: 恶人
  rationale: 与“义人”形成原文鲜明而对称的代表性个体。
- source_word: מַאֲרִיךְ
  choice: 长久活着
  rationale: 传达使生命延长、长久存活之意，使用现代汉语中清楚自然的表达。
- source_word: בְּרָעָתוֹ
  choice: 在他的恶中
  rationale: 与“在他的义中”保持平行，并保留介词可能表示处境、让步或关联的歧义。
theological_decisions:
- issue: הֶבְלִי在本节中的含义
  choice: 译作“虚空的一生”，指传道者短暂、难以把握且令人困惑的生命历程。
  alternative: “短暂无常的一生”或“如气息般消逝的一生”
  rationale: “虚空”维持全书关键词的一致性，但不能理解为自负或虚荣；脚注说明其短暂、飘忽和挫折感。
- issue: בְּצִדְקוֹ与בְּרָעָתוֹ中介词ב的作用
  choice: 译作“在他的义中”与“在他的恶中”，不消除原文歧义。
  alternative: “尽管他是义人／尽管他作恶”，或“因他的义／因他的恶”
  rationale: 原文可能描述所处状态，也可能带有让步或工具、原因意味。直译式表达避免加入原文没有明确断定的因果神学主张。
- issue: 义人灭亡、恶人长寿的神学张力
  choice: 直接保留传道者对现实中反常结局的观察。
  alternative: 补明这是表面现象，或预先以终末审判解释
  rationale: 本节本身让智慧传统所期待的报应秩序与实际经验保持张力；译文不应替经文提前化解。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“义人／恶人”保持格言式对称；“虚空”保留《传道书》的主题词，并以脚注防止现代读者误解为虚荣。两个“在……中”刻意对应，以保存希伯来文介词结构及其神学张力。
