  text: אַל תְּהִ֤י צַדִּיק֙ הַרְבֵּ֔ה וְ/אַל תִּתְחַכַּ֖ם יוֹתֵ֑ר לָ֖/מָּה תִּשּׁוֹמֵֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/007/016.yaml
  text: Do not be overly righteous[a], and do not make yourself too wise[b]. Why should you ruin yourself?
translation:
  language: zh_hans
  text: 不要过分为义[a]，也不要过于自作聪明。何必自取毁灭呢？[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“不要过分自以为义。”原文只说“过分为义”，没有说明这种过分具体是指自以为义、刻意显出为义，还是其他形式的过度。
    reason: 保留צַדִּיק הַרְבֵּה的较直译表达及其解释上的开放性。
  - marker: b
    text: 或译：“何必使自己荒凉？”或“何必使自己惊骇？”原文动词可含荒凉、毁坏或惊骇之意。
    reason: 说明תִּשּׁוֹמֵם的词义范围，并保留其自我承受后果的意味。
lexical_decisions:
- source_word: אַל תְּהִי
  choice: 不要
  rationale: 否定词与未完成式连用，表达劝戒或禁令；“不要”自然保留警告语气。
- source_word: צַדִּיק הַרְבֵּה
  choice: 过分自以为义
  rationale: צַדִּיק意为“义、正直”，הַרְבֵּה在此标示过度。结合下句反身意味，译作“过分自以为义”传达自我认定为义的可能含义，但以脚注保留更直译的理解。
- source_word: וְאַל תִּתְחַכַּם יוֹתֵר
  choice: 也不要自作聪明过了头
  rationale: תִּתְחַכַּם是חכם的Hitpael形式，带反身意味；“自作聪明”自然表达使自己显得聪明或自认为聪明，יוֹתֵר译为“过了头”以标示过度。
- source_word: לָמָּה
  choice: 何必……呢
  rationale: 引出带劝戒意味的反问；现代汉语“何必……呢”简洁自然。
- source_word: תִּשּׁוֹמֵם
  choice: 使自己落得荒凉
  rationale: שמם可指荒凉、毁坏，也可指惊骇。该形式和语境容许结果落在主体自身；“落得荒凉”保留原词意象，不把歧义完全收窄为“毁掉自己”。
theological_decisions:
- issue: “过分为义”和“过度有智慧”的警告应如何理解
  choice: 正文采用“过分自以为义”和“自作聪明过了头”，呈现对自我标榜及过度追求的警戒。
  alternative: 直译为“不要过分为义，也不要使自己过于聪明”，或理解为对一切高度正义和智慧的限制。
  rationale: הַרְבֵּה和יוֹתֵר明确带出程度问题，但原文并未详明这种“过分”具体指什么。正文采用自然汉语表达，同时用脚注保留较形式对应的译法，以免把经文的张力解释殆尽。
- issue: תִּשּׁוֹמֵם所指的后果
  choice: 译为“使自己落得荒凉”，保留荒废、毁坏的意象。
  alternative: “毁掉自己”或“使自己惊骇”。
  rationale: 该词根语义范围包括荒凉、毁灭和惊骇；上下文倾向负面的自我后果，但不足以完全排除其他词义，因此正文保留较宽的意象，并在脚注说明。
translation_notes:
  register: 采用现代、庄重而易懂的劝诫语体。“过了头”“何必……呢”符合当代普通话；“落得荒凉”刻意保留希伯来文较突兀的荒凉意象。所有脚注标记均已在正文出现。
