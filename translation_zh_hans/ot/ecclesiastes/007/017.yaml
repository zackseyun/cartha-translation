base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/007/017.yaml
  text: Do not be excessively wicked, and do not be a fool. Why should you die before your time?
translation:
  language: zh_hans
  text: 不要过度作恶[a]，也不要作愚昧人。你何必不到时候[b]就死呢？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“不要作恶太多。”希伯来文含有表示程度的词，使本句与上下文形成刻意的张力；这并不是认可任何程度的恶。
    reason: lexical_alternative
  - marker: b
    text: 直译：“不在你的时候。”意思是未到你合宜或通常预期的时候。
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּרְשַׁע
  choice: 作恶
  rationale: רשע 的 Qal 形式在此指邪恶的行为或表现；“作恶”在现代汉语中自然明确，也保留其道德含义。
- source_word: הַרְבֵּה
  choice: 过度
  rationale: 此程度副词修饰前面的禁令。“过度”保留希伯来文刻意造成的程度张力，不把原文改写成绝对禁令，也不表示认可任何程度的恶。
- source_word: תְּהִי סָכָל
  choice: 作愚昧人
  rationale: היה 加名词 סָכָל 表示成为或充当愚昧人。“作愚昧人”保留名词性表达，并与智慧文学的道德—实践范畴相符。
- source_word: לָמָּה
  choice: 何必
  rationale: 引出带劝诫意味的反问；“何必”简洁自然地传达这种修辞力量。
- source_word: תָמוּת
  choice: 就死
  rationale: מות 的 Qal 未完成式在反问中警告死亡后果；配合“何必……就死呢”构成自然的现代汉语。
- source_word: בְּלֹא עִתֶּךָ
  choice: 不到时候
  rationale: 字面为“在并非你的时候”，指在合宜或预期的时刻以前；“不到时候”既自然，又避免把“时候”明确解释为神所指定的日期。
theological_decisions:
- issue: 本节是否像是在认可有限度的恶
  choice: 保留“过度”这一程度用语及其修辞张力，但不将其表述为对适度作恶的许可。
  alternative: 译成“绝不可作恶”以消除张力，或译成“不要太坏”而更容易被理解为可以适度作恶。
  rationale: 希伯来文明确含有程度副词 הַרְבֵּה，并与上节的措辞形成呼应。传道书常用尖锐、带张力的智慧格言，因此译文应保留这种张力，不以神学推断代替原文，也不暗示任何程度的邪恶是可取的。
- issue: “你的时候”是否指神预定的死期
  choice: 译为“不到时候”，仅表达早于合宜或预期的时刻。
  alternative: 译为“未到你命定的时候”，明确加入神所预定之意。
  rationale: 原文只有“你的时候”，并未明说“命定”；译文不应加入原文未明确表达的神学限定。
translation_notes:
  register: 采用现代、庄重而通俗的智慧文学语体。“作恶过度”保留原文不寻常的程度表达；“作愚昧人”保留名词性判断；末句以“何必……呢”呈现劝诫性的反问。脚注标记均置于正文相应位置。
