  yaml_path: translation/ot/ecclesiastes/007/021.yaml
  text: Also[a], do not give your heart to every word that is spoken[b], lest you hear your servant cursing you.
translation:
  language: zh_hans
  text: 人所说的一切话，你也不要放在心上，免得听见你的仆人[a]咒骂你。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “仆人”也可译为“奴隶”或“奴仆”；希伯来文 עֶבֶד 可指仆人或奴隶，具体含义须视语境而定。
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: 也
  rationale: 保留其承接上下文、增添一层劝诫的语气；置于“不要”之前符合现代汉语表达。
- source_word: לְכָל הַדְּבָרִים אֲשֶׁר יְדַבֵּרוּ
  choice: 凡人所说的一切话
  rationale: דְּבָרִים 在此由“听见”限定为言语；第三人称复数动词主语未明，译作泛指的“人”，既自然又不指定特定群体。
- source_word: אַל תִּתֵּן לִבֶּךָ
  choice: 不要放在心上
  rationale: 希伯来文直译为“不要把你的心交给”，意为不要让所听见的话占据内心或过分介意；“不要放在心上”保留“心”的意象，也符合现代汉语习惯。
- source_word: אֲשֶׁר לֹא תִשְׁמַע
  choice: 免得听见
  rationale: 此处关系词引出的分句在禁令之后表达应避免的结果；“免得”简洁保留警戒意味。
- source_word: עַבְדְּךָ
  choice: 你的仆人
  rationale: עֶבֶד 可指仆人或奴隶；本节重点在其从属身份而非具体法律地位，正文采用较宽泛且庄重的“仆人”。
- source_word: מְקַלְלֶךָ
  choice: 咒骂你
  rationale: קלל 在此表示咒诅、辱骂或轻蔑地说坏话；“咒骂”兼顾其强烈言语攻击的含义。
