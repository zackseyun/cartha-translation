- from: 我发现，有一个女人比死亡更苦：她的心是圈套和罗网[a]，她的手是锁链。在上帝面前为善的人必逃脱她[b]，犯罪的人却必被她捕获。
  to: 我发现，那女人比死亡更苦；她的心是圈套和罗网[a]，她的手是锁链。在上帝面前为善的人必从她那里逃脱[b]，犯罪的人却必被她捕获。
