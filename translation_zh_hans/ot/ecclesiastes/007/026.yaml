  - severity: low
    issue: “必逃脱她”在现代汉语中宾语关系略显生硬。
    rationale: יִמָּלֵט מִמֶּנָּה 明示“从她”逃脱；“必从她那里逃脱”更自然且不增添原文没有的“她的手”等内容。
