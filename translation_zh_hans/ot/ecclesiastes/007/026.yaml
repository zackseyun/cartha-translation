id: ECC.7.26
reference: Ecclesiastes 7:26
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וּ/מוֹצֶ֨א אֲנִ֜י מַ֣ר מִ/מָּ֗וֶת אֶת הָֽ/אִשָּׁה֙ אֲשֶׁר הִ֨יא מְצוֹדִ֧ים וַ/חֲרָמִ֛ים לִבָּ֖/הּ אֲסוּרִ֣ים יָדֶ֑י/הָ ט֞וֹב לִ/פְנֵ֤י הָ/אֱלֹהִים֙ יִמָּלֵ֣ט מִמֶּ֔/נָּה וְ/חוֹטֵ֖א יִלָּ֥כֶד בָּֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/007/026.yaml
  text: And I find more bitter than death the woman whose heart is traps and nets[a], and whose hands are chains. The one who is good before God will escape from her[b], but the sinner will be caught by her.
translation:
  language: zh_hans
  text: 我发现，那女人比死亡更苦；她的心是圈套和罗网[a]，她的手是锁链。在上帝面前为善的人必从她那里逃脱[b]，犯罪的人却必被她捕获。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“她的心是陷阱和网罗。”
    reason: lexical_alternative
  - marker: b
    text: 或译：“蒙上帝喜悦的人必从她那里逃脱。”
    reason: alternative_reading
lexical_decisions:
- source_word: וּמוֹצֶא אֲנִי
  choice: 我发现
  rationale: 分词结构带明确主语，可表达传道者在论述中的当下观察；“我发现”自然且保留第一人称。
- source_word: מַר מִמָּוֶת
  choice: 比死亡更苦
  rationale: 形容词加 מִן 构成比较，直译为“比死亡更苦”，保留原文强烈而凝练的比较。
- source_word: הָאִשָּׁה
  choice: 一个女人
  rationale: 希伯来语虽有定冠词，但此处描写的对象究竟是特定人物、某种类型还是拟人化形象并不明确；现代汉语用“有一个女人”可自然引出后面的限定描述，又不泛化为所有女人。
- source_word: מְצוֹדִים וַחֲרָמִים
  choice: 圈套和罗网
  rationale: 两词都属于捕捉意象；“圈套和罗网”清楚鲜明，并维持两种捕获工具的并列。
- source_word: לִבָּהּ
  choice: 她的心是圈套和罗网
  rationale: 保留“心”这一原文意象，不改写为思想、意图或欲望。
- source_word: אֲסוּרִים יָדֶיהָ
  choice: 她的手是锁链
  rationale: אֲסוּרִים 指捆绑物或束缚；“锁链”具体易懂，也与圈套、罗网的捕获意象相呼应。
- source_word: טוֹב לִפְנֵי הָאֱלֹהִים
  choice: 在上帝面前为善的人
  rationale: 较贴近字面“在上帝面前是善的”，同时采用自然现代汉语；不在正文中直接解释为“蒙上帝喜悦”。
- source_word: יִמָּלֵט מִמֶּנָּה
  choice: 必逃脱她
  rationale: מלט 的 Nifal 形式表示逃脱或获救；这里以“逃脱她”承接全句捕获意象。
- source_word: וְחוֹטֵא
  choice: 犯罪的人却
  rationale: 分词作名词用，译作“犯罪的人”既自然，也保留与前句人物的道德对照；וְ 在这里表达转折。
- source_word: יִלָּכֶד בָּהּ
  choice: 必被她捕获
  rationale: לכד 的被动形式意为被捉住或捕获；“被她捕获”明确呈现被动关系，并延续圈套、罗网的意象。
theological_decisions:
- issue: 如何处理本节对“女人”的单数描写
  choice: 保留单数“一个女人”，不扩大为对所有女人的概括，也不在正文中认定她是淫妇或愚昧的拟人化
  alternative: “那女人”；“淫荡的女人”；“拟人化的愚昧”
  rationale: 原文以单数和定冠词描写这一形象，但其确切身份并未明说。中文正文应保留这种张力，不作普遍化，也不把某一种解释写进经文。
- issue: 如何理解 טוֹב לִפְנֵי הָאֱלֹהִים
  choice: 在上帝面前为善的人
  alternative: 蒙上帝喜悦的人
  rationale: 原文可按惯用语理解为蒙上帝喜悦，但字面核心是“在上帝面前为善”。正文保留较形式对应的表达，惯用意义列入脚注。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“圈套、罗网、锁链、捕获”维持贯穿全句的捕捉与束缚意象。正文避免把该女人明确解释为某类具体人物，以保留希伯来文本的含混与张力。
