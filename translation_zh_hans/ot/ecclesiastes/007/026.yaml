  naturalness: 原译整体庄重通顺。“逃脱她”虽可理解，但现代普通话中“从她那里逃脱”更完整自然，也更明确对应 מִמֶּנָּה（从她）。
  terminology: “上帝”“为善”“犯罪的人”“锁链”恰当。“圈套和罗网”能保留捕捉意象；脚注以“陷阱和网罗”提供可行的近义词替代，不把人物身份或惯用语释义写入正文。
