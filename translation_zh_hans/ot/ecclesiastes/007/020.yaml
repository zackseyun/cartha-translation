id: ECC.7.20
reference: Ecclesiastes 7:20
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כִּ֣י אָדָ֔ם אֵ֥ין צַדִּ֖יק בָּ/אָ֑רֶץ אֲשֶׁ֥ר יַעֲשֶׂה טּ֖וֹב וְ/לֹ֥א יֶחֱטָֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/007/020.yaml
  text: For there is no righteous man on the earth who does good and does not sin[a].
translation:
  language: zh_hans
  text: 因为世上没有一个义人只行善而不犯罪。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “人”原文为单数，在这里具有代表性，所表达的是关于全人类的普遍陈述。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 本词在这里承接上文并说明理由；现代汉语用“因为”能自然保留这一逻辑关系。
- source_word: אָדָם
  choice: 一个……人
  rationale: 原文是单数、泛指的“人”。译作“一个……人”既保留单数格言式表达，也自然涵盖所有人。
- source_word: אֵין
  choice: 没有
  rationale: 准确表达原文的存在否定结构，并符合现代汉语习惯。
- source_word: צַדִּיק
  choice: 义人
  rationale: “义人”是智慧文学中 צַדִּיק 的准确、简洁且具神学透明度的常用译法。
- source_word: בָּאָרֶץ
  choice: 世上
  rationale: 此处所指是普遍的人类世界，并非某一特定地域；“世上”比“地上”更自然，也避免误解为特定土地。
- source_word: אֲשֶׁר
  choice: ……的
  rationale: 用汉语定语结构连接“义人”与后续行为描述，比逐字译出关系代词更自然。
- source_word: יַעֲשֶׂה טּוֹב
  choice: 只行善
  rationale: “行善”保留原文简洁的道德含义；“只”与后面的否定共同表达原文所说持续行善且不犯罪的绝对情形，而不把它误解为义人从不行善。
- source_word: וְלֹא יֶחֱטָא
  choice: 而不犯罪
  rationale: “而不”清楚保留两个行为之间的并列兼对照关系；“犯罪”准确对应 חטא，且未额外限定罪的种类。
theological_decisions:
- issue: אָדָם 的单数泛指与性别表达
  choice: 一个……人
  alternative: 一个男人／任何人
  rationale: 希伯来文 אָדָם 在此为单数代表性用法，陈述全人类的普遍事实。现代汉语“人”本身不标性别，并非刻意中性化，同时“一 个”保留了原文的单数形式。
- issue: 义人与犯罪并置所形成的张力
  choice: 没有一个义人只行善而不犯罪
  alternative: 没有行善而从不犯罪的义人
  rationale: 译文保留“义人”这一称谓，同时明确否定世上有人完全行善而毫不犯罪，不把“义”解释成无罪，也不另行界定义人的身份基础。
translation_notes:
  register: 采用现代、庄重而简洁的格言式汉语。“因为”维系与上文的论证关系；“世上”“义人”“行善”“犯罪”均为普通读者易懂且适合智慧文学的表达。
