  text: Do not say[b][a], “Why were the former days better than these?” For it is not from wisdom that you ask this.
translation:
  language: zh_hans
  text: 不要说：“为什么从前的日子比现在的日子好？”[a] 因为你这样问，并非出于智慧。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文句式直译可作：“从前的日子比这些日子好，是为什么？”这是询问原因的表达，意思是“为什么从前的日子比现在的日子好？”
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תֹּאמַר
  choice: 不要说
  rationale: אַל与未完成式构成对第二人称单数的禁令；“不要说”自然、直接，也不额外加强语气。
- source_word: מֶה הָיָה
  choice: 为什么
  rationale: 此处是询问原因的希伯来语表达；译作“为什么”比逐字译作“是什么”更符合现代汉语，同时保留原句的疑问功能。
- source_word: הַיָּמִים הָרִאשֹׁנִים
  choice: 从前的日子
  rationale: 指较早的时期，可能是个人生命或历史中的往昔；“从前的日子”自然且不限定具体所指。
- source_word: הָיוּ טוֹבִים מֵאֵלֶּה
  choice: 比现在好
  rationale: 原文直译为“比这些好”，其中“这些”指当前的日子；现代汉语用“比现在好”更清楚自然。
- source_word: כִּי
  choice: 因为
  rationale: 此处引出禁止这样说的理由；“因为”清楚表达解释关系。
- source_word: לֹא מֵחָכְמָה
  choice: 并非出于智慧
  rationale: 介词מִן表达来源或根据；“出于智慧”保留这一语义，而不简化为“并不明智”。
- source_word: שָׁאַלְתָּ עַל זֶה
  choice: 你这样问
  rationale: 完成式在格言语境中可表达当前或一般性的行为；“这样问”自然涵盖“问到这事／对此发问”的含义。
