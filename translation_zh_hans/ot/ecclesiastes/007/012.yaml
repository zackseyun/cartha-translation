  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כִּ֛י בְּ/צֵ֥ל הַֽ/חָכְמָ֖ה בְּ/צֵ֣ל הַ/כָּ֑סֶף וְ/יִתְר֣וֹן דַּ֔עַת הַֽ/חָכְמָ֖ה תְּחַיֶּ֥ה בְעָלֶֽי/הָ׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/007/012.yaml
  text: For wisdom is a shelter just as money is a shelter[b][a], but the advantage of knowledge is that wisdom preserves the life of its possessors.
translation:
  language: zh_hans
  text: 因为智慧能庇护人，钱财也能庇护人[a]；但知识的益处在于：智慧能保全拥有智慧之人的性命[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“因为在智慧的荫下，也在钱财的荫下。”这里的“荫”是庇护、保护的比喻。
    reason: lexical_alternative
  - marker: b
    text: “能保全……的性命”也可译作“使……存活”或“使……得生命”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，为前一句提供理由；中文用“因为”自然体现解释关系。
- source_word: בְּצֵל הַחָכְמָה
  choice: 智慧能庇护人
  rationale: 原文直译为“在智慧的荫下”。“荫”在此比喻保护；译为“庇护”既传达功能，也保留遮蔽保护的意象。
- source_word: בְּצֵל הַכָּסֶף
  choice: 钱财也能庇护人
  rationale: כֶּסֶף 可指银子或钱财，此处强调其实际保障作用，译作“钱财”更符合现代汉语。原文重复“在……荫下”，译文以平行结构呈现。
- source_word: וְיִתְרוֹן דַּעַת
  choice: 但知识的益处
  rationale: יִתְרוֹן 指益处、优势或收益；此处在智慧与钱财都能保护人的共同点之后，引出进一步的优势，故用转折性的“但”。保留“知识”与后文“智慧”之间原有的措辞张力。
- source_word: תְּחַיֶּה
  choice: 能保全……的性命
  rationale: חיה 的 Piel 形可表示使活、保活或保全生命。上下文谈庇护作用，“保全……的性命”自然且不排除“使人存活”的语义。
- source_word: בְעָלֶיהָ
  choice: 拥有智慧之人
  rationale: 字面为“它的拥有者”；阴性后缀最自然地回指“智慧”。用明示名词避免中文代词指向不清。
theological_decisions:
- issue: 智慧“使人活”是否指赋予生命或保存生命
  choice: 能保全拥有智慧之人的性命
  alternative: 使拥有智慧的人得生命／存活
  rationale: 原动词容许“使活”和“保活”两种理解。正文依保护语境采用“保全性命”，脚注保留另一种译法，不将其限定为特定的救恩论含义。
- issue: דַּעַת 与 הַחָכְמָה 的关系
  choice: 保留“知识的益处……智慧……”的不同用词
  alternative: 将两者统一译为“智慧”
  rationale: 希伯来文使用两个不同名词，句法关系略显紧缩；保留差异可避免把“知识”与“智慧”未经说明地完全等同。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。前半句用平行结构呈现希伯来文的重复，正文解释“荫”的保护含义，脚注保存字面意象；后半句保留“知识”与“智慧”的措辞区别及动词的语义幅度。
