base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/007/011.yaml
  text: Wisdom is good with an inheritance[b][a], and an advantage to those who see the sun.
translation:
  language: zh_hans
  text: 智慧与产业相伴是美好的；对得见日光的人也有益处[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“智慧如同产业一样美好。”希伯来文既可表示智慧与产业相伴，也可能是在比较智慧与产业。
    reason: lexical_alternative
  - marker: b
    text: “得见日光的人”是指活在世上的人。
    reason: cultural_note
lexical_decisions:
- source_word: טוֹבָה
  choice: 是美好的
  rationale: 作谓语形容词，基本义为“好”；希伯来文是无系词句，中文自然补出“是”。原文未明确使用比较级，因此不译作“更好”。
- source_word: חָכְמָה
  choice: 智慧
  rationale: 传道书中该词通常指生活中实际的明智与判断力，“智慧”既准确又符合全书用语。
- source_word: עִם
  choice: 与……相伴
  rationale: 首先保留介词表示伴随、结合的含义，同时用自然汉语表达智慧与产业并有的意思；比较义的可能性在脚注说明。
- source_word: נַחֲלָה
  choice: 产业
  rationale: 该词指承受而来的产业或份额；“产业”既可涵盖继承所得，也比单说“遗产”更贴近其作为持有之财产的语境。
- source_word: וְיֹתֵר
  choice: 更是益处
  rationale: יֹתֵר在此可表示额外的益处、优势；用“更是益处”承接前句，并体现其对后述人群有利，但不把它解释为智慧必然优于产业。
- source_word: לְרֹאֵי
  choice: 对……的人
  rationale: לְ在这里表示受益对象；分词结构译为“……的人”，符合现代汉语。
- source_word: הַשָּׁמֶשׁ
  choice: 日光
  rationale: 保留“看见日光”的具体意象；该表达在此指活在世上的人，其习语含义另以脚注说明。
theological_decisions:
- issue: 智慧与产业之间的关系
  choice: 正文按伴随义译为“智慧与产业相伴是美好的”
  alternative: “智慧如同产业一样美好”
  rationale: עִם通常表示“与、同”，但此处句法也可能带出比较含义。正文采用较直接的伴随义，脚注保留比较解读，避免消除原文歧义。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。保留传道书“得见日光”的意象，并以脚注解释习语；正文结构简洁，贴近希伯来文的箴言式表达。
