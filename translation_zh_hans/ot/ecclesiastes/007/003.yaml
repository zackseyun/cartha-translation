source:
  edition: WLC
  text: ט֥וֹב כַּ֖עַס מִ/שְּׂחֹ֑ק כִּֽי בְ/רֹ֥עַ פָּנִ֖ים יִ֥יטַב לֵֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/007/003.yaml
  text: Sorrow is better than laughter[b][a], for by a sad face the heart is made better.
translation:
  language: zh_hans
  text: 忧愁胜过欢笑[a]，因为愁容能使人心变得更好[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “忧愁”或译“恼怒”或“烦恼”。希伯来语 כַּעַס 可以表达这些意思；本节下半句强调愁苦严肃所带来的益处，因此正文译作“忧愁”。
    reason: lexical_alternative
  - marker: b
    text: 直译：“因为面容的不好，心就变好。”这是指忧伤或愁苦的面容。
    reason: literal_rendering
lexical_decisions:
- source_word: טוֹב
  choice: 胜过
  rationale: 与介词 מִן 构成比较，译为“胜过”自然准确，也保持格言式的简洁。
- source_word: כַּעַס
  choice: 忧愁
  rationale: 该词也可指“恼怒、烦恼”，但本节下半句提到愁苦的面容及其对内心的益处；“忧愁”最符合此处语境，同时保留脚注说明其他可能。
- source_word: מִשְּׂחֹק
  choice: 欢笑
  rationale: שְׂחוֹק 可指笑或欢乐；“欢笑”既保留具体的笑，也能自然地与“忧愁”形成对照。
- source_word: כִּי
  choice: 因为
  rationale: 引出前一句判断的理由，现代汉语用“因为”清楚自然。
- source_word: בְרֹעַ פָּנִים
  choice: 愁容
  rationale: 原文直译近于“面容的不好”；这是指忧伤、阴沉的脸色。“愁容”保留面部表情的具体意象，又符合现代汉语习惯。
- source_word: יִיטַב
  choice: 变得更好
  rationale: 该动词意为“成为好的、得改善”。此译不把含义收窄为“快乐”，而是保留内心得益、改善的宽泛含义。
- source_word: לֵב
  choice: 人心
  rationale: לֵב 在智慧文学中涵盖人的思想、意志和内在生命。“人心”是自然且范围较宽的对应表达。
