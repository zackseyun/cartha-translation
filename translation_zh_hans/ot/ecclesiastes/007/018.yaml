  text: ט֚וֹב אֲשֶׁ֣ר תֶּאֱחֹ֣ז בָּ/זֶ֔ה וְ/גַם מִ/זֶּ֖ה אַל תַּנַּ֣ח אֶת יָדֶ֑/ךָ כִּֽי יְרֵ֥א אֱלֹהִ֖ים יֵצֵ֥א אֶת כֻּלָּֽ/ם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/007/018.yaml
  text: It is good that you should grasp this[a], and also not let your hand rest from that; for the one who fears God will come out with them all.
translation:
  language: zh_hans
  text: 抓住这一点是好的；那一点也不要放手；因为敬畏上帝的人，必从这一切中走出来[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文末句的句法关系和语义指向有争议，直译近于“必从这一切出来”。也可理解为“必从这一切脱身”，即顺利走过这一切；有些译法较具解释性地作“会避开这一切”。
    reason: 保留原文末句的语法与语义歧义。
lexical_decisions:
- source_word: טוֹב
  choice: 是好的
  rationale: 作评价性的谓语形容词，译为“是好的”自然地保留肯定和劝勉的语气。
- source_word: אֲשֶׁר תֶּאֱחֹז בָּזֶה
  choice: 你抓住这一点
  rationale: אָחַז的基本义是“抓住、握住”；“抓住”保留原文的手持意象，“这一点”承接上文的劝告。
- source_word: וְגַם מִזֶּה אַל תַּנַּח אֶת יָדֶךָ
  choice: 那一点也不要放手
  rationale: 原文直译近于“也不要使你的手从这个歇下”。“不要放手”在现代汉语中自然，并保留手与持守的意象；“那一点”与前面的“这一点”形成语境中的对照。
- source_word: יְרֵא אֱלֹהִים
  choice: 敬畏上帝的人
  rationale: 分词短语表示以敬畏上帝为特征的人；此译法不额外限定性别，也符合现代庄重汉语。
- source_word: יֵצֵא אֶת כֻּלָּם
  choice: 必从这一切中走出来
  rationale: יָצָא的基本义是“出去、出来”；这一结构十分凝练且有争议。“从这一切中走出来”保留原文的运动意象及其开放性，避免直接解释成“避开两个极端”或“兼顾两者”。
theological_decisions:
- issue: 末句如何理解
  choice: 保留“从这一切中走出来”的意象，表达敬畏上帝的人能够经历并走出前述一切，而不进一步界定方式。
  alternative: 译作“会避开这一切”或“会兼顾两者”。
  rationale: 希伯来语יֵצֵא אֶת כֻּלָּם结构罕见而压缩，可能指安然走过、摆脱或妥善应对前述诸事。主文不把它固定为“避免两个极端”等特定神学解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“抓住……不要放手”保留原文贯穿前两分句的手持意象；“这一点……那一点”自然呈现语境中的两项对照。
