base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/007/025.yaml
  text: I turned[a], I and my heart, to know and to search out and seek wisdom and an explanation[c][b], and to know that wickedness is folly and foolishness is madness.
translation:
  language: zh_hans
  text: 我转而，我和我的心一同要认识、考察并寻求智慧和事理[a]，也要认识邪恶就是愚妄，愚昧就是疯狂。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “事理”所译的希伯来词也可指“计算”、“筹算”、“谋略”或“推究所得的解释”。
    reason: lexical_alternative
  - marker: b
    text: 原文末句十分简练；两组相连的名词也可按修饰关系理解为“愚妄的邪恶和疯狂的愚昧”。
    reason: alternative_reading
lexical_decisions:
- source_word: סַבּוֹתִי אֲנִי וְלִבִּי
  choice: 我和我的心转而
  rationale: סבב保留“转向、转而”的具体意象；“我和我的心”照应希伯来文中说话者与其“心”的并列，并保留“心”兼具思想、判断和意志的希伯来表达。
- source_word: לָדַעַת וְלָתוּר וּבַקֵּשׁ
  choice: 要认识、考察并寻求
  rationale: 分别呈现ידע“认识”、תור“考察、探究”和בקש“寻求”，保留原文连续累积的三个求知动作，同时使现代汉语流畅。
- source_word: חָכְמָה
  choice: 智慧
  rationale: 这是《传道书》的核心智慧文学用语，“智慧”准确且自然。
- source_word: חֶשְׁבּוֹן
  choice: 事理
  rationale: 该词可指计算、筹算、推理或解释；此处“事理”适合求知语境，又不过度限定为单一含义，其他可能性列入脚注。
- source_word: רֶשַׁע כֶּסֶל
  choice: 邪恶就是愚妄
  rationale: רשע具有明确的道德意味，译作“邪恶”；כסל是智慧文学中带道德评价的愚妄。补出“就是”以自然表达希伯来文无系词的紧缩名词结构。
- source_word: הַסִּכְלוּת הוֹלֵלוֹת
  choice: 愚昧就是疯狂
  rationale: סכלות与כסל语义相近但并非同词，故用“愚昧”与前面的“愚妄”区分；הוללות在《传道书》中表达失常、狂乱，译作“疯狂”。
theological_decisions:
- issue: “心”的人观表达
  choice: 正文保留“我的心”
  alternative: 译作“我的思想”或合并为“我专心”
  rationale: 原文明说“我和我的心”，其中“心”涵盖思想、判断与意志。保留这一表达可避免以现代心理学范畴取代希伯来人观。
- issue: 邪恶、愚妄、愚昧与疯狂之间的句法关系
  choice: 按无系词判断句译为“邪恶就是愚妄，愚昧就是疯狂”
  alternative: 译作“愚妄的邪恶和疯狂的愚昧”
  rationale: 原文是两个高度压缩的名词组合，既可理解为判断关系，也可能按修饰关系处理。正文采用上下文中较自然的判断关系，脚注保留另一种句法可能。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。正文保留“我和我的心”这一略带陌生感的希伯来意象；用顿号和“并”呈现连续的求知动作，并以冒号引出原文压缩的判断内容。
