  text: כִּ֥י הָ/עֹ֖שֶׁק יְהוֹלֵ֣ל חָכָ֑ם וִֽ/יאַבֵּ֥ד אֶת לֵ֖ב מַתָּנָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/007/007.yaml
  text: For oppression drives a wise man mad[b][a], and a bribe destroys the heart.
translation:
  language: zh_hans
  text: 因为欺压能使智慧人疯狂，贿赂[a]能毁坏人心[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“礼物”。这个希伯来词通常可指礼物，但本节的语境更支持带有负面含义的“贿赂”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来语中的“心”通常指人的内在，包括判断、理解和意志。
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 本词承接上文，为前面的劝诫说明理由；“因为”能自然体现这种因果、解释关系。
- source_word: הָעֹשֶׁק
  choice: 欺压
  rationale: 该名词指压迫性的剥削或强取；“欺压”既保留社会与道德层面的含义，也符合现代汉语表达。
- source_word: יְהוֹלֵל
  choice: 使……疯狂
  rationale: 此处动词具有使人失去理性、举止狂乱的使役含义；“使……疯狂”保留其强烈语气，不把它弱化为一般的“变愚昧”。
- source_word: חָכָם
  choice: 智慧人
  rationale: 希伯来文是作名词用的阳性单数形容词，表达箴言式的泛指；“智慧人”简洁庄重，并保留原文的智慧文学用语。
- source_word: וִיאַבֵּד
  choice: 能毁坏
  rationale: 使役形式表示使之灭亡、败坏或毁掉；“毁坏”保留原文力度，与“人心”搭配也自然。
- source_word: אֶת לֵב
  choice: 人心
  rationale: 原文直译为“心”，在希伯来语中涵盖判断、理解和意志；“人心”保留核心意象，同时在汉语中明确是人的内在生命。
- source_word: מַתָּנָה
  choice: 贿赂
  rationale: 该词一般可指“礼物”，但在本节与欺压并列，又以毁坏人心为结果，语境明显偏向用于收买人的礼物，即“贿赂”。
