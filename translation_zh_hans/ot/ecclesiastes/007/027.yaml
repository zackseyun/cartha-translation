  text: רְאֵה֙ זֶ֣ה מָצָ֔אתִי אָמְרָ֖ה קֹהֶ֑לֶת אַחַ֥ת לְ/אַחַ֖ת לִ/מְצֹ֥א חֶשְׁבּֽוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/007/027.yaml
  text: See, this is what I found, says Qoheleth, adding one thing to another to find the sum.
translation:
  language: zh_hans
  text: “看哪，这是我所发现的，”传道者说，“我逐一加以推究，要找出结论[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “结论”也可译作“总和”、“解释”或“推究所得”。原词含计算、考量或推理的意思。
    reason: 希伯来词 חֶשְׁבּוֹן 的语义范围并不限定于数值总量；脚注保留其开放性。
lexical_decisions:
- source_word: קֹהֶלֶת
  choice: 传道者
  rationale: 沿用《传道书》中这一称谓的通行译法；它指本书的发言者，原词的具体职分或身份并不完全确定。
- source_word: אַחַת לְאַחַת
  choice: 把一项一项合在一起
  rationale: 直译为“一个对一个”或“一个接一个”；结合后面的“חשבון”，表达逐项汇集、比较或计算的过程，同时避免过度具体化。
- source_word: חֶשְׁבּוֹן
  choice: 总数
  rationale: 该词可指计算、账目、结果或推究所得；此处与逐项合在一起的语境相配，译作“总数”，并以脚注保留其他可能。
theological_decisions:
- issue: 传道者的话是否延续第一人称叙述
  choice: 用引号将“我把……”作为传道者的直接话语
  alternative: 不加内层话语界线，译为“传道者说，他把……”
  rationale: 希伯来文先用第一人称“我发现”，随后插入“传道者说”；保持第一人称最贴近原文，也不额外判定叙述者与传道者是否为不同人物。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“看哪”保留原文的提示语气；句式尽量呈现逐项考察、求得结果的思路。
