id: ECC.7.23
reference: Ecclesiastes 7:23
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כָּל זֹ֖ה נִסִּ֣יתִי בַֽ/חָכְמָ֑ה אָמַ֣רְתִּי אֶחְכָּ֔מָה וְ/הִ֖יא רְחוֹקָ֥ה מִמֶּֽ/נִּי־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/007/023.yaml
  text: All this I tested by wisdom[a]. I said[c][b], “I will become wise,” but it was far from me.
translation:
  language: zh_hans
  text: 这一切，我都用智慧检验过[a]。我说：“我要变得有智慧[b]。”智慧却离我很远[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“这一切，我都凭智慧试验过。”
    reason: 介词 בְּ 可表示手段或方式，נסה 也可译为“试验”。
  - marker: b
    text: 或译：“我要有智慧”或“我要获得智慧”。
    reason: אֶחְכָּמָה 可表达成为有智慧、处于智慧状态或求得智慧的愿望与决意。
  - marker: c
    text: 意思是，智慧仍然遥不可及，超出他的掌握。
    reason: 说明“离我很远”在语境中的比喻含义，同时保留正文的原始意象。
lexical_decisions:
- source_word: כָּל זֹה
  choice: 这一切
  rationale: כָּל 后接单数指示词 זֹה，整体回指上文的种种思考；“这一切”既贴近原文，也符合现代汉语表达。
- source_word: נִסִּיתִי
  choice: 我都……检验过
  rationale: נסה 的 Piel 形式在此表示试验、考察或验证。“检验过”保留了传道者以经验和思考进行探究的意味。
- source_word: בַחָכְמָה
  choice: 用智慧
  rationale: 介词 בְּ 在此最自然地表示手段或方式；“用智慧”比“借着智慧”更符合普通现代汉语，同时不排除“凭智慧”的理解。
- source_word: אָמַרְתִּי
  choice: 我说
  rationale: 按 אָמַר 的通常意义直译为“我说”；上下文表明这是自我言说或内心所定的志向，无须在正文中解释为“我心想”或“我立志”。
- source_word: אֶחְכָּמָה
  choice: 我要变得有智慧
  rationale: 该形式表达趋向智慧的愿望或决意。“变得有智慧”体现尚待达到的状态，同时脚注保留“我要有智慧”和“我要获得智慧”等可能译法。
- source_word: וְהִיא
  choice: 智慧却
  rationale: 阴性代词 הִיא 回指阴性名词“智慧”。汉语中重复“智慧”比使用“它”更清楚；连接词 וְ 在语境中具有转折作用，译作“却”。
- source_word: רְחוֹקָה מִמֶּנִּי
  choice: 离我很远
  rationale: 直接保留空间距离的比喻，不在正文中将其完全解释为“我无法掌握”，从而保存原文的简洁与张力。
theological_decisions:
- issue: 智慧是否绝对不可获得
  choice: 保留“智慧却离我很远”的距离意象
  alternative: 智慧仍非我所能掌握
  rationale: 原文只说智慧“远离我”，并未明确断言人绝对不能获得智慧；直译可避免把本节扩大为更强的神学结论。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“检验过”体现探究语气；“智慧却离我很远”保留原文拟人化和距离意象。正文中的脚注标记 [a]、[b]、[c] 均与脚注对应。
