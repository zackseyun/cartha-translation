  yaml_path: translation/ot/ecclesiastes/003/001.yaml
  text: For everything there is a season[a], and a time for every matter under the heavens.
translation:
  language: zh_hans
  text: 万事都有合宜的时候；天底下每件事都有其时。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “事”也可译作“活动”或“目的”；希伯来语חֵפֶץ在这里含义较宽。
    reason: lexical_alternative
lexical_decisions:
- source_word: לַכֹּל
  choice: 万事
  rationale: לְ加כֹּל表示涵盖一切的范围；“万事”简洁自然，也符合《传道书》的庄重语体。
- source_word: זְמָן
  choice: 都有定期
  rationale: זְמָן指规定、合宜的时段；“定期”既保留其时间有所划定的意味，也与下句的“定时”形成近义平行。
- source_word: וְעֵת
  choice: 都有定时
  rationale: עֵת是一般意义上的时间、时机；译作“定时”承接上下文，并保留与זְמָן相近而不完全相同的表达。
- source_word: לְכָל חֵפֶץ
  choice: 一切事务
  rationale: חֵפֶץ在此可指事情、活动或所要做的事；“事务”涵盖范围较宽，避免用“目的”过度强调目的论。
- source_word: תַּחַת הַשָּׁמָיִם
  choice: 天下
  rationale: 这是现代汉语中自然、凝练而庄重的说法，表达“诸天之下”的人间领域，也符合《传道书》的惯用视角。
theological_decisions:
- issue: חֵפֶץ是否应译为“目的”，从而明确暗示每件事都具有预设的神学目的
  choice: 事务
  alternative: 目的；活动；事情
  rationale: 本节肯定万事各有其时，但חֵפֶץ本身不必然明确表达强烈的目的论。“事务”保留原词的广度与张力，让更完整的神学含义由上下文呈现。
translation_notes:
  register: 采用现代、凝练、庄重的标准普通话。“定期……定时”保留希伯来诗句的近义平行；“天下”比直译“诸天之下”更自然，同时维持传道书的宏观人间视角。
