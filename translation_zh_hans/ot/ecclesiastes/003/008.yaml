  text: עֵ֤ת לֶֽ/אֱהֹב֙ וְ/עֵ֣ת לִ/שְׂנֹ֔א עֵ֥ת מִלְחָמָ֖ה וְ/עֵ֥ת שָׁלֽוֹם׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/003/008.yaml
  text: a time to love[a], and a time to hate; a time for war[c][b], and a time for peace.
translation:
  language: zh_hans
  text: 爱有时，恨有时[a]；战争有时，和平有时[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “恨”直译希伯来文；在这里可表达强烈的厌恶或敌对，不一定专指怀着恶意的仇恨。
    reason: lexical_alternative
  - marker: b
    text: “和平”所译的希伯来文也可指“安康”“完整”或“福祉”；这里与“战争”相对，因此译作“和平”。
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵת
  choice: 有时
  rationale: עֵת可指某个时刻或一段时期。全节采用“……有时”的自然汉语句式，既保留原文反复出现的节奏，也避免把它限定为短暂时刻。
- source_word: לֶאֱהֹב
  choice: 爱
  rationale: 这是动词אָהֵב的不定式形式，直接表示“爱”这一行动；与“恨”构成鲜明对举。
- source_word: לִשְׂנֹא
  choice: 恨
  rationale: שָׂנֵא通常意为“恨”。正文保留这一直接而强烈的表达，不以“疏远”或“反对”弱化原文；其语境含义另以脚注说明。
- source_word: מִלְחָמָה
  choice: 战争
  rationale: מִלְחָמָה指战争或武装冲突；在与שָׁלוֹם的对举中，“战争”是清楚、自然且范围相称的译法。
- source_word: שָׁלוֹם
  choice: 和平
  rationale: שָׁלוֹם也可表示安康、完整或福祉，但这里直接与“战争”相对，因此“和平”最符合语境。
theological_decisions:
- issue: 智慧诗歌中“恨”的道德含义
  choice: 正文直译为“恨”，保留原文的尖锐对比。
  alternative: 译为“反对”“疏远”或“不再爱”。
  rationale: 本节是在列举人生中不同情境和时机，并非脱离语境地命令人怀有恶意。翻译不应预先消解原文中“爱／恨”的张力。
translation_notes:
  register: 采用现代、凝练而庄重的诗体汉语，以“……有时”再现希伯来文עֵת反复形成的节奏。标点保留两组对举关系。未给עֵת另加脚注，因为“有时”已自然涵盖时刻或时期，且中文“季节”在此容易造成误解。
