  text: a time to tear[a], and a time to sew; a time to keep silent, and a time to speak[b];
translation:
  language: zh_hans
  text: 撕裂有时[a]，缝纫有时；静默有时[b]，说话有时。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “撕裂”可能暗指撕裂衣服，以表示悲痛、震惊或哀悼；但希伯来原文没有说明所撕裂的对象。
    reason: cultural_note
  - marker: b
    text: 或译：“保持缄默有时”。
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵת
  choice: 有时
  rationale: עֵת可指某个时刻或一段时期。这里采用“有时”，既符合现代汉语表达，也保留全段反复而整齐的诗歌节奏。
- source_word: לִקְרוֹעַ
  choice: 撕裂
  rationale: קרע意为撕裂，常以衣服为对象，但本句未明说宾语。“撕裂”保留原文的宽泛性，也不抹去撕裂衣服以表达哀痛或震惊的可能含义。
- source_word: לִתְפּוֹר
  choice: 缝补
  rationale: תפר的基本意思是缝、缝合。与“撕裂”相对时，“缝补”在汉语中自然简洁；它表达缝合破裂之物，但不进一步限定具体对象。
- source_word: לַחֲשׁוֹת
  choice: 静默
  rationale: חשׁה表示不说话、保持沉默。“静默”简练庄重，并能与后面的“发言”形成清晰对照。
- source_word: לְדַבֵּר
  choice: 发言
  rationale: דבר是一般性的“说话”。“发言”与“静默”对举自然，也传达在适当时候开口说话的意味，而不限定言说内容。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而简洁的诗体表达，以“……有时”的重复句式保留希伯来原文的节奏和平行结构。分号呈现两组相反行动。“撕裂”不补出“衣服”，以保存原文的含蓄；“静默／发言”则形成自然、清楚的现代汉语对举。
