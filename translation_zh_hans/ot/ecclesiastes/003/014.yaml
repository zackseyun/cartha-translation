  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: יָדַ֗עְתִּי כִּ֠י כָּל אֲשֶׁ֨ר יַעֲשֶׂ֤ה הָ/אֱלֹהִים֙ ה֚וּא יִהְיֶ֣ה לְ/עוֹלָ֔ם עָלָי/ו֙ אֵ֣ין לְ/הוֹסִ֔יף וּ/מִמֶּ֖/נּוּ אֵ֣ין לִ/גְרֹ֑עַ וְ/הָ/אֱלֹהִ֣ים עָשָׂ֔ה שֶׁ/יִּֽרְא֖וּ מִ/לְּ/פָנָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/003/014.yaml
  text: I know that whatever God does will endure forever; there is nothing to add to it[a], and there is nothing to take from it. God has done it so that they may fear before him.
translation:
  language: zh_hans
  text: 我知道，神所做的一切都将永远长存；人不能在其上增添什么，也不能从其中删减什么。神这样做，是要人在他面前敬畏[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “敬畏”也可译作“惧怕”；全句也可译作“使人在他面前肃然敬畏”。
    reason: 词义范围：ירא兼有惧怕、敬畏和肃然之意。
lexical_decisions:
- source_word: יָדַעְתִּי
  choice: 我知道
  rationale: Qal完成式第一人称单数表达传道者已经形成并持续持有的认识；现代汉语用“我知道”自然地呈现这一结果状态。
- source_word: כָּל אֲשֶׁר יַעֲשֶׂה הָאֱלֹהִים
  choice: 神所做的一切
  rationale: 保留כָּל与אֲשֶׁר组合所表达的全称范围，同时符合现代汉语习惯。
- source_word: הוּא יִהְיֶה לְעוֹלָם
  choice: 都将永远长存
  rationale: הוּא回指神所做的一切；“长存”自然表达יִהְיֶה לְעוֹלָם的持续和永久含义。
- source_word: עָלָיו אֵין לְהוֹסִיף
  choice: 人不能在其上增添什么
  rationale: 表达针对神之作为无法增添的含义；补出泛指主语“人”，使汉语句子完整而不限定具体群体。
- source_word: וּמִמֶּנּוּ אֵין לִגְרֹעַ
  choice: 也不能从其中删减什么
  rationale: גרע表示减少、削减或拿走；“删减”与前面的“增添”构成清晰平行。
- source_word: וְהָאֱלֹהִים עָשָׂה
  choice: 神这样做
  rationale: 完成式指向神已经施行的作为；“这样做”自然承接前述内容，并引出目的。
- source_word: שֶׁיִּרְאוּ
  choice: 是要人敬畏
  rationale: ירא用于人对神的态度时兼有惧怕、敬畏和肃然之意；正文采用“敬畏”，在现代汉语中保留对神的畏惧与尊崇，避免仅译为欣赏性的“惊叹”。
- source_word: מִלְּפָנָיו
  choice: 在他面前
  rationale: 较直接地保留“在其面前”的关系和临在意象，且在现代汉语中自然可懂。
theological_decisions:
- issue: 人对神之ירא的含义
  choice: 敬畏
  alternative: 惧怕；在他面前肃然敬畏
  rationale: “敬畏”是现代汉语圣经语境中兼顾畏惧与尊崇的自然表达，不把该词弱化为单纯的敬重；脚注说明其包含惧怕、肃然之意，以保留原文张力。
- issue: 神这样行的目的
  choice: 是要人敬畏在他面前
  alternative: 使人在他面前存敬畏的心
  rationale: 保留שֶׁ־的目的含义以及מִלְּפָנָיו的“在他面前”表述，不把目的进一步解释为某一特定教义体系。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“永远长存”“增添／删减”保持诗性平行；“在他面前”保留希伯来语的临在意象。
