revisions:
- from: 因为人的遭遇和牲畜的遭遇都是一样：这个怎样死，那个也怎样死；众生都有同样的气息[a]。人并不比牲畜占优势，因为一切都是雾气。
  to: 因为人和牲畜同有一个遭遇：这个怎样死，那个也怎样死；二者同有一种气息[a]。人并不比牲畜占优势，因为一切都是雾气。
  rationale: 仅作两项低风险的精确化修改：以“同有一个遭遇”保留 מִקְרֶה 和 אֶחָד 的句法及修辞强调；以“二者”将“同有一种气息”的范围限定为本节所对举的人与牲畜。脚注锚点及其词义说明保持不变。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T06:59:36Z'
