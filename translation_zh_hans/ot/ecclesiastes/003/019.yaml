  text: כִּי֩ מִקְרֶ֨ה בְֽנֵי הָ/אָדָ֜ם וּ/מִקְרֶ֣ה הַ/בְּהֵמָ֗ה וּ/מִקְרֶ֤ה אֶחָד֙ לָ/הֶ֔ם כְּ/מ֥וֹת זֶה֙ כֵּ֣ן מ֣וֹת זֶ֔ה וְ/ר֥וּחַ אֶחָ֖ד לַ/כֹּ֑ל וּ/מוֹתַ֨ר הָ/אָדָ֤ם מִן הַ/בְּהֵמָה֙ אָ֔יִן כִּ֥י הַ/כֹּ֖ל הָֽבֶל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/003/019.yaml
  text: 'For the fate of the sons of man and the fate of the beast is one fate for them: as this one dies[a], so dies that one, and one breath is for all. Man has no advantage over the beast, for all is vapor.'
translation:
  language: zh_hans
  text: 因为人和牲畜同有一个遭遇：这个怎样死，那个也怎样死；二者同有一种气息[a]。人并不比牲畜占优势，因为一切都是雾气。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “气息”或译“灵”。希伯来语 רוּחַ 可指气息、风或灵。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקְרֶה
  choice: 遭遇
  rationale: 指临到人或牲畜的事，在本节特指共同的死亡结局；“遭遇”既保留事件性，也避免“命运”可能带来的宿命论色彩。
- source_word: בְנֵי הָאָדָם
  choice: 人
  rationale: 该短语泛指人类。现代汉语用“人”自然、庄重，也不会像直译“人的众子”那样造成误解。
- source_word: הַבְּהֵמָה
  choice: 牲畜
  rationale: בְּהֵמָה通常指陆生牲畜或兽类，此处以集合意义与人类对举；“牲畜”贴近常用词义。
- source_word: וּמִקְרֶה אֶחָד לָהֶם
  choice: 都是一样
  rationale: 表达二者有同一个遭遇或结局，保留אֶחָד所强调的共同性，同时符合汉语表达。
- source_word: כְּמוֹת זֶה כֵּן מוֹת זֶה
  choice: 这个怎样死，那个也怎样死
  rationale: 保留原文“这个……那个……”的对称结构及死亡方式相同的强调。
- source_word: רוּחַ אֶחָד לַכֹּל
  choice: 众生都有同样的气息
  rationale: 在共同死亡的语境中，רוּחַ首先可理解为维持生命的气息；“众生”概括前文的人和牲畜，“同样”传达אֶחָד的共同性。
- source_word: מוֹתַר
  choice: 占优势
  rationale: 该词表示盈余、益处或优越之处；在人与牲畜的比较中，“占优势”清楚自然。
- source_word: הַכֹּל הָבֶל
  choice: 一切都是雾气
  rationale: “雾气”保留הֶבֶל具体而核心的意象，即短暂、飘忽、难以把握，而不把比喻直接抽象化为“虚空”或“徒然”。
theological_decisions:
- issue: רוּחַ在人与牲畜共同死亡语境中的含义
  choice: 气息
  alternative: 灵
  rationale: 上下文着重说明人与牲畜共有生命气息并同样死亡；正文采用“气息”最贴近这一观察角度，同时用脚注保留“灵”的词义可能，不据此解决灵魂论问题。
- issue: 人与牲畜“没有优势”的范围
  choice: 按本节死亡语境直译为“人并不比牲畜占优势”
  alternative: 将其泛化为人在任何方面都不优于牲畜
  rationale: 原句措辞绝对而上下文聚焦共同死亡；译文保留原有张力，不擅自增添“在死亡上”等限制语。
- issue: הֶבֶל的神学与文学意象
  choice: 雾气
  alternative: 虚空；徒然
  rationale: 保留传道书反复使用的实体比喻及其多义张力，既可指短暂易逝，也可暗示难以掌握，而不只归结为毫无意义。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“这个怎样死，那个也怎样死”保留希伯来文的平衡句式；“雾气”作为全书关键词，宜在相关经文中尽量一致。
