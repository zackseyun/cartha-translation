base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/003/009.yaml
  text: What profit has the worker from that in which he labors?[a]
translation:
  language: zh_hans
  text: 做事的人从他所劳碌的事中有什么益处呢？[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“劳碌的人从自己的劳碌中有什么益处呢？”
    reason: 以“劳碌的人”和“自己的劳碌”较凝练地表达 הָעֹשֶׂה 与 בַּאֲשֶׁר הוּא עָמֵל 的语境关系。
lexical_decisions:
- source_word: מַה
  choice: 有什么
  rationale: 以简洁的疑问形式保留原文反问的力度，并与中文“益处”自然搭配。
- source_word: יִתְרוֹן
  choice: 益处
  rationale: 这是《传道书》的关键词，指劳作所带来的余益、收益或优势；“益处”既自然，又能涵盖经济利润以外的意义。
- source_word: הָעֹשֶׂה
  choice: 劳碌的人
  rationale: 该分词字面为“做事的人”；结合后面的 עָמֵל，译作“劳碌的人”符合语境，也避免生硬的“做的人”。
- source_word: בַּאֲשֶׁר
  choice: 从自己的劳碌中
  rationale: 介词 ב 与关系词 אֲשֶׁר 指向其劳作的领域或事情；中文用“从……中”清楚表达所得益处的来源。
- source_word: הוּא
  choice: 自己的
  rationale: 原文显明回指阳性单数主语；中文用反身领属表达，可自然保留同一主体的关系，无须添加不自然的“他”。
- source_word: עָמֵל
  choice: 劳碌
  rationale: 保留 עמל 所含辛劳、费力工作的意味，并与全书惯用语相协调。
theological_decisions:
- issue: 代表性阳性单数的表达
  choice: 以“劳碌的人……自己的”保留单数泛指关系
  alternative: “劳碌的人从他所劳碌的事上……”
  rationale: 希伯来文使用阳性单数泛指劳作者。现代汉语反身代词“自己”不标性别，却准确回指单数主体，不改变原文所指，也避免中文中多余或拗口的代词。
- issue: 反问是否暗示答案为“毫无益处”
  choice: 保留开放式反问，不在正文中补出答案
  alternative: “劳碌的人……又能得到什么益处呢？”
  rationale: 本节提出问题，其答案由上下文展开；直译为疑问句可保存《传道书》刻意留下的张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“劳碌”呼应《传道书》的核心用语；句末“呢”自然呈现反问语气。脚注标记[a]已置于正文。
