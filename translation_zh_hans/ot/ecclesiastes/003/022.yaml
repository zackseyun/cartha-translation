  text: וְ/רָאִ֗יתִי כִּ֣י אֵ֥ין טוֹב֙ מֵ/אֲשֶׁ֨ר יִשְׂמַ֤ח הָ/אָדָם֙ בְּֽ/מַעֲשָׂ֔י/ו כִּי ה֖וּא חֶלְק֑/וֹ כִּ֣י מִ֤י יְבִיאֶ֨/נּוּ֙ לִ/רְא֔וֹת בְּ/מֶ֖ה שֶׁ/יִּהְיֶ֥ה אַחֲרָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/003/022.yaml
  text: So I saw that there is nothing better than that a man should rejoice in his works[a], for that is his portion. For who can bring him to see what will be after him?
translation:
  language: zh_hans
  text: 因此我看出，人以自己所做的事为乐，再没有比这更好的了，因为这是他的分。谁能使他看见他以后将发生什么[a]呢？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他离世以后将发生什么”。
    reason: 原文“在他以后”可以宽泛地指此人之后的未来，也可理解为他去世之后的事。
lexical_decisions:
- source_word: וְרָאִיתִי
  choice: 因此我看出
  rationale: 该短语是 ראה 的 Qal 完成式第一人称单数，在此引出传道者根据上文所得的观察与结论；“因此我看出”自然表达语境中的推论意味。
- source_word: אֵין טוֹב מֵאֲשֶׁר
  choice: 再没有比这更好的了
  rationale: 这是《传道书》中表达比较评价的惯用结构，并非断言绝对的道德之善；此译保留“没有更好”的比较含义。
- source_word: הָאָדָם
  choice: 人
  rationale: 此处 אָדָם 是具有代表性的泛指单数，指一般的人；现代汉语用“人”既能保留单数概括作用，也不会不必要地限定为男性。
- source_word: יִשְׂמַח
  choice: 能……喜乐
  rationale: 未完成式在比较结构中说明何为更好，并非直接命令。“能……喜乐”表达可享有、可欢喜于其中的评价意味。
- source_word: בְּמַעֲשָׂיו
  choice: 因自己所做的事
  rationale: מַעֲשֶׂה 可指行为、工作或所从事的活动；此译范围宽广，并以自然汉语表达因自己的作为而喜乐。
- source_word: חֶלְקוֹ
  choice: 他的分
  rationale: חֵלֶק 在《传道书》中常指人在生命中所得或获分配的份额；“他的分”保留全书反复出现的主题性表达。
- source_word: מִי יְבִיאֶנּוּ
  choice: 谁能领他
  rationale: בוא 的 Hiphil 形式意为带来、使来到；反问句强调人的无能，“谁能领他”兼顾使役含义和汉语自然度。
- source_word: לִרְאוֹת
  choice: 来看
  rationale: 保留 ראה 的基本义“看见”，不先行解释为经历或知晓，从而维持原文形象而开放的说法。
- source_word: בְּמֶה שֶׁיִּהְיֶה אַחֲרָיו
  choice: 他以后将发生什么
  rationale: 此语可指在他之后发生的事，也可能特指他离世以后之事；正文采用较贴近原文且范围较宽的表达，并在脚注列出较明确的另一译法。
theological_decisions:
- issue: אָדָם 作为泛指单数的译法
  choice: 人
  alternative: 男人；世人
  rationale: 希伯来语虽为语法上的阳性单数，此处却具有代表全人类的一般性含义。现代汉语“人”自然保留泛指作用，不将经文的适用范围误限于男性，也不把单数表达抽象化为群体。
- issue: אַחֲרָיו 所指时间范围
  choice: 他以后
  alternative: 他离世以后
  rationale: 原文可泛指一个人之后的未来，也可按语境理解为其死后。正文不将这一张力提前消解，脚注提供较明确的可能理解。
translation_notes:
  register: 采用现代、庄重而易懂的标准汉语。“再没有比这更好的了”保留传道者的比较判断；“他的分”维持《传道书》的主题词联系。反问句保持原文对人无法预见身后之事的张力。
