  yaml_path: translation/ot/ecclesiastes/003/012.yaml
  text: I know that there is nothing better for them than to rejoice and to do good during their lives[a].
translation:
  language: zh_hans
  text: 我知道，对人来说，没有什么比在一生的日子里欢喜快乐、行善更好[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“享受生活”或“过得好”。希伯来语短语既可按伦理意义理解为“行善”，也可按生活体验理解为“过得好、享受生活”。
    reason: lexical_alternative
lexical_decisions:
- source_word: יָדַעְתִּי
  choice: 我知道
  rationale: 该词为ידע的Qal完成式第一人称单数；此处表达传道者反思后持有的认识，现代汉语用“我知道”自然且贴合语境。
- source_word: אֵין טוֹב בָּם כִּי אִם
  choice: 人……没有比……更好的事
  rationale: 该结构在本段语境中表达比较兼限定意义，即对人而言没有更好的选择；译为“没有比……更好的事”比“他们里面没有善”更符合上下文。
- source_word: לִשְׂמוֹחַ
  choice: 喜乐
  rationale: שׂמח表示欢喜、快乐；“喜乐”保留动词性含义及传道书庄重、反思性的语体。
- source_word: וְלַעֲשׂוֹת טוֹב
  choice: 行善
  rationale: עשה טוב的直接词义是“行善、做美善之事”。本句也可能指“过得好、享受生活”，因此正文采用直接的伦理性读法，并以脚注保留体验性读法。
- source_word: בְּחַיָּיו
  choice: 一生
  rationale: 字面为“在他的一生中”。汉语以泛指的“人一生”自然表达单数分配意义，也与前面的复数所指相协调。
theological_decisions:
- issue: וְלַעֲשׂוֹת טוֹב在本节中的含义
  choice: 采用伦理性含义“行善”
  alternative: 体验性含义“享受生活”或“过得好”
  rationale: 原短语直接支持“行善”，但传道书中的טוב也可描述生活体验。为避免把原文真实的语义张力单向化，正文保留直接词义，脚注注明另一种合理理解。
translation_notes:
  register: 采用现代、简洁而庄重的标准普通话。“人一生”表达泛指及分配意义；“喜乐、行善”结构紧凑，并保留原文两个并列不定式的节奏。
