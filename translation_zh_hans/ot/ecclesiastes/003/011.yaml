  to: 万事，上帝使它们各按其时成为美好。他也把永恒放在人心里[a]，然而人仍不能查明上帝从始至终所做的工作。
  rationale: 修订仅使“各按其时”更直接对应 בְּעִתּוֹ，并将脚注中的词义备选调整为更自然准确的“时代”。“然而人仍不能查明”保留原文及英语审校轨迹中的张力和认知限制，未对争议词 עוֹלָם 作超出文本的神学界定。
