base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/003/011.yaml
  text: He has made everything beautiful in its time. He has also put eternity in their heart[a], yet so that man cannot find out the work that God has done from beginning to end.
translation:
  language: zh_hans
  text: 万事，上帝使它们各按其时成为美好。他也把永恒放在人心里[a]，然而人仍不能查明上帝从始至终所做的工作。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “永恒”或译“世界”或“时代”。这里的希伯来词含义较难确定，也可能指人对整个时间跨度，或对眼前经验以外之世界的意识。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכֹּל
  choice: 凡事
  rationale: 概括一切事物和事件，且承接本章关于各种时机的论述；现代汉语简洁自然。
- source_word: יָפֶה
  choice: 成为美好
  rationale: 保留“美好、优美”的基本含义，同时在“合宜的时候”这一语境中容纳“恰当、合宜”的意味。
- source_word: בְעִתּוֹ
  choice: 在合宜的时候
  rationale: 表达各事都有相应的时机，并与本章反复出现的“时候”相呼应；“合宜”没有把原文过度限定为某个精确时点。
- source_word: הָעֹלָם
  choice: 永恒
  rationale: 该词在此含义困难。“永恒”能表达超越眼前时刻的时间意识，并与人无法穷尽上帝作为的下半句形成张力；其他可能含义收入脚注。
- source_word: בְּלִבָּם
  choice: 在人心里
  rationale: 希伯来语“心”涵盖思想、意志和内在生命；“人心里”自然表达其泛指全人类的集合意义。
- source_word: מִבְּלִי אֲשֶׁר לֹא
  choice: 然而……仍不能
  rationale: 在上下句之间呈现限制和转折：人虽有对永恒的意识，却不能完全查明上帝的工作。
- source_word: הָאָדָם
  choice: 人
  rationale: 此处为代表全人类的泛指单数；现代汉语用“人”既准确又不产生不必要的性别限定。
- source_word: יִמְצָא
  choice: 查明
  rationale: 这里不是物理意义的“找到”，而是探究、发现并理解；“查明”保留认知和追索的意味。
- source_word: הַמַּעֲשֶׂה
  choice: 所做的工
  rationale: 指上帝整体的作为；“工”庄重、简洁，并与关系从句自然衔接。
- source_word: מֵרֹאשׁ וְעַד סוֹף
  choice: 从始至终
  rationale: 准确传达首尾兼举所表达的完整范围，且是自然、庄重的现代汉语。
theological_decisions:
- issue: הָעֹלָם 与人的认知限度及上帝主权的关系
  choice: 正文译作“永恒”
  alternative: “世界”、“世代”，或指超越眼前经验的整个时间跨度
  rationale: “永恒”保留了上帝赐人超越当下的意识、而人仍无法穷尽上帝全部作为之间的神学张力。由于该词在本节含义有争议，不在正文中武断消除歧义，而以脚注列出其他可能。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“凡事……在合宜的时候成为美好”兼顾原文的美感与适切性；“然而……仍不能”清楚保留人的超越意识与认知限制之间的张力。脚注标记[a]已置于正文对应词后。
