  text: וְ/ע֥וֹד רָאִ֖יתִי תַּ֣חַת הַ/שָּׁ֑מֶשׁ מְק֤וֹם הַ/מִּשְׁפָּט֙ שָׁ֣מָּ/ה הָ/רֶ֔שַׁע וּ/מְק֥וֹם הַ/צֶּ֖דֶק שָׁ֥מָּ/ה הָ/רָֽשַׁע׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/003/016.yaml
  text: And I also saw under the sun that in the place of justice[a], there was wickedness, and in the place of righteousness, there was wickedness.
translation:
  language: zh_hans
  text: 我又看见日光之下：在审判之处有邪恶；在公义之处[a]也有邪恶。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “公义”也可译作“公正”。这里的希伯来词צֶדֶק与前一句译作“审判”的מִשְׁפָּט不同，但两者含义有所重叠。
    reason: 保留两个相关希伯来词之间的词汇差异，并说明符合语境的另一译法。
lexical_decisions:
- source_word: וְעוֹד
  choice: 我又
  rationale: 表达在此前思考之外又增加一项观察；“又”简洁自然，也保留传道者连续陈述所见的语气。
- source_word: רָאִיתִי
  choice: 看见
  rationale: 保留希伯来文直接、具体的观察语气，不改写为较抽象的“察觉”或“观察到”。
- source_word: תַּחַת הַשָּׁמֶשׁ
  choice: 日光之下
  rationale: 这是《传道书》的标志性表达，指人世间的生活领域；“日光之下”准确、庄重且为现代读者所熟悉。
- source_word: מְקוֹם הַמִּשְׁפָּט
  choice: 施行公正的地方
  rationale: מִשְׁפָּט兼有审判、公正、司法裁断等含义。此处着眼于本应实行公正的场域；这一译法兼顾制度性和道德含义，又比生硬的“审判之地”自然。
- source_word: שָׁמָּה
  choice: 那里竟有
  rationale: “那里”明确回指刚提到的地方；“有”使汉语句式自然。“竟”传达在公正或公义之处反见邪恶的强烈反常对照，虽非该副词的独立词义，却由全句对比关系支持。
- source_word: הָרֶשַׁע / הָרָשַׁע
  choice: 邪恶
  rationale: 上下两处按平行结构理解为抽象的邪恶或恶行，而不是具体的“恶人”；重复同一译词保留原文的修辞平衡。
- source_word: וּמְקוֹם הַצֶּדֶק
  choice: 在秉持公义的地方
  rationale: צֶדֶק可指公义、公正。译作“公义”可与前面的מִשְׁפָּט（公正）保持相关而不相同的词义层次；“秉持”使“公义之处”在现代汉语中更自然。
theological_decisions:
- issue: צֶדֶק与מִשְׁפָּט的关系
  choice: 分别译为“公义”和“公正”
  alternative: 两者都译为“公正”或“正义”
  rationale: 两个词语义重叠，但希伯来文刻意使用不同词。分别翻译可保留司法公正与较广泛道德公义之间的细微差别，同时不把二者割裂为互不相关的概念。
- issue: הָרָשַׁע的理解
  choice: 按平行结构译为抽象名词“邪恶”
  alternative: 译为具体人物“恶人”
  rationale: 该形式可能令人联想到“恶人”，但它与前一分句的הָרֶשַׁע构成严整平行，语境也强调公正与公义所在之处被邪恶侵占，因此保留抽象意义更合适，同时不引入额外的个人化解释。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。保留“日光之下”这一全书反复出现的特色表达，也保留两个平行分句及“邪恶”的重复，以呈现原文的反讽和修辞力度。
