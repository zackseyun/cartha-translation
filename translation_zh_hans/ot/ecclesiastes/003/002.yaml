  text: עֵ֥ת לָ/לֶ֖דֶת וְ/עֵ֣ת לָ/מ֑וּת עֵ֣ת לָ/טַ֔עַת וְ/עֵ֖ת לַ/עֲק֥וֹר נָטֽוּעַ׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/003/002.yaml
  text: A time to be born[a], and a time to die; a time to plant, and a time to uproot what is planted.
translation:
  language: zh_hans
  text: 出生有时[a]，死亡有时；栽种有时，拔出所栽种的也有时。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“生育有时”。
    reason: 希伯来语לָלֶדֶת在形式上可指生育；上下文与“死亡”对举，也可理解为出生。
lexical_decisions:
- source_word: עֵת
  choice: 有时
  rationale: עֵת指某一时候或适当的时刻。本节采用“有时”，既自然简洁，也保持诗中反复出现的句式。
- source_word: לָלֶדֶת
  choice: 出生
  rationale: ילד的这个不定式在形式上可指生育，但与“死亡”构成生命起点与终点的对举时，“出生”最符合上下文；其可能的主动含义以脚注保留。
- source_word: לָמוּת
  choice: 死亡
  rationale: מות意为死亡，与“出生”形成直接对举。
- source_word: לָטַעַת
  choice: 栽种
  rationale: נטע在此意为栽种；“栽种”保留原文具体的农耕意象。
- source_word: לַעֲקוֹר
  choice: 拔出
  rationale: עקר指连根拔起。中文“拔出”与后面的“所栽种的”衔接自然，并保留移除植物的动作。
- source_word: נָטוּעַ
  choice: 所栽种的
  rationale: נטע的被动分词指已经栽种之物；“所栽种的”不擅自补出原文没有明说的具体名词。
theological_decisions: []
