  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: מִ֣י יוֹדֵ֗עַ ר֚וּחַ בְּנֵ֣י הָ/אָדָ֔ם הָ/עֹלָ֥ה הִ֖יא לְ/מָ֑עְלָ/ה וְ/ר֨וּחַ֙ הַ/בְּהֵמָ֔ה הַ/יֹּרֶ֥דֶת הִ֖יא לְ/מַ֥טָּה לָ/אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/003/021.yaml
  text: Who knows whether the spirit of the sons of man goes upward[b][a], and whether the spirit of the beast goes down to the earth?
translation:
  language: zh_hans
  text: 谁知道世人的灵[a][b]是否往上升，兽类的灵是否向下入地呢？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“人的众子”，是用阳性形式泛指全人类。
    reason: lexical_alternative
  - marker: b
    text: “灵”也可译作“气息”；本节两处的希伯来词均为 רוּחַ，其含义在这里可能有所重叠。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי יוֹדֵעַ
  choice: 谁知道
  rationale: 保留希伯来文简洁的反问形式及其所表达的认识限度，不增译为“谁能确知”。
- source_word: רוּחַ
  choice: 灵
  rationale: 此处谈论人和兽类死后的去向，“灵”较能体现作为生命本原且可能离体而去的含义；但该词也可指“气息”，故以脚注保留这一重叠语义。
- source_word: בְּנֵי הָאָדָם
  choice: 世人
  rationale: 原文直译为“人的众子”，是以阳性复数代表全人类的希伯来表达；“世人”在现代汉语中自然、庄重，也不把所指误限于男性。
- source_word: הָעֹלָה הִיא לְמָעְלָה
  choice: 是否往上升
  rationale: 以“是否”承接“谁知道”的疑问范围，清楚表达上升方向，同时不把此事译成确定的断言。
- source_word: וְרוּחַ הַבְּהֵמָה
  choice: 兽类的灵
  rationale: בְּהֵמָה在此以单数集合性用法指与人类相对的动物；“兽类”比“牲畜”范围更合适，也保留类别对比。
- source_word: הַיֹּרֶדֶת הִיא לְמַטָּה לָאָרֶץ
  choice: 是否向下入地
  rationale: 与“往上升”形成清楚平行；“入地”自然表达向下归于地土的意象，并保留 אֶרֶץ 与上方之间的空间对照。
theological_decisions:
- issue: 本节是在断言人兽之灵的不同归宿，还是在表达对其归宿的疑问
  choice: 译作“谁知道……是否……”，表达认识上的不确定
  alternative: 把上升和下降译为已知事实，只用“谁知道”引出或确认该事实
  rationale: מִי יוֹדֵעַ 自然引出反问，而两个带冠词形式的分词结构处于该问题的范围内。采用“是否”可保留《传道书》此处的张力，避免把经文改成超出其措辞的确定教义断言。
- issue: 第二个分句是否也明确标示疑问关系
  choice: 在第二个分句重复“是否”
  alternative: 只在第一个分句使用“是否”，第二句直译为“兽类的灵向下入地”
  rationale: 希伯来文第二分句虽未另加独立疑问词，但仍受开头“谁知道”的统摄。汉语重复“是否”能清楚保持人兽两个去向并列受问，而不改变原意。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“世人”自然表达全人类，“兽类”与之形成集合性的类别对照；“往上升／向下入地”保持原文鲜明的方向平行。脚注标记紧接其共同所说明的“世人的灵”。
