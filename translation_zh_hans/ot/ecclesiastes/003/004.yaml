  text: A time to weep[a], and a time to laugh; a time to mourn[b], and a time to dance.
translation:
  language: zh_hans
  text: 哭有时[a]，笑有时；哀悼有时[b]，跳舞有时。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “时”也可译作“时候”或“时节”；本节各处同。
    reason: lexical_alternative
  - marker: b
    text: “哀悼”也可译作“哀哭”或“举哀”，尤其可指正式的丧礼哀悼。
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵת
  choice: 有时
  rationale: עֵת指特定的时间、时机或时候。译作“有时”既贴合本节反复出现的诗歌句式，也符合现代汉语的自然表达。
- source_word: לִבְכּוֹת
  choice: 哭
  rationale: בכה意为哭泣、哀哭；“哭”简洁自然，并与“笑”形成鲜明对照。
- source_word: לִשְׂחוֹק
  choice: 笑
  rationale: שׂחק在此最直接的含义是发笑；“笑”保留了与“哭”的对偶关系。
- source_word: סְפוֹד
  choice: 哀恸
  rationale: ספד指哀悼、举哀或作哀歌，常见于丧葬语境。“哀恸”表达深切哀伤，同时不把含义限定为某一种正式仪式。
- source_word: רְקוֹד
  choice: 跳舞
  rationale: רקד意为跳舞；“跳舞”是自然明确的现代汉语，并与“哀恸”构成诗意对照。
