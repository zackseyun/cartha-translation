base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/003/020.yaml
  text: All go to one place[a]. All came from the dust[b], and all return to the dust.
translation:
  language: zh_hans
  text: 一切都走向一个地方；一切都来自尘土[a]，也都归回尘土[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文较直译为“一切都是出于尘土”；“来自尘土”按现代汉语自然地表达起源。
    reason: lexical_alternative
  - marker: b
    text: “尘土”使人想到人的必死性，并呼应《创世记》3:19。
    reason: cross_reference
lexical_decisions:
- source_word: הַכֹּל
  choice: 一切
  rationale: 定冠词加“全部”在本节中作概括性表达，承接上文的人和走兽，强调二者共同的结局；“一切”简洁自然，也不把范围缩限为人类。
- source_word: הוֹלֵךְ
  choice: 走向
  rationale: 分词表达恒常、普遍的现实；“走向”既保留运动意象，也自然地表示最终趋向。
- source_word: מָקוֹם אֶחָד
  choice: 同一个地方
  rationale: 直译为“一个地方”，但上下文强调人和走兽结局相同；现代汉语用“同一个地方”可清楚表达比较关系，而不进一步界定该地方。
- source_word: הָיָה מִן־הֶעָפָר
  choice: 来自尘土
  rationale: 希伯来文较直译为“是出于尘土”；“来自尘土”在现代汉语中更自然地表达起源，并与后半句“归回尘土”形成对应。
- source_word: עָפָר
  choice: 尘土
  rationale: “尘土”准确体现易朽与死亡的意象，也呼应《创世记》3:19的措辞。
- source_word: שָׁב אֶל־הֶעָפָר
  choice: 归回尘土
  rationale: שׁוב表示返回原处；“归回”清楚保留从尘土而来、又回到尘土的逆向对应。
theological_decisions:
- issue: “一切”在上下文中的范围
  choice: 表达人和走兽同有死亡、归于尘土的结局，不在本节中增添对死后状态的判断。
  alternative: 将“一切”仅理解为全人类，或认为本节断言死亡之后绝无任何区别。
  rationale: 传道书3:18—21直接比较人和走兽，并着重指出二者在死亡上的共同命运。本译文保留这一观察及经文本身的张力，不把本节扩展为它没有明说的死后论结论。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。重复“一切”以保留原文的排比和普遍范围；“走向—来自—归回”呈现原文关于共同终点、起源与返回的结构。
