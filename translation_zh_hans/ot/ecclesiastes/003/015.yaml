  text: מַה שֶּֽׁ/הָיָה֙ כְּבָ֣ר ה֔וּא וַ/אֲשֶׁ֥ר לִ/הְי֖וֹת כְּבָ֣ר הָיָ֑ה וְ/הָ/אֱלֹהִ֖ים יְבַקֵּ֥שׁ אֶת נִרְדָּֽף־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/003/015.yaml
  text: What has been already is[a], and what is to be has already been; and God seeks what has been driven away.
translation:
  language: zh_hans
  text: 已有的，早已存在；将要有的，也早已存在。上帝寻找那被赶走的。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“上帝寻找那被追赶的”，或“上帝追究已逝去的事”。原文末句含义难定，可能指被赶走或已经逝去的，也可能指正被追赶的。
    reason: alternative_reading
lexical_decisions:
- source_word: מַה שֶּׁהָיָה
  choice: 已有的
  rationale: 概括一切已经发生或存在的事物；译法简洁，并与下句“将要有的”形成平行。
- source_word: כְּבָר
  choice: 早已
  rationale: 表示先前已经发生；“早已”既保留时间意味，也维持箴言式句法的凝练。
- source_word: הוּא
  choice: 存在
  rationale: 此代词在无动词句中作谓语。按现代汉语表达补出“存在”，避免生硬的“它就是”，同时不增加具体解释。
- source_word: וַאֲשֶׁר לִהְיוֹת
  choice: 将要有的
  rationale: 保留该结构的前瞻意义，并与“已有的”自然对应。
- source_word: הָאֱלֹהִים
  choice: 上帝
  rationale: 在《传道书》中指独一的上帝；“上帝”是现代标准汉语中自然、庄重的通称。
- source_word: יְבַקֵּשׁ
  choice: 寻回
  rationale: בקשׁ 的核心义为“寻找、寻求”。结合被动分词“被赶走的”，“寻回”在汉语中自然表达寻找失去之物的意味，但不把该词明确解释为审判或追讨。
- source_word: אֶת נִרְדָּף
  choice: 那被赶走的
  rationale: נִרְדָּף 是 רדף 的尼法勒分词，可指被追赶、被驱逐之物。此译保留其被动意义，并让经文本身的含混继续存在。
theological_decisions:
- issue: וְהָאֱלֹהִים יְבַקֵּשׁ אֶת נִרְדָּף 的解释
  choice: 上帝寻回那被赶走的
  alternative: 上帝寻找那被追赶的；上帝追究过去的事
  rationale: 原文末句高度凝缩，既可能描述上帝重新寻找被赶走或已经逝去之物，也可能含有追究、审判的意味。正文贴近词汇和被动结构，不把它单一化为循环论、恢复论或审判论；主要异读列入脚注。
translation_notes:
  register: 采用现代、庄重而简明的标准普通话。前两句保持紧凑的平行结构；末句保留希伯来文的语义张力，并以脚注交代重要异译。
