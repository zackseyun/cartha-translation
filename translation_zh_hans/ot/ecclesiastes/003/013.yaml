revisions:
- from: 并且，人人都能吃喝，在自己一切劳碌中享受美福——这是上帝的恩赐[a]。
  to: 此外，人人都能吃喝，并在自己一切劳碌中享受美好[a]——这也是上帝的恩赐。
  rationale: 修订仅收窄“美福”所增添的“福分”意味，改以更贴近טוֹב且自然的“美好”，并将承接词调整为较流畅的“此外”。“都能”保留原稿对上帝所赐机会/能力的谨慎表达；破折号保留后半句对前述整体的认定。
