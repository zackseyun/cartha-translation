  text: וְ/גַ֤ם כָּל הָ/אָדָם֙ שֶׁ/יֹּאכַ֣ל וְ/שָׁתָ֔ה וְ/רָאָ֥ה ט֖וֹב בְּ/כָל עֲמָל֑/וֹ מַתַּ֥ת אֱלֹהִ֖ים הִֽיא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/003/013.yaml
  text: And also that every man should eat and drink and see good in all his labor—this is the gift of God[a][b].
translation:
  language: zh_hans
  text: 此外，人人都能吃喝，并在自己一切劳碌中享受美好[a]——这也是上帝的恩赐。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “享受美好”原文直译为“看见好处”，也可译作“经历美好”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: 并且
  rationale: 承接上一节并增添一项判断，保留其连接和递进作用。
- source_word: כָּל הָאָדָם
  choice: 人人
  rationale: אָדָם在此是泛指人的单数形式；现代汉语用“人人”自然表达其周遍、分配性的含义，又不误指仅限男性。
- source_word: שֶׁיֹּאכַל וְשָׁתָה
  choice: 都能吃喝
  rationale: 这里描述人所得以享用的福分；“能”传达蒙准许、蒙赐予的意味，同时避免把它译成伦理义务。
- source_word: וְרָאָה טוֹב
  choice: 享受美福
  rationale: 原文直译为“看见好处”，在《传道书》中常指亲身经历或享受美好；“享受美福”保留正面福乐的含义，且符合现代汉语习惯。
- source_word: בְּכָל עֲמָלוֹ
  choice: 在自己一切劳碌中
  rationale: 紧贴介词בְּ和עָמָל的辛劳意味，并用“自己”自然对应第三人称单数所属关系。
- source_word: מַתַּת אֱלֹהִים הִיא
  choice: 这是上帝的恩赐
  rationale: 把阴性代词所回指的整件事明确译为“这”；“恩赐”既表示出于上帝的给予，也适合本节正面的语境。
theological_decisions:
- issue: אָדָם在关于全人类的泛指陈述中如何表达
  choice: 人人
  alternative: 每一个人／每个男人
  rationale: 希伯来语的语法形式为阳性单数，但语义涵盖所有人。汉语“人人”准确表达普遍性，不增添仅限男性的含义。
- issue: 吃喝并从劳碌中得福的情态
  choice: 都能吃喝……享受美福
  alternative: 都应该吃喝／都可以吃喝
  rationale: 上下文把这种享受认定为上帝所赐，而不是颁布道德命令；“能”保留所得能力或机会的意味，又不过度限定情态。
- issue: מַתַּת אֱלֹהִים是否指特定的神圣恩赐
  choice: 这是上帝的恩赐
  alternative: 这是上帝所赐的／这是上帝的一份礼物
  rationale: 原文把前述整体认定为来自上帝的给予；“恩赐”清楚传达神圣来源，但不额外规定其教义性质。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“劳碌”延续《传道书》的关键词色彩；“美福”比直译“看见好处”自然，又借脚注保留原文意象。
