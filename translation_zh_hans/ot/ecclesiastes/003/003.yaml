  text: a time to kill[a], and a time to heal; a time to tear down[b], and a time to build up.
translation:
  language: zh_hans
  text: 杀戮有时，医治有时；拆毁有时[a]，建造有时。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “拆毁”也可译作“冲破”；原词可指拆坏、攻破或打开缺口。
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵת
  choice: 有时
  rationale: עֵת指时间、时机或特定时候。译作“有时”既自然凝练，也能在反复出现时保留希伯来诗歌的节奏。
- source_word: לַהֲרוֹג
  choice: 杀戮
  rationale: הרג基本义为杀、杀死。“杀戮”保留原文直白而尖锐的表达，并与本节其余动宾结构协调；这里是在列举人生中的相对情形，并非自动构成道德认可。
- source_word: לִרְפּוֹא
  choice: 医治
  rationale: רפא通常指医治、使痊愈。“医治”范围较广，语言庄重自然，也清楚构成与“杀戮”的对照。
- source_word: לִפְרֹוץ
  choice: 拆毁
  rationale: פרץ可指冲破、破坏或拆毁。在与“建造”对应的语境中，“拆毁”最自然地表达破坏建筑或结构的意思，同时不把含义收窄为仅仅打开缺口。
- source_word: לִבְנוֹת
  choice: 建造
  rationale: בנה意为建造、修建。“建造”准确简洁，并与“拆毁”形成鲜明的诗性反义平行。
theological_decisions:
- issue: 是否应弱化“杀戮”以避免表面的道德难题
  choice: 保留“杀戮”，视为传道者对各种时候和现实的描述
  alternative: 译作较弱的“死亡”，或改成带司法限定的“处死”
  rationale: 原文使用主动动词“杀”，并未限定为自然死亡、战争或司法处决。诗歌列举人生现实，却没有明确赞许其中每一种行为；译文应保留这种尖锐性和神学张力。
translation_notes:
  register: 采用现代、简洁而庄重的普通话，以四个“……有时”再现原文反复的节奏和两组对称结构。中文“有时”自然涵盖“有一个时候／时机”的意义，因此不另加关于“季节”的脚注。
