  yaml_path: translation/ot/ecclesiastes/003/010.yaml
  text: I have seen the task that God has given to the sons of man to be occupied with[a].
translation:
  language: zh_hans
  text: 我看见了上帝交给世人去操劳的事务[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“去忙于其中”或“因它受苦”。这句希伯来语较难确定，既可能强调人忙于这事务，也可能强调人受这事务的重压。
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאִיתִי
  choice: 我看见了
  rationale: 这是ראה的Qal完成式第一人称单数。传道者在此陈述自己经过观察所得的认识；“我看见了”既贴近希伯来语体貌，也符合现代汉语的反思性叙述。
- source_word: הָעִנְיָן
  choice: 事务
  rationale: עִנְיָן在《传道书》中指人所从事、承担的事情或工作。“事务”保留其范围较宽的特点，不把它过早限定为单一任务，也能承接其中可能带有的劳苦意味。
- source_word: אֲשֶׁר נָתַן אֱלֹהִים
  choice: 上帝交给
  rationale: נתן本义为“给”；在涉及人所承担的事务时，译作“交给”自然地表达这事由上帝给予人去面对或从事，同时不额外说明其目的。
- source_word: לִבְנֵי הָאָדָם
  choice: 世人
  rationale: 该短语直译为“人的众子”，在这里是指全体人类。现代汉语“世人”准确传达其集合性、普遍性，并避免生硬且可能被误解为仅指男性后代的直译。
- source_word: לַעֲנוֹת בּוֹ
  choice: 去操劳
  rationale: ענה与介词ב连用的表达含义较难确定，可能指忙于、劳作于，也可能含受苦或受重压之意。“操劳”兼有从事和劳苦的色彩，适合上下文；其他可能译法列入脚注，以保留原文歧义。
theological_decisions:
- issue: לִבְנֵי הָאָדָם所指的范围
  choice: 世人
  alternative: 人的众子；人类
  rationale: 原文采用阳性复数惯用语，却具有泛指全人类的代表性意义。“世人”在现代汉语中自然、庄重，并未把所指范围缩小为男性。
- issue: לַעֲנוֹת בּוֹ的语义
  choice: 去操劳
  alternative: 忙于其中；因它受苦
  rationale: 该结构可侧重人被事务占据、在其中劳作，或被它困苦。“操劳”保留从事与负重两方面的张力，脚注则明确列出较强的替代读法，避免武断消除歧义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“上帝”与全书称谓保持一致；“事务”和“操劳”共同保留本节关于人类活动既是受托之事、又可能成为重担的张力。
