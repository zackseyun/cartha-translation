  text: אָמַ֤רְתִּֽי אֲנִי֙ בְּ/לִבִּ֔/י עַל דִּבְרַת֙ בְּנֵ֣י הָ/אָדָ֔ם לְ/בָרָ֖/ם הָ/אֱלֹהִ֑ים וְ/לִ/רְא֕וֹת שְׁ/הֶם בְּהֵמָ֥ה הֵ֖מָּה לָ/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/003/018.yaml
  text: I said in my heart concerning the sons of man, that God is testing them, and to show them that they themselves are beasts.
translation:
  language: zh_hans
  text: 我心里想：“至于世人，神试验他们，为要使他们看出[a]，他们自己就是兽。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “使他们看出”原文直译为“并看见”。此处也可理解为“并让他们看见”；原文没有明示“看见”这一动作的主语。
    reason: 保留וְלִרְאוֹת在主语及是否具有使动含义上的歧义。
lexical_decisions:
- source_word: אָמַרְתִּי אֲנִי בְּלִבִּי
  choice: 我心里说
  rationale: 这是希伯来语表达内心思量的惯用说法；保留“心”的源语意象，在现代汉语中也自然明白。
- source_word: עַל דִּבְרַת בְּנֵי הָאָדָם
  choice: 至于世人
  rationale: עַל דִּבְרַת引出所思考的事项，译作“至于”简洁自然；בְּנֵי הָאָדָם字面为“人的众子”，具有泛指全人类的代表性，在不具语法性别的现代汉语中，“世人”准确传达其范围，且避免生硬直译。
- source_word: לְבָרָם
  choice: 神要试验他们
  rationale: 将ברר理解为检验、试炼或辨明其本相；“试验”既保留过程性，也不预先断定试验的结果。
- source_word: וְלִרְאוֹת
  choice: 也要让他们看出
  rationale: 按上下文将字面的“并要看见”理解为使世人认识自己的处境；由于希伯来文在主语和使动含义上存在歧义，主文采用通顺的语境性译法，并以脚注保留其他读法。
- source_word: שֶׁהֵם בְּהֵמָה הֵמָּה לָהֶם
  choice: 他们自己就是兽
  rationale: 重复的人称代词带有强调意味，故译作“他们自己”；原文使用直接的名词判断而非“像兽一样”，所以译作“就是兽”，保留其尖锐力度及人与兽共有必死处境的张力。
theological_decisions:
- issue: 人与兽的比较是直接判断还是明喻
  choice: 他们自己就是兽
  alternative: 他们像兽一样
  rationale: 希伯来文没有表示“像”的比较词，而是直接以בְּהֵמָה作谓语。译文不把这一强烈陈述弱化为明喻，也不借此推演为对人类全部身份的概括；其具体含义由上下文中人与兽同样必死的论述来限定。
- issue: וְלִרְאוֹת的主语与语态
  choice: 神要让他们看出
  alternative: 并要看见；并让他们看见；而我要看见
  rationale: 上下文适合将其理解为神借试验使世人认识自身处境，但希伯来语形式本身只是“并要看见”，没有明示使动语态或主语，因此用脚注公开保留歧义。
- issue: בְּנֵי הָאָדָם的性别与代表范围
  choice: 世人
  alternative: 人的众子；人类
  rationale: 源语形式为阳性复数，但具有代表全人类的作用。现代汉语没有与之对应的语法性别形式；“世人”既涵盖代表范围，又比“人的众子”自然，未额外引入性别排除。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“至于世人”保持传道者反思论述的语气；“就是兽”刻意保留原文直接而刺耳的判断，不用“像兽一样”加以缓和。
