- from: 我心里说：“至于世人，神要试验他们，也要让他们看出[a]，他们自己就是兽。”
  to: 我心里想：“至于世人，神试验他们，为要使他们看出[a]，他们自己就是兽。”
  rationale: 修订使中文更符合现代庄重书面语，并以“为要使”表达上下文中可成立的目的／使动理解；脚注则以不预设主语的方式保留原文“并看见”的形式歧义。其余措辞保持不变，以维持原文关于世人、试验及人与兽直接并置的力度。
