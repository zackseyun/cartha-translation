base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/003/005.yaml
  text: A time to throw stones[a], and a time to gather stones; a time to embrace, and a time to refrain from embracing.
translation:
  language: zh_hans
  text: 有时抛掷石头[a]，有时收聚石头；有时拥抱，有时避免拥抱。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “抛掷石头……收聚石头”也可译作“扔石头……收集石头”。希伯来文的意象可以按字面理解；也有人认为它可能涉及人际关系、农事或战争，但原文没有明确说明。
    reason: 说明词汇替代译法，并保留该意象的解释开放性。
lexical_decisions:
- source_word: עֵת
  choice: 有时
  rationale: עֵת可指某一时刻或时期。译作“有时”既自然，也保持本诗反复出现的简洁句式。
- source_word: לְהַשְׁלִיךְ
  choice: 抛掷
  rationale: 该词为שלך的使役式不定词，意为扔、抛。采用“抛掷”保留具体动作和诗体的庄重感。
- source_word: אֲבָנִים
  choice: 石头
  rationale: אֶבֶן通常指石头；直译可保留希伯来文未加解释的意象。
- source_word: כְּנוֹס
  choice: 收聚
  rationale: כנס意为聚集、收集。“收聚”与“抛掷”形成清楚而凝练的对照。
- source_word: לַחֲבוֹק
  choice: 拥抱
  rationale: חבק意为抱住、拥抱；“拥抱”既可表达实际动作，也能保留可能的关系层面含义。
- source_word: לִרְחֹק מֵחַבֵּק
  choice: 远离拥抱
  rationale: 原文רחק מן较直地表达与某行为保持距离。译作“远离拥抱”保留原文措辞及其略显张力的表达，不把它完全释义为“克制不抱”。
theological_decisions:
- issue: 抛掷和收聚石头的意象所指
  choice: 在正文中保留字面意象，不限定其含义
  alternative: 将其明确解释为人际关系、农业清理土地或战争行为
  rationale: 希伯来文本没有说明这些动作的具体场景；直接保留意象可避免把某一种解释写入正文。
- issue: “远离拥抱”的范围
  choice: 保留宽泛而未限定的表达
  alternative: 译为“停止拥抱”或“避免亲密关系”
  rationale: 原文只表达远离拥抱这一动作，并未说明原因、对象或伦理评价，因此不作神学或关系层面的具体化。
translation_notes:
  register: 采用现代、庄重而简洁的诗体。四个分句保持“……有时”的重复结构，以呼应原文עֵת的韵律；正文不补入原文未明说的情境。
