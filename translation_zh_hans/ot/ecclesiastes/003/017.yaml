base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/003/017.yaml
  text: I said in my heart[a], “God will judge the righteous and the wicked[b], for there is a time for every matter and for every deed there.”
translation:
  language: zh_hans
  text: 我心里想：“上帝必审判义人和恶人，因为在那里，各样事情和一切行为都有时候。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָמַרְתִּי אֲנִי בְּלִבִּי
  choice: 我心里说
  rationale: 保留希伯来语“在心里说”的内在思量意象，同时符合现代汉语表达。
- source_word: הַצַּדִּיק וְאֶת הָרָשָׁע
  choice: 义人和恶人
  rationale: 两个形容词均作名词用，构成鲜明的伦理对照；“义人”和“恶人”简洁、庄重，也不把含义限缩为法庭上的无罪与有罪。
- source_word: יִשְׁפֹּט הָאֱלֹהִים
  choice: 上帝必审判
  rationale: 未完成式在此语境中指向将来的裁断；“必”既表达未来性，也传达传道者结论的确定语气。
- source_word: עֵת
  choice: 定时
  rationale: 呼应本章反复出现的“时候”主题，并表达某事有其适当或指定时机，但不额外说明是谁指定。
- source_word: לְכָל חֵפֶץ
  choice: 各样事务
  rationale: חֵפֶץ可指意愿、目的或事情；本节采用较宽泛的“事务”，避免把它单独解释成主观愿望或预定目的。
- source_word: וְעַל כָּל הַמַּעֲשֶׂה
  choice: 和一切行为
  rationale: מַעֲשֶׂה可指工作、作为或行为；在上帝审判的语境中，“行为”自然传达受评断的作为。
- source_word: שָׁם
  choice: 就在那里
  rationale: 保留马所拉文本句末的地点副词及其突兀感，不把它径直改译为“那时”或省略。加入“就”使句末成分在现代汉语中尚可成立，却仍未明确“那里”具体指什么。
theological_decisions:
- issue: 句末שָׁם与上帝审判之间的关系
  choice: 正文保留为句末的“就在那里”
  alternative: 省略；译作“那时”；或明确译作“在审判之处”
  rationale: 原文确有שָׁם，其确切所指并不清楚，可能指上帝施行审判的场域或时机。正文不将这种含混解释为某一确定地点、时刻或末世场景。
- issue: יִשְׁפֹּט所表达的时间与确定性
  choice: 上帝必审判
  alternative: 上帝审判；上帝将要审判
  rationale: 上下文是传道者面对世间不公所得出的将来性判断。“必审判”自然表达其确定结论，但不进一步规定审判发生的方式和时间。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“我心里说”保留希伯来语意象；“义人和恶人”沿用清晰的伦理类别。末句因原文本身省略系词且שָׁם所指含混，中文刻意保留轻微的突兀感，并用脚注说明，而不在正文中消解难点。
