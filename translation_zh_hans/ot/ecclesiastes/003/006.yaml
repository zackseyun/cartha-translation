translation:
  language: zh_hans
  text: 寻找有时[a]，失去有时；保留有时[b]，丢弃有时。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“搜寻有时，放弃寻找、视为失去有时。”
    reason: lexical_alternative
  - marker: b
    text: “保留”也可译作“保存”或“守护”；“丢弃”也可译作“抛开”。
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵת
  choice: 有时
  rationale: עֵת指某个时候或适当时机。采用“有时”既符合现代汉语诗句的自然表达，也保留全段反复出现的节奏。
- source_word: לְבַקֵּשׁ
  choice: 寻找
  rationale: בקּשׁ的皮埃勒式在此意为寻找、搜寻；“寻找”简洁自然，并与下句形成鲜明对举。
- source_word: לְאַבֵּד
  choice: 失落
  rationale: אבד在这一对句中与“寻找”相对，可指失去或任其失落。译作“失落”保留原文在无意失去与不再寻找之间的含混，不武断增添主动放弃的意思。
- source_word: לִשְׁמוֹר
  choice: 保留
  rationale: שׁמר可指守护、保存或保留；与“丢弃”相对时，“保留”最符合现代汉语用法。
- source_word: לְהַשְׁלִיךְ
  choice: 丢弃
  rationale: שלך的使役式意为扔、抛；在与“保留”的对举中，“丢弃”自然地表达舍去之意，同时避免过于古雅。
