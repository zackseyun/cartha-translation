source:
  edition: WLC
  text: וּ/מִ֣י יוֹדֵ֗עַ הֶֽ/חָכָ֤ם יִהְיֶה֙ א֣וֹ סָכָ֔ל וְ/יִשְׁלַט֙ בְּ/כָל עֲמָלִ֔/י שֶֽׁ/עָמַ֥לְתִּי וְ/שֶׁ/חָכַ֖מְתִּי תַּ֣חַת הַ/שָּׁ֑מֶשׁ גַּם זֶ֖ה הָֽבֶל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/002/019.yaml
  text: And who knows whether he will be wise or foolish? Yet he will rule over all my labor in which I labored and used wisdom under the sun[a]. This too is vanity.
translation:
  language: zh_hans
  text: 谁知道他会是智慧人还是愚昧人呢？然而，他却要掌管我在日光之下劳碌并运用智慧所得的一切。这也是虚空[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “虚空”也可理解为“气息、转瞬即逝”，或“徒然”。希伯来语 הֶבֶל 在《传道书》中含有多重意味。
    reason: 说明关键词的词义范围，保留原文关于短暂、难以把握与徒然之间的张力。
lexical_decisions:
- source_word: וּמִי יוֹדֵעַ
  choice: 谁知道……呢
  rationale: 以现代汉语自然表达不确定的反问语气；不把句首连接词过度解释为特定的逻辑关系。
- source_word: הֶחָכָם יִהְיֶה אוֹ סָכָל
  choice: 他会是智慧人还是愚昧人
  rationale: 保留智慧与愚昧的鲜明对照，并将希伯来语间接疑问自然地译成汉语。
- source_word: וְיִשְׁלַט
  choice: 然而，他却要掌管
  rationale: “掌管”准确表达拥有支配权；“然而……却”显明上下文中的反差：无论继承者智慧还是愚昧，他都将取得控制权。
- source_word: בְּכָל עֲמָלִי שֶׁעָמַלְתִּי
  choice: 我……劳碌……所得的一切
  rationale: “劳碌”保留 עמל 所含辛劳意味；“所得的一切”以自然汉语表达这里劳碌及其成果受继承者掌管的语境。
- source_word: וְשֶׁחָכַמְתִּי
  choice: 并运用智慧
  rationale: 这里的动词指明智地行事或施用智慧，不只是拥有智慧；“运用智慧”保留这一主动含义。
- source_word: תַּחַת הַשָּׁמֶשׁ
  choice: 在日光之下
  rationale: 保留《传道书》中反复出现的重要措辞，指人在世上的生活领域。
- source_word: גַּם זֶה הָבֶל
  choice: 这也是虚空
  rationale: “虚空”是本书关键词的传统且庄重的汉语表达，同时借脚注保留其“气息、转瞬即逝”及“徒然”等语义张力。
theological_decisions:
- issue: 《传道书》中 הֶבֶל 的译法
  choice: 虚空
  alternative: 气息、转瞬即逝；徒然
  rationale: 该词本义与气息、雾气相关，在本书中可传达短暂、难以把握和徒然等多重意味。“虚空”保留全书关键词的一致性，但不把它缩减为“毫无意义”；其他可能含义在脚注中说明。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“智慧人／愚昧人”“日光之下”“虚空”维持《传道书》的主题性用语；句法略作汉语化处理，使继承者掌管劳碌所得这一含义清楚自然。
