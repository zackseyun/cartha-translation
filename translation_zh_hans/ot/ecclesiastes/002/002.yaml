  yaml_path: translation/ot/ecclesiastes/002/002.yaml
  text: I said of laughter[a], “It is madness,” and of pleasure, “What does this accomplish?”
translation:
  language: zh_hans
  text: 论到欢笑，我说：“这是疯狂”；论到喜乐，我说：“这能成就什么呢？”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִשְׂחוֹק
  choice: 论到欢笑
  rationale: שְׂחוֹק 指欢笑、嬉乐；前缀 ל־ 与 אמר 连用时可标示谈论或评价的对象。译作“论到欢笑”既贴合句法，也与下半句形成自然平行。
- source_word: אָמַרְתִּי
  choice: 我说
  rationale: 这是 אמר 的 Qal 完成式第一人称单数。上下文虽带有自我反思色彩，本节却没有明说“对自己”，因此不作增译。
- source_word: מְהוֹלָל
  choice: 这是疯狂
  rationale: 该词在此表达愚妄、失常或疯狂的负面判断。采用名词性表述“疯狂”，自然地评价“欢笑”这一现象，同时保留原文强烈语气。
- source_word: וּלְשִׂמְחָה
  choice: 论到喜乐
  rationale: שִׂמְחָה 可指喜乐、欢愉或享乐。译作“喜乐”保留其较宽的语义范围，不把它限缩为感官享乐，并维持与“欢笑”的对应。
- source_word: מַה זֹּה עֹשָׂה
  choice: 这能成就什么呢
  rationale: עשה 基本义为“做、产生”，此处疑问着眼于喜乐究竟带来何种结果或功效。“成就什么”以自然中文传达这一结果性意味，而不额外加入“益处”等原文未明说的概念。
