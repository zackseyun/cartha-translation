source:
  edition: WLC
  text: וְ/כֹל֙ אֲשֶׁ֣ר שָֽׁאֲל֣וּ עֵינַ֔/י לֹ֥א אָצַ֖לְתִּי מֵ/הֶ֑ם לֹֽא מָנַ֨עְתִּי אֶת לִבִּ֜/י מִ/כָּל שִׂמְחָ֗ה כִּֽי לִבִּ֤/י שָׂמֵ֨חַ֙ מִ/כָּל עֲמָלִ֔/י וְ/זֶֽה הָיָ֥ה חֶלְקִ֖/י מִ/כָּל עֲמָלִֽ/י־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/002/010.yaml
  text: And whatever my eyes desired I did not withhold from them[a]; I did not keep my heart from any pleasure, for my heart rejoiced in all my labor[c][b], and this was my portion from all my labor.
translation:
  language: zh_hans
  text: 凡我眼所求的，我没有一样扣留不给我的眼睛[a]；我没有拦阻自己的心去享受任何快乐[b]，因为我的心因我一切的劳碌[c]而欢喜；这是我从一切劳碌所得的份。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“凡我眼睛所求的，我没有扣留不给它们。”
    reason: 保留שׁאל“求、索求”和אָצל“扣留”的较直译表达。
  - marker: b
    text: 或译：“我没有抑制自己的心，使它得不到任何喜乐。”
    reason: מנע可译为“抑制、阻止”，שִׂמְחָה也可译为“喜乐”。
  - marker: c
    text: “劳碌”在本节两处也可译为“辛劳”。
    reason: עָמָל可指费力的工作或辛劳；本节两处均为同一希伯来词。
lexical_decisions:
- source_word: שָׁאֲלוּ עֵינַי
  choice: 我眼中想要的
  rationale: שׁאל本义为“求、索求”，以“眼睛”为主语时表达眼目所欲求的事物。译文保留“眼”的意象，同时用现代汉语自然表达欲望。
- source_word: לֹא אָצַלְתִּי מֵהֶם
  choice: 我都没有不给它们
  rationale: אָצַל在此指扣留、不给；“它们”回指“我的眼睛”，尽量保留希伯来语拟人化结构，而不直接扩写为“凡想要的都满足”。
- source_word: לֹא מָנַעְתִּי אֶת לִבִּי מִכָּל שִׂמְחָה
  choice: 我没有拦着自己的心，不让它享受任何快乐
  rationale: מנע表示阻止、限制或扣留；“拦着自己的心”保留“心”作为内在自我的希伯来表达，并以补充结构使中文语义清楚。שִׂמְחָה译为“快乐”，兼顾喜乐与享受的语境。
- source_word: כִּי לִבִּי שָׂמֵחַ מִכָּל עֲמָלִי
  choice: 因为我的心从我一切的劳碌中得着快乐
  rationale: 保留“我的心”这一主体，并将מן理解为快乐的来源，即劳碌及其成果带来快乐；不把它缩减为单纯“因工作而高兴”。
- source_word: עֲמָלִי
  choice: 我的劳碌
  rationale: עָמָל在《传道书》中常兼有辛劳、费力工作及其成果的意味。“劳碌”符合全书语体，并在本节两处保持一致。
- source_word: חֶלְקִי
  choice: 我所得的分
  rationale: חֵלֶק指归给一个人的份额或所得。“所得的分”在现代汉语中清楚，也保留《传道书》中“分”这一主题词。
theological_decisions:
- issue: 劳碌与快乐之间的关系
  choice: 译作“从我一切的劳碌中得着快乐”
  alternative: “因我一切的劳碌而快乐”或“在我一切的劳碌中快乐”
  rationale: 介词מן可表达来源，也可能在汉语中按因由理解。正文采用“从……中得着”，既指出快乐来自劳碌及其成果，又不把这句话解释成对劳碌本身的绝对肯定。
- issue: “这”所指为何
  choice: 保留“这就是……所得的分”
  alternative: 明确译成“这种快乐就是……”
  rationale: 原文וְזֶה中的指示代词可回指前述快乐或整体经历。正文不补出具体所指，以保存原文的指代弹性。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留“眼”“心”“劳碌”“分”等希伯来智慧文学的重要意象和主题词；通过自然汉语句式避免生硬直译。所有脚注标记均置于正文相应位置。
