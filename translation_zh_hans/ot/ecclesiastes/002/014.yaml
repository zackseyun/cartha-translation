base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/002/014.yaml
  text: The wise man has his eyes in his head[a], but the fool walks in darkness. Yet I also knew that one fate happens to them all.
translation:
  language: zh_hans
  text: 智慧人的眼睛在他头上，愚昧人却在黑暗中行走；然而我也知道，同一遭遇[a]会临到他们所有人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“同一件事”。希伯来语 מִקְרֶה 指临到人的事，依语境可表示“事情”“遭遇”或“命运”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶחָכָם
  choice: 智慧人
  rationale: חָכָם指有智慧的人。汉语“智慧人”简洁地保留了与“愚昧人”的对应，不必借语法阳性额外强调男性。
- source_word: עֵינָיו בְּרֹאשׁוֹ
  choice: 眼睛在他头上
  rationale: 较直译地保留希伯来文具体而鲜明的意象，表达智慧人有洞察力、能看清道路；不直接改写为“看得清楚”，以免消解原文比喻。
- source_word: וְהַכְּסִיל
  choice: 愚昧人却
  rationale: כְּסִיל指愚昧人；连接词在此构成鲜明对照，用“却”符合现代汉语行文。
- source_word: בַּחֹשֶׁךְ הוֹלֵךְ
  choice: 在黑暗中行走
  rationale: 保留“行走”与“黑暗”的比喻，不限定黑暗究竟是认知、道德还是处境层面的。
- source_word: וְיָדַעְתִּי גַם אֲנִי
  choice: 然而我也知道
  rationale: “然而”显出转折：智慧虽有优势，共同的遭遇仍临到双方；“也”保留גַם，并以“我”体现说话者的强调。
- source_word: שֶׁמִּקְרֶה אֶחָד
  choice: 同一种遭遇
  rationale: מִקְרֶה可指发生的事或临到人的遭遇。“同一种遭遇”在汉语中自然，并保留原文没有在本节明说该遭遇为何的含蓄性。
- source_word: יִקְרֶה אֶת כֻּלָּם
  choice: 会临到他们所有人
  rationale: קרה表示发生或临到；此译法既自然，又保留כֻּלָּם的普遍范围。
theological_decisions:
- issue: 共同遭遇是否应明确译为死亡
  choice: 不在正文中明确为“死亡”，译作“同一种遭遇”
  alternative: 同一死亡结局会临到他们所有人
  rationale: 上下文很可能指向死亡，但本节的מִקְרֶה本身较宽泛。保留其词义张力，避免把上下文推论写成明说内容。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。保留“眼睛在他头上”和“在黑暗中行走”的平行意象，并以“却”“然而”清楚呈现先对照、后转折的论述结构。
