  yaml_path: translation/ot/ecclesiastes/002/020.yaml
  text: So I turned to despair in my heart over all the labor at which I had labored under the sun[a][b].
translation:
  language: zh_hans
  text: 于是，我转而使自己的心因我在日光之下所劳碌的一切而绝望[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“于是，我转而使自己的心绝望”，或“于是，我心里便放弃了希望。”希伯来语的表达很紧凑，可以有几种相近的理解和译法。
    reason: lexical_alternative
  - marker: b
    text: “日光之下”是《传道书》反复使用的说法，指现今世上的生活及其地上的领域。
    reason: cross_reference
lexical_decisions:
- source_word: וְסַבּוֹתִי
  choice: 于是，我转而
  rationale: סבב的Qal完成式第一人称单数在此表示思想或态度的转向；“于是，我转而”既承接上文，也保留方向改变的意象。
- source_word: לְיַאֵשׁ אֶת־לִבִּי
  choice: 让自己的心……感到绝望
  rationale: 不定式לְיַאֵשׁ带直接宾语“我的心”，较直译地呈现为使自己的心陷入绝望；“心”保留希伯来语所涵盖的思想、意志与情感，不缩窄为“头脑”。
- source_word: עַל כָּל הֶעָמָל
  choice: 对……所劳碌的一切
  rationale: עַל引出绝望所针对的事情；עָמָל含艰辛、令人疲惫的劳作意味，以“劳碌”符合《传道书》的常用语感。
- source_word: שֶׁעָמַלְתִּי
  choice: 我……所劳碌的
  rationale: 使用“劳碌”回应同根名词עָמָל，尽量保留原文名词与动词重复所形成的强调；汉语中将“劳碌的一切”名词化，较为自然。
- source_word: תַּחַת הַשָּׁמֶשׁ
  choice: 在日光之下
  rationale: 这是《传道书》中反复出现的固定表达，应一致翻译；“日光之下”庄重、清楚，并保留原文意象。
theological_decisions:
- issue: 说话者与“心”的关系
  choice: 让自己的心……感到绝望
  alternative: 我心里感到绝望／我便灰心
  rationale: 原文将“我的心”作为לְיַאֵשׁ的直接宾语，可能表达主动使内心绝望或放弃希望。正文保留这一紧凑而略带张力的表达，不将其完全化约为单纯的情绪状态。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“让自己的心……感到绝望”略保留原文使动结构及其语义张力；以脚注提供更自然及更直译的替代方案。所有脚注标记均已置于正文。
