  text: וּ/פָנִ֤יתִֽי אֲנִי֙ לִ/רְא֣וֹת חָכְמָ֔ה וְ/הוֹלֵל֖וֹת וְ/סִכְל֑וּת כִּ֣י מֶ֣ה הָ/אָדָ֗ם שֶׁ/יָּבוֹא֙ אַחֲרֵ֣י הַ/מֶּ֔לֶךְ אֵ֥ת אֲשֶׁר כְּבָ֖ר עָשֽׂוּ/הוּ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/002/012.yaml
  text: So I turned to consider wisdom[a], madness, and folly; for what can the man do who comes after the king? Only what has already been done.
translation:
  language: zh_hans
  text: 于是，我转而考察智慧、癫狂和愚昧；因为在王之后来的人能做什么呢？不过是已经做过的事罢了。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本句末尾的希伯来语十分简略艰涩，较直译可作：“就是他们已经对他（或它）做过的。”其中动词为复数，带单数宾语后缀，施事及“他（或它）”所指均不明确。也可理解为：“不过是已经做过的事。”
    reason: 保留末句复数动词、单数宾语后缀及其指称关系所造成的语法与语义歧义。
lexical_decisions:
- source_word: וּפָנִיתִי
  choice: 于是，我转而
  rationale: פנה在这里表示思想和考察方向的转变；“转而”自然地承接前文，“于是”体现叙述推进。
- source_word: לִרְאוֹת
  choice: 考察
  rationale: ראה字面义为“看”，但以抽象概念为宾语时可指审视、思量；“考察”符合传道者探究人生的语境。
- source_word: חָכְמָה
  choice: 智慧
  rationale: 这是חָכְמָה在《传道书》中的常规对应词，兼含实际判断力与思想洞见。
- source_word: הוֹלֵלוֹת
  choice: 狂妄
  rationale: 该词在《传道书》中指失常、狂乱或荒唐的表现；“狂妄”保留其强烈而失控的色彩，并与下一个“愚昧”有别。
- source_word: סִכְלוּת
  choice: 愚昧
  rationale: סִכְלוּת表示愚蠢、缺乏判断；“愚昧”是庄重自然且适合智慧文学的表达。
- source_word: מֶה הָאָדָם
  choice: 那人还能做什么呢
  rationale: 原文直译近于“那人是什么”，句法高度压缩；结合后面的继任者从句，以反问句补出“能做什么”较能传达上下文中的限制，同时不把它理解为泛指全人类。
- source_word: שֶׁיָּבוֹא אַחֲרֵי הַמֶּלֶךְ
  choice: 在王之后来的人
  rationale: 保留“王”及“在……之后来”的表述，让“后来者”究竟是继位者还是一般后人保持一定开放性。
- source_word: אֵת אֲשֶׁר כְּבָר עָשׂוּהוּ
  choice: 不过是前人已经做过的事罢了
  rationale: 原句末尾有复数主语动词和第三人称单数宾语后缀，形式和所指均不明。“前人”以不定复数呈现隐含施事，“已经做过的事”传达后来者只能重复既有之事的主要语境含义；脚注保留更贴近字面的歧义。
theological_decisions:
- issue: הָאָדָם在单数反问句中的指称
  choice: 在王之后来的人
  alternative: 人类；一个人；继位者
  rationale: 这里所指是王之后出现的单个人物，而非抽象意义上的全人类；译文保留单数个体含义，又不武断认定他必定是正式继位者。
- issue: 末句对后来者能力的限制
  choice: 不过是前人已经做过的事罢了
  alternative: 他们已经对他做过的事；已经做成的事
  rationale: 希伯来语末句本身艰涩，可能涉及“他”或“它”，不宜据此建立超出文本的神学结论。正文采用最符合上下文的重复既有之事之意，脚注明确原文的不确定性。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“考察”呼应智慧文学的探究语气；“狂妄”和“愚昧”构成清楚但不过度口语化的对照。反问与“不过……罢了”保留原文的修辞力度。
