id: ECC.2.1
reference: Ecclesiastes 2:1
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: אָמַ֤רְתִּֽי אֲנִי֙ בְּ/לִבִּ֔/י לְכָ/ה נָּ֛א אֲנַסְּ/כָ֛ה בְ/שִׂמְחָ֖ה וּ/רְאֵ֣ה בְ/ט֑וֹב וְ/הִנֵּ֥ה גַם ה֖וּא הָֽבֶל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/002/001.yaml
  text: I said in my heart[a], “Come now, I will test you with pleasure; so enjoy what is good.” But look[c][b], this too is vapor.
translation:
  language: zh_hans
  text: 我心里[a]说：“来吧！我要用喜乐试试你；你且享受美好的事物[b]。”然而，看哪，这也是雾气[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“我在心里说”，指内心自语。
    reason: lexical_alternative
  - marker: b
    text: 直译“看见美好”；这里是亲身经历或享受美好的意思。
    reason: lexical_alternative
  - marker: c
    text: 或译“气息”“虚空”。希伯来语“雾气”是《传道书》反复使用的意象，表达事物短暂、难以捉摸或缺乏实体；它不一定仅指“毫无意义”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אָמַרְתִּי אֲנִי בְּלִבִּי
  choice: 我心里说
  rationale: 保留希伯来语“在心里说”的内在自语意象，同时符合现代汉语表达。
- source_word: לְכָה נָּא
  choice: 来吧
  rationale: 这是说话者对自己的劝发；“来吧”自然地传达其语用力度，不把 נָא 生硬译成礼貌性的“请”。
- source_word: אֲנַסְּכָה
  choice: 我要……试试你
  rationale: נסה 表示试验、测试；保留第二人称“你”，呈现传道者把自己的心或自身当作试验对象的修辞。
- source_word: בְשִׂמְחָה
  choice: 用喜乐
  rationale: שִׂמְחָה 可指喜乐、欢欣或享乐；本句强调以喜乐作为体验性试验，译文避免过早将其限定为感官享乐。
- source_word: וּרְאֵה בְטוֹב
  choice: 你且享受美好的事物
  rationale: 字面近于“看见美好”，但该希伯来语习用法在此指亲身经历或享受美好；“享受美好的事物”在现代汉语中清楚自然。
- source_word: וְהִנֵּה
  choice: 然而，看哪
  rationale: הִנֵּה 引出说话者审视后的结论；“看哪”保留提示注意的功能，“然而”则表达上下文中的转折。
- source_word: גַם הוּא
  choice: 这也是
  rationale: 回指刚才所述以喜乐自试并享受美好的尝试。
- source_word: הָבֶל
  choice: 雾气
  rationale: הבל 本指气息、雾气之类转瞬即逝且难以捉摸之物；“雾气”保留全书反复出现的具体意象，避免直接解释成“毫无意义”。
theological_decisions:
- issue: 《传道书》中 הָבֶל 的主题性译法
  choice: 雾气
  alternative: 虚空；气息；毫无意义
  rationale: “雾气”保留原词短暂、难以把握、缺乏实体的隐喻张力，不把经文的判断缩减为单一的“毫无意义”，也不预先消解本书刻意保留的神学张力。
- issue: 喜乐试验的评价
  choice: 让“这也是雾气”评价整个尝试，不增译为道德谴责
  alternative: 把追求喜乐明确译成罪恶或毫无价值
  rationale: 原文对这一尝试作 הָבֶל 的判断，却没有在本节明确称其为罪；译文不额外导入宗派性或道德化结论。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“看哪”略带经文语体，用来保留 הִנֵּה 的提示功能；其余措辞避免古奥。“你且”使自我劝发自然，并与后面的第二人称保持一致。
