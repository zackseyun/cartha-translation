source:
  edition: WLC
  text: תַּ֣רְתִּי בְ/לִבִּ֔/י לִ/מְשׁ֥וֹךְ בַּ/יַּ֖יִן אֶת בְּשָׂרִ֑/י וְ/לִבִּ֞/י נֹהֵ֤ג בַּֽ/חָכְמָה֙ וְ/לֶ/אֱחֹ֣ז בְּ/סִכְל֔וּת עַ֣ד אֲשֶׁר אֶרְאֶ֗ה אֵי זֶ֨ה ט֜וֹב לִ/בְנֵ֤י הָ/אָדָם֙ אֲשֶׁ֤ר יַעֲשׂוּ֙ תַּ֣חַת הַ/שָּׁמַ֔יִם מִסְפַּ֖ר יְמֵ֥י חַיֵּי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/002/003.yaml
  text: I searched in my heart to draw my flesh along with wine[a], while my heart was guiding me with wisdom, and to lay hold of folly[b], until I might see what was good for the sons of man to do under the heavens during the number of the days of their lives.
translation:
  language: zh_hans
  text: 我心里探究：如何用酒牵引我的肉体[a]，同时我的心仍以智慧引导我，又如何把握愚妄，直到看清世人在天下一生有数的日子里做什么才好[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “用酒牵引我的肉体”所译的希伯来语搭配含义不易确定；也可理解为借酒尝试肉体的享乐，同时仍由智慧引导。
    reason: 说明原文罕见而困难的搭配，并保留主要解释可能。
  - marker: b
    text: “世人”原文直译为“人的众子”，是泛指人类的表达；“一生有数的日子”原文直译为“他们一生的日子之数”。
    reason: 交代希伯来语泛称形式及“日子有数”的字面意象。
lexical_decisions:
- source_word: תַּרְתִּי בְלִבִּי
  choice: 我心里探究
  rationale: תור表达有意的考察、探索；“心”在希伯来语中涵盖思想与意志。此译既保留内在探究的图景，也符合现代汉语。
- source_word: לִמְשׁוֹךְ בַּיַּיִן אֶת־בְּשָׂרִי
  choice: 怎样用酒牵引我的肉体
  rationale: משך本义为拉、牵引，此处搭配生硬且含义不确定。正文保留“牵引”的意象，不径自解释为畅饮、取乐或放纵；“怎样”使整句在汉语中可读。
- source_word: וְלִבִּי נֹהֵג בַּחָכְמָה
  choice: 同时我的心仍以智慧引导我
  rationale: נהג意为带领、引导；原文未明说宾语，汉语补出“我”。“仍”体现饮酒实验与智慧引导同时存在的张力。
- source_word: וְלֶאֱחֹז בְּסִכְלוּת
  choice: 我又怎样把握愚妄
  rationale: אחז是抓住、把持；“把握”保留主动接触和掌控的意味。סכלות译作“愚妄”，以维持《传道书》中与智慧相对的主题用语。
- source_word: עַד אֲשֶׁר אֶרְאֶה
  choice: 直到看明
  rationale: 该结构表示探索持续到获得认识；“看明”兼顾“看见”与辨明的语义，在现代汉语中自然。
- source_word: לִבְנֵי הָאָדָם
  choice: 世人
  rationale: 该短语字面为“人的众子”，在此泛指人类。汉语“世人”自然、庄重，并保留《传道书》观察普遍人世的语气。
- source_word: תַּחַת הַשָּׁמַיִם
  choice: 在天下
  rationale: 字面为“诸天之下”。“天下”是自然凝练的现代汉语表达，也保留其宇宙范围，而不机械复制希伯来语复数。
- source_word: מִסְפַּר יְמֵי חַיֵּיהֶם
  choice: 一生有限的日子里
  rationale: מִסְפַּר本义关乎可数的数目，强调人生有确定限度，并不明确说日子“很少”。此译使含义清楚，同时避免误加“短暂”。
theological_decisions:
- issue: 饮酒、智慧与愚妄之间的关系
  choice: 保留“用酒牵引肉体”“心仍以智慧引导”“把握愚妄”三者并置
  alternative: 解释为以智慧节制饮酒，借此尝试肉体享乐和愚妄
  rationale: 原文刻意形成张力，且“用酒牵引肉体”语义困难。正文不明确断定这是放纵、振奋身体或完全受控的实验，以免替原文解决含混。
- issue: בני האדם的泛指表达
  choice: 世人
  alternative: 人的众子／人类
  rationale: 此处语法形式为阳性泛称，但指向全体人。中文“世人”准确表达其普遍所指，不引入排除女性的含义，也不附加特定神学立场。
- issue: 人生日期的限度
  choice: 一生有限的日子
  alternative: 一生所有的日子／一生短暂的日子
  rationale: 原文强调日子有数，而未直接说明数目很少；“有限”保留受限、可数的观念，不强化为“短暂”。
translation_notes:
  register: 采用现代、庄重而可朗读的书面普通话。“牵引我的肉体”有意保留原文的不寻常和含混；其余句法适度汉语化，以免整句晦涩。所有脚注标记均已置于正文。
