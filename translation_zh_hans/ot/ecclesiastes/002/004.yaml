  text: הִגְדַּ֖לְתִּי מַעֲשָׂ֑/י בָּנִ֤יתִי לִ/י֙ בָּתִּ֔ים נָטַ֥עְתִּי לִ֖/י כְּרָמִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/002/004.yaml
  text: 'I made my works great: I built houses for myself[a]; I planted vineyards for myself.'
translation:
  language: zh_hans
  text: 我大兴工程[a]：为自己建造房屋，为自己栽种葡萄园。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我使自己的事业宏大”，或“我扩展自己的工程”。
    reason: 原文 הִגְדַּלְתִּי מַעֲשָׂי 可较形式地理解为使自己的工作、事业或工程变得宏大；正文采用符合上下文且自然的概括表达。
lexical_decisions:
- source_word: הִגְדַּלְתִּי מַעֲשָׂי
  choice: 我大兴工程
  rationale: 该短语直译近于“我使我的工作宏大”。结合下文建房、栽葡萄园等大型营造活动，“大兴工程”以自然的现代汉语表达使各项事业扩展、宏大的含义，同时脚注保留较形式对应的译法。
- source_word: בָּנִיתִי
  choice: 建造
  rationale: 直接对应 בנה 的 Qal 完成式；“建造”庄重自然，适合房屋这一宾语。
- source_word: לִי
  choice: 为自己
  rationale: 表达介词 ל 加第一人称后缀所含的自身受益或归己之意，并保留原文两次重复的强调。
- source_word: בָּתִּים
  choice: 房屋
  rationale: 采用该词通常意义，不因君王语境擅自具体化为“宫殿”。
- source_word: נָטַעְתִּי
  choice: 栽种
  rationale: 准确表达农业语境中的 נטע；“栽种葡萄园”是自然、清楚的现代汉语。
- source_word: כְּרָמִים
  choice: 葡萄园
  rationale: 这是 כרם 复数在本语境中的通常对应词。
theological_decisions: []
translation_notes:
  register: 采用现代、清楚而庄重的叙述语体。“我大兴工程”概括下文列举的建设与栽植活动；两个“为自己”均予保留，以呈现原文重复及其归己、自益的语气。
