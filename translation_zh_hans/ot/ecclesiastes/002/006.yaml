  yaml_path: translation/ot/ecclesiastes/002/006.yaml
  text: I made for myself pools of water, to irrigate from them a grove sprouting trees.
translation:
  language: zh_hans
  text: 我为自己修造蓄水池，用池里的水灌溉[b]一片长着树木的林地[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “林地”或译“森林”“树林”。希伯来语יַעַר可指森林或有树木的地带；这里因其受到人工灌溉，正文采用“林地”。
    reason: lexical_alternative
  - marker: b
    text: “灌溉”也可译“浇灌”或“使……得水喝”。希伯来语动词本义是“使喝水”，用于植物或土地时指供水、浇灌。
    reason: lexical_alternative
lexical_decisions:
- source_word: עָשִׂיתִי לִי
  choice: 我为自己修造
  rationale: עָשִׂיתִי是עשה的Qal完成式第一人称单数，לִי表示为自己受益。结合蓄水池这一人工设施，“修造”比泛指的“做”更自然，同时保留“为自己”的自我指向。
- source_word: בְּרֵכוֹת מָיִם
  choice: 蓄水池
  rationale: בְּרֵכוֹת可指水池或蓄水设施；上下文说明其用途是供水灌溉，因此“蓄水池”准确而简明。
- source_word: לְהַשְׁקוֹת מֵהֶם
  choice: 用池里的水灌溉
  rationale: שקה的Hiphil不定式表示使之饮水，施用于土地或植物时即“浇灌、灌溉”；מֵהֶם表示水源出自前述多个池子。汉语以“用池里的水”自然表达这一来源关系。
- source_word: יַעַר
  choice: 林地
  rationale: יַעַר通常指森林或有树木的地带。此处受人工水池灌溉，显然带有经营、栽培背景；“林地”既不把它说成纯天然森林，也不武断限定为小型树丛。
- source_word: צוֹמֵחַ עֵצִים
  choice: 长满树木的
  rationale: 该结构字面上描写林地生长、长出树木。译作“长满树木的”符合现代汉语，并保留树木正在生长或由该地长出的基本意象；其具体句法关系仍可作较直译理解。
theological_decisions: []
