revisions:
- from: 因为，神把智慧、知识和喜乐赐给在他面前为好的人[a]；至于罪人，神却把收聚积蓄的差事交给他，好把所得交给在神面前为好的人。这也是虚空，也是捕风[b]。
  to: 因为，神把智慧、知识和喜乐赐给在他看来是好的人[a]；至于罪人，神却把收聚积蓄的差事交给他，好把所得交给在神看来是好的人。这也是虚空，也是捕风[b]。
  rationale: 仅作安全的汉语表达修订：将两处生硬且可能歧义的“在……面前为好的人”改为“在……看来是好的人”，以准确、自然地表达原文“在其面前／眼中为好”的评价关系。其余措辞、对照、隐含宾语“所得”及脚注锚点均予保留。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T07:00:11Z'
