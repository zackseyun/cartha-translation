  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כִּ֤י לְ/אָדָם֙ שֶׁ/טּ֣וֹב לְ/פָנָ֔י/ו נָתַ֛ן חָכְמָ֥ה וְ/דַ֖עַת וְ/שִׂמְחָ֑ה וְ/לַ/חוֹטֶא֩ נָתַ֨ן עִנְיָ֜ן לֶ/אֱס֣וֹף וְ/לִ/כְנ֗וֹס לָ/תֵת֙ לְ/טוֹב֙ לִ/פְנֵ֣י הָֽ/אֱלֹהִ֔ים גַּם זֶ֥ה הֶ֖בֶל וּ/רְע֥וּת רֽוּחַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/002/026.yaml
  text: For to the man who is good before him he has given wisdom and knowledge and joy[a], but to the sinner he has given the task of gathering and collecting, to give to the one who is good before God[b]. This too is vanity and a chasing after wind.
translation:
  language: zh_hans
  text: 因为，神把智慧、知识和喜乐赐给在他看来是好的人[a]；至于罪人，神却把收聚积蓄的差事交给他，好把所得交给在神看来是好的人。这也是虚空，也是捕风[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“蒙他喜悦的人”或“蒙神喜悦的人”。希伯来文的字面意思是“在他／神面前是好的”。
    reason: 保留该希伯来惯用语在字面评价与“蒙喜悦”含义之间的可能性。
  - marker: b
    text: 或译：“追逐风”或“为风劳碌”。
    reason: 希伯来语短语רְעוּת רוּחַ的首词含义有争议，可表达追逐、劳碌，字面上也曾被理解为牧放。
lexical_decisions:
- source_word: לְאָדָם
  choice: 人
  rationale: 这里指与“罪人”相对的个体；现代汉语用“人”自然准确，不需额外标明性别。
- source_word: שֶׁטּוֹב לְפָנָיו
  choice: 在他面前为好的人
  rationale: 保留טוֹב“好”和“在……面前”的原文表达，同时让上下文中的“他”指向神；“蒙他喜悦”作为可能的惯用义收入脚注。
- source_word: נָתַן
  choice: 赐给／交给
  rationale: 同一希伯来语动词按受词和语境分别译为“赐给”与“交给”：智慧、知识、喜乐是恩赐，收聚积蓄则是被派定的差事。
- source_word: חָכְמָה וְדַעַת וְשִׂמְחָה
  choice: 智慧、知识和喜乐
  rationale: 直接保留三个并列名词，也呼应《传道书》中享乐为神所赐的主题。
- source_word: לַחוֹטֶא
  choice: 至于罪人
  rationale: 分词在这里刻画与“为好的人”相对的一类人；“罪人”简洁并保留鲜明对照。
- source_word: עִנְיָן
  choice: 差事
  rationale: 该词在《传道书》中常指被派定、使人忙碌的事务；“差事”比“工作”更能体现受命承担之意，又不额外强化为“重担”。
- source_word: לֶאֱסוֹף וְלִכְנוֹס
  choice: 收聚积蓄
  rationale: 以两个近义动词再现原文并列和累积意味，中文简洁自然。
- source_word: לָתֵת לְטוֹב לִפְנֵי הָאֱלֹהִים
  choice: 好把所得交给在神面前为好的人
  rationale: “所得”为使中文宾语关系清楚而补出的隐含内容；“在神面前为好”保留原文评价措辞，并与前半句呼应。
- source_word: הֶבֶל
  choice: 虚空
  rationale: 保留《传道书》的核心主题词及其短暂、空幻、徒劳的多重意味，不把它窄化为“毫无意义”。
- source_word: רְעוּת רוּחַ
  choice: 捕风
  rationale: 用现代读者可理解的凝练比喻表达徒劳追逐风的意思；原词组也可能强调“追逐”或“劳碌”，故列出脚注。
theological_decisions:
- issue: נָתַן的省略主语
  choice: 在译文中明确为神
  alternative: 保留无明确主语的“他赐给”
  rationale: 2:24已提到“神的手”，本节后半又明说“神”；明确神为赐予者符合近处语境，也避免中文独立成节时代词指向不明。
- issue: טוֹב לִפְנֵי הָאֱלֹהִים的评价含义
  choice: 在神面前为好
  alternative: 蒙神喜悦／讨神喜悦
  rationale: 原文既可按字面理解为神面前的“好”，也可作惯用语理解为“蒙神喜悦”。正文保留טוֹב的词义和神学张力，不把“好”完全改释为“喜悦”。
- issue: 罪人积蓄之物转归义人的陈述性质
  choice: 按经文陈述神所派定的差事及其结果
  alternative: 将其泛化为普遍、即时的报应法则
  rationale: 译文不加入时间、机制或普遍化措辞，以免把智慧文学中的观察扩展成经文未明说的系统性应许。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“虚空”和“捕风”保留《传道书》的主题性表达；句式以分号呈现“为好的人”与“罪人”的对照。所有脚注标记均置于对应正文之后。
