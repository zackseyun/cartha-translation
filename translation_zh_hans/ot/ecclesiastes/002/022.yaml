base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/002/022.yaml
  text: For what does a man gain from all his labor and from the striving of his heart with which he toils under the sun?[a]
translation:
  language: zh_hans
  text: 因为，人从自己在日光之下所作的一切劳碌，以及心中的操劳中，究竟得着什么呢？[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “心中的操劳”也可译作“心中的烦扰”“心中的追求”或“心中的思虑”。希伯来语 רַעְיוֹן 在《传道书》中可包含内在用力、思想追求或受困扰的意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，为前述判断提出解释；现代汉语中用“因为”保留其因果、说明作用。
- source_word: מֶה הֹוֶה לָאָדָם
  choice: 人……究竟得着什么呢
  rationale: הֹוֶה 的基本意义关乎存在或发生，与 לָאָדָם 连用时，是问有什么归给人、人成果何在；译作“得着什么”自然地表达此习语，而“究竟”凸显反问语气。
- source_word: לָאָדָם
  choice: 人
  rationale: 此处 אָדָם 泛指任何人；汉语“人”既保留单数代表性，也无需添加原文没有的性别限定。
- source_word: בְּכָל עֲמָלוֹ
  choice: 从日光之下的一切劳碌……中
  rationale: עָמָל 指辛苦劳作；介词 בְּ 在此语境表示问题所涉及或成果所出的范围，用“从……中”传达所得的来源。
- source_word: וּבְרַעְיוֹן לִבּוֹ
  choice: 以及……心里的操劳
  rationale: רַעְיוֹן 在《传道书》中可指内在的用心、追求或烦扰。“心里的操劳”与外在“劳碌”相呼应，并保留其兼有精神用力和困扰的开放性；其他可能义见脚注。
- source_word: לִבּוֹ
  choice: 心里
  rationale: “心”在希伯来语中涵盖思想、意志和情感；译作“心里”保留原文的人观，同时符合现代汉语表达。
- source_word: שֶׁהוּא עָמֵל
  choice: 劳碌时
  rationale: 关系从句说明人的内在操劳与其劳碌相伴。汉语以“劳碌时”简洁表达这种关联，避免生硬地直译关系结构。
- source_word: תַּחַת הַשָּׁמֶשׁ
  choice: 日光之下
  rationale: 这是《传道书》的反复用语，指现世生活的领域；采用庄重而通行的“日光之下”。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。以“劳碌”呼应本书反复出现的 עָמָל，以“日光之下”保留核心文学表达。主句用反问形式；脚注保留 רַעְיוֹן 的词义张力，不在正文中将其单一化。
