base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/002/015.yaml
  text: And I said in my heart[a], "As happens to the fool, so it will happen to me also. Why then was I more wise?" And I said in my heart that this too is vanity.
translation:
  language: zh_hans
  text: 我心里想：“愚昧人所遭遇的，我也必遭遇。那么，我为什么比他更有智慧呢？”我心里又想，这也是虚空[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“气息”“雾气”。希伯来语 הָבֶל 是《传道书》反复使用的主题词，可表达短暂、难以捉摸或徒劳。
    reason: 说明主题词的字面意象及其宽广语义，避免“虚空”被误解为单指毫无意义。
lexical_decisions:
- source_word: וְאָמַרְתִּי אֲנִי בְּלִבִּי
  choice: 我心里说
  rationale: 保留希伯来语“在心里说”的内在反思意象，同时符合现代汉语表达。
- source_word: כְּמִקְרֵה הַכְּסִיל גַּם אֲנִי יִקְרֵנִי
  choice: 愚昧人所遭遇的，我也必遭遇
  rationale: מִקְרֶה与יקר在此指临到人的遭遇；译文保留两者的词义呼应，并以“必”表达未完成式在语境中的将来指向。
- source_word: הַכְּסִיל
  choice: 愚昧人
  rationale: 这是智慧文学中兼具认知和道德意味的常用称谓；“愚昧人”比“笨人”更庄重，也不过度收窄含义。
- source_word: וְלָמָּה חָכַמְתִּי אֲנִי אָז יוֹתֵר
  choice: 那么，我为什么还格外有智慧呢？
  rationale: “那么”体现אָז在此的推论作用；“格外有智慧”保留חָכַמְתִּי与יוֹתֵר的程度比较，而不擅自补入“益处”等原文未明说的概念。
- source_word: וְדִבַּרְתִּי בְלִבִּי
  choice: 我心里又说
  rationale: דבר本义为“说、讲”，在内心独白中译作“说”自然；“又”承接前一层思索并表达附加关系。
- source_word: שֶׁגַּם זֶה הָבֶל
  choice: 这也是虚空
  rationale: “也”保留גַּם；“虚空”作为传道书主题词，能兼顾短暂、难以捉摸和徒劳等意蕴，又避免将其单一化为“毫无意义”。
theological_decisions:
- issue: 传道书主题词הָבֶל的译法
  choice: 虚空
  alternative: 气息、雾气、徒然
  rationale: “虚空”保留该词在传道书中的传统主题关联及宽广语义，不把作者的判断限定为纯粹的“毫无意义”；脚注同时说明其具体意象和语义张力。
- issue: 智慧与愚昧人遭遇相同所引发的疑问
  choice: 保留“为什么还格外有智慧”的开放式反问
  alternative: 译成“智慧过人又有什么益处”
  rationale: 原文提出为何拥有更多智慧的反问，但没有明说“益处”；直译式表达保留其神学和哲学张力，不替作者预先界定问题。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“我心里说”保留原文的人体意象和沉思语气；句式略带智慧文学的凝练感。脚注标记置于其实际说明的“虚空”之后。
