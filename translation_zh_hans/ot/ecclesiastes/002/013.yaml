  text: וְ/רָאִ֣יתִי אָ֔נִי שֶׁ/יֵּ֥שׁ יִתְר֛וֹן לַֽ/חָכְמָ֖ה מִן הַ/סִּכְל֑וּת כִּֽ/יתְר֥וֹן הָ/א֖וֹר מִן הַ/חֹֽשֶׁךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/002/013.yaml
  text: And I saw that wisdom has an advantage over folly[a], as light has an advantage over darkness.
translation:
  language: zh_hans
  text: 我看出，智慧胜过愚昧[a]，如同光明胜过黑暗。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“智慧比愚昧更有益处”。这里的希伯来词可指盈余、收益或优势；本节着重表达智慧优于愚昧。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאִיתִי אָ֔נִי
  choice: 我看出
  rationale: ראה的第一人称完成式表达亲身观察所得的认识；独立代词אָנִי带有强调，但现代汉语若译成“我亲自看出”容易误指亲眼目睹，故以自然的“我看出”承载语意，并由显式主语保留一定强调。
- source_word: שֶׁיֵּ֥שׁ יִתְר֛וֹן לַֽחָכְמָ֖ה
  choice: 智慧胜过
  rationale: יֵשׁ יִתְרוֹן לְ字面为“对……有优势/益处”；在本节的比较结构中，“胜过”自然、凝练地表达智慧所具有的相对优势。
- source_word: מִן הַסִּכְל֑וּת
  choice: 愚昧
  rationale: סִכְלוּת指愚昧、愚妄；“愚昧”是现代汉语中庄重而易懂的对应词，与“智慧”形成清晰对照。
- source_word: כִּֽיתְר֥וֹן הָ/א֖וֹר מִן הַ/חֹֽשֶׁךְ
  choice: 如同光明胜过黑暗
  rationale: 保留כְ所引出的类比，并以与前半句相同的“胜过”再现יִתְרוֹן…מִן的平行比较结构。
theological_decisions:
- issue: יִתְרוֹן在《传道书》中是否保留经济性的“利润”色彩
  choice: 译为“胜过”，表达比较上的优势
  alternative: 智慧比愚昧更有益处／智慧较愚昧有利润
  rationale: 本节以光明和黑暗作类比，重点是相对优越性，而非狭义的经济收益；“胜过”既符合语境，也不把该词限定为商业含义。
- issue: 光明与黑暗是否作明确的神学象征解释
  choice: 保留日常经验层面的比较，不增添象征说明
  alternative: 把光明、黑暗明确解释为善恶或属灵状态
  rationale: 原文在此直接用光相对于黑暗的优势说明智慧相对于愚昧的优势，未明说更具体的神学象征，因此不予扩展。
translation_notes:
  register: 采用现代、庄重而简洁的书面汉语。“智慧胜过愚昧……光明胜过黑暗”保留原文紧凑的平行结构和类比关系，普通读者亦易于理解。
