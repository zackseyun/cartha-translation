language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כָּנַ֤סְתִּי לִ/י֙ גַּם כֶּ֣סֶף וְ/זָהָ֔ב וּ/סְגֻלַּ֥ת מְלָכִ֖ים וְ/הַ/מְּדִינ֑וֹת עָשִׂ֨יתִי לִ֜/י שָׁרִ֣ים וְ/שָׁר֗וֹת וְ/תַעֲנוּגֹ֛ת בְּנֵ֥י הָ/אָדָ֖ם שִׁדָּ֥ה וְ/שִׁדּֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/002/008.yaml
  text: I also gathered for myself silver and gold[a], and the treasure of kings and provinces. I acquired for myself male singers and female singers[b], and the delights of the sons of man—a concubine and concubines.
translation:
  language: zh_hans
  text: 我也为自己积聚金银，以及君王和各省的珍宝；又为自己置备男女歌手，以及世人的享乐[a]——一个妃嫔和众妃嫔[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “世人”原文直译近于“人类之子”；这是希伯来语中泛指人类的惯用表达。
    reason: 说明希伯来语惯用表达的字面形式与泛指意义。
  - marker: b
    text: 译作“一个妃嫔和众妃嫔”的希伯来词含义不确定；也有人理解为“一个情妇和众情妇”、“男女斟酒侍者”，或概括地理解为“各样奢华享受”。
    reason: 原词罕见且解释分歧显著，需保留主要异读。
lexical_decisions:
- source_word: כָּנַסְתִּי לִי
  choice: 我也为自己积聚
  rationale: כָּנַס表示收集、聚拢；“积聚”自然传达持续累积财物的意思，לִי译为“为自己”，保留上下文中以自我为中心的语气。
- source_word: כֶּסֶף וְזָהָב
  choice: 金银
  rationale: 现代汉语中“金银”是简洁自然的固定搭配，准确指贵重金属及财富。
- source_word: סְגֻלַּת מְלָכִים וְהַמְּדִינוֹת
  choice: 君王和各省的珍宝
  rationale: סְגֻלָּה指珍贵产业或珍藏；מְדִינוֹת在此指行政区域，故译“各省”，不译作抽象的“国家”。
- source_word: עָשִׂיתִי לִי
  choice: 又为自己置备
  rationale: עָשָׂה本义宽泛，为“做、造”；在罗列财物与享受的语境中，“置备”比直译“制造”自然，同时不把动作过度限定为购买。
- source_word: שָׁרִים וְשָׁרוֹת
  choice: 男女歌手
  rationale: 原文以阳性和阴性形式并列，明确指男性歌手与女性歌手；“男女歌手”简洁保留这一区分。
- source_word: תַעֲנוּגֹת בְּנֵי הָאָדָם
  choice: 世人的享乐
  rationale: תַעֲנוּגֹת指令人愉悦的享受或奢华之物；בְּנֵי הָאָדָם是泛指人类的希伯来表达。“世人的享乐”既自然，又保留原文的泛指意义；字面形式另见脚注。
- source_word: שִׁדָּה וְשִׁדּוֹת
  choice: 一个妃嫔和众妃嫔
  rationale: 该罕见词词义极不确定。传统上常理解为后宫中的女子，与王室享乐的语境相合；译文保留原文单数与复数并列的异常形式，并在脚注列出主要异解。
theological_decisions:
- issue: בְּנֵי הָאָדָם的泛指表达
  choice: 世人
  alternative: 人的众子／人类
  rationale: 该短语在此泛指人类，不宜在现代汉语中译成容易被误认为特定称号的“人子”。“世人”自然准确，而脚注保留其字面结构。
- issue: 罕见词שִׁדָּה וְשִׁדּוֹת的处理
  choice: 一个妃嫔和众妃嫔
  alternative: 一个情妇和众情妇／男女司酒者／各样奢华享受
  rationale: 原词只在此处出现，词源和所指均有争议。正文采用与王室享乐语境相称的传统解释，但用脚注明示不确定性，避免把有争议的解释说成定论。
translation_notes:
  register: 采用现代、庄重而易懂的叙述语体。“积聚”“置备”“珍宝”适合王室财富与享乐的语境；正文不掩盖末句罕见词的异常单复数结构，并借脚注清楚交代其词义不确定性。
