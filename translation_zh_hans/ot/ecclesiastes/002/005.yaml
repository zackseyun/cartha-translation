  text: I made for myself gardens and parks[a], and I planted in them every kind of fruit tree.
translation:
  language: zh_hans
  text: 我为自己营造了园子和园林[a]，并在其中栽种了各样的果树。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “园林”或译“果园”。希伯来语 פַּרְדֵּסִים 指围合、经栽培的游赏园地或果园。
    reason: lexical_alternative
lexical_decisions:
- source_word: עָשִׂיתִי לִי
  choice: 我为自己建造
  rationale: עָשִׂיתִי是עשה的Qal完成式第一人称单数，表示“我做了/建造了”；לִי表示行为归于说话者自身的利益或所有，译作“为自己”。结合园子和园林作宾语，“建造”比宽泛的“做”更符合现代汉语。
- source_word: גַּנּוֹת
  choice: 园子
  rationale: 该词是גַּן的复数，指一般的花园、园圃。译作“园子”，既自然，也与后面较专门的פַרְדֵּסִים有所区别。
- source_word: פַרְדֵּסִים
  choice: 园林
  rationale: 该词可指围起来、经过栽培的园苑、果园或供游赏的园地。“园林”能表达规模较大且人工经营的园苑含义，又不把词义限定为只种果树的“果园”。另见脚注。
- source_word: וְנָטַעְתִּי בָהֶם
  choice: 在其中栽种
  rationale: נָטַע意为栽种；בָהֶם回指前面的园子和园林。汉语省去重复的第一人称主语仍清楚流畅，并保留两个行动的并列关系。
- source_word: עֵץ כָּל פֶּרִי
  choice: 各样的果树
  rationale: 字面结构近于“各种果子的树”。译作“各样的果树”符合现代汉语，并保留כָּל所表达的多样、周全之意。
theological_decisions: []
