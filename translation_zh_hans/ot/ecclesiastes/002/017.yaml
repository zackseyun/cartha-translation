  text: וְ/שָׂנֵ֨אתִי֙ אֶת הַ֣/חַיִּ֔ים כִּ֣י רַ֤ע עָלַ/י֙ הַֽ/מַּעֲשֶׂ֔ה שֶׁ/נַּעֲשָׂ֖ה תַּ֣חַת הַ/שָּׁ֑מֶשׁ כִּֽי הַ/כֹּ֥ל הֶ֖בֶל וּ/רְע֥וּת רֽוּחַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/002/017.yaml
  text: So I hated life[a], because the work that is done under the sun was grievous to me[b]; for everything is vapor and a chasing after wind.
translation:
  language: zh_hans
  text: 于是，我恨恶人生，因为日光之下所做的事使我痛苦；一切都是雾气[a]，都是追逐风[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “雾气”也可译作“虚空”或“气息”。希伯来文הֶבֶל（hebel）使人联想到短暂、虚幻或难以把握之物。
    reason: lexical_alternative
  - marker: b
    text: “追逐风”也可译作“捕风”；若更贴近该词可能具有的字面意象，则可译作“牧风”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׂנֵאתִי
  choice: 于是，我恨恶
  rationale: שׂנא的第一人称单数完成式表达传道者经过前文思考后形成的强烈反应；וְ按语篇推进译为“于是”，不只作简单并列。
- source_word: הַחַיִּים
  choice: 人生
  rationale: חַיִּים虽为复数形式，在此惯用地指人的生命或生活；“人生”比“生命”更自然地涵盖传道者所厌恶的整个在世生活。
- source_word: רַע עָלַי
  choice: 使我痛苦
  rationale: 字面近于“对我为恶／不好”，在此表达日光之下的活动给说话者造成的沉重、苦恼感；采用自然汉语而保留主观体验。
- source_word: הַמַּעֲשֶׂה שֶׁנַּעֲשָׂה
  choice: 所做的事
  rationale: 单数名词在此具有集合意义，指日光之下不断进行的人类活动；中文“所做的事”自然表达被动和概括性。
- source_word: תַּחַת הַשָּׁמֶשׁ
  choice: 日光之下
  rationale: 保留《传道书》反复出现的空间意象，指人在世上的生活领域。
- source_word: הַכֹּל
  choice: 一切
  rationale: 表达该词概括性的全部范围，并与前面的集合性“所做的事”衔接。
- source_word: הֶבֶל
  choice: 雾气
  rationale: 保留希伯来文“气息、雾气”的具体意象，传达短暂、虚幻和难以把握，而不把含义缩减为抽象的“徒劳”。
- source_word: וּרְעוּת רוּחַ
  choice: 都是追逐风
  rationale: 用清楚而形象的现代汉语表达追求无法抓住之物；保留“风”的意象，并在脚注说明该短语的其他可能译法。
theological_decisions:
- issue: הֶבֶל在《传道书》中的含义
  choice: 雾气
  alternative: 虚空、气息、徒然
  rationale: “雾气”优先保留原文的物质性比喻及其短暂、无定、难以掌握的多重意味，避免把经文预先限定为纯粹的道德虚荣或绝对无意义。
- issue: רְעוּת רוּחַ的解释
  choice: 追逐风
  alternative: 捕风、牧风、为风劳碌
  rationale: 该短语的词源和细微语义并非全无争议；正文采用现代读者容易理解的“追逐风”，脚注保留较直译和传统译法，不将其神学意味过度确定为单一概念。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“恨恶人生”保留原文强烈语气；分号呈现由个人痛苦转向总体判断的逻辑推进。脚注标记均置于相关词语之后。
