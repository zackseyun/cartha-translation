review_pass:
  verdict: revise
  source_fidelity: 译文准确呈现了智慧、知识、才干中的劳作，以及成果归给未曾为此劳作之人的反常处境。“虚空”适合作为הֶבֶל在《传道书》中的贯穿性译法。“留给”则把יִתְּנֶנּוּ（给与）具体化为遗留、继承，虽与上下文相关，却比本节措辞更窄；宜译为“给”。
  naturalness: 整体庄重自然。改为“却要把自己的份给那没有为此劳作的人”能更直接地对应原文，也避免“所得的份却必须留给”中修饰关系略显滞涩。
  terminology: “智慧、知识和才干”妥当地区分三个并列词；“虚空”保持《传道书》主题术语的一致性。“极大的祸患”可保留，以表达רָעָה רַבָּה对该处境的强烈负面评价，而不武断认定为受领者的道德罪责。
  issues:
