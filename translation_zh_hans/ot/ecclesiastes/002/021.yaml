base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/002/021.yaml
  text: For there is a man whose labor is with wisdom and with knowledge and with skill[a], yet he must give his portion to a man who has not labored in it[b]. This also is vapor and a great evil.
translation:
  language: zh_hans
  text: 因为有人以智慧、知识和才干辛苦劳作，却要把自己的份给那没有为此劳作的人。这也是虚空，是极大的祸患。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，为前面的感叹说明理由；现代汉语用“因为”自然清楚。
- source_word: יֵשׁ אָדָם
  choice: 有人
  rationale: 希伯来语存在句在此引出一种个人处境；“有人”比“有一个人”更自然，也未将其扩大为全人类。
- source_word: עֲמָלוֹ
  choice: 辛苦劳作
  rationale: עָמָל在《传道书》中常含劳苦、辛劳之意；此译保留其沉重感。
- source_word: בְּחָכְמָה וּבְדַעַת וּבְכִשְׁרוֹן
  choice: 用智慧、知识和才干
  rationale: 保留三个并列概念及其区别；בְּ在此表达劳作的方式或所凭借的能力。
- source_word: וּלְאָדָם שֶׁלֹּא עָמַל בּוֹ
  choice: 给没有为此劳作的人
  rationale: 突出与劳作者的对比；“为此”自然表达בּוֹ所指向的工作或其成果，同时不把指代解释得过窄。
- source_word: יִתְּנֶנּוּ חֶלְקוֹ
  choice: 所得的份却必须留给
  rationale: חֶלְקוֹ是其所得或分得的份；未完成式结合语境表达不可避免的结果，“必须”传达这种无可规避性。“留给”符合遗留成果给后来者的上下文。
- source_word: הֶבֶל
  choice: 虚空
  rationale: 该词本义为气息、雾气，引申出短暂、捉摸不定、徒然等张力；“虚空”是中文《传道书》中自然而庄重的主题词，并避免只固定为“毫无意义”。
- source_word: רָעָה רַבָּה
  choice: 极大的祸患
  rationale: רָעָה可指邪恶、坏事或灾祸；此处主要评价这种处境为严重的不幸，“祸患”保留强烈负面分量而不强行限定为道德罪恶。
theological_decisions:
- issue: הֶבֶל的主题性译法
  choice: 虚空
  alternative: 雾气；徒然
  rationale: “虚空”在现代中文中能同时容纳短暂无常、难以把握和徒劳等含义；不将本节的张力缩减为单一哲学判断。
- issue: רָעָה רַבָּה是道德之恶还是重大不幸
  choice: 极大的祸患
  alternative: 大恶；极大的不幸
  rationale: 上下文聚焦劳作成果归于未劳作者这一令人痛苦的处境。译为“祸患”保留强烈评断，也不武断判定接受产业者犯了道德罪。
- issue: 劳作者交出所得是否表达必然性
  choice: 必须留给
  alternative: 要给；将给
  rationale: 上下文谈死亡后成果归于他人的不可避免性；“必须”表达情境上的必然，而非宗教或道德命令。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。以“有人”自然呈现个体例证；用“辛苦劳作”保留עָמָל的劳苦色彩。三个能力词保持并列节奏。正文无需脚注，因为主要语义张力已通过“虚空”和“祸患”保留，且没有必须在正文标出的文本异读。
