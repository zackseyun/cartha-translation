  text: וְ/שָׂנֵ֤אתִֽי אֲנִי֙ אֶת כָּל עֲמָלִ֔/י שֶׁ/אֲנִ֥י עָמֵ֖ל תַּ֣חַת הַ/שָּׁ֑מֶשׁ שֶׁ֣/אַנִּיחֶ֔/נּוּ לָ/אָדָ֖ם שֶׁ/יִּהְיֶ֥ה אַחֲרָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/002/018.yaml
  text: And I hated all my labor in which I toiled under the sun[a], because I must leave it to the man who will come after me.
translation:
  language: zh_hans
  text: 我恨恶自己在日光之下辛苦劳碌的一切，因为我将把这一切留给那在我以后的人[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“一个在我以后的人”；“在我以后”也可理解为“接替我”。
    reason: 说明לָאָדָם的冠词在此可作特指或泛指，并保留אַחֲרָי可表达时间先后或承接关系的歧义。
lexical_decisions:
- source_word: וְשָׂנֵאתִי
  choice: 我恨恶
  rationale: שׂנא的Qal完成式第一人称单数，表达传道者已经形成的强烈厌恶；句首连接词按现代汉语篇章衔接可不另译。
- source_word: כָּל־עֲמָלִי שֶׁאֲנִי עָמֵל
  choice: 自己……辛苦劳碌的一切
  rationale: עָמָל及同根分词עָמֵל形成刻意重复，指付出的艰辛劳动及其成果。汉语用“辛苦劳碌的一切”自然地保留劳苦意味，并让“一切”可同时涵盖劳动与所得。
- source_word: תַּחַת הַשָּׁמֶשׁ
  choice: 在日光之下
  rationale: 保留《传道书》的标志性短语，指人在现世范围内的生活与活动，不将其解释性改写。
- source_word: שֶׁאַנִּיחֶנּוּ
  choice: 因为我将把这一切留给
  rationale: 此处使役词形在语境中表示“留下、交给”；שֶׁ引出厌恶的缘由。“将”贴近未完成式，也让死亡与继承所带来的必然性由语境表达，而不额外加入原文没有明说的“必须”。
- source_word: לָאָדָם
  choice: 给那……的人
  rationale: אָדָם在此为单数，指承受前人劳碌成果的后来者。现代汉语“人”本身不标性别，既准确又自然；冠词以“那”体现其特指色彩。
- source_word: שֶׁיִּהְיֶה אַחֲרָי
  choice: 在我以后的人
  rationale: 较贴近字面“将在我之后”，同时保留可指时间上后来之人或接替者的语义空间，避免直接译成“继承人”而过早限定关系。
theological_decisions:
- issue: אָדָם是否应明确译为男性
  choice: 人
  alternative: 男人／那个人
  rationale: 希伯来语אָדָם虽为阳性语法形式，但在此可一般性指某个后来者，原文并未强调其生理性别。汉语“人”可保持单数个人所指而不添加性别信息。
- issue: “在我以后”是否明确解释为继承
  choice: 在我以后的人
  alternative: 接替我的人／继承我的人
  rationale: 上下文确有承受产业之意，但短语本身较宽，可指在传道者之后出现或接替他的人；正文保留这种张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“日光之下”保留全书反复出现的固定表达；“辛苦劳碌的一切”避免生硬复制同根词，同时维持原文的劳苦语气。脚注标记置于其所说明的“在我以后的人”之后。
