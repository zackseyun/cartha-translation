base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/002/016.yaml
  text: For there is no lasting remembrance of the wise man any more than of the fool[a], since in the days to come everything will already have been forgotten[b]. And how the wise man dies just like the fool!
translation:
  language: zh_hans
  text: 因为智慧人和愚昧人一样，都没有长久的记念；到了将来的日子，一切都已被遗忘。智慧人竟和愚昧人一样死去！
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: זִכְרוֹן
  choice: 被人记念
  rationale: 该名词指记忆、记念或留在人们心中的名声；用被动式“被人记念”自然表达此处身后不再为人所记的意思。
- source_word: לֶחָכָם / הֶחָכָם
  choice: 智慧人
  rationale: 希伯来语形容词在此作名词使用，为阳性单数；“智慧人”既保留代表性单数，也符合《传道书》的庄重语体。
- source_word: עִם הַכְּסִיל
  choice: 和愚昧人一样
  rationale: עִם 字面为“与、和”，此处强调智慧人与愚昧人共同的结局；比较式译法在现代汉语中更自然。
- source_word: לְעוֹלָם
  choice: 永远
  rationale: 明确保留时间词的完整力度；在“不会永远被人记念”中表达记念不能长存，并不额外断言形而上的永恒。
- source_word: בְּשֶׁכְּבָר
  choice: 在……早已
  rationale: 该紧缩结构与后面的“将来的日子”连用，表示到了未来之时，一切已处于被遗忘的状态；汉语以时间框架和“早已”共同呈现。
- source_word: הַיָּמִים הַבָּאִים
  choice: 将来的日子
  rationale: 直接保留向未来展望的时间含义，表达自然且庄重。
- source_word: הַכֹּל נִשְׁכָּח
  choice: 一切早已被遗忘了
  rationale: “一切”对应集合性的 הַכֹּל，被动式对应 Niphal；“早已……了”在将来时间框架中传达届时已经遗忘的完成状态。
- source_word: וְאֵיךְ
  choice: 竟
  rationale: 这里更可能是感叹而非询问信息；“竟”传达惊叹和悲叹之意，又不增添“可悲”等原文没有明说的评价词。
- source_word: יָמוּת
  choice: 死去
  rationale: 未完成式在此陈述共同死亡的事实；汉语“死去”适合感叹句，并保留事件性。
theological_decisions:
- issue: 智慧人与愚昧人共同的死亡及被遗忘
  choice: 直陈二者同样死去，也都不能永远被记念
  alternative: 把经文解释为否认智慧在任何层面的价值，或断言绝对无人记得他们
  rationale: 本节聚焦死亡和后世记念上的共同命运；译文不把这一观察扩大为对智慧终极价值或死后状态的系统性判断。
translation_notes:
  register: 采用现代、庄重而通俗的书面汉语。“智慧人”“愚昧人”保持《传道书》的类型化代表单数；末句用“竟”呈现希伯来语 וְאֵיךְ 的感叹力度。
