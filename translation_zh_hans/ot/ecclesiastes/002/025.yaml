  yaml_path: translation/ot/ecclesiastes/002/025.yaml
  text: For who can eat[a], and who can enjoy[b], apart from him?
translation:
  language: zh_hans
  text: 因为离了他[a]，谁能吃，谁能享乐[b]呢？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “离了他”：希伯来文本作“离了我”。许多解释者根据上下文理解为“离了他”，指离了上帝。
    reason: textual_variant
  - marker: b
    text: “享乐”所译的希伯来动词词义不确定；也可译作“急忙”或“感受”。此处按上下文理解为享受或体验乐趣。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上一节，为“这是出于上帝的手”提供解释；“因为”自然保留因果说明作用。
- source_word: מִי יֹאכַל
  choice: 谁能吃喝
  rationale: יֹאכַל 字面为“吃”，在传道书相关语境中常与饮用及人生享受并提；汉语“吃喝”自然表达享用饮食，但因原文只明说“吃”，以脚注注明。
- source_word: וּמִי יָחוּשׁ
  choice: 谁能享乐
  rationale: יָחוּשׁ 词义疑难；结合2:24—26关于饮食和享受劳碌成果的语境，“享乐”最切合行文，同时在脚注保留“急忙”或“感受”等词义可能。
- source_word: חוּץ מִמֶּנִּי
  choice: 离了他
  rationale: חוּץ מִן 表示“在……以外、离开……”。马所拉文本的代词为第一人称“我”，但上下文将享受归于上帝，故正文采用语境所支持的“他”，并以脚注明确保留原文读法。
theological_decisions:
- issue: 末尾代词 מִמֶּנִּי 的所指
  choice: 离了他
  alternative: 离了我
  rationale: 马所拉文本按元音标注直译为“离了我”，即传道者自指；但2:24及2:26强调吃喝与享乐来自上帝，因此古译本和许多解释据语境理解为“离了他”。正文采用后者，同时用脚注保留真实的文本与解释张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。反问句保留原文平行结构；“离了他”比“在他以外”更自然，并与上文“出于上帝的手”衔接。所有脚注标记均在正文出现。
