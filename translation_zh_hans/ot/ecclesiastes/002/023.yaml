source:
  edition: WLC
  text: כִּ֧י כָל יָמָ֣י/ו מַכְאֹבִ֗ים וָ/כַ֨עַס֙ עִנְיָנ֔/וֹ גַּם בַּ/לַּ֖יְלָה לֹא שָׁכַ֣ב לִבּ֑/וֹ גַּם זֶ֖ה הֶ֥בֶל הֽוּא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/002/023.yaml
  text: For all his days are pains[a], and his occupation is vexation; even in the night his heart does not lie down[b]. This too is vapor.
translation:
  language: zh_hans
  text: 因为他一生的日子尽是痛苦，他所做的事也尽是烦恼；夜间，他的心也不得安歇[a]。这也是虚空[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语直译为“他的心不躺下”，意指内心在夜间仍不能休息。
    reason: lexical_alternative
  - marker: b
    text: “虚空”所译的希伯来语也可译作“雾气”或“气息”，表达短暂、飘忽而难以把握。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，为前面的判断说明原因；现代汉语用“因为”自然清楚。
- source_word: כָל יָמָיו
  choice: 他一生的日子
  rationale: 保留希伯来语具体的“日子”意象，同时表达贯穿一生之意。
- source_word: מַכְאֹבִים
  choice: 尽是痛苦
  rationale: 该复数名词指各种疼痛、苦楚或患难；“痛苦”不把含义局限于身体或情绪一面。
- source_word: וָכַעַס
  choice: 令人烦恼
  rationale: 此处指工作所带来的内在苦恼、恼怒或挫折感；如此译法与上下文的劳碌和夜间不安相符。
- source_word: עִנְיָנוֹ
  choice: 他所忙碌的事
  rationale: 该词可指人的事务、工作或所从事的任务；此译既与传道书的劳碌主题呼应，也不局限为职业。
- source_word: גַּם בַּלַּיְלָה
  choice: 即使在夜间
  rationale: 体现 גַּם 的递进强调：白日的痛苦延续到本应休息的夜间。
- source_word: לֹא שָׁכַב לִבּוֹ
  choice: 他的心也不得安歇
  rationale: 希伯来语直译为“他的心不躺下”；正文采用自然汉语表达其内心不能休息，脚注保留原文意象。
- source_word: גַּם זֶה
  choice: 这也是
  rationale: 保留传道书反复出现的追加性总结语。
- source_word: הֶבֶל
  choice: 虚空
  rationale: “虚空”是现代中文可理解且庄重的表达，兼具短暂、难以把握和缺乏实质的语义；脚注说明其具体意象及其他译法。
theological_decisions:
- issue: הֶבֶל 的多义性
  choice: 虚空
  alternative: 雾气；气息；徒然
  rationale: 不把该词仅仅解释为道德上的“虚荣”或绝对的“毫无意义”，而保留其短暂、飘忽、难以把握的张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“他一生的日子”有意保留原文的时间意象；“不得安歇”自然传达夜间内心不息，并由脚注呈现“心不躺下”的原文隐喻。所有脚注标记均已置于正文相应位置。
