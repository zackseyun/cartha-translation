  text: וְ/גָדַ֣לְתִּי וְ/הוֹסַ֔פְתִּי מִ/כֹּ֛ל שֶׁ/הָיָ֥ה לְ/פָנַ֖/י בִּ/ירוּשָׁלִָ֑ם אַ֥ף חָכְמָתִ֖/י עָ֥מְדָה לִּֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/002/009.yaml
  text: So I became great and increased more than all who were before me in Jerusalem[b][a]; also my wisdom remained with me.
translation:
  language: zh_hans
  text: 这样，我变得显赫，并且超过了所有在耶路撒冷、在我以前的人[a]；我的智慧也仍与我同在[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文也可较宽泛地理解为“超过在我以前所有的一切”。
    reason: lexical_alternative
  - marker: b
    text: 直译：“我的智慧为我站立。”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגָדַלְתִּי וְהוֹסַפְתִּי
  choice: 我日益强盛
  rationale: גדל表示变得强盛、尊大；后接הוסיף带有继续增加、越发增长之意。合译为“日益强盛”，既保留递增意味，也符合现代汉语表达。
- source_word: מִכֹּל שֶׁהָיָה לְפָנַי
  choice: 超过了所有在我以前……的人
  rationale: 介词מִן在比较结构中表达“超过”；כֹּל שֶׁהָיָה לְפָנַי字面范围较宽，但在此处第一人称王者自述的语境中，最自然地指先前的人。范围上的歧义以脚注保留。
- source_word: בִּירוּשָׁלִָם
  choice: 居于耶路撒冷
  rationale: 按地点义处理；加入“居于”使“在我以前”与“耶路撒冷”的关系在汉语中清楚自然。
- source_word: אַף
  choice: 也
  rationale: 此处增添另一项陈述，用“也”自然承接前半句，不作过强的强调。
- source_word: חָכְמָתִי
  choice: 我的智慧
  rationale: 直接保留名词及第一人称所属关系。
- source_word: עָמְדָה לִּי
  choice: 一直伴随着我
  rationale: 原文直译近似“为我站立／在我这里站住”，在语境中表示智慧仍然存留、未离开，并继续可供他使用。“一直伴随着我”自然表达这一持续状态；直译在脚注中保留。
theological_decisions:
- issue: כֹּל שֶׁהָיָה לְפָנַי所指的是前人还是此前的一切
  choice: 正文按语境译为“所有在我以前……的人”
  alternative: “在我以前所有的一切”
  rationale: 上下文是在将自己的尊荣与耶路撒冷的前人相比，人物指向较为自然；但希伯来语כֹּל本身可取更宽泛范围，因此不把另一理解完全排除。
- issue: “智慧站住”为持续拥有还是拟人化地支持说话者
  choice: 正文译为“我的智慧也一直伴随着我”
  alternative: “我的智慧也为我站立／仍归我所有”
  rationale: לִי可表达对说话者而言或供其使用，עמד则强调持续、站住。正文采用自然且不过度限定的表达，并用脚注保留原文意象。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“日益强盛”避免生硬重复“变得强大并且增加”；分号保留两项陈述之间既并列又转接的关系。
