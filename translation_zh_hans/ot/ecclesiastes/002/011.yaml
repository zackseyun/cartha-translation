  source_fidelity: “转眼察看”在现代汉语中通常指一瞥或极短时间内观看，未能准确表达וּפָנִיתִי所指的“转而／回头审察”。“劳碌完成这些工作所付出的辛劳”虽试图保留同根重复，但表达冗赘，且“完成”较原文的广义“做／成就”略窄。修订为“转而审察”及“为完成这些工作所付的一切劳苦”，准确呈现回顾评估及劳苦的对象。其余关键表达与原文相符；“虚空”“捕风”“日光之下”“益处”均恰当保留《传道书》的语义和意象。
