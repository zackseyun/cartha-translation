source:
  edition: WLC
  text: וּ/פָנִ֣יתִֽי אֲנִ֗י בְּ/כָל מַעֲשַׂ/י֙ שֶֽׁ/עָשׂ֣וּ יָדַ֔/י וּ/בֶֽ/עָמָ֖ל שֶׁ/עָמַ֣לְתִּי לַ/עֲשׂ֑וֹת וְ/הִנֵּ֨ה הַ/כֹּ֥ל הֶ֨בֶל֙ וּ/רְע֣וּת ר֔וּחַ וְ/אֵ֥ין יִתְר֖וֹן תַּ֥חַת הַ/שָּֽׁמֶשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/002/011.yaml
  text: Then I turned to consider all the works that my hands had done[a], and the labor that I had labored to do; and behold, all was vanity and a chasing after wind[c][b], and there was no profit under the sun.
translation:
  language: zh_hans
  text: 于是，我转而审察我双手所做的一切工作，以及我为完成这些工作所付的一切劳苦；看哪，这一切都是虚空[a]，都是捕风[b]；在日光之下毫无益处[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“雾气”“气息”或“空幻”。希伯来语“赫贝尔”常表达短暂、虚幻、难以把握或令人徒劳之意。
    reason: lexical_alternative
  - marker: b
    text: 或译“追风”；按另一种词义理解，也可作“牧风”。这个比喻描绘无法获得成果的努力。
    reason: lexical_alternative
  - marker: c
    text: 或译“毫无收益”或“毫无所得”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפָנִיתִי
  choice: 于是，我转眼察看
  rationale: 保留“转向”的具体意象，同时用“察看”表达此处回顾、评估的语境功能。
- source_word: מַעֲשַׂי שֶׁעָשׂוּ יָדַי
  choice: 我双手所做的一切工作
  rationale: 保留“我的手”这一强调亲自实践和创造的表达，并以现代汉语自然呈现。
- source_word: וּבֶעָמָל שֶׁעָמַלְתִּי לַעֲשׂוֹת
  choice: 以及我劳碌完成这些工作所付出的辛劳
  rationale: 用“劳碌／辛劳”反映希伯来语名词与同根动词的重复；补出语境中隐含的工作对象，使汉语清楚而不过度具体化。
- source_word: וְהִנֵּה
  choice: 看哪
  rationale: 保留原文引出鲜明结论和突然领悟的篇章标记，语体庄重且可懂。
- source_word: הֶבֶל
  choice: 虚空
  rationale: 这是《传道书》的核心主题词；“虚空”保留传统互文，也能涵盖短暂、空幻和徒劳，而不武断地收窄为“毫无意义”。
- source_word: וּרְעוּת רוּחַ
  choice: 捕风
  rationale: 简洁保留追逐并试图抓住风的形象，表达无法获得成果的徒劳；脚注说明其他可能理解。
- source_word: וְאֵין יִתְרוֹן
  choice: 毫无益处
  rationale: יִתְרוֹן可指盈余、收益或优势；“益处”适合本句总体评估，同时脚注保留“收益／所得”的经济色彩。
- source_word: תַּחַת הַשָּׁמֶשׁ
  choice: 在日光之下
  rationale: 采用《传道书》中反复出现且具有主题作用的自然汉语表达。
theological_decisions:
- issue: 《传道书》中הֶבֶל的译法
  choice: 虚空
  alternative: 雾气、气息、空幻、毫无意义
  rationale: 原词兼具短暂、难以把握、空幻和令人徒劳等层面。“虚空”维持全书主题词的一致性，并避免把它绝对化为哲学性的“毫无意义”；脚注保留其具体意象与语义张力。
- issue: רְעוּת רוּחַ的意象与语义
  choice: 捕风
  alternative: 追风、牧风、为风劳碌
  rationale: 该短语的词形和词源解释存在讨论，但上下文明确指向徒劳、无法留存的追求。“捕风”既保留风的意象，也不额外引入特定教义判断。
translation_notes:
  register: 采用现代、庄重而通顺的标准普通话。“看哪”“虚空”“日光之下”保留智慧文学的凝练和主题性；句首回顾、句末判断的结构尽量对应希伯来语推进。所有脚注标记均置于其所解释的词语之后。
