base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/002/007.yaml
  text: I acquired male slaves and female slaves[a], and homeborn slaves were mine; I also had great herds of cattle and flocks[b], more than all who were before me in Jerusalem.
translation:
  language: zh_hans
  text: 我获得了男奴和女奴，也有家生奴隶[a]；我还拥有许多牛群和羊群[b]，比我以前在耶路撒冷的所有人所拥有的都多。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“家中之子”，指生在主人家中的人；在这里的奴隶清单中，很可能是指家生奴隶。
    reason: cultural_note
  - marker: b
    text: 也可译作“我还有大量牛羊牲畜”；原文用集合名词描述所拥有的牲畜。
    reason: lexical_alternative
lexical_decisions:
- source_word: קָנִיתִי
  choice: 我买了
  rationale: 该动词可指“取得、购得、买入”；这里的宾语是男女奴隶，“买了”自然明确，也符合财富清单的语境，但不把后一句家生奴仆说成购买所得。
- source_word: עֲבָדִים וּשְׁפָחוֹת
  choice: 男奴和女奴
  rationale: 两个词并列，分别标明男性和女性的奴隶身份；直译其社会地位，避免用较弱的“仆人”淡化原文。
- source_word: וּבְנֵי בַיִת
  choice: 在家中出生的奴仆
  rationale: 字面为“家中之子”，在本段语境中指生于主人家中的家属奴仆；正文采用易懂表达，并以脚注说明原文措辞及语境判断。
- source_word: הָיָה לִי
  choice: 我还拥有
  rationale: 希伯来语所有结构直译为“有归我”；现代汉语用“拥有”自然表达所有关系。
- source_word: מִקְנֶה בָקָר וָצֹאן
  choice: 牛群和羊群
  rationale: מִקְנֶה是牲畜产业的集合概念，随后由牛与小型牲畜具体说明；汉语合并译为“牛群和羊群”简洁自然。
- source_word: הַרְבֵּה
  choice: 许多
  rationale: 表达数量丰盛；“许多”在现代汉语中清楚自然。
- source_word: מִכֹּל שֶׁהָיוּ לְפָנַי בִּירוּשָׁלִָם
  choice: 胜过在我以前所有住在耶路撒冷的人
  rationale: 保留“所有……的人”的比较范围，并明确耶路撒冷修饰此前在那里的人；“在我以前”保持其可能指前人或前任的宽泛性。
