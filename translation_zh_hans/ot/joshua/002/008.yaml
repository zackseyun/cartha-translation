  text: Before they lay down[a], she went up to them on the roof.
translation:
  language: zh_hans
  text: 他们还未躺下[a]，她便上到房顶，到他们那里去。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们还没有睡下。”希伯来语动词直译为“躺下”，在这里可能指躺下睡觉。
    reason: lexical_alternative
lexical_decisions:
- source_word: טֶרֶם
  choice: 还没有
  rationale: 此处与未完成式连用，表示后述动作发生时，他们“尚未”躺下；用“还没有……就……”自然地表达两个动作的先后关系。
- source_word: יִשְׁכָּבוּן
  choice: 躺下
  rationale: שׁכב的基本义是“躺下”。语境可能暗含就寝，但原文没有明确使用“睡觉”，因此正文保留具体动作，并以脚注说明语境义。
- source_word: עָלְתָה
  choice: 上到
  rationale: עלה表示向上移动；“上到”既体现上行方向，也自然衔接目的地点“房顶”。
- source_word: עֲלֵיהֶם
  choice: 他们那里
  rationale: 介词עַל在表示移动的动词之后、以人为宾语时可表达趋向。译为“他们那里”避免直译成容易误解的“在他们上面”。
- source_word: עַל הַגָּג
  choice: 房顶
  rationale: 指房屋顶部的平台式屋顶；“房顶”是现代汉语中清楚自然的地点表达。
- source_word: וְהֵמָּה ... וְהִיא
  choice: 他们……她……
  rationale: 保留原文显式代词所形成的人物对照，同时用汉语“还没有……就……”组织叙事。
theological_decisions: []
