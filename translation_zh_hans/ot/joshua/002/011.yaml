  text: וַ/נִּשְׁמַע֙ וַ/יִּמַּ֣ס לְבָבֵ֔/נוּ וְ/לֹא קָ֨מָה ע֥וֹד ר֛וּחַ בְּ/אִ֖ישׁ מִ/פְּנֵי/כֶ֑ם כִּ֚י יְהוָ֣ה אֱלֹֽהֵי/כֶ֔ם ה֤וּא אֱלֹהִים֙ בַּ/שָּׁמַ֣יִם מִ/מַּ֔עַל וְ/עַל הָ/אָ֖רֶץ מִ/תָּֽחַת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/011.yaml
  text: When we heard it[a], our hearts melted, and no spirit remained in any man because of you, for Yahweh your God[b], he is God in the heavens above and on the earth below.
translation:
  language: zh_hans
  text: 我们一听见这事，我们的心就融化了；由于你们，谁也不再有勇气。[a]因为雅威——你们的上帝——他是上面的天和下面的地的上帝。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“任何人里面不再有灵（或气）兴起。”这里指再没有人有胆气。
    reason: lexical_alternative
  - marker: b
    text: “雅威”音译希伯来文的神名YHWH，传统上也译作“耶和华”或以“上主”代替。
    reason: cultural_note
lexical_decisions:
- source_word: וַנִּשְׁמַע
  choice: 我们一听见这事
  rationale: 承接上文所述的消息，并以自然的汉语表达此处的时间关系；“这事”由语境补出。
- source_word: וַיִּמַּס לְבָבֵנוּ
  choice: 心就消化了
  rationale: 保留希伯来语“心融化”的生动意象；“心消化”也是现代汉语读者能够理解的圣经式表达，表示惊恐丧胆。
- source_word: וְלֹא קָמָה עוֹד רוּחַ בְּאִישׁ
  choice: 谁也不再有勇气
  rationale: רוּחַ在这里指内在的勇气或精神力量，而非圣灵、风或单纯的气息。正文采用自然清楚的意义表达，脚注保留字面说法。
- source_word: מִפְּנֵיכֶם
  choice: 因为你们
  rationale: 该短语字面涉及“在你们面前”，此处表示以色列人使当地居民恐惧的原因。
- source_word: כִּי
  choice: 因为
  rationale: 引出前述恐惧和丧胆的原因。
- source_word: יְהוָה
  choice: 雅威
  rationale: 直接音译四字神名YHWH，而不以称号替代；“雅威”是现代中文常见且可辨识的译法。
- source_word: אֱלֹהֵיכֶם
  choice: 你们的上帝
  rationale: 指以色列的上帝，并与神名“雅威”构成同位关系。
- source_word: הוּא אֱלֹהִים
  choice: 他是……上帝
  rationale: 直接保留希伯来文的身份宣告，不另加“独一”或“真”这类原文未明说的限定语。
- source_word: בַּשָּׁמַיִם מִמַּעַל וְעַל הָאָרֶץ מִתָּחַת
  choice: 天上和地上
  rationale: 以简洁自然的汉语表达希伯来文“上面的天”和“下面的地”这一涵盖整体的对举；“天上、地上”本身已包含上下方位。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；音译为“雅威”保留其作为专名的性质，并以脚注说明。
- issue: 喇合宣认的范围
  choice: 他是天上和地上的上帝
  alternative: 他是天上地下独一的上帝；他是天上地下的真神
  rationale: 天地对举宣告雅威普世的神性和主权；译文不添加原句没有显明出现的“独一”或“真”。
- issue: רוּחַ在本节中的含义
  choice: 勇气
  alternative: 气息；灵
  rationale: 语境描述迦南人因惧怕而丧胆，因此这里指人的胆气或精神力量，并非指圣灵。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“心就消化了”刻意保留原文意象；后半句则用“勇气”清楚传达רוּחַ在语境中的含义。称“上帝”以保持现代标准汉语的可读性。
