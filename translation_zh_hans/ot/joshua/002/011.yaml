revisions:
- from: 我们一听见这事，心就消化了；因为你们，谁也不再有勇气。[a]因为雅威你们的上帝[b]，他是天上和地上的上帝。
  to: 我们一听见这事，我们的心就融化了；由于你们，谁也不再有勇气。[a]因为雅威——你们的上帝——他是上面的天和下面的地的上帝。[b]
  rationale: 修订“消化”为“融化”，既忠实保留希伯来语意象，也符合现代汉语；将“因为你们”调整为“由于你们”，使因果关系更流畅；补回“上面的天和下面的地”，保留原文天地上下的对举。神名、上帝称谓及“勇气”的语境义均维持不变。
