base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/016.yaml
  text: And she said to them[a], "Go to the hill country, lest the pursuers encounter you, and hide yourselves there three days, until the pursuers return[b]. Afterward you may go on your way."
translation:
  language: zh_hans
  text: 她对他们说：“你们往山区[a]去，免得追赶的人碰上你们[b]。你们要在那里躲藏三天，等追赶的人回来；随后你们就可以继续上路。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“山上”。希伯来语既可指一座具体的山，也可指周围的山区。
    reason: lexical_alternative
  - marker: b
    text: 或译“遇见你们”或“撞上你们”。这个动词可表示遇到某人；因上下文是追捕，此处带有敌对意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: הָהָרָה
  choice: 往山区去
  rationale: הַר既可指一座具体的山，也可指山地或山区；此处是喇合指示探子前往适合藏身的崎岖地带，因此正文采用自然的区域性表达“山区”，并以脚注保留“山上”的可能性。
- source_word: לֵּכוּ
  choice: 去
  rationale: הלך的命令式在此直接表示“去”；配合方向语“往山区”译为“往山区去”，简洁而有紧迫感。
- source_word: פֶּן
  choice: 免得
  rationale: פֶּן引出要避免的结果或防范事项；“免得”准确表达其警戒意味，也符合现代汉语。
- source_word: יִפְגְּעוּ בָכֶם
  choice: 碰上你们
  rationale: פגע与介词ב连用可指遇见、碰见或撞上某人；“碰上”保留基本的相遇意义，而追捕所带来的敌意由上下文显明。
- source_word: הָרֹדְפִים
  choice: 追赶的人
  rationale: רדף的分词在此名词化，指正在追赶探子的人；“追赶的人”清楚保留其持续行动。
- source_word: וְנַחְבֵּתֶם
  choice: 你们要……躲藏
  rationale: 该形式表达让他们自己藏起来的命令；汉语用“你们要……躲藏”自然传达命令和自身隐蔽的意思。
- source_word: שָׁמָּה
  choice: 在那里
  rationale: 地点副词指向前述山区；“在那里”清楚衔接藏身地点。
- source_word: שְׁלֹשֶׁת יָמִים
  choice: 三天
  rationale: 原文是表示时段的宾格；现代汉语直接说“躲藏三天”即可自然表达持续时间。
- source_word: עַד שׁוֹב הָרֹדְפִים
  choice: 等追赶的人回来
  rationale: עַד加שוב的不定式结构标明等候的终点；“等……回来”自然准确。
- source_word: וְאַחַר
  choice: 然后再
  rationale: 该词标示前述等待期之后的顺序；“然后再”在汉语中清楚体现随后行动。
- source_word: תֵּלְכוּ לְדַרְכְּכֶם
  choice: 赶你们的路
  rationale: 字面意思是“走你们的路”；汉语惯用语“赶你们的路”自然表达继续原定行程，而不额外强化许可或必然语气。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“免得”保留原文的防范语气；“追赶的人”避免过度名词化；正文不把山区具体化为某一座山，也不把“碰上”强化为原词未必明说的“抓住”或“追上”。所有脚注标记均置于相应词语之后。
