base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/022.yaml
  text: So they went and came to the hill country[a], and stayed there three days, until the pursuers returned. The pursuers searched all along the road, but did not find them.
translation:
  language: zh_hans
  text: 他们就前往山区[a]，在那里停留了三天，直到追赶他们的人返回。追赶他们的人在整条路上搜寻，却没有找到他们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“山”或“山地”。希伯来文此处可能指耶利哥以西的山地，而非一座单独的山峰。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלְכוּ וַיָּבֹאוּ
  choice: 往……去
  rationale: 两个连续的叙事动词共同表达前往并抵达；现代汉语若直译为“走了，又来到”较显累赘，因此合译为“往……去”，不损失实际动作。
- source_word: הָהָרָה
  choice: 山区
  rationale: 带方向词尾，表示朝山地而去；结合耶利哥附近地形，指山区比特指一座山更合语境，同时仍保留希伯来语单数集合用法的范围。
- source_word: וַיֵּשְׁבוּ שָׁם
  choice: 在那里躲了
  rationale: ישב本义为停留、居住；此处二人为躲避追兵而暂留，译为“躲了”自然呈现上下文明确的目的，但不增添具体藏身方式。
- source_word: שְׁלֹשֶׁת יָמִים
  choice: 三天
  rationale: 直接对应原文的时间表达。
- source_word: עַד שָׁבוּ הָרֹדְפִים
  choice: 直到追赶的人回来
  rationale: שוב表示回来；分词הָרֹדְפִים名词化，译为“追赶的人”清楚自然。
- source_word: וַיְבַקְשׁוּ
  choice: 搜寻
  rationale: בקש在追捕语境中表示寻找、搜索，译为“搜寻”准确而自然。
- source_word: בְּכָל הַדֶּרֶךְ
  choice: 沿路到处
  rationale: 表达在整条路线范围内搜寻，兼顾כָל的全面性和现代汉语习惯。
- source_word: וְלֹא מָצָאוּ
  choice: 却没有找到他们
  rationale: 原文宾语依语境省略，汉语补出“他们”以避免含混；“却”体现前后结果上的转折。
theological_decisions: []
translation_notes:
  register: 采用现代、清楚而庄重的叙事语体。“二人”承接上文两名探子；“山区”避免把原文过度限定为单独一座山。此节无须设置神学性脚注。
