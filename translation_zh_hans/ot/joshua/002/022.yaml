  naturalness: 整体叙事通顺。将“追赶的人”调整为“追赶他们的人”可使指向更清楚；“在整条路上搜寻”比“沿路到处搜寻”更直接对应原文“在全路上”。
  terminology: “山区”适合此处带方向词尾的 הָהָרָה，且不把地形限定为一座孤立山峰。保留说明其亦可译作“山”或“山地”的脚注，以反映原文单数词的解释空间。
