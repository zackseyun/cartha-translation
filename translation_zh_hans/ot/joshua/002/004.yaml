base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/004.yaml
  text: But the woman had taken the two men and hidden them[a], and she said, “Yes, the men came to me, but I did not know where they were from.”
translation:
  language: zh_hans
  text: 那女人已经把那两个人带去藏起来了[a]，就说：“是的，那些人曾来到我这里，但我不知道他们是从哪里来的。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “藏了起来”的原文宾语后缀是单数，直译为“把他藏了起来”；但上下文所指的是那两个人，因此正文按复数理解。
    reason: textual_variant
lexical_decisions:
- source_word: וַתִּקַּח
  choice: 已经把……带去
  rationale: 该动词在叙事链中表示女人先处置了二人；结合随后“藏起来”和开口回答的次序，用“已经”自然表明这是说话前完成的动作。“带去”避免将 לקח 在此机械译成“拿”。
- source_word: הָאִשָּׁה
  choice: 女人
  rationale: 上下文指喇合这名女子，并非强调婚姻身份；“女人”准确而自然。
- source_word: שְׁנֵי הָאֲנָשִׁים
  choice: 那两个人
  rationale: 数词和名词明确指前文两名男子；现代汉语用“那两个人”衔接上下文自然。
- source_word: וַתִּצְפְּנוֹ
  choice: 藏了起来
  rationale: 动词表示隐藏。原文宾语后缀为阳性单数，但上下文所指是两个人，因此正文按语境译出复数对象，并以脚注保留形式上的异常。
- source_word: וַתֹּאמֶר
  choice: 就说
  rationale: 这是普通的叙事引语公式；“就说”自然承接前面的动作，不额外加入“回答”的解释。
- source_word: כֵּן
  choice: 是的
  rationale: 此处肯定使者所问事实，即那些人确实来过；“是的”保留直接应答语气。
- source_word: בָּאוּ אֵלַי הָאֲנָשִׁים
  choice: 那些人来过我这里
  rationale: אֵלַי 字面为“到我这里”；“来过我这里”符合现代汉语口语，同时过去经历体“过”契合她承认来访一事。
- source_word: וְלֹא יָדַעְתִּי
  choice: 但我不知道
  rationale: וְ 形式上可作“并且”，这里在承认来访与否认知情之间有转折关系，译作“但”最符合汉语语篇。
- source_word: מֵאַיִן הֵמָּה
  choice: 他们是从哪里来的
  rationale: מֵאַיִן 询问来源或出处；此译法是自然现代汉语，并保留原文对来历的询问。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。以“已经……就说”交代动作与说话的先后，以“来过我这里”呈现自然对话。保留原文关于单数宾语后缀与复数语境之间的张力，并在正文中按要求标出脚注[a]。
