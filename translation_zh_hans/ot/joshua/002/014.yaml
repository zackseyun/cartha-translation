source:
  edition: WLC
  text: וַ/יֹּ֧אמְרוּ לָ֣/הּ הָ/אֲנָשִׁ֗ים נַפְשֵׁ֤/נוּ תַחְתֵּי/כֶם֙ לָ/מ֔וּת אִ֚ם לֹ֣א תַגִּ֔ידוּ אֶת דְּבָרֵ֖/נוּ זֶ֑ה וְ/הָיָ֗ה בְּ/תֵת יְהוָ֥ה לָ֨/נוּ֙ אֶת הָ/אָ֔רֶץ וְ/עָשִׂ֥ינוּ עִמָּ֖/ךְ חֶ֥סֶד וֶ/אֱמֶֽת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/014.yaml
  text: The men said to her[a], “Our lives for yours, even to death, if you do not tell this matter of ours. And when Yahweh gives us the land, we will deal with you in covenant faithfulness and truth.”
translation:
  language: zh_hans
  text: 那些人对她说：“你们若不泄露我们的这件事，我们愿以性命替你们受死。当雅威把这地赐给我们时，我们必以慈爱和信实[a]待你。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “慈爱和信实”也可译作“恩慈和信实”或“忠诚和可靠”。希伯来语חֶסֶד וֶאֱמֶת常表达在盟约关系中忠贞而可信的承诺。
    reason: 说明该词组的可选译法及其关系性、盟约性语感，避免在正文中加入原文未明说的“盟约”。
lexical_decisions:
- source_word: הָאֲנָשִׁים
  choice: 那些人
  rationale: 原文只称他们为“那些人”，上下文虽表明他们是探子，正文不另行增补。
- source_word: נַפְשֵׁנוּ תַחְתֵּיכֶם לָמוּת
  choice: 我们愿以命代你们死
  rationale: 保留 נֶפֶשׁ 的“性命”、תַּחַת 的代替含义和 לָמוּת 的死亡意味，同时用现代汉语表达这一带有起誓性质的自我担保。
- source_word: אִם לֹא תַגִּידוּ
  choice: 你们若不……说出去
  rationale: 动词是第二人称复数；译作“你们”保留原文数的变化，也可涵盖喇合及其家人。
- source_word: אֶת דְּבָרֵנוּ זֶה
  choice: 我们的这件事
  rationale: דָּבָר 在此指探子的行动和双方的约定；“这件事”自然且不过度限定。
- source_word: בְּתֵת יְהוָה לָנוּ אֶת הָאָרֶץ
  choice: 雅威把这地赐给我们的时候
  rationale: ב 加不定式结构表达时间或情境；“……的时候”符合现代汉语习惯。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以常见的现代汉语音译呈现四字神名，保留原文使用专名的特点。
- source_word: וְעָשִׂינוּ עִמָּךְ
  choice: 我们必……待你
  rationale: עָשָׂה עִם 表示如何对待某人；此处第二人称为阴性单数，因此译作“你”。
- source_word: חֶסֶד וֶאֱמֶת
  choice: 慈爱和信实
  rationale: 分别保留 חֶסֶד 的忠贞恩慈和 אֱמֶת 的真实可靠含义，不在正文中强行加入原文没有明说的“约”字。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”较贴近学界通常采用的拟定读音，同时脚注并非本节理解所必需。
- issue: חֶסֶד וֶאֱמֶת 的关系与盟约色彩
  choice: 慈爱和信实
  alternative: 忠诚和可靠；恩慈和信实
  rationale: 这一词组在关系和盟誓语境中常带忠贞、可靠的分量，但原文没有显式出现“约”；正文保留两个词的张力，脚注说明其盟约性语感，而不将一种解释写死。
- issue: 条件句中的复数对象与后文单数对象
  choice: 前句译“你们”，后句译“你”
  alternative: 两处均译“你”
  rationale: 原文 תַגִּידוּ、תַחְתֵּיכֶם 为复数，עִמָּךְ 为阴性单数。保留数的变化，可让读者看见誓约条件可能涉及喇合一方众人，而应许直接对喇合本人说。
translation_notes:
  register: 采用庄重、清楚的现代标准普通话。“把……说出去”自然表达泄密之意；“以命代你们死”略带誓言式凝练，保留原文强烈的自我担保。正文中的脚注标记[a]紧随其所解释的“慈爱和信实待你”。
