  yaml_path: translation/ot/joshua/002/024.yaml
  text: And they said to Joshua, “Surely the LORD has given all the land into our hands, and indeed all the inhabitants of the land have melted away before us.”
translation:
  language: zh_hans
  text: 他们对约书亚说：“耶和华确实已把那整片土地交在我们手中；而且，那地所有的居民在我们面前都丧胆了。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: 确实
  rationale: 此处引出探子的确信和结论，译作“确实”自然表达其强调语气，同时不机械译为因果连词。
- source_word: נָתַן ... בְּיָדֵנוּ
  choice: 已把……交在我们手中
  rationale: 保留希伯来语“交在手中”这一表示交付、控制和胜利的惯用表达，也保留完成式所呈现的确定性。
- source_word: כָּל הָאָרֶץ
  choice: 那整片土地
  rationale: כָּל 表示整体范围；“那整片土地”在现代汉语中比“全地”更清楚地指向迦南地。
- source_word: נָמֹגוּ
  choice: 胆战心惊
  rationale: 该动词本义为“融化、消解”，此处描写居民因恐惧而丧胆；采用自然汉语成语传达其语境意义。
- source_word: מִפָּנֵינוּ
  choice: 因惧怕我们
  rationale: 字面为“在我们面前／因着我们”，在恐惧语境中表达由以色列人的临近或威势所引发的惧怕。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 采用现代中文圣经读者广泛熟悉的传统译名，不在正文中引入特定学术重建读音。
- issue: נָתַן 完成式的确定性
  choice: 已把……交在我们手中
  alternative: 必把……交在我们手中
  rationale: 保留原文完成式，把尚待全面实现的占领表述为因神应许而确定的既成事实，不将其弱化为单纯未来。
translation_notes:
  register: 语言庄重而口语可懂；用“确实”呈现探子的确信，用分号保持两项报告之间的紧密并列。
