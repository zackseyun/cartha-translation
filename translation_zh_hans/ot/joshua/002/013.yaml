  text: וְ/הַחֲיִתֶ֞ם אֶת אָבִ֣/י וְ/אֶת אִמִּ֗/י וְ/אֶת אַחַ/י֙ וְ/אֶת אחות/י וְ/אֵ֖ת כָּל אֲשֶׁ֣ר לָ/הֶ֑ם וְ/הִצַּלְתֶּ֥ם אֶת נַפְשֹׁתֵ֖י/נוּ מִ/מָּֽוֶת־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/013.yaml
  text: and keep alive my father and my mother[a], and my brothers and my sisters, and all who belong to them[b]; and deliver our lives from death.
translation:
  language: zh_hans
  text: 也要让我的父亲、母亲、兄弟、姐妹，以及所有属于他们的人[b]都活下来[a]，救我们的性命脱离死亡。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “让……活下来”也可译为“保全……的性命”。
    reason: lexical_alternative
  - marker: b
    text: “所有属于他们的人”可能指家中其余成员或依附他们的人；原文也可较宽泛地译为“他们所有的一切”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַחֲיִתֶם
  choice: 让……活下来
  rationale: 该词是 חיה 的使役式，表示使人存活或保全其生命。“让……活下来”在现代汉语中自然，也保留了使役含义；结合上下文，也可理解为“保全……的性命”。
- source_word: אָבִי ... אִמִּי ... אַחַי ... אחותי
  choice: 我的父亲、母亲、兄弟、姐妹
  rationale: 逐一呈现原文亲属称谓及其排列，既保留强调，也符合现代汉语表达；“姐妹”按此处的读法和上下文作复数理解。
- source_word: כָּל אֲשֶׁר לָהֶם
  choice: 所有属于他们的人
  rationale: 原短语直译可指“他们所有的”，既可能涉及人，也可能广及财物；但受“活下来”和全家获救的语境制约，此处以家属或依附者等人为主要所指，同时用脚注保留较宽的可能含义。
- source_word: וְהִצַּלְתֶּם
  choice: 救
  rationale: נצל 的使役式在此表示从致命危险中搭救、解救。“救”简洁庄重，且与后面的“脱离死亡”搭配自然。
- source_word: נַפְשֹׁתֵינוּ
  choice: 我们的性命
  rationale: נפש 在此指处于死亡危险中的生命或本人，而非与身体相对的非物质“灵魂”；“性命”准确传达具体的生命含义。
- source_word: מִמָּוֶת
  choice: 脱离死亡
  rationale: 保留原文介词短语“从死亡中”的意象和郑重语气，并与汉语动词“救”自然衔接。
