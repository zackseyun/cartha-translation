  yaml_path: translation/ot/joshua/002/015.yaml
  text: Then she let them down by a rope through the window[a], because her house was in the wall of the city, and she was living in the wall.
translation:
  language: zh_hans
  text: 她便用绳子从窗户把他们缒下去[a]，因为她的房子在城墙上，她也住在城墙上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因为她的房子在城墙的墙体中，她也住在城墙的墙体中。”希伯来文描述她的住处与城墙结构相连；具体是位于墙体中还是在城墙上，存在空间上的理解差异。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתּוֹרִדֵם
  choice: 她便……把他们……缒下去
  rationale: ירד 的使役式表示“使下降”。“缒下去”在现代汉语中准确表达用绳索把人从高处放下；“便”承接叙事进程。
- source_word: בַּחֶבֶל
  choice: 用绳子
  rationale: חֶבֶל 意为“绳、绳索”，介词 בְּ 在这里表示工具或手段；“用绳子”自然明确。
- source_word: בְּעַד הַחַלּוֹן
  choice: 从窗口
  rationale: בְּעַד 在此表示穿过开口；结合下降动作，汉语“从窗口缒下去”自然包含“穿过窗口、向外下去”的意思。
- source_word: כִּי
  choice: 因为
  rationale: כִּי 引出她能从窗口放下二人的原因，用“因为”清楚表达因果关系。
- source_word: בֵיתָהּ בְּקִיר הַחוֹמָה
  choice: 她的房子位于城墙内
  rationale: 原文以 בְּ 描述房屋与城墙结构的空间关系。“位于城墙内”保留房屋处在墙体结构中这一基本图景，又避免增添原文没有明说的“建造、嵌入”等动作。
- source_word: וּבַחוֹמָה הִיא יוֹשָׁבֶת
  choice: 她就住在城墙里
  rationale: יֹשֶׁבֶת 是表示持续状态的分词，意为“居住”；此句重申她的住处与城墙相连。“住在城墙里”贴近原文，同时脚注说明介词也可按方位理解为“在城墙上”。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“缒下去”虽略带书面色彩，却是汉语中对“用绳索把人从高处放下”最准确简洁的表达。正文保留房屋位于城墙结构之内的图景，并用脚注呈现介词 בְּ 可译为“在……上”的真实空间歧义。
