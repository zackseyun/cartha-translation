base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/018.yaml
  text: Look[a], when we come into the land, you shall tie this scarlet cord in the window through which you let us down, and you shall gather into your house your father, your mother, your brothers, and all your father's household.
translation:
  language: zh_hans
  text: “看哪，我们进入这地的时候，你要把这条朱红色的绳子[a]系在那扇你曾从那里把我们缒下去的窗户上；你要把你的父亲、母亲、兄弟和你父亲全家的人都招聚到你家里。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“这条朱红线。”
    reason: 原文的名词组合可较贴近字面译为“朱红线”；正文采用“朱红色的绳子”以清楚表达此处作为标记而系在窗上的物件。
lexical_decisions:
- source_word: הִנֵּה
  choice: 看哪
  rationale: 这是引起注意的指示语。“看哪”保留其郑重、提示下文的作用，同时仍为现代读者所理解。
- source_word: בָאִים בָּאָרֶץ
  choice: 我们进入这地的时候
  rationale: 分词在本语境中指将来的进入行动；用“……的时候”自然表达这一约定生效的时间条件。
- source_word: תִּקְוַת חוּט הַשָּׁנִי הַזֶּה
  choice: 这条朱红色的绳子
  rationale: 该组合直译较为叠涩，所指是用朱红线制成、作为标记的绳子。“朱红色的绳子”在中文中清楚自然；较贴近词语结构的译法收入脚注。
- source_word: תִּקְשְׁרִי
  choice: 你要……系
  rationale: 阴性单数未完成式在约定中表达明确指示；“你要”兼顾命令性与自然中文表达。
- source_word: בַּחַלּוֹן אֲשֶׁר הוֹרַדְתֵּנוּ בוֹ
  choice: 在你缒我们下去的那个窗户上
  rationale: 使役形式表示使人下去；“缒……下去”准确对应借助绳索从窗户放下的场景，“窗户上”则自然表达系绳的位置。
- source_word: תַּאַסְפִי אֵלַיִךְ הַבָּיְתָה
  choice: 都招聚到你家里
  rationale: 该短语兼有把人聚到自己这里以及进入屋内的意思。“招聚到你家里”简洁涵盖聚集者、方向和目的地。
- source_word: אָבִיךְ ... אִמֵּךְ ... אַחַיִךְ
  choice: 你的父亲、母亲、兄弟
  rationale: 按原文逐项保留亲属称谓；אַחַיִךְ为阳性复数，译作“兄弟”不擅自扩大为所有手足。
- source_word: כָּל בֵּית אָבִיךְ
  choice: 你父亲全家的人
  rationale: “父家”在这里指家族或家庭成员，而非建筑物；加“的人”可避免中文读者误解为房屋。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“看哪”保留誓约指示的郑重语气；“缒”准确呈现从窗户放下人的动作，虽略具书面色彩，但在上下文中清晰简练。脚注标记置于其实际说明的“绳子”之后。
