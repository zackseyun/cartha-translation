source:
  edition: WLC
  text: וַ/תֹּ֨אמֶר֙ אֶל הָ֣/אֲנָשִׁ֔ים יָדַ֕עְתִּי כִּֽי נָתַ֧ן יְהוָ֛ה לָ/כֶ֖ם אֶת הָ/אָ֑רֶץ וְ/כִֽי נָפְלָ֤ה אֵֽימַתְ/כֶם֙ עָלֵ֔י/נוּ וְ/כִ֥י נָמֹ֛גוּ כָּל יֹשְׁבֵ֥י הָ/אָ֖רֶץ מִ/פְּנֵי/כֶֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/009.yaml
  text: And she said to the men[a], “I know that Yahweh has given you the land, and that the fear of you has fallen upon us[b], and that all the inhabitants of the land have melted away before you.”
translation:
  language: zh_hans
  text: 她对那两个人说：“我知道，雅威已经把这地赐给你们；对你们的恐惧已临到我们，这地所有的居民也都在你们面前丧胆了[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译为“这地所有的居民都因你们而失去了勇气”。希伯来语动词直译为“融化、消融”。
    reason: 说明נָמֹגוּ的字面意象和其在本句中的“丧胆、失去勇气”之意；并保留מִפְּנֵיכֶם可表达“因你们而”的可能性。
lexical_decisions:
- source_word: וַתֹּאמֶר אֶל־הָאֲנָשִׁים
  choice: 她对那些人说
  rationale: 承接上文推进叙事；定冠词所指的是前文那两名探子。“那些人”在现代汉语中自然，也保留原文的指称。
- source_word: יָדַעְתִּי
  choice: 我知道
  rationale: 完成式在此表达喇合已经形成、并在当前仍然有效的确知；汉语现在时态自然传达这一状态。
- source_word: נָתַן יְהוָה לָכֶם אֶת־הָאָרֶץ
  choice: 雅威已经把这地赐给你们
  rationale: 完成式把赐地视为已经确定并具有现实效力，尽管实际征服尚未完成；“已经”保留这种视角。“赐给”适合上帝作为给予者的语境。
- source_word: יְהוָה
  choice: 雅威
  rationale: 直接音译四字神名，保留其作为以色列上帝之专名的功能，而不以称号替代。
- source_word: הָאָרֶץ
  choice: 这地
  rationale: 指当前谈论的迦南地域；“这地”比泛指的“土地”更准确地表达语境中的特定疆域。
- source_word: נָפְלָה אֵימַתְכֶם עָלֵינוּ
  choice: 你们带来的恐惧已经临到我们
  rationale: אֵימָה表示强烈的惧怕或恐怖；“你们带来的”避免把后缀误解为以色列人自己感到恐惧。“临到”保留נפל…על所表达的降临意象，同时符合现代汉语。
- source_word: נָמֹגוּ
  choice: 吓得心都融化了
  rationale: 保留动词“融化、消融”的鲜明隐喻，并用“吓得心都”使其在现代汉语中容易理解；其语境意义是失去勇气、丧胆。
- source_word: כָּל יֹשְׁבֵי הָאָרֶץ
  choice: 这地所有的居民
  rationale: 准确表达“所有住在这地的人”，简洁而自然。
- source_word: מִפְּנֵיכֶם
  choice: 在你们面前
  rationale: 贴近希伯来语的空间性表达，同时保留其可能兼含“因你们”这一原因意义的张力。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。音译为“雅威”保留其专名性质，不以“主”这一称号代替；“耶和华”是传统形式，但较不贴近该名称通常所重建的发音。
- issue: 上帝赐地与尚未完成的征服之间的时态张力
  choice: 已经把这地赐给你们
  alternative: 正把这地赐给你们
  rationale: 希伯来语完成式从喇合的视角把上帝的赐予视为已经确定、有效的事实；译文不把它改成仅仅正在发生的行动，也不暗示以色列此时已实际占领全地。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。保留“临到”和“心都融化了”的原文意象，但通过自然句式避免生硬直译；分号呈现“我知道”之后三个并列内容分句的结构。
