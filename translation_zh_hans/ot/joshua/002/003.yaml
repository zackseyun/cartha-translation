source:
  edition: WLC
  text: וַ/יִּשְׁלַח֙ מֶ֣לֶךְ יְרִיח֔וֹ אֶל רָחָ֖ב לֵ/אמֹ֑ר ה֠וֹצִיאִי הָ/אֲנָשִׁ֨ים הַ/בָּאִ֤ים אֵלַ֨יִ/ךְ֙ אֲשֶׁר בָּ֣אוּ לְ/בֵיתֵ֔/ךְ כִּ֛י לַ/חְפֹּ֥ר אֶת כָּל הָ/אָ֖רֶץ בָּֽאוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/003.yaml
  text: So the king of Jericho sent to Rahab[a], saying, “Bring out the men who came to you, who entered your house, for they have come to search out all the land.”
translation:
  language: zh_hans
  text: 于是，耶利哥王派人到喇合那里，说：“把那些到你这里、进了你家的人交出来，因为他们来是要查探全地。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: 派人到……那里
  rationale: 动词本身是“差遣、派出”；上下文表明王派出使者传达命令。中文若只说“派到喇合那里”缺少自然宾语，因此补出隐含的“人”。
- source_word: מֶלֶךְ יְרִיחוֹ
  choice: 耶利哥王
  rationale: 自然表达希伯来语的属格结构，指上下文中特定的耶利哥统治者。
- source_word: אֶל רָחָב
  choice: 到喇合那里
  rationale: אֶל 标明差遣的目的地或信息接收者；此处不是“攻击喇合”。
- source_word: לֵאמֹר
  choice: 说
  rationale: 以现代汉语常用的引语引介方式表达希伯来语公式用语。
- source_word: הוֹצִיאִי
  choice: 交出来
  rationale: 字面义为“使……出去、带出来”。在王命令喇合把人交出的语境中，“交出来”自然且保留命令力度。
- source_word: הָאֲנָשִׁים
  choice: 那些……人
  rationale: 此处指前文两名男性探子；汉语“人”在语境中已准确明确，无须生硬强调性别。
- source_word: הַבָּאִים אֵלַיִךְ
  choice: 到你这里
  rationale: 定冠词分词作修饰成分，叙事语境中指已经来到喇合这里的人。
- source_word: אֲשֶׁר בָּאוּ לְבֵיתֵךְ
  choice: 进了你家
  rationale: בוא 与 לְ 字面可指“来到你家”；结合前一短语，译为“进了你家”自然地区分两层描述，并符合事件场景。
- source_word: כִּי
  choice: 因为
  rationale: 引出王要求交人的理由。
- source_word: לַחְפֹּר
  choice: 查探
  rationale: חפר 在此语境指为获取情报而搜查、侦察；“查探”既保留调查意味，也不把军事间谍色彩表达得过窄。
- source_word: אֶת כָּל הָאָרֶץ
  choice: 全地
  rationale: 指相关的整片土地或地区，而不是整个世界；“全地”简洁并符合经文语域。
- source_word: בָּאוּ
  choice: 来是要
  rationale: 在中文直接引语中以目的结构自然表达其来到此地的意图及当前相关性。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。“于是”承接前文叙事；引语保持王命令的直接力度。原文 חפר 在本语境虽可含侦察、窥探之意，但“查探”已能保留该语义范围，故不另设脚注。
