base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/005.yaml
  text: And when the gate was about to be shut at dark[a], the men went out. I do not know where the men went. Pursue them quickly, for you will overtake them.
translation:
  language: zh_hans
  text: 天黑、城门快要关闭的时候[a]，那些人出去了。我不知道那些人往哪里去了。你们快去追赶他们，因为你们一定能追上他们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“天色已暗的时候”；希伯来语短语标示城门即将关闭时黑暗来临的情状或时间。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי הַשַּׁעַר לִסְגּוֹר
  choice: 城门快要……关闭的时候
  rationale: וַיְהִי配合不定式לִסְגּוֹר构成时间背景，并表达城门即将关闭；此译法在现代汉语中自然，也保留临近发生之意。
- source_word: בַּחֹשֶׁךְ
  choice: 在天黑时
  rationale: 该短语标示关门的时间，与黑暗来临相关；正文采用自然的时间表达，并以脚注保留“天黑以后”的可能理解。
- source_word: וְהָאֲנָשִׁים יָצָאוּ
  choice: 那两个人就出去了
  rationale: יצא意为“出去”。上下文明确所指是两名探子，因此汉语用“两个人”使指称自然清楚；“就”衔接前面的时间背景。
- source_word: לֹא יָדַעְתִּי
  choice: 我不知道
  rationale: 该完成式在直接引语中表达喇合声称的当前无知状态，现代汉语宜译为现在状态。
- source_word: אָנָה הָלְכוּ
  choice: 往哪里去了
  rationale: אָנָה询问去向或目的地，译作“往哪里”比单纯“哪里”更准确；“去了”符合自然口语叙述。
- source_word: רִדְפוּ מַהֵר אַחֲרֵיהֶם
  choice: 你们快去追赶他们
  rationale: רִדְפוּ是复数命令式，מַהֵר表示迅速，אַחֲרֵיהֶם表示追在他们后面；“快去追赶他们”完整而自然地传达命令。
- source_word: כִּי תַשִּׂיגוּם
  choice: 必能追上
  rationale: כִּי引出催促追赶的理由；נשׂג的使役式表示追及、赶上。“必能追上”既保留肯定语气，也符合汉语追赶场景。
theological_decisions:
- issue: 喇合陈述的真实性
  choice: 按直接引语原样译出，不加判断性措辞
  alternative: 加入“她谎称”等解释
  rationale: 本节只记录喇合所说的话；译文不应在正文中预先加入叙述者未明说的伦理或神学评断。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“关闭”与“追赶”保持适度正式；直接引语简洁有力。脚注标记[a]已置于正文对应位置。
