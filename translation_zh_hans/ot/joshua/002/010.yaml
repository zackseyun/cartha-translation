revisions:
- from: 因为我们听说，你们出埃及的时候，耶和华怎样使红海[a]的水在你们面前干涸；也听说你们怎样处置约旦河对岸的两个亚摩利王西宏和噩，把他们彻底毁灭了。
  to: 因为我们听说，耶和华在你们出埃及的时候，怎样使红海[a]的水在你们面前干涸；又听说你们怎样对待约旦河对岸的两个亚摩利人的王，就是你们把他们完全毁灭的西宏和噩。
  rationale: 修订仅改善属格表达、同位语结构和“חרם”结果性措辞，保留“约旦河对岸”的相对空间表达，不把“对岸”擅自固定为正文中的“东岸”。脚注标记仍紧随“红海”，并保留原有脚注内容。
