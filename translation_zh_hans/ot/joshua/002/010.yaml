id: JOS.2.10
reference: Joshua 2:10
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כִּ֣י שָׁמַ֗עְנוּ אֵ֠ת אֲשֶׁר הוֹבִ֨ישׁ יְהוָ֜ה אֶת מֵ֤י יַם סוּף֙ מִ/פְּנֵי/כֶ֔ם בְּ/צֵאתְ/כֶ֖ם מִ/מִּצְרָ֑יִם וַ/אֲשֶׁ֣ר עֲשִׂיתֶ֡ם לִ/שְׁנֵי֩ מַלְכֵ֨י הָ/אֱמֹרִ֜י אֲשֶׁ֨ר בְּ/עֵ֤בֶר הַ/יַּרְדֵּן֙ לְ/סִיחֹ֣ן וּ/לְ/ע֔וֹג אֲשֶׁ֥ר הֶחֱרַמְתֶּ֖ם אוֹתָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/010.yaml
  text: For we have heard how Yahweh dried up the water of the Red Sea before you when you came out of Egypt[a], and what you did to the two kings of the Amorites who were beyond the Jordan—to Sihon and Og—whom you devoted to destruction.
translation:
  language: zh_hans
  text: 因为我们听说，耶和华在你们出埃及的时候，怎样使红海[a]的水在你们面前干涸；又听说你们怎样对待约旦河对岸的两个亚摩利人的王，就是你们把他们完全毁灭的西宏和噩。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “红海”原文作“苏弗海”，传统上译作“红海”；按字面也可译作“芦苇海”。
    reason: 保留 ים סוף 的传统地名译法与较直译理解之间的词汇差异。
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，说明当地人为何恐惧、胆战心惊；现代汉语用“因为”自然呈现因果关系。
- source_word: שָׁמַעְנוּ
  choice: 我们听说
  rationale: 希伯来语完成式所述消息对当前仍有影响；汉语“听说”无需额外时态标记即可表达。
- source_word: הוֹבִישׁ
  choice: 使……干涸
  rationale: 使役式意为使水变干；“使……干涸”既准确又符合庄重叙事语体。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经传统中最通行、普通读者最易识别的神圣名字音译，而不以称号替代原文专名。
- source_word: מֵי יַם סוּף
  choice: 红海的水
  rationale: “红海”是中文传统且通行的地理名称；原文 ים סוף 的较直译名称保留于脚注。
- source_word: מִפְּנֵיכֶם
  choice: 在你们面前
  rationale: 表达水从以色列人前方退去，使他们得以通行；贴近原文空间意象。
- source_word: בְּצֵאתְכֶם מִמִּצְרָיִם
  choice: 你们出埃及的时候
  rationale: 准确表达介词加不定词结构的时间意义，也符合自然现代汉语。
- source_word: עֲשִׂיתֶם
  choice: 你们怎样处置
  rationale: 保留宽泛动词“做”的开放性，同时“处置”能自然带出后文对两王的具体结局。
- source_word: לִשְׁנֵי מַלְכֵי הָאֱמֹרִי
  choice: 两个亚摩利王
  rationale: 用简洁自然的现代汉语表达原文“亚摩利人的两个王”。
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  choice: 约旦河对岸
  rationale: 从说话者喇合所在位置指约旦河东岸；“对岸”自然且保留相对视角。
- source_word: לְסִיחֹן וּלְעוֹג
  choice: 西宏和噩
  rationale: 作为前述两个王的同位说明，汉语直接列名最自然。
- source_word: הֶחֱרַמְתֶּם
  choice: 把他们彻底毁灭了
  rationale: חרם 的使役式在此指将人置于禁毁之下并予以毁灭；正文采用可理解的结果性表达，避免生硬而可能误解的“奉献为毁灭”。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用四字神名而非一般称号。中文正文保留专名，并采用最广为普通中文读者识别的传统音译；不以“主”消除原文专名。
- issue: חרם 禁毁用语的表达
  choice: 把他们彻底毁灭了
  alternative: 把他们置于禁毁之下
  rationale: 该词不只是一般战败，而带有完全除灭的专门含义。正文以自然汉语呈现实际结果；备选译法虽更显术语性质，却对普通读者较生硬。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。以分号对应两个“听说”的并列内容，并在第二分句补出“也听说”，使汉语逻辑清楚而不改变原意。脚注标记[a]已置于正文对应词语之后。
