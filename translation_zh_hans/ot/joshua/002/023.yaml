base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/023.yaml
  text: Then the two men returned[a], came down from the hill country, crossed over, and came to Joshua son of Nun; and they told him all that had happened to them.
translation:
  language: zh_hans
  text: 那两个人便回来，从山地下来，渡过去，来到嫩的儿子约书亚那里，把他们所遭遇的一切[a]都告诉了他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“临到他们的一切。”较直译：“所有找到他们的事”。
    reason: 保留מצא这一表达从字面“找到”到语境义“临到、遭遇”的词义幅度。
lexical_decisions:
- source_word: וַיָּשֻׁבוּ
  choice: 就返回
  rationale: שׁוב在叙事中表示两人执行任务后返回；“返回”自然、庄重，并保留动作顺序。
- source_word: שְׁנֵי הָאֲנָשִׁים
  choice: 那两个人
  rationale: 原文直称“两个人”；上下文虽表明他们是探子，但不在本节正文中增添这一身份称谓。
- source_word: וַיֵּרְדוּ מֵהָהָר
  choice: 从山区下来
  rationale: הָהָר在这里可指山地或山区，不一定是某一座山；结合地理语境译作“山区”较为贴切。
- source_word: וַיַּעַבְרוּ
  choice: 渡了过去
  rationale: עבר表示越过或渡过，而原文未明说所渡之物；译文保留这种简洁，不擅自补出约旦河。
- source_word: וַיָּבֹאוּ אֶל יְהוֹשֻׁעַ בִּן נוּן
  choice: 来到嫩的儿子约书亚那里
  rationale: 保留בוא אֶל的趋向含义及“嫩的儿子”这一父名身份说明，采用自然的现代汉语表达。
- source_word: וַיְסַפְּרוּ לוֹ
  choice: 都告诉了他
  rationale: ספר的加强词干在此指讲述、禀报；“告诉了他”清楚自然，且“都”与前面的“一切”呼应。
- source_word: אֵת כָּל הַמֹּצְאוֹת אוֹתָם
  choice: 他们所遭遇的一切
  rationale: מצא的这一用法字面上是“找到他们的所有事”，实际表示临到或发生在他们身上的一切；“所遭遇的一切”简洁保留了事件临到他们的意味。
