  text: וַ/יֵּ֣אָמַ֔ר לְ/מֶ֥לֶךְ יְרִיח֖וֹ לֵ/אמֹ֑ר הִנֵּ֣ה אֲ֠נָשִׁים בָּ֣אוּ הֵ֧נָּה הַ/לַּ֛יְלָה מִ/בְּנֵ֥י יִשְׂרָאֵ֖ל לַ/חְפֹּ֥ר אֶת הָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/002.yaml
  text: And it was said to the king of Jericho[a], “Look, men have come here tonight from the Israelites to search out the land.”
translation:
  language: zh_hans
  text: 有人向耶利哥王报告说：“看哪，今夜有些以色列人来到这里，要探查[a]这地。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“侦察”。希伯来语动词可表示搜寻或探究；在这里指对这地进行侦察。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּאָמַר
  choice: 有人……报告说
  rationale: 希伯来文未说明传话者是谁。中文用“有人”保留主语不确定的特点；“报告”符合向君王通报紧急消息的语境。
- source_word: לְמֶלֶךְ יְרִיחוֹ
  choice: 向耶利哥王
  rationale: 自然表达领受消息的对象，并准确保留其政治身份。
- source_word: לֵאמֹר
  choice: 说：“……”
  rationale: 该不定式用于引出话语，中文以“说”和直接引语自然呈现。
- source_word: הִנֵּה
  choice: 看哪
  rationale: 保留引人注意和提示紧急情况的语气；“看哪”庄重而且普通读者容易理解。
- source_word: אֲנָשִׁים
  choice: 有几个……人
  rationale: 原词指复数男性，但中文“几个……人”在此足以指明来者，并避免生硬的“几个男人”；其为男性可由上下文明确。
- source_word: בָּאוּ הֵנָּה
  choice: 来到这里
  rationale: 准确表达已经抵达说话者所在之处，并在中文叙事中自然流畅。
- source_word: הַלַּיְלָה
  choice: 今夜
  rationale: 指他们抵达的当前夜晚；“今夜”简洁、庄重而自然。
- source_word: מִבְּנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 该表达表示这些人属于以色列民。现代中文以族群名称“以色列人”传达最为清楚。
- source_word: לַחְפֹּר
  choice: 探查
  rationale: 该动词本有深入搜寻、查明之意，在这里指为军事目的察看疆土。“探查”保留调查意味，又不在正文中把军事侦察的解释定得过死。
- source_word: אֶת הָאָרֶץ
  choice: 这地
  rationale: 定冠词所指的地域由语境明确。中文用“这地”既保留土地、疆域的含义，也符合现场报告的口吻。
theological_decisions: []
