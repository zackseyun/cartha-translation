  text: וַ/תֹּ֨אמֶר֙ כְּ/דִבְרֵי/כֶ֣ם כֶּן ה֔וּא וַֽ/תְּשַׁלְּחֵ֖/ם וַ/יֵּלֵ֑כוּ וַ/תִּקְשֹׁ֛ר אֶת תִּקְוַ֥ת הַ/שָּׁנִ֖י בַּ/חַלּֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/021.yaml
  text: And she said[a], “According to your words, so be it.” Then she sent them away, and they went; and she tied the scarlet cord in the window.
translation:
  language: zh_hans
  text: 她说：“照你们所说的，就这样吧。”于是她送他们离开，他们便走了；她把朱红色的绳子[a]系在窗口。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“朱红色的线绳”。原文所用的词可指绳、线或索，在这里是一个看得见的标记。
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּדִבְרֵיכֶם
  choice: 照你们所说的
  rationale: 既体现“话”带第二人称复数后缀的含义，也以自然的现代汉语表达喇合接受探子所提出的条件。
- source_word: כֵּן הוּא
  choice: 就这样吧
  rationale: 这是表示同意、确认的惯用语；译文保留其应允语气，而不另加解释。
- source_word: וַתְּשַׁלְּחֵם
  choice: 她送他们离开
  rationale: שׁלח在此指打发或送走；此译法贴合叙事场景，也不暗示强迫或驱逐。
- source_word: וַיֵּלֵכוּ
  choice: 他们便走了
  rationale: 直接表达הלך所指的离去，并以“便”自然衔接希伯来叙事中的连续动作。
- source_word: וַתִּקְשֹׁר
  choice: 她……系
  rationale: קשר表示系、捆或绑；对于把绳子固定在窗口这一动作，“系”最自然准确。
- source_word: תִּקְוַת הַשָּׁנִי
  choice: 朱红色的绳子
  rationale: תִּקְוָה在此不是抽象的“盼望”，而是可作标记的绳、线或索；“朱红色的绳子”清楚传达物件及其颜色，同时以脚注保留词义范围。
- source_word: בַּחַלּוֹן
  choice: 在窗口
  rationale: 介词ב在此表示位置；“在窗口”比“在窗户里”更符合现代汉语，也避免过度指定绳子系在窗框的哪一部分。
theological_decisions: []
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。保留希伯来叙事的动作顺序，并用分号呈现送别探子与系上标记两个紧接发生的叙事动作。脚注标记置于其实际说明的“绳子”之后。
