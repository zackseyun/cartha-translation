reference: Joshua 2:1
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יִּשְׁלַ֣ח יְהוֹשֻׁ֣עַ בִּן נ֠וּן מִֽן הַ/שִּׁטִּ֞ים שְׁנַֽיִם אֲנָשִׁ֤ים מְרַגְּלִים֙ חֶ֣רֶשׁ לֵ/אמֹ֔ר לְכ֛וּ רְא֥וּ אֶת הָ/אָ֖רֶץ וְ/אֶת יְרִיח֑וֹ וַ/יֵּ֨לְכ֜וּ וַ֠/יָּבֹאוּ בֵּית אִשָּׁ֥ה זוֹנָ֛ה וּ/שְׁמָ֥/הּ רָחָ֖ב וַ/יִּשְׁכְּבוּ שָֽׁמָּ/ה־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/001.yaml
  text: Then Joshua son of Nun sent two men secretly from Shittim as spies[a], saying, “Go, see the land and Jericho.” So they went and came to the house of a prostitute whose name was Rahab[c][b], and they lay down there.
translation:
  language: zh_hans
  text: 嫩的儿子约书亚从什亭暗中派出两名男子作探子，对他们说：“你们去察看那地和耶利哥[a]。”他们就去了，来到一个妓女[b]的家里；她名叫喇合。他们在那里躺下了[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文将“那地”和“耶利哥”并列；这里也可能是特意从全地中突出耶利哥。
    reason: 保留并说明并列结构可能表达的语义关系。
  - marker: b
    text: 有人根据语境或后期传统译作“客栈女主人”，但这里的希伯来词通常意为“妓女”。
    reason: 说明较弱的传统替代解释，同时保留通常词义。
  - marker: c
    text: 也可理解为“在那里住宿”。希伯来文直译是“在那里躺下了”。
    reason: 保留动词的字面表达及其在语境中可能指住宿的含义。
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: 派出
  rationale: 叙事中表示差遣执行任务；“派出”符合现代汉语，也自然衔接“作探子”。
- source_word: מִן הַשִּׁטִּים
  choice: 从什亭
  rationale: 将地名音译，不按其可能含义译作“皂荚树谷”等。
- source_word: שְׁנַיִם אֲנָשִׁים מְרַגְּלִים
  choice: 两个人作探子
  rationale: 保留人数和男性所指；“作探子”准确表达分词所指的任务身份。
- source_word: חֶרֶשׁ
  choice: 暗中
  rationale: 此处作副词，表明差遣或侦察行动秘密进行；“暗中”简洁自然。
- source_word: לְכוּ רְאוּ
  choice: 你们去察看
  rationale: 既保留两个命令的结构，又以“察看”体现侦察语境，而不增加“彻底勘察”等原文没有的程度。
- source_word: אֶת הָאָרֶץ וְאֶת יְרִיחוֹ
  choice: 那地和耶利哥
  rationale: 直接保留希伯来文的并列关系，不擅自将耶利哥解释为“尤其”或“也就是”那地。
- source_word: בֵּית אִשָּׁה זוֹנָה וּשְׁמָהּ רָחָב
  choice: 一个名叫喇合的妓女家里
  rationale: זוֹנָה通常意为“妓女”；中文用关系结构自然表达她的身份、名字和住所。
- source_word: וַיִּשְׁכְּבוּ שָׁמָּה
  choice: 在那里躺下了
  rationale: שכב的字面义是“躺下”；该译法保留措辞，不额外暗示性行为，也不把含义限定为正式投宿。
theological_decisions:
- issue: 喇合的身份（זוֹנָה）
  choice: 妓女
  alternative: 客栈女主人
  rationale: 该词通常明确指妓女。“客栈女主人”主要来自语境推断或后期传统，并非此希伯来词通常的词义，因此不应为淡化道德或社会含义而取代正文。
- issue: וַיִּשְׁכְּבוּ שָׁמָּה所暗示的行为
  choice: 在那里躺下了
  alternative: 在那里住宿
  rationale: 字面译法既不暗示他们与喇合发生性关系，也不把叙事明确化为一般住宿，从而保留原文可能指歇宿的语境张力。
- issue: “那地”和“耶利哥”的关系
  choice: 那地和耶利哥
  alternative: 那地，尤其是耶利哥
  rationale: 希伯来文以“和”连接二者。虽然耶利哥显然是侦察重点，但正文不把这一关系解释得比原文更明确。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“嫩的儿子约书亚”保留父名身份格式；“什亭”“耶利哥”“喇合”采用通行圣经地名、人名译法。叙事连接简洁，避免古奥的“遂”“乃”等用语，也避免把原文含混之处解释过度。
