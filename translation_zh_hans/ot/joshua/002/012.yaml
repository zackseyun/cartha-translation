source:
  edition: WLC
  text: וְ/עַתָּ֗ה הִשָּֽׁבְעוּ נָ֥א לִ/י֙ בַּֽ/יהוָ֔ה כִּי עָשִׂ֥יתִי עִמָּ/כֶ֖ם חָ֑סֶד וַ/עֲשִׂיתֶ֨ם גַּם אַתֶּ֜ם עִם בֵּ֤ית אָבִ/י֙ חֶ֔סֶד וּ/נְתַתֶּ֥ם לִ֖/י א֥וֹת אֱמֶֽת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/012.yaml
  text: And now[a], please swear to me by Yahweh that, just as I have shown kindness to you, you also will show kindness to my father's house and give me a sure sign,
translation:
  language: zh_hans
  text: 现在，请你们指着雅威向我起誓：既然我曾恩待你们，你们也要恩待我父亲一家，并给我一个确实的保证，
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַתָּה
  choice: 现在
  rationale: 作为话语转折，引出喇合眼下的请求；现代汉语用“现在”自然，也足以承载连接和时间意义。
- source_word: הִשָּׁבְעוּ נָא לִי
  choice: 请你们向我起誓
  rationale: 复数命令式由“你们”体现；נָא表达恳求语气，译作“请”。“向我起誓”表明誓言是对喇合所作。
- source_word: בַּיהוָה
  choice: 指着雅威
  rationale: 介词ב在誓言公式中表示所凭借、所援引的对象；“指着……起誓”是自然庄重的汉语表达。יהוה音译为“雅威”，保留神的专名。
- source_word: כִּי עָשִׂיתִי עִמָּכֶם חָסֶד
  choice: 我既以慈爱待你们
  rationale: כִּי在此连接起誓内容并引出互惠依据；“既……也……”准确呈现前后对应。חֶסֶד兼有恩慈和忠诚的关系性内涵，译作“慈爱”而不缩减为一般的友善。
- source_word: וַעֲשִׂיתֶם גַּם אַתֶּם עִם בֵּית אָבִי חֶסֶד
  choice: 你们也要以慈爱待我父家
  rationale: 承接起誓请求，完成“既……也……”结构。“我父家”保留希伯来家庭—家族用语，同时在现代中文中可理解为父亲所属的全家。
- source_word: וּנְתַתֶּם לִי אוֹת אֱמֶת
  choice: 并给我一个可靠的凭据
  rationale: אוֹת在此不是泛指神迹，而是用于保证承诺的标记或信物，故译“凭据”。אֱמֶת强调真实、可信、可依靠，译作“可靠的”；脚注保留其他可能表达。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名。音译“雅威”保留其专名性质，不以称号替代，也不把经文的盟约语境额外解释进正文。
- issue: חֶסֶד的关系性含义
  choice: 慈爱
  alternative: 恩待；忠诚之爱
  rationale: “慈爱”兼顾仁慈与关系中的忠诚，且前后重复，保留原文互惠结构；“忠诚之爱”虽能凸显忠贞，却可能在此过早限定为正式盟约术语。
- issue: אוֹת אֱמֶת所要求之物
  choice: 可靠的凭据
  alternative: 真实的记号；确实的保证
  rationale: 该短语可指可信的记号或可靠的保证。正文采用自然且不过度具体化的“可靠的凭据”，不预先断定其具体形式。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“指着雅威……起誓”保留誓言公式；“我父家”保留古代家族单位的表达，但不使用过度古雅措辞。经文在下一节继续，故句末保留逗号。
