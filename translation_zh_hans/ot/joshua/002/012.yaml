revisions:
- from: 现在，请你们指着雅威向我起誓：我既以慈爱待你们，你们也要以慈爱待我父家，并给我一个可靠的凭据[a]，
  to: 现在，请你们指着雅威向我起誓：既然我曾恩待你们，你们也要恩待我父亲一家，并给我一个确实的保证，
  rationale: 修订仅改善现代汉语中的语义贴切度与自然度：以“恩待”保留并自然表达两次 חֶסֶד 的互惠，以“我父亲一家”明确父家这一家庭单位，并以“确实的保证”表达或然为记号、或然为担保的 אוֹת אֱמֶת。句末逗号保留，因为原文句子延续至下一节。
