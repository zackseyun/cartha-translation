  text: And the men said to her[a], “We will be free from this oath of yours that you made us swear.”
translation:
  language: zh_hans
  text: 那两个人对她说：“我们不受你叫我们起的这个誓约束。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמְרוּ אֵלֶיהָ
  choice: 那两个人对她说
  rationale: 未完成式连续体推进叙事；结合上下文，用“那两个人”自然指回二人，同时不把原文普通名词具体化为“探子”。
- source_word: נְקִיִּם אֲנַחְנוּ
  choice: 我们就不受……约束
  rationale: נָקִי在誓言和法律语境中表示免除责任或义务。中文以“不受……约束”准确表达其契约含义；“就”结合下文条件条款传达语境中的将来/条件结果。
- source_word: מִשְּׁבֻעָתֵךְ הַזֶּה
  choice: 你叫我们起的这个誓
  rationale: 保留第二人称阴性单数所属关系及指示词“这个”；中文把关系从句前置较自然。
- source_word: אֲשֶׁר הִשְׁבַּעְתָּנוּ
  choice: 你叫我们起的
  rationale: שׁבע的使役式表示使某人起誓，“叫我们起”保留使役意义和第一人称复数宾语。
theological_decisions:
- issue: נְקִיִּם的时间与条件意义
  choice: 译作“我们就不受……约束”，并以前置条件提示承接下一节
  alternative: “我们不受……约束”或“我们将不受……约束”
  rationale: 希伯来文表面是无系词的形容词句，本身未明示时态；18节给出具体条件。译文保留法律性的免责含义，并按上下文自然呈现条件结果，但不把它解释为道德上的“无罪”。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“誓”比“誓言”更贴合“起誓”的固定搭配；“约束”清楚表达法律或盟约责任。为避免17节单独成句时造成二人立即否认誓约的误读，正文按下文显明的条件关系处理，并用脚注交代原文较简短的形式。
