  text: וְ/הָיָ֡ה כֹּ֣ל אֲשֶׁר יֵצֵא֩ מִ/דַּלְתֵ֨י בֵיתֵ֧/ךְ הַ/ח֛וּצָ/ה דָּמ֥/וֹ בְ/רֹאשׁ֖/וֹ וַ/אֲנַ֣חְנוּ נְקִיִּ֑ם וְ֠/כֹל אֲשֶׁ֨ר יִֽהְיֶ֤ה אִתָּ/ךְ֙ בַּ/בַּ֔יִת דָּמ֣/וֹ בְ/רֹאשֵׁ֔/נוּ אִם יָ֖ד תִּֽהְיֶה בּֽ/וֹ־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/019.yaml
  text: Anyone who goes out through the doors of your house, his blood will be on his own head, and we will be guiltless; but anyone who is with you in the house, his blood will be on our heads[a] if a hand is laid on him.
translation:
  language: zh_hans
  text: 凡从你家门出去的人，他的血要归到自己头上，我们便不负罪责；凡在屋里和你在一起的人，若有人对他下手，他的血要归到我们头上。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “他的血归到自己头上”和“他的血归到我们头上”是法律性的说法，表示由谁承担流血或死亡的责任。
    reason: cultural_note
lexical_decisions:
- source_word: וְהָיָה
  choice: 不单独译出
  rationale: 此形式在这里引出下一项约定；现代汉语可直接陈述条件，无须另加“将来必有”之类套语。
- source_word: כֹּל אֲשֶׁר
  choice: 凡……的
  rationale: 原文按个体分指任何符合条件的人；“凡……的”自然且保留法律条款的概括性。
- source_word: יֵצֵא מִדַּלְתֵי בֵיתֵךְ הַחוּצָה
  choice: 从你家门出去
  rationale: “出去”已经表达向外的方向，避免重复译成“出去到外面”。复数“门扇”在现代汉语中自然概括为“家门”。
- source_word: דָּמוֹ בְרֹאשׁוֹ
  choice: 他的血归到自己头上
  rationale: 保留希伯来语归责流血或死亡责任的法律性意象，并以脚注说明。
- source_word: וַאֲנַחְנוּ נְקִיִּם
  choice: 我们就没有罪责
  rationale: נְקִיִּם 在誓约语境中表示不承担责任；“没有罪责”比单说“无罪”更明确地传达法律责任。
- source_word: וְכֹל אֲשֶׁר יִהְיֶה אִתָּךְ בַּבָּיִת
  choice: 凡在屋里和你在一起的
  rationale: 保留与前半句相对的保护条件，即留在屋内、与喇合在一起的人。
- source_word: דָּמוֹ בְרֹאשֵׁנוּ
  choice: 他的血就归到我们头上
  rationale: 与前一句保持平行，表达探子承担流血或死亡的责任。
- source_word: אִם יָד תִּהְיֶה בוֹ
  choice: 若有人下手伤害他
  rationale: 原文直译近于“若有手在他身上”，是施加暴力或伤害的习语；译文保留施事者不确定的特点，并明确其伤害含义。
theological_decisions:
- issue: 是否保留“血归到头上”的血责习语
  choice: 在正文中保留“他的血归到自己头上／我们头上”
  alternative: 译为“他要为自己的死负责／我们要为他的死负责”
  rationale: 该表达是誓约和法律语境中的归责习语。保留原文意象可维持经文的庄严、平行结构与伦理张力，脚注则帮助现代读者理解。
- issue: 不定个体的性别表达
  choice: 依原文单数阳性形式译作“他”
  alternative: 改用不显性别的复数或重组句式
  rationale: 原文以单数阳性代词代表条款所涵盖的个体；中文“凡……的，他……”符合代表性法律表述，并不限定只有男性。
translation_notes:
  register: 采用现代、庄重而清楚的誓约条款语体。“家门”“屋里”贴近日常表达；“罪责”及平行的“血归到……头上”保留法律与盟誓色彩。脚注标记置于整组平行习语之后，涵盖两处表达。
