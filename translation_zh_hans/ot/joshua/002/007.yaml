base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/007.yaml
  text: And the men pursued after them on the way to the Jordan[a], as far as the fords, and they shut the gate behind them as soon as the pursuers had gone out after them.
translation:
  language: zh_hans
  text: 那些人沿着通往约旦河的路追赶他们，一直追到渡口[a]。追赶的人出去追赶他们以后，随后有人把城门关上了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“过河处”，指约旦河中可以涉水而过的浅处。
    reason: 说明מַעְבָּרוֹת的词义及其地理含义，同时保留较直译的表达。
lexical_decisions:
- source_word: וְהָאֲנָשִׁים
  choice: 那些人
  rationale: 定冠词所指的是上文奉命搜捕探子的那群人；现代汉语用“那些人”自然承接上下文，叙事连接词不必机械译出。
- source_word: רָדְפוּ אַחֲרֵיהֶם
  choice: 追赶他们
  rationale: 准确表达军事搜捕语境中的追逐行动，同时保留宾语“他们”。
- source_word: דֶּרֶךְ הַיַּרְדֵּן
  choice: 沿着通往约旦河的路
  rationale: דֶּרֶךְ在这里指道路或路线；此表达清楚传达该路通向约旦河，而非仅指大致方向。
- source_word: עַל הַמַּעְבְּרוֹת
  choice: 一直追到渡口
  rationale: מַעְבָּרוֹת是可供过河的地点，通常指浅滩渡口；结合移动动词，עַל表示追赶所达到的地点。
- source_word: וְהַשַּׁעַר סָגָרוּ
  choice: 城门就关上了
  rationale: 原文直译为“他们关了门”，但施事者未明说；汉语以状态变化表达可避免擅自指明关门者。“城门”依上下文明确所指。
- source_word: כַּאֲשֶׁר יָצְאוּ הָרֹדְפִים אַחֲרֵיהֶם
  choice: 追赶他们的人出去以后
  rationale: 把实词化分词译为“追赶他们的人”，并将时间关系自然表达为“出去以后”；不把כַּאֲשֶׁר过度限定为绝对即时。
theological_decisions: []
translation_notes:
  register: 采用现代、清楚而庄重的叙事语言。“一直追到”自然呈现追赶路线的终点；第二句避免补入原文没有明确指出的关门者。
