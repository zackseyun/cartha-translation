  text: וְ/אִם תַּגִּ֖ידִי אֶת דְּבָרֵ֣/נוּ זֶ֑ה וְ/הָיִ֣ינוּ נְקִיִּ֔ם מִ/שְּׁבֻעָתֵ֖/ךְ אֲשֶׁ֥ר הִשְׁבַּעְתָּֽ/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/020.yaml
  text: But if you tell this matter of ours[b][a], then we will be free from your oath that you made us swear.
translation:
  language: zh_hans
  text: 但如果你泄露我们这事[a]，我们就不必再受你叫我们起的誓约束[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“我们这件事”“我们这桩事务”或“我们的这番话”。希伯来语此词可指话语、事情或事务；这里指探子有关的秘密事项。
    reason: lexical_alternative
  - marker: b
    text: 直译“我们就脱离你叫我们起的誓而清白（或无须担责）”。这是说，如果她泄露秘密，他们便不再受这誓言约束。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: 但如果
  rationale: 连词与条件词在上下文中引出与先前承诺相对的例外条件；“但如果”自然表达这一转折。
- source_word: תַּגִּידִי
  choice: 你泄露
  rationale: נגד 的使役式可指“告知、使人知道”。本节所说的是把探子的秘密透露出去，因此“泄露”比一般的“告诉”更贴合语境；动词阴性单数形式表明对象是喇合。
- source_word: אֶת דְּבָרֵנוּ זֶה
  choice: 我们这件事
  rationale: דבר 可指话语、事情或事务；这里指探子的秘密行动及双方的约定。“我们这件事”保留指示语和所属关系，也不把所指限定得过窄。
- source_word: וְהָיִינוּ נְקִיִּם
  choice: 我们就不再……受……约束了
  rationale: היה 与 נקי 构成的表达在此表示免除责任或义务。汉语用“不再受……约束”清楚传达誓言不再具有约束力。
- source_word: מִשְּׁבֻעָתֵךְ
  choice: 受你叫我们起的誓约束
  rationale: 介词 מן 表示脱离；第二人称阴性单数后缀表明这是喇合要求他们所起的誓。汉语结合后面的关系从句表达，可避免把“你的誓”误解为喇合本人所起的誓。
- source_word: אֲשֶׁר הִשְׁבַּעְתָּנוּ
  choice: 你叫我们起的
  rationale: שׁבע 的使役式表示使某人起誓；“叫我们起的”自然保留使役含义。
theological_decisions:
- issue: 泄密是否解除探子履行誓言的责任
  choice: 译作“不再受……誓约束”，表明所述条件一旦发生，探子便免于该誓言的义务。
  alternative: 直译为“对于……誓，我们就是无罪的／清白的”。
  rationale: נקי 本可表示清白、无罪，但与 מן 及“誓”连用时重点是免除誓约责任；正文传达语境意义，脚注保留较字面的表达。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“泄露”明确呈现秘密语境；“不再受……约束”符合现代汉语表达，同时通过脚注保留 נקי“清白、无须担责”的字面意象。
