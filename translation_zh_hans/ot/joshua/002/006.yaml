  text: But she had brought them up to the roof and hidden them among the stalks of flax laid out for her on the roof.
translation:
  language: zh_hans
  text: 原来，她已经领他们上了屋顶，把他们藏在屋顶上为她铺开的亚麻秆中。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִיא הֶעֱלָתַם
  choice: 原来，她已经领他们上了
  rationale: 本句回溯说明先前已经发生的动作；用“原来……已经”自然表达希伯来叙事中的背景补述，并以“领……上”体现使役动词的方向。
- source_word: הַגָּגָה / עַל הַגָּג
  choice: 上了屋顶 / 在屋顶上
  rationale: “屋顶”符合古代近东可供活动、晾晒和藏身的平顶房屋语境；两次出现均按原文保留。
- source_word: בְּפִשְׁתֵּי הָעֵץ
  choice: 在……麻秆中
  rationale: 该短语指亚麻的茎秆；“麻秆”比泛称“麻”更具体，也比生硬的“亚麻木料”更符合现代汉语。
- source_word: הָעֲרֻכוֹת לָהּ
  choice: 为她铺开的
  rationale: 保留阴性复数分词所表达的“铺开、排列”状态，也保留 לָהּ 的受益或归属意味“为她”，不擅自补入“晾晒”等原文未明说的目的。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而自然的叙事语言。“原来”标明本节是对前文情势的回溯说明；保留“为她”，同时不进一步判定这些麻秆是谁铺的或具体为何铺开。
