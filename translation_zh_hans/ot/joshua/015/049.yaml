- source_word: דַנָּה
  choice: 但拿
  rationale: 地名按希伯来语音译，并采用现代中文圣经地名常见形式。
- source_word: קִרְיַת סַנָּה
  choice: 基列·萨拿
  rationale: 复合地名按音译处理；用间隔号标明两个音译成分，保留其地名形式，不将 קִרְיַת 意译为“城”。
- source_word: הִיא
  choice: 就是
  rationale: 此处用于说明两个地名所指相同；“就是”在现代汉语中自然、明确，同时保留原文的同一关系。
- source_word: דְבִר
  choice: 底璧
  rationale: 地名按希伯来语音译，并采用现代中文圣经中通行的译名。
- source_word: וְ
  choice: 、
  rationale: 原文连接词处于连续城邑名单中，中文以顿号自然呈现并列结构；本节开头的 וְ 不必机械译作“和”。
