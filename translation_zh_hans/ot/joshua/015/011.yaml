base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/011.yaml
  text: Then the border went out to the shoulder of Ekron northward[a], and the border bent toward Shikkeron, and passed over Mount Baalah, and went out to Jabneel[c][b]; and the ends of the border were at the sea.
translation:
  language: zh_hans
  text: 边界延伸到以革伦的北侧，转向施基仑，越过巴拉山，又延伸到雅比聂；边界的终点在海边。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יָצָא
  choice: 延伸到
  rationale: 在划定疆界的语境中，这个动词表示界线向下一处地标延展；译作“延伸到”既自然，也保留了行进与抵达的意味。
- source_word: גְּבוּל
  choice: 边界
  rationale: 此处指犹大所得地域的界线；“边界”是现代汉语中清楚、自然的地理用语。
- source_word: כֶּתֶף
  choice: 山坡
  rationale: 原义为“肩”，用于地貌时可指一处的侧面、坡地或山肩；“山坡”在汉语中较自然，同时脚注保留其直译和另一种理解。
- source_word: עֶקְרוֹן צָפוֹנָה
  choice: 向北……以革伦的山坡
  rationale: צָפוֹנָה带有向北的方向形式；希伯来语也可能是指以革伦的北侧，因此正文保留方向性，脚注说明句法上的另一种理解。
- source_word: תָּאַר
  choice: 转向
  rationale: 在疆界描述中，这个动词表示界线改变方向，或沿某方向划出；“转向”简洁地表达界线的转折。
- source_word: שִׁכְּרוֹנָה
  choice: 示基仑
  rationale: 这是地名，依现代中文圣经人名地名的常用音译方式处理。
- source_word: עָבַר
  choice: 经过
  rationale: 表示界线越过或经过某一地貌；“经过”适合汉语中的疆界叙述，又不强行判定具体越岭路线。
- source_word: הַר הַבַּעֲלָה
  choice: 巴拉山
  rationale: הַר可指山或丘陵；在地名结构中译为“巴拉山”简明自然。
- source_word: יַבְנְאֵל
  choice: 雅比聂
  rationale: 地名按中文传统形式音译。
- source_word: תֹּצְאוֹת
  choice: 尽头
  rationale: 复数形式在这里指边界的终点或末端；汉语用“尽头”最为清楚，不必机械保留复数。
- source_word: יָמָּה
  choice: 在海边
  rationale: 该方向形式可表示“向海”或“向西”；结合“边界的尽头”这一结构，译作“在海边”最符合地理终点的语境，同时由脚注保留方向性歧义。
