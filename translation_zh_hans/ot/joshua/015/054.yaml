  yaml_path: translation/ot/joshua/015/054.yaml
  text: 'Humtah[a], Kiriath-arba (that is, Hebron)[b], and Zior: nine cities with their settlements.'
translation:
  language: zh_hans
  text: 又有宏他、基列·亚巴（就是希伯仑）[a]、洗珥，共九座城，还有其所属的村庄[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “基列·亚巴，就是希伯仑”表明“基列·亚巴”即希伯仑。
    reason: cross_reference
  - marker: b
    text: 或译“属城的聚落”。希伯来语这个词可指与上述城邑相连的较小附属聚居地。
    reason: lexical_alternative
lexical_decisions:
- source_word: חֻמְטָה
  choice: 宏他
  rationale: 地名，按现代中文圣经地名的常见音译形式处理。
- source_word: קִרְיַת אַרְבַּע
  choice: 基列·亚巴
  rationale: 复合地名，保留其专名性质而不意译为“亚巴城”；中点帮助现代读者辨认名称的两个组成部分。
- source_word: הִיא חֶבְרוֹן
  choice: （就是希伯仑）
  rationale: 希伯来语以阴性代词加专名说明“基列·亚巴”即希伯仑；括注自然保留其解释功能。
- source_word: צִיעֹר
  choice: 洗珥
  rationale: 地名，采用适合现代普通话的传统音译。
- source_word: עָרִים תֵּשַׁע
  choice: 共九座城
  rationale: עָרִים可指城或城镇；在领地城邑清单中译作“城”简明且符合语境，数字是本组清单的总数。
- source_word: חַצְרֵיהֶן
  choice: 属城的村庄
  rationale: 该词在这类城邑清单中指附属于主要城邑的较小聚落；“属城的村庄”既表达从属关系，也避免把它们说成独立城市。
