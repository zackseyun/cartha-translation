  text: From there he went up against the inhabitants of Debir[a]. (Formerly the name of Debir was Kiriath-sepher.)
translation:
  language: zh_hans
  text: 他从那里上去攻打底璧的居民。（底璧从前名叫基列·西弗[a]。）
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “基列·西弗”可能意为“书之城”或“书写之城”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: 上去攻打
  rationale: עלה的基本意思是“上去”；结合军事叙事及后接“底璧的居民”，这里既有向上进发的地理意味，也有敌对行动的含义。“上去攻打”自然保留两者。
- source_word: מִשָּׁם
  choice: 从那里
  rationale: 这是指回前述地点的标准方位表达。
- source_word: אֶל יֹשְׁבֵי דְּבִר
  choice: 攻打底璧的居民
  rationale: יֹשְׁבֵי意为“居民、居住者”；介词אֶל本可表示“向、到”，但在此军事语境中，与וַיַּעַל合起来表达向居民进军，因此译作“攻打……的居民”。
- source_word: דְּבִר
  choice: 底璧
  rationale: 地名采用现代中文圣经读者较熟悉的传统音译，不按词义翻译。
- source_word: וְשֵׁם דְּבִר לְפָנִים
  choice: 底璧从前名叫
  rationale: לְפָנִים在这里表示时间上的“从前”；采用自然简洁的现代汉语语序，并以括号呈现补充背景。
- source_word: קִרְיַת סֵפֶר
  choice: 基列·西弗
  rationale: 作为地名在正文中音译；其组成部分可能表示“书卷之城”或“文字之城”，在脚注中保留这一词义可能性。
