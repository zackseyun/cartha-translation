lexical_decisions:
- source_word: צְנָן
  choice: 洗楠
  rationale: 这是犹大境内城镇名录中的专名，按现代中文圣经常见译名音译，不按词义翻译。
- source_word: חֲדָשָׁה
  choice: 哈大沙
  rationale: 该词虽与“新的”有关，但在本节作为地名使用，因此保留为音译。
- source_word: מִגְדַּל גָּד
  choice: 麦大迦得
  rationale: 这是复合地名；虽然 מִגְדָּל 可意为“塔”，此处仍按城镇专名音译，以保留其地名性质。
- source_word: וַ / וּ
  choice: 、……和……
  rationale: 希伯来语连接词串联名录中的三处城镇；中文采用顿号并在末项前用“和”，使列举自然清楚。
