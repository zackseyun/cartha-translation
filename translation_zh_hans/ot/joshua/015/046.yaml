  text: 从以革伦向西，亚实突附近的一切地方及其村庄。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מֵעֶקְרוֹן וָיָמָּה
  choice: 从以革伦往西，直到海边
  rationale: יָמָּה 字面为“向海”，在当地地理语境中表示向西；译文兼顾方向与其字面地理终点。
- source_word: כֹּל אֲשֶׁר עַל יַד אַשְׁדּוֹד
  choice: 包括靠近亚实突的一切地方
  rationale: עַל יַד 字面为“在……手边”，此处自然表示“靠近、在旁边”；אֲשֶׁר 的所指可概括前文城邑区域，故用“地方”避免误读为人。
- source_word: וְחַצְרֵיהֶן
  choice: 和所属的村庄
  rationale: חָצֵר 在城邑名录中指附属村庄或无城墙的聚落；复数代词表示这些地方所属的村庄。
