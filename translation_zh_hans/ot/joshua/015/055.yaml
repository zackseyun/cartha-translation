  text: 玛云[a]、迦密、西弗和淤他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节希伯来原文在城镇名录中仅列出地名：“玛云、迦密、西弗和淤他。”
    reason: cultural_note
lexical_decisions:
- source_word: מָעוֹן
  choice: 玛云
  rationale: 此处位于城镇名录中，是地名而非“居所”之意；采用现代中文圣经中较易辨认的传统译名。
- source_word: כַּרְמֶל
  choice: 迦密
  rationale: 此处指犹大山区的城镇，不按普通名词义译作“葡萄园地”；采用通行地名译法。
- source_word: וָזִיף
  choice: 西弗
  rationale: ו 为连接词，译文依中文列举习惯不逐一重复“和”；זִיף 采用通行地名译法“西弗”。
- source_word: וְיוּטָּה
  choice: 和淤他
  rationale: ו 译作列举末项前的“和”；יוּטָּה 采用可辨认的传统中文地名译法“淤他”。
