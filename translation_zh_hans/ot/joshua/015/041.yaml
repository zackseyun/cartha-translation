  register: 采用简洁庄重的现代标准汉语，保持地名清单的紧凑节奏。正文脚注标记置于实际涉及的“伯大衮”之后；原英文材料将标记放在“Gederoth”之后，但脚注内容明确解释的是Beth-dagon。
