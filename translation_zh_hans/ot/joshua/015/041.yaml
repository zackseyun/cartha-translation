base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/041.yaml
  text: 'and Gederoth[a], Beth-dagon, Naamah, and Makkedah: sixteen cities with their villages.'
translation:
  language: zh_hans
  text: 基低罗、伯大衮[a]、拿玛和玛基大，共十六座城，以及所属的村庄。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “伯大衮”字面意思是“大衮之家”；这里是地名，所以采用音译。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּגְדֵרוֹת
  choice: 基低罗
  rationale: 这是带连接词的地名；采用现代中文圣经读者较熟悉的传统音译。“和”的并列关系由整串地名的中文列举结构自然表达。
- source_word: בֵּית דָּגוֹן
  choice: 伯大衮
  rationale: 该复合词字面为“大衮之家”，但在这里用作地名，因此采用传统音译，不在正文中按普通名词翻译。
- source_word: וְנַעֲמָה
  choice: 拿玛
  rationale: 地名，采用传统中文音译；其前连接词通过中文列举标点表达。
- source_word: וּמַקֵּדָה
  choice: 和玛基大
  rationale: 地名采用传统中文音译，并在最后一项前用“和”自然表达希伯来语连接词。
- source_word: עָרִים
  choice: 城
  rationale: 在分地清单中指有居民的聚居中心；“城”简洁、传统，也适合本节的行政地理语境。
- source_word: שֵׁשׁ עֶשְׂרֵה
  choice: 十六座
  rationale: 直接表达原文基数，并按现代汉语为“城”加量词“座”。
- source_word: וְחַצְרֵיהֶן
  choice: 以及所属的村庄
  rationale: חָצֵר在此类分地公式中指附属于上述城邑的乡村聚落；“所属的村庄”既自然，也保留三复阴后缀所表达的归属关系。
theological_decisions: []
