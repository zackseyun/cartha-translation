base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/016.yaml
  text: And Caleb said[a], “Whoever strikes Kiriath-sepher and captures it, I will give him Achsah my daughter as a wife.”
translation:
  language: zh_hans
  text: 迦勒说[a]：“谁攻打基列·西弗并夺取那城，我就把我女儿押撒给他为妻。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“那攻打基列·西弗并夺取那城的人，我就把我女儿押撒给他为妻。”
    reason: 原文 אֲשֶׁר 可理解为不定的“谁”，也可用名词化关系从句译作“那……的人”；两者在此意义接近。
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: 未显式译出连接词，以符合现代汉语叙事习惯；动词准确引出迦勒接下来的话。
- source_word: כָּלֵב
  choice: 迦勒
  rationale: 采用现代中文圣经中通行的人名音译。
- source_word: אֲשֶׁר
  choice: 谁
  rationale: 在此引出不定关系从句，表达迦勒向任何符合条件者提出的公开应许；“谁”自然简洁。
- source_word: יַכֶּה
  choice: 攻打
  rationale: נכה 的使役形在军事语境中表示击打或攻击；“攻打”比字面的“击打”更符合汉语对攻城行动的表达，同时不预先等同于得胜。
- source_word: קִרְיַת סֵפֶר
  choice: 基列·西弗
  rationale: 按专名音译，并用间隔号清楚标示复合地名。
- source_word: וּלְכָדָהּ
  choice: 并将城夺取
  rationale: לכד 在军事语境中指攻取、占领；阴性单数后缀回指该城，译作“将城夺取”使中文指代清楚。
- source_word: וְנָתַתִּי לוֹ
  choice: 我就把……给他
  rationale: 上下文构成条件与结果，汉语用“就”自然表达随后的承诺；“给他”保留受领者。
- source_word: עַכְסָה בִתִּי
  choice: 女儿押撒
  rationale: 保留亲属身份并按中文自然语序放在人名前；押撒采用通行音译。
- source_word: לְאִשָּׁה
  choice: 为妻
  rationale: 准确表达将女儿嫁给对方，措辞简洁庄重，不额外加入原文未明说的所有格。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。正文以“谁……我就……”呈现公开挑战和承诺；保留“攻打”与“夺取”两个动作，不将其合并为较宽泛的“攻克”。
