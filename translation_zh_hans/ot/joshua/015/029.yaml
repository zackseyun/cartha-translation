lexical_decisions:
- source_word: בַּעֲלָה
  choice: 巴亚拉
  rationale: 这是城镇名，按希伯来语马所拉文本的读音音译；用“巴亚拉”体现中间的喉音间隔，并保留词尾音节。
- source_word: עִיִּים
  choice: 以因
  rationale: 此词在城镇名单中是地名，故不按其可能的普通名词含义“废墟、乱石堆”意译。“以因”是适合现代汉语的音译，并尽量反映词中的复辅音及复数词尾。
- source_word: עָצֶם
  choice: 以森
  rationale: 这是地名，按本节希伯来语的元音形式音译；“以森”避免沿用从英语拼写间接转写而来的形式。
- source_word: וְ / וָ
  choice: 、；和
  rationale: 前两个并列项用顿号，末项前用“和”，自然呈现希伯来语城镇名单中的并列关系。
