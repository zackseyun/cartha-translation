  text: זֹ֗את נַחֲלַ֛ת מַטֵּ֥ה בְנֵי יְהוּדָ֖ה לְ/מִשְׁפְּחֹתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/020.yaml
  text: This was the inheritance of the tribe of the sons of Judah according to their clans[a].
translation:
  language: zh_hans
  text: 这是犹大支派按宗族所得的产业。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“这是犹大支派按宗族所得的地业。”
    reason: “产业”保留承受之份的含义；“地业”则更明确指出这里所说的是分得的土地。
lexical_decisions:
- source_word: זֹאת
  choice: 这是
  rationale: 指回前文所述的地域分配。希伯来语无系动词时态标记，中文用“这是”自然地保留概括陈述的表达，不强行判定过去或现在。
- source_word: נַחֲלַת
  choice: 所得的产业
  rationale: נַחֲלָה在分地语境中指作为承受之份而获得的土地；“所得的产业”兼顾分配结果与承受产业的含义。
- source_word: מַטֵּה
  choice: 支派
  rationale: 此处是以色列部族组织的标准用语，译为“支派”。
- source_word: בְנֵי יְהוּדָה
  choice: 犹大支派
  rationale: 原文直译为“犹大众子（的支派）”，但现代汉语中“犹大支派”清楚自然，并表达其族裔共同体含义。
- source_word: לְמִשְׁפְּחֹתָם
  choice: 按宗族
  rationale: מִשְׁפָּחָה在支派分地语境中指支派内部的宗族群体；前缀לְ表示按这些群体进行分配。
theological_decisions: []
