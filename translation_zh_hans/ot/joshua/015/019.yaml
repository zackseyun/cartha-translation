base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/019.yaml
  text: She said[a], “Please give me a blessing, since you have given me the land of the Negev[c][b]; give me also springs of water.” So he gave her the upper springs and the lower springs.
translation:
  language: zh_hans
  text: 她说：“求你给我一份福分[a]。你既把南地[b]给了我，也求你把水泉[c]给我。”于是迦勒把上方的水泉和下方的水泉都给了她。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “福分”也可译作“礼物”。希伯来文直译为“祝福”，在这里指一项有益的赠与。
    reason: lexical_alternative
  - marker: b
    text: “南地”所译的希伯来词也可指“南方地区”，并常特指干旱的南部区域，即尼革夫。
    reason: lexical_alternative
  - marker: c
    text: 此处译作“水泉”的希伯来词所指并不完全确定，也可能指水池或蓄水池。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְרָכָה
  choice: 一份福分
  rationale: 该词通常指“福、祝福”，此处具体指父亲所赐的有益产业或赠礼。“一份福分”既保留希伯来文的祝福用语，也符合女儿请求实际馈赠的语境。
- source_word: אֶרֶץ הַנֶּגֶב
  choice: 南地
  rationale: נֶגֶב既可指“南方”，也可指干旱的南部地区，并可作为地名。“南地”是简洁、自然的地理称呼，同时保留原词的地域含义。
- source_word: גֻּלֹּת מָיִם
  choice: 水泉
  rationale: גֻּלֹּת的确切所指存在争议，可能是泉源、水池或蓄水洼地；结合上下水源的区分，“水泉”最贴合土地供水的语境，又不作过度具体化。
- source_word: תְּנָה לִּי
  choice: 求你赐我
  rationale: 祈使式在父女请求的语境中带有恳请意味；“求你”表达礼貌请求，“赐”与后面的“福分”自然搭配。
- source_word: וְנָתַתָּה לִי
  choice: 也求你把……赐给我
  rationale: 连接词引出追加请求；“也”清楚表达她在所得土地之外进一步请求水源。
- source_word: גֻּלֹּת עִלִּיּוֹת / גֻּלֹּת תַּחְתִּיּוֹת
  choice: 上边的水泉和下边的水泉
  rationale: 两个形容词构成明确对举，表示位置或地势较高与较低的水源；此译保持平行结构。
- source_word: וַיִּתֶּן לָהּ
  choice: 于是迦勒……给了她
  rationale: 叙事连接词承接她的请求；“于是”体现事件推进。按上下文补出主语“迦勒”，避免现代汉语中的指代含混。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。“求你赐我”保留恳请语气；“福分”保留原文的祝福措辞而不把它完全解释成普通礼物。正文中的脚注标记均紧随相关词语。
