  text: 又有尼布珊、盐城和隐·基底，共六座城，及其所属的聚落。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “所属的聚落”也可译作“属城的村庄”。希伯来语可指与所列城邑相关、规模较小的附属地方。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנִּבְשָׁן
  choice: 尼珊
  rationale: 专有地名按希伯来语音译；词首定冠词不另行译出，以符合现代汉语地名习惯。
- source_word: עִיר הַמֶּלַח
  choice: 盐城
  rationale: 该结构直译为“盐之城”，作为含义透明的地名，简洁译为“盐城”。
- source_word: עֵין גֶּדִי
  choice: 隐·基底
  rationale: 采用中文圣经读者较熟悉的传统音译，并以间隔号清楚标示复合地名；不把其字面含义“山羊羔之泉”直接译入正文。
- source_word: עָרִים שֵׁשׁ
  choice: 共六座城
  rationale: 准确表达名单的数目总结；“共”使现代汉语列举自然，“城”保留 עָרִים 的常规地域名单用语。
- source_word: חַצְרֵיהֶן
  choice: 属城的村庄
  rationale: 该词指与所列城邑相连的附属、小型或可能不设防的聚落；此译表达其从属关系，同时保留“村落/聚落”的词义范围。
- source_word: וְ
  choice: 还有／和／以及
  rationale: 按现代汉语列表语法灵活处理重复连词：句首用“还有”承接上文，项目间用“和”，总结处用“以及”。
