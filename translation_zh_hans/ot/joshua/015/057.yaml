  text: 哈该隐、基比亚和亭拿：共十座城及其所属的村庄[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “村庄”或译“聚落”，指隶属于这些城邑的较小居民点。
    reason: 说明חַצְרֵיהֶן的词义范围及这些居民点与城邑的附属关系。
lexical_decisions:
- source_word: הַקַּיִן
  choice: 哈该隐
  rationale: 这是城邑名单中的地名。按希伯来语形式音译，并保留词首冠词与名称连读所形成的音节。
- source_word: גִּבְעָה
  choice: 基比亚
  rationale: 这里是地名，不按普通名词义译为“山冈”；采用现代中文圣经读者较熟悉的音译。
- source_word: תִמְנָה
  choice: 亭拿
  rationale: 这是分地名单中的地名，采用通行、简洁的中文音译。
- source_word: עָרִים עֶשֶׂר
  choice: 共十座城
  rationale: 原文是名单结尾概括城邑数目的固定表达；加入“共”使现代汉语自然，并准确呈现总数。
- source_word: חַצְרֵיהֶן
  choice: 所属的村庄
  rationale: חָצֵר在此指依附于所列城邑的较小聚落；“所属的村庄”既自然，也表达其附属性。
