  yaml_path: translation/ot/joshua/015/025.yaml
  text: and Hazor-hadattah[a], and Kerioth-hezron (that is, Hazor)[b],
translation:
  language: zh_hans
  text: 夏琐·哈大他[a]、加略·希斯仑（就是夏琐）[b]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可能译作：“夏琐、哈大他和加略·希斯仑（就是夏琐）”，即把“哈大他”视为另一个城名，而不是复合地名“夏琐·哈大他”的一部分。
    reason: alternative_reading
  - marker: b
    text: “加略”也可音译为“基列约”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/חָצוֹר חֲדַתָּה
  choice: 哈琐·哈大他
  rationale: 按马所拉重音和城邑名单的通常理解，将两词视为复合地名；专名采用音译，不把 חֲדַתָּה 意译为“新的”。
- source_word: וּ/קְרִיּוֹת חֶצְרוֹן
  choice: 加略·希斯仑
  rationale: 在犹大城邑名单中，将 קְרִיּוֹת 视为专名而非普通名词“城镇”，并与 חֶצְרוֹן 合为复合地名。
- source_word: הִיא
  choice: 就是
  rationale: 这里的代词引出同位说明，现代汉语用“就是”能自然保留其辨认、解释作用。
- source_word: חָצוֹר
  choice: 哈琐
  rationale: 作为结尾的地名，与前述地点构成同位辨认；沿用常见中文圣经专名译法。
