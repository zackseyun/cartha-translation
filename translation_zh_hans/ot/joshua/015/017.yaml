  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַֽ/יִּלְכְּדָ֛/הּ עָתְנִיאֵ֥ל בֶּן קְנַ֖ז אֲחִ֣י כָלֵ֑ב וַ/יִּתֶּן ל֛/וֹ אֶת עַכְסָ֥ה בִתּ֖/וֹ לְ/אִשָּֽׁה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/017.yaml
  text: Othniel son of Kenaz[a], Caleb’s brother, captured it[b], and he gave him his daughter Achsah as a wife.
translation:
  language: zh_hans
  text: 基纳斯的儿子俄陀聂——迦勒的兄弟[b]——攻取了那城[a]，迦勒就把女儿押撒给他为妻。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 指上一节所说的基列·西弗，也就是底璧。
    reason: cross_reference
  - marker: b
    text: “兄弟”也可能泛指“亲族”；另有人把这句话理解为基纳斯是迦勒的兄弟。
    reason: lexical_and_syntactic_alternative
lexical_decisions:
- source_word: וַיִּלְכְּדָהּ
  choice: 攻取了那城
  rationale: לכד在此指以武力夺取；阴性单数宾语后缀回指上一节的城。译出“那城”比汉语中的“攻取了它”更自然，也清楚保留跨节指代。
- source_word: עָתְנִיאֵל
  choice: 俄陀聂
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: בֶּן קְנַז
  choice: 基纳斯的儿子
  rationale: 直接表达希伯来语父子关系结构，并采用通行人名译法。
- source_word: אֲחִי כָלֵב
  choice: 迦勒的兄弟
  rationale: אָח的通常意义是“兄弟”；不擅自译成“弟弟”，因为原文没有标明长幼。短语在句法上紧随“基纳斯”，其所修饰者存在一定讨论空间，正文依照较直接的同位理解指俄陀聂，并以脚注保留亲属称谓的词义余地。
- source_word: וַיִּתֶּן לוֹ
  choice: 迦勒就把……给他
  rationale: 原文用代词承接上文；中文明确说出施事“迦勒”，避免连续男性代词造成歧义，而“他”自然回指俄陀聂。
- source_word: אֶת עַכְסָה בִתּוֹ
  choice: 女儿押撒
  rationale: 按自然中文语序表达押撒是迦勒的女儿；人物关系由明确写出的主语“迦勒”承接。
- source_word: לְאִשָּׁה
  choice: 给他为妻
  rationale: 保留希伯来语“给……为妻”的婚配惯用语，表达简洁、庄重，不增添原文未明说的礼俗细节。
theological_decisions:
- issue: אֲחִי כָלֵב所指的亲属关系及修饰对象
  choice: 正文译作俄陀聂是“迦勒的兄弟”
  alternative: 也可理解为“迦勒的亲族”，或在句法上理解为基纳斯是迦勒的兄弟
  rationale: אָח的本义是兄弟，但可扩指近亲；短语的位置也使同位关系存在句法讨论。正文采用直接读法，同时不以“弟弟”等更具体称谓消除原文未说明的空间。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“攻取”保留军事语感；破折号标明同位说明，减少人物关系误读。所有脚注标记均置于正文相应位置。
