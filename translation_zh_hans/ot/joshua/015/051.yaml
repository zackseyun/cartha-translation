- source_word: עָרִים
  choice: 城
  rationale: 在领土城邑清单中指有组织的聚居地；译作“城”简洁而符合本段体裁。
- source_word: אַחַת עֶשְׂרֵה
  choice: 十一座
  rationale: 希伯来语基数词；配合“城”用现代汉语量词“座”自然表达。
- source_word: חַצְרֵיהֶן
  choice: 属城的村庄
  rationale: 指隶属于这些城邑的乡村或无城墙的附属聚落；“属城的村庄”既表达依附关系，也便于现代读者理解。
