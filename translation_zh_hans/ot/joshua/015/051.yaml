- source_word: גֹשֶׁן
  choice: 歌珊
  rationale: 地名；采用现代中文圣经读者较熟悉的传统音译。
- source_word: חֹלֹן
  choice: 何伦
  rationale: 地名；按希伯来语发音并兼顾现代中文人名、地名音译的自然形式。
- source_word: גִלֹה
