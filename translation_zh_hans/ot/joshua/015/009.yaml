  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/תָאַ֨ר הַ/גְּב֜וּל מֵ/רֹ֣אשׁ הָ/הָ֗ר אֶל מַעְיַן֙ מֵ֣י נֶפְתּ֔וֹחַ וְ/יָצָ֖א אֶל עָרֵ֣י הַר עֶפְר֑וֹן וְ/תָאַ֤ר הַ/גְּבוּל֙ בַּעֲלָ֔ה הִ֖יא קִרְיַ֥ת יְעָרִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/009.yaml
  text: Then the border curved from the top of the mountain to the spring of the waters of Nephtoah[a], and went out to the cities of Mount Ephron; then the border curved to Baalah (that is, Kiriath-jearim).
translation:
  language: zh_hans
  text: 疆界从山顶转向尼弗多亚水泉[a]，又延伸到以弗仑山的各城；随后，疆界转向巴拉，就是基列·耶琳。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“疆界从山顶划向尼弗多亚水泉”或“疆界从山顶绕向尼弗多亚水泉”。这里的希伯来语动词在划界语境中可指勾画界线或界线改变方向。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְתָאַר
  choice: 转向
  rationale: 该动词在划界语境中可表示界线被勾画或改变走向；“转向”自然地表达此处的地理推进，同时不把具体形状限定为弧线。
- source_word: הַגְּבוּל
  choice: 疆界
  rationale: “疆界”适合领地分配和地理边界的语境，也符合庄重而易懂的现代汉语。
- source_word: מֵרֹאשׁ הָהָר
  choice: 从山顶
  rationale: 准确表达 רֹאשׁ 在地理短语中的“顶部、顶峰”之意，且简洁自然。
- source_word: מַעְיַן מֵי נֶפְתּוֹחַ
  choice: 尼弗多亚水泉
  rationale: 保留“泉”和“水”的复合表达，并将 נֶפְתּוֹחַ 按地名音译；中文采用紧凑结构，避免生硬的“尼弗多亚之水的泉”。
- source_word: וְיָצָא
  choice: 延伸到
  rationale: 在边界描述公式中，该词表示界线继续伸展至某处；“延伸到”比直译“出去”更符合现代汉语地理叙述。
- source_word: עָרֵי הַר עֶפְרוֹן
  choice: 以弗仑山的各城
  rationale: 按原文保留“城”的复数以及“以弗仑山”的压缩地理表达，不扩译为“山区”。
- source_word: בַּעֲלָה
  choice: 巴拉
  rationale: 作为地名音译，并与下文的同地异名说明衔接。
- source_word: הִיא קִרְיַת יְעָרִים
  choice: 就是基列·耶琳
  rationale: 原文代词用于确认巴拉与基列·耶琳是同一地点；“就是”在现代汉语中清楚自然。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而通顺的地理叙述。“疆界”贯穿本节；地名按常见中文圣经译名处理。“转向”保留原动词在划定路线与改变方向之间的语义张力，并用脚注注明其他可能译法。
