base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/002.yaml
  text: Their southern border was from the end of the Salt Sea[b][a], from the tongue that faces southward.
translation:
  language: zh_hans
  text: 他们南面的边界从盐海[b]的尽头起，就是从那朝南的舌状海湾[a]起。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语直译为“舌头”，这里是地形用语，指舌形的海湾或汊口。
    reason: lexical_alternative
  - marker: b
    text: 即死海。
    reason: cross_reference
lexical_decisions:
- source_word: וַיְהִי לָהֶם
  choice: 他们……的边界，是……起
  rationale: 以现代汉语领属结构表达希伯来语“为他们有”的边界说明句式，避免生硬直译。
- source_word: גְּבוּל נֶגֶב
  choice: 南面的边界
  rationale: נֶגֶב在此表示领地的南侧，不是专名“南地”；“南面的边界”自然清楚。
- source_word: מִקְצֵה
  choice: 从……的尽头起
  rationale: 保留起点及地理端点的空间意义；“尽头”比“末端”更适合普通读者。
- source_word: יָם הַמֶּלַח
  choice: 盐海
  rationale: 按希伯来语原称直译，并以脚注说明其通称“死海”。
- source_word: מִן הַלָּשֹׁן
  choice: 从……海湾起
  rationale: לָשׁוֹן字面为“舌头”，在地貌语境中指舌形的水湾或汊口；正文采用自然、可理解的地理用语，并在脚注保留原文意象。
- source_word: הַפֹּנֶה נֶגְבָּה
  choice: 那朝南的
  rationale: 准确表达该地貌朝向南方的方位关系，简洁自然。
theological_decisions: []
