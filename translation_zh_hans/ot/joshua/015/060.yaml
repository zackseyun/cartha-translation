  text: 'Kiriath-baal (that is[a], Kiriath-jearim), and Rabbah: two cities with their settlements.'
translation:
  language: zh_hans
  text: 基列·巴力（就是基列·耶琳）和拉巴；共两座城，及其附属村庄[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“聚落”。这里的希伯来语指与上述城邑相连、隶属于它们的居民点。
    reason: lexical_alternative
lexical_decisions:
- source_word: קִרְיַת בַּעַל
  choice: 基列·巴力
  rationale: 这是地名，采用音译，不按词源意译为“巴力之城”；加间隔号便于现代读者辨认复合地名。
- source_word: הִיא
  choice: 就是
  rationale: 这里的代词用于同位解释，表明“基列·巴力”与“基列·耶琳”是同一座城的两个名称；“就是”自然传达这种辨明关系。
- source_word: קִרְיַת יְעָרִים
  choice: 基列·耶琳
  rationale: 作为地名音译，保留其专名性质，不按词源意译为“树林之城”。
- source_word: הָרַבָּה
  choice: 拉巴
  rationale: 按专有地名音译；希伯来语中的定冠词不另行译出，因为在中文地名中不自然。
- source_word: עָרִים שְׁתַּיִם
  choice: 共两座城
  rationale: 这是对前述两座城的总计；加入“共”使清单式总结在现代汉语中更清楚。
- source_word: חַצְרֵיהֶן
  choice: 各自所属的村庄
  rationale: חָצֵר在领地城邑清单中常指依附于主要城邑的外围村落；“各自所属”明确复数后缀与两座城的关系，同时不把这些聚落说成独立城市。
