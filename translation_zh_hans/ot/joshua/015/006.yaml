  text: וְ/עָלָ֤ה הַ/גְּבוּל֙ בֵּ֣ית חָגְלָ֔ה וְ/עָבַ֕ר מִ/צְּפ֖וֹן לְ/בֵ֣ית הָעֲרָבָ֑ה וְ/עָלָ֣ה הַ/גְּב֔וּל אֶ֥בֶן בֹּ֖הַן בֶּן רְאוּבֵֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/006.yaml
  text: Then the border went up to Beth-hoglah[a], and passed north of Beth-arabah; and the border went up to the stone of Bohan son of Reuben.
translation:
  language: zh_hans
  text: 边界又上到伯·曷拉，从伯·亚拉巴北面经过；边界又上到吕便之子波罕的石头那里。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעָלָה
  choice: 又上到
  rationale: 在划界叙述中表示界线向较高处或某方向延伸；“上到”既保留地形意味，也符合现代汉语表达。
- source_word: הַגְּבוּל
  choice: 边界
  rationale: 此处指划定领土的界线，而不是整片地域；“边界”准确且自然。
- source_word: בֵּית חָגְלָה
  choice: 伯·曷拉
  rationale: 按地名音译；中点显示“伯”是复合地名中对应 בֵּית 的组成部分。
- source_word: וְעָבַר מִצְּפוֹן לְבֵית הָעֲרָבָה
  choice: 从伯·亚拉巴北面经过
  rationale: 边界公式中的 מִצְּפוֹן 表示界线相对于该地从北侧经过；此译法自然保留其空间关系。
- source_word: אֶבֶן בֹּהַן
  choice: 波罕的石头
  rationale: 保留希伯来语的所属结构，同时用现代汉语自然表达；原文没有明确要求将其解释为普通石块、界石或磐石。
- source_word: בֶּן רְאוּבֵן
  choice: 吕便之子
  rationale: 原文明确作“吕便之子”，故不改释为较概括的“吕便支派的人”。
theological_decisions: []
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。重复“边界又上到”以保留原文界线叙述的节奏和结构；人名、地名按音译处理。英文咨询稿的脚注内容涉及“波罕的石头”的措辞，却标在“伯·曷拉”之后，且希伯来原文的附属结构并无需要另注的实质歧义，因此本稿不沿用该脚注。
