lexical_decisions:
- source_word: קִינָה
  choice: 基拿
  rationale: 这是犹大城邑列表中的专名，按希伯来语音译；“基拿”以现代中文圣经地名常用的简洁形式表示 קִינָה。
- source_word: דִימוֹנָה
  choice: 底摩拿
  rationale: 这是地名，按希伯来语音译；“底摩拿”保留其三个主要音节，并采用自然的中文专名形式。
- source_word: עַדְעָדָה
  choice: 亚大达
  rationale: 这是城邑专名，按希伯来语音译；“亚大达”体现原名中重复的 ד 音节结构。
- source_word: וְ
  choice: 、；和
  rationale: 希伯来文在各地名前均有连接词。现代汉语列举时以前两项间的顿号和末项前的“和”自然表达其并列关系。
