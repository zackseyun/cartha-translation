  register: 采用现代、庄重而易懂的地理划界语体。地名沿用简体中文圣经中较通行的形式；句法适度拆分，以清楚呈现吉甲、亚都冥坡与干河谷之间的方位关系，同时不消除原文介词和复数表达中的真实含混。
