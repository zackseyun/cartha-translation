  text: וְ/עָלָ֨ה הַ/גְּב֥וּל דְּבִרָ/ה֮ מֵ/עֵ֣מֶק עָכוֹר֒ וְ/צָפ֜וֹנָ/ה פֹּנֶ֣ה אֶל הַ/גִּלְגָּ֗ל אֲשֶׁר נֹ֨כַח֙ לְ/מַעֲלֵ֣ה אֲדֻמִּ֔ים אֲשֶׁ֥ר מִ/נֶּ֖גֶב לַ/נָּ֑חַל וְ/עָבַ֤ר הַ/גְּבוּל֙ אֶל מֵי עֵ֣ין שֶׁ֔מֶשׁ וְ/הָי֥וּ תֹצְאֹתָ֖י/ו אֶל עֵ֥ין רֹגֵֽל׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/007.yaml
  text: And the border went up to Debir from the Valley of Achor[a], and turned northward toward Gilgal, which is opposite the Ascent of Adummim, which is south of the wadi. Then the border passed on to the waters of En-shemesh[c][b], and its end was at En-rogel.
translation:
  language: zh_hans
  text: 边界从亚割谷上到底璧，又转向北，朝着吉甲[a]；吉甲在亚都冥坡对面，亚都冥坡位于那条干河谷[b]以南。随后，边界延伸到隐示麦的水边，终止于隐罗结[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“到吉甲”。这里的希伯来语既可表示朝着该地的方向，也可表示界线到达该地。
    reason: lexical_alternative
  - marker: b
    text: “干河谷”所译的希伯来语常指季节性有水的河床或沟谷，并不一定是常年有水的河流。
    reason: cultural_note
  - marker: c
    text: 直译“它的出口（复数）在隐罗结”；在划界叙述中，这一复数表达指边界的终点或尽头。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָלָה הַגְּבוּל
  choice: 边界……上到
  rationale: 在划界叙述中，עלה常表示界线向较高处延伸；“上到”既保留地势含义，也符合现代汉语表达。
- source_word: דְּבִרָה
  choice: 到底璧
  rationale: 地名后的方向词尾表示朝向或到达该地；结合界线行进的语境译作“到底璧”。“底璧”采用通行的中文圣经地名形式。
- source_word: מֵעֵמֶק עָכוֹר
  choice: 从亚割谷
  rationale: עֵמֶק意为谷地；采用简洁自然的中文地名“亚割谷”。
- source_word: וְצָפוֹנָה פֹּנֶה
  choice: 又转向北
  rationale: פנה与方向词连用，表示转向或面向；在描绘边界线时，“转向北”最为清楚自然。
- source_word: אֶל הַגִּלְגָּל
  choice: 朝着吉甲
  rationale: אֶל可表示向着某处，也可表示到某处；正文以“朝着”保留界线朝向该地的图景，并用脚注说明另一种可能。
- source_word: אֲשֶׁר נֹכַח לְמַעֲלֵה אֲדֻמִּים
  choice: 吉甲在亚都冥坡对面
  rationale: נֹכַח表示在对面或面对；מַעֲלֵה指上坡、坡道，故将地形名称译作“亚都冥坡”。
- source_word: אֲשֶׁר מִנֶּגֶב לַנָּחַל
  choice: 亚都冥坡位于那条干河谷以南
  rationale: 第二个关系从句最自然地修饰紧邻的“亚都冥坡”。נֶגֶב在此是方位“南”，נַחַל则指当地季节性水道或沟谷，而非恒常河流。
- source_word: וְעָבַר הַגְּבוּל
  choice: 随后，边界经过
  rationale: עבר在划界套语中表示界线继续经过或通向下一地点；“经过”不额外断定界线横渡了某物。
- source_word: אֶל מֵי עֵין שֶׁמֶשׁ
  choice: 隐示麦的水源
  rationale: מֵי直译为“水”，此处指隐示麦一带的水源；保留地名音译，同时以“水源”给出自然且符合地形的表达。
- source_word: וְהָיוּ תֹצְאֹתָיו אֶל עֵין רֹגֵל
  choice: 终止于隐罗结
  rationale: תֹצְאוֹת在边界叙述中指界线的尽头或终点；正文采用自然的单数表达“终止于”，脚注保留希伯来语复数形式的信息。
