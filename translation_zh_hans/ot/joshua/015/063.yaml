reference: Joshua 15:63
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/אֶת הַ/יְבוּסִי֙ יוֹשְׁבֵ֣י יְרֽוּשָׁלִַ֔ם לֹֽא יוכלו בְנֵֽי יְהוּדָ֖ה לְ/הֽוֹרִישָׁ֑/ם וַ/יֵּ֨שֶׁב הַ/יְבוּסִ֜י אֶת בְּנֵ֤י יְהוּדָה֙ בִּ/יר֣וּשָׁלִַ֔ם עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/063.yaml
  text: But the sons of Judah could not dispossess the Jebusites[a], the inhabitants of Jerusalem, so the Jebusites have lived with the sons of Judah in Jerusalem to this day.
translation:
  language: zh_hans
  text: 犹大子孙不能赶走住在耶路撒冷的耶布斯人；于是，耶布斯人就和犹大子孙一同住在耶路撒冷，直到今日。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文用单数形式的族名“耶布斯人”，但在这里统指耶布斯族；“和……一同住”也可译作“住在……中间”。
    reason: 说明集合性族名以及不寻常结构所容许的译法。
lexical_decisions:
- source_word: וְאֶת
  choice: （不单独译出；用分号衔接）
  rationale: 这里的连词兼宾格标记承接前文并转入一个例外情况。中文无须机械译作“但是”；经文内部用分号自然呈现转折与结果关系。
- source_word: הַיְבוּסִי
  choice: 耶布斯人
  rationale: 原文为单数形式的族名，但具有集合意义；汉语“耶布斯人”本身可统指该族群，无须标明单复数。
- source_word: יוֹשְׁבֵי יְרוּשָׁלִַם
  choice: 住在耶路撒冷的
  rationale: 分词结构修饰耶布斯人，说明他们是耶路撒冷的居民；关系短语在现代汉语中自然清楚。
- source_word: לֹא יוכלו
  choice: 不能
  rationale: 忠实表达过去叙事中的无能力；汉语不必额外标明过去时。
- source_word: בְנֵי יְהוּדָה
  choice: 犹大子孙
  rationale: 保留原文家族—支派称谓的字面意象，同时在现代中文圣经语域中自然，并可集合性地指犹大支派成员。
- source_word: לְהוֹרִישָׁם
  choice: 赶走
  rationale: 使役形在征服语境中表示使当地居民失去占有、将其逐出。“赶走”通俗自然，也准确表达此处行动；“夺去他们的产业”在汉语中容易改变宾语焦点。
- source_word: וַיֵּשֶׁב
  choice: 于是……就……住
  rationale: 叙事形式承接前句，描述由过去开始并持续到叙述者当时的居住状态；“直到今日”已清楚表达持续性。
- source_word: אֶת בְּנֵי יְהוּדָה
  choice: 和犹大子孙一同
  rationale: 此处 אֶת 在语境中表达共同居住的关系。译文避免按通常宾格标记生硬直译，同时保留“同住”的含义。
- source_word: בִּירוּשָׁלִַם
  choice: 在耶路撒冷
  rationale: 直接表达地点。
- source_word: עַד הַיּוֹם הַזֶּה
  choice: 直到今日
  rationale: 这是希伯来叙事中常见的时间公式，指该状况持续到叙述者所在的时代。
theological_decisions:
- issue: בְנֵי יְהוּדָה 的群体称谓
  choice: 犹大子孙
  alternative: 犹大人；犹大支派的人
  rationale: 保留原文“子孙”的亲族与支派意象；这里是集合称谓，并非只强调男性，也不需用解释性译法替代正文。
- issue: וַיֵּשֶׁב ... אֶת בְּנֵי יְהוּדָה 的关系
  choice: 耶布斯人就和犹大子孙一同住
  alternative: 耶布斯人住在犹大子孙中间；耶布斯人与犹大子孙并居
  rationale: 原文结构不寻常，但语境支持共同居住而非把“犹大子孙”当作“居住”的直接宾语。“和……一同住”不额外规定双方关系的亲疏或空间分布。
- issue: 犹大不能赶走耶布斯人的表述
  choice: 不能赶走
  alternative: 没有赶走；未能赶走
  rationale: לֹא יוכלו 明确表达能力上的不能，译文不将其弱化成单纯未发生，也不进一步推断这种不能的神学原因。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。“犹大子孙”保留支派亲族表达；“赶走”比“逐出其产业”更适合普通读者。脚注标记置于整节末尾，并在脚注中说明原文的集合单数和“同住/住在中间”的语义幅度。
