lexical_decisions:
- source_word: יִפְתָּח
  choice: 伊弗他
  rationale: 这是犹大城邑名录中的地名，按希伯来语音译；“伊弗他”兼顾原文读音与现代汉语的可读性，不因其形式与士师耶弗他的名字相同而擅自作同名统一。
- source_word: אַשְׁנָה
  choice: 亚实拿
  rationale: 专有地名，依希伯来语音译，并采用自然、易辨识的现代汉语形式。
- source_word: נְצִיב
  choice: 尼悉
  rationale: 专有地名，按希伯来语音译；末辅音 ב 以“悉”前的收束音节配合“尼”来近似表达全名，同时保留其他音译可能于脚注。
- source_word: וְ
  choice: 又有／和
  rationale: 原文连接词连续串联城邑；汉语用“又有”承接上文名录，并以顿号和“和”自然呈现本节的并列关系。
