  text: וְ/עָבַ֣ר עַצְמ֗וֹנָ/ה וְ/יָצָא֙ נַ֣חַל מִצְרַ֔יִם ו/היה תֹּצְא֥וֹת הַ/גְּב֖וּל יָ֑מָּ/ה זֶה יִהְיֶ֥ה לָ/כֶ֖ם גְּב֥וּל נֶֽגֶב־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/004.yaml
  text: Then it passed on to Azmon[a], and went out to the Brook of Egypt; and the boundary ended at the sea. This shall be your southern boundary.
translation:
  language: zh_hans
  text: 边界又经过押们，直到埃及溪[a]，终点在海边。这就是你们南面的边界。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“埃及河谷”。希伯来语“纳哈尔”（naḥal）常指季节性水道或干河谷；传统上也有译作“埃及河”的，但在这里容易使人误以为是尼罗河。
    reason: 词义存在可成立的译法差异，需要说明该词所指水道的性质，并避免地理上的误解。
lexical_decisions:
- source_word: וְעָבַר
  choice: 边界又经过
  rationale: 在划界行程中，עבר表示边界继续延伸、经过下一地点；补出主语“边界”，使现代汉语表达清楚自然。
- source_word: עַצְמוֹנָה
  choice: 押们
  rationale: 这是地名，采用现代中文圣经读者较熟悉的音译。词尾־ָה在此表示趋向该地，不另译为地名的一部分。
- source_word: וְיָצָא
  choice: 直到
  rationale: יצא在边界描述中表示界线伸展并抵达某处；译作“直到”比逐字译作“出去”更符合现代汉语的划界叙述。
- source_word: נַחַל מִצְרַיִם
  choice: 埃及溪
  rationale: נחל通常指溪流、季节性水道或干河谷，并非必然指大河；“埃及溪”简洁自然，也避免使人误以为是尼罗河。
- source_word: וְהָיָה תּוֹצְאוֹת הַגְּבוּל יָמָּה
  choice: 终点在海边
  rationale: תוצאות הגבול指边界的尽头或终点；יָמָּה字面为“向海”，在这里表示边界伸至海边。此译保留“海”而不在正文中明确补作“地中海”。
- source_word: זֶה יִהְיֶה לָכֶם גְּבוּל נֶגֶב
  choice: 这就是你们南面的边界
  rationale: נגב在此作方位用语，指“南面”，而不是专名“南地”；该句总结前述南界。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“边界”在句首明确承接上文的划界行程；全句保持地界记录简洁、连续的叙述风格。脚注标记置于其实际说明的“埃及溪”之后。
