lexical_decisions:
- source_word: קְעִילָה
  choice: 基伊拉
  rationale: 专有地名，采用现代中文圣经地名中常见的音译形式。
- source_word: אַכְזִיב
  choice: 亚革悉
  rationale: 专有地名，采用现代中文圣经地名中常见的音译形式。
- source_word: מָרֵאשָׁה
  choice: 玛利沙
  rationale: 专有地名，采用现代中文圣经地名中常见的音译形式。
- source_word: עָרִים
  choice: 城
  rationale: 该词指城市或城镇；在约书亚记的领地清单中译作“城”，简洁且符合行政地域语境。
- source_word: תֵּשַׁע
  choice: 九座
  rationale: 忠实表达基数词，并使用适合“城”的现代汉语量词。
- source_word: חַצְרֵיהֶן
  choice: 属城的村庄
  rationale: 该词在此指附属于这些城的乡村聚落或无城墙居民点；“属城的村庄”既体现隶属关系，也自然易懂。
- source_word: וְ
  choice: 、；还有
  rationale: 地名之间用顿号自然列举，结尾的连接词按汉语表达译为“还有”。
