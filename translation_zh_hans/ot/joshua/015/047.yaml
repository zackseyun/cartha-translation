base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/047.yaml
  text: Ashdod[a], its daughter towns and its villages; Gaza, its daughter towns and its villages; as far as the Brook of Egypt, and the Great Sea[c][b], which is its boundary.
translation:
  language: zh_hans
  text: 亚实突及其属城[a]和村庄；迦萨及其属城和村庄；直到埃及河谷[b]和大海[c]，这就是边界。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“女儿们”，这里是指隶属于主要城市的附属城镇。
    reason: lexical_alternative
  - marker: b
    text: “河谷”也可译作“溪流”或“干河”；这里指作为南部边界标志的“埃及河谷”。
    reason: lexical_alternative
  - marker: c
    text: 即地中海。
    reason: cross_reference
lexical_decisions:
- source_word: בְּנוֹתֶיהָ
  choice: 属城
  rationale: 字面意思是“女儿们”，在疆域名单中指隶属于中心城市的附属城镇。“属城”自然、简明地传达这一地理关系，隐喻则在脚注中说明。
- source_word: חֲצֵרֶיהָ
  choice: 村庄
  rationale: 此处指城外较小的聚落；“村庄”符合现代汉语，也能与较大的“属城”区别开来。
- source_word: נַחַל מִצְרָיִם
  choice: 埃及河谷
  rationale: נחל可指河流、溪流，也可指季节性有水的干河谷；“河谷”适合这一边界地名，并保留其地貌上的开放性。
- source_word: הַיָּם
  choice: 大海
  rationale: 马所拉文本按辅音和元音读作“海”，但书卷中的地理用语所指为地中海；采用圣经地理语境中自然的“大海”，并以脚注明确所指。
- source_word: הגבול וּגְבוּל
  choice: 这就是边界
  rationale: 文本结尾简略，且书写/分词存在困难；其基本功能是说明海构成边界。“这就是边界”保留简洁断语，不强行补出未经明说的所有格。
- source_word: עַד
  choice: 直到
  rationale: 自然表达疆域延伸的终点。
- source_word: אַשְׁדּוֹד / עַזָּה
  choice: 亚实突／迦萨
  rationale: 采用现代中文圣经中通行且易识别的地名译法。
theological_decisions: []
