  text: וְ/עָלָ֨ה הַ/גְּב֜וּל גֵּ֣י בֶן הִנֹּ֗ם אֶל כֶּ֤תֶף הַ/יְבוּסִי֙ מִ/נֶּ֔גֶב הִ֖יא יְרֽוּשָׁלִָ֑ם וְ/עָלָ֨ה הַ/גְּב֜וּל אֶל רֹ֣אשׁ הָ/הָ֗ר אֲ֠שֶׁר עַל פְּנֵ֤י גֵֽי הִנֹּם֙ יָ֔מָּ/ה אֲשֶׁ֛ר בִּ/קְצֵ֥ה עֵֽמֶק רְפָאִ֖ים צָפֹֽנָ/ה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/008.yaml
  text: Then the border went up by the Valley of Ben-hinnom to the slope of the Jebusite on the south (that is[a], Jerusalem), and the border went up to the top of the mountain that lies west of the Valley of Hinnom[c][b], at the northern end of the Valley of Rephaim.
translation:
  language: zh_hans
  text: 疆界又上到欣嫩子谷，来到耶布斯人的山坡南边[a]（就是耶路撒冷[b]）；疆界再上到山顶。这座山在欣嫩谷西边[c]，位于利乏音谷的北端。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “山坡”原文作“肩”；“肩”在这里是地形用语，指山岭的侧面或坡地。
    reason: lexical_alternative
  - marker: b
    text: 或译：“它就是耶路撒冷。”原文以“耶路撒冷”明确识别这里所说的“耶布斯人／耶布斯”的地理指称。
    reason: alternative_reading
  - marker: c
    text: 原文作“向海”；这是表示“向西”的常用地理说法。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָלָה
  choice: 又……上行／再上到
  rationale: 在划界叙述中，עלה描述疆界按顺序向高处延伸；用“上行”“上到”既保留地势方向，也符合现代汉语表达。
- source_word: הַגְּבוּל
  choice: 疆界
  rationale: 在领土分配语境中指划定地域的界线；“疆界”简明、庄重，并适合地理描述。
- source_word: גֵּי בֶן הִנֹּם
  choice: 欣嫩子谷
  rationale: 该短语字面为“欣嫩之子的谷”，已构成地名；保留其地名结构，不将其神学化或另作解释。
- source_word: כֶּתֶף
  choice: 山坡
  rationale: 本义为“肩”，用于地形时指山岭的侧面或坡地；“山坡”在现代汉语中清楚自然。
- source_word: הַיְבוּסִי
  choice: 耶布斯人的
  rationale: 保留希伯来文对耶布斯人的直接称呼，并与后面的耶路撒冷识别语保持张力，不擅自补入“城”或“山岭”。
- source_word: מִנֶּגֶב
  choice: 南侧
  rationale: 这里说明耶布斯人山坡的南面；“南侧”比字面的“从南边”更符合该处地形关系。
- source_word: הִיא יְרוּשָׁלִָם
  choice: 就是耶路撒冷
  rationale: 保留原文代词加地名所作的明确识别，同时不强行消除代词所指在句法上的轻微含混。
- source_word: רֹאשׁ הָהָר
  choice: 山顶
  rationale: 这是表示山最高处的常用表达；“山顶”准确而自然。
- source_word: אֲשֶׁר עַל פְּנֵי גֵי הִנֹּם יָמָּה
  choice: 这座山在欣嫩谷西边
  rationale: על פני在此表示相对位置，יָמָּה字面为“向海”，在以色列地理用语中通常指西方；译文直接呈现其地理意义。
- source_word: בִּקְצֵה עֵמֶק רְפָאִים צָפֹנָה
  choice: 位于利乏音谷的北端
  rationale: קצה表示边缘或尽头，צפנה指北向位置；此译法清楚呈现两谷与山顶之间的方位关系。
