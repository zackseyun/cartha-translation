  text: And the cities at the extremity of the tribe of the sons of Judah[a], toward the border of Edom in the Negev, were Kabzeel, Eder[b], and Jagur.
translation:
  language: zh_hans
  text: 犹大支派境内最边缘、在南地朝向以东边界的城邑有：甲薛、以得和雅姑珥。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּהְיוּ הֶעָרִים
  choice: 城邑中……的，有
  rationale: 该结构承接前文并引出城邑名单；中文用“……的，有”自然呈现希伯来语的存在与列举功能。
- source_word: מִקְצֵה לְמַטֵּה בְנֵי יְהוּדָה
  choice: 犹大支派的城邑中……最偏远之处的
  rationale: מִקְצֵה 表示疆域的尽头或外缘；结合上下文译为“最偏远之处”，而“犹大支派”自然表达 בְנֵי יְהוּדָה 这一传统支派称谓，避免中文直译“犹大众子”造成仅指男性的误解。
- source_word: אֶל גְּבוּל אֱדוֹם
  choice: 朝向以东边界
  rationale: 保留 אֶל 的方向性，不将这些城邑与边界的关系过度确定为恰好坐落在边界线上。
- source_word: בַּנֶּגְבָּה
  choice: 位于南地
  rationale: 此处 נֶגֶב 在犹大地业的地理名单中指特定的南部区域；采用中文圣经地理称呼“南地”，同时仍保留其区域含义。
- source_word: קַבְצְאֵל וְעֵדֶר וְיָגוּר
  choice: 甲薛、以得和雅姑珥
  rationale: 按现代中文圣经常见的专名形式音译三个城名。
