  text: וְ/נָסַב֩ הַ/גְּב֨וּל מִ/בַּעֲלָ֥ה יָ֨מָּ/ה֙ אֶל הַ֣ר שֵׂעִ֔יר וְ/עָבַ֕ר אֶל כֶּ֧תֶף הַר יְעָרִ֛ים מִ/צָּפ֖וֹנָ/ה הִ֣יא כְסָל֑וֹן וְ/יָרַ֥ד בֵּֽית שֶׁ֖מֶשׁ וְ/עָבַ֥ר תִּמְנָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/010.yaml
  text: Then the border turned from Baalah westward to Mount Seir[a], passed along to the northern slope of Mount Jearim (that is, Chesalon), went down to Beth-shemesh, and passed on to Timnah.
translation:
  language: zh_hans
  text: 边界从巴拉转向西[a]，到西珥山，又沿着耶琳山的北坡延伸（就是基撒仑），下到伯示麦，又经过亭拿。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“向海”，是表示“向西”的惯用说法。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָסַב הַגְּבוּל
  choice: 边界……转
  rationale: 在划界叙述中表示边界线改变方向；“转”简洁自然。
- source_word: מִבַּעֲלָה
  choice: 从巴拉
  rationale: 按地名音译；此处是边界转向的起点。
- source_word: יָמָּה
  choice: 向西
  rationale: 字面为“向海”，在以色列地理语境中是表示西方的惯用语；正文采用现代读者易懂的方向表达，并以脚注保留原文意象。
- source_word: אֶל הַר שֵׂעִיר
  choice: 到西珥山
  rationale: הַר 可指山或山区；在连续列举地标的语境中译作“西珥山”最直接。
- source_word: וְעָבַר
  choice: 经过
  rationale: 划界公式中表示边界延伸至或经过某地，并不必然表示横穿。
- source_word: אֶל כֶּתֶף הַר יְעָרִים מִצָּפוֹנָה
  choice: 经过耶琳山的北坡
  rationale: כֶּתֶף 字面是“肩、侧面”，用于山势时译作“坡”自然；מִצָּפוֹנָה 在此限定其北侧。
- source_word: הִיא כְסָלוֹן
  choice: （就是基撒仑）
  rationale: 保留原文对前述地点的解释性辨认，并用括号呈现插入说明。
- source_word: וְיָרַד בֵּית שֶׁמֶשׁ
  choice: 然后下到伯示麦
  rationale: יָרַד 表示地势上的下降；“下到”既保留地形含义，也符合现代汉语路线叙述。
- source_word: וְעָבַר תִּמְנָה
  choice: 又经过亭拿
  rationale: 延续划界叙述；将 תִּמְנָה 视为地名 Timnah，而非方向形式。
theological_decisions: []
