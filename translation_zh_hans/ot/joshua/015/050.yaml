    reason: 说明同一地点在其他经文中的希伯来文异拼形式，避免读者误以为必是不同地点。
lexical_decisions:
- source_word: עֲנָב
  choice: 亚拿伯
  rationale: 城镇名，按希伯来语音译；采用现代中文圣经读者较易辨认的传统译名。
- source_word: אֶשְׁתְּמֹה
  choice: 以实提莫
  rationale: 城镇名，依据本节马所拉文本 אֶשְׁתְּמֹה 音译，并保留其与另一常见形式“以实提摩亚”的差异。
- source_word: עָנִים
  choice: 亚念
  rationale: 虽在形态上类似复数形式，此处作为地名使用，因此音译而不按普通名词释义。
- source_word: וְ
  choice: 、；和
  rationale: 连接并列地名；现代汉语列举中，前项用顿号，最后一项用“和”，自然地表达希伯来语的并列关系。
