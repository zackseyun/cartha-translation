  text: 'and Shaaraim[a], and Adithaim, and Gederah, and Gederothaim: fourteen cities with their villages.'
translation:
  language: zh_hans
  text: 沙拉音[a]、亚底他音、基低拉、基低罗他音：共十四座城，和它们的村庄。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节列出的四个地名与所说的“十四座城”表面上并不相符。有些学者认为，这可能与这一大段经文的抄传历史有关；此处仍按现存希伯来文本翻译。
    reason: textual_variant
lexical_decisions:
- source_word: שַׁעֲרַיִם
  choice: 沙拉音
  rationale: 地名按希伯来语音译；采用现代中文圣经读者较易辨认的形式，不按其可能含义意译。
- source_word: עֲדִיתַיִם
  choice: 亚底他音
  rationale: 专有地名按希伯来语音译。
- source_word: הַגְּדֵרָה
  choice: 基底拉
  rationale: 作为地名音译；希伯来语中的定冠词已固化于名称形式，不另译作“那”。
- source_word: גְדֵרֹתָיִם
  choice: 基底罗他音
  rationale: 专有地名按希伯来语音译，并与基底拉保持可辨认的词形关联。
- source_word: עָרִים
  choice: 城
  rationale: 在领地城邑清单中，עִיר 指列入行政地域的城邑；中文用“城”自然简洁。
- source_word: אַרְבַּע עֶשְׂרֵה
  choice: 十四座
  rationale: 按现代汉语量词习惯表达基数。
- source_word: חַצְרֵיהֶן
  choice: 隶属这些城的村庄
  rationale: חָצֵר 在这类地域清单中通常指依附于城邑的村落或无城墙聚落；补出“隶属”以自然表达其从属关系。
