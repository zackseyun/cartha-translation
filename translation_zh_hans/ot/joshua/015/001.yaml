  text: וַ/יְהִ֣י הַ/גּוֹרָ֗ל לְ/מַטֵּ֛ה בְּנֵ֥י יְהוּדָ֖ה לְ/מִשְׁפְּחֹתָ֑/ם אֶל גְּב֨וּל אֱד֧וֹם מִדְבַּר צִ֛ן נֶ֖גְבָּ/ה מִ/קְצֵ֥ה תֵימָֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/001.yaml
  text: And the lot for the tribe of the sons of Judah[a], according to their clans, was to the border of Edom, to the wilderness of Zin, southward[c][b], at the farthest south.
translation:
  language: zh_hans
  text: 犹大支派[a]按其宗族抽签所得的地，延伸到以东的边界：在南方的寻旷野，直到最南端。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文为“犹大子孙的支派”，指犹大的后裔所组成的支派。
    reason: cultural_note
  - marker: b
    text: 原文也可较直译为“从南方的尽头”；“南方”一词也可读作地名“提幔”。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי הַגּוֹרָל
  choice: 抽签所得的地
  rationale: 这里的“签”不是单指抽签物，而是指借抽签分得的土地；译出结果在现代汉语中更自然，同时保留抽签分地的机制。
- source_word: לְמַטֵּה בְּנֵי יְהוּדָה
  choice: 犹大支派
  rationale: בְּנֵי יְהוּדָה字面为“犹大的子孙”，在此指犹大后裔组成的支派；“犹大支派”准确而简洁，脚注说明原文亲属称谓。
- source_word: לְמִשְׁפְּחֹתָם
  choice: 按着宗族
  rationale: מִשְׁפָּחָה在支派分地语境中指支派以下的宗族单位，不只是现代意义上的小家庭。
- source_word: אֶל גְּבוּל אֱדוֹם
  choice: 直到以东的边界
  rationale: אֶל在疆界描述中表示所达之处；“直到”清楚表达该领地延伸至以东边界。
- source_word: מִדְבַּר צִן
  choice: 寻旷野
  rationale: מִדְבָּר指旷野或荒漠地带；“寻”采用该地名在中文圣经传统中的通行音译。
- source_word: נֶגְבָּה
  choice: 南到
  rationale: 该形式在此具有向南或位于南面的方向意义；“南到”自然衔接疆界叙述。
- source_word: מִקְצֵה תֵימָן
  choice: 直达最南端
  rationale: 该短语在此最自然地表示南方的极端界限；译文传达地理边界，同时以脚注保留“从南方尽头”或“从提幔尽头”的形式可能性。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的疆界叙述。“抽签所得的地”避免把“签”误解为主语所到之处；“宗族”保留古代以色列支派内部的社会层级。脚注标记均置于相关正文位置。
