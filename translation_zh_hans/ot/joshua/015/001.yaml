revisions:
- from: 犹大支派[a]按着宗族抽签所得的地，直到以东的边界，南到寻旷野，直达最南端。[b]
  to: 犹大支派[a]按其宗族抽签所得的地，延伸到以东的边界：在南方的寻旷野，直到最南端。[b]
  rationale: 修订只改善疆界短语在汉语中的句法关系和行文自然度。“延伸到”对应抽签所得领地所及的边界；“在南方的寻旷野，直到最南端”保留原文反复标示南部极端位置的效果。脚注继续保留תֵימָן可理解为“南方”或“提幔”的文本歧义。
