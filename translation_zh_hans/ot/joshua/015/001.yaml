  naturalness: “按着宗族”可简化为现代汉语更自然的“按其宗族”。原句后半“直到以东的边界，南到寻旷野，直达最南端”层次不清。以标点分出边界与所在地理限定后更符合现代汉语的疆界叙述。
  terminology: “犹大支派”“宗族”“寻旷野”“以东”均恰当。“抽签所得的地”能传达גּוֹרָל在分地语境中的结果，保留抽签机制；脚注说明“犹大子孙”这一原文亲属称谓。
