  text: וְ֠/יָצָא אֶל מִ/נֶּ֜גֶב לְ/מַעֲלֵ֤ה עַקְרַבִּים֙ וְ/עָ֣בַר צִ֔נָ/ה וְ/עָלָ֥ה מִ/נֶּ֖גֶב לְ/קָדֵ֣שׁ בַּרְנֵ֑עַ וְ/עָבַ֤ר חֶצְרוֹן֙ וְ/עָלָ֣ה אַדָּ֔רָ/ה וְ/נָסַ֖ב הַ/קַּרְקָֽעָ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/003.yaml
  text: Then it went out southward to the ascent of Akrabbim[a], crossed over to Zin, went up from the south to Kadesh-barnea, crossed over Hezron, went up to Addar[b], and turned toward Karka.
translation:
  language: zh_hans
  text: 边界向南延伸到亚克拉滨坡[a]，经过寻，又从南面上到加低斯·巴尼亚，经过希斯仑，上到亚达，然后转向甲加。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “亚克拉滨”这个名字可能意为“蝎子”；这里是地名，所以采用音译。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָצָא אֶל מִנֶּגֶב
  choice: 边界向南延伸
  rationale: 主语承接上下文中的边界线；“延伸”自然表达边界的行进，同时“向南”保留方向意义。
- source_word: לְמַעֲלֵה עַקְרַבִּים
  choice: 到亚克拉滨坡
  rationale: מַעֲלֶה指上坡、坡道或山口；此处采用简洁的“坡”。עַקְרַבִּים作为地名音译。
- source_word: וְעָבַר צִנָה
  choice: 经过寻
  rationale: עבר在边界描述中表示边界经过或越过某地；צִן为地名，采用通行中文译名“寻”。
- source_word: וְעָלָה מִנֶּגֶב לְקָדֵשׁ בַּרְנֵעַ
  choice: 又从南面上到加低斯·巴尼亚
  rationale: 按希伯来语表层句法保留“从南面……到……”的运动路线，不改释为仅位于该城南边；“上到”保留עלה的地势运动意象。
- source_word: וְעָבַר חֶצְרוֹן
  choice: 经过希斯仑
  rationale: 边界叙述中的עבר译为“经过”；חֶצְרוֹן按地名音译。
- source_word: וְעָלָה אַדָּרָה
  choice: 上到亚达
  rationale: 保留עלה的上行意象；אַדָּר作为地名音译，词尾־ה在此具有方向性。
- source_word: וְנָסַב הַקַּרְקָעָה
  choice: 然后转向甲加
  rationale: נסב表示边界转弯或改变方向；地名词尾־ה表示趋向，故译“转向”。甲加采用常见中文圣经地名形式。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的边界行程表述。为避免无根据地补足主语，依据上下文明确译作“边界”；各地名尽量采用中文圣经中较通行的形式。原文连续使用表示行进的动词，译文保留“延伸、经过、上到、转向”的地理动态。
