  yaml_path: translation/ot/joshua/015/005.yaml
  text: And the eastern border was the Salt Sea, as far as the mouth of the Jordan. And the border on the north side was from the tongue of the sea, from the mouth of the Jordan.
translation:
  language: zh_hans
  text: 东边的边界是盐海，直到约旦河口。北边的边界从海湾，就是从约旦河口起。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יָם הַמֶּלַח
  choice: 盐海
  rationale: 按希伯来语地名直译，保留古代称谓。
- source_word: קְצֵה הַיַּרְדֵּן
  choice: 约旦河口
  rationale: קצה本义为“尽头、末端”；在此地理语境中指约旦河汇入盐海之处，译作“河口”自然明确。
- source_word: לְשׁוֹן הַיָּם
  choice: 海湾
  rationale: לשון字面为“舌头”，地理用法指舌状伸展的水域或岸形；正文采用现代汉语自然地理表达，并以脚注保留字面意象。
- source_word: לִפְאַת צָפוֹנָה
  choice: 北边
  rationale: 表达边界的北侧或朝北的一面，现代汉语以“北边”简洁自然。
theological_decisions: []
