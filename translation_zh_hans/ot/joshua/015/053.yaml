- source_word: וַ/אֲפֵקָה
  choice: 亚非加
  rationale: וַ以中文列举标点体现。אֲפֵקָה按马所拉读音音译为“亚非加”，保留词末音节，不缩写为可能与其他地名混同的“亚非”。
