  text: וּ/גְב֣וּל יָ֔ם הַ/יָּ֥מָּ/ה הַ/גָּד֖וֹל וּ/גְב֑וּל זֶ֠ה גְּב֧וּל בְּנֵֽי יְהוּדָ֛ה סָבִ֖יב לְ/מִשְׁפְּחֹתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/012.yaml
  text: And the western border was the Great Sea as a border[a]. This was the border of the sons of Judah all around[b], by their clans.
translation:
  language: zh_hans
  text: 西界是大海及其海岸线[a]。这就是犹大子孙四围的边界，按着他们的宗族[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“大海及其边界”。“大海”指地中海；海及其海岸线构成犹大的西界。
    reason: cultural_note
  - marker: b
    text: 或译“按照他们的家族”。这里的“宗族”指犹大支派内部的家族群体；此短语可指按这些宗族的分配。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּגְבוּל יָם
  choice: 西边的边界
  rationale: 在以色列地的边界描述中，“海”常兼具方向意义，指向地中海所在的西方；译为“西边”自然传达其方位功能。
- source_word: הַיָּמָּה הַגָּדוֹל
  choice: 大海
  rationale: 原文直称“大海”，是地中海的传统地理称谓；正文保留原称，脚注说明其所指。
- source_word: וּגְבוּל
  choice: 也就是沿海一线
  rationale: 此处重复“边界”的希伯来语结构简约，可能表示大海本身（或海岸线）构成边界；译文用解释性同位语传达其边界功能。
- source_word: בְּנֵי יְהוּדָה
  choice: 犹大子孙
  rationale: 保留希伯来语字面的后裔称谓，同时在现代汉语中可自然指犹大支派的全体成员。
- source_word: סָבִיב
  choice: 四周
  rationale: 概括上述界线围绕犹大所得之地，现代汉语简洁自然。
- source_word: לְמִשְׁפְּחֹתָם
  choice: 按宗族所得之地
  rationale: מִשְׁפָּחָה 在分地语境中指支派内部的宗族群体；“按宗族”保留分配依据，“所得之地”补足汉语中隐含的领地关系。
theological_decisions:
- issue: בְּנֵי יְהוּדָה 的群体称谓
  choice: 犹大子孙
  alternative: 犹大人／犹大的后裔
  rationale: 原文采用阳性复数的亲属称谓，集体指犹大支派。译作“犹大子孙”既保留原文形象，又不额外引入教派性解释。
- issue: לְמִשְׁפְּחֹתָם 与边界描述的关系
  choice: 按宗族所得之地四周的边界
  alternative: 他们按宗族的四周边界／按照他们的家族
  rationale: 原文语法简约，可理解为这片支派领地按宗族归属；正文使汉语关系清楚，脚注保留较直译的可能表达。
translation_notes:
  register: 采用现代、庄重而易懂的叙述语体。“大海”保留经文的传统地理称谓；“沿海一线”避免重复“边界”造成的生硬，同时以脚注交代原文。所有脚注标记均已置于正文相应位置。
