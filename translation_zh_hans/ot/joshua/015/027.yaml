- source_word: בֵית פָּלֶט
  choice: 伯帕列
  rationale: 复合地名；בֵית 字面义为“家、殿”或“……之家”，但在此作为地名组成部分，采用中文传统音译“伯帕列”，不在正文中释义。
- source_word: וְ / וּ
  choice: 、……和……
  rationale: 希伯来语连接词用于并列三个地名；按现代汉语列举习惯，以顿号分隔，并在末项前用“和”。
