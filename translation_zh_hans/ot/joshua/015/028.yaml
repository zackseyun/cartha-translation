translation:
  language: zh_hans
  text: 哈萨书亚、别是巴[a]和比斯约他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “别是巴”可反映希伯来语“七之井”的意思，也可借文字游戏表达“誓言之井”。
    reason: 保留该地名在希伯来语中的词义关联和双关可能。
lexical_decisions:
- source_word: חֲצַר שׁוּעָל
  choice: 哈萨书亚
  rationale: 这是由“村落、围场”和“狐狸或豺”组成的地名；城邑名录中采用通行音译，不在正文中译作“狐狸村”。
- source_word: בְּאֵר שֶׁבַע
  choice: 别是巴
  rationale: 采用这一著名地名的通行中文音译；其希伯来语形式可使人联想到“七之井”，并借文字游戏联想到“誓言之井”，相关含义保留在脚注中。
- source_word: בִּזְיוֹתְיָה
  choice: 比斯约他
  rationale: 该地名的词源不确定，因此采用贴近希伯来语形式并符合中文圣经地名习惯的音译。
- source_word: וַ / וּ
  choice: 顿号及“和”
  rationale: 前缀连词连接城邑名；现代汉语名录以顿号分隔，并在最后一项前用“和”，无需机械重复每一个连词。
theological_decisions: []
