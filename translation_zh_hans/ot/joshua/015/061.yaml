  text: 在旷野：伯亚拉巴、密丁和西迦迦。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בַּמִּדְבָּר
  choice: 在旷野
  rationale: 介词בְּ加定冠词构成地点短语，标明随后城邑所在的地理分区。此处指犹大旷野；“旷野”既符合当地荒凉、人口稀少的地貌，也比“沙漠”更准确。
- source_word: בֵּית הָעֲרָבָה
  choice: 伯亚拉巴
  rationale: 这是地名，按现代中文圣经地名惯例音译；其构词字面义为“亚拉巴之家”，但正文不将专名意译。
- source_word: מִדִּין
  choice: 密丁
  rationale: 专有地名，依希伯来语辅音和元音音译。
- source_word: וּסְכָכָה
  choice: 和西迦迦
  rationale: 前缀וּ译作“和”；סְכָכָה为地名，按希伯来语形式音译为“西迦迦”。
