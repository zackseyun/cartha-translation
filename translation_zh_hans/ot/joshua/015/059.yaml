  text: 'and Maarath[a], and Beth-anoth, and Eltekon: six cities with their villages.'
translation:
  language: zh_hans
  text: 玛腊、伯亚诺、伊勒提君：共六座城，还有它们的村庄。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “村庄”也可译作“乡村聚落”或“村落”；希伯来语所指的是附属于上述各城的外围聚落。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/מַעֲרָת
  choice: 还有玛腊
  rationale: מַעֲרָת是地名，按现代中文圣经地名惯例音译；前缀ו在连续列举中自然译为“还有”。
- source_word: וּ/בֵית עֲנוֹת
  choice: 伯亚诺
  rationale: בֵית עֲנוֹת是复合地名，整体音译，不按普通名词直译为“亚诺之家”。
- source_word: וְ/אֶלְתְּקֹן
  choice: 伊勒提君
  rationale: אֶלְתְּקֹן是地名，采用便于普通话读者辨读的音译。
- source_word: עָרִים שֵׁשׁ
  choice: 共六座城
  rationale: עָרִים在这类领地城邑清单中指有组织的聚居城邑；“共六座城”自然表达原文的总数说明。
- source_word: וְ/חַצְרֵי/הֶן
  choice: 以及属这些城的村庄
  rationale: חֲצֵרִים在领地清单中指附属于城邑的乡村聚落，而非字面的“院子”；明确译出所属关系，以传达后缀“她们的”在此所指的各城。
