base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/014.yaml
  text: 'And Caleb drove out from there the three sons of Anak: Sheshai[a], Ahiman, and Talmai[b], the children of Anak.'
translation:
  language: zh_hans
  text: 迦勒从那里赶走了[a]亚衲的三个儿子，就是示筛、亚希幔和挞买；他们都是亚衲所生的[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“使……失去产业”。这个希伯来语动词可强调赶走原有居民，从而取得其土地。
    reason: lexical_alternative
  - marker: b
    text: 原文先称“亚衲的三个儿子”，后又称他们为“亚衲所生的”，用两个相关的血统表达指同一组人。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּרֶשׁ
  choice: 赶走了
  rationale: 该动词在使役形中可表示使原有居民失去其地业，即“逐出、赶走”。本节以三个人为宾语，“赶走”符合现代汉语叙事习惯，也保留征服土地的语境。
- source_word: מִשָּׁם
  choice: 从那里
  rationale: 直接表达原文的方位起点，简洁自然。
- source_word: שְׁלוֹשָׁה בְּנֵי הָעֲנָק
  choice: 亚衲的三个儿子
  rationale: 按原文保留“儿子”的亲属表达；本节随后列出三人的名字，不必概括译为“亚衲族人”。
- source_word: שֵׁשַׁי
  choice: 示筛
  rationale: 采用现代中文圣经中通行的人名音译。
- source_word: אֲחִימַן
  choice: 亚希幔
  rationale: 采用现代中文圣经中通行的人名音译。
- source_word: תַּלְמַי
  choice: 挞买
  rationale: 采用现代中文圣经中通行的人名音译。
- source_word: יְלִידֵי הָעֲנָק
  choice: 他们都是亚衲所生的
  rationale: 较直接地表达“亚衲所生的人”，并保留原文先称“亚衲的儿子”、后又以相关出生用语说明其血统的重复。
theological_decisions: []
