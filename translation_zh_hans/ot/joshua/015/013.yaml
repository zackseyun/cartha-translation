id: JOS.15.13
reference: Joshua 15:13
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וּ/לְ/כָלֵ֣ב בֶּן יְפֻנֶּ֗ה נָ֤תַן חֵ֨לֶק֙ בְּ/ת֣וֹךְ בְּנֵֽי יְהוּדָ֔ה אֶל פִּ֥י יְהוָ֖ה לִֽ/יהוֹשֻׁ֑עַ אֶת קִרְיַ֥ת אַרְבַּ֛ע אֲבִ֥י הָ/עֲנָ֖ק הִ֥יא חֶבְרֽוֹן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/013.yaml
  text: 'And to Caleb son of Jephunneh he gave a portion among the sons of Judah[a], according to the command of Yahweh to Joshua: Kiriath-arba (Arba was the father of Anak), that is[b], Hebron.'
translation:
  language: zh_hans
  text: 至于耶孚尼的儿子迦勒，照着雅威对约书亚的吩咐[a]，在犹大子孙中分给他一份产业，就是基列·亚巴（亚巴是亚衲的父亲[b]），也就是希伯仑。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“照着雅威对约书亚所说的话”。希伯来文直译为“照雅威的口”。
    reason: lexical_alternative
  - marker: b
    text: “父亲”在这里也可指“祖先”或“始祖”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/כָלֵב בֶּן יְפֻנֶּה
  choice: 至于耶孚尼的儿子迦勒
  rationale: 用“至于”自然承接上文并引出受益者；亲子结构按希伯来文直译，人名采用通行音译。
- source_word: נָתַן חֵלֶק
  choice: 分给他一份产业
  rationale: חֵלֶק在分地语境中指所得的份额或产业；“分给”既符合土地分配语境，也避免把动作仅理解为一般赠送。中文省略施事者，以保留希伯来文未明说主语的特点。
- source_word: בְּתוֹךְ בְּנֵי יְהוּדָה
  choice: 在犹大子孙中
  rationale: 保留“在……中”和“犹大子孙”的部族表达，同时符合现代汉语。
- source_word: אֶל פִּי יְהוָה
  choice: 照着雅威……的吩咐
  rationale: 该习语字面为“照雅威的口”，在此表示依照命令；“吩咐”自然传达其语境意义，脚注保留“话”的可能译法。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常用音译呈现神名，而不以称号“主”替代。
- source_word: לִיהוֹשֻׁעַ
  choice: 对约书亚
  rationale: 介词表示吩咐所针对或传达的对象；“对约书亚”最符合现代汉语搭配。
- source_word: קִרְיַת אַרְבַּע
  choice: 基列·亚巴
  rationale: 视为地名并作音译；中点清楚标示复合专名。
- source_word: אֲבִי הָעֲנָק
  choice: 亚巴是亚衲的父亲
  rationale: 重组同位语以明确“父亲”指亚巴，而不是“基列·亚巴”这座城；正文保留אָב的直观义，其他可能含义列入脚注。
- source_word: הִיא חֶבְרוֹן
  choice: 也就是希伯仑
  rationale: 自然表达旧地名与希伯仑的同一关系。
theological_decisions:
- issue: “分给”这一动作的隐含主语
  choice: 中文采用省略主语的“分给他”，不明说施事者
  alternative: 明确译作“约书亚分给他”或“雅威分给他”
  rationale: 希伯来文本句没有明说动词主语；明确指定约书亚或雅威都会消除原文保留的歧义。中文零主语结构可自然保留这种开放性。
- issue: אָב在“亚衲的父亲”中的含义
  choice: 正文译作“父亲”
  alternative: 译作“祖先”或“始祖”
  rationale: “父亲”最贴近基本词义，也保留其可能是家族或族群始祖的张力；扩展含义在脚注说明。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。句首“至于”承接叙事，“分给他”省略施事者以保存原文歧义；括号说明消除“父亲”修饰整座城名的误读。所有脚注标记均置于对应正文词语之后。
