lexical_decisions:
- source_word: זָנוֹחַ
  choice: 撒挪亚
  rationale: 这是城镇名单中的地名，采用贴近希伯来语的传统中文音译，不按普通名词翻译。
- source_word: עֵין גַּנִּים
  choice: 隐干宁
  rationale: 这是由“泉”（עֵין）和“园子”（גַּנִּים）构成的复合地名；正文采用传统中文音译，词义在脚注中说明。
- source_word: תַּפּוּחַ
  choice: 他普亚
  rationale: 此处在城镇名单中作地名，因此音译；其希伯来语普通词义可能指“苹果”或某种果树，保留在脚注中。
- source_word: הָעֵינָם
  choice: 以楠
  rationale: 这是带定冠词的希伯来地名形式；正文采用简洁的传统中文音译，不把定冠词另行译出，并在脚注中交代原文形式。
