- source_word: כַבּוֹן
  choice: 迦本
  rationale: 城镇名，按希伯来语读音音译；采用适合现代普通话的简洁译名。
- source_word: לַחְמָס
  choice: 拉幔
  rationale: 城镇名，依希伯来语音译。希伯来字母ח的喉音在普通话中没有直接对应音，故采用通行且易读的形式“拉幔”。
- source_word: כִתְלִישׁ
  choice: 基提利
  rationale: 城镇名，依希伯来语音译，以“基”表示词首כ的/k/音，并保留主要音节。
- source_word: וְ
  choice: 、／和
  rationale: 前缀连词连接并列地名；现代汉语列举时，前项用顿号，末项用“和”，自然呈现希伯来语的并列关系。
