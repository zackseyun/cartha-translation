base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/018.yaml
  text: And when she came[a], she urged him to ask her father for a field. Then she got down from the donkey, and Caleb said to her[c][b], “What do you want?”
translation:
  language: zh_hans
  text: 她来到的时候，就催促丈夫向她父亲求一块田。随后，她从驴上下来[a]。迦勒问她：“你有什么事？”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “下来”所译的希伯来语动词也可能暗示她突然或迅速地从驴上下来。
    reason: lexical_alternative
  - marker: b
    text: 希伯来语直译为“你有什么？”；按语境也可译作“你想要什么？”或“你怎么了？”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּבוֹאָהּ
  choice: 她来到的时候
  rationale: 介词ב与不定式及第三人称阴性单数词尾构成时间从句；译文保留“她来到时”的含义，不增添原文未说明的目的地。
- source_word: וַתְּסִיתֵהוּ
  choice: 就催促丈夫
  rationale: סות在此可指怂恿、劝动或催促。语境是押撒推动俄陀聂提出请求，“催促”既体现她的主动推动，也不强加明显的负面色彩。代词“他”依上下文明确为丈夫，明译可避免现代汉语中的指代含混。
- source_word: לִשְׁאוֹל מֵאֵת אָבִיהָ שָׂדֶה
  choice: 向她父亲求一块田
  rationale: שאל在此意为请求；מֵאֵת标明请求所向的人，שָׂדֶה指田地或一块土地。此译符合现代汉语表达，并保持请求内容的具体性。
- source_word: וַתִּצְנַח מֵעַל הַחֲמוֹר
  choice: 她从驴上下来
  rationale: צנח在本叙事中表示从所骑的驴上下来，也可能带有突然或迅速下移的意味。正文采用自然中性的说法，脚注保留动作力度上的可能含义。
- source_word: מַה לָּךְ
  choice: 你有什么事？
  rationale: 希伯来语字面近于“你怎么了／你有什么”，可询问对方的需要、愿望或困扰。结合迦勒看见她下驴后发问的场景，“你有什么事？”自然，同时比“你想要什么？”更能保留习语的开放性。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事体。“丈夫”依据上文人物关系明示代词所指；不在正文中强化סות的负面含义，也不把מַה לָּךְ过度限定为单一意图。
