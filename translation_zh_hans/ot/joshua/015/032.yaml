  text: and Lebaoth[a], Shilhim, Ain, and Rimmon—twenty-nine cities in all, with their villages.
translation:
  language: zh_hans
  text: 还有利巴勿、实忻、亚因和临门，共二十九座城，以及各城所属的村庄〔a〕。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּלְבָאוֹת
  choice: 还有利巴勿
  rationale: 这是城镇名单中的专名，按现代中文圣经人名地名音译惯例处理；句首连接词结合上文名单译为“还有”，使中文自然并保留列举关系。
- source_word: וְשִׁלְחִים
  choice: 示利欣
  rationale: 作为地名音译，不按普通词义翻译。
- source_word: וְעַיִן
  choice: 亚因
  rationale: 此处位于城镇名单中，应视为地名而非“眼”或“泉”的普通名词义，故音译。
- source_word: וְרִמּוֹן
  choice: 临门
  rationale: 此处为地名，采用现代中文圣经中通行且易辨认的音译，不译作其普通名词义“石榴”。
- source_word: כָּל עָרִים עֶשְׂרִים וָתֵשַׁע
  choice: 共二十九座城
  rationale: 按希伯来文的汇总功能译成自然中文；“共”表达总数，“座”为城的量词。
- source_word: וְחַצְרֵיהֶן
  choice: 以及属城的村庄
  rationale: חָצֵר在领地清单中指附属于这些城的村落或聚居点；“属城的村庄”既自然，也交代其从属关系。
