base_translation:
  language: en
  yaml_path: translation/ot/joshua/023/011.yaml
  text: Therefore, take great care to love Yahweh your God.
translation:
  language: zh_hans
  text: 所以，你们务要格外谨慎，为要爱耶和华你们的神。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְנִשְׁמַרְתֶּם
  choice: 所以，你们要……谨慎
  rationale: 该动词在此要求听众警醒自守；结合上文的劝勉，וְ自然承接为“所以”。现代汉语用“要谨慎”比逐字译作“要保守自己”更清楚自然。
- source_word: מְאֹד
  choice: 格外
  rationale: 该副词加强谨慎的程度；“格外谨慎”自然传达“非常、极其谨慎”的语气。
- source_word: לְנַפְשֹׁתֵיכֶם
  choice: 由“谨慎”所含的自守意味表达
  rationale: 这里的נֶפֶשׁ指人的整个自身，并非专指非物质的“灵魂”。汉语“谨慎”在此语境中已能表达为自己警醒自守的意思，若直译“为你们的性命”容易引起误解。
- source_word: לְאַהֲבָה
  choice: 一心爱
  rationale: לְ加不定式表示自守所指向的目的或结果，即持续忠诚地爱神。“一心”在汉语中使这种专一忠诚的意味更自然，但不把“爱”缩减为单纯情感。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代简体中文读者熟悉的专名形式呈现四字神名，而不以“主”这一称号代替。
- source_word: אֱלֹהֵיכֶם
  choice: 你们的神
  rationale: 准确表达复数第二人称所属后缀及以色列与神的关系。
theological_decisions:
- issue: 盟约劝勉中לְנַפְשֹׁתֵיכֶם的含义
  choice: 按指向整个自身的反身意义处理，并融入“谨慎”的表达
  alternative: 你们的灵魂／你们的性命／你们自己
  rationale: 本句要求以色列人警醒自守，以便忠诚地爱神；נֶפֶשׁ在这一习语中指完整的人，不宜据此引入灵魂与身体二分的神学判断。
- issue: לְאַהֲבָה所表达的逻辑关系
  choice: 保留为自守所指向的目的或结果：“一心爱”
  alternative: 仅并列理解为“并且爱”
  rationale: 介词לְ与不定式更自然地说明谨慎自守的目标，但目的与结果之间不必作过细限定。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“格外谨慎”保留原文的强烈劝诫；“一心爱”使句子自然，并表达盟约语境中的专一忠诚。全节不设脚注。
