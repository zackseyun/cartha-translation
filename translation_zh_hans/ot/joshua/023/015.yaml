    rationale: 原文先以“事情将会如此／将来必是这样”引出“正如……照样……”的对应警告。增译“将来必是这样”可保留这一结构，而不造成生硬直译。
  - severity: low
    issue: “直到把你们……除灭”的施事者不够明确
    rationale: 原文的毁灭行为承接耶和华；改为“直到他把你们……除灭”使中文句法完整，并不增加原文以外的信息。
  - severity: low
    issue: 脚注的“降灾的话”表述易生歧义
    rationale: 该说法可能表示“使人受灾的话”，而原文דבר在此可指“话／事”，并与前文的“美好的话”形成平行。改用“不好的话”更直接地保留该词汇可能性。
  revised_text: 将来必是这样：正如耶和华你们的神对你们所说的一切美好的话都临到你们，耶和华也必照样使一切灾祸[a]临到你们，直到他把你们从耶和华你们的神赐给你们的这片美地上除灭。
