reference: Joshua 23:15
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/הָיָ֗ה כַּ/אֲשֶׁר בָּ֤א עֲלֵי/כֶם֙ כָּל הַ/דָּבָ֣ר הַ/טּ֔וֹב אֲשֶׁ֥ר דִּבֶּ֛ר יְהוָ֥ה אֱלֹהֵי/כֶ֖ם אֲלֵי/כֶ֑ם כֵּן֩ יָבִ֨יא יְהוָ֜ה עֲלֵי/כֶ֗ם אֵ֚ת כָּל הַ/דָּבָ֣ר הָ/רָ֔ע עַד הַשְׁמִיד֣/וֹ אוֹתְ/כֶ֗ם מֵ֠/עַל הָ/אֲדָמָ֤ה הַ/טּוֹבָה֙ הַ/זֹּ֔את אֲשֶׁר֙ נָתַ֣ן לָ/כֶ֔ם יְהוָ֖ה אֱלֹהֵי/כֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/023/015.yaml
  text: And it shall happen that[a], just as every good word that Yahweh your God spoke to you has come upon you, so Yahweh will bring upon you every evil word, until he has destroyed you from off this good land that Yahweh your God has given to you.
translation:
  language: zh_hans
  text: 将来必是这样：正如耶和华你们的神对你们所说的一切美好的话都临到你们，耶和华也必照样使一切灾祸[a]临到你们，直到他把你们从耶和华你们的神赐给你们的这片美地上除灭。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“一切不好的事”或“一切不好的话”。希伯来文直译为“一切不好的话／事”，与本节前面的“一切美好的话”相呼应。
    reason: 说明דָּבָר与רָע的词义范围，并保留原文前后刻意的词汇平行。
lexical_decisions:
- source_word: וְהָיָה כַּאֲשֶׁר ... כֵּן
  choice: 正如……也必照样……
  rationale: 以现代汉语自然呈现希伯来文的对应比较结构；上下文中的将来语气由“必”表达，无须机械译出引介语。
- source_word: בָּא עֲלֵיכֶם
  choice: 临到你们
  rationale: 保留介词עַל所表达的“临到、落在……身上”之意，并与后半节形成对应。
- source_word: כָּל הַדָּבָר הַטּוֹב אֲשֶׁר דִּבֶּר
  choice: 对你们所说的一切美好的话
  rationale: 保留דָּבָר的“话”义以及它与“说”的联系，也避免直接增译为“应许”。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代简体中文读者最熟悉的圣名音译，直接呈现四字神名，不以称号替代。
- source_word: יָבִיא ... עֲלֵיכֶם
  choice: 使……临到你们
  rationale: 体现使役形的致使含义，同时与前文“临到你们”保持有意的平行。
- source_word: כָּל הַדָּבָר הָרָע
  choice: 一切灾祸[a]
  rationale: 此处רָע指审判所带来的不利或灾难性后果；“灾祸”在汉语中自然清楚，脚注则保留דָּבָר可译为“话/事”的词义及其与前文的平行。
- source_word: עַד הַשְׁמִידוֹ אֹתְכֶם
  choice: 直到把你们……除灭
  rationale: 准确表达עַד所引出的终点，并以“除灭”呈现שׁמד的强烈毁灭含义。
- source_word: מֵעַל הָאֲדָמָה הַטּוֹבָה הַזֹּאת
  choice: 从……这片美地上
  rationale: “从……地上”保留מֵעַל的空间关系；“这片美地”自然而庄重。
theological_decisions:
- issue: 神圣名字יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。正文采用中文圣经传统中辨识度最高的音译“耶和华”，而不以“主”替代，从而保留专名性质。
- issue: 神使רָע临到百姓的含义
  choice: 一切灾祸
  alternative: 一切不好的话／事
  rationale: 语境所指是神所宣告并施行的盟约审判，不是说神具有道德上的邪恶；“灾祸”表达后果性质，但不削弱神主动施行审判的张力。
- issue: דָּבָר在前后两处的词汇平行
  choice: 正文前处译“话”，后处译“灾祸”，并用脚注说明
  alternative: 两处均直译为“话”
  rationale: 汉语“一切不好的话”容易被理解为恶言或不中听的话，无法自然表达审判；正文优先保证语义清楚，脚注交代原文刻意的词汇对称。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。句式保留原文“正如……也照样……”的警告性平行结构；避免使用容易误解为恶言的“坏话”，也不把“临到”完全解释成“应验”，以保留原文具体而有力的表达。
