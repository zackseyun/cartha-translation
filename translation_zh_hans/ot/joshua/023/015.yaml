revisions:
- from: 正如耶和华你们的神对你们所说的一切美好的话都临到你们，耶和华也必照样使一切灾祸[a]临到你们，直到把你们从耶和华你们的神赐给你们的这片美地上除灭。
  to: 将来必是这样：正如耶和华你们的神对你们所说的一切美好的话都临到你们，耶和华也必照样使一切灾祸[a]临到你们，直到他把你们从耶和华你们的神赐给你们的这片美地上除灭。
  rationale: 修订补出וְהָיָה的将来引介语，明确“除灭”的施事者，并优化脚注措辞以准确说明“灾祸”与原文“话／事”及前文词汇平行之间的关系。其余译法忠实、自然，无须改动。
