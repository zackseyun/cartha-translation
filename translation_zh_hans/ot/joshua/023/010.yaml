id: JOS.23.10
reference: Joshua 23:10
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: אִישׁ אֶחָ֥ד מִ/כֶּ֖ם יִרְדָּף אָ֑לֶף כִּ֣י יְהוָ֣ה אֱלֹהֵי/כֶ֗ם ה֚וּא הַ/נִּלְחָ֣ם לָ/כֶ֔ם כַּ/אֲשֶׁ֖ר דִּבֶּ֥ר לָ/כֶֽם־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/023/010.yaml
  text: One man from among you will chase a thousand[a], because Yahweh your God is the one who fights for you[c][b], just as he spoke to you.
translation:
  language: zh_hans
  text: 你们中间一人必追赶千人[a]，因为雅威[b]——你们的神——正是那位为你们争战的，正如他向你们所说的[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“追击千人。”
    reason: רדף可指追赶或军事上的追击；正文采用较通用的“追赶”。
  - marker: b
    text: “雅威”是希伯来文神名YHWH的音译。
    reason: 向读者说明正文专名所对应的原文四字神名。
  - marker: c
    text: 或译：“正如他向你们所应许的。”原文直译为“正如他向你们所说的”。
    reason: 交代上下文中的应许含义，同时保留希伯来文较字面的说法。
lexical_decisions:
- source_word: אִישׁ אֶחָד
  choice: 一人
  rationale: 直译为“一人”，既保留单数个体与代表性的表达，也符合现代汉语的凝练用法；希伯来语形式为阳性单数，但汉语“人”本身不标示语法性别。
- source_word: מִכֶּם
  choice: 你们中间
  rationale: 表达介词的部分整体关系，说明这一人出自“你们”之中，比生硬的“从你们”更自然。
- source_word: יִרְדָּף
  choice: 必追赶
  rationale: רדף在军事语境中意为追赶、追击或追逐；“追赶”直接而有画面感，“必”也传达此处未完成式在宣告中的确定将来意义。
- source_word: אָלֶף
  choice: 千人
  rationale: 保留原文明确的数目，并依汉语语境补出量词所隐含的对象“人”。
- source_word: כִּי
  choice: 因为
  rationale: 清楚表达后半句是前述胜利的原因。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以汉语音译呈现四字神名YHWH，不以称号“主”替代其专名。
- source_word: אֱלֹהֵיכֶם
  choice: 你们的神
  rationale: 直接保留第二人称复数所属关系。
- source_word: הוּא
  choice: 正是……的那一位
  rationale: 原文独立代词带有强调作用；这一句式在汉语中自然地突出行动者就是雅威。
- source_word: הַנִּלְחָם לָכֶם
  choice: 为你们争战
  rationale: 带冠词的分词描写雅威持续而具有特征性的行动；“为你们争战”保留军事含义以及为以色列一方作战的受益关系。
- source_word: כַּאֲשֶׁר
  choice: 正如
  rationale: 明确表达现实行动与先前神所说之话相符合。
- source_word: דִּבֶּר לָכֶם
  choice: 他向你们所说的
  rationale: 贴近动词“说、讲话”的字面意义，不把上下文所含的应许意味直接写入正文。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名YHWH。正文用“雅威”保留其作为专名的性质；脚注说明其原文形式，避免读者误以为这是普通称号。
- issue: אִישׁ אֶחָד的性别与代表性
  choice: 一人
  alternative: 一个男子；一个人
  rationale: 希伯来语为阳性单数，但“一人”在现代汉语中可自然表达群体中的一个个体，并保留其代表性功能；若译成“一个男子”，会在汉语中产生原文未必着意强调生理性别的额外突显。
- issue: דִּבֶּר לָכֶם是否明译为应许
  choice: 向你们所说的
  alternative: 向你们所应许的
  rationale: 上下文确有应许和成就的意味，但原文动词字面为“说”。正文保留较宽的措辞，脚注交代可按语境理解为“应许”，不消除原文的语义张力。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“一人必追赶千人”保留原文简洁有力的宣告节奏；“正是……的那一位”传达הוּא的强调；全句避免古奥虚词，也不将“说”在正文中神学化为“应许”。
