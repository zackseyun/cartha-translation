  text: לְ/בִלְתִּי בוֹא֙ בַּ/גּוֹיִ֣ם הָ/אֵ֔לֶּה הַ/נִּשְׁאָרִ֥ים הָ/אֵ֖לֶּה אִתְּ/כֶ֑ם וּ/בְ/שֵׁ֨ם אֱלֹהֵי/הֶ֤ם לֹא תַזְכִּ֨ירוּ֙ וְ/לֹ֣א תַשְׁבִּ֔יעוּ וְ/לֹ֣א תַעַבְד֔וּ/ם וְ/לֹ֥א תִֽשְׁתַּחֲו֖וּ לָ/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/023/007.yaml
  text: so that you do not come among these nations[a], these that remain with you[b], and do not mention the name of their gods or make anyone swear by them or serve them or bow down to them.
translation:
  language: zh_hans
  text: 以免你们与这些仍留在你们中间的各族交往[a]，不可提起他们诸神的名[b]，不可叫人指着那些神起誓[c]，不可事奉它们，也不可向它们下拜。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“以免你们进入这些仍留在你们中间的各族当中。”这里的希伯来语可指进入他们当中，也可按上下文指与他们交往。
    reason: lexical_alternative
  - marker: b
    text: “提起”或译“呼求”。这个希伯来语动词可指提到，也可在这里指呼求诸神的名。
    reason: lexical_alternative
  - marker: c
    text: 原文是使役形式，直译为“使人起誓”；也可能理解为禁止人指着那些神起誓。
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: לְבִלְתִּי בוֹא בַּגּוֹיִם הָאֵלֶּה
  choice: 不要与这些……各族来往
  rationale: לְבִלְתִּי加不定式表达否定的目的或禁戒；בוא加ב在这里不只是地理上的进入，也涉及进入这些族群当中并与之交往。“不要与……来往”以自然现代汉语表达语境中的关联，同时用脚注保留较直译的可能。
- source_word: הַנִּשְׁאָרִים הָאֵלֶּה אִתְּכֶם
  choice: 这些仍留在你们中间的
  rationale: שׁאר的分词指剩下、仍存留的人；אִתְּכֶם直义为“与你们同在”。译文自然表达这些族群继续存在于以色列人中间的情形。
- source_word: וּבְשֵׁם אֱלֹהֵיהֶם לֹא תַזְכִּירוּ
  choice: 不可提说他们神明的名
  rationale: זכר的使役形可指提到、使人记起，也可在宗教语境中指呼求。“提说”保留基本词义，不把语境中的礼仪含义定死；另一可能列入脚注。
- source_word: וְלֹא תַשְׁבִּיעוּ
  choice: 不可叫人指着那些神明起誓
  rationale: שׁבע的使役形是“使人起誓”，不是简单的“起誓”。希伯来文省略受使役者，汉语补出泛指的“人”，并由上下文补明起誓所指的对象。
- source_word: וְלֹא תַעַבְדוּם
  choice: 不可侍奉它们
  rationale: עבד可指服侍或宗教性的侍奉。“侍奉”保留其具体含义，并与下一项俯伏动作相区别。
- source_word: וְלֹא תִשְׁתַּחֲווּ לָהֶם
  choice: 不可向它们下拜
  rationale: שׁחה在此词形中指俯伏、下拜。“下拜”清楚自然，并保留动作性，没有笼统译成“敬拜”。
theological_decisions:
- issue: 对外族神明的不同效忠行为
  choice: 分别译出“提说、叫人起誓、侍奉、下拜”四项禁令
  alternative: 将各项合并概括为“不可敬拜他们的神”
  rationale: 原文刻意并列几个不同动词。逐项保留可呈现经文具体而递进的反偶像崇拜要求，避免用概括性的神学术语抹平差别。
- issue: “提说神明的名”的语用范围
  choice: 正文译为“提说”，脚注保留“呼求”
  alternative: 正文直接译为“呼求”
  rationale: 该使役形在本语境中可能具有礼仪性的呼求含义，但字面也可指提及。正文保留较宽的词义，脚注说明语境中的另一可能，不替原文消除歧义。
translation_notes:
  register: 采用现代、庄重而易懂的命令句。“各族”比“列国”更符合此处仍留在境内的族群语境；“神明”明确指外族所敬奉的诸神。“侍奉”与“下拜”分别保留宗教效忠和身体动作的区别。
