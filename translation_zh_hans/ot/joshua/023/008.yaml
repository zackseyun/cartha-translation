  text: כִּ֛י אִם בַּ/יהוָ֥ה אֱלֹהֵי/כֶ֖ם תִּדְבָּ֑קוּ כַּ/אֲשֶׁ֣ר עֲשִׂיתֶ֔ם עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/023/008.yaml
  text: But you shall cling to Yahweh your God[a], just as you have done to this day.
translation:
  language: zh_hans
  text: 却要紧紧依附耶和华你们的上帝[a]，正如你们直到今日所做的那样。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “紧紧依附”也可译作“紧紧持守”；原文动词表达牢牢相连、不离不弃的忠诚关系。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: 却要
  rationale: 这组词在此承接上文的禁令，表达强烈转折，而非条件意义；“却要”也自然带出劝勉语气。
- source_word: בַּיהוָה
  choice: 依附耶和华
  rationale: 介词 בְּ 与 דבק 连用时标明依附的对象；现代汉语无需另译介词，以“依附耶和华”自然表达。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的形式音译四字神名，保留其作为以色列之上帝的专名性质，而不以头衔代替。
- source_word: אֱלֹהֵיכֶם
  choice: 你们的上帝
  rationale: 此处 אֱלֹהִים 指耶和华，意义为单数；复数第二人称后缀明确表达“你们的”。
- source_word: תִּדְבָּקוּ
  choice: 要紧紧依附
  rationale: דבק 表示牢牢贴近、持守不离；在此具有关系性和圣约忠诚的意味。“紧紧依附”保留其形象与力度，又不把含义缩减为抽象的服从。
- source_word: כַּאֲשֶׁר
  choice: 正如
  rationale: 引出当前劝勉与以色列人此前行为之间的比较。
- source_word: עֲשִׂיתֶם
  choice: 你们……所做的
  rationale: 完成式回顾他们截至说话当时一直采取的行动；与“直到今日”合用可自然表达持续至今的行为。
- source_word: עַד הַיּוֹם הַזֶּה
  choice: 直到今日
  rationale: 准确保留希伯来语惯用的时间表达，说明这种行为延续到约书亚说话之时。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 正文保留神名而不以“主”这一头衔替代；“耶和华”是现代简体中文圣经语境中广为人知且可辨识的神名形式。
- issue: דבק 的圣约含义
  choice: 紧紧依附
  alternative: 紧紧持守／专一跟随
  rationale: 原词兼有贴近不离与坚定忠诚的关系性意味；正文采用较具形象的“紧紧依附”，脚注提示“持守”的译法，不把经文本身明确限定为某一抽象神学术语。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“却要”与上文形成鲜明对照；“正如你们直到今日所做的”保留原文的比较结构和时间延续感。
