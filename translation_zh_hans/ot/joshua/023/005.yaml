reference: Joshua 23:5
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יהוָ֣ה אֱלֹֽהֵי/כֶ֗ם ה֚וּא יֶהְדֳּפֵ֣/ם מִ/פְּנֵי/כֶ֔ם וְ/הוֹרִ֥ישׁ אֹתָ֖/ם מִ/לִּ/פְנֵי/כֶ֑ם וִֽ/ירִשְׁתֶּם֙ אֶת אַרְצָ֔/ם כַּ/אֲשֶׁ֥ר דִּבֶּ֛ר יְהוָ֥ה אֱלֹהֵי/כֶ֖ם לָ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/023/005.yaml
  text: And Yahweh your God[a], he himself will drive them out from before you and dispossess them from before you, and you will take possession of their land[b], just as Yahweh your God spoke to you.
translation:
  language: zh_hans
  text: 雅威——你们的上帝——必亲自把他们从你们面前赶走，把他们从你们面前赶出去，使他们失去地业；你们必取得他们的土地[a]，正如雅威——你们的上帝——对你们所说的[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“承受他们的土地。”希伯来语动词既可表示“承受”，也可表示“取得、占有”；正文依征服土地的语境译作“取得”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来语直译为“正如雅威你们的上帝对你们所说的”。这里所说的话具有应许的性质，但正文保留“说”的基本含义。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: 雅威
  rationale: 以通行的现代汉语音译呈现上帝的专名，保留原文的圣约名称，不以“主”替代。
- source_word: אֱלֹהֵיכֶם
  choice: 你们的上帝
  rationale: 与雅威之名同位，并带第二人称复数后缀，所指是以色列的上帝；此译自然且明确。
- source_word: הוּא
  choice: 亲自
  rationale: 独立代词在这里带强调作用；“亲自”自然地表达雅威自己采取行动的语气。
- source_word: יֶהְדֳּפֵם
  choice: 把他们……赶走
  rationale: הדף表示用力驱赶；在征服土地的语境中，“赶走”准确而通俗。
- source_word: מִפְּנֵיכֶם
  choice: 从你们面前
  rationale: 保留希伯来语的空间意象，同时符合现代汉语表达。
- source_word: וְהוֹרִישׁ אֹתָם
  choice: 使他们……丧失地业
  rationale: ירש的使役形在此表示使原有占据者失去其土地权益；此译与前面的“赶走”有所区别，也保留土地归属层面的含义。
- source_word: מִלִּפְנֵיכֶם
  choice: 从你们面前
  rationale: 原文重复此前的空间短语，正文也予以保留。
- source_word: וִירִשְׁתֶּם
  choice: 你们必占有
  rationale: ירש的基本义可为“承受”或“取得、占有”；征服土地的上下文以“占有”较为贴切，同时用脚注保留另一可能。
- source_word: אֶת אַרְצָם
  choice: 他们的土地
  rationale: 直接表达列国当时所占有的土地。
- source_word: כַּאֲשֶׁר דִּבֶּר
  choice: 正如……所说的
  rationale: דבר本义是“说、讲”；这里的话具有应许性质，但正文不把这一含义明定为“应许”。
- source_word: לָכֶם
  choice: 对你们
  rationale: 表示神说话所面向的间接宾语。
theological_decisions:
- issue: 如何翻译神名 יהוה
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名；采用“雅威”以保留专名性质，避免用称号代替，也不把特定传统译名视为唯一读法。
- issue: ירש在使役形和基本形中的不同语义
  choice: “使他们丧失地业”与“占有他们的土地”
  alternative: 两处都译作“赶走”；后一处译作“承受他们的土地”
  rationale: 同一词根在不同词形中形成一失一得的对应：雅威使列国失去土地，以色列则取得土地。分别翻译可保留这种语义关系，而不把两处压平为同一个动作。
- issue: דבר在本节是否应明确译成“应许”
  choice: 所说的
  alternative: 所应许的
  rationale: 上下文确有应许意味，但动词本身是“说”；正文保留较宽的原词义，让应许功能由语境显明。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“亲自”传达独立代词的强调；两次保留“从你们面前”，呈现原文的重复和空间意象。“地业”用于表达原住民所失去的土地权益，与随后“土地”一词形成自然但有意义的区分。
