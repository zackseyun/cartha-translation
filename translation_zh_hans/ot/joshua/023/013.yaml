  text: יָד֨וֹעַ֙ תֵּֽדְע֔וּ כִּי֩ לֹ֨א יוֹסִ֜יף יְהוָ֣ה אֱלֹהֵי/כֶ֗ם לְ/הוֹרִ֛ישׁ אֶת הַ/גּוֹיִ֥ם הָ/אֵ֖לֶּה מִ/לִּ/פְנֵי/כֶ֑ם וְ/הָי֨וּ לָ/כֶ֜ם לְ/פַ֣ח וּ/לְ/מוֹקֵ֗שׁ וּ/לְ/שֹׁטֵ֤ט בְּ/צִדֵּי/כֶם֙ וְ/לִ/צְנִנִ֣ים בְּ/עֵינֵי/כֶ֔ם עַד אֲבָדְ/כֶ֗ם מֵ֠/עַל הָ/אֲדָמָ֤ה הַ/טּוֹבָה֙ הַ/זֹּ֔את אֲשֶׁר֙ נָתַ֣ן לָ/כֶ֔ם יְהוָ֖ה אֱלֹהֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/023/013.yaml
  text: know for certain that Yahweh your God will no longer drive out these nations from before you[a], but they will become for you a trap and a snare, a scourge on your sides and thorns in your eyes[b], until you perish from off this good land that Yahweh your God has given you.
translation:
  language: zh_hans
  text: 你们务要确实知道，耶和华你们的上帝必不再从你们面前赶出这些国民；他们反而要成为你们的网罗和陷阱，成为你们肋旁的鞭子[a]、你们眼中的荆棘，直到你们从耶和华你们的上帝赐给你们的这片美地上灭绝。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “你们肋旁的鞭子”：原文这个词的含义不确定，也可理解为“你们肋旁的鞭伤”或泛指使人痛苦的灾祸。
    reason: lexical_alternative
lexical_decisions:
- source_word: יָדוֹעַ תֵּדְעוּ
  choice: 务要确实知道
  rationale: 不定式绝对形与同根限定动词连用，强化“知道”的语气；此译自然表达郑重而确定的警告。
- source_word: לֹא יוֹסִיף ... לְהוֹרִישׁ
  choice: 必不再……赶出
  rationale: יסף加不定式表示不再继续某项行动；“不再赶出”简洁保留停止进一步驱逐的含义。
- source_word: מִלִּפְנֵיכֶם
  choice: 从你们面前
  rationale: 保留希伯来语的空间意象，也符合争战和驱逐语境。
- source_word: לְפַח וּלְמוֹקֵשׁ
  choice: 网罗和陷阱
  rationale: 两个近义词构成修辞性并列；分别译出，以保留双重意象。
- source_word: לְשֹׁטֵט בְּצִדֵּיכֶם
  choice: 抽打你们肋旁的鞭子
  rationale: שֹׁטֵט词义困难，语境与平行结构指向鞭打器具或造成持续痛苦的东西；正文采用具体身体意象，并以脚注保留不确定性。
- source_word: לִצְנִנִים בְּעֵינֵיכֶם
  choice: 刺入你们眼中的荆棘
  rationale: צנינים指尖锐、刺痛之物；此译保留强烈的身体痛苦意象。
- source_word: עַד אֲבָדְכֶם
  choice: 直到……灭亡
  rationale: עד加带后缀的不定式结构标明警告后果的终点。
- source_word: מֵעַל הָאֲדָמָה הַטּוֹבָה הַזֹּאת
  choice: 从……这片美地上
  rationale: אדמה在此指上帝所赐之地；“从……地上”保留מעל的空间关系。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代简体中文圣经语域中广为人知的专名形式，明确其为以色列上帝的名字，而非仅译作称号。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 两者均为四字神名的中文表达；正文采用普通中文读者最熟悉且具有专名功能的“耶和华”，不以“主”取代原文神名。
- issue: 警告的性质
  choice: 保留上帝停止赶逐列国、列国成为祸患、以色列最终从所赐美地灭亡的因果推进
  alternative: 将其淡化为单纯的军事预测
  rationale: 原文把上帝不再赶逐列国与百姓受害及失去美地紧密相连；译文不额外阐明原因，也不削弱其圣约审判意味。
- issue: שֹׁטֵט的语义不确定性
  choice: 正文译作“抽打你们肋旁的鞭子”并加注
  alternative: 你们肋旁的灾祸／鞭伤
  rationale: 该词罕见且解释困难；具体译法较能维持与“眼中的荆棘”平行的身体意象，脚注则避免把有争议的词义说成确定无疑。
translation_notes:
  register: 采用现代、庄重而易懂的普通话书面语。“务要确实知道”传达原文的强调；“网罗和陷阱”“鞭子”“荆棘”保留逐步增强的具体意象。仅在真正存在词义困难的שֹׁטֵט处加注。
