source:
  edition: WLC
  text: בְּ֠/עָבְרְ/כֶם אֶת בְּרִ֨ית יְהוָ֥ה אֱלֹהֵי/כֶם֮ אֲשֶׁ֣ר צִוָּ֣ה אֶתְ/כֶם֒ וַ/הֲלַכְתֶּ֗ם וַ/עֲבַדְתֶּם֙ אֱלֹהִ֣ים אֲחֵרִ֔ים וְ/הִשְׁתַּחֲוִיתֶ֖ם לָ/הֶ֑ם וְ/חָרָ֤ה אַף יְהוָה֙ בָּ/כֶ֔ם וַ/אֲבַדְתֶּ֣ם מְהֵרָ֔ה מֵ/עַל֙ הָ/אָ֣רֶץ הַ/טּוֹבָ֔ה אֲשֶׁ֖ר נָתַ֥ן לָ/כֶֽם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/023/016.yaml
  text: If you transgress the covenant of Yahweh your God[a], which he commanded you, and go and serve other gods and bow down to them, then the anger of Yahweh will burn against you[b], and you will perish quickly from the good land that he has given you.
translation:
  language: zh_hans
  text: 你们若违背雅威你们的上帝所吩咐你们的约[a]，去事奉别的神，向它们下拜，雅威的怒气就必向你们发作；你们也必迅速从他赐给你们的美地上灭绝[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 开头的希伯来语也可译作：“当你们违背……的约时。”它既可表示时间，也可表示条件。
    reason: alternative_reading
  - marker: b
    text: 原文“从……美地之上”强调他们将从雅威所赐的土地上被除去。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּעָבְרְכֶם
  choice: 你们若违背
  rationale: ב加不定词在这里引出警告的条件情境；עבר ברית是“违背约”的固定表达，不宜按字面译作“越过”。
- source_word: בְּרִית
  choice: 约
  rationale: 保留该词在雅威与以色列关系中的法律性和神学分量，同时符合现代汉语圣经语体。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语通行的音译呈现四字神名，保留其作为上帝专名的性质，而不以称号替代。
- source_word: אֱלֹהֵיכֶם
  choice: 你们的上帝
  rationale: 此处与雅威连用，虽有复数词形，却指以色列的独一上帝。
- source_word: אֲשֶׁר צִוָּה אֶתְכֶם
  choice: 吩咐你们遵守的
  rationale: 汉语若直译为“吩咐你们的约”不够自然；补出语境隐含的“遵守”，清楚表达这约是雅威命令他们持守的，而不改变其关系从句功能。
- source_word: וַהֲלַכְתֶּם וַעֲבַדְתֶּם
  choice: 去事奉
  rationale: “去”自然表达转而跟随别神的行动，“事奉”则保留עבד所指的宗教服事，并与随后“下拜”区分。
- source_word: אֱלֹהִים אֲחֵרִים
  choice: 别的神明
  rationale: 直接表达与雅威相竞争的其他神祇；“神明”在现代汉语中能自然采用复数所指。
- source_word: וְהִשְׁתַּחֲוִיתֶם לָהֶם
  choice: 向它们下拜
  rationale: 保留该动词俯伏、下拜的身体动作，不把它与前面的“事奉”合并为一般性的“敬拜”。
- source_word: וְחָרָה אַף יְהוָה בָּכֶם
  choice: 雅威的怒火就必向你们燃烧
  rationale: 保留“怒气燃烧”的希伯来语意象；“就必”清楚传达前项背约与后项审判之间的结果关系。
- source_word: וַאֲבַדְתֶּם מְהֵרָה
  choice: 你们也必很快……灭亡
  rationale: אבד可表示灭亡、毁灭或不复存在；“灭亡”保留警告的严厉程度，“很快”准确传达מְהֵרָה。
- source_word: מֵעַל הָאָרֶץ הַטּוֹבָה
  choice: 从……这片美地上
  rationale: מֵעַל强调从土地之上被除去；“从……地上灭亡”既保留空间意象，也符合庄重汉语表达。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名。音译“雅威”保留其专名性质，既不以“上主”这一称号替代，也不采用较晚形成的“耶和华”读音。
- issue: 开头结构是条件还是时间
  choice: 以“若”表达条件警告
  alternative: 以“当……时”表达时间关系
  rationale: ב加不定词可有时间或条件含义；在约书亚劝诫百姓的语境中，条件式更能呈现背道之后果，同时不把背约说成必然发生。
- issue: 离开美地与灭亡的关系
  choice: 保留“从美地上灭亡”的压缩表达
  alternative: 明确译为“从美地上被除灭／消失”
  rationale: 原文同时使用אבד与מֵעַל，既传达灭亡，也突出从所赐土地上被除去。正文保留两层张力，脚注说明这一空间性重点。
translation_notes:
  register: 采用现代、庄重而清楚的标准普通话。“事奉”保留宗教语境中的专门含义，“下拜”呈现具体动作；句式维持约的警告所具有的严肃和递进力度。
