base_translation:
  language: en
  yaml_path: translation/ot/joshua/023/006.yaml
  text: Therefore be very strong to keep and to do all that is written in the Book of the Law of Moses[a], so as not to turn from it to the right or to the left.
translation:
  language: zh_hans
  text: 所以，你们要格外刚强，谨守遵行摩西的律法书[a]上所写的一切，不可向右或向左偏离。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“摩西的训诲书”。希伯来语“妥拉”既可指“训诲”，也可指“律法”；这里特指摩西所传的律法整体。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַחֲזַקְתֶּם מְאֹד
  choice: 你们要格外刚强
  rationale: 复数形式面向全体听众，语境中具有劝勉、命令的作用；“格外”保留 מְאֹד 的强调，“刚强”直接体现 חזק 的坚定有力之意。
- source_word: לִשְׁמֹר וְלַעֲשׂוֹת
  choice: 谨守遵行
  rationale: 在律法与盟约语境中，שׁמר 指认真持守，עשה 指实际实行；“谨守遵行”自然、庄重，并保留两个相连动作。
- source_word: כָּל הַכָּתוּב
  choice: 所写的一切
  rationale: 完整表达该结构对书中成文内容的全面指称。
- source_word: בְּסֵפֶר תּוֹרַת מֹשֶׁה
  choice: 《摩西律法书》上
  rationale: סֵפֶר 可指书卷；此处 תּוֹרָה 指与摩西相关的成文律法整体。“律法书”准确而符合现代中文圣经语体。
- source_word: לְבִלְתִּי סוּר מִמֶּנּוּ
  choice: 不可偏离
  rationale: סור 在道路隐喻中表示转离、偏离；中文省去代词宾语仍清楚指向前述律法书所写的一切，并保持句子自然。
- source_word: יָמִין וּשְׂמֹאול
  choice: 或向右，或向左
  rationale: 保留希伯来文不向任何一边偏离的道路隐喻，并用对称结构表达。
theological_decisions:
- issue: 摩西之约语境中 תּוֹרָה 的译法
  choice: 《摩西律法书》
  alternative: 《摩西训诲书》
  rationale: תּוֹרָה 既可泛指教导、训诲，也可指律法；本节的固定表达指摩西所传、已经写下并要求遵行的盟约律法整体，因此正文采用“律法”，脚注保留“训诲”的词义可能。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“谨守遵行”体现法律与盟约语境；书名号帮助读者辨识成文书卷。“不可偏离，或向右，或向左”保留原文形象而不作神学扩展。
