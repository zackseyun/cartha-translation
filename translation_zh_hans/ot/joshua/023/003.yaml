source:
  edition: WLC
  text: וְ/אַתֶּ֣ם רְאִיתֶ֗ם אֵת֩ כָּל אֲשֶׁ֨ר עָשָׂ֜ה יְהוָ֧ה אֱלֹהֵי/כֶ֛ם לְ/כָל הַ/גּוֹיִ֥ם הָ/אֵ֖לֶּה מִ/פְּנֵי/כֶ֑ם כִּ֚י יְהוָ֣ה אֱלֹהֵי/כֶ֔ם ה֖וּא הַ/נִּלְחָ֥ם לָ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/023/003.yaml
  text: And you yourselves have seen all that Yahweh your God has done to all these nations before you[a], for Yahweh your God is the one who has fought for you.
translation:
  language: zh_hans
  text: 你们自己已经亲眼看见了雅威你们的神为你们对这些民族所做的一切[a]；因为雅威你们的神正是为你们争战的那一位。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文此处直译为“从你们面前”。在征服的语境中，这可指这些民族从以色列人面前被赶离；也可理解为“为你们的缘故”。
    reason: 保留 מִפְּנֵיכֶם 的字面表达及其在上下文中可能具有的惯用含义，避免正文预先限定其分析。
lexical_decisions:
- source_word: וְאַתֶּם
  choice: 你们也亲眼
  rationale: 独立人称代词带有强调意味；用“亲眼”自然地突出听众本人的亲身见证，“也”承接上文。
- source_word: רְאִיתֶם
  choice: 看见了
  rationale: 完成式指以色列人已经亲历并目睹的事；现代汉语用“看见了”表达已发生且与当前劝告相关的经历。
- source_word: אֵת כָּל אֲשֶׁר עָשָׂה
  choice: 所做的一切
  rationale: 保留原文对全部作为的概括，不把宽泛的动词 עשה 限定为某一种行动。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以通行的现代汉语音译呈现四字神名，保留其作为专名的性质，而不以称号替代。
- source_word: אֱלֹהֵיכֶם
  choice: 你们的神
  rationale: 准确表达复数第二人称所属后缀，并保留约的群体性称呼。
- source_word: לְכָל הַגּוֹיִם הָאֵלֶּה
  choice: 对这一切民族
  rationale: 介词 לְ 在 עשה 之后表示行动所及的对象；“对……所做”既自然，也不预先限定具体行动。
- source_word: מִפְּנֵיכֶם
  choice: 把他们从你们面前赶走
  rationale: 原文字面为“从你们面前”，在征服叙事中是民族被逐离以色列人面前的惯用表达；正文明确其语境意义，并以脚注保留字面形式。
- source_word: כִּי
  choice: 因为
  rationale: 引出前述事实的原因或解释，现代汉语“因为”清楚自然。
- source_word: הוּא הַנִּלְחָם
  choice: 正是……争战的那一位
  rationale: 人称代词 הוּא 与带冠词的分词共同形成强调；“正是……的那一位”保留这种强调及分词所表达的持续特征。
- source_word: לָכֶם
  choice: 为你们
  rationale: 表达受益或代为行动的关系，即雅威代表以色列争战。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。译作“雅威”保留其专名性质，也较贴近学界通常重构的读音；不以“主”这一称号代替。
- issue: 神为以色列争战的表述
  choice: 正是为你们争战的那一位
  alternative: 他为你们争战了
  rationale: 保留原文 הוּא 的强调和名词化分词的特征，不把它仅限于一次已经结束的行动，同时也让上下文中的既往作为保持清楚。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“亲眼看见”体现原文独立代词的强调；“正是……的那一位”保留末句的强调结构。正文避免古奥措辞，同时通过脚注交代 מִפְּנֵיכֶם 的字面形式。
