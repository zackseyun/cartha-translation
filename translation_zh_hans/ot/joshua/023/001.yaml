source:
  edition: WLC
  text: וַֽ/יְהִי֙ מִ/יָּמִ֣ים רַבִּ֔ים אַ֠חֲרֵי אֲשֶׁר הֵנִ֨יחַ יְהוָ֧ה לְ/יִשְׂרָאֵ֛ל מִ/כָּל אֹיְבֵי/הֶ֖ם מִ/סָּבִ֑יב וִ/יהוֹשֻׁ֣עַ זָקֵ֔ן בָּ֖א בַּ/יָּמִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/023/001.yaml
  text: And it happened[a], after many days, after Yahweh had given Israel rest from all their enemies around them, that Joshua was old[b], advanced in years.
translation:
  language: zh_hans
  text: 雅威使以色列得享安宁，脱离四周一切仇敌以后，过了许多年[a]，约书亚已经年老，年事已高[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“过了很久”。
    reason: “许多日子”是表示相当长一段时间的希伯来表达。
  - marker: b
    text: 希伯来语习语，字面意思是“进入日子”。
    reason: 说明“年事已高”所对应的原文形象表达。
lexical_decisions:
- source_word: וַיְהִי
  choice: 以自然的叙事句式表达，不单独直译
  rationale: 这是希伯来叙事中引入新场景的常用形式。中文以整句的时间背景自然承接，无须生硬译成“事情发生了”。
- source_word: מִיָּמִים רַבִּים
  choice: 过了许多年
  rationale: 保留“许多日子”的时间延续之意，同时用现代汉语自然表达相当长的一段时间。
- source_word: אַחֲרֵי אֲשֶׁר
  choice: ……以后
  rationale: 引出作为时间基点的先前事件；中文将该从句前置，清楚呈现先后关系。
- source_word: הֵנִיחַ
  choice: 使……得享安宁
  rationale: 此处使役式表示雅威使以色列从仇敌的威胁中得到休息和安稳；“得享安宁”兼顾语义与中文表达。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来神名四字母的通行拟音译出专名，不以“主”这一称号替代，也不采用源自“Jehovah”的传统形式。
- source_word: לְיִשְׂרָאֵל
  choice: 以色列
  rationale: 按现代汉语通行形式音译民族专名；上下文指以色列百姓整体。
- source_word: מִכָּל אֹיְבֵיהֶם מִסָּבִיב
  choice: 脱离四周一切仇敌
  rationale: 表达以色列从周围所有仇敌那里获得全面安歇，保留“一切”和“四周”的范围强调。
- source_word: זָקֵן
  choice: 已经年老
  rationale: 直接表达约书亚当时已经衰老的状态；“已经”也配合本句较长的时间推移。
- source_word: בָּא בַּיָּמִים
  choice: 年事已高
  rationale: 这是表示高龄的希伯来习语，字面为“进入日子”；采用清楚、庄重而自然的现代汉语对应语。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用以色列之神的专名。译作“雅威”保留专名性质，并较贴近通常重构的读音；不以称号“主”取代，也不采用源自较晚混合读法的“耶和华”。
- issue: “安歇”与仇敌的关系
  choice: 使以色列得享安宁，脱离四周一切仇敌
  alternative: 使以色列战胜四周一切仇敌
  rationale: 原文强调雅威赐下从仇敌而来的安歇，并未在本节明确说仇敌全被消灭；译文避免把“安歇”解释成更具体的军事结局。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。将希伯来语的双重时间结构调整为自然中文次序：“雅威赐安宁以后，过了许多年”；保留“年老，年事已高”的同义递进，以反映原文两个年龄表述。
