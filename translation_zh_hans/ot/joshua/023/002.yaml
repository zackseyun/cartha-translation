base_translation:
  language: en
  yaml_path: translation/ot/joshua/023/002.yaml
  text: Then Joshua called for all Israel—for its elders[a], its heads, its judges, and its officers—and said to them, “I am old[c][b]; I have advanced in years.”
translation:
  language: zh_hans
  text: 于是，约书亚召集全以色列，就是以色列的长老、首领、审判官和官员，对他们说：“我已经老了，年事已高。[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “年事已高”直译为“我来到日子中”，是表示年岁已高的希伯来语习语。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: 召集
  rationale: קרא 后接 לְ，在此表示把人召来、聚集起来；“召集”符合领袖会议的语境，也比单纯的“呼叫”自然。
- source_word: לְכָל יִשְׂרָאֵל
  choice: 全以色列
  rationale: 保留原文的民族整体称谓；下列各类领袖说明以色列在此由其代表人物出席。
- source_word: לִזְקֵנָיו
  choice: 以色列的长老
  rationale: 第三人称单数后缀回指作为集合体的“以色列”；中文补出“以色列的”，使所指清楚。
- source_word: וּלְרָאשָׁיו
  choice: 首领
  rationale: רֹאשׁ 字面为“头”，用于行政群体时指居首位者；“首领”既保留其领袖含义，也与其他职分有所区分。
- source_word: וּלְשֹׁפְטָיו
  choice: 审判官
  rationale: 此词在民政语境中指承担审判职责的官员；“审判官”准确且适合庄重经文语体。
- source_word: וּלְשֹׁטְרָיו
  choice: 官长
  rationale: שֹׁטְרִים 指行政执行人员或官员；“官长”是清楚而庄重的传统表达，不将其过度限定为文士。
- source_word: וַיֹּאמֶר אֲלֵהֶם
  choice: 对他们说
  rationale: 直接、自然地引入下文引语。
- source_word: אֲנִי זָקַנְתִּי
  choice: 我已经老了
  rationale: 希伯来语完成式表达变老过程所形成的当前状态；“已经老了”兼顾过程与现状。
- source_word: בָּאתִי בַּיָּמִים
  choice: 年事已高
  rationale: 这是表示年老的希伯来语习语；中文“年事已高”自然、庄重，并保留与前句近义递进的表达。
theological_decisions:
- issue: “全以色列”与随后领袖名单的关系
  choice: 保留“全以色列”，并以“就是”引出作为其代表的各类领袖。
  alternative: 意译为“以色列所有的领袖”，省略民族整体称谓。
  rationale: 原文同时保留“全以色列”和长老、首领、审判官、官长的名单。译文不把两者合并消解，而以自然中文呈现代表性关系。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“召集”适合公共领袖会议的场景；职分名称保持并列与区分。原文后半句以两个近义表达强调约书亚年老，译文也予以保留。
