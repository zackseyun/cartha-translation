  text: רְאוּ֩ הִפַּ֨לְתִּי לָ/כֶ֜ם אֶֽת הַ֠/גּוֹיִם הַ/נִּשְׁאָרִ֥ים הָ/אֵ֛לֶּה בְּ/נַחֲלָ֖ה לְ/שִׁבְטֵי/כֶ֑ם מִן הַ/יַּרְדֵּ֗ן וְ/כָל הַ/גּוֹיִם֙ אֲשֶׁ֣ר הִכְרַ֔תִּי וְ/הַ/יָּ֥ם הַ/גָּד֖וֹל מְב֥וֹא הַ/שָּֽׁמֶשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/023/004.yaml
  text: See[a], I have allotted to you these nations that remain as an inheritance for your tribes, from the Jordan, along with all the nations that I have cut off, to the Great Sea toward the going down of the sun.
translation:
  language: zh_hans
  text: 你们看，我已经把这些仍存的民族，以及我所剪除的所有民族，从约旦河直到西边的大海[a]，分给你们各支派作产业。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“朝着太阳落下之处的大海”；“太阳落下之处”是指西方。
    reason: 说明希伯来语“太阳落下之处”的方位惯用语，并保留其日落意象。
lexical_decisions:
- source_word: רְאוּ
  choice: 你们看
  rationale: 复数命令式，用来郑重唤起全体听众注意；“你们看”自然保留了指示和强调作用。
- source_word: הִפַּלְתִּי
  choice: 我已经……拈阄分给
  rationale: נפל 的使役式在分地语境中指使地业按阄落定，即拈阄分配；此译法既传达分配意义，也保留抽签分地的具体背景。
- source_word: הַגּוֹיִם הַנִּשְׁאָרִים הָאֵלֶּה
  choice: 这些剩下的民族
  rationale: 忠实表达分词所指仍留在当地的民族，不把“剩下”弱化为单纯的形容性标签。
- source_word: בְּנַחֲלָה
  choice: 作产业
  rationale: נחלה 在《约书亚记》的分地语境中指承受而得的土地产业；“作产业”简洁自然，并保留承受地业的含义。
- source_word: לְשִׁבְטֵיכֶם
  choice: 给你们各支派
  rationale: לְ 标明分配的领受者；“各支派”在汉语中清楚表达复数及逐支派分配的意思。
- source_word: וְכָל הַגּוֹיִם אֲשֶׁר הִכְרַתִּי
  choice: 连同我所剪除的一切民族
  rationale: כרת 在此表示剪除、灭除；“剪除”保留希伯来语意象及审判色彩，“连同”则自然连接已被剪除和仍然留下的民族。
- source_word: מִן הַיַּרְדֵּן ... וְהַיָּם הַגָּדוֹל
  choice: 从约旦河直到……大海
  rationale: 上下文表达领土范围；虽然后一界标前用连接词，汉语以“从……直到……”最清楚地呈现边界跨度。
- source_word: מְבוֹא הַשָּׁמֶשׁ
  choice: 日落方向
  rationale: 原文直译近于“太阳进入之处”，是指日落或西方的惯用语；正文保留日落意象，同时以“方向”使地理含义清楚。
theological_decisions:
- issue: “我所剪除”的施事者和审判语气
  choice: 保留第一人称“我所剪除”及“剪除”的意象
  alternative: 译作“被消灭的”或淡化为“被赶走的”
  rationale: 原文明确以约书亚为第一人称施事者，并使用 כרת 的强烈措辞；译文不改换施事者，也不弱化或扩大神学含义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事用语。“拈阄分给”贴合《约书亚记》的分地背景；语序略作调整，使领土范围和受领支派在普通话中关系清楚。
