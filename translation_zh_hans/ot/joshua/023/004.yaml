  rationale: 修订去除了正文中未明说的“拈阄”程序，以“分给……作产业”保留土地分配与产业承受的含义；改用“仍存的民族”和“西边的大海”，使现代普通话更自然清楚。脚注保留原文“太阳落下之处”的字面意象及其西方含义。
