  naturalness: “这些剩下的民族”可理解，但“仍存的民族”更符合庄重现代汉语。“日落方向的大海”不够自然；以“西边的大海”表达地理指向，并以脚注保留原文日落意象，更清楚流畅。
  terminology: “产业”“各支派”“剪除”均适切。“大海”应保留其专名/界标性质；“分给……作产业”足以表达分配和承受地业，不宜在正文补入“拈阄”。
