  text: וַ/יּ֤וֹרֶשׁ יְהוָה֙ מִ/פְּנֵי/כֶ֔ם גּוֹיִ֖ם גְּדֹלִ֣ים וַ/עֲצוּמִ֑ים וְ/אַתֶּ֗ם לֹא עָ֤מַד אִישׁ֙ בִּ/פְנֵי/כֶ֔ם עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/023/009.yaml
  text: For Yahweh has driven out from before you great and mighty nations[a], and as for you[b], not a man has stood before you to this day.
translation:
  language: zh_hans
  text: 耶和华已从你们面前逐出了强大而有势力的列国[a]；至于你们，直到今日，没有一人能在你们面前站立得住[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “逐出”也可译作“赶走”或“使其失去土地”。希伯来语动词在这里可强调除去当地民族，使以色列得以占有其地。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“没有一人在你们面前站立”。这是战事中的说法，意为没有人能够抵挡你们。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹרֶשׁ
  choice: 已……赶走
  rationale: 使役形在征服和土地语境中表示使原有居民失去其地、将其逐出；“赶走”自然清楚，并与“从你们面前”衔接。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文读者最熟悉的专名形式音译四字神名，保留其作为以色列之神专名的功能，而不以称号替代。
- source_word: מִפְּנֵיכֶם
  choice: 从你们面前
  rationale: 保留希伯来语“从……面前”的空间性表达，在征服语境中指从以色列人所到之处被除去。
- source_word: גּוֹיִם גְּדֹלִים וַעֲצוּמִים
  choice: 那些强大有力的民族
  rationale: גָּדוֹל 与 עָצוּם 在此共同突出这些民族的强盛；“强大有力”庄重、易懂，又避免把前者仅限于人口或疆域大小。
- source_word: וְאַתֶּם
  choice: 至于你们
  rationale: 独立人称代词前置具有强调和对照作用；“至于你们”在中文中自然体现这一话题突出。
- source_word: לֹא עָמַד אִישׁ בִּפְנֵיכֶם
  choice: 没有一人能在你们面前站立得住
  rationale: 保留“没有一人”和“在……面前站立”的形象，同时用“站立得住”表达战事语境中无人能够抵挡的惯用含义。
- source_word: עַד הַיּוֹם הַזֶּה
  choice: 直到今日
  rationale: 准确表达这种情形一直延续到说话当时；措辞简洁庄重。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。正文采用现代中文圣经传统中最广为人知的专名“耶和华”，既不以“主”等称号替代，也通过备选说明承认“雅威”是另一常见音译。
- issue: 以色列得胜与耶和华行动之间的关系
  choice: 明确以耶和华为赶走列国的主语
  alternative: 弱化为列国被赶走
  rationale: 希伯来文明确以耶和华为动词主语，随后才强调无人能在以色列面前站立；译文保留神的行动与以色列军事优势之间的张力和次序。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“强大有力”保持原文两个并列形容词的力度；“站立得住”既保存希伯来语意象，也让中文读者自然理解为无法抵挡。所有脚注标记均已置于正文相应位置。
