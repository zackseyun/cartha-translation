  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/הִנֵּ֨ה אָנֹכִ֤י הוֹלֵךְ֙ הַ/יּ֔וֹם בְּ/דֶ֖רֶךְ כָּל הָ/אָ֑רֶץ וִ/ידַעְתֶּ֞ם בְּ/כָל לְבַבְ/כֶ֣ם וּ/בְ/כָל נַפְשְׁ/כֶ֗ם כִּ֣י לֹֽא נָפַל֩ דָּבָ֨ר אֶחָ֜ד מִ/כֹּ֣ל הַ/דְּבָרִ֣ים הַ/טּוֹבִ֗ים אֲשֶׁ֨ר דִּבֶּ֜ר יְהוָ֤ה אֱלֹהֵי/כֶם֙ עֲלֵי/כֶ֔ם הַ/כֹּל֙ בָּ֣אוּ לָ/כֶ֔ם לֹֽא נָפַ֥ל מִמֶּ֖/נּוּ דָּבָ֥ר אֶחָֽד־־־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/023/014.yaml
  text: And behold[a], today I am going the way of all the earth, and you know with all your heart and with all your soul that not one word has fallen from all the good words that Yahweh your God spoke concerning you. All of them have come to you[b]; not one word from them has fallen.
translation:
  language: zh_hans
  text: 看哪[a]，我今天正走上世人都要走的路[b]。你们全心全意地知道：耶和华你们的上帝所说、关乎你们的一切美好的话，没有一句落空[c]；这一切都已经临到你们，其中没有一句落空。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “看哪”是引人注意的庄重表达，也可译作“请看”或“如今”。
    reason: discourse_marker
  - marker: b
    text: “世人都要走的路”是希伯来语的习语，指人人共同的归宿，尤其指死亡。
    reason: cultural_note
  - marker: c
    text: “没有一句落空”直译是“没有一句话落下”；此处表示上帝所说的话没有一句未实现。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: 看哪
  rationale: 保留原文引起注意、增强庄重语气的话语标记；现代中文读者也能自然理解。
- source_word: אָנֹכִי הוֹלֵךְ הַיּוֹם בְּדֶרֶךְ כָּל הָאָרֶץ
  choice: 今天我要走世人都要走的路了
  rationale: 保留“走……的路”这一死亡隐喻，同时用“世人都要走的”自然表达 כָּל־הָאָרֶץ 所指全人类共同的归宿；句末“了”传达临近离世之意。
- source_word: וִידַעְתֶּם בְּכָל לְבַבְכֶם וּבְכָל נַפְשְׁכֶם
  choice: 你们全心全意地知道
  rationale: “全心全意”自然传达“用你们全部的心和全部的生命/魂”所强调的完整内在确信，避免在现代汉语中生硬堆叠身体—灵魂术语。
- source_word: לֹא נָפַל דָּבָר אֶחָד
  choice: 没有一句落空
  rationale: דָּבָר 因下文“所说”而译为“一句（话）”；“落空”既保留 נפל 的落下意象痕迹，也清楚表达未能实现之义。
- source_word: מִכֹּל הַדְּבָרִים הַטּוֹבִים
  choice: 一切美善之言
  rationale: 保留 דְּבָרִים 与“说”的词义联系，不直接释为“应许”；“美善之言”兼具庄重和可懂性。
- source_word: יְהוָה אֱלֹהֵיכֶם
  choice: 耶和华你们的上帝
  rationale: 以中文通行音译“耶和华”呈现四字神名，并将 אֱלֹהִים 译为现代标准中文的“上帝”。
- source_word: עֲלֵיכֶם
  choice: 论到你们
  rationale: 贴近介词 עַל 在此处“关于、论及”的意义，不将其窄化为仅仅“对你们说”。
- source_word: הַכֹּל בָּאוּ לָכֶם
  choice: 这一切都为你们实现了
  rationale: 原文直译为“全都临到你们”；在中文中用“为你们实现”明确其成就、应验之义，同时保留受益对象。
- source_word: לֹא נָפַל מִמֶּנּוּ דָּבָר אֶחָד
  choice: 没有一句落空
  rationale: 依原文重复首句的断言，加强修辞收束；中文无需重复“其中”也能清楚回指前述一切美善之言。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: “耶和华”是普通简体中文读者最熟悉且庄重的专名形式；正文直接呈现神名，不以“主”代替。
- issue: דְּבָרִים 是否直接译作“应许”
  choice: 美善之言
  alternative: 美好的应许
  rationale: 上下文确有应许实现的含义，但原文使用可指“话、事”的 דָּבָר，并以 דִּבֶּר“说”相呼应；译作“言”保留词汇联系和原文一定的语义宽度。
- issue: “全心、全魂”的人论表达
  choice: 全心全意
  alternative: 用你们全部的心、全部的生命
  rationale: 此处强调以整个内在人格确知，并非划分人的构成部分；采用汉语成语可准确传达整体性，又不额外建立灵魂论结论。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。正文保留“走……的路”和“落空”两个希伯来意象，但将可能费解之处放入脚注说明。脚注标记均已在正文出现。
