source:
  edition: WLC
  text: כִּ֣י אִם שׁ֣וֹב תָּשׁ֗וּבוּ וּ/דְבַקְתֶּם֙ בְּ/יֶ֨תֶר֙ הַ/גּוֹיִ֣ם הָ/אֵ֔לֶּה הַ/נִּשְׁאָרִ֥ים הָ/אֵ֖לֶּה אִתְּ/כֶ֑ם וְ/הִֽתְחַתַּנְתֶּ֥ם בָּ/הֶ֛ם וּ/בָאתֶ֥ם בָּ/הֶ֖ם וְ/הֵ֥ם בָּ/כֶֽם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/023/012.yaml
  text: For if you indeed turn back and cling to the remnant of these nations[a], these that remain with you, and intermarry with them and go in to them, and they to you[b],
translation:
  language: zh_hans
  text: 因为你们若果真转回去，依附这些民族中余下的那些人[a]，就是仍留在你们中间的那些人，又与他们通婚，彼此来往[b]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “依附”也可译作“紧紧依附”或“与……紧密联结”。
    reason: lexical_alternative
  - marker: b
    text: 原文直译近于“你们进入他们中间，他们也进入你们中间”，可指彼此交往或相互混合，不仅是身体上的移动。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: 因为……若
  rationale: 承接上一节的警告并引出条件；既保留 כִּי 的连接作用，也用现代汉语自然的条件句表达 אִם。
- source_word: שׁוֹב תָּשׁוּבוּ
  choice: 果真转回去
  rationale: “果真”体现不定式绝对式与限定动词连用的加强语气；“转回去”在上下文中表示离开先前忠于耶和华的方向，又不直接加入原文未明说的“背道”等神学判断。
- source_word: וּדְבַקְתֶּם
  choice: 依附
  rationale: 表达 דבק 所指的紧密联结，适合此处与列国建立持续关系的警告语境，也保留其可用于盟约关系的强烈色彩。
- source_word: בְּיֶתֶר הַגּוֹיִם הָאֵלֶּה
  choice: 这些民族中剩下的人
  rationale: יֶתֶר 指余下、剩余的部分；此译在现代汉语中清楚说明所指是这些民族的幸存成员，同时避免“余民”在其他语境中可能带来的特殊神学联想。
- source_word: הַנִּשְׁאָרִים הָאֵלֶּה אִתְּכֶם
  choice: 就是那些仍留在你们中间的人
  rationale: 保留希伯来文进一步限定和重复指示的结构；将 אִתְּכֶם 按实际共处关系译作“在你们中间”。
- source_word: וְהִתְחַתַּנְתֶּם בָּהֶם
  choice: 又与他们通婚
  rationale: חתן 的反身词干在此指借婚姻建立亲属关系；“通婚”简洁、自然，并体现双方关系。
- source_word: וּבָאתֶם בָּהֶם וְהֵם בָּכֶם
  choice: 彼此来往
  rationale: 原文以两个相互对应而省略成分的短语表达双向进入或交往。“彼此来往”保留互惠性，并避免把 בוא ב 过度收窄为身体移动或性关系。
theological_decisions:
- issue: שׁוֹב תָּשׁוּבוּ 的盟约警告含义
  choice: 果真转回去
  alternative: 果真背离
  rationale: 上下文确实警告以色列人逆转忠诚方向，但“背离”把对象和神学判断说得比本句字面更明确；“转回去”保留负面方向及原文张力。
- issue: יֶתֶר 是否使用带神学色彩的“余民”
  choice: 剩下的人
  alternative: 余民
  rationale: 这里的词只是指列国中仍存留的人，并未赋予他们“余民”在某些经文中的救赎性含义，因此采用中性表达。
- issue: בוא ב 的关系范围
  choice: 彼此来往
  alternative: 彼此进入对方中间
  rationale: 紧接“通婚”之后，该习语可指更广泛的社会接触和混合；译作“来往”不将其限定为性关系，同时用脚注保留较贴近形式的理解。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。保留本节作为未完条件句的结尾逗号，以便与下一节的结果分句衔接；避免使用容易预先断定具体教义或性含义的措辞。
