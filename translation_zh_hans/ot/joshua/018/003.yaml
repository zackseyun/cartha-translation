  text: וַ/יֹּ֥אמֶר יְהוֹשֻׁ֖עַ אֶל בְּנֵ֣י יִשְׂרָאֵ֑ל עַד אָ֨נָה֙ אַתֶּ֣ם מִתְרַפִּ֔ים לָ/בוֹא֙ לָ/רֶ֣שֶׁת אֶת הָ/אָ֔רֶץ אֲשֶׁר֙ נָתַ֣ן לָ/כֶ֔ם יְהוָ֖ה אֱלֹהֵ֥י אֲבֽוֹתֵי/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/003.yaml
  text: And Joshua said to the sons of Israel[a], “How long will you be slack about going in to take possession of the land that Yahweh, the God of your fathers, has given you?”
translation:
  language: zh_hans
  text: 约书亚对以色列人[a]说：“你们对于进入并取得雅威——你们祖先的上帝——已经赐给你们的那地，还要懈怠到几时？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“以色列的众子”。
    reason: 保留希伯来语家族性称呼及其字面形式。
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: 希伯来语叙事中的常规推进形式；现代汉语无需机械译出连接词，也能自然承接上文。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 按现代汉语习惯表达该民族群体；脚注保留原文“以色列的众子”这一家族性表述。
- source_word: עַד אָנָה
  choice: 到几时
  rationale: 保留原文责问性的时间问句，同时符合庄重而自然的现代汉语。
- source_word: מִתְרַפִּים
  choice: 懈怠
  rationale: 该词在此表示松懈、迟延、缺乏行动；“懈怠”保留责备意味，又不强化为“懒惰”等更重的道德判断。
- source_word: לָבוֹא לָרֶשֶׁת
  choice: 进去取得
  rationale: 分别表达进入那地和实际取得占有权；避免把 ירשׁ 单独限定为法律意义的“继承”。
- source_word: אֲשֶׁר נָתַן לָכֶם
  choice: 已经赐给你们
  rationale: 完成式把上帝的赐予呈现为已经成就，而百姓实际取得那地仍有待完成。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语音译呈现四字神名，而不以“主”这一称号替代。
- source_word: אֱלֹהֵי אֲבוֹתֵיכֶם
  choice: 你们祖先的上帝
  rationale: 自然表达祖辈与后代之间的圣约关系；“祖先”在现代汉语中比“父亲们”更清楚。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用神名，故正文采用较贴近 Yahweh 的现代音译“雅威”，不以称号“主”替代；“耶和华”虽为传统译名，但反映较早的混合读法。
- issue: 上帝已经赐地与以色列人尚未取得地之间的张力
  choice: 保留“已经赐给”与“进去取得”并置
  alternative: 把赐予改译为尚在进行或未来发生
  rationale: 原文完成式宣告赐地已经成立，同时不消除百姓仍须进入并取得那地的现实责任。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“到几时”保留责问语气；“才”使汉语问句流畅，但不意在额外断定百姓的主观意愿。神名采用“雅威”，上帝称谓采用普通读者易懂的“上帝”。
