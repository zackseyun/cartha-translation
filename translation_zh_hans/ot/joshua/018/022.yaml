    reason: lexical_alternative
lexical_decisions:
- source_word: בֵית הָעֲרָבָה
  choice: 伯亚拉巴
  rationale: 这是城邑名单中的地名，采用现代中文圣经读者较熟悉的音译，不直译其构词含义。
- source_word: צְמָרַיִם
  choice: 洗玛脸
  rationale: 这是专有地名；采用中文圣经传统中通行且可辨识的音译。
- source_word: בֵית אֵל
  choice: 伯特利
  rationale: 这是约书亚记及其他经卷中广为人知的地名，采用中文通行译名，不译作“神的家”。
- source_word: וּ
  choice: 、／和
  rationale: 希伯来语连接词反复连接名单项目；中文用顿号列举，并在末项前用“和”，表达自然且保留并列关系。
