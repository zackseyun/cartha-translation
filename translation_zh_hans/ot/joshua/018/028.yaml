  text: וְ/צֵלַ֡ע הָאֶ֜לֶף וְ/הַ/יְבוּסִ֨י הִ֤יא יְרֽוּשָׁלִַ֨ם֙ גִּבְעַ֣ת קִרְיַ֔ת עָרִ֥ים אַרְבַּֽע עֶשְׂרֵ֖ה וְ/חַצְרֵי/הֶ֑ן זֹ֛את נַֽחֲלַ֥ת בְּנֵֽי בִנְיָמִ֖ן לְ/מִשְׁפְּחֹתָֽ/ם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/028.yaml
  text: Zela[a], Haeleph, the Jebusite (that is, Jerusalem), Gibeath, Kiriath—fourteen cities with their villages[c][b]. This was the inheritance of the sons of Benjamin according to their clans.
translation:
  language: zh_hans
  text: 洗拉、哈以利弗[b]、耶布斯（就是耶路撒冷）[a]、基比亚[b]、基列[c]，共十四座城，以及所属的村庄。这是便雅悯子孙按宗族所得的产业。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译近于“那耶布斯人，这就是耶路撒冷”。这里的族称形式在城邑清单中用作地点名称，指耶路撒冷。
    reason: lexical_alternative
  - marker: b
    text: “哈以利弗”有译本作“以利弗”；“基比亚”所据的希伯来文形式也可转写为“基比押”。
    reason: alternative_reading
  - marker: c
    text: 本节希伯来文本只写“基列”，没有写“基列·耶琳”。
    reason: textual_variant
lexical_decisions:
- source_word: וְצֵלַע
  choice: 洗拉
  rationale: 作为地名音译；采用现代中文圣经中较易辨认的传统译名，不另行解释其可能的词义。
- source_word: הָאֶלֶף
  choice: 哈以利弗
  rationale: 按希伯来文本连同词首形式音译，以区别于省略词首音节的“以利弗”。
- source_word: וְהַיְבוּסִי הִיא יְרוּשָׁלִַם
  choice: 耶布斯人之城（就是耶路撒冷）
  rationale: 原文直译近于“那耶布斯人，就是耶路撒冷”；在城邑清单中，族称实际用作地点称谓。译文补出“之城”使中文可懂，同时用脚注保留原文特殊表达。
- source_word: גִּבְעַת
  choice: 基比亚
  rationale: 作为地名音译；采用中文读者较熟悉的形式，脚注说明此处的具体希伯来形式也可作不同转写。
- source_word: קִרְיַת
  choice: 基列
  rationale: 仅翻译本节实际出现的地名，不从其他经文补入“耶琳”。
- source_word: עָרִים אַרְבַּע עֶשְׂרֵה
  choice: 共十四座城
  rationale: 这是对本段所列城邑总数的总结；“座”符合现代汉语城邑量词习惯。
- source_word: וְחַצְרֵיהֶן
  choice: 以及所属的村庄
  rationale: חָצֵר在分地清单中通常指附属于城邑的村落或无城墙聚落；“所属的村庄”自然表达其依附关系。
- source_word: זֹאת נַחֲלַת
  choice: 这是……所得的产业
  rationale: 原文为无系词的总结公式；中文用现在式“这是”贴近其指示语气，“所得”补足分地语境。
- source_word: בְּנֵי בִנְיָמִן
  choice: 便雅悯子孙
  rationale: 保留“某某之子”的宗族性表达，同时使用自然、传统的中文称法。
- source_word: לְמִשְׁפְּחֹתָם
  choice: 按宗族
  rationale: מִשְׁפָּחָה在支派分地语境中指支派内部的宗族单位，并非仅指核心家庭。
