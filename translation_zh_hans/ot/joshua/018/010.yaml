  text: וַ/יַּשְׁלֵךְ֩ לָ/הֶ֨ם יְהוֹשֻׁ֧עַ גּוֹרָ֛ל בְּ/שִׁלֹ֖ה לִ/פְנֵ֣י יְהוָ֑ה וַ/יְחַלֶּק שָׁ֨ם יְהוֹשֻׁ֧עַ אֶת הָ/אָ֛רֶץ לִ/בְנֵ֥י יִשְׂרָאֵ֖ל כְּ/מַחְלְקֹתָֽ/ם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/010.yaml
  text: Then Joshua cast lots for them at Shiloh before Yahweh[a], and there Joshua divided the land to the sons of Israel according to their divisions.
translation:
  language: zh_hans
  text: 于是，约书亚在示罗、在雅威面前为他们抽签；并在那里照着各自的份额，把土地分给以色列子民[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语直译为“以色列的众子”；这里统指以色列民。
    reason: 说明原文的字面形式及其群体性用法，避免现代读者误以为只指男性。
lexical_decisions:
- source_word: וַיַּשְׁלֵךְ ... גּוֹרָל
  choice: 抽签
  rationale: 这是表示以掣签方式决定分配的希伯来语惯用语；“抽签”在现代汉语中自然明白，也保留了分地程序的含义。
- source_word: בְּשִׁלֹה
  choice: 在示罗
  rationale: 按现代普通话对地点的自然表达，明确这一公开行动发生在示罗。
- source_word: לִפְנֵי יְהוָה
  choice: 在雅威面前
  rationale: 保留“在……面前”的空间和礼仪意味，表明此事是在雅威的临在中进行的；神名 יְהוָה 音译为“雅威”。
- source_word: וַיְחַלֶּק
  choice: 分给
  rationale: 该动词指把土地划分、分配给各方；“把土地分给他们”符合现代汉语习惯，并与前面的抽签相呼应。
- source_word: הָאָרֶץ
  choice: 土地
  rationale: 这里特指正在分配的迦南土地，而非泛指地球或泥土。
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: 以色列子民
  rationale: 希伯来语字面为“以色列的众子”，但在此作为全体以色列人的集体称谓；“以色列子民”既自然，也保留其群体和圣约身份色彩。
- source_word: כְּמַחְלְקֹתָם
  choice: 按照……各自所得的份
  rationale: 该词指划分后所属的分区或份额；此处上下文是抽签分地，用“各自所得的份”比生硬的“各分区”更清楚，同时不把具体划分单位说得过死。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；“雅威”以现代汉语常见音译保留这一专名，不以称号替代。
- issue: 抽签与神圣临在的关系
  choice: 在雅威面前为他们抽签
  alternative: 由雅威为他们决定
  rationale: 原文只说明抽签是在雅威面前进行，并未直接把动作改写成雅威亲自作出决定；译文保留这种表达上的界限。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。“于是”承接叙事；以并列结构保留原文两个连续动作。“各自所得的份”表达分配语境，同时避免使用现代行政色彩过强的术语。脚注标记置于其实际解释的“以色列子民”之后。
