  text: Then it passed on to the shoulder opposite the Arabah on the north[b][a], and went down to the Arabah.
translation:
  language: zh_hans
  text: 边界又延伸到亚拉巴北面、与亚拉巴相对的山肩[b][a]，再下到亚拉巴。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “亚拉巴”也可译作“平原”；这个希伯来词既可作地名，也可泛指一种地貌。
    reason: lexical_alternative
  - marker: b
    text: 原文作“肩”，是地形比喻，可指山坡、山脊侧面或高地边缘。
    reason: cultural_note
lexical_decisions:
- source_word: וְעָבַר
  choice: 边界又延伸到
  rationale: 在地界描述中，该动词表示界线继续通往下一处地点。补出“边界”使现代汉语表意清楚，“延伸”也保留界线行进的意象。
- source_word: אֶל
  choice: 到
  rationale: 表达界线朝向并抵达下一地貌标志的方向关系。
- source_word: כֶּתֶף
  choice: 山肩
  rationale: 原义为“肩”，在地形语境中比喻山坡、山脊侧面或高地边缘；“山肩”既保留原文意象，也符合现代汉语地理表达。
- source_word: מוּל
  choice: 与它相对的
  rationale: 准确表达该山肩与亚拉巴之间面对或相对的位置关系；代词“它”明确回指亚拉巴。
- source_word: הָעֲרָבָה
  choice: 亚拉巴
  rationale: 此处可指称特定区域，也可能作为普通地形词使用。正文音译为地名“亚拉巴”，并以脚注保留“旷野平原”的词义可能。
- source_word: צָפֹנָה
  choice: 北面
  rationale: 这里较自然地说明山肩位于亚拉巴北侧，而非表示界线向北移动。
- source_word: וְיָרַד
  choice: 再下到
  rationale: 表示界线随地势下降；“再”自然承接前一段界线行程。
- source_word: הָעֲרָבָתָה
  choice: 到亚拉巴
  rationale: 词尾的方向形式表示朝亚拉巴而去；汉语用“到”简洁表达这一方向。
