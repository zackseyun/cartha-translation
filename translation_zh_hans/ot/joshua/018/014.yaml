  to: 边界又延伸，转向西面；它从伯和仑南面的那座山向南延伸，终点在基列·巴力，就是基列·耶琳——犹大子孙[a]的一座城。这是西面的边界。
  rationale: 将不自然的“划过”改为“延伸”，并将“绕到”改为“转向”，以更准确、清楚地呈现疆界叙述中的两个连续动作。保留“伯和仑南面的那座山”这一地理关系，未对原文较简略的空间表述作超出文本的推断；将“属于犹大子孙”调整为“犹大子孙的一座城”，更贴近原文的名词性同位表达。
