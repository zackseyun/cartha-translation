base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/014.yaml
  text: Then the border curved and turned on the west side southward from the mountain that faces Beth-horon on the south[a], and its end was at Kiriath-baal (that is, Kiriath-jearim), a city of the sons of Judah. This was the western side.
translation:
  language: zh_hans
  text: 边界又延伸，转向西面；它从伯和仑南面的那座山向南延伸，终点在基列·巴力，就是基列·耶琳——犹大子孙[a]的一座城。这是西面的边界。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “犹大子孙”是指犹大支派的人，即犹大的后裔，并非只指男性。
    reason: 说明希伯来语支派称谓“犹大子孙”的群体含义，避免现代读者误解为仅指男性。
lexical_decisions:
- source_word: וְתָאַר הַגְּבוּל וְנָסַב
  choice: 边界又划过，绕到
  rationale: תאר在疆界描述中指界线被划出或沿途延展，נסב表示转向或绕行；合译既保留两个动作，也符合现代汉语的地理叙述。
- source_word: לִפְאַת יָם נֶגְבָּה
  choice: 到西边……向南延伸
  rationale: ים在疆界套语中指西方，פאה指一侧；方向词נגבה表示向南。这样清楚表达界线在西侧朝南行进。
- source_word: מִן הָהָר אֲשֶׁר עַל־פְּנֵי בֵית חֹרוֹן נֶגְבָּה
  choice: 从伯和仑南面那座山
  rationale: 按地理关系理解第二个נגבה：该山位于伯和仑南面；על־פני表达相对、面对的位置。此译避免把方向误解为伯和仑自身朝南。
- source_word: וְהָיָה תֹצְאֹתָיו
  choice: 终点是
  rationale: 疆界语境中的תוצאות指界线伸展所到之处，即终点；现代汉语用单数“终点”最自然。
- source_word: קִרְיַת בַּעַל הִיא קִרְיַת יְעָרִים
  choice: 基列·巴力（就是基列·耶琳）
  rationale: 保留两个地名，并用括注表达原文对同一城邑的异名认定。
- source_word: עִיר בְּנֵי יְהוּדָה
  choice: 这城属于犹大子孙
  rationale: 保留בני的亲属—支派表达“子孙”，同时以“属于”明确其地域归属含义。
- source_word: זֹאת פְּאַת יָם
  choice: 这是西面的边界
  rationale: פאה本义为边、侧；在分地疆界总结句中译作“西面的边界”清楚自然。
theological_decisions: []
