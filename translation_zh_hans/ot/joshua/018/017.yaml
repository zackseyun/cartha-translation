base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/017.yaml
  text: Then it curved northward and went out to En-shemesh[a], and went out to Geliloth, which is opposite the Ascent of Adummim[c][b], and it went down to the stone of Bohan son of Reuben.
translation:
  language: zh_hans
  text: 边界向北转向[d]，通到隐示麦[a]，又通到基利绿[b]；那里在亚都冥坡[c]的对面；又下到流便之子波罕的石头。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “隐示麦”意为“太阳之泉”；正文按地名音译。
    reason: lexical_alternative
  - marker: b
    text: “基利绿”也可按普通词义理解为“环圈”或“区域”；这里按地名处理。
    reason: lexical_alternative
  - marker: c
    text: 或译“亚都冥隘口”。
    reason: lexical_alternative
  - marker: d
    text: “向北转向”也可理解为“从北边延伸”。
    reason: textual_ambiguity
lexical_decisions:
- source_word: וְתָאַר
  choice: 边界转向
  rationale: 该动词在疆界描述中表示勾画、延展或转折边界线；结合后面的方向语，译为“边界转向”自然地表达路线改变，同时不把它误解为人为划界的动作。
- source_word: מִצָּפוֹן
  choice: 北面
  rationale: 在连续描述边界走向的语境中，按方向理解最为顺畅；原文介词也可能表示“从北边”，因此以脚注保留这一语法歧义。
- source_word: וְיָצָא
  choice: 通到
  rationale: 该词在疆界程式中描写边界线向前伸展并抵达某处；“通到”比逐字译作“出去”更符合现代汉语地理叙述，同时保留连续行进的意味。
- source_word: עֵין שֶׁמֶשׁ
  choice: 隐示麦
  rationale: 按地名音译，并沿用中文圣经读者较熟悉的形式；其普通词义另见脚注。
- source_word: גְּלִילוֹת
  choice: 基利绿
  rationale: 此处作地名，故采用音译，不在正文中译成其可能的普通名词含义。
- source_word: נֹכַח
  choice: 对面的地方
  rationale: 清楚表达两个地标彼此相对的空间关系；“地方”使整句现代汉语更顺畅，并未增加新的地理实体。
- source_word: מַעֲלֵה אֲדֻמִּים
  choice: 亚都冥坡
  rationale: מַעֲלֵה 指向上的坡道或山口；“坡”简明表达地势，亚都冥保留为音译地名。
- source_word: וְיָרַד
  choice: 再下到
  rationale: 表示边界顺地势向下延伸；“再”衔接前面连续的路线动作，符合自然汉语。
- source_word: אֶבֶן בֹּהַן בֶּן רְאוּבֵן
  choice: 流便之子波罕的磐石
  rationale: 按原文连属结构，将该地标理解为以波罕命名的石头，并保留“流便之子”这一身份说明；“磐石”体现其作为显著界标的性质。
