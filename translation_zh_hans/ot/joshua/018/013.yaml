base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/013.yaml
  text: From there the border passed to Luz[a], to the southern slope of Luz (that is, Bethel), and the border went down to Atroth-addar[c][b], on the mountain that is south of Lower Beth-horon.
translation:
  language: zh_hans
  text: 边界从那里经过路斯[a]，到路斯南面的山坡[b]（路斯就是伯特利），又下到亚他录·亚达[c]；这地方在下伯和仑以南的那座山上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里说明路斯就是伯特利。
    reason: cross_reference
  - marker: b
    text: 或译：“到路斯南面的山肩”；希伯来语使用身体部位“肩”来表示山的一侧或山坡。
    reason: lexical_alternative
  - marker: c
    text: “亚他录·亚达”也可音译为“亚塔录·亚达”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָבַר הַגְּבוּל
  choice: 边界……经过
  rationale: 符合约书亚记划界叙述的表达；把边界拟人化为移动的线，既贴近原文，也符合现代汉语习惯。
- source_word: לוּזָה
  choice: 路斯
  rationale: 采用该地名在中文圣经传统中的通行音译；希伯来语表方向的词尾由语境中的“经过”表达。
- source_word: אֶל כֶּתֶף לוּזָה נֶגְבָּה
  choice: 到路斯南面的山坡
  rationale: כֶּתֶף 字面为“肩”，用于地形时指山侧或山坡；译作“山坡”自然清楚，同时保留“南面”的方位信息。
- source_word: הִיא בֵּית אֵל
  choice: 路斯就是伯特利
  rationale: 原文代词所指可由上下文认定为路斯；明说地名可避免汉语代词含混，并保留原文的同地异名说明。
- source_word: וְיָרַד הַגְּבוּל
  choice: 又下到
  rationale: 保留原文描述地势下降的空间意象，也符合边界走向的叙述语体。
- source_word: עַטְרוֹת אַדָּר
  choice: 亚他绿·亚达
  rationale: 按希伯来语复合地名音译，以间隔号显示两个组成部分；“亚他绿”也承接较熟悉的中文专名传统。
- source_word: עַל הָהָר
  choice: 到达……那座山上
  rationale: 原文指一座特定的山；结合前面的运动动词，用“到达……山上”表达边界所至位置，避免误解为泛指山区。
- source_word: מִנֶּגֶב לְבֵית חֹרוֹן תַּחְתּוֹן
  choice: 下伯和仑以南
  rationale: 准确表达相对方位；תַּחְתּוֹן 作为地名限定语译为“下”，形成自然的中文地名“下伯和仑”。
