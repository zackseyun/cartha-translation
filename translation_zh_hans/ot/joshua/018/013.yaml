  to: 边界从那里经过路斯[a]，到路斯南面的山坡[b]（路斯就是伯特利），又下到亚他录·亚达[c]；这地方在下伯和仑以南的那座山上。
  rationale: 修订末句，以明确“在下伯和仑以南的那座山上”是亚他录·亚达的位置说明，而不是边界继而到达的另一目的地；同时将该地名统一为较通行的“亚他录·亚达”。其余地界、方位、同地异名说明及脚注锚点均予保留。
