  source_fidelity: 原文先说边界从那里转向路斯，至路斯南面的山侧，并说明路斯即伯特利；随后边界下至亚他录·亚达。最后的“在下伯和仑以南的那座山上”修饰亚他录·亚达的所在地。草稿将其处理为继“下到亚他绿·亚达”之后再“到达……山上”的连续动作，容易改变这一句法关系。
