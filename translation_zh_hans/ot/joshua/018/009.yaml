base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/009.yaml
  text: So the men went and passed through the land[a], and they wrote it down by cities in seven portions in a book[b], and they came to Joshua at the camp in Shiloh.
translation:
  language: zh_hans
  text: 这些人就出发，走遍那地，把那地按城邑分为七份，记在书卷上[a]。随后，他们来到示罗营地的约书亚那里。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “书卷”或译“文书”；希伯来语指书面记录，古时通常写在卷轴上。
    reason: cultural_note
lexical_decisions:
- source_word: וַיֵּלְכוּ הָאֲנָשִׁים
  choice: 这些人就出发
  rationale: הלך在叙事链中表示受命的人开始行动；“出发”比单纯“去”更自然，也没有增添目的地信息。“这些人”承接上文已受委派的男性代表。
- source_word: וַיַּעַבְרוּ בָאָרֶץ
  choice: 走遍那地
  rationale: עבר加ב在这里指为勘察而穿行该地；“走遍”自然表达他们遍历土地的行动。
- source_word: וַיִּכְתְּבוּהָ
  choice: 将那地……记在
  rationale: 动词后的阴性单数词尾回指“那地”；中文用“记在”表达把勘察所得写成记录。
- source_word: לֶעָרִים
  choice: 按各城
  rationale: ל在此表示记录或划分的组织依据，即以各城为单位；“按各城”简洁保留这一意义。
- source_word: לְשִׁבְעָה חֲלָקִים
  choice: 分成七份
  rationale: חֲלָקִים指部分或区份；上下文是土地分配，因此“分成七份”准确而不预先指定最终归属。
- source_word: עַל סֵפֶר
  choice: 记在册子上
  rationale: סֵפֶר可指书卷、册子或书面文书；“册子”适合古代书面记录，又比现代装订“书本”更少误导。
- source_word: וַיָּבֹאוּ אֶל יְהוֹשֻׁעַ אֶל הַמַּחֲנֶה שִׁלֹה
  choice: 他们来到示罗的营地，见约书亚
  rationale: 原文直陈他们来到约书亚那里，并以示罗的营地说明地点；中文调整语序以避免连续使用“来到……来到……”，且不把“来到”强化为“返回”。
theological_decisions: []
