base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/012.yaml
  text: Their border on the north side was from the Jordan[a], and the border went up to the northern slope of Jericho, then went up into the hill country westward[b], and its end was at the wilderness of Beth-aven.
translation:
  language: zh_hans
  text: 他们北面的边界从约旦河起；边界向上延伸到耶利哥北面的山坡[a]，再向西上入山地，尽头[b]在伯亚文的旷野。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “山坡”原文直译为“肩”，是表示某地侧面或坡地的地理用语。
    reason: lexical_alternative
  - marker: b
    text: “尽头”原文为复数，也可译作“末端”或“出口”；这是描述边界终点的地形用语。
    reason: lexical_alternative
lexical_decisions:
- source_word: לִפְאַת צָפוֹנָה
  choice: 北面
  rationale: פאה可指一侧、边缘或区域；在划界语境中译为“北面”自然准确，也保留其方位功能。
- source_word: הַגְּבוּל
  choice: 边界
  rationale: גְּבוּל在土地分配和疆界描述中指边界线；“边界”符合现代汉语地理表达。
- source_word: מִן הַיַּרְדֵּן
  choice: 从约旦河起
  rationale: מן表示起点；中文通常将该河名完整译作“约旦河”，加“起”可清楚表达边界由此开始。
- source_word: וְעָלָה
  choice: 向上延伸／上到
  rationale: עלה在地形边界描述中表示向较高处行进；按中文搭配分别译为“向上延伸”和“上到”，保留地势上升的意象。
- source_word: אֶל כֶּתֶף יְרִיחוֹ מִצָּפוֹן
  choice: 到耶利哥北面的山坡
  rationale: כֶּתֶף本义为“肩”，地理用法指侧面或坡地；מִצָּפוֹן说明该处位于耶利哥北面。
- source_word: בָהָר יָמָּה
  choice: 向西上到山地
  rationale: הָר在此可集合性地指山区或山地，יָמָּה是“向西”；此译既保留方向，也符合边界线随地势上升的语境。
- source_word: תֹּצְאֹתָיו
  choice: 尽头
  rationale: 该复数形式是划界文本中的地形术语，可指边界的出口、末端或终点；中文用单数概念“尽头”最自然，同时以脚注保留形式上的多义性。
- source_word: מִדְבַּרָה בֵּית אָוֶן
  choice: 在伯亚文的旷野
  rationale: 方向词尾与前面的终点表达结合，指出边界终于伯亚文旷野；“伯亚文”按地名音译处理。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。以分号划分起点和边界走向，减少重复造成的生硬感；保留“向上”“上到”的地势信息，并将两个脚注标在其实际解释的词语之后。
