  yaml_path: translation/ot/joshua/018/024.yaml
  text: 'And Chephar-ammoni[a], Ophni, and Geba: twelve cities with their villages.'
translation:
  language: zh_hans
  text: 基法阿摩尼[a]、俄弗尼和迦巴，共十二座城，连同属这些城的村庄。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “基法阿摩尼”也可音译作“基法·哈阿摩尼”等；这个地名的字面意思可能是“亚扪人的村庄”。
    reason: 说明专名音译形式及其可能的字面构成，同时不把不确定的词源直接写入正文。
lexical_decisions:
- source_word: כְפַר העמני
  choice: 基法阿摩尼
  rationale: 这是地名，采用中文圣经语境中自然、可辨识的音译，不按可能的字面意义“亚扪人的村庄”翻译；希伯来语形式中的定冠词在固定地名内不另行译出。
- source_word: הָעָפְנִי
  choice: 俄弗尼
  rationale: 作为城邑名单中的专名音译；词首定冠词视为地名形式的一部分，不单独翻译。
- source_word: גָבַע
  choice: 迦巴
  rationale: 此处明显是便雅悯境内的地名，故采用专名音译，而不译作普通名词“山丘”。
- source_word: עָרִים
  choice: 城
  rationale: 在土地分配的城邑名单中指有组织的聚居地；“城”既保留正式语体，也符合“十二座”的现代汉语搭配。
- source_word: שְׁתֵּים עֶשְׂרֵה
  choice: 十二
  rationale: 按原文直译基数。
- source_word: חַצְרֵיהֶן
  choice: 属这些城的村庄
  rationale: 指附属于所列城邑的乡村或无城墙的小聚落；如此表达也明确保留阴性复数代词后缀与“城”的对应关系。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而简洁的城邑名单语体。省去句首连接词的机械翻译，使本节作为名单续项在中文中自然；用“连同”准确表达各城及其附属村庄的关系。
