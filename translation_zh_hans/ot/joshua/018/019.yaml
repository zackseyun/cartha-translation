revisions:
- from: 边界又延伸到伯曷拉北面的山坡[a]，终止于盐海北端的舌状水湾[b]，就是约旦河的南端。以上是南界。盐海又称死海[c]。
  to: 边界又延伸到伯曷拉北边的山坡[a]；边界的终点在盐海[c]北边的舌状水湾[b]，即约旦河的南端。这是南界。
  rationale: 修订将“北端”改为“北边”，以准确保留希伯来文对盐海北部舌状地貌的定位；同时保留“舌”的具体意象及其地理语境。将“约旦河的南端”明确作前项地点的同位说明，并把“死海”作为替代名称移至相应脚注，避免增添正文内容。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T05:21:16Z'
