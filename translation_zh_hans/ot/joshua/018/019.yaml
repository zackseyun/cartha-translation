  text: וְ/עָבַ֨ר הַ/גְּב֜וּל אֶל כֶּ֣תֶף בֵּית חָגְלָה֮ צָפוֹנָ/ה֒ ו/היה תצאותי/ו הַ/גְּב֗וּל אֶל לְשׁ֤וֹן יָם הַ/מֶּ֨לַח֙ צָפ֔וֹנָ/ה אֶל קְצֵ֥ה הַ/יַּרְדֵּ֖ן נֶ֑גְבָּ/ה זֶ֖ה גְּב֥וּל נֶֽגֶב־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/019.yaml
  text: Then the border passed to the northern shoulder of Beth-hoglah[a], and the border ended at the northern tongue of the Salt Sea, at the southern end of the Jordan[b]. This is the southern border.
translation:
  language: zh_hans
  text: 边界又延伸到伯曷拉北边的山坡[a]；边界的终点在盐海[c]北边的舌状水湾[b]，即约旦河的南端。这是南界。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “山坡”原文直译为“肩”，是指一地的侧面、坡地或山麓的地理用语。
    reason: lexical_alternative
  - marker: b
    text: “舌状水湾”原文直译为“盐海的舌”；这是描述舌状伸展地貌的地理用语，可指水湾、岬角或类似的舌状地形。
    reason: lexical_alternative
  - marker: c
    text: “盐海”就是通常所称的死海；原文作“盐海”。
    reason: alternative_reading
lexical_decisions:
- source_word: וְעָבַר הַגְּבוּל
  choice: 边界又延伸到
  rationale: עָבַר在疆界描述中表示界线继续经过或延伸；“又延伸到”既符合连续的地理叙述，也比直译“越过”自然。
- source_word: כֶּתֶף
  choice: 山坡
  rationale: 该词本义为“肩”，用于地理时指一地的侧面、坡地或山麓；“山坡”在现代汉语中清楚自然，脚注保留其字面意象。
- source_word: בֵּית חָגְלָה
  choice: 伯曷拉
  rationale: 作为地名音译，采用简洁、常见的现代中文圣经地名形式。
- source_word: תצאותיו הַגְּבוּל
  choice: 终止于
  rationale: 马所拉文本所指为边界的出口、尽头或终点；在划界语境中译作“终止于”准确而流畅。
- source_word: לְשׁוֹן יָם הַמֶּלַח
  choice: 盐海……的舌状水湾
  rationale: לָשׁוֹן本义“舌头”，在地理语境中指舌状伸展的水域或岸形；“舌状水湾”既保留原文形象，又使现代读者明白其地貌含义。
- source_word: צָפוֹנָה
  choice: 北端
  rationale: 此处说明盐海该处水湾位于北边；结合下文约旦河南端，译为“北端”清楚表达其相对方位。
- source_word: יָם הַמֶּלַח
  choice: 盐海
  rationale: 按原文保留正式名称“盐海”，不在正文中直接以现代通称“死海”替代。
- source_word: אֶל קְצֵה הַיַּרְדֵּן נֶגְבָּה
  choice: 就是约旦河的南端
  rationale: קָצֶה指末端，נֶגְבָּה标明南方；“约旦河的南端”准确指向约旦河注入盐海之处。“就是”自然表达同一地理终点的进一步说明。
- source_word: זֶה גְּבוּל נֶגֶב
  choice: 以上是南界
  rationale: נֶגֶב在此按方向理解为南面，不作专名“南地”；“以上是南界”符合中文对前述边界线的总结方式。
