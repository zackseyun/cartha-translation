base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/008.yaml
  text: So the men arose and went[a], and Joshua commanded those who were going to write down the land, saying, “Go and walk through the land, and write it down, and return to me; and here I will cast lots for you before Yahweh in Shiloh.”
translation:
  language: zh_hans
  text: 于是，那些人起身去了。约书亚吩咐那些要去记录那地的人说：“你们去，走遍那地，把那地的情况记录下来[a]，再回到我这里。我会在示罗这里，在耶和华面前为你们抽签。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译“写那地”，指为分配土地而以文字记录或描述那地。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֻמוּ הָאֲנָשִׁים וַיֵּלֵכוּ
  choice: 于是，那些人起身去了
  rationale: 保留连续叙事动作及“起身”的希伯来叙事节奏；“那些人”在上下文中自然指受命勘察土地的男性代表。
- source_word: וַיְצַו יְהוֹשֻׁעַ
  choice: 约书亚吩咐
  rationale: צוה 表示带有权柄的指令；现代汉语圣经叙事中“吩咐”庄重自然，也充分体现命令意味。
- source_word: לִכְתֹּב אֶת־הָאָרֶץ
  choice: 记录那地
  rationale: 希伯来文直译为“写那地”，语境指为分地而把土地状况写下来；“记录那地”保留“书写”的核心，又避免汉语直译生硬。
- source_word: וְהִתְהַלְּכוּ בָאָרֶץ
  choice: 走遍那地
  rationale: התהלך 在此表示在境内往来察看、遍行；“走遍”简洁体现勘察所需的周遍行动。
- source_word: וְכִתְבוּ אוֹתָהּ
  choice: 把那地的情况记录下来
  rationale: 宾语代词回指“那地”；汉语补出“情况”以表达实际语义，即形成书面土地描述，而非把土地本身写下来。
- source_word: וְשׁוּבוּ אֵלַי
  choice: 再回到我这里
  rationale: 准确表达 שוב 的返回含义；“再”自然连接勘察、记录和复命的行动次序。
- source_word: אַשְׁלִיךְ לָכֶם גּוֹרָל
  choice: 为你们抽签分地
  rationale: 字面为“为你们掷签”；本段语境中的签用于分配产业。“抽签分地”是现代汉语易懂的功能性表达。
- source_word: בְשִׁלֹה
  choice: 在示罗这里
  rationale: 兼顾 וּפֹה“这里”与地点“示罗”，清楚表明约书亚将于当前所在地执行抽签。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 中文圣经传统及普通读者最熟悉的专名形式是“耶和华”；它作为专名保留了原文四字神名的指称，不改译为泛称“主”。
- issue: “在耶和华面前”与抽签的关系
  choice: 在耶和华面前为你们抽签分地
  alternative: 替你们在耶和华面前拈阄
  rationale: 保留 לִפְנֵי יְהוָה，明确分地程序是在神面前进行；不额外说明其神学机制，以免超出原文。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。“记录那地的情况”和“抽签分地”适度显明上下文功能，同时不加入技术性测绘概念。原文神名以中文通行专名“耶和华”呈现。
