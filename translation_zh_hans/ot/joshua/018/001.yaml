  text: וַ/יִּקָּ֨הֲל֜וּ כָּל עֲדַ֤ת בְּנֵֽי יִשְׂרָאֵל֙ שִׁלֹ֔ה וַ/יַּשְׁכִּ֥ינוּ שָׁ֖ם אֶת אֹ֣הֶל מוֹעֵ֑ד וְ/הָ/אָ֥רֶץ נִכְבְּשָׁ֖ה לִ/פְנֵי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/001.yaml
  text: Then the whole congregation of the sons of Israel assembled at Shiloh and set up the tent of meeting there[b][a], and the land was subdued before them.
translation:
  language: zh_hans
  text: 以色列人[a]的全体会众聚集在示罗；他们在那里设立了会幕。那地已在他们面前被制伏了[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译“以色列众子”；也可译“以色列子民”。
    reason: 说明原文群体称谓的字面形式及可行译法。
  - marker: b
    text: 或译：“那地已在他们面前被征服了。”
    reason: 提供נִכְבְּשָׁה较强的可行译法，同时保留其语义幅度。
lexical_decisions:
- source_word: וַיִּקָּהֲלוּ
  choice: 聚集
  rationale: 该词为קהל的尼法勒式，表示作为群体集合；“聚集”自然清楚，也保留会众共同集结的含义。
- source_word: כָּל עֲדַת בְּנֵי יִשְׂרָאֵל
  choice: 以色列人全会众
  rationale: “全会众”同时表达כָּל和עֲדַת的整体、群体意义；“以色列人”是现代汉语对בְּנֵי יִשְׂרָאֵל自然且不排除群体成员的表达，并以脚注注明其字面形式。
- source_word: שִׁלֹה
  choice: 示罗
  rationale: 采用现代中文圣经中通行且易于辨认的地名译法。
- source_word: וַיַּשְׁכִּינוּ
  choice: 设立
  rationale: 该词是שׁכן的使役形，字面有“使……居住”之意；以会幕为宾语时，“设立”比生硬的直译更符合汉语，也能表达会幕在示罗安置就位，而不只强调搭起帐篷布料。
- source_word: אֹהֶל מוֹעֵד
  choice: 会幕
  rationale: “会幕”是简洁、庄重且广为理解的通行译名，指供相会之用的帐幕。
- source_word: נִכְבְּשָׁה
  choice: 被制伏了
  rationale: 该词是כבשׁ的被动式，表示土地已处于被压服、受控制的状态；“被制伏”保留结果性和被动语态，又不必暗示每一处土地都已完全占领。
- source_word: לִפְנֵיהֶם
  choice: 在他们面前
  rationale: 保留希伯来语“在他们面前”的空间性习语，让上下文表达那地在以色列人面前已被制伏，而不额外解释为其他关系。
theological_decisions:
- issue: 以色列群体称谓
  choice: 以色列人
  alternative: 以色列众子／以色列子民
  rationale: 希伯来文形式为阳性复数“以色列的众子”，在此是整个盟约群体的惯用称呼。正文采用现代汉语自然的“以色列人”，脚注保留字面形式，既不把所指范围缩窄为只有男性，也不隐去原文表达。
- issue: נִכְבְּשָׁה所表达的征服程度
  choice: 那地已经在他们面前被制伏了
  alternative: 那地已经在他们面前被征服了
  rationale: 被动动词明确宣告土地已受压服、控制，但约书亚记后文仍提到尚待取得的地区。“被制伏”保留原文张力，不将此处解释成每一地区均已完全占领。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“全会众都聚集”自然呈现全体共同集结；“设立会幕”兼顾汉语习惯和该行动的制度性含义。句号分开两个相连事件，使经文清楚流畅；脚注标记均紧随所说明的词句。
