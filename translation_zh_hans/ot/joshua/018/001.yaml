  naturalness: “以色列人全会众都聚集到示罗”在现代汉语中略显生硬，且“聚集在示罗”比“聚集到示罗”更贴合正式集合已发生的叙述。“他们在那里设立了会幕”使连续动作的主语在汉语中明确、顺畅。
  terminology: “示罗”和“会幕”均为现代中文圣经语境中通行、庄重的译名。“被制伏”恰当保留נִכְבְּשָׁה的被动及受制状态，不把它不必要地扩展为彻底占领。“以色列人”可作自然的正文群体称谓，脚注保留“以色列众子”的字面表达。
