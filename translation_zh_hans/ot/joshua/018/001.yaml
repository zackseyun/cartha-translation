- from: 以色列人[a]全会众都聚集到示罗，在那里设立会幕。那地已经在他们面前被制伏了[b]。
  to: 以色列人[a]的全体会众聚集在示罗；他们在那里设立了会幕。那地已在他们面前被制伏了[b]。
  rationale: 修订仅改善中文句法和叙事流畅度：以“以色列人的全体会众”准确对应原文所属构造，以“聚集在”对应集合地点，并明确第二动作的承接主语。保留“会幕”“示罗”“被制伏”及两个脚注的原有翻译取向和锚点，不改变经文意义或引入解释性神学结论。
