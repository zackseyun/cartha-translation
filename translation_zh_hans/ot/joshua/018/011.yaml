base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/011.yaml
  text: And the lot for the tribe of the sons of Benjamin[a], by their clans, came up[b], and the territory of their lot came out between the sons of Judah and the sons of Joseph.
translation:
  language: zh_hans
  text: 便雅悯子孙支派按着宗族所拈的阄抽出来了；他们拈阄所得之地的边界在犹大子孙和约瑟子孙之间。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “约瑟子孙”在这里统指约瑟后裔所形成的支派，主要是以法莲支派和玛拿西支派。
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעַל גּוֹרָל
  choice: 抽出的签上来了
  rationale: 保留 עלה“上来”的具体意象，同时用“抽出的签”点明拈阄分地的语境，避免仅译作“抽中了”而消去原文形象。
- source_word: מַטֵּה בְנֵי בִנְיָמִן
  choice: 便雅悯子孙的支派
  rationale: מַטֵּה 在此指支派；保留“子孙”的亲属表达，措辞庄重且容易理解。
- source_word: לְמִשְׁפְּחֹתָם
  choice: 按着宗族
  rationale: מִשְׁפָּחוֹת 指支派内部的宗族单位；“宗族”比泛指家庭的“家族”更准确。
- source_word: גְּבוּל גּוֹרָלָם
  choice: 他们拈阄所得之地的边界
  rationale: גְּבוּל 的基本义是边界；גּוֹרָל 在此也指拈阄所得的份。此译兼顾边界线和所分土地，避免生硬的“他们之签的边界”。
- source_word: וַיֵּצֵא
  choice: 落在
  rationale: 直译可作“出来”，但中文谈论分地结果及其位置时，“落在……之间”更自然，并保留分配结果显出的语义。
- source_word: בֵּין בְּנֵי יְהוּדָה וּבֵין בְּנֵי יוֹסֵף
  choice: 在犹大子孙和约瑟子孙之间
  rationale: 准确表达配对介词“在……和……之间”，并保留两处“子孙”的希伯来亲属称谓。
theological_decisions:
- issue: “约瑟子孙”的群体所指
  choice: 正文保留“约瑟子孙”，脚注说明其为约瑟后裔的支派
  alternative: 直接译为“以法莲和玛拿西支派”
  rationale: 原文使用概括性的亲属称谓，不宜在正文中将其无提示地具体化；脚注提供历史地理背景而不改写原文。
translation_notes:
  register: 采用现代、庄重而可理解的经文语体。“拈阄”保留古代分地方式，“抽出的签上来了”保留原文动词的具体形象；以分号呈现两个紧密相连的叙事分句。
