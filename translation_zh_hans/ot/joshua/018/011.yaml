- from: 便雅悯子孙的支派，按着宗族，抽出的签上来了；他们拈阄所得之地的边界，落在犹大子孙和约瑟子孙之间。[a]
  to: 便雅悯子孙支派按着宗族所拈的阄抽出来了；他们拈阄所得之地的边界在犹大子孙和约瑟子孙之间。[a]
