base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/015.yaml
  text: And the southern side was from the edge of Kiriath-jearim[b][a], and the border went out westward and went out to the spring of the waters of Nephtoah.
translation:
  language: zh_hans
  text: 南面的边界从基列·耶琳的边缘起；边界向西延伸[a]，又延伸到尼弗多亚水泉[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “向西”原文直译为“向海”；在这里的地理语境中指向西。
    reason: lexical_alternative
  - marker: b
    text: “尼弗多亚水泉”原文较直译为“尼弗多亚之水的泉”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפְאַת נֶגְבָּה
  choice: 南边
  rationale: פֵאָה指一侧或边缘，与נֶגְבָּה合用，在疆界描述中自然译为“南边”。
- source_word: מִקְצֵה
  choice: 从……的边缘起
  rationale: קָצֶה表示尽头、边缘；加“起”清楚表达这段疆界的起点。
- source_word: קִרְיַת יְעָרִים
  choice: 基列·耶琳
  rationale: 按希伯来语地名音译，并用间隔号标明复合名称。
- source_word: וְיָצָא הַגְּבוּל
  choice: 边界……延伸
  rationale: יָצָא字面为“出去”，在划界套语中描述界线伸展；“延伸”更符合现代汉语地理叙述。
- source_word: יָמָּה
  choice: 向西
  rationale: 该词字面与“海”有关，在以色列地理语境中通常表示朝地中海方向，即“向西”。
- source_word: וְיָצָא אֶל
  choice: 直到
  rationale: 第二个יָצָא与אֶל共同标示界线伸展至下一地点；汉语用“直到”可自然表达终点，同时避免重复“延伸”。
- source_word: מַעְיַן מֵי נֶפְתּוֹחַ
  choice: 尼弗多亚水泉
  rationale: מַעְיַן是泉，מֵי是“水”的复数构词形式；正文用自然而仍保留“水”要素的“水泉”，脚注说明较直译的结构。
