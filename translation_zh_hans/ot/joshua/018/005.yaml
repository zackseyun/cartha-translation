base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/005.yaml
  text: And they shall divide it into seven portions. Judah shall remain at its border on the south[a], and the house of Joseph shall remain at their border on the north.
translation:
  language: zh_hans
  text: 他们要把那地分成七份。犹大要留在南方自己的疆界上[a]，约瑟家要留在北方自己的疆界上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “留在”直译为“站在”；这里可能指犹大和约瑟家各自保持在已有的疆界上。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִתְחַלְּקוּ אֹתָהּ
  choice: 他们要把那地分成
  rationale: התפעל式的 חלק 在此指参与分地的人将土地划分；用“他们要把那地分成”既明示希伯来语复数主语，也符合现代汉语表达。
- source_word: לְשִׁבְעָה חֲלָקִים
  choice: 七份
  rationale: חֲלָקִים 在分配土地的语境中指划出的份额；“七份”简洁自然，也保留分地含义。
- source_word: יַעֲמֹד / יַעַמְדוּ
  choice: 要留在
  rationale: עמד 字面义为“站立”，但在此疆域语境中表示保持原位、已有疆界不变；“留在”传达其语用意义，同时以脚注保留字面译法。
- source_word: עַל גְּבוּלוֹ / עַל גְּבוּלָם
  choice: 自己的疆界内
  rationale: גְּבוּל 指疆界或境域；结合 עַל 与本段分地语境，“自己的疆界内”自然表达犹大和约瑟家维持原有地域的意思。
- source_word: מִנֶּגֶב / מִצָּפוֹן
  choice: 在南边 / 在北边
  rationale: 这里的 נֶגֶב 与 צָפוֹן 构成方向上的对应，分别表示南侧和北侧，并非特指尼革地区。
- source_word: וּבֵית יוֹסֵף
  choice: 约瑟家
  rationale: בֵּית יוֹסֵף 是对约瑟后裔诸支派的集体称谓；“约瑟家”保留原文的家族性、群体性表达。
