- from: 他们要把那地分成七份。犹大要留在南边自己的疆界内[a]，约瑟家要留在北边自己的疆界内。
  to: 他们要把那地分成七份。犹大要留在南方自己的疆界上[a]，约瑟家要留在北方自己的疆界上。
  rationale: 将“疆界内”改为“疆界上”，以避免把原文的介词“在……上／处”具体化为“在……以内”。脚注相应改作“保持在已有的疆界上”，使说明与正文及原文定位一致；其余译文无需改动。
