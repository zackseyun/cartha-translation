  yaml_path: translation/ot/joshua/018/002.yaml
  text: But among the sons of Israel there remained seven tribes that had not apportioned their inheritance[a][b].
translation:
  language: zh_hans
  text: 以色列人[a]中还剩下七个支派，尚未划分自己的产业[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语直译为“以色列的众子”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“尚未分配自己的产业”，也可按意思译为：“尚未按分配领受自己的产业。”希伯来语动词既可侧重这些支派参与划分土地，也可在本段语境中侧重产业尚未分给他们。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּוָּתְרוּ
  choice: 还剩下
  rationale: 该词为יתר的尼法勒式连续叙事形态，表示仍有一些留下或尚余；“还剩下”符合现代汉语表达，并保留存留之意。
- source_word: בִּבְנֵי יִשְׂרָאֵל
  choice: 以色列人中
  rationale: 希伯来语直译为“以色列的众子中”；“以色列人中”在现代汉语中自然清楚，直译形式则收入脚注。
- source_word: אֲשֶׁר לֹא חָלְקוּ
  choice: 尚未划分
  rationale: חלק在土地分配语境中可指分开、划分或按份分配。正文采用“划分”以贴近主动语态，同时不把重点过早限定为支派尚未领受所得之地。
- source_word: אֶת נַחֲלָתָם
  choice: 自己的产业
  rationale: נחלה在约书亚记的分地语境中指承受所得的土地份额；“产业”既符合传统圣经用语，也能表达具有承受性质的领地。
- source_word: שִׁבְעָה שְׁבָטִים
  choice: 七个支派
  rationale: 准确表达以色列部族结构中的七个支派，符合现代汉语习惯。
theological_decisions:
- issue: 七个支派与土地划分的关系
  choice: 尚未划分自己的产业
  alternative: 尚未按阄分得自己的产业
  rationale: 希伯来语以七个支派为语法上的主动主体，但上下文也可侧重其产业尚未分配给他们。正文保留主动表达，脚注说明可按结果理解，避免替原文消除张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“以色列人”避免生硬直译，“产业”保留土地承受语境中的圣经表达；“尚未划分”简洁地维持原文主动句式及其可作不同侧重理解的空间。
