base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/020.yaml
  text: And the Jordan formed its border on the east side[a]. This was the inheritance of the sons of Benjamin, according to its borders all around[b], by their clans.
translation:
  language: zh_hans
  text: 约旦河作它东面的边界[a]。这就是便雅悯子孙[b]按着宗族所得的产业，界线环绕四周。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“约旦河是它东面的边界。”希伯来语动词表示约旦河构成这片产业的边界。
    reason: lexical_alternative
  - marker: b
    text: 希伯来语直译为“便雅悯的儿子们”；这里是指便雅悯支派的后裔。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַיַּרְדֵּן
  choice: 约旦河
  rationale: 该专名指约旦河；现代汉语通常加“河”，表达自然清楚。句首连接词在中文中无需机械译出。
- source_word: יִגְבֹּל אֹתוֹ
  choice: 作它的边界
  rationale: גבל在此表示充当领土界线；“它”指便雅悯的产业或地域，保留原文指代。
- source_word: לִפְאַת קֵדְמָה
  choice: 在东面
  rationale: פאה表示一侧，קֵדְמָה表示向东；合译为“在东面”符合现代地理表述。
- source_word: נַחֲלַת
  choice: 所得的产业
  rationale: נחלה指部族分得并承受的土地；“产业”保留土地分配与承受的含义，加“所得的”使汉语句法顺畅。
- source_word: בְּנֵי בִנְיָמִן
  choice: 便雅悯子孙
  rationale: 直译该部族称谓，同时自然表示便雅悯的后裔及其支派。
- source_word: לִגְבוּלֹתֶיהָ סָבִיב
  choice: 四围都有这些界线
  rationale: 原语概括该产业周围已经列明的界线；此译清楚表达环绕其地的边界，不把复数界线简化为单一边界。
- source_word: לְמִשְׁפְּחֹתָם
  choice: 按着宗族
  rationale: מִשְׁפָּחוֹת在部族土地分配语境中指支派内部的宗族群体；“宗族”比泛称“家庭”更准确。
