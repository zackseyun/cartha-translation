  to: 因为利未人在你们中间没有产业份额；耶和华的祭司职分就是他们的产业。[a]迦得、吕便和玛拿西半支派已经在约旦河东岸得了他们的产业，就是耶和华的仆人摩西赐给他们的。
  rationale: 修订仅处理两个可安全校正之处：以“产业份额”较准确地区分חֵלֶק与后文的נַחֲלָה，并以名词性“耶和华的祭司职分”保留כְהֻנַּת יְהוָה的原文表达。保留集体复数“他们的产业”及其脚注，不对单数后缀的具体指向作超出文本的断定。
