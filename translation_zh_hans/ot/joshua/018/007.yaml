source:
  edition: WLC
  text: כִּ֠י אֵֽין חֵ֤לֶק לַ/לְוִיִּם֙ בְּ/קִרְבְּ/כֶ֔ם כִּֽי כְהֻנַּ֥ת יְהוָ֖ה נַחֲלָת֑/וֹ וְ/גָ֡ד וּ/רְאוּבֵ֡ן וַ/חֲצִי֩ שֵׁ֨בֶט הַֽ/מְנַשֶּׁ֜ה לָקְח֣וּ נַחֲלָתָ֗/ם מֵ/עֵ֤בֶר לַ/יַּרְדֵּן֙ מִזְרָ֔חָ/ה אֲשֶׁר֙ נָתַ֣ן לָ/הֶ֔ם מֹשֶׁ֖ה עֶ֥בֶד יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/007.yaml
  text: For there is no portion for the Levites among you[a], because the priesthood of Yahweh is their inheritance. And Gad, Reuben, and the half-tribe of Manasseh have received their inheritance beyond the Jordan eastward, which Moses the servant of Yahweh gave them.
translation:
  language: zh_hans
  text: 因为利未人在你们中间没有产业份额；耶和华的祭司职分就是他们的产业。[a]迦得、吕便和玛拿西半支派已经在约旦河东岸得了他们的产业，就是耶和华的仆人摩西赐给他们的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“他的产业”；这里的单数可能把利未或利未人视为一个整体，所以正文译作“他们的产业”。
    reason: 说明希伯来文单数代词后缀与正文集体复数表达之间的差异。
lexical_decisions:
- source_word: חֵלֶק
  choice: 分得土地
  rationale: 本词指分配所得的份额；上下文具体涉及各支派分地，译为“分得土地”自然清楚，也与后文“产业”有所区分。
- source_word: לַלְוִיִּם
  choice: 利未人
  rationale: 指利未支派这一群体；“利未人”是现代汉语圣经语境中通行且清楚的名称。
- source_word: בְּקִרְבְּכֶם
  choice: 在你们中间
  rationale: 保留原文空间性表达，同时在分配支派土地的语境中自然可懂。
- source_word: כְהֻנַּת יְהוָה
  choice: 侍奉耶和华作祭司
  rationale: כְהֻנָּה可指祭司职分或祭司事奉；动词化表达比“耶和华的祭司职分”更符合现代汉语，同时保留事奉耶和华和祭司身份两层含义。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代汉语中广泛使用的专名“耶和华”呈现四字神名，而不以称号替代。
- source_word: נַחֲלָתוֹ
  choice: 他们的产业
  rationale: 希伯来文为第三人称阳性单数后缀，但所指为作为集体的利未；汉语按集体意义用“他们”更自然，脚注说明原文形式。
- source_word: לָקְחוּ
  choice: 已经……得了
  rationale: 该动词字面可作“拿取”，但在合法领受所分产业的语境中，“得了”避免误解为强夺，并体现完成状态。
- source_word: נַחֲלָתָם
  choice: 他们的产业
  rationale: 指支派承受并持有的世袭土地份额，“产业”简洁地保留土地承受的概念。
- source_word: מֵעֵבֶר לַיַּרְדֵּן מִזְרָחָה
  choice: 在约旦河东边
  rationale: 原文为“约旦河那边，向东”；从叙述地点看即约旦河东岸，合并译法符合现代汉语地理表达。
- source_word: עֶבֶד יְהוָה
  choice: 耶和华的仆人
  rationale: 这是摩西的尊荣性盟约称谓；“仆人”比“奴隶”更切合此处语用。
theological_decisions:
- issue: כְהֻנַּת יְהוָה所指是制度、职分还是事奉
  choice: 侍奉耶和华作祭司
  alternative: 耶和华的祭司职分
  rationale: 原词容许“祭司职分/祭司事奉”的意义。正文采用兼顾职分与事奉的自然汉语，不将其收窄为纯制度性组织。
- issue: נַחֲלָתוֹ的单数形式与集体所指
  choice: 他们的产业
  alternative: 他的产业
  rationale: 语法形式是阳性单数，但前项“利未人”是集体，语义上指全体利未人的产业；正文按汉语集体照应处理，并用脚注保留形式信息。
- issue: 四字神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 采用现代简体中文读者最熟悉的专名“耶和华”，明确其为神名而非“主”这一称号；不据此加入任何宗派性解释。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“分得土地”明确本节的分地背景；“侍奉耶和华作祭司”避免生硬名词堆叠。支派名称均明确加“支派”，便于普通读者理解。脚注标记紧随所解释的“产业”之后。
