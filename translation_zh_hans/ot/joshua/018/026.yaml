  yaml_path: translation/ot/joshua/018/026.yaml
  text: and Hamizpeh[a], Hakkephirah, and Hammozah.
translation:
  language: zh_hans
  text: 还有哈米斯巴[a]、哈基非拉和哈摩撒。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“米斯巴、基非拉和摩撒。”若把三个地名前的希伯来语前缀理解为普通定冠词，汉语中通常不另行译出。
    reason: 保留定冠词究竟属于地名，还是仅为普通语法成分这一词汇歧义。
lexical_decisions:
- source_word: וְ
  choice: 还有／和
  rationale: 各地名前的连接词 וְ 延续上一节的城邑名单；句首用“还有”承接上文，名单内部按现代汉语习惯用顿号及“和”连接。
- source_word: הַמִּצְפֶּה
  choice: 哈米斯巴
  rationale: 这是地名，不按普通名词译为“瞭望台”。将前缀定冠词 הַ־ 音译为“哈”，以保留它可能已成为地名组成部分的读法。
- source_word: הַכְּפִירָה
  choice: 哈基非拉
  rationale: 按地名音译，并将前缀定冠词 הַ־ 作为可能的地名组成部分保留为“哈”。
- source_word: הַמֹּצָה
  choice: 哈摩撒
  rationale: 按地名音译，并将前缀定冠词 הַ־ 作为可能的地名组成部分保留为“哈”。
