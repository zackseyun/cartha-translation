  text: 亚文[a]、巴拉、俄弗拉。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “亚文”所对应的希伯来语也可理解为“亚卫人”。这里因上下文是城邑名单，译作城名。
    reason: alternative_reading
lexical_decisions:
- source_word: הָעַוִּים
  choice: 亚文
  rationale: 在便雅悯地业的城邑名单中按地名处理；采用现代中文圣经读者较熟悉的译名“亚文”。原文形式也可能指“亚卫人”，故以脚注保留歧义。
- source_word: הַפָּרָה
  choice: 巴拉
  rationale: 此处是便雅悯境内的地名；音译为“巴拉”，不另行译出希伯来语附着的定冠词。
- source_word: עָפְרָה
  choice: 俄弗拉
  rationale: 此处为地名，采用通行且易辨识的中文音译“俄弗拉”，不按可能相关的普通名词词义意译。
- source_word: וְ
  choice: 顿号列举
  rationale: 原文重复使用连接词串联地名；现代汉语列举三个地名时自然地用顿号表达。
