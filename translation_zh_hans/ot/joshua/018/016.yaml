base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/016.yaml
  text: Then the border went down to the end of the mountain that faces the Valley of Ben-hinnom[a], which is at the northern end of the Valley of Rephaim. Then it went down the Valley of Hinnom to the southern slope of the Jebusite[c][b], and went down to En-rogel.
translation:
  language: zh_hans
  text: 疆界下到那座山的尽头；这山面对欣嫩子谷[a]，位于利乏音谷的北边。疆界又沿欣嫩谷下到耶布斯人南边的山坡[b]，再下到隐·罗结[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “欣嫩子谷”原文直译为“欣嫩之子的谷”，这里作为地名处理。
    reason: lexical_alternative
  - marker: b
    text: “耶布斯人南边的山坡”也可译作“耶布斯人的南面山肩”或“耶布斯人的南侧”；原文是“耶布斯人的”，没有“城”字。
    reason: lexical_alternative
  - marker: c
    text: “隐·罗结”是地名；“隐”所对应的希伯来语意为“泉”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָרַד הַגְּבוּל
  choice: 疆界下到
  rationale: 保留“下行”的地势含义；“疆界”自然表达领地分界线。
- source_word: קְצֵה הָהָר
  choice: 那座山的尽头
  rationale: קָצֶה 指边缘或尽头；הָר 直译为“山”，不按现代地形判断改作“丘陵”。
- source_word: אֲשֶׁר עַל־פְּנֵי גֵּי בֶן־הִנֹּם
  choice: 这山面对欣嫩子谷
  rationale: עַל־פְּנֵי 在此表达空间上的面对或相对；地名按汉语圣经传统音译并保留其字面构成。
- source_word: אֲשֶׁר בְּעֵמֶק רְפָאִים צָפוֹנָה
  choice: 位于利乏音谷的北边
  rationale: צָפוֹנָה 表示向北或北边；原文的具体地理关系略为紧缩，译文不擅自限定为“北端”。
- source_word: וְיָרַד גֵּי הִנֹּם
  choice: 又沿欣嫩谷下到
  rationale: 边界沿谷势下降；补出“沿”使现代汉语自然，同时保留地形运动。
- source_word: אֶל־כֶּתֶף הַיְבוּסִי נֶגְבָּה
  choice: 到耶布斯人的南面山坡
  rationale: כֶּתֶף 字面为“肩”，地形语境中指山坡或侧面；הַיְבוּסִי 直译为“耶布斯人”，不在正文擅补“城”。
- source_word: עֵין רֹגֵל
  choice: 隐·罗结
  rationale: 作为地名采用音译；עֵין 在地名中本义为“泉”。
