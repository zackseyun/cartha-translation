base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/021.yaml
  text: And the cities belonging to the tribe of the sons of Benjamin[a], according to their clans, were Jericho, Beth-hoglah, and Emek-keziz.
translation:
  language: zh_hans
  text: 便雅悯支派按着宗族所得的城邑是：耶利哥、伯·曷拉和伊麦·基悉。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “伊麦·基悉”或译“基悉谷”；若将“伊麦”理解为普通名词而非地名的一部分，意思就是“谷”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיוּ הֶעָרִים
  choice: 城邑是
  rationale: 这里的连词与“是／有”引出城邑名单；中文以“城邑是”自然承接上文，并保留名单句式。
- source_word: לְמַטֵּה בְּנֵי בִנְיָמִן
  choice: 便雅悯支派的
  rationale: “便雅悯之子”在此指该支派成员；译作“便雅悯支派”符合现代汉语和土地分配语境，也没有改变其群体所指。
- source_word: לְמִשְׁפְּחֹתֵיהֶם
  choice: 按着宗族
  rationale: מִשְׁפָּחָה在支派土地分配中指支派内部的宗族单位；“按着宗族”保留其分配和编组含义。
- source_word: יְרִיחוֹ
  choice: 耶利哥
  rationale: 采用中文圣经传统中通行的地名译法。
- source_word: בֵית חָגְלָה
  choice: 伯·哈拉
  rationale: 按希伯来语地名音译，并以间隔号显示复合名称的两个成分。
- source_word: עֵמֶק קְצִיץ
  choice: 伊麦·基悉
  rationale: 语境表明整个词组为地名，正文据音译处理；同时用脚注保留将首词理解为普通名词“谷”的可能。
theological_decisions: []
