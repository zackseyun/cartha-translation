base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/004.yaml
  text: Provide for yourselves three men from each tribe[a], and I will send them out; they shall arise and walk through the land and write it down according to their inheritance[b], and they shall come to me.
translation:
  language: zh_hans
  text: 你们要从每个支派中选出三个人[a]，我必差派他们。他们要起身走遍那地，按他们的产业把那地记录下来[b]，到我这里来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你们要为自己每个支派指定三个人。”
    reason: 原文 הָבוּ לָכֶם 可表示提供或指定人员；正文采用更自然的“选出”。
  - marker: b
    text: 即按各支派产业的划分记录那地；“他们的产业”不是指这些勘察者个人的产业。
    reason: 说明“按他们的产业”在此与支派土地产业的划分有关。
lexical_decisions:
- source_word: הָבוּ לָכֶם
  choice: 你们要……选出
  rationale: 该命令在此语境中是要听众从自己中间提供或指定人员。中文用“选出”自然地表达实际行动，同时以“你们”保留 לָכֶם 的参与意味；“选派”也可能，但容易与下句约书亚的“差派”混淆。
- source_word: שְׁלֹשָׁה אֲנָשִׁים
  choice: 三个人
  rationale: 指三名男性代表；现代汉语“人”本身不标性别，在此叙事语境中自然清楚，无须生硬地译为“三个男人”。
- source_word: לַשָּׁבֶט
  choice: 从每个支派中
  rationale: 带冠词的单数在这里具有逐一分配的意义，即每个支派各出三人。“从……中”按语境明确这些代表来自各支派。
- source_word: וְאֶשְׁלָחֵם
  choice: 我好差派他们
  rationale: וְ 后接未完成式可承接前面的命令，表示随后或目的性的行动。“我好”使中文衔接自然，并保留由约书亚执行差派的意思。
- source_word: וְיָקֻמוּ
  choice: 他们要起身
  rationale: 保留 קום 的动作顺序和命令承接意味；比单译“出发”更贴近原文。
- source_word: וְיִתְהַלְּכוּ בָאָרֶץ
  choice: 走遍那地
  rationale: התהלך 在此表示在地上来往察看、遍行；“走遍”比逐字的“在那地行走”更符合现代中文，同时呈现勘察全地的语境。
- source_word: וְיִכְתְּבוּ אוֹתָהּ
  choice: 把那地记录下来
  rationale: 原文直译为“把它写下来”，阴性宾语指前述“地”。中文明确宾语为“那地”可避免指代含混；“记录下来”不额外规定记录是文字描述、地图还是清册。
- source_word: לְפִי נַחֲלָתָם
  choice: 按照各自将承受的产业
  rationale: לְפִי 表示“按照、依据”，נַחֲלָה 指分得并承受的土地产业。原文第三人称复数可能关联各支派或其代表，译作“各自”保留分配关系，并避免误解为侦察员个人的私产。
- source_word: וְיָבֹאוּ אֵלָי
  choice: 然后到我这里来
  rationale: 忠实保留“来到我这里”，不将语境上合理但原文未明说的“回来”写入正文。
theological_decisions: []
