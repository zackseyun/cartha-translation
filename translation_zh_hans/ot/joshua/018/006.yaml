base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/006.yaml
  text: And you shall write down the land in seven portions and bring it here to me, and I will cast the lot for you here before the LORD our God.
translation:
  language: zh_hans
  text: 你们要把这地按七份记下来，带到我这里来；我就要在这里，在耶和华——我们上帝面前，为你们抽签。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תִּכְתְּבוּ אֶת־הָאָרֶץ
  choice: 把这地……写明情况
  rationale: 字面为“写下这地”，语境指对土地进行书面勘察、记录；“写明情况”既保留书写动作，也使现代读者易懂。
- source_word: שִׁבְעָה חֲלָקִים
  choice: 划成七份
  rationale: 表示把土地分作七个部分；“七份”自然简洁，并避免误解为七个支派本身。
- source_word: וְיָרִיתִי לָכֶם גּוֹרָל
  choice: 为你们抽签
  rationale: 动词意为投掷，名词为签；汉语惯用“抽签”表达借签分配土地的程序。原文名词为单数，但汉语无须刻意译成“一个签”。
- source_word: יְהוָה אֱלֹהֵינוּ
  choice: 耶和华我们上帝
  rationale: 以“耶和华”呈现神名，并用现代简体中文常见的“上帝”翻译 אֱלֹהִים。
theological_decisions:
- issue: 抽签与神圣临在的关系
  choice: 在耶和华我们上帝面前，为你们抽签
  alternative: 在耶和华我们的上帝面前替你们拈阄
  rationale: 依照原文保留“在耶和华面前”这一神学定位，不增添签的结果必然等同神谕等解释；“抽签”比“拈阄”更符合现代普通话。
translation_notes:
  register: 采用自然、庄重的现代标准普通话。“带到我这里来”承接书面勘察成果，而非把土地本身带来；上下文足以说明，故不加脚注。
