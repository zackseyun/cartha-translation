  text: the king of Dor in Naphath-dor[a], one; the king of Goiim in Gilgal, one[b];
translation:
  language: zh_hans
  text: 拿法多珥的多珥王，一个[a]；吉甲的戈印王，一个[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “拿法多珥”也可按普通地理词理解为“多珥地区”或“多珥高地”；其确切地理含义并不完全确定。
    reason: lexical_alternative
  - marker: b
    text: “戈印”是希伯来语的音译；这个词通常意为“列国”或“各族”，在这里也可能是地名或地域名称。因此本句也可理解为“吉甲的列国之王，一个”。
    reason: alternative_reading
lexical_decisions:
- source_word: מֶלֶךְ
  choice: ……王
  rationale: 在这份被击败诸王的名录中，该词与后面的地名构成领属关系；汉语以“某地王”自然表达。
- source_word: דּוֹר
  choice: 多珥
  rationale: 这是地名，采用现代中文圣经读者较熟悉的音译。
- source_word: לְנָפַת דּוֹר
  choice: 多珥地区的
  rationale: נָפָה在此地理短语中可指区域或辖区，也可能带有高地之意；正文采用自然且不过度限定地貌的“地区”，另一理解收入脚注。
- source_word: אֶחָד
  choice: 一个
  rationale: 该词在本章逐项统计诸王，保留原文简短的计数格式。
- source_word: גּוֹיִם
  choice: 戈印
  rationale: 该词通常意为“列国”或“各族”，但在此名录中可能用作地名或地域名称；正文音译，以免过早判定其所指。
- source_word: לְגִלְגָּל
  choice: 吉甲的
  rationale: 介词לְ在此表示君王与某地的关联；汉语名录体用“吉甲的……王”简洁自然。
theological_decisions:
- issue: גּוֹיִם是普通名词还是专名
  choice: 正文按可能的专名音译为“戈印”，并以脚注说明普通名词义。
  alternative: 译作“列国”，即“吉甲的列国之王”。
  rationale: 上下文是地名式的诸王名录，但该词本身通常表示“列国/各族”；音译并加注能保存原文的歧义，不赋予额外的神学含义。
translation_notes:
  register: 采用简洁庄重的名录体，保留原文逐项以“一个”计数的节奏。地名使用简体中文圣经传统中较易辨认的音译；对两处真实的地理和词义歧义分别加注说明。
