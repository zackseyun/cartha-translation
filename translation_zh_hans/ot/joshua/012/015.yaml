- source_word: לִבְנָה
  choice: 立拿
  rationale: 地名采用现代中文圣经中通行的音译。
- source_word: אֶחָד
  choice: 一个
  rationale: 基数词在征服名单中用于逐项计数；译作“一个”，保留原文简短的点数格式。
- source_word: עֲדֻלָּם
  choice: 亚杜兰
  rationale: 地名采用现代中文圣经中通行的音译。
