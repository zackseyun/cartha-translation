  text: and the territory of Og king of Bashan[a], from the remnant of the Rephaim, who lived in Ashtaroth and in Edrei.
translation:
  language: zh_hans
  text: 以及巴珊王噩的领地。噩是利乏音人所剩下的族类之一[a]，住在亚斯他录和以得来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “利乏音人”也可理解为“巨人”；这个希伯来名称指一个古老族群，传统上认为他们身材异常高大。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/גְב֗וּל
  choice: 以及……的领地
  rationale: גְּבוּל在此征服清单的语境中指王权所辖的地域，而非单独一条边界线；ו承接上文，译作“以及”。
- source_word: ע֚וֹג מֶ֣לֶךְ הַ/בָּשָׁ֔ן
  choice: 巴珊王噩
  rationale: 按现代中文圣经地名、人名的常用音译处理，并自然表达希伯来文的属格结构。
- source_word: מִ/יֶּ֖תֶר הָ/רְפָאִ֑ים
  choice: 是利乏音人所剩下的族类之一
  rationale: מִן在此表达归属，即噩属于利乏音人的余存者；增补“族类之一”使现代汉语清楚表达个体属于余民群体，同时不把רְפָאִים直接解释为“巨人”。
- source_word: הַ/יּוֹשֵׁ֥ב
  choice: 住在
  rationale: 单数分词与噩一致，指噩居住于后列两座城；采用自然、庄重的现代汉语。
- source_word: בְּ/עַשְׁתָּר֖וֹת וּ/בְ/אֶדְרֶֽעִי
  choice: 在亚斯他录和以得来
  rationale: 两个专名采用现代中文圣经中通行的音译，介词与连词按汉语习惯合并表达。
theological_decisions:
- issue: רְפָאִים应作族名还是释为巨人
  choice: 正文保留族名“利乏音人”
  alternative: 译作“巨人”
  rationale: 该词首先是古代族群名称；正文保留族名可避免把有关身材的传统解释直接写入经文，释义则置于脚注。
translation_notes:
  register: 采用自然、清楚而庄重的现代标准汉语。为避免悬垂修饰并明确单数分词所指，将希伯来文连续短语分为两句；保留本节作为上文清单续项的“以及”。
