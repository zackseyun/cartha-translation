    reason: lexical_alternative
lexical_decisions:
- source_word: מֶלֶךְ
  choice: ……王
  rationale: 在战败诸王的名录中，该词指各城邦的君王；汉语以地名或修饰语置于“王”前，简洁自然。
- source_word: יָקְנֳעָם
  choice: 约念
  rationale: 专有地名按现代中文圣经通行形式音译。
- source_word: לַכַּרְמֶל
  choice: 靠近迦密的
  rationale: 前缀 ל 可表达地点或地域关联；“靠近”符合约念位于迦密附近的语境，同时以脚注保留其他可能。
- source_word: אֶחָד
  choice: 一个
  rationale: 保留约书亚记第12章逐项计数、反复以“一”收束各条目的名录风格。
