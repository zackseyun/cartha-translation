  text: 亚弗王一个；沙仑王一个。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מֶלֶךְ
  choice: ……王
  rationale: 在这份战败诸王的名录中，מֶלֶךְ 指各地的王。现代汉语以地名加“王”自然、简洁地保留原文的名录结构。
- source_word: אֲפֵק
  choice: 亚弗
  rationale: 专有地名按通行圣经译名音译。
- source_word: אֶחָד
  choice: 一个
  rationale: 此处用作逐项计数，表示每地一位王；译作“一个”保留希伯来文简短、重复的统计风格。
- source_word: לַשָּׁרוֹן
  choice: 沙仑
  rationale: 指沙仑地区。希伯来文带介词和定冠词，但现代汉语中的专名通常不另行表达定冠词；不增译“平原”，以免加入原文此处未明说的地形解释。
