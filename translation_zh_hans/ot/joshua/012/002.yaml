revisions:
- from: 亚摩利人的王西宏住在希实本。他统治的疆域从亚嫩河谷岸边的亚罗珥和谷中起，涵盖基列的一半，直到雅博河谷[b]，也就是亚扪人[a]的边界。
  to: 亚摩利人的王西宏住在希实本；他统治的疆域从位于亚嫩河谷岸边的亚罗珥以及河谷中部起，包括基列的一半，直到雅博河谷[b]，即亚扪人[a]的边界。
  rationale: 修订仅澄清原文疆域列举的句法关系：亚罗珥由关系从句限定为位于亚嫩河谷岸边，而“河谷中部”是与其并列的范围成分。其余内容、脚注标记及脚注信息均保留。
