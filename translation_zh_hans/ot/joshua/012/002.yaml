  naturalness: 人名、地名及整体庄重叙述体均自然。“涵盖”虽可理解，但在疆域描述中“包括”或直接并列更贴近原文的领土清单。修订后句法更清晰顺畅。
  terminology: “亚摩利人”“西宏”“希实本”“亚罗珥”“基列”“雅博”“亚扪人”等译名和“统治、疆域、边界”等术语均恰当。“河谷”保留了נחל在此处可指河谷／旱溪地貌的开放性；脚注处理合宜。
