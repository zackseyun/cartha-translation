  text: סִיחוֹן֙ מֶ֣לֶךְ הָ/אֱמֹרִ֔י הַ/יּוֹשֵׁ֖ב בְּ/חֶשְׁבּ֑וֹן מֹשֵׁ֡ל מֵ/עֲרוֹעֵ֡ר אֲשֶׁר֩ עַל שְׂפַת נַ֨חַל אַרְנ֜וֹן וְ/ת֤וֹךְ הַ/נַּ֨חַל֙ וַ/חֲצִ֣י הַ/גִּלְעָ֔ד וְ/עַד֙ יַבֹּ֣ק הַ/נַּ֔חַל גְּב֖וּל בְּנֵ֥י עַמּֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/012/002.yaml
  text: Sihon king of the Amorites[a], who lived in Heshbon, ruling from Aroer, which is on the bank of the Arnon Valley, and from the middle of the valley, and half of Gilead, as far as the Jabbok Valley[b], the border of the sons of Ammon.
translation:
  language: zh_hans
  text: 亚摩利人的王西宏住在希实本；他统治的疆域从位于亚嫩河谷岸边的亚罗珥以及河谷中部起，包括基列的一半，直到雅博河谷[b]，即亚扪人[a]的边界。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“亚扪之子”，即亚扪人。
    reason: lexical_alternative
  - marker: b
    text: 这里译作“河谷”的希伯来词 נחל 可指河谷、旱溪或溪流的河床；本节中的亚嫩和雅博都是疆域界线。
    reason: cultural_note
lexical_decisions:
- source_word: הַיּוֹשֵׁב
  choice: 住在
  rationale: ישב的分词在此表示居住；“住在”是现代汉语中自然、准确的表达。
- source_word: מֹשֵׁל
  choice: 统治
  rationale: 该分词表示对随后所述疆域施行政治统治；“统治”简洁且符合君王语境。
- source_word: מֵעֲרוֹעֵר
  choice: 从……亚罗珥……起
  rationale: 介词מ表示疆域的起点；汉语用“从……起”清楚呈现其空间范围。
- source_word: שְׂפַת נַחַל אַרְנוֹן
  choice: 亚嫩河谷岸边
  rationale: שפה表示边缘或岸边，נחל可指河谷、旱溪或其中水道；译作“河谷岸边”既保留地貌含义，也不武断认定为常年河流。
- source_word: וְתוֹךְ הַנַּחַל
  choice: 和谷中
  rationale: תוך意为中间、内部。此处保持原文简略的疆界表述，不进一步断定是谷底、水道中央或谷内某处。
- source_word: וַחֲצִי הַגִּלְעָד
  choice: 涵盖基列的一半
  rationale: חצי明确表示一半；补出“涵盖”使汉语疆域清单顺畅，并未改变范围关系。
- source_word: וְעַד יַבֹּק הַנַּחַל
  choice: 直到雅博河谷
  rationale: עד标明疆域终点；נחל仍按河谷地貌处理，并以脚注说明其语义范围。
- source_word: גְּבוּל בְּנֵי עַמּוֹן
  choice: 亚扪人的边界
  rationale: בני עמון字面为“亚扪之子”，在此是民族称谓；现代汉语自然译作“亚扪人”。
- source_word: הָאֱמֹרִי
  choice: 亚摩利人的王
  rationale: 原文民族称谓在语法上为单数，与“王”同位；汉语按其群体含义自然表达为“亚摩利人的王”。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。将较长的希伯来语名词串分为两句，以提高可读性；保留“谷中”这一地形表述的含混性，不擅自具体化为河流中央或谷底。脚注标记按其实际对应内容放置：关于“亚扪之子”的[a]置于“亚扪人”之后，关于נחל的[b]置于“雅博河谷”之后。
