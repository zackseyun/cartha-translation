  text: 耶利哥王一人；靠近伯特利的艾城王一人。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מֶלֶךְ
  choice: 王
  rationale: 这是统治者称谓的标准译法；按本章战败诸王的名录体例，分别置于地名前后组成简洁条目。
- source_word: יְרִיחוֹ
  choice: 耶利哥
  rationale: 采用该地名在现代中文圣经中的通行译名。
- source_word: אֶחָד
  choice: 一位
  rationale: 在本章反复出现的计数格式中表示每位王各计一名；用“一位”既保留简短点数的节奏，也符合中文对人的量词习惯。
- source_word: הָעַי
  choice: 艾城
  rationale: 采用现代中文圣经中该地名的通行形式；“城”是中文传统地名译法的一部分，并非另行补出的普通名词。
- source_word: אֲשֶׁר
  choice: 的
  rationale: 将希伯来语关系从句自然转换为中文定语结构，修饰“艾城王”。
- source_word: מִצַּד
  choice: 靠近
  rationale: 表达相对于伯特利的邻近位置；比直译为“在……旁边”更适合简洁的中文名录体，同时不限定具体方位。
- source_word: בֵּית אֵל
  choice: 伯特利
  rationale: 采用该地名在现代中文圣经中的通行译名。
