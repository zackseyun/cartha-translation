source:
  edition: WLC
  text: וְ/אֵ֣לֶּה מַלְכֵ֣י הָ/אָ֡רֶץ אֲשֶׁר֩ הִכָּ֨ה יְהוֹשֻׁ֜עַ וּ/בְנֵ֣י יִשְׂרָאֵ֗ל בְּ/עֵ֤בֶר הַ/יַּרְדֵּן֙ יָ֔מָּ/ה מִ/בַּ֤עַל גָּד֙ בְּ/בִקְעַ֣ת הַ/לְּבָנ֔וֹן וְ/עַד הָ/הָ֥ר הֶ/חָלָ֖ק הָ/עֹלֶ֣ה שֵׂעִ֑ירָ/ה וַ/יִּתְּנָ֨/הּ יְהוֹשֻׁ֜עַ לְ/שִׁבְטֵ֧י יִשְׂרָאֵ֛ל יְרֻשָּׁ֖ה כְּ/מַחְלְקֹתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/012/007.yaml
  text: And these are the kings of the land whom Joshua and the sons of Israel struck down beyond the Jordan westward[a], from Baal-gad in the Valley of Lebanon as far as Mount Halak, which rises toward Seir[b]; and Joshua gave it to the tribes of Israel as an inheritance according to their divisions.
translation:
  language: zh_hans
  text: 以下是约书亚和以色列人在约旦河西边击败的那地诸王：从黎巴嫩谷地的巴力·迦得，直到通往西珥的哈拉山[a]。约书亚把这地按以色列各支派的分配赐给他们作产业。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “通往西珥”也可译作“朝西珥上升”或“上达西珥”。
    reason: 原文分词הָעֹלֶה可指通向西珥的上行路线，也可能描述哈拉山朝西珥上升的地势。
lexical_decisions:
- source_word: וְאֵלֶּה מַלְכֵי הָאָרֶץ
  choice: 这些是……当地诸王
  rationale: 承接上文并引出名单；“当地诸王”自然表达该地各王，避免让“地上的王”产生全球性的误解。
- source_word: אֲשֶׁר הִכָּה
  choice: 击败
  rationale: נכה在征战语境中可指击打、击杀或战胜；“击败”保留军事含义，又不把具体死亡方式说得超过原文。
- source_word: יְהוֹשֻׁעַ וּבְנֵי יִשְׂרָאֵל
  choice: 约书亚和以色列人
  rationale: בני ישראל字面为“以色列的众子”，在此是民族群体称谓；现代汉语用“以色列人”准确自然。
- source_word: בְּעֵבֶר הַיַּרְדֵּן יָמָּה
  choice: 在约旦河西岸
  rationale: יָמָּה指向海、即向西；结合地理视角，短语所指为约旦河西边。“西岸”在现代汉语中清楚简洁。
- source_word: מִבַּעַל גָּד בְּבִקְעַת הַלְּבָנוֹן
  choice: 从黎巴嫩谷的巴力·迦得
  rationale: בִּקְעָה是宽阔谷地或平原；“黎巴嫩谷”保留地理名称，巴力·迦得按专名音译。
- source_word: וְעַד הָהָר הֶחָלָק
  choice: 直到哈拉山
  rationale: הָהָר הֶחָלָק在此具有地名功能，采用音译“哈拉山”，不武断改作描述性的“光秃山”或“平滑山”。
- source_word: הָעֹלֶה שֵׂעִירָה
  choice: 通往西珥的
  rationale: 保留分词所含的上行、朝向含义；正文采用自然的地理表达，脚注提示也可理解为山势朝西珥上升。
- source_word: וַיִּתְּנָהּ יְהוֹשֻׁעַ
  choice: 约书亚把这片土地……赐给他们
  rationale: 阴性单数宾语后缀回指“土地”；明说“这片土地”可消除汉语代词歧义。
- source_word: לְשִׁבְטֵי יִשְׂרָאֵל יְרֻשָּׁה כְּמַחְלְקֹתָם
  choice: 按以色列各支派的分区赐给他们作产业
  rationale: יְרֻשָּׁה在约书亚记分地语境中是承受所得的产业；כְּמַחְלְקֹתָם指按各自划分或分配的单位。
theological_decisions:
- issue: יְרֻשָּׁה的土地承受含义
  choice: 产业
  alternative: 基业；继承之地；所有之地
  rationale: “产业”能表达分配后持有的土地及承受色彩，同时不额外加入特定宗派对土地应许的解释。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。地名依中文圣经传统作适度音译；长希伯来句分为两句，以保持清晰。正文中的脚注标记[a]与脚注对应。
