id: JOS.12.6
reference: Joshua 12:6
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: מֹשֶׁ֧ה עֶֽבֶד יְהוָ֛ה וּ/בְנֵ֥י יִשְׂרָאֵ֖ל הִכּ֑וּ/ם וַֽ֠/יִּתְּנָ/הּ מֹשֶׁ֨ה עֶֽבֶד יְהוָ֜ה יְרֻשָּׁ֗ה לָ/רֻֽאוּבֵנִי֙ וְ/לַ/גָּדִ֔י וְ/לַ/חֲצִ֖י שֵׁ֥בֶט הַֽ/מְנַשֶּֽׁה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/012/006.yaml
  text: Moses the servant of Yahweh[a], and the sons of Israel, struck them down, and Moses the servant of Yahweh gave it as an inheritance to the Reubenites, the Gadites, and the half-tribe of Manasseh.
translation:
  language: zh_hans
  text: 耶和华的仆人摩西和以色列人[a]击败了他们。耶和华的仆人摩西把那地赐给吕便人、迦得人和玛拿西半支派作产业。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“以色列的众子”，这里指以色列人。
    reason: 保留原文的阳性群体表达，同时使正文符合自然的现代汉语。
lexical_decisions:
- source_word: עֶבֶד
  choice: 仆人
  rationale: 在“耶和华的仆人”这一称号中，עֶבֶד 强调摩西忠心事奉并受差遣的身份；“仆人”既符合上下文，也比“奴隶”自然庄重。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文读者最熟悉的专名形式“耶和华”呈现四字神名，避免以“主”这一称号代替原文中的专名。
- source_word: בְנֵי יִשְׂרָאֵל
  choice: 以色列人[a]
  rationale: 该短语字面为“以色列的众子”，在这里是指以色列民这一整体；正文采用自然的现代汉语集体称谓，并用脚注保留原文形式。
- source_word: הִכּוּם
  choice: 击杀了这些王
  rationale: נכה 在战争语境中可指击打、杀败或击杀。结合本章列举被杀之王的上下文，“击杀”准确而具体；代词“他们”明确为“这些王”，使中文指代清楚。
- source_word: וַיִּתְּנָהּ
  choice: 把他们的土地赐给
  rationale: 阴性单数后缀所指的土地或疆域由上下文补出；中文明确译为“他们的土地”，并以“赐给”表达 נתן 在分配应许之地语境中的含义。
- source_word: יְרֻשָּׁה
  choice: 作产业
  rationale: יְרֻשָּׁה 指承受而得、可传留的土地。“作产业”简洁保留承受土地的含义，也符合庄重而易懂的现代圣经语体。
- source_word: לָרֻאוּבֵנִי
  choice: 吕便人
  rationale: 阳性单数族称在此作集合用法，指吕便支派的人；“吕便人”是自然准确的中文表达。
- source_word: לַגָּדִי
  choice: 迦得人
  rationale: 该族称在此集体指迦得支派的人，译作“迦得人”。
- source_word: חֲצִי שֵׁבֶט הַמְנַשֶּׁה
  choice: 玛拿西半支派
  rationale: 直译并准确指玛拿西支派中在约旦河东得地的那一半。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威；主
  rationale: 原文使用神的专名而非称号。中文正文保留专名，并采用普通现代中文读者最熟悉、最易识别的“耶和华”；“雅威”更接近一种学术性重构读音，而“主”会把专名替换成称号。
- issue: בְנֵי יִשְׂרָאֵל 的群体与性别表达
  choice: 以色列人
  alternative: 以色列的众子；以色列子孙
  rationale: 该表达在语法形式上是阳性复数，字面为“以色列的众子”，但在本句中作为民族整体称谓。正文采用现代汉语自然说法，不把它收窄为仅参与作战的男性；脚注透明保留字面形式。
- issue: יְרֻשָּׁה 的土地神学含义
  choice: 作产业
  alternative: 作继承之业；作所有之地
  rationale: “产业”保留土地作为所承受份额的含义，同时不额外解释其取得机制或引入特定宗派术语。
translation_notes:
  register: 采用自然、庄重而明晰的现代标准普通话。“这些王”和“他们的土地”根据本章上下文明确原文代词及省略的土地所指；分成两句，以避免中文长句拖沓，同时保留原文两个并列动作。
