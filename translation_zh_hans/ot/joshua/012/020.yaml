translation:
  language: zh_hans
  text: 伸仑米仑王，一名[a]；押煞王，一名。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可能是两个分别的地名，即“伸仑”和“米仑”；不过，这里的希伯来文通常被理解为复合地名“伸仑米仑”，也符合本节共计两王的结构。
    reason: alternative_reading
lexical_decisions:
- source_word: מֶלֶךְ
  choice: 王
  rationale: 在本章征服名单的固定格式中，מֶלֶךְ 指各城邦的君王；中文置于地名之后说“某某王”最自然，也保持简洁。
- source_word: שִׁמְרוֹן מְראוֹן
  choice: 伸仑·米仑
  rationale: 按马所拉文本的读法及本节只列两王的结构，将两词理解为一个复合地名；采用中文圣经中较熟悉的音译，并以间隔号显示复合名称。
- source_word: אֶחָד
  choice: 一名
  rationale: 此处是名单中的省略计数格式。用“一名”既保留逐王计数的节奏，也比孤立的“一个”更符合现代汉语对君王的计数习惯。
- source_word: אַכְשָׁף
  choice: 押煞
  rationale: 专有地名按惯用中文圣经形式音译，不另作释义。
