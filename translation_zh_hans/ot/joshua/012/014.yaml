- source_word: חָרְמָה
  choice: 何珥玛
  rationale: 地名按希伯来语音译，并采用现代中文圣经中易辨识的常见形式。
- source_word: אֶחָד
  choice: 一位
  rationale: 基数词在重复的名单中省略所计数的“王”；译作“一位”既补足汉语所需量词，也保留逐王计数的节奏。
- source_word: עֲרָד
  choice: 亚拉得
  rationale: 地名按希伯来语音译，并采用现代中文圣经中易辨识的常见形式。
