base_translation:
  language: en
  yaml_path: translation/ot/joshua/012/008.yaml
  text: in the hill country[a], and in the lowland, and in the Arabah, and on the slopes, and in the wilderness, and in the Negev—the Hittites, the Amorites, and the Canaanites, the Perizzites, the Hivites[c][b], and the Jebusites.
translation:
  language: zh_hans
  text: 在山区、低地[a]、亚拉巴[b]、山坡、旷野和南地[c]——赫人、亚摩利人、迦南人、比利洗人、希未人和耶布斯人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“示非拉”；这是西部低地或山麓地区的名称。
    reason: lexical_alternative
  - marker: b
    text: “亚拉巴”是裂谷地带的区域名称；也可译作“沙漠平原”。
    reason: lexical_alternative
  - marker: c
    text: 或译“南方地区”；希伯来语“内盖夫”既可指特定的南部地区，也可泛指南方。
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּהָר
  choice: 在山区
  rationale: הַר在此处属于一连串地形区域，并非指某一座山；“山区”自然表达其地域意义。
- source_word: וּבַשְּׁפֵלָה
  choice: 低地
  rationale: שְׁפֵלָה指西部低地或山麓地带；正文用易懂的“低地”，脚注保留专名可能性。
- source_word: וּבָעֲרָבָה
  choice: 亚拉巴
  rationale: עֲרָבָה在这里很可能是裂谷荒原的地域名称；音译可保留其专名性质，同时以脚注说明普通名词含义。
- source_word: וּבָאֲשֵׁדוֹת
  choice: 山坡
  rationale: אֲשֵׁדוֹת表示斜坡、山坡；“山坡”准确且符合现代汉语地形列举的表达。
- source_word: וּבַמִּדְבָּר
  choice: 旷野
  rationale: מִדְבָּר通常指人烟稀少的荒野或草原地带，不一定是沙漠；“旷野”较宽泛且贴切。
- source_word: וּבַנֶּגֶב
  choice: 南地
  rationale: נֶגֶב既可指“南方”，也可指特定的南部干旱地区；“南地”兼顾地域专称和字面方向含义，脚注说明两种可能。
- source_word: הַחִתִּי
  choice: 赫人
  rationale: 希伯来语形式为单数集体民族称谓；汉语惯用“赫人”统称该族群。
- source_word: הָאֱמֹרִי
  choice: 亚摩利人
  rationale: 按集体民族称谓译为汉语族名。
- source_word: וְהַכְּנַעֲנִי
  choice: 迦南人
  rationale: 按集体民族称谓译为汉语族名。
- source_word: הַפְּרִזִּי
  choice: 比利洗人
  rationale: 采用通行的现代中文圣经族名译法。
- source_word: הַחִוִּי
  choice: 希未人
  rationale: 采用通行的现代中文圣经族名译法。
- source_word: וְהַיְבוּסִי
  choice: 耶布斯人
  rationale: 采用通行的现代中文圣经族名译法。
theological_decisions: []
