id: JOS.12.5
reference: Joshua 12:5
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וּ֠/מֹשֵׁל בְּ/הַ֨ר חֶרְמ֤וֹן וּ/בְ/סַלְכָה֙ וּ/בְ/כָל הַ/בָּשָׁ֔ן עַד גְּב֥וּל הַ/גְּשׁוּרִ֖י וְ/הַ/מַּעֲכָתִ֑י וַ/חֲצִי֙ הַ/גִּלְעָ֔ד גְּב֖וּל סִיח֥וֹן מֶֽלֶךְ חֶשְׁבּֽוֹן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/012/005.yaml
  text: and ruling over Mount Hermon[a], and Salecah, and all Bashan, as far as the border of the Geshurites and the Maacathites, and half of Gilead, to the border of Sihon king of Heshbon.
translation:
  language: zh_hans
  text: 统管黑门山[a]、撒迦和整个巴珊，直到基述人和玛迦人的边界；又统管基列的一半，直到希实本王西宏的边界。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他统管黑门山、撒迦和整个巴珊。”希伯来原文用分词，承接上一节的描述。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמֹשֵׁל
  choice: 统管
  rationale: 这是分词，承接上一节对噩及其辖境的描述；中文用“统管”既表达持续的统治，也能保持句法上的延续。
- source_word: בְּהַר חֶרְמוֹן
  choice: 黑门山
  rationale: 介词 בְּ 在 משל 后标明统治范围；中文由“统管”直接支配地名，无须另译介词。
- source_word: וּבְסַלְכָה
  choice: 撒迦
  rationale: 这是噩辖境中的地名，采用现代中文圣经中较通行的音译。
- source_word: וּבְכָל הַבָּשָׁן
  choice: 整个巴珊
  rationale: כָל 表示全境，“整个巴珊”自然、明确地传达地域范围。
- source_word: עַד גְּבוּל
  choice: 直到……的边界
  rationale: עַד 与 גְּבוּל 共同标示领土延伸的界限。
- source_word: הַגְּשׁוּרִי וְהַמַּעֲכָתִי
  choice: 基述人和玛迦人
  rationale: 两个词在形态上是单数族称，但此处指相应族群，以中文群体称谓表达最自然，同时保留边界归属的含义。
- source_word: וַחֲצִי הַגִּלְעָד
  choice: 又统管基列的一半
  rationale: 这是另一片受辖领土；补出承前省略的“统管”，可消除中文中把它误接为前述边界组成部分的可能。
- source_word: גְּבוּל סִיחוֹן מֶלֶךְ חֶשְׁבּוֹן
  choice: 直到希实本王西宏的边界
  rationale: 此语界定噩所辖基列半部的范围；“希实本王西宏”自然呈现王名及其王城关系。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。以分号区分两段疆域范围，并在第二段补出“统管”，使希伯来文的省略关系在中文中清楚；专名采用简体中文圣经常见译法。
