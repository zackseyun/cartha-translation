  text: וְ/הָ/עֲרָבָה֩ עַד יָ֨ם כִּנְר֜וֹת מִזְרָ֗חָ/ה וְ֠/עַד יָ֣ם הָ/עֲרָבָ֤ה יָם הַ/מֶּ֨לַח֙ מִזְרָ֔חָ/ה דֶּ֖רֶךְ בֵּ֣ית הַיְשִׁמ֑וֹת וּ/מִ֨/תֵּימָ֔ן תַּ֖חַת אַשְׁדּ֥וֹת הַ/פִּסְגָּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/012/003.yaml
  text: and the Arabah as far as the Sea of Kinnereth eastward[a], and as far as the Sea of the Arabah, the Salt Sea, eastward, by way of Beth-jeshimoth, and southward[b], below the slopes of Pisgah.
translation:
  language: zh_hans
  text: 以及亚拉巴[a]，直到基尼烈海的东边；又直到亚拉巴海，就是盐海[b]的东边，朝伯耶西末的方向；南面则在毗斯迦山坡以下。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “亚拉巴”也可译作“平原”；这里很可能特指约旦河谷裂谷地区，而不是泛指平原。
    reason: lexical_alternative
  - marker: b
    text: “亚拉巴海，就是盐海”，指后来通常所称的死海。
    reason: cultural_note
lexical_decisions:
- source_word: הָעֲרָבָה
  choice: 亚拉巴
  rationale: 按特定地理名称音译，指约旦裂谷一带；不泛化为普通的“平原”。
- source_word: יָם כִּנְרוֹת
  choice: 基尼烈海
  rationale: 保留希伯来地名的传统汉语音译，并照原文称为“海”。
- source_word: מִזְרָחָה
  choice: 东边的
  rationale: 在疆域描述中可表达“向东”或“在东边”的方位意义；此处采用自然简洁的汉语表达。
- source_word: יָם הָעֲרָבָה יָם הַמֶּלַח
  choice: 亚拉巴海，就是盐海
  rationale: 保留原文两个名称的同位关系，以“就是”使现代汉语读者清楚这是同一片水域，而不用原文没有的现代名称替代。
- source_word: דֶּרֶךְ בֵּית הַיְשִׁמוֹת
  choice: 朝伯耶西末的方向
  rationale: 在地界说明中，דֶּרֶךְ 表示朝向或路径；此译法既保留方向感，也避免误示必须沿某条确定道路。
- source_word: וּמִתֵּימָן
  choice: 南面则
  rationale: 原词形式含“从南边”的意味，但在本段地理范围描述中自然理解为南侧方位；译文保留其简略的界线说明语气。
- source_word: תַּחַת אַשְׁדּוֹת הַפִּסְגָּה
  choice: 在毗斯迦山坡以下
  rationale: תַּחַת 表示“以下”，אַשְׁדּוֹת 指山坡或斜坡；译文保留具体地貌，不弱化为笼统的山脚。
