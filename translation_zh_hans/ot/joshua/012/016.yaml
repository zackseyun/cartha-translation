  text: the king of Makkedah[a], one; the king of Bethel, one.
translation:
  language: zh_hans
  text: 玛基大王一人[a]；伯特利王一人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文保留了简短的清单体例，直译为：“玛基大王，一个；伯特利王，一个。”这里的“一个”表示每项被击败之王的数目。
    reason: lexical_alternative
lexical_decisions:
- source_word: מֶלֶךְ
  choice: ……王
  rationale: 这是结构形式，在清单中表示各城邦的王；汉语以地名直接修饰“王”，自然简洁。
- source_word: מַקֵּדָה
  choice: 玛基大
  rationale: 专有地名，按通行圣经译名音译，不按词义翻译。
- source_word: אֶחָד
  choice: 一人
  rationale: 此处是逐项统计被击败之王的数目。译作“一人”既保留简短重复的点数格式，也比单用“一个”更符合现代汉语对人的计数习惯。
- source_word: בֵּית אֵל
  choice: 伯特利
  rationale: 此处明确是地名，采用通行音译，不译作其词源意义“神的家”。
