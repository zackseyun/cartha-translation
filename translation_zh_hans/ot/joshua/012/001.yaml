revisions:
- from: 以下是以色列人在约旦河东、向着日出的方向[a]所击败的那地诸王；以色列人占领了他们的土地。这片地域从亚嫩河谷[b]直到黑门山，也包括东边的整个亚拉巴[c]。
  to: 以下是以色列人在约旦河东、即日出方向所击败的那地诸王；他们取得并占有了这些王的土地：从亚嫩河谷[b]直到黑门山，以及东边的整个亚拉巴[c][a]。
  rationale: 修订将疆域范围直接连接到以色列人所取得的诸王之地，恢复原文的连续关系；以“以及”替代“也包括”，保留并列列举而不加入补充性语气；并以“取得并占有”较完整传达ירשׁ的征服性领土取得。脚注锚点移至“日出方向”“亚嫩河谷”和“亚拉巴”对应的中文词语处。
