    rationale: 原文的“从……直到……以及……”直接限定所取得的土地；在中文中重复“其地”或“他们的土地”可避免指代跳转。
  - severity: low
    issue: “占领”对ירשׁ的持续占有义表达不足。
    rationale: 此词在此类征服与领土语境中包含取得、占有之义；“取得并占有”更完整，且不添加神学解释。
