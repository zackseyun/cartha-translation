  text: וְ/אֵ֣לֶּה מַלְכֵ֣י הָ/אָ֗רֶץ אֲשֶׁ֨ר הִכּ֤וּ בְנֵֽי יִשְׂרָאֵל֙ וַ/יִּֽרְשׁ֣וּ אֶת אַרְצָ֔/ם בְּ/עֵ֥בֶר הַ/יַּרְדֵּ֖ן מִזְרְחָ֣/ה הַ/שָּׁ֑מֶשׁ מִ/נַּ֤חַל אַרְנוֹן֙ עַד הַ֣ר חֶרְמ֔וֹן וְ/כָל הָ/עֲרָבָ֖ה מִזְרָֽחָ/ה׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/012/001.yaml
  text: These are the kings of the land whom the sons of Israel struck down and whose land they took possession of beyond the Jordan[a], toward the sunrise, from the Wadi Arnon as far as Mount Hermon[d][c][b], and all the Arabah eastward.
translation:
  language: zh_hans
  text: 以下是以色列人在约旦河东、即日出方向所击败的那地诸王；他们取得并占有了这些王的土地：从亚嫩河谷[b]直到黑门山，以及东边的整个亚拉巴[c][a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“向着太阳升起的方向”，即东方。
    reason: lexical_alternative
  - marker: b
    text: 这里译作“河谷”的希伯来词可指溪流、河床或洪水流经的谷地；也可译作“亚嫩溪谷”。
    reason: cultural_note
  - marker: c
    text: “亚拉巴”是约旦裂谷一带的特定地理名称；这个词在其他语境中也可译作“平原”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: 以下是
  rationale: 用现代汉语自然地引出新的名单，同时保留与上文的衔接；不添加原文没有的时间副词。
- source_word: מַלְכֵי הָאָרֶץ
  choice: 那地诸王
  rationale: 保留“地”与“王”的领土关系；“诸王”符合中文历史叙事语体。
- source_word: אֲשֶׁר הִכּוּ
  choice: 所击败的
  rationale: נכה在战争语境中可指击打或打败；“击败”保留军事含义，又不武断断定每一位王都被当场杀死。
- source_word: בְנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 这是该希伯来族群称谓在现代汉语中的自然表达；直译“以色列的儿子们”容易被误解为仅指雅各的亲生儿子。
- source_word: וַיִּרְשׁוּ אֶת־אַרְצָם
  choice: 以色列人占领了他们的土地
  rationale: ירשׁ在征服语境中指取得并占有土地；补出主语可消除中文长句中的指代含混。
- source_word: בְּעֵבֶר הַיַּרְדֵּן מִזְרְחָה הַשָּׁמֶשׁ
  choice: 在约旦河东、向着日出的方向
  rationale: 结合后面的方位语明确这里是约旦河东，同时保留希伯来文以日出表示东方的形象。
- source_word: מִנַּחַל אַרְנוֹן
  choice: 从亚嫩河谷
  rationale: נחל可指有水流的溪河，也可指其河床或峡谷；“河谷”适合此处地理边界的语境。
- source_word: עַד הַר חֶרְמוֹן
  choice: 直到黑门山
  rationale: 准确表达 עַד 所标示的地域终点。
- source_word: וְכָל־הָעֲרָבָה מִזְרָחָה
  choice: 也包括东边的整个亚拉巴
  rationale: 将 עֲרָבָה 作为特定地理区域音译，避免把它简化为泛指的“平原”；“东边”自然表达末尾的方位副词。
