  text: the king of Tappuah[a], one; the king of Hepher, one.
translation:
  language: zh_hans
  text: 他普亚王一位；希弗王一位。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מֶלֶךְ
  choice: 王
  rationale: 希伯来语为构造形式，表示该城邑的君王；中文以地名后接“王”自然表达所属关系，并适合名单体例。
- source_word: תַּפּוּחַ
  choice: 他普亚
  rationale: 地名按常见中文圣经音译处理，不按其普通名词词义翻译。
- source_word: אֶחָד
  choice: 一位
  rationale: 基数词在名单中省略所计数的“王”；中文补出量词“位”，既表明逐一计数，也保留原文简洁的重复格式。
- source_word: חֵפֶר
  choice: 希弗
  rationale: 作为地名音译，并采用现代中文圣经中易于识别的形式。
