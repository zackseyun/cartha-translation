base_translation:
  language: en
  yaml_path: translation/ot/joshua/003/006.yaml
  text: Then Joshua said to the priests, “Take up the ark of the covenant and cross over before the people.” So they took up the ark of the covenant and went before the people.
translation:
  language: zh_hans
  text: 约书亚对祭司说：“抬起约柜，在百姓前头过去。”于是他们抬起约柜，走在百姓前头。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: 该叙事形式承接前文并推进事件；现代汉语通常不必逐字译出连接词，由上下文自然表达先后关系。
- source_word: יְהוֹשֻׁעַ
  choice: 约书亚
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: הַכֹּהֲנִים
  choice: 祭司
  rationale: 准确表达以色列礼仪职分人员的定指复数；汉语在此无需另加复数标记。
- source_word: שְׂאוּ / וַיִּשְׂאוּ
  choice: 抬起 / 抬起
  rationale: נשא在此兼有举起并抬运约柜之意。“抬起”既保留具体动作，也自然适合多人搬运约柜的场景；命令与执行采用同一译词，以保留原文呼应。
- source_word: אֲרוֹן הַבְּרִית
  choice: 约柜
  rationale: 原文直指与“约”相关的柜；“约柜”是简洁、清楚且已广为理解的现代中文固定译法，不额外加入解释。
- source_word: וְעִבְרוּ
  choice: 走到……前面去
  rationale: עבר基本义为经过、越过或移到另一边；本句尚未明确说祭司已经渡过约旦河，而是命令他们从所在位置行到百姓前面，因此按即时语境译为“走到百姓前面去”，避免误导为此刻已经过河。
- source_word: לִפְנֵי הָעָם
  choice: 百姓前面 / 百姓前面
  rationale: 忠实表达空间位置“在百姓之前、前方”；命令句用“走到……前面去”，叙述句用“走在……前面”，符合现代汉语表达。
- source_word: וַיֵּלְכוּ
  choice: 走在
  rationale: הלך是普通的“走、去”；结合לִפְנֵי הָעָם译成“走在百姓前面”，自然呈现祭司行进的位置。
theological_decisions:
- issue: 礼仪语境中אֲרוֹן הַבְּרִית的表达
  choice: 约柜
  alternative: 立约之柜
  rationale: “约柜”准确保留其与“约”的关联，也是中文中透明而通行的名称；不进一步说明约的性质或约柜的神学功能，以免加入原文未明说的解释。
- issue: וְעִבְרוּ是否应明确译作渡过约旦河
  choice: 走到百姓前面去
  alternative: 在百姓前面过河
  rationale: 虽然全章背景是渡过约旦河，但本节命令首先涉及祭司抬柜来到百姓前方，后半句也只说他们走在百姓前面。译文不提前把动词限定为“过河”，从而保留原文在局部语境中的开放性。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。保留命令与执行之间的词语呼应，并以“于是”清楚呈现叙事结果；不使用生硬的逐词结构，也不添加原文未明说的礼仪或神学解释。
