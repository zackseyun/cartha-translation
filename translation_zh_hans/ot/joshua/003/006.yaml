- from: 约书亚对祭司说：“抬起约柜，走到百姓前面去。”于是他们抬起约柜，走在百姓前面。
  to: 约书亚对祭司说：“抬起约柜，在百姓前头过去。”于是他们抬起约柜，走在百姓前头。
  rationale: 仅修正命令中的“走到百姓前面去”为“在百姓前头过去”，以对应וְעִבְרוּ的“过去／越过”，同时避免在中文中额外明说“渡过约旦河”。保留后句“走在百姓前头”，以反映וַיֵּלְכוּ的普通“走、去”，并保留叙事中命令与执行的简洁对应。
