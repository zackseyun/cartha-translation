  source_fidelity: 译文正确传达了约书亚对祭司的命令、祭司的服从、约柜及其在百姓前方的位置，也保留了命令与执行中“抬起”的呼应。但将וְעִבְרוּ译为“走到百姓前面去”弱化并改变了该动词“越过／过去”的核心含义；结合本段约旦河渡越语境，应保留“过去”的动作，而不宜将其解释为仅仅移动到队伍前方。
  naturalness: “约书亚对祭司说”“于是他们……”及“约柜”均自然、庄重。“在百姓前头过去”比“走到百姓前面去”更准确，仍属现代标准汉语；后句“走在百姓前头”自然地对应וַיֵּלְכוּ。
  terminology: “约书亚”“祭司”“约柜”均为现代汉语圣经语境中通行且准确的用语。“约柜”可恰当表达אֲרוֹן הַבְּרִית，无须扩展性解释。
