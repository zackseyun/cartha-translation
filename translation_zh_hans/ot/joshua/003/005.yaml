  text: וַ/יֹּ֧אמֶר יְהוֹשֻׁ֛עַ אֶל הָ/עָ֖ם הִתְקַדָּ֑שׁוּ כִּ֣י מָחָ֗ר יַעֲשֶׂ֧ה יְהוָ֛ה בְּ/קִרְבְּ/כֶ֖ם נִפְלָאֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/003/005.yaml
  text: Then Joshua said to the people, “Consecrate yourselves, because tomorrow the LORD will do wonders among you.”
translation:
  language: zh_hans
  text: 约书亚对百姓说：“你们要使自己分别为圣，因为明天耶和华要在你们中间行奇事。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִתְקַדָּשׁוּ
  choice: 使自己分别为圣
  rationale: 此处是קדש词根的反身命令式，指百姓为迎接耶和华的作为而预备并使自己成为圣洁、归于神；“使自己分别为圣”保留反身意味和礼仪—属灵内涵。
- source_word: נִפְלָאוֹת
  choice: 奇事
  rationale: 该词指超乎寻常、令人惊叹的作为；“奇事”在叙事语境中自然庄重，也不预先限定具体神迹形式。
- source_word: בְּקִרְבְּכֶם
  choice: 在你们中间
  rationale: 直译其空间与群体含义，表明耶和华将在百姓当中施行作为。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经传统中对神圣四字名的通行音译，以区别于称号“主”。
- source_word: כִּי
  choice: 因为
  rationale: 在此引出命令的理由：百姓应分别为圣，因为耶和华次日要行奇事。
theological_decisions:
- issue: 百姓自洁与神施行奇事之间的关系
  choice: 用“因为”表达命令的依据，不增添功德或因果交换含义
  alternative: 译作“好让”或“为了使”，暗示百姓自洁促成神的作为
  rationale: 希伯来文כִּי最自然地说明理由；经文并未说人的自洁使神不得不行奇事。
- issue: הִתְקַדָּשׁוּ的圣洁含义
  choice: 保留“分别为圣”的宽广表达
  alternative: 具体化为“洁净自己”或“举行洁净礼”
  rationale: 上下文未在本节明确列出具体仪式；不应将可能兼具礼仪和属灵预备的命令缩窄为某一种程序。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。句式贴近希伯来文而不生硬；“分别为圣”虽带圣经语域，但对普通中文读者仍可理解，并较好保留原词的神学厚度。
