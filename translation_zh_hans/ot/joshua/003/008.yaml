base_translation:
  language: en
  yaml_path: translation/ot/joshua/003/008.yaml
  text: And you shall command the priests who carry the ark of the covenant[a], saying, ‘When you come to the edge of the waters of the Jordan, you shall stand in the Jordan.’
translation:
  language: zh_hans
  text: 你要吩咐抬约柜的祭司说：“你们来到约旦河水边[a]时，要站在约旦河里。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“来到约旦河水的边缘”。
    reason: קְצֵה 可较直译为“边缘”或“尽头”；正文采用更自然的“水边”，脚注保留原文空间表达的另一种译法。
lexical_decisions:
- source_word: וְאַתָּה
  choice: 你要
  rationale: 独立代词强调约书亚是受命者；汉语以明确的“你”承接上文即可，无须机械译出连接词。
- source_word: תְּצַוֶּה
  choice: 吩咐
  rationale: צוה 的 Piel 未完成式在此表达指令；“吩咐”自然、庄重，也保留上对下传令的语气。
- source_word: הַכֹּהֲנִים נֹשְׂאֵי אֲרוֹן הַבְּרִית
  choice: 抬约柜的祭司
  rationale: 分词 נֹשְׂאֵי 修饰祭司，表示承担抬运约柜职责的人；“抬”符合约柜由杠抬行的具体语境，“约柜”是 אֲרוֹן הַבְּרִית 准确而通行的简洁译法。
- source_word: לֵאמֹר
  choice: 说
  rationale: 保留希伯来语引出直接引语的常用公式。
- source_word: כְּבֹאֲכֶם עַד קְצֵה מֵי הַיַּרְדֵּן
  choice: 你们来到约旦河水边时
  rationale: כְּ 与不定式构成时间从句，עַד קְצֵה 表示抵达水域边缘；“来到……水边时”是自然汉语，并保留到达边界的空间含义。
- source_word: בַּיַּרְדֵּן תַּעֲמֹדוּ
  choice: 要站在约旦河里
  rationale: בְּ 表示所在位置，עמד 表示站立或站定；译文保留祭司进入河中并站住的明确动作。
theological_decisions: []
