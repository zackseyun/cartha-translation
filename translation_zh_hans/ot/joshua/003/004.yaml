  to: 不过，你们和它之间要相隔约二千肘[a]。不要靠近它，好让你们知道你们将走的路，因为你们此前[b]没有走过这条路。
  rationale: 修订仅改善现代汉语的自然度与句法凝练度：“相隔约二千肘”自然表达双方之间经量度计算的距离；“不要靠近”是常用禁令表达；“此前”较“从前”更贴合此处“直到如今以前”的语境。原文的意义、语气、代词指向、脚注锚点及古代度量单位均予保留。
