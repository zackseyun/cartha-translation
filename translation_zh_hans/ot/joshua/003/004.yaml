base_translation:
  language: en
  yaml_path: translation/ot/joshua/003/004.yaml
  text: Yet there shall be a distance between you and it[a], about two thousand cubits by measure. Do not come near it, so that you may know the way by which you shall go[b], for you have not passed this way before.
translation:
  language: zh_hans
  text: 不过，你们和它之间要相隔约二千肘[a]。不要靠近它，好让你们知道你们将走的路，因为你们此前[b]没有走过这条路。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “肘”是古代常用的长度单位，大致相当于人的前臂长度。
    reason: cultural_note
  - marker: b
    text: “此前”原文直译为“从昨天和前天以来”，是表示“以前”或“此前”的惯用语。
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: 不过
  rationale: 在承接前文指示的同时引出限制性转折；“不过”自然体现“但须注意”的语气，不把它强化为新的命令。
- source_word: רָחוֹק יִהְיֶה בֵּינֵיכֶם וּבֵינוֹ
  choice: 你们和它之间要有一段距离
  rationale: 保留希伯来文陈述间隔应当存在的结构；“它”按上下文指约柜，也符合现代汉语对无生命事物的指称。
- source_word: כְּאַלְפַּיִם אַמָּה בַּמִּדָּה
  choice: 量起来约二千肘
  rationale: 前缀כ表达约数，“量起来”体现בַּמִּדָּה的计量含义；保留古代长度单位“肘”，并以脚注说明。
- source_word: אַל תִּקְרְבוּ אֵלָיו
  choice: 不可走近它
  rationale: 直接表达否定禁令，措辞简洁庄重，并保留与约柜之间的空间关系。
- source_word: לְמַעַן אֲשֶׁר תֵּדְעוּ
  choice: 好让你们知道
  rationale: 自然表达目的关系，不额外赋予“辨认”或神秘启示等含义。
- source_word: אֶת־הַדֶּרֶךְ אֲשֶׁר תֵּלְכוּ בָהּ
  choice: 你们将走的路
  rationale: 按关系从句直译为将要行走的路线；“将”体现未然语境，而不添加原文未明说的义务性“必须”。
- source_word: כִּי לֹא עֲבַרְתֶּם בַּדֶּרֶךְ
  choice: 因为你们……没有走过这条路
  rationale: עָבַר在行程语境中表示经过或走过；汉语用“走过这条路”准确自然。
- source_word: מִתְּמוֹל שִׁלְשׁוֹם
  choice: 从前
  rationale: 这是表示以往、此前的惯用语；正文采用自然汉语“从前”，脚注保留其字面表达。
