  text: And at the end of three days[a], the officers went through the midst of the camp.
translation:
  language: zh_hans
  text: 三天期满时，官员们在营中穿行[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“从营中经过。”
    reason: 原文动词可指“经过、穿过”；此处与“营的当中”连用，表达在营地内部穿行。
lexical_decisions:
- source_word: וַיְהִי
  choice: （不单独译出，以时间从句承载叙事衔接）
  rationale: 这里的叙事形式用于引出下一件事。现代汉语无需采用“事情发生了”之类生硬套语，直接以“三天期满”自然衔接上下文。
- source_word: מִקְצֵה
  choice: 期满
  rationale: 该表达指一个时段达到末尾。“期满”简洁保留了时间界限，比宽泛的“过了”更贴近原文。
- source_word: שְׁלֹשֶׁת יָמִים
  choice: 三天
  rationale: 原文是直接的基数词加时间名词，照常译为“三天”。
- source_word: וַיַּעַבְרוּ
  choice: 走遍
  rationale: עבר在此与“营中”连用，描述官员在营地内部穿行，而不是越过河流等边界。“走遍”也能自然表达他们在营中各处传达命令的场景；“从营中经过”作为较贴近字面的可能译法收入脚注。
- source_word: הַשֹּׁטְרִים
  choice: 官员们
  rationale: שֹׁטְרִים指负责传达并执行命令的行政人员。“官员”是现代、清楚且不过度限定其具体职衔的称呼。
- source_word: בְּקֶרֶב
  choice: 营中
  rationale: 该词表示某处的内部或当中；与移动动词连用时，“营中”自然表达在营地内部穿行。
- source_word: הַמַּחֲנֶה
  choice: 营
  rationale: 此处指以色列人的营地。“营中”是简洁自然的现代汉语表达。
