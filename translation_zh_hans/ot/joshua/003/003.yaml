revisions:
- from: 他们吩咐百姓说：“你们看见耶和华你们上帝的约柜，又看见利未祭司[a]抬着约柜时，就要从所在的地方出发，跟在约柜后面走。”
  to: 他们吩咐百姓说：“你们看见耶和华你们上帝的约柜，以及抬着它的利未祭司[a]时，就要从你们所在的地方出发，跟在约柜后面走。”
  rationale: 修订仅调整中文句法和代词信息：以“以及抬着它的……”对应原文中与约柜相连的分词短语，并补足“你们所在的”以反映第二人称复数所属。神名、约柜、祭司身分及跟随约柜的空间意象均予保留。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T05:20:38Z'
