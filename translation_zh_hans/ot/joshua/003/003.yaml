source:
  edition: WLC
  text: וַ/יְצַוּוּ֮ אֶת הָ/עָ֣ם לֵ/אמֹר֒ כִּ/רְאֽוֹתְ/כֶ֗ם אֵ֣ת אֲר֤וֹן בְּרִית יְהוָה֙ אֱלֹ֣הֵי/כֶ֔ם וְ/הַ/כֹּֽהֲנִים֙ הַ/לְוִיִּ֔ם נֹשְׂאִ֖ים אֹת֑/וֹ וְ/אַתֶּ֗ם תִּסְעוּ֙ מִ/מְּק֣וֹמְ/כֶ֔ם וַ/הֲלַכְתֶּ֖ם אַחֲרָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/003/003.yaml
  text: And they commanded the people[a], saying, “When you see the ark of the covenant of Yahweh your God, and the Levitical priests carrying it, then you shall set out from your place and go after it.”
translation:
  language: zh_hans
  text: 他们吩咐百姓说：“你们看见耶和华你们上帝的约柜，以及抬着它的利未祭司[a]时，就要从你们所在的地方出发，跟在约柜后面走。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“祭司，即利未人”。
    reason: 原文 הַכֹּהֲנִים הַלְוִיִּם 可按同位结构直译；正文采用较自然的“利未祭司”。
lexical_decisions:
- source_word: וַיְצַוּוּ
  choice: 他们吩咐
  rationale: 此处 צוה 的加强词干表达权威性的命令；“吩咐”在现代汉语中庄重、自然，又保留命令意味。
- source_word: כִּרְאוֹתְכֶם
  choice: 你们看见……时
  rationale: כ 加不定式在此表示时间关系；译作“……时”自然，且不额外强化为“一……就”。
- source_word: אֲרוֹן בְּרִית יְהוָה אֱלֹהֵיכֶם
  choice: 耶和华你们上帝的约柜
  rationale: 保留原文的所属关系和圣约称谓；“约柜”是准确且通行的现代中文表达。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经传统中广为人知的专名形式呈现四字神名，而不以头衔代替。
- source_word: הַכֹּהֲנִים הַלְוִיִּם
  choice: 利未祭司
  rationale: 将两个名词理解为同位限定，即祭司是利未人；“利未祭司”简洁自然，同时用脚注保存原文可直译的同位结构。
- source_word: נֹשְׂאִים אֹתוֹ
  choice: 抬着约柜
  rationale: נשא 在此指抬运；中文重复“约柜”比使用可能指代不清的“它”更自然。
- source_word: תִּסְעוּ מִמְּקוֹמְכֶם
  choice: 从所在的地方出发
  rationale: נסע 表示启程，מקום 含义宽泛；此译不擅自具体化为“拔营”。
- source_word: וַהֲלַכְתֶּם אַחֲרָיו
  choice: 跟在约柜后面走
  rationale: 保留 הלך אחרי 的空间图像，并明确代词所指，避免中文读者误以为跟随祭司。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名，正文以中文读者最熟悉的专名“耶和华”呈现，不用“主”等称号替代；“雅威”是依据学界常见拟音的另一可行形式。
- issue: הַכֹּהֲנִים הַלְוִיִּם 的句法关系
  choice: 利未祭司
  alternative: 祭司，就是利未人
  rationale: 正文采用自然的限定表达，理解为同一群体而非祭司与利未人两个群体；脚注保留原文同位结构的另一种译法。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“所在的地方”避免将宽泛的 מקום 限定为营地；末句重复“约柜”，使指代清楚，并保留跟在其后的空间意象。
