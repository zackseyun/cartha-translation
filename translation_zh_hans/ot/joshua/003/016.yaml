revisions:
- from: 从上游流下来的水停住了[a]，在很远的地方，就是在撒拉但旁边的亚当城，立起成了一垒；而流向亚拉巴海，就是盐海的水，则完全断绝了[b]。百姓就在耶利哥对面过了河。
  to: 从上游流下来的水停住了[a]；它们在远方的亚当城——那城在撒拉但旁边——聚成一堆，高高立起。流向亚拉巴海，就是盐海的水，都完全断绝了[b]；百姓就在耶利哥对面渡过。
  rationale: 修订只调整中文句法和脚注a的替代译法。“在远方的亚当城”对应“很远，在亚当”，破折号中的说明对应“那城在撒拉但旁边”；“聚成一堆，高高立起”保留“起来，成为一垒”的双重图像。下游水“都完全断绝了”保留两个希伯来动词所加强的彻底停止；“渡过”保留百姓越过约旦河的叙事含义。
