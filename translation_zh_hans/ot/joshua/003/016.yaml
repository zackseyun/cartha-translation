source:
  edition: WLC
  text: וַ/יַּעַמְד֡וּ הַ/מַּיִם֩ הַ/יֹּרְדִ֨ים מִ/לְ/מַ֜עְלָ/ה קָ֣מוּ נֵד אֶחָ֗ד הַרְחֵ֨ק מְאֹ֜ד ב/אדם הָ/עִיר֙ אֲשֶׁר֙ מִ/צַּ֣ד צָֽרְתָ֔ן וְ/הַ/יֹּרְדִ֗ים עַ֣ל יָ֧ם הָ/עֲרָבָ֛ה יָם הַ/מֶּ֖לַח תַּ֣מּוּ נִכְרָ֑תוּ וְ/הָ/עָ֥ם עָבְר֖וּ נֶ֥גֶד יְרִיחֽוֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/003/016.yaml
  text: the waters flowing down from above stood still[a]; they rose up in one heap, very far away, at Adam, the city beside Zarethan. And those flowing down toward the Sea of the Arabah, the Salt Sea, were completely cut off[b], and the people crossed over opposite Jericho.
translation:
  language: zh_hans
  text: 从上游流下来的水停住了[a]；它们在远方的亚当城——那城在撒拉但旁边——聚成一堆，高高立起。流向亚拉巴海，就是盐海的水，都完全断绝了[b]；百姓就在耶利哥对面渡过。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“它们立成一堆。”希伯来文描绘水聚集成一道直立的堆垒。
    reason: lexical_alternative
  - marker: b
    text: “盐海”就是后来通常所称的死海。
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעַמְדוּ
  choice: 停住了
  rationale: עמד在此描述河水停止正常流动；“停住了”符合现代汉语，同时保留其站定、止住的语义。
- source_word: הַמַּיִם הַיֹּרְדִים מִלְמַעְלָה
  choice: 从上游流下来的水
  rationale: מִלְמַעְלָה字面为“从上面”，在河流地理语境中指上游；译为“从上游流下来的水”自然且方向明确。
- source_word: קָמוּ נֵד אֶחָד
  choice: 立起成了一垒
  rationale: קום与נֵד共同描绘水聚集并直立为单一堆垒；“一垒”保留具体、奇异的水墙意象，避免仅释作水位上涨。
- source_word: הַרְחֵק מְאֹד
  choice: 在很远的地方
  rationale: 保留原文对距离的强烈强调，并采用自然的现代汉语表达。
- source_word: בְאָדָם
  choice: 在亚当城
  rationale: אָדָם在这里是地名，不是“人”或人名亚当；结合后面的“城”，译作“亚当城”可防止误读。
- source_word: הָעִיר אֲשֶׁר מִצַּד צָרְתָן
  choice: 撒拉但旁边的亚当城
  rationale: מִצַּד表达邻近、在旁；此译简洁保留两地的方位关系。
- source_word: וְהַיֹּרְדִים עַל יָם הָעֲרָבָה
  choice: 而流向亚拉巴海的水
  rationale: 分词承接“水”，עַל在此具有朝向水体的方向义；补出“水”使中文指代清楚。
- source_word: יָם הַמֶּלַח
  choice: 盐海
  rationale: 按希伯来语地理名称直译，不在正文中用后世通称替代。
- source_word: תַּמּוּ נִכְרָתוּ
  choice: 完全断绝了
  rationale: 两个并列动词共同强化下流水流彻底终止；“完全断绝”传达累积语力，又不显得重复生硬。
- source_word: וְהָעָם עָבְרוּ
  choice: 百姓……过了河
  rationale: עבר在此指渡过约旦河；中文补出语境中明确的“河”，使句意自然清楚。
- source_word: נֶגֶד יְרִיחוֹ
  choice: 在耶利哥对面
  rationale: נֶגֶד表示面对、相对的位置；“耶利哥对面”准确保留地理关系。
theological_decisions:
- issue: 水聚集的神迹图像
  choice: 保留“停住”与“立起成了一垒”两个动作
  alternative: 合并译为“水停住，堆积起来”
  rationale: 原文先用עמד描述水止住，继而用קום与נֵד描写水形成单一堆垒；分别表达可保留叙事张力和具体图像，而不对神迹机制另作解释。
translation_notes:
  register: 采用现代、庄重而易懂的叙事体。“亚拉巴海，就是盐海”保留原文同位说明；地名使用当代中文圣经读者较熟悉的译名。正文中的[a]、[b]与脚注逐一对应。
