base_translation:
  language: en
  yaml_path: translation/ot/joshua/003/001.yaml
  text: Joshua rose early in the morning[a], and they set out from Shittim and came to the Jordan, he and all the sons of Israel, and they spent the night there before they crossed over.
translation:
  language: zh_hans
  text: 约书亚清早起来，便与以色列众人[a]从什亭出发，来到约旦河边；他们在渡河以前，就在那里过夜。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“所有以色列人”。希伯来文直译为“以色列的众子”。
    reason: 说明בְּנֵי יִשְׂרָאֵל为民族群体的固定亲属称谓；正文采用自然的集合表达，脚注保留其字面形式。
lexical_decisions:
- source_word: וַיַּשְׁכֵּם בַּבֹּקֶר
  choice: 清早起来
  rationale: שׁכם的使役词干在叙事中通常表示“早起”；“清早起来”自然、简洁，也保留了בַּבֹּקֶר所强调的清晨时段。
- source_word: וַיִּסְעוּ
  choice: 出发
  rationale: נסע在行旅叙事中常指拔营启程；“出发”符合现代汉语表达，又不额外加入原文未明说的“拔营”。
- source_word: מֵהַשִּׁטִּים
  choice: 从什亭
  rationale: שִּׁטִּים在此是地名，采用通行音译“什亭”，不按其词义译作“皂荚树谷”等。
- source_word: וַיָּבֹאוּ עַד הַיַּרְדֵּן
  choice: 来到约旦河边
  rationale: עַד表示到达约旦河这一界点；“来到约旦河边”在汉语中自然，并清楚表明他们尚未渡河。
- source_word: הוּא וְכָל־בְּנֵי יִשְׂרָאֵל
  choice: 他和以色列众子孙
  rationale: 保留הוּא对约书亚的明确复指；“以色列众子孙”既反映בְּנֵי的亲属称谓形式，也能自然表示雅各（以色列）的后裔群体。
- source_word: וַיָּלִנוּ שָׁם
  choice: 就在那里过夜
  rationale: לון在此指留宿一夜；“过夜”是清楚、现代而庄重的汉语。
- source_word: טֶרֶם יַעֲבֹרוּ
  choice: 他们渡河以前
  rationale: טֶרֶם表示某事发生之前；结合约旦河语境，将עבר译作“渡河”，明确而不增添目的或结果。
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל的表达
  choice: 以色列众子孙
  alternative: 所有以色列人
  rationale: 这里没有实质性的教义分歧，但原文采用男性复数亲属称谓。正文用“以色列众子孙”显出其后裔群体的源语形式，同时用脚注提供更惯用的集合称呼，避免把该群体误解为仅限成年男性。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。短句与分号呈现希伯来文连续动作的推进；地名使用通行圣经译名。脚注标记紧接其实际所说明的“以色列众子孙”，而不沿用英文材料中位置不相符的标记。
