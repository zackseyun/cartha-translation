  yaml_path: translation/ot/joshua/003/012.yaml
  text: Now take for yourselves twelve men from the tribes of Israel[a], one man from each tribe.
translation:
  language: zh_hans
  text: 现在，你们要从以色列各支派中选十二个人，每个支派一人。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“一人，一人，归于每个支派”，这是分配式表达，意思是每个支派选一名代表。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: 现在
  rationale: 承接上文并引出下一项指示；现代汉语用“现在”即可自然表达这一话语转折，无须机械译出连接词“和”。
- source_word: קְחוּ לָכֶם
  choice: 你们要……选
  rationale: לקח 在此语境中指选取代表；“选”比字面的“取”更符合现代汉语。主语“你们”体现复数命令对象，לָכֶם 所含“为你们自己”的利益与用途色彩由语境自然承载。
- source_word: שְׁנֵי עָשָׂר אִישׁ
  choice: 十二个人
  rationale: 原文 אִישׁ 在此指从各支派中选出的男性代表；汉语“十二个人”自然清楚，且本节后半句的“一人”保持了原文称谓的一致性。
- source_word: מִשִּׁבְטֵי יִשְׂרָאֵל
  choice: 从以色列各支派中
  rationale: 准确表达来源范围；“各支派”也为下文逐支派选取一人的分配关系作铺垫。
- source_word: אִישׁ אֶחָד אִישׁ אֶחָד לַשָּׁבֶט
  choice: 每个支派一人
  rationale: 原文重复“一人、一人”构成分配表达，意思是每个支派各有一名代表；此译法符合现代汉语习惯，并保留逐支派选取的重点。
