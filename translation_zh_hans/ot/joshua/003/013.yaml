  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/הָיָ֡ה כְּ/נ֣וֹחַ כַּפּ֣וֹת רַגְלֵ֣י הַ/כֹּהֲנִ֡ים נֹשְׂאֵי֩ אֲר֨וֹן יְהוָ֜ה אֲד֤וֹן כָּל הָ/אָ֨רֶץ֙ בְּ/מֵ֣י הַ/יַּרְדֵּ֔ן מֵ֤י הַ/יַּרְדֵּן֙ יִכָּ֣רֵת֔וּ/ן הַ/מַּ֥יִם הַ/יֹּרְדִ֖ים מִ/לְ/מָ֑עְלָ/ה וְ/יַעַמְד֖וּ נֵ֥ד אֶחָֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/003/013.yaml
  text: And when the soles of the feet of the priests carrying the ark of Yahweh[a], the Lord of all the earth, come to rest in the waters of the Jordan, the waters flowing down from above will be cut off in the Jordan[b], and they will stand in one heap.
translation:
  language: zh_hans
  text: 当抬着雅威[a]——全地之主——的约柜的祭司脚掌一落在约旦河水中，约旦河中从上方流下来的水[b]就会断绝，并直立成一堆。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可理解为“全地之主的约柜”。希伯来语可把“全地之主”与“约柜”的所属关系联系得更紧密；正文则把它看作雅威的同位称号。
    reason: alternative_reading
  - marker: b
    text: 也可译作“从上游流下来的水”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כְּנוֹחַ
  choice: 当……一落在
  rationale: 该结构引出即将发生的条件和结果；“一……就……”自然表达 כְּ־ 的时间意味，也保留脚掌接触水面后事件随即发生的语气。
- source_word: כַּפּוֹת רַגְלֵי
  choice: 脚掌
  rationale: כַּף 在此指脚底；现代汉语用“脚掌”既准确又简洁。
- source_word: הַכֹּהֲנִים נֹשְׂאֵי אֲרוֹן
  choice: 抬着……约柜的祭司
  rationale: נשׂא 的分词描述祭司正在搬抬约柜；“抬着”符合多人搬运约柜的具体场景。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文直接音译上帝的专名，不以头衔替代。
- source_word: אֲדוֹן כָּל הָאָרֶץ
  choice: 全地之主
  rationale: אֲדוֹן 表示主宰、主人；“全地之主”庄重自然，并保留其作为雅威之称号的主要读法。
- source_word: בְּמֵי הַיַּרְדֵּן
  choice: 落在约旦河水里
  rationale: בְּ־ 在此表示脚掌进入并停落于河水之中；译文把方位关系融入汉语动词结构。
- source_word: יִכָּרֵתוּן
  choice: 就会断绝
  rationale: כרת 的尼法勒形式表示被截断、断绝；“断绝”保留原文鲜明的截断意象，而不弱化为普通的“停止”。
- source_word: הַמַּיִם הַיֹּרְדִים מִלְמָעְלָה
  choice: 从上方流下来的水
  rationale: 较贴近字面保留“从上方”和“下行”的空间意象；河流语境下也可理解为从上游而来，故列入脚注。
- source_word: וְיַעַמְדוּ נֵד אֶחָד
  choice: 立成一堆
  rationale: נֵד 指堆积起来的一团或一垒，尤可用于水；“立成一堆”保留水竖立并聚集的神迹性画面。
theological_decisions:
- issue: 如何译写神名 יְהוָה
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文使用四字神名；“雅威”直接呈现专名，同时避免以一般头衔“主”取代。
- issue: “全地之主”与前文的句法关系
  choice: 用破折号把它作为“雅威”的同位称号
  alternative: 与“约柜”更紧密地连读为“全地之主雅威的约柜”
  rationale: 希伯来语词序容许不同的结构侧重。正文采用较可能的同位语读法，但用脚注保留另一种连读方式，不消除原文的句法张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“一落在……就会……”使条件与结果清晰；“立成一堆”刻意保留原文超常而具体的水体堆立意象。所有脚注标记均已置于正文相应位置。
