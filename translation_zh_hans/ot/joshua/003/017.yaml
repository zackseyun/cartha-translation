source:
  edition: WLC
  text: וַ/יַּעַמְד֣וּ הַ/כֹּהֲנִ֡ים נֹ֠שְׂאֵי הָ/אָר֨וֹן בְּרִית יְהוָ֜ה בֶּ/חָֽרָבָ֛ה בְּ/ת֥וֹךְ הַ/יַּרְדֵּ֖ן הָכֵ֑ן וְ/כָל יִשְׂרָאֵ֗ל עֹֽבְרִים֙ בֶּ/חָ֣רָבָ֔ה עַ֤ד אֲשֶׁר תַּ֨מּוּ֙ כָּל הַ/גּ֔וֹי לַ/עֲבֹ֖ר אֶת הַ/יַּרְדֵּֽן־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/003/017.yaml
  text: And the priests carrying the ark of the covenant of Yahweh stood firmly on dry ground in the middle of the Jordan[c][b][a], while all Israel was crossing on dry ground until the whole nation had finished crossing the Jordan.
translation:
  language: zh_hans
  text: 抬着雅威之约柜[a]的祭司稳稳地[b]站在约旦河中央的干地上；以色列众人都在干地上过河，直到全民族[c]都过了约旦河。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“雅威之约的柜”；也可按中文惯用表达译作“雅威的约柜”。
    reason: 希伯来语为连续属格结构，中文可以采用不同的结构层次来表达。
  - marker: b
    text: 希伯来语意为“稳固地”；强调祭司在河床上站定不动。
    reason: 说明副词 הָכֵן 在本句中的语义，并保留其可能表达的稳定、坚定意味。
  - marker: c
    text: 也可译作“全体百姓”。原文用单数集合名词指整个以色列民族。
    reason: גּוֹי 既可译为“民族”，在此也可按集合意义译为“百姓”。
lexical_decisions:
- source_word: וַיַּעַמְדוּ
  choice: 站
  rationale: 该动词表示处于或保持站立状态；结合副词 הָכֵן，译为“稳稳地站”既自然，也保留祭司始终站定的含义。
- source_word: הַכֹּהֲנִים נֹשְׂאֵי
  choice: 抬着……的祭司
  rationale: 分词 נֹשְׂאֵי 表示当时持续进行的动作；约柜由多人共同搬运，现代汉语用“抬着”比笼统的“拿着”准确。
- source_word: הָאָרוֹן בְּרִית יְהוָה
  choice: 雅威之约柜
  rationale: 保留“柜—约—雅威”的构词关系，同时采用现代中文中简洁、可懂的“约柜”表达。
- source_word: יְהוָה
  choice: 雅威
  rationale: 这是神的专名四字神名，采用其常见学术音译“雅威”，不以称号代替专名。
- source_word: בֶּחָרָבָה
  choice: 在干地上／从干地上
  rationale: 该词指水退后显露的干地；两处按各自介词和句法分别译为“在干地上”和“从干地上”，保持重复及神迹语境。
- source_word: בְּתוֹךְ הַיַּרְדֵּן
  choice: 在约旦河中央
  rationale: בְּתוֹךְ 表示内部或中间；“约旦河中央”在现代汉语中清楚自然。
- source_word: הָכֵן
  choice: 稳稳地
  rationale: 此处指稳固、坚定地站定，而不是“预备好”；叠词形式自然传达持续不动的状态。
- source_word: וְכָל יִשְׂרָאֵל עֹבְרִים
  choice: 以色列众人都从干地上过去
  rationale: 分词 עֹבְרִים 描写与祭司站立同时持续进行的过河行动；汉语无需另加“同时”也能清楚表达。
- source_word: עַד אֲשֶׁר תַּמּוּ
  choice: 直到……都过了
  rationale: תַּמּוּ 表示行动达到完成；结合后面的不定式，汉语用“直到……都过了”简洁自然。
- source_word: כָּל הַגּוֹי
  choice: 全民族
  rationale: גּוֹי 在此以单数集合名词指以色列整体；“全民族”保留其整体性，避免将其误解为若干外邦民族。
- source_word: לַעֲבֹר אֶת הַיַּרְדֵּן
  choice: 过了约旦河
  rationale: ל 加不定式说明完成的行动；汉语以“都过了约旦河”表达完成体最为顺畅。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名，正文以较贴近其古代读音的“雅威”音译，保留专名性质；“耶和华”是中文传统形式，但源于较晚的混合读法。
- issue: “约柜”与雅威之约的关系
  choice: 雅威之约柜
  alternative: 雅威的约柜／雅威之约的柜
  rationale: 希伯来语连续属格结构可从不同层次理解；正文采用中文惯用而仍保留“约”的表达，不进一步界定为所有关系或立约动作。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“稳稳地站”比“坚定地站立”更符合具体场景；分号区分祭司站定与全体以色列过河这两个同时进行的动作。
