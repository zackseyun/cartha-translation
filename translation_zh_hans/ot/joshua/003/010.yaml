source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יְהוֹשֻׁ֔עַ בְּ/זֹאת֙ תֵּֽדְע֔וּ/ן כִּ֛י אֵ֥ל חַ֖י בְּ/קִרְבְּ/כֶ֑ם וְ/הוֹרֵ֣שׁ יוֹרִ֣ישׁ מִ֠/פְּנֵי/כֶם אֶת הַ/כְּנַעֲנִ֨י וְ/אֶת הַ/חִתִּ֜י וְ/אֶת הַ/חִוִּ֗י וְ/אֶת הַ/פְּרִזִּי֙ וְ/אֶת הַ/גִּרְגָּשִׁ֔י וְ/הָ/אֱמֹרִ֖י וְ/הַ/יְבוּסִֽי־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/003/010.yaml
  text: And Joshua said[a], “By this you will know that the living God is among you, and that he will surely drive out from before you the Canaanites, the Hittites, the Hivites, the Perizzites, the Girgashites, the Amorites, and the Jebusites.”
translation:
  language: zh_hans
  text: 约书亚说：“你们由此就会知道，永活的上帝在你们中间，并且他必定会把迦南人、赫人、希未人、比利洗人、革迦撒人、亚摩利人和耶布斯人从你们面前赶出去[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“使他们失去土地”。原文动词在这里强调他们必定会从这地被除去。
    reason: 保留 ירש 使役形既可指“赶出”，也可突出“使其失去土地”的词义范围。
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 约书亚说
  rationale: 用现代汉语自然的叙事表达承接上下文；希伯来语叙事形式本身不要求明确译出“于是”或“然后”
- source_word: בְּזֹאת
  choice: 由此
  rationale: 表达以即将发生的事作为认识凭据，既贴近原文的工具性含义，也符合现代汉语习惯
- source_word: תֵּדְעוּן
  choice: 你们……会知道
  rationale: 第二人称复数未完成式在此具有将来指向；“会知道”自然保留其预告意味
- source_word: אֵל חַי
  choice: 永活的上帝
  rationale: 原文直指活着的神；“永活”是庄重而通顺的汉语表达，并显出他与无生命之神明的对比，但不额外引入神名
- source_word: בְּקִרְבְּכֶם
  choice: 在你们中间
  rationale: 指上帝临在于群体当中，避免“在你们里面”可能造成的个人内在化误解
- source_word: וְהוֹרֵשׁ יוֹרִישׁ
  choice: 必定会……赶出去
  rationale: 原文不定式绝对形与限定动词连用，强调行动的确定性；“赶出去”直接表达从土地上除去这些民族
- source_word: מִפְּנֵיכֶם
  choice: 从你们面前
  rationale: 保留原文空间意象，表达这些民族将从以色列人前方被除去
- source_word: הַכְּנַעֲנִי וְאֶת הַחִתִּי וְאֶת הַחִוִּי וְאֶת הַפְּרִזִּי וְאֶת הַגִּרְגָּשִׁי וְהָאֱמֹרִי וְהַיְבוּסִי
  choice: 迦南人、赫人、希未人、比利洗人、革迦撒人、亚摩利人和耶布斯人
  rationale: 各词在形态上是单数集合名词，汉语以“人”自然表示相应族群；名称采用简体中文圣经读者熟悉的通行译名
theological_decisions:
- issue: אֵל חַי 的神学称谓
  choice: 永活的上帝
  alternative: 活着的神
  rationale: 本节写的是 אֵל 而非四字神名；译作“上帝”忠实于本节实际用词。“永活”以自然庄重的方式表达其真实生命，不把四字神名擅自补入经文
- issue: 征服动词 וְהוֹרֵשׁ יוֹרִישׁ 的力度
  choice: 必定会……赶出去
  alternative: 必定会使……失去土地
  rationale: 保留原文所强调的确定、强制性移除，不淡化征服行动，也不加入经文本身未说明的辩护或解释
translation_notes:
  register: 采用现代、清楚而庄重的普通话。“由此”“在你们中间”“必定会”兼顾可读性与原文结构；族名沿用简体中文传统译名。
