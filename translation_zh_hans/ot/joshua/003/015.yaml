base_translation:
  language: en
  yaml_path: translation/ot/joshua/003/015.yaml
  text: And when those carrying the ark came as far as the Jordan[a], and the feet of the priests carrying the ark were dipped in the edge of the water (now the Jordan was full over all its banks all the days of harvest)[b],
translation:
  language: zh_hans
  text: 抬约柜的人来到约旦河边时，那些抬约柜的祭司的脚刚浸入岸边的水中[a]（原来在整个收割季节，约旦河水都漫过两岸[b]），
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“在水的边缘（或尽头）”；意思是祭司的脚进入了岸边的水中。
    reason: lexical_alternative
  - marker: b
    text: 也就是说，收割季节的约旦河正处于涨水泛滥期。
    reason: cultural_note
lexical_decisions:
- source_word: וּכְב֞וֹא
  choice: ……来到……时
  rationale: 介词 כְּ 与不定词构成时间从句；译为“……时”自然地表达事件发生的先后关系。
- source_word: נֹשְׂאֵי הָאָרוֹן
  choice: 抬约柜的人
  rationale: 分词表示正在承担抬约柜职责的人；“抬”符合汉语对多人搬运礼仪器物的常用表达。
- source_word: עַד הַיַּרְדֵּן
  choice: 来到约旦河边
  rationale: עַד 表示移动达到某一点；上下文表明所到之处是河水边缘，因此补出“边”以避免误解为进入河中。
- source_word: וְרַגְלֵי הַכֹּהֲנִים
  choice: 祭司双脚
  rationale: 忠实表达原文以“脚”为主语的结构；汉语用“双脚”自然，也符合此处所指。
- source_word: נֹשְׂאֵי הָאָרוֹן
  choice: 抬约柜的
  rationale: 保留原文重复的分词短语，用来限定这里所说的是哪些祭司。
- source_word: נִטְבְּלוּ
  choice: 浸入
  rationale: טבל 的尼法勒式表示被蘸入或浸入；“浸入”比“碰到”准确，同时并不暗示全身没入水中。
- source_word: בִּקְצֵה הַמָּיִם
  choice: 水边的水中
  rationale: 该短语直指水域的边缘；此译法既说明祭司的脚确实入水，又保持现代汉语自然。
- source_word: וְהַיַּרְדֵּן מָלֵא עַל כָּל גְּדוֹתָיו
  choice: 原来……约旦河水都漫过两岸
  rationale: 这是补充背景的插入说明。“漫过两岸”自然表达河水涨满并越过河岸的景象。
- source_word: כֹּל יְמֵי קָצִיר
  choice: 在整个收割季节
  rationale: 表达收割期的全部时段；“收割季节”比逐字译作“收割的所有日子”更符合现代汉语。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。保留原文两次提到“抬约柜”的重复，并用括号呈现关于约旦河水势的背景插入语；句末逗号保留本节与下一节在句法上的连续性。
