  text: הִנֵּה֙ אֲר֣וֹן הַ/בְּרִ֔ית אֲד֖וֹן כָּל הָ/אָ֑רֶץ עֹבֵ֥ר לִ/פְנֵי/כֶ֖ם בַּ/יַּרְדֵּֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/003/011.yaml
  text: Look[a], the ark of the covenant, the Lord of all the earth, is crossing ahead of you in the Jordan.
translation:
  language: zh_hans
  text: 看哪，全地之主的约柜正在你们前面渡过约旦河。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文也可较直译为“正在你们前面越过，在约旦河中”。这里的介词可按形式译为“在……中”；正文则按渡河语境译为“渡过约旦河”。
    reason: 保留介词ב的形式对应，并避免弱化“越过／渡过”的动作含义。
lexical_decisions:
- source_word: הִנֵּה
  choice: 看哪
  rationale: 这是唤起注意的语气词。“看哪”既保留原文的现场感和庄重语气，也为现代读者所熟悉。
- source_word: אֲרוֹן הַבְּרִית
  choice: 约柜
  rationale: 直译为“约的柜”，但“约柜”是简洁、自然且通行的现代汉语表达，清楚指向承载立约凭证的圣柜。
- source_word: אֲדוֹן כָּל הָאָרֶץ
  choice: 全地之主
  rationale: אָדוֹן在这里是表示统治权的尊称。“全地之主”保留其庄重性和普世主权的含义，又不添加原文之外的教义说明。
- source_word: עֹבֵר
  choice: 正在……渡过
  rationale: 分词使动作显得正在发生或即将发生；结合河流场景，“正在渡过”比一般性的“经过”更清楚自然。
- source_word: לִפְנֵיכֶם
  choice: 在你们前面
  rationale: 既可表示空间上的前方，也表达约柜先于百姓行动，贴合当前叙事情境。
- source_word: בַּיַּרְדֵּן
  choice: 渡过约旦河
  rationale: 介词ב字面上常表示“在……中”，但与“经过、越过”类动词连用时，此处自然表达在约旦河中完成渡越的动作。正文采用合乎现代汉语习惯的表达，脚注保留较贴近形式的译法。
theological_decisions:
- issue: אֲדוֹן כָּל הָאָרֶץ与אֲרוֹן הַבְּרִית的关系
  choice: 全地之主的约柜
  alternative: 约柜，就是全地之主
  rationale: 希伯来语将两个短语直接并置，形式上较为凝练；按上下文，称号“全地之主”指耶和华，而约柜代表他的临在并在百姓前面行。译作“全地之主的约柜”在汉语中最自然，也避免把约柜本身直接等同于上帝。
- issue: “全地之主”的称号
  choice: 主
  alternative: 主人
  rationale: “主”能自然表达统治权并保留经文的庄重语体；“主人”在现代汉语中容易使人想到个人所有关系，不能充分传达这里的主权称号。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“看哪”保留宣告式现场感；句子整体简洁，适合公开诵读。
