base_translation:
  language: en
  yaml_path: translation/ot/joshua/003/014.yaml
  text: And it happened[a], when the people set out from their tents to cross the Jordan, and the priests carrying the ark of the covenant were before the people,
translation:
  language: zh_hans
  text: 百姓离开自己的帐篷，出发要过约旦河时，抬着约柜的祭司走在百姓前面[a]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在百姓之前”。
    reason: לִפְנֵי可较直译为“在……之前”，也可按行进语境自然译作“走在……前面”。
lexical_decisions:
- source_word: וַיְהִי בִּנְסֹעַ
  choice: ……出发……时
  rationale: וַיְהִי与带בּ的动词不定式共同构成希伯来叙事中常见的时间引介。现代汉语用“……时”自然表达这一功能，无须生硬直译为“事情发生了”。
- source_word: הָעָם
  choice: 百姓
  rationale: 在本叙事中指作为整体的以色列民；“百姓”符合现代中文圣经叙事的庄重语体。
- source_word: מֵאָהֳלֵיהֶם
  choice: 离开自己的帐篷
  rationale: 保留אֹהֶל“帐篷”的具体含义，并用“自己的”自然表达第三人称复数所属关系。
- source_word: לַעֲבֹר אֶת־הַיַּרְדֵּן
  choice: 要过约旦河
  rationale: ל加不定式表达目的；“要过”简洁呈现目的意图。中文地名补出“河”，可清楚表明约旦是河流。
- source_word: וְהַכֹּהֲנִים נֹשְׂאֵי
  choice: 抬着……的祭司
  rationale: נֹשְׂאֵי是承载者的分词构造；译为定语结构，既贴近原文关系，也符合自然汉语。
- source_word: הָאָרוֹן הַבְּרִית
  choice: 约柜
  rationale: 原文直义为“约的柜”；“约柜”是准确、简洁且具有经文连贯性的惯用译法。
- source_word: לִפְנֵי הָעָם
  choice: 走在百姓前面
  rationale: לִפְנֵי表示空间上的“在……前面”。补出“走”使行进场景在汉语中自然清楚，而不改变其位置关系。
theological_decisions: []
