  text: וַ/יֹּ֥אמֶר יְהוֹשֻׁ֖עַ אֶל בְּנֵ֣י יִשְׂרָאֵ֑ל גֹּ֣שׁוּ הֵ֔נָּה וְ/שִׁמְע֕וּ אֶת דִּבְרֵ֖י יְהוָ֥ה אֱלֹֽהֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/003/009.yaml
  text: Joshua said to the sons of Israel[a], “Come here and hear the words of Yahweh your God.”
translation:
  language: zh_hans
  text: 约书亚对以色列人说：“你们到这里来，听耶和华你们的上帝的话。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: 叙事中引出直接引语的常用表达；现代汉语用“说”自然准确。
- source_word: יְהוֹשֻׁעַ
  choice: 约书亚
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 该词组字面为“以色列的众子”，在这里是指以色列民族的惯用称谓；“以色列人”在现代汉语中自然、准确，也不误限为男性。
- source_word: גֹּשׁוּ הֵנָּה
  choice: 你们到这里来
  rationale: 复数命令式与方向副词合起来表示向说话者所在之处靠近；“到这里来”保留方向意味并符合现代汉语表达。
- source_word: וְשִׁמְעוּ
  choice: 听
  rationale: שׁמע在此为复数命令式，既可指听见，也含认真聆听之意；上下文中译作“听”简洁直接。
- source_word: דִּבְרֵי
  choice: 话
  rationale: 构词形式意为“……的话语”；中文以“话”表达自然，同时保留其复数集合意义，无须解释性地译成“信息”。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文读者熟悉的专名形式呈现四字神名，不以“主”这一称号替代。
- source_word: אֱלֹהֵיכֶם
  choice: 你们的上帝
  rationale: 虽具复数词形，此处以以色列的神为单数所指，并带第二人称复数所属后缀；译作“你们的上帝”。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名，因此正文保留为专名而不改成“主”。“耶和华”是现代中文中辨识度最高且已约定俗成的形式；“雅威”较贴近学界常见的重构发音，但原始发音并不能完全确定。
- issue: בְּנֵי יִשְׂרָאֵל 的指称范围
  choice: 以色列人
  alternative: 以色列的众子／以色列子民
  rationale: 这是希伯来语中常见的民族集体称谓，此处面向全体以色列民，并非只强调男性后裔。译作“以色列人”既忠于实际指称，也避免中文“众子”造成不必要的性别限制或生硬感。
translation_notes:
  register: 采用庄重而通顺的现代标准普通话。“你们到这里来”明确保留复数命令和向说话者靠近的方向；句法简洁，适合公开宣读。
