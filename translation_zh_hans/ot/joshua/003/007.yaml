  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל יְהוֹשֻׁ֔עַ הַ/יּ֣וֹם הַ/זֶּ֗ה אָחֵל֙ גַּדֶּלְ/ךָ֔ בְּ/עֵינֵ֖י כָּל יִשְׂרָאֵ֑ל אֲשֶׁר֙ יֵֽדְע֔וּ/ן כִּ֗י כַּ/אֲשֶׁ֥ר הָיִ֛יתִי עִם מֹשֶׁ֖ה אֶהְיֶ֥ה עִמָּֽ/ךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/003/007.yaml
  text: And Yahweh said to Joshua[a], “Today I will begin to make you great in the sight of all Israel, so that they may know that just as I was with Moses, I will be with you.”
translation:
  language: zh_hans
  text: 雅威对约书亚说：“今天，我要开始使你在以色列众人眼中显为大[a]，使他们知道：我怎样与摩西同在，也必照样与你同在。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“今天我开始在以色列众人面前使你为大。”
    reason: 保留גַּדֶּלְךָ“使为大”及בְּעֵינֵי“在……眼中／面前”的较贴近字面表达。
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文中通行的专名“耶和华”对应四字神名，保留其作为以色列之神名字的功能，而不以“主”这一称号替代。
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: אמר的叙事性wayyiqtol形式在此自然译为“说”。
- source_word: הַיּוֹם הַזֶּה
  choice: 今天
  rationale: 原文直译为“这一天”；“今天”在现代汉语中自然，并保留时间上的强调。
- source_word: אָחֵל
  choice: 我要开始
  rationale: 该动词在此意为“开始”；结合宣告语境，用“我要开始”表达紧接着将展开的行动。
- source_word: גַּדֶּלְךָ
  choice: 使你……受尊崇
  rationale: גדל的Piel形式表示使某人为大、抬高其地位；“受尊崇”自然表达约书亚在全体以色列人面前获确立的威望。
- source_word: בְּעֵינֵי כָּל יִשְׂרָאֵל
  choice: 在以色列众人眼中
  rationale: 保留希伯来语“在……眼中”的习语，指众人的观感与公开认可。
- source_word: אֲשֶׁר יֵדְעוּן
  choice: 使他们知道
  rationale: 关系词与动词在此可表达目的或结果；“使他们知道”自然涵盖这一联系，而不作过细限定。
- source_word: כַּאֲשֶׁר הָיִיתִי עִם מֹשֶׁה
  choice: 我怎样与摩西同在
  rationale: כַּאֲשֶׁר引出对应比较；“怎样……也照样……”清楚保留摩西与约书亚之间的平行。
- source_word: אֶהְיֶה עִמָּךְ
  choice: 也必照样与你同在
  rationale: 未完成式在神的应许中表达将来的同在；“必”体现应许的确定性，“照样”承接前面的比较。
theological_decisions:
- issue: 四字神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用神名而非称号。中文正文采用读者最熟悉且具有专名功能的“耶和华”；“雅威”虽更接近现代学界常见的拟音，但尚未成为普通中文读者最通行的形式。
- issue: 约书亚被“使为大”的含义
  choice: 使你……受尊崇
  alternative: 使你为大／高举你
  rationale: 原文指神公开提升约书亚在以色列人心目中的地位与威望，并非宣称其本质变得伟大；“受尊崇”保留公开认可的语境。
- issue: אֲשֶׁר从句的逻辑关系
  choice: 使他们知道
  alternative: 好叫他们知道／以致他们知道
  rationale: 该从句可有目的或结果色彩；正文采用兼具使成与结果意味的表达，避免排他性地固定为其中一种。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。使用“以色列众人”指全体以色列民；比较句采用“怎样……也必照样……”以保留原文结构和神同在应许的力度。
