  text: וַ/יִּֽירְא֣וּ מְאֹ֔ד כִּ֣י עִ֤יר גְּדוֹלָה֙ גִּבְע֔וֹן כְּ/אַחַ֖ת עָרֵ֣י הַ/מַּמְלָכָ֑ה וְ/כִ֨י הִ֤יא גְדוֹלָה֙ מִן הָ/עַ֔י וְ/כָל אֲנָשֶׁ֖י/הָ גִּבֹּרִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/002.yaml
  text: And they feared greatly[a], because Gibeon was a great city, like one of the royal cities, and because it was greater than Ai, and all its men were mighty.
translation:
  language: zh_hans
  text: 他们就非常惧怕，因为基遍是一座大城，如同王城中的一座；又因为它比艾城大，城里所有的男子都是勇士[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“城里所有的男子都勇猛善战。”
    reason: גִּבֹּרִים既可作为名词指“勇士”，也可着重描述这些男子勇猛、有战斗力。
lexical_decisions:
- source_word: וַיִּירְאוּ מְאֹד
  choice: 他们就非常惧怕
  rationale: 将Qal叙事式动词译为“就……惧怕”，既承接上文的叙事进程，也保留מְאֹד的强烈程度；“惧怕”庄重而符合现代汉语。
- source_word: כִּי
  choice: 因为
  rationale: 此处引出他们惧怕的原因，用“因为”明确表达因果关系。
- source_word: עִיר גְּדוֹלָה גִּבְעוֹן
  choice: 基遍是一座大城
  rationale: “大城”既可涉及规模，也可暗含地位和重要性，没有把גְּדוֹלָה限缩为单纯的面积大小。地名采用通行译名“基遍”。
- source_word: כְּאַחַת עָרֵי הַמַּמְלָכָה
  choice: 像王城之一
  rationale: 该短语直指属于王国或具有王室地位的一类城；“王城之一”简洁自然，并保留比较结构。
- source_word: וְכִי הִיא גְדוֹלָה מִן הָעַי
  choice: 比艾城还大
  rationale: 延续前文“大”的用词，保留其可能兼指规模和重要性的宽度；“还”自然体现进一步说明。
- source_word: וְכָל אֲנָשֶׁיהָ גִּבֹּרִים
  choice: 城里所有的男子都是勇士
  rationale: אֲנָשֶׁיהָ在军事语境中指该城的男性人口，גִּבֹּרִים常指勇士或强有力的战士；此译准确呈现其军事含义。
theological_decisions: []
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“大城”保留原文在城市规模与地位之间的语义空间；分号使最后一项并列理由清晰，又不割裂原句。脚注标记置于其实际说明的“勇士”之后。
