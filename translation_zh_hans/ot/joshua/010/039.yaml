  text: וַֽ/יִּלְכְּדָ֞/הּ וְ/אֶת מַלְכָּ֤/הּ וְ/אֶת כָּל עָרֶ֨י/הָ֙ וַ/יַּכּ֣וּ/ם לְ/פִי חֶ֔רֶב וַֽ/יַּחֲרִ֨ימוּ֙ אֶת כָּל נֶ֣פֶשׁ אֲשֶׁר בָּ֔/הּ לֹ֥א הִשְׁאִ֖יר שָׂרִ֑יד כַּ/אֲשֶׁ֨ר עָשָׂ֜ה לְ/חֶבְר֗וֹן כֵּן עָשָׂ֤ה לִ/דְבִ֨רָ/ה֙ וּ/לְ/מַלְכָּ֔/הּ וְ/כַ/אֲשֶׁ֥ר עָשָׂ֛ה לְ/לִבְנָ֖ה וּ/לְ/מַלְכָּֽ/הּ־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/039.yaml
  text: And they captured it[a], along with its king and all its towns, and struck them with the edge of the sword, and they devoted to destruction every person who was in it; they left no survivor. Just as he had done to Hebron, so he did to Debir and its king, and just as he had done to Libnah and its king.
translation:
  language: zh_hans
  text: 他们攻取了底璧和它的王，又攻取了它所有的城镇；他们把他们都用刀杀了，并将城中所有的人尽行毁灭[a]，没有留下一个幸存者。他对底璧和它的王所做的，正如他对希伯仑所做的，也正如他对立拿和它的王所做的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “尽行毁灭”译自希伯来语ḥerem专门用语，指将对象交付彻底毁灭；也可译作“完全毁灭”。
    reason: 说明חרם的专门语义，并保留可行的词义替代。
lexical_decisions:
- source_word: וַיִּלְכְּדָהּ
  choice: 他们攻取了底璧
  rationale: לכד在军事语境中指攻取、夺取。希伯来语动词形式为第三人称阳性单数，但上下文随即使用复数动词，叙事在约书亚与以色列军队之间作代表性切换；中文以“他们”承接集体行动，并明确补出所指的底璧。
- source_word: וְאֶת מַלְכָּהּ וְאֶת כָּל עָרֶיהָ
  choice: 也攻取了它的王和所属的所有城镇
  rationale: 重复“攻取”使中文关系清楚；עיר可指城或城镇，此处是以底璧为中心的附属聚落，因此译作“所属的所有城镇”。
- source_word: וַיַּכּוּם לְפִי חֶרֶב
  choice: 他们用刀击杀城中众人
  rationale: לְפִי חֶרֶב字面为“用刀口/刀锋”，是以刀杀戮的惯用语。译文保留“用刀”，并按上下文将代词所指明示为城中众人，避免误解为王和城镇本身。
- source_word: וַיַּחֲרִימוּ
  choice: 尽行毁灭
  rationale: חרם的使役式在此表示将对象置于彻底毁灭之下，具有专门的战争用语色彩。“尽行毁灭”既表达彻底性，又不在正文中加入超出原文的教义说明；脚注提示其术语性质。
- source_word: אֶת כָּל נֶפֶשׁ אֲשֶׁר בָּהּ
  choice: 其中所有的人
  rationale: נפש在这里指人或居民，而不是非物质意义的“灵魂”；现代中文译作“所有的人”自然准确。
- source_word: לֹא הִשְׁאִיר שָׂרִיד
  choice: 一个幸存者也没有留下
  rationale: שָׂרִיד意为幸存者。希伯来语此处转为单数动词，可能以约书亚为代表性主语；中文无须显出主语即可保留这一含混，既不强行归为“他”，也不强行归为“他们”。
- source_word: כַּאֲשֶׁר עָשָׂה לְחֶבְרוֹן כֵּן עָשָׂה לִדְבִרָהּ
  choice: 约书亚怎样对待希伯仑，也照样对待底璧
  rationale: 比较句的单数主语由上下文指向约书亚。中文补出姓名，使由复数集体行动转到单数领袖行动的叙述更清楚。
- source_word: וְכַאֲשֶׁר עָשָׂה לְלִבְנָה וּלְמַלְכָּהּ
  choice: 他怎样对待立拿和它的王，也照样对待底璧
  rationale: 原文末句省略了比较结果，承接前句而理解为同样对待底璧。中文补出“也照样对待底璧”，使句法完整，但不增添新的事件内容。
theological_decisions:
- issue: חרם战争术语的表达
  choice: 尽行毁灭
  alternative: 完全毁灭；归于毁灭；置于禁令之下
  rationale: 该词不只是普通的“毁坏”，而带有将对象彻底交付毁灭的专门含义。“尽行毁灭”保留彻底性，脚注再说明其术语色彩，避免正文过度解释。
- issue: 叙事主语在复数与单数之间切换
  choice: 集体行动用“他们”，无明示主语的一句保持无主句，比较句用“约书亚／他”
  alternative: 全部统一为“他们”；全部统一为“约书亚”
  rationale: 希伯来文先用复数叙述军队行动，随后以单数描述不留幸存者及约书亚先前所行。中文既保留集体与领袖之间的切换，也让“没有留下”一句不武断消除原文的主语含混。
translation_notes:
  register: 采用现代、庄重而易懂的叙事体。“攻取”“击杀”“幸存者”清楚直接；避免古奥的“刀刃之下”和可能令人误解的“灵魂”。地名依现代中文圣经惯用译名作“底璧、希伯仑、立拿”。
