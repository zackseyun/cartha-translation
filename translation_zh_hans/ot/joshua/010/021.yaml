  text: וַ/יָּשֻׁבוּ֩ כָל הָ/עָ֨ם אֶל הַ/מַּחֲנֶ֧ה אֶל יְהוֹשֻׁ֛עַ מַקֵּדָ֖ה בְּ/שָׁל֑וֹם לֹֽא חָרַ֞ץ לִ/בְנֵ֧י יִשְׂרָאֵ֛ל לְ/אִ֖ישׁ אֶת לְשֹׁנֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/021.yaml
  text: And all the people returned to the camp[a], to Joshua at Makkedah, in peace. No one moved his tongue against any of the sons of Israel.
translation:
  language: zh_hans
  text: 众人都平安地回到营中，回到在玛基大的约书亚那里。[a]没有人向以色列人中的任何一人出言相向。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “玛基大”也可理解为与前面的方向短语并列，即“回到营中，到约书亚那里，又到玛基大”；这里按较自然的地点说明理解为约书亚所在之处。
    reason: 希伯来语句法简缩，מַקֵּדָה与前面两个方向成分之间的确切关系有歧义。
  - marker: b
    text: 希伯来语字面近似“没有人向以色列人中的任何一人磨利自己的舌头”，指没有人以敌对的话语相向。
    reason: 说明原文“磨利舌头”的生动习语，以及正文“出言相向”的表达。
lexical_decisions:
- source_word: וַיָּשֻׁבוּ כָל הָעָם
  choice: 众人都……回到
  rationale: שׁוּב在此叙述追击后的返回；כָל הָעָם虽处于军事语境，仍以一般集合名词“众人”表达，不强行技术化为“全军”。
- source_word: אֶל הַמַּחֲנֶה אֶל יְהוֹשֻׁעַ מַקֵּדָה
  choice: 回到营中，到在玛基大的约书亚那里
  rationale: 希伯来语连续使用方向短语，结构简缩；中文补入“在”，自然表明约书亚当时位于玛基大，同时保留“回营”和“到约书亚那里”两层信息。
- source_word: בְּשָׁלוֹם
  choice: 平安地
  rationale: 此处指安然、无恙地返回；“平安地”既保留שָׁלוֹם的常见表达，也符合现代汉语。
- source_word: לֹא חָרַץ ... אֶת לְשֹׁנוֹ
  choice: 没有一人受到谁的出言攻击
  rationale: 该习语字面涉及“磨利舌头”，在上下文中表示没有人说敌对、威吓或诋毁的话；正文采用自然且不过度限定言语类型的“出言攻击”，字面意象置于脚注。
- source_word: לִבְנֵי יִשְׂרָאֵל לְאִישׁ
  choice: 以色列人中，没有一人
  rationale: בני ישראל是民族共同体的惯用称谓，现代中文以“以色列人”最自然；לְאִישׁ在否定句中分配性地表示其中任何一个人。
theological_decisions:
- issue: בני ישראל的性别与群体称谓
  choice: 以色列人
  alternative: 以色列的众子／以色列子孙
  rationale: 这里是惯用的民族称谓，并非强调个体的男性身份；“以色列人”准确、庄重，也避免在中文中制造原文没有特别凸显的性别重点。
- issue: 敌对言语习语的力度
  choice: 出言攻击
  alternative: 动舌／磨利舌头攻击
  rationale: 正文传达该习语在语境中的功能，但不具体化为咒骂、控告或威吓，从而保留其语义范围；脚注交代字面图像。
translation_notes:
  register: 采用现代、庄重而易懂的叙事体。“平安地回到”保持经文语感；后句为符合汉语信息结构而转换表达角度，但保留“以色列人中任何一人都未遭敌对言语”的意义。所有脚注标记均已置于正文。
