source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר אֲלֵי/הֶם֙ יְהוֹשֻׁ֔עַ אַל תִּֽירְא֖וּ וְ/אַל תֵּחָ֑תּוּ חִזְק֣וּ וְ/אִמְצ֔וּ כִּ֣י כָ֗כָה יַעֲשֶׂ֤ה יְהוָה֙ לְ/כָל אֹ֣יְבֵי/כֶ֔ם אֲשֶׁ֥ר אַתֶּ֖ם נִלְחָמִ֥ים אוֹתָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/025.yaml
  text: And Joshua said to them[a], “Do not fear and do not be dismayed. Be strong and courageous, for thus Yahweh will do to all your enemies against whom you are fighting.”
translation:
  language: zh_hans
  text: 约书亚对他们说：“不要惧怕，也不要惊惶[a]。要刚强勇敢，因为雅威必这样对待你们正在攻打的一切仇敌。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“不要害怕，也不要被击垮。”
    reason: חתת 的词义可强调因恐惧而崩溃或被压垮；此处附列较直观的另一种表达。
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵיהֶם יְהוֹשֻׁעַ
  choice: 约书亚对他们说
  rationale: 未逐字再现叙事连词 וַ，而以现代汉语自然的叙事衔接表达；保留说话者和受话者。
- source_word: אַל תִּירְאוּ
  choice: 不要惧怕
  rationale: 准确表达 ירא 在否定命令中的“害怕、惧怕”之意，并保持庄重的劝勉语气。
- source_word: וְאַל תֵּחָתּוּ
  choice: 也不要惊惶
  rationale: חתת 的尼法勒形可表示因恐惧而崩溃、惊惶或丧胆；“惊惶”自然简洁，又不与前面的“惧怕”完全合并。
- source_word: חִזְקוּ וְאִמְצוּ
  choice: 要刚强勇敢
  rationale: 这是《约书亚记》中反复出现的劝勉公式；“刚强勇敢”分别体现力量与坚定无畏。
- source_word: כִּי כָכָה
  choice: 因为……必这样
  rationale: “因为”保留 כִּי 所引出的理由，“这样”直接指向眼前诸王所遭遇的事，体现 כָכָה 的指示意味。
- source_word: יַעֲשֶׂה יְהוָה
  choice: 雅威必……对待
  rationale: 未完成式在此指将来的行动，译作“必”；עשה 与 ל 连用表示对敌人所做之事，汉语用“对待”衔接自然。
- source_word: לְכָל אֹיְבֵיכֶם
  choice: 你们……的一切仇敌
  rationale: 保留“所有、一切”的范围，并明确仇敌属于以色列军队面对的敌方。
- source_word: אֲשֶׁר אַתֶּם נִלְחָמִים אוֹתָם
  choice: 你们正在攻打的
  rationale: 希伯来语表达正在与这些敌人作战；“正在攻打”保留进行中的战事，也符合现代汉语定语结构。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”较贴近其通常重构的读音，并将其作为专名呈现，不改译为称号。
- issue: “雅威必这样对待”所指行动的范围
  choice: 保留“这样”的指示表达
  alternative: 明说雅威必杀灭所有仇敌
  rationale: כָכָה 指向上下文中五王的遭遇，但本节没有把具体行动重新明说；保留指示语可避免替原文过度解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“刚强勇敢”保留全书反复出现的劝勉公式；整体避免古奥虚词，同时维持军事训诫的力度。
