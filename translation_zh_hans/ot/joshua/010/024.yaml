  text: וַ֠/יְהִי כְּֽ/הוֹצִיאָ֞/ם אֶת הַ/מְּלָכִ֣ים הָ/אֵלֶּה֮ אֶל יְהוֹשֻׁעַ֒ וַ/יִּקְרָ֨א יְהוֹשֻׁ֜עַ אֶל כָּל אִ֣ישׁ יִשְׂרָאֵ֗ל וַ֠/יֹּאמֶר אֶל קְצִינֵ֞י אַנְשֵׁ֤י הַ/מִּלְחָמָה֙ הֶ/הָלְכ֣וּא אִתּ֔/וֹ קִרְב֗וּ שִׂ֚ימוּ אֶת רַגְלֵי/כֶ֔ם עַֽל צַוְּארֵ֖י הַ/מְּלָכִ֣ים הָ/אֵ֑לֶּה וַֽ/יִּקְרְב֔וּ וַ/יָּשִׂ֥ימוּ אֶת רַגְלֵי/הֶ֖ם עַל צַוְּארֵי/הֶֽם־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/024.yaml
  text: And when they brought these kings out to Joshua[a], Joshua called all the men of Israel and said to the commanders of the men of war who had gone with him, “Come near[b]; put your feet on the necks of these kings.” So they came near and put their feet on their necks.
translation:
  language: zh_hans
  text: 他们把这些王带到约书亚面前时，约书亚召集以色列所有男子[a]，对随他出征的战士的将领[b]说：“你们上前来，把脚放在这些王的颈项上。”他们就上前，把脚放在这些王的颈项上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译“以色列的每一个男子”；在这里的军事语境中，指当时随军聚集的男子。
    reason: lexical_alternative
  - marker: b
    text: 原文也可按整个名词短语理解为“随他出征的军中将领”；其较自然的结构是“随他出征的战士的将领”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כְּהוֹצִיאָם
  choice: 他们……带到……时
  rationale: “וַיְהִי + כְּ + 不定式”在叙事中构成时间从句。译为“……时”既保留事件次序，也符合现代汉语表达。
- source_word: הַמְּלָכִים הָאֵלֶּה
  choice: 这些王
  rationale: 指眼前被带出来的五王；“这些”保留原文指示词的临场指向。
- source_word: אֶל יְהוֹשֻׁעַ
  choice: 带到约书亚面前
  rationale: 介词 אֶל 表示朝向、到某人那里；汉语“带到……面前”自然呈现被押到约书亚所在之处的场景。
- source_word: כָּל אִישׁ יִשְׂרָאֵל
  choice: 以色列所有男子
  rationale: 原文直指“以色列的每一个男子”。军事语境表明这里是当时随军聚集的人，因此保留阳性和群体范围，不笼统译作“全以色列”。
- source_word: קְצִינֵי אַנְשֵׁי הַמִּלְחָמָה הֶהָלְכוּא אִתּוֹ
  choice: 随他出征的军中将领
  rationale: קְצִינֵי 指领袖、长官；אַנְשֵׁי הַמִּלְחָמָה 是军事人员的惯用说法。此处用凝练的现代汉语表达其军职和随约书亚参战的身份，同时脚注注明较贴近形式的译法。
- source_word: קִרְבוּ
  choice: 你们上前来
  rationale: 命令对方靠近现场；“上前来”比“靠近”更符合将领奉召走到俘虏身边的具体动作。
- source_word: שִׂימוּ אֶת רַגְלֵיכֶם עַל צַוְּארֵי
  choice: 把脚踩在……的颈项上
  rationale: שִׂים 基本义为“放、置”。在脚置于颈项的动作中，汉语“踩在”自然、具体，也不淡化这一表示征服的举动。
- source_word: וַיִּקְרְבוּ וַיָּשִׂימוּ
  choice: 他们就上前，把脚踩在
  rationale: 两个连续叙事动词表明众将领立即照命令行动；“就”自然表现命令与执行的紧接关系。
- source_word: עַל צַוְּארֵיהֶם
  choice: 在这些王的颈项上
  rationale: 代词后缀回指诸王。汉语重复“这些王”可避免“他们”同时可能回指将领而产生歧义。
theological_decisions:
- issue: כָּל אִישׁ יִשְׂרָאֵל 与 אַנְשֵׁי הַמִּלְחָמָה 的性别和群体范围
  choice: 以色列所有男子／军中将领
  alternative: 全以色列人／以色列众人／战士
  rationale: 原文使用明确的男性名词，且场景属于军队行动。译文保留这一点，同时以脚注说明这里指当时随军聚集的人，不把所指范围扩大为全国所有人口。
- issue: 是否弱化脚踩诸王颈项的征服动作
  choice: 把脚踩在这些王的颈项上
  alternative: 制伏这些王／把脚放在这些王的颈项上
  rationale: 原文描述具体且强烈的军事支配动作。译文保留其直观和张力，不用抽象释义替代，也不对其作额外的道德或神学解释。
- issue: 随行关系所修饰对象的表达
  choice: 随他出征的军中将领
  alternative: 随他去的战士们的将领
  rationale: 希伯来语关系性成分接在整个名词短语之后，汉语若逐层照搬会生硬。正文采用可自然涵盖这些将领随约书亚参战这一意义的表达，不进一步断定每一层句法关系。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。以“王、将领、颈项”等词保持历史叙事的正式语体；“上前来、踩在”则清楚呈现现场命令和动作。脚注标记均紧随其所解释的词语。
