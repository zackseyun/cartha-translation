base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/020.yaml
  text: And it happened that when Joshua and the sons of Israel had finished striking them with a very great slaughter[a], until they were wiped out, and the survivors from them survived and entered the fortified cities[b],
translation:
  language: zh_hans
  text: 当约书亚和以色列人[b]重重地击杀他们，直到将他们灭尽[a]，而他们中间的幸存者进入坚固城的时候，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “灭尽”也可译作“耗尽”或“完全消灭”。原文紧接着又提到幸存者，保留了这两种表述之间的张力。
    reason: textual_ambiguity
  - marker: b
    text: 希伯来文直译为“以色列的众子”，是对以色列人的群体称呼。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כְּכַלּוֹת
  choice: ……完成这一切以后
  rationale: כְּ加不定式构成时间从句；结合下一节才出现的主句，中文将时间短语移至句末，使本节未完的句法关系清楚而自然。
- source_word: יְהוֹשֻׁעַ וּבְנֵי יִשְׂרָאֵל
  choice: 约书亚和以色列人
  rationale: “以色列人”是现代汉语对“以色列的众子”的自然群体称呼；脚注保留原文习语信息。
- source_word: לְהַכּוֹתָם מַכָּה גְדוֹלָה מְאֹד
  choice: 把他们大大击杀
  rationale: 保留נכה与מכה的动词—名词强化作用，并按军事语境表达致命攻击；“大大”传达גְדוֹלָה מְאֹד的强度。
- source_word: עַד תֻּמָּם
  choice: 直到将他们灭尽
  rationale: 表达被带到尽头、耗尽的被动含义，同时不加入原文没有的“几乎”。
- source_word: וְהַשְּׂרִידִים שָׂרְדוּ מֵהֶם
  choice: 其中幸存下来的人
  rationale: 以“幸存下来”自然传达同根名词和动词的重复意义；“其中”表明幸存者来自被击杀的一方。
- source_word: וַיָּבֹאוּ אֶל עָרֵי הַמִּבְצָר
  choice: 逃进了坚固城
  rationale: בוא本义是“进入”，此处幸存者进入设防城市的语境含有逃入之意；“坚固城”准确表达有防御工事的城邑。
theological_decisions:
- issue: “灭尽”与紧接着出现“幸存者”之间的张力
  choice: 保留“直到将他们灭尽”，并直接接续“其中幸存下来的人”
  alternative: 译作“几乎将他们灭尽”或“直到击溃他们”
  rationale: 原文同时使用表示彻底终结的措辞和幸存者的陈述；译文不添加“几乎”，也不把“灭尽”弱化为单纯战败，以免替原文消解张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“大大击杀”略带经文语体，用来保留原文的强化结构；因本节的时间从句要到下一节才完成，结尾保留逗号以显示句意尚未结束。
