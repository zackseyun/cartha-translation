  text: וַ/יִּשְׁלְח֣וּ אַנְשֵׁי֩ גִבְע֨וֹן אֶל יְהוֹשֻׁ֤עַ אֶל הַֽ/מַּחֲנֶה֙ הַ/גִּלְגָּ֣לָ/ה לֵ/אמֹ֔ר אַל תֶּ֥רֶף יָדֶ֖י/ךָ מֵֽ/עֲבָדֶ֑י/ךָ עֲלֵ֧ה אֵלֵ֣י/נוּ מְהֵרָ֗ה וְ/הוֹשִׁ֤יעָ/ה לָּ֨/נוּ֙ וְ/עָזְרֵ֔/נוּ כִּ֚י נִקְבְּצ֣וּ אֵלֵ֔י/נוּ כָּל מַלְכֵ֥י הָ/אֱמֹרִ֖י יֹשְׁבֵ֥י הָ/הָֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/006.yaml
  text: Then the men of Gibeon sent to Joshua[a], to the camp at Gilgal, saying, “Do not withdraw your hand from your servants. Come up to us quickly, and save us and help us, for all the kings of the Amorites who live in the hill country have gathered against us.”
translation:
  language: zh_hans
  text: 基遍人派人到吉甲的营中见约书亚，说：“求你不要撇下你的仆人不管[a]。请赶快上到我们这里来，拯救我们，帮助我们！因为住在山区的亚摩利诸王都已经聚集来攻打我们了。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“不要使你的手离开你的仆人”，意思是“不要停止帮助我们”或“不要抛弃我们”。
    reason: 保留原文的身体意象及其习语含义，说明正文为何采用意译。
lexical_decisions:
- source_word: וַיִּשְׁלְחוּ אַנְשֵׁי גִבְעוֹן
  choice: 基遍人派人
  rationale: אַנְשֵׁי גִבְעוֹן字面为“基遍的男人们”，在这里指城中的人或代表；现代汉语用“基遍人派人”既自然，也保留了差遣使者的事件含义。
- source_word: אֶל יְהוֹשֻׁעַ אֶל הַמַּחֲנֶה הַגִּלְגָּלָה
  choice: 到吉甲的营中见约书亚
  rationale: 连续两个אֶל分别标明收信人和目的地；此译清楚表达约书亚身在吉甲营中，并保留信息送达的方向。
- source_word: אַל תֶּרֶף יָדֶיךָ מֵעֲבָדֶיךָ
  choice: 求你不要撇下你的仆人不管
  rationale: 原文是“不要使你的手离开／松开你的仆人”的习语，意思是不要停止援助或弃置他们；正文采用自然汉语表达，脚注保留原文意象。
- source_word: עֲבָדֶיךָ
  choice: 你的仆人
  rationale: 此处是基遍人对约书亚自称的谦卑政治性称谓，并非着重说明奴隶身份，因此译作“仆人”。
- source_word: עֲלֵה אֵלֵינוּ מְהֵרָה
  choice: 请赶快上到我们这里来
  rationale: עֲלֵה含有从吉甲往山区上行的地势意味；“上到我们这里来”同时符合说话者视角和地理背景。
- source_word: וְהוֹשִׁיעָה לָּנוּ וְעָזְרֵנוּ
  choice: 拯救我们，帮助我们
  rationale: 分别直接对应ישע和עזר，保留两个并列请求，不将其合并或过度神学化。
- source_word: כִּי נִקְבְּצוּ אֵלֵינוּ
  choice: 因为……都已经聚集来攻打我们了
  rationale: 在敌对军事语境中，אֶל表达朝向并带有攻击意味；“聚集来攻打”比单说“聚集到”更符合上下文。
- source_word: כָּל מַלְכֵי הָאֱמֹרִי יֹשְׁבֵי הָהָר
  choice: 住在山区的亚摩利诸王
  rationale: הָהָר在此指山地或山区；“诸王”自然表达“所有……王”的集合含义。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。直接引语以急迫的短句呈现；“求你”“请”体现基遍人的谦卑请求。“亚摩利诸王”沿用适合圣经历史叙事的正式称法。
