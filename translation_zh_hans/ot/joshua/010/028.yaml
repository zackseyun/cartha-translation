revisions:
- from: 当天，约书亚攻取了玛基大，用刀剑击杀了那城；他将城的王和城中所有的人尽行毁灭[a]，一个幸存者也没有留下。他怎样处置耶利哥王，也照样处置玛基大王。
  to: 当天，约书亚攻取了玛基大，用刀剑攻打那城；他将城王和城中所有的人都归于毁灭[a]，一个幸存者也没有留下。他处置玛基大王，正如他处置耶利哥王一样。
  rationale: 修正“击杀那城”的中文搭配，使“城”仍是原文中受攻击的对象，并将毁灭王和城中居民的行动明确置于下一分句。末句恢复原文的比较次序。其余内容、严厉的历史叙事及脚注所保留的 חרם 语义均未改变。
