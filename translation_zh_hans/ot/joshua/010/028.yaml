    issue: “用刀剑击杀了那城”
    rationale: “击杀”通常以人或生物为宾语；原文此处的直接宾语是城（阴性代词），其后才另行说明王和城中所有的人被归于毁灭。应避免使中文误称“杀死一座城”。
  - severity: low
    issue: 末句比较结构的叙述次序倒置
    rationale: 草稿以耶利哥王的处置为先、玛基大王为后；虽不改变比较关系，但原文先述玛基大王，再以耶利哥王为参照，宜予保留。
  - severity: low
    issue: 脚注的替代译法与正文译法重复
    rationale: 草稿正文采用“尽行毁灭”，脚注又列“归于毁灭”为替代译法。改用“归于毁灭”作正文后，脚注可将“尽行毁灭”列为替代译法，结构更一致。
