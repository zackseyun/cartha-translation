  text: וְ/אֶת מַקֵּדָה֩ לָכַ֨ד יְהוֹשֻׁ֜עַ בַּ/יּ֣וֹם הַ/ה֗וּא וַ/יַּכֶּ֣/הָ לְ/פִי חֶרֶב֮ וְ/אֶת מַלְכָּ/הּ֒ הֶחֱרִ֣ם אוֹתָ֗/ם וְ/אֶת כָּל הַ/נֶּ֨פֶשׁ֙ אֲשֶׁר בָּ֔/הּ לֹ֥א הִשְׁאִ֖יר שָׂרִ֑יד וַ/יַּ֨עַשׂ֙ לְ/מֶ֣לֶךְ מַקֵּדָ֔ה כַּ/אֲשֶׁ֥ר עָשָׂ֖ה לְ/מֶ֥לֶךְ יְרִיחֽוֹ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/028.yaml
  text: And Joshua captured Makkedah on that day and struck it with the edge of the sword[a], and he devoted to destruction its king and every person in it; he left no survivor. And he did to the king of Makkedah just as he had done to the king of Jericho.
translation:
  language: zh_hans
  text: 当天，约书亚攻取了玛基大，用刀剑攻打那城；他将城王和城中所有的人都归于毁灭[a]，一个幸存者也没有留下。他处置玛基大王，正如他处置耶利哥王一样。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “归于毁灭”所译的希伯来语动词，指把人或物置于禁令之下，指定归于毁灭；也可译作“尽行毁灭”。
    reason: 说明 חרם 不仅表示一般的毁灭，也含有置于禁令之下、指定归于毁灭的特定意义。
lexical_decisions:
- source_word: לָכַד
  choice: 攻取
  rationale: 这是攻占城邑的常见军事用语，既准确又符合现代汉语叙事习惯。
- source_word: וַיַּכֶּהָ לְפִי חֶרֶב
  choice: 用刀剑击杀了那城
  rationale: 保留“击打那城”和“刀剑”的具体意象；汉语中的“击杀了那城”沿用经文的整体指代，表示杀灭城中居民，而不简化为较笼统的“打败”。
- source_word: הֶחֱרִם
  choice: 尽行毁灭
  rationale: 该词在此不只是一般意义的杀灭，还指置于禁令之下而毁灭。正文采用自然、庄重的常用表达，并由脚注保留其礼仪和神学含义。
- source_word: כָּל הַנֶּפֶשׁ אֲשֶׁר בָּהּ
  choice: 城中所有的人
  rationale: נפש 在这里指人或性命，并非专指非物质的“灵魂”；此译法清楚传达实际所指。
- source_word: לֹא הִשְׁאִיר שָׂרִיד
  choice: 一个幸存者也没有留下
  rationale: 直接表达无人存留，符合现代汉语，同时保留原文的绝对语气。
- source_word: וַיַּעַשׂ לְמֶלֶךְ מַקֵּדָה כַּאֲשֶׁר עָשָׂה לְמֶלֶךְ יְרִיחוֹ
  choice: 他怎样处置耶利哥王，也照样处置玛基大王
  rationale: “处置”自然表达עשה ל的简略结构，又不具体说明原文未在本节重述的处置方式。
- source_word: מַקֵּדָה / יְרִיחוֹ / יְהוֹשֻׁעַ
  choice: 玛基大／耶利哥／约书亚
  rationale: 采用现代中文圣经读者熟悉且通行的专名译法。
theological_decisions:
- issue: 征服叙事中 חרם 的译法
  choice: 尽行毁灭
  alternative: 归于毁灭；置于禁令之下
  rationale: 正文需同时保持可读性和该行动的彻底性；脚注则说明原词含有置于禁令之下、指定为当毁灭之物的意味，避免把它扁平化为一般的杀害，也不额外引入宗派性解释。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。句式保留希伯来叙事的连续推进和末句的对照结构；避免古奥词语，同时不淡化原文关于全城居民遭毁灭的严厉表述。
