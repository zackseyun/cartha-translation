base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/017.yaml
  text: And it was reported to Joshua[a], saying, “The five kings have been found hidden in the cave at Makkedah.”
translation:
  language: zh_hans
  text: 有人向约书亚报告说：“那五个王被发现时，正躲在玛基大的洞里[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“那五个王已经被发现，藏在玛基大的洞里。”这里的希伯来语分词既可表示正在躲藏，也可表示处于隐藏的状态。
    reason: 保留נֶחְבְּאִים在动作过程与状态描述之间的词义弹性。
lexical_decisions:
- source_word: וַיֻּגַּד
  choice: 有人……报告
  rationale: 该词是被动叙事形式，表示消息被告知约书亚。现代汉语若直译为“被报告”不自然，因此用不定施事者“有人”表达，同时不具体指明报告者。
- source_word: לִיהוֹשֻׁעַ
  choice: 向约书亚
  rationale: 按希伯来语方向性介词表达报告所传达的对象；人名采用通行译名“约书亚”。
- source_word: לֵאמֹר
  choice: 说
  rationale: 保留希伯来语引出直接引语的常用叙事衔接。
- source_word: נִמְצְאוּ
  choice: 已经被发现
  rationale: 保留מצא复数被动形式，并以“已经”体现报告中刚刚发现的结果状态。
- source_word: חֲמֵשֶׁת הַמְּלָכִים
  choice: 那五个王
  rationale: 定冠词指向前文已经提到的五王；“那五个王”在现代汉语中比“五个王”更清楚地体现其特指性。
- source_word: נֶחְבְּאִים
  choice: 藏在
  rationale: 该被动／反身分词可描述他们正在躲藏，也可描述其处于隐藏状态；正文采用自然且未明确区分两者的“藏在”，并以脚注保留另一种表达。
- source_word: בַּמְּעָרָה
  choice: 洞里
  rationale: 结合后置地名译作“玛基大的洞里”，自然表达特指的洞穴。
- source_word: בְּמַקֵּדָה
  choice: 玛基大
  rationale: 采用该地名的通行中文音译，并与“洞”组成“玛基大的洞”，表达洞穴位于玛基大。
