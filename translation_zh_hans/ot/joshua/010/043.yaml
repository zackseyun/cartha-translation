  text: Then Joshua returned[a], and all Israel with him, to the camp at Gilgal.
translation:
  language: zh_hans
  text: 于是，约书亚和与他同行的以色列众人回到吉甲的营地[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或更直译为“回到营地，到吉甲去”。希伯来文“吉甲”带有表示方向的词尾。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: 回到
  rationale: שׁוב在连续叙事中表示返回先前所在之处；“回到”简洁自然，也符合军事行动结束后归营的语境。
- source_word: יְהוֹשֻׁעַ
  choice: 约书亚
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: וְכָל יִשְׂרָאֵל
  choice: 以色列众人
  rationale: 原文直译为“全以色列”，具有群体性的含义；“以色列众人”在现代中文中较自然，同时不把所指范围限定为军队。
- source_word: עִמּוֹ
  choice: 与他同行的
  rationale: 表达עִם加第三人称阳性单数后缀所表示的伴随关系；结合行军语境译作“与他同行的”，比生硬的“与他同在的”更自然。
- source_word: אֶל הַמַּחֲנֶה
  choice: 回到……的营地
  rationale: אֶל表示朝向目的地的移动，מַחֲנֶה在此指军事营地；中文用“回到……的营地”表达自然。
- source_word: הַגִּלְגָּלָה
  choice: 吉甲的
  rationale: 地名带方向词尾־ָה，表明朝吉甲而去；结合前面的“营地”，译成“吉甲的营地”最符合现代中文习惯，具体形式差异在脚注说明。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“于是”承接希伯来文连续叙事；保留“以色列”作为群体称谓，但用“众人”使中文顺畅。脚注标记置于其实际说明的“吉甲的营地”之后。
