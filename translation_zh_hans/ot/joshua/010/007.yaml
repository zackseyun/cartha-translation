  text: So Joshua went up from Gilgal[a], he and all the fighting men with him[b], and all the mighty men of valor.
translation:
  language: zh_hans
  text: 于是，约书亚和所有随行的作战人员，以及所有英勇善战的勇士，都从吉甲上去了。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַל
  choice: 就……上去
  rationale: עלה的基本意思是“上去、登上”。保留希伯来语的方向表达，不额外译成“出征”或“进军”，以免加入原文未明说的军事动作。
- source_word: מִן הַגִּלְגָּל
  choice: 从吉甲
  rationale: מן表示起点“从”；地名הַגִּלְגָּל按现代中文圣经通行形式音译为“吉甲”。
- source_word: הוּא
  choice: 他
  rationale: 原文独立人称代词明确出现，在“约书亚”之后形成同位结构；中文以分号后“他和……”自然保留这一强调和句法关系。
- source_word: כָל עַם הַמִּלְחָמָה
  choice: 所有随行的作战人员
  rationale: 字面为“所有战争之民”，在本段语境中指参加战斗的人员。“作战人员”现代、清楚，也避免把该短语过度限定为整个军队；“随行的”对应后面的עִמּוֹ“与他一起”。
- source_word: עִמּוֹ
  choice: 随行的
  rationale: 将“与他一起”融入自然的中文定语结构，表达这些作战人员与约书亚同行。
- source_word: כֹל גִּבּוֹרֵי הֶחָיִל
  choice: 所有英勇善战的勇士
  rationale: 该固定表达兼有勇力、才干和军事能力的含义。“英勇善战的勇士”保留其褒义和军事色彩，并与前面的泛称“作战人员”有所区别。
