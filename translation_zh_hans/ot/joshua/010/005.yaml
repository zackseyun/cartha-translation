base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/005.yaml
  text: So the five kings of the Amorites—the king of Jerusalem[a], the king of Hebron, the king of Jarmuth, the king of Lachish, and the king of Eglon—gathered together and went up, they and all their armies; and they encamped against Gibeon and fought against it.
translation:
  language: zh_hans
  text: 于是，亚摩利人的五个王——耶路撒冷王、希伯仑王、耶末王、拉吉王和伊矶伦王——聚集起来，上去；他们和他们所有的军队[a]在基遍附近扎营，攻打基遍。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “军队”直译为“营”；这里指随各王出征的军事营队或军队。
    reason: 保留מַחֲנֵיהֶם“营”的字面义，并说明其在本处的军事所指。
lexical_decisions:
- source_word: וַיֵּאָסְפוּ
  choice: 聚集起来
  rationale: 尼法勒形态表达众人会聚；此译保留集体聚合之意，不额外断定他们缔结了正式联盟。
- source_word: וַיַּעֲלוּ
  choice: 上去
  rationale: 保留עלה“上去”的基本方向含义，既可反映地势，也不排除惯用的行进表达。
- source_word: חֲמֵשֶׁת מַלְכֵי הָאֱמֹרִי
  choice: 亚摩利人的五个王
  rationale: 明确保留原文的属格结构和族群称谓。
- source_word: מֶלֶךְ יְרוּשָׁלִַם ... מֶלֶךְ עֶגְלוֹן
  choice: 耶路撒冷王、希伯仑王、耶末王、拉吉王和伊矶伦王
  rationale: 逐一列出五位城邦之王，保留原文反复列举的效果，同时采用自然的现代汉语称谓。
- source_word: הֵם וְכָל מַחֲנֵיהֶם
  choice: 带着各自的全军[a]
  rationale: מַחֲנֶה本义为“营、营地”，在军事语境中可转指驻营的军队；正文用“全军”清楚传达此处所指，脚注保留字面表达。
- source_word: וַיַּחֲנוּ עַל גִּבְעוֹן
  choice: 对着基遍安营
  rationale: 结合随后的攻打行动，将עַל的敌对关系译出，同时避免添加原文未明说的“包围”或“围攻”。
- source_word: וַיִּלָּחֲמוּ עָלֶיהָ
  choice: 攻打基遍
  rationale: לָחַם在此指军事交战；重复城名比汉语中的阴性城市代词更自然、清楚。
theological_decisions: []
