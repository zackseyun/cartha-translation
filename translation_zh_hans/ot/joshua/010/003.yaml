  yaml_path: translation/ot/joshua/010/003.yaml
  text: So Adoni-zedek king of Jerusalem sent to Hoham king of Hebron, to Piram king of Jarmuth, to Japhia king of Lachish, and to Debir king of Eglon, saying,
translation:
  language: zh_hans
  text: 于是，耶路撒冷王亚多尼·洗德派人给希伯仑王何咸、耶末王毗兰、拉吉王雅非亚和伊矶伦王底璧传话说：
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: 于是……派人……传话
  rationale: 该叙事性连续式推动情节发展；שׁלח的基本意思是“差派、送出”。结合后面的“说”，译为“派人……传话”符合现代汉语表达，也保留了向诸王发出信息的含义。
- source_word: אֲדֹנִי צֶדֶק
  choice: 亚多尼·洗德
  rationale: 作为人名按希伯来语音译；间隔号显示复合名称的结构，同时避免把名字的含义直接译入正文。
- source_word: מֶלֶךְ יְרוּשָׁלִַם
  choice: 耶路撒冷王
  rationale: 以自然简洁的汉语领属结构表达“耶路撒冷的王”。
- source_word: הוֹהָם / חֶבְרוֹן
  choice: 何咸 / 希伯仑
  rationale: 分别按通行的现代中文圣经人名、地名形式音译。
- source_word: פִּרְאָם / יַרְמוּת
  choice: 毗兰 / 耶末
  rationale: 分别按通行的现代中文圣经人名、地名形式音译。
- source_word: יָפִיעַ / לָכִישׁ
  choice: 雅非亚 / 拉吉
  rationale: 分别按通行的现代中文圣经人名、地名形式音译。
- source_word: דְּבִיר / עֶגְלוֹן
  choice: 底璧 / 伊矶伦
  rationale: 上下文表明דְּבִיר在此是王的名字，故作人名音译；עֶגְלוֹן作地名音译。
- source_word: לֵאמֹר
  choice: 说
  rationale: 这是引出下文直接话语的常用公式，现代汉语自然译作“说”。
