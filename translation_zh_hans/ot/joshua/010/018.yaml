base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/018.yaml
  text: And Joshua said[a], “Roll large stones to the mouth of the cave[b], and appoint men over it to guard it.”
translation:
  language: zh_hans
  text: 约书亚说：“把大石头滚到洞口，再派人守在那里，看守那些王。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: 未机械译出连接词 וַ；汉语叙事中直接用“说”即可自然推进情节，且不额外限定为严格的时间先后。
- source_word: יְהוֹשֻׁעַ
  choice: 约书亚
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: גֹּלּוּ
  choice: 滚
  rationale: גלל 的复数祈使式在此指滚动石头；“滚”直接、自然，并保留具体动作。
- source_word: אֲבָנִים גְּדֹלוֹת
  choice: 大石头
  rationale: 准确表达石头体积很大；“大石头”比“大石块”更贴近原文普通用词，也符合现代汉语。
- source_word: אֶל פִּי הַמְּעָרָה
  choice: 到洞口
  rationale: פִּי 字面为“口”，用于洞穴时汉语自然对应“洞口”，无需另加脚注即可保留其意象与含义。
- source_word: וְהַפְקִידוּ
  choice: 再派
  rationale: פקד 的使役式表示指派人员承担任务；“派”准确传达委派含义，“再”自然连接连续命令。
- source_word: עָלֶיהָ
  choice: 在那里
  rationale: 阴性单数代词回指洞穴；与“派人”搭配时，“守在那里”比直译“在它上面”自然，并表达驻守洞口的方位。
- source_word: אֲנָשִׁים
  choice: 人
  rationale: 上下文指被派去执行任务的人员；现代汉语用“人”自然，不必将性别信息过度凸显为“男人”，也不增译为原文未明说的“卫兵”。
- source_word: לְשָׁמְרָם
  choice: 看守那些王
  rationale: 宾语后缀为阳性复数，按语法和上下文最自然地指洞内的五王，而不是阴性单数的洞穴；明说“那些王”可消除中文代词指向不清，同时忠实保留复数宾语。
theological_decisions:
- issue: לְשָׁמְרָם 的复数宾语所指
  choice: 那些王
  alternative: 洞口／洞穴
  rationale: 后缀为阳性复数，与前文被关在洞中的五王相合；洞穴 הַמְּעָרָה 则是阴性单数，因此不能以单数“它”反映该后缀。这里属于语法与篇章指代判断，不涉及额外的教义解释。
translation_notes:
  register: 采用自然、庄重而清楚的现代标准汉语。保留命令句的简洁力度；以“洞口”自然传达希伯来语“洞的口”，并将复数宾语明确译为“那些王”，避免误读为看守洞穴本身。
