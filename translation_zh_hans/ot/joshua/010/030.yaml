revisions:
- from: 耶和华也把那城和城王交在以色列手中。他用刀击杀那城，以及城里的每一个人[a]，没有留下一个幸存者。他怎样处置耶利哥王，也照样处置了那城的王。
  to: 耶和华也把那城和它的王交在以色列手中。他用刀攻打那城，杀尽城里的每一个人[a]，没有留下一个幸存者。他怎样处置耶利哥王，也照样处置了那城的王。
  rationale: 修订仅调整不自然且语义不够准确的“击杀那城”，以“用刀攻打那城，杀尽城里的每一个人”对应原文对城市及其中居民的连续叙述；同时将“城王”改为较自然的“它的王”。其余内容、战争叙事的力度及主语的上下文指向均予保留。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T05:20:53Z'
review_pass:
  verdict: revise
  source_fidelity: 原译对主要信息忠实：耶和华将利立拿及其王交给以色列，战事中城内的人无一幸免，并以耶利哥王的先例处置该王。不过，“用刀击杀那城”把城市作为“击杀”的受事，在汉语中搭配不当，也未恰当呈现希伯来文“击打/攻取那城，并及城中所有人”的并列结构。
  naturalness: 整体庄重清楚，但“那城和城王”及“击杀那城”稍显生硬；改为“那城和它的王”以及“攻打那城，杀尽城里的每一个人”更合现代标准汉语。
  terminology: “耶和华”“交在……手中”“幸存者”及“耶利哥”均合适。“每一个人”正确表达נֶפֶשׁ在此处指人。脚注可更直接说明其字面意义与本句用法。
  issues:
  - severity: medium
    issue: “他用刀击杀那城”
    rationale: “击杀”通常以人或生物为宾语，不能自然地以“城”为宾语。原文先说以刀剑击打该城，继而及于城中的所有人；中文宜区分攻城和杀戮居民。
  - severity: low
    issue: “城王”
    rationale: 虽可理解，但“它的王”更自然，也更贴近原文的所属代词。
