source:
  edition: WLC
  text: וַ/יִּתֵּן֩ יְהוָ֨ה גַּם אוֹתָ֜/הּ בְּ/יַ֣ד יִשְׂרָאֵ֘ל וְ/אֶת מַלְכָּ/הּ֒ וַ/יַּכֶּ֣/הָ לְ/פִי חֶ֗רֶב וְ/אֶת כָּל הַ/נֶּ֨פֶשׁ֙ אֲשֶׁר בָּ֔/הּ לֹֽא הִשְׁאִ֥יר בָּ֖/הּ שָׂרִ֑יד וַ/יַּ֣עַשׂ לְ/מַלְכָּ֔/הּ כַּ/אֲשֶׁ֥ר עָשָׂ֖ה לְ/מֶ֥לֶךְ יְרִיחֽוֹ־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/030.yaml
  text: And Yahweh also gave it and its king into the hand of Israel[a], and he struck it with the edge of the sword, and every person who was in it. He left no survivor in it, and he did to its king just as he had done to the king of Jericho.
translation:
  language: zh_hans
  text: 耶和华也把那城和它的王交在以色列手中。他用刀攻打那城，杀尽城里的每一个人[a]，没有留下一个幸存者。他怎样处置耶利哥王，也照样处置了那城的王。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“其中的每一个生命（נֶפֶשׁ）”；这里指城里的每一个人。
    reason: 说明נֶפֶשׁ的字面意义及其在本句中指城内居民，避免将其理解为专指非物质的灵魂。
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的专名形式，明确对应希伯来文四字神名，而不以“主”替代。
- source_word: וַיִּתֵּן ... בְּיַד יִשְׂרָאֵל
  choice: 把……交在以色列手中
  rationale: 保留“交在……手中”的希伯来语权柄意象，同时在现代汉语中清楚表达交付其控制。
- source_word: גַּם
  choice: 也
  rationale: 承接上文的征服叙事，简明保留递进和延续作用。
- source_word: אוֹתָהּ ... וְאֶת מַלְכָּהּ
  choice: 那城和城王
  rationale: 阴性代词按上下文指利立拿城；中文明确补出“城”，避免单用“它”造成指代不清。
- source_word: וַיַּכֶּהָ לְפִי חֶרֶב
  choice: 他用刀击杀那城
  rationale: “击杀”保留 נכה 在战争语境中的强烈动作含义；“用刀”自然传达“用刀口”的希伯来惯用语，避免生硬直译。
- source_word: כָּל הַנֶּפֶשׁ אֲשֶׁר בָּהּ
  choice: 城里的每一个人
  rationale: נֶפֶשׁ 在此指城中的活人，并非对非物质“灵魂”的教义陈述；“每一个人”准确且自然。
- source_word: לֹא הִשְׁאִיר בָּהּ שָׂרִיד
  choice: 没有留下一个幸存者
  rationale: שָׂרִיד 在此指劫后存活的人；此译法保留绝对否定和单数集合表达。
- source_word: וַיַּעַשׂ לְמַלְכָּהּ כַּאֲשֶׁר עָשָׂה לְמֶלֶךְ יְרִיחוֹ
  choice: 他怎样处置耶利哥王，也照样处置了那城的王
  rationale: “处置”自然表达重复的 עשה 比较句式，又不擅自补明本节未重述的具体做法。
theological_decisions:
- issue: 战争语境中 נֶפֶשׁ 的译法
  choice: 每一个人
  alternative: 每一个灵魂；所有性命
  rationale: 这里所指的是城中居民，而非人的构成或灵魂性质；译作“人”可避免引入经文没有表达的后期人论主张。
- issue: 毁城叙事中主语的呈现
  choice: 沿用“他”，由上下文确定所指
  alternative: 明确译作“约书亚”
  rationale: 希伯来文本使用第三人称单数动词而未在本节明说主语；保留代词可避免把上下文推断写成明示内容。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。保留“交在……手中”的源语意象；对“刀口”这一在中文中较生硬的习语作自然化处理。脚注标记置于其实际解释的“每一个人”之后。
