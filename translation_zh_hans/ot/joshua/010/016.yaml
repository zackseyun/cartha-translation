  text: 这五个王逃走，藏在玛基大的洞穴里。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּנֻסוּ
  choice: 逃跑了
  rationale: נוּס表示因危险或战败而逃离；“逃跑了”是自然、清楚的现代汉语，也保留了仓皇退避的意味。
- source_word: חֲמֵשֶׁת הַמְּלָכִים הָאֵלֶּה
  choice: 这五个王
  rationale: 保留指示词הָאֵלֶּה的特指作用；“这五个王”符合现代汉语语序。
- source_word: וַיֵּחָבְאוּ
  choice: 藏
  rationale: חבא在此表示藏身；“藏”简洁自然，结合地点短语即可表达他们把自己隐藏起来。
- source_word: בַמְּעָרָה
  choice: 洞里
  rationale: מְעָרָה指洞穴；在“玛基大的洞里”这一结构中，汉语不必另加定冠词，也能自然表达原文的特指。
- source_word: בְּמַקֵּדָה
  choice: 玛基大
  rationale: 按传统且通行的中文圣经地名音译处理；介词短语整体译为“玛基大的洞里”，自然表达洞穴位于该地。
- source_word: וַ
  choice: 这
  rationale: 句首וַ主要承接叙事。现代汉语可不机械译作“于是”或“但”；直接以“这五个王”开句，连贯而不额外强化转折。
