  choice: 照现存马所拉希伯来文本翻译，不协调、移置或省略本节。
  alternative: 因10:43有相似陈述，有人认为本节是预述，或在文本传递中发生了位置变动。
  rationale: 这主要是文学与文本问题，并非教义判断。正文应忠实呈现所给希伯来文本，同时以脚注说明相关讨论，保留其张力。
translation_notes:
