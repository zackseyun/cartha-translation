lexical_decisions:
- source_word: וַיָּשָׁב
  choice: 随后返回
  rationale: 该词是שׁוב的叙事性连续形式，表示接续发生的行动；“返回”体现回到先前地点，“随后”自然传达叙事推进。
- source_word: יְהוֹשֻׁעַ
  choice: 约书亚
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: וְכָל יִשְׂרָאֵל
  choice: 全体以色列人
  rationale: “以色列”在此具有集合意义；译作“全体以色列人”符合现代汉语，同时不进一步限定为军队或其他群体。
- source_word: עִמּוֹ
  choice: 与他同去的
  rationale: 表达עם加第三人称阳性单数后缀的随同行动关系，并使中文修饰结构自然。
- source_word: אֶל הַמַּחֲנֶה
  choice: 营地
  rationale: מַחֲנֶה在此指驻扎之处，语境可能涉及军事行动；“营地”是自然、准确的现代汉语表达。
- source_word: הַגִּלְגָּלָה
  choice: 吉甲的
  rationale: 地名带方向词尾，表示朝吉甲而去；结合אֶל הַמַּחֲנֶה，译为“返回吉甲的营地”既保留运动方向，也符合中文表达。
theological_decisions:
