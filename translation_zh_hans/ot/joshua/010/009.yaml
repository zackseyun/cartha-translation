  text: So Joshua came upon them suddenly[b][a], having marched up from Gilgal all night.
translation:
  language: zh_hans
  text: 约书亚突然来到他们那里；他整夜从吉甲上来。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “整夜从吉甲上来”直译为“整夜从吉甲上去”。“来到他们那里”在这里的军事语境中也可译为“突然逼近他们”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא אֲלֵיהֶם
  choice: 来到他们那里
  rationale: בוא配合אֶל的基本意思是“来到／到……那里”。军事语境表明对象是敌军，但正文不额外加入“攻击”或“袭击”，以保留原文措辞的含蓄。
- source_word: פִּתְאֹם
  choice: 突然
  rationale: 直接表达行动的突发性，也可在语境中让人理解为出其不意。
- source_word: כָּל הַלַּיְלָה
  choice: 连夜
  rationale: 自然简洁地表达整夜持续行进；其范围由脚注说明。
- source_word: עָלָה
  choice: 上来
  rationale: 保留עלה的上行、登高意味；不在正文中增添原文未明说的“行军”。
- source_word: מִן הַגִּלְגָּל
  choice: 从吉甲
  rationale: 按来源地点直译，采用通行中文地名“吉甲”。
- source_word: יְהוֹשֻׁעַ
  choice: 约书亚
  rationale: 采用通行中文圣经人名译法。
