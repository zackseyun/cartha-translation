  to: 他们攻取了那城，用刀剑毁灭了那城、该城的王、所有属城，以及城中所有的人。他没有留下一个幸存者，正如他对伊矶伦所做的一样。他把那城和城中所有的人都彻底毁灭了[a]。
  rationale: 修订消除了“属城的一切城邑”的重复和“城王”“献作毁灭”的不自然搭配。保留原文由复数“他们”转为单数“他”的变化，并保留两次“城中所有的人”的重复。以脚注交代חרם的技术含义，不额外补入原文未明示的神学解释。
