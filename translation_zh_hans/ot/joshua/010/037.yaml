  text: וַ/יִּלְכְּד֣וּ/הָ וַ/יַּכּֽוּ/הָ לְ/פִי חֶ֠רֶב וְ/אֶת מַלְכָּ֨/הּ וְ/אֶת כָּל עָרֶ֜י/הָ וְ/אֶת כָּל הַ/נֶּ֤פֶשׁ אֲשֶׁר בָּ/הּ֙ לֹֽא הִשְׁאִ֣יר שָׂרִ֔יד כְּ/כֹ֥ל אֲשֶׁר עָשָׂ֖ה לְ/עֶגְל֑וֹן וַ/יַּחֲרֵ֣ם אוֹתָ֔/הּ וְ/אֶת כָּל הַ/נֶּ֖פֶשׁ אֲשֶׁר בָּֽ/הּ־־־־־־־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/037.yaml
  text: And they captured it and struck it with the edge of the sword[a], along with its king, all its cities, and every person who was in it. He left no survivor, just as he had done to Eglon. He devoted it to destruction, along with every person who was in it.
translation:
  language: zh_hans
  text: 他们攻取了那城，用刀剑毁灭了那城、该城的王、所有属城，以及城中所有的人。他没有留下一个幸存者，正如他对伊矶伦所做的一样。他把那城和城中所有的人都彻底毁灭了[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“献作归于毁灭”。希伯来语为技术用语，指将人或物献作归于毁灭。
    reason: 说明חרם的技术含义，并保留“彻底毁灭”之外的可接受译法。
lexical_decisions:
- source_word: וַיִּלְכְּדוּהָ
  choice: 他们攻取了那城
  rationale: לכד在攻城叙事中指夺取、攻占城邑；“攻取”既保留军事含义，也符合庄重而自然的现代汉语。
- source_word: וַיַּכּוּהָ לְפִי חֶרֶב
  choice: 用刀毁灭了那城
  rationale: נכה含义较宽，לְפִי חֶרֶב是以刀剑施行杀戮的惯用语。汉语若直译为“用刀击打那城”容易误解，因此按语境译为“用刀毁灭了那城”，同时不与后面的技术用语חרם混同。
- source_word: מַלְכָּהּ
  choice: 城王
  rationale: 指该城的王；“城王”简洁地表达希伯来语的领属关系。
- source_word: כָּל עָרֶיהָ
  choice: 属城的一切城邑
  rationale: עיר可指城或城镇；复数领属形式在此指隶属于希伯仑的城邑。“属城”明确其关系而不限定其规模。
- source_word: כָּל הַנֶּפֶשׁ אֲשֶׁר בָּהּ
  choice: 城中所有的人
  rationale: נפש在这里指人或生命，并非专指非物质的“灵魂”；此译法清楚自然。
- source_word: לֹא הִשְׁאִיר שָׂרִיד
  choice: 他没有留下一个幸存者
  rationale: 保留原文由复数行动者转为单数主语的变化，不在正文中明说主语必定是谁；שָׂרִיד译为“幸存者”准确自然。
- source_word: כְּכֹל אֲשֶׁר עָשָׂה לְעֶגְלוֹן
  choice: 正如他对伊矶伦所做的一样
  rationale: 忠实表达与先前处置伊矶伦的比较关系。
- source_word: וַיַּחֲרֵם
  choice: 献作毁灭
  rationale: חרם在此不仅表示彻底消灭，也带有划归、奉献而毁灭的技术含义；“献作毁灭”保留这层张力，脚注提供较通顺的替代译法。
theological_decisions:
- issue: 战争叙事中חרם的翻译
  choice: 献作毁灭
  alternative: 彻底毁灭
  rationale: 原词兼有划归为禁物或献上以及毁灭的含义。正文保留其奉献与毁灭并存的技术色彩，不把它简化为普通的军事消灭，也不补入原文未明说的接受者。
- issue: לֹא הִשְׁאִיר的单数主语
  choice: 他没有留下一个幸存者
  alternative: 约书亚没有留下一个幸存者
  rationale: 上下文很可能以约书亚为概括性主语，但本节希伯来文本只用单数动词而未重提姓名，因此以“他”保留原文的指代方式。
translation_notes:
  register: 采用现代、庄重、可朗读的标准普通话。避免“用刀口击杀”等生硬直译；保留原文从复数“他们”转为单数“他”的叙事变化，并将脚注标记置于חרם对应语句之后。
