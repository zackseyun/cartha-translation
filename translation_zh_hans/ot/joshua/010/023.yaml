base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/023.yaml
  text: 'And they did so, and brought out to him from the cave these five kings: the king of Jerusalem, the king of Hebron, the king of Jarmuth, the king of Lachish, and the king of Eglon.'
translation:
  language: zh_hans
  text: 他们就这样做了，把这五个王从洞里带到约书亚那里，就是耶路撒冷王、希伯仑王、耶末王、拉吉王和伊矶伦王。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲשׂוּ כֵן
  choice: 他们就照样做了
  rationale: 这是希伯来叙事中表示遵照前令而行的惯用语；“照样做了”自然、明确，并保留原文简洁的承接关系。
- source_word: וַיֹּצִיאוּ
  choice: 带到
  rationale: 该词是יצא的使役形，基本义为“使出来、带出来”；结合后面的“从洞里”和“到他那里”，译为“把……从洞里带到……”可避免中文中“带出来到……”的累赘，同时完整表达移动过程。
- source_word: אֵלָיו
  choice: 到约书亚那里
  rationale: 原文直译为“到他那里”，上文所指是约书亚。中文明确写出人名可避免跨节代词指向不清；没有扩译为“带到他面前”，以免加入原文未明说的呈献含义。
- source_word: חֲמֵשֶׁת הַמְּלָכִים הָאֵלֶּה
  choice: 这五个王
  rationale: 直接保留数词、指示词和“王”的称谓；现代中文自然易懂。
- source_word: מִן הַמְּעָרָה
  choice: 从洞里
  rationale: 准确表达从洞穴内部出来的空间关系；“洞里”比“山洞中”更贴近原文未加修饰的“洞穴”。
- source_word: מֶלֶךְ
  choice: 王
  rationale: 这是该词在此处准确而通行的对应词；“统治者”范围过宽。
- source_word: יְרוּשָׁלִַם
  choice: 耶路撒冷
  rationale: 采用现代中文圣经及一般汉语通行地名。
- source_word: חֶבְרוֹן
  choice: 希伯仑
  rationale: 采用现代中文圣经通行译名。
- source_word: יַרְמוּת
  choice: 耶末
  rationale: 采用现代中文圣经通行译名。
- source_word: לָכִישׁ
  choice: 拉吉
  rationale: 采用现代中文圣经通行译名。
- source_word: עֶגְלוֹן
  choice: 伊矶伦
  rationale: 采用现代中文圣经通行译名；这里是城名，其王被列在五王之中。
theological_decisions: []
