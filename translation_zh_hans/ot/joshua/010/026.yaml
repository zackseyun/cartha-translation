source:
  edition: WLC
  text: וַ/יַּכֵּ֨/ם יְהוֹשֻׁ֤עַ אַֽחֲרֵי כֵן֙ וַ/יְמִיתֵ֔/ם וַ/יִּתְלֵ֕/ם עַ֖ל חֲמִשָּׁ֣ה עֵצִ֑ים וַ/יִּֽהְי֛וּ תְּלוּיִ֥ם עַל הָ/עֵצִ֖ים עַד הָ/עָֽרֶב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/026.yaml
  text: After this Joshua struck them down and put them to death[a], and he hanged them on five trees; and they remained hanging on the trees until the evening.
translation:
  language: zh_hans
  text: 此后，约书亚击打他们，把他们处死[a]，又把他们悬挂在五棵树上。他们一直悬挂在树上，直到傍晚。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“杀死他们”。原文先说约书亚击打他们并使他们死亡，随后才说把他们悬挂起来；这里的“悬挂”可能指将尸体挂在树木上示众，原文没有明确说明是以悬挂或刺穿的方式处死。
    reason: 说明原文动作次序，并保留悬挂方式与性质上的词义不确定性。
lexical_decisions:
- source_word: וַיַּכֵּם
  choice: 击打他们
  rationale: נכה 的使役形在这里表示约书亚击打这五王；与随后明确表示处死的 וַיְמִיתֵם 分开翻译，避免合并两个动作。
- source_word: אַחֲרֵי כֵן
  choice: 此后
  rationale: 自然、简洁地表达叙事中的时间先后。
- source_word: וַיְמִיתֵם
  choice: 把他们处死
  rationale: מות 的使役形意为使之死亡；“处死”符合行刑语境，并保留其使役和正式色彩。
- source_word: וַיִּתְלֵם
  choice: 把他们悬挂
  rationale: תלה 指把人或尸体悬挂在树木或木头上以示众；“悬挂”不武断说明具体方式，也避免让人误以为必由绳索绞死。
- source_word: עַל חֲמִשָּׁה עֵצִים
  choice: 在五棵树上
  rationale: עֵץ 可指树或木头；本处直译为“树”最能保留原文用词，不擅自具体化为木杆或刑架。
- source_word: וַיִּהְיוּ תְּלוּיִם
  choice: 一直悬挂
  rationale: היה 加被动分词表达持续状态；“一直悬挂”清楚呈现从悬挂到傍晚的延续。
- source_word: עַד הָעָרֶב
  choice: 直到傍晚
  rationale: 贴近原文的时间终点；不进一步解释为日落。
theological_decisions:
- issue: 行刑与悬挂之间的关系
  choice: 先译“把他们处死”，再译“悬挂”
  alternative: 将悬挂理解为处死的方法
  rationale: 原文先用 וַיְמִיתֵם 明说使他们死亡，随后另用 וַיִּתְלֵם 表示悬挂。译文保留动作次序，不把悬挂确定为致死手段。
- issue: עֵץ 在示众语境中的所指
  choice: 树
  alternative: 木杆、刑架
  rationale: 该词本身可指树或木头，语境未限定具体器具；采用“树”保留原文的普通含义及其可能的开放性。
translation_notes:
  register: 采用现代、庄重而易懂的叙事体。“击打”保留与“处死”并列的两个希伯来语动词；“悬挂”比“吊死”更准确，因为后者会暗示悬挂本身是死因。脚注标记[a]已置于正文相应位置。
