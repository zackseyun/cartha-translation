id: JOS.10.11
reference: Joshua 10:11
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יְהִ֞י בְּ/נֻסָ֣/ם מִ/פְּנֵ֣י יִשְׂרָאֵ֗ל הֵ֞ם בְּ/מוֹרַ֤ד בֵּית חוֹרֹן֙ וַֽ/יהוָ֡ה הִשְׁלִ֣יךְ עֲלֵי/הֶם֩ אֲבָנִ֨ים גְּדֹל֧וֹת מִן הַ/שָּׁמַ֛יִם עַד עֲזֵקָ֖ה וַ/יָּמֻ֑תוּ רַבִּ֗ים אֲשֶׁר מֵ֨תוּ֙ בְּ/אַבְנֵ֣י הַ/בָּרָ֔ד מֵ/אֲשֶׁ֥ר הָרְג֛וּ בְּנֵ֥י יִשְׂרָאֵ֖ל בֶּ/חָֽרֶב׀־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/011.yaml
  text: And as they fled before Israel[a], while they were on the descent of Beth-horon, Yahweh threw large stones from heaven on them as far as Azekah, and they died. More died from the hailstones than the sons of Israel killed with the sword.
translation:
  language: zh_hans
  text: 当他们从以色列人面前逃跑、正在伯和仑的下坡路上时，雅威从天上向他们投下大石头，直到亚西加；他们中许多人死了。死于冰雹的人，比以色列人用刀杀死的人还多。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֻסָם מִפְּנֵי יִשְׂרָאֵל
  choice: 他们从以色列人面前逃跑
  rationale: בְּ加不定式表示与主句同时发生的动作；מִפְּנֵי在战事语境中表示从敌方面前败逃。“从以色列人面前逃跑”既贴近原文，又符合现代汉语。
- source_word: בְּמוֹרַד בֵּית חוֹרֹן
  choice: 到了伯和仑的下坡路上时
  rationale: מוֹרַד指下行的坡道或下坡路；此译保留叙事中的地形信息，并自然表达他们逃亡途中所处的位置。
- source_word: הִשְׁלִיךְ עֲלֵיהֶם
  choice: 把……投向他们
  rationale: הִשְׁלִיךְ意为投、抛；“投向”保留动作性，也避免额外解释这些石块的自然机制。
- source_word: אֲבָנִים גְּדֹלוֹת מִן הַשָּׁמַיִם
  choice: 从天上把大石头
  rationale: 先按原文译为“大石头”，保留后文才将其说明为冰雹的叙事推进；“天上”兼有空间和神学意味。
- source_word: עַד עֲזֵקָה
  choice: 一路直到亚西加
  rationale: עַד在这里表示沿逃亡路线所达到的空间范围；“一路直到”在汉语中清楚呈现这一延伸。
- source_word: בְּאַבְנֵי הַבָּרָד
  choice: 死于冰雹
  rationale: 字面为“冰雹之石”，即冰雹。现代汉语直接说“冰雹”最自然，同时与前文“大石头”形成由概括描述到具体说明的推进。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 该短语在此是民族称谓，所指为以色列军队；“以色列人”比直译“以色列的儿子们”更符合现代标准汉语，且不改变所指。
- source_word: בֶּחָרֶב
  choice: 用刀
  rationale: 工具性介词בְּ自然译为“用”；חֶרֶב在战事中指刀剑类兵器，采用中文圣经叙事中简洁自然的“刀”。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。音译“雅威”保留其作为以色列之神立约名字的性质，而不以称号“主”取代，也不采用较晚形成的混合读音。
- issue: 天降之物的性质
  choice: 先译“大石头”，后译“冰雹”
  alternative: 两处都直接译为“冰雹”或“冰雹石”
  rationale: 原文先称其为“大石头”，后以“冰雹之石”加以说明。保留两个阶段，既不抹平叙事表达，也不把两者解释成不同事物。
- issue: 死亡人数的比较
  choice: 死于冰雹的人，比以色列人用刀杀死的还多
  alternative: 许多人死于冰雹，超过以色列人用刀所杀的
  rationale: 原文的רַבִּים与后面的מֵאֲשֶׁר构成数量比较。此译明确表达神所降冰雹造成的死亡多于以色列军队所杀，同时不增添原因或评价。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。地名使用常见中文圣经译名“伯和仑”“亚西加”；句法保留逃亡、所在地点、神的行动及死亡人数比较的叙事次序。
