  source_fidelity: 原译整体准确传达了约书亚取得这些王及其土地、且雅威为以色列争战这一因果关系；神名“雅威”及“为以色列争战”均忠实。惟“攻取……王”不符合现代汉语通常搭配，宜分别表达对君王的擒获和对土地的攻取。
  naturalness: “一次攻取了所有这些王和他们的土地”中，“一次”位置略显生硬，且“攻取王”不自然。改为“一次就擒获了……并攻取了……”更符合现代庄重汉语，同时保留“一次”的语义。
  terminology: “雅威”“以色列的上帝”“争战”使用恰当，保持专名和叙事的庄重军事语域。
  issues:
