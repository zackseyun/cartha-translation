  to: 约书亚一次就擒获了所有这些王，并攻取了他们的土地，因为以色列的上帝雅威为以色列争战。
  rationale: 修订仅处理汉语动宾搭配及语序。“擒获……王，并攻取……土地”将原文中同一军事行动在汉语中按对象自然展开；“一次就”保留原文“一次”的表述，未将“战役”这一语境性理解直接写入正文。
