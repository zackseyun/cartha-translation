base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/042.yaml
  text: Joshua captured all these kings and their land at one time[a], because Yahweh, the God of Israel, fought for Israel.
translation:
  language: zh_hans
  text: 约书亚一次就擒获了所有这些王，并攻取了他们的土地，因为以色列的上帝雅威为以色列争战。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לָכַד
  choice: 攻取
  rationale: 该动词表示捕获、夺取；这里同时支配“王”和“土地”。“攻取”保留军事语境，也避免用“征服”过度解释战果。
- source_word: וְאֵת כָּל הַמְּלָכִים הָאֵלֶּה
  choice: 所有这些王
  rationale: 直接体现全称词和指示词，符合现代汉语表达。
- source_word: וְאֶת אַרְצָם
  choice: 和他们的土地
  rationale: אֶרֶץ 可指土地、国土或疆域；“土地”最宽泛，并保留原文表达。
- source_word: פַּעַם אֶחָת
  choice: 一次
  rationale: 原文直译为“一次”，在上下文中可能指一次战役或一轮军事行动；正文保留简洁且较为形式对应的表达，并以脚注说明语境性译法。
- source_word: כִּי
  choice: 因为
  rationale: 这里引出约书亚得胜的原因；“因为”清楚保留因果关系。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以中文常用音译呈现四字神名，保留其专名性质，不以称号替代。
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: 以色列的上帝
  rationale: 自然、直接地翻译该属格结构。
- source_word: נִלְחָם לְיִשְׂרָאֵל
  choice: 为以色列争战
  rationale: לחם 的 Niphal 形式与介词 ל 连用，表示为某方作战；“为以色列争战”简洁地保留受益关系和军事含义。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”按较通行的学术重构音译这一专名，而不是用“主”等称号替代。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“攻取”维持军事语域；“争战”略带经文庄重感，但现代读者仍容易理解。
