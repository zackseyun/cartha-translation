base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/034.yaml
  text: Then Joshua, and all Israel with him, passed on from Lachish to Eglon; and they camped against it and fought against it.
translation:
  language: zh_hans
  text: 约书亚同全体以色列人从拉吉前往伊矶伦；他们在城前安营，并攻打那城。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲבֹר
  choice: 转往
  rationale: 此处叙述军队从一座城推进到另一座城，并未说明越过河流或边界；“转往”自然表达行军进程，也避免过度具体化。
- source_word: וְכָל יִשְׂרָאֵל עִמּוֹ
  choice: 和跟随他的全体以色列人
  rationale: עִמּוֹ直译为“与他同在／跟他一起”；结合军事行军语境，用“跟随他的”清楚表达约书亚率领全体以色列人同行，同时保留“全体以色列”的集体称谓。
- source_word: מִלָּכִישׁ עֶגְלֹנָה
  choice: 从拉吉转往伊矶伦
  rationale: מִן标明出发点，方向词尾־ָה标明目的地；按现代汉语自然译为“从拉吉……往伊矶伦”。
- source_word: וַיַּחֲנוּ עָלֶיהָ
  choice: 在城外安营
  rationale: חנה指安营；在围城语境中，עַל表示针对该城的敌对部署。“在城外安营”以自然汉语呈现场景，但不把方位细化为原文未说明的特定一侧。
- source_word: וַיִּלָּחֲמוּ עָלֶיהָ
  choice: 攻打那城
  rationale: לחם的尼法勒式在此表示交战，עַל指出行动所针对的对象；“攻打那城”符合现代军事叙事，也避免生硬重复“与它争战”。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而通顺的叙事语言。地名依《和合本》传统译名“拉吉、伊矶伦”，便于普通中文读者辨识；将原文两次阴性单数代词按所指对象明确为“城／那城”。
