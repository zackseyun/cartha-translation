  text: וַ/יְהִ֞י לְ/עֵ֣ת בּ֣וֹא הַ/שֶּׁ֗מֶשׁ צִוָּ֤ה יְהוֹשֻׁ֨עַ֙ וַ/יֹּֽרִידוּ/ם֙ מֵ/עַ֣ל הָ/עֵצִ֔ים וַ/יַּ֨שְׁלִכֻ֔/ם אֶל הַ/מְּעָרָ֖ה אֲשֶׁ֣ר נֶחְבְּאוּ שָׁ֑ם וַ/יָּשִׂ֜מוּ אֲבָנִ֤ים גְּדֹלוֹת֙ עַל פִּ֣י הַ/מְּעָרָ֔ה עַד עֶ֖צֶם הַ/יּ֥וֹם הַ/זֶּֽה׀־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/027.yaml
  text: And at the time of the sun’s going down[a], Joshua commanded, and they took them down from the trees and threw them into the cave where they had hidden there[b], and they placed large stones over the mouth of the cave to this very day.
translation:
  language: zh_hans
  text: 日落的时候[a]，约书亚下令，他们就把那五个王从树上取下来，扔进他们先前藏身的那个洞里[b]，又在洞口放上大石头；这些石头直到今日还在那里。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“太阳落下的时候”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来原文直译为“他们曾在那里藏身的洞”；原文明确有“在那里”，带有强调意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: לְעֵת בּוֹא הַשֶּׁמֶשׁ
  choice: 太阳落下的时候
  rationale: 这一时间短语直陈太阳“进入/落下”的时刻。译文保留太阳落下的动态意象，同时符合现代汉语表达。
- source_word: צִוָּה יְהוֹשֻׁעַ
  choice: 约书亚下令
  rationale: צוה表示发出命令；“下令”简洁自然，并使后续众人执行命令的动作清楚连贯。
- source_word: וַיּוֹרִידוּם מֵעַל הָעֵצִים
  choice: 他们就把那五个王从树上取下来
  rationale: 该动词为使役性向下移动，在悬挂尸体的语境中，“从树上取下来”是准确自然的汉语。“那五个王”依紧邻上文明确代词所指，避免汉语连续代词产生歧义。
- source_word: וַיַּשְׁלִכֻם
  choice: 扔进
  rationale: 该词常指投掷、抛扔；“扔进”直接保留动作的强烈程度，并与目的地“洞里”自然搭配。
- source_word: אֶל הַמְּעָרָה אֲשֶׁר נֶחְבְּאוּ שָׁם
  choice: 扔进他们先前藏身的那个洞里
  rationale: 用“先前”体现藏身发生在本段动作以前；“那个洞”明确回指此前的洞。希伯来文另有显明的“在那里”，其强调在脚注中保留，以免正文形成不自然的汉语重复。
- source_word: וַיָּשִׂמוּ אֲבָנִים גְּדֹלוֹת
  choice: 又把大石头放在
  rationale: “放在”直接对应设置、安放之意；“大石头”明确表达尺寸，不采用可能偏书面的“巨石”。
- source_word: עַל פִּי הַמְּעָרָה
  choice: 洞口
  rationale: 原文直译为洞的“口”；“洞口”既保留这一词汇意象，也是现代汉语的常用表达。
- source_word: עַד עֶצֶם הַיּוֹם הַזֶּה
  choice: 直到今日
  rationale: 这是叙事中表示某状态持续到叙述者当时的固定表达；“直到今日”保留 עֶצֶם 所加强的时间指向，且不额外补出原文未明说的主语或状态动词。
