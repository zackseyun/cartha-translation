base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/033.yaml
  text: Then Horam king of Gezer went up to help Lachish[a], and Joshua struck him and his people until he left him no survivor.
translation:
  language: zh_hans
  text: 那时，基色王何兰上来援助拉吉；约书亚击败了他和他的百姓，没有给他留下一个生还者[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“剩下的人”。希伯来语“שָׂרִיד”可指生还的人或剩下的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: 那时
  rationale: 表示叙事中的时间推进；“那时”自然庄重，也可理解为“于是”。
- source_word: עָלָה
  choice: 上来
  rationale: 保留“上去、上来”的基本空间意象；在此军事语境中指前来参战，但不额外明说“率军”。
- source_word: הֹרָם
  choice: 何兰
  rationale: 按现代中文圣经人名音译习惯处理该专名。
- source_word: מֶלֶךְ גֶּזֶר
  choice: 基色王
  rationale: 简洁表达希伯来语所属结构，即“基色的王”。
- source_word: לַעְזֹר אֶת לָכִישׁ
  choice: 援助拉吉
  rationale: עזר意为帮助、援助；军事语境中“援助”比一般性的“帮助”更贴切，同时不增加原文未明说的细节。
- source_word: וַיַּכֵּהוּ
  choice: 击杀了他
  rationale: נכה可指击打、击败或击杀；下文明确无人留下，因此“击杀”符合此处语境，并保留动作性。
- source_word: וְאֶת עַמּוֹ
  choice: 和他的百姓
  rationale: עַם的基本义是“人民、百姓”；虽然语境可能主要涉及作战人员，但原文没有限定为军队。
- source_word: עַד בִּלְתִּי הִשְׁאִיר לוֹ
  choice: 没有给他留下一个
  rationale: 自然表达行动达到无人剩下的结果；“给他留下”保留希伯来语中לוֹ所表达的关联。
- source_word: שָׂרִיד
  choice: 生还者
  rationale: 该词可指存活或剩下的人；“生还者”在战事语境中最自然，同时以脚注保留“余民”的可能译法。
theological_decisions: []
translation_notes:
  register: 采用现代、清楚而庄重的叙事语言。“上来”保留原文空间表达；“百姓”避免把原文范围擅自缩小为军队。脚注标记置于“生还者”之后，与其所说明的词准确对应。
