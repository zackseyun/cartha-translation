  text: אָ֣ז יְדַבֵּ֤ר יְהוֹשֻׁעַ֙ לַֽ/יהוָ֔ה בְּ/י֗וֹם תֵּ֤ת יְהוָה֙ אֶת הָ֣/אֱמֹרִ֔י לִ/פְנֵ֖י בְּנֵ֣י יִשְׂרָאֵ֑ל וַ/יֹּ֣אמֶר לְ/עֵינֵ֣י יִשְׂרָאֵ֗ל שֶׁ֚מֶשׁ בְּ/גִבְע֣וֹן דּ֔וֹם וְ/יָרֵ֖חַ בְּ/עֵ֥מֶק אַיָּלֽוֹן־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/012.yaml
  text: Then Joshua spoke to Yahweh on the day when Yahweh gave the Amorites over before the sons of Israel[a], and he said in the sight of Israel, “Sun, stand still at Gibeon, and moon[c][b], in the Valley of Aijalon.”
translation:
  language: zh_hans
  text: '在雅威把亚摩利人交在以色列人面前的那一天[a]，约书亚向雅威说话；他当着以色列人的面说：


    “太阳啊，停在基遍[b]；

    月亮啊，停在亚雅仑谷。”[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“把亚摩利人交给以色列人”。希伯来文直译为“把亚摩利人交在以色列子孙面前”。
    reason: lexical_alternative
  - marker: b
    text: “停”也可译作“静止”或“停住”；这个希伯来语动词也可表示“沉默”。
    reason: lexical_alternative
  - marker: c
    text: 希伯来文直译为“月亮啊，在亚雅仑谷”，承接上一句的动词“停”。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְדַבֵּר ... וַיֹּאמֶר
  choice: 说话……说
  rationale: 分别保留希伯来文两个动词的表达：דבר 表示“说话”，אמר 引出约书亚公开说出的命令。
- source_word: בְּיוֹם תֵּת יְהוָה
  choice: 在雅威……的那一天
  rationale: 将 בְּיוֹם 与不定式结构按时间关系译出，既贴近原文，也符合现代汉语习惯。
- source_word: הָאֱמֹרִי
  choice: 亚摩利人
  rationale: 原词形态上是单数，但在战争语境中集合性地指亚摩利族群，汉语用“亚摩利人”自然且准确。
- source_word: לִפְנֵי בְּנֵי יִשְׂרָאֵל
  choice: 交在以色列人面前
  rationale: 保留 לִפְנֵי“在……面前”的空间意象，同时以“以色列人”自然表达集体称谓；脚注说明原文的亲属性用语。
- source_word: לְעֵינֵי יִשְׂרָאֵל
  choice: 当着以色列众人的面
  rationale: 这是表示公开可见、在场见证的习语；此译法比逐字译作“在以色列眼前”更自然。
- source_word: שֶׁמֶשׁ ... דּוֹם
  choice: 太阳啊，停在基遍
  rationale: דום 可表示静止、停止或沉默；在此宇宙性命令的语境中，“停”简洁自然，同时不具体解释天体如何停止。
- source_word: בְּגִבְעוֹן
  choice: 在基遍
  rationale: 保留介词 בְּ 的宽泛空间关系，不擅自限定为“在……上空”。
- source_word: וְיָרֵחַ בְּעֵמֶק אַיָּלוֹן
  choice: 月亮啊，停在亚雅仑谷
  rationale: 原文第二分句省略动词，汉语正文补出由上句承接的“停”，以清楚呈现平行命令，并用脚注交代省略现象。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名。采用“雅威”作为 Yahweh 的现代汉语音译，保留其专名性质，不以称号替代。
- issue: 日月停止之命令的表述
  choice: 保留直接命令“停”
  alternative: 解释为日月停止运行，或仅指看起来不动
  rationale: 原文以诗体直接命令日月，却没有说明其物理机制或观察视角；译文保留这种张力，不加入调和性解释。
translation_notes:
  register: 采用庄重而清晰的现代标准汉语。公开发言的叙事部分使用自然散文，日月命令按原文平行结构分行，以呈现诗歌色彩。“当着……的面”避免生硬直译，“交在……面前”则有意保留原文在交付与临阵显露之间的表达张力。
