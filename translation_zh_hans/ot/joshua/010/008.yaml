  text: וַ/יֹּ֨אמֶר יְהוָ֤ה אֶל יְהוֹשֻׁ֨עַ֙ אַל תִּירָ֣א מֵ/הֶ֔ם כִּ֥י בְ/יָדְ/ךָ֖ נְתַתִּ֑י/ם לֹֽא יַעֲמֹ֥ד אִ֛ישׁ מֵ/הֶ֖ם בְּ/פָנֶֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/008.yaml
  text: And Yahweh said to Joshua, “Do not fear them, for I have given them into your hand. Not a man among them will stand before you.”
translation:
  language: zh_hans
  text: 雅威对约书亚说：“不要怕他们，因为我已经把他们交在你手中。他们中没有一人能在你面前站立得住。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常用音译呈现四字神名，保留其作为以色列之神专名的性质，不以称号替代。
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: אמר的叙事性连续式在此引出直接引语；“说”是自然、准确的现代汉语表达。
- source_word: אַל תִּירָא מֵהֶם
  choice: 不要怕他们
  rationale: מן在ירא之后标示惧怕的对象；汉语直接译作“怕他们”简洁自然。
- source_word: כִּי
  choice: 因为
  rationale: 此处引出不要惧怕的理由，“因为”清楚表达因果关系。
- source_word: בְיָדְךָ
  choice: 在你手中
  rationale: 保留希伯来语“手”的意象，同时汉语也能自然表达被交在某人权下。
- source_word: נְתַתִּים
  choice: 我已经把他们交
  rationale: 完成式出现在神的应许中，表达神已确定成就之事；“已经”保留其完成性和当前效力。
- source_word: לֹא יַעֲמֹד אִישׁ מֵהֶם
  choice: 他们中没有一人能……站立得住
  rationale: אִישׁ为单数代表用法，语境指敌方战士；“没有一人”既准确又符合现代汉语习惯。
- source_word: בְּפָנֶיךָ
  choice: 在你面前
  rationale: 保留原文方位表达；与“站立得住”连用时，军事语境中的“无法抵挡你”之意清楚可见。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名；采用“雅威”保留专名，并较贴近学界通常重构的读音，不以“主”这一称号代替。
- issue: 神所说的完成式נְתַתִּים
  choice: 我已经把他们交在你手中
  alternative: 我要把他们交在你手中；我把他们交在你手中
  rationale: “已经”体现希伯来语完成式，并保留神将未来胜利说成已经确定之事的张力，而不把它单纯改写为未来时。
- issue: אִישׁ在战争语境中的表达
  choice: 没有一人
  alternative: 没有一个人；没有一个男人
  rationale: 所指为敌方战士，但本句重点是无一例外，而非强调生理性别；“没有一人”保留单数代表性和全称否定，也符合庄重自然的汉语。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“交在你手中”和“在你面前站立得住”保留原文意象，同时在汉语中含义清楚；全句维持神谕简洁有力的语气。
