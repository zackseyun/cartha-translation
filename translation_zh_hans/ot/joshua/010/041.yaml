  yaml_path: translation/ot/joshua/010/041.yaml
  text: And Joshua struck them from Kadesh-barnea as far as Gaza[a], and all the land of Goshen, as far as Gibeon.
translation:
  language: zh_hans
  text: 约书亚从加低斯·巴尼亚直到加沙，又从歌珊全地直到基遍，击败了他们[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “击败”也可译作“击打”或“击倒”。希伯来语动词可表示军事上的打击或战胜，并不总是明确说明具体方式。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכֵּם
  choice: 击败了……的人
  rationale: נכה在军事语境中可指打击或击败；此处带第三人称阳性复数宾语后缀，回指上文所涉及的人群。译作“击败”既自然，也不额外断定所有人都被杀死。
- source_word: מִקָּדֵשׁ בַּרְנֵעַ
  choice: 从加低斯·巴尼亚
  rationale: מִן标明战事范围的起点；地名采用现代中文圣经中易识别的音译，并以间隔号连接复合地名。
- source_word: וְעַד עַזָּה
  choice: 直到加沙一带
  rationale: עַד表示地域延伸的界限。“直到……一带”说明这里描述的是征战范围，而不只是抵达某个目的地。
- source_word: וְאֵת כָּל אֶרֶץ גֹּשֶׁן
  choice: 又攻取了歌珊全地
  rationale: אֵת引出另一个受动地域；依照本段征服语境补出“攻取”，使现代汉语句法完整，同时保留“全地”的范围。
- source_word: וְעַד גִּבְעוֹן
  choice: 直到基遍
  rationale: עַד再次标示地域界限，译作“直到”与前面的范围表达对应。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准普通话。“击败”避免把原文含义收窄为全部杀死；“一带”帮助读者理解“从……直到……”是在勾勒征战地域。脚注标记置于与歧义词“击败”相关的分句末。
