base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/035.yaml
  text: And they captured it that day and struck it with the edge of the sword[a], and every person who was in it he devoted to destruction that day[b], according to all that he had done to Lachish.
translation:
  language: zh_hans
  text: 他们当天攻取了那城，并用刀剑击杀了城中的人[a]。那天，约书亚把城里所有的人都尽行毁灭[b]，正如他对拉吉所做的一样。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“用刀剑之口击打它”；这是战争叙事中的惯用语，指以刀剑杀戮城中的居民。
    reason: lexical_alternative
  - marker: b
    text: 或译“完全毁灭”。这里的希伯来语动词指把人或物置于禁令之下，献作毁灭。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּלְכְּדוּהָ
  choice: 他们……攻取了那城
  rationale: לכד在军事语境中指攻占城邑；“攻取”自然、庄重，也明确阴性代词所指的是前文的城。
- source_word: בַּיּוֹם הַהוּא
  choice: 当天／那天
  rationale: 保留同日完成行动的强调；按汉语行文分别译作“当天”和“那天”，避免机械重复。
- source_word: וַיַּכּוּהָ לְפִי חֶרֶב
  choice: 用刀剑击杀城中的人
  rationale: 希伯来语字面为“用刀剑之口击打它”，是攻城叙事中杀戮居民的惯用表达。中文若直译为“击打那城”容易误解，因此显明其语境所指，同时以脚注保留原文意象。
- source_word: כָּל הַנֶּפֶשׁ אֲשֶׁר בָּהּ
  choice: 城里所有的人
  rationale: נפש在此指城中的活人，并非专指与身体相分离的“灵魂”；“所有的人”准确且符合现代汉语。
- source_word: הֶחֱרִים
  choice: 尽行毁灭
  rationale: חרם的使役形在征服语境中含有置于禁令之下、献作毁灭之物的专门意味。“尽行毁灭”正文可读，并由脚注说明其祭仪性和禁令色彩。
- source_word: כְּכֹל אֲשֶׁר עָשָׂה לְלָכִישׁ
  choice: 正如他对拉吉所做的一切
  rationale: ככל表示与先前对拉吉的行动完全对应；保留עשה的第三人称阳性单数，以“他”指约书亚。
theological_decisions:
- issue: 征服语境中חרם／החרים的译法
  choice: 尽行毁灭
  alternative: 献作毁灭之物／置于禁令之下
  rationale: 正文需自然表达实际毁灭行动，同时不可抹去该词超出一般杀灭的献置或禁令含义，故以脚注保存其专门语义。
- issue: נפש在城邑人口语境中的译法
  choice: 人
  alternative: 性命／魂
  rationale: 此处指城中每一个活人；译作“魂”会在中文中引入原文在这里并未强调的灵魂—身体区分。
- issue: החרים与עשה的单数施事者
  choice: 明确译为“约书亚……他”
  alternative: 他们
  rationale: 两个动词均为第三人称阳性单数，叙事将尽行毁灭及对拉吉所做之事归于约书亚；补出姓名可使中文中的主语转换清楚，而不把单数悄然改成复数。
translation_notes:
  register: 采用现代、庄重而清楚的叙事体。“攻取”“尽行毁灭”保留圣经历史叙事的力度，但避免生硬仿古；补出“约书亚”以清楚呈现希伯来语从复数主语转为单数主语的变化。
