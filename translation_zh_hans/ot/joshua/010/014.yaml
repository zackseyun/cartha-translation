  - severity: low
    issue: “竟”虽能表现上下文的非凡性，却不是原文独立词项。
    rationale: 原文的强调主要由“没有……像那日”表达；删去“竟”可避免在正文额外加入说话者的惊异语气，同时不损失强调。
  revised_text: 在这日以前或以后，没有哪一日像那日一样：耶和华垂听一个人的声音；因为耶和华为以色列争战。[a]
