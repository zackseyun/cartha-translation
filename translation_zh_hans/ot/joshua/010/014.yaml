  text: וְ/לֹ֨א הָיָ֜ה כַּ/יּ֤וֹם הַ/הוּא֙ לְ/פָנָ֣י/ו וְ/אַחֲרָ֔י/ו לִ/שְׁמֹ֥עַ יְהוָ֖ה בְּ/ק֣וֹל אִ֑ישׁ כִּ֣י יְהוָ֔ה נִלְחָ֖ם לְ/יִשְׂרָאֵֽל׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/014.yaml
  text: And there was no day like that before it or after it[a], when Yahweh listened to the voice of a man, for Yahweh fought for Israel.
translation:
  language: zh_hans
  text: 在这日以前或以后，没有哪一日像那日一样：耶和华垂听一个人的声音；因为耶和华为以色列争战。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“耶和华垂听了一个人的请求。”希伯来文直译为“耶和华听一个人的声音”。
    reason: 说明“听……声音”这一希伯来语习语可指垂听、应允请求，同时保留正文较贴近原文的表述。
lexical_decisions:
- source_word: וְלֹא הָיָה כַּיּוֹם הַהוּא
  choice: 再没有像那日一样的日子
  rationale: 以自然现代汉语表达否定存在句和比较结构，突出那日无可比拟，同时保留“日子”的重复以贴近原文。
- source_word: לְפָנָיו וְאַחֲרָיו
  choice: 在那日以前或以后
  rationale: 代词后缀最自然地回指“那日”；汉语中明说“那日”可消除指代含混。
- source_word: לִשְׁמֹעַ יְהוָה בְּקוֹל אִישׁ
  choice: 耶和华竟听了一个人的声音
  rationale: 保留希伯来语“听……的声音”这一表达，并以“竟”传达此事作为那日独特之处的惊异意味；不译成“服从”，以免引入神受人支配的含义。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的神名音译，明确呈现专名而非以称号替代。
- source_word: כִּי
  choice: 因为
  rationale: 将后句呈现为对这一非凡事件的解释或根据。
- source_word: נִלְחָם לְיִשְׂרָאֵל
  choice: 为以色列争战
  rationale: 准确表达该动词及介词结构所指的代表、帮助以色列作战，且符合庄重自然的中文用语。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 中文正文采用广为人知的专名“耶和华”，既保留四字神名作为专名的功能，也避免改用“主”而遮蔽原文的名称。
- issue: לִשְׁמֹעַ ... בְּקוֹל אִישׁ 的含义
  choice: 耶和华竟听了一个人的声音
  alternative: 耶和华应允了一个人的请求
  rationale: 正文保留原文“听……声音”的具体措辞和其可能涵盖的“垂听、听从”张力，不将其完全解释成较窄的“应允请求”，也不译作容易暗示从属关系的“服从”。
translation_notes:
  register: 采用庄重而通顺的现代标准普通话。句式保留原文先宣告那日独一无二、再说明原因的推进；“竟”自然凸显叙述者所强调的非凡性。
