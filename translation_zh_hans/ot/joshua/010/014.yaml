- from: 在那日以前或以后，再没有像那日一样的日子[a]，耶和华竟听了一个人的声音，因为耶和华为以色列争战。
  to: 在这日以前或以后，没有哪一日像那日一样：耶和华垂听一个人的声音；因为耶和华为以色列争战。[a]
  rationale: 修订以冒号明确后半句是前述“无可比拟之日”的界定情形，保留原文的因果说明。“垂听一个人的声音”兼顾希伯来语字面表达与中文庄重自然用法；脚注保留较意译的请求含义及直译说明。
