  naturalness: “拉吉”“立拿”“耶和华”“交在……手中”自然且符合中文圣经历史叙事语体。“用刀杀了城里所有的人”清楚自然。将第二句主语改为“以色列人”可消除“约书亚”作为新增明示信息的问题，也使末句的“他们”指向清楚。
  terminology: 地名“拉吉”“立拿”及神名“耶和华”可保留。“城里的每一个性命”作为脚注中的直译说明可接受；正文应保留“所有的人”，避免将נֶפֶשׁ理解为现代汉语的抽象灵魂。
