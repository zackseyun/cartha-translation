revisions:
- from: 耶和华把拉吉交在以色列手中。第二天，约书亚攻取了城，用刀杀了城里所有的人[a]，正如他对立拿所做的。
  to: 耶和华把拉吉交在以色列人手中。第二天，以色列人攻取了城，用刀杀了城里所有的人[a]，正如他们对立拿所做的。
  rationale: 修订仅处理原文隐含行动主语在中文中的呈现：以“以色列人”承接前句明确的“以色列”，避免将未明示的单数动词主语限定为约书亚，并相应将末句改为“他们”。其余内容保持原文的时间、军事行动、杀戮范围和与立拿的比较。
