base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/032.yaml
  text: And Yahweh gave Lachish into the hand of Israel[a], and he captured it on the second day and struck it with the edge of the sword, along with every person who was in it, just as he had done to Libnah.
translation:
  language: zh_hans
  text: 耶和华把拉吉交在以色列人手中。第二天，以色列人攻取了城，用刀杀了城里所有的人[a]，正如他们对立拿所做的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“城里的每一个性命”；这里指城里的每一个人。
    reason: 说明נֶפֶשׁ在本节中指人，避免将其理解为与身体相对的“灵魂”。
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的专名形式，明确表达希伯来文本中的上帝圣名，而不以“主”替代。
- source_word: וַיִּתֵּן ... בְּיַד
  choice: 把……交在……手中
  rationale: 保留希伯来语“交在手中”的权柄意象，同时在现代汉语中自然可懂。
- source_word: לָכִישׁ
  choice: 拉吉
  rationale: 采用该地名通行的中文音译。
- source_word: וַיִּלְכְּדָהּ
  choice: 攻取了城
  rationale: לכד在军事语境中指夺取城邑；“攻取”准确而简洁。
- source_word: בַּיּוֹם הַשֵּׁנִי
  choice: 第二天
  rationale: 直接表达原文的时间顺序，不改释为较含混的“次日”以外含义。
- source_word: וַיַּכֶּהָ לְפִי חֶרֶב
  choice: 用刀杀了
  rationale: 原文直译近于“以刀口击杀它”；在城市征服语境中，城市是其中居民的转喻，现代汉语用“用刀杀了城里的人”能清楚传达实际所指。
- source_word: כָּל הַנֶּפֶשׁ אֲשֶׁר בָּהּ
  choice: 城里所有的人
  rationale: נֶפֶשׁ在这里指城中的人，并非现代意义上与身体相对的“灵魂”；“所有的人”忠实保留范围和叙事的严厉性。
- source_word: כְּכֹל אֲשֶׁר עָשָׂה לְלִבְנָה
  choice: 正如他对立拿所做的
  rationale: 保留原文单数动词，并自然回指作为代表性领袖的约书亚。
theological_decisions:
- issue: 征服叙事中对城内居民被杀的表述
  choice: 用刀杀了城里所有的人
  alternative: 用刀击杀了城和其中所有的性命
  rationale: 译文不淡化原文所述的杀戮，也不把נֶפֶשׁ误读为抽象灵魂；以自然汉语明确表达其集体人称含义。
- issue: 攻城及末句比较分句中的单数主语
  choice: 约书亚……正如他……
  alternative: 以色列人……正如他们……
  rationale: 希伯来文动词为阳性单数。汉语若仅用“他”，容易误指紧邻的“耶和华”，因此按上下文明确为约书亚，同时保留原文单数形式及其代表性领袖视角。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。“攻取”“交在……手中”保留历史叙事语体；其余表达避免古奥措辞。为防止代词误指耶和华，依上下文将原文隐含的单数主语明示为“约书亚”。
