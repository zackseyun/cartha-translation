  text: וַ/יְהִי֩ כִ/שְׁמֹ֨עַ אֲדֹֽנִי צֶ֜דֶק מֶ֣לֶךְ יְרוּשָׁלִַ֗ם כִּֽי לָכַ֨ד יְהוֹשֻׁ֣עַ אֶת הָ/עַי֮ וַ/יַּחֲרִימָ/הּ֒ כַּ/אֲשֶׁ֨ר עָשָׂ֤ה לִֽ/ירִיחוֹ֙ וּ/לְ/מַלְכָּ֔/הּ כֵּן עָשָׂ֥ה לָ/עַ֖י וּ/לְ/מַלְכָּ֑/הּ וְ/כִ֨י הִשְׁלִ֜ימוּ יֹשְׁבֵ֤י גִבְעוֹן֙ אֶת יִשְׂרָאֵ֔ל וַ/יִּֽהְי֖וּ בְּ/קִרְבָּֽ/ם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/001.yaml
  text: It happened[a], when Adoni-zedek king of Jerusalem heard that Joshua had captured Ai and had devoted it to destruction, just as he had done to Jericho and its king, so he had done to Ai and its king, and that the inhabitants of Gibeon had made peace with Israel and were among them[b],
translation:
  language: zh_hans
  text: 耶路撒冷王亚多尼·洗德听说，约书亚攻取了艾城，把它尽行毁灭；他怎样处置耶利哥和耶利哥王，也照样处置了艾城和艾城王；亚多尼·洗德又听说，基遍的居民已经与以色列人讲和，并在他们中间，
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי כִשְׁמֹעַ
  choice: ……听说
  rationale: 这是叙事性的 וַיְהִי 接 כ 与不定式独立形构成的时间背景。现代汉语直接以主语加“听说”起句，既自然，也不额外加入原文没有的“现在”等时间词。
- source_word: אֲדֹנִי צֶדֶק
  choice: 亚多尼·洗德
  rationale: 按希伯来语复合人名音译，以间隔号帮助现代读者辨认名称的两个组成部分。
- source_word: לָכַד
  choice: 攻取
  rationale: 该动词在军事语境中表示夺取城邑；“攻取”准确而符合汉语叙事表达。
- source_word: וַיַּחֲרִימָהּ
  choice: 把城尽行毁灭
  rationale: חרם 的使役形在征服叙事中指将对象置于当毁灭之列，兼有奉献于毁灭的宗教法律含义。正文采用清楚自然的传统汉语表达，脚注保留其技术性含义。
- source_word: כַּאֲשֶׁר ... כֵּן
  choice: 怎样……也照样
  rationale: 保留原文紧密对应的比较结构及其修辞平行。
- source_word: עָשָׂה לְ
  choice: 处置
  rationale: עשה 与 ל 连用在这里是“对……怎样行、怎样处置”的意思；“处置”能自然承接城和王两个宾语，并保留原文较概括的措辞。
- source_word: הִשְׁלִימוּ ... אֶת
  choice: 与……讲和
  rationale: שלם 的使役形在此指缔结和平关系；“讲和”简明自然，也不把协议的具体内容说得超过原文。
- source_word: וַיִּהְיוּ בְּקִרְבָּם
  choice: 住在他们中间
  rationale: בקרב 表示处在群体之中；结合居民的语境译作“住在他们中间”，比单说“在他们中间”更符合现代汉语。代词所指仍按原文保留为“他们”。
theological_decisions:
- issue: 征服叙事中 חרם 的表达
  choice: 把城尽行毁灭
  alternative: 把城献上，归于毁灭；把城置于禁令之下
  rationale: 原词不只是普通军事摧毁，也包含将对象划归毁灭的神圣禁令含义。正文优先采用普通读者容易理解的表达，脚注说明其特殊语义，不在正文中扩展或淡化其神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。地名使用通行译名“耶路撒冷、艾城、耶利哥、基遍”，人名采用“约书亚、亚多尼·洗德”。原文第1节在句法上为第2节的主句铺设多个听闻内容，因此本节末保留逗号，以忠实呈现跨节未完的句子。
