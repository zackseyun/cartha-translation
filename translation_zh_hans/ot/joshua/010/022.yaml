  text: וַ/יֹּ֣אמֶר יְהוֹשֻׁ֔עַ פִּתְח֖וּ אֶת פִּ֣י הַ/מְּעָרָ֑ה וְ/הוֹצִ֣יאוּ אֵלַ֗/י אֶת חֲמֵ֛שֶׁת הַ/מְּלָכִ֥ים הָ/אֵ֖לֶּה מִן הַ/מְּעָרָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/022.yaml
  text: Then Joshua said[a], “Open the mouth of the cave[b], and bring those five kings out of the cave to me.”
translation:
  language: zh_hans
  text: 约书亚说：“打开洞口[a]，把这五个王[b]从洞里带到我这里来。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“洞的口”。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“那五个王”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: 叙事中的连续式推动事件向前；现代汉语按上下文自然承接，无须机械译出连接词“于是”或“然后”。
- source_word: יְהוֹשֻׁעַ
  choice: 约书亚
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: פִּתְחוּ
  choice: 打开
  rationale: 复数命令式，基本义为“打开”；在本处指移开封堵，使洞穴入口敞开。
- source_word: פִּי הַמְּעָרָה
  choice: 洞口
  rationale: 原文直译为“洞的口”；“洞口”既保留该具体意象，又是自然、清楚的现代汉语。
- source_word: וְהוֹצִיאוּ
  choice: 带……来
  rationale: 使役形命令式表示使人从里面出来；结合“从洞里”和目的地“到我这里来”，完整表达移出并带来的动作。
- source_word: אֵלַי
  choice: 到我这里来
  rationale: 准确表达朝向约书亚的移动，比单说“给我”更明确，也不增添“见我”或“到我面前”等原文未明说的含义。
- source_word: חֲמֵשֶׁת הַמְּלָכִים הָאֵלֶּה
  choice: 这五个王
  rationale: 指示词 הָאֵלֶּה 通常直接对应“这些”；此处指上下文已经锁定在洞中的五个王。
- source_word: מִן הַמְּעָרָה
  choice: 从洞里
  rationale: 介词 מִן 表示起点或脱离；与移动动词搭配时，“从洞里”自然表达由洞内向外移出。
theological_decisions: []
