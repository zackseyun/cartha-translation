base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/010.yaml
  text: And Yahweh threw them into confusion before Israel[a], and struck them down with a great slaughter at Gibeon, and pursued them by the way of the ascent of Beth-horon, and struck them down as far as Azekah and Makkedah.
translation:
  language: zh_hans
  text: 雅威使他们在以色列人面前陷入混乱[a]，在基遍大大地击杀他们，又沿着伯和仑上坡的路追赶他们，一直击杀到亚西加和玛基大。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“惊慌失措”或“溃乱”。希伯来语动词指在战斗中使人混乱或恐慌。
    reason: 说明וַיְהֻמֵּם在战争语境中的词义范围，保留“混乱、恐慌、溃散”之间的可能性。
lexical_decisions:
- source_word: וַיְהֻמֵּם
  choice: 使他们……陷入混乱
  rationale: המם在战争语境中表示使敌军惊慌、混乱或溃散；此译保留雅威的使动作用，也不把词义收窄为结果性的“击溃”。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文直接音译四字神名，而不以称号代替。
- source_word: לִפְנֵי יִשְׂרָאֵל
  choice: 在以色列面前
  rationale: 保留原文可指空间上的“在……面前”，也可含“当着……的面”或有利于以色列的语义张力。
- source_word: וַיַּכֵּם מַכָּה גְדוֹלָה
  choice: 大大击杀他们
  rationale: נכה与מכה在战事叙述中表示猛烈打击、杀伤或大败；“大大击杀”以自然汉语表达严重的军事杀伤，同时对应原文的强调。
- source_word: וַיִּרְדְּפֵם
  choice: 追赶他们
  rationale: רדף是追击敌军的常用动词；依希伯来文连续叙事的语法，保留雅威为这一连串动作的主语。
- source_word: דֶּרֶךְ מַעֲלֵה בֵית חוֹרֹן
  choice: 沿着伯和仑上坡的路
  rationale: 保留“道路”与“上坡”两项地形信息，并使用通行中文地名。
- source_word: עַד עֲזֵקָה וְעַד מַקֵּדָה
  choice: 一直……到亚西加和玛基大
  rationale: עַד表示行动延伸的范围；中文以“一直到”自然表达追击和击杀所及之处，并保留两个地名。
theological_decisions:
- issue: 四字神名יהוה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文使用神的专名；采用较贴近יהוה可能读音的现代汉语音译“雅威”，避免用称号替代，也不把传统混合读法置入正文。
- issue: 连续动词的主语
  choice: 以雅威为“使混乱、击杀、追赶、击杀”的连续主语
  alternative: 把“追赶、击杀”理解为以色列人所做
  rationale: 希伯来文没有明示转换主语，且各动词以连续形式承接יהוה；正文因此保留其表层语法，同时不额外解释神如何实施这些行动。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。“大大击杀”保留原文战事语气的强度；地名采用中文圣经中较通行的译名。脚注标记已在正文中以[a]出现。
