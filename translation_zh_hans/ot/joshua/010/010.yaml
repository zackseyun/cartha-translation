  to: 雅威使他们在以色列人面前陷入混乱[a]，在基遍大大地击杀他们，又沿着伯和仑上坡的路追赶他们，一直击杀到亚西加和玛基大。
  rationale: 修订仅改善现代汉语的指称清晰度和句法自然度：“以色列人”明确原文集合性名词在此处的所指；“大大地”使程度状语表达更自然。其余措辞及脚注均忠实保留原译对希伯来文本的语义、叙事主语和歧义处理。
