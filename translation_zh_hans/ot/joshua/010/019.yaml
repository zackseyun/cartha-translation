  text: וְ/אַתֶּם֙ אַֽל תַּעֲמֹ֔דוּ רִדְפוּ֙ אַחֲרֵ֣י אֹֽיְבֵי/כֶ֔ם וְ/זִנַּבְתֶּ֖ם אוֹתָ֑/ם אַֽל תִּתְּנ֗וּ/ם לָ/בוֹא֙ אֶל עָ֣רֵי/הֶ֔ם כִּ֧י נְתָנָ֛/ם יְהוָ֥ה אֱלֹהֵי/כֶ֖ם בְּ/יֶדְ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/019.yaml
  text: But as for you[a], do not stand still; pursue your enemies and strike their rear guard. Do not let them enter their cities, for Yahweh your God has given them into your hand.
translation:
  language: zh_hans
  text: 至于你们，不要停下来；要追赶你们的仇敌，从后面攻击他们[a]。不要让他们进入他们的城里，因为你们的上帝雅威已经把他们交在你们手中。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“攻击他们的后队”或“攻击落在后面的人”。原文动词与“尾部”有关，指打击逃军的后部。
    reason: 保留זנב在军事语境中可能指后队、后部或掉队者的词义范围。
lexical_decisions:
- source_word: וְאַתֶּם
  choice: 至于你们
  rationale: 独立代词带出强调，并与前文留守洞口的行动形成转折；“至于你们”自然地保留这一话题转换。
- source_word: אַל תַּעֲמֹדוּ
  choice: 不要停下来
  rationale: עמד本义为“站立”，但在追击的军事语境中，禁令是不要停下；此译清楚传达实际含义。
- source_word: רִדְפוּ אַחֲרֵי אֹיְבֵיכֶם
  choice: 要追赶你们的仇敌
  rationale: 准确表达רדף אחרי这一追击惯用语，并保留军事语气。
- source_word: וְזִנַּבְתֶּם אוֹתָם
  choice: 从后面攻击他们
  rationale: זנב与“尾部”有关，在此指攻击逃军的后部或落在后面的人；正文采用不预设其为正式“后卫部队”的表达，并以脚注保留词义范围。
- source_word: אַל תִּתְּנוּם לָבוֹא אֶל עָרֵיהֶם
  choice: 不要让他们逃进自己的城
  rationale: נתן加不定式表示“容许”；לָבוֹא אֶל在逃军语境中是进入城中避难。“逃进”自然呈现语境，“自己的城”清楚指向敌军所属的城。
- source_word: כִּי נְתָנָם
  choice: 因为……已经把他们交在
  rationale: 完成式把敌军的败局描述为上帝已经成就的事实；“交在……手中”保留希伯来语的支配权隐喻。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见音译呈现四字神名，不用称号替代专名。
- source_word: אֱלֹהֵיכֶם
  choice: 你们的上帝
  rationale: 直接对应带第二人称复数后缀的结构。
- source_word: בְּיֶדְכֶם
  choice: 在你们手中
  rationale: 保留希伯来语以“手”表示权势和控制的惯用表达，在现代汉语中也自然易懂。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”较贴近学界通行的拟音，也保留其作为专名的性质，而不以“主”等称号代替。
- issue: 神已交付敌军与人仍须追击之间的张力
  choice: “已经把他们交在你们手中”，同时保留追赶的命令
  alternative: 将完成式弱化为将来应许
  rationale: 原文以完成式陈述神的行动已然有效，却仍命令以色列人继续追击；译文不消解神的成就与人的行动并存的张力。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“停下来”“逃进自己的城”符合叙事语境；“仇敌”“交在你们手中”保留适度的圣经语体。脚注标记[a]已置于相关短语之后。
