revisions:
- from: 约书亚攻打了全境——山区、南地、低地和山坡——也攻打了那里的所有王。他没有留下一个幸存者，而是把一切有气息的[a]都归于毁灭[b]，正如以色列的上帝雅威所吩咐的。
  to: 约书亚攻打了全境——山区、南地、低地和山坡——以及其中所有的王。他没有留下一个幸存者，反而使一切有气息的[a]都归于毁灭[b]，正如以色列的上帝雅威所吩咐的。
  rationale: 修订仅改善现代汉语的句法和行文连贯性。“使……归于毁灭”保留希伯来语使役式及其献归／禁灭的语义张力；脚注继续说明该术语的替代译法。脚注标记仍各自紧随所说明的词语，且没有增添或缩窄原文所述对象范围。
