source:
  edition: WLC
  text: וַ/יַּכֶּ֣ה יְהוֹשֻׁ֣עַ אֶת כָּל הָ/אָ֡רֶץ הָ/הָר֩ וְ/הַ/נֶּ֨גֶב וְ/הַ/שְּׁפֵלָ֜ה וְ/הָ/אֲשֵׁד֗וֹת וְ/אֵת֙ כָּל מַלְכֵי/הֶ֔ם לֹ֥א הִשְׁאִ֖יר שָׂרִ֑יד וְ/אֵ֤ת כָּל הַ/נְּשָׁמָה֙ הֶחֱרִ֔ים כַּ/אֲשֶׁ֣ר צִוָּ֔ה יְהוָ֖ה אֱלֹהֵ֥י יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/040.yaml
  text: So Joshua struck all the land—the hill country[a], the Negev, the lowland, and the slopes—and all their kings. He left no survivor, but devoted to destruction every breathing thing, just as Yahweh, the God of Israel[b], had commanded.
translation:
  language: zh_hans
  text: 约书亚攻打了全境——山区、南地、低地和山坡——以及其中所有的王。他没有留下一个幸存者，反而使一切有气息的[a]都归于毁灭[b]，正如以色列的上帝雅威所吩咐的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“一切呼吸的”。希伯来语字面意思近于“一切气息”或“一切有气息的”。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“彻底毁灭”或“施行禁灭”。希伯来语动词表示把某物不可撤回地划定为毁灭之物。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכֶּה
  choice: 攻打了
  rationale: נכה在这里表示军事上的击打、打击。“攻打”适合以地域和诸王为宾语的汉语表达，又不过度限定具体战果。
- source_word: כָּל הָאָרֶץ
  choice: 全境
  rationale: אֶרֶץ指本段战事所涉及的地域，并非整个世界；“全境”简洁地保留区域性的总括范围。
- source_word: הָהָר
  choice: 山区
  rationale: 该词在《约书亚记》中常作地形区域名称；“山区”比字面化的“山”更符合这里的地理分类。
- source_word: הַנֶּגֶב
  choice: 南地
  rationale: נֶגֶב在这里指迦南南部的干旱地区。“南地”既保留传统地名性质，也能让现代读者理解其方位。
- source_word: הַשְּׁפֵלָה
  choice: 低地
  rationale: שְׁפֵלָה指山地与沿海之间的低地区域；“低地”清楚易懂，并与其他地形名称并列。
- source_word: הָאֲשֵׁדוֹת
  choice: 山坡
  rationale: אֲשֵׁדוֹת表示斜坡、山麓或下坡地带；“山坡”在本地形列表中自然明确。
- source_word: כָּל מַלְכֵיהֶם
  choice: 那里的所有王
  rationale: 代词所指是前述各地区；补出“那里”可在汉语中清楚表达其领属关系。
- source_word: לֹא הִשְׁאִיר שָׂרִיד
  choice: 没有留下一个幸存者
  rationale: שָׂרִיד在战争语境中指存留下来的人；“幸存者”比泛指的“余剩”更直接。
- source_word: כָּל הַנְּשָׁמָה
  choice: 一切有气息的
  rationale: 原文近乎直译为“一切气息”或“一切呼吸的”；此译保留希伯来语的概括性和严峻感，不擅自缩窄为“所有人”。
- source_word: הֶחֱרִים
  choice: 归于毁灭
  rationale: חרם的使役形表示把对象不可撤回地划定为毁灭之物。“归于毁灭”保留这种献归、禁灭的含义，又避免正文使用难懂的专门术语。
- source_word: כַּאֲשֶׁר צִוָּה
  choice: 正如……所吩咐的
  rationale: 该比较从句强调行动与先前命令相符；此译自然保留这种对应关系。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以“雅威”音译四字神名，保留其作为以色列上帝专名的性质，而不以“主”等称号替代。
theological_decisions:
- issue: חרם战争用语的表达
  choice: 归于毁灭
  alternative: 彻底毁灭；归于禁灭
  rationale: 原词不仅描述杀灭，也带有把对象不可撤回地划归毁灭的宗教—战争含义。正文用“归于毁灭”保留这层张力，脚注说明其他可能译法。
- issue: כָּל הַנְּשָׁמָה的范围
  choice: 一切有气息的
  alternative: 所有人；一切呼吸的
  rationale: 原文的表达范围广而未明说仅指人。保留其字面意象，避免替文本预先解决对象范围问题。
- issue: 四字神名的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文使用上帝的专名而非普通称号；“雅威”较直接地音译该专名，并与前面的“以色列的上帝”形成自然同位关系。
translation_notes:
  register: 采用庄重而现代的叙事语体。“全境”统领四类地形；破折号帮助读者看清同位说明。战争和禁灭用语不作弱化，同时以脚注交代希伯来语的特殊含义。所有脚注标记均放在其实际解释的词语之后。
