  to: 于是，太阳停住[a]，月亮止住，直到国民向仇敌报了仇[b]。这事不是写在《雅煞珥书》上吗？[c]太阳停在天空中央，约有一整天[d]没有急着落下[e]。
  rationale: 修订仅处理安全且必要的现代汉语表达与脚注措辞：以“国民”替换不自然、且多出指示意味的“这民族”；将“约有整整一天”压缩为“约有一整天”；并改正脚注b的搭配。太阳、月亮停止及报仇／伸冤的原文语义张力均予保留。
