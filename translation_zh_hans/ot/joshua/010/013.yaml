  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יִּדֹּ֨ם הַ/שֶּׁ֜מֶשׁ וְ/יָרֵ֣חַ עָמָ֗ד עַד יִקֹּ֥ם גּוֹי֙ אֹֽיְבָ֔י/ו הֲ/לֹא הִ֥יא כְתוּבָ֖ה עַל סֵ֣פֶר הַ/יָּשָׁ֑ר וַ/יַּעֲמֹ֤ד הַ/שֶּׁ֨מֶשׁ֙ בַּ/חֲצִ֣י הַ/שָּׁמַ֔יִם וְ/לֹא אָ֥ץ לָ/ב֖וֹא כְּ/י֥וֹם תָּמִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/013.yaml
  text: So the sun stood still[a], and the moon stopped, until the nation took vengeance on its enemies[d][c][b]. Is this not written in the Book of Jashar? The sun stood still in the middle of the sky and did not hurry to set for about a full day.
translation:
  language: zh_hans
  text: 于是，太阳停住[a]，月亮止住，直到国民向仇敌报了仇[b]。这事不是写在《雅煞珥书》上吗？[c]太阳停在天空中央，约有一整天[d]没有急着落下[e]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “停住”所译的希伯来词也可表示“静默”。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“直到国民向仇敌雪恨”或“直到国民为自己伸冤”。
    reason: lexical_alternative
  - marker: c
    text: “雅煞珥”是希伯来语书名的音译；也可能译作《正直者之书》。
    reason: alternative_reading
  - marker: d
    text: 希伯来文直译为“像完整的一天”；也可能理解为“将近一整天”。
    reason: lexical_alternative
  - marker: e
    text: 希伯来文直译为“没有急着来（或进入）”；用于太阳时，意思是没有急着落下。
    reason: idiom_explanation
lexical_decisions:
- source_word: וַיִּדֹּם הַשֶּׁמֶשׁ
  choice: 太阳停住
  rationale: דמם可表示静止或静默；在与月亮“止住”平行的天体语境中，“停住”自然表达停止运行，同时不把这非凡事件弱化为单纯的视觉现象。
- source_word: וְיָרֵחַ עָמָד
  choice: 月亮止住
  rationale: עמד本义为“站立”，用于天体时表示停住；“止住”既符合现代汉语，也保留与前句的平行关系。
- source_word: עַד יִקֹּם גּוֹי אֹיְבָיו
  choice: 直到这民族向自己的仇敌报了仇
  rationale: יקום在此惯用结构中表达对仇敌施行报复或伸冤；“这民族”对应גוי，并以“自己的”清楚表达单数集合名词所带的第三人称单数后缀。
- source_word: הֲלֹא הִיא כְתוּבָה
  choice: 这事不是写……吗
  rationale: 阴性代词היא可回指前述事件或引文；汉语用“这事”自然保留这种概括性指代。
- source_word: סֵפֶר הַיָּשָׁר
  choice: 《雅煞珥书》
  rationale: 将可能作为书名的יָשָׁר音译为“雅煞珥”，避免在正文中武断判定它是描述性标题；其字面含义置于脚注。
- source_word: בַּחֲצִי הַשָּׁמַיִם
  choice: 在天空中央
  rationale: 准确传达“在诸天的中间”这一空间意象，且为自然的现代汉语。
- source_word: וְלֹא אָץ לָבוֹא
  choice: 没有急着落下
  rationale: אוץ意为“赶快、急忙”；בוא用于太阳时按语境指太阳落下，以“落下”译出汉语所需的隐含意义。
- source_word: כְּיוֹם תָּמִים
  choice: 约有整整一天
  rationale: תמים表示完整、完全，比较介词כְּ使时长带有近似意味；此译兼顾“完整的一天”与“约如一天”的语义张力。
theological_decisions:
- issue: 天体奇迹的性质
  choice: 按叙事表层直译为太阳和月亮停住
  alternative: 仅译成观察者眼中的现象，或视为纯粹诗歌比喻
  rationale: 经文把此事作为非凡事件叙述，并援引一部书卷为证。译文不以现代科学解释来调和，也不把叙述预先化约为比喻。
- issue: 报仇与伸冤之间的语义
  choice: 正文作“报了仇”，脚注保留“为自己雪恨／伸冤”的可能
  alternative: 只译为“战胜仇敌”
  rationale: 该结构含有报复或洗雪冤屈的意味；笼统译作“战胜”会损失原文的道德和司法色彩，但原文也不足以强行限定为某一种神学解释。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“停住／止住”保留原文平行而避免机械重复；“这民族”保持גוי的群体政治含义；书名使用通行风格的音译，并在脚注交代可译的字面含义。
