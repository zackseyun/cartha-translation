  yaml_path: translation/ot/joshua/010/031.yaml
  text: Then Joshua[a], and all Israel with him, passed on from Libnah to Lachish[b], and camped against it and fought against it.
translation:
  language: zh_hans
  text: 约书亚和与他同行的以色列众人从立拿前往拉吉，在拉吉城前安营，攻打这城。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲבֹר
  choice: 前往
  rationale: 该动词基本义为“经过、越过”，这里描述军队从一座城转移到另一座城；“前往”自然表达行军移动，又不使人误以为必然渡过河流。
- source_word: וְכָל יִשְׂרָאֵל עִמּוֹ
  choice: 和跟随他的以色列全军
  rationale: “以色列”在此按上下文指随约书亚出征的整体军队；译作“以色列全军”比直译“全以色列”更能让现代读者准确理解所指，“跟随他的”表达 עִמּוֹ 的同行关系。
- source_word: מִלִּבְנָה לָכִישָׁה
  choice: 从立拿前往拉吉
  rationale: 拉吉一词后的方向词尾表示朝向该地运动；“前往拉吉”在现代汉语中自然地表达目的地。
- source_word: וַיִּחַן עָלֶיהָ
  choice: 在城外安营
  rationale: חנה 意为“安营”，介词 עַל 在围城语境中表示针对该城驻扎。“在城外安营”自然呈现围城部署，同时避免机械重复“攻打”。
- source_word: וַיִּלָּחֶם בָּהּ
  choice: 攻打拉吉
  rationale: לחם 的尼法勒词干在此表示作战，בָּהּ 指以该城为交战对象；“攻打拉吉”符合汉语军事叙事，也明确代词所指。
theological_decisions: []
translation_notes:
  register: 采用现代、简洁而庄重的历史叙事语体。“以色列全军”依据军事上下文将集合性称谓明确化；末尾重复“拉吉”而不用“它”，使汉语行文更清楚。
