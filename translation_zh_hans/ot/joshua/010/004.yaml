    reason: lexical_alternative
lexical_decisions:
- source_word: עֲלוּ אֵלַי
  choice: 你们上到我这里来
  rationale: עֲלוּ是עלה的复数祈使式，带有向上行进的方向意味；אֵלַי表示“到我这里”。译文保留说话者视角和地理、军事行动中的上行含义。
- source_word: וְעִזְרֻנִי
  choice: 帮助我
  rationale: עזר的复数祈使式带第一人称单数宾语；“帮助我”直接、自然地表达求援。
- source_word: וְנַכֶּה
  choice: 我们一起攻打……吧
  rationale: 该形式表达第一人称复数的意愿或倡议。句末“吧”体现“让我们……”的倡议语气；“攻打”在军事语境中自然传达נכה的击打、攻击含义。
- source_word: אֶת גִּבְעוֹן
  choice: 基遍
  rationale: 按传统中文圣经地名音译处理；直接宾语标记אֶת不另行译出。
- source_word: כִּי
  choice: 因为
  rationale: 此处引出攻打基遍的原因，“因为”清楚保留因果关系。
- source_word: הִשְׁלִימָה
  choice: 讲和
  rationale: שלם的使役词干完成式在外交语境中指建立和平关系或缔结和平。“讲和”保留和平关系这一基本意义，而不把具体政治性质限定为“结盟”。
- source_word: אֶת יְהוֹשֻׁעַ וְאֶת בְּנֵי יִשְׂרָאֵל
  choice: 与约书亚和以色列人
  rationale: 在השלימה的搭配中，אֶת引出与之建立和平关系的对象。בְּנֵי יִשְׂרָאֵל直译为“以色列众子”，现代汉语通常自然地表达为“以色列人”。
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל的群体称谓
  choice: 以色列人
  alternative: 以色列众子
  rationale: 这里指以色列民族群体，不特别强调性别或亲子关系。正文采用现代汉语通行且准确的“以色列人”，脚注保留希伯来语字面表达。
- issue: הִשְׁלִימָה所指关系的性质
  choice: 讲和
  alternative: 结盟
  rationale: 原动词可表示进入和平关系或条约性和平，但本身未必明确限定为正式联盟；因此正文不把含义收窄为“结盟”，并在脚注说明可能的理解。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“上到我这里来”保留原文方向感；“我们一起……吧”自然体现第一人称复数倡议语气。为避免代词指代生硬或含混，在原因从句中重复“基遍”。
