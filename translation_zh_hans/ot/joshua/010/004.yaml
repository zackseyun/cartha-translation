  text: Come up to me and help me[a], and let us strike Gibeon[b], because it has made peace with Joshua and with the sons of Israel.
translation:
  language: zh_hans
  text: “你们上来帮助我，让我们攻打基遍；因为基遍已经同约书亚和以色列人[a]讲和[b]了。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“以色列众子”。
    reason: lexical_alternative
  - marker: b
