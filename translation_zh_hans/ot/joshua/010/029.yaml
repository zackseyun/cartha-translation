  yaml_path: translation/ot/joshua/010/029.yaml
  text: Then Joshua[a], and all Israel with him, passed on from Makkedah to Libnah and fought against Libnah.
translation:
  language: zh_hans
  text: 随后，约书亚和与他同行的以色列众人从玛基大前往立拿，攻打立拿。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲבֹר
  choice: 随后……前往
  rationale: עבר在这段军事行程中表示从一处继续移往另一处，并非特指渡过河流；“随后……前往”自然表达叙事推进和移动。
- source_word: וְכָל יִשְׂרָאֵל עִמּוֹ
  choice: 和跟随他的以色列全军
  rationale: 原文直译为“和与他同在的全以色列”。在军事语境中，“以色列全军”自然指随约书亚出征的全体军队；“跟随他的”表达同行关系，而不增添额外神学含义。
- source_word: מִמַּקֵּדָה
  choice: 从玛基大
  rationale: 介词מִן标明出发地点；地名按现代中文圣经常用音译作“玛基大”。
- source_word: לִבְנָה
  choice: 前往立拿
  rationale: 在移动动词之后，该地名表示目的地；采用现代中文圣经常用音译“立拿”。
- source_word: וַיִּלָּחֶם
  choice: 攻打
  rationale: לחם的尼法勒式在此表示作战。因对象是一座城，“攻打”比笼统的“交战”更符合自然汉语和上下文。
- source_word: עִם לִבְנָה
  choice: 攻打立拿
  rationale: עִם本义常为“与”，但跟在לחם之后按希伯来语习惯标示交战对象；中文应译为“攻打立拿”，不能机械译作“与立拿一同作战”。
