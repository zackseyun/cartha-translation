  text: Then Joshua[a], and all Israel with him, went up from Eglon to Hebron, and they fought against it.
translation:
  language: zh_hans
  text: 约书亚与全以色列人一同从伊矶伦上到希伯仑，攻打那城。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文作“攻打她”；阴性代词指希伯仑城。
    reason: 说明希伯来语阴性单数代词指向希伯仑城；正文以现代汉语自然地译为“那城”。
lexical_decisions:
- source_word: וַיַּעַל
  choice: 上到
  rationale: עלה表示向上行进；从伊矶伦前往地势较高的希伯仑，用“上到”既保留方向含义，也符合现代汉语叙事。
- source_word: וְכָל יִשְׂרָאֵל עִמּוֹ
  choice: 和跟随他的全以色列人
  rationale: 原文直译为“和与他同在的全以色列”；此处指随约书亚出征的以色列队伍。“跟随他的”自然表达同行关系，又避免把“全以色列”误解为毫无例外的每一个人。
- source_word: מֵעֶגְלוֹנָה חֶבְרוֹנָה
  choice: 从伊矶伦上到希伯仑
  rationale: מִן标明起点，地名后的方向词尾标明目的地；“从……到……”准确呈现路线。
- source_word: וַיִּלָּחֲמוּ
  choice: 攻打
  rationale: לחם的尼法勒形在此表示交战；结合עַל所指的敌对目标，“攻打”比笼统的“作战”更符合攻城语境。
- source_word: עָלֶיהָ
  choice: 那城
  rationale: 介词עַל带阴性单数后缀，指向阴性地名希伯仑，即该城。汉语以“那城”明确指代并自然表达城市为攻击对象。
