  yaml_path: translation/ot/joshua/010/038.yaml
  text: Then Joshua[a], and all Israel with him, returned to Debir and fought against it.
translation:
  language: zh_hans
  text: 随后，约书亚和所有与他同行的以色列人返回到底璧，攻打那城。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“攻打她”；阴性代词指底璧城。现代中文在这里自然说“那城”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: 返回
  rationale: שׁוב在这一叙事语境中表示回到先前离开的地点；“返回”准确、自然，并保留了移动方向。
- source_word: יְהוֹשֻׁעַ
  choice: 约书亚
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: וְכָל יִשְׂרָאֵל עִמּוֹ
  choice: 和跟随他的全体以色列人
  rationale: עִמּוֹ直译为“与他同在/和他一起”；在军事行动语境中，“跟随他的”自然表达同行关系。“全体以色列人”保留כָל יִשְׂרָאֵל的集合性措辞，不把它明文缩限为军队。
- source_word: דְּבִרָה
  choice: 底璧
  rationale: 词尾方向性־ָה表示朝向底璧；中文“返回底璧”已经自然表达“回到底璧去”的方向意义。地名采用通行译名。
- source_word: וַיִּלָּחֶם
  choice: 攻打
  rationale: לחם在此表示对一座城展开战斗；“攻打”比泛指双方交战的“作战”更符合עַל所标示的敌对目标，也符合攻城语境。
- source_word: עָלֶיהָ
  choice: 那城
  rationale: 阴性单数代词指回底璧。现代中文不以阴性代词指城市；“那城”既自然，又明确保留所指对象。
theological_decisions: []
translation_notes:
