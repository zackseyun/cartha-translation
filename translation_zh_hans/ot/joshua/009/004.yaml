  text: וַ/יַּעֲשׂ֤וּ גַם הֵ֨מָּה֙ בְּ/עָרְמָ֔ה וַ/יֵּלְכ֖וּ וַ/יִּצְטַיָּ֑רוּ וַ/יִּקְח֞וּ שַׂקִּ֤ים בָּלִים֙ לַ/חֲמ֣וֹרֵי/הֶ֔ם וְ/נֹאד֥וֹת יַ֨יִן֙ בָּלִ֔ים וּ/מְבֻקָּעִ֖ים וּ/מְצֹרָרִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/004.yaml
  text: They too acted with cunning[a], and went and made provisions, and took worn-out sacks for their donkeys, and worn-out wineskins[b], split open and patched.
translation:
  language: zh_hans
  text: 他们也用诡计行事，动身前去，乔装起来[a]；他们给自己的驴备上破旧的袋子，又带上破旧、裂开后扎补过的酒皮袋[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这个希伯来语动词含义较难确定，也可理解为“预备行装”或“装作使者”。下文描述他们用破旧物品制造假象，因此正文按语境译作“乔装起来”。
    reason: alternative_reading
  - marker: b
    text: “扎补过的”也可译作“捆扎起来的”，指酒皮袋裂开后用捆扎的办法修补。
    reason: lexical_alternative
lexical_decisions:
- source_word: גַם הֵמָּה
  choice: 他们也
  rationale: 承接上文其他人的行动，简洁保留“也”的衔接作用。
- source_word: בְּעָרְמָה
  choice: 施行诡计
  rationale: 该词表示精明、机巧；在本段蓄意制造假象的语境中带有欺骗意味。“施行诡计”自然明确，又不额外添加动机。
- source_word: וַיֵּלְכוּ
  choice: 动身前去
  rationale: 保留希伯来叙事中的连续动作，并用现代汉语自然表达出发行动。
- source_word: וַיִּצְטַיָּרוּ
  choice: 乔装起来
  rationale: 此动词词形和含义存在困难。下文所列破旧行装是他们制造远道而来假象的手段，因此正文采用符合直接语境的“乔装起来”，同时在脚注保留“预备行装”等理解。
- source_word: שַׂקִּים בָּלִים
  choice: 破旧的袋子
  rationale: שַׂקִּים指用于装载的粗制袋子，בָּלִים强调因长期使用而破旧。
- source_word: לַחֲמוֹרֵיהֶם
  choice: 搭在驴背上
  rationale: 介词表达这些袋子与驴的装载关系；汉语以“搭在驴背上”具体而自然。
- source_word: נֹאדוֹת יַיִן
  choice: 酒皮袋
  rationale: 指用兽皮制成、盛酒的容器；“酒皮袋”简明且符合古代实物。
- source_word: מְבֻקָּעִים
  choice: 裂开
  rationale: 该被动分词表示劈裂、迸裂，描述酒皮袋已经破裂的状态。
- source_word: מְצֹרָרִים
  choice: 扎补过的
  rationale: 该词很可能指裂开后以捆扎方式修补；“扎补过的”既保留具体修补方式，也比泛称“补过”更贴近词义。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。通过短句和分号保留希伯来叙事连续推进的节奏；对疑难动词不强行消除歧义，而在正文按语境译为“乔装起来”，并以脚注列出其他主要理解。
