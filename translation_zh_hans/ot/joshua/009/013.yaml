  text: וְ/אֵ֨לֶּה נֹאד֤וֹת הַ/יַּ֨יִן֙ אֲשֶׁ֣ר מִלֵּ֣אנוּ חֲדָשִׁ֔ים וְ/הִנֵּ֖ה הִתְבַּקָּ֑עוּ וְ/אֵ֤לֶּה שַׂלְמוֹתֵ֨י/נוּ֙ וּ/נְעָלֵ֔י/נוּ בָּל֕וּ מֵ/רֹ֥ב הַ/דֶּ֖רֶךְ מְאֹֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/013.yaml
  text: And these wineskins[a], which we filled when they were new—look, they have burst[c][b]; and these our garments and our sandals have worn out from the journey being very long.
translation:
  language: zh_hans
  text: 这些酒袋是我们装满时新的；你看，现在已经裂开了[a]。我们的这些衣服和凉鞋，也因路途极其遥远而磨损了[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“已经破裂了”。
    reason: lexical_alternative
  - marker: b
    text: 直译近于：“因路途极其漫长。”
    reason: literal_rendering
lexical_decisions:
- source_word: נֹאדוֹת הַיַּיִן
  choice: 酒袋
  rationale: נֹאד指用兽皮制成、可盛酒等液体的容器；“酒袋”在现代汉语中简明自然，也保留其材质和用途。
- source_word: מִלֵּאנוּ חֲדָשִׁים
  choice: 我们装酒时还是新的
  rationale: 原文直陈“我们装满的，是新的”；结合“酒袋”的用途补出“酒”，并用“装酒时还是新的”自然表达酒袋在装填时的新旧状态。
- source_word: וְהִנֵּה
  choice: 看哪
  rationale: 保留该提示词引人注意、强调眼前结果的语用功能；“看哪”庄重而仍可理解。
- source_word: הִתְבַּקָּעוּ
  choice: 已经裂开了
  rationale: 该词表示酒袋破裂、绽开；“裂开”比“爆裂”较少过度描绘，并保留状态结果。
- source_word: שַׂלְמוֹתֵינוּ
  choice: 我们的这些衣服
  rationale: שַׂלְמוֹת为较宽泛的衣物用语；“衣服”是现代汉语中自然、准确且不过度限定具体衣类的表达。
- source_word: נְעָלֵינוּ
  choice: 鞋
  rationale: נַעַל泛指脚上穿着之物，古代语境中常为凉鞋；正文用普通读者自然理解的“鞋”，避免不必要地缩窄类别。
- source_word: בָּלוּ
  choice: 穿破了
  rationale: 该动词表示因使用而破旧、耗损；用于衣服和鞋时，“穿破了”自然地表达磨损至破旧的结果。
- source_word: מֵרֹב הַדֶּרֶךְ מְאֹד
  choice: 因为路途极其遥远
  rationale: 原文结构近于“由于路途之多甚”；此处指旅程距离极长。“因为……极其遥远”保留原因关系与מְאֹד的加强语气，同时符合现代汉语习惯。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“看哪”保留原文提示语气；其余措辞避免古奥。将两个结果句分开，以清楚呈现基遍人展示酒袋及衣鞋的说辞。
