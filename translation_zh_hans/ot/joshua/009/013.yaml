- from: 这些酒袋，我们装酒时还是新的；看哪，现在已经裂开了[a]。我们的这些衣服和鞋也因为路途极其遥远而穿破了[b]。
  to: 这些酒袋是我们装满时新的；你看，现在已经裂开了[a]。我们的这些衣服和凉鞋，也因路途极其遥远而磨损了[b]。
  rationale: 修订使“新的”明确修饰酒袋在装满时的状态，并将衣物和脚穿物的结果由“穿破”调整为较宽泛的“磨损”，从而避免添加原文未明说的破洞细节。脚注 b 改为自然且可理解的近直译，保留旅程长度作为原因及其强烈程度。
