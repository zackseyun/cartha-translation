base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/006.yaml
  text: They went to Joshua at the camp at Gilgal and said to him and to the men of Israel[a], “We have come from a distant land; so now make a covenant with us.”
translation:
  language: zh_hans
  text: 他们到吉甲的营地去见约书亚，对他和以色列人说：“我们是从遥远之地来的。现在请与我们立约[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“与我们缔结条约。”希伯来语的固定说法字面意思是“与我们切立一个约”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלְכוּ
  choice: 他们……去
  rationale: הלך是“去、行走”的常用动词；叙事中译作“去”保留其基本方向，不以“来”代替。
- source_word: אֶל־יְהוֹשֻׁעַ אֶל־הַמַּחֲנֶה הַגִּלְגָּל
  choice: 到吉甲的营地去见约书亚
  rationale: 两个אֶל分别指向约书亚和营地；中文调整语序，以“到……营地去见……”自然表达人物及地点这两个目标。
- source_word: הַמַּחֲנֶה
  choice: 营地
  rationale: מַחֲנֶה指驻扎的营或营地；“营地”符合此处以色列驻营的语境，也适合现代中文。
- source_word: וַיֹּאמְרוּ
  choice: 说
  rationale: אמר是一般性的说话动词；中文连续叙事中用“说”简洁自然。
- source_word: אֵלָיו וְאֶל־אִישׁ יִשְׂרָאֵל
  choice: 对他和以色列众人
  rationale: אִישׁ יִשְׂרָאֵל是集合性单数，语境所指为与约书亚同在的以色列人；“众人”传达集合意义，避免把希伯来语形式误解成单独一人。
- source_word: מֵאֶרֶץ רְחוֹקָה
  choice: 从遥远之地
  rationale: אֶרֶץ可指地、地域或国家，רְחוֹקָה意为遥远；“遥远之地”保留范围上的开放性，不强行限定为现代意义的国家。
- source_word: בָּאנוּ
  choice: 我们是……来的
  rationale: 完成式陈述已经发生并与眼前处境相关的到来；现代汉语“是从……来的”自然突出其所声称的来源。
- source_word: וְעַתָּה
  choice: 现在
  rationale: 该短语引出基于前述说法提出的请求；中文“现在”已能自然承担这一衔接，无须机械保留连词。
- source_word: כִּרְתוּ לָנוּ בְרִית
  choice: 请与我们立约
  rationale: כרת ברית字面为“切约”，是表示订立盟约的固定习语；“立约”既自然又保留בְרִית这一圣经关键词。“请”体现祈使句在此处的请求语用。
theological_decisions:
- issue: 政治外交语境中בְרִית的译法
  choice: 约（立约）
  alternative: 盟约／缔结条约
  rationale: 虽属外交情境，בְרִית仍是希伯来圣经中通常表示“约”的核心词。正文用“立约”保持词汇关联与圣经语感；脚注说明此处也可按政治语境理解为缔结盟约或条约。
translation_notes:
  register: 采用现代、庄重而易懂的叙事中文。以“到吉甲的营地去见约书亚”化解原文重复介词在中文中的生硬感；保留“立约”这一关键圣经用语，并用脚注交代外交语义及希伯来语习语。
