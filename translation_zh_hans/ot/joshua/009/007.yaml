base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/007.yaml
  text: But the men of Israel said to the Hivite[a], “Perhaps you are living among us[b]; how then could I make a covenant with you?”
translation:
  language: zh_hans
  text: 以色列人对希未人说：“也许你住在我们中间[a]；那么，我怎能跟你立约[b]呢？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“在我中间”；这里的单数可能是以色列的代表在代群体发言。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“跟你切约”。“切约”是希伯来语表示立约的惯用说法。
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ יִשְׂרָאֵל
  choice: 以色列人
  rationale: 原文形式为单数“以色列之人”，在这里具有集合或代表性意义。“以色列人”在现代汉语中自然，也不强行判定说话者究竟是一人还是多人。
- source_word: הַחִוִּי
  choice: 希未人
  rationale: 保留原文的族名和单数形式；汉语名词本身不必明示单复数，因而也保留其可能指群体代表的含混性。
- source_word: אוּלַי
  choice: 说不定
  rationale: 自然传达说话者带有疑虑的推测语气，比“也许”更适合此处警觉、质疑的语境。
- source_word: בְּקִרְבִּי
  choice: 在我们中间
  rationale: 字面为“在我中间”，其中单数后缀反映代表以色列发言的用法；译作“在我们中间”清楚表达其地理和群体含义，并用脚注保留原文形式。
- source_word: יוֹשֵׁב
  choice: 住
  rationale: ישׁב的分词表示持续居住；“住”是简洁、自然的现代汉语表达。
- source_word: וְאֵיךְ
  choice: 这样，我怎么能
  rationale: 既表达连接词所引出的逻辑后果，也保留原文第一人称单数动词所体现的代表性发言。
- source_word: אכרות ... בְרִית
  choice: 立约
  rationale: 原文字面为“切约”；“立约”是现代汉语中清楚而庄重的对应表达，并保留“约”的核心概念。
- source_word: לְךָ
  choice: 跟你
  rationale: 在立约语境中，לְ表示立约的对方；“跟你立约”符合现代汉语习惯。
theological_decisions:
- issue: 以色列发言中的群体性单数
  choice: 将בְּקִרְבִּי按群体意义译为“在我们中间”，同时将אכרות的第一人称单数保留为“我怎么能……立约”
  alternative: 全用单数：“在我这里……我怎么能”；或全用复数：“在我们中间……我们怎么能”
  rationale: 原文以单数形式表达代表以色列群体的发言。译文一方面使居住范围的群体含义清楚，另一方面保留后半句的单数“我”，不抹平原文在代表性单数与群体指向之间的张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“说不定”体现警觉的推测语气；分号清楚连接怀疑与不能立约的后果。正文中的[a]、[b]均与相应脚注准确对应。
