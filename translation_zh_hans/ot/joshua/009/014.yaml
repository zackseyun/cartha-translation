  text: וַ/יִּקְח֥וּ הָֽ/אֲנָשִׁ֖ים מִ/צֵּידָ֑/ם וְ/אֶת פִּ֥י יְהוָ֖ה לֹ֥א שָׁאָֽלוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/014.yaml
  text: So the men took some of their provisions[a], but did not ask for the counsel of Yahweh.
translation:
  language: zh_hans
  text: 于是，那些人取了他们的一些食物，却没有求问耶和华的指示[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“耶和华的口”，意思是他所给的指示或裁决。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְחוּ
  choice: 取了
  rationale: לקח的基本义是“拿、取”。这里保留具体动作，不进一步解释为“查验”或“接受”。
- source_word: הָאֲנָשִׁים
  choice: 那些人
  rationale: 原文只说“那些人”。上下文虽指以色列人中的代表，但本句没有明说其身份，因此不增译为“以色列人”或“首领”。
- source_word: מִצֵּידָם
  choice: 他们的一些干粮
  rationale: צֵיד在此指旅途所带的食物或给养；前缀מִן在语境中有部分义，因此译作“一些”。“干粮”既自然，也符合本段关于陈旧饼食的上下文。
- source_word: פִּי יְהוָה
  choice: 耶和华的指示
  rationale: 字面为“耶和华的口”，在这里是求问耶和华所作指示或裁决的惯用表达。正文按汉语习惯传达其意义，字面形式留在脚注中。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的专名“耶和华”表达四字神名，而不以“主”这一称号代替。
- source_word: לֹא שָׁאָלוּ
  choice: 没有求问
  rationale: שׁאל意为“问、求问”。与神的指示搭配时，“求问”准确、自然，并保留向神寻求答复的含义。
theological_decisions:
- issue: 四字神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威；上主
  rationale: 原文直接使用神的专名。正文保留专名而不替换成称号；“耶和华”是现代中文读者最熟悉且可辨识的形式。
- issue: 惯用语פִּי יְהוָה的处理
  choice: 耶和华的指示
  alternative: 耶和华的口；耶和华的话；耶和华的命令
  rationale: 该短语字面是“耶和华的口”，在本句中指从耶和华而来的答复、指引或裁决。“指示”不把含义限定为已经颁布的命令，同时清楚表达他们没有向神求问；脚注保留字面意象。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“于是”承接叙事，“却”突出他们取了干粮作为依据，却没有求问神这一对比。脚注标记紧随“指示”，与所解释的希伯来惯用语准确对应。
