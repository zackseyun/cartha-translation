base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/027.yaml
  text: So Joshua made them woodcutters and water carriers on that day for the congregation and for the altar of Yahweh[a], to this day, in the place that he would choose.
translation:
  language: zh_hans
  text: 那一天，约书亚指定他们为会众和雅威的祭坛砍柴、打水；直到今日，他们仍在他将要选择的地方承担这项劳役。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּתְּנֵם
  choice: 派他们
  rationale: נתן本义为“给、安置”，但这里与表示工种的分词连用，指约书亚指派他们承担这些劳役；“派他们”自然地表达这种任命含义。
- source_word: חֹטְבֵי עֵצִים
  choice: 砍柴
  rationale: 直译为“砍木材的人”；结合所承担的劳役，译作动词性短语“砍柴”简洁自然。
- source_word: וְשֹׁאֲבֵי מַיִם
  choice: 打水
  rationale: שאב指从井或水源汲取水；现代汉语“打水”准确而通俗，也能表达其劳役性质。
- source_word: לָעֵדָה
  choice: 为会众
  rationale: עֵדָה指以色列这一聚集的共同体；“会众”保留其群体和礼仪语境。
- source_word: וּלְמִזְבַּח יְהוָה
  choice: 为雅威的祭坛
  rationale: 保留介词所表达的服务对象，并把神名יהוה音译为“雅威”。
- source_word: עַד הַיּוֹם הַזֶּה
  choice: 直到今日
  rationale: 这是叙事中的惯用语，表示该状况延续到作者所处的时代。
- source_word: אֶל הַמָּקוֹם אֲשֶׁר יִבְחָר
  choice: 在他所要选择的地方
  rationale: 在本语境中，אֶל指向相关服役所在之处；未完成式יִבְחָר从约书亚时代的叙事视角指向将来的选择，故译“所要选择”。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；“雅威”以现代汉语通行音译保留其作为专名的性质，而不以称号替代。
- issue: “他所要选择”的主语所指
  choice: 正文保留“他”，脚注说明其通常理解为雅威
  alternative: 直接译成“雅威所要选择的地方”；译成“被选定的地方”
  rationale: 希伯来文仅用第三人称单数动词，没有明说主语。上下文及申命记—约书亚记的固定表达强烈指向雅威，但正文保留代词可避免把原文隐含信息完全明说。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“砍柴、打水”通俗清楚；分号将当日的指派与延续至作者时代的状态分开。“供职”概括原文所指的持续劳役，避免中文句末悬空。
