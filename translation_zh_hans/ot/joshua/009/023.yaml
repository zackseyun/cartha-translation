  rationale: 仅作汉语表达层面的安全修订：以“如今”替换重复的“所以，现在”，并以“必不断有人”替换不自然的“必永不断”。修订保留原文的咒诅、持续供应劳役者的群体性含义，以及与上帝之殿相关的砍柴、打水职责；不把咒诅误译为每一位当前听者永远服役。
