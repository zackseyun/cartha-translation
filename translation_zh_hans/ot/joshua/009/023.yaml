  text: וְ/עַתָּ֖ה אֲרוּרִ֣ים אַתֶּ֑ם וְ/לֹֽא יִכָּרֵ֨ת מִ/כֶּ֜ם עֶ֗בֶד וְ/חֹטְבֵ֥י עֵצִ֛ים וְ/שֹֽׁאֲבֵי מַ֖יִם לְ/בֵ֥ית אֱלֹהָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/023.yaml
  text: So now you are cursed[a], and there shall never cease to be from among you slaves, cutters of wood and drawers of water for the house of my God.
translation:
  language: zh_hans
  text: 如今你们受咒诅了；你们中间必不断有人作奴隶，为我上帝的殿砍柴、打水。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַתָּה
  choice: 所以，现在
  rationale: 承接前文的判决并引出后果；既保留连接词的推论作用，也符合现代汉语表达。
- source_word: אֲרוּרִים
  choice: 受咒诅了
  rationale: 复数谓语形容词，直接表明全体听者处于咒诅之下；“受咒诅”庄重而清楚。
- source_word: וְלֹא יִכָּרֵת מִכֶּם עֶבֶד
  choice: 你们中间必永不断有人作奴隶
  rationale: 希伯来语直译为“奴隶必不从你们中间被剪除”，表达其族群将持续有人承担这种身份；汉译以自然方式保留持续、群体性的含义，而不暗示只有部分人受到咒诅。
- source_word: עֶבֶד
  choice: 奴隶
  rationale: 此处是咒诅所强加的从属劳役身份；“奴隶”比“仆人”更明确地传达其非自由、受支配的处境。
- source_word: חֹטְבֵי עֵצִים
  choice: 砍柴
  rationale: 以现代汉语简明表达分派给他们的具体劳役，并保留原文“砍伐木材”的形象。
- source_word: שֹׁאֲבֵי מַיִם
  choice: 打水
  rationale: 准确表达从水源汲水的劳役；“打水”是自然、通行的现代汉语。
- source_word: לְבֵית אֱלֹהָי
  choice: 为我上帝的殿
  rationale: בַּיִת 在本段语境中指敬拜上帝的圣所，而非家庭；“殿”清楚传达这一所指。
theological_decisions:
- issue: 如何表达约书亚咒诅中被强加的服役身份
  choice: 奴隶
  alternative: 仆人
  rationale: 原文 עֶבֶד 在这里与世代持续的强制性低下劳役相连。采用“奴隶”可保留咒诅的严厉程度，避免“仆人”淡化其受支配的身份。
- issue: “必不剪除”所表达的持续性对象
  choice: 你们中间必永不断有人作奴隶
  alternative: 你们必永远作奴隶
  rationale: 原文不是简单断言每个当事人都永远存活并服役，而是说他们这个群体中不会断绝承担奴役劳役的人；译文保留这一群体延续意义。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“所以，现在”保留宣判的承接语气；“砍柴、打水”通俗清楚。“我上帝的殿”保持约书亚第一人称的原文措辞，并明确圣所语境。
