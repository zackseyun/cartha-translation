source:
  edition: WLC
  text: וַ/יַּעֲנ֨וּ אֶת יְהוֹשֻׁ֜עַ וַ/יֹּאמְר֗וּ כִּי֩ הֻגֵּ֨ד הֻגַּ֤ד לַ/עֲבָדֶ֨י/ךָ֙ אֵת֩ אֲשֶׁ֨ר צִוָּ֜ה יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ אֶת מֹשֶׁ֣ה עַבְדּ֔/וֹ לָ/תֵ֤ת לָ/כֶם֙ אֶת כָּל הָ/אָ֔רֶץ וּ/לְ/הַשְׁמִ֛יד אֶת כָּל יֹשְׁבֵ֥י הָ/אָ֖רֶץ מִ/פְּנֵי/כֶ֑ם וַ/נִּירָ֨א מְאֹ֤ד לְ/נַפְשֹׁתֵ֨י/נוּ֙ מִ/פְּנֵי/כֶ֔ם וַֽ/נַּעֲשֵׂ֖ה אֶת הַ/דָּבָ֥ר הַ/זֶּֽה־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/024.yaml
  text: 'They answered Joshua and said[a], “Because it was clearly told to your servants what Yahweh your God commanded his servant Moses: to give you all the land and to destroy all the inhabitants of the land before you. So we feared greatly for our lives because of you, and we did this thing.”'
translation:
  language: zh_hans
  text: 他们回答约书亚说：“因为确实有人告诉你的仆人：耶和华——你的上帝——曾吩咐他的仆人摩西，要把这整片土地赐给你们，并从你们面前除灭这地所有的居民。我们因你们的缘故，为自己的性命十分害怕，所以就做了这件事。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲנוּ אֶת־יְהוֹשֻׁעַ וַיֹּאמְרוּ
  choice: 他们回答约书亚说
  rationale: 保留希伯来叙事中“回答……并说”的对话功能，同时用现代汉语自然表达。
- source_word: כִּי הֻגֵּד הֻגַּד
  choice: 因为……确实听说了
  rationale: כִּי在此引出基遍人采取行动的原因；不定式绝对式与限定动词连用表示强调，译作“确实”。被动结构在汉语中以主语经历式“听说了”自然呈现。
- source_word: לַעֲבָדֶיךָ
  choice: 你的仆人
  rationale: 这是外交场合谦称己方的用语，并非着重奴役身份。
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: 耶和华你的上帝
  rationale: 保留神圣名字יהוה，并按汉语顺序表达“你的上帝”。
- source_word: צִוָּה
  choice: 曾吩咐
  rationale: “吩咐”符合上帝向摩西颁命的语境；“曾”仅自然标示先前发生的事件，不把希伯来完成式机械解释为过去完成时。
- source_word: לָתֵת לָכֶם אֶת־כָּל־הָאָרֶץ
  choice: 要把这整片土地赐给你们
  rationale: “赐给”体现上帝给予土地的语境；הארץ在此指上下文中的这片土地，而非全世界。
- source_word: וּלְהַשְׁמִיד אֶת־כָּל־יֹשְׁבֵי הָאָרֶץ מִפְּנֵיכֶם
  choice: 并从你们面前除灭这地所有的居民
  rationale: “除灭”保持השמיד的强烈毁灭含义；“从你们面前”保留מִפְּנֵיכֶם所表达的清除、移去意象。
- source_word: וַנִּירָא מְאֹד לְנַפְשֹׁתֵינוּ מִפְּנֵיכֶם
  choice: 我们因你们而非常害怕，担心性命不保
  rationale: לְנַפְשֹׁתֵינוּ在此关乎保全生命；用“担心性命不保”清楚表达其语用意义，同时保留“非常害怕”的程度。
- source_word: וַנַּעֲשֶׂה אֶת־הַדָּבָר הַזֶּה
  choice: 所以才做了这件事
  rationale: “所以才”自然显明前述恐惧与行动之间的因果关系。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 采用现代中文读者广泛熟悉的专名“耶和华”，并明确区别于称号“主”；原文的盟约神名得到保留。
- issue: 毁灭当地居民的命令
  choice: 按原文直译为“除灭这地所有的居民”
  alternative: 弱化为“赶走这地所有的居民”
  rationale: השמיד表达毁灭而非单纯驱逐；译文保留经文自身的严峻性与神学张力，不加以缓和或辩解。
- issue: “你的仆人”的所指
  choice: 保留为基遍人的自谦称呼
  alternative: 译作“你的奴隶”
  rationale: 语境是基遍人向约书亚陈述理由的外交措辞；此处不应额外引入法律意义上的奴隶身份。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。“整片土地”“性命不保”“所以才”便于普通读者理解；同时保留“仆人”“吩咐”“赐给”“除灭”等符合圣经叙事语域的表达。无需脚注：希伯来语强调结构已由正文中的“确实”体现。
