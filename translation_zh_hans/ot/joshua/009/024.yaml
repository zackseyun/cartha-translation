revisions:
- from: 他们回答约书亚说：“因为你的仆人确实听说了，耶和华你的上帝曾吩咐他的仆人摩西，要把这整片土地赐给你们，并从你们面前除灭这地所有的居民。我们因你们而非常害怕，担心性命不保，所以才做了这件事。”
  to: 他们回答约书亚说：“因为确实有人告诉你的仆人：耶和华——你的上帝——曾吩咐他的仆人摩西，要把这整片土地赐给你们，并从你们面前除灭这地所有的居民。我们因你们的缘故，为自己的性命十分害怕，所以就做了这件事。”
  rationale: 修订仅澄清希伯来语强调性的被动结构，并以更贴近原文且自然的汉语表达“为性命害怕”。“耶和华——你的上帝——”以标点清楚标示同位语，保留原文对约书亚使用的单数“你的”。未改变命令、恐惧或行动之间的意义关系。
