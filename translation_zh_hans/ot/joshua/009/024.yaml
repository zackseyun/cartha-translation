  - severity: low
    issue: “担心性命不保”是对“为我们的性命害怕”的解释性扩展。
    rationale: 该说法并未改变核心意义，但“为自己的性命十分害怕”更直接对应לְנַפְשֹׁתֵינוּ，且维持庄重叙事语体。
