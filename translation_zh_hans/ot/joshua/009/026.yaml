  text: וַ/יַּ֥עַשׂ לָ/הֶ֖ם כֵּ֑ן וַ/יַּצֵּ֥ל אוֹתָ֛/ם מִ/יַּ֥ד בְּנֵֽי יִשְׂרָאֵ֖ל וְ/לֹ֥א הֲרָגֽוּ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/026.yaml
  text: So he did this for them[a], and he delivered them from the hand of the sons of Israel, and they did not kill them.
translation:
  language: zh_hans
  text: 约书亚就这样对待他们，救他们脱离以色列子孙[a]的手；以色列子孙没有杀他们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“以色列人”。希伯来原文直译为“以色列的众子”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ לָהֶם כֵּן
  choice: 约书亚就这样为他们做了
  rationale: 保留“照这样做”的承接作用；明确补出上文所指的主语“约书亚”，使现代汉语读者易于理解。
- source_word: וַיַּצֵּל אוֹתָם
  choice: 救他们脱离
  rationale: 希伯来语 נצל 的使役形在此表示救出、解救；“救……脱离”既自然，也能与后面的 מִיַּד 紧密衔接。
- source_word: מִיַּד
  choice: 脱离……的手
  rationale: 保留希伯来语“从某人手中”的具体比喻，表达脱离其权力或控制。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列子孙
  rationale: 较贴近原文“以色列的众子/子孙”这一民族称谓，同时在中文圣经语体中清楚可懂；脚注列出更自然的群体称谓。
- source_word: וְלֹא הֲרָגוּם
  choice: 以色列子孙没有杀他们
  rationale: 将复数动词隐含的主语明确为前句的“以色列子孙”，避免汉语连续使用“他们”造成指代不清；“杀”直接对应 הרג。
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל 的性别形式与民族整体称谓
  choice: 以色列子孙
  alternative: 以色列人
  rationale: 原文采用阳性复数结构“以色列的众子”，但在此是全民族的固定称谓。“以色列子孙”保留原文形式及其群体含义，不把它限定为只有成年男性；脚注注明现代汉语可译作“以色列人”。
- issue: 末句复数主语的识别
  choice: 以色列子孙没有杀他们
  alternative: 他们没有杀他们
  rationale: 动词 הֲרָגוּם 的复数主语最自然地回指紧邻的“以色列子孙”。明确重复主语只是消除汉语歧义，并未改变原文的事件关系。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。保留“手”这一希伯来语权力隐喻，并用分号呈现后两分句之间紧密而并列的关系。
