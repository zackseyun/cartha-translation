base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/009.yaml
  text: And they said to him[a], “Your servants have come from a very distant land for the name of Yahweh your God, for we have heard of his fame and all that he did in Egypt.”
translation:
  language: zh_hans
  text: 他们对他说：“你的仆人从极其遥远之地而来，是因雅威——你上帝——的名；因为我们听见了他的名声[a]，以及他在埃及所做的一切。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“我们听见了关于他的传闻”或“我们听闻了他的威名”。希伯来文采用同源词表达，直译近似“我们听见了他的听闻／传闻”。
    reason: 说明שָׁמַעְנוּ שָׁמְעוֹ的同源表达及其可能的词义范围。
lexical_decisions:
- source_word: וַיֹּאמְרוּ אֵלָיו
  choice: 他们回答他
  rationale: וַיֹּאמְרוּ אֵלָיו直译为“他们对他说”；在此前问答语境中，现代汉语用“回答他”自然地表达其叙事功能，不额外界定语气。
- source_word: מֵאֶרֶץ רְחוֹקָה מְאֹד
  choice: 从极其遥远的地方
  rationale: 保留רְחוֹקָה“遥远”和מְאֹד的加强意味；“地方”在汉语外交陈述中比重复“土地”更自然。
- source_word: עֲבָדֶיךָ
  choice: 你的仆人
  rationale: 这是外交言辞中的自谦称谓；“仆人”既保留从属意味，又不把本处限定为奴隶身份。
- source_word: לְשֵׁם יְהוָה אֱלֹהֶיךָ
  choice: 是因雅威你上帝的名
  rationale: לְשֵׁם可表示动机或缘由；“因……的名”保留原文简练表达，并让“名”涵盖名声、权威与所显明的身份，而不将含义缩减为单一解释。
- source_word: שָׁמַעְנוּ שָׁמְעוֹ
  choice: 我们听见了他的声名
  rationale: 原文采用同源词结构，指听见关于他的传闻、名声或声誉；“听见了他的声名”在现代汉语中庄重自然，并保留“听见”的词语呼应。
- source_word: וְאֵת כָּל אֲשֶׁר עָשָׂה בְּמִצְרָיִם
  choice: 也听见了他在埃及所做的一切
  rationale: 汉语补出由前一动词统领的“听见了”，清楚表达并列宾语关系；“所做的一切”直接对应כָּל אֲשֶׁר עָשָׂה。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”按其较通行的学术拟音音译，避免以称号替代专名。
- issue: לְשֵׁם中“名”的含义
  choice: 保留“因雅威你上帝的名”
  alternative: 因雅威你上帝的声名
  rationale: 原文“名”可能涉及名声、权威和身份；正文保留“名”，不把这一神学张力单一化为“名声”。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。外交性的自谦保留为“你的仆人”；神名译作“雅威”。正文不刻意复制希伯来语同源词造成的生硬结构，相关形式与词义范围置于脚注。
