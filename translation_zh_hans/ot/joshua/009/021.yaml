  text: וַ/יֹּאמְר֧וּ אֲלֵי/הֶ֛ם הַ/נְּשִׂיאִ֖ים יִֽחְי֑וּ וַ֠/יִּֽהְיוּ חֹטְבֵ֨י עֵצִ֤ים וְ/שֹֽׁאֲבֵי מַ֨יִם֙ לְ/כָל הָ֣/עֵדָ֔ה כַּ/אֲשֶׁ֛ר דִּבְּר֥וּ לָ/הֶ֖ם הַ/נְּשִׂיאִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/021.yaml
  text: The leaders said to them[a], “Let them live.” So they became woodcutters and water-drawers for all the congregation, just as the leaders had spoken to them.
translation:
  language: zh_hans
  text: 众首领对他们说：“让他们活着。”于是，他们就成了为全会众砍柴打水的人[a]，正如众首领对他们所说的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译为“砍木者、汲水者”。
    reason: 说明希伯来文两个并列分词短语的较贴近原文结构的译法。
lexical_decisions:
- source_word: הַנְּשִׂיאִים
  choice: 众首领
  rationale: 这里指以色列会众中公认的领袖；“首领”既符合叙事中的公共领导语境，也比“王子”或“官长”更准确自然。
- source_word: יִחְיוּ
  choice: 让他们活着
  rationale: 此处未完成式带祈使性语气，表达首领作出的处置决定，即准许基遍人保全性命。
- source_word: וַיִּהְיוּ
  choice: 于是，他们就成了
  rationale: 该形式在上下文中表示随决定而产生的新身份和职责；“成了”自然体现这一转变。
- source_word: חֹטְבֵי עֵצִים וְשֹׁאֲבֵי מַיִם
  choice: 砍柴打水的人
  rationale: 两个分词短语表示持续承担的劳役。“砍柴打水的人”在现代汉语中自然、具体，并保留两项工作的平行结构。
- source_word: לְכָל הָעֵדָה
  choice: 为全会众
  rationale: עֵדָה在此指以色列整体的会众；“全会众”保留其群体含义，也与本书语境相符。
- source_word: כַּאֲשֶׁר דִּבְּרוּ לָהֶם הַנְּשִׂיאִים
  choice: 正如众首领对他们所说的
  rationale: 忠实保留比较从句，并把结果与首领先前所说的话联系起来，不额外解释其具体所指。
theological_decisions: []
