id: JOS.9.12
reference: Joshua 9:12
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: זֶ֣ה לַחְמֵ֗/נוּ חָ֞ם הִצְטַיַּ֤דְנוּ אֹת/וֹ֙ מִ/בָּ֣תֵּ֔י/נוּ בְּ/י֥וֹם צֵאתֵ֖/נוּ לָ/לֶ֣כֶת אֲלֵי/כֶ֑ם וְ/עַתָּה֙ הִנֵּ֣ה יָבֵ֔שׁ וְ/הָיָ֖ה נִקֻּדִֽים׀׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/012.yaml
  text: This bread of ours was warm when we took it as our provisions from our houses on the day we set out to come to you[a], but now, look, it is dry and has become moldy.
translation:
  language: zh_hans
  text: “这是我们的饼。我们动身到你们这里来的那天，从家里带出来作干粮时，饼还是热的；现在你们看，已经干了，还变得斑斑点点[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“发霉了”“碎裂了”。这里的希伯来词指带有点或斑；用来形容陈旧的饼时，究竟是指霉斑、裂纹，还是干裂易碎，不能确定。
    reason: 保留罕见词 נִקֻּדִים 在此语境中的词义不确定性。
lexical_decisions:
- source_word: זֶה לַחְמֵנוּ
  choice: 这是我们的饼
  rationale: 保留指示词的现场感和第一人称复数所有关系；现代汉语中简洁自然。
- source_word: חָם
  choice: 还是热的
  rationale: 按字面译为“热的”，不以较具解释性的“新鲜”取代；“还是”体现当时与如今状态的对比。
- source_word: הִצְטַיַּדְנוּ אֹתוֹ
  choice: 带出来作干粮
  rationale: 该动词在此指为旅途预备、携带补给；“作干粮”符合饼在旅途中的用途，也比生硬的“以它装备自己”自然。
- source_word: מִבָּתֵּינוּ
  choice: 从家里
  rationale: 希伯来文为复数“从我们的房屋”，汉语集合性表达“从家里”更自然，意义不变。
- source_word: בְּיוֹם צֵאתֵנוּ לָלֶכֶת אֲלֵיכֶם
  choice: 我们动身到你们这里来的那天
  rationale: “动身”表达出发远行；因说话者面对听者，译作“到你们这里来”符合现代汉语的指向习惯。
- source_word: וְעַתָּה הִנֵּה
  choice: 现在你们看
  rationale: 既表达时间上的转折，也保留 הִנֵּה 引人察看的语用功能。
- source_word: יָבֵשׁ
  choice: 已经干了
  rationale: 准确表达饼目前干燥的状态，并以“已经”突出旅途中发生的变化。
- source_word: וְהָיָה נִקֻּדִים
  choice: 还变得斑斑点点
  rationale: נִקֻּדִים 的基本意象是布满点或斑；主文保留这种可见特征，不武断判定为霉斑、裂纹或碎屑。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。直接引语保持口头陈述的现场感；“饼”“干粮”等词易懂且符合古代旅途语境。脚注标记置于其实际解释的“斑斑点点”之后。
