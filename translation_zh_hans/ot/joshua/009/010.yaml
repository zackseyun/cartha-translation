base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/010.yaml
  text: and all that he did to the two kings of the Amorites who were beyond the Jordan—to Sihon king of Heshbon and to Og king of Bashan[b][a], who was at Ashtaroth—
translation:
  language: zh_hans
  text: 以及他向约旦河对岸[a]的亚摩利人的两位王所做的一切：就是希实本王西宏和在亚斯他录[b]的巴珊王噩。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“约旦河另一边”。
    reason: בְּעֵבֶר הַיַּרְדֵּן 是相对方位表达，也可译为“约旦河另一边”；具体所指哪一岸取决于说话者的地理视角。
  - marker: b
    text: 或译：“住在亚斯他录的”。
    reason: 介词 בְּ 在这里可泛指身处该地，也可按居住或驻留关系表达。
lexical_decisions:
- source_word: וְאֵת
  choice: 以及
  rationale: 连同宾语标记承接上一节所列举的内容；汉语以“以及”自然延续并列关系，宾语标记不另行翻出。
- source_word: כָּל אֲשֶׁר עָשָׂה
  choice: 他……所做的一切
  rationale: 保留“全部”之意和未明说姓名的第三人称主语；上下文可辨明“他”所指的是耶和华。
- source_word: לִשְׁנֵי מַלְכֵי הָאֱמֹרִי
  choice: 向……两个亚摩利王
  rationale: 介词 ל 表示行动所针对的对象；“向……所做的”贴近原文，又不额外明确为“攻击”。
- source_word: אֲשֶׁר בְּעֵבֶר הַיַּרְדֵּן
  choice: 约旦河对岸的
  rationale: בְּעֵבֶר 指隔河的另一侧；“对岸”简洁自然，同时保留由说话者所处位置决定的相对视角。
- source_word: לְסִיחוֹן מֶלֶךְ חֶשְׁבּוֹן
  choice: 向希实本王西宏
  rationale: 按汉语常用次序表达王所属的地方与姓名，并保留前置介词所标明的行动对象。
- source_word: וּלְעוֹג מֶלֶךְ הַבָּשָׁן
  choice: 和……巴珊王噩
  rationale: 与西宏的短语保持并列；地名和人名采用通行的中文圣经译名。
- source_word: אֲשֶׁר בְּעַשְׁתָּרוֹת
  choice: 在亚斯他录的
  rationale: 关系从句最自然地修饰巴珊王噩；בְּ 可表示身处或位于某地，正文以宽泛的“在”保留其含义。
theological_decisions:
- issue: עָשָׂה 的隐含主语
  choice: 译作“他”，由上下文确定所指
  alternative: 明确译作“耶和华”
  rationale: 本节希伯来文只有第三人称阳性单数动词，没有再次明说主语。保留代词既符合原文形式，也避免在本节自行补入神名。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。用“就是……”重述两个王，使较长的对象结构在汉语中清楚，同时不改变原文的同位说明关系。所有专名采用简体中文圣经传统中通行的形式。
