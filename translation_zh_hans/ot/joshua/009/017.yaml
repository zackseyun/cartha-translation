  text: וַ/יִּסְע֣וּ בְנֵֽי יִשְׂרָאֵ֗ל וַ/יָּבֹ֛אוּ אֶל עָרֵי/הֶ֖ם בַּ/יּ֣וֹם הַ/שְּׁלִישִׁ֑י וְ/עָרֵי/הֶם֙ גִּבְע֣וֹן וְ/הַ/כְּפִירָ֔ה וּ/בְאֵר֖וֹת וְ/קִרְיַ֥ת יְעָרִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/017.yaml
  text: So the sons of Israel set out and came to their cities on the third day[a]. Now their cities were Gibeon, Chephirah, Beeroth[b], and Kiriath-jearim.
translation:
  language: zh_hans
  text: 以色列人启程，第三天到了他们的城邑[a]。这些城邑是基遍、基非拉、比录和基列耶琳。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “他们”指前文的基遍居民一方。
    reason: referential_clarification
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: 启程
  rationale: נסע的叙事性连续式表示出发、动身；“启程”自然简洁，又不额外引入拔营的细节。
- source_word: בְנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 该短语字面为“以色列的众子”，但在此是以色列民族的惯用称呼；现代汉语以“以色列人”表达最自然，也不误限定为男性。
- source_word: וַיָּבֹאוּ אֶל עָרֵיהֶם
  choice: 来到他们的城邑
  rationale: בוא与אֶל表示来到、抵达某处；“城邑”适合圣经历史叙事，也能涵盖古代设防或聚居地点。代词“他们”按上下文指基遍人及其同盟。
- source_word: בַּיּוֹם הַשְּׁלִישִׁי
  choice: 在第三天
  rationale: 按希伯来叙事中时间短语的通常含义直译，保留“第三天”，不改释为“到第三天为止”。
- source_word: וְעָרֵיהֶם
  choice: 他们的城邑就是
  rationale: 这里的连接词引出解释性清单；“就是”在现代汉语中清楚表达后面的同位说明。
- source_word: גִּבְעוֹן
  choice: 基遍
  rationale: 采用现代中文圣经传统中通行且易识别的地名译法。
- source_word: הַכְּפִירָה
  choice: 基非拉
  rationale: 采用现代中文圣经传统中通行的音译，贴近希伯来语Kefirah的读音。
- source_word: בְּאֵרוֹת
  choice: 比录
  rationale: 采用现代中文圣经传统中通行的地名译法。
- source_word: קִרְיַת יְעָרִים
  choice: 基列·耶琳
  rationale: 采用通行中文音译，并以间隔号显示复合地名的两个组成部分，便于现代读者辨读。
theological_decisions: []
translation_notes:
  register: 使用现代、庄重而易懂的叙事体。“以色列人”按民族称谓处理；地名采用简体中文圣经语境中较通行的译名。原文无需要在正文中标示的实质歧义，因此不设脚注。
