  yaml_path: translation/ot/joshua/009/008.yaml
  text: They said to Joshua[a], “We are your servants.” Then Joshua said to them, “Who are you, and where do you come from?”
translation:
  language: zh_hans
  text: 他们对约书亚说：“我们是你的仆人[a]。”约书亚问他们：“你们是什么人？从哪里来？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“奴隶”。希伯来语 עֲבָדֶיךָ 可指仆人或奴隶；这里说话者是在外交请求中使用谦卑顺服的称呼。
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲבָדֶיךָ
  choice: 你的仆人
  rationale: עֶבֶד 可指仆人或奴隶。这里基遍人是在外交请求中以谦卑、顺服的口吻自称，并非陈述已经确立的法律奴役身份；“仆人”更符合此处语用，同时以脚注保留“奴仆”的可能译法。
- source_word: אֲנָחְנוּ
  choice: 我们是
  rationale: 希伯来语名词句没有明示系词；现代汉语自然补出“是”。
- source_word: מִי אַתֶּם
  choice: 你们是什么人
  rationale: 直译为“你们是谁”；在询问群体身份的语境中，“你们是什么人”自然清楚，又不增添原文没有的身份信息。
- source_word: וּמֵאַיִן תָּבֹאוּ
  choice: 从哪里来
  rationale: מֵאַיִן 询问来源地；בוא 的未完成式在此表达来处，而非必须理解为正在行进。现代汉语用“从哪里来”最自然，也保留时态上的宽度。
- source_word: וַיֹּאמְרוּ / וַיֹּאמֶר
  choice: 他们……说……约书亚问
  rationale: 连续叙事形式以现代汉语顺畅表达；第二个“说”按其后问句的言语功能译作“问”，不额外加入原文未明示的时间连接词。
theological_decisions: []
