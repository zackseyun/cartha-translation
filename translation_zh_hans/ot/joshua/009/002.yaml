  yaml_path: translation/ot/joshua/009/002.yaml
  text: they gathered together to fight against Joshua and against Israel[a], with one accord.
translation:
  language: zh_hans
  text: 他们便一同聚集，要与约书亚和以色列争战，同心合意[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“一个口”，是指众人意见一致、齐心行动。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְקַבְּצוּ
  choice: 他们便……聚集
  rationale: 该词为קבץ的尼法勒式，表示众人聚到一起；“聚集”准确、自然，也不额外推断他们结盟的具体方式。
- source_word: יַחְדָּו
  choice: 一同
  rationale: 该副词强调共同采取行动；“一同”简洁地保留这一联合行动的意味。
- source_word: לְהִלָּחֵם
  choice: 要……争战
  rationale: לחם的尼法勒不定式在这里指投入战斗；“争战”符合历史叙事的庄重语体，“要”表达目的。
- source_word: עִם יְהוֹשֻׁעַ וְעִם יִשְׂרָאֵל
  choice: 与约书亚和以色列争战
  rationale: עִם本义常为“与”，但用于争战动词时表示敌对对象。汉语“与……争战”自然地表达“对抗”，并保留两个对象。
- source_word: יְהוֹשֻׁעַ
  choice: 约书亚
  rationale: 采用现代中文圣经中通行的人名译法。
- source_word: פֶּה אֶחָד
  choice: 同心合意
  rationale: 原文直译为“一个口”，是表示意见一致、行动齐心的习语；“同心合意”传达其一致行动的含义，同时以脚注保留原文意象。
theological_decisions: []
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“一同聚集”与“同心合意”分别保留יַחְדָּו和פֶּה אֶחָד的双重强调；没有将两者合并，以免削弱原文对联合行动与一致意志的重复表达。
