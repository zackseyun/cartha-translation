base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/005.yaml
  text: They had worn-out and patched sandals on their feet[a], and worn-out clothes on themselves; and all the bread of their provision was dry and crumbly.
translation:
  language: zh_hans
  text: 他们脚上穿着破旧、打过补丁的鞋，身上穿着破旧的衣服；他们所带的饼全都又干又碎。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“发霉”。译作“碎”的希伯来词十分罕见，可能指饼因干硬而裂成碎块；也有人理解为“发霉”。
    reason: lexical_alternative
lexical_decisions:
- source_word: נְעָלוֹת
  choice: 鞋
  rationale: 指穿在脚上的鞋履；现代汉语用“鞋”自然清楚，同时不把其具体样式限定为原文未明说的凉鞋。
- source_word: בָּלוֹת
  choice: 破旧
  rationale: 表达因年久或使用而磨损的状态，比单说“旧”更准确，也适用于鞋和衣服。
- source_word: מְטֻלָּאוֹת
  choice: 打过补丁
  rationale: 保留被修补过的被动含义，符合现代汉语的自然说法。
- source_word: בְּרַגְלֵיהֶם
  choice: 脚上穿着
  rationale: 自然呈现鞋在脚上的具体细节，并与汉语动词“穿着”搭配。
- source_word: שְׂלָמוֹת
  choice: 衣服
  rationale: 使用普通现代汉语中的一般性衣着用语，不将其过度限定为外袍。
- source_word: עֲלֵיהֶם
  choice: 身上穿着
  rationale: 以自然汉语保留衣物穿在他们身上的具体形象。
- source_word: לֶחֶם צֵידָם
  choice: 他们所带的饼
  rationale: 保留“饼”这一具体食物，同时以“所带的”表达作为旅途口粮或供应品的含义。
- source_word: יָבֵשׁ הָיָה
  choice: 都……干
  rationale: 准确表达饼当时所处的干燥状态；与“全”搭配，反映原文“所有”的范围。
- source_word: נִקֻּדִים
  choice: 碎
  rationale: 该词罕见且含义不确定；上下文可能指饼干硬后裂开、碎裂。正文采用简洁的“碎”，并在脚注保留“发霉”的另一种理解。
