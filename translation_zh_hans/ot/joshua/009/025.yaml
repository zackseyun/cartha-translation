base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/025.yaml
  text: And now[a], here we are in your hand. Do to us as it is good and right in your eyes to do.
translation:
  language: zh_hans
  text: 如今[a]，我们在你手中。你看怎样待我们是好、是对的，就怎样待我们吧。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“现在。”希伯来文此处有连接词，承接上文并转入他们当前的处境。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: 现在
  rationale: 这是承接上文并转入当前处境的话语标记；现代汉语以“现在”自然表达，连接关系由上下文即可显明。
- source_word: הִנְנוּ
  choice: 看哪，我们
  rationale: 保留希伯来语呈现、强调当前处境的语气；“看哪”庄重而仍为普通读者所理解。
- source_word: בְיָדֶךָ
  choice: 在你手中
  rationale: 保留希伯来语表示受对方支配或处置的“手”这一意象，而不直接释为“任你处置”。
- source_word: כַּטּוֹב וְכַיָּשָׁר
  choice: 是好、是对的
  rationale: 分别直接表达 טוֹב 与 יָשָׁר，并保留二者并列所带出的评价与正当性。
- source_word: בְּעֵינֶיךָ
  choice: 你看
  rationale: 用自然现代汉语传达“在你眼中”的判断性习语；避免主句因逐字保留该意象而显得生硬。
- source_word: לַעֲשׂוֹת לָנוּ עֲשֵׂה
  choice: 就怎样待我们吧
  rationale: 以“待我们”自然表达重复的 עשה 与 לָנוּ 所指的处置行为，并以“吧”体现顺服性的请求语气。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重且易懂的普通话。正文保留“在你手中”的希伯来意象，同时将“在你眼中”按汉语习惯译作“你看”，并保留“好”与“对”的并列张力。
