  text: וְ/יֹשְׁבֵ֨י גִבְע֜וֹן שָׁמְע֗וּ אֵת֩ אֲשֶׁ֨ר עָשָׂ֧ה יְהוֹשֻׁ֛עַ לִֽ/ירִיח֖וֹ וְ/לָ/עָֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/003.yaml
  text: But the inhabitants of Gibeon heard what Joshua had done to Jericho and to Ai[a].
translation:
  language: zh_hans
  text: 可是，基遍的居民听说了约书亚对耶利哥和艾城所做的事。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“而基遍的居民听说了约书亚对耶利哥和艾城所做的事。”
    reason: 句首וְ既可按上下文理解为转折，也可作一般连接。
lexical_decisions:
- source_word: וְ/יֹשְׁבֵי
  choice: 可是，……的居民
  rationale: יֹשְׁבֵי直指“居民、居住者”。句首וְ本可作简单连接，但上下文由诸王联合迎战转到基遍人采取不同对策，因此用“可是”自然体现叙事对比。
- source_word: גִבְעוֹן
  choice: 基遍
  rationale: 采用现代中文圣经地名的通行译名。
- source_word: שָׁמְעוּ
  choice: 听说了
  rationale: שׁמע基本义为“听见”；此处后接所发生之事，现代汉语用“听说了”更自然，同时保留听闻之义。
- source_word: אֵת אֲשֶׁר
  choice: ……所做的事
  rationale: 宾语标记与关系词共同引出听闻的内容；译作“所做的事”准确而流畅。
- source_word: עָשָׂה
  choice: 所做的事
  rationale: עָשָׂה意为“做、施行”。中文无需以时态形式另行标明先于“听说”，语序与语境已清楚表达。
- source_word: יְהוֹשֻׁעַ
  choice: 约书亚
  rationale: 采用现代中文圣经人名的通行译名。
- source_word: לִֽ/ירִיחוֹ
  choice: 向耶利哥
  rationale: 介词ל在这里表示行动所指向的对象。“向……所做的事”比“对……所做的事”略显庄重，也不额外限定为攻击。
- source_word: וְ/לָ/עָי
  choice: 和艾城
  rationale: 与“耶利哥”并列，同受“向……所做的事”支配。采用中文通行地名“艾城”；补“城”可避免将单音地名误读为普通词。
theological_decisions:
- issue: 句首连接词וְ的语篇功能
  choice: 可是
  alternative: 而／基遍的居民听说了……
  rationale: 这不是教义性取舍。וְ可仅作连接，但本节把基遍人的反应与9:1–2诸王的反应形成对照；“可是”清楚呈现这一转折，同时用脚注保留简单连接的可能。
translation_notes:
  register: 采用自然、庄重的现代标准普通话。“居民”“听说了”“所做的事”便于普通读者理解；保留原文未具体说明约书亚究竟如何处置两城的概括表达。
