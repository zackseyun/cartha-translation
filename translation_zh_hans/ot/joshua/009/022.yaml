source:
  edition: WLC
  text: וַ/יִּקְרָ֤א לָ/הֶם֙ יְהוֹשֻׁ֔עַ וַ/יְדַבֵּ֥ר אֲלֵי/הֶ֖ם לֵ/אמֹ֑ר לָ/מָּה֩ רִמִּיתֶ֨ם אֹתָ֜/נוּ לֵ/אמֹ֗ר רְחוֹקִ֨ים אֲנַ֤חְנוּ מִ/כֶּם֙ מְאֹ֔ד וְ/אַתֶּ֖ם בְּ/קִרְבֵּ֥/נוּ יֹשְׁבִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/022.yaml
  text: Then Joshua called for them and spoke to them[a], saying, “Why did you deceive us, saying, ‘We are very far from you,’ when you are living among us?”
translation:
  language: zh_hans
  text: 约书亚把他们召来，对他们说：“你们为什么欺骗我们，说：‘我们离你们非常远’，而你们住在我们中间[a]？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“住在我们当中。”
    reason: “中间”和“当中”都可表达 בְּקִרְבֵּנוּ；前者较贴近原文的空间意象，后者同样符合现代汉语习惯。
lexical_decisions:
- source_word: וַיִּקְרָא לָהֶם
  choice: 把他们召来
  rationale: 此处不是单纯呼喊，而是约书亚召见基遍人并当面质问；“把他们召来”自然地表达了使他们前来的语境含义。
- source_word: וַיְדַבֵּר אֲלֵיהֶם לֵאמֹר
  choice: 对他们说
  rationale: 这是希伯来语常见的引语公式。现代汉语用“对他们说”即可准确、庄重地引出直接引语，无须机械重复“说……说道”。
- source_word: לָמָּה רִמִּיתֶם אֹתָנוּ
  choice: 你们为什么欺骗我们
  rationale: רמה 的加强词干表示有意欺骗；“欺骗”比“误导”更准确地保留责问的力度。
- source_word: רְחוֹקִים אֲנַחְנוּ מִכֶּם מְאֹד
  choice: 我们离你们非常远
  rationale: 保留“远离你们”及 מְאֹד 的强调，译文也是自然的现代汉语。
- source_word: וְאַתֶּם בְּקִרְבֵּנוּ יֹשְׁבִים
  choice: 其实你们就住在我们中间
  rationale: בְּקִרְבֵּנוּ 直指“在我们中间／当中”；分词 יֹשְׁבִים 表示当前持续居住的状态。“其实……就……”清楚呈现前后陈述的反差，但不增添盟约层面的解释。
theological_decisions:
- issue: 是否在约书亚的责问中补入立约或违约的神学含义
  choice: 只译出关于距离和居住地点的欺骗
  alternative: 在正文中明确补充他们借谎言骗取盟约或违反盟约
  rationale: 本节直接责问的是他们谎称来自远方，实际却住在以色列人中间。盟约背景可由上下文得知，不应加入本节没有明说的神学判断。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“把他们召来”体现叙事场景；直接引语保持约书亚责问的力度。以“其实”表达 וְ 在此形成的语义反差，以“就”突出对方并非来自远方，而是近在以色列人中间。
