base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/011.yaml
  text: So our elders and all the inhabitants of our land said to us[a], ‘Take provisions in your hand for the journey, and go to meet them. Say to them, “We are your servants”[b]; and now make a covenant with us.’
translation:
  language: zh_hans
  text: 我们的长老和我们境内所有的居民对我们说：‘你们要带上路上所需的给养，去迎接他们，对他们说：“我们是你们的仆人[b]。现在，请与我们立约[a]。”’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文的惯用说法字面含有“切约”之意；整体意思是“与我们立约”。
    reason: lexical_alternative
  - marker: b
    text: “仆人”在这里是谦恭的外交用语；相应的希伯来语在其他语境中也可指“奴隶”。
    reason: lexical_alternative
lexical_decisions:
- source_word: זְקֵינֵינוּ
  choice: 我们的长老
  rationale: 这里指群体中的领袖，而不只是年长的男子；“长老”既准确又符合现代中文的圣经语境。
- source_word: יֹשְׁבֵי אַרְצֵנוּ
  choice: 我们地上所有的居民
  rationale: 保留“居住在我们土地上的人”这一集体含义，并以自然中文表达。
- source_word: צֵידָה לַדֶּרֶךְ
  choice: 路上所需的食物
  rationale: צֵידָה在此主要指旅途携带的食物或给养；此译法清楚表达旅行用途，又不过度限定具体种类。
- source_word: בְיֶדְכֶם
  choice: 带上
  rationale: 希伯来语直译为“在你们手中”，在此表示随身携带；中文用“带上”更自然，也完整传达动作含义。
- source_word: לִקְרָאתָם
  choice: 去迎接他们
  rationale: 保留“前去与对方相会”的方向性；“迎接”贴近原文，又符合外交接触的场景。
- source_word: עַבְדֵיכֶם
  choice: 你们的仆人
  rationale: עבד可指仆人或奴隶；本节是请求缔约时的谦卑外交用语，因此译为“仆人”，同时以脚注保留词义范围。
- source_word: וְעַתָּה
  choice: 现在
  rationale: 标示由陈述转入请求；中文省去机械对应连词，使引语流畅而不损失话语功能。
- source_word: כִּרְתוּ לָנוּ בְרִית
  choice: 请与我们立约
  rationale: כרת ברית字面为“切约”，是希伯来语表示缔结盟约的固定用语；“立约”自然、庄重，并保留圣经中的约之概念。“请”体现祈使句在此请求语境中的语气。
theological_decisions:
- issue: בְרִית在外交语境中可译为“盟约”或“条约”
  choice: 立约
  alternative: 与我们订立盟约／条约
  rationale: “立约”既适合本节的政治外交情境，也保留בְרִית在圣经中较宽的“约”之范畴，避免把它仅限定为现代政治条约。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。引语层次以中文标点清楚区分；保留“长老”“仆人”“立约”等关键社会和盟约用语，同时将“手里拿着”等希伯来语具体习语自然化为“带上”。
