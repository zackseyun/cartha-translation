base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/015.yaml
  text: So Joshua made peace with them and made a covenant with them to let them live[c][b][a], and the leaders of the congregation swore to them.
translation:
  language: zh_hans
  text: 于是，约书亚与他们讲和，并与他们立约，容他们存活；会众的首领也向他们起了誓。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ לָהֶם ... שָׁלוֹם
  choice: 与他们讲和
  rationale: 希伯来语习语意为建立和平关系；“讲和”自然、简洁，并保留政治与盟约语境。
- source_word: וַיִּכְרֹת לָהֶם בְּרִית
  choice: 与他们立约
  rationale: כרת ברית 字面为“切约”，但现代汉语通常以“立约”准确表达这一固定盟约用语，同时保持庄重语体。
- source_word: לְחַיּוֹתָם
  choice: 容他们存活
  rationale: 该不定式说明立约的目的，即使他们继续活着；“容他们存活”比“保全他们的性命”更贴近形式，又符合现代汉语。
- source_word: וַיִּשָּׁבְעוּ לָהֶם
  choice: 向他们起了誓
  rationale: שבע 在此指郑重起誓；“向他们起了誓”清楚保留誓言的对象。
- source_word: נְשִׂיאֵי הָעֵדָה
  choice: 会众的首领
  rationale: נשיאים 指具有公认地位的领袖，עדה 指聚集的共同体；“会众的首领”兼顾群体性、叙事语境和庄重程度。
theological_decisions:
- issue: 盟约习语的译法
  choice: 立约
  alternative: 切约
  rationale: “立约”是现代汉语中清楚而庄重的固定表达，保留盟约的法律与神学质感；字面译作“切约”会造成不必要的晦涩。
- issue: הָעֵדָה 的群体称谓
  choice: 会众
  alternative: 集会；群体
  rationale: “会众”能表达以色列共同体的整体性，又不把后来的教会制度含义强加于本节。
- issue: לְחַיּוֹתָם 所表达的目的
  choice: 容他们存活
  alternative: 保全他们的性命；饶他们不死
  rationale: 保留“使其活着”的目的含义，不额外断定这是主动保护还是仅仅免于处死。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“讲和—立约—起誓”保留原文连续法律行动的推进；分号用于清楚区分约书亚的行动与会众首领的起誓。
