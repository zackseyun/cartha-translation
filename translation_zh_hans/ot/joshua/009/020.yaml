  text: זֹ֛את נַעֲשֶׂ֥ה לָ/הֶ֖ם וְ/הַחֲיֵ֣ה אוֹתָ֑/ם וְ/לֹֽא יִֽהְיֶ֤ה עָלֵ֨י/נוּ֙ קֶ֔צֶף עַל הַ/שְּׁבוּעָ֖ה אֲשֶׁר נִשְׁבַּ֥עְנוּ לָ/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/020.yaml
  text: This is what we will do to them and let them live[b][a], so that wrath may not come upon us because of the oath that we swore to them.
translation:
  language: zh_hans
  text: 我们要这样待他们，让他们活着[a]，免得因我们向他们所起的誓，烈怒[b]临到我们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“使他们存活”，也可译“饶他们不死”。
    reason: lexical_alternative
  - marker: b
    text: 这里的“烈怒”很可能指神的烈怒，但希伯来原文没有明确说是“耶和华的烈怒”。
    reason: alternative_reading
lexical_decisions:
- source_word: זֹאת נַעֲשֶׂה לָהֶם
  choice: 我们要这样对待他们
  rationale: זֹאת承接并引出所拟采取的做法；נַעֲשֶׂה是第一人称复数未完成式，在商议语境中表示将要采取的行动。现代汉语用“要这样对待他们”自然表达“这样向他们行”。
- source_word: וְהַחֲיֵה אוֹתָם
  choice: 让他们活着
  rationale: חיה的使役式在此可指使其存活、容其活命。“让他们活着”简洁地保留其基本语义，不像“饶他们不死”那样进一步强调免除杀害。
- source_word: וְלֹא יִהְיֶה עָלֵינוּ קֶצֶף
  choice: 免得……有烈怒临到我们
  rationale: 否定未完成式在此承接所拟行动，表达避免某种后果。“免得”符合上下文的目的或结果关系；“临到我们”自然传达עַל与היה结合的意思。
- source_word: קֶצֶף
  choice: 烈怒
  rationale: 该词表示强烈的愤怒或震怒，盟誓语境中很可能指神的烈怒；但原文没有明说发怒者，因此正文不补出“耶和华的”。
- source_word: עַל הַשְּׁבוּעָה אֲשֶׁר נִשְׁבַּעְנוּ לָהֶם
  choice: 因我们向他们所起的誓
  rationale: עַל在此表示引发所忧后果的缘由；שׁבע的被动词干配合ל表示向某人起誓。此译法简明保留因果关系与受誓对象。
theological_decisions:
- issue: קֶצֶף是否应明确译为耶和华的烈怒
  choice: 正文只译“烈怒”，脚注说明很可能是神的烈怒
  alternative: 直接译作“耶和华的烈怒”或“神的烈怒”
  rationale: 本节原文没有明确出现耶和华或神作为发怒者。上下文虽强烈暗示神因违背誓言而降怒，译文仍应保留原文没有明说的空间。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“对待他们”比直译“向他们行”自然；“让他们活着”保留原文使役动词的宽度；用“烈怒”维持盟誓语境的严肃性，同时不在正文补出未明说的神圣主体。
