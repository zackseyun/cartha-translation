revisions:
- from: 以色列人没有击杀他们[a]，因为会众的首领已经指着雅威以色列的上帝向他们起了誓。于是全会众都向首领们发怨言。
  to: 以色列人没有攻击他们[a]，因为会众的首领已经指着雅威——以色列的上帝——向他们起了誓。于是全会众都向首领们发怨言。
  rationale: 将“击杀”改为“攻击”，避免把原文未明示的致死结果固定下来，同时保留本段军事冲突语境；并以破折号清楚标示“以色列的上帝”是对“雅威”的同位说明。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T05:20:41Z'
review_pass:
  verdict: revise
  source_fidelity: “击杀”将希伯来语 נכה 在此处可能包含、却未被动词本身明确限定的致死结果定得过死。结合拒绝对基遍人采取军事行动的语境，译为“攻击”能保留暴力行动及结果未明的范围。其余句法关系均与原文相符：首领是起誓者，誓言是向“他们”所立，并以雅威、以色列的上帝为誓。
  naturalness: “指着雅威以色列的上帝”缺少必要停顿，现代汉语容易误读。以破折号标示同位语后，句子更清楚自然。“向首领们发怨言”通顺，并准确表达抱怨所针对的对象。
  terminology: “雅威”恰当地保留 יהוה 的专名性质；“以色列的上帝”“会众”“首领”和“发怨言”均适合本段庄重叙事语域。
  issues:
  - severity: medium
    issue: “击杀他们”把 הִכּוּם 的结果限定为杀死。
    rationale: נכה 的基本义为击打、打击；本处军事语境可涉及致死行动，但原文没有明说“杀死”。译作“攻击他们”较能保留原文的语义幅度，脚注可说明“击打”及“击杀”的可能性。
  - severity: low
    issue: “雅威以色列的上帝”同位语边界不清。
    rationale: 原文中“雅威，以色列的上帝”是对神名的同位说明。以破折号处理可避免把它连读为不自然的名词串。
  revised_text: 以色列人没有攻击他们[a]，因为会众的首领已经指着雅威——以色列的上帝——向他们起了誓。于是全会众都向首领们发怨言。
  revised_footnotes:
  - marker: a
    text: “攻击”也可译作“击打”或“击杀”。原文动词在这里可指带来死亡的武力行动。
    reason: lexical_alternative
  revision_rationale: 将“击杀”改为“攻击”，避免把原文未明示的致死结果固定下来，同时保留本段军事冲突语境；并以破折号清楚标示“以色列的上帝”是对“雅威”的同位说明。
