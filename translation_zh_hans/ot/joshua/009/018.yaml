  text: וְ/לֹ֤א הִכּוּ/ם֙ בְּנֵ֣י יִשְׂרָאֵ֔ל כִּֽי נִשְׁבְּע֤וּ לָ/הֶם֙ נְשִׂיאֵ֣י הָֽ/עֵדָ֔ה בַּֽ/יהוָ֖ה אֱלֹהֵ֣י יִשְׂרָאֵ֑ל וַ/יִּלֹּ֥נוּ כָל הָ/עֵדָ֖ה עַל הַ/נְּשִׂיאִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/018.yaml
  text: But the sons of Israel did not strike them[a], because the leaders of the congregation had sworn to them by Yahweh, the God of Israel[c][b]. And all the congregation grumbled against the leaders.
translation:
  language: zh_hans
  text: 以色列人没有攻击他们[a]，因为会众的首领已经指着雅威——以色列的上帝——向他们起了誓。于是全会众都向首领们发怨言。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “攻击”也可译作“击打”或“击杀”。原文动词在这里可指带来死亡的武力行动。
    reason: lexical_alternative
lexical_decisions:
- source_word: הִכּוּם
  choice: 击杀他们
  rationale: נכה的基本义是“击打”，在本段涉及以色列是否对基遍人采取致命军事行动的语境中，可指击杀；“击杀”既体现暴力行动，也符合上下文，同时以脚注保留较宽泛的译法。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 希伯来语直译为“以色列的众子”，但这是指以色列民的惯用称呼；现代汉语用“以色列人”自然、准确，且不误导为仅限男性后裔。
- source_word: נְשִׂיאֵי הָעֵדָה
  choice: 会众的首领
  rationale: נְשִׂיאִים指群体中获承认的领袖；עֵדָה指聚集成共同体的会众。“会众的首领”简明且保留群体结构。
- source_word: נִשְׁבְּעוּ לָהֶם בַּיהוָה
  choice: 指着雅威……向他们起了誓
  rationale: שׁבע的尼法勒词干表示起誓，בְּ标明起誓所指的名；汉语“指着……向他们起誓”清楚表达誓言对象与受誓者。
- source_word: יְהוָה
  choice: 雅威
  rationale: 直接音译四字神名，以区别于称号“主”，并保留经文中的盟约名字。
- source_word: וַיִּלֹּנוּ
  choice: 发怨言
  rationale: 该动词在以色列群体叙事中常表示因不满而抱怨、埋怨；“发怨言”保留其群体性与负面语气，又符合庄重的现代汉语。
- source_word: עַל הַנְּשִׂיאִים
  choice: 向首领们
  rationale: עַל在此标示抱怨所针对的对象；与“发怨言”搭配时，“向……发怨言”比生硬的“反对……”更自然，并保留指向性。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文使用四字神名而非一般称号。音译“雅威”保留专名性质，不以称号替代，也不在有争议的传统形式之间作额外神学发挥。
- issue: עֵדָה 的共同体含义
  choice: 会众
  alternative: 全体；大会
  rationale: “会众”体现以色列作为聚集共同体的含义，但不把后期教会制度含义强加于文本。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“以色列人”处理希伯来惯用语“以色列的众子”；“会众”“首领”“起誓”“发怨言”保持叙事的公共与盟约语域。脚注标记紧跟存在词义幅度的“击杀他们”。
