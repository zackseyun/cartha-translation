source:
  edition: WLC
  text: וַ/יֹּאמְר֤וּ כָל הַ/נְּשִׂיאִים֙ אֶל כָּל הָ֣/עֵדָ֔ה אֲנַ֨חְנוּ֙ נִשְׁבַּ֣עְנוּ לָ/הֶ֔ם בַּֽ/יהוָ֖ה אֱלֹהֵ֣י יִשְׂרָאֵ֑ל וְ/עַתָּ֕ה לֹ֥א נוּכַ֖ל לִ/נְגֹּ֥עַ בָּ/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/019.yaml
  text: But all the leaders said to all the congregation[a], “We have sworn to them by Yahweh, the God of Israel, and now we cannot touch them.”
translation:
  language: zh_hans
  text: 众首领却对全会众说：“我们已经指着雅威—以色列的神—向他们起了誓，现在不能动他们[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“伤害他们”或“击打他们”；原文直译为“触碰他们”。
    reason: 说明נגע在此处可由字面“触碰”引申为动手伤害。
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: 却……说
  rationale: 前接会众对首领的抱怨，此处是首领的回应；用“却”自然表达语境中的转折，同时保留叙事推进。
- source_word: כָל הַנְּשִׂיאִים
  choice: 众首领
  rationale: נָשִׂיא在此指以色列群体中负治理责任的代表；“首领”准确、自然，也符合叙事语体。
- source_word: אֶל כָּל הָעֵדָה
  choice: 对全会众
  rationale: עֵדָה指以色列整体聚集的群体；“全会众”保留其集体和会议语境。
- source_word: נִשְׁבַּעְנוּ לָהֶם
  choice: 我们已经……向他们起了誓
  rationale: שׁבע的尼法勒式表示起誓；“已经”突出过去所起之誓在当前仍具约束力。
- source_word: בַּיהוָה אֱלֹהֵי יִשְׂרָאֵל
  choice: 指着雅威—以色列的神—
  rationale: 介词ב与“起誓”连用，表示以谁为起誓的凭据；破折号自然呈现“以色列的神”对“雅威”的同位说明。
- source_word: וְעַתָּה לֹא נוּכַל
  choice: 现在不能
  rationale: 该短语由誓言转到当前后果；יכל本义为“能够”，这里的不能也带有受誓言约束的伦理含义，但不在译文中额外解释。
- source_word: לִנְגֹּעַ בָּהֶם
  choice: 动他们
  rationale: נגע字面为“触碰”，在此语境指对他们下手或加害；汉语“动他们”既自然又保留了身体接触意象及含蓄的威胁意味。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名יהוה；“雅威”以音译保留其作为以色列之神专名的性质，而不将其改写为称号。
- issue: 誓言造成的“不能”属于能力还是道德约束
  choice: 保留为“不能”
  alternative: 不可；不该
  rationale: לֹא נוּכַל形式上表达“我们不能”，上下文则显示这种不能源于指着雅威所起之誓。译作“不能”保留能力表述与道德约束之间的张力，不将其单一化为禁令。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“众首领”“全会众”“起了誓”保持经文语体；“动他们”符合现代汉语习惯，并以脚注交代原文的字面意义和语境义。
