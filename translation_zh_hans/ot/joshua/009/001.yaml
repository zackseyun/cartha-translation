  text: וַ/יְהִ֣י כִ/שְׁמֹ֣עַ כָּֽל הַ/מְּלָכִ֡ים אֲשֶׁר֩ בְּ/עֵ֨בֶר הַ/יַּרְדֵּ֜ן בָּ/הָ֣ר וּ/בַ/שְּׁפֵלָ֗ה וּ/בְ/כֹל֙ ח֚וֹף הַ/יָּ֣ם הַ/גָּד֔וֹל אֶל מ֖וּל הַ/לְּבָנ֑וֹן הַֽ/חִתִּי֙ וְ/הָ֣/אֱמֹרִ֔י הַֽ/כְּנַעֲנִי֙ הַ/פְּרִזִּ֔י הַ/חִוִּ֖י וְ/הַ/יְבוּסִֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/001.yaml
  text: And it happened[a], when all the kings who were beyond the Jordan—in the hill country, in the lowland, and along the whole coast of the Great Sea toward Lebanon—the Hittite, the Amorite, the Canaanite, the Perizzite, the Hivite, and the Jebusite—heard of it[c][b],
translation:
  language: zh_hans
  text: 当约旦河那边[a]山区、低地[b]，以及朝黎巴嫩方向的大海沿岸各地的王——就是赫人、亚摩利人、迦南人、比利洗人、希未人和耶布斯人各族的王——听见这些事[c]时，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“约旦河对岸”。希伯来语这一说法会随观察者所在的位置而有不同指向。
    reason: lexical_alternative
  - marker: b
    text: 也可音译为“示非拉”，指西部山地与沿海平原之间的丘陵地带。
    reason: cultural_note
  - marker: c
    text: 原文没有明说“听见”的宾语；“这些事”是根据上下文补出的。本节的句子在下一节继续。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: 事情是这样
  rationale: 这是叙事段落开头的惯用结构，用现代汉语引出新一幕；同时保留下文由时间从句接续的句法走向。
- source_word: כִשְׁמֹעַ
  choice: 当……听见这些事以后
  rationale: 介词 כִּ 与不定式构成时间从句。原文没有明说“听见”的宾语，正文依据上下文补出“这些事”，并用脚注注明。
- source_word: אֲשֶׁר בְּעֵבֶר הַיַּרְדֵּן
  choice: 约旦河那边
  rationale: 保留 בְּעֵבֶר 的相对方位表达，不擅自限定为约旦河东岸或西岸。
- source_word: בָּהָר
  choice: 山区
  rationale: 此处指中央高地这一地理区域；“山区”比逐字译作“山上”更符合现代汉语地理表述。
- source_word: וּבַשְּׁפֵלָה
  choice: 低地
  rationale: 采用透明易懂的普通名称，同时在脚注说明这是特定的西部丘陵地带。
- source_word: וּבְכֹל חוֹף הַיָּם הַגָּדוֹל
  choice: 和大海整个沿岸
  rationale: חוֹף 指海岸，“整个沿岸”传达 כֹל 的范围；“大海”保留希伯来文对地中海的传统称呼。
- source_word: אֶל מוּל הַלְּבָנוֹן
  choice: 朝黎巴嫩方向一带
  rationale: 该短语表示相对于黎巴嫩的朝向或方位；此译法自然，同时不把边界关系说得过于精确。
- source_word: הַחִתִּי וְהָאֱמֹרִי הַכְּנַעֲנִי הַפְּרִזִּי הַחִוִּי וְהַיְבוּסִי
  choice: 赫人、亚摩利人、迦南人、比利洗人、希未人和耶布斯人的王
  rationale: 希伯来文以带定冠词的单数族名作集合称谓；汉语用各族名称并以“人的王”连接，使其与前面的“所有的王”形成清楚的同位说明。
