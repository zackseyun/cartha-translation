  text: וִ/יהוֹשֻׁ֨עַ֙ לֹֽא הֵשִׁ֣יב יָד֔/וֹ אֲשֶׁ֥ר נָטָ֖ה בַּ/כִּיד֑וֹן עַ֚ד אֲשֶׁ֣ר הֶחֱרִ֔ים אֵ֖ת כָּל יֹשְׁבֵ֥י הָ/עָֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/026.yaml
  text: And Joshua did not draw back his hand[a], which he had stretched out with the javelin, until he had devoted all the inhabitants of Ai to destruction.
translation:
  language: zh_hans
  text: 约书亚没有收回他那只持着短矛、伸出去的手，直到他将艾城所有的居民都尽行毁灭[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“将艾城所有的居民都彻底毁灭。”“尽行毁灭”所译的希伯来文动词带有将人或物置于禁令之下、归作毁灭的专门含义。
    reason: 说明חרם的专门含义，并提供自然的词义替代译法。
lexical_decisions:
- source_word: הֵשִׁיב
  choice: 收回
  rationale: 使役形在这里以“手”为宾语，指使伸出的手返回；“收回”符合现代汉语的战事语境。
- source_word: יָדוֹ
  choice: 他的手
  rationale: 保留原文明确的身体部位意象，不改写为抽象动作。
- source_word: נָטָה
  choice: 伸出去
  rationale: 表达将手伸出并保持在外的动作；与“收回”形成自然对应。
- source_word: בַּכִּידוֹן
  choice: 拿着短矛
  rationale: כידון指矛或投枪一类武器。“短矛”既保留武器类别，也避免现代汉语“枪”可能引起的火器联想；介词ב在此按伴随方式自然表达为“拿着”。
- source_word: הֶחֱרִים
  choice: 归于毁灭
  rationale: 该使役形不只表示一般杀灭，也带有将人或物置于禁令之下、指定为毁灭对象的专门含义。“归于毁灭”尽量保留这一层次，并以脚注说明。
- source_word: כָּל יֹשְׁבֵי הָעָי
  choice: 艾城所有居民
  rationale: 准确表达“艾的所有居住者”；补出“城”符合中文地名表达及上下文，且“居民”自然庄重。
- source_word: וִיהוֹשֻׁעַ
  choice: 约书亚
  rationale: 采用通行中文人名译法；本节独立呈现时不机械保留句首连接词，以符合现代汉语。
theological_decisions:
- issue: 战争审判语境中חרם的译法
  choice: 把艾城所有居民全都归于毁灭
  alternative: 把艾城所有居民彻底毁灭
  rationale: 所选译法保留חרם所含“置于禁令之下、指定为毁灭对象”的礼法与审判色彩，而不将其简化为普通的军事杀灭；脚注同时给出更直接的中文译法。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“拿着短矛伸出去的手”保留原文动作画面；“归于毁灭”略带法律和礼仪色彩，以承载原词的专门含义，脚注帮助普通读者理解。
