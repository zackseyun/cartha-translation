base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/016.yaml
  text: And all the people who were in the city were called out to pursue them[b][a], and they pursued Joshua and were drawn away from the city.
translation:
  language: zh_hans
  text: 城里所有的人都被召集来追赶他们[a]；他们就追赶约书亚，因而被引离了城[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“都呼喊起来，去追赶他们。”希伯来语动词也可指呼喊，但在这里更可能指众人被召集或被动员去追赶。
    reason: lexical_alternative
  - marker: b
    text: 或译：“与城隔开了”或“脱离了城”。希伯来语表示被拉开或分离；这里指追赶的人被引出，以致与城分开。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזָּעֲקוּ
  choice: 都被召集
  rationale: זעק 的尼法勒形在此军事语境中可表示“被召集、被动员”，不必只理解为“呼喊”。“被召集来”自然传达全城人员受召出动追赶的意思。
- source_word: כָּל הָעָם אֲשֶׁר בָּעִיר
  choice: 城里所有的人
  rationale: עָם 可指百姓、人群或兵众；译作“人”保留其宽泛性，不擅自限定为成年男子或军人。
- source_word: לִרְדֹּף אַחֲרֵיהֶם
  choice: 来追赶他们
  rationale: רדף אחרי 是“追赶、追击”的常见表达；“追赶”适合现代汉语叙事，并保留复数宾语“他们”。
- source_word: וַיִּרְדְּפוּ אַחֲרֵי יְהוֹשֻׁעַ
  choice: 他们就追赶约书亚
  rationale: 保留原文从复数宾语“他们”转而聚焦领袖约书亚的变化，也保持 רדף 前后用词一致。
- source_word: וַיִּנָּתְקוּ מִן הָעִיר
  choice: 因而被引离了城
  rationale: נתק 的尼法勒形含有被拉开、脱离或隔开的意思；结合诱敌出城的战术语境，“被引离了城”既自然，又表达他们与城分离的结果。
- source_word: יְהוֹשֻׁעַ
  choice: 约书亚
  rationale: 采用现代中文圣经传统中通行的人名译法。
