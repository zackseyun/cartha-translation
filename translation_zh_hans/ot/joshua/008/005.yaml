base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/005.yaml
  text: And I and all the people who are with me will approach the city[a]. And when they come out to meet us, as before[b], we will flee before them.
translation:
  language: zh_hans
  text: 我和所有跟我在一起的人要靠近那城[a]。他们像上次一样出来迎向我们时，我们就从他们面前逃跑。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“走近那城”。
    reason: lexical_alternative
lexical_decisions:
- source_word: נִקְרַב
  choice: 要靠近
  rationale: 该词为קרב的Qal未完成式第一人称复数，在作战部署中表示计划中的将来行动。“要靠近”自然地表达向城移动，又不额外说明战术意图。
- source_word: הָעָם
  choice: 所有……的人
  rationale: עם在此指跟随约书亚的一群人；保留宽泛的“人”，不把所指范围缩窄为“士兵”或“军队”。
- source_word: אֲשֶׁר אִתִּי
  choice: 跟我在一起的
  rationale: 按现代汉语习惯将关系从句置于中心语之前，清楚限定随同约书亚的众人。
- source_word: וְהָיָה כִּי
  choice: ……时
  rationale: 这是常见的希伯来语叙事时间结构；用时间从句自然引出随后发生的行动，避免生硬直译为“事情将是，当……”。
- source_word: יֵצְאוּ לִקְרָאתֵנוּ
  choice: 出来迎战我们
  rationale: יצא加לקראת表示出来迎面相遇；在攻城交战语境中，“迎战”自然体现敌对相向的行动，但不增添原文未说明的具体方式。
- source_word: כַּאֲשֶׁר בָּרִאשֹׁנָה
  choice: 像上次一样
  rationale: 该短语直指先前与艾城人的交锋；“像上次一样”符合现代汉语，也保留与第一次事件的比较。
- source_word: וְנַסְנוּ
  choice: 我们就……逃跑
  rationale: 该形式在连续行动中表达计划的将来行为。选择“逃跑”保留נוס较强的词义，也符合佯逃策略；“撤退”会弱化原词力度。
- source_word: לִפְנֵיהֶם
  choice: 从他们面前
  rationale: 与נוס连用时表示在对方面前逃离；这一译法既保留希伯来语的空间表达，也符合汉语习惯。
- source_word: וַאֲנִי וְכָל הָעָם
  choice: 我和所有……的人
  rationale: 汉语不必机械翻出句首连接词；以“我和……”自然承接上一节的战术指示，同时准确保留并列主语。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“靠近那城”“出来迎战”“从他们面前逃跑”保留军事叙事的动作感；句法按汉语时间顺序调整，但未消解原文的战术安排或扩大“众人”的范围。
