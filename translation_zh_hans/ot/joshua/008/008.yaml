base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/008.yaml
  text: And when you have taken the city[a], you shall set the city on fire. According to the word of Yahweh, you shall do. See, I have commanded you.
translation:
  language: zh_hans
  text: 你们攻下那城之后，要放火烧那城。你们要照着雅威的话行。[a] 你们看，我已经吩咐你们了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“要照着雅威的命令这样做。”希伯来文直译为“你们要照着雅威的话行”。
    reason: 词义可作语境性理解；正文保留“话”，脚注提供“命令”这一自然译法。
lexical_decisions:
- source_word: וְהָיָה כְּתָפְשְׂכֶם
  choice: 你们攻取……以后
  rationale: וְהָיָה连接后续行动，כְּ加动词形式在此表示时间情境；“攻取……以后”自然表达先攻下城、再纵火的动作次序。
- source_word: הָעִיר
  choice: 那城
  rationale: עִיר指叙事中已知的城；现代汉语在此用“那城”比重复使用“这座城”更简洁自然。
- source_word: תַּצִּיתוּ אֶת־הָעִיר בָּאֵשׁ
  choice: 要放火烧城
  rationale: יצת的使役形表示点燃、使着火；“放火烧城”保留使役含义，也符合现代汉语军事叙事的表达。
- source_word: כִּדְבַר יְהוָה
  choice: 照着雅威的话
  rationale: דָּבָר本义为“话、言语、事情”，此处可按语境理解为命令，但正文保留较贴近原文的“话”，不消除其语义张力。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见音译呈现四字神名，保留其作为专名的性质，不以称号替代。
- source_word: תַּעֲשׂוּ
  choice: 要……去做
  rationale: 未完成式在此具有指令功能；“要……去做”在现代汉语中直接清楚，同时不过度强化为额外的情态意义。
- source_word: רְאוּ
  choice: 看
  rationale: 保留原文引人注意的复数命令语气，表达简洁直接。
- source_word: צִוִּיתִי אֶתְכֶם
  choice: 我已经吩咐你们了
  rationale: 完成式指向已经发出的命令；“已经……了”自然体现该行动已经完成。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；译作“雅威”可保留其专名身份，而不以称号替代。
- issue: כִּדְבַר יְהוָה中דָּבָר的语义
  choice: 照着雅威的话
  alternative: 照着雅威的命令
  rationale: 上下文确有命令含义，但דָּבָר字面为“话”；正文保留较宽的原文措辞，并在脚注中说明语境性译法。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“攻取”“放火烧城”符合军事语境；保留“看”这一简短的提醒语，以传达原文直接的命令口吻。
