  text: וְ/כָל יִשְׂרָאֵ֡ל וּ/זְקֵנָ֡י/ו וְ/שֹׁטְרִ֣ים וְ/שֹׁפְטָ֡י/ו עֹמְדִ֣ים מִ/זֶּ֣ה וּ/מִ/זֶּ֣ה לָ/אָר֡וֹן נֶגֶד֩ הַ/כֹּהֲנִ֨ים הַ/לְוִיִּ֜ם נֹשְׂאֵ֣י אֲר֣וֹן בְּרִית יְהוָ֗ה כַּ/גֵּר֙ כָּֽ/אֶזְרָ֔ח חֶצְי/וֹ֙ אֶל מ֣וּל הַר גְּרִזִ֔ים וְ/הַֽ/חֶצְי֖/וֹ אֶל מ֣וּל הַר עֵיבָ֑ל כַּ/אֲשֶׁ֨ר צִוָּ֜ה מֹשֶׁ֣ה עֶֽבֶד יְהוָ֗ה לְ/בָרֵ֛ךְ אֶת הָ/עָ֥ם יִשְׂרָאֵ֖ל בָּ/רִאשֹׁנָֽה־׀׀׀׀־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/033.yaml
  text: And all Israel[a], with its elders, officers, and judges, was standing on this side and on that side of the ark, opposite the Levitical priests carrying the ark of the covenant of Yahweh, both the sojourner and the native-born alike. Half of them were in front of Mount Gerizim and half of them in front of Mount Ebal, just as Moses the servant of Yahweh had commanded at the first[b], to bless the people of Israel.
translation:
  language: zh_hans
  text: 以色列众人，包括他们的长老、官员和审判官，无论寄居者还是本地出生的人，都站在约柜两边，正对着抬着耶和华的约柜的利未祭司。一半人面向基利心山，另一半人面向以巴路山，正如耶和华的仆人摩西起初[b]所吩咐的那样，为以色列民祝福。
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 希伯来文直译为“在起初”；这句话可能指“作为最先做的事”，也可能回指摩西先前有关祝福的吩咐。
    reason: 保留בָּרִאשֹׁנָה在时间指向和句法关联上的歧义。
lexical_decisions:
- source_word: וְכָל יִשְׂרָאֵל
  choice: 以色列全体会众
  rationale: 这里指作为整体聚集的以色列群体；补出“会众”使现代汉语自然，也与后文站立、分成两半的场景相符。
- source_word: וּזְקֵנָיו וְשֹׁטְרִים וְשֹׁפְטָיו
  choice: 连同他们的长老、官长和审判官
  rationale: 后缀回指作为群体的以色列；“官长”体现行政职能，“审判官”明确司法角色。
- source_word: עֹמְדִים מִזֶּה וּמִזֶּה לָאָרוֹן
  choice: 都站在约柜两边
  rationale: 以简洁自然的汉语表达希伯来文“在这边和那边”的空间分布。
- source_word: נֶגֶד הַכֹּהֲנִים הַלְוִיִּם
  choice: 面对……利未祭司
  rationale: נֶגֶד在此表示相对而立、面向；“利未祭司”自然表达祭司的利未身份，同时保留原文可能理解为“祭司，就是利未人”的关系。
- source_word: נֹשְׂאֵי אֲרוֹן בְּרִית יְהוָה
  choice: 抬着耶和华圣约之柜
  rationale: 分词用“抬着”表达正在承担的动作；“圣约之柜”准确传达约柜与耶和华之约的关系，并避免连续两个“约柜”造成拗口。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代简体中文圣经语境中最广为人知的神名音译，作为对四字神名的直接呈现，而非用称号替代。
- source_word: כַּגֵּר כָּאֶזְרָח
  choice: 寄居者和本地人一视同仁
  rationale: 保留两种社会身份，并表达כ...כ...结构所强调的同等参与。
- source_word: חֶצְיוֹ ... וְהַחֶצְיוֹ
  choice: 一半人……另一半人
  rationale: 明确所指为聚集的人群，并自然呈现两组的对应关系。
- source_word: בָּרִאשֹׁנָה
  choice: 起初
  rationale: 直译保留其时间含义以及究竟指“首先所做”还是“先前所吩咐”的语义开放性，并以脚注说明。
- source_word: לְבָרֵךְ אֶת הָעָם יִשְׂרָאֵל
  choice: 要为以色列民祝福
  rationale: 不定式表达摩西命令的目的或内容；“为……祝福”保持原文结构而不补定祝福的执行者或具体方式。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。中文正文采用读者最熟悉且庄重的“耶和华”，保留其专名性质，不以“主”替代。
- issue: 寄居者与本地人的关系
  choice: 寄居者和本地人一视同仁
  alternative: 无论寄居者还是本地人
  rationale: 译文强调两类人在这次盟约礼仪中的同等参与，不将גֵּר扩大解释为所有意义上的外邦人，也不引入后期神学分类。
- issue: בָּרִאשֹׁנָה与祝福命令的关系
  choice: 起初所吩咐的，要为以色列民祝福
  alternative: 吩咐他们首先为以色列民祝福
  rationale: 希伯来语可指摩西先前的吩咐，也可指这项礼仪的首要行动；正文保留“起初”，脚注呈现歧义，避免擅自判定。
translation_notes:
  register: 采用现代、庄重而易懂的普通话书面语。“约柜”“利未祭司”“基利心山”“以巴路山”等沿用通行圣经专名；句式适度拆分，以清楚呈现会众的位置、身份和摩西的命令。所有脚注标记均已置于正文相应位置。
