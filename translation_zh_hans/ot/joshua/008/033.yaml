revisions:
- from: 以色列全体会众，连同他们的长老、官长和审判官，都站在约柜两边，面对抬着耶和华圣约之柜的利未祭司；寄居者和本地人一视同仁[a]。一半人面向基利心山，另一半人面向以巴路山，正如耶和华的仆人摩西起初[b]所吩咐的，要为以色列民祝福。
  to: 以色列众人，包括他们的长老、官员和审判官，无论寄居者还是本地出生的人，都站在约柜两边，正对着抬着耶和华的约柜的利未祭司。一半人面向基利心山，另一半人面向以巴路山，正如耶和华的仆人摩西起初[b]所吩咐的那样，为以色列民祝福。
  rationale: 修订将寄居者与本地出生者明确纳入站在约柜两边的全体以色列人之中，避免把类别并列误译为抽象的“一视同仁”原则。另以自然的中文圣经术语“耶和华的约柜”替换生硬的“耶和华圣约之柜”，并调整末句语序。原脚注a不再需要，因为正文已直接、准确地表达其身份类别和共同参与；脚注b保留以标示原文歧义。
