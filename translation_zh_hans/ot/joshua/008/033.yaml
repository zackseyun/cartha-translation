  terminology: “耶和华”“约柜”“利未祭司”“基利心山”“以巴路山”均为适切的通行圣经术语。将“官长”改为“官员”较贴合שֹׁטְרִים在行政／司法语境下的职称，也避免与“长老”及“审判官”混同。
