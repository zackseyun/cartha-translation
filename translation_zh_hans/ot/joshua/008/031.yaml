  naturalness: “完整石头”在现代普通话中宜作“完整的石头”；“坛”可用，但“祭坛”更清楚、庄重。“石头上未曾用过铁器”比“用铁器在这些石头上加工”更紧凑，并贴近“未在其上举起铁”的表达。
  terminology: “雅威”“以色列子孙”“燔祭”“平安祭”均可保留。“平安祭”的脚注说明宜限于该祭名的词义范围，不应把“与神相交”作为该词本身必然、排他的词汇含义。
