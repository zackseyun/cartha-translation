revisions:
- from: 正如雅威的仆人摩西吩咐以色列子孙的，也照《摩西律法书》上所写的，这是一座用完整石头[a]筑成的坛，未曾用铁器在这些石头上加工。他们在坛上向雅威献上燔祭，又献了平安祭[b]。
  to: 正如雅威的仆人摩西所吩咐以色列子孙的，照《摩西律法书》所写：这祭坛是用完整的石头[a]筑成的，石头上未曾用过铁器；他们在坛上向雅威献上燔祭，又献了平安祭[b]。
  rationale: 修订首句以冒号引出承接上节的“这祭坛”，使两个“依照命令／照书上所写”的限定语在中文中自然连贯；补足“的”，并以较简洁的措辞表达石头未受铁器加工。脚注保留可行译法，同时将平安祭的说明限定在词汇语义范围内。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T05:20:57Z'
review_pass:
