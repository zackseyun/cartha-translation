reference: Joshua 8:31
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כַּ/אֲשֶׁ֣ר צִוָּה֩ מֹשֶׁ֨ה עֶֽבֶד יְהוָ֜ה אֶת בְּנֵ֣י יִשְׂרָאֵ֗ל כַּ/כָּתוּב֙ בְּ/סֵ֨פֶר֙ תּוֹרַ֣ת מֹשֶׁ֔ה מִזְבַּח֙ אֲבָנִ֣ים שְׁלֵמ֔וֹת אֲשֶׁ֛ר לֹֽא הֵנִ֥יף עֲלֵי/הֶ֖ן בַּרְזֶ֑ל וַ/יַּעֲל֨וּ עָלָ֤י/ו עֹלוֹת֙ לַֽ/יהוָ֔ה וַֽ/יִּזְבְּח֖וּ שְׁלָמִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/031.yaml
  text: just as Moses the servant of Yahweh had commanded the sons of Israel[a], as it is written in the Book of the Law of Moses, an altar of whole stones, on which no iron tool had been wielded[b]; and they offered up burnt offerings on it to Yahweh and sacrificed peace offerings.
translation:
  language: zh_hans
  text: 正如雅威的仆人摩西所吩咐以色列子孙的，照《摩西律法书》所写：这祭坛是用完整的石头[a]筑成的，石头上未曾用过铁器；他们在坛上向雅威献上燔祭，又献了平安祭[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“未经凿削的石头”。希伯来原文是“完整的石头”，强调石头保持原状，没有用铁器加工。
    reason: lexical_alternative
  - marker: b
    text: “平安祭”也可译作“团契祭”或“福祉祭”。该词也含有团契、完整或福祉的语义，不仅指没有冲突的平安。
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּאֲשֶׁר צִוָּה
  choice: 正如……吩咐……的
  rationale: 表达行动与先前命令相符；汉语用“正如”保留比较、依照之意，并以“吩咐”自然表达צִוָּה。
- source_word: עֶבֶד יְהוָה
  choice: 雅威的仆人
  rationale: “仆人”适合摩西在此处的尊荣称号；将圣名יְהוָה音译为“雅威”，不以称号替代。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列子孙
  rationale: 保留希伯来语的家族—群体表达，同时是现代中文读者能够理解的圣经用语。
- source_word: בְּסֵפֶר תּוֹרַת מֹשֶׁה
  choice: 《摩西律法书》
  rationale: 保留“书”和“摩西律法”两项信息，并按中文书名习惯处理。
- source_word: מִזְבַּח אֲבָנִים שְׁלֵמוֹת
  choice: 一座用完整石头筑成的坛
  rationale: שְׁלֵמוֹת首先描写石头完整、保持原状；正文采用较贴近原词的“完整石头”，以脚注说明“未经凿削”的含义。
- source_word: לֹא הֵנִיף עֲלֵיהֶן בַּרְזֶל
  choice: 未曾用铁器在这些石头上加工
  rationale: 原文直译近于“未在其上举起铁”；这里以自然中文传达不得以铁器加工石头的意思，同时保留“铁器”和作用对象。
- source_word: וַיַּעֲלוּ עָלָיו עֹלוֹת
  choice: 他们在坛上向雅威献上燔祭
  rationale: “燔祭”准确指全部焚烧、使之上升的祭物；“献上”也呼应动词的上升含义。
- source_word: וַיִּזְבְּחוּ שְׁלָמִים
  choice: 又献了平安祭
  rationale: “平安祭”是中文圣经中稳定而易辨识的祭礼名称；脚注保留该词与相交、福祉相关的语义范围。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名；正文采用较接近通常学术重构读音的“雅威”，不以“主”替换神名。
- issue: בְּנֵי יִשְׂרָאֵל的群体与家族色彩
  choice: 以色列子孙
  alternative: 以色列人
  rationale: 选择“以色列子孙”以保留原文“儿子们／后裔”的家族性表达，而不把它仅仅化为民族称谓。
- issue: שְׁלָמִים的祭礼含义
  choice: 平安祭
  alternative: 团契祭；福祉祭
  rationale: 该词的含义不只是不发生冲突，也涉及完整、福祉及共同享用祭物；正文采用通行名称，脚注提示其更宽的语义范围。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。第31节在希伯来文句法上承接第30节所述的坛；为使单节阅读顺畅，以“这是一座……”明确承接，但不改变其所指。祭祀术语采用中文读者较熟悉的“燔祭”“平安祭”，并用脚注保存词义范围。
