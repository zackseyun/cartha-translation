  - severity: low
    issue: “完整石头”缺少结构助词
    rationale: 应作“完整的石头”，才合乎现代书面汉语。
  - severity: low
    issue: 平安祭脚注的“与神相交”超出本词在本节可直接断定的词汇说明
    rationale: 可说明该词也关联团契或福祉的语义，但不宜将特定神学解释写成该名称固有且确定的含义。
