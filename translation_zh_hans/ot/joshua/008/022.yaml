base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/022.yaml
  text: And these came out from the city to meet them[a], so that they were in the midst of Israel, these on one side and those on the other[b]; and they struck them down until he left for him not a survivor or a fugitive.
translation:
  language: zh_hans
  text: 那一队人也从城里出来，迎击艾城人；于是艾城人落在以色列人中间：以色列人一队在这边，一队在那边[a]。他们击杀艾城人，直到没有留下一个幸存者或逃脱者[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文作“这些在这边，那些在那边”，表示以色列人从两面把艾城人夹在中间。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文近似“直到他没有给他留下幸存者或逃脱者”。动词和代词均为单数，但所指未明说；按上下文，意思是以色列人没有让艾城一方留下任何幸存者或逃脱者。
    reason: textual_ambiguity
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: 那一队人也
  rationale: 保留指示词“这些人”的指示作用，并依上文明确指向先前提到、已经攻入城中的伏兵；“那一队人”在现代汉语叙事中更自然。
- source_word: יָצְאוּ מִן־הָעִיר
  choice: 从城里出来
  rationale: 准确表达 יצא 的基本意义，并符合伏兵由城内重返战场的叙事场景。
- source_word: לִקְרָאתָם
  choice: 迎击他们
  rationale: לִקְרָאת 可指“去迎向、去会合”；此处是交战语境，“迎击”自然传达敌对含义，而不额外说明具体战术。
- source_word: וַיִּהְיוּ לְיִשְׂרָאֵל בַּתָּוֶךְ
  choice: 于是艾城人落在以色列人中间
  rationale: 按上下文补出主语“艾城人”，并以“落在……中间”表达战局形成的结果；既保留 בַּתָּוֶךְ 的空间意象，也没有直接用“包围”取代原文措辞。
- source_word: אֵלֶּה מִזֶּה וְאֵלֶּה מִזֶּה
  choice: 以色列人一队在这边，一队在那边
  rationale: 这是表示两面夹击的对称说法。译文保留“这边／那边”的结构，同时用“一队”使汉语指代清楚。
- source_word: וַיַּכּוּ אוֹתָם
  choice: 他们击杀艾城人
  rationale: נכה 在战争叙事中可表示击打、击败或击杀；后文说明无人幸存或逃脱，因此“击杀”符合此处结果。按上下文将宾语明示为“艾城人”，避免连续代词造成歧义。
- source_word: עַד בִּלְתִּי הִשְׁאִיר לוֹ
  choice: 直到一个也没有留下
  rationale: 用自然汉语表达行动持续到无人留下的程度。希伯来文末句异常的单数动词和代词未在正文中生硬复制，而在脚注中保留其形式及指代歧义。
- source_word: שָׂרִיד וּפָלִיט
  choice: 无人幸存，也无人逃脱
  rationale: 分别呈现 שָׂרִיד“幸存者”和 פָלִיט“逃脱者”的语义，表达既无生还者也无逃走者。
