  text: רַ֣ק הַ/בְּהֵמָ֗ה וּ/שְׁלַל֙ הָ/עִ֣יר הַ/הִ֔יא בָּזְז֥וּ לָ/הֶ֖ם יִשְׂרָאֵ֑ל כִּ/דְבַ֣ר יְהוָ֔ה אֲשֶׁ֥ר צִוָּ֖ה אֶת יְהוֹשֻֽׁעַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/027.yaml
  text: Only the livestock and the spoil of that city Israel took as plunder for themselves[b][a], according to the word of Yahweh that he had commanded Joshua.
translation:
  language: zh_hans
  text: 以色列人只把那城的牲畜和战利品[a]掠为己有，照着雅威所吩咐约书亚的话。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “战利品”也可译作“掠夺物”，指战争中夺得的财物。
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: 不过……只
  rationale: 既承接上文所述的毁灭，又限定例外之物；用“不过……只”自然表达转折与限制。
- source_word: הַבְּהֵמָה
  choice: 牲畜
  rationale: 此处指作为战利品取得的家养动物；“牲畜”是现代汉语中自然的集合称谓。
- source_word: וּשְׁלַל
  choice: 和战利品
  rationale: שָׁלָל指战争中夺得的财物；“战利品”清楚保留军事语境。
- source_word: הָעִיר הַהִיא
  choice: 那城的
  rationale: 自然表达定冠词与指示词所具有的特指意义。
- source_word: בָּזְזוּ
  choice: 夺来
  rationale: בזז意为掠夺、夺取；与“战利品”搭配时，“夺来”可避免汉语中“掠夺战利品”的生硬重复。
- source_word: לָהֶם
  choice: 归自己
  rationale: 表达利益与占有意义，说明以色列人把这些东西留作己有。
- source_word: יִשְׂרָאֵל
  choice: 以色列人
  rationale: 此处是集体性的民族主语；汉语用“以色列人”比单用地名更明确自然。
- source_word: כִּדְבַר
  choice: 照……的话
  rationale: 表示他们的行动符合先前的命令，同时保留דָּבָר“话、言语”的表达。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来语四字神名的常见现代汉语音译处理，保留其专名性质，不以称号替代。
- source_word: אֲשֶׁר צִוָּה אֶת יְהוֹשֻׁעַ
  choice: 吩咐约书亚
  rationale: 关系从句修饰“话”；汉语合并为“雅威吩咐约书亚的话”，简洁且准确。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；采用“雅威”作为较贴近学术重构读音的现代汉语音译，同时不把专名改为“主”等称号。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“不过……只”承接上文并突出例外；整体语序依照汉语习惯调整，同时保留原文关于所得之物、归属和遵命而行的重点。
