  text: וְ/עָשִׂ֨יתָ לָ/עַ֜י וּ/לְ/מַלְכָּ֗/הּ כַּ/אֲשֶׁ֨ר עָשִׂ֤יתָ לִֽ/ירִיחוֹ֙ וּ/לְ/מַלְכָּ֔/הּ רַק שְׁלָלָ֥/הּ וּ/בְהֶמְתָּ֖/הּ תָּבֹ֣זּוּ לָ/כֶ֑ם שִׂים לְ/ךָ֥ אֹרֵ֛ב לָ/עִ֖יר מֵ/אַחֲרֶֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/002.yaml
  text: And you shall do to Ai and its king as you did to Jericho and its king[a]. Only its spoil and its livestock you may plunder for yourselves[b]. Set an ambush for yourself behind the city.
translation:
  language: zh_hans
  text: 你要怎样对待艾城和它的王，也要怎样对待耶利哥和它的王。只是艾城的战利品和牲畜，你们可以掠取归自己所有[a]。你要在城的后方设下伏兵[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你们要掠取归自己所有。”这里的希伯来文形式可按一般将来陈述理解，也可理解为授权性的指令；正文译作“可以”，以表达这与耶利哥的战利品不可私取形成的对比。
    reason: lexical_alternative
  - marker: b
    text: “伏兵”也可译作“埋伏”或“执行伏击的队伍”。希伯来文的单数形式既可指伏击这一部署，也可集合性地指伏击的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: 你要对……
  rationale: 带连接词的第二人称阳性单数完成式在此承接上文，具有指令意味；“你要”自然表达上帝对约书亚的吩咐。
- source_word: לָעַי וּלְמַלְכָּהּ
  choice: 对艾城和它的王
  rationale: 保留介词所表达的处置对象；“艾城”采用现代中文圣经地名的通行形式。
- source_word: כַּאֲשֶׁר עָשִׂיתָ לִירִיחוֹ וּלְמַלְכָּהּ
  choice: 像你对耶利哥和它的王一样
  rationale: 按希伯来文比较结构直译，同时使现代汉语句式流畅。
- source_word: רַק
  choice: 只是
  rationale: 标明艾城与耶利哥之事之间的例外或限制，保留原文的转折和限定作用。
- source_word: שְׁלָלָהּ
  choice: 城里的战利品
  rationale: 指战争中夺取的财物；补出“城里的”自然表达阴性单数后缀所指的艾城，而不改变所指。
- source_word: וּבְהֶמְתָּהּ
  choice: 和牲畜
  rationale: בְּהֵמָה 在此指作为财产的家畜，“牲畜”比泛称“动物”更准确。
- source_word: תָּבֹזּוּ לָכֶם
  choice: 你们可以夺来归自己所有
  rationale: 第二人称阳性复数转向约书亚所率的众人；未完成式在语境中可表达授权，也可理解为指令或将来陈述，正文以“可以”突出与耶利哥禁令的对照，并用脚注保留另一种读法。
- source_word: שִׂים לְךָ אֹרֵב
  choice: 你要……设下伏兵
  rationale: 命令式针对约书亚；אֹרֵב 可指伏击本身，也可集合性地指执行伏击的人。“设下伏兵”是自然、庄重的军事表达。
- source_word: מֵאַחֲרֶיהָ
  choice: 在城的后方
  rationale: 阴性后缀回指艾城；“后方”清楚表达空间位置，又避免让“城后”被误解为时间先后。
theological_decisions:
- issue: 艾城战利品是否仅被预告将遭掠夺，还是获准归以色列人所有
  choice: 译作“你们可以夺来归自己所有”，表达许可和授权
  alternative: “你们要夺来归自己所有”或“你们必夺来归自己所有”
  rationale: תָּבֹזּוּ 形式本身可承载将来、指令或许可意味；结合 רַק 所引出的例外，以及耶利哥战利品先前被禁止私取的背景，许可意味较为突出，但不应把其他语法可能性隐去。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。保留从单数“你”（约书亚）转为复数“你们”（参战众人）的变化；避免古奥的“掳物”“掠物”等表达，并以脚注保存希伯来文动词语气及 אֹרֵב 所指范围的真实歧义。
