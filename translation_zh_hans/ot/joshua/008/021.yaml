  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וִ/יהוֹשֻׁ֨עַ וְ/כָֽל יִשְׂרָאֵ֜ל רָא֗וּ כִּֽי לָכַ֤ד הָֽ/אֹרֵב֙ אֶת הָ/עִ֔יר וְ/כִ֥י עָלָ֖ה עֲשַׁ֣ן הָ/עִ֑יר וַ/יָּשֻׁ֕בוּ וַ/יַּכּ֖וּ אֶת אַנְשֵׁ֥י הָ/עָֽי־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/021.yaml
  text: When Joshua and all Israel saw that the ambush had captured the city and that the smoke of the city had gone up[a], they turned back and struck down the men of Ai.
translation:
  language: zh_hans
  text: 约书亚和以色列众人看见伏兵[a]已经攻占了城，又看见城中的烟升了起来，就转身击杀艾城的人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “伏兵”直译为“埋伏者”；希伯来语使用单数分词，在这里可作集合称谓，指埋伏的部队。
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאוּ
  choice: 看见
  rationale: 保留具体的视觉叙事含义；后面的两个כִּי从句说明他们所看见的事。
- source_word: כִּי ... וְכִי
  choice: 看见……又看见……
  rationale: 两处连词在这里引出“看见”的内容。汉语重复“看见”比直译为“看见……并且……”更自然，也清楚呈现两个观察内容。
- source_word: לָכַד
  choice: 已经攻占
  rationale: 该动词表示夺取、占领；“已经”体现这事发生在约书亚和以色列人看见之前，而“攻占”符合军事语境。
- source_word: הָאֹרֵב
  choice: 伏兵
  rationale: 阳性单数分词在此作集合称谓，指埋伏的部队；“伏兵”简洁自然，并保留军事叙事色彩。
- source_word: הָעִיר
  choice: 城
  rationale: 按上下文指艾城；原文两次使用带定冠词的同一名词，译文也保留重复所带来的清晰度。
- source_word: עָלָה עֲשַׁן הָעִיר
  choice: 城中的烟升了起来
  rationale: 保留原文烟向上升起的具体画面；“城中的烟”在现代汉语中比“城的烟”自然。
- source_word: וַיָּשֻׁבוּ
  choice: 就转身
  rationale: 在战斗情境中表示改变行进方向、回头迎战；“转身”准确而生动。
- source_word: וַיַּכּוּ
  choice: 击杀
  rationale: נכה在战争叙事中常指以致命武力击打；“击杀”传达其强烈的军事含义，同时不扩写战斗细节。
- source_word: אַנְשֵׁי הָעָי
  choice: 艾城的人
  rationale: 原文直指“艾的人”；“艾城的人”在汉语中明确自然，不擅自把范围缩窄为“战士”。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。用“以色列众人”表达כָל יִשְׂרָאֵל，用“艾城”使中文地名指称清楚；句式保留原文先看见两个迹象、随后转身攻击的推进次序。
