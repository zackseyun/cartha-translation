  text: וְ/אֶת מֶ֧לֶךְ הָ/עַ֛י תָּלָ֥ה עַל הָ/עֵ֖ץ עַד עֵ֣ת הָ/עָ֑רֶב וּ/כְ/ב֣וֹא הַ/שֶּׁמֶשׁ֩ צִוָּ֨ה יְהוֹשֻׁ֜עַ וַ/יֹּרִ֧ידוּ אֶת נִבְלָת֣/וֹ מִן הָ/עֵ֗ץ וַ/יַּשְׁלִ֤יכוּ אוֹתָ/הּ֙ אֶל פֶּ֨תַח֙ שַׁ֣עַר הָ/עִ֔יר וַ/יָּקִ֤ימוּ עָלָי/ו֙ גַּל אֲבָנִ֣ים גָּד֔וֹל עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/029.yaml
  text: And he hanged the king of Ai on a tree until evening[a]. And at sunset Joshua commanded, and they took his corpse down from the tree and threw it at the entrance of the city gate[b], and they raised over him a large heap of stones that remains to this day.
translation:
  language: zh_hans
  text: 约书亚把艾城王挂在一棵树上，直到傍晚[a]。日落时，约书亚下令，人们就把王的尸体从树上取下来，扔到城门口，又在他的尸体上堆起一大堆石头；那石堆留存至今。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “挂”也可译作“悬挂”。希伯来语只说明把他吊挂起来，并未具体说明处死方式。
    reason: lexical_alternative
lexical_decisions:
- source_word: תָּלָה
  choice: 挂
  rationale: 该动词意为“悬挂、吊起”。“挂”贴近原文，又不擅自断定具体处死方式。
- source_word: הָעֵץ
  choice: 一棵树
  rationale: עֵץ通常指“树”或“木头”。这里译作“一棵树”符合普通汉语表达，同时保留原文的基本意象；原文也可能泛指木制悬挂设施。
- source_word: עַד עֵת הָעָרֶב
  choice: 直到傍晚
  rationale: 准确表达持续到傍晚这一时间界限，简洁自然。
- source_word: וּכְבֹא הַשֶּׁמֶשׁ
  choice: 日落时
  rationale: 这是希伯来语表示太阳落下的惯用语；“日落时”在现代汉语中自然明确。
- source_word: נִבְלָתוֹ
  choice: 王的尸体
  rationale: נְבֵלָה指死尸。“尸体”保留原文直白而严峻的语气；重复“王”可避免汉语代词指向含混。
- source_word: וַיַּשְׁלִיכוּ אֹתָהּ
  choice: 扔
  rationale: 该动词表示投掷、扔下；“扔”准确保留动作的粗暴直接。
- source_word: פֶּתַח שַׁעַר הָעִיר
  choice: 城门口
  rationale: 原文直译为“城门的入口”。“城门口”是现代汉语中简洁自然的对应说法。
- source_word: גַּל אֲבָנִים גָּדוֹל
  choice: 一大堆石头
  rationale: גַּל指堆或垒，常用于石堆；此译清楚通俗，并保留其规模。
- source_word: עַד הַיּוֹם הַזֶּה
  choice: 留存至今
  rationale: 原文是“直到今日”的叙事套语。补出“留存”体现希伯来语省略谓语所表达的持续存在。
theological_decisions:
- issue: 开头分句的施事者
  choice: 明确译为“约书亚”
  alternative: 译作“他”或“人们”
  rationale: 希伯来语使用第三人称阳性单数动词而未明说主语；上下文中最自然的所指是约书亚。明说姓名可消除汉语中的指代含混，但不把后续实际执行命令的人与约书亚混为一谈。
- issue: 悬挂是否说明处死方式
  choice: 使用中性的“挂”，不译作“绞死”或“刺穿”
  alternative: 绞死；刺穿
  rationale: תָּלָה只说明悬挂或吊起，不能单凭本节确定王是被绞死、被刺穿，还是死后陈尸示众，因此保留原文的含混。
translation_notes:
  register: 采用庄重而通俗的现代标准汉语。叙事动作依次展开，避免古奥词语；“尸体”“扔”保留原文严峻直接的语气。
