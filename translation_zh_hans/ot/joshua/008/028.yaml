  yaml_path: translation/ot/joshua/008/028.yaml
  text: So Joshua burned Ai and made it a permanent mound[a], a desolation to this day.
translation:
  language: zh_hans
  text: 于是，约书亚焚烧了艾城，使它成为长久的丘堆[a]、荒凉之地，直到今日。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“永远的丘堆”。希伯来语“长久”（עוֹלָם）可指极长或未限定的一段时间，常译作“永远”或“永恒”；“丘堆”（תֵּל）可指废城遗址形成的土丘或瓦砾堆。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׂרֹף
  choice: 焚烧了
  rationale: שׂרף明确指用火烧；“焚烧”自然、庄重，也符合攻城叙事语境。
- source_word: הָעָי
  choice: 艾城
  rationale: 按现代中文圣经地名惯例音译为“艾”，并加“城”以清楚表明所指地点。
- source_word: וַיְשִׂימֶהָ
  choice: 使它成为
  rationale: שׂים连同阴性单数宾语后缀，在此表达使某物处于随后所述状态；“使它成为”保留结果意义。
- source_word: תֵּל
  choice: 废墟
  rationale: תֵּל可指废城遗址形成的土丘或瓦砾堆；中文“废墟”最自然地传达此处城市被毁后的遗迹状态，但具体的“丘堆”意象在脚注中保留。
- source_word: עוֹלָם
  choice: 永久的
  rationale: עוֹלָם在此表示长久、无定期延续的状态；“永久的”符合上下文，同时以脚注保留“永远的”这一较直译可能。
- source_word: שְׁמָמָה
  choice: 荒凉
  rationale: 该名词表示荒废、毁坏后的无人状态；用“荒凉”与前面的“废墟”形成互补，而不把两者合并。
- source_word: עַד הַיּוֹם הַזֶּה
  choice: 直到今日
  rationale: 准确保留这一固定希伯来语表达，说明这种状况持续到叙述者所处的时代。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事文体。“于是”承接前文行动；保留“荒凉直到今日”的希伯来语句法张力，并以脚注说明 תֵּל 与 עוֹלָם 的词义范围。
