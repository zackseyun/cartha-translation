  yaml_path: translation/ot/joshua/008/023.yaml
  text: But they captured the king of Ai alive and brought him to Joshua[a].
translation:
  language: zh_hans
  text: 他们却活捉了艾城的王，把他带到约书亚那里。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们活捉了艾城的王，把他带到约书亚那里。”
    reason: 连接词 וְ 可按上下文译作带有轻微转折意味的“却”，也可理解为一般的叙事顺承；汉语中也可不译出。
lexical_decisions:
- source_word: וְ/אֶת
  choice: 却
  rationale: וְ 在叙事中承接下一行动；结合前文杀戮的背景，“却”自然地凸显艾城王没有被当场杀死。原文也可单纯理解为顺承。
- source_word: מֶלֶךְ הָעַי
  choice: 艾城王
  rationale: 该结构意为“艾的王”。现代汉语圣经叙事中，“艾城王”简洁自然，也明确“艾”是城名。
- source_word: תָּפְשׂוּ חָי
  choice: 活捉
  rationale: תָּפְשׂוּ 表示抓住、擒获，חָי 表明被擒时仍活着；“活捉”准确而凝练地表达军事语境中的组合含义。
- source_word: וַיַּקְרִבוּ אֹתוֹ אֶל יְהוֹשֻׁעַ
  choice: 把他带到约书亚那里
  rationale: קרב 的使役式表示使之靠近、带近，אֶל 指明目的地；此译法符合现代汉语表达，并保留被带到约书亚跟前的方向含义，不额外加入审判或正式呈交的意味。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而清晰的叙事体。“活捉”避免生硬地译成“捉住……活着”；“带到约书亚那里”比“使他靠近约书亚”更自然，同时忠实表达原文方向。
