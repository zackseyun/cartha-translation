language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֤ה אֶל יְהוֹשֻׁ֨עַ֙ אַל תִּירָ֣א וְ/אַל תֵּחָ֔ת קַ֣ח עִמְּ/ךָ֗ אֵ֚ת כָּל עַ֣ם הַ/מִּלְחָמָ֔ה וְ/ק֖וּם עֲלֵ֣ה הָ/עָ֑י רְאֵ֣ה נָתַ֣תִּי בְ/יָדְ/ךָ֗ אֶת מֶ֤לֶךְ הָ/עַי֙ וְ/אֶת עַמּ֔/וֹ וְ/אֶת עִיר֖/וֹ וְ/אֶת אַרְצֽ/וֹ־־־־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/001.yaml
  text: Then Yahweh said to Joshua[a], “Do not fear and do not be dismayed. Take with you all the fighting men, and arise, go up to Ai. See, I have given into your hand the king of Ai, his people, his city, and his land.”
translation:
  language: zh_hans
  text: 耶和华对约书亚说：“不要害怕，也不要惊惶。你要带着全体作战人员[a]，起来，上到艾城去。看，我已经把艾城的王、他的百姓、他的城和他的地都交在你手中了。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“全体战士”。希伯来文直译为“战争的全体民众”，在此指作战队伍。
    reason: 说明该军事集合表达的字面结构及其语境所指，同时提供自然的替代译法。
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的专名“耶和华”译出四字神名，不以“主”这一称号替代。
- source_word: אַל תִּירָא וְאַל תֵּחָת
  choice: 不要害怕，也不要惊惶
  rationale: 两个并列禁令均予保留；“惊惶”表达 חתת 在此处因受挫而胆怯、丧胆的强烈意味，同时保持庄重自然。
- source_word: קַח עִמְּךָ
  choice: 你要带上
  rationale: “带上”自然体现 עִמְּךָ“与你同去”的意思，并保留命令语气。
- source_word: כָּל עַם הַמִּלְחָמָה
  choice: 所有作战的人
  rationale: 该短语直译近于“所有战争之民”，上下文所指是参战人员；此译法既清楚，又不把原文强行限定为一个制度化的常备军。
- source_word: וְקוּם עֲלֵה
  choice: 起来，上……去
  rationale: 保留两个连续命令及其推进感；“上艾城去”也反映 עָלָה 的方向表达。
- source_word: הָעָי
  choice: 艾城
  rationale: 采用现代中文圣经中通行的地名译法，并加“城”使汉语表达自然；其城市属性也由本节后文明确。
- source_word: רְאֵה
  choice: 看
  rationale: 保留引出神圣保证的命令词，简洁而不古奥。
- source_word: נָתַתִּי בְיָדְךָ
  choice: 我已经把……交在你手中了
  rationale: 以“已经”体现完成式所表达的确定性，以“交在你手中”保留希伯来语关于支配权和胜利的手之隐喻。
- source_word: עַמּוֹ וְאֶת עִירוֹ וְאֶת אַרְצוֹ
  choice: 他的百姓、他的城和他的地
  rationale: 各单数第三人称阳性后缀依其语法先行词“艾城的王”译作“他的”，并保留原文逐项列举。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威；主
  rationale: 原文直接使用神的专名，因此正文采用中文传统且广为人知的专名“耶和华”，而不以称号“主”代替；“雅威”是另一种可能的音译。
- issue: 神以完成式宣告尚待实现的得胜
  choice: 我已经把……交在你手中了
  alternative: 我要把……交在你手中
  rationale: 保留 נָתַתִּי 的完成式及神谕中对结果确定性的表达，不将其单纯改写为未来时；同时不据此额外展开某种神学体系。
- issue: כָּל עַם הַמִּלְחָמָה 所指群体
  choice: 所有作战的人
  alternative: 所有战士；全军
  rationale: 该表达指参与战斗的群体。原词 עַם 本身不是明确表示男性的名词，因此不在正文额外加入“男人”，也不将其制度化为“军队”；脚注保留较直译和集合式译法。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。命令句简洁有力；保留“起来，上……去”和“交在你手中”等希伯来语意象，同时借助自然汉语语序避免生硬直译。
