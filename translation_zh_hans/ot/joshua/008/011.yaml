  text: וְ/כָל הָ/עָ֨ם הַ/מִּלְחָמָ֜ה אֲשֶׁ֣ר אִתּ֗/וֹ עָלוּ֙ וַֽ/יִּגְּשׁ֔וּ וַ/יָּבֹ֖אוּ נֶ֣גֶד הָ/עִ֑יר וַֽ/יַּחֲנוּ֙ מִ/צְּפ֣וֹן לָ/עַ֔י וְ/הַ/גַּ֖י בינ/ו וּ/בֵין הָ/עָֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/011.yaml
  text: And all the fighting people who were with him went up and approached[a], and they came before the city and camped north of Ai, with the valley between him and Ai.
translation:
  language: zh_hans
  text: 所有与约书亚在一起的作战人员都上去了，靠近，来到城前，在艾城北面安营；山谷在他[a]和艾城之间。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文作“在他和艾城之间”。这个单数代词很可能指约书亚；也有人按集体意义理解为“在他们和艾城之间”。
    reason: 保留原文单数代词的真实歧义，并帮助读者识别其可能所指。
lexical_decisions:
- source_word: כָל הָעָם הַמִּלְחָמָה
  choice: 所有……作战人员
  rationale: 该短语直译近于“所有战争之民”，指参与作战的群体。“作战人员”自然清楚，并避免加入希伯来文没有明确表达的男性限定。
- source_word: אֲשֶׁר אִתּוֹ
  choice: 和约书亚在一起的
  rationale: 关系从句说明这些作战人员随同约书亚；中文补出明确所指，使句意自然。
- source_word: עָלוּ
  choice: 上去了
  rationale: 保留עלה的基本方向意义“上去”，不将其过度解释为一般性的“进军”。
- source_word: וַיִּגְּשׁוּ
  choice: 渐渐逼近
  rationale: נגשׁ表示靠近；结合军事场景译作“逼近”，而“渐渐”使连续接近城邑的动作在中文中更顺畅。
- source_word: וַיָּבֹאוּ נֶגֶד הָעִיר
  choice: 来到城前
  rationale: נֶגֶד表示在对面或面前；“来到城前”简洁自然，并未暗示他们已经进城。
- source_word: וַיַּחֲנוּ מִצְּפוֹן לָעַי
  choice: 在艾城北面安营
  rationale: 准确表达相对于艾城的方位以及安营的动作。
- source_word: הַגַּי
  choice: 山谷
  rationale: גַּי可指谷地或峡谷；“山谷”是普通读者易懂且不过度具体的表达。
- source_word: בֵּינוֹ וּבֵין הָעָי
  choice: 在他和艾城之间
  rationale: 保留马所拉文本第三人称阳性单数后缀的较难读法，不在正文中擅自改为复数“他们”。
theological_decisions:
- issue: בֵּינוֹ中单数代词的所指
  choice: 正文保留“他”，脚注说明很可能指约书亚
  alternative: 按集体意义译作“他们”
  rationale: 原文明确使用单数后缀；虽然语境可能按军队整体理解，但译文应保存文本中的数差异和由此产生的歧义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事文体；以“作战人员”表达军队群体，不添加男性限定；保留连续动作和原文单数代词的张力。
