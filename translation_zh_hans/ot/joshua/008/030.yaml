  text: אָ֣ז יִבְנֶ֤ה יְהוֹשֻׁ֨עַ֙ מִזְבֵּ֔חַ לַֽ/יהוָ֖ה אֱלֹהֵ֣י יִשְׂרָאֵ֑ל בְּ/הַ֖ר עֵיבָֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/030.yaml
  text: Then Joshua built an altar to Yahweh[a], the God of Israel, on Mount Ebal.
translation:
  language: zh_hans
  text: 那时，约书亚在以巴路山上为雅威[a]——以色列的神——筑了一座祭坛。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文是“YHWH”（יהוה），这里音译为“雅威”。
    reason: 说明原文使用的是神的专名，并交代译名依据。
lexical_decisions:
- source_word: אָז
  choice: 那时
  rationale: 表示叙事中的时间推进；“那时”自然地承接上文，又不额外强调事件之间的因果关系。
- source_word: יִבְנֶה
  choice: 筑了
  rationale: 虽然词形是未完成式，但在 אָז 之后具有过去叙事功能；汉语用“筑了”清楚表达已经发生的事件。
- source_word: יְהוֹשֻׁעַ
  choice: 约书亚
  rationale: 采用现代中文圣经读者熟悉的标准人名译法。
- source_word: מִזְבֵּחַ
  choice: 一座祭坛
  rationale: 该名词指献祭所用的坛；“祭坛”比单说“坛”更明确，“一座”符合汉语首次提及具体可数事物的表达。
- source_word: לַיהוָה
  choice: 为雅威
  rationale: 介词 ל 在这里表示祭坛的归属或奉献对象；“为”符合现代汉语习惯。神名 יְהוָה 音译为“雅威”，保留专名性质。
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: 以色列的神
  rationale: 忠实表达希伯来语属格结构，并作为“雅威”的同位说明。
- source_word: בְּהַר עֵיבָל
  choice: 在以巴路山上
  rationale: בְּ 表示地点；“在……山上”是自然且准确的现代汉语表达。“以巴路”采用通行地名译法。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名。译作“雅威”保留其专名性质，并较接近通常重建的读音；脚注交代希伯来文形式，避免把它仅当作称号。
- issue: אֱלֹהֵי יִשְׂרָאֵל 与神名的关系
  choice: 用破折号保留同位说明：“雅威——以色列的神——”
  alternative: “以色列的神雅威”
  rationale: 原文先给出神名，再以“以色列的神”加以说明。破折号既保持原有次序，也避免现代汉语把相邻成分误读为一个冗长名称。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“筑”与“祭坛”符合历史叙事语体，又容易理解；破折号清楚呈现同位关系。
