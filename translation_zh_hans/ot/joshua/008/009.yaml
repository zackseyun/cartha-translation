base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/009.yaml
  text: So Joshua sent them[a], and they went to the ambush and stayed between Bethel and Ai, west of Ai. And Joshua spent that night among the people.
translation:
  language: zh_hans
  text: 约书亚派他们去；他们便前往埋伏处[a]，驻扎在伯特利和艾城之间，就是在艾城西边。那一夜，约书亚在众民中间过夜。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“伏兵”。希伯来语可指埋伏的队伍，也可指埋伏的位置；这里的语境较支持后者。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלָחֵם
  choice: 约书亚派他们去
  rationale: שׁלח在这里表示差派人前往；“派他们去”准确、自然，并保留宾语“他们”。
- source_word: הַמַּאְרָב
  choice: 埋伏处
  rationale: 该名词既可指伏兵，也可指埋伏的位置；本节描述他们前往并驻留于某一地理位置，语境较支持“埋伏处”，同时以脚注保留另一可能。
- source_word: וַיֵּשְׁבוּ
  choice: 驻扎
  rationale: ישׁב基本义为坐下、居留或停留；在军事叙事中，“驻扎”自然表达他们占据并留守该位置，但不额外说明战术细节。
- source_word: בֵּין בֵּית־אֵל וּבֵין הָעַי
  choice: 在伯特利和艾城之间
  rationale: 直接表达两地之间的地理位置；地名采用现代中文圣经中通行的译名。
- source_word: מִיָּם לָעָי
  choice: 艾城西边
  rationale: יָם字面为“海”，在希伯来地理方位表达中常指西方；译成“西边”传达实际方向。
- source_word: וַיָּלֶן
  choice: 住
  rationale: לון指过夜或住宿；与“那一夜”连用时，“住在”简洁自然，已包含留宿过夜之意。
- source_word: בְּתוֹךְ הָעָם
  choice: 在众民中间
  rationale: בְּתוֹךְ表示处于一个群体之中；“在众民中间”保留原文的空间和群体意味，语体庄重而清楚。
