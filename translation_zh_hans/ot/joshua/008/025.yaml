  yaml_path: translation/ot/joshua/008/025.yaml
  text: And all who fell that day[a], from man to woman, were twelve thousand—all the people of Ai.
translation:
  language: zh_hans
  text: 那一天倒毙的人，从男到女，共有一万二千人，即艾城所有的人[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“艾城所有的男人”；这里也可理解为“艾城所有的居民”，即用集合称谓指全城人口。
    reason: 说明希伯来语性别化集合称谓的字面形式及语境含义。
lexical_decisions:
- source_word: וַיְהִי
  choice: 共有
  rationale: 这里的叙事形式引出结果性的统计总结；用“共有”自然表达希伯来语系词在本句中的总计作用，避免生硬译成“事情是”。
- source_word: כָל הַנֹּפְלִים
  choice: 倒毙的
  rationale: נפל字面为“倒下”；在战事语境中指死亡者。“倒毙的”既保留原文意象，也清楚表达其死亡含义。
- source_word: בַּיּוֹם הַהוּא
  choice: 那一天
  rationale: 准确、自然地表达这一标准时间短语。
- source_word: מֵאִישׁ וְעַד אִשָּׁה
  choice: 从男到女
  rationale: 保留原文“从……到……”的范围表达及其涵盖全体的力量，同时符合现代汉语。
- source_word: שְׁנֵים עָשָׂר אָלֶף
  choice: 一万二千人
  rationale: 直接表达原文数目，并补出汉语计人数所需的量词。
- source_word: כֹּל אַנְשֵׁי הָעָי
  choice: 艾城所有的人
  rationale: אַנְשֵׁי字面可作“男人”，但此处紧接明确包含男女的统计总结，作为城邑人口的集合称谓理解最合语境；脚注保留其字面形式及可能译法。
theological_decisions:
- issue: 伤亡总结中的性别用语与集合称谓
  choice: 正文译作“从男到女”及“艾城所有的人”
  alternative: “从男人到女人”及“艾城所有的男人”
  rationale: 前一句明确把男性和女性都包括在内，因此末尾的אַנְשֵׁי הָעָי在此最可能是指艾城全体居民的集合表达。正文不把它限定为男性，同时用脚注说明其字面形式，以保留原文用语所具有的张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“倒毙”适合战事语境；“从男到女”保留原文范围结构；“也就是”清楚标示末句与一万二千人的同位说明关系。
