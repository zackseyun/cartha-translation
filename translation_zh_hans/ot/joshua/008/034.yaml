base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/034.yaml
  text: And afterward he read all the words of the law[a], the blessing and the curse[b], according to all that is written in the Book of the Law.
translation:
  language: zh_hans
  text: '此后，他把律法[b]的一切话，就是祝福和咒诅，都照着律法书上所写的宣读[a]了。


    [a]“宣读”也可译作“朗读”或“宣告”；这里的希伯来语动词可指当众朗读或宣告。


    [b]“律法”所译的希伯来语词是“妥拉”（torah），也可指“教导”；这里是盟约文书的语境，因此译作“律法”。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “宣读”也可译作“朗读”或“宣告”；这里的希伯来语动词可指当众朗读或宣告。
    reason: lexical_alternative
  - marker: b
    text: “律法”所译的希伯来语词是“妥拉”（torah），也可指“教导”；这里是盟约文书的语境，因此译作“律法”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַֽחֲרֵי כֵן
  choice: 此后
  rationale: 简洁自然地表达前后相继，并保留叙事承接关系。
- source_word: קָרָא
  choice: 宣读
  rationale: 该动词以“律法的一切话”为宾语，在此场景中指公开朗读或宣告；“宣读”兼顾阅读行为和公开性质。
- source_word: אֶת כָּל דִּבְרֵי הַ/תּוֹרָה
  choice: 律法的一切话
  rationale: 保留דִּבְרֵי“话、言语”的具体表达；תּוֹרָה虽可指“教导”，但在盟约文书语境中译作“律法”较合适。
- source_word: הַ/בְּרָכָה וְ/הַ/קְּלָלָה
  choice: 祝福和咒诅
  rationale: 忠实保留两个单数名词所概括的盟约祝福与咒诅类别，不增添原文没有的“条款”等解释。
- source_word: כְּ/כָל הַ/כָּתוּב
  choice: 全都照着……所写的
  rationale: 表达宣读内容完全符合书面文本这一关系，同时使现代汉语流畅自然。
- source_word: בְּ/סֵפֶר הַ/תּוֹרָה
  choice: 律法书上
  rationale: סֵפֶר在此指书面文献；“律法书”是清楚、自然且符合上下文的译法。
