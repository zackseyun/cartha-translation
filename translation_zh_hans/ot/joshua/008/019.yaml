base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/019.yaml
  text: Then the ambush rose quickly from its place and ran as soon as he stretched out his hand; they entered the city[a], captured it, and quickly set the city on fire.
translation:
  language: zh_hans
  text: 伏兵迅速从原处起身；他一伸手，他们就跑进城去[a]，攻取了城，随即放火烧城。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他伸手的时候，他们跑进城去。”希伯来文结构标明约书亚发出信号的时刻，也可译出较一般的时间关系。
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאוֹרֵב
  choice: 埋伏的人
  rationale: 该分词在此集合性地指埋伏的队伍；译作“埋伏的人”既明确指人，也能自然衔接后面的复数动作。
- source_word: קָם מְהֵרָה מִמְּקוֹמוֹ
  choice: 迅速从藏身之处起来
  rationale: קום表示起身行动，מְהֵרָה表示迅速；מָקוֹם本义为地点，此处按埋伏语境译为“藏身之处”，使现代汉语自然清楚。
- source_word: וַיָּרֻצוּ
  choice: 他们就跑
  rationale: 采用“跑”的基本义，并以“他们”体现希伯来文由集合单数转为按成员表达的复数动词。
- source_word: כִּנְטוֹת יָדוֹ
  choice: 他一伸手
  rationale: כ加不定式结构在此标示动作发生的时刻并带有紧接之意；“一……就……”自然传达信号发出后立即行动。代词所指由上下文判定为约书亚，但正文保留原文的代词表达。
- source_word: וַיָּבֹאוּ הָעִיר
  choice: 跑进城去
  rationale: בוא加目的地表示进入城中；与前面的“跑”合译为“跑进城去”，避免汉语重复而保留动作方向。
- source_word: וַיִּלְכְּדוּהָ
  choice: 攻取了城
  rationale: לכד用于城邑时常指军事上的攻取、占领；重复“城”比使用可能指代不清的“它”更符合汉语叙事。
- source_word: וַיְמַהֲרוּ
  choice: 赶紧
  rationale: 保留动词所强调的迅速行动，并以副词形式自然修饰下一动作。
- source_word: וַיַּצִּיתוּ אֶת הָעִיר בָּאֵשׁ
  choice: 放火烧城
  rationale: יצת的使役形表示点燃；“放火烧城”是自然现代汉语，也传达בָּאֵשׁ所明示的用火焚烧。
