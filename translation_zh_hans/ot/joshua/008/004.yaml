  text: And he commanded them, saying, “Look, you are to lie in ambush against the city, behind the city. Do not go very far from the city, and all of you must be ready.”
translation:
  language: zh_hans
  text: 他吩咐他们说：“看，你们要在城后埋伏，伏击这城。不要离城太远，你们都要准备好。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רְאוּ
  choice: 看
  rationale: 保留命令式提示语的直接力度，用现代汉语自然的“看”引出后面的部署。
- source_word: אֹרְבִים לָעִיר
  choice: 埋伏，伏击这城
  rationale: “埋伏”表达所处状态，“伏击这城”表达针对目标，兼顾希伯来语分词及介词结构。
- source_word: מֵאַחֲרֵי הָעִיר
  choice: 在城后
  rationale: 按空间意义直译，说明伏兵相对于城的位置。
- source_word: נְכֹנִים
  choice: 准备好
  rationale: 此处指随时可以执行行动，用现代标准汉语“准备好”准确自然。
