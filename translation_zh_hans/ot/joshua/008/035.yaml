base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/035.yaml
  text: There was not a word of all that Moses commanded that Joshua did not read before all the assembly of Israel[a], and the women, the little children[e][d][c][b], and the sojourner who walked among them.
translation:
  language: zh_hans
  text: 摩西所吩咐的一切话，约书亚没有一句不在以色列全体会众、妇女、孩童和住在他们中间的寄居者面前宣读。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דָבָר
  choice: 话
  rationale: 在摩西的吩咐和约书亚公开宣读的语境中，“话”自然保留了可被宣读的言语内容，也符合“不漏一句”的汉语表达。
- source_word: צִוָּה
  choice: 吩咐
  rationale: “吩咐”体现摩西指示的权威性，又是现代中文圣经叙事中自然、庄重的用语。
- source_word: קָרָא
  choice: 宣读
  rationale: 上下文是向聚集的百姓公开诵读律法；“宣读”兼顾“读出”和公开宣布的语义。
- source_word: נֶגֶד
  choice: 当着……
  rationale: “当着”自然表达在全体听众面前公开宣读，比直译“在……前面”更符合现代汉语。
- source_word: קְהַל
  choice: 全体会众
  rationale: “会众”表达正式聚集的群体；配合 כָּל 译作“全体”，保留范围的完整性。
- source_word: הַנָּשִׁים
  choice: 妇女
  rationale: 原文明确列出妇女，译文不将其隐没在“全体会众”之中。
- source_word: הַטַּף
  choice: 孩子
  rationale: טַף 指幼小的孩子或受抚养者；“孩子”在现代中文中自然明白，同时避免把年龄范围限定得过窄。
- source_word: הַגֵּר
  choice: 寄居者
  rationale: “寄居者”保留 גֵּר 作为居住在以色列群体中的外来居民这一社会身份，不只是偶然出现的陌生人。
- source_word: הַהֹלֵךְ בְּקִרְבָּם
  choice: 住在他们中间的
  rationale: “行走在……中间”在此表示身处并生活于群体之中；正文采用自然汉语“住在”，脚注保留较直译的可能。
- source_word: לֹא הָיָה ... אֲשֶׁר לֹא
  choice: 没有一句是……没有……的
  rationale: 保留希伯来文双重否定的强调结构，同时在中文中仍然清楚，突出约书亚毫无遗漏地宣读了一切吩咐。
theological_decisions:
- issue: 盟约教导公开宣读的对象范围
  choice: 明确列出以色列全体会众、妇女、孩子和寄居者
  alternative: 只概括为“全以色列”
  rationale: 原文明列妇女、孩子和寄居者，译文保留这种明确的群体包容范围，不把他们隐含在笼统称谓中。
- issue: 约书亚宣读内容的完整性
  choice: 以双重否定表达没有遗漏任何一句
  alternative: 正面改写为“约书亚把一切话都宣读了”
  rationale: 双重否定既传达全部宣读的意义，也保留原文强调性的修辞张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“宣读”适合公开诵读律法的场景；保留双重否定以体现原文的强调，但调整语序使中文通顺。
