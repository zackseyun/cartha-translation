  text: וַ/יָּשִׂ֨ימוּ הָ/עָ֜ם אֶת כָּל הַֽ/מַּחֲנֶ֗ה אֲשֶׁר֙ מִ/צְּפ֣וֹן לָ/עִ֔יר וְ/אֶת עֲקֵב֖/וֹ מִ/יָּ֣ם לָ/עִ֑יר וַ/יֵּ֧לֶךְ יְהוֹשֻׁ֛עַ בַּ/לַּ֥יְלָה הַ/ה֖וּא בְּ/ת֥וֹךְ הָ/עֵֽמֶק־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/013.yaml
  text: So the people positioned the whole camp that was north of the city[a], with its rear west of the city[b], and Joshua went that night into the midst of the valley.
translation:
  language: zh_hans
  text: 于是，众人把全营部署在城北，营的后部[a]在城西[b]；约书亚当夜走到谷地中央。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“营的后卫”。
    reason: 原词字面与“脚跟”有关，可指后部，也可能在军事语境中指后卫。
  - marker: b
    text: 希伯来文直译为“在城的海那边”；“海”在这里用作方位词，意思是“西”。
    reason: 说明原文以“海”表示西方的希伯来语方位习惯。
lexical_decisions:
- source_word: וַיָּשִׂימוּ
  choice: 部署
  rationale: שׂים的基本义是“放置、安置”；在军事布阵的语境中，“部署”自然表达有意安排位置的动作，又不额外说明具体阵形。
- source_word: הָעָם
  choice: 众人
  rationale: 原文用的是“民、众人”，而不是专指“军队”的词；“众人”既保留其宽泛措辞，也符合此处作战人员的语境。
- source_word: כָּל הַמַּחֲנֶה
  choice: 全营
  rationale: מַחֲנֶה可指营地或驻营的人马；“全营”简洁保留כָּל所表达的整体范围。
- source_word: אֲשֶׁר מִצְּפוֹן לָעִיר
  choice: 在城北
  rationale: 该关系从句说明全营的位置；汉语用“在城北”即可自然、准确地表达。
- source_word: עֲקֵבוֹ
  choice: 营的后部
  rationale: עָקֵב本义与“脚跟”有关，可引申为后部或后方；“营的后部”保留空间意义，不把它确定为一支专门的后卫部队。
- source_word: מִיָּם לָעִיר
  choice: 在城西
  rationale: יָם本义为“海”，在希伯来语方位表达中常指西方；此处译为“城西”最清楚自然。
- source_word: וַיֵּלֶךְ
  choice: 走到
  rationale: הלך是常用的“走、去”；与后面的地点短语结合，译作“走到”可自然表达朝谷地中央移动。
- source_word: בַּלַּיְלָה הַהוּא
  choice: 当夜
  rationale: “当夜”准确而凝练地表达“那一夜”，并适合叙事文体。
- source_word: בְּתוֹךְ הָעֵמֶק
  choice: 谷地中央
  rationale: בְּתוֹךְ表示“在……中间、进入……之中”，עֵמֶק指谷地；在移动动词之后，“走到谷地中央”自然呈现其方向性。
theological_decisions: []
