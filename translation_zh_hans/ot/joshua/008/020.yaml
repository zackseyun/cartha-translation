base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/020.yaml
  text: Then the men of Ai turned behind them and looked[a], and behold, the smoke of the city was going up to the sky, and there was no power in them to flee this way or that[c][b]. And the people who had fled to the wilderness turned back against the pursuer.
translation:
  language: zh_hans
  text: 艾城的人转身向后看，只见城的烟升上天空[a]；他们无力向这边或那边逃跑[b]。那些先前逃往旷野的人转过身来，迎战追赶他们的人[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“向着天空”，也可译作“升到天上”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来语字面为“他们里面没有双手”，是说他们没有力量或能力逃脱。
    reason: cultural_note
  - marker: c
    text: 原文用单数“追赶者”，这里可能是集合用法，指追赶他们的军队。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְנוּ ... אַחֲרֵיהֶם וַיִּרְאוּ
  choice: 转身向后看
  rationale: 分别体现“转身”和“看”两个动作，又以自然的现代汉语连贯表达其先后关系。
- source_word: אַנְשֵׁי הָעַי
  choice: 艾城的人
  rationale: 原文直译为“艾的人”；结合军事场景，可指艾城出战的人，但原词并不只说“士兵”，故采用较宽泛的表达。
- source_word: וְהִנֵּה
  choice: 只见
  rationale: 传达突然注意到眼前情形的叙事功能，比“看哪”更符合现代汉语叙事，同时保留醒目感。
- source_word: עָלָה עֲשַׁן הָעִיר הַשָּׁמַיְמָה
  choice: 城里的烟直冲天空
  rationale: “直冲”自然传达烟向上升腾的动态；“天空”避免把此处空间方向误解为神学意义上的天堂。
- source_word: וְלֹא הָיָה בָהֶם יָדַיִם
  choice: 他们无力
  rationale: 希伯来语字面为“他们里面没有双手”，是指没有能力采取行动；“无力”准确而简洁。
- source_word: לָנוּס הֵנָּה וָהֵנָּה
  choice: 向这边或那边逃跑
  rationale: 保留原文成对的方向表达，强调无论往哪个方向都无法逃脱。
- source_word: וְהָעָם הַנָּס הַמִּדְבָּר
  choice: 那先前逃往旷野的民众
  rationale: 定冠词分词指按先前行动识别的一群人；“先前”明确他们此前佯退、此刻反向行动的时序。
- source_word: נֶהְפַּךְ אֶל הָרוֹדֵף
  choice: 转过身来，迎战追赶他们的人
  rationale: נֶהְפַּךְ表达方向逆转；战斗语境中的אֶל带有敌对指向，译作“迎战”比单纯“朝向”更清楚。单数“追赶者”以汉语集合性表达“追赶他们的人”保留其形式上的开放性。
theological_decisions: []
