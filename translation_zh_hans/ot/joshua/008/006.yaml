  text: וְ/יָצְא֣וּ אַחֲרֵ֗י/נוּ עַ֣ד הַתִּיקֵ֤/נוּ אוֹתָ/ם֙ מִן הָ/עִ֔יר כִּ֣י יֹֽאמְר֔וּ נָסִ֣ים לְ/פָנֵ֔י/נוּ כַּ/אֲשֶׁ֖ר בָּ/רִֽאשֹׁנָ֑ה וְ/נַ֖סְנוּ לִ/פְנֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/006.yaml
  text: And they will come out after us until we have drawn them away from the city[a], for they will say[b], ‘They are fleeing before us as at the first,’ and we will flee before them.
translation:
  language: zh_hans
  text: 他们必出来追赶我们，直到我们把他们从城里引开[a]，因为他们会说：‘他们像上一次那样，正在从我们面前逃跑[b]。’我们就从他们面前逃跑。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“直到我们把他们诱离城。”原文动词有拉开、使脱离的意思；“诱离”更明确地表达这里的战术。
    reason: lexical_alternative
  - marker: b
    text: “上一次”指以色列人先前在艾城前败退的事（见约书亚记7:4–5）。
    reason: cross_reference
lexical_decisions:
- source_word: וְיָצְאוּ אַחֲרֵינוּ
  choice: 他们必出来追赶我们
  rationale: 在约书亚陈述作战计划的语境中，连词加完成式表达预期将发生的行动；“追赶我们”自然传达 אַחֲרֵינוּ 在军事语境中的追击含义。
- source_word: עַד הַתִּיקֵנוּ אֹתָם מִן־הָעִיר
  choice: 直到我们把他们从城里引开
  rationale: נתק 的使役式表示拉开、使脱离；“引开”既保留使其离城的基本意义，也符合设伏战术的语境，但不直接强化为“诱骗”。
- source_word: כִּי יֹאמְרוּ
  choice: 因为他们会说
  rationale: כִּי 在此说明敌人继续追赶的原因；“因为”在现代汉语中清楚自然。
- source_word: נָסִים לְפָנֵינוּ
  choice: 他们在我们面前逃跑了
  rationale: 分词 נָסִים 描绘正在逃跑的动作；汉语直接引语中用“逃跑了”自然呈现敌人对眼前局势的判断。
- source_word: כַּאֲשֶׁר בָּרִאשֹׁנָה
  choice: 像上一次那样
  rationale: 该短语指先前以色列人在艾城前败退的事件；“上一次”比“起初”更准确地表达特定的前次交战。
- source_word: וְנַסְנוּ לִפְנֵיהֶם
  choice: 我们就要在他们面前逃跑
  rationale: 在作战计划中，连词加完成式表示接下来的预定行动；保留“在他们面前”以呼应前一句的 לְפָנֵינוּ。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的军事叙事用语。“引开”兼顾原文词义与上下文；两处“在……面前逃跑”保留原文的平行表达。
