revisions:
- from: 他们必出来追赶我们，直到我们把他们从城里引开[a]，因为他们会说：‘他们像上一次那样在我们面前逃跑了[b]。’我们就要在他们面前逃跑。
  to: 他们必出来追赶我们，直到我们把他们从城里引开[a]，因为他们会说：‘他们像上一次那样，正在从我们面前逃跑[b]。’我们就从他们面前逃跑。
  rationale: 修订仅调整进行体和“从……面前逃跑”的汉语惯用表达，既保留原文两处平行的 לִפְנֵי 结构及作战计划的将来指向，也使直接引语所描绘的即时情状更准确。脚注内容与锚点均保留。
