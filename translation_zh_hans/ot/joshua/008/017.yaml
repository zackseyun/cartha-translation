base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/017.yaml
  text: And not a man was left in Ai or Bethel who did not go out after Israel[b][a], and they left the city open and pursued Israel.
translation:
  language: zh_hans
  text: 艾城和伯特利没有留下任何一个没有出来追赶以色列人的人[a]；他们把城敞开着[b]，追赶以色列人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “任何一个……人”所译的希伯来语是阳性单数形式 אִישׁ；这里在否定结构中泛指任何留下的人。
    reason: lexical_alternative
  - marker: b
    text: 或较意译作“让城无人防守”。希伯来文直译为“把城敞开着”。
    reason: lexical_alternative
lexical_decisions:
- source_word: נִשְׁאַר אִישׁ
  choice: 没有留下一个人
  rationale: 保留被动动词“留下”和 אִישׁ 的单数形式，同时在现代汉语中自然表达无人留守的意思。
- source_word: בָּעַי וּבֵית אֵל
  choice: 艾城和伯特利
  rationale: 否定范围覆盖两个地点；汉语以“和”连接，并将 עַי 依通行圣经地名译作“艾城”，בֵית אֵל 译作“伯特利”。
- source_word: אֲשֶׁר לֹא יָצְאוּ אַחֲרֵי יִשְׂרָאֵל
  choice: 不出来追赶以色列人
  rationale: 保留关系分句及“出来”的移动意象，并按军事语境将 אַחֲרֵי 表达为“追赶”。
- source_word: וַיַּעַזְבוּ
  choice: 他们把……
  rationale: 结合后面的宾语补足结构译出“使之处于某状态”的自然汉语句式；其离弃之义由整句“把城敞开着”体现。
- source_word: הָעִיר פְּתוּחָה
  choice: 把城敞开着
  rationale: 贴近 פְּתוּחָה“敞开的”具体意象，不在正文中直接解释为“无人防守”。
- source_word: וַיִּרְדְּפוּ אַחֲרֵי יִשְׂרָאֵל
  choice: 去追赶以色列人
  rationale: רדף 在军事叙事中自然译为“追赶”；“去”衔接前面的离城行动。
