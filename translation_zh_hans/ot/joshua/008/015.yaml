  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יִּנָּֽגְע֛וּ יְהוֹשֻׁ֥עַ וְ/כָל יִשְׂרָאֵ֖ל לִ/פְנֵי/הֶ֑ם וַ/יָּנֻ֖סוּ דֶּ֥רֶךְ הַ/מִּדְבָּֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/015.yaml
  text: And Joshua and all Israel let themselves be beaten before them and fled by the way of the wilderness[a][b].
translation:
  language: zh_hans
  text: 约书亚和以色列众人在他们面前佯装败退[a]，沿着通往旷野的路逃跑[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“被他们击败”。从上下文看，这很可能是一次佯败，为要把艾城的人从城里引出来。
    reason: lexical_alternative
  - marker: b
    text: 或译：“取道旷野逃跑”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּנָּגְעוּ
  choice: 佯装败退
  rationale: 该词在这里是军事语境中的尼法勒式，可表示“被击败、败退”。结合本章明确的伏击计策，此处呈现的是故意显出败退的样子；译作“佯装败退”自然地表达叙事语境，但脚注保留单纯被动理解。
- source_word: לִפְנֵיהֶם
  choice: 在他们面前
  rationale: 贴近原文的空间表达，也适合双方交战的场景；“他们”在上下文中指艾城的人。
- source_word: וַיָּנֻסוּ
  choice: 逃跑
  rationale: נוּס通常指逃走、逃跑。此处虽是诱敌行动，正文仍保留原词所呈现的“逃跑”，不直接改译为较具解释性的“撤退”。
- source_word: דֶּרֶךְ הַמִּדְבָּר
  choice: 沿着通往旷野的路
  rationale: דֶּרֶךְ可指道路或路线；此译在现代汉语中自然，并将该短语理解为通向旷野的道路。原文也可理解为取道旷野，故以脚注保留。
- source_word: יְהוֹשֻׁעַ וְכָל יִשְׂרָאֵל
  choice: 约书亚和以色列众人
  rationale: 保留“以色列”这一集体称谓，同时以“众人”使现代汉语表达自然，并避免让“全以色列”被误解为毫无语境限制的全国人口。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“佯装败退”体现上下文中的诱敌计策，但不把计策细节扩写进正文；脚注保留原动词可作普通被动式理解的歧义。所有脚注标记均已置于正文相应位置。
