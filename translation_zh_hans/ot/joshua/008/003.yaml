base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/003.yaml
  text: So Joshua and all the fighting people rose to go up against Ai[a], and Joshua chose thirty thousand men, mighty men of valor[c][b], and sent them out by night.
translation:
  language: zh_hans
  text: 于是，约书亚和全体作战人员都动身上艾城去[a]。约书亚挑选了三万名英勇善战的人，在夜间派他们出去。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “上艾城去”也可译作“上去攻打艾城”。原文保留了“上去”的方向性表达；上下文表明这是敌对的军事行动。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: 动身
  rationale: 该动词在这里引出行动；结合后面的“上……去”，译作“动身”比逐字译作“起来”更符合现代汉语叙事，同时不把它过度解释为已经抵达。
- source_word: כָל עַם הַמִּלְחָמָה
  choice: 全体作战人员
  rationale: 原文直译为“所有战争之民”。“全体作战人员”既保留集合意义和军事职能，也比“所有战争之民”自然，且不必将其制度化地限定为正规军。
- source_word: לַעֲלוֹת הָעָי
  choice: 上艾城去
  rationale: 保留 עלה 的上行表达及目的地结构；上下文显然带有军事意图，但正文不直接改译为“攻打”，以免消除原文措辞的空间和方向色彩。
- source_word: הָעָי
  choice: 艾城
  rationale: 采用现代中文圣经中这一地名的通行译法；“城”使中文读者清楚这是此处所指的城邑。
- source_word: וַיִּבְחַר
  choice: 挑选
  rationale: 准确表达“选择、选出”，并适合从大队人员中选出特定人选的军事语境。
- source_word: שְׁלֹשִׁים אֶלֶף אִישׁ
  choice: 三万名……的人
  rationale: 保留原文明确的数目和对人员的称呼，不把 אִישׁ 另行解释为某种特定军衔或编制。
- source_word: גִּבּוֹרֵי הַחַיִל
  choice: 英勇善战的人
  rationale: 这一军事用语指勇猛、有能力的战士。“英勇善战”以自然现代汉语兼顾勇气与战斗能力，避免使用古奥表达。
- source_word: וַיִּשְׁלָחֵם לָיְלָה
  choice: 连夜派他们出发
  rationale: שלח 是“派出、差遣”，לילה 作时间状语。“连夜”简洁表达夜间派遣的行动；“出发”明确他们被派离约书亚而去。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而清楚的叙事语体。“全体作战人员”保留原文 עַם 的群体意味；“英勇善战的人”避免仿古套语。句子分为两句，使连续军事行动在现代汉语中更清晰。
