  text: וַ/יְהִ֞י כִּ/רְא֣וֹת מֶֽלֶךְ הָ/עַ֗י וַֽ/יְמַהֲר֡וּ וַ/יַּשְׁכִּ֡ימוּ וַ/יֵּצְא֣וּ אַנְשֵֽׁי הָ/עִ֣יר לִ/קְרַֽאת יִ֠שְׂרָאֵל לַֽ/מִּלְחָמָ֞ה ה֧וּא וְ/כָל עַמּ֛/וֹ לַ/מּוֹעֵ֖ד לִ/פְנֵ֣י הָֽ/עֲרָבָ֑ה וְ/הוּא֙ לֹ֣א יָדַ֔ע כִּֽי אֹרֵ֥ב ל֖/וֹ מֵ/אַחֲרֵ֥י הָ/עִֽיר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/014.yaml
  text: And it happened[a], when the king of Ai saw it, that they hurried and rose early, and the men of the city went out to meet Israel for battle, he and all his people, at the appointed place before the Arabah. But he did not know that an ambush was against him behind the city.
translation:
  language: zh_hans
  text: 艾城王一看见这情形，城里的人就急忙早起，出城迎战以色列；他和他的全体民众到了亚拉巴前面的约定地点[a]。他却不知道，城后有伏兵在等着对付他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “亚拉巴”也可译作“旷野平原”。这个希伯来词既可指亚拉巴地区，也可泛指干旱的平原或草原。
    reason: 保留 הָעֲרָבָה 可作地名或普通地貌名称的词义差异。
lexical_decisions:
- source_word: וַיְהִי כִּרְאוֹת
  choice: 一看见
  rationale: כִּרְאוֹת 表示时间关系，可译为“当……看见时”或“一看见”。中文叙事无需机械译出 וַיְהִי；“一看见”自然表达事件随即发生的语气。原文宾语省略，中文也可不补“这情形”。
- source_word: וַיְמַהֲרוּ וַיַּשְׁכִּימוּ
  choice: 他们就赶紧早起
  rationale: 两个动词均为复数，保留“他们”，不改成单数的王；“赶紧早起”兼顾行动急迫和 שׁכם 的清早起身之意。
- source_word: אַנְשֵׁי הָעִיר
  choice: 城里的男子
  rationale: אַנְשֵׁי 字面指“男子们”；在军事语境中译为“城里的男子”比泛称“城里的人”更准确。
- source_word: לִקְרַאת יִשְׂרָאֵל לַמִּלְחָמָה
  choice: 出城迎战以色列
  rationale: לִקְרַאת 本义为“迎向”，后接“为要争战”，合译“迎战”简洁自然，并保留敌对的军事语境。
- source_word: הוּא וְכָל עַמּוֹ
  choice: 王和他的全体民众
  rationale: הוּא 回指艾城王；עַם 是“民众、人民”，虽处于军事情境，原文并未明确说“军队”，故不窄化为“全军”。
- source_word: לַמּוֹעֵד
  choice: 按约定
  rationale: מוֹעֵד 可指约定的时间或地点。“按约定”在中文中保留这两种可能，不强行限定为“约定之处”。
- source_word: לִפְנֵי הָעֲרָבָה
  choice: 来到亚拉巴前面
  rationale: הָעֲרָבָה 可作地理名称“亚拉巴”，לִפְנֵי 保留为“前面”；另有普通地貌名词“旷野平原”的理解，列入脚注。
- source_word: אֹרֵב לוֹ מֵאַחֲרֵי הָעִיר
  choice: 城后有伏兵要对付他
  rationale: אֹרֵב 指埋伏者或伏兵；לוֹ 表明伏兵针对王。“要对付他”自然表达敌对指向而不额外规定具体袭击方式。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。保留复数主语“他们”及“王和他的全体民众”的结构，不将“民众”擅自改为“军队”；用“按约定”保存时间与地点之间的原文歧义。
