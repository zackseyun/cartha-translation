revisions:
- from: 艾城王一看见，他们就赶紧早起；城里的男子出城迎战以色列。王和他的全体民众按约定来到亚拉巴前面[a]。他却不知道，城后有伏兵要对付他。
  to: 艾城王一看见这情形，城里的人就急忙早起，出城迎战以色列；他和他的全体民众到了亚拉巴前面的约定地点[a]。他却不知道，城后有伏兵在等着对付他。
  rationale: 修订补足原文隐含而汉语表达所需的“看见”宾语，明确“约定地点”的空间含义，并调整语序使复数行动者在汉语中更清楚。未将“全体民众”改作“军队”，也未对伏兵行动加入原文没有说明的战术细节。
