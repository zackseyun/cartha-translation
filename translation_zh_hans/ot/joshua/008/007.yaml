  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/אַתֶּ֗ם תָּקֻ֨מוּ֙ מֵ/הָ֣/אוֹרֵ֔ב וְ/הוֹרַשְׁתֶּ֖ם אֶת הָ/עִ֑יר וּ/נְתָנָ֛/הּ יְהוָ֥ה אֱלֹֽהֵי/כֶ֖ם בְּ/יֶדְ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/007.yaml
  text: Then you shall rise up from the ambush and take the city[a], for Yahweh your God will give it into your hand.
translation:
  language: zh_hans
  text: 你们就要从埋伏处起来，占领那城[a]，因为雅威你们的上帝必把城交在你们手中。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“夺取那城”。希伯来语动词可指取得并占有，不仅限于军事攻取这一动作。
    reason: lexical_alternative
lexical_decisions:
- source_word: תָּקֻמוּ
  choice: 起来
  rationale: קום的Qal未完成式第二人称阳性复数，在连续的军事指令中表示从隐蔽状态起身行动；“起来”具体、自然。
- source_word: מֵהָאוֹרֵב
  choice: 从埋伏处
  rationale: אֹרֵב在此指设伏或埋伏的位置；“埋伏处”清楚表达他们从藏身设伏之处出来。
- source_word: וְהוֹרַשְׁתֶּם
  choice: 占领
  rationale: ירשׁ的Hiphil形式在此征服语境中指取得并占有该城；“占领”兼顾军事夺取和实际控制，避免只表达一次性的攻破。
- source_word: הָעִיר
  choice: 那城
  rationale: עִיר带定冠词，语境中特指艾城；“那城”符合现代汉语指称方式。
- source_word: וּנְתָנָהּ
  choice: 必把城交
  rationale: 带连接词的完成式承接指令，表达有把握的将来结果；“必……交”传达应许的确定性，并以“城”明确阴性代词所指。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以常见的现代汉语音译保留四字神名，不用头衔替代专名。
- source_word: אֱלֹהֵיכֶם
  choice: 你们的上帝
  rationale: 直接表达带第二人称复数后缀的构造形式，并保留对受命群体的称呼。
- source_word: בְּיֶדְכֶם
  choice: 在你们手中
  rationale: 保留希伯来语“交在某人手中”的常见习语；现代汉语也能自然表达落入掌控之意。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”较贴近学界通常重构的读音，同时保留其作为以色列之上帝专名的性质。
- issue: וְהוֹרַשְׁתֶּם在征服语境中的含义
  choice: 占领
  alternative: 夺取
  rationale: 该动词既涉及军事取得，也带有取得占有权或控制权的意味；正文用“占领”保留这层张力，脚注列出较侧重军事行动的译法。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“你们就要”体现וְאַתֶּם的显明主语和指令语气；“埋伏处”“占领”“交在你们手中”保持军事场景清楚，同时保留希伯来语习语。
