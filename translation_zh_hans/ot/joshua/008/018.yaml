base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/018.yaml
  text: Then Yahweh said to Joshua[a], “Stretch out the javelin that is in your hand toward Ai, for I will give it into your hand.” So Joshua stretched out the javelin that was in his hand toward the city.
translation:
  language: zh_hans
  text: 雅威对约书亚说：“把你手里的标枪[a]伸向艾城，因为我要把艾城交在你手中。”约书亚就把手里的标枪伸向那城。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“矛”或“长矛”。希伯来语 כִּידוֹן 指一种矛类武器，具体可理解为标枪、矛或长矛。
    reason: 保留该武器名称在形制和对应译词上的词义不确定性。
lexical_decisions:
- source_word: יְהוָה
  choice: 雅威
  rationale: 直接音译上帝的专名，保留原文的圣约称名，不以“主”替代。
- source_word: נְטֵה / וַיֵּט (נטה)
  choice: 伸向
  rationale: 该动词表示伸出、延展；结合介词 אֶל，用“伸向”自然表达动作及其方向，又不缩减为单纯“指着”。
- source_word: כִּידוֹן
  choice: 标枪
  rationale: 该词指一种矛类武器，具体形制并不完全确定；正文采用现代读者易懂的“标枪”，并以脚注保留“矛、长矛”等可能译法。
- source_word: אֲשֶׁר בְּיָדְךָ / אֲשֶׁר בְּיָדוֹ
  choice: 你手里的 / 手里的
  rationale: 保留原文关系结构所表达的“在手中”，同时使用自然简洁的现代汉语。
- source_word: אֶל הָעַי
  choice: 向艾城
  rationale: 介词在动作语境中表示方向；“向艾城”不额外赋予攻击或进入城中的含义。
- source_word: כִּי בְיָדְךָ אֶתְּנֶנָּה
  choice: 因为我要把艾城交在你手中
  rationale: “交在你手中”保留希伯来语表示交付权柄、使其受支配的惯用表达；明说“艾城”可避免汉语代词指向不清。
- source_word: אֶל הָעִיר
  choice: 向那城
  rationale: 保留原文从专名“艾城”转为普通名词“那城”的措辞变化。
theological_decisions:
- issue: 如何译出神名 יהוה
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名；“雅威”较贴近其通行学术重构读音，也避免把专名改成称号。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“交在你手中”有意保留原文惯用意象；两次使用“伸向”对应命令及其执行，并保留“艾城／那城”的原文变化。
