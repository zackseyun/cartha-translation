  text: And he took about five thousand men and set them in ambush between Bethel and Ai[b][a], west of the city.
translation:
  language: zh_hans
  text: 他选出约五千人[a]，安排他们埋伏在伯特利和艾城之间、艾城的西边[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “约五千人”：原文“五”前有表示近似的前缀，说明人数是约数。
    reason: lexical_alternative
  - marker: b
    text: “西边”：原文直译含有“城的海（边）”这一表达；“海”在希伯来语方位表达中常用来指西方。
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּקַּח
  choice: 他选了
  rationale: לקח基本义为“取、拿”，在此军事语境中指从军队中选取一批人；译作“选了”符合现代汉语，也不增加原文没有的细节。
- source_word: כַּחֲמֵשֶׁת אֲלָפִים אִישׁ
  choice: 约五千人
  rationale: 数字前的כ通常表示约数，故保留“约”；אִישׁ在数字后作集合用法，译为“人”。
- source_word: וַיָּשֶׂם אוֹתָם אֹרֵב
  choice: 派他们埋伏
  rationale: שׂים意为“安置、设置”，אֹרֵב指埋伏或伏兵；结合军事语境，译作“派他们埋伏”自然清楚，并保留其功能意义。
- source_word: בֵּין בֵּית אֵל וּבֵין הָעַי
  choice: 在伯特利和艾城之间
  rationale: 按地点关系直译；专名采用现代中文圣经中通行且易懂的形式。
- source_word: מִיָּם לָעִיר
  choice: 也就是艾城的西边
  rationale: יָם本义为“海”，在希伯来地理方位表达中惯指“西”；לָעִיר中的“城”依近接语境指艾城。加入“也就是”使该方位与前面的地点说明关系清楚。
