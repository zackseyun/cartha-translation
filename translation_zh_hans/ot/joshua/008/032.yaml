revisions:
- from: 他就在那里，把摩西律法的一个副本[a]写在石头上；这是他在以色列人面前[b]写的。
  to: 他在那里，在那些石头上写下摩西所写的律法的副本[a]，就是摩西在以色列人面前[b]所写的。
  rationale: 明确关系分句中“所写”的主语为摩西，并保留לִפְנֵי可译为“在……面前／当着……的面”的简洁歧义。加入“那些”对应定指的石头；其所指由上下文确定。
