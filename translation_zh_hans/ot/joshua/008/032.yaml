source:
  edition: WLC
  text: וַ/יִּכְתָּב שָׁ֖ם עַל הָ/אֲבָנִ֑ים אֵ֗ת מִשְׁנֵה֙ תּוֹרַ֣ת מֹשֶׁ֔ה אֲשֶׁ֣ר כָּתַ֔ב לִ/פְנֵ֖י בְּנֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/032.yaml
  text: And there[a], on the stones, he wrote a copy of the law of Moses[b], which he had written before the sons of Israel.
translation:
  language: zh_hans
  text: 他在那里，在那些石头上写下摩西所写的律法的副本[a]，就是摩西在以色列人面前[b]所写的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“摩西所写律法的复本”或“摩西所写律法的重述”。希伯来语这个词可指副本、复本或重复的版本。
    reason: lexical_alternative
  - marker: b
    text: 或译：“当着以色列人的面”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּכְתָּב
  choice: 他就……写
  rationale: 这是כתב（写）的Qal叙事形式。石头虽是书写表面，原词仍是普通的“写”，不必强化为“刻”。
- source_word: שָׁם
  choice: 在那里
  rationale: 准确表达地点副词，并符合现代汉语叙事习惯。
- source_word: עַל הָאֲבָנִים
  choice: 在石头上
  rationale: עַל在这里标明书写的表面；定冠词所指的石头由上文确定，汉语无需另行表达冠词。
- source_word: מִשְׁנֵה תּוֹרַת מֹשֶׁה
  choice: 摩西律法的一个副本
  rationale: מִשְׁנֵה可指副本、复本或重述；在写于石头的语境中，“副本”最自然，同时不限定所写律法的范围。
- source_word: תּוֹרַת מֹשֶׁה
  choice: 摩西律法
  rationale: תּוֹרָה虽也可指“训诲”，但在此约与法律语境中，“摩西律法”清楚、自然且为读者熟悉。
- source_word: אֲשֶׁר כָּתַב
  choice: 这是他……写的
  rationale: 以汉语关系分句承接前文；保留第三人称指代，不额外添加原文没有明说的专名。
- source_word: לִפְנֵי בְּנֵי יִשְׂרָאֵל
  choice: 在以色列人面前
  rationale: לִפְנֵי可表示“在……面前”或“当着……的面”；בְּנֵי יִשְׂרָאֵל在此是民族称谓，译作“以色列人”比字面“以色列的众子”更符合现代汉语。
theological_decisions:
- issue: מִשְׁנֵה תּוֹרַת מֹשֶׁה所指律法的范围
  choice: 译作“摩西律法的一个副本”，不说明是整部律法还是其中一部分。
  alternative: “摩西律法的重述”或“摩西律法的复本”
  rationale: 本节没有界定写下内容的具体范围；译文不以和谐化或缩减性的解释补足原文。
- issue: אֲשֶׁר כָּתַב中“他”的所指
  choice: 保留“他”，按紧接的叙事主语理解为约书亚，同时不在关系分句中增添姓名。
  alternative: 解释为摩西先前所写
  rationale: 希伯来语关系分句没有另换主语的明确标记，紧接的叙事主语仍是约书亚；译文不把可能的解释扩写成“摩西先前所写”。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“他就在那里”延续叙事；“副本”既通俗又适合法律文本语境。分号使后面的关系分句清楚承接所写内容，并避免生硬的欧化长句。
