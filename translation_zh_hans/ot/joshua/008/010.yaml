  text: Joshua rose early in the morning and mustered the people[a], and he and the elders of Israel went up before the people to Ai.
translation:
  language: zh_hans
  text: 约书亚清早起来，检阅百姓[a]；他和以色列的长老走在百姓前面，上艾城去。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“清点百姓”或“召集百姓”。希伯来语动词可指清点、察看、委派或召集整队；这里的军事语境较支持“检阅”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכֵּם בַּבֹּקֶר
  choice: 清早起来
  rationale: שׁכם的使役词干常表示“早起”；与בַּבֹּקֶר连用时，译作“清早起来”自然、简洁，并保留时间强调。
- source_word: וַיִּפְקֹד אֶת־הָעָם
  choice: 召集百姓
  rationale: פקד语义范围包括点数、察看、委派和召集整队；本节处于进攻艾城的军事语境，“召集”能表达组织、检阅人员的含义，同时不把动作限定为单纯点数。
- source_word: הָעָם
  choice: 百姓
  rationale: 原文使用宽泛的“百姓”，虽有军事背景，仍不宜直接窄化为“军队”或“士兵”。
- source_word: וַיַּעַל
  choice: 上……去
  rationale: עלה通常指“上去”，这里既可描述军事进发，也可能保留地势上的上行含义。
- source_word: הוּא וְזִקְנֵי יִשְׂרָאֵל
  choice: 他和以色列的长老
  rationale: 明确保留约书亚本人和以色列众长老共同作主语，与希伯来文结构一致。
- source_word: לִפְנֵי הָעָם
  choice: 走在百姓前面
  rationale: לפני直指“在……前面”；此译自然表达位置关系，又不额外断定其特指领军身份。
- source_word: הָעָי
  choice: 艾城
  rationale: 按现代中文圣经地名惯例译作“艾城”；原文冠词不必在中文专名中另行体现。
