source:
  edition: WLC
  text: וַ/יְהִ֣י כְּ/כַלּ֣וֹת יִשְׂרָאֵ֡ל לַ/הֲרֹג֩ אֶת כָּל יֹשְׁבֵ֨י הָ/עַ֜י בַּ/שָּׂדֶ֗ה בַּ/מִּדְבָּר֙ אֲשֶׁ֣ר רְדָפ֣וּ/ם בּ֔/וֹ וַֽ/יִּפְּל֥וּ כֻלָּ֛/ם לְ/פִי חֶ֖רֶב עַד תֻּמָּ֑/ם וַ/יָּשֻׁ֤בוּ כָל יִשְׂרָאֵל֙ הָ/עַ֔י וַ/יַּכּ֥וּ אֹתָ֖/הּ לְ/פִי חָֽרֶב־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/024.yaml
  text: And it happened that when Israel had finished killing all the inhabitants of Ai in the field[a], in the wilderness where they had pursued them, and all of them had fallen by the edge of the sword until they were finished off, then all Israel returned to Ai and struck it with the edge of the sword.
translation:
  language: zh_hans
  text: 以色列人杀尽了艾城所有的居民，就是在田野、在他们追赶他们的旷野中的人；他们全都倒在刀下，直到灭尽。随后，以色列众人回到艾城，用刀攻击这城。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי כְּכַלּוֹת
  choice: ……杀尽了……；随后
  rationale: 该结构标示前一行动完成后，叙事进入下一阶段。汉语无需机械译出“事情发生了”，用完成性表达和“随后”自然呈现时序。
- source_word: לַהֲרֹג
  choice: 杀
  rationale: הרג明确表示杀死；直译保留经文对战争杀戮的严峻叙述，不弱化为“打败”。
- source_word: יֹשְׁבֵי הָעַי
  choice: 艾城居民
  rationale: ישב的分词在此名词化，指住在艾城的人；“居民”准确而自然。
- source_word: בַּשָּׂדֶה
  choice: 在田野
  rationale: 按常用义译作“田野”，并与后文回到城中形成空间对照，不额外加入原文没有的“开阔”。
- source_word: בַּמִּדְבָּר
  choice: 在旷野
  rationale: מִדְבָּר指未耕种的野外地域，不必然是沙漠；“旷野”是准确且庄重的现代汉语表达。
- source_word: אֲשֶׁר רְדָפוּם בּוֹ
  choice: 在他们追赶艾城居民的旷野中
  rationale: 关系从句说明追赶发生的地点。为避免连续代词造成指代含混，汉语中复现“艾城居民”。
- source_word: וַיִּפְּלוּ כֻלָּם לְפִי חֶרֶב
  choice: 他们全都倒在刀下
  rationale: נפל在战争语境中指战死；“倒在刀下”保留“刀口”这一希伯来习语的形象，同时符合现代汉语。
- source_word: עַד תֻּמָּם
  choice: 一个也没有剩下
  rationale: 该短语强调被追赶者彻底灭尽、无一存留；此译自然表达完成和穷尽的结果。
- source_word: וַיָּשֻׁבוּ כָל יִשְׂרָאֵל הָעַי
  choice: 随后，以色列众人回到艾城
  rationale: שוב加目的地表示返回；“随后”清楚标明先杀尽野外之敌、再返回城中的叙事次序。
- source_word: וַיַּכּוּ אֹתָהּ לְפִי חָרֶב
  choice: 用刀击杀城中的人
  rationale: 原文阴性单数宾语指艾城，但汉语说“用刀击杀城”不自然；按城市作为居民集合体的转喻，译明实际受击杀者，同时不扩展行动范围。
theological_decisions:
- issue: 如何翻译战争与彻底杀戮的叙述
  choice: 直陈“杀尽”“倒在刀下”“一个也没有剩下”
  alternative: 以“击败”“征服”等较缓和措辞表达，或补充这是神圣审判
  rationale: 本节明确叙述杀戮及其彻底性。译文既不应淡化暴力，也不应加入本节未明说的神学解释。
- issue: 城市作为击杀对象的转喻
  choice: 将“击杀它”译为“击杀城中的人”
  alternative: 直译为“击打它”或“用刀击杀艾城”
  rationale: 阴性宾语在语法上回指艾城，但“用刀”表明实际对象是城中居民。汉语适度明示这一转喻，避免误解为毁坏建筑。
translation_notes:
  register: 采用现代、庄重而易懂的叙事文体；保留原文严厉的战争措辞。通过分号和“随后”整理希伯来语长句，使行动次序清楚，同时避免仿古套语。
