  text: וַ/יְהִ֗י אַחֲרֵ֛י מ֥וֹת מֹשֶׁ֖ה עֶ֣בֶד יְהוָ֑ה וַ/יֹּ֤אמֶר יְהוָה֙ אֶל יְהוֹשֻׁ֣עַ בִּן נ֔וּן מְשָׁרֵ֥ת מֹשֶׁ֖ה לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/001/001.yaml
  text: 'After the death of Moses[a], the servant of Yahweh, Yahweh said to Joshua son of Nun, the attendant of Moses, saying:'
translation:
  language: zh_hans
  text: 雅威的仆人摩西死后，雅威对嫩的儿子约书亚——摩西的侍从[a]——说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “侍从”所译的希伯来语也可译作“助手”或“服侍者”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי אַחֲרֵי מוֹת
  choice: 死后
  rationale: וַיְהִי在此引入叙事场景，אַחֲרֵי מוֹת构成明确的时间短语。现代汉语用“死后”自然表达，不另加原文没有的“如今”。
- source_word: עֶבֶד יְהוָה
  choice: 雅威的仆人
  rationale: עֶבֶד在这里是摩西的尊称，强调他事奉上帝的身份；“仆人”比“奴隶”更符合这一语境。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语音译四字神名，保留其作为上帝专名的性质，而不以称号代替。
- source_word: יְהוֹשֻׁעַ בִּן נוּן
  choice: 嫩的儿子约书亚
  rationale: 采用现代中文圣经读者熟悉的人名形式，并保留希伯来语父子身份结构。
- source_word: מְשָׁרֵת מֹשֶׁה
  choice: 摩西的侍从
  rationale: מְשָׁרֵת指在近旁服侍、协助的人；“侍从”既保留其服侍关系，也避免“牧师”等后期宗教职衔含义。
- source_word: לֵאמֹר
  choice: 说：
  rationale: 该不定式用于引出下文的直接话语；现代汉语以“说：”自然而完整地表达其功能。
theological_decisions:
- issue: 四字神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文使用上帝的专名，而非一般称号；“雅威”较直接反映学界通常重构的读音，并避免把专名改作称号。
- issue: 摩西称号עֶבֶד的译法
  choice: 仆人
  alternative: 奴仆；奴隶
  rationale: 该词本可涉及从属或奴役身份，但在“雅威的仆人”这一尊称中，重点是摩西忠心事奉上帝的身份；“仆人”保留语义范围而不过度突出受奴役状态。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。将“雅威的仆人”前置于“摩西”，使修饰关系清楚；以破折号标明“摩西的侍从”是对约书亚身份的补充说明。
