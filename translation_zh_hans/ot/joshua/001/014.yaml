  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: נְשֵׁי/כֶ֣ם טַפְּ/כֶם֮ וּ/מִקְנֵי/כֶם֒ יֵשְׁב֕וּ בָּ/אָ֕רֶץ אֲשֶׁ֨ר נָתַ֥ן לָ/כֶ֛ם מֹשֶׁ֖ה בְּ/עֵ֣בֶר הַ/יַּרְדֵּ֑ן וְ/אַתֶּם֩ תַּעַבְר֨וּ חֲמֻשִׁ֜ים לִ/פְנֵ֣י אֲחֵי/כֶ֗ם כֹּ֚ל גִּבּוֹרֵ֣י הַ/חַ֔יִל וַ/עֲזַרְתֶּ֖ם אוֹתָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/001/014.yaml
  text: Your wives[a], your little ones, and your livestock shall remain in the land that Moses gave you beyond the Jordan. But you shall cross over before your brothers, armed, all the mighty men of valor[b], and you shall help them.
translation:
  language: zh_hans
  text: 你们的妻子、孩子和牲畜要留在摩西赐给你们、约旦河东的土地上；但你们所有英勇的战士都要全副武装[a]，在你们的弟兄[b]前面过河，并帮助他们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “全副武装”或译“列好战阵”或“整装出战”。
    reason: alternative_reading
  - marker: b
    text: “弟兄”在这里泛指他们的以色列同胞；希伯来文使用阳性亲属称谓。
    reason: lexical_alternative
lexical_decisions:
- source_word: נְשֵׁיכֶם
  choice: 你们的妻子
  rationale: 在家庭与军事语境中，此词特指这些男子的妻子，并非泛指妇女。
- source_word: טַפְּכֶם
  choice: 孩子
  rationale: טַף常指幼小的孩子或家中受扶养者；现代汉语用“孩子”自然清楚，又不过度限定年龄。
- source_word: וּמִקְנֵיכֶם
  choice: 和牲畜
  rationale: מִקְנֶה在此指家养牲畜和畜群，不是广义的财物。
- source_word: יֵשְׁבוּ
  choice: 可以留在
  rationale: ישב可表示居住、停留；这里是家属留在已经分得的土地上。“可以”体现本节在前文命令引述中的许可语气。
- source_word: בָּאָרֶץ אֲשֶׁר נָתַן לָכֶם מֹשֶׁה
  choice: 摩西赐给你们的地上
  rationale: 忠实表达已经完成的赐地行动，同时保持汉语流畅。
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  choice: 约旦河东
  rationale: עֵבֶר本身是“河那边”，方向依叙述视角而定；本处历史地理位置明确指约旦河东，正文如此表达最清楚。
- source_word: וְאַתֶּם תַּעַבְרוּ
  choice: 但你们……都要……过河去
  rationale: “但”清楚表现留守家属与过河战士之间的对比；“过河去”自然传达 עבר 的越过之意。
- source_word: חֲמֻשִׁים
  choice: 武装起来
  rationale: 该词在军事语境中最可能指装备武器或列阵备战，但确切细微含义存在争议，故附注保留另一可能。
- source_word: לִפְנֵי אֲחֵיכֶם
  choice: 走在你们的弟兄前面
  rationale: 保留“在……前面”的空间和先行含义，说明这些战士要率先渡河。
- source_word: אֲחֵיכֶם
  choice: 你们的弟兄
  rationale: 保留希伯来文阳性亲属称谓，同时用脚注说明此处代表性地指其他以色列同胞。
- source_word: כֹּל גִּבּוֹרֵי הַחַיִל
  choice: 你们所有英勇的战士
  rationale: 此短语指有能力、有勇力的作战男子；“英勇的战士”在现代汉语中庄重、清楚，也保留其军事力量感。
- source_word: וַעֲזַרְתֶּם אוֹתָם
  choice: 帮助他们
  rationale: 直接传达军事行动中的援助责任，不额外限定帮助的具体方式。
theological_decisions:
- issue: אֲחֵיכֶם 的性别化亲属称谓及代表范围
  choice: 正文译作“你们的弟兄”，脚注说明泛指以色列同胞
  alternative: 正文译作“你们的以色列同胞”
  rationale: 既保留原文的阳性亲属用语，又不让现代读者误以为仅指有血缘关系的兄弟；不将其静默中性化。
- issue: חֲמֻשִׁים 的军事含义
  choice: 武装起来
  alternative: 列好战阵／整装出战
  rationale: “武装起来”最符合这里过河参战的语境，但原词可能侧重作战队形或战备状态，因此用脚注保留其含义张力。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“约旦河东”依据本节明确的地理语境消除汉语中“河那边”的视角含混；军事术语保持简洁有力。所有脚注标记均置于相应正文词语之后。
