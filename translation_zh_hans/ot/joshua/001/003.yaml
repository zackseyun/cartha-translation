source:
  edition: WLC
  text: כָּל מָק֗וֹם אֲשֶׁ֨ר תִּדְרֹ֧ךְ כַּֽף רַגְלְ/כֶ֛ם בּ֖/וֹ לָ/כֶ֣ם נְתַתִּ֑י/ו כַּ/אֲשֶׁ֥ר דִּבַּ֖רְתִּי אֶל מֹשֶֽׁה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/001/003.yaml
  text: Every place on which the sole of your foot treads[a], I have given to you, just as I spoke to Moses.
translation:
  language: zh_hans
  text: 凡你们脚掌所踏之地[a]，我都已经赐给你们，正如我对摩西所说的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你们脚掌踏在其上的每一处地方”。
    reason: 保留 אֲשֶׁר ... בּוֹ 关系结构较为显明的另一种译法。
lexical_decisions:
- source_word: כָּל מָקוֹם
  choice: 凡……之地……都
  rationale: כָּל 与 מָקוֹם 连用具有逐一涵盖的分配意义；“凡……都”在现代汉语中自然地表达“每一处”的范围。
- source_word: אֲשֶׁר ... בּוֹ
  choice: 所……之地
  rationale: 关系词 אֲשֶׁר 与回指该地点的 בּוֹ 共同构成修饰“地方”的关系结构；汉语用“所……之地”可自然表达，而不必机械重复“在其上”。
- source_word: תִּדְרֹךְ
  choice: 踏
  rationale: דרך 表示踩、踏；“踏”保留脚踏土地的具体意象，也符合领土应许的语境。
- source_word: כַּף רַגְלְכֶם
  choice: 你们脚掌
  rationale: כַּף רֶגֶל 特指脚底、脚掌；“脚掌”准确而简洁。后缀为第二人称阳性复数，因此译作“你们”。
- source_word: לָכֶם נְתַתִּיו
  choice: 我都已经赐给你们
  rationale: לָכֶם 表明领受者；נתן 在此为完成式，并带回指地点的宾语后缀。译文以“已经”体现授予已由神确立，以“都”承接前面的“凡”，无需另加生硬的宾语代词。
- source_word: כַּאֲשֶׁר
  choice: 正如
  rationale: 该词引出与先前对摩西所说之话的对应关系；“正如”清楚保留比较意味。
- source_word: דִּבַּרְתִּי אֶל מֹשֶׁה
  choice: 我对摩西所说的
  rationale: דבר אל 是“对……说话”的常用表达。译作“所说的”保留原文措辞，不将其明确化为“应许”，以免过度诠释。
theological_decisions:
- issue: 神赐地之行动的体貌
  choice: 将完成式 נְתַתִּיו 译为“已经赐给”
  alternative: “赐给”或“将要赐给”
  rationale: 希伯来语完成式把赐地呈现为已经确立的行动，尽管实际占领尚将在历史中展开。“已经赐给”保留这种确定性，而不把它改写成单纯的将来应许。
translation_notes:
  register: 采用庄重而通顺的现代标准普通话。“凡……都”清楚表达分配范围；“脚掌所踏之地”保留原文的具体土地意象。
