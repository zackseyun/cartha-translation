  text: הֲ/ל֤וֹא צִוִּיתִ֨י/ךָ֙ חֲזַ֣ק וֶ/אֱמָ֔ץ אַֽל תַּעֲרֹ֖ץ וְ/אַל תֵּחָ֑ת כִּ֤י עִמְּ/ךָ֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ בְּ/כֹ֖ל אֲשֶׁ֥ר תֵּלֵֽךְ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/001/009.yaml
  text: Have I not commanded you? Be strong and courageous. Do not be terrified[a], and do not be dismayed, for Yahweh your God is with you wherever you go.
translation:
  language: zh_hans
  text: 我岂不是吩咐过你吗？你要刚强勇敢！不要惊恐，也不要丧胆，因为无论你到哪里，雅威[a]你的上帝都与你同在。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文为YHWH，是上帝的专名；传统常译作“耶和华”。本译文译作“雅威”。
    reason: 说明神名的原文形式、传统汉语译法及本译文所采用的译写，消除与正文的不一致。
lexical_decisions:
- source_word: הֲלוֹא צִוִּיתִיךָ
  choice: 我岂不是吩咐过你吗
  rationale: 用反问句保留否定疑问所表达的强调和提醒；“吩咐过”自然体现完成动作，又符合上帝向约书亚颁令的语境。
- source_word: חֲזַק וֶאֱמָץ
  choice: 你要刚强勇敢
  rationale: 分别保留“刚强”和“勇敢”两个相辅相成的概念，同时采用现代汉语中自然、庄重的劝勉表达。
- source_word: אַל תַּעֲרֹץ
  choice: 不要惊恐
  rationale: ערץ所表达的是强烈的惧怕或恐慌；“惊恐”比一般的“害怕”更能保留其力度。
- source_word: וְאַל תֵּחָת
  choice: 也不要丧胆
  rationale: חתת在此可指内心崩溃、畏缩或失去勇气；“丧胆”既与“惊恐”有别，也自然呼应前面的“勇敢”。
- source_word: כִּי עִמְּךָ
  choice: 因为……都与你同在
  rationale: כִּי引出命令的理由，עִמְּךָ直接表达上帝的临在；“因为……与你同在”清楚保留这一逻辑关系。
- source_word: יְהוָה
  choice: 雅威
  rationale: 原文使用上帝的专名YHWH；“雅威”是现代汉语中常见的音译，可避免把专名直接改作称号。
- source_word: אֱלֹהֶיךָ
  choice: 你的上帝
  rationale: 准确表达带第二人称阳性单数词尾的“你的上帝”；此处对象是约书亚个人。
- source_word: בְּכֹל אֲשֶׁר תֵּלֵךְ
  choice: 无论你到哪里
  rationale: 这是符合现代汉语习惯的概括表达，准确传达约书亚所到的每一处，而不拘泥于希伯来语介词结构。
theological_decisions:
- issue: 如何译写神名יְהוָה
  choice: 雅威
  alternative: 耶和华；“耶和华上帝”中的称号式传统译法
  rationale: 原文明确使用四字神名，而非“主”这一称号。正文采用音译“雅威”以体现专名性质，并用脚注说明汉语传统译法；不据此加入原文没有的教派性解释。
- issue: 上帝同在应理解为地点还是处境
  choice: 保留“无论你到哪里”的地点性表述
  alternative: 无论你做什么；在一切境况中
  rationale: 原文动词הלך在这里直接指“去、行走”，故不将其扩展成泛指所有行为或处境；同时“无论你到哪里”自然体现其周遍意义。
translation_notes:
  register: 采用现代、庄重而易懂的劝勉语体。“岂不是……吗”保留原文反问的强调；两个短促禁令与前面的命令形成有力节奏。正文称约书亚为“你”，符合原文第二人称阳性单数。
