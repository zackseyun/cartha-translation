reference: Joshua 1:7
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: רַק֩ חֲזַ֨ק וֶֽ/אֱמַ֜ץ מְאֹ֗ד לִ/שְׁמֹ֤ר לַ/עֲשׂוֹת֙ כְּ/כָל הַ/תּוֹרָ֗ה אֲשֶׁ֤ר צִוְּ/ךָ֙ מֹשֶׁ֣ה עַבְדִּ֔/י אַל תָּס֥וּר מִמֶּ֖/נּוּ יָמִ֣ין וּ/שְׂמֹ֑אול לְמַ֣עַן תַּשְׂכִּ֔יל בְּ/כֹ֖ל אֲשֶׁ֥ר תֵּלֵֽךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/001/007.yaml
  text: Only be strong and very courageous[a], being careful to do according to all the law that Moses my servant commanded you. Do not turn from it to the right or to the left, so that you may act wisely wherever you go.
translation:
  language: zh_hans
  text: 只是你要刚强，极其勇敢，谨慎遵行我仆人摩西吩咐你的一切律法；不可偏离它，或向右，或向左，好使你无论往哪里去，都能行事明智[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “都能行事明智”或译“都能顺利”或“都能成功”；“无论往哪里去”也可理解为“凡你所做的事”。
    reason: 保留 תַּשְׂכִּיל 在“明智行事”与“顺利、成功”之间的词义幅度，并说明末句范围表达的另一种理解。
lexical_decisions:
- source_word: רַק
  choice: 只是
  rationale: 保留限制兼强调的语气，突出接下来这项至关重要的嘱咐；现代汉语中自然且不显古奥。
- source_word: חֲזַק וֶאֱמַץ מְאֹד
  choice: 刚强，极其勇敢
  rationale: 分别表达力量坚定与勇毅果敢；“极其”保留 מְאֹד 的强烈程度。
- source_word: לִשְׁמֹר לַעֲשׂוֹת
  choice: 谨慎遵行
  rationale: 兼顾“留心守住”与“实际实行”两个层面，以简洁自然的汉语表达连续不定式的含义。
- source_word: כְּכָל הַתּוֹרָה
  choice: 遵行……一切律法
  rationale: כְּ 表示依照，תּוֹרָה 在本段特指摩西所传的盟约性律法；“一切”保留完整、全面之意。
- source_word: אֲשֶׁר צִוְּךָ מֹשֶׁה עַבְדִּי
  choice: 我仆人摩西吩咐你的
  rationale: 忠实保留上帝称摩西为“我仆人”的关系与身份表述。
- source_word: אַל תָּסוּר מִמֶּנּוּ יָמִין וּשְׂמֹאול
  choice: 不可偏离它，或向右，或向左
  rationale: “偏离”清楚表达离开规定道路的比喻，同时保留向右、向左的方向性意象。
- source_word: לְמַעַן
  choice: 好使
  rationale: 自然表达目的或结果关系，不强行限定二者。
- source_word: תַּשְׂכִּיל
  choice: 行事明智
  rationale: 该词的使役词干可指有见识、审慎地行事，并可引申为顺利或成功；正文保留其智慧语义核心，其他可能性列于脚注。
- source_word: בְּכֹל אֲשֶׁר תֵּלֵךְ
  choice: 无论往哪里去
  rationale: 贴近 הלך“去、行走”的基本含义，也自然表达范围的周全性。
theological_decisions:
- issue: 盟约语境中 תּוֹרָה 的含义
  choice: 律法
  alternative: 训诲
  rationale: 本节明确指摩西所吩咐的一切内容，因此盟约性、律法性的含义在此居首；“训诲”虽是该词较宽泛的可能含义，却不如“律法”切合直接语境。
- issue: תַּשְׂכִּיל 的含义
  choice: 行事明智
  alternative: 顺利；成功
  rationale: 希伯来语既可强调有洞察力、审慎地行事，也可能包含由此而来的顺利或成功。正文不将其收窄为物质兴旺，而以脚注保留结果性含义。
- issue: בְּכֹל אֲשֶׁר תֵּלֵךְ 的范围
  choice: 无论往哪里去
  alternative: 凡你所做的事
  rationale: 正文依照 הלך 的通常含义保留“去、行走”的空间表达；同时承认该短语也可能概括约书亚的一切行动。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“刚强，极其勇敢”保留劝勉的力度；“谨慎遵行”凝练表达留心守护并付诸实行；全句保持上帝直接嘱咐约书亚的权威语气。脚注标记置于其实际所解释的末句，而非置于“勇敢”之后。
