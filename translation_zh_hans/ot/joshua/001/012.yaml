  yaml_path: translation/ot/joshua/001/012.yaml
  text: And to the Reubenites[a], and to the Gadites, and to the half-tribe of Manasseh, Joshua said,
translation:
  language: zh_hans
  text: 约书亚对吕便人、迦得人和玛拿西半个支派说[a]：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文在“说”之后还有“说着”一词，用来引出下一节约书亚所说的话。
    reason: 说明原文 לֵאמֹר 的话语引介功能；汉语正文以冒号自然表达。
lexical_decisions:
- source_word: וְ/לָ/רֽאוּבֵנִי
  choice: 对吕便人
  rationale: “吕便人”是集体用法，指吕便支派的人；介词译为“对”。句首连接词在汉语中不必机械译出。
- source_word: וְ/לַ/גָּדִי
  choice: 迦得人
  rationale: 该族称虽为单数形式，在这里作集体用法，现代汉语自然译作“迦得人”。
- source_word: וְ/לַ/חֲצִי שֵׁבֶט הַֽ/מְנַשֶּׁה
  choice: 玛拿西半个支派的人
  rationale: 原文意为“玛拿西支派的一半”；补出“的人”，使其与前面的受话对象并列，并符合现代汉语表达。
- source_word: אָמַר
  choice: 说
  rationale: אָמַר是常用的言说动词，此处直接译作“说”最准确自然。
- source_word: יְהוֹשֻׁעַ
  choice: 约书亚
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: לֵ/אמֹר
  choice: 说：
  rationale: 该不定式用于引出随后内容；汉语以“说：”自然衔接下一节的直接引语。
