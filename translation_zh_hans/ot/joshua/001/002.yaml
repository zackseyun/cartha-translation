  text: מֹשֶׁ֥ה עַבְדִּ֖/י מֵ֑ת וְ/עַתָּה֩ ק֨וּם עֲבֹ֜ר אֶת הַ/יַּרְדֵּ֣ן הַ/זֶּ֗ה אַתָּה֙ וְ/כָל הָ/עָ֣ם הַ/זֶּ֔ה אֶל הָ/אָ֕רֶץ אֲשֶׁ֧ר אָנֹכִ֛י נֹתֵ֥ן לָ/הֶ֖ם לִ/בְנֵ֥י יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/001/002.yaml
  text: Moses my servant is dead. So now[a], arise, cross this Jordan—you and all this people—into the land that I am giving to them, to the sons of Israel.
translation:
  language: zh_hans
  text: “我的仆人摩西死了。现在，你起来，和这全体百姓一起渡过这条约旦河，进入我正赐给他们、就是赐给以色列子孙[a]的那地。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译“以色列的儿子们”，也可译“以色列人”。
    reason: 说明原文带性别形式的群体称谓，并提供较自然的汉语替代译法。
lexical_decisions:
- source_word: עַבְדִּי
  choice: 我的仆人
  rationale: עֶבֶד可指仆人或奴仆；此处是摩西与上帝关系中的尊称。“我的仆人”既准确，又不刻意突出受奴役身份。
- source_word: מֵת
  choice: 死了
  rationale: 完成式在此直陈摩西已经死亡这一现实，并以此引出约书亚的使命；“死了”在现代汉语中简洁有力。
- source_word: וְעַתָּה
  choice: 现在
  rationale: 该短语从摩西之死转入约书亚当下必须承担的使命。“现在”自然呈现转折和时序；上下文已清楚表达由此前往后的推进。
- source_word: קוּם
  choice: 起来
  rationale: 命令式要求约书亚立即采取决定性的行动。“起来”保留原文意象，也适合庄重的差遣语境。
- source_word: עֲבֹר
  choice: 渡过
  rationale: 本动词以约旦河为直接宾语，表示越过河流；“渡过”比泛指的“经过”更准确。
- source_word: אֶת הַיַּרְדֵּן הַזֶּה
  choice: 这条约旦河
  rationale: 保留原文明确的指示词“这”；汉语以量词“条”搭配河流，自然清楚。
- source_word: אַתָּה וְכָל הָעָם הַזֶּה
  choice: 你和这全体百姓
  rationale: 保留第二人称单数、整体性的“全”和指示词“这”。“这全体百姓”比“所有这些人”更贴近原文的集合名词，并保持庄重语体。
- source_word: אֶל הָאָרֶץ
  choice: 进入……那地
  rationale: 在越过约旦河的运动语境中，אֶל表示朝向并进入；“进入……那地”准确表达跨河入境。
- source_word: אֲשֶׁר אָנֹכִי נֹתֵן לָהֶם
  choice: 我正赐给他们
  rationale: 分词נֹתֵן把赐地描述为正在实现或即将落实的行动；“正赐给”保留这一动态面向。
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: 赐给以色列子孙
  rationale: 该短语与“给他们”同位，明确“他们”的身份。“以色列子孙”是自然、庄重且较贴近希伯来文构词的表达；脚注说明其字面形式和可选译法。
theological_decisions:
- issue: לִבְנֵי יִשְׂרָאֵל作为带性别形式的群体称谓
  choice: 以色列子孙
  alternative: 以色列人；以色列的众子
  rationale: 原文采用阳性复数“以色列的儿子们”，在语境中指整个以色列群体。“以色列子孙”保留亲属和后裔称谓，又不把所指范围误限于成年男性；脚注公开其字面形式，以免掩盖原文的性别语法。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以短句和感叹号呈现差遣命令的力度；用“这条约旦河”“那地”保留近指与目的地之间的指示关系。将同位说明译为“就是赐给……”，避免汉语误把“他们”和“以色列子孙”理解为两个不同受赐群体。
