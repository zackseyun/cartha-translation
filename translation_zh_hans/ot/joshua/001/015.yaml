language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: עַ֠ד אֲשֶׁר יָנִ֨יחַ יְהוָ֥ה לַֽ/אֲחֵי/כֶם֮ כָּ/כֶם֒ וְ/יָרְשׁ֣וּ גַם הֵ֔מָּה אֶת הָ/אָ֕רֶץ אֲשֶׁר יְהוָ֥ה אֱלֹֽהֵי/כֶ֖ם נֹתֵ֣ן לָ/הֶ֑ם וְ/שַׁבְתֶּ֞ם לְ/אֶ֤רֶץ יְרֻשַּׁתְ/כֶם֙ וִֽ/ירִשְׁתֶּ֣ם אוֹתָ֔/הּ אֲשֶׁ֣ר נָתַ֣ן לָ/כֶ֗ם מֹשֶׁה֙ עֶ֣בֶד יְהוָ֔ה בְּ/עֵ֥בֶר הַ/יַּרְדֵּ֖ן מִזְרַ֥ח הַ/שָּֽׁמֶשׁ־׀־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/001/015.yaml
  text: until Yahweh gives your brothers rest[a], as he has given you, and they also take possession of the land that Yahweh your God is giving them. Then you shall return to the land of your possession and take possession of it, which Moses the servant of Yahweh gave you beyond the Jordan[b], toward the sunrise.
translation:
  language: zh_hans
  text: 直到耶和华使你们的弟兄[a]像你们一样得享安息，并且他们也取得耶和华你们的上帝正在赐给他们的那地。然后，你们就要回到自己的产业之地，占有那地，就是耶和华的仆人摩西在约旦河东边、日出方向[b]赐给你们的土地。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “弟兄”在这里指以色列其他支派的人，也可译作“以色列同胞”。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“向东”；原文直译为“日出方向”。
    reason: lexical_alternative
lexical_decisions:
- source_word: יָנִיחַ
  choice: 使……得享安息
  rationale: 该词是 נוח 的使役形，在这里指上帝使人脱离争战、安顿下来；“得享安息”既保留“安息”的词义，也符合军事与定居语境。
- source_word: לַאֲחֵיכֶם
  choice: 你们的弟兄
  rationale: 原文是阳性复数亲属称谓；正文保留其具体表达，脚注说明这里所指的是以色列其他支派的人。
- source_word: כָּכֶם
  choice: 像你们一样
  rationale: 希伯来文比较结构简略；中文可自然承接前面的“得享安息”，无需重复补出动词。
- source_word: וְיָרְשׁוּ
  choice: 取得
  rationale: ירשׁ 在征服和分地语境中兼有承受、占有之意；此处“取得”表达尚待获得土地的动态过程。
- source_word: נֹתֵן
  choice: 正在赐给
  rationale: 用进行表达保留分词所呈现的持续或迫近行动，也体现土地虽仍待取得，却已经是上帝所赐。
- source_word: אֶרֶץ יְרֻשַּׁתְכֶם
  choice: 自己的产业之地
  rationale: “产业”体现土地作为所承受份额的含义，“之地”使中文庄重而清楚。
- source_word: וִירִשְׁתֶּם אֹתָהּ
  choice: 占有那地
  rationale: 这里指返回并实际持有已经分给他们的土地；“占有”保留 ירשׁ 的取得并持有之义，同时避免中文重复累赘。
- source_word: עֶבֶד יְהוָה
  choice: 耶和华的仆人
  rationale: 这是摩西的尊称，强调他对耶和华的职分与服事，而非受奴役的社会身份。
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  choice: 约旦河东边
  rationale: “约旦河那边”会因叙述视点而含混；本句随后明确说“日出方向”，故译出东边，清楚表达地理位置。
- source_word: מִזְרַח הַשָּׁמֶשׁ
  choice: 日出方向
  rationale: 保留希伯来文以日出来表示东方的具体意象；脚注提示其通常意义。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 采用现代简体中文圣经语境中广为人知且可直接辨认的专名“耶和华”，不以“主”替代原文神名；同时不据此引入额外的宗派解释。
- issue: 阳性复数亲属词 אֲחֵיכֶם 的范围
  choice: 你们的弟兄
  alternative: 你们的以色列同胞
  rationale: 正文保留原文的性别化亲属称谓，不将其无痕改写为中性群体称谓；脚注交代语境中指以色列其他支派的人。
- issue: “安息”与土地应许的关系
  choice: 保留“得享安息”的表述
  alternative: 安顿下来／摆脱争战
  rationale: “安息”既可涵盖战事止息，也可涵盖在所得之地安顿；不把这里的神学张力缩减为单一含义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。句法按希伯来文的时间推进关系分成两句；保留“安息”“产业”和“日出方向”等重要意象，同时用自然中文明确约旦河以东的地理所指。
