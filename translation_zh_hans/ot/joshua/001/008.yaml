id: JOS.1.8
reference: Joshua 1:8
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: לֹֽא יָמ֡וּשׁ סֵפֶר֩ הַ/תּוֹרָ֨ה הַ/זֶּ֜ה מִ/פִּ֗י/ךָ וְ/הָגִ֤יתָ בּ/וֹ֙ יוֹמָ֣ם וָ/לַ֔יְלָה לְמַ֨עַן֙ תִּשְׁמֹ֣ר לַ/עֲשׂ֔וֹת כְּ/כָל הַ/כָּת֖וּב בּ֑/וֹ כִּי אָ֛ז תַּצְלִ֥יחַ אֶת דְּרָכֶ֖/ךָ וְ/אָ֥ז תַּשְׂכִּֽיל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/001/008.yaml
  text: This book of the law shall not depart from your mouth[a], but you shall meditate on it day and night, so that you may be careful to do according to all that is written in it. For then you will make your way prosper, and then you will act wisely.
translation:
  language: zh_hans
  text: 这律法书不可离开你的口[a]；你要昼夜默想这书，好使你谨慎遵行其中所写的一切。因为这样，你必使自己的道路亨通，也必行事明智。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“不可停止口中念诵”。原文此处的表达可含有持续口诵的意思；本节译作“默想”的希伯来语动词也可指低声念诵。
    reason: 保留“口”与הגה共同呈现的持续、安静口诵含义，同时维持正文自然流畅。
lexical_decisions:
- source_word: יָמוּשׁ
  choice: 离开
  rationale: 该动词意为离开、移开；与“你的口”连用时保留了律法常在口中、持续诵念的具体意象。
- source_word: סֵפֶר הַתּוֹרָה הַזֶּה
  choice: 这律法书
  rationale: סֵפֶר可指书卷或文书，תּוֹרָה在此指应当遵行的成文圣约律法；“这律法书”在现代汉语中简明自然。
- source_word: מִפִּיךָ
  choice: 你的口
  rationale: 采用贴近原文的具体表达，以保留说出、诵念并常挂在口中的含义。
- source_word: וְהָגִיתָ בּוֹ
  choice: 你要……默想
  rationale: הגה兼有低声念诵和思想揣摩之意；正文用“默想”表达反复思想的核心含义，并借前句及脚注保留口头诵念的色彩。
- source_word: יוֹמָם וָלַיְלָה
  choice: 昼夜
  rationale: 简洁保留原文“白日和黑夜”的成对表达，也自然传达持续不断之意。
- source_word: לְמַעַן תִּשְׁמֹר לַעֲשׂוֹת
  choice: 好使你谨慎遵行
  rationale: 目的结构表明默想是为了留心实行；“谨慎遵行”同时表达警醒看守与实际服从。
- source_word: כְּכָל הַכָּתוּב בּוֹ
  choice: 其中所写的一切
  rationale: 保留“全部”和成文规范两层意义，汉语表达自然。
- source_word: תַּצְלִיחַ אֶת דְּרָכֶךָ
  choice: 你必使自己的道路亨通
  rationale: 保留Hiphil使役形式，由约书亚使自己的道路亨通，而不简化为被动经历成功。
- source_word: תַּשְׂכִּיל
  choice: 行事明智
  rationale: 该动词可指明智、审慎地行事，并可能带来成功；此译与前面的“亨通”保持语义区别。
theological_decisions:
- issue: 圣约语境中תּוֹרָה的含义
  choice: 律法
  alternative: 训诲；妥拉
  rationale: 该词可泛指教导，但本节指约书亚必须遵行的成文圣约规范；“律法”准确且为普通中文读者所熟悉。
- issue: הגה是口头诵念还是内在默想
  choice: 正文译作“默想”，并以脚注保留低声诵念的含义
  alternative: 低声诵念；喃喃念诵
  rationale: 原文把“不离开你的口”与הגה相连，兼有口头重复和思想揣摩的张力；正文不将二者强行限定为单一行为。
- issue: 应许中的亨通与智慧
  choice: 分别译作“使自己的道路亨通”和“行事明智”
  alternative: 两处都译作成功或顺利
  rationale: 保留צלח与שכל之间的词义区别，避免把顺利结果与明智行动混为一谈，也不把应许扩展为经文未说明的物质繁荣。
translation_notes:
  register: 采用庄重而通顺的现代标准普通话。“昼夜”“谨慎遵行”“行事明智”具有经文语体的凝练感，但普通读者仍易理解；避免古奥措辞及宗派性术语。
