id: JOS.1.17
reference: Joshua 1:17
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כְּ/כֹ֤ל אֲשֶׁר שָׁמַ֨עְנוּ֙ אֶל מֹשֶׁ֔ה כֵּ֖ן נִשְׁמַ֣ע אֵלֶ֑י/ךָ רַ֠ק יִֽהְיֶ֞ה יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ עִמָּ֔/ךְ כַּ/אֲשֶׁ֥ר הָיָ֖ה עִם מֹשֶֽׁה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/001/017.yaml
  text: Just as we listened to Moses in everything[a], so we will listen to you. Only may Yahweh your God be with you, just as he was with Moses.
translation:
  language: zh_hans
  text: 我们在一切事上怎样听从摩西[a]，也必照样听从你。只是，愿雅威你的上帝与你同在，正如他与摩西同在一样。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“听摩西……也必听你。”希伯来语动词שׁמע可按语境表示“听”或“服从”。
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמַעְנוּ / נִשְׁמַע
  choice: 听从 / 必听从
  rationale: שׁמע与介词אֶל连用，在这里既有听取的字面意义，也含有听命、服从的语境意味。“听从”在现代汉语中自然地结合了聆听与顺服两层意思；脚注进一步保留原词的语义幅度。
- source_word: כְּכֹל אֲשֶׁר ... כֵּן
  choice: 在一切事上怎样……也必照样
  rationale: 同时表达比较关系与范围的全面性，避免生硬直译为“按照一切所……的”。
- source_word: רַק
  choice: 只是
  rationale: 引出对前面承诺的限定或附带愿望；“只是”比单纯的转折词更能保留其限制作用。
- source_word: יִהְיֶה
  choice: 愿……同在
  rationale: 此处未完成式接在רַק之后，适合按愿望语气理解，而非单纯预告将来。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以通行的现代汉语音译呈现四字神名，保留其作为专名的性质，不以称号替代。
- source_word: אֱלֹהֶיךָ
  choice: 你的上帝
  rationale: 准确体现第二人称阳性单数所属后缀，表达为自然的现代汉语。
- source_word: עִמָּךְ / עִם־מֹשֶׁה
  choice: 与你同在 / 与摩西同在
  rationale: עִם表示同在或相伴；“同在”符合本节关于神临在与领袖使命的语境。
- source_word: כַּאֲשֶׁר
  choice: 正如……一样
  rationale: 清楚呈现雅威与约书亚同在和他曾与摩西同在之间的对应比较。
theological_decisions:
- issue: 四字神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用神的专名；译作“雅威”以现代汉语音译保留专名，同时不以“主”等称号替代。
- issue: 百姓对约书亚承诺的性质
  choice: 听从
  alternative: 听 / 服从
  rationale: 原文שׁמע可指听，也可在此语境中指听命。“听从”兼顾两者，不把这句话缩减为单纯听见，也不完全消除其听取话语的词义基础。
- issue: 雅威同在这一分句的语气
  choice: 愿……同在
  alternative: 必与你同在
  rationale: 在רַק之后，יִהְיֶה较自然地表达愿望或祈愿。译文不把百姓的愿望强化为无条件的未来断言。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“在一切事上怎样……也必照样……”保留原文全面比较的结构；“只是，愿……”略带正式色彩，用来清楚呈现限定词与祈愿语气。
