  text: חֲזַ֖ק וֶ/אֱמָ֑ץ כִּ֣י אַתָּ֗ה תַּנְחִיל֙ אֶת הָ/עָ֣ם הַ/זֶּ֔ה אֶת הָ/אָ֕רֶץ אֲשֶׁר נִשְׁבַּ֥עְתִּי לַ/אֲבוֹתָ֖/ם לָ/תֵ֥ת לָ/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/001/006.yaml
  text: Be strong and courageous[b][a], for you shall cause this people to inherit the land that I swore to their fathers to give to them.
translation:
  language: zh_hans
  text: 你要刚强勇敢，因为你必使这百姓承受我向他们列祖起誓要赐给他们的那地。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “使这百姓承受”也可译作“把这地分给这百姓为业”。希伯来文动词为使役形式，表示约书亚要使百姓得着这地为产业。“列祖”指以色列的先祖，尤其是族长，也可译作“祖先”。
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲזַק וֶאֱמָץ
  choice: 要刚强勇敢
  rationale: 两个阳性单数祈使式构成固定的劝勉语；“刚强勇敢”自然、庄重，并兼顾力量与胆量、决心的含义。
- source_word: כִּי
  choice: 因为
  rationale: 在此引出前述命令的理由，保留明确的因果关系。
- source_word: תַּנְחִיל
  choice: 你必使……承受
  rationale: נחל 的使役形表示约书亚要使百姓取得产业；“使……承受”保留使役意义，也保留土地作为产业的语义。
- source_word: הָעָם הַזֶּה
  choice: 这百姓
  rationale: 保留希伯来文集合单数及指示语气；“这百姓”符合现代中文圣经叙事的庄重语域。
- source_word: הָאָרֶץ
  choice: 那地
  rationale: 语境指上帝应许赐下的特定土地；用“那地”与后面的关系从句自然衔接。
- source_word: נִשְׁבַּעְתִּי
  choice: 我……起誓
  rationale: 准确表达上帝先前所立的誓言，并维持直接陈述。
- source_word: לַאֲבוֹתָם
  choice: 向他们列祖
  rationale: 此处指以色列的先祖，尤其是族长；“列祖”比日常意义的“父亲们”更准确，也保留男性先祖及圣约历史背景。
- source_word: לָתֵת לָהֶם
  choice: 要赐给他们
  rationale: 表达誓言的内容；“赐”适合上帝作为赐予者的语境，且受词“他们”保持明确。
theological_decisions:
- issue: 使役动词 תַּנְחִיל 如何表达约书亚与百姓得地的关系
  choice: 你必使这百姓承受
  alternative: 你必把这地分给这百姓为业
  rationale: 主译保留希伯来文使役结构，不把约书亚的角色仅限定为分配土地，也不削弱上帝作为应许之地最终赐予者的语境张力。
- issue: אֲבוֹתָם 所指的先祖
  choice: 他们列祖
  alternative: 他们的祖先
  rationale: “列祖”既反映阳性复数形式，也在此圣约语境中自然指向以色列的先祖，尤其是族长；脚注说明较宽泛的表达。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“承受……地”略具圣经语域，但能清楚传达产业继承的意象；避免以更流畅的意译抹去原文的使役结构。脚注标记置于其所说明的整句末尾。
