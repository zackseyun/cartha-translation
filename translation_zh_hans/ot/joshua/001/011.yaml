  text: עִבְר֣וּ בְּ/קֶ֣רֶב הַֽ/מַּחֲנֶ֗ה וְ/צַוּ֤וּ אֶת הָ/עָם֙ לֵ/אמֹ֔ר הָכִ֥ינוּ לָ/כֶ֖ם צֵידָ֑ה כִּ֞י בְּ/ע֣וֹד שְׁלֹ֣שֶׁת יָמִ֗ים אַתֶּם֙ עֹֽבְרִים֙ אֶת הַ/יַּרְדֵּ֣ן הַ/זֶּ֔ה לָ/בוֹא֙ לָ/רֶ֣שֶׁת אֶת הָ/אָ֔רֶץ אֲשֶׁר֙ יְהוָ֣ה אֱלֹֽהֵי/כֶ֔ם נֹתֵ֥ן לָ/כֶ֖ם לְ/רִשְׁתָּֽ/הּ׀־׀־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/001/011.yaml
  text: Go through the midst of the camp and command the people[a], saying, ‘Prepare provisions for yourselves, because within three days you are crossing this Jordan to go in to take possession of the land that Yahweh your God is giving you to possess it.’
translation:
  language: zh_hans
  text: 你们要在营中穿行，吩咐百姓说：‘要为自己预备粮食，因为三天之内[a]，你们就要渡过这约旦河，进入那地，取得雅威你们的上帝赐给你们为业的土地。’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“再过三天”或“三天以后”。希伯来语短语表示渡河前尚有一段很短的时间；这里译作“三天之内”。
    reason: 保留时间短语可能的不同理解。
lexical_decisions:
- source_word: עִבְרוּ בְּקֶרֶב הַמַּחֲנֶה
  choice: 走遍营中
  rationale: עִבְרוּ在这里命令众官长从营中穿行；“走遍营中”既保留在营内行走的空间含义，也自然表达向全营传令的语境。
- source_word: וְצַוּוּ אֶת־הָעָם
  choice: 吩咐百姓
  rationale: צוה带有权威性的命令含义；现代汉语中“吩咐”在此庄重而自然，避免“命令百姓”可能产生的生硬感。
- source_word: הָכִינוּ לָכֶם צֵידָה
  choice: 要为自己预备食物
  rationale: צֵידָה指为出行预备的食物或给养；此处译作“食物”清楚易懂，“为自己”对应לָכֶם。
- source_word: בְּעוֹד שְׁלֹשֶׁת יָמִים
  choice: 三天之内
  rationale: 该短语表示渡河前尚余的一段短暂时间；“三天之内”保留临近性，同时不把时间关系解释得过分精确。
- source_word: אַתֶּם עֹבְרִים אֶת־הַיַּרְדֵּן הַזֶּה
  choice: 你们就要渡过这约旦河
  rationale: 分词עֹבְרִים表达即将发生而确定的行动；“就要”体现迫近感，“这约旦河”保留原文指示词。
- source_word: לָבוֹא לָרֶשֶׁת אֶת־הָאָרֶץ
  choice: 进去取得……土地
  rationale: 两个不定式表达进入并取得土地的目的；“取得”兼顾ירשׁ在征服和承受产业语境中的含义。
- source_word: נֹתֵן לָכֶם לְרִשְׁתָּהּ
  choice: 赐给你们、让你们占有
  rationale: נֹתֵן的分词形式把赐予呈现为正在实现且确定的行动；后半句保留原文再次使用ירשׁ所强调的实际占有。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；“雅威”以现代汉语中较接近学界通行重构读音的形式保留其专名性质，不以称号取代。
- issue: 土地既是神所赐又须由百姓取得
  choice: 同时保留“取得”和“赐给”
  alternative: 只强调承受产业，或只强调军事占领
  rationale: 原文并置人的进入、取得与雅威的赐予；译文保留这层张力，不把两者化约为单一解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“走遍营中”“就要渡过”保持叙事的行动感；引语简洁直接。神名使用“雅威”，土地相关措辞同时保留赐予、进入和占有的层面。
