revisions:
- from: 你们要走遍营中，吩咐百姓说：“要为自己预备食物，因为三天之内[a]，你们就要渡过这约旦河，进去取得雅威你们的上帝赐给你们、让你们占有的土地。”
  to: 你们要在营中穿行，吩咐百姓说：‘要为自己预备粮食，因为三天之内[a]，你们就要渡过这约旦河，进入那地，取得雅威你们的上帝赐给你们为业的土地。’
  rationale: 将“走遍”改为“在营中穿行”，避免无根据地加强范围；将“食物”改为“粮食”，体现行旅供给；重组末句，清楚表达百姓进入并取得土地，以及该地由雅威赐给他们为业。时间脚注保留原有对争议表达的审慎说明。
