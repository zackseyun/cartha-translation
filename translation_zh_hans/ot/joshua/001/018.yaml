  text: כָּל אִ֞ישׁ אֲשֶׁר יַמְרֶ֣ה אֶת פִּ֗י/ךָ וְ/לֹֽא יִשְׁמַ֧ע אֶת דְּבָרֶ֛י/ךָ לְ/כֹ֥ל אֲשֶׁר תְּצַוֶּ֖/נּוּ יוּמָ֑ת רַ֖ק חֲזַ֥ק וֶ/אֱמָֽץ־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/001/018.yaml
  text: Every man who rebels against your command and does not listen to your words in all that you command him shall be put to death[a]. Only be strong and courageous.
translation:
  language: zh_hans
  text: 凡违抗你的命令、对你所吩咐的一切都不听从的人，都必被处死[a]。你只管刚强勇敢！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “你的命令”直译为“你的口”；这是希伯来语表达，指从口中发出的权威命令。
    reason: 保留原文的身体意象和权威性转喻，同时使正文自然易懂。
lexical_decisions:
- source_word: כָּל אִישׁ
  choice: 凡……的人
  rationale: 希伯来语直译为“每一个人/男子”，在此为逐一涵盖的泛指结构；现代汉语用“凡……的人”自然表达其分配性和普遍范围，也不增添原文未强调的性别信息。
- source_word: יַמְרֶה אֶת פִּיךָ
  choice: 违抗你的命令
  rationale: מרה 表示抗拒、反叛权威；“你的口”是指从约书亚口中发出的权威命令。译作“违抗你的命令”既保留权威关系，也符合现代汉语。
- source_word: וְלֹא יִשְׁמַע אֶת דְּבָרֶיךָ
  choice: 不听从
  rationale: שׁמע 在此不只是听见，也含留意并服从之意。“听从”既保留听的意象，又表达实际顺服，并与前面的“违抗”形成自然对应。
- source_word: לְכֹל אֲשֶׁר תְּצַוֶּנּוּ
  choice: 你一切吩咐
  rationale: 该短语限定服从的完整范围。“你一切吩咐”简洁地表达“关于你所吩咐他的一切”，不削弱全称意味。
- source_word: יוּמָת
  choice: 必被处死
  rationale: 此词为使役意义的被动形式，表示由人执行的死刑，而非仅仅“必死”。“被处死”保留司法惩罚的被动性质。
- source_word: רַק
  choice: 只管
  rationale: רַק 在这里引出带强调意味的劝勉。“只管”在现代汉语中自然体现“唯要/只要专心如此”的语气，而不把它误解为转折。
- source_word: חֲזַק וֶאֱמָץ
  choice: 刚强勇敢
  rationale: 这是本章反复出现的劝勉，兼有坚定、有力量和勇敢无惧之意。“刚强勇敢”庄重、通顺，并适合保持全书关键用语的一致性。
theological_decisions:
- issue: 泛指阳性表达
  choice: 凡……的人
  alternative: 凡男子／每一个人
  rationale: אִישׁ 采用阳性单数形式，但在 כָּל אִישׁ 结构中具有逐一涵盖的泛指作用。汉语“凡……的人”保留普遍性，不把自然语法形式扩大成只限男性的神学或法律主张。
- issue: 死刑的司法性质
  choice: 必被处死
  alternative: 必死／必须处决
  rationale: יוּמָת 指施加于违抗者的死亡刑罚。“必被处死”忠实保留司法和被动语态，同时不增添执行程序等原文没有的信息。
- issue: 约书亚命令的权威性
  choice: 你的命令
  alternative: 你的口／你所说的
  rationale: “你的口”是希伯来语中表示权威发令的转喻。正文传达其实际意义，但以脚注保留原文意象，避免把该权威解释为约书亚个人拥有不受限制的绝对权柄。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“违抗”比单纯“不服从”更能体现 מרה 的反叛力度；“听从”保留 שׁמע 的听觉意象及服从含义；末句用感叹号呈现会众对约书亚的有力劝勉。
