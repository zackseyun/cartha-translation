  text: 于是，约书亚吩咐百姓的官长说：
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְצַו
  choice: 于是……吩咐
  rationale: 该叙事性连续形式推动事件向前发展；“于是”自然表达承接关系，“吩咐”保留צוה的指令力度。
- source_word: יְהוֹשֻׁעַ
  choice: 约书亚
  rationale: 采用现代中文圣经传统中通行的人名音译。
- source_word: אֶת
  choice: 不单独译出
  rationale: 这是直接宾语标记；其语法功能由“吩咐百姓的官长”这一动宾结构体现。
- source_word: שֹׁטְרֵי
  choice: 官长
  rationale: 此词指承担行政和组织职责的官员，而非军事统帅；“官长”在庄重而易懂的中文圣经语体中能较准确地表达这一身份。
- source_word: הָעָם
  choice: 百姓
  rationale: 这里指作为整体的以色列民众；“百姓”比“民族”更符合本段具体语境，也较为自然。
- source_word: לֵאמֹר
  choice: 说
  rationale: 该不定式结构用于引出下一节的直接引语；中文以“说：”简洁、自然地保留其话语衔接功能。
