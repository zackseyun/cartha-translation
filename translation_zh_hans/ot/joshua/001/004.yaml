base_translation:
  language: en
  yaml_path: translation/ot/joshua/001/004.yaml
  text: From the wilderness and this Lebanon as far as the great river[a], the Euphrates River—all the land of the Hittites—and as far as the Great Sea, toward the going down of the sun[b], shall be your border.
translation:
  language: zh_hans
  text: 从旷野和这黎巴嫩，直到大河，就是幼发拉底河，赫人的全地；又直到大海[a]，向着日落之处[b]，必成为你们的疆界。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 即地中海。
    reason: cross_reference
  - marker: b
    text: 或译“向西”；原文直译为“向着日落之处”。
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵהַמִּדְבָּר
  choice: 从旷野起
  rationale: מִדְבָּר指荒野、旷野或沙漠地带；“旷野”既符合圣经地理语境，也不把地貌过度限定为沙漠。
- source_word: וְהַלְּבָנוֹן הַזֶּה
  choice: 和这黎巴嫩
  rationale: 保留希伯来文明确的指示词הַזֶּה（“这”），并将黎巴嫩作为地名处理，不擅自增补“山脉”。
- source_word: וְעַד הַנָּהָר הַגָּדוֹל נְהַר פְּרָת
  choice: 直到大河，就是幼发拉底河
  rationale: 保留“大河”与随后“幼发拉底河”的同位说明结构；“直到”自然表达边界语境中的עַד。
- source_word: כֹּל אֶרֶץ הַחִתִּים
  choice: 包括赫人的全地
  rationale: 忠实表达כֹּל（“全、所有”）以及“赫人之地”的族群—地理称谓；补用“包括”使其在汉语长句中与边界范围清楚衔接。
- source_word: וְעַד הַיָּם הַגָּדוֹל
  choice: 又直到大海
  rationale: 正文保留希伯来文“大海”这一地理称谓，不直接以“地中海”替换；具体所指置于脚注。
- source_word: מְבוֹא הַשָּׁמֶשׁ
  choice: 向着日落之处
  rationale: 保留原文“太阳落下／进入之处”的意象，同时以自然汉语表达；其惯用方位义“西方”列入脚注。
- source_word: יִהְיֶה גְּבוּלְכֶם
  choice: 都要作你们的疆界
  rationale: גְּבוּל在此为所列地域的边界或疆界；“都要作”表达未完成式在应许性宣告中的将来意义，并使全句在汉语中完整自然。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“疆界”适合领土边界语境；保留“这黎巴嫩”“大河”“大海”和“日落之处”等原文特色。英文咨询层的脚注a位置显然与其内容不符，因此按希伯来文所指将其标在“大海”之后。
