id: JOS.1.13
reference: Joshua 1:13
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: זָכוֹר֙ אֶת הַ/דָּבָ֔ר אֲשֶׁ֨ר צִוָּ֥ה אֶתְ/כֶ֛ם מֹשֶׁ֥ה עֶֽבֶד יְהוָ֖ה לֵ/אמֹ֑ר יְהוָ֤ה אֱלֹהֵי/כֶם֙ מֵנִ֣יחַ לָ/כֶ֔ם וְ/נָתַ֥ן לָ/כֶ֖ם אֶת הָ/אָ֥רֶץ הַ/זֹּֽאת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/001/013.yaml
  text: Remember the word that Moses the servant of Yahweh commanded you[a], saying, ‘Yahweh your God is giving you rest and will give you this land.’
translation:
  language: zh_hans
  text: 要记住耶和华的仆人摩西吩咐你们的话。他说：“耶和华你们的神正使你们得享安息，并已把这地赐给你们[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“并将把这地赐给你们。”希伯来语动词在这里既可理解为已经成就，也可表达确定的将来。河东各支派当时已经领受了自己的产业。
    reason: 保留 וְנָתַן 在此处可指完成行动或确定将来的两种理解。
lexical_decisions:
- source_word: זָכוֹר
  choice: 要记住
  rationale: 这是阳性单数的祈使式，在此由约书亚向相关支派作直接劝告；“要记住”自然保留了命令语气。
- source_word: הַדָּבָר
  choice: ……的话
  rationale: דבר 在这里指摩西先前所说并吩咐的内容；译作“话”既保留原文用词，也由“吩咐”体现其命令性质。
- source_word: צִוָּה אֶתְכֶם
  choice: 吩咐你们
  rationale: צוה 表示具有权威的指示；“吩咐”在现代汉语中庄重自然，并准确体现其力度。
- source_word: עֶבֶד יְהוָה
  choice: 耶和华的仆人
  rationale: עבד 在这里是摩西受神差遣、事奉神的尊称；“仆人”比“奴隶”更符合语境。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代简体中文圣经读者最熟悉的神名音译，明确保留专名性质，而不以“主”这一称号替代。
- source_word: לֵאמֹר
  choice: 他说
  rationale: 这是引出直接引语的惯用形式；拆成“他说”比生硬的“说”更符合现代汉语叙述。
- source_word: אֱלֹהֵיכֶם
  choice: 你们的神
  rationale: 直接保留第二人称复数所属关系及盟约语境中的称呼。
- source_word: מֵנִיחַ לָכֶם
  choice: 正使你们得享安息
  rationale: 使役分词表达使人安歇、获得安定；“正使……得享安息”兼顾其使役意义和持续进行的语气。
- source_word: וְנָתַן לָכֶם
  choice: 并已把……赐给你们
  rationale: 完成式可按叙事背景理解为已经落实的赐予：约旦河东的支派已经领受产业；同时以脚注保留可理解为确定将来的可能。
- source_word: הָאָרֶץ הַזֹּאת
  choice: 这地
  rationale: 简洁对应带指示词的名词短语，并自然指向已经分给这些支派的土地。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 两者都是对四字神名的音译；正文采用现代中文圣经传统中最通行、普通读者最易识别的“耶和华”，同时不以称号“主”替代神名。
- issue: וְנָתַן 所表达的时间和体貌
  choice: 并已把这地赐给你们
  alternative: 并将把这地赐给你们
  rationale: 希伯来语完成式既可指已成事实，也可在应许语境中表达确定的将来。鉴于受话的河东支派已经获赐产业，正文采用完成意义；脚注保留将来理解，避免消除原文的体貌张力。
- issue: מֵנִיחַ 的“安息”含义
  choice: 正使你们得享安息
  alternative: 正使你们安顿下来
  rationale: “安息”可涵盖停止漂泊、脱离争战和安居的复合意义，比只译作“安顿”更能保留本书相关主题的开放性。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。用“得享安息”保留土地、安居和止息争战之间的语义联系；将引语公式自然处理为独立的“他说”。脚注标记紧跟其实际解释的“赐给你们”之后。
