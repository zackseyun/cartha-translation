source:
  edition: WLC
  text: לֹֽא יִתְיַצֵּ֥ב אִישׁ֙ לְ/פָנֶ֔י/ךָ כֹּ֖ל יְמֵ֣י חַיֶּ֑י/ךָ כַּֽ/אֲשֶׁ֨ר הָיִ֤יתִי עִם מֹשֶׁה֙ אֶהְיֶ֣ה עִמָּ֔/ךְ לֹ֥א אַרְפְּ/ךָ֖ וְ/לֹ֥א אֶעֶזְבֶֽ/ךָּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/001/005.yaml
  text: No man will stand before you all the days of your life[a]. Just as I was with Moses, I will be with you[c][b]. I will not fail you or forsake you.
translation:
  language: zh_hans
  text: 你一生的日子里，没有人能在你面前站立得住[a][b]。我怎样与摩西同在，也必照样与你同在。我绝不会丢下你[c]，也绝不会离弃你。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“没有人能抵挡你。”希伯来语“在你面前站立得住”在这里可指成功抵抗。
    reason: lexical_alternative
  - marker: b
    text: “人”的希伯来语原词是阳性单数形式，但在这里泛指人；在此语境中指任何对手。
    reason: lexical_alternative
  - marker: c
    text: 或译：“我绝不会松手不管你。”这个动词可表示松手、任其落下或不再扶持。
    reason: lexical_alternative
lexical_decisions:
- source_word: יִתְיַצֵּב
  choice: 站立得住
  rationale: 该词在本节的征战语境中指站出来对抗并成功抵挡。“站立得住”保留希伯来语意象，同时自然表达无人能抵挡约书亚。
- source_word: אִישׁ
  choice: 人
  rationale: 希伯来语为阳性单数名词，在这里泛指任何人，语境中特别指人的对手。现代汉语用“人”最自然，不把所指错误地限定为成年男性。
- source_word: לְפָנֶיךָ
  choice: 在你面前
  rationale: 直译为“在你面前”；与“站立得住”连用，既保留原文空间意象，也传达敌对抵挡之意。
- source_word: כֹּל יְמֵי חַיֶּיךָ
  choice: 你一生的日子
  rationale: 贴近原文“你生命的一切日子”的结构，清楚表示约书亚有生之年的全部时间。
- source_word: כַּאֲשֶׁר הָיִיתִי עִם מֹשֶׁה
  choice: 我怎样与摩西同在
  rationale: כַּאֲשֶׁר引出比较；“怎样……也照样……”在现代汉语中自然地呈现神过去与摩西同在和将来与约书亚同在之间的对应。
- source_word: אֶהְיֶה עִמָּךְ
  choice: 也必照样与你同在
  rationale: 忠实表达神所应许的同在；“必”体现此处承诺的确定性，而不增添原文之外的教义解释。
- source_word: אַרְפְּךָ
  choice: 绝不会丢下你
  rationale: רפה的使役形在此可表示松手、任其落下或不再扶持。“丢下你”保留不让约书亚失去扶持的形象，并与后面的“离弃”有所区别。
- source_word: אֶעֶזְבֶךָּ
  choice: 绝不会离弃你
  rationale: עזב常指离开、抛弃。“离弃”符合庄重的应许语体，并与前一动词共同表达全面而坚定的扶持。
theological_decisions:
- issue: אִישׁ的阳性单数形式及其泛指作用
  choice: 没有人
  alternative: 没有一个男子；没有任何对手
  rationale: 原词形式为阳性单数，但本节用作泛指，并非把应许限制在男性对手之内。汉语“人”能自然表达这种普遍范围；脚注保留其形式和语境信息。
- issue: לֹא אַרְפְּךָ וְלֹא אֶעֶזְבֶךָּ双重否定应许的区别
  choice: 我绝不会丢下你，也绝不会离弃你
  alternative: 我绝不会松手不管你，也绝不会撇弃你
  rationale: 前一动词侧重不松手、不停止扶持，后一动词侧重不离开、不抛弃。译文尽量保留两者的区别，不把它们合并成一个笼统概念。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“站立得住”保留原文的征战意象；“怎样……也必照样……”自然呈现比较结构；两个“绝不会”对应原文的双重否定，并保持郑重、确定的应许语气。
