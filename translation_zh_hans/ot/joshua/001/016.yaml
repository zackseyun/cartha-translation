  text: וַֽ/יַּעֲנ֔וּ אֶת יְהוֹשֻׁ֖עַ לֵ/אמֹ֑ר כֹּ֤ל אֲשֶׁר צִוִּיתָ֨/נוּ֙ נַֽעֲשֶׂ֔ה וְ/אֶֽל כָּל אֲשֶׁ֥ר תִּשְׁלָחֵ֖/נוּ נֵלֵֽךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/001/016.yaml
  text: And they answered Joshua[a], saying, “All that you have commanded us we will do, and wherever you send us we will go.”
translation:
  language: zh_hans
  text: 他们回答约书亚说：“凡你吩咐我们的，我们都必照办；你差遣我们到哪里[a]，我们都必去。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或更直译：“你差遣我们到的每一个地方，我们都必去。”
    reason: 说明וְאֶל כָּל אֲשֶׁר在此与“差遣／去”搭配时较贴近字面的地点表达。
lexical_decisions:
- source_word: וַיַּעֲנוּ
  choice: 他们回答
  rationale: ענה的Qal连续式在叙事中引出回应；“回答”自然保留了承接上文的功能。
- source_word: אֶת יְהוֹשֻׁעַ
  choice: 约书亚
  rationale: 宾格标记所引出的“约书亚”是回答的对象；现代汉语以“回答约书亚”自然表达。
- source_word: לֵאמֹר
  choice: 说
  rationale: 该不定式结构用于引出直接引语；译作“说”简洁并保留希伯来语的叙事形式。
- source_word: כֹּל אֲשֶׁר צִוִּיתָנוּ
  choice: 凡你吩咐我们的
  rationale: כֹּל אֲשֶׁר表示所吩咐之事的全部；“凡……的”既涵盖总体性，也符合庄重而自然的现代汉语。
- source_word: נַעֲשֶׂה
  choice: 我们都必照办
  rationale: עשה在此指实行所受的命令；“照办”清楚表达按吩咐行事，“必”体现未完成式在承诺语境中的坚定将来意味。
- source_word: וְאֶל כָּל אֲשֶׁר תִּשְׁלָחֵנוּ
  choice: 你差遣我们到哪里
  rationale: 此短语在שלח与הלך的搭配中具有地点意义。“到哪里”自然传达任何受差往之处，同时不把军旅或使命性质说得过满。
- source_word: נֵלֵךְ
  choice: 我们都必去
  rationale: הלך是常用的“去、行走”；此处译作“必去”简明地表达众人的承诺。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“吩咐”体现约书亚发令的权柄而不过分生硬；“照办”使ענה—צוה—עשה所构成的回应与执行关系清晰自然。脚注标记置于其实际说明的地点短语所在句末。
