  text: וַ/יִּקַּ֣ח יְהוֹשֻׁ֣עַ אֶת עָכָ֣ן בֶּן זֶ֡רַח וְ/אֶת הַ/כֶּ֣סֶף וְ/אֶת הָ/אַדֶּ֣רֶת וְֽ/אֶת לְשׁ֣וֹן הַ/זָּהָ֡ב וְֽ/אֶת בָּנָ֡י/ו וְֽ/אֶת בְּנֹתָ֡י/ו וְ/אֶת שׁוֹר/וֹ֩ וְ/אֶת חֲמֹר֨/וֹ וְ/אֶת צֹאנ֤/וֹ וְ/אֶֽת אָהֳל/וֹ֙ וְ/אֶת כָּל אֲשֶׁר ל֔/וֹ וְ/כָל יִשְׂרָאֵ֖ל עִמּ֑/וֹ וַ/יַּעֲל֥וּ אֹתָ֖/ם עֵ֥מֶק עָכֽוֹר־־־־־־־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/024.yaml
  text: Then Joshua took Achan son of Zerah[a], and the silver, the cloak, the bar of gold, his sons, his daughters, his ox, his donkey, his flock, his tent[b], and all that belonged to him—and all Israel with him—and they brought them up to the Valley of Achor.
translation:
  language: zh_hans
  text: 于是，约书亚带了谢拉的儿子亚干，以及那银子、外袍、舌形金块[a]、亚干的儿子和女儿、他的牛、驴、羊群、帐篷和他所有的一切；以色列众人都与他同去；他们把这些人和物带到亚割谷[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文作“金子的舌头”，指一块舌头形状的金子；传统也译作“金楔”。
    reason: lexical_alternative
  - marker: b
    text: “亚割”这个名称听起来像希伯来语中表示“灾祸”的词。
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּקַּח
  choice: 于是，约书亚带着
  rationale: 叙事性连续式推进事件，译作“于是”；本节语境是约书亚将人和物带往亚割谷，“带着”比单独的“拿”更符合现代汉语，同时不额外强化为“抓住”或“押解”。
- source_word: עָכָן בֶּן זֶרַח
  choice: 谢拉的儿子亚干
  rationale: 保留希伯来语父名结构，并采用现代中文圣经人名的通行音译。
- source_word: הַכֶּסֶף
  choice: 那银子
  rationale: כֶּסֶף 的本义是“银子”；指向上文已提到的赃物，故加“那”，不具体化为银币。
- source_word: הָאַדֶּרֶת
  choice: 外袍
  rationale: אַדֶּרֶת 指有特色的外衣或披衣；“外袍”自然庄重，也避免“斗篷”可能带来的现代样式联想。
- source_word: לְשׁוֹן הַזָּהָב
  choice: 舌形金块
  rationale: לָשׁוֹן 字面为“舌头”，此处描述一块形似舌头的金子。“舌形金块”既保留原文形象，又让现代读者明白所指物件。
- source_word: בָּנָיו ... בְּנֹתָיו
  choice: 亚干的儿子和女儿
  rationale: 原文明确分别列出儿子与女儿；补出“亚干的”可避免连续所属关系在中文中产生歧义。
- source_word: שׁוֹרוֹ
  choice: 他的牛
  rationale: שׁוֹר 为单数牛科牲畜；“牛”在中文中比“公牛”或“阉牛”更少过度限定。
- source_word: חֲמֹרוֹ
  choice: 驴
  rationale: 采用现代标准汉语的普通名称，并与前面的“他的”共同支配。
- source_word: צֹאנוֹ
  choice: 羊群
  rationale: צֹאן 是绵羊、山羊等小型牲畜的集合称谓；“羊群”自然地保留集合意义。
- source_word: אָהֳלוֹ
  choice: 帐篷
  rationale: 直译其通常意义，不扩展为家室或营帐。
- source_word: כָּל אֲשֶׁר לוֹ
  choice: 他所有的一切
  rationale: 概括属于亚干的全部所有物，保留原文宽泛的范围。
- source_word: וְכָל יִשְׂרָאֵל עִמּוֹ
  choice: 以色列众人也和约书亚一起
  rationale: 语法上的“和他一起”最自然地回指本句行动主体约书亚；中文明确补名，以免误读为与亚干一起。
- source_word: וַיַּעֲלוּ אֹתָם עֵמֶק עָכוֹר
  choice: 把他们带到亚割谷
  rationale: עָלָה 在此表示带领人和物前往该谷；现代汉语用“带到”自然。“他们”保留复数受词，可涵盖前列的人与物。
theological_decisions:
- issue: 是否在正文中断定亚干儿女有罪或无罪
  choice: 只照原文列出“亚干的儿子和女儿”，不作定罪或开脱性的说明
  alternative: 说明他们参与犯罪，或说明他们只是被带到现场而未受惩罚
  rationale: 本节只说他们被带到亚割谷，并未明说其知情程度、罪责或最终遭遇；译文应保留这项叙事与神学张力。
- issue: “和他一起”所指为何人
  choice: 明确译作“和约书亚一起”
  alternative: 保留为可能指亚干的“和他一起”
  rationale: 约书亚是 וַיִּקַּח 的主语，而“以色列众人”参与随后行动；将代词理解为约书亚最符合句法和叙事进程，且不改变对亚干家属处境的判断。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。人名与地名使用简体中文圣经传统中常见的“约书亚、谢拉、亚干、亚割谷”。通过分号处理长串列举，并补出必要的所属词和代词所指，以符合自然汉语；不对亚干家人的罪责作超出本节的解释。
