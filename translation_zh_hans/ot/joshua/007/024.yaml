  to: 于是，约书亚带了谢拉的儿子亚干，以及那银子、外袍、舌形金块[a]、亚干的儿子和女儿、他的牛、驴、羊群、帐篷和他所有的一切；以色列众人都与他同去；他们把这些人和物带到亚割谷[b]。
