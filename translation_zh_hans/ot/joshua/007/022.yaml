base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/022.yaml
  text: So Joshua sent messengers[a], and they ran to the tent; and behold, it was hidden in his tent, with the silver underneath it.
translation:
  language: zh_hans
  text: 于是，约书亚派出使者；他们跑到那帐篷去。看哪，那件外衣藏在他的帐篷里，银子在衣服底下。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译为“银子在它下面”。“它”为阴性单数，最自然是指上一节所说的那件外衣。
    reason: 说明代词所指，并保留原文形式与上下文之间的关系。
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: 派出
  rationale: 在叙事中自然表达“差遣、派遣”，并与宾语“使者”搭配顺畅。
- source_word: מַלְאָכִים
  choice: 使者
  rationale: 此处显然指约书亚派出的人员，而非天使；“使者”保留原词“受差遣者”的含义。
- source_word: וַיָּרֻצוּ
  choice: 他们便跑到
  rationale: רץ明确表示奔跑；保留叙事的急迫感，不弱化为“赶去”。
- source_word: הָאֹהֱלָה
  choice: 到那帐篷那里
  rationale: 词尾方向成分表示朝帐篷而去；定冠词译作“那”，上下文可知是亚干的帐篷。
- source_word: וְהִנֵּה
  choice: 看哪
  rationale: 保留叙事中突然发现眼前情景的提示和戏剧性。
- source_word: טְמוּנָה
  choice: 那件外衣藏在
  rationale: 阴性单数形式最自然地回指上一节阴性名词“外衣”；“藏在”不额外限定为埋在土中。
- source_word: בְּאָהֳלוֹ
  choice: 他的帐篷里
  rationale: 按原文地点短语和第三人称阳性单数后缀直译，所指为亚干。
- source_word: וְהַכֶּסֶף
  choice: 银子
  rationale: 保留原文并列增加的现场细节；汉语用逗号连接即可自然表达。
- source_word: תַּחְתֶּיהָ
  choice: 在衣服底下
  rationale: 阴性单数后缀最自然回指上一节的外衣；为避免汉语代词指向含混，明确译出“衣服”。
theological_decisions: []
