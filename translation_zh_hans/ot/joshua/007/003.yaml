base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/003.yaml
  text: They returned to Joshua and said to him[a], “Do not have all the people go up. Let about two thousand men, or about three thousand men, go up and strike Ai. Do not weary all the people there[b], for they are few.”
translation:
  language: zh_hans
  text: 他们回到约书亚那里，对他说：“不要让所有百姓都上去。让约两千人，或约三千人，上去攻打艾城。不要叫所有百姓都到那里劳累，因为艾城的人数很少。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּשֻׁבוּ אֶל־יְהוֹשֻׁעַ
  choice: 他们回到约书亚那里
  rationale: שוב表示侦察之后返回；“回到……那里”符合现代汉语叙事表达，也保留了返回约书亚身边的方向。
- source_word: אַל יַעַל כָּל־הָעָם
  choice: 不要让所有百姓都上去
  rationale: אַל加未完成式在此表示劝阻或禁止。עלה保留为“上去”，既可能反映地势，也属于军事进发的惯用表达；העם仍译“百姓”，不在正文中收窄为“军队”。
- source_word: כְּאַלְפַּיִם אִישׁ אוֹ כִּשְׁלֹשֶׁת אֲלָפִים אִישׁ
  choice: 约两千人，或约三千人
  rationale: 前缀כ在两处均表示约数；איש在数词之后自然译作“人”，上下文已表明是参战男子，无须增译“士兵”。
- source_word: יַעֲלוּ וְיַכּוּ אֶת־הָעָי
  choice: 上去攻打艾城
  rationale: עלה译“上去”，与前句呼应；נכה在此指军事打击，汉语“攻打”比字面“击打”自然，又不像“击败”那样预先断定战果。
- source_word: אַל־תְּיַגַּע שָׁמָּה אֶת־כָּל־הָעָם
  choice: 不要叫所有百姓都到那里劳累
  rationale: יגע的Piel可指使人疲乏、劳累或承受不必要的辛劳。“叫……劳累”保留使役意义，也适合此处不必动员全体的语境；שמה明确译为“到那里”。
- source_word: כִּי מְעַט הֵמָּה
  choice: 因为他们人数很少
  rationale: 直陈艾城居民或守军人数少；补出“人数”使汉语指向清楚，却不进一步限定为守军。
- source_word: הָעָם
  choice: 百姓
  rationale: 原词是较宽泛的“民、百姓”，虽然语境主要指可出战的人，正文仍保留词义范围，避免直接解释为“军队”。
