base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/025.yaml
  text: And Joshua said[a], “Why have you troubled us? Yahweh will trouble you this day.” And all Israel stoned him with stones[c][b], and they burned them with fire and stoned them with stones.
translation:
  language: zh_hans
  text: 约书亚说：“你为什么给我们招来祸患？耶和华今天必给你招来祸患。”[a] 以色列众人就用石头打死他[c]；他们用火焚烧他们，又用石头打死他们。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “给我们招来祸患”和“给你招来祸患”译自同一个希伯来语动词；原文借重复这个词形成对应的双关。
    reason: lexical_alternative
  - marker: b
    text: 原文先用单数“他”，随后改用复数“他们”。这复数可能包括亚干以及与他一同受审判的人或事物；译文保留这一转换，不明确限定所指。
    reason: alternative_reading
  - marker: c
    text: 本节前后使用了两个不同的希伯来语动词来描述以石头处死；两者在这里都与用石头施行死刑有关，中文均译为“用石头打死”。
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲכַרְתָּנוּ / יַעְכֳּרְךָ
  choice: 给我们招来祸患 / 给你招来祸患
  rationale: עכר表示带来祸患、灾难或扰乱。两处采用同一表达，保留原文的重复、双关和对应关系，同时符合现代汉语表达。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的专名形式，表明原文在此使用的是以色列上帝的名字，而不是一般性的称号。
- source_word: בַּיּוֹם הַזֶּה
  choice: 今天
  rationale: 准确表达原文“在这日”的即时性，在现代汉语中自然、庄重。
- source_word: וַיִּרְגְּמוּ אֹתוֹ ... אֶבֶן
  choice: 用石头打他
  rationale: רגם在这里指以石头施刑；译文保留单数宾语“他”和石头这一手段，但避免汉语中不自然的重复。
- source_word: וַיִּשְׂרְפוּ אֹתָם בָּאֵשׁ
  choice: 他们用火焚烧他们
  rationale: 保留原文由单数“他”转为复数“他们”的变化，也保留明确的火烧手段，不擅自限定复数所指。
- source_word: וַיִּסְקְלוּ אֹתָם בָּאֲבָנִים
  choice: 又用石头打他们
  rationale: סקל同样表示用石头击打或处死。译文保留复数宾语；与前一个动词在脚注中说明词形差别。
theological_decisions:
- issue: 亚干的单数指称随后转为复数指称
  choice: 正文保留“他”到“他们”的转换
  alternative: 全部统一为单数，或明确解释为亚干的家人及财物
  rationale: 马所拉文本明确由单数转为复数。上下文虽涉及亚干的家人和财物，但本节没有具体界定复数范围，因此不在译文中消除这一张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“祸患”既保留审判语境的分量，也能自然承载原文重复形成的双关。分号呈现连续行动，并避免改动原文单复数转换。
