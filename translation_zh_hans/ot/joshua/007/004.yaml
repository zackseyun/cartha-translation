base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/004.yaml
  text: So about three thousand men from the people went up there, but they fled before the men of Ai.
translation:
  language: zh_hans
  text: 于是，百姓中约有三千人上到那里，却在艾城人面前逃跑了。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲלוּ
  choice: 上到
  rationale: עלה的基本义是“上去、上到”。此处描述向艾城进发；“上到”保留原文的上行意象，又不把动词本身过度解释为“进攻”。
- source_word: מִן הָעָם
  choice: 百姓中
  rationale: עם直译为“百姓、人民”。这里指从以色列百姓中抽调的一队人；“百姓中”符合现代汉语表达，也不擅自改作“军队”。
- source_word: שָׁמָּה
  choice: 那里
  rationale: 该方向副词指向上文已经提到的目的地，译作“那里”简洁自然。
- source_word: כִּשְׁלֹשֶׁת אֲלָפִים אִישׁ
  choice: 约有三千人
  rationale: 数字前的כִּ表达约数，故译“约有”；אִישׁ在数字后用于计数，译作“人”，不额外明确为原文未直接使用的“士兵”。
- source_word: וַיָּנֻסוּ
  choice: 逃跑了
  rationale: נוס意为“逃跑、逃走”。“逃跑了”准确而自然，并清楚表达这支队伍战败退逃。
- source_word: לִפְנֵי
  choice: 在……面前
  rationale: 在“逃跑”这一语境中，לִפְנֵי表示面对敌方而溃逃。译作“在……面前”保留希伯来语的空间表达及叙事力度。
- source_word: אַנְשֵׁי הָעָי
  choice: 艾城人
  rationale: 该短语字面为“艾的人/男子”，在此指艾城的男性守军。中文圣经地名通常译作“艾城”；“艾城人”自然简洁，也避免把原文没有明说的身份直接限定为“士兵”。
