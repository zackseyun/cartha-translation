base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/018.yaml
  text: Then he brought his household near man by man[a], and Achan son of Carmi, son of Zabdi, son of Zerah, of the tribe of Judah, was taken.
translation:
  language: zh_hans
  text: 于是，约书亚使他的家族按男丁上前；亚干被取出。他是迦米的儿子、撒底的儿子、谢拉的儿子，属于犹大支派。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּקְרֵב
  choice: 让……上前来
  rationale: 使役式表示“使靠近、带到近前、呈上”。在抽签查验的语境中，“让……上前来”自然地表达按程序带到近前。
- source_word: בֵּיתוֹ
  choice: 他的家族
  rationale: בַּיִת 此处指家庭或家族单位，并非房屋；“家族”也能与前文由支派、宗族到家庭的筛选层级相衔接。
- source_word: לַגְּבָרִים
  choice: 按男丁
  rationale: 该短语字面近于“按男人们”，措辞简略，可能指家族中的男性成员按个体或男性分组接受抽签查验；正文保留其男性限定，脚注说明歧义。
- source_word: וַיִּלָּכֵד
  choice: 被取出
  rationale: לכד 的被动式通常表示“被捉住、被取中”。此处指抽签过程中被指认出来；“被取出”保留希伯来语的被动抽签惯用表达，又避免误解为武力抓捕。
- source_word: עָכָן
  choice: 亚干
  rationale: 按现代中文圣经人名的通行译法音译。
- source_word: בֶּן כַּרְמִי בֶן זַבְדִּי בֶּן זֶרַח
  choice: 迦米的儿子、撒底的孙子、谢拉的曾孙
  rationale: 希伯来语连续使用“儿子”表达谱系关系；中文按实际辈分译为儿子、孙子、曾孙，完整保留血统链条且更自然清楚。
- source_word: לְמַטֵּה יְהוּדָה
  choice: 属于犹大支派
  rationale: מַטֶּה 在此为“支派”；介词 לְ 表示归属。
theological_decisions: []
