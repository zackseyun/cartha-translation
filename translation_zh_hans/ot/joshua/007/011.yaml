base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/011.yaml
  text: Israel has sinned[a]. They have also transgressed my covenant that I commanded them, and they have also taken some of what was devoted to destruction, and they have also stolen, and they have also deceived[c][b], and they have also put it among their own belongings.
translation:
  language: zh_hans
  text: 以色列犯了罪。他们还违背了我所吩咐他们的约；他们还从归于毁灭之物中拿了一些[a]，还偷窃，还欺瞒[b]，并且还把它放在自己的财物中[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“拿了当灭之物中的一些”；也可较直译为“拿了禁物中的一些”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“说谎”或“否认此事”。
    reason: lexical_alternative
  - marker: c
    text: 希伯来文直译为“放在自己的器物中”；这里指把所取之物置于自己的财物中。
    reason: lexical_alternative
lexical_decisions:
- source_word: חָטָא
  choice: 犯了罪
  rationale: 直接表达对上帝犯罪的含义，保留原文的神学分量。
- source_word: יִשְׂרָאֵל
  choice: 以色列
  rationale: 保留原文的集体主语；虽然直接犯罪者是亚干，本节却将罪归于以色列。
- source_word: עָבְרוּ אֶת־בְּרִיתִי
  choice: 违背了我的约
  rationale: 自然表达违反盟约的意思，同时保留盟约语境。
- source_word: אֲשֶׁר צִוִּיתִי אוֹתָם
  choice: 我所吩咐他们的
  rationale: 不增添原文未明说的“遵守”等宾语，保留简练结构。
- source_word: לָקְחוּ מִן־הַחֵרֶם
  choice: 拿了当毁灭之物中的东西
  rationale: חֵרֶם在此指被划归毁灭之物；译文传达其处置性质，并用脚注保留更形式对应的说法。
- source_word: גָּנְבוּ
  choice: 偷窃
  rationale: 准确传达动词的通常含义。
- source_word: כִּחֲשׁוּ
  choice: 欺瞒
  rationale: 该词可表示说谎、否认或欺骗；“欺瞒”在此保留较宽的语义范围。
- source_word: שָׂמוּ בִכְלֵיהֶם
  choice: 把那些东西放在自己的物品中
  rationale: כְּלִים可指器具、物件或财物；此处指将被禁之物藏入个人所有物中。
- source_word: וְגַם ... וְגַם ... וְגַם
  choice: 还……还……还……并且还……
  rationale: 重复“还”以保留原文逐项累加控罪的修辞力度。
theological_decisions:
- issue: 一人犯罪却将罪归于整个以色列
  choice: 保留“以色列”这一集体主语，并以复数代词“他们”承接
  alternative: 将主语释义为亚干个人
  rationale: 希伯来文明确以以色列为整体承担陈述中的罪责；译文不应消解这种群体性归罪所形成的神学张力。
translation_notes:
  register: 采用庄重而通顺的现代标准普通话。“违背了我的约”保留盟约语气；重复“还”再现原文控罪层层累加的节奏。所有脚注标记均置于其所说明的短语之后。
