  to: 以色列犯了罪。他们还违背了我所吩咐他们的约；他们还从归于毁灭之物中拿了一些[a]，还偷窃，还欺瞒[b]，并且还把它放在自己的财物中[c]。
  rationale: 修订只处理两处汉语表达：以“从归于毁灭之物中拿了一些”明确原文的来源和部分义；以“把它放在自己的财物中”改善搭配，并保留原文对所置之物数量及כְלִים具体所指的宽泛性。其余措辞保留，以维持原文的盟约语气、群体主语与逐项累加的修辞。
