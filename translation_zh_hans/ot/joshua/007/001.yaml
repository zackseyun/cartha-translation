  text: וַ/יִּמְעֲל֧וּ בְנֵֽי יִשְׂרָאֵ֛ל מַ֖עַל בַּ/חֵ֑רֶם וַ/יִּקַּ֡ח עָכָ֣ן בֶּן כַּרְמִי֩ בֶן זַבְדִּ֨י בֶן זֶ֜רַח לְ/מַטֵּ֤ה יְהוּדָה֙ מִן הַ/חֵ֔רֶם וַ/יִּֽחַר אַ֥ף יְהוָ֖ה בִּ/בְנֵ֥י יִשְׂרָאֵֽל־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/001.yaml
  text: But the sons of Israel acted unfaithfully regarding the things devoted to destruction[a], for Achan son of Carmi, son of Zabdi, son of Zerah, of the tribe of Judah, took some of the things devoted to destruction; so the anger of Yahweh burned against the sons of Israel.
translation:
  language: zh_hans
  text: 以色列人却在当灭之物[a]的事上失信了：犹大支派中，谢拉的曾孙、撒底的孙子、迦米的儿子亚干，拿了一些当灭之物；于是，雅威的怒气便向以色列人燃起。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“归神之物”或“禁物”。希伯来语 חֵרֶם 指分别归给神、因此必须毁灭或不得再供人日常使用的人或物。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמְעֲלוּ ... מַעַל
  choice: 失信了
  rationale: מעל在此表达对神所立禁令的背信，而不只是笼统的“犯罪”。中文用“失信”既自然，也保留盟约性、关系性的意味；认知宾格的强调不机械重复。
- source_word: בְנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 现代汉语中“以色列人”最自然清楚，同时保留全体作为主语的共同体责任。
- source_word: בַּחֵרֶם / מִן הַחֵרֶם
  choice: 当灭之物
  rationale: חֵרֶם指因归给神而须毁灭或撤出日常使用的人或物。“当灭之物”沿用简洁而庄重的圣经汉语表达，并以脚注说明其较宽语义。
- source_word: וַיִּקַּח ... מִן
  choice: 拿了一些
  rationale: 介词מִן具有部分含义；补出“一些”使现代汉语自然，并未限定具体数量。
- source_word: לְמַטֵּה יְהוּדָה
  choice: 犹大支派中
  rationale: מַטֶּה在族谱语境指“支派”；“犹大支派中”也自然衔接后面的家系说明。
- source_word: וַיִּחַר אַף יְהוָה
  choice: 雅威的怒气向……发作
  rationale: 保留希伯来语强烈的发怒意象。“怒气发作”是自然庄重的现代汉语；“向”准确表达בְּ在此所指的对象。
- source_word: יְהוָה
  choice: 雅威
  rationale: 采用神名的音译，保留原文专名而不以称号替代。
- source_word: עָכָן בֶּן כַּרְמִי בֶן זַבְדִּי בֶן זֶרַח
  choice: 谢拉的曾孙、撒底的孙子、迦米的儿子亚干
  rationale: 按希伯来家系逐层表达，并调整为自然汉语的祖先至本人次序；这些专名采用现代中文圣经中较通行的译形。
theological_decisions:
- issue: 全体以色列人失信与亚干个人行为之间的共同体责任
  choice: 保留“以色列人”作主句复数主体，同时明确亚干是实际拿取者
  alternative: 将主句改成只有亚干犯罪，或笼统说“以色列犯罪”而弱化个人身份
  rationale: 原文刻意并置共同体的失信与个人的行为；译文不替文本消解个人责任和群体后果之间的张力。
- issue: חֵרֶם兼有归神与毁灭、禁用的含义
  choice: 正文译作“当灭之物”，脚注保留“归神之物/禁物”等语义范围
  alternative: 正文只译“奉献之物”或只译“战利品”
  rationale: 单译“奉献之物”会淡化毁灭层面，单译“战利品”则会丢失归神和禁令性质。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“却”承接前文叙事中的转折；族谱按自然汉语重排。“当灭之物”作为必要的经文术语保留，并用脚注解释。
