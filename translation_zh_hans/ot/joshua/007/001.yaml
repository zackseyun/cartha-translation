revisions:
- from: 以色列人却在当灭之物[a]上失信了：犹大支派中，谢拉的曾孙、撒底的孙子、迦米的儿子亚干，拿了一些当灭之物；于是，雅威的怒气向以色列人发作。
  to: 以色列人却在当灭之物[a]的事上失信了：犹大支派中，谢拉的曾孙、撒底的孙子、迦米的儿子亚干，拿了一些当灭之物；于是，雅威的怒气便向以色列人燃起。
  rationale: 修订仅改善两处中文搭配并更明确保留原文“怒气燃烧”的意象。以色列人的共同体主体、亚干的个人行动、家系、支派和 חֵרֶם 的语义张力均未改变；脚注标记与正文锚点保持一致。
