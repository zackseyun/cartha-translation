  text: וַ/יַּ֧עַן עָכָ֛ן אֶת יְהוֹשֻׁ֖עַ וַ/יֹּאמַ֑ר אָמְנָ֗ה אָנֹכִ֤י חָטָ֨אתִי֙ לַֽ/יהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל וְ/כָ/זֹ֥את וְ/כָ/זֹ֖את עָשִֽׂיתִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/020.yaml
  text: Achan answered Joshua and said[a], “Truly, I have sinned against Yahweh, the God of Israel, and this is what I did:”
translation:
  language: zh_hans
  text: 亚干回答约书亚说：“我实在得罪了雅威——以色列的上帝。我所做的事是这样的[a]：”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“我这样这样做了。”这是希伯来语中用来引出所做之事具体经过的惯用说法。
    reason: 说明原文重复表达及其惯用功能，保留字面形式供读者查考。
lexical_decisions:
- source_word: וַיַּעַן עָכָן אֶת־יְהוֹשֻׁעַ וַיֹּאמַר
  choice: 亚干回答约书亚说
  rationale: 保留希伯来叙事中“回答……说”的对话结构；现代汉语虽可只说“回答”，但此处原文两个动词均有表达价值。
- source_word: אָמְנָה
  choice: 实在
  rationale: 表达郑重确认和坦承的语气，比“诚然”更符合现代汉语，同时保持庄重。
- source_word: אָנֹכִי חָטָאתִי לַיהוָה
  choice: 我实在得罪了雅威
  rationale: חטא 与介词 ל 连用时指向受冒犯的一方；“得罪了”自然表达向雅威犯罪的关系含义。独立代词 אָנֹכִי 的强调由“我实在”体现。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文四字神名的常见学术拟音直接呈现专名，不以“主”替代，也不采用源自另一套元音传统的“耶和华”。
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: 以色列的上帝
  rationale: 直接翻译构造短语，说明雅威的身份。
- source_word: וְכָזֹאת וְכָזֹאת עָשִׂיתִי
  choice: 我所做的事是这样的
  rationale: 这是引出随后具体陈述的希伯来惯用语；采用自然现代汉语，避免把字面重复误解为含糊的“这样那样”。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文明确使用神的专名。译作“雅威”保留专名性质，并较贴近通常重建的希伯来语读音；不以称号替代。
- issue: חטא לַיהוָה 所表达的犯罪关系
  choice: 得罪了雅威
  alternative: 向雅威犯了罪
  rationale: “得罪”清楚保留犯罪以雅威为受冒犯者的含义，同时不额外界定罪的性质。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“亚干”“约书亚”沿用通行人名译法；用破折号连接“雅威”与同位说明“以色列的上帝”。脚注标记置于其所解释的惯用语之后。
