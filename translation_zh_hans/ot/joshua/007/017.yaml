  text: וַ/יַּקְרֵב֙ אֶת מִשְׁפַּ֣חַת יְהוּדָ֔ה וַ/יִּלְכֹּ֕ד אֵ֖ת מִשְׁפַּ֣חַת הַ/זַּרְחִ֑י וַ/יַּקְרֵ֞ב אֶת מִשְׁפַּ֤חַת הַ/זַּרְחִי֙ לַ/גְּבָרִ֔ים וַ/יִּלָּכֵ֖ד זַבְדִּֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/017.yaml
  text: Then he brought near the clan of Judah[a], and the clan of the Zerahites was taken. Then he brought near the clan of the Zerahites man by man, and Zabdi was taken.
translation:
  language: zh_hans
  text: 他使犹大的宗族近前来，谢拉宗族被取中；他又使谢拉宗族的男子逐一近前来[a]，撒底被取中。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“按男子近前来”。希伯来语可能是说，谢拉宗族中的男子一个一个被带到近前。
    reason: 说明לַגְּבָרִים的字面形式及其在此处可能具有的逐一含义。
lexical_decisions:
- source_word: וַיַּקְרֵב
  choice: 使……近前来
  rationale: קרב的使役形表示“使靠近、带到近前”。此处是按层级查明犯罪者的程序；“使……近前来”既保留原文动作意象，也符合庄重叙事语体。
- source_word: מִשְׁפַּחַת
  choice: 宗族
  rationale: 此词在本段指支派以下的亲族群体。“宗族”比“家庭”范围更合适，也能自然用于犹大和谢拉的后裔群体。
- source_word: וַיִּלְכֹּד / וַיִּלָּכֵד
  choice: 被取中
  rationale: 该动词本义可指“捕获”，但在此处表示在拈阄或神所主持的辨认程序中被查出、选定。“被取中”保留被动结果，又避免误解为军事上的被俘。
- source_word: הַזֶּרְחִי
  choice: 谢拉宗族
  rationale: 这是由“谢拉”构成的族裔称谓，指谢拉的后裔群体；译为“谢拉宗族”在现代汉语中简洁清楚。
- source_word: לַגְּבָרִים
  choice: 男子逐一
  rationale: 字面为“按男子／向男子”，在逐层缩小范围的上下文中，最可能表示让宗族中的男子一个一个近前来。“男子逐一”自然表达其分配性含义，同时以脚注保留较直译的可能。
- source_word: זַבְדִּי
  choice: 撒底
  rationale: 采用该人名通行的现代汉语圣经音译。
theological_decisions:
- issue: “被取中”是否明说使用拈阄
  choice: 不在正文中补出“拈阄”
  alternative: 译作“被抽中”或“拈阄取中了”
  rationale: 本节的动词只说“被取中”，并未明确出现“阄”一词。上下文虽暗示一种由上帝主持的辨认程序，正文仍不补足原文未明说的具体方式，以保留叙事的含蓄。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“近前来”保留古代礼仪或司法程序的场景感；分号呈现两轮递进辨认的平行结构。脚注标记置于其实际对应的“男子逐一近前来”之后。
