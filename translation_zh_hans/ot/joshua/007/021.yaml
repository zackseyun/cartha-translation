  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: ו/אראה בַ/שָּׁלָ֡ל אַדֶּ֣רֶת שִׁנְעָר֩ אַחַ֨ת טוֹבָ֜ה וּ/מָאתַ֧יִם שְׁקָלִ֣ים כֶּ֗סֶף וּ/לְשׁ֨וֹן זָהָ֤ב אֶחָד֙ חֲמִשִּׁ֤ים שְׁקָלִים֙ מִשְׁקָל֔/וֹ וָֽ/אֶחְמְדֵ֖/ם וָֽ/אֶקָּחֵ֑/ם וְ/הִנָּ֨/ם טְמוּנִ֥ים בָּ/אָ֛רֶץ בְּ/ת֥וֹךְ הָ/אָֽהֳלִ֖/י וְ/הַ/כֶּ֥סֶף תַּחְתֶּֽי/הָ׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/021.yaml
  text: I saw among the spoil one beautiful cloak from Shinar[a], two hundred shekels of silver, and one bar of gold weighing fifty shekels. I coveted them and took them, and look, they are hidden in the ground inside my tent[c][b], with the silver underneath it.
translation:
  language: zh_hans
  text: 我在战利品中看见一件从示拿来的华美外袍[a]、二百舍客勒银子和一块重五十舍客勒的金子[b]。我贪恋这些东西，就拿走了。看哪，它们埋在我帐篷里面的地里，银子在那件外袍下面[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “外袍”也可译作“袍子”或“披风”；原词可指华贵的外衣。
    reason: lexical_alternative
  - marker: b
    text: “一块金子”原文直译为“一舌金子”，可能指一块舌形的金制品。
    reason: lexical_alternative
  - marker: c
    text: “那件外袍”所对应的原文代词为阴性单数，最可能指前面的外袍。
    reason: referent_clarification
lexical_decisions:
- source_word: בַשָּׁלָל
  choice: 在战利品中
  rationale: שָׁלָל指战争中夺得的财物；“战利品”是现代汉语中准确自然的表达，介词ב在此表所在范围。
- source_word: אַדֶּרֶת שִׁנְעָר אַחַת טוֹבָה
  choice: 一件从示拿来的华美外袍
  rationale: אַדֶּרֶת可指华贵的外衣、袍子或披风；“华美外袍”兼顾衣物种类及טוֹבָה在此所表达的上好、悦目之意。שִׁנְעָר按地名音译为“示拿”，并用“从……来的”表达来源。
- source_word: וּמָאתַיִם שְׁקָלִים כֶּסֶף
  choice: 二百舍客勒银子
  rationale: 保留古代重量单位“舍客勒”，不作不确定的现代重量换算。
- source_word: וּלְשׁוֹן זָהָב אֶחָד
  choice: 一块……金子
  rationale: לָשׁוֹן字面为“舌头”，这里指一件可能呈舌形的金制品；正文用自然且不过度限定形状的“一块金子”，脚注保留字面形象。
- source_word: חֲמִשִּׁים שְׁקָלִים מִשְׁקָלוֹ
  choice: 重五十舍客勒
  rationale: 简明呈现原文“它的重量为五十舍客勒”的重量说明。
- source_word: וָאֶחְמְדֵם
  choice: 我贪恋这些东西
  rationale: חמד在非法取走财物的语境中带有不正当欲求的道德意味；“贪恋”比单纯“想要”更能保留这一力度。
- source_word: וָאֶקָּחֵם
  choice: 就拿走了
  rationale: לקח是普通的“拿、取”；“拿走”自然表达将物品据为己有，不额外加强为抢夺。
- source_word: וְהִנָּם
  choice: 看哪，现在它们
  rationale: הִנָּם用于引人注意，并指向眼下可查见的情况；“看哪”保留叙事的指示性和即时感。
- source_word: טְמוּנִים בָּאָרֶץ
  choice: 埋在……地中
  rationale: טמן表示藏匿，结合בָּאָרֶץ“在土中”，译作“埋在地中”比笼统的“藏着”更具体自然。
- source_word: בְּתוֹךְ הָאֳהֳלִי
  choice: 我帐篷里的
  rationale: 准确表达物品位于说话者帐篷内部。
- source_word: וְהַכֶּסֶף תַּחְתֶּיהָ
  choice: 银子在那件外袍下面
  rationale: תַּחְתֶּיהָ带阴性单数后缀，最自然地回指阴性名词אַדֶּרֶת“外袍”；显明译出所指，避免汉语代词造成混淆，同时以脚注说明原文形式。
