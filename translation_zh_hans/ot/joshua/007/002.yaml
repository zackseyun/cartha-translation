  to: 约书亚从耶利哥派人到艾城[a]，就是靠近伯·亚文、在伯特利东边的地方。他对他们说：“你们上去侦察那地。”那些人就上去侦察艾城。
  rationale: 修订将原文修饰艾城的地理关系从句直接纳入主句，避免分号造成的轻微断裂；将第二处“他们”明确为“那些人”，使指代更清楚。脚注保留“靠近／在旁边”的译法选择及原文介词的语义弹性。
