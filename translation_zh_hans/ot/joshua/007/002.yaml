base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/002.yaml
  text: And Joshua sent men from Jericho to Ai[a], which is near Beth-aven, east of Bethel, and said to them, “Go up and spy out the land.” So the men went up and spied out Ai.
translation:
  language: zh_hans
  text: 约书亚从耶利哥派人到艾城[a]，就是靠近伯·亚文、在伯特利东边的地方。他对他们说：“你们上去侦察那地。”那些人就上去侦察艾城。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “靠近”或译“在……旁边”。希伯来语这里的介词字面为“与”，在地理描述中可以表示邻近。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: 派
  rationale: 该叙事动词表示差遣；“派人”是现代汉语中自然、准确的表达。
- source_word: אֲנָשִׁים
  choice: 人
  rationale: 希伯来语为阳性复数，在侦察和军事语境中所指为男子；汉语“派人”自然且未改变具体语境中的所指。
- source_word: מִירִיחוֹ
  choice: 从耶利哥
  rationale: 介词 מִן 表示出发地点；地名采用现代中文圣经中通行的译名。
- source_word: הָעַי
  choice: 艾城
  rationale: 这是专名；加“城”符合现代汉语地名表达，也使读者明确其为城邑。
- source_word: אֲשֶׁר עִם בֵּית אָוֶן
  choice: 艾城靠近伯·亚文
  rationale: עִם 字面为“与、同”，在地理描述中可表达相邻或接近；正文用“靠近”传达自然的方位关系，同时以脚注保留字面歧义。
- source_word: מִקֶּדֶם לְבֵית אֵל
  choice: 在伯特利东边
  rationale: 地理表达指艾城位于伯特利以东；此译简洁、自然。
- source_word: עֲלוּ
  choice: 上去
  rationale: 保留 עלה 所含向高处或向目的地而去的方向色彩。
- source_word: וְרַגְּלוּ
  choice: 侦察
  rationale: רגל 的加强词干在此指军事性的窥探和勘察；“侦察”比“查看”更准确，也比“窥探”更符合现代汉语叙事。
- source_word: אֶת הָאָרֶץ
  choice: 那地
  rationale: אָרֶץ 在此指要侦察的地域；“那地”承接明确地点，符合汉语表达。
- source_word: וַיַּעֲלוּ ... וַיְרַגְּלוּ
  choice: 就上去侦察
  rationale: 重复命令中的“上去”和“侦察”，保留原文的叙事呼应；“就”自然表达随即执行。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事体。“伯·亚文”以间隔号清楚标示复合地名。正文保留“上去”的地形方向感，并用“侦察”准确传达军事侦察语境。
