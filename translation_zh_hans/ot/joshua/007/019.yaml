base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/019.yaml
  text: Then Joshua said to Achan[a], “My son, please give glory to Yahweh, the God of Israel, and give thanks to him. Please tell me what you have done; do not hide it from me.”
translation:
  language: zh_hans
  text: 约书亚对亚干说：“我儿，请将荣耀归给耶和华——以色列的上帝，并向他献上感谢[a]。请告诉我，你做了什么；不要向我隐瞒。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “献上感谢”或译“颂赞他”。此处也可能含有向上帝承认、认罪的意思；下文随即要求亚干如实说出自己所做的事。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנִי
  choice: 我儿
  rationale: 保留阳性单数的亲切、郑重称呼；在现代汉语中简洁庄重，适合约书亚此处带有父辈口吻的劝告。
- source_word: שִׂים נָא כָבוֹד
  choice: 请将荣耀归给
  rationale: 希伯来语字面为“请放置荣耀”，实际是要求人承认上帝的荣耀；“将荣耀归给”自然地传达这一惯用含义，并以“请”体现 נָא 的恳请语气。
- source_word: לַיהוָה אֱלֹהֵי יִשְׂרָאֵל
  choice: 耶和华以色列的上帝
  rationale: 直接保留神名及其与以色列的关系；“耶和华”是现代中文圣经语境中 יְהוָה 的通行音译。
- source_word: וְתֶן לוֹ תוֹדָה
  choice: 并向他认罪
  rationale: תוֹדָה 可指感谢、颂赞或承认；此处紧接着要求亚干说出所做之事，司法性劝认语境强烈支持“认罪／承认”的含义。脚注保留“感谢、颂赞”等词义可能，避免掩盖词语本身的多义性。
- source_word: וְהַגֶּד נָא לִי מֶה עָשִׂיתָ
  choice: 请告诉我，你做了什么
  rationale: 准确体现 Hiphil 祈使式“告诉、说明”及 נָא 的恳请语气；现代汉语自然清楚。
- source_word: אַל תְּכַחֵד מִמֶּנִּי
  choice: 不要向我隐瞒
  rationale: כחד 在此指隐瞒或遮掩事实；汉语无需补出明确宾语，也能自然承接上一句。
theological_decisions:
- issue: תוֹדָה 在劝告亚干坦白的语境中如何理解
  choice: 正文译为“认罪”
  alternative: “感谢他”或“颂赞他”
  rationale: 该词具有感谢、颂赞、承认等语义范围。约书亚随即要求亚干陈述所做的事并不可隐瞒，因此“认罪”最能传达此处的语境功能；同时用脚注保存其他真实可能，不把词义张力静默消除。
- issue: “将荣耀归给耶和华”与认罪之间的关系
  choice: 保留两个并列命令
  alternative: 合并意译为“在耶和华面前如实认罪”
  rationale: 原文分别命令亚干归荣耀给上帝并献上 תוֹדָה。保留并列结构可避免把前一命令完全化约为司法认罪，也保留其神学修辞力度。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“我儿”保留原文郑重、近乎父辈式的称呼；句法简洁，适合公开诵读。神名 יְהוָה 译作“耶和华”。
