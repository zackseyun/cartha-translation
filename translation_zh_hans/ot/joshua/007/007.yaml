source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוֹשֻׁ֜עַ אֲהָ֣הּ אֲדֹנָ֣/י יְהוִ֗ה לָ֠/מָה הֵעֲבַ֨רְתָּ הַעֲבִ֜יר אֶת הָ/עָ֤ם הַ/זֶּה֙ אֶת הַ/יַּרְדֵּ֔ן לָ/תֵ֥ת אֹתָ֛/נוּ בְּ/יַ֥ד הָ/אֱמֹרִ֖י לְ/הַאֲבִידֵ֑/נוּ וְ/לוּ֙ הוֹאַ֣לְנוּ וַ/נֵּ֔שֶׁב בְּ/עֵ֖בֶר הַ/יַּרְדֵּֽן׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/007.yaml
  text: And Joshua said[a], “Ah, Lord GOD, why have you brought this people across the Jordan at all—to give us into the hand of the Amorites, to destroy us? If only we had been willing to dwell beyond the Jordan!”
translation:
  language: zh_hans
  text: 约书亚说：“唉，主耶和华[a]啊！你为什么竟让这百姓过约旦河，把我们交在亚摩利人手中，使我们灭亡呢？我们当初若肯住在约旦河那边就好了！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文为“主耶和华”，其中“耶和华”代表希伯来文神名 יהוה（YHWH）。
    reason: 说明复合神圣称呼及神名的原文依据。
lexical_decisions:
- source_word: אֲהָהּ
  choice: 唉
  rationale: 这是表达悲痛和惊惶的感叹词；“唉”简洁自然，保留了约书亚脱口而出的哀叹。
- source_word: אֲדֹנָי יְהוִה
  choice: 主耶和华
  rationale: 分别表达 אֲדֹנָי（主）和神的名字 יהוה（耶和华），既保留复合称呼，也符合现代中文圣经语体。
- source_word: הֵעֲבַרְתָּ הַעֲבִיר
  choice: 竟让……过
  rationale: 限定动词与同根绝对不定式连用，强化质问语气；“竟”传达惊愕和责问，“让……过”表达使役意义。
- source_word: אֶת־הָעָם הַזֶּה
  choice: 这百姓
  rationale: עָם 指作为整体的群体或民族；“这百姓”保留集合含义和庄重语体。
- source_word: לָתֵת אֹתָנוּ בְּיַד הָאֱמֹרִי
  choice: 把我们交在亚摩利人手中
  rationale: 保留“交在……手中”这一表示落入他人权势之下的希伯来语意象；单数族名在此具有集合意义，因此译作“亚摩利人”。
- source_word: לְהַאֲבִידֵנוּ
  choice: 使我们灭亡
  rationale: 表达使役性的毁灭或消亡，语气严峻，并与原文形式相称。
- source_word: וְלוּ הוֹאַלְנוּ
  choice: 我们当初若肯……就好了
  rationale: לוּ 引出与现实相反的愿望，הוֹאַלְנוּ 表示愿意或同意；“若肯……就好了”既自然，又不额外引入“满足于现状”的含义。
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  choice: 在约旦河那边
  rationale: 原文意为约旦河的另一边；“那边”保留相对方位表达，不在正文中把它明确化为东岸。
theological_decisions:
- issue: 复合称呼 אֲדֹנָי יְהוִה 中神名的译法
  choice: 主耶和华
  alternative: 主上帝；主雅威
  rationale: 原文明确使用四字神名 יהוה。译作“耶和华”可在普通现代中文读者熟悉的形式中保留专名性质；不以泛称“上帝”取代，也不据此引入特定宗派解释。
- issue: 约书亚质问话语的神学张力
  choice: 按原文直译为对神的强烈质问
  alternative: 弱化为单纯求问或补入为神辩护的说明
  rationale: 本节真实呈现约书亚在失败后的悲痛、困惑和近乎责问的言辞；译文不应预先用后文解释来消解这种张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事和祷告语体。“唉”“竟”“若肯……就好了”自然传达哀叹、质问和反事实愿望；保留“交在……手中”的圣经意象，并以“约旦河那边”维持原文的相对方位表达。
