revisions:
- from: 所以，以色列人不能在仇敌面前站立；他们必在仇敌面前转身逃跑[a]，因为他们已经成了当毁灭的。你们若不把那当毁灭之物从你们中间除灭，我就不再与你们同在。
  to: 因此，以色列人不能在仇敌面前站立；他们在仇敌面前转背[a]，因为他们已成了当灭的[b]。除非你们从你们中间毁灭那当灭之物[b]，我必不再与你们同在。
  rationale: 修订保留原文“站立—转背”的对照及其败退画面，删除原文未明示的强化未来副词“必”和过度解释性的“逃跑”。以“当灭的／当灭之物”统一对应两处 חֵרֶם，并通过脚注简要交代其禁令与毁灭的语义，从而兼顾词汇一致性、现代可读性与原文的历史宗教语境。
