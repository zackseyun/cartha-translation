source:
  edition: WLC
  text: וְ/לֹ֨א יֻכְל֜וּ בְּנֵ֣י יִשְׂרָאֵ֗ל לָ/קוּם֙ לִ/פְנֵ֣י אֹיְבֵי/הֶ֔ם עֹ֗רֶף יִפְנוּ֙ לִ/פְנֵ֣י אֹֽיְבֵי/הֶ֔ם כִּ֥י הָי֖וּ לְ/חֵ֑רֶם לֹ֤א אוֹסִיף֙ לִֽ/הְי֣וֹת עִמָּ/כֶ֔ם אִם לֹ֥א תַשְׁמִ֛ידוּ הַ/חֵ֖רֶם מִֽ/קִּרְבְּ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/012.yaml
  text: Therefore the sons of Israel cannot stand before their enemies; they turn their backs before their enemies[a], because they have become devoted to destruction. I will no longer be with you unless you destroy the devoted thing from your midst.
translation:
  language: zh_hans
  text: 因此，以色列人不能在仇敌面前站立；他们在仇敌面前转背[a]，因为他们已成了当灭的[b]。除非你们从你们中间毁灭那当灭之物[b]，我必不再与你们同在。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“转过颈背”，指背向仇敌而败退。
    reason: 说明希伯来语惯用表达，并保留原文的身体意象。
  - marker: b
    text: “当灭的／当灭之物”译自希伯来语 חֵרֶם（cherem），指在禁令之下归给上帝、须予毁灭的人或物；本节前者指以色列所处的状态，后者指他们中间具体的禁物。
    reason: 说明同一希伯来词在本节中身份状态与具体对象的相关用法，并保留其司法—祭祀语义。
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 现代汉语通常以“以色列人”自然、准确地表达这一群体称谓；若直译为“以色列的儿子们”，容易被误解为仅指男性或雅各的亲生儿子。
- source_word: לָקוּם לִפְנֵי אֹיְבֵיהֶם
  choice: 在仇敌面前站立
  rationale: 保留希伯来语“站立”的形象，同时在上下文中自然表达站稳阵脚、抵挡仇敌之意。
- source_word: עֹרֶף יִפְנוּ
  choice: 在仇敌面前转身逃跑
  rationale: 原文直译近于“转过后颈”，即背向仇敌而败退；译为“转身逃跑”既保留动作画面，也明确其惯用含义。
- source_word: הָיוּ לְחֵרֶם
  choice: 已经成了当毁灭的
  rationale: חֵרֶם 指在禁令之下归给上帝而须毁灭的人或物。此处以“当毁灭的”表达以色列因犯罪而落入同一判决之下，避免仅译作笼统的“受咒诅”。
- source_word: לֹא אוֹסִיף לִהְיוֹת עִמָּכֶם
  choice: 我就不再与你们同在
  rationale: אוֹסִיף 加不定式表示不再继续；“不再……同在”准确而符合庄重的现代汉语。
- source_word: תַשְׁמִידוּ הַחֵרֶם מִקִּרְבְּכֶם
  choice: 把那当毁灭之物从你们中间除灭
  rationale: “除灭”体现 שׁמד 使役形所要求的彻底毁灭，也自然搭配“从你们中间”；“那当毁灭之物”则保留与前半句 חֵרֶם 的词义联系。
theological_decisions:
- issue: 同一节中 חֵרֶם 的身份状态与具体对象两种用法
  choice: 分别译为“成了当毁灭的”和“那当毁灭之物”
  alternative: “成了受咒诅的”与“那受咒诅之物”；或“成了当灭的”与“当灭之物”
  rationale: 原文用同一词表达以色列落入毁灭禁令之下，以及营中仍存的具体禁物。采用相关但合乎句法的译法，既保留词汇联系，也不把祭司法理含义简化成一般性的咒诅。
- issue: 上帝同在的条件句
  choice: “你们若不……，我就不再……”
  alternative: “除非你们……，我就不再……”
  rationale: 汉语以“若不……就……”清楚呈现 אִם לֹא 的否定条件，不额外解释这种同在的神学性质。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“仇敌”“同在”“除灭”符合经文语域；避免生硬直译“以色列的儿子们”。主文保留 חֵרֶם 的司法—祭祀张力，脚注仅解释“转过后颈”的惯用意义。
