source:
  edition: WLC
  text: בִּ֖י אֲדֹנָ֑/י מָ֣ה אֹמַ֔ר אַ֠חֲרֵי אֲשֶׁ֨ר הָפַ֧ךְ יִשְׂרָאֵ֛ל עֹ֖רֶף לִ/פְנֵ֥י אֹיְבָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/008.yaml
  text: Please[a], Lord[b], what can I say after Israel has turned its back before its enemies?
translation:
  language: zh_hans
  text: 唉[a]，主啊！以色列既已在仇敌面前转背逃跑[b]，我还能说什么呢？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文是用于恳求或哀叹的语气词，也可译作“求你了”。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“转过背（或后颈）向着仇敌”，是指在战场上败退。
    reason: cultural_note
lexical_decisions:
- source_word: בִּי
  choice: 求你垂听
  rationale: 这是下级向上级恳求时使用的语气词。译作“求你垂听”在祷告语境中自然、庄重，表达约书亚急切而恭敬的呼求；原文并未明说“听”，因此以脚注说明。
- source_word: אֲדֹנָי
  choice: 主
  rationale: 这里是对上帝的尊称和直接称呼。译作“主”符合现代汉语基督教传统用语，也不把本节没有出现的上帝之名引入正文。
- source_word: מָה אֹמַר
  choice: 我还能说什么呢
  rationale: 原文直译为“我该说什么”。结合哀求和反问语气，“我还能说什么呢”自然传达约书亚面对败退时的无措，同时保留反问的张力。
- source_word: אַחֲרֵי אֲשֶׁר
  choice: 既然
  rationale: 该复合表达引出造成约书亚无言以对的既成情形。汉语用“既然”比机械地译作“在……以后”更顺畅，也能连接后面的反问。
- source_word: הָפַךְ יִשְׂרָאֵל עֹרֶף
  choice: 以色列……转身逃跑
  rationale: 原文是“以色列转过背（或后颈）”，属于战场败退的形象说法。译作“转身逃跑”清楚传达实际含义，并用脚注保留原文意象。
- source_word: לִפְנֵי אֹיְבָיו
  choice: 在仇敌面前
  rationale: 保留原文的空间表达和战场语境；“仇敌”按复数理解，而以色列作为集合性民族名称，是物主后缀的所指。
theological_decisions:
- issue: 上帝称号 אֲדֹנָי 的译法
  choice: 主
  alternative: 我主
  rationale: אֲדֹנָי 在这里作为对上帝的敬称使用。译作“主”既保留尊崇语气，也避免把其形式上的第一人称成分机械化为所有关系，或误引本节未出现的圣名。
- issue: 约书亚反问所表达的情绪
  choice: 我还能说什么呢
  alternative: 我该说什么呢
  rationale: “还能”突显败退之后约书亚的无措，却没有将他的话解释为不信、指控或某种特定教义立场，保留祷告中的哀恸与张力。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语言。“求你垂听”传达恳求语气，“我还能说什么呢”保留反问与无措感；正文清楚表达军事败退，脚注同时保存希伯来语的身体意象。
