reference: Joshua 7:13
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: קֻ֚ם קַדֵּ֣שׁ אֶת הָ/עָ֔ם וְ/אָמַרְתָּ֖ הִתְקַדְּשׁ֣וּ לְ/מָחָ֑ר כִּ֣י כֹה֩ אָמַ֨ר יְהוָ֜ה אֱלֹהֵ֣י יִשְׂרָאֵ֗ל חֵ֤רֶם בְּ/קִרְבְּ/ךָ֙ יִשְׂרָאֵ֔ל לֹ֣א תוּכַ֗ל לָ/קוּם֙ לִ/פְנֵ֣י אֹיְבֶ֔י/ךָ עַד הֲסִירְ/כֶ֥ם הַ/חֵ֖רֶם מִֽ/קִּרְבְּ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/013.yaml
  text: 'Get up[a], consecrate the people, and say, ‘Consecrate yourselves for tomorrow, for thus says Yahweh, the God of Israel: There is something devoted to destruction in your midst, Israel. You cannot stand before your enemies until you remove the thing devoted to destruction from your midst.’'
translation:
  language: zh_hans
  text: 起来，使百姓分别为圣，并对他们说：‘你们要为明天分别为圣；因为耶和华以色列的上帝这样说：以色列啊，你们中间有当灭之物[a]。在你们从中间除掉这当灭之物以前，你们不能在仇敌面前站立。’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “当灭之物”：希伯来语 חֵרֶם（ḥērem），指不可撤回地归给上帝之物；在这里，这样的物必须毁灭。传统也译作“禁物”或“奉献之物”。
    reason: 说明该词兼有不可撤回的归献和在本语境中须毁灭的含义，避免中文正文单一术语造成误解。
lexical_decisions:
- source_word: קֻם
  choice: 起来
  rationale: 单数命令式，敦促约书亚立即行动；“起来”自然、直接，并保留命令的紧迫感。
- source_word: קַדֵּשׁ / הִתְקַדְּשׁוּ
  choice: 使百姓分别为圣 / 你们要分别为圣
  rationale: 分别呈现 Piel 的使动意义和 Hitpael 的反身意义，同时保留两个同根词之间的呼应；此处指为次日的神圣行动作预备。
- source_word: לְמָחָר
  choice: 预备明天
  rationale: 介词 לְ 表明以次日为目标作准备；在中文中加入“预备”使关系自然明确，而不改变原意。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的神名音译，明确呈现专名而非以称号替代。
- source_word: חֵרֶם
  choice: 当毁灭的奉献之物
  rationale: 该词指不可撤回地归给上帝、在本语境中须予毁灭之物；此译兼顾“奉献/归属”和“毁灭”两层含义。
- source_word: בְּקִרְבְּךָ יִשְׂרָאֵל
  choice: 以色列啊，你们中间
  rationale: 保留对人格化的以色列之直接呼告；希伯来文使用单数，中文按群体指称自然转换为“你们”。
- source_word: לֹא תוּכַל לָקוּם לִפְנֵי אֹיְבֶיךָ
  choice: 不能在仇敌面前站立
  rationale: 保留原文“站立”的意象，表达无法抵挡或胜过仇敌。
- source_word: עַד הֲסִירְכֶם
  choice: 若不……除掉……就不能
  rationale: 原文 עַד 表示在所要求行动完成以前的界限；中文条件句自然表达“直到除掉以前不能”的逻辑。
theological_decisions:
- issue: חֵרֶם 在审判与圣战语境中的含义
  choice: 当毁灭的奉献之物
  alternative: 当灭之物；被诅咒之物；禁物
  rationale: 避免只译“被诅咒”而遗漏其被不可撤回地归给上帝的含义，也避免只译“奉献之物”而掩盖本段明确的毁灭结局。
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威；上主
  rationale: “耶和华”是现代简体中文圣经语境中广为人知的专名形式，既保留神名功能，也便于普通读者识别。
- issue: 以色列的群体责任与第二人称数的转换
  choice: 以“以色列啊”呼告群体，随后使用“你们”
  alternative: 全句使用单数“你”
  rationale: 原文将以色列人格化为单数，同时 הֲסִירְכֶם 转为复数，显出群体共同承担除去禁物的责任；中文用呼告加复数可保留这种张力。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。“分别为圣”保留礼仪与神圣预备的含义；“当毁灭的奉献之物”虽略具解释性，但配合脚注可准确传达本节核心术语。
