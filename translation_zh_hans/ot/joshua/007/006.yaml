  text: וַ/יִּקְרַ֨ע יְהוֹשֻׁ֜עַ שִׂמְלֹתָ֗י/ו וַ/יִּפֹּל֩ עַל פָּנָ֨י/ו אַ֜רְצָ/ה לִ/פְנֵ֨י אֲר֤וֹן יְהוָה֙ עַד הָ/עֶ֔רֶב ה֖וּא וְ/זִקְנֵ֣י יִשְׂרָאֵ֑ל וַ/יַּעֲל֥וּ עָפָ֖ר עַל רֹאשָֽׁ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/006.yaml
  text: Then Joshua tore his clothes and fell facedown to the ground before the ark of Yahweh until evening[a], he and the elders of Israel[b], and they put dust on their heads.
translation:
  language: zh_hans
  text: 约书亚撕裂衣服，和以色列的长老一同俯伏在地，在雅威的约柜前直到晚上[a]；他们又把尘土撒在头上[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文简练，直译为“在雅威的约柜前，直到晚上”；这里按其最自然的意思，理解为约书亚和以色列的长老一直俯伏到晚上。
    reason: 句法说明
  - marker: b
    text: 把尘土撒在头上，是当时表示悲痛、屈辱或哀悼的习俗。
    reason: 文化说明
lexical_decisions:
- source_word: וַיִּקְרַע ... שִׂמְלֹתָיו
  choice: 撕裂衣服
  rationale: 这是希伯来语中表达哀痛、惊惧或屈辱的具体动作；“撕裂衣服”自然、清楚，并保留原文意象。
- source_word: וַיִּפֹּל עַל־פָּנָיו אַרְצָה
  choice: 面伏于地
  rationale: 原文直指脸朝地俯伏的姿势；此译法既保留身体动作，也符合庄重的现代汉语。
- source_word: לִפְנֵי אֲרוֹן יְהוָה
  choice: 在雅威的约柜前
  rationale: לִפְנֵי表示“在……面前”；此处的柜是承载盟约法版的约柜，汉语用通行名称“约柜”。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以音译呈现四字神名，保留其作为以色列之神专名的性质，不以称号替代。
- source_word: עַד הָעֶרֶב
  choice: 一直伏到晚上
  rationale: “直到晚上”是直译；补出“伏”可在汉语中清楚表明这一时间短语延续的是俯伏动作。
- source_word: הוּא וְזִקְנֵי יִשְׂרָאֵל
  choice: 以色列的长老也和他一起这样做
  rationale: 原文以“他和以色列的长老”说明共同参与者；汉语重组语序，以免误读为只有约书亚俯伏。
- source_word: וַיַּעֲלוּ עָפָר עַל־רֹאשָׁם
  choice: 他们把尘土撒在头上
  rationale: 原文字面是使尘土上到头上，所指为哀恸或自卑的礼俗动作；“撒在头上”在现代汉语中具体自然。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文使用神的专名而非称号；“雅威”较直接地按学界通常重建的读音音译，同时不把专名改成称号。
- issue: 俯伏动作延续到晚上的句法关系
  choice: 将“直到晚上”理解为约书亚及长老持续俯伏到晚上
  alternative: 仅笼统地连接此前整组动作
  rationale: עַד הָעֶרֶב最自然地修饰持续性的俯伏状态；译文明确这一点，但脚注说明原文表达较简练。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“面伏于地”保留原文具体姿态；后一句补出“也和他一起这样做”，使希伯来语并列主语在汉语中关系清楚。脚注标记均置于相关正文之后。
