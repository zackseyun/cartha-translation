revisions:
- from: 约书亚撕裂衣服，面伏于地，在雅威的约柜前一直伏到晚上[a]；以色列的长老也和他一起这样做。他们把尘土撒在头上[b]。
  to: 约书亚撕裂衣服，和以色列的长老一同俯伏在地，在雅威的约柜前直到晚上[a]；他们又把尘土撒在头上[b]。
  rationale: 修订将“和以色列的长老一同”直接连于“俯伏在地”，既保留原文中约书亚单独撕裂衣服的语法范围，也明确长老共同俯伏至晚上。另以更自然的现代汉语替换“面伏于地”，并微调文化注释用语。
