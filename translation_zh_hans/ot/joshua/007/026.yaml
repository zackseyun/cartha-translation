base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/026.yaml
  text: And they raised over him a large heap of stones to this day[a], and Yahweh turned from the burning of his anger. Therefore the name of that place has been called the Valley of Achor to this day.
translation:
  language: zh_hans
  text: 众人在他上面堆起一大堆石头，直到今日仍在。雅威便从他的烈怒中回转。因此，那地方名叫亚割谷[a]，直到今日。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “亚割”与希伯来语中意为“使遭祸、使受连累”的词发音相近；参约书亚记7:25。
    reason: 说明地名 עָכוֹר 与动词 עכר 的文字游戏，同时较准确地反映本章语境中的词义。
lexical_decisions:
- source_word: וַיָּקִימוּ עָלָיו גַּל אֲבָנִים גָּדוֹל
  choice: 众人在他上面堆起一大堆石头
  rationale: “堆起”自然表达使石堆立起的动作；“在他上面”保留 עָלָיו，指石头堆在亚干身上或遗骸之上；“一大堆石头”准确而通俗地表达 גַּל אֲבָנִים גָּדוֹל。
- source_word: עַד הַיּוֹם הַזֶּה
  choice: 直到今日仍在／直到今日
  rationale: 第一次出现时补出汉语所需的“仍在”，明确持续至作者当时的是石堆，避免误解为众人一直堆石；第二次按命名公式直译为“直到今日”。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来语四字神名的通行现代拟音译作“雅威”，保留其专名性质，不以称号替代。
- source_word: מֵחֲרוֹן אַפּוֹ
  choice: 他的烈怒
  rationale: חֲרוֹן אַף 表示如火燃烧的强烈愤怒；“烈怒”在现代汉语中庄重自然，也保留其强烈程度。
- source_word: וַיָּשָׁב ... מֵ
  choice: 便收回了
  rationale: 此处 שׁוב מן 描写雅威从烈怒中转回，即烈怒止息；“收回”在汉语中保留主动转离的意味，又避免用“转意”引入悔改之意。
- source_word: קָרָא שֵׁם הַמָּקוֹם הַהוּא
  choice: 那地方名叫
  rationale: 希伯来语以未指明主体的单数动词构成命名公式；汉语用“那地方名叫”简洁自然，并与“直到今日”的持续称名相配。
- source_word: עֵמֶק עָכוֹר
  choice: 亚割谷
  rationale: 作为地名采用中文圣经传统且易识别的音译“亚割”，不在正文中以“扰乱谷”等释义取代专名；相关双关在脚注说明。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用以色列神的专名。译作“雅威”较贴近其现代学术重构读音，也避免以“主”这一称号取代专名。
- issue: 雅威烈怒的止息
  choice: 雅威便收回了他的烈怒
  alternative: 雅威的烈怒便止息了；雅威便转意，不发烈怒
  rationale: 译文保留原文将烈怒归于雅威、并由他主动转离烈怒的表达；不用“转意”，以免把经文未明说的心理或教义解释带入正文。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“直到今日仍在”是为避免汉语歧义所作的最小显化；全句保留叙事的因果推进及“直到今日”的纪念性命名公式。
