    rationale: שׁוּב加מן表示从其燃烧的怒气转回、离开；“收回”在中文中通常表示撤回自己发出的言语、命令或物件，改变了原文的转离意象。
  - severity: low
    issue: 脚注将相关词释为“扰乱、连累”，词义范围不够聚焦。
    rationale: 此处的文字游戏关联7:25的עכר，更适宜说明为“使遭祸／使受连累”（或“给……带来祸患”），并保留“发音相近”的谨慎表述。
