  yaml_path: translation/ot/joshua/007/010.yaml
  text: Yahweh said to Joshua[a], “Get up[b]. Why are you falling on your face?”
translation:
  language: zh_hans
  text: 耶和华对约书亚说：“起来！你为什么这样俯伏在地呢？”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的专名形式音译四字神名，保留其作为以色列之上帝名字的性质，不以称号“主”代替。
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: 叙事体中 אמר 的标准表达；与引语自然衔接。
- source_word: יְהוֹשֻׁעַ
  choice: 约书亚
  rationale: 采用现代中文圣经传统中通行且易辨认的人名译法。
- source_word: קֻם לָךְ
  choice: 起来
  rationale: קום 的命令式要求约书亚停止俯伏；לָךְ 在此加强或使表达更具个人指向，中文不宜生硬直译。
- source_word: לָמָּה זֶּה
  choice: 为什么这样
  rationale: “为什么”表达 לָמָּה，“这样”保留 זֶּה 所带的指示和强调意味，同时符合现代汉语习惯。
- source_word: אַתָּה נֹפֵל
  choice: 你……俯伏
  rationale: 保留显式主语“你”的强调；分词描述约书亚当下持续的姿态，中文由语境自然表达现时状态。
- source_word: עַל־פָּנֶיךָ
  choice: 俯伏在地
  rationale: 按希伯来语“伏在脸上”的动作意义译成自然中文，准确表现面伏于地的姿态，避免“跌倒在脸上”的误解。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威；上主
  rationale: 原文直接使用四字神名。正文采用中文读者最熟悉、且明确作为专名使用的“耶和华”，不以一般称号替换；“雅威”更接近常见学术拟音，但在普通中文读者中辨识度较低。
- issue: 约书亚俯伏姿态的语气
  choice: 你为什么这样俯伏在地呢？
  alternative: 你为什么脸伏于地？
  rationale: 原文质问约书亚持续保持俯伏姿势，并不否定俯伏本身在所有场合的敬虔意义。译文保留“这样”的指示强调，不额外解释为责备、哀悼或敬拜。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“起来”简洁有力；“俯伏在地”既符合中文表达，也传达 עַל־פָּנֶיךָ 的身体姿态。“呢”使直接问句自然，并未增添新的命题意义。原文语义清楚，无需脚注。
