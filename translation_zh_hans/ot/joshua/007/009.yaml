base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/009.yaml
  text: For the Canaanites and all the inhabitants of the land will hear[a], and they will surround us and cut off our name from the earth[b]. And what will you do for your great name?
translation:
  language: zh_hans
  text: 迦南人和这地所有的居民必会听见；他们会包围我们，把我们的名从地上除灭[a]。你要为你伟大的名做什么呢？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “把我们的名从地上除灭”是希伯来语表达，意思是把一个民族彻底消灭，使其不再存续，也不再被人记念。
    reason: cultural_note
lexical_decisions:
- source_word: וְיִשְׁמְעוּ
  choice: 听见了
  rationale: שׁמע在此指周围各族得知以色列战败的消息；与后续未完成式连用，表达约书亚所预见的结果。
- source_word: הַכְּנַעֲנִי
  choice: 迦南人
  rationale: 原文形式虽为单数，却是指整个族群的集合用法；现代汉语用“迦南人”可自然表达集体意义。
- source_word: וְכֹל יֹשְׁבֵי הָאָרֶץ
  choice: 和这地所有的居民
  rationale: יֹשְׁבֵי是作名词用的分词，指居住者；这里的הָאָרֶץ结合上下文是周边地域，而非全世界。
- source_word: וְנָסַבּוּ עָלֵינוּ
  choice: 就会包围我们
  rationale: נסב与עַל连用可表示围住、包围；此处是约书亚所担忧的军事威胁。
- source_word: וְהִכְרִיתוּ אֶת שְׁמֵנוּ מִן הָאָרֶץ
  choice: 把我们的名从地上除灭
  rationale: 保留“除灭我们的名”这一希伯来表达，同时用“从地上”传达整个民族的存在及记忆被彻底抹去之意。
- source_word: וּמַה תַּעֲשֶׂה
  choice: 那时，你要……做什么呢
  rationale: 保留原文直接向上帝发问的语气；“那时”使汉语与前述预想后果的衔接更自然，但不改变问题的内容。
- source_word: לְשִׁמְךָ הַגָּדוֹל
  choice: 为自己伟大的名
  rationale: לְ在这里可表示“为了、关乎”；译文保留原文简洁措辞，让上下文显明这是对上帝公开名誉与尊荣的诉求。
theological_decisions:
- issue: “你伟大的名”在约书亚恳求中的含义
  choice: 保留为对上帝之名的直接诉求，让语境显出这涉及上帝在列国中的公开尊荣
  alternative: 明确意译为“你要怎样维护自己伟大的名声呢”
  rationale: 以色列若被消灭，会影响周围各族如何看待上帝；但原文没有直接使用“维护”或“名声”，因此正文不将这一神学含义过度明说。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“这地”限定为当地地域；保留“名”的重复，使以色列的名与上帝伟大的名形成原文中的修辞和神学张力。
