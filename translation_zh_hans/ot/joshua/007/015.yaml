  naturalness: “归神当灭之物”可理解，但在现代汉语中略显凝缩生硬；“归给神、应当毁灭之物”更清楚自然。“可耻至极的事”语气略带现代夸饰，改为“可耻的恶行”较庄重且仍保留נְבָלָה的强烈伦理谴责。
  terminology: “雅威”“约”“以色列”均合适。“归给神、应当毁灭之物”保留ḥerem既归神又不得保留、须毁灭的语义；脚注补充传统译法及“禁物”，不把其复杂含义简化为单纯咒诅。
