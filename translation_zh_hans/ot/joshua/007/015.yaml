reference: Joshua 7:15
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/הָיָה֙ הַ/נִּלְכָּ֣ד בַּ/חֵ֔רֶם יִשָּׂרֵ֣ף בָּ/אֵ֔שׁ אֹת֖/וֹ וְ/אֶת כָּל אֲשֶׁר ל֑/וֹ כִּ֤י עָבַר֙ אֶת בְּרִ֣ית יְהוָ֔ה וְ/כִֽי עָשָׂ֥ה נְבָלָ֖ה בְּ/יִשְׂרָאֵֽל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/015.yaml
  text: And the one who is taken with the devoted thing shall be burned with fire[a], he and all that belongs to him, because he has transgressed the covenant of Yahweh and because he has done an outrageous thing in Israel.
translation:
  language: zh_hans
  text: 被查出与归给神、应当毁灭之物[a]有关的人，要用火焚烧他和他所有的一切；因为他违背了雅威的约，又在以色列中行了可耻的恶行。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“禁物”；传统译作“当受咒诅之物”。希伯来语ḥerem指置于禁令之下、归给神而应当毁灭之物。
    reason: 说明ḥerem兼有归神、禁令和毁灭的含义，并保留传统“accursed thing”译法。
lexical_decisions:
- source_word: הַנִּלְכָּד
  choice: 被查出……的人
  rationale: 这是לכד的被动分词，在本段指经抽签查明的人；“被查出”符合司法查验的语境，也避免让人误解为战争中被俘。
- source_word: בַּחֵרֶם
  choice: 有归神当灭之物
  rationale: חֵרֶם指被置于禁令之下、归给神而不得作普通用途、通常必须毁灭之物。“归神当灭之物”兼顾其奉献归属与毁灭结局；“有”自然表达介词所表示的关联，且不额外断定具体是拿取、藏匿还是持有。
- source_word: יִשָּׂרֵף בָּאֵשׁ
  choice: 要用火焚烧
  rationale: 直接传达被动式与工具性介词短语，语气庄重，并保留原文对火刑的明确表述。
- source_word: אֹתוֹ וְאֶת כָּל אֲשֶׁר לוֹ
  choice: 连同属于他的一切
  rationale: 概括原文“他和一切属他的”，不把范围擅自缩窄为财物，也不明确扩大为家属，从而保留上下文中的范围张力。
- source_word: עָבַר אֶת בְּרִית יְהוָה
  choice: 违背了雅威的约
  rationale: עבר与“约”连用表示越过约的界限、违反盟约；“违背”在现代汉语中自然且保留法律—盟约意味。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以常见的现代汉语音译呈现神的专名，而不以称号代替。
- source_word: נְבָלָה
  choice: 可耻至极的事
  rationale: 此词在伦理语境中表示令人震惊、极其羞耻的恶行，并非一般的愚蠢；该译法传达其强烈的道德谴责。
- source_word: בְּיִשְׂרָאֵל
  choice: 在以色列中
  rationale: 按处所义直译，指出恶行发生在盟约群体之内。
theological_decisions:
- issue: 盟约审判语境中חֵרֶם的译法
  choice: 归神当灭之物
  alternative: 被咒诅之物；当毁灭之物；禁物
  rationale: 该词首先表示置于神圣禁令之下、归给神处置之物，其结局往往是毁灭。“归神当灭之物”既保留奉献归属的神学背景，也说明其不得据为己有及必须毁灭的性质；脚注列出传统译法，避免遮蔽其诠释传统。
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 采用音译以保留原文的专名性质，不以称号替代。
- issue: “属于他的一切”的范围
  choice: 保留概括表达，不具体列举
  alternative: 他的一切财物；他的全家和财物
  rationale: 原文本身没有在本节逐项界定范围；译文不把它限缩为财产，也不自行明确包括哪些人，以保留经文的张力并让上下文提供解释。
translation_notes:
  register: 采用庄重、清晰的现代标准汉语。“连同属于他的一切”避免重复而不缩窄原文范围；“可耻至极的事”传达נְבָלָה强烈的伦理谴责。脚注标记[a]已置于对应词语之后。
