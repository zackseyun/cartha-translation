revisions:
- from: 被查出有归神当灭之物[a]的人，连同属于他的一切，都要用火焚烧，因为他违背了雅威的约，又在以色列中做了可耻至极的事。
  to: 被查出与归给神、应当毁灭之物[a]有关的人，要用火焚烧他和他所有的一切；因为他违背了雅威的约，又在以色列中行了可耻的恶行。
  rationale: 修订避免将בַּחֵרֶם的关联关系限定为“持有”，并使ḥerem的汉语表达更自然清楚。将“可耻至极的事”调整为“可耻的恶行”，以符合庄重的经文语体，同时保留נְבָלָה所指伦理上严重、令人羞耻的行为。句中明确“焚烧他和他所有的一切”，对应原文的宾语并保留范围未明的概括性。
