base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/023.yaml
  text: They took them from inside the tent and brought them to Joshua and to all the sons of Israel[c][b][a], and they laid them out before Yahweh.
translation:
  language: zh_hans
  text: 他们从帐篷里取出那些东西，带到约书亚和以色列众人那里；又把它们摆在耶和华面前。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “摆在”也可译为“倒出”。原文动词通常有“倒出、倾倒”之意；但这里所指的是从帐篷中取出的物品，按上下文可理解为把它们摆放、陈列在耶和华面前。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקָּחוּם
  choice: 取出那些东西
  rationale: לקח在此表示“拿、取”；结合后面的“从帐篷里面”，译作“取出”自然地表达由内向外取走这些物品，同时不增加“夺取”等强烈含义。
- source_word: מִתּוֹךְ הָאֹהֶל
  choice: 从帐篷里面
  rationale: מִתּוֹךְ明确带有“从内部、从当中”的空间含义；“从帐篷里面”比单说“从帐篷”更贴近原文。
- source_word: וַיְבִאוּם
  choice: 带到
  rationale: בוא的使役式在此为“带来、带到”；“带到……那里”符合现代汉语叙事表达，不额外加入礼仪性的“呈献”。
- source_word: אֶל יְהוֹשֻׁעַ וְאֶל כָּל בְּנֵי יִשְׂרָאֵל
  choice: 到约书亚和以色列众人那里
  rationale: בְּנֵי יִשְׂרָאֵל是以色列群体的惯用称呼；“以色列众人”既保留全体性的 כָּל，也比直译“以色列众子”更符合现代汉语。
- source_word: וַיַּצִּקֻם
  choice: 把它们倒在
  rationale: יצק的基本义是“倒出、倾倒”。本句宾语虽是物品，但可指把收集的物品倒出来；正文保留这一鲜明动词，并以脚注说明按语境可理解为摆放陈列。
- source_word: לִפְנֵי יְהוָה
  choice: 在耶和华面前
  rationale: לִפְנֵי表示“在……面前、在……面前呈现”；“耶和华”在现代中文圣经语境中是对四字神名 יְהוָה 广为人知的音译形式。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名，而不是“主”这一称号。正文采用普通中文读者最熟悉的专名形式“耶和华”，以保留其作为专名的性质；“雅威”是按学界常见复原读音所作的另一音译。
- issue: בְּנֵי יִשְׂרָאֵל 的群体含义
  choice: 以色列众人
  alternative: 以色列众子
  rationale: 此惯用语在叙事中指以色列全体民众，并非只强调男性后裔。“以色列众人”准确传达群体所指，也避免现代汉语中“众子”可能造成的狭义理解。
- issue: יצק 用于被取出的物品
  choice: 倒在
  alternative: 摆在
  rationale: 正文保留该动词“倾倒”的词汇形象，不因物品并非液体而静默消除原文张力；脚注提供符合上下文的理解。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“帐篷里面”保留原文的空间细节；“那些东西／它们”清楚承接上文所查获的物品。句末脚注标记紧随相关分句。
