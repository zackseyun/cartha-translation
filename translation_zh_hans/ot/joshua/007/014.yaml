  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/נִקְרַבְתֶּ֥ם בַּ/בֹּ֖קֶר לְ/שִׁבְטֵי/כֶ֑ם וְ/הָיָ֡ה הַ/שֵּׁבֶט֩ אֲשֶׁר יִלְכְּדֶ֨/נּוּ יְהוָ֜ה יִקְרַ֣ב לַ/מִּשְׁפָּח֗וֹת וְ/הַ/מִּשְׁפָּחָ֞ה אֲשֶֽׁר יִלְכְּדֶ֤/נָּה יְהוָה֙ תִּקְרַ֣ב לַ/בָּתִּ֔ים וְ/הַ/בַּ֨יִת֙ אֲשֶׁ֣ר יִלְכְּדֶ֣/נּוּ יְהוָ֔ה יִקְרַ֖ב לַ/גְּבָרִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/014.yaml
  text: In the morning you shall come near by your tribes[a], and it shall be that the tribe that Yahweh selects shall come near by clans, and the clan that Yahweh selects shall come near by households[b], and the household that Yahweh selects shall come near man by man.
translation:
  language: zh_hans
  text: 到了早晨，你们要按支派上前来。耶和华所取中的支派，要按宗族上前来；耶和华所取中的宗族，要按家户上前来；耶和华所取中的家户，其中的男子要一个一个上前来。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “取中”所译的希伯来词也可指“捉住、捕获”；这里指耶和华使某一支派、宗族或家户被辨认出来，可能是借着抽签。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“到男子们”，表示在该家户内由男子逐个上前接受辨认。
    reason: lexical_clarification
lexical_decisions:
- source_word: וְנִקְרַבְתֶּם / יִקְרַב / תִּקְרַב
  choice: 上前来
  rationale: קרב在本节反复出现，指为接受辨认而正式近前；统一译作“上前来”，既自然，也保留原文逐层推进的重复结构。
- source_word: לְשִׁבְטֵיכֶם
  choice: 按支派
  rationale: 介词短语表达按群体依次进行；“按支派”简洁地保留分组、逐级查验的含义。
- source_word: יִלְכְּדֶנּוּ / יִלְכְּדֶנָּה
  choice: 取中
  rationale: לכד通常可指捕获、捉住；在此程序语境中，指耶和华使某一群体被辨认出来。“取中”保留该动词的主动、强烈色彩，又不会使读者误以为是实际拘捕；脚注说明其可能含义及语境。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文读者熟悉的专名“耶和华”呈现四字神名，而不以称号替代。
- source_word: לַמִּשְׁפָּחוֹת
  choice: 按宗族
  rationale: מִשְׁפָּחָה在以色列支派组织中指小于支派、通常大于家户的亲族单位，“宗族”能体现这一层级。
- source_word: לַבָּתִּים / הַבַּיִת
  choice: 按家族 / 家族
  rationale: בַּיִת此处不是建筑物，而是宗族以下的父家或家户单位。译作“家族”较自然，并与上一级“宗族”区分。
- source_word: לַגְּבָרִים
  choice: 一个一个男子
  rationale: גְּבָרִים为阳性复数，且此处具有逐个查验的分配意义；“一个一个男子”保留性别指向和由群体缩小到个人的进程。
- source_word: וְהָיָה
  choice: （以分号承接程序结果）
  rationale: 该表达引出接续结果。中文以分号和后续陈述自然呈现程序推进，避免生硬直译为“事情将是”。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。正文采用现代简体中文圣经传统中最通行、最易识别的专名“耶和华”，保留其专名性质，不以“主”替代；“雅威”是更接近学界常用拟音的另一选择。
- issue: לכד 在神圣拣取程序中的含义
  choice: 取中，并以脚注保留“捉住、捕获”的词义张力
  alternative: 选中
  rationale: 上下文很可能涉及抽签辨认，但本节未明说抽签。直译性的“取中”既能表达被神指出，又不把隐含程序写进正文；脚注保留该词较强的捕获语义。
translation_notes:
  register: 采用庄重而清楚的现代标准普通话。通过“支派—宗族—家族—一个一个男子”呈现原文由大到小的社会层级，并重复“上前来”“耶和华取中”以保留希伯来文的程序性节奏。所有脚注标记均已置于正文。
