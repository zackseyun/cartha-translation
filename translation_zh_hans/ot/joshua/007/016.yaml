base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/016.yaml
  text: Joshua rose early in the morning and brought Israel near by its tribes[b][a], and the tribe of Judah was taken.
translation:
  language: zh_hans
  text: 约书亚清早起来，使以色列按各支派近前来[a]；犹大支派被选中[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“使以色列按各支派上前。”
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译为“被拿住”；此处是指在这一辨认程序中被取中或被选定。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכֵּם ... בַּבֹּקֶר
  choice: 清早起来
  rationale: שׁכם 的使役词干在此惯指早起；与“在早晨”合译为“清早起来”，既保留时间强调，也符合现代汉语习惯。
- source_word: וַיַּקְרֵב אֶת־יִשְׂרָאֵל
  choice: 使以色列……近前来
  rationale: קרב 的使役形式表示使人靠近或上前；“使……近前来”保留礼仪性程序的意味，同时不擅自补出对象或地点。
- source_word: לִשְׁבָטָיו
  choice: 按着支派
  rationale: 介词 ל 与复数“支派”在此表示按支派划分或依次进行；“按着支派”简明地保留这种分组意义。
- source_word: וַיִּלָּכֵד
  choice: 被选了出来
  rationale: לכד 的被动形式字面可指“被捉住”，在本段辨认对象的程序中表示某一单位被取中或认定。“被选了出来”传达语境功能，却不补明经文未明说的抽签方式或施事者。
- source_word: שֵׁבֶט יְהוּדָה
  choice: 犹大支派
  rationale: 直接表达该附属结构，是现代中文圣经叙事中自然、清楚的说法。
theological_decisions:
- issue: וַיִּלָּכֵד 所暗示的选定方式
  choice: 被选了出来
  alternative: 被抽中；被耶和华选中；被取中
  rationale: 本节没有在该分句中明说是抽签，也没有明列施事者。正文只表达犹大支派在程序中被认定，以免把上下文推知的机制或神学解释直接写入本节。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“近前来”保留原文程序性、礼仪性的色彩；“被选了出来”避免生硬直译，同时由脚注交代希伯来语习语。
