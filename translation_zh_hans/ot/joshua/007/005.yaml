  naturalness: “百姓的心都消化了”不符合现代标准汉语的通常搭配，且会造成不必要的字面误解。改为“百姓的心就融化了，变得像水一样”既自然，也保留原文意象。将追击表述为“从城门前一直追赶他们”使动作起点和延续更清楚。
  terminology: “艾城”“示巴琳”“击杀”“百姓”均适合庄重的现代圣经叙事语体。“示巴琳”保留为音译地名，并在脚注说明其可作普通名词的理解，妥当地保存了原文歧义。
