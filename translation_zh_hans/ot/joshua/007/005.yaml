base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/005.yaml
  text: And the men of Ai struck down about thirty-six men from among them[a], and pursued them from before the gate as far as Shebarim, and struck them down on the descent. So the heart of the people melted and became like water.
translation:
  language: zh_hans
  text: 艾城的人从他们中间击杀了约三十六人，又从城门前一直追赶他们，直到示巴琳[a]，在下坡路上击杀他们。于是百姓的心就融化了，变得像水一样。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “示巴琳”也可译作“采石场”或“破碎之处”；希伯来语 שְׁבָרִים 可理解为地名，也可理解为描述性的普通名词。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּכּוּ מֵהֶם
  choice: 击杀了他们中间
  rationale: נכה在战争叙事中指击打并常含致命结果；“击杀”符合本节伤亡语境。מֵהֶם译作“他们中间”，清楚表明死者出自以色列军队。
- source_word: אַנְשֵׁי הָעַי
  choice: 艾城的人
  rationale: 这是表示归属的结构，指属于艾城或从艾城出来作战的人；“艾城的人”自然明确。
- source_word: כִּשְׁלֹשִׁים וְשִׁשָּׁה אִישׁ
  choice: 约三十六人
  rationale: 数字前的כּ表示约数，因此保留“约”；中文无需另译单数形式的אִישׁ。
- source_word: וַיִּרְדְּפוּם לִפְנֵי הַשַּׁעַר
  choice: 又从城门前追赶他们
  rationale: 保留רדף的军事追击含义，也保留לִפְנֵי所表达的“在……前面”这一空间关系。
- source_word: עַד הַשְּׁבָרִים
  choice: 直到示巴琳
  rationale: 该词可能是地名，也可能是普通名词。正文音译作地名，以免武断消除原文歧义；其他理解列入脚注。
- source_word: וַיַּכּוּם בַּמּוֹרָד
  choice: 在下坡路上击杀他们
  rationale: מורד指下坡、斜坡或下行之处；“下坡路上”在现代汉语中自然，并保留地形信息。
- source_word: וַיִּמַּס לְבַב הָעָם
  choice: 百姓的心都消化了
  rationale: 直译保留希伯来语中“心消化”的鲜明意象，表达勇气崩溃；“都”在中文中自然体现集体性的“百姓”。
- source_word: וַיְהִי לְמָיִם
  choice: 变得如水一般
  rationale: 保留意志完全瓦解的水之隐喻；用“如水一般”避免中文“变成水”被误解为物质变化。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。保留“心都消化了……如水一般”的希伯来语双重意象，不把它完全意译为“丧胆”，以保存原文的文学力度。
