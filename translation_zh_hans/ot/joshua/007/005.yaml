revisions:
- from: 艾城的人击杀了他们中间约三十六人，又从城门前追赶他们，直到示巴琳[a]，在下坡路上击杀他们。于是百姓的心都消化了，变得如水一般。
  to: 艾城的人从他们中间击杀了约三十六人，又从城门前一直追赶他们，直到示巴琳[a]，在下坡路上击杀他们。于是百姓的心就融化了，变得像水一样。
  rationale: 本次修订仅处理现代汉语的必要表达问题，并更明确反映介词מִן的“从……中间”。“融化……像水一样”保留希伯来原文的连续比喻，不将其单纯解释为“丧胆”。脚注保留示巴琳究竟为地名还是描述性名词的文本歧义。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T05:20:37Z'
