base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/031.yaml
  text: and half of Gilead[a], and Ashtaroth and Edrei, the cities of the kingdom of Og in Bashan, belonged to the sons of Machir son of Manasseh—to half of the sons of Machir[b], according to their clans.
translation:
  language: zh_hans
  text: 还有基列的一半，以及亚斯他录和以得来，就是巴珊境内噩王国的城邑，都归给了玛拿西之子玛吉的子孙，即玛吉子孙中的一半，按着他们的宗族分配。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַחֲצִי הַגִּלְעָד
  choice: 还有基列的一半
  rationale: וַ 接续上一节的分地清单，译作“还有”；חֲצִי 表示该地域的一半。地名“基列”按现代中文惯例不保留希伯来语定冠词。
- source_word: עַשְׁתָּרוֹת
  choice: 亚斯他录
  rationale: 采用现代中文圣经读者较熟悉的地名音译。
- source_word: אֶדְרֶעִי
  choice: 以得来
  rationale: 采用现代中文圣经读者较熟悉的地名音译。
- source_word: עָרֵי מַמְלְכוּת עוֹג בַּבָּשָׁן
  choice: 巴珊境内噩王国的城邑
  rationale: 直接保留“王国的城邑”这一结构，不擅自判定这些城是王城、都城，还是泛指噩王国所属的城。בַּבָּשָׁן 理解为王国及其城邑所在的地域。
- source_word: לִבְנֵי מָכִיר בֶּן מְנַשֶּׁה
  choice: 归给了玛拿西之子玛吉的子孙
  rationale: 介词 ל־ 在分地语境中表示归属或分配，中文补出“归给了”，使无动词的希伯来语分句自然清楚。בְנֵי 在族谱和支派语境中可泛指后裔，译为“子孙”。
- source_word: לַחֲצִי בְנֵי מָכִיר
  choice: 也就是玛吉一半的子孙
  rationale: 第二个 ל־ 进一步限定前面的受地者。译作“也就是”明确其同位说明关系；不添加原文没有的“半支派”。
- source_word: לְמִשְׁפְּחוֹתָם
  choice: 按着他们的宗族分配
  rationale: מִשְׁפָּחוֹת 在分地记载中指支派内部的宗族单位；“宗族”比现代意义的“家庭”更准确。补出“分配”承接全句的分地语境。
theological_decisions: []
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“城邑”“宗族”保留土地分配记载的历史行政色彩；句中用“就是”和“也就是”呈现原文的同位说明，同时避免添加“半支派”等原文未明说的概念。
