base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/012.yaml
  text: all the kingdom of Og in Bashan[a], who reigned in Ashtaroth and in Edrei—he was left of the remnant of the Rephaim. Moses struck them down and dispossessed them.
translation:
  language: zh_hans
  text: 巴珊境内噩的整个王国；噩曾在亚斯他录和以得来作王。他是利乏音人[a]中遗留下来的。摩西击败他们，使他们失去领地。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“巨人”。希伯来文作“利乏音人”，可能是一个古代族群的名称。
    reason: 提供传统释义，同时保留正文对族名的音译。
lexical_decisions:
- source_word: כָּל מַמְלְכוּת עוֹג בַּבָּשָׁן
  choice: 巴珊境内噩的整个王国
  rationale: כָּל与单数מַמְלְכוּת连用，指噩全部的王国疆域；בַּבָּשָׁן按地点义译作“巴珊境内”。
- source_word: אֲשֶׁר מָלַךְ בְּעַשְׁתָּרוֹת וּבְאֶדְרֶעִי
  choice: 就是那位曾在亚斯他录和以得来作王的噩的国
  rationale: 希伯来语关系从句语法上修饰噩；汉语补出“噩的国”以清楚承接前面的“王国”，并以“作王”保留מלך的王权含义。
- source_word: הוּא נִשְׁאַר מִיֶּתֶר הָרְפָאִים
  choice: 他是利乏音人中剩下的
  rationale: 保留“他”所指的噩以及נִשְׁאַר的存留含义，不擅自加入“唯一”；רְפָאִים作为古代族群名称音译。
- source_word: וַיַּכֵּם מֹשֶׁה
  choice: 摩西击败了他们
  rationale: נכה在军事语境中可指击打、击败；复数宾语指噩及其所属之民，用“击败”自然且不减弱征服含义。
- source_word: וַיֹּרִשֵׁם
  choice: 夺取了他们的土地
  rationale: ירשׁ的使役形在征服语境中表示使对方失去产业或领地；此处用“夺取了他们的土地”自然表达剥夺其占有的结果，宾语仍为“他们”。
theological_decisions:
- issue: רְפָאִים的译法
  choice: 利乏音人
  alternative: 巨人
  rationale: 该词在此最稳妥地视为古代族群名称。音译可保留经文的历史与词汇关联，避免把有关其体貌或性质的解释直接写入正文。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。地名依常见圣经汉语译名处理；通过重述“噩的国”消除汉语中关系从句可能误修饰“王国”的歧义。
