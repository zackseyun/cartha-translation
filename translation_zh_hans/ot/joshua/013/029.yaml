base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/029.yaml
  text: 'And Moses gave to the half-tribe of Manasseh[a], and it was for the half-tribe of the sons of Manasseh according to their clans:'
translation:
  language: zh_hans
  text: 摩西把产业分给玛拿西半个支派；这产业归玛拿西子孙[a]的半个支派，按他们的宗族分配：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “玛拿西子孙”是希伯来语的亲属称谓，在此指玛拿西的后裔，即该支派的成员。
    reason: 说明希伯来语亲属表达在支派语境中的含义。
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: 把产业分给
  rationale: נתן的基本义是“给”；本段语境是分配土地产业。补出上下文中省略的受词“产业”，并用“分给”自然表达分配行为。
- source_word: לַחֲצִי שֵׁבֶט מְנַשֶּׁה
  choice: 给玛拿西半个支派
  rationale: חֲצִי意为“一半”，שֵׁבֶט在此指“支派”；“玛拿西半个支派”是现代中文圣经地理与支派叙事中清楚自然的表达。
- source_word: וַיְהִי
  choice: 这产业归……
  rationale: 字面为“于是它是”，在分地公式中表达归属。补明隐含的“产业”，用“归”传达其分配、所属意义，同时不把含义扩展为额外的法律概念。
- source_word: מַטֵּה
  choice: 支派
  rationale: מַטֶּה虽也可指“杖”，在这里与部族行政单位有关，故译为“支派”。
- source_word: בְנֵי מְנַשֶּׁה
  choice: 玛拿西子孙
  rationale: 保留希伯来语“玛拿西之子”的亲属称谓形式；中文“子孙”在此自然涵盖其后裔和支派成员。
- source_word: לְמִשְׁפְּחוֹתָם
  choice: 按着他们的宗族
  rationale: מִשְׁפָּחוֹת在支派组织和分地语境中指支派以下的宗族单位；介词לְ在此具有按群体分配的意义。
