  text: מִֽן הַ/שִּׁיח֞וֹר אֲשֶׁ֣ר עַל פְּנֵ֣י מִצְרַ֗יִם וְ/עַ֨ד גְּב֤וּל עֶקְרוֹן֙ צָפ֔וֹנָ/ה לַֽ/כְּנַעֲנִ֖י תֵּחָשֵׁ֑ב חֲמֵ֣שֶׁת סַרְנֵ֣י פְלִשְׁתִּ֗ים הָ/עַזָּתִ֤י וְ/הָ/אַשְׁדּוֹדִי֙ הָ/אֶשְׁקְלוֹנִ֣י הַ/גִּתִּ֔י וְ/הָ/עֶקְרוֹנִ֖י וְ/הָ/עַוִּֽים־׀־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/003.yaml
  text: 'from the Shihor, which is east of Egypt, as far as the border of Ekron to the north—it is counted as Canaanite territory—the five rulers of the Philistines: the Gazite, the Ashdodite, the Ashkelonite, the Gittite, and the Ekronite, and the Avvim.'
translation:
  language: zh_hans
  text: 从埃及东面[a]的西曷起，直到北边的以革伦边界——这地算作迦南人的领土——包括非利士人的五个首领：迦萨的首领、亚实突的首领、亚实基伦的首领、迦特的首领和以革伦的首领，以及亚卫人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “东面”原文直译为“在埃及面前”。
    reason: 原短语具有字面空间意象；脚注保留其形式，同时正文按地理语境明确表达方向。
lexical_decisions:
- source_word: שִׁיחוֹר
  choice: 西曷
  rationale: 按专名音译，不擅自补出原文没有的“河”；上下文表明它是边界地标。
- source_word: עַל־פְּנֵי מִצְרַיִם
  choice: 埃及东面
  rationale: 短语字面为“在埃及面前”，用于地理方位时可指埃及东面；正文采用清楚自然的方位表达，并以脚注保留字面形式。
- source_word: סַרְנֵי
  choice: 首领
  rationale: 该词特用于非利士城邦统治者；“首领”既自然，也不把其制度过度具体化为“王”或其他固定官衔。
- source_word: לַכְּנַעֲנִי תֵּחָשֵׁב
  choice: 这地算作迦南人的领土
  rationale: 保留“算作、归入”的语义，并补出中文所需的“这地/领土”，清楚表达地域归属。
- source_word: הָעַוִּים
  choice: 亚卫人
  rationale: 按族名音译；原文在五位非利士首领之后另列亚卫人，故用“以及”与五者区分。
theological_decisions:
- issue: 该地与迦南人的关系
  choice: 算作迦南人的领土
  alternative: 算为迦南人
  rationale: 原文可以简略地译作“算为迦南人”，但语境是在列举尚未取得的地域；译出“领土”能避免把地本身人格化，同时保留归类含义。
- issue: 亚卫人与五位非利士首领的句法关系
  choice: 在五位首领之后另列“以及亚卫人”
  alternative: 把亚卫人并入五位非利士首领的名单
  rationale: “五个”已经由迦萨、亚实突、亚实基伦、迦特和以革伦五者满足；亚卫人应视为附加项目，不应成为第六位首领。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。重复“首领”以免把五个族称误读为普通居民群体；破折号保留原句中对该地归属的插入说明。
