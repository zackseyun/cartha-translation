  yaml_path: translation/ot/joshua/013/026.yaml
  text: and from Heshbon to Ramath-mizpeh and Betonim[a], and from Mahanaim to the border of Debir.
translation:
  language: zh_hans
  text: 又从希实本直到拉末·米斯巴和比多宁，又从玛哈念直到底璧的边界[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“通往底璧的边界。”希伯来语介词也可能带有方向含义。
    reason: 保留 לִדְבִר 在疆界语境中既可表示关联、也可表示方向的歧义。
lexical_decisions:
- source_word: וּ/מֵ/חֶשְׁבּוֹן
  choice: 又从希实本
  rationale: 前缀 וּ 与介词 מִן 合起来表示“又从”；希实本为地名，采用现代中文圣经中通行的音译。
- source_word: עַד
  choice: 直到
  rationale: 在疆界描述中表示范围的终点；“直到”自然、明确地传达其延伸意义。
- source_word: רָמַת הַ/מִּצְפֶּה
  choice: 拉末·米斯巴
  rationale: 该组合在此作为地名使用，保留音译，不将其解释性地译成“瞭望台高地”。间隔号帮助读者辨认复合地名。
- source_word: וּ/בְטֹנִים
  choice: 和比多宁
  rationale: 带连接词的专有地名，按音译处理；“和”表明它与前一地点同属这一疆界段。
- source_word: וּ/מִֽ/מַּחֲנַיִם
  choice: 又从玛哈念
  rationale: 连接词、介词与地名合译为“又从玛哈念”；地名采用通行音译。
- source_word: גְּב֥וּל
  choice: 边界
  rationale: 在分地和疆域清单中指领土界线；“边界”符合现代中文地理语境。
- source_word: לִדְבִר
  choice: 底璧的
  rationale: 介词 לְ 接在“边界”之后，可理解为边界与底璧的所属或关联关系；正文用自然的“底璧的边界”，并以脚注保留其可能具有的方向含义。
