revisions:
- from: 从黎巴嫩直到米斯利弗·玛音[a]，所有山区的居民，就是所有西顿人，我必亲自把他们从以色列人面前赶出去。你只管照我所吩咐你的，把这地分给以色列作产业[b]。
  to: 从黎巴嫩直到米斯利弗·玛音[a]的山区的一切居民，所有西顿人，我必亲自从以色列人面前赶出他们。你只管正如我所吩咐你的，把这地分给以色列，作为产业[b]。
  rationale: 修订仅改善汉语句法、地域修饰范围和脚注措辞；保留原文对山区居民与西顿人的列举关系、神主动赶逐的强调、以色列人的称谓，以及土地“产业”的继受/分配含义。
