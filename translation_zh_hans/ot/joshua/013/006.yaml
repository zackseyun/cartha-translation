  - severity: low
    issue: “照我所吩咐你的”句法不够完整。
    rationale: 可改为“正如我所吩咐你的”，明确其意为按先前命令行事，同时不添加原文没有的行动细节。
  - severity: low
    issue: 地名词源脚注的“水边的焚烧”不够贴近所依据的释义。
    rationale: 英文审计资料所给的是“burnings of water”；以“水的焚烧处”一类表述并明确其仅为推测，更审慎。
