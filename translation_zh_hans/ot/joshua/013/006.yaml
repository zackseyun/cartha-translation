language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כָּל יֹשְׁבֵ֣י הָ֠/הָר מִֽן הַ/לְּבָנ֞וֹן עַד מִשְׂרְפֹ֥ת מַ֨יִם֙ כָּל צִ֣ידֹנִ֔ים אָֽנֹכִי֙ אוֹרִישֵׁ֔/ם מִ/פְּנֵ֖י בְּנֵ֣י יִשְׂרָאֵ֑ל רַ֠ק הַפִּלֶ֤/הָ לְ/יִשְׂרָאֵל֙ בְּֽ/נַחֲלָ֔ה כַּ/אֲשֶׁ֖ר צִוִּיתִֽי/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/006.yaml
  text: All the inhabitants of the hill country from Lebanon to Misrephoth-maim[a], all the Sidonians—I myself will drive them out before the sons of Israel. Only allot it to Israel as an inheritance[c][b], as I have commanded you.
translation:
  language: zh_hans
  text: 从黎巴嫩直到米斯利弗·玛音[a]的山区的一切居民，所有西顿人，我必亲自从以色列人面前赶出他们。你只管正如我所吩咐你的，把这地分给以色列，作为产业[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “米斯利弗·玛音”是地名；这个名称可能有“水的焚烧处”之类的意思，但确切含义不明。
    reason: cultural_note
  - marker: b
    text: “分给”所译的希伯来语，是分配土地的惯用说法，常与抽签定地有关。
    reason: lexical_alternative
lexical_decisions:
- source_word: יֹשְׁבֵי הָהָר
  choice: 山区的居民
  rationale: 这里的 הָהָר 指一片山地或山区，并非单独一座山；“山区的居民”既保留地域含义，也符合现代汉语表达。
- source_word: מִן הַלְּבָנוֹן עַד מִשְׂרְפֹת מַיִם
  choice: 从黎巴嫩直到米斯利弗·玛音
  rationale: 两个名称均按地名处理；后者含义不确定，不在正文中作推测性意译。
- source_word: כָּל צִידֹנִים
  choice: 所有西顿人
  rationale: 表示西顿人口的整体，保留 כָּל 的全称范围。
- source_word: אָנֹכִי אוֹרִישֵׁם
  choice: 我必亲自把他们……赶出去
  rationale: 独立代词 אָנֹכִי 带有强调意味，以“亲自”体现；ירשׁ 的使役式在此指剥夺当地居民的占有、将他们赶走。
- source_word: מִפְּנֵי בְּנֵי יִשְׂרָאֵל
  choice: 从以色列人面前
  rationale: 保留原文“从……面前”的空间关系意象；בְּנֵי יִשְׂרָאֵל 在现代汉语中惯常、自然地译为“以色列人”。
- source_word: רַק
  choice: 只管
  rationale: 表达限制和转折后的任务重点：赶逐由上帝施行，约书亚则须负责分地；“只管”在命令语境中自然。
- source_word: הַפִּלֶהָ
  choice: 把这地分给
  rationale: 这是使地业借抽签落定、分配土地的惯用语；阴性单数宾语指前述土地，汉语明说“这地”以避免指代不清。
- source_word: לְיִשְׂרָאֵל בְּנַחֲלָה
  choice: 给以色列作产业
  rationale: נַחֲלָה 指承受而得、归属各支派的土地产业；“产业”比现代汉语的“遗产”更适合此处土地分配语境。
- source_word: כַּאֲשֶׁר צִוִּיתִיךָ
  choice: 照我所吩咐你的
  rationale: 自然表达先前已经赐下、现仍有效的命令。
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל 的汉语表达
  choice: 以色列人
  alternative: 以色列的众子
  rationale: 原文是“以色列之子”的民族称谓；“以色列人”在现代标准汉语中准确涵盖该群体，而逐字译法容易被误解为仅指雅各的亲生儿子。
- issue: נַחֲלָה 在应许之地分配语境中的译法
  choice: 产业
  alternative: 继承之地
  rationale: “产业”保留土地由上帝赐予并归属以色列的法律及盟约色彩，同时不把“继承”的具体机制过度带入正文。
- issue: 神的赶逐与约书亚分地之间的张力
  choice: 保留“我必亲自……你只管……”的并置
  alternative: 将赶逐解释为完全通过以色列人的行动实现
  rationale: 原文既强调说话者亲自赶逐，也命令约书亚分配尚待占有的土地；译文保留两者，不替原文说明实现方式。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“我必亲自”保留神谕中的强调；“你只管”自然呈现限制性命令。地名用间隔号划分音节组合，正文不作不确定的词源意译。
