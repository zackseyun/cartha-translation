revisions:
- from: 还有高原[a]上的所有城邑，以及在希实本作王的亚摩利王西宏的整个国土。摩西击杀了西宏[b]，也击杀了米甸的首领以未、利金、苏珥、户珥和利巴；他们是西宏属下的诸侯[c]，住在那地。
  to: 还有高原[a]上的所有城邑，以及亚摩利人的王西宏的整个王国；西宏在希实本作王，摩西击败了他和米甸的首领：以未、利金、苏珥、户珥和利巴；他们是西宏的诸侯[c]，住在那地。
  rationale: 修订避免把军事性“击打”限定为“杀死”，并删除原文未明言的“属下”政治制度含义。“王国”更直接对应מַמְלְכוּת。脚注b保留为词义说明，虽然中文正文选择“击败”未另设标记，仍可供项目审计使用；若标记必须逐一在正文中出现，可将“击败”改为“击败[b]”。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T05:20:56Z'
review_pass:
  verdict: revise
  source_fidelity: 草稿将军事动词“击杀”及脚注中的“杀死”处理得过强。נכה在此处可指军事性击败；本节本身不必明确说摩西杀死了每一位所列人物。另，“西宏属下的诸侯”把属格关系具体化为从属制度，超过原文明确表达；宜保留为“西宏的诸侯”。其余人物、地点和两种不同的头衔大体处理恰当。
  naturalness: 原译整体自然清楚。修订后以分号和冒号分隔长串同位语，保持现代书面普通话的可读性，同时避免拆句后弱化原有句法关联。
  terminology: “高原”“城邑”“亚摩利人的王”“首领”“诸侯”等用语合宜。“王国”比“国土”更直接对应ממלכות，并仍可在本段土地清单中自然理解为其统治领域。人名音译可保留。
  issues:
  - severity: medium
    issue: 将נכה译作“击杀”，脚注进一步释为“彻底击败并杀死”。
    rationale: 该动词在军事语境可表示击打、击败或击杀；虽然相关叙事有死亡背景，本节的措辞本身不要求在中文中明说“杀死”。“击败”较稳妥地保留语义范围。
  - severity: medium
    issue: “西宏属下的诸侯”过度具体化“西宏的诸侯”。
    rationale: נְסִיכֵי סִיחוֹן表明这些人被称为与西宏相关的诸侯／统治者，但未明说具体的隶属制度。“属下的”会消除原文保留的政治关系细节。
  - severity: low
    issue: “整个国土”较“整个王国”弱化王权／王国含义。
    rationale: מַמְלְכוּת的基本义是王国、王权或统治领域；“王国”是更直接且不失自然的对应。
