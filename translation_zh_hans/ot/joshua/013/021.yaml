  text: וְ/כֹל֙ עָרֵ֣י הַ/מִּישֹׁ֔ר וְ/כָֽל מַמְלְכ֗וּת סִיחוֹן֙ מֶ֣לֶךְ הָ/אֱמֹרִ֔י אֲשֶׁ֥ר מָלַ֖ךְ בְּ/חֶשְׁבּ֑וֹן אֲשֶׁר֩ הִכָּ֨ה מֹשֶׁ֜ה אֹת֣/וֹ וְ/אֶת נְשִׂיאֵ֣י מִדְיָ֗ן אֶת אֱוִ֤י וְ/אֶת רֶ֨קֶם֙ וְ/אֶת צ֤וּר וְ/אֶת חוּר֙ וְ/אֶת רֶ֔בַע נְסִיכֵ֣י סִיח֔וֹן יֹשְׁבֵ֖י הָ/אָֽרֶץ־׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/021.yaml
  text: 'and all the cities of the plateau[a], and all the kingdom of Sihon king of the Amorites, who reigned in Heshbon, whom Moses struck down—him and the chiefs of Midian: Evi, Rekem, Zur, Hur, and Reba, the princes of Sihon[c][b], who lived in the land.'
translation:
  language: zh_hans
  text: 还有高原[a]上的所有城邑，以及亚摩利人的王西宏的整个王国；西宏在希实本作王，摩西击败了他和米甸的首领：以未、利金、苏珥、户珥和利巴；他们是西宏的诸侯[c]，住在那地。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “高原”或译“平原”或“台地”，指约旦河东的平坦高地。
    reason: lexical_alternative
  - marker: c
    text: 原文用两个不同的称号：前面的“米甸的首领”是נְשִׂיאֵי，后面的“西宏的诸侯”是נְסִיכֵי。
    reason: lexical_alternative
lexical_decisions:
- source_word: עָרֵי הַמִּישֹׁר
  choice: 高原上的所有城邑
  rationale: מִישׁוֹר在此指约旦河东的平坦高地；“高原”既符合当地地貌，也比泛称“平原”更具体。“城邑”以庄重而易懂的方式表达עָרִים。
- source_word: מַמְלְכוּת סִיחוֹן
  choice: 西宏的整个国土
  rationale: מַמְלְכוּת可指王国或王所统辖的疆域。此处在土地分配清单中，“国土”自然地突出领土含义；“整个”对应כָל。
- source_word: מֶלֶךְ הָאֱמֹרִי
  choice: 亚摩利王西宏
  rationale: 以现代汉语自然语序表达“亚摩利人的王西宏”，保留其王者身份和族属。
- source_word: אֲשֶׁר מָלַךְ בְּחֶשְׁבּוֹן
  choice: 在希实本作王的
  rationale: מָלַךְ明确表示作王；“在希实本作王”比宽泛的“统治”更贴近原文。
- source_word: אֲשֶׁר הִכָּה מֹשֶׁה אֹתוֹ
  choice: 摩西击杀了西宏
  rationale: נכה在此军事语境中表示击败、杀灭；上下文涉及西宏之死，译作“击杀”简洁明确。将原文回指代词具体化为“西宏”，避免汉语歧义。
- source_word: נְשִׂיאֵי מִדְיָן
  choice: 米甸的首领
  rationale: נְשִׂיאִים可指首领、族长或领袖；译作“首领”，并与后面的נְסִיכִים“诸侯”保持词阶区别。
- source_word: אֱוִי וְאֶת רֶקֶם וְאֶת צוּר וְאֶת חוּר וְאֶת רֶבַע
  choice: 以未、利金、苏珥、户珥和利巴
  rationale: 采用现代中文圣经人名中常见且可辨识的音译。
- source_word: נְסִיכֵי סִיחוֹן
  choice: 西宏属下的诸侯
  rationale: נְסִיכִים指具有统治地位的诸侯或权贵；加“属下的”清楚表达与西宏的隶属关系，同时区别于前面的“首领”。
- source_word: יֹשְׁבֵי הָאָרֶץ
  choice: 住在那地
  rationale: 忠实表达ישׁב分词的居住含义；“那地”承接经文所述领土，符合自然汉语。
theological_decisions:
- issue: 西宏与米甸首领的政治关系
  choice: 将נְסִיכֵי סִיחוֹן译为“西宏属下的诸侯”
  alternative: “西宏的王公”或“西宏的受膏者”
  rationale: 原文表明这些米甸首领同时被称为西宏的נְסִיכִים，但没有详述这种从属关系的具体制度；“属下的诸侯”保留政治隶属含义而不作过度推断。
translation_notes:
  register: 采用现代、庄重而清晰的书面普通话。把希伯来语较长的关系从句拆成两句，以免中文结构累赘，同时保留人物、领土和政治关系。所有脚注标记均置于相应词语之后。
