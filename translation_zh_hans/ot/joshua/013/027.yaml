base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/027.yaml
  text: and in the valley[a], Beth-haram, Beth-nimrah, Succoth, and Zaphon—the rest of the kingdom of Sihon king of Heshbon—with the Jordan as its border, as far as the lower end of the Sea of Kinnereth, beyond the Jordan eastward.
translation:
  language: zh_hans
  text: 又有谷地中的伯哈兰、伯宁拉、疏割和撒分，就是希实本王西宏的国度所剩下的部分；以约旦河为界，直到基尼烈海的南端[a]，都在约旦河东边。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “南端”也可译作“边缘”或“尽头”。
    reason: 希伯来语קְצֵה可指边缘、末端或尽头；“南端”是结合此处地理走向作出的语境化表达。
lexical_decisions:
- source_word: וּבָעֵמֶק
  choice: 以及谷地里的
  rationale: עֵמֶק通常指山岭之间或低洼地区的“谷地”；这里引出位于该地带的一组城邑。
- source_word: בֵּית הָרָם וּבֵית נִמְרָה וְסֻכּוֹת וְצָפוֹן
  choice: 伯哈兰、伯宁拉、疏割和撒分
  rationale: 四者在句法上同属城邑名单，均按希伯来语地名音译；צָפוֹן在此不是方向词“北方”。
- source_word: יֶתֶר מַמְלְכוּת סִיחוֹן מֶלֶךְ חֶשְׁבּוֹן
  choice: 希实本王西宏国中其余的部分
  rationale: יֶתֶר表示剩余部分；מַמְלְכוּת在此指西宏所统治的国土，译文用“国中其余的部分”自然表达其领土含义。
- source_word: הַיַּרְדֵּן וּגְבֻל
  choice: 以约旦河为界
  rationale: 原文是简练的并列、同位结构，语境表明约旦河构成这片领土的边界。
- source_word: עַד קְצֵה יָם כִּנֶּרֶת
  choice: 直到基尼烈海的南端
  rationale: קְצֵה可指边缘、尽头或末端；按约旦河谷的地理走向，“南端”最清楚地表达这里所指的湖端，同时以脚注保留词义上的开放性。
- source_word: עֵבֶר הַיַּרְדֵּן מִזְרָחָה
  choice: 都在约旦河东边
  rationale: 这是领土描述中的常见方位语，指出所列地区位于约旦河以东；补出“这些地方”使现代汉语衔接自然。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而清楚的地理叙述语体；保留“基尼烈海”这一希伯来地名，不以后来的“加利利海”替换。为避免中文长句层次不清，将末尾方位说明另成一句，但不改变其对整片领土的修饰关系。
