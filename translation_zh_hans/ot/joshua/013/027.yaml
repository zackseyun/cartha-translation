- from: 以及谷地里的伯哈兰、伯宁拉、疏割和撒分，也就是希实本王西宏国中其余的部分；以约旦河为界，直到基尼烈海的南端[a]。这些地方都在约旦河东边。
  to: 又有谷地中的伯哈兰、伯宁拉、疏割和撒分，就是希实本王西宏的国度所剩下的部分；以约旦河为界，直到基尼烈海的南端[a]，都在约旦河东边。
  rationale: 修订仅消除属格链的歧义、改善现代汉语句法，并将原文连续的方位说明恢复为同一句中的总括限定。保留全部地名、边界表述及“南端”的脚注，以维持对原文及英语审计轨迹所保留的词义开放性。
