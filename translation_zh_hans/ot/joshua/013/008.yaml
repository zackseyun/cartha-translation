base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/008.yaml
  text: With him[a], the Reubenites and the Gadites received their inheritance, which Moses gave them beyond the Jordan eastward, just as Moses the servant of Yahweh gave them.
translation:
  language: zh_hans
  text: 与他一同[a]，吕便人和迦得人领受了自己的产业，就是摩西在约旦河东边[b]赐给他们的，正如雅威的仆人摩西赐给他们的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “他”承接上文，指玛拿西半支派；希伯来文使用阳性单数代词。
    reason: 指代说明
  - marker: b
    text: 希伯来文直译为“在约旦河那边，向东”，即约旦河东岸。
    reason: 地理表达说明
lexical_decisions:
- source_word: עִמּוֹ
  choice: 与他一同
  rationale: 保留介词“与……一同”和第三人称阳性单数代词；该代词承接上文的玛拿西半支派，但本节本身没有明说所指。
- source_word: הָרְאוּבֵנִי וְהַגָּדִי
  choice: 吕便人和迦得人
  rationale: 两个族称在希伯来文中虽为单数形式，却都是集合用法，指相应支派的人。
- source_word: לָקְחוּ
  choice: 领受了
  rationale: 该动词可表示“拿取、取得或领受”；与上帝借摩西所赐的产业搭配时，“领受”自然表达受赐而得，同时避免暗示擅自占取。
- source_word: נַחֲלָתָם
  choice: 自己的产业
  rationale: נחלה在此特指分配给支派、可承受的土地；“产业”保留土地承受与归属的含义。
- source_word: בְּעֵבֶר הַיַּרְדֵּן מִזְרָחָה
  choice: 在约旦河东边
  rationale: 将“约旦河那边”与方向词“向东”合并为自然清楚的现代汉语地理表达。
- source_word: כַּאֲשֶׁר
  choice: 正如
  rationale: 保留比较和确认的语气，也保留原文随后重复“摩西赐给他们”的结构。
- source_word: עֶבֶד יְהוָה
  choice: 雅威的仆人
  rationale: “仆人”在此是摩西的尊称；以“雅威”音译四字神名，使专名有别于一般称号“主”。
theological_decisions:
- issue: 如何译出神名 יְהוָה
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”较贴近其常见学术重构读音，并明确将其作为以色列之神的专名，而非以“主”这一称号替代。
- issue: 摩西两次赐予产业的重复表达
  choice: 保留两次“摩西……赐给他们”
  alternative: 合并或删去第二次重复
  rationale: 原文确有重复，第二处还加上“雅威的仆人”这一尊称；保留可避免把可能具有确认或强调作用的结构静默消解。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“领受产业”符合土地分配语境；同时保留原文末尾近乎重复的句式，以呈现其强调和确认意味。
