  yaml_path: translation/ot/joshua/013/014.yaml
  text: Only to the tribe of Levi he gave no inheritance[a]; the offerings by fire to Yahweh, the God of Israel, are his inheritance[b], as he spoke to him.
translation:
  language: zh_hans
  text: 只是，他没有把产业分给利未支派；献给耶和华——以色列的神——的火祭，就是他们的产业[a]，正如他对他们所说的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也有人依据这里的单数代词和邻近经文理解为：“耶和华——以色列的神——就是他们的产业。”
    reason: 保留原文代词数所引起的句法问题及邻近经文所支持的另一种理解，不在正文中消除其神学张力。
lexical_decisions:
- source_word: רַק
  choice: 只是
  rationale: 表达对前文分地叙述的限制和例外，简洁保留原文的限定语气。
- source_word: לְשֵׁבֶט הַלֵּוִי
  choice: 利未支派
  rationale: 按现代汉语的圣经专名惯例音译 לֵוִי，并将 שֵׁבֶט 译为“支派”。
- source_word: לֹא נָתַן נַחֲלָה
  choice: 没有分给他们产业
  rationale: 在分地语境中，“分给”自然表达 נָתַן；“产业”保留 נַחֲלָה 所含的承受之业含义。
- source_word: אִשֵּׁי יְהוָה
  choice: 献给耶和华……的火祭
  rationale: “火祭”直接反映 אִשִּׁים 与火献祭相关的词义；“献给耶和华”自然表达所属或指向关系。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的神名译法。
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: 以色列之神
  rationale: 自然表达原文附加说明，并以“之”维持庄重、清晰的书面语体。
- source_word: הוּא נַחֲלָתוֹ
  choice: 就是他们的产业
  rationale: 将利未支派作为集合体，以复数代词自然指代其成员；“就是”保留原文判断句的强调。
- source_word: כַּאֲשֶׁר דִּבֶּר לוֹ
  choice: 正如耶和华对他们所说的
  rationale: “说”保留 דִּבֶּר 的基本意义，不解释为“应许”；明示耶和华与利未人，避免现代汉语连续使用“他”造成指代不清。
theological_decisions:
- issue: 利未支派所得产业的性质
  choice: 以献给耶和华的火祭为他们的产业
  alternative: 耶和华以色列之神自己是他们的产业
  rationale: 原文中“耶和华的火祭”紧接在判断词 הוּא 之前，按直接句法宜作为“产业”的所指；但 הוּא 为阳性单数，加上邻近经文的表达，也使“耶和华自己是产业”的理解具有传统依据，因此以脚注保留。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。正文以“分给……产业”贴合约书亚记分地语境；用“火祭”保持祭祀术语的准确性，同时避免过度解释祭物如何成为利未人的供应。
