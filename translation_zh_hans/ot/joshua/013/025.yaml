  text: וַ/יְהִ֤י לָ/הֶם֙ הַ/גְּב֔וּל יַעְזֵר֙ וְ/כָל עָרֵ֣י הַ/גִּלְעָ֔ד וַ/חֲצִ֕י אֶ֖רֶץ בְּנֵ֣י עַמּ֑וֹן עַד עֲרוֹעֵ֕ר אֲשֶׁ֖ר עַל פְּנֵ֥י רַבָּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/025.yaml
  text: And their territory was Jazer[a], and all the cities of Gilead, and half the land of the Ammonites, as far as Aroer, which is opposite Rabbah.
translation:
  language: zh_hans
  text: 他们的地界包括雅谢、基列所有的城，以及亚扪人之地的一半，直到拉巴对面的亚罗珥[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “对面”或译“面向”。希伯来语原文直译为“在拉巴前面”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי לָהֶם הַגְּבוּל
  choice: 他们的地界包括
  rationale: גְּבוּל既可指边界，也可转指疆域；下文列举所得之地，译作“地界包括”既保留疆界含义，又符合现代汉语地理清单的表达。
- source_word: יַעְזֵר
  choice: 雅谢
  rationale: 按该地名的希伯来语读音采用简明、常见的中文音译。
- source_word: וְכָל עָרֵי הַגִּלְעָד
  choice: 基列所有的城
  rationale: עָרֵי可指城或城镇；“所有的城”简洁庄重，适合领土清单。
- source_word: וַחֲצִי אֶרֶץ בְּנֵי עַמּוֹן
  choice: 以及亚扪人之地的一半
  rationale: בְּנֵי עַמּוֹן是指亚扪人的惯用族群名称；אֶרֶץ在此指土地或疆域。
- source_word: עַד עֲרוֹעֵר
  choice: 直到……亚罗珥
  rationale: עַד标示疆域所至的界限；“直到”自然准确。
- source_word: אֲשֶׁר עַל פְּנֵי רַבָּה
  choice: 拉巴对面的
  rationale: עַל־פְּנֵי在空间关系中可表示“在……前面、面向、对着”；“对面”保留其方位关系，不额外断定具体方向。
theological_decisions: []
