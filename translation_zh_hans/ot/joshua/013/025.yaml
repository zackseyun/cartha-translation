  register: 采用现代、庄重而易懂的叙事用语；地名依中文圣经传统作“雅谢、基列、亚扪、拉巴、亚罗珥”。将关系从句前置为“拉巴对面的亚罗珥”，符合现代汉语语序，同时保留原文空间表达的含混性。
