lexical_decisions:
- source_word: וַיִּתֵּן
  choice: 把产业分给了
  rationale: נתן本义为“给”；本节处于分配土地的语境中，中文补出“产业”可自然表达省略的受事，同时不把产业具体限定为“土地”。
- source_word: מֹשֶׁה
  choice: 摩西
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: לְמַטֵּה
  choice: 支派
  rationale: מַטֶּה在分地语境中指以色列的“支派”；前缀לְ标示领受者。
- source_word: בְנֵי רְאוּבֵן
  choice: 吕便支派
  rationale: 希伯来文直译为“吕便的子孙”；结合מַטֶּה译作自然的中文“吕便支派”，避免生硬重复。
- source_word: לְמִשְׁפְּחֹתָם
  choice: 按着……各宗族
  rationale: מִשְׁפָּחָה在支派内部划分中指“宗族”；לְ在这一固定分地表达中具有按宗族分配的组织性、分配性含义。
