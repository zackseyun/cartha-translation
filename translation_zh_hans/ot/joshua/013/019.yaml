  yaml_path: translation/ot/joshua/013/019.yaml
  text: and Kiriathaim[a], and Sibmah, and Zereth-shahar on the hill of the valley,
translation:
  language: zh_hans
  text: 还有基列亭、西比玛和谷中山上的洗列沙辖[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “洗列沙辖”也可能按词义理解为“黎明的洗列”。
    reason: 保留 צֶרֶת הַשַּׁחַר 可被视为完整复合地名，或视为“洗列”加“黎明”这一语义限定的词汇歧义。
lexical_decisions:
- source_word: קִרְיָתַיִם
  choice: 基列亭
  rationale: 这是城邑名，按希伯来语形式音译；采用现代中文圣经读者较易辨认的译名。
- source_word: שִׂבְמָה
  choice: 西比玛
  rationale: 这是城邑名，依希伯来语音译，并采用自然、常见的中文专名形式。
- source_word: צֶרֶת הַשַּׁחַר
  choice: 洗列·沙辖
  rationale: 上下文是一系列城邑名，因此将整个表达视为复合地名并音译；中点标明两个语素，同时不在正文中把后半部分直接译为“黎明”。
- source_word: בְּהַר הָעֵמֶק
  choice: 谷中山上的
  rationale: 介词 בְּ 表处所；הַר 可指山或山丘。译作“谷中山上”既符合自然汉语，也保留该地位于谷地之山上的地形关系，而不把原文的结构过度具体化。
