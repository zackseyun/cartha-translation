base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/007.yaml
  text: Now divide this land as an inheritance to the nine tribes and the half-tribe of Manasseh[a].
translation:
  language: zh_hans
  text: 现在，你要把这地分给九个支派和玛拿西半个支派，作为产业。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“现在，你要把这地作为产业，分给九个支派和玛拿西支派的一半。”
    reason: 保留 בְּנַחֲלָה 与分配动作的另一种句法表达，并反映 וַחֲצִי הַשֵּׁבֶט 也可直译为“支派的一半”。
lexical_decisions:
- source_word: וְעַתָּה
  choice: 现在
  rationale: 承接上文并引出下一项命令；现代汉语用“现在”自然清楚，“如今”也可表达这一转折。
- source_word: חַלֵּק
  choice: 分给
  rationale: 这是对约书亚发出的命令。在土地分配语境中，“分给”既表达划分，也自然带出受领者；“分配”亦可，但语体稍偏行政化。
- source_word: אֶת הָאָרֶץ הַזֹּאת
  choice: 这地
  rationale: 指上下文正在谈论的土地；“这地”简洁庄重，也符合圣经土地语境。
- source_word: בְּנַחֲלָה
  choice: 作为产业
  rationale: נַחֲלָה 指经分配而承受的土地产业。“产业”保留法律上的承受与盟约语境中的继承意味。
- source_word: לְתִשְׁעַת הַשְּׁבָטִים
  choice: 给九个支派
  rationale: 介词标明土地分配的受领者；与“分给”搭配符合现代汉语习惯。
- source_word: וַחֲצִי הַשֵּׁבֶט
  choice: 和……半个支派
  rationale: 指一个公认的支派分部；中文用“半个支派”直接、清楚。
- source_word: הַמְנַשֶּׁה
  choice: 玛拿西
  rationale: 按项目原则音译人名和支派名，采用现代中文圣经中通行的译名。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的命令句。补出“你要”以清楚表达希伯来语阳性单数祈使式的受命者，不额外点明约书亚。主文用“分给……作为产业”保持自然汉语，同时保留土地作为承受之业的含义。
