  yaml_path: translation/ot/joshua/013/010.yaml
  text: and all the cities of Sihon king of the Amorites[a], who reigned in Heshbon, as far as the border of the sons of Ammon.
translation:
  language: zh_hans
  text: 以及亚摩利人的王西宏的所有城邑——西宏在希实本作王——直到亚扪子孙的边界。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“亚扪人的边界。”希伯来语作“亚扪子孙的边界”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כֹל עָרֵי
  choice: 以及……所有的城邑
  rationale: וְ承接上文的疆域清单，译作“以及”；כֹל与עָרֵי合译为“所有的城邑”，既保留范围的完整性，也符合现代汉语的地理叙述。
- source_word: סִיחוֹן מֶלֶךְ הָאֱמֹרִי
  choice: 亚摩利人的王西宏
  rationale: 按希伯来语的领属关系表达西宏是亚摩利人的王；人名采用通行的圣经汉语音译“西宏”。
- source_word: אֲשֶׁר מָלַךְ בְּ/חֶשְׁבּוֹן
  choice: 西宏在希实本作王
  rationale: מָלַךְ特指担任君王、掌权统治，译作“作王”保留其王权含义；重复“西宏”可避免汉语关系从句指代含混。
- source_word: עַד גְּבוּל
  choice: 直到……的边界
  rationale: עַד表示疆域延伸所至的界限，“直到……的边界”准确而自然。
- source_word: בְּנֵי עַמּוֹן
  choice: 亚扪子孙
  rationale: 直译为“亚扪的子孙”，这里采用较简洁的“亚扪子孙”，保留希伯来语以祖名指称族群的表达；现代族名“亚扪人”列入脚注。
