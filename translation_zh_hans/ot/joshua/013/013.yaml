base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/013.yaml
  text: But the sons of Israel did not drive out the Geshurites or the Maacathites, and Geshur and Maacath lived among Israel to this day.
translation:
  language: zh_hans
  text: 但以色列人没有赶走基述人和玛迦人；基述和玛迦住在以色列人中间，直到今日。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 希伯来语直译为“以色列的众子”，在民族群体语境中，现代汉语自然表达为“以色列人”。
- source_word: הוֹרִישׁוּ
  choice: 赶走
  rationale: 此处使役词形表示将当地居民逐出其地；“赶走”准确、通俗，也符合约书亚记的土地分配语境。
- source_word: הַגְּשׁוּרִי וְאֶת הַמַּעֲכָתִי
  choice: 基述人和玛迦人
  rationale: 两个带定冠词的族群称谓，按现代中文圣经地名惯例音译并加“人”。
- source_word: גְּשׁוּר וּמַעֲכָת
  choice: 基述和玛迦
  rationale: 原文此处不再使用族群形容词形式，而用专名；保留为“基述和玛迦”，不擅自明确为地方或居民，以保存原文的转称。
- source_word: בְּקֶרֶב יִשְׂרָאֵל
  choice: 在以色列人中间
  rationale: בְּקֶרֶב 表示“在……之中”；中文补出“人”可避免把“以色列”误解为单纯地理范围。
- source_word: עַד הַיּוֹם הַזֶּה
  choice: 直到今日
  rationale: 保留叙述者所处时代的时间指示，采用庄重而仍属现代通行的表达。
