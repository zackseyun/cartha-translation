base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/011.yaml
  text: and Gilead[a], and the territory of the Geshurite and the Maacathite, and all Mount Hermon[b], and all Bashan as far as Salecah—
translation:
  language: zh_hans
  text: 以及基列、基述人和玛迦人的领地[a]、整个黑门山地[b]，以及直到撒迦的整个巴珊——
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“基述人和玛迦人的边界”。希伯来语这个词既可指边界线，也可指一个民族所占有的地域；这里按上下文译作“领地”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来语直译“整个黑门山”；这里可能指整个黑门山脉或山区，而不只是山峰。
    reason: cultural_note
lexical_decisions:
- source_word: הַגִּלְעָד
  choice: 基列
  rationale: 这是地区专名；中文按通行译名译作“基列”，无需体现希伯来语定冠词。
- source_word: גְבוּל הַגְּשׁוּרִי וְהַמַּעֲכָתִי
  choice: 基述人和玛迦人的领地
  rationale: גְבוּל既可指边界，也可指所辖地域；本节列举各片地区，故“领地”更符合语境，同时用脚注保留“边界”的可能。两个带定冠词的单数族称在此作集合用法，译为“基述人和玛迦人”。
- source_word: כֹל הַר חֶרְמוֹן
  choice: 整个黑门山地
  rationale: הַר可指一座山，也可指山区；כֹל与地域清单的语境表明这里很可能涵盖整个黑门山区，而非仅指山峰。
- source_word: כָל הַבָּשָׁן
  choice: 整个巴珊
  rationale: 巴珊是地区专名；“整个”准确表达כָל所指的全部范围。
- source_word: עַד סַלְכָה
  choice: 直到撒迦
  rationale: עַד标示疆域延伸的界限，译作“直到”；סַלְכָה按中文圣经地名惯例译作“撒迦”。
