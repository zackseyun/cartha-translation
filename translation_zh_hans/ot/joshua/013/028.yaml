  yaml_path: translation/ot/joshua/013/028.yaml
  text: This was the inheritance of the sons of Gad according to their clans—the cities and their villages[a].
translation:
  language: zh_hans
  text: 这就是迦得子孙按宗族所得的产业：这些城和它们的村庄。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“这就是迦得子孙按宗族所得的产业，就是这些城和它们的村庄。”希伯来语的概括句可将“这些城和它们的村庄”理解为对“产业”的同位说明；原文不明示时态。
    reason: 句法与时态的译法选择
lexical_decisions:
- source_word: זֹאת
  choice: 这就是
  rationale: 阴性单数指示代词回指上文所述的地业。希伯来语名词句本身不明示时态；现代汉语用“这就是”自然地保留这种概括语气，无须强加过去或现在时。
- source_word: נַחֲלַת
  choice: 所得的产业
  rationale: נַחֲלָה在分地语境中指承受或分得的土地产业。“产业”保留约书亚记中土地承受的内涵，加“所得的”使汉语句法自然。
- source_word: בְּנֵי גָד
  choice: 迦得子孙
  rationale: 保留希伯来语的谱系性支派称谓，同时在现代汉语中比直译“迦得的儿子们”更准确，所指为迦得的后裔及其支派。
- source_word: לְמִשְׁפְּחֹתָם
  choice: 按宗族
  rationale: 介词לְ在这里表示分配或分类；מִשְׁפָּחוֹת指支派内部的宗族单位。“按宗族”简洁准确。
- source_word: הֶעָרִים
  choice: 这些城
  rationale: עָרִים是分地清单中对城邑的常用称呼；定冠词结合上文语境译作“这些城”，表明是前文所列之城。
- source_word: וְחַצְרֵיהֶם
  choice: 和属城的村庄
  rationale: חָצֵר在疆域概括语中常指隶属于城邑的乡村聚落。“属城的村庄”明确表达其附属关系，也避免“院落”等脱离本语境的字面理解。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而通顺的标准普通话。“产业”延续圣经分地语境中的承受含义；“宗族”准确区分支派内部的家族群体。主文用“包括”自然表达总结范围，脚注保留同位句法的可能性及希伯来语无明示时态的特点。
