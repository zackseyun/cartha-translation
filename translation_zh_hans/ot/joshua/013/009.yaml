translation:
  language: zh_hans
  text: 从位于亚嫩谷边缘的亚罗珥起，包括谷中的那座城，以及从米底巴到低本的整个高原，
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מֵעֲרוֹעֵר
  choice: 从……亚罗珥
  rationale: 介词 מִן 表示范围的起点；亚罗珥为地名，采用常见音译。
- source_word: עַל שְׂפַת נַחַל אַרְנוֹן
  choice: 亚嫩谷边缘的
  rationale: שָׂפָה 本义为“边、沿”；נַחַל 可指河谷或溪谷。此处以“谷”配合后文“谷中”，并保留边界地貌表达。
- source_word: הָעִיר אֲשֶׁר בְּתוֹךְ הַנַּחַל
  choice: 谷中的那座城
  rationale: 直译关系从句；“那座城”保留定冠词及特指意味，不擅自补出城名。
- source_word: כָל הַמִּישֹׁר
  choice: 整个高原
  rationale: מִישׁוֹר 在此指米底巴一带较平坦的高原地区；“高原”比泛称“平原”更符合地形与上下文。
- source_word: מֵידְבָא עַד דִּיבוֹן
  choice: 从米底巴起……直到底本
  rationale: מִן…עַד 表示从起点到终点的范围；两地名采用常见中文译名。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而自然的地界叙述。按希伯来语结构，本节是承接上下文的未完句，因此保留句末逗号。为减少中文中多个“从”连续造成的歧义，将“直到底本”前置到并列地界之后，同时仍表达高原范围自米底巴至底本。
