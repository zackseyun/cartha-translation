base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/030.yaml
  text: 'Their territory was from Mahanaim: all Bashan[a], all the kingdom of Og king of Bashan[b], and all the villages of Jair that are in Bashan—sixty cities.'
translation:
  language: zh_hans
  text: 他们的疆域从玛哈念起，包括整个巴珊、巴珊王噩的全部国土，以及巴珊境内所有睚珥的村落[a]，共六十座城。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译作“哈倭特·睚珥”，这是这些聚落之希伯来名称的传统音译。
    reason: lexical_alternative
lexical_decisions:
- source_word: גְבוּלָם
  choice: 他们的疆域
  rationale: גְּבוּל既可指边界，也可指边界以内的地域；本节处于分地清单中，译作“疆域”比单指界线的“边界”更合适。
- source_word: מִמַּחֲנַיִם
  choice: 从玛哈念起
  rationale: 介词מִן表示范围描述的起点；补出“起”使现代汉语自然，同时不改变原文关系。
- source_word: כָּל הַבָּשָׁן
  choice: 整个巴珊
  rationale: 保留כָּל的周全含义，并将巴珊视为地域名称。
- source_word: כָּל מַמְלְכוּת עוֹג מֶלֶךְ הַבָּשָׁן
  choice: 巴珊王噩的全部国土
  rationale: מַמְלְכוּת可指王国或王权统辖的领域；此处在疆域清单中，“国土”自然且准确，也避免把地理范围误读为政治制度。
- source_word: חַוֺּת יָאִיר
  choice: 睚珥的村落
  rationale: חַוּוֹת在这里指与睚珥相关的聚落或村庄；正文采用清楚的意译，传统音译另见脚注。
- source_word: אֲשֶׁר בַּבָּשָׁן
  choice: 巴珊境内
  rationale: 以简洁的现代汉语表达关系从句所说明的地点。
- source_word: שִׁשִּׁים עִיר
  choice: 六十座城
  rationale: עִיר可指城或城镇；“城”符合圣经地理清单的常用表达，并不必然暗示现代意义上的大城市。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“就是”将“整个巴珊”与随后对该地域的说明自然衔接；“共”明确六十座城是前述睚珥村落的总数。专名采用常见中文圣经译名：玛哈念、巴珊、噩、睚珥。
