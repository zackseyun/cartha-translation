  text: 'This is the land that remains: all the districts of the Philistines[b][a], and all the Geshurites—'
translation:
  language: zh_hans
  text: 所剩下的地如下：非利士人的所有地区[a]，以及基述人所居的全境[b]——
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “地区”或译“区域”。希伯来语 גְּלִילוֹת 指与非利士人有关的地域范围。
    reason: lexical_alternative
  - marker: b
    text: 希伯来语作单数形式“基述人”，是集合族称；在本节尚未取得之地的语境中，指基述人所居的地域。
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת הָאָרֶץ הַנִּשְׁאָרֶת
  choice: 所剩下的地如下
  rationale: זֹאת引出说明，הַנִּשְׁאָרֶת是修饰“地”的尼法勒分词。“所剩下的地如下”既保留尚未取得之地的含义，也自然引出后面的清单。
- source_word: כָּל גְּלִילוֹת
  choice: 各地区
  rationale: גְּלִילוֹת指地域范围或区域；“各地区”在现代汉语中自然，并体现כָּל所表达的整体涵盖。
- source_word: הַפְּלִשְׁתִּים
  choice: 非利士人
  rationale: 原文直接使用族名，并与前面的“地区”构成所属关系，因此译作“非利士人的各地区”，而不改为地名“非利士地”。
- source_word: וְכָל הַגְּשׁוּרִי
  choice: 以及所有基述人
  rationale: הַגְּשׁוּרִי在形态上是单数族称，但在此具有集合意义；用复数概念“所有基述人”准确传达其群体含义，并保留כָּל。
