  text: וַ/יְהִ֨י לָ/הֶ֜ם הַ/גְּב֗וּל מֵ/עֲרוֹעֵ֡ר אֲשֶׁר֩ עַל שְׂפַת נַ֨חַל אַרְנ֜וֹן וְ/הָ/עִ֨יר אֲשֶׁ֧ר בְּ/תוֹךְ הַ/נַּ֛חַל וְ/כָל הַ/מִּישֹׁ֖ר עַל מֵידְבָֽא־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/016.yaml
  text: Their border was from Aroer[a], which is on the edge of the Valley of the Arnon, and the city that is in the middle of the valley[b], and all the tableland as far as Medeba.
translation:
  language: zh_hans
  text: 他们的边界从亚罗珥起；亚罗珥位于亚嫩河谷[a]边缘。边界又包括谷中的那座城，以及直到米底巴的整个高原[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “河谷”或译“干河谷”或“溪谷”。希伯来语 נַחַל 可指溪流、河床或谷地。
    reason: lexical_alternative
  - marker: b
    text: “高原”或译“台地”或“平原”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי לָהֶם הַגְּבוּל
  choice: 他们的边界……
  rationale: 按希伯来语领地划分语境译为“他们的边界”，比直译“边界归他们”更符合现代汉语表达。
- source_word: מֵעֲרוֹעֵר
  choice: 从亚罗珥起
  rationale: 介词 מִן 标明边界的起点；地名按通行音译处理。
- source_word: אֲשֶׁר עַל שְׂפַת נַחַל אַרְנוֹן
  choice: 亚罗珥位于亚嫩河谷边缘
  rationale: שָׂפָה 本义为“唇、边缘、岸边”；נַחַל 可指溪流、干河床或河谷，此处以“河谷”呈现地貌，同时以脚注保留其他可能。
- source_word: וְהָעִיר אֲשֶׁר בְּתוֹךְ הַנַּחַל
  choice: 边界又包括谷中的那座城
  rationale: בְּתוֹךְ 表示“在……之中”。补出“边界又包括”以使并列的领土范围在现代汉语中清楚自然，但不具体认定该城名称。
- source_word: וְכָל הַמִּישֹׁר
  choice: 整个高原
  rationale: מִישׁוֹר 在约旦河东地理语境中指平坦的高地或台地；“高原”比单纯“平原”更能传达当地地貌。
- source_word: עַל מֵידְבָא
  choice: 直到米底巴
  rationale: 在边界描述中，עַל 可表示范围延伸至某地；“直到”清楚表达其界限。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。为避免希伯来语连续并列在中文中造成边界起点与领土所含地点之间的关系含混，分为两句，并补出“边界又包括”；所有脚注标记均置于对应正文词语之后。
