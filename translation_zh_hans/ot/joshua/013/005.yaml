base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/005.yaml
  text: and the land of the Gebalites[a], and all Lebanon toward the sunrise, from Baal-gad below Mount Hermon to Lebo-hamath,
translation:
  language: zh_hans
  text: 以及迦巴勒人的地，以及从黑门山下的巴力·迦得直到利波—哈马[a]、向东延伸的黎巴嫩全境。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“直到哈马口”，即通往哈马的入口。希伯来语既可理解为描述性的边界用语，也可理解为地名“利波—哈马”。
    reason: 保留עַד לְבוֹא חֲמָת作为固定地名或描述性边界表达的歧义。
lexical_decisions:
- source_word: הָאָרֶץ הַגִּבְלִי
  choice: 迦巴勒人的地
  rationale: הַגִּבְלִי是与迦巴勒（Gebal）相关的族称；译作“迦巴勒人的地”既保留地名联系，也自然表达其地域含义。
- source_word: וְכָל הַלְּבָנוֹן
  choice: 和黎巴嫩全境
  rationale: כָל表示范围完整；“全境”在现代汉语地理边界叙述中自然，并保留“整个黎巴嫩地区”的意思。
- source_word: מִזְרַח הַשֶּׁמֶשׁ
  choice: 东边
  rationale: 字面与“日出”有关，是希伯来语表示东方的惯用表达；“东边”准确传达方位，同时避免现代汉语中生硬的直译。
- source_word: מִבַּעַל גָּד
  choice: 从……巴力·迦得
  rationale: 这是地名，采用音译；介词מִן标明边界的起点，译作“从”。
- source_word: תַּחַת הַר חֶרְמוֹן
  choice: 黑门山下的
  rationale: תַּחַת在地理描述中表示处于山体下方；“黑门山下”自然且不额外限定为山脚。
- source_word: עַד לְבוֹא חֲמָת
  choice: 直到利波—哈马
  rationale: 该短语可作为边界地名理解，也可理解为“通往哈马的入口”；正文采用音译地名，脚注保留描述性读法。
