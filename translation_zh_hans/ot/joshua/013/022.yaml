  yaml_path: translation/ot/joshua/013/022.yaml
  text: And Balaam son of Beor[a], the diviner, the sons of Israel killed with the sword among their slain.
translation:
  language: zh_hans
  text: 以色列人也用刀杀了比珥的儿子、占卜者巴兰；他与他们所杀的其他人一同被杀。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在他们所杀的人中间。”原文末尾的说法不太寻常，表示巴兰的死与以色列人所杀的其他人有关。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֶת
  choice: 也
  rationale: וְ在征服清单中增列巴兰，译作“也”自然表达附加关系；אֶת是直接宾语标记，无须另译。
- source_word: בִּלְעָם בֶּן בְּעוֹר
  choice: 比珥的儿子巴兰
  rationale: 按现代中文圣经人名惯例音译，并直接保留希伯来文父子称谓。
- source_word: הַקּוֹסֵם
  choice: 占卜者
  rationale: קֹסֵם指从事占卜的人；“占卜者”准确、简洁，并保留原文对巴兰的同位说明及其负面语感。
- source_word: הָרְגוּ בְנֵי יִשְׂרָאֵל
  choice: 以色列人……杀了
  rationale: 中文以“以色列人”自然表达בְנֵי יִשְׂרָאֵל；הרג用常用而直接的“杀了”，不增添原文没有的修辞色彩。
- source_word: בַּחֶרֶב
  choice: 用刀
  rationale: 工具性的בְּ译作“用”；חֶרֶב在战争语境中泛指刀剑兵器，中文圣经传统和现代用法均可简洁译作“刀”。
- source_word: אֶל חַלְלֵיהֶם
  choice: 使他与他们所杀的人一同被杀
  rationale: 句末短语结构较不寻常，表达巴兰与以色列人所杀的其他人关联、一同遭杀；采用稍作展开的中文以传达其关系，同时不把אֶל强解为单一空间含义。
