  yaml_path: translation/ot/joshua/013/020.yaml
  text: and Beth-peor[a], and the slopes of Pisgah, and Beth-jeshimoth.
translation:
  language: zh_hans
  text: 还有伯·毗珥、毗斯迦山坡[a]和伯·耶西末。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “山坡”或可译作“泉源”或“山麓”。希伯来语这个词可指不止一种地形。
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵית פְּעוֹר
  choice: 伯·毗珥
  rationale: 这是地名，按现代中文圣经地名惯例音译；用间隔号体现复合名称，同时避免按字面译作“毗珥之家”。
- source_word: אַשְׁדּוֹת
  choice: 山坡
  rationale: 该词在与“毗斯迦”连用的地形语境中，较自然地指山坡或斜坡；“山坡”是普通读者易懂且符合地名清单语境的表达。原词也可能有其他地形解释，故加注说明。
- source_word: הַפִּסְגָּה
  choice: 毗斯迦
  rationale: 这里作为专有地名使用，采用惯用音译；希伯来语定冠词不必在中文地名中另行表达。
- source_word: בֵית הַיְשִׁמוֹת
  choice: 伯·耶西末
  rationale: 这是地名，采用音译而不按字面译为“荒凉之家”；间隔号清楚呈现复合地名。
