  yaml_path: translation/ot/joshua/013/017.yaml
  text: 'Heshbon and all its cities that are on the plateau: Dibon[a], Bamoth-baal, and Beth-baal-meon.'
translation:
  language: zh_hans
  text: 希实本和属它的各城，就是高原上的底本[a]、巴末巴力和伯巴力勉。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “高原”也可译作“平原”或“台地”。这里的希伯来语词指约旦河东地势平坦的高地地区。
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶשְׁבּוֹן
  choice: 希实本
  rationale: 专有地名，采用现代中文圣经中通行的音译。
- source_word: וְכָל עָרֶיהָ
  choice: 和所有属于它……的城
  rationale: 阴性单数后缀指回作为城邑的希实本；用“属于它”明确各城与希实本的隶属关系，同时保持现代汉语自然。
- source_word: אֲשֶׁר בַּמִּישֹׁר
  choice: 位于高原
  rationale: מִישׁוֹר 在约旦河东的地域语境中指平坦的高地或台地；“高原”简明自然，也符合当地地貌。
- source_word: דִּיבוֹן
  choice: 底本
  rationale: 专有地名，采用通行中文音译。
- source_word: וּבָמוֹת בַּעַל
  choice: 巴末巴力
  rationale: 此处是复合地名，不按普通名词短语译作“巴力的丘坛”；采用通行中文音译。
- source_word: וּבֵית בַּעַל מְעוֹן
  choice: 和伯巴力勉
  rationale: 此处是复合地名；保留其专名性质并采用通行中文音译，不将 בֵּית 单独意译为“家”或“殿”。
