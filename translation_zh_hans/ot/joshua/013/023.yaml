base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/023.yaml
  text: And the border of the sons of Reuben was the Jordan and its border. This was the inheritance of the sons of Reuben according to their clans[a], the cities and their villages.
translation:
  language: zh_hans
  text: 吕便子孙的边界是约旦河及其边界[a]。这就是吕便子孙按宗族所得的产业，包括各城邑和附属的村庄。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“以约旦河为界。”希伯来语原句十分简略，直译近于“约旦河和边界”，可理解为约旦河本身构成边界线。
    reason: 保留 וּגְבוּל 这一紧凑地理表述的词义歧义。
lexical_decisions:
- source_word: וַיְהִי
  choice: 是
  rationale: 在划界总结语中，היה 表明边界为何，并不着重表达“成为”；用“是”符合现代汉语。
- source_word: גְּבוּל
  choice: 边界
  rationale: 本节说明吕便支派领地的界线，“边界”准确而自然；不取可能误指整片领土的“境域”。
- source_word: בְּנֵי רְאוּבֵן
  choice: 吕便子孙
  rationale: 既保留希伯来语的宗族表达，也符合中文圣经地名与支派叙述的庄重用语。
- source_word: הַיַּרְדֵּן
  choice: 约旦河
  rationale: 汉语中补出“河”可立即表明该专名所指的地理实体，比单说“约旦”清楚。
- source_word: וּגְבוּל
  choice: 及其沿岸
  rationale: 原文直译近于“和边界”，措辞紧凑且没有明写代词；“及其沿岸”表达约旦河连同其边缘界线的通常理解，同时用脚注保留“以约旦河为界”的可能读法。
- source_word: נַחֲלַת
  choice: 所得的产业
  rationale: “产业”保留土地作为支派承受之份的概念；加“所得的”使现代汉语通顺，又不额外限定取得方式。
- source_word: לְמִשְׁפְּחֹתָם
  choice: 按宗族
  rationale: 在支派分地语境中，מִשְׁפָּחוֹת 指支派内部的宗族单位，“宗族”比泛称“家庭”准确。
- source_word: הֶעָרִים
  choice: 各城
  rationale: עָרִים 在分地清单中通常指列出的城邑；“各城”简洁自然。
- source_word: וְחַצְרֵיהֶן
  choice: 和附属的村庄
  rationale: חֲצֵרִים 在此指隶属于各城的无城墙聚落；“附属的村庄”兼顾关联性和现代可懂性。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言；保留“吕便子孙”“产业”“宗族”等承载原文社会结构和分地语境的词语。脚注标记紧接其所解释的边界短语。
