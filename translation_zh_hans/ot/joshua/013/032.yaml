  yaml_path: translation/ot/joshua/013/032.yaml
  text: These are what Moses apportioned as an inheritance in the plains of Moab[b][a], beyond the Jordan east of Jericho.
translation:
  language: zh_hans
  text: 以上是摩西在摩押平原所分配为产业之地[a]，在约旦河东边、耶利哥对面[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“所赐为产业之地”或“所分给人承受为业之地”。希伯来语动词着重把土地分给人，作为所承受的产业。
    reason: lexical_alternative
  - marker: b
    text: 或译：“在约旦河那边”或“在约旦河对岸”。这是希伯来语常用的地理说法；其表述可随观察方位而变化。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה אֲשֶׁר
  choice: 以上是……的地
  rationale: 复数指示词与关系词共同引出总结句。根据本章土地分配的语境补出“地”，使现代汉语自然清楚，又不改变所指内容。
- source_word: נִחַל
  choice: 分作产业
  rationale: 该动词在使役用法中表示把土地分配给人承受；“分作产业”兼顾分配行为与承受产业的含义。
- source_word: בְּעַרְבוֹת מוֹאָב
  choice: 在摩押平原
  rationale: עֲרָבוֹת 指平坦的旷野或草原地带；“摩押平原”是自然且准确的地理表达。
- source_word: מֵעֵבֶר לְיַרְדֵּן
  choice: 约旦河对岸
  rationale: 这是惯常的地理用语；“对岸”保留其视角相关性，不自行把方向并入该短语。
- source_word: יְרִיחוֹ מִזְרָחָה
  choice: 在耶利哥以东
  rationale: 方向词明确指出相对于耶利哥的东方位置；此译法符合现代汉语地理表达。
theological_decisions: []
