  text: And Moses gave to the tribe of Gad[a], to the sons of Gad, according to their clans.
translation:
  language: zh_hans
  text: 摩西把产业按着他们的宗族分给迦得支派，就是迦得的子孙[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“迦得的儿子们”。希伯来文直译为“迦得的儿子们”，在支派谱系的表达中可指迦得的后裔或支派成员。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: 分给
  rationale: נתן本义为“给”；在分地语境中，“分给”自然表达把产业授予某支派的意思。希伯来文未明说宾语，但上下文表明所给的是产业，因此译文补出“产业”以便现代读者理解。
- source_word: מֹשֶׁה
  choice: 摩西
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: לְמַטֵּה גָד
  choice: 给迦得支派
  rationale: מַטֶּה在此是宗族与领土分配语境中的“支派”，并非字面的“杖”。
- source_word: לִבְנֵי גָד
  choice: 就是迦得的子孙
  rationale: בְּנֵי字面为“儿子们”，在支派谱系表达中指迦得的后裔或支派成员；“子孙”既保留谱系色彩，也符合自然中文。将介词短语处理为“就是……”的同位说明，避免误解为两个不同受领群体。
- source_word: לְמִשְׁפְּחֹתָם
  choice: 按着他们的宗族
  rationale: מִשְׁפָּחָה在分地语境中指支派以下的宗族单位；介词לְ在固定表达中具有按宗族分配的意思。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“产业”由分地上下文补明；末尾复现“分给他们”，使“按着他们的宗族”的分配关系在中文中清楚，同时不改变经文所述受领者。
