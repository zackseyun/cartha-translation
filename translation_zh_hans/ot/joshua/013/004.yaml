base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/004.yaml
  text: from the south[a], all the land of the Canaanites, and Mearah that belongs to the Sidonians, as far as Aphek[b], to the border of the Amorites.
translation:
  language: zh_hans
  text: 从南边起，迦南人[a]的全地，以及属于西顿人的米亚拉[b]，直到亚弗，直到亚摩利人的边界。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “迦南人”和本节末尾的“亚摩利人”，希伯来文都使用单数族称，但在这里具有集合意义。
    reason: lexical_alternative
  - marker: b
    text: “米亚拉”也可译为“山洞”，即“属于西顿人的山洞”。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִתֵּימָן
  choice: 从南边起
  rationale: תֵּימָן常指“南方、南边”；在疆域清单中宜按方位理解。介词מִן表达起点，故译为“从南边起”，而不将其视为地名“提幔”。
- source_word: כָּל אֶרֶץ הַכְּנַעֲנִי
  choice: 迦南人的全地
  rationale: 贴近原文“迦南人的全地”；单数族称在这里具有集合意义，汉语用“迦南人”可自然表达整个族群。
- source_word: וּמְעָרָה
  choice: 以及……米亚拉
  rationale: 按疆域列举的句法，将מְעָרָה理解为地名并音译为“米亚拉”；同时以脚注保留其作为普通名词“山洞”的可能。
- source_word: אֲשֶׁר לַצִּידֹנִים
  choice: 属于西顿人的
  rationale: 介词ל在此表示归属，用现代汉语“属于”自然传达该地与西顿人的隶属关系。
- source_word: עַד אֲפֵקָה
  choice: 直到亚弗
  rationale: עַד表示疆域延伸所达到的界点；地名后的方向词尾已由“直到”充分体现。
- source_word: עַד גְּבוּל הָאֱמֹרִי
  choice: 直到亚摩利人的边界
  rationale: 保留第二个עַד，不把亚弗与亚摩利人的边界强行视为同一地点；גְּבוּל在疆域语境中译作“边界”最直接。
