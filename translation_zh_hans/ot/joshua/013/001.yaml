  text: וִ/יהוֹשֻׁ֣עַ זָקֵ֔ן בָּ֖א בַּ/יָּמִ֑ים וַ/יֹּ֨אמֶר יְהוָ֜ה אֵלָ֗י/ו אַתָּ֤ה זָקַ֨נְתָּה֙ בָּ֣אתָ בַ/יָּמִ֔ים וְ/הָ/אָ֛רֶץ נִשְׁאֲרָ֥ה הַרְבֵּֽה מְאֹ֖ד לְ/רִשְׁתָּֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/001.yaml
  text: Joshua was old[a], advanced in years, and Yahweh said to him, “You are old, advanced in years, and very much of the land remains to be possessed.”
translation:
  language: zh_hans
  text: 约书亚年纪老迈，已到高龄；雅威对他说：“你年纪老迈，已到高龄，仍有许多土地尚待取得[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“尚待承受为业”。希伯来语动词可指取得或占有土地，也可指将土地承受为产业。
    reason: lexical_alternative
lexical_decisions:
- source_word: זָקֵן
  choice: 年事已高
  rationale: 作谓语描述约书亚年老的状态；“年事已高”自然、庄重，也不增添原文没有的含义。
- source_word: בָּא בַּיָּמִים
  choice: 年纪老迈
  rationale: 这是字面为“进入年日”的年龄习语，表示已到高龄；此译法清楚传达其惯用意义，并与前句形成原文所有的强调性复述。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语中常见的音译呈现四字神名，而不以称号替代原文的专名。
- source_word: הָאָרֶץ
  choice: 土地
  rationale: 这里指以色列尚未取得的迦南土地；“土地”既保留地理含义，也适合与“占领”搭配。
- source_word: נִשְׁאֲרָה הַרְבֵּה מְאֹד
  choice: 还有非常多
  rationale: 保留“剩下”之意以及 הַרְבֵּה מְאֹד 的双重加强语气，以自然现代汉语表达尚未取得之地数量或范围很大。
- source_word: לְרִשְׁתָּהּ
  choice: 有待占领
  rationale: ירשׁ 在土地语境中可表示取得、占有或承受为业；正文采用“占领”，贴合《约书亚记》当前尚未取得土地的军事—地理语境，同时用脚注保留“承受为业”的词义可能。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；译作“雅威”旨在以音译保留其专名性质，不以“主”等称号替代。
- issue: ירשׁ 在应许之地语境中的含义
  choice: 占领
  alternative: 承受为业
  rationale: 本节重点是仍有许多土地尚待以色列实际取得，因此正文取“占领”；但该动词也可带有承受产业的盟约含义，故以脚注保留，不把两层张力静默消除。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。保留叙述者与雅威话语中对约书亚高龄的重复，以体现原文的强调；不添加原文没有的“那时”或“如今”等篇章标记。脚注标记置于其实际说明的“占领”之后。
