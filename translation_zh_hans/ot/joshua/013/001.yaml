revisions:
- from: 约书亚年事已高，年纪老迈。雅威对他说：“你年事已高，年纪老迈，还有非常多的土地有待占领[a]。”
  to: 约书亚年纪老迈，已到高龄；雅威对他说：“你年纪老迈，已到高龄，仍有许多土地尚待取得[a]。”
  rationale: 修订以“年纪老迈，已到高龄”对应זָקֵן与בָּא בַּיָּמִים，并在叙述与引语中保留原文的重复。“仍有许多土地尚待取得”对应“土地还剩下很多，待其取得”，既保留未完成的取得意义，也不将ירשׁ预先限定为“占领”。脚注锚定于“取得”，说明其“承受为业”的词义可能。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T05:20:50Z'
review_pass:
