  source_fidelity: 草稿总体准确地保留了约书亚年老的双重表述、雅威的专名，以及尚有大量土地未被取得的意思。不过，“占领”较明显地将ירשׁ限定为军事征服，原文在此可指取得／占有土地，并保有“承受为业”的语义范围；正文宜采用较中性的译法。
  naturalness: “年事已高，年纪老迈”虽可理解，却是近义词机械并列，现代汉语略显重复生硬；“还有非常多的土地有待占领”中的“非常多”偏口语，且“有待占领”语气较行政化。改为“年纪老迈，已到高龄”及“仍有许多土地尚待取得”更自然庄重，同时保留原文的重复和强调。
  terminology: “雅威”恰当保留了יהוה的专名性质。“土地”适合此处的הארץ。将“占领”改为“取得”可避免不必要地缩窄ירשׁ的词义；脚注保留“承受为业”的可能。
  issues:
