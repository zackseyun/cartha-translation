language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וּ/לְ/שֵׁ֨בֶט֙ הַ/לֵּוִ֔י לֹֽא נָתַ֥ן מֹשֶׁ֖ה נַחֲלָ֑ה יְהוָ֞ה אֱלֹהֵ֤י יִשְׂרָאֵל֙ ה֣וּא נַחֲלָתָ֔/ם כַּ/אֲשֶׁ֖ר דִּבֶּ֥ר לָ/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/033.yaml
  text: But to the tribe of Levi Moses gave no inheritance; Yahweh[a], the God of Israel, is their inheritance, just as he spoke to them.
translation:
  language: zh_hans
  text: 但摩西没有把产业[a]分给利未支派；雅威——以色列的神——就是他们的产业，正如他对他们所说的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “产业”也可译作“份”。本节两处“产业”均译自同一个希伯来词 נַחֲלָה。
    reason: 说明该词既可指承受的产业，也可指所得的份；两处用词相同对本节的对照关系很重要。
lexical_decisions:
- source_word: וּ/לְ/שֵׁבֶט הַלֵּוִי
  choice: 但……给利未支派
  rationale: 前缀连词在上下文中表示与其他支派所得土地的对比，因此译作“但”；“利未支派”明确指整个支派，而不是个别利未人。
- source_word: לֹא נָתַן מֹשֶׁה נַחֲלָה
  choice: 摩西没有把产业分给
  rationale: “分给”自然体现约书亚记土地分配的语境；“产业”保留 נַחֲלָה 所含的承受、份额和土地归属意味。
- source_word: יְהוָה
  choice: 雅威
  rationale: 采用神圣四字名的现代汉语音译，保留其作为以色列之神专名的性质，不以“主”这一称号替代。
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: 以色列的神
  rationale: 直接而自然地保留原文的属格关系及盟约身份表述。
- source_word: הוּא נַחֲלָתָם
  choice: 就是他们的产业
  rationale: “就是”体现原文独立代词 הוּא 的强调作用，并与前一处 נַחֲלָה 保持用词一致。
- source_word: כַּאֲשֶׁר דִּבֶּר לָהֶם
  choice: 正如他对他们所说的
  rationale: 按 דִּבֶּר 的基本义译为“说”，不擅自强化为“应许”；“正如”表达 כַּאֲשֶׁר 的对应关系。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文使用神的专名；“雅威”较直接地按通行学术重构音译 YHWH，避免把专名改成称号，也不采用源于较晚元音组合的“耶和华”。
- issue: 雅威作为利未支派的“产业”
  choice: 保留“雅威……就是他们的产业”的原文断言
  alternative: 意译为“他们从雅威所得的份”或“他们享有祭司的权利”
  rationale: 原文直接把雅威自己称为他们的 נַחֲלָה。译文保留这一隐喻及其神学张力，不将其缩减为物质供给、职务或特权。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“把产业分给”符合土地分配语境；破折号标明“以色列的神”是对“雅威”的同位说明。
