base_translation:
  language: en
  yaml_path: translation/ot/joshua/005/004.yaml
  text: 'And this is the reason why Joshua circumcised them: all the people who came out of Egypt[a], the males, all the men of war[b], had died in the wilderness on the way after they came out of Egypt.'
translation:
  language: zh_hans
  text: 约书亚给他们行割礼的原因[a]是：凡从埃及出来的百姓中的男丁，即所有作战的男子[b]，都在从埃及出来的路上死在旷野。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 较形式对应的译法是：“这就是约书亚所行割礼的事。”这里的希伯来语表达按上下文是在引出约书亚这样做的原因。
    reason: lexical_alternative
  - marker: b
    text: “作战的男子”也可译作“战士”或“战斗人员”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזֶה הַדָּבָר אֲשֶׁר מָל יְהוֹשֻׁעַ
  choice: 约书亚给他们行割礼的原因是
  rationale: 希伯来语直译近似“约书亚所行割礼的事是这样”，在此惯用结构引出行动的缘由。译作“原因是”符合现代汉语，同时以脚注保留较形式对应的读法；“他们”按上下文补出。
- source_word: מָל
  choice: 行割礼
  rationale: 准确、通行地表达动词 מול，且符合庄重的现代汉语圣经语体。
- source_word: כָּל הָעָם הַיֹּצֵא מִמִּצְרַיִם הַזְּכָרִים
  choice: 凡从埃及出来的百姓中的男丁
  rationale: “男丁”保留 הַזְּכָרִים 对性别的明确限定，并用“百姓中的”清楚呈现其对前一词组的范围限定，避免误解为所有男女都死了。
- source_word: כֹּל אַנְשֵׁי הַמִּלְחָמָה
  choice: 所有能作战的人
  rationale: 自然表达军事身份，同时保留“所有”的完整范围；脚注列出更形式对应的译法。
- source_word: מֵתוּ בַמִּדְבָּר בַּדֶּרֶךְ
  choice: 都在……旅途中死在旷野了
  rationale: 兼顾 בַּדֶּרֶךְ 的行程含义和 בַמִּדְבָּר 的地点含义，语序符合自然汉语。
- source_word: בְּצֵאתָם מִמִּצְרָיִם
  choice: 出埃及后
  rationale: 该介词不定式结构在这里交代旷野旅程相对于出埃及的时间，译作“后”符合叙事顺序。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。“旷野”“行割礼”等词保留常见的圣经语汇；句法经过适度调整，以清楚表达希伯来语中同位语对“百姓”范围的限定。
