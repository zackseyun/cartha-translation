revisions:
- from: 他说[a]：“不；我如今来，是作耶和华军队的统帅。”约书亚就面伏于地，俯伏下拜[b]，对他说：“我主有什么话吩咐仆人？”
  to: 他说[a]：“不；我如今已经来到，是耶和华军队的统帅。”约书亚就面伏于地，俯伏下拜[b]，对他说：“我主有什么话要对仆人说？”
  rationale: 修订仅处理两处细微但有意义的语义问题：“如今已经来到”明确原文完成式所表达的现时到场；“有什么话要对仆人说”保留动词“说”的开放性，不把话语预设为命令。其余措辞、专名、动作描写和脚注锚点均可维持。
