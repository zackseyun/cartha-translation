source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר לֹ֗א כִּ֛י אֲנִ֥י שַׂר צְבָֽא יְהוָ֖ה עַתָּ֣ה בָ֑אתִי וַ/יִּפֹּל֩ יְהוֹשֻׁ֨עַ אֶל פָּנָ֥י/ו אַ֨רְצָ/ה֙ וַ/יִּשְׁתָּ֔חוּ וַ/יֹּ֣אמֶר ל֔/וֹ מָ֥ה אֲדֹנִ֖/י מְדַבֵּ֥ר אֶל עַבְדּֽ/וֹ׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/005/014.yaml
  text: He said[a], “No; rather, I have now come as the commander of the army of Yahweh.” Then Joshua fell with his face to the ground and bowed down, and said to him[b], “What is my lord saying to his servant?”
translation:
  language: zh_hans
  text: 他说[a]：“不；我如今已经来到，是耶和华军队的统帅。”约书亚就面伏于地，俯伏下拜[b]，对他说：“我主有什么话要对仆人说？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“都不是；我如今已经来到，是耶和华军队的统帅。”
    reason: לֹא字面是“不”，在前一节“帮助我们，还是帮助我们的敌人”的二选一问句之后，也可按语境理解为“都不是”。
  - marker: b
    text: “俯伏下拜”也可译作“敬拜”；这里保留动作本身，不单凭本节判定这位人物的身份。
    reason: 希伯来语动词שחה既可表示俯伏致敬，也可表示敬拜。
lexical_decisions:
- source_word: לֹא כִּי
  choice: 不；……是……
  rationale: לֹא直接否定前一节的二选一问句，כִּי随即引出纠正说明。中文用“不；我……是……”自然表达“不是你所说的那两种定位；我的身份是……”，但不在正文中额外补出“都不是”。
- source_word: שַׂר צְבָא יְהוָה
  choice: 耶和华军队的统帅
  rationale: שַׂר在军事语境中指统领者，译作“统帅”清楚而庄重；צְבָא取具体军事义“军队”，避免较古奥的“军旅/万军”。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代简体中文圣经语域中通行的专名“耶和华”对应四字神名，保留其作为专名的功能，而不改作一般称号。
- source_word: עַתָּה בָאתִי
  choice: 我如今来
  rationale: 保留עַתָּה的时间强调；希伯来语完成式在此表示已经来到并现正到场，中文“如今来”自然涵盖这一现场意义。
- source_word: וַיִּפֹּל יְהוֹשֻׁעַ אֶל פָּנָיו אַרְצָה
  choice: 约书亚就面伏于地
  rationale: 简洁保留脸朝向地面的俯身动作；“面伏于地”庄重、清楚，并与随后שחה所指的敬礼动作有所区分。
- source_word: וַיִּשְׁתָּחוּ
  choice: 俯伏下拜
  rationale: 该动词可指向人行俯伏礼，也可在特定语境中指敬拜。“俯伏下拜”保留动作及敬意，却不单凭本节断定其神学性质。
- source_word: אֲדֹנִי
  choice: 我主
  rationale: 保留带第一人称后缀的尊称。这里是约书亚对该人物的恭敬称呼，不通过译文大小写或额外措辞预先判定其身份。
- source_word: מָה אֲדֹנִי מְדַבֵּר אֶל עַבְדּוֹ
  choice: 我主有什么话吩咐仆人？
  rationale: 直译近于“我主对他的仆人说什么”；在上下级对话中，“有什么话吩咐仆人”是自然中文，并保留约书亚自称仆人的谦卑关系。
theological_decisions:
- issue: 约书亚的动作是否应明确译为对神的“敬拜”
  choice: 正文译作“俯伏下拜”
  alternative: 译作“敬拜”
  rationale: שחה的语义范围兼有俯伏致敬与敬拜。本节本身未必要求译者先行判定对象的本体身份，因此正文描述动作，脚注说明另一可能。
- issue: 是否在译文中把统帅明确认定为天使、神显或基督显现
  choice: 仅按经文称为“耶和华军队的统帅”
  alternative: 添加“天使”等身份说明，或用措辞暗示神显/基督显现
  rationale: 本节给出职衔，却没有直接作出更具体的本体论说明；译文不替经文消除这一神学张力。
- issue: לֹא对前一节二选一问题的作用
  choice: 正文保留直接否定“不”，脚注列出“都不是”
  alternative: 正文直接译作“都不是”
  rationale: “都不是”能清楚表达语境中的含义，却比单独的לֹא略多一层解释。正文保持形式上的简洁，脚注呈现合理的语境性译法。
translation_notes:
  register: 采用现代、庄重而易懂的普通话书面语。“统帅”“面伏于地”“俯伏下拜”保留叙事的肃穆感；避免生硬逐词翻译，也避免借译文解决人物身份及下拜性质的神学争议。所有脚注标记均已置于正文相应位置。
