base_translation:
  language: en
  yaml_path: translation/ot/joshua/005/009.yaml
  text: And Yahweh said to Joshua[b][a], “Today I have rolled away the reproach of Egypt from upon you.” So the name of that place was called Gilgal to this day.
translation:
  language: zh_hans
  text: 耶和华对约书亚说：“今天，我把埃及的耻辱[a]从你们身上滚去了。”因此，那地方名叫吉甲[b]，直到今日。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “埃及的耻辱”也可理解为“在埃及所受的羞辱”或“埃及人的讥诮”；这句话也可能涉及如今已除去的、与盟约身份有关的羞耻。原文没有明确限定其所指。
    reason: lexical_alternative
  - marker: b
    text: “吉甲”在希伯来语中的读音与“滚去”一词相近，二者构成文字游戏。
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经中广为人知的专名形式，明确对应希伯来文四字神名，并保持庄重自然。
- source_word: גַּלּוֹתִי
  choice: 我……滚去了
  rationale: גּלל在此含“滚动、滚去”之意；译作“滚去”既保留具体意象，也为下文“吉甲”的谐音文字游戏提供依据。
- source_word: חֶרְפַּת מִצְרַיִם
  choice: 埃及的耻辱
  rationale: חֶרְפָּה可指耻辱、羞耻或责骂；“埃及的耻辱”保留原文属格关系的多义性，不限定为在埃及所受的羞辱、埃及人的讥诮或与埃及有关的失约之耻。
- source_word: מֵעֲלֵיכֶם
  choice: 从你们身上
  rationale: 保留介词所呈现的意象：耻辱仿佛压在以色列人身上，如今被滚去；同时符合现代汉语表达。
- source_word: וַיִּקְרָא שֵׁם הַמָּקוֹם הַהוּא גִּלְגָּל
  choice: 因此，那地方名叫吉甲
  rationale: 希伯来文动词为主动单数，但主语未明说；中文采用自然的命名结果句，避免武断补出命名者。“因此”表达命名与上句文字游戏之间的因果联系。
- source_word: גִּלְגָּל
  choice: 吉甲
  rationale: 采用通行中文地名译法；脚注说明它与“滚去”在希伯来语中的谐音关联。
- source_word: עַד הַיּוֹם הַזֶּה
  choice: 直到今日
  rationale: 准确传达叙述者视角下延续至当时的惯用时间表达，语体庄重而自然。
theological_decisions:
- issue: “埃及的耻辱”的具体所指
  choice: 正文保留宽泛表达“埃及的耻辱”，不具体界定。
  alternative: 可理解为以色列在埃及为奴的羞辱、埃及人对以色列的讥诮，或与未受割礼及圣约身份有关的羞耻。
  rationale: 原文没有明确说明该短语的具体所指；保留其含混性，可避免把某一种历史或神学解释写入正文。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。正文以“滚去”保留希伯来文的具体意象和与地名“吉甲”的文字游戏；“从你们身上”兼顾原文空间意象与中文自然度。所有脚注标记均置于相关正文词语之后。
