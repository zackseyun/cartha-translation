base_translation:
  language: en
  yaml_path: translation/ot/joshua/005/012.yaml
  text: And the manna ceased on the next day[a], after they had eaten from the produce of the land. There was no longer manna for the sons of Israel[b], and they ate from the yield of the land of Canaan that year.
translation:
  language: zh_hans
  text: 吗哪在第二天就停止了；那时他们已经吃了当地的出产[a]。以色列人[b]不再有吗哪；那一年，他们吃的是迦南地的土产。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“那地往年储存的粮食”。这里的希伯来词可能更具体地指上一季收成后储存下来的农产品。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“以色列的众子”，是对以色列群体的称呼。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁבֹּת
  choice: 停止了
  rationale: שׁבת在这里表示供应终止，并非守安息日；“停止了”简明自然，也保留事件发生的叙事意味。
- source_word: הַמָּן / מָן
  choice: 吗哪
  rationale: 采用现代中文圣经语境中对旷野食物的通行译名；中文无需用冠词区分两次出现。
- source_word: מִמָּחֳרָת
  choice: 在第二天
  rationale: 该时间短语承接上文，指前述逾越节筵席之后的一天；“在第二天”准确而自然。
- source_word: בְּאָכְלָם
  choice: 那时他们已经吃了
  rationale: 带ב前缀和复数词尾的不定式结构表达时间关系；结合上下文，以“已经吃了”呈现吗哪停止以前或当时已经发生的进食，同时避免生硬直译。
- source_word: מֵעֲבוּר הָאָרֶץ
  choice: 当地的出产
  rationale: עֲבוּר指那地所出的农产品；“当地的出产”在中文中自然，并与后文“迦南地的土产”有所区分。此词是否特指往年储存的粮食并不确定，故在脚注保留该可能。
- source_word: וְלֹא הָיָה עוֹד
  choice: 不再有
  rationale: 自然表达希伯来文存在句及עוֹד所表示的“从此不再”。
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: בני ישראל字面为“以色列的众子”，但作为群体称谓时，现代标准汉语以“以色列人”最自然，也不误导为只包括男性；字面形式在脚注说明。
- source_word: מִתְּבוּאַת אֶרֶץ כְּנַעַן
  choice: 迦南地的土产
  rationale: תְּבוּאָה表示土地的产物或收成；“土产”保留农业语义，“迦南地”则完整反映原文地名结构。
- source_word: בַּשָּׁנָה הַהִיא
  choice: 那一年
  rationale: 简洁、地道地表达原文的时间短语。
