base_translation:
  language: en
  yaml_path: translation/ot/joshua/005/002.yaml
  text: At that time Yahweh said to Joshua[a], “Make for yourself flint knives, and circumcise the sons of Israel again[c][b], a second time.”
translation:
  language: zh_hans
  text: 那时，雅威对约书亚说：“你要制作燧石刀[a]，再一次给以色列人[b]行割礼[c]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“用燧石做的刀”。原文指以燧石制成、在这里用于行割礼的切割工具。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“以色列的众子”；有些译本也译作“以色列的儿子”。本节所述割礼的实际受礼者为男性。
    reason: lexical_alternative
  - marker: c
    text: 原文以两个表达强调“再次、第二次”。这是指再次为以色列这个群体施行割礼，并不是说要给同一些人行第二次割礼。
    reason: cultural_note
lexical_decisions:
- source_word: בָּעֵת הַהִיא
  choice: 那时
  rationale: 这是引入叙事时点的常用表达；“那时”简洁、自然，也符合现代汉语叙事语体。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以音译保留四字神名所指的专名性质，不以“主”这一称号替代。
- source_word: עֲשֵׂה לְךָ
  choice: 你要为自己制作
  rationale: 保留命令语气和לְךָ所表达的受益者或关涉自身的意味；“制作”也表明这些刀需要预备出来。
- source_word: חַרְבוֹת צֻרִים
  choice: 燧石刀
  rationale: חַרְבוֹת在此指用于切割的刀具，而צֻרִים说明材质；“燧石刀”准确且符合现代汉语习惯。
- source_word: וְשׁוּב
  choice: 再
  rationale: שׁוּב接续命令式时可作副词，表示重复行动；“再”自然传达这一功能。
- source_word: מֹל
  choice: 行割礼
  rationale: 这是该礼仪行为在现代汉语中的标准、庄重表达。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列的众子
  rationale: 保留原文“以色列之子”的阳性表述；在本节中，受割礼者确为男性，因此不宜泛化为不分性别的“以色列人”。
- source_word: שֵׁנִית
  choice: 第二次这样做
  rationale: 明确保留“第二次”的独立强调，同时用“这样做”使汉语句子通顺，并与前面的“再”共同反映原文两个重复性表达。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。音译“雅威”保留其作为以色列之神专名的性质，也不把专名改成称号。
- issue: בְּנֵי יִשְׂרָאֵל的性别与范围
  choice: 以色列的众子
  alternative: 以色列人；以色列的儿女
  rationale: 语法形式为阳性，而且本段所说的割礼直接施行于男性；译作“众子”兼顾了原文形式和上下文所指。
- issue: “再……第二次”的所指
  choice: 保留两个重复性表达，并以脚注说明其群体意义
  alternative: 仅译作“再给以色列人行割礼”
  rationale: וְשׁוּב与שֵׁנִית都在原文中出现，若合并为一个“再”会损失原文的强调；但“第二次”是就以色列群体再次施行割礼而言，不表示同一批人接受第二次割礼。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“你要”清楚表达神的命令；“燧石刀”和“行割礼”兼顾准确性与普通读者的可理解性。正文保留原文“再”与“第二次”的双重表达，脚注则避免读者误以为同一人被重复施行割礼。
