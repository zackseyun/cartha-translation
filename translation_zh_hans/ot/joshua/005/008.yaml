base_translation:
  language: en
  yaml_path: translation/ot/joshua/005/008.yaml
  text: And when all the nation had finished being circumcised[a], they remained in their places in the camp until they recovered.
translation:
  language: zh_hans
  text: 全体百姓都受完割礼后，就留在营中各自的地方，直到康复。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“直到痊愈”，或“直到恢复元气”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: ……后
  rationale: 这一希伯来叙事句式在此引出时间从句；用“……后”自然表达事件的先后关系，不机械译出“事情发生了”。
- source_word: תַּמּוּ
  choice: 受完
  rationale: 该动词表示动作完成；与后面的割礼被动式合译为“受完割礼”，符合现代汉语习惯。
- source_word: כָל הַגּוֹי
  choice: 全体百姓
  rationale: גּוֹי在此集合性地指以色列共同体；“全体百姓”自然、庄重，也保留整体含义。
- source_word: לְהִמּוֹל
  choice: 受割礼
  rationale: 该尼法勒不定式表达接受割礼；“受割礼”准确保留其被动含义。
- source_word: וַיֵּשְׁבוּ
  choice: 留在
  rationale: 此处不是强调坐姿，而是指他们在疗养期间继续待着；“留在”切合上下文。
- source_word: תַחְתָּם
  choice: 原处
  rationale: 该词在此为惯用表达，指留在各自所在之处，而非字面的“在他们下面”。
- source_word: בַּמַּחֲנֶה
  choice: 营中
  rationale: 简洁自然地表达地点，符合现代中文圣经叙事语体。
- source_word: עַד חֲיוֹתָם
  choice: 直到康复
  rationale: חיה在割礼后的语境中指恢复健康或体力；“康复”清楚自然，同时脚注保留“痊愈”和“恢复元气”等可能表达。
