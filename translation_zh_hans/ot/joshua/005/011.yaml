base_translation:
  language: en
  yaml_path: translation/ot/joshua/005/011.yaml
  text: 'And they ate some of the produce of the land on the day after the Passover: unleavened bread and roasted grain[b][a], on this very day.'
translation:
  language: zh_hans
  text: 逾越节次日，他们吃了那地的一些出产[a]——无酵饼和烤制的谷物[b]；正是在这一天。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“那地的陈粮”。希伯来语可指那地的出产或收成；有人根据上下文理解为上次收成后储存下来的粮食。
    reason: lexical_alternative
  - marker: b
    text: 或译“烤干的谷物”或“炒谷”。希伯来语指经过烤制的谷物。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאכְלוּ
  choice: 他们吃了
  rationale: 该叙事动词承接前文，表示接下来发生的事；中文无须机械加入“于是”，上下文已能体现事件推进。
- source_word: מֵעֲבוּר הָאָרֶץ
  choice: 那地的一些出产
  rationale: עֲבוּר在这里指土地的出产或收成；“一些”自然表达介词מִן的部分含义，又不把“陈粮”这一可能但并未明说的解释写入正文。
- source_word: מִמָּחֳרַת הַפֶּסַח
  choice: 逾越节次日
  rationale: 准确而简洁地表达逾越节之后一天的时间含义，符合现代汉语叙事用法。
- source_word: מַצּוֹת
  choice: 无酵饼
  rationale: 这是逾越节语境中对该词清楚、通行且自然的汉语表达。
- source_word: וְקָלוּי
  choice: 和烘烤的麦粒
  rationale: קָלוּי指经过烤制的谷物；“烘烤的麦粒”比“炒谷”更直观，也避免误解为特定烹调方式。
- source_word: בְּעֶצֶם הַיּוֹם הַזֶּה
  choice: 就在这一天
  rationale: 保留希伯来语对日期准确性和当日性的强调，也保留指示词“这”的表达。
theological_decisions: []
