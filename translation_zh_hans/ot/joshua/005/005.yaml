  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כִּֽי מֻלִ֣ים הָי֔וּ כָּל הָ/עָ֖ם הַ/יֹּֽצְאִ֑ים וְ/כָל הָ֠/עָם הַ/יִּלֹּדִ֨ים בַּ/מִּדְבָּ֥ר בַּ/דֶּ֛רֶךְ בְּ/צֵאתָ֥/ם מִ/מִּצְרַ֖יִם לֹא מָֽלוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/005/005.yaml
  text: For all the people who came out had been circumcised[a], but all the people born in the wilderness on the way as they came out from Egypt had not been circumcised.
translation:
  language: zh_hans
  text: 因为从埃及出来的众人都受过割礼；可是，出埃及后[a]在旷野途中出生的众人都没有受割礼。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文较贴字面可译作“在他们出埃及的路上”，指从埃及出来后的行程。
    reason: 说明时间短语的字面形式及其在上下文中的范围。
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接第4节，为前述行动说明原因；现代汉语用“因为”自然清楚。
- source_word: מֻלִים הָיוּ
  choice: 都受过割礼
  rationale: 分词与היה连用，表示先已处于受割礼的状态；“受过”体现相对于叙事时点已经发生。
- source_word: כָּל הָעָם הַיֹּצְאִים
  choice: 从埃及出来的众人
  rationale: עם是集合性称谓，译作“众人”而不擅自缩窄为“男人”；“从埃及”依据本节后半及上下文补明。
- source_word: וְכָל הָעָם הַיִּלֹּדִים
  choice: 可是……出生的众人
  rationale: וְ在此连接两个形成对比的群体，用“可是”自然表达其转折关系。
- source_word: בַּמִּדְבָּר בַּדֶּרֶךְ
  choice: 在旷野途中
  rationale: 保留“旷野”和行程中的“路上”两层意思，同时避免生硬重复。
- source_word: בְּצֵאתָם מִמִּצְרַיִם
  choice: 出埃及后
  rationale: 此短语附属于旷野行程，指离开埃及后的旅程阶段；正文以自然汉语表达，并用脚注保留原文较贴字面的表达范围。
- source_word: לֹא מָלוּ
  choice: 都没有受割礼
  rationale: 希伯来语形式为主动，可直译“没有给他们行割礼”；上下文着眼于这群人的未受割礼状态，汉语被动式更自然，且不指定原文未说明的施行者。
theological_decisions:
- issue: “出埃及”短语所指的时间范围
  choice: 正文译为“出埃及后……在旷野途中”
  alternative: 更贴字面可作“在他们出埃及的路上”
  rationale: 这里描述的是旷野旅程中出生的一代，不宜让读者误以为只指离开埃及的瞬间；脚注同时保留希伯来语结构本身较宽的表达。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言；以“众人”保留原文的集合称谓，以“旷野途中”兼顾准确和汉语流畅。
