  yaml_path: translation/ot/joshua/005/003.yaml
  text: So Joshua made for himself flint knives and circumcised the sons of Israel at Gibeath-haaraloth[a][b][c].
translation:
  language: zh_hans
  text: 于是，约书亚做了燧石刀，就在包皮山给以色列人行了割礼。[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “燧石刀”也可译作“燧石刃具”；这里译作“刀”的希伯来语通常也可指“剑”，但本节所指的是用于割礼的切割工具。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“以色列的众子”；也可译作“以色列的子孙”。
    reason: lexical_alternative
  - marker: c
    text: 也可音译作“基比亚·哈亚拉洛特”。这个希伯来文地名的意思是“包皮之山”。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַשׂ ל֥וֹ
  choice: 为自己制备了
  rationale: עָשָׂה在此表示制作或备妥器具；לּוֹ结合上下文可自然理解为反身意义。“制备”兼顾制作与预备的语义可能。
- source_word: חַרְבוֹת צֻרִים
  choice: 燧石刀
  rationale: חֶרֶב通常可指刀剑或刃具，但割礼语境要求切割工具；צוּרִים说明其材质为燧石。“燧石刀”准确且不致让读者误解为作战用剑。
- source_word: וַיָּמָל
  choice: 行了割礼
  rationale: מוּל明确指施行割礼；现代汉语中“给……行割礼”自然、庄重。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列的众子
  rationale: 保留希伯来文“以色列之子”的形式与男性复数指向；“众子”比单数化表达更清楚，也避免直接改写成较概括的“以色列人”。
- source_word: אֶל גִּבְעַת הָעֲרָלוֹת
  choice: 在“包皮山”
  rationale: אֶל在此随地点名按汉语语境译作“在”；该地名的构词意义透明，直译能让读者获得原文信息，引号标明其为地名。
theological_decisions: []
