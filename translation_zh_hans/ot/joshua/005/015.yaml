  to: 雅威军队的统帅[a]对约书亚说：“脱下你脚上的鞋[b]，因为你所站的地方是圣洁的。”约书亚就照做了。
  rationale: 修订仅改善汉语自然度，并除去“那只”所附加的指示意味；经文的单数信息由紧邻“鞋”的脚注明确保留。其余措辞忠实保留原文的称号、命令、圣洁属性与顺从叙述。
