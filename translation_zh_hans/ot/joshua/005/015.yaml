base_translation:
  language: en
  yaml_path: translation/ot/joshua/005/015.yaml
  text: Then the commander of Yahweh’s army said to Joshua[a], “Take your sandal off your foot[b], because the place where you are standing is holy.” And Joshua did so.
translation:
  language: zh_hans
  text: 雅威军队的统帅[a]对约书亚说：“脱下你脚上的鞋[b]，因为你所站的地方是圣洁的。”约书亚就照做了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “雅威军队”也可译作“雅威的军队”或“雅威的军旅”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来原文中的“鞋”和“脚”都是单数。可比较《出埃及记》3:5中较为人熟悉的复数说法。
    reason: cross_reference
lexical_decisions:
- source_word: שַׂר
  choice: 统帅
  rationale: 在与“军队”连用的军事语境中，“统帅”清楚表达居首领、指挥之位的含义，也比“王子”或限定具体军衔的译法更准确。
- source_word: צְבָא יְהוָה
  choice: 雅威军队
  rationale: צָבָא在这里自然指军队或军旅；“军队”是现代汉语中清楚、直接且保留军事色彩的表达。属格结构译为“雅威军队”，不额外界定这支军队的性质。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以“雅威”音译四字神名，保留其作为以色列之上帝专名的性质，而不以称号替代。
- source_word: שַׁל
  choice: 脱下来
  rationale: 该命令要求除去脚上的鞋；“脱下来”是现代汉语中自然直接的说法。
- source_word: נַעַלְךָ
  choice: 你脚上的那只鞋
  rationale: 原文“鞋”和“脚”均为单数；“那只鞋”在中文中明确保留单数，同时比生硬直译“你的鞋”更自然。
- source_word: מֵעַל רַגְלְךָ
  choice: 你脚上的
  rationale: 保留原文单数“脚”，并按现代汉语习惯将介词关系整合为“脚上的”。
- source_word: הַמָּקוֹם
  choice: 地方
  rationale: 直接对应带定冠词的“地方”；关系从句“你所站的”已使其成为特指，无须增添原文没有的指示词“这”。
- source_word: עֹמֵד עָלָיו
  choice: 你所站的
  rationale: 分词表达正在站立的状态；中文关系结构中无需重复译出“在其上”，意思仍然完整。
- source_word: קֹדֶשׁ הוּא
  choice: 是圣的
  rationale: “圣”保留 קֹדֶשׁ 的核心宗教含义以及庄重的圣经语体，比仅表示受尊崇的说法更贴近原文。
- source_word: וַיַּעַשׂ יְהוֹשֻׁעַ כֵּן
  choice: 约书亚就照做了
  rationale: 自然地表达叙事中的顺服结果；“就”也承接前面的命令，却不增加动机解释。
theological_decisions:
- issue: “雅威军队的统帅”（שַׂר צְבָא יְהוָה）的身份与地位
  choice: 只按原文称号译为“雅威军队的统帅”
  alternative: 明确译作天使统帅、雅威的显现，或道成肉身前的基督
  rationale: 本节只给出这位说话者的称号，并记载他关于圣地的命令，没有进一步明确其身份。描述性翻译保留文本中的神学张力，不替经文作出其未明说的判断。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“统帅”“圣的”保留经文的军事与神圣语域；句法尽量简明，适合普通现代读者。专名统一用“雅威”“约书亚”。
