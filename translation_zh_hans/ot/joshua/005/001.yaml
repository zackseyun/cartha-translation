id: JOS.5.1
reference: Joshua 5:1
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יְהִ֣י כִ/שְׁמֹ֣עַ כָּל מַלְכֵ֣י הָ/אֱמֹרִ֡י אֲשֶׁר֩ בְּ/עֵ֨בֶר הַ/יַּרְדֵּ֜ן יָ֗מָּ/ה וְ/כָל מַלְכֵ֤י הַֽ/כְּנַעֲנִי֙ אֲשֶׁ֣ר עַל הַ/יָּ֔ם אֵ֠ת אֲשֶׁר הוֹבִ֨ישׁ יְהוָ֜ה אֶת מֵ֧י הַ/יַּרְדֵּ֛ן מִ/פְּנֵ֥י בְנֵֽי יִשְׂרָאֵ֖ל עַד עבר/נו וַ/יִּמַּ֣ס לְבָבָ֗/ם וְ/לֹא הָ֨יָה בָ֥/ם עוֹד֙ ר֔וּחַ מִ/פְּנֵ֖י בְּנֵֽי יִשְׂרָאֵֽל־־־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/005/001.yaml
  text: And it happened[a], when all the kings of the Amorites who were beyond the Jordan to the west, and all the kings of the Canaanites who were by the sea, heard that Yahweh had dried up the waters of the Jordan before the sons of Israel until we had crossed over, their heart melted[c][b], and there was no longer spirit in them because of the sons of Israel.
translation:
  language: zh_hans
  text: 约旦河西边所有亚摩利人的王，以及海边[a]所有迦南人的王，听见雅威使约旦河的水在以色列子孙面前干涸，直到我们都过了河[b]，他们的心就融化了；因以色列子孙的缘故，他们里面再也没有勇气[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “海边”也可译作“沿海地区”，指地中海沿岸一带。
    reason: lexical_alternative
  - marker: b
    text: 有些抄本和古代译本作“直到他们都过了河”。
    reason: textual_variant
  - marker: c
    text: “勇气”原文为“灵、气息”；这里表示内在的勇气或意志已经消失。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִשְׁמֹעַ
  choice: 听见……
  rationale: וַיְהִי在此引出叙事中的新情形，כִשְׁמֹעַ构成时间从句。汉语直接以主语和“听见”起句，已自然表达“当……听见时”，不另加生硬的“事情发生了”。
- source_word: בְּעֵבֶר הַיַּרְדֵּן יָמָּה
  choice: 约旦河西边
  rationale: יָמָּה表示向海、向西；结合本节的地理视角，译作“约旦河西边”简明清楚。
- source_word: אֲשֶׁר עַל הַיָּם
  choice: 海边
  rationale: 紧贴原文意象，同时以脚注说明这里可指沿海地区。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常用音译呈现四字神名，而不以称号代替专名。
- source_word: הוֹבִישׁ אֶת מֵי הַיַּרְדֵּן
  choice: 使约旦河的水……干涸
  rationale: 准确表达יבש使役形“使……干”的意义。
- source_word: בְנֵי יִשְׂרָאֵל
  choice: 以色列子孙
  rationale: 保留该民族称谓中的家族性表达，在现代汉语中也庄重自然。
- source_word: עַד עברנו
  choice: 直到我们都过了河
  rationale: 正文依马所拉文本的第一人称复数形式翻译，不因上下文的第三人称叙述而擅自改写；第三人称异读见脚注。
- source_word: וַיִּמַּס לְבָבָם
  choice: 他们的心就融化了
  rationale: 保留希伯来文“心融化”的恐惧隐喻；汉语用“他们的心”也能自然反映原文的集合性单数。
- source_word: וְלֹא הָיָה בָם עוֹד רוּחַ
  choice: 他们里面再也没有勇气
  rationale: רוּחַ本可表示气息、灵或内在力量，此处按语境表达失去勇气和意志，同时在脚注保留原文意象。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文使用神的专名；音译“雅威”可保留专名性质，避免以称号“主”取代。
- issue: בְנֵי יִשְׂרָאֵל的民族—家族称谓
  choice: 以色列子孙
  alternative: 以色列人
  rationale: “以色列子孙”保留原文的家族性和盟约民族表达，又为现代读者所熟悉。
- issue: עברנו的人称
  choice: 我们都过了河
  alternative: 他们都过了河
  rationale: 马所拉文本所呈现的第一人称复数可能使叙述者与以色列群体认同；不在正文中消解这一张力，而把第三人称异读列入脚注。
- issue: רוּחַ在恐惧语境中的含义
  choice: 勇气
  alternative: 灵；气息；心志
  rationale: 上下文明确涉及诸王因恐惧而丧失内在力量，因此正文用“勇气”；脚注说明原文字面及其语义范围，避免把רוּחַ的丰富含义完全隐藏。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。“心就融化了”保留原文鲜明隐喻；“里面再也没有勇气”则自然传达希伯来习语，并借脚注保存רוּחַ的字面语义。所有脚注标记均置于其所说明的正文词句之后。
