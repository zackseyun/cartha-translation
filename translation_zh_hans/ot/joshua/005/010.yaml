source:
  edition: WLC
  text: וַ/יַּחֲנ֥וּ בְנֵֽי יִשְׂרָאֵ֖ל בַּ/גִּלְגָּ֑ל וַ/יַּעֲשׂ֣וּ אֶת הַ/פֶּ֡סַח בְּ/אַרְבָּעָה֩ עָשָׂ֨ר י֥וֹם לַ/חֹ֛דֶשׁ בָּ/עֶ֖רֶב בְּ/עַֽרְב֥וֹת יְרִיחֽוֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/005/010.yaml
  text: And the sons of Israel camped at Gilgal[a], and they kept the Passover on the fourteenth day of the month, in the evening, on the plains of Jericho.
translation:
  language: zh_hans
  text: 以色列人[a]在吉甲安营；该月十四日傍晚，他们在耶利哥平原守逾越节。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“以色列的儿子们”，也可译作“以色列子孙”。
    reason: 说明希伯来语亲属称谓的字面形式及可选译法。
lexical_decisions:
- source_word: וַיַּחֲנוּ
  choice: 安营
  rationale: חנה指扎营、驻营；“安营”既准确又符合现代汉语叙事表达。
- source_word: בְנֵי יִשְׂרָאֵל
  choice: 以色列人[a]
  rationale: 该词组直译为“以色列的众子”，在这里指以色列群体。“以色列人”是自然清楚的现代汉语表达，并以脚注保留原文的亲属称谓形式。
- source_word: בַּגִּלְגָּל
  choice: 在吉甲
  rationale: 介词与地名连用，表示安营的地点；汉语自然译为“在吉甲”。
- source_word: וַיַּעֲשׂוּ אֶת־הַפֶּסַח
  choice: 守逾越节
  rationale: עשה与“逾越节”连用是举行、遵守该节期礼仪的惯用表达；“守逾越节”简洁且符合汉语宗教语境。
- source_word: בְּאַרְבָּעָה עָשָׂר יוֹם לַחֹדֶשׁ
  choice: 那月十四日
  rationale: 准确表达原文的日期。原文没有明说“正月”，因此不把上下文或律法规定中的月份名称补入正文。
- source_word: בָּעֶרֶב
  choice: 晚上
  rationale: 表示举行逾越节的时间；“晚上”是现代汉语中自然明确的表达。
- source_word: בְּעַרְבוֹת יְרִיחוֹ
  choice: 在耶利哥平原
  rationale: עַרְבוֹת指平原或草原地带；“耶利哥平原”是自然且准确的地理表达。
theological_decisions:
- issue: בְנֵי יִשְׂרָאֵל的群体与性别形式
  choice: 正文译作“以色列人”，脚注注明原文直译
  alternative: 以色列的众子／以色列子孙
  rationale: 希伯来语采用阳性复数亲属称谓，直译是“以色列的众子”；但在此指整个以色列群体。正文用现代汉语惯称“以色列人”，避免让读者误以为只特指成年男性，同时用脚注透明呈现原文形式，不据此引入额外的神学判断。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“安营”“守逾越节”保留经文语体但不过分古雅；句法按汉语习惯分为两句。
