base_translation:
  language: en
  yaml_path: translation/ot/joshua/005/007.yaml
  text: And Joshua circumcised their sons[a], whom he had raised up in their place, because they were uncircumcised, for they had not circumcised them on the way.
translation:
  language: zh_hans
  text: 约书亚给那些代替他们兴起的儿子[a]行了割礼，因为他们未受割礼；因为在路上，人们没有给他们行割礼。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在他们的位置上兴起的儿子”。希伯来语短语表明，这些儿子接替了上一代人的位置。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶת בְּנֵיהֶם
  choice: 那些……儿子
  rationale: בְּנֵיהֶם 在割礼语境中特指上一代人的男性后代；汉语用“儿子”比“儿女”准确。宾格标记不单独译出，连接词则按汉语叙事自然省略。
- source_word: הֵקִים תַּחְתָּם
  choice: 接替他们而兴起
  rationale: הֵקִים 表示使之兴起，תַּחְתָּם 在此表示替代、承接上一代的位置。合译既保留“兴起”的意象，也清楚表达世代接替。
- source_word: אֹתָם מָל יְהוֹשֻׁעַ
  choice: 约书亚给……行了割礼
  rationale: מוּל 是施行割礼的标准动词；现代汉语通常表达为“给某人行割礼”。
- source_word: עֲרֵלִים הָיוּ
  choice: 这些人还没有受割礼
  rationale: עֲרֵלִים 指身体上未受割礼的状态。“还没有受割礼”自然、明确，并符合本节的实际礼仪语境。
- source_word: כִּי לֹא מָלוּ אֹתָם
  choice: 因为……人们没有给他们行割礼
  rationale: 希伯来语动词为第三人称复数，却没有明说主语。用泛指“人们”避免误把前面的儿子理解为施行割礼者，同时不具体指定某一群人。
- source_word: בַּדָּרֶךְ
  choice: 在路上
  rationale: 该短语指旅途中，尤其是旷野行程期间；“在路上”简洁并贴近原文。
theological_decisions:
- issue: עֲרֵלִים 的盟约与身体含义
  choice: 还没有受割礼
  alternative: 未受割礼的人／有包皮的
  rationale: 本节所述是实际的身体割礼，而非属灵隐喻；所选译法保留盟约背景，同时符合现代汉语习惯。
- issue: 第二个复数动词 מָלוּ 的未明主语
  choice: 人们没有给他们行割礼
  alternative: 他们没有给他们行割礼／没有人给他们行割礼
  rationale: 原文只用未指明主语的第三人称复数。“人们”保留泛指性；“没有人”会把原文改成更绝对的否定，而连续两个“他们”在汉语中容易造成指代混乱。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“接替他们而兴起”保留原文“兴起”与“代替”的双重信息；分号呈现第二个 כִּי 对未受割礼状态的进一步解释。
