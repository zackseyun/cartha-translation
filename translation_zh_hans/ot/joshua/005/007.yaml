  to: 约书亚给那些代替他们兴起的儿子[a]行了割礼，因为他们未受割礼；因为在路上，人们没有给他们行割礼。
  rationale: 修订以“未受割礼”直译其状态，并调整“兴起／代替”的语序以改善汉语自然度。末句保留未指明的复数施事者为泛指“人们”，不把原文的主语具体化。脚注保留“上一代”作为上下文所指的说明，并更完整反映“兴起”和替代关系。
