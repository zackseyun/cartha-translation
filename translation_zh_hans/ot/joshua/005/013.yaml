base_translation:
  language: en
  yaml_path: translation/ot/joshua/005/013.yaml
  text: And it happened[a], when Joshua was by Jericho, that he lifted up his eyes and looked, and behold, a man was standing opposite him with his sword drawn in his hand. Joshua went to him and said to him, “Are you for us, or for our enemies?”
translation:
  language: zh_hans
  text: 约书亚在耶利哥一带[a]的时候，抬眼观看，看哪，有一个人站在他对面，手中握着一把出鞘的剑。约书亚走到他那里，对他说：“你是站在我们这边，还是站在我们敌人那边？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“在耶利哥”或“耶利哥附近”。希伯来语介词在这里可以宽泛地表示地点，不一定确指城内。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בִּהְיוֹת
  choice: ……的时候
  rationale: 希伯来语以叙事形式引出新场景，并用带介词的动词不定式说明时间背景。现代汉语用“……的时候”即可自然表达；不另译“事情发生了”，以免行文生硬。
- source_word: בִּירִיחוֹ
  choice: 在耶利哥一带
  rationale: 介词 בְּ 可宽泛表示所在地点；此处不必断定约书亚已在城内。“一带”既保留地点关系，也避免过度具体化。
- source_word: וַיִּשָּׂא עֵינָיו וַיַּרְא
  choice: 抬眼观看
  rationale: 保留“举目/抬眼”这一生动的希伯来语表达，并以“观看”承接下一动词，避免现代汉语中不自然的重复。
- source_word: וְהִנֵּה
  choice: 看哪
  rationale: 该词用于引人注意并生动呈现眼前景象；“看哪”庄重而易懂，保留了原文的突显作用。
- source_word: אִישׁ
  choice: 一个人
  rationale: 原文此处仅称该人物为“人”，尚未明说其身份；译文不提前解释为天使、耶和华或战士。
- source_word: עֹמֵד לְנֶגְדּוֹ
  choice: 站在他对面
  rationale: 准确表达 לְנֶגֶד 所指的面对面或相对位置，也保留场景中的对峙感。
- source_word: וְחַרְבּוֹ שְׁלוּפָה בְּיָדוֹ
  choice: 手里拿着出鞘的刀
  rationale: “出鞘”准确表达 שְׁלוּפָה；调整为自然汉语语序，同时保留武器已握在手中的警戒或威胁姿态。
- source_word: וַיֵּלֶךְ ... אֵלָיו
  choice: 走到他那里
  rationale: 原动词只说明约书亚朝那人而去；此译法不额外添加“靠近”或“上前质问”等解释。
- source_word: הֲלָנוּ אַתָּה אִם לְצָרֵינוּ
  choice: 你是帮助我们的，还是帮助我们敌人的？
  rationale: 这里的 לְ 表明归属、立场或支持对象。汉语补出“帮助”能清楚自然地表达军事语境中的阵营之问，同时不把对方直接说成某一方的成员。
theological_decisions:
- issue: 约书亚所遇“一个人”的身份
  choice: 正文仅译作“一个人”
  alternative: 天使、耶和华的使者、神显，或基督降生前的显现
  rationale: 本节自身只用 אִישׁ 称呼该人物。后文可影响读者对其身份的理解，但本节译文不应预先消除原文保留的悬念和神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“看哪”保留原文的提示和突显功能；其余句式按现代汉语调整，避免仿古腔。
