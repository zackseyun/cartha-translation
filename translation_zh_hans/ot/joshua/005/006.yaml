id: JOS.5.6
reference: Joshua 5:6
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כִּ֣י אַרְבָּעִ֣ים שָׁנָ֗ה הָלְכ֣וּ בְנֵֽי יִשְׂרָאֵל֮ בַּ/מִּדְבָּר֒ עַד תֹּ֨ם כָּל הַ/גּ֜וֹי אַנְשֵׁ֤י הַ/מִּלְחָמָה֙ הַ/יֹּצְאִ֣ים מִ/מִּצְרַ֔יִם אֲשֶׁ֥ר לֹֽא שָׁמְע֖וּ בְּ/ק֣וֹל יְהוָ֑ה אֲשֶׁ֨ר נִשְׁבַּ֤ע יְהוָה֙ לָ/הֶ֔ם לְ/בִלְתִּ֞י הַרְאוֹתָ֣/ם אֶת הָ/אָ֗רֶץ אֲשֶׁר֩ נִשְׁבַּ֨ע יְהוָ֤ה לַֽ/אֲבוֹתָ/ם֙ לָ֣/תֶת לָ֔/נוּ אֶ֛רֶץ זָבַ֥ת חָלָ֖ב וּ/דְבָֽשׁ׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/005/006.yaml
  text: For the sons of Israel had walked in the wilderness forty years[a], until all the nation—the men of war who came out of Egypt—had come to an end, because they had not listened to the voice of Yahweh. Yahweh had sworn to them that he would not let them see the land that Yahweh had sworn to their fathers to give to us, a land flowing with milk and honey.
translation:
  language: zh_hans
  text: 因为以色列人在旷野行走了四十年，直到全体民众，就是从埃及出来的作战男子，都消亡了；因为他们没有听从耶和华的声音。耶和华曾向他们起誓，不让他们看见那地；耶和华曾向他们的祖先起誓，要把那流奶与蜜之地赐给我们[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文本作“赐给我们”；有些古代译本和其他译文作“赐给他们”。
    reason: textual_variant
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，为前一节所述情形提供解释；现代汉语用“因为”能自然表达这一说明关系。
- source_word: הָלְכוּ בְנֵי יִשְׂרָאֵל בַּמִּדְבָּר
  choice: 以色列人在旷野行走
  rationale: 保留“行走”的具体意象，并以“以色列人”自然表达群体称谓；“旷野”比“沙漠”更符合该地理环境及圣经叙事语境。
- source_word: עַד תֹּם
  choice: 直到……都消亡了
  rationale: 表达该群体到了尽头、不复存在的含义，同时不把希伯来文未明说的具体死亡方式加入正文。
- source_word: כָּל הַגּוֹי אַנְשֵׁי הַמִּלְחָמָה
  choice: 全体国民——那些……战士——
  rationale: 保留“国民/民族”这一集合性表达，并通过同位说明明确这里所指的是出埃及的作战男子。
- source_word: לֹא שָׁמְעוּ בְּקוֹל יְהוָה
  choice: 没有听从耶和华的声音
  rationale: 兼顾“听见声音”的原文意象和顺服之意，避免仅译作“没有服从”而抹去该表达方式。
- source_word: נִשְׁבַּע ... לְבִלְתִּי הַרְאוֹתָם
  choice: 曾向他们起誓，必不让他们看见
  rationale: 自然表达誓言的内容，并保留使役形式所含“不使/不让他们看见”的语义。
- source_word: אֶרֶץ זָבַת חָלָב וּדְבָשׁ
  choice: 流奶与蜜之地
  rationale: 采用清楚而庄重的传统表达，保留原文描写土地丰饶的具体意象。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 正文明确保留专有神名，不以“主”代替；“耶和华”是现代汉语读者最熟悉且可辨识的形式，而“雅威”更接近学界常见的拟音。
- issue: לָנוּ 的第一人称复数
  choice: 赐给我们
  alternative: 赐给他们
  rationale: 马所拉文本明确读作第一人称复数“我们”，虽在叙事人称上显得突兀，仍应保留这一真实的文本张力；部分古代译本反映第三人称，故收入脚注。
- issue: “听从耶和华的声音”中听与顺服的关系
  choice: 保留“声音”并用“听从”表达
  alternative: 没有顺服耶和华
  rationale: 原文习语同时包含聆听和服从的含义；所选译法不把它简化为纯粹抽象的“顺服”。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“全体国民”后用破折号引出同位说明，以避免误解为包括当时所有以色列人；保留“流奶与蜜”和“听从……的声音”等原文意象。脚注标记置于其实际涉及的“我们”之后。
