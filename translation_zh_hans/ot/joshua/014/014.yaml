  text: עַל כֵּ֣ן הָיְתָֽה חֶ֠בְרוֹן לְ/כָלֵ֨ב בֶּן יְפֻנֶּ֤ה הַ/קְּנִזִּי֙ לְֽ/נַחֲלָ֔ה עַ֖ד הַ/יּ֣וֹם הַ/זֶּ֑ה יַ֚עַן אֲשֶׁ֣ר מִלֵּ֔א אַחֲרֵ֕י יְהוָ֖ה אֱלֹהֵ֥י יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/014/014.yaml
  text: Therefore Hebron became the inheritance of Caleb son of Jephunneh the Kenizzite to this day[a], because he fully followed Yahweh, the God of Israel.
translation:
  language: zh_hans
  text: 因此，希伯仑就归耶孚尼的儿子、基尼洗人迦勒作产业，直到今日；因为他全心全意地跟从了雅威——以色列的上帝。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“完全跟从了雅威。”希伯来语惯用语直译近于“在……之后填满”，表示完全忠诚、专一跟从。
    reason: 说明原文惯用语及可行的较形式对应译法。
lexical_decisions:
- source_word: עַל כֵּן
  choice: 因此
  rationale: 承接上文授地给迦勒一事，清楚表达因果结果。
- source_word: הָיְתָה ... לְנַחֲלָה
  choice: 得了……作为产业
  rationale: 原文表达希伯仑成为归迦勒所有的承受之地；此译自然呈现状态转变和产业归属。
- source_word: חֶבְרוֹן
  choice: 希伯仑
  rationale: 采用该地名通行的现代中文译名。
- source_word: כָלֵב בֶּן יְפֻנֶּה הַקְּנִזִּי
  choice: 基尼洗人耶孚尼的儿子迦勒
  rationale: 依照希伯来语关系准确交代族属、父名和人名，并采用通行中文音译。
- source_word: עַד הַיּוֹם הַזֶּה
  choice: 直到今日
  rationale: 保留叙述者所处时代仍然持续的含义。
- source_word: יַעַן אֲשֶׁר
  choice: 因为
  rationale: 直接而自然地引出迦勒得地为业的原因。
- source_word: מִלֵּא אַחֲרֵי
  choice: 全心全意地跟从
  rationale: 这是表示完全忠诚、彻底跟从的希伯来语惯用表达；意译可避免逐字翻译造成误解，同时保留强烈程度。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代中文常见形式音译四字神名，保留其专名性质，不以称号替代。
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: 以色列的上帝
  rationale: 直接保留原文的所属关系及盟约群体身份。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；译作“雅威”旨在保留专名，并较贴近学界通常采用的复原读音。
- issue: מִלֵּא אַחֲרֵי 所表达的忠诚程度
  choice: 全心全意地跟从
  alternative: 完全跟从
  rationale: 该惯用语强调彻底、忠贞地跟从；“全心全意”传达完整忠诚，但不把它扩展解释为某种特定教派的顺服观。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“得了……作为产业”符合土地分配语境；以破折号连接“雅威”和同位说明“以色列的上帝”，使句意清楚。脚注标记置于其所解释的跟从雅威这一分句之后。
