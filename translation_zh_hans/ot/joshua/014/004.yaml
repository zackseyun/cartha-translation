id: JOS.14.4
reference: Joshua 14:4
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כִּֽי הָי֧וּ בְנֵֽי יוֹסֵ֛ף שְׁנֵ֥י מַטּ֖וֹת מְנַשֶּׁ֣ה וְ/אֶפְרָ֑יִם וְ/לֹֽא נָתְנוּ֩ חֵ֨לֶק לַ/לְוִיִּ֜ם בָּ/אָ֗רֶץ כִּ֤י אִם עָרִים֙ לָ/שֶׁ֔בֶת וּ/מִ֨גְרְשֵׁי/הֶ֔ם לְ/מִקְנֵי/הֶ֖ם וּ/לְ/קִנְיָנָֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/014/004.yaml
  text: For the sons of Joseph were two tribes[a], Manasseh and Ephraim; and they gave no portion to the Levites in the land, except cities to dwell in[c][b], with their pasturelands for their livestock and for their possessions.
translation:
  language: zh_hans
  text: 因为约瑟的子孙有两个支派[a]，就是玛拿西和以法莲；他们没有在这地把产业分给利未人，只给了他们可居住的城，以及城周围的草场[b]，供他们的牲畜和财产之用。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“约瑟的子孙是两个支派。”这里指玛拿西和以法莲两个支派。
    reason: 说明希伯来文表述及“子孙”的部族含义。
  - marker: b
    text: “草场”指利未人城邑周围的空地，尤其可供牲畜放牧，也可作其他附属用途。
    reason: 解释古代利未城邑周围附属土地的性质与用途。
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 本词承接上文，说明支派数目及土地分配安排的缘由；中文用“因为”自然保留其解释关系。
- source_word: בְנֵי יוֹסֵף
  choice: 约瑟的子孙
  rationale: 此处不是仅指约瑟的亲生儿子，而是指由玛拿西和以法莲延续的部族后裔；“子孙”在现代中文中清楚而庄重。
- source_word: שְׁנֵי מַטּוֹת
  choice: 两个支派
  rationale: מַטּוֹת 在此指以色列的部族单位，不是字面的“杖”。
- source_word: מְנַשֶּׁה וְאֶפְרָיִם
  choice: 玛拿西和以法莲
  rationale: 采用现代中文圣经语境中通行且易识别的人名译法。
- source_word: וְלֹא נָתְנוּ חֵלֶק
  choice: 他们没有……给……分产业
  rationale: 保留希伯来文主动形式；“分产业”准确表达分配土地份额的语境，同时维持主语所指在句法上的开放性。
- source_word: לַלְוִיִּם
  choice: 利未人
  rationale: 复数形式指利未群体，而非祖先利未个人。
- source_word: בָּאָרֶץ
  choice: 在这地
  rationale: 指当时正在分配的迦南地；“这地”在上下文中比泛指的“土地上”更清楚。
- source_word: כִּי אִם
  choice: 只
  rationale: 此组合在否定句后引出唯一例外，中文以“只给了”最自然。
- source_word: עָרִים לָשֶׁבֶת
  choice: 可居住的城
  rationale: 自然表达这些城是给利未人居住之用，同时保留目的含义。
- source_word: מִגְרְשֵׁיהֶם
  choice: 城周围的草场
  rationale: 该词指城邑四周未建造的附属空地，可用于放牧等用途；正文加入“城周围”避免现代读者将其误解为远离城邑的一般牧场。
- source_word: לְמִקְנֵיהֶם
  choice: 供他们的牲畜……使用
  rationale: מִקְנֶה 泛指作为产业持有的牲畜，“牲畜”比“牛群”涵盖面更广。
- source_word: וּלְקִנְיָנָם
  choice: 和财物使用
  rationale: קִנְיָן 可指所拥有、购得的财产；“财物”保留其宽泛含义，不将其限缩为某一种所有物。
theological_decisions:
- issue: 约瑟后裔与两个支派的关系
  choice: “约瑟的子孙成了两个支派”
  alternative: “约瑟的两个儿子各成了一个支派”
  rationale: 原文只说约瑟的子孙为两个支派，并列出玛拿西和以法莲；不额外加入“各成了一个”等解释性内容。
- issue: 给利未人分地的施事者
  choice: 保留“他们”
  alternative: 改为被动式“利未人没有获分产业”
  rationale: 原文使用第三人称复数主动动词，但近处复数先行项可能令指代产生张力；译文保留主动形式及其有限歧义，不擅自指定为某一群体。
translation_notes:
  register: 采用现代、庄重而易懂的普通话书面语。以分号呈现原文两部分的解释与分配关系；避免古奥的“邑”“郊野”，也不把 חֵלֶק 过度神学化为只能理解为继承权的“基业”。所有脚注标记均已置于正文对应位置。
