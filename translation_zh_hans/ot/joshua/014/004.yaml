  to: 因为约瑟的子孙有两个支派[a]，就是玛拿西和以法莲；他们没有在这地把产业分给利未人，只给了他们可居住的城，以及城周围的草场[b]，供他们的牲畜和财产之用。
  rationale: 将“成了”改为“有”，以贴近原文的静态陈述，避免增添形成过程；将末句改为“供他们的牲畜和财产之用”，使中文搭配自然，同时保留原文对牲畜与所拥有财产的宽泛指涉。其余措辞及脚注锚点均可保留。
