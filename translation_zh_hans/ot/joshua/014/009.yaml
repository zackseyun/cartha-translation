  to: 摩西在那日发誓说：“你脚所踏之地，必定[a]成为你和你儿子们[b]的产业，直到永远，因为你专心跟从了雅威——我的上帝。”
  rationale: 修订只处理现代汉语的自然度及脚注锚点的指向：以“成为……的产业”清晰表达“归……作产业”，以“儿子们”保留原文复数，并以破折号呈现“雅威——我的上帝”的同位关系。未改变誓言、土地承受、持久时间或完全跟从的含义。
