  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יִּשָּׁבַ֣ע מֹשֶׁ֗ה בַּ/יּ֣וֹם הַ/הוּא֮ לֵ/אמֹר֒ אִם לֹ֗א הָ/אָ֨רֶץ֙ אֲשֶׁ֨ר דָּרְכָ֤ה רַגְלְ/ךָ֙ בָּ֔/הּ לְ/ךָ֨ תִֽהְיֶ֧ה לְ/נַחֲלָ֛ה וּ/לְ/בָנֶ֖י/ךָ עַד עוֹלָ֑ם כִּ֣י מִלֵּ֔אתָ אַחֲרֵ֖י יְהוָ֥ה אֱלֹהָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/014/009.yaml
  text: And Moses swore on that day[a], saying, ‘Surely the land on which your foot has trodden shall be an inheritance for you and for your sons forever[b], because you have fully followed Yahweh my God.’
translation:
  language: zh_hans
  text: 摩西在那日发誓说：“你脚所踏之地，必定[a]成为你和你儿子们[b]的产业，直到永远，因为你专心跟从了雅威——我的上帝。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来原文直译为“若不”，在这里是誓言中的强调格式，意思是“必定”。
    reason: lexical_alternative
  - marker: b
    text: 或译“你的后代”。希伯来原文直译为“你的儿子们”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׁבַע
  choice: 发誓
  rationale: 准确表达尼法勒词形在此处“起誓、发誓”的意思，简洁而庄重。
- source_word: בַּיּוֹם הַהוּא
  choice: 在那日
  rationale: 保留原文的时间指示和介词关系，也符合庄重而自然的现代汉语。
- source_word: לֵאמֹר
  choice: 说
  rationale: 作为直接引语的常规引介语，无须扩译为“宣告”。
- source_word: אִם לֹא
  choice: 必定
  rationale: 此处不是普通条件句，而是誓言中的强调格式；“必定”自然传达其郑重保证的语气。
- source_word: הָאָרֶץ אֲשֶׁר דָּרְכָה רַגְלְךָ בָּהּ
  choice: 你脚所踏之地
  rationale: 保留“脚”与“踏”的具体意象及单数形式，同时采用自然、凝练的汉语表达。
- source_word: תִהְיֶה לְךָ לְנַחֲלָה
  choice: 归你……作产业
  rationale: 既表达将来归属，也保留 נַחֲלָה 所含的承受之地、世袭产业意味。
- source_word: וּלְבָנֶיךָ
  choice: 和你的众子
  rationale: 原文明确使用“儿子”的阳性复数；“众子”保留这一形式，并与庄重语体相称。
- source_word: עַד עוֹלָם
  choice: 直到永远
  rationale: 保留 עַד 的延续界限表达和 עוֹלָם 的长久、永久意味。
- source_word: כִּי מִלֵּאתָ אַחֲרֵי
  choice: 因为你专心跟从了
  rationale: 这是表示全心、完全跟从的希伯来语习语；“专心跟从”在现代汉语中自然，并保留忠诚委身的力度。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以中文音译呈现四字神名，而不以称号代替。
- source_word: אֱלֹהָי
  choice: 我的上帝
  rationale: 保留第一人称单数所属后缀，明确这是摩西所说“我的上帝”。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华／主
  rationale: 原文直接使用四字神名；“雅威”是 Yahweh 的现代汉语音译，保留专名性质，不以称号“主”替代。
- issue: וּלְבָנֶיךָ 所指后代的性别形式
  choice: 和你的众子
  alternative: 和你的子孙／后代
  rationale: 原文形式明确为“你的儿子们”。正文保留这一措辞，同时用脚注说明在承受产业的语境中可理解为后裔。
- issue: מִלֵּאתָ אַחֲרֵי 的忠诚程度
  choice: 专心跟从了
  alternative: 完全跟从了
  rationale: 该习语表达毫无保留、忠心地跟从；“专心跟从”保留其强度，又避免把它解释为抽象的道德完美。
translation_notes:
  register: 采用现代、庄重而清楚的书面汉语。“你脚所踏之地”保留原文的具体意象；“归你……作产业”体现土地分配与世代承受的语境。引号内保持摩西誓言的郑重语气。
