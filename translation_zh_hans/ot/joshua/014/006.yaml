language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יִּגְּשׁ֨וּ בְנֵֽי יְהוּדָ֤ה אֶל יְהוֹשֻׁ֨עַ֙ בַּ/גִּלְגָּ֔ל וַ/יֹּ֣אמֶר אֵלָ֔י/ו כָּלֵ֥ב בֶּן יְפֻנֶּ֖ה הַ/קְּנִזִּ֑י אַתָּ֣ה יָדַ֡עְתָּ אֶֽת הַ/דָּבָר֩ אֲשֶׁר דִּבֶּ֨ר יְהוָ֜ה אֶל מֹשֶׁ֣ה אִישׁ הָ/אֱלֹהִ֗ים עַ֧ל אֹדוֹתַ֛/י וְ/עַ֥ל אֹדוֹתֶ֖י/ךָ בְּ/קָדֵ֥שׁ בַּרְנֵֽעַ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/014/006.yaml
  text: Then the sons of Judah came near to Joshua at Gilgal[a], and Caleb son of Jephunneh the Kenizzite said to him, “You know the word that Yahweh spoke to Moses the man of God concerning me and concerning you at Kadesh-barnea.”
translation:
  language: zh_hans
  text: 在吉甲，犹大子孙来到约书亚跟前；基尼洗人耶孚尼的儿子迦勒对他说：“你知道雅威在加低斯·巴尼亚论到我和你、对神人摩西所说的话[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “话”也可译作“事”或“那件事”。
    reason: 保留 הַדָּבָר 在此可指所说的话语，也可指相关事情的词义幅度。
lexical_decisions:
- source_word: וַיִּגְּשׁוּ
  choice: 走近
  rationale: נגשׁ表示靠近、上前；“走近”既保留叙事动作，也符合现代汉语表达。
- source_word: בְנֵי יְהוּדָה
  choice: 犹大支派的人
  rationale: 字面为“犹大的众子”，在此是支派称谓；译作“犹大支派的人”自然清楚，并避免被误解为犹大的亲生儿子。
- source_word: בַּגִּלְגָּל
  choice: 在吉甲
  rationale: 按叙事语境，以标准汉语地名“吉甲”表达事件地点。
- source_word: כָּלֵב בֶּן יְפֻנֶּה הַקְּנִזִּי
  choice: 基尼洗人耶孚尼的儿子迦勒
  rationale: 保留族属称谓和父子关系，并采用现代中文圣经中通行的人名译法。
- source_word: אַתָּה יָדַעְתָּ
  choice: 你是知道的
  rationale: 完成式在此表示当前已有的认知状态；“你是知道的”也保留了原文对“你”的强调。
- source_word: הַדָּבָר
  choice: 那话
  rationale: דבר可指“话、事情、事项”；本句与“说”连用，主要指耶和华所发出的言语，故正文译“那话”，并以脚注保留其他可能。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代汉语圣经读者熟悉的专名形式，明确呈现四字神名而不以称号替代。
- source_word: מֹשֶׁה אִישׁ הָאֱלֹהִים
  choice: 神人摩西
  rationale: “神人”是简洁而庄重的固定圣经称谓，保留原文“属神之人”的正式头衔。
- source_word: עַל אֹדוֹתַי וְעַל אֹדוֹתֶיךָ
  choice: 论到我和你
  rationale: 准确表达“关于我、关于你”；汉语无需机械重复“论到”，仍保留两人并列的意义。
- source_word: בְּקָדֵשׁ בַּרְנֵעַ
  choice: 在加低斯·巴尼亚
  rationale: 采用清晰的现代中文音译，并用间隔号标示复合地名。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。正文以汉语圣经传统中最通行、普通读者最易识别的专名“耶和华”呈现；“雅威”是更接近学术重构读音的另一选择。
- issue: בְנֵי יְהוּדָה 的支派性与性别表达
  choice: 犹大支派的人
  alternative: 犹大的众子
  rationale: 此处群体前来代表犹大支派；“众子”虽贴近形式，却可能在现代汉语中被误读为直系儿子。所选译文保留支派身份，而不对群体成员作超出语境的性别断言。
- issue: הַדָּבָר 所指是言语还是事项
  choice: 那话
  alternative: 那件事
  rationale: 紧接动词“说”，因此正文突出神所说的话；但该词本身也可指所谈事项，故不排除“那件事”。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。保留“神人”这一圣经称谓；人名和地名使用简体中文常见译名。调整信息次序，使族属、父名和人名在汉语中清楚自然，同时不改变原文关系。
