source:
  edition: WLC
  text: וְ/עַתָּ֗ה תְּנָ/ה לִּ/י֙ אֶת הָ/הָ֣ר הַ/זֶּ֔ה אֲשֶׁר דִּבֶּ֥ר יְהוָ֖ה בַּ/יּ֣וֹם הַ/ה֑וּא כִּ֣י אַתָּֽה שָׁמַעְתָּ֩ בַ/יּ֨וֹם הַ/ה֜וּא כִּֽי עֲנָקִ֣ים שָׁ֗ם וְ/עָרִים֙ גְּדֹל֣וֹת בְּצֻר֔וֹת אוּלַ֨י יְהוָ֤ה אוֹתִ/י֙ וְ/ה֣וֹרַשְׁתִּ֔י/ם כַּ/אֲשֶׁ֖ר דִּבֶּ֥ר יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/014/012.yaml
  text: Now give me this hill country that Yahweh spoke about on that day[a], because you yourself heard on that day that the Anakim are there, with great fortified cities. Perhaps Yahweh will be with me, and I will drive them out[b], just as Yahweh said.
translation:
  language: zh_hans
  text: 现在，求你把雅威在那日所说的这片山地[a]给我，因为那日你亲耳听见，亚衲族人在那里，又有又大又坚固的城邑。或许雅威会与我同在[b]，我就把他们赶出去，正如雅威所说的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“这座山”。希伯来语הָהָר既可指一座山，也可指一片山区；这里更可能指较广的山地区域。
    reason: lexical_alternative
  - marker: b
    text: 希伯来语直译为“或许雅威与我同在”，没有明说动词；这里按即将进行的争战译作“会与我同在”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: 现在
  rationale: 作为话语标记，引出迦勒此刻的请求；汉语无需另译连接词也能自然承接上文。
- source_word: תְּנָה לִּי
  choice: 求你……给我
  rationale: 原文是“给我”的命令式。加入“求你”符合现代汉语提出郑重请求的自然表达，同时保留其直接性。
- source_word: אֶת־הָהָר הַזֶּה
  choice: 这片山地
  rationale: הַר既可指单座山，也可指山区；本节涉及作为产业的希伯仑山区，区域义更合语境，并以脚注保留“这座山”的可能译法。
- source_word: אֲשֶׁר דִּבֶּר יְהוָה
  choice: 雅威……所说的
  rationale: דבר本义是“说”，上下文虽含应许意味，但正文不将其强化为“应许”。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见音译呈现四字神名，而不以称号替代专名。
- source_word: כִּי אַתָּה שָׁמַעְתָּ
  choice: 因为……你亲耳听见
  rationale: כִּי在此说明请求的根据；独立人称代词אַתָּה带有强调，“亲耳”自然体现这一强调。
- source_word: עֲנָקִים
  choice: 亚衲族人
  rationale: 保留族群名称，并加“族人”使普通读者易于识别这是一个族群。
- source_word: וְעָרִים גְּדֹלוֹת בְּצֻרוֹת
  choice: 还有高大坚固的城
  rationale: 保留城市规模大且设防坚固两层含义，并采用自然的汉语并列结构。
- source_word: אוּלַי
  choice: 或许
  rationale: 保留原文不确定语气所表达的谦卑盼望，不将其改写成确定断言。
- source_word: יְהוָה אוֹתִי
  choice: 雅威会与我同在
  rationale: 原文是省略系词的短语；在未来争战语境中补出“会”，是自然汉语所需，同时以脚注说明其字面形式。
- source_word: וְהוֹרַשְׁתִּים
  choice: 我就把他们赶出去
  rationale: 使役式在征服土地的语境中表示驱逐当地居民；“赶出去”清楚、自然，并保留行动主体为迦勒。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用神的专名，故以音译“雅威”呈现，不以称号取代。
- issue: אוּלַי יְהוָה אוֹתִי所表达的把握程度
  choice: 或许雅威会与我同在
  alternative: 雅威必与我同在；或许雅威会帮助我
  rationale: 保留אוּלַי的“或许”以及“与我同在”的原文意象，既不把盼望改成确定宣告，也不把神的同在缩减为一般性的帮助。
- issue: דִּבֶּר是否应明确译为“应许”
  choice: 所说的
  alternative: 所应许的
  rationale: 语境确有应许性质，但动词本身是“说”；采用较宽的表达，以免在正文中消除原文用语的开放性。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“求你……给我”体现郑重请求，“亲耳听见”传达原文人称强调；保留“或许”所形成的谦卑与信心之间的张力。
