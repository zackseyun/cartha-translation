  text: Then Joshua blessed him and gave Hebron to Caleb son of Jephunneh as an inheritance[a].
translation:
  language: zh_hans
  text: 于是，约书亚就祝福他，把希伯仑赐给耶孚尼的儿子迦勒，作产业[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“约书亚祝福迦勒。”希伯来文作“祝福他”；按上下文，“他”指迦勒。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְבָרְכֵהוּ
  choice: 为他祝福
  rationale: 动词 ברך 带第三人称阳性单数宾语后缀，直译为“为他祝福”；“他”在上下文中明确指迦勒，同时保留希伯来文的代词表达。
- source_word: יְהוֹשֻׁעַ
  choice: 约书亚
  rationale: 采用现代中文圣经传统中通行且易识别的人名译法。
- source_word: וַיִּתֵּן
  choice: 赐给
  rationale: נתן 基本义为“给”。此处涉及约书亚分配应许之地，“赐给”自然庄重，也能表达授予产业的语境，但不额外说明终极赐予者。
- source_word: אֶת חֶבְרוֹן
  choice: 希伯仑
  rationale: אֶת 是直接宾语标记，不另译；地名 חֶבְרוֹן 采用通行译名“希伯仑”。
- source_word: לְכָלֵב בֶּן יְפֻנֶּה
  choice: 给耶孚尼的儿子迦勒
  rationale: 介词 לְ 标示接受者；“耶孚尼的儿子迦勒”符合现代汉语表达，并完整保留父子身份。
- source_word: לְנַחֲלָה
  choice: 作产业
  rationale: נַחֲלָה 在以色列土地分配语境中指承受并持有的产业。“作产业”简洁自然，保留土地承受与分配的含义。
