base_translation:
  language: en
  yaml_path: translation/ot/joshua/014/015.yaml
  text: The former name of Hebron was Kiriath-arba[a]; Arba was the greatest man among the Anakim[c][b]. And the land had rest from war.
translation:
  language: zh_hans
  text: 希伯仑从前名叫基列·亚巴[a]；亚巴是亚衲族中最杰出的人[b]。这地也平静下来，不再有战争[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “基列·亚巴”可能意为“亚巴城”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“亚衲族中的伟人。”原文可指亚巴是亚衲族中最显赫的人物。
    reason: alternative_reading
  - marker: c
    text: 或译：“这地也止息了争战，得享安宁。”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשֵׁם חֶבְרוֹן לְפָנִים
  choice: 希伯仑从前名叫
  rationale: לְפָנִים表示“从前、先前”；用“从前名叫”自然表达原文的旧地名说明。句首וְ不机械译作“现在”，避免加入原文没有的时间词。
- source_word: קִרְיַת אַרְבַּע
  choice: 基列·亚巴
  rationale: 按专名音译，并用间隔号呈现复合地名；其可能含义“亚巴城”置于脚注。
- source_word: הָאָדָם הַגָּדוֹל בָּעֲנָקִים הוּא
  choice: 亚巴是亚衲族中最杰出的人
  rationale: הוּא回指亚巴；הַגָּדוֹל在此可表示族群中地位最显著者。“最杰出”传达其卓越或首要地位，同时以脚注保留“伟人”这一较少比较色彩的理解。
- source_word: עֲנָקִים
  choice: 亚衲族
  rationale: 采用现代中文中清楚的族群称呼，指与亚衲相关的人群。
- source_word: וְהָאָרֶץ שָׁקְטָה מִמִּלְחָמָה
  choice: 这地也平静下来，不再有战争
  rationale: שָׁקְטָה表示安静、安定或得享安息；מִמִּלְחָמָה表示脱离战争状态。该译法以自然中文呈现战争止息后的安宁，并保留“这地”为主语。
