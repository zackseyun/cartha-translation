  text: עוֹדֶ֨/נִּי הַ/יּ֜וֹם חָזָ֗ק כַּֽ/אֲשֶׁר֙ בְּ/י֨וֹם שְׁלֹ֤חַ אוֹתִ/י֙ מֹשֶׁ֔ה כְּ/כֹ֥חִ/י אָ֖ז וּ/כְ/כֹ֣חִ/י עָ֑תָּה לַ/מִּלְחָמָ֖ה וְ/לָ/צֵ֥את וְ/לָ/בֽוֹא׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/014/011.yaml
  text: I am still as strong today as I was on the day Moses sent me; as my strength was then[a], so my strength is now, for battle and for going out and coming in.
translation:
  language: zh_hans
  text: 今天我仍像摩西差遣我那天一样强壮；我那时有多少力量，现在也有多少力量，能争战，也能出去、进来[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “出去、进来”直译为“出去和进来”。这是一个希伯来语惯用表达，可指日常或军事行动中的行动能力。
    reason: cultural_note
lexical_decisions:
- source_word: עוֹדֶנִּי הַיּוֹם חָזָק
  choice: 今天我仍然强壮
  rationale: 保留“仍然”所表达的持续状态，并以现代汉语自然呈现“今天”和“强壮”。
- source_word: כַּאֲשֶׁר בְּיוֹם שְׁלֹחַ אוֹתִי מֹשֶׁה
  choice: 像摩西差遣我那天一样
  rationale: 忠实表达比较关系和具体的时间指向，同时采用通顺的汉语语序。
- source_word: כְּכֹחִי אָז וּכְכֹחִי עָתָּה
  choice: 我那时有多大力量，现在也有多大力量
  rationale: 原文是省略系词的对称比较结构；用“有多大……也有多大”既保留平衡，也符合现代汉语表达。
- source_word: לַמִּלְחָמָה
  choice: 可以争战
  rationale: 此处说明迦勒现今仍具备投入战斗的能力；“争战”简洁、庄重，并符合军事语境。
- source_word: וְלָצֵאת וְלָבוֹא
  choice: 也可以出入
  rationale: 保留希伯来语“出去、进来”的具体表达及其可能具有的惯用含义，不在正文中将其窄化为某一种行动。
theological_decisions: []
