  text: בְּ/גוֹרַ֖ל נַחֲלָתָ֑/ם כַּ/אֲשֶׁ֨ר צִוָּ֤ה יְהוָה֙ בְּ/יַד מֹשֶׁ֔ה לְ/תִשְׁעַ֥ת הַ/מַּטּ֖וֹת וַ/חֲצִ֥י הַ/מַּטֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/014/002.yaml
  text: Their inheritance was by lot[a], as Yahweh had commanded through Moses, for the nine tribes and the half-tribe.
translation:
  language: zh_hans
  text: 他们的产业是按拈阄分得的，正如耶和华借着摩西[a]吩咐分给九个支派和半个支派的那样。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译“借摩西的手”，这是表示中介或代理的惯用说法。
    reason: 说明希伯来语惯用表达的字面形式与实际意义。
lexical_decisions:
- source_word: בְּגוֹרָל
  choice: 拈阄分得
  rationale: 介词 בְּ 表示方式或手段，גּוֹרָל 指用于分配的阄；此处译作“拈阄分得”，自然表达土地借拈阄分配的程序。
- source_word: נַחֲלָתָם
  choice: 他们的产业
  rationale: נַחֲלָה 在本段指以色列各支派承受并获分配的土地；“产业”既保留承受之物的含义，也符合现代中文圣经语体。
- source_word: כַּאֲשֶׁר
  choice: 正如
  rationale: 引出土地分配与先前命令的一致关系；“正如”清楚而不增添解释。
- source_word: צִוָּה
  choice: 所吩咐的
  rationale: 该完成式指此前已经颁下的命令；中文以“所吩咐的”自然体现其先行背景。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代简体中文中通行的专名“耶和华”呈现四字神名，而不以称号替代。
- source_word: בְּיַד מֹשֶׁה
  choice: 借着摩西
  rationale: 字面为“借摩西的手”，是希伯来语表示中介或代理的惯用表达；“借着摩西”在现代中文中准确传达该意义。
- source_word: לְתִשְׁעַת הַמַּטּוֹת
  choice: 分给九个支派
  rationale: 介词 לְ 标明分配对象；结合全句补出“分给”，使中文关系清楚。מַטֶּה 在此指“支派”。
- source_word: וַחֲצִי הַמַּטֶּה
  choice: 和半个支派
  rationale: 原文为单数“半个支派”，上下文指约旦河西承受产业的玛拿西半支派；正文不补出名称，以保留本节原有措辞。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用以色列上帝的专名。中文正文采用读者最熟悉且已专名化的“耶和华”，不以“主”等称号替换，也不据此加入额外神学解释。
- issue: בְּיַד מֹשֶׁה 所表达的神人中介关系
  choice: 借着摩西
  alternative: 借摩西的手
  rationale: 原文强调耶和华是命令的发出者，摩西是传达命令的中介。“借着摩西”保留这种关系，同时避免中文读者误把“手”理解为身体动作。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“拈阄”保留古代分配土地的具体程序，“产业”承接本段土地承受的语境。句末补出“分给”是为明确 לְ 所标示的对象关系，并未增加新的事件。英文咨询层把脚注标在“by lot”之后，却以内容解释“by the hand of Moses”；本稿依希伯来原文将脚注标在“借着摩西”之后。
