base_translation:
  language: en
  yaml_path: translation/ot/joshua/014/007.yaml
  text: I was forty years old when Moses the servant of Yahweh sent me from Kadesh-barnea to spy out the land[a], and I brought him back word according to my heart.
translation:
  language: zh_hans
  text: 我四十岁时，耶和华的仆人摩西从加低斯·巴尼亚差遣我去侦察那地；我把心里所想的回报给他。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我照着心里的想法向他回报。”
    reason: 原文末句可表明所带回的报告与迦勒内心的想法或判断相符；此译法保留原文表达的句法关系与一定歧义。
lexical_decisions:
- source_word: בֶּן אַרְבָּעִים שָׁנָה
  choice: 四十岁
  rationale: 这是希伯来语表达年龄的惯用语，直译为“四十岁之子”；现代汉语自然表达为“四十岁”。
- source_word: בִּשְׁלֹחַ
  choice: ……差遣我……的时候
  rationale: 带前缀 ב 的不定式结构表示时间背景，用现代汉语的“……的时候”自然传达。
- source_word: עֶבֶד יְהוָה
  choice: 耶和华的仆人
  rationale: “仆人”既保留 עֶבֶד 的基本含义，也符合此处对摩西的尊称和职分称谓。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的专名音译呈现四字神名，不以“主”替代。
- source_word: מִקָּדֵשׁ בַּרְנֵעַ
  choice: 从加低斯·巴尼亚
  rationale: 按现代简体中文惯例音译复合地名，并用间隔号分隔其组成部分。
- source_word: לְרַגֵּל
  choice: 去侦察
  rationale: 该动词指带有调查目的的侦察行动；“侦察”比传统的“窥探”更自然，也保留其军事勘察色彩。
- source_word: הָאָרֶץ
  choice: 那地
  rationale: 定冠词所指的土地在上下文中明确；“那地”自然承接迦南这一特定地域，又不额外加入“应许之地”等解释。
- source_word: וָאָשֵׁב אֹתוֹ דָּבָר
  choice: 我就……向他回报
  rationale: 该结构在此表示把消息或报告带回给摩西；“向他回报”简洁而符合现代汉语。
- source_word: כַּאֲשֶׁר עִם לְבָבִי
  choice: 照着自己的心意
  rationale: 保留“心”所表达的内在判断或确信，不把该短语过度解释为“忠心”“诚实”或“全心”。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用神名；译文采用现代中文圣经传统中最通行、普通读者最易识别的专名“耶和华”，而不以称号“主”替代。
- issue: 迦勒所回报内容的内在性质
  choice: 照着自己的心意
  alternative: 把心里所想的向他回报
  rationale: 原文可指与迦勒内心的判断、确信或想法相符。译文保留这一开放性，不擅自明确为道德上的诚实或全心忠诚。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“差遣”保留叙事的正式语体，“侦察”和“向他回报”则避免过度古雅。主句中的脚注标记置于所说明的末尾短语之后。
