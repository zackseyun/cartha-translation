revisions:
- from: 我四十岁的时候，耶和华的仆人摩西从加低斯·巴尼亚差遣我去侦察那地；我就照着自己的心意向他回报。[a]
  to: 我四十岁时，耶和华的仆人摩西从加低斯·巴尼亚差遣我去侦察那地；我把心里所想的回报给他。[a]
  rationale: 修订仅澄清末句中“报告”与“心”的关系，并使年龄表达更自然。没有把“心”解释为诚实、忠心或全心等超出原文的含义；脚注保留较贴近原句结构的替代译法，且锚点置于所说明的末句之后。
