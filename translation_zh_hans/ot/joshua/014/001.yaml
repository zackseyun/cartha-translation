id: JOS.14.1
reference: Joshua 14:1
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/אֵ֛לֶּה אֲשֶׁר נָחֲל֥וּ בְנֵֽי יִשְׂרָאֵ֖ל בְּ/אֶ֣רֶץ כְּנָ֑עַן אֲשֶׁ֨ר נִֽחֲל֜וּ אוֹתָ֗/ם אֶלְעָזָ֤ר הַ/כֹּהֵן֙ וִ/יהוֹשֻׁ֣עַ בִּן נ֔וּן וְ/רָאשֵׁ֛י אֲב֥וֹת הַ/מַּטּ֖וֹת לִ/בְנֵ֥י יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/014/001.yaml
  text: These are the inheritances that the sons of Israel received in the land of Canaan[a], which Eleazar the priest, Joshua son of Nun[c][b], and the heads of the fathers’ houses of the tribes of the sons of Israel apportioned to them.
translation:
  language: zh_hans
  text: 以色列人在迦南地所得的产业如下：祭司以利亚撒、嫩的儿子约书亚，以及以色列各支派宗族的首领，把这些产业分给了他们。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “宗族”指各支派中按共同祖先组成的家族群体。
    reason: cultural_note
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: 如下
  rationale: 承接上文并引出新的分地段落；现代汉语用“如下”自然表达篇章转换，无须添加时间性的“现在”。
- source_word: נָחֲלוּ
  choice: 所得
  rationale: 这里指以色列人领受所分配的土地产业；“所得”自然简洁，也避免让现代读者误解为仅指因死亡承继财产。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 这是希伯来语常用的民族称谓，字面为“以色列的众子”；在现代汉语中译作“以色列人”清楚自然，并包含全体民族成员。
- source_word: בְּאֶרֶץ כְּנָעַן
  choice: 在迦南地
  rationale: 保留原文“地”一词，凸显本节土地承受与分配的主题。
- source_word: אֲשֶׁר נִחֲלוּ אוֹתָם
  choice: 把这些产业分给了他们
  rationale: 该动词与前面的 נָחֲלוּ 同根，在此使役性语境中指正式分配产业；“分给”符合汉语表达，并以“产业”保留同根词的语义联系。
- source_word: אֶלְעָזָר הַכֹּהֵן
  choice: 祭司以利亚撒
  rationale: 按自然汉语语序呈现职衔与人名。
- source_word: וִיהוֹשֻׁעַ בִּן נוּן
  choice: 嫩的儿子约书亚
  rationale: 准确保留父子关系，并采用通行的圣经人名译法。
- source_word: רָאשֵׁי אֲבוֹת הַמַּטּוֹת לִבְנֵי יִשְׂרָאֵל
  choice: 以色列各支派宗族的首领
  rationale: 原文结构紧密，指各支派内按父系祖先组成的亲族单位之首领；“宗族”在现代汉语中比直译“父家”更易懂，同时保留祖系群体的含义。
theological_decisions:
- issue: בני ישראל 的性别化盟约称谓
  choice: 以色列人
  alternative: 以色列的众子／以色列子孙
  rationale: 该短语字面为男性复数亲属称谓，但在这里作为全民族名称使用。现代汉语“以色列人”准确传达其所指，不会错误排除女性，也不额外加入解释性神学含义。
- issue: אבות 所体现的祖系社会结构
  choice: 宗族
  alternative: 父家／祖族
  rationale: “宗族”既可表达由共同祖先维系的群体，也符合现代读者语言习惯；脚注说明其具体指各支派中的祖系家族单位，避免抹平原文社会结构。
- issue: 同根动词 נחל 在领受与分配两方面的张力
  choice: 所得的产业／把这些产业分给
  alternative: 承受为业／使他们承受为业
  rationale: 译文保留“产业”这一共同语义核心，同时用自然汉语分别表达百姓领受和领袖分配两方面，不将分地行为解释成超出原文的神学主张。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“产业”保留土地作为承受之业的语境；句首用主题式结构和冒号，使较长的主从关系易于理解。脚注标记置于相关整句末尾，因为注释说明其中的“宗族”。
