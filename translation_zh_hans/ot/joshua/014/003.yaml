source:
  edition: WLC
  text: כִּֽי נָתַ֨ן מֹשֶׁ֜ה נַחֲלַ֨ת שְׁנֵ֤י הַ/מַּטּוֹת֙ וַ/חֲצִ֣י הַ/מַּטֶּ֔ה מֵ/עֵ֖בֶר לַ/יַּרְדֵּ֑ן וְ/לַ֨/לְוִיִּ֔ם לֹֽא נָתַ֥ן נַחֲלָ֖ה בְּ/תוֹכָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/014/003.yaml
  text: For Moses had given the inheritance of the two tribes and the half-tribe beyond the Jordan[a], but to the Levites he gave no inheritance among them.
translation:
  language: zh_hans
  text: 因为摩西已经把产业分给了约旦河那边的两个支派和半个支派[a]；但在他们中间，他没有把产业分给利未人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “约旦河那边”也可译作“约旦河对岸”。
    reason: 希伯来语地理表达取决于说话者或叙事观察点，本节不必在译文中进一步指定方位。
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 在上下文中引出解释前文的理由；现代汉语用“因为”自然保留这一话语功能。
- source_word: נָתַן
  choice: 已经……分给了
  rationale: 所指是摩西先前完成的分地行动；“已经”在汉语中清楚表达其先于当前叙事时点。
- source_word: נַחֲלַת / נַחֲלָה
  choice: 产业
  rationale: 这里指作为承受之业而分得的土地；“产业”既保留继承含义，也符合圣经土地分配的语境。
- source_word: שְׁנֵי הַמַּטּוֹת
  choice: 两个支派
  rationale: מַטֶּה虽可指“杖”，但在分地语境中明确指以色列的支派。
- source_word: וַחֲצִי הַמַּטֶּה
  choice: 和半个支派
  rationale: 准确表达一个支派的一半，即上下文中的玛拿西半支派，同时不在本节正文补入原文未明说的名称。
- source_word: מֵעֵבֶר לַיַּרְדֵּן
  choice: 约旦河那边
  rationale: 保留希伯来语相对视点下的空间表达，不擅自具体化为东岸或西岸；地理视点的可能译法列入脚注。
- source_word: וְלַלְוִיִּם
  choice: 但……利未人
  rationale: 连接词字面为“和”，此处语义上却与前句构成对比，汉语译作“但”更自然。
- source_word: לֹא נָתַן נַחֲלָה
  choice: 没有把产业分给
  rationale: 直接表达否定的分配行动，并与前半节“把产业分给”保持词语呼应。
- source_word: בְּתוֹכָם
  choice: 在他们中间
  rationale: 保留利未人没有在这些支派中获得同类土地产业的限定，避免将经文说成否定他们所得的一切供应。
theological_decisions:
- issue: 利未人没有产业的性质
  choice: 保留“在他们中间”的限定，表明利未人没有像其他支派那样获分土地产业。
  alternative: 不加限定地译成“利未人没有产业”，使表述显得绝对。
  rationale: 本节本身以בְּתוֹכָם作出限定；保留它既忠于原文，也不把利未人所得的城邑或耶和华为其产业等其他经文内容提前解释进正文。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“分给产业”体现土地分配语境；正文中的脚注标记[a]与脚注完全对应。
