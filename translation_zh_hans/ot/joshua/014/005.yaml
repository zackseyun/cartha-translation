  text: כַּ/אֲשֶׁ֨ר צִוָּ֤ה יְהוָה֙ אֶת מֹשֶׁ֔ה כֵּ֥ן עָשׂ֖וּ בְּנֵ֣י יִשְׂרָאֵ֑ל וַֽ/יַּחְלְק֖וּ אֶת הָ/אָֽרֶץ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/014/005.yaml
  text: Just as Yahweh had commanded Moses[a], so the sons of Israel did, and they divided the land.
translation:
  language: zh_hans
  text: 雅威怎样吩咐摩西，以色列子孙[a]就怎样去做，并且分了那地。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“以色列人”。希伯来文直译为“以色列的众子”，是指以色列民众的惯用集体称谓。
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּאֲשֶׁר ... כֵּן
  choice: 照……的去做
  rationale: 这一对应结构表明，以色列人的行动与雅威的吩咐相符。此译法在现代汉语中自然，也保留原文“怎样吩咐，就怎样实行”的关系。
- source_word: צִוָּה
  choice: 吩咐
  rationale: 该动词表示下达命令；“吩咐”适合神对摩西发出命令的语境，庄重而通顺。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文四字神名音译，保留其作为专名的性质，而不以称号代替。
- source_word: אֶת מֹשֶׁה
  choice: 摩西
  rationale: 在צִוָּה之后，אֶת标明受命者；汉语自然表达为“吩咐摩西”。
- source_word: עָשׂוּ
  choice: 去做
  rationale: 保留עָשָׂה宽泛的“做、实行”含义，并以“去”使汉语句式顺畅，不另行补出原文未明说的宾语。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列子孙
  rationale: 较贴近原文“以色列的众子/后裔”的形式，同时在本处作为指全体以色列民的集体称谓。
- source_word: וַיַּחְלְקוּ
  choice: 分了
  rationale: 该动词可指分割或分配；“分了”保留原文简洁，也没有把具体分配方式过度明说。
- source_word: הָאָרֶץ
  choice: 那地
  rationale: 上下文所指是作为产业分配的迦南地；“那地”既承接明确所指，也避免误解为全世界的“大地”。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用神的专名。采用“雅威”以音译保留专名，不用称号替代；“耶和华”是传统形式，但较不贴近学界通常重构的读音。
- issue: בְּנֵי יִשְׂרָאֵל的集体含义
  choice: 以色列子孙
  alternative: 以色列人
  rationale: 主译保留原文亲属—后裔式表达，但不把它限定为只有男性；在此语境中，它是指以色列全体民众的惯用集体称谓。
translation_notes:
  register: 采用简洁、庄重的现代标准汉语。“以色列子孙”保留原文表达形式，脚注说明其集体含义；将脚注标记置于它实际说明的词语之后。原文末尾的段落标记不译入正文。
