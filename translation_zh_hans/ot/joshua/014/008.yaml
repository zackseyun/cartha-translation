id: JOS.14.8
reference: Joshua 14:8
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/אַחַ/י֙ אֲשֶׁ֣ר עָל֣וּ עִמִּ֔/י הִמְסִ֖יו אֶת לֵ֣ב הָ/עָ֑ם וְ/אָנֹכִ֣י מִלֵּ֔אתִי אַחֲרֵ֖י יְהוָ֥ה אֱלֹהָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/014/008.yaml
  text: But my brothers who went up with me made the heart of the people melt, while I wholly followed the LORD my God.
translation:
  language: zh_hans
  text: 可是，那些和我一同上去的弟兄使百姓胆战心惊；我却全心跟随耶和华我的上帝。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַחַי
  choice: 弟兄
  rationale: 直译为“我的弟兄”，语境中指与迦勒一同上去的同胞探子；中文省去“我的”更自然，所指仍清楚。
- source_word: הִמְסִיו אֶת־לֵב הָעָם
  choice: 使百姓胆战心惊
  rationale: 原文直译是“使百姓的心融化”，是使人丧胆、失去勇气的希伯来语形象表达；译为常用成语，保留强烈的恐惧与丧胆含义。
- source_word: מִלֵּאתִי אַחֲרֵי
  choice: 全心跟随
  rationale: 该短语字面涉及“充满/完全”，在此表示毫无保留、忠心到底地跟随；“全心跟随”自然且不把含义收窄为单纯服从。
- source_word: יְהוָה אֱלֹהָי
  choice: 耶和华我的上帝
  rationale: 以“耶和华”呈现神名 YHWH，并保留第一人称关系表达“我的上帝”。
theological_decisions:
- issue: 迦勒的跟随程度
  choice: 全心跟随
  alternative: 完全顺从
  rationale: 原文强调迦勒毫无保留地跟随耶和华，不必将其解释为绝对无罪或抽象意义上的完美顺服。
- issue: 两组探子行为的对照
  choice: 以“我却”明确对照
  alternative: 而我
  rationale: 原文连续的 וְ 在语境中形成鲜明反差；“我却”自然呈现这种对照，但不额外引入因果关系。
translation_notes:
  register: 采用庄重而通俗的现代标准汉语。“胆战心惊”传达原文“使心融化”的惯用意义；分号突出其他探子与迦勒之间的对照。
