revisions:
- from: 现在，看哪，耶和华照他所说的，使我存活[a]。自从耶和华对摩西说这话[b]，以色列人在旷野行走[c]，到如今已有四十五年。现在，看哪，我今天已经八十五岁了。
  to: 如今，看哪，耶和华照他所说的，使我一直活着；自从耶和华在以色列人在旷野行走[c]时对摩西说这话[b]以来，已经四十五年了。如今，看哪，我今天已经八十五岁了。
  rationale: 修订仅澄清原文的句法和时序：耶和华一直保全迦勒活着，时间跨度是从耶和华在以色列人行走于旷野时向摩西说这话起，至今四十五年。脚注c改为“行进时”，作为对“行走”的自然替代，避免“漂流”加入原文未明说的解释性语义。
