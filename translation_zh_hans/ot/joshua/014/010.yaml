id: JOS.14.10
reference: Joshua 14:10
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/עַתָּ֗ה הִנֵּה֩ הֶחֱיָ֨ה יְהוָ֣ה אוֹתִ/י֮ כַּ/אֲשֶׁ֣ר דִּבֵּר֒ זֶה֩ אַרְבָּעִ֨ים וְ/חָמֵ֜שׁ שָׁנָ֗ה מֵ֠/אָז דִּבֶּ֨ר יְהוָ֜ה אֶת הַ/דָּבָ֤ר הַ/זֶּה֙ אֶל מֹשֶׁ֔ה אֲשֶׁר הָלַ֥ךְ יִשְׂרָאֵ֖ל בַּ/מִּדְבָּ֑ר וְ/עַתָּה֙ הִנֵּ֣ה אָנֹכִ֣י הַ/יּ֔וֹם בֶּן חָמֵ֥שׁ וּ/שְׁמוֹנִ֖ים שָׁנָֽה׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/014/010.yaml
  text: And now[a], behold, Yahweh has kept me alive, just as he said, these forty-five years since Yahweh spoke this word to Moses while Israel walked in the wilderness. And now, behold[c][b], today I am eighty-five years old.
translation:
  language: zh_hans
  text: 如今，看哪，耶和华照他所说的，使我一直活着；自从耶和华在以色列人在旷野行走[c]时对摩西说这话[b]以来，已经四十五年了。如今，看哪，我今天已经八十五岁了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: “这话”也可译作“这事”；按上下文可理解为“这个应许”。
    reason: lexical_alternative
  - marker: c
    text: 或译：“以色列人在旷野行进时”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶחֱיָה
  choice: 使我存活
  rationale: 该词为חיה的使役形，在本语境中表示耶和华使迦勒一直活到如今；“使我存活”既保留使役形式，也自然表达持续保全生命之意。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代汉语中广为人知的专名“耶和华”音译四字神名，避免用称号取代原文的专名。
- source_word: כַּאֲשֶׁר דִּבֵּר
  choice: 照他所说的
  rationale: 忠实保留“说”的一般语义，不将其径直解释为“应许”，同时清楚表达事情与先前所言相符。
- source_word: זֶה אַרְבָּעִים וְחָמֵשׁ שָׁנָה מֵאָז
  choice: 自从……到如今已有四十五年
  rationale: 用自然现代汉语表达从过去某时点延续至今的四十五年，并保留זֶה指向当前时刻的语用功能。
- source_word: הַדָּבָר הַזֶּה
  choice: 这话
  rationale: דבר在此指耶和华对摩西所说的具体内容；“这话”贴近原文，并不先行限定为“应许”或“事情”。
- source_word: אֲשֶׁר הָלַךְ יִשְׂרָאֵל בַּמִּדְבָּר
  choice: 以色列人在旷野行走
  rationale: 保留הלך的“行走”意象；在句法上按时间背景理解，同时以脚注提示更符合语境的“漂流”译法。
- source_word: הִנֵּה
  choice: 看哪
  rationale: 保留原文两次引人注意并加强语势的标记；“看哪”庄重而仍为普通读者所理解。
- source_word: אָנֹכִי הַיּוֹם בֶּן חָמֵשׁ וּשְׁמוֹנִים שָׁנָה
  choice: 我今天已经八十五岁了
  rationale: 以自然汉语表达希伯来语“某岁之子”的年龄习语，并借“今天已经”体现对当前年龄的强调。
theological_decisions:
- issue: 四字神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用神的专名。正文采用现代中文圣经读者最熟悉且已专名化的“耶和华”，而不以“主”等称号替代；“雅威”是另一种较接近学术重构读音的音译。
- issue: דבר是否明确译作“应许”
  choice: 这话
  alternative: 这个应许
  rationale: 上下文确有承诺意味，但דבר本身可指话、事情或事项；译作“这话”保留原文的词义宽度与神学张力，不把解释直接写入正文。
- issue: 耶和华保全迦勒生命的表达
  choice: 使我存活
  alternative: 保全我的性命
  rationale: 使役形可表示使其活着或保全其生命；正文保留较直接的使役表达，不额外界定其作用方式。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“看哪”保留原文强调语气；其余句法适度调整为现代汉语时序表达。所有脚注标记均置于对应正文词语之后。
