revisions:
- from: 全城和城里的一切，都要作为当毁灭之物归给耶和华[a]。只有妓女喇合可以活下来，她和所有同她在屋里的人都可以存活，因为她藏匿了我们派去的使者[b]。
  to: 这城和城中所有的一切，都要归给耶和华，交付毁灭[a]。惟有妓女喇合和所有同她在屋里的人可以存活，因为她藏匿了我们所派的使者[b]。
  rationale: 将生硬的“作为当毁灭之物归给耶和华”改为“归给耶和华，交付毁灭”，使中文通顺，同时保留ḥerem所含的奉献归属和毁灭处置。合并喇合与屋内之人的存活陈述，既忠实于原文并列结构，也避免不必要的重复。脚注保留“当灭之物”这一较技术性的替代译法，并说明其语义。
