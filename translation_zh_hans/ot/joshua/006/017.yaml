  text: וְ/הָיְתָ֨ה הָ/עִ֥יר חֵ֛רֶם הִ֥יא וְ/כָל אֲשֶׁר בָּ֖/הּ לַֽ/יהוָ֑ה רַק֩ רָחָ֨ב הַ/זּוֹנָ֜ה תִּֽחְיֶ֗ה הִ֚יא וְ/כָל אֲשֶׁ֣ר אִתָּ֣/הּ בַּ/בַּ֔יִת כִּ֣י הֶחְבְּאַ֔תָה אֶת הַ/מַּלְאָכִ֖ים אֲשֶׁ֥ר שָׁלָֽחְנוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/017.yaml
  text: And the city and all that is in it shall be devoted to destruction for Yahweh[a]. Only Rahab the prostitute shall live, she and all who are with her in the house[b], because she hid the messengers whom we sent.
translation:
  language: zh_hans
  text: 这城和城中所有的一切，都要归给耶和华，交付毁灭[a]。惟有妓女喇合和所有同她在屋里的人可以存活，因为她藏匿了我们所派的使者[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“这城和城中所有的一切，都要归给耶和华，列为当灭之物”。这里的希伯来词指某物被不可撤回地归给耶和华；本节中，这要通过毁灭来执行。
    reason: lexical_alternative
  - marker: b
    text: 原文作“使者”；按上下文，他们是约书亚派去窥探那地的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: חֵרֶם
  choice: 作为当毁灭之物
  rationale: 该词在征服叙事中指不可撤回地献归上帝、并以毁灭来执行处置的事物。此译法兼顾“归献”与“毁灭”两层含义，避免只译成“受咒诅”。
- source_word: לַיהוָה
  choice: 归给耶和华
  rationale: 介词表示归属或奉献；“归给”与חֵרֶם连用，可表达全城被不可撤回地交由耶和华处置。专名יהוה音译为现代中文通行的“耶和华”。
- source_word: רַק
  choice: 只有
  rationale: 引出全城遭毁灭之下唯一明确的例外，中文自然且保留强调。
- source_word: הַזּוֹנָה
  choice: 妓女
  rationale: 直接、现代地表达该身份，不采用古雅或可能弱化含义的词。
- source_word: תִּחְיֶה
  choice: 可以活下来
  rationale: 动词本义为“活、存活”；在全城将被毁灭的语境中，“活下来”自然表达获准存活，又不额外加入“赦免”等神学解释。
- source_word: אִתָּהּ בַּבַּיִת
  choice: 同她在屋里
  rationale: 按字面指与喇合一起身处那座房屋的人，并非泛指整个家族或家户。
- source_word: הֶחְבְּאַתָה
  choice: 藏匿了
  rationale: 准确表达使人不被发现的使役含义，不额外加入“庇护”的评价色彩。
- source_word: הַמַּלְאָכִים
  choice: 使者
  rationale: 保留מַלְאָךְ的基本词义；上下文表明他们是约书亚派出的探查人员，但正文不把上下文解释直接替代原词。
- source_word: שָׁלָחְנוּ
  choice: 我们派去的
  rationale: 自然表达第一人称复数及先于本次命令发生的差派行动。
- source_word: וְהָיְתָה הָעִיר ... הִיא וְכָל אֲשֶׁר בָּהּ
  choice: 全城和城里的一切，都要
  rationale: 以“全城……都”自然体现希伯来文前置结构及复指代词所带的总体强调。
theological_decisions:
- issue: 征服语境中חֵרֶם的译法
  choice: 作为当毁灭之物归给耶和华
  alternative: 被彻底毁灭；列在禁令之下；受咒诅
  rationale: 此译法不淡化毁灭性审判，同时保留对象被交付、归属耶和华的奉献维度；“受咒诅”容易误成仅仅遭受诅咒。
- issue: 神名יהוה的表达
  choice: 耶和华
  alternative: 上主；主
  rationale: 使用中文圣经传统中可辨认的专名形式，保留原文神名的专名性质，不将其无标记地改成称号。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“作为当毁灭之物”略带法律和礼仪色彩，是为保留חֵרֶם同时包含归献与毁灭的张力；脚注提供较自然的替代说法及释义。人物称谓用“妓女喇合”，不采用古旧的“妓女喇合”以外委婉语。
