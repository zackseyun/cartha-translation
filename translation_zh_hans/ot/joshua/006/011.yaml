  text: וַ/יַּסֵּ֤ב אֲרוֹן יְהוָה֙ אֶת הָ/עִ֔יר הַקֵּ֖ף פַּ֣עַם אֶחָ֑ת וַ/יָּבֹ֨אוּ֙ הַֽ/מַּחֲנֶ֔ה וַ/יָּלִ֖ינוּ בַּֽ/מַּחֲנֶֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/011.yaml
  text: So the ark of Yahweh went around the city[a], circling it once. Then they came into the camp and spent the night in the camp.
translation:
  language: zh_hans
  text: 耶和华的约柜绕城一周[a]。随后，他们回到营中，在营里过夜。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译：“耶和华的约柜绕城，环绕一次。”原文把约柜写作动作的主体；从上下文可知，约柜是由祭司抬着的。
    reason: 说明原文的语法主体及其拟人化叙述。
lexical_decisions:
- source_word: וַיַּסֵּב
  choice: 绕
  rationale: 该动词在此描述环绕城行进；希伯来文以约柜为语法主语，中文保留这一叙事表达，不改写成被动式。
- source_word: אֲרוֹן יְהוָה
  choice: 耶和华的约柜
  rationale: 按原文的组合关系译出，并以“耶和华”呈现神的专名。
- source_word: הָעִיר הַקֵּף פַּעַם אֶחָת
  choice: 绕城一周
  rationale: 后续环绕表达与“פַּעַם אֶחָת”（一次）共同说明完整绕行一次；“一周”是现代汉语自然且准确的表达。
- source_word: וַיָּבֹאוּ הַמַּחֲנֶה
  choice: 他们回到营中
  rationale: בוא本义为来、进入；结合队伍先从营地出发巡城的上下文，译作“回到”使中文叙事自然，但略含语境推断。
- source_word: וַיָּלִינוּ בַּמַּחֲנֶה
  choice: 在营里过夜
  rationale: לון表示住宿、过夜；保留原文对“营”的重复，以维持叙事清晰度。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。中文正文采用读者最熟悉且具有专名功能的“耶和华”，不以“主”替代神名；“雅威”是较接近学术重构读音的另一选择。
- issue: 约柜作为动作主体
  choice: 保留“约柜绕城”的拟人化叙述
  alternative: 约柜被祭司抬着绕城
  rationale: 原文以约柜为语法主语；虽从上下文可知由祭司抬行，正文不把这一隐含信息直接加入，以免消解原文的叙事焦点。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“绕城一周”避免生硬重复；后半句保留“营”的重复，以贴近希伯来文节奏。
