  text: וַ/יָּסֹ֨בּוּ אֶת הָ/עִ֜יר בַּ/יּ֤וֹם הַ/שֵּׁנִי֙ פַּ֣עַם אַחַ֔ת וַ/יָּשֻׁ֖בוּ הַֽ/מַּחֲנֶ֑ה כֹּ֥ה עָשׂ֖וּ שֵׁ֥שֶׁת יָמִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/014.yaml
  text: On the second day they went around the city once and returned to the camp[b][a]. Thus they did for six days.
translation:
  language: zh_hans
  text: 第二天，他们绕城一次[a]，然后回到营地。六天都是这样做的[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“环城一周”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译：“他们这样做了六天。”意思是上述行动连续重复了六天。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּסֹבּוּ
  choice: 他们绕
  rationale: סבב表示绕行、环绕；“绕城”简洁自然，也不额外加入原文未明说的军事行进意味。
- source_word: אֶת הָעִיר
  choice: 城
  rationale: עִיר通常指城或城市；本节语境明确指耶利哥城，汉语“绕城”比“绕着城市”更自然。
- source_word: בַּיּוֹם הַשֵּׁנִי
  choice: 第二天
  rationale: 直接、自然地表达原文的时间短语。
- source_word: פַּעַם אַחַת
  choice: 一次
  rationale: 原文直义为“一次”；与“绕城”连用，既准确又保留其计数方式。
- source_word: וַיָּשֻׁבוּ
  choice: 然后回到
  rationale: שׁוב表示返回；“然后”清楚呈现叙事动作的先后，而“回到”是现代汉语的自然表达。
- source_word: הַמַּחֲנֶה
  choice: 营地
  rationale: מַחֲנֶה指驻扎的营地；“营地”在现代汉语中清楚、庄重。
- source_word: כֹּה עָשׂוּ
  choice: 都是这样做的
  rationale: כֹּה指“这样、如此”，与עָשׂוּ合起来概括上述行动模式；此译符合现代汉语叙事表达。
- source_word: שֵׁשֶׁת יָמִים
  choice: 六天
  rationale: 原文是不带介词的时长短语；汉语可直接用“六天”表达这一行动持续并重复了六天。
theological_decisions: []
