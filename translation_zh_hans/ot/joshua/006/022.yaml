base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/022.yaml
  text: And to the two men who had spied out the land[a], Joshua said, “Go into the house of the prostitute and bring out from there the woman and all that belongs to her, just as you swore to her.”
translation:
  language: zh_hans
  text: 约书亚对那两个侦察过那地的人说：“你们进那妓女的家，把那女人和一切属于她的都从那里带出来，正如你们向她所起的誓。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְלִשְׁנַיִם הָאֲנָשִׁים
  choice: 约书亚对那两个……人说
  rationale: 介词לְ标明受话对象，前置的וְ承接叙事；汉语以“约书亚对……说”的语序自然表达，同时不额外限定时间关系。
- source_word: הַמְרַגְּלִים אֶת הָאָרֶץ
  choice: 侦察过那地的
  rationale: רגל在此指军事侦察；“侦察过”依据上下文表达先前已完成的行动，“那地”保留定冠词所指的特定地域。
- source_word: בֹּאוּ בֵּית הָאִשָּׁה הַזּוֹנָה
  choice: 你们进那妓女的家
  rationale: בוא在命令中按汉语习惯译为“进”；בֵּית指住所，“家”较“房屋”自然；זוֹנָה直译为现代通行的“妓女”，不作委婉化处理。
- source_word: וְהוֹצִיאוּ מִשָּׁם
  choice: 把……都从那里带出来
  rationale: יצא的使役式表示使其出来；“带出来”适合人以及上下文所涵盖的一切，且明确保留מִשָּׁם“从那里”。
- source_word: אֶת הָאִשָּׁה
  choice: 那女人
  rationale: 原文再次使用“那女人”而非代词，译文保留这一重复，以反映希伯来文的措辞。
- source_word: וְאֶת כָּל אֲשֶׁר לָהּ
  choice: 和一切属于她的
  rationale: 保持原文表达的宽泛性，不将其仅限于财物；上下文可包括在她庇护之下的人与她所有的一切。
- source_word: כַּאֲשֶׁר נִשְׁבַּעְתֶּם לָהּ
  choice: 照你们向她所起的誓去做
  rationale: 明确该命令须依照二人向她所起之誓执行；“起誓”准确表达נשבע，补出“去做”使汉语句法完整而不增添实质内容。
theological_decisions:
- issue: 如何翻译喇合的身份词זוֹנָה
  choice: 妓女
  alternative: 娼妓；妓女身份的女人
  rationale: 该词明确指从事卖淫的女人；“妓女”是现代、直白且非古雅的标准表达，不以委婉词淡化原文，也不引入对其身份的其他解释。
- issue: “一切属于她的”所涵盖的范围
  choice: 保留宽泛表达“一切属于她的”
  alternative: 她所有的财物；她全家的人
  rationale: 原文כָּל אֲשֶׁר לָהּ本身范围宽泛，不能在本节中只限定为财物或亲属；译文保留这一区间，让上下文说明具体所指。
translation_notes:
  register: 采用现代标准普通话和庄重叙事语体。“侦察”符合军事语境；“妓女”直译原词而不使用古雅的“妓”。保留“妓女”与后文“那女人”的名词重复，但按自然汉语将“那妓女的家”处理为领属结构。
