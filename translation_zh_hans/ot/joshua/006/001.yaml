    reason: lexical_alternative
lexical_decisions:
- source_word: וִירִיחוֹ
  choice: 耶利哥城
  rationale: 采用通行地名“耶利哥”，并补出“城”以符合本节所述封城语境及现代汉语习惯；句首不另加“那时”或“如今”，避免增添原文没有的显性时间词。
- source_word: סֹגֶרֶת וּמְסֻגֶּרֶת
  choice: 严密封锁
  rationale: 同根主动分词与被动分词并列，形成加强语气，表达城已彻底关闭、戒备森严；“严密封锁”自然凝练地保留这种强调。
- source_word: מִפְּנֵי
  choice: 因
  rationale: 此处表示耶利哥封锁的缘由是以色列人的临近；译作“因”不额外加入原文未明说的“惧怕”。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 该短语字面为“以色列的众子”，在此是指以色列民族整体的惯用称谓；正文采用现代汉语通行表达，并以脚注保留其字面形式。
- source_word: אֵין יוֹצֵא וְאֵין בָּא
  choice: 无人出，也无人进
  rationale: 简明保留“出去—进来”的对应结构，表达城门完全封闭、人员无法通行。
