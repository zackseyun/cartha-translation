base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/023.yaml
  text: So the young men[a], the spies, went in and brought out Rahab, her father, her mother, her brothers, and all who belonged to her[b]. They brought out all her families and placed them outside the camp of Israel.
translation:
  language: zh_hans
  text: 那些作探子的年轻人进去，把喇合和她父亲、母亲、兄弟，以及凡属她的一切[a]都带了出来。他们把她所有的亲族[b]也带了出来，安置在以色列营外。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“凡属她的人”。原文也可泛指“凡属她的一切”；按上下文，主要可能是属于她家中的人。
    reason: lexical_alternative
  - marker: b
    text: 或译：“她所有的家族”或“她所有的宗族”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנְּעָרִים הַמְרַגְּלִים
  choice: 那些作探子的年轻人
  rationale: נַעַר通常指年轻男子；הַמְרַגְּלִים是同位或修饰成分，说明这些年轻人就是探子。译作“那些作探子的年轻人”自然、简明，也不补入本节未明说的“土地”。
- source_word: וַיֹּצִיאוּ / הוֹצִיאוּ
  choice: 带了出来
  rationale: יצא的使役形表示“使出来、带出来”。两处采用同一译法，以保留原文的重复。
- source_word: כָּל אֲשֶׁר לָהּ
  choice: 一切属于她的
  rationale: 原短语范围较宽，可指属于她的人，也可能包括其他所有物；此译法保留这种语义宽度，不在正文中把所指限定为家庭成员。
- source_word: מִשְׁפְּחוֹתֶיהָ
  choice: 她所有的亲族
  rationale: מִשְׁפָּחָה可指家族、宗族或较广的亲属群体。上下文已经列出至亲，因此“亲族”较自然地表达更广的亲属范围，同时避免过于技术化。
- source_word: וַיַּנִּיחוּם
  choice: 安置
  rationale: נוח的使役形在此表示把人放置或留在某处。“安置”表达有意将他们置于营外，但不说明这样做的原因。
- source_word: מִחוּץ לְמַחֲנֵה יִשְׂרָאֵל
  choice: 在以色列营外
  rationale: 直接表达原文的空间关系，简洁自然，不添加关于暂时隔离或随后归入以色列的解释。
theological_decisions:
- issue: 喇合及其亲族被安置在以色列营外的原因
  choice: 只译出他们所在的位置，不解释原因。
  alternative: 解释为礼仪隔离、保护性安置，或归入以色列之前的暂时隔离。
  rationale: 希伯来文只陈述他们被安置在营外，并未说明原因；正文应保留这一叙事与神学上的开放性。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“那些作探子的年轻人”保留原文对人物身份的双重说明；两个脚注标记均置于相应的歧义词组之后。
