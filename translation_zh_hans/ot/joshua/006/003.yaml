  text: וְ/סַבֹּתֶ֣ם אֶת הָ/עִ֗יר כֹּ֚ל אַנְשֵׁ֣י הַ/מִּלְחָמָ֔ה הַקֵּ֥יף אֶת הָ/עִ֖יר פַּ֣עַם אֶחָ֑ת כֹּ֥ה תַעֲשֶׂ֖ה שֵׁ֥שֶׁת יָמִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/003.yaml
  text: You shall march around the city[a], all the men of war, circling the city once. Thus you shall do for six days.
translation:
  language: zh_hans
  text: 你们中所有作战的男子[a]都要绕城行进，绕城一周。你要照这样做六天。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“所有战士”或“所有勇士”。希伯来文直译为“所有战争之人”，此处指男性战斗人员。
    reason: 说明原文的字面结构、男性所指及可行的汉语词汇选择。
lexical_decisions:
- source_word: וְסַבֹּתֶם
  choice: 你们……要绕城行进
  rationale: 该词源于סבב，是第二人称阳性复数形式，表示绕行。结合军事场景译为“绕城行进”，既保留环绕之意，也体现列队行进的语境。
- source_word: הָעִיר
  choice: 城
  rationale: עִיר带定冠词，直指上下文中的耶利哥；原文仍使用普通名词，因此译作“城”，不直接换成专名。
- source_word: כֹּל אַנְשֵׁי הַמִּלְחָמָה
  choice: 所有作战的男子
  rationale: 原文直译近于“所有战争之人”，语法和语义均为阳性，指参与作战的男性。此译法明确保留性别与军事含义，同时比生硬的“战争之人”更符合现代汉语。
- source_word: הַקֵּיף
  choice: 把城环绕
  rationale: 该形式强化绕城、环行一圈的动作。译文用“把城环绕”承接前面的“绕城行进”，保留原文复述强调而不作完全机械的重复。
- source_word: פַּעַם אֶחָת
  choice: 一周
  rationale: 字面为“一次”，在绕城语境中所指是完整绕行一圈；现代汉语以“一周”表达最自然准确。
- source_word: כֹּה
  choice: 这样
  rationale: 指按刚才规定的方式行动；“这样”是现代汉语中自然、庄重而清楚的对应表达。
- source_word: תַעֲשֶׂה
  choice: 你要……行
  rationale: 原文转为第二人称阳性单数，指向约书亚作为负责执行命令的领袖。译作单数“你”，保留与前句复数“你们”的人数转换。
- source_word: שֵׁשֶׁת יָמִים
  choice: 六天
  rationale: 表示这一行动持续并重复六天。汉语“这样行六天”自然表达规定在六日内反复执行。
theological_decisions:
- issue: אַנְשֵׁי הַמִּלְחָמָה的性别表达
  choice: 所有作战的男子
  alternative: 所有战士／所有勇士
  rationale: 原文明确使用阳性复数，所指为男性战斗人员。正文保留这一信息，不以可能弱化性别信息的泛称取代；脚注列出较简洁的汉语替代译法。
- issue: 受命者由复数转为单数
  choice: 前句用“你们”，后句用“你”
  alternative: 两处均译为复数，或两处均译为单数
  rationale: 希伯来文先用第二人称阳性复数命令参与绕城的人，随后用第二人称阳性单数对约书亚说“你要这样行”。译文保留这种转换，不替原文消除其责任主体与参与群体之间的张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事命令语体。“绕城行进，把城环绕一周”有意保留希伯来文对环绕动作的复述强调；“你们”与“你”的转换则对应原文人数变化。
