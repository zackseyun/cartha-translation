source:
  edition: WLC
  text: וַ/יַּשְׁבַּ֣ע יְהוֹשֻׁ֔עַ בָּ/עֵ֥ת הַ/הִ֖יא לֵ/אמֹ֑ר אָר֨וּר הָ/אִ֜ישׁ לִ/פְנֵ֣י יְהוָ֗ה אֲשֶׁ֤ר יָקוּם֙ וּ/בָנָ֞ה אֶת הָ/עִ֤יר הַ/זֹּאת֙ אֶת יְרִיח֔וֹ בִּ/בְכֹר֣/וֹ יְיַסְּדֶ֔/נָּה וּ/בִ/צְעִיר֖/וֹ יַצִּ֥יב דְּלָתֶֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/026.yaml
  text: At that time Joshua made them swear[a], saying, “Cursed before Yahweh is the man who rises up and rebuilds this city, Jericho. At the cost of his firstborn he will lay its foundation[c][b], and at the cost of his youngest he will set up its gates.”
translation:
  language: zh_hans
  text: 那时，约书亚叫众人起誓[a]说：“凡起来重建这座耶利哥城的人，必在耶和华面前受诅咒[b]！他立城根基时，必以长子为代价；安设城门时，必以幼子为代价[c]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“使众人受誓言约束”。希伯来文动词为使役形式，表示约书亚使众人起誓。
    reason: lexical_alternative
  - marker: b
    text: 直译“那人必在耶和华面前受诅咒”。“那人”在这里是阳性单数的泛称，指任何这样做的人。
    reason: lexical_alternative
  - marker: c
    text: 直译“用他的长子……用他的幼子”。这里很可能是“以他们为代价”的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁבַּע
  choice: 叫众人起誓
  rationale: 使役词形表示约书亚使在场的人起誓，而不只是他自己发誓；宾语“众人”由上下文补出。
- source_word: לִפְנֵי יְהוָה
  choice: 在耶和华面前
  rationale: 保留“在YHWH面前、鉴察之下”的庄重含义，并按本项目惯例将神名译为“耶和华”。
- source_word: אָרוּר הָאִישׁ
  choice: 凡……的人，必……受诅咒
  rationale: האיש虽为阳性单数，在这里泛指任何采取这一行动的人；中文用“凡……的人”自然表达其通指功能。
- source_word: יָקוּם וּבָנָה
  choice: 起来重建
  rationale: 既保留“起来采取行动”的表达，也根据耶利哥刚被毁的语境明确这是重建。
- source_word: בִּבְכֹרוֹ / וּבִצְעִירוֹ
  choice: 以长子为代价／以幼子为代价
  rationale: 介词ב在此诅咒语境中很可能表示付出的代价；该译法传达丧失，却不额外断定其具体机制。
- source_word: יְיַסְּדֶנָּה
  choice: 立城根基
  rationale: יסד在建筑语境中指奠定根基；中文补出“城”以清楚呈现阴性宾语后缀所指。
- source_word: יַצִּיב דְּלָתֶיהָ
  choice: 安设城门
  rationale: 在城防语境中，דלתות指城门的门扇或城门设施；“安设城门”简洁自然。
theological_decisions:
- issue: 约书亚宣告的性质
  choice: 译为在耶和华面前生效的庄严诅咒
  alternative: 约书亚个人的愿望，或纯属世俗禁令
  rationale: “在耶和华面前受诅咒”具有明确的神圣审判色彩，但译文不进一步界定其实施方式。
- issue: 重建者儿子的遭遇
  choice: 译为重建各阶段将以长子和幼子为代价
  alternative: 明确解释为献儿为祭，或仅泛指施工期间遭遇不幸
  rationale: 经文把儿子的丧失与立根基、安城门相联系，却没有说明死亡或丧失的具体机制，因此保留这一张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“立城根基”“安设城门”保留诅咒中两个施工阶段的平行结构；不明确加入“死亡”“献祭”等原文未明说的内容。
