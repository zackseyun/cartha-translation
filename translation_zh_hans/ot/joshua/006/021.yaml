  text: וַֽ/יַּחֲרִ֨ימוּ֙ אֶת כָּל אֲשֶׁ֣ר בָּ/עִ֔יר מֵ/אִישׁ֙ וְ/עַד אִשָּׁ֔ה מִ/נַּ֖עַר וְ/עַד זָקֵ֑ן וְ/עַ֨ד שׁ֥וֹר וָ/שֶׂ֛ה וַ/חֲמ֖וֹר לְ/פִי חָֽרֶב־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/021.yaml
  text: And they devoted to destruction everything that was in the city[a], from man to woman, from young to old, and even ox and sheep and donkey, by the edge of the sword.
translation:
  language: zh_hans
  text: 他们将城中所有的一切都归于禁毁[a]：无论男女、老少，连牛、羊和驴，都用刀杀尽了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “归于禁毁”或译“尽行毁灭”。希伯来语动词指把人或物不可撤回地划归禁毁，即交付毁灭。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּחֲרִימוּ
  choice: 彻底毁灭，归于禁毁
  rationale: חרם 的使役形在此是战争中的专门用语，表示将人或物不可撤回地置于禁毁之下。“彻底毁灭”清楚表达实际行动，“归于禁毁”保留其专门含义；脚注补充可选译法。
- source_word: כָּל אֲשֶׁר בָּעִיר
  choice: 城里所有的一切
  rationale: 保留 כָּל 的全面性，并自然引出随后列举的人和牲畜。
- source_word: מֵאִישׁ וְעַד אִשָּׁה
  choice: 无论男女
  rationale: 这是涵盖两性的范围表达；现代汉语用“无论男女”简明自然，不把单数形式误解为仅指某一个男人和女人。
- source_word: מִנַּעַר וְעַד זָקֵן
  choice: 老少
  rationale: 以现代汉语的对举表达从年幼到年老的完整年龄范围。
- source_word: וְעַד שׁוֹר וָשֶׂה וַחֲמוֹר
  choice: 甚至牛、羊和驴
  rationale: “甚至”传达范围延伸到牲畜的递进与包举作用；各动物名词按汉语习惯作类称。
- source_word: לְפִי חָרֶב
  choice: 用刀杀了
  rationale: 这是表示以刀剑杀戮的固定习语。直译“刀口”在现代汉语中容易显得生硬；此译保留行为与手段，也与上下文的死亡结果相符。
theological_decisions:
- issue: 战争审判语境中 חרם 的译法
  choice: 彻底毁灭，归于禁毁
  alternative: 尽行毁灭；置于禁令之下
  rationale: 原词不只是泛指杀死，也含将对象划归不可撤销之禁毁的专门意味。正文同时表达毁灭的现实与术语含义，不淡化暴力，也不在经文中加入超出原文的神学解释。
translation_notes:
  register: 采用庄重而直接的现代标准汉语。“无论男女、老少”以自然对举保留原文的范围表达；“全都用刀杀了”明确交代 לְפִי חָרֶב 的工具与结果。
