  to: 不过，你们务要远离当灭之物[a]，免得你们使自己成为当灭的[b]，又拿取当灭之物，使以色列营成为当灭的，并给它招来灾祸[c]。
  rationale: 修订恢复了希伯来原文在警告从句中的语序：先说使自己成为当灭的，继而说拿取当灭之物，再说使以色列营成为当灭的并给它招来灾祸。这样不把原文的关系过度限定为现代汉语中的明确因果链。术语保持一致，并微调脚注以更准确说明历史叙事中的后续呼应。
