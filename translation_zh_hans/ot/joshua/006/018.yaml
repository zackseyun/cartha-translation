id: JOS.6.18
reference: Joshua 6:18
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/רַק אַתֶּם֙ שִׁמְר֣וּ מִן הַ/חֵ֔רֶם פֶּֽן תַּחֲרִ֖ימוּ וּ/לְקַחְתֶּ֣ם מִן הַ/חֵ֑רֶם וְ/שַׂמְתֶּ֞ם אֶת מַחֲנֵ֤ה יִשְׂרָאֵל֙ לְ/חֵ֔רֶם וַ/עֲכַרְתֶּ֖ם אוֹתֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/018.yaml
  text: But as for you[a], keep yourselves from what is devoted to destruction, lest you yourselves become devoted to destruction and take some of what is devoted to destruction, and make the camp of Israel devoted to destruction[c][b], and bring trouble on it.
translation:
  language: zh_hans
  text: 不过，你们务要远离当灭之物[a]，免得你们使自己成为当灭的[b]，又拿取当灭之物，使以色列营成为当灭的，并给它招来灾祸[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “当灭之物”译自希伯来语חֵרֶם（ḥerem）；传统上也译作“禁物”或“该受咒诅之物”。这里指不可撤销地献归上帝、并在此语境中交付毁灭的人或物。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“免得你们把自己置于禁令之下”。
    reason: alternative_reading
  - marker: c
    text: “招来灾祸”呼应亚干犯罪及其给以色列带来的后果；参约书亚记7:1、25。
    reason: cross_reference
lexical_decisions:
- source_word: וְרַק אַתֶּם
  choice: 不过，你们务要
  rationale: וְרַק引出强烈的转折和限定，独立代词אַתֶּם带有强调。用“不过，你们务要”既突出直接警告，也符合现代汉语表达。
- source_word: שִׁמְרוּ מִן הַחֵרֶם
  choice: 远离当灭之物
  rationale: שמר与מן连用表示谨慎防备、使自己不沾染某物。“远离”自然传达这种自我防守；חֵרֶם在本处指不可撤销地归给上帝、因而必须毁灭的人或物。
- source_word: פֶּן תַּחֲרִימוּ וּלְקַחְתֶּם מִן הַחֵרֶם
  choice: 免得你们拿取其中之物，使自己也成为当灭的
  rationale: פֶּן引出警告的后果。希伯来语先说“成为／使之成为当灭的”，再说“拿取”；汉语调整分句次序，以清楚表达拿取当灭之物会使拿取者落入同一受审判的处境，同时以脚注保留另一种表达。
- source_word: וְשַׂמְתֶּם אֶת מַחֲנֵה יִשְׂרָאֵל לְחֵרֶם
  choice: 使以色列营也成为当灭的
  rationale: שׂים在此表示造成某种结果；“以色列营”保留原文的群体和盟约背景。“也”显明个人的行为会把全营带入同样的境地。
- source_word: וַעֲכַרְתֶּם אוֹתוֹ
  choice: 并给全营招来灾祸
  rationale: עכר表示搅扰并带来祸患；“招来灾祸”自然地保留其使动含义。אוֹתוֹ所指的是以色列营，译作“全营”可避免现代汉语代词指向含混。
theological_decisions:
- issue: 圣战和审判语境中的חֵרֶם
  choice: 当灭之物／成为当灭的
  alternative: 禁物／置于禁令之下／该受咒诅之物
  rationale: “当灭”表达某人或某物已不可撤销地归给上帝，并在本语境中交付毁灭，既保留其神学分量，也避免把חֵרֶם简单等同于一般意义的“受咒诅”。脚注进一步说明该词的专门含义。
- issue: תַּחֲרִימוּ所表达的结果或使动含义
  choice: 使自己也成为当灭的
  alternative: 把自己置于禁令之下
  rationale: 上下文警告以色列人：拿取当灭之物会使他们自己承受同样的判决。正文传达这一结果，但脚注保留“置于禁令之下”的另一种表达，不把希伯来语的使动色彩完全抹去。
- issue: 个人犯罪给整个以色列营带来的后果
  choice: 使以色列营也成为当灭的，并给全营招来灾祸
  alternative: 使以色列营处在禁令之下，并扰害它
  rationale: 原文明确把个人拿取之举与全营所受的审判相连。译文保留这种群体性后果，不加入关于责任机制的额外教义解释。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“务要”加强警告语气；“当灭”作为全节反复出现的核心术语，统一对应חֵרֶם词根，使原文的重复和神学关联清晰可见。为符合汉语因果顺序，将“拿取其中之物”置于“使自己也成为当灭的”之前，但没有改变警告的实质。
