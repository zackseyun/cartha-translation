  text: וְ/כֹ֣ל כֶּ֣סֶף וְ/זָהָ֗ב וּ/כְלֵ֤י נְחֹ֨שֶׁת֙ וּ/בַרְזֶ֔ל קֹ֥דֶשׁ ה֖וּא לַֽ/יהוָ֑ה אוֹצַ֥ר יְהוָ֖ה יָבֽוֹא׀׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/019.yaml
  text: But all the silver and gold[a], and the vessels of bronze and iron, are holy to Yahweh[b]; they shall go into the treasury of Yahweh.
translation:
  language: zh_hans
  text: 不过，所有的金银、铜器和铁器都归耶和华为圣；要收入耶和华的宝库。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/כֹל
  choice: 不过，所有的
  rationale: וְ 在此承接上一节，同时与当灭之物形成转折；“不过”自然表达语境中的例外关系，כֹל 译为“所有的”。
- source_word: כֶּסֶף וְ/זָהָב
  choice: 金银
  rationale: כֶּסֶף 在与金和其他金属并列时指银这种金属；现代汉语习惯将“银和金”自然表达为“金银”，不改变范围。
- source_word: וּ/כְלֵי נְחֹשֶׁת וּ/בַרְזֶל
  choice: 以及铜器和铁器
  rationale: כְּלִי 是泛指器物的词；此处按材质分类，译作“器”简洁自然。נְחֹשֶׁת 可指铜或铜合金，汉语圣经语境用“铜”既自然，也避免把具体合金成分说得过死。
- source_word: קֹדֶשׁ הוּא לַ/יהוָה
  choice: 都要归耶和华为圣
  rationale: 希伯来文用单数“它是圣的”，把前列各项视为一个集合。“归耶和华为圣”保留分别归属耶和华的献圣含义；汉语用“都”自然照应复合列举。
- source_word: לַ/יהוָה … יְהוָה
  choice: 耶和华
  rationale: 专名 יְהוָה 在现代中文圣经传统中通常译作“耶和华”，既作为名字呈现，也便于普通读者识别。
- source_word: אוֹצַר יְהוָה
  choice: 耶和华的宝库
  rationale: אוֹצָר 可指库房或宝库；本节收入的是贵重金属和器物，“宝库”最贴合此处语境。
- source_word: יָבֹוא
  choice: 这些都要收入
  rationale: 原文动词为单数，以集合整体为主语。汉语补出“这些”指代前述物品，并以“收入”自然表达进入宝库；不明确添加原文未说明的执行者。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。中文正文采用读者最熟悉且具有专名功能的“耶和华”；“雅威”更接近常见学术拟音，但其确切古代读音不能完全确定。
- issue: קֹדֶשׁ לַיהוָה 的献圣与归属含义
  choice: 归耶和华为圣
  alternative: 是耶和华的圣物
  rationale: “归……为圣”同时保留分别为圣和归属的意味，且不把名词性表述过度具体化为某类宗教器物。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“不过”体现与上一节禁令之间的例外转折；“这些都要收入”清楚承接列举，同时保留原文把各项视为集合整体的语义。
