  text: וְ/שִׁבְעָ֣ה הַ/כֹּהֲנִ֡ים נֹשְׂאִים֩ שִׁבְעָ֨ה שׁוֹפְר֜וֹת הַ/יֹּבְלִ֗ים לִ/פְנֵי֙ אֲר֣וֹן יְהוָ֔ה הֹלְכִ֣ים הָל֔וֹךְ וְ/תָקְע֖וּ בַּ/שּׁוֹפָר֑וֹת וְ/הֶ/חָלוּץ֙ הֹלֵ֣ךְ לִ/פְנֵי/הֶ֔ם וְ/הַֽ/מְאַסֵּ֗ף הֹלֵךְ֙ אַֽחֲרֵי֙ אֲר֣וֹן יְהוָ֔ה הולך וְ/תָק֥וֹעַ בַּ/שּׁוֹפָרֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/013.yaml
  text: And the seven priests[a], carrying seven ram’s-horn trumpets before the ark of Yahweh, were walking on and blowing the trumpets, and the armed men were going before them, and the rear guard was going behind the ark of Yahweh, while they went on blowing the trumpets.
translation:
  language: zh_hans
  text: 七个祭司拿着七个公羊角号[a]，走在雅威的约柜前面，一路前行，吹着号。武装的人走在他们前面，后卫走在雅威的约柜后面；仍一路前行，号角不断吹响。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“七个禧年号”或“七个公羊角”。希伯来语这一表达指用公羊角制成或与公羊角有关的号。
    reason: 说明שׁוֹפְרוֹת הַיֹּבְלִים的词义范围及可行译法。
lexical_decisions:
- source_word: שׁוֹפְרוֹת הַיֹּבְלִים
  choice: 羊角号
  rationale: שׁוֹפָר指用角制成并用于吹奏的号，הַיֹּבְלִים在此进一步表明与公羊角有关。“羊角号”兼顾器物来源和乐器功能，也符合现代中文习惯。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文直接音译四字神名，不以“耶和华”或“主”等传统形式替代。
- source_word: הֹלְכִים הָלוֹךְ
  choice: 一路前行
  rationale: 限定动词与绝对不定式连用，强调持续行进；“一路前行”自然地表达延续性。
- source_word: וְתָקְעוּ בַּשּׁוֹפָרוֹת
  choice: 吹着号角
  rationale: תקע与שׁוֹפָר连用表示吹号；“吹着”与前面的持续行进相配，呈现同步进行的动作。
- source_word: הֶחָלוּץ
  choice: 武装的人
  rationale: 该词指装备好、列队作战的人；这里是走在祭司前面的武装队伍。
- source_word: לִפְנֵיהֶם
  choice: 走在他们前面
  rationale: 依上下文，“他们”最自然地指刚提到的七个祭司。
- source_word: הַמְאַסֵּף
  choice: 后卫
  rationale: 在军事及行列语境中，该词指殿后的一队人；“后卫”简明并保留其军事色彩。
- source_word: הוֹלֵךְ וְתָקוֹעַ
  choice: 队伍继续前行，号角不断吹响
  rationale: 原文再次描写持续行进和吹号，但动作执行者的衔接略显含混。此译法保留持续性和画面，同时不武断断定是后卫而非祭司吹号。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文两次明确使用四字神名。译作“雅威”保留其专名性质，不以称号取代，也不采用受后期元音组合影响的“耶和华”。
- issue: 末句吹号者的指向
  choice: 使用不明确指出施事者的“号角不断吹响”
  alternative: 后卫一路前行并吹着号角；祭司一路吹着号角
  rationale: 希伯来文末尾以单数分词衔接“后卫”，表面上可指后卫，但本节前半明确说祭司吹号，语篇上也可能是对整个行列及持续号声的概括。译文避免消除这一张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。以短句分开长串并列结构，保留行列次序和动作持续感；“约柜”“祭司”“号角”等沿用普通读者熟悉的圣经用语。
