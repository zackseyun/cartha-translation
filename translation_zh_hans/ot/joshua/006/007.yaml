source:
  edition: WLC
  text: ו/יאמרו אֶל הָ/עָ֔ם עִבְר֖וּ וְ/סֹ֣בּוּ אֶת הָ/עִ֑יר וְ/הֶ֣/חָל֔וּץ יַעֲבֹ֕ר לִ/פְנֵ֖י אֲר֥וֹן יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/007.yaml
  text: And they said to the people[a], “Pass on and go around the city, and let the armed men pass before the ark of Yahweh.”
translation:
  language: zh_hans
  text: 他们对百姓说：“前进，绕城而行；武装人员[a]要走在雅威的约柜前面。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“先锋队”，即走在约柜前面的武装人员。
    reason: חָלוּץ既可突出人员已经武装，也可按其在队列中的功能理解为先锋部队；正文与脚注共同保留这一语义幅度。
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: 他们……说
  rationale: 第三人称复数的叙事性动词，承接前文动作；中文不必另译连接词，也能自然表现叙事推进。
- source_word: אֶל־הָעָם
  choice: 对百姓
  rationale: עָם的基本义为“百姓、人民”；虽然本节处于军事场景，仍不宜直接窄化为“军队”。
- source_word: עִבְרוּ
  choice: 前进
  rationale: 此处是命令队伍向前行进，并非越过河流或边界；“前进”符合游行队列的语境。
- source_word: וְסֹבּוּ אֶת־הָעִיר
  choice: 绕城而行
  rationale: 准确表达סבב绕着某物行走的空间意义，也保留行进动作，语言庄重自然。
- source_word: וְהֶחָלוּץ
  choice: 武装的人
  rationale: חָלוּץ指装备好、预备作战的人；正文保留其明确的武装含义，关于其先遣队功能的理解列入脚注。
- source_word: יַעֲבֹר
  choice: 要走
  rationale: 未完成式在连续命令中具有指令意味；“要走”以自然中文表达这一命令语气。
- source_word: לִפְנֵי אֲרוֹן יְהוָה
  choice: 在雅威的约柜前面
  rationale: לִפְנֵי表示位于前方；“雅威的约柜”保留原文神名及属格关系。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语中常见的音译呈现四字神名，保留其专名性质，不以称号替代。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”较贴近学界通行的YHWH复原读音，并清楚表明这是专名。
translation_notes:
  register: 采用现代、清楚而庄重的叙事语言。“绕城而行”比口语化的“绕着城走”更适合经文体；分号区分对全体的命令与对武装人员的具体安排。
