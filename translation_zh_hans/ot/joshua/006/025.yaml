base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/025.yaml
  text: But Joshua kept Rahab the prostitute alive[a], along with her father's household and all that belonged to her, and she has lived in the midst of Israel to this day[b], because she hid the messengers whom Joshua sent to spy out Jericho.
translation:
  language: zh_hans
  text: '约书亚却保全了妓女喇合、她父亲一家，以及她所有的一切[a]。她一直住在以色列中间，直到今日，因为她藏起了约书亚派去窥探耶利哥的使者。


    [a] 原文范围较宽，可包括属于她的人和财物。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文范围较宽，可包括属于她的人和财物。
    reason: preserve_ambiguity
lexical_decisions:
- source_word: הַזּוֹנָה
  choice: 妓女
  rationale: זוֹנָה指从事卖淫的女子；“妓女”是现代汉语中直接、清楚且不古奥的对应词。
- source_word: בֵּית אָבִיהָ
  choice: 她父亲一家
  rationale: 字面为“她父亲的家”，此处指以父亲为中心的家庭成员，而非房屋建筑。
- source_word: כָּל אֲשֶׁר לָהּ
  choice: 她所有的一切[a]
  rationale: 原文表述宽泛，可能涵盖属于她的人与财物；译文避免将范围限定为其中一类。
- source_word: הֶחֱיָה
  choice: 保全了
  rationale: חיה的使役形在此表示使其存活、免于被杀；“保全”自然传达这一语境意义，同时可统摄后列的家庭及所有之物。
- source_word: וַתֵּשֶׁב
  choice: 她一直住在
  rationale: 结合“直到今日”，表示从过去延续到叙述者当下的居住状态；“一直住在”清楚体现持续性。
- source_word: בְּקֶרֶב יִשְׂרָאֵל
  choice: 在以色列中间
  rationale: 较贴近希伯来语表达，并保留“以色列”既可指群体也可指共同体的措辞。
- source_word: הֶחְבִּיאָה
  choice: 藏起了
  rationale: 准确表达使役形在此处的隐藏、藏匿之意，现代汉语自然。
- source_word: הַמַּלְאָכִים
  choice: 使者
  rationale: מַלְאָכִים本义为受差遣的人；后文“派去窥探”已说明他们执行侦察任务，无须直接改译为“探子”。
- source_word: לְרַגֵּל
  choice: 去窥探
  rationale: רגל在此指秘密侦察；“窥探”符合敌城侦察的语境，也保留其隐秘意味。
theological_decisions:
- issue: 喇合被纳入以色列共同体的叙事表述
  choice: 她一直住在以色列中间，直到今日
  alternative: 她一直住在以色列人当中，直到今日
  rationale: 保留原文“以色列中间”的群体性表达及持续至叙述者当下的时间视角，不进一步推断她在群体中的法律、盟约或神学身份。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“却”承接前文耶利哥遭毁的对比；句子分为保全与持续居住两层，以符合现代汉语节奏，同时不改变因果关系。
