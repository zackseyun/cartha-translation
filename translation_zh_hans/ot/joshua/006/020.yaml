- from: 百姓就呼喊起来，祭司也吹响号角。百姓一听见号角声，就大声呼喊，城墙便原地坍塌了[a]。百姓各人从自己面前直上城里[b]，攻取了城。
  to: 百姓就呼喊，祭司吹响号角。百姓一听见号角声，就发出一声大喊，城墙便在原处倒塌了[a]。百姓各人都径直上去，进入城中[b]，攻取了那城。
  rationale: 修订仅处理中文表达和疑难短语的注释方式：将不通顺的“从自己面前直上城里”改为自然、准确的“各人都径直上去，进入城中”；将城墙倒塌译为“在原处倒塌”，同时在脚注中保留原文异常的空间表达及其不确定性；并删除“也”的非必要语气。其余关键术语与叙事力度均予保留。
