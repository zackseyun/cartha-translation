  text: וַ/יָּ֣רַע הָ/עָ֔ם וַֽ/יִּתְקְע֖וּ בַּ/שֹּֽׁפָר֑וֹת וַ/יְהִי֩ כִ/שְׁמֹ֨עַ הָ/עָ֜ם אֶת ק֣וֹל הַ/שּׁוֹפָ֗ר וַ/יָּרִ֤יעוּ הָ/עָם֙ תְּרוּעָ֣ה גְדוֹלָ֔ה וַ/תִּפֹּ֨ל הַֽ/חוֹמָ֜ה תַּחְתֶּ֗י/הָ וַ/יַּ֨עַל הָ/עָ֤ם הָ/עִ֨ירָ/ה֙ אִ֣ישׁ נֶגְדּ֔/וֹ וַֽ/יִּלְכְּד֖וּ אֶת הָ/עִֽיר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/020.yaml
  text: So the people shouted[a], and they blew the trumpets. And when the people heard the sound of the trumpet, the people shouted a great shout, and the wall fell down beneath it, and the people went up into the city, each man straight before him[b], and they captured the city.
translation:
  language: zh_hans
  text: 百姓就呼喊，祭司吹响号角。百姓一听见号角声，就发出一声大喊，城墙便在原处倒塌了[a]。百姓各人都径直上去，进入城中[b]，攻取了那城。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译近于“城墙倒在它自身之下”，措辞不寻常；也可译作“城墙倒塌在原处”或“城墙倒塌下去”。这可能描写城墙在原处向下坍塌。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“各人向他前面上去”，指每个人都径直向前进入城中。
    reason: clarification
lexical_decisions:
- source_word: וַיָּרַע / וַיָּרִיעוּ / תְּרוּעָה
  choice: 呼喊起来 / 大声呼喊
  rationale: 词根 רוע 及名词 תְּרוּעָה 表示高声呼喊，常见于战争或礼仪场景。译作“呼喊”保留核心意义，又不把经文本身未明说的“战斗呐喊”强加进去；第二处用“大声”体现 גְּדוֹלָה 的加强语气。
- source_word: שׁוֹפָרוֹת / שׁוֹפָר
  choice: 号角
  rationale: שׁוֹפָר 是用于发出信号的角制吹奏器。“号角”在现代汉语中自然清楚，也不武断限定为公羊角。
- source_word: קֹול הַשּׁוֹפָר
  choice: 号角声
  rationale: קֹול 用于乐器时意为其声音；“号角声”简洁、自然，并贴合原文。
- source_word: וַתִּפֹּל הַחוֹמָה תַּחְתֶּיהָ
  choice: 城墙便原地坍塌了
  rationale: 原文直译近于“城墙倒在它下面”，表达罕见，似指城墙垂直倒塌或在原处塌下。“原地坍塌”在汉语中可懂，同时尽量保留这种空间意象；脚注说明字面表达及另一可能译法。
- source_word: וַיַּעַל ... הָעִירָה
  choice: 直上城里
  rationale: עלה 的基本意义是“上去”，עִירָה 的方向词尾表示向城而去；结合城墙已经坍塌的语境，“上城里”传达进入城中的行动。
- source_word: אִישׁ נֶגְדּוֹ
  choice: 各人从自己面前直上
  rationale: אִישׁ 在此作分配用法，נֶגְדּוֹ 指各人正前方。汉语“各人从自己面前直上”保留逐人、就地向前推进的图景，且比机械保留阳性代词更自然。
- source_word: וַיִּלְכְּדוּ
  choice: 攻取
  rationale: לכד 在军事叙事中指夺取或占领城邑。“攻取”既准确体现军事语境，也符合庄重叙事文体。
theological_decisions:
- issue: אִישׁ נֶגְדּוֹ 的阳性分配表达
  choice: 各人从自己面前直上
  alternative: 各个男人都从自己面前直上
  rationale: 希伯来语 אִישׁ 可表示“各人”，在这里重点是分配性行动，即每个人从其所在位置正面进入。现代汉语用“各人”能保留这一意义；直译为“各个男人”虽凸显语法阳性，却显得笨重，并可能让性别成为原句并未强调的焦点。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。保留原文连续推进的节奏，并用“祭司”补明前文语境中吹号者；“原地坍塌”兼顾希伯来语异常表达与中文可读性。
