base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/005.yaml
  text: And when the ram's horn is drawn out[a], when you hear the sound of the trumpet, all the people shall raise a great shout, and the wall of the city will fall beneath itself, and the people shall go up[c][b], each man straight before him.
translation:
  language: zh_hans
  text: 当羊角号拉长吹响时[a]，你们听见号角声时，全体百姓都要放声大喊；城墙必会原地倒塌[b]，百姓就要上去，各人径直向前[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“当羊角号吹出长音时”或“当羊角号的长音响起时”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译为“城墙必落在它自己下面”，可能是说城墙会直直向下塌陷。
    reason: lexical_alternative
  - marker: c
    text: 或译“各人直向自己前方”，即每个人都从正前方上去。
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּמְשֹׁךְ בְּקֶרֶן הַיּוֹבֵל
  choice: 当羊角号声拖长时
  rationale: מָשַׁךְ在这一乐器用语中指把号声延长；“号声拖长”既保留原文“拉长、延长”的意象，又符合现代汉语表达。יוֹבֵל在此指公羊或公羊角制成的号，并非后来的“禧年”术语。
- source_word: ק֣וֹל הַשּׁוֹפָר
  choice: 号角声
  rationale: שׁוֹפָר指以角制成的号；“号角声”自然传达קוֹל所指的声音，也避免不必要的音译。
- source_word: יָרִיעוּ כָל הָעָם תְּרוּעָה גְדוֹלָה
  choice: 全体百姓就要大声呼喊
  rationale: 动词与同根名词连用，表达发出响亮的呼喊；汉语用“大声呼喊”自然再现其强调语气，而不把它限定为解释性较强的“战吼”。
- source_word: וְנָפְלָה חוֹמַת הָעִיר תַּחְתֶּיהָ
  choice: 城墙必原地塌下
  rationale: תַּחְתֶּיהָ字面为“在它自己下面”，所描绘的是城墙向下倒塌；“原地塌下”在现代汉语中清楚自然，同时由脚注保留字面形象。
- source_word: וְעָלוּ
  choice: 就要上去
  rationale: עלה的基本意义是“上去”；围城语境可能包含攻入或冲上的意味，但正文不额外强化军事动作，以免过度解释。
- source_word: אִישׁ נֶגְדּוֹ
  choice: 各人径直向前
  rationale: אִישׁ在此具逐一分配意义，נֶגְדּוֹ指各人正对着自己的前方；此译保留每个人直向前进的空间图景，又比逐字译法自然。
