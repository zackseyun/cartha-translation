  text: וַ/יְהִי֙ בַּ/פַּ֣עַם הַ/שְּׁבִיעִ֔ית תָּקְע֥וּ הַ/כֹּהֲנִ֖ים בַּ/שּׁוֹפָר֑וֹת וַ/יֹּ֨אמֶר יְהוֹשֻׁ֤עַ אֶל הָ/עָם֙ הָרִ֔יעוּ כִּֽי נָתַ֧ן יְהוָ֛ה לָ/כֶ֖ם אֶת הָ/עִֽיר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/016.yaml
  text: And it happened at the seventh time[a], when the priests blew the trumpets, that Joshua said to the people, “Shout, for Yahweh has given you the city.”
translation:
  language: zh_hans
  text: 第七次，祭司吹响号角时，约书亚对百姓说：“呼喊吧！因为雅威已经把这城交给你们了。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: （不单独译出）
  rationale: 这是希伯来叙事中承接下一事件的常用形式；现代汉语以时间从句自然表达其推进作用，无须生硬译作“事情发生了”。
- source_word: בַּפַּעַם הַשְּׁבִיעִית
  choice: 第七次
  rationale: פַּעַם在此指重复行动中的第七回；上下文说明是第七次绕城，正文保留原句简洁说法。
- source_word: תָּקְעוּ
  choice: 吹响
  rationale: תָּקַע与号角连用，表示吹奏或使其发声；“吹响”符合现代汉语习惯。
- source_word: שׁוֹפָרוֹת
  choice: 号角
  rationale: שׁוֹפָר指用角制成的吹奏器；“号角”比泛称“号”或现代乐器意义的“喇叭”更贴近原文，也不额外断定材质必为公羊角。
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: 直接引语前אָמַר的常规、自然译法。
- source_word: הָרִיעוּ
  choice: 呼喊吧
  rationale: 该命令要求百姓发出响亮喊声，可带争战或欢呼色彩；“呼喊”保留其语境张力，不把它限定为“欢呼”或“发出战吼”。
- source_word: כִּי
  choice: 因为
  rationale: 引出呼喊的理由，现代汉语用“因为”清楚自然。
- source_word: נָתַן
  choice: 已经……交给
  rationale: 完成式把尚待攻取的城说成雅威已经赐下，表达神所应许之事的确定性；“交给”在城邑与争战语境中自然。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代中文常见音译呈现四字神名，不以称号替代专名。
- source_word: הָעִיר
  choice: 这城
  rationale: 定冠词所指为上下文中的耶利哥；汉语用“这城”自然表达其特指性，同时不在正文中重复城名。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；“雅威”以专名形式保留其作用，避免用称号替代，也不采用历史上较传统但语音依据较弱的“耶和华”。
- issue: נָתַן完成式的时间与语气
  choice: 已经把这城交给你们了
  alternative: 将把这城交给你们；把这城赐给了你们
  rationale: 保留希伯来完成式所表达的既成、确定视角；即使城尚未实际陷落，约书亚仍以神已成就此事来宣告，不把这种张力改成单纯将来时。
- issue: הָרִיעוּ所指喊声的性质
  choice: 呼喊吧
  alternative: 欢呼吧；发出战吼吧
  rationale: 词语在此可包含争战呐喊或得胜欢呼；采用较宽的“呼喊”以保留语义范围，不预先限定为其中一种。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。以“第七次……时”承接事件，避免仿古的“到了第七次，事情就发生了”。“号角”保留古代角制吹奏器的意味；“呼喊”保留战吼与欢呼之间的语义开放性。
