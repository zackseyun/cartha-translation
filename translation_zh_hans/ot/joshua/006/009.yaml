base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/009.yaml
  text: And the armed men were going before the priests who were blowing the trumpets[a], and the rear guard was going behind the ark, while they kept blowing the trumpets.
translation:
  language: zh_hans
  text: 武装人员走在吹号角[a]的祭司前面，后卫走在约柜后面；一路行进，号角不住地吹响。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文 shofar，指用角制成的号角，常译作“羊角号”。
    reason: 说明 שׁוֹפָר 指角制号角，而非通常意义上的现代金属号；“羊角号”保留为常见而非排他的译法。
lexical_decisions:
- source_word: הֶחָלוּץ
  choice: 带兵器的人
  rationale: 该词在本节指走在队伍前列的武装人员。“带兵器的人”既保留其军事含义，也比抽象的“先锋队”更贴近原文的集合性称谓。
- source_word: הֹלֵךְ
  choice: 走在
  rationale: 分词表达行列行进中的持续动作；汉语用“走在”自然呈现其位置和进行状态。
- source_word: לִפְנֵי
  choice: 前面
  rationale: 这里表示队伍中的空间次序。
- source_word: הַכֹּהֲנִים
  choice: 祭司
  rationale: 采用该词在礼仪和叙事语境中的标准译法。
- source_word: תקעו הַשּׁוֹפָרוֹת
  choice: 吹号角
  rationale: 按上下文理解为祭司持续吹奏号角；“吹号角”直接保留动作及器物，不将号角泛化为现代铜管乐器。
- source_word: הַמְאַסֵּף
  choice: 后卫
  rationale: 指行军队列后方负责殿后的队伍；“后卫”简洁地表达其军事职能。
- source_word: אַחֲרֵי
  choice: 后面
  rationale: 此处为描述行列次序的空间用法。
- source_word: הָאָרוֹן
  choice: 约柜
  rationale: 原文仅作“柜”，但上下文明确指耶和华的约柜；现代汉语中“约柜”可避免被误解为普通箱柜。
- source_word: הָלוֹךְ וְתָקוֹעַ
  choice: 一路行进，不住地吹
  rationale: 原文结构表达行进和吹角的延续。译文用无明示主语的表达，既自然呈现持续动作，也避免替原文过度限定最后一语的施事者。
- source_word: בַּשּׁוֹפָרוֹת
  choice: 吹号角
  rationale: 与前半节保持一致，并通过脚注说明器物的具体性质。
