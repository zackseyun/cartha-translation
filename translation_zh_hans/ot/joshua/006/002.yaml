  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל יְהוֹשֻׁ֔עַ רְאֵה֙ נָתַ֣תִּי בְ/יָֽדְ/ךָ֔ אֶת יְרִיח֖וֹ וְ/אֶת מַלְכָּ֑/הּ גִּבּוֹרֵ֖י הֶ/חָֽיִל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/002.yaml
  text: And Yahweh said to Joshua[a], “See, I have given Jericho into your hand, along with its king and the mighty men of valor.”
translation:
  language: zh_hans
  text: 耶和华对约书亚说：“看哪，我已经把耶利哥、耶利哥的王和勇猛的战士[a]交在你手中。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“大能的勇士”“英勇的战士”。希伯来语这一短语兼有力量、勇气和军事才能等含义。
    reason: 词义有多个相近层面，单一中文措辞难以完全呈现。
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经传统中广为人知的专名译法，明确保留以色列上帝的专名，不以“主”代替。
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: 希伯来语叙事中的连续式推进情节；中文以“说”自然承接上文，无须机械译出连接词。
- source_word: רְאֵה
  choice: 看哪
  rationale: 作为引起注意的命令语，既保留直接语气，也以庄重而通行的现代中文表达。
- source_word: נָתַתִּי
  choice: 我已经把……交
  rationale: 保留完成式所表达的既成、确定视角；虽然战事尚未发生，上帝却把结果宣告为已经成就。
- source_word: בְיָדְךָ
  choice: 交在你手中
  rationale: 保留希伯来语“在手中”表示置于某人掌控之下的形象，同时符合现代中文习惯。
- source_word: יְרִיחוֹ
  choice: 耶利哥
  rationale: 采用该地名通行的现代中文译名。
- source_word: מַלְכָּהּ
  choice: 城中的王
  rationale: 阴性后缀指耶利哥城；中文不说“它的王”，改以“城中的王”自然明确地保留所指。
- source_word: גִּבּוֹרֵי הֶחָיִל
  choice: 英勇善战的勇士
  rationale: 兼顾 גִּבּוֹרֵי 的强有力战士含义，以及 חַיִל 所包含的勇武、战力与军事才干。
theological_decisions:
- issue: 战役发生以前 נָתַתִּי 完成式的效力
  choice: 译作“我已经把……交在你手中”
  alternative: 可译作“我要把……交在你手中”或“我正把……交在你手中”
  rationale: 原文从上帝说话的视角把胜利表述为已经确定的行动。保留完成式的张力，既呈现应许的确定性，又不额外解释其神学机制。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准普通话。“看哪”保留宣告语气；“交在你手中”保留原文意象。脚注标记紧随其所说明的短语。
