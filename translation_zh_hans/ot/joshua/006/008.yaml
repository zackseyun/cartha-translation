id: JOS.6.8
reference: Joshua 6:8
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יְהִ֗י כֶּ/אֱמֹ֣ר יְהוֹשֻׁעַ֮ אֶל הָ/עָם֒ וְ/שִׁבְעָ֣ה הַ/כֹּהֲנִ֡ים נֹשְׂאִים֩ שִׁבְעָ֨ה שׁוֹפְר֤וֹת הַ/יּֽוֹבְלִים֙ לִ/פְנֵ֣י יְהוָ֔ה עָבְר֕וּ וְ/תָקְע֖וּ בַּ/שּֽׁוֹפָר֑וֹת וַֽ/אֲרוֹן֙ בְּרִ֣ית יְהוָ֔ה הֹלֵ֖ךְ אַחֲרֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/008.yaml
  text: And it happened[a], when Joshua spoke to the people, that the seven priests carrying the seven ram's-horn trumpets before Yahweh passed on and blew the trumpets[b], and the ark of the covenant of Yahweh went behind them.
translation:
  language: zh_hans
  text: 约书亚对百姓说完以后，七位祭司拿着七支羊角号，在雅威面前[a]向前走，一边走一边吹号；雅威的约柜跟在他们后面。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在雅威面前”也可理解为“在雅威的临在中”。在这里，这很可能与后面提到的约柜有关。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כֶּאֱמֹר
  choice: ……说完以后
  rationale: כ 加不定式在此表示时间；结合祭司随后行动的叙事次序，译作“说完以后”自然表达前后关系。וַיְהִי 主要承担叙事推进功能，无须生硬另译为“事情发生了”。
- source_word: הָעָם
  choice: 百姓
  rationale: 指约书亚所吩咐的以色列会众，而非仅指军队。
- source_word: נֹשְׂאִים
  choice: 拿着
  rationale: 分词描述祭司携带号角；“拿着”符合现代汉语行进场景。
- source_word: שִׁבְעָה שׁוֹפְרוֹת הַיּוֹבְלִים
  choice: 七支羊角号
  rationale: שׁוֹפָר 是角制吹奏器，יוֹבֵל 在本段语境中很可能指公羊或羊角；“羊角号”兼顾器物来源和乐器功能。
- source_word: לִפְנֵי יְהוָה
  choice: 在雅威面前
  rationale: 保留“在……面前／临在中”的空间和礼仪含义，也与约柜所象征的雅威临在相呼应。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见音译呈现四字神名，保留其专名性质。
- source_word: עָבְרוּ
  choice: 向前走
  rationale: 此处指队伍继续前行，并非越过明确边界；“向前走”符合游行队列的语境。
- source_word: וְתָקְעוּ בַּשּׁוֹפָרוֹת
  choice: 一边走一边吹号
  rationale: תקע בְּשׁוֹפָר 表示吹响号角；汉语用“一边……一边……”自然表现前行与吹号相伴发生。
- source_word: אֲרוֹן בְּרִית יְהוָה
  choice: 雅威的约柜
  rationale: 紧凑而准确地表达“雅威之约的柜”，其中“约柜”是清楚且通行的汉语称谓。
- source_word: הֹלֵךְ אַחֲרֵיהֶם
  choice: 跟在他们后面
  rationale: 保留分词所描写的持续行进及 אַחֲרֵי 的空间位置。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；译作“雅威”保留其作为以色列之神专名的性质，不以称号替代。
- issue: לִפְנֵי יְהוָה 的含义
  choice: 在雅威面前
  alternative: 在雅威的临在中
  rationale: “在……面前”既保留原文的空间图景，也不排除礼仪上处于神临在中的含义，避免把两者强行拆开。
- issue: אֲרוֹן בְּרִית יְהוָה 的关系
  choice: 雅威的约柜
  alternative: 雅威之约的柜
  rationale: “约柜”在汉语中已能表达盛载盟约见证之柜；所属结构仍明确指出它属于雅威，不额外界定约的神学方向。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“七位祭司”“七支羊角号”使用恰当量词；以分号呈现祭司队伍和约柜之间的行进关系。脚注保留 לִפְנֵי 的空间与临在双重可能。
