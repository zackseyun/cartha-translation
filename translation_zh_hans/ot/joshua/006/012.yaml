  text: וַ/יַּשְׁכֵּ֥ם יְהוֹשֻׁ֖עַ בַּ/בֹּ֑קֶר וַ/יִּשְׂא֥וּ הַ/כֹּהֲנִ֖ים אֶת אֲר֥וֹן יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/012.yaml
  text: Joshua rose early in the morning[a], and the priests carried the ark of Yahweh.
translation:
  language: zh_hans
  text: 约书亚清早起来，祭司们抬起雅威[a]的约柜。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文为神的名字 יהוה（YHWH），传统上也译作“耶和华”。
    reason: 说明神名的原文形式及中文传统译法。
lexical_decisions:
- source_word: וַיַּשְׁכֵּם
  choice: 清早起来
  rationale: 使役词形在此按惯用义表示“早起”。“清早起来”自然明确，也保留原文对早晨行动的强调。
- source_word: יְהוֹשֻׁעַ
  choice: 约书亚
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: בַּבֹּקֶר
  choice: 清早
  rationale: 原义为“在早晨”。与前面的“早起”含义结合译作“清早起来”，既保留时间信息，也避免中文表达生硬重复。
- source_word: וַיִּשְׂאוּ
  choice: 抬着
  rationale: נשא 可表示举起、携带或负载。约柜由祭司共同搬运，中文用“抬着”比泛称“带着”更具体自然；未擅自补入原文没有的搬运器具。
- source_word: הַכֹּהֲנִים
  choice: 祭司们
  rationale: 准确表达带定冠词的复数名词；“们”使现代中文复数指称清楚自然。
- source_word: אֲרוֹן יְהוָה
  choice: 雅威的约柜
  rationale: 构词关系直译为神名所属的柜。אֲרוֹן 在本叙事中指立约之柜，采用中文通行称呼“约柜”。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来四字神名 YHWH 的常见学术拟音处理为专名“雅威”，不以称号替代；另以脚注说明中文传统译名。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用以色列之神的专名，而非“主”这一称号。正文采用较贴近通行学术拟音 Yahweh 的“雅威”，保留专名性质；脚注列出中文读者熟悉的传统译名，不将不同形式说成不同对象。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。“清早起来”整合两个彼此强化的时间表达；“抬着”贴合多人搬运约柜的具体场景。脚注标记紧随其所解释的“雅威”。
