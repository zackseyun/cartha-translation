base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/010.yaml
  text: And Joshua commanded the people[a], saying, “Do not shout, and do not let your voice be heard, and do not let a word go out from your mouth until the day I say to you[b], ‘Shout!’ Then you shall shout.”
translation:
  language: zh_hans
  text: 约书亚吩咐百姓说：“你们不可呼喊[a]，不可让你们的声音被听见，一句话也不可出口[b]，直到我对你们说‘呼喊！’的那一天；那时你们就要呼喊。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 按本节军事语境，也可译作“不可发出战斗呐喊”。
    reason: lexical_alternative
  - marker: b
    text: 原文直译：“不可有一句话从你们口中出来。”
    reason: lexical_alternative
lexical_decisions:
- source_word: צִוָּה
  choice: 吩咐
  rationale: 该动词表示带有权威的命令；“吩咐”在现代中文中自然、庄重，也保留上级向众人下令的语气。
- source_word: הָעָם
  choice: 百姓
  rationale: 原文使用通常表示“人民、百姓”的通用词，而非专指军队；虽处于军事情境，仍不宜窄化为“士兵”。
- source_word: לֹא תָרִיעוּ
  choice: 不可呼喊
  rationale: רוע 的使役式可指发出高声呼喊，常见于争战或欢庆；“呼喊”既自然，又不把语义限定为战斗呐喊。
- source_word: וְלֹא תַשְׁמִיעוּ אֶת קוֹלְכֶם
  choice: 不可让人听见你们的声音
  rationale: 使役式表达“使声音被听见”；此译法保留其使役含义，同时符合现代汉语表达。
- source_word: וְלֹא יֵצֵא מִפִּיכֶם דָּבָר
  choice: 一句话也不可出口
  rationale: 原文直译为“不可有一句话从你们口中出来”。“一句话也不可出口”保留“口中出来”的意象，并使中文简洁自然。
- source_word: עַד יוֹם אָמְרִי אֲלֵיכֶם
  choice: 直到我对你们说……的那一天
  rationale: 保留原文具体的“那一天”，并将带第一人称后缀的不定式结构自然地译为时间从句。
- source_word: הָרִיעוּ
  choice: 呼喊！
  rationale: 与前面的同根动词采用同一译词，以显明禁令与后来命令之间的照应。
- source_word: וַהֲרִיעֹתֶם
  choice: 那时你们就要呼喊
  rationale: 连接词在引语命令之后具有承接、结果意味；“那时……就要”清楚表达命令生效的时序，并保留同根词的重复。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的命令语体。“不可”维持连续三项禁令的节奏；末句重复“呼喊”，对应希伯来文同一词根的反复。脚注标记均放在其实际说明的词句之后。
