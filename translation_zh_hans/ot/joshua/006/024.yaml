id: JOS.6.24
reference: Joshua 6:24
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/הָ/עִ֛יר שָׂרְפ֥וּ בָ/אֵ֖שׁ וְ/כָל אֲשֶׁר בָּ֑/הּ רַ֣ק הַ/כֶּ֣סֶף וְ/הַ/זָּהָ֗ב וּ/כְלֵ֤י הַ/נְּחֹ֨שֶׁת֙ וְ/הַ/בַּרְזֶ֔ל נָתְנ֖וּ אוֹצַ֥ר בֵּית יְהוָֽה־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/024.yaml
  text: And they burned the city with fire[a], and everything that was in it. Only the silver and the gold, and the articles of bronze and iron, they put into the treasury of the house of Yahweh.
translation:
  language: zh_hans
  text: 他们用火焚烧了那城和城里的一切；只有金银和铜铁器具[a]，他们放进了耶和华圣所的库房[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“铜铁器皿”。原文所用的词可泛指器具、用具或器皿。
    reason: 保留כְּלֵי的词义范围，不把这些物品限定为某一种器物。
  - marker: b
    text: “耶和华圣所”直译为“耶和华的家”。
    reason: 说明בֵּית יְהוָה的字面表达，并避免正文使用“殿”所可能造成的时代误解。
lexical_decisions:
- source_word: שָׂרְפוּ בָאֵשׁ
  choice: 用火焚烧了
  rationale: שָׂרְפוּ是主动复数形式，意为“他们焚烧”；בָאֵשׁ在这里表示手段，译作“用火”自然且贴近原文。
- source_word: וְכָל אֲשֶׁר בָּהּ
  choice: 和城里的一切
  rationale: 这一表达概括城中所有人和物；“城里的一切”保留其全面性，也避免擅自限定所指。
- source_word: רַק
  choice: 只有
  rationale: רַק引出未被焚毁而另行处置的例外；“只有”简洁地呈现这一转折。
- source_word: הַכֶּסֶף וְהַזָּהָב
  choice: 金银
  rationale: 现代汉语中“金银”是自然、庄重的并列表达，完整传达定指的金与银。
- source_word: וּכְלֵי הַנְּחֹשֶׁת וְהַבַּרְזֶל
  choice: 铜铁器具
  rationale: כְּלֵי可泛指器皿、用具或各类物件，因此用范围较宽的“器具”，并以脚注保留可能译作“器皿”的词义。נְחֹשֶׁת在此泛指铜质或青铜质材料，简译“铜”可避免过度确定合金成分。
- source_word: נָתְנוּ
  choice: 放进了
  rationale: נתן本义宽泛；在把贵重金属存入库房的语境中，“放进”准确而自然。
- source_word: אוֹצַר
  choice: 库房
  rationale: אוֹצָר在这里指存放献归圣所之贵重物品的地方；“库房”比“财宝”更符合地点含义。
- source_word: בֵּית יְהוָה
  choice: 耶和华圣所
  rationale: 原文直译为“耶和华的家”。在约书亚时代，译作“圣所”可表达敬拜场所而不让读者误以为所罗门圣殿已经建成；脚注保留原文的“家”这一表达。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 采用现代简体中文读者最熟悉的专名“耶和华”，明确呈现经文中的盟约之名，而不以“主”替代。
- issue: 金属物品的归属与去向
  choice: 放进了耶和华圣所的库房
  alternative: 交给耶和华圣所的库房
  rationale: 原文明确说这些物品被置于与耶和华敬拜场所有关的库房中；译文不额外说明其后用途，也不把动作解释成献祭。
- issue: בֵּית יְהוָה在历史语境中的表达
  choice: 耶和华圣所
  alternative: 耶和华的家／耶和华的殿
  rationale: “圣所”既体现该处的宗教性质，又避免“殿”可能带来的固定圣殿建筑联想；同时以脚注注明原文直译，保留其隐喻。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“焚烧”“库房”保持叙事的正式感；语序以“只有……他们……”略微保留希伯来文先提出例外物品、再陈述处置动作的结构。所有脚注标记均已置于对应正文词语之后。
