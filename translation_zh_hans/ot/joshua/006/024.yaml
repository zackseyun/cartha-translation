  terminology: “耶和华”一致呈现神名；“铜铁器具”恰当地保留כְּלֵי的广泛指称，脚注提供“器皿”这一可行替代而不误作正文限定；“圣所的库房”正确反映库藏属于耶和华敬拜场所的关系。脚注锚点均附于相应词语之后，内容与原文相符。
