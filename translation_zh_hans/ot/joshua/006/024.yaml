  source_fidelity: 译文准确传达了希伯来文的主要语义：全城及其中一切被焚烧，金、银以及铜铁制器具例外，并被存入与耶和华敬拜场所有关的库房。“用火焚烧”“城里的一切”“只有”“放进”等表达均与原文结构和语义相符。将בֵּית יְהוָה译为“耶和华圣所”，并以脚注说明其字面义为“耶和华的家”，在不使用可能带来所罗门时期固定圣殿联想的“殿”的同时，保留了原文的敬拜场所含义。
