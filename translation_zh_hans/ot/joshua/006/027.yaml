  yaml_path: translation/ot/joshua/006/027.yaml
  text: And Yahweh was with Joshua[a], and his fame was in all the land.
translation:
  language: zh_hans
  text: 耶和华与约书亚同在；约书亚的名声[a]传遍了全境。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“有关他的消息”“他的传闻”或“他的声誉”。希伯来语可指传闻、消息或名声；这里很可能是说约书亚的声望日益传开。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的专名“耶和华”译出四字神名，避免以“主”这一称号替代原文专名。
- source_word: וַיְהִי יְהוָה אֶת יְהוֹשֻׁעַ
  choice: 耶和华与约书亚同在
  rationale: היה 与 אֶת 加人名在此表示临在、相伴；“与……同在”自然且准确，并保留本节的神学表达。
- source_word: שָׁמְעוֹ
  choice: 约书亚的名声
  rationale: שֵׁמַע 可指传闻、消息或声誉；上下文强调攻取耶利哥后约书亚广为人知，正文采用“名声”，脚注保留其他可能。重复人名可消除中文代词可能指向耶和华的歧义。
- source_word: בְּכָל הָאָרֶץ
  choice: 传遍了那一带
  rationale: הָאָרֶץ 在叙事语境中指当时所述之地，而非全世界；中文“那一带”自然表达当地范围，动词“传遍”也符合“名声”扩散的搭配。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: “耶和华”是现代简体中文普通读者最熟悉的专名形式，既保留神的专名，也不以称号“主”取代；“雅威”则更接近学术界常见的拟音。
- issue: “他的名声”所指对象
  choice: 明确译为“约书亚的名声”
  alternative: 译作“他的名声”
  rationale: 希伯来语阳性单数后缀按上下文指约书亚；中文若直译“他的”，紧接“耶和华”后可能产生错误指代，因此明示约书亚，但不改变原意。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“同在”保留经文常用且易懂的神学措辞；分号体现原文两个并列叙事分句。
