  text: And seven priests shall carry seven ram’s-horn trumpets before the ark. On the seventh day you shall march around the city seven times[a], and the priests shall blow the trumpets.
translation:
  language: zh_hans
  text: 七名祭司要在约柜前携带七支羊角号[a]。第七天，你们要绕城七次，祭司要吹响号角。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “羊角号”或可译作“公羊角制成的号”。希伯来语所指的是角制吹奏乐器，很可能由公羊角制成。
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשְׂאוּ
  choice: 拿着
  rationale: נשא在此指携带具体器物；“拿着”是现代汉语中自然、清楚的表达。
- source_word: שׁוֹפְרוֹת הַיּוֹבְלִים
  choice: 羊角号
  rationale: שׁוֹפָר指角制号器，相关限定语在这里说明号角的种类；“羊角号”兼顾其材质来源和乐器功能，也避免译作“禧年号”所造成的误解。
- source_word: לִפְנֵי הָאָרוֹן
  choice: 走在约柜前面
  rationale: לִפְנֵי表示空间上的“在……前面”；结合祭司携号行进的场景，补出“走在”使中文自然，但不增添“立约”等本节未明说的限定。
- source_word: תָּסֹבּוּ אֶת הָעִיר
  choice: 你们要绕城
  rationale: סבב表示绕行、环绕；“绕城”简洁自然，并保留命令式将来语气。
- source_word: פְּעָמִים
  choice: 次
  rationale: 与数词及重复动作连用时，פְּעָמִים自然译为量词“次”。
- source_word: יִתְקְעוּ בַּשּׁוֹפָרוֹת
  choice: 要吹响号角
  rationale: תקע与שׁוֹפָר连用是吹号的惯用表达；后文用“号角”承接前面的“羊角号”，避免生硬重复。
