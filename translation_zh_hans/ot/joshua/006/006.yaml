  text: וַ/יִּקְרָ֞א יְהוֹשֻׁ֤עַ בִּן נוּן֙ אֶל הַ/כֹּ֣הֲנִ֔ים וַ/יֹּ֣אמֶר אֲלֵ/הֶ֔ם שְׂא֖וּ אֶת אֲר֣וֹן הַ/בְּרִ֑ית וְ/שִׁבְעָ֣ה כֹֽהֲנִ֗ים יִשְׂאוּ֙ שִׁבְעָ֤ה שֽׁוֹפְרוֹת֙ יוֹבְלִ֔ים לִ/פְנֵ֖י אֲר֥וֹן יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/006.yaml
  text: So Joshua son of Nun called the priests and said to them[a], “Carry the ark of the covenant[b], and let seven priests carry seven ram’s-horn trumpets before the ark of Yahweh.”
translation:
  language: zh_hans
  text: 于是，嫩的儿子约书亚召来祭司，对他们说：“你们抬约柜；七名祭司要拿着七支公羊角号[a]，走在雅威的约柜前面。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“七支羊角号”。
    reason: 保留 שׁוֹפְרוֹת יוֹבְלִים 的较宽泛译法；正文“公羊角号”明确表达 יוֹבְלִים 所指的公羊角。
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: 召来
  rationale: 此处是约书亚召集祭司并向他们发令；“召来”既表达呼唤，也符合叙事语境，不强化为正式征召。
- source_word: אֲרוֹן הַבְּרִית
  choice: 约柜
  rationale: 这是现代中文圣经语境中自然、简洁且准确的固定表达，指承载盟约法版的柜。
- source_word: שְׂאוּ
  choice: 抬
  rationale: נשׂא在此指搬运约柜；“抬”符合多人搬运约柜的具体情景。
- source_word: וְשִׁבְעָה כֹהֲנִים יִשְׂאוּ
  choice: 要有七名祭司拿着
  rationale: 未完成式承接命令，具有指令意味；“要有……拿着”在现代中文中自然地保留这一命令语气。
- source_word: שִׁבְעָה שׁוֹפְרוֹת יוֹבְלִים
  choice: 七支羊角号
  rationale: שׁוֹפָר指角制的号，יוֹבְלִים在此进一步说明为羊角；“羊角号”简洁清楚，并在脚注保留更显明的材质表达。
- source_word: לִפְנֵי
  choice: 走在……前面
  rationale: 在行进队列的语境中，单译“在……前面”略显静态；补出“走在”自然表达祭司位于约柜之前行进。
- source_word: יְהוָה
  choice: 雅威
  rationale: 原文直接使用四字神名；“雅威”按其通行学术读音音译，保留其作为上帝专名的性质。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文使用上帝的专名而非“主”的称号；正文采用“雅威”，以保留专名，并避免以称号取代或采用源于较晚元音组合的传统形式。
- issue: אֲרוֹן הַבְּרִית与אֲרוֹן יְהוָה的区分
  choice: 先译“约柜”，后译“雅威的约柜”
  alternative: 两处都统一译作“约柜”
  rationale: 保留原文在同一节中先称“约柜”、后称“雅威的约柜”的措辞变化，不将两种关系表达强行统一。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“于是”承接上文；直接引语中的分号区分两项相关命令。量词分别用“名”和“支”，符合现代汉语习惯。
