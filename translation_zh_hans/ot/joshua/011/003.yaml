base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/003.yaml
  text: the Canaanite in the east and in the west[a], and the Amorite, the Hittite, the Perizzite, and the Jebusite in the hill country, and the Hivite below Hermon in the land of Mizpah.
translation:
  language: zh_hans
  text: 还有东边和西边[a]的迦南人，山区的亚摩利人、赫人、比利洗人和耶布斯人，以及黑门山下米斯巴地区的希未人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“从东边和从海”；这里的“海”很可能是以地理方位指西边。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכְּנַעֲנִי
  choice: 迦南人
  rationale: 带定冠词的单数族名在此作集合用法；汉语族名本身不标单复数，可自然涵盖整个族群。
- source_word: מִמִּזְרָח וּמִיָּם
  choice: 东边和西边
  rationale: 介词短语在这份地域名单中表示方位范围；יָם字面为“海”，但在迦南地理语境中常指地中海所在的西方。
- source_word: הָאֱמֹרִי וְהַחִתִּי וְהַפְּרִזִּי וְהַיְבוּסִי
  choice: 亚摩利人、赫人、比利洗人和耶布斯人
  rationale: 这些单数族名均作集合用法；采用现代中文圣经读者较熟悉的族名形式。
- source_word: בָּהָר
  choice: 山区
  rationale: 这里指迦南的高地或山地地区，而非特指某一座山；“山区”自然且准确。
- source_word: הַחִוִּי
  choice: 希未人
  rationale: 单数族名作集合用法，按通行中文译名处理。
- source_word: תַּחַת חֶרְמוֹן
  choice: 黑门山下
  rationale: תַּחַת在此表达空间位置，即黑门山下方或山麓一带；补出“山”符合现代汉语地名表达。
- source_word: בְּאֶרֶץ הַמִּצְפָּה
  choice: 米斯巴地区
  rationale: אֶרֶץ在此指地域或领地；“地区”比直译“地”更符合现代汉语，同时将מִצְפָּה作为地名音译。
theological_decisions: []
