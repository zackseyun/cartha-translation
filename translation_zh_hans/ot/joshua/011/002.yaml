  text: and to the kings who were in the north[a], in the hill country, in the Arabah south of Kinneroth, in the lowland[b], and in the heights of Dor toward the west.
translation:
  language: zh_hans
  text: 又传信给北方的诸王，即住在山区、基尼烈以南的亚拉巴、低地，以及西边[b]多珥高地[a]的诸王。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“多珥各区”、“多珥境内”或“多珥山坡”。这里的希伯来词并不常见，其确切的地形含义尚有争议。
    reason: lexical_alternative
  - marker: b
    text: 字面意思是“从海”；在希伯来语的地理表达中，这通常指“西边”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶל הַמְּלָכִים
  choice: 又传信给……诸王
  rationale: 介词短语承接上一节中耶宾派人传信的动作；为使本节单独阅读时仍自然，补出汉语语境中隐含的动作“传信”，并以“又”表达连接和追加。
- source_word: אֲשֶׁר מִצְּפוֹן
  choice: 北方的
  rationale: 该短语从地域上界定这些王；“北方的”简洁自然，也不强行限定为居住地或来源地。
- source_word: בָּהָר
  choice: 山区
  rationale: הַר在《约书亚记》的地域列表中可指山地或丘陵山区；“山区”比单指某座“山”更符合这里的区域含义。
- source_word: וּבָעֲרָבָה
  choice: 亚拉巴
  rationale: 保留这一特定地理区域的名称，避免用泛称“平原”抹去其专名性质。
- source_word: נֶגֶב כִּנֲרוֹת
  choice: 基尼烈以南
  rationale: נֶגֶב在这里表示相对于基尼烈的南方方位，而不是专指犹大南地；“以南”准确而清楚。
- source_word: וּבַשְּׁפֵלָה
  choice: 低地
  rationale: שְׁפֵלָה指较低的丘陵或低地区域；“低地”既保留地貌含义，也便于普通读者理解。
- source_word: וּבְנָפוֹת דּוֹר
  choice: 多珥高地
  rationale: נָפוֹת在此罕见且地形意义有争议；正文采用有古代译本与语境支持的“高地”，同时在脚注保留“地区、境内、山坡”等可能解释。
- source_word: מִיָּם
  choice: 西边
  rationale: יָם字面为“海”，在希伯来地理表述中常因地中海位于西方而表示“西边”；正文采用方向义，脚注注明字面表达。
