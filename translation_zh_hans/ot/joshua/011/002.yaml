  register: 采用现代、庄重而易懂的叙事语言。“又传信给”承接上一节的动作，使本节在中文中不至于成为残缺的介词短语；地名使用常见圣经音译。脚注标记分别紧随其所解释的“多珥高地”和“西边”。
