base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/017.yaml
  text: from Mount Halak[a], which rises toward Seir, as far as Baal-gad in the Valley of Lebanon below Mount Hermon[b]. And he captured all their kings and struck them down and put them to death.
translation:
  language: zh_hans
  text: 他所攻取的地域，从向西珥延伸的哈拉山[a]，直到黑门山下的黎巴嫩谷中、巴力迦得[b]。他擒获了其中所有的王，把他们击倒，并处死他们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“光滑的山”。希伯来语可理解为对山的描述，但在这里很可能是地名“哈拉山”。
    reason: lexical_alternative
  - marker: b
    text: “黎巴嫩谷”或译“黎巴嫩平原”。希伯来语这个词可指宽阔的谷地或平原。
    reason: lexical_alternative
lexical_decisions:
- source_word: הָהָר הֶחָלָק
  choice: 哈拉山
  rationale: 此处位于征服范围的地理概述中，较可能是地名；采用音译，并以脚注保留“光滑的山”这一描述性理解。
- source_word: הָעֹלֶה שֵׂעִיר
  choice: 向西珥延伸
  rationale: 分词 עלה 在此描写山地朝西珥方向上升或伸展；“向……延伸”较自然地表达地形走向，同时避免误解为山本身正在移动。
- source_word: וְעַד
  choice: 直到
  rationale: 清楚表达所征服地域的范围终点。
- source_word: בַּעַל גָּד
  choice: 巴力·迦得
  rationale: 作为地名音译；间隔号使复合地名的两个成分清晰可辨。
- source_word: בְּבִקְעַת הַלְּבָנוֹן
  choice: 黎巴嫩谷中
  rationale: בִּקְעָה 可指宽阔的谷地或平原；正文采用自然的“谷”，脚注保留“平原”这一可能译法。
- source_word: תַּחַת הַר חֶרְמוֹן
  choice: 黑门山下
  rationale: 准确表达相对于黑门山较低的位置，符合现代汉语地理表述。
- source_word: וְאֵת כָּל מַלְכֵיהֶם
  choice: 那些地方所有的王
  rationale: 代词所指是前述各地或各族；汉语补出“那些地方”以使指代自然，并保留“所有”的整体性。
- source_word: לָכַד
  choice: 擒获
  rationale: 对象是诸王，“擒获”准确表达军事行动中将人俘获。
- source_word: וַיַּכֵּם
  choice: 将他们击倒
  rationale: 保留 נכה 的击打、击倒之意，不提前把它弱化为“击败”，也不与随后明确的处死动作合并。
- source_word: וַיְמִיתֵם
  choice: 处死了他们
  rationale: 使役形式明确表示使其死亡；“处死”保留行动的明确性与最终性，并与前一动词区分。
