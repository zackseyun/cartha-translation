  text: וַ/יֹּ֨אמֶר יְהוָ֣ה אֶל יְהוֹשֻׁעַ֮ אַל תִּירָ֣א מִ/פְּנֵי/הֶם֒ כִּֽי מָחָ֞ר כָּ/עֵ֣ת הַ/זֹּ֗את אָנֹכִ֞י נֹתֵ֧ן אֶת כֻּלָּ֛/ם חֲלָלִ֖ים לִ/פְנֵ֣י יִשְׂרָאֵ֑ל אֶת סוּסֵי/הֶ֣ם תְּעַקֵּ֔ר וְ/אֶת מַרְכְּבֹתֵי/הֶ֖ם תִּשְׂרֹ֥ף בָּ/אֵֽשׁ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/006.yaml
  text: And Yahweh said to Joshua[a], “Do not fear them, for tomorrow at this time I am giving all of them over before Israel as slain men[b]. You shall hamstring their horses and burn their chariots with fire.”
translation:
  language: zh_hans
  text: 雅威对约书亚说：“不要怕他们，因为明天这个时候[a]，我要使他们全都在以色列人面前成为被杀的人[b]。你要砍断他们战马的腿筋，用火焚烧他们的战车。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“明天大约这个时候”。
    reason: 希伯来语כָּעֵת הַזֹּאת可理解为“这个时候”，也可带“大约这个时候”的意味。
  - marker: b
    text: 希伯来文直译：“我要把他们全都作为被杀的人交在以色列面前”，意思是把他们交出来，让以色列人击杀。
    reason: 说明נֹתֵן与חֲלָלִים לִפְנֵי יִשְׂרָאֵל的字面结构和语境含义，同时不在正文中消除其独特表达。
lexical_decisions:
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文专名音译，保留经文中的神名，不以称号代替。
- source_word: אַל תִּירָא מִפְּנֵיהֶם
  choice: 不要怕他们
  rationale: 以现代汉语自然表达“不要因他们而惧怕”，同时保持禁令的直接性。
- source_word: מָחָר כָּעֵת הַזֹּאת
  choice: 明天这个时候
  rationale: 准确表达次日同一时刻这一时间短语；כ־也容许“大约”之意，列入脚注。
- source_word: אָנֹכִי נֹתֵן
  choice: 我要使
  rationale: 结合下文“成为被杀的人”表达即将实现的神圣宣告；希伯来语分词带有鲜明、迫近的语气。
- source_word: אֶת כֻּלָּם חֲלָלִים לִפְנֵי יִשְׂרָאֵל
  choice: 使他们全都成为被杀的人，倒在以色列人面前
  rationale: 保留חֲלָלִים所指战场上被杀之人，并尽量呈现“在以色列面前”的空间性措辞。
- source_word: אֶת סוּסֵיהֶם תְּעַקֵּר
  choice: 砍断他们战马的腿筋
  rationale: 该动词在军事语境中指破坏马腿筋，使战马失去行动能力；“战马”明确此处军事用途。
- source_word: וְאֶת מַרְכְּבֹתֵיהֶם תִּשְׂרֹף בָּאֵשׁ
  choice: 用火焚烧他们的战车
  rationale: 保留原文明确出现的“用火”，并以庄重自然的汉语表达。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名；采用“雅威”音译，既保留其专名性质，也不以称号取代。
- issue: 神宣告敌军被杀的表达
  choice: 我要使他们全都成为被杀的人，倒在以色列人面前
  alternative: 我要把他们全都交给以色列人击杀
  rationale: 不将原文的结果性表述完全解释为“交给……击杀”，以保留“给予/使成为被杀者”这一简练而有张力的希伯来措辞；脚注说明其语境含义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“被杀的人”保留战场语义；“砍断……腿筋”比笼统的“使……残废”更具体。脚注标记[a]、[b]均置于正文相应位置。
