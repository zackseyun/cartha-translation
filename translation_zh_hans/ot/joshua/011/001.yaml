  yaml_path: translation/ot/joshua/011/001.yaml
  text: When Jabin king of Hazor heard of it[a], he sent to Jobab king of Madon, and to the king of Shimron[c][b], and to the king of Achshaph.
translation:
  language: zh_hans
  text: 夏琐王耶宾听见这事后[a]，就派人去见玛顿王约巴、伸仑王[b]和押煞王。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文的叙事引介结构可较直译为“当夏琐王耶宾听见时”。原文只说“听见”；“这事”是根据上文补出的。
    reason: lexical_alternative
  - marker: b
    text: 有些人认为这里的“伸仑”就是约书亚记12:20所说的“伸仑米仑”；本节希伯来文只作“伸仑”。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי כִּשְׁמֹעַ
  choice: 听见这事
  rationale: וַיְהִי配合כִּ加不定式构成叙事中的时间背景。现代汉语可自然译为“……听见……”，不必生硬保留“事情发生了”。原文只说“听见”，所听见的内容承接上文，因此译作“这事”并用脚注说明。
- source_word: יָבִין מֶלֶךְ חָצוֹר
  choice: 夏琐王耶宾
  rationale: 按现代汉语表达习惯，将地名、王号和人名组成“夏琐王耶宾”，准确体现原文的同位关系。
- source_word: וַיִּשְׁלַח אֶל
  choice: 就派人去见
  rationale: שׁלח与אֶל连用表示“派往／差去见”。原文未明说所派的是使者；“派人去见”是自然汉语所需的最少补足，且不把所传信息具体化。
- source_word: יוֹבָב מֶלֶךְ מָדוֹן
  choice: 玛顿王约巴
  rationale: 依汉语惯例采用“地名＋王＋人名”的顺序，同时保留原文全部信息。
- source_word: שִׁמְרוֹן
  choice: 伸仑
  rationale: 按希伯来语形式音译；本节马所拉文本仅作“伸仑”，不在正文中扩写为“伸仑米仑”。
- source_word: אַכְשָׁף
  choice: 押煞
  rationale: 按希伯来语地名音译，并采用适合中文圣经语体的简洁形式。
