base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/016.yaml
  text: 'So Joshua took all this land: the hill country[a], all the Negev, all the land of Goshen, the lowland, the Arabah, the hill country of Israel[c][b], and its lowland.'
translation:
  language: zh_hans
  text: 约书亚取得了这整片土地：山区、整个南地、歌珊全地[c]、低地[a]、亚拉巴[b]、以色列山区和它的低地。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “低地”或译“示非拉”，指中央高地与沿海平原之间的低丘地区；本节末尾的“低地”也是同一个希伯来词。
    reason: lexical_alternative
  - marker: b
    text: “亚拉巴”是一个地区名称；也有译本按语境译作“约旦河谷”或“旷野平原”。
    reason: lexical_alternative
  - marker: c
    text: 这里的“歌珊地”指迦南的一处地区，并不一定是埃及的歌珊。
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּקַּח
  choice: 夺取了
  rationale: לקח本义为“取、拿”，在征服总结的语境中带有以军事行动取得土地的含义；“夺取了”在现代汉语中自然明确，又不额外引入“完全占领”等更强含义。
- source_word: כָּל הָאָרֶץ הַזֹּאת
  choice: 这一带所有的土地
  rationale: 保留כָּל和指示词הַזֹּאת的范围与指示作用；“这一带”自然引出随后列举的各地理区域。
- source_word: הָהָר
  choice: 山区
  rationale: 此处不是指一座山，而是作为区域名称使用，指中央高地；“山区”简洁而符合现代汉语地理表达。
- source_word: הַנֶּגֶב
  choice: 南地
  rationale: נֶגֶב在此是特定南部区域的名称；采用圣经地理中清楚而通行的“南地”，避免仅译作方向性的“南方”。
- source_word: אֶרֶץ הַגֹּשֶׁן
  choice: 歌珊全地
  rationale: 按构造关系直译为歌珊之地，并以“全地”承接原文重复的כָּל；不在正文中断定它与埃及歌珊的关系。
- source_word: הַשְּׁפֵלָה
  choice: 低地
  rationale: שְׁפֵלָה指中央高地与沿海平原之间的低丘地带；“低地”正文易懂，脚注补充其较具体的地理含义。
- source_word: הָעֲרָבָה
  choice: 亚拉巴
  rationale: 该词在此是区域性地理名称；音译能保留其专名性质，避免将范围过早限定为“约旦河谷”。
- source_word: הַר יִשְׂרָאֵל
  choice: 以色列山区
  rationale: הַר在此仍为区域意义；“以色列山区”保留所属结构，且与前面的“山区”保持一致。
- source_word: וּשְׁפֵלָתוֹ
  choice: 和它的低地
  rationale: 保留第三人称阳性单数后缀的指代形式，使其自然回指“以色列山区”，也保留高地与低地的地形对应。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。地理通名尽量意译，已具有专名性质的“南地”和“亚拉巴”予以保留。原英文咨询层的脚注标记位置存在错配：关于歌珊的说明未正确落在正文对应处；本稿从希伯来原文出发，只保留对理解本节确有帮助且能与正文标记准确对应的注释。
