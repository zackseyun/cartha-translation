  text: כַּ/אֲשֶׁ֨ר צִוָּ֤ה יְהוָה֙ אֶת מֹשֶׁ֣ה עַבְדּ֔/וֹ כֵּן צִוָּ֥ה מֹשֶׁ֖ה אֶת יְהוֹשֻׁ֑עַ וְ/כֵן֙ עָשָׂ֣ה יְהוֹשֻׁ֔עַ לֹֽא הֵסִ֣יר דָּבָ֔ר מִ/כֹּ֛ל אֲשֶׁר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/015.yaml
  text: Just as Yahweh had commanded Moses his servant[a], so Moses commanded Joshua, and so Joshua did. He left nothing undone of all that Yahweh had commanded Moses.
translation:
  language: zh_hans
  text: 雅威怎样吩咐他的仆人摩西，摩西也照样吩咐约书亚；约书亚也照样做了。凡雅威吩咐摩西的，约书亚没有漏掉一件[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“凡雅威吩咐摩西的，约书亚没有一件未做。”希伯来文直译为“他没有从雅威吩咐摩西的一切中除去一件事”。
    reason: 说明希伯来语惯用表达的字面形式，并保留“未省略命令内容”与“没有留下未做之事”之间的语义幅度。
lexical_decisions:
- source_word: כַּאֲשֶׁר
  choice: 怎样
  rationale: 与后面的“也照样”配合，清楚表达雅威吩咐摩西、摩西吩咐约书亚之间的对应关系，符合现代汉语习惯。
- source_word: צִוָּה
  choice: 吩咐
  rationale: 表达带有权威的命令，同时在叙事语体中自然庄重；三次出现均保持一致。
- source_word: יְהוָה
  choice: 雅威
  rationale: 直接音译四字神名，保留经文中的专名，而不以称号替代。
- source_word: עַבְדּוֹ
  choice: 他的仆人
  rationale: עבד在此是对摩西身份的尊称；“仆人”既保留从属与服事之意，也避免不当地突出奴役含义。
- source_word: כֵּן
  choice: 也照样
  rationale: 保留原文两次出现所形成的对应和递进：摩西照雅威的吩咐转达，约书亚也照样实行。
- source_word: עָשָׂה
  choice: 做了
  rationale: 保留原文动词的简洁和宽泛含义，由下一句进一步说明约书亚执行得完全。
- source_word: לֹא הֵסִיר דָּבָר
  choice: 没有漏掉一件
  rationale: 以自然汉语表达“没有从整体中除去任何一项”的惯用含义，同时借脚注保留希伯来文的字面意象及另一种可能译法。
- source_word: מִכֹּל אֲשֶׁר
  choice: 凡……的
  rationale: 概括雅威吩咐摩西的全部内容，体现原文所强调的完整范围。
- source_word: אֶת
  choice: 不另译
  rationale: 这是希伯来语直接宾语标记，在汉语中没有独立对应词。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文使用四字神名；“雅威”较直接地按现有学术重构音译该专名，不以“主”等称号替代。
- issue: 约书亚完全顺服的表述
  choice: 没有漏掉一件
  alternative: 没有一件未做
  rationale: 前者较贴近“没有除去任何一件”的希伯来语措辞，也可指命令内容没有被省略；后者则更明确解释为所有行动都已完成。正文保留较宽的表达，脚注列出执行层面的译法，以免过早消除语义张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“怎样……也照样……”保留原文重复形成的命令传递链；末句重复“约书亚”以避免现代汉语中代词指向不清。
