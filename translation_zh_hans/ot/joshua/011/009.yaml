base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/009.yaml
  text: 'And Joshua did to them just as Yahweh had told him: he hamstrung their horses and burned their chariots with fire[a].'
translation:
  language: zh_hans
  text: 约书亚就照着雅威对他所说的那样对待他们：砍断他们马的腿筋[a]，又用火焚烧他们的战车。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译为“使他们的马残废”；希伯来语动词更具体地指割断马腿部的筋腱。
    reason: 说明 עִקֵּר 所指的具体动作，并提供较概括的替代译法。
lexical_decisions:
- source_word: וַיַּעַשׂ לָהֶם
  choice: 处置了他们
  rationale: עשה + ל 在这里表示对他们采取行动；结合后文的军事行动，“处置了他们”自然地保留了这一指向，而不含“为他们做事”的受益意味。
- source_word: כַּאֲשֶׁר אָמַר לוֹ
  choice: 照着……对他说的
  rationale: 保留 כַּאֲשֶׁר 的比较、遵照意味，同时贴近 אָמַר לוֹ 的字面表达，不将其过度明确化为“命令”。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见音译呈现四字神名，保留其作为以色列之神专名的性质，而不以称号替代。
- source_word: סוּסֵיהֶם
  choice: 他们的马
  rationale: 准确表达复数名词及其第三人称复数所属关系。
- source_word: עִקֵּר
  choice: 砍断……的腿筋
  rationale: 该动词在此具体指割断马腿部的筋腱，使马失去军事用途；此译法比笼统的“使残废”更准确，也比生僻术语更易懂。
- source_word: מַרְכְּבֹתֵיהֶם
  choice: 他们的战车
  rationale: “战车”准确传达古代军事语境中的 מַרְכָּבָה，并保留所属关系。
- source_word: שָׂרַף בָּאֵשׁ
  choice: 用火焚烧
  rationale: 保留希伯来文明确出现的“用火”，同时使用庄重而自然的现代汉语表达。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”按其较通行的学术重建发音音译，保留专名性质。
- issue: כַּאֲשֶׁר אָמַר לוֹ 是否译作命令用语
  choice: 照着雅威对他说的
  alternative: 照着雅威吩咐他的
  rationale: 上下文确有神圣指示的含义，但本节动词本身是“说”；正文保留较宽泛的措辞，避免把语义无提示地收窄为正式命令。
translation_notes:
  register: 采用庄重、清晰的现代标准汉语。“处置了他们”承接原文的概括句，冒号后的两个动作加以说明；“又”自然连接并列动作。脚注标记紧随其所解释的短语。
