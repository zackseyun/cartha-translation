  text: לֹֽא נוֹתַ֣ר עֲנָקִ֔ים בְּ/אֶ֖רֶץ בְּנֵ֣י יִשְׂרָאֵ֑ל רַ֗ק בְּ/עַזָּ֛ה בְּ/גַ֥ת וּ/בְ/אַשְׁדּ֖וֹד נִשְׁאָֽרוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/022.yaml
  text: No Anakim were left in the land of the sons of Israel[a]; only in Gaza, Gath[b], and Ashdod did some remain.
translation:
  language: zh_hans
  text: 在以色列人[a]的土地上，一个亚衲人也没有留下；只有在迦萨、迦特和亚实突还有一些亚衲人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“以色列众子的土地”。
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא נוֹתַר
  choice: 一个……也没有留下
  rationale: 否定词与单数集合性谓语共同表达彻底否定；此译法自然地保留了 נוֹתַר 的被动、结果性含义，即战事之后没有任何亚衲人被留下。
- source_word: עֲנָקִים
  choice: 亚衲人
  rationale: 这是族群名称。采用中文圣经传统中通行的音译“亚衲”，并加“人”明确其所指为该族群。
- source_word: בְּאֶרֶץ בְּנֵי יִשְׂרָאֵל
  choice: 在以色列人的土地上
  rationale: בְּנֵי יִשְׂרָאֵל 字面为“以色列的众子”，在这里是以色列民族的常规称呼；译作“以色列人”符合现代汉语习惯，脚注保留其字面形式。
- source_word: רַק
  choice: 只有
  rationale: 准确表达限制和例外，引出仍有亚衲人存留的三个地方。
- source_word: בְּעַזָּה בְּגַת וּבְאַשְׁדּוֹד
  choice: 在迦萨、迦特和亚实突
  rationale: 采用这些地名通行的中文音译；希伯来文重复的介词在汉语并列结构中只需表达一次。
- source_word: נִשְׁאָרוּ
  choice: 还有一些亚衲人
  rationale: 复数动词的隐含主语仍是前文的亚衲人；补出“一些亚衲人”使现代汉语表意清楚，同时不超出原文“仍有余民存留”的含义。
theological_decisions: []
translation_notes:
  register: 采用自然、庄重的现代标准汉语。分号呈现原文前后“无人留下”与“三地仍有人存留”的鲜明对照；末句复现“亚衲人”，避免汉语中主语含混。
