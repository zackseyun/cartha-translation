id: JOS.11.19
reference: Joshua 11:19
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: לֹֽא הָיְתָ֣ה עִ֗יר אֲשֶׁ֤ר הִשְׁלִ֨ימָה֙ אֶל בְּנֵ֣י יִשְׂרָאֵ֔ל בִּלְתִּ֥י הַ/חִוִּ֖י יֹשְׁבֵ֣י גִבְע֑וֹן אֶת הַ/כֹּ֖ל לָקְח֥וּ בַ/מִּלְחָמָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/019.yaml
  text: There was not a city that made peace with the sons of Israel[a], except the Hivites living in Gibeon[b]; they took all of them in battle.
translation:
  language: zh_hans
  text: 没有一座城与以色列人讲和[a]，只有住在基遍的希未人例外；其余各城都是以色列人在争战中攻取的[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语直译为“与以色列的众子讲和”，即“与以色列人讲和”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来语较直译为“他们在争战中取了全部”。主语也可按原文含蓄地译作“他们”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הִשְׁלִימָה אֶל
  choice: 与……讲和
  rationale: 使役词形在此表示建立和平关系；“讲和”自然、明确，又不把含义过度限定为“投降”。介词 אֶל 随汉语搭配译为“与”。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 希伯来语直译为“以色列的儿子们”，在此是民族称谓；现代汉语用“以色列人”更自然，也不误导为仅指某位父亲的亲生儿子。
- source_word: בִּלְתִּי
  choice: 只有……例外
  rationale: 清楚表达前面否定陈述中的唯一例外。
- source_word: הַחִוִּי יֹשְׁבֵי גִבְעוֹן
  choice: 住在基遍的希未人
  rationale: 保留 יֹשְׁבֵי 的居住含义，并采用自然的现代汉语定语结构。
- source_word: אֶת הַכֹּל
  choice: 其余各城
  rationale: הַכֹּל 本义为“全部”；结合上文的“城”和唯一例外，汉语显明其所指为其余各城，但以脚注保留较字面的可能表达。
- source_word: לָקְחוּ
  choice: 攻取
  rationale: לקח 基本义为“拿取”，在军事语境中“攻取”既自然又准确，且与 בַמִּלְחָמָה 相配。
- source_word: בַמִּלְחָמָה
  choice: 在争战中
  rationale: 表达这些城是通过战争而取得；“争战”符合庄重经文语体，同时现代读者容易理解。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而清楚的叙事语体。“以色列人”按汉语民族称谓处理；末句补明“其余各城”和“以色列人”，使原文省略的指代在汉语中清晰，同时用脚注交代较字面的表达。
