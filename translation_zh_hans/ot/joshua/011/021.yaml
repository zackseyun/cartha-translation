  text: וַ/יָּבֹ֨א יְהוֹשֻׁ֜עַ בָּ/עֵ֣ת הַ/הִ֗יא וַ/יַּכְרֵ֤ת אֶת הָֽ/עֲנָקִים֙ מִן הָ/הָ֤ר מִן חֶבְרוֹן֙ מִן דְּבִ֣ר מִן עֲנָ֔ב וּ/מִ/כֹּל֙ הַ֣ר יְהוּדָ֔ה וּ/מִ/כֹּ֖ל הַ֣ר יִשְׂרָאֵ֑ל עִם עָרֵי/הֶ֖ם הֶחֱרִימָ֥/ם יְהוֹשֻֽׁעַ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/021.yaml
  text: At that time Joshua came and cut off the Anakim from the hill country—from Hebron[a], from Debir, from Anab, and from all the hill country of Judah and from all the hill country of Israel. Joshua devoted them to destruction, together with their cities.
translation:
  language: zh_hans
  text: 那时，约书亚来到，将亚衲族人从山区，就是从希伯仑、底璧、亚拿伯，以及从犹大和以色列的所有山区剪除。约书亚把他们和他们的城邑一并彻底毁灭了[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“置于禁毁之下。”这个希伯来语动词指把人或物列为当毁灭之物。
    reason: 保留חרם的较形式化译法及其专门语义，避免正文使用现代读者难以立即理解的术语。
lexical_decisions:
- source_word: וַיָּבֹא
  choice: 前去
  rationale: בוא在连续叙事中可依叙述视角表示“来”或“去”。本句描述约书亚采取军事行动，用“前去”符合现代汉语叙事，也不额外指定其出发地。
- source_word: בָּעֵת הַהִיא
  choice: 那时
  rationale: 准确、自然地表达标准时间短语，并保留与上文的叙事衔接。
- source_word: וַיַּכְרֵת
  choice: 剪除
  rationale: כרת的基本意象是“砍断、剪除”，在此指从该地区除灭一个族群；“剪除”保留希伯来语意象，并与后文较具专门含义的חרם有所区别。
- source_word: הָעֲנָקִים
  choice: 亚衲族人
  rationale: 采用现代中文可辨识的音译，并加“族人”明确这是一个族群，而不是地名。
- source_word: מִן הָהָר
  choice: 从山区
  rationale: הָהָר在《约书亚记》的地理语境中通常指高地或山地地区，而非一座单独的山；“山区”自然简明。
- source_word: מִן חֶבְרוֹן מִן דְּבִר מִן עֲנָב
  choice: 从希伯仑、底璧、亚拿伯
  rationale: 三者均按地名音译；保留“从”所支配的地点清单，同时避免汉语中不必要的逐项重复。
- source_word: וּמִכֹּל הַר יְהוּדָה
  choice: 以及犹大全山区
  rationale: 表达与犹大相关的整个高地区域；“全山区”对应כֹּל与地理意义的הַר。
- source_word: וּמִכֹּל הַר יִשְׂרָאֵל
  choice: 和以色列全山区
  rationale: 保留“以色列”这一原文地域称谓，不解释性地改成“以色列人的山区”或限定为北部。
- source_word: עִם עָרֵיהֶם
  choice: 连同他们的城邑
  rationale: עִם表示伴随；“城邑”既可涵盖设防城市和较小聚落，也符合庄重的历史叙事语体。
- source_word: הֶחֱרִימָם
  choice: 把他们……一并彻底毁灭了
  rationale: חרם的使役式在征战语境中指把对象置于禁毁之下、交付毁灭。“彻底毁灭”在正文中清楚自然；脚注保留其更专门的祭仪—战争语义。
theological_decisions:
- issue: חרם征战术语的译法
  choice: 约书亚把他们连同他们的城邑一并彻底毁灭了
  alternative: 约书亚把他们连同他们的城邑一并置于禁毁之下
  rationale: 本节先用כרת，再用חרם。正文分别译作“剪除”和“彻底毁灭”，避免把两个动词完全抹平；同时以脚注说明חרם并非仅泛指杀戮，而带有将人或物置于禁令之下、交付毁灭的专门含义。该处理不在正文中加入超出原文的教义解释。
translation_notes:
  register: 采用现代、庄重而清楚的叙事汉语。“剪除”保留原文意象，“彻底毁灭”清楚表达行动结果；地名使用通行的简体中文圣经音译。脚注标记紧随其实际注释对象，而不沿用英文咨询层中置于“Hebron”后的错位标记。
