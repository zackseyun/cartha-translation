base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/004.yaml
  text: They came out[a], they and all their camps with them, a great people, as numerous as the sand that is on the seashore[b], with very many horses and chariots.
translation:
  language: zh_hans
  text: 他们和他们所有的军队[a]都出动了；人数众多[b]，多如海边的沙；战马和战车也极多。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “军队”直译为“他们所有的营队”；希伯来词也可指营地或营寨，并可转指驻扎其中的军队。
    reason: lexical_alternative
  - marker: b
    text: 直译为“许多的人”或“一个大群人”；这里指人数庞大。
    reason: literal_rendering
lexical_decisions:
- source_word: וַיֵּצְאוּ
  choice: 他们出动了
  rationale: יצא在此叙事和军事语境中表示出来、出发。“出动”自然表达各王联军采取行动，同时不具体断定行进方向。
- source_word: מַחֲנֵיהֶם
  choice: 他们的全军
  rationale: מַחֲנֶה本义可指营地，也可转指驻扎其中的军队。此处众王及其各营一同出动，译作“全军”符合现代汉语军事叙事；脚注保留“营队”的具体意象。
- source_word: עַם רָב
  choice: 人数众多
  rationale: 短语直指一大群人，后接海沙的比喻，重点在数量庞大。汉语用“人数众多”比直译“大民”自然。
- source_word: כַּחוֹל אֲשֶׁר עַל שְׂפַת הַיָּם לָרֹב
  choice: 多如海边的沙
  rationale: 保留希伯来文的海沙意象，并将לָרֹב所强调的数量繁多自然融入“多如”之中。
- source_word: סוּס
  choice: 战马
  rationale: 单数形式在此为集合用法；军事语境表明所指是军用马匹，现代汉语宜用复数含义的“战马”。
- source_word: רֶכֶב
  choice: 战车
  rationale: רֶכֶב可指战车或战车部队；与马并列时译作“战车”清楚自然，也不额外限定编制。
- source_word: רַב מְאֹד
  choice: 极多
  rationale: 准确保留数量上的强烈强调，并以简洁、庄重的现代汉语表达。
