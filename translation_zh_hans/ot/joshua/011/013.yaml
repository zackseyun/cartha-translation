  text: But Israel did not burn any of the cities that stood on their mounds[a], except Hazor alone; Joshua burned it.
translation:
  language: zh_hans
  text: 不过，以色列没有焚烧那些建在土丘上的城[a]；只有夏琐这一座，约书亚把它焚烧了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“那些立在各自土丘上的城”。这里的“土丘”指人们世代居住、反复建造而逐层形成的聚落遗址土丘。
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: 但
  rationale: 在此引出与前文所述焚城行动的对比，并领起随后唯一的例外；现代汉语用“但”自然清楚。
- source_word: כָּל הֶעָרִים
  choice: 那些……城
  rationale: 希伯来语全称表达受否定词支配；汉语译作“没有焚烧那些……城”表达这些城均未被烧毁，避免“没有焚烧所有的城”可能产生只烧了一部分的歧义。
- source_word: הָעֹמְדוֹת עַל תִּלָּם
  choice: 仍立在原有土丘上的
  rationale: 保留“立着”的分词意象，并将 תֵּל 译为普通读者易懂的“土丘”；“原有”表达其城址土丘的含义，具体考古背景置于脚注。
- source_word: לֹא שְׂרָפָם יִשְׂרָאֵל
  choice: 以色列没有焚烧
  rationale: 按自然汉语调整语序；宾语已经由前面的“那些……城”表达，无须另加代词。
- source_word: זוּלָתִי ... לְבַדָּהּ
  choice: 只有……这一座
  rationale: 两个成分共同突出夏琐是唯一例外；此译法既自然，也保留了排他强调。
- source_word: חָצוֹר
  choice: 夏琐
  rationale: 采用现代中文圣经传统中通行的地名译法。
- source_word: שָׂרַף יְהוֹשֻׁעַ
  choice: 约书亚把它焚烧了
  rationale: 保留原文重复使用“焚烧”所产生的强调，并以“它”明确回指夏琐。
