revisions:
- from: 雅威把他们交在以色列手中。以色列人击杀他们，追赶他们，直到大西顿、米斯利弗·玛音[a]和东边的米斯巴谷地。以色列击杀他们，直到没有给他们留下一个幸存者[b]。
  to: 雅威把他们交在以色列手中。以色列人击杀他们，追赶他们，直到大西顿，直到米斯利弗·玛音[a]，直到东边的米斯巴谷地。以色列[b]击杀他们，直至没有给他们留下一个幸存者。
  rationale: 修正三处地点的并列追击句式，使之对应原文重复的“直到”并符合现代汉语。将脚注b锚定在末句的“以色列”，使其实际说明的单数动词与脚注位置一致；正文仍以集合意义的“以色列”表达而不排除约书亚作为可能所指。脚注a改为审慎的词源提示。
