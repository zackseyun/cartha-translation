source:
  edition: WLC
  text: וַ/יִּתְּנֵ֨/ם יְהוָ֥ה בְּ/יַֽד יִשְׂרָאֵל֮ וַ/יַּכּוּ/ם֒ וַֽ/יִּרְדְּפ֞וּ/ם עַד צִיד֣וֹן רַבָּ֗ה וְ/עַד֙ מִשְׂרְפ֣וֹת מַ֔יִם וְ/עַד בִּקְעַ֥ת מִצְפֶּ֖ה מִזְרָ֑חָ/ה וַ/יַּכֻּ֕/ם עַד בִּלְתִּ֥י הִשְׁאִֽיר לָ/הֶ֖ם שָׂרִֽיד־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/008.yaml
  text: And Yahweh gave them into the hand of Israel[a], and they struck them down and pursued them as far as Great Sidon and as far as Misrephoth-maim and as far as the Valley of Mizpeh to the east[b]; and they struck them down until they had left them no survivor.
translation:
  language: zh_hans
  text: 雅威把他们交在以色列手中。以色列人击杀他们，追赶他们，直到大西顿，直到米斯利弗·玛音[a]，直到东边的米斯巴谷地。以色列[b]击杀他们，直至没有给他们留下一个幸存者。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “米斯利弗·玛音”是地名；这个希伯来名称可能与“水的焚烧”有关。
    reason: lexical_alternative
  - marker: b
    text: 原文此处“击杀”是单数形式；主语可能是作为整体的“以色列”，也可能指约书亚。
    reason: source_ambiguity
lexical_decisions:
- source_word: וַיִּתְּנֵם ... בְּיַד יִשְׂרָאֵל
  choice: 把他们交在以色列手中
  rationale: נתן与“在……手中”连用，在战争语境中表示把敌人交由对方掌控；译文保留“手中”的原文意象，同时用“交在”表达其军事含义。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文四字神名YHWH的通行现代汉语音译处理，不以称号替代专名。
- source_word: וַיַּכּוּם
  choice: 击杀他们
  rationale: נכה在战事语境中表示击打、杀伤或击败；结合本节最后“没有……幸存者”，译作“击杀”更准确地传达这里的致命军事行动。
- source_word: וַיִּרְדְּפוּם
  choice: 追赶他们
  rationale: רדף是追击敌军的常用动词，“追赶”自然直接。
- source_word: צִידוֹן רַבָּה
  choice: 大西顿
  rationale: רבה修饰西顿，译作“大西顿”，简洁保留地名结构。
- source_word: מִשְׂרְפוֹת מַיִם
  choice: 米斯利弗·玛音
  rationale: 上下文表明这是地名，正文采用音译；其字面含义可能与“水的焚烧”有关，另以脚注说明。
- source_word: בִּקְעַת מִצְפֶּה מִזְרָחָה
  choice: 东边的米斯巴谷地
  rationale: בקעה指宽阔谷地或谷地平原；מזרחה在此标示方位，译作“东边的”符合现代汉语表达。
- source_word: וַיַּכֻּם
  choice: 以色列击杀他们
  rationale: 此处动词为单数形式；正文用可作集合主体的“以色列”，既顺应上文，又不强行指定约书亚为主语。
- source_word: עַד בִּלְתִּי הִשְׁאִיר לָהֶם שָׂרִיד
  choice: 直到没有给他们留下一个幸存者
  rationale: 该结构表示不留下任何存活者；“一个幸存者”自然传达שריד在此处的具体含义。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名，故以现代汉语音译“雅威”保留其专名性质，不用称号“主”替换；也不采用源于Jehovah传统形式的“耶和华”。
- issue: 末句单数动词的主语
  choice: 以集合意义的“以色列”为正文主语，并用脚注保留歧义
  alternative: 明确译作“约书亚击杀他们”
  rationale: 希伯来文末次“击杀”为单数，但未明说主语；它可以指作为整体的以色列，也可能指约书亚。正文不应擅自排除其中一种理解。
translation_notes:
  register: 采用庄重而清晰的现代标准汉语。保留战争叙事中“交在……手中”的手部意象和“击杀”的力度；地名以易读音译为主。分为三句以避免希伯来文长串并列结构在汉语中显得拖沓，同时保留行动次序与末句的主语歧义。
