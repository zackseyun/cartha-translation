  terminology: “雅威”“以色列”“大西顿”“米斯利弗·玛音”“米斯巴谷地”均可保留。“击杀”在本段歼灭性战事语境中恰当。地名字面义的脚注可稍作审慎表述，避免把可能的词源解释说得过于确定。
