source:
  edition: WLC
  text: כִּ֣י מֵ/אֵ֣ת יְהוָ֣ה הָיְתָ֡ה לְ/חַזֵּ֣ק אֶת לִבָּ/ם֩ לִ/קְרַ֨את הַ/מִּלְחָמָ֤ה אֶת יִשְׂרָאֵל֙ לְמַ֣עַן הַֽחֲרִימָ֔/ם לְ/בִלְתִּ֥י הֱיוֹת לָ/הֶ֖ם תְּחִנָּ֑ה כִּ֚י לְמַ֣עַן הַשְׁמִידָ֔/ם כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה׀־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/020.yaml
  text: For it was from Yahweh to harden their hearts to meet Israel in battle[a], so that he might devote them to destruction, so that there would be no mercy for them, but so that he might destroy them[c][b], just as Yahweh had commanded Moses.
translation:
  language: zh_hans
  text: 因为，是耶和华使他们的心刚硬，来与以色列交战[a]，为要将他们交付毁灭[b]，使他们不得蒙怜悯[c]，反倒将他们消灭，正如耶和华所吩咐摩西的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “使他们的心刚硬”也可译作“使他们的心强硬起来”。这里指使他们坚决敌对以色列。
    reason: lexical_alternative
  - marker: b
    text: “交付毁灭”所译的希伯来语是一个专门用语，指把人或物置于禁令之下，归于毁灭；也可译作“彻底毁灭”或“置于禁令之下”。
    reason: lexical_alternative
  - marker: c
    text: 也可译作“使他们无人为之求情”或“使他们得不到恩待”。希伯来语的表达很简练，既可涉及恳求怜悯，也可涉及怜悯的给予。
    reason: alternative_reading
lexical_decisions:
- source_word: מֵאֵת יְהוָה
  choice: 是出于耶和华
  rationale: מֵאֵת 表明来源；“是出于……”自然保留了此意，并明确保留耶和华的主动作用。
- source_word: לְחַזֵּק אֶת לִבָּם
  choice: 使他们的心刚硬
  rationale: חזק 的基本义为“使坚强”，但在本句敌对和受审判的语境中，指使其顽强、坚决地抗拒；“心刚硬”能表达该语境含义，脚注同时保留较字面的译法。
- source_word: לִקְרַאת הַמִּלְחָמָה אֶת יִשְׂרָאֵל
  choice: 出来与以色列交战
  rationale: לִקְרַאת 与战争用语连用，表示迎战或前来敌对交锋；此译简洁自然。
- source_word: לְמַעַן הַחֲרִימָם
  choice: 为要把他们列为当灭之物
  rationale: חרם 的使役形在这里是把人置于禁令之下、归于毁灭的审判性专门用语。“列为当灭之物”保留这一技术含义，而脚注说明其内涵。
- source_word: לְבִלְתִּי הֱיוֹת לָהֶם תְּחִנָּה
  choice: 使他们得不到怜悯
  rationale: תְּחִנָּה 可指恳求恩待，也可在此紧凑结构中指所求的恩待或怜悯。正文采用自然的结果表达，脚注保留“求情”和“恩待”的歧义。
- source_word: לְמַעַן הַשְׁמִידָם
  choice: 而将他们消灭
  rationale: שמד 表示毁灭、除灭；“消灭”在现代汉语中清楚有力。省略明说的主语，也保留希伯来语不显明施事者的表达。
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: 正如耶和华吩咐摩西的
  rationale: כַּאֲשֶׁר 表示与先前命令相符；此译符合汉语叙事表达。
theological_decisions:
- issue: 耶和华使迦南诸王的心刚硬
  choice: 明确译为“使他们的心刚硬……是出于耶和华”
  alternative: 耶和华任凭他们的心刚硬；耶和华容许他们顽固
  rationale: 希伯来文直接把这事的来源归于耶和华。译成单纯的许可会削弱原文所保留的神圣主权与人敌对行为之间的张力。
- issue: חרם 的审判性专门含义
  choice: 正文译作“列为当灭之物”
  alternative: 彻底毁灭；置于禁令之下
  rationale: 此译既表达实际毁灭，也尽量保留该词所含“置于禁令之下、归给毁灭”的特殊审判范畴。
- issue: 毁灭动作的施事者
  choice: 用汉语无主句“把他们……将他们……”保留含蓄表达
  alternative: 明确译作“耶和华把他们……”或“以色列把他们……”
  rationale: 两个希伯来语不定式并未重注明说主语；不擅自补出施事者，可避免消除原文的句法含蓄，同时上下文仍让读者看见耶和华的旨意和以色列的军事行动。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“心刚硬”“列为当灭之物”承载原文的神学与审判语义，均以脚注帮助普通读者理解；句式避免古奥，同时没有弱化原文对耶和华主动作用的直接陈述。
