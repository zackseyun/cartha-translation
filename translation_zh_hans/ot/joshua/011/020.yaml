revisions:
- from: '因为使他们的心刚硬，出来与以色列交战[a]，是出于耶和华；这是为要把他们列为当灭之物[b]，使他们得不到怜悯[c]，而将他们消灭，正如耶和华吩咐摩西的。


    [a] “使他们的心刚硬”也可译作“使他们的心强硬起来”。这里指使他们坚决敌对以色列。

    [b] “列为当灭之物”所译的希伯来语是一个专门用语，指把人或物置于禁令之下，献给毁灭；也可译作“彻底毁灭”。

    [c] 也可译作“使他们无人为之求情”或“使他们得不到恩待”。希伯来语的表达很简练，既可涉及恳求怜悯，也可涉及怜悯的给予。'
  to: 因为，是耶和华使他们的心刚硬，来与以色列交战[a]，为要将他们交付毁灭[b]，使他们不得蒙怜悯[c]，反倒将他们消灭，正如耶和华所吩咐摩西的。
  rationale: 仅将“列为当灭之物”改为“交付毁灭”，以更贴近חרם的动词性、审判性含义，并改善现代汉语自然度；相应更新脚注。其余译文忠实保留原文对耶和华主动作用的归属、目的结构及施事者未重复明说的句法特点。
