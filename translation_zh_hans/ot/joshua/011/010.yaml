base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/010.yaml
  text: At that time Joshua turned back and captured Hazor[a], and he struck its king with the sword[c][b], for formerly Hazor was the head of all these kingdoms.
translation:
  language: zh_hans
  text: 那时，约书亚转回[a]，攻取了夏琐，并用刀击打夏琐的王[b]；因为夏琐从前是所有这些王国之首[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“返回”。原文动词既可表示返回，也可表示转身往回走；正文采用“转回”，以保留战役行进中的方向意味。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“用刀击打夏琐的王”。在这里的战争语境中，这一说法很可能意味着将他杀死，但原文动词本身是“击打”。
    reason: lexical_alternative
  - marker: c
    text: 或译“是所有这些王国的首领”。原文直译为“是所有这些王国的头”，以“头”比喻首要地位。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: 转回
  rationale: שׁוב在此表示战役进程中的回转或返回。“转回”既自然，也保留了方向性的意味。
- source_word: בָּעֵת הַהִיא
  choice: 那时
  rationale: 这是常见的时间表达；“那时”简洁自然，不把所指时间过度限定为某一瞬间。
- source_word: וַיִּלְכֹּד
  choice: 攻取
  rationale: לכד用于军事语境时常指夺取城邑；“攻取”符合上下文，也具有庄重而通俗的叙事语体。
- source_word: חָצוֹר
  choice: 夏琐
  rationale: 采用现代中文圣经读者较熟悉的传统地名译法。
- source_word: מַלְכָּהּ
  choice: 夏琐王
  rationale: 原文为“它的王”，阴性后缀回指城邑夏琐。中文以“夏琐王”表达更自然，并清楚保留所属关系。
- source_word: הִכָּה בֶחָרֶב
  choice: 用刀击杀了
  rationale: נכה的基本义为“击打”，而“用刀击打”在此军事语境中指致死。中文“击杀”兼顾原词的击打意象与语境所含的死亡结果；脚注说明其较字面的表达。
- source_word: כִּי
  choice: 因为
  rationale: 引出解释夏琐为何具有重要地位的原因；“因为”在现代汉语中清楚自然。
- source_word: לְפָנִים
  choice: 从前
  rationale: 表示先前的状态；“从前”比“以前”略显庄重，又不陈旧。
- source_word: רֹאשׁ
  choice: 之首
  rationale: רֹאשׁ字面为“头”，在此比喻居首或具有首要地位。“之首”在中文中自然保留这一首位意象。
- source_word: כָּל הַמַּמְלָכוֹת הָאֵלֶּה
  choice: 这些王国
  rationale: 中文“这些王国”在此已自然涵盖原文כָּל的整体范围；若直译为“所有这些王国”则稍显累赘。
