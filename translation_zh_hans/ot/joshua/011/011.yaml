  text: וַ֠/יַּכּוּ אֶת כָּל הַ/נֶּ֨פֶשׁ אֲשֶׁר בָּ֤/הּ לְ/פִי חֶ֨רֶב֙ הַֽחֲרֵ֔ם לֹ֥א נוֹתַ֖ר כָּל נְשָׁמָ֑ה וְ/אֶת חָצ֖וֹר שָׂרַ֥ף בָּ/אֵֽשׁ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/011.yaml
  text: They struck down every person who was in it with the edge of the sword[a], devoting them to destruction; not a single breathing thing was left[c][b], and he burned Hazor with fire.
translation:
  language: zh_hans
  text: 他们用刀杀了城里所有的人，将他们尽行毁灭[a]；凡有气息的，一个也没有留下[b]。他用火焚烧了夏琐[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “尽行毁灭”所译的希伯来语 חרם，指把人或物置于禁毁之下，归于毁灭。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译为“没有留下任何气息”，意思是没有留下一个幸存者。
    reason: lexical_alternative
  - marker: c
    text: 原文先用复数“他们杀了”，这里转用单数“他烧了”；“他”很可能指约书亚。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּכּוּ
  choice: 他们……杀了
  rationale: נכה 的使役词干在战争语境中指击杀、杀死；现代汉语用“杀了”自然明确，也不弱化行动的结果。
- source_word: כָּל הַנֶּפֶשׁ אֲשֶׁר בָּהּ
  choice: 城里所有的人
  rationale: נֶפֶשׁ 在此指城中的人，并非特指非物质的“灵魂”；这一表达自然保留了全称范围。
- source_word: לְפִי חֶרֶב
  choice: 用刀
  rationale: 字面为“按刀剑之口”，是以刀剑杀戮的希伯来语惯用语；“用刀”是简洁自然的现代汉语对应。
- source_word: הַחֲרֵם
  choice: 把他们尽都毁灭
  rationale: חרם 在征服语境中表示将对象置于禁毁之下、彻底毁灭。“尽都毁灭”保留其全面性与严厉性；脚注补明其专门含义。
- source_word: לֹא נוֹתַר כָּל נְשָׁמָה
  choice: 没有留下一个有气息的
  rationale: נְשָׁמָה 与气息、呼吸有关。直译式表达保留原文意象，并传达无人存留的含义，而不擅自缩窄所指范围。
- source_word: חָצוֹר
  choice: 夏琐
  rationale: 采用现代中文圣经读者熟悉的地名译法。
- source_word: שָׂרַף בָּאֵשׁ
  choice: 放火烧了
  rationale: 自然表达“用火焚烧”的希伯来语搭配，同时保留单数主语所体现的叙事转换。
theological_decisions:
- issue: 征服语境中 חרם 的译法
  choice: 尽都毁灭
  alternative: 归于禁毁／置于禁令之下
  rationale: 正文采用普通读者能理解的表达，同时借脚注说明 חרם 不只是一般的军事杀戮，而有专门的“归于毁灭”含义；不额外加入特定宗派的神学解释。
- issue: 复数主语转为单数主语
  choice: 他们……；他又……
  alternative: 他们……；他们又……
  rationale: 原文由复数 וַיַּכּוּ 转为单数 שָׂרַף。正文保留转换，不将“他”直接解释成约书亚；脚注说明其可能所指，以保存原文的形式及一定程度的指代含混。
- issue: כָּל נְשָׁמָה 的范围
  choice: 一个有气息的
  alternative: 一个活人／一个幸存者
  rationale: 采用较贴近“气息”的表达，避免把原文在形式上可能较宽的范围无依据地限定为人，同时让上下文传达没有幸存者之意。
translation_notes:
  register: 采用庄重而清楚的现代标准普通话。“尽都毁灭”略带经文语体，以承载 חרם 的专门意味；“有气息的”刻意保留希伯来文意象。所有脚注标记均紧随相关正文内容。
