source:
  edition: WLC
  text: וַ/יִּקַּ֨ח יְהוֹשֻׁ֜עַ אֶת כָּל הָ/אָ֗רֶץ כְּ֠/כֹל אֲשֶׁ֨ר דִּבֶּ֣ר יְהוָה֮ אֶל מֹשֶׁה֒ וַ/יִּתְּנָ/הּ֩ יְהוֹשֻׁ֨עַ לְ/נַחֲלָ֧ה לְ/יִשְׂרָאֵ֛ל כְּ/מַחְלְקֹתָ֖/ם לְ/שִׁבְטֵי/הֶ֑ם וְ/הָ/אָ֥רֶץ שָׁקְטָ֖ה מִ/מִּלְחָמָֽה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/023.yaml
  text: So Joshua took all the land[a], according to all that Yahweh had spoken to Moses, and Joshua gave it to Israel as an inheritance according to their divisions by their tribes[b]. And the land had rest from war.
translation:
  language: zh_hans
  text: 于是，约书亚取得了全地[a]，正如耶和华对摩西所说的一切。约书亚把这地赐给以色列人作产业，照着他们各支派的划分。这地不再有战争[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“整个地区”。“全地”是对约书亚取得本段所述之地的总结，并非指整个世界。
    reason: 说明כָּל הָאָרֶץ在上下文中的所指，并保留其总结性的范围表达。
  - marker: b
    text: 或译“这地从战争中得享安宁”或“这地从战争中安歇”。希伯来文表达战事后的安静、安宁状态。
    reason: 说明שָׁקְטָה מִמִּלְחָמָה的状态义，避免将其理解为对未来绝无任何冲突的断言。
lexical_decisions:
- source_word: וַיִּקַּח
  choice: 夺取了
  rationale: לקח的基本义是“取、拿”；在征服叙事的总结中，“夺取”自然体现军事语境，但不扩展为完全占领每一处。
- source_word: כָּל הָאָרֶץ
  choice: 全地
  rationale: 指上下文所谈的应许之地，而非整个世界；保留希伯来文总结性的范围表述及其与后文未得之地之间的张力。
- source_word: כְּכֹל אֲשֶׁר דִּבֶּר
  choice: 正如……所说的一切
  rationale: 表达行动与耶和华先前所说之话完全相符；现代汉语自然，同时保留“所有、一切”的力度。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代简体中文圣经语境中对四字神名的通行音译，以名字而非称号呈现。
- source_word: וַיִּתְּנָהּ
  choice: 把这地赐给
  rationale: 阴性单数后缀回指“地”；“赐给”既保留נתן的给予义，也符合产业由上帝应许、经约书亚分配的语境。
- source_word: לְנַחֲלָה
  choice: 作产业
  rationale: נחלה指可承受、归属的产业；“作产业”简洁保留其法律和盟约含义。
- source_word: כְּמַחְלְקֹתָם לְשִׁבְטֵיהֶם
  choice: 按着他们的支派分给他们
  rationale: 将“按其划分／分区，归其各支派”自然转化为现代汉语，清楚表达土地按支派分配的组织原则。
- source_word: שָׁקְטָה מִמִּלְחָמָה
  choice: 止息了战争
  rationale: שקט表示安静、安歇或不再受扰；此译突出主要战事停止，同时脚注保留“得享安宁”的状态性表达。
theological_decisions:
- issue: “全地”所指征服范围及完成程度
  choice: 保留“全地”这一总结性说法，不在正文中限定其范围或解释完成程度。
  alternative: 译成“所涉及的全地”、将其解释为胜利性的夸张，或理解为每一处都已立即完全占领。
  rationale: 希伯来文直接作出叙事总结；译文应保留它与其他经文所述尚有未得之地之间的真实张力，而不预先调和。
- issue: “地止息战争”的含义
  choice: 表达主要战争停止、全地进入安宁状态。
  alternative: 理解为此后绝无任何冲突，或仅译作土地拟人化地“安静”。
  rationale: שקט מִן描述从战争中安歇，并不必然断言今后绝对没有任何局部冲突。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“于是”呈现叙事推进；保留“全地”“产业”等重要经文用语，但避免生硬逐词对应。所有脚注标记均已置于正文相应位置。
