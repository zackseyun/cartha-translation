revisions:
- from: 于是，约书亚夺取了全地[a]，正如耶和华对摩西所说的一切。约书亚把这地赐给以色列人作产业，按着他们的支派分给他们。于是，这地止息了战争[b]。
  to: 于是，约书亚取得了全地[a]，正如耶和华对摩西所说的一切。约书亚把这地赐给以色列人作产业，照着他们各支派的划分。这地不再有战争[b]。
  rationale: 将“夺取”改为“取得”，避免把原文未明说的方式编码进动词；将末句改为“这地不再有战争”，使中文主谓搭配自然，并忠实呈现该地脱离战争而安宁的状态。支派分配改为“照着他们各支派的划分”，更清晰对应原文结构。脚注相应修订，以准确说明范围与词义。
