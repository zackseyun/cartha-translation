base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/014.yaml
  text: And all the spoil of these cities[a], along with the livestock, the sons of Israel plundered for themselves; only all the people they struck with the edge of the sword until they had destroyed them[d][c][b]. They left no breathing thing.
translation:
  language: zh_hans
  text: 以色列人把这些城的一切战利品和牲畜都掠为己有；只是把所有的人都用刀剑杀死，直到把他们灭尽；一个有气息的也没有留下。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “一个有气息的也没有留下”也可译作“没有留下一个活口”。
    reason: 保留希伯来文 נְשָׁמָה（“气息”）的具体意象，同时说明其惯用含义。
lexical_decisions:
- source_word: שְׁלַל
  choice: 战利品
  rationale: 指战争中掠取的财物；“战利品”在现代汉语中准确、自然，并保留军事语境。
- source_word: הַבְּהֵמָה
  choice: 牲畜
  rationale: 这里指可作为财产掠取的家畜，“牲畜”比宽泛的“动物”更准确。
- source_word: בָּזְזוּ לָהֶם
  choice: 掠来归自己
  rationale: 既表达“掠取”的动作，也保留 לָהֶם 所表示的为自己所得之意。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 这是现代汉语对该民族共同体称谓最自然的表达；直译“以色列的儿子们”在此会造成仅指男性的误解。
- source_word: כָּל הָאָדָם
  choice: 所有的人
  rationale: אָדָם 在这里集合性地指与牲畜相对的城中人口，不限于成年男性。
- source_word: הִכּוּ לְפִי חֶרֶב
  choice: 用刀杀了
  rationale: לְפִי חֶרֶב 字面为“用刀剑之口”，是指用刀剑击杀的希伯来语惯用语；采用自然汉语表达其实际含义。
- source_word: עַד הִשְׁמִדָם אֹתָם
  choice: 直到灭尽他们
  rationale: 准确表达 שׁמד 的彻底毁灭含义，同时不引入本句没有出现的 חֵרֶם 专门术语。
- source_word: לֹא הִשְׁאִירוּ כָּל נְשָׁמָה
  choice: 一个有气息的也没有留下
  rationale: 保留 נְשָׁמָה 的“气息”意象，并以自然汉语表达无人存活。
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל 的群体称谓
  choice: 以色列人
  alternative: 以色列的众子
  rationale: 此处指以色列民族共同体。现代汉语“以色列人”准确且不误导为仅有男性，同时不改变其圣约群体身份。
- issue: כָּל הָאָדָם 的范围
  choice: 所有的人
  alternative: 每一个男人
  rationale: אָדָם 在牲畜的对照下指全体人类居民；译成“男人”会无根据地排除妇女和儿童。
- issue: 毁灭行为的措辞
  choice: 灭尽他们
  alternative: 把他们献为当灭之物
  rationale: 本分句使用 שׁמד 而非 חֵרֶם；因此直译其毁灭含义，不导入额外的献毁神学术语。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。句法保留原文先述掠物、后以“只是”转入杀戮的强烈对照；对暴力内容不弱化，也不增添原文没有的解释。
