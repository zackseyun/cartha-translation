source:
  edition: WLC
  text: וְֽ/אֶת כָּל עָרֵ֣י הַ/מְּלָכִֽים הָ֠/אֵלֶּה וְֽ/אֶת כָּל מַלְכֵי/הֶ֞ם לָכַ֧ד יְהוֹשֻׁ֛עַ וַ/יַּכֵּ֥/ם לְ/פִי חֶ֖רֶב הֶחֱרִ֣ים אוֹתָ֑/ם כַּ/אֲשֶׁ֣ר צִוָּ֔ה מֹשֶׁ֖ה עֶ֥בֶד יְהוָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/012.yaml
  text: Joshua captured all the cities of these kings[a], and all their kings, and he struck them down with the edge of the sword. He devoted them to destruction, just as Moses the servant of Yahweh had commanded.
translation:
  language: zh_hans
  text: 约书亚攻取了这些王的一切城邑，并擒获了他们所有的王；他用刀剑的锋刃击杀他们，把他们置于禁毁之下[a]，正如雅威的仆人摩西所吩咐的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“把他们彻底毁灭”。这里的希伯来语是专门用语，指把人或物置于“禁毁”之下，也就是不可撤回地划归毁灭。
    reason: 解释חרם的技术含义，并提供较通顺但较少保留术语色彩的译法。
lexical_decisions:
- source_word: עָרֵי הַמְּלָכִים הָאֵלֶּה
  choice: 这些王的所有城池
  rationale: 按希伯来语组合关系直译为“这些王的城”，并保留 כָּל“所有”的范围；“城池”自然体现征战语境，而不把它解释成“王城”。
- source_word: לָכַד
  choice: 攻取
  rationale: 该动词在军事征服语境中表示夺取、占领；“攻取”适合城池，也能统摄随后提到被擒获的诸王。
- source_word: וַיַּכֵּם
  choice: 击杀他们
  rationale: נכה 本可泛指击打或击败，但后接“刀刃”，此处明确涉及致命杀戮；“击杀”既准确又保持叙事的庄重语体。
- source_word: לְפִי חֶרֶב
  choice: 用刀刃
  rationale: 这是字面为“按刀剑之口”的希伯来语惯用语；“刀刃”保留其具体意象，同时符合现代汉语表达。
- source_word: הֶחֱרִים
  choice: 把他们置于禁毁之下
  rationale: 该使役形动词是征服叙事中的专门用语，指将人或物不可撤回地划归毁灭；采用“禁毁”并以脚注解释，避免将其压平为一般性的“消灭”。
- source_word: כַּאֲשֶׁר צִוָּה
  choice: 正如……所吩咐的
  rationale: 保留行动与先前命令完全相符的比较关系；“所吩咐的”自然表明摩西的命令在先。
- source_word: עֶבֶד יְהוָה
  choice: 雅威的仆人
  rationale: עֶבֶד 在此是摩西的尊称和职分称号；“仆人”比“奴隶”更符合语境，且不引入不相干的奴役含义。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见音译呈现四字神名，保留其作为以色列之上帝专名的性质，而不以称号代替。
theological_decisions:
- issue: 征服语境中 חרם 的译法
  choice: 把他们置于禁毁之下
  alternative: 把他们彻底毁灭
  rationale: 原文使用带有立约与宗教背景的专门术语，不只是一般意义上的毁灭。“置于禁毁之下”保留其划归毁灭、不可撤回的技术含义，并由脚注帮助普通读者理解。
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名，因此采用音译“雅威”，不以“主”这一称号代替；“耶和华”是传统形式，但“雅威”更接近当代学界通常采用的读音。
translation_notes:
  register: 采用现代、庄重而清楚的叙事语体。“攻取”“击杀”适合军事语境；“禁毁”虽为专门术语，但紧接脚注说明，以兼顾原文神学力度与普通读者的可理解性。
