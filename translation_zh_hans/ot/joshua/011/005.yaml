  text: וַ/יִּוָּ֣עֲד֔וּ כֹּ֖ל הַ/מְּלָכִ֣ים הָ/אֵ֑לֶּה וַ/יָּבֹ֜אוּ וַ/יַּחֲנ֤וּ יַחְדָּו֙ אֶל מֵ֣י מֵר֔וֹם לְ/הִלָּחֵ֖ם עִם יִשְׂרָאֵֽל־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/005.yaml
  text: All these kings met by agreement[a], and they came and encamped together at the waters of Merom to fight against Israel.
translation:
  language: zh_hans
  text: 这些王都约定会合[a]，来到米伦水边一同安营，要与以色列交战。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“相约聚集”，或“聚集在一起”；希伯来语动词表示经过安排、协调而聚集，并非偶然相遇。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּוָּעֲדוּ
  choice: 约定会合
  rationale: 该动词为 יעד 的尼法勒式，在这里表示按约定协调聚集，而不是偶然碰面；“约定会合”既保留彼此约定之意，也自然表达实际聚集的行动。
- source_word: כֹּל הַמְּלָכִים הָאֵלֶּה
  choice: 这些王都
  rationale: 保留 כֹּל 的全体范围和 הָאֵלֶּה 的近指作用；按现代汉语语序译为“这些王都”简洁自然。
- source_word: וַיָּבֹאוּ
  choice: 来到
  rationale: בוא 是常见的叙事动词；结合后面的目的地，用“来到”自然呈现他们抵达该处。
- source_word: וַיַּחֲנוּ
  choice: 安营
  rationale: חנה 在军事叙事中指扎营；“安营”准确、庄重，也符合现代中文圣经叙事语体。
- source_word: יַחְדָּו
  choice: 一同
  rationale: 强调诸王联军统一行动；“一同”紧接“安营”，清楚体现他们共同驻扎。
- source_word: אֶל מֵי מֵרוֹם
  choice: 米伦水边
  rationale: אֶל 表示行动所到的地点；מֵי מֵרוֹם 字面为“米伦之水”。“米伦水边”既保留水域所指，又符合汉语地点表达，且不擅自确定为湖泊或其他特定水体。
- source_word: לְהִלָּחֵם עִם יִשְׂרָאֵל
  choice: 要与以色列交战
  rationale: לחם 的不定式表达此行目的，עִם 在军事语境中表示交战的对手；“与以色列交战”准确而自然。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“约定会合”保留原文协调聚集的含义；“米伦水边”避免超出原文，把该水域具体认定为湖泊。脚注标记已在正文中以 [a] 标出。
