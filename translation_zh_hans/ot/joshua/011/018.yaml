  text: Joshua made war against all these kings for many days[a].
translation:
  language: zh_hans
  text: 约书亚与所有这些王交战了许多日子。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“约书亚与所有这些王交战了很长时间。”希伯来文直译为“许多日子”，并采用“进行战争”的惯用说法。
    reason: 词义替代译法：说明“许多日子”的习语意义及原文战争表达。
lexical_decisions:
- source_word: יָמִים רַבִּים
  choice: 许多日子
  rationale: 直译为“许多日子”，也可表示一段很长的时间；正文保留希伯来语的具体表达，同时在现代汉语中清楚自然。
- source_word: עָשָׂה ... מִלְחָמָה
  choice: 交战
  rationale: 希伯来语直译为“进行战争／作战”；现代汉语用“交战”自然表达这一惯用搭配，又不把持续的战争缩窄为单次战役。
- source_word: יְהוֹשֻׁעַ
  choice: 约书亚
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: אֶת כָּל הַמְּלָכִים הָאֵלֶּה
  choice: 与这些王
  rationale: אֵת 在此引出“交战”所涉及的对象；结合战争语境，中文“与这些王交战”自然表达敌对关系。“所有”在中文中可由“这些王”的整体指称体现，避免“所有这些王”略显欧化的措辞。
- source_word: מִלְחָמָה
  choice: 战
  rationale: 该词可指战争或战事；在“交战”这一汉语动词中表达其意义，保留持续战争而非单场战斗的范围。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“交战了许多日子”既贴近原文语序和意象，也便于普通读者理解；脚注交代其可按时长意义译为“很长时间”。
