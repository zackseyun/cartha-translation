revisions:
- from: 约书亚和所有跟他在一起的战士，突然来到米伦水边攻击他们，向他们猛扑过去。
  to: 于是，约书亚和所有与他一同作战的人突然来到米伦水边，向他们冲去，并猛攻他们。
  rationale: 修订将两个连续的军事动作分别译为“向他们冲去”和“猛攻他们”，保留原文的叙事推进，避免同义重复；同时以“所有与他一同作战的人”呈现原文的集体称谓。未见必须保留或增设的脚注锚点。
