base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/007.yaml
  text: So Joshua[a], and all the people of war with him, came against them suddenly at the waters of Merom and fell upon them.
translation:
  language: zh_hans
  text: 于是，约书亚和所有与他一同作战的人突然来到米伦水边，向他们冲去，并猛攻他们。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹא
  choice: 来到
  rationale: בוא在叙事中可按视角译为“来”或“去”；这里与עֲלֵיהֶם连用，表示向敌军进逼，“来到……攻击”自然表达其敌对行动。
- source_word: עַם הַמִּלְחָמָה
  choice: 战士
  rationale: 原文直译为“战争／战斗之民”，指参与作战的群体。“战士”简洁自然，也不采用传统译法“壮士”所可能附加的体格或英勇色彩。
- source_word: עִמּוֹ
  choice: 跟他在一起的
  rationale: 准确表达同行和陪伴关系，并使现代汉语句式流畅。
- source_word: עֲלֵיהֶם
  choice: 攻击他们
  rationale: על在敌对移动语境中表示“向着／攻击”；此处明译为“攻击”能清楚传达军事语境。
- source_word: עַל מֵי מֵרוֹם
  choice: 在米伦水边
  rationale: מֵי מֵרוֹם指名为米伦的水域；“水边”自然表达军队抵达并交战的地点，又不把它过度具体化为湖、河或泉。
- source_word: פִּתְאֹם
  choice: 突然
  rationale: 直接保留行动的突发性和出其不意之意。
- source_word: וַיִּפְּלוּ בָּהֶם
  choice: 向他们猛扑过去
  rationale: נפל ב在军事语境中是“扑向、袭击”的生动说法；“猛扑过去”保留原文意象，比单译“攻击”更有力度。
- source_word: וְ
  choice: 和
  rationale: 句首叙事连接词在中文中无需机械译作“于是”；在并列主语中以“和”自然承接上下文。
