base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/021.yaml
  text: 'Then the sons of Reuben[a], the sons of Gad, and the half-tribe of Manasseh answered and spoke to the heads of the clans of Israel:'
translation:
  language: zh_hans
  text: 于是，流便子孙、迦得子孙和玛拿西半支派的人回答以色列各宗族[a]的首领，说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译是“以色列各千人单位的首领”；这里的“千”可能指宗族或支派中的编组单位。
    reason: 说明行政与宗族术语“אַלְפֵי”的字面意义及语境含义，避免把有歧义的古代单位无说明地定译。
lexical_decisions:
- source_word: וַיַּעֲנוּ
  choice: 回答
  rationale: 该动词在叙事对话中表示针对前文的指控作出回应；“回答”保留了与上文的明确衔接。
- source_word: בְּנֵי רְאוּבֵן וּבְנֵי גָד
  choice: 吕便子孙、迦得子孙
  rationale: 保留希伯来文“……之子”的宗族性表达；现代汉语用“子孙”既自然，也能传达群体身份。
- source_word: וַחֲצִי שֵׁבֶט הַמְנַשֶּׁה
  choice: 玛拿西半支派的人
  rationale: “半支派”贴近原文的构词；补出“的人”，使这一群体与前面两个主语在现代汉语句法中协调自然。
- source_word: וַיְדַבְּרוּ
  choice: 说
  rationale: 原文在“回答”之后另用“说话”动词引出其言辞；汉语以“回答……，说”自然保留这两个动作，而不作生硬重复。
- source_word: רָאשֵׁי אַלְפֵי יִשְׂרָאֵל
  choice: 以色列各宗族的首领
  rationale: רָאשֵׁי意为“首领”；אַלְפֵי字面为“千”，但在此社会组织语境中指氏族或编组单位。“各宗族”传达其实际所指，并以脚注保留字面信息。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“于是”承接前文；“回答……，说”符合汉语叙事习惯，同时对应原文连续出现的“回答”和“说话”两个动词。脚注标记置于其实际解释的短语“首领”之后。
