  text: וַ/יֹּ֨אמֶר אֲלֵי/הֶ֜ם לֵ/אמֹ֗ר בִּ/נְכָסִ֨ים רַבִּ֜ים שׁ֤וּבוּ אֶל אָֽהֳלֵי/כֶם֙ וּ/בְ/מִקְנֶ֣ה רַב מְאֹ֔ד בְּ/כֶ֨סֶף וּ/בְ/זָהָ֜ב וּ/בִ/נְחֹ֧שֶׁת וּ/בְ/בַרְזֶ֛ל וּ/בִ/שְׂלָמ֖וֹת הַרְבֵּ֣ה מְאֹ֑ד חִלְק֥וּ שְׁלַל אֹיְבֵי/כֶ֖ם עִם אֲחֵי/כֶֽם־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/008.yaml
  text: And he said to them[a], “Return to your tents with great wealth, with very much livestock, with silver and gold, with bronze and iron, and with very many garments[c][b]. Divide the plunder of your enemies with your brothers.”
translation:
  language: zh_hans
  text: 他对他们说：“你们带着许多财物、极多的牲畜、金银、铜[c]和铁，以及极多的衣服，回你们的帐篷去。你们要把从仇敌那里夺来的战利品[a]，与你们的弟兄[b]一同分。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “战利品”也可译作“掳物”。
    reason: lexical_alternative
  - marker: b
    text: 这里的“弟兄”指其他支派的以色列同胞。
    reason: cultural_note
  - marker: c
    text: “铜”也可译作“青铜”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵיהֶם לֵאמֹר
  choice: 他对他们说
  rationale: 希伯来语的“说……说”是叙事引语公式；现代汉语用“对他们说”即可自然、完整地表达其功能。
- source_word: בִּנְכָסִים רַבִּים
  choice: 带着许多财物
  rationale: נְכָסִים泛指财产、财富或所有物；“财物”既宽泛，又能自然引出后面的具体清单。
- source_word: שׁוּבוּ אֶל אָהֳלֵיכֶם
  choice: 回你们的帐篷去
  rationale: 保留“帐篷”的历史场景，同时以现代汉语“回……去”表达复数命令。
- source_word: וּבְמִקְנֶה רַב מְאֹד
  choice: 极多的牲畜
  rationale: מִקְנֶה是牲畜的集合名词，不限于牛；“极多”体现מְאֹד的加强语气。
- source_word: בְּכֶסֶף וּבְזָהָב
  choice: 金银
  rationale: 按自然汉语的并列习惯译作“金银”，意义与原文的银、金完全对应。
- source_word: וּבִנְחֹשֶׁת וּבְבַרְזֶל
  choice: 铜铁
  rationale: נְחֹשֶׁת可指铜或青铜；汉语“铜”在此保留较宽的材料指称，并与“铁”构成自然并列。
- source_word: וּבִשְׂלָמוֹת הַרְבֵּה מְאֹד
  choice: 许多衣服
  rationale: שְׂלָמוֹת泛指衣服或衣袍；“衣服”通俗准确。原文的强烈数量表达已由全句“许多……极多……”的累积语势体现。
- source_word: חִלְקוּ שְׁלַל אֹיְבֵיכֶם
  choice: 把从仇敌那里夺来的战利品……一同分
  rationale: חִלְקוּ是复数命令，要求分配战利品；“一同分”保留与弟兄共同分配的关系，而不额外断定是否平均分配。
- source_word: עִם אֲחֵיכֶם
  choice: 与你们的弟兄
  rationale: 保留原文阳性复数亲属称谓，同时用脚注说明此处在语境中指其他以色列同胞。
theological_decisions:
- issue: אֲחֵיכֶם的性别化盟约亲属称谓
  choice: 与你们的弟兄
  alternative: 与你们的以色列同胞
  rationale: 正文保留原文“弟兄”的亲属与群体色彩，不将其直接中性化；脚注交代本节语境中的具体所指。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。保留“帐篷”“弟兄”等历史与群体称谓；省去希伯来语引语公式中在汉语里显得重复的“说”，但不省略其语义。
