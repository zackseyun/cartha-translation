    issue: “我们祖先所造的耶和华祭坛的样式”有修饰范围歧义。
    rationale: אֲשֶׁר עָשׂוּ אֲבוֹתֵינוּ修饰תַּבְנִית，不是说祖先造了“耶和华的祭坛”本身。中文应明确祖先所造的是仿照该坛的坛样／复制品。
  - severity: medium
    issue: “也不是用来献别的祭”增添“别的”。
    rationale: וְלֹא לְזֶבַח只再次否定“为祭／祭牲而设”，并未明说“其他”。保留双重否定即可，不应额外界定祭类之间的关系。
  - severity: low
