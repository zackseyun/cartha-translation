- from: 所以我们说：‘将来，如果他们对我们或我们的后代这样说，我们就回答：“你们看，这是我们祖先所造的耶和华祭坛的样式[a]，不是用来献燔祭，也不是用来献别的祭，而是作为我们与你们之间的见证。”’
  to: 所以我们说：‘将来，如果他们对我们或我们的后代这样说，我们就回答：“请看我们祖先所造、仿照耶和华祭坛的坛样[a]；它不是用来献燔祭，也不是用来献祭，而是我们与你们之间的见证。”’
