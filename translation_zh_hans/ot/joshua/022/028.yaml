source:
  edition: WLC
  text: וַ/נֹּ֕אמֶר וְ/הָיָ֗ה כִּֽי יֹאמְר֥וּ אֵלֵ֛י/נוּ וְ/אֶל דֹּרֹתֵ֖י/נוּ מָחָ֑ר וְ/אָמַ֡רְנוּ רְא֣וּ אֶת תַּבְנִית֩ מִזְבַּ֨ח יְהוָ֜ה אֲשֶׁר עָשׂ֣וּ אֲבוֹתֵ֗י/נוּ לֹ֤א לְ/עוֹלָה֙ וְ/לֹ֣א לְ/זֶ֔בַח כִּי עֵ֣ד ה֔וּא בֵּינֵ֖י/נוּ וּ/בֵינֵי/כֶֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/028.yaml
  text: 'So we said[a], ‘If they should say to us or to our generations in time to come, then we will say: “Look at the pattern of the altar of Yahweh, which our fathers made—not for burnt offering and not for sacrifice, but it is a witness between us and you.”’'
translation:
  language: zh_hans
  text: 所以我们说：‘将来，如果他们对我们或我们的后代这样说，我们就回答：“请看我们祖先所造、仿照耶和华祭坛的坛样[a]；它不是用来献燔祭，也不是用来献祭，而是我们与你们之间的见证。”’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “坛样”也可译作“样式”“模型”或“仿制品”。原文指照着耶和华祭坛的形制做成的坛，作为双方之间的见证，而非用于献祭。
    reason: 说明תַּבְנִית的词义范围，并谨慎交代本节明示的见证用途与非献祭用途。
lexical_decisions:
- source_word: וַנֹּאמֶר
  choice: 所以我们说
  rationale: 承接上文并推进叙述；“所以”自然表达本节解释性的因果承接。
- source_word: וְהָיָה כִּי
  choice: 将来，如果
  rationale: 该结构引出未来可能出现的情形；汉语以“将来，如果”同时表达时间与条件。
- source_word: יֹאמְרוּ אֵלֵינוּ וְאֶל דֹּרֹתֵינוּ מָחָר
  choice: 他们对我们或我们的后代这样说
  rationale: מָחָר在此指日后的时间，已由“将来”表达；דֹּרֹתֵינוּ按语境指后世子孙，译作“我们的后代”自然清楚。连接成分在条件情境中表达可涉及当代人或后代，译作“或”符合汉语逻辑。
- source_word: רְאוּ אֶת תַּבְנִית מִזְבַּח יְהוָה
  choice: 你们看，这是耶和华祭坛的样式
  rationale: רְאוּ译为现代而庄重的“你们看”；תַּבְנִית可指样式、模型或仿制形制，正文用“样式”保留其语义范围，并以脚注说明。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经传统中广为人知的神名音译，明确呈现四字神名，而不以“主”这一称号替代。
- source_word: אֲשֶׁר עָשׂוּ אֲבוֹתֵינוּ
  choice: 我们祖先所造的
  rationale: אָבוֹת在群体历史语境中可指先祖；“祖先”比直译“父亲们”更符合现代汉语，也不额外限定具体世代。
- source_word: לֹא לְעוֹלָה וְלֹא לְזֶבַח
  choice: 不是用来献燔祭，也不是用来献别的祭
  rationale: 保留两个לֹא形成的重复否定和强调。עֹלָה为燔祭；זֶבַח是较广义的祭献，为避免汉语把“燔祭”和“祭”误读为互斥类别，补出“别的”以表达除燔祭外的其他祭献用途。
- source_word: כִּי עֵד הוּא בֵּינֵינוּ וּבֵינֵיכֶם
  choice: 而是作为我们与你们之间的见证
  rationale: כִּי在前述否定后引出真正用途，汉语以“而是”显明对比；עֵד译作“见证”，保留祭坛本身作为双方关系凭证的含义。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威；上主
  rationale: 原文使用四字神名。正文采用中文读者最熟悉的专名形式“耶和华”，既保留其专名性质，也避免改成一般称号；“雅威”是可用的学术拟音，但在普通现代中文读者中熟悉度较低。
- issue: 复制的祭坛是否用于献祭
  choice: 明确译为不是献燔祭或其他祭之用，而是见证
  alternative: 只说“祭坛的样式”，不明说其用途对比
  rationale: 原文以重复否定明确排除献祭功能，并以עֵד说明其见证作用；译文维持这种神学与礼仪上的区分，不把这座坛等同于获准献祭的祭坛。
- issue: אֲבוֹתֵינוּ的群体称谓
  choice: 我们的祖先
  alternative: 我们的父辈
  rationale: 此处说的是建坛者相对于未来后代的身份。“祖先”能自然涵盖这一跨世代关系，而不把所指限定为直接父辈。
translation_notes:
  register: 采用现代、清楚而庄重的叙事语言。条件句按自然汉语重组为“将来，如果……我们就……”。保留重复否定所产生的强调，并用“耶和华”呈现原文神名。
