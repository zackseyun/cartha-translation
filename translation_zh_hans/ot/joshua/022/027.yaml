  to: 不；这坛乃是我们和你们之间、以及我们后代之间的见证，好叫我们可以在耶和华面前，以我们的燔祭、祭物和平安祭事奉他，免得日后你们的子孙对我们的子孙说：‘你们与耶和华无分。’
  rationale: “不；”对应承接上文否定的纠正语气。补出“这坛”是由紧邻上下文确定的指代，并非增添祭坛用途。“后代”对应“我们之后的世代”；“日后”保留מָחָר在此处“将来”的含义。
