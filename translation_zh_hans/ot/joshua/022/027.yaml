base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/027.yaml
  text: Rather, it is a witness between us and you, and between our generations after us, that we may perform the service of the LORD before him with our burnt offerings, our sacrifices, and our peace offerings, so that your children may not say to our children in time to come, ‘You have no share in the LORD.’
translation:
  language: zh_hans
  text: 不；这坛乃是我们和你们之间、以及我们后代之间的见证，好叫我们可以在耶和华面前，以我们的燔祭、祭物和平安祭事奉他，免得日后你们的子孙对我们的子孙说：‘你们与耶和华无分。’
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: 不，这是
  rationale: 结合上文的否定与纠正语气，此处不是单纯说明原因，而是转折澄清筑坛的目的；用“不，这是”自然承接上下文。
- source_word: עֵד
  choice: 作见证
  rationale: 保留祭坛作为双方及后代之间“见证”的法律与盟约意味。
- source_word: לַעֲבֹד אֶת־עֲבֹדַת יְהוָה
  choice: 事奉他
  rationale: 希伯来语以同根动词和名词加强“履行耶和华的礼仪事奉”之意；中文结合后列祭物译为“事奉他”，避免生硬重复。
- source_word: עֹלוֹתֵינוּ
  choice: 我们的燔祭
  rationale: עֹלָה指全部焚献的祭，采用通行且准确的礼仪术语“燔祭”。
- source_word: זְבָחֵינוּ
  choice: 我们的祭物
  rationale: זֶבַח泛指宰献之祭；译为“祭物”以免擅自限定为某一祭类，并与后面的平安祭区分。
- source_word: שְׁלָמֵינוּ
  choice: 我们的平安祭
  rationale: שְׁלָמִים是特定祭类，采用通行译名“平安祭”。
- source_word: חֵלֶק בַּיהוָה
  choice: 与耶和华无分
  rationale: חֵלֶק表示份额、权利或归属；“与耶和华无分”保留其盟约身份和敬拜权利的多重含义。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的专名形式，明确对应四字神名。
theological_decisions:
- issue: 祭坛见证的功能
  choice: 译作“作见证”，不称其为献祭用的祭坛
  alternative: 将其解释为合法献祭的另一处祭坛
  rationale: 本节说祭坛是双方及后世之间的见证，目的是保障后代在耶和华面前事奉的资格；不应引入文本未说的异地献祭功能。
- issue: “与耶和华有分”的含义
  choice: 保留“有分／无分”的开放表达
  alternative: 明确解释为“无权敬拜耶和华”或“不属于耶和华”
  rationale: 原文可同时涉及敬拜权、盟约归属和群体身份，直译能保留这种神学张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。调整希伯来语长句次序，将“献上……事奉他”连贯表达，同时保留“见证”“燔祭”“平安祭”“无分”等关键圣经术语。
