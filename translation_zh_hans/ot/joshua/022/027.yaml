  naturalness: “不，这是在我们和你们之间，并在我们后世子孙之间作见证”不合现代汉语习惯；改为“这坛乃是……的见证”既自然，又明确本节中被指示的祭坛。
  terminology: 保留“耶和华”“燔祭”“平安祭”及“无分”。将עֲבֹדַת יהוה明确为“事奉耶和华”，同时以“以我们的……祭”表达祭物是该礼仪事奉的方式，不把祭坛说成献祭地点。
