  text: וַ/יִּיטַ֣ב הַ/דָּבָ֗ר בְּ/עֵינֵי֙ בְּנֵ֣י יִשְׂרָאֵ֔ל וַ/יְבָרֲכ֥וּ אֱלֹהִ֖ים בְּנֵ֣י יִשְׂרָאֵ֑ל וְ/לֹ֣א אָמְר֗וּ לַ/עֲל֤וֹת עֲלֵי/הֶם֙ לַ/צָּבָ֔א לְ/שַׁחֵת֙ אֶת הָ/אָ֔רֶץ אֲשֶׁ֛ר בְּנֵי רְאוּבֵ֥ן וּ/בְנֵי גָ֖ד יֹשְׁבִ֥ים בָּֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/033.yaml
  text: And the matter was good in the eyes of the sons of Israel[a], and the sons of Israel blessed God[c][b]. And they did not speak of going up against them in war to destroy the land where the sons of Reuben and the sons of Gad were living.
translation:
  language: zh_hans
  text: 以色列人认为这事妥当[a]，就称颂上帝[b]。他们没有说要出兵攻打流便人和迦得人，毁灭他们所居住的土地[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“这事在以色列众子眼中是好的。”
    reason: 说明希伯来语的字面措辞及评价性惯用语。
  - marker: b
    text: “称颂”直译为“祝福”。
    reason: 保留 בּרך 以上帝为宾语时的字面意义和可译选择。
  - marker: c
    text: 直译：“他们没有说要上去攻打他们，为战争毁灭流便子孙和迦得子孙所居住的土地。”
    reason: 呈现希伯来语“没有说要上去攻打他们，为战争毁灭……”的完整结构；正文明确支派名称，脚注保留原文再次点出其居住之地的形式。
lexical_decisions:
- source_word: וַיִּיטַב הַדָּבָר בְּעֵינֵי בְּנֵי יִשְׂרָאֵל
  choice: 以色列人认为这事妥当
  rationale: 希伯来语直译为“这事在以色列众子眼中是好的”，是表示认可的惯用语。“认为这事妥当”在现代汉语中自然，同时保留其正面判断；“这事”也没有把 דָּבָר 过度限定为单纯的言语或报告。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 此处指以色列群体。现代汉语通常以“以色列人”自然表达这一希伯来族群称谓，无须生硬译作“以色列的众子”。
- source_word: וַיְבָרֲכוּ אֱלֹהִים
  choice: 称颂上帝
  rationale: בּרך 以上帝为宾语时，表示向上帝发出祝颂、赞美。“称颂上帝”既符合汉语宗教语域，也比字面化的“祝福上帝”更准确地传达此处用法。
- source_word: וְלֹא אָמְרוּ
  choice: 他们没有说要
  rationale: 保留希伯来语“没有说”的表述，不擅自加强为“不再谈论”或“放弃了计划”。
- source_word: לַעֲלוֹת עֲלֵיהֶם לַצָּבָא
  choice: 出兵攻打他们
  rationale: “上去攻击他们，为战争”是军事语境中的惯用表达。“出兵攻打”以自然现代汉语传达军事推进和敌对行动。
- source_word: לְשַׁחֵת אֶת הָאָרֶץ
  choice: 毁灭……土地
  rationale: שׁחת 表示毁坏、毁灭；אֶרֶץ 在此指相关支派居住的地域。“毁灭……土地”保留原文强烈程度和地理所指。
- source_word: יֹשְׁבִים בָּהּ
  choice: 所居住的
  rationale: 分词表示持续居住的状态；“所居住的”简洁自然，并明确修饰“土地”。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“妥当”“称颂”“出兵攻打”适合叙事语境，也便于普通读者理解。正文避免机械复制希伯来语习语，脚注则补足字面形式与词义张力。
