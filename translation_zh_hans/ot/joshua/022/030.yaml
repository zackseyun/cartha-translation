base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/030.yaml
  text: When Phinehas the priest[a], the leaders of the congregation, and the heads of the thousands of Israel who were with him heard the words that the sons of Reuben, the sons of Gad, and the sons of Manasseh spoke[b], it was good in their eyes.
translation:
  language: zh_hans
  text: 祭司非尼哈，以及与他同在的会众首领和以色列各千人单位的首领[a]，听见吕便子孙、迦得子孙和玛拿西子孙所说的话，就都认为这些话很好。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “千人单位”直译为“以色列的众千单位”；这里可能指宗族或支派中的编组单位，并不一定严格表示一千人。
    reason: lexical_alternative
  - marker: b
    text: “都认为这些话很好”也可译作“都看为好”或“都很满意”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: 听见
  rationale: 在叙事性连续动词中，שׁמע在此自然表示听见对方所说的话；不额外加入“留心听从”的含义。
- source_word: פִּינְחָס הַכֹּהֵן
  choice: 祭司非尼哈
  rationale: 按现代汉语称谓习惯将职分置于人名前，同时完整保留其祭司身份。
- source_word: נְשִׂיאֵי הָעֵדָה
  choice: 会众首领
  rationale: נָשִׂיא指获承认的领袖，עֵדָה指以色列会众；“会众首领”简洁、庄重，也不把其职分限定为君王或宗派性职位。
- source_word: רָאשֵׁי אַלְפֵי יִשְׂרָאֵל
  choice: 以色列各千户的首领
  rationale: 保留אֶלֶף的“千”这一词面特征，并以“千户”表达古代社会或军政编组单位；脚注说明它未必是严格的一千人。
- source_word: אֲשֶׁר אִתּוֹ
  choice: 与他同来的
  rationale: 关系从句指前述首领与非尼哈同行；译作“与他同来的”符合本段使团前来的语境，也比生硬的“与他在一起的”自然。
- source_word: הַדְּבָרִים אֲשֶׁר דִּבְּרוּ
  choice: 所说的话
  rationale: 以自然汉语整合“话”和“说”的同根表达，同时保留其内容是口头陈述。
- source_word: בְּנֵי רְאוּבֵן וּבְנֵי גָד וּבְנֵי מְנַשֶּׁה
  choice: 吕便子孙、迦得子孙和玛拿西子孙
  rationale: 逐项保留重复的בְּנֵי及支派血缘称谓，采用通行中文圣经人名。
- source_word: וַיִּיטַב בְּעֵינֵיהֶם
  choice: 就都看为好
  rationale: 较贴近希伯来语“在他们眼中为好”的习语，又是自然可懂的现代汉语；“都”明确复数代词所指的众人。
theological_decisions: []
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。句法适度顺应汉语，将同行者的说明提前为“与他同来的”，并保留“子孙”的重复和“看为好”的希伯来语色彩。
