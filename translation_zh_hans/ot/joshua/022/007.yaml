base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/007.yaml
  text: To the one half-tribe of Manasseh Moses had given land in Bashan[a], but to the other half Joshua gave land with their brothers beyond the Jordan westward. And when Joshua sent them away to their tents, he blessed them.
translation:
  language: zh_hans
  text: 摩西已经把巴珊的土地赐给玛拿西支派的一半；至于另一半，约书亚把约旦河西边的土地赐给他们，使他们与弟兄[a]一同承受产业。约书亚送他们回自己的帐篷时，也为他们祝福。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “弟兄”指其他支派中与他们同属以色列的同胞。
    reason: 说明希伯来语亲属称谓在本处的群体所指，避免读者误以为仅指亲生兄弟。
lexical_decisions:
- source_word: וְלַחֲצִי שֵׁבֶט הַמְנַשֶּׁה
  choice: 玛拿西半个支派
  rationale: 指玛拿西支派分成的两半之一；中文无需添加“一”也能自然表达，并与后文“另一半”形成清楚对照。
- source_word: נָתַן מֹשֶׁה בַּבָּשָׁן
  choice: 摩西已经把巴珊的土地赐给
  rationale: “已经”表明此事先于约书亚后来分地；“土地”虽为语境中省略的宾语，但在中文中补出可使分地含义清楚。
- source_word: וּלְחֶצְיוֹ
  choice: 至于另一半
  rationale: 代词后缀回指玛拿西支派；译作“另一半”准确呈现两半之间的对照。
- source_word: עִם אֲחֵיהֶם
  choice: 使他们与自己的弟兄同得产业
  rationale: 保留“弟兄”这一亲属称谓；结合分地语境补出“同得产业”，使“与……一起”的关系在现代中文中自然明确。
- source_word: מֵעֵבֶר הַיַּרְדֵּן יָמָּה
  choice: 约旦河西边
  rationale: יָמָּה字面有“向海、向西”之意，此处明确指约旦河的西侧；采用现代中文常用的地理表达。
- source_word: שִׁלְּחָם יְהוֹשֻׁעַ אֶל אָהֳלֵיהֶם
  choice: 约书亚送他们回自己的帐篷
  rationale: פיעל形式表示送行、遣回；保留“帐篷”的具体历史意象，不泛化为“家”。
- source_word: וַיְבָרֲכֵם
  choice: 为他们祝福
  rationale: 直接表达ברך在此处的通常含义，不额外限定祝福的形式或内容。
