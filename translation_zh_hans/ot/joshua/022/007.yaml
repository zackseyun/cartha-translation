  to: 摩西已经把巴珊的土地赐给玛拿西支派的一半；至于另一半，约书亚把约旦河西边的土地赐给他们，使他们与弟兄[a]一同承受产业。约书亚送他们回自己的帐篷时，也为他们祝福。
