base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/011.yaml
  text: And the sons of Israel heard it said[a], “Look, the sons of Reuben and the sons of Gad and the half-tribe of Manasseh have built the altar opposite the land of Canaan, in the region of the Jordan[d][c][b], on the side of the sons of Israel.”
translation:
  language: zh_hans
  text: 以色列人听见有人说[a]：“看哪，吕便人、迦得人和玛拿西半支派的人筑了那座坛，就在迦南地对面[b]、约旦河一带[c]，在以色列人那一边[d]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可较直译为“以色列人听见，说”。这里的希伯来语是引出所听见之消息的常用格式。
    reason: lexical_alternative
  - marker: b
    text: “在迦南地对面”也可译作“朝着迦南地”。
    reason: lexical_alternative
  - marker: c
    text: 希伯来语直译为“约旦河的各地区（或地带）”；这个地理用语的确切含义不确定。
    reason: cultural_note
  - marker: d
    text: 原文最后这个地理短语较难确定，也可理解为“在以色列人那一边”或“在以色列人对面”；它可能指约旦河西岸属于以色列人的一侧，也可能表示与他们相对的位置。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁמְעוּ בְנֵי יִשְׂרָאֵל לֵאמֹר
  choice: 以色列人听见有人说
  rationale: 用自然的现代汉语表达希伯来语的传闻引述格式，同时保留“听见”与“说”的报告结构。
- source_word: הִנֵּה
  choice: 看哪
  rationale: 保留提示听者注意的语气；“看哪”庄重而仍为现代读者所熟悉。
- source_word: בְנֵי רְאוּבֵן וּבְנֵי גָד
  choice: 吕便人、迦得人
  rationale: 这里指两个支派的成员；汉语用族名加“人”比逐字译作“众子”自然，也与民族支派语境相称。
- source_word: בָנוּ ... אֶת הַמִּזְבֵּחַ
  choice: 筑了那座坛
  rationale: “筑”适合坛的建造；“那座坛”体现原文定冠词，并指向报告中引起争议的特定祭坛。
- source_word: אֶל מוּל אֶרֶץ כְּנַעַן
  choice: 在迦南地对面
  rationale: 保留מוּל所表达的相对、相向空间关系，不进一步判定具体方位。
- source_word: גְּלִילוֹת הַיַּרְדֵּן
  choice: 约旦河一带
  rationale: גְּלִילוֹת可指地区或地带；“一带”是自然且不作过度精确判断的地理表达。
- source_word: אֶל עֵבֶר בְּנֵי יִשְׂרָאֵל
  choice: 以色列人一侧
  rationale: 尽量保留“以色列人”与“侧、彼岸”之间含混的空间关系，避免擅自判定是归属以色列人的一岸，还是与他们相对的一侧。
