    text: “在这地得了产业”也可译作“取得了那地”或“占有了那地”。原文动词既可侧重得到并持有土地，也可侧重实际取得其所有权。
    reason: 说明אֲשֶׁר נֹאחֲזוּ בָהּ的词义范围，保留受领、持有和取得之间的细微差别。
  revision_rationale: 修订使“按耶和华借着摩西所下的命令”明确关联于他们在基列地获得产业，同时删去“回到”所造成的重复。保留“返回”和“前往”以对应וַיָּשֻׁבוּ וַיֵּלְכוּ，保留“产业之地”及脚注以不武断消除נֹאחֲזוּ的词义弹性。
