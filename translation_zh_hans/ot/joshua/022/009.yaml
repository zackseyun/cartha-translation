revisions:
- from: 于是，吕便子孙、迦得子孙和玛拿西半个支派离开以色列人，从迦南地的示罗返回，往基列地去，回到他们的产业之地；他们照耶和华借着摩西所下的命令，已经取得了那地[a]。
  to: 于是，吕便子孙、迦得子孙和玛拿西半个支派离开以色列人，从迦南地的示罗返回，前往基列地，就是他们的产业之地；他们照耶和华借着摩西所下的命令，在这地得了产业[a]。
  rationale: 修订使“按耶和华借着摩西所下的命令”明确关联于他们在基列地获得产业，同时删去“回到”所造成的重复。保留“返回”和“前往”以对应וַיָּשֻׁבוּ וַיֵּלְכוּ，保留“产业之地”及脚注以不武断消除נֹאחֲזוּ的词义弹性。
