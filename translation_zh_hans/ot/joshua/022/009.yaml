  text: וַ/יָּשֻׁ֣בוּ וַ/יֵּלְכ֡וּ בְּנֵי רְאוּבֵ֨ן וּ/בְנֵי גָ֜ד וַ/חֲצִ֣י שֵׁ֣בֶט הַֽ/מְנַשֶּׁ֗ה מֵ/אֵת֙ בְּנֵ֣י יִשְׂרָאֵ֔ל מִ/שִּׁלֹ֖ה אֲשֶׁ֣ר בְּ/אֶֽרֶץ כְּנָ֑עַן לָ/לֶ֜כֶת אֶל אֶ֣רֶץ הַ/גִּלְעָ֗ד אֶל אֶ֤רֶץ אֲחֻזָּתָ/ם֙ אֲשֶׁ֣ר נֹֽאחֲזוּ בָ֔/הּ עַל פִּ֥י יְהוָ֖ה בְּ/יַד מֹשֶֽׁה־־׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/009.yaml
  text: So the sons of Reuben and the sons of Gad and the half-tribe of Manasseh returned and departed from the sons of Israel[a], from Shiloh, which is in the land of Canaan, to go to the land of Gilead, to the land of their possession, which they had taken possession of by the command of Yahweh through Moses.
translation:
  language: zh_hans
  text: 于是，吕便子孙、迦得子孙和玛拿西半个支派离开以色列人，从迦南地的示罗返回，前往基列地，就是他们的产业之地；他们照耶和华借着摩西所下的命令，在这地得了产业[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在这地得了产业”也可译作“取得了那地”或“占有了那地”。原文动词既可侧重得到并持有土地，也可侧重实际取得其所有权。
    reason: 说明אֲשֶׁר נֹאחֲזוּ בָהּ的词义范围，保留受领、持有和取得之间的细微差别。
lexical_decisions:
- source_word: וַיָּשֻׁבוּ וַיֵּלְכוּ
  choice: 返回，往……去
  rationale: שׁוב表示返回，הלך表示前往。中文以“返回，往……去”保留两个动作及其方向，又避免生硬直译为“返回并行走”。
- source_word: בְּנֵי רְאוּבֵן וּבְנֵי גָד וַחֲצִי שֵׁבֶט הַמְנַשֶּׁה
  choice: 吕便子孙、迦得子孙和玛拿西半个支派
  rationale: “子孙”自然保留בני的亲族群体表达；“半个支派”准确对应חצי שבט。
- source_word: מֵאֵת בְּנֵי יִשְׂרָאֵל
  choice: 离开以色列人
  rationale: מֵאֵת在此表示与以色列会众分离；“离开以色列人”比逐字译为“从以色列子孙那里”更符合现代汉语。
- source_word: מִשִּׁלֹה אֲשֶׁר בְּאֶרֶץ כְּנָעַן
  choice: 从迦南地的示罗
  rationale: 以简洁的定语结构表达原文关系从句，同时完整保留示罗位于迦南地的地理说明。
- source_word: אֶל אֶרֶץ הַגִּלְעָד
  choice: 往基列地去
  rationale: 保留אֶרֶץ的领土含义，并在中文中明确行程方向。
- source_word: אֶל אֶרֶץ אֲחֻזָּתָם
  choice: 回到他们的产业之地
  rationale: אֲחֻזָּה指依法持有、承受的土地产业；“产业之地”保留其领土和权属意味。“回到”结合上文שׁוב所表达的返归方向。
- source_word: אֲשֶׁר נֹאחֲזוּ בָהּ
  choice: 已经取得了那地
  rationale: אחז的尼法勒式在此可表示取得、承受或持有土地。“取得了那地”通顺且保留实际获得土地的含义；其可能偏重受领或占有的差异由脚注说明。
- source_word: עַל פִּי יְהוָה
  choice: 照耶和华……所下的命令
  rationale: עַל־פִּי是“按照……的吩咐/命令”的惯用语；“照……所下的命令”准确表达权威来源。
- source_word: בְּיַד מֹשֶׁה
  choice: 借着摩西
  rationale: בְּיַד在此表示中介或代理；“借着摩西”保留命令由摩西传达的意思。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。采用现代中文圣经读者最熟悉的专名“耶和华”，而不以“主”替代，从而保留其作为立约神名的性质；“雅威”是较接近学界重建读音的可行译名。
- issue: 以色列各支派取得土地的方式
  choice: 照耶和华借着摩西所下的命令，已经取得了那地
  alternative: 照耶和华借着摩西所下的命令，在那地得了产业
  rationale: 原文将土地权属置于耶和华的命令之下，却未在此句细分神赐、受领与实际占有之间的关系。正文和脚注共同保留这一语义张力，不增添特定的土地神学解释。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“子孙”“支派”“产业之地”等词保留叙事的历史与土地权属色彩；调整部分希伯来语语序，使长句在中文中清楚易读，同时不消除原文有关取得或承受土地的词义弹性。
