id: JOS.22.18
reference: Joshua 22:18
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/אַתֶּם֙ תָּשֻׁ֣בוּ הַ/יּ֔וֹם מֵ/אַחֲרֵ֖י יְהוָ֑ה וְ/הָיָ֗ה אַתֶּ֞ם תִּמְרְד֤וּ הַ/יּוֹם֙ בַּֽ/יהוָ֔ה וּ/מָחָ֕ר אֶֽל כָּל עֲדַ֥ת יִשְׂרָאֵ֖ל יִקְצֹֽף־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/018.yaml
  text: And you are turning away today from following Yahweh[a]; and if you rebel today against Yahweh[c][b], tomorrow he will be angry with the whole congregation of Israel.
translation:
  language: zh_hans
  text: 你们今天竟转离耶和华，不再跟从他[a]；你们今天若背叛耶和华，明天他[b]就会向以色列全会众发怒。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “转离……不再跟从”所译的希伯来语，字面可理解为“从耶和华后面转回”；这里是指离弃他、停止跟从他。
    reason: lexical_alternative
  - marker: b
    text: 原文只说“他会发怒”；按上下文，“他”指耶和华。
    reason: implicit_subject
lexical_decisions:
- source_word: תָּשֻׁבוּ
  choice: 转离
  rationale: שׁוב本可表示“返回、转回”，但与מֵאַחֲרֵי（“从……后面”）连用时，语境所指是背离、不再跟从。译作“转离”既保留转向的意象，也符合这里指责不忠的语气。
- source_word: מֵאַחֲרֵי יְהוָה
  choice: 离开耶和华，不再跟从他
  rationale: 希伯来语直译为“从耶和华后面离开”，是停止跟从他的惯用表达。中文以“不再跟从他”自然传达其含义。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的神圣名译法，同时将其作为专名处理。
- source_word: וְהָיָה
  choice: 若……就会
  rationale: 字面可作“事情将是”，但在这里引出带条件性质的警告；中文用“若……就会”清楚表达句法关系，又不削弱后果的确定性。
- source_word: תִּמְרְדוּ
  choice: 背叛
  rationale: מרד指反抗合法权威，在本段具有盟约不忠的分量。“背叛”简洁有力，也比一般的“不顺从”更贴近原文。
- source_word: בַּיהוָה
  choice: 背叛耶和华
  rationale: 介词ב与מרד搭配时具有敌对意义，即“背叛、反抗耶和华”，不按其常见空间义硬译为“在……里面”。
- source_word: וּמָחָר
  choice: 明天
  rationale: 保留原文紧迫的时间推进，表示今日的背叛将迅速招致群体性的后果。
- source_word: יִקְצֹף
  choice: 他就会……发怒
  rationale: קצף表示发怒、震怒。中文“发怒”庄重自然；动词的隐含主语由上下文确定为耶和华。
- source_word: כָּל עֲדַת יִשְׂרָאֵל
  choice: 以色列全会众
  rationale: עֵדָה指作为整体聚集的盟约群体。“全会众”保留其群体性和宗教共同体色彩，且符合现代中文表达。
theological_decisions:
- issue: יִקְצֹף的隐含主语
  choice: 以“他”指耶和华
  alternative: 不明确指出主语，译为“必有震怒临到”
  rationale: 紧接的上文两次提到耶和华，背叛的对象也是耶和华，因此最自然的隐含主语是耶和华。保留代词“他”，既符合原文未再次明说神名的形式，也清楚呈现上下文所指。
- issue: 个人行为与全体会众受怒的张力
  choice: 直译为耶和华向“以色列全会众”发怒
  alternative: 解释为全体会众因部分人的罪而受惩罚
  rationale: 原文明确并置少数人的背叛与全体会众承受怒气，却没有在本节解释机制。译文保留这种盟约群体责任的张力，不加入额外神学说明。
- issue: 首句的陈述或反问语气
  choice: 按带责问色彩的陈述译为“竟转离”
  alternative: 译成明确问句：“你们今天竟要……吗？”
  rationale: 上下文带强烈责问语气，但希伯来文本本节没有显式疑问词。采用“竟”传达责问，同时不以问号过度确定其句式。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。“竟”承载原文语境中的责问和震惊；分号保留两个紧密相连的警告。神名译为“耶和华”，“全会众”保留以色列作为整体共同体的含义。
