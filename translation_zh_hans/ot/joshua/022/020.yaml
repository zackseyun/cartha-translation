    issue: “当毁灭之物”的术语表达不够自然
    rationale: 该表达在现代汉语中结构生硬，且“当”与“毁灭”的关系可能造成歧义。“当灭之物”更符合汉语圣经语体，也保留ḥērem所指受禁、当毁灭之物的类别。
  - severity: low
    issue: 后半句加入了让步式逻辑
    rationale: “虽只是一个人，却……”使“只是一个人”成为让步前提；希伯来文是“他，一个人，并没有……独自灭亡”的陈述，宜避免额外强化的让步关系。
