base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/020.yaml
  text: Was it not Achan son of Zerah who acted unfaithfully in the matter of what was devoted to destruction, and wrath came upon all the congregation of Israel? Yet he was not the only man who perished in his iniquity.
translation:
  language: zh_hans
  text: 谢拉的儿子亚干，岂不是在当灭之物的事上行了背信的事，以致烈怒临到以色列全会众吗？但他一人并非独自在自己的罪孽中灭亡。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מָעַל מַעַל
  choice: 背信
  rationale: 该词根表示违背信任或盟约责任；重叠结构加强陈述，现代汉语以“背信”自然表达其严肃含义。
- source_word: בַחֵרֶם
  choice: 在当毁灭之物的事上
  rationale: חֵרֶם在此指奉献归神、因而必须毁灭之物；结合亚干事件，用“当毁灭之物”保留其处置含义，并以“在……的事上”表达希伯来语介词结构。
- source_word: קָצֶף
  choice: 烈怒
  rationale: 表达临到全会众的强烈忿怒，不额外明说施怒者，以保留原文在本句中的省略。
- source_word: גָוַע
  choice: 灭亡
  rationale: 该动词意为死亡、气绝；语境强调罪所带来的死亡后果，“灭亡”比单纯“死”更符合本句语气。
- source_word: בַעֲוֹנוֹ
  choice: 在自己的罪孽中
  rationale: 保留介词ב的表达张力，既可涉及因罪孽而死，也可指在罪责及其后果之中灭亡。
theological_decisions:
- issue: 亚干是否独自灭亡
  choice: 他虽只是一个人，却不是独自在自己的罪孽中灭亡的
  alternative: 他不是唯一因自己罪孽而灭亡的人
  rationale: 原文先强调“他是一个人”，继而否定他独自死亡；所选译法保留个人犯罪与群体受累之间的张力，不明确限定其他死者是谁。
- issue: 烈怒的施行者
  choice: 烈怒临到以色列全会众
  alternative: 上帝向以色列全会众发怒
  rationale: 原文只说“有烈怒临到”，未在本句明说主语，因此不补入“上帝”，避免超出明文。
translation_notes:
  register: 采用庄重而通顺的现代标准普通话。“当毁灭之物”承接约书亚记中חֵרֶם的专门语境；反问句和后半句的转折均予保留。
