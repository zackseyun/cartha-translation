  yaml_path: translation/ot/joshua/022/026.yaml
  text: So we said[b][a], ‘Let us now build for ourselves the altar—not for burnt offering and not for sacrifice.’
translation:
  language: zh_hans
  text: 所以我们说[a]：‘我们现在为自己筑这座坛吧[b]，不是为献燔祭，也不是为献祭。’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “所以”也可译作“于是”或“我们便说”。希伯来语连词可按本句与上文联系的紧密程度作不同表达。
    reason: lexical_alternative
  - marker: b
    text: 希伯来语直译为“我们为自己做吧，来筑这座坛”，是表示“我们为自己筑这座坛吧”的惯用说法。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַנֹּאמֶר
  choice: 所以我们说
  rationale: 该词是 אמר 的第一人称复数连续式，承接上文并引出众人的解释；“所以”自然表达这里的承接及推论意味，同时脚注保留其他可能译法。
- source_word: נַעֲשֶׂה נָּא לָנוּ לִבְנוֹת
  choice: 我们现在为自己筑……吧
  rationale: נַעֲשֶׂה 是第一人称复数意愿式，连同 נָּא 表达提议或决意；לִבְנוֹת 说明所要做的是建造。汉语用“筑……吧”自然体现提议语气，“现在”表达 נָּא 在此的敦促意味，“为自己”保留 לָנוּ 的受益含义。
- source_word: אֶת הַמִּזְבֵּחַ
  choice: 这座坛
  rationale: 定冠词表明是上下文所谈论的特定祭坛；现代汉语用“这座坛”比生硬的“那坛”或“该坛”更自然地体现其特指性。
- source_word: לֹא לְעוֹלָה
  choice: 不是为献燔祭
  rationale: עֹלָה 指全牲焚烧的祭，采用汉语圣经语汇中清楚而简洁的“燔祭”；介词 לְ 表明建坛并非用于此目的。
- source_word: וְלֹא לְזָבַח
  choice: 也不是为献别的祭
  rationale: זֶבַח 是较广义的祭牲或献祭，但在与燔祭并列时可指燔祭以外的祭。译作“别的祭”既避免汉语中“燔祭”和泛称“祭”形成表面重叠，也不将其过度限定为某一种祭。
theological_decisions:
- issue: זֶבַח 与 עֹלָה 的关系
  choice: 也不是为献别的祭
  alternative: 也不是为献祭
  rationale: 原文将燔祭与 זֶבַח 并列，重点是否认这坛具有献祭用途。“别的”在汉语中说明后者与前述燔祭有别，却不把 זֶבַח 锁定为某一特定祭类，保留原文概括性的张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“筑坛”符合汉语宗教及历史叙事语境；句式保留群体自述和否认祭祀用途的强调。所有脚注标记均置于正文相应位置。
