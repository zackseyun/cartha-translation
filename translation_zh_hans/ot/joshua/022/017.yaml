  text: הַ/מְעַט לָ֨/נוּ֙ אֶת עֲוֺ֣ן פְּע֔וֹר אֲשֶׁ֤ר לֹֽא הִטַּהַ֨רְנוּ֙ מִמֶּ֔/נּוּ עַ֖ד הַ/יּ֣וֹם הַ/זֶּ֑ה וַ/יְהִ֥י הַ/נֶּ֖גֶף בַּ/עֲדַ֥ת יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/017.yaml
  text: Was the iniquity of Peor too little for us[a], from which we have not cleansed ourselves to this day[b], and the plague came upon the congregation of Yahweh?
translation:
  language: zh_hans
  text: 毗珥[b]的罪孽对我们还算小吗[a]？直到今日，我们还没有从这事中洁净自己，而灾疫曾临到耶和华的会众。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “罪孽”也可译作“罪责”；希伯来语עָוֹן还可延伸指罪责所带来的后果。
    reason: lexical_alternative
  - marker: b
    text: 希伯来原文作“毗珥”；相关经文中也有较完整的名称“巴力·毗珥”。
    reason: cross_reference
lexical_decisions:
- source_word: הַמְעַט לָנוּ
  choice: 对我们来说难道还算小吗
  rationale: 保留原文反问的责备语气；“难道……还算小吗”是自然的现代汉语表达，并未把问题改写成直陈句。
- source_word: עֲוֺן
  choice: 罪孽
  rationale: 该词可指罪行、罪责，也可延伸指罪所招致的后果；正文用“罪孽”保留其道德与群体性的分量，并在脚注说明歧义。
- source_word: פְּעוֹר
  choice: 毗珥
  rationale: 原文仅作“毗珥”，没有写“巴力·毗珥”，因此不从相关经文补入较完整的名称。
- source_word: אֲשֶׁר לֹא הִטַּהַרְנוּ מִמֶּנּוּ
  choice: 我们还没有从那罪孽中洁净自己
  rationale: התפעל词形具有反身意味；“洁净自己”既保留礼仪与道德洁净的语感，也准确表达群体尚未脱离其污秽。
- source_word: עַד הַיּוֹם הַזֶּה
  choice: 直到今日
  rationale: 采用庄重而清楚的现代汉语惯用语，表示其影响延续到说话者的当下。
- source_word: וַיְהִי הַנֶּגֶף
  choice: 并且灾疫曾临到
  rationale: וַיְהִי叙述已经发生的事件；“曾临到”清楚回指毗珥事件。未加入原文没有明说的“然而”。
- source_word: בַּעֲדַת יְהוָה
  choice: 耶和华的会众
  rationale: עֵדָה指以色列的群体性会众；直译神名为“耶和华”，并以“会众”保留盟约共同体的含义。
theological_decisions:
- issue: עֲוֺן在毗珥事件中的所指
  choice: 正文译“罪孽”
  alternative: 罪责；罪孽所招致的惩罚
  rationale: 上下文同时涉及犯罪、尚未洁净及灾疫后果。正文不把该词限缩为单一层面，脚注则保留其真实的语义幅度。
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 上主
  rationale: 原文明确使用四字神名；“耶和华”是现代简体中文圣经语境中可辨识的专名译法，避免以称号取代原文专名。
- issue: 灾疫分句与前文的逻辑关系
  choice: 译作“并且”，不增添转折副词
  alternative: 然而灾疫曾临到
  rationale: 原文以וַ连接并陈述灾疫发生，并未明确标示转折。保留并列关系，避免替读者消解其修辞张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以“难道……还算小吗”传达反问责备，以“洁净自己”“会众”保留原文的礼仪和群体语域；句间标点使长句清晰，同时维持各分句之间的紧密联系。
