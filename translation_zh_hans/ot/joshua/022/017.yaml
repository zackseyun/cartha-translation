  source_fidelity: 正文基本忠实于希伯来文：保留了反问、‘毗珥’而非擅加‘巴力’、反身性的‘洁净自己’、持续至今的时间语及灾疫临到耶和华会众。惟‘从那罪孽中洁净自己’将关系代词所指的‘毗珥（事件／罪污）’收窄并重复解释为‘罪孽’，宜改为‘从这事中洁净自己’，既自然也保留原文指涉的概括性。
  naturalness: ‘对我们来说难道还算小吗’可懂，但‘这毗珥的罪孽对我们还算小吗’更凝练、自然，并保留责问语气。‘并且灾疫曾临到’忠实但句法略显生硬；在本节紧密的回顾语境中，‘而灾疫曾临到’自然地连接两项陈述，不添加‘然而／竟然’一类原文未明示的转折。
