source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר פִּֽינְחָ֣ס בֶּן אֶלְעָזָ֣ר הַ/כֹּהֵ֡ן אֶל בְּנֵי רְאוּבֵ֨ן וְ/אֶל בְּנֵי גָ֜ד וְ/אֶל בְּנֵ֣י מְנַשֶּׁ֗ה הַ/יּ֤וֹם יָדַ֨עְנוּ֙ כִּֽי בְ/תוֹכֵ֣/נוּ יְהוָ֔ה אֲשֶׁ֛ר לֹֽא מְעַלְתֶּ֥ם בַּֽ/יהוָ֖ה הַ/מַּ֣עַל הַ/זֶּ֑ה אָ֗ז הִצַּלְתֶּ֛ם אֶת בְּנֵ֥י יִשְׂרָאֵ֖ל מִ/יַּ֥ד יְהוָֽה־־־־־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/031.yaml
  text: And Phinehas son of Eleazar the priest said to the sons of Reuben[a], and to the sons of Gad, and to the sons of Manasseh, “Today we know that Yahweh is among us, because you have not acted unfaithfully against Yahweh in this matter[c][b]. Then you have delivered the sons of Israel from the hand of Yahweh.”
translation:
  language: zh_hans
  text: 祭司以利亚撒的儿子非尼哈对流便人、迦得人和玛拿西人说：“今天我们知道，耶和华在我们中间，因为你们没有在这件事上背叛耶和华[a]。这样，你们就救了以色列人脱离耶和华的手[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“你们没有以这背叛之举背叛耶和华”；同源词的重复强调对盟约的失信或背弃。
    reason: lexical_alternative
  - marker: b
    text: “脱离耶和华的手”是希伯来语表达，意思是免受耶和华权能所施的惩罚或审判。
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: 希伯来语叙事中的连续式在此引出直接引语；现代汉语无需机械译出连接词。
- source_word: פִּינְחָס בֶּן אֶלְעָזָר הַכֹּהֵן
  choice: 祭司以利亚撒的儿子非尼哈
  rationale: 按自然汉语语序清楚表达身份关系；“祭司”修饰以利亚撒。
- source_word: אֶל בְּנֵי רְאוּבֵן וְאֶל בְּנֵי גָד וְאֶל בְּנֵי מְנַשֶּׁה
  choice: 对吕便人、迦得人和玛拿西人
  rationale: 此处“众子”指各支派成员，译为族名加“人”比逐字译作“儿子们”更符合现代汉语，同时保留三个群体。
- source_word: הַיּוֹם יָדַעְנוּ
  choice: 今天我们知道
  rationale: 保留“今天”的即时确认意味；完成式在语境中表达当前已经获得的确知。
- source_word: בְּתוֹכֵנוּ
  choice: 在我们中间
  rationale: 自然表达耶和华临在于群体之中，不将其误解为个体内部的临在。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经语境中通行的神圣名字译法。
- source_word: מְעַלְתֶּם בַּיהוָה הַמַּעַל הַזֶּה
  choice: 在这件事上背叛耶和华
  rationale: מעל及其同源名词表示失信、悖逆或破坏盟约忠诚；“背叛”保留其严肃分量，又避免生硬重复同源词。
- source_word: אָז
  choice: 这样
  rationale: 此处承接前述事实，表示由此产生的结果；“这样”在汉语中兼顾推论和结果，不把逻辑关系规定得过强。
- source_word: הִצַּלְתֶּם אֶת בְּנֵי יִשְׂרָאֵל
  choice: 你们就救以色列人
  rationale: 使役形式表达使人脱离危险；“救”简洁保留行动结果。
- source_word: מִיַּד יְהוָה
  choice: 脱离了耶和华的手
  rationale: 保留希伯来语“从某人的手中”的具体意象，并以脚注说明这里所指的权能或审判。
theological_decisions:
- issue: 耶和华临在的陈述
  choice: 耶和华在我们中间
  alternative: 耶和华与我们同在
  rationale: 原文具体说“在我们中间”；所选译法保留群体性的临在陈述，不引入超出本节的神学解释。
- issue: מעל所表达的罪责性质
  choice: 背叛耶和华
  alternative: 得罪耶和华；对耶和华不忠
  rationale: 上下文涉及被怀疑的宗教叛离和群体盟约危机；“背叛”传达失信的严重性，但脚注仍提示原文同源词的强调。
- issue: “耶和华的手”的含义
  choice: 正文保留原文意象
  alternative: 免受耶和华的审判
  rationale: 原文没有直接出现“审判”一词，虽在语境中明显暗示神的惩罚；保留“手”可避免把暗示变成明说，并由脚注帮助读者理解。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。支派名称依中文圣经通行译名；避免逐字复制希伯来语连接词和同源词重复，但通过脚注保留其语言与神学分量。
