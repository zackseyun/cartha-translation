- from: 祭司以利亚撒的儿子非尼哈对吕便人、迦得人和玛拿西人说：“今天我们知道，耶和华在我们中间，因为你们没有在这件事上背叛耶和华[a]。这样，你们就救以色列人脱离了耶和华的手[b]。”
  to: 祭司以利亚撒的儿子非尼哈对流便人、迦得人和玛拿西人说：“今天我们知道，耶和华在我们中间，因为你们没有在这件事上背叛耶和华[a]。这样，你们就救了以色列人脱离耶和华的手[b]。”
  rationale: 仅作两项安全修订：将非通行的“吕便”更正为“流便”，并在末句补足“救了”以使既成行动的汉语表达自然。其余措辞、原文意象及脚注均保留。
