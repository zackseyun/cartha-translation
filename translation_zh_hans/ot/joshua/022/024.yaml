  text: וְ/אִם לֹ֤א מִ/דְּאָגָה֙ מִ/דָּבָ֔ר עָשִׂ֥ינוּ אֶת זֹ֖את לֵ/אמֹ֑ר מָחָ֗ר יֹאמְר֨וּ בְנֵי/כֶ֤ם לְ/בָנֵ֨י/נוּ֙ לֵ/אמֹ֔ר מַה לָּ/כֶ֕ם וְ/לַֽ/יהוָ֖ה אֱלֹהֵ֥י יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/024.yaml
  text: No, rather, we did this out of anxious concern, saying, ‘In time to come your children may say to our children, “What have you to do with the LORD, the God of Israel?”’
translation:
  language: zh_hans
  text: 不是！我们做这事，只是因为担心一件事，心想：“日后[a]你们的子孙可能会对我们的子孙说：‘你们跟耶和华——以色列的神有什么关系？’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “日后”原文直译为“明日”。
    reason: 说明该词的字面形式，同时正文按语境表达其将来意义。
lexical_decisions:
- source_word: מִדְּאָגָה מִדָּבָר
  choice: 因为担心一件事
  rationale: 该短语直指因某事而产生的忧虑或顾虑；译文保留“担心”及“一件事”两层含义，同时符合现代汉语表达。
- source_word: מָחָר
  choice: 日后
  rationale: 字面义是“明日”，在这里指将来的某个时候；正文采用自然的语境义，并用脚注保留字面信息。
- source_word: מַה־לָּכֶם וְלַיהוָה
  choice: 你们跟耶和华……有什么关系
  rationale: 这是希伯来语关系性习语，表达双方有何关联或共同之处；此译法保留原句带有排斥意味的反问，不进一步限定其含义。
- source_word: יְהוָה אֱלֹהֵי יִשְׂרָאֵל
  choice: 耶和华——以色列的神
  rationale: 以“耶和华”呈现神的专名，并用破折号表达后置同位说明。
theological_decisions:
- issue: 开头 וְאִם לֹא 的誓言式或强烈否定结构
  choice: 不是！……只是……
  alternative: 若不是……
  rationale: 结合上文的自证语境，此处是强烈否认错误动机并陈明真正原因；译为“不是！……只是……”既传达语用力量，也避免把它误读成普通条件句。
- issue: “与你们和耶和华有什么关系”的范围
  choice: 保留为关系性反问
  alternative: 你们无权敬拜耶和华
  rationale: 原文没有明确说明这种“关系”仅指敬拜权、盟约身份或土地归属，因此不在正文中替读者作神学限定。
translation_notes:
  register: 采用现代、庄重而口语可懂的叙事语言。“心想”自然引出所担忧的未来言论；内外层引号清楚呈现引语层级。
