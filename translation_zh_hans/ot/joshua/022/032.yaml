  text: וַ/יָּ֣שָׁב פִּֽינְחָ֣ס בֶּן אֶלְעָזָ֣ר הַ/כֹּהֵ֣ן וְ/הַ/נְּשִׂיאִ֡ים מֵ/אֵ֣ת בְּנֵֽי רְאוּבֵן֩ וּ/מֵ/אֵ֨ת בְּנֵי גָ֜ד מֵ/אֶ֧רֶץ הַ/גִּלְעָ֛ד אֶל אֶ֥רֶץ כְּנַ֖עַן אֶל בְּנֵ֣י יִשְׂרָאֵ֑ל וַ/יָּשִׁ֥בוּ אוֹתָ֖/ם דָּבָֽר־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/032.yaml
  text: Then Phinehas son of Eleazar the priest[a], and the leaders, returned from the sons of Reuben and from the sons of Gad, from the land of Gilead to the land of Canaan, to the sons of Israel[b], and brought back word to them.
translation:
  language: zh_hans
  text: 祭司以利亚撒的儿子非尼哈和众首领从流便子孙和迦得子孙那里，从基列地回到迦南地的以色列人[b]那里，把消息[a]带回给他们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “消息”也可译作“事情”或“报告”；希伯来语 דָּבָר 可按语境表示“话”“事情”或“报告”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来语直译“以色列的子孙”，这里指以色列人。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: 回到
  rationale: שׁוב在叙事中表示返回；“回到……那里”自然表达了目的地，同时与句末“带回”形成原文所含的返回意象。
- source_word: פִּינְחָס בֶּן אֶלְעָזָר הַכֹּהֵן
  choice: 祭司以利亚撒的儿子非尼哈
  rationale: 按希伯来语短语结构，将“祭司”理解为对以利亚撒的称谓；中文如此排列可清楚表达其父系身份和职分。
- source_word: וְהַנְּשִׂיאִים
  choice: 和众首领
  rationale: נְשִׂיאִים在此指各支派的领导者；“首领”庄重、清楚，也不暗示君王身份。
- source_word: מֵאֵת בְּנֵי רְאוּבֵן וּמֵאֵת בְּנֵי גָד
  choice: 离开吕便子孙和迦得子孙
  rationale: מֵאֵת在此表达从这些人那里离开；保留“子孙”的支派称谓，反映原文重复的בְּנֵי结构。
- source_word: מֵאֶרֶץ הַגִּלְעָד אֶל אֶרֶץ כְּנַעַן
  choice: 从基列地回到迦南地
  rationale: 保留两处“地”，呈现原文基列与迦南之间明确的地域对照。
- source_word: אֶל בְּנֵי יִשְׂרָאֵל
  choice: 到……以色列人那里
  rationale: 此处בְּנֵי יִשְׂרָאֵל是对以色列群体的惯用称呼；正文采用现代汉语自然的“以色列人”，脚注说明其字面形式。
- source_word: וַיָּשִׁבוּ אוֹתָם דָּבָר
  choice: 将消息带回给他们
  rationale: 该表达含有把话或报告带回去的意思；“消息”符合语境，也保留דָּבָר可指话语、事情或报告的语义空间。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。保留“吕便子孙和迦得子孙”以反映支派称谓及原文的重复结构；将“以色列的子孙”正文译为更自然的“以色列人”，并在脚注交代字面形式。
