source:
  edition: WLC
  text: וּ/גְב֣וּל נָֽתַן יְ֠הוָה בֵּינֵ֨/נוּ וּ/בֵינֵי/כֶ֜ם בְּנֵי רְאוּבֵ֤ן וּ/בְנֵי גָד֙ אֶת הַ/יַּרְדֵּ֔ן אֵין לָ/כֶ֥ם חֵ֖לֶק בַּֽ/יהוָ֑ה וְ/הִשְׁבִּ֤יתוּ בְנֵי/כֶם֙ אֶת בָּנֵ֔י/נוּ לְ/בִלְתִּ֖י יְרֹ֥א אֶת יְהוָֽה־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/025.yaml
  text: For Yahweh has made the Jordan a boundary between us and you[a], sons of Reuben and sons of Gad. You have no portion in Yahweh. And so your sons might cause our sons to stop fearing Yahweh.
translation:
  language: zh_hans
  text: 因为雅威把约旦河定为我们和你们之间的界线，鲁本的子孙和迦得的子孙啊，你们在雅威那里没有份[a]。这样，你们的子孙就会使我们的子孙不再敬畏雅威。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “没有份”也可译作“无分”或“没有产业”。
    reason: 说明חֵלֶק的词义范围；原文可能指份额、产业或归属，不宜在正文中强行限定。
lexical_decisions:
- source_word: וּגְבוּל נָתַן
  choice: 把……定为……界线
  rationale: גְּבוּל指边界或界线；נָתַן在这一搭配中表示设立、定为。“定为……界线”既贴近原文，也符合现代汉语表达。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文四字神名的读音转写为“雅威”，保留其作为神圣专名的性质，不以称号替代。
- source_word: אֶת הַיַּרְדֵּן
  choice: 约旦河
  rationale: 专名הַיַּרְדֵּן在现代汉语中通常译作“约旦河”；补出“河”可避免地名含混。
- source_word: בְּנֵי רְאוּבֵן וּבְנֵי גָד
  choice: 吕便子孙和迦得子孙
  rationale: 保留בְּנֵי“子孙”的支派称谓，并把这一短语按语境理解为对河东支派的呼语。
- source_word: אֵין לָכֶם חֵלֶק בַּיהוָה
  choice: 你们在雅威那里无分
  rationale: חֵלֶק可指份、分或产业。“在雅威那里无分”保留原文关系表达的开放性，不把它限定为土地产业或宗教参与权。
- source_word: וְהִשְׁבִּיתוּ
  choice: 就会使……不再
  rationale: שבת的使役式表示“使停止”。“使……不再”自然表达所担忧的后果；“会”体现语境中的未来结果。
- source_word: לְבִלְתִּי יְרֹא אֶת יְהוָה
  choice: 不再敬畏雅威
  rationale: לְבִלְתִּי与使役动词共同表达停止敬畏；יָרֵא用于神时兼有畏惧与尊崇之意，“敬畏”是准确而自然的汉语表达。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文使用神的专名，而非“主”这一称号；“雅威”较直接地反映通常重构的读音Yahweh，也避免采用源自Jehovah的传统形式。
- issue: “在雅威那里无分”的含义
  choice: 保留“无分”的宽泛表达
  alternative: 在雅威那里没有产业；与雅威没有关系
  rationale: חֵלֶק既可带有份额、产业的意味，也可能指参与或归属。正文不把这句话收窄为单一神学解释。
- issue: 后代造成的结果是确定还是可能
  choice: 就会使
  alternative: 可能会使
  rationale: וְהִשְׁבִּיתוּ在叙述的假设情境中指预期后果。译作“就会使”保持原句力度，同时其可能性已由上下文所设想的未来话语体现。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“吕便子孙和迦得子孙啊”保留原文呼语色彩；“在雅威那里无分”刻意保留契约归属与产业份额之间的张力。
