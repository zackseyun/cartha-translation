base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/034.yaml
  text: And the sons of Reuben and the sons of Gad called the altar Witness[a], for it is a witness between us that Yahweh is God.
translation:
  language: zh_hans
  text: 吕便子孙和迦得子孙给那座坛起名叫“见证”[a]，因为它是我们之间的见证，证明雅威是上帝。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们给那座坛起名叫‘我们之间的见证：雅威是上帝’。”这种理解把后面的解释也看作坛名的一部分。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקְרְאוּ
  choice: 起名叫
  rationale: קרא 与介词 ל 连用，在这里表示给某物命名；“起名叫”自然且明确体现命名含义。
- source_word: בְּנֵי רְאוּבֵן וּבְנֵי גָד
  choice: 吕便子孙和迦得子孙
  rationale: 保留希伯来文“某某之子”的群体表达，同时用现代汉语常见的“子孙”指部族后裔。
- source_word: לַמִּזְבֵּחַ
  choice: 那座坛
  rationale: מִזְבֵּחַ 指祭坛；上下文已有特定对象，汉语用“那座坛”自然，也保留其具体所指。
- source_word: עֵד
  choice: 见证
  rationale: 该词可指“见证”或“证人”；坛作为标志承担证明作用，译作“见证”最直接，并适合作为坛名。
- source_word: כִּי עֵד הוּא בֵּינֹתֵינוּ
  choice: 因为它在我们中间作见证
  rationale: 第一个 כִּי 自然理解为说明命名缘由；בֵּינֹתֵינוּ 表示各方之间，在汉语中“在我们中间”通顺。
- source_word: כִּי יְהוָה הָאֱלֹהִים
  choice: 证明耶和华是上帝
  rationale: 第二个 כִּי 引出见证的内容；补出“证明”使汉语句法清楚，而不增加见证内容。神名 יהוה 音义传统在现代中文圣经语境中以“耶和华”表达，הָאֱלֹהִים 依其表语功能译为“上帝”。
theological_decisions:
- issue: 坛名是否包括后面的整个解释性从句
  choice: 正文只把“见证”作为坛名，后句作为命名理由和见证内容
  alternative: 把整句理解为名称：“在我们中间证明耶和华是上帝的见证”
  rationale: 马所拉文本明确出现名词 עֵד，随后以 כִּי 从句解释；但句法也容许把解释语视为扩展名称。正文采取较少增补的读法，脚注保留另一可能。
- issue: יהוה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 以现代简体中文普通读者最熟悉的专名形式呈现四字神名，同时不以“主”这一称号取代原文专名。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“起名叫”清楚传达命名动作；“作见证，证明……”使两个 כִּי 的关系在中文中明晰。保留原文关于坛名范围的歧义，并以脚注交代。
