  yaml_path: translation/ot/joshua/022/006.yaml
  text: Then Joshua blessed them and sent them away[a], and they went to their tents.
translation:
  language: zh_hans
  text: 于是，约书亚为他们祝福，打发他们离去[a]；他们就往自己的帐篷去了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “打发他们离去”也可译作“送他们走”。
    reason: 说明וַיְשַׁלְּחֵם在此处遣散、送离的语境译法。
lexical_decisions:
- source_word: וַיְבָרְכֵם
  choice: 为他们祝福
  rationale: 此处比厄勒式表达约书亚为即将离去的人祝福；“为他们祝福”自然、庄重，也保留了正式祝福的动作。
- source_word: יְהוֹשֻׁעַ
  choice: 约书亚
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: וַיְשַׁלְּחֵם
  choice: 打发他们离去
  rationale: שׁלח在此表示准许并送他们离开；“打发他们离去”贴合上下文，且比单纯“派遣”更能表达遣散返程之意。
- source_word: וַיֵּלְכוּ
  choice: 他们就……去了
  rationale: הלך是普通的“去、行走”；译文不把动词本身解释成“返回”，而以目的地和中文趋向表达构成自然句子。
- source_word: אֶל
  choice: 回到
  rationale: 介词本身表示朝向目的地；结合中文“自己的帐篷”这一归属性目的地，用“回到”自然表达移动方向，但返归意味主要来自语境，故保留脚注说明相关词义。
- source_word: אָהֳלֵיהֶם
  choice: 自己的帐篷
  rationale: 保留אֹהֶל的本义“帐篷”；在语境中也可能转指住处或家，因此加脚注呈现这一词义幅度。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“于是……就……”呈现希伯来语连续叙事的推进；“为他们祝福”避免生硬的“祝福他们”，“帐篷”保留历史场景和原文意象。
