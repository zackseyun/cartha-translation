language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כֹּ֣ה אָמְר֞וּ כֹּ֣ל עֲדַ֣ת יְהוָ֗ה מָֽה הַ/מַּ֤עַל הַ/זֶּה֙ אֲשֶׁ֤ר מְעַלְתֶּם֙ בֵּ/אלֹהֵ֣י יִשְׂרָאֵ֔ל לָ/שׁ֣וּב הַ/יּ֔וֹם מֵ/אַחֲרֵ֖י יְהוָ֑ה בִּ/בְנֽוֹתְ/כֶ֤ם לָ/כֶם֙ מִזְבֵּ֔חַ לִ/מְרָדְ/כֶ֥ם הַ/יּ֖וֹם בַּ/יהוָֽה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/016.yaml
  text: 'Thus says the whole congregation of Yahweh: ‘What is this breach of faith that you have committed against the God of Israel[a], turning away today from following Yahweh by building for yourselves an altar, rebelling today against Yahweh?’'
translation:
  language: zh_hans
  text: “耶和华全会众这样说：‘你们对以色列的上帝所犯的这种背信之罪[a]，究竟是怎么回事？你们今天转离耶和华，不再跟随他，以致为自己筑了一座坛，今天背叛耶和华！’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “背信之罪”也可译作“不忠”“失信”或“背信”。原文指向对圣约或敬拜应有忠诚的违背。
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמְרוּ
  choice: 这样说
  rationale: 保留使者宣告公式的庄重语气；希伯来语虽用完成式，汉语按直接引语习惯自然表达为“这样说”。
- source_word: כֹּל עֲדַת יְהוָה
  choice: 耶和华的全会众
  rationale: “会众”体现 עֵדָה 所指聚集的圣约群体，“全”保留 כֹּל 的整体性。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代简体中文圣经语域中广为人知的音译，保留此处的神圣专名而不改作称号。
- source_word: מָה הַמַּעַל הַזֶּה אֲשֶׁר מְעַלְתֶּם
  choice: 你们……所犯的这背信之罪，究竟是怎么回事
  rationale: 以“背信之罪”表达 מַעַל 在圣约和敬拜层面的不忠；“犯”与名词搭配，使同根词结构在汉语中自然清楚。
- source_word: בֵּאלֹהֵי יִשְׂרָאֵל
  choice: 对以色列的上帝
  rationale: מעל 与 ב 连用，在此表示不忠行为所冒犯的对象；“对……犯”符合现代汉语表达。
- source_word: לָשׁוּב הַיּוֹם מֵאַחֲרֵי יְהוָה
  choice: 今天转离耶和华，不再跟随他
  rationale: “转离”保留 שׁוב 的转向含义，“不再跟随”明示 מֵאַחֲרֵי 的跟随和效忠意象。
- source_word: בִּבְנוֹתְכֶם לָכֶם מִזְבֵּחַ
  choice: 你们竟为自己筑了一座坛
  rationale: 保留筑坛这一具体行为及 לָכֶם 的反身受益意味；“竟”自然传达质问中的震惊和指控语气。
- source_word: לִמְרָדְכֶם הַיּוֹם בַּיהוָה
  choice: 今天背叛耶和华
  rationale: מרד 表示反叛、抗命；在此“背叛”兼顾关系与权柄层面的严重性，并保留第二次“今天”的修辞重复。
theological_decisions:
- issue: מַעַל 所指的圣约性过犯
  choice: 背信之罪
  alternative: 不忠；奸诈；失信
  rationale: 该词在此不是泛指普通罪行，而是针对以色列的上帝在圣约和敬拜上的不忠。“背信之罪”保留其关系性和宗教性分量，又不预先裁定指控是否属实。
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威；主
  rationale: 原文直接使用四字神名。译作“耶和华”保留专名，并符合现代中文读者熟悉的庄重圣经语域；不以“主”替代专名。
- issue: 筑坛与转离、背叛之间的语法关系
  choice: 将筑坛呈现为被指控者转离并背叛的具体行为
  alternative: 将筑坛仅处理为同时发生的背景动作
  rationale: בִּבְנוֹתְכֶם 可表示手段或情状，לִמְרָדְכֶם 可表示目的或结果。译文维持指控中的紧密联系，但不额外断言他们筑坛时内心已有明确的叛逆目的。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“全会众”“筑坛”等词保留经文的群体与敬拜语域；重复两次“今天”，维持原文紧迫而严厉的修辞。
