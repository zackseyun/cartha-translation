  to: “耶和华全会众这样说：‘你们对以色列的上帝所犯的这种背信之罪[a]，究竟是怎么回事？你们今天转离耶和华，不再跟随他，以致为自己筑了一座坛，今天背叛耶和华！’”
  rationale: 修订保留原文的指控性而不判定其真伪，保留两次“今天”、神名及筑坛的具体行为；并以“以致”为筑坛与所指控的转离、背叛建立原文所示的紧密语法联系。
