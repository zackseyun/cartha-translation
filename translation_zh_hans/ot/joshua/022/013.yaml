  text: וַ/יִּשְׁלְח֨וּ בְנֵֽי יִשְׂרָאֵ֜ל אֶל בְּנֵי רְאוּבֵ֧ן וְ/אֶל בְּנֵי גָ֛ד וְ/אֶל חֲצִ֥י שֵֽׁבֶט מְנַשֶּׁ֖ה אֶל אֶ֣רֶץ הַ/גִּלְעָ֑ד אֶת פִּינְחָ֖ס בֶּן אֶלְעָזָ֥ר הַ/כֹּהֵֽן־־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/013.yaml
  text: Then the sons of Israel sent Phinehas son of Eleazar the priest to the sons of Reuben[a], to the sons of Gad, and to the half-tribe of Manasseh, in the land of Gilead.
translation:
  language: zh_hans
  text: 于是，以色列人差遣祭司以利亚撒的儿子非尼哈，到基列地的吕便人[a]、迦得人和玛拿西半支派那里。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“吕便的儿子们”；同样，“迦得人”直译“迦得的儿子们”。
    reason: 保留希伯来语 בְנֵי 的构式信息，同时正文采用现代汉语中自然的支派族称。
lexical_decisions:
- source_word: וַיִּשְׁלְחוּ
  choice: 于是……派
  rationale: 连续式叙事动词推进事件；“于是”自然表达承接关系，“派”符合差遣代表前往的语境。
- source_word: בְנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 此处指以色列群体；现代汉语用“以色列人”比直译“以色列的儿子们”自然且准确。
- source_word: אֶל בְּנֵי רְאוּבֵן וְאֶל בְּנֵי גָד
  choice: 去见吕便人、迦得人
  rationale: 介词 אֶל 表示差遣所指向的对象；“去见”在汉语中清楚表达前往这些支派那里，而族称采用自然的现代汉语形式。
- source_word: חֲצִי שֵׁבֶט מְנַשֶּׁה
  choice: 玛拿西半支派的人
  rationale: 保留“半支派”这一历史性划分，并补“的人”使其与前列对象在汉语句法中协调。
- source_word: אֶל אֶרֶץ הַגִּלְעָד
  choice: 到基列地
  rationale: אֶל 的基本方向义在此标明差遣的目的地；将地点提前至“去见”之前，使汉语表达顺畅，同时不把它误解为另一个受差遣对象。
- source_word: אֶת פִּינְחָס בֶּן אֶלְעָזָר הַכֹּהֵן
  choice: 祭司以利亚撒的儿子非尼哈
  rationale: אֶת 不译；按希伯来语最自然的句法，定冠词所限定的“祭司”可修饰以利亚撒，即“祭司以利亚撒的儿子非尼哈”。这一关系也符合上下文身份认定。
theological_decisions:
- issue: הַכֹּהֵן（“祭司”）修饰谁
  choice: 理解为修饰以利亚撒：“祭司以利亚撒的儿子非尼哈”
  alternative: 理解为修饰非尼哈：“以利亚撒的儿子祭司非尼哈”
  rationale: 紧邻关系及定冠词形式较自然地把“祭司”与以利亚撒相连；本节并未明确称非尼哈为祭司。此选择属于句法判断，不引入额外教义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。正文以自然汉语族称“以色列人、吕便人、迦得人”表达群体，并用脚注提示原文“儿子们”的构式；地名、人名采用常见中文圣经译名。
