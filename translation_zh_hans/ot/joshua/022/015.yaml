  text: And they came to the sons of Reuben[a], and to the sons of Gad, and to the half-tribe of Manasseh, in the land of Gilead, and they spoke with them, saying[b],
translation:
  language: zh_hans
  text: 他们来到吕便人、迦得人和玛拿西半支派那里，在基列地和他们交谈，说：
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: 他们来到
  rationale: בוא的Qal叙事形式表示来到、前往或抵达；“来到”自然保留了简明的移动含义。
- source_word: בְּנֵי רְאוּבֵן / בְּנֵי גָד
  choice: 吕便人、迦得人
  rationale: 字面为“吕便的众子、迦得的众子”，在支派语境中指这些支派的成员；现代汉语用“吕便人、迦得人”更自然，也不把所指不必要地限于直系儿子。
- source_word: חֲצִי שֵׁבֶט מְנַשֶּׁה
  choice: 玛拿西半支派
  rationale: 这是《约书亚记》中固定的支派称谓；“玛拿西半支派”简洁且贴近原文结构。
- source_word: אֶל אֶרֶץ הַגִּלְעָד
  choice: 基列地的……那里
  rationale: אֶל通常表示方向“到”，此处与前面的对象短语相连，并指出东岸诸支派所在之地；这样的汉语结构同时表达目的地和会面地点。
- source_word: וַיְדַבְּרוּ אִתָּם
  choice: 与他们说话
  rationale: דבר与אֵת搭配可表示“与某人说话”，保留直接交谈的意味；也可理解为“对他们说”。
- source_word: לֵאמֹר
  choice: 说
  rationale: 该不定式结构引出下一节的直接引语；汉语以“说”衔接，保留原文叙事公式，虽略有重复，却庄重清楚。
