  yaml_path: translation/ot/joshua/022/012.yaml
  text: When the sons of Israel heard[b][a], the whole congregation of the sons of Israel assembled at Shiloh to go up against them for war.
translation:
  language: zh_hans
  text: 以色列人听见了这事，以色列全会众就聚集在示罗，要上去攻打他们。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁמְעוּ
  choice: 听见了这事
  rationale: שׁמע在叙事中意为“听见”；中文需补出隐含宾语“这事”，承接上文而不增添具体内容。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 希伯来语字面为“以色列的儿子们”，在此是全体以色列民的常用称谓；“以色列人”是现代中文自然且准确的群体表达。
- source_word: וַיִּקָּהֲלוּ
  choice: 聚集
  rationale: קהל表示为共同目的聚集、集合；“聚集”简洁自然，也符合此处全会众采取公共行动的语境。
- source_word: כָּל עֲדַת בְּנֵי יִשְׂרָאֵל
  choice: 以色列全会众
  rationale: עֵדָה指作为整体的共同体或会众；“全会众”保留其群体性和כָּל所表达的整体范围。
- source_word: שִׁלֹה
  choice: 示罗
  rationale: 采用现代中文圣经地名的通行译名。
- source_word: לַעֲלוֹת עֲלֵיהֶם לַצָּבָא
  choice: 要上去攻打他们
  rationale: 短语字面为“上去对付他们，为要争战”，是发动军事行动的惯用表达；“上去攻打他们”保留עלה的方向性，同时自然传达לַצָּבָא的战争含义。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事文体。“以色列人”避免把希伯来习语“以色列的儿子们”生硬直译为仅指男性；末句用中文军事语境中自然的“上去攻打”，无需另加脚注。
