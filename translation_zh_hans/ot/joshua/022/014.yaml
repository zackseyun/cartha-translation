source:
  edition: WLC
  text: וַ/עֲשָׂרָ֤ה נְשִׂאִים֙ עִמּ֔/וֹ נָשִׂ֨יא אֶחָ֜ד נָשִׂ֤יא אֶחָד֙ לְ/בֵ֣ית אָ֔ב לְ/כֹ֖ל מַטּ֣וֹת יִשְׂרָאֵ֑ל וְ/אִ֨ישׁ רֹ֧אשׁ בֵּית אֲבוֹתָ֛/ם הֵ֖מָּה לְ/אַלְפֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/014.yaml
  text: and with him ten leaders[a], one leader for each ancestral house from all the tribes of Israel; and each of them was the head of his ancestral house among the thousands of Israel.
translation:
  language: zh_hans
  text: 又有十位首领同他一起前去；以色列各支派的父系家族各有一位首领。他们每一位都是以色列各千人单位[a]中自己父系家族的族长。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “千人单位”：希伯来语直译为“以色列的众千”；这里可能指以“千”为名的军事、行政编制，也可能指宗族单位。
    reason: 保留אַלְפֵי的字面意象及其在古代以色列社会组织中的词义歧义，避免直接定为单纯人数或“宗族”。
lexical_decisions:
- source_word: נְשִׂאִים / נָשִׂיא
  choice: 首领
  rationale: 该词指在部族或宗族中具有正式地位的领袖；“首领”既庄重又符合现代汉语，也不引入王室身份。
- source_word: עִמּוֹ
  choice: 同他一起前去
  rationale: “同他”回指上一节的非尼哈；结合差遣行动补出“前去”，使本节承接上文自然。
- source_word: נָשִׂיא אֶחָד נָשִׂיא אֶחָד
  choice: 各有一位首领
  rationale: 重复结构表达逐一分配的意思，用“各有一位”自然传达其分配性。
- source_word: לְבֵית אָב
  choice: 父系家族
  rationale: בֵּית אָב是以父系亲属关系构成的社会与行政单位；“父系家族”比直译“父家”更易懂，同时保留其亲属结构。
- source_word: לְכֹל מַטּוֹת יִשְׂרָאֵל
  choice: 以色列各支派
  rationale: מַטֶּה在此指以色列的支派；“各支派”简明表达全体范围。
- source_word: וְאִישׁ
  choice: 他们每一位
  rationale: אִישׁ在此为逐一指称前述十位男性代表；“他们每一位”准确保留分配意义。
- source_word: רֹאשׁ בֵּית אֲבוֹתָם
  choice: 自己父系家族的族长
  rationale: רֹאשׁ表示首领或负责人；“族长”自然体现其在父系家族中的领导地位。
- source_word: לְאַלְפֵי יִשְׂרָאֵל
  choice: 以色列各千人单位
  rationale: אַלְפֵי形式上是“千”的复数，但在部族、军事或行政语境中也可指以千人为名的编制或宗族单位；正文保留“千”的可见性，并以脚注说明其语义范围。
theological_decisions: []
