source:
  edition: WLC
  text: רַ֣ק שִׁמְר֣וּ מְאֹ֗ד לַ/עֲשׂ֨וֹת אֶת הַ/מִּצְוָ֣ה וְ/אֶת הַ/תּוֹרָה֮ אֲשֶׁ֣ר צִוָּ֣ה אֶתְ/כֶם֮ מֹשֶׁ֣ה עֶֽבֶד יְהוָה֒ לְ֠/אַהֲבָה אֶת יְהוָ֨ה אֱלֹֽהֵי/כֶ֜ם וְ/לָ/לֶ֧כֶת בְּ/כָל דְּרָכָ֛י/ו וְ/לִ/שְׁמֹ֥ר מִצְוֺתָ֖י/ו וּ/לְ/דָבְקָה ב֑/וֹ וּ/לְ/עָבְד֕/וֹ בְּ/כָל לְבַבְ/כֶ֖ם וּ/בְ/כָל נַפְשְׁ/כֶֽם׀־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/005.yaml
  text: 'Only be very careful to do the commandment and the law that Moses the servant of Yahweh commanded you: to love Yahweh your God[a], to walk in all his ways, to keep his commandments, to cling to him, and to serve him with all your heart and with all your soul.'
translation:
  language: zh_hans
  text: 只是你们务要格外谨慎，遵行耶和华的仆人摩西吩咐你们的诫命和律法[a]：爱耶和华你们的神，行在他一切的道路上，谨守他的诫命，紧紧依附他，全心全意地事奉他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “律法”也可译作“训诲”。希伯来语为 torah。
    reason: 保留תּוֹרָה在此既可指律法，也具有教导、训诲含义的词汇幅度。
lexical_decisions:
- source_word: רַק
  choice: 只是
  rationale: 承接上文的差遣与祝福，引出一项必须谨守的核心要求；“只是”保留其限制和强调作用。
- source_word: שִׁמְרוּ מְאֹד
  choice: 务要格外谨慎
  rationale: שׁמר与מְאֹד构成强烈劝诫，不只是“遵守”，还要求高度警醒和审慎；此译法自然传达其迫切语气。
- source_word: לַעֲשׂוֹת
  choice: 遵行
  rationale: 这里指实际实行所吩咐的内容；“遵行”比字面的“做”更符合现代汉语中诫命与律法的搭配。
- source_word: הַמִּצְוָה וְאֶת הַתּוֹרָה
  choice: 诫命和律法
  rationale: 保留原文的单数形式及两个并列名词；תּוֹרָה在摩西之约的语境中译作“律法”，同时以脚注保存“训诲”的词义可能。
- source_word: עֶבֶד יְהוָה
  choice: 耶和华的仆人
  rationale: עֶבֶד在此是摩西的尊称，“仆人”比“奴隶”更符合语境，又保留其服事和归属含义。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的神圣名号音译，明确呈现原文专名，而不以“主”这一称号替代。
- source_word: וְלָלֶכֶת בְּכָל דְּרָכָיו
  choice: 行他一切的道
  rationale: 保留希伯来文“行走于道路”的伦理与盟约意象，同时采用简洁、庄重而易懂的中文表达。
- source_word: וְלִשְׁמֹר מִצְוֺתָיו
  choice: 谨守他的诫命
  rationale: “谨守”是שׁמר与诫命搭配时自然且准确的中文表达，兼有看重、持守和遵行之意。
- source_word: וּלְדָבְקָה בוֹ
  choice: 紧紧依附他
  rationale: דבק表达紧密相连、忠贞不离；“紧紧依附”保留其强烈的关系性，又避免“粘住”等不庄重表达。
- source_word: וּלְעָבְדוֹ
  choice: 事奉他
  rationale: עבד在以神为宾语时包含忠诚服事及敬拜层面；“事奉”保留较广的盟约性服事含义，不把词义收窄为单纯礼仪敬拜。
- source_word: בְּכָל לְבַבְכֶם וּבְכָל נַפְשְׁכֶם
  choice: 全心全意地
  rationale: 原文直译为“用你们全部的心和全部的生命/自我”；现代汉语成语“全心全意”自然表达完整、毫无保留的投入。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。中文正文保留专名而非用“主”替代；“耶和华”在现代中文圣经传统中辨识度最高。“雅威”较接近学术界常见的拟音，但不必据此断定古代发音。
- issue: 盟约伦理意象的保留
  choice: 行他一切的道……紧紧依附他
  alternative: 凡事按他的旨意生活……忠于他
  rationale: 原文采用“行道”和“依附”的具体意象，兼具行为与关系层面的张力；正文予以保留，避免解释性改写削弱其力度。
- issue: נפשׁ在全人奉献语句中的处理
  choice: 全心全意地
  alternative: 用你们全部的心、全部的生命事奉他
  rationale: נפשׁ可指生命、性命或整个人，并不简单等同后世哲学意义上的“灵魂”。“全心全意”自然表达整个人毫无保留地事奉，但不把心与נפשׁ处理为两个可严格分割的实体。
translation_notes:
  register: 采用现代、庄重而易懂的普通话书面语。“务要”“谨守”“事奉”保留经文劝诫与盟约语体的庄严感；句子按原文由总命令引出五项具体要求。“全心全意”使末尾在中文中自然有力，同时表达全人投入。
