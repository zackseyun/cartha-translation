source:
  edition: WLC
  text: וַ/יָּבֹ֨אוּ֙ אֶל גְּלִיל֣וֹת הַ/יַּרְדֵּ֔ן אֲשֶׁ֖ר בְּ/אֶ֣רֶץ כְּנָ֑עַן וַ/יִּבְנ֣וּ בְנֵי רְאוּבֵ֣ן וּ/בְנֵי גָ֡ד וַ/חֲצִ֣י שֵׁבֶט֩ הַֽ/מְנַשֶּׁ֨ה שָׁ֤ם מִזְבֵּ֨חַ֙ עַל הַ/יַּרְדֵּ֔ן מִזְבֵּ֥חַ גָּד֖וֹל לְ/מַרְאֶֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/010.yaml
  text: When they came to the region of the Jordan that is in the land of Canaan[b][a], the sons of Reuben and the sons of Gad and the half-tribe of Manasseh built there an altar by the Jordan—an altar great in appearance.
translation:
  language: zh_hans
  text: 他们来到迦南地的约旦河一带[a]，流便子孙、迦得子孙和玛拿西半支派就在约旦河边筑了一座坛；这是一座看起来很大的坛[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “一带”或译“地区”，也可能指“边界地带”。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“一座外观很显眼的大坛”或“这坛大得显眼”。原文着重于这坛可见的、显著的外观。
    reason: lexical_alternative
lexical_decisions:
- source_word: גְּלִילוֹת הַיַּרְדֵּן
  choice: 约旦河一带
  rationale: גְּלִילוֹת 指某地周围的区域或地区。“一带”符合现代汉语地理表达，也保留了具体范围并不明确的特点。
- source_word: וַיָּבֹאוּ אֶל
  choice: 他们来到
  rationale: 以顺畅的叙事用语承接上文的行程，不额外强化时间或因果关系。
- source_word: אֲשֶׁר בְּאֶרֶץ כְּנָעַן
  choice: 迦南地的
  rationale: 用自然、简洁的汉语保留原文对约旦河区域所作的地理限定。
- source_word: בְנֵי רְאוּבֵן וּבְנֵי גָד
  choice: 吕便子孙、迦得子孙
  rationale: 保留希伯来文的家族—支派表达，同时符合中文圣经语体。
- source_word: חֲצִי שֵׁבֶט הַמְנַשֶּׁה
  choice: 玛拿西半支派
  rationale: 准确表达玛拿西支派的一半，是清楚而通行的现代中文说法。
- source_word: מִזְבֵּחַ
  choice: 坛
  rationale: 这是该祭祀设施在中文圣经语境中的准确、简洁对应词。
- source_word: עַל הַיַּרְדֵּן
  choice: 约旦河边
  rationale: 此处 עַל 表示地理上的临近；“河边”比字面的“在河上”更符合语境。
- source_word: מִזְבֵּחַ גָּדוֹל לְמַרְאֶה
  choice: 这坛外观看来十分高大
  rationale: 保留 גָּדוֹל 的大小或宏伟感，也体现 לְמַרְאֶה 所强调的可见外观，避免提前判断建坛的动机或用途。
theological_decisions:
- issue: 这座坛是否意在成为与中央圣所竞争的祭坛
  choice: 仅叙述他们筑坛，并描述其外观高大
  alternative: 称其为“僭设的祭坛”“宏伟壮观的坛”或明确说是献祭用的坛
  rationale: 本节尚未说明这坛是否用于献祭，也未在此直接评价建坛行为。译文保留后续叙事中的神学张力，不预断其动机、用途或合法性。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“吕便子孙、迦得子孙”保留原文的支派亲族表达；“约旦河边”与“外观看来十分高大”则按现代汉语习惯处理。脚注标记均置于其所说明的词语之后。
