  text: אֵל֩ אֱלֹהִ֨ים יְהוָ֜ה אֵ֣ל אֱלֹהִ֤ים יְהוָה֙ ה֣וּא יֹדֵ֔עַ וְ/יִשְׂרָאֵ֖ל ה֣וּא יֵדָ֑ע אִם בְּ/מֶ֤רֶד וְ/אִם בְּ/מַ֨עַל֙ בַּֽ/יהוָ֔ה אַל תּוֹשִׁיעֵ֖/נוּ הַ/יּ֥וֹם הַ/זֶּֽה׀׀׀׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/022.yaml
  text: 'The Mighty One[a], God, Yahweh! The Mighty One, God, Yahweh! He knows, and Israel itself will know: if it was in rebellion, or if in unfaithfulness against Yahweh[b], do not save us this day.'
translation:
  language: zh_hans
  text: “大能者[a]，上帝，雅威！大能者，上帝，雅威！他知道，以色列自己也必知道：我们若有悖逆，或对雅威不忠[b]，求你今日不要拯救我们。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文把这组神圣称谓完整重复两次：“大能者，上帝，雅威；大能者，上帝，雅威”，形成庄严而近似起誓的呼告。
    reason: cultural_note
  - marker: b
    text: “不忠”也可译作“背信”或“干犯”，指破坏信义的行为。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵל אֱלֹהִים יְהוָה
  choice: 大能者，上帝，雅威
  rationale: 将三个称谓分别译出，并完整保留两次重复。אֵל译为“大能者”，以免与随后的אֱלֹהִים合并；יהוה按专名译为“雅威”。
- source_word: הוּא יֹדֵעַ
  choice: 他知道
  rationale: 直接表达现在的认知状态，同时保留阳性单数代词。
- source_word: וְיִשְׂרָאֵל הוּא יֵדָע
  choice: 以色列自己也必知道
  rationale: “自己”体现独立代词הוּא的强调作用，“必知道”自然表达未完成式在此处的将来或必然意味。
- source_word: אִם בְּמֶרֶד
  choice: 我们若是出于悖逆
  rationale: מֶרֶד指悖逆、反叛；补出由上下文明确的“我们”，使汉语条件句完整自然。
- source_word: וְאִם בְּמַעַל בַּיהוָה
  choice: 或是对雅威不忠
  rationale: מַעַל表示背信、不忠，尤其可指对立约关系的破坏；介词短语在此表达不忠所针对的对象。
- source_word: אַל תּוֹשִׁיעֵנוּ
  choice: 求你……不要拯救我们
  rationale: 保留第二人称否定祈愿的力度；“求”使现代汉语明确呈现对上帝的直接呼告，但不把它弱化为普通陈述。
- source_word: הַיּוֹם הַזֶּה
  choice: 今日
  rationale: 简洁保留原文庄重、强调当下的语气。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名；音译“雅威”保留其作为立约专名的性质，不以称号代替。
- issue: 重复神圣称谓的作用
  choice: 完整重复“大能者，上帝，雅威”两次
  alternative: 合并或压缩为一次称呼
  rationale: 原文的完整重复构成庄严而近似起誓的呼告；保留重复可维持其修辞和神学分量，而不进一步界定公式的性质。
- issue: 末句由第三人称转为第二人称
  choice: 保留“他知道”与“求你……不要拯救我们”的人称转换
  alternative: 统一改为“愿他不要拯救我们”
  rationale: 希伯来文本先以第三人称陈述上帝知道，随后用第二人称动词直接向上帝呼求；译文不消除这一真实的修辞转换。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。保留原文重复、条件句的强烈自我咒诅意味，以及从第三人称陈述转入第二人称呼求的人称变化；避免使用宗派化术语。
