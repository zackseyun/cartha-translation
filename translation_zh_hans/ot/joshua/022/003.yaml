  text: לֹֽא עֲזַבְתֶּ֣ם אֶת אֲחֵי/כֶ֗ם זֶ֚ה יָמִ֣ים רַבִּ֔ים עַ֖ד הַ/יּ֣וֹם הַ/זֶּ֑ה וּ/שְׁמַרְתֶּ֕ם אֶת מִשְׁמֶ֕רֶת מִצְוַ֖ת יְהוָ֥ה אֱלֹהֵי/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/003.yaml
  text: You have not forsaken your brothers these many days[a], up to this day, and you have kept the charge of the commandment of Yahweh your God.
translation:
  language: zh_hans
  text: 这么多日子以来，你们没有离弃你们的弟兄[a]，直到今日；你们一直谨守雅威你们的上帝诫命所交付的职责。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“你们的以色列同胞”。希伯来原文作“你们的弟兄”，是阳性复数亲属称谓，在这里可以广义地指以色列人。
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲזַבְתֶּם
  choice: 没有离弃
  rationale: עזב可表示离开、抛弃或离弃；这里是约书亚称许他们长期忠于同胞，“离弃”保留了关系和盟约层面的分量。
- source_word: אֲחֵיכֶם
  choice: 你们的弟兄
  rationale: 原文是阳性复数亲属称谓“弟兄”，在此指同属以色列的同胞；正文保留原有比喻性亲属用语，脚注说明其广义所指。
- source_word: זֶה יָמִים רַבִּים
  choice: 这么多日子
  rationale: 该希伯来语表达强调延续已久的一段时间；此译法既贴近其指示性措辞，也符合现代汉语。
- source_word: עַד הַיּוֹם הַזֶּה
  choice: 直到今日
  rationale: 准确表达行动从过去持续到说话当下，是自然而庄重的现代汉语。
- source_word: וּשְׁמַרְתֶּם
  choice: 并且谨守了
  rationale: שׁמר在责任与命令的语境中指忠实遵守；“谨守”体现持续而审慎的履行。
- source_word: מִשְׁמֶרֶת מִצְוַת
  choice: 所吩咐你们守的职责
  rationale: 这一结构字面近于“命令的职守”，表示由命令交托的责任。汉语将其展开，避免生硬，同时保留“受命而守”的双重含义。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代简体中文圣经语域中广为人知的专名“耶和华”翻译四字神名，而不以头衔替代。
- source_word: אֱלֹהֵיכֶם
  choice: 你们上帝
  rationale: 直接表达原文的盟约性称谓，并采用现代标准汉语中清楚、庄重的“上帝”。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用上帝的专名而非一般头衔。正文保留专名；“耶和华”在普通现代中文读者中辨识度更高，同时不将其替换为“主”。
- issue: אֲחֵיכֶם 的范围
  choice: 你们的弟兄
  alternative: 你们的以色列同胞
  rationale: 原文明确采用阳性复数亲属词，但语境所指可广及其他以色列人。正文保留原文意象，脚注交代其语用范围，避免在正文中消解原有措辞。
- issue: מִשְׁמֶרֶת מִצְוַת 的句法关系
  choice: 所吩咐你们守的职责
  alternative: 命令所规定的职守
  rationale: 希伯来语名词链较为凝缩，可理解为因耶和华的命令而承担的职守。译文保留“吩咐”和“守”的关联，却不额外限定命令的具体内容。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“直到今日”保留经文的正式语感；“所吩咐你们守的职责”将凝缩的希伯来语名词链适度展开，使普通读者易于理解，又不削弱受托责任的意味。
