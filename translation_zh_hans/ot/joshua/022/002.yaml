  text: וַ/יֹּ֣אמֶר אֲלֵי/הֶ֔ם אַתֶּ֣ם שְׁמַרְתֶּ֔ם אֵ֚ת כָּל אֲשֶׁ֣ר צִוָּ֣ה אֶתְ/כֶ֔ם מֹשֶׁ֖ה עֶ֣בֶד יְהוָ֑ה וַ/תִּשְׁמְע֣וּ בְ/קוֹלִ֔/י לְ/כֹ֥ל אֲשֶׁר צִוִּ֖יתִי אֶתְ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/002.yaml
  text: And he said to them[a], “You have kept all that Moses the servant of Yahweh commanded you, and you have listened to my voice in all that I commanded you.”
translation:
  language: zh_hans
  text: 他对他们说：“雅威的仆人摩西所吩咐你们的一切，你们都遵守了；我所吩咐你们的一切，你们也都听从了[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“你们听从了我的声音。”希伯来语“听从某人的声音”常含有听命、顺服的意思。
    reason: 说明原文习语的字面形式及其顺服含义。
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵיהֶם
  choice: 他对他们说
  rationale: 以自然的现代汉语推进叙事，同时保留希伯来文的第三人称主语和复数受话者。
- source_word: שְׁמַרְתֶּם
  choice: 你们都遵守了
  rationale: שׁמר用于命令语境时指谨守、遵行；“遵守”准确表达对命令的忠实履行。
- source_word: כָּל אֲשֶׁר צִוָּה אֶתְכֶם
  choice: 吩咐你们的一切
  rationale: 保留כָּל אֲשֶׁר的完整范围，并用“吩咐”表达צוה的权威性而不显生硬。
- source_word: מֹשֶׁה עֶבֶד יְהוָה
  choice: 雅威的仆人摩西
  rationale: עֶבֶד在此是摩西事奉雅威的尊称，译作“仆人”比“奴隶”更符合语境；名称顺序符合现代汉语。
- source_word: וַתִּשְׁמְעוּ בְקוֹלִי
  choice: 你们也都听从了我的声音
  rationale: 保留希伯来语“听从声音”的意象，同时“听从”清楚传达该习语所包含的顺服含义。
- source_word: לְכֹל אֲשֶׁר צִוִּיתִי אֶתְכֶם
  choice: 在我吩咐你们的一切事上
  rationale: “在……事上”自然表达介词לְ在这里所标示的范围，并保留“一切”的周全语气。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”按其通常拟音保留这是以色列之神的专名，而不以称号替代。
- issue: 摩西称号עֶבֶד的译法
  choice: 仆人
  alternative: 奴隶
  rationale: 此处是摩西与雅威关系中的荣誉性事奉称号，重点在受托服事，并非突出受奴役的社会身份。
- issue: “听从我的声音”的含义
  choice: 正文保留声音意象，脚注说明顺服含义
  alternative: 直接译作“服从我”
  rationale: 希伯来习语兼有聆听和顺服之意；正文保留原有意象，脚注则让现代读者明确其行为层面的含义，避免只取其一。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“吩咐”“遵守”“仆人”均为普通读者熟悉的圣经叙事用语；分号呈现原文两个并列评价之间的平衡。
