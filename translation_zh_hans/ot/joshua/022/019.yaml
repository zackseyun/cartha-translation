  text: וְ/אַ֨ךְ אִם טְמֵאָ֜ה אֶ֣רֶץ אֲחֻזַּתְ/כֶ֗ם עִבְר֨וּ לָ/כֶ֜ם אֶל אֶ֨רֶץ אֲחֻזַּ֤ת יְהוָה֙ אֲשֶׁ֤ר שָֽׁכַן שָׁם֙ מִשְׁכַּ֣ן יְהוָ֔ה וְ/הֵאָחֲז֖וּ בְּ/תוֹכֵ֑/נוּ וּ/בַֽ/יהוָ֣ה אַל תִּמְרֹ֗דוּ וְ/אֹתָ֨/נוּ֙ אֶל תִּמְרֹ֔דוּ בִּ/בְנֹֽתְ/כֶ֤ם לָ/כֶם֙ מִזְבֵּ֔חַ מִֽ/בַּלְעֲדֵ֔י מִזְבַּ֖ח יְהוָ֥ה אֱלֹהֵֽי/נוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/019.yaml
  text: But if the land of your possession is unclean[a], cross over for yourselves into the land of Yahweh’s possession, where Yahweh’s tabernacle dwells, and take possession among us. Only do not rebel against Yahweh, or against us[d][c][b], by building for yourselves an altar besides the altar of Yahweh our God.
translation:
  language: zh_hans
  text: 但如果你们的产业之地不洁净[a]，你们就过到耶和华的产业之地来，就是耶和华的帐幕所在之地[b]，在我们中间取得产业[c]。只是，不可背叛耶和华，也不可背叛我们，在耶和华我们上帝的坛以外另为自己筑坛[d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “产业之地”也可译作“你们所拥有的土地”或“你们承受为业之地”。这里的“不洁净”究竟指礼仪、地理还是修辞意义，原文没有说明。
    reason: 说明אֲחֻזָּה可指持有或承受的土地，并保留טְמֵאָה的语义开放性。
  - marker: b
    text: 或译：“耶和华的帐幕设在那里。”原文直译是“耶和华的帐幕住在那里”。
    reason: 交代原文以帐幕为“居住”主体的表达，并提供自然中文译法。
  - marker: c
    text: 或译：“在我们中间定居。”这里的动词也含有取得一份地产的意思。
    reason: 保留动词在取得产业和定居之间的词义范围。
  - marker: d
    text: 也可译作“除耶和华我们上帝的坛之外”或“另加在耶和华我们上帝的坛之外”。原文指在耶和华的坛以外另筑一坛，未说明该坛的具体功能。
    reason: 说明מִבַּלְעֲדֵי的排除或附加含义，不预断该坛的具体功能。
lexical_decisions:
- source_word: וְאַךְ
  choice: 但如果
  rationale: 结合后面的条件句译为“但如果”，自然表达对前文的转折和强限定。
- source_word: טְמֵאָה
  choice: 不洁净
  rationale: 保留该词可能具有的礼仪性含义，同时不具体断定土地为何不洁净。
- source_word: אֶרֶץ אֲחֻזַּתְכֶם
  choice: 你们所得为业之地
  rationale: אֲחֻזָּה指所持有的产业，常为世袭地产；此译兼顾土地归属和承受产业的语感。
- source_word: עִבְרוּ לָכֶם
  choice: 就过到……来
  rationale: עִבְרוּ表示越过边界或河流；中文语境已清楚指向到说话者一方，לָכֶם的受益意味不宜机械译出。
- source_word: אֶל אֶרֶץ אֲחֻזַּת יְהוָה
  choice: 到耶和华的产业之地
  rationale: 保留אֲחֻזָּה与前句的词义呼应，并将神名יהוה音译为“耶和华”。
- source_word: אֲשֶׁר שָׁכַן שָׁם מִשְׁכַּן יְהוָה
  choice: 耶和华的帐幕住在那里
  rationale: 保留原文以“帐幕”为“居住”主语的刻意复沓和具体意象，不改写成较抽象的“居所”。
- source_word: וְהֵאָחֲזוּ בְּתוֹכֵנוּ
  choice: 你们可以在我们中间取得产业
  rationale: 该动词在此指取得地产或产业；“取得产业”比单纯“定居”更能保留土地权属意味。
- source_word: וּבַיהוָה אַל תִּמְרֹדוּ
  choice: 只是不可背叛耶和华
  rationale: “只是”体现劝告中的限制和强调；ב标示背叛的对象。
- source_word: וְאֹתָנוּ אַל תִּמְרֹדוּ
  choice: 也不可背叛我们
  rationale: 保留原文第二个明确的禁令和重复动词，使对神与对共同体的背叛形成平行。
- source_word: בִּבְנֹתְכֶם לָכֶם מִזְבֵּחַ
  choice: 为自己另筑一座坛
  rationale: ב加不定式表达实施背叛的方式；“为自己”保留לָכֶם，“另筑”与后面的合法祭坛形成对照。
- source_word: מִבַּלְעֲדֵי מִזְבַּח יְהוָה אֱלֹהֵינוּ
  choice: 与耶和华我们上帝的坛并立
  rationale: מִבַּלְעֲדֵי在这里可指在既有祭坛之外另设一坛；“并立”自然表达额外或竞争性祭坛的空间与功能对照，而不武断限定其确切性质。
theological_decisions:
- issue: 约旦河东土地“不洁净”的性质
  choice: 直译为“你们所得为业之地是不洁净的”
  alternative: 明确解释为礼仪上受玷污，或因远离中央圣所而不合宜
  rationale: 希伯来文只提出这一条件，并未说明不洁净的具体性质；译文保留其礼仪、地理或修辞层面的开放性。
- issue: 另筑祭坛的性质与禁令范围
  choice: 译作“另筑一座坛，与耶和华我们上帝的坛并立”
  alternative: 解释为绝对禁止任何第二座坛，或限定为禁止与中央圣所竞争的献祭坛
  rationale: 原文谴责在耶和华的坛以外另建祭坛，却未在本节详述其用途和禁令范围；译文不额外建立中央化祭祀理论。
- issue: “耶和华的产业之地”的含义
  choice: 保留土地属于耶和华的所有权表述
  alternative: 解释为帐幕所在的以色列西部领地或圣地
  rationale: 原文以同一名词对照“你们的产业”与“耶和华的产业”，应保留其神学张力，不把它简化为纯地理称呼。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“所得为业之地”“产业”“帐幕”“坛”保留土地授予和敬拜语境中的关键术语；用分号及短句化解希伯来文长句，同时保持劝告逐层推进的结构。所有脚注标记均置于相关正文之后。
