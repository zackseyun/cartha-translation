  yaml_path: translation/ot/joshua/022/001.yaml
  text: Then Joshua called the Reubenites, the Gadites, and the half-tribe of Manasseh,
translation:
  language: zh_hans
  text: 那时，约书亚召来吕便人、迦得人和玛拿西半支派，
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָז
  choice: 那时
  rationale: 这是承接上文、引出下一事件的时间标记；“那时”自然地保持叙事推进，也可译作“于是”。
- source_word: יִקְרָא
  choice: 召来
  rationale: 该动词在此表示约书亚把这些群体叫到自己面前；“召来”比单用“叫”更庄重，又不过度强化命令语气。
- source_word: יְהוֹשֻׁעַ
  choice: 约书亚
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: לָרֽאוּבֵנִי
  choice: 吕便人
  rationale: 原文是单数族称，但在这里具有集合意义，指吕便支派的人；中文用“吕便人”可自然表达这一群体。
- source_word: וְלַגָּדִי
  choice: 迦得人
  rationale: 原文单数族称在此作集合用法，指迦得支派的人；译作“迦得人”简洁自然。
- source_word: וְלַחֲצִי מַטֵּה מְנַשֶּׁה
  choice: 玛拿西半支派的人
  rationale: מַטֶּה在此指支派；加上“的人”使它与前面的两个群体称谓并列自然，并明确约书亚召来的是属于该半支派的人。
