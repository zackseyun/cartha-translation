source:
  edition: WLC
  text: וְ/עַתָּ֗ה הֵנִ֨יחַ יְהוָ֤ה אֱלֹֽהֵי/כֶם֙ לַֽ/אֲחֵי/כֶ֔ם כַּ/אֲשֶׁ֖ר דִּבֶּ֣ר לָ/הֶ֑ם וְ/עַתָּ֡ה פְּנוּ֩ וּ/לְכ֨וּ לָ/כֶ֜ם לְ/אָהֳלֵי/כֶ֗ם אֶל אֶ֨רֶץ֙ אֲחֻזַּתְ/כֶ֔ם אֲשֶׁ֣ר נָתַ֣ן לָ/כֶ֗ם מֹשֶׁה֙ עֶ֣בֶד יְהוָ֔ה בְּ/עֵ֖בֶר הַ/יַּרְדֵּֽן־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/004.yaml
  text: And now Yahweh your God has given rest to your brothers[a], just as he spoke to them. So now turn and go to your tents, to the land of your possession[d][c][b], which Moses the servant of Yahweh gave you beyond the Jordan.
translation:
  language: zh_hans
  text: 现在，耶和华你们的上帝已经使你们的弟兄[a]得享安息，正如他对他们所说的。现在你们要转身，回自己的帐篷[b]去，到约旦河那边[c]你们所得为业之地；那地是耶和华的仆人摩西赐给你们的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “弟兄”在这里指他们的以色列同胞。
    reason: lexical_alternative
  - marker: b
    text: “帐篷”也可按其惯用含义译作“家”。
    reason: lexical_alternative
  - marker: c
    text: 或译：“约旦河对岸”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵנִיחַ
  choice: 使……得享安息
  rationale: 使役式在征战语境中表示使人脱离争战、得到安歇；此译既保留使役含义，也符合现代汉语表达。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的专名“耶和华”译出四字神名，而不以称号代替。
- source_word: אֱלֹהֵיכֶם
  choice: 你们的上帝
  rationale: 与耶和华连用时为单数意义，指以色列的上帝。
- source_word: לַאֲחֵיכֶם
  choice: 你们的弟兄
  rationale: 保留希伯来文阳性复数及盟约群体的亲属表达；在本军事与支派语境中指其他以色列人。
- source_word: כַּאֲשֶׁר דִּבֶּר לָהֶם
  choice: 正如他对他们所说的
  rationale: דבר的基本义为“说”；不直接释作“应许”，以保存原文措辞及其可能蕴含的应许意味。
- source_word: פְּנוּ וּלְכוּ לָכֶם
  choice: 你们可以转身……去
  rationale: 保留“转身”的动作意象，并将与הלך构成的离去命令译成自然汉语。
- source_word: לְאָהֳלֵיכֶם
  choice: 回自己的帐篷
  rationale: 原文直译为“到你们的帐篷”；“回”由离营返乡的语境自然显出，同时保留历史性的“帐篷”意象。
- source_word: אֶל אֶרֶץ אֲחֻזַּתְכֶם
  choice: 你们所得为业之地
  rationale: אֲחֻזָּה指依法持有的土地产业；“所得为业”比生硬的“产业之地”自然，又不必等同于另一常译为“产业”的继承词汇。
- source_word: אֲשֶׁר נָתַן לָכֶם מֹשֶׁה
  choice: 那地是……摩西赐给你们的
  rationale: 按נתן的普通义译为“赐给”；中文以“赐”适合正式的土地授予语境。
- source_word: עֶבֶד יְהוָה
  choice: 耶和华的仆人
  rationale: 此处是摩西的尊荣性盟约称号，“仆人”比“奴隶”更符合语用。
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  choice: 约旦河那边
  rationale: 表达相对于说话者所在地的约旦河彼岸，并保留原文视角，而不擅自加入东西方位。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 正文直接以专名译出神名，不以“主”替代；“耶和华”是现代简体中文圣经传统中最通行、普通读者最易识别的形式。
- issue: “正如他所说”的应许含义
  choice: 保留“所说”的字面措辞
  alternative: 正如他所应许的
  rationale: 语境确有应许实现之意，但דבר本身是“说”；正文保存原文的开放表达，不把语境推论写入正文。
- issue: 安息的性质
  choice: 得享安息
  alternative: 免受仇敌侵扰／结束征战
  rationale: 原文未明说安息仅限于军事安全；保留“安息”可维持其叙事及神学张力。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“得享安息”“所得为业”略带经文体色彩，但普通读者仍易理解。调整信息顺序，把“约旦河那边”置于土地短语之前，以减少中文歧义；所有脚注标记均在正文出现。
