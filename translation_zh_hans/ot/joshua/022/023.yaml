- from: 我们若为自己筑坛，意在转离雅威，不再跟从他；若是要在坛上献燔祭和素祭，或献平安祭[a]，愿雅威亲自追究[b]！
  to: 我们若为自己筑祭坛，是要转离雅威、不再跟从他；若要在坛上献燔祭和素祭，或献平安祭[a]，愿雅威亲自追究此事[b]！
