base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/023.yaml
  text: if we built for ourselves an altar to turn away from following Yahweh[a], or if to offer on it burnt offering or grain offering, or if to make on it sacrifices of peace offerings[b], may Yahweh himself require it.
translation:
  language: zh_hans
  text: 我们若为自己筑祭坛，是要转离雅威、不再跟从他；若要在坛上献燔祭和素祭，或献平安祭[a]，愿雅威亲自追究此事[b]！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “平安祭”也可译作“团契祭”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“雅威必亲自追究此事。”意思是雅威必为此向我们问责。
    reason: alternative_reading
lexical_decisions:
- source_word: לִבְנוֹת לָנוּ מִזְבֵּחַ
  choice: 我们若为自己筑坛
  rationale: 承接上一节的起誓语境，将带 לְ 的不定式按条件句处理；“为自己”保留 לָנוּ，中文用“筑坛”自然简洁。
- source_word: לָשׁוּב מֵאַחֲרֵי יְהוָה
  choice: 意在转离雅威，不再跟从他
  rationale: 既表达 שׁוּב 的背离之意，也保留 מֵאַחֲרֵי 所含的“不再跟从”意象；以“意在”表明筑坛的目的。
- source_word: וְאִם לְהַעֲלוֹת עָלָיו עוֹלָה וּמִנְחָה
  choice: 若是要在坛上献燔祭和素祭
  rationale: העלה 在祭祀语境中译为“献”；עֹלָה、מִנְחָה 分别采用通行术语“燔祭”“素祭”。两者之间的 וְ 译作“和”，不改成析取关系。
- source_word: וְאִם לַעֲשׂוֹת עָלָיו זִבְחֵי שְׁלָמִים
  choice: 或献平安祭
  rationale: עָשָׂה 与祭物连用时表示举行或献祭，中文直接说“献”较自然；זִבְחֵי שְׁלָמִים 采用传统且可懂的“平安祭”。
- source_word: יְהוָה הוּא יְבַקֵּשׁ
  choice: 愿雅威亲自追究
  rationale: 在自我咒诅式誓言中，“愿”体现祈愿或咒誓力量；“亲自”对应强调代词 הוּא，“追究”表达 בקש 在此处要求交账、施行惩处的含义。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”较贴近通常重构的读音，并保留专名性质。
- issue: 末句在誓言中的语气
  choice: 愿雅威亲自追究
  alternative: 雅威必亲自追究
  rationale: 上下文是自我咒诅式誓言，因此正文采用祈愿表达；希伯来语形式本身也可按直陈将来理解，故在脚注保留另一可能。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。以分号分隔筑坛的背离目的与实际献祭用途，使连续条件结构清楚；结尾感叹号体现起誓和自我咒诅的强烈语气。
