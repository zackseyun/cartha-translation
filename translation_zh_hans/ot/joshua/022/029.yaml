  text: חָלִילָ/ה֩ לָּ֨/נוּ מִמֶּ֜/נּוּ לִ/מְרֹ֣ד בַּֽ/יהוָ֗ה וְ/לָ/שׁ֤וּב הַ/יּוֹם֙ מֵ/אַחֲרֵ֣י יְהוָ֔ה לִ/בְנ֣וֹת מִזְבֵּ֔חַ לְ/עֹלָ֖ה לְ/מִנְחָ֣ה וּ/לְ/זָ֑בַח מִ/לְּ/בַ֗ד מִזְבַּח֙ יְהוָ֣ה אֱלֹהֵ֔י/נוּ אֲשֶׁ֖ר לִ/פְנֵ֥י מִשְׁכָּנֽ/וֹ׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/029.yaml
  text: Far be it from us that we should rebel against Yahweh and turn away today from following Yahweh by building an altar for burnt offering[a], grain offering, or sacrifice, besides the altar of Yahweh our God that is before his tabernacle.
translation:
  language: zh_hans
  text: “我们绝不可背叛雅威，今天离弃他、不再跟从他[a]，另筑一座祭坛，用来献燔祭、素祭或宰牲献祭；除雅威我们上帝在他帐幕前的坛以外，绝不可这样做！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“今天从雅威后面转回”，是指离弃雅威，不再跟从他。
    reason: 保留希伯来语“从某人后面转回”的具体意象，并说明其惯用含义。
lexical_decisions:
- source_word: חָלִילָה לָּנוּ מִמֶּנּוּ
  choice: 我们绝不敢
  rationale: 这是强烈否认、厌恶某种行为的惯用语；“绝不敢”在现代汉语中自然有力，也符合说话者面对上帝时的语境。
- source_word: לִמְרֹד בַּיהוָה
  choice: 背叛雅威
  rationale: מרד 与介词 ב 连用，在这里表示反抗、背叛的对象；“背叛”保留了盟约关系中的悖逆意味。
- source_word: וְלָשׁוּב הַיּוֹם מֵאַחֲרֵי יְהוָה
  choice: 今天转离雅威，不再跟从他
  rationale: 希伯来语字面描写从跟随某人身后转离；此译清楚表达停止跟从的关系性含义，同时用脚注保留原文意象。
- source_word: לִבְנוֹת מִזְבֵּחַ
  choice: 另筑一座坛
  rationale: “另”从后文“在……坛以外”自然显出另设祭坛之意；“筑坛”简洁、庄重，也符合汉语宗教语境。
- source_word: לְעֹלָה
  choice: 献燔祭
  rationale: עֹלָה 是全牲焚烧献上的专门祭祀术语，传统且准确地译为“燔祭”。
- source_word: לְמִנְחָה
  choice: 献素祭
  rationale: 在祭祀语境中，מִנְחָה 指以谷物等献上的祭，译作“素祭”简洁且能与一般“供物”区分。
- source_word: וּלְזָבַח
  choice: 或祭牲
  rationale: זֶבַח 在此是一般性的宰牲祭，并未明确限定为某一特定祭类；“祭牲”保留其动物献祭含义而不擅自缩窄。
- source_word: מִלְּבַד מִזְבַּח יְהוָה אֱלֹהֵינוּ
  choice: 在我们上帝雅威的坛以外
  rationale: מִלְּבַד 表示排除或另设；此译清楚对比被质疑的新坛与合法的雅威之坛，并自然保留“雅威是我们的上帝”这一认信。
- source_word: אֲשֶׁר לִפְנֵי מִשְׁכָּנוֹ
  choice: 雅威的坛就在他的帐幕前
  rationale: מִשְׁכָּן 在此指圣所帐幕；“他的”保留第三人称单数所属后缀，“前”保留祭坛与帐幕的空间关系。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；“雅威”以现代汉语常见音译呈现这一盟约之名，而不是以称号替代。
- issue: 另筑祭坛这一行为与背叛的关系
  choice: 保留为遭到强烈否认的具体行为
  alternative: 解释为任何未经授权的敬拜
  rationale: 原文将筑坛献祭作为“背叛”和“转离”的具体表现，但本节没有展开普遍教义；译文不额外引入宗派性的祭坛观。
- issue: זֶבַח 所指的祭类
  choice: 祭牲
  alternative: 平安祭
  rationale: 该词本身可泛指宰牲献祭，本节没有足够依据将其限定为平安祭，故保留较宽泛的表达。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“我们绝不敢”传达强烈否认；“另筑一座坛”使汉语关系清晰。祭祀术语采用“燔祭、素祭、祭牲”，既保持传统可识别性，又避免把一般性的 זֶבַח 限定为特定祭类。
