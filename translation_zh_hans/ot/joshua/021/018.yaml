  text: אֶת עֲנָתוֹת֙ וְ/אֶת מִגְרָשֶׁ֔/הָ וְ/אֶת עַלְמ֖וֹן וְ/אֶת מִגְרָשֶׁ֑/הָ עָרִ֖ים אַרְבַּֽע־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/018.yaml
  text: 'Anathoth with its pasturelands[a], and Almon with its pasturelands: four cities.'
translation:
  language: zh_hans
  text: 亚拿突和城的草场[a]，亚勒们和城的草场，共四座城。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “草场”或译“公用地”“城周围的土地”。希伯来语指归属该城的城外开阔土地。
    reason: 保留 מִגְרָשׁ 的词义范围；该词强调城邑附属的开阔土地，不一定只用于放牧。
lexical_decisions:
- source_word: עֲנָתוֹת
  choice: 亚拿突
  rationale: 地名按现代中文圣经常用形式音译。
- source_word: מִגְרָשֶׁהָ
  choice: 城的草场
  rationale: 该词指归属城邑、位于城周围的开阔土地，常供放牧；译作“城的草场”既表达用途，也使阴性单数后缀所指的城邑在中文中清楚自然。
- source_word: עַלְמוֹן
  choice: 亚勒们
  rationale: 地名采用现代中文圣经中较常见的音译形式。
- source_word: עָרִים אַרְבַּע
  choice: 共四座城
  rationale: 这是对本组所列城邑数目的总结；加“共”符合中文清单结语的自然表达。
- source_word: אֶת ... וְאֶת ... וְאֶת ... וְאֶת
  choice: 以并列结构体现，不另译宾格标记
  rationale: 重复的 אֶת 是宾格标记，中文没有对应词，其列举功能由“和”及并列结构体现。
theological_decisions: []
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语，保持土地分配清单的句式；“城的草场”避免生硬重复“它的”，同时明确土地归属于各城。
