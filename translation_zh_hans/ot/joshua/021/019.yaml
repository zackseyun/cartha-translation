  text: All the cities of the sons of Aaron[a], the priests, were thirteen cities with their pasturelands.
translation:
  language: zh_hans
  text: 亚伦的子孙，就是祭司，他们的城共有十三座，连同各城的牧场[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“以及各城的牧场。”希伯来文只用“和”连接；这句既可译成“十三座城，连同各城的牧场”，也可译成“十三座城，以及各城的牧场”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל עָרֵי
  choice: 他们的城共有
  rationale: כָּל概括前述城邑的总数；汉语用“共有”自然表达汇总意义，同时保留“城”作为עִיר的常规译法。
- source_word: בְנֵי אַהֲרֹן
  choice: 亚伦的子孙
  rationale: בֵּן的复数在宗族谱系语境中可指后代；“子孙”既贴近原文的亲属表达，也避免让现代读者误解为仅指亚伦的亲生儿子。
- source_word: הַכֹּהֲנִים
  choice: 就是祭司
  rationale: 定冠词名词在此与“亚伦的子孙”构成同位说明；“就是祭司”清楚保留这一句法关系。
- source_word: שְׁלֹשׁ עֶשְׂרֵה עָרִים
  choice: 十三座
  rationale: 承接前面的“城”，以现代汉语量词“座”自然表达十三座城，避免不必要的重复。
- source_word: וּמִגְרְשֵׁיהֶן
  choice: 连同各城的牧场
  rationale: מִגְרָשׁ在利未人城邑清单中指城周围供牲畜等使用的开放地带；“牧场”简明体现其主要功能，“各城的”明确复数后缀所指。连接词וּ־译作“连同”，符合汉语汇总句式。
