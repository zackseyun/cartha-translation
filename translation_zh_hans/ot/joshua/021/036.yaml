  text: 'And from the tribe of Reuben: Bezer with its pasturelands[b][a], and Jahaz with its pasturelands.'
translation:
  language: zh_hans
  text: 又从吕便支派：比悉和它城郊的牧场，以及雅杂[a]和它城郊的牧场。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “雅杂”也有译作“雅哈撒”的。
    reason: lexical_alternative
  - marker: b
    text: 有些希伯来文抄本和古代见证没有第36—37节；这里所列的城与《历代志上》6:78—79相对应。
    reason: textual_variant
lexical_decisions:
- source_word: וּמִמַּטֵּה
  choice: 又从……支派
  rationale: מִן与מַטֶּה连用，在分配城邑的语境中表示这些城邑来自某一支派；“又从……支派”自然承接前文的清单。
- source_word: רְאוּבֵן
  choice: 吕便
  rationale: 采用现代中文圣经中广为人知的传统音译。
- source_word: בֶּצֶר
  choice: 比悉
  rationale: 地名按现代中文圣经的常见形式音译；宾格标记אֶת不另行译出。
- source_word: מִגְרָשֶׁהָ
  choice: 城郊的牧场
  rationale: מִגְרָשׁ在利未人城邑的语境中指城周围供公共使用、尤其可作放牧之用的空地；阴性单数后缀指所属的城。
- source_word: יַהְצָה
  choice: 雅杂
  rationale: 采用该地名在现代中文圣经中的常见译名；希伯来语词尾形式不必在中文音译中另作体现。
