base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/008.yaml
  text: So the sons of Israel gave to the Levites these cities with their pasturelands[a], as Yahweh had commanded by the hand of Moses, by lot.
translation:
  language: zh_hans
  text: 以色列人就照雅威借着摩西所吩咐的，以抽签的方式把这些城和城周围的牧场地给了利未人。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּתְּנוּ
  choice: 就……给了
  rationale: 叙事性连续动词，表示以色列人把所分定的城实际交给利未人；“给了”直接自然。
- source_word: בְנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 原文直译为“以色列的众子”，在这里是对以色列群体的常规称呼；“以色列人”在现代汉语中自然且不误限于男性。
- source_word: לַלְוִיִּם
  choice: 给了利未人
  rationale: 保留受事对象和利未群体的名称。
- source_word: הֶעָרִים הָאֵלֶּה
  choice: 这些城
  rationale: 保留指示词，回指上下文所列举的具体城邑。
- source_word: מִגְרְשֵׁיהֶן
  choice: 城外的牧场
  rationale: 指各城周围供放牧及公共使用的开阔地；“城外的牧场”既呈现其位置，也表达本段中的主要用途。
- source_word: כַּאֲשֶׁר צִוָּה
  choice: 照……所吩咐的
  rationale: 表达这次分配依照先前命令而行，符合汉语叙事习惯。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见音译呈现四字神名，而不以称号代替。
- source_word: בְּיַד מֹשֶׁה
  choice: 藉摩西
  rationale: 这是表示中介施行的希伯来语惯用语；“藉摩西”自然表达雅威通过摩西颁下命令，并以脚注保留其字面形象。
- source_word: בַּגּוֹרָל
  choice: 以抽签的方式
  rationale: 说明这些城是借抽签分配的；此译法比生硬的“凭签”更适合普通现代读者。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；采用“雅威”是按其较普遍接受的发音作现代汉语音译，并避免以“主”等称号取代专名。
- issue: בְיַד מֹשֶׁה 所表达的施事关系
  choice: 藉摩西
  alternative: 借摩西的手
  rationale: 原文既表明命令来自雅威，也表明摩西是传达命令的中介；正文采用自然汉语，脚注交代字面形式，不把摩西写成命令的最终来源。
translation_notes:
  register: 采用庄重而流畅的现代标准汉语。“以色列人”自然表达集体称谓；“城外的牧场”使古代城邑周围 מִגְרָשׁ 的所指易于普通读者理解。句序适度调整，把遵命和抽签方式置于主要动作之前，以符合汉语表达。
