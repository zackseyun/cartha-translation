  text: 'Kedemoth with its pasturelands[a], and Mephaath with its pasturelands: four cities.'
translation:
  language: zh_hans
  text: 基底莫和它的郊野[a]，米法押和它的郊野：共四座城。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “郊野”也可译作“公用地”或“城周围的土地”，指划归各城、位于城周围的开放土地（希伯来文 מִגְרָשׁ）。
    reason: lexical_alternative
lexical_decisions:
- source_word: קְדֵמוֹת
  choice: 基底莫
  rationale: 地名按现代中文圣经常见音译处理，不按词源意译。
- source_word: מִגְרָשֶׁהָ
  choice: 属城的草场
  rationale: מִגְרָשׁ指划归城邑、位于城周围的公共空地或牧放用地；“属城的草场”自然简明，并体现阴性单数后缀所指的各城。
- source_word: מֵיפָעַת
  choice: 米法押
  rationale: 地名采用现代中文圣经中易辨认的传统音译。
- source_word: עָרִים אַרְבַּע
  choice: 共四座城
  rationale: 忠实表达名单末尾的数目总括；加入“共”符合现代中文列举语气。
- source_word: אֶת ... וְאֶת ... וְאֶת ... וְאֶת
  choice: ……和属城的……，……和属城的……
  rationale: 重复的宾格标记组织清单，中文无需机械对应；以并列结构清楚呈现每座城及其附属草场。
