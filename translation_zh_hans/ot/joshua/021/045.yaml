base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/045.yaml
  text: Not one word failed from all the good word that Yahweh had spoken to the house of Israel[a]; all of it came to pass.
translation:
  language: zh_hans
  text: 耶和华对以色列家所说的一切美善之言，没有一句落空[a]；全都实现了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“耶和华对以色列家所说的一切美好应许，没有一个落空。”
    reason: 保留דָּבָר在此按语境理解为“应许”的可行译法，同时准确反映דִּבֶּר“所说”的含义。
lexical_decisions:
- source_word: לֹא נָפַל דָּבָר
  choice: 没有一句落空
  rationale: נפל字面为“落下”，与דבר连用时表示所说的话未能成就。“没有一句落空”既保留原文意象，也符合现代汉语习惯。
- source_word: מִכֹּל הַדָּבָר הַטּוֹב
  choice: 一切美善之言
  rationale: דבר可指“话、言语、事情”，此处与后面的דבר“说”形成呼应；“言”保留言说含义。“美善”表达טוב在此所指的有益、恩惠性质，而不预先把它限定为“应许”。
- source_word: אֲשֶׁר דִּבֶּר
  choice: 所说的
  rationale: 直接表达关系从句及神先前说话的事实，并与“美善之言”保持词义联系。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代简体中文圣经语境中最通行、最易识别的神名音译“耶和华”，明确将四字神名作为专名，而非以头衔代替。
- source_word: אֶל בֵּית יִשְׂרָאֵל
  choice: 对以色列家
  rationale: 保留“家”的集体及盟约性表达，同时使用“对……所说”这一自然汉语结构。
- source_word: הַכֹּל בָּא
  choice: 全都实现了
  rationale: בא字面为“来到”，此处惯用义是所说之事成为事实。“实现了”在现代汉语中清楚表达成就之意，又不如“应验”那样额外强化预言色彩。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用神的专名。中文主文保留专名，并采用普通读者最熟悉的传统音译“耶和华”；“雅威”更贴近常见学术拟音，但在现代中文圣经阅读中辨识度较低。
- issue: דָּבָר应译为“言”还是“应许”
  choice: 言
  alternative: 应许
  rationale: 原文两次使用דבר词根相关表达，重点是耶和华所说的话无一落空。“言”保存这一词汇联系和一定的语义宽度；“应许”符合上下文，却把隐含的履约意义直接明说，因此置于脚注。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“没有一句落空”简洁保留希伯来语意象；分号对应原文后半句的总结强调。脚注标记已置于相关主句之后。
