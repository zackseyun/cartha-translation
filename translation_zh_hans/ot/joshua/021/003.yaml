id: JOS.21.3
reference: Joshua 21:3
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יִּתְּנ֨וּ בְנֵי יִשְׂרָאֵ֧ל לַ/לְוִיִּ֛ם מִ/נַּחֲלָתָ֖/ם אֶל פִּ֣י יְהוָ֑ה אֶת הֶ/עָרִ֥ים הָ/אֵ֖לֶּה וְ/אֶת מִגְרְשֵׁי/הֶֽן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/003.yaml
  text: So the sons of Israel gave to the Levites[a], from their inheritance, at the command of Yahweh[c][b], these cities and their pasturelands.
translation:
  language: zh_hans
  text: 于是，以色列人[a]照雅威[b]的吩咐，从自己的产业中把这些城和城周围的草场[c]给了利未人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“以色列众子”，即以色列人。
    reason: lexical_alternative
  - marker: b
    text: “照雅威的吩咐”直译为“照雅威的口”。
    reason: lexical_alternative
  - marker: c
    text: 指附属于各城的外围空地，可用作牧场。
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּתְּנוּ
  choice: 给了
  rationale: 保留נתן在叙事中的基本义“给”，同时符合现代汉语表达。
- source_word: בְנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 这是现代汉语中对该希伯来民族称谓最自然、准确的表达；脚注保留其字面亲属用语。
- source_word: לַלְוִיִּם
  choice: 给了利未人
  rationale: 准确表达介词ל所标明的接受者；“利未人”是通行译名。
- source_word: מִנַּחֲלָתָם
  choice: 从自己的产业中
  rationale: נַחֲלָה在此指各支派承受为业的土地；“产业”保留继承和分地的含义。
- source_word: אֶל־פִּי יְהוָה
  choice: 照雅威的吩咐
  rationale: אֶל־פִּי是“按照……所说/所命”的惯用语；译为“照……的吩咐”自然且忠实，不机械直译为“照……的口”。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语音译呈现希伯来文的神圣名字，而不以“主”这一称号代替。
- source_word: הֶעָרִים הָאֵלֶּה
  choice: 这些城
  rationale: 直接表达名词与指示词，不提前解释为“以下各城”。
- source_word: מִגְרְשֵׁיהֶן
  choice: 城周围的草场
  rationale: 该词指附属于城邑的外围空地，可供放牧；此译法兼顾其位置和主要用途。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名；“雅威”较贴近学界通常重建的读音，并保留其作为专名的性质。
- issue: בְנֵי יִשְׂרָאֵל应按字面亲属称谓还是民族集合称谓翻译
  choice: 以色列人
  alternative: 以色列众子；以色列的子孙
  rationale: 该短语在这里是常规民族称谓，并非特别强调性别或父子关系；正文采用自然的现代汉语，字面形式则收入脚注，以保存原文形式。
- issue: מִגְרָשׁ所指土地的性质
  choice: 城周围的草场
  alternative: 郊野；空地；公用地
  rationale: 该词可强调城外附属空地，也常具有放牧用途；正文兼顾两方面，脚注说明其语义范围，避免把用途限定得过窄。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“于是”承接前文叙事；语序调整为先交代遵命，再说明从产业中拨出城邑，使长句清楚流畅。所有脚注标记均置于相应词语之后。
