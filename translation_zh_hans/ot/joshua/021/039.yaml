  text: 希实本和它的城郊牧场[a]，雅谢和它的城郊牧场——共四座城。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“公共用地”或“城周围的草场”；原文所指的是归属城邑的外围空地。
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶשְׁבּוֹן
  choice: 希实本
  rationale: 地名按现代中文圣经常用译名音译。
- source_word: מִגְרָשֶׁהָ
  choice: 城外的牧场
  rationale: מִגְרָשׁ指归属城邑的外围空地，常供放牧；译作“城外的牧场”既体现其与城邑的关系，也符合本段分城清单的语境。
- source_word: יַעְזֵר
  choice: 雅谢
  rationale: 地名采用现代中文圣经中通行、易辨识的音译。
- source_word: כָּל עָרִים אַרְבַּע
  choice: 共四座城
  rationale: 希伯来语直译为“所有城，四座”；“共四座城”自然传达总计之意。
- source_word: אֶת ... וְאֶת ... אֶת ... וְאֶת
  choice: 以并列结构表达，不另行译出
  rationale: 重复的直接宾语标记属于希伯来语句法，在中文中由地名与附属牧场的并列清单自然体现。
