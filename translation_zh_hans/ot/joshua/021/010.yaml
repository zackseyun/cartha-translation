  to: 这些城归给亚伦的子孙；他们是利未子孙中哥辖宗族的，因为第一签归他们。
  rationale: 以“这些城”承接上一节所列城邑，避免把首句的归属对象误作“签”。“哥辖宗族”简洁对应原文的族群/宗族表达，并保留其隶属利未子孙的族谱关系。末句保留原文的因果连接及“第一签”的分配次序。
