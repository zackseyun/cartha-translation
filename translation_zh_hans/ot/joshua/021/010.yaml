  yaml_path: translation/ot/joshua/021/010.yaml
  text: It was for the sons of Aaron[a], from the families of the Kohathites, from the sons of Levi, because the first lot was for them.
translation:
  language: zh_hans
  text: 这些城归给亚伦的子孙；他们是利未子孙中哥辖宗族的，因为第一签归他们。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי לִבְנֵי אַהֲרֹן
  choice: 这签归给了亚伦的子孙
  rationale: 上下文谈的是抽签分配城邑；将希伯来语的存在—归属结构自然译成“这签归给了”，并保留“亚伦的子孙”这一族谱表达。
- source_word: מִמִּשְׁפְּחוֹת הַקְּהָתִי
  choice: 哥辖各宗族的人
  rationale: מִשְׁפָּחוֹת在支派分配语境中指扩展家族或宗族；“各宗族”比现代汉语的“各家”更能呈现其群体层级。הַקְּהָתִי指哥辖一系的人。
- source_word: מִבְּנֵי לֵוִי
  choice: 利未子孙中
  rationale: 保留原文的族谱关系，同时用“中”清楚表达哥辖宗族属于利未子孙这一更大群体。
- source_word: כִּי
  choice: 因为
  rationale: 按通常的因果用法处理，说明前述亚伦子孙所得分配与第一签之间的关系。
- source_word: לָהֶם הָיָה הַגּוֹרָל רִאשֹׁנָה
  choice: 第一签是他们的
  rationale: לָהֶם הָיָה表达归属；“第一签是他们的”简洁保留“签”和次序概念，也符合现代汉语。
