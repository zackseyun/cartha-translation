base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/042.yaml
  text: Each of these cities had its surrounding pasturelands[a]; so it was for all these cities.
translation:
  language: zh_hans
  text: 这些城，每一座都有四周的牧场[a]；所有这些城都是这样。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“一城一城，连同它四周的牧场。”
    reason: 说明原文“城城”的逐一分配结构，并呈现连词及方位表达的字面形式。
lexical_decisions:
- source_word: תִּהְיֶינָה
  choice: 都有
  rationale: 此处未完成式在总结性叙述中描述既有状态；结合后面的城与牧场关系，译作“都有”比直译“是”更符合现代汉语。
- source_word: הֶעָרִים הָאֵלֶּה
  choice: 这些城
  rationale: עִיר 可指城或城镇；本段是利未人城邑的分配清单，译作“城”简洁而庄重。
- source_word: עִיר עִיר
  choice: 每一座
  rationale: 名词重复具有逐一分配的作用，即“城城、各城”；“每一座”自然保留其分配义。
- source_word: וּמִגְרָשֶׁיהָ
  choice: 牧场
  rationale: מִגְרָשׁ 指附属于城邑的城外空地，常供牲畜使用；“牧场”在本语境中清楚易懂，同时避免“郊区”在现代汉语中的城市化含义。
- source_word: סְבִיבֹתֶיהָ
  choice: 四周的
  rationale: 该词表示在城的周围；译作“四周的”自然修饰“牧场”，并保留环绕之意。
- source_word: כֵּן
  choice: 都是这样
  rationale: כֵּן 在此作总结，说明上述格局适用于全部城邑；“都是这样”符合现代汉语叙述。
- source_word: לְכָל הֶעָרִים הָאֵלֶּה
  choice: 所有这些城
  rationale: 该短语把前述逐城具备牧场的情形概括到整个城邑集合；译文简洁保留全称范围。
