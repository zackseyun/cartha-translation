  text: 又从便雅悯支派：基遍及其城外的草场[a]，迦巴及其城外的草场；
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“城外的公用地”或“城外的空地”，指每座城周围的土地。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/מִ/מַּטֵּה בִנְיָמִן
  choice: 又从便雅悯支派
  rationale: מַטֶּה在分地语境中指“支派”；前缀וּ与מִ分别表达承接和来源，用“又从”自然衔接上文。
- source_word: גִּבְעוֹן
  choice: 基遍
  rationale: 采用现代中文圣经地名的通行译名。
- source_word: מִגְרָשֶׁהָ
  choice: 城外的草场
  rationale: מִגְרָשׁ指利未城周围供放牧或公用的空地；“城外的草场”既交代其与城的关系，也符合本段分配城邑及附属土地的语境。阴性单数后缀所指为该城，中文按语义显明为“城外的”。
- source_word: גֶּבַע
  choice: 迦巴
  rationale: 采用现代中文圣经地名的通行译名，并与“基遍”相区别。
- source_word: וְ/אֶת
  choice: 和
  rationale: וְ连接并列城邑；אֶת为直接宾语标记，中文不另译。
