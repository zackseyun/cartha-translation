  yaml_path: translation/ot/joshua/021/034.yaml
  text: 'And to the families of the sons of Merari[a], the remaining Levites, from the tribe of Zebulun: Jokneam with its pasturelands, and Kartah with its pasturelands.'
translation:
  language: zh_hans
  text: 其余的利未人，就是米拉利子孙的各宗族，从西布伦支派分得的城邑是：约念及其城郊的牧场，加他及其城郊的牧场。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/לְ/מִשְׁפְּחֹת
  choice: 给……各宗族／各宗族所得的是
  rationale: 前缀连词和介词承接上文分配城邑的名单。מִשְׁפָּחוֹת 指支派内部的宗族；“宗族”比泛指家庭的“各家”更准确。为使本节作为现代汉语句子通顺，将领受关系整合为“从……所得的是”。
- source_word: בְּנֵי מְרָרִי
  choice: 米拉利子孙
  rationale: 这是族谱性称谓，指米拉利的后裔；“子孙”既保留希伯来表达的家族关系，又符合现代中文圣经语体。
- source_word: הַלְוִיִּם הַנּוֹתָרִים
  choice: 其余的利未人
  rationale: 指此前尚未列出所得城邑的利未人群体。“其余的”自然保留 הַנּוֹתָרִים 的名单衔接作用。
- source_word: מֵאֵת מַטֵּה זְבוּלֻן
  choice: 从西布伦支派所得
  rationale: מַטֶּה 在土地分配语境中指“支派”，מֵאֵת 表明这些城邑分自该支派。
- source_word: יָקְנְעָם
  choice: 约念
  rationale: 采用该希伯来地名在中文圣经传统中通行且简明的音译。
- source_word: מִגְרָשֶׁהָ
  choice: 城周围的牧场
  rationale: מִגְרָשׁ 指城邑外围供放牧等公共用途的土地；“城周围的牧场”比单说“郊野”更明确，也自然表达阴性单数后缀所指的该城附属土地。
- source_word: קַרְתָּה
  choice: 加珥他
  rationale: 采用贴近希伯来语辅音并符合中文圣经地名传统的音译。
theological_decisions: []
translation_notes:
  register: 采用庄重而清楚的现代标准汉语，并保留本节作为城邑分配名单的结构。原文省略“城”或“所得”等谓语成分，依赖上文；译文补出“所得的是”，只为形成自然汉语，不增添新的分配内容。英文咨询层的脚注讨论英文拼写 Kartah/Kartha，且标记位置与内容不符；该问题不适用于中文音译，因此未收入中文正文或脚注。
