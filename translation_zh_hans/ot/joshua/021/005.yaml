  text: וְ/לִ/בְנֵ֨י קְהָ֜ת הַ/נּוֹתָרִ֗ים מִ/מִּשְׁפְּחֹ֣ת מַטֵּֽה אֶ֠פְרַיִם וּֽ/מִ/מַּטֵּה דָ֞ן וּ/מֵ/חֲצִ֨י מַטֵּ֧ה מְנַשֶּׁ֛ה בַּ/גּוֹרָ֖ל עָרִ֥ים עָֽשֶׂר־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/005.yaml
  text: And for the remaining sons of Kohath[a], from the clans of the tribe of Ephraim, from the tribe of Dan, and from the half-tribe of Manasseh, there were by lot ten cities.
translation:
  language: zh_hans
  text: 哥辖其余的子孙[a]，从以法莲支派的各宗族、但支派和玛拿西半支派中，抽签得了十座城。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“其余的哥辖族人”。
    reason: 原文“哥辖的子孙”在这里可按宗族身份理解为哥辖族人；两种译法均能表达所指群体。
lexical_decisions:
- source_word: וְ/לִ/בְנֵי קְהָת הַנּוֹתָרִים
  choice: 哥辖其余的子孙
  rationale: 介词לְ在分配语境中标明承受者；בְּנֵי可指子孙或族人。译作“哥辖其余的子孙”，既保留原文的宗族表达，也表明这是上一节之外其余的哥辖后裔。
- source_word: מִ/מִּשְׁפְּחֹת
  choice: 从……各宗族
  rationale: מִשְׁפָּחָה在支派分配名单中通常指支派内部的宗族单位；“各宗族”比现代汉语中的“各家”更准确。
- source_word: מַטֵּה אֶפְרַיִם
  choice: 以法莲支派
  rationale: מַטֶּה在此指以色列的支派，而非字面的杖。
- source_word: וּ/מִ/מַּטֵּה דָן
  choice: 但支派
  rationale: 与前后并列，指城邑来源所属的支派；汉语可由前面的“从”统领，避免机械重复。
- source_word: וּ/מֵ/חֲצִי מַטֵּה מְנַשֶּׁה
  choice: 玛拿西半支派
  rationale: 这是玛拿西支派地域划分的常规称谓；“半支派”简洁且准确。
- source_word: בַּ/גּוֹרָל
  choice: 抽签得了
  rationale: בַּגּוֹרָל表示借抽签进行分配。原文是省略谓语的名单体结构，汉语补出“得了”，自然呈现分配结果而不改变其含义。
- source_word: עָרִים עָשֶׂר
  choice: 十座城
  rationale: עִיר在土地分配名单中指城邑；“座”是现代汉语适合城的量词。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而通顺的名单体叙述。“从”统领三个并列来源；补出“得了”以使希伯来语无谓语句在汉语中完整自然。专名采用常见中文圣经译名。
