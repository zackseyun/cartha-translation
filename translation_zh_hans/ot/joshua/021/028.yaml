  text: 又从以萨迦支派分出：基善及其郊野；大比拉及其郊野。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִמַּטֵּה יִשָּׂשכָר
  choice: 从以萨迦支派
  rationale: מַטֶּה在此指以色列的支派；用“支派”符合现代汉语圣经地理分配语境。
- source_word: קִשְׁיוֹן
  choice: 基善
  rationale: 按希伯来语地名音译，并与常见中文圣经译名协调。
- source_word: דָּבְרַת
  choice: 达比拉
  rationale: 按希伯来语地名音译；该地名亦见约书亚记19:12。
- source_word: מִגְרָשֶׁהָ
  choice: 城周围的牧场
  rationale: מִגְרָשׁ指城邑外围供牲畜放牧等用途的土地；补出“城周围”可自然表达后缀“它的”所指范围，且不把它误解为一般郊区。
