  text: 'And from the half-tribe of Manasseh: Taanach with its pasturelands[a], and Gath-rimmon with its pasturelands—two cities.'
translation:
  language: zh_hans
  text: 又从玛拿西半支派中分得：他纳及其城郊的牧场[a]，迦特·临门及其城郊的牧场，共两座城。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些希伯来文抄本以及《历代志上》6:70的平行记载，在从玛拿西支派分配的城名上有所不同。
    reason: textual_variant
lexical_decisions:
- source_word: וּ/מִֽ/מַּחֲצִית֙ מַטֵּ֣ה מְנַשֶּׁ֔ה
  choice: 又从玛拿西半支派分出
  rationale: מִן表示这些城邑来自该半支派的领地；按现代汉语补出“分出”，使分配语境清楚。“半支派”准确表达מַחֲצִית מַטֵּה。
- source_word: תַּעְנַךְ
  choice: 他纳
  rationale: 采用该地名在现代中文圣经中的通行音译。
- source_word: מִגְרָשֶׁהָ
  choice: 城郊的牧场
  rationale: מִגְרָשׁ指城周围附属的开放地带，常供放牧使用；“城郊的牧场”兼顾其位置与用途，并自然表达阴性单数后缀所指的该城所属土地。
- source_word: גַּת רִמּוֹן
  choice: 迦特·临门
  rationale: 按通行中文音译处理复合地名，以间隔号显示其为一个由两部分构成的专名。
- source_word: עָרִים שְׁתָּיִם
  choice: 共两座城
  rationale: 这是对本节所列城邑的总结计数；“共”自然呈现清单末尾的汇总功能。
