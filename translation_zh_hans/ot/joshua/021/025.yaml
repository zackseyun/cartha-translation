- from: 又从玛拿西半支派分出：他纳和城郊的牧场[a]，迦特·临门和城郊的牧场，共两座城。
  to: 又从玛拿西半支派中分得：他纳及其城郊的牧场[a]，迦特·临门及其城郊的牧场，共两座城。
