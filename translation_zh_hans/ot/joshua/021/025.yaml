    rationale: 希伯来文为清单式省略结构，须按中文补足；“分得”清楚表达城邑由该支派领地拨出，且承接本段分配语境。
  - severity: low
    issue: 第二处“城郊的牧场”缺少所属代词，重复连接稍显生硬。
    rationale: 两个希伯来文后缀均指各自城邑；使用“及其城郊的牧场”既明确所属，也使并列清单更自然。
