  text: 'And from the tribe of Dan: Eltekeh with its pasturelands[a], and Gibbethon with its pasturelands.'
translation:
  language: zh_hans
  text: 又从但支派：以利提基及其郊野[a]，基比顿及其郊野。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “郊野”也可译作“城周围的草场”或“城郊的公用地”；希伯来语 מִגְרָשׁ 指城周围供放牧或共同使用的土地。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/מִ/מַּטֵּה דָן
  choice: 又从但支派分出
  rationale: מַטֶּה在分配城邑的语境中指“支派”；介词מִן表示“从”。结合本段未完整重复的分配句式，以“分出”自然补明语义。
- source_word: אֶלְתְּקֵא
  choice: 伊利提基
  rationale: 按现代中文圣经地名的常见音译形式处理该城名。
- source_word: מִגְרָשֶׁהָ
  choice: 城郊的牧场
  rationale: מִגְרָשׁ指城周围供放牧或公用的空地；“城郊的牧场”兼顾其位置和主要用途。阴性单数后缀指所属的城，中文用领属结构表达，无须逐字译作“它的”。
- source_word: גִּבְּתוֹן
  choice: 基比顿
  rationale: 按现代中文圣经地名的常见音译形式处理该城名。
- source_word: אֶת / וְאֶת
  choice: 不单独译出／译为“以及”
  rationale: אֶת是直接宾语标记，中文无需对应词；第二处所附连词וְ按列举关系译作“以及”。
