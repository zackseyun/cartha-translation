base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/016.yaml
  text: Ain with its pasturelands[a], Juttah with its pasturelands, Beth-shemesh with its pasturelands—nine cities from these two tribes.
translation:
  language: zh_hans
  text: 亚因及其城外的草场[a]，淤他及其城外的草场，伯示麦及其城外的草场——这两个支派的九座城。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “草场”也可译作“公用地”或“城周围的土地”，指划归各城使用的城外土地。
    reason: lexical_alternative
lexical_decisions:
- source_word: עַיִן
  choice: 亚因
  rationale: 这是地名，按希伯来语音译；采用现代中文圣经地名中较易辨认的形式。
- source_word: מִגְרָשֶׁיהָ
  choice: 城外的草场
  rationale: 指划归各城、位于城周围的公用空地，尤可供放牧；“城外的草场”既表达位置，也保留主要用途。
- source_word: יֻטָּה
  choice: 淤他
  rationale: 这是地名，按希伯来语音译，并采用中文读者较熟悉的传统形式。
- source_word: בֵּית שֶׁמֶשׁ
  choice: 伯示麦
  rationale: 作为既定城名音译，不按其字面组成译为“太阳之家”。
- source_word: עָרִים תֵּשַׁע
  choice: 九座城
  rationale: עָרִים 在此指分配清单中的城邑；“九座城”自然、简洁。
- source_word: מֵאֵת שְׁנֵי הַשְּׁבָטִים הָאֵלֶּה
  choice: 从这两个支派共分出
  rationale: 介词结构表示这些城的来源；结合分城语境补出“分出”，使现代汉语清楚，同时不改变原意。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的清单体表达；重复保留每座城所附的草场，以对应希伯来文结构。末句用“共分出”自然呈现这些城来自前文所说两个支派的意思。
