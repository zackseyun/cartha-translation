  text: Dimnah with its pasturelands[b][a], and Nahalal with its pasturelands—four cities.
translation:
  language: zh_hans
  text: 丁拿和它的郊野[b][a]，拿哈拉和它的郊野——共四座城。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本段中，一些城名是否列入以及排列次序，希伯来文抄本与古代译本之间存在差异；另参历代志上6:62（按英文经文编号为6:77）的平行名单。
    reason: textual_variant
  - marker: b
    text: “郊野”也可译作“公用地”。
    reason: lexical_alternative
lexical_decisions:
- source_word: דִּמְנָה
  choice: 丁拿
  rationale: 地名按现代中文圣经常用的音译形式处理，不赋予词义。
- source_word: מִגְרָשֶׁהָ
  choice: 城外的草场
  rationale: מִגְרָשׁ 指划归城邑、位于城周围的开放地带，可供放牧；“城外的草场”既清楚表达其位置和用途，也保留所有格后缀所表示的归属关系。
- source_word: נַהֲלָל
  choice: 拿哈拉
  rationale: 地名采用通行的中文音译，不翻译其可能的词源意义。
- source_word: עָרִים אַרְבַּע
  choice: 共四座城
  rationale: 这是列举结束时的数目总结；加“共”符合现代汉语表达，并忠实传达“四座城”。
