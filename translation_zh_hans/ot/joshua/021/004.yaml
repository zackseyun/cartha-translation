base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/004.yaml
  text: Then the lot came out for the families of the Kohathites[a], and for the sons of Aaron the priest, from among the Levites, there fell by lot thirteen cities from the tribe of Judah, from the tribe of Simeon, and from the tribe of Benjamin.
translation:
  language: zh_hans
  text: 抽签的结果落在哥辖人的各家族身上[a]；利未人中祭司亚伦的子孙通过抽签，从犹大支派、西缅支派和便雅悯支派得了十三座城。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“签出来了，归给哥辖人的各家族”；这是抽签分配的惯用说法，也可译作“哥辖人的各家族抽中了签”。
    reason: 说明希伯来语以“签”为主语的惯用表达，并保留可接受的中文译法。
lexical_decisions:
- source_word: וַיֵּצֵא הַגּוֹרָל
  choice: 签抽出来，归给
  rationale: 保留希伯来语“签出来”的具体意象，同时用“归给”明确其分配含义；比单说“抽中了签”更贴近原句以“签”为主语的表达。
- source_word: לְמִשְׁפְּחֹת הַקְּהָתִי
  choice: 哥辖人的各家族
  rationale: מִשְׁפָּחוֹת指宗族内部的家族群体；“各家族”现代、清楚，并将集体称谓“哥辖人”自然地译出。
- source_word: וַיְהִי לִבְנֵי אַהֲרֹן הַכֹּהֵן
  choice: 祭司亚伦的子孙……得了
  rationale: 希伯来语此处表达省略，结合后文“抽签”和城邑数目补出“得了”，既使中文完整，又不增添分配以外的含义；בְּנֵי在世代群体语境中译作“子孙”。
- source_word: מִן הַלְוִיִּם
  choice: 利未人中
  rationale: 明确表达部分关系，即亚伦的子孙属于利未人这一更大的群体。
- source_word: מִמַּטֵּה יְהוּדָה וּמִמַּטֵּה הַשִּׁמְעֹנִי וּמִמַּטֵּה בִנְיָמִן
  choice: 从犹大支派、西缅支派和便雅悯支派
  rationale: מַטֶּה在此指以色列的支派；中文不必机械重复三个“从”，仍清楚保留三个来源支派。
- source_word: בַּגּוֹרָל
  choice: 抽签
  rationale: 表达借抽签进行分配的方式，是现代汉语自然、易懂的说法。
- source_word: עָרִים שְׁלֹשׁ עֶשְׂרֵה
  choice: 十三座城
  rationale: עָרִים在土地分配语境中译作“城”；量词“座”符合现代汉语习惯。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“签抽出来，归给”略带正式色彩，以保留原文以“签”为主语的具体意象；后半句改用自然的“抽签……得了”，避免中文重复生硬。
