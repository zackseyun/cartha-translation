base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/009.yaml
  text: 'From the tribe of the sons of Judah and from the tribe of the sons of Simeon they gave these cities[a], which are called by name:'
translation:
  language: zh_hans
  text: 他们从犹大子孙的支派和西缅子孙的支派中，给了这些城[a]，其名如下：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“这些按名指定的城”，或“这些逐一列名的城”。希伯来语的表达表明，以下将逐一列出这些城的名字。
    reason: 词义存在可行的不同表达；脚注说明该短语在本段城邑名单中的功能。
lexical_decisions:
- source_word: וַיִּתְּנוּ
  choice: 他们……给了
  rationale: נתן在分配利未人城邑的叙事语境中表示“给予”，并含有划给、授予之意；译作“给了”直接而自然。
- source_word: מִמַּטֵּה
  choice: 从……支派中
  rationale: מַטֶּה本可指“杖”，但在土地与城邑分配的语境中是“支派”的惯用称谓；“从……支派中”也清楚表达这些城出自有关支派的产业。
- source_word: בְּנֵי יְהוּדָה
  choice: 犹大子孙
  rationale: 保留希伯来语“犹大的众子”这一亲属式支派称谓；“犹大子孙”符合现代中文圣经语体，也包含后裔之义。
- source_word: וּמִמַּטֵּה בְּנֵי שִׁמְעוֹן
  choice: 和西缅子孙的支派中
  rationale: 与前句保持平行，并保留“西缅子孙”这一支派称谓。
- source_word: אֵת הֶעָרִים הָאֵלֶּה
  choice: 这些城
  rationale: עָרִים在此指分给利未人的城邑；“这些城”准确保留指示语气。
- source_word: אֲשֶׁר יִקְרָא אֶתְהֶן בְּשֵׁם
  choice: 其名如下
  rationale: 希伯来语表达较为特殊，字面近于“按名叫出它们”，实际引出随后逐一列出的城名；“其名如下”在中文中简洁自然，同时保留列名功能。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“犹大子孙”和“西缅子孙”保留原文的亲属式支派称谓；句末“其名如下”自然引出后文名单。
