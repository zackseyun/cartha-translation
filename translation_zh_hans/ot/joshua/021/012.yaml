  text: וְ/אֶת שְׂדֵ֥ה הָ/עִ֖יר וְ/אֶת חֲצֵרֶ֑י/הָ נָֽתְנ֛וּ לְ/כָלֵ֥ב בֶּן יְפֻנֶּ֖ה בַּ/אֲחֻזָּתֽ/וֹ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/012.yaml
  text: But the fields of the city and its villages they gave to Caleb son of Jephunneh as his possession[a].
translation:
  language: zh_hans
  text: 但城的田地和所属的村庄[a]，他们给了耶孚尼的儿子迦勒，作他的产业。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “村庄”或译“聚居地”。希伯来词可指隶属于一座城的村落或外围聚居点。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶת
  choice: 但
  rationale: 连词在此承接上文并形成对比：城及其牧场归利未人，城的田地和所属村庄却归迦勒；译作“但”能自然表达这一语篇关系。
- source_word: שְׂדֵה הָעִיר
  choice: 城的田地
  rationale: שְׂדֵה 在形态上是单数附属式，但这里可集合性地指属于该城的农田；汉语“田地”自然保留这种集合含义。
- source_word: חֲצֵרֶיהָ
  choice: 所属的村庄
  rationale: חָצֵר 的基本语义范围包括院落、无城墙的村落及附属于城的聚居点。此处与“城的田地”并列，并且上节另用 מִגְרָשׁ 指牧场，因此译作“所属的村庄”较能区分两词，也符合土地分配语境。
- source_word: נָתְנוּ
  choice: 他们给了
  rationale: 保留 נתן“给”的普通含义和原文复数主语；不把行政分配的意味过度明确化。
- source_word: לְכָלֵב בֶּן יְפֻנֶּה
  choice: 给了耶孚尼的儿子迦勒
  rationale: 按现代汉语自然表达间接宾语及父子关系，并采用常见圣经人名译法。
- source_word: בַּאֲחֻזָּתוֹ
  choice: 作他的产业
  rationale: אֲחֻזָּה 指依法持有的土地产业；“产业”既简洁，也保留土地占有与承受之意，而不特意限定为继承过程。
theological_decisions: []
