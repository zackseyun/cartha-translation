  language: zh_hans
  text: 黑甲及其草场，利合及其草场，共四座城。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חֶלְקָת
  choice: 黑甲
  rationale: 这是地名，采用现代中文圣经读者较熟悉的传统音译，不按其可能的词义翻译。
- source_word: מִגְרָשֶׁהָ
  choice: 其草场
  rationale: מִגְרָשׁ 指城外划归该城使用的公共空地，在利未人城邑的语境中主要供放牧等用途；“草场”简明自然，也避免旧式“郊野”可能产生的宽泛含义。阴性单数后缀分别指向前面的各座城。
- source_word: רְחֹב
  choice: 利合
  rationale: 这是地名，采用现代中文圣经中通行的传统音译。
- source_word: עָרִים אַרְבַּע
  choice: 共四座城
  rationale: 这是对本节及前文所列城邑总数的总结；加入“共”自然表达希伯来文清单末尾的汇总功能。
- source_word: אֶת ... וְאֶת ... וְאֶת ... וְאֶת
  choice: 及……及……
  rationale: 重复的 אֶת 是宾语标记，不单独译出；用“及”连接城邑与附属草场，保持清单体裁的简洁与庄重。
