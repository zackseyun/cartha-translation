base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/020.yaml
  text: And for the families of the sons of Kohath[a], the Levites who remained from the sons of Kohath, the cities of their lot were from the tribe of Ephraim.
translation:
  language: zh_hans
  text: 至于哥辖子孙各家，就是哥辖子孙中余下的利未人，他们按抽签所得的城邑，是从以法莲支派分得的[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们的阄所定的城邑。”希伯来语字面为“他们的阄的城邑”；这里指按抽签分给他们的城邑。
    reason: 说明希伯来语 עָרֵי גוֹרָלָם 的简练属格表达，并避免把名词“阄”误作“拈阄”的动词。
lexical_decisions:
- source_word: לְמִשְׁפְּחוֹת
  choice: 至于……各家
  rationale: לְ 在分配语境中表明所涉及或领受分配的对象；用“至于……各家”既承接上下文，也自然引出这一组家族。
- source_word: בְּנֵי קְהָת
  choice: 哥辖子孙
  rationale: 这是常见的谱系表达；现代汉语用“子孙”能自然涵盖哥辖的后裔，而不误解为仅指亲生儿子。
- source_word: הַלְוִיִּם הַנּוֹתָרִים מִבְּנֵי קְהָת
  choice: 哥辖子孙中其余的利未人
  rationale: 保留 מִן 的部分性含义，表明这些人属于哥辖后裔，并是先前分配之后剩余的一组。
- source_word: עָרֵי גוֹרָלָם
  choice: 他们抽签所得的城邑
  rationale: גורל 可指所拈的阄或由抽签产生的分配结果；正文采用自然明确的汉语，表达这些城邑是抽签分给他们的。
- source_word: מִמַּטֵּה אֶפְרָיִם
  choice: 来自以法莲支派
  rationale: מַטֶּה 在此类支派名单中指“支派”；מִן 表明这些城邑是从以法莲支派的地域中划出的。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“至于……就是……”保留原文的主题转折和同位说明；“城邑”符合历史叙事语体，同时普通读者容易理解。
