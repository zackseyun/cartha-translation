base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/032.yaml
  text: 'And from the tribe of Naphtali: Kedesh in Galilee[a], the city of refuge for the manslayer, with its pasturelands; Hammoth-dor with its pasturelands[b]; and Kartan with its pasturelands—three cities.'
translation:
  language: zh_hans
  text: 又从拿弗他利支派分出加利利的基低，就是杀人者的逃城[a]，连同城郊的牧场；哈末多珥[b]，连同城郊的牧场；加珥坦，连同城郊的牧场；共三座城。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“杀人之人的逃城”。希伯来语在这里指杀了人的人，特别涉及逃城庇护的法律情境，并不必然表示他是蓄意谋杀者。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文本作“哈末多珥”；有些传统认为这地方就是“哈末”。
    reason: alternative_reading
lexical_decisions:
- source_word: וּמִמַּטֵּה נַפְתָּלִי
  choice: 又从拿弗他利支派分出
  rationale: מַטֶּה在分配城邑的语境中指“支派”；补出“分出”，使承接上文的省略结构在现代汉语中完整自然。
- source_word: עִיר מִקְלַט הָרֹצֵחַ
  choice: 杀人者的逃城
  rationale: “逃城”是该法律制度在中文圣经语境中的简明固定表达；“杀人者”保留רֹצֵחַ只说明杀人事实而未在本节判定蓄意与否的含混性。
- source_word: קֶדֶשׁ בַּגָּלִיל
  choice: 加利利的基低
  rationale: 按通行中文地名音译处理，并以“加利利的”自然表达地域限定。
- source_word: מִגְרָשֶׁיהָ
  choice: 城郊的牧场
  rationale: מִגְרָשׁ指归属城邑、位于其周围的开阔地，常用于放牧；此译兼顾地点和用途。
- source_word: חַמֹּת דֹּאר
  choice: 哈末多珥
  rationale: 依马所拉文本将复合地名整体音译；不在正文中改作其他传统所见的“哈末”。
- source_word: קַרְתָּן
  choice: 加珥坦
  rationale: 按希伯来语形式音译该地名，并采用现代中文圣经地名的常见写法。
- source_word: עָרִים שָׁלֹשׁ
  choice: 共三座城
  rationale: 将希伯来语末尾的同位总结按自然汉语语序表达，并以“共”明确其汇总功能。
theological_decisions:
- issue: רֹצֵחַ所指杀人者的法律与道德性质
  choice: 正文译作“杀人者”，脚注说明未必指蓄意谋杀者
  alternative: 误杀人的；谋杀者的
  rationale: 本词在逃城法律语境中指造成他人死亡并寻求庇护的人，本节本身没有明确裁定其主观故意；正文不宜预先判定为误杀或谋杀。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。城邑清单用分号保持层次，并重复“连同城郊的牧场”，以保留希伯来原文的列举节奏和法律分配文书风格。
