base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/044.yaml
  text: And Yahweh gave them rest on every side[a], according to all that he had sworn to their fathers. Not one man from all their enemies stood before them[b]; Yahweh gave all their enemies into their hand.
translation:
  language: zh_hans
  text: 雅威使他们四境安宁，照着他向他们列祖所起的一切誓言。他们所有的仇敌中，没有一人能在他们面前站立[a]；雅威把他们所有的仇敌都交在他们手中[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“没有一人能抵挡他们。”希伯来语“在……面前站立”在这里指成功抵挡。
    reason: lexical_alternative
  - marker: b
    text: 希伯来语直译为“交在他们手中”，这是表示把人交由对方掌控的常见说法。
    reason: idiom_explanation
lexical_decisions:
- source_word: וַיָּנַח
  choice: 使……安宁
  rationale: 这是 נוח 的使役形，表示“使得安息、赐予安息”。“使他们四境安宁”在现代汉语中自然地表达了因周围威胁被制伏而得享安息的意思。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来语四字神名的常见汉语音译处理，保留其作为专名的性质，不以“主”这一称号代替。
- source_word: מִסָּבִיב
  choice: 四境
  rationale: 表达四面周围、各处皆得安全的全面空间意义；与“安宁”搭配简洁庄重。
- source_word: כְּכֹל אֲשֶׁר נִשְׁבַּע
  choice: 正如……所起的一切誓
  rationale: “正如”保留 כְּ 的对应关系，“一切”保留 כֹּל 所强调的完全履行。
- source_word: לַאֲבוֹתָם
  choice: 向他们列祖
  rationale: “列祖”准确指以色列人的父系先祖，保留原文的男性家族用语，也符合庄重而通行的汉语表达。
- source_word: וְלֹא עָמַד אִישׁ בִּפְנֵיהֶם
  choice: 没有一人能在他们面前站立
  rationale: 保留“在……面前站立”的希伯来语意象，同时用“能”清楚传达在军事语境中无法成功抵挡的含义。
- source_word: מִכָּל אֹיְבֵיהֶם
  choice: 他们所有的仇敌中
  rationale: 将介词 מן 的范围或部分意义自然译出，即在全部仇敌当中无一例外。
- source_word: נָתַן ... בְּיָדָם
  choice: 把……交在他们手中
  rationale: 保留希伯来语“交在手中”这一常见惯用语，表示把敌人置于他们的权势之下。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。译作“雅威”保留专名，并较直接地反映学界通常重构的读音；不用称号“主”替代，也不采用源于另一套元音传统的“耶和华”。
- issue: 本节对得享安息与征服仇敌的关系
  choice: 保留“使他们四境安宁”与“把仇敌交在他们手中”的并列表述
  alternative: 把安宁解释为所有冲突永久终结
  rationale: 原文宣告誓言在这一叙事阶段得到实现，却没有在本句中说明这种安息是否排除后来的一切争战；译文不额外化解这一叙事与神学张力。
- issue: אִישׁ 的个体性与性别表达
  choice: 一人
  alternative: 一个人；一名男子
  rationale: 这里的阳性单数在否定结构中具有逐一、无一例外的作用。“一人”保留个体性，又避免在汉语中不必要地强化生理性别。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“四境安宁”“列祖”“交在手中”保留经文的凝练感；脚注解释两处希伯来语惯用表达，正文则尽量保留原文意象。
