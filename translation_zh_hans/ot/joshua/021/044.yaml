    issue: “正如他向他们列祖所起的一切誓”句法不完整。
    rationale: “正如”通常需要后接完整的比较性分句，或以“正如……所说的那样”收束；此处原文的 כְּכֹל 更直接表示“照着／按照……的一切誓言”。改为“照着他向他们列祖所起的一切誓言”既自然，也更明确表现誓言的完全应验。
