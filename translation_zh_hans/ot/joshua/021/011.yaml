base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/011.yaml
  text: So they gave them Kiriath-arba (Arba was the father of Anak)[a], that is, Hebron, in the hill country of Judah, along with its pasturelands around it.
translation:
  language: zh_hans
  text: 于是，他们把基列·亚巴（亚巴是亚衲的父亲）[a]，即犹大山区的希伯仑，以及它周围的牧场，给了他们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “父亲”也可译作“祖先”。希伯来语可指直接的父亲，也可指较远的先祖。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנוּ
  choice: 于是……给了
  rationale: 承接前文叙事次序；“于是”在现代汉语中自然地表达希伯来语连续叙事形式。
- source_word: לָהֶם
  choice: 他们
  rationale: 保留原文第三人称复数代词，不在本节中明说其所指的利未人。
- source_word: קִרְיַת אַרְבַּע
  choice: 基列·亚巴
  rationale: 作为既定地名音译，而不直译为“亚巴城”；间隔号清楚标示复合专名。
- source_word: אֲבִי הָעֲנֹוק
  choice: 亚巴是亚衲的父祖
  rationale: 补出主语“亚巴”，使插入说明符合自然汉语；“父祖”保留 אָב 可指直接父亲或较远祖先的语义范围。
- source_word: הִיא חֶבְרוֹן
  choice: 就是……希伯仑
  rationale: 该短语用于补充辨明基列·亚巴就是希伯仑；“就是”简洁自然。
- source_word: בְּהַר יְהוּדָה
  choice: 犹大山区的
  rationale: 这里的 הַר 指犹大高地这一地理区域，并非一座单独的山。
- source_word: מִגְרָשֶׁיהָ
  choice: 城……的牧场
  rationale: מִגְרָשׁ 指城外划作公用、尤其用于放牧的空地；“牧场”在本语境中清楚易懂，补出“城”以明确阴性代词所指。
- source_word: סְבִיבֹתֶיהָ
  choice: 周围
  rationale: 表达这些牧场位于城的四周，符合原文空间关系并使汉语简练。
theological_decisions:
- issue: אָב 所表达的亲属关系
  choice: 正文译作“父祖”
  alternative: “父亲”或“祖先”
  rationale: 希伯来语 אָב 既可指直接父亲，也可指较远的男性祖先；“父祖”避免在证据不足时把关系限定为其中之一。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。地名使用常见圣经汉语音译；以括号保留原文的同位说明，并用脚注呈现亲属称谓的真实歧义。
