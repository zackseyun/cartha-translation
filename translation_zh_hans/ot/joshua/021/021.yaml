base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/021.yaml
  text: They gave them Shechem with its pasturelands in the hill country of Ephraim[a], the city of refuge for the manslayer[b], and Gezer with its pasturelands.
translation:
  language: zh_hans
  text: 他们把以法莲山区[b]的示剑，就是杀人者的避难城[a]，和它的城郊牧场，以及基色和它的城郊牧场，给了他们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “杀人者”是这里的法律用语，指造成他人死亡、可逃到避难城等候审判的人，并不一定是已被定罪的谋杀犯。
    reason: lexical_alternative
  - marker: b
    text: 原文直译“以法莲山”，这里指以法莲境内的山地。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנוּ לָהֶם
  choice: 他们把……给了他们
  rationale: 按希伯来叙事时态译为过去发生的动作；用现代汉语“把”字句自然表达直接宾语和间接宾语。
- source_word: עִיר מִקְלַט הָרֹצֵחַ
  choice: 供杀人者避难的城
  rationale: מִקְלָט表示逃往其中寻求庇护的地方；רֹצֵחַ字面指造成他人死亡的人，在本节所处的法律背景中不必然是已被判定有谋杀罪的人。正文保留“杀人者”的宽泛含义，脚注说明其法律语境。
- source_word: שְׁכֶם
  choice: 示剑
  rationale: 采用该圣经地名在现代中文中的通行译名。
- source_word: מִגְרָשֶׁיהָ
  choice: 城郊牧场
  rationale: 指划归城邑、位于其周围并可供放牧等用途的空地；“城郊牧场”简明体现其位置和主要用途。
- source_word: בְּהַר אֶפְרָיִם
  choice: 在以法莲山区
  rationale: 这里的הַר指以法莲境内的山地地带，而非一座名为“以法莲山”的单独山峰。
- source_word: גֶּזֶר
  choice: 基色
  rationale: 采用该圣经地名在现代中文中的通行译名。
theological_decisions:
- issue: 避难城中“杀人者”的法律身份
  choice: 正文译作“杀人者”，脚注说明其尚待审判，不一定是故意谋杀者
  alternative: 直接译作“误杀人者”或“谋杀者”
  rationale: 原文הָרֹצֵחַ本身可指杀人者，而避难城制度涉及对死亡责任和故意程度的审理。译成“误杀人者”会预先判定无意，译成“谋杀者”则会预先判定有罪；正文保留原文张力。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“就是”明确“供杀人者避难的城”是对示剑的同位说明；重复“城郊牧场”以保留原文城邑清单的平行结构。
