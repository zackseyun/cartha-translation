  text: כֹּ֚ל עָרֵ֣י הַ/לְוִיִּ֔ם בְּ/ת֖וֹךְ אֲחֻזַּ֣ת בְּנֵֽי יִשְׂרָאֵ֑ל עָרִ֛ים אַרְבָּעִ֥ים וּ/שְׁמֹנֶ֖ה וּ/מִגְרְשֵׁי/הֶֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/041.yaml
  text: All the cities of the Levites within the possession of the sons of Israel were forty-eight cities[b][a], with their pasturelands.
translation:
  language: zh_hans
  text: 以色列人[a]产业之内所有利未人的城邑，共有四十八座，都连同各自的草场[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语直译为“以色列的众子”，也可译作“以色列子孙”。
    reason: lexical_alternative
  - marker: b
    text: 或译“空地”或“公用地”，指城周围的附属土地。
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּל
  choice: 都
  rationale: 表示这里总括利未人的全部城邑；用“都”符合现代汉语表达。
- source_word: עָרֵי הַלְוִיִּם
  choice: 利未人的城
  rationale: 直接保留希伯来语“利未人的城”这一所属关系，比“利未城”更清楚。
- source_word: בְּתוֹךְ
  choice: 在……之内
  rationale: 准确表达这些城位于以色列人产业范围以内。
- source_word: אֲחֻזַּת
  choice: 产业
  rationale: 指所持有、承受的土地；“产业”简洁庄重，并保留本段土地分配的语境。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 这是希伯来语常见的民族整体称谓；“以色列人”在现代汉语中自然清楚，脚注说明其字面形式。
- source_word: עָרִים אַרְבָּעִים וּשְׁמֹנֶה
  choice: 共四十八座
  rationale: 原文以同位结构总结城的总数；汉语补入量词“座”并用“共”表达总计。
- source_word: וּמִגְרְשֵׁיהֶן
  choice: 连同各城的草场
  rationale: מִגְרָשׁ 指城周围附属的开阔用地，常用于放牧；“草场”最清楚地表达本段语境，“各城的”也明确复数所指。
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל 的民族称谓与字面性别形式
  choice: 以色列人
  alternative: 以色列的众子／以色列子孙
  rationale: 该短语字面为“以色列的众子”，但在这里作为整个民族的惯用称谓，并非刻意排除女性。正文采用自然且范围准确的“以色列人”，同时以脚注保留原文形式。
- issue: אֲחֻזָּה 的土地含义
  choice: 产业
  alternative: 所有地／地业
  rationale: “产业”既能表达以色列人持有的土地，也不把此处强行限定为某一种神学化的“继承”概念。
translation_notes:
  register: 采用现代、庄重而易懂的叙述语体。“在……产业之内”保持土地分配语境；“共四十八座”符合汉语计数习惯；脚注保留民族称谓和 מִגְרָשׁ 的词义幅度。
