base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/038.yaml
  text: 'And from the tribe of Gad: Ramoth in Gilead[a], the city of refuge for the manslayer, with its pasturelands[c][b], and Mahanaim with its pasturelands.'
translation:
  language: zh_hans
  text: 又从迦得支派分出基列的拉末[a]，就是杀人者的逃城[b]，连同其郊野[c]；又分出玛哈念，连同其郊野。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“基列拉末”。希伯来语既可理解为“基列地区的拉末”，也可按传统作为复合地名。
    reason: alternative_reading
  - marker: b
    text: “杀人者”：希伯来语原词也可译为“凶手”或“致人死亡者”。在逃城的法律语境中，所指尤其包括非故意致人死亡、可前往逃城等候审判的人；并不表示蓄意杀人者必获庇护。
    reason: lexical_alternative
  - marker: c
    text: “郊野”指配属该城、位于城周围并与城一同使用的土地，通常可供放牧等用途。
    reason: cultural_note
lexical_decisions:
- source_word: וּ/מִ/מַּטֵּה גָד
  choice: 又从迦得支派，分出
  rationale: מַטֶּה在土地分配语境中指“支派”。原文是承接前文的省略句，补出“分出”使现代汉语完整自然，同时保留清单的延续关系。
- source_word: עִיר מִקְלַט הָרֹצֵחַ
  choice: 给误杀人者的逃城
  rationale: עִיר מִקְלַט是以色列法律中的指定避难城。רֹצֵחַ本可泛指杀人者，但在逃城制度中尤其涉及非故意致人死亡者；译作“误杀人者”贴合本处法律语境，避免误解为蓄意谋杀者无条件获庇护。
- source_word: רָמֹת בַּגִּלְעָד
  choice: 基列的拉末
  rationale: 介词בַּ表示地点或地域关联；“基列的拉末”既自然，也保留其可被视为复合地名“基列拉末”的可能。
- source_word: מִגְרָשֶׁהָ
  choice: 城周围的牧场
  rationale: מִגְרָשׁ指分配给利未城、位于城邑周围的公用空地，主要供牲畜使用。“城周围的牧场”比单说“郊野”更清楚地传达位置与用途。
- source_word: מַחֲנַיִם
  choice: 玛哈念
  rationale: 专有地名，按现代中文圣经地名的通行音译处理。
theological_decisions:
- issue: 逃城所庇护之人的法律性质
  choice: 误杀人者
  alternative: 杀人者／凶手
  rationale: רֹצֵחַ本身可指致人死亡者，甚至凶手；但民数记35章和申命记19章所规定的逃城庇护对象是未经审判者，尤其是非故意杀人者。正文采用符合该制度的“误杀人者”，脚注说明原词范围，避免把蓄意谋杀与误杀混同。
translation_notes:
  register: 采用现代、庄重而易懂的叙事清单体。以“又从……分出”承接上下文中的城邑分配；重复“连同城周围的牧场”，对应希伯来文两次出现的结构，不省略其平行表达。
