  text: כָּל עָרִ֥ים עֶ֖שֶׂר וּ/מִגְרְשֵׁי/הֶ֑ן לְ/מִשְׁפְּח֥וֹת בְּנֵֽי קְהָ֖ת הַ/נּוֹתָרִֽים־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/026.yaml
  text: All the cities were ten[a], with their pasturelands[c][b], for the clans of the remaining sons of Kohath.
translation:
  language: zh_hans
  text: 给其余哥辖子孙的各宗族，共有十座城[a]，以及城周围的草场[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文采用总结清单的句式，直译可作“所有城共十座”。
    reason: lexical_alternative
  - marker: b
    text: “草场”指隶属于各城的周边空地，主要用于放牧及相关用途。
    reason: cultural_note
lexical_decisions:
- source_word: כָּל עָרִים עֶשֶׂר
  choice: 共有十座城
  rationale: 这是承接前面清单的总结句式；译为“共有十座城”既准确表达总数，也符合现代汉语习惯。
- source_word: וּמִגְרְשֵׁיהֶן
  choice: 以及城周围的草场
  rationale: מִגְרָשׁ 指附属于城邑的周边空地，尤其可供放牧等用途；“城周围的草场”清楚表达其位置和主要用途。
- source_word: לְמִשְׁפְּחוֹת
  choice: 给……各宗族
  rationale: מִשְׁפָּחוֹת 指支派之下的亲族群体；“宗族”比现代汉语中的“家庭”更贴切，介词 לְ 在此表达分配或归属。
- source_word: בְּנֵי קְהָת
  choice: 哥辖子孙
  rationale: 保留希伯来语“哥辖之子”的谱系表达；汉语以“哥辖子孙”自然涵盖其后裔。
- source_word: הַנּוֹתָרִים
  choice: 其余
  rationale: 指先前已获分城邑的哥辖支系以外、尚待分配的哥辖子孙；“其余”简洁保留这种对照。
theological_decisions: []
