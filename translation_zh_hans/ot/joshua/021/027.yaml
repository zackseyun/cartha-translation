revisions:
- from: 又从玛拿西半支派分给利未人各宗族中的革顺子孙：巴珊的哥兰，就是供杀人者逃难的城，连同城周围的牧场；还有比施提拉[a]，连同城周围的牧场，共两座城。
  to: 又从玛拿西半支派中，把巴珊的哥兰，就是杀人者的逃城，连同它的牧场，以及比施提拉[a]连同它的牧场，分给利未人宗族中革顺的子孙；共两座城。
  rationale: 以“杀人者的逃城”替换功能性释义，恢复固定法律术语并保留原文关于杀人情形的未明示范围。重组语序以使汉语更顺畅，同时维持原文的分配关系、两城及各自牧场的重复列举，以及结尾总数。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T05:21:25Z'
