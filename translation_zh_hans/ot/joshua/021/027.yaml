source:
  edition: WLC
  text: וְ/לִ/בְנֵ֣י גֵרְשׁוֹן֮ מִ/מִּשְׁפְּחֹ֣ת הַ/לְוִיִּם֒ מֵ/חֲצִ֞י מַטֵּ֣ה מְנַשֶּׁ֗ה אֶת עִיר֙ מִקְלַ֣ט הָ/רֹצֵ֔חַ אֶת גלון בַּ/בָּשָׁן֙ וְ/אֶת מִגְרָשֶׁ֔/הָ וְ/אֶֽת בְּעֶשְׁתְּרָ֖ה וְ/אֶת מִגְרָשֶׁ֑/הָ עָרִ֖ים שְׁתָּֽיִם־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/027.yaml
  text: And to the sons of Gershon[a], from the clans of the Levites, from the half-tribe of Manasseh, they gave Golan in Bashan, the city of refuge for the manslayer, with its pasturelands, and Beeshterah with its pasturelands—two cities.
translation:
  language: zh_hans
  text: 又从玛拿西半支派中，把巴珊的哥兰，就是杀人者的逃城，连同它的牧场，以及比施提拉[a]连同它的牧场，分给利未人宗族中革顺的子孙；共两座城。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 此处希伯来文本作“比施提拉”；参看《历代志上》6:71，那里作“亚斯她录”。
    reason: 指出平行经文中的地名异文，同时让正文忠实保留马所拉文本的读法。
lexical_decisions:
- source_word: וְ/לִ/בְנֵי גֵרְשׁוֹן
  choice: 革顺子孙
  rationale: בני字面为“儿子们”，在支派谱系与分地语境中泛指后裔；“子孙”既保留谱系表达，也比“儿子们”更符合现代汉语。
- source_word: מִ/מִּשְׁפְּחֹת הַ/לְוִיִּם
  choice: 利未人各宗族中的
  rationale: מִשְׁפְּחוֹת指支派内部的亲族群体；“宗族”准确表达这种谱系和行政层级。
- source_word: מֵ/חֲצִי מַטֵּה מְנַשֶּׁה
  choice: 从玛拿西半支派
  rationale: מַטֶּה在约书亚记分地语境中指“支派”；“半支派”是简洁自然的固定说法。
- source_word: עִיר מִקְלַט הָרֹצֵחַ
  choice: 供杀人者逃难的城
  rationale: מִקְלָט表示避难或收容之处，הָרֹצֵחַ本身为“杀人者”。译文保留该名词未明说蓄意或误杀的形式，同时以法律语境中自然的“逃难的城”表达其功能。
- source_word: גלון בַּ/בָּשָׁן
  choice: 巴珊的哥兰
  rationale: 两者均为地名，采用现代中文圣经读者熟悉的音译形式。
- source_word: מִגְרָשֶׁהָ
  choice: 城周围的牧场
  rationale: מִגְרָשׁ指城外划出的开放用地，供放牧等用途；补出“城周围”使空间关系在现代汉语中清楚。
- source_word: בְּעֶשְׁתְּרָה
  choice: 比施提拉
  rationale: 正文依马所拉文本的地名形式音译，不与历代志上6:71的平行名称“亚斯她录”作无提示的协调。
- source_word: עָרִים שְׁתָּיִם
  choice: 共两座城
  rationale: 这是清单末尾的总数；“共两座城”符合现代汉语列举后的总结方式。
- source_word: implicit verbal sense in allotment list
  choice: 分给
  rationale: 本节没有明写限定动词，需由上下文的分城公式补足。“分给”自然承接本章土地与城邑的分配叙事。
theological_decisions:
- issue: הָרֹצֵחַ是否在正文中明确译为“误杀人者”
  choice: 杀人者
  alternative: 误杀人者
  rationale: 该词本身不编码蓄意与否；虽然逃城法律的整体语境主要涉及非蓄意杀人者，但正文不把上下文限定直接写进词义，以保留原文措辞及其法律张力。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。调整希伯来语语序，使受领者、来源与所分城邑关系清楚；重复“连同城周围的牧场”以保留原文清单式结构。脚注标记置于实际涉及异文的“比施提拉”之后。
