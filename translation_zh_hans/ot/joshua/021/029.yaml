  text: 雅末及其郊野，隐·干宁及其郊野，共四座城。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יַרְמוּת
  choice: 雅末
  rationale: 地名按现代中文圣经常见形式音译，不按词义翻译。
- source_word: מִגְרָשֶׁהָ
  choice: 其郊野
  rationale: מִגְרָשׁ在利未人城邑清单中指城周围供放牧等用途的空地；“郊野”简洁自然，也保留其环绕城邑的土地含义。阴性单数后缀分别指前述各城。
- source_word: עֵין גַּנִּים
  choice: 隐·干宁
  rationale: 复合地名采用音译，并以间隔号标明两个音译成分；不意译为“园子的泉”。
- source_word: עָרִים אַרְבַּע
  choice: 共四座城
  rationale: 这是城邑清单末尾的总数公式；加“共”符合现代汉语列举后的汇总表达。
