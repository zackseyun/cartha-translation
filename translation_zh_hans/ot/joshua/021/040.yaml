base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/040.yaml
  text: All the cities for the sons of Merari[b][a], by their families—the remaining ones from the families of the Levites—were twelve cities by lot.
translation:
  language: zh_hans
  text: 米拉利子孙[a]按宗族抽签所得的所有城邑，共十二座；他们是利未人各宗族中其余的宗族[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “米拉利子孙”或译“米拉利的后裔”或“米拉利人”。
    reason: lexical_alternative
  - marker: b
    text: “其余的宗族”或译“利未人各宗族中其余的（人）”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הֶעָרִים
  choice: 所有……的城
  rationale: עִיר可指城或城镇；本段是分配城邑的名单，译作“城”简洁且与上下文一致。
- source_word: לִבְנֵי מְרָרִי
  choice: 分给米拉利子孙
  rationale: בְּנֵי字面为“儿子们”，在族谱和产业分配语境中泛指后裔；“子孙”既保留希伯来语的亲属表达，也符合现代汉语。
- source_word: לְמִשְׁפְּחֹתָם
  choice: 按宗族
  rationale: מִשְׁפָּחָה可指家族或宗族；此处涉及利未支派内部的群体划分，译作“宗族”较准确自然。
- source_word: הַנּוֹתָרִים מִמִּשְׁפְּחוֹת הַלְוִיִּם
  choice: 利未人各宗族中其余的人
  rationale: 保留“其余、剩下”的实词意义，并维持该短语与米拉利子孙之间的同位说明关系，不将其含义过度具体化。
- source_word: וַיְהִי גּוֹרָלָם
  choice: 都是抽签分得的
  rationale: גּוֹרָל指所抽之签，也可转指借抽签所得的份；结合分城语境，译作“抽签分得”自然地表达分配方式。
- source_word: עָרִים שְׁתֵּים עֶשְׂרֵה
  choice: 共十二座城
  rationale: 按现代汉语语序将数词置于名词之前，并加量词“座”；“共”清楚表达总数。
theological_decisions: []
