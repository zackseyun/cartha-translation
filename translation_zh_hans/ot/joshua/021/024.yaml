  text: 'Aijalon with its pasturelands[a], and Gath-rimmon with its pasturelands: four cities.'
translation:
  language: zh_hans
  text: 亚雅仑和它的郊野[a]，迦特·临门和它的郊野，共四座城。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“它的公用地”或“它周围的土地”；希伯来语指城邑所属的土地，通常用于放牧。
    reason: lexical_alternative
lexical_decisions:
- source_word: אַיָּלוֹן
  choice: 亚雅仑
  rationale: 专有地名按现代中文圣经中较通行的形式音译，不翻译其可能的词义。
- source_word: מִגְרָשֶׁהָ
  choice: 属城的牧场
  rationale: מִגְרָשׁ 指划归城邑使用的城郊土地，在利未人城邑的语境中常用于放牧；“属城的牧场”既表达其归属，也传达主要用途。
- source_word: גַּת רִמּוֹן
  choice: 迦特·临门
  rationale: 复合地名采用音译，并用间隔号表明这是一个由两部分组成的单一地名。
- source_word: עָרִים אַרְבַּע
  choice: 共四座城
  rationale: 这是列举结束时的数目总括；加入“共”符合现代汉语列举习惯，“座”是城邑的自然量词。
- source_word: אֶת ... וְאֶת ... אֶת ... וְאֶת
  choice: 以并列结构表达
  rationale: 反复出现的宾语标记 אֶת 在汉语中没有对应词，故通过地名与附属土地的并列来体现原文结构。
theological_decisions: []
