  text: וַ/יִּתֵּ֤ן יְהוָה֙ לְ/יִשְׂרָאֵ֔ל אֶת כָּל הָ/אָ֔רֶץ אֲשֶׁ֥ר נִשְׁבַּ֖ע לָ/תֵ֣ת לַ/אֲבוֹתָ֑/ם וַ/יִּרָשׁ֖וּ/הָ וַ/יֵּ֥שְׁבוּ בָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/043.yaml
  text: So Yahweh gave Israel all the land that he had sworn to give to their fathers[a], and they took possession of it and lived in it.
translation:
  language: zh_hans
  text: 于是，耶和华把他曾起誓要赐给以色列人的列祖的整片土地赐给以色列人；他们取得了[a]那地，住在其中。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“承受了那地。”这个希伯来语动词在盟约语境中也可有承受产业的意思。
    reason: 保留 ירשׁ 在具体取得土地与盟约性承受产业之间的词义幅度。
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的专名译法，明确保留希伯来文中的神名，而不以“主”替代。
- source_word: וַיִּתֵּן
  choice: 赐给了
  rationale: נתן在此表示神将土地赐予以色列；“赐给”自然体现授予者与领受者的关系。
- source_word: כָּל הָאָרֶץ
  choice: 全部土地
  rationale: 这里的אֶרֶץ指应许给以色列的土地，并非整个世界；“全部”保留כָּל的完整力度。
- source_word: אֲשֶׁר נִשְׁבַּע לָתֵת
  choice: 起誓要赐给
  rationale: 准确表达שׁבע的誓言性质，并以自然中文呈现此前作出的承诺。
- source_word: לַאֲבוֹתָם
  choice: 以色列人列祖
  rationale: “列祖”保留原文阳性家族称谓，并在中文圣经语体中自然指向族长；补出“以色列人”以避免“他们”的指代在长句中含混。
- source_word: וַיִּרָשׁוּהָ
  choice: 他们占有了那地
  rationale: ירשׁ在此表示取得并持有土地；“占有”保留具体的领地含义，同时以脚注注明可能的盟约性“承受”含义。
- source_word: וַיֵּשְׁבוּ בָהּ
  choice: 住在那里
  rationale: ישׁב加ב在此表示居住于那地；“住在那里”直接、自然，不额外强化为建立定居点。
- source_word: וַ
  choice: 于是
  rationale: 句首叙事连接词在这里引出总结性结果；“于是”既承接上文，也符合现代中文叙事。
theological_decisions:
- issue: 土地应许成就陈述的范围和力度
  choice: 直译为耶和华把应许的“全部土地”赐给以色列人，他们也占有并居住其中。
  alternative: 将“全部”弱化为部分成就，或把本节解释成必须排除其他征服叙事所保留的一切张力的绝对化陈述。
  rationale: 原文以כָּל明确作出强有力的成就总结。译文保留这一力度，但不在翻译中加入体系化限定，也不代替经文本身解决它与其他相关段落之间的张力。
- issue: ירשׁ的具体占有与盟约承受含义
  choice: 正文采用“占有了”，脚注保留“承受了”的可能性。
  alternative: 正文直接译作“承受了”或“继承了”。
  rationale: 上下文强调进入并居住那地，“占有”较直接；但该动词在盟约土地语境中可带有承受产业的意味，因此不应完全抹去这一层含义。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“列祖”保留适度的圣经语体，其余措辞力求普通读者易懂。脚注标记置于它所说明的“占有了”之后。
