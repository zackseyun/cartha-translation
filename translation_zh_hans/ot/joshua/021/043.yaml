  rationale: 修订仅改善中文句法和指代：以“曾”明确起誓在赐地之前，以“以色列人的列祖”消除所属关系可能的歧义，并以“整片土地”“住在其中”提升现代汉语自然度。未改变原文关于土地范围、起誓、取得和居住的陈述力度，也保留脚注锚点及词义替代。
