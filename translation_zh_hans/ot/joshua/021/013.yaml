revisions:
- from: 他们把误杀人的逃城希伯仑和城郊的牧场，以及立拿和城郊的牧场，给了祭司亚伦的子孙。
  to: 他们把希伯仑，就是杀人者的逃城〔a〕，连同它的城郊牧场，以及立拿连同它的城郊牧场，给了祭司亚伦的子孙。
  rationale: 修订以“杀人者”对应רֹצֵחַ，避免把原文未直接明示的“误杀”写入正文；脚注保留逃城制度中有关非故意致死和未预断罪责的法律语境。“就是……逃城”明确希伯仑与该称谓的同位关系，并保留两座城各自附有城郊牧场的结构。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T05:21:01Z'
review_pass:
  verdict: revise
  source_fidelity: 原译准确保留了亚伦后裔为受领者、希伯仑作为逃城、两城及各自城郊土地的列举。不过“误杀人的”将רֹצֵחַ在本节中的法律称谓直接限定为“误杀”，超出该词本身所明示的范围；该制度虽尤其涉及非故意致死者，文本中的称谓仍宜保留其法律上的开放性，并以脚注说明。
  naturalness: 原句总体自然，但“误杀人的逃城”略显紧缩，且可能被理解为只为已确定属误杀的人设立。以同位语说明希伯仑是逃城，汉语更清楚庄重。
  terminology: “祭司亚伦的子孙”“希伯仑”“立拿”及“城郊牧场”均可接受。建议将“误杀人”改为“杀人者”，并用脚注交代此处不是预断蓄意谋杀的称谓。
  issues:
  - severity: medium
    issue: “误杀人的”过度限定了רֹצֵחַ。
    rationale: רֹצֵחַ是“致人死亡者／杀人者”的法律称谓；逃城法规涉及非故意致死者及审判程序，但本词在本节本身不直接断定该人已经被认定为“误杀”。正文应避免替原文作出超出的法律事实判断。
  - severity: low
    issue: 缺少用于保留法律术语歧义的脚注。
    rationale: 将正文改为“杀人者的逃城”后，脚注可说明这并不必然指蓄意杀人者，也不应把本节术语狭义化为已经认定的误杀者。
  revised_text: 他们把希伯仑，就是杀人者的逃城〔a〕，连同它的城郊牧场，以及立拿连同它的城郊牧场，给了祭司亚伦的子孙。
  revised_footnotes:
  - marker: a
    text: 或译“为杀人者设立的逃城”。这里的“杀人者”是逃城制度中的法律称谓，指致人死亡而可逃往逃城的人，并不必然表示蓄意谋杀，也不在本节中预先断定其为误杀。
    reason: lexical_alternative
  revision_rationale: 修订以“杀人者”对应רֹצֵחַ，避免把原文未直接明示的“误杀”写入正文；脚注保留逃城制度中有关非故意致死和未预断罪责的法律语境。“就是……逃城”明确希伯仑与该称谓的同位关系，并保留两座城各自附有城郊牧场的结构。
