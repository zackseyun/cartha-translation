  text: וְ/לִ/בְנֵ֣י אַהֲרֹ֣ן הַ/כֹּהֵ֗ן נָֽתְנוּ֙ אֶת עִיר֙ מִקְלַ֣ט הָ/רֹצֵ֔חַ אֶת חֶבְר֖וֹן וְ/אֶת מִגְרָשֶׁ֑/הָ וְ/אֶת לִבְנָ֖ה וְ/אֶת מִגְרָשֶֽׁ/הָ׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/013.yaml
  text: And to the sons of Aaron the priest they gave Hebron[a], the city of refuge for the manslayer, with its pasturelands, and Libnah with its pasturelands.
translation:
  language: zh_hans
  text: 他们把希伯仑，就是杀人者的逃城〔a〕，连同它的城郊牧场，以及立拿连同它的城郊牧场，给了祭司亚伦的子孙。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְלִבְנֵי אַהֲרֹן הַכֹּהֵן
  choice: 给了祭司亚伦的子孙
  rationale: לְ 标明受领者；בְּנֵי 在祭司谱系语境中包括后裔，译作“子孙”比仅指亲生儿子的“儿子”更自然准确。הַכֹּהֵן 在此修饰亚伦，译作“祭司亚伦”。
- source_word: נָתְנוּ
  choice: 他们把……给了
  rationale: 保留 נתן 的基本义“给”；调整为现代汉语常用的“把”字句，使受领者和所给城邑的关系清楚。
- source_word: עִיר מִקְלַט הָרֹצֵחַ
  choice: 误杀人的逃城
  rationale: מִקְלָט 指避难、收容之处；在律法语境中，רֹצֵחַ 此处指可逃往逃城、尚待审判的致人死亡者，并不必然是蓄意谋杀者。“误杀人的逃城”符合本卷既有法律背景，也避免“凶手”所暗含的预谋定罪。
- source_word: חֶבְרוֹן
  choice: 希伯仑
  rationale: 采用现代中文圣经地名的通行音译。
- source_word: מִגְרָשֶׁיהָ
  choice: 城郊的牧场
  rationale: מִגְרָשׁ 指隶属城邑的外围公地，常供牧放牲畜；“城郊的牧场”兼顾其位置和用途，并以“城郊”对应阴性单数后缀所指的城。
- source_word: לִבְנָה
  choice: 立拿
  rationale: 采用现代中文圣经地名的通行音译。
theological_decisions:
- issue: רֹצֵחַ 是否应译成带有蓄意犯罪意味的“杀人犯”
  choice: 误杀人的
  alternative: 杀人者的／凶手的
  rationale: 逃城制度特别保护无意致人死亡、需等候会众审判的人；本节的法律术语不宜预先断定其为蓄意谋杀者。上下文已明确制度范围，因此采用简明的“误杀人的”。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。句序按汉语重组为“把……给了……”，同时保留希伯来文列举两座城及各自牧场的结构。未设置脚注，因为正文“误杀人的逃城”已自然表达此处法律术语的关键区别。
