  text: 'For the sons of Merari[a], according to their families, from the tribe of Reuben and from the tribe of Gad and from the tribe of Zebulun: twelve cities.'
translation:
  language: zh_hans
  text: 米拉利的子孙[a]，按他们的宗族，从吕便支派、迦得支派和西布伦支派分得十二座城。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“给米拉利的子孙，按他们的宗族：从吕便支派、迦得支派和西布伦支派，共十二座城。”
    reason: 希伯来语介词ל可表示分配的对象；正文以“分得”结合上下文自然表达这一分配关系，脚注保留较形式对应的“给”。
lexical_decisions:
- source_word: לִבְנֵי מְרָרִי
  choice: 米拉利的子孙
  rationale: בני在族谱和分地语境中指一位祖先的后裔；译作“子孙”比字面的“儿子们”更符合现代汉语，也保留宗族关系。前缀ל在此表示分配对象，汉语借“所得的”表达。
- source_word: לְמִשְׁפְּחֹתָם
  choice: 按着宗族
  rationale: משפחה在支派以下的群体划分中通常指宗族；“按着”体现ל所带的分类、分配意义。
- source_word: מִמַּטֵּה
  choice: 从……支派
  rationale: מטה在以色列分地语境中指“支派”，מן表示这些城的来源。
- source_word: רְאוּבֵן
  choice: 吕便
  rationale: 采用现代中文圣经中通行的人名译法。
- source_word: גָד
  choice: 迦得
  rationale: 采用现代中文圣经中通行的人名译法。
- source_word: זְבוּלֻן
  choice: 西布伦
  rationale: 采用现代中文圣经中通行的人名译法。
- source_word: עָרִים שְׁתֵּים עֶשְׂרֵה
  choice: 共十二座城
  rationale: 准确表达数量，并以量词“座”和“共”形成自然、庄重的现代汉语清单句式。
