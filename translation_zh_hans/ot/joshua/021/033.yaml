  text: All the cities of the Gershonites by their families were thirteen cities[a], with their pasturelands.
translation:
  language: zh_hans
  text: 革顺人各宗族的城邑共十三座，连同各城的牧场。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כָּל עָרֵי
  choice: 所得的城，共
  rationale: כָּל与后面的数目构成总计句式；结合分城语境，用“所得的城，共”自然表达总数，而不把“所得”误当作原文独立词义。
- source_word: הַגֵּרְשֻׁנִּי
  choice: 革顺人
  rationale: 带冠词的族称单数在此作集合用法，指革顺的后裔群体；“革顺人”简洁并符合中文圣经人名派生表达。
- source_word: לְמִשְׁפְּחֹתָם
  choice: 按着宗族
  rationale: 介词לְ在此表示按群体分类或分配；“按着宗族”保留内部宗族划分的含义。
- source_word: שְׁלֹשׁ עֶשְׂרֵה עִיר
  choice: 十三座
  rationale: 中文量词“座”与前文“城”搭配自然，避免重复，同时准确保留十三城的总数。
- source_word: וּמִגְרְשֵׁיהֶן
  choice: 连同各城的牧场
  rationale: מִגְרָשׁ在利未城邑分配语境中指城周围供牲畜使用的空地或牧地；“牧场”清楚易懂。连接词וּ在此表示附带计入，译作“连同”；复数后缀按中文语境明确为“各城的”。
