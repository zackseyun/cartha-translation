  text: 'and from the tribe of Asher: Mishal with its pasturelands[b][a], and Abdon with its pasturelands.'
translation:
  language: zh_hans
  text: 又从亚设支派得了米沙勒及其草场[a][b]，以及押顿和它的草场。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “米沙勒”也可按 Misheal 音译；这个地名有不同的音译形式。
    reason: lexical_alternative
  - marker: b
    text: “草场”指归属该城的周边空地，尤其供放牧及其他公共用途。
    reason: cultural_note
lexical_decisions:
- source_word: וּ/מִ/מַּטֵּה אָשֵׁר
  choice: 又从亚设支派
  rationale: מַטֶּה在支派分地的语境中指“支派”；וּמִ־承接上文，译作“又从”。亚设采用现代中文圣经中通行的名称。
- source_word: מִשְׁאָל
  choice: 米沙勒
  rationale: 按希伯来辅音形式音译该地名；不同传统对元音及译名处理略有差异，故加注说明。
- source_word: מִגְרָשֶׁהָ
  choice: 它的草场
  rationale: מִגְרָשׁ指城邑所属的周边空地，常用于放牧及公共用途；“草场”简洁自然，并与利未城邑清单的语境相符。阴性单数后缀指所列城邑。
- source_word: עַבְדּוֹן
  choice: 押顿
  rationale: 采用该地名在现代中文圣经中的通行音译。
- source_word: אֶת / וְאֶת
  choice: （宾语标记不译；连接词译作“以及”）
  rationale: אֶת是直接宾语标记，中文无需明译；第二项前的וְ以“以及”表达并列关系。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事用语。以“得了”补足本节承接上文的省略谓语，使中文可独立朗读；两个地名之间用“以及”保持清晰并列。所有注脚标记均置于相关词语之后。
