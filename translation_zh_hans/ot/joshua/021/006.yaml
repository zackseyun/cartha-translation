base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/006.yaml
  text: And to the sons of Gershon[a], from the families of the tribe of Issachar, and from the tribe of Asher, and from the tribe of Naphtali, and from the half-tribe of Manasseh in Bashan, by lot, thirteen cities.
translation:
  language: zh_hans
  text: 革顺的子孙，从以萨迦支派的各宗族[a]、亚设支派、拿弗他利支派，以及巴珊境内的玛拿西半支派中，抽签分得十三座城。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “宗族”也可译为“氏族”或“家族群体”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/לִ/בְנֵי גֵרְשׁוֹן
  choice: 革顺的子孙
  rationale: בְּנֵי在利未宗族的谱系语境中指革顺的后裔群体；译作“子孙”既贴近原文，也比直译“儿子们”更符合现代汉语。句首的连接词和介词所表达的承接与受益关系，通过“分得”自然体现。
- source_word: מִ/מִּשְׁפְּח֣וֹת
  choice: 从……各宗族
  rationale: מִשְׁפָּחוֹת可指扩展家庭或宗族群体；此处是支派内部的组成单位，译作“各宗族”准确且自然。
- source_word: מַטֵּה
  choice: 支派
  rationale: 在约书亚记的土地与城邑分配语境中，מַטֶּה明确指以色列的支派单位。
- source_word: וּ֠/מֵ/חֲצִי מַטֵּה מְנַשֶּׁה בַ/בָּשָׁן
  choice: 以及巴珊境内的玛拿西半支派
  rationale: חֲצִי מַטֶּה指玛拿西支派中位于约旦河东的一半；“巴珊境内的”按原文修饰该半支派，并保留地理限定。
- source_word: בַּ/גּוֹרָל
  choice: 抽签分得
  rationale: 该短语表示分配的方式。结合句中省略的分配动词，译为“抽签分得”使现代汉语句子完整，同时保留以抽签决定分配的含义。
- source_word: עָרִים שְׁלֹשׁ עֶשְׂרֵה
  choice: 十三座城
  rationale: עָרִים在本章指分给利未人的城邑；“十三座城”符合现代汉语量词习惯和本段正式语体。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而清楚的叙事用语。保留原文列举各支派的结构，但以“抽签分得”补足希伯来语名词句在中文中所需的谓语。专名采用简体中文圣经中通行的译名：革顺、以萨迦、亚设、拿弗他利、玛拿西、巴珊。
