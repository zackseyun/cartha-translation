  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַֽ/יִּגְּשׁ֗וּ רָאשֵׁי֙ אֲב֣וֹת הַ/לְוִיִּ֔ם אֶל אֶלְעָזָר֙ הַ/כֹּהֵ֔ן וְ/אֶל יְהוֹשֻׁ֖עַ בִּן נ֑וּן וְ/אֶל רָאשֵׁ֛י אֲב֥וֹת הַ/מַּטּ֖וֹת לִ/בְנֵ֥י יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/001.yaml
  text: Then the heads of the fathers’ houses of the Levites came near to Eleazar the priest[a], to Joshua son of Nun[b], and to the heads of the fathers’ houses of the tribes of the sons of Israel.
translation:
  language: zh_hans
  text: 于是，利未人各父系宗族的首领[a]来到祭司以利亚撒、嫩的儿子约书亚，以及以色列人[b]各支派的父系宗族首领面前。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “父系宗族”所译的希伯来语习语，字面与“父家”有关，指按父系血缘组织的家族或宗族单位。
    reason: 说明古代以色列社会组织术语及其男性亲属用语。
  - marker: b
    text: “以色列人”字面为“以色列的众子”。
    reason: 保留原文的字面亲属称谓。
lexical_decisions:
- source_word: וַיִּגְּשׁוּ
  choice: 于是……来到……面前
  rationale: נגשׁ表示走近、来到某人面前；此处用“来到……面前”自然表达这些首领正式前往见以利亚撒、约书亚和各支派首领。叙事连接词וַ用“于是”承接上文。
- source_word: רָאשֵׁי אֲבוֹת
  choice: 各父系宗族的首领
  rationale: 这一希伯来语习语指由父系家族构成的宗族单位及其领袖。“父系宗族”既保留父系社会结构，也比直译“父亲们的首领”更符合现代汉语。
- source_word: הַלְוִיִּם
  choice: 利未人
  rationale: 这是לְוִיִּם在现代中文圣经语境中的标准族群名称。
- source_word: אֶלְעָזָר הַכֹּהֵן
  choice: 祭司以利亚撒
  rationale: כֹּהֵן直接译作“祭司”；按自然汉语语序将职衔置于人名前。
- source_word: יְהוֹשֻׁעַ בִּן נוּן
  choice: 嫩的儿子约书亚
  rationale: 明确保留希伯来语父名结构，同时采用自然、庄重的现代汉语表达。
- source_word: רָאשֵׁי אֲבוֹת הַמַּטּוֹת
  choice: 各支派的父系宗族首领
  rationale: מַטּוֹת指以色列的各支派；译文保留支派之下父系宗族领袖这一层级关系。
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 字面为“以色列的众子”，在此是对以色列全体民众的惯用称呼；“以色列人”在现代汉语中准确自然，字面形式另以脚注说明。
theological_decisions:
- issue: 以色列支派制度中的男性亲属称谓
  choice: 以“父系宗族”保留אָבוֹת所体现的父系社会结构，并将בְנֵי יִשְׂרָאֵל译为惯用的“以色列人”
  alternative: 将两处分别直译为“父家”和“以色列的众子”
  rationale: “父系宗族”能保留原文社会结构而不造成“父亲们的首领”之类误解；בְנֵי יִשְׂרָאֵל则是全体族民的固定称呼，译为“以色列人”并未限定只有男性，脚注保留其字面亲属意象。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“来到……面前”适合本节正式陈情的场景；“父系宗族”兼顾原文社会结构和现代读者的可理解性。
