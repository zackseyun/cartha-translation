  text: Jattir with its pasturelands[a], and Eshtemoa with its pasturelands.
translation:
  language: zh_hans
  text: 雅提珥及其周围的牧场[a]，以实提莫及其周围的牧场。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “牧场”也可译作“公用地”，指每座城周围的土地。
    reason: lexical_alternative
lexical_decisions:
- source_word: יַתִּר
  choice: 雅提珥
  rationale: 地名按希伯来语音译；采用现代中文圣经地名中自然、易辨认的形式。
- source_word: מִגְרָשֶׁהָ
  choice: 城周围的牧场
  rationale: מִגְרָשׁ 指分配给城邑、位于城周围的开放用地，常供牲畜放牧。译出“城周围”可明确其空间关系，“牧场”则传达本段利未城邑清单中的主要用途。阴性单数后缀分别回指各城，因此两处均译作“城周围的”。
- source_word: אֶשְׁתְּמֹעַ
  choice: 以实提莫
  rationale: 地名按希伯来语音译，保留原名而不意译。
- source_word: וְאֶת
  choice: 和／以及
  rationale: וְ 表示清单项目之间的连接；אֶת 是直接宾语标记，中文无需另译。为使并列层次自然，分别采用“和”与“以及”。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而清楚的清单式表达。“城周围的牧场”比单说“牧场”更完整地呈现 מִגְרָשׁ 的城郊土地含义，同时脚注保留“公用地”这一词义可能。
