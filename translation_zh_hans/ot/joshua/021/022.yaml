  yaml_path: translation/ot/joshua/021/022.yaml
  text: and Kibzaim with its pasturelands[a], and Beth-horon with its pasturelands—four cities.
translation:
  language: zh_hans
  text: 又给了基比先和它的郊野[a]，伯和仑和它的郊野，共四座城。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “郊野”也可译作“公用地”或“牧放地”。希伯来语指归城所有、位于城周围的开放用地。
    reason: lexical_alternative
lexical_decisions:
- source_word: קִבְצַיִם
  choice: 基伯先
  rationale: 作为地名按希伯来语音译；采用现代中文圣经地名中较常见的形式。
- source_word: מִגְרָשֶׁהָ
  choice: 城外的草场
  rationale: 该词指归城所有、位于城周围的开放用地，在利未人城邑的语境中可供放牧；译作“城外的草场”既交代其与城的关系，也符合现代汉语表达。阴性单数后缀所指的所属关系在中文中结合“城外的”自然表达。
- source_word: בֵּית חוֹרֹן
  choice: 伯和仑
  rationale: 作为地名音译，不按其字面构词译为“和仑之家”。
- source_word: עָרִים אַרְבַּע
  choice: 共四座城
  rationale: 这是本段城邑清单末尾的数目总结；加“共”自然呈现汇总功能。
- source_word: וְאֶת ... וְאֶת
  choice: 又给了……以及……
  rationale: וְ连接清单中的项目，אֶת为宾语标记而不单独翻译；中文承接上下文补出“给了”，并用“以及”协调两个城名。
theological_decisions: []
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。保留城邑清单的简洁结构，并以“共四座城”呈现原文结尾的汇总语气。脚注说明 מִגְרָשׁ 的语义范围，避免把它仅限于严格意义上的牧草地。
