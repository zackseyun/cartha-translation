  text: 何仑及其牧场地，底璧及其牧场地。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חֹלֹן
  choice: 何仑
  rationale: 这是地名，按现代中文圣经地名的常见音译形式处理；本节马所拉文本作“何仑”。
- source_word: מִגְרָשֶׁהָ
  choice: 城郊的牧场
  rationale: מִגְרָשׁ指归属城邑、位于城周围的公用空地，尤其供牲畜放牧；译作“城郊的牧场”既交代位置，也符合利未人城邑的语境。阴性单数后缀分别指所列的各城，中文按语境表达。
- source_word: דְּבִר
  choice: 底璧
  rationale: 这是地名，采用现代中文圣经中通行的音译形式，不按其可能的词义翻译。
- source_word: וְאֶת
  choice: 和
  rationale: וְ表示并列，אֶת是直接宾语标记，中文无需另译；重复结构以“和”自然连接各城及其牧场。
theological_decisions: []
