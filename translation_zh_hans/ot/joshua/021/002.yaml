base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/002.yaml
  text: And they spoke to them at Shiloh in the land of Canaan[a], saying, “Yahweh commanded through Moses to give us cities to dwell in[b], along with their pasturelands for our livestock.”
translation:
  language: zh_hans
  text: 他们在迦南地的示罗对他们说：“雅威借摩西吩咐，把城邑赐给我们居住，并赐城邑的郊野[a]供我们的牲畜使用。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“城邑周围的开放用地”或“公共用地”。希伯来语指城邑周边的土地；在此处用于牲畜放牧。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבְּרוּ אֲלֵיהֶם
  choice: 他们对众人说
  rationale: דבר在此是“说、讲话”，אֲלֵיהֶם表示话语所指向的对象。根据上文所指，在中文中用“众人”比重复不明的“他们”更自然，但不增加新的身份信息。
- source_word: בְּשִׁלֹה בְּאֶרֶץ כְּנַעַן
  choice: 在迦南地的示罗
  rationale: 保留“迦南地”及地名“示罗”，并按现代汉语习惯组合地点表达。
- source_word: יְהוָה
  choice: 雅威
  rationale: 直接音译四字神名，保留原文使用专名而非称号的特点。
- source_word: צִוָּה בְיַד מֹשֶׁה
  choice: 曾借摩西吩咐
  rationale: בְיַד מֹשֶׁה字面为“藉摩西的手”，在此表达中介或代理；“借摩西”自然传达该希伯来语习语。
- source_word: לָתֶת לָנוּ עָרִים לָשָׁבֶת
  choice: 要把城邑给我们居住
  rationale: 保留“给我们”与居住目的；“城邑”适合土地分配的历史叙事语境，也不暗示现代大型城市。
- source_word: וּמִגְרְשֵׁיהֶן לִבְהֶמְתֵּנוּ
  choice: 并把城邑四周的牧场给我们的牲畜使用
  rationale: מִגְרָשׁ指城邑周围的开放用地，在本语境主要供牲畜牧放；译文明确其位置和用途，避免将其理解为城内土地。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用以色列神的专名。译作“雅威”保留专名性质，避免以称号代替；“耶和华”是传统形式，但较不贴近通常重构的读音。
- issue: “借摩西”所表达的代理关系
  choice: 雅威借摩西吩咐
  alternative: 雅威吩咐摩西；雅威藉摩西的手吩咐
  rationale: 原文不是说摩西是命令的受领对象，而是说命令通过摩西传达；译文保留神为命令来源、摩西为中介的关系。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“城邑”比“城市”更符合古代土地分配语境；“给……使用”使牧场与牲畜之间的关系在汉语中完整自然。原英文脚注标记的位置与其脚注内容明显错配，故依据希伯来原文独立处理，并不设置无必要脚注。
