  to: 他们在迦南地的示罗对他们说：“雅威借摩西吩咐，把城邑赐给我们居住，并赐城邑的郊野[a]供我们的牲畜使用。”
  rationale: 修订不补足原文未明说的受话对象，删去无必要的“曾”，并以“赐给我们居住”改善汉语句法。将“牧场”改为“郊野”，以避免过度收窄מִגְרָשׁ的词义，同时通过有明确锚点的脚注交代其在本段的放牧用途。
