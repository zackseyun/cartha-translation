base_translation:
  language: en
  yaml_path: translation/ot/joshua/016/006.yaml
  text: Then the border went out westward to Michmethath on the north[a], and the border turned eastward to Taanath-shiloh, and passed it on the east to Janoah.
translation:
  language: zh_hans
  text: 边界向西[a]延伸到北边的密米他，随后转向东，到他纳示罗，又从它东面经过，直到雅挪哈。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“向海”；在希伯来语中，这是表示“向西”的常用说法。
    reason: 保留原文的方位习语及其海洋意象。
lexical_decisions:
- source_word: וְיָצָא
  choice: 随后……延伸
  rationale: 在划界记述中，יצא表示界线继续向前伸展；“延伸”比直译“出去”更符合现代汉语地理叙述。“随后”自然表达连接词所标示的推进。
- source_word: הַגְּבוּל
  choice: 边界
  rationale: 此处指支派所得土地的界线，而非整片疆域；“边界”准确且自然。
- source_word: הַיָּמָּה
  choice: 向西
  rationale: 字面为“向海”，是希伯来语表示西方的常用方位说法；正文译出实际方位，并以脚注保留原文意象。
- source_word: הַמִּכְמְתָת
  choice: 密米他
  rationale: 按现代中文圣经地名惯例音译该地名。
- source_word: מִצָּפוֹן
  choice: 北边的
  rationale: 该短语在此说明密米他位于所述路线的北边；原文关系略简略，译文避免进一步指定为城的某一侧。
- source_word: וְנָסַב
  choice: 转向
  rationale: 在边界记述中，נסב表示界线改变方向；“转向”简洁自然。
- source_word: מִזְרָחָה
  choice: 向东
  rationale: 词尾的方向形式表示朝东方移动，故译为“向东”。
- source_word: תַּאֲנַת שִׁלֹה
  choice: 他纳示罗
  rationale: 按现代中文圣经地名惯例音译复合地名。
- source_word: וְעָבַר אֹתוֹ
  choice: 又从它……经过
  rationale: עבר在划界语境中表示界线经过某地；代词指前述的他纳示罗。“从它东面经过”自然表达路线与该地的相对位置。
- source_word: מִמִּזְרַח
  choice: 从它东面
  rationale: 说明边界经过他纳示罗时位于其东侧；补出代词使现代汉语关系清楚，但不改变所指。
- source_word: יָנוֹחָה
  choice: 直到雅挪哈
  rationale: 地名后的方向形式表明路线朝雅挪哈而去；“直到”在中文划界叙述中自然体现这一趋向。
