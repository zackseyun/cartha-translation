base_translation:
  language: en
  yaml_path: translation/ot/joshua/016/003.yaml
  text: Then it went down westward to the border of the Japhletites[a], as far as the border of Lower Beth-horon, and as far as Gezer; and its goings out were at the sea.
translation:
  language: zh_hans
  text: 又向西下行，到雅弗利提人的边界，直到下伯和仑的边界，又到基色；这边界的尽头是在海边[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译可作“它的出口（或尽头）在海的方向”。这是描述边界的惯用语，指边界延伸至海边而终止。
    reason: 说明希伯来语边界公式及其字面表达。
lexical_decisions:
- source_word: וְיָרַד
  choice: 又……下到
  rationale: ירד保留沿地势下行的含义；连接词按边界描述的连续行程译为“又”。
- source_word: יָמָּה
  choice: 向西
  rationale: 方向形式源自“海”，在此类迦南地理描述中通常表示朝地中海方向，即“向西”。
- source_word: אֶל גְּבוּל הַיַּפְלֵטִי
  choice: 到雅弗利提人的边界
  rationale: גְּבוּל指边界；הַיַּפְלֵטִי是族称，采用音译并以“人”自然表达。
- source_word: עַד גְּבוּל בֵּית חוֹרֹן תַּחְתּוֹן
  choice: 直到下伯和仑的边界
  rationale: עַד表示延伸所至；תַּחְתּוֹן用来区别下伯和仑与上伯和仑。
- source_word: וְעַד גָּזֶר
  choice: 又到基色
  rationale: 重复的עַד继续标示边界延伸至下一地点；“基色”采用通行中文地名。
- source_word: וְהָיוּ תֹצְאֹתָיו יָמָּה
  choice: 这边界的终点在海边
  rationale: תֹצְאֹתָיו在划界公式中指边界延伸的出口、尽头或终止点；译作“终点”既自然又保留地理含义。末尾יָמָּה按实际终点理解为海边，而非再次仅译作方向。
