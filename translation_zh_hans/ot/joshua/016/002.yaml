  text: Then it went out from Bethel to Luz[a], and passed on to the border of the Arkites at Ataroth.
translation:
  language: zh_hans
  text: 然后，边界从伯特利向路斯延伸，又延至亚基人[a]的边界，到亚他录。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “亚基人”也可按另一种音译作“阿尔基人”。
    reason: 保留族称 הָאַרְכִּי 的音译差异。
lexical_decisions:
- source_word: וְיָצָא
  choice: 然后，边界……伸向
  rationale: 原文没有明说主语，但承接上一节所述的地界；汉语补出“边界”以使所指清楚。“伸向”符合划界路线的语境。
- source_word: מִבֵּית אֵל
  choice: 从伯特利
  rationale: 采用该地名在现代中文圣经中的通行音译。
- source_word: לוּזָה
  choice: 向路斯
  rationale: 词尾的方向词素表示朝向路斯；译作“向”既自然，也不强行断定边界进入或止于该地。
- source_word: וְעָבַר
  choice: 又经过
  rationale: 在地界行程中表示边界继续经过某处；“经过”比“越过”更避免暗示跨越障碍。
- source_word: אֶל גְּבוּל
  choice: 到……的边界
  rationale: גְּבוּל在分地语境中指疆界或边界；此处用“边界”准确且自然。
- source_word: הָאַרְכִּי
  choice: 亚基人
  rationale: 这是族称，指亚基族的人；采用简洁、通行的中文音译，并以脚注注明音译差异。
- source_word: עֲטָרוֹת
  choice: 亚他录
  rationale: 采用该地名在现代中文圣经中的通行音译。
