  text: Then it went down from Janoah to Ataroth and Naarah[a], and reached Jericho[c][b], and ended at the Jordan.
translation:
  language: zh_hans
  text: 然后，边界从雅挪哈下到亚他录和拿拉[a]，到达耶利哥[b]，通到约旦河[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文作“拿拉”；此地名也常被联系于作“拿拉特”的地名，但两者是否为同一地点未能确定。
    reason: alternative_reading
  - marker: b
    text: 或译“接到耶利哥”；这里的希伯来动词可指地界线与某地相接或触及某地。
    reason: lexical_alternative
  - marker: c
    text: 直译“出到约旦河”；这是希伯来文描述地界走向或终点的惯用表达。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָרַד מִיָּנוֹחָה
  choice: 然后，边界从雅挪哈下到
  rationale: ירד在地界描述中表示地界线向下延伸，可能涉及地势或方向；“下到”既贴近原文，又符合现代汉语。原文主语承接上下文，译文补出“边界”以便理解。
- source_word: עֲטָרוֹת וְנַעֲרָתָה
  choice: 亚他录和拿拉
  rationale: 按马所拉文本音译两个地名；拿拉的词形带有表示方向的-ה，不作为地名的一部分音译。
- source_word: וּפָגַע בִּירִיחוֹ
  choice: 到达耶利哥
  rationale: פגע在地界记述中可表示地界与某处相接、触及或到达；“到达”自然清楚，同时以脚注保留“接到”的空间性译法。
- source_word: וְיָצָא הַיַּרְדֵּן
  choice: 延伸到约旦河
  rationale: יצא在地界公式中描述界线所到之处或终点。希伯来文此处未明示方向介词，汉语据该公式的功能译作“延伸到”，避免生硬直译为“出去”。
- source_word: הַיַּרְדֵּן
  choice: 约旦河
  rationale: 采用现代汉语通行河名；原文定冠词不需在汉语中另译。
