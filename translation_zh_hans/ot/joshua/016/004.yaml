  text: And the sons of Joseph[a], Manasseh and Ephraim, received their inheritance.
translation:
  language: zh_hans
  text: 约瑟的子孙玛拿西和以法莲承受了他们的产业。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “承受了他们的产业”也可译作“得了他们的产业”或“取得了他们的产业”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּנְחֲלוּ
  choice: 得了他们的产业
  rationale: נחל在此处指取得所分配的产业。译作“得了他们的产业”既符合约书亚记分地的语境，也避免“占领”过分强调军事行动；希伯来文未明说宾语，但上下文清楚指所分得的土地产业。
- source_word: בְנֵי יוֹסֵף
  choice: 约瑟的子孙
  rationale: בְנֵי字面为“儿子们”，但此处玛拿西和以法莲代表由约瑟而出的支派群体；现代汉语译作“子孙”可自然表达族裔后代的含义，避免使人误以为只指约瑟的两个亲生儿子。
- source_word: מְנַשֶּׁה
  choice: 玛拿西
  rationale: 采用现代中文圣经中通行的人名音译。
- source_word: וְאֶפְרָיִם
  choice: 和以法莲
  rationale: 采用现代中文圣经中通行的人名音译，并保留连接词。
- source_word: וַ
  choice: 于是
  rationale: 前缀וַ推动叙事向前；“于是”在现代汉语中自然表达承接前文分地叙事的顺承关系。
theological_decisions: []
translation_notes:
