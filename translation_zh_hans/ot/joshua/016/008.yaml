base_translation:
  language: en
  yaml_path: translation/ot/joshua/016/008.yaml
  text: From Tappuah the border goes westward to the Brook of Kanah[a], and its end was at the sea[c][b]. This is the inheritance of the tribe of the sons of Ephraim according to their families.
translation:
  language: zh_hans
  text: 界线从他普亚向西延伸，到加拿河[a]，终点在海边。这是以法莲子孙的支派按宗族所得的产业。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “河”也可译作“溪谷”或“旱溪”。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִתַּפּוּחַ
  choice: 从他普亚
  rationale: 介词 מִן 表示界线的起点；地名按现代中文圣经常见形式音译为“他普亚”。
- source_word: יֵלֵךְ הַגְּבוּל
  choice: 界线……延伸
  rationale: הלך 与 גְּבוּל 连用时描述疆界的走向；“延伸”符合现代汉语地界叙述，也保留动态意味。
- source_word: יָמָּה
  choice: 向西
  rationale: 该方向形式字面与“海”有关，在迦南地界叙述中通常表示朝地中海方向，即向西。
- source_word: נַחַל קָנָה
  choice: 加拿河谷
  rationale: נַחַל 可指季节性水道、溪流或河谷；“河谷”既适合当地地貌，也比音译“旱溪”更易懂。
- source_word: וְהָיוּ תֹצְאֹתָיו הַיָּמָּה
  choice: 终点在海边
  rationale: תֹצְאֹתָיו 在界线公式中指界线的尽头；希伯来语虽用复数形式，现代汉语以单数“终点”表达更自然。第二个 הַיָּמָּה 在此表示实际抵达海边，而不只是向西。
- source_word: זֹאת נַחֲלַת
  choice: 这是……所得的产业
  rationale: 该短语总结所划分的领地；“产业”保留 נַחֲלָה 作为承受之地的传统与法律色彩。
- source_word: מַטֵּה בְנֵי אֶפְרַיִם
  choice: 以法莲子孙支派
  rationale: מַטֵּה 在此指支派；בְנֵי אֶפְרַיִם 字面为“以法莲的儿子们”，是以祖先之名指称其后裔支派的固定表达，译作“以法莲子孙”兼顾字面结构和中文习惯。
- source_word: לְמִשְׁפְּחֹתָם
  choice: 按宗族
  rationale: מִשְׁפָּחוֹת 在支派土地分配语境中指支派内部的宗族单位；“宗族”比现代日常意义的“家庭”更准确。
theological_decisions:
- issue: בְנֵי אֶפְרַיִם 的性别与支派称谓
  choice: 以法莲子孙
  alternative: 以法莲的后裔／以法莲人
  rationale: 原文采用阳性亲属称谓，作为按祖先谱系形成的标准支派名称。“子孙”保留这一家系表达，同时在现代汉语中可自然指整体后代，不额外引入特定教派解释。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。地界公式译得简洁自然；保留“产业”“支派”“宗族”等具有历史与法律色彩、且普通读者能够理解的用语。
