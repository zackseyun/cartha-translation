revisions:
- from: 界线从他普亚向西延伸，到加拿河谷[a]，终点在海边。这是以法莲子孙支派按宗族所得的产业。
  to: 界线从他普亚向西延伸，到加拿河[a]，终点在海边。这是以法莲子孙的支派按宗族所得的产业。
  rationale: 将“加拿河谷”修订为“加拿河”，以较准确、通行的方式处理נחל及该地名；末句补足结构助词以改善汉语表达。保留“向西”与“海边”分别反映两个不同的יָמָּה用法，并保留“产业、支派、宗族”的土地分配语域。
