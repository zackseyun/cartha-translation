base_translation:
  language: en
  yaml_path: translation/ot/joshua/016/005.yaml
  text: 'And the territory of the sons of Ephraim by their clans was as follows: the border of their inheritance on the east was Ataroth-addar[a], as far as Upper Beth-horon.'
translation:
  language: zh_hans
  text: 以法莲子孙按宗族所得的地界如下：他们产业的东界从亚他绿·亚达起，直到上伯和仑。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: גְּבוּל
  choice: 疆域／边界
  rationale: 本节两次使用同一希伯来词。第一次概括以法莲各宗族所得的地域范围，译作“疆域”；第二次引出地界所经的地点，译作“边界”，既反映语境差异，也保留原文的地理含义。
- source_word: בְּנֵי אֶפְרַיִם
  choice: 以法莲子孙
  rationale: 保留希伯来语的亲属表达，同时用现代汉语中自然的“子孙”指以法莲支派的后裔。
- source_word: לְמִשְׁפְּחֹתָם
  choice: 按着宗族
  rationale: מִשְׁפָּחָה在支派分地语境中指支派内部的宗族单位；“按着宗族”简洁而准确。
- source_word: נַחֲלָתָם
  choice: 他们的产业
  rationale: 此词在《约书亚记》中常指拈阄分得、可承受的土地；“产业”能保留承受之地的意味，也符合中文圣经地界叙述的庄重语体。
- source_word: מִזְרָחָה
  choice: 东边
  rationale: 此处说明产业边界的东方一侧；“东边的边界”在现代汉语中自然清楚。
- source_word: עַטְרוֹת אַדָּר
  choice: 亚他绿·亚达
  rationale: 作为复合地名按音译处理；中点有助于读者辨认地名的两个组成部分。
- source_word: עַד
  choice: 直到
  rationale: 在地界描述中标明界线延伸的终点。
- source_word: בֵּית חוֹרֹן עֶלְיוֹן
  choice: 上伯和仑
  rationale: עֶלְיוֹן意为“上面的／较高的”，用于区别下伯和仑；“上伯和仑”是清楚简洁的地名形式。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的地界叙述。“疆域”与“边界”分别表达גְּבוּל在概括地域和描述界线时的语境功能；地名采用常见中文音译，并以“上伯和仑”自然区分相应地点。
