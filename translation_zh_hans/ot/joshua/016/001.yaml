  text: וַ/יֵּצֵ֨א הַ/גּוֹרָ֜ל לִ/בְנֵ֤י יוֹסֵף֙ מִ/יַּרְדֵּ֣ן יְרִיח֔וֹ לְ/מֵ֥י יְרִיח֖וֹ מִזְרָ֑חָ/ה הַ/מִּדְבָּ֗ר עֹלֶ֧ה מִ/ירִיח֛וֹ בָּ/הָ֖ר בֵּֽית אֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/016/001.yaml
  text: And the lot came out for the sons of Joseph from the Jordan at Jericho[a], to the waters of Jericho on the east, through the wilderness[b], going up from Jericho into the hill country of Bethel.
translation:
  language: zh_hans
  text: 约瑟子孙抽签所得的地界[a]，从耶利哥附近的约旦河起，到耶利哥东边的水源[b]，穿过旷野，从耶利哥上到伯特利的山区。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“签出来了”；这里指抽签所定的地界。
    reason: lexical_alternative
  - marker: b
    text: “水源”原文为复数或集合形式的“水”，可能特指耶利哥的泉源或供水处。
    reason: cultural_note
lexical_decisions:
- source_word: וַיֵּצֵא הַגּוֹרָל
  choice: 所得的签
  rationale: 直译涉及“签出来了”。在分地语境中，现代汉语用“所得的签”既保留抽签程序，也自然引出所划定的地域；脚注保留更贴近字面的表达。
- source_word: לִבְנֵי יוֹסֵף
  choice: 约瑟子孙
  rationale: 此处指约瑟的后裔和所属支派；“子孙”比字面的“儿子们”更符合现代汉语的群体称谓。
- source_word: מִיַּרְדֵּן יְרִיחוֹ
  choice: 从耶利哥附近的约旦河起
  rationale: 该短语标明边界在耶利哥一带约旦河边的起点；“附近”表达地理关联而不把耶利哥与约旦河混同。
- source_word: לְמֵי יְרִיחוֹ מִזְרָחָה
  choice: 到耶利哥东边的水源
  rationale: מֵי 为集合性“水”，在此很可能指耶利哥的泉水或供水处；正文采用自然的“水源”，脚注说明原文形式及可能所指。
- source_word: הַמִּדְבָּר
  choice: 旷野
  rationale: מדבר 指未耕作的荒野或干旱地带；“旷野”是准确而通行的圣经地理用语。
- source_word: עֹלֶה מִירִיחוֹ
  choice: 从耶利哥上到
  rationale: 分词表达地势由低处向高地上升；“上到”自然保留地形运动。
- source_word: בָּהָר בֵּית אֵל
  choice: 伯特利山区
  rationale: הָר 在此指山地或高地区域，并非单独一座山；“伯特利山区”简洁表达该地理范围。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的边界叙述。“从……起，到……，穿过……”使复杂的希伯来语地理链条在汉语中清楚连贯，同时不消除“耶利哥的水”究竟指一般水源还是特定泉源的含混。
