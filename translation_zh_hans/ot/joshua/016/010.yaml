  text: וְ/לֹ֣א הוֹרִ֔ישׁוּ אֶת הַֽ/כְּנַעֲנִ֖י הַ/יּוֹשֵׁ֣ב בְּ/גָ֑זֶר וַ/יֵּ֨שֶׁב הַֽ/כְּנַעֲנִ֜י בְּ/קֶ֤רֶב אֶפְרַ֨יִם֙ עַד הַ/יּ֣וֹם הַ/זֶּ֔ה וַ/יְהִ֖י לְ/מַס עֹבֵֽד־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/016/010.yaml
  text: But they did not drive out the Canaanites who lived in Gezer, so the Canaanites have lived in the midst of Ephraim to this day and became forced laborers.
translation:
  language: zh_hans
  text: 可是，以法莲人没有赶走住在基色的迦南人；于是，迦南人住在以法莲人中间，直到今日，并成了服苦役的人。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הוֹרִישׁוּ
  choice: 赶走
  rationale: 此处使役词形在征地语境中指把当地居民逐出；“赶走”自然、准确，不额外断定杀灭。
- source_word: בְּקֶרֶב אֶפְרַיִם
  choice: 在以法莲人中间
  rationale: אֶפְרַיִם在此按支派群体理解；补出“人”符合现代汉语，也保留“在……中间”的空间与社群含义。
- source_word: לְמַס עֹבֵד
  choice: 服苦役的人
  rationale: מַס可指徭役或强制服役，עֹבֵד表明实际承担劳役；该译法比单纯“纳贡”更贴近词组含义。
theological_decisions:
- issue: 末句的时态及其与“直到今日”的关系
  choice: 并成了服苦役的人
  alternative: 并一直作服苦役的人
  rationale: 希伯来文וַיְהִי是叙事性过去式；“直到今日”在句法上首先修饰迦南人住在以法莲中间。译为“成了”保留其时态与潜在范围，不擅自断定服苦役持续到叙述者当日。
- issue: 两个分句之间的逻辑关系
  choice: 于是
  alternative: 所以
  rationale: 原文以וַ连接，允许顺承并隐含结果；“于是”表达自然后果，但不过度强化为明确因果论证。
translation_notes:
  register: 采用现代、庄重而通俗的叙事语体。“可是”承接上文形成转折；分号呈现未赶出与继续共居之间的紧密关系。无脚注。
