  text: And the cities set apart for the sons of Ephraim within the inheritance of the sons of Manasseh—all the cities and their villages[a].
translation:
  language: zh_hans
  text: 还有为以法莲子孙分别出来、位于玛拿西子孙产业中的各城邑，以及它们的村庄。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“为以法莲子孙分别出来的城邑。”希伯来文用分词，表示这些城邑是特别为以法莲子孙划分出来的。
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶעָרִים
  choice: 城邑
  rationale: עִיר可指城或镇；“城邑”适合约书亚记的地界清单，庄重而不暗示现代城市规模。
- source_word: הַמִּבְדָּלוֹת
  choice: 分别划给
  rationale: 该词源于בדל，表达分开、区别；结合土地分配语境，“分别划给”自然说明这些城邑虽位于玛拿西产业内，却归以法莲使用，同时保留“分别”的核心语义。
- source_word: לִבְנֵי אֶפְרַיִם
  choice: 给以法莲子孙
  rationale: בני字面为“众子”，在这里是支派称谓；“以法莲子孙”既保留家族血缘表达，也符合现代中文圣经地界叙述。
- source_word: בְּתוֹךְ
  choice: 在……中
  rationale: 准确表达这些城邑处于玛拿西所得地域之内。
- source_word: נַחֲלַת
  choice: 产业
  rationale: נחלה在约书亚记中常指分得并承受的土地；“产业”兼顾土地份额与承受所得的含义。
- source_word: בְּנֵי מְנַשֶּׁה
  choice: 玛拿西子孙
  rationale: 保留原文支派家族公式，并与“以法莲子孙”对应。
- source_word: כָּל הֶעָרִים
  choice: 所有这些城邑
  rationale: כָּל表示全体；中文补出“这些”可使后半句自然地回指前述分别划出的城邑。
- source_word: וְחַצְרֵיהֶן
  choice: 和属城的村庄
  rationale: חָצֵר在地界清单中多指附属于城邑的无城墙村落或小聚落；“属城的村庄”清楚表达其依附关系。
