  text: וְ/נָ֞ס אֶל אַחַ֣ת מֵ/הֶ/עָרִ֣ים הָ/אֵ֗לֶּה וְ/עָמַד֙ פֶּ֚תַח שַׁ֣עַר הָ/עִ֔יר וְ/דִבֶּ֛ר בְּ/אָזְנֵ֛י זִקְנֵ֥י הָ/עִֽיר הַ/הִ֖יא אֶת דְּבָרָ֑י/ו וְ/אָסְפ֨וּ אֹת֤/וֹ הָ/עִ֨ירָ/ה֙ אֲלֵי/הֶ֔ם וְ/נָתְנוּ ל֥/וֹ מָק֖וֹם וְ/יָשַׁ֥ב עִמָּֽ/ם־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/020/004.yaml
  text: He shall flee to one of these cities and stand at the entrance of the city gate[a], and he shall speak his case in the hearing of the elders of that city. Then they shall take him into the city to themselves, and they shall give him a place[b], and he shall live with them.
translation:
  language: zh_hans
  text: 他要逃到这些城中的一座，站在城门口，把自己的案情[a]讲给那城的长老听。他们就要把他接进城，接纳到他们中间[b]；他们要给他一个地方，他就与他们同住。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“自己的话”或“自己的事情”；希伯来语既可指他所说的话，也可指他所陈述的案情。
    reason: lexical_alternative
  - marker: b
    text: 或译“把他收聚到城里，归到他们中间”；希伯来语动词可表示“聚集”、“带入”或“接纳”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָס
  choice: 他要逃到
  rationale: 该形式在本段法规程序的连续叙述中具有将来或指令意味；“要逃到”既符合上下文，也比单纯的过去时自然。
- source_word: אַחַת מֵהֶעָרִים הָאֵלֶּה
  choice: 这些城中的一座
  rationale: 准确表达希伯来语的部分关系，同时符合现代汉语习惯。
- source_word: וְעָמַד פֶּתַח שַׁעַר הָעִיר
  choice: 站在城门入口
  rationale: 保留פֶּתַח“入口”和שַׁעַר“城门”的具体意象，也体现城门作为公开处理城中事务之处的背景。
- source_word: וְדִבֶּר בְּאָזְנֵי
  choice: 讲给……听
  rationale: 这是现代汉语对“在……耳中说”的自然表达，保留正式陈述给长老听的含义。
- source_word: זִקְנֵי הָעִיר הַהִיא
  choice: 那城的长老
  rationale: 保留指示词הַהִיא所表达的特指。
- source_word: אֶת דְּבָרָיו
  choice: 自己的案情
  rationale: דָּבָר可指话语、事情或案件；司法语境下“案情”最为自然，但以脚注保留其词义宽度。
- source_word: וְאָסְפוּ אֹתוֹ הָעִירָה אֲלֵיהֶם
  choice: 接他进城，让他来到他们中间
  rationale: “接……进城”兼顾אָסַף在此处“收聚、带入、接纳”的含义；后半句保留אֲלֵיהֶם的关系性和方向性，而不把它强化为正式归籍。
- source_word: וְנָתְנוּ לוֹ מָקוֹם
  choice: 给他一个地方
  rationale: מָקוֹם泛指地方或处所；直译可避免将其过度限定为房屋、住宿或特定产业。
- source_word: וְיָשַׁב עִמָּם
  choice: 他就住在他们中间
  rationale: יָשַׁב在定居语境中意为居住；“住在他们中间”是自然现代汉语，并保留共同生活的含义。
