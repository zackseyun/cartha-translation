  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: אֵ֣לֶּה הָיוּ֩ עָרֵ֨י הַ/מּֽוּעָדָ֜ה לְ/כֹ֣ל בְּנֵ֣י יִשְׂרָאֵ֗ל וְ/לַ/גֵּר֙ הַ/גָּ֣ר בְּ/תוֹכָ֔/ם לָ/נ֣וּס שָׁ֔מָּ/ה כָּל מַכֵּה נֶ֖פֶשׁ בִּ/שְׁגָגָ֑ה וְ/לֹ֣א יָמ֗וּת בְּ/יַד֙ גֹּאֵ֣ל הַ/דָּ֔ם עַד עָמְד֖/וֹ לִ/פְנֵ֥י הָ/עֵדָֽה׀־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/020/009.yaml
  text: These were the appointed cities for all the sons of Israel and for the sojourner residing among them[c][b][a], so that anyone who struck down a person unintentionally might flee there and not die by the hand of the avenger of blood until he stood before the congregation.
translation:
  language: zh_hans
  text: 这些城是为所有以色列人[a]和寄居在他们中间的外来居民[b]所指定的。凡无意中击杀人的，都可以逃到那里，免得死在报血仇者手中，直到他站在会众[c]面前。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “所有以色列人”也可译作“全体以色列人”；希伯来文直译为“以色列的众子”。
    reason: lexical_alternative
  - marker: b
    text: “外来居民”指住在以色列人中间、受其共同体秩序管辖的非本地居民。
    reason: cultural_note
  - marker: c
    text: “会众”也可译作“集会”或“群体”。
    reason: lexical_alternative
lexical_decisions:
- source_word: עָרֵי הַמּוּעָדָה
  choice: 所指定的城
  rationale: 该短语表示经指定、划定的城；不在此处添加原短语未明说的“逃城”。
- source_word: לְכֹל בְּנֵי יִשְׂרָאֵל
  choice: 为以色列众子民
  rationale: 保留“以色列之子”的民族称谓色彩，同时用现代汉语“众子民”避免生硬的“众子”。
- source_word: וְלַגֵּר הַגָּר בְּתוֹכָם
  choice: 和寄居在他们中间的外来居民
  rationale: גֵּר 指居于以色列群体中的非本地居民；“外来居民”传达其法律身份，“寄居”对应同根分词。
- source_word: לָנוּס שָׁמָּה
  choice: 都可以逃到那里
  rationale: נוּס 是“逃离、逃往”；结合指定这些城的目的，以“可以”自然表达许可和避难功能。
- source_word: כָּל מַכֵּה נֶפֶשׁ
  choice: 凡……击杀人的
  rationale: 保留 נכה 的“击打、击杀”意象；נפש 在此指人命或人。
- source_word: בִּשְׁגָגָה
  choice: 无意中
  rationale: 准确表达法律语境中的非故意行为，而不暗示行为本身无过失。
- source_word: וְלֹא יָמוּת בְּיַד גֹּאֵל הַדָּם
  choice: 免得死在报血仇者手中
  rationale: “报血仇者”表达 גֹּאֵל הַדָּם 作为替遇害亲属追讨血债者的法律文化角色；“死在……手中”保留施事习语。
- source_word: עַד עָמְדוֹ לִפְנֵי הָעֵדָה
  choice: 直到他站在会众面前受审
  rationale: “站在……面前”保留原文法庭性表达；“受审”由本章法律语境明确其含义，使现代读者易懂，但不指定审理结果。
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל 的性别化民族称谓
  choice: 以色列众子民
  alternative: 全体以色列人
  rationale: 原文形式为“以色列的众子”，但在希伯来语中可作整个民族的代表性称谓；正文略保留其形式色彩，脚注提供自然的集合表达。
- issue: גֵּר 的群体与法律身份
  choice: 外来居民
  alternative: 寄居者；外族寄居者
  rationale: 此词所指并非泛泛的陌生人，而是住在以色列社会秩序之内的非本地居民；避免套用现代国籍或移民制度概念。
- issue: גֹּאֵל הַדָּם 的亲属复仇角色
  choice: 报血仇者
  alternative: 报血仇的近亲
  rationale: 正文保留固定法律角色，不将其行为预先评价为私人报复；脚注说明通常由遇害者近亲承担。
- issue: לִפְנֵי הָעֵדָה 的司法含义
  choice: 站在会众面前受审
  alternative: 站在会众面前
  rationale: 上下文表明这是群体审理；添加“受审”是语境明示化，不裁定其有罪或无罪，也不将“会众”缩小为现代法庭。
translation_notes:
  register: 采用现代、庄重而易懂的法律叙述语体。正文保留“指定的城”“报血仇者”“会众”等源文法律文化用语，并借脚注解释；分为两句以符合现代汉语节奏。“受审”明示上下文中的司法功能。
