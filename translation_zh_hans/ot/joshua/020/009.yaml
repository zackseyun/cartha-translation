  to: 这些城是为所有以色列人[a]和寄居在他们中间的外来居民[b]所指定的。凡无意中击杀人的，都可以逃到那里，免得死在报血仇者手中，直到他站在会众[c]面前。
  rationale: 删除原文未明说的“受审”，以保留“站在会众面前”所含而未展开的司法语境。将不自然的“以色列众子民”改为“所有以色列人”，并以脚注保留希伯来文的字面民族称谓。其余法律术语及脚注锚点均予保留。
