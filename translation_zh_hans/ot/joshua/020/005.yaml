base_translation:
  language: en
  yaml_path: translation/ot/joshua/020/005.yaml
  text: And if the avenger of blood pursues him[a], they shall not hand the manslayer over into his hand, because he struck his neighbor without intent and had not hated him before, from yesterday or the day before.
translation:
  language: zh_hans
  text: 如果报血仇者追赶他，城中的人不可把那误杀者交在他手中，因为他是在无意中击打邻人，并且从前[a]没有恨过他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “从前”直译为“从昨天和前天”，是希伯来语习语，意思是“先前”或“以前”。
    reason: 说明原文时间习语，保留其字面意象，并避免“以来”所暗示的持续含义。
lexical_decisions:
- source_word: וְכִי
  choice: 如果
  rationale: 在法律条文中引出可能发生的情形；中文用“如果”自然表达条件关系，无须机械保留句首连接词。
- source_word: גֹּאֵל הַדָּם
  choice: 报血仇的人
  rationale: 该词组指为被杀亲属追讨血债的家族代表。“报血仇的人”既保留制度背景，也比“血的救赎者”更符合现代汉语。
- source_word: וְלֹא יַסְגִּרוּ
  choice: 城里的人不可把……交在……手中
  rationale: 动词表示将某人交出，使其落入另一人的权下；主语依上文语境指收留逃亡者的城中人员。补出“城里的人”使中文指代清楚。
- source_word: הָרֹצֵחַ
  choice: 这误杀人的
  rationale: 该分词可泛指杀人者，但本句明确说明其行为出于无意。译作“误杀人的”保留杀人事实，同时避免误称为蓄意的“凶手”或“谋杀者”。
- source_word: בְּיָדוֹ
  choice: 交在报仇者手中
  rationale: 保留希伯来语“在他手中”的权力意象；为避免连续代词含混，以“报仇者”明确所指。
- source_word: בִּבְלִי דַעַת
  choice: 无意中
  rationale: 字面涉及“没有知识/不知情”，在逃城法律语境中重点是行为并非故意；“无意中”自然且不超出司法含义。
- source_word: הִכָּה אֶת רֵעֵהוּ
  choice: 击打了邻舍
  rationale: 保留 נכה 的基本义“击打”，不把死亡结果重复加入动词本身；“邻舍”准确表达 רֵעַ 的人际含义。
- source_word: וְלֹא שֹׂנֵא הוּא לוֹ מִתְּמוֹל שִׁלְשׁוֹם
  choice: 素来并不恨他
  rationale: 末尾时间短语是希伯来习语，意为此前、向来；“素来”简洁表达不存在先前仇恨，并以脚注保留字面形式。
theological_decisions:
- issue: 逃城语境中 הָרֹצֵחַ 的法律身份
  choice: 译作“这误杀人的”
  alternative: 杀人者／凶手
  rationale: 经文以“无意中”和“素来并不恨他”排除预谋仇杀。此译法不预先赋予谋杀罪名，同时仍明确其造成他人死亡的法律处境。
- issue: בִּבְלִי דַעַת 所表达的责任性质
  choice: 译作“无意中”
  alternative: 在不知情的情况下／无知地
  rationale: 这里的司法重点是缺乏故意，而非一般性的知识欠缺；“无意中”保持这一法律与神学张力，并不进一步断言行为毫无过失。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“报血仇的人”保留古代以亲属追讨血债的法律背景；“误杀人的”适合本段司法语境。脚注标记置于其所解释的句末时间表达之后。
