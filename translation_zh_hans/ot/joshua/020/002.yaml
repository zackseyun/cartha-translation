source:
  edition: WLC
  text: דַּבֵּ֛ר אֶל בְּנֵ֥י יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר תְּנ֤וּ לָ/כֶם֙ אֶת עָרֵ֣י הַ/מִּקְלָ֔ט אֲשֶׁר דִּבַּ֥רְתִּי אֲלֵי/כֶ֖ם בְּ/יַד מֹשֶֽׁה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/020/002.yaml
  text: Speak to the sons of Israel[a], saying, ‘Appoint for yourselves the cities of refuge, about which I spoke to you through Moses,’
translation:
  language: zh_hans
  text: 你要对以色列人说：‘你们要为自己指定避难城，就是我曾借着摩西[a]向你们提到的那些城。’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译“借摩西的手”，是表示“借着摩西”的惯用说法。
    reason: 保留 בְּיַד מֹשֶׁה 的字面形式，说明主文采用的是其惯用含义。
lexical_decisions:
- source_word: דַּבֵּר
  choice: 你要对……说
  rationale: 这是对约书亚的皮耶勒命令式；用“你要……说”保留直接命令的语气，并符合现代汉语表达。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 字面为“以色列的众子”，在这里是对以色列民的惯用称呼；“以色列人”自然、准确，也避免生硬且可能引起误解的逐字翻译。
- source_word: לֵאמֹר
  choice: 说
  rationale: 这是引出直接引语的惯用形式；汉语用“说”简明地呈现其引语功能。
- source_word: תְּנוּ לָכֶם
  choice: 为自己指定
  rationale: נתן 字面义为“给”，但在此行政和法律语境中指把若干城指定作特定用途；“指定”准确表达这一功能。
- source_word: עָרֵי הַמִּקְלָט
  choice: 避难城
  rationale: מִקְלָט 指供人逃往并获得保护的地方；“避难城”既贴近原义，也比偏古旧的术语更便于现代普通读者理解。
- source_word: אֲשֶׁר דִּבַּרְתִּי אֲלֵיכֶם
  choice: 就是我曾……向你们提到的那些城
  rationale: 原文关系从句修饰“城”，意思是上帝先前曾向他们说到这些城；“提到”使汉语搭配自然，又不增添原文没有的具体命令内容。
- source_word: בְּיַד מֹשֶׁה
  choice: 借着摩西
  rationale: 字面为“借摩西的手”，是表示中介或代理的希伯来语惯用语；“借着摩西”自然地保留摩西作为传达者的角色。
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל 的群体称谓与性别形式
  choice: 以色列人
  alternative: 以色列的众子
  rationale: 该短语在此惯常指整个盟约群体，而不是只强调男性成员。现代汉语“以色列人”保留民族群体所指；逐字译作“以色列的众子”不自然，并可能错误缩窄范围。
- issue: בְּיַד מֹשֶׁה 所表达的启示中介关系
  choice: 借着摩西
  alternative: 借摩西的手
  rationale: 原文强调上帝先前的话是经由摩西传达的。“借着摩西”保留这种中介关系，同时避免把惯用语误解为实际的手部动作。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“避难城”直接传达该法律设施的用途；句式保留上帝对约书亚的命令及随后的直接引语。脚注标记置于“摩西”之后，与其所解释的希伯来语短语准确对应。
