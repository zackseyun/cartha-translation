base_translation:
  language: en
  yaml_path: translation/ot/joshua/020/001.yaml
  text: Then Yahweh spoke to Joshua[a], saying,
translation:
  language: zh_hans
  text: 于是，耶和华对约书亚说：
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: 于是……说
  rationale: וַ־接续叙事并推动情节；“于是”自然表达承接和先后关系。דבר在此指向某人发言，汉语用“对……说”最自然。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代简体中文圣经传统中对四字神名的通行音译“耶和华”，把它作为专名呈现，而不以称号替代。
- source_word: אֶל
  choice: 对
  rationale: 与“说”搭配，准确表达发言所指向的对象。
- source_word: יְהוֹשֻׁעַ
  choice: 约书亚
  rationale: 采用该人名在现代中文圣经中的通行译名。
- source_word: לֵאמֹר
  choice: 说：
  rationale: 该不定式是引出下文直接引语的惯用公式；中文以“说：”简洁自然地保留其话语引介功能。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。中文正文采用历史悠久且普通读者熟悉的专名译法“耶和华”，不改译为“主”；“雅威”是更接近学界常见拟音的可行替代。
translation_notes:
  register: 采用简洁、庄重的现代标准汉语。以“于是”体现希伯来叙事形式的承接推进；句末冒号表明下一节将承接神的直接话语。
