base_translation:
  language: en
  yaml_path: translation/ot/joshua/020/007.yaml
  text: So they set apart Kedesh in Galilee in the hill country of Naphtali[a], and Shechem in the hill country of Ephraim, and Kiriath-arba (that is, Hebron) in the hill country of Judah.
translation:
  language: zh_hans
  text: 他们就在拿弗他利山区的加利利，分别划定基低斯；又在以法莲山区，划定示剑；又在犹大山区，划定基列·亚巴（即希伯仑）[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译作“基列·亚巴，它是希伯仑”；这说明基列·亚巴是希伯仑的另一个名称。
    reason: 说明原文以“它是希伯仑”所作的地名同一关系，并保留直译信息。
lexical_decisions:
- source_word: וַיַּקְדִּשׁוּ
  choice: 分别划定出来
  rationale: קדשׁ在本段设立逃城的法律与行政语境中，表示为特定用途正式分别、指定；“划定出来”自然清楚，也避免让人误以为这里主要指礼仪上的圣化。
- source_word: קֶדֶשׁ
  choice: 基低斯
  rationale: 采用现代中文圣经读者熟悉的地名音译。
- source_word: בַּגָּלִיל
  choice: 加利利的
  rationale: גָּלִיל是地区名；与后面的“基低斯”连用，表达该城位于加利利。
- source_word: בְּהַר נַפְתָּלִי
  choice: 拿弗他利山区
  rationale: 这里的הַר指与拿弗他利相关的山地或高地区域，并非一座名为“拿弗他利山”的单独山峰。
- source_word: שְׁכֶם
  choice: 示剑
  rationale: 采用通行的中文地名译法。
- source_word: בְּהַר אֶפְרָיִם
  choice: 以法莲山区
  rationale: הַר在此指以法莲境内的山地区域。
- source_word: קִרְיַת אַרְבַּע
  choice: 基列·亚巴
  rationale: 作为固定地名音译，并用间隔号清楚区分名称的两个部分。
- source_word: הִיא חֶבְרוֹן
  choice: （就是希伯仑）
  rationale: 保留希伯来文以代词加地名所作的同一名称说明，并以括注形式自然表达。
- source_word: בְּהַר יְהוּדָה
  choice: 犹大山区
  rationale: 该短语指犹大境内的山地，而不是一座单独的山。
