  text: לָ/נ֥וּס שָׁ֨מָּ/ה֙ רוֹצֵ֔חַ מַכֵּה נֶ֥פֶשׁ בִּ/שְׁגָגָ֖ה בִּ/בְלִי דָ֑עַת וְ/הָי֤וּ לָ/כֶם֙ לְ/מִקְלָ֔ט מִ/גֹּאֵ֖ל הַ/דָּֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/020/003.yaml
  text: so that a manslayer who strikes down a person unintentionally[a], without knowledge, may flee there[b], and they shall be for you a refuge from the avenger of blood.
translation:
  language: zh_hans
  text: 让那无意中、在不知情的情况下致人死亡者[a]可以逃到那里；这些城要作为你们躲避报血仇者[b]的避难所。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “致人死亡者”也可译作“杀人者”。这里的希伯来词受“无意中”和“在不知情的情况下”限定，因此本节所指的不是蓄意谋杀的人。
    reason: lexical_alternative
  - marker: b
    text: “报血仇者”指以色列亲族法律制度中为死者追讨血债的人，通常是死者的近亲。
    reason: cultural_note
lexical_decisions:
- source_word: לָנוּס שָׁמָּה
  choice: 可以逃到那里
  rationale: לָנוּס带ל的不定式在上文命令之后表达目的；“可以逃到那里”在现代汉语中自然地表明设城的用途。
- source_word: רוֹצֵחַ
  choice: 杀了人的人
  rationale: 该词本可指杀人者，但本节随后的修饰语明确说明是无意、非蓄意致死；此译法避免用“凶手”或“谋杀犯”而错误引入故意杀人的含义。
- source_word: מַכֵּה נֶפֶשׁ
  choice: 杀了人
  rationale: 字面为“击打一个人/性命”，在此法律语境中指造成死亡；汉语“杀了人”清楚表达致死结果，同时不自行断定主观恶意。
- source_word: בִּשְׁגָגָה בִּבְלִי דָעַת
  choice: 无意中、在不知情的情况下
  rationale: 保留两个并列限定：前者强调非故意或因失误，后者强调没有认识或知情；不将二者合并成一个含混的“意外”。
- source_word: וְהָיוּ לָכֶם לְמִקְלָט
  choice: 这些城要作你们的避难所
  rationale: 复数动词回指前文所指定的城；补出“这些城”使汉语指代清楚，“避难所”准确表达מִקְלָט在逃城制度中的功能。
- source_word: מִגֹּאֵל הַדָּם
  choice: 躲避报血仇的人
  rationale: גֹּאֵל הַדָּם是以色列亲族法律体系中为死者追讨血债的人；“报血仇的人”较“报仇者”更保留原文的血债语义，具体文化身份置于脚注说明。
theological_decisions:
- issue: 杀人者的法律与道德性质
  choice: 译为“无意中、在不知情的情况下杀了人的人”，不称为“谋杀犯”
  alternative: 可较笼统地译作“杀人者”
  rationale: בִּשְׁגָגָה和בִּבְלִי דָעַת共同界定此人为非故意致人死亡者；译文应保留这种法律区分，不加入原文没有的预谋或恶意。
- issue: גֹּאֵל הַדָּם的角色
  choice: 正文译为“报血仇的人”，脚注说明其亲族法律背景
  alternative: 可译为“报血仇的亲属”
  rationale: 该角色通常由亲族承担，但“亲属”并未在本短语表层明说；正文不宜把文化背景直接写成明示成分，脚注则可帮助现代读者理解。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。正文以“杀了人的人”避免“误杀者”可能过早压缩两个希伯来限定语，也避免“凶手”暗示恶意；分号呈现目的从句与避难功能之间的结构关系。所有脚注标记均已置于正文相应位置。
