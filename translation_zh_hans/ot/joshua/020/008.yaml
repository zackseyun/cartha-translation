base_translation:
  language: en
  yaml_path: translation/ot/joshua/020/008.yaml
  text: And beyond the Jordan east of Jericho[a], they designated Bezer in the wilderness on the plateau from the tribe of Reuben, and Ramoth in Gilead from the tribe of Gad, and Golan in Bashan from the tribe of Manasseh.
translation:
  language: zh_hans
  text: 在约旦河对岸、耶利哥以东，他们指定了吕便支派境内旷野高原上的比悉、迦得支派境内基列的拉末[a]，以及玛拿西支派境内巴珊的哥兰。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 传统译名常作“基列·拉末”；希伯来文为“拉末在基列”。
    reason: 说明传统复合地名与原文“城名＋地点”结构之间的差异。
lexical_decisions:
- source_word: וּמֵעֵבֶר לְיַרְדֵּן יְרִיחוֹ מִזְרָחָה
  choice: 在约旦河对岸、耶利哥以东
  rationale: 将整组方位语作为一个地理框架处理；“对岸”保留相对于迦南主体地区的视角，“耶利哥以东”自然表达 מִזְרָחָה 的方向意义。
- source_word: נָתְנוּ
  choice: 指定了
  rationale: 本章语境是正式选定逃城，因此采用“指定”，比字面的“给了”更准确地传达这里的行政性行动。
- source_word: בֶּצֶר
  choice: 比悉
  rationale: 采用现代中文圣经中较通行的地名音译。
- source_word: בַּמִּדְבָּר בַּמִּישֹׁר
  choice: 旷野高原上的
  rationale: מִדְבָּר 指未开垦的旷野或荒原；מִישׁוֹר 在此指约旦河东的平坦高地，译作“高原”可避免“平原”可能造成的地形误解。
- source_word: מִמַּטֵּה רְאוּבֵן
  choice: 吕便支派境内
  rationale: 这里说明城所在的支派产业；“境内”在中文中比直译“从吕便支派”更清楚自然。
- source_word: רָאמֹת בַּגִּלְעָד
  choice: 基列的拉末
  rationale: 依照希伯来文的“城名＋地区”结构翻译，不把两者直接合成一个复合地名。
- source_word: מִמַּטֵּה גָד
  choice: 迦得支派境内
  rationale: 与前后相同的支派产业表达保持一致。
- source_word: גלון בַּבָּשָׁן
  choice: 巴珊的哥兰
  rationale: 按辅音文本所指的通行地名“哥兰”处理，并保留“在巴珊”这一地区定位。
- source_word: מִמַּטֵּה מְנַשֶּׁה
  choice: 玛拿西支派境内
  rationale: 清楚表达该城属于玛拿西支派所得之地。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。三个城名以并列结构呈现，并用“支派境内”明确各城所属产业；保留原文的地理层次，不加入教派性解释。
