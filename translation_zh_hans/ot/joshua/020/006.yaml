source:
  edition: WLC
  text: וְ/יָשַׁ֣ב בָּ/עִ֣יר הַ/הִ֗יא עַד עָמְד֞/וֹ לִ/פְנֵ֤י הָֽ/עֵדָה֙ לַ/מִּשְׁפָּ֔ט עַד מוֹת֙ הַ/כֹּהֵ֣ן הַ/גָּד֔וֹל אֲשֶׁ֥ר יִהְיֶ֖ה בַּ/יָּמִ֣ים הָ/הֵ֑ם אָ֣ז יָשׁ֣וּב הָ/רוֹצֵ֗חַ וּ/בָ֤א אֶל עִיר/וֹ֙ וְ/אֶל בֵּית֔/וֹ אֶל הָ/עִ֖יר אֲשֶׁר נָ֥ס מִ/שָּֽׁם׀־־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/020/006.yaml
  text: And he shall live in that city until he stands before the congregation for judgment[a], until the death of the high priest who is in office in those days. Then the manslayer may return and come to his city and to his house[b], to the city from which he fled.
translation:
  language: zh_hans
  text: 他要住在那座城里，直到他站在会众面前受审[a]；他要一直住到当时在任的大祭司去世。随后，那杀人者[b]就可以回到自己的城和自己的家，就是他从那里逃出来的那座城。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “会众”也可译作“集会”；原文指聚集起来执行司法审断的共同体。
    reason: lexical_alternative
  - marker: b
    text: “杀人者”也可译作“致人死亡者”或“凶手”。在逃城法规的语境中，此词不应预先译为已被定罪的“谋杀犯”；本节仍提到其须受审。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָשַׁב בָּעִיר הַהִיא
  choice: 他要住在那城里
  rationale: ישׁב在此指持续居住；“住在”自然表达他必须留在逃城中的法律要求。
- source_word: עַד עָמְדוֹ לִפְנֵי הָעֵדָה לַמִּשְׁפָּט
  choice: 直到站在会众面前受审
  rationale: עמד לפני表示到权威面前；למשפט在此是接受司法审断。“受审”以现代汉语简明保留法律语境。
- source_word: הָעֵדָה
  choice: 会众
  rationale: 该词指聚集并承担审判职能的共同体；“会众”保留其群体性，脚注说明“大会”这一可能译法。
- source_word: עַד מוֹת הַכֹּהֵן הַגָּדוֹל אֲשֶׁר יִהְיֶה בַּיָּמִים הָהֵם
  choice: 又要住到当时在任的大祭司去世
  rationale: 原文第二个עַד与前一条件并列延续居住期限；“当时在任”自然说明所指的是那一时期任职的大祭司。补出“又要住”使汉语条件关系清楚。
- source_word: אָז יָשׁוּב
  choice: 此后……可以回到
  rationale: 在律法语境中，大祭司去世后产生获准返回的法律效果；“可以”表达许可，同时不把返回说成必然发生。
- source_word: הָרֹצֵחַ
  choice: 那误杀人的
  rationale: רצח本身可泛指杀人者，但本章逃城法规所处理的是非故意杀人者；“误杀人的”避免误译为已被定罪的谋杀犯，并符合现代汉语法律语感。
- source_word: אֶל עִירוֹ וְאֶל בֵּיתוֹ
  choice: 回到自己的城、自己的家
  rationale: 保留原文城市与家宅的双重归返；中文用顿号连接更自然。
- source_word: אֶל הָעִיר אֲשֶׁר נָס מִשָּׁם
  choice: 也就是他先前逃离的那城
  rationale: 末句复指其原来的城；“也就是”清楚呈现同位说明，“先前”传达逃离先于返回。
theological_decisions:
- issue: 逃城法规中הָרֹצֵחַ的法律身份
  choice: 译作“那误杀人的”
  alternative: “杀人者”或“凶手”
  rationale: 本章上下文明确处理无意致人死亡者。“凶手”容易暗示恶意和罪责已定；“杀人者”较宽泛，却在现代汉语中仍可能造成歧义。“误杀人的”保留逃城制度中的法律区别。
- issue: 大祭司死后返回的语气
  choice: 译作“可以回到”
  alternative: “必回到”或“将回到”
  rationale: 经文在法律安排中说明限制解除后的获准返回，不必表示此人事实上必定返回；“可以”最贴近许可意义。
- issue: 两个עַד所表达的期限关系
  choice: 同时保留受审与大祭司去世两个界限，并以“又要住到”连接
  alternative: 把第二个עַד理解为单纯从属于审判程序
  rationale: 希伯来文连续列出两个עַד短语。译文不消除其句法张力，而将两项均作为居住期限相关条件呈现。
translation_notes:
  register: 采用现代、庄重而易懂的法律叙事语体。“受审”“在任”“可以回到”清楚表达司法程序与许可关系；避免古奥的“居住”“归回”以及带有预断罪责意味的“凶手”。
