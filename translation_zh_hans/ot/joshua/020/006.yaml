  naturalness: 原译整体流畅、庄重。“也就是他先前逃离的那城”可理解，但“他从那里逃出来的那座城”更直接对应 מִשָּׁם（从那里），且避免“逃离某城”在现代汉语中可能产生的轻微歧义。将两个期限分为两句，法律关系更清晰自然。
  terminology: 保留“大祭司”“会众”“受审”等合宜的经文法律语体用语。将“误杀人的”改为“杀人者”，并增设词义脚注，既避免预断案件性质，也说明逃城法规中的特定法律语境。
