revisions:
- from: 他要住在那城里，直到站在会众面前受审[a]，又要住到当时在任的大祭司去世。此后，那误杀人的可以回到自己的城、自己的家，也就是他先前逃离的那城。
  to: 他要住在那座城里，直到他站在会众面前受审[a]；他要一直住到当时在任的大祭司去世。随后，那杀人者[b]就可以回到自己的城和自己的家，就是他从那里逃出来的那座城。
  rationale: 修订仅收窄译文加入的解释性成分：以“杀人者”对应原文较宽泛的法律称谓，并用脚注交代逃城语境，保留其在审判前的法律身份未定性。同步补足该术语的脚注锚点。其余调整使两项期限及“从那里”在现代汉语中更清楚地表达，未改变经文的法律意义。
  reviewer_model: gpt-5.6-terra
