  text: For the sons of Naphtali[a], the sixth lot came out, for the sons of Naphtali according to their clans.
translation:
  language: zh_hans
  text: 为拿弗他利的子孙抽出的，是第六阄[a]；这阄按他们的宗族归给拿弗他利的子孙。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“第六阄落下”；希伯来文动词直译为“出来”或“出去”，这里指拈阄所得的结果。
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי נַפְתָּלִי
  choice: 归拿弗他利的子孙
  rationale: 介词לְ在分地语境中标明拈阄所得土地的承受者；“子孙”既保留支派源于先祖的表达，也比现代汉语“儿子们”更准确。
- source_word: יָצָא
  choice: 抽出来
  rationale: 该动词本义为“出来”；结合拈阄语境译为“抽出来”，在现代汉语中自然，并保留原文关于签之结果出现的意象。
- source_word: הַגּוֹרָל
  choice: 签
  rationale: 此处指为分配地业而抽取的阄；“签”符合现代汉语“抽签”的惯用说法。
- source_word: הַשִּׁשִּׁי
  choice: 第六
  rationale: 序数词修饰“签”，直译为“第六”。
- source_word: לְמִשְׁפְּחֹתָם
  choice: 按宗族
  rationale: מִשְׁפָּחוֹת指支派内部的亲族群体；“宗族”比容易让人想到核心家庭的“家庭”更符合分地语境。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。原文首尾两次提到“拿弗他利的子孙”，正文保留这一重复，以反映希伯来文的结构和强调；用“抽出来”连接“签”，使原文“出来”的表达在汉语中清楚自然。
