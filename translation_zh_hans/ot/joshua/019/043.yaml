  rationale: 城邑名，采用中文圣经中通行且可辨识的音译。
- source_word: וְ
  choice: 、／和
  rationale: 希伯来文在各项前重复连接词；现代汉语列举中以顿号连接前项，并在末项前用“和”，自然地表达其并列关系而不机械重复。
