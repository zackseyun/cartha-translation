  text: and the waters of Jarkon and Rakkon[b][a], with the territory opposite Joppa.
translation:
  language: zh_hans
  text: 雅昆水域[a]和拉昆，以及约帕对面的疆域[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “雅昆水域”也可理解为地名“米雅昆”。
    reason: lexical_alternative
  - marker: b
    text: “疆域”或译“边界”或“界线”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמֵי הַיַּרְקוֹן
  choice: 雅昆水域
  rationale: מֵי 是 מַיִם（“水”）的复数构造形，直译为“雅昆的水”。“水域”在现代汉语中自然，并避免无充分依据地限定为河流；同时以脚注保留将整词组视为地名的可能。
- source_word: וְהָרַקּוֹן
  choice: 和拉昆
  rationale: 按专名音译；希伯来语中的冠词不必生硬译入汉语地名。
- source_word: עִם הַגְּבוּל
  choice: 以及……疆域
  rationale: עִם 基本义为“与、连同”；在地业清单中用“以及”衔接较自然。גְּבוּל 可指边界、界线或疆域，此处选“疆域”，但在脚注中保留“边界”的可能。
- source_word: מוּל יָפוֹ
  choice: 约帕对面的
  rationale: מוּל 表示空间上的相对位置，即“对面、面对”；约帕采用现代中文圣经中通行的译名。
