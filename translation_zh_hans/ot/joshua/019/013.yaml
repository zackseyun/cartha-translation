base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/013.yaml
  text: From there it passed eastward[a], toward the sunrise, to Gath-hepher, to Eth-kazin, and went out to Rimmon[c][b], which extends to Neah.
translation:
  language: zh_hans
  text: 从那里，边界向东、朝日出的方向[a]，延至迦特希弗，至以特加汛[b]；又伸至临门[c]，延到尼亚。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“从那里，边界转向东方”。希伯来文连用两个方向词，直译为“向东，朝日出之地”，可能是为了加强语气。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文作“以特加汛”；这个地名也可按另一种读法译作“伊他加汛”。
    reason: alternative_reading
  - marker: c
    text: 本句末尾的希伯来文很难确定，近似直译为“临门，那被标明的（或：转向的），尼亚”，或作类似理解。许多人认为这是说疆界从临门延伸到尼亚。
    reason: alternative_reading
lexical_decisions:
- source_word: וּמִשָּׁם
  choice: 从那里
  rationale: 承接前面的疆界走向；中文无需另译句首连接词，也能自然表达希伯来文“并从那里”的连续关系。
- source_word: עָבַר
  choice: 边界……经过
  rationale: 在划界语境中，动词指疆界线经过各地点；明说“边界”可补足希伯来文语境中隐含的主语，使中文清楚自然。
- source_word: קֵדְמָה מִזְרָחָה
  choice: 向东，朝日出的方向
  rationale: 原文连用两个表示东方的方向词；译文保留两层表达，以体现强调，而不简单合并为“向东”。
- source_word: גִּתָּה חֵפֶר
  choice: 迦特希弗
  rationale: 作为复合地名音译，并采用现代中文圣经读者较易辨认的形式。
- source_word: עִתָּה קָצִין
  choice: 以特加汛
  rationale: 按马所拉文本的分词方式将其视为一个地名；其读法并不完全确定，故另加脚注。
- source_word: וְיָצָא
  choice: 再伸到
  rationale: 在疆界描述中，该动词表示界线向外伸展并到达下一地点；“伸到”既保留空间意象，也符合现代中文表达。
- source_word: רִמּוֹן
  choice: 临门
  rationale: 按通行的中文圣经地名形式音译。
- source_word: הַמְּתֹאָר הַנֵּעָה
  choice: 并延至尼亚
  rationale: 此处希伯来文结构艰深；正文采用符合划界语境的可能含义，同时用脚注保留字面形式及解释上的不确定性。
