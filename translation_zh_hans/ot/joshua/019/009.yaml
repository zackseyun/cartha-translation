base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/009.yaml
  text: From the portion of the sons of Judah came the inheritance of the sons of Simeon[a], because the share of the sons of Judah was too large for them[c][b]; so the sons of Simeon received their inheritance within Judah's inheritance.
translation:
  language: zh_hans
  text: 西缅子孙的产业出自犹大子孙的地业[a]；因为犹大子孙所得的份额对他们来说太大，所以西缅子孙在犹大的产业之中得了产业[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “地业”或译“地段”“地区”。这里的希伯来词可指量定、划分的一片土地。
    reason: lexical_alternative
  - marker: b
    text: 原文末句直译为“在他们的产业之中”；按上下文，“他们”指犹大子孙。
    reason: referent_clarification
lexical_decisions:
- source_word: מֵחֶבֶל
  choice: 从……的地业中划出来
  rationale: חֶבֶל在分地语境中指划定的一片土地；译作“地业”可自然衔接本节的产业语境，而“划出来”明确表达介词מִן所表示的来源关系。
- source_word: נַחֲלַת
  choice: 所得的产业
  rationale: נַחֲלָה在《约书亚记》的分地叙事中指承受所得的土地。“产业”保留承受之地的含义，“所得的”使现代汉语表达清楚。
- source_word: בְּנֵי יְהוּדָה / בְּנֵי שִׁמְעוֹן
  choice: 犹大子孙／西缅子孙
  rationale: 保留希伯来文按先祖之名指称支派成员的形式；这也是中文圣经语体中清楚而自然的表达。
- source_word: כִּי
  choice: 因为
  rationale: 此处引出西缅产业取自犹大地业的原因，采用明确的因果连词。
- source_word: חֵלֶק
  choice: 所得的份
  rationale: חֵלֶק指分配给犹大人的份额。与前后的“产业、地业”略作词汇区分，同时保留分地含义。
- source_word: רַב מֵהֶם
  choice: 太大
  rationale: 该比较结构在上下文中表示犹大所得之份超过其所需或所宜；“太大”简洁表达这种过量含义。
- source_word: וַיִּנְחֲלוּ
  choice: 得了自己的产业
  rationale: נחל在此指取得所分配的承受之地；“得了自己的产业”符合现代汉语，并保留土地承受的语义。
- source_word: בְּתוֹךְ נַחֲלָתָם
  choice: 在犹大的产业之中
  rationale: בְּתוֹךְ表示位于内部。虽然后缀字面为“他们的”，其语境所指是犹大子孙；正文明确为“犹大”以免中文读者误以为指西缅。
theological_decisions: []
