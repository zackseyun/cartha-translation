  register: 采用庄重而通顺的现代标准汉语。“犹大子孙”和“西缅子孙”保留原文的支派称谓；用“从……中划出来”呈现西缅所得土地来自犹大份额的空间与分配关系。所有脚注标记均已置于正文。
