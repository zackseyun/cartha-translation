  to: 西缅子孙的产业出自犹大子孙的地业[a]；因为犹大子孙所得的份额对他们来说太大，所以西缅子孙在犹大的产业之中得了产业[b]。
  rationale: 将“划出来”改为“出自”，避免将来源关系扩展为原文未明说的具体动作；补出“对他们来说”以体现比较结构；删去“自己的”，使表达更贴近动词“承受／得产业”的语义。末句仍明确“犹大”，并保留脚注说明原文代词的所指。
