base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/049.yaml
  text: When they finished apportioning the land by its territories[b][a], the sons of Israel gave an inheritance to Joshua son of Nun among them.
translation:
  language: zh_hans
  text: 他们把那地按各疆界[a]分配完毕以后，以色列人[b]就在他们中间，把一份产业给了嫩的儿子约书亚。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“按各区域”。希伯来语既可强调边界线，也可指由边界划定的地域。
    reason: lexical_alternative
  - marker: b
    text: 希伯来语直译“以色列的子孙”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְכַלּוּ לִנְחֹל
  choice: 把那地分为产业以后
  rationale: וַיְכַלּוּ 表示前一行动完成，לִנְחֹל 在本段分地语境中指把土地分配为承受的产业；此译既表达完成后的时间关系，也保留“产业”的核心含义。
- source_word: הָאָרֶץ
  choice: 那地
  rationale: 所指是上下文中正在分配的迦南地；“那地”自然承接前文，并避免理解为普世的大地。
- source_word: לִגְבוּלֹתֶיהָ
  choice: 按各处的疆界
  rationale: גְּבוּל 可指边界，也可指边界所划定的区域。“疆界”适合分地语境，而“各处”体现复数形式；脚注保留“区域”的可能含义。
- source_word: בְנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 这是希伯来叙事中对以色列民族的惯常称呼。现代汉语用“以色列人”清楚自然；脚注说明其字面形式。
- source_word: נַחֲלָה
  choice: 一份产业
  rationale: נַחֲלָה 是本书土地分配叙事中的重要法律与神学用语，指所分得、承受的土地份额；“产业”比单纯的“土地”或“财产”更能保留这一内涵。
- source_word: לִיהוֹשֻׁעַ בִּן נוּן
  choice: 给嫩的儿子约书亚
  rationale: 采用现代中文圣经人名的通行译法，并清楚表达父子关系。
- source_word: בְּתוֹכָם
  choice: 在他们中间
  rationale: 直译其空间和群体关系，表明约书亚所得的产业是在以色列人的分地之中，而非在其外。
theological_decisions:
- issue: נַחֲלָה 在分地语境中的含义
  choice: 产业
  alternative: 地业；分得的土地
  rationale: “产业”保留土地作为分配所得之份的法律与圣约语感，同时不额外解释其取得方式。
- issue: בְנֵי יִשְׂרָאֵל 的表达
  choice: 以色列人
  alternative: 以色列的子孙
  rationale: 该短语在此是全民族称谓，并非专门强调男性后裔；正文采用自然、准确的现代汉语，脚注保留希伯来语的字面表达。
- issue: לִגְבוּלֹתֶיהָ 所强调的是边界还是区域
  choice: 按各处的疆界
  alternative: 按各区域
  rationale: 正文保留边界线的具体意象，脚注说明也可侧重由边界划出的区域，不把原文的词义张力单一化。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。“把那地分为产业以后”清楚呈现叙事顺序；“疆界”“产业”保留本段分地叙事的关键用语，同时借脚注说明原文中的真实词义幅度。
