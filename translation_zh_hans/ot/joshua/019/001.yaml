base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/001.yaml
  text: The second lot came out for Simeon[a], for the tribe of the sons of Simeon according to their clans[b], and their inheritance was within the inheritance of the sons of Judah.
translation:
  language: zh_hans
  text: 第二签抽出，归给西缅[a]，归给西缅子孙[b]的支派，按着他们的宗族；他们的产业在犹大子孙的产业之中。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“第二签落在西缅。”原文动词直译为“出来”，这里指抽签所得的结果。
    reason: lexical_alternative
  - marker: b
    text: “西缅子孙”和“犹大子孙”是希伯来文的支派称谓，指这些先祖的后裔或所属支派的成员。
    reason: cultural_note
lexical_decisions:
- source_word: וַיֵּצֵא הַגּוֹרָל הַשֵּׁנִי
  choice: 第二签……抽出
  rationale: יצא本义为“出去、出来”；在抽签分地的语境中，“签抽出”既保留希伯来文的意象，也符合现代汉语表达。
- source_word: לְשִׁמְעוֹן
  choice: 为西缅
  rationale: 介词לְ表示抽签结果所归属的对象；“为西缅”简洁地表达受领关系。
- source_word: לְמַטֵּה בְנֵי שִׁמְעוֹן
  choice: 为西缅子孙的支派
  rationale: מַטֶּה在分地语境中指“支派”；בְנֵי שִׁמְעוֹן直译为“西缅子孙”，保留其宗族称谓。
- source_word: לְמִשְׁפְּחוֹתָם
  choice: 按着他们的宗族
  rationale: מִשְׁפָּחוֹתָם指支派内部的宗族单位，并非现代意义上的核心家庭。
- source_word: נַחֲלָתָם
  choice: 他们所得的产业
  rationale: נַחֲלָה指承受所得的土地。“所得的产业”在现代中文中清楚表达分配所得，同时保留继承产业的含义。
- source_word: בְּתוֹךְ נַחֲלַת בְּנֵי יְהוּדָה
  choice: 位于犹大子孙的产业之中
  rationale: בְּתוֹךְ表示处在某范围内部；重复使用“产业”，对应原文两次出现的נַחֲלָה。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“第二签……抽出”保留原文抽签时“出来”的形象；“宗族”准确体现古代以色列支派内部的社会单位；“产业”维持约书亚记分地叙事中נַחֲלָה的法律及承受含义。所有脚注标记均已置于正文。
