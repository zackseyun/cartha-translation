  text: And their border was Jezreel[a], Chesulloth[b], and Shunem.
translation:
  language: zh_hans
  text: 他们的边界延伸到耶斯列[a]、基苏律和书念。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “耶斯列”在希伯来文中带有表示方向的词尾，也可译作“朝耶斯列方向”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: 延伸到
  rationale: 该形式承接上文并引出边界说明。与“边界”搭配时，用“延伸到”比逐字译作“是”更符合现代汉语，同时保留边界走向的含义。
- source_word: גְּבוּלָם
  choice: 他们的边界
  rationale: גְּבוּל在分地语境中指疆域的界线；后缀表示“他们的”。“边界”准确、自然，也不把它扩大解释为整个领土。
- source_word: יִזְרְעֶאלָה
  choice: 到耶斯列
  rationale: 地名后的方向词尾־ָה表示朝向或到达某处。“到耶斯列”在正文中简洁体现这一语法特征；脚注保留“朝耶斯列方向”的可能表达。
- source_word: הַכְּסוּלֹת
  choice: 基苏律
  rationale: 这是地名。采用现代中文圣经地名中通行且易辨认的音译；前置冠词不另行译出，因为它已成为地名形式的一部分。
- source_word: שׁוּנֵם
  choice: 书念
  rationale: 这是地名，采用现代中文圣经中通行的音译。
