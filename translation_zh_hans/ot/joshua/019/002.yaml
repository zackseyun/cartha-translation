  text: And they had in their inheritance Beer-sheba[a], Sheba, and Moladah.
translation:
  language: zh_hans
  text: 他们所得的产业中有别是巴[a]、示巴和摩拉大。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文作“别是巴和示巴”。有人认为这里其实只指一个地名“别是巴”，而“和示巴”是文本或文体上的不规则现象，并非另一座城。
    reason: textual_variant
lexical_decisions:
- source_word: וַיְהִי לָהֶם
  choice: 他们……有
  rationale: 该结构在分地名单中表达归属或分配；现代汉语用“他们……有”自然传达“归他们所有”，避免生硬直译为“对他们而言是”。
- source_word: בְּנַחֲלָתָם
  choice: 所得的产业中
  rationale: נַחֲלָה 在此指支派分得并持有的土地产业；“所得的产业中”既保留范围意义，也明确这是分配所得。
- source_word: בְּאֵר שֶׁבַע
  choice: 别是巴
  rationale: 按希伯来语地名音译，并采用现代中文圣经读者较熟悉的译名。
- source_word: וְשֶׁבַע
  choice: 示巴
  rationale: 马所拉文本字面列出“和示巴”，故在正文中保留为另一个城名；与“别是巴”连读所产生的文本或文体疑难在脚注说明。
- source_word: וּמוֹלָדָה
  choice: 和摩拉大
  rationale: 地名按希伯来语音译，并保留名单末项前的连接词。
theological_decisions: []
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语，保持城邑名单的紧凑形式。正文依马所拉文本列出三个地名，同时以脚注保留“别是巴和示巴”可能只指一处的真实歧义。
