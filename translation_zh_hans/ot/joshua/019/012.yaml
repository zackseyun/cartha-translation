base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/012.yaml
  text: Then it turned back from Sarid eastward[a], toward the sunrise, to the border of Kisloth-tabor, and went out to Daberath and up to Japhia.
translation:
  language: zh_hans
  text: 边界从撒立转向东，朝日出之处，到吉斯绿·他泊的边界，又延伸到大比拉，再上到雅非亚。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“向东，朝太阳升起的方向。”直译：“向东，日出之处。”
    reason: 原文以两个相近短语加强向东的方位；后一个短语保留太阳升起的意象。
lexical_decisions:
- source_word: וְשָׁב
  choice: 边界……转向
  rationale: 在划界叙述中，此词表示边界线改变走向；补出“边界”使现代汉语表意清楚，“转向”比“返回”更符合地理语境。
- source_word: מִשָּׂרִיד
  choice: 从撒立
  rationale: מן表示这一段边界的起点；地名按希伯来语音译。
- source_word: קֵדְמָה מִזְרַח הַשֶּׁמֶשׁ
  choice: 向东，也就是日出之地
  rationale: 译出原文重叠的东方表达，同时保留“日出”的具体意象；“也就是”在中文中自然连接两个同指东方的短语。
- source_word: עַל גְּבוּל
  choice: 到……的边界
  rationale: 在边界行进语境中，עַל表示抵达或接触该地界；译为“到……的边界”清晰自然。
- source_word: כִּסְלֹת תָּבֹר
  choice: 吉斯绿·他泊
  rationale: 复合地名按希伯来语音译，以间隔号标明两个组成部分。
- source_word: וְיָצָא
  choice: 又延伸到
  rationale: יצא在疆界描述中常指边界线向某处伸展；“延伸到”比直译“出去”更符合现代汉语地理叙述。
- source_word: אֶל הַדָּבְרַת
  choice: 到大比拉
  rationale: 专名按希伯来语音译；原文冠词在中文地名前不另行表达。
- source_word: וְעָלָה
  choice: 再上到
  rationale: 保留עלה所表达的地势上升，同时以“再”衔接边界路线。
- source_word: יָפִיעַ
  choice: 雅非亚
  rationale: 地名按希伯来语音译。
theological_decisions: []
