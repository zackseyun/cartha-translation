  text: This was the inheritance of the tribe of the sons of Issachar[a], according to their clans—the cities and their villages.
translation:
  language: zh_hans
  text: 这些城和属城的村庄，就是以萨迦子孙的支派按宗族所得的产业。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: זֹאת
  choice: 这就是
  rationale: 希伯来文是无系词的名词句，可按上下文理解为“这是”或“这就是”。中文无需强行补出过去时；“这就是”自然地指回前述地业。
- source_word: נַחֲלַת
  choice: 所得的产业
  rationale: נַחֲלָה在约书亚记分地语境中指承受所得的土地产业；此译保留承受产业的含义，也避免仅译作行政性的“分地”。
- source_word: מַטֵּה בְנֵי יִשָּׂשכָר
  choice: 以萨迦子孙支派
  rationale: מַטֶּה在此指支派；בְנֵי保留为“子孙”，体现支派身份的谱系表达。
- source_word: לְמִשְׁפְּחֹתָם
  choice: 按宗族
  rationale: מִשְׁפָּחוֹת在支派内部划分语境中指宗族；介词לְ在此具有分配、分类意味，译作“按”。
- source_word: הֶעָרִים
  choice: 这些城
  rationale: עָרִים指有人定居的城镇；在约书亚记地名和分地清单中采用传统且自然的“城”。定冠词结合回指语境译为“这些”。
- source_word: וְחַצְרֵיהֶן
  choice: 和属城的村庄
  rationale: חָצֵר在此指附属于各城的乡村聚落。“属城的村庄”比单说“村庄”更清楚表达其依附关系。
