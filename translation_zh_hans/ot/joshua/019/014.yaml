base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/014.yaml
  text: Then the border turned around it on the north to Hannathon[b][a], and its end was at the Valley of Iphtah-el.
translation:
  language: zh_hans
  text: 边界又从北面转向哈拿顿[a]；它的终点[b]在伊弗他伊勒谷。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在哈拿顿北面。”希伯来语短语可理解为相对于哈拿顿的位置，也可理解为向北转向哈拿顿。
    reason: lexical_alternative
  - marker: b
    text: “终点”原文直译为复数的“出去之处”，是描述边界末端或终止点的用语。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָסַב
  choice: 又……绕过
  rationale: 在划界叙述中，נָסַב表示边界转向、迂回或绕行；“绕过”自然地表达边界线的转折走向。
- source_word: אֹתוֹ
  choice: 那里
  rationale: 该代词在上下文中回指前述地点或界标；现代汉语用“那里”比直译“它”更符合地理叙述。
- source_word: הַגְּבוּל
  choice: 边界
  rationale: גְּבוּל在分地语境中指领土的界线；“边界”准确且通俗。
- source_word: מִצְּפוֹן חַנָּתֹן
  choice: 从哈拿顿北面
  rationale: מן与צפון构成的边界用语可表示相对于地标的位置，也可能带方向意味；正文采用较贴近希伯来语结构的“从……北面”，并以脚注保留另一种理解。
- source_word: וְהָיוּ תֹּצְאֹתָיו
  choice: 其终点……在
  rationale: תֹּצָאוֹת字面为复数“出去之处”，在边界叙述中指界线的末端或终止处。汉语以单数集合概念“终点”表达较自然，脚注说明原文形式。
- source_word: גֵּי
  choice: 谷
  rationale: גֵּי指山谷或峡谷；这里是复合地名的一部分，用“谷”简洁自然。
- source_word: יִפְתַּח אֵל
  choice: 伊弗他伊勒
  rationale: 这是地名，依希伯来语音译，不作词义翻译。
