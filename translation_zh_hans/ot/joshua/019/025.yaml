translation_notes:
  register: 采用现代、简洁而庄重的地界清单文体。“包括”补足汉语所需的列举关系；各地名之间使用顿号，末项以“和”连接。英文咨询层所附脚注实际讨论的是押煞的英语拼写异体，却误挂在Helkath之后；该差异不适用于中文，故不设脚注。
