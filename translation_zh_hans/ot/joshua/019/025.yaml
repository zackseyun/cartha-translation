  text: 他们的边界包括希利甲、哈利、比田和押煞。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: 包括
  rationale: 该叙事续接形式引出边界城邑清单；汉语用“边界包括”自然表达其列举功能，避免生硬直译“是”。
- source_word: גְּבוּלָם
  choice: 他们的边界
  rationale: גְּבוּלָם指该支派所得之地的边界；“边界”准确且符合现代汉语地界语境。
- source_word: חֶלְקַת
  choice: 希勒甲
  rationale: 地名按现代中文圣经常见音译处理，不按普通名词释义翻译。
- source_word: וַחֲלִי
  choice: 哈利
  rationale: 地名音译；词首ח以较易读的“哈”表示。
- source_word: וָבֶטֶן
  choice: 比田
  rationale: 地名音译，采用简洁、通行的中文形式。
- source_word: וְאַכְשָׁף
  choice: 押煞
  rationale: 地名音译，采用中文圣经中较为熟悉的形式。
