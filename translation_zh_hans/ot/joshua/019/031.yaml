  yaml_path: translation/ot/joshua/019/031.yaml
  text: This was the inheritance of the tribe of the sons of Asher according to their clans—these cities and their settlements[a][b].
translation:
  language: zh_hans
  text: 这就是亚设支派按宗族所得的产业：这些城和属城的村庄[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “属城的村庄”或译“附属聚落”。希伯来语指与这些城相连并隶属于它们的乡村居民点。
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת
  choice: 这就是
  rationale: 希伯来语以指示代词构成无动词名词句，直译可用现代汉语的“这就是”；汉语不必以过去时处理叙事总结。
- source_word: נַחֲלַת
  choice: 所得的产业
  rationale: 在约书亚记分地语境中，指作为承受之分而得的领土；“产业”保留承受与家族归属意味，加“所得的”使现代汉语顺畅。
- source_word: מַטֵּה בְנֵי אָשֵׁר
  choice: 亚设支派
  rationale: מַטֵּה在此指支派；בְנֵי אָשֵׁר是以先祖之名标示族群的惯用表达，汉语译作“亚设支派”自然且意义完整，避免生硬的“亚设子孙的支派”。
- source_word: לְמִשְׁפְּחֹתָם
  choice: 按宗族
  rationale: מִשְׁפָּחָה在分地语境中指支派内部的宗族单位；介词לְ具有依照宗族分配的意味。
- source_word: הֶעָרִים הָאֵלֶּה
  choice: 这些城
  rationale: עָרִים泛指有聚落性质的城邑；“城”符合土地清单的传统而清楚的汉语表达。
- source_word: וְחַצְרֵיהֶן
  choice: 和属城的村庄
  rationale: חָצֵר在此指附属于所列诸城的乡村聚落或无城墙居民点；“属城的村庄”明确其依附关系，同时保留聚落性质。
