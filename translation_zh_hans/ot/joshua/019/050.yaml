  text: עַל פִּ֨י יְהוָ֜ה נָ֣תְנוּ ל֗/וֹ אֶת הָ/עִיר֙ אֲשֶׁ֣ר שָׁאָ֔ל אֶת תִּמְנַת סֶ֖רַח בְּ/הַ֣ר אֶפְרָ֑יִם וַ/יִּבְנֶ֥ה אֶת הָ/עִ֖יר וַ/יֵּ֥שֶׁב בָּֽ/הּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/050.yaml
  text: At the command of Yahweh they gave him the city that he asked for[a], Timnath-serah in the hill country of Ephraim. He built the city and lived in it.
translation:
  language: zh_hans
  text: 他们按耶和华的吩咐，把约书亚所求的城，就是以法莲山区的亭拿·西拉，给了他。他建造[a]了那城，住在那里。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“修建”。这个希伯来语动词的基本义是“建造”；鉴于这里所指的是一座既有的城，也可按上下文理解为重建或修复。
    reason: 保留בנה的基本词义，并以脚注而非正文表达既有城邑语境下可能的“重建／修复”理解。
lexical_decisions:
- source_word: עַל פִּי יְהוָה
  choice: 照耶和华的吩咐
  rationale: עַל־פִּי是表示权威指示的惯用语，在此译为“照……的吩咐”自然且贴近原意；耶和华采用现代中文圣经传统中对神名的通行音译。
- source_word: נָתְנוּ לוֹ
  choice: 他们……给了他
  rationale: 保留原文复数主语及נתן“给”的基本意义；中文按自然语序将所给之物置于“给了他”之前。
- source_word: הָעִיר אֲשֶׁר שָׁאָל
  choice: 约书亚所求的城
  rationale: שׁאל在此意为“求取、请求”。原文只用代词“他”，中文补出“约书亚”以避免连续两个男性代词造成指代不清，所指由上下文明确。
- source_word: תִּמְנַת סֶרַח
  choice: 亭拿·西拉
  rationale: 地名按希伯来语音译，并以间隔号标示复合地名。
- source_word: בְּהַר אֶפְרָיִם
  choice: 以法莲山区
  rationale: הַר在此指山地地区，并非单独一座山；“山区”是自然清楚的现代汉语表达。
- source_word: וַיִּבְנֶה אֶת הָעִיר
  choice: 他修建了那城
  rationale: בנה的基本义是“建造”；鉴于该城已存在，“修建”既不强行断定为完全重建，也能涵盖建设、整修或扩建的语境含义。脚注保留更直译的可能。
- source_word: וַיֵּשֶׁב בָּהּ
  choice: 住在其中
  rationale: ישׁב在此表示居住；“住在其中”简洁庄重，也明确回指那城。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。简体中文面向普通读者的经文传统中，“耶和华”是最通行、可识别的专名形式；不以“主”替代，从而保留其作为神名的性质。
- issue: “建造”是否应解释为“重建”
  choice: 正文译“修建”，脚注列“建造”
  alternative: 重建
  rationale: בנה本身并未明确带有“重新”的语义；上下文虽可能暗示整修或重建，却不足以在正文中排他性地确定。译为“修建”并附注直译，可保留原文的开放性。
translation_notes:
  register: 采用现代、庄重而易懂的叙事体。为消除中文代词歧义补出“约书亚”；地理名称使用“以法莲山区”，避免误解为单一山峰。
