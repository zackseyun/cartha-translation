base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/041.yaml
  text: And the border of their inheritance was Zorah[a], Eshtaol, and Ir-shemesh.
translation:
  language: zh_hans
  text: 他们所得产业的边界是琐拉、以实陶和伊珥示麦[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “伊珥示麦”意为“太阳城”。
    reason: 说明希伯来地名 עִיר שָׁמֶשׁ 的透明词义。
lexical_decisions:
- source_word: וַיְהִי
  choice: 包括
  rationale: 这里的叙事连接式引出但支派所得产业的地点清单；中文用“包括”自然表达系词关系，并使后列城名与“疆域”衔接清楚。
- source_word: גְּבוּל
  choice: 疆域
  rationale: 在分地语境中，该词可指边界，也可指界内地域。由于后面列出的是城邑而非界线走向，译作“疆域”比“边界”更符合中文表达，同时保留领地范围之意。
- source_word: נַחֲלָתָם
  choice: 他们所得产业
  rationale: 保留 נַחֲלָה 所含承受、分得之产业的含义；“他们”指上文的但支派。加入“所得”使现代中文更自然，但不额外解释分配方式。
- source_word: צָרְעָה
  choice: 琐拉
  rationale: 采用该地名在简体中文圣经传统中通行且易辨识的音译。
- source_word: אֶשְׁתָּאוֹל
  choice: 以实陶
  rationale: 采用该地名在简体中文圣经传统中通行且易辨识的音译。
- source_word: עִיר שָׁמֶשׁ
  choice: 伊珥示麦
  rationale: 按专名音译，以避免在正文中把地名直接解释为普通名词；其可辨识的词义在脚注说明。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而清楚的叙述体。“疆域包括……”适合地点清单，也避免把所列城邑误读为边界线本身。所有地名均以通行中文形式呈现。
