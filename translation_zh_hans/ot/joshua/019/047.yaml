source:
  edition: WLC
  text: וַ/יֵּצֵ֥א גְבוּל בְּנֵי דָ֖ן מֵ/הֶ֑ם וַ/יַּעֲל֣וּ בְנֵֽי דָ֠ן וַ/יִּלָּחֲמ֨וּ עִם לֶ֜שֶׁם וַ/יִּלְכְּד֥וּ אוֹתָ֣/הּ וַ/יַּכּ֧וּ אוֹתָ֣/הּ לְ/פִי חֶ֗רֶב וַ/יִּֽרְשׁ֤וּ אוֹתָ/הּ֙ וַ/יֵּ֣שְׁבוּ בָ֔/הּ וַ/יִּקְרְא֤וּ לְ/לֶ֨שֶׁם֙ דָּ֔ן כְּ/שֵׁ֖ם דָּ֥ן אֲבִי/הֶֽם־־־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/047.yaml
  text: But the territory of the sons of Dan went out beyond them[a], so the sons of Dan went up and fought against Leshem, and they captured it and struck it with the edge of the sword, and they took possession of it and lived in it, and they called Leshem Dan[b], after the name of Dan their father.
translation:
  language: zh_hans
  text: 但的子孙的疆界从他们那里延伸出去[a]。于是，但的子孙上去攻打利善，攻占了那城，用刀剑击杀了城中的人；他们占领那城，住在其中，又照他们先祖但的名字，把利善称为但[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“但子孙的边界延伸到他们以外。”有些译本根据上下文将本句意译为“但子孙所得的地方太小”，但希伯来文的字面表述是空间性的，含义并不明确。
    reason: alternative_reading
  - marker: b
    text: 利善与《士师记》18:7、14、27、29所称的拉亿有关联。
    reason: cross_reference
lexical_decisions:
- source_word: וַיֵּצֵא גְבוּל בְּנֵי דָן מֵהֶם
  choice: 但但子孙的疆域伸展到他们以外
  rationale: גְבוּל在分地语境中可指“边界”或“疆域”；这里译作“疆域”较自然。מֵהֶם字面为“从他们那里／在他们以外”，含义不明确，因此正文保留空间性的表述，不直接解释为“地方太小，不够居住”。
- source_word: בְּנֵי דָן
  choice: 但子孙
  rationale: 保留希伯来文“但的众子”这一宗族、支派用语，同时符合现代汉语圣经叙事的表达习惯。
- source_word: וַיַּעֲלוּ
  choice: 上去
  rationale: עלה通常表示“上去”，在这里也可含向高处进军之意；直译既自然，也不额外限定具体地理方向。
- source_word: וַיִּלָּחֲמוּ עִם לֶשֶׁם
  choice: 攻打利善
  rationale: 该短语表示与利善交战；汉语以“攻打”表达针对城邑的军事行动最为自然。
- source_word: לֶשֶׁם
  choice: 利善
  rationale: 按马所拉文本的地名לֶשֶׁם音译，不以《士师记》中的“拉亿”替换；两者的关联放入脚注说明。
- source_word: וַיִּלְכְּדוּ אוֹתָהּ
  choice: 攻取了城
  rationale: לכד在军事语境中指攻占、夺取。希伯来文以阴性代词回指城邑，汉语明确译出“城”较为顺畅。
- source_word: וַיַּכּוּ אוֹתָהּ לְפִי חֶרֶב
  choice: 使城倒在刀下
  rationale: לְפִי חֶרֶב字面是“以刀剑之口／刃”。“使城倒在刀下”保留刀剑毁灭的形象和城邑拟人化表达，又避免生硬地说“击杀那城”。
- source_word: וַיִּרְשׁוּ אוֹתָהּ
  choice: 他们占有那城
  rationale: ירשׁ在征地语境中指取得并占有产业；“占有”与前面的“攻取”有所区别，表达夺取后的实际控制。
- source_word: וַיֵּשְׁבוּ בָהּ
  choice: 住在其中
  rationale: ישׁב在此指居住；译文简明自然，不额外加入原文未明说的定居过程。
- source_word: וַיִּקְרְאוּ לְלֶשֶׁם דָּן
  choice: 给利善起名叫但
  rationale: 准确表达把城名从利善改称为但的命名行为。
- source_word: כְּשֵׁם דָּן אֲבִיהֶם
  choice: 照他们先祖但的名字
  rationale: אָב字面为“父亲”，也可指支派祖先。此处所指是雅各之子但，现代汉语用“先祖”可准确传达宗族关系，避免误解为攻城者各自的生父。
