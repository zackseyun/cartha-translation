revisions:
- from: 但但子孙的疆域伸展到他们以外[a]。于是，但子孙上去攻打利善，攻取了城，使城倒在刀下；他们占有那城，住在其中，又照他们先祖但的名字，给利善起名叫但[b]。
  to: 但的子孙的疆界从他们那里延伸出去[a]。于是，但的子孙上去攻打利善，攻占了那城，用刀剑击杀了城中的人；他们占领那城，住在其中，又照他们先祖但的名字，把利善称为但[b]。
  rationale: 修正支派称谓的汉语结构，并将“以刀剑击打该城”的战争惯用语译得明确而自然。开头疑难短语仍采用空间性表达，不采纳“地方太小”的解释性译法；脚注保留替代译法及不确定性。交叉引文脚注改为“有关联”，与英文审校轨迹的谨慎措辞一致，不把该关联表述为无保留的同一认定。
