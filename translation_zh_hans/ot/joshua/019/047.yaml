  - severity: medium
    issue: “使城倒在刀下”过于含蓄且修辞化。
    rationale: וַיַּכּוּ...לְפִי חֶרֶב 是以刀剑击杀的战争惯用语；原译未清楚呈现行动及其针对城中居民的含义。
