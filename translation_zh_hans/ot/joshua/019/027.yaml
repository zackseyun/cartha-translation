  text: וְ/שָׁ֨ב מִזְרַ֣ח הַ/שֶּׁמֶשׁ֮ בֵּ֣ית דָּגֹן֒ וּ/פָגַ֣ע בִּ֠/זְבֻלוּן וּ/בְ/גֵ֨י יִפְתַּח אֵ֥ל צָפ֛וֹנָ/ה בֵּ֥ית הָעֵ֖מֶק וּ/נְעִיאֵ֑ל וְ/יָצָ֥א אֶל כָּב֖וּל מִ/שְּׂמֹֽאל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/027.yaml
  text: Then it turned eastward[a], toward the sunrise, to Beth-dagon, and reached to Zebulun and to the Valley of Iphtah-el northward, to Beth-emek and Neiel; then it went out to Cabul on the left.
translation:
  language: zh_hans
  text: 边界转向日出之地，到了伯大衮，又与西布伦相接，也到伊弗他伊勒谷；又向北到伯以墨和尼业，然后从左边[a]通到迦步勒。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文是“从左边”。古代以面向东方来辨别方位时，左边可指北边；这里也可能是说界线经过迦步勒的左侧。
    reason: 说明古代方位习惯，并保留这一边界表述在句法和地理上的歧义。
lexical_decisions:
- source_word: וְשָׁב
  choice: 边界转向
  rationale: 在疆界描述中，שׁוב 表示界线改变方向；补出“边界”使现代汉语指代清楚。
- source_word: מִזְרַח הַשֶּׁמֶשׁ
  choice: 日出之地
  rationale: 保留希伯来语“太阳升起之处”的方位意象，即东方；避免把介词结构过度明确为现代地图式表达。
- source_word: בֵּית דָּגֹן
  choice: 伯大衮
  rationale: 按圣经地名的通行汉语音译处理，不译作“（神）大衮之家”。
- source_word: וּפָגַע בִּזְבֻלוּן
  choice: 又与西布伦相接
  rationale: פגע 在疆界语境中指界线与另一地域接触，“相接”自然且准确。
- source_word: וּבְגֵי יִפְתַּח אֵל צָפוֹנָה
  choice: 并沿伊弗他伊勒谷向北
  rationale: 将方位副词“向北”与谷地路线连读，符合希伯来语词序所呈现的边界走向，同时不额外断定具体地形关系。
- source_word: בֵּית הָעֵמֶק וּנְעִיאֵל
  choice: 伯以墨和尼业
  rationale: 两处均作为专名音译，保持地名序列。
- source_word: וְיָצָא אֶל כָּבוּל
  choice: 然后……通到迦步勒
  rationale: יצא 在疆界公式中表示界线伸展、通往某点；“通到”比直译“出去”更符合现代汉语地理叙述。
- source_word: מִשְּׂמֹאל
  choice: 从左边
  rationale: 保留原文具体而可能具有方位含义的“左边”，不在正文中直接改译为“北边”。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而清楚的疆界叙述用语；地名以通行汉语圣经译名为主。正文保留“日出之地”和“左边”的原文意象，以脚注解释而不武断消除地理歧义。
