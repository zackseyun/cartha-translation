base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/008.yaml
  text: along with all the villages that were around these cities[a], as far as Baalath-beer, Ramath-negeb. This was the inheritance of the tribe of the sons of Simeon according to their clans.
translation:
  language: zh_hans
  text: 以及这些城周围所有的村庄，直到巴拉比珥、南地拉末[a]。这是西缅子孙的支派按宗族所得的产业。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“直到巴拉比珥，就是南地拉末。”此译法把“南地拉末”视为对“巴拉比珥”的同位说明，即同一地点的另一个名称。
    reason: 原文两个地名之间没有连接词，既可能列出两个地点，也可能以后一个名称说明前一个名称。
lexical_decisions:
- source_word: וְכָל
  choice: 以及……所有的
  rationale: 承接前文的城邑清单，既表达附加关系，也保留“所有”的周全含义。
- source_word: הַחֲצֵרִים
  choice: 村庄
  rationale: 在分地清单中指城邑周边较小、通常没有城墙的附属聚落；“村庄”自然且符合语境。
- source_word: אֲשֶׁר סְבִיבוֹת הֶעָרִים הָאֵלֶּה
  choice: 这些城周围
  rationale: 简洁表达各村庄与前述城邑的地理关系，并保留近指词“这些”。
- source_word: עַד
  choice: 直到
  rationale: 这里表示地域范围所达到的界限；“直到”在中文地名范围叙述中自然明确。
- source_word: בַּעֲלַת בְּאֵר
  choice: 巴拉比珥
  rationale: 作为地名按音译处理，不把复合名称的组成部分另作解释。
- source_word: רָאמַת נֶגֶב
  choice: 南地拉末
  rationale: רָאמַת按地名“拉末”音译，נֶגֶב按常用地理名称译为“南地”；这样既可理解为地名，也不强行判定它与前一名称的句法关系。
- source_word: זֹאת נַחֲלַת
  choice: 这是……所得的产业
  rationale: 希伯来文是无系词名词句；中文补出“是”，并以“所得的产业”自然表达部族分得的承继之地。
- source_word: מַטֵּה בְנֵי שִׁמְעוֹן
  choice: 西缅子孙支派
  rationale: 保留“子孙”的谱系表达，同时用“支派”准确呈现分地语境中的社会政治单位。
- source_word: לְמִשְׁפְּחֹתָם
  choice: 按宗族
  rationale: 指支派内部据以分配土地的宗族单位；“按宗族”简洁而符合圣经分地语境。
theological_decisions: []
