  text: and Shaalabbin[a], and Aijalon[c][b], and Ithlah.
translation:
  language: zh_hans
  text: 以及沙拉宾[a]、亚雅仑[b]和伊提拉[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “沙拉宾”在相关经文或一些译本传统中也有“沙勒比姆”或“沙拉比姆”等异写；音译形式可能略有差异。
    reason: lexical_alternative
  - marker: b
    text: “亚雅仑”也可音译为“阿雅隆”。
    reason: lexical_alternative
  - marker: c
    text: “伊提拉”在一些译本中也音译为“耶特拉”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ
  choice: 以及／和
  rationale: 希伯来文在每个地名之前都使用连接词。中文城邑名单若逐一重复“和”会显得生硬，因此开头译作“以及”，末项用“和”，既承接上文，也保留列举关系。
- source_word: שַׁעֲלַבִּין
  choice: 沙拉宾
  rationale: 这是地名，按本节希伯来文的辅音和读音音译；相关经文中的名称形态略有不同。
- source_word: אַיָּלוֹן
  choice: 亚雅仑
  rationale: 这是地名；采用现代中文圣经读者较熟悉、同时能对应希伯来文读音的音译。
- source_word: יִתְלָה
  choice: 伊提拉
  rationale: 这是地名；依希伯来文音译，并采用中文圣经传统中较常见的写法。
