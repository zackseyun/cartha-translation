  footnotes:
  - marker: a
    text: 这些都是希伯来地名：“隐干宁”可能意为“园子之泉”；“隐哈大”以“泉”开头；“伯巴薛”以“……之家”开头。正文采用音译，因为这些词在这里都是城镇名。
    reason: lexical_alternative
lexical_decisions:
- source_word: רֶמֶת
  choice: 利篾
  rationale: 这是城镇名；按希伯来语读音音译，不作语义翻译。
- source_word: עֵין גַּנִּים
  choice: 隐·干宁
  rationale: 复合地名；עֵין意为“泉”，גַּנִּים意为“园子（复数）”。正文保留地名功能而音译，并以间隔号显示构词边界。
- source_word: עֵין חַדָּה
  choice: 隐·哈大
  rationale: 复合地名，首项עֵין意为“泉”；第二项的确切语义在此地名中不宜强行确定，因此整体音译。
- source_word: בֵית פַּצֵּץ
  choice: 伯·巴悉
  rationale: 复合地名，בֵית意为“……之家”；作为城镇名整体音译，并以间隔号显示构词边界。
- source_word: וְ / וּ
  choice: 、；和
  rationale: 希伯来文重复使用连接词串联各地名；现代汉语采用顿号，并在末项前用“和”，自然表达并列关系。
