base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/015.yaml
  text: 'Kattath[a], Nahalal, Shimron, Idalah, and Bethlehem: twelve cities with their villages.'
translation:
  language: zh_hans
  text: 加他、拿哈拉、伸仑、以大拉和伯利恒[a]，共十二座城，还有所属的村庄。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “伯利恒”在这里是地名，不译作其字面意思“粮食之家”。
    reason: lexical_alternative
lexical_decisions:
- source_word: קַטָּת
  choice: 加他
  rationale: 专有地名，按希伯来语音译，并采用现代中文圣经地名中通行、易懂的形式。
- source_word: נַהֲלָל
  choice: 拿哈拉
  rationale: 专有地名，依希伯来语读音音译。
- source_word: שִׁמְרוֹן
  choice: 伸仑
  rationale: 专有地名，采用中文圣经传统中较为通行的音译形式。
- source_word: יִדְאֲלָה
  choice: 以大拉
  rationale: 专有地名，依希伯来语音译；词首辅音以中文习惯的“以”表示。
- source_word: בֵית לָחֶם
  choice: 伯利恒
  rationale: 这是地名，采用中文通行音译，不按组成部分的字面意义翻译。
- source_word: עָרִים
  choice: 城
  rationale: 在支派地业清单中指有名称的聚居城镇；译作“城”符合上下文和中文圣经地理用语。
- source_word: שְׁתֵּים עֶשְׂרֵה
  choice: 十二座
  rationale: 基数词修饰“城”，以量词“座”自然表达。
- source_word: חַצְרֵיהֶן
  choice: 所属的村庄
  rationale: חָצֵר在地业清单中通常指附属于各城的村落或不设防的聚居点；“所属的村庄”明确表达其从属关系。
