base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/022.yaml
  text: And the border touched Tabor[a], Shahazumah, and Beth-shemesh[b], and the end of their border was at the Jordan—sixteen cities with their villages.
translation:
  language: zh_hans
  text: 边界延伸到他泊[a]、沙哈洗玛和伯示麦，边界的尽头是约旦河[b]。共有十六座城，以及隶属这些城的村庄。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“到达他泊”或“与他泊相接”；这里的希伯来语动词可指界线到达或接触某地。
    reason: lexical_alternative
  - marker: b
    text: 直译“他们边界的出口是约旦河”；这是疆界描述的固定表达，指边界的终点或所达到的范围。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפָגַע הַגְּבוּל
  choice: 边界延伸到
  rationale: פגע用于疆界描述时，表示界线到达、接触或与某地相交；“延伸到”符合现代汉语地理叙述，同时不过度限定具体相交方式。
- source_word: בְּתָבוֹר
  choice: 他泊
  rationale: 地名音译，采用现代中文圣经读者较熟悉的形式。
- source_word: וְשַׁחֲצוּמָה
  choice: 沙哈洗玛
  rationale: 按马所拉文本所保存的地名音译；该罕见地名的具体读音存在文本与传抄层面的不确定性。
- source_word: וּבֵית שֶׁמֶשׁ
  choice: 伯示麦
  rationale: 地名采用通行音译，不直译为“太阳之家”。
- source_word: וְהָיוּ תֹּצְאוֹת גְּבוּלָם הַיַּרְדֵּן
  choice: 边界的尽头是约旦河
  rationale: תֹּצְאוֹת字面有“出口、伸出之处”之意，在疆界公式中指界线的终点或所达之处；此译自然表达其地理功能。
- source_word: עָרִים שֵׁשׁ עֶשְׂרֵה
  choice: 共有十六座城
  rationale: 直译数量短语，并以“共有”衔接前文的辖境清单。
- source_word: וְחַצְרֵיהֶן
  choice: 以及隶属这些城的村庄
  rationale: חָצֵר在城邑清单中通常指附属于城的较小、往往无城墙的聚落；补出“隶属”可清楚表达其关系，而不把它们误算为十六座城的一部分。
theological_decisions: []
