lexical_decisions:
- source_word: וִיהֻד
  choice: 耶户得
  rationale: 这是城邑名单中的地名，按希伯来语音译，不按普通词义翻译；采用较能反映 Yehud 发音且符合现代中文圣经地名风格的译名。
- source_word: וּבְנֵי בְרַק
  choice: 比尼·比拉
  rationale: 上下文表明这是但支派所得的一座城，不应译作普通名词短语“比拉的众子”；中点标明两个音译成分共同构成一个地名。
- source_word: וְגַת רִמּוֹן
  choice: 迦特·临门
  rationale: 作为城邑名单中的复合地名音译；中点既保留其两个组成部分，也帮助读者识别其为单一地名。
