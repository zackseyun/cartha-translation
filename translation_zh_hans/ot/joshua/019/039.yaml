  yaml_path: translation/ot/joshua/019/039.yaml
  text: This was the inheritance of the tribe of the sons of Naphtali according to their clans—the cities and their villages[a][b].
translation:
  language: zh_hans
  text: 这是拿弗他利支派按宗族所承受的产业——这些城和它们的村庄。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “村庄”或译“村落”。希伯来文指附属于这些城的外围乡村聚落。
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת
  choice: 这是
  rationale: 希伯来文是无明示系词的指示代词名词句，中文“这是”自然且不必补出过去时；本句虽为回顾性总结，时间关系可由上下文表达。
- source_word: נַחֲלַת
  choice: 所得的产业
  rationale: 在约书亚记分地语境中指承受所得的领土份额；“产业”保留其承受与盟约土地的意味，“所得的”使现代中文句法更顺畅。
- source_word: מַטֵּה בְנֵי נַפְתָּלִי
  choice: 拿弗他利支派
  rationale: מַטֵּה在此是“支派”；בְנֵי נַפְתָּלִי直译为“拿弗他利的子孙”，但整个短语是常规的支派称谓，译为“拿弗他利支派”准确、自然，也避免被误解为只包括男性。
- source_word: לְמִשְׁפְּחֹתָם
  choice: 按宗族
  rationale: מִשְׁפָּחָה在支派分配语境中指宗族或氏族层级；前置词לְ表示依照宗族进行分配或归类。
- source_word: הֶעָרִים
  choice: 这些城
  rationale: עִיר在此为分地清单中的城邑；定冠词并结合前文列举，中文以“这些城”清楚体现回指。
- source_word: וְחַצְרֵיהֶן
  choice: 和属城的村庄
  rationale: חָצֵר在此指附属于各城的外围村落或乡村聚落；“属城的村庄”明确表达其依附关系，避免误译为牧场。
