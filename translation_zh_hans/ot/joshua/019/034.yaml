  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/שָׁ֨ב הַ/גְּב֥וּל יָ֨מָּ/ה֙ אַזְנ֣וֹת תָּב֔וֹר וְ/יָצָ֥א מִ/שָּׁ֖ם חוּקֹ֑קָ/ה וּ/פָגַ֨ע בִּ/זְבֻל֜וּן מִ/נֶּ֗גֶב וּ/בְ/אָשֵׁר֙ פָּגַ֣ע מִ/יָּ֔ם וּ/בִ֣/יהוּדָ֔ה הַ/יַּרְדֵּ֖ן מִזְרַ֥ח הַ/שָּֽׁמֶשׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/034.yaml
  text: Then the border turned westward to Aznoth-tabor[a], and from there it went out to Hukkok, and it reached Zebulun on the south, and it reached Asher on the west, and Judah at the Jordan toward the east, where the sun rises.
translation:
  language: zh_hans
  text: 边界转向西，到了亚斯纳·他泊，又从那里延伸到户割；南面与西布伦相接，西面与亚设相接，又在东边日出方向的约旦河那里与犹大相接[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文本直译为“又在东边日出方向的约旦河那里与犹大相接”。这里的地理关系难以确定，因为按通常理解，拿弗他利的领地并不与犹大的领地直接接壤。有人以不同方式理解这句话，也有人认为原文在流传中可能出现了问题；正文仍按现存希伯来文本翻译。
    reason: textual_variant
lexical_decisions:
- source_word: וְשָׁב הַגְּבוּל
  choice: 边界转向
  rationale: 在划界叙述中，שׁוב常指边界改变方向；译作“转向”比“返回”更符合此处语境，也保留了边界行进的叙述方式。
- source_word: יָמָּה
  choice: 向西
  rationale: 字面义为“向海”，以地中海指示西方；现代汉语地理叙述用“向西”最自然明确。
- source_word: אַזְנוֹת תָּבוֹר
  choice: 亚斯纳·他泊
  rationale: 作为地名按音译处理，并用间隔号显示复合地名的两个成分。
- source_word: וְיָצָא מִשָּׁם
  choice: 又从那里延伸
  rationale: יצא在边界公式中表示界线从某一点继续伸展；“延伸”符合现代汉语表达，而不把它误解为人从那里“出去”。
- source_word: חוּקֹקָה
  choice: 户割
  rationale: 采用中文圣经传统中易辨认的地名音译。
- source_word: וּפָגַע
  choice: 相接
  rationale: פגע用于疆界时表示边界同另一地区接触；“相接”比一般性的“到达”更准确地表达疆界关系。
- source_word: מִנֶּגֶב
  choice: 南面
  rationale: 此处מן与方向词连用，指接壤所在的一侧；“南面”自然表达西布伦位于该边界接触处的南侧。
- source_word: וּבְאָשֵׁר פָּגַע מִיָּם
  choice: 西面与亚设相接
  rationale: מִיָּם字面涉及“海”，在此边界语境中指西侧；译为“西面”使现代读者易于理解。
- source_word: וּבִיהוּדָה הַיַּרְדֵּן מִזְרַח הַשָּׁמֶשׁ
  choice: 又在东边日出方向的约旦河那里与犹大相接
  rationale: 尽量依照马所拉文本保留“犹大”“约旦河”和东方方位之间的关系，不因地理困难而删改“犹大”；“日出方向”也保留原文富有形象性的方位表达。
theological_decisions:
- issue: “犹大、约旦河、东边”这一短语在地理上难以解释
  choice: 正文保留马所拉文本所载的“犹大”，并译成在东边约旦河一带与犹大相接。
  alternative: 可猜测“犹大”是抄写讹误，或将其解释为约旦河东与犹大间接相关的城镇；也可通过意译避免表达拿弗他利与犹大直接接壤。
  rationale: 这虽非教义问题，却涉及重要的文本与解释难点。译文不应凭推测协调地理，而应保留现存希伯来文本的张力，并用脚注说明。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。边界描述使用“转向、延伸、相接”等普通读者易懂的地理用语；专名沿用较熟悉的中文音译。末句保留原文的“日出方向”及其地理张力，不在正文中擅自协调。
