  text: אֵ֣לֶּה הַ/נְּחָלֹ֡ת אֲשֶׁ֣ר נִחֲל֣וּ אֶלְעָזָ֣ר הַ/כֹּהֵ֣ן וִ/יהוֹשֻׁ֪עַ בִּן נ֟וּן וְ/רָאשֵׁ֣י הָֽ/אָב֣וֹת לְ/מַטּוֹת֩ בְּנֵי יִשְׂרָאֵ֨ל בְּ/גוֹרָ֤ל בְּ/שִׁלֹה֙ לִ/פְנֵ֣י יְהוָ֔ה פֶּ֖תַח אֹ֣הֶל מוֹעֵ֑ד וַ/יְכַלּ֕וּ מֵֽ/חַלֵּ֖ק אֶת הָ/אָֽרֶץ׀־־׀׀־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/051.yaml
  text: These are the inheritances that Eleazar the priest[a], Joshua son of Nun, and the heads of the fathers’ houses of the tribes of the sons of Israel apportioned by lot at Shiloh before Yahweh, at the entrance of the tent of meeting. So they finished dividing the land.
translation:
  language: zh_hans
  text: 这些就是祭司以利亚撒、嫩的儿子约书亚，以及以色列各支派宗族的首领，在示罗、在耶和华面前、在会幕门口抽签分配的产业。于是他们把那地分完了。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַנְּחָלֹת
  choice: 产业
  rationale: 此词指各支派承受并长期持有的土地份额；“产业”兼顾土地分配与承受之业的含义。
- source_word: נִחֲלוּ
  choice: 分给
  rationale: 此处的动词表示由以利亚撒、约书亚和首领主持，把各份产业划归各支派；“分给”在现代汉语中自然清楚。
- source_word: אֶלְעָזָר הַכֹּהֵן
  choice: 祭司以利亚撒
  rationale: 按现代汉语通常采用职衔在姓名前的表达。
- source_word: וְרָאשֵׁי הָאָבוֹת לְמַטּוֹת בְּנֵי יִשְׂרָאֵל
  choice: 以色列各支派的宗族首领
  rationale: אָבוֹת在此指父系宗族或祖家，而非单指生父；“宗族首领”比直译“父家首领”更自然，并保留其社会组织含义。
- source_word: בְּגוֹרָל
  choice: 抽签
  rationale: 表示借签决定土地归属；“抽签”是现代汉语准确而通行的表达。
- source_word: בְּשִׁלֹה
  choice: 在示罗
  rationale: 按希伯来地名作规范音译。
- source_word: לִפְנֵי יְהוָה
  choice: 耶和华面前
  rationale: לִפְנֵי表示在其面前或临在之处；神名按汉语圣经传统作“耶和华”。
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: 会幕门口
  rationale: “会幕”是אֹהֶל מוֹעֵד简洁且通行的汉语译法；פֶּתַח指入口处。
- source_word: וַיְכַלּוּ מֵחַלֵּק אֶת הָאָרֶץ
  choice: 至此，他们完成了分地的工作
  rationale: 既表达叙事至此完成的结果，也自然呈现“把这地划分完毕”的意思。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。现代中文读者最熟悉且能识别为专名的形式是“耶和华”；“雅威”更接近学界常见的拟音，但中文宗教语境中的普及度较低。
- issue: בני ישראל 的群体指称
  choice: 以色列人
  alternative: 以色列的众子
  rationale: 此固定表达在这里指以色列民族共同体，而非专门强调男性后裔；译作“以色列人”准确、自然，也不额外缩窄所指群体。
- issue: 分配者与产业承受者的句法关系
  choice: 由祭司、约书亚及宗族首领抽签分给以色列人的产业
  alternative: 祭司、约书亚及宗族首领所承受的产业
  rationale: 上下文和动词用法表明这些领袖主持分配，而不是他们自己作为全部产业的承受者；译文明确行政分配关系，但不补入原文没有的程序细节。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。压缩希伯来语中层层属格结构为“以色列各支派的宗族首领”，并把句末完成式译为“至此”，使叙事收束清晰。无脚注。
