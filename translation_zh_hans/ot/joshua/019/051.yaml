  naturalness: “在示罗耶和华面前、会幕门口”不合现代标准汉语的自然句法，顿号式标点也不能充分厘清修饰关系。改作“在示罗，在耶和华面前、在会幕门口”可保留原文并列定位语的简练与庄重。
  terminology: “祭司以利亚撒”“嫩的儿子约书亚”“产业”“抽签”“会幕”“耶和华”均可接受。“以色列各支派宗族的首领”较准确呈现“以色列子孙各支派的父家首领”这一层级关系。
