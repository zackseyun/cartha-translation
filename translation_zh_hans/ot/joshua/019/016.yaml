  text: זֹ֛את נַחֲלַ֥ת בְּנֵֽי זְבוּלֻ֖ן לְ/מִשְׁפְּחוֹתָ֑/ם הֶֽ/עָרִ֥ים הָ/אֵ֖לֶּה וְ/חַצְרֵי/הֶֽן־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/016.yaml
  text: This was the inheritance of the sons of Zebulun according to their clans[a], these cities and their villages.
translation:
  language: zh_hans
  text: 这就是西布伦子孙按宗族所得的产业：这些城和属城的村庄。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: זֹאת
  choice: 这就是
  rationale: 阴性单数指示词指回前面列出的产业；希伯来文是无系词句，中文用“这就是”自然概括，也不必强加过去或现在时。
- source_word: נַחֲלַת
  choice: 所得的产业
  rationale: 在分地语境中指承受而得的土地产业；“产业”保留法律与圣约承受的意味，“所得的”使现代中文句法完整。
- source_word: בְּנֵי זְבוּלֻן
  choice: 西布伦子孙
  rationale: 忠实保留“西布伦之子”的家族性表达，同时在中文中自然指西布伦的后裔群体。
- source_word: לְמִשְׁפְּחוֹתָם
  choice: 按宗族
  rationale: 介词 לְ 在此表示分类或分配方式；מִשְׁפָּחוֹת 指支派内部的宗族单位。
- source_word: הֶעָרִים הָאֵלֶּה
  choice: 这些城
  rationale: 概括前文列出的城市；“城”符合约书亚记地界清单的庄重、简洁文体。
- source_word: וְחַצְרֵיהֶן
  choice: 和属城的村庄
  rationale: חָצֵר 在土地清单中通常指附属于各城的乡村聚落；“属城的村庄”明确表达其依附关系，也避免把代词误解为指居民。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而简洁的叙事总结语体。以冒号引出“这些城和属城的村庄”，呈现后半句对产业内容的同位说明；不为希伯来文无系词句强加时态。
