  yaml_path: translation/ot/joshua/019/007.yaml
  text: 'Ain[a], Rimmon, Ether, and Ashan: four cities, with their villages.'
translation:
  language: zh_hans
  text: 亚因[a]、临门、以帖和亚珊，共四座城，以及属这些城的村庄。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来原文列出四个地名：亚因、临门、以帖和亚珊。有些解释者参照《历代志上》4:32，认为“亚因—临门”也可能合起来理解；这样会影响城邑数目的计算。
    reason: cross_reference
lexical_decisions:
- source_word: עַיִן
  choice: 亚因
  rationale: 此处是城名，采用中文圣经传统中通行的音译，不按普通名词“泉”或“眼睛”翻译。
- source_word: רִמּוֹן
  choice: 临门
  rationale: 此处是城名，采用通行中文音译；不按其普通名词义“石榴”翻译。
- source_word: וָעֶתֶר
  choice: 以帖
  rationale: 其中包含连接词，地名 עֶתֶר 采用通行中文音译“以帖”。
- source_word: וְעָשָׁן
  choice: 和亚珊
  rationale: 保留连接关系，并将地名 עָשָׁן 音译为通行形式“亚珊”。
- source_word: עָרִים
  choice: 城
  rationale: 在领地城邑清单中指有附属村庄的主要聚居点；结合量词自然译作“座城”。
- source_word: אַרְבַּע
  choice: 四
  rationale: 按原文直译基数词，并以“共四座城”清楚呈现清单后的总数。
- source_word: וְחַצְרֵיהֶן
  choice: 以及属这些城的村庄
  rationale: חָצֵר 在此类领地公式中通常指附属于城邑的乡村聚落；明确译出代词所指，使现代汉语自然清楚。
