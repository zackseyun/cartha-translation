  yaml_path: translation/ot/joshua/019/040.yaml
  text: For the tribe of the sons of Dan, according to their clans, the seventh lot came out.
translation:
  language: zh_hans
  text: 为但支派，按着他们的宗族，抽出的签是第七签。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְמַטֵּה בְנֵי דָן
  choice: 归给但支派
  rationale: מַטֶּה在约书亚记分地语境中指“支派”；בְנֵי דָן字面为“但的子孙”，在现代汉语中合译为“但支派”更自然，也准确表达群体身份。前缀לְ在此表示抽签所得的归属，译作“归给”。
- source_word: לְמִשְׁפְּחֹתָם
  choice: 按着他们的宗族分地
  rationale: מִשְׁפָּחוֹת指支派内部的宗族单位，不只是现代意义上的小家庭。“分地”由上下文补明其在土地分配中的作用，使汉语句意完整。
- source_word: יָצָא
  choice: 抽出
  rationale: יָצָא基本义为“出来”。与拈阄的גּוֹרָל连用时，“签抽出”既保留“出来”的意象，也符合现代汉语抽签表达。
- source_word: הַגּוֹרָל
  choice: 签
  rationale: גּוֹרָל在这里指用于决定土地分配次序和归属的阄；现代汉语用“签”较自然，并可与“抽出”搭配。
- source_word: הַשְּׁבִיעִי
  choice: 第七签
  rationale: 序数词修饰גּוֹרָל，表示此次分地抽签的第七个结果。
theological_decisions: []
