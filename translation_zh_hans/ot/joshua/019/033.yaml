base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/033.yaml
  text: And their border was from Heleph[a], from the oak in Zaannannim, and Adami-nekeb and Jabneel, as far as Lakkum[b]; and its end was at the Jordan.
translation:
  language: zh_hans
  text: 他们的边界从希利弗起，经过撒拿音的橡树[a]、亚大米尼吉和雅比聂，直到拉共；边界的尽头在约旦河[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“从以伦比撒拿音起。”希伯来文既可理解为一个地名，也可理解为“撒拿音的橡树”。
    reason: alternative_reading
  - marker: b
    text: 希伯来文直译为“它的出口是约旦河”，是描述边界终点抵达约旦河的说法。
    reason: lexical_alternative
lexical_decisions:
- source_word: גְבוּלָם
  choice: 他们的边界
  rationale: גְּבוּל在此指前述拿弗他利支派领地的界线；“边界”准确而自然。
- source_word: מֵחֵלֶף
  choice: 从希利弗起
  rationale: חֵלֶף是地名；按现代中文圣经地名惯例音译，并用“起”清楚表达起点。
- source_word: מֵאֵלוֹן בְּצַעֲנַנִּים
  choice: 经过撒拿音的橡树
  rationale: אֵלוֹן可指大树，常理解为橡树或笃耨香树；此处保留普通名词读法，把后面的撒拿音视为所在地。“经过”符合中文边界路线的表达，但希伯来文仅以介词串联。
- source_word: וַאֲדָמִי הַנֶּקֶב
  choice: 亚大米尼吉
  rationale: 在连续地名中最适合作为复合地名音译，不将הַנֶּקֶב另译为“隘口”，以免过度释义。
- source_word: וְיַבְנְאֵל
  choice: 雅比聂
  rationale: 专有地名，采用通行中文音译。
- source_word: עַד לַקּוּם
  choice: 直到拉共
  rationale: עַד表示范围延伸至某处；“直到”简洁地传达其界限。
- source_word: תֹצְאֹתָיו
  choice: 边界的尽头
  rationale: 该词字面为“出口、出去之处”，在划界文本中指界线的终点；译作“边界的尽头”既保留空间意象，也符合现代中文。
- source_word: הַיַּרְדֵּן
  choice: 约旦河
  rationale: 标准中文地理名称；补出“河”可避免现代读者误解，且不改变所指。
