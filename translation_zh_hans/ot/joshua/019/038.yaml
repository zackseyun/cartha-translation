base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/038.yaml
  text: 'and Yiron[a], Migdal-el, Horem, Beth-anath, and Beth-shemesh: nineteen cities[b], with their villages.'
translation:
  language: zh_hans
  text: 还有伊利稳、密大伊勒[a]、和琏、伯亚纳、伯示麦[b]，共十九座城，以及所属的村庄。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “密大伊勒”是地名；按字面，其名称的组成部分可理解为“神（或伊勒）之塔”。
    reason: lexical_alternative
  - marker: b
    text: “伯亚纳”和“伯示麦”都是音译地名；按字面可分别理解为“亚纳之家”和“太阳之家”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/יִרְאוֹן
  choice: 还有伊利稳
  rationale: 按希伯来语音译地名；句首连接词结合名单语境自然译为“还有”。
- source_word: וּ/מִגְדַּל אֵל
  choice: 密大伊勒
  rationale: 作为复合地名音译，不在正文中按字面译作“神之塔”；“伊勒”保留 אֵל 的名称成分。
- source_word: חֳרֵם
  choice: 和琏
  rationale: 按希伯来语地名音译，并采用适合现代中文圣经地名的形式。
- source_word: וּ/בֵית עֲנָת
  choice: 伯亚纳
  rationale: 作为复合地名音译；בֵּית 的地名成分依中文惯例作“伯”，不在正文中直译其字面含义。
- source_word: וּ/בֵית שָׁמֶשׁ
  choice: 伯示麦
  rationale: 采用中文读者较熟悉的传统地名音译，同时保留其作为专名的性质。
- source_word: עָרִים תְּשַׁע עֶשְׂרֵה
  choice: 共十九座城
  rationale: 准确表达希伯来语“十九座城”，加“共”符合中文清点名单的表达。
- source_word: וְ/חַצְרֵי/הֶן
  choice: 以及所属的村庄
  rationale: חֲצֵרִים 在分地名单中指附属于各城的村落或无城墙聚落；“所属的村庄”自然表达第三人称复数后缀的关系。
