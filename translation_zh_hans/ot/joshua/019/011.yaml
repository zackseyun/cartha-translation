  yaml_path: translation/ot/joshua/019/011.yaml
  text: And their border went up westward to Maralah, and touched Dabbesheth, and touched the wadi that is opposite Jokneam.
translation:
  language: zh_hans
  text: 他们的边界向西上到玛拉拉，延伸到大巴设，又延伸到约念前面的河谷。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעָלָה גְבוּלָם לַיָּמָּה
  choice: 他们的边界向西上到
  rationale: 保留“边界上升”的地形性表达；לַיָּמָּה在此表示“向西”，不直译为“向海”。
- source_word: וּפָגַע
  choice: 延伸到
  rationale: 该词用于疆界走向时表示抵达、接触某地点；“延伸到”符合现代汉语地界描述，并保留边界触及该处的含义。
- source_word: הַנַּחַל
  choice: 河谷
  rationale: נחל可指季节性水道及其谷地；此处是地理界线，译作“河谷”比单纯“河”更准确。
- source_word: עַל פְּנֵי יָקְנְעָם
  choice: 约念前面
  rationale: 较形式地保留方位短语עַל־פְּנֵי；原文未明确具体朝向，不以“对面”或某一方位消除其空间含混性。
