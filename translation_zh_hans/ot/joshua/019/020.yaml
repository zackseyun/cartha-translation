  text: 又有哈拉比特[a]、基善和亚别。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这个地名也可按传统形式音译为“拉比”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרַבִּית
  choice: 哈拉比
  rationale: 地名采用音译。马所拉读音中的词首 ה 视为名称的一部分，译作“哈拉比”，较直接地反映 Harabbith；另有传统形式省略词首音，见脚注。
- source_word: קִשְׁיוֹן
  choice: 基善
  rationale: 地名采用适合现代汉语的音译；该形式与旧约其他相关地名的常见汉译协调。
- source_word: אָבֶץ
  choice: 亚别
  rationale: 地名采用汉语圣经地名中较自然、易读的音译；希伯来语词首为 א，元音转写存在差异。
- source_word: וְ / וָ
  choice: 还有；和
  rationale: 三个地名延续城邑清单。用“还有”承接上文，并保留末项前的连接关系，避免汉语中逐项重复“和”造成生硬。
