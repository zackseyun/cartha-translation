  yaml_path: translation/ot/joshua/019/017.yaml
  text: For Issachar[a], the fourth lot came out[b], for the sons of Issachar according to their clans.
translation:
  language: zh_hans
  text: 第四签为以萨迦抽出，归给以萨迦的子孙[a]，按着他们的宗族[b]分配。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“以萨迦的众子”，是表示支派后裔的惯用说法。
    reason: lexical_alternative
  - marker: b
    text: 或译“家族”。这里指支派内部的宗族单位。
    reason: lexical_alternative
lexical_decisions:
- source_word: לְיִשָּׂשכָר
  choice: 为以萨迦
  rationale: 介词 לְ 在分地语境中标明抽签所归属的支派；“为以萨迦”简洁保留其分配含义。
- source_word: יָצָא הַגּוֹרָל הָרְבִיעִי
  choice: 第四签……抽出
  rationale: יָצָא 的基本意象是“出来”，在抽签语境中译作“抽出”自然，并保留实际抽签的图景；הַגּוֹרָל 译为“签”，不改释为较宽泛的“分地”。
- source_word: לִבְנֵי יִשָּׂשכָר
  choice: 归给以萨迦的子孙
  rationale: בְּנֵי 字面为“众子”，在这里是表示支派血缘归属的惯用语；“子孙”既保留后裔含义，也符合现代汉语表达。
- source_word: לְמִשְׁפְּחוֹתָם
  choice: 按着他们的宗族分配
  rationale: מִשְׁפָּחוֹת 在支派分地语境中指支派内部的宗族单位；“分配”由上下文补明介词短语在汉语中的关系，使句意完整自然。
