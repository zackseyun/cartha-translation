base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/029.yaml
  text: Then the border turned to Ramah[a], and to the fortified city of Tyre; then the border turned to Hosah, and its boundary points were at the sea[b], from the region of Achzib.
translation:
  language: zh_hans
  text: 边界转向拉玛，直到推罗这座坚固城；边界又转向何萨，其终点直通海边[a]，从亚革悉一带[b]起。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“向着海”；在以色列地理语境中，这种说法也可表示“向西”。
    reason: lexical_alternative
  - marker: b
    text: “亚革悉一带”也可译作“亚革悉地区”或“亚革悉地带”；原文由“从”引出。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁב
  choice: 转向
  rationale: 在划界记述中，该词表示边界改变走向；“转向”既贴近原文，也符合现代汉语的地理表述。
- source_word: הַגְּבוּל
  choice: 边界
  rationale: 指分地时所划定的疆界线；“边界”在现代汉语中自然、明确。
- source_word: הָרָמָה
  choice: 拉玛
  rationale: 按圣经地名的通行汉译音译。
- source_word: עִיר מִבְצַר צֹר
  choice: 设防城推罗
  rationale: 保留原文“城—防御工事”的修饰关系，并以简洁自然的汉语说明推罗是设有防御工事的城。
- source_word: חֹסָה
  choice: 何萨
  rationale: 按希伯来语地名音译。
- source_word: וַיהיו תֹצְאֹתָיו
  choice: 边界的尽头
  rationale: תֹצָאוֹת在划界公式中指边界的出口、端点或终点；“尽头”能自然表达其地理意义，不机械照译为“出口”。
- source_word: הַיָּמָּה
  choice: 通到海边
  rationale: 方向词尾表示朝向海；在本处与边界尽头连用，“通到海边”符合现代汉语，同时脚注保留“向西”的可能含义。
- source_word: מֵחֶבֶל אַכְזִיבָה
  choice: 从亚革悉一带延伸而来
  rationale: חֶבֶל在领土语境中指一片划定的地域；מִן保留为“从”，并补出“延伸而来”，使汉语句法完整而不改变边界描述。
theological_decisions: []
