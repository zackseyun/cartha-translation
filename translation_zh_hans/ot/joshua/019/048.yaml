base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/048.yaml
  text: 'This was the inheritance of the tribe of the sons of Dan[b][a], according to their clans: these cities with their villages.'
translation:
  language: zh_hans
  text: 这是但支派按宗族所得的产业[a]：这些城和它们的村庄。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “产业”或译“分得的地业”；原词既可强调所分得的份额，也可强调承受为业的性质。
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת
  choice: 这是
  rationale: 希伯来语阴性单数指示代词回指前文所列的地域。现代汉语“这是”无需明确区分英语中的现在时或过去时，因而自然保留原文未标明时态的特点。
- source_word: נַחֲלַת
  choice: 所得的产业
  rationale: 在约书亚记分地语境中，נַחֲלָה 指分配给支派、由其承受的土地。“产业”保留承受土地的意味，加上“所得的”使现代读者清楚这是分得的地域。
- source_word: מַטֵּה בְנֵי דָן
  choice: 但支派
  rationale: מַטֵּה 在此指“支派”；בְנֵי דָן 是指但的后裔所组成的群体。汉语惯用“但支派”，比直译“但子孙的支派”自然且意思明确。
- source_word: לְמִשְׁפְּחֹתָם
  choice: 按宗族
  rationale: מִשְׁפָּחוֹת 在支派分地的语境中指支派内部的亲族单位，不只是现代意义上的核心家庭；“宗族”较准确。
- source_word: הֶעָרִים הָאֵלֶּה
  choice: 这些城
  rationale: 直接呈现原文回指前述城邑清单的指示语；“城”符合土地名录的庄重简洁文体。
- source_word: וְחַצְרֵיהֶן
  choice: 和属城的村庄
  rationale: חָצֵר 在此类地界名录中通常指附属于城邑的外围村落或聚居点。“属城的村庄”明确表达这些村庄与所列各城的从属关系。
theological_decisions:
- issue: נַחֲלָה 的土地承受含义与行政分配含义
  choice: 产业
  alternative: 分得的地业；分地
  rationale: “产业”保留这片土地作为支派承受之份的含义，而不把词义缩减为纯行政性的划分；脚注说明语境中也可强调分配所得的份额。
translation_notes:
  register: 采用现代、庄重而易懂的叙事总结句式。“这是”自然保留希伯来语无显式时态的表达；“就是”呈现后半句对“产业”的同位说明。
