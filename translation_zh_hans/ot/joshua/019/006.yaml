  text: 'Beth-lebaoth and Sharuhen: thirteen cities[a], with their villages.'
translation:
  language: zh_hans
  text: 伯利巴勿、沙鲁险[a]，共十三座城，以及属城的村庄。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文本作“沙鲁险”；约书亚记15:32的平行名单作“西利欣”。
    reason: textual_variant
lexical_decisions:
- source_word: בֵית לְבָאוֹת
  choice: 伯利巴勿
  rationale: 这是地名，采用传统且可辨识的音译；不按字面译作“母狮之家”，以免在城邑名录中加入不必要的解释。
- source_word: שָׁרוּחֶן
  choice: 沙鲁险
  rationale: 按本节马所拉文本音译该地名；与平行名单中出现的异名或异文之关系留待脚注说明。
- source_word: עָרִים
  choice: 城
  rationale: 在分地城邑名单中，עִיר通常指有别于附属村庄的城镇；译作“城”符合本段固定表达和中文圣经地理名录的庄重语体。
- source_word: שְׁלֹשׁ עֶשְׂרֵה
  choice: 共十三座
  rationale: 准确表达基数，并以量词“座”和“共”构成自然的现代汉语计数句式。
- source_word: חַצְרֵיהֶן
  choice: 属城的村庄
  rationale: 此词在分地公式中通常指从属于所列诸城的无城墙村落或外围聚落；“属城的村庄”既清楚表达其附属关系，也避免将其误解为独立城邑。
