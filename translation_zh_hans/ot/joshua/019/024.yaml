  yaml_path: translation/ot/joshua/019/024.yaml
  text: The fifth lot came out for the tribe of the sons of Asher[a], according to their clans.
translation:
  language: zh_hans
  text: 第五签抽出来，是为亚设子孙的支派，按着他们的宗族。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作：“第五签抽出来，是为亚设子孙的支派，按着他们的家族。”
    reason: “宗族”所译的原词可依语境译作“家族”；此处通常指支派以下的亲属群体。
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: 抽出
  rationale: 原词字面有“出来”之意；在拈阄分地的语境中，“签抽出”既符合现代汉语习惯，也保留签被取出的意象，避免直接改写成较偏结果性的“抽中”。
- source_word: הַגּוֹרָל
  choice: 签
  rationale: 此处指用来决定分地次序或归属的签；“签”比“地业”更贴近原文所说的拈阄媒介及过程。
- source_word: הַחֲמִישִׁי
  choice: 第五
  rationale: 直接表达序数，修饰“签”。
- source_word: לְמַטֵּה
  choice: 归给……的支派
  rationale: מַטֶּה在此为以色列社会组织意义上的“支派”；介词לְ表示这签所归属的对象。
- source_word: בְנֵי אָשֵׁר
  choice: 亚设子孙
  rationale: 保留原文“亚设的众子”的谱系表达，同时使用现代中文圣经叙事中自然、庄重的“子孙”。
- source_word: לְמִשְׁפְּחוֹתָם
  choice: 按着他们的宗族分的
  rationale: מִשְׁפָּחוֹת指支派内部的宗族单位；补出“分的”以自然表达介词לְ在分地公式中的分配含义。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重且易懂的叙事语言。“第五签抽出”保留希伯来文“签出来”的具体意象；后半句适度补出“分的”，使中文句法完整。脚注标记已在正文中出现。
