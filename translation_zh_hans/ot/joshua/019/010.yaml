  yaml_path: translation/ot/joshua/019/010.yaml
  text: The third lot came up for the sons of Zebulun[a], according to their clans, and the border of their inheritance was as far as Sarid.
translation:
  language: zh_hans
  text: 第三签被抽出来，归给西布伦子孙的各宗族；他们所得产业的边界延伸到撒立。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַל
  choice: 抽出
  rationale: עלה字面意为“上来”，但在抽签分地的语境中表示签被抽出；正文采用自然的现代汉语，并用脚注保留原文意象。
- source_word: הַגּוֹרָל הַשְּׁלִישִׁי
  choice: 第三签
  rationale: 准确表达序数和用于决定土地归属的“签”，简洁符合汉语习惯。
- source_word: לִבְנֵי זְבוּלֻן
  choice: 归西布伦的子孙
  rationale: 保留בני的亲族和支派表达，不将其泛化为“百姓”；“归”体现介词ל在分配语境中的意义。
- source_word: לְמִשְׁפְּחֹתָם
  choice: 按着他们的宗族分地
  rationale: משפחה在支派结构中指宗族；补出“分地”使汉语句意完整，而不增加原文之外的实质内容。
- source_word: גְּבוּל נַחֲלָתָם
  choice: 他们所得产业的边界
  rationale: נחלה指经分配而承受的土地产业；“所得产业”在现代汉语中自然，并保留承受产业的含义。
- source_word: עַד שָׂרִיד
  choice: 延伸到撒立
  rationale: עד在边界描述中表示所达到的地点；“延伸到”符合中文地理叙述。撒立按地名音译。
