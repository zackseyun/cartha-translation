  yaml_path: translation/ot/joshua/019/030.yaml
  text: 'Ummah[a], Aphek, and Rehob: twenty-two cities, with their villages.'
translation:
  language: zh_hans
  text: 乌玛、亚弗、利合，共二十二座城，还有属城的村庄[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“附属聚落”或“附属村落”；希伯来语指与上述城邑相联系的乡村居民点。
    reason: lexical_alternative
lexical_decisions:
- source_word: עֻמָה
  choice: 乌玛
  rationale: 地名，按希伯来语辅音与元音音译；采用现代中文圣经地名中清楚自然的形式。
- source_word: אֲפֵק
  choice: 亚弗
  rationale: 地名，采用中文圣经传统中通行的音译。
- source_word: רְחֹב
  choice: 利合
  rationale: 地名，采用中文圣经传统中通行的音译，以便与其他经文中的同名地点保持一致。
- source_word: עָרִים
  choice: 城
  rationale: 此词概括分地清单中所列的居民点；“城”符合约书亚记清单的惯常表达，但不暗示这些地方规模都很大。
- source_word: עֶשְׂרִים וּשְׁתַּיִם
  choice: 二十二
  rationale: 忠实表达本段所列城邑的总数。
- source_word: חַצְרֵיהֶן
  choice: 属城的村庄
  rationale: חָצֵר 在土地与居民点清单中常指附属于主要城邑的乡村居民点；“属城的村庄”既表达其从属关系，也适合现代汉语。
