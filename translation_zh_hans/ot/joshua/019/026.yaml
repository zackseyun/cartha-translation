  yaml_path: translation/ot/joshua/019/026.yaml
  text: and Allammelech[a], Amad, and Mishal; and it reached to Carmel westward, and to Shihor-libnath.
translation:
  language: zh_hans
  text: 又有亚拉米勒、亚末和米沙勒；边界向西[a]延伸到迦密，又到希曷·立纳。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“向海”；在这里的地理语境中，指“向西”。
    reason: 保留方向词的字面表达及其在以色列地理语境中的含义。
lexical_decisions:
- source_word: אַלַּמֶּלֶךְ
  choice: 亚拉米勒
  rationale: 地名，按希伯来语音译；采用适合现代普通话阅读的形式，不赋予词义解释。
- source_word: עַמְעָד
  choice: 亚末
  rationale: 地名，依常见中文圣经地名形式音译，简洁自然。
- source_word: מִשְׁאָל
  choice: 米沙勒
  rationale: 地名，按希伯来语音译，并与相近但不同的名称保持区分。
- source_word: וּפָגַע
  choice: 边界……延伸到
  rationale: פגע在疆界描述中表示到达、接触某地；补出中文所需的主语“边界”，用“延伸到”自然表达路线走向。
- source_word: בְּכַרְמֶל
  choice: 到迦密
  rationale: 在疆界语境中，介词ב与פגע连用，表示边界到达的地点；“迦密”为通行中文地名。
- source_word: הַיָּמָּה
  choice: 向西
  rationale: 字面为“朝海”，在以色列地理语境中通常指朝地中海方向，即向西；正文采用自然方向用语，并以脚注保留字面意象。
- source_word: וּבְשִׁיחוֹר לִבְנָת
  choice: 又到西曷·立纳
  rationale: 视为复合地名并音译，以间隔号标明两部分；“又到”承接前面的疆界动词。
theological_decisions: []
