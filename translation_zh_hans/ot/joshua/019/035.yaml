  naturalness: “设防的城有：”在现代汉语的疆界与城邑清单中自然、简洁。采用通行的中文圣经地名形式，可读性和跨经文辨识度较佳。
  terminology: “设防的城”准确传达 מִבְצָר 的军事防御含义；脚注的“堡垒城”是可接受的词汇替代。地名采用“西丁、侧耳、哈末、拉甲、基尼烈”，不将希伯来语定冠词另行音译为“哈”。
