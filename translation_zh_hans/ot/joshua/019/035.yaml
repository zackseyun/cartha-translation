  yaml_path: translation/ot/joshua/019/035.yaml
  text: And the fortified cities were Ziddim[a], Zer, Hammath, Rakkath, and Kinnereth.
translation:
  language: zh_hans
  text: 设防的城[a]有：西丁、侧耳、哈末、拉甲和基尼烈。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“堡垒城”。
    reason: “设防的城”所译希伯来语词可作“堡垒城”。
lexical_decisions:
- source_word: וְ/עָרֵי מִבְצָר
  choice: 设防的城有
  rationale: 这是领属结构，字面为“防御工事之城”，在此自然表达为“设防的城”；句首 וְ 承接前文的地界清单，汉语中不必机械译作“和”。
- source_word: הַ/צִּדִּים
  choice: 哈齐丁
  rationale: 按希伯来语形式将此地名音译，并以“哈”反映词首定冠词可能已成为名称一部分；由于该形式也可能被理解为普通名词短语，保留脚注说明。
- source_word: צֵר
  choice: 策尔
  rationale: 按希伯来语地名音译。
- source_word: וְ/חַמַּת
  choice: 哈末
  rationale: 按希伯来语地名音译；不与其他经文中通常译作“哈马”的较著名城名强行等同。
- source_word: רַקַּת
  choice: 拉甲
  rationale: 按希伯来语地名音译，并采用适合现代汉语圣经地名的简洁形式。
- source_word: וְ/כִנָּרֶת
  choice: 基尼烈
  rationale: 按希伯来语地名音译，并与相关圣经地名的常见中文形式保持连续性。
