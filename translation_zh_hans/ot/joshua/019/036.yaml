lexical_decisions:
- source_word: אֲדָמָה
  choice: 亚大玛
  rationale: 此处位于城邑名录中，是地名而非“土地、土壤”这一普通名词；采用现代中文圣经语境中清楚、自然的音译。
- source_word: הָרָמָה
  choice: 拉玛
  rationale: 这是地名。希伯来文带定冠词，但在此可能已凝固于地名形式中；中文不另译为“那拉玛”，以免生硬并误导。
- source_word: חָצוֹר
  choice: 夏琐
  rationale: 此处是城邑名，采用中文圣经传统中通行的音译“夏琐”，不翻译其可能的词源含义。
- source_word: וְ
  choice: 、／和
  rationale: 希伯来文连词连接三个并列地名；中文列举时前项用顿号，末项用“和”，兼顾原文连接关系与现代汉语自然表达。
