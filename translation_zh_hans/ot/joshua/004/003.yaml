  naturalness: 修改为“你要吩咐他们说”可消除连续两个“你们”造成的指代混乱；“把它们带过去，放在……”比“带着它们过河”更明确承接石头并保持原文“使其过到彼岸”的动作。
  terminology: “约旦河”“祭司”“十二块石头”及“住宿的地方”均恰当。“立定”是较庄重而自然的现代汉语表达，准确传达祭司脚所站之处稳固不动。
