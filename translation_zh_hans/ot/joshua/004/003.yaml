revisions:
- from: 你们要吩咐他们说：‘你们要从这里，就是从约旦河中，从祭司双脚稳稳站立的地方[a]，取十二块石头，带着它们过河，放在你们今晚住宿的地方[b]。’
  to: 你要吩咐他们说：‘你们要从这里，就是从约旦河中、从祭司双脚立定的地方[a]，取十二块石头；把它们带过去，放在你们今晚住宿的地方[b]。’
  rationale: 修订仅澄清原文命令的受话者层级：外层为对约书亚的单数命令，内层引语为对十二人的复数命令。并将“带着它们过河”调整为“把它们带过去”，使石头作为被带过对象更明确。保留原有脚注锚点及其内容。
