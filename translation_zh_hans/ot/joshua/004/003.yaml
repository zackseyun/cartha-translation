base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/003.yaml
  text: and command them[a], saying, ‘Take up for yourselves from here, from the midst of the Jordan, from the place where the priests’ feet stood firm, twelve stones[b], and carry them over with you and set them down at the lodging place where you will spend the night.’
translation:
  language: zh_hans
  text: 你要吩咐他们说：‘你们要从这里，就是从约旦河中、从祭司双脚立定的地方[a]，取十二块石头；把它们带过去，放在你们今晚住宿的地方[b]。’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 较直译：“从祭司双脚立定的位置。”
    reason: lexical_alternative
  - marker: b
    text: “住宿的地方”指以色列人过河后当晚停留之处，不一定是永久定居点。
    reason: cultural_note
lexical_decisions:
- source_word: וְצַוּוּ
  choice: 你们要吩咐
  rationale: 该词是צוה的皮勒式复数祈使形，表示直接下令；“吩咐”既保留命令的力度，也符合现代汉语叙事语体。
- source_word: שְׂאוּ לָכֶם
  choice: 你们要……取
  rationale: נשׂא在此指从河床拿起石头。“取”简洁自然；לָכֶם表达参与和关联，汉语由主语“你们”及后文亲自携带的动作自然体现，避免译成“归你们所有”而造成所有权含义。
- source_word: מִזֶּה מִתּוֹךְ הַיַּרְדֵּן
  choice: 从这里，就是从约旦河中
  rationale: 保留原文连续两个介词短语的具体性；“就是”说明“这里”所指为约旦河中，同时使汉语顺畅。
- source_word: מִמַּצַּב רַגְלֵי הַכֹּהֲנִים הָכִין
  choice: 从祭司双脚稳稳站立的地方
  rationale: מַצָּב表示站立的位置，הָכִין强调稳固、立定；此译法以自然汉语保留祭司站稳不动的画面。
- source_word: שְׁתֵּים עֶשְׂרֵה אֲבָנִים
  choice: 十二块石头
  rationale: 按原文直译数词与名词，并使用现代汉语常用量词“块”。
- source_word: וְהַעֲבַרְתֶּם אוֹתָם עִמָּכֶם
  choice: 带着它们过河
  rationale: עבר的使役形在语境中表示把石头带过约旦河；“带着它们”也自然表达עִמָּכֶם的同行、随身之意。
- source_word: וְהִנַּחְתֶּם אוֹתָם
  choice: 放
  rationale: נוח的使役形在此指把石头安放下来；“放”具体、自然，不额外说明其排列或用途。
- source_word: בַּמָּלוֹן אֲשֶׁר תָּלִינוּ בוֹ הַלָּיְלָה
  choice: 在你们今晚住宿的地方
  rationale: מָלוֹן指过夜停留之处，后面的关系从句加以说明；合并为自然汉语，同时保留“今晚”和将要住宿的语境。
