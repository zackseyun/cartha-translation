base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/019.yaml
  text: And the people came up from the Jordan on the tenth day of the first month[b][a], and they camped at Gilgal on the eastern border of Jericho.
translation:
  language: zh_hans
  text: 第一个月的第十日，百姓从约旦河上来[a]，在吉甲、耶利哥东面的边界处安营[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“从约旦河上去”。
    reason: עלה表示向上移动；中文可随叙述视角译为“上来”或“上去”。
  - marker: b
    text: 或译：“他们在耶利哥东边的吉甲安营。”
    reason: “耶利哥东面的边界处”对应希伯来语“耶利哥东面的边缘／边界”；该短语也可较宽泛地理解为“耶利哥以东”。
lexical_decisions:
- source_word: עָלוּ
  choice: 上来
  rationale: 保留עלה表示从较低处向上移动的方向感；结合百姓离开约旦河河床的叙事背景，“上来”自然简洁。
- source_word: מִן הַיַּרְדֵּן
  choice: 从约旦河
  rationale: מן表示起点或离开的范围；中文补出“河”，明确“约旦”在此指约旦河。
- source_word: בֶּעָשׂוֹר לַחֹדֶשׁ הָרִאשׁוֹן
  choice: 正月初十
  rationale: 这是希伯来历日期表达；“正月初十”是现代汉语自然、准确的日期说法，等同于“第一个月的第十日”，并不暗示中国农历。
- source_word: וַיַּחֲנוּ
  choice: 安营
  rationale: 准确表达חנה的扎营、驻营之意，且符合庄重自然的历史叙事语体。
- source_word: בַּגִּלְגָּל
  choice: 在吉甲
  rationale: 将地名音译为“吉甲”，介词译为“在”，自然表达安营地点。
- source_word: בִּקְצֵה מִזְרַח יְרִיחוֹ
  choice: 位于耶利哥东面的边界
  rationale: קצה可指边缘、尽头或边界，מזרח表示东方或东面；正文保留“耶利哥东面边界”的地理关系，脚注说明也可理解为笼统的“耶利哥东边”。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。“正月初十”简洁自然；分号和后一句“吉甲位于……”使原文地点与方位关系在中文中清楚，同时不掩盖其句法上的解释空间。
