  yaml_path: translation/ot/joshua/004/016.yaml
  text: Command the priests who carry the ark of the testimony to come up from the Jordan[a].
translation:
  language: zh_hans
  text: “你要吩咐抬着见证之柜的祭司从约旦河上来[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“见证的柜”。原文作“见证”，不是许多其他提到这圣柜的经文中较常见的“约”。
    reason: lexical_alternative
lexical_decisions:
- source_word: צַוֵּה
  choice: 吩咐
  rationale: 这是צוה的第二人称阳性单数命令式，直接命令约书亚；“吩咐”在现代汉语中自然、庄重，并保留明确的命令语气。
- source_word: הַכֹּהֲנִים
  choice: 祭司
  rationale: כהנים带定冠词，指上下文中那些特定的祭司；汉语通常不另译定冠词。
- source_word: נֹשְׂאֵי
  choice: 抬……的
  rationale: 这是נשׂא的主动分词复数构造形式，修饰“祭司”；约柜由人抬行，译作“抬”比泛指的“携带”更符合具体动作。
- source_word: אֲרוֹן הָעֵדוּת
  choice: 见证柜
  rationale: 按原文构造链直译עֵדוּת为“见证”，不与其他经文较常见的“约柜”措辞协调；“柜”准确表达אָרוֹן在此所指的圣柜。
- source_word: וְיַעֲלוּ
  choice: 上来
  rationale: עלה表示向上移动；在祭司离开河床的语境中，“上来”自然地表达从河中登岸。
- source_word: מִן הַיַּרְדֵּן
  choice: 从约旦河里
  rationale: מן表示从某处出来；上下文是祭司站在河床中，因此加入方位词“里”可自然、准确地表达从河中上来。
theological_decisions:
- issue: 圣柜名称中的עֵדוּת
  choice: 见证柜
  alternative: 约柜
  rationale: 本节希伯来文明确使用“见证”，而非“约”；保留这一用词差异，避免以其他经文中的熟悉称谓取代原文。
translation_notes:
  register: 采用现代、简洁而庄重的叙事用语。“你要吩咐”保留命令力度；“抬见证柜的祭司”符合现代汉语关系修饰结构。脚注保留עֵדוּת可译“见证／证言”的词义空间，并提示本节没有使用“约”一词。
