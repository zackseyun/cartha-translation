source:
  edition: WLC
  text: בַּ/יּ֣וֹם הַ/ה֗וּא גִּדַּ֤ל יְהוָה֙ אֶת יְהוֹשֻׁ֔עַ בְּ/עֵינֵ֖י כָּל יִשְׂרָאֵ֑ל וַ/יִּֽרְא֣וּ אֹת֔/וֹ כַּ/אֲשֶׁ֛ר יָרְא֥וּ אֶת מֹשֶׁ֖ה כָּל יְמֵ֥י חַיָּֽי/ו־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/014.yaml
  text: On that day Yahweh made Joshua great in the eyes of all Israel[a], and they feared him just as they had feared Moses all the days of his life.
translation:
  language: zh_hans
  text: 那一天，雅威使约书亚在全体以色列人眼中显为尊大；他们敬畏他[a]，正如他们在摩西有生之年敬畏摩西一样。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“惧怕他”“对他心存敬畏”；希伯来语这个动词可按语境表示惧怕、敬畏或尊崇。
    reason: 保留 ירא 在此处可能兼具惧怕、敬畏与尊崇的词义幅度。
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: 那一天
  rationale: 直接表达叙事中的特定日期，符合现代汉语习惯。
- source_word: גִּדַּל
  choice: 使……尊大
  rationale: 该词的强化词干在此有使动意义，表示雅威使约书亚在众民心目中获得崇高地位；“使……尊大”既保留使动结构，也符合庄重经文语体。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文四字神名作音译，保留其作为以色列之神专名的性质，不以称号替代。
- source_word: בְּעֵינֵי כָּל יִשְׂרָאֵל
  choice: 在全以色列眼中
  rationale: 保留希伯来文“在……眼中”的意象，同时自然表达全体以色列人对约书亚的看法与评价。
- source_word: וַיִּירְאוּ אֹתוֹ
  choice: 他们敬畏他
  rationale: ירא 可涵盖害怕、畏惧、敬畏与尊崇；此处关乎领袖权威并与摩西平行，“敬畏”能保留畏惧与尊崇交织的语义。
- source_word: כַּאֲשֶׁר
  choice: 正如……一样
  rationale: 明确传达约书亚与摩西之间的紧密比较关系。
- source_word: כָּל יְמֵי חַיָּיו
  choice: 在摩西一生的年日里
  rationale: 保留“一生的年日”这一希伯来表达的范围与庄重节奏；代词按最近先行词及上下文指向摩西。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文使用神的专名；“雅威”较直接反映学界通常重构的读音，并避免用“主”等称号替代专名。
- issue: 以色列人对约书亚的 ירא
  choice: 敬畏他
  alternative: 惧怕他／对他心存敬畏
  rationale: 上下文既涉及约书亚由神确立的权威，也刻意与百姓对摩西的态度平行；“敬畏”不把该词限缩为恐惧或单纯尊敬。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“在全以色列眼中”保留原文意象；“尊大”与“一生的年日”略具经文庄重感，但在现代汉语中仍清楚可懂。
