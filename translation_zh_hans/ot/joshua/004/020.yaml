  text: 约书亚把这十二块从约旦河取来的石头立在吉甲。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאֵת
  choice: （不单独译出）
  rationale: וְ承接上文；宾语标记אֵת在现代汉语中没有直接对应形式。汉语叙事无需机械加入“于是”或“并且”，句间关系仍然清楚。
- source_word: שְׁתֵּים עֶשְׂרֵה הָאֲבָנִים הָאֵלֶּה
  choice: 那十二块石头
  rationale: 数词译作“十二”，石头用量词“块”；הָאֵלֶּה指向前文已经提到的石头，现代汉语在回指时用“那”比“这些”更自然。
- source_word: אֲשֶׁר לָקְחוּ
  choice: 他们……取来的
  rationale: 以汉语定语结构表达关系从句，并用“取来的”明确取石发生在立石之前；原文主语仅为复数“他们”，不额外明确其身份。
- source_word: מִן הַיַּרְדֵּן
  choice: 从约旦河
  rationale: מִן表示来源；“约旦河”是现代汉语中清楚、通行的地名形式。
- source_word: הֵקִים
  choice: 立
  rationale: 该词在此指把纪念石安置、竖立起来。“立”简洁自然，也符合石头作为纪念物的语境。
- source_word: יְהוֹשֻׁעַ
  choice: 约书亚
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: בַּגִּלְגָּל
  choice: 在吉甲
  rationale: 介词בְּ在此表示地点；“吉甲”采用通行地名译法。
