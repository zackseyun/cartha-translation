base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/023.yaml
  text: For Yahweh your God dried up the waters of the Jordan before you until you crossed over[a], just as Yahweh your God did to the Sea of Reeds, which he dried up before us until we crossed over.
translation:
  language: zh_hans
  text: 因为雅威你们的上帝使约旦河的水在你们面前干涸，直到你们过去，正如雅威你们的上帝使芦苇海[a]在我们面前干涸，直到我们过去一样。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 传统译作“红海”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹבִישׁ
  choice: 使……干涸
  rationale: 这是 יבש 的使役形，表示使水干涸，以便人通过；两处采用相同译法，以保留原文的重复。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文直接音译上帝的专名，不以称号替代。
- source_word: אֱלֹהֵיכֶם
  choice: 你们的上帝
  rationale: 与雅威这一专名连用，明确指以色列的上帝；复数后缀译为“你们的”。
- source_word: מֵי הַיַּרְדֵּן
  choice: 约旦河的水
  rationale: 自然地保留原文“约旦的水”这一具体意象，并在中文中补出“河”以明确地名所指。
- source_word: מִפְּנֵיכֶם / מִפָּנֵינוּ
  choice: 在你们面前 / 在我们面前
  rationale: 既表达原文的空间含义，也保留人称由第二人称复数转为第一人称复数的对照。
- source_word: עַד עָבְרְכֶם / עַד עָבְרֵנוּ
  choice: 直到你们过了河 / 直到我们过了海
  rationale: 表达动作持续到渡越完成；按中文习惯分别补出“河”和“海”，同时保留两句的平行结构。
- source_word: כַּאֲשֶׁר עָשָׂה
  choice: 正如……所做的
  rationale: 清楚呈现约旦河事件与先前过海事件之间的明确类比。
- source_word: יַם סוּף
  choice: 芦苇海
  rationale: סוּף 通常指芦苇或水草；主文依原文词义译为“芦苇海”，传统名称另见脚注。
theological_decisions:
- issue: 如何翻译神名 יְהוָה
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名；音译“雅威”保留其作为专名的性质，避免以称号替代。
- issue: 如何翻译 יַם סוּף
  choice: 芦苇海
  alternative: 红海
  rationale: 主文按希伯来语 סוּף 的通常词义直译，同时用脚注保留读者熟悉的传统译名；不进一步断定其具体地理位置。
- issue: “我们”与出埃及世代的关系
  choice: 保留“我们”
  alternative: 他们；我们的祖先
  rationale: 原文使用第一人称复数 מִפָּנֵינוּ、עָבְרֵנוּ。译文不将其改写为第三人称，也不替原文解释说话者与出埃及世代之间的关系。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“使……干涸”保留使役含义与两处重复；“你们”与“我们”的转换严格照原文呈现。脚注标记紧接“芦苇海”，使其所注释的词语清楚明确。
