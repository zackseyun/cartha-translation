base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/009.yaml
  text: And Joshua set up twelve stones in the midst of the Jordan[a], under the place where the feet of the priests carrying the ark of the covenant stood, and they are there to this day.
translation:
  language: zh_hans
  text: 约书亚在约旦河中立了十二块石头，在抬着约柜的祭司双脚站立之处下方[a]；这些石头直到今日还在那里。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在抬着约柜的祭司双脚立足处之下。”希伯来语的表达十分具体，指祭司抬着约柜站立的地点及其下方。
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵקִים
  choice: 立了
  rationale: 使役形在此表示把石头立起、设立；“立了”自然简洁，也符合纪念石的语境。
- source_word: בְּתוֹךְ הַיַּרְדֵּן
  choice: 在约旦河中
  rationale: תּוֹךְ 表示内部或中间；“河中”准确保留空间含义，同时比“约旦河中央”更自然，且不额外断定精确的中心位置。
- source_word: תַּחַת מַצַּב רַגְלֵי
  choice: 就在……双脚站立的地方
  rationale: מַצָּב 指站立的位置或立足处。希伯来语直译近于“在双脚立足处之下”，中文正文采用自然表达，并以脚注保留其较字面的空间措辞。
- source_word: נֹשְׂאֵי אֲרוֹן הַבְּרִית
  choice: 抬约柜的
  rationale: 分词描述祭司是抬约柜的人；“抬”符合多人肩负搬运圣物的具体场景。
- source_word: וַיִּהְיוּ שָׁם
  choice: 那些石头……还在那里
  rationale: 结合“直到今日”，表示从立石时延续到叙述者当时的状态；补出“那些石头”使中文指代清楚。
- source_word: עַד הַיּוֹם הַזֶּה
  choice: 直到今日
  rationale: 这是希伯来叙事中表示某种状态延续到叙述者时代的惯用语；“今日”指叙述者的当时，并非现代读者所在的时代。
theological_decisions:
- issue: 本节与上下文中在吉甲立十二块石头之间的叙事张力
  choice: 按希伯来文本直译为约书亚在约旦河中另立十二块石头
  alternative: 把本节理解为概述从河中取出、后来立在别处的十二块石头，或协调、修订文本以只保留一组石头
  rationale: 希伯来文本明确说约书亚在约旦河中立了十二块石头。译文应保留这一陈述及其与上下文的张力，不在翻译中暗自协调。
- issue: עַד הַיּוֹם הַזֶּה 的时间指向
  choice: 译为“直到今日还在那里”，表达从叙述者视角持续至其当时
  alternative: 译成单纯过去状态，或理解为直到现代读者的今日仍然存在
  rationale: 该公式表达持续到叙述者所处时代，不应扩张成关于现代可见性的断言。
translation_notes:
  register: 采用现代、庄重而清楚的叙事文体。“约柜”承接本章已明确的“约的柜”所指；“又”体现句首连接词的叙事推进。正文避免生硬直译“在双脚立足处之下”，但用脚注保留希伯来语的字面空间关系。
