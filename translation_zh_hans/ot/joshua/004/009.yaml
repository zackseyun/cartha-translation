revisions:
- from: 约书亚又在约旦河中立了十二块石头[a]，就在抬约柜的祭司双脚站立的地方；那些石头直到今日还在那里。
  to: 约书亚在约旦河中立了十二块石头，在抬着约柜的祭司双脚站立之处下方[a]；这些石头直到今日还在那里。
  rationale: 修订恢复תַּחַת所表达的“下方”空间关系，并删除不受原文连接词本身要求的“又”。“直到今日还在那里”保留叙述者视角的持续状态，不断言石头在现代仍可见。
  reviewer_model: gpt-5.6-terra
