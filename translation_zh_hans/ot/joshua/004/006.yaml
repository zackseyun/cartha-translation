base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/006.yaml
  text: so that this may be a sign among you[a]. When your children ask in time to come, saying[c][b], ‘What do these stones mean to you?’
translation:
  language: zh_hans
  text: 好让这在你们中间成为一个记号。日后[b]，你们的儿女[a]问：“这些石头对你们有什么意义？”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“你们的儿子们”；这里代表下一代，故译作“儿女”。
    reason: lexical_alternative
  - marker: b
    text: “日后”所译的希伯来词字面为“明天”，在这里可惯用地指将来的时候。
    reason: lexical_alternative
  - marker: c
    text: 或较直译：“这些石头对你们是什么？”
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן
  choice: 好让
  rationale: 引出目的或预期结果；“好让”在现代汉语中自然地保留了目的意味。
- source_word: תִּהְיֶה זֹאת אוֹת
  choice: 这……作一个记号
  rationale: 直译核心结构“这要成为记号”；“作一个记号”简洁庄重，也不把上下文中的纪念功能预先加入 אוֹת。
- source_word: בְּקִרְבְּכֶם
  choice: 在你们中间
  rationale: 指这个记号处于群体之中；保留原文的共同体空间意味。
- source_word: כִּי יִשְׁאָלוּן
  choice: ……问道
  rationale: כִּי 在这里引出预期会发生的情形；汉语以“日后……问道”自然表达，无须另译连接词。
- source_word: בְּנֵיכֶם
  choice: 你们的儿女
  rationale: 字面为“你们的儿子们”，在本段传承记号的语境中代表下一代；“儿女”既自然又不造成仅限男性的误解。
- source_word: מָחָר
  choice: 日后
  rationale: 该词字面是“明天”，此处惯用地指将来的某个时候；“日后”准确表达语境中的未来时间。
- source_word: לֵאמֹר
  choice: 问道
  rationale: 这是引出直接引语的常用说话形式；与 שאל 合译为“问道”，避免汉语中累赘的“问说”。
- source_word: מָה הָאֲבָנִים הָאֵלֶּה לָכֶם
  choice: 这些石头对你们有什么意义？
  rationale: 原文形式近于“这些石头对你们是什么？”实际询问其意义；所选译法是自然汉语，同时以脚注保留较字面的表达。
theological_decisions:
- issue: בְּנֵיכֶם 的性别范围
  choice: 你们的儿女
  alternative: 你们的儿子们
  rationale: 阳性复数名词在此语境中代表会询问纪念石意义的下一代。译为“儿女”传达所指范围，不加入仅限男性的神学判断。
- issue: 石头问题所询问的内容
  choice: 这些石头对你们有什么意义？
  alternative: 这些石头对你们是什么？
  rationale: 原文保留简练而略含歧义的“对你们是什么”结构，语境表明孩子询问这些石头与群体的关系和意义；正文采用自然问法，脚注保存形式上的直译。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“好让”承接上文的目的关系；以两句呈现，使中文流畅，同时没有把原文的目的与未来询问之间割裂。脚注标记均紧邻其所说明的词句。
