  text: וַ/יֹּ֤אמֶר לָ/הֶם֙ יְהוֹשֻׁ֔עַ עִ֠בְרוּ לִ/פְנֵ֨י אֲר֧וֹן יְהוָ֛ה אֱלֹֽהֵי/כֶ֖ם אֶל תּ֣וֹךְ הַ/יַּרְדֵּ֑ן וְ/הָרִ֨ימוּ לָ/כֶ֜ם אִ֣ישׁ אֶ֤בֶן אַחַת֙ עַל שִׁכְמ֔/וֹ לְ/מִסְפַּ֖ר שִׁבְטֵ֥י בְנֵי יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/005.yaml
  text: And Joshua said to them[a], “Cross over before the ark of Yahweh your God into the middle of the Jordan, and let each man lift up one stone on his shoulder, according to the number of the tribes of the sons of Israel.”
translation:
  language: zh_hans
  text: 约书亚对他们说：“你们要从雅威你们上帝的约柜前面走过去，进入约旦河中间。你们每人都要照以色列子孙[a]各支派的数目，把一块石头扛在肩上。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“以色列的众子”，是原文对以色列群体的正式称呼；也可译作“以色列人”。
    reason: 说明希伯来语正式群体称谓，并提供自然汉语替代译法。
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: 以自然的现代汉语叙事承接上下文；无需机械译出希伯来语连续叙事形式中的连接词。
- source_word: עִבְרוּ לִפְנֵי
  choice: 从……前面走过去
  rationale: 保留 עבר 的经过、越过之意，也保留 לִפְנֵי 相对于约柜的空间位置，避免将其弱化为单纯“走到前面”。
- source_word: אֲרוֹן יְהוָה אֱלֹהֵיכֶם
  choice: 雅威你们上帝的约柜
  rationale: 直译所属结构，并以“雅威”音译神的专名 יְהוָה。
- source_word: אֶל תּוֹךְ הַיַּרְדֵּן
  choice: 进入约旦河中间
  rationale: תּוֹךְ 指内部或中间；译文明确保留河流中央这一空间含义。
- source_word: וְהָרִימוּ לָכֶם אִישׁ
  choice: 你们每人都要……扛
  rationale: 用分配式表达体现 אִישׁ 的“各人”作用；结合石头放在肩上的语境，以“扛”自然表达举起并负载。
- source_word: אֶבֶן אַחַת עַל שִׁכְמוֹ
  choice: 把一块石头扛在肩上
  rationale: 保留“一块”和单数“肩上”的对应关系，同时符合现代汉语习惯。
- source_word: לְמִסְפַּר שִׁבְטֵי בְנֵי יִשְׂרָאֵל
  choice: 照以色列子孙支派的数目
  rationale: “照……的数目”表达石头数与支派数相对应；正文保留 בְנֵי יִשְׂרָאֵל 的正式群体称谓。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名；以“雅威”音译，保留其作为立约之神专名的性质，而不改作称号。
- issue: בְנֵי יִשְׂרָאֵל 的群体称谓
  choice: 以色列子孙
  alternative: 以色列人
  rationale: 保留原文“以色列之子”的正式传统表达，不把它直接简化为一般民族称谓；脚注说明自然汉语替代译法。
- issue: אִישׁ 的性别与分配含义
  choice: 每人
  alternative: 每个男人
  rationale: 本节语法重点是每个支派代表各取一块石头的分配关系；中文“每人”自然涵盖上下文已指定的十二名男子，并不改变其历史所指。
translation_notes:
  register: 采用庄重而通顺的现代标准普通话。“从……前面走过去”保留相对于约柜的空间关系；“扛在肩上”比机械的“举在肩上”更符合中文动作表达。脚注标记置于其实际解释的“以色列子孙”之后。
