base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/002.yaml
  text: Take for yourselves from the people twelve men[a], one man from each tribe.
translation:
  language: zh_hans
  text: “你们要从百姓中选取十二名男子[a]，每个支派一人。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语后半句重复说“一个人、一个人，从一个支派”，以表达逐一分配的意思。
    reason: 说明原文重复的分配式表达；“十二名男子”已在正文译出，故无需重复说明其男性所指。
lexical_decisions:
- source_word: קְחוּ לָכֶם
  choice: 你们要……选
  rationale: קְחוּ是לקח的复数命令式，基本义为“取、拿”；在此以人为宾语并用于指定代表，现代汉语用“选”最自然，也不超出上下文含义。לָכֶם的受益或反身意味由“你们”及语境自然承载，无需生硬译作“为你们自己”。
- source_word: מִן הָעָם
  choice: 从百姓中
  rationale: מִן表示从某一群体之中选取；“从百姓中”准确传达来源范围。הָעָם在此指以色列百姓。
- source_word: שְׁנֵים עָשָׂר אֲנָשִׁים
  choice: 十二个人
  rationale: אֲנָשִׁים在此明确指被选作支派代表的男子；汉语“十二个人”自然通顺，后文“一人”也保持一致。性别信息可由原文背景和脚注说明，避免正文使用不自然的“十二名男人”。
- source_word: אִישׁ אֶחָד אִישׁ אֶחָד
  choice: 每……一人
  rationale: 希伯来文以重复表达逐一分配之意；现代汉语用“每支派一人”准确而自然地呈现这一分配结构。
- source_word: מִשָּׁבֶט
  choice: 支派
  rationale: שֵׁבֶט在本段指以色列的十二支派；“支派”是中文圣经语境中准确且通行的称呼。
