  text: 于是，约书亚吩咐祭司说：“从约旦河里上来。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְצַו
  choice: 于是……吩咐
  rationale: צוה表示有权威地发出命令；“吩咐”在现代汉语叙事中自然且保留权威意味。句首“于是”体现叙事连续关系。
- source_word: יְהוֹשֻׁעַ
  choice: 约书亚
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: אֶת הַכֹּהֲנִים
  choice: 祭司
  rationale: 原文为带定冠词的直接宾语；汉语在上下文对象明确时不必另加“这些”或“众”。
- source_word: לֵאמֹר
  choice: 说
  rationale: 此不定式用于引出直接引语，译作“说”简洁自然。
- source_word: עֲלוּ
  choice: 上来
  rationale: עלה表示向上移动；结合祭司站在河中的场景，“上来”自然表达他们从河床登上岸，也保留朝说话者所在方向移动的语感。
- source_word: מִן הַיַּרְדֵּן
  choice: 从约旦河里
  rationale: מן在此表示从内部出来；加“里”明确祭司原在河中，“约旦河”则比单说“约旦”更符合现代普通读者的地名习惯。
