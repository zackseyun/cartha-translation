  text: כְּ/אַרְבָּעִ֥ים אֶ֖לֶף חֲלוּצֵ֣י הַ/צָּבָ֑א עָבְר֞וּ לִ/פְנֵ֤י יְהוָה֙ לַ/מִּלְחָמָ֔ה אֶ֖ל עַֽרְב֥וֹת יְרִיחֽוֹ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/013.yaml
  text: About forty thousand armed for war crossed over before Yahweh for battle[a], to the plains of Jericho.
translation:
  language: zh_hans
  text: 约有四万名全副武装的军兵，在雅威面前过了河，前往耶利哥平原作战。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כְּאַרְבָּעִים אֶלֶף
  choice: 约有四万名
  rationale: 数词前的כְּ表示约数；“约有四万名”既保留“约”的语义，也符合现代汉语表达。
- source_word: חֲלוּצֵי הַצָּבָא
  choice: 全副武装的军兵
  rationale: 该短语指已装备好、可投入战斗的军人；此译法表达其战备状态，同时不额外断定他们是先锋部队。
- source_word: עָבְרוּ
  choice: 过了河
  rationale: 本段叙事明确是在过约旦河；汉语补出“河”可自然承接上下文，却没有增添新的地点信息。
- source_word: לִפְנֵי יְהוָה
  choice: 在雅威面前
  rationale: 直译并保留“在……面前／在……临在中”的空间及神学意味，不将其收窄为单纯的带领或观看。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见音译呈现四字神名，保留原文所用的立约之名。
- source_word: לַמִּלְחָמָה
  choice: 作战
  rationale: 介词לְ表达目的；“作战”在此比“战争”更自然，也贴合即将投入军事行动的语境。
- source_word: אֶל עַרְבוֹת יְרִיחוֹ
  choice: 前往耶利哥平原
  rationale: עַרְבוֹת指约旦河谷一带的平原或旷野地带；“耶利哥平原”清楚自然，而“前往”体现אֶל的方向意义。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；采用“雅威”可明确呈现专名，而不是以“主”等称号替代。
- issue: לִפְנֵי יְהוָה的含义
  choice: 在雅威面前
  alternative: 在雅威的带领下
  rationale: 原文可以表达处于雅威面前或临在之中；直译保留这种神学张力，避免擅自限定为军事带领。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“全副武装的军兵”适合叙事语体，并避免使用较专业的“先锋队”；句序略作汉语化处理，但保留人数、战备状态、在雅威面前过河、目的地及作战目的等全部信息。
