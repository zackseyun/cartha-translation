source:
  edition: WLC
  text: וַ/יַּעֲשׂוּ כֵ֣ן בְּנֵי יִשְׂרָאֵ֘ל כַּ/אֲשֶׁ֣ר צִוָּ֣ה יְהוֹשֻׁעַ֒ וַ/יִּשְׂא֡וּ שְׁתֵּֽי עֶשְׂרֵ֨ה אֲבָנִ֜ים מִ/תּ֣וֹךְ הַ/יַּרְדֵּ֗ן כַּ/אֲשֶׁ֨ר דִּבֶּ֤ר יְהוָה֙ אֶל יְהוֹשֻׁ֔עַ לְ/מִסְפַּ֖ר שִׁבְטֵ֣י בְנֵֽי יִשְׂרָאֵ֑ל וַ/יַּעֲבִר֤וּ/ם עִמָּ/ם֙ אֶל הַ/מָּל֔וֹן וַ/יַּנִּח֖וּ/ם שָֽׁם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/008.yaml
  text: And the sons of Israel did so[a], just as Joshua had commanded, and they carried twelve stones from the midst of the Jordan, just as Yahweh had spoken to Joshua, according to the number of the tribes of the sons of Israel[c][b]; and they brought them over with them to the lodging place and set them down there.
translation:
  language: zh_hans
  text: 以色列人就照约书亚所吩咐的做了。他们按照以色列支派的数目，从约旦河中取了十二块石头，正如雅威对约书亚所说的；又把石头随身带到住宿的地方，放在那里。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 希伯来语直译为“以色列的众子”，在现代汉语叙事中，“以色列人”自然、准确，也不把原文所指群体误限于男性。
- source_word: וַיַּעֲשׂוּ כֵן
  choice: 就……做了
  rationale: 自然表达依命行事，并保留叙事推进关系。
- source_word: צִוָּה
  choice: 所吩咐的
  rationale: 表达带权威的命令或指示，符合约书亚在本段中的角色。
- source_word: וַיִּשְׂאוּ
  choice: 取了
  rationale: 此处动作包含拿起并携带石头；结合后文“带到”，译作“取了”可避免重复，同时保留动作起点。
- source_word: מִתּוֹךְ הַיַּרְדֵּן
  choice: 从约旦河中
  rationale: 保留 תּוֹךְ 的空间含义，又比“从约旦河中央”更自然，且不额外断定具体位置。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以常见的现代汉语音译直接呈现四字神名，不以称号替代专名。
- source_word: לְמִסְפַּר שִׁבְטֵי בְנֵי יִשְׂרָאֵל
  choice: 按照以色列支派的数目
  rationale: 清楚表达十二块石头与以色列各支派数量相对应；汉语无需重复“以色列人之子”的族称结构。
- source_word: וַיַּעֲבִרוּם עִמָּם
  choice: 又把石头随身带到
  rationale: 使代词所指明确，并自然表达他们过河时把石头一同带过去的意思。
- source_word: הַמָּלוֹן
  choice: 住宿的地方
  rationale: 该词指停宿、过夜之处；这一译法比泛称“营地”更具体，同时保持自然易懂。
- source_word: וַיַּנִּיחוּם שָׁם
  choice: 放在那里
  rationale: 直接表达把所携石头安放于该处，简洁符合现代汉语。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文使用四字神名而非“主”的称号；“雅威”较直接反映学界通常重构的读音，同时承认“耶和华”是汉语传统中的常见形式。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。按汉语习惯将“以色列的众子”译为“以色列人”，避免生硬直译；保留命令、支派数目、河中取石、携至过夜处并放下等叙事要素。原文此节没有必须借脚注保留的文本歧义，因此不设脚注。
