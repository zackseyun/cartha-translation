source:
  edition: WLC
  text: וְ/הַ/כֹּהֲנִ֞ים נֹשְׂאֵ֣י הָ/אָר֗וֹן עֹמְדִים֮ בְּ/ת֣וֹךְ הַ/יַּרְדֵּן֒ עַ֣ד תֹּ֣ם כָּֽל הַ֠/דָּבָר אֲשֶׁר צִוָּ֨ה יְהוָ֤ה אֶת יְהוֹשֻׁ֨עַ֙ לְ/דַבֵּ֣ר אֶל הָ/עָ֔ם כְּ/כֹ֛ל אֲשֶׁר צִוָּ֥ה מֹשֶׁ֖ה אֶת יְהוֹשֻׁ֑עַ וַ/יְמַהֲר֥וּ הָ/עָ֖ם וַֽ/יַּעֲבֹֽרוּ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/010.yaml
  text: And the priests carrying the ark stood in the midst of the Jordan until everything was finished that Yahweh had commanded Joshua to speak to the people[a], according to all that Moses had commanded Joshua. And the people hurried and crossed over.
translation:
  language: zh_hans
  text: 抬约柜的祭司一直站在约旦河中，直到耶和华吩咐约书亚向百姓说的一切话都说完了[a]；这一切都照着摩西吩咐约书亚的一切。百姓急忙过了河。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译可作“直到整件事都完成了”；“事”也可概括耶和华吩咐约书亚向百姓说的一切内容。
    reason: 保留 דָּבָר 可指“话语、事情、事项”的语义宽度，同时不把其范围限定为纯言语或纯行动。
lexical_decisions:
- source_word: הַכֹּהֲנִים נֹשְׂאֵי הָאָרוֹן
  choice: 抬约柜的祭司
  rationale: 分词短语描述祭司正在承担的动作；“抬约柜”自然、具体，也符合本段叙事语境。
- source_word: עֹמְדִים בְּתוֹךְ הַיַּרְדֵּן
  choice: 一直站在约旦河中
  rationale: “站”保留姿态，“一直”体现分词的持续性；בְּתוֹךְ 表示在河中、河道之内。
- source_word: עַד תֹּם כָּל הַדָּבָר
  choice: 直到……一切话都说完了
  rationale: דָּבָר 可指“话”或“事情”；后接“吩咐约书亚对百姓说”，此处以“一切话”衔接更自然，同时用脚注保留较宽泛的原文字面。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经传统中广为人知的专名形式，明确呈现四字神名，而不以称号替代。
- source_word: לְדַבֵּר אֶל הָעָם
  choice: 对百姓说
  rationale: 直接保留“向百姓说话”的言语行为，不额外限定为宣告、教导或转告。
- source_word: כְּכֹל אֲשֶׁר צִוָּה מֹשֶׁה אֶת יְהוֹשֻׁעַ
  choice: 全都照着摩西吩咐约书亚的
  rationale: 保留 כְּכֹל 所表达的全面遵照关系，并使用自然的现代汉语结构。
- source_word: וַיְמַהֲרוּ הָעָם וַיַּעֲבֹרוּ
  choice: 百姓赶紧过了河
  rationale: “赶紧”准确表达动作急速；“过了河”依据上下文明确过的是约旦河，中文表达简洁自然。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。译作“耶和华”保留其专名性质，且最便于普通现代中文读者识别；不改译为“主”，以免把专名化为称号。
- issue: “一切话/整件事”所指范围
  choice: 正文依直接语法关系译为“一切话都说完了”
  alternative: 直到整件事都办完了
  rationale: דָּבָר 本身兼有“话、事情”之义，而 לְדַבֵּר אֶל הָעָם 紧随其后，支持言语层面的理解；脚注注明宽泛字面义，避免排除它概括全部受命事项的可能。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“一直站在”体现持续状态；末句用“赶紧过了河”保持叙事的速度感。正文含有与脚注对应的[a]标记。
