  text: So Joshua called the twelve men whom he had appointed from the sons of Israel[b][a], one man from each tribe.
translation:
  language: zh_hans
  text: 于是，约书亚把他从以色列人中选定[a]的十二个人召来，每支派一人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “选定”也可译为“预备”或“指定”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא ... אֶל
  choice: 召来
  rationale: קרא与אֶל连用表示把人叫到跟前；“召来”自然表达这一动作，又不赋予“召集”或正式传唤等过强语气。
- source_word: שְׁנֵים הֶעָשָׂר אִישׁ
  choice: 十二个人
  rationale: 所指是上文已经提到的特定十二人；汉语不需另加冠词即可由语境体现确定性。
- source_word: אֲשֶׁר הֵכִין
  choice: 选定
  rationale: הֵכִין本义范围包括预备、使就绪，也可在此语境中指预先指定。结合3:12，这十二人是从各支派中选出的代表，因此“选定”最清楚自然；脚注保留“预备好”的词义可能。
- source_word: מִבְּנֵי יִשְׂרָאֵל
  choice: 从以色列人中
  rationale: בְּנֵי יִשְׂרָאֵל字面为“以色列的众子”，在此是以色列民的惯用族群称谓；现代汉语用“以色列人”准确且自然。
- source_word: אִישׁ אֶחָד אִישׁ אֶחָד מִשָּׁבֶט
  choice: 每支派一人
  rationale: 希伯来语以重复“一人、一人”表达逐一分配；“每支派一人”保留其代表性和分配关系，符合现代汉语习惯。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“于是”承接叙事流程；句序基本保持原文，且将重复分配结构自然表达为“每支派一人”。
