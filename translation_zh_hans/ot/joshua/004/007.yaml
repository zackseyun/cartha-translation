reference: Joshua 4:7
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/אֲמַרְתֶּ֣ם לָ/הֶ֗ם אֲשֶׁ֨ר נִכְרְת֜וּ מֵימֵ֤י הַ/יַּרְדֵּן֙ מִ/פְּנֵי֙ אֲר֣וֹן בְּרִית יְהוָ֔ה בְּ/עָבְר/וֹ֙ בַּ/יַּרְדֵּ֔ן נִכְרְת֖וּ מֵ֣י הַ/יַּרְדֵּ֑ן וְ֠/הָיוּ הָ/אֲבָנִ֨ים הָ/אֵ֧לֶּה לְ/זִכָּר֛וֹן לִ/בְנֵ֥י יִשְׂרָאֵ֖ל עַד עוֹלָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/007.yaml
  text: then you shall say to them[a], ‘The waters of the Jordan were cut off before the ark of the covenant of Yahweh. When it crossed over the Jordan, the waters of the Jordan were cut off.’ And these stones shall be a memorial to the sons of Israel forever.
translation:
  language: zh_hans
  text: 你们就要告诉他们：‘约旦河的水在雅威的约柜前断绝了；约柜过约旦河时，约旦河的水就断绝了。’这些石头要永远作以色列子孙[a]的纪念物。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“以色列人”。希伯来文直译为“以色列的众子”。
    reason: 说明原文亲缘式群体称谓，并提供自然汉语的词汇替代译法。
lexical_decisions:
- source_word: נִכְרְתוּ
  choice: 断绝了
  rationale: 此处 כרת 的尼法勒形描述河水被截断、停止流动；“断绝了”既保留原文意象，也符合现代汉语表达，并呈现原文两次重复。
- source_word: מֵימֵי / מֵי הַיַּרְדֵּן
  choice: 约旦河的水
  rationale: 将希伯来语复数形式按自然汉语译为“水”，指约旦河的水流。
- source_word: מִפְּנֵי
  choice: 在……前
  rationale: 保留方位含义，表示河水在约柜面前被截断，不额外解释其神学机制。
- source_word: אֲרוֹן בְּרִית יְהוָה
  choice: 雅威的约柜
  rationale: “约柜”是现代中文圣经语境中对“约的柜”的自然、准确表达；所属关系与神名均予保留。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语音译呈现四字神名，保留其作为以色列之上帝专名的性质，而不以称号替代。
- source_word: בְּעָבְרוֹ
  choice: 约柜过……时
  rationale: 第三人称阳性单数后缀回指阳性名词“约柜”；汉语明确补出“约柜”，可避免代词指向含混，同时“过约旦河”自然表达渡河动作。
- source_word: לְזִכָּרוֹן
  choice: 作……的纪念物
  rationale: 这里指作为长久纪念的实体标志；“纪念物”比抽象的“纪念”更贴合石头的功能。
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: 以色列子孙
  rationale: 保留 בְּנֵי 的亲缘表达及群体称谓；脚注列出更通顺的群体性译法。
- source_word: עַד עוֹלָם
  choice: 永远
  rationale: 简洁表达该时间习语所指的持续、长久效力。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”按较通行的学术重构音译，既保留专名性质，也不以“主”等称号取代。
- issue: לִבְנֵי יִשְׂרָאֵל 的群体称谓
  choice: 以色列子孙
  alternative: 以色列人
  rationale: 正文保留原文“以色列的众子/子孙”的形式与传统群体含义；脚注提供自然汉语中的等值说法，避免把该短语误解为仅指雅各的直接儿子。
- issue: 石头作为 זִכָּרוֹן 的含义
  choice: 纪念物
  alternative: 记号
  rationale: 原词强调使人记念的纪念物，而非泛指神迹的“记号”；因此不将两种相关但不同的概念合并。
translation_notes:
  register: 采用庄重而明白的现代标准汉语。保留“约旦河的水……断绝了”的重复，以反映希伯来文的修辞结构；第二次明确补出“约柜”，使中文指代清楚。神名译作“雅威”，全文不加入原文没有的解释。
