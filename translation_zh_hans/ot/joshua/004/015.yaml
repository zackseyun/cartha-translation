lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: 该叙事形式承接并推进上下文；现代汉语通常不必把连接成分另译为“然后”或“于是”，以免增加原文未强调的时间意味。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的专名形式来对应四字神名，而不以“主”这一称号替代。
- source_word: אֶל
  choice: 对
  rationale: 在“对某人说”的结构中，用“对”自然准确地标明说话的对象。
- source_word: יְהוֹשֻׁעַ
  choice: 约书亚
  rationale: 采用该人名在现代简体中文圣经传统中的通行译名。
- source_word: לֵאמֹר
  choice: 冒号
  rationale: 该词引出下一节的直接话语；中文以冒号自然地表达其篇章功能，避免生硬地译作“说”。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威；主
  rationale: 原文使用神的专名。译作“耶和华”既保留专名性质，也符合现代中文圣经读者最熟悉的称呼；不以称号“主”替换。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。冒号承接下一节的直接引语；脚注保留原文 לֵאמֹר 的明示形式。
