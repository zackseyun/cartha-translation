base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/021.yaml
  text: And he said to the sons of Israel[a], “When your children ask their fathers in time to come, saying[c][b], ‘What are these stones?’”
translation:
  language: zh_hans
  text: 于是他对以色列人说：“当日后[b]你们的儿女[a]问他们的父亲说：‘这些石头是什么[c]？’时，”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“你们的儿子”；这里很可能泛指你们的儿女或后代。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译为“明天”，这里按惯用法指将来的时候或后来的世代。
    reason: lexical_alternative
  - marker: c
    text: 也可按含义译作“这些石头是什么意思？”希伯来文较直译为“这些石头是什么？”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 他又……说
  rationale: 以“又”承接希伯来叙事中的连续式动词；保留原文第三人称主语，不在本节擅自补出姓名。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 这是现代汉语对该族群称谓最自然、准确的表达；直译“以色列的众子”容易被误解为仅指男性或雅各的亲生儿子。
- source_word: אֲשֶׁר יִשְׁאָלוּן
  choice: ……问……
  rationale: אֲשֶׁר在此引出将来的情境，汉语可借“日后”自然表达，无须另译关系词；שאל取常用义“问”。
- source_word: בְּנֵיכֶם
  choice: 你们的儿女
  rationale: 字面为“你们的儿子”，但在此家族传承的语境中可泛指后代儿女；脚注保留字面信息。
- source_word: מָחָר
  choice: 日后
  rationale: מָחָר字面为“明天”，此处按惯用法指未来某时或后来世代；“日后”简洁自然。
- source_word: אֶת אֲבוֹתָם
  choice: 他们的父亲
  rationale: 保留אָבוֹת在当前家庭问答场景中的直接意义，不扩大译作“祖先”。
- source_word: לֵאמֹר
  choice: 以冒号和引号引出话语
  rationale: 两处לֵאמֹר均为引语标记；现代汉语用标点引出直接引语，比重复“说”更自然。
- source_word: מָה הָאֲבָנִים הָאֵלֶּה
  choice: 这些石头是什么
  rationale: 保留原文识别式问句的形式及其含义张力，不在正文中直接解释为“有什么意义”或“有什么用”。
