base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/001.yaml
  text: And it happened[a], when all the nation had finished crossing the Jordan, that Yahweh said to Joshua,
translation:
  language: zh_hans
  text: 全体百姓都渡过约旦河后，耶和华对约书亚说：
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: ……以后
  rationale: 希伯来叙事衔接语与时间从句共同引出后续事件。现代汉语无需机械译出“事情发生了”；用“以后”自然表达渡河完成在先、耶和华说话在后。
- source_word: תַּמּוּ
  choice: 渡完
  rationale: תמם表示完成；“渡完”简洁自然，并与不定式לַעֲבוֹר合译。
- source_word: כָל הַגּוֹי
  choice: 全民族
  rationale: גּוֹי在此以单数集合名词指作为整体的以色列民族；“全民族”既保留整体性，也符合现代汉语。
- source_word: לַעֲבוֹר אֶת הַיַּרְדֵּן
  choice: 渡完约旦河
  rationale: עבור在河流语境中自然译为“渡”；中文地名通常称“约旦河”，明确而通顺。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的神圣四字名专名音译，不以称号替代原文专名。
- source_word: וַיֹּאמֶר ... אֶל ... לֵאמֹר
  choice: 对约书亚说：
  rationale: 这是常见的希伯来引语公式；中文以“对……说：”自然引出下一节的直接话语，无需重复译出לֵאמֹר。
- source_word: יְהוֹשֻׁעַ
  choice: 约书亚
  rationale: 采用该人名通行的现代中文圣经译名。
theological_decisions:
- issue: 神圣四字名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用神的专名而非一般称号；正文保留专名性质，并采用现代简体中文圣经传统中辨识度最高的“耶和华”。
- issue: כָל הַגּוֹי所指群体的表达
  choice: 全民族
  alternative: 所有百姓
  rationale: 原文单数集合名词גּוֹי强调以色列作为一个民族整体；“全民族”避免把这种整体意味默默弱化为一般人群。
translation_notes:
  register: 采用庄重、自然的现代标准汉语。以“……以后”重组希伯来语叙事句法，避免生硬的“事情发生了”；句末用冒号承接下一节引语。
