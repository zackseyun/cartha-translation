source:
  edition: WLC
  text: וַ/יְהִ֛י כַּֽ/אֲשֶׁר תַּ֥ם כָּל הָ/עָ֖ם לַֽ/עֲב֑וֹר וַ/יַּעֲבֹ֧ר אֲרוֹן יְהוָ֛ה וְ/הַ/כֹּהֲנִ֖ים לִ/פְנֵ֥י הָ/עָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/011.yaml
  text: And when all the people had finished crossing over[a], the ark of Yahweh and the priests crossed over before the people.
translation:
  language: zh_hans
  text: 全体百姓都渡过了河以后，耶和华的约柜和祭司在百姓前面[a]渡过了河。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“当着百姓的面”。希伯来语这一短语既可指空间位置（“在……前面”），也可指在某人面前或在场。
    reason: 保留 לִפְנֵי הָעָם 的词义歧义。
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: ……以后
  rationale: 这是承接叙事的时间结构。现代汉语无需直译“事情发生了”；用“……以后”自然表达前一动作完成、随后发生主句动作的关系。
- source_word: תַּם כָּל הָעָם לַעֲבוֹר
  choice: 全体百姓都过完河
  rationale: תַּם 表示完成，כָּל 强调整体；“过完河”以自然汉语表达渡河行动已经完成。原文未明说“河”，但上下文明确指约旦河，补出“河”可避免“过完”的汉语残缺感。
- source_word: וַיַּעֲבֹר
  choice: 过了河
  rationale: 与前面的 לַעֲבוֹר 使用同一词根，译文也重复“过……河”，保留原文的词汇呼应。
- source_word: אֲרוֹן יְהוָה
  choice: 耶和华的约柜
  rationale: 构造链直指属于或关联于耶和华的约柜；用“耶和华”呈现四字神名，以现代中文圣经语体中通行且可辨识的形式表达。
- source_word: וְהַכֹּהֲנִים
  choice: 和祭司
  rationale: 保留原文并列结构，不擅自改成“抬约柜的祭司”，以免加入本节没有明说的句法关系。
- source_word: לִפְנֵי הָעָם
  choice: 在百姓前面
  rationale: לִפְנֵי 可表示空间上的“在……前面”，也可表示“在……面前／当着……的面”。正文采用较符合行进场景的空间含义，并以脚注保留另一可能。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。正文采用现代中文读者最熟悉的专名“耶和华”，而不以“主”替代，从而保留这是神专名的性质；“雅威”是较接近学界重构发音的另一译法。
- issue: 约柜与祭司的句法关系
  choice: 保留“约柜和祭司”并列为过河者
  alternative: 译作“抬耶和华约柜的祭司”
  rationale: 希伯来文以连词明确并列“约柜”和“祭司”。虽然上下文说明祭司抬约柜，本文仍不把上下文关系改写成本节未明说的修饰结构。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“全体百姓都”保留整体性的强调；“过完河／过了河”清楚呈现动作先后并保留同根词的重复。脚注标记紧接其所说明的“在百姓前面”。
