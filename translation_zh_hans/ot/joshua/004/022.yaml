translation:
  language: zh_hans
  text: 你们就要告诉你们的儿女：‘以色列人在干地上渡过了这条约旦河。’
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהוֹדַעְתֶּם
  choice: 你们就要告诉
  rationale: ידע的使役式表示“使……知道、告知”。“告诉”是现代汉语中自然清楚的表达；句首连接词依上下文译作“就”，体现指示的承接关系。
- source_word: בְּנֵיכֶם
  choice: 自己的儿女
  rationale: בנים既可专指儿子，也可泛指儿女或子女；在向下一代讲述纪念事件的语境中，“儿女”较自然，同时以脚注保留较窄的可能含义。
- source_word: לֵאמֹר
  choice: 说
  rationale: 这是引出话语内容的常用不定式结构，汉语译作“说”简洁自然。
- source_word: בַּיַּבָּשָׁה
  choice: 在干地上
  rationale: 该词指干地、旱地；“在干地上”准确表达河水退去后可供行走的地面，也保留原文对神迹的强调。
- source_word: עָבַר
  choice: 过了
  rationale: עבר在此带直接宾语“这约旦河”，表示渡过、越过；“过了”符合现代汉语习惯。
- source_word: יִשְׂרָאֵל
  choice: 以色列
  rationale: 这是民族或群体的专名，采用现代中文圣经通行译名。
- source_word: הַיַּרְדֵּן הַזֶּה
  choice: 这约旦河
  rationale: 保留指示词“这”所带来的现场感；中文补出“河”可清楚标明地理实体，且“约旦河”是通行名称。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙述语体。“自己的儿女”避免“你们的儿女”在连续代词中略显生硬；引语末尾用“的”加强陈述和见证语气，但不增添原文未有的神学解释。
