source:
  edition: WLC
  text: וַ֠/יְהִי ב/עלות הַ/כֹּהֲנִ֜ים נֹשְׂאֵ֨י אֲר֤וֹן בְּרִית יְהוָה֙ מִ/תּ֣וֹךְ הַ/יַּרְדֵּ֔ן נִתְּק֗וּ כַּפּוֹת֙ רַגְלֵ֣י הַ/כֹּהֲנִ֔ים אֶ֖ל הֶ/חָרָבָ֑ה וַ/יָּשֻׁ֤בוּ מֵֽי הַ/יַּרְדֵּן֙ לִ/מְקוֹמָ֔/ם וַ/יֵּלְכ֥וּ כִ/תְמוֹל שִׁלְשׁ֖וֹם עַל כָּל גְּדוֹתָֽי/ו־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/018.yaml
  text: And it happened[a], when the priests carrying the ark of the covenant of Yahweh came up from the midst of the Jordan, and the soles of the priests’ feet were lifted up to the dry ground[b], that the waters of the Jordan returned to their place and went as before over all its banks.
translation:
  language: zh_hans
  text: 抬着雅威之约的约柜的祭司从约旦河中上来时，他们的脚掌一踏上干地，约旦河的水就回到原处，像从前一样[a]漫过两岸。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“像昨天和前天一样”，是“像从前一样”的习语。
    reason: 说明希伯来习语的字面形式与正文译法。
lexical_decisions:
- source_word: וַיְהִי בַעֲלוֹת
  choice: ……上来……就……
  rationale: 希伯来语以“事情发生了”配合带介词 ב 的不定式结构引出时间背景。汉语用“……一……就……”自然表达紧接发生的事件，同时保留叙事推进。
- source_word: נֹשְׂאֵי אֲרוֹן בְּרִית יְהוָה
  choice: 抬着雅威约柜的
  rationale: נשׂא 在多人搬运约柜的场景中译为“抬着”比泛称“拿着”更准确；“雅威约柜”自然表达“雅威之约的柜”，即属于雅威之约的约柜。
- source_word: מִתּוֹךְ הַיַּרְדֵּן
  choice: 从约旦河中
  rationale: תוך 指河流内部或中间，不只是河岸；“从约旦河中”准确而自然。
- source_word: נִתְּקוּ כַּפּוֹת רַגְלֵי הַכֹּהֲנִים אֶל הֶחָרָבָה
  choice: 脚掌一踏上干地
  rationale: נתק 在这里描写祭司的脚从河床拔起、移到干地的动作。“一踏上干地”以自然汉语呈现该动作及其与水复流之间的紧密时间关系。
- source_word: וַיָּשֻׁבוּ מֵי הַיַּרְדֵּן לִמְקוֹמָם
  choice: 约旦河的水就回到原处
  rationale: 直译水返回其所在之处，保留希伯来语对河水运动的生动描写。
- source_word: כִתְמוֹל שִׁלְשׁוֹם
  choice: 像从前一样
  rationale: 字面是“像昨天和前天”，在此为表示以往常态的习语；译为“像从前一样”符合现代汉语。
- source_word: עַל כָּל גְּדוֹתָיו
  choice: 漫过两岸
  rationale: 介词 עַל 配合“岸”表示水涨到或越过河岸；中文“漫过两岸”简洁呈现河水恢复原先充盈河岸的状态。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名。采用“雅威”作为较贴近 יהוה 的现代汉语音译，保留专名性质，不以称号取代，也不在本节中引入其他神学解释。
translation_notes:
  register: 采用现代、庄重而易懂的叙事文体。以“一……就……”重组希伯来语较长的事件句，使祭司上岸与河水复流的先后关系清楚；不额外解释神迹机制。
