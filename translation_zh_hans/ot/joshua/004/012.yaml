base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/012.yaml
  text: And the sons of Reuben[a], the sons of Gad, and the half-tribe of Manasseh crossed over armed before the sons of Israel[c][b], just as Moses had spoken to them.
translation:
  language: zh_hans
  text: 吕便子孙[a]、迦得子孙和玛拿西半个支派，带着兵器[c]，在以色列子孙[b]前面过了河，正如摩西曾对他们所说的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“吕便人、迦得人和玛拿西半个支派。”希伯来文直译为“吕便子孙……迦得子孙……”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“以色列人。”希伯来文直译为“以色列子孙”。
    reason: lexical_alternative
  - marker: c
    text: “带着兵器”译自一个可指装备妥当、准备作战的希伯来词；也有人提出较字面的译法，如“列成战阵”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַבְרוּ
  choice: 过了河
  rationale: 动词 עבר 在本段叙事中指过约旦河；汉语补出“河”可自然传达语境所明确的对象，又不必重复河名。
- source_word: בְּנֵי רְאוּבֵן ... וּבְנֵי גָד
  choice: 吕便子孙……迦得子孙
  rationale: 保留希伯来语“某人的众子孙”这一亲族表达，同时使用现代汉语圣经叙事中自然且庄重的说法。
- source_word: וַחֲצִי שֵׁבֶט הַמְנַשֶּׁה
  choice: 玛拿西半个支派
  rationale: 清楚表达这是玛拿西支派的一半，并保持原文结构。
- source_word: חֲמֻשִׁים
  choice: 带着兵器
  rationale: 该词在此表示为作战而装备妥当；“带着兵器”简明自然，同时不把其意义扩大为已经列成特定战阵。
- source_word: לִפְנֵי
  choice: 走在……前面
  rationale: 表达他们在其余以色列人前方行进的位置关系，比单用“在……之前”更不易被理解为时间先后。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列子孙
  rationale: 保留原文“以色列的众子孙”这一亲族称谓；“以色列人”是自然的意译，列于脚注。
- source_word: כַּאֲשֶׁר דִּבֶּר אֲלֵיהֶם מֹשֶׁה
  choice: 正如摩西曾对他们所说的
  rationale: “正如”传达行动与摩西先前话语相符；“曾”明确该话语先于本次渡河，又不把 דבר 过度解释为特定形式的命令。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。将分词性描述“带着兵器”贴近行进动作，并用“走在……前面，过了河”清楚呈现空间关系。חֲמֻשִׁים 也可能含有“列队”或“按战阵排列”的意味，但正文采用语境中最稳妥的“带着兵器”，不采纳可能源于词形联想的“每五人一队”。
