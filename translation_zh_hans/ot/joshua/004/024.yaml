  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: לְ֠מַעַן דַּ֜עַת כָּל עַמֵּ֤י הָ/אָ֨רֶץ֙ אֶת יַ֣ד יְהוָ֔ה כִּ֥י חֲזָקָ֖ה הִ֑יא לְמַ֧עַן יְרָאתֶ֛ם אֶת יְהוָ֥ה אֱלֹהֵי/כֶ֖ם כָּל הַ/יָּמִֽים־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/024.yaml
  text: so that all the peoples of the earth may know that the hand of Yahweh is strong[b][a], and so that you may fear Yahweh your God all your days.
translation:
  language: zh_hans
  text: 为要使地上万民都知道，耶和华的手大有能力[a]；也使你们一生敬畏耶和华你们的上帝。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “地上万民”或译“这地的各族”；希伯来语“地”在这里既可指全地，也可按较局部的范围理解。
    reason: lexical_alternative
  - marker: b
    text: “敬畏”包含对耶和华的惧怕、尊崇和畏服，不只是恐慌。
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן
  choice: 为要使
  rationale: 两个分句均由该词引出目的；“为要使”在现代汉语中自然，并保留明确的目的意味。
- source_word: כָּל עַמֵּי הָאָרֶץ
  choice: 地上万民
  rationale: עַמֵּי 是复数“各民、万民”，而 הָאָרֶץ 在此处按较广范围理解为全地；“地上万民”简洁自然，同时在脚注保留“这地各族”的局部理解。
- source_word: יַד יְהוָה
  choice: 耶和华的手
  rationale: 保留希伯来文以“手”表达作为与权能的拟人意象，不将其直接释为“能力”。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的专名“耶和华”音译四字神名，明确其为上帝的立约之名。
- source_word: כִּי חֲזָקָה הִיא
  choice: 大有能力
  rationale: 原文直义为“它是强的”，阴性代词回指“手”；中文“手大有能力”比“手是强的”自然，也保留权能意象。
- source_word: יְרָאתֶם
  choice: 使你们……敬畏
  rationale: 该形式在 לְמַעַן 后表达目的；“敬畏”兼含惧怕、尊崇与畏服，比单用“害怕”更符合立约语境，又不消除其严肃意味。
- source_word: כָּל הַיָּמִים
  choice: 一生
  rationale: 该惯用语指持续终生；“一生”是现代汉语自然、准确的表达。
- source_word: אֱלֹהֵיכֶם
  choice: 你们的上帝
  rationale: 这里指耶和华，虽形态为复数形式，却按以色列信仰语境作单数称号理解。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: “耶和华”是现代中文普通读者最熟悉的专名形式；它保留专名性质，不以“主”替代神名。
- issue: ירא 应译作惧怕还是敬畏
  choice: 敬畏
  alternative: 惧怕
  rationale: 立约语境中的该词兼具畏惧、尊崇和顺服；“敬畏”能较完整表达其语义范围，脚注说明它并非只有尊敬而没有惧怕。
- issue: הָאָרֶץ 的范围
  choice: 全地（地上）
  alternative: 当地之地（这地）
  rationale: 约旦河神迹具有向万民彰显耶和华权能的目的，故正文采用全球性理解；但该名词也可指特定地域，因此保留脚注异译。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“耶和华的手”保留原文意象；分号呈现两个并列的目的分句。正文脚注标记均紧接相关内容。
