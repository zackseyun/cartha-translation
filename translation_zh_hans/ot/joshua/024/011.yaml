  source_fidelity: “耶利哥的主事者”可反映בַּעֲלֵי（主人、拥有者、城中要人）的一个可能义项，但正文以“就是”将其与随后七族作同位解释，过度消除了原文的句法歧义。希伯来文可理解为“耶利哥的人”和随后各族共同作“与他们交战”的主语；英语审校轨迹也采用“men of Jericho”，并以脚注保留“lords”的可能性。
  naturalness: 原文整体庄重自然。改为“耶利哥的人，以及……”后，中文句法更顺畅，也避免将跨地域的族名不自然地解释成耶利哥城内“主事者”的同位语。
  terminology: “约旦河”“耶利哥”及七族译名均符合通行现代中文圣经用语。“交在你们手中”恰当保留נתן + ביד的惯用意象。
  issues:
