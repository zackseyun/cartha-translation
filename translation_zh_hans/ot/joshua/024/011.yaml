revisions:
- from: 你们过了约旦河，来到耶利哥。耶利哥的主事者[a]，就是亚摩利人、比利洗人、迦南人、赫人、革迦撒人、希未人和耶布斯人，都与你们交战；我却把他们交在你们手中。
  to: 你们过了约旦河，来到耶利哥。耶利哥的人[a]以及亚摩利人、比利洗人、迦南人、赫人、革迦撒人、希未人和耶布斯人都与你们交战；我把他们交在你们手中。
  rationale: 将“耶利哥的主事者，就是……”改为“耶利哥的人……以及……”，使正文不再武断地把七族解释为耶利哥主事者的同位成分，并以脚注保留“统治者／显要人物”的词义可能。删去无明确对应的“却”，其余保留原译的名称、语体和神主动交付敌人的表述。
  reviewer_model: gpt-5.6-terra
