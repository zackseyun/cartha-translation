  text: וַ/תַּעַבְר֣וּ אֶת הַ/יַּרְדֵּן֮ וַ/תָּבֹ֣אוּ אֶל יְרִיחוֹ֒ וַ/יִּלָּחֲמ֣וּ בָ/כֶ֣ם בַּעֲלֵֽי יְ֠רִיחוֹ הָֽ/אֱמֹרִ֨י וְ/הַ/פְּרִזִּ֜י וְ/הַֽ/כְּנַעֲנִ֗י וְ/הַֽ/חִתִּי֙ וְ/הַ/גִּרְגָּשִׁ֔י הַֽ/חִוִּ֖י וְ/הַ/יְבוּסִ֑י וָ/אֶתֵּ֥ן אוֹתָ֖/ם בְּ/יֶדְ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/011.yaml
  text: Then you crossed the Jordan and came to Jericho[a], and the men of Jericho fought against you—the Amorites, the Perizzites, the Canaanites, the Hittites, the Girgashites, the Hivites, and the Jebusites—and I gave them into your hand.
translation:
  language: zh_hans
  text: 你们过了约旦河，来到耶利哥。耶利哥的人[a]以及亚摩利人、比利洗人、迦南人、赫人、革迦撒人、希未人和耶布斯人都与你们交战；我把他们交在你们手中。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “耶利哥的人”原文直译可作“耶利哥的主人（或拥有者）”，可能指该城的统治者、显要人物或居民。原文也可能把这一短语与后列各族并列为敌对群体。
    reason: 说明בַּעֲלֵי יְרִיחוֹ的词义范围，并保留其与后列族名之间的句法歧义。
lexical_decisions:
- source_word: וַתַּעַבְרוּ אֶת הַיַּרְדֵּן
  choice: 你们过了约旦河
  rationale: עבר在此指渡过河流；现代汉语用“过了约旦河”自然、明确。
- source_word: וַתָּבֹאוּ אֶל יְרִיחוֹ
  choice: 来到耶利哥
  rationale: בוא加אֶל表示来到、抵达；不必断定已经进入城内。
- source_word: בַּעֲלֵי יְרִיחוֹ
  choice: 耶利哥的主事者
  rationale: בעל的复数构式字面为“主人、拥有者”，在城市语境中可指掌权者或显要人物；“主事者”保留其权势含义，又不武断限定为正式官长。
- source_word: וַיִּלָּחֲמוּ בָכֶם
  choice: 都与你们交战
  rationale: לחם加ב表示敌对作战；“与你们交战”符合现代汉语叙事。
- source_word: הָאֱמֹרִי וְהַפְּרִזִּי וְהַכְּנַעֲנִי וְהַחִתִּי וְהַגִּרְגָּשִׁי הַחִוִּי וְהַיְבוּסִי
  choice: 亚摩利人、比利洗人、迦南人、赫人、革迦撒人、希未人和耶布斯人
  rationale: 这些希伯来语单数族名在此具有集合意义，按现代中文圣经人名地名惯例译作各族名称。
- source_word: וָאֶתֵּן אוֹתָם בְּיֶדְכֶם
  choice: 我却把他们交在你们手中
  rationale: נתן ביד是把敌人交由某人制伏的惯用语；保留“交在手中”的圣经意象，并用“却”凸显敌方交战与上帝使以色列得胜的转折。
theological_decisions:
- issue: 以色列得胜的主导者
  choice: 保留第一人称神谕：“我却把他们交在你们手中。”
  alternative: 我让你们战胜了他们
  rationale: 原文明确把敌人被交付归于说话的上帝；所选译法既不弱化神的主动作为，也不添加原文未明说的战争细节。
- issue: 各族名称与“耶利哥的主事者”的句法关系
  choice: 以“就是”将后列诸族理解为对前项的同位说明
  alternative: 把“耶利哥的主事者”与七族视为并列的不同敌对群体
  rationale: 希伯来文没有明确解释连词，句法关系存在一定张力；正文采用流畅且可能的同位理解，脚注提示也可作并列理解，避免掩盖歧义。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“主事者”比“主人”更符合城市政治语境，又比“首领”少一层制度性限定；分号呈现敌方交战与上帝交付之间的逻辑转折。
