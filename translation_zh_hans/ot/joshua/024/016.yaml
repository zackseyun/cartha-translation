source:
  edition: WLC
  text: וַ/יַּ֤עַן הָ/עָם֙ וַ/יֹּ֔אמֶר חָלִ֣ילָ/ה לָּ֔/נוּ מֵ/עֲזֹ֖ב אֶת יְהוָ֑ה לַ/עֲבֹ֖ד אֱלֹהִ֥ים אֲחֵרִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/016.yaml
  text: Then the people answered and said[a], “Far be it from us to forsake Yahweh and serve other gods.”
translation:
  language: zh_hans
  text: 百姓回答说：“我们绝不可离弃雅威而事奉别的神！[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “我们绝不可”也可译作“断乎不可”。这是表达强烈拒绝的希伯来语惯用语；原文并未明确提到上帝。
    reason: 说明希伯来语惯用语的语气及一种可能译法，避免把传统译法中补出的神名误认为原文所有。
lexical_decisions:
- source_word: וַיַּעַן הָעָם וַיֹּאמֶר
  choice: 百姓回答说
  rationale: 希伯来语以两个连续的叙事动词引出答话；现代汉语用“回答说”自然保留回应和发言两层意思，而不生硬重复。
- source_word: חָלִילָה לָּנוּ
  choice: 我们绝不可
  rationale: 这是表达强烈拒绝的希伯来语惯用语。“绝不可”准确传达断然否定的语气，同时不添加原文没有明确出现的“上帝禁止”等措辞。
- source_word: מֵעֲזֹב
  choice: 离弃
  rationale: עָזַב 在盟约语境中不只是一般的离开，也指放弃忠诚；“离弃”保留了这一分量。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语音译呈现四字神名，而不以“主”这一称号替代专名。
- source_word: לַעֲבֹד
  choice: 事奉
  rationale: עָבַד 用于神明时涵盖敬拜、服事与效忠；“事奉”在汉语宗教语境中能保留这种宽度。
- source_word: אֱלֹהִים אֲחֵרִים
  choice: 别的神
  rationale: 直译为“别的神”，不额外加入“外邦的”或“陌生的”等原文未明说的限定。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用上帝的专名。译作“雅威”既保留专名性质，也较接近学界通常重构的读音；不用称号“主”替代。
- issue: חָלִילָה 的强烈否定语气
  choice: 我们绝不可
  alternative: 上帝不容我们；断乎不可
  rationale: 该惯用语表达强烈、近乎震惊的拒绝，但句中没有明说上帝。“我们绝不可”保留其力度而不补入隐含主语。
- issue: 离弃雅威与事奉别神的关系
  choice: 离弃雅威而事奉别的神
  alternative: 离弃雅威，去事奉别的神；离弃雅威和事奉别的神
  rationale: 介词 לְ 引出的不定式可表达离弃所趋向的行为。“而”自然呈现两者紧密相连，同时不过度限定为单纯目的或两个彼此独立的动作。
translation_notes:
  register: 采用现代、庄重而易懂的叙事用语。“百姓回答说”符合普通话表达习惯；“离弃”“事奉”保留盟约忠诚和宗教服事的语义分量。感叹号体现 חָלִילָה 的强烈拒绝语气。
