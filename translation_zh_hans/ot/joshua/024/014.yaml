  to: 现在，你们要敬畏雅威，以真诚和忠实侍奉他；要除掉你们的父辈在大河那边[b]和埃及所侍奉的那些神，并侍奉雅威。
  rationale: 将关于侍奉方式的主译文收束为“以真诚和忠实”，以自然、简明的两个并列词对应原文的两个并列词，并藉脚注保留“完整、真实、可靠”等未能在主译文中逐一体现的语义范围。脚注 a 是对该短语的词汇说明，故应紧随“忠实”标注；其余措辞及脚注 b 均予保留。
