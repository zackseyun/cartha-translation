  text: וְ/עַתָּ֞ה יְר֧אוּ אֶת יְהוָ֛ה וְ/עִבְד֥וּ אֹת֖/וֹ בְּ/תָמִ֣ים וּ/בֶֽ/אֱמֶ֑ת וְ/הָסִ֣ירוּ אֶת אֱלֹהִ֗ים אֲשֶׁר֩ עָבְד֨וּ אֲבוֹתֵי/כֶ֜ם בְּ/עֵ֤בֶר הַ/נָּהָר֙ וּ/בְ/מִצְרַ֔יִם וְ/עִבְד֖וּ אֶת יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/014.yaml
  text: Now fear Yahweh and serve him with integrity and faithfulness[a], and put away the gods that your fathers served beyond the River and in Egypt[b], and serve Yahweh.
translation:
  language: zh_hans
  text: 现在，你们要敬畏雅威，以真诚和忠实侍奉他；要除掉你们的父辈在大河那边[b]和埃及所侍奉的那些神，并侍奉雅威。
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: “大河”指幼发拉底河。
    reason: cultural_note
lexical_decisions:
- source_word: וְעַתָּה
  choice: 现在
  rationale: 作为承接前文历史回顾、引出劝勉的语篇标记；现代汉语用“现在”自然明确。
- source_word: יְרָאוּ אֶת־יְהוָה
  choice: 敬畏雅威
  rationale: “敬畏”保留对上帝既畏惧又尊崇的圣经语义张力；“雅威”直接译出圣约之名。
- source_word: וְעִבְדוּ אֹתוֹ
  choice: 侍奉他
  rationale: עבד在此兼有敬拜、效忠和服事之意；“侍奉”比单译“敬拜”更完整，也与本节末尾的重复命令相呼应。
- source_word: בְּתָמִים וּבֶאֱמֶת
  choice: 全心全意、忠诚信实地
  rationale: תמים强调完整、不分心和真诚，אמת可指真实、可靠和忠信；这一并列译法力求保留二者相互补充的含义，不把前者误解为毫无过失。
- source_word: וְהָסִירוּ
  choice: 除掉
  rationale: 准确表达清除、弃绝竞争性神明的命令，现代汉语简洁有力。
- source_word: אֱלֹהִים
  choice: 那些神
  rationale: 原文只说“神”，未明说“外邦的”；用指示性“那些”承接后面的关系从句，而不额外添加性质判断。
- source_word: אֲבוֹתֵיכֶם
  choice: 你们的父辈
  rationale: 保留原文男性复数亲属称谓及其“先辈”含义，且符合自然汉语。
- source_word: בְּעֵבֶר הַנָּהָר
  choice: 在大河那边
  rationale: 保留原文以“那河”指称著名大河的表达，同时用“大河”使中文地理称谓较自然；具体所指置于脚注。
- source_word: וּבְמִצְרַיִם
  choice: 和埃及
  rationale: 与“大河那边”并列，表示父辈侍奉那些神的地点。
- source_word: וְעִבְדוּ אֶת־יְהוָה
  choice: 侍奉雅威
  rationale: 保留原文重复的命令和首尾呼应；不擅自把连接词加强为排他性的“只要”。
theological_decisions:
- issue: 圣约之名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名；“雅威”在现代汉语中较贴近其通行学术重构，并使读者看见此处是专名，而非普通称号。
- issue: ירא 是否弱化为单纯尊崇
  choice: 敬畏
  alternative: 尊崇；害怕
  rationale: “敬畏”同时容纳畏惧、尊崇以及由此产生的顺服，不把原文的神学张力化约为单一情感。
- issue: תמים 是否译为道德上毫无瑕疵
  choice: 全心全意
  alternative: 完全无瑕；正直
  rationale: 本处主要指完整、不分裂的忠诚，而非宣称人达到无罪状态；译文避免过度解释。
- issue: אמת 在圣约语境中的含义
  choice: 忠诚信实
  alternative: 真实；诚实
  rationale: 该词既有真实性，也有可靠、忠信的维度；与 תמים 并列时，“忠诚信实”较能表达真诚可靠的侍奉，同时脚注保留语义范围。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。保留原文两次“侍奉雅威”的强调结构；分号呈现“敬畏并侍奉—除掉诸神—侍奉雅威”的劝勉层次。脚注标记均紧随其所解释的词组。
