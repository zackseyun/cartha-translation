id: JOS.24.17
reference: Joshua 24:17
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כִּ֚י יְהוָ֣ה אֱלֹהֵ֔י/נוּ הוּא֩ הַ/מַּעֲלֶ֨ה אֹתָ֧/נוּ וְ/אֶת אֲבוֹתֵ֛י/נוּ מֵ/אֶ֥רֶץ מִצְרַ֖יִם מִ/בֵּ֣ית עֲבָדִ֑ים וַ/אֲשֶׁ֧ר עָשָׂ֣ה לְ/עֵינֵ֗י/נוּ אֶת הָ/אֹת֤וֹת הַ/גְּדֹלוֹת֙ הָ/אֵ֔לֶּה וַֽ/יִּשְׁמְרֵ֗/נוּ בְּ/כָל הַ/דֶּ֨רֶךְ֙ אֲשֶׁ֣ר הָלַ֣כְנוּ בָ֔/הּ וּ/בְ/כֹל֙ הָֽ/עַמִּ֔ים אֲשֶׁ֥ר עָבַ֖רְנוּ בְּ/קִרְבָּֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/017.yaml
  text: For Yahweh our God is the one who brought us and our fathers up from the land of Egypt[a], from the house of slaves, and who did these great signs before our eyes, and kept us in all the way in which we walked[b], and among all the peoples through whose midst we passed.
translation:
  language: zh_hans
  text: 因为耶和华我们的上帝，正是那位把我们和我们的祖先从埃及地、从奴隶之家[a]带上来的；他在我们眼前行了这些大神迹[b]，在我们所走的一路上保护我们，也在我们所经过的各族中间保护我们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“奴役之家”或“为奴之家”。希伯来文直译“奴隶之家”。
    reason: lexical_alternative
  - marker: b
    text: 或译“这些大奇事”或“这些大奇迹”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上一节百姓委身事奉耶和华的宣告，引出其理由；“因为”在现代汉语中自然呈现这一逻辑关系。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 直接译出四字神名，采用现代中文读者熟悉的专名形式，不以“主”替代。
- source_word: אֱלֹהֵינוּ
  choice: 我们的上帝
  rationale: 保留第一人称复数所属关系，表达以色列人与上帝的群体关系。
- source_word: הוּא
  choice: 正是那位
  rationale: 独立代词带有强调作用；“正是那位”既凸显主语，也自然引出后续行动。
- source_word: הַמַּעֲלֶה
  choice: 带……上来
  rationale: 保留עלה“使上去、带上来”的方向意象，同时采用现代汉语可理解的表达。
- source_word: וְאֶת אֲבוֹתֵינוּ
  choice: 和我们的祖先
  rationale: 在现代汉语中，“祖先”比“父辈”更自然地涵盖出埃及的先代，并准确表达群体历史延续。
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: 从埃及地
  rationale: 保留原文明确出现的“地”，而不简化为“从埃及”。
- source_word: מִבֵּית עֲבָדִים
  choice: 从奴隶之家
  rationale: 原文是具体的复数名词“奴隶”而非抽象名词“奴役”；此译保留其具体社会处境和“家”的比喻。
- source_word: לְעֵינֵינוּ
  choice: 在我们眼前
  rationale: 自然保留亲眼见证的强调。
- source_word: הָאֹתוֹת הַגְּדֹלוֹת הָאֵלֶּה
  choice: 这些大神迹
  rationale: “神迹”能表达אוֹת在此处兼具标记意义和超自然行动的语境含义；“这些”和“大”均予保留。
- source_word: וַיִּשְׁמְרֵנוּ
  choice: 保护我们
  rationale: שׁמר在旅程语境中指守护、保全；“保护”比直译“看守”更符合现代汉语。
- source_word: בְּכָל הַדֶּרֶךְ אֲשֶׁר הָלַכְנוּ בָהּ
  choice: 在我们所走的一路上
  rationale: 保留介词בְּ和“全程”的范围意义，以自然汉语表达旅途中的持续保护。
- source_word: וּבְכֹל הָעַמִּים אֲשֶׁר עָבַרְנוּ בְּקִרְבָּם
  choice: 也在我们所经过的各族中间
  rationale: 保留“各族”和“在他们中间经过”的空间关系，并让前面的“保护我们”自然统摄这一并列成分。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威；主
  rationale: 原文直接使用四字神名，因此正文采用专名而非称号“主”；“耶和华”是现代中文中广为人知且可辨识的神名形式。
- issue: 出埃及公式中עֲבָדִים的具体或抽象表达
  choice: 奴隶之家
  alternative: 奴役之家；为奴之家
  rationale: 希伯来文使用复数具体名词“奴隶”，正文保留其具体性，不将受辖制者抽象化为一种制度或状态；脚注列出更自然的功能性译法。
- issue: אוֹת的神学含义
  choice: 神迹
  alternative: 奇事；奇迹；征兆
  rationale: 该词本义可指“记号、征兆”，在出埃及语境中指具有启示意义的超常作为。“神迹”保留中文圣经语域，但脚注承认“奇事、奇迹”等可能译法，不把词义限制为单一类别。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“正是那位”呈现原文强调；分号梳理较长的并列关系。末尾补出第二个“保护我们”，属于汉语为避免悬垂而作的语法性复现，语义仍由原文同一动词统摄。“带……上来”刻意保留出埃及叙事中עלה的上行意象。
