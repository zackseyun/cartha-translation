source:
  edition: WLC
  text: וַ/יְגָ֨רֶשׁ יְהוָ֜ה אֶת כָּל הָ/עַמִּ֗ים וְ/אֶת הָ/אֱמֹרִ֛י יֹשֵׁ֥ב הָ/אָ֖רֶץ מִ/פָּנֵ֑י/נוּ גַּם אֲנַ֨חְנוּ֙ נַעֲבֹ֣ד אֶת יְהוָ֔ה כִּי ה֖וּא אֱלֹהֵֽי/נוּ־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/018.yaml
  text: And Yahweh drove out from before us all the peoples[a], including the Amorites who lived in the land. We also will serve Yahweh, for he is our God.
translation:
  language: zh_hans
  text: 雅威从我们面前赶走了所有民族，包括住在那地的亚摩利人[a]。我们也要事奉雅威，因为他是我们的上帝。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“所有民族和住在那地的亚摩利人”。
    reason: 希伯来语的连接结构既可理解为进一步列举，即“和亚摩利人”，也可按语境理解为包含说明。
lexical_decisions:
- source_word: וַיְגָרֶשׁ
  choice: 赶走了
  rationale: גרש表示驱逐、赶离；“赶走”自然清楚，并保留使其离开当地的力度。
- source_word: יְהוָה
  choice: 雅威
  rationale: 直接音译四字神名，保留经文中的专名，不以称号替代。
- source_word: כָּל הָעַמִּים
  choice: 所有民族
  rationale: עַמִּים为复数，在此指不同的族群；“民族”比泛指人数的“众人”更能体现其族群含义。
- source_word: וְאֶת הָאֱמֹרִי
  choice: 包括……亚摩利人
  rationale: 结合上下文，将亚摩利人理解为前述各民族中特别指出的一族；同时用脚注保留并列译法。
- source_word: יֹשֵׁב הָאָרֶץ
  choice: 住在那地的
  rationale: 分词短语修饰亚摩利人；“住在那地的”符合现代汉语，也保留居住者之意。
- source_word: מִפָּנֵינוּ
  choice: 从我们面前
  rationale: 保留希伯来语“从我们面前”的空间意象，表达雅威在以色列人面前除去那些民族。
- source_word: גַּם אֲנַחְנוּ
  choice: 我们也
  rationale: 体现百姓回应约书亚先前宣告时的呼应和共同承诺。
- source_word: נַעֲבֹד
  choice: 要事奉
  rationale: עבד以神为宾语时兼含服事、敬拜与效忠；“事奉”保留其较宽的盟约语义，不限于礼仪行为。
- source_word: כִּי הוּא אֱלֹהֵינוּ
  choice: 因为他是我们的上帝
  rationale: כִּי在此说明立志事奉的理由；“因为”在现代汉语中明确而自然。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文使用四字神名；采用较贴近常见学术重构读音的“雅威”，以专名而非称号呈现。
- issue: 盟约语境中 עבד 的范围
  choice: 事奉
  alternative: 敬拜
  rationale: 该词包含敬拜，却也涵盖忠诚和服事；“事奉”避免把含义缩窄为礼仪性的敬拜。
- issue: 亚摩利人与“所有民族”的关系
  choice: 正文译为包含关系
  alternative: 并列关系：“所有民族和住在那地的亚摩利人”
  rationale: 上下文允许把亚摩利人看作前述各民族中被特别提出的一族，但希伯来语连接词本身也可作简单并列，因此以脚注保留另一读法。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“赶走”“住在那地”清楚易懂；“事奉”保留圣经盟约语境中的敬拜与效忠含义。脚注标记已在正文相应位置出现。
