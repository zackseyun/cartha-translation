base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/033.yaml
  text: And Eleazar the son of Aaron died, and they buried him at Gibeath-phinehas, his son’s hill country, which had been given to him in the hill country of Ephraim.
translation:
  language: zh_hans
  text: 亚伦的儿子以利亚撒死了；人们把他安葬在他儿子非尼哈的基比亚[a]。这地方位于以法莲山区，是赐给他的[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “非尼哈的基比亚”也可译作“非尼哈山”；原文既可理解为地名，也有“非尼哈的小山”之意。
    reason: 说明地名与普通名词之间的词义空间。
  - marker: b
    text: “他的”很可能指非尼哈，也可能指以利亚撒。
    reason: 保留原文代词所指对象的歧义。
lexical_decisions:
- source_word: גִבְעַת פִּינְחָס
  choice: 非尼哈的基比亚
  rationale: 将构造短语保留为地名表达；גִבְעָה可指“小山”或名为“基比亚”的地方。正文采用音译兼属格结构，脚注说明字面意义。
- source_word: הַר אֶפְרָיִם
  choice: 以法莲山区
  rationale: הַר在此指以法莲的山地地区，而非某一座孤立山峰；“山区”符合地理语境和现代汉语表达。
- source_word: נִתַּן
  choice: 赐给
  rationale: 保留被动式“被给予”的意义；此处涉及所得之地，“赐给”庄重自然，同时不额外说明赐予者。
- source_word: וַיִּקְבְּרוּ אֹתוֹ
  choice: 人们把他安葬
  rationale: 希伯来语为未明说主语的第三人称复数；译作“人们”避免凭空指定具体安葬者。
theological_decisions:
- issue: לו（“给他”）所指的人
  choice: 正文保留“他的”这一代词表达，并用脚注指出可能指非尼哈，也可能指以利亚撒
  alternative: 直接译成“是赐给非尼哈的”或“是赐给以利亚撒的”
  rationale: 希伯来语阳性单数代词在句法上存在指代空间；上下文较自然地指向最近的“非尼哈”，但不宜在正文中消除原文的含混。
- issue: 土地与祭司产业制度的关系
  choice: 不添加关于土地来源、祭司产业或继承制度的解释
  alternative: 说明此地如何合法归属祭司家族
  rationale: 本节只陈述该地曾被赐予某人，原文没有展开制度或神学解释。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“也死了”承接本章前文的死亡记载；以分号连接墓地的位置与其来源。所有脚注标记均已置于正文对应位置。
