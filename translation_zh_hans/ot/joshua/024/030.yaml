base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/030.yaml
  text: And they buried him within the territory of his inheritance[a], at Timnath-serah, which is in the hill country of Ephraim, north of Mount Gaash.
translation:
  language: zh_hans
  text: 他们把他安葬在他所得产业的境内[a]，就是在以法莲山区的亭拿·西拉，迦实山以北。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“在他所得产业的边界上”。希伯来语“境／边界”既可指界线，也可指界线以内的地域；这里较可能是指分给约书亚之产业的地域。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְבְּרוּ אֹתוֹ
  choice: 他们把他安葬
  rationale: וַיִּקְבְּרוּ为叙事性连续式，אֹתוֹ明确以第三人称阳性单数为宾语，承接上文的约书亚；现代汉语用“把”字句自然清楚。“安葬”符合庄重的埋葬语境。
- source_word: בִּגְבוּל נַחֲלָתוֹ
  choice: 在他所得产业的境内
  rationale: גְּבוּל既可指边界，也可指边界以内的地域；在说明安葬地点并与נַחֲלָה连用时，正文采用“境内”。“所得产业”体现נַחֲלָה在约书亚记中由分配而得之地的含义，同时脚注保留“边界”的可能。
- source_word: בְּתִמְנַת סֶרַח
  choice: 在……亭拿·西拉
  rationale: 按专名音译；介词בְּ在此表示地点，融入“就是在……”的汉语结构。
- source_word: אֲשֶׁר בְּהַר אֶפְרָיִם
  choice: 就是在以法莲山区的
  rationale: אֲשֶׁר引出地点说明；הַר אֶפְרָיִם在此指以法莲的山地地区，而非一座名为“以法莲山”的单独山峰，因此译作“以法莲山区”。
- source_word: מִצְּפוֹן לְהַר גָּעַשׁ
  choice: 迦实山以北
  rationale: מִצְּפוֹן לְ表示相对于地标的北面；הַר גָּעַשׁ作为地名译作“迦实山”。
