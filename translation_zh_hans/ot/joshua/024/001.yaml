base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/001.yaml
  text: Then Joshua gathered all the tribes of Israel to Shechem[a], and he called for the elders of Israel, its heads, its judges, and its officers[c][b], and they presented themselves before God.
translation:
  language: zh_hans
  text: 约书亚把以色列各支派聚集到示剑[a]，又召来以色列的长老、首领[b]、审判官和官员；他们就站在上帝面前[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“在示剑”。希伯来文的地名带方向词尾，字面意思是“往示剑”。
    reason: lexical_alternative
  - marker: b
    text: 原文用“头”的复数形式，指为首的人，即首领。
    reason: lexical_clarification
  - marker: c
    text: 原文作“在上帝面前”；在这样的立约集会中，这一说法可能暗示他们是在圣所或立约的圣地集会。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֶּאֱסֹף
  choice: 聚集
  rationale: 在本叙事语境中，אָסַף指把众人召集到一处；“聚集”自然、准确，并保留具体的集合含义。
- source_word: שִׁבְטֵי יִשְׂרָאֵל
  choice: 以色列各支派
  rationale: שֵׁבֶט在这里指以色列民族的支派组织；“各支派”是现代汉语中准确而通行的表达。
- source_word: שְׁכֶמָה
  choice: 到示剑
  rationale: 地名后的方向词尾表示朝向该地，因此译作“到示剑”；上下文同时表明聚会是在那里举行的。
- source_word: וַיִּקְרָא לְ
  choice: 召来
  rationale: קרא与介词ל连用，在此表示召集指定的领袖群体；“召来”简洁自然，也体现他们受召前来。
- source_word: זִקְנֵי יִשְׂרָאֵל
  choice: 以色列的长老
  rationale: 准确表达这一公认的领袖群体及其职分。
- source_word: רָאשָׁיו
  choice: 首领
  rationale: רֹאשׁ字面为“头”，在这里指居首位、负领导责任的人；“首领”既保留这一意象，又符合自然汉语。第三人称单数后缀以以色列为集合体，汉语依上下文即可明确，无须生硬译出。
- source_word: שֹׁפְטָיו
  choice: 审判官
  rationale: 在这里是司法或治理职衔；“审判官”比泛称“士师”更直接呈现其职能，也避免与《士师记》中特定称谓不必要地混同。
- source_word: שֹׁטְרָיו
  choice: 官长
  rationale: שֹׁטֵר指承担行政执行职责的官员；“官长”是庄重且为普通读者可懂的对应词。
- source_word: וַיִּתְיַצְּבוּ
  choice: 他们就站在
  rationale: 该反身词形可指正式到场、就位或站立；“站在”保留其具体动作和正式场景，不额外加入原文没有明说的礼仪细节。
- source_word: לִפְנֵי הָאֱלֹהִים
  choice: 上帝面前
  rationale: 原文明说הָאֱלֹהִים，而非神名יהוה，因此直译为“上帝面前”，不在正文中改成“耶和华面前”或扩写成圣所。
theological_decisions:
- issue: 立约集会语境中לִפְנֵי הָאֱלֹהִים的所指
  choice: 上帝面前
  alternative: 在上帝的圣所前
  rationale: 希伯来文直接指“上帝面前”，应在正文中保留；此类表述在集会语境中可能暗示圣所或立约圣地，但地点含义并未明说，因此仅在脚注说明，不把解释写入正文。
translation_notes:
  register: 采用现代、庄重而易懂的叙事文体。“聚集”“召来”使动作关系清楚；各职衔并列，以顿号保持节奏。“上帝面前”保留原文的神学措辞及其可能的场所含义，不在正文中作解释性扩写。
