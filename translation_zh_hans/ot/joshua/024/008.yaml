  text: ו/אבא/ה אֶתְ/כֶ֗ם אֶל אֶ֤רֶץ הָ/אֱמֹרִי֙ הַ/יּוֹשֵׁב֙ בְּ/עֵ֣בֶר הַ/יַּרְדֵּ֔ן וַ/יִּֽלָּחֲמ֖וּ אִתְּ/כֶ֑ם וָ/אֶתֵּ֨ן אוֹתָ֤/ם בְּ/יֶדְ/כֶם֙ וַ/תִּֽירְשׁ֣וּ אֶת אַרְצָ֔/ם וָ/אַשְׁמִידֵ֖/ם מִ/פְּנֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/008.yaml
  text: Then I brought you into the land of the Amorites[a], who lived beyond the Jordan, and they fought with you. And I gave them into your hand, and you took possession of their land, and I destroyed them from before you.
translation:
  language: zh_hans
  text: 于是，我把你们带入住在约旦河对岸的亚摩利人之地。他们与你们交战[a]；我把他们交在你们手中，你们占有了他们的土地。我从你们面前消灭了他们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文介词可直译为“同”或“与”；但上下文表明这是敌对交战，不是并肩作战。
    reason: 说明希伯来文介词结构的可见形式，并按上下文澄清其敌对含义。
lexical_decisions:
- source_word: וָאֲבִיאָה אֶתְכֶם
  choice: 后来，我带领你们进入
  rationale: בוא的使役形表达“带入、领入”；“后来”自然体现叙事的先后关系，“带领……进入”也保留进入该地的动态。
- source_word: אֶל אֶרֶץ הָאֱמֹרִי
  choice: 进入……亚摩利人之地
  rationale: אֶל在本语境中指向并进入某地；הָאֱמֹרִי虽为单数形式，却集合性地指亚摩利人。
- source_word: הַיּוֹשֵׁב בְּעֵבֶר הַיַּרְדֵּן
  choice: 住在约旦河对岸的
  rationale: 分词יֹשֵׁב修饰亚摩利人；“约旦河对岸”保留בְּעֵבֶר的相对空间表达，不替原文明确指定东西方向。
- source_word: וַיִּלָּחֲמוּ אִתְּכֶם
  choice: 他们与你们交战
  rationale: לחם与אֵת连用在此表示双方交战；中文“与你们交战”自然表达敌对行动，同时较贴近原文介词结构。
- source_word: וָאֶתֵּן אוֹתָם בְּיֶדְכֶם
  choice: 我把他们交在你们手中
  rationale: 保留נתן ביד的希伯来语惯用表达，含有把敌人交由对方掌控的意思；该说法在现代中文中仍清楚庄重。
- source_word: וַתִּירְשׁוּ אֶת אַרְצָם
  choice: 你们就占领了他们的土地
  rationale: ירש在征服语境中指取得并占有土地；“占领”清楚表达战后取得领土的结果，避免误译为一般意义的“继承”。
- source_word: וָאַשְׁמִידֵם מִפְּנֵיכֶם
  choice: 我从你们面前消灭了他们
  rationale: שׁמד保留强烈的毁灭含义，不以较弱的“击败”淡化；“从你们面前”对应מִפְּנֵיכֶם，并保留原文的空间性惯用语。
theological_decisions:
- issue: 如何呈现征服叙事中的神圣行动与毁灭用语
  choice: 保留第一人称神圣宣告及“交在你们手中”“占领”“消灭”等直接措辞。
  alternative: 用“击败”“赶走”等较缓和的措辞。
  rationale: 原文明确把战胜、取得土地和毁灭归于说话者的行动；翻译不应淡化其力度，也不应加以辩护或扩展。
- issue: “他们与你们交战”所表达的关系
  choice: 按上下文理解为亚摩利人与以色列人敌对交战，并以脚注说明。
  alternative: 将介词结构理解成“他们同你们并肩作战”。
  rationale: 虽然希伯来语表面形式可直译为“同你们交战”，但后续将他们交在以色列手中并占领其土地，清楚表明双方是敌对关系。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。保留“交在你们手中”和“从你们面前”等可理解的圣经式意象；“约旦河对岸”维持原文相对方位，不额外指定河东或河西。
