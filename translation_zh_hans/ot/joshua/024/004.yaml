  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וָ/אֶתֵּ֣ן לְ/יִצְחָ֔ק אֶֽת יַעֲקֹ֖ב וְ/אֶת עֵשָׂ֑ו וָ/אֶתֵּ֨ן לְ/עֵשָׂ֜ו אֶת הַ֤ר שֵׂעִיר֙ לָ/רֶ֣שֶׁת אוֹת֔/וֹ וְ/יַעֲקֹ֥ב וּ/בָנָ֖י/ו יָרְד֥וּ מִצְרָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/004.yaml
  text: And I gave Isaac Jacob and Esau[a], and I gave Esau the hill country of Seir to possess[b]; but Jacob and his sons went down to Egypt.
translation:
  language: zh_hans
  text: 我把雅各和以扫赐给以撒，又把西珥山区[a]赐给以扫作产业；而雅各和他的儿子们下到埃及去了。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “西珥山区”也可译作“西珥山”或“西珥山地”。
    reason: lexical_alternative
  - marker: b
    text: “而”原文直译为“和”或“又”；这里的译法体现以扫得着西珥与雅各一家下到埃及之间的对照。
    reason: alternative_reading
lexical_decisions:
- source_word: וָאֶתֵּן
  choice: 我赐给
  rationale: נתן在此表示上帝赐下后裔和土地；译作“赐给”自然、庄重，并保留两次重复的神圣行动。
- source_word: לְיִצְחָק
  choice: 给以撒
  rationale: 介词לְ标明接受者；人名按现代中文圣经通行译名处理。
- source_word: אֶת יַעֲקֹב וְאֶת עֵשָׂו
  choice: 雅各和以扫
  rationale: אֶת为直接宾语标记，中文无需另译；二人是赐给以撒的儿子。
- source_word: הַר שֵׂעִיר
  choice: 西珥山区
  rationale: הַר既可指山，也可指山地或山区；此处关乎赐给以扫的地域，译作“西珥山区”比单一山峰更贴合语境，同时在脚注保留其他可能。
- source_word: לָרֶשֶׁת אֹתוֹ
  choice: 作产业
  rationale: ירש可表示占有、承受或得地为业；中文“作产业”简洁地表达以扫获得并持有该地域，宾语由“西珥山区”自然承接。
- source_word: וְיַעֲקֹב וּבָנָיו
  choice: 而雅各和他的儿子们
  rationale: וְ形式上是“和/又”，语境中却把以扫得地与雅各一家下埃及并置；“而”既显出转折对照，又不像“但是”那样过度强化。
- source_word: יָרְדוּ מִצְרָיִם
  choice: 下到埃及去了
  rationale: 保留ירד“下去”的方向性和圣经叙事惯用表达，同时符合现代汉语。
theological_decisions:
- issue: 末句连接词וְ所表达的关系
  choice: 译作“而”，呈现叙事中的对照，同时不把连接词规定为强烈转折。
  alternative: 译作“又/和”，更形式对应希伯来语的一般连接词。
  rationale: 原文连接词本身可仅作顺承，但上下文并置了以扫在西珥得产业与雅各一家下埃及两种不同境遇。“而”能保留这种张力，避免把隐含对照强化成明确的“但是”。
- issue: לָרֶשֶׁת אֹתוֹ的领地含义
  choice: 译作“作产业”。
  alternative: 译作“占有它”或“承受它”。
  rationale: 该动词兼有取得、占有、承受产业的语义。“作产业”适合土地分配语境，但不额外断定具体法律机制。
translation_notes:
  register: 采用现代、庄重且易懂的叙事体。“赐给”保留神为行动主体的语气；“作产业”采用普通读者可理解的传统土地用语；“而”较温和地呈现原文可能隐含的对照。所有脚注标记均置于相关正文处。
