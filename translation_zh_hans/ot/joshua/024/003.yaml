source:
  edition: WLC
  text: וָ֠/אֶקַּח אֶת אֲבִי/כֶ֤ם אֶת אַבְרָהָם֙ מֵ/עֵ֣בֶר הַ/נָּהָ֔ר וָ/אוֹלֵ֥ךְ אוֹת֖/וֹ בְּ/כָל אֶ֣רֶץ כְּנָ֑עַן ו/ארב אֶת זַרְע֔/וֹ וָֽ/אֶתֶּן ל֖/וֹ אֶת יִצְחָֽק־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/003.yaml
  text: Then I took your father Abraham from beyond the River[a], and I led him through all the land of Canaan[b], and I multiplied his offspring and gave him Isaac.
translation:
  language: zh_hans
  text: 后来，我从大河[a]那边带出你们的父亲亚伯拉罕，领他走遍迦南全地。我使他的后裔[b]增多，又把以撒赐给他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “大河”很可能指幼发拉底河。
    reason: cultural_note
  - marker: b
    text: 或译“子孙”；希伯来文直译为“种子”，在这里指集合意义的后代。
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶקַּח
  choice: 后来，我……带出
  rationale: 该词是לקח的Qal连续式未完成时第一人称单数，叙述上帝过去接续的行动。“后来”自然承接上文；“带出”结合“从……那边”表达把亚伯拉罕带离原居之地，不额外译成“拣选”。
- source_word: אֲבִיכֶם
  choice: 你们的先祖
  rationale: אָב在这里指以色列人的远祖亚伯拉罕。“先祖”在现代汉语中既保留家族和圣约历史的意味，也避免“父亲”被误解为直接生父。
- source_word: מֵעֵבֶר הַנָּהָר
  choice: 从大河那边
  rationale: עֵבֶר与מִן合用，表示从河的另一边而来；定冠词所指的“河”在此是一个熟知的地理称谓。正文采用自然的汉语表达，具体所指在脚注说明。
- source_word: וָאוֹלֵךְ אֹתוֹ
  choice: 领他走遍
  rationale: הלך的Hiphil形式带有使动含义。“领他”体现上帝使亚伯拉罕行走；与后面的“迦南全地”连用时，“走遍”自然传达行经全境的意思。
- source_word: בְּכָל אֶרֶץ כְּנָעַן
  choice: 迦南全地
  rationale: 介词ב在行走语境中表示在全地范围内经过；与“走遍”组合，准确而自然地表达“遍及迦南全地”。
- source_word: וָאַרְבֶּה אֶת־זַרְעוֹ
  choice: 我使他的后裔增多
  rationale: רבה的Hiphil表示使之众多、增多；זֶרַע是集合单数，可指一个人的后代。“后裔”是现代汉语中自然且庄重的对应。
- source_word: וָאֶתֶּן לוֹ אֶת־יִצְחָק
  choice: 又把以撒赐给他
  rationale: נתן加间接宾语和直接宾语，表示上帝将以撒给亚伯拉罕。“赐给”适合上帝为施予者的语境，并保留以撒作为礼物的表达。
theological_decisions:
- issue: 亚伯拉罕的祖先称谓
  choice: 你们的先祖亚伯拉罕
  alternative: 你们的父亲亚伯拉罕
  rationale: 希伯来文直译为“你们的父亲”，带有以色列共同先祖及圣约身份的意味。现代汉语“先祖”能保存这一祖源关系，同时避免读者误以为亚伯拉罕是听众的直接父亲。
- issue: “大河”的具体所指
  choice: 正文保留称谓“大河”，脚注说明很可能是幼发拉底河
  alternative: 正文直接译作“幼发拉底河”
  rationale: 原文使用带定冠词的普通名词“河”，没有写出专名。保留原文称谓可避免把高度可能的地理识别直接写入正文。
- issue: 后裔增多与赐下以撒的叙述次序
  choice: 按原文保留“使他的后裔增多，又把以撒赐给他”
  alternative: 调整为先赐以撒、再使后裔增多
  rationale: 原文确实先述后裔增多，后述赐下以撒。译文不按时间推理重排，以保留经文自身的叙述次序和张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“先祖”兼顾原文亲属称谓和现代汉语可理解性；“带出”“领他走遍”清楚区分两个连续动作。句子分为两句，以免多个并列动词造成汉语冗长，同时保持原文行动次序。
