  yaml_path: translation/ot/joshua/024/028.yaml
  text: Then Joshua sent the people away[a], each man to his inheritance.
translation:
  language: zh_hans
  text: 于是，约书亚遣散百姓，各人[a]回到自己的产业。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“一个人到他的产业”；这里的阳性单数作分配用法，也可译为“每个人回到自己的产业”。
    reason: 说明אִישׁ的阳性单数形式及其分配用法，并保留较直译的表达。
lexical_decisions:
- source_word: וַיְשַׁלַּח
  choice: 遣散
  rationale: 此处שׁלח的皮耶勒词形表示让聚集的百姓离去；“遣散”自然、简洁，也比单说“差遣”更符合散会的语境。
- source_word: יְהוֹשֻׁעַ
  choice: 约书亚
  rationale: 采用现代中文圣经中通行的人名译法。
- source_word: הָעָם
  choice: 百姓
  rationale: עָם在此指聚集的以色列民众；“百姓”准确表达其集合意义，又不额外限定为政治意义上的“国民”。
- source_word: אִישׁ
  choice: 各人
  rationale: אִישׁ在这里以阳性单数作分配用法，意思是人人分别离去；“各人”既保留分配意味，又符合现代汉语表达。
- source_word: לְנַחֲלָתוֹ
  choice: 回到自己的产业
  rationale: נַחֲלָה在《约书亚记》中通常指各支派、宗族或家庭所得的承受之地。“产业”保留其承受土地的含义；“回到”将希伯来语方向介词在本语境中隐含的行动自然表达出来。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“于是”承接前文叙事；句式简洁，适合公开诵读。“产业”依上下文指分配给各人的承受之地。
