reference: Joshua 24:32
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/אֶת עַצְמ֣וֹת י֠וֹסֵף אֲשֶׁר הֶעֱל֨וּ בְנֵי יִשְׂרָאֵ֥ל מִ/מִּצְרַיִם֮ קָבְר֣וּ בִ/שְׁכֶם֒ בְּ/חֶלְקַ֣ת הַ/שָּׂדֶ֗ה אֲשֶׁ֨ר קָנָ֧ה יַעֲקֹ֛ב מֵ/אֵ֛ת בְּנֵֽי חֲמ֥וֹר אֲבִֽי שְׁכֶ֖ם בְּ/מֵאָ֣ה קְשִׂיטָ֑ה וַ/יִּֽהְי֥וּ לִ/בְנֵֽי יוֹסֵ֖ף לְ/נַחֲלָֽה־־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/032.yaml
  text: And the bones of Joseph[a], which the sons of Israel had brought up from Egypt, they buried at Shechem, in the portion of the field that Jacob had bought from the sons of Hamor, the father of Shechem, for a hundred qesitahs[c][b]; and it became an inheritance for the sons of Joseph.
translation:
  language: zh_hans
  text: 以色列子孙从埃及带上来的约瑟的骸骨，他们埋葬在示剑雅各用一百克西塔[a]从哈抹的子孙手中买下的那块田地[c]里；哈抹是示剑的父亲[b]。那块地便归约瑟子孙为产业。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “克西塔”是古代一种价值或货币单位，确切等值不详。
    reason: cultural_note
  - marker: b
    text: “父亲”也可能宽泛地指祖先，或指示剑的奠基者、首领。
    reason: lexical_alternative
  - marker: c
    text: 原文也可译作“田地中的那一份”或“那一小块田地”。
    reason: lexical_alternative
lexical_decisions:
- source_word: עַצְמוֹת
  choice: 骸骨
  rationale: 原词具体指骨头；“骸骨”既保留具体意象，也符合安葬先人遗骨的庄重语境。
- source_word: הֶעֱלוּ
  choice: 带上来
  rationale: 使役形在这里表示“使上来、带上来”；“上来”保留从埃及前往应许之地的方向表达。
- source_word: בְנֵי יִשְׂרָאֵל
  choice: 以色列子孙
  rationale: 保留原文的亲属称谓和群体身份，同时是现代中文读者熟悉、可理解的表达。
- source_word: בִשְׁכֶם
  choice: 在示剑
  rationale: 介词与地名结合表示安葬地点；中文用“在”自然明确。
- source_word: בְּחֶלְקַת הַשָּׂדֶה
  choice: 那块田地
  rationale: חֶלְקָה 指划出的一块或一份土地；“那块田地”简洁自然，其“地块”含义在脚注说明。
- source_word: קָנָה
  choice: 买下
  rationale: 上下文明确涉及支付价款，因此采用具体的“买下”，而不使用范围更宽的“取得”。
- source_word: בְּנֵי חֲמוֹר
  choice: 哈抹的子孙
  rationale: בְּנֵי 可指亲生儿子，也可指后裔；交易与较早的雅各时代相关，用“子孙”在中文中保留群体性而不限定为哈抹的亲生儿子。
- source_word: אֲבִי שְׁכֶם
  choice: 示剑的父亲哈抹
  rationale: 按原文最直接理解为哈抹是示剑之父；同时用脚注保留“父”可能具有较宽泛祖先或奠基者意义的可能。
- source_word: בְּמֵאָה קְשִׂיטָה
  choice: 用一百克西塔
  rationale: קְשִׂיטָה 是确切现代等值不明的古代价值或货币单位；音译可避免制造虚假的精确换算。
- source_word: וַיִּהְיוּ לִבְנֵי יוֹסֵף לְנַחֲלָה
  choice: 那地方便归约瑟子孙为产业
  rationale: 语境指所购土地成为约瑟子孙的世袭产业。“那地方”使中文指代清楚，同时不机械复制希伯来语复数动词所造成的歧义。
theological_decisions:
- issue: בְנֵי יִשְׂרָאֵל 的群体亲属表达
  choice: 以色列子孙
  alternative: 以色列人
  rationale: “以色列子孙”既自然可懂，也较透明地保留原文以家族关系表达圣约群体身份的方式。
- issue: 古代价值单位 קְשִׂיטָה 的处理
  choice: 克西塔
  alternative: 一百块银子／一百银币
  rationale: 原词的性质和现代等值均不确定；音译并加注释可避免把不确定的古代单位误说成某种已知银币或固定重量。
- issue: 末句复数动词 וַיִּהְיוּ 的指向
  choice: 那地方便归约瑟子孙为产业
  alternative: 它们便归约瑟子孙为产业
  rationale: 希伯来语动词为复数，但上下文最自然的产业对象是雅各所购的地块；直译为“它们”会在中文中很容易误指约瑟的骸骨。正文按语境明确为该处土地，不据此引申额外教义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“骸骨”“产业”保留经文的肃穆感和土地承继含义；句序略作中文化调整，但保留安葬地点、购地主体、卖方、价款和产业归属等全部信息。所有脚注标记均置于所说明的词语之后。
