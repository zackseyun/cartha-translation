  source_fidelity: 译文准确保留了约瑟遗骨、从埃及带上来、安葬、雅各购地、哈抹及其与示剑的关系、价款单位，以及土地归约瑟子孙为产业等核心信息。惟“埋葬在示剑，就是……那块田地”的“就是”会把“示剑”与该地块误作同位关系；原文是“在示剑、在那块田地里”。
  naturalness: 整体庄重、现代且通顺。“约瑟的骸骨”较“约瑟骸骨”更合现代汉语习惯。将地点改为“在示剑……那块田地里”可消除句法歧义并更自然。
  terminology: “以色列子孙”“骸骨”“产业”恰当保留经文语域；“克西塔”及其不确定性的注释处理审慎。“哈抹——示剑之父”的正文和脚注也适当保留原词“父亲”的可能广义。
