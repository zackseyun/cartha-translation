revisions:
- from: 以色列子孙从埃及带上来的约瑟骸骨，他们埋葬在示剑，就是雅各用一百克西塔[a]从示剑的父亲哈抹[b]的子孙手中买下的那块田地[c]；那地方便归约瑟子孙为产业。
  to: 以色列子孙从埃及带上来的约瑟的骸骨，他们埋葬在示剑雅各用一百克西塔[a]从哈抹的子孙手中买下的那块田地[c]里；哈抹是示剑的父亲[b]。那块地便归约瑟子孙为产业。
  rationale: 修正“示剑”与所购地块之间被误作同位语的句法关系，明确安葬是在示剑的该块田地里；并将“哈抹是示剑的父亲”分成独立短句，避免中文长定语造成关系混淆。其余措辞及脚注均可保留。
