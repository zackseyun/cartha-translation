source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוֹשֻׁ֜עַ אֶל הָ/עָ֗ם לֹ֤א תֽוּכְלוּ֙ לַ/עֲבֹ֣ד אֶת יְהוָ֔ה כִּֽי אֱלֹהִ֥ים קְדֹשִׁ֖ים ה֑וּא אֵֽל קַנּ֣וֹא ה֔וּא לֹֽא יִשָּׂ֥א לְ/פִשְׁעֲ/כֶ֖ם וּ/לְ/חַטֹּאותֵי/כֶֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/019.yaml
  text: And Joshua said to the people[a], “You are not able to serve Yahweh, for he is a holy God; he is a jealous God[b]. He will not forgive your transgressions and your sins.”
translation:
  language: zh_hans
  text: 约书亚对百姓说：“你们不能事奉雅威，因为他是圣洁的神[a]，是忌邪的神。你们的过犯和罪，他必不赦免[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “神”和“圣洁”在希伯来文中都是复数形态；按原文字序近似为“神（复数）—圣洁（复数）—他”。但代词“他”是单数，表明这里指以色列的独一之神。
    reason: 说明原文特殊的复数形态及其单数意义，避免正文造成多神误解。
  - marker: b
    text: 或译：“他必不担当（或带走）你们的过犯和罪。”这里的希伯来语惯用表达通常有“赦免”的意思。
    reason: 保留נשא的字面意象及惯用义之间的翻译选择。
lexical_decisions:
- source_word: תֽוּכְלוּ
  choice: 能
  rationale: יכל表示能力或承受能力；与否定词连用译为“不能”，直接保留原文所强调的无力做到。
- source_word: לַעֲבֹד
  choice: 事奉
  rationale: עבד在盟约语境中既指服事，也包含敬拜与效忠；“事奉”比单译“敬拜”涵盖面更广。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语音译保存四字神名所指的专名，而不以“主”这一称号代替。
- source_word: אֱלֹהִים קְדֹשִׁים הוּא
  choice: 他是圣洁的神
  rationale: “神”和“圣洁”在希伯来文中均为复数形态，但随后的代词“他”是单数，明确指以色列独一的神；正文采用自然的汉语单数表达，并以脚注说明形态特点。
- source_word: אֵל קַנּוֹא
  choice: 忌邪的神
  rationale: קַנּוֹא在盟约语境中表示神要求专一效忠、不容竞争者；“忌邪”既保留这种排他性，也避免把它降格为一般人的嫉妒。
- source_word: לֹא יִשָּׂא
  choice: 必不赦免
  rationale: נשא与过犯、罪连用时可构成“担当、除去”进而“赦免”的惯用表达；“必不赦免”清楚传达本节警告的语气。
- source_word: פִשְׁעֲכֶם
  choice: 你们的过犯
  rationale: פשע指违抗权威、破坏盟约的过犯；“过犯”自然且保留违犯的含义。
- source_word: חַטֹּאותֵיכֶם
  choice: 你们的罪
  rationale: חטאת是表示罪的常用词；译作“罪”最直接，并与前面的“过犯”形成原文的并列。
theological_decisions:
- issue: אֱלֹהִים קְדֹשִׁים的复数形态与单数代词并用
  choice: 正文按单数译作“他是圣洁的神”，脚注保留复数形态信息
  alternative: 按形态直译为“他是圣洁的众神”
  rationale: 单数代词הוּא及上下文都表明所指是以色列的独一之神；机械复制复数会在汉语中造成多神含义，而原文并无此意。
- issue: לֹא יִשָּׂא是否应解释为不赦免
  choice: 译作“他必不赦免”
  alternative: 译作“他必不担当／除去”
  rationale: נשא与罪过词汇搭配时常表示赦免；正文传达惯用义，脚注同时保留“担当、带走”的字面可能。
- issue: 本节“不赦免”的绝对警告与其他经文中神赦罪的张力
  choice: 不添加条件，保留约书亚警告的绝对措辞
  alternative: 增译为“若你们背弃他，他就不会赦免”或“不会轻易赦免”
  rationale: 原文没有“轻易”或明说的条件；翻译不应以解释性增补消解经文本身的神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的汉语。“事奉”“忌邪”保留盟约语境与经文语体；句末将“你们的过犯和罪”前置，使警告在汉语中清楚有力。所有脚注标记均置于所说明的短语之后。
