  text: וַ/יַּעֲבֹ֤ד יִשְׂרָאֵל֙ אֶת יְהוָ֔ה כֹּ֖ל יְמֵ֣י יְהוֹשֻׁ֑עַ וְ/כֹ֣ל יְמֵ֣י הַ/זְּקֵנִ֗ים אֲשֶׁ֨ר הֶאֱרִ֤יכוּ יָמִים֙ אַחֲרֵ֣י יְהוֹשֻׁ֔עַ וַ/אֲשֶׁ֣ר יָדְע֗וּ אֵ֚ת כָּל מַעֲשֵׂ֣ה יְהוָ֔ה אֲשֶׁ֥ר עָשָׂ֖ה לְ/יִשְׂרָאֵֽל־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/031.yaml
  text: Israel served Yahweh all the days of Joshua[a], and all the days of the elders who outlived Joshua and who had known all the work of Yahweh that he had done for Israel.
translation:
  language: zh_hans
  text: 在约书亚在世的日子里，以及在那些比约书亚活得更久、认识雅威为以色列所做的一切作为[a]的长老在世的日子里，以色列人都事奉雅威。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “作为”也可译作“事迹”或“所做的一切事”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲבֹד
  choice: 事奉
  rationale: עבד以雅威为宾语时，表示在圣约关系中效忠、服事，也包括敬拜；“事奉”比单用“敬拜”涵盖面更广。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代中文常用音译呈现四字神名，保留其作为以色列之神专名的性质，而不以称号代替。
- source_word: כֹּל יְמֵי
  choice: 在世的所有日子
  rationale: 既保留“所有日子”的希伯来表达，也以“在世”明确其在本句中指一生尚存的时期。
- source_word: הַזְּקֵנִים
  choice: 长老
  rationale: 在以色列共同体语境中，该词兼有年长者及受认可领袖的含义；“长老”不把其中任何一面限定得过窄。
- source_word: הֶאֱרִיכוּ יָמִים אַחֲרֵי יְהוֹשֻׁעַ
  choice: 比约书亚活得更久
  rationale: 这是“在约书亚之后延长日子”的习语，意指这些长老活过了约书亚去世之时。
- source_word: יָדְעוּ
  choice: 知道
  rationale: 保留ידע的基本语义，表示这些长老对雅威作为的亲历性认识；不直接译成“看见”或“经历”，以免缩窄原文。
- source_word: כָּל מַעֲשֵׂה יְהוָה
  choice: 雅威……所行的一切作为
  rationale: מַעֲשֶׂה可指工作、行动或事迹；“作为”在此自然庄重，并能涵盖雅威为以色列所做的各样行动。
- source_word: עָשָׂה לְיִשְׂרָאֵל
  choice: 为以色列所行
  rationale: 介词ל在此语境中表示为以色列施行、使其受益；“为……所行”自然保留这一关系。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名。译作“雅威”以音译方式保留专名，并避免用“主”等称号取代；“耶和华”是中文传统形式，但较不贴近通常重构的发音。
- issue: 以色列“事奉”雅威的含义
  choice: 事奉
  alternative: 敬拜
  rationale: 原文עבד在此包含敬拜，却不限于礼仪行为，也涉及圣约中的忠诚与服从，因此采用含义更宽的“事奉”。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。句子沿用原文的时间框架，将主句置后，使“约书亚在世”和“长老在世”两个时期都清楚修饰以色列人事奉雅威的持续时间。
