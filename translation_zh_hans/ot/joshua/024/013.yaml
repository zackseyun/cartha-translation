source:
  edition: WLC
  text: וָ/אֶתֵּ֨ן לָ/כֶ֜ם אֶ֣רֶץ אֲשֶׁ֧ר לֹֽא יָגַ֣עְתָּ בָּ֗/הּ וְ/עָרִים֙ אֲשֶׁ֣ר לֹא בְנִיתֶ֔ם וַ/תֵּשְׁב֖וּ בָּ/הֶ֑ם כְּרָמִ֤ים וְ/זֵיתִים֙ אֲשֶׁ֣ר לֹֽא נְטַעְתֶּ֔ם אַתֶּ֖ם אֹכְלִֽים׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/013.yaml
  text: And I gave you a land on which you had not labored[a], and cities that you had not built, and you live in them. You are eating from vineyards and olive groves that you did not plant.
translation:
  language: zh_hans
  text: 我赐给你们一片你们未曾在其上劳作[a]的土地，和你们未曾建造的城邑；你们住在其中。你们正在吃你们未曾栽种的葡萄园和橄榄树[b]所产的果实。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “你们未曾在其上劳作”原文中的“你”是单数，把以色列全体视为一个整体；本节其他相关称呼多用复数。
    reason: 保留希伯来文第二人称单复数交替所表达的群体性称呼。
  - marker: b
    text: “橄榄树”也可译作“橄榄”；按栽培场景也可理解为“橄榄园”。
    reason: 说明 זיתים 的词义范围及可行译法。
lexical_decisions:
- source_word: וָאֶתֵּן
  choice: 我……赐给你们
  rationale: נתן 的第一人称单数连续式叙述上帝过去的赐予；“赐给”既准确表达给予，也符合此处上帝施恩的庄重语境。
- source_word: אֶרֶץ אֲשֶׁר לֹא יָגַעְתָּ בָּהּ
  choice: 你们未曾劳作得来的土地
  rationale: יגע 表示劳苦、劳作；原文介词结构直译为“在其中劳作”，中文用“劳作得来的”自然表达这地并非以色列劳力所得，同时不把意义缩窄为单纯耕种。
- source_word: וְעָרִים אֲשֶׁר לֹא בְנִיתֶם
  choice: 又把你们未曾建造的城邑
  rationale: עיר 通常指城；“城邑”庄重而易懂，并保留复数集合意义。“未曾建造”表明建城先于以色列入住。
- source_word: וַתֵּשְׁבוּ בָּהֶם
  choice: 你们就住在其中
  rationale: ישב 在此指居住。连续式可叙述入住，也可凸显如今居住的结果；“就住在其中”自然保留从赐予到居住的承接关系。
- source_word: כְּרָמִים וְזֵיתִים
  choice: 葡萄园和橄榄树
  rationale: כרמים 是葡萄园；זיתים 可指橄榄或橄榄树。选择“橄榄树”比“橄榄园”更直接对应原词，也与后面的“栽种”相合。
- source_word: אַתֶּם אֹכְלִים
  choice: 你们正吃着……所出的果实
  rationale: 独立代词加分词具有凸显主语和正在持续发生之意，故译为“你们正吃着”。原文按希伯来语习惯说吃葡萄园和橄榄树，中文补出隐含的“所出的果实”，避免误解为直接吃园子或树木。
theological_decisions:
- issue: 第二人称在单数与复数之间转换
  choice: 正文统一用复数“你们”，并以脚注说明希伯来文的单复数变化
  alternative: 在正文中将“未曾劳作”译作单数“你”，其余译作“你们”
  rationale: 全节是对以色列全体说话；希伯来文在“你们”中插入一个单数形式，把以色列视作一个整体。现代中文若正文突然改用“你”，容易被误解为更换对象，因此正文保持自然的群体称呼，脚注保存原文特征。
- issue: 葡萄园和橄榄树作为“吃”的宾语
  choice: 明确译出隐含的果实
  alternative: 直译为“你们吃自己未曾栽种的葡萄园和橄榄树”
  rationale: 这里显然指享用这些栽植物的出产。补出“所出的果实”属于中文所需的语义明示，不改变神赐下他人劳作成果这一重点。
translation_notes:
  register: 采用现代、庄重而通顺的普通话。“未曾”“城邑”略带经文庄重感，但仍为普通读者易懂；用“正吃着”体现原文代词加分词的强调和持续状态。
