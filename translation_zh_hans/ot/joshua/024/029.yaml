  text: וַ/יְהִ֗י אַֽחֲרֵי֙ הַ/דְּבָרִ֣ים הָ/אֵ֔לֶּה וַ/יָּ֛מָת יְהוֹשֻׁ֥עַ בִּן נ֖וּן עֶ֣בֶד יְהוָ֑ה בֶּן מֵאָ֥ה וָ/עֶ֖שֶׂר שָׁנִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/029.yaml
  text: And it happened after these things that Joshua son of Nun[a], the servant of Yahweh, died[b], being one hundred and ten years old.
translation:
  language: zh_hans
  text: 这些事以后，嫩的儿子约书亚，耶和华的仆人，死了，享年一百一十岁。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי אַחֲרֵי הַדְּבָרִים הָאֵלֶּה
  choice: 这些事以后
  rationale: וַיְהִי 是希伯来叙事承接形式；现代汉语无需机械译作“事情发生了”，以“这些事以后”自然承接前文，并保留 אַחֲרֵי הַדְּבָרִים הָאֵלֶּה 的时间意义。
- source_word: יְהוֹשֻׁעַ בִּן נוּן
  choice: 嫩的儿子约书亚
  rationale: 按现代中文圣经通行音译处理人名，并保留希伯来语父子关系结构。
- source_word: עֶבֶד יְהוָה
  choice: 耶和华的仆人
  rationale: עֶבֶד 可指仆人或奴仆；此处是对约书亚忠心事奉的尊称，用“仆人”既准确又符合庄重的现代汉语。
- source_word: וַיָּמָת
  choice: 死了
  rationale: מות 直接表示死亡；不以“离世”等委婉说法弱化原文。
- source_word: בֶּן מֵאָה וָעֶשֶׂר שָׁנִים
  choice: 享年一百一十岁
  rationale: 这是表达去世年龄的希伯来习语；“享年”在中文讣叙语境中简洁自然，并准确说明其去世时为一百一十岁。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用四字神名。中文采用读者最熟悉且已成为标准圣经用名的“耶和华”，作为专名呈现，而不是改译为称号“主”。
- issue: עֶבֶד 作为约书亚的称号
  choice: 仆人
  alternative: 奴仆
  rationale: 词义范围容许“奴仆”，但在本处重点是他与耶和华之间尊荣而忠诚的事奉关系；“仆人”保留这一称号的正面分量，不突出受奴役的社会身份。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。“这些事以后”避免生硬照搬希伯来叙事公式；整体保持简洁，符合本节作为约书亚生平结语的语气。
