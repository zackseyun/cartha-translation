reference: Joshua 24:2
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוֹשֻׁ֜עַ אֶל כָּל הָ/עָ֗ם כֹּֽה אָמַ֣ר יְהוָה֮ אֱלֹהֵ֣י יִשְׂרָאֵל֒ בְּ/עֵ֣בֶר הַ/נָּהָ֗ר יָשְׁב֤וּ אֲבֽוֹתֵי/כֶם֙ מֵֽ/עוֹלָ֔ם תֶּ֛רַח אֲבִ֥י אַבְרָהָ֖ם וַ/אֲבִ֣י נָח֑וֹר וַ/יַּעַבְד֖וּ אֱלֹהִ֥ים אֲחֵרִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/002.yaml
  text: 'And Joshua said to all the people[a], “Thus says Yahweh, the God of Israel: Long ago your fathers lived beyond the River—Terah[b], the father of Abraham and the father of Nahor—and they served other gods.”'
translation:
  language: zh_hans
  text: 约书亚对全体百姓说：“耶和华以色列的神如此说：古时，你们的祖先[a]住在大河那边[b]，就是亚伯拉罕和拿鹤的父亲他拉；他们侍奉别的神。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “祖先”原文直译为“父亲们”，这里指先祖或祖辈。
    reason: lexical_alternative
  - marker: b
    text: “大河”很可能指幼发拉底河；“那边”也可译作“河对岸”。
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר יְהוֹשֻׁעַ אֶל כָּל הָעָם
  choice: 约书亚对全体百姓说
  rationale: 顺应希伯来叙事的连续动作，同时以自然的现代汉语表达；“百姓”准确指聚集的以色列群体。
- source_word: כֹּה אָמַר
  choice: 如此说
  rationale: 保留神谕或使者宣告的固定公式，语体庄重而为现代读者所理解。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 直接译出四字神名，并采用现代中文圣经传统中最通行、辨识度最高的形式。
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: 以色列的神
  rationale: 准确表达希伯来语附属结构及耶和华与以色列的关系。
- source_word: מֵעוֹלָם
  choice: 古时
  rationale: 这里指久远的过去，并非形而上的永恒；“古时”简洁、庄重。
- source_word: אֲבוֹתֵיכֶם
  choice: 你们的祖先
  rationale: 上下文指远祖；现代汉语用“祖先”比字面的“父亲们”更准确自然，同时以脚注说明原文形式。
- source_word: בְּעֵבֶר הַנָּהָר
  choice: 住在大河那边
  rationale: 保留原文以“大河”指称特定河流以及“彼岸、那边”的地理视角，不在正文中直接补成专名。
- source_word: תֶּרַח אֲבִי אַבְרָהָם וַאֲבִי נָחוֹר
  choice: 就是亚伯拉罕和拿鹤的父亲他拉
  rationale: 清楚表达他拉与亚伯拉罕、拿鹤的父子关系；汉语不必机械重复两次“父亲”。
- source_word: וַיַּעַבְדוּ אֱלֹהִים אֲחֵרִים
  choice: 他们侍奉别的神
  rationale: “侍奉”保留עבד兼有服事与敬拜的宗教含义；“别的神”不额外解释这些神的性质。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文明确使用四字神名；正文保留专名而不以“主”替代。“耶和华”是普通现代中文读者最熟悉的标准形式。
- issue: אֲבוֹתֵיכֶם 的祖辈称谓
  choice: 你们的祖先
  alternative: 你们的列祖
  rationale: 此处所指是远祖，且下文特别提出他拉。“祖先”在现代汉语中准确自然；脚注保留原文字面为“父亲们”的信息，不借此扩大或缩小所指范围。
- issue: “别的神”的表述
  choice: 别的神
  alternative: 别神
  rationale: 保留原文的多神指称及以色列信仰与其之间的张力，不在译文中加入“所谓”或引号来预先解决其本体论含义。
translation_notes:
  register: 采用现代、庄重且便于朗读的标准普通话。“如此说”保留神谕公式；“侍奉”保留宗教服事与敬拜的双重色彩。破折式同位关系改用“就是”连接，使复数“祖先”与被点名的他拉之间的句法关系在中文中清楚而不过度解释。
