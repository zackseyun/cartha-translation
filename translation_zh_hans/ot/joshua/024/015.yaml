source:
  edition: WLC
  text: וְ/אִם֩ רַ֨ע בְּֽ/עֵינֵי/כֶ֜ם לַ/עֲבֹ֣ד אֶת יְהוָ֗ה בַּחֲר֨וּ לָ/כֶ֣ם הַ/יּוֹם֮ אֶת מִ֣י תַעֲבֹדוּ/ן֒ אִ֣ם אֶת אֱלֹהִ֞ים אֲשֶׁר עָבְד֣וּ אֲבוֹתֵי/כֶ֗ם אֲשֶׁר֙ ב/עבר הַ/נָּהָ֔ר וְ/אִם֙ אֶת אֱלֹהֵ֣י הָ/אֱמֹרִ֔י אֲשֶׁ֥ר אַתֶּ֖ם יֹשְׁבִ֣ים בְּ/אַרְצָ֑/ם וְ/אָנֹכִ֣י וּ/בֵיתִ֔/י נַעֲבֹ֖ד אֶת יְהוָֽה־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/015.yaml
  text: But if it is evil in your eyes to serve Yahweh[a], choose for yourselves today whom you will serve—whether the gods your fathers served beyond the River, or the gods of the Amorites in whose land you are dwelling. But as for me and my house[d][c][b], we will serve Yahweh.
translation:
  language: zh_hans
  text: 但如果你们以侍奉雅威为恶[a]，今天要为自己选择侍奉谁：是你们祖辈[c]在大河[b]那边所侍奉的神，还是你们所住之地的亚摩利人的神。至于我和我家[d]，我们要侍奉雅威。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“你们认为侍奉雅威不好”或“侍奉雅威令你们不悦”；直译是“侍奉雅威在你们眼中是恶”。
    reason: 说明希伯来习语的字面形象及不同语气强度。
  - marker: b
    text: “大河”指幼发拉底河。
    reason: 说明古代地理称谓。
  - marker: c
    text: 或译“你们的祖先”；希伯来文直译为“你们的父辈”。
    reason: 交代原词的字面性别形式与语境中的广义祖先含义。
  - marker: d
    text: “我家”也可译作“我的家人”或“我的全家”。
    reason: 说明 בַּיִת 在此可指家庭或家中成员。
lexical_decisions:
- source_word: רַע בְּעֵינֵיכֶם
  choice: 你们认为……是恶
  rationale: 保留“恶”的强烈评价和“在你们眼中”的主观视角，同时采用现代汉语自然句式；脚注列出较口语、较缓和的可能表达。
- source_word: לַעֲבֹד / תַעֲבֹדוּן / עָבְדוּ / נַעֲבֹד
  choice: 侍奉
  rationale: 全节统一译出同一词根的反复，既包含敬拜，也保留效忠、服事的较广含义。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文四字神名作现代汉语音译，不以称号替代专名。
- source_word: בַּחֲרוּ לָכֶם הַיּוֹם
  choice: 今天就要自己选择
  rationale: “今天”与“就要”传达当下抉择的紧迫感，“自己”体现 לָכֶם 的反身或切身语气。
- source_word: אֱלֹהִים / אֱלֹהֵי
  choice: 神明
  rationale: 语境明确指异教诸神；“神明”在现代汉语中自然，也不会与雅威混同。
- source_word: בְּעֵבֶר הַנָּהָר
  choice: 在大河那边
  rationale: 保留古代近东对幼发拉底河的地理称法，并以脚注说明所指。
- source_word: אֲשֶׁר אַתֶּם יֹשְׁבִים בְּאַרְצָם
  choice: 你们现今所住之地
  rationale: 准确表达分词所指的当前居住状态，并以自然汉语将领属关系连接到亚摩利人。
- source_word: וְאָנֹכִי וּבֵיתִי
  choice: 至于我和我家
  rationale: 体现 אָנֹכִי 的强调与前文的对比；“我家”保留原文“家”的表达，并可涵盖全家成员。
- source_word: נַעֲבֹד
  choice: 我们要侍奉
  rationale: 第一人称复数未完成式在此表达坚定的未来取向或决意；“要”保留决断感而不额外强化为誓言。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用神的专名，故采用较贴近学界通行重构读音的音译“雅威”，而不以“主”这一称号代替。
- issue: עבד 在宗教语境中的范围
  choice: 侍奉
  alternative: 敬拜
  rationale: “敬拜”容易将词义收窄为礼仪行为；“侍奉”能同时容纳敬拜、服事和盟约效忠，并保存本节四次同词根的修辞反复。
- issue: “我和我家”的群体范围与语气
  choice: 我和我家，我们要侍奉雅威
  alternative: 我和我的全家，我们必侍奉雅威
  rationale: 原文 בֵּיתִי 可指房屋、家族或家中成员；正文保留“家”的宽度，脚注说明“家人/全家”的理解。“要”表达决意，但不把未完成式过度确定为带誓言色彩的“必”。
- issue: אֲבוֹתֵיכֶם 的性别与世代含义
  choice: 你们祖辈
  alternative: 你们的父辈；你们的祖先
  rationale: 该阳性复数在此指先世群体。“祖辈”既保留代际关系，也符合现代汉语对远祖的自然称呼；脚注注明其直译形式。
translation_notes:
  register: 采用庄重而通顺的现代标准普通话。“是恶”保留约书亚话语的锋利程度，以脚注提供较缓和的自然译法；全节反复使用“侍奉”，使盟约效忠的主线清晰可见。地名、族名和神名使用简体中文常见形式。
