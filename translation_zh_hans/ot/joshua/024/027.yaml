source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוֹשֻׁ֜עַ אֶל כָּל הָ/עָ֗ם הִנֵּ֨ה הָ/אֶ֤בֶן הַ/זֹּאת֙ תִּֽהְיֶה בָּ֣/נוּ לְ/עֵדָ֔ה כִּֽי הִ֣יא שָׁמְעָ֗ה אֵ֚ת כָּל אִמְרֵ֣י יְהוָ֔ה אֲשֶׁ֥ר דִּבֶּ֖ר עִמָּ֑/נוּ וְ/הָיְתָ֤ה בָ/כֶם֙ לְ/עֵדָ֔ה פֶּֽן תְּכַחֲשׁ֖וּ/ן בֵּ/אלֹהֵי/כֶֽם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/027.yaml
  text: And Joshua said to all the people[a], “Look, this stone will be a witness against us, for it has heard all the words of Yahweh that he spoke with us. And it will be a witness against you[c][b], lest you deny your God.”
translation:
  language: zh_hans
  text: 约书亚对全体百姓说：“看，这块石头必作见证，指证我们[a]，因为它听见了耶和华对我们所说的一切话[b]；它也必作见证，指证你们，免得你们否认你们的上帝[c]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “作见证，指证我们”也可译作“为我们作见证”或“向我们作见证”。希伯来语介词本身可以较为中性；但在上下文中，这见证具有警戒背约、对违约者不利的作用。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“它听见了”；这里把石头拟人化，使它成为立约之言的见证者。
    reason: cultural_note
  - marker: c
    text: “否认”也可译作“以虚假待你们的上帝”或“对你们的上帝失信”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: 看
  rationale: 用现代汉语自然的提示语引人注意，保留原文的指示和强调作用，又避免古雅生硬的表达。
- source_word: הָאֶבֶן הַזֹּאת
  choice: 这块石头
  rationale: אֶבֶן通常指“石头”；量词“块”符合现代汉语习惯，也适合此处立石为约的场景。
- source_word: תִּהְיֶה ... לְעֵדָה
  choice: 要作证
  rationale: 保留עֵדָה在立约语境中的见证、证言含义；“作证”比“成为一个见证”更符合自然汉语。
- source_word: בָּנוּ / בָכֶם
  choice: 指控我们／指控你们
  rationale: 介词ב本身可较中性地表示“对、关于”，但在警戒背约的上下文中具有不利证言的意味；正文译出“指控”，同时用脚注保留较中性的可能。
- source_word: שָׁמְעָה
  choice: 听见了
  rationale: 按原文保留石头“听见”立约之言的拟人表达，不将其释义性改写为单纯的纪念标志。
- source_word: כָּל אִמְרֵי יְהוָה
  choice: 耶和华……所说的一切话
  rationale: “一切话”自然传达אִמְרֵי的言语含义；神名יהוה按现代中文圣经中广为人知的形式译作“耶和华”。
- source_word: אֲשֶׁר דִּבֶּר עִמָּנוּ
  choice: 对我们所说的
  rationale: עִם字面可表示“与”，这里描述耶和华向立约群体说话；现代汉语用“对我们说”最自然，且不排除立约互动的背景。
- source_word: פֶּן
  choice: 免得
  rationale: 准确表达警戒和防止某事发生的语气，并保持庄重简洁。
- source_word: תְּכַחֲשׁוּן בֵּאלֹהֵיכֶם
  choice: 背弃你们的上帝
  rationale: כחש与ב连用可表示否认、虚假相待或不忠；“背弃”在此立约语境中自然表达对上帝失信，同时脚注列出其他可能。
theological_decisions:
- issue: 石头被描述为听见并作证
  choice: 按原文保留完整的拟人说法
  alternative: 将石头解释性译成仅仅提醒百姓守约的纪念物
  rationale: 原文明确说石头“听见了”并“作证”；保留这种立约仪式中的修辞，避免在翻译中把神学意象简化为解释。
- issue: 石头的证言是中性见证还是不利指控
  choice: 正文采用“作证指控”，脚注保留“为我们／向我们作见证”的可能
  alternative: 正文只译“作我们的见证／向我们作见证”
  rationale: 介词ב允许较中性的理解，但本节结尾警告百姓不可背弃上帝，使证言带有针对违约者的不利效力；脚注保留原文真实的语义幅度。
- issue: כחש所指的是口头否认还是立约不忠
  choice: 正文译“背弃”，脚注说明也可译“否认”或“以虚假待”
  alternative: 只译作“否认你们的上帝”
  rationale: 在立约警告中，该词不必局限于口头否认；“背弃”能表达关系和盟约上的不忠，但不应遮蔽其他词义，故以脚注保存张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。以“看”保留提示力，以“作证指控”体现立约审判语境，同时通过脚注保存介词的歧义；保留“石头听见”的拟人修辞和前后重复的作证语言。
