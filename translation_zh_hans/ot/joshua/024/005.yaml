  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וָ/אֶשְׁלַ֞ח אֶת מֹשֶׁ֤ה וְ/אֶֽת אַהֲרֹן֙ וָ/אֶגֹּ֣ף אֶת מִצְרַ֔יִם כַּ/אֲשֶׁ֥ר עָשִׂ֖יתִי בְּ/קִרְבּ֑/וֹ וְ/אַחַ֖ר הוֹצֵ֥אתִי אֶתְ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/005.yaml
  text: Then I sent Moses and Aaron[a], and I struck Egypt as I did in its midst[b], and afterward I brought you out.
translation:
  language: zh_hans
  text: 随后，我差遣摩西和亚伦，又照着我在埃及境内所行的事击打埃及[a][b]；之后，我把你们领了出来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“使埃及遭灾”。希伯来语动词可指“击打”或“使受苦、受灾”，此处指耶和华对埃及的打击。
    reason: lexical_alternative
  - marker: b
    text: 直译：“照着我在它中间所行的”；“它”指埃及。
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶשְׁלַח
  choice: 我差遣
  rationale: שׁלח的基本义是“派遣、差遣”；此处指上帝委派摩西和亚伦，“差遣”自然且庄重。
- source_word: מֹשֶׁה וְאֶת אַהֲרֹן
  choice: 摩西和亚伦
  rationale: 采用现代中文圣经人名的通行译法。
- source_word: וָאֶגֹּף
  choice: 我……击打
  rationale: נגף可指击打、重创或使受灾；“击打”保留希伯来文直接而有力的表达，不把所指预先限定为“降下十灾”。
- source_word: מִצְרַיִם
  choice: 埃及
  rationale: 此专名在语境中可兼指埃及地及其民众；中文以“埃及”保留这种整体性。
- source_word: כַּאֲשֶׁר עָשִׂיתִי בְּקִרְבּוֹ
  choice: 照着我在埃及境内所行的事
  rationale: כַּאֲשֶׁר引出方式或对应关系，בְּקִרְבּוֹ直指“在它中间”；译文保留压缩的句法关系，同时以“埃及境内”明确单数代词的自然所指。
- source_word: וְאַחַר
  choice: 之后
  rationale: אַחַר在此作时间副词，标示继起次序。
- source_word: הוֹצֵאתִי אֶתְכֶם
  choice: 我把你们领了出来
  rationale: יצא的使役式意为“使出来、带出来”；“领了出来”符合出埃及语境，并保留第二人称复数的直接称呼。
theological_decisions:
- issue: 第二人称复数“你们”的所指
  choice: 保留“我把你们领了出来”，让上帝直接对以色列群体说话
  alternative: 解释性改译为“我把你们的祖先领了出来”
  rationale: 希伯来文直接使用第二人称复数，体现当下听众与出埃及世代的群体性、盟约性连带；译文不把这种修辞和神学张力消解为祖先称谓。
- issue: 击打埃及的具体内涵
  choice: 译作“击打埃及”
  alternative: 译作“使埃及遭灾”或“降灾于埃及”
  rationale: 上下文显然使人联想到埃及诸灾，但נגף本身的语义较宽；采用“击打”可避免把词义完全收窄，同时让语境传达灾祸的背景。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“随后……之后”清楚呈现叙事次序；“照着我在埃及境内所行的事”尽量保留原文压缩而略带含混的结构，不擅自详列为十灾。所有脚注标记均置于其所说明的主句之后。
