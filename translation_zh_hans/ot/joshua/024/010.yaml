id: JOS.24.10
reference: Joshua 24:10
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/לֹ֥א אָבִ֖יתִי לִ/שְׁמֹ֣עַ לְ/בִלְעָ֑ם וַ/יְבָ֤רֶךְ בָּרוֹךְ֙ אֶתְ/כֶ֔ם וָ/אַצִּ֥ל אֶתְ/כֶ֖ם מִ/יָּדֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/010.yaml
  text: But I was not willing to listen to Balaam[a], and he indeed blessed you; so I delivered you from his hand.
translation:
  language: zh_hans
  text: 但我不肯听从巴兰，他反而确实祝福了你们[a]；我就把你们从他手中救了出来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文采用同根动词的强调结构，直译近于“祝福，他确实祝福了你们”；按上下文也可译作“他一再祝福你们”。
    reason: 说明希伯来文强调结构，并保留其可表达强烈肯定或反复行动的解释空间。
lexical_decisions:
- source_word: אָבִיתִי
  choice: 不肯
  rationale: 该动词表达意愿或同意，而非能力；“不肯”简洁保留了上帝主动拒绝的意志色彩。
- source_word: לִשְׁמֹעַ לְבִלְעָם
  choice: 听从巴兰
  rationale: שׁמע 与介词 ל 连用常指听从、理会某人；“听从”比单纯的“听见”更准确。
- source_word: וַיְבָרֶךְ בָּרוֹךְ
  choice: 他反而确实祝福了
  rationale: 第三人称单数的自然主语是紧接在前的巴兰；同根不定式加强动词语气。“确实”保留强调作用，又避免把这种结构限定为动作反复。“反而”自然呈现巴兰原想咒诅、结果却祝福的语境转折。
- source_word: וָאַצִּל
  choice: 救了出来
  rationale: נצל 表示救出、解救；这一表达自然清楚，同时不额外引入超出本节的神学含义。
- source_word: מִיָּדוֹ
  choice: 从他手中
  rationale: 保留希伯来文以“手”表示权势或控制的形象，在现代汉语中也容易理解。
theological_decisions:
- issue: 巴兰祝福的施事者
  choice: 将“他”理解为巴兰，由巴兰给以色列人祝福
  alternative: 将隐含主语理解为上帝，即“我再三祝福了你们”
  rationale: 希伯来文动词为第三人称阳性单数，前文最近的对应人物是巴兰，因此巴兰是最自然的语法主语；上下文同时表明，上帝挫败并扭转了巴兰的意图。译文不把这种神圣主权改写成原文没有明说的使役结构。
- issue: 同根不定式的语气
  choice: 译为“确实祝福了”并以脚注说明
  alternative: 译为“一再祝福了”或“连连祝福了”
  rationale: 该结构明确具有强调作用，但本身未必单独编码动作次数；“确实”保留强调，也让民数记所呈现的多次祝福这一语境含义保持开放。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“不肯听从”“从他手中救了出来”既贴近原文，也符合当代普通读者的表达习惯；标点呈现两个连续行动之间的关系，但不把后一句过度解释为严格的因果结论。
