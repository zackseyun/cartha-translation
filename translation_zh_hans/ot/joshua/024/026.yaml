base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/026.yaml
  text: And Joshua wrote these words in the Book of the Law of God[b][a], and he took a large stone and set it up there under the oak that was in the sanctuary of Yahweh.
translation:
  language: zh_hans
  text: 约书亚把这些话写在上帝的律法书里；又取了一块大石头，把它立在那里的橡树[a]下，那棵树在耶和华的圣所中[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“笃耨香树”。希伯来语所指的树种并不确定，可能不是橡树。
    reason: lexical_alternative
  - marker: b
    text: 或译“那棵树在耶和华的圣所旁”。这里的希伯来语介词按语境也可作较宽泛的空间理解。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּכְתֹּב
  choice: 写
  rationale: כתב在此直接表示书写；译作“写”比“记载”更贴近原文动作。
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: 这些话
  rationale: דברים可指话、事情或事项；这里指写入书中的盟约言辞，译作“这些话”最符合语境。
- source_word: בְּסֵפֶר תּוֹרַת אֱלֹהִים
  choice: 在上帝的律法书上
  rationale: 保留ספר、תורה和אלהים的修饰关系；“律法书”自然表达承载上帝律法或训诲的文献。“上”符合现代汉语书写习惯。
- source_word: וַיִּקַּח אֶבֶן גְּדוֹלָה
  choice: 取来一块大石头
  rationale: גדולה在此描述石头的体量，译作“大”简明自然；“取来”表达拿取并用于随后竖立的动作。
- source_word: וַיְקִימֶהָ
  choice: 把它立
  rationale: קום的使役形表示使石头站立，即将它竖立起来；“立”简洁而准确。
- source_word: תַּחַת הָאַלָּה
  choice: 在那棵橡树下
  rationale: אלה指一种大型树木，具体树种存在争议；正文采用读者熟悉的“橡树”，并以脚注保留“笃耨香树”的可能。
- source_word: בְּמִקְדַּשׁ יְהוָה
  choice: 在耶和华的圣所中
  rationale: מקדש表示圣所或圣地，介词ב通常表示“在……中”；正文保留这一直接空间意义，同时以脚注说明也可能是较宽泛的“在……旁”。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文读者熟悉的专名“耶和华”音译四字神名，保留其作为以色列之上帝立约圣名的性质，而不以头衔代替。
theological_decisions:
- issue: 四字神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 正文采用现代中文圣经传统中最广为人知的专名形式“耶和华”；两者都是对四字神名的音译尝试，均保留专名性质，不改译为“主”。
- issue: 树木与מקדש יהוה的空间关系
  choice: 这树在耶和华的圣所中
  alternative: 这树在耶和华的圣所旁
  rationale: 介词ב的基本意义支持“在……中”，故正文依原文直译，不因圣所中有树看似出人意料而消解张力；同时脚注保留按语境作较宽泛空间理解的可能。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“上帝的律法书”保留原文结构；将较长的希伯来语并列句分为两句，并用分号清楚交代关系从句所修饰的是树。所有不确定性均通过紧邻相关词语的脚注标记呈现。
