  text: וְ/עַתָּ֕ה הָסִ֛ירוּ אֶת אֱלֹהֵ֥י הַ/נֵּכָ֖ר אֲשֶׁ֣ר בְּ/קִרְבְּ/כֶ֑ם וְ/הַטּוּ֙ אֶת לְבַבְ/כֶ֔ם אֶל יְהוָ֖ה אֱלֹהֵ֥י יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/023.yaml
  text: So now[a], remove the foreign gods that are among you, and turn your heart to Yahweh[b], the God of Israel.
translation:
  language: zh_hans
  text: “所以现在，你们要除掉你们中间的外邦神明，把你们的心转向雅威[a]，以色列的上帝。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “雅威”音译希伯来文的神名 יהוה；其古代准确读音不能完全确定。传统中文常译作“耶和华”，许多译本依犹太诵读传统译作“主”。
    reason: 说明神名的源文形式、读音不确定性及主要中文译法。
lexical_decisions:
- source_word: וְעַתָּה
  choice: 所以现在
  rationale: וְ与עַתָּה承接上文并引出当下的劝告；“所以现在”在现代汉语中自然地表达这一推论和转折作用。
- source_word: הָסִירוּ
  choice: 除掉
  rationale: 该使役词形在此意为移除、摒除；“除掉”保留命令的明确力度，也适合以异教神明为宾语。
- source_word: אֱלֹהֵי הַנֵּכָר
  choice: 外邦神明
  rationale: 这一短语指外族或外邦敬拜的神，并非仅指“奇怪的神”；“外邦神明”清楚而庄重。
- source_word: אֲשֶׁר בְּקִרְבְּכֶם
  choice: 你们中间的
  rationale: בְּקִרְבְּכֶם在此首先表示存在于群体当中；此译法避免把它过度心理化为“在你们里面”。
- source_word: וְהַטּוּ אֶת־לְבַבְכֶם
  choice: 把你们的心转向
  rationale: נטה本义为使之倾斜、转向；与“心”和方向介词连用时，表示使内在意志和忠诚转向某对象。“你们的心”保留希伯来文集体单数的表达。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以通行的学术性汉语音译呈现四字神名，区别于将其替换为称号“主”，并与源文直接使用神名相对应。
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: 以色列的上帝
  rationale: 直译这一限定性属格结构，明确雅威是以色列的上帝。
theological_decisions:
- issue: 四字神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 源文直接使用盟约神名。采用“雅威”可保留专名性质，并较接近现代学界通常重构的读音；脚注同时说明传统译名和犹太诵读惯例，不把某一发音重构说成完全确定。
- issue: “心”是集体单数还是复数
  choice: 你们的心
  alternative: 你们的心思；你们的心都
  rationale: 希伯来文名词为单数、后接第二人称复数词尾，既涉及每个人，也把全体视为共同回应的群体；直译为“你们的心”保留这一张力。
translation_notes:
  register: 采用现代、庄重而易懂的命令句。“外邦神明”比“外国的神”更符合宗教语境；“把你们的心转向”既保留方向性隐喻，也不额外加入“专一”“全心”等源文未明说的限定。
