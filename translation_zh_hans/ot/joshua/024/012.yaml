base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/012.yaml
  text: And I sent the hornet ahead of you[a], and it drove them out before you—the two kings of the Amorites—not by your sword and not by your bow.
translation:
  language: zh_hans
  text: 我差遣黄蜂[a]在你们前面；它把他们，就是亚摩利人的两个王，从你们面前赶出去；不是靠你的刀，也不是靠你的弓。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “黄蜂”也可能是比喻说法，指上帝所降的恐慌或惊惧，而不一定是指实际的黄蜂。
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶשְׁלַח
  choice: 我差遣
  rationale: 这是שׁלח的Qal连续式第一人称单数，叙述耶和华过去的行动；中文以“我差遣”自然承接上下文，无须机械译出连接词。
- source_word: לִפְנֵיכֶם
  choice: 在你们前面
  rationale: 字面为“在你们面前”，在此表示先于以色列人前行；“在你们前面”既贴近原文，也符合军事语境。
- source_word: הַצִּרְעָה
  choice: 黄蜂
  rationale: 该词通常指黄蜂；带定冠词的单数可作集合性或代表性用法。正文保留具体词义，不把可能的比喻解释直接写入译文。
- source_word: וַתְּגָרֶשׁ אוֹתָם
  choice: 把他们……赶出去
  rationale: גרשׁ意为“赶出、驱逐”；阴性单数动词与“黄蜂”一致。中文采用把字句，使动作及宾语关系清楚自然。
- source_word: מִפְּנֵיכֶם
  choice: 从你们面前
  rationale: 与גרשׁ连用，表示将敌人从以色列人面前驱离；此译保留原文空间意象。
- source_word: שְׁנֵי מַלְכֵי הָאֱמֹרִי
  choice: 亚摩利人的两个王
  rationale: 贴近希伯来语结构，同时在现代汉语中清楚自然；同位说明用于明确“他们”所指。
- source_word: לֹא בְחַרְבְּךָ וְלֹא בְקַשְׁתֶּךָ
  choice: 这不是靠你的刀，也不是靠你的弓
  rationale: 介词ב表示凭借的手段；“靠”准确表达工具意义。保留第二人称单数，以反映希伯来文本从群体复数转为代表性单数的措辞。
theological_decisions:
- issue: הַצִּרְעָה应按字面译为黄蜂，还是解释为神所降的恐慌或惊惧
  choice: 正文译为“黄蜂”
  alternative: 正文译为“恐慌”或“惊惧”
  rationale: 该名词的直接词义是“黄蜂”，语境并未迫使译者将其抽象化。保留具体意象，也不削弱本节强调神亲自驱逐敌人的重点；可能的比喻理解置于脚注，以保存真实的解释空间。
- issue: 末句第二人称单数的表达
  choice: 保留为“你的刀……你的弓”
  alternative: 按群体意义译为“你们的刀……你们的弓”
  rationale: 原文此前使用复数“你们”，末句却使用单数后缀。正文保留这一数的转换，避免静默消除原文可能将以色列作为整体或以代表性单数称呼的修辞张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“差遣”“赶出去”兼顾经文语体与普通读者的可懂度；以分号突出末句对以色列武力的否定。正文中的脚注标记[a]与脚注一致。
