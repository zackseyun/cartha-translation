base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/020.yaml
  text: If you forsake Yahweh and serve foreign gods[a], then he will turn and do you harm and consume you[b], after he has done good to you.
translation:
  language: zh_hans
  text: 你们若离弃耶和华，事奉外邦的神，他必转而降祸给你们[a]，灭绝你们[b]；此前他曾恩待你们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“加害于你们”。这里的动词指使伤害或灾祸临到，并非说道德意义上的作恶。
    reason: lexical_alternative
  - marker: b
    text: 或译“把你们完全除灭”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 若
  rationale: 本句承接立约警告，引出条件及其后果；“若”自然体现这一条件关系。
- source_word: תַעַזְבוּ
  choice: 离弃
  rationale: 这里指背弃与耶和华的关系和盟约忠诚；“离弃”比一般的“离开”更贴合语境。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文读者熟悉的神名音译，不以“主”这一称号代替原文的专名。
- source_word: וַעֲבַדְתֶּם
  choice: 事奉
  rationale: עבד用于神明时表示宗教性的服事与敬拜；“事奉”兼顾字面意义和礼拜语境。
- source_word: אֱלֹהֵי נֵכָר
  choice: 外族的神
  rationale: 原文指属于外族、与以色列所敬奉的耶和华相异的神明；此译自然且保留其关系性含义。
- source_word: וְשָׁב
  choice: 他就会转而
  rationale: שוב在此表示耶和华对待以色列的方式发生逆转；“转而”保留这种转变，不额外规定其机制。
- source_word: וְהֵרַע לָכֶם
  choice: 降祸给你们
  rationale: Hiphil形式在此表示使灾祸临到、加害，而非说道德意义上的“作恶”；“降祸”也保留神直接施行审判的语气。
- source_word: וְכִלָּה אֶתְכֶם
  choice: 灭绝你们
  rationale: כלה表示使之终结、完全毁灭；“灭绝”在现代中文中清楚传达其严厉程度。
- source_word: אַחֲרֵי אֲשֶׁר הֵיטִיב לָכֶם
  choice: 尽管他先前曾恩待你们
  rationale: 原文直译为“在他恩待你们之后”；中文以“尽管……先前……”自然表达时间先后及强烈反差，同时不削弱审判警告。
theological_decisions:
- issue: 神在先前施恩之后亲自施行审判
  choice: 保留耶和华转而降祸并灭绝百姓的直接施事关系
  alternative: 将灾祸弱化为偶像崇拜自然产生的后果
  rationale: 原文明确以耶和华为 וְהֵרַע 和 וְכִלָּה 的主语，把灾祸和灭绝归于他对背约的司法回应；译文不淡化这一神学张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“耶和华”保留神的专名；“事奉”“降祸”“灭绝”符合经文的立约和审判语境，又能为普通读者理解。所有脚注标记均置于对应词语之后。
