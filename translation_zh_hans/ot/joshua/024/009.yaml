  text: וַ/יָּ֨קָם בָּלָ֤ק בֶּן צִפּוֹר֙ מֶ֣לֶךְ מוֹאָ֔ב וַ/יִּלָּ֖חֶם בְּ/יִשְׂרָאֵ֑ל וַ/יִּשְׁלַ֗ח וַ/יִּקְרָ֛א לְ/בִלְעָ֥ם בֶּן בְּע֖וֹר לְ/קַלֵּ֥ל אֶתְ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/009.yaml
  text: Then Balak son of Zippor[a], king of Moab, arose and fought against Israel[b]. He sent and called Balaam son of Beor to curse you.
translation:
  language: zh_hans
  text: 于是，摩押王西拨的儿子巴勒起来[a]，与以色列争战[b]。他派人召比珥的儿子巴兰来咒诅你们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“奋起”。这里的希伯来语动词也可表示开始采取果断行动。
    reason: lexical_alternative
  - marker: b
    text: 或译“向以色列开战”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: 起来
  rationale: קום在叙事中既可指起身，也常表示开始采取行动。“起来”保留原文简洁的叙事推进及其一定程度的含混性。
- source_word: וַיִּלָּחֶם בְּיִשְׂרָאֵל
  choice: 与以色列争战
  rationale: לחם与介词ב连用在此表示敌对交战；“与以色列争战”自然、庄重，并保留原文直接陈述的战争含义。
- source_word: וַיִּשְׁלַח וַיִּקְרָא
  choice: 他派人召
  rationale: 原文依次使用“派遣”和“召唤”两个动词。汉语“派人召”简明自然，并涵盖派遣使者召人的动作，而不增添原文没有的细节。
- source_word: לְבִלְעָם בֶּן בְּעוֹר
  choice: 比珥的儿子巴兰
  rationale: 依照现代简体中文圣经人名的通行音译处理，并按自然汉语语序表达父子关系。
- source_word: לְקַלֵּל אֶתְכֶם
  choice: 来咒诅你们
  rationale: קלל在此指对人施加或宣告咒诅；“咒诅你们”直接表达其敌对目的。“来”自然标明召巴兰的目的。
theological_decisions:
- issue: 《约书亚记》的概述称巴勒“与以色列争战”，而《民数记》主要叙述他借巴兰咒诅以色列
  choice: 保留原文的直接陈述“与以色列争战”
  alternative: 弱化为“敌对以色列”“准备与以色列交战”，或按其他经文省去直接交战的含义
  rationale: 希伯来文本明确使用וַיִּלָּחֶם בְּיִשְׂרָאֵל。翻译不应为消除经文间可能存在的叙事张力而改写本节；如何理解其历史概述属于释经层面。
translation_notes:
  register: 采用现代、庄重而易懂的普通话书面语。“于是”承接叙事；人名和地名使用简体中文圣经传统中的通行译名。句法适度贴近希伯来文，同时以“派人召”避免生硬直译“派遣并召唤”。
