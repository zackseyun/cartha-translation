base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/025.yaml
  text: So Joshua made a covenant with the people on that day[b][a], and there in Shechem he set for them a statute and an ordinance.
translation:
  language: zh_hans
  text: 那一天，约书亚与百姓立约[a]，并在示剑为他们立下律例和典章[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “立约”按希伯来语字面为“切约”，是订立盟约的惯用说法。
    reason: lexical_alternative
  - marker: b
    text: “典章”也可译作“裁决”或“法则”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּכְרֹת ... בְּרִית
  choice: 立约
  rationale: 希伯来语直译为“切约”，是订立盟约的固定表达；现代汉语用“立约”既自然，也保留其正式、约束性的含义。
- source_word: לָעָם
  choice: 与百姓
  rationale: 介词ל本可表示“给、为”，但在“立约”的语境中表达百姓作为立约关系的参与方；译作“与百姓”可避免误解为约书亚单方面替百姓立约。
- source_word: בַּיּוֹם הַהוּא
  choice: 那一天
  rationale: 直接保留原文的时间指示，并自然承接前文叙事。
- source_word: וַיָּשֶׂם
  choice: 立下
  rationale: שׂים基本义为“放置、设立”；与法律性名词连用时，“立下”在现代汉语中自然，并保留制定、确立规范的意味。
- source_word: ל֛וֹ
  choice: 为他们
  rationale: 原文代词在语法上为阳性单数，回指作为集合单数的“百姓”；汉语按实际所指译为复数“他们”。
- source_word: חֹק
  choice: 律例
  rationale: 该词指固定、规定下来的法令或条例；“律例”保留法律性，也符合庄重而易懂的圣经语体。
- source_word: מִשְׁפָּט
  choice: 典章
  rationale: 此处与חֹק并列，指司法性的规定、裁决或法则；“典章”能与“律例”形成自然搭配，同时脚注保留“裁决”的可能含义。
- source_word: בִּשְׁכֶם
  choice: 在示剑
  rationale: 如实保留立约与设立规范的地点，不额外加入原文没有的方位副词。
theological_decisions:
- issue: 约书亚立约行动的性质
  choice: 约书亚与百姓立约
  alternative: 约书亚为百姓立约；约书亚代表百姓重申上主的约
  rationale: 本节明确以约书亚为行动主体，却没有在本句中明说另一立约方是上主，也没有直接使用“重申”一词。正文按原文表层表达，避免把上下文中的神学解释直接加入本节。
- issue: חֹק וּמִשְׁפָּט所指的法律内容
  choice: 律例和典章
  alternative: 律例和裁决；定例和法则
  rationale: 原文使用两个意义相近但并非完全相同的法律词汇。译文保留两个并列名词，不将其简化为一个概念；脚注说明מִשְׁפָּט也可能侧重司法裁决。
translation_notes:
  register: 采用现代、庄重而清楚的普通话。“立约”“律例和典章”保留经文的盟约与法律语域；句序基本顺从希伯来文，同时用“并”明确两个连续行动。
