base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/022.yaml
  text: Then Joshua said to the people[a], “You are witnesses against yourselves that you have chosen Yahweh for yourselves, to serve him.” And they said, “We are witnesses.”
translation:
  language: zh_hans
  text: 约书亚对百姓说：“你们是指证自己的见证人，因为你们已经为自己选择了雅威，要事奉他。”他们说：“我们是见证人。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: 未另译连接词 וַ，以符合现代汉语叙事衔接；上下文自然体现事件推进。
- source_word: הָעָם
  choice: 百姓
  rationale: 这里指聚集的以色列民众；“百姓”自然、庄重，也符合旧约语境。
- source_word: עֵדִים אַתֶּם בָּכֶם
  choice: 你们自己可以作证
  rationale: 保留 בָּכֶם 所强调的自我指涉，即他们自己的话为其选择作证；正文避免把其法律作用单向解释为“控告自己”。
- source_word: כִּי
  choice: （以逗号引出见证内容）
  rationale: כִּי 在此引出见证的内容；现代汉语无需机械译成“因为”或“表明”。
- source_word: בְּחַרְתֶּם לָכֶם
  choice: 是你们亲自选择了
  rationale: “亲自”表达 לָכֶם 的反身强调，突出这是百姓自己的选择，同时保持汉语自然。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者最熟悉的专名形式音译四字神名，保留其作为名字而非称号的性质。
- source_word: לַעֲבֹד אֹתוֹ
  choice: 要事奉他
  rationale: “事奉”兼含效忠、服事与敬拜，比单译“敬拜”更完整地对应 עבד 的盟约语境。
- source_word: וַיֹּאמְרוּ עֵדִים
  choice: 他们说：“我们可以作证。”
  rationale: 原文答语省略主语与系词；按现代汉语补足“我们可以”，使其与前句自然呼应。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用四字神名，故正文采用中文传统且广为识别的专名“耶和华”，不以“主”这一称号替代；“雅威”是较贴近学术重构读音的另一译法。
- issue: בָּכֶם 的见证指向
  choice: 你们自己可以作证
  alternative: 你们是控告自己的见证人
  rationale: 希伯来语可表示百姓自己的言语为其选择作证，并可能带有将来反过来对他们不利的法律意味。正文保留自我见证的基本含义，脚注说明较强的法律性理解，避免消除原文张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“百姓”“事奉”保留经文语体但并不古奥；句式简洁，维持盟约场景中的郑重问答。
