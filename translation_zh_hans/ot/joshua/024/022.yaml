revisions:
- from: 约书亚对百姓说：“你们自己可以作证[a]，是你们亲自选择了耶和华，要事奉他。”他们说：“我们可以作证。”
  to: 约书亚对百姓说：“你们是指证自己的见证人，因为你们已经为自己选择了雅威，要事奉他。”他们说：“我们是见证人。”
  rationale: 修订恢复“见证人”的陈述语气及百姓答语的对应关系，明确但不过度扩展自我指证的法律含义；脚注保留较弱的自我见证理解。并将神名统一为与 Yahweh 相对应的“雅威”。
