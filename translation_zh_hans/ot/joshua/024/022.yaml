  timestamp: '2026-07-14T05:21:08Z'
review_pass:
  verdict: revise
  source_fidelity: 正文将“你们是见证人”弱化为“你们自己可以作证”，把身份／法律性的宣告误成能力或许可；答语同样不应译为“我们可以作证”。此外，按审校轨迹，יהוה 应以对应 Yahweh 的“雅威”呈现，而非“耶和华”。修订保留 בכם 可含的自我指证意味，并以脚注说明较弱的替代理解。
  naturalness: “你们是指证自己的见证人”在法律—盟约场景中自然且庄重；“我们是见证人”简洁地保留原文省略式答语的断然语气。
  terminology: 以“雅威”对应原文四字神名及英语审校轨迹的 Yahweh；“事奉”恰当涵盖 עבד 的盟约性服事与效忠。
  issues:
  - severity: medium
    issue: “可以作证”误译见证人的身份陈述
    rationale: עֵדִים אַתֶּם 的直义是“你们是见证人”，并非“你们能够作证”。这也使百姓的回答失去其确认自身见证人身份的作用。
  - severity: medium
    issue: 正文未呈现 בָּכֶם 的法律性自我指证方向
    rationale: 在此盟约语境中，该介词短语通常表达他们的见证将归到他们自己身上、可用以指证他们。可用脚注保留“你们自己是见证人”的较弱理解。
  - severity: medium
    issue: 神名译法未与既定 Yahweh 审校轨迹一致
    rationale: 审校轨迹明确采用 Yahweh；中文正文宜用“雅威”作为相应的专名音译，而不改用传统的“耶和华”。
  revised_text: 约书亚对百姓说：“你们是指证自己的见证人，因为你们已经为自己选择了雅威，要事奉他。”他们说：“我们是见证人。”
  revised_footnotes:
  - marker: a
    text: 或译：“你们自己是见证人。”这里的“在你们身上／你们当中”可指你们自己的话为所作的选择作证；在盟约的法律语境中，也可含这些见证将用来指证你们自己的意思。
    reason: 说明 עֵדִים אַתֶּם בָּכֶם 的替代语义，并保留其法律性张力。
  revision_rationale: 修订恢复“见证人”的陈述语气及百姓答语的对应关系，明确但不过度扩展自我指证的法律含义；脚注保留较弱的自我见证理解。并将神名统一为与 Yahweh 相对应的“雅威”。
