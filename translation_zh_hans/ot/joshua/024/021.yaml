  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר הָ/עָ֖ם אֶל יְהוֹשֻׁ֑עַ לֹ֕א כִּ֥י אֶת יְהוָ֖ה נַעֲבֹֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/021.yaml
  text: But the people said to Joshua[a], “No, but we will serve Yahweh.”
translation:
  language: zh_hans
  text: 百姓却对约书亚说：“不！我们定要事奉耶和华[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文为“YHWH”（יהוה），通常重构读作“雅威”；传统中文译作“耶和华”。
    reason: 说明神名的原文形式与两种主要中文处理方式。
lexical_decisions:
- source_word: וַיֹּאמֶר הָעָם
  choice: 百姓却说
  rationale: וַיֹּאמֶר是叙事中引出话语的常用形式；主语虽为集合名词הָעָם，希伯来文仍可用单数动词。结合前文约书亚的警告，以“却”自然呈现答复中的反向语气。
- source_word: אֶל יְהוֹשֻׁעַ
  choice: 对约书亚
  rationale: אֶל标明说话对象；人名按现代中文圣经通行形式译作“约书亚”。
- source_word: לֹא כִּי
  choice: 不！……定要
  rationale: לֹא独立而有力地否定约书亚上一节所说“你们不能事奉耶和华”；此处כִּי带纠正或强调作用，可理解为“不是，反而/确实”。译文以断句和“定要”表达这种坚决纠正，避免生硬直译为连接词。
- source_word: אֶת יְהוָה
  choice: 耶和华
  rationale: אֵת是直接宾语标记，中文不另译；יְהוָה是以色列上帝的专名，正文采用中文传统且广为人知的“耶和华”，并以脚注说明原文形式及另一常见音译。
- source_word: נַעֲבֹד
  choice: 我们定要事奉
  rationale: עבד的Qal未完成式第一人称复数在此表达坚定意愿；“事奉”兼顾敬拜、服从和忠诚，不将含义窄化为礼仪性“敬拜”。“定要”传达答复的决断语气。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名，而非普通称号“主”。正文保留专名性质，采用现代中文读者最熟悉的传统形式“耶和华”；脚注列出原文YHWH及较贴近学界重构读音的“雅威”，不把读音重构说成完全确定。
- issue: עבד在盟约语境中的范围
  choice: 事奉
  alternative: 敬拜
  rationale: 这里不仅涉及宗教礼仪，也包含归属、顺服和盟约忠诚；“事奉”较完整地保留该词的语义张力。
- issue: לֹא כִּי的答复力度
  choice: 不！我们定要
  alternative: 不是，我们反要
  rationale: 百姓是在否定约书亚关于他们不能事奉耶和华的断言，并重申自己的选择。译文保留坚定的反驳，但不额外判断他们的承诺是否真诚或能否履行。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“百姓”符合以色列盟约群体的语境；感叹号与“定要”表现原文简短、坚决的回应。所有脚注标记均已置于正文相应位置。
