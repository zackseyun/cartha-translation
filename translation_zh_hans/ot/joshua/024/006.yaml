  text: וָֽ/אוֹצִ֤יא אֶת אֲבֽוֹתֵי/כֶם֙ מִ/מִּצְרַ֔יִם וַ/תָּבֹ֖אוּ הַ/יָּ֑מָּ/ה וַ/יִּרְדְּפ֨וּ מִצְרַ֜יִם אַחֲרֵ֧י אֲבוֹתֵי/כֶ֛ם בְּ/רֶ֥כֶב וּ/בְ/פָרָשִׁ֖ים יַם סֽוּף־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/006.yaml
  text: Then I brought your fathers out from Egypt[a], and you came to the sea; and the Egyptians pursued your fathers with chariots and horsemen to the Red Sea.
translation:
  language: zh_hans
  text: 于是，我领你们的祖先出了埃及；你们来到海边。埃及人带着战车和骑兵追赶你们的祖先，追到红海[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“芦苇海”。希伯来语：yam suph。
    reason: 说明יַם סוּף较为字面的另一译法。
lexical_decisions:
- source_word: וָאוֹצִיא
  choice: 于是，我领……出了
  rationale: יצא的使役式表示“使出来、领出来”；句首ו承接历史叙事，用“于是”自然表达事件的推进。
- source_word: אֲבוֹתֵיכֶם
  choice: 你们的祖先
  rationale: 原义为“你们的父辈”。此处泛指听众在出埃及时的先辈；现代汉语用“祖先”更自然明确，也不改变所指。
- source_word: מִמִּצְרַיִם
  choice: 出了埃及
  rationale: 介词מן表示起点；与“领……出”结合，准确表达从埃及出来。
- source_word: וַתָּבֹאוּ הַיָּמָּה
  choice: 你们来到海边
  rationale: בוא加הים的方向词尾表示向海而来。“海边”在汉语中自然体现抵达海处，同时保留第二人称复数的代表性称呼。
- source_word: וַיִּרְדְּפוּ מִצְרַיִם
  choice: 埃及人……追赶
  rationale: מִצְרַיִם字面为“埃及”，但与复数动词搭配，在这里转喻埃及军队或埃及人；译作“埃及人”符合汉语习惯及语法信息。
- source_word: בְּרֶכֶב וּבְפָרָשִׁים
  choice: 驾着战车、带着骑兵
  rationale: רכב指战车或战车部队，פרשים指骑兵、骑马者；介词ב表示伴随或凭借。此译法清楚呈现追兵的军事装备和兵力。
- source_word: יַם סוּף
  choice: 红海
  rationale: “红海”是该事件通行且易识别的名称；希伯来语字面可理解为“芦苇海”，故在脚注中保留这一译法。
theological_decisions:
- issue: 后来的以色列听众被称为亲历出埃及的一代（“你们来到”）
  choice: 保留第二人称：“你们来到海边”
  alternative: 改为第三人称：“他们来到海边”
  rationale: 希伯来原文以第二人称复数把当时听众与其祖先的盟约历史联系起来；保留人称可维持讲话的修辞力量，不把这种代表性认同抹平。
- issue: יַם סוּף的译名
  choice: 正文采用“红海”
  alternative: “芦苇海”
  rationale: “红海”便于读者识别传统所指的出埃及事件，而“芦苇海”更贴近该希伯来名称的字面构成；脚注并列说明，以保留词义上的张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“祖先”比直译“父辈”更符合本节泛指历代先辈的现代汉语表达；以分号和句号呈现事件层次。脚注标记已在正文“红海”后标出。
