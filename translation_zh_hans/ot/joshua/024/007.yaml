  text: וַ/יִּצְעֲק֣וּ אֶל יְהוָ֗ה וַ/יָּ֨שֶׂם מַֽאֲפֵ֜ל בֵּינֵי/כֶ֣ם וּ/בֵ֣ין הַ/מִּצְרִ֗ים וַ/יָּבֵ֨א עָלָ֤י/ו אֶת הַ/יָּם֙ וַ/יְכַסֵּ֔/הוּ וַ/תִּרְאֶ֨ינָה֙ עֵינֵי/כֶ֔ם אֵ֥ת אֲשֶׁר עָשִׂ֖יתִי בְּ/מִצְרָ֑יִם וַ/תֵּשְׁב֥וּ בַ/מִּדְבָּ֖ר יָמִ֥ים רַבִּֽים־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/007.yaml
  text: Then they cried out to Yahweh[a], and he put darkness between you and the Egyptians, and brought the sea upon him and covered him, and your eyes saw what I did in Egypt. Then you lived in the wilderness many days.
translation:
  language: zh_hans
  text: 他们就向耶和华呼求；他使黑暗隔在你们和埃及人之间，又使海水临到他身上，把他覆盖了。[a]你们亲眼看见了我在埃及所做的事。后来，你们在旷野住了许多日子。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文这里的两个代词都是阳性单数，即“临到他身上”和“把他覆盖”。这可能是用集合意义指埃及或埃及军队；不少译本按上下文译作“他们”。
    reason: 说明原文单数代词及可能的集合意义，保存异读式翻译选择。
lexical_decisions:
- source_word: וַיִּצְעֲקוּ אֶל־יְהוָה
  choice: 他们就向耶和华呼求
  rationale: צעק在困境中常指求助的呼喊；“呼求”自然地表达紧迫感及向上帝求助的含义。יְהוָה按其专名译作“耶和华”，采用现代中文读者熟悉的音译。
- source_word: מַאֲפֵל
  choice: 黑暗
  rationale: 该词可指黑暗或幽暗；“黑暗”简明自然，也不额外限定其程度。
- source_word: בֵּינֵיכֶם וּבֵין הַמִּצְרִים
  choice: 隔在你们和埃及人之间
  rationale: 保留第二人称复数；这是盟约叙事中把当代以色列人与祖先共同视为一个群体的表达。
- source_word: וַיָּבֵא עָלָיו אֶת־הַיָּם
  choice: 又使海水临到他身上
  rationale: עָלָיו的代词后缀是阳性单数，因此正文保留“他”，不擅自改成复数；“海水”比单说“海”更符合现代中文动作语境。
- source_word: וַיְכַסֵּהוּ
  choice: 把他淹没了
  rationale: כסה本义为遮盖、覆盖；在海水涌来的语境中，“淹没”是自然且准确的中文，同时保留阳性单数宾语“他”。
- source_word: וַתִּרְאֶינָה עֵינֵיכֶם
  choice: 你们亲眼看见了
  rationale: 原文明确提到“你们的眼睛”；中文惯用语“亲眼看见”保留亲历和见证的强调。
- source_word: אֵת אֲשֶׁר עָשִׂיתִי בְּמִצְרָיִם
  choice: 我在埃及所做的事
  rationale: בְּ可表示“在”；此译法保留地点含义，不把它解释性地改成“向埃及所行的”。
- source_word: וַתֵּשְׁבוּ בַמִּדְבָּר
  choice: 你们在旷野住了
  rationale: ישב在此表示居住、停留；“住了”是现代中文中自然且能表达持续一段时期的说法。
- source_word: יָמִים רַבִּים
  choice: 许多日子
  rationale: 按原文直译，保留“许多日子”，不解释性扩展为“许多年”或概括为“很久”。
theological_decisions:
- issue: 神圣名字יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。中文正文采用广为普通读者识别、且作为专名使用的“耶和华”，不以“主”这一称号代替。
- issue: 指向埃及一方的单数代词是否改为复数
  choice: 正文保留“他……他”
  alternative: 按集合意义译作“他们……他们”，或明确译作“埃及人／埃及军队”
  rationale: עָלָיו与וַיְכַסֵּהוּ均带阳性单数后缀。单数可能以集合或代表方式指埃及或埃及军队；正文保留原文形式，并用脚注说明，避免静默消除歧义。
- issue: 第二人称“你们”与出埃及世代的关系
  choice: 保留“你们”
  alternative: 解释为“你们的祖先”
  rationale: 原文直接称听众为“你们”，体现以色列群体跨世代的共同身份；不在正文中加入“祖先”来消解这种修辞张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“呼求”“亲眼看见”“旷野”等用语为普通读者所熟悉，同时保留经文的盟约叙事语气。脚注标记[a]置于相关单数代词句之后。
