source:
  edition: WLC
  text: וַ/יֹּאמְר֥וּ הָ/עָ֖ם אֶל יְהוֹשֻׁ֑עַ אֶת יְהוָ֤ה אֱלֹהֵ֨י/נוּ֙ נַעֲבֹ֔ד וּ/בְ/קוֹל֖/וֹ נִשְׁמָֽע־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/024.yaml
  text: And the people said to Joshua[a], “We will serve Yahweh our God[b], and we will obey his voice.”
translation:
  language: zh_hans
  text: 百姓对约书亚说：“我们必事奉[a]耶和华我们的上帝，也必听从他的话[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “事奉”也可译作“敬拜”。希伯来语动词在这里包含以敬拜和忠诚来服事上帝的意思；“事奉”更完整地保留了立约语境中的广泛含义。
    reason: lexical_alternative
  - marker: b
    text: 字面意思是“听他的声音”；这是表示听从并实行他所说之话的希伯来语表达。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ הָעָם אֶל־יְהוֹשֻׁעַ
  choice: 百姓对约书亚说
  rationale: 按希伯来语叙事句式自然表达；הָעָם 指聚集立约的百姓，וַיֹּאמְרוּ 是引出直接引语的普通叙事动词。
- source_word: אֶת־יְהוָה אֱלֹהֵינוּ נַעֲבֹד
  choice: 我们必事奉耶和华我们的上帝
  rationale: נַעֲבֹד 来自 עבד，在此表示对上帝的敬拜、效忠与服事；“事奉”比单说“敬拜”更能保留其广泛的立约含义。中文依原文次序略作调整，使表达自然。
- source_word: וּבְקוֹלוֹ נִשְׁמָע
  choice: 也必听从他的话
  rationale: 字面意思是“听他的声音”；在希伯来语中，此结构表示以顺服回应所听见的吩咐。“听从他的话”既自然，又传达实际服从的含义。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。正文采用现代中文圣经读者熟悉的专名“耶和华”，而不以“主”代替，从而保留其作为立约之神名字的性质。
- issue: 立约语境中 עבד 的宗教含义
  choice: 事奉
  alternative: 敬拜
  rationale: 本节表达百姓对上帝的立约效忠，并与听从上帝的话并列；“事奉”可兼顾敬拜、服事和忠诚行动，不把含义局限于礼仪性的敬拜。
- issue: שמע בקול 的顺服含义
  choice: 听从他的话
  alternative: 听他的声音
  rationale: 保留“听”与顺服之间的联系，同时用现代汉语清楚传达此习语所要求的顺服回应；字面形式列入脚注。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“百姓”“事奉”“听从”等词符合立约场景；避免古奥句式，同时保留原文的集体承诺语气。“必”表达两个未完成式在此作为坚定承诺的语用力量。
