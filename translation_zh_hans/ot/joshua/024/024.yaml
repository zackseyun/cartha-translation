  source_fidelity: 忠实反映希伯来原文：百姓向约书亚作出两个并列的集体承诺，即事奉耶和华、他们的上帝，并听从（顺服）他的声音。"必"恰当地表达此处未完成式在誓约回应中的承诺语气。"听从他的话"以自然汉语传达שמע בקול的顺服含义，且脚注保留了"声音"这一字面表达。
