base_translation:
  language: en
  yaml_path: translation/ot/joshua/017/017.yaml
  text: Joshua said to the house of Joseph—to Ephraim and Manasseh—saying[a], “You are a numerous people, and you have great strength[b]; you shall not have only one allotment.”
translation:
  language: zh_hans
  text: 约书亚对约瑟家——以法莲和玛拿西——说：“你们人数众多[a]，力量强大；你们不会只有一份地业[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“你们是大族”。希伯来语可指人数众多，也可指强大或显要；这里谈论分地，故正文译作“人数众多”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来语直译“阄”。在《约书亚记》中，这个词常指按掣签分配的产业份额，故译作“地业”。
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּית יוֹסֵף
  choice: 约瑟家
  rationale: 保留希伯来语表示家族—支派共同体的惯用说法；下文随即以“以法莲和玛拿西”说明其所指。
- source_word: לְאֶפְרַיִם וְלִמְנַשֶּׁה
  choice: 就是对以法莲和玛拿西
  rationale: 两个与格短语具体说明“约瑟家”的所指；用“就是”清楚表达同位解释，同时保留两个支派的名称。
- source_word: עַם רַב
  choice: 人数众多
  rationale: רַב既可表示“多”，也可表示“大”；本段围绕人口与土地分配展开，因此正文采用数量意义，同时在脚注保留“强盛”的可能。
- source_word: וְכֹחַ גָּדוֹל לָךְ
  choice: 力量强大
  rationale: 准确表达该群体拥有强大力量或能力；措辞简洁、自然，并保留原文与“人数众多”并列的结构。
- source_word: לֹא יִהְיֶה לְךָ גּוֹרָל אֶחָד
  choice: 你们不会只有一份地业
  rationale: גּוֹרָל本义为“阄”，在《约书亚记》的分地语境中指拈阄分得的产业份额。“地业”明确土地承受的语境；“只有”传达上下文中“一份”所含的限制意味。
- source_word: לֵאמֹר
  choice: 说
  rationale: 现代汉语引入直接引语通常用“说”即可，既反映原文的引语公式，又避免生硬重复。
