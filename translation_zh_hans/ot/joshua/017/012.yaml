source:
  edition: WLC
  text: וְ/לֹ֤א יָכְלוּ֙ בְּנֵ֣י מְנַשֶּׁ֔ה לְ/הוֹרִ֖ישׁ אֶת הֶֽ/עָרִ֣ים הָ/אֵ֑לֶּה וַ/יּ֨וֹאֶל֙ הַֽ/כְּנַעֲנִ֔י לָ/שֶׁ֖בֶת בָּ/אָ֥רֶץ הַ/זֹּֽאת־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/017/012.yaml
  text: But the sons of Manasseh were not able to dispossess these cities[a], and the Canaanites persisted in dwelling in this land.
translation:
  language: zh_hans
  text: 可是，玛拿西的子孙未能赶出这些城的居民；迦南人执意[a]住在这地。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“迦南人决意住在这地。”希伯来语用单数形式的集合名词“迦南人”；所用动词可表示愿意或决意。
    reason: 说明集合名词的数，以及 וַיּוֹאֶל 在“愿意／决意”之间的词义空间。
lexical_decisions:
- source_word: יָכְלוּ
  choice: 未能
  rationale: 表示能力上的不足；“未能”在现代汉语中简洁自然，也不把原因改写为单纯不愿意。
- source_word: בְּנֵי מְנַשֶּׁה
  choice: 玛拿西的子孙
  rationale: 保留希伯来语的家族、支派表达，同时在现代汉语中自然地指玛拿西的后裔群体。
- source_word: לְהוֹרִישׁ אֶת הֶעָרִים הָאֵלֶּה
  choice: 把原有居民从这些城赶出去
  rationale: הוריש 的使役形式在征服土地的语境中表示剥夺原有居民的占有、将其赶走。希伯来语以“这些城”为宾语；汉语若直译为“赶走这些城”并不成立，故将其中隐含的居民明确表达出来。
- source_word: וַיּוֹאֶל
  choice: 执意
  rationale: 该动词可表示愿意、决意或坚持；“执意”既传达主动意愿和决心，也符合迦南人继续居住在当地的语境。
- source_word: הַכְּנַעֲנִי
  choice: 迦南人
  rationale: 原文为单数形式，但在此作集合名词，现代汉语“迦南人”同样可以统指这一族群，无须另加复数标记。
- source_word: לָשֶׁבֶת בָּאָרֶץ הַזֹּאת
  choice: 住在这地
  rationale: 直截了当地表达在所论领土内定居、居住；“这地”保留 אֶרֶץ 的地域含义和经文语体。
theological_decisions:
- issue: וַיּוֹאֶל 所表达的是意愿、决心还是持续坚持
  choice: 正文译为“执意”，保留主动决意并含有不肯离开的意味
  alternative: “仍坚持住在这地”或“决意住在这地”
  rationale: 该词的语义可涵盖愿意与决心，具体语境又涉及迦南人的持续居留；正文不把它缩窄为单纯的时间持续或一次性的决定，脚注说明其歧义。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“可是”承接上文并突出未能取得这些城的转折；“把原有居民从这些城赶出去”避免生硬地把城市说成被驱逐的对象。脚注标记置于相关的迦南人分句之后。
