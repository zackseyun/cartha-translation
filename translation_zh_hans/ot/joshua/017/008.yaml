base_translation:
  language: en
  yaml_path: translation/ot/joshua/017/008.yaml
  text: The land of Tappuah belonged to Manasseh[a], but Tappuah on the border of Manasseh belonged to the sons of Ephraim.
translation:
  language: zh_hans
  text: 他普亚地归玛拿西[a]；但玛拿西边界上的他普亚归以法莲子孙。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 较为形式对应的译法是：“玛拿西有他普亚地；但玛拿西边界上的他普亚归以法莲子孙。”
    reason: lexical_alternative
lexical_decisions:
- source_word: לִמְנַשֶּׁה הָיְתָה
  choice: 归玛拿西
  rationale: 希伯来语直译为“是给玛拿西的”，在分地语境中表达归属；现代汉语用“归玛拿西”自然且准确。
- source_word: אֶרֶץ תַּפּוּחַ
  choice: 他普亚地
  rationale: אֶרֶץ在此指地域、土地；“他普亚地”既与下句作为城邑的“他普亚”形成区别，也避免把它扩大为国家。
- source_word: וְתַפּוּחַ
  choice: 但……他普亚城
  rationale: וְ字面常为“和”，此处前后归属形成对比，宜译“但”。原文只说“他普亚”，结合“他普亚地”与边界分配的语境，正文补出“城”以清楚表达所指。
- source_word: אֶל גְּבוּל מְנַשֶּׁה
  choice: 在玛拿西边界上的
  rationale: אֶל在边界描述中表示位置或邻接关系；“在……边界上”符合现代汉语地理表述。
- source_word: לִבְנֵי אֶפְרָיִם
  choice: 归以法莲子孙
  rationale: 保留“子孙”这一希伯来亲族称谓和支派身份，同时以“归”表达分地语境中的所属关系。
- source_word: תַּפּוּחַ
  choice: 他普亚
  rationale: 按希伯来语地名音译，并采用现代中文圣经中较通行的写法。
