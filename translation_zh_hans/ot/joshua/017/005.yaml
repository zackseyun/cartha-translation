base_translation:
  language: en
  yaml_path: translation/ot/joshua/017/005.yaml
  text: Ten portions fell to Manasseh[a], besides the land of Gilead and Bashan, which is beyond the Jordan.
translation:
  language: zh_hans
  text: 这样，玛拿西分得了十份土地[a]，此外还有约旦河东边的基列和巴珊地。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“玛拿西得了十个地业”，或“玛拿西按阄得了十份”。原文在分配土地的语境中使用“落下”这一说法。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְּלוּ
  choice: 分得了
  rationale: נפל在拈阄分地的语境中可直译为“落下”，实际表示土地按阄归给某方。中文用“分得了”自然表达结果，又不武断限定具体程序；脚注保留原文习语。
- source_word: חַבְלֵי
  choice: 份土地
  rationale: חבל可指量地的绳，也可指划定的地域或份额；这里与数字“十”连用，译作“十份土地”兼顾份额和地域含义。
- source_word: מְנַשֶּׁה
  choice: 玛拿西
  rationale: 采用现代中文圣经语境中通行的人名及支派名译法。
- source_word: עֲשָׂרָה
  choice: 十
  rationale: 如实表达基数。
- source_word: לְבַד מֵאֶרֶץ
  choice: 此外还有……地
  rationale: 该结构表示前述十份之外，玛拿西另有约旦河东的领地；此译符合现代汉语表达。
- source_word: הַגִּלְעָד וְהַבָּשָׁן
  choice: 基列和巴珊
  rationale: 采用通行地名译法。
- source_word: אֲשֶׁר מֵעֵבֶר לַיַּרְדֵּן
  choice: 约旦河东边的
  rationale: מֵעֵבֶר字面为“在另一边”；依本段地理视角指约旦河东。译明方位可使普通读者清楚理解，同时不改变所指地点。
theological_decisions: []
translation_notes:
  register: 采用自然、庄重的现代标准普通话。“这样”承接上文关于玛拿西各宗族所得产业的叙述；“分得了十份土地”比照搬“落下”更符合现代汉语，同时以脚注保留希伯来语的拈阄分地习语。
