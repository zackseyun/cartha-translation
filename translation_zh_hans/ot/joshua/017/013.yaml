source:
  edition: WLC
  text: וַֽ/יְהִ֗י כִּ֤י חָֽזְקוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל וַ/יִּתְּנ֥וּ אֶת הַֽ/כְּנַעֲנִ֖י לָ/מַ֑ס וְ/הוֹרֵ֖שׁ לֹ֥א הוֹרִישֽׁ/וֹ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/017/013.yaml
  text: And it happened that when the sons of Israel became strong[a], they put the Canaanites to forced labor[c][b], but they did not completely drive them out.
translation:
  language: zh_hans
  text: 后来，以色列人强盛起来，就使迦南人服苦役[a]，却没有把他们完全赶出去[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “服苦役”也可译作“服徭役”或“纳贡”。
    reason: lexical_alternative
  - marker: b
    text: 原文以同一词根的两种动词形式连用，强调他们没有把迦南人彻底赶出去。
    reason: source_form
lexical_decisions:
- source_word: וַיְהִי כִּי
  choice: 后来，……起来，就……
  rationale: 该结构引出叙事中的新发展及其时间背景；现代汉语用“后来……起来，就……”自然表达，避免生硬直译为“事情发生了，当……”。
- source_word: חָזְקוּ
  choice: 强盛起来
  rationale: חזק在此表示力量增长、变得强大；“强盛起来”保留其起始、渐成之意。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 该词组字面为“以色列的众子”，但在此是民族称谓；“以色列人”是现代汉语自然且准确的表达。
- source_word: וַיִּתְּנוּ אֶת־הַכְּנַעֲנִי לָמַס
  choice: 就使迦南人服苦役
  rationale: מַס可指强制劳役，也可指贡赋；在征服和辖制的语境中，“服苦役”清楚表达受强迫服役的含义。原文单数“迦南人”具集合意义，汉语同样可作集合称谓。
- source_word: וְהוֹרֵשׁ לֹא הוֹרִישׁוֹ
  choice: 却没有把他们完全赶出去
  rationale: 动词不定式绝对形与限定动词连用，强化“赶出”的动作；“完全”体现该强调。阳性单数宾语后缀指集合性的迦南人，汉语自然译作“他们”。
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל的民族称谓
  choice: 以色列人
  alternative: 以色列的众子／以色列子孙
  rationale: 此处重点是全体民族，而非强调男性后裔；采用现代汉语通行民族称谓，不增加性别或血缘层面的特别解释。
- issue: מַס所指的辖制形式
  choice: 苦役
  alternative: 贡赋／徭役
  rationale: 原词容许贡赋或强制劳役等理解；正文依上下文采用“苦役”，同时以脚注保留“贡赋”的词义可能，避免将原文含义过度收窄。
- issue: הוֹרֵשׁ לֹא הוֹרִישׁוֹ的强调作用
  choice: 没有……完全赶出去
  alternative: 断没有赶出去／没有把他们逐出产业
  rationale: 保留原文强化结构，同时不把它解释成他们完全没有进行驱逐；“没有完全赶出去”最符合本段关于迦南人继续居住的语境。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“强盛起来”传达力量增长，“服苦役”直陈强制性质；脚注保留מַס可指徭役或贡赋的歧义。
