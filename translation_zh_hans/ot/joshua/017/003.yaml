base_translation:
  language: en
  yaml_path: translation/ot/joshua/017/003.yaml
  text: 'Zelophehad son of Hepher[a], son of Gilead, son of Machir, son of Manasseh, had no sons, but only daughters; and these are the names of his daughters: Mahlah, Noah, Hoglah, Milcah[b], and Tirzah.'
translation:
  language: zh_hans
  text: 至于西罗非哈[a]，他是希弗的儿子；希弗是基列的儿子，基列是玛吉的儿子，玛吉是玛拿西的儿子。西罗非哈没有儿子，只有女儿；他的女儿名叫玛拉、挪阿[b]、曷拉、密迦和得撒。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“而／至于西罗非哈”；这是引出西罗非哈家族情形的惯用表达。
    reason: lexical_alternative
  - marker: b
    text: 这里的挪阿是西罗非哈的女儿，并不是《创世记》中的男性人物挪亚。
    reason: cultural_note
lexical_decisions:
- source_word: וְ/לִ/צְלָפְחָד
  choice: 至于西罗非哈
  rationale: 介词לְ与连接词וְ在这里引出西罗非哈的家族情形，并非单纯表示所属关系；“至于”自然体现话题转换，也不添加原文没有的时间含义。
- source_word: בֶּן חֵפֶר בֶּן גִּלְעָד בֶּן מָכִיר בֶּן מְנַשֶּׁה
  choice: 他是希弗的儿子、基列的孙子、玛吉的曾孙、玛拿西的后代
  rationale: 希伯来文反复使用“儿子”串联谱系；现代汉语若逐项都译作“儿子”容易误解为四位父亲，因此按亲属层级表达，同时保留完整谱系。最后用“后代”，避免在跨越更远世代时作过度精确的亲等断言。
- source_word: לֹא הָיוּ לוֹ בָּנִים כִּי אִם בָּנוֹת
  choice: 他没有儿子，只有女儿
  rationale: 准确保留“儿子”与“女儿”的性别对照及כִּי אִם所表达的排除、限定意义；这一区分与继承背景直接相关。
- source_word: וְאֵלֶּה שְׁמוֹת בְּנֹתָיו
  choice: 他的女儿名叫
  rationale: 以自然简洁的现代汉语呈现希伯来文固定的列名公式“这些是他女儿的名字”。
- source_word: מַחְלָה וְנֹעָה חָגְלָה מִלְכָּה וְתִרְצָה
  choice: 玛拉、挪阿、曷拉、密迦和得撒
  rationale: 采用现代中文圣经读者较熟悉的人名音译，并在最后一项前用“和”自然连接名单。
theological_decisions: []
translation_notes:
  register: 使用庄重而自然的现代标准汉语。谱系采用“儿子、孙子、曾孙、后代”的汉语亲属表达，使普通读者容易理解，同时不压缩任何一代；人名使用简体中文圣经传统中通行的译名。
