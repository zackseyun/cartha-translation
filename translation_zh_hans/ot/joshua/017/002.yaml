revisions:
- from: 玛拿西其余的子孙[a]也按着宗族分得了土地：亚比以谢的子孙、希勒的子孙、亚斯列的子孙、示剑的子孙、希弗的子孙和示米大的子孙。他们是约瑟之子玛拿西的男性子孙[b]，各按宗族[c]分配。
  to: 玛拿西其余的子孙[a]按宗族[b]分得产业如下：亚比以谢的子孙、希勒的子孙、亚斯列的子孙、示剑的子孙、希弗的子孙和示米大的子孙。这些是约瑟之子玛拿西的男性子孙[c]，各按宗族。
  rationale: 修正末句的句法和语义，使其作为对所列支系的总结，而非另行叙述“分配”。首句保留分地段落中由与格结构所蕴含的产业分配，并以“如下”自然引出名单。脚注锚点随对应词语调整。
