base_translation:
  language: en
  yaml_path: translation/ot/joshua/017/002.yaml
  text: 'And it was for the remaining sons of Manasseh according to their clans: for the sons of Abiezer[a], and for the sons of Helek, and for the sons of Asriel, and for the sons of Shechem, and for the sons of Hepher, and for the sons of Shemida. These were the male sons of Manasseh son of Joseph[c][b], according to their clans.'
translation:
  language: zh_hans
  text: 玛拿西其余的子孙[a]按宗族[b]分得产业如下：亚比以谢的子孙、希勒的子孙、亚斯列的子孙、示剑的子孙、希弗的子孙和示米大的子孙。这些是约瑟之子玛拿西的男性子孙[c]，各按宗族。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“玛拿西其余的儿子”；这里的“儿子”可泛指由他们而出的后裔。
    reason: lexical_alternative
  - marker: b
    text: “宗族”所译的希伯来语，指支派内部由亲属关系构成的群体，也可译作“家族”。
    reason: cultural_note
  - marker: c
    text: 原文特意说明他们是“男性”，与上下文所提西罗非哈的女儿形成对照。
    reason: contextual_note
lexical_decisions:
- source_word: וַיְהִי לִבְנֵי מְנַשֶּׁה
  choice: 玛拿西……的子孙也……分得了土地
  rationale: וַיְהִי לְ־在本段承接分地叙事，表达这些支系所得的份；中文补出语境中隐含的“分得了土地”，比直译“有给……”自然，同时保留“也”的叙事承接作用。
- source_word: הַנּוֹתָרִים
  choice: 其余的
  rationale: 指除上下文已特别提到的支系之外，玛拿西其余的后裔，保持原文的相对性，不解释为被遗弃或剩下的人。
- source_word: לְמִשְׁפְּחֹתָם
  choice: 按着宗族／各按宗族
  rationale: מִשְׁפָּחָה在支派分地语境中指支派内部的亲族单位；“宗族”比现代汉语的“家庭”更准确。
- source_word: לִבְנֵי אֲבִיעֶזֶר ... וְלִבְנֵי שְׁמִידָע
  choice: 亚比以谢的子孙……示米大的子孙
  rationale: 保留反复出现的“子孙”结构，体现原文法律式、谱系式列举，而不直接改写成各“族”。
- source_word: בְּנֵי מְנַשֶּׁה בֶּן יוֹסֵף
  choice: 约瑟之子玛拿西的……子孙
  rationale: 保留原文的谱系关系，并采用自然而庄重的现代汉语表达。
- source_word: הַזְּכָרִים
  choice: 男性子孙
  rationale: 原文明确标出男性，语境上与西罗非哈的女儿形成对照；“男性子孙”既保留强调，也避免“男儿子”式生硬直译。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重且易懂的叙事语言。名单保留原文逐项重复“子孙”的谱系与分配文书风格；“分得了土地”依据本段分地语境补明原文省略的所得内容。
