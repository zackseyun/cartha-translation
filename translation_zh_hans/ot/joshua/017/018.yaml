reference: Joshua 17:18
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כִּ֣י הַ֤ר יִֽהְיֶה לָּ/ךְ֙ כִּֽי יַ֣עַר ה֔וּא וּ/בֵ֣רֵאת֔/וֹ וְ/הָיָ֥ה לְ/ךָ֖ תֹּֽצְאֹתָ֑י/ו כִּֽי תוֹרִ֣ישׁ אֶת הַֽ/כְּנַעֲנִ֗י כִּ֣י רֶ֤כֶב בַּרְזֶל֙ ל֔/וֹ כִּ֥י חָזָ֖ק הֽוּא־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/017/018.yaml
  text: But the hill country will be yours[a]; for it is a forest, and you shall clear it, and its farthest borders shall be yours. For you shall dispossess the Canaanites[c][b], though they have iron chariots and though they are strong.
translation:
  language: zh_hans
  text: 山地必归你[a]；因为它是森林，你要开垦它；它的边界都必归你[b]。你必赶走迦南人[c]，尽管他们有铁战车，而且势力强大。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “山地”也可译作“一座山”。希伯来语 הַר 可指山，也可指山地区域；这里很可能指分给约瑟家的高地。
    reason: lexical_alternative
  - marker: b
    text: 直译可作“它的尽头”或“它的外围”；希伯来语所指的是这片森林山地的外缘或边界。
    reason: lexical_alternative
  - marker: c
    text: 希伯来语直译为“迦南人……他有……他强大”，以单数形式统称整个族群。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַר
  choice: 山地
  rationale: 在分配土地的语境中，这个词指一片高地或山地区域，而不只是单独一座山；“山地”既自然，也符合这里的地理含义。
- source_word: יִהְיֶה לָּךְ
  choice: 必归你
  rationale: היה + ל 表示归属或分配；“必归你”简洁地传达所有权，并保留未然语气。
- source_word: כִּי
  choice: 因为／虽／尽管
  rationale: 本节多次使用 כִּי，但话语功能随上下文而异。第二处先说明山地必归约瑟家的理由，译作“因为”；在森林难以开垦以及迦南人拥有优势兵力的语境中，则用“虽／尽管”表达让步关系，避免机械地统一译法。
- source_word: יַעַר
  choice: 森林
  rationale: 该名词指树木茂密的地带；“森林”直接、清楚。
- source_word: וּבֵרֵאתוֹ
  choice: 把它开垦出来
  rationale: 此处 Piel 词形表示清除林木、使土地可供使用；“开垦”在土地分配和定居语境中比单纯“砍伐”更完整。
- source_word: וְהָיָה לְךָ תֹּצְאֹתָיו
  choice: 直到边界都必归你
  rationale: תֹּצְאוֹתָיו 可指边缘、尽头或外围；此译表达整片山地直到外缘都归他们所有，同时保持中文自然。
- source_word: תוֹרִישׁ
  choice: 赶走
  rationale: ירש 的 Hiphil 在这里表示使原居民失去占有，即逐出其地。“赶走”清楚传达军事和领土语境；其剥夺土地占有的含义由上下文体现。
- source_word: הַכְּנַעֲנִי
  choice: 迦南人
  rationale: 希伯来文采用单数族名作集合称呼；汉语“迦南人”本身可作集合名词，无须添加复数形式。
- source_word: רֶכֶב בַּרְזֶל
  choice: 铁战车
  rationale: 该结构指配有铁制部件的战车；“铁战车”是简明而通行的译法。
- source_word: חָזָק הוּא
  choice: 势力强大
  rationale: 单数形容词和代词回指作为集合整体的迦南人；“势力强大”自然表达其军事力量，同时避免把单数形式误解为某个个人。
theological_decisions:
- issue: “迦南人”的集合单数
  choice: 正文用汉语集合称呼“迦南人”，后文译作“他们”，并以脚注说明希伯来文为单数形式。
  alternative: 形式对应地译成“那个迦南人……他有……他很强大”。
  rationale: 希伯来文常用单数族名统称一个民族或群体。这里谈的是占据土地并拥有战车的迦南人口，按集合意义处理既忠于所指，也符合现代汉语表达；脚注保留原文形式信息。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“因为那里虽是森林，你却可以……”既保留 כִּי 的因由关系，也自然呈现森林构成困难而仍可开垦的张力；后半句以“尽管”表达铁战车和强大势力并不能推翻必能赶走他们的断言。
