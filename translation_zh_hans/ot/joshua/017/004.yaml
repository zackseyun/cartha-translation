  text: וַ/תִּקְרַ֡בְנָה לִ/פְנֵי֩ אֶלְעָזָ֨ר הַ/כֹּהֵ֜ן וְ/לִ/פְנֵ֣י יְהוֹשֻׁ֣עַ בִּן נ֗וּן וְ/לִ/פְנֵ֤י הַ/נְּשִׂיאִים֙ לֵ/אמֹ֔ר יְהוָה֙ צִוָּ֣ה אֶת מֹשֶׁ֔ה לָֽ/תֶת לָ֥/נוּ נַחֲלָ֖ה בְּ/ת֣וֹךְ אַחֵ֑י/נוּ וַ/יִּתֵּ֨ן לָ/הֶ֜ם אֶל פִּ֤י יְהוָה֙ נַֽחֲלָ֔ה בְּ/ת֖וֹךְ אֲחֵ֥י אֲבִי/הֶֽן׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/017/004.yaml
  text: So they came near before Eleazar the priest[a], and before Joshua son of Nun, and before the leaders, saying, “Yahweh commanded Moses to give us an inheritance among our brothers.” So he gave them, according to the command of Yahweh[c][b], an inheritance among their father's brothers.
translation:
  language: zh_hans
  text: 她们来到祭司以利亚撒、嫩的儿子约书亚和众首领面前，说：“雅威曾吩咐摩西，在我们弟兄中给我们产业[a]。”于是他照雅威的吩咐[b]，在她们父亲的弟兄中给了她们产业[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里的“产业”指按宗族分配、可以承袭的土地份额。
    reason: 文化与词义说明
  - marker: b
    text: “照雅威的吩咐”直译为“照雅威的口”。原文此处只说“他给了”；按上下文，这位执行分地的人最可能是约书亚。
    reason: 希伯来习语与指代歧义
  - marker: c
    text: “她们父亲的弟兄”指她们父系宗族中的男性亲属。
    reason: 亲属与继承制度说明
lexical_decisions:
- source_word: וַתִּקְרַבְנָה
  choice: 她们来到……面前
  rationale: 该动词是阴性复数，承接上文西罗非哈的女儿们；与 לִפְנֵי 合译为“来到……面前”，既自然，也保留正式陈情的场景。
- source_word: לִפְנֵי
  choice: 在……面前
  rationale: 原文三次重复，标明她们在祭司、约书亚和首领面前公开陈情；中文将共同介词置于并列名单之后，避免生硬重复。
- source_word: הַנְּשִׂיאִים
  choice: 众首领
  rationale: 指以色列群体或支派的领袖；“首领”符合历史语境，也避免“王子”等贵族含义。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以通行的现代汉语音译呈现四字神名，而不以称号替代专名。
- source_word: לָתֶת לָנוּ נַחֲלָה
  choice: 给我们产业
  rationale: נַחֲלָה 在约书亚记中特指按宗族分配、可承袭的土地份额；“产业”简洁并符合全书语境，脚注说明其土地继承含义。
- source_word: בְּתוֹךְ אַחֵינוּ
  choice: 在我们弟兄中
  rationale: 保留原文阳性亲属称谓及其法律社会背景，不泛化为“亲属”或“族人”。
- source_word: וַיִּתֵּן
  choice: 约书亚……给了
  rationale: 原文仅用阳性单数“他”；就叙事中执行分地的角色而言，约书亚是最自然的所指。为使中文指代清楚而明示其名，同时以脚注保留原文的代词形式。
- source_word: אֶל־פִּי יְהוָה
  choice: 照雅威的吩咐
  rationale: 该习语字面为“照雅威的口”，实际表达依照其权威命令；此译自然而庄重，脚注保留字面形式。
- source_word: אֲחֵי אֲבִיהֶן
  choice: 她们父亲的弟兄
  rationale: 严格保留父系亲属关系；不直接改作“叔伯”，因为中文“叔伯”会进一步标明长幼，而希伯来语本身没有说明。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华／上主
  rationale: 原文使用神的专名。译作“雅威”直接呈现该名，避免用称号取代，也不把较晚形成的混合读音带入正文。
- issue: אַחֵינוּ 的性别与亲属范围
  choice: 我们弟兄
  alternative: 我们的手足／我们的族人
  rationale: 女儿们所提出的是在男性宗族成员所得份额中承受产业的请求；保留“弟兄”能呈现原文的性别和法律张力。
- issue: וַיִּתֵּן 的主语
  choice: 正文明确为约书亚，并以脚注说明原文作“他”
  alternative: 于是他给了她们
  rationale: 阳性单数主语在原文中未点名，存在形式上的指代余地；约书亚按上下文最可能是执行者。中文正文为清楚起见明确所指，同时不掩盖原文形式。
- issue: אֲחֵי אֲבִיהֶן 的亲属结构
  choice: 她们父亲的弟兄
  alternative: 她们的叔伯／她们父系宗族的人
  rationale: 直译保留父系继承结构，又避免“叔伯”对年龄关系的额外限定；脚注解释其宗族意义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事体。“来到……面前”体现正式陈情；“产业”延续约书亚记分地语境。正文避免过度解释，将土地继承、希伯来习语及代词歧义放入脚注。
