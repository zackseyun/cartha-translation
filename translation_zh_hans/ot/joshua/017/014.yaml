    issue: 把赐福明确译成使人口增多
    rationale: “使我直到如今成为人数众多的百姓”把“人数众多”设为赐福的明确结果；原文只说“我［是］人数众多的百姓，耶和华至今赐福给我”，其压缩连接容许语境关联，但未明确限定赐福的具体内容。
  - severity: medium
    issue: “一签”易被理解为抽签工具
    rationale: גּוֹרָל在此指抽签所定的份额／地业；汉语“一签”通常首先指签条或签物。“一阄之地”能更准确地表达所得的土地份额。
  revised_text: 约瑟的子孙对约书亚说：“你为什么只把一阄之地和一段土地[a]分给我作产业呢？我本是人数众多的百姓，耶和华一直赐福给我，直到如今。”
  revised_footnotes:
