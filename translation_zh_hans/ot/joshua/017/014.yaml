revisions:
- from: 约瑟的子孙对约书亚说：“耶和华既赐福给我，使我直到如今成为人数众多的百姓，你为什么只把一签、一份产业分给我呢？”[a]
  to: 约瑟的子孙对约书亚说：“你为什么只把一阄之地和一段土地[a]分给我作产业呢？我本是人数众多的百姓，耶和华一直赐福给我，直到如今。”
  rationale: 修订避免将原文压缩的并列陈述释义为明确的因果链，同时以“一阄之地”准确表达抽签分得的地业。保留集体自称的单数“我”、人口众多的含义，以及神名“耶和华”。
