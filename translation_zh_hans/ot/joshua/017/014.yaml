base_translation:
  language: en
  yaml_path: translation/ot/joshua/017/014.yaml
  text: Then the sons of Joseph spoke to Joshua[a], saying, “Why have you given me one lot and one portion as an inheritance, though I am a numerous people, since Yahweh has blessed me until now?”
translation:
  language: zh_hans
  text: 约瑟的子孙对约书亚说：“你为什么只把一阄之地和一段土地[a]分给我作产业呢？我本是人数众多的百姓，耶和华一直赐福给我，直到如今。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “一段土地”或译“一片地”。原词可指用量地绳划定的一块土地或地业份额。
    reason: 保留חֶבֶל可指划定地域或土地份额的词义范围。
lexical_decisions:
- source_word: בְּנֵי יוֹסֵף
  choice: 约瑟的子孙
  rationale: 这里指以法莲、玛拿西等约瑟支派的后裔；“子孙”既保留亲缘称谓，也符合现代汉语的群体表达。
- source_word: נָתַתָּה לִּי נַחֲלָה
  choice: 把……产业分给我
  rationale: 本章语境是分配承受之地；“产业”体现נַחֲלָה作为世袭之地的含义，“分给”自然表达约书亚所作的分配。
- source_word: גּוֹרָל אֶחָד
  choice: 一签
  rationale: גּוֹרָל首先指用于拈阄的签，也可转指抽签所得的地业；保留“一签”可显出分地方式，并与后面的“一份”相区分。
- source_word: חֶבֶל אֶחָד
  choice: 一份产业
  rationale: חֶבֶל本指绳索，也可指用量地绳划定的一片土地或份额；正文采用自然的“一份产业”，脚注保留更具体的空间意义。
- source_word: וַאֲנִי עַם רָב
  choice: 使我直到如今成为人数众多的百姓
  rationale: 发言群体用单数“我”作集体自称；עַם רָב在此强调人口众多，而非地位伟大。
- source_word: עַד אֲשֶׁר עַד כֹּה בֵּרְכַנִי
  choice: 既赐福给我，使我直到如今成为……
  rationale: 保留עַד כֹּה“直到如今”的时间意义，并按上下文将赐福与人口众多联系起来；希伯来语句法压缩，中文适度重组以明确因果关系。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代简体中文圣经语域中最通行的专名形式，作为四字神名的音译性传统译法，不以称号替代。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 正文采用普通中文读者最熟悉的专名“耶和华”；“雅威”更接近当代学界常见的拟音，但两者都旨在呈现专名而非以“主”替代。
- issue: 神赐福与人口众多之间的关系
  choice: 将人数众多表达为赐福所产生的现状
  alternative: 将“我是人数众多的百姓”与“耶和华直到如今赐福给我”并列处理
  rationale: 语境明显以人口众多作为要求更多地业的理由，但原文连接较为压缩；译文呈现最自然的因果理解，同时不增加赐福的其他具体内容。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。保留约瑟支派集体自称的单数“我”，避免改成“我们”而抹去原文修辞；问句重组为符合汉语习惯的因果顺序。
