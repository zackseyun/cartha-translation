base_translation:
  language: en
  yaml_path: translation/ot/joshua/017/010.yaml
  text: Southward it belonged to Ephraim[a], and northward to Manasseh, and the sea was its border; on the north they reached Asher, and on the east Issachar.
translation:
  language: zh_hans
  text: 南边属以法莲，北边属玛拿西；海为其边界。北面与亚设相接[a]，东面与以萨迦相接。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“北面与亚设接壤，东面与以萨迦接壤。”这里的希伯来语动词在疆界描述中可表示“遇到”“接触”或“接壤”。
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶגְבָּה לְאֶפְרַיִם
  choice: 南边属以法莲
  rationale: 方向词 נֶגְבָּה 表示南面；介词 לְ 在分地语境中表示归属。补出“属”使希伯来文的省略结构在现代汉语中清楚自然。
- source_word: וְצָפוֹנָה לִמְנַשֶּׁה
  choice: 北边属玛拿西
  rationale: 与前半句形成方向和归属上的平行结构；重复“属”符合汉语表达，也避免归属关系含混。
- source_word: וַיְהִי הַיָּם גְּבוּלוֹ
  choice: 海是它的边界
  rationale: 按字面保留“海”和“边界”的判断关系；“它”指本段所述的领地或疆界范围，不擅自明确为某一支派。
- source_word: וּבְאָשֵׁר יִפְגְּעוּן
  choice: 与亚设相接
  rationale: פגע 在疆界描述中可指接触、到达或毗邻。“相接”既自然，又保留其地理边界含义，不把接壤程度说得过强。
- source_word: מִצָּפוֹן
  choice: 北面
  rationale: 介词 מִן 在此疆界公式中表示相邻所在的一侧；译作“北面”比机械译作“从北方”更符合现代汉语地理叙述。
- source_word: וּבְיִשָּׂשכָר מִמִּזְרָח
  choice: 东面与以萨迦相接
  rationale: 承接前句省略的动词，并按现代汉语语序重组；מִמִּזְרָח 表示东侧的毗邻关系。
