  yaml_path: translation/ot/joshua/017/006.yaml
  text: For the daughters of Manasseh received an inheritance among his sons[c][b][a], and the land of Gilead belonged to the rest of the sons of Manasseh.
translation:
  language: zh_hans
  text: 因为玛拿西的女儿们在他的众子中承受了产业[a]；基列地归给玛拿西其余的众子。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“承受了产业”；原文以同根的动词和名词连用。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，对先前所述的分地安排作解释；保留原文的因果或解释语气。
- source_word: בְּנוֹת מְנַשֶּׁה
  choice: 玛拿西的女儿们
  rationale: 直接表达所属关系，并明确保留“女儿”与后文“众子”的对照。
- source_word: נָחֲלוּ נַחֲלָה
  choice: 得了产业
  rationale: 原文是同根动词与名词的组合，指取得世袭分地；“得了产业”在现代汉语中自然，并保留土地继承的语境。
- source_word: בְּתוֹךְ בָּנָיו
  choice: 在他的众子中
  rationale: 按字面保留“在……中间／之中”以及阳性复数“众子”；“他”自然指玛拿西。
- source_word: וְאֶרֶץ הַגִּלְעָד
  choice: 基列地则
  rationale: “基列地”是清楚自然的地域名称；“则”突出女儿所得产业与其余众子所得基列地之间的对照。
- source_word: הָיְתָה לִבְנֵי מְנַשֶּׁה הַנּוֹתָרִים
  choice: 归给玛拿西其余的众子
  rationale: 介词结构表达归属或分配结果；“归给”兼顾产业分配与所有权含义，“其余”对应 הַנּוֹתָרִים。
theological_decisions:
- issue: 女儿与众子在产业安排中的明确对照
  choice: 保留“女儿们”与“众子”的性别用语，并译为“在他的众子中得了产业”
  alternative: 把 בָּנָיו 泛化为“子孙”或“儿女”
  rationale: 原文明确使用“女儿”与“儿子”的对照，涉及本段继承安排；泛化会削弱文本重点。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“产业”符合约书亚记分地语境；保留“众子”以呈现原文与“女儿们”的明确对照。
