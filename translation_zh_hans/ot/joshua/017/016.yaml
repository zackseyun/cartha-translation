base_translation:
  language: en
  yaml_path: translation/ot/joshua/017/016.yaml
  text: And the sons of Joseph said[a], “The hill country is not enough for us, and all the Canaanites who live in the valley land have iron chariots[c][b], both those in Beth-shean and its daughter towns and those in the Valley of Jezreel.”
translation:
  language: zh_hans
  text: 约瑟的子孙说：“山地不够我们用；住在谷地的迦南人都有铁战车[b]，无论是住在伯善和其属城[a]的，还是住在耶斯列谷的，都是如此。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “属城”原文直译为“她的女儿们”，指隶属于一座主要城邑的较小城镇或村落。
    reason: cultural_note
  - marker: b
    text: 原文直译为“铁的战车”，可能指装有铁制部件的战车。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי יוֹסֵף
  choice: 约瑟的子孙
  rationale: 直译该族群称谓，指以法莲和玛拿西支派为代表的约瑟后裔；“子孙”在现代汉语中自然且能保留宗族含义。
- source_word: לֹא יִמָּצֵא לָנוּ הָהָר
  choice: 山地容不下我们
  rationale: 字面近于“山地对我们是找不到/得不到的”，但上下文表达所分山地不足以容纳约瑟各族。“容不下我们”自然传达不足之意，同时保留其人口与土地压力的语境。
- source_word: אֶרֶץ הָעֵמֶק
  choice: 谷地
  rationale: 指与山地相对的低平地带；“谷地”简洁地保留地形对照，且不将其过度限定为狭谷或一般平原。
- source_word: רֶכֶב בַּרְזֶל
  choice: 铁战车
  rationale: 希伯来语字面为“铁的战车”，通常指配有铁制部件的战车。“铁战车”是简洁、自然的汉语表达，并未进一步断定具体铁制构造。
- source_word: הַכְּנַעֲנִי הַיֹּשֵׁב
  choice: 住在……的迦南人
  rationale: 原文单数形式在此作集合名词，汉语以“迦南人”自然表达群体，并用“住在”对应分词。
- source_word: בֵּית שְׁאָן
  choice: 伯善
  rationale: 采用现代中文圣经地名中通行且简明的译名。
- source_word: וּבְנוֹתֶיהָ
  choice: 及其属城
  rationale: 字面为“和她的女儿们”，是以母城与女儿比喻主城及其附属聚落。“属城”直接传达所指，避免现代读者误解为人物。
- source_word: עֵמֶק יִזְרְעֶאל
  choice: 耶斯列谷
  rationale: 按希伯来语地名结构译作“耶斯列谷”，清楚保留地理名称。
- source_word: בְּכָל
  choice: 都有
  rationale: 原文介词短语说明谷地全体迦南人均具备这种军事装备；“都有”自然表达其周遍、分配含义。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“山地容不下我们”按上下文传达土地不足的惯用含义；分号呈现约瑟子孙所说的两重困难：山地不足，以及谷地居民拥有铁战车。所有注脚标记均置于对应词语之后。
