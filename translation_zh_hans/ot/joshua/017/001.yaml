  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יְהִ֤י הַ/גּוֹרָל֙ לְ/מַטֵּ֣ה מְנַשֶּׁ֔ה כִּי ה֖וּא בְּכ֣וֹר יוֹסֵ֑ף לְ/מָכִיר֩ בְּכ֨וֹר מְנַשֶּׁ֜ה אֲבִ֣י הַ/גִּלְעָ֗ד כִּ֣י ה֤וּא הָיָה֙ אִ֣ישׁ מִלְחָמָ֔ה וַֽ/יְהִי ל֖/וֹ הַ/גִּלְעָ֥ד וְ/הַ/בָּשָֽׁן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/017/001.yaml
  text: 'The lot fell to the tribe of Manasseh[a], for he was the firstborn of Joseph: to Machir the firstborn of Manasseh, the father of Gilead, because he was a man of war, there belonged Gilead and Bashan.'
translation:
  language: zh_hans
  text: 分给玛拿西支派的地，是拈阄所得的，因为玛拿西是约瑟的长子。玛拿西的长子玛吉，就是基列之父[a]；他是个战士，所以基列和巴珊归他所有。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “基列之父”也可理解为“基列的祖先”或“基列的始祖”。希伯来语“父”不一定只指直接的生父，也可指祖先或某一族群、地方的始祖。
    reason: 说明希伯来语 אָבִי 在此可能具有比直接父子关系更宽泛的含义。
lexical_decisions:
- source_word: וַיְהִי הַגּוֹרָל
  choice: 是拈阄所得的
  rationale: 这里指拈阄分地的结果；此译既保留拈阄这一程序，也符合现代汉语表达。
- source_word: לְמַטֵּה מְנַשֶּׁה
  choice: 分给玛拿西支派的地
  rationale: מַטֶּה 在本段指支派；结合上下文补出“分给……的地”，清楚表达产业分配。
- source_word: כִּי הוּא בְּכוֹר יוֹסֵף
  choice: 因为玛拿西是约瑟的长子
  rationale: 将代词所指明说为“玛拿西”，避免汉语中的指代含混，并保留 כִּי 的原因意义。
- source_word: לְמָכִיר בְּכוֹר מְנַשֶּׁה
  choice: 玛拿西的长子玛吉
  rationale: 保留玛吉的长子身份；其所得产业由后半句“归他所有”表达。
- source_word: אֲבִי הַגִּלְעָד
  choice: 基列之父
  rationale: 直译希伯来语亲属称谓，同时用脚注保留“祖先/始祖”等较宽泛的可能意义。
- source_word: אִישׁ מִלְחָמָה
  choice: 战士
  rationale: 自然简洁地表达善战、从军之人的含义，比直译“战争之人”更符合现代汉语。
- source_word: וַיְהִי לוֹ הַגִּלְעָד וְהַבָּשָׁן
  choice: 所以基列和巴珊归他所有
  rationale: 表达领地归属，并以“所以”呈现前面 כִּי 所引原因与所得领地之间的关系。
theological_decisions:
- issue: “基列之父”所指的关系
  choice: 正文保留“基列之父”
  alternative: 基列的祖先／基列的始祖
  rationale: אָבִי 可表示直接生父，也可表示祖先、族群始祖或创立者；正文不替原文消除这一语义张力，脚注说明其范围。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。将较长的希伯来语句子分成两句，以免汉语结构拖沓；专名采用通行译名“玛拿西、约瑟、玛吉、基列、巴珊”。脚注标记紧随其实际解释的“基列之父”之后。
