  text: וְ/יָרַ֣ד הַ/גְּבוּל֩ נַ֨חַל קָנָ֜ה נֶ֣גְבָּ/ה לַ/נַּ֗חַל עָרִ֤ים הָ/אֵ֨לֶּה֙ לְ/אֶפְרַ֔יִם בְּ/ת֖וֹךְ עָרֵ֣י מְנַשֶּׁ֑ה וּ/גְב֤וּל מְנַשֶּׁה֙ מִ/צְּפ֣וֹן לַ/נַּ֔חַל וַ/יְהִ֥י תֹצְאֹתָ֖י/ו הַ/יָּֽמָּ/ה׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/017/009.yaml
  text: Then the border went down to the Brook of Kanah[a], south of the brook. These cities belonged to Ephraim among the cities of Manasseh, and the border of Manasseh was on the north side of the brook[c][b], and its end was at the sea.
translation:
  language: zh_hans
  text: 边界下到加拿溪。这些城在溪的南边，归以法莲，在玛拿西的众城中；玛拿西的边界在溪的北边，尽头到海[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: c
    text: 这里的“海”指地中海。
    reason: cultural_note
lexical_decisions:
- source_word: וְיָרַד
  choice: 下到
  rationale: 在划界叙述中，ירד表示边界线向较低处或某一方向延伸；“下到”既贴近原文，也符合现代汉语地理描述。
- source_word: הַגְּבוּל
  choice: 边界
  rationale: גבול在分地语境中指领土的界线；“边界”自然、明确。
- source_word: נַחַל קָנָה
  choice: 加拿溪
  rationale: נחל既可指溪流，也可指季节性河道或溪谷；正文采用简洁易懂的“溪”，并以脚注保留其语义范围。
- source_word: נֶגְבָּה לַנַּחַל
  choice: 沿着溪的南边延伸
  rationale: נֶגְבָּה表示南面或向南。结合后半节“溪的北边”这一对应表述，此处理解为边界位于溪的南侧；补出“沿着……延伸”使中文边界描述通顺，同时不把它误解为朝溪流南下。
- source_word: עָרִים הָאֵלֶּה לְאֶפְרַיִם
  choice: 这些城归以法莲
  rationale: 无动词分句在此表达归属或分配；“归以法莲”简明保留土地分配的含义。
- source_word: בְּתוֹךְ עָרֵי מְנַשֶּׁה
  choice: 在玛拿西的众城之中
  rationale: בְּתוֹךְ表达处于内部，说明以法莲的这些城位于玛拿西所得区域内；正文保持原文的简约表达，脚注加以说明。
- source_word: וּגְבוּל מְנַשֶּׁה מִצְּפוֹן לַנַּחַל
  choice: 玛拿西的边界在溪的北边
  rationale: מִצְּפוֹן在此表示相对于溪流的北侧位置；译文直接呈现其地理关系。
- source_word: וַיְהִי תֹצְאֹתָיו הַיָּמָּה
  choice: 尽头通到海
  rationale: תֹצְאוֹת在划界套语中指边界的出口或终点；הַיָּמָּה表示朝向海。译作“尽头通到海”兼顾公式含义和自然中文。
