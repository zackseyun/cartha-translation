revisions:
- from: 边界下到加拿溪[a]，沿着溪的南边延伸。这些城归以法莲，却在玛拿西的众城之中[b]；玛拿西的边界在溪的北边，尽头通到海[c]。
  to: 边界下到加拿溪。这些城在溪的南边，归以法莲，在玛拿西的众城中；玛拿西的边界在溪的北边，尽头到海[c]。
  rationale: 将“在溪的南边”置于“这些城”之后，以符合希伯来文的句法和本节南北两侧的对照；删除无原文依据的“沿着”和“却”。为保留全部脚注锚点，正文应标作：“边界下到加拿溪[a]。这些城在溪的南边，归以法莲，在玛拿西的众城中[b]；玛拿西的边界在溪的北边，尽头到海[c]。”
