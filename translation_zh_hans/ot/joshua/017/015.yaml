base_translation:
  language: en
  yaml_path: translation/ot/joshua/017/015.yaml
  text: Joshua said to them[a], “If you are a numerous people, go up to the forest and clear land for yourselves there in the land of the Perizzites and the Rephaim[b], since the hill country of Ephraim is too narrow for you.”
translation:
  language: zh_hans
  text: 约书亚对他们说：“如果你们人数众多，就上到森林去，在比利洗人和利乏音人之地，为自己在那里开垦林地[a]，因为以法莲山区[b]对你们来说太狭窄了。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里的希伯来语动词特指清除林木、开辟土地，也可译作“砍伐树木，在那里为自己开垦”。
    reason: lexical_alternative
  - marker: b
    text: “以法莲山区”也可译作“以法莲山”，指分给以法莲的高地地区，并非必然指某一座山峰。
    reason: lexical_alternative
lexical_decisions:
- source_word: עַם רַב
  choice: 人数众多
  rationale: 该短语在本节强调人口数量；译作“人数众多”自然清楚，也保留约书亚对约瑟子孙所声称人数优势的回应。
- source_word: עֲלֵה לְךָ הַיַּעְרָה
  choice: 上到森林去
  rationale: עֲלֵה 表示向上或前往，הַיַּעְרָה 带方向义，指进入那片林区；受益性的 לְךָ 与下句“为自己”合并表达，避免汉语重复。
- source_word: וּבֵרֵאתָ לְךָ שָׁם
  choice: 为自己在那里开垦林地
  rationale: 这里 Piel 形态的 ברא 指清除林木、开辟土地；“开垦林地”既交代动作对象，又符合现代汉语表达，并以“为自己”保留 לְךָ 的受益含义。
- source_word: בְּאֶרֶץ הַפְּרִזִּי וְהָרְפָאִים
  choice: 在比利洗人和利乏音人的地界
  rationale: 保留两个族群名称，不把“利乏音人”解释为某种超自然类别；“地界”在此自然表达其居住地域，不暗示已确立的政治疆界。
- source_word: כִּי אָץ לְךָ
  choice: 因为……对你们来说太狭窄了
  rationale: אָץ 在语境中表达受挤压、空间不足；“太狭窄”清楚说明现有分地容纳不下他们所声称的人口。
- source_word: הַר אֶפְרָיִם
  choice: 以法莲山区
  rationale: 在《约书亚记》的领土语境中，הַר 通常指山地或丘陵地带，而非单独一座山峰；“山区”简洁自然。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的普通话。希伯来文先以复数“他们”指约瑟子孙，随后用集合性单数称呼该群体；汉语全句用复数“你们”保持指代自然清晰。保留条件句与原因句的原文次序，并保留两个族名及地理称谓的开放性。
