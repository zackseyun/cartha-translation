base_translation:
  language: en
  yaml_path: translation/ot/joshua/017/007.yaml
  text: And the border of Manasseh was from Asher to Michmethath[a], which is opposite Shechem; then the border went southward[c][b], toward the inhabitants of En-tappuah.
translation:
  language: zh_hans
  text: 玛拿西的边界从亚设起，直到示剑对面的米斯密他[a]；边界又向右[b]延伸，通到隐他普亚[c]的居民那里。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“在示剑前面”或“面对示剑”。
    reason: lexical_alternative
  - marker: b
    text: 直译“向右”；在边界描述中，这可能是指向南。
    reason: lexical_alternative
  - marker: c
    text: “隐他普亚”意为“他普亚泉”。
    reason: cultural_note
lexical_decisions:
- source_word: גְבוּל
  choice: 边界
  rationale: 在分地的语境中指划定支派土地的界线；“边界”自然且适用于本节两处。
- source_word: מֵאָשֵׁר הַמִּכְמְתָת
  choice: 从亚设起，直到……密米他
  rationale: מִן标明起点；结合边界行程的句法，将密米他表达为所到之处，同时不把“亚设”限定为城名。
- source_word: אֲשֶׁר עַל־פְּנֵי שְׁכֶם
  choice: 示剑对面的
  rationale: עַל־פְּנֵי可表示在某地前面、面对或与之相对；正文用“对面”保留空间关系，不擅自明确为示剑以东。
- source_word: וְהָלַךְ הַגְּבוּל
  choice: 边界再……延伸
  rationale: הלך用于边界描述时表示界线的走向；“延伸”符合现代汉语地理表述，“再”体现叙述推进。
- source_word: אֶל־הַיָּמִין
  choice: 向右
  rationale: 希伯来文直译为“向右”；在古代方位表达中可能指向南，但正文保留原文措辞及其方向上的张力。
- source_word: יֹשְׁבֵי
  choice: 居民
  rationale: 该分词指居住在某地的人；“居民”简洁自然。
- source_word: עֵין תַּפּוּחַ
  choice: 隐·他普亚
  rationale: 作为地名采用音译，并以间隔号显示复合名称；其中עֵין的词义另见脚注。
