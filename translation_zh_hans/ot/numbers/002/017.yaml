  to: 随后，会幕和利未人的营要在各营中间起行。他们怎样安营，也要怎样起行；各按自己的位置[a]，依各自的旗号而行[b]。
  rationale: 修订首句以消除会幕单向“随着”利未人之营的歧义，表达会幕和利未人的营在各营中央共同起行。末句仅作自然语序调整；保留原文未明说的具体编组层级，不将其限定为个人或支派。脚注标记仍紧随相应译词，且均有对应脚注。
