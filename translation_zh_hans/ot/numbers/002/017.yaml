base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/017.yaml
  text: Then the tent of meeting shall set out[a], with the camp of the Levites in the midst of the camps. Just as they camp, so they shall set out[b], each in his place by their banners.
translation:
  language: zh_hans
  text: 随后，会幕和利未人的营要在各营中间起行。他们怎样安营，也要怎样起行；各按自己的位置[a]，依各自的旗号而行[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“各在自己的方位”。原文是含有“手／旁边”之意的习语，在这里指行军队列中各自的位置。
    reason: lexical_alternative
  - marker: b
    text: 或译“按着各自的旗帜”。“旗号”指用来标识各支派编组的旗帜。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָסַע
  choice: 随后……起行
  rationale: נָסַע在营地迁移的语境中指拔营出发；“起行”简洁、庄重，也与上下文所述行军次序相合。前缀连词按叙事顺序译为“随后”。
- source_word: אֹהֶל מוֹעֵד
  choice: 会幕
  rationale: 这是该名称在现代汉语圣经语境中自然且通行的表达，兼顾其作为帐幕及相会场所的含义。
- source_word: מַחֲנֵה הַלְוִיִּם
  choice: 利未人的营
  rationale: 直接体现希伯来语的属格结构，并保留“利未人”这一群体称谓。
- source_word: בְּתוֹךְ הַמַּחֲנֹת
  choice: 在各营中间
  rationale: בְּתוֹךְ在此表达居中的空间位置，说明会幕和利未人的营处于整个行军队列的中部。
- source_word: כַּאֲשֶׁר יַחֲנוּ כֵּן יִסָּעוּ
  choice: 他们怎样安营，也要怎样起行
  rationale: 保留原文“怎样……也怎样……”的对应结构，表达行军次序与安营次序一致，而不把上下文隐含的“次序”直接增入正文。
- source_word: אִישׁ
  choice: 各
  rationale: אִישׁ在这里具有分配意义，所指可涵盖队伍中的各单位；“各”比直译“各人”更符合行军编组的语境。
- source_word: עַל יָדוֹ
  choice: 按自己的位置
  rationale: 该含有“手／旁边”意象的习语在此指各自所处或被分配的位置；译文传达其编组意义，避免生硬直译。
- source_word: לְדִגְלֵיהֶם
  choice: 随各自的旗号
  rationale: דֶּגֶל指用来标识并组织支派队伍的旗帜或标志；“旗号”兼顾可见标识和编组功能。
