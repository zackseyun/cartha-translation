  text: דֶּ֣גֶל מַחֲנֵ֥ה אֶפְרַ֛יִם לְ/צִבְאֹתָ֖/ם יָ֑מָּ/ה וְ/נָשִׂיא֙ לִ/בְנֵ֣י אֶפְרַ֔יִם אֱלִישָׁמָ֖ע בֶּן עַמִּיהֽוּד־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/018.yaml
  text: The banner of the camp of Ephraim[a], by their divisions, shall be on the west[c][b]; and the leader of the sons of Ephraim shall be Elishama son of Ammihud.
translation:
  language: zh_hans
  text: 以法莲营的旗帜[a]，要按着他们的队伍[b]设在西边；以法莲子孙[c]的首领是亚米忽的儿子以利沙玛。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “旗帜”或译“旗号”。
    reason: lexical_alternative
  - marker: b
    text: “按着他们的队伍”或译“按着他们的军队（军旅）”；希伯来文含有按军事编制组织排列的意思。
    reason: lexical_alternative
  - marker: c
    text: “以法莲子孙”是希伯来文的字面表达，在这里指以法莲的后裔，即以法莲支派的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: דֶּגֶל
  choice: 旗帜
  rationale: 指辨认并统领营队的部族旗帜；“旗帜”现代、清楚，也保留军事组织背景。
- source_word: מַחֲנֵה
  choice: 营
  rationale: 这里指以法莲支派编成的营队；“营”简洁自然，并与本章安营部署的语境相符。
- source_word: לְצִבְאֹתָם
  choice: 按着他们的队伍
  rationale: צָבָא在此具有编制有序的军事组织含义；“队伍”保留组织性，又不致过分强调实际作战。
- source_word: יָמָּה
  choice: 在西边
  rationale: 该方向词字面与海的方向有关，在以色列地理方位中惯指西方；本章描述营地位置，译作“在西边”最自然。
- source_word: וְנָשִׂיא
  choice: 首领
  rationale: נָשִׂיא在此指支派领袖；“首领”准确表达职分，也避免“王子”所暗示的世袭王室身份。
- source_word: לִבְנֵי אֶפְרַיִם
  choice: 以法莲子孙
  rationale: 保留希伯来文的亲属称谓，同时在本处自然指以法莲的后裔及其支派群体。
- source_word: אֱלִישָׁמָע בֶּן עַמִּיהוּד
  choice: 亚米忽的儿子以利沙玛
  rationale: 按现代中文圣经通行形式音译人名，并明确表达בֶּן的父子关系。
theological_decisions: []
