  text: 'And his company[b][a], those numbered from them: forty-one thousand five hundred.'
translation:
  language: zh_hans
  text: 他的队伍[a]，其中被数点的[b]，共有四万一千五百人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “队伍”也可译作“军队”或“军旅”；希伯来语在安营和数点人口的语境中，可指军事编制或有组织的队伍。
    reason: lexical_alternative
  - marker: b
    text: 直译“他们中被数点的”，也可译作“他们中被点名登记的”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּצְבָאוֹ
  choice: 他这一队
  rationale: צָבָא在民数记安营与人口统计的语境中，指按支派编组的队伍，也可带有军队或军旅的含义。“队”自然简洁，既保留组织编制之意，又不把经文限定为正在作战的军队；第三人称阳性单数后缀译作“他这”。
- source_word: וּפְקֻדֵיהֶם
  choice: 中被数点的
  rationale: 该词源于פקד，在此人口统计公式中指该群体中被登记、点算的人。“被数点的”保留被动意义，并与本书常见的数点语境相符；“中”表达希伯来语复数后缀所指的所属范围。
- source_word: אֶחָד וְאַרְבָּעִים אֶלֶף וַחֲמֵשׁ מֵאוֹת
  choice: 四万一千五百
  rationale: 按现代汉语数字顺序表达希伯来文的“四十一千又五百”，数值不变。
- source_word: （由人口统计语境补足）
  choice: 共有……人
  rationale: 原文以名词短语直接列出数目，现代汉语用“共有”使句子完整流畅；量词“人”由人口统计语境明确补出，不改变所指。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“数点”保留民数记人口清点的传统经文用语，普通读者仍可从上下文清楚理解；语序调整为自然汉语，并以“共有……人”承接人数。
