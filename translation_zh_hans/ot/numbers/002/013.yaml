  language: zh_hans
  text: 他的部队中被数点的人，共有五万九千三百人。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּצְבָאוֹ
  choice: 他部队中
  rationale: צָבָא在本章安营与点兵的语境中指该支派编成的军事队伍。译作“部队”自然、庄重，并保留组织与军事含义；第三人称阳性单数后缀译为“他”，承接上文所提的领袖。与下一短语合译为“他部队中被数点的”，避免汉语中重复使用连接词。
- source_word: וּפְקֻדֵיהֶם
  choice: 被数点的
  rationale: 源自פקד，在人口统计语境中指经点名、登记而计入总数的人。“被数点的”保留其被动点算含义；末尾复数后缀所指群体已由“部队中”自然表达。
- source_word: תִּשְׁעָה וַחֲמִשִּׁים אֶלֶף
  choice: 五万九千
  rationale: 希伯来语按“九与五十千”的次序表达；依现代汉语数词习惯译为“五万九千”，数值不变。
- source_word: וּשְׁלֹשׁ מֵאוֹת
  choice: 三百
  rationale: 译出总数末尾的三百；现代汉语大数表达无需另译连接词וּ。
