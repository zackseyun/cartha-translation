  yaml_path: translation/ot/numbers/002/011.yaml
  text: And his company, even those numbered from it, was forty-six thousand five hundred.
translation:
  language: zh_hans
  text: 他的队伍，就是其中被数点的人，共有四万六千五百人。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: צְבָאוֹ
  choice: 他的队伍
  rationale: צָבָא在《民数记》数点与安营的语境中指按支派编组的队伍；“队伍”自然易懂，也保留了有组织编制的含义，而不强化为正在作战的军队。
- source_word: פְקֻדָיו
  choice: 其中被数点的
  rationale: 该词源于פקד，在此表示经数点、列入统计的人；“其中被数点的”既表达被动的数点含义，也把代词按上下文理解为属于该队伍的人。
- source_word: שִׁשָּׁה וְאַרְבָּעִים אֶלֶף וַחֲמֵשׁ מֵאוֹת
  choice: 四万六千五百人
  rationale: 按现代汉语数字习惯表达希伯来文总数，并补出量词“人”，使句意自然明确。
