base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/010.yaml
  text: The banner of the camp of Reuben shall be on the south[a], by their divisions[b]; and the leader of the sons of Reuben shall be Elizur son of Shedeur.
translation:
  language: zh_hans
  text: 吕便营的旗帜〔a〕要在南边，按他们的队伍〔b〕编列；吕便子孙的首领是示丢珥的儿子以利蓿。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דֶּגֶל
  choice: 旗帜
  rationale: 指辨识支派营队、作为集结标志的旗号；“旗帜”是现代汉语中自然且符合营地编排语境的表达。
- source_word: מַחֲנֵה
  choice: 营
  rationale: 这里指吕便支派有组织的营队；与“旗帜”连用时，“吕便营”简洁自然。
- source_word: רְאוּבֵן
  choice: 吕便
  rationale: 采用现代中文圣经中通行的人名、支派名译法。
- source_word: תֵּימָנָה
  choice: 在南边
  rationale: 该词带方向性的词尾，在本段表示营地位于南侧；“在南边”准确而自然。
- source_word: לְצִבְאֹתָם
  choice: 按各自的队伍
  rationale: צָבָא在民数记一至二章兼有军队与编组之意；“队伍”保留有秩序的组织色彩，同时避免在此处过度强化作战含义。
- source_word: וְנָשִׂיא
  choice: 首领
  rationale: 此处指支派的领袖；“首领”是庄重而清楚的现代汉语表达，不引入君王或贵族身份。
- source_word: לִבְנֵי רְאוּבֵן
  choice: 吕便子孙的
  rationale: 保留希伯来语的亲族表达，指吕便支派成员，并自然衔接“首领”。
- source_word: אֱלִיצוּר בֶּן שְׁדֵיאוּר
  choice: 示丢珥的儿子以利蓿
  rationale: 采用中文圣经通行音译，并按自然汉语次序表达父子关系。
