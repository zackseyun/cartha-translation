    text: 或译“军旅”或“军队”；希伯来语这个词可带有军事意味，这里指按支派组织起来的队伍。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּצְבָאוֹ
  choice: 他的队伍
  rationale: צָבָא可指军队、军旅或有组织的群体；本章语境是按支派编排的营队。“队伍”保留其组织性及潜在的军事色彩，又不把经文限定为正在作战的军队。
- source_word: וּפְקֻדֵיהֶם
  choice: 其中被数点的
  rationale: 该词源自פקד，在本段人口统计的语境中指被登记、点数的人。译作“被数点的”保留被动含义；用“其中”自然表达这些人属于前述支派队伍，同时不额外添加原句此处未明说的“男丁”。
- source_word: שְׁלֹשָׁה וַחֲמִשִּׁים אֶלֶף וְאַרְבַּע מֵאוֹת
  choice: 五万三千四百
  rationale: 按现代汉语数词次序准确表达原文总数53,400。
