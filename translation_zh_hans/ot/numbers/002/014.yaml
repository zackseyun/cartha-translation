  yaml_path: translation/ot/numbers/002/014.yaml
  text: 'And the tribe of Gad[a], and the leader of the sons of Gad: Eliasaph son of Reuel.'
translation:
  language: zh_hans
  text: 还有迦得支派[a]；迦得子孙的首领是流珥的儿子以利雅萨。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些抄本或平行经文所记的父名作“丢珥”（见民数记1:14）。
    reason: textual_variant
lexical_decisions:
- source_word: וְ/מַטֵּה
  choice: 还有……支派
  rationale: מַטֶּה在本章安营编组的语境中指“支派”，不是字面的“杖”；וְ承接名单，译作“还有”符合现代汉语列举方式。
- source_word: גָּד
  choice: 迦得
  rationale: 按中文圣经传统音译该支派名称。
- source_word: וְ/נָשִׂיא
  choice: 首领
  rationale: נָשִׂיא在此指获认可的支派领袖；“首领”简明、庄重，也避免“王子”等可能造成的误解。
- source_word: לִ/בְנֵי גָד
  choice: 迦得子孙的
  rationale: 该结构标明首领所属或所带领的群体；“迦得子孙”保留了בְּנֵי的亲缘与群体含义。
- source_word: אֶלְיָסָף
  choice: 以利雅萨
  rationale: 依通行中文圣经人名译法音译。
- source_word: בֶּן
  choice: ……的儿子
  rationale: 直接表达标准父子谱系句式。
- source_word: רְעוּאֵל
  choice: 丢珥
  rationale: WLC此处读作רְעוּאֵל，按该读法译为“丢珥”；不在正文中与民数记1:14的“丢珥”另一希伯来拼写作文字协调，而以脚注说明异文问题。
theological_decisions: []
