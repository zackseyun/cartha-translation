  text: 'and his division[b][a], those numbered from them: sixty-two thousand seven hundred.'
translation:
  language: zh_hans
  text: 他的队伍[a]，就是他们中被数点的人[b]，共有六万二千七百人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“军队”或“军旅”。希伯来语צָבָא可指军事队伍，也可指有组织的群体；这里指按支派编组的队伍。
    reason: lexical_alternative
  - marker: b
    text: 直译“他们被数点的”；指从该支派群体中经数点所得的人数。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּצְבָאוֹ
  choice: 他的队伍
  rationale: צָבָא可指军队、军旅或有组织的群体；在《民数记》第一至二章数点人数、安排营地的语境中，“队伍”既体现按支派编组的含义，也避免使现代读者误以为这里专指常备军。三单阳性后缀译为“他的”，连接词则按汉语句法自然处理。
- source_word: וּפְקֻדֵיהֶם
  choice: 他们中被数点的人
  rationale: 此词源于פקד，在本段反复用于指人口统计中被登记、数点的人。“他们中被数点的人”保留被动含义及其与所属群体的关系；正文用“就是”自然表达它与前面的“队伍”同指。
- source_word: שְׁנַיִם וְשִׁשִּׁים אֶלֶף וּשְׁבַע מֵאוֹת
  choice: 六万二千七百人
  rationale: 按现代汉语数字顺序准确表达希伯来文的总数，并补出量词“人”，使句子自然清楚。
