review_pass:
  verdict: revise
  source_fidelity: 原文意为利未人未被登记／计入以色列子民之中，并说明这符合雅威先前给摩西的命令。草稿的核心含义正确；但“以色列众子”在现代汉语中不自然，且容易被理解为以色列个人的儿子，而非固定族群称谓。
  naturalness: “正如雅威所吩咐摩西的”缺少与“正如”相配的“那样”，句法不完整、书面语不够自然。改为“正如雅威吩咐摩西的那样”既自然也准确。
  terminology: “利未人”“雅威”“摩西”均可保留。“以色列人”是此处 בְּנֵי יִשְׂרָאֵל 在现代汉语中最自然的正文译法；脚注应说明其字面形式为“以色列的儿子／众子”，并保留传统译法资讯。
  issues:
