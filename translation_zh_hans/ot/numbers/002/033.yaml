- from: 但利未人没有列在以色列众子中[a]，正如雅威所吩咐摩西的。
  to: 但利未人没有被计入以色列人中[a]，正如雅威吩咐摩西的那样。
  rationale: 将登记／人口统计语境中的被动式明确译为“没有被计入”，以色列的固定族群称谓译为“以色列人”，并在脚注保留原文“众子”的形式。补足“正如……那样”的对应结构，保留原文所指先前命令及雅威的专名。
