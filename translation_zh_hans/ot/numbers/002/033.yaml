    rationale: “正如”通常需由“那样”等成分收束，或改写句式；原句影响现代标准汉语的通顺性。
  - severity: medium
    issue: “以色列众子”不符合现代汉语中该固定族群名称的惯常表达。
    rationale: 该说法容易误解为以色列这一人物的儿子；此处在民数记人口统计语境中指以色列人。可在脚注保留希伯来文的字面措辞。
