  text: וְ/הַ֨/לְוִיִּ֔ם לֹ֣א הָתְפָּקְד֔וּ בְּ/ת֖וֹךְ בְּנֵ֣י יִשְׂרָאֵ֑ל כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/033.yaml
  text: But the Levites were not counted among the sons of Israel[a], as Yahweh had commanded Moses.
translation:
  language: zh_hans
  text: 但利未人没有被计入以色列人中[a]，正如雅威吩咐摩西的那样。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“以色列的众子”。也可译作“以色列子民”；传统译法是“以色列的子孙”。
    reason: 说明 בְּנֵי יִשְׂרָאֵל 的字面形式，并交代现代及传统汉语译法。
lexical_decisions:
- source_word: וְ/הַ/לְוִיִּם
  choice: 但利未人
  rationale: 连词 ו 在此承接并对照前文各支派的统计结果，用“但”自然表达转折；“利未人”是该族群名称的通行译法。
- source_word: לֹא הָתְפָּקְדוּ
  choice: 没有列在……中
  rationale: פקד 的 Hitpael 形式在本段人口统计语境中表示被登记、被计入。译作“没有列在……中”既表达其被动含义，也比“没有被数点”更符合现代汉语。
- source_word: בְּ/תוֹךְ
  choice: 在……中
  rationale: 此处表示被纳入某一群体之中；“在……中”简洁保留原文的空间性表达及其群体归属含义。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列众子
  rationale: 保留希伯来语“以色列的众子”的形式与男性复数表达；脚注说明现代汉语中更惯用的替代译法。
- source_word: כַּ/אֲשֶׁר
  choice: 正如
  rationale: 引出此事与此前神所颁命令的一致关系；“正如”自然且明确。
- source_word: צִוָּה
  choice: 所吩咐……的
  rationale: 完成式指向此前已经颁布的命令；汉语“正如……所吩咐的”无需另加时态标记即可自然表达先前性。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文直接呈现四字神名，以现代汉语常见音译“雅威”保留其专名性质，而不以称号替代。
- source_word: אֶת מֹשֶׁה
  choice: 摩西
  rationale: אֶת 是直接宾语标记，不单独译出；专名 מֹשֶׁה 采用通行译名“摩西”。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文使用四字神名而非“主”等称号。“雅威”较直接反映学界通常重构的读音，同时保留这是神的专名；“耶和华”是汉语传统译法，但源自另一种历史读音形式。
translation_notes:
  register: 采用现代、庄重而清楚的书面汉语。“列在……中”在保持人口登记语境的同时，避免较古旧的“数点”。保留“以色列众子”以呈现原文措辞，并用脚注帮助普通读者理解。
