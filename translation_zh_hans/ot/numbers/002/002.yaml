  yaml_path: translation/ot/numbers/002/002.yaml
  text: The sons of Israel shall camp[a], each man by his banner, according to the signs of their fathers’ houses; they shall camp facing the tent of meeting[c][b], all around it.
translation:
  language: zh_hans
  text: 以色列人要各按自己的旗号，照着父家的标志安营；要在会幕[a]四周、对着会幕安营。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “会幕”直译为“相会之帐幕”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ עַל דִּגְלוֹ
  choice: 各归本旗
  rationale: אִישׁ在此作逐一分配用法；“各归本旗”自然表达每个人归属本支派旗号之下，而不误导为每人各有一面旗。
- source_word: בְאֹתֹת
  choice: 按着……标志
  rationale: אוֹת在此指用于辨认父家群体的标志；介词ב表达依照或凭借这些标志来安排营位。
- source_word: לְבֵית אֲבֹתָם
  choice: 父家所属的
  rationale: “父家”保留希伯来语父系家族组织的亲属称谓；“所属的”使其与“标志”的关系在现代汉语中清楚自然。
- source_word: יַחֲנוּ
  choice: 要……安营
  rationale: 未完成式用于指令语境，译作“要……安营”体现规定性的语气。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 这是现代汉语对该族群的自然通称；若直译“以色列的儿子们”会造成不必要的字面误解。
- source_word: מִנֶּגֶד
  choice: 在……对面
  rationale: 保留该介词表示相对、面对的位置关系，且不擅自规定具体距离。
- source_word: סָבִיב
  choice: 环绕着
  rationale: 表达各营从四周围绕会幕的布局。
- source_word: אֹהֶל מוֹעֵד
  choice: 会幕
  rationale: “会幕”是现代中文圣经语境中清楚而简洁的固定用语，对应“相会之帐幕”，并保留其帐幕性质。
theological_decisions:
- issue: 群体与父系组织的表达
  choice: 以色列人要各归本旗，按着父家所属的标志安营
  alternative: 以色列的众子各人要在自己的旗下，照他们父家的标志安营
  rationale: 保留“父家”这一父系亲属结构，同时避免把单数分配结构误解为每个人拥有私人旗帜；“以色列人”准确表达整体族群。
- issue: 礼仪场所名称
  choice: 会幕
  alternative: 相会之帐幕
  rationale: “会幕”在现代标准汉语中自然、庄重且容易理解；脚注交代其较直译形式，不把该词解释成后期固定建筑。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。分号保留经文前后两项安营规定的并列结构；末句重复“会幕”，使“环绕”的中心明确，避免仅用代词造成歧义。
