  yaml_path: translation/ot/numbers/002/003.yaml
  text: Those who camp on the east side, toward the sunrise, shall be the banner of the camp of Judah by their divisions; and the leader of the sons of Judah shall be Nahshon son of Amminadab.
translation:
  language: zh_hans
  text: 在东边、朝日出方向安营的，是按着他们的队伍编列的犹大营旗队；犹大子孙的首领是亚米拿达的儿子拿顺。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קֵדְמָה מִזְרָחָה
  choice: 在东边、日出方向
  rationale: 两个方向表达并列，既保留“东边”，也保留原文以日出说明方位的措辞。
- source_word: דֶּגֶל מַחֲנֵה יְהוּדָה
  choice: 犹大营的旗号
  rationale: דֶּגֶל 在本章指以旗帜为标识的营团；译作“旗号”既保留具体旗帜意象，也可指其所属编组。
- source_word: לְצִבְאֹתָם
  choice: 按着他们的军队排列
  rationale: צָבָא 在民数记的点兵语境中指按军事单位组织的队伍；加入“排列”使其与安营语境自然衔接。
- source_word: נָשִׂיא
  choice: 首领
  rationale: 这是支派代表或领袖的常用称谓，“首领”准确且符合现代中文圣经语体。
- source_word: נַחְשׁוֹן בֶּן עַמִּינָדָב
  choice: 亚米拿达的儿子拿顺
  rationale: 按现代中文自然语序表达父子关系，并采用通行的人名译法。
