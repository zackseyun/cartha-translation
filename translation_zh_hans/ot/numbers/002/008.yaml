  yaml_path: translation/ot/numbers/002/008.yaml
  text: And his company[a], even those numbered of it[b], were fifty-seven thousand four hundred.
translation:
  language: zh_hans
  text: 他的军队[a]，就是其中被数点的[b]，共有五万七千四百人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “军队”也可译作“队伍”“军团”或“编队”；希伯来语此处指营地人口统计中按军事编制组织的队伍。
    reason: lexical_alternative
  - marker: b
    text: “被数点的”也可译作“被登记的”或“被征召登记的”；指在人口统计中正式清点、登记的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּצְבָאוֹ
  choice: 他军队中
  rationale: צָבָא在本章安营与人口统计的语境中，指该支派中按军事编制组织起来的队伍；译作“军队”简明自然，并与民数记的征兵统计背景相符。此处与后面的“被数点的”合并表达，以免汉语重复生硬。
- source_word: וּפְקֻדָיו
  choice: 被数点的
  rationale: 源自פקד的形式在本段固定统计用语中指经正式登记、清点的人。“被数点的”贴近希伯来文的被动含义，同时保留其官方统计色彩。
- source_word: שִׁבְעָה וַחֲמִשִּׁים אֶלֶף וְאַרְבַּע מֵאוֹת
  choice: 五万七千四百人
  rationale: 按现代汉语数词顺序准确表达57,400；补出量词“人”，使统计对象清楚、行文自然。
