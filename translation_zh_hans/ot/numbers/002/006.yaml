  text: 'and his division[a], and those counted from it: fifty-four thousand four hundred.'
translation:
  language: zh_hans
  text: 他的队伍[a]，以及其中被数点的人，共有五万四千四百名。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他的军队，以及其中被数点的人，共有五万四千四百名。”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּצְבָאוֹ
  choice: 他的队伍
  rationale: צָבָא可指军队、军旅或编组的队伍；在民数记第1—2章的安营与数点语境中，此处指按支派组织的军事队伍。“队伍”既保留组织编制之意，也避免使现代读者误以为这是脱离人口数点背景的常备军。
- source_word: וּפְקֻדָיו
  choice: 其中被数点的人
  rationale: 该词源自פקד，带有登记、数点之意，并有第三人称阳性单数后缀，回指前面的队伍或所属支派。“其中被数点的人”自然地表达被登记者及其与该队伍的关系，同时不额外限定为某一种兵员身份。
- source_word: אַרְבָּעָה וַחֲמִשִּׁים אֶלֶף וְאַרְבַּע מֵאוֹת
  choice: 五万四千四百
  rationale: 按现代汉语数字次序准确表达希伯来文的数目54,400。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事用语。“数点”保留民数记人口登记语境中的传统且仍可理解的术语；以“共有”自然连接编组与人数总计。主文中的[a]与脚注标记一致。
