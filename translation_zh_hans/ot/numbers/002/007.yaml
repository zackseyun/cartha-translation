  yaml_path: translation/ot/numbers/002/007.yaml
  text: 'The tribe of Zebulun[a], and the leader of the sons of Zebulun: Eliab son of Helon.'
translation:
  language: zh_hans
  text: 西布伦支派；西布伦子孙的[a]首领是希伦的儿子以利押。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“为西布伦子孙作首领的”。这里的希伯来语介词在这种支派行政用语中可表达几种彼此接近的关系。
    reason: lexical_alternative
lexical_decisions:
- source_word: מַטֵּה
  choice: 支派
  rationale: 在《民数记》人口统计和营地编排的语境中，该词指以色列的支派，而非字面的“杖”或“枝条”。
- source_word: זְבוּלֻן
  choice: 西布伦
  rationale: 按现代中文圣经中通行的专名译法处理；此处指西布伦支派。
- source_word: וְנָשִׂיא
  choice: 首领
  rationale: 在支派行政编制中指受认可的支派领袖；“首领”自然、庄重，也避免“王子”等称呼可能带来的君主身份误解。
- source_word: לִבְנֵי זְבוּלֻן
  choice: 西布伦子孙的
  rationale: 保留בני的宗族表达“子孙”，并将介词ל理解为标明首领与该支派成员的所属或关联关系。希伯来语也可理解为“为西布伦子孙作首领的”，故加注说明。
- source_word: אֱלִיאָב
  choice: 以利押
  rationale: 采用现代中文圣经中通行的专名译法。
- source_word: בֶּן חֵלֹן
  choice: 希伦的儿子
  rationale: 直接表达希伯来语常见的父系身份结构，并采用通行中文专名“希伦”。
