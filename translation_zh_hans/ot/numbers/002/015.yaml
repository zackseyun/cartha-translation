  text: 'and his company[b][a], even those numbered from them: forty-five thousand six hundred and fifty.'
translation:
  language: zh_hans
  text: 他的队伍[a]，就是其中被数点的人[b]，共四万五千六百五十人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“军队”或“军旅”；希伯来语在这里可指有组织的军事编队。
    reason: lexical_alternative
  - marker: b
    text: 或译“其中被召集登记的人”或“他们中被统计的人”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּצְבָאוֹ
  choice: 他所率的队伍
  rationale: צָבָא在本段安营与点数的语境中指按支派编组的队伍或军队单位。“他所率的队伍”自然地表达单数领袖与其所属编组的关系，同时避免把当前语境过度描写为正在作战。
- source_word: וּפְקֻדֵיהֶם
  choice: 就是其中被数点的人
  rationale: 该词源于פקד，在这里指经点名、登记或统计的人。译作“被数点的人”保留人口统计的含义；“其中”自然传达复数后缀“他们/他们当中”，且不在本句内额外补入原文未明说的“男丁”。
- source_word: חֲמִשָּׁה וְאַרְבָּעִים אֶלֶף וְשֵׁשׁ מֵאוֹת וַחֲמִשִּׁים
  choice: 四万五千六百五十人
  rationale: 按现代汉语数字表达顺序准确合并希伯来语的数词结构；末加量词“人”，使汉语自然，并由上下文明确这是人数。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事用语。“数点”保留民数记人口登记语境中的传统圣经表达，又能为普通读者理解；脚注说明其“召集登记、统计”的词义范围。所有脚注标记均置于正文相应词语之后。
