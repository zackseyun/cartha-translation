  text: All those counted for the camp of Reuben were 151,450 by their companies[b][a]. They shall set out second.
translation:
  language: zh_hans
  text: 吕便营所有被数点的人，按他们的队伍编组，共有151,450人[a]。他们将第二个出发[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “按他们的队伍编组”也可译作“按他们的军旅”或“按他们的队伍”。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“他们第二出发”，指这个营在行军次序中列第二。
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הַפְּקֻדִים
  choice: 所有被数点的
  rationale: 保留被动分词所表达的户籍统计含义，不额外加入原文此处未明说的“男丁”。
- source_word: לְמַחֲנֵה רְאוּבֵן
  choice: 吕便营中
  rationale: לְ 在这里标示归属；“吕便营中”符合现代汉语表达，也清楚指向以吕便为首的营组。
- source_word: מְאַת אֶלֶף וְאֶחָד וַחֲמִשִּׁים אֶלֶף וְאַרְבַּע מֵאוֹת וַחֲמִשִּׁים
  choice: 151,450人
  rationale: 准确呈现希伯来文数字总数；加“人”使中文计数自然，而不限定性别或年龄。
- source_word: לְצִבְאֹתָם
  choice: 按队伍编组
  rationale: צָבָא 在本段指有组织的军旅或队伍；此译既表达分队组织，也避免把现代意义上的“军队”制度直接带入文本。
- source_word: וּשְׁנִיִּם יִסָּעוּ
  choice: 他们要第二队出发
  rationale: 表达其在行军次序中居第二；“出发”自然对应旷野行程语境中的 נסע。
