    reason: lexical_alternative
lexical_decisions:
- source_word: מַטֵּה
  choice: 支派
  rationale: 在《民数记》安营次序的语境中，此词指以色列的支派单位，不是字面意义的“杖”；“支派”是现代中文中准确而自然的表达。
- source_word: בִּנְיָמִן
  choice: 便雅悯
  rationale: 采用现代中文圣经传统中通行的专名译法。
- source_word: נָשִׂיא
  choice: 首领
  rationale: 此词在《民数记》中指支派中获承认、具有代表职分的负责人；“首领”既保留其权威性，也不会产生“王子”的王室含义。
- source_word: לִבְנֵי בִנְיָמִן
  choice: 便雅悯子孙的
  rationale: 介词 לְ 在此表示首领与该支派群体的关系；正文用自然的中文领属结构表达，同时以脚注保留“为……作首领”的可能译法。
- source_word: אֲבִידָן
  choice: 亚比但
  rationale: 采用现代中文圣经传统中通行的专名译法。
- source_word: בֶּן גִּדְעֹנִי
  choice: 基多尼的儿子
  rationale: 直接表达希伯来语标准的父子谱系结构，并采用通行的中文专名译法。
