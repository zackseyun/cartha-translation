  text: 他的队伍[a]中被数点的人数[b]为七万四千六百人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“军队”或“军旅”。希伯来语 צָבָא 可带军事含义，但这里很可能指按安营次序编成的支派队伍。
    reason: lexical_alternative
  - marker: b
    text: 或译“被登记的人”或“被清点的人”。这里的希伯来语是人口普查、登记编入名册的用语。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּצְבָאוֹ
  choice: 他这一队
  rationale: צָבָא可指军队、军旅或编队；本章语境是各支派按编制安营，因此译作“这一队”，既保留组织编队之意，又不把语境强化为正在作战。
- source_word: וּפְקֻדֵיהֶם
  choice: 中被数点的
  rationale: 该词源于פקד，在此使用人口登记、核点编入名册的意义；“被数点的”保留其被动及人口核点色彩。“中”自然表达希伯来语复数后缀“他们”所指群体中的成员。
- source_word: אַרְבָּעָה וְשִׁבְעִים אֶלֶף וְשֵׁשׁ מֵאוֹת
  choice: 七万四千六百
  rationale: 按现代汉语数字顺序准确表达原文总数。句末补“人”作为现代汉语计数所需的量词性成分，所指数点对象由上下文明确。
