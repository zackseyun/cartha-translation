  terminology: “西缅支派”“首领”“西缅子孙”用语准确；“示路蔑”“苏利沙代”采用通行中文圣经人名译法。脚注应仅说明空间相邻及指代可按布局对象理解，不应无根据地扩展为“前面提到的人”。
