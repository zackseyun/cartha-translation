base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/012.yaml
  text: Those camping next to him are the tribe of Simeon[a], and the leader of the sons of Simeon is Shelumiel son of Zurishaddai.
translation:
  language: zh_hans
  text: 在其旁边安营的是西缅支派[a]；西缅子孙的首领是苏利沙代的儿子示路蔑。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在其旁边”也可译作“在它旁边”。这里的希伯来语在营地编排中表示位置相邻；“其”可指前面提到的营队、旗号或支派单位。
    reason: 保留介词的空间含义及代词先行词在营地布局语境中的不确定性。
lexical_decisions:
- source_word: וְהַחֹנִם
  choice: 安营的是
  rationale: 希伯来语分词在此作名词性用法，指正在该位置安营的人；中文用“安营的是”自然地保留这一含义。
- source_word: עָלָיו
  choice: 在他旁边
  rationale: עַל在营地排列的语境中表示相邻，而非字面上的“在……上面”；阳性单数后缀直译为“他”，同时以脚注保留可能指前述营队或旗号的“它”。
- source_word: מַטֵּה שִׁמְעוֹן
  choice: 西缅支派
  rationale: מַטֶּה在民数记的人口统计和营地编排中指以色列的支派，而不是字面意义的“杖”。
- source_word: וְנָשִׂיא
  choice: 首领
  rationale: נָשִׂיא在此指受认可的支派领袖；“首领”符合现代中文圣经叙事的庄重语体，也不带不必要的王室含义。
- source_word: לִבְנֵי שִׁמְעוֹן
  choice: 西缅子孙的
  rationale: בְּנֵי字面为“儿子们”，在支派谱系表达中自然指西缅的后裔；“子孙”既保留血缘和宗族含义，也符合现代中文习惯。
- source_word: שְׁלֻמִיאֵל
  choice: 示路蔑
  rationale: 采用现代中文圣经中通行的人名音译。
- source_word: בֶּן צוּרִי שַׁדָּי
  choice: 苏利沙代的儿子
  rationale: 按希伯来语父子名结构直译，并采用通行的中文人名音译。
theological_decisions:
- issue: לִבְנֵי שִׁמְעוֹן中的性别与宗族用语
  choice: 西缅子孙
  alternative: 西缅的儿子们／西缅人
  rationale: 这里是固定的支派谱系称谓，并非只强调西缅的亲生儿子；“子孙”保留父系后裔关系，且不会把范围误限于第一代男性。
- issue: עָלָיו的指代对象
  choice: 在他旁边，并加脚注保留“它”
  alternative: 在它旁边
  rationale: 希伯来语后缀为阳性单数，可以回指拟人化的西缅邻近对象或前文男性所指，也可按营地布局理解为前述营队或旗号；正文依形态用“他”，脚注保留真实的指代歧义。
translation_notes:
  register: 采用简洁、庄重而易懂的现代标准汉语；句式与本章营地编排的名册体例相配。人名使用中文圣经通行译名，避免生硬直译希伯来语语序。
