  text: All those counted for the camp of Judah were 186,400 by their divisions[c][b][a]. They shall set out first.
translation:
  language: zh_hans
  text: 犹大营所有被数点者，按其队伍，共有十八万六千四百人[a][b]。他们要首先出发[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “被数点者”或译“被登记的人”。
    reason: lexical_alternative
  - marker: b
    text: “队伍”或译“部队”或“军旅”。
    reason: lexical_alternative
  - marker: c
    text: “首先出发”直译为“首先起行”；按营地语境，也可译为“首先拔营”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הַפְּקֻדִים
  choice: 所有被数点的
  rationale: פְּקֻדִים在这里指人口统计或军事编组中被清点、登记的人；“被数点的”保留被动含义和本章的统计语境，又不额外补入原文未明说的身份称谓。
- source_word: לְמַחֲנֵה יְהוּדָה
  choice: 犹大营中
  rationale: לְ标示这些被数点者与犹大营的归属关系；汉语用“犹大营中”简洁自然。
- source_word: מְאַת אֶלֶף וּשְׁמֹנִים אֶלֶף וְשֵׁשֶׁת אֲלָפִים וְאַרְבַּע מֵאוֹת
  choice: 十八万六千四百人
  rationale: 准确表达总数186,400；补出量词“人”符合现代汉语，并由“被数点的”所指对象自然确定。
- source_word: לְצִבְאֹתָם
  choice: 按着队伍计算
  rationale: צָבָא可指军队、队伍或有组织的编组；“队伍”保留军事营阵背景，同时避免使其过度现代军事化。“计算”使该短语与前面的总数在汉语中衔接清楚。
- source_word: רִאשֹׁנָה יִסָּעוּ
  choice: 他们要首先出发
  rationale: רִאשֹׁנָה表示行进次序，נסע在营地语境中指起行或拔营；“首先出发”自然表达命令所规定的行军顺序。
