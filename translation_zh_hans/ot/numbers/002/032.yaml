base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/032.yaml
  text: These are the numbered men of the sons of Israel by their fathers’ houses[c][b][a]. All the numbered men of the camps by their divisions were six hundred three thousand five hundred fifty.
translation:
  language: zh_hans
  text: 这些是以色列子民[a]按父家登记的人。各营按各自队伍[b]登记的总数，共有六十万三千五百五十名。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “以色列子民”直译“以色列的众子”。
    reason: lexical_alternative
  - marker: b
    text: “队伍”或译“军旅”“军队编制”。
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּקוּדֵי
  choice: 登记的人
  rationale: 此处指在人口统计中被点数、登记的人；结合民数记1—2章，是为军队编制而登记的成年男子。正文用“登记的人”自然表达希伯来语的被动含义，并以量词“名”体现人员统计。
- source_word: בְנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 直译为“以色列的众子”，在现代汉语中“以色列人”更自然，也准确指以色列民族；脚注保留原文的家族性表达。
- source_word: לְבֵית אֲבֹתָם
  choice: 按父家
  rationale: 保留父系宗族编组的明确含义；“父家”是简洁而庄重的圣经人口统计用语。
- source_word: הַמַּחֲנֹת
  choice: 各营
  rationale: 指围绕会幕安营的各支派营区；“各营”符合本章编营语境。
- source_word: לְצִבְאֹתָם
  choice: 按队伍
  rationale: צְבָאוֹת在此表示按军旅性质组织的群体。“队伍”既体现组织编制，又避免把安营统计过度表述为正在作战的军队。
- source_word: שֵׁשׁ מֵאוֹת אֶלֶף וּשְׁלֹשֶׁת אֲלָפִים וַחֲמֵשׁ מֵאוֹת וַחֲמִשִּׁים
  choice: 六十万三千五百五十
  rationale: 按现代汉语整数表达自然译出603,550，并采用汉字数字以配合经文庄重文体。
theological_decisions:
- issue: 人口统计对象的性别
  choice: 正文译作“登记的人”，由上下文界定为可服军役的成年男子
  alternative: 直接译作“登记的男丁”或“被数点的人”
  rationale: 本节的希伯来语没有单独出现“男人”一词，但民数记1—2章的直接语境明确统计对象为二十岁以上、能出去打仗的男性。译文不把“男子”误作本节明说的词，同时也不否认上下文的性别限定。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“按父家”“各营”保留本章人口统计与安营编制的术语色彩；分成两句，使总数总结清晰。所有脚注标记均置于相关正文词语之后。
