base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/029.yaml
  text: 'And the tribe of Naphtali[a], and the leader of the sons of Naphtali: Ahira son of Enan.'
translation:
  language: zh_hans
  text: 还有拿弗他利支派；拿弗他利子孙的首领是以南的儿子亚希拉。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַטֵּה
  choice: 支派
  rationale: 在《民数记》安营编排的语境中，此词指以色列的支派单位，而非字面意义的“杖”。
- source_word: נָשִׂיא
  choice: 首领
  rationale: 此处指该支派受认可的领袖；“首领”符合现代汉语，也不带“王子”的王室含义。
- source_word: לִבְנֵי נַפְתָּלִי
  choice: 拿弗他利子孙的
  rationale: בני在支派称谓中指拿弗他利的后裔及所属成员；“子孙”自然保留其谱系含义。
- source_word: נַפְתָּלִי
  choice: 拿弗他利
  rationale: 按通行中文圣经人名音译处理；此处也作为支派名称。
- source_word: אֲחִירַע
  choice: 亚希拉
  rationale: 采用通行中文圣经人名音译。
- source_word: בֶּן
  choice: ……的儿子
  rationale: 保留希伯来语标准父子名号格式。
- source_word: עֵינָן
  choice: 以南
  rationale: 采用通行中文圣经人名音译。
