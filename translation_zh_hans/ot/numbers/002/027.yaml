lexical_decisions:
- source_word: הַחֹנִים
  choice: 安营的是
  rationale: 以名词化结构表达希伯来语分词，既保留“安营者”的持续状态，也符合现代汉语叙述习惯。
- source_word: עָלָיו
  choice: 挨着他
  rationale: 在营地排列的语境中，עַל加代词后缀表示相邻、靠近，而非位于其上；“挨着他”自然体现与前述支派相邻的位置关系。
- source_word: מַטֵּה
  choice: 支派
  rationale: 在民数记的人口统计和营地编排语境中，מַטֶּה指以色列的支派单位。
- source_word: אָשֵׁר
  choice: 亚设
  rationale: 采用现代中文圣经中通行且易辨识的专名音译。
- source_word: נָשִׂיא
  choice: 首领
  rationale: 此词指支派公认的负责人；“首领”准确、庄重，也避免“王子”所暗示的王室身份。
- source_word: לִבְנֵי אָשֵׁר
  choice: 亚设子孙的
  rationale: 保留“亚设之子”的族裔宗族表达，同时用现代汉语惯用的“子孙”表明其后裔群体。
- source_word: פַּגְעִיאֵל
  choice: 帕结
  rationale: 按中文圣经传统音译此人名。
- source_word: בֶּן עָכְרָן
  choice: 俄兰的儿子
  rationale: 直接表达希伯来语父系称谓结构，并采用通行中文音译。
