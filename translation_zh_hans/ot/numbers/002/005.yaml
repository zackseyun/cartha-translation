  text: וְ/הַ/חֹנִ֥ים עָלָ֖י/ו מַטֵּ֣ה יִשָּׂשכָ֑ר וְ/נָשִׂיא֙ לִ/בְנֵ֣י יִשָּׂשכָ֔ר נְתַנְאֵ֖ל בֶּן צוּעָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/005.yaml
  text: Those camping next to it are the tribe of Issachar[a], and the leader of the sons of Issachar is Nethanel son of Zuar.
translation:
  language: zh_hans
  text: 在它旁边安营的是以萨迦支派；以萨迦子孙的首领是苏押的儿子拿坦业。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַחֹנִים
  choice: 安营的是
  rationale: 该分词作名词性用法，指正在驻扎的群体；译为“安营的是”既自然，也保留其状态含义。
- source_word: עָלָיו
  choice: 在它旁边
  rationale: 在营地排列的语境中，此处表示与前述营旗或营队相邻，而非位于其上；“在它旁边”清楚保留代词所指。
- source_word: מַטֵּה יִשָּׂשכָר
  choice: 以萨迦支派
  rationale: מַטֶּה 在人口统计和营地编排语境中指“支派”，不是“杖”。
- source_word: נָשִׂיא
  choice: 首领
  rationale: 此词在《民数记》中指支派公认的领袖；“首领”符合现代中文，也不带不必要的王室意味。
- source_word: לִבְנֵי יִשָּׂשכָר
  choice: 以萨迦子孙的
  rationale: 保留希伯来语的宗族表达，指以萨迦的后裔和支派成员，并非只强调直接儿子。
- source_word: נְתַנְאֵל
  choice: 拿坦业
  rationale: 采用现代中文圣经传统中通行且易识别的人名音译。
- source_word: בֶּן צוּעָר
  choice: 苏押的儿子
  rationale: 按希伯来语标准父系称谓结构译出，中文表达自然清楚。
