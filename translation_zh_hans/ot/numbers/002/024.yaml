  yaml_path: translation/ot/numbers/002/024.yaml
  text: All those counted for the camp of Ephraim were 108,100 by their divisions[b][a]. They shall set out third.
translation:
  language: zh_hans
  text: 以法莲营中所有被数点的人[a]，按各自的队伍[b]，共计十万八千一百人。他们要作为第三队出发。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “被数点的人”也可译作“被点名编组的人”；希伯来语在这里兼有统计人数和召集编组的意味。
    reason: lexical_alternative
  - marker: b
    text: “队伍”也可译作“军队”或“编队”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הַפְּקֻדִים
  choice: 所有被数点的人
  rationale: פקד在这里兼有 census（清点人数）和 muster（点名编组）的语境；“被数点的人”自然承接本章人口统计，也不额外补入原文未明说的“男丁”或“战士”。
- source_word: לְמַחֲנֵה אֶפְרַיִם
  choice: 以法莲营中
  rationale: לְ表示这些被数点者归属于以法莲营这一编组；汉语用“营中”简洁自然，并与上下文的营队安排相符。
- source_word: מְאַת אֶלֶף וּשְׁמֹנַת אֲלָפִים וּמֵאָה
  choice: 十万八千一百人
  rationale: 准确保留希伯来文数字108,100，并按现代汉语习惯写出；补“人”使统计总数表达完整。
- source_word: לְצִבְאֹתָם
  choice: 按各自的队伍
  rationale: צָבָא可指军队、编队或服役群体；“队伍”保留其组织和行军色彩，同时避免把含义限定为现代意义的军事师级“部队”。
- source_word: וּשְׁלִשִׁים יִסָּעוּ
  choice: 他们要第三队出发
  rationale: שְׁלִשִׁים在此表示行军次序；“第三队出发”既表达第三顺位，也符合前文各营作为整体编组启行的语境。
