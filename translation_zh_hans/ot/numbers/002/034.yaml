  text: וַֽ/יַּעֲשׂ֖וּ בְּנֵ֣י יִשְׂרָאֵ֑ל כְּ֠/כֹל אֲשֶׁר צִוָּ֨ה יְהוָ֜ה אֶת מֹשֶׁ֗ה כֵּֽן חָנ֤וּ לְ/דִגְלֵי/הֶם֙ וְ/כֵ֣ן נָסָ֔עוּ אִ֥ישׁ לְ/מִשְׁפְּחֹתָ֖י/ו עַל בֵּ֥ית אֲבֹתָֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/034.yaml
  text: 'So the sons of Israel did according to all that Yahweh had commanded Moses: so they camped by their standards[a], and so they set out, each by his clans[c][b], according to his fathers’ house.'
translation:
  language: zh_hans
  text: 以色列人就照着耶和华所吩咐摩西的一切去做：他们按各自的旗号[a]安营，也照各人自己的宗族和父家启程。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “旗号”也可理解为“以旗号编成的营队”。
    reason: דֶּגֶל在本章既关联可见的旗帜，也关联旗帜所代表的营队编组；正文保留词义形象，脚注交代其转喻可能。
lexical_decisions:
- source_word: וַיַּעֲשׂוּ בְּנֵי יִשְׂרָאֵל
  choice: 以色列人就……去做
  rationale: וַיַּעֲשׂוּ概括以色列对前述命令的遵行；“去做”自然表达实际执行。בְּנֵי יִשְׂרָאֵל是民族性集合称谓，现代汉语用“以色列人”比直译“以色列众子”更准确自然。
- source_word: כְּכֹל אֲשֶׁר צִוָּה יְהוָה אֶת־מֹשֶׁה
  choice: 照耶和华吩咐摩西的一切
  rationale: 保留כְּכֹל的全面对应含义，并按汉语语序表达命令的发出者、对象和内容。
- source_word: כֵּן ... וְכֵן
  choice: 照……也照样
  rationale: 重复表达两项行动都与上帝的命令相符，同时避免生硬地逐字重复“如此”。
- source_word: חָנוּ לְדִגְלֵיהֶם
  choice: 照各自的旗号安营
  rationale: דֶּגֶל既可指旗号，也可借指以该旗号组织的营队；正文保留具体的“旗号”，脚注说明其组织性含义。
- source_word: נָסָעוּ
  choice: 启程
  rationale: 此处指营队从驻地出发；“启程”简洁、庄重，也比“拔营”少一层解释性增补。
- source_word: אִישׁ לְמִשְׁפְּחֹתָיו עַל־בֵּית אֲבֹתָיו
  choice: 各人都按自己的宗族和父家而行
  rationale: אִישׁ在此有逐一分配的作用；מִשְׁפָּחוֹת指宗族层级，בֵּית אָבוֹת指父系家族单位。“按……而行”使这些短语自然修饰启程行动。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。中文正文采用现代读者最熟悉且具有专名功能的“耶和华”；“雅威”是较接近学界常见重构发音的另一译法，但原始准确读音并不能完全确定。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“宗族”和“父家”保留古代以色列社会组织的两个层级；句中重复“照……照样”，以呈现原文כֵּן ... וְכֵן的强调。
