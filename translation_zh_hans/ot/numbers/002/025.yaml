base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/025.yaml
  text: The banner of the camp of Dan shall be on the north by their divisions[a]; and the leader of the sons of Dan shall be Ahiezer son of Ammishaddai.
translation:
  language: zh_hans
  text: 但支派的营旗要按着他们的队伍[a]安置在北边；但的子孙的首领是亚希以谢，亚米沙代的儿子。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“按着他们的军队”，或“按着他们的军旅”。
    reason: לְצִבְאֹתָם可指有组织的队伍、军队或军旅；正文采用语义较宽且适合安营语境的“队伍”。
lexical_decisions:
- source_word: דֶּגֶל
  choice: 旗帜
  rationale: 指各支派营地用来标识和集结的旗帜；“旗帜”现代、清楚，也符合本章安营次序的语境。
- source_word: מַחֲנֵה
  choice: 营
  rationale: 指但支派有组织的营队；“但营”简洁自然，并保留原文的结构。
- source_word: צָפֹנָה
  choice: 在北边
  rationale: 此处方向形式表达会幕营地布局中的方位，“在北边”准确而自然。
- source_word: לְצִבְאֹתָם
  choice: 按着他们的队伍
  rationale: צָבָא在这里指按军事方式组织的群体。“队伍”能表达有秩序的编组，同时避免过度强调战争含义；其他可能译法见脚注。
- source_word: וְנָשִׂיא
  choice: 首领
  rationale: נָשִׂיא在支派行政语境中指公认的支派领袖；“首领”准确且不会令人误解为君王或王子。
- source_word: לִבְנֵי דָן
  choice: 但子孙的
  rationale: 保留בְנֵי的家族、支派称谓，译作“但子孙”比逐字的“但的儿子们”更符合现代汉语，也仍体现其男性复数形式。
- source_word: אֲחִיעֶזֶר
  choice: 亚希以谢
  rationale: 按现代中文圣经人名的通行音译处理。
- source_word: בֶּן עַמִּישַׁדָּי
  choice: 亚米沙代的儿子
  rationale: 直接表达希伯来语父子谱系结构，并采用通行人名音译。
theological_decisions:
- issue: בְנֵי的性别化支派称谓
  choice: 但子孙
  alternative: 但支派的人；但的后裔
  rationale: “但子孙”保留原文以男性复数表达的传统支派称谓，又比“但的儿子们”更符合现代汉语。它没有把所指范围擅自限定为每一个男性个体，也未消除原文的亲属谱系表达。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。原文是省略谓语的营地编排公式，正文补出“要……排列”，使中文句法完整，同时不改变方位和编组关系。人名采用中文圣经传统通行译名。
