    reason: lexical_alternative
lexical_decisions:
- source_word: וּצְבָאוֹ
  choice: 他军队中
  rationale: צָבָא可指军队、军旅或按军事方式编组的队伍。民数记第2章描述各支派在旷野中的编营，因此译作“军队”既保留军事编制色彩，也符合本章反复使用的术语。
- source_word: וּפְקֻדֵיהֶם
  choice: 被数点的
  rationale: 该词源于פקד，在本段指为人口统计及编组而登记、数点的人。“被数点的”保留被动含义和人口统计语境；原文复数后缀“他们”在中文中按上下文自然表达为“他军队中”。
- source_word: חֲמִשָּׁה וּשְׁלֹשִׁים אֶלֶף וְאַרְבַּע מֵאוֹת
  choice: 三万五千四百人
  rationale: 按现代汉语数词次序准确表达总数35,400；补出量词“人”，使所数对象清楚自然。
