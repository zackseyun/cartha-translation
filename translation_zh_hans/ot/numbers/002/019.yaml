  text: 他的队伍，以及其中被数点的人[a]，共有四万零五百人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“被登记的人”或“被征召登记的人”。这个希伯来词在这里可指人口统计中被登记、点算以服役的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּצְבָאוֹ
  choice: 他的队伍中
  rationale: צָבָא在民数记安营与人口统计的语境中，指按支派编组的服役队伍。“队伍”既保留组织和军事色彩，又比“军队”更适合本节的名单体例；介词“中”自然表达后一句所数点的人属于这支队伍。
- source_word: וּפְקֻדֵיהֶם
  choice: 被数点的[a]
  rationale: 源自动词פקד，在本段指人口统计中被登记、点算或召集入册的人。译作“被数点的”沿用庄重而易懂的圣经语体，同时不在正文中补入原文未明说的“男子”。复数后缀“他们”所表达的群体归属，在汉语“他的队伍中”这一结构里已自然体现。
- source_word: אַרְבָּעִים אֶלֶף וַחֲמֵשׁ מֵאוֹת
  choice: 四万零五百人
  rationale: 按希伯来文基数词直译数目；补“人”是现代汉语计数所需的量词，不改变原意。
