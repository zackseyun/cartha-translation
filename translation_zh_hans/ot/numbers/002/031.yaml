  text: All those counted for the camp of Dan were 157,600[a]. They shall set out last by their standards.
translation:
  language: zh_hans
  text: 但营被数点的总数，共有十五万七千六百人。他们要按他们的旗号[a]最后出发。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“按他们的军旗”。希伯来语此词指支派营队所用的旗号，也可指按旗号编成的营队。
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הַפְּקֻדִים
  choice: 所有被数点的
  rationale: 被动分词指人口统计中登记、数点的人；译文不在本节重复补入原文未明说的“男丁”。
- source_word: לְמַחֲנֵה דָן
  choice: 但营中
  rationale: לְ在此表示归属关系；“但营中”简洁自然，指以但支派为首的营队。
- source_word: מְאַת אֶלֶף וְשִׁבְעָה וַחֲמִשִּׁים אֶלֶף וְשֵׁשׁ מֵאוֹת
  choice: 十五万七千六百人
  rationale: 准确保留总数157,600，并按现代中文习惯用汉字表达经文数字。
- source_word: לָאַחֲרֹנָה
  choice: 最后
  rationale: 表示行军次序中的末位；“最后”直接、自然。
- source_word: יִסְעוּ
  choice: 出发
  rationale: נסע在旷野行程语境中指拔营启程；“出发”符合现代汉语，又不额外强调原文未明确表达的动作细节。
- source_word: לְדִגְלֵיהֶם
  choice: 按自己的旗号
  rationale: דגל指营地与行军编组所用的旗号，也可引申为该旗号统属的队伍；“按自己的旗号”保留编组和标识的意象。
