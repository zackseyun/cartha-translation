base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/001.yaml
  text: And Yahweh spoke to Moses and to Aaron[a], saying,
translation:
  language: zh_hans
  text: 雅威对摩西和亚伦说：
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: 说
  rationale: 该动词在神谕引介公式中表示发言；现代汉语用“说”自然、庄重，并与下文直接引语顺畅衔接。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 这是四字神名；“耶和华”是现代中文圣经语境中通行且可辨识的专名译法，不以“主”这一称号替代。
- source_word: אֶל מֹשֶׁה וְאֶל אַהֲרֹן
  choice: 对摩西和亚伦
  rationale: 重复的介词 אֶל 表明摩西和亚伦同为受话者；汉语以一个“对”统领并列对象即可准确自然地表达。
- source_word: לֵאמֹר
  choice: 说：
  rationale: 该不定式公式引出下一节的讲话内容；汉语以“说：”及冒号清楚标示引语即将开始。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名，正文保留为专名而不改作称号“主”。“耶和华”在简体中文普通读者中辨识度最高；“雅威”更接近学界常见的拟音，但原始发音并不能完全确定。
translation_notes:
  register: 采用现代、简洁而庄重的叙事语言。中文无需机械复现希伯来语两个 אֶל；“对摩西和亚伦说”保留两人同为受话者的意义。冒号提示讲话内容延续到下一节。
