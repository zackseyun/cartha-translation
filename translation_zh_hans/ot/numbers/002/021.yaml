  yaml_path: translation/ot/numbers/002/021.yaml
  text: 'and his division[a], those numbered from them: thirty-two thousand two hundred.'
translation:
  language: zh_hans
  text: 他的队伍[a]中，被数的共有三万二千二百人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“军队”或“军旅”；希伯来语צָבָא在这里指为安营和行军而编组的支派队伍。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּצְבָאוֹ
  choice: 他的队伍
  rationale: צָבָא可指军队、军旅或编组的队伍；本章语境是各支派按营位和行军次序编组，因此用现代汉语“队伍”既表达组织单位，也避免过度突出实际作战。第三人称单数后缀译作“他的”。
- source_word: וּפְקֻדֵיהֶם
  choice: 其中，被数的共有
  rationale: 该词指经点数、登记或检阅的人。希伯来语使用复数后缀“他们的”，承接作为集合体的队伍；汉语用“其中”自然表达从该队伍中数点人数，并以“共有”引出总数。
- source_word: שְׁנַיִם וּשְׁלֹשִׁים אֶלֶף וּמָאתָיִם
  choice: 三万二千二百人
  rationale: 按现代汉语常用数词顺序表达32,200，并补出量词“人”，明确这是被数点的人数。
theological_decisions: []
