base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/020.yaml
  text: And next to him was the tribe of Manasseh[a], and the leader of the sons of Manasseh was Gamaliel son of Pedahzur.
translation:
  language: zh_hans
  text: 挨着他的是玛拿西支派[a]；玛拿西子孙的首领是比大蓿的儿子迦玛列。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在他旁边的是玛拿西支派。”希伯来语介词短语在这里表示营地编队中的相邻位置。
    reason: 词义存在可保留的表达差异；脚注说明该短语表示相邻，而不是上下关系或权柄关系。
lexical_decisions:
- source_word: וְעָלָיו
  choice: 挨着他的是
  rationale: 在本章安营编队的语境中，עַל 加代词后缀表示空间上的相邻，而非居于其上或掌权；“挨着他”自然、明确地表达相邻位置。
- source_word: מַטֵּה
  choice: 支派
  rationale: 在民数记的人口统计与营地编排语境中，该词指以色列的支派单位，并非字面意义的“杖”。
- source_word: מְנַשֶּׁה
  choice: 玛拿西
  rationale: 按现代中文圣经人名的通行译法音译该人名及支派名。
- source_word: וְנָשִׂיא
  choice: 首领
  rationale: נָשִׂיא 在民数记中通常指获指定的支派领袖；“首领”既体现其正式身份，也避免“王子”等可能造成的误解。
- source_word: לִבְנֵי מְנַשֶּׁה
  choice: 玛拿西子孙的
  rationale: 保留 בנים 所表达的谱系群体含义；在“首领”之前译作属格结构，符合现代汉语表达。
- source_word: גַּמְלִיאֵל
  choice: 迦玛列
  rationale: 采用现代中文圣经传统中清楚且通行的人名音译。
- source_word: בֶּן
  choice: ……的儿子
  rationale: 准确表达希伯来语父名结构，同时采用自然的现代汉语语序。
- source_word: פְּדָהצוּר
  choice: 比大蓿
  rationale: 采用现代中文圣经传统中通行的人名音译。
