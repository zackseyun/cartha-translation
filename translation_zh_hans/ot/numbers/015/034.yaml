source:
  edition: WLC
  text: וַ/יַּנִּ֥יחוּ אֹת֖/וֹ בַּ/מִּשְׁמָ֑ר כִּ֚י לֹ֣א פֹרַ֔שׁ מַה יֵּעָשֶׂ֖ה לֽ/וֹ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/034.yaml
  text: So they put him in custody[a], because it had not been made clear what should be done to him.
translation:
  language: zh_hans
  text: 于是他们把他拘押起来，因为还没有明确说明[a]该怎样处置他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因为还没有规定要怎样处置他。”
    reason: פרש在这里既可侧重“明确说明”，也可侧重“具体规定”；脚注保留这一词义差异。
lexical_decisions:
- source_word: וַיַּנִּיחוּ
  choice: 把……拘押起来
  rationale: נוח的使役形在此表示安置、留置；结合司法叙事语境，与בַּמִּשְׁמָר合译为“拘押起来”，自然表达将此人置于看守之下。
- source_word: אֹתוֹ
  choice: 他
  rationale: 阳性单数直接宾语代词，指上文被发现捡柴的那个人。
- source_word: בַּמִּשְׁמָר
  choice: 拘押
  rationale: מִשְׁמָר可指看守、羁押或拘留之处。“拘押”准确传达暂时受看管的法律语境，又不把它说成已经判处监禁。
- source_word: כִּי
  choice: 因为
  rationale: 引出拘押此人的原因；现代汉语中“因为”清楚自然。
- source_word: לֹא פֹרַשׁ
  choice: 还没有明确说明
  rationale: פרש的被动形式表示某事尚未被清楚陈明或具体规定。“还没有明确说明”保留被动含义和裁决尚不明确的状态。
- source_word: מַה יֵּעָשֶׂה לוֹ
  choice: 该怎样处置他
  rationale: 该分句所问的是应对他采取什么行动；“该怎样处置他”符合汉语法律叙事表达，也保留应然和待定的意味。
theological_decisions:
- issue: 法律程序中不确定之处的性质
  choice: 经文只说该怎样处置此人尚未得到明确说明，并不暗示人们对律法整体一无所知。
  alternative: 也可较窄地理解为，对他的具体刑罚尚未作出规定。
  rationale: 被动表述לֹא פֹרַשׁ着眼于尚未清楚说明或具体规定。正文保留程序上的不确定性，不额外断定未知的仅仅是刑罚，还是更广义的处置办法。
translation_notes:
  register: 采用现代、庄重而通顺的叙事语言。“拘押起来”比“关进监狱”更准确地表达临时看守，避免暗示已经正式定罪判刑；“处置”符合司法语境，但不擅自补出具体刑罚。
