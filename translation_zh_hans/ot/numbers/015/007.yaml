base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/007.yaml
  text: and wine for the drink offering[a], a third of a hin, you shall present[c][b], a pleasing aroma to Yahweh.
translation:
  language: zh_hans
  text: 又要献上三分之一欣的酒作奠祭[a][b]，作为献给雅威的馨香[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “奠祭”也可译作“奠酒”；希伯来语所指的是随祭牲浇献的饮品祭物。
    reason: lexical_alternative
  - marker: b
    text: “欣”是古代的液体容量单位。
    reason: cultural_note
  - marker: c
    text: “馨香”也可译作“怡人的香气”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/יַיִן
  choice: 又要献上……酒
  rationale: יַיִן是普通的“酒”；前缀וְ承接上文的献祭条例，汉语用“又”自然连接。
- source_word: לַ/נֶּסֶךְ
  choice: 作奠祭
  rationale: נֶסֶךְ指随祭牲浇献的液体祭物；“奠祭”简洁保留其礼仪含义，脚注补明实际动作。
- source_word: שְׁלִשִׁית הַ/הִין
  choice: 三分之一欣
  rationale: 原文明确规定古代容量单位的三分之一；保留“欣”而不换算成不确定的现代容量。
- source_word: תַּקְרִיב
  choice: 要献上
  rationale: קרב的使役式在献祭语境中意为呈献、献上；“要献上”自然表达这里的指令语气。
- source_word: רֵיחַ נִיחֹחַ
  choice: 馨香
  rationale: 这是固定的献祭用语，表示令人愉悦、蒙悦纳的香气；“馨香”庄重凝练，同时以脚注保留其他直译可能。
- source_word: לַ/יהוָה
  choice: 献给雅威
  rationale: 介词ל表示献祭的对象；将神名יהוה音译为“雅威”，保留原文的专名性质。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；“雅威”较贴近学界通常重构的读音，也不以称号替代专名。
- issue: רֵיחַ נִיחֹחַ的祭祀含义
  choice: 馨香
  alternative: 怡人的香气；使人舒畅的香气
  rationale: 译文保留原文的嗅觉意象及祭物蒙悦纳的含义，但不将其扩展为原文未明说的系统神学论断。
translation_notes:
  register: 采用现代、庄重而易懂的礼仪语言。为符合汉语语序，将数量、祭物和用途合并为“献上三分之一欣的酒作奠祭”，并保留原文“馨香”的献祭意象。所有脚注标记均置于对应词语之后。
