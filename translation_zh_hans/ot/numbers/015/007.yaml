revisions:
- from: 又要献上三分之一欣的酒作奠祭[a][b]，成为献给雅威的馨香[c]。
  to: 又要献上三分之一欣的酒作奠祭[a][b]，作为献给雅威的馨香[c]。
  rationale: 修订仅澄清末尾固定献祭语的句法功能：所献的酒是作为献给雅威的馨香而呈献，并非字面上‘成为’香气。其余数量、祭物类别、命令语气及神名译法均予保留；脚注c删去可能误定受感者的替代说法。
