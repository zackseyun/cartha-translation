language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/כִפֶּ֣ר הַ/כֹּהֵ֗ן עַֽל כָּל עֲדַ֛ת בְּנֵ֥י יִשְׂרָאֵ֖ל וְ/נִסְלַ֣ח לָ/הֶ֑ם כִּֽי שְׁגָגָ֣ה הִ֔וא וְ/הֵם֩ הֵבִ֨יאוּ אֶת קָרְבָּנָ֜/ם אִשֶּׁ֣ה לַֽ/יהוָ֗ה וְ/חַטָּאתָ֛/ם לִ/פְנֵ֥י יְהוָ֖ה עַל שִׁגְגָתָֽ/ם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/025.yaml
  text: And the priest shall make atonement for all the congregation of the sons of Israel[a], and they shall be forgiven, because it was an unintentional error, and they have brought their offering, an offering made by fire to Yahweh, and their sin offering before Yahweh[c][b], for their unintentional error.
translation:
  language: zh_hans
  text: 祭司要为以色列人全会众赎罪，他们就必蒙赦免；因为这是出于误犯，他们又已把他们的供物，就是献给雅威的火祭[a]和他们的赎罪祭[b]，带到雅威面前，为他们的误犯。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “火祭”也可译作“用火献的祭”。
    reason: lexical_alternative
  - marker: b
    text: “赎罪祭”也可译作“洁净祭”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִפֶּר
  choice: 赎罪
  rationale: כפר 的皮埃勒词干在献祭语境中指施行赎罪；“为……赎罪”是现代汉语中清楚且保留礼仪与神学分量的表达。
- source_word: עַל כָּל עֲדַת בְּנֵי יִשְׂרָאֵל
  choice: 为以色列人全会众
  rationale: עַל 在 כפר 后表示“为、代表”；עֲדָה 译作“会众”，בְּנֵי יִשְׂרָאֵל 按现代汉语习惯译作“以色列人”。
- source_word: וְנִסְלַח לָהֶם
  choice: 他们就必蒙赦免
  rationale: 保留希伯来文被动语态，不擅自补出施行赦免者；“蒙赦免”自然且庄重。
- source_word: כִּי שְׁגָגָה הִוא
  choice: 因为这是无意中犯的错
  rationale: שְׁגָגָה 表示非故意的过错或罪；此译法兼顾其无意性和道德、律法层面的过犯含义。
- source_word: אֶת קָרְבָּנָם
  choice: 供物
  rationale: קָרְבָּן 是带到上帝面前的广义祭物；“供物”能与下文具体祭类区分。
- source_word: אִשֶּׁה לַיהוָה
  choice: 献给雅威的火祭
  rationale: אִשֶּׁה 是与火献有关的祭物；“火祭”简明保留该词的祭祀特征，又不扩写为“食物”。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代普通话常见音译呈现四字神名，保留其专名性质，不以称号替代。
- source_word: וְחַטָּאתָם
  choice: 以及赎罪祭
  rationale: 此处所指是被带到雅威面前的祭物，故须按献祭意义翻译；“洁净祭”也是可辩护的词义选择，列于脚注。
- source_word: עַל שִׁגְגָתָם
  choice: 为自己无意中犯的错
  rationale: 与本节前面的同根词保持一致，并表明这些祭物是因该无意过犯而献。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；译作“雅威”保留其专名身份，并采用较贴近学界重构读音的现代汉语形式。
- issue: חַטָּאת 在本节是“罪”还是祭物名称
  choice: 赎罪祭
  alternative: 洁净祭
  rationale: 句法说明这是会众带到雅威面前的祭物，因此不能只译作抽象的“罪”；“洁净祭”能突出其礼仪洁净功能，但“赎罪祭”更为普通读者熟悉，故将前者保留在脚注。
- issue: כִּי... וְהֵם הֵבִיאוּ 的逻辑关系
  choice: 将无意过犯与已经献祭都置于赦免的理由说明中
  alternative: 把献祭部分作为独立的后续陈述
  rationale: 希伯来文的 כִּי 后接陈述，并以 וְ 连续说明他们已经带来祭物；译文保留二者紧密相连，而不判定其更细微的因果层级。
translation_notes:
  register: 采用现代、庄重而易懂的律法文本语体。“无意中犯的错”避免把 שְׁגָגָה 弱化为普通疏忽，同时不把原文未明说的主观状态具体化。调整语序，把“为自己无意中犯的错”置于献祭动作之前，使中文关系清楚；脚注标记均置于相关整句末尾。
