  to: 如果这事是无意中做的，没有被会众察觉，那么全会众就要献一头公牛作燔祭，献给雅威，作蒙悦纳的馨香；又要连同所配的素祭和奠祭，照规定献上；再献一只公山羊作赎罪祭[a]。
