source:
  edition: WLC
  text: וְ/הָיָ֗ה אִ֣ם מֵ/עֵינֵ֣י הָ/עֵדָה֮ נֶעֶשְׂתָ֣ה לִ/שְׁגָגָה֒ וְ/עָשׂ֣וּ כָל הָ/עֵדָ֡ה פַּ֣ר בֶּן בָּקָר֩ אֶחָ֨ד לְ/עֹלָ֜ה לְ/רֵ֤יחַ נִיחֹ֨חַ֙ לַֽ/יהוָ֔ה וּ/מִנְחָת֥/וֹ וְ/נִסְכּ֖/וֹ כַּ/מִּשְׁפָּ֑ט וּ/שְׂעִיר עִזִּ֥ים אֶחָ֖ד לְ/חַטָּֽת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/024.yaml
  text: then[a], if it was done unintentionally and escaped the notice of the congregation, all the congregation shall offer one bull from the herd for a burnt offering, for a pleasing aroma to Yahweh, with its grain offering and its drink offering, according to the ordinance, and one male goat for a sin offering.
translation:
  language: zh_hans
  text: 如果这事是无意中做的，没有被会众察觉，那么全会众就要献一头公牛作燔祭，献给雅威，作蒙悦纳的馨香；又要连同所配的素祭和奠祭，照规定献上；再献一只公山羊作赎罪祭[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“洁净祭”。希伯来语 חַטָּאת 可指与罪有关的祭，也可强调这种祭在礼仪上的洁净作用。
    reason: 保留该祭祀术语在“赎罪”与礼仪洁净侧重点之间的词义选择。
lexical_decisions:
- source_word: מֵעֵינֵי הָעֵדָה
  choice: 没有被会众察觉
  rationale: 这是希伯来语习语，直译为“从会众眼中”，此处指事情未被会众留意或察觉；所选译法自然且保留原意。
- source_word: נֶעֶשְׂתָה לִשְׁגָגָה
  choice: 这事是无意中做的
  rationale: שְׁגָגָה表示非故意的过失，与下文蓄意犯罪形成法律和祭仪上的区别。
- source_word: כָל הָעֵדָה
  choice: 全会众
  rationale: עֵדָה指以色列共同体；“全会众”简洁地保留כָל的整体范围。
- source_word: פַּר בֶּן בָּקָר אֶחָד
  choice: 一头公牛
  rationale: 该短语指牛群中的一头公牛；现代汉语无需逐字译出“牛群之子”。
- source_word: לְעֹלָה
  choice: 作燔祭
  rationale: עֹלָה是固定祭祀术语，译作“燔祭”可保持经文术语的一致性。
- source_word: לְרֵיחַ נִיחֹחַ
  choice: 作为……蒙悦纳之香
  rationale: 该祭祀习语表达祭物在神面前蒙悦纳，同时保留“香气”的原有意象，避免仅译成嗅觉上的“香味”。
- source_word: לַיהוָה
  choice: 献给雅威
  rationale: 直接音译神圣四字名יהוה，保留经文中的盟约之名。
- source_word: וּמִנְחָתוֹ
  choice: 相应的素祭
  rationale: מִנְחָה在此祭祀语境中指随燔祭同献的谷物祭；“相应的”表达阳性单数后缀与公牛祭牲的关联。
- source_word: וְנִסְכּוֹ
  choice: 奠祭
  rationale: נֶסֶךְ指伴随祭物浇奠的酒祭，“奠祭”是简明而通行的汉语祭祀术语。
- source_word: כַּמִּשְׁפָּט
  choice: 按规定
  rationale: מִשְׁפָּט在此指既定的祭仪条例；“按规定”比抽象的“按审判”更符合语境。
- source_word: וּשְׂעִיר עִזִּים אֶחָד
  choice: 一只公山羊
  rationale: שְׂעִיר עִזִּים明确指雄性山羊，因此保留“公”。
- source_word: לְחַטָּאת
  choice: 作赎罪祭
  rationale: חַטָּאת是与罪及洁净有关的祭物名称；“赎罪祭”是现代中文圣经语境中易懂且较稳定的称呼，另一种侧重洁净功效的译法置于脚注。
theological_decisions:
- issue: 祭祀术语חַטָּאת的含义
  choice: 赎罪祭
  alternative: 洁净祭
  rationale: 该词既可突出祭物与罪的关系，也可突出礼仪洁净的作用。正文采用读者较熟悉的“赎罪祭”，脚注保留“洁净祭”这一真实的词义取向，不把两者之间的张力消解掉。
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”较接近学界通常重构的读音，也清楚区别于作为称号的“主”。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。句式顺应中文表达，同时保留条件结构、会众的整体责任、祭物种类及伴随祭物等原文信息。
