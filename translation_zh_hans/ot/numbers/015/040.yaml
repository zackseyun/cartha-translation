  text: לְמַ֣עַן תִּזְכְּר֔וּ וַ/עֲשִׂיתֶ֖ם אֶת כָּל מִצְוֺתָ֑/י וִ/הְיִיתֶ֥ם קְדֹשִׁ֖ים לֵֽ/אלֹהֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/040.yaml
  text: so that you may remember and do all my commandments[a], and be holy to your God.
translation:
  language: zh_hans
  text: 好使你们记住并遵行我的一切诫命，成为圣洁，归于你们的上帝。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְמַעַן
  choice: 好使
  rationale: 引出目的或结果；“好使”自然地保留了希伯来语的目的意味。
- source_word: תִּזְכְּרוּ
  choice: 你们记住
  rationale: 该词在目的从句中指牢记、不忘；“记住”是现代汉语中直接而自然的表达。
- source_word: וַעֲשִׂיתֶם
  choice: 并遵行
  rationale: עשה在诫命语境中指实行、履行；汉语通常说“遵行诫命”，既准确又自然，并未将其缩减为仅仅听从。
- source_word: אֶת כָּל מִצְוֺתָי
  choice: 我的一切诫命
  rationale: 保留כָּל的全称范围和第一人称所有关系；“诫命”符合盟约及律法语境。
- source_word: וִהְיִיתֶם
  choice: 成为……的人
  rationale: היה与谓语形容词连用，可表达处于或进入某种状态；结合目的链条译为“成为……的人”，使现代汉语完整自然。
- source_word: קְדֹשִׁים
  choice: 为圣
  rationale: 保留“圣洁、分别为圣”的广阔语义，不将其局限为道德纯洁或礼仪上的分别。
- source_word: לֵאלֹהֵיכֶם
  choice: 归你们的上帝
  rationale: 介词ל表示与上帝的归属或关系；在“为圣”的语境中，“归……为圣”比生硬的“对你们的上帝圣洁”更符合现代汉语，同时保留盟约归属意味。
theological_decisions:
- issue: 盟约语境中“圣”的含义
  choice: 译作“归你们的上帝为圣”，保留“圣”的核心术语及归属关系。
  alternative: 作“分别出来归给你们的上帝”或“对你们的上帝圣洁”。
  rationale: קְדֹשִׁים涵盖伦理、盟约和礼仪层面；保留“为圣”可避免把它缩减为单纯的道德顺服或礼仪分别。“归”表达ל所标示的关系，但不限定圣洁的具体维度。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“好使”承接上文的目的结构；“遵行诫命”和“归……为圣”符合中文圣经语域，也能为普通读者理解。原英文脚注将“set apart to your God”误挂在“commandments”之后，且其内容实为קְדֹשִׁים לֵאלֹהֵיכֶם的释义；正文已经以“归……为圣”兼顾该语义，因此不另设脚注。
