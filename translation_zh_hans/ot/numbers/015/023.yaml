source:
  edition: WLC
  text: אֵת֩ כָּל אֲשֶׁ֨ר צִוָּ֧ה יְהוָ֛ה אֲלֵי/כֶ֖ם בְּ/יַד מֹשֶׁ֑ה מִן הַ/יּ֞וֹם אֲשֶׁ֨ר צִוָּ֧ה יְהוָ֛ה וָ/הָ֖לְאָה לְ/דֹרֹתֵי/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/023.yaml
  text: everything that Yahweh has commanded you through Moses[a], from the day that Yahweh commanded and onward throughout your generations—
translation:
  language: zh_hans
  text: 就是耶和华借着摩西吩咐你们的一切；从耶和华发出命令的那日起往后，直到你们的世世代代——
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵת כָּל אֲשֶׁר
  choice: ……的一切
  rationale: 概括后续全部命令，既保留 כָּל 的周全含义，也符合现代汉语表达。
- source_word: צִוָּה
  choice: 吩咐／颁布命令
  rationale: 两处均表达耶和华所发的命令；首处用“吩咐”自然连接受命者，次处用“颁布命令”使时间起点清楚。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的专名形式呈现四字神名，不以称号替代。
- source_word: אֲלֵיכֶם
  choice: 你们
  rationale: 保留希伯来语第二人称复数所指的群体受命者。
- source_word: בְּיַד מֹשֶׁה
  choice: 藉着摩西
  rationale: “在摩西手中／借摩西之手”是表示媒介或代理的习语；“藉着摩西”准确而自然。
- source_word: מִן הַיּוֹם אֲשֶׁר
  choice: 从……的那一天起
  rationale: 明确标示命令开始生效的时间起点。
- source_word: וָהָלְאָה
  choice: 直到以后
  rationale: 表达从所述时间点向后延续；与下文“世世代代”共同体现持续性。
- source_word: לְדֹרֹתֵיכֶם
  choice: 世世代代
  rationale: 自然表达命令在以色列后续各代中的持续适用。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: “耶和华”是现代简体中文圣经传统中最广为普通读者识别的专名形式，保留其作为神名而非称号的功能；原文在本节两次使用该神名。
- issue: 命令持续范围的表达
  choice: 从……那一天起，直到以后，世世代代都如此
  alternative: 从……那一天起，世世代代
  rationale: 同时保留 וָהָלְאָה 的向后延续意义与 לְדֹרֹתֵיכֶם 的世代范围，不将二者压缩为一个概念。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。本节语法承接上一节，因此保留句末破折号，表示句意尚未完结。“就是”使其与前文所说的命令自然衔接。
