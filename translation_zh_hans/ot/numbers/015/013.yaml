base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/013.yaml
  text: Every native-born person shall do these things in this way[a], to present a food offering[b], a pleasing aroma to Yahweh.
translation:
  language: zh_hans
  text: 凡本地人都要照这样做这一切，献上火祭[a]，作献给雅威、蒙悦纳的馨香。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “火祭”也可译作“经火献上的祭物”或“火献祭”；原文是指经火献上的祭祀专用词。
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הָאֶזְרָח
  choice: 凡本地人
  rationale: כָּל 与单数名词连用，在这里具有逐一涵盖的分配意义；הָאֶזְרָח 指本地社群中的人，与下文寄居者相对。“凡本地人”自然表达其普遍、代表性的法律用语。
- source_word: יַעֲשֶׂה כָּכָה אֶת אֵלֶּה
  choice: 都要这样办理这些事
  rationale: 未完成式在律法语境中表示规定或义务；כָּכָה 指按前文所定的方式，אֵלֶּה 回指上述各项献祭规定。
- source_word: לְהַקְרִיב
  choice: 献上
  rationale: 该词基本义为“使靠近”，在祭祀语境中惯指把祭物带来并献上；“献上”简洁而符合现代汉语。
- source_word: אִשֵּׁה
  choice: 火祭
  rationale: 这是祭祀专门用语，传统上理解为经火献上的祭物；正文采用简洁的“火祭”，并以脚注保留“经火献上的祭物”等译法。
- source_word: רֵיחַ נִיחֹחַ
  choice: 所喜悦的馨香
  rationale: 这是献祭语境中的固定表达，表明祭物蒙悦纳；“馨香”保留气味意象，“所喜悦的”传达 נִיחֹחַ 的悦纳含义。
- source_word: לַיהוָה
  choice: 雅威
  rationale: 原文直接使用四字神名 יהוה；音译为“雅威”，保留其作为以色列之神圣约名字的性质。
theological_decisions:
- issue: הָאֶזְרָח 的阳性单数形式是否应明确译为男性
  choice: 本地人
  alternative: 本地男子
  rationale: 该词在语法上为阳性单数，但在本段法律条文中具有代表性、通称作用；上下文重点是本地人与寄居者的对照，并非限定性别，因此不额外加入原文未明确强调的“男子”。
- issue: רֵיחַ נִיחֹחַ 的祭祀性拟人意象
  choice: 雅威所喜悦的馨香
  alternative: 蒙雅威悦纳的祭物
  rationale: 正文保留“香气”的原文意象，同时用“所喜悦的”表达祭物蒙神悦纳；不把该短语简化为抽象的“悦纳”，也不据此推演神具有人的感官限制。
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 采用接近学界通行重构读音 Yahweh 的中文音译，以显示原文使用的是专名，而非称号。
translation_notes:
  register: 采用现代、庄重而易懂的律法文体。“都要”表达规定性语气；“办理这些事”承接前文具体程序；“馨香”虽略具礼仪色彩，但在现代宗教语境中仍清楚，并能保留原文祭祀意象。
