  text: וְ/יַ֛יִן תַּקְרִ֥יב לַ/נֶּ֖סֶךְ חֲצִ֣י הַ/הִ֑ין אִשֵּׁ֥ה רֵֽיחַ נִיחֹ֖חַ לַ/יהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/010.yaml
  text: And you shall present wine for the drink offering[a], half a hin, an offering made by fire, a pleasing aroma to Yahweh.
translation:
  language: zh_hans
  text: 你也要献上半欣酒作奠祭，作为献给雅威的火祭[a]，是蒙他悦纳的馨香。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “火祭”或译“食物祭”，也可译作“经火献上的祭物”。
    reason: 原文אִשֵּׁה是祭司文献中的专门术语，其词源及在不同语境中的侧重点存在译法差异。
lexical_decisions:
- source_word: וְ/יַיִן
  choice: 也要献上……酒
  rationale: יַיִן意为“酒”；וְ在连续的祭例中承接上文，译作“也”比机械地译作“并且”更符合现代汉语。
- source_word: תַּקְרִיב
  choice: 献上
  rationale: קרב的使役式在献祭语境中指把祭物带近、呈献；“献上”自然保留其礼仪含义。
- source_word: לַ/נֶּסֶךְ
  choice: 作奠祭
  rationale: נֶסֶךְ指浇献的液体祭物；“奠祭”是准确且简洁的汉语祭祀用语。
- source_word: חֲצִי הַ/הִין
  choice: 半欣
  rationale: 保留古代容量单位“欣”，不以不确定的现代容量换算代替原文。
- source_word: אִשֵּׁה
  choice: 火祭
  rationale: 该词是祭司文献中的固定献祭术语，传统上与火中焚献相关；“火祭”简洁并保留原词的形式与祭祀色彩，同时以脚注注明可能的功能性译法。
- source_word: רֵיחַ נִיחֹחַ
  choice: 蒙他悦纳的馨香
  rationale: 这是固定的献祭表达，强调祭物在上帝面前蒙悦纳；此译自然庄重，也避免把意义缩减为单纯的嗅觉感受。
- source_word: לַ/יהוָה
  choice: 献给雅威
  rationale: 介词ל表示祭物的归向；“献给”在汉语中清楚表达这种方向。神名四字母按项目惯例音译为“雅威”。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: “雅威”较直接地呈现神名本身，而不以称号代替；不借此加入任何宗派性解释。
- issue: אִשֵּׁה的含义
  choice: 火祭
  alternative: 食物祭；经火献上的祭物
  rationale: 原词在祭司文献中可被理解为与火焚有关的祭物，也有人按其礼仪功能译为“食物祭”。正文采用较形式对应的“火祭”，脚注保留另一种可能，不消除原词的词义张力。
- issue: רֵיחַ נִיחֹחַ所表达的神学意涵
  choice: 蒙他悦纳的馨香
  alternative: 使雅威喜悦的香气
  rationale: 该固定语强调祭物蒙上帝接纳；补出“他”使现代汉语通顺，但不把措辞解释成上帝仅因气味而得到安抚。
translation_notes:
  register: 采用现代、庄重而易懂的祭祀用语。“半欣”保留古代计量单位；语序按现代汉语调整，同时维持原文中“奠祭—火祭—馨香”的修饰关系。
