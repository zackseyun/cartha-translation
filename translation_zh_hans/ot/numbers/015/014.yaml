  text: וְ/כִֽי יָגוּר֩ אִתְּ/כֶ֨ם גֵּ֜ר א֤וֹ אֲשֶֽׁר בְּ/תֽוֹכְ/כֶם֙ לְ/דֹרֹ֣תֵי/כֶ֔ם וְ/עָשָׂ֛ה אִשֵּׁ֥ה רֵֽיחַ נִיחֹ֖חַ לַ/יהוָ֑ה כַּ/אֲשֶׁ֥ר תַּעֲשׂ֖וּ כֵּ֥ן יַעֲשֶֽׂה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/014.yaml
  text: And if a sojourner is staying with you[a], or anyone who is among you throughout your generations, and he offers a food offering, a pleasing aroma to Yahweh, just as you do, so he shall do.
translation:
  language: zh_hans
  text: 若有寄居者与你们同住，或有人世世代代在你们中间；他若献给耶和华火祭[a]，作怡人的香气，就要照你们所行的这样行。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “火祭”或译“经火献上的祭物”，也可译“食物祭”。
    reason: 说明 אִשֵּׁה 的主要译法及其词义不确定性。
lexical_decisions:
- source_word: וְכִי
  choice: 如果
  rationale: 引出与上文相连的条件条例；现代汉语中无需机械译出连接词 ו。
- source_word: יָגוּר אִתְּכֶם גֵּר
  choice: 有寄居者与你们同住
  rationale: “寄居者”保留 גֵּר 所指居于以色列人中间的外来居民这一法律身份，“同住”表达 גור 与 אִתְּכֶם 的居留关系。
- source_word: אוֹ אֲשֶׁר בְּתוֹכְכֶם לְדֹרֹתֵיכֶם
  choice: 或世世代代有任何人在你们中间
  rationale: 保留原文较宽泛的关系结构及条例持续适用于历代的意思，不把“任何人”擅自限定为某一类人。
- source_word: וְעָשָׂה אִשֵּׁה
  choice: 献上……火祭
  rationale: עשה 在献祭语境中译为“献上”；אִשֵּׁה 与火中献呈有关，译作“火祭”，避免较有争议的“食物祭”解释。
- source_word: רֵיחַ נִיחֹחַ
  choice: 蒙悦纳的香气
  rationale: 既保留祭祀用语中的“香气”意象，也表达 ניחוח 所含令上帝喜悦、接纳的意义。
- source_word: לַיהוָה
  choice: 献给耶和华
  rationale: 采用“耶和华”音译神名，并按献祭语境自然表达祭物的指向。
- source_word: כַּאֲשֶׁר תַּעֲשׂוּ כֵּן יַעֲשֶׂה
  choice: 他怎样行，也要像你们一样行
  rationale: 保留比较性的法律公式和规范语气，强调此事上采用相同做法。
theological_decisions:
- issue: 非以色列人在献祭礼仪中的地位
  choice: 本节规定寄居者或在群体中的人按以色列人相同的方式献祭。
  alternative: 可将适用对象较窄地理解为已融入以色列盟约生活的常住外族人。
  rationale: 原文“像你们……他也要如此”明确强调本项礼仪程序的一致性，但没有在本节中说明更广泛的盟约身份，因此译文不作超出经文的推断。
- issue: אִשֵּׁה 的祭祀含义
  choice: 正文译为“火祭”。
  alternative: 也可译为“经火献上的祭物”或“食物祭”。
  rationale: 该词的词源和具体内涵存在讨论；“火祭”保留与火相关的核心意象，脚注列出其他可能译法，避免消除真实的词义张力。
translation_notes:
  register: 采用现代、庄重而易懂的法律与祭祀语体。“寄居者”“蒙悦纳的香气”等用语兼顾原文范畴和普通读者的可理解性。脚注标记置于整节末尾，所注术语在正文中明确出现。
