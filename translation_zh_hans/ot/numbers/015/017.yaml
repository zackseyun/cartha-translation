base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/017.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: zh_hans
  text: 耶和华对摩西说[a]：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文为“YHWH”（四字神名）；中文传统常译作“耶和华”。
    reason: 说明神名的原文形式及传统译法。
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: 说
  rationale: 该形式在叙事中引出新的发言事件；现代汉语的“说”自然准确，适合这一反复出现的神谕引介公式。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 这是四字神名；采用现代中文圣经传统中通行的专名形式“耶和华”，而不改作称号。
- source_word: אֶל מֹשֶׁה
  choice: 对摩西
  rationale: 介词 אֶל 标明说话所指向的对象；汉语以“对摩西”自然表达。
- source_word: לֵאמֹר
  choice: 说：
  rationale: 该不定式用于引出随后讲话的内容。汉语无需重复译成“说着说”，以“说：”并用冒号自然保留其篇章功能。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。正文采用中文读者最熟悉、作为专名使用的“耶和华”；脚注说明其希伯来文字母形式，以保留原文信息，同时不将其替换为“主”这一称号。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。“耶和华对摩西说”符合中文叙事习惯；以冒号承接下一节的直接话语。
