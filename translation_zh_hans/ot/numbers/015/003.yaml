id: NUM.15.3
reference: Numbers 15:3
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/עֲשִׂיתֶ֨ם אִשֶּׁ֤ה לַֽ/יהוָה֙ עֹלָ֣ה אוֹ זֶ֔בַח לְ/פַלֵּא נֶ֨דֶר֙ א֣וֹ בִ/נְדָבָ֔ה א֖וֹ בְּ/מֹעֲדֵי/כֶ֑ם לַ/עֲשׂ֞וֹת רֵ֤יחַ נִיחֹ֨חַ֙ לַֽ/יהוָ֔ה מִן הַ/בָּקָ֖ר א֥וֹ מִן הַ/צֹּֽאן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/003.yaml
  text: and you present an offering by fire to Yahweh—either a burnt offering or a sacrifice—to fulfill a vow[a], or as a freewill offering, or at your appointed times, to make a pleasing aroma to Yahweh, from the herd or from the flock[b],
translation:
  language: zh_hans
  text: 你们向雅威献上火祭[a]，无论是燔祭还是祭牲，为要还愿，或作甘心祭，或在你们指定的节期[b]献上，要使香气蒙雅威悦纳；祭牲取自牛群或羊群[c]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “火祭”也可译作“经火献上的祭物”。
    reason: lexical_alternative
  - marker: b
    text: “指定的节期”或译“指定的时间”；希伯来语既可泛指指定的时间，也可特指节庆场合。
    reason: lexical_alternative
  - marker: c
    text: “羊群”所译的希伯来语可统指绵羊、山羊等小牲畜。
    reason: lexical_clarification
lexical_decisions:
- source_word: וַעֲשִׂיתֶם אִשֶּׁה
  choice: 献火祭
  rationale: וַעֲשִׂיתֶם在献祭语境中指献上；אִשֶּׁה是经火献上的祭物。译作“献火祭”简洁自然，也保留专门的祭祀用语。
- source_word: לַיהוָה
  choice: 给雅威
  rationale: 直接音译神圣四字名יהוה，并以“给”表达祭物奉献的对象。
- source_word: עֹלָה
  choice: 燔祭
  rationale: 指祭物全部焚烧献上的祭，采用现代中文圣经读者熟悉且准确的术语。
- source_word: זֶבַח
  choice: 别的祭
  rationale: זֶבַח泛指宰杀牲畜所献的祭；在“无论……还是……”的并列中，以“别的祭”自然地与燔祭区分，同时避免擅自限定为平安祭。
- source_word: לְפַלֵּא נֶדֶר
  choice: 为要还愿
  rationale: 指履行所许的愿；“还愿”是现代中文清楚而凝练的表达。
- source_word: בִנְדָבָה
  choice: 作甘心祭
  rationale: 指不是因所许之愿或其他义务，而是自愿献上的祭物；保留其祭祀术语性质。
- source_word: בְּמֹעֲדֵיכֶם
  choice: 在你们规定的节期
  rationale: מוֹעֵד可泛指指定的时间，也可特指宗教节期；本处献祭语境适合译为“规定的节期”，并以脚注保留较宽泛的可能。
- source_word: לַעֲשׂוֹת רֵיחַ נִיחֹחַ
  choice: 使香气蒙雅威悦纳
  rationale: 保留祭祀语境中的香气意象，并自然表达נִיחֹחַ所含的悦纳之意，不把这一拟人化说法解释成更具体的神学机制。
- source_word: מִן הַבָּקָר אוֹ מִן הַצֹּאן
  choice: 从牛群或羊群中取牲畜
  rationale: הַבָּקָר指牛类大牲畜，הַצֹּאן统指绵羊和山羊等小牲畜。调整到句首，使中文句法清楚，同时保持其修饰献祭牲畜的关系。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用神圣四字名，音译为“雅威”能保留其作为立约之神专名的性质。
- issue: רֵיחַ נִיחֹחַ的祭祀拟人表达
  choice: 使香气蒙雅威悦纳
  alternative: 献上令雅威喜悦的香气；献上馨香之气给雅威
  rationale: 保留“香气”与神悦纳祭物之间的原文意象，不进一步规定悦纳的作用方式。
- issue: זֶבַח所指的祭类
  choice: 别的祭
  alternative: 祭；平安祭
  rationale: 该词本身是较宽泛的宰牲献祭用语。语境将它与燔祭并列，但不足以明确限定为某一种特定祭，因此不译成“平安祭”。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。因本节在希伯来文中接续下一节，句末保留逗号。将牲畜来源前置，以免中文误读，同时不改变原文信息关系。所有脚注标记均已置于正文相应位置。
