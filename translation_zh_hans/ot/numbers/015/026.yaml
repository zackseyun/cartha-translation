base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/026.yaml
  text: And all the congregation of the sons of Israel shall be forgiven[a], along with the sojourner who sojourns among them[c][b], because for all the people it was done unintentionally.
translation:
  language: zh_hans
  text: 以色列全会众[a]和寄居在他们中间的外族人[b]都必蒙赦免，因为全体百姓所犯的是无意之过[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“以色列人的整个群体”。希伯来语直译为“以色列子孙的全会众”。
    reason: lexical_alternative
  - marker: b
    text: “寄居的外族人”指住在以色列人中间、受群体法规约束并受其保护的非本族居民。
    reason: cultural_note
  - marker: c
    text: 希伯来语末句十分简略，字面可译为“因为全体百姓是在无意之中”，未明说具体所指的行为。
    reason: alternative_reading
lexical_decisions:
- source_word: וְנִסְלַח
  choice: 都必蒙赦免
  rationale: 该词为被动意义，指会众和寄居者获得赦免；“蒙赦免”自然保留被动语态，也符合庄重的法律—礼仪语境。
- source_word: לְכָל עֲדַת בְּנֵי יִשְׂרָאֵל
  choice: 以色列人全体会众
  rationale: עֵדָה 可指“会众、群体”；“全体会众”兼顾群体范围和本段正式语境。בְּנֵי יִשְׂרָאֵל 按现代汉语惯用表达译为“以色列人”，避免将希伯来语族群称谓机械译作“以色列的众子”。
- source_word: וְלַגֵּר הַגָּר בְּתוֹכָם
  choice: 和寄居在他们中间的外族人
  rationale: גֵּר 指住在以色列群体中、受其法规约束并受其保护的非本族居民。“寄居……的外族人”表达其居留身份，并以“寄居”对应名词与同根动词的重复。
- source_word: כִּי
  choice: 因为
  rationale: 在此引出上述赦免的原因，现代汉语用“因为”最清楚。
- source_word: לְכָל הָעָם בִּשְׁגָגָה
  choice: 全体百姓都是无意中犯的
  rationale: 希伯来语末句极简省略，强调所涉全体百姓的行为属于无意之过；结合上下文补出“犯”，使现代汉语完整，同时用脚注保留更贴近字面的译法。
theological_decisions:
- issue: 赦免的群体范围
  choice: 赦免包括以色列全体会众，也包括住在他们中间的外族人。
  alternative: 可将前半句较直译为“以色列众子全会众和寄居在他们中间的寄居者都必蒙赦免”。
  rationale: 原文明确把寄居者纳入共同体此次无意犯罪所得的赦免之中；译文不另加身份或教义条件。
- issue: 末句对无意犯罪的表述
  choice: 理解为全体百姓所犯的是无意之过。
  alternative: 可较直译为“因为对全体百姓而言，这是出于无意”。
  rationale: 原文没有明说谓语或具体行为，语法紧凑，既可强调事情是无意发生，也可说全体百姓陷于无意之错；正文依上下文作自然表达，脚注保留其简约与歧义。
translation_notes:
  register: 采用现代、庄重而易懂的法律—礼仪语体。“全体会众”“蒙赦免”保留经文的群体性和正式感；“寄居在……中间的外族人”避免现代汉语中“外侨”或“异邦人”可能带来的不必要色彩。
