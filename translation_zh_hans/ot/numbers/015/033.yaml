  text: And those who found him gathering wood brought him to Moses and Aaron and to all the congregation[a].
translation:
  language: zh_hans
  text: 那些发现他正在收集木柴的人，把他带到摩西、亚伦和全体会众面前[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “木柴”或译“树枝”。希伯来语עֵצִים既可泛指木料，也可指树枝、柴棍等一段段的木材。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְרִיבוּ אֹתוֹ
  choice: 把他带到
  rationale: 希伯来语קרב的使役式在此表示把人带到或领到某人面前；“把他带到”既符合语境，也比生硬的“使他靠近”更自然。
- source_word: הַמֹּצְאִים אֹתוֹ
  choice: 那些发现他……的人
  rationale: 带冠词的分词作名词使用，指发现这人的那些人；此译准确保留其关系结构。
- source_word: מְקֹשֵׁשׁ עֵצִים
  choice: 正在收集木柴
  rationale: 分词表示他被发现时正在进行的动作；עֵצִים既可泛指木料，也可指树枝、柴棍等木材。“木柴”贴合本段收集燃料的语境，同时以脚注保留词义范围。
- source_word: אֶל מֹשֶׁה וְאֶל אַהֲרֹן וְאֶל כָּל הָעֵדָה
  choice: 到摩西、亚伦和全体会众那里
  rationale: אֶל表示朝向或到某人那里；中文用并列结构自然表达原文重复介词所连接的三个对象。
- source_word: עֵדָה
  choice: 会众
  rationale: 在摩西五经的法律和叙事语境中，该词常指聚集的以色列共同体；“会众”简明而庄重。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“把他带到……那里”避免直译希伯来语使役结构造成的生硬；“全体会众”保留法律叙事中的公共审理背景。
