base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/035.yaml
  text: Then Yahweh said to Moses[a], “The man must surely be put to death[b]; the whole congregation shall stone him with stones outside the camp.”
translation:
  language: zh_hans
  text: 耶和华对摩西说：“这人必须被处死；全会众要在营外用石头打死他。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文读者熟悉的专名“耶和华”翻译四字神名，保留其作为上帝名字的性质，而不改作称号。
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: 该叙事动词承接上文；中文无需机械译出连接词，也能自然表达事件的推进。
- source_word: מוֹת יוּמַת
  choice: 必须处死
  rationale: 不定式绝对式与限定动词连用，强化处死的确定性和命令性；“必须处死”自然保留强调及被动含义。
- source_word: הָאִישׁ
  choice: 这人
  rationale: 定冠词所指是上文已经提到的那个人；中文用“这人”清楚承接其特指对象。
- source_word: רָגוֹם אֹתוֹ בָאֲבָנִים
  choice: 用石头打死他
  rationale: 原文以同根结构加强命令，并明确以石头执行；中文用“用石头打死”准确传达石刑及致死结果，避免生硬复现“用石头石打”。
- source_word: כָּל־הָעֵדָה
  choice: 全会众
  rationale: עֵדָה在此指以色列整体会众；“全会众”兼顾群体性、正式语境和中文圣经语体。
- source_word: מִחוּץ לַמַּחֲנֶה
  choice: 在营外
  rationale: 这是指明行刑地点的方位短语；“在营外”简洁自然。
theological_decisions:
- issue: 四字神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用上帝的专名。中文采用广为人知且尊严自然的“耶和华”，不以“主”等称号替代，也不改变经文的神学指称。
- issue: מוֹת יוּמַת的强调和法律效力
  choice: 必须处死
  alternative: 必被处死
  rationale: 原文结构既强化死亡判决，也使用使役被动形式。“必须处死”在现代中文中较清楚地表达不可免除的司法命令，同时不额外说明判决理由。
- issue: רָגוֹם...בָאֲבָנִים的表达
  choice: 用石头打死他
  alternative: 要用石头打他
  rationale: 上下文和原文的司法表达指向以石刑处决。“打死”明确保留致死含义；没有将其弱化为一般投石攻击。
translation_notes:
  register: 采用简洁、庄重而易懂的现代标准汉语。保留法律命令的强度和全体会众执行石刑的责任；不机械复制希伯来语同根强调结构，以免中文生硬。
