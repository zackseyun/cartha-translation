  text: וְ/אִם נֶ֥פֶשׁ אַחַ֖ת תֶּחֱטָ֣א בִ/שְׁגָגָ֑ה וְ/הִקְרִ֛יבָה עֵ֥ז בַּת שְׁנָתָ֖/הּ לְ/חַטָּֽאת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/027.yaml
  text: But if one person sins unintentionally[a], then she shall present a one-year-old female goat as a sin offering.
translation:
  language: zh_hans
  text: 但若有一个人无意中犯罪，就要献上一只一岁大的母山羊作赎罪祭[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“洁净祭”。希伯来语 חַטָּאת 可指处理罪或不洁的祭物，不仅指罪本身。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: 但若
  rationale: 承接前文并转入个人误犯的情形；“但若”自然表达轻微的转折和条件关系。
- source_word: נֶפֶשׁ אַחַת
  choice: 有一个人
  rationale: נֶפֶשׁ 在法律语境中指一个人，而非专指“灵魂”；“一个人”保留单数且符合现代汉语。
- source_word: תֶּחֱטָא בִשְׁגָגָה
  choice: 无意中犯罪
  rationale: בִשְׁגָגָה 指非故意、因疏忽而犯，与后文蓄意妄为形成法律上的区别。
- source_word: וְהִקְרִיבָה
  choice: 就要献上
  rationale: קרב 的使役式在献祭语境中指把祭牲带来献上；“就要”清楚表达条件成立后的规定。
- source_word: עֵז
  choice: 母山羊
  rationale: 该名词在此明确指雌性的山羊，译文保留祭牲的性别。
- source_word: בַּת שְׁנָתָהּ
  choice: 一岁大的
  rationale: 这一希伯来习语表示在第一年内或约一岁；“一岁大的”简洁自然。
- source_word: לְחַטָּאת
  choice: 作赎罪祭
  rationale: 在祭祀法规中 חַטָּאת 指处理罪与不洁的祭物；“赎罪祭”是中文圣经传统中清楚且通行的名称。
theological_decisions:
- issue: 犯罪者的语法性别
  choice: 译作不标明性别的“一个人”，后句省略主语
  alternative: 按希伯来语阴性单数形式明确译作“她”
  rationale: 阴性动词形式很可能是与阴性名词 נֶפֶשׁ 的语法一致，并不限定此律法只适用于女性。现代汉语无需通过代词标示语法性别，因此“不标明性别”既保留适用范围，也不抹去原文的单数。
- issue: חַטָּאת 在祭祀法规中的含义
  choice: 正文译作“赎罪祭”
  alternative: 洁净祭
  rationale: “赎罪祭”在现代中文读者中较为通行，也符合本节犯罪语境；但该词也可侧重祭物洁除罪污或不洁的礼仪功能，因此在脚注保留“洁净祭”这一译法。
translation_notes:
  register: 采用现代、庄重而易懂的法规体。“无意中”准确传达非蓄意犯罪；“献上”保留祭祀动作而不过度技术化。脚注标记已在正文中对应出现。
