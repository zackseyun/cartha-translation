id: NUM.15.30
reference: Numbers 15:30
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/הַ/נֶּ֜פֶשׁ אֲשֶֽׁר תַּעֲשֶׂ֣ה בְּ/יָ֣ד רָמָ֗ה מִן הָֽ/אֶזְרָח֙ וּ/מִן הַ/גֵּ֔ר אֶת יְהוָ֖ה ה֣וּא מְגַדֵּ֑ף וְ/נִכְרְתָ֛ה הַ/נֶּ֥פֶשׁ הַ/הִ֖וא מִ/קֶּ֥רֶב עַמָּֽ/הּ־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/030.yaml
  text: But the person who acts with a high hand[a], whether native-born or a sojourner, is reviling Yahweh, and that person shall be cut off from among his people.
translation:
  language: zh_hans
  text: 但那胆大妄为[a]的人，无论是本地出生的还是寄居者，就是在亵渎耶和华；那人必从自己的民中被剪除。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“用高举的手”；也可译作“擅敢行事”或“公然反抗”。
    reason: 保留希伯来语习语的字面意象，并说明其公开、傲慢和蓄意抗拒的含义。
lexical_decisions:
- source_word: הַנֶּפֶשׁ
  choice: 人
  rationale: נֶפֶשׁ在此法律语境中指完整的个人，而不是与身体相对的“灵魂”；译作“人”自然且准确。
- source_word: תַּעֲשֶׂה
  choice: 胆大妄为的人
  rationale: עשה本义宽泛，为“做、行”；本句的行为性质主要由בְּיָד רָמָה限定，因此合并译为“胆大妄为”，不擅自指定某一种罪行。
- source_word: בְּיָד רָמָה
  choice: 胆大妄为[a]
  rationale: 该习语直译为“高举着手”，表达公开、傲慢而蓄意的抗拒。“胆大妄为”是自然的现代汉语，同时用脚注保留原文意象及其他可能译法。
- source_word: הָאֶזְרָח
  choice: 本地出生的人
  rationale: 指本地、本族出生的成员；此译法清楚呈现其与寄居者的法律对举，又避免现代“公民”一词可能带来的制度含义。
- source_word: הַגֵּר
  choice: 寄居者
  rationale: 指居住在以色列群体中的非本地人；“寄居者”保留其居住及法律身份色彩，不笼统译成“外国人”。
- source_word: אֶת־יְהוָה הוּא מְגַדֵּף
  choice: 都是在亵渎耶和华
  rationale: גדף表示以言语或行为轻蔑、辱犯上帝；“亵渎”传达其严重性，而“都是在”体现הוּא的强调作用。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的专名“耶和华”呈现四字神名，并明确区别于一般称号“主”。
- source_word: וְנִכְרְתָה
  choice: 必……被剪除
  rationale: 保留כרת在盟约和法律语境中的固定而强烈的表达，不把它进一步解释为处死、驱逐或上帝直接施行的审判。
- source_word: מִקֶּרֶב עַמָּהּ
  choice: 从自己的民中
  rationale: 表达从所属群体中除去。希伯来语阴性后缀在语法上呼应נֶפֶשׁ，并非指女性；中文用无性别的“自己的”自然地保留泛指。
theological_decisions:
- issue: 罪行的性质
  choice: 译为“胆大妄为”，并以脚注保留“高举着手”的原文意象
  alternative: 擅敢行事；公然反抗；高举着手行事
  rationale: 原文描写公开、傲慢且蓄意的行为，但未在本节指定某一具体罪行。正文传达习语功能，脚注则避免抹去其形象及语义幅度。
- issue: “剪除”的具体方式
  choice: 保留“必从自己的民中被剪除”
  alternative: 处死；逐出群体；由上帝直接惩罚
  rationale: 本节没有明确说明“剪除”是司法处决、群体驱逐，还是神直接施行的审判，因此不在译文中替经文作出裁定。
- issue: גדף所表达的冒犯
  choice: 亵渎耶和华
  alternative: 辱骂耶和华；蔑视耶和华
  rationale: 该词可涉及言语或行为上的轻蔑冒犯。“亵渎”符合本句的神学和法律分量，同时不将行为收窄为仅仅口头辱骂。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“胆大妄为”便于普通读者理解，脚注保留原文的鲜明习语；“被剪除”刻意保持法律措辞的含混性，不预断惩罚的具体执行方式。
