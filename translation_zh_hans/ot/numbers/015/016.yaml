base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/016.yaml
  text: One law and one ordinance shall be for you and for the sojourner who sojourns with you[a].
translation:
  language: zh_hans
  text: 同一律法、同一典章，适用于你们和寄居在你们中间的寄居者[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “寄居者”也可译作“外来居民”。希伯来语 גֵּר 指住在以色列人中间、处于其群体秩序之下的非本地人。
    reason: 说明希伯来语 גֵּר 的社会与法律含义，并提供较自然、明确的现代汉语替代译法。
lexical_decisions:
- source_word: תּוֹרָה
  choice: 律法
  rationale: 本节处于法律语境，指具有约束力的规定；“律法”既符合上下文，也与 מִשְׁפָּט 有所区别。
- source_word: מִשְׁפָּט
  choice: 典章
  rationale: 此词指确立的法律裁定或规范。“典章”保留其法制意味，同时避免将其误解为一次具体的司法判决。
- source_word: אַחַת / אֶחָד
  choice: 同一
  rationale: 两个数词分别修饰“律法”和“典章”，强调双方适用的标准相同；现代汉语用“同一”比逐字译为“一”更自然，也保留了两次重复。
- source_word: יִהְיֶה לָכֶם וְלַגֵּר
  choice: 你们和……都适用
  rationale: 未完成式在这里表达规范效力；“都适用”以自然的现代法律用语传达“要为你们和寄居者而有”的规定性，而非单纯预测。
- source_word: גֵּר
  choice: 寄居者
  rationale: 指住在以色列人中间、受其群体秩序约束的非本地人。“寄居者”简洁地保留其居民与外来者的双重特征。
- source_word: הַגָּר
  choice: 寄居在
  rationale: 采用与“寄居者”同根的表达，重现希伯来文名词与分词的呼应。
- source_word: אִתְּכֶם
  choice: 在你们中间
  rationale: 字面可译“与你们一起”，但这里描述寄居者在群体中的居住关系；“在你们中间”更符合现代汉语表达。
theological_decisions:
- issue: 本地以色列人与寄居外来者在律法规定下是否采用相同标准
  choice: 译文明确表示双方适用同一律法和同一典章。
  alternative: 可将本节较窄地理解为只涉及紧邻上下文中的献祭规定。
  rationale: 原文措辞概括而有力，但仍处于特定法律段落中。译文保留其广泛表述，不擅自限定范围，也不将其扩展为超出经文的完整神学纲领。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。“都适用”清楚传达法律规范的效力；“同一……同一……”保留原文对单一、平等标准的重复强调。主句中的“寄居者／寄居在”有意保留希伯来语的词根呼应。
