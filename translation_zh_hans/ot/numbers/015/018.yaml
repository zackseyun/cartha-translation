  text: 你要向以色列人宣告，告诉他们：当你们进入我正领你们前往的那地时，
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דַּבֵּר
  choice: 说
  rationale: 此处是加强语态命令式，常用于引出上帝吩咐摩西传达的话；译作“说”直接、庄重，也符合现代汉语表达。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 字面为“以色列的众子”，在这一固定称谓中泛指以色列民；现代汉语译作“以色列人”自然准确，且避免被误解为仅指男性。
- source_word: וְאָמַרְתָּ אֲלֵהֶם
  choice: 告诉他们
  rationale: 与前面的“说”构成传话命令公式；译作“告诉他们”既保留重复强调，也避免汉语中“对……说，要对他们说”的生硬。
- source_word: בְּבֹאֲכֶם
  choice: 你们进入……时
  rationale: 介词 בְ 加不定式结构表达时间，“进入”在此准确呈现 בוא 与 אֶל 连用所表示的进入某地。
- source_word: אֶל הָאָרֶץ
  choice: 那地
  rationale: הָאָרֶץ 在语境中指特定的应许之地；“那地”自然承接后面的关系从句。
- source_word: אֲשֶׁר אֲנִי מֵבִיא אֶתְכֶם שָׁמָּה
  choice: 我正领你们前往的
  rationale: 分词 מֵבִיא 表达正在推进并指向未来的行动；“正领……前往”保留上帝亲自带领的动态含义，并自然吸收 שָׁמָּה“那里”的方向意义。
