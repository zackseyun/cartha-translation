base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/032.yaml
  text: While the sons of Israel were in the wilderness[a], they found a man gathering wood on the Sabbath day.
translation:
  language: zh_hans
  text: 以色列人在旷野的时候，他们发现一名男子在安息日捡柴[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“捡拾树枝”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: 在……的时候
  rationale: 这里的叙事形式用于交代背景；与后面的“在旷野”合译为时间背景句，符合现代汉语表达。
- source_word: בְנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 该短语在这里指以色列民众整体；“以色列人”自然、准确，也不误导读者以为只包括男性后裔。
- source_word: בַּמִּדְבָּר
  choice: 在旷野
  rationale: “旷野”符合 מִדְבָּר 在以色列漂流叙事中的地域含义，又避免将其限定为遍地沙土的沙漠。
- source_word: וַיִּמְצְאוּ
  choice: 发现
  rationale: 直接表达他们见到或遇见此人的叙事动作；现代汉语简洁自然。
- source_word: אִישׁ
  choice: 一个人
  rationale: 上下文中的 אִישׁ 指一名男子；汉语“一个人”在此自然，且并未改变其单数个体含义。
- source_word: מְקֹשֵׁשׁ עֵצִים
  choice: 捡柴
  rationale: קשש 与 עֵצִים 的组合表示收集可作柴用的木料；“捡柴”是自然、凝练的现代汉语。原词也可具体理解为收集树枝，故以脚注保留该词义可能性。
- source_word: בְּיוֹם הַשַּׁבָּת
  choice: 在安息日
  rationale: “安息日”本身即为日名，现代汉语无需再加“日子”，即可完整表达原文的时间指称。
theological_decisions:
- issue: 如何翻译盟约群体称谓 בְנֵי יִשְׂרָאֵל
  choice: 以色列人
  alternative: 以色列的子孙
  rationale: 此处是对全体以色列民众的常用集体称谓。“以色列人”忠实传达所指，并比直译形式更符合现代汉语，且不额外限定为男性。
- issue: 安息日用语
  choice: 在安息日
  alternative: 在安息日那天
  rationale: 原文只陈述事件发生的时间，并未在本节解释相关律法。“在安息日”保留这一时间指称，不加入神学评断。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“在旷野的时候”交代叙事背景；“捡柴”通俗清楚。脚注标记置于其所说明的“捡柴”之后，避免英文咨询层中标记位置与脚注内容不相符的问题。
