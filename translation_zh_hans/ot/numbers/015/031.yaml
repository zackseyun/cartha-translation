  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כִּ֤י דְבַר יְהוָה֙ בָּזָ֔ה וְ/אֶת מִצְוָת֖/וֹ הֵפַ֑ר הִכָּרֵ֧ת תִּכָּרֵ֛ת הַ/נֶּ֥פֶשׁ הַ/הִ֖וא עֲוֺנָ֥/ה בָֽ/הּ־־׀׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/031.yaml
  text: Because he has despised the word of Yahweh and has broken his commandment, that person shall surely be cut off; his guilt is on him.
translation:
  language: zh_hans
  text: 因为他藐视了雅威的话，违背了雅威的诫命，那人必被剪除[b]；他的罪责归在他身上。[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: “必被剪除”保留了希伯来文的惯用说法；本节没有说明这一判决具体以何种方式执行。
    reason: cultural_note
  - marker: c
    text: 或译：“他的罪孽在他身上。”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 在本节中引出前述判决的理由，明确表达因果关系。
- source_word: דְבַר יְהוָה
  choice: 雅威的话
  rationale: דָּבָר在此指雅威所说的命令或启示；直接保留圣约之名יהוה。
- source_word: בָּזָה
  choice: 藐视了
  rationale: 表达主动轻蔑、视为不足道，而不只是疏忽。
- source_word: מִצְוָתוֹ
  choice: 他的诫命
  rationale: 保留希伯来文单数，并体现圣约律法的分量。
- source_word: הֵפַר
  choice: 违背了
  rationale: 在诫命语境中自然表达破坏、违反之意，避免“废除”可能暗示有权取消命令。
- source_word: הִכָּרֵת תִּכָּרֵת
  choice: 必被剪除
  rationale: 不定式绝对形与限定动词连用构成强调；“必”传达确定性，“剪除”保留圣约司法惯用语而不限定执行方式。
- source_word: הַנֶּפֶשׁ הַהִוא
  choice: 那人
  rationale: נֶפֶשׁ在法律语境中指具体个人，译作“那人”自然且避免误解为非物质的灵魂。
- source_word: עֲוֺנָהּ בָּהּ
  choice: 他的罪责归在他身上
  rationale: 兼顾עָוֹן的罪孽与罪责含义，并保留责任落在犯罪者自身的司法意味。
theological_decisions:
- issue: 圣约之名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华／主
  rationale: 原文直接使用四字神名；音译“雅威”保留上帝在圣约中启示的专名。
- issue: “被剪除”的具体含义
  choice: 保留“必被剪除”，不指明其机制
  alternative: 处死／从会众中逐出
  rationale: 本节没有说明该判决究竟通过死亡、逐出群体或其他方式实现；保留原文惯用语，不替文本消解其含义上的张力。
- issue: עֲוֺנָהּ בָּהּ所表达的责任
  choice: 他的罪责归在他身上
  alternative: 他的罪孽在他身上
  rationale: 语句无明示系词，重点是犯罪者亲自承担罪责；译文不进一步断定这是未来刑罚还是持续状态。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“藐视”“诫命”“罪责”保留法律与圣约语域；句式简洁，并保留原文对“剪除”方式的未说明状态。未设置[a]脚注，因为正文“因为”已直接呈现כִּי在上下文中的因果功能，且“原来／因为”的差别在中文中无需另注。
