base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/001.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: zh_hans
  text: 雅威[a]对摩西说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文作“YHWH”（四字神名）；传统中文常译作“耶和华”。
    reason: 说明原文使用四字神名，并交代传统中文译名。
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: 说
  rationale: 该动词配合叙事性的连接形式，引出新的神谕段落。现代汉语用“说”最自然；无需机械重复为“讲话……说”。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 这是四字神名 YHWH。中文圣经传统普遍以“耶和华”作为专名形式，既有辨识度，也区别于称号“主”。
- source_word: אֶל־מֹשֶׁה
  choice: 对摩西
  rationale: 介词 אֶל 标明说话的对象；“对摩西”符合现代汉语表达。
- source_word: לֵאמֹר
  choice: 说
  rationale: 这是引出直接话语内容的固定公式。汉语将 וַיְדַבֵּר…לֵאמֹר 合并表达为“对摩西说”，自然且完整保留其功能。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威；上主
  rationale: 原文直接使用四字神名，而非“主”这一称号。正文采用中文读者熟悉的专名“耶和华”，脚注说明其希伯来文形式，以免掩盖原文用的是神名。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。原文“讲话……说”的套语在中文中整合为“对摩西说”，并以冒号表明下文是直接引语。
