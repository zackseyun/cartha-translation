  text: וְ/כִפֶּ֣ר הַ/כֹּהֵ֗ן עַל הַ/נֶּ֧פֶשׁ הַ/שֹּׁגֶ֛גֶת בְּ/חֶטְאָ֥ה בִ/שְׁגָגָ֖ה לִ/פְנֵ֣י יְהוָ֑ה לְ/כַפֵּ֥ר עָלָ֖י/ו וְ/נִסְלַ֥ח לֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/028.yaml
  text: And the priest shall make atonement before Yahweh for the person who sins unintentionally, when he sins unintentionally, to make atonement for him, and he shall be forgiven.
translation:
  language: zh_hans
  text: 祭司要为那误犯了罪的人——就是在雅威面前无意犯罪的人——赎罪，为他赎罪，他就必蒙赦免。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְכִפֶּר / לְכַפֵּר
  choice: 赎罪
  rationale: כפר 的加强词干在祭司礼仪语境中指施行赎罪。“赎罪”是现代中文圣经语体中清楚而庄重的对应词，也不限定具体的赎罪理论；两次出现均予保留。
- source_word: הַכֹּהֵן
  choice: 祭司
  rationale: 直接表达主持礼仪的人员，符合现代中文通行用语。
- source_word: עַל הַנֶּפֶשׁ
  choice: 为……的人
  rationale: נֶפֶשׁ 此处指一个人，而非与身体相对的“灵魂”；介词 עַל 在赎罪语境中自然译为“为”。
- source_word: הַשֹּׁגֶגֶת
  choice: 无意中犯错的人
  rationale: שׁגג 分词表示因疏忽或不知情而犯错，并非蓄意行为；译作动词性短语符合现代汉语。
- source_word: בְּחֶטְאָה בִשְׁגָגָה
  choice: 他无意中……犯罪
  rationale: 该短语说明此人所犯的是非故意之罪，并与前面的 שׁגג 同根词形成重复；译文保留“无意中”的复现，没有将双重表达合并。
- source_word: לִפְנֵי יְהוָה
  choice: 在雅威面前
  rationale: לִפְנֵי 表示“在……面前／在……临在中”；依原文邻接关系置于犯罪分句中，同时不排除整项礼仪是在雅威面前进行。
- source_word: וְנִסְלַח לוֹ
  choice: 他就必蒙赦免
  rationale: 被动形式表达赦免临到此人；“蒙赦免”自然保留被动含义，并以“就”体现礼仪之后的结果。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名。采用较贴近学界通常拟音的“雅威”，既保留专名性质，也不以称号替代神名。
- issue: 赎罪与赦免的关系
  choice: 保留“祭司为他赎罪，他就必蒙赦免”的先后与被动表达
  alternative: 明确说明赦免者或界定赎罪机制
  rationale: 原文陈述礼仪及其结果，却未在本句明说赦免的施行者，也未阐释赎罪机制；译文不额外补入某一神学体系。
- issue: לִפְנֵי יְהוָה 的修饰范围
  choice: 译入“犯罪”分句
  alternative: “祭司要在雅威面前……赎罪”
  rationale: 该短语紧接“不经意地犯罪”，最自然可修饰犯罪行为；但希伯来语语序容许较宽的关联，因此译文不增加排他性解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“无意中犯错／无意中……犯罪”保留希伯来文同根表达的重复；分号用于理清较长的祭司礼仪句。
