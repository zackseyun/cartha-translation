revisions:
- from: 祭司要为那无意中犯错的人赎罪；他无意中在雅威面前犯罪，祭司要为他赎罪，他就必蒙赦免。
  to: 祭司要为那误犯了罪的人——就是在雅威面前无意犯罪的人——赎罪，为他赎罪，他就必蒙赦免。
  rationale: 修订以“误犯了罪的人”对应“那误犯者”，并以“在雅威面前无意犯罪的人”对应后续“因无意犯罪”及“在雅威面前”的限定。破折号保留原文对非故意犯罪的重复说明；“赎罪”两次均予保留，末句继续以“蒙赦免”表达原文被动语态。
  reviewer_model: gpt-5.6-terra
