base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/020.yaml
  text: From the first of your dough you shall lift up a loaf as a contribution[a]; like the contribution of the threshing floor[b], so you shall lift it up.
translation:
  language: zh_hans
  text: 你们要从你们面团的初份中举起一个饼，作为奉献；要如同举起禾场的奉献一样举起它。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רֵאשִׁית
  choice: 初揉的
  rationale: 该词表示“开始、最初部分”。与面团连用时，译作“初揉的”自然表达从新制面团中取出一部分，同时避免误解为田间收获的初熟果实。
- source_word: עֲרִסֹתֵיכֶם
  choice: 你们的面团
  rationale: 此词可指揉好的面团，也可借指揉面盆；本节所取的是可做成饼的部分，因此正文按面团理解，并以脚注保留另一可能。
- source_word: חַלָּה
  choice: 一个饼
  rationale: 指由面团制成或成形的饼。“饼”符合古代食物语境，也不暗示现代甜点。
- source_word: תָּרִימוּ
  choice: 举起
  rationale: 使役形字面为“使升高、举起”，且与 תְרוּמָה 有词源联系；保留“举起”可呈现原文的重复与礼仪动作。
- source_word: תְרוּמָה
  choice: 奉献礼
  rationale: 指分别出来并呈献的份。“奉献礼”比单说“奉献”更能指具体献上的份，也避免采用生僻的传统术语。
- source_word: כִּתְרוּמַת גֹּרֶן
  choice: 禾场的奉献礼
  rationale: 贴近希伯来语所属结构，指从禾场出产中分别献上的那一份；中文语境下关系清楚。
- source_word: גֹּרֶן
  choice: 禾场
  rationale: 这是谷物脱粒和处理的场地，“禾场”是简洁而通行的圣经农业用语。
- source_word: כֵּן
  choice: 也要照样
  rationale: 明确标出前后礼仪做法的类比关系，符合现代汉语表达。
- source_word: אֹתָהּ
  choice: 把它
  rationale: 阴性代词可回指饼或奉献礼；用“它”保留原文指代上的宽度，不强行限定。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。保留“举起……奉献礼”的词源呼应和原文两次“举起”的重复；用“禾场”维持农业意象。
