base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/015.yaml
  text: For the assembly[a], there shall be one statute for you and for the sojourner who sojourns with you, a permanent statute throughout your generations. As you are[b], so shall the sojourner be before Yahweh.
translation:
  language: zh_hans
  text: 会众和住在你们中间的寄居者[a]同有一条律例；这是你们世世代代永久的律例[b]。在耶和华面前，你们怎样，寄居者也要怎样。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “寄居者”或译“外来居民”、“侨居者”。这里指住在以色列人中间的非本族人。
    reason: lexical_alternative
  - marker: b
    text: “永久的律例”或译“永远的律例”、“长久有效的律例”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַקָּהָל
  choice: 全会众
  rationale: קָהָל指聚集而成的共同体；“全会众”在现代汉语中自然庄重，也符合本段群体性、礼仪性法规的语境。
- source_word: חֻקָּה אַחַת
  choice: 同一条律例
  rationale: חֻקָּה是规定、律例；אַחַת强调双方适用同一规范。“同一条律例”明确传达法律上的一致性。
- source_word: לָכֶם וְלַגֵּר הַגָּר
  choice: 无论是你们，还是寄居在你们中间的寄居者
  rationale: גֵּר指住在以色列人中间、受当地法律安排约束的非本族居民；以“寄居者”保留其特定身份，并用“寄居在……中间”再现原文גור词根的重复。
- source_word: חֻקַּת עוֹלָם
  choice: 永久的律例
  rationale: 在法律套语中，עוֹלָם表示持续久远、历代有效；“永久”兼具现代性与法律语体，同时脚注保留“永远、长久有效”等可能表达。
- source_word: לְדֹרֹתֵיכֶם
  choice: 你们世世代代
  rationale: 该短语表示规定持续适用于以后各代；“世世代代”自然、庄重，并保持原文的代际延续意味。
- source_word: כָּכֶם כַּגֵּר יִהְיֶה
  choice: 你们怎样，寄居者也要怎样
  rationale: 保留כ...כ比较结构的对称和平等语气，不把其适用范围扩展到上下文法规之外。
- source_word: לִפְנֵי יְהוָה
  choice: 在耶和华面前
  rationale: לִפְנֵי意为“在……面前／临在中”；此译法保留盟约与敬拜语境。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代汉语圣经传统中通行的专名“耶和华”表达四字神名，而不以称号代替。
theological_decisions:
- issue: 寄居者在以色列敬拜法规中的地位
  choice: 译文表明，在本节所论法规上，本族会众与住在他们中间的寄居者适用同一条律例。
  alternative: 也可将这项平等规定严格限定为紧接上下文所说的献祭条例。
  rationale: 原文明言双方在耶和华面前遵守“同一条律例”，因此保留其平等性；同时不额外断言这一规定必然涵盖所有社会或法律领域。
translation_notes:
  register: 采用现代、庄重而易懂的法律—礼仪语体。“全会众”“律例”“在耶和华面前”保持经文的群体性和圣约语境；句式以“无论……还是……”及末句的对称结构突出双方同受一例。
