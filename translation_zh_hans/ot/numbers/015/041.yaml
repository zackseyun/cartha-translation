base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/041.yaml
  text: I am Yahweh your God[a], who brought you out of the land of Egypt to be your God. I am Yahweh your God.
translation:
  language: zh_hans
  text: 我是耶和华，你们的上帝；我把你们从埃及地领出来，要作你们的上帝。[a]我是耶和华，你们的上帝。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译：“要向你们作上帝。”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文读者熟悉的专名“耶和华”音译四字神名，避免用“主”这一称号替代原文中的名字。
- source_word: אֱלֹהֵיכֶם
  choice: 你们的上帝
  rationale: אֱלֹהִים 虽有复数词形，在此指以色列独一的上帝；第二人称复数后缀译作“你们的”。
- source_word: הוֹצֵאתִי
  choice: 我把……领出来
  rationale: יצא 的使役式表示“使出来、带出来”；“领出来”自然体现出埃及公式中的拯救行动。
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: 从埃及地
  rationale: 保留 אֶרֶץ“地、国土”的表达及出埃及盟约宣告的庄重节奏。
- source_word: לִהְיוֹת לָכֶם לֵאלֹהִים
  choice: 为要作你们的上帝
  rationale: לִהְיוֹת 表明目的或结果；中文“作你们的上帝”既自然，也保留盟约关系的含义。
- source_word: אֲנִי
  choice: 我是
  rationale: 希伯来语名词句在中文中自然补出系词“是”，并保留首尾两次宣告的强调。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用上帝的盟约之名。中文采用广为人知且具专名功能的“耶和华”，而不以“主”代替；“雅威”则更接近学界常见的拟音。
- issue: 盟约公式 לִהְיוֹת לָכֶם לֵאלֹהִים
  choice: 为要作你们的上帝
  alternative: 为要向你们作上帝
  rationale: 所选译文清楚表达领出埃及的目的及上帝与百姓之间的盟约关系；脚注保留希伯来语较直译的关系表达。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“我是……我把……”显明说话者与行动者同一；分号保留原文长句的宣告节奏。脚注标记置于所解释的盟约短语之后。
