source:
  edition: WLC
  text: וְ/כִ֣י תִשְׁגּ֔וּ וְ/לֹ֣א תַעֲשׂ֔וּ אֵ֥ת כָּל הַ/מִּצְוֺ֖ת הָ/אֵ֑לֶּה אֲשֶׁר דִּבֶּ֥ר יְהוָ֖ה אֶל מֹשֶֽׁה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/022.yaml
  text: But if you unintentionally go astray and do not do all these commandments that Yahweh has spoken to Moses,[a]
translation:
  language: zh_hans
  text: 但如果你们无意中偏离，没有遵行雅威对摩西所说的这一切诫命，[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“无意中犯错”或“无意中犯罪”。希伯来语动词可指走偏或犯错；在这里，是指无意中未能遵行诫命。
    reason: 词义存在可真实保留的不同表达；脚注说明其走偏意象及本段非故意过犯的法律语境。
lexical_decisions:
- source_word: וְכִי
  choice: 但如果
  rationale: 引出承接上文律例的条件情形；“但”体现轻微转折，“如果”明确条件关系。
- source_word: תִשְׁגּוּ
  choice: 你们无意中偏离
  rationale: שׁגה具有走偏、犯错的含义；本段祭司律法语境明确涉及非故意的过犯，因此译出“无意中”，同时保留“偏离”的意象。
- source_word: וְלֹא תַעֲשׂוּ
  choice: 没有遵行
  rationale: עשה基本义为“做”；与诫命搭配时，现代汉语用“遵行”自然明确，也表达因偏离而未实行诫命。
- source_word: אֵת כָּל הַמִּצְוֺת הָאֵלֶּה
  choice: 这一切诫命
  rationale: 保留כָּל的全部范围和הָאֵלֶּה的指示意义；“诫命”符合盟约律法语境。
- source_word: אֲשֶׁר דִּבֶּר יְהוָה אֶל מֹשֶׁה
  choice: 雅威对摩西所说的
  rationale: 按希伯来语关系从句修饰“诫命”，保留这些诫命源于雅威向摩西所说之话的表达。
- source_word: יְהוָה
  choice: 雅威
  rationale: 采用神圣四字名YHWH的现代汉语音译，而不以“主”这一称号替代。
- source_word: מֹשֶׁה
  choice: 摩西
  rationale: 采用现代汉语中通行的人名译法。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名；“雅威”较直接地音译YHWH，并避免以称号代替专名。
- issue: שׁגה在祭祀律法语境中的含义
  choice: 无意中偏离
  alternative: 犯错；无意中犯罪
  rationale: 上下文把非故意的失误与蓄意违抗区分开来。“无意中偏离”既保留动词的走偏意象，又不把此处静默限定成某一后来的神学术语。
translation_notes:
  register: 采用庄重、清楚的现代标准普通话。“没有遵行”比逐字的“没有做”更符合诫命语境；保留复数“你们”。句末逗号反映本节语法尚未完结，并承接下一节。
