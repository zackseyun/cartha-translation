  text: וְ/הָיָ֕ה בַּ/אֲכָלְ/כֶ֖ם מִ/לֶּ֣חֶם הָ/אָ֑רֶץ תָּרִ֥ימוּ תְרוּמָ֖ה לַ/יהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/019.yaml
  text: And when you eat from the bread of the land[a], you shall present a contribution to Yahweh.
translation:
  language: zh_hans
  text: 你们吃那地的粮食时，要向雅威献上一份举祭[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “举祭”直译为“举起之物”，指分别出来献给雅威的一份；也可译作“奉献物”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה בַּאֲכָלְכֶם
  choice: 你们……时
  rationale: היה与带ב的动词不定式共同引出将来的时间情形。汉语用“……时”自然表达其时间关系，不必生硬译出“事情将是”。
- source_word: מִלֶּחֶם הָאָרֶץ
  choice: 吃那地的粮食
  rationale: מן在“吃”之后可表示所吃之物或其中的一部分；“那地的粮食”既保留“地”的语境指向，也以现代汉语自然表达当地出产的食物。
- source_word: תָּרִימוּ תְרוּמָה
  choice: 献上一份举祭
  rationale: רום的使役式与תְּרוּמָה构成礼仪用语，字面带有“举起、提出”的意象。“举祭”保留这一专门含义，“献上一份”则使句子在现代汉语中清楚自然。
- source_word: לַיהוָה
  choice: 向雅威
  rationale: 介词ל在此表示献祭的对象，译作“向”；יהוה按其专名译作“雅威”。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名。正文采用较贴近YHWH常见学术重构读音的“雅威”，不以称号“主”替代专名。
- issue: תְּרוּמָה作为礼仪术语的表达
  choice: 举祭
  alternative: 奉献物
  rationale: “举祭”保留该词与“举起、提出”相关的祭礼色彩；脚注同时说明其含义，避免把具体礼仪术语泛化为一般奉献。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“那地”承接上下文所指将要进入之地；“一份”体现מן可能具有的部分含义，并符合תְּרוּמָה作为从整体中分别出来之物的语境。
