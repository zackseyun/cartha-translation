    issue: “用石头打他”不足以明确表达 רגם 的石刑含义。
    rationale: “打”在现代汉语可指非致命的击打；本处 רגם 连同“以石头”描述以石头执行的死刑。译为“用石头砸死他”更准确、自然。
  - severity: medium
    issue: “正如雅威吩咐摩西的”语法未完。
    rationale: 汉语中“正如……的”通常须以“那样”收束，或改写为完整的“正如……所吩咐的那样”。
