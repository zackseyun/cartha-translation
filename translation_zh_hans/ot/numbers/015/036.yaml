  to: 于是，全会众把他带到营外，用石头砸死他；他就死了，正如雅威所吩咐摩西的那样。
  rationale: 修订仅处理两项安全且必要的问题：以“砸死”明确原文 רגם 的石刑意义，并补足末句比较结构。保留原文“随后死亡”的叙事陈述，未增加对事件、法律或神学的解释。
