base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/036.yaml
  text: So the whole congregation brought him outside the camp and stoned him with stones, and he died, just as Yahweh had commanded Moses.
translation:
  language: zh_hans
  text: 于是，全会众把他带到营外，用石头砸死他；他就死了，正如雅威所吩咐摩西的那样。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כָּל הָעֵדָה
  choice: 全会众
  rationale: “会众”准确表达עֵדָה所指聚集的以色列群体，也保留其共同体和盟约语境；“全”对应כָּל。
- source_word: וַיֹּצִיאוּ אֹתוֹ
  choice: 把他带到
  rationale: יצא的使役形在此表示“带出去”；结合后面的目的地，译作“把他带到营外”符合现代汉语表达。
- source_word: אֶל מִחוּץ לַמַּחֲנֶה
  choice: 到营外
  rationale: 该短语表示朝营地以外移动；“到营外”清楚保留方向和地点。
- source_word: וַיִּרְגְּמוּ אֹתוֹ בָּאֲבָנִים
  choice: 用石头打他
  rationale: רגם指以石头击打，介词短语בָּאֲבָנִים明确说明所用之物；译文保留“石头”，又避免用“打死”预先吸收下一分句“他就死了”。
- source_word: וַיָּמֹת
  choice: 他就死了
  rationale: מות是普通的“死”字；如此直译保留希伯来文先描述击打、再陈述死亡结果的次序。
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: 正如雅威吩咐摩西的
  rationale: כַּאֲשֶׁר表示相符关系，译为“正如”；צִוָּה指此前的吩咐；יְהוָה按其专名译作“雅威”。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名。译作“雅威”以专名形式保留其身份，不以称号替代；同时避免“耶和华”所依据的后期混合读音。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“于是”承接上文命令与本节执行；保留“用石头打他，他就死了”的两个动作分句，以贴近原文叙事次序并避免增加解释。
