source:
  edition: WLC
  text: וְ/כִֽי תַעֲשֶׂ֥ה בֶן בָּקָ֖ר עֹלָ֣ה אוֹ זָ֑בַח לְ/פַלֵּא נֶ֥דֶר אֽוֹ שְׁלָמִ֖ים לַֽ/יהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/008.yaml
  text: And when you prepare a bull as a burnt offering or a sacrifice[a], to fulfill a vow or as peace offerings to Yahweh[b],
translation:
  language: zh_hans
  text: 你若献一头公牛作燔祭，或作祭物，为还所许的愿，或作平安祭献给雅威，
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/כִי
  choice: 你若
  rationale: 在延续性的祭祀条例中引出一种情形；“若”自然保留条件意味，而上下文仍显明这是程序性规定。
- source_word: תַעֲשֶׂה
  choice: 献
  rationale: 该动词本义宽泛，可指“做、预备”；在祭祀语境中译为“献”最符合现代汉语习惯，且下文明确说明祭物类别。
- source_word: בֶן בָּקָר
  choice: 一头公牛
  rationale: 这是指牛群中一头牛的习语；此处用“公牛”简洁自然，不额外断定其年龄。
- source_word: עֹלָה
  choice: 燔祭
  rationale: 采用现代中文圣经语境中通行且准确的祭祀术语，指全烧的祭。
- source_word: אוֹ זָבַח
  choice: 或作别的祭
  rationale: זבח是广义的祭牲或祭礼。因前面已列“燔祭”、后面又列“平安祭”，加“别的”可在汉语中清楚表达句法关系，又不把该词缩限为某一种祭。
- source_word: לְ/פַלֵּא נֶדֶר
  choice: 为还所许的愿
  rationale: 该希伯来语搭配指履行已经许下的愿；“还愿”是自然、准确的现代汉语宗教表达。
- source_word: אוֹ שְׁלָמִים
  choice: 或作平安祭
  rationale: “平安祭”是该祭类的通行名称，同时避免只突出团契或福祉中的单一含义。
- source_word: לַ/יהוָה
  choice: 献给雅威
  rationale: 介词在献祭语境中自然译为“献给”；יהוה按其专名译作“雅威”。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”较接近学界通常重建的读音，也明确保留其专名性质。
- issue: שְׁלָמִים 的祭祀类别名称
  choice: 平安祭
  alternative: 团契祭／福祉祭
  rationale: “平安祭”保留中文传统中稳定的祭祀类别名称，不把词义只限定为团契或福祉。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语，并与民数记祭祀条例的法律文体相协调。本节句末在原文中仍承接下一节，故保留逗号。
