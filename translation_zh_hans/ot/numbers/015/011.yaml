  yaml_path: translation/ot/numbers/015/011.yaml
  text: Thus it shall be done for the one bull[a], or for the one ram, or for the lamb among the sheep or among the goats.
translation:
  language: zh_hans
  text: 对于一头公牛、一只公绵羊，或绵羊或山羊中的一只[a]，都要照这样办理。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里译为“绵羊或山羊中的一只”的希伯来语 שֶׂה 可较广泛地指一只小型牲畜，并不一定专指羊羔；后面的词语说明其所属类别为绵羊或山羊。
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּכָה יֵעָשֶׂה
  choice: 都要这样办理
  rationale: 保留被动、非人称的法规语气；“办理”自然表达按前述条例预备祭物及附属供物，不额外限定具体动作。
- source_word: לַשּׁוֹר הָאֶחָד
  choice: 每一头公牛
  rationale: 定冠词与“一”在此强调规则适用于逐头祭牲；汉语用“每一头”比直译“那一头”更自然，也符合上下文的分配意义。
- source_word: לָאַיִל הָאֶחָד
  choice: 每一只公绵羊
  rationale: אַיִל指成年公绵羊；“每一只”传达重复出现的单数限定。
- source_word: לַשֶּׂה
  choice: 每一只羊
  rationale: שֶׂה可泛指绵羊或山羊中的一只小型牲畜；汉语“羊”可涵盖两类，并由下文进一步说明，脚注保留其词义范围。
- source_word: בַכְּבָשִׂים אוֹ בָעִזִּים
  choice: 无论是绵羊还是山羊
  rationale: 介词ב在此表示所属类别；此译清楚表达该牲畜可以属于绵羊类或山羊类。
- source_word: אוֹ ... אוֹ ... אוֹ ... אוֹ
  choice: 、……或……——无论……还是……
  rationale: 以自然汉语呈现供物类别之间的选择关系，同时保留绵羊与山羊两种可能。
