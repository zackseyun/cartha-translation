base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/038.yaml
  text: Speak to the sons of Israel and tell them to make tassels for themselves on the corners of their garments throughout their generations[b][a], and to put a cord of blue on the tassel of each corner.
translation:
  language: zh_hans
  text: 你要告诉以色列人，对他们说：他们世世代代要在衣服的角上做穗子[a]，并在每个衣角的穗子上系一根蓝线[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “穗子”也可译作“流苏”（希伯来文：צִיצִת）。
    reason: lexical_alternative
  - marker: b
    text: 这里译为“蓝”的希伯来词 תְּכֵלֶת，指以色列圣所用品所用的一种蓝色或蓝紫色染料或颜色。
    reason: cultural_note
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 字面为“以色列的众子”，在这里指以色列民整体；“以色列人”是现代汉语中自然、准确且不显生硬的集体称呼。
- source_word: וְעָשׂוּ לָהֶם
  choice: 他们……要……做
  rationale: 保留命令内容及“为自己制作、供自己佩用”的含义；汉语语境已经明确受益者，若直译“为自己做”会略显累赘。
- source_word: צִיצִת
  choice: 穗子
  rationale: 指附在衣角、由线构成并垂下的饰物；“穗子”比“边饰”更具体，也符合现代汉语习惯。
- source_word: עַל כַּנְפֵי בִגְדֵיהֶם
  choice: 在衣服的四角
  rationale: כָּנָף本义可指“翅膀”，用于衣物时指边缘或角；此处按服饰语境译为“四角”。
- source_word: לְדֹרֹתָם
  choice: 世世代代
  rationale: 表达这项规定在连续各代中持续适用，简洁自然。
- source_word: עַל צִיצִת הַכָּנָף
  choice: 在每角的穗子上
  rationale: 希伯来文使用单数定指结构，语境中具有逐一分配的含义；译作“每角”使现代读者清楚每个衣角都在所指范围内。
- source_word: פְּתִיל
  choice: 线
  rationale: 指捻成的线或细绳；与衣角穗子的语境相配，“线”在现代汉语中较自然。
- source_word: תְּכֵלֶת
  choice: 蓝色
  rationale: 指以色列圣物材料中常见的一种蓝色至蓝紫色染料或颜色；正文采用通行易懂的“蓝色”，具体色域留在脚注说明。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留“告诉……对他们说”的源文复述结构，也保留“世世代代”的持续性；用“四角”和“每角”清楚呈现衣物语境及单数结构的分配意义。
