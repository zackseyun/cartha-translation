translation:
  language: zh_hans
  text: 要随公牛献上素祭：用半欣的油调和的细面，十分之三伊法[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“三个十分之一”；在这里的献祭计量语境中，指十分之三伊法。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרִיב
  choice: 又要献上
  rationale: 使役式在献祭语境中表示把祭物带来献上；连词承接前文程序，用“又”自然表达附加步骤。
- source_word: עַל
  choice: 和……一同
  rationale: 此处表示素祭随公牛祭一同献上，并非空间意义的“在……上”。
- source_word: בֶּן הַבָּקָר
  choice: 公牛
  rationale: 字面为“牛群之子”，是指适合作祭牲的牛；结合上文和祭祀语境，译作“公牛”简洁明确。
- source_word: מִנְחָה
  choice: 素祭
  rationale: 在祭司法例中专指以谷物为主要祭物的祭，采用现代中文圣经语境中简明而通行的术语。
- source_word: סֹלֶת
  choice: 细面
  rationale: 指献祭所用的精细面粉；“细面”准确、简洁且符合中文祭祀法例的文体。
- source_word: שְׁלֹשָׁה עֶשְׂרֹנִים
  choice: 三伊法十分之一
  rationale: 原文直译为“三个十分之一”，祭物计量语境通常理解为三伊法十分之一；正文补明单位以便读者理解，同时以脚注说明原文的省略。
- source_word: בָּלוּל בַּשֶּׁמֶן
  choice: 用……油调和
  rationale: 被动分词与介词说明细面以油混合；“用油调和”是自然、庄重的现代中文。
- source_word: חֲצִי הַהִין
  choice: 半欣
  rationale: 保留古代液量单位“欣”，避免作不确定的现代容量换算。
