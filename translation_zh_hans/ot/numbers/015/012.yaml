  text: According to the number that you prepare[a], so you shall prepare for each one according to their number.
translation:
  language: zh_hans
  text: 照着你们所预备的数目，要为每一个按着它们的数目这样预备。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “预备”也可译作“做”或“制作”。希伯来语动词 עשה 通常有“做、制作”的意思；这里结合献祭的上下文译作“预备”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּמִּסְפָּר
  choice: 多少份
  rationale: כְּ 与 מִסְפָּר 合用表示按数目或数量；结合献祭规程，译作“多少份”自然表达所数祭牲对应的份数。
- source_word: אֲשֶׁר תַּעֲשׂוּ
  choice: 你们预备
  rationale: עשה 的基本义是“做、制作”，此处指按献祭条例备办祭物及其配套供物，故正文用“预备”，并在脚注保留较直译的可能。
- source_word: כָּכָה תַּעֲשׂוּ
  choice: 就要照样……预备
  rationale: כָּכָה 表示“这样、照样”；第二个未完成式在律例语境中带规定性，以“要”表达。
- source_word: לָאֶחָד
  choice: 为每一份
  rationale: 字面为“为一个”，在此按分配意义指每一只祭牲所对应的一份配套供物；“每一份”既保留逐一办理之意，也避免在正文中过度补明所指。
- source_word: כְמִסְפָּרָם
  choice: 按着它们的数目
  rationale: 保留介词 כְּ 的“按照”以及阳性复数后缀“它们”，与原文结尾的数量强调相呼应。
