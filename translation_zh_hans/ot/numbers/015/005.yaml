  text: And you shall prepare a quarter of a hin of wine for the drink offering, with the burnt offering or for the sacrifice, for each lamb.
translation:
  language: zh_hans
  text: 你要为每只羊羔预备四分之一欣的酒作奠祭，随同[a]燔祭或祭物而献[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或直译“在燔祭之上”。这里的希伯来语介词可能表示奠祭与燔祭相伴而献。
    reason: lexical_alternative
  - marker: b
    text: 直译“为那一只羊羔”；这里按条例中的逐只分配含义译为“为每只羊羔”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/יַיִן
  choice: 又要……酒
  rationale: וְ承接上文的献祭条例，译作“又要”；יַיִן是普通用语“酒”。
- source_word: לַ/נֶּסֶךְ
  choice: 作奠祭
  rationale: נֶסֶךְ在祭祀语境中指浇奠的酒祭；“奠祭”是简洁、庄重且通行的中文表达。
- source_word: רְבִיעִית הַ/הִין
  choice: 四分之一欣
  rationale: 保留古代容量单位“欣”，不作不确定的现代容量换算；“四分之一”准确表达原文数量。
- source_word: תַּעֲשֶׂה
  choice: 要预备
  rationale: עָשָׂה本义为“做、制作”，在献祭指令中可指备办或施行；“预备”与酒和奠祭搭配自然，又未过度解释为具体的浇奠动作。
- source_word: עַל הָ/עֹלָה
  choice: 随同燔祭
  rationale: עַל字面可译“在……之上”，但在此礼仪语境中很可能表示伴随关系；正文采用自然中文，并以脚注保留较直译的可能。
- source_word: א֣וֹ לַ/זָּבַח
  choice: 或为别的祭
  rationale: זֶבַח是与עֹלָה“燔祭”有别的一般祭物或祭礼用语。“别的祭”在中文中清楚呈现两者的对举，但不擅自指定某一种祭。
- source_word: לַ/כֶּבֶשׂ הָ/אֶחָד
  choice: 每只羊羔都要这样献
  rationale: 字面为“为那一只羊羔”；在条例语境中具有逐只分配的含义，译为“每只”可明确表示上述酒量适用于每一只羊羔。
