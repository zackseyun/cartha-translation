  rationale: 删除无原文根据的“别的”，将逐只分配关系置于句首并明确其修饰“预备”的酒量。“随同……而献”以自然现代汉语表达礼仪上的伴随关系；脚注保留עַל的较直译可能及“为那一只羊羔”的字面形式。
