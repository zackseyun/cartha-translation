  yaml_path: translation/ot/numbers/015/006.yaml
  text: Or for a ram you shall prepare a grain offering of fine flour[a], two-tenths, mixed with a third of a hin of oil.
translation:
  language: zh_hans
  text: 或是为一只公绵羊预备素祭，要用细面十分之二[a]，与三分之一欣的油调和。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译“两个十分之一”；按照献祭用量的计量体系，此处省略了较大的单位。参照其他经文的完整说法，即“伊法的十分之二”。
    reason: cultural_note
lexical_decisions:
- source_word: א֤וֹ
  choice: 或是
  rationale: 作为连接词，引出与前文并列的另一种献祭情形；不额外补入希伯来文未明说的条件词。
- source_word: לָ/אַ֨יִל֙
  choice: 为公绵羊
  rationale: אַיִל指公绵羊，前缀ל在此表示关联或用途；中文用“为公绵羊”自然承接献祭条例。
- source_word: תַּעֲשֶׂ֣ה
  choice: 预备
  rationale: עשה本义宽泛，可指做或制作；在祭物条例中译为“预备”准确而自然。
- source_word: מִנְחָ֔ה
  choice: 素祭
  rationale: 在祭司礼仪语境中指以谷物为主要祭料的祭；“素祭”是简明且通行的中文圣经术语。
- source_word: סֹ֖לֶת
  choice: 细面
  rationale: 指精细面粉；“细面”符合现代中文表达，也延续礼仪文本的庄重语体。
- source_word: שְׁנֵ֣י עֶשְׂרֹנִ֑ים
  choice: 十分之二
  rationale: 原文直译为“两个十分之一”，计量单位“伊法”在本节省略；正文保留这种简略表达，并以脚注说明。
- source_word: בְּלוּלָ֥ה בַ/שֶּׁ֖מֶן
  choice: 调上……油
  rationale: 被动分词与介词结构表示细面同油混合；中文礼仪说明用“调上……油”简洁自然。
- source_word: שְׁלִשִׁ֥ית הַ/הִֽין
  choice: 三分之一欣
  rationale: 保留古代容量单位“欣”，不作不确定的现代换算；分数关系按原文明确表达。
