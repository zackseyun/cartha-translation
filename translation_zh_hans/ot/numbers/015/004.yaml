  text: וְ/הִקְרִ֛יב הַ/מַּקְרִ֥יב קָרְבָּנ֖/וֹ לַֽ/יהוָ֑ה מִנְחָה֙ סֹ֣לֶת עִשָּׂר֔וֹן בָּל֕וּל בִּ/רְבִעִ֥ית הַ/הִ֖ין שָֽׁמֶן׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/004.yaml
  text: then the one who presents his offering to Yahweh shall present a grain offering of fine flour[a], a tenth of an ephah, mixed with a fourth of a hin of oil.
translation:
  language: zh_hans
  text: 那么，献祭物给雅威的人，要献上素祭：一伊法的十分之一细面[a]，用四分之一欣的油调和。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译“十分之一”；在这里的献祭语境中，指一伊法的十分之一。
    reason: 说明原文省略了正文为清楚起见补出的度量单位。
lexical_decisions:
- source_word: וְהִקְרִיב
  choice: 那么……要献上
  rationale: 该动词承接上一节的律例程序；“那么”体现连续步骤，“要献上”自然表达使役词干在献祭语境中的含义。
- source_word: הַמַּקְרִיב
  choice: 献……的人
  rationale: 保留分词所指的献祭者身份，同时避免使用生硬的专门称谓。
- source_word: קָרְבָּנוֹ
  choice: 供物
  rationale: קָרְבָּן泛指带到上帝面前的礼物或祭物；此处译作“供物”，既清楚，又避免与后面的特定素祭重复。
- source_word: לַיהוָה
  choice: 向雅威
  rationale: 介词ל表示供物献给谁；按专名处理四字神名，译作“雅威”。
- source_word: מִנְחָה
  choice: 素祭
  rationale: 该词在献祭律例中指以谷物为主要祭料的祭；“素祭”是简洁且通行的现代中文圣经术语。
- source_word: סֹלֶת
  choice: 细面
  rationale: 指精细研磨、品质上好的面粉；“细面”准确且符合献祭语境。
- source_word: עִשָּׂרוֹן
  choice: 十分之一伊法
  rationale: 原文直译为“十分之一”，在五经祭礼度量语境中指一伊法的十分之一；正文补明单位以便理解，并用脚注交代原文形式。
- source_word: בָּלוּל
  choice: 调上
  rationale: 被动分词表示细面与油混合；中文以“调上……油”自然表达这种制备方式。
- source_word: בִּרְבִעִית הַהִין
  choice: 一欣四分之一
  rationale: 保留古代容量单位“欣”，并准确表达四分之一的数量。
- source_word: שָׁמֶן
  choice: 油
  rationale: 原文仅说“油”；虽然语境中很可能是橄榄油，正文不额外限定。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；音译“雅威”保留其作为盟约专名的性质，不以称号替代。
translation_notes:
  register: 采用现代、庄重而易懂的律例文体。“素祭”“伊法”“欣”保留祭礼及古代度量用语；冒号表明后文是对素祭材料和分量的说明。
