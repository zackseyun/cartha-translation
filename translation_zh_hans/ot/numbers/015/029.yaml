  yaml_path: translation/ot/numbers/015/029.yaml
  text: The same law shall apply to the native-born Israelite and to the resident foreigner[a] living among you when either acts unintentionally.
translation:
  language: zh_hans
  text: 无论是以色列人中本地出生的人，还是寄居在你们中间的外族人[a]，若有人无意中犯错，都适用同一条律法。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “寄居在你们中间的外族人”指居住在以色列共同体中的非本族居民。
    reason: cultural_note
lexical_decisions:
- source_word: הָאֶזְרָח בִּבְנֵי יִשְׂרָאֵל
  choice: 以色列人中本地出生的
  rationale: הָאֶזְרָח 指本地出生、属于本地共同体的人；结合 בִּבְנֵי יִשְׂרָאֵל，译文明确其为以色列共同体中的本地人，同时避免生硬直译“以色列子孙中的本地人”。
- source_word: וְלַגֵּר הַגָּר בְּתוֹכָם
  choice: 寄居在你们中间的外族人
  rationale: גֵּר 在此法律语境中指居住于以色列共同体内的非本族居民，不是短暂停留的陌生人；“寄居……的外族人”兼顾其居留状态和非本地身份。原文“他们中间”在直接 خطاب语境中自然译作“你们中间”。
- source_word: תּוֹרָה אַחַת
  choice: 同一条律法
  rationale: 直陈两类人受同一法律规范约束，保留 אַחַת 所强调的一致适用性；“律法”也符合本段祭祀与法律语境。
- source_word: יִהְיֶה לָכֶם
  choice: 都适用
  rationale: 希伯来语字面为“要归你们有”，在法律语境中表达规范对相关人员的适用；译作“适用”自然清楚。
- source_word: לָעֹשֶׂה בִּשְׁגָגָה
  choice: 凡无意中行错事的
  rationale: לָעֹשֶׂה 是泛指单数“行事的人”，可涵盖前述任一群体；בִּשְׁגָגָה 表示因疏忽、误失而非故意。“行错事”根据上下文补明行为的过失性质，但不将其限缩为某一种具体罪行。
theological_decisions:
- issue: 本地以色列人与寄居外族人在无意过犯条例下的法律地位
  choice: 译文表明，前述两类人凡无意中行错事，都适用同一条律法。
  alternative: 可较形式地译为“你们只有一条律法，给那误行的人”。
  rationale: 原文强调 תּוֹרָה אַחַת，即同一法律规定适用于两类居民。译文只陈述本节直接法律语境中的平等适用，不扩展为对所有法律或一切社会地位的全面神学命题。
translation_notes:
  register: 采用现代、庄重而易懂的法律叙述。“无论……还是……凡……都……”使希伯来语的泛指单数自然涵盖前述两类人；正文保留脚注标记[a]。
