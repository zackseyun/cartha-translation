base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/021.yaml
  text: From the first of your dough you shall give to Yahweh a contribution throughout your generations[a][b].
translation:
  language: zh_hans
  text: 你们要从面团中取出第一份[a]，献给雅威作献礼[b]；你们世世代代都要这样做。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “面团”一词也可指“揉面盆”；原文可因关联而用器皿代指其中的面团。
    reason: lexical_alternative
  - marker: b
    text: “献礼”也可译作“供物”或传统的“举祭”。
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵרֵאשִׁית
  choice: 最初的一份
  rationale: רֵאשִׁית在这里指从整体中取出的第一份，而不是抽象的时间起点；译作“最初的一份”保留其部分义。
- source_word: עֲרִסֹתֵיכֶם
  choice: 你们的面团
  rationale: עֲרִסָה既可指面团，也可借关联指揉面盆。这里所献的是从其中取出的一份，因此正文采用更符合礼仪动作的“面团”，并以脚注保留另一可能。
- source_word: תִּתְּנוּ
  choice: 献给
  rationale: נתן本义是“给”。因受词是献礼，汉语用“献给”既自然，也保留把一份交给雅威的直接命令语气。
- source_word: לַיהוָה
  choice: 给雅威
  rationale: 将四字神名יְהוָה音译为“雅威”，明确保留经文中的盟约之名。
- source_word: תְּרוּמָה
  choice: 献礼
  rationale: תְּרוּמָה指分别出来、献上的一份。“献礼”是现代汉语中清楚而庄重的表达，又避免把具体举献动作强加于词义；传统译法见脚注。
- source_word: לְדֹרֹתֵיכֶם
  choice: 你们世世代代都要这样做
  rationale: 该短语表示此命令在连续各代中持续有效。此译法比直译“贯穿你们的世代”更符合现代汉语，同时保留长久义务。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名。音译“雅威”保留其作为盟约之名的性质，不以称号替代。
- issue: תְּרוּמָה是否指特定的举献动作
  choice: 正文译作“献礼”
  alternative: 举祭；举献；供物
  rationale: 此词可指从整体中分别出来献上的礼物，但未必在每处都强调举起这一动作。正文不将礼仪动作过度具体化，脚注则保留传统术语。
translation_notes:
  register: 采用现代、庄重而易懂的命令句。把希伯来语中较紧凑的持续世代公式展开为“世世代代都要这样做”，并保留“面团”和礼仪术语的词义歧义于脚注。
