base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/002.yaml
  text: Speak to the sons of Israel and say to them[a], ‘When you come into the land of your dwellings[b], which I am giving to you,’
translation:
  language: zh_hans
  text: “你要对以色列人[a]说：‘你们进入你们居住之地[b]，就是我赐给你们的那地时，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “以色列人”原文直译为“以色列的众子”，也可译作“以色列子民”。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“你们居所之地”或“你们住处之地”；也可译作“你们定居之地”或“你们的聚居地”。
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר אֶל־בְּנֵי יִשְׂרָאֵל
  choice: 你要告诉以色列人
  rationale: דַּבֵּר是用于传达神谕的加强词干命令式；现代汉语用“你要告诉”自然而庄重。בְּנֵי יִשְׂרָאֵל字面为“以色列的众子”，在这里指以色列共同体，译作“以色列人”可避免现代汉语误解为仅限男性后裔；字面形式列于脚注。
- source_word: וְאָמַרְתָּ אֲלֵהֶם
  choice: 对他们说
  rationale: 保留希伯来语常见的重复传令公式，同时使汉语句式流畅。
- source_word: כִּי תָבֹאוּ
  choice: 你们进入……时
  rationale: כִּי在此引出预期将发生的适用情境，而非原因；בוא结合אֶל自然译为“进入”。
- source_word: אֶרֶץ מוֹשְׁבֹתֵיכֶם
  choice: 让你们居住的那地
  rationale: מוֹשְׁבֹתֵיכֶם可指居所、定居之处。此处采用关系结构表达“你们居住之地”，既自然，也不把词义过度限定为具体的“定居点”。
- source_word: אֲשֶׁר אֲנִי נֹתֵן לָכֶם
  choice: 我赐给你们
  rationale: נֹתֵן为分词，表达正在实施或确定的赐予。汉语一般现在式“赐给”能体现神所作的确定赐予，不必强加单纯将来时。
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל的群体指称
  choice: 以色列人
  alternative: 以色列的众子／以色列子民
  rationale: 原文形式为阳性复数亲属称谓，但在律法宣告中指整个盟约群体。正文采用现代汉语通行群体称谓，脚注保留其字面形式，既不误限于男性，也不隐去原文表达。
- issue: נֹתֵן所表达的赐地时态与体貌
  choice: 我赐给你们
  alternative: 我将要赐给你们／我正在赐给你们
  rationale: 保留分词所体现的进行性或确定性，不将其窄化为纯粹未来，也避免汉语“正在”造成行动已处于可观察过程中的过强印象。
translation_notes:
  register: 采用现代、庄重而易懂的律法宣告语体。“你要……对他们说”保留原文传令公式；引文在本节末未闭合，因为句法和所引神谕延续至下一节。
