  text: וְ/הָיָ֣ה לָ/כֶם֮ לְ/צִיצִת֒ וּ/רְאִיתֶ֣ם אֹת֗/וֹ וּ/זְכַרְתֶּם֙ אֶת כָּל מִצְוֺ֣ת יְהוָ֔ה וַ/עֲשִׂיתֶ֖ם אֹתָ֑/ם וְ/לֹֽא תָתֻ֜רוּ אַחֲרֵ֤י לְבַבְ/כֶם֙ וְ/אַחֲרֵ֣י עֵֽינֵי/כֶ֔ם אֲשֶׁר אַתֶּ֥ם זֹנִ֖ים אַחֲרֵי/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/039.yaml
  text: And it shall be a tassel for you[a], and when you see it, you shall remember all the commandments of Yahweh and do them, and you shall not go about after your own heart and after your own eyes[c][b], after which you are whoring.
translation:
  language: zh_hans
  text: 这要作你们的衣穗[a]；你们看见它，就要记念耶和华的一切诫命，并且遵行；不可随从自己的心和自己的眼目[b]，你们正是随从这些而行淫[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “衣穗”也可译作“穗子”或“流苏”，指缀在衣服上的穗饰。原文直译为“这要作你们的穗子”。
    reason: lexical_alternative
  - marker: b
    text: “随从”也可译作“追随”或“追逐”。原文动词含有探寻、追逐的意味。
    reason: lexical_alternative
  - marker: c
    text: “这些”回指“自己的心和自己的眼目”。原文用“行淫”的性不忠意象，比喻对盟约的不忠；也可较弱地译作“偏离正道”，但会减弱原文的修辞力度。
    reason: metaphor_and_ambiguity
lexical_decisions:
- source_word: צִיצִת
  choice: 穗子
  rationale: 本词在上下文中指缀在衣角、形似流苏的穗饰。“穗子”是现代中文圣经语境中自然且明确的表达；脚注补充“衣穗”这一译法。
- source_word: וְהָיָה לָכֶם לְצִיצִת
  choice: 这穗子要给你们作记号
  rationale: 希伯来文直译近于“它要给你们作穗子”。结合本节所述观看、记念的功能，中文补出“记号”使句意自然；“这穗子”承接上一节的单数所指。
- source_word: וּרְאִיתֶם אֹתוֹ
  choice: 你们看见它
  rationale: 保留连贯的动作次序；在中文中与后面的“就要”搭配，自然表达“看见时便记起”的含义。
- source_word: מִצְוֺת
  choice: 诫命
  rationale: 保留该词在盟约与律法语境中的规范性分量。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代简体中文读者最熟悉的专名形式来明确呈现四字神名，而不以称号代替。
- source_word: וַעֲשִׂיתֶם אֹתָם
  choice: 并且遵行
  rationale: עשה与“诫命”搭配时意为实行、遵守；“遵行”比逐字的“做它们”更符合现代中文，同时未增加额外含义。
- source_word: תָתֻרוּ
  choice: 随从
  rationale: תור在这里有探寻、追逐或跟随之意。“随从”能自然连接“心”和“眼目”，并由脚注保留“追逐、寻求”的动态色彩。
- source_word: לְבַבְכֶם
  choice: 自己的心
  rationale: “心”在希伯来语人观中涵盖欲望、意念与意志；加入“自己的”显出它与耶和华诫命之间的对照。
- source_word: עֵינֵיכֶם
  choice: 自己的眼目
  rationale: 基本保持原文意象；“眼目”庄重而通俗，并与“自己的心”形成平行。
- source_word: זֹנִים
  choice: 行淫
  rationale: 保留זנה强烈的性不忠隐喻，不将其弱化为一般的“偏离”或“迷失”。在本语境中，它表达对盟约的不忠。
- source_word: אֲשֶׁר אַתֶּם זֹנִים אַחֲרֵיהֶם
  choice: 因你们正随从它们行淫
  rationale: 关系代词的先行词是“心”和“眼目”。“随从它们行淫”保留אַחֲרֵי的追随结构和持续分词的力度；“因”在中文中自然说明禁令的缘由，但不消除原文关系结构可能带来的语义张力。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。中文正文采用广为人知的“耶和华”，明确保留专名而非用“主”替代；“雅威”是较接近学界重构发音的另一译法。
- issue: זנה在盟约不忠语境中的隐喻强度
  choice: 保留“行淫”的性不忠意象
  alternative: 偏离；不忠
  rationale: 原文故意使用强烈的性不忠隐喻。保留这一意象能够呈现以色列随从内心与眼目之欲即背弃盟约的严厉警告，而不把它淡化为一般性的走错路。
- issue: “心”和“眼目”与行淫隐喻的关系
  choice: 让“它们”回指心和眼目
  alternative: 概括译为“你们借此偏离”
  rationale: 原文复数后缀明确回指前面的“心”和“眼目”。正文保留这种不寻常而有力的表达，不擅自把对象改成别神或具体欲望。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“诫命、遵行、眼目、行淫”保留经文的盟约语域与修辞力度；句法适度汉语化，但保留原文中“随从心和眼目”及其与“行淫”相连的张力。
