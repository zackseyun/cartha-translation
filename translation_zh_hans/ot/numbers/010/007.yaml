base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/007.yaml
  text: But when assembling the congregation[a], you shall blow, and you shall not sound an alarm.
translation:
  language: zh_hans
  text: 召集会众时，你们要吹号，却不要吹出警报声。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“却不要吹出起行的号声。”希伯来文在这里把一般的吹号与上文用于起行的特殊警报信号区别开来。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְ/הַקְהִיל
  choice: 召集……时
  rationale: 介词 בְּ 加使役式不定词在这里表达时间，即“在使……聚集时”。结合上文，译作“召集……时”自然、明确。
- source_word: הַקָּהָל
  choice: 会众
  rationale: קָהָל 指聚集起来的以色列群体；“会众”符合本段公共、礼仪性的语境，也与“召集”这一动作有所区别。
- source_word: תִּתְקְעוּ
  choice: 要吹号
  rationale: תקע 在本段指吹银号。希伯来文本节没有重述“号”，但中文若只说“要吹”语意不完整，因此根据直接上下文补出“号”。
- source_word: וְ/לֹא
  choice: 却不要
  rationale: 连接词与否定词构成对比：号要吹，但不可采用起行时的特殊警报吹法。“却不要”能清楚传达这一对照。
- source_word: תָרִיעוּ
  choice: 吹出警报声
  rationale: רוע 的使役式在号声语境中指发出一种特殊的警报信号，而非一般的吹号；此译保留它与 תִּתְקְעוּ 的技术性区别。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的指令语体。“吹号”按中文表达需要补足上下文中明确的宾语；“警报声”保留两种吹法之间的对比。脚注标记置于其所说明的短语之后。
