base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/020.yaml
  text: And over the company of the tribe of the sons of Gad was Eliasaph son of Deuel[a].
translation:
  language: zh_hans
  text: 统领迦得支派队伍的是丢珥的儿子以利雅萨[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “队伍”或译“军旅”“编队”。希伯来语 צְבָא 常带军事意味，这里指按秩序行进的支派队伍。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/עַל
  choice: 统领……的是
  rationale: 在这一反复出现的行军首领名录格式中，עַל 表示某人被立在一支队伍之上负责统领；中文用“统领……的是”自然表达其管辖关系。句首 וְ 承接上文，但现代中文逐项列举时不必机械译作“并且”。
- source_word: צְבָא
  choice: 队伍
  rationale: 该词常带军事色彩，可指军队、军旅或编队；本处特指以色列按秩序行进的支派编队。“队伍”既符合行军语境，也避免把含义限定为纯粹的作战军队。
- source_word: מַטֵּה בְנֵי גָד
  choice: 迦得支派
  rationale: 原文直译为“迦得子孙的支派”。现代汉语以“迦得支派”简洁、自然地表达同一族群单位，不造成成员仅限男性的误解。
- source_word: אֶלְיָסָף
  choice: 以利雅萨
  rationale: 采用现代中文圣经中通行的人名音译。
- source_word: בֶּן דְּעוּאֵל
  choice: 丢珥的儿子
  rationale: 直接保留希伯来文父子谱系格式；“丢珥”采用通行音译。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。通过“统领……的是”保留首领与支派行军队伍之间的关系，并用脚注呈现 צְבָא 的军事语义范围。
