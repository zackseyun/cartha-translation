  text: And over the company of the tribe of the sons of Manasseh was Gamaliel son of Pedahzur[a].
translation:
  language: zh_hans
  text: 玛拿西子孙支派的队伍[a]由比大蓿的儿子迦玛列统领。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “队伍”所译的希伯来词也可译作“军旅”“军队”或“编队”；这里指按支派组织起来的行军队伍。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל
  choice: 统领……的是
  rationale: 在反复出现的行军次序公式中，עַל 表示某人被立在一个支派队伍之上、负责统领；这样译成现代汉语自然，也保留其领导关系。
- source_word: צְבָא
  choice: 队伍
  rationale: 此处指旷野行军编制中的支派队伍，并不必然专指投入战斗的军队；“队伍”贴合上下文，也便于普通读者理解。
- source_word: מַטֵּה
  choice: 支派
  rationale: 这里表示以玛拿西为名的以色列支派，而非本义的杖或枝条。
- source_word: בְּנֵי מְנַשֶּׁה
  choice: 玛拿西子孙
  rationale: 保留希伯来语“玛拿西之子”的宗族血脉表达，同时采用中文圣经叙事中自然、明确的“子孙”。
- source_word: גַּמְלִיאֵל
  choice: 迦玛列
  rationale: 按中文圣经中通行的人名音译处理。
- source_word: בֶּן
  choice: ……的儿子
  rationale: 准确表达直接的父子谱系关系，符合现代汉语习惯。
- source_word: פְּדָה צוּר
  choice: 比大蓿
  rationale: 该希伯来人名虽在书写上呈现两个成分，实为一个专名；采用中文圣经中通行的音译。
