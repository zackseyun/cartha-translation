  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/001.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: zh_hans
  text: 雅威[a]对摩西说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文为 YHWH（四字神名），通常音译为“雅威”；传统上也译作“耶和华”。
    reason: 说明神名的原文形式及另一通行译法。
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: 说
  rationale: 该动词在这里引出新的叙事事件和神的直接言语；现代汉语用“说”自然、准确。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文四字神名 YHWH 作音译，保留其作为以色列之神专名的性质，而不以头衔替代。
- source_word: אֶל
  choice: 对
  rationale: 介词标明讲话的对象；“对摩西说”是现代汉语最自然的表达。
- source_word: מֹשֶׁה
  choice: 摩西
  rationale: 采用该人名在现代汉语圣经传统中的通行译名。
- source_word: לֵאמֹר
  choice: 说：
  rationale: 该不定式用于引出随后直接引语。汉语将 וַיְדַבֵּר 与 לֵאמֹר 合并为“说：”，既保留其话语引介功能，又避免生硬重复为“讲话说”。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；正文采用较接近学界通行复原读音 Yahweh 的汉语音译“雅威”，脚注说明传统译法“耶和华”，不把专名改成“主”等称号。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。为符合汉语话语引介习惯，将希伯来语“讲话……说”的公式整合为“对摩西说：”；冒号表明下文接续直接引语。
