  text: And over the company of the tribe of the sons of Issachar was Nethanel the son of Zuar[a].
translation:
  language: zh_hans
  text: 以萨迦子孙支派的队伍[a]由苏押的儿子拿坦业统领。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “队伍”或译“军队”或“编队”；希伯来语 צְבָא 在这里指按行军次序组织起来的支派群体。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל
  choice: ……的统领是
  rationale: 该结构承接上文的行军编队名单；中文用“……的统领是”自然表达 עַל 在此处“在……之上、负责带领”的含义。
- source_word: צְבָא
  choice: 队伍
  rationale: 此处指按行军次序编组的支派群体。“队伍”既体现有组织的行进单位，又避免将语义过度限定为作战军队。
- source_word: מַטֵּה
  choice: 支派
  rationale: 在此人口统计和营地编组语境中，该词明确指以色列的支派，而非字面的杖。
- source_word: בְּנֵי יִשָׂשכָר
  choice: 以萨迦子孙
  rationale: 保留“以萨迦之子”的谱系表达，同时采用现代中文圣经语境中自然、庄重的集体称谓。
- source_word: נְתַנְאֵל
  choice: 拿坦业
  rationale: 采用现代简体中文圣经中通行的人名译法。
- source_word: בֶּן צוּעָר
  choice: 苏押的儿子
  rationale: 准确表达希伯来语父子关系，并按自然中文语序置于人名前。
