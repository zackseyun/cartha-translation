  text: וְ/הָיָ֖ה כִּי תֵלֵ֣ךְ עִמָּ֑/נוּ וְ/הָיָ֣ה הַ/טּ֣וֹב הַ/ה֗וּא אֲשֶׁ֨ר יֵיטִ֧יב יְהוָ֛ה עִמָּ֖/נוּ וְ/הֵטַ֥בְנוּ לָֽ/ךְ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/032.yaml
  text: And if you go with us[a], then whatever good Yahweh does for us, we will do good to you.
translation:
  language: zh_hans
  text: 你若和我们同去，雅威赐给我们什么福分，我们也必善待你。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 较直译：“雅威向我们所施的那福，我们也必向你施福。”原文以“福／施福”呼应；末句也可表达为“我们也必向你行善”。
    reason: 保留原文中“福”与两处“施福／行善”之间的词根呼应，并说明正文“善待你”未限定具体受益方式。
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: 你若……那么
  rationale: 这一结构引出条件及其结果；用“若……那么”既保留条件意味，也符合现代汉语表达。
- source_word: תֵלֵךְ עִמָּנוּ
  choice: 和我们同去
  rationale: הלך与עִם连用，在本段旅程语境中指随同以色列人前行；“同去”简洁自然。
- source_word: הַטּוֹב הַהוּא אֲשֶׁר יֵיטִיב יְהוָה עִמָּנוּ
  choice: 雅威赐给我们的福
  rationale: 原文以“美好、福惠”及“施福、善待”同根呼应；汉语用“赐给我们的福”自然地表达雅威使他们得益的意思。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语音译呈现四字神名，区别于作为称号的“主”。
- source_word: וְהֵטַבְנוּ לָךְ
  choice: 我们也必让你同享
  rationale: 原意是以色列也要善待对方、使他得着雅威赐下的福。“让你同享”在语境中清楚表达这种共享福惠的承诺；脚注保留更贴近字面的表达。
theological_decisions:
- issue: 四字神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文使用神的专名而非普通称号，因此正文采用音译“雅威”，不以“上主”替代；“耶和华”则是传统但较不贴近现今通常重构读音的形式。
- issue: 以色列对同行者的承诺范围
  choice: 让你同享雅威所赐的福
  alternative: 一般性地善待你
  rationale: 前后同根词及句法衔接表明，承诺与雅威赐给以色列的福直接相关；译文不进一步规定这种分享的具体形式。
translation_notes:
  register: 采用简洁、庄重而通顺的现代标准汉语。“同去”贴合旅程场景，“让你同享”避免生硬重复；脚注补出原文的词语呼应与字面结构。
