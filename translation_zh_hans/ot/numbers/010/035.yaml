base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/035.yaml
  text: And whenever the ark set out[a], Moses said, “Rise up, O Yahweh, and let your enemies be scattered[b], and let those who hate you flee before you.”
translation:
  language: zh_hans
  text: 每逢约柜起行[a]，摩西就说：“雅威啊，求你起来！愿你的仇敌四散，愿恨你的人从你面前逃跑[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“约柜起行时，事情是这样：摩西就说。”希伯来语采用惯用结构；在本段中很可能表示每次约柜起行时都如此。
    reason: lexical_alternative
  - marker: b
    text: “起来”是求雅威彰显能力、采取行动，并非说上帝先前在字面上躺卧或毫无行动。
    reason: cultural_note
lexical_decisions:
- source_word: וַיְהִי בִּנְסֹעַ
  choice: 每逢……起行
  rationale: 该结构在上下文中引出反复发生的情形；“每逢”自然表达这种惯常时间关系，同时“起行”符合队伍启程的语境。
- source_word: הָאָרֹן
  choice: 约柜
  rationale: 原文仅作“柜”，但在现代汉语圣经语境中，“约柜”是清楚而固定的对应词，也避免读者误解为普通箱柜。
- source_word: קוּמָה
  choice: 求你起来
  rationale: 保留“起来”的鲜明意象，并以“求你”表达命令式在向上帝祈求时的恳请语气。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代简体中文读者最熟悉的神名音译“耶和华”，而不以称号替代原文专名。
- source_word: וְיָפֻצוּ
  choice: 愿……四散
  rationale: 此未完成式承接命令式，具有祈愿语气；“愿”准确保留祷告式意愿，“四散”传达溃散之意。
- source_word: אֹיְבֶיךָ
  choice: 你的仇敌
  rationale: 直接保留第二人称所属关系及敌对含义。
- source_word: וְיָנֻסוּ
  choice: 愿……逃跑
  rationale: 与前句平行，同样按祈愿语气处理；“逃跑”是自然、明确的现代汉语。
- source_word: מְשַׂנְאֶיךָ
  choice: 恨你的人
  rationale: 分词表示以敌视上帝为持续特征的人；该表达自然并保留其人身性的敌对意味。
- source_word: מִפָּנֶיךָ
  choice: 从你面前
  rationale: 既保留介词“从”和“面前”的空间意象，也自然表达敌人在上帝临到时败退。
theological_decisions:
- issue: 如何译出神名 יְהוָה
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用四字神名而非一般称号。正文保留专名，并采用现代中文圣经传统中最通行、普通读者最易识别的“耶和华”；“雅威”是较贴近学术重构发音的可选形式。
- issue: “起来”是否指上帝先前不活动
  choice: 保留行动隐喻，理解为求上帝彰显能力、采取行动
  alternative: 意译为“求你行动”
  rationale: 原文使用具体命令式“起来”。保留此意象可维持诗性和军事出行祷词的力度，但不应据此推断上帝此前在字面上躺卧或无所作为。
- issue: 两个未完成式的语气
  choice: 译为祈愿：“愿……愿……”
  alternative: 结果或预告：“你的仇敌就必……恨你的人就必……”
  rationale: 它们紧随命令式，最自然地承接为祈愿式请求；不过希伯来语形式本身也容许读出行动后果，故记录该替代理解而不把它教义化。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“每逢……就……”清楚呈现反复情形；摩西的话保留平行祈愿句式和原文的行动意象。正文所有脚注标记均已对应列出。
