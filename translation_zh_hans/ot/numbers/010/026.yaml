base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/026.yaml
  text: And over the company of the tribe of the sons of Asher was Pagiel son of Ocran[a].
translation:
  language: zh_hans
  text: 亚设子孙支派队伍的统领是俄兰的儿子帕结。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “队伍”或译“军旅”“军队”或“编队”；希伯来语指以色列营中有组织的编组单位。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/עַל
  choice: 的统领是
  rationale: 介词 עַל 在连续列举各支派队伍首领的句式中表示某人位居其上、负责统领；结合上文补足汉语所需的中心语，使名单结构自然清楚。句首连接词 וְ 在汉语连续名单中不必机械译作“并且”。
- source_word: צְבָא
  choice: 队伍
  rationale: 此处指以色列营中按秩序编组的支派队伍。“队伍”既保留组织化群体的含义，也避免把语境过度限定为纯粹作战的“军队”。
- source_word: מַטֵּה
  choice: 支派
  rationale: 此处是以色列部族单位的常用义，不是字面的“杖”或“枝条”。
- source_word: בְּנֵי אָשֵׁר
  choice: 亚设子孙
  rationale: 保留希伯来语“亚设之子”的族群表达，同时“子孙”在现代汉语中能自然表示其后裔及所属支派。
- source_word: פַּגְעִיאֵל
  choice: 帕结
  rationale: 按现代中文圣经人名的通行译法音译。
- source_word: בֶּן עָכְרָן
  choice: 俄兰的儿子
  rationale: 自然呈现希伯来语父子谱系结构；父名按现代中文圣经通行译法音译。
theological_decisions: []
