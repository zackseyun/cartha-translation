  text: וַ/יִּסְעוּ֙ מֵ/הַ֣ר יְהוָ֔ה דֶּ֖רֶךְ שְׁלֹ֣שֶׁת יָמִ֑ים וַ/אֲר֨וֹן בְּרִית יְהוָ֜ה נֹסֵ֣עַ לִ/פְנֵי/הֶ֗ם דֶּ֚רֶךְ שְׁלֹ֣שֶׁת יָמִ֔ים לָ/ת֥וּר לָ/הֶ֖ם מְנוּחָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/033.yaml
  text: So they set out from the mountain of Yahweh for a journey of three days[a], and the ark of the covenant of Yahweh set out before them for a journey of three days[b], to seek out a resting place for them.
translation:
  language: zh_hans
  text: 他们从雅威的山起行，走了三天的路[a]；雅威的约柜在他们前面行进了三天的路程，要为他们探寻安歇之处[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“走了三天的行程”。原文这一短语在本节出现两次。
    reason: lexical_alternative
  - marker: b
    text: “探寻”也可译作“察看”或“寻找”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: 起行
  rationale: נסע在迁移营地的语境中指拔营出发；“起行”简洁、庄重，也自然承接旷野行程的叙事。
- source_word: מֵהַר יְהוָה
  choice: 从雅威的山
  rationale: 直译הַר与神名的所属关系，并按项目原则将四字神名译为“雅威”。
- source_word: דֶּרֶךְ שְׁלֹשֶׁת יָמִים
  choice: 走了三天的路
  rationale: 该短语以时间衡量路程，意为三天的行程；此译法在现代汉语中自然，并保留路程与时长兼具的表达。
- source_word: וַאֲרוֹן בְּרִית יְהוָה
  choice: 雅威的约柜
  rationale: “约柜”是אֲרוֹן בְּרִית在汉语中的清楚、通行表达；“雅威的”保留构造链所表明的归属关系。
- source_word: נֹסֵעַ לִפְנֵיהֶם
  choice: 走在他们前面
  rationale: 分词表达与众人行进同时持续的动作；“走在他们前面”自然呈现其先导位置，而不把距离解释为领先三天。
- source_word: לָתוּר
  choice: 探寻
  rationale: תור可指探察、搜寻；这里寻找的是适合停歇之处，“探寻”既保留察看意味，也避免赋予军事侦察色彩。
- source_word: מְנוּחָה
  choice: 安歇之处
  rationale: 在行旅语境中，此词具体指可供歇息或安营的地方，而非仅指抽象的“安息”。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；采用“雅威”以音译保存其专名性质，不以称号替代。
- issue: 约柜在众人前面的表述
  choice: 走在他们前面
  alternative: 在他们前面走了三天的路
  rationale: 原文可清楚表明约柜在队伍前面行进，但不必解释为约柜与队伍之间相隔三天路程；此译法保留空间关系而不额外推断。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“起行”“约柜”“安歇之处”保持经文语体，但避免生硬古奥；第二句加入“也”以自然呈现原文重复的“三天的路”。
