base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/025.yaml
  text: Then the banner of the camp of the sons of Dan set out[a], serving as the rear guard for all the camps by their divisions[c][b]; and over its company was Ahiezer the son of Ammishaddai.
translation:
  language: zh_hans
  text: 随后，但子孙营的旗队[a]起行，作众营按各队伍编制排列的后卫[b][c]；统领但支派队伍的是亚米沙代的儿子亚希以谢。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “旗队”也可译作“旗帜”或“旗号”；这里可指列在该旗帜之下的营队。
    reason: lexical_alternative
  - marker: b
    text: “后卫”也可译作“走在最后”或“殿后”；原文所用词含有收拢队尾之意。
    reason: lexical_alternative
  - marker: c
    text: 原文也可译作“按着各队伍”或“按着各营的编制”；这里指按支派组织起来的行军编制。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָסַע
  choice: 随后……起行
  rationale: 该动词在行军叙事中表示拔营出发；“随后”自然表达承接推进的叙事关系。
- source_word: דֶּגֶל מַחֲנֵה בְנֵי דָן
  choice: 但子孙营的旗队
  rationale: דֶּגֶל本指辨识营队的旗帜，也可转指列在该旗帜之下的队伍；此处是实际起行的营队，因此译作“旗队”，同时用脚注保留“旗帜／旗号”的词义。
- source_word: מְאַסֵּף לְכָל הַמַּחֲנֹת
  choice: 作所有营的后队
  rationale: 分词מְאַסֵּף在此行军语境中指走在最后、收拢并护卫队尾的队伍；“作……的后队”简洁清楚，也保留其职能意味。
- source_word: לְצִבְאֹתָם
  choice: 按着各军队的编制
  rationale: צָבָא在本段指按支派组织起来的行军队伍，不必限于作战部队；“按着各军队的编制”表达有组织、有次序地行进。
- source_word: וְעַל צְבָאוֹ
  choice: 统领但营军队的是
  rationale: עַל加人物表示被立在该军队之上负责统领；中文转换为自然的领队表述，并明确所属营队。
- source_word: אֲחִיעֶזֶר בֶּן עַמִּישַׁדָּי
  choice: 亚米沙代的儿子亚希以谢
  rationale: 按希伯来语姓名音译，并自然保留父子关系公式。
