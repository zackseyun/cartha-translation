  to: 随后，但子孙营的旗队[a]起行，作众营按各队伍编制排列的后卫[b][c]；统领但支派队伍的是亚米沙代的儿子亚希以谢。
  rationale: 修正了支派名被错误断开的句法问题，并以“后卫”和“队伍”更自然、准确地表达行军编制和殿后功能。修订不改变原文对旗队、全营编制及亚希以谢职分的表达；脚注锚点均保留且顺序与正文一致。
