  text: וּ/בְ/י֨וֹם שִׂמְחַתְ/כֶ֥ם וּֽ/בְ/מוֹעֲדֵי/כֶם֮ וּ/בְ/רָאשֵׁ֣י חָדְשֵׁי/כֶם֒ וּ/תְקַעְתֶּ֣ם בַּ/חֲצֹֽצְרֹ֗ת עַ֚ל עֹלֹ֣תֵי/כֶ֔ם וְ/עַ֖ל זִבְחֵ֣י שַׁלְמֵי/כֶ֑ם וְ/הָי֨וּ לָ/כֶ֤ם לְ/זִכָּרוֹן֙ לִ/פְנֵ֣י אֱלֹֽהֵי/כֶ֔ם אֲנִ֖י יְהוָ֥ה אֱלֹהֵי/כֶֽם׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/010.yaml
  text: And on the day of your gladness[a], and at your appointed times, and at the beginnings of your months, you shall blow the trumpets over your burnt offerings and over the sacrifices of your peace offerings, and they shall be for you as a memorial before your God[b]. I am Yahweh your God.
translation:
  language: zh_hans
  text: 在你们欢庆的日子、你们的节期，以及每月月初[a]，你们要在献燔祭和平安祭[b]时吹号；这要作你们在上帝面前的记念。我是雅威你们的上帝。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“你们各月的开头”；也可理解为“你们的新月节”。
    reason: lexical_alternative
  - marker: b
    text: 或译“团契祭”。
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׂמְחַתְכֶם
  choice: 你们欢庆
  rationale: 该名词表示喜乐、欢庆；结合“日子”译为“欢庆的日子”，自然地保留原文所指的喜庆场合。
- source_word: מוֹעֲדֵיכֶם
  choice: 你们的节期
  rationale: מוֹעֵד可泛指定期、约定的时日；本节为礼仪语境，“节期”既自然，也保留其宗教历法含义。
- source_word: רָאשֵׁי חָדְשֵׁיכֶם
  choice: 每月月初
  rationale: 原文直译为“你们各月的开头”；“每月月初”准确表达历法意义，同时不直接把原文改写成“新月”。
- source_word: וּתְקַעְתֶּם בַּחֲצֹצְרֹת
  choice: 吹响号筒
  rationale: תקע与号筒连用时表示吹奏、使之发声；“吹响号筒”是现代汉语中自然且明确的表达。
- source_word: עַל עֹלֹתֵיכֶם
  choice: 在燔祭的祭牲上方
  rationale: 保留介词עַל的空间与伴随意味；补出“祭牲”使“上方”在汉语中所指清楚，却不增加新的祭礼内容。
- source_word: זִבְחֵי שַׁלְמֵיכֶם
  choice: 平安祭的祭牲
  rationale: שְׁלָמִים与完整、平安相关；“平安祭”保留传统祭祀术语，而“祭牲”反映构词中的זִבְחֵי。
- source_word: וְהָיוּ לָכֶם לְזִכָּרוֹן
  choice: 这些号声要……作你们蒙记念的凭据
  rationale: 复数动词最自然地回指吹号所产生的号声；“蒙记念的凭据”保留礼仪性“记念”含义，并表达该记念是在上帝面前为他们而有。
- source_word: לִפְנֵי אֱלֹהֵיכֶם
  choice: 在你们的上帝面前
  rationale: 直接保留“在……面前／临在中”的表达，适合祭祀语境。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语音译表达四字神名，保留其作为以色列之上帝专名的性质，而不以称号替代。
theological_decisions:
- issue: 四字神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文使用上帝的专名；“雅威”较直接对应学界通常重构的Yahweh读音，并避免译成“主”而失去专名性质。
- issue: 祭名שְׁלָמִים的译法
  choice: 平安祭
  alternative: 团契祭
  rationale: 该词既与完整、福祉和平安相关，也可能涉及共同享用祭物；“平安祭”保留词源语义及汉语圣经传统，同时以脚注呈现另一可行理解。
- issue: לְזִכָּרוֹן所表达的记念关系
  choice: 作你们蒙记念的凭据
  alternative: 作为你们的纪念
  rationale: “在上帝面前”的语境表明号声具有使献祭者在上帝面前被记念的礼仪功能；译文不进一步界定这种记念如何产生或发挥作用。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。保留“燔祭”“平安祭”等必要的祭祀术语；句法略作拆分，以免原文长串并列在汉语中显得累赘。所有脚注标记均置于相应词语之后。
