revisions:
- from: 在你们欢庆的日子、你们的节期和每月月初[a]，你们要在燔祭和平安祭[b]的祭牲上方吹响号筒。这些号声要在你们的上帝面前作你们蒙记念的凭据。我是雅威你们的上帝。
  to: 在你们欢庆的日子、你们的节期，以及每月月初[a]，你们要在献燔祭和平安祭[b]时吹号；这要作你们在上帝面前的记念。我是雅威你们的上帝。
  rationale: 修订以“在献……时吹号”表达吹号与祭礼的关联，不把原文介词限定为祭牲上方的物理位置。将“这些号声要在你们的上帝面前作你们蒙记念的凭据”收束为“这要作你们在上帝面前的记念”，避免加入“凭据”及明确的被动受记念关系，同时保留复数指代在汉语中的自然概括。其余核心术语和两个脚注均维持。
