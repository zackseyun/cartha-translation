  timestamp: '2026-07-14T04:51:51Z'
review_pass:
  verdict: revise
  source_fidelity: 译文整体准确传达了节庆、节期、月初、吹号、燔祭、平安祭及神名。可是“在……祭牲上方吹响”把עַל处理为明确的物理空间关系，汉语读者容易理解为对着祭牲上空吹号；原文在此更稳妥地表示吹号与献祭相伴随，宜译为“在/献……时吹号”。“这些号声”作为复数动词的回指可以成立，但原文未明确把“号声”名词化；译作“这要……作为你们在上帝面前的记念”更贴近原文并保留指代的适度含混。
  naturalness: “在燔祭和平安祭的祭牲上方吹响号筒”不够自然，且造成不必要的空间图像。“作你们蒙记念的凭据”虽可解释礼仪含义，却比原文“作你们的记念”更强，加入“凭据”及被动的“蒙记念”会使语义趋于解释性。修订后句法更顺畅、庄重，也符合现代标准汉语。
  terminology: “燔祭”“平安祭”“雅威”均可保留；“号筒”可指喇叭状器物，但本章所指为祭仪用的חצצרות，译为“号”较中性、自然，避免与其他号角类器物混同。脚注a准确保留“月初/新月节”的替代理解；脚注b的“团契祭”可保留为既有常见替代术语。
  issues:
  - severity: medium
    issue: “在燔祭和平安祭的祭牲上方吹响号筒”将עַל具体化为“祭牲上方”。
    rationale: 此处עַל可表示伴随献祭而吹号；原文没有要求描绘号筒位于祭牲上方。该译法既不自然，也可能误导为严格的空间位置。
  - severity: medium
    issue: “作你们蒙记念的凭据”过度阐释לָכֶם לְזִכָּרוֹן。
    rationale: “凭据”并非原文所明说；“蒙记念”虽符合礼仪语境下的可能含义，却将“记念”的关系明确限定为上帝记念献祭者。宜保留“作你们在上帝面前的记念”的简练表达。
  - severity: low
    issue: “号筒”不如“号”中性。
    rationale: 原文指本章既定的祭仪号具；“号”在汉语中可自然承接“吹号”，并避免对器物形制作不必要的限定。
