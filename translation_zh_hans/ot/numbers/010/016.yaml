  yaml_path: translation/ot/numbers/010/016.yaml
  text: And over the company of the tribe of the sons of Zebulun was Eliab son of Helon[a].
translation:
  language: zh_hans
  text: 统领西布伦子孙支派队伍的是希伦的儿子以利押[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “队伍”也可译作“军队”或“部队”；希伯来语צְבָא在这里指按行军秩序编组的支派队伍。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל
  choice: 统领是
  rationale: 原文以וְ承接上文，עַל表示居于队伍之上、负有指挥权；按中文连续名单的自然句式，将省略的系词和领导关系表达为“统领是”。
- source_word: צְבָא
  choice: 队伍
  rationale: 此处指按行军秩序编组的支派队伍。“队伍”符合现代汉语，又不把它过度限定为常备军；其他可能译法见脚注。
- source_word: מַטֵּה
  choice: 支派
  rationale: 这里是以色列社会组织单位的常用义，并非字面所指的“杖”。
- source_word: בְּנֵי זְבוּלֻן
  choice: 西布伦子孙
  rationale: 保留原文“西布伦之子”的宗族表达，在此泛指西布伦的后裔及其支派成员。
- source_word: אֱלִיאָב
  choice: 以利押
  rationale: 采用中文圣经传统中通行的人名音译。
- source_word: בֶּן חֵלֹן
  choice: 希伦的儿子
  rationale: 直接、自然地表达希伯来语父系称谓结构。
theological_decisions: []
