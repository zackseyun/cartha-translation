  yaml_path: translation/ot/numbers/010/005.yaml
  text: When you blow an alarm blast, the camps that are encamped on the east side shall set out.
translation:
  language: zh_hans
  text: 你们吹响警报号[a]时，在东边扎营的各营便要起行。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“信号声”。希伯来语在这里指一种由号筒吹出的特定号声，用来发出营队起行的信号。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּתְקַעְתֶּם
  choice: 你们吹出……时
  rationale: תקע用于号筒时意为“吹响”；连词加未完成式在此引出随后行动，译作时间条件结构，符合现代汉语。
- source_word: תְּרוּעָה
  choice: 警报声
  rationale: 此词在本章号筒信号的语境中指一种有别于普通吹奏、用来发令的特定急促号声；“警报声”保留其警示、号令色彩，脚注补充“信号声”这一可能表达。
- source_word: וְנָסְעוּ
  choice: 就要起行
  rationale: נסע在营地迁移语境中指拔营出发；“起行”简洁庄重，也与指令的结果关系相符。
- source_word: הַמַּחֲנוֹת
  choice: 各营
  rationale: 复数名词指以色列各支派组成的营队；“各营”自然体现复数及分组含义。
- source_word: הַחֹנִים
  choice: 驻扎
  rationale: 分词修饰“各营”，描述其驻营状态；合译为“驻扎在……的各营”，比逐字译法更自然。
- source_word: קֵדְמָה
  choice: 在东边
  rationale: 本处结合“驻扎”表示营地所处的东方位置，而非移动方向，因此译作“在东边”。
theological_decisions: []
translation_notes:
