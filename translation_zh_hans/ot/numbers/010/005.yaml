  rationale: 修订仅优化汉语搭配并澄清号声的性质：以“吹响警报号”替代“吹出警报声”，以“在东边扎营的各营”明确分词修饰关系，并以“便要”呈现吹号与起行之间的结果关系。保留原文的复数“各营”、东方营位和特定信号的语义，未添加宗派性或历史性解释。
