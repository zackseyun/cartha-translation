- from: 以色列众子[a]从西奈旷野出发，一站一站地前行；云彩停驻在巴兰旷野。
  to: 以色列的子孙[a]照着各站的行程，从西奈旷野出发；云彩停驻在巴兰旷野。
  rationale: 修订“以色列众子”为“以色列的子孙”，以消除现代汉语中不自然且可能限缩为男性儿子的表述，同时在脚注中保留“以色列人”这一惯用集体译法。将行程短语调整为“照着各站的行程”，更直接对应原文的复数“行程／行军阶段”，并避免重复表达起行与前行。
