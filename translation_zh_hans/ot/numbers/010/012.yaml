  source_fidelity: 原文的“以色列的众子／子孙”是一个指称以色列群体的固定表达。草稿的“以色列众子”虽试图保留字面形式，却在现代汉语中不自然，且容易被理解为“以色列的许多儿子”，不适合此处的集体民族称谓。“按着各站的行程”对应 לְמַסְעֵיהֶם，保留复数行程／行军阶段的含义。
  naturalness: “以色列众子”不是现代标准汉语中自然的群体称呼；改为“以色列的子孙”既庄重通顺，也保留原文的家族性表达。“照着各站的行程，从……出发”的语序自然明确。
  terminology: “旷野”“云彩”“停驻”及“西奈”“巴兰”均可保留。“以色列的子孙”比“以色列众子”更符合汉语圣经叙事语体；脚注保留“以色列人”这一惯用的集体译法。
