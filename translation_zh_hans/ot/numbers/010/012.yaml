base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/012.yaml
  text: And the sons of Israel set out by stages from the wilderness of Sinai[a], and the cloud settled in the wilderness of Paran.
translation:
  language: zh_hans
  text: 以色列的子孙[a]照着各站的行程，从西奈旷野出发；云彩停驻在巴兰旷野。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“以色列人”。希伯来文作“以色列的子孙”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: 出发
  rationale: 在旷野行程叙事中，נסע常指拔营启程；“出发”现代、自然，并保留开始行进的具体含义。
- source_word: בְנֵי יִשְׂרָאֵל
  choice: 以色列众子
  rationale: 保留希伯来文“以色列的众子”这一阳性亲属称谓，同时用“众子”使中文较为凝练；其惯用集体含义“以色列人”列于脚注。
- source_word: לְמַסְעֵיהֶם
  choice: 一站一站地前行
  rationale: מַסָּע的复数在此指连续的行程或驻扎阶段；这一译法自然表达分段推进的意思。
- source_word: מִמִּדְבַּר סִינָי
  choice: 从西奈旷野
  rationale: “旷野”能表达未开垦、荒僻的地域，不把该地貌局限为沙漠，并符合五经叙事的常用译法。
- source_word: וַיִּשְׁכֹּן
  choice: 停驻
  rationale: שכן可指居住、安顿；以云彩为主语时，“停驻”既体现停止移动，也保留较持续的驻留意味。
- source_word: הֶעָנָן
  choice: 云彩
  rationale: 定冠词指前文已经明确、引导以色列人的那云彩；“云彩”是自然且庄重的对应表达。
- source_word: בְּמִדְבַּר פָּארָן
  choice: 在巴兰旷野
  rationale: 延续מִדְבָּר译作“旷野”，地名פָּארָן按普通话圣经地名惯例音译为“巴兰”。
theological_decisions:
- issue: בְנֵי יִשְׂרָאֵל的性别与群体表达
  choice: 以色列众子
  alternative: 以色列人
  rationale: 原文明确使用阳性亲属表达“以色列的众子”。正文予以保留，不将其无标记地改为中性族称；脚注说明其在语境中的集体指称，避免读者误以为只强调某一小群亲生儿子。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“一站一站地前行”清楚呈现分段行程；分号对应两个连续而关系紧密的叙事动作。
