  yaml_path: translation/ot/numbers/010/030.yaml
  text: But he said to him, “I will not go. Rather, I will go to my own land and to my own kindred.”
translation:
  language: zh_hans
  text: 他对摩西说：“我不去；我要回自己的故土，到自己的亲族那里去。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֶל־אַרְצִי
  choice: 回自己的故土
  rationale: אַרְצִי直译为“我的土地／国土”；结合说话者返回出生地的语境，用“自己的故土”自然表达归返之意。
- source_word: מוֹלַדְתִּי
  choice: 自己的亲族
  rationale: 该词可指本族、亲属或出生之地；与“故土”并列时译作“亲族”，保留土地与族属两方面的并列。
- source_word: כִּי אִם
  choice: ；我要……
  rationale: 此处表示对前句否定后的转折或更正。现代汉语不必机械译出“而是”，分号已清楚呈现“不是去，而是返回”的关系。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“他”依上文指何巴；为避免中文代词连续造成指向含混，将间接宾语明确译为“摩西”。
