id: NUM.10.9
reference: Numbers 10:9
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/כִֽי תָבֹ֨אוּ מִלְחָמָ֜ה בְּ/אַרְצְ/כֶ֗ם עַל הַ/צַּר֙ הַ/צֹּרֵ֣ר אֶתְ/כֶ֔ם וַ/הֲרֵעֹתֶ֖ם בַּ/חֲצֹצְר֑וֹת וֲ/נִזְכַּרְתֶּ֗ם לִ/פְנֵי֙ יְהוָ֣ה אֱלֹֽהֵי/כֶ֔ם וְ/נוֹשַׁעְתֶּ֖ם מֵ/אֹיְבֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/009.yaml
  text: And when you go to war in your land against the enemy who oppresses you[a], then you shall sound an alarm with the trumpets, and you shall be remembered before Yahweh your God[c][b], and you shall be saved from your enemies.
translation:
  language: zh_hans
  text: 当你们在你们的地上出去作战，抵挡那压迫你们的仇敌时[a]，要用号筒吹响警报；这样，你们必在雅威[c]——你们的上帝——面前被记念[b]，也必蒙拯救，脱离你们的仇敌。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“如果你们在你们的地上出去作战，抵挡那压迫你们的仇敌。”希伯来文连接词既可引出条件，也可引出将来发生的情形。
    reason: alternative_reading
  - marker: b
    text: 或译：“雅威——你们的上帝——必记念你们。”原文采用被动形式，直译为“你们必在……面前被记念”。
    reason: lexical_alternative
  - marker: c
    text: “雅威”音译自希伯来文神名 YHWH。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: ……时
  rationale: 在律法指示中可引出将来可能发生的情形，既可理解为“当……时”，也可理解为“如果”；正文采用自然的情境表达，脚注保留条件义。
- source_word: תָבֹאוּ מִלְחָמָה
  choice: 交战
  rationale: 这是进入战争或参与战斗的惯用表达；“交战”简洁自然，并适合本节在本土遭敌压迫的语境。
- source_word: בְּאַרְצְכֶם
  choice: 在自己的地上
  rationale: 保留 אֶרֶץ 的土地和疆域意味；“自己的”清楚传达第二人称复数领属。
- source_word: עַל הַצַּר הַצֹּרֵר אֶתְכֶם
  choice: 与那压迫你们的敌人
  rationale: “敌人”表达 צַר，“压迫你们的”保留同根分词 צֹרֵר 所加强的持续敌对或困逼含义。
- source_word: וַהֲרֵעֹתֶם בַּחֲצֹצְרֹת
  choice: 要用号筒吹出警报
  rationale: רוע 的使役式在号筒语境中指发出警报信号，不只是大声吹奏；חֲצֹצְרֹת 指本章所述的银号。
- source_word: וֲנִזְכַּרְתֶּם לִפְנֵי יְהוָה אֱלֹהֵיכֶם
  choice: 你们必在你们的上帝雅威面前被记念
  rationale: 保留 זכר 的尼法勒被动形式及“在……面前”的原文结构，不直接改写为以上帝为主动主语。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代中文常用音译呈现神名 YHWH，而不是以“主”这一称号代替。
- source_word: וְנוֹשַׁעְתֶּם מֵאֹיְבֵיכֶם
  choice: 也必蒙拯救，脱离你们的仇敌
  rationale: “蒙拯救”体现 ישׁע 尼法勒式的被动意义；“脱离”明确表达介词 מִן 所指的解救来源。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 正文直接呈现四字神名的人名性质；脚注说明其希伯来文形式，同时不把称号“主”混同于原文神名。
- issue: וֲנִזְכַּרְתֶּם 的语态和神学张力
  choice: 在……面前被记念
  alternative: 你们的上帝雅威必记念你们；你们必被带到……面前，使他记起
  rationale: 原文使用被动形式。保留被动既忠实于句法，也不额外解释上帝如何“记念”，从而保存经文本身的盟约性表达和张力。
- issue: 号筒警报与蒙拯救之间的关系
  choice: 用“这样”连接，但不扩展因果机制
  alternative: 于是；使得
  rationale: 经文把吹号、在上帝面前被记念和蒙拯救相连；“这样”呈现这种顺承关系，却不把号筒本身解释成具有独立功效。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“号筒”与本章礼仪和军事信号语境相合；“被记念”略带经文语体，但为保留希伯来文被动结构和神学张力而有意采用。所有脚注标记均置于相应正文之后。
