base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/014.yaml
  text: The standard of the camp of the sons of Judah set out first[a], by their divisions[b]; and over its division was Nahshon son of Amminadab.
translation:
  language: zh_hans
  text: 犹大子孙营的旗号[a]按他们的编队[b]首先启行；统领这支队伍的是亚米拿达的儿子拿顺。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “旗号”也可译作“旗帜”。希伯来语此词指部族营队行进时所归属的标志，也可指该旗号之下的营队。
    reason: lexical_alternative
  - marker: b
    text: “编队”也可译作“队伍”或“军队”。希伯来语使用军事组织用语，指按秩序编组的部族单位。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסַּע
  choice: 出发
  rationale: 在旷野行程语境中，נסע指拔营启程；“出发”自然简明，并与行军次序相合。
- source_word: דֶּגֶל
  choice: 旗号
  rationale: 此词既可指部族的旗帜，也可引申指聚集在该旗帜之下的营队；“旗号”保留可见标识及其组织含义。
- source_word: מַחֲנֵה בְנֵי יְהוּדָה
  choice: 犹大子孙营
  rationale: 保留“子孙”的宗族表达，并用紧凑、自然的中文呈现营队归属。
- source_word: בָּרִאשֹׁנָה
  choice: 首先
  rationale: 作副词表示启行次序，“首先”准确而自然。
- source_word: לְצִבְאֹתָם
  choice: 按着他们的队伍
  rationale: צָבָא在本段指按军事方式编组的有序单位；“队伍”避免误解为正在作战的军队，同时保留组织性。
- source_word: וְעַל צְבָאוֹ
  choice: 统领这队伍的是
  rationale: עַל在此表达居于单位之上、负责统领；将希伯来语结构自然转为现代汉语，并把单数后缀所指的犹大单位明确为“这队伍”。
- source_word: נַחְשׁוֹן בֶּן עַמִּינָדָב
  choice: 亚米拿达的儿子拿顺
  rationale: 依现代中文圣经姓名惯例音译，并自然表达父子关系。
