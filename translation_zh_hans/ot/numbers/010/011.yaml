source:
  edition: WLC
  text: וַ/יְהִ֞י בַּ/שָּׁנָ֧ה הַ/שֵּׁנִ֛ית בַּ/חֹ֥דֶשׁ הַ/שֵּׁנִ֖י בְּ/עֶשְׂרִ֣ים בַּ/חֹ֑דֶשׁ נַעֲלָה֙ הֶֽ/עָנָ֔ן מֵ/עַ֖ל מִשְׁכַּ֥ן הָ/עֵדֻֽת׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/011.yaml
  text: And it happened in the second year[a], in the second month, on the twentieth day of the month[b], that the cloud lifted from over the tabernacle of the testimony.
translation:
  language: zh_hans
  text: 第二年二月二十日，云彩从见证的帐幕[b]上方升起[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“上升”或“上去”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文作“见证的帐幕”；也可译“见证之帐”。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי
  choice: （以时间状语起句，不另译）
  rationale: 这是希伯来叙事中承接事件的常用形式。现代汉语以“第二年二月二十日”直接引入事件更自然，也保留了叙事的先后推进。
- source_word: בַּשָּׁנָה הַשֵּׁנִית בַּחֹדֶשׁ הַשֵּׁנִי בְּעֶשְׂרִים בַּחֹדֶשׁ
  choice: 第二年二月二十日
  rationale: 将原文逐层标明的年、月、日合并为现代汉语自然而准确的日期表达。
- source_word: נַעֲלָה
  choice: 升起
  rationale: עלה在此描述云彩向上移动并离开帐幕上方；“升起”简明自然，同时保留实际空间运动的含义。
- source_word: הֶעָנָן
  choice: 云彩
  rationale: 指以色列人在旷野中已经熟知、引导他们的那云；“云彩”符合现代中文圣经语体。
- source_word: מֵעַל
  choice: 从……上方
  rationale: 准确表达云彩原来位于帐幕之上、随后离开该位置的空间关系。
- source_word: מִשְׁכַּן
  choice: 帐幕
  rationale: 该词指旷野中的可移动圣所，也是上帝居住在百姓中间的所在；“帐幕”是准确且通行的中文称呼。
- source_word: הָעֵדֻת
  choice: 见证的
  rationale: 直译原文的圣所专用语，保留其与约的见证及相关经文之间的联系，不在正文中进一步解释为“约”或“法版”。
theological_decisions:
- issue: 圣所名称 מִשְׁכַּן הָעֵדֻת
  choice: 见证的帐幕
  alternative: 见证之帐；约的帐幕
  rationale: “见证的帐幕”贴近原文两个名词的关系，并保留“见证”所含的经文互涉。“约的帐幕”说明性较强，但把“见证”直接解释为“约”，超出了本节的字面表达。
translation_notes:
  register: 采用简洁、庄重的现代标准汉语。日期按中文习惯紧凑表达；关键圣所术语保持较正式的经文语体。脚注标记置于各自所说明的词语之后，以免沿用咨询文本中标记位置与内容不对应的问题。
