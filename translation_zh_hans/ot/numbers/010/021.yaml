source:
  edition: WLC
  text: וְ/נָסְעוּ֙ הַ/קְּהָתִ֔ים נֹשְׂאֵ֖י הַ/מִּקְדָּ֑שׁ וְ/הֵקִ֥ימוּ אֶת הַ/מִּשְׁכָּ֖ן עַד בֹּאָֽ/ם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/021.yaml
  text: Then the Kohathites set out[a], carrying the holy things, and the tabernacle was set up before they arrived.
translation:
  language: zh_hans
  text: 随后，哥辖人出发，抬着圣所的器物[a]；在他们到达以前，帐幕已经支搭好了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译可作“抬圣所的人”；这里是指哥辖人所搬运的圣所器物，有别于下文所说的帐幕结构。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָסְעוּ
  choice: 随后……出发
  rationale: 动词 נסע 在行军叙事中表示拔营启程；句首连接词在这里具有顺承作用，用“随后”自然呈现叙事次序。
- source_word: הַקְּהָתִים
  choice: 哥辖人
  rationale: 这是哥辖宗族成员的复数族称；“哥辖人”是简洁自然的现代汉语表达。
- source_word: נֹשְׂאֵי הַמִּקְדָּשׁ
  choice: 抬着圣所的器物
  rationale: 字面可作“抬圣所的人”，但上下文表明哥辖人负责搬运圣所内的神圣器物，而非下一分句所说的帐幕结构；此译既保留“圣所”的词义联系，也避免误解。
- source_word: וְהֵקִימוּ אֶת־הַמִּשְׁכָּן
  choice: 帐幕已经支搭好了
  rationale: 希伯来文是无明示主语的第三人称复数主动式。根据前文，先行的革顺人和米拉利人负责帐幕结构；用汉语无施事表达避免误以为是哥辖人支搭帐幕，同时不武断补出主语。“已经”结合后面的时间界限，表达帐幕在他们抵达时已搭妥。
- source_word: הַמִּשְׁכָּן
  choice: 帐幕
  rationale: 在旷野圣所语境中，מִשְׁכָּן 指会幕的帐幕结构；“帐幕”是准确、庄重且通行的译法。
- source_word: עַד בֹּאָם
  choice: 在他们到达以前
  rationale: 字面为“直到他们来到”；结合语境，这句话说明哥辖人携器物抵达之前，帐幕已预先搭好。“在……以前”自然表达这一时间关系。
theological_decisions:
- issue: 支搭帐幕者的身份
  choice: 采用无施事表达“帐幕已经支搭好了”，不把动作归给哥辖人
  alternative: “他们支搭帐幕”
  rationale: 原文动词虽为复数主动式，却没有明示主语；上下文显示帐幕构件由先行的其他利未宗族搬运并支搭。若将“他们”直接理解为紧邻的哥辖人，会造成职责上的误读。译文保留原文未点名施事者的特点。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“抬着”符合以肩扛抬圣物的具体情景；分号清楚区分哥辖人的启程与帐幕预先搭好的两项行动。
