base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/008.yaml
  text: And the sons of Aaron[a], the priests, shall blow the trumpets; and they shall be for you a permanent statute throughout your generations.
translation:
  language: zh_hans
  text: 亚伦的儿子们，就是祭司，要吹这些号；这要作你们世世代代的永久[a]定例。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“永远的定例”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי אַהֲרֹן
  choice: 亚伦的儿子
  rationale: בְּנֵי 字面意为“儿子们”；保留亲属称谓，并采用自然的现代汉语表达。
- source_word: הַכֹּהֲנִים
  choice: 就是祭司
  rationale: 原文是对“亚伦的儿子”的同位说明；“就是”清楚表达这一关系。
- source_word: יִתְקְעוּ
  choice: 要吹
  rationale: תקע 与号同用时指吹响；“要吹”符合律法指示语境，又不额外强化为直接命令。
- source_word: בַּחֲצֹצְרֹת
  choice: 这些号
  rationale: חֲצֹצְרוֹת 指号或号筒；“这些”承接第2节所造的两支银号，但本节没有重复“银”这一修饰语，故不将其加入正文。
- source_word: וְהָיוּ לָכֶם
  choice: 这要作你们
  rationale: 原文动词为复数，形式上可回指前面的号，也可概括前述安排；汉语以“这”自然概括整项规定，同时避免武断限定其所指。
- source_word: לְחֻקַּת עוֹלָם
  choice: 永久的定例
  rationale: 这是律法文本中常见的固定表达，表示持续有效的规例；“永久”既保留延续性，也符合现代汉语法律语体。
- source_word: לְדֹרֹתֵיכֶם
  choice: 你们世世代代
  rationale: 表达该规定适用于接续的各代；“世世代代”自然、庄重，并忠实传达复数“各代”的延续含义。
theological_decisions:
- issue: חֻקַּת עוֹלָם 的时限含义
  choice: 永久的定例
  alternative: 永远的定例
  rationale: עוֹלָם 可表示长久、恒久或永远，具体范围须由盟约和语境判断。“永久”保留其持续约束力，而不替原文预先解决其是否指绝对无终止的神学问题。
- issue: וְהָיוּ 的所指
  choice: 用“这”概括前述吹号安排
  alternative: 这些号要作为你们的定例
  rationale: 复数动词可形式上回指号，但整句也可将前述制度作为历代定例。汉语“这”允许保留概括性，不把所指过度限定为号本身。
translation_notes:
  register: 采用现代、庄重而易懂的律法叙述语体。“就是祭司”明确同位关系；分号呈现行动规定与持续效力之间的结构。脚注标在“永久的定例”之后，与其实际说明对象相连。
