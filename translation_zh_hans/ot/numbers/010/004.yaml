  yaml_path: translation/ot/numbers/010/004.yaml
  text: But if they blow only one[a], then the leaders, the heads of the thousands of Israel, shall gather to you.
translation:
  language: zh_hans
  text: 但如果只吹一支号，众首领，就是以色列各千人单位的首领[a]，就要到你那里集合。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“以色列的千人首领”，可能指统领以色列各个千人编制单位的人；有些译本较意译地译作“以色列各宗族的首领”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אִם
  choice: 但如果
  rationale: 承接上一节吹两支号的指示，并引出只吹一支号时的对比条件；“但如果”自然保留这种转折意味。
- source_word: בְּ/אַחַת
  choice: 只吹一支号
  rationale: 原文直译为“用一支”，依上下文省略了“号”；补出“号”并用“只”清楚表达与上一节两支号的对比。
- source_word: יִתְקָעוּ
  choice: 吹
  rationale: תקע在号角信号的语境中指吹响号筒；“吹”是现代汉语最直接自然的表达。
- source_word: וְ/נוֹעֲדוּ
  choice: 集合
  rationale: יעד的尼法勒式在此表示响应约定的信号而聚集；“集合”既清楚又符合召集场景。
- source_word: אֵלֶי/ךָ
  choice: 到你那里
  rationale: 介词表达朝向摩西而去；“到你那里”准确传达方向。
- source_word: הַ/נְּשִׂיאִים
  choice: 众首领
  rationale: נשיאים指群体或支派的领袖；“首领”保留其身份意味，又避免“王子”等可能引起的王室联想。
- source_word: רָאשֵׁי אַלְפֵי יִשְׂרָאֵל
  choice: 以色列各千人队的首领
  rationale: 保留אלפים“千人单位”的行政或军事色彩，并用“各千人队”使现代读者能够自然理解，而不在正文中直接解释为“宗族”。
