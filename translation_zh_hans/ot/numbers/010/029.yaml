  to: 摩西对米甸人流珥的儿子何巴[a]，就是摩西的岳父，说：“我们正要前往雅威所说的那地方；他曾说：‘我要把那地方赐给你们。’你跟我们一起走吧，我们必善待你，因为雅威已经应许以色列得福。”
