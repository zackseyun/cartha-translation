source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר מֹשֶׁ֗ה לְ֠/חֹבָב בֶּן רְעוּאֵ֣ל הַ/מִּדְיָנִי֮ חֹתֵ֣ן מֹשֶׁה֒ נֹסְעִ֣ים אֲנַ֗חְנוּ אֶל הַ/מָּקוֹם֙ אֲשֶׁ֣ר אָמַ֣ר יְהוָ֔ה אֹת֖/וֹ אֶתֵּ֣ן לָ/כֶ֑ם לְכָ֤/ה אִתָּ֨/נוּ֙ וְ/הֵטַ֣בְנוּ לָ֔/ךְ כִּֽי יְהוָ֥ה דִּבֶּר ט֖וֹב עַל יִשְׂרָאֵֽל־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/029.yaml
  text: And Moses said to Hobab son of Reuel the Midianite[a], Moses’ father-in-law, “We are setting out for the place of which Yahweh said, ‘I will give it to you.’ Come with us, and we will do you good, for Yahweh has spoken good concerning Israel.”
translation:
  language: zh_hans
  text: 摩西对米甸人流珥的儿子何巴[a]，就是摩西的岳父，说：“我们正要前往雅威所说的那地方；他曾说：‘我要把那地方赐给你们。’你跟我们一起走吧，我们必善待你，因为雅威已经应许以色列得福。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “岳父”所对应的希伯来词也可泛指男性姻亲；因此，有人把这里理解为“摩西的内兄”或“摩西的姻亲”，而非“岳父”。
    reason: 保留חֹתֵן的较宽语义范围，以及何巴与摩西确切亲属关系的不确定性。
lexical_decisions:
- source_word: חֹבָב
  choice: 何巴
  rationale: 按现代中文圣经人名的常见音译处理。
- source_word: רְעוּאֵל
  choice: 流珥
  rationale: 采用现代中文圣经中通行的人名音译。
- source_word: הַמִּדְיָנִי
  choice: 米甸人
  rationale: 定冠词加族称在此用于说明身份，中文自然表达为“米甸人”。
- source_word: חֹתֵן מֹשֶׁה
  choice: 摩西的岳父
  rationale: חֹתֵן常指男性姻亲，尤指岳父；正文采用最常见的具体含义，同时用脚注保留其较宽泛的语义范围。
- source_word: נֹסְעִים אֲנַחְנוּ
  choice: 我们正要前往
  rationale: 分词加独立代词表示正在进行或即将开始的行动；此处语境是准备启程。
- source_word: אֲשֶׁר אָמַר יְהוָה אֹתוֹ אֶתֵּן לָכֶם
  choice: 雅威所说的那地方；他曾说：‘我要把那地方赐给你们。’
  rationale: 保留神直接应许的引语，并明确单数宾语指回“那地方”；“你们”为复数。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语音译呈现四字神名，保留其作为专名的性质，不以称号替代。
- source_word: לְכָה אִתָּנוּ
  choice: 你跟我们一起走吧
  rationale: 准确传达邀请语气，比逐字译为“到我们这里来”更符合现代汉语。
- source_word: וְהֵטַבְנוּ לָךְ
  choice: 我们必善待你
  rationale: 自然表达使某人得益、为某人行好事的使役含义。
- source_word: דִּבֶּר טוֹב עַל יִשְׂרָאֵל
  choice: 已经说过要赐福给以色列
  rationale: “说好话/说好事”在本语境指雅威宣告将好处赐给以色列；译作“赐福”自然传达“好处”，但仍以“说过”保留דבר的言说成分。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；正文以音译“雅威”保留其专名性质。
- issue: חֹתֵן מֹשֶׁה所指的姻亲关系
  choice: 摩西的岳父
  alternative: 摩西的姻亲或内兄弟
  rationale: 该词常指岳父，但也能泛指男性姻亲。正文采用常见义，脚注保留关系不完全确定的可能，避免凭叙事协调来消除原文张力。
- issue: דִּבֶּר טוֹב עַל יִשְׂרָאֵל的神学语气
  choice: 已经说过要赐福给以色列
  alternative: 已经论到以色列说了美善的话
  rationale: 语境显示神所说的“好”是给以色列的福分或好处；译文不把它强化为原文未明说的特定盟约术语。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“正要前往”体现即将启程的语境；“一起走吧”保留邀请口吻。正文避免古奥句式，同时保留神名、直接引语和亲属称谓上的原文张力。
