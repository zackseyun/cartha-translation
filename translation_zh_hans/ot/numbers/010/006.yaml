  text: When you blow a second alarm, the camps that are encamped on the south side shall set out; they shall blow an alarm for their departures.
translation:
  language: zh_hans
  text: 你们第二次吹响警报声时，驻扎在南边的各营就要起行；为他们的起行，要吹响警报声[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “警报声”也可译作“号声”或“信号声”；希伯来词 תְּרוּעָה 在这里指指挥各营行动的一种特定号声。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּתְקַעְתֶּם
  choice: 你们……吹出
  rationale: תקע在本段指吹号；保留第二人称复数，并以“……时”自然表达指令的时序。
- source_word: תְּרוּעָה
  choice: 警报声
  rationale: 此处指用于调动营队的一种特定号声；“警报声”既体现其强烈、醒目的信号性质，也避免理解为普通响声。
- source_word: שֵׁנִית
  choice: 第二次
  rationale: 可作“第二次”或“第二个”；现代汉语以“第二次吹出警报声”更自然，同时保留号声次序。
- source_word: וְנָסְעוּ
  choice: 就要起行
  rationale: נסע在营地行程语境中指拔营出发；“起行”庄重、简洁，并与民数记相关行军语境相称。
- source_word: הַמַּחֲנוֹת הַחֹנִים
  choice: 驻扎……的各营
  rationale: 保留复数“各营”及分词所表达的驻扎状态。
- source_word: תֵּימָנָה
  choice: 在南边
  rationale: 上下文所指是营队驻扎的方位；译作位置性的“在南边”，而非运动方向“向南”。
- source_word: תְּרוּעָה יִתְקְעוּ
  choice: 他们……要吹出警报声
  rationale: 希伯来文为第三人称复数主动式，故保留主动表达，不改为无主语被动；重复“警报声”也反映原文。
- source_word: לְמַסְעֵיהֶם
  choice: 每次起行
  rationale: 该复数形式可指各次拔营或行程阶段；“每次起行”在程序性指令中自然地表达号声用于他们各次出发。
