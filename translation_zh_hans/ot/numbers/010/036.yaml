  yaml_path: translation/ot/numbers/010/036.yaml
  text: And when it came to rest[a], he would say, “Return, O Yahweh[b], to the myriads of the thousands of Israel.”
translation:
  language: zh_hans
  text: 约柜安歇时，摩西就会说：“雅威[a]啊，求你回到以色列的千千万万人那里[b]！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “雅威”是希伯来文神名 יהוה（YHWH）的音译，传统上也译作“耶和华”。
    reason: divine_name
  - marker: b
    text: 原文直译为“以色列的万万千千”，把两个大数词叠用，强调以色列人数众多。原文没有明写“到……那里”。
    reason: lexical_and_syntactic_ambiguity
lexical_decisions:
- source_word: וּבְנֻחֹה
  choice: 约柜停下时
  rationale: 介词 בְ 加 נוח 的不定式构成时间从句；阴性单数后缀承接上文的约柜。译文明确补出“约柜”，使单节中文自然清楚。
- source_word: יֹאמַר
  choice: 摩西就会说
  rationale: 未完成式在这里表达每逢约柜停下时的惯常动作；“就会说”保留反复、习惯性的语气。主语摩西由上文可知，中文明确补出以免指代含混。
- source_word: שׁוּבָה
  choice: 求你回到……中
  rationale: 这是 שוב 的祈使形式，带语气词尾 ה，表达向雅威发出的恳求。“回到……中”既保留“返回”的基本意义，也符合现代汉语祷告语气。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文直接呈现四字神名，而不以“主”这一称号替代；“雅威”是现代汉语中较贴近 Yahweh 的音译。
- source_word: רִבְבוֹת אַלְפֵי יִשְׂרָאֵל
  choice: 以色列千千万万的民众
  rationale: רבבות 与 אלפי 连用，叠加两个大数词以强调以色列人数众多。中文“千千万万”自然保留这种强化效果；“民众”说明这里指以色列人，而非抽象数字。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文使用神的专名。正文采用音译“雅威”，避免以称号取代专名；脚注同时说明其希伯来文字形及常见传统译名。
- issue: שׁוּבָה 与后接人数短语的关系
  choice: 求你回到以色列千千万万的民众中
  alternative: 雅威啊，求你回来——以色列有千千万万人
  rationale: 原文没有明写“到”或“中”，语法表达十分凝练。正文采用最符合上下文的方向性理解，但用脚注保留原文结构，避免把补足成分误当作希伯来文明说的词。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“约柜停下时……就会说”呈现叙事中的惯常动作；引语以“求你”表达祈使语气。“千千万万”保留希伯来文大数词叠加的修辞力度，同时避免生硬的逐词排列。
