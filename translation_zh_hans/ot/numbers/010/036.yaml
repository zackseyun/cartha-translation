- from: 约柜停下时，摩西就会说：“雅威[a]啊，求你回到以色列千千万万的民众中[b]！”
  to: 约柜安歇时，摩西就会说：“雅威[a]啊，求你回到以色列的千千万万人那里[b]！”
  rationale: 将“停下”改为“安歇”，更贴近 נוח 在约柜行进后停驻、安放的语境；保留“摩西就会说”的习惯性叙事。将“回到……中”改为“回到……那里”，避免把原文未明说的空间关系译得过实；以“以色列的千千万万人”直接对应原文的双重大数词修辞，而不额外解释为“民众”。
