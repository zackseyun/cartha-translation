  naturalness: “约柜停下时，摩西就会说”自然清楚；不过“以色列千千万万的民众中”略显累赘，也使祈使句的宾语结构在中文中不够凝练。“回到以色列的千千万万人那里”既自然，又不强加“在……中”的空间关系。
  terminology: “雅威”及脚注对 יהוה 的说明适当。“万万千千”虽能体现叠加，却是较陈旧且不够稳定的数词表达；“千千万万人”较合现代汉语，同时保留修辞性大量表达。
