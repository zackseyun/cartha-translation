base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/018.yaml
  text: Then the banner of the camp of Reuben set out by their divisions[b][a], and over its company was Elizur son of Shedeur.
translation:
  language: zh_hans
  text: 接着，流便营的旗帜[a]按着他们的编队[b]起行；统领这营队的是示丢珥的儿子以利蓿。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “旗帜”也可译作“旗号”或“旗标”。
    reason: lexical_alternative
  - marker: b
    text: “编队”也可译作“各队伍”或“各军队”；希伯来语在这里指按组织编组、以军旅式秩序列队的群体。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָסַע
  choice: 接着……起行
  rationale: וְ 推进叙事次序，נסע 在会幕与营队行进的语境中指动身出发；“接着……起行”既表达承接关系，也符合本段庄重而自然的行军叙述。
- source_word: דֶּגֶל
  choice: 旗帜
  rationale: דֶּגֶל 指营队聚集和行进所依据的旗帜或旗号。“旗帜”在现代汉语中清楚易懂，并保留原文的具体意象。
- source_word: מַחֲנֵה רְאוּבֵן
  choice: 吕便营
  rationale: 该组合表示属于吕便的营；“吕便营”简洁自然，并符合上下文各支派营队的称呼。
- source_word: לְצִבְאֹתָם
  choice: 按着他们的各队伍
  rationale: צָבָא 的复数在本段强调有组织、按编制行进的群体，不必专指作战军队。“各队伍”保留复数和编组意味，又避免过度军事化。
- source_word: וְעַל צְבָאוֹ
  choice: 统领这支队伍的是
  rationale: עַל 在这里表达居于其上、负责统领；汉语用“统领……的是”自然地补出原文省略的系词，并保留 צָבָא 单数所指的该营队。
- source_word: אֱלִיצוּר
  choice: 以利蓿
  rationale: 采用现代中文圣经中通行的人名音译。
- source_word: בֶּן שְׁדֵיאוּר
  choice: 示丢珥的儿子
  rationale: 按原文父子关系直译，并采用“示丢珥”的通行音译。
