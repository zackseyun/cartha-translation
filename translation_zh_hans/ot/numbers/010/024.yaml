base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/024.yaml
  text: And over the company of the tribe of the sons of Benjamin was Abidan son of Gideoni[a].
translation:
  language: zh_hans
  text: 便雅悯子孙支派队伍的统领是基多尼的儿子亚比但[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “队伍”也可译作“军队”或“编队”；希伯来语这个词可指按军事方式组织起来的队伍。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/עַל
  choice: ……的统领是
  rationale: 该结构承接前文行军次序，并表明亚比但在这支队伍之上担任领队；汉语用“统领是”自然表达其监督与带领关系，连接作用由上下文体现。
- source_word: צְבָא
  choice: 队伍
  rationale: 此处指按秩序编组、行进的支派队伍，并非狭义的作战军队；“队伍”在现代汉语中自然，也保留有组织编队的含义。
- source_word: מַטֵּה
  choice: 支派
  rationale: 这里是以色列人口统计及行军编制中的支派单位，不是字面的“杖”。
- source_word: בְּנֵי בִנְיָמִן
  choice: 便雅悯子孙
  rationale: 保留希伯来语的宗族表达和本段重复公式，同时符合庄重、清楚的现代中文。
- source_word: אֲבִידָן
  choice: 亚比但
  rationale: 采用中文圣经传统中通行且易于辨认的人名音译。
- source_word: בֶּן גִּדְעוֹנִי
  choice: 基多尼的儿子
  rationale: 自然而直接地表达希伯来语父子身份结构。
theological_decisions: []
