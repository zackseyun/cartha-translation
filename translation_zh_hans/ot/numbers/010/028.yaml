  yaml_path: translation/ot/numbers/010/028.yaml
  text: These were the stages of the sons of Israel by their divisions[c][b][a], and they set out.
translation:
  language: zh_hans
  text: 这些是以色列人按各队伍行进的各次行程[a][b]；他们就出发了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “各次行程”也可译作“各次启程”、“各段路程”或“行进的各站”。
    reason: lexical_alternative
  - marker: b
    text: “各队伍”也可译作“按他们的军队”、“按他们的军旅”或“按他们的编组”。希伯来文指为行进而组织的群体。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  choice: 以上是
  rationale: 复数指示词用于回顾并总结前文；希伯来文没有明示系词，现代汉语用“以上是”自然承接叙事。
- source_word: מַסְעֵי
  choice: 行程
  rationale: מַסָּע 的复数构造形式可指旅程、启程或一段段行进；“行程”既能概括前述各次拔营，也符合本节总结性质，同时以脚注保留“各次启程”的可能。
- source_word: בְנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 字面为“以色列的众子”，在这里指作为整体出行的以色列民；现代汉语“以色列人”清楚自然，且不造成只含男性的误解。
- source_word: לְצִבְאֹתָם
  choice: 按队伍行军
  rationale: צְבָאוֹת 指有组织的群体、军旅或队伍；此处语境重在按编组行进，不必暗示正在作战。“按队伍行军”表达其军事化秩序和旅行方式。
- source_word: וַיִּסָּעוּ
  choice: 他们就出发了
  rationale: נסע 在旷野行程叙事中常指拔营启程；“出发”是自然现代汉语，“就”体现叙事推进。
theological_decisions: []
