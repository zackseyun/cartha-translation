base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/017.yaml
  text: Then the tabernacle was taken down[a], and the sons of Gershon and the sons of Merari set out[b], carrying the tabernacle.
translation:
  language: zh_hans
  text: 帐幕被拆下；革顺的子孙和米拉利的子孙[a]启程，搬运帐幕[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“革顺族人和米拉利族人”。希伯来文直译为“革顺的子孙和米拉利的子孙”。
    reason: lexical_alternative
  - marker: b
    text: 即搬运已被拆下的帐幕；希伯来文再次使用“帐幕”，并未明说“帐幕的各部分”。
    reason: cultural_note
lexical_decisions:
- source_word: וְהוּרַד
  choice: 被拆卸下来
  rationale: 这是ירד的霍法勒形，表达被动、使役之意；在拔营的语境中，指竖立的帐幕被撤下。“被拆卸下来”自然清楚，又不进一步说明具体拆解方式。
- source_word: הַמִּשְׁכָּן
  choice: 帐幕
  rationale: מִשְׁכָּן在《出埃及记》和《民数记》中是以色列圣所帐幕的惯用名称；“帐幕”是现代中文圣经语境中准确、通行的译法。
- source_word: וְנָסְעוּ
  choice: 就出发
  rationale: נסע在行营语境中表示拔营启程。“出发”符合现代汉语；“就”承接帐幕拆卸之后的动作顺序。
- source_word: בְנֵי גֵרְשׁוֹן וּבְנֵי מְרָרִי
  choice: 革顺的子孙和米拉利的子孙
  rationale: 希伯来文两次明确使用“某人的子孙”这一宗族表达；直译保留原文的平行结构，脚注补充按族名称呼的自然译法。
- source_word: נֹשְׂאֵי
  choice: 抬着
  rationale: 该分词说明他们行进时承担的动作和职责。帐幕构件由指定人员搬运，“抬着”在此比泛泛的“带着”更具体自然。
- source_word: הַמִּשְׁכָּן（第二次）
  choice: 帐幕
  rationale: 原文再次使用“帐幕”，没有明说“帐幕的各部分”；正文保留这一重复，不把上下文所暗示的构件直接加入译文。
