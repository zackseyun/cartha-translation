  text: And over the company of the tribe of the sons of Naphtali was Ahira son of Enan[a].
translation:
  language: zh_hans
  text: 拿弗他利子孙支派的队伍首领是以南的儿子亚希拉。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “队伍”或译“军队”“军旅”或“编队”。希伯来语 צְבָא 在这里指营地与行军安排中有组织的支派队伍。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל
  choice: 统领……的，是
  rationale: 承接上文重复出现的行军首领名单。中文以“统领……的，是……”自然表达 עַל 所标明的管辖关系；句首连接词 וְ 可由上下文的连续结构体现，无须机械译出“和”。
- source_word: צְבָא
  choice: 队伍
  rationale: 此处指营地与行军编制中的支派组织单位，带有军事性；“队伍”既符合现代汉语，也避免让“军队”被误解为现代常备军。脚注保留其他可能译法。
- source_word: מַטֵּה
  choice: 支派
  rationale: 这里是以色列的支派单位，并非字面意义的“杖”。
- source_word: בְּנֵי נַפְתָּלִי
  choice: 拿弗他利子孙
  rationale: 保留希伯来文“……之子”的亲属与后裔表达；在支派语境中指拿弗他利的后代。
- source_word: אֲחִירַע
  choice: 亚希拉
  rationale: 按现代中文圣经人名惯例音译该专名。
- source_word: בֶּן עֵינָן
  choice: 以南的儿子
  rationale: 准确表达希伯来文父子称谓结构，并采用自然的现代汉语语序。
