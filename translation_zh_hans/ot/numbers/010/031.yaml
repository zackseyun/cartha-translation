  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יֹּ֕אמֶר אַל נָ֖א תַּעֲזֹ֣ב אֹתָ֑/נוּ כִּ֣י עַל כֵּ֣ן יָדַ֗עְתָּ חֲנֹתֵ֨/נוּ֙ בַּ/מִּדְבָּ֔ר וְ/הָיִ֥יתָ לָּ֖/נוּ לְ/עֵינָֽיִם־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/031.yaml
  text: And he said[a], “Please do not leave us, for you know where we should camp in the wilderness, and you will be eyes for us.”
translation:
  language: zh_hans
  text: 他就说：“求你不要离开我们，因为你知道我们在旷野怎样安营；你要作我们的眼目[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “作我们的眼目”是说凭着他对旷野的熟悉，为众人察看并引路；也可意译为“作我们的向导”。
    reason: 说明希伯来语比喻的含义，同时在正文中保留原文意象。
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 他就说
  rationale: 以现代汉语常用的叙事衔接表达 wayyiqtol，保留承接上文的语气，不额外强化时间先后。
- source_word: אַל נָא
  choice: 求你不要
  rationale: אַל 表示禁止，נָא 加入恳求语气；“求你不要”自然、庄重，并保留摩西恳切挽留的口吻。
- source_word: תַּעֲזֹב אֹתָנוּ
  choice: 离开我们
  rationale: עָזַב 在此行旅语境中指离开；不采用带有更强感情色彩或神学联想的“离弃我们”。
- source_word: כִּי עַל כֵּן
  choice: 因为
  rationale: 该组合在此引出请求的理由；“因为”清楚自然，避免逐词硬译造成生涩。
- source_word: יָדַעְתָּ
  choice: 你知道
  rationale: 完成式表达已经获得且当前仍有效的认识，汉语用现在时“知道”最为贴切。
- source_word: חֲנֹתֵנוּ
  choice: 我们……怎样安营
  rationale: 该词源自动词 חנה，形式可指“我们的安营”或安营方式、地点。“怎样安营”保留一定概括性，不把原文明确收窄为“应该在哪里安营”。
- source_word: בַּמִּדְבָּר
  choice: 在旷野
  rationale: מִדְבָּר 指人烟稀少的荒野地带，并不必然是沙漠；“旷野”准确且符合中文圣经叙事语域。
- source_word: וְהָיִיתָ לָּנוּ לְעֵינָיִם
  choice: 你要作我们的眼目
  rationale: 直译为“你要成为我们的眼睛”。“作我们的眼目”保留希伯来语的鲜明比喻，也能由上下文表达察看和引导之意；不在正文中直接释作“向导”。
theological_decisions:
- issue: 人的引导与本章中上帝借云彩引导以色列人的关系
  choice: 按原文保留摩西请对方“作我们的眼目”的陈述，不加解释
  alternative: 将其弱化为仅仅提供当地信息，或加注说明不涉及属灵引导
  rationale: 原文让神的引导与人的旷野经验并存，并未解释二者关系；译文不应替原文消除这种张力。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“求你不要”保留恳求语气；分号呈现理由与预期作用之间的结构。“眼目”略带庄重色彩，但在现代读者可理解的范围内，并忠实保留原文比喻。脚注标记置于其实际解释的短语之后。
