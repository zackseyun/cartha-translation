base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/013.yaml
  text: So they set out for the first time at the command of Yahweh through Moses[a].
translation:
  language: zh_hans
  text: 他们就首次起行，遵照雅威借着摩西[a]所下的命令。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“借摩西的手”，这是表示通过某人作中介或代理的习语。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: 他们就……起行
  rationale: נסע在行程叙事中指拔营出发；“起行”简洁自然，也保留开始行进的意味。
- source_word: בָּרִאשֹׁנָה
  choice: 首次
  rationale: 这个副词形式可指“起初”或“第一次”；本节描述以色列人按编队首次从西奈起行，因此译作“首次”。
- source_word: עַל פִּי
  choice: 遵照……所下的命令
  rationale: 该短语字面为“按……的口”，在此是服从指令的习语；“遵照……所下的命令”准确传达其功能意义。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以常见的现代汉语音译呈现四字神名，保留其作为专名的性质，不以称号替代。
- source_word: בְּיַד מֹשֶׁה
  choice: 借摩西
  rationale: 字面为“借摩西的手”，是表示代理或中介的习语；“借摩西”在现代汉语中自然，并保留摩西传达命令的角色。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；译作“雅威”可将其作为神的专名呈现，而不以“主”等称号替代。
- issue: 摩西在命令传达中的角色
  choice: 借摩西所下的命令
  alternative: 由摩西下令
  rationale: 原文将命令归于雅威，同时以“借摩西的手”表明摩西是传达者或代理人；本译法避免把命令的最终来源改成摩西。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“首次起行”对应本次从西奈开始的首次行程；句式明确保留雅威为命令的来源、摩西为传达者。
