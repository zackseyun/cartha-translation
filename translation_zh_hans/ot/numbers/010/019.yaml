  text: And over the company of the tribe of the sons of Simeon was Shelumiel son of Zurishaddai[a].
translation:
  language: zh_hans
  text: 西缅子孙支派的队伍[a]由苏利沙代的儿子示路蔑统领。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “队伍”也可译作“军队”或“军旅”；希伯来语为 צְבָא，此处指按支派编组的队伍。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל
  choice: ……的统领是
  rationale: 在行军次序的语境中，עַל 表示某人被立在队伍之上负责统领；汉语用“统领是”自然表达这种关系。句首连接词 וְ 承接前文，本节单独呈现时不必机械译作“并且”。
- source_word: צְבָא
  choice: 队伍
  rationale: 此处指按支派编组、参与行军的有组织群体；“队伍”既保留组织性，又避免把语境过度军事化。[a]
- source_word: מַטֵּה
  choice: 支派
  rationale: 在以色列安营和行军次序的语境中，מַטֵּה 明确指支派单位。
- source_word: בְּנֵי שִׁמְעוֹן
  choice: 西缅支派
  rationale: 原文直译为“西缅的众子”，在此是惯用的支派称谓；现代汉语以“西缅支派”表达更自然，也不误解为仅指西缅的亲生儿子。
- source_word: שְׁלֻמִיאֵל
  choice: 示路蔑
  rationale: 采用现代中文圣经读者较熟悉的传统音译。
- source_word: בֶּן
  choice: ……的儿子
  rationale: 这里是直接的父子谱系称谓，照实译出。
- source_word: צוּרִי שַׁדָּי
  choice: 苏利沙代
  rationale: 采用现代中文圣经读者较熟悉的传统音译，并按一个人名处理。
