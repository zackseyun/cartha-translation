base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/022.yaml
  text: Then the banner of the camp of the sons of Ephraim set out by their divisions[b][a], and over its division was Elishama son of Ammihud.
translation:
  language: zh_hans
  text: 随后，以法莲子孙营的旗号[a]按着他们的编队[b]起行；统领这支编队的是亚米忽的儿子以利沙玛。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “旗号”也可译作“旗帜”或“军旗”。希伯来语指营队行军时归属的支派旗号，也可转指该旗号下的编队。
    reason: lexical_alternative
  - marker: b
    text: “按着他们的编队”也可译作“按着他们的军旅”或“按着他们的队伍”。希伯来语指营中按军事形式组织的行军单位。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָסַע
  choice: 随后……出发
  rationale: וְ加完成式在行军叙事中推进事件次序；“随后……出发”自然表达继前一队之后启程。
- source_word: דֶּגֶל מַחֲנֵה
  choice: 营的旗队
  rationale: דֶּגֶל既指辨识营队的旗号，也可转指归属该旗号的编队；结合מַחֲנֵה译作“营的旗队”，兼顾旗号意象与实际出发的群体。
- source_word: בְנֵי אֶפְרַיִם
  choice: 以法莲子孙
  rationale: 保留希伯来语标准支派称谓的亲属与后裔表达，且符合中文圣经语体。
- source_word: לְצִבְאֹתָם
  choice: 按着他们的队伍
  rationale: צָבָא在本段指按秩序编组的行军单位，并不必然强调作战；“队伍”比“军队”更准确且自然。
- source_word: וְעַל צְבָאוֹ
  choice: 率领这一队的是
  rationale: עַל表达居于其上、负责统领的关系；צְבָאוֹ为单数，回指以法莲这一编队，译作“这一队”避免生硬的代词。
- source_word: אֱלִישָׁמָע בֶּן עַמִּיהוּד
  choice: 亚米忽的儿子以利沙玛
  rationale: 按现代中文常用人名音译及自然的父子关系句式表达。
theological_decisions: []
