- from: 随后，以法莲子孙营的旗队[a]按着他们的队伍[b]出发；率领这一队的是亚米忽的儿子以利沙玛。
  to: 随后，以法莲子孙营的旗号[a]按着他们的编队[b]起行；统领这支编队的是亚米忽的儿子以利沙玛。
  rationale: 修订以“旗号”直接对应דֶּגֶל，并在脚注保留其可代指旗下编队的语义范围；以“编队”一致表达复数的לְצִבְאֹתָם及后文单数的צְבָאוֹ，同时避免把本处行军组织过度解释为战斗部队。
