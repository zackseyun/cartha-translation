  text: עֲשֵׂ֣ה לְ/ךָ֗ שְׁתֵּי֙ חֲצֽוֹצְרֹ֣ת כֶּ֔סֶף מִקְשָׁ֖ה תַּעֲשֶׂ֣ה אֹתָ֑/ם וְ/הָי֤וּ לְ/ךָ֙ לְ/מִקְרָ֣א הָֽ/עֵדָ֔ה וּ/לְ/מַסַּ֖ע אֶת הַֽ/מַּחֲנֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/002.yaml
  text: Make for yourself two silver trumpets[a]; you shall make them of hammered work[b], and they shall be for you for summoning the congregation and for setting out the camps.
translation:
  language: zh_hans
  text: 你要为自己做两支银制号筒；要把它们锤打制成。它们要供你用来召集会众，并使各营起行。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֲשֵׂה לְךָ
  choice: 你要为自己做
  rationale: 保留命令语气和 לְךָ 所表达的“为你使用、由你掌管”之意，同时符合现代汉语表达。
- source_word: שְׁתֵּי חֲצֹצְרֹת כֶּסֶף
  choice: 两支银号
  rationale: חֲצֹצְרָה 指金属号，不是弯曲的羊角号；“银号”简洁地表达材质和器物类别。“支”是现代汉语中适合号类器物的量词。
- source_word: מִקְשָׁה תַּעֲשֶׂה אֹתָם
  choice: 要把它们锤打成形
  rationale: מִקְשָׁה 强调以捶打金属的工艺制作；此译保留制作方式，又避免把词义过度限定为“一整块制成”。
- source_word: וְהָיוּ לְךָ
  choice: 它们要供你
  rationale: 这里侧重用途而不只是所有权；“供你”自然引出后面的两项功用。
- source_word: לְמִקְרָא הָעֵדָה
  choice: 召集会众
  rationale: מִקְרָא 在此表示召唤、召集，הָעֵדָה 指以色列会众；译文简洁保留其功能意义。
- source_word: וּלְמַסַּע אֶת הַמַּחֲנוֹת
  choice: 并使各营起行
  rationale: מַסַּע 在旷野行程语境中指启程、起行；宾语标记 אֶת 表明各营是被号声促使起行的对象。“各营”也保留了希伯来文复数。
