  text: When they blow them[a], all the congregation shall assemble before you at the entrance of the tent of meeting.
translation:
  language: zh_hans
  text: 吹响这两支号时[a]，全会众都要到会幕门口聚集到你那里。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或较形式对应地译作：“他们要吹响这两支号，全会众就要聚集到你那里。”
    reason: 保留וְתָקְעוּ在形式上可译为并列将来陈述／指令，以及上下句相承关系的另一种表达。
lexical_decisions:
- source_word: וְתָקְעוּ בָהֵן
  choice: 吹响两支号时
  rationale: תקע在号筒语境中意为“吹响”；בָהֵן的阴性复数指上节的两支银号。此处连续指令具有时间或条件意味，译作“……时”符合现代汉语，也保留号声发出后会众聚集的程序关系。
- source_word: וְנוֹעֲדוּ
  choice: 都要聚集
  rationale: יעד的尼法勒形式在这里表示因召集而会合；“聚集”自然表达全体会众响应号声集合。
- source_word: אֵלֶיךָ
  choice: 到你那里
  rationale: 原文直译为“向你／到你那里”，所指对象是摩西；采用“到你那里”保留方向关系，不把它解释得更具体。
- source_word: כָּל הָעֵדָה
  choice: 全会众
  rationale: עֵדָה指以色列共同体；“全会众”简洁、庄重，并保留其群体含义。
- source_word: פֶּתַח
  choice: 门口
  rationale: פֶּתַח指入口或开口；对帐幕而言，“门口”是自然清楚的现代汉语。
- source_word: אֹהֶל מוֹעֵד
  choice: 会幕
  rationale: 该固定词组字面涉及“相会的帐幕”；“会幕”是现代中文圣经语境中清楚而简练的通行名称。
theological_decisions: []
