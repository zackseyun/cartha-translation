  yaml_path: translation/ot/numbers/010/034.yaml
  text: And the cloud of Yahweh was over them by day when they set out from the camp[a].
translation:
  language: zh_hans
  text: 他们从营地出发时，雅威的云彩白天在他们上方[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“白天在他们之上。”
    reason: 保留עֲלֵיהֶם中介词עַל可译为“在……上方”或“在……之上”的词义选择。
lexical_decisions:
- source_word: וַעֲנַן יְהוָה
  choice: 雅威的云彩
  rationale: עָנָן意为“云彩”，与神名构成所属关系；以“雅威”音译四字神名יְהוָה，保留其作为专名的性质。句首וַ在此延续上下文，中文借语序和叙事衔接自然体现，不另加生硬的“并且”或“而”。
- source_word: עֲלֵיהֶם
  choice: 在他们上方
  rationale: 介词עַל带第三人称复数词尾，表达云彩位于他们之上；“在他们上方”清楚保留空间和庇护性的意象，同时不额外解释其神学功能。
- source_word: יוֹמָם
  choice: 白天
  rationale: יוֹמָם是表示时间的副词，意为“白天”或“在日间”；“白天”简洁自然。
- source_word: בְּנָסְעָם
  choice: 他们……出发时
  rationale: נסע的不定式构造配בְּ在此表达时间，指拔营启程；“出发时”比泛指持续行程的“行进时”更贴近该动作。
- source_word: מִן־הַמַּחֲנֶה
  choice: 从营地
  rationale: מַחֲנֶה指营地或营盘，带定冠词；中文语境中“从营地”已可自然指向以色列人的营地，无须机械加入“那”。
theological_decisions:
- issue: 四字神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用神的专名；“雅威”较贴近通常重构的读音，并避免以头衔替代专名。
- issue: 云彩与百姓的位置关系
  choice: 在他们上方
  alternative: 在他们身上
  rationale: עַל可表示“在……上方”或“在……之上/身上”。正文采用符合云彩空间位置的自然表达，同时用脚注保留另一种较贴近介词表面的译法，不把庇护、引导等神学含义直接增译进正文。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。将时间从句前置，使中文自然流畅；保留“云彩”这一旷野叙事中的具体意象，不增添“遮盖”“保护”或“引导”等解释性措辞。
