  - severity: low
    issue: 正文中两个“之间”短语的句法连接稍不平行。
    rationale: 原文两次使用בֵּין，构成平行的法律关系范围。重复“之间的事”可使汉语句法更完整，且不增加释义。
  revised_text: 这些是耶和华吩咐摩西的律例，关于丈夫和妻子之间的事，以及父亲和处于少女时期、住在父家的女儿之间的事。[a]
  revised_footnotes:
