revisions:
- from: 这些是耶和华吩咐摩西的律例，涉及丈夫和妻子之间，以及父亲和仍年幼、住在父家的女儿之间的事。[a]
  to: 这些是耶和华吩咐摩西的律例，关于丈夫和妻子之间的事，以及父亲和处于少女时期、住在父家的女儿之间的事。[a]
  rationale: 修订仅消除“年幼”可能造成的年龄窄化，并使两组关系短语在现代汉语中更平行。正文保留语境化的“丈夫”，脚注则以“男人和他的妻子”展示אִישׁ的较字面表达；未将父家居住情形额外解释为任何特定法律或神学主张。
