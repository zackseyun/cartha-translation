base_translation:
  language: en
  yaml_path: translation/ot/numbers/030/017.yaml
  text: These are the statutes that Yahweh commanded Moses concerning a man and his wife[b][a], and concerning a father and his daughter in her youth in her father's house.
translation:
  language: zh_hans
  text: 这些是耶和华吩咐摩西的律例，关于丈夫和妻子之间的事，以及父亲和处于少女时期、住在父家的女儿之间的事。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“在男人和他的妻子之间，在父亲和他的女儿之间——她在父家、处于少女时期。”
    reason: 说明原文两次使用“在……之间”的平行结构，并保留末尾“在父家”和“处于少女时期”两个紧凑相连的限定。
lexical_decisions:
- source_word: אֵלֶּה הַחֻקִּים
  choice: 这些是……律例
  rationale: 保留无动词总结句的指示与法律语体；现代汉语自然补出“是”。“律例”表达规定、法令之意。
- source_word: אֲשֶׁר צִוָּה יְהוָה אֶת־מֹשֶׁה
  choice: 耶和华吩咐摩西的
  rationale: 按希伯来语关系从句表达；צוה以摩西为受命者，汉语用“吩咐摩西”自然准确。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代简体中文圣经语境中对四字神名最通行且庄重的专名译法，不以称号替代。
- source_word: בֵּין אִישׁ לְאִשְׁתּוֹ
  choice: 涉及丈夫和妻子之间
  rationale: אִישׁ在与“他的妻子”配对时依语境译作“丈夫”；בין保留关系双方“之间”的含义，同时用“涉及”使法律总结句自然。
- source_word: בֵּין אָב לְבִתּוֹ
  choice: 以及父亲和……女儿之间
  rationale: 与前一בין短语保持平行，准确保留父女这一有性别标记的法律关系。
- source_word: בִּנְעֻרֶיהָ בֵּית אָבִיהָ
  choice: 仍年幼、住在父家的
  rationale: 将两个相邻成分都明确修饰“女儿”；“仍年幼”保留其青春时期的时间意义，“住在父家”表达原文的居住处境，不额外加入“受父亲权柄管辖”等解释。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。中文正文保留为专名；“耶和华”是现代汉语读者最熟悉的规范形式，并未用“主”这一称号替代。
- issue: אִישׁ在婚姻关系中的表达
  choice: 丈夫
  alternative: 男人
  rationale: “他的妻子”使婚姻关系明确，译作“丈夫”在汉语中更自然；仍保留原文明确的性别和关系，不作泛化。
- issue: “年幼”与“住在父家”的关系
  choice: 并列保留时间与居住限定
  alternative: 将“年幼”解释为完全等同于住在父家期间
  rationale: 原文同时出现בִּנְעֻרֶיהָ与בֵּית אָבִיהָ。正文保留两项限定，避免把文化背景解释直接等同于词义，从而保存文本可能存在的法律与语义张力。
translation_notes:
  register: 采用自然、庄重的现代标准汉语和法律总结语体。“律例”“吩咐”保持经文庄严感，但避免生僻古奥表达。正文仅设一个脚注，标记[a]已在正文出现。
