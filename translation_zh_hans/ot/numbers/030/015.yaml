base_translation:
  language: en
  yaml_path: translation/ot/numbers/030/015.yaml
  text: But if her husband indeed keeps silent from day to day[a], then he confirms all her vows or all her obligations that are upon her; he has confirmed them, because he kept silent on the day he heard.
translation:
  language: zh_hans
  text: 但若她的丈夫一天又一天始终对她保持沉默，他就使她所许的一切愿，或她身上一切约束[a]，继续有效；他使这些继续有效，因为在听见的那一天，他对她保持沉默。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“她一切有约束力的承诺”。原文所用的词指立誓者所作、对其本人具有约束力的承诺。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחֲרֵשׁ יַחֲרִישׁ
  choice: 始终……保持沉默
  rationale: 以“始终”体现不定式绝对式与限定动词连用所产生的强调，并保留本段法律语境中“不提出异议”的含义。
- source_word: אִישָׁהּ
  choice: 她丈夫
  rationale: 婚姻法规语境明确指女子的丈夫；这是现代汉语中自然准确的表达。
- source_word: מִיּוֹם אֶל יוֹם
  choice: 一天又一天
  rationale: 保留原文连续多日保持沉默的时间含义，同时符合现代汉语习惯。
- source_word: וְהֵקִים
  choice: 就是认可了
  rationale: קום的使役形在此具有法律效力，指使所许之愿继续成立；“认可”清楚表达丈夫不反对所产生的确认效力。
- source_word: נְדָרֶיהָ
  choice: 她所许的一切愿
  rationale: “许愿”是 נדר 在民数记祭祀与法律语境中的常用、准确表达。
- source_word: אֱסָרֶיהָ
  choice: 她……一切约束
  rationale: 该词源自“捆绑、约束”，在本章指立誓者加给自己的约束性承诺；“约束”保留原文意象及法律约束力。
- source_word: אֲשֶׁר עָלֶיהָ
  choice: 加在自己身上的
  rationale: 自然呈现原文“在她身上”的空间隐喻，并说明这些约束由她承担。
- source_word: הֵקִים אֹתָם
  choice: 他已经认可这些
  rationale: “已经”体现完成式所表达的既成法律结果，并以“这些”统摄前述愿与约束。
- source_word: כִּי
  choice: 因为
  rationale: 按因果意义理解，说明这些承诺获得认可的依据是丈夫听见时保持沉默。
- source_word: הֶחֱרִשׁ לָהּ
  choice: 对她保持了沉默
  rationale: 保留“向她／对她沉默”的关系成分，并与前句重复的法律主题相呼应。
- source_word: בְּיוֹם שָׁמְעוֹ
  choice: 他听见的那天
  rationale: 贴近原文的时间公式，强调丈夫作出反应的法定时点。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。重复“对她保持沉默”，以保留原文在法律论述中刻意重复的关键词；用“认可”表达丈夫沉默使誓愿继续有效的法律结果，而不加入额外的宗派性解释。
