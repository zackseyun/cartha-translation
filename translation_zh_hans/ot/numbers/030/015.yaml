revisions:
- from: 但她丈夫若一天又一天始终对她保持沉默，就是认可了她所许的一切愿和她加在自己身上的一切约束[a]；他已经认可这些，因为他听见的那天对她保持了沉默。
  to: 但若她的丈夫一天又一天始终对她保持沉默，他就使她所许的一切愿，或她身上一切约束[a]，继续有效；他使这些继续有效，因为在听见的那一天，他对她保持沉默。
  rationale: 修订保留原文“或”的分类结构，并以“使……继续有效”表达该处希伯来法律语境中“使誓愿成立”的含义。后半句保留完成式所总结的既成法律效力；“对她保持沉默”也保留了原文重复出现的关系成分。
