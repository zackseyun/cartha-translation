  text: וַ/יֹּ֥אמֶר מֹשֶׁ֖ה אֶל בְּנֵ֣י יִשְׂרָאֵ֑ל כְּ/כֹ֛ל אֲשֶׁר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/030/001.yaml
  text: Moses spoke to the sons of Israel according to all that Yahweh had commanded Moses[a].
translation:
  language: zh_hans
  text: 摩西把雅威吩咐他的一切都告诉了以色列人。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 告诉了
  rationale: 该动词本义为“说”，但本句没有直接引语，而是概括摩西向以色列人传达命令；“告诉了”在现代汉语中自然地表达这一言语行为。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 希伯来语字面为“以色列的众子”，但这是指以色列民族的固定称谓；现代汉语用“以色列人”准确、自然，也不会被误解为只包括男性。
- source_word: כְּכֹל אֲשֶׁר
  choice: 把……的一切都
  rationale: 前缀 כְּ 可表示依照或符合；结合“说”的语义，本句是在说明摩西所传达的内容完全符合耶和华的吩咐。“一切都”保留了完整性，汉语宾语结构使句子流畅。
- source_word: צִוָּה
  choice: 吩咐
  rationale: “吩咐”适合上对下发出指示的语境，庄重而通俗；汉语不必用形态变化标示先于“告诉”的动作，语境已清楚呈现次序。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的神名“耶和华”，以专名呈现四字神名，而不是以“主”这一称号替代。
- source_word: אֶת מֹשֶׁה
  choice: 他
  rationale: 直译为“摩西”虽可行，但同句重复姓名在现代汉语中生硬；代词“他”所指明确，忠实表达摩西是受命者。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用四字神名，应译作专名而非“主”。“耶和华”是现代中文语境中最通行、最易识别的形式；“雅威”更接近常见的学术拟音，但中文读者接受度较低。
- issue: 盟约性民族称谓 בְּנֵי יִשְׂרָאֵל 的范围
  choice: 以色列人
  alternative: 以色列的众子
  rationale: 该短语虽为阳性复数，实际是全民族的固定称谓。译作“以色列人”保留群体指称，也避免中文“众子”被理解为只指男性后裔；此处不由语法性别推导神学上的性别限制。
translation_notes:
  register: 采用现代、庄重而通顺的叙事语体。调整为“把”字句，以自然汉语表达摩西完整传达耶和华命令的意思；不加脚注，因为主要词义与句法在正文中已能清楚呈现。
