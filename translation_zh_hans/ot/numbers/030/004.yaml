base_translation:
  language: en
  yaml_path: translation/ot/numbers/030/004.yaml
  text: And if a woman vows a vow to Yahweh[a], and binds herself by an obligation in her father's house in her youth[b],
translation:
  language: zh_hans
  text: 女人若在父亲家中、正当年轻的时候，向雅威许愿[a]，并以约束性的誓约约束自己[b]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“许一个愿”，以同源的动词和名词强调正式许愿的行为。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“以约束之物约束自己”。原文用相关的动词和名词，表示使自己承担一项有约束力的誓约。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִשָּׁה כִּי
  choice: 女人若
  rationale: 这里引出律法中的一种情形；“若”自然表达כִּי在此处的条件意义，句首的וְ无需机械译出。
- source_word: תִדֹּר נֶדֶר
  choice: 许愿
  rationale: 希伯来语采用同源动词和名词，强调正式许愿的行为；现代汉语以“许愿”表达最自然，并用脚注说明原文形式。
- source_word: לַיהוָה
  choice: 向雅威
  rationale: 介词ל表示誓愿所指向的对象；“雅威”直接音译四字神名יהוה。
- source_word: וְאָסְרָה אִסָּר
  choice: 并以誓约约束自己
  rationale: 动词אָסַר与相关名词אִסָּר构成同源表达，表示使自己承担有约束力的义务；此译法保留其反身含义，也不把它与前面的נֶדֶר完全混同。
- source_word: בְּבֵית אָבִיהָ
  choice: 住在父亲家里
  rationale: 原文直指父亲的家；加“住”符合现代汉语习惯，同时保留家庭处境。
- source_word: בִּנְעֻרֶיהָ
  choice: 那时她还年轻
  rationale: 按字面表达其青年时期，不在正文中进一步明说未婚或父亲的法律权柄，以免加入原文未明说的解释。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；采用“雅威”以保留其作为专名的性质，而不以称号替代。
- issue: בִּנְעֻרֶיהָ是否明确译为未婚身份
  choice: 译作“还年轻”
  alternative: 译作“尚未出嫁”
  rationale: 上下文可能涉及女子仍在父家的法律身份，但该词本身表示青年时期；正文保留原文措辞，不把语境推论写成明说内容。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语，保留律法条文的条件句式。经文在本节末仍未完句，因此以逗号收束，与后续条款衔接。
