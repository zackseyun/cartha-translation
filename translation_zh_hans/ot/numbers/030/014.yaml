revisions:
- from: 凡她所许的愿，以及为刻苦己心[a]而起的每一个约束性誓言，她丈夫都可以使它生效，也可以把它废除。
  to: 她所许的一切愿，以及为刻苦己心所起的一切约束性誓言，她丈夫可以使其生效，或将其废除。
  rationale: 修订仅明确原文“或”的逻辑关系，并校正脚注对 נֶפֶשׁ 在固定习语中的字面说明；不改变经文所述的法律意义、语气或上下文所指的女性与其丈夫。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T04:56:57Z'
review_pass:
  verdict: revise
  source_fidelity: 译文准确呈现了 כָּל...וְכָל 的周遍性、נֵדֶר（许愿）、שְׁבֻעַת אִסָּר（具约束力的誓言）、丈夫，以及“使之成立／废除”的法律语义。惟原文以 וְ...（此处为“或”）并列丈夫两种相反的处置，中文宜明说“或”，避免“也可以”带来可同时进行两项行动的表述印象。
  naturalness: 整体庄重清楚，适合律例语境。“刻苦己心”是可接受的传统经文语汇；将句子调整为“可以……，或……”后，逻辑关系和现代汉语表达更顺畅。
  terminology: “约束性誓言”“使其生效”“废除”恰当。脚注中把 נֶפֶשׁ 直译为“性命”不够贴合此固定习语；宜说明其字面意象为“使自己受苦”，同时保留“克制自己／使自己谦卑”等习语性理解。
  issues:
  - severity: medium
    issue: “也可以”未明确表达原文两项处置之间的“或”关系。
    rationale: יְקִימֶנּוּ וְאִישָׁהּ יְפֵרֶנּוּ 在此列出丈夫可作的相反法律处置。中文“可以……也可以……”虽可表示选择，仍可能弱化互斥的“或”关系；改为“可以……，或……”更精确。
  - severity: low
    issue: 脚注将习语的字面表达释为“使自己的性命受苦”。
    rationale: 在 לְעַנֹּת נָפֶשׁ 这个习语中，נֶפֶשׁ 指向人自身，不能自然地等同于现代汉语“性命”。“使自己受苦”更能保留字面意象并避免不必要的语义偏移。
  revised_text: 她所许的一切愿，以及为刻苦己心所起的一切约束性誓言，她丈夫可以使其生效，或将其废除。
  revised_footnotes:
  - marker: a
    text: 或译“克制自己”或“使自己谦卑”。希伯来语这一习语的字面意象是“使自己受苦”。
    reason: 保留 לְעַנֹּת נָפֶשׁ 的字面意象，并说明其可指自我克制或谦卑等习语性含义。
  revision_rationale: 修订仅明确原文“或”的逻辑关系，并校正脚注对 נֶפֶשׁ 在固定习语中的字面说明；不改变经文所述的法律意义、语气或上下文所指的女性与其丈夫。
