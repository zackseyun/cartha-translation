  text: כָּל נֵ֛דֶר וְ/כָל שְׁבֻעַ֥ת אִסָּ֖ר לְ/עַנֹּ֣ת נָ֑פֶשׁ אִישָׁ֥/הּ יְקִימֶ֖/נּוּ וְ/אִישָׁ֥/הּ יְפֵרֶֽ/נּוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/030/014.yaml
  text: Every vow and every binding oath to afflict the soul—her husband may confirm it[a], or her husband may annul it.
translation:
  language: zh_hans
  text: 她所许的一切愿，以及为刻苦己心所起的一切约束性誓言，她丈夫可以使其生效，或将其废除。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כָּל נֵדֶר
  choice: 凡她所许的愿
  rationale: כָּל 表示涵盖全部此类事项；נֵדֶר 在民数记三十章的宗教法律语境中指向上帝所许的愿。中文补出“她所许的”，由上下文及“她丈夫”明确其所属，使句意自然。
- source_word: וְכָל שְׁבֻעַת אִסָּר
  choice: 以及……每一个约束性誓言
  rationale: שְׁבֻעָה 是“誓言”，אִסָּר 表明其约束、限制的效力；“约束性誓言”兼顾誓言的正式性和自我约束的含义。重复译出“每一个”，保留两个 כָּל 的周遍意味。
- source_word: לְעַנֹּת נָפֶשׁ
  choice: 为刻苦己心
  rationale: 这是表示自我克制或自我苦待的希伯来语习语，常与禁食等行为有关。“刻苦己心”既保留原文的受苦色彩，也避免把 נֶפֶשׁ 狭义化为与身体分离的“灵魂”；其他可能译法收入脚注。
- source_word: אִישָׁהּ
  choice: 她丈夫
  rationale: 在本段婚姻法律语境中，אִישׁ 加第三人称阴性单数后缀明确指“她丈夫”。
- source_word: יְקִימֶנּוּ
  choice: 可以使它生效
  rationale: קום 的使役式在誓愿法规中意为使誓愿继续成立、具有效力；“使它生效”用现代中文清楚表达其法律作用。
- source_word: יְפֵרֶנּוּ
  choice: 可以把它废除
  rationale: פרר 的使役式在此表示使誓愿失效。“废除”准确传达法律上的取消效力。
theological_decisions:
- issue: 丈夫对誓愿所采取行动的语气
  choice: 译作“可以……也可以……”
  alternative: “要使……生效，也要将……废除”
  rationale: 两个未完成式在这段法律条文中表达丈夫可采取的两种处置，并非命令他同时执行相反行动；“可以”清楚呈现这种法律权限，同时不扩张其范围。
translation_notes:
  register: 采用现代、庄重而易懂的法律叙述语体。“约束性誓言”“使它生效”“把它废除”明确呈现条文的法律效力；“刻苦己心”保留经文的宗教语感，并以脚注解释其语义范围。
