base_translation:
  language: en
  yaml_path: translation/ot/numbers/030/008.yaml
  text: And if her husband hears of it on the day he hears[a], and is silent toward her, then her vows shall stand[b], and her binding obligations that she bound on herself shall stand.
translation:
  language: zh_hans
  text: 如果她丈夫听见这事，当天却对她默不作声[a]，她所许的愿仍然有效；她加在自己身上的约束[b]也仍然有效。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“却没有对她说什么。”希伯来语“对她默不作声”在这里表示丈夫没有提出反对，因此她的誓愿继续有效。
    reason: lexical_alternative
  - marker: b
    text: “约束”也可译作“禁戒”或“义务”，指她以誓言加在自己身上的、有约束力的承诺。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁמַע
  choice: 如果……听见了
  rationale: 在这段律法条文的条件句序列中，连词加完成式引出一种假设情形；用“如果”能在现代汉语中清楚表达这一法律条件。
- source_word: אִישָׁהּ
  choice: 她丈夫
  rationale: 婚姻法规的上下文明确表明 אִישׁ 加第三人称阴性单数后缀是“她丈夫”，而不是泛指“她的男人”。
- source_word: בְּיוֹם שָׁמְעוֹ
  choice: 在听见的那天
  rationale: 保留原文强调的法定时限，即丈夫得知此事的当天。
- source_word: וְהֶחֱרִישׁ לָהּ
  choice: 却对她默不作声
  rationale: 贴近希伯来语“向她沉默”的表达；在本法律语境中，意思是不提出反对。
- source_word: וְקָמוּ / יָקֻמוּ
  choice: 就仍然有效／也仍然有效
  rationale: קום 在这里表示誓愿继续成立、具有约束力。中文以“仍然有效”自然传达法律效力，并在两处重复以保留原文的强调。
- source_word: נְדָרֶיהָ
  choice: 她所许的愿
  rationale: נדר 是本章关于向上帝许愿的标准法律用语；“所许的愿”符合现代中文圣经语体。
- source_word: וֶאֱסָרֶהָ
  choice: 她……所承担的约束
  rationale: 名词 אֱסָר 指人以誓言加在自己身上的禁戒或约束；“约束”保留词根的捆绑意象，也不把其范围不必要地限定为某一种义务。
- source_word: אֲשֶׁר אָסְרָה עַל נַפְשָׁהּ
  choice: 她约束自己所承担的
  rationale: 表达原文“加在自己身上的约束”这一自我承担的义务，同时调整语序，使现代汉语自然清楚。
- source_word: נַפְשָׁהּ
  choice: 自己
  rationale: נֶפֶשׁ 在此作反身意义，指她本人，并非专指非物质的“灵魂”。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的法律叙述语体。“仍然有效”比直译“站立”更符合现代汉语，同时准确传达誓愿在法律上继续成立的含义。正文保留“听见的那天”的时间强调，并以脚注说明“默不作声”和“约束”的希伯来语含义。
