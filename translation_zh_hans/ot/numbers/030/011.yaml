  yaml_path: translation/ot/numbers/030/011.yaml
  text: And if in her husband's house she made a vow[a], or bound herself by an obligation with an oath,
translation:
  language: zh_hans
  text: 如果她在丈夫家里许了愿，或以誓言使自己受约束[a]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“以誓言把约束加在自己身上。”
    reason: 保留אָסְרָה אִסָּר的同根动词—名词结构，以及עַל נַפְשָׁהּ“加在自己身上”的原文措辞。
lexical_decisions:
- source_word: וְאִם
  choice: 如果
  rationale: 本节继续列举律法案例；现代汉语用“如果”自然引出条件，前后衔接可由上下文体现，无须生硬加上“并且”。
- source_word: בֵּית אִישָׁהּ
  choice: 在丈夫家里
  rationale: 保留原文“在她丈夫的家中”这一地点兼家庭处境；汉语省略已由语境明确的“她的”更自然。
- source_word: נָדָרָה
  choice: 许了愿
  rationale: נדר在此指作出具有约束力的许愿；“许愿”是现代汉语中清楚、庄重且符合律法语境的表达。
- source_word: אוֹ
  choice: 或
  rationale: 保留原文在两种相关行为之间使用的析取连接。
- source_word: אָסְרָה אִסָּר עַל נַפְשָׁהּ
  choice: 使自己受约束
  rationale: 该同根动词—名词结构表示把具有约束力的限制加在自己身上。正文以自然汉语表达其自我约束的法律含义，并用脚注保留原文的同根重复形式。
- source_word: בִּשְׁבֻעָה
  choice: 以誓言
  rationale: 介词可表示手段；“以誓言”保留此义，也体现该约束具有正式起誓的性质。
