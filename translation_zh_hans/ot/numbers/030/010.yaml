- from: 寡妇或被休的女人所许的愿，以及她约束自己的一切，都对她有效[a]。
  to: 寡妇或离婚妇人所许的愿，以及她使自己受约束的一切，都仍然对她有效[a]。
  rationale: 修订仅改善现代汉语的自然度并避免“被休”可能附加的狭义社会含义；保留原文对誓愿和一切自我约束之义务均成立、且落在该妇人身上的表述。脚注锚点及替代译法均予保留。
