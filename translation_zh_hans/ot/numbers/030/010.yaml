review_pass:
  verdict: revise
  source_fidelity: 译文总体传达了寡妇或离婚妇人所作誓愿及其自我承担之约束仍具效力的法律意思。惟“被休”虽可反映被动形态，却在现代标准汉语中偏古雅，并可能带入比原文更强的单方弃置意味；此处以中性的“离婚妇人”更准确自然。
  naturalness: “对她有效”自然，但“她约束自己的一切”在现代汉语中略显生硬，且容易理解为她约束他人或泛指自律行为。改为“她使自己受约束的一切”能清楚保留反身的法律义务含义。
  terminology: “誓愿”适合此律法／敬拜语境中的 נֵדֶר；“离婚妇人”对应 גְרוּשָׁה，避免将现代法律程序或特定离婚原因读入原文。“仍然有效”表达 יָקוּם 的成立、存续之义；脚注保留“约束她”的可行译法。
  issues:
