  yaml_path: translation/ot/numbers/030/010.yaml
  text: And the vow of a widow or of a divorced woman—everything by which she has bound herself—shall stand against her[a].
translation:
  language: zh_hans
  text: 寡妇或离婚妇人所许的愿，以及她使自己受约束的一切，都仍然对她有效[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“都约束她。”
    reason: lexical_alternative
lexical_decisions:
- source_word: נֵדֶר
  choice: 所许的愿
  rationale: 在律法及敬拜语境中指向上帝所许的愿；此处用“所许的愿”自然承接所属结构。
- source_word: אַלְמָנָה
  choice: 寡妇
  rationale: 准确、通行地表示丈夫已经去世的女人。
- source_word: גְרוּשָׁה
  choice: 被休的女人
  rationale: 保留希伯来语被动分词“被送走、被离弃”的形式和古代法律处境；比现代法律术语“离婚的女人”更贴近源文，但仍易懂。
- source_word: כֹּל אֲשֶׁר
  choice: 一切
  rationale: 保留该短语的全面涵盖力，并表明范围不限于前面的单一誓愿。
- source_word: אָסְרָה
  choice: 约束
  rationale: 保留 אסר“捆绑”的比喻，同时在汉语中清楚表达使自己承担义务。
- source_word: עַל נַפְשָׁהּ
  choice: 自己
  rationale: נפש 在这里指本人、自身；“自己”自然表达反身意义。
- source_word: יָקוּם
  choice: 有效
  rationale: קום 在法律语境中表示成立、维持效力；“有效”比直译“站立”更符合现代汉语法律表达。
- source_word: עָלֶיהָ
  choice: 对她
  rationale: 表达该义务落在她身上并约束她；与“有效”搭配自然，同时避免把介词过度解释为敌对意义。
theological_decisions:
- issue: 寡妇或被休女人所立义务的效力
  choice: 陈述其誓愿和自我约束都对本人有效
  alternative: 译为“都要由她承担”或“都约束她”
  rationale: 源文强调义务成立并落在她身上，而不是进一步说明其神学或社会原因；译文保留这一法律判断。
translation_notes:
  register: 采用现代、庄重而易懂的法律叙述语体。“被休”保留古代语境及被动含义；“对她有效”传达 יָקוּם עָלֶיהָ 的法律效力，脚注补出“约束她”这一更突出负担意味的译法。
