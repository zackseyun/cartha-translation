    issue: “被休的女人”用语偏古雅，并可能使源文的“离婚妇人”被狭义理解为单方休弃。
    rationale: גְרוּשָׁה 是“被离婚／离婚的妇人”的被动分词；经文未明说离婚方式或原因。以“离婚妇人”在现代标准汉语中更自然，也较少附加解释。
  - severity: low
    issue: “她约束自己的一切”句法和指向略不自然。
    rationale: אָסְרָה עַל־נַפְשָׁהּ 指她使自己承担的一切约束性义务。“她使自己受约束的一切”更清晰地保留反身和法律语境。
  revised_text: 寡妇或离婚妇人所许的愿，以及她使自己受约束的一切，都仍然对她有效[a]。
