revisions:
- from: 但如果她丈夫听见的当天不准她这样做，废去她所许、约束她的愿，或她说出口、用来约束自己的话[a]，那么雅威必赦免她。
  to: 但如果她丈夫在听见的当天反对她，并废除她所许、加在她身上的愿，以及她亲口说出、用以约束自己的话[a]，那么雅威必赦免她。
  rationale: 修订澄清“愿”受“加在她身上”修饰的关系，将原文并列的两个受事译为“以及”，并以“反对她”避免对丈夫行动的对象作不必要、且指向不清的补充。其余保留草稿对神名、法律语汇和争议词义的审慎处理。
