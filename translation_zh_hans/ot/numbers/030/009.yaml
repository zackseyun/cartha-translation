id: NUM.30.9
reference: Numbers 30:9
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ֠/אִם בְּ/י֨וֹם שְׁמֹ֣עַ אִישָׁ/הּ֮ יָנִ֣יא אוֹתָ/הּ֒ וְ/הֵפֵ֗ר אֶת נִדְרָ/הּ֙ אֲשֶׁ֣ר עָלֶ֔י/הָ וְ/אֵת֙ מִבְטָ֣א שְׂפָתֶ֔י/הָ אֲשֶׁ֥ר אָסְרָ֖ה עַל נַפְשָׁ֑/הּ וַ/יהוָ֖ה יִֽסְלַֽח לָֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/030/009.yaml
  text: But if[a], on the day her husband hears of it, he forbids her and annuls her vow that is upon her, or the rash utterance of her lips by which she bound herself, then Yahweh will forgive her.
translation:
  language: zh_hans
  text: 但如果她丈夫在听见的当天反对她，并废除她所许、加在她身上的愿，以及她亲口说出、用以约束自己的话[a]，那么雅威必赦免她。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“她轻率说出口、用以约束自己的话”；也可译：“她说出口、使自己受约束的话”。
    reason: מִבְטָא指口头说出的表达；在誓愿语境中可能含轻率或自我约束的意味，但其具体语气并不确定。
lexical_decisions:
- source_word: וְאִם
  choice: 但如果
  rationale: 承接上文并引出与前述情形相对的条件，保留连接词的转折意味。
- source_word: בְּיוֹם שְׁמֹעַ אִישָׁהּ
  choice: 她丈夫听见的当天
  rationale: בְּיוֹם与不定式连用表示事情发生之时；“听见”在上下文中自然指听见她所许的愿或自我约束。
- source_word: יָנִיא אֹתָהּ
  choice: 不准她这样做
  rationale: נוא的使役式在许愿法规中表示阻止或不准其承诺生效；补出“这样做”使现代汉语通顺，又不把动作误解为一般性的禁止。
- source_word: וְהֵפֵר
  choice: 废去
  rationale: 在法律语境中表示使誓愿失效；“废去”庄重而易懂。
- source_word: נִדְרָהּ אֲשֶׁר עָלֶיהָ
  choice: 她所许、约束她的愿
  rationale: 既表达נדר的“愿”，也保留עָלֶיהָ所含义务落在她身上的意象与法律约束力。
- source_word: מִבְטָא שְׂפָתֶיהָ
  choice: 她说出口……的话
  rationale: מִבְטָא的核心义是口头表达；正文避免把未必确定的“轻率”意味直接写入，以保留词义上的开放性。
- source_word: אֲשֶׁר אָסְרָה עַל נַפְשָׁהּ
  choice: 用来约束自己的
  rationale: 这是使自己承担义务的惯用表达；译法保留“约束”的法律与自我承担意味。
- source_word: וַיהוָה יִסְלַח לָהּ
  choice: 那么雅威必赦免她
  rationale: 直译神圣名号יהוה为“雅威”；סלח译为“赦免”，并以“那么”清楚标示条件句的结果。
theological_decisions:
- issue: 神圣名号יהוה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”较贴近学界通行的拟音，同时不以称号替代专名。
- issue: מִבְטָא שְׂפָתֶיהָ是否明确含有“轻率”之意
  choice: 正文译作“她说出口……的话”，脚注列出“她轻率说出口的话”
  alternative: 她轻率说出口的话
  rationale: 该名词确定指口头表达，但“轻率、冒失”的语气并非无争议；正文保留较宽泛词义，脚注呈现语境上可能的理解。
- issue: 丈夫的行动与誓愿失效之间的关系
  choice: 分别译出“不准她这样做”和“废去”
  alternative: 合并译为“使她的愿失效”
  rationale: 原文使用两个动词，前者指丈夫阻止她，后者指废除其愿与自我约束；分别翻译可保留法律措辞的层次。
translation_notes:
  register: 采用现代、庄重且适合公开诵读的法律叙述语体。“许愿”“约束”“废去”“赦免”延续本章的核心术语；句法经过适度调整，以符合现代标准汉语，同时保留原文条件句和两个并列宾语的结构。
