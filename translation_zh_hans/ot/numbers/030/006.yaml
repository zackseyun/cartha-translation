source:
  edition: WLC
  text: וְ/אִם הֵנִ֨יא אָבִ֣י/הָ אֹתָ/הּ֮ בְּ/י֣וֹם שָׁמְע/וֹ֒ כָּל נְדָרֶ֗י/הָ וֶֽ/אֱסָרֶ֛י/הָ אֲשֶׁר אָסְרָ֥ה עַל נַפְשָׁ֖/הּ לֹ֣א יָק֑וּם וַֽ/יהוָה֙ יִֽסְלַח לָ֔/הּ כִּי הֵנִ֥יא אָבִ֖י/הָ אֹתָֽ/הּ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/030/006.yaml
  text: But if her father forbids her on the day he hears of it[a], none of her vows or her binding obligations by which she has bound herself shall stand; and Yahweh will forgive her[b], because her father forbade her.
translation:
  language: zh_hans
  text: 但若她父亲在听见的当天制止她，她所许的一切誓愿，以及她加在自己身上的一切约束[a]，都不得成立[b]；耶和华必赦免她，因为她父亲制止了她。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “约束”也可译作“禁约”或“有约束力的承诺”；希伯来词特指人在许愿语境中加给自己的义务。
    reason: lexical_alternative
  - marker: b
    text: “不得成立”直译为“不得站立”，意思是这些誓愿和约束不能继续具有约束力。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: 但……若
  rationale: 承接上文并引出与前一种情况相对的条件，保留连接词的转折色彩。
- source_word: הֵנִיא
  choice: 制止
  rationale: 该使役动词在许愿的法律语境中表示父亲反对女儿，使其誓愿失去效力；“制止”既贴近以女儿为直接宾语的希伯来句法，也不把法律结果过度明说为“废除”。
- source_word: בְּיוֹם שָׁמְעוֹ
  choice: 听见的当天
  rationale: 保留原文“在他听见之日”的时间限定；“当天”是自然、明确的现代汉语表达。
- source_word: כָּל נְדָרֶיהָ
  choice: 她所许的一切愿
  rationale: נדר 指向神所许的愿；采用现代汉语可懂、并保留宗教法律语域的“许愿”。
- source_word: וֶאֱסָרֶיהָ אֲשֶׁר אָסְרָה עַל נַפְשָׁהּ
  choice: 她加在自己身上的一切约束
  rationale: 名词与同根动词共同强调自我约束；此译保留这种重复的法律意味，同时避免生硬的“捆绑”。
- source_word: לֹא יָקוּם
  choice: 都不得成立
  rationale: קום 字面为“站立”，在此法律语境中指誓愿继续有效或成立；“不得成立”准确表达其效力被否定。
- source_word: וַיהוָה
  choice: 耶和华
  rationale: 以现代中文中广为人知的专名译出神圣四字名，不将其泛化为称号。
- source_word: יִסְלַח לָהּ
  choice: 必赦免她
  rationale: 直接保留 סלח 的赦免含义及其女性受词，不额外界定所赦免之事。
- source_word: כִּי
  choice: 因为
  rationale: 清楚表达后句为耶和华赦免她所给出的理由。
theological_decisions:
- issue: 誓愿被父亲制止与耶和华赦免之间的关系
  choice: 保留经文的直接陈述：誓愿不得成立，耶和华赦免她，因为父亲制止了她。
  alternative: 将“赦免”解释为仅指免除未履行誓愿所招致的罪责，或解释为更广泛的道德赦罪。
  rationale: 原文肯定赦免，却没有详细说明罪责的性质或范围；译文不把法律处置与神学赦罪之间的张力作超出文本的限定。
- issue: 父亲行为的表达
  choice: 制止她
  alternative: 废除她的誓愿
  rationale: 原文以女儿为动词的直接宾语，而非以誓愿为宾语；保留这一形式可避免把经文所含的人际权威行为完全改写为抽象法律术语。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“所许的愿”“加在自己身上的约束”保留民数记法律条文的正式语气；句法避免过度古雅，也不把原文未明说的神学含义补入正文。
