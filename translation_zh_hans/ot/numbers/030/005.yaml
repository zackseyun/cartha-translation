base_translation:
  language: en
  yaml_path: translation/ot/numbers/030/005.yaml
  text: And if her father hears her vow[a], or her binding obligation by which she has bound herself, and her father says nothing to her, then all her vows shall stand[b], and every binding obligation by which she has bound herself shall stand.
translation:
  language: zh_hans
  text: 如果她父亲听见她所许的愿和她给自己加上的约束[a]，对她默不作声[b]，那么她所许的一切愿都继续有效，她给自己加上的一切约束也都继续有效。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “约束”所译的希伯来词是 אִסָּר，指人给自己加上的限制或有约束力的承诺；它与“愿”关系密切，但用词不同。
    reason: lexical_alternative
  - marker: b
    text: 直译为“她父亲对她沉默”。在这里，父亲没有提出异议，因此她所许的愿和所加的约束仍然有效。
    reason: lexical_alternative
lexical_decisions:
- source_word: נִדְרָהּ / נְדָרֶיהָ
  choice: 她所许的愿
  rationale: נֵדֶר在此指人所许、具有宗教和法律约束力的愿；“许愿”是现代汉语中清楚自然的对应表达。
- source_word: אֱסָרָהּ / אִסָּר
  choice: 她给自己加上的约束
  rationale: אִסָּר指自我施加的限制或约束，与נֵדֶר相关但并非同一词。“给自己加上的约束”既保留两者的区别，也表达其约束力，且比生造的法律术语更易懂。
- source_word: אָסְרָה עַל־נַפְשָׁהּ
  choice: 她给自己加上的
  rationale: 该短语直译为“约束在自己身上”，这里用自然汉语保留自我承担、自我限制的含义。
- source_word: וְהֶחֱרִישׁ לָהּ אָבִיהָ
  choice: 却对她默不作声
  rationale: חָרַשׁ在此表示保持沉默；译文保留“对她”的关系表达，不直接把沉默解释成批准。
- source_word: וְקָמוּ ... יָקוּם
  choice: 都继续有效
  rationale: קוּם在本段法律语境中表示成立、维持效力。“继续有效”自然地传达这些愿和约束未被废除，同时保留法律效力。
- source_word: כָּל
  choice: 一切
  rationale: 两处均译为“一切”，对应其涵盖全部的范围。
- source_word: וְ
  choice: 如果
  rationale: 节首连接词承接上一节的条件式案例法；现代汉语以“如果”明确其条件关系，不增加实质内容。
theological_decisions:
- issue: 父亲沉默的法律意义
  choice: 正文只陈述父亲默不作声以及愿和约束继续有效
  alternative: 将沉默直接译作“同意”或“认可”
  rationale: 上下文显示沉默产生不反对的法律效果，但希伯来文本本身说的是“沉默”；保留这一措辞可避免把行为与其法律后果完全等同。
translation_notes:
  register: 采用现代、庄重而易懂的法律叙述语体。“许愿”与“给自己加上的约束”分别对应两个不同的希伯来词；“继续有效”传达法律上的成立与维持效力。
