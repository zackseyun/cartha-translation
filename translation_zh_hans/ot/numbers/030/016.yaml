  text: וְ/אִם הָפֵ֥ר יָפֵ֛ר אֹתָ֖/ם אַחֲרֵ֣י שָׁמְע֑/וֹ וְ/נָשָׂ֖א אֶת עֲוֺנָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/030/016.yaml
  text: But if he does indeed nullify them after he has heard of them[b][a], then he shall bear her guilt.
translation:
  language: zh_hans
  text: 但如果他听见之后，确实废除这些誓愿[a]，就要担当她的罪责[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “确实废除”也可译作“坚决废除”或“完全废除”。希伯来语用不定式绝对式配合限定动词来加强语气。
    reason: lexical_alternative
  - marker: b
    text: “担当她的罪责”也可理解为“为她的罪孽承担责任”或“承受她因罪应得的惩罚”。
    reason: alternative_reading
lexical_decisions:
- source_word: וְאִם
  choice: 但如果
  rationale: 在上下文中引出与前述情形相对的条件，兼顾连接词的转折作用。
- source_word: הָפֵר יָפֵר
  choice: 确实废除
  rationale: 希伯来语以同一词根的不定式绝对式配合限定动词来加强语气；“确实废除”既表达强调，也符合誓愿被取消效力的法律语境。
- source_word: אֹתָם
  choice: 这些誓愿
  rationale: 代词为阳性复数，回指上文所说的誓愿和约束；在中文中明确补出所指，使语意自然清楚。
- source_word: אַחֲרֵי שָׁמְעוֹ
  choice: 他听见之后
  rationale: 保留动作的先后关系；“听见”贴近原文，不额外限定为仅仅听说。
- source_word: וְנָשָׂא
  choice: 就要担当
  rationale: 连接词在条件句中表达结果；“担当”保留承担罪责或其后果的法律—道德含义。
- source_word: עֲוֺנָהּ
  choice: 她的罪责
  rationale: עָוֹן可指罪孽、罪责或因罪而来的惩罚；“罪责”在现代中文中保留责任与罪咎两方面的张力。
theological_decisions:
- issue: “担当她的罪责”在法律语境中的含义
  choice: 保留“担当她的罪责”这一较宽的表述，表示男子因事后废除誓愿而承担相关罪责。
  alternative: 可理解为承担她罪孽的责任，或承受她因罪应得的惩罚。
  rationale: 希伯来语 נָשָׂא עָוֹן 可指承担罪咎、责任或刑罚后果；正文不把其中的惩罚机制解释得过细，以保留原文的语义和神学张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“废除”体现誓愿失效的法律语境；“确实”传达原文强调结构；“罪责”避免将 עָוֹן 过早限定为单纯的罪行或刑罚。
