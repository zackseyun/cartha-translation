  text: וְ/אִם הָפֵר֩ יָפֵ֨ר אֹתָ֥/ם אִישָׁ/הּ֮ בְּ/י֣וֹם שָׁמְע/וֹ֒ כָּל מוֹצָ֨א שְׂפָתֶ֧י/הָ לִ/נְדָרֶ֛י/הָ וּ/לְ/אִסַּ֥ר נַפְשָׁ֖/הּ לֹ֣א יָק֑וּם אִישָׁ֣/הּ הֲפֵרָ֔/ם וַ/יהוָ֖ה יִֽסְלַֽח לָֽ/הּ־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/030/013.yaml
  text: But if her husband indeed annuls them on the day he hears[a], then nothing that came from her lips—whether her vows or her binding obligation upon herself—shall stand. Her husband has annulled them[c][b], and Yahweh will forgive her.
translation:
  language: zh_hans
  text: 但如果她的丈夫在听见的当天确实废除这些，那么她口中所出的一切——无论是她的誓愿，还是她约束自己的义务——都不再有效。她的丈夫既已将这些废除，耶和华也必赦免她。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאִם
  choice: 但如果
  rationale: 承接上文并引出与前一情形相对的条件，保留连接词的转折意味。
- source_word: הָפֵר יָפֵר
  choice: 坚决废除
  rationale: 以“坚决”表达不定式绝对形与未完成式连用所带的加强语气，同时保持现代汉语自然。
- source_word: אִישָׁהּ
  choice: 她丈夫
  rationale: 在本段婚姻法律语境中，אִישָׁהּ明确指她的丈夫。
- source_word: בְּיוֹם שָׁמְעוֹ
  choice: 在听见的当天
  rationale: 保留希伯来文对具有法律意义之时间点的明确限定。
- source_word: כָּל מוֹצָא שְׂפָתֶיהָ
  choice: 她口中所出的一切
  rationale: 贴近字面“她嘴唇的一切出口”，又以庄重、可懂的汉语涵盖她说出的一切承诺。
- source_word: לִנְדָרֶיהָ
  choice: 她的誓愿
  rationale: “誓愿”是宗教和法律语境中נדר的准确、通行译法。
- source_word: וּלְאִסַּר נַפְשָׁהּ
  choice: 她约束自己的义务
  rationale: 保留该表达的自我约束和义务性质，不把נפש狭义化为灵魂，也不限定为禁戒。
- source_word: לֹא יָקוּם
  choice: 都不再有效
  rationale: 按法律惯用义表达这些承诺不能成立或继续生效，比直译“不站立”更符合现代汉语。
- source_word: הֲפֵרָם
  choice: 已经将这些废除了
  rationale: 表达完成体所概括的决定性行为及其现存法律结果。
- source_word: וַיהוָה
  choice: 耶和华
  rationale: 直接以中文传统音译呈现神名YHWH，避免将专名改为称号。
- source_word: יִסְלַח לָהּ
  choice: 必赦免她
  rationale: 准确传达סלח，并保留原文在誓愿被废除与赦免之间所陈述的神学—法律关系。
theological_decisions:
- issue: 誓愿被丈夫废除后仍提到神的赦免
  choice: 直译为“耶和华也必赦免她”，不说明赦免具体针对哪一种过失
  alternative: 解释为赦免她未履行誓愿，或赦免她轻率许愿
  rationale: 原文明确陈述废除、失效和赦免的次序，却没有明确界定赦免究竟针对未履行、轻率许愿或其他责任；译文保留这一张力。
translation_notes:
  register: 采用现代、庄重而清楚的法律叙述语体。“废除”“有效”“义务”体现条文性质；保留“她口中所出的一切”的希伯来表达色彩，但避免生硬直译。
