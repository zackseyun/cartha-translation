base_translation:
  language: en
  yaml_path: translation/ot/numbers/030/002.yaml
  text: Then Moses spoke to the heads of the tribes of the sons of Israel[a], saying[b], “This is the word that Yahweh has commanded:”
translation:
  language: zh_hans
  text: 接着，摩西对以色列子孙[a]的各支派首领说：“这是雅威所吩咐的话[b]：”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“以色列人”。希伯来文直译为“以色列的众子”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“雅威所吩咐的是这样。”希伯来文为“这是雅威所吩咐的话”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: 接着……说
  rationale: וַ־推动叙事向前；“接着”在现代汉语中自然地表达承接关系，“说”准确传达 דּבר 在此处引出讲话的用法。
- source_word: רָאשֵׁי הַמַּטּוֹת
  choice: 各支派的首领
  rationale: רָאשֵׁי 字面为“头”，用于群体时指首领；מַטּוֹת 在此指以色列的各支派。“各支派的首领”既准确又符合现代汉语表达。
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: 以色列子孙
  rationale: 保留 בְּנֵי 的家族性、盟约性表达；同时以脚注注明更符合日常汉语的“以色列人”。
- source_word: לֵאמֹר
  choice: 说
  rationale: 该不定式用于引出直接引语。汉语不必重复译成“说……说道”，以一个“说”自然承载其功能。
- source_word: זֶה הַדָּבָר
  choice: 所吩咐的话是这样
  rationale: דָּבָר 可指“话、事情、内容”。这里引出神的命令，正文保留“话”，并用“是这样”形成自然的汉语引语格式。
- source_word: צִוָּה
  choice: 所吩咐的
  rationale: 该完成式指雅威已经颁布、如今由摩西转达的命令；汉语定语结构自然表达这一关系。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语音译呈现四字神名，而不以“主”这一称号代替，也不采用源于另一种传统读法的“耶和华”。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。译作“雅威”保留其专名性质；“主”是称号替代，“耶和华”则反映后起的混合读法。
- issue: בְנֵי יִשְׂרָאֵל 的群体表达
  choice: 以色列子孙
  alternative: 以色列人
  rationale: 正文保留原文“以色列之子”的家族与盟约色彩，不把它完全平化为民族称谓；脚注提供自然汉语替代译法。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“各支派的首领”清楚表达以色列的社会结构；正文保留“以色列子孙”和“话”的原文特色，并借脚注提供较通顺或较直译的替代说法。
