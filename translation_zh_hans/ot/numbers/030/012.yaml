base_translation:
  language: en
  yaml_path: translation/ot/numbers/030/012.yaml
  text: And if her husband hears and says nothing to her[a], and does not nullify her vow, then all her vows shall stand, and every binding obligation that she has bound on herself shall stand.
translation:
  language: zh_hans
  text: 她丈夫若听见了，向她默不作声，没有废除她所许的誓愿或所加的约束，那么她所许的一切誓愿都有效；她加在自己身上的一切约束也都有效。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְשָׁמַע אִישָׁהּ
  choice: 她丈夫若听见了
  rationale: 承接本段案例律的条件结构，用“若”明确其条件含义；אִישָׁהּ在婚姻法规语境中特指“她丈夫”。
- source_word: וְהֶחֱרִשׁ לָהּ
  choice: 却向她默不作声
  rationale: 保留希伯来语“向她沉默”的表达方向和法律意义，指丈夫听见后不提出异议。
- source_word: לֹא הֵנִיא אֹתָהּ
  choice: 没有废除她所许的愿
  rationale: 原文直译为“没有使她受阻／没有废除她”，但本章语境表明所废除的是她誓愿的效力；正文补出隐含对象以免误解为针对她本人。
- source_word: וְקָמוּ כָּל נְדָרֶיהָ
  choice: 她所许的一切愿都有效
  rationale: קום在法律语境中表示成立并持续具有效力；“都有效”比直译“都站立”更符合现代汉语法律表达。
- source_word: וְכָל אִסָּר
  choice: 她……所承担的一切义务
  rationale: אִסָּר指借誓言加在自己身上的约束或义务；采用“义务”表达其约束力，同时由后面的“约束自己”保留限制意味。
- source_word: אֲשֶׁר אָסְרָה עַל נַפְשָׁהּ
  choice: 她约束自己所承担的
  rationale: 保留原文“在自己身上施加约束”的反身含义，并用自然现代汉语说明这是自我承担的约束。
- source_word: יָקוּם
  choice: 也都有效
  rationale: 与前半句平行，重复法律效力的判定；中文补“也都”清楚呈现并列关系。
theological_decisions: []
