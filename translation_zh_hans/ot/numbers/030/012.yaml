  to: 她丈夫若听见了，向她默不作声，没有废除她所许的誓愿或所加的约束，那么她所许的一切誓愿都有效；她加在自己身上的一切约束也都有效。
  rationale: 修订删除无依据的转折词，使“废除”的对象涵盖本节所列的誓愿与约束，并将末句改为符合现代汉语且更贴近原文反身结构的表达。
