  text: וְ/אִם הָי֤וֹ תִֽהְיֶה֙ לְ/אִ֔ישׁ וּ/נְדָרֶ֖י/הָ עָלֶ֑י/הָ א֚וֹ מִבְטָ֣א שְׂפָתֶ֔י/הָ אֲשֶׁ֥ר אָסְרָ֖ה עַל נַפְשָֽׁ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/030/007.yaml
  text: But if she belongs to a husband[a], and her vows are upon her, or a rash utterance of her lips by which she has bound herself[b],
translation:
  language: zh_hans
  text: 但她若嫁了人[a]，而她所许的愿，或她轻率说出、用以约束自己的话[b]，仍约束着她，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“成为一个男人的妻子”或“已经有丈夫”。希伯来语直译为“成为／属于一个男人”。
    reason: lexical_alternative
  - marker: b
    text: 也可译“她嘴唇所说、用以约束自己的话”。这里的措辞可能指冲动说出的自我约束，与正式许愿有所区别。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: 但……若
  rationale: 承接上文并转入另一种条件情形；“但……若”兼顾连接与轻微转折。
- source_word: הָיוֹ תִהְיֶה לְאִישׁ
  choice: 她若嫁了人
  rationale: היה לְאִישׁ 是婚姻关系用语；现代汉语以“嫁了人”自然表达女子进入或处于婚姻关系，不照字面译成“属于一个男人”。
- source_word: וּנְדָרֶיהָ עָלֶיהָ
  choice: 她所许的愿……仍在她身上
  rationale: 保留“在她身上”的希伯来意象，表示自加的义务尚在，同时不预先断定该愿最终是否获得法律确认。
- source_word: מִבְטָא שְׂפָתֶיהָ
  choice: 她嘴唇冒失说出……的话
  rationale: מִבְטָא 指说出的言语；在许愿语境中可含轻率、冲动之意，但仍与正式的“愿”有所区分。
- source_word: אֲשֶׁר אָסְרָה עַל נַפְשָׁהּ
  choice: 用来约束自己的
  rationale: אָסַר 保留“捆绑、约束”的法律性比喻；נֶפֶשׁ 在此作反身意义，指本人。
theological_decisions:
- issue: 法律性许愿语境中 נֶפֶשׁ 的译法
  choice: 自己
  alternative: 自己的性命／自己的灵魂
  rationale: 这里说的是人给自己加上义务，并非讨论人的构成或灵魂观；译作“自己”最符合该反身习语，也避免加入原文没有表达的人论主张。
- issue: 婚姻用语 היה לְאִישׁ 的关系性质
  choice: 嫁了人
  alternative: 属于丈夫／成为一个男人的妻子
  rationale: 原文是婚姻法律关系的习语。采用现代自然表达，不把婚姻关系扩张为一般所有权，也不额外规定此处所指婚姻阶段。
translation_notes:
  register: 采用现代、庄重而易懂的法律叙事语体。调整语序，使“仍在她身上”自然地统摄“所许的愿”和“嘴唇……说出的话”；保留句末逗号，因为本节是尚待下节完成的条件从句。
