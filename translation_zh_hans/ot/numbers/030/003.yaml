source:
  edition: WLC
  text: אִישׁ֩ כִּֽי יִדֹּ֨ר נֶ֜דֶר לַֽ/יהוָ֗ה אֽוֹ הִשָּׁ֤בַע שְׁבֻעָה֙ לֶ/אְסֹ֤ר אִסָּר֙ עַל נַפְשׁ֔/וֹ לֹ֥א יַחֵ֖ל דְּבָר֑/וֹ כְּ/כָל הַ/יֹּצֵ֥א מִ/פִּ֖י/ו יַעֲשֶֽׂה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/030/003.yaml
  text: If a man makes a vow to Yahweh, or swears an oath to bind himself by a pledge, he shall not break his word; he shall do according to all that has gone out from his mouth.
translation:
  language: zh_hans
  text: 男子若向雅威许愿，或起誓使自己受约束[a]，就不可违背自己所说的话[b]；凡从他口中出来的，他都要照着做。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“使自己承担义务。”希伯来原文直译为“把约束加在自己身上”。
    reason: 保留 לֶאְסֹר אִסָּר עַל נַפְשׁוֹ 的同根词结构及其法律义务含义。
  - marker: b
    text: 直译：“不可亵渎自己的话。”
    reason: 反映 יַחֵל（源自 חלל）在此仍带有使之不再神圣、加以亵渎的词义背景。
lexical_decisions:
- source_word: אִישׁ
  choice: 男子
  rationale: 原文是阳性单数名词；本段法律条文随后专门论及女子，因此保留性别所指，同时用现代汉语中庄重自然的“男子”。
- source_word: כִּי
  choice: 若
  rationale: 在案例式法律条文中引出条件，“若”简洁而符合中文法律语体。
- source_word: יִדֹּר נֶדֶר
  choice: 许愿
  rationale: 原文以同根动词和名词连用；中文用固定表达“许愿”自然地传达向神郑重立愿之意。
- source_word: לַיהוָה
  choice: 向雅威
  rationale: 直接音译四字神名 יהוה，并以“向”表达许愿的对象。
- source_word: הִשָּׁבַע שְׁבֻעָה
  choice: 起誓
  rationale: 原文同样采用同根动词和名词；“起誓”是自然、庄重的现代汉语表达。
- source_word: לֶאְסֹר אִסָּר עַל נַפְשׁוֹ
  choice: 使自己受约束
  rationale: 该短语表示把具有约束力的义务加在自己身上；译文保留自我约束的法律含义，避免生硬复制同根词。
- source_word: לֹא יַחֵל דְּבָרוֹ
  choice: 不可违背自己所说的话
  rationale: חלל 的使役形在此有使之不再神圣、加以违反的语义；正文采用清楚自然的“违背”，脚注保留更贴近词源的译法。
- source_word: כְּכָל הַיֹּצֵא מִפִּיו יַעֲשֶׂה
  choice: 凡从他口中出来的，他都要照着做
  rationale: 保留希伯来文“从口中出来”的具体意象，并以“照着做”表达履行全部所言的义务。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”较贴近学界通常重构的读音，也明确保留专名性质，不以称号替代。
- issue: לֹא יַחֵל דְּבָרוֹ 中神圣与法律语义的张力
  choice: 正文译“不可违背自己所说的话”，脚注注明直译“不可亵渎自己的话”
  alternative: 不可亵渎自己的话
  rationale: 正文传达该法律语境中的实际禁令，脚注则保留 חלל 所含“使成俗、亵渎”的神圣语义，避免静默消除原文张力。
translation_notes:
  register: 采用简洁、庄重的现代标准汉语，保持案例式法律条文的条件结构。正文兼顾可读性与希伯来文的具体口语意象；较生硬的直译及重要词义张力置于脚注。
