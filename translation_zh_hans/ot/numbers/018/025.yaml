  yaml_path: translation/ot/numbers/018/025.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: zh_hans
  text: 耶和华对摩西说：
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: 说
  rationale: 该词与承接叙事的 וַ 连用，引出新的话语段落。现代汉语用“说”自然简洁；句序“耶和华对摩西说”也体现其“向……讲话”的含义。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 这是四字神名 YHWH。中文圣经传统通常音译为“耶和华”，既将其作为专名呈现，也比直接采用现代学术拟音“雅威”更为普通中文读者所熟悉。
- source_word: אֶל
  choice: 对
  rationale: 在说话动词之后标明话语所指向的对象，现代汉语自然表达为“对”。
- source_word: מֹשֶׁה
  choice: 摩西
  rationale: 采用该人名通行且稳定的中文译名。
- source_word: לֵאמֹר
  choice: 说
  rationale: 这是引出直接引语的固定公式。希伯来语与前面的说话动词形成重复，但现代汉语若译成“讲话说”或“说，说道”显得累赘；合并为句末“说：”，以冒号承担引语功能。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威；上主
  rationale: 原文使用神的专名，而非一般称号。正文采用中文传统音译“耶和华”，避免以称号“上主”取代专名；“雅威”则更接近现代学界常见的拟音，但在普通现代中文中不及“耶和华”通行。
translation_notes:
  register: 采用庄重而自然的现代标准汉语，并保留希伯来叙事话语公式的功能。由于本节紧接下文直接引语，以冒号收束。未机械翻出句首承接词 וַ；单独成节时加“于是”可能赋予原文过强的时间推进色彩。
