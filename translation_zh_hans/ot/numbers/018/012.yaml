  text: כֹּ֚ל חֵ֣לֶב יִצְהָ֔ר וְ/כָל חֵ֖לֶב תִּיר֣וֹשׁ וְ/דָגָ֑ן רֵאשִׁיתָ֛/ם אֲשֶׁר יִתְּנ֥וּ לַֽ/יהוָ֖ה לְ/ךָ֥ נְתַתִּֽי/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/012.yaml
  text: All the best of the oil[a], and all the best of the new wine and grain—their firstfruits, which they give to Yahweh—I have given to you.
translation:
  language: zh_hans
  text: 油中所有上好的部分，以及新酒和谷物中所有上好的部分，就是所献给耶和华的初熟之物；我已赐给你。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חֵלֶב
  choice: 上好的
  rationale: 本义为“脂肪”，用于农产品时是惯用语，指最肥美、最优质的部分；译作“上好的”自然准确，也保留其作为献礼中精选部分的含义。
- source_word: יִצְהָר
  choice: 油
  rationale: 指新榨的油，在古代以色列语境中通常为橄榄油；原词本身未明说“橄榄”，故简译为“油”。
- source_word: תִּירוֹשׁ
  choice: 新酒
  rationale: 通常指新产的酒，译作“新酒”可与泛指酒的其他希伯来词有所区别。
- source_word: דָגָן
  choice: 五谷
  rationale: 泛指谷物出产；“五谷”在现代汉语圣经语体中自然，并非限定为五种具体谷类。
- source_word: רֵאשִׁיתָם
  choice: 其中……初熟之物
  rationale: רֵאשִׁיתָם直指这些农产品中最先收取、分别献上的部分；“初熟之物”契合农业及献礼语境。
- source_word: אֲשֶׁר יִתְּנוּ לַיהוָה
  choice: 献给耶和华的
  rationale: נתן基本义为“给”；在敬拜献礼语境中译作“献给”更符合自然汉语，同时没有增添额外祭仪含义。
- source_word: לַיהוָה
  choice: 耶和华
  rationale: 以现代中文读者熟悉的专名“耶和华”对应神名יהוה，明确保留原文专名。
- source_word: לְךָ נְתַתִּים
  choice: 我都赐给你
  rationale: 完成式表达已经确立的授予；“赐给”符合神向祭司说话的语境，“都”承接前列诸项及宾语后缀所概括的整体。
theological_decisions:
- issue: 初熟之物与“上好的”之间的关系
  choice: 把“就是其中献给耶和华的初熟之物”理解为对前列油、新酒和五谷的进一步说明
  alternative: 将“初熟之物”处理为与“上好的”并列的另一类供物
  rationale: 希伯来语רֵאשִׁיתָם的复数后缀回指前述农产品，随后关系从句说明这些初熟之物是人献给耶和华的；译文保持这种回指关系，不另立供物类别。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“所有……所有……”保留原文反复结构；后半句用“就是”明确同位说明关系。保留神名“耶和华”，不加入宗派性解释。
