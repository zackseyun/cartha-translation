base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/031.yaml
  text: You and your household may eat it in any place[c][b][a], because it is your wages in return for your service in the tent of meeting.
translation:
  language: zh_hans
  text: 你们和你们的家户[b]可以在任何地方吃它[a]，因为这是你们在会幕中服事所应得的报酬[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“要吃它”或“应当吃它”。希伯来语形式在此法律语境中可以表示指示或准许，并非单纯表示过去发生的事。
    reason: lexical_alternative
  - marker: b
    text: “家户”原文直译为“家”，这里指整个家户单位，而不只是房屋。
    reason: cultural_note
  - marker: c
    text: “报酬”也可译为“工价”“酬劳”或“补偿”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲכַלְתֶּם אֹתוֹ
  choice: 可以……吃它
  rationale: 该形式在此法律语境中表达准许或规定，而非单纯叙述过去发生的事；“可以”清楚传达利未人有权食用这份所得。
- source_word: בְּכָל מָקוֹם
  choice: 在任何地方
  rationale: 保留“各处、任何地方”的分布性含义，并表明食用这份所得不受圣所地点限制。
- source_word: אַתֶּם וּבֵיתְכֶם
  choice: 你们和你们的家人
  rationale: 此处“家”指家庭或家户成员，不是房屋本身；“家人”是自然、清楚的现代汉语。
- source_word: כִּי
  choice: 因为
  rationale: 引出准许食用的理由，符合现代汉语因果表达。
- source_word: שָׂכָר
  choice: 报酬
  rationale: 该词指因劳务所得的补偿；“报酬”既保留劳动回报之意，也适合利未人在圣所服事的语境。
- source_word: חֵלֶף
  choice: 所得的
  rationale: 结合“报酬”译为“服事所得的报酬”，自然表达作为服事回报或补偿的关系，避免生硬直译。
- source_word: עֲבֹדַתְכֶם
  choice: 你们……服事
  rationale: 此词在这里指利未人承担的礼仪职分；“服事”比泛称“工作”更能保留其职务和圣所语境。
- source_word: בְּאֹהֶל מוֹעֵד
  choice: 在会幕中
  rationale: “会幕”是 אֹהֶל מוֹעֵד 在中文圣经语境中的通行名称；“在……中”贴近介词，并自然修饰其服事。
theological_decisions:
- issue: 利未人所得份额的性质
  choice: 将这份可食用之物表述为利未人在会幕中服事所得的合法报酬，并明确可在任何地方食用。
  alternative: 将其较狭义地理解为必须在圣所范围内享用的圣物之餐。
  rationale: “在任何地方”明确取消了食用地点的圣所限制，使本节与某些只能在圣处食用的供物形成法律上的区别；译文不额外加入祭餐限制。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“家人”避免把“家”误解为建筑物；“报酬”保留劳动所得的法律含义，但不把利未人的圣所服事世俗化。脚注标记均置于主文相关词语之后。
