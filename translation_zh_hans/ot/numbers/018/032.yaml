  text: וְ/לֹֽא תִשְׂא֤וּ עָלָי/ו֙ חֵ֔טְא בַּ/הֲרִֽימְ/כֶ֥ם אֶת חֶלְבּ֖/וֹ מִמֶּ֑/נּוּ וְ/אֶת קָדְשֵׁ֧י בְנֵי יִשְׂרָאֵ֛ל לֹ֥א תְחַלְּל֖וּ וְ/לֹ֥א תָמֽוּתוּ־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/032.yaml
  text: And you will bear no sin because of it when you lift up its best part from it[a]. You shall not profane the holy things of the sons of Israel[b], and you shall not die.
translation:
  language: zh_hans
  text: 你们从其中献上最好的部分时，就不会因这事担当罪责[a]。你们不可亵渎以色列人的圣物[b]，以免你们死亡。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “最好的部分”直译可作“脂油”；在奉献的语境中，这个词常指最丰美、最上好的部分。
    reason: lexical_alternative
  - marker: b
    text: “以色列人”原文直译为“以色列的众子”，是对以色列全体民众的惯用称呼。
    reason: lexical_alternative
lexical_decisions:
- source_word: תִשְׂאוּ ... חֵטְא
  choice: 担当罪责
  rationale: נשא与חטא连用，表示承担罪责或招致罪咎；“担当罪责”既保留原文意象，也符合现代汉语宗教语境。
- source_word: עָלָיו
  choice: 因这事
  rationale: 介词על及其代词后缀回指前述什一奉献之事，表达在此事上的责任；译作“因这事”自然清楚。
- source_word: בַּהֲרִימְכֶם
  choice: 献上……时
  rationale: רום的使役式在奉献语境中指举起或提取作为献礼；“献上”比直译“举起”更自然，并保留礼仪含义。
- source_word: חֶלְבּוֹ
  choice: 其中……最好的部分
  rationale: חֶלֶב本义为“脂油”，但在此指什一之物中最丰美、上好的部分；上下文并非特指动物脂油。
- source_word: מִמֶּנּוּ
  choice: 从其中
  rationale: 回指利未人所得的什一之物，表示从中取出应献的部分。
- source_word: קָדְשֵׁי בְנֵי יִשְׂרָאֵל
  choice: 以色列人的圣物
  rationale: קָדְשֵׁי泛指分别为圣之物；בְנֵי יִשְׂרָאֵל是固定族群称谓，现代汉语以“以色列人”表达最自然。
- source_word: תְחַלְּלוּ
  choice: 亵渎
  rationale: חלל的加强式表示使圣物失去圣洁地位、把它当作俗物；“亵渎”准确保留圣与俗的对立。
- source_word: וְלֹא תָמֻתוּ
  choice: 免得死亡
  rationale: 原文以并列形式表达不可亵渎并避免死亡的结果；汉语“免得死亡”自然呈现警戒关系，但不把死亡解释为必然发生。
theological_decisions:
- issue: חֶלְבּוֹ在献祭语境中的含义
  choice: 最好的部分
  alternative: 脂油／最肥美的部分
  rationale: 本段所论是利未人从所得什一中再献什一，不限于动物祭物；因此采用习语意义，同时以脚注保留字面可能。
- issue: בְנֵי יִשְׂרָאֵל的表达
  choice: 以色列人
  alternative: 以色列的众子／以色列子民
  rationale: 这是指整个以色列群体的固定称谓；“以色列人”准确、自然，也不误导为仅指男性。
- issue: 末句与前命令的逻辑关系
  choice: 免得死亡
  alternative: 并且你们不会死亡／你们也不可死亡
  rationale: וְלֹא תָמֻתוּ形式上由וְ连接，但语境是警告亵渎圣物可能导致死亡；“免得”保留警戒语气，又不额外规定具体因果机制。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“担当罪责”“圣物”“亵渎”保留经文的礼仪与法律语域；句式避免过度古雅。
