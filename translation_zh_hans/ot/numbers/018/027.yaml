  text: וְ/נֶחְשַׁ֥ב לָ/כֶ֖ם תְּרוּמַתְ/כֶ֑ם כַּ/דָּגָן֙ מִן הַ/גֹּ֔רֶן וְ/כַֽ/מְלֵאָ֖ה מִן הַ/יָּֽקֶב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/027.yaml
  text: And your contribution will be reckoned to you like grain from the threshing floor and like the fullness from the winepress[a][b][c].
translation:
  language: zh_hans
  text: 你们所献的那一份[b]，要算作[a]你们从禾场所得的五谷，又算作你们从酒榨所得的全部出产[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“给你们计算为”或“给你们视为”。
    reason: lexical_alternative
  - marker: b
    text: “所献的那一份”也可译作“供物”；传统译法为“举祭”。
    reason: lexical_alternative
  - marker: c
    text: 希伯来文直译为“酒榨的丰满”，意思是酒榨所得的全部或丰足出产。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנֶחְשַׁב
  choice: 要给你们算作
  rationale: חשׁב的尼法勒式在此表示在礼仪和法定意义上被计算、认定为某物；“给你们算作”既保留被动含义，也符合现代汉语表达。
- source_word: תְּרוּמַתְכֶם
  choice: 你们所献的那一份
  rationale: תְּרוּמָה指从所得中分别出来献作神圣用途的一份；此处特指利未人从什一中献出的部分。“所献的那一份”清楚自然，又避免用生僻的传统术语。
- source_word: כַּדָּגָן מִן הַגֹּרֶן
  choice: 禾场上的五谷
  rationale: 保留כ的比较与דָּגָן的谷物含义；“禾场”准确传达גֹּרֶן，即打谷、扬谷之处。
- source_word: וְכַמְלֵאָה מִן הַיָּקֶב
  choice: 也算作酒榨中的全部出产
  rationale: מְלֵאָה字面为“满、丰满之物”，在与禾场五谷平行的语境中指酒榨所得的全部或丰足出产；译作“全部出产”使所指清楚，同时由脚注保留字面意象。
- source_word: מִן הַיָּקֶב
  choice: 酒榨中的
  rationale: יֶקֶב指压榨葡萄的酒榨或其槽；“酒榨”保留农业场景及与禾场的平行。
theological_decisions:
- issue: 所献之份被算作农产的法律礼仪性质
  choice: 用“算作”保留等同认定的语气
  alternative: 译为“看作”或直接说“就是”
  rationale: 经文并非说明这份礼物在物质上变成五谷或酒，而是规定它在献祭与权益方面应按农产计算；“算作”不额外引入教义解释。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“所献的那一份”适合普通读者，并以脚注保留“供物／举祭”的传统礼仪术语；“禾场”与“酒榨”维持原文的农业平行意象。
