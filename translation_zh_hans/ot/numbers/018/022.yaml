  text: וְ/לֹא יִקְרְב֥וּ ע֛וֹד בְּנֵ֥י יִשְׂרָאֵ֖ל אֶל אֹ֣הֶל מוֹעֵ֑ד לָ/שֵׂ֥את חֵ֖טְא לָ/מֽוּת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/022.yaml
  text: And the sons of Israel shall no longer come near the tent of meeting[a], lest they bear sin and die.
translation:
  language: zh_hans
  text: 以色列人不可再走近会幕，免得担当罪责而死。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “担当罪责”直译是“担当罪”，是祭司和法律语境中的说法，指承担过犯所带来的责任；也可译作“获罪”。
    reason: 说明希伯来语具体表达及其语境含义，并保留词义上的译法选择。
lexical_decisions:
- source_word: יִקְרְבוּ
  choice: 走近
  rationale: קרב表示靠近、接近；“走近”在现代汉语中自然，也保留了接近圣所的礼仪语境。
- source_word: עוֹד
  choice: 再
  rationale: 与否定词לֹא连用，表示“不再”，即今后不可再有这一行为。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 该短语在这里统指以色列民众；“以色列人”比逐字译作“以色列的儿子们”更符合现代汉语，同时准确表达其群体所指。
- source_word: אֹהֶל מוֹעֵד
  choice: 会幕
  rationale: “会幕”是简体中文圣经语境中清楚而凝练的标准称谓，对应“相会之帐幕”。
- source_word: לָשֵׂאת חֵטְא
  choice: 担当罪责
  rationale: 保留“承担/背负”这一具体意象，同时用“罪责”体现祭司与法律语境中因犯罪而承担责任的含义。
- source_word: לָמוּת
  choice: 而死
  rationale: 与前面的“担当罪责”并列，简洁表达违规接近所导致的死亡后果。
theological_decisions:
- issue: 是否明说这是未经授权接近圣所，以及是否将“担当罪”直接解释为“获罪”
  choice: 保留原文简练的禁令与后果：“不可再走近会幕，免得担当罪责而死”
  alternative: 不可再擅自接近会幕，否则就会获罪而死
  rationale: 上下文表明这是对普通以色列人接近圣所的限制，但本节没有明说“擅自”；正文不补入这一解释。“担当罪责”既保留原文“担当罪”的表达，又让现代读者看出其中的责任含义。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“不可再”保持法律禁令的力度；“会幕”沿用读者熟悉的圣所术语；脚注标记置于整句之后，说明“担当罪责”的词义。
