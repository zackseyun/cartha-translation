  text: כָּל חֵ֥רֶם בְּ/יִשְׂרָאֵ֖ל לְ/ךָ֥ יִהְיֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/014.yaml
  text: Every devoted thing in Israel shall be yours[a].
translation:
  language: zh_hans
  text: 在以色列中，一切永献之物都要归你[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在以色列中，一切被禁之物”。“永献之物”所译的希伯来语，指不可撤回地献给上帝之物；在某些语境中，也指当毁灭之物。
    reason: 说明 חֵרֶם 的技术性含义及其可能包含的毁灭意味。
lexical_decisions:
- source_word: כָּל
  choice: 一切
  rationale: 修饰集合意义的单数名词，表示这一类别的全部；“一切……之物”在现代汉语法律性语境中自然、庄重。
- source_word: חֵרֶם
  choice: 永献之物
  rationale: 该词指不可撤回地献给上帝、从普通用途分别出来之物；某些语境也含当毁灭之意。“永献之物”在正文中保留其礼仪和法律术语性质，不把本节未明说的毁灭含义写死。
- source_word: בְּיִשְׂרָאֵל
  choice: 在以色列中
  rationale: 介词 בְּ 表示范围或领域；此处指以色列群体之内。
- source_word: לְךָ
  choice: 归你
  rationale: לְ 加第二人称单数后缀表示分配或归属；上下文中的“你”指亚伦。
- source_word: יִהְיֶה
  choice: 都要归
  rationale: היה 的未完成式在律法语境中表达确定的规定或归属；结合 לְךָ 译为“要归你”符合现代汉语表达。
theological_decisions:
- issue: 如何翻译礼仪—法律术语 חֵרֶם
  choice: 永献之物
  alternative: 当毁灭之物；被禁之物
  rationale: חֵרֶם 可泛指不可撤回地归给上帝之物，在某些上下文中则特指当毁灭之物。本节只规定其归属，并未明确毁灭，因此正文采用较宽的技术性表达，并在脚注保留较强的替代含义，以免消除原文的语义张力。
translation_notes:
  register: 采用现代、庄重而易懂的律法语体。“永献之物”突出不可撤回的奉献性质；“都要归你”清楚表达对亚伦的法定分配。
