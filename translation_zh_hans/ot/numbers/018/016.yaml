  text: וּ/פְדוּיָ/ו֙ מִ/בֶּן חֹ֣דֶשׁ תִּפְדֶּ֔ה בְּ/עֶ֨רְכְּ/ךָ֔ כֶּ֛סֶף חֲמֵ֥שֶׁת שְׁקָלִ֖ים בְּ/שֶׁ֣קֶל הַ/קֹּ֑דֶשׁ עֶשְׂרִ֥ים גֵּרָ֖ה הֽוּא־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/016.yaml
  text: 'And those to be redeemed from a month old[a], you shall redeem according to your valuation: five shekels of silver, by the sanctuary shekel; it is twenty gerahs.'
translation:
  language: zh_hans
  text: 其中当赎的，你从满一个月起，要按你所估定的价赎回；赎价为五舍客勒银子，按圣所的舍客勒计算；一舍客勒是二十季拉。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“它是二十季拉”；“它”指作为标准重量的圣所舍客勒。
    reason: 说明希伯来语代词的回指对象，并保留较直译的表达。
lexical_decisions:
- source_word: וּפְדוּיָו
  choice: 其中应当赎回的
  rationale: 该被动分词带第三人称阳性单数后缀，句法较难；结合上下文，泛指其中可用赎价赎回的头生者。译文保留被动含义，并用“其中”体现后缀的关联作用。
- source_word: מִבֶּן חֹדֶשׁ
  choice: 从满一个月起
  rationale: 这是表示年龄起点的希伯来语惯用表达；“从满一个月起”自然、清楚地说明赎回义务开始适用的年龄。
- source_word: תִּפְדֶּה
  choice: 你要……赎回
  rationale: 未完成式第二人称阳性单数在律法条文中表达义务；“你要”符合现代汉语法律指令的语气。
- source_word: בְּעֶרְכְּךָ
  choice: 按你所估定的价
  rationale: עֶרֶךְ在祭司和律法语境中指核定的价额；译文也保留第二人称单数后缀。
- source_word: כֶּסֶף חֲמֵשֶׁת שְׁקָלִים
  choice: 五舍客勒银子
  rationale: 按现代汉语习惯排列计量数额和材质，同时保留古代重量兼货币单位“舍客勒”。
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: 按圣所的舍客勒计算
  rationale: 该短语指定称量和估价所依据的标准；“圣所的舍客勒”既贴近原文，也能与普通舍客勒标准区分。
- source_word: עֶשְׂרִים גֵּרָה הוּא
  choice: 一舍客勒是二十季拉
  rationale: 原文直译为“它是二十季拉”，其中阳性单数代词在语境中回指“舍客勒”。正文明确所指，以免汉语代词产生不必要的歧义；脚注保留原文形式。
