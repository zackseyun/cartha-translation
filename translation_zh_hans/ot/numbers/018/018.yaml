base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/018.yaml
  text: But their flesh shall be yours[b][a], just as the breast of the wave offering and the right thigh shall be yours.
translation:
  language: zh_hans
  text: 但它们的肉[a]要归你，像摇祭[b]的胸和右腿一样，也要归你。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“它们的肉”；此处指祭牲可食用的肉。
    reason: lexical_alternative
  - marker: b
    text: “摇祭”指在耶和华面前以礼仪动作呈献的祭物；也可译作“呈献祭”。
    reason: cultural_note
lexical_decisions:
- source_word: וּבְשָׂרָם
  choice: 但它们的肉
  rationale: בָּשָׂר本义为“肉、肉体”；在献祭语境中指可食用的祭肉。“肉”在现代汉语中自然，也保留了希伯来文具体的祭牲用语。连词וּ结合上文中血和脂油归耶和华的对照，译为“但”。
- source_word: יִהְיֶה לָּךְ
  choice: 要归你
  rationale: היה + ל表示归属或获配得某物；“要归你”既自然，又保留祭司依法所得份额的语气。
- source_word: כַחֲזֵה הַתְּנוּפָה
  choice: 像摇祭的胸
  rationale: חָזֶה指胸部；תְּנוּפָה指在耶和华面前以礼仪动作呈献的祭物或其动作。“摇祭的胸”沿用清楚而简洁的祭祀术语，并以脚注说明其文化含义。
- source_word: וּכְשׁוֹק הַיָּמִין
  choice: 和右腿一样
  rationale: שׁוֹק指腿部，献祭分肉语境中可指大腿或腿。“右腿”是现代汉语较自然且不过度限定解剖部位的表达；“一样”承接前面的比较结构。
- source_word: לְךָ יִהְיֶה
  choice: 也要归你
  rationale: 原文再次使用归属公式，强调这些部分同样分给受话者；译文保留重复，以“也”自然连接比较后的结论。
theological_decisions:
- issue: 第二人称后缀形式的变化
  choice: 两处都译为单数“你”，按上下文理解为对亚伦的直接称呼，并代表其祭司职分下的合法份额。
  alternative: 在正文中增译“你和你的子孙”或改用复数“你们”。
  rationale: 希伯来文两处第二人称后缀的形态并不一致，但上下文的直接受话者是亚伦。正文不补入原句没有明说的对象，也不试图以汉语消除原文形式上的张力。
- issue: 祭肉归属的性质
  choice: 用“归你”表达依法分配给祭司的份额。
  alternative: 译为“由你享用”，明确强调食用权。
  rationale: 上下文确实涉及可食用的祭肉，但原文使用一般的归属表达。译为“归你”可保留其范围，不把含义缩窄为单纯的食用许可。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“摇祭”保留圣经祭祀语境中的传统术语，并用脚注解释；句末重复“要归你”，对应希伯来文的强调。
