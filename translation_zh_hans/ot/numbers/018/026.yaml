  text: וְ/אֶל הַ/לְוִיִּ֣ם תְּדַבֵּר֮ וְ/אָמַרְתָּ֣ אֲלֵ/הֶם֒ כִּֽי תִ֠קְחוּ מֵ/אֵ֨ת בְּנֵֽי יִשְׂרָאֵ֜ל אֶת הַֽ/מַּעֲשֵׂ֗ר אֲשֶׁ֨ר נָתַ֧תִּי לָ/כֶ֛ם מֵ/אִתָּ֖/ם בְּ/נַחֲלַתְ/כֶ֑ם וַ/הֲרֵמֹתֶ֤ם מִמֶּ֨/נּוּ֙ תְּרוּמַ֣ת יְהוָ֔ה מַעֲשֵׂ֖ר מִן הַֽ/מַּעֲשֵֽׂר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/026.yaml
  text: 'And to the Levites you shall speak and say to them: When you take from the sons of Israel the tithe that I have given you from them as your inheritance[a], then you shall present from it Yahweh’s contribution[c][b], a tithe from the tithe.'
translation:
  language: zh_hans
  text: 你要对利未人说，告诉他们：当你们从以色列子孙[a]那里收取十分之一，就是我从他们那里赐给你们作产业的那一份时，你们要从中献出归给雅威的一份[b]，就是十分之一中的十分之一[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“以色列人”或“以色列民”。希伯来文直译为“以色列的众子”。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“雅威的份”；传统上常译作“献给雅威的举祭”。这里指从所得之物中分别出来献上的一份。
    reason: lexical_alternative
  - marker: c
    text: 直译为“十分之一中的十分之一”，即利未人从所收的十分之一中再取十分之一。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַלְוִיִּם
  choice: 利未人
  rationale: 这是现代汉语中对利未支派成员的标准称呼，准确而自然。
- source_word: תְּדַבֵּר ... וְאָמַרְתָּ
  choice: 说，告诉他们
  rationale: 保留原文法律训令中相连的两个言说动词，同时避免汉语中生硬的重复。
- source_word: כִּי תִקְחוּ
  choice: 你们……收取……时
  rationale: כִּי在这里引出命令适用的情形，译作时间关系比原因或不确定条件更合适。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列子孙
  rationale: 保留原文“以色列的众子”这一传统群体称谓，并在注释中列出自然的集合性译法。
- source_word: הַמַּעֲשֵׂר
  choice: 十分之一
  rationale: 直接表达所缴纳的十分之一，比仅在宗教语境中常见的术语更易于普通读者理解。
- source_word: אֲשֶׁר נָתַתִּי לָכֶם מֵאִתָּם בְּנַחֲלַתְכֶם
  choice: 就是我从他们那里赐给你们作产业的
  rationale: 保留神赐予、来源于以色列人以及作为利未人产业这三层关系。
- source_word: וַהֲרֵמֹתֶם
  choice: 献出
  rationale: 该使役形在礼仪语境中指将一份分别出来呈献；“献出”简洁自然，也保留献礼性质。
- source_word: תְּרוּמַת יְהוָה
  choice: 归给雅威的一份
  rationale: תְּרוּמָה指从整体中分别出来的献礼或份额；此译避免使用现代读者不易理解的“举祭”，并以注释保留属格的另一种理解。
- source_word: מַעֲשֵׂר מִן הַמַּעֲשֵׂר
  choice: 十分之一中的十分之一
  rationale: 保留介词מִן的部分关系，清楚表明利未人须从所收的十分之一中再取十分之一。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名；“雅威”以现代汉语音译保存专名性质，不以称号“主”替代。
- issue: בְּנֵי יִשְׂרָאֵל的性别形式与群体含义
  choice: 以色列子孙
  alternative: 以色列人；以色列民
  rationale: 正文保留希伯来语固定表达的亲属称谓形式，同时不把它解释为只限男性；注释说明其集合性含义。
- issue: תְּרוּמַת יְהוָה中属格的关系
  choice: 归给雅威的一份
  alternative: 雅威的份；献给雅威的举祭
  rationale: 该结构既可表达归属，也可表达献给的对象；正文采用自然且合乎语境的目的性表达，注释保留其语义张力。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。句式保留神谕中的第二人称转换：摩西对利未人说“你们”。避免以“举祭”等较晦涩的传统术语直接承担正文意义，但在脚注中予以保留；“产业”保留土地与盟约分配语境中的法律色彩。
