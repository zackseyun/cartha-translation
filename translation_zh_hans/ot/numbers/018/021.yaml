  text: וְ/לִ/בְנֵ֣י לֵוִ֔י הִנֵּ֥ה נָתַ֛תִּי כָּל מַֽעֲשֵׂ֥ר בְּ/יִשְׂרָאֵ֖ל לְ/נַחֲלָ֑ה חֵ֤לֶף עֲבֹֽדָתָ/ם֙ אֲשֶׁר הֵ֣ם עֹֽבְדִ֔ים אֶת עֲבֹדַ֖ת אֹ֥הֶל מוֹעֵֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/021.yaml
  text: And to the sons of Levi[a], behold, I have given every tithe in Israel as an inheritance, in return for the service that they perform[c][b], the service of the tent of meeting.
translation:
  language: zh_hans
  text: 至于利未人，看哪，我已经把以色列中一切的十分之一赐给他们作产业，作为他们在会幕所执行的职务的报偿。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “作为……的报偿”也可译作“作为对他们所执行职务的补偿”或“代替他们的职务”。“会幕”指以色列人在敬拜中使用、利未人在其中履行所派职责的帐幕。
    reason: 保留חֵלֶף的“报偿／补偿／代替”词义幅度，并简要说明会幕的文化背景。
lexical_decisions:
- source_word: וְ/לִ/בְנֵי לֵוִי
  choice: 至于利未人
  rationale: 原文直译为“利未的子孙”；在本节制度语境中指利未人群体。现代汉语用“利未人”自然清楚，又不改变所指。
- source_word: הִנֵּה
  choice: 看哪
  rationale: 保留原文提示注意并加强宣告语气的功能，同时维持庄重经文语体。
- source_word: נָתַתִּי
  choice: 我已经……赐给
  rationale: 完成式在此表达已经确立的赐予；“已经”体现其确定和完成，“赐给”适合上帝授予产业的语境。
- source_word: כָּל מַעֲשֵׂר בְּיִשְׂרָאֵל
  choice: 以色列中一切的十分之一
  rationale: מַעֲשֵׂר是作为奉献制度的“十分之一”；“一切”保留כָּל的总体范围。
- source_word: לְנַחֲלָה
  choice: 作产业
  rationale: נַחֲלָה指所分得并持有的产业；“作产业”比“作遗产”更符合土地与支派分配的圣经语境。
- source_word: חֵלֶף עֲבֹדָתָם
  choice: 作为他们……所得的报偿
  rationale: חֵלֶף表达交换、代替或补偿关系；“所得的报偿”在现代汉语中清楚呈现利未人的所得与其事务之间的对应关系，同时脚注保留“作为……的替代”这一可能语感。
- source_word: אֲשֶׁר הֵם עֹבְדִים
  choice: 他们办理
  rationale: 避免机械重复“服事他们所服事的服事”，以自然汉语表达他们实际承担、执行这些职责。
- source_word: אֶת עֲבֹדַת אֹהֶל מוֹעֵד
  choice: 会幕事务
  rationale: 原文为“会幕的事务/服事”。“会幕事务”简洁表达与会幕有关的职务；“会幕”是现代中文圣经语境中对אֹהֶל מוֹעֵד的通行称呼。
theological_decisions:
- issue: 十分之一与利未人职务之间的关系
  choice: 将十分之一同时表述为利未人的产业和其办理会幕事务所得的报偿
  alternative: 将חֵלֶף理解为“替代他们的事务/职务”，弱化报偿含义
  rationale: 原文并列לְנַחֲלָה与חֵלֶף עֲבֹדָתָם，既说明产业性质，也说明与职务相对应的关系；译文不把二者合并，也不额外断言它明确取代土地产业。
translation_notes:
  register: 采用现代、庄重且易懂的简体中文。“看哪”保留原文的强调语气；“产业”“会幕”沿用清楚而成熟的圣经用语。脚注标记[a]已置于相关分句之后。
