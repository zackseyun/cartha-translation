revisions:
- from: 你们要守好圣所的职守和祭坛的职守；这样，烈怒就不再临到以色列子孙[a]。
  to: 你们要履行看守圣所的职责，也要履行看守祭坛的职责；这样，忿怒就不再临到以色列子孙[a]。
  rationale: 修订仅澄清“职责”属于祭司的看守任务，消除中文修饰歧义；以重复的“履行看守……的职责”对应原文两次“守……的职守”。“这样”保留上下文所显示的结果／目的关联，不将其解释为纯粹预测；“忿怒”不添加“上帝的”，维持原文未明说主语的表达。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T04:56:40Z'
review_pass:
  verdict: revise
  source_fidelity: 译文准确传达了祭司受命承担圣所与祭坛相关职责，并以此避免以色列再遭忿怒的结果／目的关系。末句未擅自补出忿怒的发出者，也保留了原文的含蓄。惟“守好圣所的职守和祭坛的职守”容易被理解为圣所和祭坛本身各有“职守”，没有清楚表达祭司所承担的看守职责；宜改为明确的动宾结构。
  naturalness: “守好……职守”在现代汉语中略显搭配生硬，“祭坛的职守”尤其不自然。改作“履行看守圣所的职责，也履行看守祭坛的职责”更清楚自然，并保留原文两次重复“职责／看守任务”的结构。
  terminology: “圣所”“祭坛”准确。“烈怒”可理解，但“忿怒”是现代汉语圣经语体中更常用且庄重的对应词，能表达קֶצֶף的审判性强烈愤怒而不增添主体。“以色列子孙”可保留为传统群体称谓；脚注应将“众子”改成更贴近原文的“儿子们”。
  issues:
  - severity: medium
