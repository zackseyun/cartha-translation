    rationale: מִשְׁמֶרֶת指受话者承担的看守职责，不是圣所或祭坛所拥有的职守。修订为“看守……的职责”可明确施事与职责内容，同时保留两次出现的原文名词。
  - severity: low
    issue: 脚注“以色列的众子”未按通常中文直译充分反映原文“sons”。
    rationale: “众子”可通，但“以色列的儿子们”更直接对应בני ישראל；主文仍可用惯用的“以色列子孙”指称该群体。
