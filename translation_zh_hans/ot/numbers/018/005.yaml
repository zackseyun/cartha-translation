  text: וּ/שְׁמַרְתֶּ֗ם אֵ֚ת מִשְׁמֶ֣רֶת הַ/קֹּ֔דֶשׁ וְ/אֵ֖ת מִשְׁמֶ֣רֶת הַ/מִּזְבֵּ֑חַ וְ/לֹֽא יִהְיֶ֥ה ע֛וֹד קֶ֖צֶף עַל בְּנֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/005.yaml
  text: And you shall keep charge of the sanctuary and the charge of the altar[a], so that there may no longer be wrath against the sons of Israel.
translation:
  language: zh_hans
  text: 你们要履行看守圣所的职责，也要履行看守祭坛的职责；这样，忿怒就不再临到以色列子孙[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“以色列人”。希伯来文直译为“以色列的儿子们”。
    reason: 说明这一群体称谓的字面形式，并提供现代汉语中较通俗的译法。
lexical_decisions:
- source_word: וּשְׁמַרְתֶּם
  choice: 你们要守好
  rationale: שׁמר在此与מִשְׁמֶרֶת构成祭司职务用语，兼有看守、谨守和履行职责之意。“守好”既保留守护意味，也自然表达郑重的责任要求。
- source_word: מִשְׁמֶרֶת
  choice: 职守
  rationale: 该词在祭司语境中指受托承担的守护职责。“职守”兼顾职责与守卫两层含义；两次重复译出，以反映希伯来文分别提到圣所和祭坛。
- source_word: הַקֹּדֶשׁ
  choice: 圣所
  rationale: 本节与祭坛并列，所指是神圣区域或圣所，而非抽象的“圣洁”。
- source_word: הַמִּזְבֵּחַ
  choice: 祭坛
  rationale: 这是该词在献祭礼仪语境中的标准、准确译法。
- source_word: וְלֹא יִהְיֶה עוֹד
  choice: 这样……就不再
  rationale: 希伯来文形式上以连词连接否定未完成式；上下文显示前述守职与避免烈怒之间具有结果或目的关系。“这样……就不再”自然呈现这种关系，同时保留结果陈述的语气。
- source_word: קֶצֶף
  choice: 烈怒
  rationale: 该词在祭司与审判语境中指强烈、带来惩罚的忿怒。“烈怒”比一般的“怒气”更能表达其严重性。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列子孙
  rationale: 保留源语“以色列的众子”这一传统群体称谓，同时在现代汉语中仍可理解为以色列全体民众；脚注列出更通俗的译法。
theological_decisions:
- issue: 末句与祭司守职之间是单纯预测，还是目的／结果关系
  choice: 译作“这样……就不再”，呈现守好圣所和祭坛的职守可避免烈怒再次临到以色列的结果关系
  alternative: 译作“烈怒也必不再临到”，仅表达将来的事实，不明确标示逻辑关系
  rationale: 近处上下文规定祭司和利未人的职责，为的是防止越权亲近圣物所招致的审判；但译文没有把目的关系说得比上下文更强，而是以“这样”保留目的与结果之间的张力。
- issue: 烈怒的发出者是否应在译文中明说
  choice: 不增译“上帝的”
  alternative: 译作“上帝的烈怒”
  rationale: 上下文可使读者明白这是神圣审判，但本节希伯来文本身没有明说发怒的主语，因此译文保持源文的含蓄。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“守好……职守”保留祭司受托看守的意味；重复“职守”反映原文结构。分号使命令与其目的／结果清楚相连。
