base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/020.yaml
  text: And Yahweh said to Aaron[a], “In their land you shall not inherit, and no portion shall be yours among them. I am your portion and your inheritance among the sons of Israel.”
translation:
  language: zh_hans
  text: 雅威对亚伦说：“你不可在他们的地上承受产业，在他们中间也不可有你的份。我就是你的份，也是你在以色列子孙[a]中的产业。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“以色列人”或“以色列民”。希伯来文直译为“以色列的儿子们”。
    reason: 说明原文群体称谓的字面形式及自然汉语替代译法。
lexical_decisions:
- source_word: יְהוָה
  choice: 雅威
  rationale: 采用神圣四字名的现代汉语音译，而不用“主”这一称号，以保留经文中的专名性质。
- source_word: בְּאַרְצָם
  choice: 在他们的地上
  rationale: 这里指以色列人的领土产业；“地”保留了土地与产业分配的语境。
- source_word: תִנְחָל
  choice: 承受产业
  rationale: נחל在此表示取得或拥有继承所得的产业；“承受产业”既贴近原文动词，也符合现代汉语圣经语体。
- source_word: חֵלֶק
  choice: 份
  rationale: “份”自然表达分得的份额，并在“不可有你的份”与“我就是你的份”之间保留原文的关键词复现。
- source_word: בְּתוֹכָם
  choice: 在他们中间
  rationale: 表达亚伦在以色列群体之中没有土地份额，兼顾空间与群体关系。
- source_word: אֲנִי חֶלְקְךָ
  choice: 我就是你的份
  rationale: 直译这一核心宣告，并与前句的“份”形成明确呼应，不增添对其具体实现方式的解释。
- source_word: נַחֲלָתְךָ
  choice: 你的产业
  rationale: נַחֲלָה在土地分配语境中通常指继承所得的产业；“产业”保留其法律与盟约色彩。
- source_word: בְּתוֹךְ בְּנֵי יִשְׂרָאֵל
  choice: 在以色列子孙中
  rationale: 保留בְּנֵי יִשְׂרָאֵל的亲属性、群体性表达；脚注注明现代汉语中较自然的等值说法。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文使用神的专名而非称号；“雅威”按较通行的学术重构音译，避免以“主”替换专名。
- issue: “我就是你的份，也是你的产业”的含义
  choice: 保留“份”与“产业”的并列表述
  alternative: 释义为“我必供应你”或“你要从献物中得供养”
  rationale: 原文以神自己作为亚伦的份与产业，具有浓缩的神学张力；正文不把这一宣告缩减为物质供给或其他单一解释。
- issue: בְּנֵי יִשְׂרָאֵל的群体称谓
  choice: 以色列子孙
  alternative: 以色列人；以色列民
  rationale: “以色列子孙”较形式对应原文，并保留家族—盟约色彩；同时用脚注提供现代集体称谓。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。以“承受产业—份—产业”维持本节土地继承的语义链；句式尽量贴近希伯来文的两重否定与随后神圣宣告，同时避免生硬直译。
