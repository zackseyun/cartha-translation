  to: 他们要守你所交付的职责，也要承担看守整个帐幕的职责；只是不可走近圣所的器具或祭坛，这样，他们和你们就都不会死亡。
  rationale: 修订仅改善中文的句法和搭配：“承担看守整个帐幕的职责”明确说明职责的对象；末句改为自然的否定结果句，同时保留死亡警告涉及“他们”和“你们”两方。未增添任何身份或教义性解释。
