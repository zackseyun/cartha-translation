  source_fidelity: 译文准确保留了利未人须承担亚伦所交付的职责、也须负责整个帐幕的职守，以及不得接近圣物器具和祭坛的限制。第二人称由单数“你”转为复数“你们”也得到保留。惟“全帐幕的职责”在中文中容易被理解为“帐幕本身的职责”，宜改为表示对整个帐幕所负的职守。
  naturalness: “守你所交付的职责”尚可，但“守全帐幕的职责”搭配不够自然。改作“承担看守整个帐幕的职责”清楚而庄重，并维持原文重复的职责／职守概念。
  terminology: “帐幕”“圣所的器具”“祭坛”均合乎本段礼仪语境；“圣所的器具”可保留原文构造关系，不必改为可能缩窄或扩展的“圣物”。死亡警告宜译为条件下的结果，避免把希伯来语连接词的具体逻辑关系过度限定为单一解释。
