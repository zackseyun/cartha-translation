  text: וְ/שָֽׁמְרוּ֙ מִֽשְׁמַרְתְּ/ךָ֔ וּ/מִשְׁמֶ֖רֶת כָּל הָ/אֹ֑הֶל אַךְ֩ אֶל כְּלֵ֨י הַ/קֹּ֤דֶשׁ וְ/אֶל הַ/מִּזְבֵּ֨חַ֙ לֹ֣א יִקְרָ֔בוּ וְ/לֹֽא יָמֻ֥תוּ גַם הֵ֖ם גַּם אַתֶּֽם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/003.yaml
  text: They shall keep your charge and the charge of the whole tent[a], but they shall not come near the vessels of the sanctuary or the altar[b], so that neither they nor you may die.
translation:
  language: zh_hans
  text: 他们要守你所交付的职责，也要承担看守整个帐幕的职责；只是不可走近圣所的器具或祭坛，这样，他们和你们就都不会死亡。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְשָׁמְרוּ מִשְׁמַרְתְּךָ
  choice: 他们要守你所交付的职责
  rationale: שׁמר与מִשְׁמֶרֶת连用，指守住所委派的职分或责任；“守……职责”保留原文词根搭配的力度，“你”对应指向亚伦的第二人称阳性单数后缀。
- source_word: וּמִשְׁמֶרֶת כָּל הָאֹהֶל
  choice: 也要守全帐幕的职责
  rationale: 重复“守……职责”以对应原文重复的מִשְׁמֶרֶת；“全帐幕”体现כָּל，并按语境将普通名词“帐棚”译为指会幕圣所的“帐幕”。
- source_word: אַךְ
  choice: 只是
  rationale: 表达对前述职责的限制和例外，比单纯转折词更能体现此处的限定作用。
- source_word: אֶל כְּלֵי הַקֹּדֶשׁ
  choice: 圣所的器具
  rationale: כְּלֵי可指器具、用具；הַקֹּדֶשׁ在此可理解为圣所或神圣领域。“圣所的器具”保留其构造关系，也避免把范围缩窄为某类容器。
- source_word: וְאֶל הַמִּזְבֵּחַ
  choice: 或祭坛
  rationale: 原文连接词为“和”，但在汉语否定并列结构“不……或……”中，“或”自然清楚地表示两者都不可接近。
- source_word: לֹא יִקְרָבוּ
  choice: 不可走近
  rationale: קרב具有空间上接近之义；“走近”清楚表达利未人不得接近受限制的圣物和祭坛。
- source_word: וְלֹא יָמֻתוּ גַם הֵם גַּם אַתֶּם
  choice: 免得他们和你们都死亡
  rationale: 将死亡理解为违反禁令所要避免的后果；“他们和你们都”直接保留גַם...גַם对双方的明确包含。复数“你们”对应אַתֶּם。
theological_decisions:
- issue: 受话者与被限制者的身份
  choice: “你”指上下文中的亚伦，“他们”指协助祭司的利未人；利未人须履行职责，却不可接近圣所器具或祭坛。
  alternative: 把“你”宽泛理解为祭司群体，不突出亚伦本人。
  rationale: מִשְׁמַרְתְּךָ带第二人称阳性单数后缀，而结尾אַתֶּם转为复数，原文有意区分亚伦作为直接受话者与包含祭司群体的“你们”。译文保留这一人称变化。
- issue: 死亡警告涉及谁
  choice: 若越过神圣界限，利未人和祭司双方都面临死亡。
  alternative: 死亡警告只针对利未人。
  rationale: גַם הֵם גַּם אַתֶּם明确表示“他们和你们双方”，不可删去祭司一方。
- issue: 死亡句与禁令的逻辑关系
  choice: 译作“免得”，表达违反禁令可能带来的致命后果。
  alternative: 译作并列结果“他们和你们也不致死亡”。
  rationale: 希伯来语表面以וְלֹא连接，既可形式化地理解为“也不死亡”，也可在禁令语境中表达所要避免的后果；“免得”在现代汉语中更自然，同时未断言死亡必然发生。
translation_notes:
  register: 采用现代、庄重而易懂的经文语体。“职责”比“职守”更通行，“帐幕”保留圣所帐棚的语境。“死亡”比口语化的“死”略显庄重。原文由第二人称单数“你”转为复数“你们”，译文予以保留。
