id: NUM.18.13
reference: Numbers 18:13
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: בִּכּוּרֵ֞י כָּל אֲשֶׁ֧ר בְּ/אַרְצָ֛/ם אֲשֶׁר יָבִ֥יאוּ לַ/יהוָ֖ה לְ/ךָ֣ יִהְיֶ֑ה כָּל טָה֥וֹר בְּ/בֵיתְ/ךָ֖ יֹאכֲלֶֽ/נּוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/013.yaml
  text: The firstfruits of everything in their land that they bring to Yahweh shall be yours[a]. Everyone in your house who is clean may eat it.
translation:
  language: zh_hans
  text: 他们地里一切初熟之物，就是他们献给耶和华的，都要归你。你家中凡洁净[a]的人都可以吃。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 即礼仪上洁净。
    reason: 说明祭司法规语境中“洁净”的具体含义。
lexical_decisions:
- source_word: בִּכּוּרֵי
  choice: 初熟之物
  rationale: 指收成中最先成熟并献上的出产；“初熟之物”既保留祭祀语境，也符合现代中文圣经用语。
- source_word: כָּל אֲשֶׁר בְּאַרְצָם
  choice: 他们地里一切
  rationale: 紧接“初熟之物”，表示这些出产来自他们的土地；不额外限定具体农作物类别。
- source_word: אֲשֶׁר יָבִיאוּ לַיהוָה
  choice: 他们献给耶和华的
  rationale: יָבִיאוּ本义为“带来”，在本节献祭语境中译作“献给”自然清楚，同时保留其呈献给耶和华的含义。
- source_word: לַיהוָה
  choice: 耶和华
  rationale: 以现代中文中广为人知的专名形式呈现希伯来文神名יהוה。
- source_word: לְךָ יִהְיֶה
  choice: 都要归你
  rationale: 表达这些供物被指定给亚伦、成为其所得；“归你”简洁自然。
- source_word: כָּל טָהוֹר
  choice: 凡洁净的人
  rationale: 保留טָהוֹר的简洁表达；在祭司法规语境中主要指礼仪上的洁净，并以脚注说明。
- source_word: בְּבֵיתְךָ
  choice: 你家中
  rationale: 既贴近“在你家里”的字面结构，也自然涵盖亚伦家中的成员。
- source_word: יֹאכֲלֶנּוּ
  choice: 都可以吃
  rationale: 此处未完成式在法规语境中表达获准享用的资格，而不只是将来的动作。
theological_decisions:
- issue: 祭司法规中“洁净”的性质
  choice: 指亚伦家中在礼仪上洁净的人可以吃这份供物
  alternative: 泛指道德上清白或纯洁的人
  rationale: 民数记18章讨论祭司所得与圣洁、洁净方面的规定，因此טָהוֹר在这里首先是礼仪范畴，而非笼统的道德评价。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“就是”使关系从句与“初熟之物”的联系更清楚；脚注标记紧随“洁净”，避免误指前句的归属规定。
