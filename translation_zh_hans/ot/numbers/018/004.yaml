base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/004.yaml
  text: They shall join you and keep the charge of the tent of meeting for all the service of the tent[a], but no outsider shall come near you.
translation:
  language: zh_hans
  text: 他们要与你联合，承担会幕的职守，办理会幕的一切事务；但外人[a]不可接近你们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“未经授权的人”。这里的希伯来词指不在获准承担圣所职分者之列的人，不一定指外族人。
    reason: 说明זָר在本处按圣所职分而非族裔划分的含义，并保留可行的解释性译法。
lexical_decisions:
- source_word: וְנִלְווּ עָלֶיךָ
  choice: 他们要与你联合
  rationale: נלוה（尼法勒式）与介词 על 连用，表示依附、联合于某人；这里指利未人归属亚伦并协助其职务。“与你联合”保留关系和职能两层含义。
- source_word: וְשָׁמְרוּ אֶת־מִשְׁמֶרֶת אֹהֶל מוֹעֵד
  choice: 负责会幕的职守
  rationale: שמר את־משמרת 是祭司文献中表示谨守、承担受托职责的固定搭配；“负责……职守”比逐字译作“看守……看守之责”更自然，也保留正式受命的意味。
- source_word: אֹהֶל מוֹעֵד
  choice: 会幕
  rationale: 现代中文圣经语境中通行且简洁的圣所名称，对应“相会之帐幕”。
- source_word: לְכֹל עֲבֹדַת הָאֹהֶל
  choice: 办理帐幕的一切事务
  rationale: עֲבֹדָה 在会幕语境指受派的服役、工作或事务；“办理……事务”既涵盖具体劳务，也不把范围缩窄为礼仪活动。此处按原文保留“帐幕”，与前面的正式名称“会幕”相应。
- source_word: וְזָר
  choice: 但任何未经授权的人
  rationale: זָר 在圣所法规中指不属于获准职分、无权接近的人，并非主要表示族裔上的外国人；“未经授权的人”准确表达此处准入身份。
- source_word: לֹא יִקְרַב אֲלֵיכֶם
  choice: 都不可走近你们
  rationale: קרב 表示进入圣所相关的近处或接近范围；“走近”保留空间性。אֲלֵיכֶם 为复数，故明确译作“你们”。
theological_decisions:
- issue: זָר 在圣所法规中的身份含义
  choice: 未经授权的人，即不在获准祭司或利未职分之内者
  alternative: 外人；陌生人；外国人
  rationale: 上下文关注圣所职分和接近权限，而非族裔归属。这样翻译避免把禁令误解为针对外族人，同时不额外界定经文未明确列出的全部人员类别。
- issue: אֲלֵיכֶם 的复数对象
  choice: 你们
  alternative: 你
  rationale: 原文从前面的单数“你”转为复数，可能将亚伦及与他共同任职者纳入对象；正文保留这一数的变化，不替经文消解其指向。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“负责……职守，办理……”自然呈现受托责任与实际服役；保留“你”到“你们”的单复数转换。脚注标记已置于其所解释的词组之后。
