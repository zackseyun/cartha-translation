revisions:
- from: 耶和华对亚伦说：“看哪，我亲自把管理我所得举祭[a]的职责交给了你。以色列子孙所献的一切圣物，我都赐给你，作为你因受膏所得的份[b]，也赐给你的儿子；这是永远的定例。”
  to: 耶和华对亚伦说：“看哪，我亲自把管理我的举祭——就是以色列子孙一切圣物——的职责交给你；我把这些赐给你和你的儿子，作为因受膏而得的份，是永远的定例。”
  rationale: 将“我所得举祭”改为“我的举祭”，以忠实、自然地表达希伯来语第一人称属格；并以“就是以色列子孙一切圣物”明确该短语与后续圣物的关系。重组后仍保留受膏所关联的祭司份额、亚伦及其儿子的受赐对象，以及“永远的定例”的法律持续性。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T04:56:40Z'
review_pass:
  verdict: revise
  source_fidelity: 草稿总体准确传达了耶和华将以色列圣物中的祭司份额赐给亚伦及其儿子的内容，也保留了受膏与永久定例的关联。但“我所得举祭”将第一人称属格处理成“耶和华所得”，中文不够自然，并可能不必要地把重点移到“所得”这一动作上。原文直接说“我的举祭/奉献物”。
  naturalness: 整体庄重易懂，但“管理我所得举祭的职责”结构生硬。“我一切举祭——就是以色列子孙一切圣物——”能更清楚地呈现原文中“我的举祭”与“以色列子孙一切圣物”的同指关系。
  terminology: “耶和华”“举祭”“圣物”“受膏”“定例”均符合中文圣经及礼仪语境。“因受膏而得的份”适当地表达 לְמָשְׁחָה 在本段作为祭司受膏职分所享份额的通常理解；脚注应保留较贴近字面的表达，避免将该短语绝对化为单一解释。
