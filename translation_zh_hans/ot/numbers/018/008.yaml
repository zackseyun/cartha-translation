base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/008.yaml
  text: 'Then Yahweh spoke to Aaron: “And I[a], behold, I have given you the charge of my contributions, all the holy gifts of the sons of Israel. I have given them to you as your anointing portion[c][b], and to your sons as a permanent statute.”'
translation:
  language: zh_hans
  text: 耶和华对亚伦说：“看哪，我亲自把管理我的举祭——就是以色列子孙一切圣物——的职责交给你；我把这些赐给你和你的儿子，作为因受膏而得的份，是永远的定例。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文中广为人知的神圣名字音译，不以“主”这一称号代替专名。
- source_word: וַאֲנִי הִנֵּה
  choice: 看哪，我亲自
  rationale: “看哪”保留 הִנֵּה 的提示、强调作用，“我亲自”体现独立人称代词 אֲנִי 的强调，中文表达自然。
- source_word: מִשְׁמֶרֶת
  choice: 管理……的职责
  rationale: 此词指受托承担的看守、管理责任；在祭司职分的语境中译作“管理……的职责”清楚而庄重。
- source_word: תְּרוּמֹתַי
  choice: 我所得举祭
  rationale: תְּרוּמָה 是献给耶和华、分别出来的供物，律法语境中传统称为“举祭”；加“所得”表明其归属关系，而非暗示耶和华亲自献祭。
- source_word: לְכָל קָדְשֵׁי בְנֵי יִשְׂרָאֵל
  choice: 以色列子孙所献的一切圣物
  rationale: 保留“以色列子孙”这一盟约群体称谓；“圣物”准确表达 קָדְשֵׁי，并依上下文用“所献”说明这些分别为圣之物的来源。
- source_word: לְמָשְׁחָה
  choice: 作为你因受膏所得的份
  rationale: 体现这些圣物因亚伦受膏承接祭司职分而归给他，同时以脚注保留“作为膏立之用”等语法可能。
- source_word: לְחָק עוֹלָם
  choice: 这是永远的定例
  rationale: “定例”保留 חָק 的法定、规定性质，“永远”对应 עוֹלָם 的持续效力。
theological_decisions:
- issue: לְמָשְׁחָה 与亚伦受膏职分的关系
  choice: 作为你因受膏所得的份
  alternative: 作为膏立之用
  rationale: 上下文谈论归给亚伦及其儿子的祭司份额，较可能指因受膏祭司职分所得之份；脚注保留希伯来语较直译的另一理解，避免消除原文张力。
- issue: בְנֵי יִשְׂרָאֵל 的群体称谓
  choice: 以色列子孙
  alternative: 以色列人
  rationale: 采用中文圣经语体中自然且能保留原文亲属—盟约意象的表达，不将其误解为仅指成年男性。
translation_notes:
  register: 采用现代、庄重而易懂的普通话书面语。保留“耶和华”“举祭”“圣物”“定例”等关键礼仪和盟约用语，并借助脚注解释较专业或有歧义的表达。
