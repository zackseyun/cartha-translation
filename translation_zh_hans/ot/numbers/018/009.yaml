  - severity: medium
    issue: 正文把“从火中”确定化为“从火中留下的”。
    rationale: מִן הָאֵשׁ字面仅为“从火中”；祭司份额的语境支持相关解释，但不宜在正文把“未被焚烧而留出”作为无保留的唯一表达。
  - severity: low
    issue: “都要归你”与末句“归你和你的儿子所有”重复，且造成句法负担。
    rationale: 原文前句说明祭司所得份额，末句再宣告其“至圣”并归亚伦及其儿子；中文可保留两个层次而避免机械重复。
