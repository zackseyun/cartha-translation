language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: זֶֽה יִהְיֶ֥ה לְ/ךָ֛ מִ/קֹּ֥דֶשׁ הַ/קֳּדָשִׁ֖ים מִן הָ/אֵ֑שׁ כָּל קָ֠רְבָּנָ/ם לְֽ/כָל מִנְחָתָ֞/ם וּ/לְ/כָל חַטָּאתָ֗/ם וּ/לְ/כָל אֲשָׁמָ/ם֙ אֲשֶׁ֣ר יָשִׁ֣יבוּ לִ֔/י קֹ֣דֶשׁ קָֽדָשִׁ֥ים לְ/ךָ֛ ה֖וּא וּ/לְ/בָנֶֽי/ךָ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/009.yaml
  text: 'This shall be yours from the most holy things[a], from the fire: every offering of theirs, every grain offering of theirs, every sin offering of theirs, and every guilt offering of theirs, which they return to me[c][b]. It is most holy for you and for your sons.'
translation:
  language: zh_hans
  text: “以下这些是你从至圣之物中、从火中所得的：他们献还给我的一切供物、素祭、赎罪祭[b]和赎愆祭[c]；这些都是至圣之物，归你和你的儿子。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: “赎罪祭”也可译为“洁净祭”。
    reason: lexical_alternative
  - marker: c
    text: “赎愆祭”也可译为“赔偿祭”。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקֹּדֶשׁ הַקֳּדָשִׁים
  choice: 从至圣之物中
  rationale: 这里的叠加强调结构表示祭物中最高等级的圣洁，并非指圣所内的“至圣所”。
- source_word: מִן הָאֵשׁ
  choice: 从火中留下的
  rationale: 原文直译为“从火中”；结合祭司所得祭物份额的语境，译文表达未被火焚烧、留给祭司的部分，同时用脚注保留直译。
- source_word: קָרְבָּנָם
  choice: 他们的一切供物
  rationale: קָרְבָּן泛指带到上帝面前的供物；“供物”既自然，也不局限于某一种祭。
- source_word: מִנְחָתָם
  choice: 他们的一切素祭
  rationale: 在祭祀律例中，מִנְחָה通常指以谷物制成的祭物；“素祭”是现代中文圣经语境中清楚而简洁的称呼。
- source_word: חַטָּאתָם
  choice: 他们的一切赎罪祭
  rationale: 本节列举祭物，故该词指与罪及洁净相关的祭；正文采用较通行的“赎罪祭”，脚注保留“洁净祭”这一侧重礼仪洁净的译法。
- source_word: אֲשָׁמָם
  choice: 他们的一切赎愆祭
  rationale: אָשָׁם在祭祀律例中指涉及罪责及赔偿的祭；正文采用传统而明确的“赎愆祭”，脚注说明也可译为“赔偿祭”。
- source_word: אֲשֶׁר יָשִׁיבוּ לִי
  choice: 他们献还给我的
  rationale: 使役式שוב带有归还、交还之意；“献还”既保留返回给上帝的意象，也在祭祀语境中比单说“归还”自然。
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: 至圣的
  rationale: 该短语在此作表语，说明这些祭物份额的圣洁等级，而非空间位置。
- source_word: לְךָ ... וּלְבָנֶיךָ
  choice: 归你和你的儿子所有
  rationale: 原文明确指亚伦及其男性祭司后裔，因此保留“儿子”，不泛化为“儿女”或“后代”。
theological_decisions:
- issue: 祭祀圣洁术语是否指至圣所
  choice: 至圣之物／至圣的
  alternative: 至圣所／圣中之圣
  rationale: 上下文谈的是祭物及祭司所得的份额，原文短语在此标示圣洁等级，不应译成圣所内部空间。
- issue: מִן הָאֵשׁ所指的祭司份额
  choice: 从火中留下的
  alternative: 从火中
  rationale: 正文按祭祀语境说明这些是未被焚烧而归祭司的部分，但脚注保留原文简练且略有歧义的表达，避免把解释当作唯一可能。
- issue: “赎罪祭”的礼仪功能
  choice: 赎罪祭
  alternative: 洁净祭
  rationale: 正文采用普通读者较熟悉的名称，同时以脚注保存该词在祭司文献中可能着重洁净功能的理解。
- issue: 亚伦后裔的性别指称
  choice: 儿子
  alternative: 儿女／后代
  rationale: 原文使用明确的阳性亲属词，而且此处涉及男性祭司职分，因此不作中性化处理。
translation_notes:
  register: 采用现代、庄重且易懂的书面普通话。保留祭祀术语“素祭、赎罪祭、赎愆祭”，并通过脚注呈现重要词义选择。句式略作展开，以清楚表达“都要归你”的统摄关系，同时不消除“从火中”这一原文表达的张力。
