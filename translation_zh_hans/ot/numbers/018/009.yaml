  to: “以下这些是你从至圣之物中、从火中所得的：他们献还给我的一切供物、素祭、赎罪祭[b]和赎愆祭[c]；这些都是至圣之物，归你和你的儿子。”
  rationale: 修订将“献还给我的”前置为定语，明确它修饰全部四类祭物；正文保留“从火中”的简练表达，并以脚注说明其祭祀语境下的通常所指，避免过度确定。祭祀术语、至圣等级以及“儿子”的男性指称均予保留。
