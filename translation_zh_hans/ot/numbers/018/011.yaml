source:
  edition: WLC
  text: וְ/זֶה לְּ/ךָ֞ תְּרוּמַ֣ת מַתָּנָ֗/ם לְ/כָל תְּנוּפֹת֮ בְּנֵ֣י יִשְׂרָאֵל֒ לְ/ךָ֣ נְתַתִּ֗י/ם וּ/לְ/בָנֶ֧י/ךָ וְ/לִ/בְנֹתֶ֛י/ךָ אִתְּ/ךָ֖ לְ/חָק עוֹלָ֑ם כָּל טָה֥וֹר בְּ/בֵיתְ/ךָ֖ יֹאכַ֥ל אֹתֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/011.yaml
  text: 'And this is yours: the contribution of their gifts[a], with all the wave offerings of the sons of Israel. I have given them to you, and to your sons and your daughters with you, as a permanent statute[b]. Everyone in your house who is clean may eat it.'
translation:
  language: zh_hans
  text: 这是归你的：以色列人所献礼物的举祭[a]，以及他们一切的摇祭。我已经把这些赐给你，也赐给你的儿子和女儿，作为永远的定例。你家中凡洁净的人[b]都可以吃这些。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “举祭”指从所献礼物中分别出来、供神圣用途的份额；也可译作“举献”。
    reason: lexical_alternative
  - marker: b
    text: 这里的“洁净”是指礼仪上洁净，不只是身体干净，也不是泛指道德正直。
    reason: cultural_note
lexical_decisions:
- source_word: תְּרוּמַת מַתָּנָם
  choice: 他们礼物中所献的举祭
  rationale: תְּרוּמָה指从礼物中分别出来、献作神圣用途的份额；“举祭”保留祭司律法中的专门含义，“他们礼物中所献的”也保留מַתָּנָם的复数所属关系。
- source_word: תְּנוּפֹת
  choice: 摇祭
  rationale: 这是指在耶和华面前按礼仪摇动呈献之物的标准祭祀术语，与“举祭”加以区分。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 该固定表达在此为集体称谓；现代汉语用“以色列人”自然、准确，并不排除女性。
- source_word: נְתַתִּים
  choice: 我把这些赐给
  rationale: 完成式表示这些祭物的归属已经确定，且持续有效；“把这些赐给”在汉语中清楚表达已作出的授予。
- source_word: וּלְבָנֶיךָ וְלִבְנֹתֶיךָ אִתָּךְ
  choice: 也赐给与你同在的儿子和女儿
  rationale: 明确保留原文分别提到儿子与女儿；“与你同在”照应亚伦家中的成员范围。
- source_word: לְחָק עוֹלָם
  choice: 作为永远的定例
  rationale: חֹק具有固定法例或规定份额的法律色彩；עוֹלָם表达持续长久的效力，“永远的定例”保留原文措辞及其约内语境张力。
- source_word: כָּל טָהוֹר בְּבֵיתְךָ
  choice: 你家中凡洁净的人
  rationale: “家中”既可指住宅，也自然涵盖家属范围；“洁净”保留祭司律法中的礼仪类别，并用脚注避免被误解为一般卫生或道德评价。
- source_word: יֹאכַל אֹתוֹ
  choice: 都可以吃
  rationale: 此处未完成式在法规语境中表达许可和资格；“可以吃”比单纯将来时更准确。
theological_decisions:
- issue: 洁净的性质
  choice: 按礼仪洁净
  alternative: 道德上纯洁或身体干净
  rationale: 本节规定亚伦家中谁有资格吃圣物，上下文属于祭司礼仪律法，因此טָהוֹר所指是礼仪上的洁净。
- issue: עוֹלָם的持续性
  choice: 正文保留“永远”，不在译文中限定其期限
  alternative: 长期的、在旧约制度存续期间有效的
  rationale: 原词本身可表达久远、恒常或永久；正文不以系统神学预先消解其语义张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。保留“举祭”“摇祭”等必要的祭祀术语，并以脚注解释较陌生的概念；句法略作汉语化处理，但保留原文的归属、家庭成员和礼仪资格等信息。
