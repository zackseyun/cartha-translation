base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/002.yaml
  text: And also bring near with you your brothers[a], the tribe of Levi, your father's tribe, so that they may be joined to you and serve you[b], while you and your sons with you are before the tent of the testimony.
translation:
  language: zh_hans
  text: 你也要把你的弟兄，就是利未支派、你父亲所属支派的人，带到你这里来，好叫他们归附于你，服侍你[a]；而你和你的儿子同在，要在见证之幕前[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“与你联合”或“陪伴你”。这里的希伯来动词与“利未”这一名字彼此呼应。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译为“见证之幕”；有些译本按较常见的相关称呼译作“会幕”。
    reason: alternative_reading
lexical_decisions:
- source_word: וְגַם
  choice: 你也要
  rationale: 体现句首连接词与副词的递加强调，同时符合现代汉语命令句的自然表达。
- source_word: אַחֶיךָ
  choice: 你的弟兄
  rationale: 保留希伯来的亲属称谓；上下文表明所指是亚伦的利未族同胞。
- source_word: מַטֵּה לֵוִי שֵׁבֶט אָבִיךָ
  choice: 你父亲的支派利未支派
  rationale: 将两个同位表达合并为自然而清楚的汉语，说明利未支派就是亚伦父系所属的支派。
- source_word: הַקְרֵב אִתָּךְ
  choice: 领来与你同在
  rationale: 既保留使之靠近、领近的使役含义，也表达他们与亚伦共同承担职事的关系。
- source_word: וְיִלָּווּ עָלֶיךָ
  choice: 使他们与你联合
  rationale: 保留לוה所含的联结、依附之意，并在脚注中说明它与“利未”这一名字的语音和词义呼应。
- source_word: וִישָׁרְתוּךָ
  choice: 服侍你
  rationale: 直接表达שרת的服务含义，不加入特定教派的职分术语。
- source_word: וְאַתָּה וּבָנֶיךָ אִתָּךְ
  choice: 至于你和同你一起的儿子
  rationale: 用“至于”标明亚伦及其儿子与利未人之间的对应和职分区别。
- source_word: לִפְנֵי אֹהֶל הָעֵדֻת
  choice: 在见证之幕前
  rationale: 按马所拉文本译出“见证之幕”，不因熟悉的会幕用语而改成“会幕”；“供职”补明汉语所需的省略谓语。
theological_decisions:
- issue: אֹהֶל הָעֵדֻת的译法
  choice: 见证之幕
  alternative: 会幕
  rationale: 本节希伯来文明确使用עֵדוּת（见证），而非מוֹעֵד（相会、约定的时刻）。因此保留原文措辞及其盟约见证意味，不与较常见的“会幕”表达调和。
- issue: 末句省略谓语的处理
  choice: 补出“供职”
  alternative: 保留无谓语结构：“至于你和同你一起的儿子，在见证之幕前”
  rationale: 希伯来文可承接前句שרת的职事语义；现代汉语若完全照录会形成残句，因此以“供职”明确省略内容，同时不把利未人“服侍亚伦”与祭司在幕前的职事混为一谈。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“弟兄”保留原文亲属语言；“见证之幕”刻意区别于“会幕”。脚注标记均放在其实际说明的词语之后。
