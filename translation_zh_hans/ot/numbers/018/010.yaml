source:
  edition: WLC
  text: בְּ/קֹ֥דֶשׁ הַ/קֳּדָשִׁ֖ים תֹּאכֲלֶ֑/נּוּ כָּל זָכָר֙ יֹאכַ֣ל אֹת֔/וֹ קֹ֖דֶשׁ יִֽהְיֶה לָּֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/010.yaml
  text: You shall eat it in a most holy place; every male may eat it. It shall be holy to you.
translation:
  language: zh_hans
  text: 你要在至圣之处[a]吃它；凡男丁都可以吃。这要归你为圣物。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“在圣中之圣”。这里指食用至圣供物的指定圣洁区域，不一定专指会幕内层的“至圣所”。
    reason: 说明希伯来语最高级结构，并避免将地点误限为至圣所内部。
lexical_decisions:
- source_word: בְּקֹדֶשׁ הַקֳּדָשִׁים
  choice: 在至圣之处
  rationale: 该短语按字面为“在圣中之圣”，是表达最高程度的希伯来语结构。介词בְּ保留了地点含义；译作“在至圣之处”既自然，也避免让人误以为这里只能指会幕最内层的至圣所。
- source_word: תֹּאכֲלֶנּוּ
  choice: 你要……吃它
  rationale: 第二人称阳性单数未完成式带第三人称阳性单数后缀，直接对亚伦说话；“要”符合律例训示的语气，“它”承接上文所说的至圣供物。
- source_word: כָּל זָכָר
  choice: 凡男丁
  rationale: 准确表达按性别限定的资格；“凡男丁”在现代中文中简洁、庄重，并适合祭司条例的语域。
- source_word: יֹאכַל אֹתוֹ
  choice: 都可以吃
  rationale: 此处未完成式在“凡男丁”的限定之后表达准许和资格，译作“可以吃”比重复命令式的“都要吃”更清楚。
- source_word: קֹדֶשׁ יִהְיֶה לָּךְ
  choice: 它对你是圣的
  rationale: 保留קֹדֶשׁ与前文圣洁用语的词汇联系，并保留לָּךְ所表达的关系性，不额外解释为所有权。
theological_decisions:
- issue: 祭司训示的对象与适用范围
  choice: 保留对亚伦的第二人称单数“你”，同时以“凡男丁”表明许可扩及具备资格的男性祭司成员。
  alternative: 将第二人称复数化，直接译成“你们”；或理解为只对亚伦本人有效。
  rationale: 希伯来文本明确使用第二人称阳性单数，但上下文涉及赐给亚伦和他儿子的祭司份；本译文既不抹去单数形式，也不把适用范围缩限于亚伦个人。
- issue: “圣中之圣”是地点还是供物类别
  choice: 在本句中按地点性表达译为“在至圣之处”，同时用脚注保留字面形式及其可能引起的歧义。
  alternative: 译作“作为至圣之物吃它”，把短语主要理解为供物的等级或性质。
  rationale: 介词בְּ及动词“吃”支持地点性理解；但该短语也与“至圣”类别密切相关，因此不在正文中作超出原文的具体地点限定。
translation_notes:
  register: 采用现代、庄重而易懂的祭司律例语体。“你”保留原文对亚伦的单数称呼；“凡男丁”准确呈现资格限制；句式简洁，保留原文三分句结构及“圣”的重复。
