  text: וְ/אַתָּ֣ה וּ/בָנֶ֣י/ךָ אִ֠תְּ/ךָ תִּשְׁמְר֨וּ אֶת כְּהֻנַּתְ/כֶ֜ם לְ/כָל דְּבַ֧ר הַ/מִּזְבֵּ֛חַ וּ/לְ/מִ/בֵּ֥ית לַ/פָּרֹ֖כֶת וַ/עֲבַדְתֶּ֑ם עֲבֹדַ֣ת מַתָּנָ֗ה אֶתֵּן֙ אֶת כְּהֻנַּתְ/כֶ֔ם וְ/הַ/זָּ֥ר הַ/קָּרֵ֖ב יוּמָֽת־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/007.yaml
  text: But you and your sons with you shall keep your priesthood for everything concerning the altar and for what is within the veil[a], and you shall serve. I give your priesthood as a gift of service[b], but the outsider who comes near shall be put to death.
translation:
  language: zh_hans
  text: 至于你和你的儿子们，你们要谨守祭司的职任，办理一切与祭坛有关的事，以及帷幔以内的事；你们要这样供职。我把祭司的职任赐给你们，作为恩赐的事奉[a]；但擅自近前的人[b]必被处死。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我把祭司的职任赐给你们，使你们事奉。”原文的凝练说法既可强调事奉是一份恩赐，也可强调祭司职任是为事奉而赐下的。
    reason: lexical_alternative
  - marker: b
    text: 原文指无权履行这些祭司职务却擅自近前的人，并非特指外族人。
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּשְׁמְרוּ
  choice: 谨守
  rationale: 此处 שׁמר 不仅指履行，也含看守、恪守所托职责之意；“谨守”兼顾监管责任和庄重语体。
- source_word: כְּהֻנַּתְכֶם
  choice: 你们祭司的职任
  rationale: 指祭司身份所承载的职分与职责，而非祭司群体本身；这样译成现代汉语更清楚。
- source_word: לְכָל דְּבַר הַמִּזְבֵּחַ
  choice: 办理一切与祭坛有关的事
  rationale: דבר 在此泛指祭坛方面的一切事务，不宜缩窄为某一种礼仪行动。
- source_word: וּלְמִבֵּית לַפָּרֹכֶת
  choice: 以及帷幔以内的事
  rationale: 该短语指帷幔内侧的圣所范围及相关职责；保留空间指向，又以“事”承接前文。
- source_word: וַעֲבַדְתֶּם
  choice: 你们要这样供职
  rationale: עבד 在礼仪语境中指履行圣所职务；“供职”自然且不引入后期教会术语，“这样”使其与前列职责连接。
- source_word: עֲבֹדַת מַתָּנָה
  choice: 作为恩赐的事奉
  rationale: 希伯来语压缩结构可强调事奉是恩赐，也可强调祭司职任是为事奉而赐；正文保留两者间的张力，并以脚注说明。
- source_word: אֶתֵּן אֶת כְּהֻנַּתְכֶם
  choice: 我把祭司的职任赐给你们
  rationale: 表达这职任由上帝授予，并非自行取得；“赐给”符合直接神谕语境。
- source_word: הַזָּר
  choice: 擅自近前的人
  rationale: זָר 在祭司法规中指没有资格参与受限圣职的人，并非特指外族人；结合分词译出未经授权而近前的含义。
- source_word: יוּמָת
  choice: 必被处死
  rationale: Hophal 被动使役形式表达依法使其死亡，而非单纯预告自然死亡。
theological_decisions:
- issue: זָר 在祭司律法中的范围
  choice: 擅自近前的人
  alternative: 外人；未经授权的人；非祭司
  rationale: 所指是任何无权承担这些受限祭司职务却前来接近的人；避免误解为族群意义上的外国人，也不把范围过度限定为某一类平民。
- issue: עֲבֹדַת מַתָּנָה 的句法关系
  choice: 祭司职任被赐下，成为一种恩赐的事奉
  alternative: 赐下祭司职任，使他们事奉；一项作为礼物赐下的职务
  rationale: 原文结构凝练，可将“恩赐”主要联系于事奉，也可联系于祭司职任。正文不将这种关系解释得过死，脚注保留另一种理解。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“谨守”“职任”“供职”保留祭司法规的正式语气；避免文言化的“凡”“必治死”，也避免把有歧义的恩赐—事奉关系解释得过于确定。
