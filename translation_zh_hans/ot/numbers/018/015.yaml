  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כָּל פֶּ֣טֶר רֶ֠חֶם לְֽ/כָל בָּשָׂ֞ר אֲשֶׁר יַקְרִ֧יבוּ לַֽ/יהוָ֛ה בָּ/אָדָ֥ם וּ/בַ/בְּהֵמָ֖ה יִֽהְיֶה לָּ֑/ךְ אַ֣ךְ פָּדֹ֣ה תִפְדֶּ֗ה אֵ֚ת בְּכ֣וֹר הָֽ/אָדָ֔ם וְ/אֵ֛ת בְּכֽוֹר הַ/בְּהֵמָ֥ה הַ/טְּמֵאָ֖ה תִּפְדֶּֽה־־־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/015.yaml
  text: Every firstborn that opens the womb[a], of all flesh that they present to Yahweh, whether man or beast, shall be yours. Nevertheless, you must surely redeem the firstborn of man[b], and you must redeem the firstborn of the unclean beast.
translation:
  language: zh_hans
  text: 凡一切有血肉之物中最先出母腹的[a]，即他们献给[b]雅威的；无论人或牲畜，都归你。但人中头生的，你一定要赎回；不洁净牲畜中头生的，你也要赎回。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“凡开母腹的”。这是希伯来语习语，指最先从母腹出来的后代。
    reason: lexical_alternative
  - marker: b
    text: “献给”直译为“带到雅威近前”；在献礼的语境中，也可译作“呈献给”。
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶּטֶר רֶחֶם
  choice: 最先出母腹的
  rationale: 这是希伯来语习语，指最先从母腹出来的后代。译文保留“出母腹”的形象，同时避免误解为泛指所有长子。
- source_word: כָּל ... לְכָל בָּשָׂר
  choice: 凡一切有血肉者中
  rationale: 表达该规定涵盖人和动物的整体范围；“有血肉者”保留 בָּשָׂר 的广泛生命类别。
- source_word: אֲשֶׁר יַקְרִיבוּ לַיהוָה
  choice: 就是人们献给雅威的
  rationale: הקריב 的基本意象是带到近前，在献礼语境中可指呈献。这里包括必须赎回而不可献祭的人和不洁净牲畜，因此采用范围较宽的“献给”，不把所有对象都说成实际祭牲。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见音译呈现希伯来文神名，而不以称号取代。
- source_word: בָּאָדָם וּבַבְּהֵמָה
  choice: 无论是人还是牲畜
  rationale: 自然地呈现经文所列的两个适用类别，并保留人与动物之间的对照。
- source_word: יִהְיֶה לָּךְ
  choice: 都要归你
  rationale: 直接表达这些头生者归给祭司的权利。
- source_word: אַךְ
  choice: 但
  rationale: 引出对前一句归属规定的重要限制，简洁体现其转折和限定作用。
- source_word: פָּדֹה תִפְדֶּה
  choice: 你一定要赎回
  rationale: 以“一定要”体现不定式绝对形与限定动词连用所加强的命令语气。
- source_word: בְּכוֹר הָאָדָם
  choice: 人中头生的
  rationale: אָדָם 在此与牲畜相对，泛指人；“人中头生的”保留这种类别对照，不擅自缩窄为某一性别称谓。
- source_word: בְּכוֹר הַבְּהֵמָה הַטְּמֵאָה
  choice: 不洁净牲畜中头生的
  rationale: 准确保留礼仪上“不洁净”的类别，以及其头生者必须赎回的规定。
theological_decisions:
- issue: אָדָם 与牲畜相对时的范围
  choice: 译作“人中头生的”
  alternative: “人的长子”或“头生的男子”
  rationale: 此处 אָדָם 表示人类成员，与牲畜形成类别对照；译文不加入原文未明说的性别限定，也不把“头生”简化为现代亲属排行意义上的“长子”。
- issue: 头生者归祭司与赎回命令的关系
  choice: 先说明都归祭司，再保留人和不洁净牲畜必须赎回的明确限制
  alternative: 把“献给雅威”理解为所有头生者都实际献作祭物
  rationale: 经文本身随即要求赎回人的头生者和不洁净牲畜的头生者，因此前半句不可理解为它们全都被宰献；译文保留这一张力而不作额外教义解释。
- issue: 神名 יהוה 的呈现
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 采用对希伯来神名的现代汉语音译，明确保留专名性质。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“最先出母腹的”和“头生的”保留希伯来文的生育意象；“不洁净”沿用礼仪类别用语。句法先陈述总体归属，再以“但”清楚引出必须赎回的例外。
