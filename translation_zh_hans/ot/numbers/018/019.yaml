  text: כֹּ֣ל תְּרוּמֹ֣ת הַ/קֳּדָשִׁ֗ים אֲשֶׁ֨ר יָרִ֥ימוּ בְנֵֽי יִשְׂרָאֵל֮ לַֽ/יהוָה֒ נָתַ֣תִּֽי לְ/ךָ֗ וּ/לְ/בָנֶ֧י/ךָ וְ/לִ/בְנֹתֶ֛י/ךָ אִתְּ/ךָ֖ לְ/חָק עוֹלָ֑ם בְּרִית֩ מֶ֨לַח עוֹלָ֥ם הִוא֙ לִ/פְנֵ֣י יְהוָ֔ה לְ/ךָ֖ וּ/לְ/זַרְעֲ/ךָ֥ אִתָּֽ/ךְ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/019.yaml
  text: All the contributions of the holy things that the sons of Israel lift up to the LORD I have given to you, and to your sons and your daughters with you, as a permanent statute. It is a covenant of salt forever before the LORD for you and for your offspring with you.
translation:
  language: zh_hans
  text: 以色列人献给耶和华的一切圣物中的举祭，我都赐给你，也赐给你的儿子、女儿，作为永远的定例。这是耶和华在他面前为你和你的后裔所立的永远盐约。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “盐约”是古代表示牢固、持久之约的说法；参见利未记2:13。
    reason: 该表达若无背景说明，现代读者可能难以理解；脚注解释其盟约意涵，同时保留正文的原文意象。
lexical_decisions:
- source_word: תְּרוּמֹת הַקֳּדָשִׁים
  choice: 圣物举献
  rationale: תְּרוּמָה表示从祭物中举起、奉献的份；“圣物举献”既保留礼仪动作与专门含义，也表明这些是分别为圣之物。
- source_word: יָרִימוּ
  choice: 献给
  rationale: 该动词字面为“举起”，在此与举献礼仪相关；汉语正文用“献给”自然表达其功能，而“举献”已在名词中保留其礼仪色彩。
- source_word: חָק עוֹלָם
  choice: 永远的定例
  rationale: חֹק是规定、定例；עוֹלָם在此强调持续有效，译为“永远的”符合盟约法规语境。
- source_word: בְּרִית מֶלַח עוֹלָם
  choice: 永远的盐约
  rationale: 保留希伯来语鲜明且具有古代盟约背景的表达，不把象征意义直接解释进正文。
- source_word: זַרְעֲךָ
  choice: 后裔
  rationale: 集合名词“种子”在此指亚伦的后代，译为“后裔”准确且庄重。
theological_decisions:
- issue: “盐约”的含义
  choice: 正文保留“盐约”，脚注仅说明这是持久盟约的古代说法
  alternative: 直接意译为“永不废弃的约”
  rationale: 原文同时有“永远”和“盐约”，若完全意译会抹去其具体意象并造成意义重复；保留原称可保存原文的盟约象征。
- issue: 礼物的领受范围
  choice: 译作“你和与你同在的儿女”
  alternative: 具体译作“你的儿子和女儿”
  rationale: 原文明确分别提到“儿子”和“女儿”；汉语“儿女”完整涵盖二者，并保持自然简洁，也表明祭司家庭中的男女都可领受。
- issue: 神名的表达
  choice: 耶和华
  alternative: 雅威
  rationale: 采用现代中文圣经读者熟悉的神名形式，同时明确对应原文四字神名יהוה。
translation_notes:
  register: 采用现代、庄重而易懂的礼仪法规语体。句法按汉语习惯调整，但保留“圣物举献”“永远的定例”“盐约”等关键原文概念。
