base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/024.yaml
  text: For I have given to the Levites as an inheritance the tithe of the children of Israel, which they lift up to the LORD as a contribution; therefore I have said to them, ‘Among the children of Israel they shall have no inheritance.’
translation:
  language: zh_hans
  text: 因为以色列人作为举祭献给耶和华的十分之一，我已经赐给利未人作产业。因此，我对他们说：“他们在以色列人中不可得产业。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַעְשַׂר
  choice: 十分之一
  rationale: 准确表达以色列人所献的什一份额，现代读者也容易理解。
- source_word: יָרִימוּ
  choice: 献给
  rationale: 该动词本义与“举起”有关，但在献祭语境中指把礼物奉献出来；译作“献给”自然且不误导为单纯的身体动作。
- source_word: תְּרוּמָה
  choice: 举祭
  rationale: 保留本章礼仪术语及其与“举起”词根的联系；“举祭”也是简体中文圣经语体中可识别的表达。
- source_word: נַחֲלָה / יִנְחֲלוּ
  choice: 产业／得产业
  rationale: 同一希伯来词根在本节重复出现，译文保持词汇呼应，兼顾土地份额与承受所得的含义。
- source_word: לַיהוָה
  choice: 给耶和华
  rationale: 用“耶和华”呈现神圣四字名，符合现代中文圣经的通行庄重用法。
theological_decisions:
- issue: 利未人的产业与其没有产业之间的张力
  choice: 前半句称十分之一为利未人的“产业”，后半句保留“在以色列人中不可得产业”
  alternative: 将后半句明确译为“不可得土地为业”
  rationale: 原文两处使用同一词根，刻意形成张力：利未人所得的十分之一取代了他们在以色列人中的产业。译文不擅自补入“土地”，以保留原文措辞和神学结构。
- issue: תְּרוּמָה 的礼仪性质
  choice: 译为“举祭”
  alternative: 译为“奉献”或“贡物”
  rationale: “举祭”保留专门礼仪含义，同时不把该词局限为一般捐献或政治贡物。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语；保持因果结构和前后“产业”的词汇呼应。引语采用现代中文标点，未添加原文没有的解释性成分。
