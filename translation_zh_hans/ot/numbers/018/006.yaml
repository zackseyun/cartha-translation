revisions:
- from: “至于我，看哪，我已经从以色列众子[a]中取出你们的弟兄利未人，把他们作为礼物赐给你们；他们是献给雅威的，为要办理会幕的事务。”
  to: “至于我，看啊，我已经从以色列子民[a]中取出你们的弟兄，就是利未人，把他们作为礼物赐给你们；他们是赐给雅威的，为要执行会幕的职务。”
  rationale: 修订在不改变原文归属关系及强调语气的前提下，改善现代汉语的自然度，并以“执行会幕的职务”准确表达利未人在会幕承担的服役责任。保留“赐给你们／赐给雅威”的平行，以呈现原文中两重与格关系，而不将雅威误作礼物来源或仅作泛泛的服务对象。
