  text: וַ/אֲנִ֗י הִנֵּ֤ה לָקַ֨חְתִּי֙ אֶת אֲחֵי/כֶ֣ם הַ/לְוִיִּ֔ם מִ/תּ֖וֹךְ בְּנֵ֣י יִשְׂרָאֵ֑ל לָ/כֶ֞ם מַתָּנָ֤ה נְתֻנִים֙ לַֽ/יהוָ֔ה לַ/עֲבֹ֕ד אֶת עֲבֹדַ֖ת אֹ֥הֶל מוֹעֵֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/006.yaml
  text: And I—behold[a], I have taken your brothers the Levites from among the sons of Israel, given to you as a gift, given to Yahweh, to perform the service of the tent of meeting.
translation:
  language: zh_hans
  text: “至于我，看啊，我已经从以色列子民[a]中取出你们的弟兄，就是利未人，把他们作为礼物赐给你们；他们是赐给雅威的，为要执行会幕的职务。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“以色列人”。希伯来文直译为“以色列的众子”。
    reason: 说明此固定群体称谓较自然的现代汉语表达，并保留原文的字面亲属称谓。
lexical_decisions:
- source_word: וַאֲנִי הִנֵּה
  choice: 至于我，看哪
  rationale: 保留连接性的强调代词和 הִנֵּה 的郑重提示语气；“看哪”虽较庄重，但在现代中文中仍清楚可懂。
- source_word: לָקַחְתִּי
  choice: 我已经……取出
  rationale: 按 לקח 的基本含义译为“取”，并以“取出”自然表达从以色列众子中分别出来；避免用“拣选”加入原词未明说的解释。
- source_word: אֲחֵיכֶם הַלְוִיִּם
  choice: 你们的弟兄利未人
  rationale: 保留“弟兄”的亲属性和群体连带含义，同时明确所指为利未人。
- source_word: מִתּוֹךְ בְּנֵי יִשְׂרָאֵל
  choice: 从以色列众子中
  rationale: 贴近希伯来文“以色列的众子”，并准确表达利未人从整个以色列群体中被取出。
- source_word: לָכֶם מַתָּנָה נְתֻנִים
  choice: 把他们作为礼物赐给你们
  rationale: 以自然中文保留“礼物—赐给”的重复词义，并表明利未人被交付给亚伦及其众子。
- source_word: לַיהוָה
  choice: 献给雅威
  rationale: 介词关系在语境中表示归给雅威、供他使用；“献给”比生硬的“赐给雅威”更符合现代中文，同时没有消除其归属含义。
- source_word: לַעֲבֹד אֶת־עֲבֹדַת אֹהֶל מוֹעֵד
  choice: 为要办理会幕的事务
  rationale: “办理……事务”自然表达礼仪语境中的服役和职务，并保留该工作属于会幕的含义。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: “雅威”直接按学界通常重建的读音 Yahweh 音译神的立约之名，避免以称号代替专名。
- issue: בְּנֵי יִשְׂרָאֵל 的性别和群体表达
  choice: 以色列众子
  alternative: 以色列人
  rationale: 正文保留原文阳性亲属称谓及其盟约群体色彩，同时用脚注说明现代中文的自然替代译法。
- issue: 利未人同时‘赐给你们’并‘归给雅威’的关系
  choice: 作为礼物赐给你们；他们是献给雅威的
  alternative: 作为雅威赐给你们的礼物
  rationale: 保留原文两个与格关系所形成的张力：利未人既赐给祭司，又归属于雅威；不把后者改写成仅表示礼物的来源。
translation_notes:
  register: 采用庄重而可理解的现代标准普通话。“至于我，看哪”保留神谕式强调；分号使“赐给你们”与“献给雅威”两个并列而有张力的归属关系清楚可读。
