  terminology: “雅威”“利未人”“会幕”均适当。“赐给雅威的”比“献给雅威的”更贴近נְתוּנִים（被给予），并与前面的“赐给你们”保留原文刻意并置的给予／归属表达，不额外强化为献祭性用语。
