base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/001.yaml
  text: Then Yahweh said to Aaron[a], “You and your sons and your father’s house with you shall bear the iniquity of the sanctuary[b], and you and your sons with you shall bear the iniquity of your priesthood.”
translation:
  language: zh_hans
  text: 雅威对亚伦说：“你和你的儿子，以及与你同在的父家，要担当圣所的罪责[a]；你和你的儿子同你一起，要担当你们祭司职分的罪责[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“要承担圣所的罪咎。”这个希伯来语习语也可表示对与圣所有关的过犯承担责任。
    reason: lexical_alternative
  - marker: b
    text: 或译：“要承担你们祭司职分的罪咎。”这个希伯来语习语也可表示对与祭司职分有关的过犯承担责任。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: 雅威
  rationale: 以通行的现代汉语音译呈现上帝的专名，不用“耶和华”或“主”代替原文的四字神名。
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: 希伯来语叙事形式承接上下文；现代汉语无需机械译出句首连接词，也能自然表达叙事推进。
- source_word: בֵית אָבִיךָ
  choice: 你的父家
  rationale: 指父系家族或宗族，不是建筑物；“父家”保留以色列亲族制度的原文表达，且简洁庄重。
- source_word: אִתָּךְ
  choice: 与你同在／同你一起
  rationale: 两处均保留陪同、共同承担之意；依汉语句法略作措辞变化，避免生硬重复。
- source_word: תִּשְׂאוּ אֶת עֲוֺן
  choice: 要担当……的罪责
  rationale: נשא עון 可涵盖承担罪、罪责、刑责或对相关过犯负责。“担当罪责”保留其法律与礼仪层面的语义张力，没有单纯缩减为“负责”。
- source_word: הַמִּקְדָּשׁ
  choice: 圣所
  rationale: 指分别为圣的圣所及其神圣领域；“圣所”是现代汉语中准确而惯用的圣经用语。
- source_word: כְּהֻנַּתְכֶם
  choice: 你们祭司职分
  rationale: 指亚伦及其众子的祭司身份、职任和相关服事；“祭司职分”比仅指群体的“祭司制度”更贴合本节语境。
theological_decisions:
- issue: “担当罪责”在祭司语境中的含义
  choice: 保留“担当……的罪责”这一兼具罪咎、责任和刑责色彩的表达。
  alternative: 译作“承担……的罪”或“对与……有关的过犯负责”。
  rationale: 原文习语可着重于罪咎，也可指对圣所或祭司职分相关过犯所负的责任。正文不把这种张力限定为单一解释，并用脚注说明其语义范围。
translation_notes:
  register: 采用现代、庄重且易懂的标准普通话。“父家”保留古代以色列的亲族制度用语；两组平行分句及“你和你的儿子”的重复均予保留，以呈现原文的强调与责任范围。
