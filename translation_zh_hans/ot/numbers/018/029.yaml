  text: מִ/כֹּל֙ מַתְּנֹ֣תֵי/כֶ֔ם תָּרִ֕ימוּ אֵ֖ת כָּל תְּרוּמַ֣ת יְהוָ֑ה מִ/כָּל חֶלְבּ֔/וֹ אֶֽת מִקְדְּשׁ֖/וֹ מִמֶּֽ/נּוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/029.yaml
  text: From all your gifts you shall lift up every offering of Yahweh[a]; from all its best part[b], the holy portion from it.
translation:
  language: zh_hans
  text: 从你们所得的一切礼物中，你们要取出全部归给雅威的举祭，就是从各样礼物最好的部分取出的圣份。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִכֹּל מַתְּנֹתֵיכֶם
  choice: 从你们所得的一切礼物中
  rationale: מִן与כֹּל表示从整体中取出；מַתָּנָה指礼物或赠礼。结合本章语境，这些是利未人所得的礼物，因此补出“所得”以避免误解，同时保留“你们的礼物”的所属关系。
- source_word: תָּרִימוּ
  choice: 你们都要献上
  rationale: רוּם的使役式本义是“举起”，在祭礼语境中成为献举祭、献出分别之物的惯用动词。正文用现代汉语自然的“献上”，其具体祭礼意象由“举祭”保留。
- source_word: כָּל תְּרוּמַת יְהוָה
  choice: 凡当献给雅威的举祭
  rationale: תְּרוּמָה是从整体中举起、取出而奉献的祭礼专用语。“举祭”保留术语色彩；“当献给”表达该份归于雅威，而不把短语误解为雅威所赠的礼物。
- source_word: יְהוָה
  choice: 雅威
  rationale: 直接音译四字神名，以区别于“主”这一称号，并保留经文中神的专名。
- source_word: מִכָּל חֶלְבּוֹ
  choice: 从每样礼物最好的部分
  rationale: חֵלֶב本义为“脂肪”，也可比喻最肥美、最上好的部分。此处所指不限于动物祭物，故正文采用语境义“最好的部分”，脚注保留字面表达。
- source_word: אֶת מִקְדְּשׁוֹ מִמֶּנּוּ
  choice: 把其中分别为圣的那一份献上
  rationale: מִקְדָּשׁ在此指从礼物中划出、归为圣的一份；后缀与מִמֶּנּוּ都回指相关礼物。希伯来文后半句省略谓语，中文重述“献上”以使句意完整。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文使用神的四字专名，而非“主”这一称号。正文采用较能反映该名可能读音的“雅威”，不以称号取代专名。
- issue: מִקְדְּשׁוֹ所指的圣物
  choice: 其中分别为圣的那一份
  alternative: 它的圣份；它所奉献的部分
  rationale: 此词形式简洁，可理解为礼物中已划归神圣用途的部分。译文保留“分别为圣”这一祭礼观念，不进一步断定其具体去向或用途。
translation_notes:
  register: 采用庄重而通顺的现代标准普通话。“举祭”保留祭礼术语，“献上”使动作自然清楚；后半句补出原文省略的谓语，但不添加新的礼仪规定。
