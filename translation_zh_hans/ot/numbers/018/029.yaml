revisions:
- from: 从你们所得的一切礼物中，凡当献给雅威的举祭[a]，你们都要献上；要从每样礼物最好的部分[b]，把其中分别为圣的那一份献上。
  to: 从你们所得的一切礼物中，你们要取出全部归给雅威的举祭，就是从各样礼物最好的部分取出的圣份。
  rationale: 将主句改为“取出……作为／归给雅威的举祭”，更直接对应 תָּרִימוּ 与 תְּרוּמַת יְהוָה；以后半句的“就是”呈现其对举祭的说明，即圣份须取自各样礼物最好的部分。保留“雅威”“举祭”及对 חֵלֶב 的语境化译法，不增加原文未明言的礼仪细节。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T04:56:48Z'
review_pass:
  verdict: revise
  source_fidelity: 译文基本把握了从利未人所得的礼物中取出归给雅威之份的命令，也恰当地将 חֵלֶב 按语境译为“最好的部分”。不过，原句后半是对“雅威的举祭”的进一步界定：这圣份是从各样礼物的上好部分取出的。现译将其拆作第二个独立的“献上”动作，且“凡当献给雅威的举祭”措辞不够顺畅，关系略显含混。
  naturalness: “凡当献给雅威的举祭，你们都要献上”带有不自然的书面倒装；“从每样礼物最好的部分，把其中分别为圣的那一份献上”中“部分／其中／那一份”重复，也使句法负担较重。改为以“就是”连接说明关系，较符合现代标准汉语，同时保留庄重的祭礼语体。
  terminology: “雅威”忠实反映 יהוה；“举祭”可作为 תְּרוּמָה 的既有祭礼术语。为避免将 תָּרִימוּ 的“举起／取出作奉献”意象完全抹平，正文以“取出……作为举祭”表达；脚注说明术语和动词的关联。 “圣份”简洁对应 מִקְדָּשׁוֹ，且不对其具体用途作过度解释。
  issues:
  - severity: medium
    issue: 前半句“凡当献给雅威的举祭，你们都要献上”句法不自然，且未清晰呈现后半句对举祭来源及性质的界定。
    rationale: כָּל תְּרוּמַת יְהוָה 是“全部归给雅威的举祭／奉献”，后面的“从其全部上好部分，取出其圣份”说明该举祭须从上好部分取出。
  - severity: low
    issue: “从每样礼物最好的部分，把其中分别为圣的那一份献上”重复使用“部分”“其中”“那一份”，并把原文省略谓语的说明性短语处理为略显冗余的第二项命令。
    rationale: 以“就是从各样礼物最好的部分取出的圣份”可更清楚地保留原文同位／说明关系。
  revised_text: 从你们所得的一切礼物中，你们要取出全部归给雅威的举祭，就是从各样礼物最好的部分取出的圣份。
  revised_footnotes:
