base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/030.yaml
  text: And you shall say to them[a], ‘When you lift up its best part from it, it shall be counted to the Levites as the produce of the threshing floor and as the produce of the winepress.’
translation:
  language: zh_hans
  text: 你要对他们说：‘当你们从中献上最好的部分[a]时，这份献物就要算作利未人的出产，如同禾场的出产和酒榨的出产。’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译“它的脂油”；这里是习语，指农产中最肥美、最好的部分。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמַרְתָּ אֲלֵהֶם
  choice: 你要对他们说
  rationale: 这是对摩西的第二人称阳性单数指令；“要……说”自然表达命令语气。
- source_word: בַּהֲרִימְכֶם
  choice: 你们……献上……以后
  rationale: רום的使役式在此指从所得中举献贡物；“献上”清楚传达礼仪和奉献语境，而时间结构表达前缀ב与不定式组合的含义。
- source_word: חֶלְבּוֹ
  choice: 最好的部分
  rationale: 字面为“它的脂油”，用于农产贡物时是指其中最肥美、上好的部分；正文采用自然的习语意义，并以脚注保留字面信息。
- source_word: מִמֶּנּוּ
  choice: 从中
  rationale: 简洁表达从前述什一之物中取出贡物的关系。
- source_word: וְנֶחְשַׁב
  choice: 这就要算作
  rationale: 保留חשׁב被动式的核算、认定意味；“算作”符合本节制度与账目语境。
- source_word: לַלְוִיִּם
  choice: 利未人的
  rationale: 此处说明该贡物对利未人而言被视为什么；用所有关系构成自然汉语，同时保留受益或归属关系。
- source_word: כִּתְבוּאַת גֹּרֶן
  choice: 如同禾场的出产
  rationale: תבואה为出产、收成；“禾场”对应גֹּרֶן并保留农业图景。
- source_word: וְכִתְבוּאַת יָקֶב
  choice: 和榨酒池的出产
  rationale: יֶקֶב可指榨酒设施或酒池；“榨酒池”自然且与“禾场”形成平行。
theological_decisions: []
