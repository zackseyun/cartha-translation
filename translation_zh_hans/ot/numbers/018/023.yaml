  text: וְ/עָבַ֨ד הַ/לֵּוִ֜י ה֗וּא אֶת עֲבֹדַת֙ אֹ֣הֶל מוֹעֵ֔ד וְ/הֵ֖ם יִשְׂא֣וּ עֲוֺנָ֑/ם חֻקַּ֤ת עוֹלָם֙ לְ/דֹרֹ֣תֵי/כֶ֔ם וּ/בְ/תוֹךְ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל לֹ֥א יִנְחֲל֖וּ נַחֲלָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/023.yaml
  text: But the Levite himself shall serve the service of the tent of meeting, and they shall bear their iniquity. It is a permanent statute throughout your generations, and among the sons of Israel they shall not inherit an inheritance.
translation:
  language: zh_hans
  text: 但利未人自己要执行会幕的职务；他们要担当自己的罪责。[a]这是你们世世代代永远的条例；他们在以色列子孙中不可承受产业。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “担当自己的罪责”也可译作“担当自己的罪孽”或“承担自己的罪所带来的责任”。这个希伯来语惯用语可指罪孽、罪责，或与之相连的责任和后果。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“不可继承产业”，动词和名词出自同一词根，以重复强调他们不得分得支派土地产业。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָבַד
  choice: 要办理
  rationale: 连词加完成式在律法语境中带规定、将来意味。“要办理”自然表达命令性职责。
- source_word: הַלֵּוִי הוּא
  choice: 利未人要亲自
  rationale: 独立代词 הוּא 强调主语；“亲自”保留强调，但不额外引入排他含义。
- source_word: עֲבֹדַת אֹהֶל מוֹעֵד
  choice: 会幕的事务
  rationale: עֲבֹדָה 在此指与会幕有关的礼仪职务和服役；“事务”避免汉语中“服事服事”式的生硬重复，同时“会幕”是 אֹהֶל מוֹעֵד 的通行译法。
- source_word: וְהֵם יִשְׂאוּ עֲוֺנָם
  choice: 他们要担当自己的罪责
  rationale: נשא עון 是法律—礼仪惯用语，可涉及罪孽、罪责以及由此产生的责任或后果。“担当自己的罪责”保留其神学分量与一定语义张力；“自己”对应第三人称复数后缀。
- source_word: חֻקַּת עוֹלָם
  choice: 永远的条例
  rationale: 该固定表达指在以色列盟约秩序中持续有效的规定；采用庄重而通行的汉语圣经法律措辞。
- source_word: לְדֹרֹתֵיכֶם
  choice: 你们世世代代
  rationale: 表达对接续各代持续适用，简洁自然。
- source_word: וּבְתוֹךְ בְּנֵי יִשְׂרָאֵל
  choice: 在以色列子孙中
  rationale: 保留 בְּנֵי 的“子孙”表达，并以“在……中”传达 בְּתוֹךְ 在本语境中的群体关系。
- source_word: לֹא יִנְחֲלוּ נַחֲלָה
  choice: 不可承受产业
  rationale: 现代汉语难以自然保留希伯来语同源动词与名词的重复；“承受产业”准确表达不得取得支派土地份额的规定，脚注说明原文重复。
theological_decisions:
- issue: 利未人承担 עָוֹן 的法律—礼仪含义
  choice: 担当自己的罪责
  alternative: 担当自己的罪孽；承担自己的罪所带来的后果
  rationale: 原文惯用语可能侧重罪、罪责或相应责任与后果。正文不把含义窄化为单纯受罚，脚注保留其范围。
- issue: 利未人无产业的性质
  choice: 不可承受产业
  alternative: 不可分得产业；不可继承产业
  rationale: 原文使用继承词根，所指与以色列各支派的土地产业有关；译文不进一步说明其神学理由，以免超出本节。
translation_notes:
  register: 采用现代、庄重而易懂的律法体汉语。“会幕”“条例”“承受产业”沿用广为理解的圣经用语；句法适度拆分，以免希伯来语长句在汉语中显得拖沓。
