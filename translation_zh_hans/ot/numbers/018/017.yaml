id: NUM.18.17
reference: Numbers 18:17
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: אַ֣ךְ בְּֽכוֹר שׁ֡וֹר אֽוֹ בְכ֨וֹר כֶּ֜שֶׂב אֽוֹ בְכ֥וֹר עֵ֛ז לֹ֥א תִפְדֶּ֖ה קֹ֣דֶשׁ הֵ֑ם אֶת דָּמָ֞/ם תִּזְרֹ֤ק עַל הַ/מִּזְבֵּ֨חַ֙ וְ/אֶת חֶלְבָּ֣/ם תַּקְטִ֔יר אִשֶּׁ֛ה לְ/רֵ֥יחַ נִיחֹ֖חַ לַֽ/יהוָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/017.yaml
  text: But you shall not redeem the firstborn of an ox[a], or the firstborn of a sheep, or the firstborn of a goat; they are holy. You shall sprinkle their blood on the altar, and you shall burn their fat as a food offering, a pleasing aroma to Yahweh.
translation:
  language: zh_hans
  text: 只是，牛、绵羊或山羊的头生牲畜，你不可赎回；它们是圣物。你要把它们的血洒在祭坛上，把它们的脂油焚烧，作为献给耶和华的火祭，发出蒙悦纳的香气。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַךְ
  choice: 只是
  rationale: 承接上文并引出例外限制；“只是”在现代汉语中自然地保留其限定和转折作用。
- source_word: בְּכוֹר
  choice: 头生的
  rationale: 准确表达牲畜最先出生者及其礼仪身份，也与本段关于头生牲畜的法规相符。
- source_word: שׁוֹר / כֶּשֶׂב / עֵז
  choice: 牛、绵羊或山羊
  rationale: 这里列举的是可献祭牲畜的种类；用类称既简洁，也避免给 שׁוֹר 加上原文未明确表达的性别限定。
- source_word: לֹא תִפְדֶּה
  choice: 你不可赎出
  rationale: פדה 在祭司法规中指借代价或替代物解除其献给神的身份；“赎出”比单用“赎”更清楚地表达从奉献状态中取回。
- source_word: קֹדֶשׁ הֵם
  choice: 它们是圣的
  rationale: 保留原文简洁的断言及礼仪性的“圣”这一核心概念。
- source_word: תִזְרֹק
  choice: 洒
  rationale: זרק 描写把祭牲之血施于祭坛的礼仪动作；“洒在祭坛上”是自然、庄重且不过度细化动作方式的中文表达。
- source_word: חֶלְבָּם תַּקְטִיר
  choice: 把它们的脂油焚烧
  rationale: חֵלֶב 指献祭时归于坛火的脂油，קטר 的使役形在此指焚烧使其成为祭物；“焚烧”符合祭祀语域。
- source_word: אִשֶּׁה
  choice: 火祭
  rationale: 该词指经火献上的祭物。“火祭”简洁保留其献祭方式，并避免把词义扩展为原文未明说的“食物”。
- source_word: רֵיחַ נִיחֹחַ
  choice: 蒙悦纳的香气
  rationale: 该固定祭祀用语既涉及香气，也表达神悦纳祭物的效果；此译法在自然汉语中保留两层含义。
- source_word: יהוה
  choice: 耶和华
  rationale: 采用现代简体中文圣经语境中最通行、最易识别的神圣名字译写，明确对应四字神名而非普通称号。
theological_decisions:
- issue: 头生牲畜不可赎出的理由
  choice: 保留“它们是圣的”作为独立陈述
  alternative: 译作“因为它们是圣的”
  rationale: 原文并无显式因果连词；上下文虽明显具有解释关系，仍不在正文中补入“因为”，以保存原文简洁的并置结构。
- issue: 祭祀术语 אִשֶּׁה
  choice: 火祭
  alternative: 馨香的食物祭／经火献上的祭物
  rationale: 词源和祭祀用法与火相关，而“给神的食物”虽有祭祀背景支持，却可能在中文中引发原文此处未展开的实体化理解；故采用较形式对应的“火祭”。
- issue: 神名 יהוה 的表达
  choice: 耶和华
  alternative: 雅威
  rationale: 两者均试图指称四字神名；正文选用普通现代中文读者最熟悉的传统音译，同时不以“主”替代专名。
translation_notes:
  register: 采用现代、庄重而易懂的祭司法规语体。句式保留原文先禁令、再说明圣别身份、继而规定献祭程序的结构；不用古奥的“燔献”“馨香之气”等表达，也不额外解释仪式细节。
