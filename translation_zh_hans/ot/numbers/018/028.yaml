  rationale: 修订将“从以色列人那里收取的”恢复为限定“一切十分之一”的关系结构，保留原文命令的连续性和“从其中”的部分关系。以“以色列人”替换不自然的“以色列众子”，同时在脚注保留字面表达，避免抹去原文的惯用盟约称谓。其余关键术语及雅威神名维持原稿译法。
