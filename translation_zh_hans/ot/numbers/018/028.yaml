source:
  edition: WLC
  text: כֵּ֣ן תָּרִ֤ימוּ גַם אַתֶּם֙ תְּרוּמַ֣ת יְהוָ֔ה מִ/כֹּל֙ מַעְשְׂרֹ֣תֵי/כֶ֔ם אֲשֶׁ֣ר תִּקְח֔וּ מֵ/אֵ֖ת בְּנֵ֣י יִשְׂרָאֵ֑ל וּ/נְתַתֶּ֤ם מִמֶּ֨/נּוּ֙ אֶת תְּרוּמַ֣ת יְהוָ֔ה לְ/אַהֲרֹ֖ן הַ/כֹּהֵֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/028.yaml
  text: So you also shall present Yahweh’s contribution from all your tithes[a], which you receive from the sons of Israel, and from it you shall give Yahweh’s contribution to Aaron the priest.
translation:
  language: zh_hans
  text: 你们也要照样从你们从以色列人[a]那里收取的一切十分之一中，献上归雅威的奉献；又要从其中把归雅威的奉献交给祭司亚伦。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“以色列的众子”；也可译为“以色列民”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כֵּן
  choice: 照样
  rationale: 承接上文，表明利未人也须按相应方式献出所得中的一份；“照样”自然地保留对应意味。
- source_word: תָּרִימוּ גַם אַתֶּם
  choice: 你们也要……献上
  rationale: רום的使役式与תְּרוּמָה连用，指把一份分别出来并呈献；译作“献上”兼顾礼仪语境和现代汉语表达。
- source_word: תְּרוּמַת יְהוָה
  choice: 归雅威的奉献
  rationale: תְּרוּמָה指分别出来献上的份额。“归雅威的奉献”既可表达归属或对象，也不把它过度限定为某一种祭物。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以常见的现代汉语音译呈现四字神名，保留原文所用的专名。
- source_word: מִכֹּל מַעְשְׂרֹתֵיכֶם
  choice: 从你们所得的一切十分之一中
  rationale: מַעֲשֵׂר意为十分之一，且此处为复数；补出“所得的”使中文明确这些是利未人收取的各项十分之一，并与后句衔接。
- source_word: אֲשֶׁר תִּקְחוּ מֵאֵת בְּנֵי יִשְׂרָאֵל
  choice: 这些十分之一是你们从以色列众子那里收取的
  rationale: לקח本可作“拿取”，在合法领受什一奉献的语境中译为“收取”更自然；בְּנֵי יִשְׂרָאֵל直译为“以色列众子”，正文保留该表达并以脚注说明惯用译法。
- source_word: וּנְתַתֶּם מִמֶּנּוּ
  choice: 你们要从其中把……交给
  rationale: 保留מִמֶּנּוּ的部分关系，即从所收取的十分之一中取出一份；נתן在指定接受者的语境中译为“交给”自然清楚。
- source_word: לְאַהֲרֹן הַכֹּהֵן
  choice: 交给祭司亚伦
  rationale: לְ标明接受者；中文以“祭司亚伦”的语序自然表达原文“亚伦祭司”的同位关系。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文明确使用四字神名，正文采用“雅威”保留专名性质，而不以称号替代。
- issue: בְּנֵי יִשְׂרָאֵל的表达
  choice: 以色列众子
  alternative: 以色列人；以色列民
  rationale: 原文形式确为“以色列的众子”。正文保留这一盟约性、谱系性的表达，同时用脚注给出现代汉语中更惯用且在此处可成立的译法。
- issue: תְּרוּמַת יְהוָה所表达的关系
  choice: 归雅威的奉献
  alternative: 给雅威的奉献；雅威的奉献
  rationale: 希伯来语属格结构可强调归属、献给的对象或分别为圣的性质。“归雅威的奉献”较自然，并避免把这种关系只解释为所有权或单纯接受对象。
translation_notes:
  register: 采用现代、庄重而易懂的经文语体。“十分之一”比传统术语“什一”更便于普通读者直接理解；通过分号和第二句拆分较长的希伯来语句法，同时保留命令次序及“从其中”所表达的部分关系。
