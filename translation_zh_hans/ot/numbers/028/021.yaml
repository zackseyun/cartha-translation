  yaml_path: translation/ot/numbers/028/021.yaml
  text: You shall prepare a tenth of an ephah for each lamb[b][a], for the seven lambs.
translation:
  language: zh_hans
  text: 七只羊羔，每只都要预备十分之一伊法[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “十分之一”是指一伊法的十分之一，是本段素祭所采用的标准量。
    reason: cultural_note
  - marker: b
    text: 希伯来文直译为：“十分之一，十分之一，要为一只羊羔预备，为七只羊羔。”重复“十分之一”表示逐只计算，即每只羊羔一份。
    reason: lexical_alternative
lexical_decisions:
- source_word: עִשָּׂרוֹן עִשָּׂרוֹן
  choice: 每只……十分之一伊法
  rationale: 原文重复“十分之一，十分之一”，在祭祀条例中表达逐一分配的意思。עִשָּׂרוֹן在此指标准素祭量，即一伊法的十分之一；正文补出“伊法”，使现代读者明白计量单位。
- source_word: תַּעֲשֶׂה
  choice: 要预备
  rationale: עשה本义为“做、制作”；在此祭祀条例语境中译为“预备”自然准确，又不把动词过度限定为“献上”。
- source_word: לַכֶּבֶשׂ הָאֶחָד
  choice: 每只羊羔
  rationale: 定冠词、数词“一”与前面的重复形式共同构成逐一分配的表达，现代汉语以“每只”最清楚。
- source_word: לְשִׁבְעַת הַכְּבָשִׂים
  choice: 七只羊羔
  rationale: 保留原文所指的整组七只羊羔，并调整至句首，使汉语表达简洁自然。
