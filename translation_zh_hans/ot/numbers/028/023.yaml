base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/023.yaml
  text: In addition to the regular morning burnt offering, you shall offer these.
translation:
  language: zh_hans
  text: 除了常献的早晨燔祭以外，你们还要献上这些祭物。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִלְּבַד
  choice: 除了……以外……还
  rationale: 该介词表明节期祭物是在常献祭之外追加的；这一现代汉语结构能清楚表达附加关系，而非排除关系。
- source_word: עֹלַת הַבֹּקֶר אֲשֶׁר לְעֹלַת הַתָּמִיד
  choice: 常献的早晨燔祭
  rationale: 关系短语将早晨的燔祭认定为常献的燔祭，而不是说一项祭物为另一项祭物而献；此译简洁保留了两者的同一关系。
- source_word: תַּעֲשׂוּ
  choice: 要献上
  rationale: עָשָׂה 基本义为“做、办理”，但在献祭规章中按语境自然译作“献上”。
- source_word: אֶת אֵלֶּה
  choice: 这些祭物
  rationale: 指代前文规定的祭物。汉语补出“祭物”，使所指清楚，不增加原文之外的新内容。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的礼仪法规用语。“常献的早晨燔祭”避免误解为一项燔祭是为另一项燔祭而献；“还要”明确表达这些祭物属于追加的献祭。
