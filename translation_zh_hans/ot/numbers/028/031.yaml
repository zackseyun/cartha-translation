base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/031.yaml
  text: Besides the regular burnt offering and its grain offering[a], you shall prepare them; they shall be without blemish[c][b], along with their drink offerings.
translation:
  language: zh_hans
  text: 除了常献的燔祭和它的素祭[a]以外，你们还要献上这些祭牲；祭牲都要毫无残疾[b]，也要献上它们的奠祭[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “常献的燔祭”也可译作“不断献上的燔祭”或“每日献的燔祭”；这里的“素祭”指用谷物献上的祭。
    reason: 说明תָּמִיד的持续／每日含义及מִנְחָה的祭祀专义。
  - marker: b
    text: 希伯来文直译：“它们对你们来说要是完整无缺的”，意思是所献的祭牲不可有缺陷。
    reason: 交代原文לָכֶם及תְּמִימִם的形式与语境含义。
  - marker: c
    text: “奠祭”指把酒倾倒献上的祭。
    reason: 解释现代读者可能不熟悉的祭祀术语נֶסֶךְ。
lexical_decisions:
- source_word: מִלְּבַד
  choice: 除了……以外
  rationale: 表示本节所列祭物是在常献祭之外另加的，符合上下文，也自然清楚。
- source_word: עֹלַת הַתָּמִיד
  choice: 常献的燔祭
  rationale: תָּמִיד在这里指按固定制度持续、每日献上的燔祭；“常献的燔祭”保留祭祀术语，也与本章用语协调。
- source_word: וּמִנְחָתוֹ
  choice: 和同献的素祭
  rationale: מִנְחָה在祭司法例中指以谷物为主的祭物；代词指向常献的燔祭，译作“同献的”可明确其伴随关系。
- source_word: תַּעֲשׂוּ
  choice: 你们还要献上
  rationale: עשה在献祭语境中可指办理、献上祭物；中文用“献上”比直译“制作”自然准确。
- source_word: תְּמִימִם יִהְיוּ לָכֶם
  choice: 祭牲都要没有残疾
  rationale: תְּמִימִם在祭祀语境中要求动物无缺陷；补出“祭牲”以明确复数所指。“לָכֶם”表示对以色列人的要求，已由“你们……要”自然体现，无须生硬直译。
- source_word: וְנִסְכֵּיהֶם
  choice: 并要献上同献的奠祭
  rationale: נֶסֶךְ指倾倒献上的酒祭，中文圣经祭祀术语通常称“奠祭”；“同献的”说明它伴随前述祭牲。
theological_decisions:
- issue: תְּמִימִם的所指
  choice: 明确为所献的祭牲没有残疾
  alternative: 泛指所有前述祭物都完全无缺
  rationale: 形容词为阳性复数，最自然地回指本段所规定的祭牲；祭司法例中的תמים通常描述献祭动物无缺陷。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语，保留“燔祭、素祭、奠祭”等必要祭祀术语，并以脚注简要解释。主句补出“祭牲”，避免原文复数代词在中文里指代不清；句法呈现附加祭物、无残疾要求和伴随奠祭三层信息。
