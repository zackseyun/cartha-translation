id: NUM.28.26
reference: Numbers 28:26
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וּ/בְ/י֣וֹם הַ/בִּכּוּרִ֗ים בְּ/הַקְרִ֨יבְ/כֶ֜ם מִנְחָ֤ה חֲדָשָׁה֙ לַֽ/יהוָ֔ה בְּ/שָׁבֻעֹ֖תֵי/כֶ֑ם מִֽקְרָא קֹ֨דֶשׁ֙ יִהְיֶ֣ה לָ/כֶ֔ם כָּל מְלֶ֥אכֶת עֲבֹדָ֖ה לֹ֥א תַעֲשֽׂוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/026.yaml
  text: And on the day of the firstfruits[a], when you present a new grain offering to Yahweh at your Feast of Weeks, you shall have a holy convocation[b]. You shall do no ordinary work.
translation:
  language: zh_hans
  text: 在初熟之日[a]，就是你们在七七节向雅威献上新素祭的时候，要举行圣会[b]；一切日常劳作都不可做。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “初熟之日”指与初熟出产有关的节期日。
    reason: 说明节期称谓与初熟出产的关系，并避免将“初熟之物”限于水果。
  - marker: b
    text: 或译“神圣集会”。希伯来语是礼仪用语，指召集众人敬拜的神圣聚会。
    reason: 保留 מִקְרָא קֹדֶשׁ 的词义范围及可行译法。
lexical_decisions:
- source_word: וּבְיוֹם הַבִּכּוּרִים
  choice: 在初熟果实之日
  rationale: 按字义保留节期与初熟收成的关联；“初熟果实”在现代汉语中比单说“初熟”更明确。
- source_word: בְּהַקְרִיבְכֶם
  choice: 就是你们……献上……的时候
  rationale: 介词加不定式结构表示同时发生的时间；祭祀语境中的 קרב 译作“献上”，自然且保留献祭含义。
- source_word: מִנְחָה חֲדָשָׁה
  choice: 新素祭
  rationale: 在祭司文献中 מִנְחָה 通常指以谷物为内容的祭物；“素祭”是准确而简洁的汉语礼仪术语，“新”指与新收成相关。
- source_word: לַיהוָה
  choice: 向雅威
  rationale: 直接音译四字神名，保留其作为以色列之上帝圣约名字的性质。
- source_word: בְּשָׁבֻעֹתֵיכֶם
  choice: 在七七节
  rationale: 此处指以七个七日为计算背景的节期；“七七节”是现代中文中清楚且贴近希伯来语构词的名称。
- source_word: מִקְרָא קֹדֶשׁ
  choice: 圣会
  rationale: 该固定礼仪用语指受召而举行的神圣聚会；“圣会”简洁、庄重，并保留召集敬拜的含义。
- source_word: יִהְיֶה לָכֶם
  choice: 要举行
  rationale: 将希伯来语“要为你们有”按现代汉语习惯表达，同时保留法规性的指令语气。
- source_word: כָּל מְלֶאכֶת עֲבֹדָה
  choice: 任何日常劳作
  rationale: 该祭司传统用语所禁的是平日谋生或例行的劳动，并非绝对禁止一切活动；“日常劳作”保留这一范围。
- source_word: לֹא תַעֲשׂוּ
  choice: 都不可做
  rationale: 准确表达第二人称复数的直接禁令，并与“任何”构成自然的汉语全称否定。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华／上主
  rationale: 原文直接使用上帝的专名；“雅威”较贴近通常重构的希伯来语读音，并避免以称号取代专名。
- issue: מִקְרָא קֹדֶשׁ 的礼仪含义
  choice: 圣会
  alternative: 神圣集会／圣召
  rationale: 既表达聚集本身，也不把该词组缩减为单纯的宣告；脚注说明其含有召集敬拜之意。
- issue: 节期禁工的范围
  choice: 任何日常劳作都不可做
  alternative: 任何劳苦的工作／职业工作都不可做
  rationale: 保留 מְלֶאכֶת עֲבֹדָה 对常规劳动的限定，避免误读为禁止一切行为，同时不擅自列举例外。
translation_notes:
  register: 采用现代、庄重而易懂的法规体。“就是……的时候”使节期名称与献新素祭的时间关系清楚；分号连接正面节期命令与禁工规定。所有第二人称复数均以“你们”表达。
