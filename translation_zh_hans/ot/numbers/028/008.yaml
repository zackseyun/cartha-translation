source:
  edition: WLC
  text: וְ/אֵת֙ הַ/כֶּ֣בֶשׂ הַ/שֵּׁנִ֔י תַּעֲשֶׂ֖ה בֵּ֣ין הָֽ/עַרְבָּ֑יִם כְּ/מִנְחַ֨ת הַ/בֹּ֤קֶר וּ/כְ/נִסְכּ/וֹ֙ תַּעֲשֶׂ֔ה אִשֵּׁ֛ה רֵ֥יחַ נִיחֹ֖חַ לַ/יהוָֽה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/008.yaml
  text: And you shall offer the second lamb between the evenings[a]; like the morning grain offering and its drink offering, you shall offer it as a food offering[b], a pleasing aroma to Yahweh.
translation:
  language: zh_hans
  text: 第二只羊羔要在黄昏时[a]献上；要照早晨的素祭和奠祭那样办理，作为献给耶和华的火祭[b]，成为蒙悦纳的馨香。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“在两个晚上之间”。这是一个传统的时间说法，通常理解为“黄昏时”，但其确切时段仍有争议。
    reason: 保留בֵּין הָעַרְבָּיִם的字面形式及其时间含义的争议。
  - marker: b
    text: 或译“献上的食物”。这里的希伯来词通常指用火献上的祭物。
    reason: 保留אִשֵּׁה可译为“火祭”或“献上的食物”的词义张力。
lexical_decisions:
- source_word: הַכֶּבֶשׂ הַשֵּׁנִי
  choice: 第二只羊羔
  rationale: 在献祭语境中，כֶּבֶשׂ通常指羊羔；保留“第二只”，与早晨所献的第一只相对应。
- source_word: תַּעֲשֶׂה
  choice: 你要献上
  rationale: עָשָׂה本义为“做、预备”，但以祭牲和祭物为宾语时，现代汉语用“献上”更自然，也准确表达献祭动作。
- source_word: בֵּין הָעַרְבָּיִם
  choice: 在两晚之间
  rationale: 尽量保留希伯来语双数形式及其时间表达的开放性；其确切所指存在争议，较自然的“黄昏时”收入脚注。
- source_word: כְּמִנְחַת הַבֹּקֶר
  choice: 像早晨的素祭
  rationale: 祭司文献中的מִנְחָה特指谷物祭，汉语传统且准确的对应语是“素祭”。
- source_word: וּכְנִסְכּוֹ
  choice: 和同献的奠祭一样
  rationale: נֶסֶךְ指浇奠的祭物；“奠祭”简明、通行。“同献的”明确该奠祭与早晨的祭相配，同时避免生硬的代词指向。
- source_word: אִשֵּׁה
  choice: 火祭
  rationale: 该词指以火献上的祭物；“火祭”保留词中的火焚要素。其也可能侧重献给神的祭物或食物，故以脚注说明。
- source_word: רֵיחַ נִיחֹחַ
  choice: 蒙悦纳的馨香
  rationale: 保留祭祀语境中的香气意象，并以“蒙悦纳”表达נִיחֹחַ所含的喜悦、接纳意味，而不把隐喻改写成抽象陈述。
- source_word: לַיהוָה
  choice: 献给耶和华
  rationale: 按希伯来文直接呈现神的专名יהוה；“献给”与祭物语境及介词ל相合。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 正文使用现代简体中文读者最熟悉、可直接识别为以色列之神专名的“耶和华”，而不以“主”替代原文专名。
- issue: 时间短语בֵּין הָעַרְבָּיִם的理解
  choice: 在两晚之间
  alternative: 黄昏时
  rationale: 该希伯来惯用语的精确时段有争议；正文保留较形式对应的表达，脚注提供自然理解，不把争议静默定论。
- issue: אִשֵּׁה的语义侧重
  choice: 火祭
  alternative: 献上的食物
  rationale: “火祭”直接保留词语与火焚献祭的关系；同时承认该词在祭司语汇中也可能侧重献给神的祭物或食物，因此加注保留另一理解。
translation_notes:
  register: 采用现代、庄重而易懂的礼仪性语言。“素祭、奠祭、火祭、馨香”等为中文圣经语境中清楚且简洁的祭祀术语；句式略具仪式性，以呼应律法条文，同时避免古奥虚词。
