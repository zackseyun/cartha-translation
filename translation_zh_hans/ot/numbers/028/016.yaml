base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/016.yaml
  text: In the first month[a], on the fourteenth day of the month, is the Passover of Yahweh.
translation:
  language: zh_hans
  text: 正月十四日是雅威的逾越节[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“献给雅威的逾越节。”希伯来语介词可表示归属或奉献。
    reason: 保留לַיהוָה可表达归属或奉献的语义范围，同时维持本节历法语境中“逾越节”的译法。
lexical_decisions:
- source_word: וּ/בַ/חֹדֶשׁ הָ/רִאשׁוֹן
  choice: 正月
  rationale: “正月”是现代汉语中自然、简洁的历法表达；句首连接词 וּ 在此承接上下文，不必机械译为“并且”。
- source_word: בְּ/אַרְבָּעָה עָשָׂר יוֹם לַ/חֹדֶשׁ
  choice: 十四日
  rationale: 这是希伯来语常见的日期格式；与前面的“正月”合译为“正月十四日”，既准确又符合现代汉语习惯。
- source_word: פֶּסַח
  choice: 逾越节
  rationale: “逾越节”是 פֶּסַח 通行而易懂的汉语译名。本节并未明确限定为祭牲，因此不在正文中过度具体化为“逾越祭”。
- source_word: לַ/יהוָה
  choice: 归于雅威
  rationale: 介词 לְ 可表达归属、关联或奉献方向；“归于雅威”保留这种语义张力，并避免把它单纯处理成所有格。神名 יהוה 音译为“雅威”。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名；采用“雅威”呈现其专名性质，而不以称号“主”代替。
- issue: לַיהוָה 所表达的关系
  choice: 归于雅威
  alternative: 雅威的；献给雅威
  rationale: 希伯来语介词既可指归属，也可指奉献或指向。正文用“归于”尽量保留两者之间的开放性，脚注说明另一种自然理解。
translation_notes:
  register: 采用简洁、庄重的现代标准汉语。日期表达依照汉语习惯压缩为“正月十四日”；保留无动词名词句的陈述感，并用“归于”体现原文的简练与歧义。
