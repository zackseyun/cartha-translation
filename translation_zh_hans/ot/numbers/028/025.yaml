  text: On the seventh day you shall have a holy convocation[b][a]; you shall do no ordinary work.
translation:
  language: zh_hans
  text: 第七日，你们要举行圣会[a]；一切日常劳作[b]都不可做。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“神圣的聚会”或“圣洁的集会”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来原文作“一切劳役的工作”或“一切劳作的工作”，指日常或职业性的工作。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בַ/יּוֹם֙ הַ/שְּׁבִיעִ֔י
  choice: 第七日
  rationale: 自然表达时间状语；希伯来语句首连接词在中文中无须机械译作“并且”，经文承接关系仍然清楚。
- source_word: מִקְרָא קֹ֖דֶשׁ
  choice: 圣会
  rationale: 这一固定礼仪用语指受召聚集的神圣集会。“圣会”简洁庄重，也符合现代中文圣经语体；脚注保留“神圣的聚会”等可行表达。
- source_word: יִהְיֶ֣ה לָ/כֶ֑ם
  choice: 你们要举行
  rationale: 原文直译为“要为你们有”。结合“圣会”，中文用“你们要举行”自然地表达法规语境中的规定性，同时不改变集会的含义。
- source_word: כָּל מְלֶ֥אכֶת עֲבֹדָ֖ה
  choice: 一切日常劳作
  rationale: 该短语并非泛指任何动作，而是指平常从事的职业性或劳务性工作。“日常劳作”体现圣日与通常工作的对照，又避免“苦工”或“奴仆之工”可能造成的误解。
- source_word: לֹ֥א תַעֲשֽׂוּ
  choice: 都不可做
  rationale: 否定未完成式在法规语境中表达禁令；“不可做”保持庄重、明确的规范语气。
