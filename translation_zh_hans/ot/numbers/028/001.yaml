  yaml_path: translation/ot/numbers/028/001.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: zh_hans
  text: 耶和华吩咐摩西说：
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: 说
  rationale: 该词在叙事中是常见的发言引入语；现代汉语用“说”自然简洁，并与后面的 לֵאמֹר 合并表达，避免生硬重复为“讲话……说”。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 这是四字神名 YHWH。中文圣经传统通行译名“耶和华”辨识度高，也保留其作为专名的性质；脚注注明希伯来文形式及另一种音译。
- source_word: אֶל־מֹשֶׁה
  choice: 对摩西
  rationale: 介词 אֶל 在言说结构中表示话语所指向的对象，汉语自然表达为“对摩西”。
- source_word: לֵאמֹר
  choice: 说：
  rationale: 该不定式用于引出后续直接引语。中文以“说：”即可清楚体现其功能；不逐字重复前面的 וַיְדַבֵּר。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名，而非“主”这一称号。正文采用现代中文读者最熟悉的专名“耶和华”，同时以脚注保留“雅威”这一更接近学界常见重构读音的音译，不将神名改成称号。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。希伯来文“讲话……说”的双重结构按汉语习惯压缩为“对摩西说：”，既保留引出神谕的功能，也避免不自然的重复。
