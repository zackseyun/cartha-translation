  text: וְ/עִשָּׂרֹ֣ן עִשָּׂר֗וֹן סֹ֤לֶת מִנְחָה֙ בְּלוּלָ֣ה בַ/שֶּׁ֔מֶן לַ/כֶּ֖בֶשׂ הָ/אֶחָ֑ד עֹלָה֙ רֵ֣יחַ נִיחֹ֔חַ אִשֶּׁ֖ה לַ/יהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/013.yaml
  text: and a tenth of an ephah of fine flour as a grain offering mixed with oil for each lamb[a], as a burnt offering, a pleasing aroma, a food offering to Yahweh.
translation:
  language: zh_hans
  text: 每只羊羔的燔祭，要配十分之一伊法的细面，用油调和，作为素祭；这是献给雅威、蒙悦纳的馨香，是火祭[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“食物祭”。
    reason: 原词 אִשֶּׁה 的确切语义有争议，可理解为用火献上的祭，也可能是献给神的食物祭。
lexical_decisions:
- source_word: וְעִשָּׂרֹן עִשָּׂרוֹן
  choice: 又要为每只……献十分之一伊法
  rationale: 重复的“十分之一”在本段祭祀条例中具有逐一分配的意味，指每只羊羔配十分之一伊法；补出“伊法”使计量单位明确。
- source_word: סֹלֶת מִנְחָה
  choice: 细面……作为素祭
  rationale: סֹלֶת 是祭祀用的精细面粉；מִנְחָה 在此特指以谷物为内容的祭，汉语传统且清楚的对应词是“素祭”。
- source_word: בְּלוּלָה בַשֶּׁמֶן
  choice: 调上油
  rationale: 表达面粉与油混合，采用自然、庄重的现代汉语。
- source_word: לַכֶּבֶשׂ הָאֶחָד
  choice: 为每只羊羔
  rationale: 结合上下文保留逐只分配祭物分量的含义，避免误解为总共只有一只羊羔。
- source_word: עֹלָה
  choice: 燔祭
  rationale: 这是整只焚烧献上的祭物之固定祭祀术语。
- source_word: רֵיחַ נִיחֹחַ
  choice: 蒙悦纳的馨香
  rationale: 既保留“馨香”的祭祀意象，也以“蒙悦纳”传达该固定表达所指向的神圣接纳，避免仅理解为气味宜人。
- source_word: אִשֶּׁה
  choice: 火祭
  rationale: 该词与用火献祭密切相关；“火祭”简洁地保留这一要素。其词源和具体语义有争议，因此脚注列出“食物祭”这一可能译法。
- source_word: לַיהוָה
  choice: 献给雅威
  rationale: 按专名处理四字神名，并以“雅威”音译；介词 לַ־ 译为“献给”。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；音译“雅威”力求保留其作为立约之神专名的性质，而不以称号替代。
- issue: 祭祀术语 אִשֶּׁה 的语义
  choice: 火祭
  alternative: 食物祭
  rationale: 原词在祭祀语境中明确涉及献于坛火之物，但其是否强调“火”或作为献给神的“食物”存在词义讨论；正文采用较贴近形式的“火祭”，脚注保存另一可能。
- issue: רֵיחַ נִיחֹחַ 的表达
  choice: 蒙悦纳的馨香
  alternative: 怡人的香气
  rationale: 该短语既有香气意象，也在祭祀语境中表达祭物蒙神悦纳；译文同时保留两层含义，不将其简化为普通嗅觉愉悦。
translation_notes:
  register: 采用现代、庄重而易懂的礼仪性汉语。“素祭”“燔祭”“馨香”保留圣经祭祀术语的连续性；句子分为两句，以清楚区分每只羊羔所配的素祭和整项祭物的性质。
