  text: You shall offer one lamb in the morning[a], and the second lamb you shall offer between the evenings.
translation:
  language: zh_hans
  text: 早晨要献一只羊羔；在两个黄昏之间[a]要献第二只羊羔。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语直译为“两个黄昏之间”，是一种传统的时间表达，通常指黄昏前后或傍晚较早的时段；其具体所指时段仍有不同理解。
    reason: cultural_note
lexical_decisions:
- source_word: הַכֶּבֶשׂ
  choice: 羊羔
  rationale: כֶּבֶשׂ指幼羊，在献祭语境中通常是公羊羔；本节没有再次明说性别，因此译作自然且不过度增补的“羊羔”。
- source_word: אֶחָד
  choice: 一只
  rationale: אֶחָד是基数词“一”；译作“一只”既保留原文措辞，也符合现代汉语量词习惯。
- source_word: תַּעֲשֶׂה
  choice: 你要献上
  rationale: עָשָׂה字面义为“做、制作”，但在献祭条例中指预备并献上祭物；“献上”能自然、准确地表达此处礼仪行为。
- source_word: בַבֹּקֶר
  choice: 在早晨
  rationale: בֹּקֶר意为“早晨”，介词短语直译为“在早晨”，庄重而清楚。
- source_word: הַשֵּׁנִי
  choice: 第二只
  rationale: שֵׁנִי是序数词“第二”；配合前面的“一只”，译作“第二只”清楚保留献祭次序。
- source_word: בֵּין הָעַרְבָּיִם
  choice: 在两晚之间
  rationale: 该固定表达字面为“在两个傍晚之间”，具体所指时段存在解释空间；正文采用较形式对应的译法，并以脚注说明其大致时间范围，以免消除原文歧义。
