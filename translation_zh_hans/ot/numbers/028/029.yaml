translation:
  language: zh_hans
  text: 每只羊羔各用十分之一份[a]；七只羊羔都如此。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“十分之一，十分之一，给那一只羊羔，给七只羊羔。”希伯来文用这种重复形式表示分配，即七只羊羔每只各用十分之一份。这里没有明说完整的计量单位；按本章相邻条例，所指的是细面用量。
    reason: lexical_alternative
lexical_decisions:
- source_word: עִשָּׂרוֹן עִשָּׂרוֹן
  choice: 每只……十分之一份
  rationale: 希伯来文重复单数“十分之一，十分之一”，是分配式表达，表示每只各用一个十分之一的量。原文此处未明说所依据的完整量名，因此正文保留“份”，不擅自补入“伊法”。
- source_word: לַכֶּבֶשׂ הָאֶחָד
  choice: 每只羊羔
  rationale: 字面为“给那一只羊羔”；在献祭条例的分配式结构中，自然表达为“每只羊羔”。
- source_word: לְשִׁבְעַת הַכְּבָשִׂים
  choice: 七只羊羔都要这样
  rationale: 该短语限定上述份量适用于前文所说的七只羊羔；这样翻译既保留总数，也清楚传达逐只适用的关系。
