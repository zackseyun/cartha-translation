  text: וּ/בְ/יוֹם֙ הַ/שַּׁבָּ֔ת שְׁנֵֽי כְבָשִׂ֥ים בְּנֵֽי שָׁנָ֖ה תְּמִימִ֑ם וּ/שְׁנֵ֣י עֶשְׂרֹנִ֗ים סֹ֧לֶת מִנְחָ֛ה בְּלוּלָ֥ה בַ/שֶּׁ֖מֶן וְ/נִסְכּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/009.yaml
  text: 'And on the Sabbath day: two male lambs a year old[a], without blemish, and two-tenths of an ephah of fine flour as a grain offering, mixed with oil[b], and its drink offering.'
translation:
  language: zh_hans
  text: 安息日：两只一岁的、没有残疾的公羊羔，十分之二伊法[a]的细面作素祭，调油，以及相应的奠祭。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文为“两个十分之一”；在献祭法规中，指十分之二伊法。
    reason: cultural_note
lexical_decisions:
- source_word: וּבְיוֹם הַשַּׁבָּת
  choice: 安息日
  rationale: 这是时间短语，承接前文并引出安息日另加的祭物。中文用“安息日”自然明确；冒号保留希伯来文列举祭物的句法，而不擅自增添“献”字。
- source_word: שְׁנֵי כְבָשִׂים בְּנֵי שָׁנָה
  choice: 两只一岁的公羊羔
  rationale: כְבָשִׂים在献祭语境中指公羊羔；בְּנֵי שָׁנָה是表示年龄的惯用语，译作“一岁的”符合现代汉语。
- source_word: תְּמִימִם
  choice: 没有残疾的
  rationale: 在献祭法规中指身体无缺陷，并非抽象意义上的道德“完全”。
- source_word: שְׁנֵי עֶשְׂרֹנִים
  choice: 十分之二伊法
  rationale: עִשָּׂרוֹן是十分之一的容量单位；在此类献祭法规中以伊法为基准。译出“伊法”使计量关系明确。
- source_word: סֹלֶת מִנְחָה
  choice: 细面作素祭
  rationale: סֹלֶת是献祭所用的细面，מִנְחָה在祭司礼仪语境中特指谷物祭；“素祭”是简洁且通行的中文礼仪用语。
- source_word: בְּלוּלָה בַשֶּׁמֶן
  choice: 调油的
  rationale: 表示细面与油混合；“调油”简洁自然，并保留制作方式。
- source_word: וְנִסְכּוֹ
  choice: 以及相应的奠祭
  rationale: נֶסֶךְ指浇奠的液体祭物；第三人称单数后缀表示它与上述安息日祭物相配。中文用“相应的奠祭”比生硬的“它的奠祭”更清楚。
theological_decisions: []
