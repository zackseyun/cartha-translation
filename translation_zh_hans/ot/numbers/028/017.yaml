  yaml_path: translation/ot/numbers/028/017.yaml
  text: And on the fifteenth day of this month is a feast[a]; for seven days unleavened bread shall be eaten.
translation:
  language: zh_hans
  text: 本月十五日是节期[a]；要吃无酵饼七日。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“节庆”。希伯来语 חָג 既可指神圣节期的庆祝活动，也可指节期本身。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בַ/חֲמִשָּׁה עָשָׂר י֛וֹם
  choice: 十五日
  rationale: 介词 בְּ 引出日期，连词 וְ 承接上文；现代汉语用“十五日”自然表达该月第十五天。
- source_word: לַ/חֹדֶשׁ הַ/זֶּה
  choice: 这个月
  rationale: חֹדֶשׁ 在节期历法语境中指“月”；“这个月”准确而自然。
- source_word: חָג
  choice: 节期
  rationale: חָג 指宗教节庆或节期庆典；“节期”比现代汉语中的“筵席”或“宴席”更准确地传达此处的神圣历法含义，同时保留脚注说明其也可译作“节庆”。
- source_word: שִׁבְעַת יָמִים
  choice: 连续七天
  rationale: 该短语表示七天的时段；补出“连续”使现代汉语清楚表达持续时间，并未增加新的礼仪要求。
- source_word: מַצּוֹת
  choice: 无酵饼
  rationale: מַצּוֹת 指未发酵的饼；“无酵饼”是准确、通行且易懂的汉语表达。
- source_word: יֵאָכֵל
  choice: 要……吃
  rationale: Nifal 未完成式是被动形式，直译为“要被吃”；汉语采用泛指主动句“要……吃”更自然，仍保留规条性的语气而不额外强化为绝对命令。
