  text: and one male goat for a sin offering[a], to make atonement for you.
translation:
  language: zh_hans
  text: 又要献一只公山羊作赎罪祭[a]，为你们赎罪。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“洁净祭”。希伯来语这一祭名在祭祀语境中也可理解为用于洁除罪所造成污秽的祭。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/שְׂעִיר
  choice: 并献一只公山羊
  rationale: וּ承接上文，译作“并”；שְׂעִיר指公山羊。结合祭献条例的语境补出“献”，使现代汉语完整自然。
- source_word: חַטָּאת
  choice: 赎罪祭
  rationale: 在祭祀语境中，此词通常指处理罪或不洁的祭物；“赎罪祭”是清楚且通行的中文礼仪术语，同时以脚注保留“洁罪祭”的词义可能。
- source_word: אֶחָד
  choice: 一只
  rationale: 明确保留祭牲的数量，并采用适用于动物的量词。
- source_word: לְ/כַפֵּר
  choice: 为……赎罪
  rationale: 保留כפר在祭司礼仪语境中的赎罪含义，不进一步限定其作用机制。
- source_word: עֲלֵי/כֶם
  choice: 为你们
  rationale: 此处表示祭礼为百姓施行或使他们受益；“为你们”自然简洁。
theological_decisions:
- issue: 祭祀语境中כפר的译法
  choice: 为你们赎罪
  alternative: 为你们施行遮罪；替你们赎罪
  rationale: “赎罪”保留原文的礼仪和神学分量，又不把其机制限定为某一种赎罪理论。
- issue: חַטָּאת作为祭名的含义
  choice: 赎罪祭
  alternative: 洁罪祭
  rationale: 正文采用中文读者较熟悉的“赎罪祭”，脚注说明此祭名也可从洁净罪污的功能理解，以保留原词在祭祀语境中的真实语义张力。
translation_notes:
  register: 采用现代、庄重且易懂的礼仪用语；以“并献”连接上下文，避免孤立成句时生硬。
