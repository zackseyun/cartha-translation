base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/007.yaml
  text: And its drink offering shall be a quarter of a hin for each lamb[c][b][a]. In the holy place you shall pour out a drink offering of strong drink to Yahweh.
translation:
  language: zh_hans
  text: 每只羊羔[a]所配的奠酒，要有四分之一欣。你要在圣所[b]中把浓酒[c]作为奠酒浇奠给雅威。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“给这一只羊羔”或“给那一只羊羔”；原文直译为“给这／那一只羊羔”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“在圣处”。
    reason: lexical_alternative
  - marker: c
    text: “浓酒”指有致醉作用、通常不同于葡萄酒的发酵饮料；确切种类不详，并非特指现代蒸馏烈酒。
    reason: cultural_note
lexical_decisions:
- source_word: וְנִסְכּוֹ
  choice: 所配的奠酒
  rationale: 指与羊羔一同献上的液体祭物；“奠酒”在中文中简明地表达浇献的酒类祭物，后缀所指的关联则用“所配的”体现。
- source_word: רְבִיעִת הַהִין
  choice: 四分之一欣
  rationale: 保留原文的精确比例和古代容量单位“欣”，不擅自换算为现代单位。
- source_word: לַכֶּבֶשׂ הָאֶחָד
  choice: 每只羊羔
  rationale: 字面为“给那一只羊羔”；结合每日献祭中逐只规定用量的语境，译作“每只羊羔”自然表达其分配意义，并以脚注保留字面读法。
- source_word: בַּקֹּדֶשׁ
  choice: 在圣处
  rationale: 祭祀语境表明这是神圣的地点；“圣处”较贴近原文，同时不把范围过早限定为某一特定建筑空间。
- source_word: הַסֵּךְ
  choice: 浇献
  rationale: 该词来自动词נסך，表示把液体祭物倾倒献上；“浇献”同时体现动作和祭祀用途。
- source_word: נֶסֶךְ
  choice: 作为奠酒
  rationale: 保留原文重复出现的祭祀名词，不因中文表达而省略。
- source_word: שֵׁכָר
  choice: 浓酒
  rationale: 泛指有致醉作用、通常与葡萄酒有别的发酵饮料；“浓酒”避免误译为现代蒸馏烈酒，具体种类则留待脚注说明。
- source_word: לַיהוָה
  choice: 给雅威
  rationale: 保留四字神名所指的专名，并用“给”表达奠酒献祭的对象。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名；译作“雅威”保留其作为专名的性质，而不以称号“主”替代。
- issue: בַּקֹּדֶשׁ所指的神圣空间
  choice: 圣处
  alternative: 圣所
  rationale: 原词可泛指神圣地点，也可在祭祀语境中指圣所；正文采用较少限定的“圣处”，脚注列出“圣所”，以保留范围上的张力。
translation_notes:
  register: 采用现代、庄重而易懂的祭祀用语。“奠酒”“浇献”准确呈现液体祭物及其献法；保留古代单位“欣”。正文中的脚注标记按相关词语分别安放。
