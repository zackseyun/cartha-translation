base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/019.yaml
  text: 'And you shall present a food offering[a], a burnt offering to Yahweh: two bulls, one ram, and seven male lambs a year old; they shall be without blemish for you.'
translation:
  language: zh_hans
  text: 你们要向雅威献上火祭，就是燔祭：两头公牛、一只公绵羊和七只一岁的公羊羔；这些祭牲都要无残疾。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִקְרַבְתֶּם
  choice: 你们要献上
  rationale: 使役式在献祭语境中指把祭物带到上帝面前献上；此译自然并保留礼仪含义。
- source_word: אִשֶּׁה
  choice: 火祭
  rationale: 这是指经火焚烧献上的技术性祭祀用语；“火祭”简洁且不把词义限缩为供食性质，并以脚注说明。
- source_word: עֹלָה
  choice: 燔祭
  rationale: 采用现代中文圣经语境中通行的祭祀术语，表示在坛上焚烧的整献祭。
- source_word: לַיהוָה
  choice: 献给雅威的
  rationale: 介词表达祭物归献的对象；以“雅威”呈现经文中的神圣专名。
- source_word: פָּרִים בְּנֵי בָקָר שְׁנַיִם
  choice: 两头公牛
  rationale: 该短语指牛类中的公牛；中文“公牛”已自然表达类别，不机械翻译“牛之子”。
- source_word: וְאַיִל אֶחָד
  choice: 一只公绵羊
  rationale: 准确区分成年公绵羊与后文一岁的公羊羔。
- source_word: וְשִׁבְעָה כְבָשִׂים בְּנֵי שָׁנָה
  choice: 七只一岁的公羊羔
  rationale: 保留数量、年龄和阳性牲畜信息，符合献祭清单的精确性。
- source_word: תְּמִימִם יִהְיוּ לָכֶם
  choice: 你们所献的都要没有残疾
  rationale: 在献祭语境中 תמים 指无身体缺陷；将 לָכֶם 自然处理为献祭者对所备祭牲的责任。
theological_decisions:
- issue: 神圣名号 יהוה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；音译“雅威”保留其作为盟约专名的性质，不以称号替代。
- issue: אִשֶּׁה 与 עֹלָה 的关系
  choice: “火祭”，并说明其作燔祭
  alternative: “食物祭，就是燔祭”；“经火献的祭物，作燔祭”
  rationale: 原文先以祭祀技术词 אִשֶּׁה 描述祭物，再以 עֹלָה 指明种类；译文保留两层表述，不将二者合并为单一术语。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。献祭术语使用“火祭”“燔祭”，牲畜名称则用普通读者易懂且能区分性别、年龄的表达。
