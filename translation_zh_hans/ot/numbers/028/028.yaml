base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/028.yaml
  text: 'And their grain offering shall be fine flour mixed with oil: three-tenths for the one bull[a], and two-tenths for the one ram.'
translation:
  language: zh_hans
  text: 同献的素祭要用调油的细面：每头公牛要献一伊法的十分之三[a]，每只公绵羊要献一伊法的十分之二。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“三个十分之一量”和“两个十分之一量”；在这里的献祭条例中，通常理解为伊法的十分之三和十分之二。
    reason: 文化与度量衡说明
lexical_decisions:
- source_word: וּמִנְחָתָם
  choice: 同献的素祭
  rationale: מִנְחָה在献祭条例中专指以谷物为主的“素祭”；“同献的”自然表达其与前述牲祭配合献上的关系，也承接词首连词。
- source_word: סֹלֶת
  choice: 细面
  rationale: 这是献祭用优质细面粉的常用称呼；“细面”简洁、庄重，也符合现代中文圣经语域。
- source_word: בְּלוּלָה בַשָּׁמֶן
  choice: 调油的
  rationale: 被动分词表示细面与油混合；“调油的细面”比“混合了油的细面”简练自然，并保留礼仪制备含义。
- source_word: שְׁלֹשָׁה עֶשְׂרֹנִים
  choice: 一伊法的十分之三
  rationale: 原文直译为“三个十分之一量”；在献祭法规中通常理解为伊法的十分之三。正文采用现代中文易懂的比例表达，并以脚注说明原文形式。
- source_word: לַפָּר הָאֶחָד
  choice: 每头公牛
  rationale: פַּר指公牛；定冠词加“一”在分配性献祭规定中自然译作“每头”，比生硬的“那一头公牛”更符合中文。
- source_word: שְׁנֵי עֶשְׂרֹנִים
  choice: 一伊法的十分之二
  rationale: 原文为“两个十分之一量”；按同一献祭计量背景译为一伊法的十分之二。
- source_word: לָאַיִל הָאֶחָד
  choice: 每只公绵羊
  rationale: אַיִל指成年公绵羊；译作“公绵羊”可避免“公羊”可能泛指其他羊类的歧义，分配结构译作“每只”。
