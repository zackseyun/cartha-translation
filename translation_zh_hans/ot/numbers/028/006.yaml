  text: עֹלַ֖ת תָּמִ֑יד הָ/עֲשֻׂיָה֙ בְּ/הַ֣ר סִינַ֔י לְ/רֵ֣יחַ נִיחֹ֔חַ אִשֶּׁ֖ה לַֽ/יהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/006.yaml
  text: It is the regular burnt offering[a], made at Mount Sinai as a pleasing aroma[d][c][b], a food offering to Yahweh.
translation:
  language: zh_hans
  text: 这是在西奈山[b]所献的常献燔祭[a]，献作蒙悦纳的香气[c]，是献给雅威的火祭[d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“持续的燔祭”或“常规的燔祭”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“在西奈山制定的”。希伯来语直译为“在西奈山做成／施行的”；此处可指在那里献行，也可能指此祭在那里被制定。
    reason: alternative_reading
  - marker: c
    text: 或译：“馨香之气”或“舒缓的香气”；这是表示祭物蒙悦纳的祭祀用语。
    reason: lexical_alternative
  - marker: d
    text: “火祭”所对应的希伯来语含义有争议，也有人译作“食物祭”。
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹלַת
  choice: 燔祭
  rationale: 这是现代中文圣经语境中对全然焚烧之祭的通行术语，准确而简洁。
- source_word: תָּמִיד
  choice: 常献的
  rationale: 表达此祭按规定持续、定期献上的性质，并与本段每日献祭的语境相符。
- source_word: הָעֲשֻׂיָה
  choice: 献上的
  rationale: 该被动分词字面可指“做成的”，在祭祀语境中自然理解为“献上的”；不在正文中确定为“设立的”，以免消除原文歧义。
- source_word: בְּהַר סִינַי
  choice: 在西奈山
  rationale: 保留介词短语的地点表达；其意义可能是实际献祭之地，也可能涉及该祭在那里被设立，脚注说明。
- source_word: לְרֵיחַ נִיחֹחַ
  choice: 作为蒙悦纳的香气
  rationale: 既保留“香气”的祭祀意象，也传达 נִיחֹחַ 在此表示祭物蒙神悦纳的惯用意义。
- source_word: אִשֶּׁה
  choice: 火祭
  rationale: 祭司文献中的专门祭祀术语，与火有关；“火祭”比“食物祭”更直接保留词语形式及传统理解，同时用脚注说明另一种解释。
- source_word: לַיהוָה
  choice: 献给雅威
  rationale: 保留介词所表达的献祭对象，并将四字神名 יהוה 音译为“雅威”。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华／上主
  rationale: 原文直接使用四字神名；音译“雅威”较贴近现今常见的学术重构，也保留其作为盟约神名的性质。
- issue: 祭祀惯用语 רֵיחַ נִיחֹחַ
  choice: 蒙悦纳的香气
  alternative: 馨香之气／舒缓的香气
  rationale: 此译传达祭物蒙神接纳的含义，同时保留原文具象的嗅觉意象，不把它解释成某种机械性的安抚。
- issue: הָעֲשֻׂיָה בְּהַר סִינַי 的指向
  choice: 是在西奈山献上的
  alternative: 是在西奈山设立的
  rationale: 正文贴近被动分词“被做成／献上”的直接含义；“设立”符合上下文的一种可能理解，但解释性较强，故列入脚注。
- issue: אִשֶּׁה 的祭祀含义
  choice: 火祭
  alternative: 食物祭
  rationale: “火祭”保留该词传统上与焚烧献祭相关的理解；词源和祭司文献用法存在争议，脚注保留“食物祭”的可能解释。
translation_notes:
  register: 采用庄重而易懂的现代标准普通话。“常献的燔祭”“蒙悦纳的香气”“火祭”保留祭祀语域，同时以脚注交代关键词语和句法上的真实歧义。所有脚注标记均置于正文相关词组之后。
