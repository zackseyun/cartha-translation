revisions:
- from: 又要献一伊法细面粉的十分之一作素祭[a]，调上四分之一欣捣成的油。
  to: 又要献十分之一伊法的细面粉作谷物祭[a]，用四分之一欣捣出的油调和。
  rationale: 修订改善分数表达和“用油调和”的句法关系，使汉语更自然，同时保留原文的古代计量单位、祭礼类别及油的制作描述。脚注锚点仍准确附于计量单位首次出现处。
