  yaml_path: translation/ot/numbers/028/005.yaml
  text: and a tenth of an ephah of fine flour for a grain offering[b][a], mixed with a quarter of a hin of beaten oil.
translation:
  language: zh_hans
  text: 又要献十分之一伊法的细面粉作谷物祭[a]，用四分之一欣捣出的油调和。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 伊法和欣都是古代以色列的计量单位。
    reason: cultural_note
lexical_decisions:
- source_word: וַעֲשִׂירִית הָאֵיפָה
  choice: 又要献一伊法……的十分之一
  rationale: 前缀连接上一节的献祭规定；保留古代干量单位“伊法”，并按现代汉语习惯表达分数关系。
- source_word: סֹלֶת
  choice: 细面粉
  rationale: 指献祭所用的精细面粉；“细面粉”清楚、自然，也符合祭祀语境。
- source_word: לְמִנְחָה
  choice: 作素祭
  rationale: 在祭司礼仪法规中，מִנְחָה指以谷物为主要祭物的特定祭类；“素祭”是简洁且通行的中文名称。
- source_word: בְּלוּלָה בְּשֶׁמֶן
  choice: 调上……油
  rationale: 分词描述面粉与油混合；“调上”符合现代中文食材混合的自然表达。
- source_word: כָּתִית
  choice: 捣成的
  rationale: 该词描述橄榄经捣碎或压碎而取得的油；“捣成的油”较直接保留其制作方式，避免将工艺限定为现代压榨。
- source_word: רְבִיעִת הַהִין
  choice: 四分之一欣
  rationale: 保留古代液量单位“欣”，并以现代汉语自然表达四分之一的数量。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的祭祀法规语体；保留“伊法”“欣”等原文计量单位，不作可能造成虚假精确的现代容量换算。“素祭”作为祭类名称，避免误解为泛指任何供物。
