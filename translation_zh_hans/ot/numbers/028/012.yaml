base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/012.yaml
  text: and three-tenths of an ephah of fine flour as a grain offering[a], mixed with oil, for the one bull, and two-tenths of an ephah of fine flour as a grain offering, mixed with oil[b], for the one ram.
translation:
  language: zh_hans
  text: 又要为每头公牛献伊法的十分之三细面作素祭[a]，用油调和；为每只公绵羊献伊法的十分之二细面作素祭，也用油调和[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“三个十分之一”和“两个十分之一”；这里按上下文理解为伊法的十分之一。
    reason: cultural_note
  - marker: b
    text: “用油调和”或译“与油搀和”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/שְׁלֹשָׁה עֶשְׂרֹנִים
  choice: 十分之三个伊法
  rationale: 原文直译为“三个十分之一”，在献祭条例中所指单位按上下文理解为伊法；明说“伊法”可帮助现代读者理解，同时保留古代度量单位。
- source_word: סֹלֶת
  choice: 细面
  rationale: 这是祭祀语境中指精制面粉的常用词；“细面”简洁、自然，也符合中文圣经传统用语。
- source_word: מִנְחָה
  choice: 素祭
  rationale: 在此献祭条例中专指以谷物为主的祭物，而非泛指礼物或供物；“素祭”是现代中文圣经中清楚且通行的礼仪术语。
- source_word: בְּלוּלָה בַ/שֶּׁמֶן
  choice: 调上油
  rationale: 该分词短语描述细面与油混合的预备方式；“调上油”在现代汉语中自然，并保留“混合、搀调”的意义。
- source_word: לַ/פָּר הָ/אֶחָד
  choice: 为那一头公牛
  rationale: 定冠词加“一”在此指所说的单个祭牲，而非“第一头”；“那一头”保留其特指形式，避免引入次序含义。
- source_word: וּ/שְׁנֵי עֶשְׂרֹנִים
  choice: 十分之二个伊法
  rationale: 原文为“两个十分之一”；结合献祭条例补明度量单位“伊法”，兼顾准确与可懂性。
- source_word: לָ/אַיִל הָֽ/אֶחָֽד
  choice: 为那一只公绵羊
  rationale: 与“那一头公牛”平行，指单个特定祭牲而非“第一只”；“公绵羊”也准确区分 אַיִל 与一般的羊。
theological_decisions: []
