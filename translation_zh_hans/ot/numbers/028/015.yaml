  text: And one male goat for a sin offering to Yahweh shall be offered besides the regular burnt offering and its drink offering[a].
translation:
  language: zh_hans
  text: 又要献一只公山羊，作献给雅威的赎罪祭[a]；这要在常献的燔祭及其奠祭以外献上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“洁净祭”。希伯来语 חַטָּאת 所指的祭，既可处理罪，也可处理礼仪上的不洁。
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂעִיר עִזִּים
  choice: 一只公山羊
  rationale: 该短语指公山羊；保留其性别，并以现代汉语祭祀语境中自然清楚的表达呈现。
- source_word: אֶחָד
  choice: 一只
  rationale: 明确保留数词“一”，因为这是祭物规格的一部分；量词“只”符合现代汉语习惯。
- source_word: לְחַטָּאת
  choice: 作……赎罪祭
  rationale: 在祭祀律例中，חַטָּאת指处理罪或不洁的祭物。“赎罪祭”是中文读者熟悉的名称，同时以脚注保留“洁净祭”的可能译法。
- source_word: לַיהוָה
  choice: 献给雅威
  rationale: לְ在此表示祭物归献的对象；יהוה按其专名译作“雅威”。
- source_word: עַל
  choice: 在……以外
  rationale: 这里表示这项祭物附加于常献的燔祭及其奠祭，并非空间意义上的“在……上面”。
- source_word: עֹלַת הַתָּמִיד
  choice: 常献的燔祭
  rationale: תָּמִיד强调固定持续的礼仪安排；“常献的燔祭”既保留持续性，也不额外限定为某一时段。
- source_word: יֵעָשֶׂה
  choice: 献上
  rationale: 该动词字面可指“做、办理”，但在献祭语境中译作“献上”最自然准确。
- source_word: וְנִסְכּוֹ
  choice: 同献的奠祭
  rationale: נֶסֶךְ指伴随燔祭浇奠的祭物；“奠祭”是简洁、庄重且通行的中文礼仪用语。代词后缀说明它与前述常献燔祭相配。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；译作“雅威”旨在呈现这一专名，而不以称号替代。
- issue: 祭祀语境中 חַטָּאת 的译法
  choice: 赎罪祭
  alternative: 洁净祭
  rationale: 该词兼有处理罪与礼仪不洁的语义范围。正文采用较通行的“赎罪祭”，脚注保留“洁净祭”，避免消除原词的真实语义张力。
translation_notes:
  register: 采用现代、庄重而易懂的规范汉语。以“又要献……；这是……”重组希伯来语句法，使祭物、归献对象及其与常献燔祭的附加关系清楚，同时保留律法条文的正式语气。
