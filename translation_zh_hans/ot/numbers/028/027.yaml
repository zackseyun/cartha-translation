base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/027.yaml
  text: 'And you shall present a burnt offering as a pleasing aroma to Yahweh: two bulls from the herd[a], one ram, and seven male lambs a year old.'
translation:
  language: zh_hans
  text: 你们要献上献给雅威、作馨香之气的燔祭[a]：两头公牛、一只公绵羊和七只一岁的公羊羔。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “馨香之气”也可译作“令人舒畅的香气”或“蒙悦纳的香气”。希伯来语 לְרֵיחַ נִיחֹחַ 是献祭惯用语。
    reason: 说明祭祀惯用语的词义范围，并保留其具体香气意象及祭物蒙悦纳的含义。
lexical_decisions:
- source_word: וְהִקְרַבְתֶּם
  choice: 你们要献上
  rationale: קרב的使役式在献祭语境中指把祭物呈献上去；“献上”自然地保留了礼仪含义。
- source_word: עוֹלָה
  choice: 燔祭
  rationale: 这是祭物全部焚烧献上的固定祭祀类别；“燔祭”是现代中文圣经语境中简洁而明确的通行名称。
- source_word: לְרֵיחַ נִיחֹחַ
  choice: 作为……馨香
  rationale: 这是希伯来文献祭惯用语，指祭物所发的香气令人舒畅并蒙悦纳；“馨香”保留香气意象，也符合庄重而自然的中文表达。
- source_word: לַיהוָה
  choice: 献给雅威
  rationale: 介词לְ表示祭物归给雅威；以“雅威”音译יהוה，保留经文中的神圣名字。
- source_word: פָּרִים בְּנֵי בָקָר שְׁנַיִם
  choice: 两头公牛
  rationale: 该短语指牛类牲畜中的公牛；中文“公牛”已明确牲畜类别，无须生硬直译“牛之子”。
- source_word: אַיִל אֶחָד
  choice: 一只公绵羊
  rationale: אַיִל在祭牲清单中指成年的公绵羊；如此译可与后面的公羊羔清楚区分。
- source_word: שִׁבְעָה כְבָשִׂים בְּנֵי שָׁנָה
  choice: 七只一岁的公羊羔
  rationale: כְבָשִׂים指公羊羔，בְּנֵי שָׁנָה说明其年龄为一岁；中文依自然次序合并表达。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名יהוה；音译“雅威”旨在保留以色列之神在经文中的专名，而不以称号替代。
- issue: לְרֵיחַ נִיחֹחַ所表达的祭物蒙悦纳含义
  choice: 馨香
  alternative: 令人舒畅的香气／蒙悦纳的香气
  rationale: 正文保留原文具体的香气意象，不把它完全抽象化为“蒙悦纳”；脚注说明这一祭祀惯用语可能包含令人舒畅和蒙悦纳的含义。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“献上”“燔祭”保留祭祀语域；牲畜量词分别用“头”和“只”，使清单自然清晰。脚注标记紧跟其所解释的“馨香”，避免歧义。
