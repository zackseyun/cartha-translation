translation:
  language: zh_hans
  text: 又献一只公山羊，为你们赎罪[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“（又）一只公山羊，为你们赎罪”；正文的“献”是根据紧邻的献祭语境补出的。原文没有明说祭物类别；根据上下文，这只公山羊可理解为作赎罪祭。
    reason: 说明原文的省略表达、正文中依语境补出的动词，以及上下文所暗示但未明说的祭物类别。
lexical_decisions:
- source_word: שְׂעִיר עִזִּים
  choice: 公山羊
  rationale: 该组合在献祭语境中指雄性的山羊；“公山羊”是现代汉语中清楚自然的说法。
- source_word: אֶחָד
  choice: 一只
  rationale: 数词表示一只动物；用量词“只”符合现代汉语习惯。
- source_word: לְכַפֵּר
  choice: 赎罪
  rationale: כפר在祭司献祭语境中指施行赎罪。“赎罪”保留礼仪含义，同时不限定具体的赎罪理论。
- source_word: עֲלֵיכֶם
  choice: 为你们
  rationale: 与כפר连用时，עַל标明赎罪所惠及的对象；“为你们”自然表达受益者。
theological_decisions:
- issue: 是否在正文补出原文未明说的祭物类别“作赎罪祭”
  choice: 不补入正文，并以脚注说明原文的省略表达
  alternative: 根据紧邻的献祭语境译作“又献一只公山羊作赎罪祭，为你们赎罪”
  rationale: 希伯来文本只明说“一只公山羊”和目的“为你们赎罪”。上下文确实暗示这是赎罪祭，但为保留原文的省略形式，不在正文中补足，并在脚注交代语境所隐含的类别。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。“又献”承接祭物清单；保留原文目的从句，并用脚注呈现语境补足，避免在正文中消除原有的省略性。
