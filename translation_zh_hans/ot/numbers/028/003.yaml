  text: וְ/אָמַרְתָּ֣ לָ/הֶ֔ם זֶ֚ה הָֽ/אִשֶּׁ֔ה אֲשֶׁ֥ר תַּקְרִ֖יבוּ לַ/יהוָ֑ה כְּבָשִׂ֨ים בְּנֵֽי שָׁנָ֧ה תְמִימִ֛ם שְׁנַ֥יִם לַ/יּ֖וֹם עֹלָ֥ה תָמִֽיד־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/003.yaml
  text: 'And you shall say to them[a], ‘This is the food offering that you shall present to Yahweh: two male lambs a year old, without blemish, each day, as a regular burnt offering.’'
translation:
  language: zh_hans
  text: 你要对他们说：‘这是你们要献给雅威的火祭[a]：每天两只一岁、没有瑕疵的公羊羔，作为常献的燔祭。’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “火祭”也可理解为“献给雅威的食物”。
    reason: 保留 הָאִשֶּׁה 在祭司献祭语境中“以火献上的祭物”与“给神的食物”之间的词义张力，并与正文的神名译法一致。
lexical_decisions:
- source_word: הָאִשֶּׁה
  choice: 火祭
  rationale: 该词指献在坛火中的祭物。“火祭”简洁地保留了词语与火的关联，也符合祭祀语境；脚注说明另一种可能的理解。
- source_word: תַּקְרִיבוּ
  choice: 献给
  rationale: 使役式的 קרב 在献祭语境中指把祭物带近并呈献；“献给”在现代汉语中自然、明确。
- source_word: לַיהוָה
  choice: 给雅威
  rationale: 按希伯来文本直接保留四字神名，以“雅威”音译。
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה
  choice: 一岁的公羊羔
  rationale: כְּבָשִׂים 指公羊羔，בְּנֵי שָׁנָה 是表示年龄的惯用语；此译保留祭牲的性别与年龄要求。
- source_word: תְמִימִם
  choice: 没有残疾的
  rationale: 在祭祀律例中指祭牲没有身体缺陷；“没有残疾”比泛泛的“完全”更准确清楚。
- source_word: לַיּוֹם
  choice: 每天
  rationale: 这里具有按日分配的含义，即每日献两只；“每天”是自然明确的现代汉语。
- source_word: עֹלָה
  choice: 燔祭
  rationale: 这是整只焚烧献上的祭，采用通行且准确的中文祭祀术语“燔祭”。
- source_word: תָמִיד
  choice: 常献的
  rationale: 该词在祭祀条例中表示按规定持续、定期举行，并非每时每刻不间断燃烧；“常献的”保留其经常性。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”较贴近学界通行的拟音，同时不以称号替代专名。
- issue: הָאִשֶּׁה 的祭祀含义
  choice: 火祭
  alternative: 食物祭／献给上帝的食物
  rationale: 该词可从献于火中的方式理解，也可在祭司文献的供物语境中理解为给上帝的食物。正文采用直接且自然的“火祭”，脚注保留另一理解，不把祭物粗率地解释为上帝赖以进食。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。句式贴近原文宣告结构，同时以“每天”“常献的”等自然表达说明每日例行献祭；保留“燔祭”等必要的礼仪术语。
