  text: כָּ/אֵ֜לֶּה תַּעֲשׂ֤וּ לַ/יּוֹם֙ שִׁבְעַ֣ת יָמִ֔ים לֶ֛חֶם אִשֵּׁ֥ה רֵֽיחַ נִיחֹ֖חַ לַ/יהוָ֑ה עַל עוֹלַ֧ת הַ/תָּמִ֛יד יֵעָשֶׂ֖ה וְ/נִסְכּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/024.yaml
  text: 'Thus you shall offer these each day for seven days: food[a], an offering made by fire, a pleasing aroma to Yahweh[c][b]; it shall be offered in addition to the regular burnt offering and its drink offering.'
translation:
  language: zh_hans
  text: 连续七天，你们每天要照这样献上：作为献给雅威、馨香的火祭食物[a]；这要在常献的燔祭及其奠祭之外献上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “火祭食物”直译为“火祭的食物”。“食物”指献给神的祭物，并不表示这里所献的只是通常意义上的饼。
    reason: cultural_note
lexical_decisions:
- source_word: כָּאֵלֶּה
  choice: 照这样
  rationale: 前缀כ保留比较、依照前述规格而行的含义；“照这样”在现代汉语中自然，也不把它弱化为单纯的结果连接词。
- source_word: תַּעֲשׂוּ
  choice: 你们……献上
  rationale: עשה本义宽泛，可指“做、制作”；在献祭语境中译作“献上”能准确表达礼仪行动。
- source_word: לַיּוֹם שִׁבְעַת יָמִים
  choice: 七天之中，你们每天都要
  rationale: 明确表达连续七天、逐日重复的分配意义。
- source_word: לֶחֶם אִשֵּׁה
  choice: 作为食物，是……火祭
  rationale: לֶחֶם在这里指祭物作为献给神的食物，并非仅指字面的饼；אִשֵּׁה保留为“火祭”，呈现经火献上的祭物这一礼仪用语。
- source_word: רֵיחַ נִיחֹחַ
  choice: 馨香
  rationale: 采用庄重而通行的献祭用语，保留香气蒙悦纳的意象，但不把隐喻直接解释为抽象的“悦纳”。
- source_word: לַיהוָה
  choice: 献给雅威
  rationale: 直接音译四字神名יהוה，以区别于称号“主”。
- source_word: עַל עוֹלַת הַתָּמִיד
  choice: 在常献的燔祭……之外
  rationale: 此处עַל表达附加关系；הַתָּמִיד指按例持续献上的祭，译为“常献的燔祭”简洁且符合上下文。
- source_word: יֵעָשֶׂה
  choice: 这要……献上
  rationale: 被动式在献祭语境中自然译为“献上”；“这”承接本节所规定的祭物。
- source_word: וְנִסְכּוֹ
  choice: 及其奠祭
  rationale: נֶסֶךְ指浇奠的祭物；阳性单数后缀指向常献的燔祭，故译“其奠祭”。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；“雅威”较直接反映其可能的希伯来语读音，并保留专名性质。
- issue: רֵיחַ נִיחֹחַ是否解释为神的悦纳
  choice: 保留“馨香”的祭祀意象
  alternative: 蒙悦纳的香气
  rationale: 原文以气味意象表达祭物的可悦性；直保意象可避免把其中神学含义完全解释化。
translation_notes:
  register: 采用现代、庄重而易懂的礼仪语言。“照这样”承接前文祭物的规格；分号保留本节前后两项命令的结构。脚注标记[a]已置于正文相应词语之后。
