  text: וּ/בְ/רָאשֵׁי֙ חָדְשֵׁי/כֶ֔ם תַּקְרִ֥יבוּ עֹלָ֖ה לַ/יהוָ֑ה פָּרִ֨ים בְּנֵֽי בָקָ֤ר שְׁנַ֨יִם֙ וְ/אַ֣יִל אֶחָ֔ד כְּבָשִׂ֧ים בְּנֵי שָׁנָ֛ה שִׁבְעָ֖ה תְּמִימִֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/011.yaml
  text: 'At the beginnings of your months[a], you shall present a burnt offering to Yahweh: two bulls from the herd, one ram, and seven male lambs a year old, without blemish.'
translation:
  language: zh_hans
  text: 每逢月初[a]，你们要献燔祭给雅威：两头公牛、一只公绵羊和七只一岁的公羊羔，都要没有残疾。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“在你们各月的开头”，指新月的礼仪时日。
    reason: 说明原文习语及其礼仪含义。
lexical_decisions:
- source_word: וּבְרָאשֵׁי חָדְשֵׁיכֶם
  choice: 每逢月初
  rationale: 字面为“在你们各月的开头”。这是指每月开始、即新月的固定礼仪时日；“每逢月初”在现代汉语中自然清楚，并以脚注保留“新月”的礼仪背景。
- source_word: תַּקְרִיבוּ
  choice: 你们要献
  rationale: קרב的使役式在献祭语境中指把祭物呈献给上帝。“献”简洁自然，也准确表达祭祀行为。
- source_word: עֹלָה
  choice: 燔祭
  rationale: 这是整只焚烧献上的祭物。“燔祭”是中文圣经传统中明确且通行的礼仪术语。
- source_word: לַיהוָה
  choice: 给雅威
  rationale: 介词ל表示祭物献给谁；יהוה是上帝的专名，音译为“雅威”，不以称号替代。
- source_word: פָּרִים בְּנֵי בָקָר שְׁנַיִם
  choice: 两头公牛
  rationale: פָּרִים指公牛，בְּנֵי בָקָר说明属于牛群这一牲畜类别。汉语“公牛”已足以自然表达，避免生硬直译“牛群之子”。
- source_word: וְאַיִל אֶחָד
  choice: 一只公绵羊
  rationale: אַיִל在此指成年的公绵羊。译作“公绵羊”可与后面的公羊羔清楚区分。
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה שִׁבְעָה
  choice: 七只一岁的公羊羔
  rationale: כְּבָשִׂים为公羊羔；בְּנֵי שָׁנָה指一岁或尚在第一年内。正文采用简明的“一岁的”，不额外限定超过原文的信息。
- source_word: תְּמִימִם
  choice: 都要没有残疾
  rationale: 在祭牲语境中表示身体完整、没有可使其不合献祭资格的缺陷。“没有残疾”清楚表达礼仪要求。
theological_decisions:
- issue: 月初时日的表达
  choice: 每逢月初
  alternative: 在你们的新月之日／在你们各月的开头
  rationale: 原文使用“各月的开头”这一表达，所指是新月礼仪。正文采用自然的时间表达，脚注说明其希伯来语形式和礼仪含义，避免把两者误当作不同日期。
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华／主
  rationale: 原文直接使用四字神名。正文以“雅威”保留其专名性质，而不以称号“主”替代。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。量词按现代汉语分别使用“头”和“只”；牲畜清单保持简洁并列。脚注标记已在“月初”后列出。
