base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/020.yaml
  text: 'And their grain offering shall be fine flour mixed with oil: three-tenths for the bull[a], and two-tenths for the ram you shall prepare.'
translation:
  language: zh_hans
  text: 这些祭牲所配的素祭，要用调油的细面：为公牛预备十分之三伊法[a]，为公绵羊预备十分之二伊法；你们要预备。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文作“十分之三”和“十分之二”，即“伊法的十分之三”和“伊法的十分之二”的简略说法；伊法是献祭条例中使用的干量单位。
    reason: cultural_note
lexical_decisions:
- source_word: וּמִנְחָתָם
  choice: 同献的素祭
  rationale: מִנְחָה在献祭条例中专指以谷物为主的祭物，译作“素祭”；三复数后缀承接前文所列祭牲，汉语用“同献的”自然表达附属于这些祭牲的祭物。
- source_word: סֹלֶת
  choice: 细面
  rationale: 指献祭所用精细研磨的面粉；“细面”是现代中文圣经语境中准确而简洁的表达。
- source_word: בְּלוּלָה בַשָּׁמֶן
  choice: 调油的
  rationale: 被动分词表示面粉经过与油混合的处理；“调油的”简洁自然，并保留制作方式。
- source_word: שְׁלֹשָׁה עֶשְׂרֹנִים
  choice: 十分之三伊法
  rationale: עִשָּׂרוֹן指一伊法的十分之一。正文补明“伊法”，让现代读者无需依赖省略即可明白计量单位。
- source_word: לַפָּר
  choice: 为那头公牛
  rationale: 带定冠词的单数名词指前文规定的那头公牛；用“那头”保留其特指性。
- source_word: וּשְׁנֵי עֶשְׂרֹנִים
  choice: 十分之二伊法
  rationale: 与前项平行，并明确原文所省略但礼仪法规中确定的计量单位。
- source_word: לָאַיִל
  choice: 为那只公绵羊
  rationale: 带定冠词的单数名词指前文规定的公绵羊；“公绵羊”比单用“公羊”更明确。
- source_word: תַּעֲשׂוּ
  choice: 你们要这样预备
  rationale: עשה本义宽泛，为“做、制作”；在献祭指令中译为“预备”能自然表达按规定制作素祭，又不额外断定具体献上的动作。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的礼仪法规语体。保留第二人称复数“你们”，并以分号呈现两项平行的配额。正文明确补出“伊法”，脚注同时说明希伯来原文的省略表达。
