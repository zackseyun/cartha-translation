base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/014.yaml
  text: 'And their drink offerings shall be: half a hin for the bull[a], a third of a hin for the ram, and a fourth of a hin for the lamb, of wine. This is the monthly burnt offering for each month throughout the months of the year.'
translation:
  language: zh_hans
  text: 所献的奠酒如下：每头公牛半欣，每只公绵羊三分之一欣，每只羊羔四分之一欣，都是酒。这是每月所献的燔祭[a]，要在一年中的每个月献上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“这是月朔的燔祭，要在一年中的每个月献上。”希伯来语 חֹדֶשׁ 既可指“月”，也可指“月朔（新月）”；正文按每月重复献祭的意思翻译。
    reason: 保留 חֹדֶשׁ 在此处“月份”与“月朔”之间的词义歧义。
lexical_decisions:
- source_word: נִסְכֵּיהֶם
  choice: 同献的奠酒
  rationale: נֶסֶךְ指浇奠的酒祭；“奠酒”是现代中文圣经祭祀语境中清楚而庄重的表达。“同献的”体现其与前述牲祭的对应关系。
- source_word: חֲצִי הַהִין / שְׁלִישִׁת הַהִין / רְבִיעִת הַהִין
  choice: 半欣／三分之一欣／四分之一欣
  rationale: 保留古代容量单位“欣”，不作推测性换算，并准确呈现三个分数。
- source_word: לַפָּר / לָאַיִל / לַכֶּבֶשׂ
  choice: 每头公牛／每只公绵羊／每只羊羔
  rationale: 希伯来文以带冠词的单数指各类指定祭牲；中文加“每”可自然表达每一只祭牲所配奠酒的数量，尤其与上文不止一头公牛的语境相合。
- source_word: יָיִן
  choice: 要用酒
  rationale: 置于希伯来文数量清单之后的 יָיִן 说明奠祭所用的液体。中文提前为“奠酒要用酒”，既保留信息，也避免句末“是酒”的生硬结构。
- source_word: זֹאת עֹלַת חֹדֶשׁ
  choice: 这是每月的燔祭[a]
  rationale: חֹדֶשׁ既可指“月”，也可指“月朔／新月”。正文采用上下文中的周期性含义“每月”，并以脚注保留“月朔”的真实词义可能。
- source_word: בְּחָדְשׁוֹ לְחָדְשֵׁי הַשָּׁנָה
  choice: 一年之中，月月都要献
  rationale: 该表达传达每个月按期重复、贯穿全年之意，比逐词直译“在它的月里，为一年的各月”更符合现代汉语，同时不减少时间范围。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的祭祀用语。“欣”保留古代度量单位；“公绵羊”用来区别 אַיִל 与一般的羊或羊羔。分号划分奠酒数量与全年按月献祭的总结句。
