  yaml_path: translation/ot/numbers/028/010.yaml
  text: The burnt offering of each Sabbath is on its Sabbath[a], in addition to the regular burnt offering and its drink offering.
translation:
  language: zh_hans
  text: 每逢安息日所献的燔祭，是在常献的燔祭及其奠祭以外加献的。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֹלַת
  choice: 燔祭
  rationale: עֹלָה指祭物全部焚烧献上的祭；“燔祭”是现代中文圣经语境中明确且通行的对应词。
- source_word: שַׁבַּת
  choice: 安息日
  rationale: 在祭祀历法的语境中，该词明确指每周的安息日，而不是泛指一周或休息日。
- source_word: בְּשַׁבַּתּוֹ
  choice: 在各安息日献上
  rationale: 该短语字面为“在它的安息日”，此处具有按每次安息日循环分配的含义；译作“在各安息日”自然传达反复遵行的规定，同时以脚注保留字面形式。
- source_word: עַל
  choice: 在……以外加献
  rationale: 在献祭条例中，עַל表示在既定祭物之外另加或连同献上；此译法清楚表达安息日祭不是取代常献的燔祭。
- source_word: הַתָּמִיד
  choice: 常献的
  rationale: תָּמִיד表示持续、经常或按例不断；与前面的עֹלַת连用，构成“常献的燔祭”。
- source_word: וְנִסְכָּהּ
  choice: 和同献的奠祭
  rationale: נֶסֶךְ指浇献的酒祭，传统且清楚的中文术语为“奠祭”；阴性单数后缀回指“燔祭”，加“同献的”自然说明其附属于常献的燔祭。
