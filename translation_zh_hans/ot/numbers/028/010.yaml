  terminology: “安息日”“燔祭”“奠祭”均为恰当、通行且符合庄重祭祀条例语域的术语。“常献的燔祭”可保留；“及其奠祭”比“和同献的奠祭”更准确地表达וְנִסְכָּהּ的回指关系。
