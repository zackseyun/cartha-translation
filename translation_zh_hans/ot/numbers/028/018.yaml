  text: On the first day there shall be a holy convocation; you shall do no laborious work.
translation:
  language: zh_hans
  text: 第一天应当有圣会[a]；不可做任何日常劳作[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“神圣的集会”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译“服役性质的工作”，指日常的生产或职业性劳作。
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הָרִאשׁוֹן
  choice: 第一天
  rationale: 按带定冠词的序数词时间短语直译；上下文虽表明是节期第一天，本节却没有明说“节期”，因此不补入。
- source_word: מִקְרָא קֹדֶשׁ
  choice: 圣会
  rationale: 这是礼仪用语，指为神圣目的正式召集的聚会。“圣会”简洁庄重，并保留“召集聚会”的含义；用“举行”使无动词句在现代汉语中自然通顺。
- source_word: כָּל ... לֹא
  choice: 任何……都不可
  rationale: 该结构表达全面禁止；如此译法既保留 כָּל 的总括语气，也符合现代汉语习惯。
- source_word: מְלֶאכֶת עֲבֹדָה
  choice: 日常劳作
  rationale: 该组合指节期所禁止的惯常生产或职业性劳作，并非泛指一切动作。“日常劳作”比“劳碌的工”自然，也避免把重点误解为只禁止特别繁重的工作。
- source_word: לֹא תַעֲשׂוּ
  choice: 都不可做
  rationale: 复数第二人称未完成式在律法语境中表达对全体会众的禁令；“不可”保持庄重而明确的规范语气。
