id: NUM.28.2
reference: Numbers 28:2
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: צַ֚ו אֶת בְּנֵ֣י יִשְׂרָאֵ֔ל וְ/אָמַרְתָּ֖ אֲלֵ/הֶ֑ם אֶת קָרְבָּנִ֨/י לַחְמִ֜/י לְ/אִשַּׁ֗/י רֵ֚יחַ נִֽיחֹחִ֔/י תִּשְׁמְר֕וּ לְ/הַקְרִ֥יב לִ֖/י בְּ/מוֹעֲדֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/002.yaml
  text: Command the sons of Israel[a], and say to them, ‘My offering, my food for my food offerings, my pleasing aroma[c][b], you shall be careful to present to me at its appointed time.’
translation:
  language: zh_hans
  text: 你要吩咐以色列人[a]，对他们说：‘我的供物，就是作为献给我的火祭[b]、令我喜悦的馨香[c]的食物；你们要谨慎地按指定的时间献给我。’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“以色列的众子”，这里指以色列全体民众。
    reason: lexical_alternative
  - marker: b
    text: “火祭”是祭祀用语，指在祭坛上焚烧献上的祭物。
    reason: cultural_note
  - marker: c
    text: “令我喜悦的馨香”是固定的祭祀表达，表示祭物蒙上帝悦纳。
    reason: cultural_note
lexical_decisions:
- source_word: צַו
  choice: 吩咐
  rationale: 该命令式带有明确而有权威的指令语气；“吩咐”在现代汉语中庄重自然，也比“嘱咐”更有力度。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 原文直译为“以色列的众子”，在这里是对整个以色列群体的固定称呼；“以色列人”准确、自然，并避免现代汉语读者误以为只指男性。
- source_word: קָרְבָּנִי
  choice: 我的供物
  rationale: קָרְבָּן指带到上帝面前的祭祀供物；“供物”保留祭祀语境，又不把范围缩窄为某一种祭。
- source_word: לַחְמִי
  choice: 我的食物
  rationale: לֶחֶם字面可指“饼”，也可泛指食物；此处为祭祀用语，“食物”比“饼”更符合上下文，同时保留原文具体的拟人化表达。
- source_word: לְאִשַּׁי
  choice: 献给我的火祭
  rationale: אִשֶּׁה是祭祀术语，通常指在坛上焚烧献上的祭物；“火祭”简洁地保留其礼仪性质，脚注说明其含义。
- source_word: רֵיחַ נִיחֹחִי
  choice: 作我所喜悦的馨香
  rationale: 这是固定的祭祀表达，表示祭物蒙上帝悦纳。“馨香”保留香气意象，“我所喜悦”表达 נִיחֹחַ 的悦纳意味。
- source_word: תִּשְׁמְרוּ לְהַקְרִיב
  choice: 你们务要……献
  rationale: שמר与不定式连用，表示谨慎遵守献祭要求；“务要”兼具命令力度和谨慎遵行之意。
- source_word: בְּמוֹעֲדוֹ
  choice: 按指定的时间
  rationale: מוֹעֵד在此指为各项祭礼规定的时刻；单数后缀与前述供物相呼应。“按指定的时间”自然表达依照规定时刻献祭。
theological_decisions:
- issue: “我的食物”和“馨香”的拟人化祭祀语言
  choice: 保留原文具体的祭祀意象
  alternative: 意译为“蒙我悦纳的祭物”
  rationale: 希伯来文有意使用“食物”和“香气”等具体语言。译文不把它抽象化，以保存经文的礼仪表达及其张力；“我所喜悦”同时提示这里涉及上帝对祭物的悦纳。
- issue: בְּנֵי יִשְׂרָאֵל所指群体的性别范围
  choice: 以色列人
  alternative: 以色列的众子／以色列子民
  rationale: 该短语形式上为阳性，但在此指整个立约群体。现代汉语“以色列人”准确表达实际指称，也最自然；脚注保留其字面形式。
- issue: אִשֶּׁה的祭祀含义
  choice: 火祭
  alternative: 焚烧的祭物／献给我的祭物
  rationale: “火祭”保留传统且源语透明的祭祀称谓，但不进一步断定该词的词源；脚注说明它指在祭坛上焚烧献上的祭物。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留“供物、火祭、馨香”等必要的祭祀词汇，并用脚注帮助普通读者理解；句法以汉语自然表达为主，同时保留原文各祭祀名词并列、互相说明的结构。
