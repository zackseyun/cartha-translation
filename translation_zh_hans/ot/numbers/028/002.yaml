revisions:
- from: 你要吩咐以色列人[a]，对他们说：‘我的供物，我的食物，就是献给我的火祭[b]，作我所喜悦的馨香[c]，你们务要按指定的时间献给我。’
  to: 你要吩咐以色列人[a]，对他们说：‘我的供物，就是作为献给我的火祭[b]、令我喜悦的馨香[c]的食物；你们要谨慎地按指定的时间献给我。’
  rationale: 修订只调整祭祀名词之间的句法关系，使“食物”为“火祭”和“令我喜悦的馨香”而献的意思在汉语中更明确。保留“以色列人”的群体称呼、具体的“我的食物”拟人化语言、火祭术语、命令力度和指定时间，不将祭祀语言抽象化或加入教派性解释。
