  text: וַ/יְדַבֵּ֤ר יְהוָה֙ אֶל מֹשֶׁ֔ה בְּ/מִדְבַּ֥ר סִינַ֖י לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/014.yaml
  text: And Yahweh spoke to Moses in the wilderness of Sinai[a], saying,
translation:
  language: zh_hans
  text: 雅威[a]在西奈旷野对摩西说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文：YHWH（四字母神名）；传统中文译作“耶和华”。
    reason: 说明神名的原文形式及传统中文译法。
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: 说
  rationale: 该词在叙事中引出神谕。现代汉语用“对摩西说”自然、准确，也避免与句末 לֵאמֹר 机械重复。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 这是神名四字母 YHWH 在现代中文圣经传统中通行的音译，保留其专名性质；脚注说明原文形式。
- source_word: אֶל מֹשֶׁה
  choice: 对摩西
  rationale: 介词 אֶל 标明说话的对象，译作“对摩西”符合现代汉语表达。
- source_word: בְּמִדְבַּר סִינַי
  choice: 在西奈旷野
  rationale: מִדְבָּר 指荒野、旷野地带；其与 סִינַי 构成属格关系，译作“西奈旷野”简洁自然。
- source_word: לֵאמֹר
  choice: 说：
  rationale: 这是引出下文直接话语的固定公式。汉语以“说：”连同冒号表达其功能，无须重复译成“说……说”。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威；上主
  rationale: 原文使用神的专名 YHWH。正文采用中文读者最熟悉的专名形式“耶和华”，而不以称号“上主”取代；同时在脚注中交代希伯来文形式，以免把传统读音视为确定的古代发音。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。将希伯来语双重引语公式 וַיְדַבֵּר…לֵאמֹר 合并为汉语常用的“对……说：”，既保留其引出下一节话语的功能，也避免生硬重复。
