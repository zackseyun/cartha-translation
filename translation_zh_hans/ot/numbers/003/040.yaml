base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/040.yaml
  text: Then Yahweh said to Moses[a], “Count every firstborn male among the sons of Israel from a month old and upward, and take the number of their names.”
translation:
  language: zh_hans
  text: 耶和华对摩西说：“你要数点以色列人中所有头生的男子，就是满一个月及以上的，并按名统计他们[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“取他们名字的数目。”
    reason: 保留希伯来语惯用语的较字面表达；正文按人口统计语境译为自然中文。
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经传统中最通行的神名译法，明确对应四字神名YHWH。
- source_word: וַיֹּאמֶר
  choice: 对……说
  rationale: 希伯来语叙事连续式推进叙事；中文无需机械译出连接词，直接用“对……说”更自然。
- source_word: פְּקֹד
  choice: 数点
  rationale: 此命令处于人口统计语境；“数点”既表达清点、计数，也保留庄重的经文语体。
- source_word: כָּל בְּכֹר זָכָר
  choice: 所有头生的男子
  rationale: “头生的”对应בכור，“男子”明确保留זכר所限定的男性含义。
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: 以色列人中
  rationale: 在中文中，“以色列人中”自然表达该次统计的所属范围；男性限定已由后面的“男子”清楚呈现。
- source_word: מִבֶּן חֹדֶשׁ וָמָעְלָה
  choice: 满一个月及以上的
  rationale: 准确表达统计年龄的下限，并明确包括刚满一个月者。
- source_word: וְשָׂא אֵת מִסְפַּר שְׁמֹתָם
  choice: 并按姓名统计他们
  rationale: 该短语字面涉及“他们名字的数目”，在 census 语境中是逐名登记、计数的惯用说法；译文采用自然中文，并以脚注保留较直译的表达。
