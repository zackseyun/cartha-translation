  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/אֶת אַהֲרֹ֤ן וְ/אֶת בָּנָי/ו֙ תִּפְקֹ֔ד וְ/שָׁמְר֖וּ אֶת כְּהֻנָּתָ֑/ם וְ/הַ/זָּ֥ר הַ/קָּרֵ֖ב יוּמָֽת־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/010.yaml
  text: And you shall appoint Aaron and his sons[a], and they shall keep their priesthood; but the outsider who comes near shall be put to death.
translation:
  language: zh_hans
  text: 你要委任亚伦和他的儿子们；他们要守护自己的祭司职分。外人[a]若近前，必被处死。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “外人”在这里指没有获准进入祭司职分范围的人，并非特指外族人；也可译作“未经授权的人”。
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּפְקֹד
  choice: 委任
  rationale: פקד 在本句不是数点人数，而是把亚伦和他的儿子们安置在祭司职分上；“委任”既体现正式授权，也符合现代汉语表达。
- source_word: וְשָׁמְרוּ
  choice: 守护
  rationale: שׁמר 兼有持守、看守和防护之意；“守护”在此既指履行祭司职责，也保留维护其职分界限的含义。
- source_word: כְּהֻנָּתָם
  choice: 自己的祭司职分
  rationale: 该词指他们所承担的祭司身份、职务与功能；“祭司职分”比抽象的“祭司身份”更能体现实际职责。反身领属词“自己的”自然表达希伯来语后缀“他们的”。
- source_word: הַזָּר
  choice: 外人
  rationale: זָר 在此指不属于获授权祭司范围的人，并非专指外族人。“外人”简洁地保留相对于祭司职分而言的界外身份，脚注进一步排除族裔误解。
- source_word: הַקָּרֵב
  choice: 若近前
  rationale: קרב 表示靠近或上前；“近前”保留对受限神圣范围或职事的接近，而不把本节未说明的具体边界加入正文。
- source_word: יוּמָת
  choice: 必被处死
  rationale: מות 的使役被动式表达法律性的被处死，而非仅仅“必死”；“必被处死”准确保留被动和刑罚语气。
theological_decisions:
- issue: 祭司职分的限定与接近禁令
  choice: 本节表明亚伦和他的儿子们受委任守护祭司职分，职分范围之外的人若近前便招致死刑。
  alternative: 也可较宽泛地理解为禁止任何非祭司者接近神圣领域，但本句本身没有界定所有具体礼仪边界。
  rationale: 译文保留祭司职分受到授权和保护的重点，也保留“近前”所指范围在本节中的概括性，不加入后来的宗派制度或更细的礼仪规定。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“委任”“祭司职分”“必被处死”保留律法语境的正式感；句式简洁，适合普通读者朗读和理解。
