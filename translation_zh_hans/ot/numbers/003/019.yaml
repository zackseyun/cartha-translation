  text: 'And the sons of Kohath, by their clans: Amram, Izhar, Hebron, and Uzziel.'
translation:
  language: zh_hans
  text: 哥辖的儿子，按他们的宗族，是暗兰、以斯哈、希伯仑和乌薛。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי קְהָת
  choice: 哥辖的儿子
  rationale: בְנֵי 是“儿子”的复数附属形式；本节列出哥辖支系的宗族始祖，直译为“儿子”既保留希伯来文形式，也符合中文家谱语境。句首 וּ 承接上文的名单，中文不必机械译出“和”。专名 קְהָת 采用中文圣经通行译名“哥辖”。
- source_word: לְמִשְׁפְּחֹתָם
  choice: 按他们的宗族
  rationale: מִשְׁפָּחָה 在以色列社会结构中指家族或宗族单位；“宗族”比现代日常意义的“家庭”更准确，“按”自然表达 לְ 的分类关系。
- source_word: עַמְרָם
  choice: 暗兰
  rationale: 人名采用中文圣经通行译名。
- source_word: יִצְהָר
  choice: 以斯哈
  rationale: 人名采用中文圣经通行译名；其前连接词在中文列举结构中由标点体现。
- source_word: חֶבְרוֹן
  choice: 希伯仑
  rationale: 这里是人名而非地名，采用中文圣经通行音译“希伯仑”。
- source_word: עֻזִּיאֵל
  choice: 乌薛
  rationale: 人名采用中文圣经通行译名；其前连接词 וְ 译为列举末项前的“和”。
theological_decisions: []
