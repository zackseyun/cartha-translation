base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/035.yaml
  text: And the chief of the ancestral house of the clans of Merari was Zuriel son of Abihail[b][a]. They were to camp on the north side of the tabernacle.
translation:
  language: zh_hans
  text: 米拉利各宗族的父家首领[a]是亚比亥的儿子苏列。他们要在帐幕北边安营。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “父家”直译为“父亲的家”，指按父系血缘组织的家族单位。“首领”也可译作“领袖”；希伯来语此词可指受认可的领袖、族长或首长。
    reason: cultural_note; lexical_alternative
lexical_decisions:
- source_word: וּנְשִׂיא
  choice: 首领
  rationale: נָשִׂיא指受认可的领袖或族长；本节是利未人营地编制的语境，“首领”自然且不带君王意味。连接词וּ承接前文，中文无需硬译“和”。
- source_word: בֵית אָב
  choice: 父系家族
  rationale: 字面为“父亲之家”，实际指按父系血缘组织的家族单位；“父系家族”既说明其亲族结构，也避免被误解为某位父亲的住家。
- source_word: לְמִשְׁפְּחֹת מְרָרִי
  choice: 米拉利各宗族的
  rationale: מִשְׁפָּחוֹת在民数记的编制语境中指支派内部的宗族；介词לְ在此表达其所属或代表关系，以中文属格结构自然呈现。
- source_word: צוּרִיאֵל בֶּן אֲבִיחָיִל
  choice: 亚比亥的儿子苏列
  rationale: 按现代汉语家谱表达调整语序；专名采用常见中文圣经音译。
- source_word: עַל יֶרֶךְ הַמִּשְׁכָּן
  choice: 在帐幕……边
  rationale: יֶרֶךְ本义为“侧面、边”，营地位置语境中译作“边”简洁自然；עַל在此表示地点。
- source_word: יַחֲנוּ
  choice: 他们要……安营
  rationale: 未完成式在此说明规定的营地安排；“要安营”保留指派或规定的语气，而不误作已经发生的叙事。
- source_word: צָפֹנָה
  choice: 北边
  rationale: 方向词表示帐幕北侧的位置，与前面的“边”合译为“北边”。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“宗族”与“父系家族”分别对应两个层级不同的亲族单位，避免都译为“家族”而模糊组织结构。正文中的脚注标记紧随“首领”。
