  yaml_path: translation/ot/numbers/003/033.yaml
  text: 'For Merari: the clan of the Mahlites and the clan of the Mushites; these are the clans of Merari.'
translation:
  language: zh_hans
  text: 属米拉利的，有玛利族和母示族；这些就是米拉利的各族。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִמְרָרִי
  choice: 属米拉利的
  rationale: 介词 ל 在本人口统计名单中引出归属于米拉利的支系；译为“属米拉利的”既体现分类关系，也符合现代汉语名单体表达。
- source_word: מִשְׁפַּחַת
  choice: 族
  rationale: מִשְׁפָּחָה 在宗族谱系和人口统计语境中指家族之上的宗族单位；“族”简洁自然，也避免“家庭”范围过窄或“支派”范围过广。
- source_word: הַמַּחְלִי
  choice: 玛利族
  rationale: 这是由玛利之名形成的宗族称谓，指其后裔群体；汉语以人名加“族”准确而自然。
- source_word: וּמִשְׁפַּחַת
  choice: 和……族
  rationale: 连词协调第二个宗族名称；汉语无需机械重复量词结构，仍清楚保留两族并列关系。
- source_word: הַמּוּשִׁי
  choice: 母示族
  rationale: 这是由母示之名形成的宗族称谓，指其后裔群体；译作“母示族”与“玛利族”保持一致。
- source_word: אֵלֶּה הֵם
  choice: 这些就是
  rationale: 原文指示词与代词连用，带有明确辨认和总结作用；“这些就是”比单纯“这些是”更能体现该强调。
- source_word: מִשְׁפְּחֹת מְרָרִי
  choice: 米拉利的各族
  rationale: 复数形式总结前述两个宗族；“各族”清楚表达复数，并保持其从属于米拉利的谱系关系。
