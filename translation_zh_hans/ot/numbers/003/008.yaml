  text: וְ/שָׁמְר֗וּ אֶֽת כָּל כְּלֵי֙ אֹ֣הֶל מוֹעֵ֔ד וְ/אֶת מִשְׁמֶ֖רֶת בְּנֵ֣י יִשְׂרָאֵ֑ל לַ/עֲבֹ֖ד אֶת עֲבֹדַ֥ת הַ/מִּשְׁכָּֽן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/008.yaml
  text: They shall keep charge of all the furnishings of the tent of meeting[a], and the duty of the sons of Israel, to perform the service of the tabernacle.
translation:
  language: zh_hans
  text: 他们要看守会幕的一切器具，并承担以色列人的职责[a]，从事帐幕的服事。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“承担为以色列人所负的职责。”
    reason: 原文“以色列人的职责”为连属结构；其关系可理解为属于以色列人的职责，也可依上下文理解为为以色列人承担的职责。
lexical_decisions:
- source_word: וְשָׁמְרוּ
  choice: 要看守
  rationale: שׁמר在会幕职责的语境中兼有守护和受托照管之意；“看守”简洁自然，并保留实际守卫的意味。
- source_word: כָּל כְּלֵי אֹהֶל מוֹעֵד
  choice: 会幕的一切器具
  rationale: כְּלִים泛指会幕中的器物、用具和装备；“器具”不会将含义限于容器，也符合现代中文宗教语境。
- source_word: אֹהֶל מוֹעֵד
  choice: 会幕
  rationale: 该词组直指以色列人与上帝相会的圣所帐篷；“会幕”是准确、简洁且广为理解的固定译法。
- source_word: מִשְׁמֶרֶת בְּנֵי יִשְׂרָאֵל
  choice: 替以色列人尽守护之责
  rationale: מִשְׁמֶרֶת表示受托看守的职责；介词未明说，因此译文采用自然中文表达利未人代表以色列人承担此责，同时以脚注保留另一种归属理解。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 此处是惯用的民族整体称谓，并非特指以色列的男性后裔；现代汉语“以色列人”准确传达其集合意义。
- source_word: לַעֲבֹד אֶת עֲבֹדַת הַמִּשְׁכָּן
  choice: 办理帐幕的事务
  rationale: עבד与עֲבֹדָה构成同根词组，意为从事指定的圣所服役；“办理……事务”在中文中自然地表达执行会幕职务，避免生硬重复“服事……服事”。
- source_word: הַמִּשְׁכָּן
  choice: 帐幕
  rationale: מִשְׁכָּן意为居所，在旷野圣所语境中指帐幕；与前面的“会幕”相区别，也保留原文两个不同称谓。
theological_decisions:
- issue: מִשְׁמֶרֶת בְּנֵי יִשְׂרָאֵל所表达的职责关系
  choice: 利未人替以色列人承担守护职责
  alternative: 利未人履行属于以色列人的职责
  rationale: 原文名词连属结构可表达以色列人的职责，也可结合上下文理解为利未人代表以色列全体承担的守护责任。正文采用较符合上下文且自然的表达，脚注保留另一理解，不将其神学关系绝对化。
- issue: בְּנֵי יִשְׂרָאֵל的性别与群体范围
  choice: 以色列人
  alternative: 以色列的众子
  rationale: 该短语在此作为民族整体的常规称谓；中文若直译“众子”容易被误解为只包括男性。译作“以色列人”保持所指范围，同时不引入额外教义判断。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“会幕”与“帐幕”分别对应原文אֹהֶל מוֹעֵד和מִשְׁכָּן；句式保留命令性职责陈述，同时避免机械复制希伯来语同根词造成的中文生硬感。
