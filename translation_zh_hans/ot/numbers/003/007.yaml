  text: וְ/שָׁמְר֣וּ אֶת מִשְׁמַרְתּ֗/וֹ וְ/אֶת מִשְׁמֶ֨רֶת֙ כָּל הָ֣/עֵדָ֔ה לִ/פְנֵ֖י אֹ֣הֶל מוֹעֵ֑ד לַ/עֲבֹ֖ד אֶת עֲבֹדַ֥ת הַ/מִּשְׁכָּֽן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/007.yaml
  text: They shall keep his charge and the charge of the whole congregation before the tent of meeting, to perform the service of the tabernacle.
translation:
  language: zh_hans
  text: 他们要在会幕前，谨守亚伦的职责[a]和全会众的职责，从事帐幕的服事。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“谨守他的职责”；“他的”最自然是指亚伦。这里“谨守”既可指看守，也可指忠实履行受托的职责。
    reason: lexical_alternative
  - marker: b
    text: 也就是说，利未人在圣所方面承担与亚伦以及全会众有关的职责。
    reason: cultural_note
lexical_decisions:
- source_word: וְשָׁמְרוּ אֶת־מִשְׁמַרְתּוֹ
  choice: 他们要谨守亚伦所交付的职责
  rationale: 动词 שׁמר 与名词 מִשְׁמֶרֶת 同用，兼有看守、遵守和忠实履行受托职责之意。“谨守……所交付的职责”在现代汉语中较自然，也保留受托看守的色彩。代词后缀按紧邻上下文明确为亚伦，以免中文“他的”指代不清。
- source_word: וְאֶת־מִשְׁמֶרֶת כָּל־הָעֵדָה
  choice: 也要谨守全会众所交付的职责
  rationale: 与前一分句采用平行措辞，保留原文重复的 מִשְׁמֶרֶת；“全会众”准确表达以色列整体共同体，而“所交付的职责”可表示利未人代表会众承担相关责任。
- source_word: לִפְנֵי אֹהֶל מוֹעֵד
  choice: 在会幕前
  rationale: לִפְנֵי 表示“在……面前／前方”。אֹהֶל מוֹעֵד 在中文圣经语境中以“会幕”简洁表达“相会之帐幕”，并与本节后面的 מִשְׁכָּן 区分。
- source_word: לַעֲבֹד אֶת־עֲבֹדַת הַמִּשְׁכָּן
  choice: 办理帐幕的事务
  rationale: עבד 与同根名词 עֲבֹדָה 构成同源表达，指执行帐幕相关的服事或工作。“办理……事务”避免中文生硬重复，同时保留实际履行受派工作的意义；מִשְׁכָּן 译作“帐幕”，与 אֹהֶל מוֹעֵד 的“会幕”保持词项区别。
theological_decisions:
- issue: מִשְׁמַרְתּוֹ 中第三人称阳性单数后缀的所指
  choice: 正文将其明确为亚伦
  alternative: 保留为“他的职责”，或理解为圣所／祭司职任整体的职责
  rationale: 民数记3:6紧接着说利未人被带到祭司亚伦面前并服事他，因此亚伦是最自然的先行词。中文若仅说“他的”容易指代含混；脚注仍说明原文形式，以保留原文层面的信息。
- issue: 全会众的职责与利未人的关系
  choice: 译为“全会众所交付的职责”，并以脚注说明利未人代表会众承担
  alternative: 译为“全会众的职责”，不说明是代表会众执行
  rationale: 上下文表明利未人承担原本与全体以色列共同体相关的圣所责任。“所交付的”传达受托性质，但不把这种代表关系扩展为超出上下文的教义陈述。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“谨守”保留祭司与利未人职分语境中的受托、看守和履责意味；“办理帐幕的事务”使同源词结构在中文中自然可读。正文中的脚注标记均与脚注对应。
