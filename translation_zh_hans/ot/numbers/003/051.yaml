base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/051.yaml
  text: And Moses gave the redemption money to Aaron and to his sons[a], at the command of Yahweh, just as Yahweh had commanded Moses.
translation:
  language: zh_hans
  text: 摩西照雅威的吩咐，把赎价银[a]交给亚伦和他的儿子们，正如雅威所吩咐摩西的那样。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译：“被赎者的银子”，即为赎回他们而收取的银子。
    reason: 说明希伯来语字面结构，并交代“赎价银”的上下文含义。
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: 交给
  rationale: נתן在此表示把所收取的银子交付给指定领受者；“交给”比单说“给”更清楚自然。
- source_word: כֶּסֶף הַפְּדֻיִם
  choice: 赎价银
  rationale: כֶּסֶף本义为“银”，הַפְּדֻיִם字面指“被赎者”。结合前文，这是为赎回多出的长子所收的银子；“赎价银”简洁保留银质款项及赎回的法律礼仪含义。
- source_word: לְאַהֲרֹן וּלְבָנָיו
  choice: 给亚伦和他的儿子们
  rationale: 重复的介词לְ标明交付对象；“他的儿子们”明确指亚伦的众子。
- source_word: עַל פִּי יְהוָה
  choice: 照雅威的吩咐
  rationale: 该习语字面为“按雅威的口”，在此表示依照神所下的命令；采用现代汉语惯用表达。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以音译呈现四字神名，保留其专名性质，不以称号替代。
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: 正如雅威所吩咐摩西的
  rationale: “正如”体现כַּאֲשֶׁר所表达的完全对应关系，并保留经文对摩西遵命而行的强调。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”是现代学界较常用的拟音，能清楚保留神的专名性质。
- issue: כֶּסֶף הַפְּדֻיִם所指为何
  choice: 赎价银
  alternative: 被赎者的银子
  rationale: 原文结构可直译为“被赎者的银子”，但上下文明确指为赎回多出的以色列长子而收取、转交祭司的款项；正文采用自然表达，脚注保留字面形式。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“赎价银”兼顾原文的“银”与赎回款项之义；两个“吩咐”均予保留，以呈现原文的重复和摩西完全遵命的重点。
