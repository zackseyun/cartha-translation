  text: וּ/פְקֻדֵי/הֶם֙ בְּ/מִסְפַּ֣ר כָּל זָכָ֔ר מִ/בֶּן חֹ֖דֶשׁ וָ/מָ֑עְלָ/ה שֵׁ֥שֶׁת אֲלָפִ֖ים וּ/מָאתָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/034.yaml
  text: And those counted among them[a], by the number of every male from a month old and upward, were six thousand two hundred.
translation:
  language: zh_hans
  text: 他们中被数的人，按所有满一个月及以上的男子计算，共有六千二百人。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּפְקֻדֵיהֶם
  choice: 他们中被数的人
  rationale: 该词源自פקד，是带第三人称阳性复数后缀的被动或结果性名词形式，在本段人口统计语境中指这个群体内被数的人，也可侧重其统计总数。译文保留“被数的人”这一具体含义，并以“他们中”自然表达所属范围。
- source_word: בְּמִסְפַּר כָּל זָכָר
  choice: 即所有……的男子
  rationale: 原文按字面涉及“所有男性的数目”。汉语用“即所有……的男子”承接前面的“被数的人”，清楚说明统计对象，同时保留כָּל זָכָר的全称和男性含义。
- source_word: מִבֶּן חֹדֶשׁ וָמָעְלָה
  choice: 满一个月及以上
  rationale: 这是民数记中常见的年龄下限表达，表示从一个月大开始，年龄更长者也包括在内。“满一个月及以上”在现代汉语中简洁明确。
- source_word: שֵׁשֶׁת אֲלָפִים וּמָאתָיִם
  choice: 六千二百人
  rationale: 准确表达统计总数；补出量词“人”，符合现代汉语习惯。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙述语体。“被数的人”略带人口统计公式的色彩，以贴近本章反复出现的点数用语；“即”使原文较紧凑的同位结构在汉语中更清楚。
