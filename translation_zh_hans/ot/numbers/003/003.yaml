    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה שְׁמוֹת
  choice: 以下是……的名字
  rationale: 这是自然、庄重的现代汉语引介格式，补出判断关系而不增添实质内容。
- source_word: בְּנֵי אַהֲרֹן
  choice: 亚伦儿子们
  rationale: 明确保留阳性复数所指的众子，并以现代汉语所有关系表达原文的组合结构。
- source_word: הַכֹּהֲנִים
  choice: 祭司
  rationale: 按其礼仪职分直译，并与“亚伦儿子们”构成同位说明。
- source_word: הַמְּשֻׁחִים
  choice: 受膏的
  rationale: 保留 משׁח 所指的实际膏抹礼仪，不泛化为仅表示分别为圣的词。
- source_word: מִלֵּא יָדָם
  choice: 承接圣职
  rationale: 这是祭司礼仪语境中的授职惯用语；中文圣经语体中“承接圣职”能自然传达其功能，同时脚注保留字面意象。
- source_word: לְכַהֵן
  choice: 作祭司
  rationale: 表达不定式所说明的授职目的或结果，简洁保留祭司职分。
theological_decisions:
- issue: 祭司授职惯用语 מִלֵּא יָדָם 的处理
  choice: 正文译为“承接圣职”，脚注说明字面为“使他们的手充满”
  alternative: 正文直译为“他们的手被充满，为要作祭司”
  rationale: 希伯来语没有明说施行授职者，中文正文不补出具体主语；功能性译法避免字面直译在现代汉语中令人费解，脚注则保存原文的重要礼仪意象与形式。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“受膏”保留具体礼仪动作；“承接圣职”沿用清楚的祭司授职用语。正文未擅自补出原文省略的施事者，并以脚注交代希伯来语惯用语。
