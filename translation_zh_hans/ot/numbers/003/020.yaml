base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/020.yaml
  text: 'The sons of Merari[a], by their clans: Mahli and Mushi. These are the clans of the Levites, by their fathers’ houses.'
translation:
  language: zh_hans
  text: 米拉利的儿子按宗族分为抹利和母示。这些是利未人[a]的宗族，按父家排列。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“利未的宗族。”希伯来文这里用了单数族称“利未人”，既可作集合称谓，也可能回指支派祖先利未。
    reason: alternative_reading
lexical_decisions:
- source_word: וּבְנֵי מְרָרִי
  choice: 米拉利的儿子
  rationale: 保留“儿子”这一谱系用语；句首连接词在连续名单中不另译，使现代汉语自然流畅。人名采用中文圣经中通行的译名。
- source_word: לְמִשְׁפְּחֹתָם
  choice: 按宗族
  rationale: 这里的介词表示分类方式；“宗族”能准确表达支派之下的亲属群体，比泛称“家庭”更符合人口登记语境。
- source_word: מַחְלִי וּמוּשִׁי
  choice: 抹利和母示
  rationale: 采用中文圣经中通行的人名译法，并保留并列结构。
- source_word: אֵלֶּה הֵם מִשְׁפְּחֹת
  choice: 这些是……的宗族
  rationale: 直接表达指示词加代词构成的确认句式，不加入原文没有的信息。
- source_word: הַלֵּוִי
  choice: 利未人
  rationale: 原文是带定冠词的单数族称，汉语用“利未人”可自然地作集合性称谓；其也可能回指祖先利未，因此以脚注保留歧义。
- source_word: לְבֵית אֲבֹתָם
  choice: 按父家排列
  rationale: “父家”保留以父系家族为单位的古代亲属与行政概念；补出“排列”使“按父家”在现代汉语中形成完整、自然的分类表达。
theological_decisions:
- issue: הַלֵּוִי 是集合性族称还是指祖先利未
  choice: 正文译作“利未人”，按集合性族称理解
  alternative: “利未”，指支派祖先利未
  rationale: 复数“宗族”在上下文中更自然地属于利未人群体，但希伯来文单数形式仍容许回指祖先利未，故不在正文中排除另一理解，并以脚注说明。
translation_notes:
  register: 采用现代、庄重且易懂的名单体表达；“宗族”“父家”保留民数记人口登记与亲属组织的术语特色，人名使用中文圣经传统通行译名。
