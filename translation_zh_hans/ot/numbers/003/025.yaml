base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/025.yaml
  text: And the duty of the sons of Gershon in the tent of meeting was the tabernacle[a], the tent, its covering, and the screen for the entrance of the tent of meeting[b],
translation:
  language: zh_hans
  text: 革顺子孙在会幕里的职责[a]，是看管帐幕、罩棚、罩棚的盖，以及会幕入口的门帘[b]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “职责”也可译作“职守”或“看管的责任”。
    reason: lexical_alternative
  - marker: b
    text: “门帘”也可译作“入口的帘子”。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁמֶרֶת
  choice: 职责
  rationale: 这里指革顺子孙受托照管的事物和责任范围；“职责”既自然，又能引出下列清单。为使汉语句意完整，译文用“是看管……”表达这种受托照管的关系。
- source_word: בְּנֵי גֵרְשׁוֹן
  choice: 革顺子孙
  rationale: 保留希伯来文的亲属群体表达，同时符合现代中文圣经语体。
- source_word: בְּאֹהֶל מוֹעֵד
  choice: 在会幕里
  rationale: בְּ在此表示履行职务的范围或场所；“会幕”是 אֹהֶל מוֹעֵד 清楚且通行的译法。
- source_word: הַמִּשְׁכָּן
  choice: 帐幕
  rationale: 这是 מִשְׁכָּן 在本语境中的专门称呼，并与随后表示罩棚结构的 הָאֹהֶל 加以区别。
- source_word: וְהָאֹהֶל
  choice: 罩棚
  rationale: 译作“罩棚”以保留它与前面的“帐幕”并列且有区别的结构组成关系。
- source_word: מִכְסֵהוּ
  choice: 罩棚的盖
  rationale: 代词后缀最自然地回指紧邻的“罩棚”；明确重复所指，比单说“它的盖”更适合现代中文清单。
- source_word: מָסַךְ
  choice: 门帘
  rationale: 该词指悬挂在入口处、起遮隔作用的织物；“门帘”比泛称“帘子”更贴合此处入口语境。
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: 会幕入口
  rationale: 以自然汉语表达门帘与入口之间的功能关系，不改变原文所指。
