  - severity: low
    issue: “他的儿子们”在中文里虽通常指亚伦，仍可明确所指。
    rationale: 希伯来文单数后缀最自然地指亚伦；写作“亚伦的儿子们”可避免中文读者误将其与摩西并列结构相连。
