  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/הַ/חֹנִ֣ים לִ/פְנֵ֣י הַ/מִּשְׁכָּ֡ן קֵ֣דְמָ/ה לִ/פְנֵי֩ אֹֽהֶל מוֹעֵ֨ד מִזְרָ֜חָ/ה מֹשֶׁ֣ה וְ/אַהֲרֹ֣ן וּ/בָנָ֗י/ו שֹֽׁמְרִים֙ מִשְׁמֶ֣רֶת הַ/מִּקְדָּ֔שׁ לְ/מִשְׁמֶ֖רֶת בְּנֵ֣י יִשְׂרָאֵ֑ל וְ/הַ/זָּ֥ר הַ/קָּרֵ֖ב יוּמָֽת־׀׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/038.yaml
  text: Those who camped in front of the tabernacle on the east[a], in front of the tent of meeting toward the sunrise, were Moses and Aaron and his sons, keeping charge of the sanctuary on behalf of the sons of Israel[b]. But the outsider who comes near shall be put to death.
translation:
  language: zh_hans
  text: 在帐幕前、在东边，即在会幕前、朝日出方向安营的，是摩西、亚伦和亚伦的儿子们。他们看守圣所，替以色列子孙尽守护之责。外人[b]若接近，必被处死。
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 这里的“外人”指未获准参与或接近圣所职事的人，并非特指外族人。
    reason: cultural_note
lexical_decisions:
- source_word: וְהַחֹנִים
  choice: 安营的
  rationale: 将实词化分词译为指称驻扎者的短语，符合本章营地布局的描述语境。
- source_word: לִפְנֵי הַמִּשְׁכָּן
  choice: 在帐幕前面
  rationale: 准确表达空间方位，并以“帐幕”区别随后出现的“会幕”。
- source_word: קֵדְמָה ... מִזְרָחָה
  choice: 东侧……朝日出方向
  rationale: 保留原文两个相关而不完全相同的东方表达，既体现强调，也避免机械重复。
- source_word: אֹהֶל מוֹעֵד
  choice: 会幕
  rationale: 采用现代中文圣经语境中自然且通行的名称。
- source_word: מֹשֶׁה וְאַהֲרֹן וּבָנָיו
  choice: 摩西、亚伦和他的儿子们
  rationale: 保留单数第三人称所属后缀；“他的”在中文中自然指向紧邻的亚伦。
- source_word: שֹׁמְרִים מִשְׁמֶרֶת
  choice: 看守……尽守护之责
  rationale: 用相关词语再现希伯来语同根结构所包含的守卫与履职双重意味。
- source_word: הַמִּקְדָּשׁ
  choice: 圣所
  rationale: 在此泛指神圣的帐幕范围及其事务，不限于某一个内室。
- source_word: לְמִשְׁמֶרֶת בְּנֵי יִשְׂרָאֵל
  choice: 替以色列子孙尽守护之责
  rationale: 表达他们承担与以色列全体有关、并代其履行的圣所守护职责。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列子孙
  rationale: 保留原文的亲属群体表达，指作为整体的盟约群体。
- source_word: וְהַזָּר
  choice: 任何外人
  rationale: 这里指不属于获准执行圣所职分范围的人，并非专指外族人；“外人”简洁保留其身份界线。
- source_word: הַקָּרֵב
  choice: 若走近
  rationale: 直接表达接近圣所或相关职事范围的动作，并以条件式衔接法令后果。
- source_word: יוּמָת
  choice: 必被处死
  rationale: 体现使役被动式所表示的外加死刑，而不是一般意义上的死亡。
theological_decisions:
- issue: “他的儿子们”的指代
  choice: 指亚伦的儿子们
  alternative: 宽泛地指与摩西和亚伦相关的后辈或家属
  rationale: 单数所属后缀紧接“亚伦”，且本章相关圣所职责明确属于亚伦及其儿子们。
- issue: זָר在圣所法规中的含义
  choice: 指未经授权接近圣所职事的人
  alternative: 指族裔上的外国人或一般社会意义的陌生人
  rationale: 上下文讨论的是帐幕的驻扎安排、祭司职责和圣所准入，因此界线关乎圣职授权，而非族裔。
- issue: לְמִשְׁמֶרֶת בְּנֵי יִשְׂרָאֵל所表达的责任关系
  choice: 摩西、亚伦和亚伦的儿子们替以色列子孙履行守护职责
  alternative: 他们负责监管以色列子孙，或仅泛指一项与以色列子孙有关的职责
  rationale: 介词短语与重复的“守护/职责”词根最自然地表明，他们代表群体承担圣所守护责任；译文不进一步建立制度性教义。
translation_notes:
  register: 采用现代、庄重而清楚的叙事法规语体。“帐幕”与“会幕”分别对应两个希伯来称谓；“东侧……朝日出方向”保留原文方位强调。“外人”后紧置脚注，以避免读者误解为族裔称谓。
