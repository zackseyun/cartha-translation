  naturalness: 原文“在帐幕前面东侧……就是会幕前面朝日出方向安营的，是……”语序滞重，“东侧”也易被读作帐幕自身的东侧。调整为“在帐幕前、在东边，即在会幕前、朝日出方向安营的”更自然、清楚，并保留双重方位强调。
  terminology: “帐幕”与“会幕”分别对应מִשְׁכָּן和אֹהֶל מוֹעֵד，处理恰当；“圣所”“以色列子孙”及“外人”的术语选择可保留。脚注对“外人”并非族裔概念的说明充分。
