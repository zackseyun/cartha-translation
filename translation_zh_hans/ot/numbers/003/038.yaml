revisions:
- from: 在帐幕前面东侧[a]，就是会幕前面朝日出方向安营的，是摩西、亚伦和他的儿子们。他们看守圣所，替以色列子孙尽守护之责。任何外人[b]若走近，必被处死。
  to: 在帐幕前、在东边，即在会幕前、朝日出方向安营的，是摩西、亚伦和亚伦的儿子们。他们看守圣所，替以色列子孙尽守护之责。外人[b]若接近，必被处死。
  rationale: 修订首句以符合现代标准汉语，并明确保留原文对东向位置的双重强调。将“他的儿子们”改为“亚伦的儿子们”只消除目标语指代歧义。删除原有[a]锚点会造成脚注结构错误，因此在首句的“东边”后保留[a]锚点。其余措辞及脚注维持原意。
