revisions:
- from: 因为所有头生的都是我的[a]。我击杀埃及地所有头生的那一天，就把以色列中所有头生的分别为圣，归给我；从人到牲畜，都是如此。他们都要归我。我是雅威。
  to: 因为一切头生的都是我的[a]。在我击杀埃及地一切头生的那日，我就将以色列中一切头生的，从人到牲畜，分别为圣归我[b]。他们要归我。我是雅威。
  rationale: 修订仅调整范围短语的句法位置，删除原文未明示且指代略泛的“都是如此”，使“从人到牲畜”明确限定“以色列中一切头生的”。同时将“所有”改为更具经文语体且自然的“一切”，并补充该总括表达的释义脚注。其余关键术语、神名和原文重复的归属语义均予保留。
