id: NUM.3.13
reference: Numbers 3:13
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כִּ֣י לִ/י֮ כָּל בְּכוֹר֒ בְּ/יוֹם֩ הַכֹּתִ֨/י כָל בְּכ֜וֹר בְּ/אֶ֣רֶץ מִצְרַ֗יִם הִקְדַּ֨שְׁתִּי לִ֤/י כָל בְּכוֹר֙ בְּ/יִשְׂרָאֵ֔ל מֵ/אָדָ֖ם עַד בְּהֵמָ֑ה לִ֥/י יִהְי֖וּ אֲנִ֥י יְהוָֽה־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/013.yaml
  text: For every firstborn is mine[a]. On the day when I struck down every firstborn in the land of Egypt, I consecrated to myself every firstborn in Israel, from man to beast. They shall be mine[b]. I am Yahweh.
translation:
  language: zh_hans
  text: 因为一切头生的都是我的[a]。在我击杀埃及地一切头生的那日，我就将以色列中一切头生的，从人到牲畜，分别为圣归我[b]。他们要归我。我是雅威。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “都是我的”也可译作“都属于我”。本节三次出现表示“归我”的短语，强调雅威的所有权。
    reason: lexical_alternative
  - marker: b
    text: “从人到牲畜”是概括性的表达，指从人到动物。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，说明雅威拣选利未人归自己的理由；“因为”自然保留了解释性的逻辑关系。
- source_word: לִי
  choice: 是我的／归给我／归我
  rationale: 希伯来文在本节三次使用 לִי，突出神的所有权；中文按各处句法分别译出，同时保留重复强调。
- source_word: כָּל בְּכוֹר
  choice: 所有头生的
  rationale: בְּכוֹר 指头生者或头生的后代；原文未明说“男性”，因此不增译。
- source_word: בְּיוֹם הַכֹּתִי
  choice: 我击杀……的那一天
  rationale: 保留明确的时间结构；在埃及长子之灾的语境中，נכה 表达致命的击打，故译为“击杀”。
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: 埃及地
  rationale: 保留原文“埃及之地”的完整表达及庄重语气。
- source_word: הִקְדַּשְׁתִּי לִי
  choice: 分别为圣，归给我
  rationale: 使役形 קדשׁ 表示使之成为圣、专归神；“分别为圣”保留礼仪含义，“归给我”则明确 לִי 所表达的归属。
- source_word: בְּיִשְׂרָאֵל
  choice: 以色列中
  rationale: 表示头生者所在的群体范围；“以色列中”简洁且符合现代汉语。
- source_word: מֵאָדָם עַד בְּהֵמָה
  choice: 从人到牲畜
  rationale: 这是涵盖人和动物两类的总括表达；אָדָם 在此为集合意义，译“人”，בְּהֵמָה 在头生牲畜的语境中译“牲畜”。
- source_word: יִהְיוּ
  choice: 都要归我
  rationale: 表达持续有效的神圣所有权；中文以“要归我”呈现其宣告性和将来／延续意味。
- source_word: אֲנִי יְהוָה
  choice: 我是雅威
  rationale: 直接音译四字神名，保留经文所宣告的盟约名字。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华／上主
  rationale: 原文直接使用四字神名；“雅威”较直接地呈现该专名，不以称号替代。
- issue: “分别为圣”与神的所有权之间的关系
  choice: 分别为圣，归给我
  alternative: 使……成圣／奉献给我
  rationale: 原文同时有 הִקְדַּשְׁתִּי 和 לִי，兼具圣别和归属两层意思；译文并列呈现，不把二者合并为单一概念。
- issue: אָדָם 的集合意义
  choice: 人
  alternative: 人类／男人
  rationale: 此处与牲畜相对，指人这一类别，并非特指成年男性；译“人”可避免增添原文没有的性别限定。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“头生的”保留经文术语感，又不擅自补入“男性”；“分别为圣”保留礼仪语义。为避免“从人到牲畜”紧接前句时产生句法含混，补入“都是如此”，明确圣别所涵盖的范围，但不改变原意。
