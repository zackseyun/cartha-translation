base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/016.yaml
  text: So Moses counted them at the command of Yahweh[a], just as he had been commanded.
translation:
  language: zh_hans
  text: 摩西就照雅威的吩咐[a]数点他们，正如他所受的命令那样。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 字面意思是“照雅威的口”。
    reason: 保留עַל־פִּי这一希伯来语习语的字面表达，同时正文采用自然中文说明其“奉命而行”的含义。
lexical_decisions:
- source_word: וַיִּפְקֹד
  choice: 数点
  rationale: 在利未人口统计的语境中，פקד指清点并登记人数；“数点”既保留原文的统计含义，也符合现代中文圣经叙事的庄重语体。
- source_word: אֹתָם
  choice: 他们
  rationale: 直接宾语代词，承接上文所说的利未人。
- source_word: עַל פִּי יְהוָה
  choice: 照雅威的吩咐
  rationale: עַל־פִּי字面为“照……的口”，在这里是按某人的命令行事；译作“照……的吩咐”自然地表达神圣命令的权威，并以脚注保留字面意象。
- source_word: יְהוָה
  choice: 雅威
  rationale: 原文直接使用四字神名；“雅威”以现代中文音译保留其作为专名的性质，而不以称号代替。
- source_word: כַּאֲשֶׁר
  choice: 正如
  rationale: 表达摩西的行动与先前命令完全相符；“正如”保留这种对应关系。
- source_word: צֻוָּה
  choice: 他所受的命令
  rationale: 原词为被动式，指摩西曾被命令；此译法保留被动含义和先于数点行动的逻辑关系。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 本节原文使用神的专名，而非表示“主”的称号；音译“雅威”可明确保留这一点，同时避免把专名改成称号。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“数点”适合人口统计语境；句中保留“吩咐／命令”的近义重复，以反映原文两个相关但不同的表达，而不擅自删减。
