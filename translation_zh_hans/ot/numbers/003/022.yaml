  yaml_path: translation/ot/numbers/003/022.yaml
  text: Their numbered ones[a], according to the number of every male from a month old and upward, were seven thousand five hundred.
translation:
  language: zh_hans
  text: 他们被数点的人[a]，按所有满一个月及以上男性的数目计算；他们被数点的人共有七千五百名。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“他们中被登记的人”。希伯来文在本节首尾两次使用同一个人口统计用语。
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּקֻדֵיהֶם
  choice: 数点的人
  rationale: 该词源于פקד，在人口登记语境中指被清点、登记的人。译作“数点的人”既保留人口普查含义，也符合现代中文圣经语体。希伯来文在本节前后重复此词；中文为避免生硬赘述，以句首的计数范围和句末的总数结构表达同一关系，并在脚注注明原文重复。
- source_word: בְּמִסְפַּר כָּל זָכָר
  choice: 按……所有男性的数目
  rationale: בְּמִסְפַּר表示计数的依据或范围；כָּל זָכָר明确指所有男性。此译准确保留人口普查的男性限定。
- source_word: מִבֶּן חֹדֶשׁ וָמָעְלָה
  choice: 一个月以上
  rationale: 这是人口统计中表示年龄下限的固定说法，意为从满一个月起及更年长者；“一个月以上”在现代中文中简洁自然。
- source_word: שִׁבְעַת אֲלָפִים וַחֲמֵשׁ מֵאוֹת
  choice: 七千五百名
  rationale: 按中文叙事惯例用汉字写出人数，并以“名”明确这是人员总数。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“数点”保留民数记人口普查语境中的传统圣经用语，同时普通读者可由上下文理解。脚注标记置于正文对应句末。
