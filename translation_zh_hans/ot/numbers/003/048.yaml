  text: And you shall give the silver to Aaron and to his sons as the redemption price for those among them who are in excess[a].
translation:
  language: zh_hans
  text: 你要把银子交给亚伦和他的儿子，作为他们中多出来之人的赎价。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或较贴近原文紧凑结构译作：“为他们中多出来之人的赎款。”希伯来文在一个构造结构中紧凑地表达被赎者及与其相关的赎价；本句因宾语是“银子”，正文译为“赎价”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתָּה
  choice: 你要把……交给
  rationale: 连接词加完成式在律例语境中承接前文并表达指令；中文用“你要”自然传达规定语气。
- source_word: הַכֶּסֶף
  choice: 银子
  rationale: כֶּסֶף本义为银，也可指钱财；此处是按舍客勒缴纳的赎金，用“银子”既贴近原文，也符合古代支付语境。
- source_word: לְאַהֲרֹן וּלְבָנָיו
  choice: 给亚伦和他的儿子
  rationale: 保留明确的接受者，并将בָּנָיו按上下文译为亚伦的儿子。
- source_word: פְּדוּיֵי
  choice: 作为……之人的赎价
  rationale: 该词是פדה相关形式的复数构造状态，原文结构高度压缩，可指被赎者或与其被赎相关的款项；因句中宾语是“银子”，正文按语境展开为“赎价”。
- source_word: הָעֹדְפִים
  choice: 多出来之人
  rationale: 分词表示超过对应数目而有余的人；这里指以色列头生男子中超过利未人数目的那些人。
- source_word: בָּהֶם
  choice: 他们中
  rationale: 介词ב加代词在此表达某群体内部的关系，译为“他们中”简洁自然，同时保留指代的语境依赖。
