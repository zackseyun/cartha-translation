  text: 以下是革顺的儿子按宗族的名字：立尼和示每。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/אֵלֶּה שְׁמוֹת
  choice: 他们的名字是
  rationale: 希伯来语以连接词、指示词和“名字”引出名单。结合中文上下文，译作“他们的名字是”自然清楚；不机械译出句首连接词和“这些”，以免生硬。
- source_word: בְּנֵי גֵרְשׁוֹן
  choice: 革顺的儿子
  rationale: בְּנֵי在此指随后列出的两名男性后代，直译为“儿子”比泛化为“子孙”更准确；גֵרְשׁוֹן采用中文圣经人名惯用译名“革顺”。
- source_word: לְ/מִשְׁפְּחֹתָ/ם
  choice: 按宗族
  rationale: מִשְׁפָּחָה在民数记的谱系与人口统计语境中指宗族单位；介词לְ表达分类或归属关系，译作“按宗族”简洁准确。
- source_word: לִבְנִי
  choice: 立尼
  rationale: 采用中文圣经人名惯用译名。
- source_word: וְ/שִׁמְעִי
  choice: 和示每
  rationale: 保留连接词所表达的并列关系，并采用中文圣经人名惯用译名“示每”。
