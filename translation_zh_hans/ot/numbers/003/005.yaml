base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/005.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: zh_hans
  text: 雅威对摩西说[a]：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文为四字神名“YHWH”；也常译作“耶和华”。
    reason: 说明神名的原文形式及传统译名。
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: 说
  rationale: 此处是希伯来叙事中常见的神谕引介公式。现代汉语用“说”最自然；句首的 וַ 推进叙事，无须机械译作“然后”。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 这是四字神名 YHWH；“耶和华”是现代汉语圣经传统中最通行、易于辨识的音译，并保留其作为专名的性质。
- source_word: אֶל
  choice: 对
  rationale: 该介词标明言说的对象；汉语“对摩西说”符合自然表达。
- source_word: מֹשֶׁה
  choice: 摩西
  rationale: 采用该人名在现代汉语中的标准译名。
- source_word: לֵאמֹר
  choice: 说（由冒号体现）
  rationale: 该不定式用于引出下文的直接话语。现代汉语中，在“对摩西说”之后用冒号即可自然体现其功能，避免重复译作“说道”。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名，而非“主”这一称号。正文采用汉语读者最熟悉的专名形式“耶和华”，脚注注明原文形式及另一常见音译，既保留专名，也不把可能有争议的古代读音表述为确定事实。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。以冒号承接下一节的直接引语；保留正文中的脚注标记[a]。
