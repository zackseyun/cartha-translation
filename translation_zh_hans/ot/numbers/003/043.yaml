base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/043.yaml
  text: And all the firstborn males[a], by the number of names, from a month old and upward, according to their count, were twenty-two thousand[b], three hundred seventy-three.
translation:
  language: zh_hans
  text: 凡满一个月及以上的头生男丁，按姓名数点[a]，照他们被数点的总数[b]，共有二万二千三百七十三人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “按姓名数点”是人口普查用语，表示逐一按名登记或清点。
    reason: cultural_note
  - marker: b
    text: 也可译作“照他们登记的总数”。希伯来语所指的是对这一群体所作的正式统计。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: 共有
  rationale: 此处的 היה 引出人口统计所得的总数；译作“共有”符合现代汉语表达，并保留结果陈述的功能。
- source_word: כָל בְּכוֹר זָכָר
  choice: 凡……头生男丁
  rationale: “凡”体现 כָל 的总体范围；“头生男丁”同时保留首生次序和男性限定。
- source_word: בְּמִסְפַּר שֵׁמוֹת
  choice: 按姓名数点
  rationale: 保留民数记中的人口登记用语，表达逐名清点，而非估算人数。
- source_word: מִבֶּן חֹדֶשׁ וָמַעְלָה
  choice: 一个月以上
  rationale: 自然表达统计所设的年龄下限，即满一个月及以上。
- source_word: לִפְקֻדֵיהֶם
  choice: 照他们被数点的总数
  rationale: 保留 פקד 在人口普查语境中的“数点”含义，也保留原文与前一统计短语之间的重复。
- source_word: שְׁנַיִם וְעֶשְׂרִים אֶלֶף שְׁלֹשָׁה וְשִׁבְעִים וּמָאתָיִם
  choice: 二万二千三百七十三人
  rationale: 按现代汉语数字顺序准确表达希伯来文总数；添加量词“人”使句子自然，不增加实质信息。
