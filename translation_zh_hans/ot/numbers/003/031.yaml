  text: וּ/מִשְׁמַרְתָּ֗/ם הָ/אָרֹ֤ן וְ/הַ/שֻּׁלְחָן֙ וְ/הַ/מְּנֹרָ֣ה וְ/הַֽ/מִּזְבְּחֹ֔ת וּ/כְלֵ֣י הַ/קֹּ֔דֶשׁ אֲשֶׁ֥ר יְשָׁרְת֖וּ בָּ/הֶ֑ם וְ/הַ֨/מָּסָ֔ךְ וְ/כֹ֖ל עֲבֹדָתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/031.yaml
  text: And their duty was the ark[a], the table, the lampstand, the altars, the vessels of the sanctuary with which they minister, the screen[c][b], and all its service.
translation:
  language: zh_hans
  text: 他们所负责的是[a]约柜、桌子、灯台、祭坛、他们供职时所用的圣所器具[b]、门帘[c]，以及与门帘有关的一切事务。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们受托照管的是”或“他们的职责是”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“圣器”。
    reason: lexical_alternative
  - marker: c
    text: 指入口处的遮帘，不是隔开至圣所的内幔。
    reason: cultural_note
lexical_decisions:
- source_word: וּמִשְׁמַרְתָּם
  choice: 他们负责看守的
  rationale: מִשְׁמֶרֶת在会幕职务语境中指受托照管、守护的职责；“负责看守”既体现责任，也适合后面所列的圣物。
- source_word: הָאָרֹן
  choice: 约柜
  rationale: 原文仅作“柜”，但在会幕语境中明确指神圣的约柜；采用现代中文圣经读者熟悉且简洁的名称，不增添原文未明说的“法柜”等限定。
- source_word: הַשֻּׁלְחָן
  choice: 桌子
  rationale: 原文只说“桌子”，故不补入陈设饼等说明。
- source_word: הַמְּנֹרָה
  choice: 灯台
  rationale: מְנוֹרָה指承放灯盏的礼仪器具；“灯台”准确而通行。
- source_word: הַמִּזְבְּחֹת
  choice: 祭坛
  rationale: 希伯来文为复数，中文“祭坛”本身不标单复数，在并列清单中可自然涵盖多座祭坛，且不误加量词。
- source_word: וּכְלֵי הַקֹּדֶשׁ
  choice: 圣所器具
  rationale: כְּלִים指器具、用具；הַקֹּדֶשׁ在此可理解为圣所领域。“圣所器具”清楚自然，同时以脚注保留“圣器”的另一种理解。
- source_word: אֲשֶׁר יְשָׁרְתוּ בָּהֶם
  choice: 他们供职时所用的
  rationale: שׁרת在此指礼仪性的侍奉或供职；关系从句说明这些器具是执行圣所职务时所使用的。
- source_word: הַמָּסָךְ
  choice: 门帘
  rationale: מָסָךְ在会幕语境中通常是入口处的遮帘；译作“门帘”可与至圣所前的内幔פָּרֹכֶת区别。
- source_word: וְכֹל עֲבֹדָתוֹ
  choice: 以及与门帘有关的一切事务
  rationale: 阳性单数后缀最直接回指紧邻的阳性名词“门帘”；עֲבֹדָה在此指相关职务或事务。此译法比生硬的“它的一切服事”更自然。
theological_decisions:
- issue: 会幕礼仪职务的用语
  choice: 以“供职”和“事务”表达圣所中的职务活动
  alternative: 译作“服事”和“工作”
  rationale: “供职”保留שׁרת的礼仪和职责色彩，又不套用后世教会职分术语；末句的עֲבֹדָה则按具体照管事务译出。
- issue: עֲבֹדָתוֹ中单数代词的指向
  choice: 按最邻近的阳性单数名词，理解为与门帘有关的事务
  alternative: 泛指与前述全部圣物或整个会幕相关的服事
  rationale: 希伯来文的语法与词序最自然地支持回指הַמָּסָךְ“门帘”；泛指全体虽有语境上的可能，却需要在译文中扩大代词所指。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。句子保留原文清单式结构，并用“负责看守”“供职”体现哥辖人受托照管会幕圣物的行政及礼仪语境。所有脚注标记均置于正文相应词语之后。
