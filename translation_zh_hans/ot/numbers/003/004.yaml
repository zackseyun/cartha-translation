  text: וַ/יָּ֣מָת נָדָ֣ב וַ/אֲבִיה֣וּא לִ/פְנֵ֣י יְהוָ֡ה בְּֽ/הַקְרִבָ/ם֩ אֵ֨שׁ זָרָ֜ה לִ/פְנֵ֤י יְהוָה֙ בְּ/מִדְבַּ֣ר סִינַ֔י וּ/בָנִ֖ים לֹא הָי֣וּ לָ/הֶ֑ם וַ/יְכַהֵ֤ן אֶלְעָזָר֙ וְ/אִ֣יתָמָ֔ר עַל פְּנֵ֖י אַהֲרֹ֥ן אֲבִי/הֶֽם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/004.yaml
  text: But Nadab and Abihu died before Yahweh when they offered strange fire before Yahweh in the wilderness of Sinai[a], and they had no sons[b]; and Eleazar and Ithamar served as priests in the presence of Aaron their father.
translation:
  language: zh_hans
  text: '拿答和亚比户在西奈旷野向雅威献上异火[a]时，死在雅威面前。他们没有儿子；以利亚撒和以他玛在父亲亚伦面前[b]履行祭司职分。


    [a] “异火”也可译为“外来的火”；这里很可能指未经准许用于献祭的火。


    [b] “在父亲亚伦面前”也可理解为“在父亲亚伦生前”，即他们在亚伦还活着的时候履行祭司职分。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “异火”也可译为“外来的火”；这里很可能指未经准许用于献祭的火。
    reason: 说明 זָרָה 的词义范围及其在祭祀语境中的可能含义。
  - marker: b
    text: “在父亲亚伦面前”也可理解为“在父亲亚伦生前”，即他们在亚伦还活着的时候履行祭司职分。
    reason: 保留并说明 עַל־פְּנֵי 在此处可能具有的时间含义。
lexical_decisions:
- source_word: וַיָּמָת
  choice: 就死
  rationale: 该叙事动词直接表示死亡；虽为单数形式，但复合主语是拿答和亚比户，汉语无需标示动词的数。
- source_word: לִפְנֵי יְהוָה
  choice: 在雅威面前
  rationale: 保留“在……面前／临在中”的希伯来语意象，也适合此处献祭与受审判的语境。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来语四字神名的通行现代拟音译出专名，不以一般称号替代。
- source_word: בְּהַקְרִבָם
  choice: 把……献……时
  rationale: 介词与不定式结构表示伴随的时间或情形；在祭祀语境中译为“献”自然明确。
- source_word: אֵשׁ זָרָה
  choice: 异火
  rationale: 直译保留 זָרָה 所含“异样、外来、不属规定范围”的开放性；脚注说明其很可能指未经准许的祭火，避免在正文中过度释义。
- source_word: בְּמִדְבַּר סִינַי
  choice: 在西奈旷野
  rationale: 自然、准确地表达地点，并保留“旷野”的圣经地理用语。
- source_word: וּבָנִים לֹא הָיוּ לָהֶם
  choice: 他们没有儿子
  rationale: בָנִים 在祭司承继的上下文中明确指儿子，不泛化为“孩子”。
- source_word: וַיְכַהֵן
  choice: 担任祭司
  rationale: כהן 表示履行祭司职分；现代汉语用“担任祭司”简明自然。
- source_word: עַל פְּנֵי אַהֲרֹן אֲבִיהֶם
  choice: 在父亲亚伦面前
  rationale: 保留原文的空间性表达及其可能兼有的同时性，不在正文中限定为“受亚伦监督”或仅指“亚伦在世时”。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文使用神的专名；“雅威”较直接地反映现代学界通常重构的读音，并避免以称号“主”取代专名。
- issue: אֵשׁ זָרָה 的性质
  choice: 正文译“异火”，脚注说明可能指未经准许的火
  alternative: 擅自献上的火；未经许可的火
  rationale: 原文形容词本身并未详述违规的具体方式；保留其措辞，可避免把相关经文所暗示的解释直接写入正文。
- issue: עַל פְּנֵי אַהֲרֹן 所表达的关系
  choice: 在亚伦面前
  alternative: 在亚伦生前；在亚伦监督下
  rationale: 该短语可能表示在场或同时在世，却不必然明确表达监督关系；正文保留歧义，脚注交代时间性的理解。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“异火”保留原文的凝练与含混，并用脚注帮助普通读者理解；句法稍作拆分，以免多个并列分句造成阅读负担。
