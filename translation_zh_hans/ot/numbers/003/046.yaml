base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/046.yaml
  text: And for the redemption price of the 273 who exceed the Levites from among the firstborn of the sons of Israel,[a]
translation:
  language: zh_hans
  text: 至于以色列众长子中比利未人多出的二百七十三人，要收取他们的赎价[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“二百七十三名被赎者”。希伯来语此词可按形式理解为“被赎的人”；但紧接的47—48节说明要为这些多出的长子按人收取款项，因此正文按上下文译作“赎价”。
    reason: 保留 פְּדוּיֵי 可指“被赎者”或与赎取相关款项的词义歧义，同时说明正文译法的上下文依据。
lexical_decisions:
- source_word: פְּדוּיֵי
  choice: 要为他们付赎价
  rationale: 该词源于 פדה，形式上可指“被赎的人”，也可在此语境中指为赎回这些人所付的赎价。下文规定每人五舍客勒，因此正文采用自然的汉语表达，明确其为应付的赎价，同时以脚注保留较为字面的另一种理解。
- source_word: הַשְּׁלֹשָׁה וְהַשִּׁבְעִים וְהַמָּאתָיִם
  choice: 二百七十三人
  rationale: 希伯来语以三、七十、二百相加来表示数目；现代汉语按通常次序译为“二百七十三”，准确而清楚。
- source_word: הָעֹדְפִים עַל הַלְוִיִּם
  choice: 比利未人所不能替代而多出的
  rationale: 分词与介词短语表示以利未人数目为基准而超出的那些长子。结合上文利未人代替以色列长子的安排，加入“所不能替代”使比较关系在汉语中清楚，但不改变“多出”的核心含义。
- source_word: מִבְּכוֹר בְּנֵי יִשְׂרָאֵל
  choice: 以色列众长子中
  rationale: 介词 מִן 表示从某一群体中划分出来；בְּכוֹר 在这里是集合用法，故译作“众长子”。“以色列”在此指以色列群体，现代汉语无需机械译成“以色列众子”。
theological_decisions:
- issue: 利未人与多出长子之间的关系
  choice: 表述为“比利未人所不能替代而多出的”
  alternative: 较直译为“超过利未人的”
  rationale: 上下文明确利未人代替以色列的长子；此译法说明人数为何“多出”，但不增添关于赎罪机制或救恩教义的解释。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“至于”承接本节希伯来语句首结构；正文写成完整汉语句子，并用脚注保留原文在“被赎者”与“赎价”之间的歧义。
