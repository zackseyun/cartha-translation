base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/050.yaml
  text: From the firstborn of the sons of Israel he took the silver[a], one thousand three hundred sixty-five shekels[b], according to the sanctuary shekel.
translation:
  language: zh_hans
  text: 他从以色列人的长子[a]那里收取了银子，共一千三百六十五舍客勒，按圣所的舍客勒计算[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“以色列众子的长子”；这里的单数“长子”具有集合含义。
    reason: 说明希伯来文的构造关系及集合性单数。
  - marker: b
    text: 或译“按圣所的舍客勒”。这句话说明所采用的是圣所规定的重量标准。
    reason: 说明计量标准，并提供较贴近原文结构的译法。
lexical_decisions:
- source_word: מֵאֵת
  choice: 从……那里
  rationale: 这里表示银子的来源；“从……那里”符合现代汉语表达，又不额外限定为主动交付或经手转交。
- source_word: בְּכוֹר בְּנֵי יִשְׂרָאֵל
  choice: 以色列人的长子
  rationale: בְּכוֹר虽为单数形式，在此作集合性用法。结合本章统计并赎回头生男子的语境，“长子”保留了所指的男性身份；“以色列人”则自然表达“以色列众子”的民族称谓。
- source_word: לָקַח
  choice: 收取了
  rationale: 该动词基本义为“拿、取”。在收取赎银的语境中，“收取”比生硬的“拿了”自然，同时仍保留主动取得的含义。
- source_word: הַכָּסֶף
  choice: 银子
  rationale: כֶּסֶף本义为“银”，也可指银钱。此处随后按舍客勒计量，译作“银子”既保留材质含义，也符合汉语财物语境；不在正文中添加原文未明说的“赎”。
- source_word: חֲמִשָּׁה וְשִׁשִּׁים וּשְׁלֹשׁ מֵאוֹת וָאֶלֶף
  choice: 一千三百六十五
  rationale: 按现代汉语常规数词顺序清楚表达希伯来文各数值成分。
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: 按圣所的舍客勒标准计算
  rationale: 介词短语说明采用的衡量标准。“圣所的舍客勒标准”避免让人误解为某一枚特殊钱币，并自然传达原文的礼仪场所关联。
theological_decisions:
- issue: 是否在正文中把הַכָּסֶף明确译成“赎银”
  choice: 保留为“银子”
  alternative: 赎银
  rationale: 上下文确实表明这是赎回长子所收的银子，但本节原文只说“这银子”。正文不把语境推论写进词义，可保留原文简洁性，避免过度解释。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“收取了银子”适合财物交收语境；“是按……标准计算的”清楚说明舍客勒在此所具有的计量功能。
