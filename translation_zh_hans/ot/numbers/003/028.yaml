  text: בְּ/מִסְפַּר֙ כָּל זָכָ֔ר מִ/בֶּן חֹ֖דֶשׁ וָ/מָ֑עְלָ/ה שְׁמֹנַ֤ת אֲלָפִים֙ וְ/שֵׁ֣שׁ מֵא֔וֹת שֹׁמְרֵ֖י מִשְׁמֶ֥רֶת הַ/קֹּֽדֶשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/028.yaml
  text: By the number of every male from a month old and upward[a], there were eight thousand six hundred, keeping charge of the holy place.
translation:
  language: zh_hans
  text: 按满一个月及以上所有男性的人数计算，共有八千六百人；他们负责看守圣所[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “圣所”或译“圣物”。
    reason: 原文הַקֹּדֶשׁ可指神圣的场所，也可指分别为圣之物；在本节上下文中正文采用“圣所”，并以脚注保留另一种可能。
lexical_decisions:
- source_word: בְּמִסְפַּר כָּל זָכָר
  choice: 按所有……男性的数目
  rationale: 保留祭司文献中人口统计的公式表达；“所有……男性”准确体现统计对象。
- source_word: מִבֶּן חֹדֶשׁ וָמָעְלָה
  choice: 满一个月及以上
  rationale: 这是民数记常见的年龄下限表达；“满一个月及以上”在现代汉语中清楚自然。
- source_word: שְׁמֹנַת אֲלָפִים וְשֵׁשׁ מֵאוֹת
  choice: 八千六百人
  rationale: 忠实表达希伯来文本的数目，并补出汉语计数所需的“人”。
- source_word: שֹׁמְרֵי מִשְׁמֶרֶת
  choice: 负责守护
  rationale: 分词与同根名词连用，表示持续承担受托的看守职责；此译法避免生硬重复，同时保留责任与守护两层含义。
- source_word: הַקֹּדֶשׁ
  choice: 圣所
  rationale: 在本段利未人的职责语境中，指受其看守的神圣领域；译作“圣所”自然且符合上下文，同时以脚注保留“圣物”的词义可能。
theological_decisions:
- issue: הַקֹּדֶשׁ所指的是神圣场所还是神圣物件
  choice: 正文译作“圣所”
  alternative: 圣物
  rationale: 定冠词形式可指圣所，也可指圣物。这里的看守职责较自然地指向圣所，但下一节列举哥辖人所负责的圣器，因此不应消除“圣物”的可能，故以脚注保留。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“满一个月及以上”明确年龄门槛；分号区分人口统计结果与其职责。脚注标记紧跟存在词义歧义的“圣所”。
