base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/044.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: zh_hans
  text: 雅威[a]对摩西说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文为יהוה（YHWH），是神的名字；传统汉译作“耶和华”，“雅威”是按其通常推定读音所作的音译。
    reason: 说明神名的原文形式、传统译法及正文音译所涉及的读音推定。
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: 对……说
  rationale: 该叙事形式推进叙述，并引出神对摩西的讲话。现代汉语用“对……说”自然清楚；句首不机械加入“于是”，以免造成原文未明确表达的时间或因果色彩。
- source_word: יְהוָה
  choice: 雅威
  rationale: 这是神名四字母יהוה（YHWH）。采用“雅威”作为通常推定读音的现代汉语音译，以保留专名性质，不以称号替代。
- source_word: אֶל מֹשֶׁה
  choice: 对摩西
  rationale: 介词אֶל标明讲话的对象；“对摩西”符合现代汉语表达。
- source_word: לֵאמֹר
  choice: 冒号
  rationale: 该不定式用于引出随后讲话的内容。现代汉语以冒号自然承担这一篇章功能，避免生硬重复为“说……说”。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用神的专名יהוה。正文采用“雅威”保留其专名性质；脚注说明传统汉译“耶和华”，不把有争议的读音推定隐藏起来。
translation_notes:
  register: 采用现代、简洁而庄重的叙事语言。用冒号承接下一节的直接引语，既传达לֵאמֹר的功能，也避免不自然的“对摩西讲话说”。
