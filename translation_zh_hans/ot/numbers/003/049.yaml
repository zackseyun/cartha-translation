  terminology: “赎价银”适合对应 כֶּסֶף הַפִּדְיוֹם，既保留银钱的物质背景，也表达赎回所付的款项。脚注a保留“赎金”这一可行译法。脚注b将“利未人数目”限定为在本次赎回点算中由利未人代表的数目，避免误以为泛指所有利未人的人数。
