  text: וַ/יִּקַּ֣ח מֹשֶׁ֔ה אֵ֖ת כֶּ֣סֶף הַ/פִּדְי֑וֹם מֵ/אֵת֙ הָ/עֹ֣דְפִ֔ים עַ֖ל פְּדוּיֵ֥י הַ/לְוִיִּֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/049.yaml
  text: And Moses took the redemption money from those who were in excess over those redeemed by the Levites[a][b].
translation:
  language: zh_hans
  text: 摩西向人数多于由利未人代赎之人的那些人收取了赎价银[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“赎金”。希伯来语所指的是为赎回而支付的钱款。
    reason: lexical_alternative
  - marker: b
    text: 指以色列人中头生男子的数目超过在这次赎回点算中由利未人所代表的数目；参本章前文的点算。
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּקַּח
  choice: 收取了
  rationale: 该词是 לקח 的叙事形式，基本义为“拿、取”；此处宾语是款项，用“收取”符合现代汉语，又不超出语境所表达的领受行动。
- source_word: כֶּסֶף הַפִּדְיוֹם
  choice: 赎价银
  rationale: כֶּסֶף 可指银或银钱，פִּדְיוֹם 指赎回所付的代价；“赎价银”兼顾实物银款与赎回的礼仪法律含义。
- source_word: מֵאֵת
  choice: 从……中
  rationale: 该介词表示款项的来源；结合复数人群，译作“从……中”自然明确。
- source_word: הָעֹדְפִים
  choice: 那些超过……人数的人
  rationale: עודף 的分词表示多出、超过的人；译文保留其相对于另一人数而有的超额含义，没有在正文中直接补出本节未明说的“以色列头生者”。
- source_word: עַל
  choice: 超过
  rationale: 此处表达数量上的比较和超出，用“超过”准确而自然。
- source_word: פְּדוּיֵי הַלְוִיִּם
  choice: 利未人所赎人数
  rationale: 该短语是被动分词复数与“利未人”构成的属格结构，字面关系可有一定宽度；按上下文译为“利未人所赎人数”，既体现代赎计算，也避免把它误解为利未人自己是被赎者。
theological_decisions:
- issue: 利未人与被赎者之间的关系
  choice: 利未人所赎人数
  alternative: 利未人的被赎者／被利未人赎出的人
  rationale: 上下文是以利未人替代以色列头生者的数目核算。“所赎人数”传达这种代表性代赎关系，同时不加入特定宗派性的救赎解释。
translation_notes:
  register: 采用现代、庄重而易懂的叙事表达。“赎价银”保留古代以银支付赎价的背景；“那些超过利未人所赎人数的人”略带法律统计语体，以保存原文的数量比较关系。
