base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/009.yaml
  text: You shall give the Levites to Aaron and to his sons[b][a]; they are wholly given to him from among the sons of Israel.
translation:
  language: zh_hans
  text: 你要把利未人交给亚伦和他的儿子们；他们是从以色列人中[b]完全交给亚伦的[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文把“交给”重复两次，以加强语气，直译为“交给，交给”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译为“从以色列的众子中”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתָּה
  choice: 你要……交给
  rationale: 该形式在指令语境中表达命令；“你要”自然保留其指令力度，“交给”也与本节将利未人指定给亚伦及其众子的语境相符。
- source_word: הַלְוִיִּם
  choice: 利未人
  rationale: 这是利未支派成员的标准现代汉语称谓。
- source_word: לְאַהֲרֹן וּלְבָנָיו
  choice: 给亚伦和他的儿子们
  rationale: 介词 לְ 在此标明接受者；“给……和……”保留原文的转交结构。
- source_word: נְתוּנִם נְתוּנִם
  choice: 全然赐给
  rationale: 原文连续两次使用“赐给”的被动分词以加强语气；“全然”以自然汉语表达这一强调，脚注说明其字面重复。
- source_word: הֵמָּה
  choice: 他们是
  rationale: 独立代词使主语略带强调；汉语以明确重提前述的利未人来表达，不另加生硬的“他们自己”。
- source_word: לוֹ
  choice: 给他的
  rationale: 单数代词在近距离语境中回指亚伦；译文保持这一单数所指，不将其扩展为亚伦和他的儿子们。
- source_word: מֵאֵת בְּנֵי יִשְׂרָאֵל
  choice: 从以色列人中
  rationale: מֵאֵת 表明来源，“从……中”清楚表达利未人是由以色列全体中分别出来的；“以色列人”是现代汉语中自然的群体称呼。
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל 的译法
  choice: 以色列人
  alternative: 以色列的众子
  rationale: 原文形式直译为“以色列的众子”，但此处作为全体民族的惯用称呼；正文采用现代汉语自然的“以色列人”，并在脚注保留原文的家族性表达。
- issue: לוֹ 的单数所指
  choice: 他的，指亚伦
  alternative: 他们的，指亚伦和他的儿子们
  rationale: 马所拉文本使用第三人称阳性单数代词，最直接地回指亚伦。译文保留单数，不因前句提到亚伦的儿子们而改成复数。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“交给”表达本句的指令和委派关系，“全然赐给”自然传达原文重复所带出的强调。所有脚注标记均置于相关词句之后。
