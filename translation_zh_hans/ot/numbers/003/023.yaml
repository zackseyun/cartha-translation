base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/023.yaml
  text: The clans of the Gershonites shall camp behind the tabernacle[a], toward the west.
translation:
  language: zh_hans
  text: 革顺人的各宗族要在帐幕后面、朝西的一边安营。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“朝海的一边”，这是圣经希伯来语表示“朝西”的惯用说法。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁפְּחֹת
  choice: 各宗族
  rationale: 在《民数记》的支派与人口统计语境中，指较大群体内部按血缘划分的单位；“宗族”比“家庭”更能表达这一层级。
- source_word: הַגֵּרְשֻׁנִּי
  choice: 革顺人
  rationale: 带冠词的单数族称在此作集合用法，统指革顺的后裔群体；“革顺人”符合现代汉语圣经人名及族称习惯。
- source_word: אַחֲרֵי
  choice: 在……后面
  rationale: 此处表示空间位置而非时间先后；“在帐幕后面”自然准确。
- source_word: הַמִּשְׁכָּן
  choice: 帐幕
  rationale: 在本语境中指以色列敬拜中心的神圣会幕；“帐幕”简明庄重，并与该词“居所”的词源意象保持适度联系。
- source_word: יַחֲנוּ
  choice: 要……安营
  rationale: 未完成式在此说明受规定的营地部署；“要……安营”兼顾指令意味与自然汉语表达。
- source_word: יָמָּה
  choice: 朝西的一边
  rationale: 该方向词字面与“海”有关，在圣经希伯来语中惯指西方；结合安营位置译作“朝西的一边”，既表达方向，也避免让现代读者误以为附近必有海。
