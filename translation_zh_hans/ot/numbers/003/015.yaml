  text: 'Count the sons of Levi by their fathers'' houses[a], by their clans: every male from a month old and upward you shall count.'
translation:
  language: zh_hans
  text: 你要按利未人的父家、宗族数点他们；凡从满一个月起的男性，都要数点。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פְּקֹד / תִּפְקְדֵם
  choice: 数点／都要数点
  rationale: 在本节人口登记的语境中，פקד 指清点并登记人数。“数点”既保留命令语气，也不引入军事召集的意味。
- source_word: בְּנֵי לֵוִי
  choice: 利未人
  rationale: 希伯来语直译为“利未的子孙”，这里指按血统归属利未的群体。现代汉语用“利未人”自然明确，而后面的父家和宗族仍保留其谱系结构。
- source_word: לְבֵית אֲבֹתָם
  choice: 按……父家
  rationale: “父家”是民数记中表示父系家族单位的固定称谓，既贴近原文，也与下文“宗族”区分。
- source_word: לְמִשְׁפְּחֹתָם
  choice: 按……宗族
  rationale: “宗族”准确表达 מִשְׁפָּחָה 所指的亲属群体，并避免与“父家”混同。
- source_word: כָּל זָכָר
  choice: 凡……男性
  rationale: 原文强调性别而非成年身份；因统计包括婴儿，“男性”比“男人”准确。
- source_word: מִבֶּן חֹדֶשׁ וָמַעְלָה
  choice: 一个月以上
  rationale: 这是规定统计年龄下限的惯用表达；“一个月以上”在现代汉语中简洁自然，意为满一个月及更年长者。
