- source_word: וַיִּהְיוּ אֵלֶּה
  choice: 如下
  rationale: 该结构在这里引出后面的名单。译为“如下”自然地表达其列举功能，不把 היה 误解为状态变化。
- source_word: בְנֵי לֵוִי
  choice: 利未的儿子
  rationale: 这里所指的是利未的三个亲生儿子，因此采用明确而自然的“儿子”，不泛化为“后代”。
- source_word: בִּשְׁמֹתָם
  choice: 按名字
  rationale: 保留介词短语“按其名字”的表达，同时按现代汉语习惯省去语境中多余的物主代词。
- source_word: גֵּרְשׁוֹן
  choice: 革顺
  rationale: 采用现代中文圣经中通行且易辨认的人名音译。
- source_word: קְהָת
  choice: 哥辖
  rationale: 采用现代中文圣经中通行且易辨认的人名音译。
- source_word: מְרָרִי
  choice: 米拉利
  rationale: 采用现代中文圣经中通行且易辨认的人名音译。
