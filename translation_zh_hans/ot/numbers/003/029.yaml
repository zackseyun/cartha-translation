  text: The clans of the sons of Kohath shall camp on the south side of the tabernacle[a].
translation:
  language: zh_hans
  text: 哥辖子孙[a]的各宗族要在会幕的南边安营。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译“哥辖的儿子们”，这里指哥辖的后裔，也可译作“哥辖人”。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁפְּחֹת
  choice: 各宗族
  rationale: 在民数记的编组和安营语境中，指同一支派内部按血缘划分的群体；“宗族”比现代汉语的“家庭”更准确。
- source_word: בְּנֵי קְהָת
  choice: 哥辖子孙
  rationale: 希伯来文直译为“哥辖的儿子们”，在这里泛指哥辖的后裔；“哥辖子孙”既保留谱系意味，也符合自然的现代汉语表达。
- source_word: יַחֲנוּ
  choice: 要……安营
  rationale: 此处未完成式用于规定营地安排，表达应当依照指示安营；“要……安营”自然地传达这种指令性的将来安排。
- source_word: עַל יֶרֶךְ
  choice: 在……边
  rationale: 这一方位短语表示位于某物的一侧；结合下文的南方，以“在……南边”表达最自然。
- source_word: הַמִּשְׁכָּן
  choice: 帐幕
  rationale: 在本段特指以色列人营中的神圣会幕；“帐幕”是简洁、庄重且能与上下文相合的译法。
- source_word: תֵּימָנָה
  choice: 南边
  rationale: 该词的方向形式表示朝南或位于南面；与 יֶרֶךְ 合译为“南边”，准确而自然。
