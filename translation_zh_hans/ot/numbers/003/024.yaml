  yaml_path: translation/ot/numbers/003/024.yaml
  text: And the chief of the ancestral house of the Gershonites was Eliasaph son of Lael[a].
translation:
  language: zh_hans
  text: 革顺人父系家族[a]的首领是拉伊勒的儿子以利雅萨。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“父亲的家”，是以色列人按父系划分的家族或宗族单位。
    reason: cultural_note
lexical_decisions:
- source_word: וּנְשִׂיא
  choice: 首领
  rationale: נָשִׂיא在此行政与族谱语境中指家族的负责人，并非君王；译作“首领”准确自然。句首וּ承接上文，中文列表语境中无需机械译出“并且”。
- source_word: בֵית אָב
  choice: 父系家族
  rationale: 该短语字面为“父亲的家”，是以色列社会中按父系划分的亲族单位；“父系家族”既保留其父系性质，又便于现代读者理解。
- source_word: לַגֵּרְשֻׁנִּי
  choice: 革顺人的
  rationale: 带介词ל的单数族称在此指与革顺后裔群体相关；译作“革顺人的”符合汉语表达，并保留集体含义。
- source_word: אֶלְיָסָף
  choice: 以利雅萨
  rationale: 按现代中文圣经人名的通行音译处理。
- source_word: בֶּן
  choice: ……的儿子
  rationale: 明确表达希伯来族谱中的父子关系，并按汉语习惯调整语序。
- source_word: לָאֵל
  choice: 拉伊勒
  rationale: 按现代中文圣经人名的通行音译处理。
