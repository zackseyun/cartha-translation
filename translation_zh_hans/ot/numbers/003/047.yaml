  text: you shall take five shekels apiece[a], by the shekel of the sanctuary[b]; the shekel is twenty gerahs.
translation:
  language: zh_hans
  text: 你要按圣所的舍客勒，每人取五舍客勒[a]；一舍客勒是二十季拉[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“按人头，每人五舍客勒。”
    reason: lexical_alternative
  - marker: b
    text: 即按照圣所采用的标准重量；一舍客勒等于二十季拉。
    reason: cultural_note
lexical_decisions:
- source_word: וְלָקַחְתָּ
  choice: 你要……收取
  rationale: 带连接词的完成式在此条例语境中表达指令；“你要……收取”既自然，也保留律例式语气。
- source_word: חֲמֵשֶׁת חֲמֵשֶׁת שְׁקָלִים
  choice: 每人……五舍客勒
  rationale: 数词“五”的重复具有逐一分配的作用，现代汉语用“每人”清楚表达，避免生硬直译为“五个五个”。
- source_word: לַגֻּלְגֹּלֶת
  choice: 每人
  rationale: 字面为“按头”，在这里是按人数逐一计算的惯用表达；译作“每人”准确而自然，字面形式收入脚注。
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: 按圣所的舍客勒
  rationale: 介词短语说明应采用的衡量标准。“圣所的舍客勒”保留敬拜场所的关联，并避免把它误解为另有一种神圣钱币。
- source_word: תִּקָּח עֶשְׂרִים גֵּרָה הַשָּׁקֶל
  choice: 一舍客勒是二十季拉
  rationale: 原文形式上再次使用“收取”，但整句是在说明该标准舍客勒的换算值；汉语用判断句可准确、清楚地传达这一作用。
- source_word: גֵּרָה
  choice: 季拉
  rationale: 保留古代希伯来重量单位名称，并按现代中文圣经读者较熟悉的音译处理。
