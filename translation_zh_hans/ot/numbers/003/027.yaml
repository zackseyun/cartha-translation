base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/027.yaml
  text: 'And for Kohath: the clan of the Amramites, and the clan of the Izharites, and the clan of the Hebronites, and the clan of the Uzzielites—these are the clans of the Kohathites.'
translation:
  language: zh_hans
  text: 哥辖的宗族有：暗兰族、以斯哈族、希伯仑族和乌薛族；这些是哥辖人的宗族。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/לִ/קְהָת
  choice: 哥辖有
  rationale: 介词短语引出哥辖所属的下一组宗族；译为“哥辖有”符合现代汉语族谱列举的表达，也保留分类关系。
- source_word: מִשְׁפַּחַת
  choice: 族
  rationale: 在本节人口统计和宗族谱系的语境中，מִשְׁפָּחָה指部族之下的亲族单位；“族”简洁自然，并可与各祖先名组成“暗兰族”等称谓。
- source_word: הַֽ/עַמְרָמִי
  choice: 暗兰族
  rationale: 该族称表示暗兰的后裔；采用“暗兰”这一常见中文音译，加“族”清楚表达群体含义。
- source_word: הַ/יִּצְהָרִי
  choice: 以斯哈族
  rationale: 该族称表示以斯哈的后裔；使用常见中文专名“以斯哈”，并以“族”标明宗族。
- source_word: הַֽ/חֶבְרֹנִי
  choice: 希伯仑族
  rationale: 该族称表示希伯仑的后裔；“希伯仑族”既保留人名来源，也符合上下文的平行结构。
- source_word: הָֽ/עָזִּיאֵלִי
  choice: 乌薛族
  rationale: 该族称表示乌薛的后裔；采用常见中文音译“乌薛”，并加“族”表达宗族单位。
- source_word: אֵלֶּה הֵם
  choice: 这些就是
  rationale: 指示词加代词构成确认和归纳句；“这些就是”自然传达希伯来语的识别语气。
- source_word: מִשְׁפְּחֹת הַ/קְּהָתִי
  choice: 哥辖人的各族
  rationale: 复数构造短语概括前述各宗族均属于哥辖后裔；“哥辖人的各族”在现代汉语中清楚自然，并保留复数分类意义。
