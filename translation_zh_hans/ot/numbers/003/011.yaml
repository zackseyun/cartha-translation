  text: 于是，耶和华对摩西说：
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: 于是……说
  rationale: 连续式叙事结构推进情节，可译为“于是”或“又”；现代汉语中“对……说”自然表达 דּבר 的言说含义，并与后接引语的 לֵאמֹר 合并处理，避免生硬重复。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代简体中文圣经语境中最通行、易识别的神圣专名音译“耶和华”，不以称号“主”替代原文专名。
- source_word: אֶל־מֹשֶׁה
  choice: 对摩西
  rationale: 介词 אֶל 标示言说所指向的对象；汉语惯用“对摩西说”。
- source_word: לֵאמֹר
  choice: 说：
  rationale: 该不定式引出下一节的直接话语。汉语以“说：”及冒号自然表达其功能；与 וַיְדַבֵּר 合并，而不机械译成“说，曰”。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用四字神名而非“主”这一称号。中文采用广为人知的专名形式“耶和华”，既保留其为专名的性质，也便于普通现代读者理解；“雅威”是较贴近学界常见拟音的可行替代。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。“于是”体现叙事推进；以冒号表明神的话在下一节继续。未添加脚注，因为正文无需标记即可准确传达本节，且中文的“于是”已自然体现句首连接词的叙事功能。
