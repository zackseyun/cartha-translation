  text: and the pillars of the surrounding courtyard[a], and their bases, and their pegs[b], and their cords.
translation:
  language: zh_hans
  text: 以及院子四围的柱子、柱座、橛子和绳索。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עַמֻּדֵי
  choice: 柱子
  rationale: 该词为复数构造形，指支撑院子帷幕的直立构件；“柱子”准确、自然，也符合会幕建筑语境。
- source_word: הֶחָצֵר
  choice: 院子
  rationale: 指会幕外围由帷幕围成的区域；“院子”是现代汉语中清楚自然的表达。
- source_word: סָבִיב
  choice: 四围
  rationale: 表示环绕四周，与“院子”及其周边柱子的空间关系相符，也保留原文简洁的方位描述。
- source_word: אַדְנֵיהֶם
  choice: 柱座
  rationale: 该词在会幕建筑语境中指承托或固定柱子的底座；结合所属对象译作“柱座”，比单说“座”更清楚。
- source_word: יְתֵדֹתָם
  choice: 橛子
  rationale: 指用于固定院子结构的钉橛；“橛子”简明，并与绳索自然搭配。
- source_word: מֵיתְרֵיהֶם
  choice: 绳索
  rationale: 指固定结构所用的绳子；“绳索”庄重、易懂，并保留其结构用途而不额外解释。
- source_word: וְ
  choice: 以及／和
  rationale: 原文反复使用连接词，承接上一节的清单；中文以“以及”开头并在末项前用“和”，既体现延续和列举关系，又避免生硬重复。
