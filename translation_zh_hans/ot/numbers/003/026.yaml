base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/026.yaml
  text: and the hangings of the court[a], and the screen for the entrance of the court that is around the tabernacle and the altar, and its ropes[b], for all its service.
translation:
  language: zh_hans
  text: 院子的帷幔[a]，那环绕帐幕和祭坛的院子的入口门帘，以及它的绳索[b]，供办理其一切事务。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“院子的帘幕”。
    reason: lexical_alternative
  - marker: b
    text: 或译“它的绳子”。
    reason: lexical_alternative
lexical_decisions:
- source_word: קַלְעֵי
  choice: 帷幔
  rationale: 指围成院子四周的织物围幔；“帷幔”既自然庄重，也能与入口处的“门帘”区别开来。
- source_word: חָצֵר
  choice: 院子
  rationale: 指帐幕周围围起来的区域；“院子”是现代普通读者容易理解的表达。
- source_word: מָסַךְ
  choice: 门帘
  rationale: 在帐幕语境中指遮在入口处的织物；“门帘”既交代其材质性质和位置，也避免让人误以为是硬质的门。
- source_word: פֶּתַח
  choice: 入口
  rationale: 表示开口或进入之处；与“门帘”搭配清楚自然。
- source_word: אֲשֶׁר עַל הַמִּשְׁכָּן וְעַל הַמִּזְבֵּחַ סָבִיב
  choice: 环绕帐幕和祭坛的
  rationale: 结合סָבִיב表达院子在空间上围绕帐幕和祭坛；不重复添加第二个“环绕”，符合中文习惯。
- source_word: מִשְׁכָּן
  choice: 帐幕
  rationale: 这是民数记中该圣所的通行中文名称，也保留其作为居所式圣幕的意象。
- source_word: מִזְבֵּחַ
  choice: 祭坛
  rationale: 准确表达献祭所用的坛，是现代中文圣经语境中的标准用语。
- source_word: מֵיתָרָיו
  choice: 它的绳索
  rationale: 保留希伯来文第三人称单数后缀，不在正文中强行判定其所指；“绳索”具体而自然。
- source_word: לְכֹל עֲבֹדָתוֹ
  choice: 与这一切有关的各项事务
  rationale: עֲבֹדָה在本段指受派的管理、搬运和服事等工作；此译法在中文中自然概括其全部相关职责，同时承接前述物件。
theological_decisions:
- issue: מֵיתָרָיו及עֲבֹדָתוֹ中阳性单数后缀的所指
  choice: 用“它的”保留代词，并以“与这一切有关”自然承接整体语境
  alternative: 明确译为“帐幕的绳索及其一切事务”或“院子的绳索及其一切事务”
  rationale: 希伯来文的代词在近邻名词之间存在指代张力；明确指定为帐幕或院子都会超出正文直接提供的信息，因此不作教义性或结构性的强行消歧。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。用“帷幔”与“门帘”区分院子四周的围幔和入口处的遮帘；整体保留本节作为上一节职责清单之延续的并列句式。
