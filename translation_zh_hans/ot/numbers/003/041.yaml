  to: 你要把利未人归给我——我是耶和华——来代替以色列人[a]中所有的长子；又要把利未人的牲畜代替以色列人牲畜中所有头生的牲畜。
  rationale: 修订仅改善现代汉语的自然度与末句指称的完整性。“以色列人”准确表达此处בני以色列的民族整体用法，脚注保留原文的字面措辞；“长子”与“头生的牲畜”分别清楚对应人和牲畜的首生者。未添加任何替代关系之外的神学解释。
