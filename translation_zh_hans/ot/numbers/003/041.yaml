  text: וְ/לָקַחְתָּ֨ אֶת הַ/לְוִיִּ֥ם לִ/י֙ אֲנִ֣י יְהוָ֔ה תַּ֥חַת כָּל בְּכֹ֖ר בִּ/בְנֵ֣י יִשְׂרָאֵ֑ל וְ/אֵת֙ בֶּהֱמַ֣ת הַ/לְוִיִּ֔ם תַּ֣חַת כָּל בְּכ֔וֹר בְּ/בֶהֱמַ֖ת בְּנֵ֥י יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/041.yaml
  text: And you shall take the Levites for me—I am Yahweh—in place of every firstborn among the sons of Israel[a], and the livestock of the Levites in place of every firstborn among the livestock of the sons of Israel.
translation:
  language: zh_hans
  text: 你要把利未人归给我——我是耶和华——来代替以色列人[a]中所有的长子；又要把利未人的牲畜代替以色列人牲畜中所有头生的牲畜。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“以色列众子中”。希伯来文直译为“以色列之子中”。
    reason: 说明בני以色列的字面形式；正文采用现代中文中自然的民族整体称谓。
lexical_decisions:
- source_word: וְלָקַחְתָּ
  choice: 你要将……归
  rationale: 连接词加完成式在本段训令语境中表达对摩西的命令；“你要”保留指令语气，“归”与后面的“我”结合，表达选取并归属的含义。
- source_word: הַלְוִיִּם
  choice: 利未人
  rationale: 采用现代中文圣经及一般读者熟悉的族群名称。
- source_word: לִי
  choice: 归我
  rationale: 此处介词表达归属与奉献；“归我”比生硬的“给我”更符合分别归属上帝的语境。
- source_word: אֲנִי יְהוָה
  choice: 我是耶和华
  rationale: 保留原文独立而强调的自我宣告，并以破折号呈现其插入位置。
- source_word: תַּחַת
  choice: 代替
  rationale: 在头生者被利未人替代的上下文中，该词表示替代关系；“代替”准确而自然。
- source_word: כָּל בְּכֹר
  choice: 一切头生的
  rationale: כָּל与单数名词连用具有逐一涵盖的分配意义；“一切头生的”保留范围，同时不擅自限定为男性或雄性。
- source_word: בִּבְנֵי יִשְׂרָאֵל
  choice: 以色列众子中
  rationale: 较直接地保留בְּנֵי的“众子”措辞及民族称谓结构；脚注说明现代汉语可自然理解为“以色列人中”。
- source_word: בֶּהֱמַת הַלְוִיִּם
  choice: 利未人的牲畜
  rationale: בְּהֵמָה在此泛指家养牲畜；“牲畜”比“牛”范围更准确，也比泛称“动物”更贴合语境。
- source_word: כָּל בְּכוֹר בְּבֶהֱמַת בְּנֵי יִשְׂרָאֵל
  choice: 以色列人的牲畜中一切头生的
  rationale: 保留人与牲畜两部分之间的平行替代结构，并清楚表明所指是以色列人所拥有牲畜中的头生者。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。中文正文采用读者最熟悉、已固定为专名的“耶和华”，而不以“主”这一称号替代，从而保留此处的名字与自我宣告。
- issue: בְּנֵי יִשְׂרָאֵל的译法
  choice: 以色列众子
  alternative: 以色列人
  rationale: 正文保留原文“以色列之子”的男性复数形式，避免无提示地将其平整化；同时脚注交代其民族整体用法和自然中文译法。
- issue: 利未人与头生者之间的关系
  choice: 代替
  alternative: 取代
  rationale: 原文תַּחַת明确表达替代关系；译文只陈述此关系，不进一步加入赎罪、献祭或其他未在本节明说的神学解释。
translation_notes:
  register: 采用现代、庄重而清楚的训令语体。“你要”对应上帝对摩西的直接命令；两个破折号保留“我是耶和华”在句中的强调性插入。人与牲畜两部分尽量维持原文的平行结构。
