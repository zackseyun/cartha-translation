  yaml_path: translation/ot/numbers/003/006.yaml
  text: Bring near the tribe of Levi[a], and set it before Aaron the priest, and they shall serve him.
translation:
  language: zh_hans
  text: 你要把利未支派带到近前来，使他们站在祭司亚伦面前；他们要服事他[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “服事”也可译作“侍候”。希伯来语动词既可指随侍服务，也可指礼仪性的供职。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַקְרֵב
  choice: 带近前来
  rationale: 该词是קרב的使役命令式，意为使某人靠近或把某人带到近前；此译保留其具体的趋近含义，也符合礼仪场景。
- source_word: מַטֵּה לֵוִי
  choice: 利未支派
  rationale: מַטֶּה本义可指杖，在群体和宗族语境中则指支派；这里所指的是利未人的支派。
- source_word: וְהַעֲמַדְתָּ אֹתוֹ
  choice: 使他们站
  rationale: עמד的使役式表示使其站立、安置或派定。希伯来文先以单数代词承接集合名词“支派”，随后改用复数动词；汉语用“他们”自然地表达该支派的成员。
- source_word: לִפְנֵי אַהֲרֹן הַכֹּהֵן
  choice: 在祭司亚伦面前
  rationale: לִפְנֵי直译为“在……面前”，在这里既可表达空间位置，也符合正式呈献或派立的场景。
- source_word: וְשֵׁרְתוּ אֹתוֹ
  choice: 他们要服事他
  rationale: שרת可指侍候、供职或礼仪性的服事；宾语代词最自然地指亚伦，因此保留“服事他”，不弱化为“与他一同服事”。
theological_decisions:
- issue: 利未人服事的对象及性质
  choice: 译作“他们要服事他”，表明利未人在祭司亚伦的职分中为他服役。
  alternative: 译作“他们要与他一同供职”。
  rationale: 希伯来文וְשֵׁרְתוּ אֹתוֹ带有直接宾语“他”，最自然的先行词是亚伦。译文保留这一从属服务关系，同时不进一步限定具体职责。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“带近前来”保留原文的具体动作感；以“他们”承接集合意义的“利未支派”，符合现代汉语习惯。脚注标记置于其实际说明的“服事他”之后。
