  text: And the chief over the chiefs of the Levites was Eleazar son of Aaron the priest, having oversight of those who kept charge of the sanctuary.
translation:
  language: zh_hans
  text: 利未人各首领的首领是祭司亚伦的儿子以利亚撒；他负责监管那些看守圣所[a]的人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“圣物”。希伯来语 הַקֹּדֶשׁ 既可指圣所本身，也可指与圣所有关的神圣物件。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּנְשִׂיא נְשִׂיאֵי הַלֵּוִי
  choice: 利未人众首领的首领
  rationale: נָשִׂיא在此指有行政职责的首领，并无必须译作君王或王子的含义；保留希伯来文“首领的首领”这一层级表达，显示以利亚撒居于利未人各首领之上。句首连接词按现代汉语叙事习惯不另译。
- source_word: אֶלְעָזָר בֶּן אַהֲרֹן הַכֹּהֵן
  choice: 祭司亚伦的儿子以利亚撒
  rationale: 按自然汉语调整亲属关系和同位修饰语的次序；定冠结构中的“祭司”修饰亚伦。人名依通行圣经译名处理。
- source_word: פְּקֻדַּת
  choice: 负责督察
  rationale: 该词可表示监管、职责或委任；此处表明以利亚撒对执行守护职责者负有监督责任。用动词性表达使现代汉语通顺，同时保留行政管理含义。
- source_word: שֹׁמְרֵי מִשְׁמֶרֶת
  choice: 那些看守……的人
  rationale: 分词与同根名词连用，强调受托履行看守职责。汉语用“看守……的人”自然呈现其持续职责，避免生硬重复“守守职”。
- source_word: הַקֹּדֶשׁ
  choice: 圣所
  rationale: 在会幕语境中可指神圣的场所，也可指其中的圣物；正文采用较符合整体场景且自然的“圣所”，并以脚注保留“圣物”的真实词义可能。
