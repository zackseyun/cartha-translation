  text: 亚伦儿子的名字如下：长子拿答、亚比户、以利亚撒和以他玛。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: 如下
  rationale: 此处引出后面的名单；结合“名字”译为“名字如下”，既表达指示作用，也符合现代汉语习惯。句首连接词不必机械译出。
- source_word: שְׁמוֹת בְּנֵי אַהֲרֹן
  choice: 亚伦儿子的名字
  rationale: 按希伯来语连属结构直译其关系，同时采用自然、清楚的现代汉语表达。
- source_word: הַבְּכֹר
  choice: 长子
  rationale: 该词表示出生次序上的头生者；“长子”在此比“最年长的”更准确简洁，并按原文次序置于拿答之前。
- source_word: נָדָב
  choice: 拿答
  rationale: 采用中文圣经传统中通行的人名音译。
- source_word: וַאֲבִיהוּא
  choice: 亚比户
  rationale: 采用中文圣经传统中通行的人名音译；并列关系由中文顿号表达。
- source_word: אֶלְעָזָר
  choice: 以利亚撒
  rationale: 采用中文圣经传统中通行的人名音译。
- source_word: וְאִיתָמָר
  choice: 和以他玛
  rationale: 采用中文圣经传统中通行的人名音译，并保留名单末项前的连接关系。
