  text: קַ֣ח אֶת הַ/לְוִיִּ֗ם תַּ֤חַת כָּל בְּכוֹר֙ בִּ/בְנֵ֣י יִשְׂרָאֵ֔ל וְ/אֶת בֶּהֱמַ֥ת הַ/לְוִיִּ֖ם תַּ֣חַת בְּהֶמְתָּ֑/ם וְ/הָיוּ לִ֥/י הַ/לְוִיִּ֖ם אֲנִ֥י יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/045.yaml
  text: Take the Levites in place of every firstborn among the sons of Israel[a], and the livestock of the Levites in place of their livestock; and the Levites shall be mine[c][b]. I am Yahweh.
translation:
  language: zh_hans
  text: 你要取利未人代替以色列人中一切头生的[a]，取利未人的牲畜代替他们的牲畜。利未人要归我。我是雅威[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译“以色列众子中一切头生的”。
    reason: lexical_alternative
  - marker: b
    text: “雅威”原文为神名“YHWH”（יהוה）；传统也译作“耶和华”或“上主”。
    reason: alternative_reading
lexical_decisions:
- source_word: קַח
  choice: 取
  rationale: 该命令在此要求摩西选取并指定利未人作为替代者；“取”简洁地保留原文动作和命令语气。
- source_word: הַלְוִיִּם
  choice: 利未人
  rationale: 采用现代中文圣经传统中通行的族群名称。
- source_word: תַּחַת
  choice: 代替
  rationale: 上下文谈的是归属上的替换，而非空间上的“在……下面”；“代替”准确传达替代关系。
- source_word: כָּל בְּכוֹר
  choice: 一切头生的
  rationale: 保留כָּל与单数בְּכוֹר所表达的总体兼逐一涵盖之意；“头生的”也保留原文未在此明说“男子”的形式。
- source_word: בִּבְנֵי יִשְׂרָאֵל
  choice: 以色列人中
  rationale: ב在此为范围义；现代中文用“以色列人中”自然表达，脚注补明原文字面为“以色列众子中”。
- source_word: בֶּהֱמַת הַלְוִיִּם
  choice: 利未人的牲畜
  rationale: בְּהֵמָה在此集合性地指家养牲畜；“牲畜”比泛称“动物”更切合语境。
- source_word: בְּהֶמְתָּם
  choice: 他们的牲畜
  rationale: 保留第三人称复数后缀及与前半句平行的替代结构；其所指由上下文确定为以色列人的牲畜。
- source_word: וְהָיוּ לִי
  choice: 要归我
  rationale: 表达归属关系；“归我”在现代中文中自然、庄重，也保留圣约性拥有的意味。
- source_word: אֲנִי יְהוָה
  choice: 我是雅威
  rationale: 直接音译神名יהוה，并保留原文用于确认命令权威的自我宣告形式。
theological_decisions:
- issue: 利未人替代头生者的性质
  choice: 用“代替”明确表达替换关系
  alternative: 译作空间性的“在……之下”
  rationale: 本章数点和赎回头生者的语境，以及两次תַּחַת的平行用法，都表明这里是代表性替代；译文不进一步界定其神学机制。
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华／上主
  rationale: 原文明确使用四字神名；正文采用较能反映学界通常复原读音的“雅威”，同时在脚注交代希伯来字母形式及传统译法。
translation_notes:
  register: 采用现代、庄重而易懂的普通话书面语。保留两组“代替”的平行结构，并将神的归属宣告与自我宣告分句，以避免中文歧义。
