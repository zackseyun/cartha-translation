base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/030.yaml
  text: And the chief of the ancestral house of the families of the Kohathites was Elizaphan the son of Uzziel[a][b].
translation:
  language: zh_hans
  text: 哥辖人各家族的父系宗族[b]首领[a]，是乌薛的儿子以利撒反。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “首领”也可译作“领袖”或“族长”；希伯来语为נָשִׂיא。
    reason: lexical_alternative
  - marker: b
    text: 希伯来语字面为“父亲的家”，是指按父系血缘组成的宗族单位。
    reason: cultural_note
lexical_decisions:
- source_word: וּ/נְשִׂיא
  choice: 首领
  rationale: נָשִׂיא在本节的支派行政语境中指具有公认权柄的负责人；“首领”自然、庄重，又不暗示君王身份。句首的ו在连续名录中主要起衔接作用，中文不另译，以免行文生硬。
- source_word: בֵית אָב
  choice: 父系宗族
  rationale: 字面为“父亲的家”，实际指按父系血缘组织的宗族单位。“父系宗族”既传达古代以色列的亲属结构，也比直译“父家”更易为现代读者理解。
- source_word: לְמִשְׁפְּחֹת
  choice: 各家族的
  rationale: מִשְׁפָּחוֹת指多个家族或氏族群体；译作“各家族的”，保留它与较高层级的בֵית אָב之间的群体结构，同时符合现代汉语表达。
- source_word: הַקְּהָתִי
  choice: 哥辖人
  rationale: 带冠词的单数族称在此作集合用法，指哥辖的后裔群体；“哥辖人”简洁清楚。
- source_word: אֶלִיצָפָן
  choice: 以利撒反
  rationale: 按现代中文圣经人名的通行形式音译。
- source_word: בֶּן עֻזִּיאֵל
  choice: 乌薛的儿子
  rationale: 忠实表达常见的父子谱系格式，并采用中文自然语序。
