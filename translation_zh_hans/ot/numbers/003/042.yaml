  text: וַ/יִּפְקֹ֣ד מֹשֶׁ֔ה כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֹת֑/וֹ אֶֽת כָּל בְּכֹ֖ר בִּ/בְנֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/042.yaml
  text: So Moses counted every firstborn among the sons of Israel[a], just as Yahweh had commanded him.
translation:
  language: zh_hans
  text: 摩西照耶和华所吩咐他的，数点了以色列子孙中所有的长子[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “长子”直译为“头生的”；本节所指的是以色列子孙中头生的男性。
    reason: 说明בכור的字面意义及其在上下文中的指称范围，避免把“长子”误解为只强调家庭排行。
lexical_decisions:
- source_word: וַיִּפְקֹד
  choice: 数点了
  rationale: 在人口统计的语境中，פקד指逐一清点、登记人数；“数点”既准确，也符合现代中文圣经叙事的庄重语体。
- source_word: כַּאֲשֶׁר
  choice: 照……的
  rationale: 表达摩西的行动与上主命令相符；中文用“照……的”自然体现依照之意。
- source_word: צִוָּה
  choice: 吩咐
  rationale: 在上主向摩西下达命令的语境中，“吩咐”自然、庄重，并保留权威意味。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文读者最熟悉的四字神名音译，明确呈现专名，而不以“主”等称号替代。
- source_word: אֹתוֹ
  choice: 他
  rationale: 宾格代词所指为摩西，即领受命令的人。
- source_word: אֶת כָּל־בְּכֹר
  choice: 所有的长子
  rationale: כָּל表达全体范围，בְּכוֹר在本段人口统计中指头生者；“所有的长子”是自然中文，并未在正文另加原句没有明说的“男子”。
- source_word: בִּבְנֵי יִשְׂרָאֵל
  choice: 以色列子孙中
  rationale: 前缀ב在此表示统计对象所在的群体；“以色列子孙”保留בני־ישראל的亲属群体表达，也可自然指以色列民族。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用四字神名，应以专名呈现而非改作称号；“耶和华”是现代简体中文中通行且易懂的音译，同时不掩盖这是神的名字。
- issue: בְּנֵי יִשְׂרָאֵל 的群体称谓
  choice: 以色列子孙
  alternative: 以色列人
  rationale: “以色列子孙”较贴近原文的亲属称谓，又能在中文中涵盖作为整体的民族群体；脚注说明也可译成更简洁的民族称谓。
- issue: בְּכֹר 是否明加男性限定
  choice: 长子
  alternative: 头生的男子
  rationale: 本段上下文明确涉及头生的男性，但本节本身没有另列“男性”一词；“长子”自然表达所指，同时避免在形式上增添独立限定语。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“摩西就……”承接叙事，“照耶和华吩咐他的”保持原文语序与命令先于执行的关系；全句简洁，适合公开诵读。
