  text: וַ/אֲנִ֞י הִנֵּ֧ה לָקַ֣חְתִּי אֶת הַ/לְוִיִּ֗ם מִ/תּוֹךְ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל תַּ֧חַת כָּל בְּכ֛וֹר פֶּ֥טֶר רֶ֖חֶם מִ/בְּנֵ֣י יִשְׂרָאֵ֑ל וְ/הָ֥יוּ לִ֖/י הַ/לְוִיִּֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/012.yaml
  text: And I—behold[a], I have taken the Levites from among the sons of Israel in place of every firstborn that opens the womb among the sons of Israel, and the Levites shall be mine.
translation:
  language: zh_hans
  text: “至于我，看哪，我已经从以色列子民[a]中取了利未人，代替以色列子民中每一个头生的、开母腹的；利未人要归我。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “以色列子民”原文直译为“以色列的众子”，是希伯来语中公式化的称谓，也可译作“以色列人”。
    reason: 说明原文的字面性别形式及自然中文译法；标记置于首次出现处，适用于本节两次相同的希伯来表达。
lexical_decisions:
- source_word: וַאֲנִי
  choice: 至于我
  rationale: 保留连词和显明的第一人称代词所形成的强调与话题转换；现代汉语用“至于我”比直译“而我”更自然。
- source_word: הִנֵּה
  choice: 看哪
  rationale: 保留希伯来语提示注意并加强语气的功能，也符合庄重的神圣宣告语境。
- source_word: לָקַחְתִּי
  choice: 我已经……选取了
  rationale: 完成式在这里表示已经实行、现今仍然有效的行动；“选取”也传达从一个群体中取出来的语境意义。
- source_word: הַלְוִיִּם
  choice: 利未人
  rationale: 采用现代中文圣经及一般宗教语境中通行的族群名称。
- source_word: מִתּוֹךְ
  choice: 从……中
  rationale: 自然表达从较大群体内部选取的意思。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列子民
  rationale: 既保留这一约定俗成的群体称谓所带的“子民”色彩，又避免生硬的逐字表达；其字面形式在脚注说明。
- source_word: תַּחַת
  choice: 代替
  rationale: 清楚表达本节礼仪与法律语境中的替代关系。
- source_word: כָּל בְּכוֹר פֶּטֶר רֶחֶם
  choice: 所有头生、初开母腹的
  rationale: “头生”表达长子或首生者的法定类别，“初开母腹”保留希伯来语的具体习语；两部分共同限定所指对象。
- source_word: וְהָיוּ לִי
  choice: 利未人要归我
  rationale: 简洁表达归属与分别为圣的结果，同时不额外引入后来的神学术语。
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל 的性别与公式化表达
  choice: 以色列子民
  alternative: 以色列众子；以色列人
  rationale: 原文形式为阳性复数且属于公式化称谓。正文以自然、庄重的“以色列子民”表达整体族群，脚注保留其字面形式，避免把语法形式误解为本节只谈成年男性。
- issue: וְהָיוּ לִי 所表达的利未人与上帝的关系
  choice: 利未人要归我
  alternative: 利未人要属于我
  rationale: 直接保留上帝对利未人的归属宣告及其奉献语境，但不添加经文本身未明说的后设神学范畴。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“看哪”刻意保留原文庄严的提示语气；“头生、初开母腹的”保留礼仪法律用语的具体性。脚注标记置于该词组首次出现处，并适用于本节两次相同的希伯来表达。
