base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/001.yaml
  text: These are the generations of Aaron and Moses at the time when Yahweh spoke with Moses on Mount Sinai[a][b][c].
translation:
  language: zh_hans
  text: 当耶和华在西奈山对摩西说话的时候[b][c]，以下是亚伦和摩西的世系[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “世系”也可译作“世代”或“家系”。希伯来文在这里使用一种常见的标题格式，可以引出一个人的家系，也可以引出由他而出的事物。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译“在……的日子”，是表示“当……的时候”的习语。
    reason: lexical_alternative
  - marker: c
    text: “对摩西说话”也可译作“与摩西说话”。
    reason: alternative_reading
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: 以下是
  rationale: 作为新段落的指示性开头，“以下是”在现代汉语中自然，并保留希伯来文引出下文的结构作用；连接词不必机械译出。
- source_word: תּוֹלְדֹת
  choice: 后代
  rationale: 此处用作家系标题，下文列出亚伦的儿子；“后代”比“世代”更符合现代汉语，但脚注保留“世代／家谱”等可能含义，并不消除标题同时提到亚伦和摩西所形成的张力。
- source_word: אַהֲרֹן וּמֹשֶׁה
  choice: 亚伦和摩西
  rationale: 按现代中文圣经通行音译保留两个人名；原文明确同时列出二人，即使下文主要记述亚伦的儿子，也不在译文中删改。
- source_word: בְּיוֹם
  choice: 在……的时候
  rationale: 字面为“在……的日子”，这里是时间习语，表示“当……的时候”；采用自然现代汉语表达。
- source_word: דִּבֶּר ... אֶת־מֹשֶׁה
  choice: 与摩西说话
  rationale: דבר 与 אֵת 加人名可表达“与某人说话”，同时“对摩西说话”也合乎语法，故以后者列为脚注异译。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代简体中文中广为人知的专名形式音译四字神名，不用“主”这一称号替代。
- source_word: בְּהַר סִינָי
  choice: 在西奈山
  rationale: 采用现代汉语自然的地点表达和通行地名译法。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用神的专名而非称号；中文正文采用读者最熟悉且明确为专名的“耶和华”，不以“主”代替。
- issue: 同时以亚伦和摩西为所属者的 תּוֹלְדֹת
  choice: 保留“亚伦和摩西的后代”这一双重归属
  alternative: 亚伦和摩西的世代／家谱
  rationale: 下文主要列亚伦众子，但原文标题明确同时提到亚伦和摩西；译文不擅自删去摩西，也不另加解释来化解这一张力。
- issue: דִּבֶּר ... אֶת־מֹשֶׁה 的关系表达
  choice: 与摩西说话
  alternative: 对摩西说话
  rationale: 原结构容许“与”或“对”的理解；正文选“与”，脚注保留“对”，避免把可存的语义差异绝对化。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“以下是”标明新段落的标题性质；正文避免生硬的“在……之日”，同时用脚注交代原文形式。所有脚注标记均置于正文相应位置。
