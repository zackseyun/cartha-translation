base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/039.yaml
  text: All those counted of the Levites[a], whom Moses and Aaron counted at the command of Yahweh, by their clans, every male from a month old and upward, were twenty-two thousand.
translation:
  language: zh_hans
  text: 摩西和亚伦[b]奉雅威的吩咐[a]，按宗族所数点的利未人，即所有满一个月及以上的男性，共二万二千人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语直译为“照雅威的口”，是“照雅威的吩咐”的惯用表达。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文本在“亚伦”一名上标有异常点号；这些点号的确切含义不确定。
    reason: textual_feature
lexical_decisions:
- source_word: פְּקוּדֵי / פָּקַד
  choice: 被数点的／数点
  rationale: 这里指人口统计中的登记和计数。“数点”保留同一词根的呼应，也不引入军事召集的含义。
- source_word: הַלְוִיִּם
  choice: 利未人
  rationale: 采用现代中文圣经传统中通行的族群名称。
- source_word: עַל־פִּי יְהוָה
  choice: 照雅威的吩咐
  rationale: 希伯来语直译为“照雅威的口”，是表示奉命或遵照命令的惯用语；正文采用自然中文，脚注保留其字面形象。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以音译呈现四字神名，保留原文所用的专名，而不以称号替代。
- source_word: לְמִשְׁפְּחֹתָם
  choice: 按宗族
  rationale: 在人口统计语境中，该词所指的亲属群体通常大于现代核心家庭；“宗族”较准确。
- source_word: כָּל זָכָר
  choice: 所有……男性
  rationale: 原文明指男性，译文如实保留这一人口统计范围。
- source_word: מִבֶּן־חֹדֶשׁ וָמַעְלָה
  choice: 满一个月及以上
  rationale: 自然表达原文的年龄下限，同时保留“及以上”的范围。
- source_word: שְׁנַיִם וְעֶשְׂרִים אָלֶף
  choice: 二万二千人
  rationale: 直接、清楚地表达原文数字；补出量词“人”符合现代汉语。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华／主
  rationale: 原文直接使用四字神名；正文以“雅威”音译，既与称号“主”区分，也不把后起的混合读音当作原始发音。
- issue: “亚伦”上方异常点号的处理
  choice: 正文保留“亚伦”，并以脚注说明抄本现象
  alternative: 不作说明，或因点号而删去“亚伦”
  rationale: 马所拉文本正文确有“亚伦”，但其上标有异常点号；点号的确切意图不明，不宜据此擅自删除，故保留正文并披露文本现象。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。“数点”契合民数记的人口统计语境，并使 פְּקוּדֵי 与 פָּקַד 的词根呼应在中文中可见。句子大体保留希伯来语先述统计对象、后报总数的结构，但用现代汉语连接成分避免生硬。脚注标记均置于其实际所说明的词语或短语之后。
