base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/021.yaml
  text: To Gershon belonged the clan of the Libnites and the clan of the Shimeites; these are the clans of the Gershonites.
translation:
  language: zh_hans
  text: 属革顺的有立尼族和示每族；这些就是革顺人的各族。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְגֵרְשׁוֹן
  choice: 属革顺的有
  rationale: 前缀 לְ 在此人口统计式名录中表示归属关系；译为“属革顺的有”既贴合希伯来文结构，也符合现代汉语表达。
- source_word: מִשְׁפַּחַת
  choice: 族
  rationale: מִשְׁפָּחָה 在宗族和人口统计语境中指支派以下的亲族群体。“族”比“家庭”范围更准确，也避免与以色列的“支派”混淆。
- source_word: הַלִּבְנִי
  choice: 立尼族
  rationale: 该族称形式指立尼的后裔群体；汉语以“立尼族”简洁表达其宗族身份。
- source_word: וּמִשְׁפַּחַת הַשִּׁמְעִי
  choice: 和示每族
  rationale: 连接词引出与前项并列的第二个宗族，即示每后裔所成的族。
- source_word: אֵלֶּה הֵם
  choice: 这些就是
  rationale: 保留原文用于确认身份的标准公式，并以“就是”自然呈现其指认语气。
- source_word: מִשְׁפְּחֹת
  choice: 各族
  rationale: 复数形式译为“各族”，既与前文两个具体宗族呼应，也清楚表达复数。
- source_word: הַגֵּרְשֻׁנִּי
  choice: 革顺人
  rationale: 该族称指革顺后裔构成的利未人分支；译作“革顺人”自然、清楚，并保留群体身份。
