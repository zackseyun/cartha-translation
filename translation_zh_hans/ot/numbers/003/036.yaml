  yaml_path: translation/ot/numbers/003/036.yaml
  text: And the appointed duty of the sons of Merari was the frames of the tabernacle[a], its bars, its pillars, its bases, all its furnishings[c][b], and all its service.
translation:
  language: zh_hans
  text: 米拉利子孙所负责的职责是：帐幕的框架[a]、横闩、柱子、底座[b]和一切器具，以及与这一切有关的所有工作[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “框架”或译“木板”。
    reason: lexical_alternative
  - marker: b
    text: “底座”或译“座”“承座”；指承托或供柱子、框架嵌入的基座。
    reason: lexical_alternative
  - marker: c
    text: 直译“它的一切工作（或服役）”。“它”可指帐幕，也可概括指前述构件和器具。
    reason: source_ambiguity
lexical_decisions:
- source_word: פְקֻדַּת מִשְׁמֶרֶת
  choice: 受派看守的是
  rationale: 这两个名词连用，表示受委派、受托承担的看守责任。译文用现代汉语自然表达其正式指派和实际职责。
- source_word: בְּנֵי מְרָרִי
  choice: 米拉利子孙
  rationale: 保留希伯来文“米拉利的众子”的家族表达，同时符合中文圣经叙事的常用称谓。
- source_word: קַרְשֵׁי הַמִּשְׁכָּן
  choice: 帐幕的框架
  rationale: קֶרֶשׁ指构成帐幕结构的直立木构件；“框架”突出其结构功能，“木板”则作为脚注中的可能译法保留。
- source_word: בְרִיחָיו
  choice: 横闩
  rationale: 这些构件用于连接、固定帐幕框架；“横闩”比笼统的“闩”更清楚，又未过度解释具体形制。
- source_word: עַמֻּדָיו
  choice: 柱子
  rationale: 该词指直立的支撑构件；“柱子”自然、清楚，并适合建筑语境。
- source_word: אֲדָנָיו
  choice: 底座
  rationale: 该词指承托或嵌入柱、框架的基础构件。“底座”便于现代读者理解，同时以脚注保留更具技术意味的“卯座”。
- source_word: כָל־כֵּלָיו
  choice: 一切器具
  rationale: כְּלִי可泛指器物、用具或装备。“器具”保持其范围较宽，不把它限定为家具或小型器皿。
- source_word: כֹל עֲבֹדָתוֹ
  choice: 一切相关的工作
  rationale: עֲבֹדָה可指工作、劳务或服役；此处概括围绕所列构件与器具承担的全部事务。“相关的”自然表达希伯来文所有格所体现的关联，同时在脚注说明其字面形式。
- source_word: הַמִּשְׁכָּן
  choice: 帐幕
  rationale: 在此祭祀建筑语境中，这是该词的固定所指；“帐幕”准确、简明，也保留其可迁移圣所的性质。
