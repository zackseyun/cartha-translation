base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/021.yaml
  text: and their grain offerings and their drink offerings for the bulls[a], for the rams, and for the lambs, according to their number, according to the ordinance;
translation:
  language: zh_hans
  text: 并要为公牛、公羊和羊羔，按各自的数目，照定例[a]献上相应的素祭和奠祭。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “定例”或译“规定的礼仪”。希伯来词在这里指献这些祭物时所遵循的既定规范。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִנְחָתָם
  choice: 相应的素祭
  rationale: מִנְחָה在献祭语境中指与燔祭牲一同献上的素祭；中文以“素祭”准确保留礼仪术语。第三人称复数后缀通过“相应的”表达，指与所列祭牲配套的祭物。
- source_word: נִסְכֵּיהֶם
  choice: 相应的奠祭
  rationale: נֶסֶךְ指浇奠的液体祭物；“奠祭”是清楚、庄重且符合献祭语境的现代中文表达。
- source_word: לַפָּרִים
  choice: 为公牛
  rationale: פָּרִים在献祭清单中指公牛；原文未另加“幼小”之意，故不译作“牛犊”。
- source_word: לָאֵילִם
  choice: 为公绵羊
  rationale: אַיִל在献祭语境中明确指成年的公绵羊；“公绵羊”比单说“公羊”更能避免物种含混。
- source_word: וְלַכְּבָשִׂים
  choice: 和羊羔
  rationale: כֶּבֶשׂ指羊羔；本句无须额外明说性别，以免过度限定。
- source_word: בְּמִסְפָּרָם
  choice: 按各自的数目
  rationale: 该短语表示配套祭物须与各类祭牲规定的数量相称；“各自”自然呈现复数后缀所指的分类对应关系。
- source_word: כַּמִּשְׁפָּט
  choice: 照定例
  rationale: מִשְׁפָּט在这里指既定的献祭规范或礼仪规程；“定例”兼具法定性与礼仪语境所需的正式感。
theological_decisions: []
