  yaml_path: translation/ot/numbers/029/009.yaml
  text: 'and their grain offering: fine flour mixed with oil[a], three-tenths for the bull, two-tenths for the one ram,'
translation:
  language: zh_hans
  text: 素祭是调油的细面[a]：为那头公牛用三份伊法十分之一，为那一只公绵羊用两份伊法十分之一；
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “三份伊法十分之一”和“两份伊法十分之一”分别指三个和两个“伊法的十分之一”计量单位。
    reason: cultural_note
lexical_decisions:
- source_word: וּמִנְחָתָם
  choice: 素祭
  rationale: 在献祭语境中，מִנְחָה指随燔祭牲一同献上的谷物祭；采用现代中文圣经语体中简洁而明确的“素祭”。希伯来语第三人称复数后缀关联上文诸祭牲，中文依语境不硬译“它们的”。
- source_word: סֹלֶת
  choice: 细面
  rationale: 指献祭所用的优质精磨面粉；“细面”准确、庄重，也符合中文祭祀法规语境。
- source_word: בְּלוּלָה בַשָּׁמֶן
  choice: 调油的
  rationale: 被动分词表示面粉与油混合；“调油的”自然简练，并保留制备方式。
- source_word: שְׁלֹשָׁה עֶשְׂרֹנִים
  choice: 三伊法十分之一
  rationale: עִשָּׂרוֹן是“十分之一量”，传统上理解为一伊法的十分之一。此处数量为三个这样的单位，译法避免把它误读成一个整体的十分之三。
- source_word: לַפָּר
  choice: 为那头公牛
  rationale: 带定冠词的单数名词指上文已经列出的公牛；“那头”自然体现其特指性。
- source_word: שְׁנֵי עֶשְׂרֹנִים
  choice: 两伊法十分之一
  rationale: 表示两个“伊法十分之一”的计量单位；明列单位，使现代读者能准确理解。
- source_word: לָאַיִל הָאֶחָד
  choice: 为那一只公绵羊
  rationale: 定冠词与אֶחָד共同强调所列的一只公绵羊；“那一只”保留特指和数量信息。
