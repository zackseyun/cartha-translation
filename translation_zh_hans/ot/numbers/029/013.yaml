base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/013.yaml
  text: 'And you shall present a burnt offering[a], an offering by fire, a pleasing aroma to Yahweh: thirteen bulls from the herd, two rams, and fourteen male lambs a year old; they shall be without blemish.'
translation:
  language: zh_hans
  text: 你们要献上燔祭——献给雅威、蒙悦纳的馨香火祭[a]：公牛十三头，公绵羊两只，一岁的公羊羔十四只；都要无残疾。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“怡人的香气”或“馨香之气”。希伯来语“רֵיחַ נִיחֹחַ”是献祭用语，表示祭物蒙雅威悦纳。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרַבְתֶּם
  choice: 你们要献上
  rationale: 该词是קרב的使役式，在献祭语境中指把祭物呈献出来；“献上”自然、明确，也保留礼仪含义。
- source_word: עֹלָה
  choice: 燔祭
  rationale: 这是整只焚烧之祭的固定祭祀术语；“燔祭”在现代中文圣经语境中简洁且易于辨认。
- source_word: אִשֵּׁה
  choice: 火祭
  rationale: 指借着火献上的祭物；“火祭”简明地保留原文与火有关的祭祀类别。
- source_word: רֵיחַ נִיחֹחַ
  choice: 蒙悦纳的馨香
  rationale: 原文惯用语既有“香气”的具体意象，也表达祭物为神所接纳、喜悦；此译兼顾意象与语用含义。
- source_word: לַיהוָה
  choice: 献给雅威的
  rationale: 按原文直接保留圣约之名יהוה，并用“献给”明确它与祭物及馨香的关系。
- source_word: פָּרִים בְּנֵי בָקָר
  choice: 公牛
  rationale: 短语指牛群中的公牛；中文“公牛”已自然表达牲畜种类和性别，无须生硬直译为“牛群之子”。
- source_word: אֵילִם
  choice: 公绵羊
  rationale: 准确表达成年雄性绵羊，并与下文一岁的公羊羔区分。
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה
  choice: 一岁的公羊羔
  rationale: כְּבָשִׂים为阳性羊羔，בְּנֵי שָׁנָה说明年龄；译文保留性别和年龄信息。
- source_word: תְּמִימִם
  choice: 没有残疾
  rationale: 在献祭语境中表示祭牲没有身体缺陷；“没有残疾”是清楚自然的现代中文表达。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文明确使用四字神名；“雅威”直接音译该圣约之名，而不以称号替代。
- issue: רֵיחַ נִיחֹחַ所表达的神学含义
  choice: 蒙悦纳的馨香
  alternative: 怡人的香气；馨香之气
  rationale: 保留香气意象，同时表明这是祭物蒙神接纳的惯用表达，避免把经文缩减为仅仅描述嗅觉感受。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。祭祀术语使用读者较熟悉的“燔祭”“火祭”，牲畜名称则用明确的现代说法。脚注标记置于其实际说明的“蒙悦纳的馨香”之后。
