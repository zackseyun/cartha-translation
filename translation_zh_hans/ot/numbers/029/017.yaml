  yaml_path: translation/ot/numbers/029/017.yaml
  text: 'And on the second day: twelve bulls from the herd[a], two rams, and fourteen one-year-old lambs without blemish,'
translation:
  language: zh_hans
  text: 第二天：公牛十二头，公绵羊两只，没有残疾的十四只一岁羔羊。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/בַ/יּוֹם הַ/שֵּׁנִי
  choice: 第二天
  rationale: 该短语承接节期献祭日程，现代汉语用“第二天”即可自然表达顺序；希伯来语连词的承接作用可由上下文体现。
- source_word: פָּרִים בְּנֵי בָקָר
  choice: 公牛
  rationale: פָּרִים在献祭语境中指公牛；בְּנֵי בָקָר是说明其属牛类的惯用语。汉语“公牛”已清楚传达类别，无须生硬直译为“牛群之子”。
- source_word: שְׁנֵים עָשָׂר
  choice: 十二头
  rationale: 数字修饰公牛，并按现代汉语习惯使用量词“头”。
- source_word: אֵילִם שְׁנָיִם
  choice: 公绵羊两只
  rationale: אֵילִם特指成年雄性绵羊；译作“公绵羊”比单说“公羊”更明确，并使用自然量词“只”。
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה
  choice: 一岁的小公羊
  rationale: כְּבָשִׂים在祭牲清单中指羔羊，בְּנֵי שָׁנָה表示一岁；结合希伯来语阳性复数及祭牲语境，译为“一岁的小公羊”，既与成年公绵羊区分，也自然明晰。
- source_word: אַרְבָּעָה עָשָׂר
  choice: 十四只
  rationale: 数字修饰小公羊，并采用现代汉语量词“只”。
- source_word: תְּמִימִם
  choice: 都要没有残疾
  rationale: 在献祭律例中，该词指祭牲完整、无缺陷；“没有残疾”准确而通俗，“都要”清楚表明此要求适用于所列祭牲。
