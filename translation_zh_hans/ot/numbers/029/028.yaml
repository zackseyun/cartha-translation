  text: and one male goat for a sin offering[b][a], besides the regular burnt offering and its grain offering and its drink offering.
translation:
  language: zh_hans
  text: 除常献的燔祭及其素祭和奠祭以外，又要献一只公山羊作赎罪祭。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/שְׂעִיר חַטָּאת אֶחָד
  choice: 又要献一只公山羊作赎罪祭
  rationale: שָׂעִיר特指公山羊，אֶחָד明确数量为一；在祭祀语境中，חַטָּאת指赎罪祭。句首ו承接前面的祭物清单，译作“又要献”符合现代汉语表达。
- source_word: מִ/לְּ/בַד
  choice: 在……以外
  rationale: 该介词结构说明本节所列祭物是在常献祭物之外另加的；“在……以外”既保留附加关系，也自然清楚。
- source_word: עֹלַת הַ/תָּמִיד
  choice: 常献的燔祭
  rationale: עֹלָה是全烧的祭，按通行且准确的礼仪用语译为“燔祭”；תָּמִיד表示持续、定期献上的性质，译作“常献的”，不额外限定为每日。
- source_word: וּ/מִנְחָתָ/הּ
  choice: 以及同献的素祭
  rationale: 祭祀清单中的מִנְחָה指谷物祭，采用现代中文圣经语境中简洁通行的“素祭”。阴性单数后缀回指燔祭；汉语用“同献的”自然表达其从属关系。
- source_word: וְ/נִסְכָּ/הּ
  choice: 和奠祭
  rationale: נֶסֶךְ指浇奠的酒祭，译作“奠祭”准确而简洁。后缀同样回指燔祭，其关系由前面的“同献的”统摄，避免汉语重复累赘。
