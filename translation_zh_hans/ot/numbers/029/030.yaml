  yaml_path: translation/ot/numbers/029/030.yaml
  text: and their grain offering and their drink offerings for the bulls[a], for the rams, and for the lambs, according to their number, according to the ordinance.
translation:
  language: zh_hans
  text: 又要按它们的数目，照规定[a]，为公牛、公羊和羔羊献上素祭和奠祭。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“照规定的方式”。希伯来语在此指献这些祭物时所遵守的既定规范。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִנְחָתָם
  choice: 与……相配的素祭
  rationale: מִנְחָה在献祭语境中特指以谷物为内容的祭物，汉语传统且准确的对应是“素祭”；单数形式在此具有集合意义。结合后面的牲畜清单，译为“与……相配”自然表达其伴随关系。
- source_word: נִסְכֵּיהֶם
  choice: 奠祭
  rationale: נֶסֶךְ指浇奠的饮料祭；“奠祭”是简明、庄重且具有祭祀专义的现代汉语表达。原文复数意义可由列举的多只牲畜及上下文体现。
- source_word: לַפָּרִים
  choice: 公牛
  rationale: פַּר在献祭清单中指公牛；原文未明确强调年龄，因此不增译“幼”。
- source_word: לָאֵילִם
  choice: 公绵羊
  rationale: אַיִל在献祭语境中明确指成年公绵羊；译作“公绵羊”可避免普通读者把“公羊”理解为泛指雄性山羊或绵羊。
- source_word: וְלַכְּבָשִׂים
  choice: 和羊羔
  rationale: כֶּבֶשׂ指羊羔，献祭语境中常为雄性，但本节词形本身无需在汉语中额外明说性别。
- source_word: בְּמִסְפָּרָם
  choice: 按着它们的数目
  rationale: 该短语表示配套祭物要与所列牲畜规定的数量相对应；“按着它们的数目”保留原文程序性表达。
- source_word: כַּמִּשְׁפָּט
  choice: 照规定
  rationale: מִשְׁפָּט在此不是司法判决，而是既定的礼仪规范或办理方式；“照规定”自然地保留其法律和程序含义。
theological_decisions:
- issue: כַּמִּשְׁפָּט是指法定规范还是规定的献法
  choice: 正文译为“照规定”，不限定为单纯的条例文本或操作方式
  alternative: 照规定的方式；照条例
  rationale: 希伯来语在此可兼指既定规范及按规范而行的方式；正文保留这种语义宽度，并以脚注说明。
translation_notes:
  register: 采用现代、庄重而易懂的祭祀用语。“素祭”“奠祭”保持民数记献祭体系中的术语一致性；调整希伯来语所有格结构为“与……相配”，避免汉语中“它们的素祭”可能造成祭牲拥有祭物的误解。脚注标记[a]已置于正文对应位置。
