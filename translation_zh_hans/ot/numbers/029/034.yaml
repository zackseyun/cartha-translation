  text: and one goat for a sin offering[a], besides the regular burnt offering[b], with its grain offering and its drink offering.
translation:
  language: zh_hans
  text: 除常献的燔祭[a]及其素祭和奠祭以外，又要献一只公山羊作赎罪祭。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “常献”所译的希伯来语，指持续、定期反复献上的祭；也可译作“经常献的”或“每日献的”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/שְׂעִיר ... אֶחָד
  choice: 又要献一只公山羊
  rationale: שָׂעִיר在献祭语境中指公山羊，אֶחָד明确数量为一；וּ承接前文的祭物清单，译作“又要献”符合现代汉语表达。
- source_word: חַטָּאת
  choice: 作赎罪祭
  rationale: 该词在此指献祭制度中的赎罪祭，并非抽象意义的“罪”；“作赎罪祭”自然且明确。
- source_word: מִ/לְּ/בַד
  choice: 在……以外
  rationale: 表明这只公山羊是在固定献祭之外另加献上的，保留其附加关系。
- source_word: עֹלַת הַ/תָּמִיד
  choice: 常献的燔祭
  rationale: עֹלָה采用通行祭祀术语“燔祭”；תָּמִיד强调持续、定期反复献上，译作“常献的”既贴近原义，也避免将其意义仅限于时间词“每日”。
- source_word: מִנְחָתָ/הּ
  choice: 随燔祭同献的素祭
  rationale: מִנְחָה在此祭祀语境中指素祭；阴性单数后缀回指阴性名词“燔祭”，汉语将关系明说为“随燔祭同献”，比直译“它的素祭”自然。
- source_word: וְ/נִסְכָּ/הּ
  choice: 和奠祭
  rationale: נֶסֶךְ在祭祀清单中指奠祭；其后缀同样回指燔祭，承接前面的“随燔祭同献”即可清楚表达。
