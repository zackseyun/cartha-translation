base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/001.yaml
  text: And in the seventh month, on the first day of the month, you shall have a holy convocation. You shall do no laborious work. It shall be a day of trumpet-blast for you.
translation:
  language: zh_hans
  text: 七月初一，你们要举行圣会；不可做任何日常劳作。这一天要作为你们发出响亮声音的日子[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “发出响亮声音”也可译作“号角声”“呼喊”或“欢呼”。希伯来语所指的是高亢、响亮的声音，本节没有明确说出发声的器具。
    reason: 保留תְּרוּעָה的词义范围及原文歧义。
lexical_decisions:
- source_word: וּבַחֹדֶשׁ הַשְּׁבִיעִי
  choice: 七月
  rationale: בַּחֹדֶשׁ在此表示时间，意为“在第七个月”；中文历法表达自然作“七月”。句首ו承接上下文，但中文节期条例中无需机械译作“并且”。
- source_word: בְּאֶחָד לַחֹדֶשׁ
  choice: 初一
  rationale: 这是希伯来语标准历法表达，直指该月第一日；“初一”是现代中文清楚自然的对应说法。
- source_word: מִקְרָא קֹדֶשׁ
  choice: 举行圣会
  rationale: 该固定礼仪用语指被召集的神圣集会；“圣会”保留其正式宗教含义，“举行”使中文句法自然。
- source_word: כָּל מְלֶאכֶת עֲבֹדָה
  choice: 任何日常劳作
  rationale: 该词组指节期禁止的通常工作或劳务，并非绝对禁止一切活动；“日常劳作”兼顾范围与现代可懂性。
- source_word: לֹא תַעֲשׂוּ
  choice: 都不可做
  rationale: 准确表达第二人称复数的律法禁令，并保持庄重明确的语气。
- source_word: יוֹם תְּרוּעָה
  choice: 发出响声的日子／这一天……要发出响声
  rationale: תְּרוּעָה泛指高亢响声，可为号角声、呼喊或欢呼；正文采用不指定声源的“响声”，避免把原文未明说的乐器写入正文。
- source_word: יִהְיֶה לָכֶם
  choice: 这一天，你们要……
  rationale: 此结构说明这日对群体所具有的指定性质；转换为自然中文，同时保留“为你们设定”的群体指向。
theological_decisions:
- issue: 节期名称יוֹם תְּרוּעָה的译法
  choice: 这一天，你们要发出响声
  alternative: 这一天是你们吹号的日子／欢呼的日子
  rationale: 原文以该日特有的声音命名，却未明确指出乐器；正文保留语义宽度，不采用后世节日名称，也不把“号角”确定化。脚注列出语境上可能的具体理解。
translation_notes:
  register: 采用现代、庄重而易懂的法规体中文。“七月初一”和“圣会”简洁保留历法与礼仪色彩；不使用生硬的“劳役之工”，也不以“吹角节”等后世名称替代原文描述。
