base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/007.yaml
  text: On the tenth day of this seventh month[a], there shall be a holy convocation for you, and you shall afflict yourselves; you shall do no work at all.
translation:
  language: zh_hans
  text: 在这个第七个月的初十，你们要举行圣会，并要刻苦己身[a]；不可做任何工。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“要谦卑自己”或“要克己”。希伯来语这个习语直译为“要使自己受苦”，表示礼仪性的自我克制，尤其与禁食有关。
    reason: 说明习语的直译式含义、可选译法和礼仪背景，不在正文中把命令限定为禁食。
lexical_decisions:
- source_word: וּבֶעָשׂוֹר לַחֹדֶשׁ הַשְּׁבִיעִי הַזֶּה
  choice: 在这第七个月的初十
  rationale: 按希伯来历法表达日期，补出汉语所需的“初十”，并保留“这”和“第七个月”的指示与次序含义。
- source_word: מִקְרָא קֹדֶשׁ
  choice: 圣会
  rationale: 这是指奉召举行的神圣集会；“圣会”简洁、庄重，也保留礼仪语境。
- source_word: יִהְיֶה לָכֶם
  choice: 你们要举行
  rationale: 原文直译近于“要为你们有”，在汉语中以“你们要举行圣会”自然表达该日为群体设立圣会的规定。
- source_word: וְעִנִּיתֶם אֶת נַפְשֹׁתֵיכֶם
  choice: 并要使自己受苦
  rationale: 保留“使……受苦”的核心语义及赎罪日礼仪中的克己意味，同时不把所指只限定为禁食。
- source_word: כָּל מְלָאכָה לֹא תַעֲשׂוּ
  choice: 任何工都不可做
  rationale: 以现代汉语法律性语气表达全面禁止做工；“任何……都不可”体现 כָּל 与否定式的周全范围。
theological_decisions:
- issue: 赎罪日礼仪习语 וְעִנִּיתֶם אֶת נַפְשֹׁתֵיכֶם 的译法
  choice: 要使自己受苦
  alternative: 要谦卑自己；要克制自己；要禁食
  rationale: 原文命令全人承受自我约束和困苦。“使自己受苦”保留其严肃而开放的语义；“谦卑自己”可能弱化身体层面，“克制自己”较抽象，而“禁食”虽符合相关礼仪背景，却将原文未明说的具体实行方式直接写入正文。
translation_notes:
  register: 采用现代、庄重而易懂的律法语体。“圣会”保留礼仪色彩；“任何工都不可做”简洁表达全面禁令。脚注标记紧随其实际说明的短语，而非置于月份之后。
