  text: and their grain offering and their drink offerings for the bulls[a], for the rams, and for the lambs, according to their number, according to the ordinance;
translation:
  language: zh_hans
  text: 以及为公牛、公绵羊和羊羔所献的素祭和奠祭，要按它们的数目，照例献上[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“按所定的规例。”希伯来语כַּמִּשְׁפָּט指这些祭物所遵循的既定规则或程序。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִנְחָתָם
  choice: 素祭
  rationale: 在献祭律例的语境中，מִנְחָה特指与燔祭牲一同献上的谷物祭；“素祭”是中文圣经用语中准确而简洁的表达。
- source_word: נִסְכֵּיהֶם
  choice: 奠祭
  rationale: נֶסֶךְ指浇奠的液体祭物；“奠祭”准确保留其礼仪含义，也符合现代中文圣经语体。
- source_word: לַפָּרִים לָאֵילִם וְלַכְּבָשִׂים
  choice: 与公牛、公绵羊和羊羔相配的
  rationale: 三个带ל的名词说明素祭和奠祭分别归属于这些祭牲；“相配的”自然表达这种对应关系，避免误解为把素祭献给动物。
- source_word: בְּמִסְפָּרָם
  choice: 按它们的数目
  rationale: 表示随祭牲数目而相应配给祭物，保留原文按数量对应的程序性含义。
- source_word: כַּמִּשְׁפָּט
  choice: 照规定办理
  rationale: מִשְׁפָּט在此指既定的献祭规则或程序；此译法自然清楚，同时保留律例性的语气。
