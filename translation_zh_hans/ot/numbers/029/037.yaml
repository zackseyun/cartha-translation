  yaml_path: translation/ot/numbers/029/037.yaml
  text: and their grain offering and their drink offerings for the bull[a], for the ram, and for the lambs, according to their number, according to the ordinance.
translation:
  language: zh_hans
  text: 并要按公牛、公羊和羊羔的数目，照规定[a]献上相应的素祭和奠祭。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “照规定”也可译作“照规定的方式”。希伯来语此词指这些祭物所遵循的既定规则或法定要求。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִנְחָתָם
  choice: 相应的素祭
  rationale: 在献祭语境中，מִנְחָה指与牲祭一同献上的素祭。原文虽为带复数所属后缀的单数集合形式，汉语用“相应的素祭”自然表达各牲畜所配的素祭。
- source_word: וְנִסְכֵּיהֶם
  choice: 和奠祭
  rationale: נֶסֶךְ指浇奠的液体祭物；“奠祭”是现代中文圣经语体中准确而简明的表达。
- source_word: לַפָּר
  choice: 公牛
  rationale: פַּר指牛群中的公牛；本节词形本身不要求译出“年轻”。
- source_word: לָאַיִל
  choice: 公绵羊
  rationale: אַיִל在献祭清单中明确指公羊；加“绵”可避免现代汉语中“公羊”被误读为姓氏或泛指。
- source_word: וְלַכְּבָשִׂים
  choice: 羊羔
  rationale: כֶּבֶשׂ指羔羊，在献祭语境中常为公羔；此处上下文已规定祭牲，正文不必重复性别。
- source_word: בְּמִסְפָּרָם
  choice: 按……的数目
  rationale: 该短语表示所配祭物与所数点的牲畜数量相对应，译法保留了程序性的对应关系。
- source_word: כַּמִּשְׁפָּט
  choice: 照规定
  rationale: מִשְׁפָּט在此指既定的礼仪规则或法定要求；“照规定”既准确又比“照条例”更自然。
theological_decisions:
- issue: כַּמִּשְׁפָּט所表达的是法律条例还是规定的献祭方式
  choice: 正文译作“照规定”
  alternative: 照规定的方式；照条例
  rationale: 原词兼有规范、法定要求及既定程序之意。正文保留概括性，脚注说明可能侧重规定的方式，避免把语义过度限定为书面条例。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。调整原文名词串的语序，以“按……数目，照规定献上……”清楚表达各类牲畜与配套素祭、奠祭之间的对应关系，同时不增添原文没有的祭物数量。
