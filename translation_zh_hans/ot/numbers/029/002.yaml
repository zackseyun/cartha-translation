  to: 你们要献上燔祭给雅威，作为怡悦的馨香：一头小公牛、一只公绵羊和七只一岁的公羔羊，都要没有残疾。
  rationale: 修订将“给雅威”明确译出，以对应 לַיהוה；以“作为怡悦的馨香”较直接保留 לְרֵיחַ נִיחֹחַ 的意象和语义，避免在正文中过度释义。将“公牛犊”改为“小公牛”，并将“公羊羔”调整为更自然的“公羔羊”。
