  text: וַ/עֲשִׂיתֶ֨ם עֹלָ֜ה לְ/רֵ֤יחַ נִיחֹ֨חַ֙ לַֽ/יהוָ֔ה פַּ֧ר בֶּן בָּקָ֛ר אֶחָ֖ד אַ֣יִל אֶחָ֑ד כְּבָשִׂ֧ים בְּנֵי שָׁנָ֛ה שִׁבְעָ֖ה תְּמִימִֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/002.yaml
  text: 'And you shall offer a burnt offering as a pleasing aroma to Yahweh: one bull from the herd[a], one ram, and seven male lambs a year old, without blemish.'
translation:
  language: zh_hans
  text: 你们要献上燔祭给雅威，作为怡悦的馨香：一头小公牛、一只公绵羊和七只一岁的公羔羊，都要没有残疾。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַעֲשִׂיתֶם
  choice: 你们要献上
  rationale: 该动词本义为“做、预备”，但以祭物为宾语时表示献祭；“献上”符合现代汉语的祭祀语境。
- source_word: עֹלָה
  choice: 燔祭
  rationale: 指整只焚烧、使烟上腾的祭物；“燔祭”是准确且通行的汉语圣经术语。
- source_word: לְרֵיחַ נִיחֹחַ
  choice: 作为蒙雅威悦纳的馨香
  rationale: 这是固定的献祭用语，重点在祭物蒙神悦纳。“馨香”保留气味意象，“蒙雅威悦纳”则自然传达 נִיחֹחַ 在此语境中的功能。
- source_word: לַיהוָה
  choice: 蒙雅威悦纳
  rationale: 介词表明这祭是献给雅威的；结合前面的固定表达，以“蒙雅威悦纳”传达其关系和意义。
- source_word: פַּר בֶּן בָּקָר אֶחָד
  choice: 一头公牛犊
  rationale: פַּר 是公牛，בֶּן בָּקָר 是祭牲清单中对牛类牲畜的说明；“公牛犊”简洁自然，且保留性别与牲畜类别。
- source_word: אַיִל אֶחָד
  choice: 一只公绵羊
  rationale: אַיִל 在祭牲清单中明确指成年的公绵羊。
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה שִׁבְעָה
  choice: 七只一岁的公羊羔
  rationale: כְּבָשִׂים 指公羊羔，בְּנֵי שָׁנָה 表示一岁；译文保留数量、年龄与性别。
- source_word: תְּמִימִם
  choice: 都要没有残疾
  rationale: 在献祭语境中指祭牲没有身体缺陷；“没有残疾”是清楚自然的现代汉语。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名。译作“雅威”以音译保留其专名性质，不以称号代替。
- issue: לְרֵיחַ נִיחֹחַ 的神学含义
  choice: 蒙雅威悦纳的馨香
  alternative: 使雅威舒畅的香气；献给雅威的馨香
  rationale: 该固定祭祀用语兼有气味意象与祭物蒙悦纳之意。译文保留“馨香”，同时避免让现代读者误以为经文主要描写神在生理上闻到悦人的气味。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“燔祭”“馨香”保留必要的祭祀术语；用“一头、一只”及并列结构使祭牲清单清晰易读。
