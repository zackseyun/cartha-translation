    issue: 正文没有明确呈现“献给雅威”的介词关系。
    rationale: לַיהוה直接修饰献祭公式，表示祭物献给雅威；“蒙雅威悦纳”虽传达固定公式的语境意义，却将献祭的指向关系隐含在解释中。
  - severity: low
    issue: “一头公牛犊”略不自然。
    rationale: “公牛犊”虽可理解，但现代标准汉语以“小公牛”表达年轻的公牛更自然，且不改变祭牲类别。
  - severity: low
    issue: 脚注所列“献给雅威的馨香”不是对完整短语的充分替代译法。
    rationale: 该说法未表达 נִיחֹחַ 的“怡悦／安宁”语义，宜改为说明该固定公式的不同直译可能及其语境功能。
  revised_text: 你们要献上燔祭给雅威，作为怡悦的馨香：一头小公牛、一只公绵羊和七只一岁的公羔羊，都要没有残疾。
