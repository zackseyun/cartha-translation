  yaml_path: translation/ot/numbers/029/026.yaml
  text: 'On the fifth day: nine bulls[a], two rams, and fourteen male lambs a year old, without blemish,'
translation:
  language: zh_hans
  text: 第五日，要献九头公牛、两只公绵羊和十四只一岁的公羊羔，都要没有残疾。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“到了第五日。”希伯来语本节开头有表示承接的连词。
    reason: 保留句首וּ־的明示承接意义这一翻译选择。
lexical_decisions:
- source_word: וּ/בַ/יּוֹם הַ/חֲמִישִׁי
  choice: 第五日
  rationale: 希伯来语由连词、介词和“第五”构成，直译可作“到了第五日”或“在第五日”。祭物清单中用“第五日”自然简洁；句首连词所表达的承接关系由上下文次序体现。
- source_word: פָּרִים תִּשְׁעָה
  choice: 九头公牛
  rationale: פָּרִים在献祭语境中指公牛；量词“头”符合现代汉语对牛的通常表达。
- source_word: אֵילִם שְׁנָיִם
  choice: 两只公绵羊
  rationale: אֵילִם特指成年公羊；译作“公绵羊”可与后面的公羊羔清楚区分。
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה אַרְבָּעָה עָשָׂר
  choice: 十四只一岁的公羊羔
  rationale: כְּבָשִׂים在献祭清单中指公羊羔；בְּנֵי שָׁנָה表示一岁或尚在第一年内，按本系列清晰自然地译为“一岁的”。
- source_word: תְּמִימִם
  choice: 都要没有残疾
  rationale: תָּמִים在祭牲语境中表示没有身体缺陷；“没有残疾”准确传达礼仪要求，并以“都要”表明该形容词涵盖列出的牲畜。
