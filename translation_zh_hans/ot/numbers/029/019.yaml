    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/שְׂעִיר עִזִּים אֶחָד
  choice: 又要献一只公山羊
  rationale: שְׂעִיר עִזִּים是献祭语境中指公山羊的惯用表达；אֶחָד明确数量为一。“又要献”自然承接祭物清单。
- source_word: חַטָּאת
  choice: 作赎罪祭
  rationale: 在祭祀律例中，此词指特定祭类，而非抽象的“罪”；“赎罪祭”是现代中文圣经语体中清楚、通行的名称。
- source_word: מִ/לְּ/בַד
  choice: 在……以外
  rationale: 表示上述祭物是在固定献祭组合之外另加的；此表达兼顾准确与现代汉语自然度。
- source_word: עֹלַת הַ/תָּמִיד
  choice: 常献的燔祭
  rationale: תָּמִיד强调持续按规定献上；“常献的燔祭”既保留持续性，也比“持续的燔祭”更符合祭祀语境。
- source_word: וּ/מִנְחָתָ/הּ
  choice: 以及同献的素祭
  rationale: מִנְחָה在此为伴随燔祭的谷物祭；阴性单数后缀指回עֹלָה。“同献的”以自然中文表达这种从属关系。
- source_word: וְ/נִסְכֵּי/הֶם
  choice: 和奠祭
  rationale: נֶסֶךְ指浇奠的祭物，中文通常称“奠祭”。原文名词及后缀均为复数，但其所指关系有语法张力，正文不强行明确为单一祭物的“其奠祭”，并以脚注说明。
