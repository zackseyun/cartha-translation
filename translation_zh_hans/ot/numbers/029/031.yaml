  text: and one goat for a sin offering[a], besides the regular burnt offering[b], with its grain offering and its drink offerings.
translation:
  language: zh_hans
  text: 又要献一只公山羊作赎罪祭；另加常献的燔祭及其素祭和奠祭。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שְׂעִיר
  choice: 公山羊
  rationale: 该词在献祭语境中指山羊，通常特指公山羊；译作“公山羊”准确而自然。
- source_word: חַטָּאת
  choice: 赎罪祭
  rationale: 在祭祀语境中，该名词指为罪而献的祭物；“赎罪祭”是现代中文圣经语体中清楚而通行的表达。
- source_word: אֶחָד
  choice: 一只
  rationale: 表示公山羊的数量，并按中文动物量词译为“一只”。
- source_word: מִלְּבַד
  choice: 在……之外
  rationale: 表明本节所列祭物是在常献祭物以外另加的；这一表达准确且符合现代汉语。
- source_word: עֹלַת הַתָּמִיד
  choice: 常献的燔祭
  rationale: 该短语指按规定持续、定期献上的燔祭；“常献的”既保留持续反复之意，也比“持续的”更符合献祭语境。
- source_word: מִנְחָתָהּ
  choice: 同献的素祭
  rationale: מִנְחָה在祭祀清单中指随燔祭献上的谷物祭；“素祭”是简洁、通行的中文术语。阴性单数后缀回指语法上为阴性的“燔祭”，中文以“同献的”自然显明其附属性。
- source_word: וּנְסָכֶיהָ
  choice: 和奠祭
  rationale: נֶסֶךְ指浇奠的液体祭物；“奠祭”准确、简洁。原文为复数并带回指后缀，但中文集合性祭名通常不必强行标出复数，且“同献的”同时涵盖素祭和奠祭。
theological_decisions: []
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“燔祭、素祭、奠祭、赎罪祭”保留成熟且可辨识的祭祀术语。分号与“这是在……之外”使附加关系清楚，同时不增添原文没有的神学解释。英文咨询层所列脚注标记似有错位：其脚注内容分别对应“常献的燔祭”和“奠祭”，而不是正文标记所在词；因中文译文可直接清楚表达，未设置脚注。
