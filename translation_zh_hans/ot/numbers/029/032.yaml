  yaml_path: translation/ot/numbers/029/032.yaml
  text: 'And on the seventh day: seven bulls[a], two rams, and fourteen one-year-old lambs without blemish.'
translation:
  language: zh_hans
  text: 第七天：七头公牛、两只公绵羊和十四只一岁大的公羊羔，都无残疾[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“完整无缺”。原文在这里指献祭的牲畜健全、没有缺陷。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בַ/יּוֹם הַ/שְּׁבִיעִי
  choice: 第七天
  rationale: 该短语承接前文祭期逐日列举的次序；现代汉语无须硬译句首连接词“和”，上下文的连续性仍然清楚。
- source_word: פָּרִים שִׁבְעָה
  choice: 七头公牛
  rationale: פַּר在献祭清单中指公牛；原文没有明确说明年龄，因此不增译“幼”。
- source_word: אֵילִם שְׁנָיִם
  choice: 两只公绵羊
  rationale: אַיִל在献祭语境中通常指成年的公绵羊；译作“公绵羊”比单说“公羊”更能避免与山羊混淆。
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה אַרְבָּעָה עָשָׂר
  choice: 十四只一岁的公羊羔
  rationale: כֶּבֶשׂ指公羊羔，בְּנֵי שָׁנָה是表示年龄的希伯来语习语，意为“一岁”或“第一年内”。
- source_word: תְּמִימִם
  choice: 都要没有残疾
  rationale: 在献祭语境中，该词表示祭牲完整、无缺陷；复数形式在句法上修饰所列祭牲，译入“都要”可自然表达这一要求。
