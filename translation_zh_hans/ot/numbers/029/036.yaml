  timestamp: '2026-07-14T04:56:55Z'
review_pass:
  verdict: revise
  source_fidelity: 译文准确呈现了献上、燔祭、火祭、献给雅威以及祭牲的种类、数量和年龄。惟“都要没有残疾”在中文中容易修饰整份清单；希伯来文复数形容词直接修饰“七只一岁的羊羔”，应将其明确附于羊羔。
  naturalness: 原译整体庄重自然，但“作为火祭，是献给雅威、蒙他悦纳的馨香”的连续系词结构略显滞重。改为“献给雅威、作为馨香的火祭”更符合现代汉语，也保留原文的礼仪性并列结构。
  terminology: “燔祭”“火祭”“雅威”“公绵羊”均恰当。“馨香”可保留为固定献祭表达；脚注以“蒙雅威悦纳”说明其习语含义，并保持神名一致。
  issues:
  - severity: medium
    issue: “都要没有残疾”的修饰范围含混。
    rationale: 原文的“没有残疾的”（תְּמִימִם）为复数，直接对应紧邻的“羊羔”，并不明确修饰公牛和公绵羊。中文应将此条件置于“羊羔”内部，以避免扩展原文所表达的范围。
  - severity: low
    issue: 祭祀短语的中文句法略显重复。
    rationale: “作为火祭，是献给……”含有不必要的双重判断结构。调整语序可使“火祭、馨香、献给雅威”三项修饰关系更紧凑，同时不改变意义。
  revised_text: 你们要献上燔祭，就是献给雅威、作为馨香的火祭：一头公牛、一只公绵羊和七只一岁的、没有残疾的羊羔。
  revised_footnotes:
