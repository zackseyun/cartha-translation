    reason: 说明“馨香”的词义替代译法及其作为固定礼仪表达的含义。
  revision_rationale: 修订将“没有残疾的”明确限定为七只一岁的羊羔，遵循希伯来文的直接语法关联；同时简化祭祀短语的中文结构。脚注锚点仍置于“馨香”后，并将“上帝”统一为正文所用的“雅威”。
