base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/036.yaml
  text: 'And you shall present a burnt offering[a], an offering by fire, a pleasing aroma to Yahweh: one bull, one ram, and seven one-year-old lambs without blemish.'
translation:
  language: zh_hans
  text: 你们要献上燔祭，就是献给雅威、作为馨香的火祭：一头公牛、一只公绵羊和七只一岁的、没有残疾的羊羔。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִקְרַבְתֶּם
  choice: 你们要献上
  rationale: 使役形在献祭语境中指把祭物呈献出来；“献上”自然、庄重，并准确表达礼仪行为。
- source_word: עֹלָה
  choice: 燔祭
  rationale: 这是整只焚烧、烟气上升的祭物；“燔祭”是现代中文圣经语境中清楚而稳定的礼仪术语。
- source_word: אִשֵּׁה
  choice: 火祭
  rationale: 指经火献上的祭物；“火祭”简洁保留献祭方式，又不额外解释为“食物”。
- source_word: רֵיחַ נִיחֹחַ
  choice: 蒙他悦纳的馨香
  rationale: 这是表示祭物为上帝所接纳的固定献祭用语；此译既保留“香气”的意象，也避免把重点仅理解为嗅觉上的愉悦。
- source_word: לַיהוָה
  choice: 献给雅威
  rationale: 介词 ל 表明祭物所归向的对象；按所给神学决策，将圣名直接译作“雅威”。
- source_word: פַּר אֶחָד
  choice: 一头公牛
  rationale: פַּר 指牛群中的公牛；量词“头”符合现代汉语习惯。
- source_word: אַיִל אֶחָד
  choice: 一只公绵羊
  rationale: אַיִל 是献祭清单中常见的成年公绵羊；如此译出可与羊羔明确区分。
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה שִׁבְעָה
  choice: 七只一岁的羊羔
  rationale: 原文直译为“七只一岁之羊”；该译法自然保留数量和年龄要求，不另行添加原文未明确要求的性别说明。
- source_word: תְּמִימִם
  choice: 都要没有残疾
  rationale: 在献祭语境中指祭牲无缺陷；“没有残疾”以普通读者易懂的现代汉语表达礼仪上的完整要求。
theological_decisions:
- issue: 如何译出神名 יהוה
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”较接近学界普遍采用的读音重构，并保留其作为盟约圣名的性质。
- issue: רֵיחַ נִיחֹחַ 是否仅指感官上悦人的香气
  choice: 蒙他悦纳的馨香
  alternative: 舒畅的香气／悦人的香气
  rationale: 该短语是固定的献祭表达，重点在祭物蒙上帝接纳；译文保留香气意象，同时不把它缩减为单纯的感官描述。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“燔祭”“火祭”“馨香”保留必要的礼仪色彩，并以“蒙他悦纳”帮助普通读者理解固定献祭用语。冒号后的祭牲清单保持原文次序与简洁结构。
