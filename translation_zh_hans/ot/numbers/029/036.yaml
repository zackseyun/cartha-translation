revisions:
- from: 你们要献上燔祭，作为火祭，是献给雅威、蒙他悦纳的馨香[a]：一头公牛、一只公绵羊和七只一岁的羊羔，都要没有残疾。
  to: 你们要献上燔祭，就是献给雅威、作为馨香的火祭：一头公牛、一只公绵羊和七只一岁的、没有残疾的羊羔。
  rationale: 修订将“没有残疾的”明确限定为七只一岁的羊羔，遵循希伯来文的直接语法关联；同时简化祭祀短语的中文结构。脚注锚点仍置于“馨香”后，并将“上帝”统一为正文所用的“雅威”。
