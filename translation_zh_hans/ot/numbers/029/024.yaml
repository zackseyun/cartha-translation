  yaml_path: translation/ot/numbers/029/024.yaml
  text: and their grain offerings and their drink offerings for the bulls[a], for the rams, and for the lambs, according to their number, according to the ordinance;
translation:
  language: zh_hans
  text: 并要献上为公牛、公绵羊和羊羔所配的素祭和奠祭，按各牲畜的数目，照定例[a]办理。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “定例”也可译为“规定的方式”。希伯来语指这些祭物所遵循的既定礼仪规程。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִנְחָתָם
  choice: 各自的素祭
  rationale: מִנְחָה在献祭语境中特指伴随牲祭献上的素祭；三复数后缀与下文所列牲畜相呼应，译为“各自的”也表达按牲畜数目配给的关系。
- source_word: וְנִסְכֵּיהֶם
  choice: 和奠祭
  rationale: נֶסֶךְ指浇奠的祭物；“奠祭”是现代中文圣经语境中清楚而庄重的表达。
- source_word: לַפָּרִים לָאֵילִם וְלַכְּבָשִׂים
  choice: 这些公牛、公绵羊和羊羔
  rationale: 介词ל表示素祭和奠祭与各类牲祭的归属或配属关系；借助“各自的”在中文中自然表达。אֵילִם明确译为“公绵羊”，以区别泛称的羊。
- source_word: בְּמִסְפָּרָם
  choice: 按它们的数目
  rationale: 表示伴随献上的祭物须与牲畜数目相应，既保留原文程序性含义，也符合现代汉语。
- source_word: כַּמִּשְׁפָּט
  choice: 照定例办理
  rationale: מִשְׁפָּט在此指献祭所遵循的既定规范或法定程序；“定例”保留礼仪和法规色彩，“办理”使中文句意完整自然。
