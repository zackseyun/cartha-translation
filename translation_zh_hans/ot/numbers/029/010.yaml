lexical_decisions:
- source_word: עִשָּׂרוֹן עִשָּׂרוֹן
  choice: 十分之一份
  rationale: 希伯来文重复“十分之一”，在献祭条例中表示按只分配的十分之一量；原文此处未明说计量基准，正文保留“份”，脚注说明通常指一伊法的十分之一。
- source_word: לַכֶּבֶשׂ הָאֶחָד
  choice: 每只羊羔
  rationale: 字面为“给那一只羊羔”，在逐只规定素祭用量的语境中具有分配义；译作“每只”符合现代汉语表达。
- source_word: לְשִׁבְעַת הַכְּבָשִׂים
  choice: 七只羊羔都要这样
  rationale: 该短语指明逐只用量适用于前述七只羊羔；用“都要这样”自然表达其总结性的适用范围。
