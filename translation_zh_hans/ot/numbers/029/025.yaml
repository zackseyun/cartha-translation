  text: וּ/שְׂעִיר עִזִּ֥ים אֶחָ֖ד חַטָּ֑את מִ/לְּ/בַד֙ עֹלַ֣ת הַ/תָּמִ֔יד מִנְחָתָ֖/הּ וְ/נִסְכָּֽ/הּ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/025.yaml
  text: and one male goat for a sin offering[a], besides the regular burnt offering, its grain offering, and its drink offering.
translation:
  language: zh_hans
  text: 除常献的燔祭[a]、随同它献的素祭和奠祭以外，还要献一只公山羊作赎罪祭。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“持续献的燔祭”。
    reason: תָּמִיד可突出持续不断或恒常按规定献上的性质；正文采用较自然的“常献的”。
lexical_decisions:
- source_word: וּ/שְׂעִיר עִזִּים אֶחָד
  choice: 又要献一只公山羊
  rationale: שְׂעִיר עִזִּים是献祭语境中指公山羊的惯用表达；אֶחָד明确数量为一只。补出“献”使中文句意自然，并由上下文充分支持。
- source_word: חַטָּאת
  choice: 作赎罪祭
  rationale: 在祭祀条例中，此词指赎罪祭，而非抽象的“罪”；“作赎罪祭”准确表达祭牲的用途。
- source_word: מִ/לְּ/בַד
  choice: 在……以外另献的
  rationale: 该介词结构说明本节所列祭物是在固定祭物之外加献的；此译法清楚表达附加关系。
- source_word: עֹלַת הַ/תָּמִיד
  choice: 常献的燔祭
  rationale: תָּמִיד在此强调按规定持续、定期献上；“常献的燔祭”既保留持续性，又不把词义缩窄为单纯“每日”。
- source_word: מִנְחָתָ/הּ
  choice: 随同燔祭献的素祭
  rationale: 祭祀清单中的מִנְחָה指谷物类祭物，传统且清楚的中文名称为“素祭”。阴性单数后缀回指燔祭；译出“随同燔祭献的”可明确其从属关系。
- source_word: וְ/נִסְכָּ/הּ
  choice: 和奠祭
  rationale: נֶסֶךְ指浇奠的祭酒；“奠祭”是简洁、通行的祭祀术语。其后缀同样回指燔祭，中文由前面的“随同燔祭献的”统摄。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的祭祀用语。“燔祭、素祭、奠祭、赎罪祭”保持术语一致性；调整语序并补出“献”，使希伯来文省略式祭物清单在中文中成为完整自然的句子。
