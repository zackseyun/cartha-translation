    text: 或译：“持续献的燔祭”。
    reason: תָּמִיד可突出持续不断或恒常按规定献上的性质；正文采用较自然的“常献的”。
  revision_rationale: 调整语序，使“以外”所排除的常规燔祭及其附属素祭、奠祭清楚地修饰随后所说的公山羊赎罪祭；不改变祭物、数量或附加关系。
