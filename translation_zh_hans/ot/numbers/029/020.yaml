  language: zh_hans
  text: 第三日：十一头公牛、两只公绵羊、十四只一岁且没有残疾的公羊羔。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/בַ/יּוֹם הַ/שְּׁלִישִׁי
  choice: 第三日
  rationale: 希伯来语以连接词和介词引出节期献祭次序中的下一日。中文按连续条文的自然表达译作“第三日”，不必机械加入“并且在”。
- source_word: פָּרִים עַשְׁתֵּי עָשָׂר
  choice: 十一头公牛
  rationale: פָּרִים 在献祭语境中指公牛；量词“头”符合现代汉语习惯。
- source_word: אֵילִם שְׁנָיִם
  choice: 两只公绵羊
  rationale: אֵילִם 指成年雄性绵羊；“公绵羊”比单说“公羊”更明确，并与羊羔区分。
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה אַרְבָּעָה עָשָׂר
  choice: 十四只一岁的公羊羔
  rationale: כְּבָשִׂים 指羊羔，בְּנֵי שָׁנָה 是“一岁”的惯用说法。依本章祭牲清单的语境，以“公羊羔”自然传达所献幼羊。
- source_word: תְּמִימִם
  choice: 都要没有残疾
  rationale: 该词在祭祀律例中表示祭牲完整、无身体缺陷；“没有残疾”清楚且符合现代汉语。
