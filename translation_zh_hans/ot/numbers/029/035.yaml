  text: בַּ/יּוֹם֙ הַ/שְּׁמִינִ֔י עֲצֶ֖רֶת תִּהְיֶ֣ה לָ/כֶ֑ם כָּל מְלֶ֥אכֶת עֲבֹדָ֖ה לֹ֥א תַעֲשֽׂוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/035.yaml
  text: On the eighth day you shall have a solemn assembly[a]; you shall do no laborious work.
translation:
  language: zh_hans
  text: 第八天，你们要举行庄严集会[a]；不可做任何日常劳作。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“闭幕集会。”希伯来语 עֲצֶרֶת 可指节期结束时举行的集会。
    reason: 词义存在可保留的另一种理解：该词既可泛指庄严的节期集会，也可强调这是结束节期的会集。
lexical_decisions:
- source_word: בַּיּוֹם הַשְּׁמִינִי
  choice: 第八天
  rationale: 保留定指序数和时间意义；现代汉语简洁自然，且不补入原文未明说的“节期”。
- source_word: עֲצֶרֶת
  choice: 庄严集会
  rationale: 该词在节期语境中指正式、神圣的集会，也可带有节期结束时会集的意味。“庄严集会”保留礼仪性质，同时不把“结束”这一可能的语义限定写死。
- source_word: תִּהְיֶה לָכֶם
  choice: 你们要举行
  rationale: 原文直译为“要为你们有”；按现代汉语表达为“你们要举行”，清楚传达命令中的集会安排。
- source_word: כָּל מְלֶאכֶת עֲבֹדָה
  choice: 任何日常劳作
  rationale: 该固定表达在节期律例中指平常从事的劳动或职业性工作，而非笼统禁止一切行动。“日常劳作”自然易懂，也避免古旧的“奴仆之工”。
- source_word: לֹא תַעֲשׂוּ
  choice: 都不可做
  rationale: 准确表达复数第二人称法律禁令；与前面的“任何”搭配，符合庄重而自然的现代汉语。
theological_decisions:
- issue: עֲצֶרֶת 的节期含义
  choice: 正文译作“庄严集会”，脚注说明也可理解为“闭幕集会”
  alternative: 正文直接译作“闭幕集会”
  rationale: 此词既可突出正式、神圣的会集，也可能指节期结束时的集会。正文不强行消除这种语义张力，脚注保留较具体的另一种理解。
- issue: 节期禁工的范围
  choice: 译作“任何日常劳作都不可做”
  alternative: 译作“任何劳作都不可做”或“任何繁重工作都不可做”
  rationale: מְלֶאכֶת עֲבֹדָה 是节期律例中的固定搭配，重点在平常的劳动性工作；译作“日常劳作”可避免误解为禁止一切活动，也不把它局限于体力繁重的工作。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“庄严集会”保持礼仪语域，但避免与其他希伯来礼仪术语机械合并；分号呈现两项并列规定。
