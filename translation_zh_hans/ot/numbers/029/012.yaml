  text: וּ/בַ/חֲמִשָּׁה֩ עָשָׂ֨ר י֜וֹם לַ/חֹ֣דֶשׁ הַ/שְּׁבִיעִ֗י מִֽקְרָא קֹ֨דֶשׁ֙ יִהְיֶ֣ה לָ/כֶ֔ם כָּל מְלֶ֥אכֶת עֲבֹדָ֖ה לֹ֣א תַעֲשׂ֑וּ וְ/חַגֹּתֶ֥ם חַ֛ג לַ/יהוָ֖ה שִׁבְעַ֥ת יָמִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/012.yaml
  text: And on the fifteenth day of the seventh month, you shall have a holy convocation. You shall do no ordinary work, and you shall keep a feast to Yahweh seven days.
translation:
  language: zh_hans
  text: 七月十五日，你们要举行圣会；不可做任何日常劳作。你们要向雅威守节七天。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבַחֲמִשָּׁה עָשָׂר יוֹם לַחֹדֶשׁ הַשְּׁבִיעִי
  choice: 七月十五日
  rationale: 希伯来语是历法表达“在第七月的第十五日”；汉语自然地按“七月十五日”排列，无须另译句首连接词。
- source_word: מִקְרָא קֹדֶשׁ
  choice: 圣会
  rationale: 该固定礼仪用语指奉召举行的神圣集会；“圣会”简洁庄重，也与现代中文圣经语体相合。
- source_word: יִהְיֶה לָכֶם
  choice: 你们要举行
  rationale: 直译为“要为你们有”，结合“圣会”在现代汉语中自然表达为“你们要举行圣会”。
- source_word: כָּל מְלֶאכֶת עֲבֹדָה
  choice: 任何日常劳作
  rationale: 该词组指平常职业性或劳务性的工作，并非绝对禁止一切活动；“日常劳作”保留与节期圣务之间的对比。
- source_word: לֹא תַעֲשׂוּ
  choice: 都不可做
  rationale: 以明确的禁令语气传达希伯来语未完成式在律法条文中的禁止功能。
- source_word: וְחַגֹּתֶם חַג
  choice: 守节
  rationale: 同源动词与名词构成强调性的表达，意为举行、庆守节期；中文“守节”凝练地保留礼仪性。
- source_word: לַיהוָה
  choice: 向雅威
  rationale: 介词表明节期朝向雅威、为尊崇他而守；“向”保留这一方向与敬奉意味，专名按源文音译。
- source_word: שִׁבְעַת יָמִים
  choice: 七天
  rationale: 直接表达节期持续的时长，中文不需另加介词。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 源文直接使用四字神名。采用较贴近学界通常重构读音的“雅威”，既将其作为专名呈现，也避免以称号替代；不借此解决其古代确切发音仍有不确定性的问题。
- issue: “日常劳作”禁令的范围
  choice: 任何日常劳作都不可做
  alternative: 任何工作都不可做；不可做劳苦的工
  rationale: מְלֶאכֶת עֲבֹדָה 在节期法规中较可能指日常、职业或劳务性工作。“日常劳作”避免把禁令扩大为一切活动，同时不进一步规定具体边界。
translation_notes:
  register: 采用现代、庄重而易懂的法规语体。“圣会”“守节”保留礼仪色彩；分为两句以清楚呈现集会、停工与守节三项要求。
