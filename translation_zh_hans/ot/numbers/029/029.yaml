  text: 'And on the sixth day: eight bulls, two rams, and fourteen male lambs a year old, without blemish.'
translation:
  language: zh_hans
  text: 第六天，要献八头公牛、两只公绵羊和十四只一岁的、没有残疾的公羊羔。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבַיּוֹם הַשִּׁשִּׁי
  choice: 第六天
  rationale: 这是连续列举每日祭物的表达；现代汉语可自然译作“第六天”，不必机械保留句首连接词。
- source_word: פָּרִים שְׁמֹנָה
  choice: 公牛八头
  rationale: פָּרִים在献祭语境中指公牛；原文未明确说明年龄，因此不增译“幼”。
- source_word: אֵילִם שְׁנָיִם
  choice: 公绵羊两只
  rationale: אֵילִם特指成年雄性绵羊；译作“公绵羊”清楚而符合现代汉语。
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה אַרְבָּעָה עָשָׂר
  choice: 一岁的公羊羔十四只
  rationale: כְּבָשִׂים为阳性羊羔，בְּנֵי שָׁנָה表示一岁；按汉语量词习惯译出数量。
- source_word: תְּמִימִם
  choice: 都要没有残疾
  rationale: 在祭祀法规中指祭牲身体完整、无缺陷；“没有残疾”准确且易懂，“都要”表明该要求适用于前列祭牲。
