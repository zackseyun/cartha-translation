base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/011.yaml
  text: and one male goat for a sin offering[a], besides the sin offering of atonement[b], and the regular burnt offering with its grain offering and their drink offerings.
translation:
  language: zh_hans
  text: 又要献一只公山羊作赎罪祭[a]；这是在赎罪礼的赎罪祭、常献的燔祭[b]及其素祭和它们的奠祭以外另献的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “赎罪祭”也可译作“洁净祭”；本节两处相同。
    reason: lexical_alternative
  - marker: b
    text: “常献的燔祭”也可译作“持续献的燔祭”。
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂעִיר עִזִּים
  choice: 公山羊
  rationale: 该组合词指雄性的山羊；“公山羊”在现代汉语中清楚自然，也保留祭牲的性别。
- source_word: אֶחָד
  choice: 一只
  rationale: 保留原文明确规定的数量，并使用适合动物的量词。
- source_word: חַטָּאת
  choice: 赎罪祭
  rationale: 在祭祀清单中，此词指一种祭物或祭礼，而非抽象的“罪”；“赎罪祭”是通行且易懂的礼仪术语。另有“洁净祭”的理解，列于脚注。
- source_word: מִלְּבַד
  choice: 在……以外另献的
  rationale: 表明这只公山羊是在既定的其他祭物之外加献；如此重组语序较符合现代汉语。
- source_word: חַטַּאת הַכִּפֻּרִים
  choice: 赎罪祭
  rationale: 上下文为七月十日的赎罪礼仪；汉语简洁译作“赎罪祭”，避免生硬重复为“赎罪的赎罪祭”，同时不把所指扩展成原文未明说的完整节期名称。
- source_word: עֹלַת הַתָּמִיד
  choice: 常献的燔祭
  rationale: תָּמִיד表示持续按规定献上的祭；“常献的燔祭”既保留持续、定期之意，也符合祭祀语境。
- source_word: מִנְחָתָהּ
  choice: 与燔祭同献的素祭
  rationale: מִנְחָה在此类祭祀清单中指谷物祭；阴性单数后缀回指阴性名词“燔祭”，故明确为与燔祭同献。
- source_word: נִסְכֵּיהֶם
  choice: 与这些祭同献的奠祭
  rationale: 保留复数后缀所指的复数祭物，同时用“奠祭”表达倾倒酒液的礼仪性祭献。
theological_decisions:
- issue: חַטָּאת的礼仪含义
  choice: 正文译作“赎罪祭”
  alternative: 洁净祭
  rationale: 该词既与罪有关，也具有洁净礼仪的功能。“赎罪祭”是现代中文读者较熟悉的祭名，但脚注保留“洁净祭”这一真实的词义选择。
- issue: חַטַּאת הַכִּפֻּרִים的表达
  choice: 译作“赎罪祭”
  alternative: 赎罪礼的赎罪祭／赎罪日的赎罪祭
  rationale: 构造关系将该祭与כִּפֻּרִים所指的赎罪礼仪相连。鉴于本节语境已明确处于七月十日，正文采用自然简洁的中文，不强行加入“赎罪日”这一解释性名称。
- issue: נִסְכֵּיהֶם复数后缀的指向
  choice: 译为“与这些祭同献的奠祭”
  alternative: 与燔祭同献的奠祭
  rationale: 原文使用阳性复数后缀，其具体涵盖范围并非完全显明；正文保留复数范围，避免擅自限定只回指常献的燔祭。
translation_notes:
  register: 采用现代、庄重而易懂的礼仪用语。“燔祭、素祭、奠祭、赎罪祭”沿用通行中文圣经术语；通过补出“同献”和调整语序，使希伯来文的附属关系在中文中清楚，同时保留复数后缀可能涵盖多个祭物的含混性。
