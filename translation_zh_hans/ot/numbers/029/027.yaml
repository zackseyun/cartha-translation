  yaml_path: translation/ot/numbers/029/027.yaml
  text: along with their grain offering and their drink offerings for the bulls[a], for the rams, and for the lambs, according to their number, according to the ordinance.
translation:
  language: zh_hans
  text: 并献上为公牛、公羊和羊羔所配的素祭和奠祭，按它们的数目，照例而献。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“按所规定的礼仪”。“照例”指这些祭物应遵循既定的献祭规程。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִנְחָתָם
  choice: 相应的素祭
  rationale: מִנְחָה在献祭语境中指与燔祭同献的谷物祭；“素祭”是简明而通行的礼仪用语。“相应的”表达希伯来文所属后缀所指的配套关系。
- source_word: נִסְכֵּיהֶם
  choice: 相应的奠祭
  rationale: נֶסֶךְ指浇奠的液体祭物；“奠祭”准确、简洁，也与现代中文圣经礼仪语境相合。
- source_word: לַפָּרִים לָאֵילִם וְלַכְּבָשִׂים
  choice: 按公牛、公绵羊和羊羔的数目
  rationale: 介词לְ表示配套祭物对应各类牲畜；结合后面的בְּמִסְפָּרָם，整合为自然中文，清楚表明祭物分量随各类牲畜的数量而定。
- source_word: בְּמִסְפָּרָם
  choice: 按……的数目
  rationale: 表示配套的素祭和奠祭依牲畜数量而定；此译法忠实且符合现代汉语表达。
- source_word: כַּמִּשְׁפָּט
  choice: 照规定献上
  rationale: מִשְׁפָּט在此指既定的礼仪规范或程序。“照规定献上”比逐字译作“照条例”更自然，并保留规范性含义。
- source_word: וּ
  choice: 并要献上
  rationale: 本节在句法和内容上承接前文的祭牲清单；译作“并要献上”既显明承接关系，也使独立引述的经节在中文中完整顺畅。
