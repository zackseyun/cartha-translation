  yaml_path: translation/ot/numbers/029/023.yaml
  text: 'And on the fourth day: ten bulls, two rams, fourteen one-year-old lambs without blemish,'
translation:
  language: zh_hans
  text: 第四天，要献十头公牛、两只公绵羊和十四只一岁的、没有瑕疵的公羊羔。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבַיּוֹם הָרְבִיעִי
  choice: 第四天
  rationale: 该短语承接连续的节期献祭清单；现代汉语以“第四天”自然表达时间次序，无须机械译出句首连接词。
- source_word: פָּרִים עֲשָׂרָה
  choice: 十头公牛
  rationale: פָּרִים在献祭语境中指公牛；量词“头”符合现代汉语习惯。
- source_word: אֵילִם שְׁנָיִם
  choice: 两只公绵羊
  rationale: אֵילִם明确指成年公羊；译作“公绵羊”可与后面的公羊羔清楚区分。
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה אַרְבָּעָה עָשָׂר
  choice: 十四只一岁的公羊羔
  rationale: כְּבָשִׂים在此祭牲清单中指羊羔，语法性别及祭牲背景支持“公羊羔”；בְּנֵי שָׁנָה是年龄惯用语，译为“一岁”自然明确。
- source_word: תְּמִימִם
  choice: 没有残疾
  rationale: 在献祭律例中表示祭牲身体完整、无缺陷；“没有残疾”准确且为普通现代读者易懂。
