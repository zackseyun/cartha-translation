base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/033.yaml
  text: and their grain offering and their drink offerings for the bulls[a], for the rams, and for the lambs, according to their number, according to the ordinance.
translation:
  language: zh_hans
  text: 同献的素祭和奠祭，要按公牛、公羊和羊羔的数目，照其定例[a]献上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“照规定的礼仪”或“照为它们所定的条例”。
    reason: 原文 כְּמִשְׁפָּטָם 可指相关祭物或祭牲所适用的既定规例，也可概括指规定的祭祀礼仪；“其”保留后缀所指的余地。
lexical_decisions:
- source_word: מִנְחָתָם
  choice: 同献的素祭
  rationale: 在祭祀语境中，מִנְחָה指与燔祭牲一同献上的谷物祭；采用现代中文圣经语体中简明且明确的“素祭”。希伯来文虽为带第三人称复数后缀的单数形式，此处具有集合意义，中文不必另标单复数。
- source_word: נִסְכֵּיהֶם
  choice: 奠祭
  rationale: נֶסֶךְ指把酒等液体倾倒献上的祭；“奠祭”既保留祭仪含义，也符合庄重、通行的中文表达。
- source_word: לַפָּרִים
  choice: 公牛
  rationale: פָּרִים在献祭清单中指公牛；原文在此没有明确表达“幼”，因此不增译为“公牛犊”。
- source_word: לָאֵילִם
  choice: 公绵羊
  rationale: אַיִל在祭祀语境中明确指公羊；加“绵”可与一般的“公羊”及后面的羊羔清楚区分。
- source_word: וְלַכְּבָשִׂים
  choice: 和羊羔
  rationale: כֶּבֶשׂ指羊羔，祭祀语境常为公羊羔，但本节自身未明说性别，故不作过度限定。
- source_word: בְּמִסְפָּרָם
  choice: 按……的数目
  rationale: 忠实表达各项素祭和奠祭须与所列祭牲数目相配；为使现代中文自然，将公牛、公绵羊和羊羔置于“数目”之前。
- source_word: כְּמִשְׁפָּטָם
  choice: 照各自的定例
  rationale: מִשְׁפָּט在此指祭礼上规定的做法或份量；“定例”保留其规范性，复数后缀则以“各自”体现，而不武断限定其所指。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的祭祀用语。“同献的”补明素祭和奠祭与前述牲祭相配的关系；句末补出“献上”，使这一承接上文的希伯来语片段在中文中成为完整自然的句子。
