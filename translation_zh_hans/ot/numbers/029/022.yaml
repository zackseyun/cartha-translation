  text: and one male goat for a sin offering[b][a], besides the regular burnt offering and its grain offering and its drink offering.
translation:
  language: zh_hans
  text: 除常献的燔祭及其所配的素祭和奠祭以外，还要献一只公山羊作赎罪祭。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/שְׂעִיר חַטָּאת אֶחָד
  choice: 又要献一只公山羊作赎罪祭
  rationale: שָׂעִיר特指公山羊，אֶחָד明确数量为一只；חַטָּאת在祭祀语境中指赎罪祭。“又要献”自然承接本段祭物清单。
- source_word: מִ/לְּ/בַד
  choice: 这是在……以外
  rationale: 表示本节所列赎罪祭是在固定献祭之外另加的祭物；此表达既保留附加关系，也符合现代汉语。
- source_word: עֹלַת הַ/תָּמִיד
  choice: 常献的燔祭
  rationale: עֹלָה采用传统且清楚的祭祀术语“燔祭”；תָּמִיד在此指按规定持续、定期献上的祭，译为“常献的”比字面“不断的”更自然，也与民数记祭祀条例的语境相符。
- source_word: וּ/מִנְחָתָ/הּ וְ/נִסְכָּ/הּ
  choice: 以及同献的素祭和奠祭
  rationale: מִנְחָה在祭祀法规中指素祭，נֶסֶךְ指奠祭。两个阴性单数后缀均回指עֹלָה；“同献的”清楚表明两祭附属于常献的燔祭，并避免汉语“它的”可能造成的生硬或指代不明。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的祭祀法规用语；保留“燔祭、素祭、奠祭、赎罪祭”等已通行的圣经术语。希伯来文本两个物主后缀都回指单数阴性名词“燔祭”，正文以“同献的”明确这种从属关系。
