  text: and one-tenth for each lamb[a], for the fourteen lambs;
translation:
  language: zh_hans
  text: 十四只羊羔，每只献十分之一伊法[a]；
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文两次重复“十分之一”（即“十分之一、十分之一”），表示每只羊羔各献这个分量。
    reason: lexical_alternative
lexical_decisions:
- source_word: עִשָּׂרוֹן ... עִשָּׂרוֹן
  choice: 每只献十分之一伊法
  rationale: עִשָּׂרוֹן是容量单位，指一伊法的十分之一；原文重复两次，具有逐一分配的作用。中文用“每只”自然表达这种分配含义，并补明上下文所指的伊法。
- source_word: לַכֶּבֶשׂ הָאֶחָד
  choice: 每只羊羔
  rationale: 字面为“给那一只羊羔”，在祭物清单中表示逐只计算；译作“每只羊羔”清楚而自然。
- source_word: לְאַרְבָּעָה עָשָׂר כְּבָשִׂים
  choice: 十四只羊羔
  rationale: 指本段规定中确定的十四只羊羔。汉语无需另加定冠词，前置总数后接“每只”可清楚说明适用范围。
