  text: וּ/מִנְחָתָ֔/ם סֹ֖לֶת בְּלוּלָ֣ה בַ/שָּׁ֑מֶן שְׁלֹשָׁ֤ה עֶשְׂרֹנִים֙ לַ/פָּ֔ר שְׁנֵ֥י עֶשְׂרֹנִ֖ים לָ/אָֽיִל׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/003.yaml
  text: 'And their grain offering shall be fine flour mixed with oil: three-tenths for the bull[a], two-tenths for the ram.'
translation:
  language: zh_hans
  text: 同献的素祭，要用调油的细面：为那公牛献十分之三伊法[a]，为那公绵羊献十分之二伊法。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “十分之三伊法”和“十分之二伊法”分别约为六升和四升；伊法是古代以色列使用的干量单位，实际容量的估算不尽一致。
    reason: cultural_note
lexical_decisions:
- source_word: וּמִנְחָתָם
  choice: 同献的素祭
  rationale: מִנְחָה在献祭条例中指以谷物为主的素祭；前缀וּ结合上下文表达伴随前述祭牲一同献上的意思。
- source_word: סֹלֶת
  choice: 细面
  rationale: 指献祭所用的优质细磨面粉；“细面”简明、庄重，也符合中文圣经祭礼语境。
- source_word: בְּלוּלָה בַשָּׁמֶן
  choice: 调油的
  rationale: 被动分词表示细面已与油混合；“调油”自然地表达这种预备方式。
- source_word: שְׁלֹשָׁה עֶשְׂרֹנִים
  choice: 十分之三伊法
  rationale: עִשָּׂרוֹן是伊法的十分之一；在正文中补明“伊法”，使现代读者不必仅凭注释推断计量单位。
- source_word: לַפָּר
  choice: 为那公牛献
  rationale: פַּר在祭祀语境中指公牛；定冠词及单数依照本节所列的特定祭牲译出。
- source_word: שְׁנֵי עֶשְׂרֹנִים
  choice: 十分之二伊法
  rationale: 准确表达两个十分之一伊法，并与前项保持平行。
- source_word: לָאָיִל
  choice: 为那公绵羊献
  rationale: אַיִל指成年雄性绵羊；“公绵羊”比单说“公羊”更明确，避免与山羊混淆。
theological_decisions: []
