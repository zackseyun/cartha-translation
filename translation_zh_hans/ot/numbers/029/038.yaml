  text: וּ/שְׂעִ֥יר חַטָּ֖את אֶחָ֑ד מִ/לְּ/בַד֙ עֹלַ֣ת הַ/תָּמִ֔יד וּ/מִנְחָתָ֖/הּ וְ/נִסְכָּֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/038.yaml
  text: and one goat for a sin offering[b][a], besides the regular burnt offering and its grain offering and its drink offering.
translation:
  language: zh_hans
  text: 还要献一只公山羊作赎罪祭[a]。这是在常献的燔祭[b]及其素祭和奠祭以外另献的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“一只山羊作赎罪祭”。希伯来语שָׂעִיר在献祭语境中常特指公山羊。
    reason: lexical_alternative
  - marker: b
    text: 或译：“持续献的燔祭”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/שְׂעִיר
  choice: 还要献一只公山羊
  rationale: שָׂעִיר指山羊，在献祭语境中通常特指公山羊；结合后置数词אֶחָד，译为“一只公山羊”，并用“还要献”自然承接上下文。
- source_word: חַטָּאת
  choice: 作赎罪祭
  rationale: חַטָּאת在祭祀语境中指赎罪祭，而非抽象的“罪”；“作赎罪祭”符合现代汉语表达。
- source_word: אֶחָד
  choice: 一只
  rationale: 基数词表明祭牲数量；按汉语习惯配合量词“只”。
- source_word: מִ/לְּ/בַד
  choice: 在……以外另献的
  rationale: מִלְּבַד说明此祭是在既定常献祭物之外追加的；该表达清楚呈现附加关系。
- source_word: עֹלַת הַ/תָּמִיד
  choice: 常献的燔祭
  rationale: עֹלָה指燔祭，תָּמִיד表示持续或按规定经常进行；“常献的燔祭”既简洁又保留其周期性、持续性的含义。
- source_word: וּ/מִנְחָתָ/הּ
  choice: 及其素祭
  rationale: מִנְחָה在祭司礼仪语境中指伴随献上的谷物祭，即“素祭”；阴性单数后缀指回“燔祭”。
- source_word: וְ/נִסְכָּ/הּ
  choice: 和奠祭
  rationale: נֶסֶךְ指随祭物献上的液体祭，即“奠祭”；后缀同样指回“燔祭”，汉语中由前面的“其”统摄并列的两项。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的礼仪用语。“燔祭、素祭、奠祭、赎罪祭”沿用简体中文圣经语境中通行且辨识度高的祭祀术语；后一句调整语序，使“另献”的关系在汉语中明确。
