  text: וְ/הִקְרַבְתֶּ֨ם עֹלָ֤ה לַֽ/יהוָה֙ רֵ֣יחַ נִיחֹ֔חַ פַּ֧ר בֶּן בָּקָ֛ר אֶחָ֖ד אַ֣יִל אֶחָ֑ד כְּבָשִׂ֤ים בְּנֵֽי שָׁנָה֙ שִׁבְעָ֔ה תְּמִימִ֖ם יִהְי֥וּ לָ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/008.yaml
  text: 'You shall present a burnt offering to Yahweh[a], a pleasing aroma: one bull from the herd, one ram, and seven male lambs a year old; they shall be without blemish for you.'
translation:
  language: zh_hans
  text: 你们要把燔祭献给雅威，作为蒙悦纳的馨香[a]：一头公牛、一只公绵羊和七只一岁的公羊羔；你们献上的这些祭牲都要毫无残疾。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“安宁的香气”。这是希伯来文固定的献祭用语，表示祭物蒙雅威悦纳。
    reason: 说明固定礼仪用语的字面替代译法及其在献祭语境中的惯用含义，避免将香气误解为对人的单纯感官效果。
lexical_decisions:
- source_word: וְהִקְרַבְתֶּם
  choice: 你们要把……献上
  rationale: הקריב在献祭语境中指把祭物带近并献上；“献上”自然表达礼仪行动，也保留命令语气。
- source_word: עֹלָה
  choice: 燔祭
  rationale: 这是整只焚烧献上的祭物；“燔祭”是现代中文圣经语体中清楚而稳定的对应词。
- source_word: לַיהוָה
  choice: 献给雅威
  rationale: 介词ל表示祭物献给谁；יהוה按其专名译作“雅威”。
- source_word: רֵיחַ נִיחֹחַ
  choice: 蒙悦纳的馨香
  rationale: 这是固定的献祭用语，表达祭物在神面前蒙悦纳；保留“香气”的比喻，同时避免误解为单纯的嗅觉描写。
- source_word: פַּר בֶּן בָּקָר אֶחָד
  choice: 一头公牛
  rationale: 该短语指牛群中的一头公牛；中文用“一头公牛”即可自然、准确地表达，不强行加入原文未明确限定的年龄。
- source_word: אַיִל אֶחָד
  choice: 一只公绵羊
  rationale: אַיִל在祭牲清单中指成年的公绵羊；此译法明确其种类和性别。
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה שִׁבְעָה
  choice: 七只一岁的公羊羔
  rationale: כְּבָשִׂים为阳性羊羔，בְּנֵי שָׁנָה意为一岁；译文保留数量、年龄和性别。
- source_word: תְּמִימִם יִהְיוּ לָכֶם
  choice: 你们所献的都要没有残疾
  rationale: תְּמִימִם在献祭语境中指没有身体缺陷；把לָכֶם自然表达为“你们所献的”，既保留与献祭者的关系，也符合现代汉语。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；音译“雅威”保留其作为立约专名的性质，不以称号替代。
- issue: רֵיחַ נִיחֹחַ所表达的祭物功用
  choice: 蒙悦纳的馨香
  alternative: 安抚的香气；悦人的香气
  rationale: 该固定表达既保留香气意象，又指向祭物在神面前蒙悦纳；不将其解释成神需要被情绪性地安抚。
translation_notes:
  register: 采用现代、庄重而易懂的礼仪语体。保留“燔祭”“馨香”等已广为理解的祭祀术语；量词按现代汉语分别使用“头”和“只”。
