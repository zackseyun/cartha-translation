id: NUM.29.6
reference: Numbers 29:6
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: מִ/לְּ/בַד֩ עֹלַ֨ת הַ/חֹ֜דֶשׁ וּ/מִנְחָתָ֗/הּ וְ/עֹלַ֤ת הַ/תָּמִיד֙ וּ/מִנְחָתָ֔/הּ וְ/נִסְכֵּי/הֶ֖ם כְּ/מִשְׁפָּטָ֑/ם לְ/רֵ֣יחַ נִיחֹ֔חַ אִשֶּׁ֖ה לַ/יהוָֽה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/006.yaml
  text: besides the burnt offering of the month and its grain offering[a], and the regular burnt offering and its grain offering, and their drink offerings, according to their ordinance, as a pleasing aroma[b], a food offering to Yahweh.
translation:
  language: zh_hans
  text: 此外，还要献每月的燔祭[a]和同献的素祭、常献的燔祭和同献的素祭，以及各自的奠祭。这些都要按规定献上，作为蒙悦纳的馨香，是献给雅威的火祭[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “每月的燔祭”很可能指月朔所献的燔祭；希伯来文直译为“月的燔祭”。
    reason: 保留原文字面措辞及其可能所指之间的差别。
  - marker: b
    text: “火祭”也可译作“在火中献上的祭物”；有些译本译作“食物祭”。
    reason: 说明 אִשֶּׁה 这一祭祀术语的主要译法及词义讨论。
lexical_decisions:
- source_word: מִלְּבַד
  choice: 此外，还要
  rationale: 表明本节所列祭物是在此前规定的祭物之外另行加献；这一表达符合现代汉语清单语境。
- source_word: עֹלַת הַחֹדֶשׁ
  choice: 每月的燔祭
  rationale: 保留希伯来文“月的燔祭”这一措辞，同时用自然汉语表达其周期性；所指很可能是月朔祭，但正文不将这一推断明说。
- source_word: מִנְחָתָהּ
  choice: 同献的素祭
  rationale: 祭祀语境中的 מִנְחָה 指随燔祭献上的谷物祭；“同献的”自然表达阴性单数后缀与前项燔祭的所属关系。
- source_word: עֹלַת הַתָּמִיד
  choice: 常献的燔祭
  rationale: תָּמִיד 强调持续按例献上；“常献的燔祭”既保留礼仪术语，也不额外限定为某一具体时刻。
- source_word: וְנִסְכֵּיהֶם
  choice: 以及各自的奠祭
  rationale: נֶסֶךְ 是浇奠的饮料祭；复数后缀涵盖前述各项祭物，“各自的”在汉语中清楚呈现这一关系。
- source_word: כְּמִשְׁפָּטָם
  choice: 都要按规定献上
  rationale: מִשְׁפָּט 在祭礼语境中指既定规例；此译法自然地表达依照各项祭礼规定执行。
- source_word: לְרֵיחַ נִיחֹחַ
  choice: 作为蒙悦纳的馨香
  rationale: 保留祭祀公式中的香气意象，并表达该短语所传达的蒙神接纳之意。
- source_word: אִשֶּׁה
  choice: 火祭
  rationale: 这是与在火上献祭有关的礼仪术语；“火祭”简洁、庄重且为汉语读者熟悉，同时在脚注保留另一种解释。
- source_word: לַיהוָה
  choice: 献给雅威
  rationale: 介词 לְ 在此表示祭物奉献的对象；“雅威”直接音译四字神名 יהוה。
theological_decisions:
- issue: 四字神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用神的专名；采用“雅威”以音译该名，而不以称号替代，也不沿用源自后期混合读音的传统形式。
- issue: 祭祀术语 אִשֶּׁה 的译法
  choice: 火祭
  alternative: 食物祭；在火中献上的祭物
  rationale: 该词的确切构词和礼仪侧重点存在讨论。正文采用自然且传统可辨的“火祭”，脚注提示也可理解为在火中献上的祭物，避免把词义完全锁定为“食物”。
- issue: עֹלַת הַחֹדֶשׁ 是否明确译为月朔祭
  choice: 每月的燔祭
  alternative: 月朔的燔祭
  rationale: 上下文很可能指月朔所献的祭，但本节字面只说“月的燔祭”；正文保留这种措辞，脚注说明其可能所指。
translation_notes:
  register: 采用现代、庄重而易懂的礼仪用语。“燔祭、素祭、奠祭、馨香、火祭”保持术语一致性；以分句和第二句承接祭祀目的，避免希伯来语长串并列在汉语中显得生硬。所有脚注标记均置于正文相应词语之后。
