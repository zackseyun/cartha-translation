base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/014.yaml
  text: 'And their grain offering shall be fine flour mixed with oil: three-tenths for each bull[a], for the thirteen bulls, and two-tenths for each ram, for the two rams.'
translation:
  language: zh_hans
  text: 他们的素祭，是用调油的细面：为十三头公牛，每头伊法的十分之三；为两只公绵羊，每只伊法的十分之二。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文作“十分之三”和“十分之二”，所用单位传统上理解为伊法的十分之一。
    reason: cultural_note
lexical_decisions:
- source_word: וּמִנְחָתָם
  choice: 同献的素祭
  rationale: מִנְחָה在祭祀语境中特指以谷物为主的素祭；结合上下文，译为“同献的”可自然表达它与所列牲畜一同献上。
- source_word: סֹלֶת
  choice: 细面
  rationale: 这是祭祀条例中指精细研磨面粉的固定用语；“细面”简洁、庄重，也符合中文圣经礼仪语境。
- source_word: בְּלוּלָה בַשָּׁמֶן
  choice: 调油的
  rationale: 被动分词表示细面经过与油掺和的预备；“调油的”在中文中自然，并保留原文动作含义。
- source_word: שְׁלֹשָׁה עֶשְׂרֹנִים
  choice: 十分之三伊法
  rationale: עִשָּׂרוֹן是十分之一单位，传统上即十分之一伊法；在正文补出“伊法”，可使现代读者明确这是容量单位。
- source_word: לַפָּר הָאֶחָד
  choice: 每头
  rationale: 字面为“给那一头公牛”，在数只牲畜的配额条例中具有逐一分配的作用，译作“每头”最自然。
- source_word: לִשְׁלֹשָׁה עָשָׂר פָּרִים
  choice: 十三头公牛
  rationale: 指前文所列、适用相同配额的整组十三头公牛；中文不需另加定冠词。
- source_word: שְׁנֵי עֶשְׂרֹנִים
  choice: 十分之二伊法
  rationale: 与前一度量平行，明确译出伊法，既准确又避免“十分之二”所指不明。
- source_word: לָאַיִל הָאֶחָד
  choice: 每只
  rationale: 单数定冠词结构在此具有分配义；配合“公绵羊”，中文量词用“只”。
- source_word: לִשְׁנֵי הָאֵילִם
  choice: 两只公绵羊
  rationale: אַיִל在祭牲语境中指成年公绵羊；“公绵羊”比单说“公羊”更明确地区别于公山羊。
theological_decisions: []
