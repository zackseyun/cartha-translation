  text: אֵ֛לֶּה תַּעֲשׂ֥וּ לַ/יהוָ֖ה בְּ/מוֹעֲדֵי/כֶ֑ם לְ/בַ֨ד מִ/נִּדְרֵי/כֶ֜ם וְ/נִדְבֹתֵי/כֶ֗ם לְ/עֹלֹֽתֵי/כֶם֙ וּ/לְ/מִנְחֹ֣תֵי/כֶ֔ם וּ/לְ/נִסְכֵּי/כֶ֖ם וּ/לְ/שַׁלְמֵי/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/039.yaml
  text: These you shall offer to Yahweh at your appointed times[a], besides your vow offerings and your freewill offerings, for your burnt offerings and for your grain offerings and for your drink offerings and for your peace offerings.
translation:
  language: zh_hans
  text: 这些祭，你们要在所定的节期献给雅威；除你们所许的愿和自愿献的祭以外，即你们的燔祭、素祭、奠祭和平安祭[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“团契祭”。希伯来语这一祭的名称与平安、福祉或完整有关。
    reason: 保留שְׁלָמִים的常见替代译法及其词义范围。
lexical_decisions:
- source_word: אֵלֶּה
  choice: 这些祭
  rationale: 复数指示词回指上文规定的节期祭物；补出“祭”符合本节献祭语境，也使现代汉语表达完整自然。
- source_word: תַּעֲשׂוּ לַיהוָה
  choice: 要……献给雅威
  rationale: עָשָׂה本义为“做、办理”，在献祭语境中表示奉献祭物；译作“献给”清楚传达礼仪含义。
- source_word: בְּמוֹעֲדֵיכֶם
  choice: 在指定的节期
  rationale: מוֹעֵד兼有“指定的时间”和“节期”之意；本章论述固定宗教节期，采用“指定的节期”兼顾时间的指定性与节庆语境。
- source_word: לְבַד
  choice: 此外，还有
  rationale: 表明本节所列节期祭物不包括、也不取代许愿或自愿献上的祭；此表达符合现代汉语，并传达附加关系。
- source_word: מִנִּדְרֵיכֶם וְנִדְבֹתֵיכֶם
  choice: 你们许愿和自愿献上的
  rationale: נֶדֶר指因许愿而献之物，נְדָבָה指自愿奉献之物；在中文中用两个状语共同修饰随后列出的祭类，简洁呈现其献祭含义。
- source_word: לְעֹלֹתֵיכֶם
  choice: 燔祭
  rationale: עֹלָה指全部焚烧献上的祭物，“燔祭”是准确且沿用已久的汉语礼仪术语。
- source_word: וּלְמִנְחֹתֵיכֶם
  choice: 素祭
  rationale: 在祭司礼仪语境中，מִנְחָה通常指以谷物为主的供物；“素祭”是简明且通行的汉语圣经术语。
- source_word: וּלְנִסְכֵּיכֶם
  choice: 奠祭
  rationale: נֶסֶךְ指浇奠的液体祭物；“奠祭”准确表达倾倒献上的动作和祭物类别。
- source_word: וּלְשַׁלְמֵיכֶם
  choice: 平安祭
  rationale: שְׁלָמִים与平安、完好相关；“平安祭”保留这一词义联系及传统祭物名称。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”较贴近学界通常重构的读音，并将其作为专名呈现。
- issue: שְׁלָמִים的译法
  choice: 平安祭
  alternative: 团契祭
  rationale: “平安祭”保留该词与平安、完整的词义联系；“团契祭”强调献祭共享与相交的一面，因此在脚注中保留为可选译法。
- issue: 许愿祭、自愿祭与后列祭类的句法关系
  choice: 将“许愿和自愿献上的”连接于后列的燔祭、素祭、奠祭和平安祭
  alternative: 把“许愿祭和自愿祭”与后列四类祭物处理为彼此独立的并列项目
  rationale: 希伯来文先说“除了你们的愿和自愿奉献”，再以多个לְ引出祭物类别，关系可理解为对这些奉献所涉及类别的展开。中文采用自然连接方式，但不进一步限定每一种祭都必然同时属于两类。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“燔祭、素祭、奠祭、平安祭”保留通行的献祭术语；句式适度拆分，以清楚表达规定祭物与额外自愿奉献之间的关系。
