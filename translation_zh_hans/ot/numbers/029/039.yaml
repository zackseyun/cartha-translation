- from: 这些祭，你们要在指定的节期献给雅威；此外，还有你们许愿和自愿献上的燔祭、素祭、奠祭和平安祭[a]。
  to: 这些祭，你们要在所定的节期献给雅威；除你们所许的愿和自愿献的祭以外，即你们的燔祭、素祭、奠祭和平安祭[a]。
  rationale: 修订保留“这些祭”对上文节期祭物的回指，并以“除……以外”明确这些祭是在许愿祭和自愿祭之外。用“即”连接后列祭类，既反映原文的列举关系，也不将其不必要地限定为“许愿和自愿献上的”共同定语。
