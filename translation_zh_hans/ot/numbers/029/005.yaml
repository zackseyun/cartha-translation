  language: en
  yaml_path: translation/ot/numbers/029/005.yaml
  text: and one male goat for a sin offering[a], to make atonement for you—
translation:
  language: zh_hans
  text: 又献一只公山羊作赎罪祭，为你们赎罪[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“为你们除罪”。
    reason: 词义替代译法：כפר在祭祀语境中可侧重赎罪，也可侧重除去罪污或罪责。
lexical_decisions:
- source_word: וּ/שְׂעִיר עִזִּים אֶחָד
  choice: 又献一只公山羊
  rationale: שְׂעִיר עִזִּים指公山羊，אֶחָד明确数量为一；承接祭物清单时，וּ自然译为“又”，并补出中文语境所需的“献”。
- source_word: חַטָּאת
  choice: 作赎罪祭
  rationale: 在祭祀语境中，חַטָּאת指赎罪祭，而非抽象的“罪”；“作赎罪祭”自然地表达其祭物用途。
- source_word: לְ/כַפֵּר עֲלֵי/כֶם
  choice: 为你们赎罪
  rationale: 祭司传统中的כפר表示藉祭礼施行赎罪或除罪，עַל加人称后缀指出受益对象；“为你们赎罪”简洁、庄重，并保留其宽广的礼仪与神学含义。
theological_decisions:
- issue: 祭祀语境中כפר的译法
  choice: 为你们赎罪
  alternative: 为你们除罪
  rationale: “赎罪”是现代中文圣经语体中较为熟悉且涵盖面较广的表达，不限定具体的后期教义机制；脚注保留强调洁除罪污或消除罪责的另一种理解。
translation_notes:
  register: 采用现代、庄重而易懂的祭祀用语。“又献”使本节作为祭物清单的一部分在中文中自然连贯；句末破折号保留原段落未完、继续列举的语势。
