  text: and one male goat for a sin offering[a], besides the regular burnt offering, its grain offering, and its drink offering.
translation:
  language: zh_hans
  text: 又要献一只公山羊作赎罪祭[a]，是在常献的燔祭，以及随同燔祭所献的素祭和奠祭以外另献的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“洁净祭”。
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂעִיר עִזִּים
  choice: 公山羊
  rationale: 该短语指献祭用的雄性山羊；“公山羊”在现代汉语中清楚自然，也保留了原文所指的性别。
- source_word: אֶחָד
  choice: 一只
  rationale: 表示祭牲的数量；按汉语习惯为动物加量词“只”。
- source_word: חַטָּאת
  choice: 赎罪祭
  rationale: 在献祭语境中指祭物或祭礼，而非抽象的“罪”；“赎罪祭”是中文读者熟悉的标准译法，同时以脚注保留“洁净祭”这一可能译法。
- source_word: מִלְּבַד
  choice: 在……以外所献的
  rationale: 表明本节所列祭物是在常规祭物之外另加献上的；此表达符合现代汉语行文。
- source_word: עֹלַת הַתָּמִיד
  choice: 常献的燔祭
  rationale: תָּמִיד 在此表示按规定持续、定期献上的祭；“常献的”既保留持续重复之意，也与祭祀语境自然衔接。
- source_word: מִנְחָתָהּ
  choice: 同献的素祭
  rationale: מִנְחָה 在此指伴随燔祭献上的谷物祭；阴性单数后缀回指阴性名词“燔祭”，译作“同献的”可自然表达这种所属和伴随关系。
- source_word: וְנִסְכָּהּ
  choice: 和奠祭
  rationale: נֶסֶךְ 指倾倒献上的液体祭物；“奠祭”是准确、简洁且较为通行的中文祭祀术语，后缀同样回指燔祭。
theological_decisions:
- issue: חַטָּאת 的祭祀功能名称
  choice: 正文采用“赎罪祭”
  alternative: “洁净祭”
  rationale: “赎罪祭”沿用广为人知的祭名，不把该词仅译为抽象的“罪”；但该祭也具有除污、洁净的功能，因此以脚注保留“洁净祭”，避免消除原词的语义张力。
translation_notes:
  register: 采用现代、庄重且易懂的标准普通话。为避免末尾连续三个阴性代词在中文中所指不明，将原文的附属关系自然展开为“同献的素祭和奠祭”；并承接本章祭物清单的句法，以“又献”起句。
