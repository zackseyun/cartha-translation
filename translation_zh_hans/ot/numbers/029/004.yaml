  text: and one-tenth for each lamb[a], for the seven lambs.
translation:
  language: zh_hans
  text: 又为七只羊羔中的每一只献上十分之一[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文作“十分之一”；在这种献祭语境中，通常指一伊法的十分之一。
    reason: cultural_note
lexical_decisions:
- source_word: וְעִשָּׂרוֹן אֶחָד
  choice: 十分之一
  rationale: 原文直译为“一个十分之一”，指一种十分之一的量度。希伯来文本本节没有明说“伊法”，因此正文不补入，仅在脚注交代祭祀语境中的通常含义。句首的 וְ 承接上节；中文按经文分节独立呈现时无需机械译作“和”。
- source_word: לַכֶּבֶשׂ הָאֶחָד
  choice: 每只羊羔
  rationale: 字面为“给那一只羊羔”，在列举祭物的语境中具有逐只分配的含义，译为“每只羊羔”自然且准确。
- source_word: לְשִׁבְעַת הַכְּבָשִׂים
  choice: 七只羊羔都要这样
  rationale: 该短语说明上述份量适用于整组七只羊羔。用“都要这样”清楚表达逐只适用的关系，避免中文中重复“每只……七只……”所产生的生硬感。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的祭祀法规用语。“献”依据上下文补出，使本节作为承接句在中文中语意完整；不在正文补出原文未明说的“伊法”。
