  text: 又建造了伯宁拉和伯哈兰两座坚城，并建造羊圈。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֵּית נִמְרָה
  choice: 伯宁拉
  rationale: 这是地名，采用现代中文圣经中较易辨识的传统音译，不按字面译作“宁拉之家”。
- source_word: בֵּית הָרָן
  choice: 伯哈兰
  rationale: 这是固定城名，采用音译，避免按构词形式误解为普通短语“哈兰之家”。
- source_word: עָרֵי מִבְצָר
  choice: 这两座坚城
  rationale: 该短语指设有防御工事的城；“坚城”简洁自然。“两座”由前面并列的两个城名明确得出。
- source_word: גִדְרֹת צֹאן
  choice: 羊圈
  rationale: 指为羊群修筑的围栏或圈舍；“羊圈”是现代汉语中自然、准确而简洁的表达。
- source_word: וְאֶת ... וְאֶת ... וְ
  choice: 又……、……，并……
  rationale: 重复的连词与宾格标记承接上一节的建城清单；汉语用“又……并……”自然保留其递加关系，无须逐一翻译宾格标记。
- source_word: עָרֵי ... וְגִדְרֹת
  choice: 建了……并修筑了……
  rationale: 本节在希伯来语中承接上一节的动词“建造”；为使独立经节在中文中完整可读，补出省略的谓语，并按宾语性质分别用“建了”和“修筑了”。
