  text: וְ/לָ֣/מָּה תנואו/ן אֶת לֵ֖ב בְּנֵ֣י יִשְׂרָאֵ֑ל מֵֽ/עֲבֹר֙ אֶל הָ/אָ֔רֶץ אֲשֶׁר נָתַ֥ן לָ/הֶ֖ם יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/007.yaml
  text: And why do you discourage the hearts of the sons of Israel from crossing over into the land that Yahweh has given them?[a][b]
translation:
  language: zh_hans
  text: 你们为什么要挫伤以色列人的心志，拦阻他们渡过去进入雅威赐给他们的那片土地呢？[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “挫伤……的心志”也可译作“使……灰心”或“削弱……的勇气和决心”。原文直指“心”，这里表示勇气或决心受到挫伤。
    reason: lexical_alternative
  - marker: b
    text: “以色列人”原文直译为“以色列的儿子们”，也可译作“以色列的子孙”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָמָּה
  choice: 你们为什么
  rationale: 用问句承接上文；汉语中不必机械译出连接词“和”，语篇联系仍然清楚。
- source_word: תנואון אֶת לֵב
  choice: 使……的心灰下来
  rationale: 使役动词在这里表示削弱勇气或决心；保留“心”的意象，同时以现代汉语“心灰下来”传达使人泄气、退缩之意。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 这是现代汉语对该民族称谓最自然、准确的表达；字面为“以色列的儿子们”，但在这里整体指以色列民。
- source_word: מֵעֲבֹר
  choice: 不肯渡过去
  rationale: מִן加不定式受前面的使役动词支配，表达阻使他们不去跨越；“渡过去”也保留了过河进入那地的语境。
- source_word: אֶל הָאָרֶץ
  choice: 进入……那片土地
  rationale: אֶל表示朝向，而本句语境是渡河进入该地；“进入”符合自然汉语并明确运动方向。
- source_word: אֲשֶׁר נָתַן לָהֶם
  choice: 赐给他们的
  rationale: 完成式把赐地陈述为已经确立的行动；汉语定语结构自然保留这一既成赐予。
- source_word: יְהוָה
  choice: 雅威
  rationale: 直接音译四字神名，不以称号替代，保留原文使用的专名。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文使用四字神名；“雅威”较直接反映学界通常重建的读音，同时不把专名改译为“主”。
- issue: בְּנֵי יִשְׂרָאֵל 的民族称谓
  choice: 以色列人
  alternative: 以色列的子孙
  rationale: 此处是代表整个民族的固定表达。“以色列人”在现代普通话中自然且不误限为男性；脚注保留较字面的亲族表达。
- issue: “使心灰下来”与阻止过河的关系
  choice: 不肯渡过去
  alternative: 不渡过去
  rationale: 原文表达使他们因灰心而不去渡河，并未说明外力强制阻挡；“不肯”突出意愿和决心被削弱，但不把因果关系解释得过度确定。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。“心灰下来”保留希伯来文“心”的意象，又能表达勇气和决心受到削弱；“渡过去，进入”照顾约旦河渡越及入地的语境。所有脚注标记均置于正文中。
