base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/015.yaml
  text: For if you turn back from following him[a], he will again leave him in the wilderness[b], and you will bring ruin on all this people.
translation:
  language: zh_hans
  text: 因为你们若转身不再跟随他[a]，他必再把这百姓留在旷野[b]，你们也必使这全体百姓灭亡。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“从他后面转回”，是指不再跟随他。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文这里用阳性单数代词，直译为“把他留在旷野”；这个单数代词很可能集合性地指以色列民。也可译作“把他们留在旷野”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为……若
  rationale: 兼顾本句承接上文、说明警告根据的语气，以及条件句的作用。
- source_word: תְשׁוּבֻן מֵאַחֲרָיו
  choice: 你们若转身不再跟随他
  rationale: שׁוב 与 מֵאַחֲרָיו 连用，表示从跟随某人转回；译为“不再跟随”既自然，又保留背离行动方向的意味。
- source_word: וְיָסַף עוֹד
  choice: 必再
  rationale: יסף 与 עוד 合用表示再次做某事；“再”准确表达重复之意，“必”体现此处警告的确定语气。
- source_word: לְהַנִּיחוֹ בַּמִּדְבָּר
  choice: 把这百姓留在旷野
  rationale: נוח 的使役式在此指让其继续留在那里。中文明确说“这百姓”，避免“把他留在旷野”被误解为某个男性个体；脚注保留希伯来文单数代词这一形式。
- source_word: וְשִׁחַתֶּם
  choice: 你们也必使……灭亡
  rationale: שׁחת 在此具有造成毁灭、败亡的含义；“使……灭亡”保留因以色列众支派背离而招致全体受审判的因果意味。
- source_word: לְכָל הָעָם הַזֶּה
  choice: 这全体百姓
  rationale: הָעָם 是集合单数，“这全体百姓”在现代汉语中自然，并表达全体共同受影响。
theological_decisions:
- issue: לְהַנִּיחוֹ 中单数代词的所指
  choice: 正文明确译作“把这百姓留在旷野”，脚注说明原文使用阳性单数代词，集合性地指以色列民。
  alternative: 形式上直译为“把他留在旷野”，或改用复数“把他们留在旷野”。
  rationale: 希伯来文确为单数后缀，但上下文所指是作为一个整体的百姓。中文直译“他”容易使读者误以为指某个个人；明确集合性所指，同时用脚注保存原文形式，既不掩盖文本现象，也避免误读。
- issue: וְשִׁחַתֶּם 所表达的责任与结果
  choice: 译为“你们也必使这全体百姓灭亡”。
  alternative: 译为“你们必毁灭这全体百姓”或“你们必给这全体百姓带来灾祸”。
  rationale: 本句将百姓的败亡归为听者背离所造成的结果，却没有说明他们亲手杀灭百姓。“使……灭亡”保留这种因果责任及审判张力，不额外限定毁灭的方式。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“旷野”沿用《摩西五经》叙事中的常用表达；“这全体百姓”体现希伯来文集合名词的整体性。正文中的所有脚注标记均与脚注对应。
