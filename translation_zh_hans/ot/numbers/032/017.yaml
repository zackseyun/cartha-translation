base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/017.yaml
  text: But we ourselves will arm ourselves quickly before the sons of Israel[a], until we have brought them to their place[b]; and our little ones will remain in the fortified cities because of the inhabitants of the land.
translation:
  language: zh_hans
  text: 但我们自己要迅速武装起来，走在以色列人前面[a]，直到把他们领到他们的地方；我们的孩子和家眷[b]要留在坚固城里，因为当地的居民。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “走在……前面”也可译作“在以色列人面前”；原文在此很可能指在战斗中走在以色列队伍前方。
    reason: lexical_alternative
  - marker: b
    text: “孩子和家眷”原文是一个集合名词，指幼儿，也可广泛包括需要照顾的家属。
    reason: cultural_note
lexical_decisions:
- source_word: נֵחָלֵץ
  choice: 武装起来
  rationale: 该词为חלץ的尼法勒形式，在本语境中具有反身或中动态含义，表示说话者装备自己出战。
- source_word: חֻשִׁים
  choice: 迅速
  rationale: 此词可表示急速、敏捷或整装待发。译作“迅速”既保留行动果断迅捷之意，也避免与“武装起来”重复；其军事性译法见脚注。
- source_word: לִפְנֵי בְּנֵי יִשְׂרָאֵל
  choice: 走在以色列人前面
  rationale: לִפְנֵי字面是“在……面前”，军事语境中很可能指走在以色列队伍前方；正文自然呈现此义，同时以脚注保留较宽泛的字面可能。
- source_word: עַד אֲשֶׁר אִם
  choice: 直到
  rationale: 这一组合在此习惯性地标示行动的终点，现代汉语用“直到”最为自然。
- source_word: הֲבִיאֹנֻם
  choice: 把他们领到
  rationale: בוא的使役形表示使其来到，即“带到、领到”；“领到”符合前往并协助占领定居地的语境。
- source_word: אֶל מְקוֹמָם
  choice: 自己的地方
  rationale: 原文直译为“他们的地方”，指以色列其他支派将得的地方；汉语中以“他们”为主语时，“自己的地方”自然且不将其过度限定为产业或定居点。
- source_word: טַפֵּנוּ
  choice: 我们的孩子和家眷
  rationale: טַף是集合名词，通常包括幼儿，也可广指需要照顾的家属；“孩子和家眷”比单译“孩子”更完整传达其范围。
- source_word: בְּעָרֵי הַמִּבְצָר
  choice: 在坚固城里
  rationale: 该结构指设防、坚固的城邑；“坚固城”简洁庄重，也符合圣经历史叙事语体。
- source_word: מִפְּנֵי יֹשְׁבֵי הָאָרֶץ
  choice: 以躲避当地的居民
  rationale: מִפְּנֵי在此表示面对威胁而防范或躲避。译文明确坚固城所提供的保护，同时“当地的居民”自然表达该地居民。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事用语。“以色列人”自然表达בני ישראל，避免生硬直译为“以色列的众子”。分号保留两项安排之间的并列关系。
