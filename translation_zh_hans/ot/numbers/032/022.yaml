  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/נִכְבְּשָׁ֨ה הָ/אָ֜רֶץ לִ/פְנֵ֤י יְהוָה֙ וְ/אַחַ֣ר תָּשֻׁ֔בוּ וִ/הְיִיתֶ֧ם נְקִיִּ֛ים מֵ/יְהוָ֖ה וּ/מִ/יִּשְׂרָאֵ֑ל וְ֠/הָיְתָה הָ/אָ֨רֶץ הַ/זֹּ֥את לָ/כֶ֛ם לַ/אֲחֻזָּ֖ה לִ/פְנֵ֥י יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/022.yaml
  text: and the land is subdued before Yahweh[a], then afterward you may return and be free of obligation to Yahweh and to Israel[b], and this land shall be yours as a possession before Yahweh.
translation:
  language: zh_hans
  text: 这地在雅威[a]面前被制伏以后，你们就可以回来，对雅威和以色列不再负有责任[b]；这地也要在雅威面前成为你们的产业。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “雅威”是希伯来文中上帝的名字；传统上也常译作“耶和华”，或以“主”代称。
    reason: divine_name
  - marker: b
    text: “不再负有责任”也可译作“在雅威和以色列面前无罪（或清白）”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנִכְבְּשָׁה
  choice: 被制伏
  rationale: 该词是 כבש 的尼法勒式，表达土地被置于控制之下的被动、结果含义。“被制伏”既保留军事语境，也不过度强化为彻底毁灭。
- source_word: לִפְנֵי יְהוָה
  choice: 在雅威面前
  rationale: לִפְנֵי 表示“在……面前／在……临在中”，这里兼有在上帝鉴察和认可之下的含义；采用“在……面前”保留原文的关系与盟约语气。
- source_word: וְאַחַר תָּשֻׁבוּ
  choice: 以后，你们就可以回来
  rationale: וְאַחַר 标明先后次序；未完成式在前文条件得到满足后，表示随后获准或能够采取的行动。中文以“以后……就可以”自然呈现这一条件—结果关系。
- source_word: וִהְיִיתֶם נְקִיִּים
  choice: 不再负有责任
  rationale: נָקִי 可指清白、无罪，也可指免于责任或追究。本段讨论履行对雅威和以色列所承诺的军事义务，因此正文采用合乎语境的“不再负有责任”，并以脚注保留“无罪／清白”的词义可能。
- source_word: מֵיְהוָה וּמִיִּשְׂרָאֵל
  choice: 对雅威和以色列
  rationale: 介词 מִן 与 נָקִי 连用，表示相对于某人不再承担责任或不受追究。现代汉语用“对……不再负有责任”比逐字译作“从……”更自然。
- source_word: לַאֲחֻזָּה
  choice: 为产业
  rationale: אֲחֻזָּה 指持有的土地产业，常含可持续承受的土地权益。“产业”简洁保留土地归属及承受意味。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以“雅威”音译四字神名，保留其作为以色列上帝之专名的性质，而不以称号替代。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文使用的是上帝的专名而非一般称号；“雅威”直接音译该名，并在脚注说明传统替代译法。
- issue: נְקִיִּים 在盟约责任语境中的含义
  choice: 不再负有责任
  alternative: 无罪；清白
  rationale: 这里所说的是各支派完成所承诺的军事责任后，不再对雅威和以色列负有该项义务；同时该词本身也可表达无罪或清白，故不在脚注中排除这一层面。
- issue: 土地被制伏与归为产业的神学关系
  choice: 保留两处“在雅威面前”
  alternative: 省略第二处或意译为“蒙雅威认可”
  rationale: 重复措辞表明征服与土地归属都处于雅威的鉴察和认可之下。保留重复可避免把原文的神学关系简化为单纯军事占有。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“被制伏”保留被动结果含义；“不再负有责任”贴合本段履行承诺的语境，但借脚注保留 נָקִי 的司法和道德含义。“产业”沿用清晰且较为庄重的土地承受用语。
