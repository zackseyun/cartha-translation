  text: וַֽ/יַּעֲל֞וּ עַד נַ֣חַל אֶשְׁכּ֗וֹל וַ/יִּרְאוּ֙ אֶת הָ/אָ֔רֶץ וַ/יָּנִ֕יאוּ אֶת לֵ֖ב בְּנֵ֣י יִשְׂרָאֵ֑ל לְ/בִלְתִּי בֹא֙ אֶל הָ/אָ֔רֶץ אֲשֶׁר נָתַ֥ן לָ/הֶ֖ם יְהוָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/009.yaml
  text: They went up as far as the Valley of Eshcol and saw the land[c][b][a], and they discouraged the heart of the sons of Israel from going into the land that Yahweh had given them.
translation:
  language: zh_hans
  text: 他们上到以实各谷，察看了那地，又使以色列人[a]心灰意冷[b]，以致他们不进入雅威[c]赐给他们的地。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译“以色列众子”，是对以色列民族的惯常称呼。
    reason: lexical_alternative
  - marker: b
    text: 或译：“使以色列人的心转离”，即使他们灰心退缩。原文“心”用单数，将整个群体视为一体。
    reason: lexical_alternative
  - marker: c
    text: “雅威”是希伯来文神名 יהוה（YHWH）的音译；传统上也译作“耶和华”或以“上主”代称。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲלוּ
  choice: 他们上到
  rationale: עלה表示“上去、登上”；“上到”既保留方向感，也自然衔接目的地。
- source_word: עַד נַחַל אֶשְׁכּוֹל
  choice: 以实各谷
  rationale: נחל可指河谷、溪谷或旱谷；此处采用通顺且通行的地名“以实各谷”。עַד所表达的“直到、远至”在“上到”这一结构中已自然体现。
- source_word: וַיִּרְאוּ אֶת הָאָרֶץ
  choice: 察看了那地
  rationale: ראה基本义为“看见、观看”；结合探察土地的叙事语境，“察看”比单纯“看见”更贴切，但不增添正式侦察等源文未明说的细节。
- source_word: וַיָּנִיאוּ אֶת לֵב בְּנֵי יִשְׂרָאֵל
  choice: 使以色列人心灰意冷
  rationale: 使役形式表达使人退缩、灰心或心意转离；“心灰意冷”自然传达 לֵב 所指的内在勇气和决心，同时保留使役关系。
- source_word: לְבִלְתִּי בֹא אֶל הָאָרֶץ
  choice: 不肯进入……地
  rationale: לְבִלְתִּי加不定式表示不去做或被阻止去做；在“使……心灰意冷”之后译作“不肯进入”，清楚表达他们因受影响而不愿进入。
- source_word: אֲשֶׁר נָתַן לָהֶם יְהוָה
  choice: 雅威赐给他们的
  rationale: נתן为完成式，叙述雅威已经赐下这地；中文定语结构无需另加过去完成标记。“雅威”直接呈现神名 יהוה。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 源文直接使用四字神名；“雅威”较贴近通常重构的读音，并借脚注说明其性质，不以称号替代专名。
- issue: “以色列众子”作为群体称谓
  choice: 以色列人
  alternative: 以色列众子
  rationale: בְּנֵי יִשְׂרָאֵל是以色列民族的惯用称谓；正文用现代汉语自然的“以色列人”，脚注保留其字面形式及群体意味。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“又”对应连续叙事连接词，不改成带转折意味的“却”。“心灰意冷”保留原文关于“心”的意象，并准确传达勇气和意愿被削弱的语境。
