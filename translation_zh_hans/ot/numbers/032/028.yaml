base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/028.yaml
  text: So Moses commanded Eleazar the priest[a], Joshua son of Nun[b], and the heads of the fathers’ houses of the tribes of the sons of Israel concerning them.
translation:
  language: zh_hans
  text: 于是，摩西就他们的事[a]，吩咐了祭司以利亚撒、嫩的儿子约书亚，以及以色列子孙各支派的宗族首领[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“摩西吩咐他们”，把“他们”理解为本节所列的领袖，而不是上文提到的支派成员。
    reason: lexical_alternative
  - marker: b
    text: 希伯来原文直译为“以色列子孙各支派的父家首领”，是指以色列宗族和支派领袖的行政称谓。
    reason: cultural_note
lexical_decisions:
- source_word: וַיְצַו
  choice: 吩咐了
  rationale: צוה表示带有权威的命令或指示；“吩咐”既保留其权威性，也符合现代汉语叙事语体。
- source_word: לָהֶם
  choice: 就他们的事
  rationale: 此代词最自然地回指上文的吕便人和迦得人，而本节列出的领袖是受命者；译作“就他们的事”可清楚表达摩西向领袖交代有关这些人的安排，同时以脚注保留句法上的另一种理解。
- source_word: אֵת אֶלְעָזָר הַכֹּהֵן
  choice: 祭司以利亚撒
  rationale: אֵת标示צוה所支配的受命者；汉语“吩咐了祭司以利亚撒”自然表达这一关系。
- source_word: יְהוֹשֻׁעַ בִּן נוּן
  choice: 嫩的儿子约书亚
  rationale: 按现代中文圣经姓名惯例音译，并明确保留希伯来语父名结构。
- source_word: רָאשֵׁי אֲבוֹת הַמַּטּוֹת
  choice: 各支派的宗族首领
  rationale: 这是以色列社会组织的行政称谓；“宗族首领”比逐字的“父家之首”更易懂，同时保留宗族与支派两个层级。
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: 以色列
  rationale: 在“各支派”之前译作“以色列”，自然表达这些支派属于以色列民；避免生硬直译“以色列的儿子们”，而不损失其民族和谱系含义。
theological_decisions:
- issue: לָהֶם的指向及句法功能
  choice: 理解为“就他们的事”，回指上文的吕便人和迦得人
  alternative: 理解为“吩咐他们”，即指本节所列的以利亚撒、约书亚和众首领
  rationale: 紧接צוה的לָהֶם可表示有关某人的事；其后带אֵת的名单自然充当受命者。不过希伯来语容许另一种分析，因此不在正文中消除该歧义，而以脚注说明。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“就他们的事”略带正式公文色彩，适合本节行政交代的语境；“宗族首领”使古代社会结构易于普通读者理解。
