  yaml_path: translation/ot/numbers/032/010.yaml
  text: So Yahweh’s anger burned on that day[a], and he swore, saying,
translation:
  language: zh_hans
  text: 那一天，耶和华[a]的怒火燃起；他起誓说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文为“YHWH”（四字神名）；也可译作“雅威”。
    reason: 说明原文神名，并提供另一常见音译。
lexical_decisions:
- source_word: וַיִּחַר אַף
  choice: 怒火燃烧
  rationale: 这是希伯来语表示发怒的惯用语，字面意象与怒气发热、燃烧有关；译作“怒火燃烧”既保留比喻，也符合现代汉语表达。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的专名“耶和华”对应四字神名，而不以“主”这一称号替代；脚注说明原文形式及另一常见音译。
- source_word: בַּיּוֹם הַהוּא
  choice: 那一天
  rationale: 自然、准确地表达叙事中的特定时间。
- source_word: וַיִּשָּׁבַע
  choice: 就起誓
  rationale: 该词表示郑重起誓；“起誓”在现代中文中简洁庄重，并以“就”自然承接前句。
- source_word: לֵאמֹר
  choice: 说
  rationale: 用于引出下一节的誓言内容；中文以“说”接冒号最自然，同时保留其引语导入功能。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。正文采用中文读者广泛熟悉的专名“耶和华”，避免用称号“主”取代神名；脚注保留“雅威”这一较接近现代学术重构读音的译法。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。“怒火燃烧”保留希伯来语原有的热烈比喻；句末冒号表明誓言内容见下文。
