  text: בִּלְתִּ֞י כָּלֵ֤ב בֶּן יְפֻנֶּה֙ הַ/קְּנִזִּ֔י וִ/יהוֹשֻׁ֖עַ בִּן נ֑וּן כִּ֥י מִלְא֖וּ אַחֲרֵ֥י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/012.yaml
  text: except Caleb son of Jephunneh the Kenizzite[a], and Joshua son of Nun, because they fully followed Yahweh.
translation:
  language: zh_hans
  text: 只有迦勒——耶孚尼的儿子、基尼洗人——和嫩的儿子约书亚例外，因为他们完全跟随了雅威。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “完全跟随”也可译为“全心跟随”。这个希伯来语习语直译为“在雅威之后充满了”，表示完全忠于雅威、毫无保留地跟随他。
    reason: 说明希伯来语习语的字面形式及可行的自然汉语译法。
lexical_decisions:
- source_word: בִּלְתִּי
  choice: 只有……例外
  rationale: 该词承接上文，引出不在先前判决之内的两个人；用“只有……例外”既明确排他意义，也符合现代汉语表达。
- source_word: כָּלֵב בֶּן יְפֻנֶּה הַקְּנִזִּי
  choice: 基尼洗人耶孚尼的儿子迦勒
  rationale: 按希伯来语结构保留族属称谓和父子关系；人名与族名采用现代中文圣经中通行、易辨识的译名。
- source_word: וִיהוֹשֻׁעַ בִּן נוּן
  choice: 和嫩的儿子约书亚
  rationale: 连词连接第二位例外者；בִּן按谱系关系译为“……的儿子”。
- source_word: כִּי
  choice: 因为
  rationale: 此处说明迦勒和约书亚得以例外的原因，明确译出因果关系。
- source_word: מִלְאוּ אַחֲרֵי
  choice: 完全跟随了
  rationale: 这一习语字面近于“充满在……之后”，实际表达毫无保留、忠心到底地跟随；“完全跟随”保留原文意象和程度，同时避免增添“顺服”等原文未直接使用的概念。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见音译呈现四字神名，不以“主”这一称号代替其专名。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名，因此正文以“雅威”音译，保留其作为以色列之神专名的性质，而不改用称号。
- issue: מִלְאוּ אַחֲרֵי 所表达的忠诚程度
  choice: 完全跟随了
  alternative: 全心跟随了；专心跟从了
  rationale: 原文习语强调完全、毫无保留的跟随。“完全跟随”较贴近其形式，也不把这种忠诚限定为单纯的内在态度。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。经文承接上节的判决，本身在句法上具有承前性质；用“只有……例外”使其单独阅读时仍清楚，同时没有补入“得见那地”等只见于上文的内容。
