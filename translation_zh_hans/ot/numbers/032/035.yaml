lexical_decisions:
- source_word: וְאֶת
  choice: 以及／和
  rationale: וְ表示并列；אֶת是希伯来语直接宾语标记，中文无须对应翻译。为使地名列表自然流畅，首项用“以及”，末项前用“和”。
- source_word: עַטְרֹת שׁוֹפָן
  choice: 亚他录·朔反
  rationale: 这是复合地名，按希伯来语形式音译；用间隔号标明其两个组成部分，而不把它解释性地译为“朔反的亚他录”。
- source_word: יַעְזֵר
  choice: 雅谢
  rationale: 地名依希伯来语读音音译；“雅谢”是现代中文圣经语境中自然、易辨认的形式。
- source_word: יָגְבֳּהָה
  choice: 约比哈
  rationale: 地名按马所拉文本所保存的形式音译；采用简洁自然的现代中文译名。
