  text: Then they came near to him and said[a], “We will build sheepfolds here for our livestock, and cities for our little ones.”
translation:
  language: zh_hans
  text: 他们走近摩西，说：“我们要在这里为我们的牲畜建造羊圈，为我们的孩子们[a]建造城邑。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“幼小的家属”。希伯来语 טַף 指孩子或受抚养者，常着重群体中幼小、需要保护的成员。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגְּשׁוּ אֵלָיו
  choice: 他们上前到摩西那里
  rationale: נגשׁ表示走近、上前；代词“他”在上下文中指摩西。中文补出“摩西”可避免指代不清，同时保留实际趋近的动作。
- source_word: וַיֹּאמְרוּ
  choice: 说
  rationale: 采用现代汉语叙事中自然的直接引语引介方式；前句的先后关系已经清楚，无须机械译出连接词。
- source_word: גִּדְרֹת צֹאן
  choice: 羊圈
  rationale: 该结构指圈养羊群的围栏或圈舍；“羊圈”简洁、通行，也符合牧业语境。
- source_word: נִבְנֶה
  choice: 我们要……建造
  rationale: 第一人称复数未完成式在此表达说话者的打算或提议；“我们要”保留其意向性，不把它强化为命令。
- source_word: לְמִקְנֵנוּ
  choice: 为牲畜
  rationale: מִקְנֶה泛指所拥有的家畜，并不限于牛；“牲畜”在中文中准确而自然。
- source_word: פֹּה
  choice: 在这里
  rationale: 直接表达地点副词的含义。
- source_word: וְעָרִים
  choice: 也……城镇
  rationale: עָרִים可指有一定防御或聚居规模的城邑；此处“城镇”比现代意义上规模较大的“城市”更贴合古代语境。连接词译作“也”，自然呈现两项建造计划的并列。
- source_word: לְטַפֵּנוּ
  choice: 为孩子们
  rationale: טַף主要指幼小的孩子，也可按家庭或群体语境涵盖需要照顾的家属。“孩子们”是自然的正文表达，脚注保留较宽的词义范围。
