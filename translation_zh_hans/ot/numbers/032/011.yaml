source:
  edition: WLC
  text: אִם יִרְא֨וּ הָ/אֲנָשִׁ֜ים הָ/עֹלִ֣ים מִ/מִּצְרַ֗יִם מִ/בֶּ֨ן עֶשְׂרִ֤ים שָׁנָה֙ וָ/מַ֔עְלָ/ה אֵ֚ת הָ/אֲדָמָ֔ה אֲשֶׁ֥ר נִשְׁבַּ֛עְתִּי לְ/אַבְרָהָ֥ם לְ/יִצְחָ֖ק וּֽ/לְ/יַעֲקֹ֑ב כִּ֥י לֹא מִלְא֖וּ אַחֲרָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/011.yaml
  text: Surely none of the men who came up from Egypt[a], from twenty years old and upward, shall see the land that I swore to Abraham, to Isaac, and to Jacob[b], because they have not fully followed me.
translation:
  language: zh_hans
  text: “从埃及上来的男人中，凡二十岁及以上的，必没有一个会看见我向亚伯拉罕、以撒和雅各起誓应许的那片土地[a]，因为他们没有完全跟从我[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来原文直译为：“若那些人……看见那片土地。”这是誓言格式，含有强烈的否定意思，即“他们必不能看见”。
    reason: 说明原文אִם的省略式否定誓言结构。
  - marker: b
    text: 或译：“因为他们没有完全地跟从我。”
    reason: 保留מלא אחרי所表达的完全跟从之意，并提示可行的语序差异。
lexical_decisions:
- source_word: אִם
  choice: 必没有一个
  rationale: 此处是省略咒诅后果的希伯来誓言格式，以“若……看见”表达强烈否定。中文用“必没有一个”传达其实际语力，避免直译“若”造成误解。
- source_word: יִרְאוּ
  choice: 能看见
  rationale: ראה在此不只是视觉上的看见，也指亲身见到并进入应许之地；“能看见”在审判誓言中自然地表达被排除在外。
- source_word: הָאֲנָשִׁים
  choice: 那些人
  rationale: 原文为阳性复数名词，语境所指是从埃及出来、达到统计年龄的男性；“那些人”保留指称而符合现代汉语表达。
- source_word: הָעֹלִים מִמִּצְרַיִם
  choice: 从埃及上来的
  rationale: 保留עלה“上来”的出埃及惯用表达，而不将其弱化为单纯“出来”。
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: 凡二十岁以上的
  rationale: 这是年龄门槛的固定表达；“凡二十岁以上的”准确且符合现代中文习惯。
- source_word: הָאֲדָמָה
  choice: 那片土地
  rationale: אֲדָמָה本可指地土，但在此盟约语境中指列祖所得应许之地；“那片土地”明确其地域含义。
- source_word: נִשְׁבַּעְתִּי
  choice: 起誓应许
  rationale: 原词直接表示“起誓”。结合间接受词列祖和宾语“土地”，“起誓应许”在中文中自然呈现誓言所作的承诺，但“应许”属于语境明示。
- source_word: לְאַבְרָהָם לְיִצְחָק וּלְיַעֲקֹב
  choice: 向亚伯拉罕、以撒和雅各
  rationale: 三个לְ均标示誓言所向的对象；中文用一个“向”统领并列人名，更自然且不损失意义。
- source_word: כִּי
  choice: 因为
  rationale: כִּי在此说明不得见地的原因，译为“因为”清楚表达因果关系。
- source_word: לֹא מִלְאוּ אַחֲרַי
  choice: 没有全心全意地跟从我
  rationale: מלא אחרי是“完全跟从”的习语。“全心全意地跟从”传达完整、毫无保留地跟随之意，同时保留“跟从我”的关系性表达。
theological_decisions:
- issue: 以אִם引入的誓言公式
  choice: 必没有一个能看见
  alternative: 若那些人能看见
  rationale: 原文以“若……看见”构成省略式否定誓言，实际语力是庄严地宣告他们绝不能看见。直译“若”会掩盖否定含义，因此正文传达其语力，并用脚注保存原文形式。
- issue: לֹא מִלְאוּ אַחֲרַי所表达的跟从程度
  choice: 没有全心全意地跟从我
  alternative: 没有完全跟从我
  rationale: 该习语强调跟从并不彻底，而非引入抽象的教义性“忠诚”概念。正文采用自然中文，脚注列出更贴近形式的译法，以保存表达幅度。
- issue: 向列祖起誓的内容
  choice: 我向亚伯拉罕、以撒和雅各起誓应许的那片土地
  alternative: 我向亚伯拉罕、以撒和雅各起誓的土地
  rationale: 中文单说“起誓的土地”略显含混；加入“应许”显明誓言与土地的语义关系。这是上下文所包含的承诺，不扩展其神学内容。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“必没有一个”保留神圣审判誓言的力度；“从埃及上来”保留希伯来语的出埃及惯用说法。正文中的[a]、[b]均与脚注对应。
