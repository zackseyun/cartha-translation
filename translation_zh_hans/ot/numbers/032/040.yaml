  yaml_path: translation/ot/numbers/032/040.yaml
  text: So Moses gave Gilead to Machir son of Manasseh[a], and he settled in it.
translation:
  language: zh_hans
  text: 于是，摩西把基列给了玛拿西的儿子玛吉；玛吉就住在其中。［a］
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: 赐给
  rationale: נתן在此表示把土地给予某人；“赐给”自然体现摩西分授土地的语境，又不额外加入行政含义。
- source_word: הַגִּלְעָד
  choice: 基列
  rationale: 这是地名；希伯来语虽带定冠词，现代汉语地名通常不另译冠词。
- source_word: לְמָכִיר
  choice: 给玛吉
  rationale: 介词ל在这里标明接受者，译为“给玛吉”直接自然。
- source_word: בֶּן מְנַשֶּׁה
  choice: 玛拿西的儿子
  rationale: בן在这项家谱性说明中最直接的意思是“儿子”；原文没有要求将其宽泛化为“后裔”。
- source_word: וַיֵּשֶׁב
  choice: 住
  rationale: ישב可表示居住或定居。这里的土地分配语境容许“定居”，但“住”保留该词较宽的语义，也符合现代汉语表达。
- source_word: בָּהּ
  choice: 在那里
  rationale: 阴性单数后缀回指基列地区；汉语用“在那里”比“住在它里面”自然，同时明确指向该地。
