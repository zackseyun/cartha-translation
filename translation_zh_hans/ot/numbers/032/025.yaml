  yaml_path: translation/ot/numbers/032/025.yaml
  text: Then the sons of Gad and the sons of Reuben said to Moses, saying, “Your servants will do just as my lord commands.”
translation:
  language: zh_hans
  text: 迦得子孙和流便子孙对摩西说：“你的仆人必照我主所吩咐的去做。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי גָד וּבְנֵי רְאוּבֵן
  choice: 迦得子孙和吕便子孙
  rationale: בְּנֵי 在这里指两支派的成员；沿用中文圣经常见而庄重的“子孙”，同时保留原文的家族群体表达。
- source_word: לֵאמֹר
  choice: 说
  rationale: 希伯来叙事中常用的引语引介词；现代汉语不宜机械译成“说着说”，以一个“说”自然引出直接引语。
- source_word: עֲבָדֶיךָ
  choice: 你的仆人
  rationale: 保留说话者自称仆人的谦恭表达及第二人称所属关系。
- source_word: אֲדֹנִי
  choice: 我主
  rationale: 这里是对摩西的尊称，不是神名；“我主”既区别于指神的“主”，也保留原文单数第一人称所属形式。
- source_word: מְצַוֶּה
  choice: 所吩咐的
  rationale: 该分词在此表达摩西当前作出的命令；“吩咐”符合权威者对下属说话的语境。
theological_decisions:
- issue: אֲדֹנִי 的指称
  choice: 译作“我主”，指摩西
  alternative: 译作“主”或“大人”
  rationale: 上下文明确说话对象是摩西，词形也不是神名 יהוה；因此不作神称处理。“我主”较“大人”更贴近词义与古代尊称语气。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。省去希伯来语中“说……说”的重复引语结构，以免中文累赘；保留“你的仆人／我主”的谦恭关系和应允语气。
