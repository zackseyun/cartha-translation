source:
  edition: WLC
  text: וְ/אִם לֹ֤א תַעֲשׂוּ/ן֙ כֵּ֔ן הִנֵּ֥ה חֲטָאתֶ֖ם לַ/יהוָ֑ה וּ/דְעוּ֙ חַטַּאתְ/כֶ֔ם אֲשֶׁ֥ר תִּמְצָ֖א אֶתְ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/023.yaml
  text: But if you do not do so[a], behold, you have sinned against Yahweh, and know that your sin will find you out.
translation:
  language: zh_hans
  text: 但你们若不这样做，看哪，你们就得罪了雅威；你们要知道，你们的罪必追上你们[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你们的罪必找到你们”，也可理解为“你们的罪责必追上你们”。希伯来语的表达强调罪终必使犯罪者暴露，并带来无法逃避的后果。
    reason: 保留 אֲשֶׁר תִּמְצָא אֶתְכֶם 的字面拟人说法，以及 חַטָּאת 可指“罪”或“罪责”的词义空间。
lexical_decisions:
- source_word: וְאִם
  choice: 但你们若
  rationale: 承接上文并引出与顺服要求相反的条件，既保留转折意味，也符合现代汉语表达。
- source_word: לֹא תַעֲשׂוּן כֵּן
  choice: 不这样做
  rationale: 简洁回指上文所要求的行动，对应希伯来语的否定、动词及方式副词。
- source_word: הִנֵּה
  choice: 看哪
  rationale: 保留警告中的提示和强调语气；用语庄重，且为普通读者所熟悉。
- source_word: חֲטָאתֶם לַיהוָה
  choice: 你们就是得罪了雅威
  rationale: 在条件警告中，完成式说明不履行承诺所构成的既定结果；“得罪了”自然表达 חטא 与介词 ל 连用时针对某位对象犯罪的含义。
- source_word: וּדְעוּ
  choice: 你们要知道
  rationale: 保留复数命令式的直接警告语气，比单说“知道”更符合现代汉语。
- source_word: חַטַּאתְכֶם
  choice: 你们的罪
  rationale: 该词可指罪或罪责；正文采用直接的“罪”，同时在脚注中保留另一可能。
- source_word: אֲשֶׁר תִּמְצָא אֶתְכֶם
  choice: 必追上你们
  rationale: 直译为“必找到你们”，但语境强调犯罪者无法逃避罪的揭露与后果；“必追上你们”自然传达这种不可避免性，并以脚注保留字面读法。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”按其常见学术重构音译，保留其作为立约之神专名的性质，而不以称号替代。
- issue: “罪必找到你们”这一拟人化表达的含义
  choice: 你们的罪必追上你们
  alternative: 你们的罪必找到你们／你们的罪责必临到你们
  rationale: 原文把“罪”作为动词 תִּמְצָא 的主语，形成拟人化警告。正文表达其不可逃避的力量，但不把它缩减为单一的惩罚、揭露或内疚解释；脚注说明其语义张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“看哪”保留原文警告的强调色彩；其余句式力求清楚直接。脚注标记置于所解释的希伯来语惯用表达之后。
