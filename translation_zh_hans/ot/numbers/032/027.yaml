  text: וַ/עֲבָדֶ֨י/ךָ יַֽעַבְר֜וּ כָּל חֲל֥וּץ צָבָ֛א לִ/פְנֵ֥י יְהוָ֖ה לַ/מִּלְחָמָ֑ה כַּ/אֲשֶׁ֥ר אֲדֹנִ֖/י דֹּבֵֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/027.yaml
  text: But your servants will cross over[a], every man armed for battle, before Yahweh for the war[c][b], just as my lord says.
translation:
  language: zh_hans
  text: 但你的仆人都要渡过去，个个武装好[a]，在耶和华面前去打仗[b]，正如我主所说的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “武装好”也可译为“装备好服军役的人”。
    reason: lexical_alternative
  - marker: b
    text: “在耶和华面前”也可译为“在耶和华的临在中”；这句话表明他们是在耶和华面前、在他的权柄之下参与这场战争。
    reason: cultural_note
lexical_decisions:
- source_word: וַעֲבָדֶיךָ
  choice: 但你的仆人
  rationale: עֶבֶד在这里是对摩西谦恭的自称，译为“仆人”符合语境；连接词וַ按上下文带有转折意味，译为“但”。
- source_word: יַעַבְרוּ
  choice: 要……过河
  rationale: עבר在本段指渡过约旦河进入战场；中文补出语境中明确的“河”，使表达自然，同时保留越过边界的动作。
- source_word: כָּל חֲלוּץ צָבָא
  choice: 凡装备好能出战的
  rationale: כָּל配合单数形式具有逐一涵盖的作用；חֲלוּץ צָבָא指装备妥当、可服军役或出战的人。该译法不把含义收窄为仅仅携带武器。
- source_word: לִפְנֵי יְהוָה
  choice: 在耶和华面前
  rationale: 保留“在……面前／临在中”的空间与神学表达，并将四字神名按其专名译为“耶和华”。
- source_word: לַמִּלְחָמָה
  choice: 参战
  rationale: 介词לְ在此表达目的或趋向；“参战”是现代汉语中自然的表达，并与前面的过河行动相连。脚注保留较形式对应的可能译法。
- source_word: כַּאֲשֶׁר אֲדֹנִי דֹּבֵר
  choice: 正如我主所说的
  rationale: אֲדֹנִי是对摩西的尊称，并非神名；分词דֹּבֵר在当前话语中可自然译为“所说的”。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。中文圣经传统与普通读者最熟悉的专名形式是“耶和华”，既区别于称号“主”，也保留其为盟约之神专名的功能。
- issue: “在耶和华面前”的含义
  choice: 保留直译，不改写为“奉耶和华之命”
  alternative: 在耶和华的权柄下
  rationale: לִפְנֵי可兼有临在、监督和权柄之下的意味；直译能保留这些层次，避免只选定其中一种解释。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“我主”保留说话者对摩西的敬称，并与神名“耶和华”清楚区分。
