  yaml_path: translation/ot/numbers/032/030.yaml
  text: But if they do not cross over armed with you[a], then they shall receive property among you in the land of Canaan.
translation:
  language: zh_hans
  text: 但如果他们不武装着和你们一同过河，他们就要在你们中间、在迦南地得产业。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们就要在你们中间、在迦南地安置下来。”这个希伯来语动词可指被安置并持有产业，不仅指取得产业这一动作。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אִם
  choice: 但如果
  rationale: 承接上一节并引出相反条件，用“但如果”自然表达语境中的转折。
- source_word: יַעַבְרוּ
  choice: 过河
  rationale: 动词意为“越过”；本章语境明确指渡过约旦河，译作“过河”自然清楚。
- source_word: חֲלוּצִים
  choice: 带着兵器
  rationale: 该词指为作战而武装、列队；“带着兵器”既保留军事含义，也符合现代汉语表达。
- source_word: אִתְּכֶם
  choice: 和你们一同
  rationale: 准确表达随同其余以色列人行动的伴随关系。
- source_word: וְנֹאחֲזוּ
  choice: 就要让他们……得产业
  rationale: Niphal形式在分地语境中可指被安置并取得产业；此译体现其被动安排及所得结果，同时不将意义缩窄为单纯占领。
- source_word: בְּתֹכְכֶם
  choice: 你们中间
  rationale: 表示他们所得之地位于以色列群体内部，简洁贴近原文。
- source_word: בְּאֶרֶץ כְּנָעַן
  choice: 在迦南地
  rationale: 保留原文完整地名表达，明确产业所在区域。
