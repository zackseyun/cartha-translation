lexical_decisions:
- source_word: וַיִּבְנוּ
  choice: 建造了
  rationale: 希伯来语动词 בנה 在此直接叙述过去发生的行动，基本义为“建造”。上下文可能暗示重建或加固城邑，但动词本身并未明确表达这些含义。
- source_word: בְנֵי גָד
  choice: 迦得子孙
  rationale: 直译为“迦得的儿子们”，在支派语境中指迦得支派的成员。“迦得子孙”既保留希伯来语的亲属表达，也符合现代中文圣经文体。
- source_word: אֶת
  choice: 不单独译出
  rationale: 这是直接宾语标记，中文无需对应词，其语法功能由语序体现。
- source_word: דִּיבֹן
  choice: 底本
  rationale: 地名采用中文圣经中通行且便于辨认的音译。
- source_word: עֲטָרֹת
  choice: 亚他录
  rationale: 地名采用中文圣经中通行且便于辨认的音译。
- source_word: עֲרֹעֵר
  choice: 亚罗珥
  rationale: 地名采用中文圣经中通行且便于辨认的音译。
