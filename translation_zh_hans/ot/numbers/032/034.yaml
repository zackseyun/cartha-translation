  text: 迦得子孙建造了底本[a]、亚他录和亚罗珥。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 按上下文，也可理解为“重建”或“加固”；希伯来语动词本身只是“建造”。
