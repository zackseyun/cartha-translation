base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/024.yaml
  text: Build for yourselves cities for your little ones[a], and enclosures for your flocks[b], and do what has gone out from your mouth.
translation:
  language: zh_hans
  text: 你们要为自己建造城邑，给你们的幼小孩童；又要为你们的羊群和山羊群筑围栏。你们口中所出的，都要照着做[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: c
    text: 也可意译为“你们所承诺的，都要履行”。希伯来文直译是“你们口中所出的，都要做”，指实行自己说过的话。
    reason: idiom_explanation
lexical_decisions:
- source_word: בְּנוּ לָכֶם עָרִים
  choice: 你们要为自己建造城邑
  rationale: בְּנוּ是复数命令式，直译为“建造”；לָכֶם保留“为自己”的实际受益含义；עָרִים可指城或城镇，此处用庄重且常见的“城邑”。
- source_word: לְטַפְּכֶם
  choice: 供你们的孩子居住
  rationale: טַף主要指家中幼小的孩子或弱小成员。译作“孩子”自然易懂；结合“建造城邑”的语境补出“居住”，明确汉语中的用途关系，却不改变原意。
- source_word: וּגְדֵרֹת לְצֹנַאֲכֶם
  choice: 也要为你们的羊群筑圈
  rationale: גְדֵרֹת指有围栏的牲畜圈；צֹאן是以绵羊、山羊为主的小型牲畜群。译作“羊群”和“圈”简洁、自然，并符合牧养语境。
- source_word: וְהַיֹּצֵא מִפִּיכֶם תַּעֲשׂוּ
  choice: 你们口中所出的话，务要照着做
  rationale: 保留希伯来语“从口中出来”的形象及其落实所说之话的含义。“照着做”自然表达תַּעֲשׂוּ在本句中的执行意味；“务要”传达命令语气，而不把习语直接释义为“履行承诺”。
theological_decisions:
- issue: 口中所说之话是否直接明译为誓言或承诺
  choice: 保留“你们口中所出的话”的习语
  alternative: 你们所承诺的，务要履行
  rationale: 上下文表明这是要求他们兑现先前所说的话，但本节本身没有使用“誓言”或“承诺”的专门词语。保留原有表达可避免把语义范围过早限定，同时由脚注说明其语用含义。
translation_notes:
  register: 采用现代、庄重而通俗的书面语。“城邑”保留经文叙事的庄重感；“筑圈”和“照着做”则避免生硬古语。分号和句号按汉语意群划分，使三个并列命令清楚易读。
