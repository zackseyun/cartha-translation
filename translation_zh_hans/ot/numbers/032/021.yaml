  text: וְ/עָבַ֨ר לָ/כֶ֧ם כָּל חָל֛וּץ אֶת הַ/יַּרְדֵּ֖ן לִ/פְנֵ֣י יְהוָ֑ה עַ֧ד הוֹרִישׁ֛/וֹ אֶת אֹיְבָ֖י/ו מִ/פָּנָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/021.yaml
  text: and every armed man among you crosses the Jordan before Yahweh[a], until he has driven out his enemies from before him[b],
translation:
  language: zh_hans
  text: 你们中间所有武装好的人都要在雅威面前渡过约旦河，直到他把自己的仇敌从自己面前赶出去[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “赶出去”也可译作“使其失去所占之地”。这里的希伯来语动词兼有驱逐和剥夺占有权的意思。
    reason: lexical_alternative
  - marker: b
    text: “他”“自己的”最自然地指雅威；也有人理解为指以色列整体或这支武装队伍。
    reason: alternative_reading
lexical_decisions:
- source_word: וְעָבַר
  choice: 都要……渡过
  rationale: 连词加完成式在承接上一节条件句的语境中具有将来和规定意味；“要”自然表达这一要求。
- source_word: לָכֶם כָּל חָלוּץ
  choice: 你们中间所有武装好的人
  rationale: לָכֶם在这里表示与受话群体的归属关系；חָלוּץ指装备好、预备作战的人。“所有”保留כָּל的整体兼逐一意味。
- source_word: אֶת הַיַּרְדֵּן
  choice: 渡过约旦河
  rationale: “约旦河”是现代汉语中清楚自然的标准地名；“渡过”符合军队过河的语境。
- source_word: לִפְנֵי יְהוָה
  choice: 在雅威面前
  rationale: לִפְנֵי表示在某者面前或同在中；“雅威”直接音译经文中的圣名יהוה。
- source_word: הוֹרִישׁוֹ
  choice: 他……赶出去
  rationale: ירשׁ的使役式在此表示赶走或剥夺占有之地；“赶出去”自然地表达征服语境中的驱逐，同时以脚注保留“使其失去产业/占有地”的词义侧重。
- source_word: אֹיְבָיו מִפָּנָיו
  choice: 自己的仇敌从自己面前
  rationale: 两个第三人称阳性单数后缀彼此呼应；重复“自己”保留原文的代词链，也避免在正文中额外补明所指。
theological_decisions:
- issue: 神圣名字יהוה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；采用“雅威”保留专名性质，不以称号取代，也不将后起的混合读音放入正文。
- issue: הוֹרִישׁוֹ、אֹיְבָיו和מִפָּנָיו中第三人称单数代词的所指
  choice: 正文保留“他／自己”的代词表达；语境上最自然地指雅威
  alternative: 指以色列整体或武装队伍
  rationale: 紧邻的“在雅威面前”以及五经中雅威赶走敌人的征服用语支持以雅威为所指；但希伯来语的语法形式本身没有重述名词，因此不在正文中消除另一种理解，并以脚注说明。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“武装好的人”比“战士”更贴近原文所强调的装备状态；保留“在……面前”和连续代词，以呈现原文的空间意象与所指张力。
