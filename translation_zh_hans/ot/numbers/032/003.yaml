  text: Ataroth[a], Dibon, Jazer, Nimrah, Heshbon, Elealeh, Sebam, Nebo[b], and Beon—
translation:
  language: zh_hans
  text: 亚他录、底本、雅谢、宁拉、希实本、以利亚利、示班[a]、尼波和比稳[b]——
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文作“示班”；别处相关地名作“西比玛”等形式。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文作“比稳”；别处相关地名有较完整的形式“巴力免”。
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲטָרוֹת
  choice: 亚他录
  rationale: 地名，采用现代中文圣经读者较熟悉的传统译名，不按词义意译。
- source_word: דִיבֹן
  choice: 底本
  rationale: 地名，采用通行的中文音译。
- source_word: יַעְזֵר
  choice: 雅谢
  rationale: 地名，按希伯来语形式采用通行中文音译，不扩写元音。
- source_word: נִמְרָה
  choice: 宁拉
  rationale: 本节使用较短的地名形式，故译作“宁拉”，不与别处较长的“伯宁拉”协调统一。
- source_word: חֶשְׁבּוֹן
  choice: 希实本
  rationale: 地名，采用通行中文音译。
- source_word: אֶלְעָלֵה
  choice: 以利亚利
  rationale: 地名，采用中文圣经传统中较易辨认的音译。
- source_word: שְׂבָם
  choice: 示班
  rationale: 依本节马所拉文本的地名形式音译；别处相关地名有“西比玛”等形式，差异保留于脚注。
- source_word: נְבוֹ
  choice: 尼波
  rationale: 地名，采用通行中文音译。
- source_word: בְּעֹן
  choice: 比稳
  rationale: 依本节所见的较短形式音译，不以别处较长的“巴力免”替换。
- source_word: וְ / וּ
  choice: 顿号列举，末项前用“和”
  rationale: 希伯来文以重复连接词串联地名；中文若逐项重复“和”会显得生硬，因此用顿号组织清晰的名单，并在末项前保留“和”。
