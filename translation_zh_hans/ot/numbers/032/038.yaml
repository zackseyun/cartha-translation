base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/038.yaml
  text: and Nebo[a], and Baal-meon, their names having been changed, and Sibmah. And they gave names to the cities that they had built.
translation:
  language: zh_hans
  text: 还有尼波[a]、巴力·免（名字已经改了）和西比玛。他们给所建造的城起了名字。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“尼波和巴力·免（名字已经改了）。”希伯来语短语很可能说明尼波和巴力·免这两座城的名字已被更改。
    reason: 说明该短语的可能修饰范围及替代断句，同时不把这一判断过度绝对化。
lexical_decisions:
- source_word: נְבוֹ
  choice: 尼波
  rationale: 专有地名，按现代中文圣经地名的常见音译处理。
- source_word: בַּעַל מְעוֹן
  choice: 巴力·免
  rationale: 复合地名采用音译，并以间隔号标明两个构成部分，便于现代读者辨识。
- source_word: מוּסַבֹּת שֵׁם
  choice: 这些城的名字都改了
  rationale: 该被动分词短语表达名字已经改变的结果状态；复数形式很可能同时指尼波和巴力·免。用括号保留其修饰范围上的轻微歧义，避免误读为名单中的另一项。
- source_word: שִׂבְמָה
  choice: 西比玛
  rationale: 专有地名，依希伯来语辅音音译。
- source_word: וַיִּקְרְאוּ בְשֵׁמוֹת
  choice: 另起了名字
  rationale: 该结构在命名语境中表示给事物命名；“另起”也自然承接前文名字被更改的陈述。
- source_word: אֶת שְׁמוֹת הֶעָרִים
  choice: 给……城……名字
  rationale: 希伯来文直译为“城的名字”，中文以“给城起名字”表达同一命名关系，更自然清楚。
- source_word: אֲשֶׁר בָּנוּ
  choice: 所建的
  rationale: בנה 的通常含义是“建造”；即使上下文可能涉及重建或修筑，也不在译文中额外引入该含义。
