  text: וַ/יֹּאמְר֗וּ אִם מָצָ֤אנוּ חֵן֙ בְּ/עֵינֶ֔י/ךָ יֻתַּ֞ן אֶת הָ/אָ֧רֶץ הַ/זֹּ֛את לַ/עֲבָדֶ֖י/ךָ לַ/אֲחֻזָּ֑ה אַל תַּעֲבִרֵ֖/נוּ אֶת הַ/יַּרְדֵּֽן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/005.yaml
  text: And they said[a], “If we have found favor in your sight, let this land be given to your servants as a possession. Do not make us cross the Jordan.”
translation:
  language: zh_hans
  text: 他们说：“我们若在你眼前蒙恩，求你把这地赐给你的仆人作产业，不要叫我们过约旦河。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מָצָאנוּ חֵן בְּעֵינֶיךָ
  choice: 我们若在你眼前蒙恩
  rationale: 保留希伯来语“在某人眼中蒙恩”的惯用表达；“在你眼前蒙恩”在现代中文中庄重、清楚，也体现请求者盼望得到对方善意看待。
- source_word: יֻתַּן
  choice: 求你把……赐给
  rationale: 该被动形式在语境中表达礼貌请求。中文用“求你……赐给”比机械的被动句自然，并保留恳求语气。
- source_word: הָאָרֶץ הַזֹּאת
  choice: 这地
  rationale: 此处指约旦河东的土地；“这地”直接、自然，与上下文的地域含义相符。
- source_word: לַעֲבָדֶיךָ
  choice: 给你的仆人
  rationale: עבד在此是向摩西陈情时的谦称，并非突出奴役身份，因此译作“仆人”。
- source_word: לַאֲחֻזָּה
  choice: 作产业
  rationale: אֲחֻזָּה指归属并长期持有的土地。“产业”是中文圣经语境中自然且明确的表达，又不将其过度限定为继承所得。
- source_word: אַל תַּעֲבִרֵנוּ אֶת הַיַּרְדֵּן
  choice: 不要叫我们过约旦河
  rationale: עבר的使役式表明请求摩西不要使他们渡河。“叫我们过”既体现使役含义，也符合自然中文；“约旦河”明确所指水道。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“蒙恩”“仆人”“产业”保留经文的礼貌请愿语域，同时避免生硬直译。原文使役式可理解为“使我们过”或“带我们过”，正文以自然中文“叫我们过”涵盖此义，毋须脚注。
