  yaml_path: translation/ot/numbers/032/008.yaml
  text: This is what your fathers did when I sent them from Kadesh-barnea to see the land:[a]
translation:
  language: zh_hans
  text: 当我从加低斯·巴尼亚派他们去察看那地时，你们的父辈就是这样行的。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“查看那地”或“侦察那地”。希伯来语动词字面意思是“看”，在这里指前去考察那地。
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה עָשׂוּ
  choice: 也是这样做的
  rationale: כֹּה指明行事方式，并把先前一代的行为与当前情形作比较；“也是这样做的”在现代汉语中自然地保留这种比较和指示作用。
- source_word: אֲבֹתֵיכֶם
  choice: 你们的父辈
  rationale: 原文直指“你们的父亲们”，语境中指上一代人；“父辈”既保留代际意味，也比“祖先”更准确。
- source_word: בְּשָׁלְחִי אֹתָם
  choice: 我……派他们
  rationale: 介词בְּ加带第一人称后缀的不定式结构在这里表达时间背景；汉语借冒号及后续分句自然呈现“当我派他们时”的关系。
- source_word: מִקָּדֵשׁ בַּרְנֵעַ
  choice: 从加低斯·巴尼亚
  rationale: 按现代中文圣经地名惯例音译该复合地名，并用间隔号分隔两部分。
- source_word: לִרְאוֹת
  choice: 去察看
  rationale: ראה字面义为“看”，但此处指受派前往查看那地；“察看”保留视觉考察的核心含义，又不把动作过度限定为军事侦察。
- source_word: אֶת הָאָרֶץ
  choice: 那地
  rationale: 定冠词所指的土地在上下文中是双方已知的特定地域；“那地”自然保留其特指性，不额外加入“应许之地”等解释。
