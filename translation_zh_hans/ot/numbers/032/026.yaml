  yaml_path: translation/ot/numbers/032/026.yaml
  text: Our little children[a], our wives, our livestock[b], and all our animals will remain there in the cities of Gilead.
translation:
  language: zh_hans
  text: 我们的年幼的孩子[a]、妻子、牲畜和所有的家畜，都要留在[b]基列各城里。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“我们的孩子”。希伯来语טַף常特别指幼小或尚需照顾的孩子。
    reason: lexical_alternative
  - marker: b
    text: 或译“都要在那里”。希伯来语动词本义只是“要在”，但在本段语境中表示其他人出征时，他们留在那里。
    reason: lexical_alternative
lexical_decisions:
- source_word: טַפֵּנוּ
  choice: 我们的年幼孩子
  rationale: טַף常指幼小或尚需照顾的孩子；译作“年幼孩子”既体现年龄与依赖性，也不把范围限定为婴幼儿。
- source_word: נָשֵׁינוּ
  choice: 妻子
  rationale: 在家庭与支派的语境中，此复数形式自然指说话者各家的妻子。
- source_word: מִקְנֵנוּ
  choice: 牲畜
  rationale: מִקְנֶה通常指作为财产饲养的牲畜，包括牛群和羊群；“牲畜”是现代汉语中清楚而概括的对应词。
- source_word: וְכָל בְּהֶמְתֵּנוּ
  choice: 和所有的家畜
  rationale: בְּהֵמָה泛指兽类，在本语境中特别指驯养的动物；“所有的家畜”保留其广义和总括语气，虽与前项语义部分重叠，也不擅自删减原文。
- source_word: יִהְיוּ שָׁם
  choice: 都要留在……里
  rationale: 动词字面为“要在那里”，结合其他人将出征的上下文，表达留守之意；“留在”自然呈现这一语境含义。
- source_word: בְּעָרֵי הַגִּלְעָד
  choice: 在基列各城里
  rationale: עָרֵי为“城”的复数构造式；汉语用“基列各城”比“基列的城市们”自然，并清楚指基列地区的城邑。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“我们的”统领并列的四项，避免逐项重复；保留“牲畜”与“所有的家畜”之间原文存在的语义重叠。脚注[b]置于相关谓语句末，而不误附于“牲畜”。
