revisions:
- from: 摩西对他们说：“如果迦得子孙和吕便子孙中所有武装参战的人，都和你们一同渡过约旦河，在雅威面前出战，并且那地在你们面前被制伏，你们就要把基列地给他们作产业。”
  to: 摩西对他们说：“如果迦得子孙和流便子孙所有为争战武装起来的人，都和你们一同渡过约旦河，在雅威面前出战，并且那地在你们面前被制伏，你们就要把基列地给他们作产业。”
  rationale: 修订通行人名“流便”，并微调军事措辞以更贴近希伯来文“每一位为争战武装的人”。其余译法保留：条件句没有被改为时间句；“在雅威面前”没有被教义性地窄化为“为雅威”；“那地被制伏”维持原文被动式及未明言的施事者；“产业”保留土地持有权的含义。
