source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר מֹשֶׁ֜ה אֲלֵ/הֶ֗ם אִם יַעַבְר֣וּ בְנֵי גָ֣ד וּ/בְנֵי רְאוּבֵ֣ן אִ֠תְּ/כֶם אֶֽת הַ/יַּרְדֵּ֞ן כָּל חָל֤וּץ לַ/מִּלְחָמָה֙ לִ/פְנֵ֣י יְהוָ֔ה וְ/נִכְבְּשָׁ֥ה הָ/אָ֖רֶץ לִ/פְנֵי/כֶ֑ם וּ/נְתַתֶּ֥ם לָ/הֶ֛ם אֶת אֶ֥רֶץ הַ/גִּלְעָ֖ד לַ/אֲחֻזָּֽה־־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/029.yaml
  text: And Moses said to them, “If the sons of Gad and the sons of Reuben cross the Jordan with you, every armed man for battle before Yahweh, and the land is subdued before you, then you shall give them the land of Gilead as a possession.”
translation:
  language: zh_hans
  text: 摩西对他们说：“如果迦得子孙和流便子孙所有为争战武装起来的人，都和你们一同渡过约旦河，在雅威面前出战，并且那地在你们面前被制伏，你们就要把基列地给他们作产业。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: 采用现代汉语叙事中的自然表达；不机械译出连接词，语境中的承接关系仍然清楚。
- source_word: אִם
  choice: 如果
  rationale: 保留真实条件句的条件性，不把尚待履行的要求译成确定发生的“当……时”。
- source_word: בְנֵי גָד וּבְנֵי רְאוּבֵן
  choice: 迦得子孙和吕便子孙
  rationale: 保留希伯来语的宗族称谓及支派身份，同时符合中文圣经语体。
- source_word: יַעַבְרוּ ... אֶת הַיַּרְדֵּן
  choice: 渡过约旦河
  rationale: 准确而自然地表达跨越河流。
- source_word: אִתְּכֶם
  choice: 和你们一同
  rationale: 明确表达同行、共同参与行动的含义。
- source_word: כָּל חָלוּץ לַמִּלְחָמָה
  choice: 所有武装参战的人
  rationale: חָלוּץ在此指装备好并列队出战者；此译既体现其武装状态，也交代军事目的。
- source_word: לִפְנֵי יְהוָה
  choice: 在雅威面前
  rationale: 保留“在……面前”的神学与盟约意味，并以音译呈现神名。
- source_word: וְנִכְבְּשָׁה הָאָרֶץ
  choice: 那地……被制伏
  rationale: 保留Niphal被动语态和“置于控制之下”的含义，避免将其强化为毁灭。
- source_word: לִפְנֵיכֶם
  choice: 在你们面前
  rationale: 保留原文空间性和关联性的表达，不把施事者过度明确化。
- source_word: וּנְתַתֶּם לָהֶם ... לַאֲחֻזָּה
  choice: 你们就要把……给他们作产业
  rationale: 用“就”自然标明条件句的结果部分；“产业”表达可持有、承继的土地份额。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”较贴近其通常学术重构的读音，并避免用头衔替代专名。
- issue: לִפְנֵי יְהוָה的含义
  choice: 在雅威面前出战
  alternative: 为雅威出战
  rationale: 原文是“在……面前”，可包含在神临在和鉴察下行动的意味，但并未直接使用“为”来标示受益或目的，因此保留原有张力。
- issue: 土地被制伏的施事者
  choice: 那地在你们面前被制伏
  alternative: 你们制伏那地
  rationale: 原文采用被动形式，没有明说是谁制伏该地；保留被动可避免把行动单独归给以色列人，或反过来明确归给神。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“子孙”“产业”保留经文的宗族与土地承继语汇；调整语序，将“所有武装参战的人”与两支派相连，以免中文误读，同时保留条件句、被动式及“在……面前”的原文结构。
