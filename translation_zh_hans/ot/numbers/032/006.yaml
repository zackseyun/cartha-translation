base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/006.yaml
  text: But Moses said to the sons of Gad and to the sons of Reuben[b][a], “Shall your brothers go to war while you sit here?”
translation:
  language: zh_hans
  text: 摩西对迦得子孙和流便子孙说：“难道你们的弟兄[b]要去打仗[a]，你们却坐在这里吗？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“上战场”。希伯来语作“进入战争”，是指参与军事冲突的常用说法。
    reason: lexical_alternative
  - marker: b
    text: “你们的弟兄”指其他支派的以色列同胞。
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: 叙事性连续式推进情节；现代汉语无需逐字译出连接词“于是/并且”，用“说”自然引出话语。
- source_word: לִבְנֵי גָד וְלִבְנֵי רְאוּבֵן
  choice: 对迦得子孙和吕便子孙
  rationale: בני 字面为“儿子们”，此处指两个支派的后裔；“子孙”既保留希伯来语的亲属表达，也符合现代中文圣经叙事语体。
- source_word: הַאַחֵיכֶם
  choice: 你们的弟兄
  rationale: 原词直译为“你们的兄弟”；上下文指其他支派的以色列同胞。“弟兄”保留亲属隐喻及共同民族关系。
- source_word: יָבֹאוּ לַמִּלְחָמָה
  choice: 要去打仗
  rationale: 该短语是进入军事冲突的常用表达。疑问句中的“要”配合“难道”，传达摩西责问的语气，而不把它解释成单纯的将来或明确义务。
- source_word: וְאַתֶּם תֵּשְׁבוּ פֹה
  choice: 你们却坐在这里
  rationale: ישב 可指坐、居住或留下；“坐在这里”保留具体意象和责问的尖锐感，“却”自然表达与其他支派出战之间的对比。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“难道……却……”传达原文反问和责备的力度；保留“弟兄”“坐在这里”等希伯来语的具体表达。脚注标记均置于正文中：词语替代脚注紧随“打仗”，文化说明脚注置于整句之后。
