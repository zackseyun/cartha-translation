base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/019.yaml
  text: For we will not inherit with them beyond the Jordan and farther on[a], because our inheritance has come to us on this side of the Jordan, to the east.
translation:
  language: zh_hans
  text: 因为我们不会和他们一同承受约旦河那边及更远之处的产业；因为约旦河东边的产业已经归给我们了。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因为我们的产业已经落到我们名下，就是约旦河东边的产业。”
    reason: 原文“我们的产业已经来到我们这里”在土地分配语境中也可按惯用语理解为产业已“落到我们名下”。
lexical_decisions:
- source_word: נִנְחַל
  choice: 承受产业
  rationale: 该动词在此指领受并拥有所分配的土地。“承受产业”既保留产业分配的含义，也符合现代中文圣经语体。
- source_word: אִתָּם
  choice: 和他们一同
  rationale: 直接表达各支派共同参与承受产业的意思。
- source_word: מֵעֵבֶר לַיַּרְדֵּן וָהָלְאָה
  choice: 在约旦河那边以及更远的地方
  rationale: 保留原文以说话者所在位置为参照的空间表达，并体现 וָהָלְאָה 所含“再往前、更远处”的意思。
- source_word: בָאָה נַחֲלָתֵנוּ אֵלֵינוּ
  choice: 我们的产业已经……归给我们了
  rationale: 原文直译为“我们的产业已经来到我们这里”；中文用“归给我们”自然表达产业已经落定、归属说话者，同时不明确添加分配者。
- source_word: מֵעֵבֶר הַיַּרְדֵּן מִזְרָחָה
  choice: 在约旦河东边
  rationale: 结合 מִזְרָחָה 明确指出约旦河以东；这样既自然，也避免中文“河那边”因观察位置不同而产生不必要的混淆。
