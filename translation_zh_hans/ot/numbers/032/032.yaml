  text: נַ֣חְנוּ נַעֲבֹ֧ר חֲלוּצִ֛ים לִ/פְנֵ֥י יְהוָ֖ה אֶ֣רֶץ כְּנָ֑עַן וְ/אִתָּ֨/נוּ֙ אֲחֻזַּ֣ת נַחֲלָתֵ֔/נוּ מֵ/עֵ֖בֶר לַ/יַּרְדֵּֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/032.yaml
  text: We ourselves will cross over, armed, before Yahweh into the land of Canaan, and with us will be the possession of our inheritance on this side of the Jordan.
translation:
  language: zh_hans
  text: 我们自己要全副武装地在雅威面前渡河，进入迦南地；我们承受为业的产业之地在约旦河这边[a]，归我们所有。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“在约旦河对岸”或“约旦河那边”。希伯来语的这个说法取决于说话者或叙述者的观察位置；正文“这边”按说话者当时位于约旦河东岸的处境翻译。
    reason: lexical_alternative
lexical_decisions:
- source_word: נַחְנוּ
  choice: 我们自己
  rationale: 独立人称代词与第一人称复数动词并用，带有强调意味；“我们自己”自然保留这一重音。
- source_word: נַעֲבֹר
  choice: 要……渡河
  rationale: 该动词在此指渡过约旦河，并表达说话者对未来行动的承诺；汉语补出语境中明确的“河”。
- source_word: חֲלוּצִים
  choice: 武装起来
  rationale: 本词在军事语境中指装备妥当、准备作战；“武装起来”简明且符合现代汉语表达。
- source_word: לִפְנֵי יְהוָה
  choice: 在雅威面前
  rationale: 保留“在……面前”的空间和关系含义，并以“雅威”呈现经文中的神名。
- source_word: אֶרֶץ כְּנָעַן
  choice: 进入迦南地
  rationale: 原文在地名之前没有明写介词，但渡河行动的目的地明确；补出“进入”使汉语通顺而不改变意义。
- source_word: וְאִתָּנוּ אֲחֻזַּת נַחֲלָתֵנוּ
  choice: 我们承受为业的领地则……归我们所有
  rationale: 原文是无动词分句，同时含“占有的领地”和“承受的产业”两层意思；此译法以自然汉语保留承受产业与实际归属的含义。
- source_word: מֵעֵבֶר לַיַּרְדֵּן
  choice: 在约旦河这边
  rationale: 该表达的方向取决于观察者所在位置；本节说话者位于约旦河东岸并要求以该地为产业，因此正文采用符合其视角的“这边”，同时用脚注保留其他可能译法。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；音译为“雅威”旨在呈现其作为立约神名的性质，不以称号替代。
- issue: “在雅威面前”的含义
  choice: 保留原文关系性表述，不改译为单纯的行军次序
  alternative: 走在雅威前面
  rationale: לִפְנֵי 可能同时涉及神的临在、认可和行动方向；直译“在雅威面前”可保留这种神学张力，避免断定他们在空间上领先于神。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“武装起来”明确军事准备；分号呈现誓言中两个彼此关联的分句，并避免过度拆解原文结构。
