revisions:
- from: 于是，摩西把亚摩利王西宏的国和巴珊王噩的国，就是那地和其中的城邑，以及那地四围各城的疆域，给了迦得子孙、吕便子孙和约瑟之子玛拿西的半个支派。[a]
  to: 于是，摩西把亚摩利王西宏的国和巴珊王噩的国，就是那地和其中的城邑，连同其疆域内那地四围的城邑，给了迦得子孙、吕便子孙和约瑟之子玛拿西的半个支派。[a]
  rationale: 修订仅调整末尾压缩短语的句法关系：土地和城邑仍是所赐之物，“疆域”用于限定城邑所在范围；脚注继续标示该处不能安全消除的歧义。其余译法保留，因为均忠实、自然且符合现代庄重叙事体。
