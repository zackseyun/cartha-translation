  text: וַ/יִּתֵּ֣ן לָ/הֶ֣ם מֹשֶׁ֡ה לִ/בְנֵי גָד֩ וְ/לִ/בְנֵ֨י רְאוּבֵ֜ן וְ/לַ/חֲצִ֣י שֵׁ֣בֶט מְנַשֶּׁ֣ה בֶן יוֹסֵ֗ף אֶת מַמְלֶ֨כֶת֙ סִיחֹן֙ מֶ֣לֶךְ הָֽ/אֱמֹרִ֔י וְ/אֶת מַמְלֶ֔כֶת ע֖וֹג מֶ֣לֶךְ הַ/בָּשָׁ֑ן הָ/אָ֗רֶץ לְ/עָרֶ֨י/הָ֙ בִּ/גְבֻלֹ֔ת עָרֵ֥י הָ/אָ֖רֶץ סָבִֽיב׀־׀׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/033.yaml
  text: So Moses gave to the sons of Gad[a], to the sons of Reuben, and to the half-tribe of Manasseh son of Joseph, the kingdom of Sihon king of the Amorites and the kingdom of Og king of Bashan—the land with its cities in their territories, the cities of the surrounding land.
translation:
  language: zh_hans
  text: 于是，摩西把亚摩利王西宏的国和巴珊王噩的国，就是那地和其中的城邑，连同其疆域内那地四围的城邑，给了迦得子孙、吕便子孙和约瑟之子玛拿西的半个支派。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节末尾的希伯来语句法十分紧凑；也可译作：“就是那地，连同其中的城邑及其疆域，就是那地四围的城邑。”末尾短语的修饰关系和同位结构有几种相近的理解。
    reason: 保留原文末尾短语在“疆域／边界”与“四围的城邑”之修饰关系上的真实歧义，避免把疆域误解为各城所拥有的独立受赐对象。
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: 给了
  rationale: נתן在此指把所得领土交给或分给各支派；“给了”简明自然，也保留叙事语气。
- source_word: לִבְנֵי גָד ... וְלִבְנֵי רְאוּבֵן
  choice: 迦得子孙、吕便子孙
  rationale: 直译בְּנֵי的家族—支派表达；“子孙”比“儿子们”更符合现代汉语中对支派成员的称呼。
- source_word: וְלַחֲצִי שֵׁבֶט מְנַשֶּׁה
  choice: 玛拿西的半个支派
  rationale: 保留原文“半个支派”的结构，清楚指玛拿西支派的一半。
- source_word: בֶן יוֹסֵף
  choice: 约瑟之子
  rationale: 保留原文对玛拿西的谱系说明；“之子”庄重而简洁。
- source_word: מַמְלֶכֶת
  choice: 国
  rationale: 这里指西宏和噩所统治的王国及其领土；“国”直接自然，并与“王”搭配顺畅。
- source_word: סִיחֹן מֶלֶךְ הָאֱמֹרִי
  choice: 亚摩利王西宏
  rationale: 以自然汉语语序表达原文同位结构，不增加额外解释。
- source_word: עוֹג מֶלֶךְ הַבָּשָׁן
  choice: 巴珊王噩
  rationale: 按现代汉语习惯调整头衔与人名次序，意义与原文一致。
- source_word: הָאָרֶץ
  choice: 那地
  rationale: 指前述两个王国所涵盖的土地；“那地”保留原文定指。
- source_word: לְעָרֶיהָ
  choice: 其中的城邑
  rationale: 该介词结构在此较省略；译文表达土地连同所属城邑被交付的意思，同时避免生硬直译。
- source_word: בִּגְבֻלֹת ... סָבִיב
  choice: 四围各城的疆域
  rationale: גְּבוּלֹת可指边界或辖境；结合סָבִיב，译为“四围各城的疆域”较自然，但原句句法压缩，故以脚注保留其他可能理解。
