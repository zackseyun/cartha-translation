base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/031.yaml
  text: Then the sons of Gad and the sons of Reuben answered[a], saying, “As Yahweh has spoken to your servants, so we will do.”
translation:
  language: zh_hans
  text: 迦得的子孙和吕便的子孙回答说：“雅威对你仆人所说的，我们必照样去做。”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“雅威所对你仆人说的，我们就照着做。”
    reason: 原文 אֵת אֲשֶׁר … כֵּן 可按“所说的……，照样做”的关联结构表达；中文可调整“对你仆人”的语序，而不改变其修饰“说”的关系。
lexical_decisions:
- source_word: וַיַּעֲנוּ
  choice: 回答
  rationale: 叙事中的 wayyiqtol 形式引出对前文的回应；“回答”直接而自然。
- source_word: בְנֵי גָד וּבְנֵי רְאוּבֵן
  choice: 迦得的子孙和吕便的子孙
  rationale: 保留原文两次出现的 בְּנֵי（“儿子／子孙”）亲属表达；在支派语境中，“子孙”比字面的“儿子”更准确，也避免改写成族群称谓。
- source_word: לֵאמֹר
  choice: 说
  rationale: 该不定式用于引出直接引语；与“回答”连用译作“回答说”符合现代汉语叙事习惯。
- source_word: אֵת אֲשֶׁר ... כֵּן
  choice: 怎样……就怎样……
  rationale: 用汉语关联结构呈现原文前后呼应的表达，同时以脚注保留将 אֵת אֲשֶׁר 理解为宾语内容的译法。
- source_word: דִּבֶּר
  choice: 说
  rationale: 基本义为“说、讲”；上下文虽带有吩咐的效力，但正文不把这一含义明说为“命令”。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语音译保留四字神名，而不以“主”等称号替代。
- source_word: אֶל עֲבָדֶיךָ
  choice: 对你仆人
  rationale: 这里是众人对摩西的谦称；“仆人”既保留自谦语气，也不误导为强调受奴役身份。中文用单数形式“你仆人”作集体自称，简洁地对应原文复数。
- source_word: נַעֲשֶׂה
  choice: 我们就怎样做
  rationale: 直接表达 עשה 的广义“做、实行”，不添加原文未明说的宾语。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。译作“雅威”保留其专名性质，不以称号替代；“耶和华”是另一传统音译。
- issue: דִּבֶּר 在本语境中是否明译为命令
  choice: 说
  alternative: 吩咐
  rationale: 上下文表明这话具有命令性质，但该动词本身是“说、讲”。正文保留较宽泛的措辞，避免把语境含义写进词义。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“迦得的子孙和吕便的子孙”保留支派祖先与后裔的亲属表达；引语简洁，适合公开诵读。
