  text: וַ/יֵּ֨לְכ֜וּ בְּנֵ֨י מָכִ֧יר בֶּן מְנַשֶּׁ֛ה גִּלְעָ֖דָ/ה וַֽ/יִּלְכְּדֻ֑/הָ וַ/יּ֖וֹרֶשׁ אֶת הָ/אֱמֹרִ֥י אֲשֶׁר בָּֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/039.yaml
  text: The sons of Machir son of Manasseh went to Gilead and captured it[b][a], and dispossessed the Amorites who were in it.
translation:
  language: zh_hans
  text: 玛拿西之子玛吉的子孙往基列去，占领了那里，又把住在那里的亚摩利人[b]赶走了[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文在前面两个复数动词之后，转用了单数动词，直译为“他赶走了”。这可能把玛吉的宗族视为一个整体，也可能是文体或文本上的转换；正文按汉语习惯省略了主语。
    reason: textual_variant
  - marker: b
    text: 原文作单数“亚摩利人”，在这里是集合用法，指当地的亚摩利居民。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלְכוּ
  choice: 去
  rationale: הלך在此是常见的叙事动词，表示前往；原文没有明确强调“上去”或行军。
- source_word: בְּנֵי מָכִיר בֶּן מְנַשֶּׁה
  choice: 玛拿西之子玛吉的子孙
  rationale: בני字面为“众子”，在这里可泛指后裔或宗族成员；译作“子孙”符合本段宗族与领地的语境，也避免让现代读者误以为只指玛吉的亲生儿子。
- source_word: גִּלְעָדָה
  choice: 往基列
  rationale: 词尾的方向词素表示朝某地而去；“往基列”自然地保留这一方向意义。
- source_word: וַיִּלְכְּדֻהָ
  choice: 占领了那里
  rationale: לכד常用于夺取城邑或地域；“占领”准确表达军事夺取之意，宾语“那里”回指基列。
- source_word: וַיּוֹרֶשׁ
  choice: 赶走了
  rationale: ירש的使役式在此表示使原有居民失去其地、将其逐出。“赶走”是现代汉语中自然清楚的表达；正文省略主语，以免强行判定单数动词所指，并以脚注说明原文形式。
- source_word: הָאֱמֹרִי
  choice: 亚摩利人
  rationale: 原文为单数族名，但在此作集合称谓，指当地的亚摩利居民；汉语“亚摩利人”可自然表示群体。
- source_word: אֲשֶׁר בָּהּ
  choice: 住在那里的
  rationale: 关系从句指身处基列的亚摩利居民；“住在那里的”比直译“在其中的”更符合现代汉语。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“玛拿西之子玛吉”保留希伯来文的亲属链条；“子孙”明确其宗族性含义。正文不显加“他们”或“他”，从而既保持汉语流畅，也不替原文解决单复数转换所留下的歧义。
