base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/014.yaml
  text: And behold[a], you have risen up in your fathers’ place, a brood of sinful men[b], to add still more to the burning anger of Yahweh against Israel.
translation:
  language: zh_hans
  text: 看哪，你们起来接替你们的父辈，成了一群罪人[a]，要使雅威向以色列所发的烈怒[b]越发加重。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“增多的一群罪人”或“罪人的后代”。希伯来语תַּרְבּוּת可指增多，也可指繁衍而来的后代。
    reason: lexical_alternative
  - marker: b
    text: “烈怒”按希伯来语字面为“鼻子的燃烧”，是形容强烈愤怒的惯用语。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: 看哪
  rationale: 保留希伯来文指示兼感叹的语气，突出摩西严厉警告的修辞力度。
- source_word: קַמְתֶּם תַּחַת אֲבֹתֵיכֶם
  choice: 你们接替你们的父辈兴起
  rationale: קום表示“兴起”，תחת在此表示代际上的接替；译文兼顾原有意象和自然汉语。
- source_word: תַּרְבּוּת אֲנָשִׁים חַטָּאִים
  choice: 一群犯罪之人的后代
  rationale: תַּרְבּוּת可指增多、所生的后代或繁衍而成的一群；此译法保留代际关联，也传达责斥语气，但避免使用含义过重的贬称。
- source_word: לִסְפּוֹת עוֹד עַל
  choice: 使……越发加重
  rationale: 表达在已有程度上继续增添、加剧的意思；比逐字译作“再加在……之上”更符合现代汉语。
- source_word: חֲרוֹן אַף
  choice: 烈怒
  rationale: 该固定表达字面涉及“鼻子的燃烧”，惯指强烈愤怒；“烈怒”凝练地保留其强度。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语音译呈现希伯来文中的神名，而不以称号代替。
- source_word: אֶל יִשְׂרָאֵל
  choice: 向以色列所发的
  rationale: 在愤怒语境中，אֶל标明愤怒所针对的对象；此表达符合自然汉语。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名；采用音译以保留其作为专名的性质，不用“主”这一称号替换。
- issue: תַּרְבּוּת所表达的群体与血缘关系
  choice: 一群犯罪之人的后代
  alternative: 一批犯罪的人；犯罪之人的增生
  rationale: 该词既可涉及增多，也可指所生的后代。上下文将受责备者与其父辈对照，因此正文采用“后代”，并以脚注保留词义的真实歧义。
- issue: אֲנָשִׁים的性别表达
  choice: 人
  alternative: 男人
  rationale: 希伯来文复数名词在这里指受摩西斥责的支派成员；现代汉语“人”可自然涵盖该所指，而译作“男人”会不必要地突出性别。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“看哪”保留警告的突兀与力度；“接替……兴起”呈现代际接续；全句避免过度古雅，也不以额外解释消解原文对תַּרְבּוּת的词义张力。
