  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר אֲלֵי/הֶם֙ מֹשֶׁ֔ה אִֽם תַּעֲשׂ֖וּ/ן אֶת הַ/דָּבָ֣ר הַ/זֶּ֑ה אִם תֵּחָֽלְצ֛וּ לִ/פְנֵ֥י יְהוָ֖ה לַ/מִּלְחָמָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/020.yaml
  text: And Moses said to them, “If you will do this thing, if you will arm yourselves before Yahweh for the war,”
translation:
  language: zh_hans
  text: 摩西对他们说：“你们若这样做，若武装起来[a]，在耶和华面前[b]作战，”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“装备妥当”“以武装人员的身份出战”或“集结起来”。这里的希伯来语动词带有军事含义，指为战斗武装或预备好。
    reason: lexical_alternative
  - marker: b
    text: 原文直译“在耶和华面前”，表示他们的军事行动是在耶和华的临在中，并在他的权柄之下进行。
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵיהֶם מֹשֶׁה
  choice: 摩西对他们说
  rationale: 按希伯来叙事次序引出摩西的发言；现代汉语无需机械译出句首连接词 וַ。
- source_word: אִם תַּעֲשׂוּן אֶת־הַדָּבָר הַזֶּה
  choice: 你们若这样做
  rationale: הַדָּבָר הַזֶּה 回指前文所提出的安排；“这样做”比“做这件事”更自然，同时保留条件句含义。
- source_word: אִם תֵּחָלְצוּ
  choice: 若武装起来
  rationale: חלץ 的尼法勒式在此具有军事含义，指装备武器、准备投入战斗；“武装起来”简洁而明确。
- source_word: לִפְנֵי יְהוָה
  choice: 在耶和华面前
  rationale: 保留 לִפְנֵי“在……面前／临在中”的空间及神学意味，并以中文通行形式“耶和华”呈现神名。
- source_word: לַמִּלְחָמָה
  choice: 作战
  rationale: מִלְחָמָה 在本语境指战争或战斗；“作战”与“武装起来”搭配自然，也准确表达目的。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名；“耶和华”是现代中文圣经传统中最通行且普通读者最易识别的专名形式，不以“主”替代神名。
- issue: “在耶和华面前”的含义
  choice: 保留直译，并以脚注说明
  alternative: 在耶和华的带领下
  rationale: לִפְנֵי 表明行动是在耶和华临在和权柄之下，但原文未明确使用“带领”等词，因此不在正文中扩展解释。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。保留两个“若”以反映原文并列的条件结构；句末用逗号和未闭合语势，表明摩西的条件陈述在下一节继续。
