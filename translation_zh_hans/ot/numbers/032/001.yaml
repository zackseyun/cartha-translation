  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וּ/מִקְנֶ֣ה רַ֗ב הָיָ֞ה לִ/בְנֵ֧י רְאוּבֵ֛ן וְ/לִ/בְנֵי גָ֖ד עָצ֣וּם מְאֹ֑ד וַ/יִּרְא֞וּ אֶת אֶ֤רֶץ יַעְזֵר֙ וְ/אֶת אֶ֣רֶץ גִּלְעָ֔ד וְ/הִנֵּ֥ה הַ/מָּק֖וֹם מְק֥וֹם מִקְנֶֽה׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/001.yaml
  text: The sons of Reuben and the sons of Gad had a very great amount of livestock[a], and they saw the land of Jazer and the land of Gilead, and behold[b], the place was a place for livestock.
translation:
  language: zh_hans
  text: 吕便的子孙和迦得的子孙拥有极多的牲畜[a]。他们看见雅谢地和基列地，发现[b]那地方是适合牲畜的地方。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“吕便的儿子们和迦得的儿子们”；这里指吕便支派和迦得支派的人。
    reason: 说明“子孙”所对应的希伯来文直译及其支派含义。
  - marker: b
    text: 或译：“看哪，那地方是饲养牲畜的地方。”原文重复“地方”一词，以加强语气。
    reason: 保留הִנֵּה的另一种较形式对应的译法，并说明原文的重复结构。
lexical_decisions:
- source_word: מִקְנֶה רַב ... עָצוּם מְאֹד
  choice: 极多的牲畜
  rationale: מִקְנֶה泛指作为财产饲养的牲畜，不限于牛；רַב与עָצוּם מְאֹד共同强调数量或规模极大，译作“极多”自然而保留强化语气。
- source_word: לִבְנֵי רְאוּבֵן וְלִבְנֵי גָד
  choice: 吕便的子孙和迦得的子孙
  rationale: 保留בְּנֵי的亲属—支派表达及原文对两个支派名称的重复，比直接译成支派族称更贴近原文。
- source_word: וַיִּרְאוּ
  choice: 他们看见
  rationale: 按叙事顺序直译为并列动作，不加入原文未明确表达的时间从属关系。
- source_word: אֶרֶץ יַעְזֵר וְאֶת אֶרֶץ גִּלְעָד
  choice: 雅谢地和基列地
  rationale: אֶרֶץ在此指地域；中文地名后加“地”既简洁，也保留原文重复的地域概念。
- source_word: וְהִנֵּה
  choice: 发现
  rationale: הִנֵּה在此提示人物观察所得；“发现”以自然现代汉语传达其引人注意和即时察觉的功能。
- source_word: הַמָּקוֹם מְקוֹם מִקְנֶה
  choice: 那地方是适合牲畜的地方
  rationale: 保留מָקוֹם的重复，同时用“适合牲畜”表达“供牲畜使用之地”的语义，避免生硬的“牲畜之地”。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事体。句首不增添原文没有明确词项的“那时/如今”。为避免过长串联，将希伯来文连续并列结构分成两句；专名采用中文圣经通行译名“吕便、迦得、雅谢、基列”。
