review_pass:
  verdict: revise
  source_fidelity: “全都灭尽”在本段历史语境中可指该世代死亡殆尽，但比原文 עַד תֹּם（直到……终结／结束）更明确地带有毁灭、灭绝的动作色彩。宜用较中性的“全都消逝”，以保留原文的终结表述，且不额外强化施行毁灭的意味。其余内容准确传达了神怒、使役性的旷野漂泊、四十年期限及“在雅威眼中行恶”的评价语。
  naturalness: 原句整体庄重通顺。“雅威的怒气向以色列发作”可以理解，但“怒气……发作”略带疾病症状或突发状态的联想；改作“雅威向以色列发怒”是更自然的现代汉语。原文“怒气燃烧”的意象可由脚注保留。
  terminology: “雅威”“以色列”“旷野”均合适且前后一致。“在雅威眼中行恶”是自然、准确的固定式表达。
