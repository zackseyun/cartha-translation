  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יִּֽחַר אַ֤ף יְהוָה֙ בְּ/יִשְׂרָאֵ֔ל וַ/יְנִעֵ/ם֙ בַּ/מִּדְבָּ֔ר אַרְבָּעִ֖ים שָׁנָ֑ה עַד תֹּם֙ כָּל הַ/דּ֔וֹר הָ/עֹשֶׂ֥ה הָ/רַ֖ע בְּ/עֵינֵ֥י יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/013.yaml
  text: So Yahweh’s anger burned against Israel[a], and he made them wander in the wilderness forty years[b], until all the generation that had done evil in the sight of Yahweh had come to an end.
translation:
  language: zh_hans
  text: 于是，雅威向以色列发怒[a]，他使他们在旷野飘荡了四十年[b]，直到那一代在雅威眼中行恶的人全都消逝。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“雅威的怒气向以色列燃烧。”希伯来语惯用语直译是“雅威的鼻子／怒气燃烧起来”。
    reason: 说明希伯来语发怒惯用语的字面意象及保留该意象的译法。
  - marker: b
    text: 或译：“他使他们在旷野漂流了四十年。”
    reason: “飘荡”也可按语境译为“漂流”，两者均表达原文的使役含义。
lexical_decisions:
- source_word: וַיִּחַר אַף יְהוָה
  choice: 雅威的怒气……发作
  rationale: 保留希伯来语“怒气燃烧”的鲜明意象及其强烈语气，同时采用现代汉语中自然庄重的表达；脚注补明其字面意象。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以通行的现代汉语音译呈现四字神名，保留其作为专名的性质，不以称号替代。
- source_word: בְּיִשְׂרָאֵל
  choice: 向以色列
  rationale: 在发怒语境中，介词标明怒气所针对的对象；“向以色列”符合现代汉语习惯。
- source_word: וַיְנִעֵם
  choice: 他使他们……飘荡
  rationale: 该使役形式表示雅威使他们不断迁移、不得安居；“使……飘荡”既保留使役义，也贴合旷野漂泊的语境。
- source_word: בַּמִּדְבָּר
  choice: 在旷野
  rationale: “旷野”是出埃及与民数记语境中对 מִדְבָּר 的自然、传统且范围适当的译法。
- source_word: אַרְבָּעִים שָׁנָה
  choice: 四十年
  rationale: 直接传达原文数目与时间长度。
- source_word: עַד תֹּם כָּל הַדּוֹר
  choice: 直到……那一整代人全都灭尽
  rationale: תֹּם 表示达到终结；在本节审判与世代死亡的语境中，“全都灭尽”自然呈现该世代彻底终结，并保留 כָּל 的整体性。
- source_word: הָעֹשֶׂה הָרַע
  choice: 行……看为恶之事的
  rationale: 将修饰集合名词“世代”的单数分词自然转为汉语定语结构，不额外限定恶行的具体内容。
- source_word: בְּעֵינֵי יְהוָה
  choice: 雅威眼中看为
  rationale: 保留希伯来语“在……眼中”的评价性意象，同时使整句符合现代汉语表达。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名；译作“雅威”保留专名性质，避免以“主”这一称号取代。
- issue: 神怒的描写
  choice: 雅威的怒气向以色列发作
  alternative: 雅威向以色列发怒；雅威的怒火向以色列燃烧
  rationale: 正文保留强烈而具动态的神怒描写，又避免生硬照搬希伯来语“鼻子／怒气燃烧”的结构；脚注公开其字面意象及较平实的译法。
- issue: 该世代的终局
  choice: 全都灭尽
  alternative: 全都终结；全都消逝
  rationale: 上下文指受审判的一代在四十年间死亡殆尽；“灭尽”准确呈现结果，但不进一步解释个体的永恒结局。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“怒气……发作”保留原文力度而不显生硬；“旷野飘荡”呼应以色列受审判期间不得安居的处境。正文中的[a]、[b]与脚注逐一对应。
