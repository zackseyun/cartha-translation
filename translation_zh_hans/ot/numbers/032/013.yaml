revisions:
- from: 因此，雅威的怒气向以色列发作[a]，他使他们在旷野飘荡了四十年[b]，直到行雅威眼中看为恶之事的那一整代人全都灭尽。
  to: 于是，雅威向以色列发怒[a]，他使他们在旷野飘荡了四十年[b]，直到那一代在雅威眼中行恶的人全都消逝。
  rationale: 将“怒气……发作”调整为更自然的“向……发怒”，并在脚注中保留原文怒气燃烧的意象。将“全都灭尽”调整为“全都消逝”，以准确反映“直到该世代终结”的原文措辞，不扩大其动作性或神学含义。
