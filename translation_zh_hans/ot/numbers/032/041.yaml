  text: And Jair son of Manasseh went and captured their villages[a], and he called them Havvoth-jair.
translation:
  language: zh_hans
  text: 玛拿西的儿子睚珥前去攻取了他们的村庄，并把这些村庄称为“哈倭特·睚珥”[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “哈倭特·睚珥”意思是“睚珥的村庄”，也可译作“睚珥的聚落”。
    reason: 说明音译地名的字面含义及词义范围。
lexical_decisions:
- source_word: יָאִיר
  choice: 睚珥
  rationale: 采用现代中文圣经中较为通行的人名音译，保留其专名性质。
- source_word: בֶּן מְנַשֶּׁה
  choice: 玛拿西的儿子
  rationale: 按希伯来语构造直译；虽可能泛指后裔，但正文不替原文消除这一语义张力。
- source_word: הָלַךְ
  choice: 去
  rationale: 自然呈现叙事中的行动推进，不增添原文没有明说的方向或目的。
- source_word: וַיִּלְכֹּד
  choice: 攻取了
  rationale: לכד在征服土地的语境中表示夺取、占领；“攻取”兼顾军事语境与现代中文表达。
- source_word: חַוֺּתֵיהֶם
  choice: 他们的村庄
  rationale: חַוּוֹת指规模较小的聚落或村落；“村庄”清楚自然，也与后面的地名构词保持联系。
- source_word: וַיִּקְרָא אֶתְהֶן
  choice: 把这些村庄称为
  rationale: קרא带宾语可表示称呼或命名；补出“这些村庄”可使中文指代清楚，同时不改变原意。
- source_word: חַוֺּת יָאִיר
  choice: 哈倭特·睚珥
  rationale: 该短语在此作为地名使用，因此正文采用音译，并在脚注说明其字面含义。
