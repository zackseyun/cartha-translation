  yaml_path: translation/ot/numbers/032/037.yaml
  text: And the sons of Reuben built Heshbon[a], Elealeh, and Kiriathaim.
translation:
  language: zh_hans
  text: 吕便的子孙建造了希实本[a]、以利亚利和基列亭。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“吕便人建造了希实本、以利亚利和基列亭。”
    reason: 词汇表达的另一种译法；“吕便的子孙”在此可按支派称谓译作“吕便人”。
lexical_decisions:
- source_word: וּ/בְנֵי רְאוּבֵן
  choice: 吕便的子孙
  rationale: בְנֵי字面为“儿子们”，与支派祖名连用时指其后裔或支派成员。“吕便的子孙”既保留希伯来的谱系表达，也符合现代中文圣经语体。句首连接词וּ按中文叙事习惯不另译，以免显得生硬。
- source_word: בָּנוּ
  choice: 建造了
  rationale: בנה的Qal完成式基本义为“建造”。此处虽可能在历史情境中包含重建或修筑之意，但原文没有明说，因此不增译为“重建”或“修筑”。
- source_word: אֶת
  choice: 不单独译出
  rationale: 希伯来语定指直接宾语标记，在中文中没有对应的独立词，由正常语序体现。
- source_word: חֶשְׁבּוֹן
  choice: 希实本
  rationale: 地名按现代中文圣经中通行且易辨识的译名处理。
- source_word: אֶלְעָלֵא
  choice: 以利亚利
  rationale: 地名采用现代中文圣经中通行的音译，反映马所拉文本的读音。
- source_word: קִרְיָתָיִם
  choice: 基列亭
  rationale: 地名采用现代中文圣经中通行且易辨识的音译。
theological_decisions: []
