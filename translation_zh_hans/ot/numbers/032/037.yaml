  register: 采用自然、庄重而清楚的现代标准普通话。“吕便的子孙”保留原文的谱系形式；脚注提供更简洁的支派称谓。“建造了”忠实保留动词基本义，不根据背景擅自具体化为“重建”或“加固”。
