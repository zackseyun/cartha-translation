base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/042.yaml
  text: And Nobah went and captured Kenath and its villages[a], and called it Nobah, after his own name.
translation:
  language: zh_hans
  text: 挪巴去攻取了基纳和属于基纳的村镇[a]，又照自己的名字给这城取名叫挪巴。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“它的女儿们”，是指隶属于基纳的较小聚落。
    reason: lexical_alternative
lexical_decisions:
- source_word: נֹבַח
  choice: 挪巴
  rationale: 人名按现代中文圣经专名的通行音译处理；后文城名保留相同译名，以呈现原文有意的重复。
- source_word: הָלַךְ
  choice: 去
  rationale: 在叙事次序中作一般移动动词；“去”自然简洁，不额外加入“出发”等原文未明说的信息。
- source_word: וַיִּלְכֹּד
  choice: 攻取了
  rationale: לכד在军事语境中指夺取、占领；“攻取”既体现武力征服，也符合庄重而通俗的叙事语体。
- source_word: קְנָת
  choice: 基纳
  rationale: 地名采用音译。
- source_word: בְּנֹתֶיהָ
  choice: 属于基纳的村镇
  rationale: 字面为“它的女儿们”，是指隶属于中心城的附属聚落。“属于基纳的村镇”在现代中文中清楚传达其惯用义，同时以脚注保留字面形象。
- source_word: וַיִּקְרָא לָהּ
  choice: 给这城取名叫
  rationale: קרא + ל在此表示命名；“给这城取名叫”明确且自然，并说明阴性代词所指的是基纳城。
- source_word: נֹבַח
  choice: 挪巴
  rationale: 新城名与征服者的人名完全相同，译文保留这一命名关系。
- source_word: בִּשְׁמוֹ
  choice: 照自己的名字
  rationale: 该短语表示以挪巴本人的名字为城命名；“自己的”清楚指回主语，又不增添额外解释。
