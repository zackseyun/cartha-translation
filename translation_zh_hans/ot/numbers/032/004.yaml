  text: הָ/אָ֗רֶץ אֲשֶׁ֨ר הִכָּ֤ה יְהוָה֙ לִ/פְנֵי֙ עֲדַ֣ת יִשְׂרָאֵ֔ל אֶ֥רֶץ מִקְנֶ֖ה הִ֑וא וְ/לַֽ/עֲבָדֶ֖י/ךָ מִקְנֶֽה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/004.yaml
  text: The land that Yahweh struck before the congregation of Israel is a land for livestock[b][a], and your servants have livestock.
translation:
  language: zh_hans
  text: 耶和华在以色列会众[a]面前所击打的那地，是适宜畜牧的土地[b]；你的仆人有牲畜。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “会众”也可译作“会众团体”或“共同体”。
    reason: lexical_alternative
  - marker: b
    text: 直译“牲畜之地”；原文所指不限于牛，也包括各种家畜。
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאָרֶץ
  choice: 这片土地
  rationale: אֶרֶץ在这里指前文所说的地域；“这片土地”既保留定指，也符合现代汉语的地理语境。
- source_word: הִכָּה
  choice: 击打
  rationale: נכה可表示击打，也可在军事语境中表示击败。“击打”保留原文措辞及其可能涵盖的军事含义，不直接把对象补成当地居民或诸王。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文读者熟悉的专名形式呈现四字神名，不以“主”这一称号替代。
- source_word: לִפְנֵי
  choice: 在……面前
  rationale: 直译其空间性表达，表明以色列会众亲眼见证或在场面对耶和华的行动。
- source_word: עֲדַת יִשְׂרָאֵל
  choice: 以色列会众
  rationale: עֵדָה指聚集成共同体的群体；“会众”准确、简洁，并适合《民数记》的语境。
- source_word: אֶרֶץ מִקְנֶה
  choice: 适合饲养牲畜的地方
  rationale: 这一表达描述土地对畜牧的适宜性；如此译比生硬的“牲畜之地”更自然，同时不把מִקְנֶה缩窄为牛。
- source_word: וְלַעֲבָדֶיךָ מִקְנֶה
  choice: 你的仆人也有牲畜
  rationale: ל־在此表达所属关系；“有牲畜”是自然汉语。“仆人”保留说话者对摩西的谦称，“也”显明土地条件与他们所有牲畜之间的对应。
theological_decisions:
- issue: 四字神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威；上主
  rationale: 原文使用神的专名而非称号；正文保留中文圣经传统中广为人知的专名形式，避免以“上主”代替专名。
- issue: הִכָּה所表达的神圣行动
  choice: 击打
  alternative: 击败；消灭
  rationale: 上下文具有征战意味，但原文动词本身保留“击打”的形象。“击打”不把结果或受击对象解释得比原文更明确，从而保留其语义张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“所击打的”略带书面色彩，以维持经文语体并保留希伯来语关系从句的结构；分号清楚呈现土地适合畜牧与说话者拥有牲畜之间的论证关系。
