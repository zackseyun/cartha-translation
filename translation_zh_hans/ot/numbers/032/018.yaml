  text: לֹ֥א נָשׁ֖וּב אֶל בָּתֵּ֑י/נוּ עַ֗ד הִתְנַחֵל֙ בְּנֵ֣י יִשְׂרָאֵ֔ל אִ֖ישׁ נַחֲלָתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/018.yaml
  text: We will not return to our houses until the sons of Israel have each taken possession of his inheritance[a].
translation:
  language: zh_hans
  text: 我们必不回到自己的家，直到以色列众子各自承受自己的产业为止。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֹא נָשׁוּב
  choice: 我们不回
  rationale: 未完成式在誓言式语境中表达将来的承诺；汉语用“不回”自然地传达这一意向，不额外加强为“绝不”。
- source_word: אֶל בָּתֵּינוּ
  choice: 自己的家
  rationale: בָּתִּים本义为“房屋”，但在“返回”这一语境中指他们居住的家；“自己的家”既自然，也保留第一人称复数的归属关系。
- source_word: עַד
  choice: 直到
  rationale: 直接表达他们不返回这一行动的时间界限。
- source_word: הִתְנַחֵל
  choice: 承受了
  rationale: נחל的Hitpael形式在此指取得所分配的世袭土地；“承受”保留产业与继承的关联，并能涵盖实际取得土地的意思。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列众子
  rationale: 保留希伯来文“以色列的众子”这一男性、家族性的盟约称谓；“众子”比逐字的“儿子们”更庄重，也较符合中文圣经语体。
- source_word: אִישׁ נַחֲלָתוֹ
  choice: 各自……自己的产业
  rationale: אִישׁ在此作分配用法，意为“各人”；重复“各自／自己的”在汉语中清楚呈现每人取得其相应产业的意思。
- source_word: נַחֲלָתוֹ
  choice: 自己的产业
  rationale: 这里主要指分配给各支派、宗族或家庭的土地。“产业”保留其土地份额及世袭继承的双重含义。
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל的性别与家族性表达
  choice: 以色列众子
  alternative: 以色列人／以色列子民
  rationale: 正文保留原文明确的男性复数和“以色列之子”的家族性表达，不将其无声地中性化；脚注提供现代汉语中更常见、按整体民族理解的译法。
- issue: נחל词根在本节中的产业含义
  choice: 承受……产业
  alternative: 取得……土地／占有……产业
  rationale: 原文同时带有领受所分之地和继承产业的语义。“承受产业”保留这一神学与土地分配层面的张力，而不单纯解释为军事占领。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“以色列众子”有意保留原文的家族性称谓，较日常表达略显古雅，因此用脚注加以说明。
