  text: 迦得子孙和吕便子孙前来，对摩西、祭司以利亚撒和会众的首领说：
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְנֵי גָד וּבְנֵי רְאוּבֵן
  choice: 迦得子孙和吕便子孙
  rationale: בְּנֵי在这里指两个支派的成员；沿用圣经汉语中自然且可辨识的“子孙”，同时保留原文的族裔表达。
- source_word: וַיָּבֹאוּ
  choice: 前来
  rationale: 表达人物来到摩西等人面前的动作；“前来”比单用“来”更符合叙事语体。
- source_word: נְשִׂיאֵי הָעֵדָה
  choice: 会众的首领
  rationale: נְשִׂיאִים在此是群体领袖，עֵדָה指以色列会众；此译法清楚且不额外限定其职制。
- source_word: לֵאמֹר
  choice: 说：
  rationale: 希伯来叙事引语公式，中文以冒号自然引出下文，避免机械重复“说道”。
