  yaml_path: translation/ot/numbers/004/003.yaml
  text: from thirty years old and upward[a], up to fifty years old[b], everyone who enters the service to do the work in the tent of meeting.
translation:
  language: zh_hans
  text: 从三十岁起，直到五十岁，凡来[a]服役[b]、在会幕里做工的人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “来”也可译作“进入”。希伯来语分词可泛指前来，或进入指定的服役范围。
    reason: lexical_alternative
  - marker: b
    text: “服役”所译的希伯来语也可指“职务”“队伍”或“军旅”；这里指有组织的利未人职务。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִבֶּן שְׁלֹשִׁים שָׁנָה וָמַעְלָה
  choice: 从三十岁起
  rationale: בֶּן与岁数构成表示年龄的希伯来语惯用法；וָמַעְלָה表示以三十岁为下限。译作“从三十岁起”自然地传达这一范围起点。
- source_word: וְעַד בֶּן חֲמִשִּׁים שָׁנָה
  choice: 直到五十岁
  rationale: 保留עַד所表达的年龄上限，也维持原文由下限至上限的范围表达。
- source_word: כָּל בָּא
  choice: 凡来……的人
  rationale: כָּל加分词表示每一个前来承担所述职责的人；“凡来……的人”既保留分词的动态意味，也符合现代汉语。
- source_word: לַצָּבָא
  choice: 服役
  rationale: צָבָא可指军队、队伍或有组织的服役；本段语境是利未人的编组职务，并非作战，因此“服役”保留其组织性和职责意味。
- source_word: לַעֲשׂוֹת מְלָאכָה
  choice: 做工
  rationale: 不定式结构表示目的或任务；“做工”简明地传达实际承担工作的含义。
- source_word: בְּאֹהֶל מוֹעֵד
  choice: 在会幕里
  rationale: “会幕”是אֹהֶל מוֹעֵד在中文圣经语境中清楚而通行的名称；介词בְּ译作“在……里”。
theological_decisions:
- issue: צָבָא在本节是否带有军事含义
  choice: 按有组织的利未人服役理解，译作“服役”
  alternative: 译作“军队”“队伍”或“兵役”
  rationale: 上下文所述是会幕工作，原词虽常用于军队或军役，但这里指编组执行圣所职务；不应把战斗含义强加于经文。
translation_notes:
  register: 采用简洁、庄重的现代标准汉语。原文在句法上承接前文，是一个范围和对象短语，本译文保留这种未另加命令动词的结构，避免把上下文中的“数点”直接补入本节。两个脚注紧随“来服役”，分别说明בָּא与צָבָא的词义幅度。
