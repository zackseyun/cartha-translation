  text: Take a census of the sons of Gershon also[a], by their fathers' houses, by their clans.
translation:
  language: zh_hans
  text: 也要数点革顺的子孙，按他们的父家，按他们的宗族。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“抬起革顺子孙的头”；这是“数点人数”或“进行人口登记”的惯用语。
    reason: lexical_alternative
lexical_decisions:
- source_word: נָשֹׂא אֶת רֹאשׁ
  choice: 数点……的人数
  rationale: 该短语字面为“抬起……的头”，在民数记的人口登记语境中是统计、数点人数的惯用语。译作“数点……的人数”既自然，又保留行政统计的含义。
- source_word: בְּנֵי גֵרְשׁוֹן
  choice: 革顺子孙
  rationale: 原文采用“革顺的儿子们”这一谱系表达；中文“革顺子孙”能自然表达其后裔群体，同时保留血缘谱系含义。
- source_word: גַּם הֵם
  choice: 也
  rationale: 表示革顺子孙也包括在此前所述的数点工作中；“也”简洁自然地传达附加关系。
- source_word: לְבֵית אֲבֹתָם
  choice: 按着他们的父系家族
  rationale: בֵּית אָבוֹת 指以父系祖先为纽带的家族单位。“父系家族”比现代汉语中的普通“家庭”更能体现原文的谱系和社会结构。
- source_word: לְמִשְׁפְּחֹתָם
  choice: 宗族
  rationale: מִשְׁפָּחָה 在支派人口登记语境中指氏族或宗族单位，不只是现代核心家庭；“宗族”适合此处的社会组织层级。
