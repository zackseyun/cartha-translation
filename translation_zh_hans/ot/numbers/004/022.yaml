  source_fidelity: 译文准确传达了数点革顺后裔及按谱系单位归类的基本意思。但“父系家族”和“宗族”在汉语中均可泛指较大的父系亲属群体，未能清楚保留希伯来文“父家”与“宗族／氏族”两个不同层级；句末“登记”虽合乎数点语境，却不是原文明确表达的动作。
