base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/017.yaml
  text: Then Yahweh spoke to Moses and to Aaron[a], saying,
translation:
  language: zh_hans
  text: 雅威[a]又对摩西和亚伦说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文为 YHWH；也可译作“耶和华”。
    reason: 说明原文神名及常见的另一种汉语译法。
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: 又……说
  rationale: 该叙事性连接形式承接前文并推进叙述；“又……说”既体现连接关系，也符合现代汉语的自然表达。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文直接音译四字神名，而不以称号“主”替代；“雅威”是现代汉语中较贴近该名称常见学术重构读音的译法。
- source_word: אֶל מֹשֶׁה וְאֶל אַהֲרֹן
  choice: 对摩西和亚伦
  rationale: 两个 אֶל 分别标明摩西和亚伦都是受话者；汉语用一个“对”统领并列人名更自然，含义没有损失。
- source_word: לֵאמֹר
  choice: 说：
  rationale: 这是引出随后直接引语的固定表达；汉语以“说：”自然、准确地发挥同样作用。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文使用神的专名，而非“主”这一称号，因此正文保留专名形式。“雅威”较贴近通常重构的读音；脚注同时说明传统汉语译名“耶和华”。
translation_notes:
  register: 采用现代、庄重而简洁的叙事语言。“又”承接上下文；以冒号提示直接引语将在下一节开始。
