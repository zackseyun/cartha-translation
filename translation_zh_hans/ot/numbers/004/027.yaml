  text: עַל פִּי֩ אַהֲרֹ֨ן וּ/בָנָ֜י/ו תִּהְיֶ֗ה כָּל עֲבֹדַת֙ בְּנֵ֣י הַ/גֵּרְשֻׁנִּ֔י לְ/כָל מַשָּׂאָ֔/ם וּ/לְ/כֹ֖ל עֲבֹדָתָ֑/ם וּ/פְקַדְתֶּ֤ם עֲלֵ/הֶם֙ בְּ/מִשְׁמֶ֔רֶת אֵ֖ת כָּל מַשָּׂאָֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/027.yaml
  text: All the service of the sons of the Gershonites shall be at the command of Aaron and his sons[a], for all their loads and for all their service; and you shall assign to them, as a duty[b], all their loads.
translation:
  language: zh_hans
  text: 革顺子孙的一切事务，无论是他们所负的一切搬运任务，还是他们一切服役，都要听从亚伦和他儿子们的吩咐[a]；你们要把他们的一切搬运任务作为职守[b]交托给他们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“都要照亚伦和他儿子们的话。”希伯来语习语字面意思是“在……口上”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“作为交给他们的职责。”这个希伯来语词可指受委派的责任、职守或义务。
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל פִּי
  choice: 听从……的吩咐
  rationale: 该习语字面为“在……口上”，在此表示按某人的命令或指示行事。“听从……的吩咐”既自然，也保留了亚伦及其众子的指挥权。
- source_word: תִּהְיֶה
  choice: 都要
  rationale: 在行政规条中表达规定和指令语气；“要”比单纯的将来时更符合上下文。
- source_word: עֲבֹדַת
  choice: 服役
  rationale: 在会幕和利未人的语境中，עֲבֹדָה 指受委派的劳作或职务。“服役”兼顾实际劳动与受命履职的意味，又避免特定宗派色彩。
- source_word: בְּנֵי הַגֵּרְשֻׁנִּי
  choice: 革顺子孙
  rationale: 指革顺宗族的后裔；“革顺子孙”在现代中文圣经文体中自然简洁，并保留原文的血缘宗族表达。
- source_word: לְכָל מַשָּׂאָם
  choice: 无论是搬运
  rationale: מַשָּׂא 在本段指搬运会幕物件的任务。译为“搬运”能表达活动类别；与后面的“一切服役”共同说明亚伦家指挥权的范围。
- source_word: וּלְכֹל עֲבֹדָתָם
  choice: 还是其他一切服役
  rationale: 保留 עֲבֹדָה 与前文的一致译法；补出“其他”以自然表达“搬运”与较广义“一切服役”的并列关系，并用“都是如此”承接前面的指挥规定。
- source_word: וּפְקַדְתֶּם עֲלֵיהֶם
  choice: 你们要……指定给他们
  rationale: פקד 在此结构中有委派、指定责任之意；下接“他们所搬运的一切”，因此重点不是点数，而是明确分派。
- source_word: בְּמִשְׁמֶרֶת
  choice: 作为他们当尽的职责
  rationale: מִשְׁמֶרֶת 可指受托的责任、职守或义务。“当尽的职责”清楚传达具有约束力的指派，同时脚注保留“职守”的可能表达。
- source_word: אֵת כָּל מַשָּׂאָם
  choice: 他们所搬运的一切物件
  rationale: 这里是 פקד 的直接宾语，具体指全部待运之物。补出“物件”使中文明确自然，并保留原文对搬运范围的重复强调。
theological_decisions: []
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。用“服役”表达利未人在会幕中的受派劳作，用“搬运……物件”使具体运输任务清晰；保留原文的指令语气、重复强调及“吩咐/话”和“职责/职守”之间的词义空间。
