  text: וְ/עַ֣ל מִזְבַּ֣ח הַ/זָּהָ֗ב יִפְרְשׂוּ֙ בֶּ֣גֶד תְּכֵ֔לֶת וְ/כִסּ֣וּ אֹת֔/וֹ בְּ/מִכְסֵ֖ה ע֣וֹר תָּ֑חַשׁ וְ/שָׂמ֖וּ אֶת בַּדָּֽי/ו׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/011.yaml
  text: And over the golden altar they shall spread a blue cloth[a], and cover it with a covering of fine leather, and put its poles in place.
translation:
  language: zh_hans
  text: 他们要在金坛上铺一块蓝色布，用他革皮的罩子[a]把坛盖住，并安上坛的杠。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “他革”音译希伯来语תחש（tachash）。该词所指的动物或材料不能确定；也可译作“上等皮革”“儒艮皮”等。
    reason: 保留תחש的词义不确定性，不在正文武断指定动物或材料。
lexical_decisions:
- source_word: מִזְבַּח הַזָּהָב
  choice: 金坛
  rationale: 直译为“金的坛”；“金坛”在现代汉语中简洁自然，也符合会幕器具的语境。
- source_word: יִפְרְשׂוּ
  choice: 铺
  rationale: פרשׂ表示展开、铺开；这里指把布铺在坛上，用“铺”自然准确。
- source_word: בֶּגֶד תְּכֵלֶת
  choice: 一块蓝色布
  rationale: בגד在此指布，תכלת指会幕礼仪中所用的蓝色或蓝紫色染料。正文采用通顺的“蓝色布”，不对古代色调作过度限定。
- source_word: וְכִסּוּ אֹתוֹ
  choice: 把坛遮盖起来
  rationale: כסה意为遮盖；将代词明确为“坛”，可避免汉语中指代不清，同时不增加原文含义。
- source_word: בְּמִכְסֵה עוֹר תָּחַשׁ
  choice: 用他革皮制的罩子
  rationale: מכסה是罩子或覆盖物，עור是皮革，תחש所指动物不确定。采用音译“他革”保留原文的不确定性，并在脚注说明。
- source_word: וְשָׂמוּ אֶת בַּדָּיו
  choice: 把坛的杠穿上
  rationale: בדיו指坛的抬杠。结合相邻搬运条例，这一动作是把杠装到指定位置；“穿上”符合会幕器具上将杠穿入环内的具体操作。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙述。保留礼仪指令的连续动作，以“要……再……并……”呈现；“他革”配脚注，兼顾原文形式与读者理解。
