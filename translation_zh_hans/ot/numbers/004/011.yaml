    reason: 保留תחש的词义不确定性，不在正文武断指定动物或材料。
  revision_rationale: 仅修正“穿上”的不自然表达及其对动作的过度具体化，并收敛脚注中对תחש性质的断言。其余译文保留原有的礼仪指令顺序、庄重语体和词义不确定性。
