- from: 他们要在上面蒙上塔哈示皮[a]制的罩子，再在最上面铺一块全蓝色的布，然后把抬杠安放好。
  to: 他们要在其上盖上塔哈示皮制的覆盖物，再在上面铺一块通体蓝色的布，并把它的杠安好。
  rationale: 修订仅改善现代汉语的自然度和指代清晰度，同时保留原文的程序次序、词义不确定性及礼仪语体；不对塔哈示动物身份或杠的具体安装方式作额外断定。
