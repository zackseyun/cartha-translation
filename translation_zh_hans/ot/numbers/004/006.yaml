  text: וְ/נָתְנ֣וּ עָלָ֗י/ו כְּסוּי֙ ע֣וֹר תַּ֔חַשׁ וּ/פָרְשׂ֧וּ בֶֽגֶד כְּלִ֛יל תְּכֵ֖לֶת מִ/לְ/מָ֑עְלָ/ה וְ/שָׂמ֖וּ בַּדָּֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/006.yaml
  text: They shall put over it a covering of fine leather[a], and spread over that a cloth wholly of blue, and they shall put its poles in place.
translation:
  language: zh_hans
  text: 他们要在其上盖上塔哈示皮制的覆盖物，再在上面铺一块通体蓝色的布，并把它的杠安好。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְנָתְנוּ עָלָיו
  choice: 他们要在上面蒙上
  rationale: 在礼仪操作指示中，连词加完成式带有指令性的将来意味；“蒙上”自然表达把罩子覆盖在约柜上。
- source_word: כְּסוּי עוֹר תַּחַשׁ
  choice: 塔哈示皮制的罩子
  rationale: כְּסוּי 指覆盖物或罩子；תַּחַשׁ 所指动物无法确定，因此采用音译“塔哈示”并以脚注说明，避免把有争议的动物种类写进正文。
- source_word: וּפָרְשׂוּ
  choice: 再……铺
  rationale: 该动词表示将布或覆盖物展开铺设；“再”清楚呈现连续操作的层次。
- source_word: בֶגֶד כְּלִיל תְּכֵלֶת
  choice: 一块全蓝色的布
  rationale: בֶגֶד 在此不是穿着的衣服，而是铺在约柜上的布；כְּלִיל 强调整块布完全是 תְּכֵלֶת 所指的蓝色。
- source_word: מִלְמָעְלָה
  choice: 在最上面
  rationale: 该词表示位于上方；结合各层覆盖物的铺设次序，“在最上面”准确而自然。
- source_word: וְשָׂמוּ בַּדָּיו
  choice: 然后把抬杠安放好
  rationale: בַּדָּיו 指约柜的杠；“抬杠”交代其用途，“安放好”保留 שׂים 的一般性，不额外断定具体安装动作。
