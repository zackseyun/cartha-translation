base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/018.yaml
  text: Do not cut off the tribe of the families of the Kohathites from among the Levites[a].
translation:
  language: zh_hans
  text: 不要使哥辖人诸家族所成的一支从利未人中断绝[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“不要毁灭哥辖人的宗族。”希伯来语动词既可指“使断绝、剪除”，也可指“毁灭”；“家族”也可译作“宗族”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל
  choice: 不要
  rationale: 否定词在此表达禁令；“不要”符合现代汉语的命令语气。
- source_word: תַּכְרִיתוּ
  choice: 使……断绝
  rationale: כרת的使役式意为“使被剪除、使灭亡”。“使……断绝”既保留使役含义，也不把这里具体限定为肉身毁灭。
- source_word: שֵׁבֶט
  choice: 这一支
  rationale: 该词在谱系语境中指较大群体内的一个支系。“这一支”比直译“支派”更适合描述利未人内部的哥辖族，同时保留其群体层级。
- source_word: מִשְׁפְּחֹת
  choice: 各家族
  rationale: 复数附属形式指哥辖人之中的多个家族单位；“各家族”清楚保留复数，也可理解为“各宗族”。
- source_word: הַקְּהָתִי
  choice: 哥辖人
  rationale: 希伯来语虽为单数族称形式，此处具有集合意义；“哥辖人”自然指整个哥辖群体。
- source_word: מִתּוֹךְ
  choice: 从……中
  rationale: 表达从一个较大群体内部被分离出去，现代汉语自然且准确。
- source_word: הַלְוִיִּם
  choice: 利未人
  rationale: 这是该族名在中文圣经传统中通行且清楚的译法。
theological_decisions:
- issue: 禁令所指的哥辖人结局
  choice: 译作“不要使……断绝”，表达不可导致这一群体从利未人中消失，却不在正文中说明造成这种结局的具体方式。
  alternative: 译作“不要毁灭哥辖人的宗族”，明确强调死亡或毁灭。
  rationale: 本节本身只颁布禁令；上下文才说明他们若不当接触圣物便会死亡。因此正文保留原文可指“剪除”或“毁灭”的宽度，不提前消解其神学张力。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“哥辖人各家族这一支”保留原文“支系—家族—哥辖人”的层级关系，同时避免生硬的“哥辖人各家族的支派”。
