  text: Then they shall remove the ashes from the altar and spread over it a purple cloth[a].
translation:
  language: zh_hans
  text: 随后，他们要除去祭坛上的灰烬，把紫色布铺在祭坛上[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“洁净祭坛”，也可理解为“除去祭坛上含油脂的灰烬”。希伯来语动词在祭祀语境中特指清除祭坛上的灰烬残渣。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְדִשְּׁנוּ
  choice: 要除去……灰烬
  rationale: דשׁן的皮埃勒形在此祭祀语境中指清除祭坛上夹有油脂的灰烬残渣；译作“除去灰烬”自然清楚，也不把含义泛化为一般的洁净。
- source_word: הַמִּזְבֵּחַ
  choice: 祭坛
  rationale: מִזְבֵּחַ在会幕祭祀语境中的标准对应词。
- source_word: וּפָרְשׂוּ
  choice: 铺
  rationale: פרשׂ意为展开、铺开；用于将布覆盖在祭坛上时，“铺”符合现代汉语习惯。
- source_word: עָלָיו
  choice: 在坛上
  rationale: עַל加代词后缀表示覆盖在祭坛之上；明确复现“坛”，可避免汉语代词指向含混。
- source_word: בֶּגֶד
  choice: 布
  rationale: בֶּגֶד常指衣物或织物，此处是覆盖圣物的纺织品，译作“布”最符合其具体功用。
- source_word: אַרְגָּמָן
  choice: 紫色
  rationale: אַרְגָּמָן指紫色染料或紫染材料；与“布”组合译为“紫色布”，清楚而不过度具体化。
