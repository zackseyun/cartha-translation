  text: And those counted from them by their clans were three thousand two hundred.
translation:
  language: zh_hans
  text: 按宗族登记的，共有三千二百人。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: 共有
  rationale: 该叙事形式承接上文并引出统计结果；“共有”在现代汉语中自然表达所得总数，无须机械译出连接词。
- source_word: פְקֻדֵיהֶם
  choice: 统计，他们
  rationale: 在本段人口核点的语境中，指他们当中被点数、登记的人；用“统计”配合主语“他们”，简洁表达其人数经核点所得，且不额外补入原文此处未明说的身份。
- source_word: לְמִשְׁפְּחֹתָם
  choice: 按宗族
  rationale: מִשְׁפָּחָה在以色列支派组织和人口统计语境中通常指支派之下的宗族单位；“按宗族”准确、简洁，也符合现代汉语表达。
- source_word: שְׁלֹשֶׁת אֲלָפִים וּמָאתָיִם
  choice: 三千二百人
  rationale: 直接表达基数总额；补入量词“人”是汉语自然表达所需，也由人口统计语境明确支持。
