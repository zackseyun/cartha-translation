  text: their counted men were eight thousand five hundred and eighty[a].
translation:
  language: zh_hans
  text: 他们中被数点的共有八千五百八十人[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们中登记在册的共有八千五百八十人”，或“他们被数点的人共有八千五百八十人”。希伯来文指在人口统计中登记、数点的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: 共有
  rationale: 此处 היה 的叙事形式用于引出统计总数；中文用“共有”自然地表达合计数量。
- source_word: פְּקֻדֵיהֶם
  choice: 他们中被数点的
  rationale: 该词源于 פקד，在本段人口统计和编组的语境中指登记在册、被统计的人；“他们中被数点的”贴近原文，并保留其名词性指称。上下文已明确所数点的是符合会幕服役条件的男性，句末加“人”即可自然表达，无须把“男人”直接嵌入该短语。
- source_word: שְׁמֹנַת אֲלָפִים
  choice: 八千
  rationale: 按现代汉语基数词的通常形式直译。
- source_word: וַחֲמֵשׁ מֵאוֹת
  choice: 五百
  rationale: 作为累加数词结构的第二部分，译为“五百”。
- source_word: וּשְׁמֹנִים
  choice: 八十
  rationale: 作为总数的最后一项，现代汉语合并表达为“八千五百八十”。
theological_decisions:
- issue: 人口统计用语的性别指向
  choice: 他们中被数点的……人
  alternative: 他们被数点的男丁／他们登记在册的人
  rationale: 本章上下文明确统计的是指定年龄范围内、可承担会幕事务的利未男性；本节希伯来词本身着重于“被数点者”。正文采用自然且贴近原文的“被数点的……人”，不把语法上未明说的“男丁”加入核心措辞，同时由上下文保留实际的男性指向。
translation_notes:
  register: 采用现代、庄重而易懂的统计叙述。“数点”是中文圣经语境中较为熟悉的表达，但配合“共有”和“人”，使句子符合当代普通话习惯。
