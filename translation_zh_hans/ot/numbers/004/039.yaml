  text: from thirty years old and upward[a], up to fifty years old, everyone who enters the service for the work in the tent of meeting—
translation:
  language: zh_hans
  text: 从三十岁起，直到五十岁，凡前来服役、在会幕里办理事务的——
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִבֶּן שְׁלֹשִׁים שָׁנָה וָמַעְלָה
  choice: 从三十岁以上
  rationale: 这是表示年龄下限的希伯来语习语；此译保留“从……以上”的范围结构，并符合现代汉语表达。
- source_word: וְעַד בֶּן חֲמִשִּׁים שָׁנָה
  choice: 直到五十岁
  rationale: 清楚表达年龄范围的上限，同时保留原文“直到”的形式。
- source_word: כָּל הַבָּא לַצָּבָא
  choice: 凡前来任职
  rationale: בוא 表示前来或进入，צבא 在本章指有组织的利未人职务，而非一般军事行动；“前来任职”自然传达进入指定服役行列之意。
- source_word: לַעֲבֹדָה
  choice: 工作的
  rationale: עֲבֹדָה 指劳动、工作或服役；这里用“工作”与前面的“任职”相区别，避免把两个相关但不同的词合并为同一译词。
- source_word: בְּאֹהֶל מוֹעֵד
  choice: 在会幕里
  rationale: “会幕”是 אֹהֶל מוֹעֵד 的通行译名；“在……里”直接对应介词 בְּ，并表明工作的场所与范围。
