revisions:
- from: 从三十岁以上，直到五十岁，凡前来任职[a]、在会幕里工作的——
  to: 从三十岁起，直到五十岁，凡前来服役、在会幕里办理事务的——
  rationale: 修正年龄范围的现代汉语表达，并将“任职”改为“服役”，以更准确表达上下文中受编组的利未职责；以“办理事务”对应后续的工作词，维持两个原文词的区分。保留句末破折号，因为本节在原文和译文中均承接上下文。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T04:51:24Z'
review_pass:
  verdict: revise
  source_fidelity: 原文以年龄范围限定“所有前来服役、在会幕中办理事务的人”。草稿对基本范围和会幕术语的把握正确，但“从三十岁以上”在现代汉语中搭配不当，可能弱化三十岁作为起点的明确性；“任职”也较易指接受职位或职业任命，未充分贴合本章有组织的利未职责。
  naturalness: “从三十岁起，直到五十岁”是自然、明确的年龄范围表达。“凡前来服役、在会幕里办理事务的”保留本节承接上文的名词性/分词性结构，也比“前来任职、在会幕里工作的”更符合礼仪职责语境。
  terminology: “会幕”可保留，且与常用圣经汉语一致。以“服役”对应 לַצָּבָא、以“办理事务”对应 לַעֲבֹדָה，可在不将其限定为军事行动的前提下，保留两个相关但不完全相同的职责词。
  issues:
  - severity: medium
    issue: “从三十岁以上”表达不规范且范围起点不够清晰。
    rationale: “以上”本身已表示下限；与“从”连用不如“从三十岁起”自然。原文明确以三十岁为起点。
  - severity: medium
    issue: “前来任职”不够贴合本章的服事/值勤语境。
    rationale: 任职通常指受任某一职位，容易带入现代职业任命含义；原文此处指进入有组织的职责或服役行列。
  - severity: low
    issue: 脚注替代译文与正文的词汇差异说明可更准确。
    rationale: 应使替代译法确实呈现“值勤/工作”与“服役/办理事务”的不同搭配，并保留其适用于整个短语的范围。
  revised_text: 从三十岁起，直到五十岁，凡前来服役、在会幕里办理事务的——
  revised_footnotes:
  - marker: a
    text: 或译：“凡前来当值、在会幕里工作的”。
    reason: 原文 צבא 与 עֲבֹדָה 可分别指受编组的职责/值勤和所办理的工作；此译法保留另一种自然的中文词汇搭配。
