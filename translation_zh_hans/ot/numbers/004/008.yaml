id: NUM.4.8
reference: Numbers 4:8
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וּ/פָרְשׂ֣וּ עֲלֵי/הֶ֗ם בֶּ֚גֶד תּוֹלַ֣עַת שָׁנִ֔י וְ/כִסּ֣וּ אֹת֔/וֹ בְּ/מִכְסֵ֖ה ע֣וֹר תָּ֑חַשׁ וְ/שָׂמ֖וּ אֶת בַּדָּֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/008.yaml
  text: They shall spread over them a cloth of scarlet yarn, and cover it with a covering of tahash skin, and put its poles in place.
translation:
  language: zh_hans
  text: 他们要在这些器具上铺一块朱红色的布，再用一层他哈示皮[a]盖住它，并把它的杠安上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文作“他哈示”；所指的动物或材料不能确定。传统译法包括“獾皮”“海豚皮”，也有较笼统地译作“精美皮革”的。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפָרְשׂוּ עֲלֵיהֶם
  choice: 他们要在这些器具上铺
  rationale: 动词 פרשׂ 表示把覆盖物铺开；复数代词承接上一节所列的器具。补出“器具”可使中文指代清楚。
- source_word: בֶּגֶד תּוֹלַעַת שָׁנִי
  choice: 一块朱红色的布
  rationale: בגד 在这里是覆盖圣物的布，而非衣服；תולעת שני 指朱红色的染料或染成这种颜色的材料。译作“朱红色的布”不额外加入原文未明说的“线”。
- source_word: וְכִסּוּ אֹתוֹ בְּמִכְסֵה
  choice: 再用一层……盖住它
  rationale: 保留原文从复数“它们”转为单数“它”的变化；מכסה 表示外层覆盖物，中文用“一层”自然表达其功能。
- source_word: עוֹר תָּחַשׁ
  choice: 他哈示皮
  rationale: תחש 所指的动物或皮革种类无法确定，因此采用音译，避免以“獾皮”“海豚皮”等推测性名称造成虚假的确定性。
- source_word: וְשָׂמוּ אֶת־בַּדָּיו
  choice: 并把它的杠安上
  rationale: בדים 是搬运圣物所用的杠；שׂים 的基本义是放置，此处按搬运准备的语境译为“安上”，简洁而具体。
theological_decisions: []
