base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/025.yaml
  text: They shall carry the curtains of the tabernacle[a], and the tent of meeting with its covering, and the covering of fine leather that is over it above, and the screen for the entrance of the tent of meeting,
translation:
  language: zh_hans
  text: 他们要抬运帐幕的幔子、会幕及其罩盖、盖在其上面的塔哈施皮罩[a]，以及会幕门口的帘子。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “塔哈施”译自希伯来语תַּחַשׁ；此词究竟指何种动物、皮革或材料，不能确定。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָשְׂאוּ
  choice: 他们要抬运
  rationale: נשא在搬运圣所物件的语境中指承担并运送；“抬运”自然表达由人负重搬运的动作。
- source_word: יְרִיעֹת הַמִּשְׁכָּן
  choice: 帐幕的幔子
  rationale: יְרִיעֹת指构成帐幕的织物幅面；“幔子”符合会幕语境，也保留其悬挂织物的性质。
- source_word: אֹהֶל מוֹעֵד
  choice: 会幕
  rationale: “会幕”是现代中文圣经中对该圣所名称自然且广为理解的表达，兼顾其帐棚形态与相会功能。
- source_word: מִכְסֵהוּ
  choice: 会幕的罩棚
  rationale: 后缀所指在句法上可理解为会幕；“罩棚”体现覆盖层的实体性质，并避免与下一层皮罩混淆。
- source_word: מִכְסֵה הַתַּחַשׁ
  choice: 海狗皮罩
  rationale: תחש所指动物或材料并不确定；正文采用中文传统中较熟悉的“海狗皮”，并以脚注明确其不确定性，避免把物种判断绝对化。
- source_word: אֲשֶׁר עָלָיו מִלְמָעְלָה
  choice: 盖在最上面的
  rationale: 该短语强调这层罩位于其上方；“最上面”简洁传达外层位置。
- source_word: מָסַךְ פֶּתַח
  choice: 入口的帘子
  rationale: מָסָךְ是遮挡入口的悬挂织物；“帘子”比“屏障”更符合具体物件和自然中文。
