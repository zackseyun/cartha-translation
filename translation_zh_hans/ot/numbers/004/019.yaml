  terminology: “至圣之物”“亚伦”“职务”均适切。“所要搬运的物件”比“所要抬的物件”更自然，也仍保留 מַשָּׂא 在此处指实际搬运之物的含义。脚注中的“至圣的地方”建议规范为“至圣之处”。
  issues:
