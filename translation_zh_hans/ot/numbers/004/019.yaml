  source_fidelity: 译文总体准确传达了保护哥辖人、使其在接近至圣之物时不致死亡，以及亚伦父子逐一分派职责和搬运物的意思。“至圣之物”符合本节在搬运圣物语境中的较可能所指；脚注也恰当地保留了空间性理解。惟“把他们逐人安排到……上”把“他们”置于“职务和物件上”，不合汉语句法，也略模糊了希伯来文“逐一指定每人负责其职务和担子”的分派关系。
