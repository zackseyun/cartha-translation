  text: וְ/זֹ֣את עֲשׂ֣וּ לָ/הֶ֗ם וְ/חָיוּ֙ וְ/לֹ֣א יָמֻ֔תוּ בְּ/גִשְׁתָּ֖/ם אֶת קֹ֣דֶשׁ הַ/קֳּדָשִׁ֑ים אַהֲרֹ֤ן וּ/בָנָי/ו֙ יָבֹ֔אוּ וְ/שָׂמ֣וּ אוֹתָ֗/ם אִ֥ישׁ אִ֛ישׁ עַל עֲבֹדָת֖/וֹ וְ/אֶל מַשָּׂאֽ/וֹ׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/019.yaml
  text: 'But do this for them[b][a], so that they may live and not die when they come near the most holy things: Aaron and his sons shall come and assign each man to his service and to his load.'
translation:
  language: zh_hans
  text: 你们要为他们这样做，使他们在靠近至圣之物[a]时可以存活，不致死亡：亚伦和他的儿子们要进去，逐一派定他们各自的职务和所要搬运的物件[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“至圣所”或“至圣之处”。按本段搬运职责的语境，这里更可能指至圣的器物，而不是内殿本身。
    reason: alternative_reading
  - marker: b
    text: 希伯来文直译为“人、人”，是一种分配式说法，表示每个人都分别领受自己的职务和所搬运的物件。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזֹאת עֲשׂוּ לָהֶם
  choice: 你们要为他们这样做
  rationale: 保留第二人称复数命令和受益对象；“这样做”自然承接上文的警告与指示。
- source_word: וְחָיוּ וְלֹא יָמֻתוּ
  choice: 使他们……可以存活，不致死亡
  rationale: 将并列式表达理解为所吩咐行动的目的或结果，同时保留“存活／死亡”的鲜明对照。
- source_word: בְּגִשְׁתָּם
  choice: 在……接近……时
  rationale: 介词加不定词结构表达时间情境；“接近”也保留礼仪语境中靠近圣物的意味。
- source_word: קֹדֶשׁ הַקֳּדָשִׁים
  choice: 至圣之物
  rationale: 结合本章关于哥辖人搬运圣物的语境，将该短语理解为最神圣的器物，而非单指一个空间；脚注保留空间性译法。
- source_word: אַהֲרֹן וּבָנָיו יָבֹאוּ
  choice: 亚伦和他的儿子们要进去
  rationale: 保留亲属称谓和法规性语气；按其进入圣所为器物作安排的场景，将“来／进入”自然译为“进去”。
- source_word: וְשָׂמוּ אוֹתָם
  choice: 把他们……安排到
  rationale: 此处的“放置”结合后面的职务和担子，表示为每个人指定位置与任务；“安排到”兼顾具体配置和行政指派。
- source_word: אִישׁ אִישׁ
  choice: 逐人
  rationale: 重复的“人、人”是分配性表达，意为一个一个地、每人分别；“逐人”简洁保留这一强调。
- source_word: עַל עֲבֹדָתוֹ
  choice: 各自的职务
  rationale: עֲבֹדָה 在利未人的礼仪语境中指获派的服役职责；“职务”庄重且易懂。
- source_word: וְאֶל מַשָּׂאוֹ
  choice: 所要抬的物件
  rationale: מַשָּׂא 在搬运语境中指各人承担并抬运的对象；此译比抽象的“重担”更清楚地呈现具体运输含义。
theological_decisions:
- issue: קֹדֶשׁ הַקֳּדָשִׁים 的所指
  choice: 正文译作“至圣之物”
  alternative: “至圣所”或“至圣的地方”
  rationale: 上下文讨论祭司包裹圣物后由哥辖人承担搬运工作，因此集合性地指最神圣的器物更符合近距离语境；但希伯来语短语本身也可作空间性理解，故在脚注中保留。
- issue: אִישׁ אִישׁ 的性别与分配意义
  choice: 译作“逐人”
  alternative: “每个人”或“一个一个地”
  rationale: 这里实际所指是男性利未人；“逐人”既不否认该语境，又直接传达希伯来语重复形式的分配作用。
translation_notes:
  register: 采用现代、庄重而易懂的法规叙述语体。“不致死亡”“职务”保持经文的严肃性；“所要抬的物件”则具体呈现本章的搬运场景，避免把 מַשָּׂא 误解为比喻性的心理或道德重担。
