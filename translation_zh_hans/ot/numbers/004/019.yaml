    issue: “把他们逐人安排到各自的职务和所要抬的物件上”句法和搭配不当。
    rationale: 原文的“设立他们，逐人按其服役和其担子”表达逐一分派人员的职责及所承担搬运物；中文“安排到……上”却使人仿佛被安排到职务或物件上，未清楚表达指定、分派。
  - severity: low
    issue: 脚注的替代译法“至圣的地方”不够规范自然。
    rationale: 若保留空间性替代译法，“至圣之处”较符合现代中文圣经语体，也较清楚。
