  text: וּ/בָ֨א אַהֲרֹ֤ן וּ/בָנָי/ו֙ בִּ/נְסֹ֣עַ הַֽ/מַּחֲנֶ֔ה וְ/הוֹרִ֕דוּ אֵ֖ת פָּרֹ֣כֶת הַ/מָּסָ֑ךְ וְ/כִ֨סּוּ בָ֔/הּ אֵ֖ת אֲרֹ֥ן הָ/עֵדֻֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/005.yaml
  text: When the camp sets out[a], Aaron and his sons shall come and take down the veil of the screen, and cover the ark of the testimony with it.
translation:
  language: zh_hans
  text: 营地启程时，亚伦和他的儿子们要来，拆下遮蔽用的帷幔，用它盖住见证柜[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 传统常称“约柜”；但本节希伯来原文直译为“见证柜”。
    reason: 说明原文字词与传统称法之间的差异。
lexical_decisions:
- source_word: וּבָא
  choice: 要来
  rationale: 该动词在形态上为单数，但主语是“亚伦和他的儿子们”，且后续动词均为复数，因此按集体性的指令语气处理。“要来”既保留基本动词含义，也符合本段未来指令的语境。
- source_word: בִּנְסֹעַ הַמַּחֲנֶה
  choice: 营地启程时
  rationale: 介词 בְּ 加不定词结构表示时间；“启程时”自然表达营地开始迁移之际，同时保留“营地”作为原文语法主语。
- source_word: וְהוֹרִדוּ
  choice: 拆下
  rationale: 在拆卸并收纳会幕器具的语境中，“拆下”比一般的“降下”更准确地表达把帷幔从原位取下。
- source_word: פָּרֹכֶת הַמָּסָךְ
  choice: 遮蔽用的帷幔
  rationale: פָּרֹכֶת 指圣所内具有分隔作用的帷幔，הַמָּסָךְ 强调其遮蔽功能；此译法在现代汉语中自然，并保留两词所表达的帷幔及遮蔽含义。
- source_word: וְכִסּוּ בָהּ
  choice: 用它盖住
  rationale: כסה 的基本义为“遮盖”，阴性代词所指的是前述帷幔；“用它”明确表达原文介词的工具意义。
- source_word: אֲרֹן הָעֵדֻת
  choice: 见证柜
  rationale: 原文使用 עֵדוּת（见证），而非 בְּרִית（约）。“见证柜”简洁保留原词，不以传统的“约柜”取代原文措辞。
theological_decisions:
- issue: אֲרֹן הָעֵדֻת 的传统译法
  choice: 见证柜
  alternative: 约柜
  rationale: 本节原文明确为“见证”，并非“约”。正文据原文译作“见证柜”，脚注提示读者传统称法，以免熟悉术语遮蔽此处真实的词汇差异。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“营地启程时”和“拆下”适合实际迁移、收纳的场景；“遮蔽用的帷幔”避免生硬复制希伯来语属格结构；“见证柜”保留原文术语，并以脚注照顾读者熟悉的传统称法。
