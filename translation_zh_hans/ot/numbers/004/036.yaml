  text: 按宗族统计，他们中被数点的共有二千七百五十人。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: 共有
  rationale: 该叙事形式承接上文并引出统计结果；汉语用“共有”自然表达人数总计，同时不另加语义重音。
- source_word: פְקֻדֵיהֶם
  choice: 他们被数点的
  rationale: 该词源自פקד，在人口登记和点名语境中指被登记、被清点的人；“被数点的”保留其被动、结果性的含义。
- source_word: לְמִשְׁפְּחֹתָם
  choice: 按宗族统计
  rationale: מִשְׁפָּחָה在以色列社会结构中通常指支派之下的宗族或家族群体；“按宗族统计”既表达分类依据，也符合现代汉语的人口清点语境。
- source_word: אַלְפַּיִם שְׁבַע מֵאוֹת וַחֲמִשִּׁים
  choice: 二千七百五十人
  rationale: 准确保留原文总数；末加量词“人”是现代汉语表达人数所需，并由本段人口统计语境明确支持。
