base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/031.yaml
  text: 'And this is the duty of their burden for all their service in the tent of meeting: the frames of the tabernacle[a], its bars, its pillars[c][b], and its bases.'
translation:
  language: zh_hans
  text: 这就是他们在会幕中一切服事中所负责搬运的物件：帐幕的框架[a]、横闩、柱子和底座[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “框架”也可译作“木板”；希伯来语所指的是构成帐幕结构的板状构件。
    reason: lexical_alternative
  - marker: b
    text: “底座”也可译作“卯座”，指安放框架或柱子的基础构件。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזֹאת
  choice: 这是
  rationale: 用自然的现代汉语引出对米拉利人职责的具体说明；上下文已足以体现希伯来语连接词的承接作用。
- source_word: מִשְׁמֶרֶת מַשָּׂאָם
  choice: 他们……所负责搬运的物件
  rationale: מִשְׁמֶרֶת表示受托的职责，מַשָּׂא在此具体指运输时承担的载物；合译可避免生硬的“担子之职责”，并清楚表明下列清单是他们奉派搬运的物件。
- source_word: לְכָל עֲבֹדָתָם
  choice: 办理一切事务时
  rationale: עֲבֹדָה在此指会幕相关的职务或劳作；“办理事务”既自然，又保留其服役语境，而不过度赋予礼仪性含义。
- source_word: בְּאֹהֶל מוֹעֵד
  choice: 在会幕中
  rationale: 采用中文圣经语境中通行且易懂的“会幕”，指约定相会之帐幕；“在……中”表示其服役范围。
- source_word: קַרְשֵׁי הַמִּשְׁכָּן
  choice: 帐幕的框架
  rationale: קֶרֶשׁ可指木板或结构构件；“框架”突出其建筑支撑功能，同时以脚注保留“木板”这一较具体的可能译法。
- source_word: בְרִיחָיו
  choice: 横闩
  rationale: 这些构件穿连或固定帐幕框架；“横闩”比泛称“闩”更清楚，又不至于像“横杆”那样淡化固定作用。
- source_word: עַמּוּדָיו
  choice: 柱子
  rationale: 该词表示直立的支撑构件；“柱子”是准确、自然且易懂的现代汉语。
- source_word: אֲדָנָיו
  choice: 底座
  rationale: 指承接框架或柱子的基础构件；“底座”通俗清楚，脚注保留更技术性的“卯座”译法。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。句式按中文习惯重组，将希伯来语“所搬运之物的职责”表达为“所负责搬运的物件”，既保留受托职责与实际载物两层含义，也使后面的构件清单衔接清楚。
