base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/028.yaml
  text: This is the service of the families of the sons of the Gershonites in the tent of meeting[b][a], and their duty shall be under the hand of Ithamar son of Aaron the priest.
translation:
  language: zh_hans
  text: 这是革顺子孙各家在会幕里的服役；他们所当尽的职责，要由祭司亚伦的儿子以他玛督管。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: זֹאת עֲבֹדַת
  choice: 这是……的服役
  rationale: זֹאת引出对职责的界定；עֲבֹדָה在会幕语境中指受委派的服役工作。“服役”既保留礼仪性服务含义，也避免“事工”可能带来的后期教会术语色彩。
- source_word: מִשְׁפְּחֹת בְּנֵי הַגֵּרְשֻׁנִּי
  choice: 革顺子孙各家
  rationale: 该短语指革顺后裔所属的各家族。“子孙各家”自然保留谱系关系及复数家族单位。
- source_word: בְּאֹהֶל מוֹעֵד
  choice: 在会幕里
  rationale: 按民数记中的固定圣所称谓译为“会幕”；介词בְּ在这里表示服役的场所或范围，译作“在……里”。
- source_word: וּמִשְׁמַרְתָּם
  choice: 他们所当尽的职责
  rationale: מִשְׁמֶרֶת可指受托看守或应履行的责任；“所当尽的职责”在现代汉语中清楚表达被指派的义务。
- source_word: בְּיַד
  choice: 由……督管
  rationale: 字面为“在……手下／手中”，在此是受某人监督、管理的惯用语。“由……督管”传达其实际行政含义。
- source_word: אִיתָמָר בֶּן אַהֲרֹן הַכֹּהֵן
  choice: 祭司亚伦的儿子以他玛
  rationale: 依希伯来语关系，将הַכֹּהֵן理解为修饰亚伦，并以自然汉语说明以他玛的父子关系和祭司谱系。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的经文语体。“革顺”“以他玛”“亚伦”“会幕”沿用通行中文圣经专名。希伯来语句末未显式重复系词，中文以“要由……督管”补足自然句法，并保留职责受祭司监督的关系。
