- source_word: וּפְקוּדֵי
  choice: 被数点的
  rationale: 该词指接受统计、登记的人；承接本章人口核点的语境，用“被数点的”既保留原文名词化表达，也自然衔接下文。
- source_word: בְּנֵי גֵרְשׁוֹן
  choice: 革顺子孙
  rationale: בני在家族谱系语境中不仅限于亲生儿子，译作“子孙”更符合所指数代宗族成员。
- source_word: לְמִשְׁפְּחוֹתָם
  choice: 按着宗族
  rationale: 保留לְ表示分类依据的功能；“宗族”适合民数记的群体编制语境。
- source_word: וּלְבֵית אֲבֹתָם
  choice: 父家
  rationale: 直译父系家族单位，保留古代以父系家族为登记单位的社会结构。
