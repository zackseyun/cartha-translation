  text: from thirty years old and upward[a], up to fifty years old[b], everyone who comes for service, to do the work in the tent of meeting.
translation:
  language: zh_hans
  text: 从三十岁起，直到五十岁，凡前来担任职役、在会幕中做工的人。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “职役”所译的希伯来词也可指有组织的当班或服务；在这里是指会幕中的职责，不是军事作战。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִבֶּן שְׁלֹשִׁים שָׁנָה וָמַעְלָה וְעַד בֶּן חֲמִשִּׁים שָׁנָה
  choice: 从三十岁以上，直到五十岁
  rationale: 保留希伯来文年龄范围的起点、וָמַעְלָה“以上”和עַד“直到”所表达的上限，措辞符合现代汉语经文语体。
- source_word: כָּל הַבָּא
  choice: 凡来……的
  rationale: 保留בוא分词的动态意味，不将其过度解释为正式加入某一机构。
- source_word: לַצָּבָא
  choice: 来服役
  rationale: 在利未人会幕职责的语境中，צָבָא指有组织的当班服事或职役；“服役”既体现其编制服勤的色彩，也不必限定为军事行动。
- source_word: לַעֲבֹדָה
  choice: 办事
  rationale: עֲבֹדָה在此指实际承担的工作；“办事”可与前面的“服役”有所区分，又避免采用带有现代教会专门含义的措辞。
- source_word: בְּאֹהֶל מוֹעֵד
  choice: 在会幕里
  rationale: “会幕”是אֹהֶל מוֹעֵד在中文圣经传统中清楚而简洁的对应；介词בְּ按工作所处的范围译为“在……里”。
- source_word: '[contextual main verb from Numbers 4:34]'
  choice: 都数点了
  rationale: 本节希伯来文在句法上承接第34节的有限动词，单独列为一节时补出承前谓语，使现代中文读者能读成完整句子；不改变被数点者的范围。
