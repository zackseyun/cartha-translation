- source_word: וּפְקוּדֵי
  choice: 被数点的人
  rationale: פְקוּדֵי 在本段人口核点的语境中指登记、数点所得的人；译作“被数点的人”既保留被动意味，也与上下文惯用语一致。
- source_word: מִשְׁפְּחֹת בְּנֵי מְרָרִי
  choice: 米拉利子孙各宗族
  rationale: מִשְׁפְּחֹת 为复数“宗族”，בְּנֵי מְרָרִי 指“米拉利子孙”；依汉语自然语序组合。
- source_word: לְמִשְׁפְּחֹתָם
  choice: 按着宗族
  rationale: 介词 לְ 在分类统计语境中表示“按、依照”，后缀指他们各自的宗族。
- source_word: לְבֵית אֲבֹתָם
  choice: 父家
  rationale: בֵית אָבוֹת 是以父系家族单位为义的固定表达；“父家”简洁保留古代以父系家族编组的概念。
