base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/001.yaml
  text: And Yahweh spoke to Moses and to Aaron[a], saying,
translation:
  language: zh_hans
  text: 耶和华对摩西和亚伦说：
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: 说
  rationale: 该形式在叙事中引出神的讲话；现代汉语用“说”自然、准确，不必机械译成“讲话”。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 这是四字神名יהוה；“耶和华”是现代简体中文圣经语境中广为人知的专名译法，保留其作为神名的功能，而不改作称号“主”。
- source_word: אֶל מֹשֶׁה וְאֶל אַהֲרֹן
  choice: 对摩西和亚伦
  rationale: 介词אֶל标明讲话对象；希伯来文在两个名字前重复介词，中文以并列结构自然表达两人同为受话者。
- source_word: לֵאמֹר
  choice: 说：
  rationale: 这是引出直接引语的惯用公式。中文用“说：”并以冒号承接下文，比重复译作“说……说”更自然。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。正文采用中文读者最熟悉且具有专名功能的“耶和华”；“雅威”更接近常见学术重构读音，但该读音并非由马所拉元音直接保存，且本节无需以脚注处理这种译名差异。
translation_notes:
  register: 采用现代、庄重而简洁的叙事语言。以冒号体现לֵאמֹר引出下一节直接话语的篇章功能；不添加原文没有的主语或解释。
