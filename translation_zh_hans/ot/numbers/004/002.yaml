  text: נָשֹׂ֗א אֶת רֹאשׁ֙ בְּנֵ֣י קְהָ֔ת מִ/תּ֖וֹךְ בְּנֵ֣י לֵוִ֑י לְ/מִשְׁפְּחֹתָ֖/ם לְ/בֵ֥ית אֲבֹתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/002.yaml
  text: Take a census of the sons of Kohath from among the sons of Levi[a], by their clans, by their fathers’ houses.
translation:
  language: zh_hans
  text: “你要数点利未子孙中的哥辖子孙[a]，按他们的宗族、父家登记。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“抬起哥辖子孙的头”，这是指清点人数或进行人口登记的惯用语。
    reason: lexical_alternative
lexical_decisions:
- source_word: נָשֹׂא אֶת רֹאשׁ
  choice: 数点
  rationale: 这是人口统计语境中的固定表达，字面为“抬起……的头”，实际指清点、登记人数。“数点”准确传达行政性普查含义，也符合《民数记》的语体。
- source_word: בְּנֵי קְהָת
  choice: 哥辖子孙
  rationale: 保留希伯来文的谱系表达；现代中文里“子孙”比直译“儿子们”更能自然涵盖哥辖的后裔群体。
- source_word: מִתּוֹךְ בְּנֵי לֵוִי
  choice: 利未子孙中的
  rationale: 清楚表达从较大的利未后裔群体中选取哥辖这一支进行数点；“中的”自然对应“从……当中”。
- source_word: לְמִשְׁפְּחֹתָם
  choice: 按他们的宗族
  rationale: 在以色列人口统计与支派组织语境中，מִשְׁפָּחָה 指宗族层级；“宗族”比泛称“家庭”更准确。
- source_word: לְבֵית אֲבֹתָם
  choice: 父家
  rationale: 保留古代以色列以父系家族为单位的制度性称谓，并与“宗族”区分层级。
- source_word: לְ־… לְ־
  choice: 按……登记
  rationale: 两个介词短语说明统计分类依据。补出“登记”，使现代中文完整自然，同时不增加实质信息。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重且易懂的经文语体。“数点”承接《民数记》的人口统计背景；“宗族、父家”保留原文两级亲属组织的区别。主句补用“登记”以避免“按宗族、父家”悬空，并使指令在中文中自然清晰。
