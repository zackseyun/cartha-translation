source:
  edition: WLC
  text: וְ/כִלָּ֣ה אַֽהֲרֹן וּ֠/בָנָי/ו לְ/כַסֹּ֨ת אֶת הַ/קֹּ֜דֶשׁ וְ/אֶת כָּל כְּלֵ֣י הַ/קֹּדֶשׁ֮ בִּ/נְסֹ֣עַ הַֽ/מַּחֲנֶה֒ וְ/אַחֲרֵי כֵ֗ן יָבֹ֤אוּ בְנֵי קְהָת֙ לָ/שֵׂ֔את וְ/לֹֽא יִגְּע֥וּ אֶל הַ/קֹּ֖דֶשׁ וָ/מֵ֑תוּ אֵ֛לֶּה מַשָּׂ֥א בְנֵֽי קְהָ֖ת בְּ/אֹ֥הֶל מוֹעֵֽד־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/015.yaml
  text: When Aaron and his sons have finished covering the sanctuary and all the furnishings of the sanctuary[a], when the camp sets out, after that the sons of Kohath shall come to carry them; but they shall not touch the holy things, lest they die[c][b]. These are the burden of the sons of Kohath in the tent of meeting.
translation:
  language: zh_hans
  text: 亚伦和他的儿子们把圣物和一切圣器具都遮盖完毕；营地启程时，随后哥辖的子孙[c]要来搬运。但他们不可触摸圣物[a]，他们就会死亡[b]。这就是哥辖子孙在会幕中的搬运职责。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“圣所”。希伯来语此词可集合性地指圣物，也可较广泛地指圣所。
    reason: alternative_reading
  - marker: b
    text: 或译：“免得他们死亡。”希伯来原文直接陈述触犯禁令的后果。
    reason: lexical_alternative
  - marker: c
    text: 也可译：“哥辖人”。原文直译为“哥辖的子孙”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִלָּה ... לְכַסֹּת
  choice: 把……都遮盖完毕
  rationale: 完成体动词与不定式连用，表示完成遮盖这一动作；中文以“遮盖完毕”自然表达。
- source_word: הַקֹּדֶשׁ（首次）
  choice: 圣所
  rationale: 与后面的“圣所的一切器具”并列，指需要预先遮盖的神圣范围或圣所本身；译作“圣所”保留其集合性。
- source_word: כָּל כְּלֵי הַקֹּדֶשׁ
  choice: 圣所的一切器具
  rationale: כְּלֵי可指器皿、用具或陈设；“器具”在现代中文中清楚而不过度限定具体种类。
- source_word: בִּנְסֹעַ הַמַּחֲנֶה
  choice: 营地启程时
  rationale: 时间性不定式结构表示全营开始迁行之际；“启程”符合迁营语境。
- source_word: וְאַחֲרֵי כֵן
  choice: 才
  rationale: 希伯来语强调先完成遮盖、随后哥辖子孙才能进来搬运的程序次序；中文“才”简洁体现这一先后限制。
- source_word: בְנֵי קְהָת
  choice: 哥辖的子孙
  rationale: 保留原文直译的宗族表达，同时以脚注说明可按族群称谓译作“哥辖人”。
- source_word: לָשֵׂאת
  choice: 来抬
  rationale: 该动词指承担、搬运；本段对象是会幕中的圣物，“抬”准确体现实际搬运工作。
- source_word: וְלֹא יִגְּעוּ אֶל הַקֹּדֶשׁ
  choice: 但他们不可触碰圣物
  rationale: 此处紧接搬运器具的规定，具体理解为神圣物件较符合上下文；“圣物”简明保留其神圣属性。
- source_word: וָמֵתוּ
  choice: 否则就会死
  rationale: 原文以“并且／于是他们死亡”直接陈述违禁后果；中文用“否则就会死”自然表达警告，又不削弱后果的确定性。
- source_word: אֵלֶּה מַשָּׂא בְנֵי קְהָת
  choice: 这些就是哥辖子孙……要抬的重物
  rationale: מַשָּׂא可指负载、所搬之物或搬运职责；“要抬的重物”保留具体负载之意，并与复数指示词“这些”协调。
- source_word: בְּאֹהֶל מוֹעֵד
  choice: 在会幕里
  rationale: 按介词ב的直接处所义翻译，同时承认也可理解为哥辖子孙在会幕事务范围内的职责。
theological_decisions:
- issue: 禁令中הַקֹּדֶשׁ的所指
  choice: 圣物，即前文所说的神圣器具
  alternative: 圣所
  rationale: 上下文聚焦于器具被遮盖后由哥辖子孙搬运，因此“圣物”最贴合直接语境；脚注保留该词也可能泛指“圣所”的真实歧义。
- issue: וָמֵתוּ所表达的警告方式
  choice: 否则就会死
  alternative: 免得他们死亡
  rationale: 希伯来语直接陈述死亡后果，而非使用明确的目的或避免结构；正文保留直接性，脚注提供符合警告语气的另一种中文表达。
translation_notes:
  register: 采用现代、庄重而易懂的叙述语体。保留“圣所、圣物、会幕”等通行礼仪词汇；以“遮盖完毕、才可以来抬”清楚呈现搬运程序。正文不替原文消除“圣物／圣所”及“后果陈述／避免警告”的歧义，均以脚注说明。
