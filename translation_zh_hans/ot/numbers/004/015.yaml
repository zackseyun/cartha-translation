revisions:
- from: 亚伦和他的儿子们把圣所和圣所的一切器具都遮盖完毕，营地启程时，哥辖的子孙[c]才可以来抬。但他们不可触碰圣物[a]，否则就会死[b]。这些就是哥辖子孙在会幕里要抬的重物。
  to: 亚伦和他的儿子们把圣物和一切圣器具都遮盖完毕；营地启程时，随后哥辖的子孙[c]要来搬运。但他们不可触摸圣物[a]，他们就会死亡[b]。这就是哥辖子孙在会幕中的搬运职责。
  rationale: 修订保留原文的先后程序、哥辖子孙的宗族称谓、禁触圣物及死亡后果。将搬运动词改为较宽泛的“搬运”，删除原文未明说的许可式表达；末句按“会幕中的搬运职责”处理，以反映 מַשָּׂא 所指的承担任务及 בְאֹהֶל מוֹעֵד 的事务范围。首次“圣物”采用最合搬运上下文的理解，同时在脚注保留“圣所”的歧义。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T04:51:49Z'
review_pass:
  verdict: revise
  source_fidelity: 需修订。原文的程序次序和禁触禁令大体得到反映，但“才可以来抬”加入了许可式语气，且末句“在会幕里要抬的重物”将有关会幕的职责误作在会幕内部搬抬的物品；迁营时这些物件并不在会幕内。首次 הַקֹּדֶשׁ 的具体所指有歧义，正文宜采用与搬运语境相称的集合性“圣物”，并以脚注保留“圣所”的可能。
  naturalness: “遮盖完毕”“营地启程时”自然庄重。“来抬”较口语且过于限定搬运方式；“随后来搬运”更符合现代书面语和 לָשֵׂאת 的宽泛含义。末句改为“在会幕中的搬运职责”可避免不自然且失实的地点修饰。
  terminology: “亚伦”“哥辖”“圣物”“会幕”均可保留。“圣器具”比“圣所的一切器具”更贴合此处物件搬运的语境，且避免把器具误解为圣所建筑的陈设。死亡后果宜按原文直陈为“他们就会死亡”，脚注提供“免得他们死亡”的警告式译法。
  issues:
  - severity: medium
    issue: “才可以来抬”加入许可式“可以”，且“抬”过度具体。
    rationale: וְאַחֲרֵי כֵן...לָשֵׂאת 表示完成遮盖之后的顺序和搬运任务，并未明说许可措辞；לשאת 的基本义较宽，应译为“随后来搬运”。
  - severity: high
    issue: “这些就是哥辖子孙在会幕里要抬的重物”误解末句的介词短语和 מַשָּׂא。
    rationale: בְאֹהֶל מוֹעֵד 描述哥辖子孙就会幕所承担的职分/任务，不宜译为物件在会幕内部被搬抬；迁营语境也不支持该地点理解。
  - severity: medium
    issue: 首次“圣所”在此搬运清单语境中可能造成涵盖建筑本身的误解。
    rationale: הַקֹּדֶשׁ 有“圣所”或集合性的“圣物”之歧义；紧随其后的禁触与搬运更支持正文用“圣物”，并以脚注保留“圣所”的替代理解。
  - severity: low
    issue: “否则就会死”可更贴近原文的直接后果陈述。
    rationale: וָמֵתוּ 直陈“他们就会死亡”；使用明确主语和“死亡”更庄重，也避免“死”的口语感。
