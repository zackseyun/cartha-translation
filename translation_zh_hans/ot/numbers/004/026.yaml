- from: 还有院子的帷幔、院门入口的门帘；这院子围绕着帐幕和祭坛；还有绳索[a]、供这一切使用的全部器具，以及要用它们办理的一切事务[b]。他们要这样服事。
  to: 还有围绕帐幕和祭坛的院子的帷幔，以及院门入口的帘子、它们的绳索[a]、用于办理这些物件相关事务的一切器具，以及要用它们办理的一切事务[b]；他们要执行这项服事。
  rationale: 修订将“围绕帐幕和祭坛”明确连于“院子”，使原文的空间关系在现代汉语中自然清楚；保留物件清单、绳索的词汇替代，以及“要用它们／要为它们办理”的语义歧义。删除原文未明示的“这样”，并将结语译为“执行这项服事”，以符合本节所述的利未职责。
