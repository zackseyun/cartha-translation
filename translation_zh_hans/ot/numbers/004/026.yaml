  text: וְ/אֵת֩ קַלְעֵ֨י הֶֽ/חָצֵ֜ר וְ/אֶת מָסַ֣ךְ פֶּ֣תַח שַׁ֣עַר הֶ/חָצֵ֗ר אֲשֶׁ֨ר עַל הַ/מִּשְׁכָּ֤ן וְ/עַל הַ/מִּזְבֵּ֨חַ֙ סָבִ֔יב וְ/אֵת֙ מֵֽיתְרֵי/הֶ֔ם וְ/אֶֽת כָּל כְּלֵ֖י עֲבֹדָתָ֑/ם וְ/אֵ֨ת כָּל אֲשֶׁ֧ר יֵעָשֶׂ֛ה לָ/הֶ֖ם וְ/עָבָֽדוּ־׀׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/026.yaml
  text: and the hangings of the court, and the screen for the entrance of the gate of the court that is around the tabernacle and around the altar, and their ropes, and all the equipment for their service, and all that is to be done with them. And they shall serve.
translation:
  language: zh_hans
  text: 还有围绕帐幕和祭坛的院子的帷幔，以及院门入口的帘子、它们的绳索[a]、用于办理这些物件相关事务的一切器具，以及要用它们办理的一切事务[b]；他们要执行这项服事。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “绳索”也可译作“绳子”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“以及要为它们办理的一切事务。”希伯来文既可指用这些物件办理的事务，也可指在服事过程中为这些物件所做的事务。
    reason: alternative_reading
lexical_decisions:
- source_word: קַלְעֵי הֶחָצֵר
  choice: 院子的帷幔
  rationale: 指构成会幕外院围墙的织物幔子；“帷幔”庄重而易懂，也可与入口处的“门帘”区分。
- source_word: מָסַךְ פֶּתַח שַׁעַר הֶחָצֵר
  choice: 院门入口的门帘
  rationale: מָסַךְ在圣所语境中指入口处遮挡用的织物；译作“门帘”符合其位置和用途，并保留פֶּתַח שַׁעַר对入口的强调。
- source_word: אֲשֶׁר עַל הַמִּשְׁכָּן וְעַל הַמִּזְבֵּחַ סָבִיב
  choice: 这院子围绕着帐幕和祭坛
  rationale: 关系从句在语义上说明外院所处的空间位置。中文明确补出“这院子”，避免误读为只有门帘围绕帐幕和祭坛。
- source_word: מֵיתְרֵיהֶם
  choice: 绳索
  rationale: 指与帷幔和门帘配套使用的绳或索；“绳索”是现代中文中清楚自然的统称。
- source_word: כָּל כְּלֵי עֲבֹדָתָם
  choice: 供这一切使用的全部器具
  rationale: כְּלֵי泛指器具或装备，עֲבֹדָתָם指这些物件相关的使用或事务；此译避免把物件人格化，同时保留实用功能。
- source_word: כָּל אֲשֶׁר יֵעָשֶׂה לָהֶם
  choice: 要用它们办理的一切事务
  rationale: 介词לָהֶם在此可能表示用这些物件办理，也可能表示为这些物件所做；正文依上下文采用前者，并以脚注保留另一种理解。
- source_word: וְעָבָדוּ
  choice: 他们要这样服事
  rationale: עבד在会幕职责语境中兼有工作和礼仪性服事的意味；“服事”保留该色彩，“这样”自然承接前述物件与事务。
theological_decisions:
- issue: כָּל אֲשֶׁר יֵעָשֶׂה לָהֶם中לָהֶם所表达的关系
  choice: 要用它们办理的一切事务
  alternative: 要为它们办理的一切事务
  rationale: 上下文列举革顺子孙负责搬运和使用的物件，工具义较为顺畅；但希伯来文也容许受益或关联意义，因此不在正文中消除这一歧义，而以脚注保留。
translation_notes:
  register: 采用现代、庄重而通顺的普通话。经文承接上一节，故以“还有”起句；使用“帐幕”“祭坛”“服事”等常见圣经术语。分号用于清楚区分所列门帘与说明外院位置的关系从句，末句独立，以保留希伯来文结尾命令式陈述的力度。
