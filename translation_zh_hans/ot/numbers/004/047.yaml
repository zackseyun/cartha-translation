  text: from thirty years old and upward[a], up to fifty years old, everyone who comes to perform the work of service and the service of carrying loads in the tent of meeting.
translation:
  language: zh_hans
  text: 从三十岁起，直到五十岁，凡前来在会幕中从事服事工作和搬运工作的人。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִבֶּן שְׁלֹשִׁים שָׁנָה וָמַעְלָה
  choice: 从三十岁以上
  rationale: 这是设定年龄下限的希伯来语惯用表达；中文以“从三十岁以上”保留“从……以上”的结构，并与下文年龄上限相接。
- source_word: וְעַד בֶּן חֲמִשִּׁים שָׁנָה
  choice: 直到五十岁
  rationale: 明确表达年龄范围的上限；“直到”自然对应 עַד，且不额外判定端点是否包含在内。
- source_word: כָּל הַבָּא
  choice: 凡来……的人
  rationale: 将实体化分词直译为前来履职的人，保留“来”的动态含义，不扩译为“合资格”或“受指派”。
- source_word: לַעֲבֹד
  choice: 办理
  rationale: 以目的性动词引出后面的工作内容；“办理”适合庄重语体，也避免与 עֲבֹדָה 全部机械重复为“服事”。
- source_word: עֲבֹדַת עֲבֹדָה
  choice: 服事的工作
  rationale: 保留同根词叠用所形成的类别或强调意味，同时使现代中文可理解。
- source_word: וַעֲבֹדַת מַשָּׂא
  choice: 搬运之工
  rationale: מַשָּׂא 指所负载、搬运的重物；译文呈现具体搬运职责，而“之工”与前一项形成自然并列。
- source_word: בְּאֹהֶל מוֹעֵד
  choice: 在会幕
  rationale: 采用现代中文圣经语境中通行且简明的固定名称“会幕”；介词译为“在”，表示服事发生的范围或场所。
