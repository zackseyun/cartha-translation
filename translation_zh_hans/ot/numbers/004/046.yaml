base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/046.yaml
  text: All those counted[a], whom Moses and Aaron and the leaders of Israel counted among the Levites[b], by their clans and by their fathers' houses—
translation:
  language: zh_hans
  text: 摩西、亚伦和以色列众首领按宗族、按父家[b]所数点的所有利未人[a]——
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “数点”也可译作“统计”或“登记”。希伯来文使用人口统计用语，源自动词 פקד。
    reason: lexical_alternative
  - marker: b
    text: “父家”指以父系祖先为基础的家族或户族单位，是宗族内部的家族分支。
    reason: cultural_note
lexical_decisions:
- source_word: כָּל הַפְּקֻדִים
  choice: 所有被数点的人
  rationale: 概括受统计的全体；“被数点”保留פקד在本章人口统计语境中的含义，又不额外加入原文此处未明说的“男丁”。
- source_word: אֲשֶׁר פָּקַד
  choice: 数点的
  rationale: 关系从句说明这些人是经摩西、亚伦和众首领正式统计的；与前面的“被数点”保持词根呼应。
- source_word: וּנְשִׂיאֵי יִשְׂרָאֵל
  choice: 以色列众首领
  rationale: נְשִׂיאִים指各支派的领袖；“首领”庄重而自然，也避免“王子”可能造成的误解。
- source_word: אֶת הַלְוִיִּם
  choice: 利未人
  rationale: 原文以直接宾语标记指出被数点的群体是利未人；汉语可直接置于关系结构的中心语位置。
- source_word: לְמִשְׁפְּחֹתָם
  choice: 按宗族
  rationale: מִשְׁפָּחָה在此指人口统计所依据的宗族单位；“宗族”比泛称“家庭”更准确。
- source_word: וּלְבֵית אֲבֹתָם
  choice: 父家
  rationale: בֵּית אָבוֹת是以父系祖先为依据的家族或户族单位；采用简洁的传统表达，并以脚注解释其文化含义。
