- from: 所有被数点的人[a]，就是摩西、亚伦和以色列众首领按宗族、父家[b]数点的利未人——
  to: 摩西、亚伦和以色列众首领按宗族、按父家[b]所数点的所有利未人[a]——
  rationale: 修订将“利未人”置为全句明确的中心语，消除原译中“人”与“利未人”重复嵌套造成的轻微滞涩；同时重复“按”以清晰表达两个编列单位。数点、首领、宗族、父家及未完句的破折号均予保留，未增添原文未明说的性别或其他限定。
