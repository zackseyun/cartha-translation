  yaml_path: translation/ot/numbers/004/021.yaml
  text: Then Yahweh spoke to Moses[a], saying,
translation:
  language: zh_hans
  text: 雅威[a]又对摩西说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文：YHWH；传统上译作“主”。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: 说
  rationale: 该动词表示“说话、讲话”；与后面的 לֵאמֹר 构成希伯来语常见的引语引介格式。中文用“对摩西说”自然简洁，句首不必机械译出承接叙事的 וַ。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 这是四字神名 YHWH。现代汉语圣经传统通常音译为“耶和华”，以专名而非称号表达。
- source_word: אֶל־מֹשֶׁה
  choice: 对摩西
  rationale: 介词 אֶל 在言说结构中引出受话者；现代汉语自然表达为“对摩西”。
- source_word: לֵאמֹר
  choice: 说：
  rationale: 该不定式在此引出随后话语。中文以“说：”连同冒号表达其功能，避免重复译成“说……说”。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文明确使用四字神名。正文保留现代中文读者最熟悉的专名形式“耶和华”；“雅威”较贴近学界常见的重构读音，但原始读音并不能完全确定，因此不在正文中排他性地采用该形式。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。此句是下一段神谕的引介语；以冒号提示后文直接话语。未机械译出句首叙事连接词，也未重复翻译希伯来语的言说公式。
