base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/016.yaml
  text: And the oversight of Eleazar son of Aaron the priest shall be the oil for the light[a], the fragrant incense, the regular grain offering, and the anointing oil—the oversight of the whole tabernacle and all that is in it[d][c][b], the sanctuary and its furnishings.
translation:
  language: zh_hans
  text: 祭司亚伦的儿子以利亚撒负责管理灯油、香料制的香、常献的素祭和膏油；他也负责管理整个帐幕和其中的一切，即圣所及其器具。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文末句直译可作“在圣所中和在其器具中”。这两个带“在”的短语与前文的句法关系较为紧缩；“圣所”也可理解为“圣物”。
    reason: syntactic_and_lexical_alternative
lexical_decisions:
- source_word: פְקֻדַּת
  choice: 负责看管
  rationale: 该词在此指受托承担的监督和管理责任。“负责看管”自然表达这种职责，并适合本节所列圣物及帐幕的语境。
- source_word: שֶׁמֶן הַמָּאוֹר
  choice: 灯油
  rationale: 原文直译为“光的油”，指供灯台照明所用的油；“灯油”在现代汉语中简洁清楚。
- source_word: קְטֹרֶת הַסַּמִּים
  choice: 芬芳的香
  rationale: 该短语指用香料配制的香；“芬芳的香”既自然，又保留其芳香性质。
- source_word: מִנְחַת הַתָּמִיד
  choice: 常献的素祭
  rationale: מִנְחָה指素祭，תָּמִיד表示持续或定期反复；“常献的”不把原文限定为单纯的“每日”。
- source_word: שֶׁמֶן הַמִּשְׁחָה
  choice: 膏油
  rationale: 这是中文圣经语域中清楚而简练的表达，指用于膏抹的圣油。
- source_word: כָּל הַמִּשְׁכָּן
  choice: 整个帐幕
  rationale: 在民数记的礼仪语境中，מִשְׁכָּן指帐幕；“整个”准确传达כָּל的整体范围。
- source_word: בְּקֹדֶשׁ וּבְכֵלָיו
  choice: 包括圣所和其中的器具
  rationale: 末尾短语句法紧缩，בְּ可标示职责涉及的范围。“包括”在汉语中自然呈现其与“其中的一切”的解释性关系；כֵּלִים在此泛指圣所的器具、用具。
theological_decisions:
- issue: 两处פְקֻדַּת的关系及无动词句式
  choice: 以两次“负责看管”呈现：先列具体圣物，再扩展至整个帐幕及其中一切
  alternative: 保留名词性、同位式结构：“以利亚撒的职责是……，即整个帐幕……的职责”
  rationale: 希伯来文是无动词的名词性结构，第二处可作概括或同位说明。汉语若机械保留会生硬，因此补出“他也负责看管”，但不改变以利亚撒受托监督这些对象的核心含义。
- issue: בְּקֹדֶשׁ וּבְכֵלָיו的句法归属
  choice: 视为对“其中的一切”的范围说明，即圣所和其中的器具
  alternative: 较直译地作“在圣所内以及在其器具方面”，或理解为“圣物和器具”
  rationale: 原文连续使用בְּ，语义可理解为以利亚撒职责所涉及的领域。译为“包括”避免不自然的处所表达，同时脚注保留其他可能理解。
translation_notes:
  register: 采用现代、庄重而清楚的叙述语体。“素祭”“膏油”“圣所”“帐幕”保留通行的礼仪术语；通过分号和补出代词，使希伯来文的名词性并列结构在普通现代汉语中易于理解，同时用脚注保留末句的句法与词义歧义。
