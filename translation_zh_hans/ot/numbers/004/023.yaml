base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/023.yaml
  text: From thirty years old and upward to fifty years old[a], you shall count them, everyone who comes to do the service, to do the work in the tent of meeting.
translation:
  language: zh_hans
  text: 从三十岁起，到五十岁为止，你要数点他们，就是凡前来服役[a]、在会幕中办理职务的人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “服役”也可译作“承担职务”或“执行任务”。原文使用常见于编组服役的用语；这里指有组织地承担会幕中的职务，并非实际作战。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִבֶּן שְׁלֹשִׁים שָׁנָה וָמַעְלָה עַד בֶּן חֲמִשִּׁים שָׁנָה
  choice: 从三十岁以上，直到五十岁
  rationale: 希伯来语“从……岁以上，直到……岁”界定年龄范围；中文以“从三十岁以上，直到五十岁”保留起点、向上及上限的表达。
- source_word: תִּפְקֹד אֹתָם
  choice: 你要登记他们
  rationale: פקד在本段人口清点和职务编组的语境中可指清点、登记；“登记”兼顾人数统计与列入服役名册的含义。
- source_word: כָּל־הַבָּא
  choice: 凡来……的
  rationale: 分词与כָּל连用，泛指每一个符合条件、前来承担职责的人；“凡……的”简洁自然。
- source_word: לִצְבֹא צָבָא
  choice: 来任职
  rationale: 该同根结构带有编组服役、执行职务的色彩；在会幕语境中不是实际作战。“任职”表达有组织地承担指定职责，同时以脚注提示其服役色彩。
- source_word: לַעֲבֹד עֲבֹדָה
  choice: 做工
  rationale: 动词与同根名词连用，强调实际执行所分派的工作；现代中文用“做工”简明传达。
- source_word: בְּאֹהֶל מוֹעֵד
  choice: 在会幕里
  rationale: אֹהֶל מוֹעֵד是以色列敬拜场所的固定名称，现代中文惯译为“会幕”；介词בְּ按其空间义译作“在……里”。
theological_decisions:
- issue: צָבָא相关表达是否应明确译成军事用语
  choice: 正文译作“任职”，并用脚注保留“服役/当差”的词义色彩
  alternative: 服兵役；出征；当差
  rationale: 本章所述是利未人在会幕中的有组织服事，并非战争。正文不采用会令人误解为实际作战的措辞，但脚注保留原文借用服役语言的特点。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“登记”比单纯“数点”更能体现列入职务名册的语境；用分号理清主命令与所登记对象之间的关系。
