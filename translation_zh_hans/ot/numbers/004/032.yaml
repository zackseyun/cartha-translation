base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/032.yaml
  text: and the pillars of the surrounding court[a], with their bases, their pegs, and their cords, with all their equipment and with all their service; and you shall assign by name the items of the duty of their burden.
translation:
  language: zh_hans
  text: 还有院子四围的柱子、柱座、橛子和绳子，以及所有相关器具和一切应办的事务。你们要按名指派他们负责搬运的器具。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文结构紧缩，直译可作“他们搬运职责中的器具／物件”；也可理解为要按名指定各人负责搬运的具体器具。
    reason: כְּלֵי מִשְׁמֶרֶת מַשָּׂאָם由“器具／物件、职责、搬运之物”构成紧缩名词链；脚注保留其字面结构和上下文中的个别责任含义。
lexical_decisions:
- source_word: עַמּוּדֵי הֶחָצֵר סָבִיב
  choice: 院子四围的柱子
  rationale: עַמּוּדִים指支撑结构的柱子，חָצֵר指帐幕的院子，סָבִיב表示环绕四周；此译自然地表达柱子位于院子周边。
- source_word: אַדְנֵיהֶם
  choice: 柱座
  rationale: אֶדֶן在会幕语境中指承托柱子的座或卯座；“柱座”既清楚又保留其结构用途。
- source_word: יְתֵדֹתָם
  choice: 橛子
  rationale: יָתֵד指固定帐幕结构所用的桩或橛；“橛子”与绳子搭配自然。
- source_word: מֵיתְרֵיהֶם
  choice: 绳子
  rationale: מֵיתָר指帐幕所用的绳索；“绳子”是普通读者易懂的现代用语。
- source_word: לְכָל כְּלֵיהֶם וּלְכֹל עֲבֹדָתָם
  choice: 以及与这一切器具有关的各项工作
  rationale: כְּלִים在此泛指相关器具，עֲבֹדָה指利未人受派的工作或职务；补出“有关的”呈现两者在语境中的联系，避免生硬的“所有器具和所有工作”。
- source_word: וּבְשֵׁמֹת תִּפְקְדוּ
  choice: 要按名……逐一指派给他们
  rationale: פקד在此不是单纯数点，而是指定或交派责任；בְשֵׁמֹת强调按个人姓名落实，因此用“按名……逐一指派”。
- source_word: כְּלֵי מִשְׁמֶרֶת מַשָּׂאָם
  choice: 他们负责搬运的物件
  rationale: 这一紧缩短语结合“物件”“职责”和“搬运之物”三层含义；译文明确表达每人对具体搬运物件所负的责任，同时以脚注保留较贴近原文结构的表达。
