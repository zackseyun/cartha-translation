base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/034.yaml
  text: So Moses and Aaron and the leaders of the congregation counted the sons of the Kohathites by their clans and by their fathers’ houses[a][b][c].
translation:
  language: zh_hans
  text: 于是，摩西、亚伦和会众的首领，按宗族、按父家[a]数点了哥辖子孙[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “父家”是古代以色列的亲属组织用语，指按父系祖先划分的家族单位。
    reason: cultural_note
  - marker: b
    text: 原文直译为“哥辖人的众子”，即哥辖的后裔群体。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְקֹד
  choice: 数点
  rationale: 在民数记第4章的服役人口统计语境中，פקד指清点、登记人员；“数点”既贴近原文，也符合中文圣经叙事的庄重语体。
- source_word: נְשִׂיאֵי הָעֵדָה
  choice: 会众的首领
  rationale: נְשִׂיאִים指群体中公认的领袖；עֵדָה在旷野与人口统计语境中指以色列会众。“会众的首领”清楚自然，并保留群体制度色彩。
- source_word: בְּנֵי הַקְּהָתִי
  choice: 哥辖子孙
  rationale: 原文直译近于“哥辖人的众子”，实际指哥辖所出的后裔群体；“哥辖子孙”在现代中文中自然地保留了血缘含义。
- source_word: לְמִשְׁפְּחֹתָם
  choice: 按宗族
  rationale: מִשְׁפָּחָה在谱系和人口统计语境中指支派之下的亲族单位；“宗族”比泛称“家庭”更能表达这一层级。
- source_word: וּלְבֵית אֲבֹתָם
  choice: 按父家
  rationale: בֵית אָבוֹת是以色列传统的亲属组织术语，指按父系祖先划分的家族单位；保留“父家”可避免将其泛化为普通家庭。
theological_decisions: []
