  yaml_path: translation/ot/numbers/004/043.yaml
  text: from thirty years old and upward[a], and up to fifty years old[b], everyone who comes for service, for the work in the tent of meeting.
translation:
  language: zh_hans
  text: 从三十岁起，直到五十岁，凡来服役、在会幕里做工的。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִבֶּן שְׁלֹשִׁים שָׁנָה וָמַעְלָה
  choice: 从三十岁以上
  rationale: “בֶּן + 年数”是表示年龄的希伯来语习语；“从三十岁以上”自然表达含三十岁在内的年龄下限。
- source_word: וְעַד בֶּן חֲמִשִּׁים שָׁנָה
  choice: 直到五十岁
  rationale: 自然表达年龄范围的上限，同时贴近“直到”的原文结构。
- source_word: כָּל הַבָּא
  choice: 凡来……的
  rationale: 保留בוא分词“来、进入”的基本意象，不将其与后面的服役概念合并。
- source_word: לַצָּבָא
  choice: 服役
  rationale: צָבָא在此指有组织的利未人职务，而非狭义军事行动；“服役”兼顾其编制服勤色彩与本段语境。
- source_word: לַעֲבֹדָה
  choice: 做工
  rationale: 与前面的“服役”相区分，保留עֲבֹדָה所指的实际工作。
- source_word: בְּאֹהֶל מוֹעֵד
  choice: 在会幕里
  rationale: “会幕”是אֹהֶל מוֹעֵד在现代中文圣经语境中的通行称呼；“在……里”反映介词בְּ。
theological_decisions:
- issue: צָבָא是否应译成军事性用语
  choice: 服役
  alternative: 入伍／参军
  rationale: 本节谈利未人在会幕中的编制性职务。保留“服役”的组织性含义，但不误导为军事行动。
translation_notes:
  register: 采用简洁、庄重的现代标准普通话。“凡来服役、在会幕里做工的”保留原文בוא、צָבָא与עֲבֹדָה三个成分，避免把“来”静默解释为“进入职务”。本节是承接上下文的句段，故保留原文片段式句法。
