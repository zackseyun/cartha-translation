  text: As for the sons of Merari[a], you shall count them by their clans[b], by their fathers' houses.
translation:
  language: zh_hans
  text: 至于米拉利的子孙[a]，你要按他们的宗族和父家[b]数点他们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“米拉利的儿子们”；这里指米拉利的后裔，也可译作“米拉利人”。
    reason: lexical_alternative
  - marker: b
    text: “父家”是按父系归属划分的家族单位。
    reason: cultural_note
lexical_decisions:
- source_word: בְּנֵי מְרָרִי
  choice: 米拉利的子孙
  rationale: “某人的众子”在族谱和人口统计语境中可指其后裔。“子孙”自然表达此处的世系含义，同时以脚注保留原文的字面形式。
- source_word: לְמִשְׁפְּחֹתָם
  choice: 按他们的宗族
  rationale: מִשְׁפָּחָה 在以色列支派组织和数点人口的语境中，指支派之下的亲族群体；“宗族”比现代汉语中的“家庭”更准确。
- source_word: לְבֵית אֲבֹתָם
  choice: 按父家
  rationale: 这是以色列族谱体系中的固定表达，指按父系归属划分的家族单位。“父家”简洁保留其社会结构，脚注加以说明。
- source_word: תִּפְקֹד
  choice: 数点
  rationale: פקד 在本章人口登记的语境中指清点并登记人数。“数点”既符合上下文，也保留正式庄重的语体。
- source_word: אֹתָם
  choice: 他们
  rationale: 明确译出直接宾语代词，回指米拉利的子孙。
