  text: זֹ֛את עֲבֹדַ֥ת בְּנֵי קְהָ֖ת בְּ/אֹ֣הֶל מוֹעֵ֑ד קֹ֖דֶשׁ הַ/קֳּדָשִֽׁים־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/004.yaml
  text: This is the service of the sons of Kohath in the tent of meeting concerning the most holy things[a].
translation:
  language: zh_hans
  text: 这是哥辖子孙在会幕里的职务，关乎至圣之物[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“至圣所”。这里按上下文，很可能指最神圣的器物，而不只是内层圣所。
    reason: 原文短语既可用作地点名称“至圣所”，也可在本段语境中指至圣的器物。
lexical_decisions:
- source_word: זֹאת
  choice: 这是
  rationale: 阴性单数指示词用于引出本句；希伯来语省略系词，汉语自然补出“是”。
- source_word: עֲבֹדַת
  choice: 职务
  rationale: 此处指分派给利未支系的礼仪性工作与职责；“职务”既体现受托责任，也符合庄重语域。
- source_word: בְּנֵי קְהָת
  choice: 哥辖子孙
  rationale: 保留希伯来语亲属群体表达，同时在现代汉语中自然地指哥辖的后裔。
- source_word: בְּאֹהֶל מוֹעֵד
  choice: 在会幕里
  rationale: בְּ 表示其职务所在的范围或地点；“会幕”是 אֹהֶל מוֹעֵד 在中文圣经语境中简明、通行的名称。
- source_word: קֹדֶשׁ הַקֳּדָשִׁים
  choice: 至圣之物
  rationale: 该短语字面具有最高级意义；结合民数记第4章处理和搬运圣所器具的上下文，此处最可能指最神圣的物件，而非仅指空间上的至圣所。
theological_decisions:
- issue: קֹדֶשׁ הַקֳּדָשִׁים 的所指
  choice: 指交由哥辖子孙料理的至圣器物
  alternative: 指作为地点的至圣所
  rationale: 上下文随后列举约柜、桌子、灯台、祭坛等需要遮盖和搬运的圣物，因此正文采用事物性理解；脚注保留地点性理解，以保存原短语的语义张力。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“关乎”明确连接会幕中的职务与至圣之物，避免把后者误读为“职务”的同位语；“哥辖子孙”保留原文亲属称谓。
