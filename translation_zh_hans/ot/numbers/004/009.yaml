  text: Then they shall take a blue cloth and cover the lampstand for the light[a], along with its lamps, its tongs, its firepans, and all its oil vessels with which they minister to it.
translation:
  language: zh_hans
  text: 他们要拿一块蓝紫色布[a]，盖住照明的灯台，连同灯台上的灯、火钳、火盘，以及供职时所用的一切盛油器具。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “蓝紫色”也可译作“蓝色”。希伯来词 תְּכֵלֶת 指会幕陈设所用的一种特殊染色材料，其确切色调不能完全确定。
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּגֶד תְּכֵלֶת
  choice: 一块蓝紫色布
  rationale: בֶּגֶד在本段指包裹圣所器具的布，而非衣服；תְּכֵלֶת指会幕织物所用的特殊蓝色至蓝紫色染料或染色材料。“蓝紫色”保留其色调范围，具体色值的不确定性见脚注。
- source_word: מְנֹרַת הַמָּאוֹר
  choice: 照明的灯台
  rationale: מְנוֹרָה是“灯台”，הַמָּאוֹר可指“光、照明”。“照明的灯台”以自然中文表达其功能性属格，同时不扩写为解释性过强的措辞。
- source_word: נֵרֹתֶיהָ
  choice: 灯台上的灯
  rationale: נֵרֹתֶיהָ直译为“它的灯”。中文补出“灯台上的”，使所指清楚，并保留灯台与各盏灯的区别。
- source_word: מַלְקָחֶיהָ
  choice: 火钳
  rationale: 该词指料理灯芯或火焰的钳状器具；“火钳”简洁自然，又不过度限定为剪烛芯的工具。
- source_word: מַחְתֹּתֶיהָ
  choice: 火盘
  rationale: מַחְתָּה可指火盘或香炉；在料理灯台的语境中，“火盘”较合适，也避免误示其必用于烧香。
- source_word: כָּל כְּלֵי שַׁמְנָהּ
  choice: 一切盛油器具
  rationale: כְּלִים涵盖器皿、用具，שַׁמְנָהּ指与灯台有关的油。“盛油器具”既自然，也保留其可能包括容器和相关用具的广度。
- source_word: אֲשֶׁר יְשָׁרְתוּ לָהּ בָּהֶם
  choice: 供职时所用的
  rationale: שׁרת在圣所语境中有礼仪性服事、供职之意；בָּהֶם指“用它们”。将整句处理为“供职时所用的”，自然表达这些器具是服事灯台时使用的工具，避免中文重复累赘。
