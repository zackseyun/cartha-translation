base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/012.yaml
  text: Then they shall take all the utensils of service with which they minister in the sanctuary[a], and put them in a blue cloth, and cover them with a covering of fine leather[b], and place them on the carrying frame.
translation:
  language: zh_hans
  text: 他们要拿起在圣所供职所用的一切器具，用蓝色布包好，再用塔哈什皮制的覆盖物盖在上面，放在抬运的杠[b]上。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “塔哈什”音译自希伯来语 תָּחַשׁ（tahash）。这个词的确切含义不能确定，可能指某种动物的皮，也可能指一种优质或耐用的皮革。
    reason: lexical_alternative
  - marker: b
    text: 或译“放在抬架上”。希伯来语用单数“杆、杠”，这里也可能泛指搬运用的承载装置。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקְחוּ
  choice: 他们要……拿来
  rationale: 这是连续礼仪指令中的动词形式；“要……拿来”自然表达接续而来的规定动作。
- source_word: כָּל כְּלֵי הַשָּׁרֵת
  choice: 一切器具
  rationale: כְּלִי在此指圣所礼仪中使用的各样器物；其供职用途由后面的关系从句明确表达，无须重复译出抽象的“事奉”。
- source_word: אֲשֶׁר יְשָׁרְתוּ בָם בַּקֹּדֶשׁ
  choice: 在圣所中供职所用的
  rationale: שרת在祭司礼仪语境中指履行圣职，“供职”既保留正式语气，也不额外限定具体职分；בַּקֹּדֶשׁ译作“在圣所中”，不武断限定为内层圣所。
- source_word: בֶּגֶד תְּכֵלֶת
  choice: 蓝色布
  rationale: בֶּגֶד在打包运输的语境中宜译为“布”；תְּכֵלֶת指会幕织物所用的蓝色或蓝紫色染料，此处简洁译作“蓝色”。
- source_word: מִכְסֵה עוֹר תָּחַשׁ
  choice: 塔哈什皮做的罩子
  rationale: תָּחַשׁ所指动物或皮革种类不能确定；正文采用音译，避免把推测性的动物鉴定或“精制、耐用”等性质写进经文，并用脚注解释。
- source_word: וְנָתְנוּ עַל הַמּוֹט
  choice: 放在抬杆上
  rationale: מּוֹט为单数，基本义是承载物品的杆或杠；“抬杆”保留单数和运输功能，同时以脚注说明也可能泛指承载装置。
