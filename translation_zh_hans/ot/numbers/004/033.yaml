base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/033.yaml
  text: This is the service of the clans of the sons of Merari for all their service in the tent of meeting[a], under the direction of Ithamar son of Aaron the priest.
translation:
  language: zh_hans
  text: 这是米拉利子孙各宗族在会幕里的一切职责，都由祭司亚伦的儿子以他玛监管[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“借以他玛的手”或“在以他玛手的管理下”；这里指由以他玛监督、管理。
    reason: 说明“借……的手”这一希伯来语习语的字面表达及其在本处表示监管的含义。
lexical_decisions:
- source_word: זֹאת עֲבֹדַת
  choice: 这是……所要承担的……职务
  rationale: זֹאת引出总结性说明；עֲבֹדָה在利未人的礼仪与行政语境中指受委派的职务或事奉。此处译为“职务”，既自然，也避免理解为一般劳动。
- source_word: מִשְׁפְּחֹת בְּנֵי מְרָרִי
  choice: 米拉利子孙各宗族
  rationale: מִשְׁפְּחֹת在支派谱系语境中指宗族；בְּנֵי是“子孙、后裔”的群体称谓。译文保留传统谱系表达，同时清楚表明其集体含义。
- source_word: לְכָל עֲבֹדָתָם
  choice: 所要承担的一切职务
  rationale: לְ在此表达职责范围，עֲבֹדָה再次指受派的职务；加入“承担”使现代汉语通顺，并保留“一切”的完整范围。
- source_word: בְּאֹהֶל מוֹעֵד
  choice: 在会幕中
  rationale: בְּ表示职务施行的地点或范围；אֹהֶל מוֹעֵד采用现代中文圣经读者熟悉且准确的名称“会幕”。
- source_word: בְּיַד
  choice: 在……手下
  rationale: 该词组字面为“在……手中／借……之手”，在此表示管理、督导或权责归属。“在……手下”保留希伯来语意象，也能自然表达受其督导办事。
- source_word: אִיתָמָר בֶּן אַהֲרֹן הַכֹּהֵן
  choice: 祭司亚伦的儿子以他玛
  rationale: 按汉语自然语序明确הַכֹּהֵן“祭司”修饰亚伦，并保留以他玛的父子身份。
