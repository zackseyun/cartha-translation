base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/030.yaml
  text: From thirty years old and upward[a], up to fifty years old[b], you shall count them—everyone who enters the service to do the work of the tent of meeting.
translation:
  language: zh_hans
  text: 从三十岁起，到五十岁为止，凡来服役[a]、办理会幕事务的，都要登记。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “服役”所译的词也可指有组织的队伍；这里指利未人受派承担会幕的工作。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִבֶּן שְׁלֹשִׁים שָׁנָה וָמַעְלָה
  choice: 从三十岁以上
  rationale: 这是表达年龄下限的希伯来语惯用结构；此译法自然简明，并保留“从……以上”的门槛含义。
- source_word: וְעַד בֶּן חֲמִשִּׁים שָׁנָה
  choice: 直到五十岁
  rationale: 准确表达年龄范围的上限，同时不擅自说明五十岁是否包含在内。
- source_word: תִּפְקְדֵם
  choice: 你要登记他们
  rationale: פקד在本段人口核点及任职安排的语境中，不仅是数点，也涉及登记合资格者；“登记”比单纯“数算”更贴合此处。
- source_word: כָּל הַבָּא
  choice: 所有前来……的人
  rationale: 保留分词所表达的每一位合资格前来者，现代汉语表达自然。
- source_word: לַצָּבָא
  choice: 任职
  rationale: צָבָא可指军队、队伍或有组织的服役；本节指利未人在会幕承担编组安排的职务，译作“任职”避免误导为作战，同时保留正式服役意味。
- source_word: לַעֲבֹד אֶת עֲבֹדַת
  choice: 办理……事务
  rationale: 原文由同根的“服事/劳作”动词和名词构成；“办理……事务”在汉语中自然，并传达执行所派工作的意思。
- source_word: אֹהֶל מוֹעֵד
  choice: 会幕
  rationale: 这是该圣所名称在现代中文圣经语境中清楚、通行且简洁的译法，意为相会之幕。
theological_decisions:
- issue: לַצָּבָא是否应保留军事色彩
  choice: 任职
  alternative: 入伍／加入队伍服役
  rationale: 此处所述是利未人承担会幕工作，并非军事作战。“任职”传达有组织、受指派的服役性质，却不把军事含义强加于经文。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“登记”符合人口核点语境；“办理会幕事务”避免同根词直译造成的生硬重复。脚注用于保留צָבָא所含的编组服役色彩。
