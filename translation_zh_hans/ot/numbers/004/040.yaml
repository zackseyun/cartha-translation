base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/040.yaml
  text: And those counted from them[a], by their clans, by their fathers’ houses, were two thousand six hundred and thirty.
translation:
  language: zh_hans
  text: 按着宗族、父家，他们中被数点的[a]共有二千六百三十人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“登记在册的”“被统计的”。希伯来语指人口统计中被登记、数点的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: 共有
  rationale: 此处 היה 用于人口统计的总数公式；“共有”自然表达统计所得的合计数。
- source_word: פְּקֻדֵיהֶם
  choice: 他们中被数点的
  rationale: 该词源自 פקד，在这里指人口统计中被登记、被清点者；此译法保留被动含义及“从他们当中”这一关系，不在正文中额外限定身份。
- source_word: לְמִשְׁפְּחֹתָם
  choice: 按着宗族
  rationale: מִשְׁפָּחָה 在以色列人口统计语境中指亲属群体或宗族；“按着”表示统计所依据的分类。
- source_word: לְבֵית אֲבֹתָם
  choice: 父家
  rationale: 这是以色列宗谱和人口统计中的固定社会单位；“父家”简洁、庄重，并贴近希伯来语表达。
- source_word: אַלְפַּיִם וְשֵׁשׁ מֵאוֹת וּשְׁלֹשִׁים
  choice: 二千六百三十人
  rationale: 按原文数词直译；补出量词“人”，使现代汉语自然，并由上下文明确这是人数。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“宗族、父家”保留原文由较大亲属群体到父系家族单位的统计层次；“数点”承接圣经人口统计语境，并以脚注说明其现代含义。
