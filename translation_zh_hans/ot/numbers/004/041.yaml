source:
  edition: WLC
  text: אֵ֣לֶּה פְקוּדֵ֗י מִשְׁפְּחֹת֙ בְּנֵ֣י גֵרְשׁ֔וֹן כָּל הָ/עֹבֵ֖ד בְּ/אֹ֣הֶל מוֹעֵ֑ד אֲשֶׁ֨ר פָּקַ֥ד מֹשֶׁ֛ה וְ/אַהֲרֹ֖ן עַל פִּ֥י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/041.yaml
  text: These were the counted men of the families of the sons of Gershon[a], all who served in the tent of meeting, whom Moses and Aaron counted at the command of Yahweh.
translation:
  language: zh_hans
  text: 这些是革顺子孙各家族中被数点的人[a]，就是所有在会幕中服事的人；摩西和亚伦照雅威的吩咐数点了他们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“这些是从革顺子孙各家族中数点出来的人，就是所有在会幕中服事的人。”
    reason: 原文פְקוּדֵי可着重于已经登记在册的人，也可着重于从各家族中数点出来这一过程；两种表达所指相同。
lexical_decisions:
- source_word: אֵלֶּה
  choice: 这些是
  rationale: 这是复数指示词，用来引出本段数点结果的总结。现代汉语无需借助时态强行译成“这些曾是”。
- source_word: פְקוּדֵי
  choice: 被数点的人
  rationale: 此词源于פקד，在本章人口登记的语境中指被登记、被数点的人；如此也保留它与后文פָּקַד的词根呼应。
- source_word: מִשְׁפְּחֹת בְּנֵי גֵרְשׁוֹן
  choice: 革顺子孙各家族
  rationale: 保留希伯来文的亲属结构及家族层级，同时采用自然简洁的现代汉语表达。
- source_word: כָּל הָעֹבֵד
  choice: 所有……服事的人
  rationale: 单数分词在这里具有集合意义，涵盖一切参与相关职务的人；“服事”既能表达实际工作，也符合圣所职务的语境。
- source_word: בְּאֹהֶל מוֹעֵד
  choice: 在会幕中
  rationale: 按介词的基本意义翻译，并采用“会幕”这一清楚而通行的圣所名称。这里可广义指与会幕有关的服事，不必限定为只在帐幕内部进行。
- source_word: אֲשֶׁר פָּקַד
  choice: 数点了他们
  rationale: 关系从句回指前述人员；采用主动句，使摩西和亚伦的动作在汉语中清楚自然，并与“被数点的人”保持词汇一致。
- source_word: עַל פִּי יְהוָה
  choice: 照雅威的吩咐
  rationale: 这是“按……之口”的习语，表示遵照神所发的命令；“照……的吩咐”在现代汉语中准确自然。
- source_word: יְהוָה
  choice: 雅威
  rationale: 直接音译四字神名，保留原文所使用的立约之名，而不以称号代替。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”较贴近学界通常采用的拟音，也避免以“主”等称号取代专名。
- issue: עֹבֵד在会幕语境中的含义
  choice: 服事
  alternative: 工作／办事
  rationale: 此处既涉及实际劳作，也属于利未人在会幕承担的职务；“服事”保留这两方面，不把它狭义化为礼仪行为。
translation_notes:
  register: 采用现代、庄重且易懂的书面普通话。“革顺子孙各家族”保留原文家族结构；“会幕”“数点”“服事”与民数记人口登记及圣所职务的语境协调。分号用来区分人员说明与摩西、亚伦执行数点的总结陈述。
