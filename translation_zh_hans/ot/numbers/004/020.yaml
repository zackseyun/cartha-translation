base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/020.yaml
  text: But they must not go in to look at the holy things for even a moment[a], or they will die.
translation:
  language: zh_hans
  text: 但他们不可进去观看圣物，哪怕只是一瞬间[a]，否则必死。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“哪怕只看一刹那。”这个希伯来语表达含义不十分确定，既可指只短暂地看见圣物，也可能指在圣物被遮盖或包裹之时观看。
    reason: 保留 כְבַלַּע 的词义和句法歧义。
lexical_decisions:
- source_word: וְלֹא
  choice: 但……不可
  rationale: 连词与否定词承接上文的规定，并在语境中构成禁令；“但”自然地带出警告性的转折。
- source_word: יָבֹאוּ
  choice: 进去
  rationale: 该动词可指“来、进入”；这里指哥辖子孙进入圣物所在之处，译为“进去”符合现代汉语语境。
- source_word: לִרְאוֹת
  choice: 观看
  rationale: 不定式表示“看、观看”；“观看”既保留视觉接触之意，也比“注视”更少增添持续凝视的含义。
- source_word: כְבַלַּע
  choice: 哪怕只看一瞬间
  rationale: 这是一个含义困难的表达，可能指极短暂的观看，也可能指圣物正在被遮盖之时。正文采用合乎语境的瞬间义，并以脚注保留另一种解释。
- source_word: אֶת־הַקֹּדֶשׁ
  choice: 圣物
  rationale: 虽然希伯来语为单数形式，但在本章语境中可集合性地指前文所述会幕中的神圣器物；“圣物”简洁而具体。
- source_word: וָמֵתוּ
  choice: 免得死亡
  rationale: 该分句说明违禁所导致的致命后果；“免得死亡”保留希伯来语警戒性的结果表达。
theological_decisions:
- issue: הַקֹּדֶשׁ 的所指
  choice: 集合性地指会幕中的神圣器物，译作“圣物”
  alternative: “圣所”或抽象的“圣物”单数概念
  rationale: 紧接的上下文讨论会幕器具的包裹和搬运，因此具体器物的集合性所指最符合语境，同时不把该词限定为空间性的“圣所”。
- issue: כְבַלַּע 的解释
  choice: 正文表达极短暂的观看
  alternative: 指圣物正被遮盖、包裹之时
  rationale: 原文表达罕见且存在真实歧义；正文采用传统且通顺的瞬间义，脚注明确保留“被遮盖时”的可能解释，避免消除原文张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“不可……免得……”呈现律法禁令及其后果；“圣物”承接本章具体器具的语境。脚注标记已在正文中对应出现。
