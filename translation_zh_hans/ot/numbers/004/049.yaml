  source_fidelity: 首句“照雅威的吩咐……登记”准确传达了עַל־פִּי יהוה与פקד的统计／登记语境，“由摩西经手”也恰当地表达了ביד משה的中介、执行含义。不过，“所担的重任”容易主要理解为抽象的重大责任，较弱化了מַשָּׂא在本段会幕搬运语境中的具体负载含义。末句加入“雅威吩咐摩西的安排”，将原文“雅威所吩咐摩西的”转成“安排”，不必要地增加了原文没有明说的概念。
