base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/049.yaml
  text: At the command of Yahweh they were counted by the hand of Moses[a], each man according to his service and according to his burden; and his assignment[c] was as Yahweh had commanded Moses[b].
translation:
  language: zh_hans
  text: 他们照雅威的吩咐[a]，由摩西经手[b]登记；各人都按自己的职务和所要承担的搬运重担。各人所受的派任[c]，正如雅威所吩咐摩西的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “照……的吩咐”直译为“按……的口”。
    reason: lexical_alternative
  - marker: b
    text: “由摩西经手”直译为“借摩西的手”，也可译作“通过摩西”。
    reason: lexical_alternative
  - marker: c
    text: 此处希伯来语形式及其句法作用不易确定；也可理解为“登记（的人或结果）”“所负的职责”，或“他所登记的人”。
    reason: textual_or_lexical_ambiguity
lexical_decisions:
- source_word: עַל־פִּי יְהוָה
  choice: 照雅威的吩咐
  rationale: עַל־פִּי直译为“在……口上”，在这里是按命令行事的惯用语；雅威保留神的专名。
- source_word: פָּקַד אֹתָם
  choice: 把他们登记
  rationale: פקד语义范围包括数点、登记、派任等；本章紧接利未人统计总数的语境，因此“登记”既自然，也不把动作局限于单纯计数。
- source_word: בְּיַד מֹשֶׁה
  choice: 由摩西经手
  rationale: 保留“借某人的手”所表达的代理或执行含义，同时符合现代汉语表达。
- source_word: אִישׁ אִישׁ
  choice: 各人
  rationale: 希伯来语重复单数名词，表达逐一分配的含义；“各人”简洁地保留这种分配性。
- source_word: עַל עֲבֹדָתוֹ
  choice: 按自己的职务
  rationale: עֲבֹדָה在此指会幕事务中分派给各人的工作或服役职责。
- source_word: וְעַל מַשָּׂאוֹ
  choice: 和所担的重任
  rationale: מַשָּׂא首先指搬运时所承担的载重，也可带有职责意味；“所担的重任”兼顾具体搬运与责任感。
- source_word: וּפְקֻדָיו
  choice: 他们各自的派任
  rationale: 该形式及其句法关系存在困难；在各人职务与负重的语境中，“派任”可表达所受的委派，同时用脚注保留“登记、职责、所登记的人”等可能理解。
- source_word: אֲשֶׁר צִוָּה יְהוָה אֶת־מֹשֶׁה
  choice: 都照雅威吩咐摩西的安排
  rationale: 关系从句说明整个登记和派任符合雅威给摩西的命令；补出“安排”使汉语完整，但不改变命令的来源。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；音译“雅威”保留其作为以色列之神专名的性质，而不以称号代替。
- issue: פקד在统计与派任之间的张力
  choice: 首处译“登记”，后处译“派任”并加脚注
  alternative: 两处均译“数点”或均译“派任”
  rationale: 上下文既是利未人的统计登记，又涉及逐人分配职务和负重；分别按紧邻语境翻译，并明示后一个形式的歧义，可避免把两层含义强行归一。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“经手”保留希伯来语的代理惯用语，又不显生硬；“职务”“所担的重任”“派任”符合会幕服役与搬运的行政语境。分号呈现登记、个人职责与总结性派任之间的层次。
