base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/045.yaml
  text: These are the counted men of the families of the sons of Merari[a], whom Moses and Aaron counted according to the mouth of Yahweh[b], by the hand of Moses.
translation:
  language: zh_hans
  text: 这些就是米拉利子孙各家族中被数点的人；摩西和亚伦按耶和华[a]借摩西[b]所传的命令数点了他们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“按耶和华的口”，意思是“按耶和华的命令”。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“借摩西的手”，这里指借摩西传达。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה פְקוּדֵי
  choice: 这些就是……被数点的人
  rationale: 以现代汉语的呈示句式表达总结语气；在本章人口登记的语境中，פְקוּדֵי指被登记、数点的人。
- source_word: מִשְׁפְּחֹת בְּנֵי מְרָרִי
  choice: 米拉利子孙各家族
  rationale: 保留“子孙”的亲属表达，并以“各家族”自然呈现复数 מִשְׁפְּחֹת。
- source_word: פָּקַד
  choice: 数点
  rationale: 与本章利未人登记的语境相符，也与前面的“被数点的人”保持词汇呼应。
- source_word: עַל פִּי יְהוָה
  choice: 照耶和华的吩咐
  rationale: 该希伯来习语字面为“按耶和华的口”，实际表示遵照耶和华的命令；正文采用自然汉语，脚注保留原文意象。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的神名音译，明确呈现原文专名，而不以头衔代替。
- source_word: בְּיַד מֹשֶׁה
  choice: 借摩西所传
  rationale: 字面为“借摩西的手”，在此表示神的命令以摩西为传达媒介；译文使其与“命令”自然衔接，脚注说明字面形式。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。正文保留为专名；“耶和华”是现代标准中文中最广为人知且庄重的形式。
- issue: “按耶和华的口”与“借摩西的手”的关系
  choice: 理解为耶和华的命令借摩西传达
  alternative: 将“借摩西的手”理解为数点行动本身由摩西执行
  rationale: בְּיַד מֹשֶׁה紧接“照耶和华的口”，常用于说明神谕借摩西传达；但原文结构简练，脚注保留其字面表达，避免掩盖潜在的句法张力。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。“数点”保留《民数记》人口登记语境中的传统而清楚的用词；句式避免生硬照搬希伯来语，同时以脚注保存“口”和“手”的原文意象。
