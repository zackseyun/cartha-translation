  yaml_path: translation/ot/numbers/004/024.yaml
  text: This is the service of the families of the Gershonites[a], for serving and for carrying.
translation:
  language: zh_hans
  text: 这是革顺人各家族的职责：服事和搬运。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: זֹאת
  choice: 这是
  rationale: 阴性单数指示词引出说明；希伯来语名词句省略系词，汉语自然补作“这是”。
- source_word: עֲבֹדַת
  choice: 服役
  rationale: עֲבֹדָה 可指工作、职务或服事；本节涉及利未人在会幕中的职责，“服役”既保留事奉语境，也不把含义限于礼仪活动。
- source_word: מִשְׁפְּחֹת
  choice: 各家族
  rationale: 复数构造形式指革顺人内部的家族群体；“各家族”在现代汉语中清楚自然。
- source_word: הַגֵּרְשֻׁנִּי
  choice: 革顺人
  rationale: 该族称为集合意义，指革顺的后裔群体；按中文圣经人名惯例译作“革顺人”。
- source_word: לַעֲבֹד
  choice: 办理事务
  rationale: עבד 的不定式与介词 ל 表示职责或用途。为避免与前面的“服役”机械重复，并结合后续具体会幕工作，译为“办理事务”，同时保留一般工作之义。
- source_word: וּלְמַשָּׂא
  choice: 搬运重物
  rationale: מַשָּׂא 指所负载、搬运之物或负重；在会幕运输语境中，“搬运重物”清楚表达实际职责，而不预先限定具体器物。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准普通话。“服役”概括革顺家族承担的会幕职分，冒号后的两个短语说明其工作性质；措辞避免引入宗派性解释。
