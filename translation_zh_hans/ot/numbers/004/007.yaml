  text: וְ/עַ֣ל שֻׁלְחַ֣ן הַ/פָּנִ֗ים יִפְרְשׂוּ֮ בֶּ֣גֶד תְּכֵלֶת֒ וְ/נָתְנ֣וּ עָ֠לָי/ו אֶת הַ/קְּעָרֹ֤ת וְ/אֶת הַ/כַּפֹּת֙ וְ/אֶת הַ/מְּנַקִּיֹּ֔ת וְ/אֵ֖ת קְשׂ֣וֹת הַ/נָּ֑סֶךְ וְ/לֶ֥חֶם הַ/תָּמִ֖יד עָלָ֥י/ו יִהְיֶֽה׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/007.yaml
  text: And over the table of the Presence they shall spread a blue cloth[a], and they shall place on it the plates, the cups, the bowls, and the pitchers for the drink offering[b]; and the regular bread shall be on it.
translation:
  language: zh_hans
  text: 他们要在临在的桌子[a]上铺上一块蓝色布，把盘子、杯子、碗和奠酒用的壶放在上面；常设的饼[b]也要放在桌上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 传统译作“陈设饼桌”。希伯来文直译为“面／临在之桌”。
    reason: alternative_reading
  - marker: b
    text: 也可译为“持续摆设的饼”；指按规定持续摆在耶和华面前的桌子上的饼。
    reason: lexical_alternative
lexical_decisions:
- source_word: שֻׁלְחַן הַפָּנִים
  choice: 临在之桌
  rationale: 原文直译为“面／临在之桌”。“临在之桌”保留其礼仪含义，又不在正文中直接增补原文没有明说的对象。
- source_word: יִפְרְשׂוּ
  choice: 铺
  rationale: 该动词表示展开并铺在某物之上；汉语以“铺”表达此处动作最自然。
- source_word: בֶּגֶד תְּכֵלֶת
  choice: 一块蓝色布
  rationale: תְּכֵלֶת 指会幕用品中特有的蓝色或蓝紫色；正文采用通顺而不过度限定色调的“蓝色”。
- source_word: הַקְּעָרֹת
  choice: 盘子
  rationale: 指较平的盛放器皿，“盘子”符合桌上器具的语境。
- source_word: הַכַּפֹּת
  choice: 杯子
  rationale: 该词所指器形并不完全确定；此处采用普通易懂的桌上器皿名，避免用古奥词语。
- source_word: הַמְּנַקִּיֹּת
  choice: 碗
  rationale: 该礼仪器皿名称的具体形制存在不确定性；“碗”与同列器具相称，也保留与其他器皿的区别。
- source_word: קְשׂוֹת הַנָּסֶךְ
  choice: 奠酒用的壶
  rationale: 该短语指与倾倒奠祭之酒有关的容器；“壶”自然表达可供倾倒液体的器皿，“奠酒用的”保留其祭祀功能。
- source_word: לֶחֶם הַתָּמִיד
  choice: 常供的饼
  rationale: תָּמִיד 表示持续或按规定经常摆放；“常供的饼”既自然，也传达这饼持续陈列在桌上的礼仪性质。
- source_word: עָלָיו יִהְיֶה
  choice: 也要放在桌上
  rationale: 原文是“要在它上面”；明确复指“桌上”可避免汉语中误解为放在器皿上，同时不增加实质内容。
theological_decisions:
- issue: שֻׁלְחַן הַפָּנִים 中“面／临在”的所指
  choice: 正文译作“临在之桌”，不直接补出“上帝”或“耶和华”
  alternative: 上帝面前的桌子；陈设饼桌
  rationale: 原文结构本身没有明说“上帝”，但在圣所语境中带有神圣临在的含义。正文保留这一含蓄表达，脚注说明传统名称和字面意义。
translation_notes:
  register: 采用现代、庄重而易懂的礼仪叙述语体。器皿名称尽量使用日常汉语，同时不对原文未明确的具体形制做过度判断；以“奠酒”保留祭祀语境。
