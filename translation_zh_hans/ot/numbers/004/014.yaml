  text: וְ/נָתְנ֣וּ עָ֠לָי/ו אֶֽת כָּל כֵּלָ֞י/ו אֲשֶׁ֣ר יְֽשָׁרְת֧וּ עָלָ֣י/ו בָּ/הֶ֗ם אֶת הַ/מַּחְתֹּ֤ת אֶת הַ/מִּזְלָגֹת֙ וְ/אֶת הַ/יָּעִ֣ים וְ/אֶת הַ/מִּזְרָקֹ֔ת כֹּ֖ל כְּלֵ֣י הַ/מִּזְבֵּ֑חַ וּ/פָרְשׂ֣וּ עָלָ֗י/ו כְּס֛וּי ע֥וֹר תַּ֖חַשׁ וְ/שָׂמ֥וּ בַדָּֽי/ו־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/014.yaml
  text: 'Then they shall place on it all its utensils with which they minister at it: the fire pans[a], the forks, the shovels, and the basins—all the utensils of the altar. Then they shall spread over it a covering of fine leather and put its poles in place.'
translation:
  language: zh_hans
  text: 要把坛上供职所用的一切器具，就是火盘、叉子、铲子和盆，即坛的一切器具，都放在坛上；再在坛上铺一层皮革盖子[a]，安上抬杠。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “皮革”所译的希伯来词为“塔哈什”（taḥash）；其所指动物或皮革种类不能确定。可译作山羊皮、海豚皮，或较笼统地指耐用皮革。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתְנוּ עָלָיו
  choice: 要……放在坛上
  rationale: נתן在搬运规程中表示放置；עָלָיו的所指是上文的坛。补出“坛”比连续使用代词更符合现代汉语，也避免指代不明。
- source_word: כָּל־כֵּלָיו
  choice: 一切器具
  rationale: כְּלִי泛指器皿、用具或装备；在祭坛语境中，“器具”自然且涵盖范围恰当。
- source_word: אֲשֶׁר יְשָׁרְתוּ עָלָיו בָּהֶם
  choice: 坛上供职所用的
  rationale: שרת在礼仪语境中指履行圣所职务，“供职”保留其宗教服务色彩；以定语结构表达工具关系，符合现代汉语。
- source_word: הַמַּחְתֹּת
  choice: 火盘
  rationale: מַחְתָּה指承载炭火的盘具；“火盘”比“香炉”更少限定为焚香用途。
- source_word: הַמִּזְלָגֹת
  choice: 叉子
  rationale: 该词指叉状器具；“叉子”清楚、现代，同时不额外限定具体用途。
- source_word: הַיָּעִים
  choice: 铲子
  rationale: יָע指清理灰烬等所用的铲具，“铲子”是直接自然的对应。
- source_word: הַמִּזְרָקֹת
  choice: 盆
  rationale: מִזְרָק指礼仪中盛装或泼洒液体的容器；“盆”较“碗”更能体现器具性质。
- source_word: כֹּל כְּלֵי הַמִּזְבֵּחַ
  choice: 坛的一切器具
  rationale: 这是对前述清单的概括性同位说明；重复“器具”保持用词一致。
- source_word: וּפָרְשׂוּ עָלָיו כְּסוּי
  choice: 再在上面铺一层……盖
  rationale: פרשׂ意为展开、铺开，כְּסוּי是覆盖物；“铺一层……盖”保留动作与覆盖物两个要素。
- source_word: עוֹר תַּחַשׁ
  choice: 海狗皮
  rationale: תַּחַשׁ所指动物或皮革种类不能确定。“海狗皮”是汉语圣经传统中可识别的译法，但以脚注明示不确定性，避免把该鉴定说成定论。
- source_word: וְשָׂמוּ בַדָּיו
  choice: 把杠穿上
  rationale: 字面为“安放它的杠”。结合会幕器具搬运语境，汉语“把杠穿上”自然表达把抬杠安置到位。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的礼仪规程语体。用“要……；再……”呈现连续操作步骤；在代词可能含混处补出“坛”。保留תַּחַשׁ的词义不确定性，并在正文放置脚注标记。
