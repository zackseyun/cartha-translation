  rationale: 修订将“借摩西的手”的中介意义明确附于雅威的吩咐，避免现代汉语中不自然且可能误导的工具性理解。脚注保留原文“手”的字面表达及“借着摩西”的可行译法；其余内容维持原译的词汇与庄重语域。
