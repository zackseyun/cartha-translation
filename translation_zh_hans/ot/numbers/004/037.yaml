base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/037.yaml
  text: These were the counted men of the families of the Kohathites, everyone serving in the tent of meeting, whom Moses and Aaron counted at the command of Yahweh by the hand of Moses.
translation:
  language: zh_hans
  text: 这些是哥辖人各家族中被数点的人，就是所有在会幕里供职的人；他们是摩西和亚伦照雅威借摩西所传的吩咐数点的。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “借摩西所传的吩咐”直译为“照雅威的吩咐，借摩西的手”；也可译作“照雅威借着摩西所传的吩咐”。
    reason: lexical_alternative
lexical_decisions:
- source_word: פְקוּדֵי
  choice: 被数点的人
  rationale: 此处源自动词 פקד，用于人口统计和登记的语境；“被数点的人”既保留具体所指，也符合《民数记》第4章对任职人员进行统计的上下文。
- source_word: מִשְׁפְּחֹת הַקְּהָתִי
  choice: 哥辖人各家族
  rationale: מִשְׁפְּחֹת 指家族或宗族单位；“各家族”自然表达复数，而“哥辖人”表示哥辖的后裔群体。
- source_word: כָּל הָעֹבֵד
  choice: 所有……供职的人
  rationale: 分词 עֹבֵד 表示从事服事或劳务的人；在利未人的会幕职责语境中，“供职”比泛泛的“工作”更准确。
- source_word: בְּאֹהֶל מוֹעֵד
  choice: 在会幕里
  rationale: אֹהֶל מוֹעֵד 是以色列敬拜场所的固定称谓，惯译“会幕”；介词 בְּ 表示其供职的范围，译作“在……里”。
- source_word: אֲשֶׁר פָּקַד
  choice: 数点了他们
  rationale: 此处 פקד 与本节开头的 פְקוּדֵי 呼应，指清点、登记，而非任命。补出“他们”使中文关系清楚。
- source_word: עַל פִּי יְהוָה
  choice: 照雅威的吩咐
  rationale: עַל־פִּי 字面为“按……的口”，在此是“按照命令”的惯用语；“照……的吩咐”自然且保留权威意味。
- source_word: יְהוָה
  choice: 雅威
  rationale: 原文直接使用四字神名；采用现代汉语中常见的音译“雅威”，将专名与“主”等称号区分。
- source_word: בְּיַד מֹשֶׁה
  choice: 借摩西的手
  rationale: 保留希伯来语“借某人的手”这一表达所含的媒介和执行意味；“借摩西”也是可能的意译。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文使用神的专名而非称号；“雅威”较贴近学界通常采用的拟音，同时不把专名替换为“主”。
- issue: בְּיַד מֹשֶׁה 所表达的中介关系
  choice: 借摩西的手
  alternative: 借着摩西
  rationale: 保留原文“手”的意象，不进一步界定摩西在神命令与人口统计之间的具体中介方式；脚注提供自然的意译。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“数点”沿用中文圣经语域中表示统计登记的用词；分号用于区分被统计者的身份说明与摩西、亚伦执行统计的陈述。
