  text: וְ/נָתְנ֤וּ אֹתָ/הּ֙ וְ/אֶת כָּל כֵּלֶ֔י/הָ אֶל מִכְסֵ֖ה ע֣וֹר תָּ֑חַשׁ וְ/נָתְנ֖וּ עַל הַ/מּֽוֹט־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/010.yaml
  text: They shall put it and all its utensils into a covering of fine leather[a], and they shall place it on the carrying frame.
translation:
  language: zh_hans
  text: 他们要把它和它的一切器具包在特哈示皮罩里[a]，再放在抬架上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “特哈示”音译自希伯来语 תַּחַשׁ（tachash）。这个词的确切含义不明，可能指某种动物的皮，也可能指一种耐用的皮革；传统译法有“海狗皮”等。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתְנוּ
  choice: 要把……包在；再放在
  rationale: 在连续的礼仪操作指示中，带连接词的完成式表达依次应当执行的动作；分别按语境译为“包在”和“放在”。
- source_word: אֹתָהּ
  choice: 它
  rationale: 保留希伯来文阴性单数代词的回指功能，所指是上文的灯台，不在本节中重复补出名词。
- source_word: כָּל כֵּלֶיהָ
  choice: 它的一切器具
  rationale: כֵּלִים在会幕语境中指附属器皿、用具或设备；“器具”自然且范围适当。
- source_word: אֶל מִכְסֵה
  choice: 包在……罩里
  rationale: אֶל与“放置”类动词连用，可表示放入或置于覆盖物之内；中文以“包在……罩里”清楚表达包裹保护的动作。
- source_word: עוֹר תַּחַשׁ
  choice: 特哈示皮罩
  rationale: תַּחַשׁ所指动物或皮革种类不能确定，因此采用音译并附注，避免把未经证实的动物种类或品质写入正文。
- source_word: עַל הַמּוֹט
  choice: 在抬架上
  rationale: מּוֹט指用于负载、抬运的杆或架；“抬架”符合本段运输器物的语境，也保留其承载用途。
