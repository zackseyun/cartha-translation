  text: וְ/אִם לֹ֤א נִטְמְאָה֙ הָֽ/אִשָּׁ֔ה וּ/טְהֹרָ֖ה הִ֑וא וְ/נִקְּתָ֖ה וְ/נִזְרְעָ֥ה זָֽרַע־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/028.yaml
  text: But if the woman has not defiled herself and is clean[a], then she will be cleared and will conceive offspring.
translation:
  language: zh_hans
  text: 但这妇人若没有玷污自己，是洁净的，她必得以清白，并且会怀孕。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译近似“被播下种子”，是指受孕的表达。前一句“得以清白”也可译为“得以免责”或“被判无罪”；在本段语境中，这也意味着她不受咒诅的伤害。
    reason: 说明末句的希伯来语生育惯用表达，并保留וְנִקְּתָה所含清白、免责与免受咒诅后果的相关语义。
lexical_decisions:
- source_word: וְאִם
  choice: 但……若
  rationale: 承接上一节受咒诅的情形，引出相反条件；“但……若”自然体现语境中的转折。
- source_word: לֹא נִטְמְאָה הָאִשָּׁה
  choice: 这妇人若没有玷污自己
  rationale: נִטְמְאָה是טמא的Niphal形式，可指成为不洁或受到玷污；在本段涉嫌奸淫的语境中，“没有玷污自己”表达相关的性与礼仪不洁，同时保留行为主体的含义。
- source_word: וּטְהֹרָה הִוא
  choice: 确是洁净的
  rationale: טְהֹרָה指洁净；加入“确是”自然表达独立代词הִוא所带的强调，并避免把“洁净”强化成绝对的道德完美。
- source_word: וְנִקְּתָה
  choice: 她就不会受害
  rationale: נקה的Niphal可表示得以免除、无罪或不受伤害。结合苦水审验所带来的身体后果，“不会受害”简洁表达她免遭咒诅，同时用脚注保留“得以清白/免受惩罚”的可能理解。
- source_word: וְנִזְרְעָה זָרַע
  choice: 并且会怀孕
  rationale: 原文直译近似“被撒下种子”，是受孕、生育能力的表达。“会怀孕”直接传达其意义，不额外加入“能够”或把受孕扩展为已经生下孩子。
theological_decisions:
- issue: 无辜妇人在审验之后所得结果的性质
  choice: 她不受咒诅伤害，并会怀孕
  alternative: 她被宣告无罪，并恢复或确认生育能力
  rationale: וְנִקְּתָה兼有免除、清白和不受伤害的语义可能；本段直接对比身体咒诅，因此正文采用“不会受害”，脚注保留司法或道德层面的译法。末句按其明确的受孕意象处理，不把它扩展成保证顺利生产。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“妇人”与律法叙事语体相称；句式保留原文的条件、洁净宣告、免受后果和受孕四个层次。
