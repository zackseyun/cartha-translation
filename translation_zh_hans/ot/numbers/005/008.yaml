    rationale: 原文并列说明该奉归耶和华的赔偿款归祭司；“归耶和华，归祭司所有”更贴近原文的法律归属表述。
  - severity: low
    issue: “那只为他赎罪的公绵羊”修饰关系稍有歧义。
    rationale: 原文是以该公绵羊为媒介为那人赎罪；改作“供为他赎罪用的公绵羊”可在不补入施行者的情况下清楚表达。
