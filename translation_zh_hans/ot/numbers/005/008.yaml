  text: וְ/אִם אֵ֨ין לָ/אִ֜ישׁ גֹּאֵ֗ל לְ/הָשִׁ֤יב הָ/אָשָׁם֙ אֵלָ֔י/ו הָ/אָשָׁ֛ם הַ/מּוּשָׁ֥ב לַ/יהוָ֖ה לַ/כֹּהֵ֑ן מִ/לְּ/בַ֗ד אֵ֚יל הַ/כִּפֻּרִ֔ים אֲשֶׁ֥ר יְכַפֶּר בּ֖/וֹ עָלָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/008.yaml
  text: But if the man has no kinsman-redeemer to whom restitution for the guilt may be returned[a], the restitution for the guilt that is returned to Yahweh belongs to the priest[b], besides the ram of atonement by which atonement is made for him.
translation:
  language: zh_hans
  text: 但那人若没有可向他偿还赔偿款的至亲救赎者[a]，所偿还的因罪责所付的赔偿款就归耶和华，归祭司所有[b]；此外，还要献上那只供为他赎罪用的公绵羊。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“救赎者”或“最近的亲属”。希伯来语 גֹּאֵל 指在赎回财产或接受赔偿等事务上负有法律责任的家族成员。
    reason: lexical_alternative
  - marker: b
    text: 这里的希伯来语 אָשָׁם 指因罪责而偿付的赔偿款，不是公绵羊祭牲；公绵羊在下文另行提到。
    reason: lexical_alternative
lexical_decisions:
- source_word: גֹּאֵל
  choice: 至亲救赎者
  rationale: 该词指在赎回、追偿或接受赔偿等事务上负有法律责任的家族成员；“至亲救赎者”同时保留亲属关系和法律职能。
- source_word: הָאָשָׁם
  choice: 赔罪款
  rationale: 本节中的 אָשָׁם 指因过错而偿付的赔偿款，并非随后另行提到的公绵羊祭牲；此译既保留“罪责”的关联，也与祭牲相区别。
- source_word: הָאָשָׁם הַמּוּשָׁב
  choice: 所偿还的赔罪款
  rationale: שוב 的被动分词强调款项被交还、偿还；此译清楚表达法律性的补偿行动。
- source_word: לַיהוָה
  choice: 归给耶和华
  rationale: 此处表示赔罪款奉归耶和华，并因此由祭司承受；采用“耶和华”直接对应神名 YHWH。
- source_word: לַכֹּהֵן
  choice: 也就是归给祭司
  rationale: 希伯来语以并列短语说明实际归属；补出“也就是归给”使现代汉语关系明确，并避免误解为分别交付两次。
- source_word: מִלְּבַד
  choice: 此外，还要
  rationale: 明确公绵羊是在赔罪款以外另加的，不是赔罪款本身。
- source_word: אֵיל הַכִּפֻּרִים
  choice: 赎罪的公绵羊
  rationale: 自然地表达该公绵羊的祭仪用途，同时保留其为赎罪之用的含义。
- source_word: יְכַפֶּר בּוֹ עָלָיו
  choice: 为他赎罪
  rationale: 保留公绵羊作为赎罪媒介以及犯罪者作为受益对象；不在正文中强行补出希伯来语未明说的施行者。
- source_word: לָאִישׁ
  choice: 那人
  rationale: 忠实保留希伯来语阳性单数，并与上下文中的犯罪者相接。
theological_decisions:
- issue: 赔偿与祭牲的关系
  choice: 把赔罪款与赎罪用的公绵羊视为两项不同的要求。
  alternative: 把 אָשָׁם 理解为祭仪中的赎愆祭本身。
  rationale: מִלְּבַד（“此外”）明确把公绵羊与前述偿还款区分开来，故不应混同民事赔偿和祭牲。
- issue: 神名 YHWH 的译法
  choice: 耶和华
  alternative: 雅威；主
  rationale: “耶和华”是现代简体中文圣经语境中广为人知的专名形式，并保留原文神名的专名性质。
translation_notes:
  register: 采用庄重而清楚的现代标准普通话。“赔罪款”简洁表达法律性赔偿及其罪责背景；用“也就是”说明奉归耶和华的款项由祭司承受。正文保留两个脚注标记 [a]、[b]。
