revisions:
- from: 但那人若没有可向他偿还赔偿款的至亲救赎者[a]，所偿还的赔罪款就要归给耶和华，也就是归给祭司[b]；此外，还要献上那只为他赎罪的公绵羊。
  to: 但那人若没有可向他偿还赔偿款的至亲救赎者[a]，所偿还的因罪责所付的赔偿款就归耶和华，归祭司所有[b]；此外，还要献上那只供为他赎罪用的公绵羊。
  rationale: 修订使祭司对赔偿款的承受关系更直接，并澄清公绵羊是赎罪所用的祭牲；同时保留原文对祭司施行赎罪这一隐含主体的不明说。脚注锚点及内容均予保留。
