base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/012.yaml
  text: 'Speak to the sons of Israel and say to them: If any man''s wife goes astray and commits a breach of faith against him[b][a],'
translation:
  language: zh_hans
  text: 你要对以色列的子孙[a]说，告诉他们：“若有人的妻子走偏，对他严重失信[b]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“以色列人”。原文直译为“以色列的子孙”。
    reason: lexical_alternative
  - marker: b
    text: “严重失信”译自一个由同根动词和名词组成的希伯来语表达，强调不忠或背信的行为。
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר
  choice: 告诉
  rationale: 这是引出上帝吩咐摩西传达训令的命令式；“告诉”在现代汉语中自然，并保留向特定对象传话的含义。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列的子孙
  rationale: 较贴近原文的家族性称谓，同时在汉语中可自然指以色列全体民众；较简洁的“以色列人”列于脚注。
- source_word: וְאָמַרְתָּ אֲלֵהֶם
  choice: 对他们说
  rationale: 保留原文连续使用两个言说动词的正式宣告句式。
- source_word: אִישׁ אִישׁ
  choice: 任何人
  rationale: 名词重复在此表达逐一、任一的分配意义；汉语以“任何人”自然呈现。
- source_word: כִּי
  choice: 若
  rationale: 在案例法条文中引出假设条件，用“若”比时间性的“当……时”准确。
- source_word: תִשְׂטֶה
  choice: 偏离正道
  rationale: 保留“转离、走偏”的比喻意义，不在后文说明具体行为之前先行限定其性质。
- source_word: אִשְׁתּוֹ
  choice: 人的妻子
  rationale: 与前面的分配表达合并为“任何人的妻子”，清楚保留所属关系。
- source_word: וּמָעֲלָה ... מָעַל
  choice: 做出背信的事
  rationale: 原文以同根动词和名词强调不忠、背信；此译法既自然，又以“背信的事”保留行为及关系破裂的分量。
- source_word: בּוֹ
  choice: 对丈夫
  rationale: 该介词在语境中标明丈夫是背信行为所针对、所亏负的一方；汉语明确说“对丈夫”可避免代词指向含混。
theological_decisions:
- issue: 对以色列群体的性别化家族称谓
  choice: 以色列的子孙
  alternative: 以色列人
  rationale: 正文保留בְּנֵי יִשְׂרָאֵל的家族、后裔意象，同时不把本来面向全体群体的训令误解为只对成年男子说；脚注提供现代汉语中更惯用的群体称谓。
- issue: 婚姻不忠用语的关系与契约色彩
  choice: 对丈夫做出背信的事
  alternative: 对丈夫不忠
  rationale: “背信”保留מעל所含的失信、背叛关系之意，并借“做出……的事”略为体现同根词叠用的强调；不把本节尚未完整展开的情形过早缩减为单一具体行为。
translation_notes:
  register: 采用现代、庄重而易懂的法规宣告语体。保留原文两个言说动词形成的正式开场，并以“若”引出尚在下一节继续展开的条件句；本节末保留逗号和未闭合语意，以反映原句延续。
