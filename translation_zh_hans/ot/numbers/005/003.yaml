base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/003.yaml
  text: From male to female you shall send them outside the camp[a]; you shall send them out so that they may not defile their camp[b], in the midst of which I dwell.
translation:
  language: zh_hans
  text: 无论男或女，你们都要把他们送到营外；要把他们送出去，免得他们玷污自己的各营[a]；我住在他们中间[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“自己的营地”。希伯来文用复数“他们的各营”，可能指营地的不同分区或各处驻营。
    reason: lexical_alternative
  - marker: b
    text: 或译：“我住在这些营中间。”希伯来文末句可指各营，也可指与各营相关的人。
    reason: alternative_reading
lexical_decisions:
- source_word: מִזָּכָר עַד נְקֵבָה
  choice: 无论男或女
  rationale: 这一希伯来语搭配以两端表达完整范围；此处译为“无论男或女”，自然地传达男女都包括在内。
- source_word: תְּשַׁלֵּחוּ / תְּשַׁלְּחוּם
  choice: 都要把他们送到……；要把他们送出去
  rationale: 保留原文两次使用使役加强式动词שלח所形成的重复和强调，同时避免用“驱逐”增添惩罚意味。
- source_word: אֶל מִחוּץ לַמַּחֲנֶה
  choice: 送到营外
  rationale: 以自然简洁的现代汉语表达越过营地边界、被安置在营外的空间意义。
- source_word: יְטַמְּאוּ
  choice: 玷污
  rationale: טמא在祭司礼仪语境中指造成礼仪上的不洁；“玷污”既保留宗教礼仪色彩，又通顺庄重。
- source_word: מַחֲנֵיהֶם
  choice: 自己的各营
  rationale: 原文名词为复数并带第三人称阳性复数后缀。“各营”保留其复数形式，可能指以色列营地的不同分区；“自己的”清楚表达所属关系。
- source_word: אֲשֶׁר אֲנִי שֹׁכֵן בְּתוֹכָם
  choice: 因为我住在他们中间
  rationale: “住”保留שׁכן所表达的神临在和居住之意；“他们中间”按阳性复数后缀理解为营中的群体，但以脚注保留其也可指各营的可能性。
theological_decisions:
- issue: בְּתוֹכָם中复数后缀的所指
  choice: 正文译作“我住在他们中间”，突出上帝住在以色列民中间。
  alternative: “我住在这些营中间”或“我住在其中”
  rationale: 该阳性复数后缀可指与各营相关的人，也可回指复数的“各营”。正文采用自然的群体性理解，同时用脚注保存原文所允许的另一种关系。
- issue: מַחֲנֵיהֶם的数
  choice: 保留复数，译作“自己的各营”。
  alternative: 按整体概念译作“自己的营地”
  rationale: 马所拉文本明确使用复数，可能反映营地的各个分区。正文不将其抹平为单数，但脚注说明集合性译法。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“营外”“各营”“住在他们中间”保持民数记祭司礼仪语境的简洁和肃穆；正文中的[a]、[b]均与脚注对应。
