  yaml_path: translation/ot/numbers/005/001.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: zh_hans
  text: 雅威[a]对摩西说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文为 YHWH（四字神名）；中文传统常译作“耶和华”。
    reason: 说明神名的原文形式及传统中文译名。
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: 说
  rationale: 该动词形式在这里引出新的神谕话语事件；现代汉语以“对……说”自然、准确地表达这一常见叙事公式。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 这是希伯来文四字神名 YHWH。采用现代中文圣经读者最熟悉的专名形式“耶和华”，并以脚注说明原文形式及另一常见拟音“雅威”。
- source_word: אֶל
  choice: 对
  rationale: 与言说动词搭配，标明受话者；“对摩西说”符合现代汉语习惯。
- source_word: מֹשֶׁה
  choice: 摩西
  rationale: 采用该人名通行的现代中文译法。
- source_word: לֵאמֹר
  choice: 说
  rationale: 这是引出随后直接引语的固定公式。希伯来文与前面的言说动词形成复合表达，汉语无需机械重复为“说……说”，用句末冒号即可自然体现其功能。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用以 YHWH 四个辅音书写的神名，而非“主”这一称号。正文保留中文传统中作为专名使用的“耶和华”，不以“主”替代；脚注同时交代原文形式和“雅威”这一拟音，避免掩盖其读音及译写问题。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。“对摩西说”保留原文神谕引言的功能；冒号表明下文将接直接引语。脚注标记紧随其实际说明的神名之后。
