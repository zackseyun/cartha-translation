  text: וְ/אַ֗תְּ כִּ֥י שָׂטִ֛ית תַּ֥חַת אִישֵׁ֖/ךְ וְ/כִ֣י נִטְמֵ֑את וַ/יִּתֵּ֨ן אִ֥ישׁ בָּ/ךְ֙ אֶת שְׁכָבְתּ֔/וֹ מִֽ/בַּלְעֲדֵ֖י אִישֵֽׁ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/020.yaml
  text: But if you have gone astray while under your husband[a], and if you have become defiled[c][b], and a man has lain with you besides your husband—
translation:
  language: zh_hans
  text: 但你若在婚姻关系中走了岔路[a]，受了玷污，又有别的男人与你同房[b]——
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“在你丈夫之下偏离了”。“在……之下”是指既有的婚姻关系；“走了岔路”保留“偏离”的比喻。也可译作“对丈夫不忠”。
    reason: 说明希伯来语“偏离”意象及“在丈夫之下”的婚姻习语。
  - marker: b
    text: 原文直译近似“有男人把他的躺卧给在你里面”，是指性关系的委婉说法；“别的”对应“在你丈夫以外”。
    reason: 说明希伯来语性关系委婉语，并交代排除丈夫的限定。
lexical_decisions:
- source_word: שָׂטִית
  choice: 背离了
  rationale: 该动词本义是偏离、走岔；在本段婚姻语境中指偏离婚姻忠诚。“背离”保留偏离的意象，同时由“丈夫”明确其语境。
- source_word: תַּחַת אִישֵׁךְ
  choice: 在婚姻中……丈夫
  rationale: 原文直译为“在你丈夫之下”，指女子与丈夫之间既有的婚姻关系。正文以自然现代汉语表达关系语境，脚注保留原文的具体说法。
- source_word: נִטְמֵאת
  choice: 玷污了自己
  rationale: טמא的被动词形在此表示因性行为而陷入污秽状态，兼具礼仪—法律和道德语境。“玷污了自己”在现代汉语中自然，又不把它弱化为一般的不洁净。
- source_word: וַיִּתֵּן אִישׁ בָּךְ אֶת שְׁכָבְתּוֹ
  choice: 有……男人与你同寝
  rationale: 原文以“把他的同寝放在你里面”一类的委婉说法指性关系。“同寝”保留委婉性质，又足以让现代读者明白。
- source_word: מִבַּלְעֲדֵי אִישֵׁךְ
  choice: 你丈夫以外的
  rationale: מבלעדי表示排除，即不是她丈夫的另一个男人；“你丈夫以外的”准确、自然。
theological_decisions:
- issue: 如何表达婚姻不忠而不超出原文
  choice: 译作“在婚姻中背离了丈夫”，并在后句以“与你同寝”说明所指
  alternative: 通篇直译为“在丈夫之下偏离”，或直接译为“对丈夫不忠”
  rationale: 原文先用“偏离”的意象，后用委婉语指性关系。正文保留这一先含蓄、后具体的推进，同时避免把前半句解释得比希伯来文更绝对。
- issue: 保持未完条件句的结构
  choice: 句末使用破折号
  alternative: 补出下一节才出现的咒诅结果
  rationale: 本节仍是条件从句，结论延续到下一节；破折号保留原文的悬置，不提前补充内容。
translation_notes:
  register: 采用现代、庄重而易懂的法律—礼仪语体。“同寝”避免粗俗，也不掩盖性关系的含义；句末破折号表明条件句尚未结束。
