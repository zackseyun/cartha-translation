  text: 耶和华对摩西说：
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: 说
  rationale: 该词在叙事中引出新的神谕段落；现代汉语以“说”自然、准确地表达这一发言公式。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的神名音译“耶和华”，而非以“主”这一称号替代。
- source_word: אֶל־מֹשֶׁה
  choice: 对摩西
  rationale: 介词 אֶל 标示说话的对象，汉语自然表达为“对摩西”。
- source_word: לֵאמֹר
  choice: 说（融入句式）
  rationale: 该不定式延续引语公式并引出下文内容；汉语无需重复译作“说，说道”，以冒号承接下文即可完整表达其功能。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 耶和华
  alternative: 雅威；上主
  rationale: 原文直接使用四字神名。正文保留专名性质，并采用普通简体中文读者最熟悉、最具延续性的音译“耶和华”；不以称号“上主”取代。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。保留希伯来叙事中神向摩西发言的公式功能，但按汉语习惯将 וַיְדַבֵּר 与 לֵאמֹר 合并为“对摩西说：”，避免生硬重复。
