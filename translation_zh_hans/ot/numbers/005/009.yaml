base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/009.yaml
  text: And every contribution from all the holy gifts of the sons of Israel, which they bring near to the priest, shall be his.
translation:
  language: zh_hans
  text: 以色列子孙[a]一切圣物[b]中的每一份奉献，凡他们呈献[c]给祭司的，都要归祭司所有。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“以色列人”；希伯来文直译为“以色列的儿子们”。
    reason: lexical_alternative
  - marker: b
    text: 或译“分别为圣之物”或“神圣的供物”。
    reason: lexical_alternative
  - marker: c
    text: 此动词在献祭语境中也可译为“带到近前”；字面意思是“使靠近”。
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּרוּמָה
  choice: 奉献
  rationale: 此词指分别出来献上的礼物或供物，常包括归祭司所得的份；“奉献”在现代汉语中自然，也避免采用过于专门、可能误导为特定动作的术语。
- source_word: קָדְשֵׁי
  choice: 圣物
  rationale: 复数构造形式在这里指分别为圣、献给上帝的物品或礼物；“圣物”简洁地保留了其神圣属性。
- source_word: בְנֵי יִשְׂרָאֵל
  choice: 以色列子孙
  rationale: 保留希伯来语的家族性称谓，同时符合中文圣经语体；脚注说明字面形式及可选译法。
- source_word: יַקְרִיבוּ
  choice: 呈献
  rationale: קרב 的使役形在祭祀语境中有“使靠近、带到近前而献上”之意；“呈献”既自然，又比单纯的“带来”更能表达礼仪语境。
- source_word: לַכֹּהֵן
  choice: 给祭司
  rationale: 介词指明所献之物的接受者；末句进一步明确其归属。
- source_word: לוֹ יִהְיֶה
  choice: 都要归给他
  rationale: 该希伯来语习语表达法定归属；“归给他”在现代汉语中清楚自然，并保留律例语气。
theological_decisions:
- issue: 盟约群体称谓 בְנֵי יִשְׂרָאֵל 的表达
  choice: 以色列子孙
  alternative: 以色列人
  rationale: “以色列子孙”保留原文的家族性表达，不将其直接化约为族群名称；同时用脚注交代字面形式和自然译法，不由译文额外裁定其所指范围。
translation_notes:
  register: 采用现代、庄重而易懂的律例语体。“每一份奉献”对应单数集合性表达，“都要归给他”清楚呈现祭司对这些供物的合法归属。
