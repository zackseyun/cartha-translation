base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/026.yaml
  text: Then the priest shall take a handful from the grain offering[a], its memorial portion, and burn it on the altar; afterward he shall make the woman drink the water.
translation:
  language: zh_hans
  text: 祭司要从素祭中取出一把，就是其中作记念的部分，焚烧在坛上；然后，他要让那妇人喝这水。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“这苦水”；上下文这样称呼这水，但本节原文只说“这水”。
    reason: 说明上下文中的词汇替代译法，同时保留本节原文的简洁措辞。
lexical_decisions:
- source_word: וְקָמַץ
  choice: 要……取出一把
  rationale: קמץ在献祭礼仪中指用手取出一把祭物；“取出一把”既保留具体动作，也符合现代汉语表达。前缀连接词与完成式在律法指令的连续动作中译为“要”。
- source_word: מִן הַמִּנְחָה
  choice: 从素祭中
  rationale: מִנְחָה在祭司礼仪语境中特指以谷物等献上的祭物；“素祭”是简洁、通行且能区别于一般礼物的汉语称谓。
- source_word: אֶת אַזְכָּרָתָהּ
  choice: 就是其中作记念的部分
  rationale: אַזְכָּרָה指素祭中取出并烧在坛上的记念部分，阴性单数后缀回指מִנְחָה。“就是”说明这一把与记念部分为同一对象，而不增添新的礼仪步骤。
- source_word: וְהִקְטִיר הַמִּזְבֵּחָה
  choice: 焚烧在坛上
  rationale: הקטיר在献祭语境中指将祭物焚烧、使之成为烟；“焚烧在坛上”自然地表达礼仪行为。希伯来文的方向形式מִזְבֵּחָה按汉语习惯译作“在坛上”。
- source_word: וְאַחַר
  choice: 然后
  rationale: 该词标明礼仪动作的先后次序；“然后”清楚、自然。
- source_word: יַשְׁקֶה
  choice: 要让……喝
  rationale: שׁקה的使役式表示使对方饮用；“让那妇人喝”保留使役含义，同时避免“强迫喝”所可能带入的额外语气。
- source_word: אֶת הַמָּיִם
  choice: 这水
  rationale: 本节原文只说“水”，定冠词表明是上下文中已经提到的水；汉语用“这水”自然承接前文，不在正文加入本节没有的“苦”字。
theological_decisions:
- issue: 是否依据上下文在正文中把“水”明确译为“苦水”
  choice: 正文保留“这水”
  alternative: 这苦水
  rationale: 本节仅有הַמָּיִם（“这水／那水”），没有“苦”这一修饰语。虽然上下文如此称呼它，正文不应把邻近经文的措辞加入本节；脚注可提示读者。
translation_notes:
  register: 采用现代、庄重而易懂的律法礼仪语体。“素祭”和“作记念的部分”保留祭祀术语的准确性；句式按原文顺序呈现两个连续动作。
