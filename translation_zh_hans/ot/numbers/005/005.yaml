base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/005.yaml
  text: And Yahweh spoke to Moses, saying,
translation:
  language: zh_hans
  text: 耶和华对摩西说：
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: 说
  rationale: 该动词与后面的 לֵאמֹר 构成常见的神谕引介公式。现代汉语用“对……说”自然、准确；若机械地同时译出两个言说成分，会显得重复。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 这是现代简体中文圣经语境中对四字神名最通行、最易识别的音译，保留其作为专名的性质，而不以“主”这一称号代替。
- source_word: אֶל
  choice: 对
  rationale: 在“对某人说”的现代汉语结构中，自然标示言说所指向的对象。
- source_word: מֹשֶׁה
  choice: 摩西
  rationale: 采用该人名在现代汉语中的标准传统译名。
- source_word: לֵאמֹר
  choice: 说
  rationale: 此不定式用于引出随后话语；汉语以句末“说：”合并表达 וַיְדַבֵּר…לֵאמֹר 的整体功能，并用冒号提示下文。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威；上主；主
  rationale: 原文直接使用四字神名，应保留为专名。中文“耶和华”具有最广泛的公共辨识度；“雅威”更接近一种常见的学术拟音，但未必如“耶和华”自然通行。以“主”或“上主”替代则会把专名改成称号。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。将希伯来语重复的言说公式整合为“对摩西说：”，既保留引介功能，也避免不自然的“说……说”。
