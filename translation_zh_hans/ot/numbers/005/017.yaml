base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/017.yaml
  text: Then the priest shall take holy water in an earthen vessel[c][b][a], and the priest shall take some of the dust that is on the floor of the tabernacle and put it into the water.
translation:
  language: zh_hans
  text: 祭司要把圣水[a]盛在陶器[b]里，又要从帐幕的地面上取一些尘土[c]，放进水里。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“分别为圣的水”。原文指为礼仪用途分别出来的水。
    reason: lexical_alternative
  - marker: b
    text: “陶器”也可译作“瓦器”或“陶制器皿”。
    reason: lexical_alternative
  - marker: c
    text: “帐幕的地面”也可译作“帐幕的地板”或“帐幕的地上”。原文所用的词可指地面或地板。
    reason: lexical_alternative
lexical_decisions:
- source_word: מַיִם קְדֹשִׁים
  choice: 圣水
  rationale: קְדֹשִׁים意为“圣的、分别为圣的”。“圣水”简洁直接；此处专指为礼仪用途分别出来的水，不带入后世宗教传统的特定含义。
- source_word: בִּכְלִי חָרֶשׂ
  choice: 用陶器盛
  rationale: כְּלִי חָרֶשׂ指陶土制成的器皿。按现代汉语表达，将“取圣水在陶器中”自然处理为“用陶器盛圣水”，既保留器皿材质，也清楚表达动作关系。
- source_word: הֶעָפָר
  choice: 尘土
  rationale: עָפָר可指尘埃、干土或松散泥土；“尘土”符合帐幕地面的具体场景，也保持礼仪叙述的庄重语体。
- source_word: בְּקַרְקַע הַמִּשְׁכָּן
  choice: 帐幕的地面上
  rationale: קַרְקַע可指地面或底面；在帐幕内部的语境中，“地面”比单说“地”更明确自然。מִשְׁכָּן译作“帐幕”，保持本段礼仪场景。
- source_word: מִן הֶעָפָר
  choice: 取一些尘土
  rationale: 介词מִן在这里具有部分意义，表示从尘土中取一部分，并非取尽；汉语以“一些”自然传达这一点。
- source_word: וְלָקַח ... יִקַּח ... וְנָתַן
  choice: 要用……盛……又要……取……放进
  rationale: 这些动词构成规定礼仪步骤的指令。以“要”表达规范性，并用“又”连接下一动作；נָתַן אֶל在此自然译为“放进”。
- source_word: הַמָּיִם
  choice: 水里
  rationale: 末尾的定冠词表明这是回指前文的圣水；汉语无需重复“圣水”，译作“水里”即可清楚衔接。
theological_decisions: []
