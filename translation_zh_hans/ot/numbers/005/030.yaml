language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: א֣וֹ אִ֗ישׁ אֲשֶׁ֨ר תַּעֲבֹ֥ר עָלָ֛י/ו ר֥וּחַ קִנְאָ֖ה וְ/קִנֵּ֣א אֶת אִשְׁתּ֑/וֹ וְ/הֶעֱמִ֤יד אֶת הָֽ/אִשָּׁה֙ לִ/פְנֵ֣י יְהוָ֔ה וְ/עָ֤שָׂה לָ/הּ֙ הַ/כֹּהֵ֔ן אֵ֥ת כָּל הַ/תּוֹרָ֖ה הַ/זֹּֽאת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/030.yaml
  text: or when a spirit of jealousy comes over a man[a], and he is jealous of his wife, and he brings the woman before Yahweh[b], and the priest shall do to her all this law.
translation:
  language: zh_hans
  text: 或是有嫉妒之灵临到一个男人[a]，他嫉妒自己的妻子，便把那女人带到耶和华面前；祭司要为她施行这整套律例[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “临到”也可译作“袭来”；原文直译为“从他身上经过”。“嫉妒之灵”也可指临到人的嫉妒冲动或心境。
    reason: 说明“从……经过”的希伯来习语，并保留“灵”可指心境或冲动而未被原文明确界定的歧义。
  - marker: b
    text: “律例”也可译作“律法”“规定”“程序”或“礼仪”。
    reason: 说明תּוֹרָה在此指前述整套礼仪—法律规定，其具体涵义可有不同表达。
lexical_decisions:
- source_word: א֣וֹ
  choice: 或是
  rationale: 承接前文并引出并列的另一种情形，保留原文的选择关系。
- source_word: אִישׁ
  choice: 一个男人
  rationale: 原词是通用的“男人”；婚姻关系已由后文“自己的妻子”明确，无须直接译作“丈夫”。
- source_word: תַּעֲבֹר עָלָיו רוּחַ קִנְאָה
  choice: 有嫉妒的心临到一个男人
  rationale: “临到”表达 עבר על 的动态意象；“嫉妒的心”在现代汉语中自然，同时不把 רוּחַ 具体限定为外在灵体或纯粹心理冲动。
- source_word: רוּחַ
  choice: 心
  rationale: 此处指支配人的内在倾向或冲动；译作“心”符合现代汉语习惯，又保留其性质未完全确定的空间。
- source_word: קִנְאָה / וְקִנֵּא
  choice: 嫉妒／嫉妒
  rationale: 名词和同根动词均保留“嫉妒”，再现原文的词根呼应，并符合婚姻猜疑的语境。
- source_word: וְהֶעֱמִיד אֶת הָאִשָּׁה לִפְנֵי יְהוָה
  choice: 并把那女人带到耶和华面前
  rationale: 使役形动词本义为“使站立、呈到”；在礼仪语境中，“带到……面前”自然清楚。“那女人”承接前述妻子。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代简体中文圣经语域中最通行的专名形式。
- source_word: וְעָשָׂה לָהּ הַכֹּהֵן
  choice: 祭司要……为她施行
  rationale: “施行”准确表达祭司执行规定礼仪的动作；לָהּ 可按受益或关联方向译作“为她”，避免不必要地暗示伤害。
- source_word: כָּל הַתּוֹרָה הַזֹּאת
  choice: 照这一切条例
  rationale: תורה 在此指前述整套规定和程序；“条例”兼顾法律性与程序性，“照”使中文搭配自然。
theological_decisions:
- issue: “嫉妒之灵”的性质
  choice: 译为“嫉妒的心”，不界定其为外在灵体还是内在冲动
  alternative: 嫉妒之灵／一阵嫉妒
  rationale: 原文 רוּחַ קִנְאָה 可描述支配人的倾向，却未明确其形而上来源；译文避免把歧义消解为邪灵、神的作用或单纯情绪。
- issue: 祭司对女人所行之事的关系方向
  choice: “为她施行”
  alternative: “向她施行”／“对她执行”
  rationale: 希伯来文 לָהּ 本身容许较宽的关系表达；“为她施行”保留礼仪程序的中性措辞，不预断女人有罪。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“条例”“施行”保持法律礼仪语域；分号划分男人的行动与祭司的职责。正文中的[a]与脚注完全对应。
