  terminology: 保留“耶和华”作为神名。以“灵”对应רוּחַ，并在脚注中避免将其定性为外在灵体或单纯心理状态。以“律例”表达此处作为礼仪法律／规定整体的תּוֹרָה，不强行限定为单一“法律”或仅为“仪式”。
