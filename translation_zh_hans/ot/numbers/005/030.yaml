revisions:
- from: 或是有嫉妒的心临到一个男人[a]，他就嫉妒自己的妻子，并把那女人带到耶和华面前；祭司要照这一切条例为她施行。
  to: 或是有嫉妒之灵临到一个男人[a]，他嫉妒自己的妻子，便把那女人带到耶和华面前；祭司要为她施行这整套律例[b]。
  rationale: 修订以“嫉妒之灵”恢复对רוּחַ的较直接对应，并通过脚注保留其性质未定的语义空间，不作教义性判断。末句改为“为她施行这整套律例”，更紧贴祭司对该女子执行前述全部规定的句法与礼仪法律语域。新增[b]脚注锚定“律例”，使其对应原文תּוֹרָה的可译范围。
