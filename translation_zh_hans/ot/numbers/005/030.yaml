  source_fidelity: “嫉妒的心”将רוּחַ（灵、气息、心境／冲动）直接收窄为“心”，未充分保留原文在内在冲动与某种临到之“灵”之间的语义张力。译作“嫉妒之灵”，并以脚注说明其可指嫉妒的冲动或心境，较能忠实保留歧义。末句“照……条例为她施行”虽通顺，但“照”略增按规程行事的表达，“条例”也较偏具体条款；“为她施行这整套律例”更贴近“祭司要对/为她行这一切律法（规定）”的结构与集合性用法。
