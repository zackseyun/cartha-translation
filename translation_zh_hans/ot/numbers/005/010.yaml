  yaml_path: translation/ot/numbers/005/010.yaml
  text: And each man's holy gifts shall be his[b][a]; whatever a man gives to the priest shall be his.
translation:
  language: zh_hans
  text: 各人分别为圣的物品[a]，归各人所有；人交给祭司的，都归祭司所有[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“他的圣物”，指分别为圣、作为献礼的物品。
    reason: lexical_alternative
  - marker: b
    text: 原文直译“归他”；此处的“他”按语境指祭司。
    reason: referent_clarification
lexical_decisions:
- source_word: אִישׁ
  choice: 各人／人
  rationale: 阳性单数名词在本法条中作泛指、分配性用法；首处译作“各人”，次处译作“人”，自然表达其普遍适用的法律语气。
- source_word: קֳדָשָׁיו
  choice: 分别为圣的物品
  rationale: 该词是 קֹדֶשׁ 的复数附属形式，指归为神圣、用于献礼的物品。“分别为圣的物品”既保留“圣物”的原义，也向现代普通读者说明其礼仪含义。
- source_word: לוֹ יִהְיוּ
  choice: 仍归自己
  rationale: 此结构表示归属。结合下半句交给祭司后归祭司所有，首句自然理解为圣物在交出以前仍归献礼者自己；“仍”把两分句间的对照自然表达出来，但未增添转折连词。
- source_word: אֲשֶׁר יִתֵּן לַכֹּהֵן
  choice: 给祭司的，无论是什么
  rationale: 关系从句具有概括性的法律效力；“无论是什么”自然传达凡交给祭司之物均包括在内，并保留单数定指的“祭司”。
- source_word: לוֹ יִהְיֶה
  choice: 都归祭司
  rationale: 原文直译为“归他”，其最近且合乎语境的先行对象是祭司。正文明确重复“祭司”以避免现代汉语代词指向含混，同时以脚注保留原文的简约形式。
theological_decisions:
- issue: 两处 לוֹ 所指对象及圣物归属
  choice: 首处指献礼者，末处指祭司
  alternative: 两处均只译作“归他”，保留代词形式上的含混
  rationale: 经文的对称结构表达物品在交付前归献礼者、交付祭司后归祭司；末处最近的先行对象是“祭司”。正文按语境清楚表达，脚注同时说明希伯来文末句使用代词，避免把解释伪装成字面形式。
translation_notes:
  register: 采用现代、庄重而易懂的法律条文语体。用“分别为圣的物品”避免单用“圣物”可能造成的陌生感；句式保持简洁，并呈现原文两分句关于归属的对照。
