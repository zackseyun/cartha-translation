source:
  edition: WLC
  text: וְ/הִשְׁקָ֣/הּ אֶת הַ/מַּ֗יִם וְ/הָיְתָ֣ה אִֽם נִטְמְאָה֮ וַ/תִּמְעֹ֣ל מַ֣עַל בְּ/אִישָׁ/הּ֒ וּ/בָ֨אוּ בָ֜/הּ הַ/מַּ֤יִם הַ/מְאָֽרֲרִים֙ לְ/מָרִ֔ים וְ/צָבְתָ֣ה בִטְנָ֔/הּ וְ/נָפְלָ֖ה יְרֵכָ֑/הּ וְ/הָיְתָ֧ה הָ/אִשָּׁ֛ה לְ/אָלָ֖ה בְּ/קֶ֥רֶב עַמָּֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/027.yaml
  text: When he makes her drink the water[a], then if she has defiled herself and has acted unfaithfully against her husband, the water that brings the curse will enter her for bitterness, and her belly will swell and her thigh will waste away[b], and the woman will become a curse among her people.
translation:
  language: zh_hans
  text: 他让她喝下那水[a]；如果她玷污了自己，对丈夫不忠，那带来诅咒的水就会进入她体内，带来苦楚；她的腹部会肿胀，她的大腿会萎缩[b]。这女人必在本族人中成为咒诅。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“那带来诅咒的水会作为苦水进入她体内。”希伯来语“为苦楚”这一短语含义较难确定，可能描述水造成的结果，也可能描述水本身的苦味或性质。
    reason: lexical_alternative
  - marker: b
    text: 直译：“她的大腿会落下。”这可能是委婉说法，指严重的身体灾患，可能涉及生殖器官；但确切含义不能确定。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִשְׁקָהּ אֶת־הַמַּיִם
  choice: 他让她喝下那水
  rationale: 保留使役词形“使她喝”的意义；“喝下”符合现代汉语叙事表达。
- source_word: וְהָיְתָה אִם
  choice: 如果
  rationale: 此结构引出仪式在有罪情形下的结果；汉语用“如果”自然呈现条件关系。
- source_word: נִטְמְאָה
  choice: 她玷污了自己
  rationale: 兼顾道德与礼仪层面的污秽，并按上下文体现行为落在自身的结果。
- source_word: וַתִּמְעֹל מַעַל בְּאִישָׁהּ
  choice: 对丈夫不忠
  rationale: 概括同根强调结构所表达的背信与关系上的不忠；בְּ在此体现针对丈夫的背信行为。
- source_word: וּבָאוּ בָהּ
  choice: 就会进入她里面
  rationale: 保留בוא加ב所表达的进入身体内部之意，同时使中文清楚自然。
- source_word: הַמַּיִם הַמְאָרֲרִים
  choice: 那带来诅咒的水
  rationale: 将分词的致使或承载诅咒之意译出，避免生硬的“诅咒之水”。
- source_word: לְמָרִים
  choice: 带来苦楚
  rationale: 原短语疑难，可能描述水的苦味或所造成的痛苦；正文采用结果性表达，同时用脚注保留歧义。
- source_word: וְצָבְתָה בִטְנָהּ
  choice: 她的腹部会肿胀
  rationale: בטן直指腹部；不具体化为子宫，以免超出原文。
- source_word: וְנָפְלָה יְרֵכָהּ
  choice: 大腿会衰败
  rationale: 保留יָרֵךְ的字面身体部位，同时以“衰败”传达“落下”所指的严重身体损害；确切生理含义仍由脚注说明不确定。
- source_word: וְהָיְתָה הָאִשָּׁה לְאָלָה
  choice: 这女人必……成为咒诅
  rationale: 表达她将成为群体中受咒诅的实例或咒语所指对象，而不擅自限定其具体用法。
- source_word: בְּקֶרֶב עַמָּהּ
  choice: 在自己的族人中
  rationale: 自然表达审判发生在其所属群体中并具有公开、群体性的层面。
theological_decisions:
- issue: 如何翻译试验仪式所述身体灾患，而不强加特定医学或生殖解释
  choice: 正文译作“她的腹部会肿胀，大腿会衰败”
  alternative: 她会流产，腹部肿胀；或她的生殖器官会萎缩
  rationale: 希伯来文使用具体但可能带委婉性质的身体词汇，确切生理指向存在争议。正文贴近字面而保持可懂性，脚注说明不确定性，不把某一种生殖解释定为原文唯一含义。
- issue: לְמָרִים所表达的是水的性质还是水造成的结果
  choice: 正文译作“带来苦楚”
  alternative: 作为苦水；使水变苦；带着苦涩进入她里面
  rationale: 该短语可理解为苦的性质，也可理解为痛苦的结果。采用较自然的结果性译法，并在脚注中保存另一种可能。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“玷污自己”“不忠”“带来诅咒”保留礼仪、道德及关系层面的语义；对疑难身体灾患不作过度医学化解释。
