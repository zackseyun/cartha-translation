base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/002.yaml
  text: Command the sons of Israel that they send out of the camp everyone with a skin disease[a], and everyone with a discharge[b], and everyone unclean by a dead body.
translation:
  language: zh_hans
  text: 你要吩咐以色列人，把一切患有严重皮肤病的[a]、一切身有漏症的，以及一切因尸体而不洁的人，都送出营外。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“一切患麻风病的人”。这里的希伯来语在礼仪律例中是广义用词，指严重的皮肤疾患，不一定是现代医学所说的麻风病。
    reason: lexical_alternative
lexical_decisions:
- source_word: צַו
  choice: 吩咐
  rationale: 单数命令式，向摩西发出有约束力的指示；“吩咐”在现代中文圣经语体中庄重自然，又不显得过于行政化。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 希伯来语字面为“以色列的众子”，此处作为全体约民的集体称呼；现代汉语用“以色列人”最自然，并不排除女性。
- source_word: וִישַׁלְּחוּ מִן הַמַּחֲנֶה
  choice: 都送出营外
  rationale: שלח在此表示使人离开；结合מן המחנה的方向含义译为“送出营外”，保留命令的力度而不额外加入惩罚性的“驱逐”色彩。
- source_word: כָּל צָרוּעַ
  choice: 一切患严重皮肤病的
  rationale: צרוע在礼仪律例中指患צָרַעַת者，涵盖多种严重皮肤疾患，不宜直接等同现代医学所说的麻风病；“严重皮肤病”既避免时代错置，也交代其性质。
- source_word: וְכָל זָב
  choice: 一切身有漏症的
  rationale: זב指身体有异常流出物的人，是礼仪洁净法规中的专门情形；“身有漏症”简洁并保留法律语境，不擅自限定具体部位。
- source_word: וְכֹל טָמֵא לָנָפֶשׁ
  choice: 一切因接触尸体而不洁的人
  rationale: 此处נפש按律法惯用法指死者或尸体，整个短语表示尸体造成的礼仪不洁；译出“接触尸体”可使现代读者准确理解这一希伯来语习语。
theological_decisions:
- issue: 礼仪不洁术语的表达
  choice: 不洁
  alternative: 污秽／有罪
  rationale: טמא在本节指礼仪身份，而非必然表示道德罪责；“不洁”能维持营地圣洁法规中的术语区分，避免道德化。
- issue: “因尸体而不洁”的关系表达
  choice: 因接触尸体而不洁
  alternative: 因死人而不洁／因亡者而不洁
  rationale: לנפש是妥拉中有关尸体不洁的习语。中文明确译为“接触尸体”传达所指情形，同时不把这种不洁解释为个人犯罪。
translation_notes:
  register: 采用现代、庄重而清楚的法律叙事语体。“你要吩咐”体现摩西是直接受命者；三个“一切”保留原文逐项列举的结构，末尾以“都送出营外”统摄各项，使中文自然流畅。
