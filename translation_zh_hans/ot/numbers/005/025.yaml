  text: וְ/לָקַ֤ח הַ/כֹּהֵן֙ מִ/יַּ֣ד הָֽ/אִשָּׁ֔ה אֵ֖ת מִנְחַ֣ת הַ/קְּנָאֹ֑ת וְ/הֵנִ֤יף אֶת הַ/מִּנְחָה֙ לִ/פְנֵ֣י יְהוָ֔ה וְ/הִקְרִ֥יב אֹתָ֖/הּ אֶל הַ/מִּזְבֵּֽחַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/025.yaml
  text: Then the priest shall take from the woman’s hand the grain offering of jealousy, and he shall wave the grain offering before Yahweh and bring it near to the altar.
translation:
  language: zh_hans
  text: 祭司要从妇人手中接过那疑忌的素祭，在雅威面前摇这素祭，并把它带到祭坛前。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְלָקַח הַכֹּהֵן
  choice: 祭司要……接过
  rationale: 该动词形式在本段礼仪规程中承接前文，表达下一项规定动作；“要……接过”既保留规范语气，也自然体现从妇人手中领受。
- source_word: מִיַּד הָאִשָּׁה
  choice: 从妇人手中
  rationale: 忠实保留希伯来语的具体表达，表明祭司直接从她手中接过祭物。
- source_word: מִנְחַת הַקְּנָאֹת
  choice: 疑忌的素祭
  rationale: מִנְחָה在祭司礼仪语境中特指素祭；קְנָאֹת是复数形式，涵盖本仪式所涉及的嫉妒、猜疑或疑忌。“疑忌的素祭”简洁保留原文属格结构及仪式名称。
- source_word: וְהֵנִיף אֶת־הַמִּנְחָה
  choice: 把素祭摇一摇
  rationale: נוף的使役式在献祭语境中指礼仪性的摇动。“摇一摇”直接表达动作，又避免把原文动词改写成另一个祭物类别。
- source_word: לִפְנֵי יְהוָה
  choice: 在雅威面前
  rationale: 保留常见礼仪表达“在……面前”，并直接译出神名。
- source_word: וְהִקְרִיב אֹתָהּ אֶל־הַמִּזְבֵּחַ
  choice: 然后送到祭坛前
  rationale: קרב的使役式有“使靠近、带到近前”之意；“送到祭坛前”保留趋近祭坛的礼仪含义，且不提前断定此时已经焚献。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文明确使用四字神名。采用“雅威”作为现代汉语中对该名称的直接音译，不以称号替代专名。
- issue: מִנְחַת הַקְּנָאֹת中复数קְנָאֹת的语义
  choice: 疑忌的素祭
  alternative: 嫉妒的素祭；疑忌之祭
  rationale: 该词可涉及丈夫的嫉妒、猜疑以及由此引发的仪式情境。“疑忌”兼顾嫉妒与怀疑，不把经文限定为单纯情绪，也保留其专门礼仪名称。
translation_notes:
  register: 采用现代、庄重而易懂的礼仪叙述。“妇人”与上下文法律礼仪语体相称；重复“素祭”以维持原文的词汇对应。“摇一摇”虽较直白，但准确呈现礼仪动作；“送到祭坛前”保留原文“使之靠近”的阶段性，不与后续取纪念部分焚烧的动作混同。
