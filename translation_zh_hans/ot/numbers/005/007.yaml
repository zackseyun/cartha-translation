base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/007.yaml
  text: then they shall confess the sin that they have committed[a], and he shall make full restitution for his guilt, adding a fifth to it[b], and give it to the one against whom he was guilty.
translation:
  language: zh_hans
  text: 他们要承认自己所犯的罪；他要全额偿还自己因这罪所亏负的[a]，并在其上加上五分之一，交给他所亏负的人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “全额偿还自己因这罪所亏负的”也可译作“偿还他所欠的赔款”。这里指先偿还本金，再另加五分之一，并不是指赎愆祭。
    reason: 说明אָשָׁם与בְּרֹאשׁוֹ在本节赔偿语境中的含义。
lexical_decisions:
- source_word: וְהִתְוַדּוּ
  choice: 他们要承认
  rationale: התודה的Hitpael形式在此指公开承认罪过；“要承认”保留律法条文的规定语气。
- source_word: חַטָּאתָם אֲשֶׁר עָשׂוּ
  choice: 自己所犯的罪
  rationale: חטאת在此指所犯的罪或过错；现代汉语通常说“犯罪”，既自然又贴近原文。
- source_word: וְהֵשִׁיב אֶת אֲשָׁמוֹ בְּרֹאשׁוֹ
  choice: 全额赔偿因这罪所欠的
  rationale: שוב的Hiphil在赔偿语境中表示偿还；אָשָׁם在此指犯罪所产生的责任或欠款，而非祭物；בְּרֹאשׁוֹ指偿还本金全额。
- source_word: וַחֲמִישִׁתוֹ יֹסֵף עָלָיו
  choice: 加上原数的五分之一
  rationale: 明确表达在本金之外另加五分之一，即百分之二十；“原数”清楚说明计算基数。
- source_word: וְנָתַן לַאֲשֶׁר אָשַׁם לוֹ
  choice: 交给他所得罪的人
  rationale: 该短语直指行为人对其负罪责的对象；“他所得罪的人”是自然且准确的现代汉语表达。
theological_decisions:
- issue: 赔偿语境中אָשָׁם的含义
  choice: 因罪而承担的赔偿责任或所欠之物
  alternative: 赎愆祭
  rationale: 本节谈承认罪过、偿还本金、另加五分之一，并把款项交给受害者，因此这里不是指献上的赎愆祭。译文保留罪责与赔偿的联系，但不引入本节未明说的祭物含义。
- issue: 单复数主语的转换
  choice: 先用复数“他们”，后按原文转为单数“他”
  alternative: 全节统一为泛指单数或复数
  rationale: 希伯来文从וְהִתְוַדּוּ的复数转到וְהֵשִׁיב、וְנָתַן的单数。译文保留这一形式变化，不擅自消除原文张力。
translation_notes:
  register: 采用现代、庄重而易懂的律法条文语体。“承认自己所犯的罪”“全额赔偿”“原数的五分之一”兼顾原文结构与普通读者的理解；保留原文由复数转为单数的主语变化。
