base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/029.yaml
  text: This is the law of jealousy[a], when a wife goes astray under her husband and becomes defiled[c][b],
translation:
  language: zh_hans
  text: 这是关于疑忌的条例[a]：妻子在丈夫之下[b]走偏[c]而受了玷污。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “疑忌”原文为复数，可能是这套疑忌条例的专门称谓。
    reason: lexical_alternative
  - marker: b
    text: 直译“在她丈夫之下”，是描述她处于婚姻关系中的说法。
    reason: cultural_note
  - marker: c
    text: “走偏”也可译作“转离”或“偏离”；原文以走偏的比喻描述婚姻不忠。
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת תּוֹרַת
  choice: 这是……的条例
  rationale: 这是律法段落的总结公式；“条例”在现代中文中自然、庄重，并保留 תּוֹרָה 在此处的法律训令含义。
- source_word: הַקְּנָאֹת
  choice: 疑忌
  rationale: 希伯来语为复数，指本段因丈夫疑忌而启动的整套法律程序；中文以单数类名“疑忌”作程序的技术性称谓更自然，脚注说明原文形式。
- source_word: אֲשֶׁר
  choice: （冒号后引出情形）
  rationale: 关系词在这里引出条例适用的情形；中文用冒号衔接，比直译“当……时”更顺畅。
- source_word: תִּשְׂטֶה
  choice: 偏离正道
  rationale: 保留“转离、走偏”的隐喻，并由上下文表达婚姻不忠，不直接增译为“通奸”。
- source_word: אִשָּׁה
  choice: 妻子
  rationale: 该词可指女人或妻子，但后文明确提到她的丈夫，故此处应取婚姻语境中的“妻子”。
- source_word: תַּחַת אִישָׁהּ
  choice: 在丈夫的婚约之下
  rationale: תַּחַת 字面为“在……之下”；此处是婚姻关系用语。“婚约之下”既保留原文意象，也避免把含义单一化为丈夫的权力。
- source_word: וְנִטְמָאָה
  choice: 玷污了自己
  rationale: Nifal 形式在此可表达陷入污秽或使自身受玷污；结合实际不忠的语境，“玷污了自己”是自然中文，同时保留污秽范畴而不改写成“犯奸淫”。
theological_decisions:
- issue: 妻子污秽的性质
  choice: 玷污了自己
  alternative: 成为不洁／犯了奸淫
  rationale: 上下文涉及性方面的不忠，但希伯来文使用 טמא 的污秽语言，而非直接使用“通奸”一词；译文保留这种神学与法律张力，也不把它局限为礼仪性不洁。
- issue: תַּחַת אִישָׁהּ 所表达的婚姻关系
  choice: 在丈夫的婚约之下
  alternative: 在丈夫权下／背着丈夫
  rationale: 原文可唤起处于丈夫之下的婚姻关系或权属观念；“婚约之下”保留关系性意义而不将其完全解释为权威，也不采用缺乏词面依据的“背着”。
translation_notes:
  register: 采用现代、庄重而易懂的法律叙述语体。正文保留“偏离正道”和“玷污”的原文意象与神学用语；对复数技术称谓及婚姻习语以脚注交代。
