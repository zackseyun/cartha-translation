  to: 若有嫉妒之心临到丈夫，他为妻子而嫉妒，而她玷污了自己；或有嫉妒之心临到丈夫，他为妻子而嫉妒，但她并没有玷污自己[a]，
  rationale: 修订恢复原文两个情形中并列的法律叙述，删除“因……而……”和“因而”所添加的因果关系；同时以“临到丈夫”较明确地呈现“嫉妒之心／灵临到他”。保留“但”的汉语转折及其脚注说明。
