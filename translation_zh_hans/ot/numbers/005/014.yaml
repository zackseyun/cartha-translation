  text: וְ/עָבַ֨ר עָלָ֧י/ו רֽוּחַ קִנְאָ֛ה וְ/קִנֵּ֥א אֶת אִשְׁתּ֖/וֹ וְ/הִ֣וא נִטְמָ֑אָה אוֹ עָבַ֨ר עָלָ֤י/ו רֽוּחַ קִנְאָה֙ וְ/קִנֵּ֣א אֶת אִשְׁתּ֔/וֹ וְ/הִ֖יא לֹ֥א נִטְמָֽאָה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/014.yaml
  text: and a spirit of jealousy comes over him[a], and he is jealous of his wife, and she has defiled herself; or if a spirit of jealousy comes over him, and he is jealous of his wife, though she has not defiled herself[b],
translation:
  language: zh_hans
  text: 若有嫉妒之心临到丈夫，他为妻子而嫉妒，而她玷污了自己；或有嫉妒之心临到丈夫，他为妻子而嫉妒，但她并没有玷污自己[a]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “但”原文直译为“并且”。这里引出与前一种情形相对的可能：妻子实际上并没有玷污自己；“玷污”所译原文用语含有不洁的意思，在此语境中指所怀疑的性方面的污秽。
    reason: 说明原文连接词在汉语中作转折处理，并保留 נִטְמָאָה 的不洁含义。
lexical_decisions:
- source_word: וְעָבַר עָלָיו רוּחַ קִנְאָה
  choice: 丈夫若起了嫉妒之心
  rationale: 原文直译近于“嫉妒的灵临到他身上”，在这里描述一股支配人的嫉妒冲动。中文“起了嫉妒之心”自然地表达这种内在状态的出现，又不把 רוּחַ 过度实体化。
- source_word: וְקִנֵּא אֶת־אִשְׁתּוֹ
  choice: 嫉妒她／嫉妒妻子
  rationale: קנא 的强化词干在此指丈夫对妻子产生嫉妒或猜忌；“嫉妒”保留与名词 קִנְאָה 的词根呼应，并避免擅自判定妻子有罪。
- source_word: נִטְמָאָה
  choice: 玷污了自己
  rationale: 该词本义涉及不洁；本段语境是涉嫌性行为所造成的婚姻与礼仪污秽。“玷污了自己”保留道德—礼仪含义及行为主体性。
- source_word: אוֹ
  choice: 或
  rationale: 标明法律条文中的另一种可能情形，不额外增添原文没有明说的条件词。
- source_word: וְהִיא לֹא נִטְמָאָה
  choice: 但她并没有玷污自己
  rationale: 原文连接词字面为“并且”，此处两种情形形成明显对照，中文用“但”自然呈现其语境中的转折功能。
theological_decisions:
- issue: 涉嫌通奸条例中不洁用语的性质
  choice: 译作“玷污了自己”
  alternative: 变得不洁净／受了玷污
  rationale: 上下文所指不是一般礼仪沾染，而是涉嫌婚外性行为带来的不洁；本译法保留道德与礼仪层面的重叠，同时不预先裁定第二种情形中的妻子有罪。
- issue: “嫉妒之灵”的理解
  choice: 译作“起了嫉妒之心”
  alternative: 嫉妒的灵临到他／一股嫉妒之气临到他
  rationale: רוּחַ 在此可以指驱动人的冲动或心态。译作“嫉妒之心”符合现代汉语，也避免无根据地将其解释为独立的灵体。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语，保持法律条文的两种并列情形。“嫉妒”保留原文重复；“玷污自己”呈现本段性行为语境中的不洁含义。
