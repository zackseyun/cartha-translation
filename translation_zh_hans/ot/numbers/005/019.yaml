source:
  edition: WLC
  text: וְ/הִשְׁבִּ֨יעַ אֹתָ֜/הּ הַ/כֹּהֵ֗ן וְ/אָמַ֤ר אֶל הָֽ/אִשָּׁה֙ אִם לֹ֨א שָׁכַ֥ב אִישׁ֙ אֹתָ֔/ךְ וְ/אִם לֹ֥א שָׂטִ֛ית טֻמְאָ֖ה תַּ֣חַת אִישֵׁ֑/ךְ הִנָּקִ֕י מִ/מֵּ֛י הַ/מָּרִ֥ים הַֽ/מְאָרֲרִ֖ים הָ/אֵֽלֶּה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/019.yaml
  text: Then the priest shall make her swear and shall say to the woman[a], ‘If no man has lain with you, and if you have not gone astray in uncleanness under your husband[c][b], be free from these bitter waters that bring a curse.’
translation:
  language: zh_hans
  text: 祭司要叫她起誓，对她说：“若没有男子与你同寝，你身为有夫之妇时[a]也没有偏离而沾染污秽，愿你免受这些带来咒诅的苦水之害[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “身为有夫之妇时”希伯来文直译为“在你丈夫之下”，指处于婚姻关系及其约束中。
    reason: cultural_note
  - marker: b
    text: 希伯来文直译为“这些苦水，就是带来咒诅的”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִשְׁבִּיעַ אֹתָהּ
  choice: 要叫她起誓
  rationale: הִשְׁבִּיעַ 是 שבע 的使役式，表示使某人起誓或令其受誓言约束；“叫她起誓”清楚保留使役意义。
- source_word: אִם לֹא שָׁכַב אִישׁ אֹתָךְ
  choice: 若没有男子与你同寝
  rationale: שׁכב 在这里是指性关系的委婉语；“同寝”在现代中文中庄重、含蓄，也保留原文表达方式。
- source_word: שָׂטִית
  choice: 偏离
  rationale: 此动词表示转离、走偏；译作“偏离”保留隐喻，不直接把原文收窄为“通奸”。
- source_word: טֻמְאָה
  choice: 沾染污秽
  rationale: טֻמְאָה 可涵盖礼仪和道德层面的不洁；“污秽”保留其开放范围，“沾染”使中文搭配自然。
- source_word: תַּחַת אִישֵׁךְ
  choice: 身为有夫之妇时
  rationale: 字面为“在你丈夫之下”，此处指女子处于婚姻关系及其约束中；正文采用自然中文表达婚姻身份，并以脚注保留字面形式。
- source_word: הִנָּקִי
  choice: 愿你免受……之害
  rationale: נקה 在此表达不受牵连、免于其效力；“愿你免受”保留祭司宣告中的命令或祈愿语气，“之害”使汉语句义完整。
- source_word: מִמֵּי הַמָּרִים הַמְאָרֲרִים הָאֵלֶּה
  choice: 这些带来咒诅的苦水
  rationale: 保留“苦水”、复数指示词“这些”及分词 הַמְאָרֲרִים 的致使含义，不在正文中说明咒诅如何发生。
theological_decisions:
- issue: 女子行为的性质
  choice: 用“同寝”“偏离”“沾染污秽”呈现原文的性与婚姻不忠语境
  alternative: 直接译为“犯奸淫”或仅笼统译为“不洁”
  rationale: 上下文涉及疑似婚姻不忠，但本节用委婉语和污秽术语表达；保留这些层次可避免引入比希伯来文更明确的法律或教义定性。
- issue: 苦水与咒诅的关系
  choice: 译为“带来咒诅的苦水”
  alternative: “咒诅之苦水”或“使咒诅生效的苦水”
  rationale: 原文分词表明苦水具有招致咒诅的作用，但未在本节界定具体机制；正文不作进一步推断。
- issue: הִנָּקִי 的言语功能
  choice: 以“愿你免受”表达祭司在条件成立时的宣告
  alternative: “你必不受”或“你在……面前是无罪的”
  rationale: 该形式既有命令式外形，又在仪式语境中表达免责结果；“愿你免受”保留其庄严语气，而不将其改成单纯的事实陈述。
translation_notes:
  register: 采用现代、庄重而易懂的法律—礼仪语体。“同寝”保持含蓄；“身为有夫之妇时”避免生硬直译，同时由脚注交代希伯来习语。所有脚注标记均置于正文相应位置。
