  text: וּ֠/בָאוּ הַ/מַּ֨יִם הַ/מְאָרְרִ֤ים הָ/אֵ֨לֶּה֙ בְּֽ/מֵעַ֔יִ/ךְ לַ/צְבּ֥וֹת בֶּ֖טֶן וְ/לַ/נְפִּ֣ל יָרֵ֑ךְ וְ/אָמְרָ֥ה הָ/אִשָּׁ֖ה אָמֵ֥ן אָמֵֽן׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/022.yaml
  text: and may these curse-bringing waters enter your inward parts[a], to make the belly swell and the thigh waste away. And the woman shall say, ‘Amen, amen.’
translation:
  language: zh_hans
  text: 愿这些带来诅咒的水进入你的腹中[a]，使你的肚腹肿胀，大腿衰败。妇人要说：‘阿们，阿们。’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或较直译：“使肚腹肿胀，使大腿下坠。”这句希伯来语含义艰深，可能是指生殖系统受损的委婉说法。
    reason: 说明字面译法及原文可能存在的生殖性委婉含义，同时不在正文中确定具体病症。
lexical_decisions:
- source_word: וּבָאוּ
  choice: 愿……进入
  rationale: 在起誓和咒诅的语境中，此处虽为完成式形态，却带有祈愿或宣告咒诅生效的语气；“愿”比单纯将来时更能体现这一功能。
- source_word: הַמַּיִם הַמְאָרְרִים הָאֵלֶּה
  choice: 这些带来诅咒的水
  rationale: 保留“这些”和“水”的表达，并将源自“诅咒”的分词译为具有施效意味的“带来诅咒”，而不是“苦水”。
- source_word: בְּמֵעַיִךְ
  choice: 你的腹中
  rationale: מֵעֶה指身体内部或内脏；“腹中”既自然庄重，又保留身体内部的具体意象，不采用过于古旧或临床化的说法。
- source_word: לַצְבּוֹת בֶּטֶן
  choice: 使你的肚腹肿胀
  rationale: 将不定式理解为结果或目的；בֶּטֶן可指肚腹或子宫，此处以较直接且不预断具体生殖病变的“肚腹”表达。
- source_word: וְלַנְפִּל יָרֵךְ
  choice: 大腿衰败
  rationale: נפל本义为“落下、倒下”，但与יָרֵךְ构成的咒诅用语含义艰深，可能是委婉说法。“衰败”表达身体受损而不武断指定确切病理；“大腿”保留原文的委婉身体用语。
- source_word: וְאָמְרָה הָאִשָּׁה
  choice: 妇人要说
  rationale: 自然表达礼仪法规中规定的回应，同时保持叙述推进。
- source_word: אָמֵן אָמֵן
  choice: 阿们，阿们
  rationale: 保留重复的礼仪性郑重确认，不改写为解释性短语。
theological_decisions:
- issue: 咒诅所造成的身体后果
  choice: 以“肚腹肿胀，大腿衰败”作相对直译而可读的表达，不在正文中明确解释为流产、不育或某种具体生殖器官病变。
  alternative: 可译为“使你的子宫流产、腹部肿胀”，或“使你的肚腹肿胀、生殖器官萎缩”。
  rationale: 希伯来语短语含义艰深，并可能以“大腿”委婉指涉生殖部位。经文明确描述与生殖羞辱有关的身体咒诅，却没有在本节清楚界定医学结果，因此应保存原文的含混和神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“妇人”“阿们”保留律法礼仪语体；正文避免医学化或过度解释。“腹中”与“肚腹”分别对应身体内部和受影响部位，读来清楚且不过分口语化。
