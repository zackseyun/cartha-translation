source:
  edition: WLC
  text: וְ/הֶעֱמִ֨יד הַ/כֹּהֵ֥ן אֶֽת הָ/אִשָּׁה֮ לִ/פְנֵ֣י יְהוָה֒ וּ/פָרַע֙ אֶת רֹ֣אשׁ הָֽ/אִשָּׁ֔ה וְ/נָתַ֣ן עַל כַּפֶּ֗י/הָ אֵ֚ת מִנְחַ֣ת הַ/זִּכָּר֔וֹן מִנְחַ֥ת קְנָאֹ֖ת הִ֑וא וּ/בְ/יַ֤ד הַ/כֹּהֵן֙ יִהְי֔וּ מֵ֥י הַ/מָּרִ֖ים הַ/מְאָֽרֲרִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/018.yaml
  text: Then the priest shall set the woman before Yahweh, loosen the woman's hair, and place in her hands the grain offering of remembrance—it is a grain offering of jealousy—while in the priest's hand are the bitter waters that bring a curse.
translation:
  language: zh_hans
  text: 祭司要使那妇人站在耶和华面前，把她的头发解开[a]，将作为记念的素祭放在她双手上；这是疑忌的素祭。祭司手里要拿着那带来咒诅的苦水[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“露出那妇人的头”，也可理解为“任她的头发披散”。希伯来语直译近于“松开那妇人的头”，很可能是指把她束起的头发解开，作为仪式的一部分。
    reason: lexical_alternative
  - marker: b
    text: 或译：“那带来这咒诅的苦水”。原文分词可理解为这些水使咒诅生效，或承载所宣告的咒诅。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֶעֱמִיד
  choice: 要使……站在
  rationale: 使役形在礼仪语境中表示使人站立、呈到面前；此译既保留具体动作，也自然通顺。
- source_word: לִפְנֵי יְהוָה
  choice: 在耶和华面前
  rationale: 这是表示来到神临在之处的固定礼仪用语；专名 יְהוָה 译作“耶和华”。
- source_word: וּפָרַע אֶת רֹאשׁ הָאִשָּׁה
  choice: 把她的头发解开
  rationale: פָּרַע 与“头”构成的表达在此很可能指解开原先束起的头发。正文采用清楚的仪式动作，并以脚注保留“露出头部”的可能理解。
- source_word: וְנָתַן עַל כַּפֶּיהָ
  choice: 放在她双手上
  rationale: 原文直指两只手掌，译作“双手上”保留祭物置于摊开的手掌之上的具体姿态。
- source_word: מִנְחַת הַזִּכָּרוֹן
  choice: 作为记念的素祭
  rationale: מִנְחָה 在祭司礼仪语境中指素祭；זִכָּרוֹן 表示记念或使某事被记起。
- source_word: מִנְחַת קְנָאֹת הִוא
  choice: 这是因疑忌而献的素祭
  rationale: קְנָאֹת 虽为复数形式，在这里表达抽象的疑忌或嫉妒；“因疑忌而献”清楚说明这种祭的礼仪关联，又不判定指丈夫还是神的妒忌。
- source_word: וּבְיַד הַכֹּהֵן יִהְיוּ
  choice: 祭司手里要拿着
  rationale: 将希伯来语“在祭司手中”的状态句自然转换为现代汉语，同时保留与妇人手持素祭并行的画面。
- source_word: מֵי הַמָּרִים
  choice: 苦水
  rationale: 希伯来语复数形式“水”在汉语中自然用集合名词“水”；“苦”既可描述性质，也与仪式后果相呼应。
- source_word: הַמְאָרֲרִים
  choice: 带来咒诅的
  rationale: 该分词可表示使咒诅生效或承载咒诅；“带来咒诅”保留其施效含义而不过度细化机制。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。中文正文采用读者广泛熟悉的专名“耶和华”，而不是将其替换为称号“主”。
- issue: קְנָאֹת 在本仪式中的含义
  choice: 疑忌
  alternative: 嫉妒
  rationale: 上下文涉及丈夫对妻子是否不贞所生的疑忌；“疑忌”既符合民数记5章的司法礼仪背景，也避免把该词只解释为一种普通情绪。
- issue: 咒诅之水的作用
  choice: 带来咒诅
  alternative: 使人受咒诅
  rationale: 原文分词将水描述为与咒诅产生效力有关，但没有在本句中详述作用机制；译文保留这种张力。
translation_notes:
  register: 采用现代、庄重而清楚的礼仪叙述。“妇人”“祭司”“素祭”“咒诅”等用语与摩西五经祭司法典的语域相符；以两个句子呈现原文连续动作，避免中文长句过重。
