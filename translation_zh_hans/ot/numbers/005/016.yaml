  yaml_path: translation/ot/numbers/005/016.yaml
  text: Then the priest shall bring her near and make her stand before Yahweh[a].
translation:
  language: zh_hans
  text: 祭司要带她上前，使她站在雅威[a]面前。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文作“YHWH”（יהוה）；传统中文常译为“耶和华”，也译作“雅威”。
    reason: 说明神名的原文形式及中文主要译法。
lexical_decisions:
- source_word: וְהִקְרִיב אֹתָהּ
  choice: 要把她带近来
  rationale: הקריב是קרב的使役式，在此以女子为直接宾语，表示把她带近或领上前；“带近来”保留空间含义，也避免误解为把她当作祭物献上。
- source_word: הַכֹּהֵן
  choice: 祭司
  rationale: כֹּהֵן在礼仪和律法语境中的常规对应词。
- source_word: וְהֶעֱמִדָהּ
  choice: 使她站
  rationale: עמד的使役式表达“使……站立”；“使她站”自然且保留原文的使役语气。
- source_word: לִפְנֵי
  choice: 面前
  rationale: 表示处于某位面前或临在之中；“面前”简洁、自然，并与原文空间表达相称。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者最熟悉的专名形式呈现四字神名，同时用脚注说明希伯来文形式及其他译法。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威；主
  rationale: 原文直接使用四字神名。正文采用现代中文基督教语境中通行且可辨识的专名“耶和华”，不以称号“主”取代；脚注保留其希伯来文形式并交代“雅威”这一拟音译法。
translation_notes:
  register: 采用简洁、庄重而现代的律法叙事语体。“要”承接本段程序性指令；“带近来”与“使她站”分别保留两个希伯来语使役动词的动作层次。
