  text: דַּבֵּר֮ אֶל בְּנֵ֣י יִשְׂרָאֵל֒ אִ֣ישׁ אֽוֹ אִשָּׁ֗ה כִּ֤י יַעֲשׂוּ֙ מִ/כָּל חַטֹּ֣את הָֽ/אָדָ֔ם לִ/מְעֹ֥ל מַ֖עַל בַּ/יהוָ֑ה וְ/אָֽשְׁמָ֖ה הַ/נֶּ֥פֶשׁ הַ/הִֽוא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/006.yaml
  text: 'Speak to the sons of Israel: When a man or a woman commits any of the sins of mankind[a], by acting unfaithfully against Yahweh, then that person is guilty,'
translation:
  language: zh_hans
  text: “你要告诉以色列人：无论男人或女人，若犯了人所会犯的任何罪，对耶和华背信得罪，那人就有罪责。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דַּבֵּר אֶל־בְּנֵי יִשְׂרָאֵל
  choice: 你要告诉以色列人
  rationale: 命令式דַּבֵּר在律法宣告中可自然译为“你要告诉”；בְּנֵי יִשְׂרָאֵל是对以色列民的常用称呼，现代汉语以“以色列人”清楚自然。
- source_word: אִישׁ אוֹ אִשָּׁה
  choice: 无论男人或女人
  rationale: 明确保留原文男女并列，并表达律例对双方逐一适用。
- source_word: מִכָּל חַטֹּאת הָאָדָם
  choice: 人所会犯的任何罪
  rationale: הָאָדָם在此泛指人类；此译法既保留“人的罪”的语义，又避免被误解为只指男性，并契合该法律句式。
- source_word: לִמְעֹל מַעַל
  choice: 背信
  rationale: 同根动词与名词连用强调不忠和失信；“背信”简洁传达其关系性、盟约性的冒犯意味。
- source_word: בַּיהוָה
  choice: 得罪耶和华
  rationale: 介词בְּ与מעל搭配，表示背信所针对的对象；“得罪”符合现代汉语表达。神名按其专名译作“耶和华”。
- source_word: וְאָשְׁמָה הַנֶּפֶשׁ הַהִוא
  choice: 那人就有罪责
  rationale: נֶפֶשׁ在此指具体的人，并非专指非物质的“灵魂”；אָשֵׁם表示陷入有罪并负有责任的状态，“有罪责”保留法律责任含义。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 耶和华
  alternative: 雅威；上主
  rationale: 原文使用四字神名；正文采用现代中文圣经读者熟悉的专名“耶和华”，使神名与称号有所区别，同时不对其古代读音作过度断定。
- issue: מעל所表达的冒犯性质
  choice: 背信得罪耶和华
  alternative: 干犯耶和华；对耶和华不忠
  rationale: 原文将人的罪描述为对耶和华的背信；译文保留罪既涉及人际或法律行为、又构成对神不忠的神学张力。
- issue: אָשֵׁם的结果状态
  choice: 有罪责
  alternative: 有罪；负罪
  rationale: “有罪责”兼顾被判为有罪及承担责任的含义，而不提前引入下一节才说明的认罪和赔偿。
translation_notes:
  register: 采用现代、庄重而通俗的律法文体。“无论男人或女人”保留原文明确的性别并列；“人所会犯的”呈现הָאָדָם的泛指意义。句末用句号，使本节可独立阅读；下一节可继续说明认罪与赔偿。
