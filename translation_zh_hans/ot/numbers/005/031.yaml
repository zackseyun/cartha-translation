  terminology: “罪责”恰当传达עון在此的道德—法律责任含义，并应在两处保持一致。“担当自己的罪责”自然保留נשא עון这一习语，不将其预先解释为惩罚或后果。“男人”保留איש的字面范围，脚注说明按语境可作“丈夫”即可。
