base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/031.yaml
  text: Then the man will be free from guilt[b][a], but that woman will bear her guilt.
translation:
  language: zh_hans
  text: 这样，男人便可免于罪责[a]；那女人却要担当自己的罪责[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “男人”按上下文也可译作“丈夫”；“免于罪责”也可译作“被免除罪责”。
    reason: lexical_alternative
  - marker: b
    text: “担当自己的罪责”也可理解为“承担自己罪孽所带来的后果”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנִקָּה
  choice: 就不承担
  rationale: נקה的尼法勒形在此与מִן及עָוֹן连用，表示免除罪责或责任。中文用“不承担罪责”自然地表达这一结果，也与后半句“担当罪责”形成清楚对照。
- source_word: הָאִישׁ
  choice: 男人
  rationale: אִישׁ的直接含义是“男人”；上下文表明此人是丈夫，但正文保留较形式对应的译法。
- source_word: מֵעָוֺן
  choice: 罪责
  rationale: עָוֹן可指罪孽、罪责，也可涵盖犯罪所招致的后果。此处“罪责”兼具道德与责任层面的含义，并适合与נקה搭配。
- source_word: וְהָאִשָּׁה הַהִוא
  choice: 但那女人
  rationale: וְ字面可译“而/和”，此处前后分句构成对照，译为“但”符合现代汉语；“那女人”保留הַהִוא的指示意味。
- source_word: תִּשָּׂא אֶת עֲוֺנָהּ
  choice: 要担当自己的罪责
  rationale: נשׂא עָוֹן是“担当罪责”的惯用表达，也可能包含承受罪责后果之意。正文保留这一简洁而有张力的说法，不把后果义直接写入正文。
theological_decisions:
- issue: 两处עָוֹן的含义及对应关系
  choice: 两处均译为“罪责”
  alternative: 罪孽；罪孽的惩罚；后果
  rationale: 统一译为“罪责”，可保留男人免于责任与女人承担责任之间的法律—道德对照，同时不把该词限缩为罪行本身或惩罚后果。
- issue: 男人获得免责的范围
  choice: 译为“不承担罪责”，不补充免责条件或原因
  alternative: 译为“无罪”或“被判无罪”
  rationale: 原文表达从עָוֹן中得以洁净、免除或不负责任，并未在本节中进一步界定其范围；避免译成笼统的“无罪”或正式司法性的“被判无罪”，以免过度阐释。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“这样”承接整段仪式结论；以分号呈现两个彼此对照的分句。正文中的[a]、[b]均与脚注对应。
