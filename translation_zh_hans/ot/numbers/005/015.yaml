  text: וְ/הֵבִ֨יא הָ/אִ֣ישׁ אֶת אִשְׁתּ/וֹ֮ אֶל הַ/כֹּהֵן֒ וְ/הֵבִ֤יא אֶת קָרְבָּנָ/הּ֙ עָלֶ֔י/הָ עֲשִׂירִ֥ת הָ/אֵיפָ֖ה קֶ֣מַח שְׂעֹרִ֑ים לֹֽא יִצֹ֨ק עָלָ֜י/ו שֶׁ֗מֶן וְ/לֹֽא יִתֵּ֤ן עָלָי/ו֙ לְבֹנָ֔ה כִּֽי מִנְחַ֤ת קְנָאֹת֙ ה֔וּא מִנְחַ֥ת זִכָּר֖וֹן מַזְכֶּ֥רֶת עָוֺֽן־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/015.yaml
  text: 'Then the man shall bring his wife to the priest[a], and he shall bring her offering for her: a tenth of an ephah of barley flour. He shall pour no oil on it and put no frankincense on it, because it is a grain offering of jealousy[b], a memorial offering that brings iniquity to remembrance.'
translation:
  language: zh_hans
  text: 那人要把妻子带到祭司那里，也要替她带上她的供物：十分之一伊法的大麦粉。他不可在上面浇油，也不可在上面放乳香，因为这是疑忌的素祭，是使罪孽被记起的记念素祭[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “罪孽”也可译作“罪责”；希伯来语 עָוֹן 可指罪孽、罪责，或犯罪所带来的责任。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵבִיא הָאִישׁ אֶת אִשְׁתּוֹ
  choice: 那人要把妻子带来
  rationale: 保留 הָאִישׁ 的字面意义“那人”，同时由“妻子”自然表明其丈夫身份；法律语境中的动词形式译为“要”。
- source_word: קָרְבָּנָהּ עָלֶיהָ
  choice: 为她带来她的供物
  rationale: 阴性后缀表明供物与妻子相关，עָלֶיהָ 在此表达代为、为着她；译文同时保留“她的供物”和丈夫代带的关系。
- source_word: עֲשִׂירִת הָאֵיפָה
  choice: 十分之一伊法
  rationale: 按原文保留古代容量单位“伊法”，不换算为不确定的现代数值。
- source_word: קֶמַח שְׂעֹרִים
  choice: 大麦粉
  rationale: קֶמַח 指磨成的粉，结构直译为“大麦粉”，符合现代汉语。
- source_word: מִנְחַת קְנָאֹת
  choice: 疑忌的素祭
  rationale: 祭司礼仪语境中的 מִנְחָה 译作“素祭”；קְנָאֹת 在本段涉及丈夫的嫉妒或猜疑，采用“疑忌”兼顾这两层含义，不预断妻子有罪。
- source_word: מִנְחַת זִכָּרוֹן
  choice: 纪念祭
  rationale: זִכָּרוֹן 表示使人或事被记念；“纪念祭”简洁保留其礼仪功能。
- source_word: מַזְכֶּרֶת עָוֹן
  choice: 使罪孽被记起
  rationale: 将使役/纪念含义表达为“使……被记起”；עָוֹן 可指罪孽、罪责或犯罪所招致的责任，正文选“罪孽”并以脚注保留语义范围。
theological_decisions:
- issue: 疑忌祭是否预设妻子有罪
  choice: 不预断妻子的罪或无罪，只说明祭物具有使罪孽被记起的功能。
  alternative: 译成“显明她罪责的祭”，从而暗示她已经有罪。
  rationale: 本节规定祭物的材料与礼仪功能，却尚未给出审判结果；译文应保留这种司法与神学张力。
- issue: קְנָאֹת 的情感与法律含义
  choice: 译作“疑忌”，兼容嫉妒、猜疑和维护专属关系的热忱。
  alternative: 译作“嫉妒”，较贴近常见字面对应，却在现代汉语中容易仅被理解为负面情绪。
  rationale: 上下文是丈夫因怀疑妻子不忠而采取的仪式；“疑忌”更自然地反映语境，同时不排除原词的嫉妒意味。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“伊法”“素祭”“乳香”等保留圣经礼仪术语；句法略带法规语体，但避免生硬仿古。英文咨询层的脚注标记位置与内容存在错配，因此依据希伯来原文重新设置一条实际相关的词义脚注，并确保正文出现[a]。
