  text: וְ/הִשְׁבִּ֨יעַ הַ/כֹּהֵ֥ן אֶֽת הָֽ/אִשָּׁה֮ בִּ/שְׁבֻעַ֣ת הָ/אָלָה֒ וְ/אָמַ֤ר הַ/כֹּהֵן֙ לָֽ/אִשָּׁ֔ה יִתֵּ֨ן יְהוָ֥ה אוֹתָ֛/ךְ לְ/אָלָ֥ה וְ/לִ/שְׁבֻעָ֖ה בְּ/ת֣וֹךְ עַמֵּ֑/ךְ בְּ/תֵ֨ת יְהוָ֤ה אֶת יְרֵכֵ/ךְ֙ נֹפֶ֔לֶת וְ/אֶת בִּטְנֵ֖/ךְ צָבָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/021.yaml
  text: Then the priest shall make the woman swear with the oath of the curse[a], and the priest shall say to the woman, “May Yahweh make you a curse and an oath among your people[c][b], when Yahweh makes your thigh waste away and your abdomen swell.”
translation:
  language: zh_hans
  text: 祭司要使妇人以这咒诅的誓言起誓[a]。祭司要对妇人说：“愿雅威在使你的大腿萎缩[c]、腹部肿胀[d]时，叫你在你本族中成为咒诅和誓言[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “咒诅的誓言”指带有咒诅条款的誓言，也可译作“咒诅之誓”。
    reason: 说明希伯来语结构及礼仪含义。
  - marker: b
    text: “成为咒诅和誓言”可能是说，她将成为本族人咒诅别人或起誓时所援引的反面实例。
    reason: 解释原文浓缩而带有惯用色彩的表达。
  - marker: c
    text: “大腿萎缩”的原文直译近于“大腿下坠”或“大腿落下”，含义难以确定；“大腿”也可能委婉指生殖部位。
    reason: 保留疑难希伯来语的字面形象及可能的委婉含义。
  - marker: d
    text: “腹部”也可译作“肚腹”，在某些语境中可指“子宫”。这里究竟描述何种身体或生殖后果，仍有争议。
    reason: 说明词义范围，避免把经文限定为某一种医学解释。
lexical_decisions:
- source_word: וְהִשְׁבִּיעַ
  choice: 叫……起誓
  rationale: 该词是שׁבע的使役式，表示祭司使妇人立誓；“叫……起誓”既保留使役意义，也符合现代汉语的礼仪和法律语境。
- source_word: בִּשְׁבֻעַת הָאָלָה
  choice: 以咒诅的誓言
  rationale: 保留שְׁבֻעָה“誓言”与אָלָה“咒诅”两个要素，同时以“以……起誓”自然表达希伯来语介词结构。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见音译呈现四字神名，保留其作为专名的性质，不以称号替代。
- source_word: לְאָלָה וְלִשְׁבֻעָה
  choice: 成为咒诅和誓言
  rationale: 形式上保留原文并列的“咒诅”和“誓言”；其惯用含义可能是成为别人咒诅或起誓时援引的例子，另在脚注说明。
- source_word: בְּתוֹךְ עַמֵּךְ
  choice: 在你的族人中
  rationale: 既表达共同体范围，也比“在你的人民中间”更符合当前语境和现代汉语习惯。
- source_word: בְּתֵת
  choice: 愿雅威使
  rationale: 原文介词加不定式说明前述咒诅实现时的情形或方式。中文分号后重复“愿雅威使”，保持原文神名的重复及咒诅公式的庄重力度。
- source_word: יְרֵךְ נֹפֶלֶת
  choice: 大腿萎缩
  rationale: יָרֵךְ通常指大腿或胯部，נפל字面有“落下”之意，但此处难解，可能描写衰败、萎缩。正文采用可理解的“萎缩”，脚注保留字面表达及可能的委婉含义。
- source_word: בִּטְנֵךְ צָבָה
  choice: 腹部肿胀
  rationale: בֶּטֶן可指腹部、肚腹或子宫；צָבָה表示肿胀、鼓起。正文用不预断具体生殖或医学结果的“腹部肿胀”。
theological_decisions:
- issue: 如何处理这一咒诅中含义有争议的身体症状
  choice: 正文保留“大腿萎缩，腹部肿胀”的身体意象，不明确解释为流产、不孕或某种特定病症。
  alternative: 译作“子宫脱落、胎儿流产”或其他明确的生殖医学结果。
  rationale: 希伯来语表达难解，虽可能涉及生殖器官或生育能力，却没有明确说出某一种医学结果。正文不应消除这种歧义，相关可能性在脚注中交代。
- issue: “成为咒诅和誓言”的社会及礼仪含义
  choice: 正文贴近原文保留两个并列名词，脚注解释其可能指别人咒诅或起誓时把她当作反面实例援引。
  alternative: 在正文直接意译为“成为族人咒诅和起誓时援引的例子”。
  rationale: 直译保留咒诅公式的浓缩表达，脚注则帮助普通读者理解其惯用功能，避免把一种解释写死在正文中。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“祭司”“起誓”“咒诅”等保留礼仪语域；句式略带正式感，但避免文言化。正文维持原文身体意象和关键歧义，借脚注补充字面义及可能解释。
