  text: וַ/יַּֽעֲשׂוּ כֵן֙ בְּנֵ֣י יִשְׂרָאֵ֔ל וַ/יְשַׁלְּח֣וּ אוֹתָ֔/ם אֶל מִ/ח֖וּץ לַֽ/מַּחֲנֶ֑ה כַּ/אֲשֶׁ֨ר דִּבֶּ֤ר יְהוָה֙ אֶל מֹשֶׁ֔ה כֵּ֥ן עָשׂ֖וּ בְּנֵ֥י יִשְׂרָאֵֽל־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/004.yaml
  text: And the sons of Israel did so[a], and sent them outside the camp; just as Yahweh had spoken to Moses, so the sons of Israel did.
translation:
  language: zh_hans
  text: 以色列人[a]就照着做了，把他们送到营外。正如耶和华对摩西所说的，以色列人就照着做了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语字面意思是“以色列的子孙”，这里统指以色列全体百姓。
    reason: 说明原文的亲属式民族称呼及其集体用法。
lexical_decisions:
- source_word: וַיַּעֲשׂוּ כֵן
  choice: 就照样做了
  rationale: עשה + כן表示依照先前的命令而行；“照样做了”自然清楚，也保留顺从命令的含义。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 该词组字面为“以色列的众子”，在这里作为全体民族的称呼；译作“以色列人”符合现代汉语的自然表达，并以脚注说明其字面形式。
- source_word: וַיְשַׁלְּחוּ אֹתָם
  choice: 把他们送到
  rationale: שׁלח在此指将有关人员送离营地；“把他们送到营外”与后面的方向短语结合，明确表达排除在营地之外的行动。
- source_word: אֶל מִחוּץ לַמַּחֲנֶה
  choice: 到营外
  rationale: 简洁而准确地表达从营内到营外的方向和空间范围。
- source_word: כַּאֲשֶׁר דִּבֶּר
  choice: 怎样……说
  rationale: 保留原文“说”的基本意义和比较结构，表达以色列人的行动完全符合耶和华先前对摩西所说的话。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经传统中广为人知的专名音译，以专名呈现四字神名，而不以“主”等称号替代。
- source_word: כֵּן עָשׂוּ
  choice: 就怎样做了
  rationale: 保留原文结尾的回应式重复，突出以色列人严格遵行神所说的话。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 两者都是四字神名的中文音译；正文采用中文读者最熟悉且具专名功能的“耶和华”，避免用称号取代原文神名。
- issue: דִּבֶּר 在命令语境中的表达
  choice: 说
  alternative: 吩咐
  rationale: 上下文确实是命令，但原文此处使用一般动词“说”；译作“说”保留词义宽度，不在本节内额外强化为命令术语。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“照样做了……怎样说……就怎样做了”有意保留希伯来文首尾重复，以强调以色列人的顺从；句间用句号，使中文叙述清楚流畅。
