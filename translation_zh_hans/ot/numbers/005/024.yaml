base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/024.yaml
  text: Then he shall make the woman drink the bitter water that brings a curse[b][a], and the curse-bringing water shall enter into her bitterly.
translation:
  language: zh_hans
  text: 他要叫那妇人喝这带来咒诅的苦水[a]；这带来咒诅的水要进入她里面，带来苦楚[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“带来咒诅的苦味之水”。希伯来语的“水”采用复数形式，这是该语言指水时常见的表达。
    reason: lexical_alternative
  - marker: b
    text: 原文较直译为“那带来咒诅的水要进入她里面，为苦（或归于苦）”。末语也可指苦味、苦楚，或使她受苦的结果。
    reason: alternative_reading
lexical_decisions:
- source_word: וְהִשְׁקָה
  choice: 他要让……喝下
  rationale: שׁקה 的使役式表示“使……喝”或“给……喝”；“让……喝下”既保留使役意义，也符合现代汉语表达。
- source_word: הָאִשָּׁה
  choice: 那妇人
  rationale: 保留原文定冠词和特指含义；“妇人”符合庄重而易懂的叙事语体。
- source_word: מֵי הַמָּרִים
  choice: 苦水
  rationale: 原文直译为“苦味之水”，其中“水”采用希伯来语常见的复数形式；汉语用集合性名词“水”更自然。
- source_word: הַמְאָֽרֲרִים / הַמְאָרֲרִים
  choice: 使人受咒诅的
  rationale: 源自动词 ארר 的分词在此描述水所承载或促成的咒诅作用，而不必理解为水本身已经被咒诅。重复译出，以保留原文的强调和结构呼应。
- source_word: וּבָאוּ בָהּ
  choice: 就会进入她体内
  rationale: בוא 与介词 ב 连用表示进入；“体内”在饮水语境中自然明确，又不添加具体生理解释。
- source_word: לְמָרִים
  choice: 带来苦楚
  rationale: 介词 לְ 可表达结果或作用；原词与前面的“苦”形成词根呼应。译作“带来苦楚”表达其不利结果，同时避免擅自具体化惩罚方式。
theological_decisions:
- issue: 仪式中咒诅之水的性质
  choice: 译作“使人受咒诅的水”，强调水在仪式中承载或施行咒诅的作用。
  alternative: 译作“被咒诅的水”或“咒诅之水”。
  rationale: 希伯来语分词较自然地指向水所产生或传递的咒诅效果。这样既保留司法—礼仪语境，也避免把水描写成自身具有独立的魔法性质。
- issue: לְמָרִים 所指的结果
  choice: 译作“带来苦楚”，保留其结果性和负面作用。
  alternative: 译作“成为苦味”“苦苦地进入她里面”或“使她受苦”。
  rationale: 原文措辞简短且有语义张力，可能指苦味、苦楚或不利后果；正文采用自然汉语概括结果，脚注保留较直译的可能，不将其限定为某种生理症状。
translation_notes:
  register: 采用现代、庄重且易懂的简体中文。“他”保留本节原文的代词衔接，不在本节内重复补出上下文中的“祭司”。正文保留“苦”与“苦楚”的词义呼应，并重复“使人受咒诅的水”，以反映希伯来原文的重复强调。
