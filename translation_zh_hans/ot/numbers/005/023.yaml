  text: וְ֠/כָתַב אֶת הָ/אָלֹ֥ת הָ/אֵ֛לֶּה הַ/כֹּהֵ֖ן בַּ/סֵּ֑פֶר וּ/מָחָ֖ה אֶל מֵ֥י הַ/מָּרִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/023.yaml
  text: Then the priest shall write these curses in the scroll and wash them off into the bitter water[a][b].
translation:
  language: zh_hans
  text: 祭司要把这些咒诅[a]写在书卷上，然后将所写的咒诅从书卷上抹下，抹入苦水中[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“这些与誓言有关的咒诅”或“这些誓咒”。希伯来语这个词可指与誓言相连的咒诅。
    reason: lexical_alternative
  - marker: b
    text: “抹下，抹入”也可译作“擦去”或“抹掉”。希伯来语动词指擦掉或抹去所写的内容；结合后面的“苦水”，此处表示将其抹到水中。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָתַב
  choice: 要……写
  rationale: 带连接词的完成式在这一连串礼仪指令中表示接续的规定性动作；现代汉语用“要”自然传达其指令语气。
- source_word: הָאָלֹת הָאֵלֶּה
  choice: 这些咒诅
  rationale: אָלָה可指与誓言相连的咒诅；此处所写的是先前宣告的惩罚性咒语，正文译作“咒诅”清楚自然，并以脚注保留“誓约之咒”的含义。
- source_word: הַכֹּהֵן
  choice: 祭司
  rationale: 准确对应主持此项礼仪的宗教职分，也是现代中文圣经语境中通行而易懂的称谓。
- source_word: בַּסֵּפֶר
  choice: 在卷轴上
  rationale: סֵפֶר在此指用于书写的文书或卷轴，而非现代装订书册；中文以“在卷轴上”表达书写表面最自然。
- source_word: וּמָחָה
  choice: 把所写的字洗入
  rationale: מחה意为擦去、涂抹或抹除；在本仪式中，字迹因水而从卷轴转入水中。“洗入”既交代实际动作，也避免仅译“抹去”而失去转入水中的含义。
- source_word: אֶל
  choice: 入
  rationale: 介词表示朝向或进入；结合将字迹从卷轴洗下的动作，译作“入”准确表达其进入水中的结果。
- source_word: מֵי הַמָּרִים
  choice: 苦水
  rationale: 原文直译为“苦涩之水”或“苦水”；“苦水”简洁自然，并与本段礼仪用语一致。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的礼仪法规语体。用“卷轴”交代古代书写载体；用“把所写的字洗入苦水中”使中文宾语明确，同时保留原文所表达的擦除及转入水中的双重动作。
