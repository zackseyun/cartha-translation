source:
  edition: WLC
  text: וְ/שָׁכַ֨ב אִ֣ישׁ אֹתָ/הּ֮ שִׁכְבַת זֶרַע֒ וְ/נֶעְלַם֙ מֵ/עֵינֵ֣י אִישָׁ֔/הּ וְ/נִסְתְּרָ֖ה וְ/הִ֣יא נִטְמָ֑אָה וְ/עֵד֙ אֵ֣ין בָּ֔/הּ וְ/הִ֖וא לֹ֥א נִתְפָּֽשָׂה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/013.yaml
  text: and a man lies with her[a], with an emission of seed, and it is hidden from the eyes of her husband, and she is concealed, and she has become unclean, and there is no witness against her[c][b], and she was not caught—
translation:
  language: zh_hans
  text: 有男人与她交合，有精液排出[a]；这事瞒过了她丈夫的眼睛；她隐而未露，成为不洁净；却没有证人指证她[b]，她也没有被抓住[c]——
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译近于“精液的寝卧”，指性交并有精液排出。
    reason: lexical_alternative
  - marker: b
    text: 或译：“没有关于她的证人。”
    reason: alternative_reading
  - marker: c
    text: 或译：“她没有被捉住。”这个词也有人理解为暗示“她没有被强迫”。
    reason: alternative_reading
lexical_decisions:
- source_word: וְשָׁכַב אִישׁ אֹתָהּ
  choice: 有男人同她交合
  rationale: שׁכב与人称宾语连用时在此明确指性关系。“交合”准确、庄重，也比委婉的“同寝”更不易产生歧义。
- source_word: שִׁכְבַת זֶרַע
  choice: 射出精液
  rationale: 该短语字面近于“精液的寝卧”，在此指伴随精液排出的性交。正文采用自然明确的表达，字面形式及其惯用含义在脚注中说明。
- source_word: וְנֶעְלַם מֵעֵינֵי אִישָׁהּ
  choice: 这事瞒过了她丈夫的眼睛
  rationale: 保留“从丈夫眼中隐藏”的希伯来语意象，同时用“这事”明确所指，使现代汉语连贯。
- source_word: וְנִסְתְּרָה
  choice: 她隐而未露
  rationale: 希伯来语被动式可表达她处于隐藏状态，也可能带反身意味。“隐而未露”尽量保留被动与反身之间的含混，不明确断定是谁主动隐瞒。
- source_word: וְהִיא נִטְמָאָה
  choice: 成了不洁净的
  rationale: 采用律法与洁净范畴中的“不洁净”，保留 טמא 的宗教—法律语域，不以更强烈的“污秽”替代。
- source_word: וְעֵד אֵין בָּהּ
  choice: 没有证人指证她
  rationale: בָּהּ 可理解为“针对她”或“关于她”。正文以自然的法律汉语表达其指证作用，另一种较中性的关系义置于脚注。
- source_word: וְהִוא לֹא נִתְפָּשָׂה
  choice: 她也没有被抓住
  rationale: נתפשׂ 在此最自然地表示未被发现或抓住；不添加“当场”，以免超出原文。其“被捉拿／被强迫”的可能理解保留在脚注中。
theological_decisions:
- issue: נִטְמָאָה 的洁净律用语
  choice: 成了不洁净的
  alternative: 受了玷污
  rationale: “不洁净”保留本段律法语境中的洁净类别，而“受了玷污”可能使读者预先认定其被动受害或强化道德修辞。
- issue: לֹא נִתְפָּשָׂה 的含义
  choice: 她没有被抓住
  alternative: 她没有被强迫
  rationale: 上下文强调丈夫不知情、没有证人，故“未被抓住”较符合缺少证据的法律场景；但动词也可作“被捉住／抓住”理解，并有人据此联想到强迫，因此不在正文中排除该可能。
- issue: וְנִסְתְּרָה 的语态与主体性
  choice: 她隐而未露
  alternative: 她把这事隐藏起来
  rationale: 原文的被动式可能表示她处于隐蔽状态，也可含反身意味。正文避免明确归为她主动掩盖，以保存语态上的张力。
translation_notes:
  register: 采用现代、庄重而易懂的律法叙述语体。“交合”“精液”保持明确而不粗俗；分号与破折号延续本节作为条件句中段、尚未完结的句法结构。所有脚注标记均置于正文相应词句之后。
