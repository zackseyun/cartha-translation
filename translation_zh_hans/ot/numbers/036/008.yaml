source:
  edition: WLC
  text: וְ/כָל בַּ֞ת יֹרֶ֣שֶׁת נַחֲלָ֗ה מִ/מַּטּוֹת֮ בְּנֵ֣י יִשְׂרָאֵל֒ לְ/אֶחָ֗ד מִ/מִּשְׁפַּ֛חַת מַטֵּ֥ה אָבִ֖י/הָ תִּהְיֶ֣ה לְ/אִשָּׁ֑ה לְמַ֗עַן יִֽירְשׁוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל אִ֖ישׁ נַחֲלַ֥ת אֲבֹתָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/036/008.yaml
  text: And every daughter who possesses an inheritance from the tribes of the sons of Israel shall become the wife of one from the clan of her father's tribe[d][c][b][a], so that the sons of Israel may each possess the inheritance of his fathers.
translation:
  language: zh_hans
  text: 凡在以色列各支派中拥有产业的女子，都要嫁给她父亲支派宗族中的一个男子[a]，好使以色列人各自保有自己祖先的产业[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“要成为她父亲支派宗族中一个人的妻子。”
    reason: 说明希伯来语婚姻习语及“一个人”的单数表达。
  - marker: b
    text: “保有”也可译作“承受”；这里的希伯来语动词可指继承，也可指占有、持有土地。
    reason: 保留ירשׁ在继承与持有之间的词义幅度。
lexical_decisions:
- source_word: יֹרֶשֶׁת נַחֲלָה
  choice: 拥有产业
  rationale: 分词可表示承受或持有产业；在本条土地法规中，重点是女子作为女继承人所处的持续法律状态。“拥有产业”自然地表达这一点，也避免汉语中“继承产业”可能偏重一次性事件的意味。
- source_word: נַחֲלָה
  choice: 产业
  rationale: 此处指按宗族世代承受的土地份额。“产业”兼具继承所得财产与土地持有的含义，适合本段法律语境。
- source_word: מִמַּטּוֹת בְּנֵי יִשְׂרָאֵל
  choice: 在以色列各支派中
  rationale: מַטֶּה指以色列的支派。“以色列人”在现代汉语中自然对应群体称谓בְּנֵי יִשְׂרָאֵל；本句法律重点不在逐字呈现“儿子们”，而在支派归属。
- source_word: מִמִּשְׁפַּחַת מַטֵּה אָבִיהָ
  choice: 她父亲支派宗族中的
  rationale: מִשְׁפָּחָה在支派制度中指支派之下的亲族单位，译作“宗族”可与较大的“支派”清楚区分。
- source_word: תִּהְיֶה לְאִשָּׁה
  choice: 要嫁给
  rationale: 希伯来语习语直译为“成为……的妻子”；“要嫁给”是自然、庄重的现代汉语，也保留法规的约束语气。
- source_word: יִירְשׁוּ אִישׁ
  choice: 各自保有
  rationale: ירשׁ在土地语境中既可指承受，也可指占有、持有；אִישׁ具有逐一分配的作用。“各自保有”突出本法旨在防止祖传土地转移，并避免重复使用“继承产业”造成生硬。
- source_word: נַחֲלַת אֲבֹתָיו
  choice: 祖宗的产业
  rationale: 保留复数“父辈”的父系继承背景；“祖宗”是自然而庄重的汉语表达，比泛化的“祖先遗产”更贴近本段宗族土地制度。
theological_decisions:
- issue: 父系支派继承制度中的性别化语言
  choice: 正文保留“父亲支派”和“祖宗的产业”，同时将בני ישראל按现代汉语惯例译为“以色列人”。
  alternative: 逐字译作“以色列的众子”和“他列祖的产业”。
  rationale: 本节的父系法律结构必须保留，因此“父亲支派”与“祖宗”不可中性化；但בני ישראל是全民族的固定称谓，译作“以色列人”在汉语中准确自然，并不消除本句明确存在的父系框架。
translation_notes:
  register: 采用现代、庄重且易懂的法律叙述语体。“产业”“支派”“宗族”维持本段土地与亲族制度的术语层级；句式避免机械复制希伯来语，同时保留目的从句及父系继承结构。
