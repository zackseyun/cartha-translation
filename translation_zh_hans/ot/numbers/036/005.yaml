  text: וַ/יְצַ֤ו מֹשֶׁה֙ אֶת בְּנֵ֣י יִשְׂרָאֵ֔ל עַל פִּ֥י יְהוָ֖ה לֵ/אמֹ֑ר כֵּ֛ן מַטֵּ֥ה בְנֵֽי יוֹסֵ֖ף דֹּבְרִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/036/005.yaml
  text: So Moses commanded the sons of Israel according to the word of Yahweh, saying, “The tribe of the sons of Joseph is speaking rightly.”
translation:
  language: zh_hans
  text: 摩西照着耶和华的话[a]吩咐以色列人说：“约瑟子孙的支派说得对。”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语直译为“照着耶和华的口”。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“约瑟子孙的支派所说的是对的”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו
  choice: 吩咐
  rationale: צוה 表示带有权威的命令或嘱咐；“吩咐”在现代中文圣经语体中自然庄重，也保留其权威性。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 希伯来语直译为“以色列的众子”，此处指以色列民族；“以色列人”是现代中文自然、准确且不造成仅限男性之误解的表达。
- source_word: עַל פִּי יְהוָה
  choice: 照着耶和华所说的
  rationale: 该习语字面为“照耶和华的口”，表示命令源于耶和华的话；此译既自然，又保留言说和神圣授权的含义。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文读者熟悉的神名音译“耶和华”，明确呈现原文的专名，而非以称号替代。
- source_word: לֵאמֹר
  choice: 说
  rationale: 用于引出直接引语；中文以“说”衔接“吩咐”简洁自然。
- source_word: כֵּן
  choice: 对
  rationale: 此处肯定约瑟子孙支派所提出的话正确；“对”自然地表达其评价含义。
- source_word: מַטֵּה
  choice: 支派
  rationale: 在以色列宗族及土地分配语境中，מַטֶּה 指“支派”，而非其本义“杖”。
- source_word: בְנֵי יוֹסֵף
  choice: 约瑟子孙
  rationale: 保留原文的家族血缘表达，同时比逐字译作“约瑟的儿子们”更准确地指向其后裔。
- source_word: דֹּבְרִים
  choice: 说得对
  rationale: 分词字面表示“正在说”；与 כֵּן 合起来意为他们所说的是正确的。“说得对”兼顾动词形式和自然中文。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用四字神名。中文正文采用广为读者熟悉、具有神名功能的“耶和华”；“雅威”是更接近现代学界重构发音的另一音译，但原始确切发音并无完整元音证据。
- issue: 对约瑟支派陈述的肯定方式
  choice: 说得对
  alternative: 是对的
  rationale: 原文保留“说”（דבר）的言语动作，并用 כֵּן 肯定其正确性；“说得对”不把肯定扩展为对该支派整体立场或品格的判断。
translation_notes:
  register: 采用自然、庄重的现代标准普通话。“吩咐……说”保留希伯来叙事中引出直接引语的结构；以“以色列人”和“约瑟子孙”分别按各自语境传达 בנים 的民族与后裔含义。
