  rationale: 仅作必要的汉语表达修订：“我们的弟兄”避免“我们兄弟”的口语性歧义，并保留原文亲属称谓；“奉耶和华的命令”使受命关系更自然明确。其余措辞、神名、法律性“产业”、抽签方式和脚注均可保留。
