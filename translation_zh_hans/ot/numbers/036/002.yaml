  text: וַ/יֹּאמְר֗וּ אֶת אֲדֹנִ/י֙ צִוָּ֣ה יְהוָ֔ה לָ/תֵ֨ת אֶת הָ/אָ֧רֶץ בְּ/נַחֲלָ֛ה בְּ/גוֹרָ֖ל לִ/בְנֵ֣י יִשְׂרָאֵ֑ל וַֽ/אדֹנִ/י֙ צֻוָּ֣ה בַֽ/יהוָ֔ה לָ/תֵ֗ת אֶֽת נַחֲלַ֛ת צְלָפְחָ֥ד אָחִ֖י/נוּ לִ/בְנֹתָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/036/002.yaml
  text: And they said[a], “Yahweh commanded my lord to give the land as an inheritance by lot to the sons of Israel, and my lord was commanded by Yahweh to give the inheritance of Zelophehad our brother to his daughters.”
translation:
  language: zh_hans
  text: 他们说：“耶和华曾吩咐我主，要抽签把这地给以色列的子孙[a]作产业；我主又奉耶和华的命令，要把我们弟兄西罗非哈的产业给他的女儿们。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“以色列人”。希伯来文直译为“以色列之子”。
    reason: 说明该词组既有较直译的家族称谓，也可按群体意义表达。
lexical_decisions:
- source_word: אֲדֹנִי
  choice: 我主
  rationale: 这是宗族首领对摩西的尊称，并非对神的称号；“我主”保留了直接称呼中的敬意，也避免“主人”所带的仆役意味。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文读者熟悉的专名形式译出四字神名，不以一般称号代替。
- source_word: לָתֵת אֶת־הָאָרֶץ בְּנַחֲלָה
  choice: 把这地给……作产业
  rationale: 保留 נתן“给”和 נחלה“产业、承受之业”的法律及土地承继含义，同时符合现代汉语表达。
- source_word: בְּגוֹרָל
  choice: 抽签
  rationale: 表示分配土地所采用的方式；“抽签”比“拈阄”更符合现代标准汉语，同时准确传达 גורל。
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: 给以色列的子孙
  rationale: 保留希伯来文“以色列之子”的家族与圣约群体表达；中文“子孙”在此可统指整个以色列群体。
- source_word: צֻוָּה בַיהוָה
  choice: 蒙耶和华吩咐
  rationale: 以自然中文表达被动式所指的领受命令，并保留耶和华是命令来源这一点。
- source_word: נַחֲלַת צְלָפְחָד
  choice: 西罗非哈的产业
  rationale: 简明表达属于西罗非哈家系的承继份额，符合本段法律语境。
- source_word: אָחִינוּ
  choice: 我们兄弟
  rationale: 保留原文亲属称谓，不将其解释性改译为“族人”。
- source_word: לִבְנֹתָיו
  choice: 给他的女儿们
  rationale: 直接表达产业的领受者；复数“女儿们”对应原文复数形式。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文两次直接使用四字神名；正文采用现代中文圣经传统中最广为人知的专名“耶和华”，而不以“主”替代，从而保留神名与对摩西所用尊称“我主”的区别。
- issue: לִבְנֵי יִשְׂרָאֵל 的群体性别表达
  choice: 以色列的子孙
  alternative: 以色列人
  rationale: 原文直称“以色列之子”，在语境中指整个立约群体。“子孙”既保留血缘群体意象，也可在中文中统指后代，不必把范围限定为男性。
- issue: 摩西领受命令的被动表达
  choice: 我主也蒙耶和华吩咐
  alternative: 耶和华也吩咐了我主
  rationale: 保留 צֻוָּה 的被动视角，不把句法张力完全改写为主动句；同时清楚表明命令来自耶和华。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。保留“我主”作为对摩西的敬称；以“抽签”代替较古旧的“拈阄”，以“产业”维持土地承继的法律语域。脚注标记紧接其所说明的“以色列的子孙”。
