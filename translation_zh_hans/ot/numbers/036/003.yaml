  register: 采用现代、庄重而易懂的法律陈述语体。以“产业”统一翻译反复出现的 נחלה，突出世袭土地的概念；末句保留“拈阄”这一古代分地方式。未沿用英文所附脚注，因为该脚注标记位置与内容不相符，且中文正文已直接表达 גורל 的含义。
