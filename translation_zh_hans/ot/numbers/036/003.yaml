base_translation:
  language: en
  yaml_path: translation/ot/numbers/036/003.yaml
  text: And if they become wives to one of the sons of the tribes of the sons of Israel[a], then their inheritance will be taken away from the inheritance of our fathers and added to the inheritance of the tribe to which they belong, and it will be taken away from the allotted portion of our inheritance.
translation:
  language: zh_hans
  text: 如果她们嫁入以色列其他支派的人家，她们的产业就会从我们祖先的产业中划出，归入她们所嫁入的支派的产业；这样，我们拈阄分得的产业中也会被划出一部分。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָיוּ ... לְנָשִׁים
  choice: 如果她们嫁给
  rationale: 原文直译近于“她们成为妻子”；承接上下文的假设情形，用“如果……嫁给”符合现代汉语，并明确婚姻语境。
- source_word: לְאֶחָד מִבְּנֵי שִׁבְטֵי בְנֵי יִשְׂרָאֵל
  choice: 以色列其他支派中的人
  rationale: 字面为“以色列众支派的子孙中的一个”。本段忧虑的是女子嫁入别的支派；“其他”由上下文明确，译文保留支派归属这一重点，同时避免生硬的层叠属格。
- source_word: וְנִגְרְעָה נַחֲלָתָן
  choice: 她们的产业就会……扣除
  rationale: נחלה在分地语境中指承袭的土地产业；גרע的被动形式表示从原有份额中减去或扣除。
- source_word: מִנַּחֲלַת אֲבֹתֵינוּ
  choice: 从我们祖先的产业中
  rationale: אבות字面为“父辈”，此处指形成支派世袭产业的祖先；“祖先”在现代汉语中自然且准确。
- source_word: וְנוֹסַף עַל נַחֲלַת הַמַּטֶּה
  choice: 加到……支派的产业上
  rationale: 保留原文“扣除—加上”的法律与土地转移对照；מטה在此意为“支派”。
- source_word: אֲשֶׁר תִּהְיֶינָה לָהֶם
  choice: 她们所归属之
  rationale: 原文较为含混，字面近于“她们将成为他们的”；语境指婚后所归属的丈夫支派，译作“所归属之”简洁而不额外展开。
- source_word: וּמִגֹּרַל נַחֲלָתֵנוּ יִגָּרֵעַ
  choice: 我们拈阄所得的产业就会减少
  rationale: גורל本义为抽签所用的“阄”，在分地语境中也指由拈阄分得的份额；译文同时呈现分配方式和实际结果。
theological_decisions: []
