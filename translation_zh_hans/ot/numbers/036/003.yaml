  to: 如果她们嫁入以色列其他支派的人家，她们的产业就会从我们祖先的产业中划出，归入她们所嫁入的支派的产业；这样，我们拈阄分得的产业中也会被划出一部分。
  rationale: 修订明确婚后归属的支派，并以“划出，归入”对应原文产业从本支派减少、加到夫方支派的双向转移。末句保留按阄分配的概念，并用脚注说明“阄”的字面表达。
