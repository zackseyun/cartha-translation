  text: זֶ֣ה הַ/דָּבָ֞ר אֲשֶׁר צִוָּ֣ה יְהוָ֗ה לִ/בְנ֤וֹת צְלָפְחָד֙ לֵ/אמֹ֔ר לַ/טּ֥וֹב בְּ/עֵינֵי/הֶ֖ם תִּהְיֶ֣ינָה לְ/נָשִׁ֑ים אַ֗ךְ לְ/מִשְׁפַּ֛חַת מַטֵּ֥ה אֲבִי/הֶ֖ם תִּהְיֶ֥ינָה לְ/נָשִֽׁים־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/036/006.yaml
  text: This is the word that Yahweh has commanded concerning the daughters of Zelophehad[a], saying, ‘Let them become wives to whomever seems good in their eyes[b]; only they must become wives within the family of the tribe of their father.’
translation:
  language: zh_hans
  text: 这是耶和华论到西罗非哈的女儿们所吩咐的话：“她们可以嫁给自己看为好的人[a]；只是必须嫁给她们父亲所属支派的宗族内的人[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“嫁给在她们眼中为好的人。”也可译作“嫁给她们认为合适的人”。
    reason: 保留希伯来语习语，并说明其自然含义。
  - marker: b
    text: “父亲所属支派的宗族内”原文同时使用“宗族”和“支派”两个称谓，强调产业须留在父系支派范围内。
    reason: 说明原文的社会结构用语及这一限制的语境作用。
lexical_decisions:
- source_word: זֶה הַדָּבָר
  choice: 吩咐说
  rationale: 该短语直译为“这是……的话”，在此引出正式的神圣命令；结合后面的“吩咐”和“说”，汉语用“吩咐说”可自然表达其权威性，避免生硬重复。
- source_word: צִוָּה יְהוָה
  choice: 耶和华……吩咐
  rationale: צוה表示发出命令；以“吩咐”体现权威而保持现代汉语自然。יְהוָה音译为“耶和华”，明确保留神的专名。
- source_word: לִבְנוֹת צְלָפְחָד
  choice: 论到西罗非哈的女儿们
  rationale: 介词ל在此可标示命令所涉及的对象；“论到”既保留命令关乎她们的含义，也不强行限定为直接对她们说。
- source_word: לַטּוֹב בְּעֵינֵיהֶם
  choice: 自己看为好的人
  rationale: 保留希伯来语“在她们眼中为好”的判断意味，同时用现代汉语自然表达所指的婚配对象。
- source_word: תִּהְיֶינָה לְנָשִׁים
  choice: 嫁给
  rationale: 原文直义为“成为妻子”；在这一婚姻规定中，“嫁给”简洁自然，并准确表达实际行动。
- source_word: אַךְ
  choice: 只是
  rationale: אַךְ在此引出对前述自由的限制；“只是”清楚表达限定作用。
- source_word: לְמִשְׁפַּחַת מַטֵּה אֲבִיהֶם
  choice: 她们父亲支派宗族内的人
  rationale: מִשְׁפָּחָה与מַטֶּה分别涉及宗族和支派层级；译文同时保留二者，并用“内的人”补出隐含的婚配对象。
- source_word: תִּהְיֶינָה לְנָשִׁים（第二次）
  choice: 必须嫁给
  rationale: 重复出现的表达在אַךְ所引出的限制中具有规范和义务色彩；“必须”使这一约束在汉语中明确。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。中文采用广为人知且庄重的专名“耶和华”，而不以“主”替代，从而保留这是神专名的性质。
- issue: 婚姻选择自由与支派继承限制之间的张力
  choice: 保留“可以……只是必须……”的结构
  alternative: 概括为“只能嫁给本支派的人”
  rationale: 原文先承认女儿们可按自己所看为好的选择，随后加上宗族和支派范围的限制；译文不将二者压缩，以保留许可与约束并存的张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事法规语体。“可以……只是必须……”清楚呈现先许可、后限制的句法关系；专名依中文圣经传统译作“西罗非哈”和“耶和华”。
