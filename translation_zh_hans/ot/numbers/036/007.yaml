  text: וְ/לֹֽא תִסֹּ֤ב נַחֲלָה֙ לִ/בְנֵ֣י יִשְׂרָאֵ֔ל מִ/מַּטֶּ֖ה אֶל מַטֶּ֑ה כִּ֣י אִ֗ישׁ בְּ/נַחֲלַת֙ מַטֵּ֣ה אֲבֹתָ֔י/ו יִדְבְּק֖וּ בְּנֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/036/007.yaml
  text: So no inheritance of the sons of Israel shall pass from tribe to tribe[a], for the sons of Israel shall each hold fast to the inheritance of the tribe of his fathers.
translation:
  language: zh_hans
  text: 这样，以色列人的产业不可从一个支派转到另一个支派；因为以色列人各人都要紧守自己父系所属支派的产业。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תִסֹּב
  choice: 转到
  rationale: 此处不是指物体转向，而是指产业改变所属支派；“转到”自然地表达这种归属转移。
- source_word: נַחֲלָה
  choice: 产业
  rationale: 在民数记的分地与继承法规中，该词指按支派承受的土地产业；“产业”兼顾土地、继承和家族承受的含义。
- source_word: מִמַּטֶּה אֶל מַטֶּה
  choice: 从一个支派转到另一个支派
  rationale: מַטֶּה 在此明确指“支派”；展开表达可清楚呈现产业在不同支派之间转移的禁令。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 这是现代汉语中对该群体称谓自然、准确且庄重的表达；无需机械译作“以色列的众子”。
- source_word: כִּי
  choice: 因为
  rationale: 引出前述禁令的理由，符合此处法律论述的逻辑关系。
- source_word: אִישׁ
  choice: 都
  rationale: 与复数主语配合，表达希伯来语的逐一分配义，即各人均负有这一义务。
- source_word: יִדְבְּקוּ
  choice: 守住
  rationale: דבק 表示牢牢依附、不离开；在土地产业的法律语境中，“守住”比字面的“粘附”更自然，并保留不得脱离本支派产业的力度。
- source_word: בְּנַחֲלַת מַטֵּה אֲבֹתָיו
  choice: 自己父系支派的产业
  rationale: 该短语指父辈所属支派的世袭产业。“父系支派”明确保留古代以色列按父系确定支派归属的含义。
theological_decisions:
- issue: 群体法律陈述中的男性及父系谱系用语
  choice: 以色列人都要守住自己父系支派的产业
  alternative: 以色列的众子各人都要紧守他列祖支派的产业
  rationale: 保留“父系支派”以呈现原文的父系谱系结构，同时用现代汉语自然的“以色列人”和“都”表达群体及逐一义，避免把语法阳性生硬复制成不自然的汉语。
translation_notes:
  register: 采用现代、庄重而易懂的法律叙事语体。“这样”承接上文命令所产生的结果；分号保留禁令与其理由之间的紧密关系。
