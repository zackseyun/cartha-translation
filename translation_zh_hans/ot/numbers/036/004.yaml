base_translation:
  language: en
  yaml_path: translation/ot/numbers/036/004.yaml
  text: And when the Jubilee comes for the sons of Israel[a], their inheritance will be added to the inheritance of the tribe to which they belong, and their inheritance will be taken away from the inheritance of the tribe of our fathers.
translation:
  language: zh_hans
  text: 到了以色列人的禧年[a]，她们的产业就会加到她们将归属的支派的产业中；这样，她们的产业就会从我们祖先所属支派的产业中减去。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “以色列人的禧年”也可译作“以色列子孙的禧年”。希伯来语字面为“给（或为）以色列众子的禧年”。
    reason: 保留לִבְנֵי יִשְׂרָאֵל的亲族表达及介词关系，同时正文采用自然的现代汉语群体称谓。
lexical_decisions:
- source_word: וְאִם
  choice: 到了
  rationale: 该组合本可表示“如果”，但在这里所说的是法律论证中预期会来到的禧年；“到了”自然表达这一时间条件，同时不把它说成纯粹假设。
- source_word: יִהְיֶה הַיֹּבֵל
  choice: 禧年
  rationale: יוֹבֵל在摩西律法的历法与土地制度语境中通常译作“禧年”；与“到了”连用，自然表达该时期的来临。
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: 以色列人的
  rationale: 字面为“以色列众子”，在此指以色列全体成员；“以色列人”是现代汉语中自然且准确的群体称谓，并以脚注保留字面表达。
- source_word: וְנוֹסְפָה
  choice: 就会加到
  rationale: Nifal形态在此表达产业被并入另一支派产业的结果；“加到……中”清楚呈现土地归属的转移。
- source_word: נַחֲלָתָן
  choice: 她们的产业
  rationale: נחלה在本段指世代承受的土地产业；阴性复数后缀回指西罗非哈的女儿们，因此译作“她们的产业”。
- source_word: עַל נַחֲלַת הַמַּטֶּה
  choice: 加到……支派的产业中
  rationale: 介词עַל与“增加”连用表示并入或加在另一份产业之上；现代汉语用“加到……中”更自然。
- source_word: אֲשֶׁר תִּהְיֶינָה לָהֶם
  choice: 她们所属支派的
  rationale: 该从句按语境指她们因婚姻而归属的支派；此译避免生硬直译，也不额外明说经文在本句未重复的婚姻关系。
- source_word: וּמִנַּחֲלַת מַטֵּה אֲבֹתֵינוּ
  choice: 从我们祖先支派的产业中
  rationale: 保留说话者所强调的本族祖传支派产业；“祖先”在现代汉语中比字面的“父亲们”更自然，也涵盖宗族先祖之意。
- source_word: יִגָּרַע
  choice: 减去
  rationale: 该动词表示减少、扣除；在土地份额从一个支派转入另一支派的语境中，“减去”简洁准确，并与前面的“加到”形成对照。
