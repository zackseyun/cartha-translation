base_translation:
  language: en
  yaml_path: translation/ot/numbers/036/013.yaml
  text: These are the commandments and the judgments that Yahweh commanded through Moses to the sons of Israel in the plains of Moab by the Jordan at Jericho[a][b].
translation:
  language: zh_hans
  text: 这些是雅威在摩押平原、耶利哥对面的约旦河边，借着摩西吩咐以色列子孙的诫命和典章。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵלֶּה
  choice: 这些是
  rationale: 这是复数指示语，用于引出全书结尾的总结性陈述；现代汉语补出“是”，句意完整自然。
- source_word: הַמִּצְוֺת
  choice: 诫命
  rationale: מִצְוָה指具有权威性的命令；“诫命”保留法律与圣约语境中的正式色彩。
- source_word: וְהַמִּשְׁפָּטִים
  choice: 和典章
  rationale: מִשְׁפָּטִים在法律语境中可指判例、条例或法规；“典章”与“诫命”搭配自然，并保留正式的法律语体。
- source_word: צִוָּה
  choice: 吩咐
  rationale: 表达权威性命令，并与受词“诫命和典章”搭配成自然、庄重的现代汉语。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来语四字神名的常见汉语音译处理，保留其作为以色列之上帝专名的性质，而不以称号代替。
- source_word: בְּיַד מֹשֶׁה
  choice: 借着摩西
  rationale: 原文直译为“借摩西的手”，是表达媒介或代理的希伯来语习语；“借着摩西”清楚保留摩西作为传达者的角色。
- source_word: אֶל בְּנֵי יִשְׂרָאֵל
  choice: 吩咐以色列子孙
  rationale: 保留בְּנֵי יִשְׂרָאֵל“以色列子孙”的圣约群体称谓；在汉语中，此处“吩咐”可直接带受事对象。
- source_word: בְּעַרְבֹת מוֹאָב
  choice: 在摩押平原
  rationale: עַרְבֹת指平原或草原地带；“摩押平原”是清楚且惯用的地理名称。
- source_word: עַל יַרְדֵּן יְרֵחוֹ
  choice: 约旦河边、耶利哥对面
  rationale: עַל在此表示临近约旦河的位置；“耶利哥对面”明确呈现摩押平原位于约旦河东岸、隔河与耶利哥相对的地理关系，同时以脚注保留短语结构的另一种理解。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名。译作“雅威”以音译方式呈现其专名性质；“耶和华”是汉语传统中广为人知的另一音译，但较不贴近通常重构的读音。
- issue: בְּנֵי יִשְׂרָאֵל所指的群体范围
  choice: 以色列子孙
  alternative: 以色列人
  rationale: 保留原文“子孙”的家族—圣约表达，但不把它限制为男性；脚注说明其在这里统指以色列全体。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。保留“诫命和典章”的法律性并列结构及“以色列子孙”的圣约称谓；将“借摩西的手”按汉语习惯译为“借着摩西”。
