translation_notes:
  register: 采用现代、庄重且易懂的叙事语体。用破折号嵌入谱系说明，使较长的希伯来语句法在汉语中保持清晰；“宗族”与“父家”分别呈现 מִשְׁפָּחָה 和 אָבוֹת 的不同亲属层级。所有脚注标记均置于其实际解释的词语之后。
