  text: וַֽ/יִּקְרְב֞וּ רָאשֵׁ֣י הָֽ/אָב֗וֹת לְ/מִשְׁפַּ֤חַת בְּנֵֽי גִלְעָד֙ בֶּן מָכִ֣יר בֶּן מְנַשֶּׁ֔ה מִֽ/מִּשְׁפְּחֹ֖ת בְּנֵ֣י יוֹסֵ֑ף וַֽ/יְדַבְּר֞וּ לִ/פְנֵ֤י מֹשֶׁה֙ וְ/לִ/פְנֵ֣י הַ/נְּשִׂאִ֔ים רָאשֵׁ֥י אָב֖וֹת לִ/בְנֵ֥י יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/036/001.yaml
  text: Then the heads of the fathers’ houses of the clan of the sons of Gilead son of Machir[a], son of Manasseh, from the clans of the sons of Joseph, came near and spoke before Moses and before the leaders[b], the heads of the fathers’ houses of the sons of Israel.
translation:
  language: zh_hans
  text: 约瑟子孙各宗族中，玛拿西的儿子玛吉的儿子基列之子孙所属宗族的父家首领[a]，来到摩西和以色列子孙[b]各父家的首领面前，陈说。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “父家首领”也可译作“各父系家族的首领”。这里指以色列宗族结构中各亲属家系公认的领导者。
    reason: lexical_alternative
  - marker: b
    text: “以色列子孙”是希伯来文的正式表达，也可译作“以色列人”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרְבוּ
  choice: 前来
  rationale: 该动词在此表示为正式陈述案件而走近权威人物；“前来”既自然，也保留了接近、进前的动作含义。
- source_word: רָאשֵׁי הָאָבוֹת
  choice: 父家首领
  rationale: “父家”是以色列宗族结构中的亲属单位，“首领”表明这些人是其公认的领导者；比笼统的“家长”或“族长”更能区分 אָבוֹת 与 מִשְׁפָּחָה。
- source_word: לְמִשְׁפַּחַת בְּנֵי גִלְעָד
  choice: 基列子孙宗族的
  rationale: 介词 לְ 在此表示归属关系；译文保留“宗族”这一层级及“基列子孙”的谱系表达。
- source_word: בֶּן מָכִיר בֶּן מְנַשֶּׁה
  choice: 基列是玛吉的儿子，玛吉是玛拿西的儿子
  rationale: 用现代汉语清楚展开连续的“……之子”，不把第二个 בֶּן 误解为基列直接是玛拿西的儿子。
- source_word: מִמִּשְׁפְּחֹת בְּנֵי יוֹסֵף
  choice: 约瑟子孙各宗族中
  rationale: מִן 表示这些首领出自约瑟后裔更大的宗族群体；“……中”自然表达这一所属范围。
- source_word: וַיְדַבְּרוּ
  choice: 陈说
  rationale: 基本义是“说”；结合他们在摩西和众首领面前正式提出案件的语境，“陈说”用现代而庄重的措辞体现正式场合，又不预先概括其发言内容。
- source_word: הַנְּשִׂאִים
  choice: 众领袖
  rationale: 该词指以色列群体中具有代表和治理身份的首领；“众领袖”清楚、庄重，并避免限定为现代政治官职。
- source_word: רָאשֵׁי אָבוֹת לִבְנֵי יִשְׂרָאֵל
  choice: 以色列子孙各父家的首领
  rationale: 作为同位语说明“众领袖”的身份；保留“以色列子孙”这一正式谱系称谓，也保留“父家”的社会结构。
