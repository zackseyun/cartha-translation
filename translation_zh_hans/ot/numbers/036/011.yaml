base_translation:
  language: en
  yaml_path: translation/ot/numbers/036/011.yaml
  text: Mahlah[a], Tirzah, Hoglah, Milcah, and Noah, the daughters of Zelophehad, became wives of the sons of their uncles.
translation:
  language: zh_hans
  text: 西罗非哈的女儿玛拉、得撒、曷拉、密迦和挪阿，都嫁给了她们叔伯的儿子[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 即：她们父亲的兄弟的儿子。
    reason: 说明“她们叔伯的儿子”在本节父系宗族语境中的具体亲属关系。
lexical_decisions:
- source_word: וַתִּהְיֶינָה
  choice: 都嫁给了
  rationale: 该形式在这里叙述婚姻关系的形成。现代汉语用“嫁给了”自然表达从未婚到成为妻子的转变，并与句末 לְנָשִׁים 的婚姻用语合译。
- source_word: בְּנוֹת צְלָפְחָד
  choice: 西罗非哈的女儿
  rationale: 按家谱语境直译，明确这几位女子是西罗非哈的女儿；汉语在列举多人姓名后仍可用集合意义的“女儿”。
- source_word: לִבְנֵי דֹדֵיהֶן
  choice: 给了她们叔伯的儿子
  rationale: לִבְנֵי 表示婚配对象；דֹדֵיהֶן 在本段父系宗族与产业承继的语境中指她们父亲的兄弟。用“叔伯”同时涵盖父亲的弟弟和哥哥，比单用“叔父”准确。
- source_word: לְנָשִׁים
  choice: 嫁给了
  rationale: 这是常见婚姻表达，字面为“作妻子”。与前面的 היה 合译为“嫁给了”，符合现代汉语习惯且完整保留婚姻含义。
- source_word: מַחְלָה תִרְצָה וְחָגְלָה וּמִלְכָּה וְנֹעָה
  choice: 玛拉、得撒、曷拉、密迦和挪阿
  rationale: 采用现代中文圣经中通行的人名译法，并保持希伯来文本的排列次序。
