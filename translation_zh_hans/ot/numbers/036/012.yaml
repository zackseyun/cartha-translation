  text: מִֽ/מִּשְׁפְּחֹ֛ת בְּנֵֽי מְנַשֶּׁ֥ה בֶן יוֹסֵ֖ף הָי֣וּ לְ/נָשִׁ֑ים וַ/תְּהִי֙ נַחֲלָתָ֔/ן עַל מַטֵּ֖ה מִשְׁפַּ֥חַת אֲבִי/הֶֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/036/012.yaml
  text: They became wives to the clans of the sons of Manasseh son of Joseph[a], and their inheritance remained with the tribe of the clan of their father.
translation:
  language: zh_hans
  text: 她们嫁给了约瑟之子玛拿西各宗族中的人[a]；她们的产业仍归在父亲宗族所属的支派中。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “嫁给了……各宗族中的人”直译为“从……各宗族中作了妻子”，意思是她们的丈夫出自这些宗族。
    reason: 说明希伯来文介词所表达的来源或范围，并避免误解为她们嫁给了抽象的“宗族”。
lexical_decisions:
- source_word: מִמִּשְׁפְּחֹת
  choice: 各宗族中的人
  rationale: 介词 מִן 表示来源或范围，即她们的丈夫出自玛拿西子孙的各宗族。“宗族”比泛称的“家庭”更能体现以色列支派内部的亲族结构。
- source_word: בְּנֵי מְנַשֶּׁה בֶן יוֹסֵף
  choice: 约瑟之子玛拿西
  rationale: 保留原文的谱系表达；结合“各宗族中的人”，已自然表达这里所指的是玛拿西的子孙。
- source_word: הָיוּ לְנָשִׁים
  choice: 她们嫁给了
  rationale: 原文直译为“她们作了妻子”。现代汉语用“嫁给了”自然清楚，并保留这些女子作为语法主体。
- source_word: נַחֲלָתָן
  choice: 她们的产业
  rationale: 在本段律法和土地分配的语境中，נַחֲלָה 指承受而来的土地产业；“产业”比单说“遗产”更能体现土地归属。
- source_word: וַתְּהִי
  choice: 仍归在
  rationale: 动词本义为“是、成为”，但上下文强调婚后产业没有转到别的支派，因此译作“仍归在”准确传达语境中的持续归属。
- source_word: עַל מַטֵּה מִשְׁפַּחַת אֲבִיהֶן
  choice: 归在父亲宗族所属的支派中
  rationale: מַטֶּה 在此指支派，עַל 表示产业与该支派的归属关系。此译法以自然汉语呈现原文中“支派—宗族—父亲”的层级关系。
theological_decisions: []
