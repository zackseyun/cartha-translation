source:
  edition: WLC
  text: וְ/לֹֽא תִסֹּ֧ב נַחֲלָ֛ה מִ/מַּטֶּ֖ה לְ/מַטֶּ֣ה אַחֵ֑ר כִּי אִישׁ֙ בְּ/נַ֣חֲלָת֔/וֹ יִדְבְּק֕וּ מַטּ֖וֹת בְּנֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/036/009.yaml
  text: No inheritance shall pass from one tribe to another tribe[a], for each of the tribes of the sons of Israel shall hold fast to its own inheritance.
translation:
  language: zh_hans
  text: 产业不可从一个支派转到另一个支派，因为以色列子孙的各支派[a]都要守住自己的产业。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“以色列人的各支派”。希伯来文直译为“以色列子孙的各支派”。
    reason: 说明固定群体称谓 בְּנֵי יִשְׂרָאֵל 的直译形式及自然中文替代译法。
lexical_decisions:
- source_word: תִסֹּב
  choice: 转到
  rationale: 本动词在此不是指物理上的转身，而是指产业因婚姻继承而改变所属支派；“转到”自然保留这种归属转移的法律含义。
- source_word: נַחֲלָה
  choice: 产业
  rationale: 本章所指是分配给各支派、由家族承继的土地；“产业”既包含土地继承的背景，也符合现代中文圣经法律语境。
- source_word: מִמַּטֶּה ... לְמַטֶּה אַחֵר
  choice: 从一个支派转到另一个支派
  rationale: מַטֶּה 在此指以色列的支派，不取其字面义“杖”；这一译法清楚表达产业不得改变支派归属。
- source_word: כִּי
  choice: 因为
  rationale: כִּי 引出前述禁令的理由，译作“因为”准确而自然。
- source_word: אִישׁ ... יִדְבְּקוּ
  choice: 各支派都要守住
  rationale: אִישׁ 在这里具有逐一分配的作用，与复数主语“支派”及复数动词呼应；“各……都”自然呈现这一结构。
- source_word: בְּנַחֲלָתוֹ
  choice: 自己的产业
  rationale: 单数所有格与分配性的 אִישׁ 相应，表示各支派各自所得的产业；中文用“自己的”无需强加性别。
- source_word: יִדְבְּקוּ
  choice: 守住
  rationale: דבק 的基本意象是紧贴、持守；在土地归属的法律语境中，“守住”既自然，又保留不放弃、不脱离本支派产业的含义。
- source_word: מַטּוֹת בְּנֵי יִשְׂרָאֵל
  choice: 以色列子孙的各支派
  rationale: 保留 בְּנֵי יִשְׂרָאֵל 的传统亲属表达“以色列子孙”，同时用“各支派”呈现复数及分配意义。
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל 的性别化盟约称谓
  choice: 以色列子孙
  alternative: 以色列人
  rationale: 原文采用字面为“以色列的儿子们”的固定群体称谓；正文用传统而自然的“以色列子孙”保留其形式，同时脚注说明可按整体民族称谓译作“以色列人”，不将其限定为男性。
- issue: 支派与产业之间的分配关系
  choice: 各支派都要守住自己的产业
  alternative: 以色列子孙的支派各要紧守其产业
  rationale: 原文以 אִישׁ 和单数所有格表达“各自”，却以复数动词配合“支派”；中文用“各……都……自己的”保留分配关系，并避免不自然地把支派人格化为“他”。
translation_notes:
  register: 采用庄重而易懂的现代标准普通话。“产业”“支派”保留本段法律与盟约语境；句式简洁，保持原文禁令与理由之间的逻辑关系。
