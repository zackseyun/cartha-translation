  text: כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶׁ֑ה כֵּ֥ן עָשׂ֖וּ בְּנ֥וֹת צְלָפְחָֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/036/010.yaml
  text: Just as Yahweh had commanded Moses[a], so the daughters of Zelophehad did.
translation:
  language: zh_hans
  text: 耶和华怎样吩咐摩西，西罗非哈的女儿们就怎样做了。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כַּאֲשֶׁר ... כֵּן
  choice: 怎样……就怎样
  rationale: 这一组关联词表达命令与行动之间的对应关系；中文“怎样……就怎样”自然清楚，也保留了严格照命而行的语气。
- source_word: צִוָּה
  choice: 吩咐
  rationale: 此处表示向摩西下达命令；“吩咐”符合现代中文圣经叙事的庄重语体。希伯来语完成式在上下文中表明命令先于行动，中文通常无须另加时态标记。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文读者熟悉的神名传统音译“耶和华”，而不以称号“主”替代原文专名。
- source_word: אֶת מֹשֶׁה
  choice: 摩西
  rationale: אֶת标示“摩西”为צִוָּה的直接宾语；中文自然表达为“吩咐摩西”。
- source_word: עָשׂוּ
  choice: 做了
  rationale: 保留动词“做、行”的简明意义，并以“了”表明行动已经完成。
- source_word: בְּנוֹת צְלָפְחָד
  choice: 西罗非哈的女儿们
  rationale: 直接表达希伯来语属格结构，并用“们”明确这里所指的是多位女儿。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用四字神名而非“主”这一称号。中文采用广为人知的专名音译“耶和华”，既保留其专名性质，也避免改译为称号；“雅威”是更接近学术重构发音的可行替代。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。以“怎样……就怎样”再现כַּאֲשֶׁר…כֵּן的对应结构，不另设脚注，因为正文已直接而充分地体现原文。
