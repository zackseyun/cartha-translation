  yaml_path: translation/ot/numbers/025/012.yaml
  text: Therefore say, ‘Look, I am giving him my covenant of peace.’
translation:
  language: zh_hans
  text: 因此你要说：‘看哪，我把我的平安之约赐给他。’
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לָכֵן
  choice: 所以
  rationale: 自然表达由前文行动引出的结论，保留因果承接。
- source_word: הִנְנִי
  choice: 看，我要
  rationale: “看”保留原文引人注意的语气；与后面的分词连用，表达上帝郑重宣告即将施行的行动。
- source_word: נֹתֵן לוֹ
  choice: 把……赐给他
  rationale: 在上帝赐约的语境中，“赐给”比一般的“给”更庄重自然，同时不增加额外神学含义。
- source_word: בְּרִיתִי שָׁלוֹם
  choice: 我的平安之约
  rationale: 将“我的约”与“平安”之间紧密而略有压缩的希伯来语关系译作常见的“平安之约”，既自然又保留“约”由上帝设立并属于他的含义。
theological_decisions:
- issue: “平安”与“约”的句法关系
  choice: 我的平安之约
  alternative: 我的约，就是平安
  rationale: 原文 אֶת־בְּרִיתִי שָׁלוֹם 可理解为“我的平安之约”，也可能带有同位说明的意味。正文采用自然且传统的定中结构，但不把“平安”扩展解释为特定教义概念。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“看”直接保留 הִנְנִי 的强调功能；整句保持神谕宣告的简洁力度。
