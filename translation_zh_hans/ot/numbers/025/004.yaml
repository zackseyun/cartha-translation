  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁ֗ה קַ֚ח אֶת כָּל רָאשֵׁ֣י הָ/עָ֔ם וְ/הוֹקַ֥ע אוֹתָ֛/ם לַ/יהוָ֖ה נֶ֣גֶד הַ/שָּׁ֑מֶשׁ וְ/יָשֹׁ֛ב חֲר֥וֹן אַף יְהוָ֖ה מִ/יִּשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/025/004.yaml
  text: And Yahweh said to Moses[a], “Take all the leaders of the people and impale them for Yahweh in broad daylight[b], so that the burning anger of Yahweh may turn away from Israel.”
translation:
  language: zh_hans
  text: 耶和华对摩西说[a]：“把百姓所有的首领带来，为耶和华把他们示众处死，就在光天化日之下[b]，好使耶和华的烈怒离开以色列。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“召集百姓所有的首领，让他们在光天化日之下，在耶和华面前处死有罪的人。”希伯来文的“他们”按句法最直接指首领，但也有人理解为首领奉命执行刑罚。
    reason: 保留代词所指及句法结构的另一种可能解释。
  - marker: b
    text: 直译：“在太阳面前。”
    reason: 说明希伯来语原有的形象表达。
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的专名“耶和华”对应四字神名，保留其作为以色列之上帝专名的功能，而不以称号替代。
- source_word: קַח
  choice: 带来
  rationale: 命令式 לקח 表示摩西要将有关人员带出或召集来；中文“带来”比孤立的“拿”更适用于人的宾语。
- source_word: כָּל רָאשֵׁי הָעָם
  choice: 百姓所有的首领
  rationale: רָאשֵׁי 字面为“头”，在此指群体领袖；译作“首领”自然清楚，也保留其领导身份。
- source_word: וְהוֹקַע אֹתָם
  choice: 把他们示众处死
  rationale: יקע 的 Hiphil 形式指公开施行严厉刑罚，并可能包含悬挂、刺穿或陈尸示众；“示众处死”保留公开惩罚的核心意义，同时避免在动作方式不完全确定时过度限定为“刺死”。代词“他们”在正文中按最直接句法指向首领。
- source_word: לַיהוָה
  choice: 为耶和华
  rationale: 介词 ל 在此表达归属、目的或为上帝施行刑罚；“为耶和华”比“在耶和华面前”更直接反映该介词。
- source_word: נֶגֶד הַשָּׁמֶשׁ
  choice: 就在光天化日之下
  rationale: 字面为“在太阳面前”，语境强调公开、白昼可见；中文成语“光天化日之下”自然传达这一含义。
- source_word: חֲרוֹן אַף יְהוָה
  choice: 耶和华的烈怒
  rationale: 该希伯来语惯用语描写怒气炽烈；“烈怒”简洁、庄重，并保留强烈程度。
- source_word: וְיָשֹׁב ... מִיִּשְׂרָאֵל
  choice: 好使……离开以色列
  rationale: 命令之后的 וְיָשֹׁב 表目的或预期结果，מן 表分离；“好使……离开”符合现代汉语表达。
theological_decisions:
- issue: “把他们示众处死”中代词“他们”的所指
  choice: 正文依最直接句法，将“他们”理解为百姓的首领。
  alternative: 也可理解为：首领是执刑者，应由他们把有罪的人在耶和华面前公开处死。
  rationale: אֹתָם 最自然地回指最近的复数先行词“百姓所有的首领”；但下一节由审判官杀死归附巴力毗珥的人，使“首领为执行刑罚者”的解释也具有上下文依据。因此正文保留直接句法，脚注注明另一种理解，不消除经文本身的张力。
- issue: יקע 所指的处刑方式
  choice: 译为“示众处死”，强调公开执行死刑。
  alternative: 可具体译为“刺死示众”“悬挂起来”或“陈尸示众”。
  rationale: 该动词明确包含严厉、公开展示的惩罚，但具体是刺穿、悬挂活人，还是处死后陈尸，并非毫无争议；正文不作超出词义证据的限定。
translation_notes:
  register: 采用庄重而通顺的现代标准普通话。“示众处死”既传达公开刑罚，也避免把有争议的具体处刑方式定死；脚注保留“首领是受刑者”与“首领是执刑者”之间真实的释义张力。
