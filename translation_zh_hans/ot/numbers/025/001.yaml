  text: וַ/יֵּ֥שֶׁב יִשְׂרָאֵ֖ל בַּ/שִּׁטִּ֑ים וַ/יָּ֣חֶל הָ/עָ֔ם לִ/זְנ֖וֹת אֶל בְּנ֥וֹת מוֹאָֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/025/001.yaml
  text: While Israel was staying at Shittim[a], the people began to prostitute themselves with the daughters of Moab.
translation:
  language: zh_hans
  text: 以色列住在什亭的时候，百姓开始与摩押的女子行淫。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “行淫”也可译作“发生淫乱关系”；希伯来文直译近于“作娼妓”。
    reason: 说明זנה的语义范围及原文鲜明的卖淫意象。
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: 住在
  rationale: ישׁב可表示居住、停留。此处叙述以色列在什亭驻留，“住在”自然简洁，也不必然表示永久定居。
- source_word: בַּשִּׁטִּים
  choice: 在什亭
  rationale: שִׁטִּים是地名，按常见中文圣经音译作“什亭”；介词ב在此表示所在地。
- source_word: וַיָּחֶל
  choice: 开始
  rationale: 此处该动词按惯用结构表示某一行动的开始，译作“开始”准确自然。
- source_word: הָעָם
  choice: 百姓
  rationale: 这里指作为群体的以色列民；“百姓”符合现代中文经文语体。
- source_word: לִזְנוֹת
  choice: 行淫
  rationale: זנה直接指不正当性行为，并带有卖淫、淫乱的强烈色彩。“行淫”保留其道德力度，比泛化为“犯罪”或仅说“不忠”更贴近原文。
- source_word: אֶל
  choice: 与
  rationale: אֶל本义为“向、到”，但与זנה及人物宾语连用时表示同某人发生淫乱关系，中文宜译作“与”。
- source_word: בְּנוֹת מוֹאָב
  choice: 摩押的女子
  rationale: 字面为“摩押的女儿们”。现代中文用“摩押的女子”既保留族属关系，也比“摩押的女儿们”更自然，并避免误解为某个人的亲生女儿。
theological_decisions:
- issue: 本节开头所述罪行的性质
  choice: 明确译为“与摩押的女子行淫”
  alternative: “与摩押的女子发生淫乱关系”或较直译的“同摩押的女子作娼妓”
  rationale: 原文זנה明确涉及淫乱，并具有卖淫意象。正文用自然而有力度的“行淫”，不将罪行淡化为抽象的“不道德”，也不在本节中额外加入后文才展开的偶像崇拜解释。
translation_notes:
  register: 采用庄重、简明的现代标准汉语。“以色列”按原文作集合名词，后以“百姓”承接；地名采用通行音译“什亭”。正文保留原文对性罪的直接措辞，脚注说明更直译的卖淫意象。
