base_translation:
  language: en
  yaml_path: translation/ot/numbers/025/016.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: zh_hans
  text: 雅威[a]对摩西说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文为四字神名 YHWH（יהוה），本译作“雅威”。中文传统多译作“耶和华”；许多译本依犹太诵读传统译作“主”。
    reason: 说明神名原文及主要译法。
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: 说
  rationale: 该词在叙事中引出新的发言事件；现代汉语用“说”自然、庄重，也符合常见的神谕引言格式。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 这是希伯来文四字神名，正文采用现代中文读者熟悉的专名音译“耶和华”，不以“主”这一称号替代。
- source_word: אֶל־מֹשֶׁה
  choice: 对摩西
  rationale: 介词 אֶל 标明说话的对象；“对摩西”是自然准确的现代汉语表达。
- source_word: לֵאמֹר
  choice: 说：
  rationale: 该不定式在这里是引出下文直接话语的固定格式。汉语以“说：”及冒号自然表达，无须机械重复为“说着说”。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威；主
  rationale: 原文直接使用神的专名，而非“主”这一称号，因此正文保留专名。“耶和华”是中文传统中最通行的形式；“雅威”是依据学界常见拟音的另一译法，列于脚注以保留相关信息。
translation_notes:
  register: 采用自然、简洁而庄重的现代标准汉语。以冒号承接下一节的直接引语，既传达 לֵאמֹר 的功能，也避免不自然的逐词复现。
