base_translation:
  language: en
  yaml_path: translation/ot/numbers/025/013.yaml
  text: It shall be for him and for his offspring after him a covenant of a perpetual priesthood[c][b][a], because he was jealous for his God and made atonement for the sons of Israel.
translation:
  language: zh_hans
  text: 这约要归给他和他以后的后裔，作为永远的祭司职分之约[b]，因为他为自己的上帝大发热心[a]，并为以色列子孙[c]赎罪。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“为自己的上帝心怀嫉愤。”希伯来语动词可指为维护盟约关系而有的嫉愤或热心。
    reason: lexical_alternative
  - marker: b
    text: 或译：“永久的祭司职分之约。”
    reason: alternative_reading
  - marker: c
    text: “以色列子孙”是希伯来语传统的民族称谓，这里指以色列全体人民。
    reason: cultural_note
lexical_decisions:
- source_word: וְהָיְתָה
  choice: 这约要归给
  rationale: 阴性单数动词与后文的“约”相应；中文将“约”明说，并以“归给”自然表达其授予性质。
- source_word: לּוֹ וּלְזַרְעוֹ אַחֲרָיו
  choice: 他和他以后的后裔
  rationale: “后裔”保留זֶרַע的集合单数含义，“他以后的”则体现代际承续。
- source_word: בְּרִית כְּהֻנַּת עוֹלָם
  choice: 这约……使他们永远担任祭司
  rationale: 将希伯来语结构短语按自然中文展开，表达此约所授予的是延续不止的祭司职分，同时不把עוֹלָם过度哲学化为抽象的绝对永恒。
- source_word: תַּחַת אֲשֶׁר
  choice: 因为
  rationale: 本处引出赐约的依据，译作“因为”简洁准确。
- source_word: קִנֵּא לֵאלֹהָיו
  choice: 为自己的上帝大发热忱
  rationale: קנא兼有热忱与盟约性嫉愤的语义；正文采用现代中文较自然的“大发热忱”，并在脚注保留“发了嫉愤”。
- source_word: וַיְכַפֵּר
  choice: 赎了罪
  rationale: 这是祭司语境中כפר的通行而易懂的中文表达，表示为百姓成就赎罪。
- source_word: עַל בְּנֵי יִשְׂרָאֵל
  choice: 为以色列子孙
  rationale: 保留传统民族称谓“以色列子孙”，并由脚注说明其所指为以色列全体人民。
theological_decisions:
- issue: 非尼哈行动中קנא的含义
  choice: 为自己的上帝大发热忱
  alternative: 为自己的上帝发了嫉愤
  rationale: 希伯来词既可突出维护上帝尊荣的热忱，也可突出盟约排他性所引发的嫉愤；正文采用较自然的中文，脚注保留另一层真实语义。
- issue: 祭司职分应许中עוֹלָם的力度
  choice: 永远担任祭司
  alternative: 永久担任祭司；得着永恒的祭司职分
  rationale: “永远”自然表达制度和世代延续的持久性，又不强行把该词限定为抽象形而上的无限永恒。
- issue: בְּנֵי יִשְׂרָאֵל的性别及民族称谓
  choice: 以色列子孙
  alternative: 以色列人；以色列百姓
  rationale: 正文保留希伯来传统称谓及其家族承续意象，脚注说明此处泛指以色列全体人民。
translation_notes:
  register: 采用庄重而易懂的现代标准普通话。“大发热忱”避免现代读者把“嫉妒”只理解为羡慕，同时通过脚注保留原词的盟约性嫉愤。“这约要归给”凸显神所赐之约，但不补入原文未明说的第一人称主语。
