  text: 耶和华对摩西说：
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: 说
  rationale: 叙事性未完成式承接前文并推进叙事；现代汉语用“说”自然表达 דבר 的言说动作，无须机械译出连接词。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经传统中最通行的专名形式呈现四字神名，既区别于“主”这一称号，也便于普通读者识别。
- source_word: אֶל־מֹשֶׁה
  choice: 对摩西
  rationale: 介词 אֶל 标明说话所指向的对象；“对摩西”是自然准确的现代汉语表达。
- source_word: לֵאמֹר
  choice: 说：
  rationale: 该不定式是引出后续直接引语的固定公式；中文以“说：”简洁传达其篇章功能，避免重复成“说……说道”。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威；上主
  rationale: 原文直接使用四字神名。正文采用中文读者最熟悉、且作为专名而非称号的“耶和华”；“雅威”较接近学界常见的推定读音，但并非确定无疑，因此不将该推定读音绝对化。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。“耶和华对摩西说”承接前文叙事，并以冒号提示下一节是讲话内容。
