  text: וְ/שֵׁם֩ אִ֨ישׁ יִשְׂרָאֵ֜ל הַ/מֻּכֶּ֗ה אֲשֶׁ֤ר הֻכָּה֙ אֶת הַ/מִּדְיָנִ֔ית זִמְרִ֖י בֶּן סָל֑וּא נְשִׂ֥יא בֵֽית אָ֖ב לַ/שִּׁמְעֹנִֽי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/025/014.yaml
  text: The name of the Israelite man who was struck down[a], who was struck down with the Midianite woman, was Zimri son of Salu[b], a leader of a father's house among the Simeonites.
translation:
  language: zh_hans
  text: 那名被击杀的以色列人，就是与米甸女子一同被击杀的那人[a]，名叫心利，是撒路的儿子；他是西缅人中一个父家[b]的首领。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文重复“被击杀”一词，以加强语气。
    reason: lexical_alternative
  - marker: b
    text: “父家”指支派内部按父系血缘组成的家族或宗族单位。
    reason: cultural_note
lexical_decisions:
- source_word: וְ/שֵׁם
  choice: 名叫
  rationale: 此处承接上文，补充被杀者的身份。汉语用“名叫”自然表达“名字是”，不另加原文没有的时间副词。
- source_word: אִישׁ יִשְׂרָאֵל
  choice: 以色列人
  rationale: 指一名以色列男性；本句中的“那名”及后续男性身份已使单数所指清楚，无须生硬译作“以色列男子”。
- source_word: הַמֻּכֶּה ... אֲשֶׁר הֻכָּה
  choice: 被击杀……被击杀
  rationale: 保留 נכה 两种被动形式的重复，以传达原文刻意的强调；“击杀”也符合上下文中的暴力处决。
- source_word: אֶת הַמִּדְיָנִית
  choice: 与米甸女子一同
  rationale: 这里的 אֶת 在被动动词之后表示伴随，即他和那名米甸女子一起被杀；阴性单数形式表明所指为女子。
- source_word: זִמְרִי בֶּן סָלוּא
  choice: 心利，是撒路的儿子
  rationale: 采用现代中文圣经读者熟悉的人名音译，并清楚表达父子关系。
- source_word: נְשִׂיא
  choice: 首领
  rationale: 指群体中居领导地位的人；“首领”准确而不带“王子”的王室含义。
- source_word: בֵית אָב
  choice: 父家
  rationale: 保留以父系血缘组织起来的家族或宗族单位这一古代以色列社会术语，并以脚注说明。
- source_word: לַשִּׁמְעֹנִי
  choice: 西缅人中
  rationale: 表示该父家及其首领属于西缅支派；“……人中”符合现代汉语表达。
