  text: And it happened after the plague[a].
translation:
  language: zh_hans
  text: 瘟疫过后，
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: （不单独直译，以“……过后”体现叙事过渡）
  rationale: 此处 וַיְהִי 是叙事衔接公式，与 אַחֲרֵי 连用引出后续事件。现代汉语用“瘟疫过后”即可自然保留过渡功能；若译成“事情发生在……之后”，在本节独立呈现时较生硬，并可能让人误以为句意已经完整。
- source_word: אַחֲרֵי
  choice: 过后
  rationale: 明确表达时间先后关系，也适合承接下一节的叙事。
- source_word: הַמַּגֵּפָה
  choice: 瘟疫
  rationale: מַגֵּפָה 在本段指造成多人死亡的灾疫；“瘟疫”简明、自然，并与民数记25章紧邻语境中的惩罚性灾难相符。
theological_decisions:
- issue: 残句式叙事过渡的处理
  choice: 保留为承接下文的时间短语“瘟疫过后”，不补出原文未明说的事件。
  alternative: 译为完整句“瘟疫过后，事情就这样发生了”，或按传统措辞译为“瘟疫之后，事情发生了”。
  rationale: 马所拉文本在此只有叙事过渡语，其句法意义延续到下一节。保留开放式结构既反映原文，又避免擅自补足内容。
- issue: 灾疫与神圣审判的关系
  choice: 仅译作“瘟疫”，不在正文中添加“神降的”等解释。
  alternative: “神所降的瘟疫”或“惩罚性的瘟疫”。
  rationale: 上下文表明其审判背景，但本节本身没有明确说出施事者；不应在正文中消除这种省略。
translation_notes:
  register: 采用简洁、庄重的现代汉语。“瘟疫过后”自然易懂，并以逗号显示本节在句法和叙事上承接下一节；脚注标记已在正文中出现。
