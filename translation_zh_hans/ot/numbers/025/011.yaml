reference: Numbers 25:11
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: פִּֽינְחָ֨ס בֶּן אֶלְעָזָ֜ר בֶּן אַהֲרֹ֣ן הַ/כֹּהֵ֗ן הֵשִׁ֤יב אֶת חֲמָתִ/י֙ מֵ/עַ֣ל בְּנֵֽי יִשְׂרָאֵ֔ל בְּ/קַנְא֥/וֹ אֶת קִנְאָתִ֖/י בְּ/תוֹכָ֑/ם וְ/לֹא כִלִּ֥יתִי אֶת בְּנֵֽי יִשְׂרָאֵ֖ל בְּ/קִנְאָתִֽ/י־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/025/011.yaml
  text: Phinehas son of Eleazar[a], son of Aaron the priest, has turned back my wrath from upon the sons of Israel by being jealous with my jealousy among them, so that I did not consume the sons of Israel in my jealousy.
translation:
  language: zh_hans
  text: “祭司亚伦的孙子、以利亚撒的儿子非尼哈，在以色列人中以我的忌邪为忌邪[a]，使我的烈怒离开了他们。因此，我没有因我的忌邪灭尽以色列人。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “忌邪”也可译作“热心、热忱”。希伯来文用同一词根描述非尼哈的行动和上帝的忌邪。
    reason: 说明קנא词族兼具“忌邪”与“热忱”的语义，并指出原文的同根复现。
lexical_decisions:
- source_word: הֵשִׁיב
  choice: 使……离开
  rationale: 此处使役式表达使烈怒转回、消退，即“使我的烈怒离开了他们”；既保留使役意义，也符合现代汉语。
- source_word: חֲמָתִי
  choice: 我的烈怒
  rationale: חֵמָה指强烈、如火燃烧的愤怒；“烈怒”保留其强度及审判意味。
- source_word: מֵעַל
  choice: 离开了他们
  rationale: 原意带有“从……上面移开”的图像；汉语用“离开了他们”自然表达临到其身的烈怒被撤去。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 这是现代汉语中对该群体名称自然、准确的表达；“以色列的众子”在本句中生硬，且容易被误解为仅指男性。
- source_word: בְּקַנְאוֹ אֶת־קִנְאָתִי
  choice: 以我的忌邪为忌邪
  rationale: 动词与名词同出קנא词根；此译保留原文刻意的同根复现，也传达维护排他性盟约忠诚的强烈热忱。
- source_word: בְּתוֹכָם
  choice: 在以色列人中
  rationale: 清楚表达非尼哈是在群体当中采取行动。
- source_word: כִלִּיתִי
  choice: 灭尽
  rationale: Piel词形在此指彻底毁灭或除尽；“灭尽”比一般的“毁灭”更能保留完全终结之意。
- source_word: בְּקִנְאָתִי
  choice: 在忌邪中
  rationale: 与前面的“我的忌邪”保持词汇一致，保留神因盟约忠诚而有的强烈反应。
- source_word: הַכֹּהֵן
  choice: 祭司
  rationale: 作为亚伦的同位称号，译作“祭司”准确自然；中文通过“祭司亚伦”清楚表明该称号修饰亚伦。
theological_decisions:
- issue: 非尼哈与神的קנא / קִנְאָה用语
  choice: 忌邪／忌邪
  alternative: 热心／热忱
  rationale: 希伯来文刻意用同一词根描述非尼哈的行动与神的反应。“忌邪”保留盟约关系中排他忠诚的含义，也保留二者之间的词汇联系；“热心”虽可表达积极热忱，却可能弱化盟约性的排他意味。
- issue: בְּנֵי יִשְׂרָאֵל的群体指称
  choice: 以色列人
  alternative: 以色列的众子
  rationale: 此处是全体以色列民的固定群体称谓，不应理解为只包括男性；现代汉语“以色列人”准确而自然。
- issue: 神的忌邪与以色列未被灭尽之间的关系
  choice: 因此，我没有在忌邪中灭尽以色列人
  alternative: 免得我因忌邪灭尽以色列人
  rationale: וְלֹא可承接前句表达实际结果；译文不额外解释神的情感或非尼哈行动的功效机制，保留原文的神学张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。亲属关系按汉语习惯重排为“祭司亚伦的孙子、以利亚撒的儿子非尼哈”，避免误将“祭司”修饰非尼哈或以利亚撒。以“忌邪为忌邪”有意保留原文同根表达，虽略具圣经语体色彩，但仍可理解。
