  yaml_path: translation/ot/numbers/025/009.yaml
  text: And those who died in the plague were twenty-four thousand.
translation:
  language: zh_hans
  text: 死于这场瘟疫的，共有二万四千人。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: 共有
  rationale: 这里的连续式 היה 用作系词，引出死亡总数。译作“共有”符合现代汉语统计人数的表达，也保留了原文汇总数字的功能。
- source_word: הַמֵּתִים
  choice: 死于……的
  rationale: 该词是 מות 的分词，实指死亡的人。与后面的介词短语合译为“死于这场瘟疫的”，比“死者”更自然，并明确所统计的是人。
- source_word: בַּמַּגֵּפָה
  choice: 于这场瘟疫
  rationale: מַגֵּפָה 指致命的瘟疫或灾疫；介词 ב 在此可表达死亡所发生或所由的灾疫。译作“死于这场瘟疫”在现代汉语中自然，同时不额外扩展原文。
- source_word: אַרְבָּעָה וְעֶשְׂרִים אָלֶף
  choice: 二万四千人
  rationale: 原文按希伯来语习惯表达“四又二十千”，现代汉语规范表达为“二万四千”；补出量词“人”是汉语计数所需，所指已由“死亡的人”确定。
