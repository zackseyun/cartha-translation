source:
  edition: WLC
  text: כִּ֣י צֹרְרִ֥ים הֵם֙ לָ/כֶ֔ם בְּ/נִכְלֵי/הֶ֛ם אֲשֶׁר נִכְּל֥וּ לָ/כֶ֖ם עַל דְּבַר פְּע֑וֹר וְ/עַל דְּבַ֞ר כָּזְבִּ֨י בַת נְשִׂ֤יא מִדְיָן֙ אֲחֹתָ֔/ם הַ/מֻּכָּ֥ה בְ/יוֹם הַ/מַּגֵּפָ֖ה עַל דְּבַר פְּעֽוֹר־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/025/018.yaml
  text: For they are hostile to you through their schemes[a], by which they deceived you in the matter of Peor and in the matter of Cozbi, the daughter of a leader of Midian, their sister[c][b], who was struck down on the day of the plague because of the matter of Peor.
translation:
  language: zh_hans
  text: 因为他们以诡计对付你们；他们曾在毗珥[a]的事上和米甸首领的女儿哥斯比——他们的姊妹[b]——的事上，用诡计欺骗你们。哥斯比在因毗珥之事而起的瘟疫那天被击杀。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “毗珥”指本章前文所记与巴力·毗珥有关的事件。
    reason: cross_reference
  - marker: b
    text: “他们的姊妹”是希伯来文的直译；这里可能指他们本族或亲族中的女子。
    reason: lexical_alternative
lexical_decisions:
- source_word: צֹרְרִים
  choice: 敌对
  rationale: 该分词表示持续的敌意。“敌对”保留谓语性质，又不把含义限缩为军事交战。
- source_word: בְּנִכְלֵיהֶם
  choice: 用诡计
  rationale: 名词指狡诈、欺骗性的谋算；“用诡计”自然表达工具性的介词 ב。
- source_word: נִכְלוּ
  choice: 设计陷害
  rationale: 该动词与前面的“诡计”同根，表示以欺诈性的谋算对付人；“设计陷害”比单纯“欺骗”更充分体现敌对指向。
- source_word: עַל דְּבַר פְּעוֹר
  choice: 在毗珥的事上／因毗珥之事
  rationale: 该习语可表示“关于某事”或“因某事”。首次按情境关系译为“在……的事上”，末次按瘟疫的因由译为“因……之事”。
- source_word: כָּזְבִּי
  choice: 哥斯比
  rationale: 按现代中文圣经人名的常见音译处理。
- source_word: בַת נְשִׂיא מִדְיָן
  choice: 米甸首领的女儿
  rationale: נשיא 指领袖或族长；“首领”自然、庄重，也避免“王子”可能带来的世袭王室含义。
- source_word: אֲחֹתָם
  choice: 他们的姊妹
  rationale: 保留希伯来文直译及其亲属用语；这里也可能泛指同族女子，另以脚注说明。
- source_word: הַמֻּכָּה
  choice: 被击杀了
  rationale: 保留 נכה 的击打意象，同时清楚表达本段语境中的死亡结果。
- source_word: בְיוֹם הַמַּגֵּפָה
  choice: 发生瘟疫的那天
  rationale: 以自然现代汉语表达明确的时间关系。
theological_decisions:
- issue: “毗珥”的所指
  choice: 正文仅按原文译作“毗珥”，以脚注说明指本章前述巴力·毗珥事件。
  alternative: 在正文扩写为“巴力·毗珥”。
  rationale: 原文这里只写“毗珥”；不在正文补入“巴力”可避免超出文本，同时脚注为读者提供必要关联。
- issue: 两次 עַל דְּבַר פְּעוֹר 的语义力度
  choice: 首次译作“在毗珥的事上”，末次译作“因毗珥之事”。
  alternative: 两处完全使用相同措辞。
  rationale: 同一希伯来习语在首次说明事件范围，在末次与瘟疫相连时带有因由色彩；依局部句法作细微区分，同时不改变其共同所指。
- issue: “他们的姊妹”的范围
  choice: 正文保留字面亲属称谓。
  alternative: 直接释译为“他们的同族女子”。
  rationale: 原文措辞确为“他们的姊妹”，但可能表达族群亲属关系；正文保留其开放性，脚注提示较宽泛的可能含义。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“诡计—设计陷害”保留原文名词与动词的同根呼应；将较长的希伯来句式分为两句，以免中文修饰关系含混。所有脚注标记均置于相应正文位置。
