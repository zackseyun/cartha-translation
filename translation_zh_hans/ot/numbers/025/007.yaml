id: NUM.25.7
reference: Numbers 25:7
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יַּ֗רְא פִּֽינְחָס֙ בֶּן אֶלְעָזָ֔ר בֶּֽן אַהֲרֹ֖ן הַ/כֹּהֵ֑ן וַ/יָּ֨קָם֙ מִ/תּ֣וֹךְ הָֽ/עֵדָ֔ה וַ/יִּקַּ֥ח רֹ֖מַח בְּ/יָדֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/025/007.yaml
  text: When Phinehas son of Eleazar[a], son of Aaron the priest, saw it[b], he rose up from the midst of the congregation and took a spear in his hand.
translation:
  language: zh_hans
  text: 祭司亚伦的孙子、以利亚撒的儿子非尼哈看见这事[a]，就从会众中站起来，手里拿了一支矛。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文只说“看见”，没有明说所看见的对象；“这事”是按上文补出的。也可译作“看见了”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: 看见这事
  rationale: 希伯来文只说“看见”，宾语由上一节的情境隐含。现代汉语通常需要补出宾语；“这事”自然地回指前文，又不具体限定他所看见的哪一方面。
- source_word: פִּינְחָס
  choice: 非尼哈
  rationale: 采用现代中文圣经传统中通行的人名音译。
- source_word: בֶּן אֶלְעָזָר בֶּן אַהֲרֹן הַכֹּהֵן
  choice: 祭司亚伦的孙子、以利亚撒的儿子
  rationale: 按汉语亲属关系自然表达两代谱系，并把“祭司”只用于修饰亚伦；原文没有“大祭司”，因此不增译。
- source_word: וַיָּקָם
  choice: 站起来
  rationale: 该动词表示起身或站起；“站起来”符合此处连续叙事中的果断动作，也比“兴起”更直接。
- source_word: מִתּוֹךְ הָעֵדָה
  choice: 从会众中
  rationale: תּוֹךְ表示“当中”，עֵדָה指聚集的以色列群体。“从会众中”既贴合原文，也自然简洁。
- source_word: וַיִּקַּח
  choice: 拿了
  rationale: 使用常见义“拿、取”，不以“抓起”等措辞额外强化动作。
- source_word: רֹמַח
  choice: 一支矛
  rationale: 该词指长矛一类兵器；“矛”是清楚、简洁且符合量词习惯的现代汉语对应词。
- source_word: בְּיָדוֹ
  choice: 手里
  rationale: 直译为“在他手中”；“手里拿了一支矛”是自然的现代汉语表达，并保留他持矛在手的画面。
theological_decisions:
- issue: הָעֵדָה所指的群体
  choice: 会众
  alternative: 大会；群体
  rationale: 该词在摩西五经中常指聚集的以色列群体。“会众”保留其共同体及集会含义，同时不引入后世特定教会制度的观念。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。谱系依汉语习惯由祖父说到父亲；句中动作衔接简洁，不用古奥的“遂”“起身于会众之中”等表达。
