language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ֠/יָּבֹא אַחַ֨ר אִֽישׁ יִשְׂרָאֵ֜ל אֶל הַ/קֻּבָּ֗ה וַ/יִּדְקֹר֙ אֶת שְׁנֵי/הֶ֔ם אֵ֚ת אִ֣ישׁ יִשְׂרָאֵ֔ל וְ/אֶת הָ/אִשָּׁ֖ה אֶל קֳבָתָ֑/הּ וַ/תֵּֽעָצַר֙ הַ/מַּגֵּפָ֔ה מֵ/עַ֖ל בְּנֵ֥י יִשְׂרָאֵֽל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/025/008.yaml
  text: He went after the Israelite man into the chamber and pierced both of them—the Israelite man and the woman—through her belly[c][b][a]. Then the plague was stopped from upon the sons of Israel.
translation:
  language: zh_hans
  text: 他跟着那以色列男子进了内室[a]，刺穿了他们二人——那以色列男子和那女人——直入她的腹部[b]。于是，临到以色列子民身上的瘟疫止住了[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “内室”所译的希伯来词很少见，也可理解为帐篷里的隔间、凹室或亭子。
    reason: lexical_alternative
  - marker: b
    text: “腹部”也可译作“肚腹”或“腹腔”；原文明确指出这一身体部位。
    reason: lexical_alternative
  - marker: c
    text: “以色列子民”直译为“以色列的众子”，是指以色列全体百姓的固定称谓。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַקֻּבָּה
  choice: 内室
  rationale: 该词罕见，指内部隔间或房室；“内室”自然地表达封闭、私密的内部空间，同时不武断限定为帐篷或亭子。
- source_word: וַיִּדְקֹר
  choice: 用矛刺穿
  rationale: 动词表示刺入、刺透；结合上文非尼哈手持长矛的语境，补出“用矛”可使动作清楚，而“刺穿”保留其猛烈和贯穿之意。
- source_word: שְׁנֵיהֶם
  choice: 他们二人
  rationale: 直接保留希伯来文所强调的两个人都被刺中的意思。
- source_word: אֶל קֳבָתָהּ
  choice: 矛刺入了她的腹部
  rationale: קֳבָה指腹部或腹腔；译作“腹部”具体而不过分口语化。原文介词结构较凝缩，中文以独立分句清楚呈现其解剖细节。
- source_word: וַתֵּעָצַר
  choice: 止住了
  rationale: 该被动式表达瘟疫被制止、停止；“止住了”在现代中文中自然，并保留结果意味。
- source_word: הַמַּגֵּפָה
  choice: 瘟疫
  rationale: 在神审判的上下文中，“瘟疫”是מַגֵּפָה准确而通行的中文表达。
- source_word: מֵעַל בְּנֵי יִשְׂרָאֵל
  choice: 以色列子民所遭的
  rationale: “以色列子民”保留בְּנֵי יִשְׂרָאֵל的传统群体称谓；将מֵעַל的空间习语自然转化为中文的受灾关系，避免生硬的“从……之上”。
- source_word: אִישׁ יִשְׂרָאֵל
  choice: 那个以色列人／那个以色列男子
  rationale: 首次用自然的“以色列人”，复述处用“以色列男子”，明确保留אִישׁ的男性个体指称，也避免中文重复过于僵硬。
theological_decisions:
- issue: 群体称谓בְּנֵי יִשְׂרָאֵל的性别形式
  choice: 以色列子民
  alternative: 以色列众人／以色列人
  rationale: 这是指全体以色列民的固定群体称谓；“子民”既呼应其字面构成和盟约语感，也在现代中文中自然，不误导为仅指男性。
- issue: 审判场景中的具体身体细节
  choice: 矛刺入了她的腹部
  alternative: 刺入她体内／刺穿她的肚腹
  rationale: 原文明确提到女子的腹部，不应淡化；“腹部”准确、庄重，并避免添加原文没有明说的额外血腥描写。
- issue: 二人如何被刺中的句法关系
  choice: 刺穿了他们二人……矛刺入了她的腹部
  alternative: 从女子腹部把二人一同刺穿
  rationale: 希伯来文明确说二人都被刺，并特别提到女子腹部，但具体贯穿路径仍有句法凝缩和一定歧义；译文保留两项信息，不擅自断定长矛先后穿过谁或从何方向贯穿。
translation_notes:
  register: 采用现代、庄重且易懂的叙事语体。“内室”避免过度限定建筑形态；“用矛刺穿”承接上文器具并保留暴力动作的力度；后半句按自然汉语重组מֵעַל的空间习语。所有脚注标记均置于其所说明的词句之后。
