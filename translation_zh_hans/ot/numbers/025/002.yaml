base_translation:
  language: en
  yaml_path: translation/ot/numbers/025/002.yaml
  text: And they invited the people to the sacrifices of their gods[a], and the people ate and bowed down to their gods.
translation:
  language: zh_hans
  text: 她们邀请百姓来参加献给她们众神的祭祀；百姓吃了，又向她们的众神俯伏下拜。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“敬拜她们的众神。”原文动词本指俯身或伏地下拜，这种动作常用于敬拜。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּקְרֶאןָ
  choice: 她们邀请
  rationale: 该词是קרא的Qal叙事式未完成时第三人称阴性复数；与לְ及人连用时，在本语境中自然表示“邀请”。阴性复数主语承接上一节的摩押女子。
- source_word: לָעָם
  choice: 百姓
  rationale: 带定冠词的עָם直译为“百姓”。上下文虽指以色列人，本节却没有重述“以色列”，因此保留原文较简洁的称呼。
- source_word: לְזִבְחֵי אֱלֹהֵיהֶן
  choice: 来参加献给她们众神的祭祀
  rationale: זִבְחֵי是复数构造形式，指与这些神明相关的祭牲、祭宴或祭祀礼仪。中文若直译为“到她们众神的祭物那里”不够自然，故用“参加……祭祀”表达邀请赴祭的含义，并以“献给”清楚标明祭祀对象。
- source_word: וַיֹּאכַל
  choice: 吃了祭物
  rationale: 原文动词意为“吃”，集体名词“百姓”作主语。根据前面的祭祀语境补出宾语“祭物”，使现代汉语完整自然，但不增添原文之外的新事件。
- source_word: וַיִּשְׁתַּחֲווּ
  choice: 俯伏下拜
  rationale: 该动词具体表示俯身或伏地下拜，并常构成敬拜行为。“俯伏下拜”保留身体动作及其礼拜含义，不直接以较抽象的“敬拜”取代。
- source_word: לֵאלֹהֵיהֶן
  choice: 向她们的神
  rationale: 介词לְ在该动词后标明下拜的对象或方向，译作“向……下拜”符合现代汉语。希伯来语形式可作复数理解；中文“神”在物主短语后可不标复数，避免“众神”在同句中机械重复。
theological_decisions:
- issue: 如何表达וַיִּשְׁתַּחֲווּ所描述的偶像崇拜行为
  choice: 向她们的神俯伏下拜
  alternative: 敬拜她们的神
  rationale: 正文保留原文所描绘的具体身体动作，同时“下拜”自然传达礼拜性质；脚注列出较概括的“敬拜”，不把词义中的具体动作完全抽象化。
translation_notes:
  register: 采用现代、庄重而易懂的叙事体。“她们”承接上一节的摩押女子；分号划分邀请与百姓回应两个叙事层次。“祭物”由祭祀语境自然补足，正文脚注标记置于相关分句末。
