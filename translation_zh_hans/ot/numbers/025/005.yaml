base_translation:
  language: en
  yaml_path: translation/ot/numbers/025/005.yaml
  text: And Moses said to the judges of Israel[b][a], “Each of you must kill his men who have joined themselves to Baal Peor.”
translation:
  language: zh_hans
  text: 摩西对以色列的审判官说：“你们各人要杀死自己管辖下那些依附毗珥的巴力[a]的男子。”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “毗珥的巴力”也可译作“巴力·毗珥”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译近于“杀死吧，各人杀死自己的人”，意思是每位审判官都要杀死自己管辖下那些依附毗珥的巴力的男子。
    reason: lexical_alternative
lexical_decisions:
- source_word: שֹׁפְטֵי
  choice: 审判官
  rationale: 该词指在以色列中行使司法和治理权柄的人；“审判官”既直接对应其职能，也符合本节下令处置辖下人员的语境。
- source_word: הִרְגוּ
  choice: 要……杀死
  rationale: 希伯来文为复数命令式，直指杀死；译作“要……杀死”保留命令的力度，又不额外加入“依法处决”等原文未明说的程序含义。
- source_word: אִישׁ אֲנָשָׁיו
  choice: 你们各人要把自己管辖的人中……的人
  rationale: 原文直译近于“各人杀他的人”，是分配式结构，要求每位审判官处置归自己管辖的涉事男子。正文以自然汉语表达这种管辖关系。
- source_word: הַנִּצְמָדִים
  choice: 依附
  rationale: צמד的尼斐勒分词表示紧密连接或依附；“依附”能表达主动归附偶像的含义，同时不把隐喻过度具体化。
- source_word: לְבַעַל פְּעוֹר
  choice: 毗珥的巴力
  rationale: 该短语指与毗珥相关的巴力神；“毗珥的巴力”清楚保留巴力与地点的关系，传统合称“巴力·毗珥”列入脚注。
theological_decisions:
- issue: 命令杀人的性质
  choice: 直接译出摩西命令审判官杀死其辖下依附巴力的人，不添加司法程序或礼仪说明。
  alternative: 译作“处死”，突出司法惩罚的性质。
  rationale: 本节确实处在审判语境中，但动词本身是“杀死”，且本节没有交代具体程序；正文应保留命令的严厉性而不增添解释。
- issue: אִישׁ אֲנָשָׁיו的男性及管辖含义
  choice: 用“你们各人”和“自己管辖的人”表达每位审判官对辖下涉事者的责任。
  alternative: 较直译为“各人杀死自己的人”，或泛化为“各自把属下的人处死”。
  rationale: 原文采用阳性形式，语境所指为涉事男子；汉语正文借分配结构保留这一指向，并避免“自己的人”可能造成的亲属歧义。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“审判官”保留司法治理职分；“自己管辖的人中”使希伯来文分配式表达在中文中清晰自然。脚注标记均在正文出现。
