  text: וְ/הִנֵּ֡ה אִישׁ֩ מִ/בְּנֵ֨י יִשְׂרָאֵ֜ל בָּ֗א וַ/יַּקְרֵ֤ב אֶל אֶחָי/ו֙ אֶת הַ/מִּדְיָנִ֔ית לְ/עֵינֵ֣י מֹשֶׁ֔ה וּ/לְ/עֵינֵ֖י כָּל עֲדַ֣ת בְּנֵי יִשְׂרָאֵ֑ל וְ/הֵ֣מָּה בֹכִ֔ים פֶּ֖תַח אֹ֥הֶל מוֹעֵֽד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/025/006.yaml
  text: And behold, a man from the sons of Israel came and brought near to his brothers a Midianite woman, before the eyes of Moses and before the eyes of all the congregation of the sons of Israel, while they were weeping at the entrance of the tent of meeting.
translation:
  language: zh_hans
  text: 看哪，有一个以色列人来了，把一个米甸女子带到他的弟兄们那里[a]，在摩西眼前，也在以色列全会众眼前。当时，他们正在会幕门口哭泣。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “弟兄们”也可理解为“同胞”或“其他以色列人”。希伯来文直译是“他的弟兄们”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: 看哪
  rationale: 保留希伯来叙事中引人注意、带有突发和震惊意味的话语标记；现代中文虽略显庄重，却清楚自然。
- source_word: אִישׁ מִבְּנֵי יִשְׂרָאֵל
  choice: 有一个以色列人
  rationale: 准确表达一名男性以色列人的身份；中文用“以色列人”比直译“以色列的众子中有一人”更自然，也不改变实际所指。
- source_word: בָּא
  choice: 来了
  rationale: 采用自然、直接的叙事动词。
- source_word: וַיַּקְרֵב
  choice: 把……带到……那里
  rationale: 表达使某人靠近或来到某处的使役含义，也符合现代汉语语序；“带近”在此不够自然。
- source_word: אֶל אֶחָיו
  choice: 到他的弟兄们那里
  rationale: 保留原文的男性亲属称谓及群体性的盟约家族语言；脚注说明语境中也可能泛指同胞。
- source_word: הַמִּדְיָנִית
  choice: 一个米甸女子
  rationale: 阴性形容词在此名词化，故明说“女子”；虽有定冠词，但人物在叙事中初次出现，现代汉语用“一个”最自然。
- source_word: לְעֵינֵי מֹשֶׁה וּלְעֵינֵי כָּל עֲדַת בְּנֵי יִשְׂרָאֵל
  choice: 当着摩西和以色列全会众的面
  rationale: 用自然中文保留公开目睹的含义，并表达这行为公然发生；合并重复的“在……眼前”以避免生硬。
- source_word: וְהֵמָּה בֹכִים
  choice: 当时，他们正在……哭泣
  rationale: 代词加分词表示持续的背景动作；“正在”准确体现其与前述事件同时发生。
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: 会幕门口
  rationale: “会幕”是 אֹהֶל מוֹעֵד 的通行、简洁译法；“门口”自然表达入口位置。
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל 与 אֶחָיו 的性别化盟约家族用语
  choice: 前者按语境译为“以色列人”，后者保留为“弟兄们”并加脚注
  alternative: “以色列的众子”和“同胞”
  rationale: “以色列人”在现代中文中准确指明族群而不暗示只有男性；但 אֶחָיו 在本句中直接指向该男子所带去面对的群体，保留“弟兄们”可呈现原文的男性亲属措辞，同时以脚注保存较宽泛的语境理解。
- issue: 他们正在哭泣的原因
  choice: 仅陈述持续哭泣，不补明原因
  alternative: 解释为因瘟疫、审判或百姓犯罪而哀哭
  rationale: 本节没有明说哭泣的直接原因；不把上下文推论写进正文，以保留原文的叙事含蓄。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“看哪”保留原文的突然聚焦；“竟”传达该公开举动在哀哭场景中的突兀与冒犯性，但不额外说明其动机。长句分为两句，以符合现代汉语节奏，同时保持动作的同时性。
