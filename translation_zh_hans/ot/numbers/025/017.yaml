  text: צָר֖וֹר אֶת הַ/מִּדְיָנִ֑ים וְ/הִכִּיתֶ֖ם אוֹתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/025/017.yaml
  text: Harass the Midianites and strike them down,[a]
translation:
  language: zh_hans
  text: “你们要敌视米甸人，攻打他们。[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你们要侵扰米甸人，攻打他们。”希伯来语צָרוֹר也可表示向人怀有敌意，或把人当作仇敌对待。
    reason: 说明צָרוֹר的词义范围及另一种可能译法。
lexical_decisions:
- source_word: צָרוֹר
  choice: 要敌视
  rationale: 该词是צרר的Qal形式，在这里具有命令功能，可表示以敌人相待、敌对或侵扰。“要敌视”保留其关系性敌意，又不把含义局限为某一种军事骚扰行动。
- source_word: הַמִּדְיָנִים
  choice: 米甸人
  rationale: 采用现代中文圣经语境中通行的族名译法。
- source_word: וְהִכִּיתֶם
  choice: 攻打他们
  rationale: נכה的Hiphil形式可指击打、攻击或击败；结合群体冲突的语境译作“攻打”，既表达暴力行动，也不擅自限定为杀尽或仅仅击败。
- source_word: אוֹתָם
  choice: 他们
  rationale: 直接宾语代词，回指米甸人。
- source_word: אֶת
  choice: 不单独译出
  rationale: 希伯来语直接宾语标记，其语法功能已由中文语序体现。
theological_decisions:
- issue: 如何翻译上帝所命令的敌对与暴力行动，而不弱化或扩张原文
  choice: 你们要敌视米甸人，攻打他们
  alternative: 你们要侵扰米甸人，击打他们
  rationale: 原文连续表达敌对和攻击的命令。译文保留命令的严厉性，但不加入本节未陈明的神学理由，也不将נכה过度具体化为“杀死”。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“敌视”准确表达持续的敌对态度；“攻打”适合族群冲突语境，并保留原动词在击打、攻击与击败之间的语义张力。主语“你们”由动词人称明确表达，中文中补出以使命令对象清楚。
