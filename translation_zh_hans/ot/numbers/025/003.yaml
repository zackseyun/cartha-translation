source:
  edition: WLC
  text: וַ/יִּצָּ֥מֶד יִשְׂרָאֵ֖ל לְ/בַ֣עַל פְּע֑וֹר וַ/יִּֽחַר אַ֥ף יְהוָ֖ה בְּ/יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/025/003.yaml
  text: So Israel joined itself to Baal of Peor[a], and the anger of Yahweh burned against Israel.
translation:
  language: zh_hans
  text: 于是，以色列与毗珥的巴力联合[a]，耶和华就向以色列发怒。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“依附于毗珥的巴力”，或“与毗珥的巴力同负一轭”。“毗珥的巴力”也可译作“巴力·毗珥”。
    reason: 词义与专名结构存在可成立的替代译法。
lexical_decisions:
- source_word: וַיִּצָּמֶד
  choice: 联合
  rationale: צמד的尼法勒形式表示紧密地联结、依附；“与……联合”在现代汉语中自然，并保留以色列主动卷入这种偶像崇拜关系的含义。
- source_word: יִשְׂרָאֵל
  choice: 以色列
  rationale: 采用现代中文圣经传统中通行的民族名称译法。
- source_word: לְבַעַל פְּעוֹר
  choice: 与毗珥的巴力
  rationale: “巴力”保留神名或称号，地名“毗珥”限定其地方性表现；“毗珥的巴力”清楚体现希伯来语结构，同时不强行把两词合为一个专名。
- source_word: וַיִּחַר אַף
  choice: 发怒
  rationale: 该希伯来语惯用语以怒气发热、燃烧表达盛怒；中文“发怒”准确自然。若直译为“怒气燃烧”，虽保留意象，却在本句中略显生硬。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代简体中文读者最熟悉、且作为专名使用的传统音译，区别于以“主”这一称号替代神名。
- source_word: בְּיִשְׂרָאֵל
  choice: 向以色列
  rationale: 在חרה אף这一结构中，介词ב标示发怒的对象；“向以色列发怒”是自然准确的现代汉语表达。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名，应以专名而非“主”这一称号表达。“耶和华”是现代中文圣经传统中最通行、普通读者辨识度最高的专名形式；“雅威”更接近学界常用的拟音，也可作为替代。
- issue: צמד所表达的偶像崇拜关系
  choice: 与……联合
  alternative: 依附于……／与……同负一轭
  rationale: “联合”保留紧密联结的关系性含义，却不额外断定其具体是盟约、礼仪或性行为；脚注提供更具形象性的“同负一轭”，以保存词义张力。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“于是……就……”承接上文并清楚呈现两件事的先后关系；正文避免过度直译希伯来语的身体意象，相关词义范围在脚注中保留。
