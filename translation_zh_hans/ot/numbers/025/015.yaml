base_translation:
  language: en
  yaml_path: translation/ot/numbers/025/015.yaml
  text: And the name of the Midianite woman who was struck down was Cozbi daughter of Zur[b][a], who was head of the clans of a father's house in Midian.
translation:
  language: zh_hans
  text: 那被击杀的米甸女子名叫哥斯比，是苏珥的女儿；苏珥是米甸一个父家[b]各宗族[a]的首领。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “宗族”或译“族群”。原文这个词可指“民族、族群”；在这里的亲族语境中，也可理解为宗族群体。
    reason: lexical_alternative
  - marker: b
    text: “父家”是古代亲族术语，指以父系祖先为中心的扩大家庭或祖系家族。
    reason: cultural_note
lexical_decisions:
- source_word: וְשֵׁם
  choice: 名叫
  rationale: 在现代汉语中用“名叫”自然表达希伯来语“而名字是”的叙事衔接，无须机械译出连接词。
- source_word: הַמֻּכָּה
  choice: 被击杀的
  rationale: 保留 נכה 被动分词的击打意象，同时根据上文明确的死亡语境译作“击杀”。
- source_word: הַמִּדְיָנִית
  choice: 米甸女子
  rationale: 将族属形容词与“女子”自然组合，清楚表明其米甸身份。
- source_word: כָּזְבִּי
  choice: 哥斯比
  rationale: 采用现代中文圣经人名的通行音译。
- source_word: בַת צ֑וּר
  choice: 苏珥的女儿
  rationale: 直接表达希伯来语表血缘关系的构造链。
- source_word: רֹאשׁ
  choice: 首领
  rationale: 此处 רֹאשׁ 指领导者；“首领”比字面的“头”更符合现代汉语，又保留其职位含义。
- source_word: אֻמּוֹת
  choice: 宗族
  rationale: 该词通常可指民族或群体，但在“父家”的亲族结构语境中，译作“宗族”较恰当，同时以脚注保留词义的不确定性。
- source_word: בֵּית אָב
  choice: 父家
  rationale: 保留希伯来社会结构中的亲族术语；在中文圣经语体中简洁且可理解。
- source_word: בְּמִדְיָן
  choice: 米甸
  rationale: 结合“一个父家”译为“米甸一个父家”，自然表达其所属范围。
- source_word: הוּא
  choice: 苏珥是
  rationale: 明确恢复代词所指的苏珥，并以系词构成自然汉语判断句，避免误以为首领是哥斯比。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“父家”保留古代以父系为中心的扩大家庭或祖系家族概念；调整句序并重复“苏珥”，以消除原文关系从句在汉语中可能产生的指代歧义。
