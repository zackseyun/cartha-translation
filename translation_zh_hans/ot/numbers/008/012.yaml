base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/012.yaml
  text: Then the Levites shall lay their hands on the heads of the bulls[a], and you shall offer one as a sin offering and the other as a burnt offering to Yahweh, to make atonement for the Levites.
translation:
  language: zh_hans
  text: 利未人要把手按在公牛的头上；你要把一头献作赎罪祭[a]，把另一头献作燔祭，献给雅威，为利未人赎罪。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “赎罪祭”也可译作“洁净祭”。希伯来语 חַטָּאת 在祭司礼仪语境中可指与罪及洁净有关的祭。
    reason: lexical_alternative
lexical_decisions:
- source_word: יִסְמְכוּ אֶת יְדֵיהֶם
  choice: 把手按在
  rationale: 在献祭语境中，סמך ידים指按手于祭牲的礼仪动作；“把手按在”自然且保留具体动作。
- source_word: עַל רֹאשׁ הַפָּרִים
  choice: 在公牛的头上
  rationale: 原文“头”为单数、“公牛”为复数，可按希伯来语的分配性单数理解，即各人按手在相应公牛的头上；中文用单数“头”也自然，并保留原文形式。
- source_word: וַעֲשֵׂה
  choice: 你要把……献作
  rationale: 动词为阳性单数命令式；在献祭语境中，עשה与祭物连用，译作“献作”比直译“做”更准确。
- source_word: חַטָּאת
  choice: 赎罪祭
  rationale: 这是中文圣经及礼仪语境中通行、易懂的名称；该词也可强调洁净功能，因此以脚注保留“洁净祭”的可能译法。
- source_word: עֹלָה
  choice: 燔祭
  rationale: 采用中文中成熟的祭祀术语，表达祭牲全烧献上的祭。
- source_word: לַיהוָה
  choice: 献给雅威
  rationale: 介词ל在献祭公式中表示祭物献给谁；יהוה按其专名译为“雅威”。
- source_word: לְכַפֵּר עַל הַלְוִיִּם
  choice: 为利未人赎罪
  rationale: 保留כפר的祭仪与神学力度，并将על自然表达为受益对象“为”；不进一步限定赎罪机制。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”较贴近学界通常重构的读音，并明确作为专名呈现。
- issue: חַטָּאת的祭名及功能
  choice: 正文作“赎罪祭”，脚注保留“洁净祭”
  alternative: 正文作“洁净祭”
  rationale: חַטָּאת在祭司文献中既与罪有关，也具有洁净礼仪污秽的功能。正文采用普通读者较熟悉的“赎罪祭”，但不以此抹去另一项真实的词义可能。
- issue: כפר的含义
  choice: 赎罪
  alternative: 施行洁净／遮盖
  rationale: “赎罪”保留传统祭仪用语及原文的神学张力，同时避免在译文中断定某一种具体的赎罪理论。
translation_notes:
  register: 采用现代、庄重而通顺的礼仪叙述。“把一头……把另一头……”清楚呈现两头公牛的对应关系；分号区分按手与献祭两个连续动作。
