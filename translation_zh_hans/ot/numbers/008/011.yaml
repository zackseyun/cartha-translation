base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/011.yaml
  text: Aaron shall present the Levites as a wave offering before Yahweh from the sons of Israel[b][a], and they shall be to serve the service of Yahweh.
translation:
  language: zh_hans
  text: 亚伦要把从以色列人中选出的利未人作为摇祭，在耶和华面前献上[a][b]；他们就可以承担事奉耶和华的工作。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“亚伦要把利未人摇献为摇祭。”原文“摇献”这一动词与“摇祭”出自同一词根，指一种礼仪性的呈献。
    reason: lexical_alternative
  - marker: b
    text: “从以色列人中选出的”也可理解为“代表以色列人”或“为以色列人”，意即利未人代表以色列人事奉耶和华。
    reason: alternative_reading
lexical_decisions:
- source_word: וְהֵנִיף ... תְּנוּפָה
  choice: 作为摇祭……献上
  rationale: 动词 נוף 的使役形与名词 תְּנוּפָה 同根，表示礼仪性的摇献或呈献。用“献上”表达动作，以“摇祭”保留祭礼术语，避免让人误以为亚伦要实际摇动利未人。
- source_word: הַלְוִיִּם
  choice: 利未人
  rationale: 这是该支派群体在现代汉语圣经语境中的通行名称。
- source_word: לִפְנֵי יְהוָה
  choice: 在耶和华面前
  rationale: 忠实表达“在耶和华临在之处”的固定希伯来语用法，并以“耶和华”译出神名。
- source_word: מֵאֵת בְּנֵי יִשְׂרָאֵל
  choice: 由以色列人献出的
  rationale: מֵאֵת 可标明来源，也可能带有代表、代替的意味。“由以色列人献出的”自然表达来源，同时不在正文中排除代表关系。
- source_word: וְהָיוּ לַעֲבֹד אֶת עֲבֹדַת יְהוָה
  choice: 这样，他们就可以承担事奉耶和华的工作
  rationale: 以结果关系表达 וְהָיוּ 与目的不定式，并用“承担……工作”体现动词与同根名词所强调的受派服役。
theological_decisions:
- issue: 利未人被称为“摇祭”是否意味着他们被献为牺牲
  choice: 保留“作为摇祭”，同时将礼仪动作译为“献上”
  alternative: 亚伦要把利未人摇献为摇祭
  rationale: 经文以祭礼性的呈献来描述利未人的分别为圣，并没有说他们被宰杀献祭。所选译法既保留原文的祭礼类别，也避免造成利未人被当作牺牲品的误解。
- issue: מֵאֵת בְּנֵי יִשְׂרָאֵל 所表达的来源或代表关系
  choice: 由以色列人献出的
  alternative: 代表以色列人
  rationale: 原文可以突出利未人来自以色列人，也可能表示他们代表以色列人承担圣所服役。正文保留来源意义，脚注说明代表意义，以免消除原文张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“摇祭”保留传统且准确的祭礼术语；通过“献上”和脚注帮助普通读者理解此处是礼仪性的呈献。“以色列人”在现代汉语中自然涵盖原文群体称谓 בְּנֵי יִשְׂרָאֵל。
