  text: וְ/הַֽעֲמַדְתָּ֙ אֶת הַ/לְוִיִּ֔ם לִ/פְנֵ֥י אַהֲרֹ֖ן וְ/לִ/פְנֵ֣י בָנָ֑י/ו וְ/הֵנַפְתָּ֥ אֹתָ֛/ם תְּנוּפָ֖ה לַֽ/יהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/013.yaml
  text: And you shall set the Levites before Aaron and before his sons[a], and you shall present them as a wave offering to Yahweh.
translation:
  language: zh_hans
  text: 你要使利未人站在亚伦和他儿子们面前，并把他们作为摇祭献给雅威。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译可作：“你要把他们向雅威摇献为摇祭。”希伯来文把表示礼仪性摇献的动词与“摇祭”这一同根名词连用。
    reason: 说明原文同根动词与名词的重复，并保留较直译的可能表达。
lexical_decisions:
- source_word: וְהַעֲמַדְתָּ
  choice: 你要使……站在
  rationale: עמד 的使役式表示使人站立或安排就位；此处保留使役含义，也符合礼仪场景。
- source_word: הַלְוִיִּם
  choice: 利未人
  rationale: 这是该支派群体的通行中文名称；汉语无需另行表达定冠词。
- source_word: לִפְנֵי
  choice: 在……面前
  rationale: 既可表达空间位置，也适合正式呈献的礼仪语境。
- source_word: אַהֲרֹן
  choice: 亚伦
  rationale: 采用现代中文圣经中通行的人名译法。
- source_word: בָנָיו
  choice: 他儿子们
  rationale: בנים 在这里特指亚伦的众子，即担任祭司者；明确保留阳性和复数。
- source_word: וְהֵנַפְתָּ
  choice: 并把他们……献上
  rationale: נוף 的使役式在祭祀语境中指摇献或礼仪性呈献。中文以“献上”自然表达其功能，并由“摇祭”保留专门礼仪术语。
- source_word: אֹתָם
  choice: 他们
  rationale: 宾语代词指前文的利未人。
- source_word: תְּנוּפָה
  choice: 作为摇祭
  rationale: תנופה 是祭祀礼仪中的专门名词；“摇祭”是准确、简洁且通行的中文对应词。
- source_word: לַיהוָה
  choice: 献给雅威
  rationale: ל 表示呈献的对象；“雅威”直接转写四字神名 יהוה。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；“雅威”较贴近其通常重构的读音，并保留其作为专名的性质。
- issue: 如何表达利未人所参与的礼仪动作
  choice: 把他们作为摇祭献给雅威
  alternative: 把他们向雅威摇一摇，作为摇祭；把他们作为呈献祭献给雅威
  rationale: 原文将 נוף 的动词与同根名词 תנופה 连用。正文保留“摇祭”这一礼仪类别，同时避免让现代读者误以为重点只是把人实际来回摇动；脚注交代原文同根重复。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“使……站在……面前”保留原文使役结构和礼仪位置；“作为摇祭献给”兼顾中文可读性与祭祀术语的准确性。脚注标记已置于正文相关句末。
