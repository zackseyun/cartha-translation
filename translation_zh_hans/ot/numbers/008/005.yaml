base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/005.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: zh_hans
  text: 雅威[a]对摩西说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文为“YHWH”（四字神名）；传统上译作“耶和华”或以“主”代称。
    reason: 说明神名的原文形式及常见传统译法。
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: 说
  rationale: 该动词连同叙事性连接形式引出常见的神谕叙事公式；现代汉语用“说”自然准确。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来语四字神名 YHWH 的通行学术拟音译出其专名性质，不以“主”这一称号代替。
- source_word: אֶל־מֹשֶׁה
  choice: 对摩西
  rationale: 介词 אֶל 标明说话的对象；“对摩西”符合现代汉语表达。
- source_word: לֵאמֹר
  choice: 以冒号引出下文
  rationale: 该不定式用于引出直接引语。汉语若机械译作“说”会形成“说……说”的重复，因此以句末冒号自然体现其功能。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。译作“雅威”保留其专名性质，也较接近现代学界对该名读音的重构；脚注同时说明希伯来文字母形式及传统替代译法。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。以冒号承接下一节的直接话语，避免照搬希伯来语公式而造成汉语重复。
