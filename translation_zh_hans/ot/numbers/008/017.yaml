  text: כִּ֣י לִ֤/י כָל בְּכוֹר֙ בִּ/בְנֵ֣י יִשְׂרָאֵ֔ל בָּ/אָדָ֖ם וּ/בַ/בְּהֵמָ֑ה בְּ/י֗וֹם הַכֹּתִ֤/י כָל בְּכוֹר֙ בְּ/אֶ֣רֶץ מִצְרַ֔יִם הִקְדַּ֥שְׁתִּי אֹתָ֖/ם לִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/017.yaml
  text: For every firstborn among the sons of Israel[a], among man and among beast, is mine. On the day I struck every firstborn in the land of Egypt[b], I consecrated them to myself.
translation:
  language: zh_hans
  text: 因为以色列人中一切头生的，无论是人还是牲畜，都是我的。我击杀埃及地一切头生的那一天，就把他们分别为圣，归给我。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 本句说明上文耶和华取利未人代替以色列一切头生者的理由；“因为”自然表达解释性的因果关系。
- source_word: לִי
  choice: 都是我的
  rationale: 介词短语在此表示归属；汉语用“是我的”清楚而自然。
- source_word: כָל בְּכוֹר
  choice: 一切头生的
  rationale: 保留希伯来语集合性表达，不增添原文未明说的“男性”；“头生的”也与五经祭仪语境相称。
- source_word: בִּבְנֵי יִשְׂרָאֵל
  choice: 以色列人中
  rationale: בני ישראל 在此指以色列群体；“以色列人”是现代普通话自然、准确的表达。
- source_word: בָּאָדָם וּבַבְּהֵמָה
  choice: 无论是人还是牲畜
  rationale: אָדָם 与 בְּהֵמָה 构成人与动物的类别对举；“牲畜”符合头生归属及出埃及记灾祸的语境，“无论……还是……”自然呈现二者均包括在内。
- source_word: בְּיוֹם הַכֹּתִי
  choice: 我击杀……的那一天
  rationale: נכה 在击打埃及头生者的具体叙事中指致死的打击；“击杀”准确承接逾越节灾祸语境，而“那一天”保留时间表达。
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: 埃及地
  rationale: 保留原文“地”的成分及五经叙事的庄重语感。
- source_word: הִקְדַּשְׁתִּי אֹתָם לִי
  choice: 就把他们分别为圣，归给我
  rationale: 使役形 קדשׁ 表示使之成为圣、专归神；“分别为圣”保留神圣归属的含义，“归给我”明确表达 לִי。
theological_decisions:
- issue: אָדָם 与 בְּהֵמָה 的人兽对举
  choice: 无论是人还是牲畜
  alternative: 在人和动物中
  rationale: אָדָם 在此泛指人类，不特指男性；בְּהֵמָה 在头生之物的祭仪和灾祸语境中宜译“牲畜”。此译既保留类别对举，也避免把“人”误解为仅指成年男子。
- issue: הִקְדַּשְׁתִּי 的神圣含义
  choice: 分别为圣，归给我
  alternative: 分别出来归给我
  rationale: 原词不只是一般性的划分，也包含成为圣、专属耶和华的含义；“分别为圣”保留这一祭仪和神学分量。
- issue: הַכֹּתִי 在长子之灾语境中的力度
  choice: 击杀
  alternative: 击打
  rationale: 动词本身可泛指击打，但本节明确回指埃及一切头生者死亡的灾祸；“击杀”按语境表达其致命结果，并未额外引入教义解释。
translation_notes:
  register: 采用现代、庄重而通顺的普通话。“头生的”“分别为圣”“埃及地”保留五经语境中的关键表达，同时避免生硬照搬希伯来语词序。
