  yaml_path: translation/ot/numbers/008/008.yaml
  text: Then they shall take one young bull and its grain offering of fine flour mixed with oil[a], and you shall take a second young bull for a sin offering.
translation:
  language: zh_hans
  text: 他们要取一头小公牛，以及同献的素祭，就是用油调和的细面；你要再取第二头小公牛作赎罪祭。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“作洁净祭”。希伯来语 חַטָּאת 在祭司礼仪语境中可指赎罪或洁净用的祭。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקְחוּ
  choice: 他们要取
  rationale: 这是带连接词的Qal完成式，在礼仪指示的连续语境中表达所吩咐的后续行动；用“要”自然传达指令意味，并保留第三人称复数。
- source_word: פַּר בֶּן בָּקָר
  choice: 一头小公牛
  rationale: 该希伯来语习语指牛群中的年轻公牛；量词“一头”符合现代汉语，也与后文“另取一头”相呼应。
- source_word: וּמִנְחָתוֹ
  choice: 以及同献的素祭
  rationale: מִנְחָה在祭祀语境中特指以谷物为材料的祭物，通常译作“素祭”；第三人称阳性单数后缀指与第一头公牛一同献上的素祭。“同献的”比直译“它的”更自然清楚。
- source_word: סֹלֶת
  choice: 细面
  rationale: 这是祭祀用精细面粉的固定术语；“细面”简洁且符合中文圣经礼仪用语。
- source_word: בְּלוּלָה בַשָּׁמֶן
  choice: 用油调和的
  rationale: 准确表达祭物制作时将细面与油混合的常见礼仪公式；“调和”自然、庄重。
- source_word: וּפַר שֵׁנִי בֶן בָּקָר תִּקַּח
  choice: 你要另取一头小公牛
  rationale: 原文动词转为第二人称阳性单数，译文明确保留“他们”到“你”的人称转换；שֵׁנִי表示第二头，用“另取一头”自然呈现其与第一头的区别。
- source_word: לְחַטָּאת
  choice: 作赎罪祭
  rationale: חַטָּאת在祭司礼仪语境中指传统所称的“赎罪祭”；中文采用通行且易懂的祭名，同时以脚注保留“洁净祭”这一强调礼仪洁净功能的译法。
theological_decisions:
- issue: 祭祀法规中חַטָּאת的译法
  choice: 赎罪祭
  alternative: 洁净祭
  rationale: 该词既与“罪”相关，也可指处理礼仪污秽、施行洁净的祭。正文采用中文读者熟悉的“赎罪祭”，脚注列出“洁净祭”，避免把词义和祭礼功能单一化。
translation_notes:
  register: 采用现代、庄重而易懂的礼仪用语。“素祭”“细面”“赎罪祭”沿用通行中文术语；以分号清楚标示原文从第三人称复数“他们”转向第二人称单数“你”。脚注标记置于相关祭名之后。
