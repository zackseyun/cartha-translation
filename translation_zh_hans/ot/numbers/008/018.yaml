  text: וָ/אֶקַּח֙ אֶת הַ/לְוִיִּ֔ם תַּ֥חַת כָּל בְּכ֖וֹר בִּ/בְנֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/018.yaml
  text: And I took the Levites in place of every firstborn among the sons of Israel[a].
translation:
  language: zh_hans
  text: 我取了利未人，代替以色列人中所有的长子。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וָאֶקַּח
  choice: 我取了
  rationale: 这是 לקח 的 Qal 叙事形式，基本义为“取、拿”。此处指上帝取利未人归自己、使他们承担特定职分；译作“取了”保留原文的具体表达，不额外解释为“拣选”或“接纳”。句首的 וַ 在本节独立呈现时无需机械译作“并且”。
- source_word: אֶת
  choice: 不另译
  rationale: 这是确定直接宾语标记，现代汉语没有对应的词。
- source_word: הַלְוִיִּם
  choice: 利未人
  rationale: 定冠词加复数族称，特指利未人；“利未人”是准确而通行的译法。
- source_word: תַּחַת
  choice: 代替
  rationale: 此处表达替代关系，并非空间意义的“在……下面”；“代替”自然清楚地传达利未人取代长子的意思。
- source_word: כָּל בְּכוֹר
  choice: 所有的长子
  rationale: כָּל 与单数 בְּכוֹר 连用具有周遍、逐一涵盖的作用。现代汉语用“所有的长子”比“每一个长子”更自然，同时保留全称范围。原文此处只说“长子”，不在正文增添“男性”。
- source_word: בִּבְנֵי יִשְׂרָאֵל
  choice: 以色列人中
  rationale: 字面结构是“以色列的众子中”，但这是希伯来语中对以色列群体的常用称呼。现代汉语“以色列人中”自然、准确，也避免把“以色列的儿子们”误解为族长雅各的亲生儿子。介词 בְּ 在此译为“中”。
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל 的群体称谓
  choice: 以色列人
  alternative: 以色列的众子／以色列子民
  rationale: 该短语形式上为阳性复数“以色列的众子”，在此作为以色列群体的固定称谓。译作“以色列人”保留其群体指向，并符合现代标准汉语，不把语法性别不必要地具体化为仅指亲生儿子。
- issue: 利未人与长子的替代关系
  choice: 代替
  alternative: 取代／替换
  rationale: תַּחַת 明确表达替代，但本节没有进一步说明这种替代的机制或神学性质；“代替”既保留关系，也不额外引入赎罪、交换或职分转移等解释。
translation_notes:
  register: 采用现代、庄重而简明的叙事语言。“我取了”保留上帝第一人称发言及原文动词的具体性；“代替以色列人中所有的长子”语序自然，并准确表达替代范围。本节无需脚注；英译关于“sons of Israel”的脚注所提示的字面形式，在简体中文正文中若照搬反而容易造成误解。
