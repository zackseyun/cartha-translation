base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/021.yaml
  text: And the Levites purified themselves and washed their garments[a], and Aaron presented them as a wave offering before Yahweh, and Aaron made atonement for them to cleanse them.
translation:
  language: zh_hans
  text: 利未人洁净了自己，也洗了衣服；亚伦在雅威面前把他们作为摇祭献上[a]，又为他们赎罪，使他们洁净。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在雅威面前把他们作为摇祭摇献。”希伯来文采用一个标准的祭仪表达，指把某物作为“摇祭”呈献在雅威面前。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְחַטְּאוּ
  choice: 洁净了自己
  rationale: 该词在祭司礼仪语境中表示使自己得到洁净；保留反身含义，但不增添原文未明说的“脱离罪”或“除罪”。
- source_word: וַיְכַבְּסוּ בִּגְדֵיהֶם
  choice: 洗了衣服
  rationale: 准确表达洗涤衣物这一洁净程序；“衣服”是现代汉语中自然、庄重且易懂的说法。
- source_word: וַיָּנֶף ... תְּנוּפָה
  choice: 把他们作为摇祭献上
  rationale: 这是固定的礼仪表达。译为“作为摇祭献上”既保留“摇祭”这一祭仪名称，又避免让读者误以为亚伦必定在字面上摇动众人的身体。
- source_word: לִפְנֵי יְהוָה
  choice: 在雅威面前
  rationale: לִפְנֵי 表示“在……面前”；יהוה 作为上帝的盟约之名音译为“雅威”。
- source_word: וַיְכַפֵּר עֲלֵיהֶם
  choice: 为他们赎罪
  rationale: כפר 在祭司礼仪语境中指施行赎罪；采用现代中文圣经语体中通行且可理解的“赎罪”，不进一步限定其机制。
- source_word: לְטַהֲרָם
  choice: 使他们洁净
  rationale: 不定式表达亚伦赎罪行动的目的或结果；译文保留这种关系，也保留 טהר 的礼仪洁净含义。
theological_decisions:
- issue: 如何区分并关联 חטא、כפר、טהר 的祭司礼仪用语
  choice: 分别译为“洁净了自己”“为他们赎罪”“使他们洁净”
  alternative: 将三者统一译作“洁净”，或把首个动词译成“除掉自己的罪”
  rationale: 所选译法保留三种相关但并不完全相同的礼仪动作，也不把首个动词明确化为原文此处没有直接说出的个人罪责。
- issue: 神圣名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；音译“雅威”保留其专名性质，并符合本项目当前处理原则。
- issue: 利未人作为 תְּנוּפָה 被献上的仪式图景
  choice: 作为摇祭献上
  alternative: 把他们摇一摇，作为摇祭
  rationale: 原文使用标准祭仪词组，但没有解释具体动作方式。正文保留祭名并避免将动作具象化过度，脚注则提示较直译的可能表达。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。以分号划分洁净程序与亚伦的祭仪行动；重复“洁净”以对应原文首尾两个不同词根所构成的礼仪结构，不刻意消除这种呼应。
