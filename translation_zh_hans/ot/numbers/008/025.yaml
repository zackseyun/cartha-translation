  text: And from fifty years old he shall withdraw from the service of the work and shall serve no more[a].
translation:
  language: zh_hans
  text: 从五十岁起，他要从职役中退下，不再执行职役[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “退下”或译“从职役中返回”；希伯来语动词直译为“返回、转回”，在这里指退出正式职役。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִבֶּן חֲמִשִּׁים שָׁנָה
  choice: 但从五十岁起
  rationale: 希伯来语年龄表达指从五十岁这一年龄界限开始；“从五十岁起”是自然、准确的现代汉语。连接词在此承接前文并形成年龄上的转折，译作“但”较合语境。
- source_word: יָשׁוּב
  choice: 退出
  rationale: שׁוב本义为“返回、转回”，与介词“从”连用并置于职务语境中，表示退出主动服役；“退出”传达语境义，同时以脚注保留其字面可能。
- source_word: מִצְּבָא הָעֲבֹדָה
  choice: 退出服役
  rationale: צָבָא在本段不是军事作战，而是利未人的编制服役或职务；עֲבֹדָה说明其工作性质。汉语若直译为“工作的服役”生硬，故整合为“服役”。
- source_word: וְלֹא יַעֲבֹד עוֹד
  choice: 不再供职
  rationale: עבד在此指继续履行所分派的职务。“供职”与利未人的正式职务语境相符，也避免被理解为从此完全不做任何工作。
theological_decisions:
- issue: 五十岁后停止服役的范围
  choice: 不再供职
  alternative: 不再工作
  rationale: 上下文限定的是利未人所承担的正式职役，并非宣告五十岁后不得从事任何活动；译文保持这一语境范围，不额外引入教派性解释。
translation_notes:
  register: 采用现代、庄重且易懂的标准普通话。“退出服役”简洁表达希伯来语职务用语，“供职”则与前半句呼应，并保留正式职役的语域。
