  text: כִּי֩ נְתֻנִ֨ים נְתֻנִ֥ים הֵ֨מָּה֙ לִ֔/י מִ/תּ֖וֹךְ בְּנֵ֣י יִשְׂרָאֵ֑ל תַּחַת֩ פִּטְרַ֨ת כָּל רֶ֜חֶם בְּכ֥וֹר כֹּל֙ מִ/בְּנֵ֣י יִשְׂרָאֵ֔ל לָקַ֥חְתִּי אֹתָ֖/ם לִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/016.yaml
  text: For they are wholly given to me from among the sons of Israel[a]; in place of everyone who opens the womb, the firstborn of all the sons of Israel[c][b], I have taken them for myself.
translation:
  language: zh_hans
  text: 因为他们是从以色列子孙中完全赐给我的[a]；我取了他们归我自己，代替凡开母腹的[b]，就是以色列子孙中所有的长子[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“确实赐给我的”或“全然赐给我的”；希伯来文重复“赐给”一词，以加强语气。
    reason: lexical_alternative
  - marker: b
    text: “凡开母腹的”是希伯来语表达，指首先从母腹出来的，即头生的。
    reason: lexical_alternative
  - marker: c
    text: “以色列子孙”也可译作“以色列人”或“以色列民”；希伯来文直译为“以色列的众子”。
    reason: lexical_alternative
lexical_decisions:
- source_word: נְתֻנִים נְתֻנִים
  choice: 完全赐给
  rationale: 希伯来文重复被动分词“赐给”，用来加强语气。“完全赐给”以自然的现代汉语表达这种强调，同时保留利未人被专门交付给上帝的含义。
- source_word: לִי
  choice: 给我的
  rationale: 这里的介词形式表示归属或奉献；放在“赐给我的”这一结构中，既准确又自然。
- source_word: מִתּוֹךְ בְּנֵי יִשְׂרָאֵל
  choice: 从以色列众子中
  rationale: מִתּוֹךְ 表示从某一群体内部选出；“从……中”清楚表达这一关系，“以色列众子”保留原文的男性家族称谓。
- source_word: תַּחַת
  choice: 代替
  rationale: 此处表示替代关系，即利未人被取来代替以色列人的长子；“代替”简洁、明确。
- source_word: פִּטְרַת כָּל רֶחֶם
  choice: 一切开母腹的
  rationale: 保留希伯来文关于首先从母腹出来者的形象，并由后面的“长子”加以解释。
- source_word: בְּכוֹר כֹּל מִבְּנֵי יִשְׂרָאֵל
  choice: 就是以色列众子中所有的长子
  rationale: 该同位语解释前面的“开母腹的”。加入“就是”使原文解释关系在现代汉语中清楚，同时保留其范围。
- source_word: לָקַחְתִּי אֹתָם לִי
  choice: 我已经取了他们归我自己
  rationale: 完成式表达已经施行的取用，末尾的 לִי 突出上帝对他们的归属要求；“归我自己”自然传达这一含义。
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל 的译法
  choice: 以色列众子
  alternative: 以色列人；以色列民；以色列子孙
  rationale: 原文明确采用男性家族称谓“以色列的众子”。正文保留这一形式，不将其性别表达静默中性化；脚注同时说明它在本语境中可指整个以色列群体。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“完全赐给”避免照搬希伯来文重复所造成的生硬感；“开母腹的”保留原文意象，并以脚注解释；“以色列众子”有意保留原文家族性、男性化的表达。
