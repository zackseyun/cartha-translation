  text: קַ֚ח אֶת הַ/לְוִיִּ֔ם מִ/תּ֖וֹךְ בְּנֵ֣י יִשְׂרָאֵ֑ל וְ/טִהַרְתָּ֖ אֹתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/006.yaml
  text: Take the Levites from among the sons of Israel and cleanse them[a].
translation:
  language: zh_hans
  text: 你要从以色列人[a]中选取利未人，洁净他们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“以色列的众子”；也可译作“以色列民”。
    reason: 说明希伯来语的字面形式及可行的群体称谓。
lexical_decisions:
- source_word: קַח
  choice: 选取
  rationale: 这是לקח的第二人称阳性单数祈使式；在这里命令摩西从以色列群体中取出利未人。“选取”在现代汉语中自然，也表达从较大群体中取出的语境意义，但不额外说明其后全部礼仪安排。
- source_word: הַלְוִיִּם
  choice: 利未人
  rationale: 指被指定承担会幕事务的利未支派成员；“利未人”是准确、通行的中文称谓。
- source_word: מִתּוֹךְ
  choice: 从……中
  rationale: 表示从一个较大的群体内部取出，中文“从……中”简洁自然，并保留分离出来的含义。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 原文直译为“以色列的众子”，在此作为以色列群体的惯用称谓。“以色列人”是现代汉语中自然且范围准确的表达；直译形式列入脚注。
- source_word: וְטִהַרְתָּ אֹתָם
  choice: 洁净他们
  rationale: טהר在本段礼仪语境中指使人达到洁净状态。“洁净”保留礼仪含义，也符合庄重而易懂的现代中文表达。
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל的群体称谓与性别形式
  choice: 以色列人
  alternative: 以色列的众子
  rationale: 该短语形式上是阳性复数并带有家族与圣约群体色彩，但在这里惯用地指以色列群体。正文采用自然准确的“以色列人”，脚注保留原文直译，以免抹去其字面形式。
- issue: טהר的礼仪含义
  choice: 洁净
  alternative: 使……清洁；使……纯净
  rationale: 上下文涉及利未人供职前的礼仪处理，因此采用可同时承载礼仪与一般洁净含义的“洁净”，不进一步加入原文未明说的神学解释。
translation_notes:
  register: 采用庄重、简洁的现代标准普通话。“你要……”明确表达对摩西的单数命令；句式紧凑，适合律法叙事语境。
