translation:
  language: zh_hans
  text: “你要对亚伦说：‘你安放灯盏的时候[a]，七盏灯都要向着灯台前方发光。’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你点灯的时候。”希伯来语动词的字面意思是“使之上升”；在这里既可能指点亮灯盏，也可能指把灯盏安放妥当，使灯光向前照射。
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר ... וְאָמַרְתָּ אֵלָיו
  choice: 你要告诉亚伦，对他说
  rationale: 保留原文“说……对他说”的双重言说结构及正式命令语气，同时采用自然的现代汉语表达。
- source_word: בְּהַעֲלֹתְךָ
  choice: 你安放灯盏的时候
  rationale: 该词是עלה的使役式，字面为“使之上升”；在灯具语境中既可能指点灯，也可能指把灯盏装上、安放妥当。正文采用“安放”以配合下文关于照射方向的说明，并以脚注保留“点灯”的可能。
- source_word: הַנֵּרֹת
  choice: 灯盏
  rationale: נֵר在此指灯具而非抽象的光；“灯盏”适合会幕器具的语境，也能与“灯台”清楚区分。
- source_word: אֶל מוּל פְּנֵי הַמְּנוֹרָה
  choice: 向灯台前方
  rationale: 表达אֶל מוּל פְּנֵי所含的朝向关系，比单说“在灯台前面”更清楚地体现灯光所朝的方向。
- source_word: יָאִירוּ
  choice: 照亮
  rationale: אור的使役式表示“发光、使明亮”；“照亮”在汉语中自然体现其使役及投射光线的含义。
- source_word: שִׁבְעַת הַנֵּרוֹת
  choice: 七盏灯都
  rationale: 准确表达七盏灯这一完整组别；添加“都”符合汉语数量短语的自然表达，不增加原文之外的对象。
- source_word: הַמְּנוֹרָה
  choice: 灯台
  rationale: 按器物功能翻译מְנוֹרָה，不作音译；“灯台”是简洁、通行且适合会幕语境的名称。
