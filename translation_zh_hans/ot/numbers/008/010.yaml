  text: וְ/הִקְרַבְתָּ֥ אֶת הַ/לְוִיִּ֖ם לִ/פְנֵ֣י יְהוָ֑ה וְ/סָמְכ֧וּ בְנֵי יִשְׂרָאֵ֛ל אֶת יְדֵי/הֶ֖ם עַל הַ/לְוִיִּֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/010.yaml
  text: You shall bring the Levites before Yahweh[a], and the sons of Israel shall lay their hands on the Levites.
translation:
  language: zh_hans
  text: 你要把利未人带到雅威面前；以色列人[a]要把手按在利未人身上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“以色列的儿子们”，这是对以色列民的惯用集体称呼。
    reason: 说明希伯来文的字面形式及其集体用法，避免现代读者误以为这里只指雅各的直接儿子或仅强调男性。
lexical_decisions:
- source_word: וְהִקְרַבְתָּ
  choice: 你要把……带到……面前
  rationale: 使役形表示“使靠近、带近、呈到”。结合 לִפְנֵי，在礼仪语境中译为“带到……面前”既保留方向性，也符合现代汉语表达。
- source_word: הַלְוִיִּם
  choice: 利未人
  rationale: לוי 的带定冠词复数形式，指利未群体；“利未人”是准确而通行的汉语称呼。
- source_word: לִפְנֵי יְהוָה
  choice: 到雅威面前
  rationale: לִפְנֵי 可表示“在……面前、来到……面前”；与“带近”连用时，“带到雅威面前”自然地呈现礼仪性的临在与方向。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以专名“雅威”音译四字神名，区别于作为称号的“主”，并保留原文直接使用圣约之名的特点。
- source_word: וְסָמְכוּ ... אֶת יְדֵיהֶם עַל
  choice: 要把手按在……身上
  rationale: סמך 与“手”和介词 עַל 构成礼仪性的按手表达。“把手按在……身上”准确、清楚，也符合现代汉语习惯。
- source_word: בְנֵי יִשְׂרָאֵל
  choice: 以色列人[a]
  rationale: 原文字面为“以色列的儿子们”，但这是指以色列群体的惯用集体称谓。正文采用自然的“以色列人”，脚注保留其字面形式供读者查考。
- source_word: יְדֵיהֶם
  choice: 手
  rationale: 希伯来文为复数“他们的手”。汉语在复数主语和按手结构中通常用无标记的“手”，已自然表达每个人所按的手，无须生硬地译作“他们的双手”。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用神的专名。正文采用较贴近学界通常重构读音的“雅威”，不以称号“主”替代；“耶和华”是汉语传统中另一种常见音译。
- issue: בְנֵי יִשְׂרָאֵל 的集体含义与字面性
  choice: 正文译“以色列人”，脚注注明字面形式
  alternative: 以色列的众子孙
  rationale: 该短语虽采用阳性复数“儿子们”，却是指以色列民族共同体的标准表达。直译在现代汉语中容易被误解为只包括男性或直接儿子，因此正文表达其惯用意义，同时用脚注透明呈现原文形式，不额外判定参与按手者的具体代表机制。
translation_notes:
  register: 采用现代、庄重而易懂的叙述语体。“带到……面前”和“把手按在……身上”保留礼仪动作的具体性；分号清楚连接两项连续指令。
