revisions:
- from: 摩西、亚伦和以色列子孙的全会众，就照雅威吩咐摩西有关利未人的一切，向利未人行了；以色列子孙[a]就这样向他们行了。
  to: 摩西、亚伦和以色列子孙的全会众，都照着雅威就利未人所吩咐摩西的一切而行；以色列子孙[a]就这样对待他们。
  rationale: 修订仅改善中文句法与搭配：以“照着……而行”对应עשה的宽泛执行义，以“对待他们”自然表达末句“向他们行了”。“就利未人所吩咐摩西的一切”准确保留命令由雅威发给摩西、内容关于利未人的关系；末句仍保留原文的总结性重复。
