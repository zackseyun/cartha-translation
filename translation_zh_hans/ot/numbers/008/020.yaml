  naturalness: 原句“照……的一切，向利未人行了”在现代汉语中搭配生硬，“向……行了”尤其不自然。将命令的主题前置为“雅威就利未人所吩咐摩西的一切”，并以“照着……而行／对待他们”表达，可保留原文概括性和重复，同时更合乎现代庄重书面语。
  terminology: “雅威”“利未人”“会众”“以色列子孙”均可保留。“以色列子孙”的脚注准确说明其为群体性惯用称谓；不应把它限定为仅男性后代。
