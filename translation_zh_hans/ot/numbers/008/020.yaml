  text: וַ/יַּ֨עַשׂ מֹשֶׁ֧ה וְ/אַהֲרֹ֛ן וְ/כָל עֲדַ֥ת בְּנֵי יִשְׂרָאֵ֖ל לַ/לְוִיִּ֑ם כְּ֠/כֹל אֲשֶׁר צִוָּ֨ה יְהוָ֤ה אֶת מֹשֶׁה֙ לַ/לְוִיִּ֔ם כֵּן עָשׂ֥וּ לָ/הֶ֖ם בְּנֵ֥י יִשְׂרָאֵֽל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/020.yaml
  text: So Moses and Aaron and all the congregation of the sons of Israel did to the Levites according to all that Yahweh had commanded Moses concerning the Levites[a]; so the sons of Israel did to them.
translation:
  language: zh_hans
  text: 摩西、亚伦和以色列子孙的全会众，都照着雅威就利未人所吩咐摩西的一切而行；以色列子孙[a]就这样对待他们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “以色列子孙”也可译作“以色列人”；这是指以色列立约共同体的惯用表达。
    reason: 说明希伯来文家族性群体称谓的现代含义及译法选择。
lexical_decisions:
- source_word: וַיַּעַשׂ / עָשׂוּ
  choice: 行了
  rationale: עָשָׂה含义宽泛，可指“做、行”。这里指按先前命令向利未人采取行动；译作“行了”既保留概括性，也不擅自限定具体礼仪。
- source_word: עֲדַת
  choice: 全会众
  rationale: עֵדָה在此指以色列立约群体；“会众”保留五经语境中的正式共同体含义，“全”对应כָל。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列子孙
  rationale: 保留希伯来文的家族性群体称谓；在现代中文圣经语体中庄重而易懂，并可指整个以色列共同体。
- source_word: לַלְוִיִּם / לָהֶם
  choice: 向利未人／向他们
  rationale: 介词ל在此标示行动所针对的对象；“向”自然地保留这种关系，不将其窄化为单纯受益。
- source_word: כְּכֹל אֲשֶׁר
  choice: 照……的一切
  rationale: 表达行动与命令完全相符，并保留כֹל的全面含义。
- source_word: צִוָּה
  choice: 吩咐
  rationale: 在神向摩西发出命令的叙事语境中，“吩咐”自然、庄重，也明确体现权威。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代中文常见音译呈现四字神名，而不以称号替代。
- source_word: אֶת מֹשֶׁה לַלְוִיִּם
  choice: 吩咐摩西有关利未人的
  rationale: 第二个ל表明命令涉及利未人；“有关利未人的”保留其主题关系，不误解为命令是向利未人发出的。
- source_word: כֵּן
  choice: 就这样
  rationale: 承接上文并强调以色列子孙的行动与命令相符，同时保留原文总结性的重复。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名。正文采用“雅威”作为较贴近学界通常重构读音的现代中文音译，避免以“主”等称号替代专名。
- issue: בְּנֵי יִשְׂרָאֵל的群体范围
  choice: 以色列子孙
  alternative: 以色列人
  rationale: 保留原文家族性、立约群体性的表达；脚注说明该词组在这里统指以色列共同体，避免把“子孙”误读为只限男性。
- issue: 原文重复的保留
  choice: 保留“向利未人行了……就这样向他们行了”的总结性重复
  alternative: 合并为一句较简洁的中文
  rationale: 重复强调全体以色列人准确执行雅威的命令；保留它可呈现原文的修辞重点，而不将其视为冗余删除。
translation_notes:
  register: 采用现代、庄重的叙事语体。“照……的一切”及末句重复略带经文式节奏，是为保留希伯来文对完全遵命的强调；整体仍保持普通读者可理解。
