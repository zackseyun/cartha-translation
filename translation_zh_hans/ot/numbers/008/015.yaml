  text: וְ/אַֽחֲרֵי כֵן֙ יָבֹ֣אוּ הַ/לְוִיִּ֔ם לַ/עֲבֹ֖ד אֶת אֹ֣הֶל מוֹעֵ֑ד וְ/טִֽהַרְתָּ֣ אֹתָ֔/ם וְ/הֵנַפְתָּ֥ אֹתָ֖/ם תְּנוּפָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/015.yaml
  text: And after that the Levites shall come to serve at the tent of meeting[b][a], and you shall cleanse them and wave them as a wave offering.
translation:
  language: zh_hans
  text: 此后，利未人要来，在会幕供职；你要洁净他们[a]，又要把他们作为摇祭呈献[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“使他们洁净”。这里的希伯来语动词指礼仪上的洁净。
    reason: lexical_alternative
  - marker: b
    text: 即按礼仪在耶和华面前把他们作为摇祭呈献。
    reason: cultural_note
lexical_decisions:
- source_word: וְאַחֲרֵי כֵן
  choice: 此后
  rationale: 明确承接前面的洁净与奉献礼仪，简洁自然地保留时间次序。
- source_word: יָבֹאוּ הַלְוִיִּם
  choice: 利未人要来
  rationale: בוא 的基本义为“来、进入”；“要来”符合本段指示性语境，又不把动作过度限定为进入帐幕内部。
- source_word: לַעֲבֹד אֶת אֹהֶל מוֹעֵד
  choice: 在会幕那里服事
  rationale: עבד 在礼仪语境中指承担事奉工作；原文以会幕为关联对象，汉语用“在会幕那里服事”既自然，也避免误解为服事会幕这件物体。
- source_word: וְטִהַרְתָּ אֹתָם
  choice: 你要洁净他们
  rationale: טהר 在此指礼仪上的洁净；“洁净”通俗而保留祭仪含义。
- source_word: וְהֵנַפְתָּ אֹתָם תְּנוּפָה
  choice: 把他们当作摇祭献上
  rationale: 保留 נוף／תנופה 的特定祭仪意象和利未人本身作为礼仪奉献对象的突出表达；“献上”说明这是向耶和华作的礼仪呈献，而非普通挥动。
theological_decisions:
- issue: 利未人奉献礼中的祭仪用语
  choice: 保留“洁净”和“摇祭”等明确祭仪术语
  alternative: 意译为“使他们纯洁并把他们呈献出来”或概括为“将他们分别为圣”
  rationale: 本节描述具体的礼仪行为，而不只是一般性的任命；保留这些术语能维持经文的祭仪框架，同时不引入后来的宗派性解释。
- issue: 利未人被当作摇祭的特殊表述
  choice: 把他们当作摇祭献上
  alternative: 把他们呈献出来
  rationale: 原文明确以“他们”为动词宾语，并使用“摇祭”同源名词；译文保留这一不寻常而有神学张力的形象，不将其淡化为普通委任。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“会幕”沿用通行圣经术语；以短句避免多个“并且”造成生硬。脚注标记均置于所说明的正文之后。
