  terminology: “利未人”及“会幕”均为中文圣经语境中稳定、易懂的标准术语。“服役”保留该希伯来习语的职责及军事语感；脚注列出“任职”“当班办事”等替代译法，处理得当，且标记[a]紧随相关用语。
