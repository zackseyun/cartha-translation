  text: זֹ֖את אֲשֶׁ֣ר לַ/לְוִיִּ֑ם מִ/בֶּן֩ חָמֵ֨שׁ וְ/עֶשְׂרִ֤ים שָׁנָה֙ וָ/מַ֔עְלָ/ה יָבוֹא֙ לִ/צְבֹ֣א צָבָ֔א בַּ/עֲבֹדַ֖ת אֹ֥הֶל מוֹעֵֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/024.yaml
  text: 'This is what pertains to the Levites: from twenty-five years old and upward[a], he shall come to do duty in the service of the tent of meeting.'
translation:
  language: zh_hans
  text: 以下是关于利未人的规定：利未人从二十五岁起，就要来服役[a]，办理会幕的事务。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “服役”所译的希伯来语是表示当班尽职的习语，并带有从军服役的意味；也可译作“任职”或“当班办事”。
    reason: 保留 לִצְבֹא צָבָא 在礼仪职务语境中的职责含义及其军事色彩。
lexical_decisions:
- source_word: זֹאת אֲשֶׁר לַלְוִיִּם
  choice: 以下是关于利未人的规定
  rationale: 该结构引出适用于利未人的条例。“以下是关于……的规定”在现代汉语中自然、庄重，也保留了原文的法规语气。
- source_word: מִבֶּן חָמֵשׁ וְעֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: 从二十五岁起
  rationale: 原文表达最低年龄界限；“从二十五岁起”简洁自然，准确包含“二十五岁及以上”的意思。
- source_word: יָבוֹא
  choice: 要来
  rationale: 保留原文“来、进入”的动作以及指令语气；汉语动词本身不标单复数，可自然涵盖原文以单数形式表述的集体法规。
- source_word: לִצְבֹא צָבָא
  choice: 服役
  rationale: 这是表示履行当班职责的习语，并带有军事服役色彩。“服役”在会幕语境中可指承担规定的职务，同时保留原文隐约的军事意味；其他可能译法列入脚注。
- source_word: בַּעֲבֹדַת
  choice: 办理……的事务
  rationale: עֲבֹדָה 指受委派的工作或职事。“办理……的事务”与前面的“服役”搭配自然，并避免机械重复“服事”。
- source_word: אֹהֶל מוֹעֵד
  choice: 会幕
  rationale: 这是该圣所称谓在现代中文圣经语境中的通行译法，简明且为普通读者熟悉。
theological_decisions:
- issue: 集体对象与单数动词
  choice: 利未人……要来
  alternative: 他们……要来
  rationale: 希伯来文针对利未人这一群体，却使用单数动词。汉语“利未人……要来”不强行添加复数代词，既自然，也不消除原文集体法规与单数表述之间的形式张力。
- issue: לִצְבֹא צָבָא 的职役与军事色彩
  choice: 服役
  alternative: 任职／当班办事
  rationale: 本节语境是会幕职务，并非实际作战；但原文习语确有军事用语的回响。“服役”兼顾两面，不把它神学化为某种特定宗派的圣职观。
translation_notes:
  register: 采用现代、庄重而易懂的法规语体。“关于……的规定”明确引入条例；“服役”与“办理……的事务”避免重复，同时保留原文职责用语的力度。脚注标记[a]已置于相应词语之后。
