  text: וְ/הִקְרַבְתָּ֙ אֶת הַ/לְוִיִּ֔ם לִ/פְנֵ֖י אֹ֣הֶל מוֹעֵ֑ד וְ/הִ֨קְהַלְתָּ֔ אֶֽת כָּל עֲדַ֖ת בְּנֵ֥י יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/009.yaml
  text: Then you shall bring the Levites before the tent of meeting[a], and you shall assemble the whole congregation of the sons of Israel.
translation:
  language: zh_hans
  text: 你要把利未人带到会幕前，又要召集以色列全会众[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“以色列人的全会众”。希伯来文直译“以色列的众子”。
    reason: 说明 בְּנֵי יִשְׂרָאֵל 的字面形式，并保留自然的中文替代译法。
lexical_decisions:
- source_word: וְהִקְרַבְתָּ
  choice: 你要把……带到……前
  rationale: קרב 的使役式表示“使靠近、带近前来”。在礼仪指令中译为“带到……前”自然清楚，也保留朝圣所移近的含义；句首连接词在连续指令中无需机械译出。
- source_word: הַלְוִיִּם
  choice: 利未人
  rationale: 这是利未支派成员的标准称谓，符合本段分别他们从事会幕事务的语境。
- source_word: לִפְנֵי
  choice: 前
  rationale: 该介词表示“在……面前／前方”；与“带到”搭配为“带到会幕前”，既自然又保留空间及礼仪意味。
- source_word: אֹהֶל מוֹעֵד
  choice: 会幕
  rationale: 这是该圣所名称在现代中文圣经语境中准确、简明且广为理解的固定译法。
- source_word: וְהִקְהַלְתָּ
  choice: 又要召集
  rationale: קהל 的使役式意为使群体聚集；“召集”准确表达由摩西组织全体会众集合的正式行动。“又”体现连接和接续关系。
- source_word: כָּל עֲדַת
  choice: 全会众
  rationale: עֵדָה 在此指以色列共同体或其正式集会；“全会众”简洁传达 כָּל 所表示的整体性。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列众子
  rationale: 该短语字面为“以色列的众子”，形式上是阳性复数，并在此统称盟约群体。正文保留其亲子性表达，较顺畅的“以色列人”列入脚注。
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל 的群体称谓与性别形式
  choice: 以色列众子
  alternative: 以色列人
  rationale: 原文以阳性复数“众子”称整个以色列群体。正文保留原文明确的亲子性和语法形式，不把它无提示地中性化；脚注提供现代汉语中更自然、且在此处所指相同的群体称谓。
translation_notes:
  register: 采用现代、庄重而清楚的指令体。“会幕”“利未人”“会众”保留五经礼仪语境中的常用术语；避免生硬复制希伯来语句法，同时在“以色列众子”处保留原文形式，并以脚注辅助普通读者理解。
