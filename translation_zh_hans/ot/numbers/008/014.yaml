base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/014.yaml
  text: So you shall separate the Levites from among the sons of Israel[c][b][a], and the Levites shall be mine.
translation:
  language: zh_hans
  text: 这样，你要把利未人从以色列子孙[b]中分别出来[a]；利未人要归我[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “分别出来”或译“分出来”。
    reason: lexical_alternative
  - marker: b
    text: “以色列子孙”或译“以色列人”；希伯来文直译为“以色列的众子”。
    reason: lexical_alternative
  - marker: c
    text: “归我”或译“属于我”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִבְדַּלְתָּ
  choice: 这样，你要……分别出来
  rationale: הבד 的使役式表示“使分开、分别出来”。“分别出来”直接表达从群体中分离的动作；句首 וְ 按上下文中的程序承接关系译为“这样”。
- source_word: אֶת הַלְוִיִּם
  choice: 利未人
  rationale: 这是带定冠词的复数名词，指利未支派成员；“利未人”是现代中文圣经语境中通行且清楚的称呼。
- source_word: מִתּוֹךְ
  choice: 从……中
  rationale: 表示从一个较大群体内部选出或分离，“从……中”是自然、准确的现代汉语表达。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列子孙
  rationale: 直译为“以色列的众子”。“以色列子孙”保留原文的家族性表达，同时在中文中庄重易懂；“以色列人”则是更自然的替代译法。
- source_word: וְהָיוּ לִי
  choice: 要归我
  rationale: היה 加 לִי 表示属于说话者。“归我”自然地传达所有或特殊归属关系，又不额外加入原文未明说的献身或奉献术语。
- source_word: הַלְוִיִּם
  choice: 利未人
  rationale: 原文再次明确说“利未人”，形成强调；译文保留重复，不以代词替代。
theological_decisions:
- issue: 利未人的身份应译作单纯归属，还是明确译作礼仪上的奉献
  choice: 利未人要归我
  alternative: 利未人要献给我
  rationale: 本节的 לִי 与 היה 直接表达“属于我、归我”。虽然上下文涉及礼仪性的分别与奉献，本句本身没有使用明确表示“奉献”的词，因此保留归属说法，让上下文呈现其神学意义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“这样”承接前文的程序安排；保留两次“利未人”以反映原文的重复和强调。
