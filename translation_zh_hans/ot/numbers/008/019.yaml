  text: וָ/אֶתְּנָ֨/ה אֶת הַ/לְוִיִּ֜ם נְתֻנִ֣ים לְ/אַהֲרֹ֣ן וּ/לְ/בָנָ֗י/ו מִ/תּוֹךְ֮ בְּנֵ֣י יִשְׂרָאֵל֒ לַ/עֲבֹ֞ד אֶת עֲבֹדַ֤ת בְּנֵֽי יִשְׂרָאֵל֙ בְּ/אֹ֣הֶל מוֹעֵ֔ד וּ/לְ/כַפֵּ֖ר עַל בְּנֵ֣י יִשְׂרָאֵ֑ל וְ/לֹ֨א יִהְיֶ֜ה בִּ/בְנֵ֤י יִשְׂרָאֵל֙ נֶ֔גֶף בְּ/גֶ֥שֶׁת בְּנֵֽי יִשְׂרָאֵ֖ל אֶל הַ/קֹּֽדֶשׁ־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/019.yaml
  text: And I have given the Levites as a gift to Aaron and to his sons from among the sons of Israel[a], to do the service of the sons of Israel in the tent of meeting, and to make atonement for the sons of Israel[c][b], so that there may not be a plague among the sons of Israel when the sons of Israel come near to the holy place.
translation:
  language: zh_hans
  text: 我把利未人从以色列人中赐给亚伦和他的儿子们，作为礼物[a]，使他们在会幕中执行以色列人的事奉，并为以色列人赎罪[b]，免得以色列人接近圣所[c]时，他们中间遭受灾殃。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文在“赐给”之后重复同一词根，称利未人为“被赐下的”，以示强调；也可译作“我把利未人，就是从以色列人中赐给亚伦和他儿子们的，赐下”。
    reason: 说明希伯来文נתן词根的重复，并提供较贴近句法的译法。
  - marker: b
    text: “赎罪”也可指施行使人得洁净、蒙遮盖的礼仪行动；原文没有说明利未人以何种方式履行这一职分。
    reason: 保留כפר在祭祀语境中的语义范围，不预断具体机制。
  - marker: c
    text: 原文直译可为“圣处”；在本节会幕语境中可指圣所或神圣区域。
    reason: 说明הַקֹּדֶשׁ的具体而未完全限定的指涉。
lexical_decisions:
- source_word: וָאֶתְּנָה אֶת הַלְוִיִּם נְתֻנִים
  choice: 我……把利未人作为赐予的人，赐给
  rationale: 把נתן词根的重复明确译出，保留“赐予……作为赐予的人”的强调；虽不如“作为礼物”简洁，却避免把人直接物化为礼物，并忠实呈现被交付的状态。
- source_word: מִתּוֹךְ בְּנֵי יִשְׂרָאֵל
  choice: 从以色列众子中
  rationale: 保留“从……中选出”的含义，也保留בני ישראל的字面盟约群体称谓。
- source_word: לַעֲבֹד אֶת עֲבֹדַת בְּנֵי יִשְׂרָאֵל
  choice: 办理以色列众子的事务
  rationale: 用自然现代汉语表达עבד的同根词组合，同时保留这是以色列众子所负事务的含义，不擅自增译“代替”。
- source_word: בְּאֹהֶל מוֹעֵד
  choice: 在会幕中
  rationale: “会幕”是现代中文圣经语境中清楚、通行的固定名称，准确指向相会之帐幕。
- source_word: וּלְכַפֵּר עַל
  choice: 并为……赎罪
  rationale: 保留祭祀语境中כפר的赎罪含义，不将其缩减为一般性的洁净或保护。
- source_word: נֶגֶף
  choice: 灾祸
  rationale: 该词可指击打、瘟疫或致命灾害；“灾祸”保留范围，避免无充分依据地限定为传染性瘟疫。
- source_word: בְּגֶשֶׁת
  choice: 走近……时
  rationale: 将介词加不定式结构自然地译为时间从句，并保留接近神圣区域的动作。
- source_word: הַקֹּדֶשׁ
  choice: 圣所
  rationale: 在会幕语境中指神圣区域；“圣所”自然且具体，但不进一步限定为圣所内部某一区域。
theological_decisions:
- issue: 利未人的赎罪作用
  choice: 直译为“为以色列众子赎罪”
  alternative: 解释为利未人仅借着守卫圣所、阻止百姓擅近而免除灾祸
  rationale: 原文明言利未人的职分包括לכפר על；译文保留这一神学张力，不用后来的祭司职分划分来弱化或重释。
- issue: בְּנֵי יִשְׂרָאֵל的群体称谓
  choice: 以色列众子
  alternative: 以色列人／以色列民
  rationale: “众子”较直接保留原文男性复数和盟约家族表达；脚注提供更自然的群体称法。
- issue: 灾祸与接近圣所的关系
  choice: 明确译作目的／结果：“这样……就不会发生灾祸”
  alternative: 仅并列陈述没有灾祸
  rationale: 保留וְלֹא所表达的预防性目的或结果关系，同时不详解灾祸发生的具体机制。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“作为赐予的人”略带原文色彩，旨在保留希伯来文“赐给／被赐予”的同根强调；其余句法作适度汉语化处理。所有脚注标记均置于相关正文之后。
