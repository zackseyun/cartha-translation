  to: 我把利未人从以色列人中赐给亚伦和他的儿子们，作为礼物[a]，使他们在会幕中执行以色列人的事奉，并为以色列人赎罪[b]，免得以色列人接近圣所[c]时，他们中间遭受灾殃。
