base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/022.yaml
  text: And after that the Levites came to perform their service in the tent of meeting before Aaron and before his sons. Just as Yahweh had commanded Moses concerning the Levites[a], so they did for them.
translation:
  language: zh_hans
  text: 此后，利未人来到会幕中，在亚伦和他儿子们面前供职。耶和华怎样吩咐摩西有关利未人的事，他们就怎样为利未人行了[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们就怎样向利未人行了”，也可理解为“他们就在利未人身上照样行了”。希伯来文在这里十分简练，可能是指按规定为利未人施行前述礼仪。
    reason: 保存 לָהֶם 的关系含义以及末句所指行动的简洁与歧义。
lexical_decisions:
- source_word: וְאַחֲרֵי כֵן
  choice: 此后
  rationale: 既自然表达前后次序，也承接上文洁净和奉献利未人的礼仪。
- source_word: בָּאוּ הַלְוִיִּם לַעֲבֹד אֶת עֲבֹדָתָם
  choice: 利未人就来……办理他们的事务
  rationale: 保留“来”以及目的含义；“办理……事务”表达会幕中的职分与劳作，又避免生硬重复“服事他们的服事”。
- source_word: בְּאֹהֶל מוֹעֵד
  choice: 在会幕里
  rationale: “会幕”是 אֹהֶל מוֹעֵד 的通行中文名称；“在……里”对应介词 בְּ，但不额外限定具体活动区域。
- source_word: לִפְנֵי אַהֲרֹן וְלִפְנֵי בָנָיו
  choice: 亚伦和他儿子们面前
  rationale: 按字面保留“面前”，不直接解释为“在……监督下”，从而保存其空间及职权上的可能含义。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的神圣名字译法，作为四字神名的音译传统形式，而非以称号替代。
- source_word: עַל הַלְוִיִּם
  choice: 有关利未人的事
  rationale: 此处 עַל 表示命令所涉及的对象或事项；译文不把它缩窄为单纯“给利未人”的命令。
- source_word: כֵּן עָשׂוּ לָהֶם
  choice: 他们就怎样为利未人行了
  rationale: 保留复数主语未明说的特点，并将 לָהֶם 表达为受益或相关对象；其也可能表示“向他们／在他们身上”。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: “耶和华”是现代简体中文圣经语境中广为人知的专名形式，保留其作为名字而非称号的性质；“雅威”更接近学界常见的拟音，也属可行译法。
- issue: 末句所行之事及其对象
  choice: 他们就怎样为利未人行了
  alternative: 他们就怎样向利未人行了／在利未人身上照样行了
  rationale: 希伯来文简练，עָשׂוּ 的主语在本句未重申，לָהֶם 也可表达“为他们”或“向他们”。正文避免补明具体礼仪或强行指定主语，脚注保存另一种关系理解。
translation_notes:
  register: 采用庄重而通顺的现代标准普通话。“办理他们的事务”兼顾会幕职分的礼仪背景与普通读者的可理解性；末句刻意不补出希伯来文没有明说的施行者或具体仪式。
