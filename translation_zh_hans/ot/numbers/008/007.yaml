  naturalness: 原文总体庄重自然。“洗衣服”比“洗净衣服”更贴近原文单纯的“洗涤衣服”，也避免在该动词处额外强调完成结果。以分号分开礼仪动作与最终洁净状态，中文层次更清楚。
  terminology: “洁净”适合本节的礼仪语境。“作洁净礼用的水”避免“除罪水”可能带来的道德化或术语不透明问题；脚注保留“罪之水”的字面形式及“洁净水”的替代译法。“剃刀”“剃遍全身”准确、自然。
