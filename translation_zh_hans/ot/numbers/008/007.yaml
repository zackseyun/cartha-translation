base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/007.yaml
  text: 'And thus you shall do to them to cleanse them: sprinkle on them the water for purification from sin[a], and let them pass a razor over all their flesh, and wash their clothes[b], and so cleanse themselves.'
translation:
  language: zh_hans
  text: 你要这样做，使他们洁净：把作洁净礼用的水[a]洒在他们身上；让他们用剃刀剃遍全身[b]，洗衣服；这样他们就洁净了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“洁净水”；原文直译为“罪之水”。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“使剃刀经过他们所有的肉身”，意思是剃遍全身。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכֹה תַעֲשֶׂה לָהֶם לְטַהֲרָם
  choice: 你要这样做，使他们洁净
  rationale: 保留指令语气及礼仪洁净的含义；“洁净”在本段语境中自然，也不把礼仪概念缩减为一般卫生清洁。
- source_word: הַזֵּה עֲלֵיהֶם
  choice: 洒在他们身上
  rationale: הזה在礼仪语境中指洒水；中文用“洒在……身上”简洁自然。
- source_word: מֵי חַטָּאת
  choice: 除罪水
  rationale: 原文直译近于“罪之水”，该短语的具体关系存在歧义。“除罪水”简明表达其礼仪功用，但不明确增添原文没有的“祭”字；脚注保留“洁净水”等可能理解。
- source_word: וְהֶעֱבִירוּ תַעַר עַל כָּל בְּשָׂרָם
  choice: 让他们用剃刀剃遍全身
  rationale: 希伯来文惯用语直译为“使剃刀经过他们所有的肉身”；正文用自然中文说明实际动作，脚注保存字面形象。
- source_word: וְכִבְּסוּ בִגְדֵיהֶם
  choice: 洗净衣服
  rationale: כבס常指洗涤衣物；“洗净衣服”符合现代汉语，并与洁净礼仪语境相连。
- source_word: וְהִטֶּהָרוּ
  choice: 这样他们就洁净了
  rationale: 该形式可表达他们使自己洁净或成为洁净；结合前述一连串动作，用结果式中文自然表达，同时不赋予超出礼仪语境的神学含义。
theological_decisions:
- issue: 利未人分别为圣礼仪中洁净用语的性质
  choice: 以“洁净”表达礼仪状态，以“除罪水”表达מֵי חַטָּאת的功能，并用脚注保留词组歧义
  alternative: 全用“洁除／净化”等较技术性的措辞，或将מֵי חַטָּאת明确译为“赎罪祭之水”
  rationale: 本节描述具体的礼仪程序。译文应保留其礼仪性质，却不把它仅解释为道德或内在洁净，也不应在原文没有明确“祭”这一名词时强行确定为赎罪祭用水。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。正文以自然汉语表达礼仪步骤，并在脚注中保留希伯来文的字面措辞及真实歧义。
