  text: Then Yahweh spoke to Moses[a], saying,
translation:
  language: zh_hans
  text: 于是雅威[a]对摩西说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文四字神名为“יהוה”（YHWH）；传统常译作“耶和华”。
    reason: 说明神名的原文形式、拉丁字母转写及传统译法。
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: 于是……说
  rationale: 该词为叙事中的连续式动词，承接上文并引出下一项事件；“于是”自然表达推进关系，“说”符合现代汉语的引语格式。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文四字神名 יהוה 音译，以保留其作为专名的性质，而不以称号替代。
- source_word: אֶל
  choice: 对
  rationale: 在言说结构中标明受话者，现代汉语用“对”最自然。
- source_word: מֹשֶׁה
  choice: 摩西
  rationale: 采用该人名通行的现代汉语译名。
- source_word: לֵאמֹר
  choice: 说：
  rationale: 这是希伯来文常见的引语导入公式。汉语不宜机械重复为“说……说道”，故以冒号引出下节的直接话语，既保留其功能，也使表达自然。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华；耶和华（上主）
  rationale: 原文直接使用四字神名 יהוה。正文采用较贴近其常见学术重构读音的“雅威”，保留专名性质；脚注说明希伯来文形式及传统译法，不把某一传统替代称谓无声带入正文。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。“于是”承接叙事，“对摩西说：”符合汉语引出直接引语的习惯；脚注标记紧随“雅威”之后。
