base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/001.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: zh_hans
  text: 雅威[a]对摩西说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文：YHWH；传统译作“耶和华”。
    reason: 说明神名 יְהוָה 的音译及传统中文译法，并对应英语 POB 审校脚注。
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: 说
  rationale: 该动词意为“说话、讲话”；与后面的 לֵאמֹר 共同构成希伯来语常见的引语引入公式。现代汉语以“对……说”自然、准确地表达这一结构，不机械重复为“讲话说”。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经传统中广为人知的神名音译“耶和华”，并在脚注说明原文为四字神名 YHWH，以保留其专名性质。
- source_word: אֶל מֹשֶׁה
  choice: 对摩西
  rationale: 介词 אֶל 标明说话的对象；“对摩西”是自然的现代汉语表达。
- source_word: לֵאמֹר
  choice: 说
  rationale: 这是用于引出随后话语的固定形式。中文不宜将 וַיְדַבֵּר 与 לֵאמֹר 分别直译而造成“说……说”的重复，因此合并为“对摩西说”。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用以 YHWH 表示的神名，而非“主”这一称号。正文采用中文读者最熟悉且仍具专名功能的“耶和华”；“雅威”是较接近现代学界拟音的另一译法，但原始读音并不能完全确定。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。希伯来语以连接词推进叙事，但本节在中文中直接起句更流畅；冒号表明下文将引出耶和华的话。
