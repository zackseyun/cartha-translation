base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/003.yaml
  text: 'And Aaron did so: toward the front of the lampstand he set up its lamps[b][a], just as Yahweh had commanded Moses.'
translation:
  language: zh_hans
  text: 亚伦就这样做了：他把灯台的灯盏[b]朝着灯台前方[a]安放好，正如雅威所吩咐摩西的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“对着灯台正面”或“面向灯台正面”。
    reason: lexical_alternative
  - marker: b
    text: 或译“点亮了灯盏”。原文动词可理解为使灯盏“升起”；在这里可能指把灯盏安放上去，也可能指将它们点亮。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ כֵּן
  choice: 亚伦就照样做了
  rationale: 这个惯用语表示亚伦依照先前的指示行事。“就照样做了”在现代汉语中自然，也保留了 כֵּן 承接上文的作用。
- source_word: אֶל מוּל פְּנֵי
  choice: 朝着灯台前面
  rationale: 这个复合介词短语表达相对于灯台正面或前方的朝向；“朝着……前面”保留方向含义，同时不把具体空间关系限定得过死。
- source_word: הַמְּנוֹרָה
  choice: 灯台
  rationale: מְנוֹרָה 在会幕语境中指承托多个灯盏的器具。“灯台”是简洁、通行且易懂的汉语名称。
- source_word: הֶעֱלָה
  choice: 安放好
  rationale: עלה 的使役式与灯盏连用，字面有“使上升”之意，可指把灯盏安置上去，也可能引申为点燃。上下文强调灯盏的设置及朝向，因此正文采用“安放好”，并以脚注保留“点亮”的可能。
- source_word: נֵרֹתֶיהָ
  choice: 灯台的灯盏
  rationale: נֵרֹת 是“灯盏”的复数形式，阴性单数后缀指回灯台。汉语明说“灯台的”，可清楚呈现所属关系。
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: 正如雅威吩咐摩西的
  rationale: כַּאֲשֶׁר 表明亚伦的行动完全符合雅威给摩西的命令；“正如”自然传达这种严格对应关系。
- source_word: יְהוָה
  choice: 雅威
  rationale: 原文直接使用四字神名。采用现代汉语中常见的音译“雅威”，保留其作为专名的性质，而不以称号替代。
theological_decisions:
- issue: 如何译出神名 יְהוָה
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 此处是神的专名，而非普通称号。“雅威”直接按通行的学术重构音译，避免把专名默默改成称号；其他传统译法可见于不同汉语译本。
- issue: הֶעֱלָה 是安放灯盏还是点亮灯盏
  choice: 正文译作“安放好”，脚注保留“点亮了”
  alternative: 正文译作“点亮了”
  rationale: 该动词的使役式本义为“使上升”，用于灯盏时可涉及安置或点燃。紧接上文的朝向指示，正文取安放义较贴合，但原文并未排除点灯义，因此不以正文消除这层歧义。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“灯台”“灯盏”延续会幕器具语境中的具体称谓；句式尽量贴近希伯来文的承接与命令成就结构，同时通过脚注保留方位短语和动词的真实歧义。
