base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/026.yaml
  text: But he may minister with his brothers in the tent of meeting[a], to keep the charge, but he shall do no service[b]. Thus you shall do for the Levites in their duties.
translation:
  language: zh_hans
  text: 但他可以在会幕里同他的弟兄一起服事，履行职守[a]，却不可做劳役[b]。论到利未人所负的职责，你要这样办理。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “履行职守”也可译作“看守所交付的职责”。希伯来语采用同根的动词和名词，指履行受托的责任，并不一定只指警卫工作。
    reason: lexical_alternative
  - marker: b
    text: “劳役”也可译作“工作”或“常规服役”。原文把这里的劳役与前面仍获准参与的服事加以区别。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשֵׁרֵת
  choice: 但他可以……服事
  rationale: שרת在圣所语境中指服事；结合上节五十岁后退出常规劳役的规定，此处表示仍可参与辅助性服事。“但”体现上下文转折，“可以”自然表达许可意味。
- source_word: אֶת־אֶחָיו
  choice: 同他的弟兄一起
  rationale: 按语境指同属利未支派的弟兄；保留亲属称谓，并用“一起”自然表达共同参与。
- source_word: בְּאֹהֶל מוֹעֵד
  choice: 在会幕里
  rationale: “会幕”是现代中文圣经语境中对 אֹהֶל מוֹעֵד 的简明惯用译法；“里”对应地点关系。
- source_word: לִשְׁמֹר מִשְׁמֶרֶת
  choice: 尽职守责
  rationale: 动词与同根名词的组合表示履行、看守受托的职责。“尽职守责”既涵盖负责和看守的意味，也不把范围收窄为单纯警卫。
- source_word: וַעֲבֹדָה לֹא יַעֲבֹד
  choice: 只是不可再做劳役
  rationale: 名词 עֲבֹדָה 与动词 עבד 构成强调表达，指不得再承担常规工作或劳役。“劳役”与前面的“服事”区分，保留获准参与和免除常规工作之间的张力；“再”由退休年龄的上下文补明。
- source_word: כָּכָה תַּעֲשֶׂה לַלְוִיִּם בְּמִשְׁמְרֹתָם
  choice: 利未人所负的职责，你要这样为他们安排
  rationale: 将希伯来语末句按自然汉语语序重组。“所负的职责”对应 בְּמִשְׁמְרֹתָם，“为他们安排”自然表达这项规例要施行在利未人身上。
theological_decisions:
- issue: 年满规定岁数的利未人可继续参与什么、又须停止什么
  choice: 仍可与弟兄一同参与辅助性服事并履行受托职责，但不可再承担常规劳役
  alternative: 完全停止一切圣所服事；或仅获准承担狭义的警卫任务
  rationale: שרת 与 עֲבֹדָה…עבד 在同一句中形成刻意对照，表明不是完全停止参与，而是区分仍可进行的服事与不再承担的劳役。译文用“服事”和“劳役”保留这一对照，不把“职守”限定为保安工作。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“会幕”“利未人”沿用通行圣经术语；以“服事／劳役”和“尽职守责／职责”的词汇区分，呈现原文内部的语义对照。所有脚注标记均已置于正文。
