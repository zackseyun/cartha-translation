  text: וְ/זֶ֨ה מַעֲשֵׂ֤ה הַ/מְּנֹרָה֙ מִקְשָׁ֣ה זָהָ֔ב עַד יְרֵכָ֥/הּ עַד פִּרְחָ֖/הּ מִקְשָׁ֣ה הִ֑וא כַּ/מַּרְאֶ֗ה אֲשֶׁ֨ר הֶרְאָ֤ה יְהוָה֙ אֶת מֹשֶׁ֔ה כֵּ֥ן עָשָׂ֖ה אֶת הַ/מְּנֹרָֽה־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/004.yaml
  text: 'This was the workmanship of the lampstand: hammered work of gold[a], from its base to its flower it was hammered work. According to the pattern that Yahweh had shown Moses[b], so he made the lampstand.'
translation:
  language: zh_hans
  text: 灯台是这样制成的：用金子锤打而成[a]；从底座到花饰，全都是锤打而成。耶和华向摩西所显示的样式怎样，摩西就怎样制成了灯台[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“锤打的作品”；这个希伯来词强调灯台由锤打成形，也有人理解为“整块制成”。
    reason: lexical_alternative
  - marker: b
    text: “样式”也可译作“形状”或“异象”，即耶和华让摩西看见的形制。
    reason: lexical_alternative
lexical_decisions:
- source_word: מַעֲשֵׂה
  choice: 做法
  rationale: 这里指灯台制作、构造的方式；“做法”自然明白，并能引出下文对工艺的说明。
- source_word: הַמְּנֹרָה
  choice: 灯台
  rationale: 采用现代汉语中清楚、常见的器物名称，不作音译。
- source_word: מִקְשָׁה
  choice: 锤打制成
  rationale: 突出金属经锤打成形的工艺，并在本节两次出现处保留重复强调；“整块”虽可能是含义之一，但解释性较强，列入脚注。
- source_word: זָהָב
  choice: 金子
  rationale: 直接表达制作灯台所用的材料，符合普通现代汉语。
- source_word: עַד יְרֵכָהּ עַד פִּרְחָהּ
  choice: 从底座到花饰
  rationale: 以汉语的“从……到……”表达灯台从下部至花形装饰的全部范围；יָרֵךְ在此按器物语境译为“底座”，פֶּרַח译为集合意义的“花饰”。
- source_word: כַּמַּרְאֶה
  choice: 样式
  rationale: 在圣所器具制作的语境中，指上帝展示给摩西的形制或模型；脚注保留“形状／异象”的词义可能。
- source_word: הֶרְאָה
  choice: 指示
  rationale: 使役式意为“使看见、展示”；“把样式指示摩西”在汉语中自然，也保留上帝主动展示的含义。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代简体中文圣经读者最熟悉的神名译法。
- source_word: כֵּן עָשָׂה
  choice: 他就怎样制成了
  rationale: 保留“怎样……就怎样……”的对应结构和主动语态；希伯来文未明说主语，汉语以“他”表达语境中隐含的制作者。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: “耶和华”是现代中文普通读者最熟悉且庄重的专名形式；不以“主”替代，以保留原文专名。
- issue: עָשָׂה 的隐含主语
  choice: 他就怎样制成了灯台
  alternative: 灯台就照样制成了
  rationale: 原文使用主动式单数动词，但主语隐含。“他”保留主动施事者，同时不具体指定其身份；被动译法会淡化原文的主动形式。
- issue: כַּמַּרְאֶה 的理解
  choice: 样式
  alternative: 形状／异象
  rationale: 器具制作语境支持“样式”，但原词仍可指所见的形状或异象，因此在脚注中保留其语义张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“灯台的做法是这样的”清楚引出制作工艺；以分号处理原文重复的 מִקְשָׁה，使重复既得到保留，又不显累赘。所有脚注标记均已置于正文对应位置。
