revisions:
- from: 灯台的做法是这样的：用金子锤打制成[a]；从底座到花饰，都是锤打制成的。耶和华怎样把样式指示摩西[b]，他就怎样制成了灯台。
  to: 灯台是这样制成的：用金子锤打而成[a]；从底座到花饰，全都是锤打而成。耶和华向摩西所显示的样式怎样，摩西就怎样制成了灯台[b]。
  rationale: 修订主要消除代词“他”在汉语中错误回指耶和华的歧义，明确语境所指的摩西。同步将“指示”调整为“显示”，使表达更自然并保留“使看见”的原文含义；其余内容维持原文的制作工艺、范围和重复强调。
