  yaml_path: translation/ot/numbers/023/020.yaml
  text: Look[a], I have received to bless; he has blessed[c][b], and I cannot reverse it.
translation:
  language: zh_hans
  text: 看哪，我领受了要祝福的使命；他已赐福[a]，我不能扭转它[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “他”的主语在希伯来文中没有明说；根据上下文，所指的是神。
    reason: alternative_reading
  - marker: b
    text: “扭转”也可译作“撤销”或“使它转回”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: 看哪
  rationale: 保留引起注意的指示、感叹作用；在庄重的现代汉语经文语体中自然明白。
- source_word: בָרֵךְ
  choice: 要祝福
  rationale: 结合 לָקָחְתִּי 理解为所领受之事的内容，既表达祝福的使命或话语，又不增添原文未明说的“命令”。
- source_word: לָקָחְתִּי
  choice: 我领受的是
  rationale: 该动词基本义为“拿、接受、领受”；此处受词没有明说，因此用“领受的是”衔接后面的“要祝福”，保留原文的省略。
- source_word: וּבֵרֵךְ
  choice: 他已经赐福
  rationale: 第三人称阳性单数的主语隐含；上下文强烈指向神，但正文仍用“他”，保留希伯来文的简洁和含蓄。完成体译为“已经赐福”，突出既成事实。
- source_word: אֲשִׁיבֶנָּה
  choice: 我不能把它收回
  rationale: שׁוב 的使役形有使之返回、转回之意；在祝福话语的语境中，“收回”自然表达不能撤销已经发出的祝福，同时脚注保留“扭转”的可能表达。
theological_decisions:
- issue: “他已经赐福”的隐含主语
  choice: 正文保留“他”，不直接补作“神”
  alternative: 译作“神已经赐福”或采用不定主语
  rationale: 上下文表明主语是神，但希伯来文仅以动词形态表示第三人称阳性单数。保留代词既使中文通顺，也避免把上下文判断写成原文明示内容。
- issue: 不能收回之物的指代
  choice: 用“它”指向已经赐下的祝福
  alternative: 明确译作“这祝福”或“这话”
  rationale: 原文使用阴性单数后缀，所指可理解为祝福或祝福的话；正文保留代词，避免过度限定。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“看哪”保留原文的提示语气；“我领受的是要祝福”有意保留原文未明说领受对象的简约结构。
