base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/013.yaml
  text: Then Balak said to him, “Please come with me to another place, from where you may see him. You will see only the edge of him, and you will not see all of him; then curse him for me from there.”
translation:
  language: zh_hans
  text: 巴勒对他说：“请你同我到另一个地方去，从那里你可以看见以色列民。你只能看见他们的边缘[a]，不能看见他们的全部；你就从那里替我诅咒他们。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“他们的边缘”或“他们的最远一端”，指只能看见以色列民的一部分。
    reason: 保留קָצֵהוּ的具体空间意象及其词义可能性。
lexical_decisions:
- source_word: לך־נא אִתִּי
  choice: 请你同我……去
  rationale: 保留祈请语气和同行之意；汉语以“去”自然表达前往另一个地点。
- source_word: מָקוֹם אַחֵר
  choice: 另一个地方
  rationale: 直接、自然地表达更换地点。
- source_word: אֲשֶׁר תִּרְאֶנּוּ מִשָּׁם
  choice: 从那里你可以看见以色列民
  rationale: 按语境将单数宾语的所指明确为作为集合体的以色列民，避免汉语代词指向含混。
- source_word: אֶפֶס קָצֵהוּ
  choice: 只能看见他们的一小部分
  rationale: אֶפֶס在此表示限制，קָצֶה指边缘、末端；结合俯瞰营地的语境，译为“一小部分”自然传达只能看见边缘部分的意思。
- source_word: וְכֻלּוֹ לֹא תִרְאֶה
  choice: 不能看见他们全体
  rationale: 保留局部与全体的对照；汉语用“全体”表达作为一个整体的民族。
- source_word: וְקָבְנוֹ לִי מִשָּׁם
  choice: 你就从那里替我诅咒他们
  rationale: קבב译作“诅咒”；“就”体现动作承接，“替我”准确表达利益与委托关系。
theological_decisions:
- issue: 以色列作为集合体时的单数代词
  choice: 正文按现代汉语习惯译作复数“他们”，并首次明确为“以色列民”
  alternative: 形式对应地译作单数“他”或“它”
  rationale: 希伯来文以阳性单数后缀指作为一个整体的以色列。现代汉语若用“他”会被误解为一个男性个体，用“它”则不适合指人群；“以色列民／他们／全体”既保存集合所指，也使语义清楚。
- issue: קָצֵהוּ所指的可见范围
  choice: 正文译作“一小部分”
  alternative: 译作“边缘”或“最远的一端”
  rationale: 原词可指边缘、末端或极处，此处强调巴兰只能看到以色列的一部分。正文不武断限定为近端或远端，并以脚注保留具体词义范围。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。将希伯来文集合单数按汉语习惯处理为“以色列民／他们”，避免不自然或误导性的单数人称代词；引号与标点符合简体中文规范。
