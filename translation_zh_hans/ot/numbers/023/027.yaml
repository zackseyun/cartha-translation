  text: וַ/יֹּ֤אמֶר בָּלָק֙ אֶל בִּלְעָ֔ם לְכָ/ה נָּא֙ אֶקָּ֣חֲ/ךָ֔ אֶל מָק֖וֹם אַחֵ֑ר אוּלַ֤י יִישַׁר֙ בְּ/עֵינֵ֣י הָ/אֱלֹהִ֔ים וְ/קַבֹּ֥ת/וֹ לִ֖/י מִ/שָּֽׁם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/027.yaml
  text: Then Balak said to Balaam[a], “Please come, let me take you to another place. Perhaps it will be right in the eyes of God, and you shall curse him for me from there.”
translation:
  language: zh_hans
  text: 巴勒对巴兰说：“请来吧，我带你到另一个地方。也许上帝看这样为好[a]，你就从那里替我咒诅他。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“也许上帝会喜悦这样。”原文是“在上帝眼中为正（或为悦）”的习语。
    reason: 说明希伯来习语兼有“看为正”和“看为喜悦”的词义可能。
lexical_decisions:
- source_word: לְכָה נָּא
  choice: 请来吧
  rationale: הלך的命令式在这里是邀请或催促；נָּא缓和语气。“请来吧”自然保留了恳请意味。
- source_word: אֶקָּחֲךָ
  choice: 我带你
  rationale: 该未完成式在邀请之后具有意愿色彩；汉语“我带你”简洁自然，也表达巴勒提议亲自带领巴兰。
- source_word: מָקוֹם אַחֵר
  choice: 另一个地方
  rationale: 直接保留更换地点或观察位置的具体含义。
- source_word: אוּלַי
  choice: 也许
  rationale: 准确表达巴勒的希望和不确定性，不增强其把握。
- source_word: יִישַׁר בְּעֵינֵי הָאֱלֹהִים
  choice: 上帝看这样为好
  rationale: 以自然汉语传达“在上帝眼中为正／蒙悦纳”的希伯来习语；“这样”补明无显式主语的动词所指向的拟议之事，同时保留“为好”与“喜悦”之间的语义张力。
- source_word: הָאֱלֹהִים
  choice: 上帝
  rationale: 叙事语境指巴兰所求问、约束他的以色列之上帝；译作“上帝”比“那神”或“一位神”更符合所指。
- source_word: וְקַבֹּתוֹ לִי
  choice: 你就……替我咒诅他
  rationale: קבב意为“咒诅”；连接形式承接巴勒的请求。“就”自然表达他所盼望的结果；单数宾语“他”保留原文将以色列整体视为一个对象的表达。
- source_word: מִשָּׁם
  choice: 从那里
  rationale: 保留与新地点相连的空间起点含义。
theological_decisions:
- issue: 巴勒话语中הָאֱלֹהִים的所指
  choice: 译作“上帝”，指巴兰所求问的真神
  alternative: “那神”或“神明”
  rationale: 紧邻叙事显示巴兰受以色列的上帝约束，巴勒只是希望换个地点会改变上帝许可的结果；“上帝”清楚反映叙事所指，又不引入多神论解释。
- issue: יִישַׁר בְּעֵינֵי的评价含义
  choice: 上帝看这样为好
  alternative: 上帝会喜悦这样
  rationale: 原习语可表示“看为正”或“看为喜悦”。正文采用包容度较高的“看……为好”，脚注说明另一可能，避免将其专断地收窄为道德认可或情感喜悦。
translation_notes:
  register: 采用现代、庄重而口语自然的叙事汉语。“请来吧”体现恳请语气；“上帝看这样为好”避免生硬直译“在上帝眼中为正”，同时用脚注保留原文的词义幅度。
