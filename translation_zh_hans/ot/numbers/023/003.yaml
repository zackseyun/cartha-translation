  text: וַ/יֹּ֨אמֶר בִּלְעָ֜ם לְ/בָלָ֗ק הִתְיַצֵּב֮ עַל עֹלָתֶ/ךָ֒ וְ/אֵֽלְכָ֗ה אוּלַ֞י יִקָּרֵ֤ה יְהוָה֙ לִ/קְרָאתִ֔/י וּ/דְבַ֥ר מַה יַּרְאֵ֖/נִי וְ/הִגַּ֣דְתִּי לָ֑/ךְ וַ/יֵּ֖לֶךְ שֶֽׁפִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/003.yaml
  text: Then Balaam said to Balak[a], “Stand beside your burnt offering, and I will go. Perhaps Yahweh will come to meet me, and whatever he shows me I will tell you.” Then he went to a bare height.
translation:
  language: zh_hans
  text: 巴兰对巴勒说：“你站在你的燔祭旁边，我这就去。也许雅威会来与我相遇；他无论向我显明什么，我都会告诉你。”于是巴兰走到一处光秃的高地[a]去。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “光秃的高地”也可译作“荒秃的高处”或“无遮蔽的山冈”。这里的希伯来词较罕见，看来是指一处裸露、没有遮蔽物的高处。
    reason: 说明罕见地形词שֶׁפִי的词义及可行译法。
lexical_decisions:
- source_word: הִתְיַצֵּב עַל עֹלָתֶךָ
  choice: 你站在你的燔祭旁边
  rationale: הִתְיַצֵּב要求人在某处站定；עַל在这一空间结构中表示“在……旁边”，不是站在祭物上。עֹלָה特指全部焚烧的“燔祭”。
- source_word: וְאֵלְכָה
  choice: 我去一趟
  rationale: 第一人称祈愿式表达巴兰接下来要去的意向；“去一趟”符合现代汉语叙事，也不额外指定目的地。
- source_word: אוּלַי
  choice: 也许
  rationale: 保留巴兰对能否遇见雅威所表达的不确定性。
- source_word: יִקָּרֵה יְהוָה לִקְרָאתִי
  choice: 雅威会来与我相遇
  rationale: קרה在此指发生相遇或临到会面；结合לִקְרָאתִי，译作“来与我相遇”自然，同时由“也许”保留原文的偶遇色彩和不确定性。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语中通行且贴近四字神名的音译呈现上帝的专名，不以称号代替。
- source_word: וּדְבַר מַה יַּרְאֵנִי
  choice: 他无论向我显明什么
  rationale: 原文表达较凝缩，מַה与使役形的ראה共同指向所获启示的内容；此译保留内容的开放性，避免生硬增添“话”而缩窄范围。
- source_word: וְהִגַּדְתִּי לָךְ
  choice: 我都会告诉你
  rationale: נגד的使役形在此是把所获信息转告巴勒；“告诉”清楚自然。
- source_word: שֶׁפִי
  choice: 一处光秃的高地
  rationale: 这个罕见词在此很可能指没有遮蔽物、光秃外露的高处；“高地”保留地形含义而不把它特定化为山顶。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。译作“雅威”保留其专名性质；“耶和华”是传统音译形式，“主”则以称号代替了原文专名。
- issue: 巴兰所期待之相遇的确定性
  choice: 也许雅威会来与我相遇
  alternative: 雅威必来与我相遇
  rationale: אוּלַי明确表达可能性，不能把巴兰的期待改成确定应许；同时不把קרה过度解释为纯粹随机事件。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“燔祭”保留常用圣经祭祀术语；“去一趟”使对话流畅但不口语化过度。脚注标记置于其实际说明的“光秃的高地”之后。
