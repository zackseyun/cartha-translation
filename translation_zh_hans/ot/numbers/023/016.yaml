base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/016.yaml
  text: And Yahweh met Balaam and put a word in his mouth[a], and said, “Return to Balak, and thus you shall speak.”
translation:
  language: zh_hans
  text: 耶和华遇见巴兰，把话放在他口中[a]，说：“你回到巴勒那里，要这样说。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “遇见”或译“临到”或“与……相遇”。
    reason: 原文动词קָרָה可表示遇见、遇上或临到；不同译法对这次相遇的表达略有差别。
lexical_decisions:
- source_word: וַיִּקָּר
  choice: 遇见
  rationale: קָרָה在此表示相遇、遇上。译作“遇见”简洁自然，表达直接相遇，又不额外解释为异象显现。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代汉语中广为人知的专名“耶和华”译出四字神名，而不以“主”这一称号替代。
- source_word: וַיָּשֶׂם דָּבָר בְּפִיו
  choice: 把话放在他口中
  rationale: 贴近希伯来语“把一个话语放在他口中”的先知性授言惯用语；汉语也能自然表达话语由神赐下。
- source_word: דָּבָר
  choice: 话
  rationale: 这里指巴兰将要传达的话语。“话”保留原文单数概念，比“信息”少一层解释。
- source_word: שׁוּב אֶל בָּלָק
  choice: 回到巴勒那里
  rationale: שׁוּב命令巴兰返回巴勒所在之处；“回到……那里”符合现代汉语叙事表达。
- source_word: וְכֹה תְדַבֵּר
  choice: 要这样说
  rationale: כֹה加דבר引出随后要说的话。“要这样说”既保留指示意味，也比逐字式“如此说”更自然。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名，正文因此采用汉语读者熟悉的专名“耶和华”，不以称号“主”代替；“雅威”是另一种较接近学术重构读音的音译。
- issue: 神把话放在巴兰口中的含义
  choice: 保留“把话放在他口中”的原文意象
  alternative: 赐给他要传达的信息
  rationale: 直译保留神主动授予话语以及巴兰负责说出的张力，不把措辞扩展为对启示方式的具体说明。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。句式简洁，保留“把话放在他口中”这一希伯来语意象，并用“要这样说”自然呈现命令语气。
