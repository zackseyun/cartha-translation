  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כִּֽי מֵ/רֹ֤אשׁ צֻרִים֙ אֶרְאֶ֔/נּוּ וּ/מִ/גְּבָע֖וֹת אֲשׁוּרֶ֑/נּוּ הֶן עָם֙ לְ/בָדָ֣ד יִשְׁכֹּ֔ן וּ/בַ/גּוֹיִ֖ם לֹ֥א יִתְחַשָּֽׁב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/009.yaml
  text: For from the top of the rocks I see him[a], and from the hills I behold him. Look, a people dwelling alone, and not reckoning itself among the nations.
translation:
  language: zh_hans
  text: 因为我从岩石之巅看见他，从山冈上望见他。看哪，这是一个独自居住的民族，不把自己列在列国之中。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“不被列在列国之中。”希伯来语动词既可理解为反身或中动态，也可理解为被动。
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接并说明巴兰诗歌中的判断，保留原文的解释性连接作用；汉语用“因为”自然明确。
- source_word: מֵרֹאשׁ צֻרִים
  choice: 从岩石之巅
  rationale: רֹאשׁ在地形语境中指顶部、顶峰；“岩石之巅”保留高处远望的诗意图景。
- source_word: אֶרְאֶנּוּ
  choice: 我看见他
  rationale: 保留第一人称及第三人称阳性单数宾语；“他”在此集合性地指以色列这个民族。
- source_word: וּמִגְּבָעוֹת אֲשׁוּרֶנּוּ
  choice: 从山冈上望见他
  rationale: “山冈”准确表达גְּבָעוֹת；“望见”既与前句“看见”形成变化，也体现诗歌中的凝望语气。
- source_word: הֶן
  choice: 看哪
  rationale: 这是引人注意的指示语；“看哪”庄重而仍为现代读者熟悉。
- source_word: עָם
  choice: 一个……民族
  rationale: 此处指具有共同身份的族群；“民族”与后文“列国”形成清楚对照。
- source_word: לְבָדָד יִשְׁכֹּן
  choice: 独自居住
  rationale: 保留与其他民族分开的含义；未把未完成式限定为纯粹现在或未来。
- source_word: וּבַגּוֹיִם לֹא יִתְחַשָּׁב
  choice: 不把自己列在列国之中
  rationale: 按Hitpael的反身/中动态可能性翻译，同时用脚注保留同样可行的被动理解。
theological_decisions:
- issue: יִתְחַשָּׁב应理解为反身/中动态，还是被动态
  choice: 不把自己列在列国之中
  alternative: 也可译为“不被列在列国之中”
  rationale: 该Hitpael形式容许反身或中动态理解，也可能表达被动意义。正文采用自然的反身读法，脚注保留被动读法，不将以色列的分别身份扩展为原文未明说的神学主张。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“岩石之巅—山冈上”和“看见—望见”保留诗歌平行结构；正文中的[a]置于相关歧义句之后。
