  text: הֶן עָם֙ כְּ/לָבִ֣יא יָק֔וּם וְ/כַ/אֲרִ֖י יִתְנַשָּׂ֑א לֹ֤א יִשְׁכַּב֙ עַד יֹ֣אכַל טֶ֔רֶף וְ/דַם חֲלָלִ֖ים יִשְׁתֶּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/024.yaml
  text: Look[a], a people rises like a lioness, and lifts itself up like a lion; it will not lie down until it eats the prey and drinks the blood of the slain.
translation:
  language: zh_hans
  text: 看哪， 有一民如狮子[a]兴起，挺身如狮子；它必不躺下，直到吃猎物，喝被杀者的血。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“母狮”。希伯来语 לָבִיא 可泛指狮子，也常可指母狮；译作“狮子”保留其词汇上的不确定性，并与下句常用词 אֲרִי（“狮子”）的平行相对应。
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶן
  choice: 看哪
  rationale: 这是引出强调性观察的指示感叹词；“看哪”庄重而易懂，保留原文的醒目语气。
- source_word: עָם
  choice: 这民
  rationale: 指作为整体的以色列民；“这民”保留集合意义，也符合诗歌神谕的语境。
- source_word: כְּלָבִיא
  choice: 如母狮
  rationale: לָבִיא 可泛指狮子，也可能特指母狮；译作“母狮”可体现它与下句 אֲרִי 的词汇差异，但该词本身仍有歧义。
- source_word: יָקוּם
  choice: 兴起
  rationale: קום 的未完成式在狮子意象中描写起身行动；“兴起”兼具动态和诗体庄重感。
- source_word: וְכַאֲרִי
  choice: 如雄狮
  rationale: אֲרִי 是常用的“狮子”一词；在与“母狮”平行时译作“雄狮”，使汉语意象自然鲜明，但性别区分主要来自诗句的搭配。
- source_word: יִתְנַשָּׂא
  choice: 挺身
  rationale: נשׂא 的 Hitpael 形式在此表示抬起自身、昂然起身；“挺身”贴合猛兽蓄势而起的具体形象，避免抽象化为“高举自己”。
- source_word: לֹא יִשְׁכַּב
  choice: 它不躺下
  rationale: 保留狮子不会伏卧休息的具体图像；汉语现在式可自然表达其势必持续到目标完成。
- source_word: עַד יֹאכַל טֶרֶף
  choice: 直到吃了猎物
  rationale: יֹאכַל 的基本义是“吃”，不强化为“吞噬”；טֶרֶף 指捕获或撕裂的猎物。
- source_word: וְדַם חֲלָלִים יִשְׁתֶּה
  choice: 喝了被杀之人的血
  rationale: חֲלָלִים 在战争和暴力语境中通常指被杀的人；译文保留原文刻意强烈的饮血意象。
theological_decisions:
- issue: 巴兰神谕中的暴力意象
  choice: 保留吃猎物和喝被杀者之血的猛兽及战争意象。
  alternative: 将其淡化为一般性的得胜或强盛。
  rationale: 希伯来文有意使用尖锐、令人不安的掠食意象，描绘这民势不可挡的力量和军事胜利；译文不应把这种张力消解，也不应把比喻误作饮血行为的命令。
- issue: לָבִיא 与 אֲרִי 的对应关系
  choice: 正文译作“母狮”与“雄狮”，并用脚注说明前者也可泛译“狮子”。
  alternative: 两处都译作“狮子”。
  rationale: 这样能在自然汉语中体现两个希伯来词的变化，同时借脚注保存 לָבִיא 性别含义并不绝对的歧义。
translation_notes:
  register: 采用现代、庄重而明白的诗体表达。“看哪”保留神谕的强调语气；“兴起、挺身”形成紧凑的平行结构。正文必须补入脚注标记，故定稿正文应为：“看哪[a]，这民兴起如母狮，挺身如雄狮；它不躺下，直到吃了猎物，喝了被杀之人的血。”
