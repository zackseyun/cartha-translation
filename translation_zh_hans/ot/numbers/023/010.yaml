revisions:
- from: 谁能数点雅各的尘土，谁能数清以色列的四分之一[a]？愿我像正直人[b]那样死；愿我的结局像他一样[c]。
  to: 谁能数点雅各的尘土，又能数清以色列的四分之一[a]？愿我像正直人[b]那样死；愿我的结局也像他的[c]。
  rationale: 修订仅澄清汉语末句所比较的是“他的结局”，并使首句的并列反问更流畅；同时校正脚注a，使其替代译法更贴近רֹבַע的词义范围。其余措辞保留原稿对原文诗歌性、语法数和词义歧义的谨慎处理。
