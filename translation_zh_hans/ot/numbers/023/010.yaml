base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/010.yaml
  text: Who can count the dust of Jacob[a], or number the fourth part of Israel? Let my soul die the death of the upright[c][b], and let my end be like his.
translation:
  language: zh_hans
  text: 谁能数点雅各的尘土，又能数清以色列的四分之一[a]？愿我像正直人[b]那样死；愿我的结局也像他的[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“以色列的四方”或“以色列的各部分”；也可意译为“连以色列的四分之一也数不清”。
    reason: lexical_alternative
  - marker: b
    text: 或译“义人”。
    reason: lexical_alternative
  - marker: c
    text: 原文作“像他的”，使用阳性单数；前面的“正直人”在原文虽为复数，也可理解为一类人的集合称谓。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי מָנָה
  choice: 谁能数点
  rationale: 疑问代词引出反问；补出“能”以自然表达语境中的不可能性。“数点”对应数算、点数。
- source_word: עֲפַר יַעֲקֹב
  choice: 雅各的尘土
  rationale: 保留“尘土”的诗歌意象及其关于后裔多得不可胜数的暗示，也保留“雅各”与下句“以色列”的平行。
- source_word: וּמִסְפָּר
  choice: 谁能数清
  rationale: 按希伯来诗歌的平行结构补出反问成分；“数清”自然表达数量无法计尽。
- source_word: אֶת רֹבַע יִשְׂרָאֵל
  choice: 以色列的四分之一
  rationale: רֹבַע通常指四分之一；正文保留这一较直译且有歧义的表达，不径自改成“众多的人”。
- source_word: תָּמֹת נַפְשִׁי
  choice: 愿我……死
  rationale: נַפְשִׁי在这里指说话者自身或性命；现代汉语用“我”比“我的灵魂死”自然，也不额外引入灵魂观念。
- source_word: מוֹת יְשָׁרִים
  choice: 像正直人那样死
  rationale: 将希伯来语“死正直人之死”的同源结构转换为自然现代汉语，同时保留愿与正直人同得其死的含义。
- source_word: וּתְהִי אַחֲרִיתִי
  choice: 愿我的结局
  rationale: אַחֲרִית在本节与死亡平行，指最终结局；“结局”简洁而庄重。
- source_word: כָּמֹהוּ
  choice: 像他一样
  rationale: 严格保留阳性单数后缀；其与前面的复数集合称谓“正直人”之间的张力留待脚注说明。
theological_decisions:
- issue: יְשָׁרִים的译法
  choice: 正直人
  alternative: 义人
  rationale: “正直人”较直接体现ישר所含正直、端正之义，避免将经文自动限定为更系统化或法庭性的“称义”概念。
- issue: רֹבַע יִשְׂרָאֵל的理解
  choice: 以色列的四分之一
  alternative: 以色列的众多人口；以色列的各营
  rationale: 正文保留最直接的“四分之一”义，让其具体所指维持开放；很可能意为连以色列的四分之一也数不清，但不把这一解释直接写进正文。
- issue: כָּמֹהוּ的单数形式
  choice: 像他一样
  alternative: 像他们一样
  rationale: 保留原文阳性单数，以免消除“正直人”这一复数集合称谓与后续单数代词之间的语法张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。两句反问使用“谁能”形成清晰平行；后半句以两个“愿”保持诗歌节奏。避免生硬的“愿我的灵魂死……之死”，以“愿我像……那样死”传达原义，同时不把נֶפֶשׁ误窄化为与身体相对的“灵魂”。
