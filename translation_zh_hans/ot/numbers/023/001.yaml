base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/001.yaml
  text: Then Balaam said to Balak[a], “Build seven altars for me here, and prepare seven bulls and seven rams for me here.”
translation:
  language: zh_hans
  text: 巴兰对巴勒说：“你在这里为我筑七座祭坛，又在这里为我预备七头公牛和七只公绵羊。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: 叙事性未完成式承接上文，中文按自然叙事语序用“说”即可表达推进，不必机械译出连接词。
- source_word: בִּלְעָם אֶל־בָּלָק
  choice: 巴兰对巴勒
  rationale: 人名采用现代中文圣经中通行的译名；אֶל在言说结构中自然译作“对”。
- source_word: בְּנֵה
  choice: 筑
  rationale: 该命令式指建造祭坛；中文通常说“筑坛”，比泛指的“建造”更贴合献祭语境。
- source_word: לִי
  choice: 为我
  rationale: 保留介词与第一人称后缀所表达的受益或指向关系。
- source_word: בָזֶה
  choice: 在这里
  rationale: 字面为“在这个〔地方〕”，语境中是地点指示；译作“在这里”自然准确，并保留两次重复。
- source_word: שִׁבְעָה מִזְבְּחֹת
  choice: 七座祭坛
  rationale: 直接保留数词，并使用适合建筑物的现代汉语量词“座”。
- source_word: וְהָכֵן
  choice: 又……预备
  rationale: הָכֵן是使役命令式，意为使之就绪；“预备”适合献祭牲畜的语境。“又”自然连接第二项命令。
- source_word: שִׁבְעָה פָרִים
  choice: 七头公牛
  rationale: פַּר在献祭语境中指公牛；原文未进一步明确年龄，因此不增译“牛犊”或“少壮”。
- source_word: שִׁבְעָה אֵילִים
  choice: 七只公绵羊
  rationale: אַיִל在此明确指雄性绵羊；“公绵羊”比单说“公羊”更能避免与山羊混淆。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。保留原文两次“在这里”和两次“为我”的重复，以维持地点强调及命令结构；不添加原文没有说明的献祭动作或牲畜年龄。
