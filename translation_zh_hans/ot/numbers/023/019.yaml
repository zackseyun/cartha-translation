language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: לֹ֣א אִ֥ישׁ אֵל֙ וִֽ/יכַזֵּ֔ב וּ/בֶן אָדָ֖ם וְ/יִתְנֶחָ֑ם הַ/ה֤וּא אָמַר֙ וְ/לֹ֣א יַעֲשֶׂ֔ה וְ/דִבֶּ֖ר וְ/לֹ֥א יְקִימֶֽ/נָּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/019.yaml
  text: God is not a man[a], that he should lie, or a son of man, that he should change his mind. Has he said, and will he not do it? Or has he spoken[c][b], and will he not establish it?
translation:
  language: zh_hans
  text: 神不是人，必不说谎；也不是凡人[a]，必不改变心意[b]。他说了，岂不照着行呢？他宣告了，岂不使所说的话立定[c]呢？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译“人之子”。这里是指凡人的希伯来语表达，不是称号。
    reason: cultural_note
  - marker: b
    text: 或译“转意”；传统译作“后悔”。这里强调神信实可靠，并不是说神需要为道德过错悔改。
    reason: lexical_alternative
  - marker: c
    text: 或译“成就它”“实现它”或“确认它”。希伯来语字面为“使它站立”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵל
  choice: 神
  rationale: 此处指以色列的神；“神”自然地保留了祂与人的对比。
- source_word: אִישׁ
  choice: 人
  rationale: 希伯来语用普通的人类称谓，与下句“人子”构成诗体平行；汉语“人”既准确又自然。
- source_word: וִיכַזֵּב
  choice: 绝不会说谎
  rationale: כזב在此指说谎、虚假不实；结合“神不是人”的否定结构，译作“绝不会说谎”清楚表达原文的修辞力量。
- source_word: בֶן אָדָם
  choice: 人子
  rationale: 直译并保留与“人”的诗体平行；本节只是指凡人，并非弥赛亚称号，故以脚注说明。
- source_word: וְיִתְנֶחָם
  choice: 绝不会改变心意
  rationale: נחם的Hitpael词形可指改变心意、转意或回心；此处重点是神信实可靠，不宜译成带有承认道德过错意味的“悔改”。
- source_word: הַהוּא אָמַר וְלֹא יַעֲשֶׂה
  choice: 他说了，难道不照着做吗
  rationale: 原文以反问强调神必照自己所说的行；“照着做”补明语境中的隐含对象，同时保持现代汉语的自然表达。
- source_word: וְדִבֶּר
  choice: 他发了言
  rationale: 与前句“说了”平行，又略显庄重，适合指神所宣告的话。
- source_word: יְקִימֶנָּה
  choice: 使之立定
  rationale: קום的Hiphil词形本义是“使站立”，在此可指确立、成就或履行；“使之立定”保留原文意象，并以脚注交代通顺的释义。
theological_decisions:
- issue: וְיִתְנֶחָם所涉及的神是否改变心意
  choice: 改变心意
  alternative: 转意；回心；传统译法“后悔”
  rationale: 本节以神与反复无常、可能说谎的人作对比，强调神话语的可靠性。“改变心意”保留该动词在行动意向方面的含义，却不将经文扩展为超出原文的哲学命题，也不暗示神需要为道德过错悔改。
- issue: בֶן אָדָם是否为弥赛亚称号
  choice: 按普通希伯来习语理解为凡人
  alternative: 按专门称号理解为“人子”
  rationale: 在本节的诗体平行中，该短语与“人”同义，指人类；正文保留原文形式，脚注防止读者在此误作称号理解。
- issue: יְקִימֶנָּה所表达的话语实现方式
  choice: 保留“使之立定”的具体意象
  alternative: 成就它；实现它；履行它
  rationale: 原文可以表达确立或成就所说的话；直译意象并加注释，可避免把语义范围不必要地限于某一种实现方式。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。前半节用两个“绝不会”表达希伯来语否定比较结构的力度；后半节保留连续反问。正文用“人子”和“使之立定”保存诗体形式及原文意象，并通过脚注避免误解。
