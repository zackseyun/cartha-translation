- from: 神不是人，绝不会说谎；也不是人子[a]，绝不会改变心意[b]。他说了，难道不照着做吗？他发了言，难道不使之立定[c]吗？
  to: 神不是人，必不说谎；也不是凡人[a]，必不改变心意[b]。他说了，岂不照着行呢？他宣告了，岂不使所说的话立定[c]呢？
  rationale: 修订以普通意义的“凡人”取代在汉语中高度专名化的“人子”，从而忠实反映本节的希伯来诗体平行，且不引入称号含义。后半节将代词所指的“话”明确化，并保留“立定”这一原文意象。脚注相应修正词义替代项，避免“回心”带来的不当道德含义。
