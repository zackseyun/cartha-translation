  text: מָ֣ה אֶקֹּ֔ב לֹ֥א קַבֹּ֖/ה אֵ֑ל וּ/מָ֣ה אֶזְעֹ֔ם לֹ֥א זָעַ֖ם יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/008.yaml
  text: How can I curse whom God has not cursed? And how can I denounce whom Yahweh has not denounced?[a]
translation:
  language: zh_hans
  text: 神未曾咒诅的，我怎能咒诅？雅威未曾谴责的，我怎能谴责？[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“雅威未曾向其发怒的，我怎能向其发怒？”第二行的希伯来语动词既可强调发怒，也可指带着愤怒谴责。
    reason: 保留זעם可表示发怒或带着愤怒谴责的词义歧义。
lexical_decisions:
- source_word: מָה אֶקֹּב
  choice: 我怎能咒诅
  rationale: מָה在此引出反问，表达不能如此行，而非询问信息；“怎能”自然传达这种语气。אֶקֹּב在巴兰神谕的语境中指施行咒诅。
- source_word: לֹא קַבֹּה
  choice: 没有咒诅
  rationale: 与前面的“咒诅”使用同一词根，保留希伯来诗句的词汇呼应；完成式在此说明神并未对该对象作出咒诅。
- source_word: אֵל
  choice: 神
  rationale: 此处是对上帝的称谓，译作现代汉语通行的“神”，并与下一分句中的专名“雅威”相区别。
- source_word: וּמָה אֶזְעֹם
  choice: 我怎能谴责
  rationale: 延续前句的反问结构。זעם可指愤怒，也可指带着愤怒公开斥责；正文用“谴责”保留其敌对的言语行为，并与“咒诅”有所区别。
- source_word: לֹא זָעַם
  choice: 没有谴责
  rationale: 与אֶזְעֹם对应使用“谴责”，保留原文同根词的平行关系；其“发怒”义作为脚注中的真实词义选择保留。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文将四字神名作为专名音译，避免以一般称号取代，并保留它与אֵל“神”的差别。
theological_decisions:
- issue: 诗歌平行句中אֵל与יְהוָה的区分
  choice: 分别译为“神”和“雅威”
  alternative: 两处都译作“神”，或把יְהוָה译作“耶和华／主”
  rationale: 原文先用神的称谓אֵל，后用四字神名יְהוָה；分别翻译可忠实保留称谓与专名之间的区别，不把诗歌平行误作词汇完全相同。
- issue: זעם的语义张力
  choice: 正文译作“谴责”，脚注保留“发怒”的可能
  alternative: 正文译作“发怒”
  rationale: 该动词既可强调愤怒，也可强调出于义愤的斥责。上下文涉及巴兰是否能以敌对言语攻击以色列，因此“谴责”较贴合言语行为；但不应消除其愤怒含义，故以脚注明示。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。两句均用“……的，我怎能……”构成紧凑的反问平行；“咒诅／谴责”区分原文两个动词，同时在脚注中保留第二个动词的歧义。
