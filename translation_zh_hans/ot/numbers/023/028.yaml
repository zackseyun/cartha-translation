base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/028.yaml
  text: Then Balak took Balaam to the top of Peor[a], which overlooks the face of the wasteland.
translation:
  language: zh_hans
  text: 巴勒又带巴兰到毗珥的山顶；那山顶俯瞰着荒野[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “荒野”也可译为“沙漠”，或按地名译作“耶施门”。希伯来语“耶施门”可理解为荒凉之地，也可理解为专有地名。
    reason: 保留הַיְשִׁימֹן作为普通名词或地名的词汇歧义，并将脚注锚定于相关词语。
lexical_decisions:
- source_word: וַיִּקַּח
  choice: 又带……到
  rationale: 叙事性连续式推进事件；结合“到……山顶”的目的地结构，现代汉语用“带……到”自然表达“带领前往”。“又”承接此前巴勒多次带巴兰换地方的叙事。
- source_word: בָּלָק
  choice: 巴勒
  rationale: 按现代中文圣经人名的通行译法音译。
- source_word: אֶת בִּלְעָם
  choice: 巴兰
  rationale: 宾格标记不单独翻译；人名按现代中文圣经的通行译法音译。
- source_word: רֹאשׁ הַפְּעוֹר
  choice: 毗珥山顶
  rationale: רֹאשׁ在地形语境中指顶端或峰顶；“山顶”比直译“头”自然，也清楚表明此处是高地。地名פְּעוֹר译作“毗珥”。
- source_word: הַנִּשְׁקָף
  choice: 那里俯瞰
  rationale: שׁקף的Niphal分词在此描写高处向下眺望某地区；“俯瞰”简洁保留地势关系。以“那里”连接，使中文句法自然。
- source_word: עַל־פְּנֵי
  choice: 俯瞰
  rationale: 该短语与הַנִּשְׁקָף共同表达高处临向、俯视某地；若逐字译为“在……表面之上”会造成生硬中文，因此合并表达。
- source_word: הַיְשִׁימֹן
  choice: 荒野
  rationale: יְשִׁימֹן可指荒凉之地，也可能作为地名“耶施ימון”。正文采用自然、可理解的普通名词“荒野”，并以脚注保留地名解释的可能。
