base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/018.yaml
  text: 'Then he took up his discourse and said: “Rise[a], Balak, and hear; listen to me, son of Zippor.”'
translation:
  language: zh_hans
  text: '于是巴兰吟诵他的诗歌，说：

    “巴勒，起来听！

    西拨的儿子，侧耳听我！”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשָּׂא מְשָׁלוֹ
  choice: 于是巴兰吟诵他的诗歌
  rationale: נשׂא与מָשָׁל连用，引出庄重的诗体宣告。“吟诵”自然表达开口宣述诗歌之意；按上下文补出主语“巴兰”，避免现代汉语指代含混。
- source_word: מְשָׁלוֹ
  choice: 他的诗歌
  rationale: מָשָׁל可指箴言、比喻性言辞或庄重的诗体宣告；本处指巴兰接下来平行句式鲜明的诗性言辞。“诗歌”既符合体裁，又不额外断定其为神谕。
- source_word: קוּם
  choice: 起来
  rationale: 准确保留阳性单数命令式，语体庄重而自然。
- source_word: וּשֲׁמָע
  choice: 听
  rationale: 与后面的הַאֲזִינָה构成递进式平行；译作“听”保留基本义。
- source_word: הַאֲזִינָה עָדַי
  choice: 侧耳听我
  rationale: הַאֲזִינָה含专心倾听、侧耳而听之意；“侧耳听我”既保留加强语气，也符合庄重诗体。
- source_word: בְּנוֹ צִפֹּר
  choice: 西拨的儿子
  rationale: 保留希伯来语以父名称呼的形式及其庄重语气；“西拨”采用现代中文圣经人名惯用译法。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而可朗读的诗体汉语，并以分行呈现原文的呼语和平行结构。原文主语仅为“他”，但上文明确是巴兰；正文补明“巴兰”以符合现代汉语叙事习惯。מָשָׁל的语义具有幅度，正文选“诗歌”以贴合本段体裁，同时避免用“神谕”强化其神学性质。
