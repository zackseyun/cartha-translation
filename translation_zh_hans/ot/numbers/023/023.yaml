id: NUM.23.23
reference: Numbers 23:23
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כִּ֤י לֹא נַ֨חַשׁ֙ בְּ/יַעֲקֹ֔ב וְ/לֹא קֶ֖סֶם בְּ/יִשְׂרָאֵ֑ל כָּ/עֵ֗ת יֵאָמֵ֤ר לְ/יַעֲקֹב֙ וּ/לְ/יִשְׂרָאֵ֔ל מַה פָּ֖עַל אֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/023.yaml
  text: For there is no divination in Jacob[a], and no sorcery in Israel; at the proper time it will be said to Jacob and to Israel[b], ‘What God has done!’
translation:
  language: zh_hans
  text: 因为没有占卜能加害雅各，也没有邪术能加害以色列。[a]这时，必有人论到雅各和以色列说：[b]“神做了何等的事！”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“雅各中间没有占卜，以色列中间没有邪术。”希伯来语介词既可表示“在……中”，也可按这里的语境理解为针对雅各和以色列。
    reason: alternative_reading
  - marker: b
    text: “论到雅各和以色列说”也可译为“对雅各和以色列说”。
    reason: lexical_alternative
  - marker: c
    text: 也可读作疑问句：“神做了什么？”
    reason: alternative_reading
lexical_decisions:
- source_word: נַחַשׁ
  choice: 占卜
  rationale: 这里是名词，指借征兆探知或操控事情的占卜活动；“占卜”是现代汉语中清楚、自然的对应词。
- source_word: קֶסֶם
  choice: 邪术
  rationale: 此词指占卜性的秘术。译作“邪术”既表达其禁忌、神秘的性质，也与前面的“占卜”保持适度区别。
- source_word: בְּיַעֲקֹב / בְּיִשְׂרָאֵל
  choice: 能加害雅各／能加害以色列
  rationale: 介词 בְ 可表示“在……中”，也可按语境表示针对某对象。巴兰的神谕强调咒诅和秘术不能危害蒙福的以色列，因此正文采用“能加害”；另一种理解保留在脚注中。
- source_word: כָּעֵת
  choice: 到了时候
  rationale: 该短语可指“如今／此时”，也可指事情显明的适当时刻。“到了时候”保留时间上的开放性，且符合汉语预言体的表达。
- source_word: יֵאָמֵר
  choice: 必有人……说
  rationale: 希伯来语为未完成时的被动式，可作无人称表达。汉语用“必有人……说”自然地传达将来与宣告的意味。
- source_word: לְיַעֲקֹב וּלְיִשְׂרָאֵל
  choice: 对雅各和以色列
  rationale: 介词 לְ 最直接可表示话语的对象，即“对……说”；它也可能表示“论到”，故在脚注中说明另一译法。
- source_word: מַה פָּעַל אֵל
  choice: 神成就了何等大事！
  rationale: מַה 可引出疑问，也可构成感叹；在这首神谕中，感叹句更适合作为对神作为的公开颂扬。“成就了何等大事”既保留完成体，又自然庄重。
- source_word: אֵל
  choice: 神
  rationale: 此处 אֵל 是通用的神称，无须扩译为“全能的神”或“至大者”。
theological_decisions:
- issue: 本节是说以色列内部没有占卜邪术，还是说占卜邪术不能加害以色列
  choice: 正文表达占卜和邪术不能加害雅各／以色列
  alternative: 雅各中间没有占卜，以色列中间没有邪术
  rationale: 巴兰神谕的上下文着重说明神所赐的福不可被咒诅或秘术推翻；不过介词本身容许地点性的理解，所以不把另一读法排除，而在脚注中保留。
- issue: מַה פָּעַל אֵל 是疑问还是感叹
  choice: 感叹：“神成就了何等大事！”
  alternative: 疑问：“神做了什么？”
  rationale: 此句在神谕中更像对神大能作为的惊叹和宣告，但希伯来语形式也可读成疑问，故以脚注保存该可能。
- issue: 宣告是对雅各／以色列说，还是论到雅各／以色列而说
  choice: 对雅各和以色列说
  alternative: 论到雅各和以色列说
  rationale: לְ 的基本方向性使“对……说”较为贴近原文形式；“论到”在语境中同样可能，因此收入脚注。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“能加害”明确表达上下文中的针对性，却通过脚注保留 בְ 的地点性歧义；“成就了何等大事”具有诗歌和神谕所需的提升语体，但不使用生僻古语。
