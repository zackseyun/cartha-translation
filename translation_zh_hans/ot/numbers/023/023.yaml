revisions:
- from: 因为没有占卜能加害雅各，也没有邪术能加害以色列。[a]到了时候，必有人对雅各和以色列说：[b]“神成就了何等大事！”[c]
  to: 因为没有占卜能加害雅各，也没有邪术能加害以色列。[a]这时，必有人论到雅各和以色列说：[b]“神做了何等的事！”[c]
  rationale: 修订以“这时”保留 כָּעֵת 的即时性及其可能的预言语境，避免将其单向解释为未来的“适当时机”。将有关雅各和以色列的介词短语正文译为“论到”，并在脚注保留“对……说”的语法可能。末句去除原文未明说的“大事”，同时保留其感叹而非疑问的主读法。
