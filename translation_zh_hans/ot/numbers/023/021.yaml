id: NUM.23.21
reference: Numbers 23:21
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: לֹֽא הִבִּ֥יט אָ֨וֶן֙ בְּ/יַעֲקֹ֔ב וְ/לֹא רָאָ֥ה עָמָ֖ל בְּ/יִשְׂרָאֵ֑ל יְהוָ֤ה אֱלֹהָי/ו֙ עִמּ֔/וֹ וּ/תְרוּעַ֥ת מֶ֖לֶךְ בּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/021.yaml
  text: He has not looked on trouble in Jacob, nor has he seen misery in Israel. The Yahweh his God is with him, and the shout of a king is among them.
translation:
  language: zh_hans
  text: 他没有在雅各中察看到患难，也没有在以色列中看见苦楚。[a]耶和华——他的上帝——与他同在；王的欢呼声在他们中间。[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “患难”和“苦楚”也可理解为“罪孽”和“邪恶（或悖逆）”。这两个希伯来词既可有道德含义，也可指祸患、劳苦或痛苦。
    reason: 保留原文词语在道德之恶与所受祸患之间的语义歧义。
  - marker: b
    text: 原文作“在他里面”；本节前文把作为整体的以色列当作单数来称说。
    reason: 说明正文“在他们中间”背后的集合单数形式。
  - marker: c
    text: “王的欢呼声”可指百姓中间拥戴君王的欢呼，也可能暗示耶和华以君王身份临在；原文没有明说。
    reason: 保留“王”的身份及欢呼所指的解释空间。
lexical_decisions:
- source_word: הִבִּיט
  choice: 察看见
  rationale: 该动词有专注观看、察看的意味；“察看见”保留其与后句普通“看见”的细微差别，同时在诗体中自然可懂。
- source_word: אָוֶן
  choice: 患难
  rationale: 此词可指罪恶、邪恶，也可指祸患或苦难。与עָמָל平行并处于巴兰祝福的语境中，正文采用“患难”，同时以脚注保留道德意义的可能。
- source_word: רָאָה
  choice: 看见
  rationale: 直接表达普通视觉动词，并与前一分句形成希伯来诗歌的平行。
- source_word: עָמָל
  choice: 苦楚
  rationale: 此词可指劳苦、患难、痛苦；“苦楚”与“患难”相互呼应而不完全重复。
- source_word: בְּיַעֲקֹב / בְּיִשְׂרָאֵל
  choice: 在雅各中／在以色列中
  rationale: 按地点或群体内部意义理解介词ב，保留原文严整的平行结构。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的神名音译，作为专名而非称号处理。
- source_word: אֱלֹהָיו
  choice: 他的上帝
  rationale: 保留阳性单数后缀；雅各／以色列在此被当作集合性的单数来称说。
- source_word: עִמּוֹ
  choice: 与他同在
  rationale: 忠实保留单数代词，与本节将以色列拟作单数个体的语法一致。
- source_word: תְרוּעַת מֶלֶךְ
  choice: 王的欢呼声
  rationale: תְרוּעָה可指欢呼、号声、呐喊或战呼；与“王”连用时，“欢呼声”自然地保留君王受拥戴的意味，却不明确判定这王是谁。
- source_word: בּוֹ
  choice: 在他们中间
  rationale: 原文形式上是“在他里面”，所指却是作为集合单数的以色列；中文正文用复数群体表达较自然，并在脚注说明原文形式。
theological_decisions:
- issue: 本节是在宣告以色列没有罪，还是说上帝未在以色列中看见患难或祸害
  choice: 正文译为“患难／苦楚”，强调祝福语境中的无灾无害与上帝的眷顾。
  alternative: “他未曾在雅各中看见罪孽，也未曾在以色列中看见邪恶（或悖逆）。”
  rationale: אָוֶן和עָמָל都容许道德与苦难方面的含义。正文不把经文本身的词义张力化约为以色列绝对无罪的神学断言，但用脚注明确保留道德解读。
- issue: “王”是否明确指耶和华
  choice: 保留“王的欢呼声”这一未明确指认对象的说法。
  alternative: “向他们的王发出的欢呼”或“神圣君王的欢呼声”。
  rationale: 上下文中的耶和华同在可能暗示他的君王身份，但原文未直接说明“王”就是耶和华，也没有定冠词；正文因此不替原文消除歧义。
translation_notes:
  register: 采用庄重而易懂的现代标准普通话。句式保留希伯来诗歌的双重平行，并在后半句维持“他／他们”之间由集合单数转为自然中文群体表达的张力。神名译作“耶和华”；“上帝”用于אֱלֹהִים。
