  text: And Balak said to Balaam[a], “Neither curse him at all nor bless him at all!”
translation:
  language: zh_hans
  text: 巴勒对巴兰说：“你绝不可咒诅他，也绝不可祝福他！”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“咒诅，不要咒诅他……祝福，不要祝福他”；两处都以不定式绝对形接限定动词，表示强烈的强调。
    reason: 说明原文两组强调结构；现代汉语正文若逐字重复会显得生硬。
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: 希伯来语叙事中的连续式动词承接上文；现代汉语用“说”即可自然表达，不必机械增译“然后”。
- source_word: בָּלָק / בִּלְעָם
  choice: 巴勒 / 巴兰
  rationale: 采用现代中文圣经中通行的人名音译。
- source_word: גַּם ... גַּם
  choice: 既不要……也不要……
  rationale: 两个 גַּם 位于并列的否定命令中，汉语以“既不要……也不要……”自然保留其对称和并列关系。
- source_word: קֹב לֹא תִקֳּבֶנּוּ
  choice: 不要咒诅他
  rationale: קבב 在巴兰叙事中指宣告咒诅；不定式绝对形与限定动词连用，带有强烈强调语气，正文采用自然禁令表达，并由脚注说明原文形式。
- source_word: בָּרֵךְ לֹא תְבָרֲכֶנּוּ
  choice: 不要祝福他
  rationale: ברך 意为祝福；此处同样是不定式绝对形加限定动词的强调结构，与前句形成严格平行。
