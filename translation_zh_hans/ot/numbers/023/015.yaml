  text: וַ/יֹּ֨אמֶר֙ אֶל בָּלָ֔ק הִתְיַצֵּ֥ב כֹּ֖ה עַל עֹלָתֶ֑/ךָ וְ/אָנֹכִ֖י אִקָּ֥רֶה כֹּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/015.yaml
  text: And he said to Balak[a], “Stand here beside your burnt offering, and I will go to meet him over there.”
translation:
  language: zh_hans
  text: 他对巴勒说：“你站在这里，在你的燔祭旁边；我则到那边去与他相会[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文动词表达简略，未说明相会的对象；也可译作“我到那边去相会”或“我会在那里遇见他”。正文的“他”是按上下文补出的。
    reason: 说明希伯来语动词未明说相遇对象，并保留相关译法。
lexical_decisions:
- source_word: וַיֹּאמֶר אֶל־בָּלָק
  choice: 他对巴勒说
  rationale: 以现代汉语常用的叙事表达承接上文；主语可由语境明确为巴兰，无须重复姓名。
- source_word: הִתְיַצֵּב
  choice: 站
  rationale: 该词为 התיצב 的命令式，表示站定、留在某一位置；“站”简洁自然，并由地点短语补足其含义。
- source_word: כֹּה
  choice: 这里
  rationale: 在本句的空间语境中作指示地点用，与句末的“那边”形成对照。
- source_word: עַל עֹלָתֶךָ
  choice: 就在你的燔祭旁
  rationale: עַל 在此表示靠近、在旁边；עֹלָה 特指全部焚烧献上的燔祭。“就在……旁”清楚表达站立位置。
- source_word: וְאָנֹכִי
  choice: 我则
  rationale: 显明的第一人称代词带有轻微对比意味，即巴勒留在此处，而巴兰前往另一处；“我则”自然保留这种对照。
- source_word: אִקָּרֶה
  choice: 去与他相遇
  rationale: קרה 的尼法勒式在此指发生相遇或遇见；结合第二个地点指示词，译作“去与他相遇”符合汉语表达。原文未明说相遇的对象，因此以脚注说明所补出的“他”。
- source_word: כֹּה
  choice: 到那边
  rationale: 第二次出现的 כֹּה 指向不同于巴勒所在之处的地点；“那边”与前面的“这里”形成自然的空间对照。
theological_decisions:
- issue: 巴兰所要相遇的对象在原文中没有明说
  choice: 正文译作“与他相遇”，并以脚注说明“他”是按上下文补出
  alternative: 译作“在那里相遇”或“到那里去，看会遇见什么”
  rationale: 上下文表明巴兰期待神向他显现，但本节没有直接点明对象。正文采用汉语中较自然的“与他相遇”，同时借脚注保留原文的简约和潜在歧义，不直接把“他”明确写成“耶和华”。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“这里／那边”保留两个 כֹּה 的空间对照；分号突出巴勒留守与巴兰前往相遇之间的对比。
