base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/029.yaml
  text: Then Balaam said to Balak, “Build seven altars for me here, and prepare seven bulls and seven rams for me here.”
translation:
  language: zh_hans
  text: 巴兰对巴勒说：“你要在这里为我筑七座坛，又要在这里为我预备七头公牛和七只公绵羊。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: 叙事性连续式推动情节；现代汉语以“说”自然承接上文，不必机械译出“于是”。
- source_word: בִּלְעָם / בָּלָק
  choice: 巴兰 / 巴勒
  rationale: 采用现代简体中文圣经人名的通行译法。
- source_word: בְּנֵה
  choice: 筑
  rationale: 该命令式指建造祭坛；“筑坛”是自然、庄重且准确的汉语搭配。
- source_word: לִי
  choice: 为我
  rationale: 此处介词表示受益或用途，说明这些坛和祭牲供巴兰施行献祭之用。
- source_word: בָּזֶה
  choice: 在这里
  rationale: 原义为“在这个地方”；译作“在这里”符合现代汉语表达并保留地点含义。
- source_word: שִׁבְעָה מִזְבְּחֹת
  choice: 七座坛
  rationale: 准确保留数目，并用量词“座”形成自然汉语。
- source_word: וְהָכֵן
  choice: 又要……预备
  rationale: Hifil命令式表示使之准备妥当；“预备”适合献祭语境，“又要”连接并列命令。
- source_word: פָרִים
  choice: 公牛
  rationale: פַּר在献祭语境中指雄牛；原文未明确强调年龄，因此不增译“幼”。
- source_word: אֵילִים
  choice: 公绵羊
  rationale: 明确表达该词所指的雄性绵羊，便于普通现代读者理解；相比单用“公羊”，可避免物种范围含混。
