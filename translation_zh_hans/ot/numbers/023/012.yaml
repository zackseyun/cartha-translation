  text: וַ/יַּ֖עַן וַ/יֹּאמַ֑ר הֲ/לֹ֗א אֵת֩ אֲשֶׁ֨ר יָשִׂ֤ים יְהוָה֙ בְּ/פִ֔/י אֹת֥/וֹ אֶשְׁמֹ֖ר לְ/דַבֵּֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/012.yaml
  text: He answered and said[a], “Must I not speak what Yahweh puts in my mouth?”
translation:
  language: zh_hans
  text: 他回答说[a]：“耶和华放在我口中的话，我岂能不谨慎照着说呢？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译可作：“他回答并说。”
    reason: 保留原文叙事表达的形式信息；正文按现代汉语习惯合并为“回答说”。
lexical_decisions:
- source_word: וַיַּעַן וַיֹּאמַר
  choice: 他回答说
  rationale: 希伯来语常用“回答并说”引出答话；现代汉语以“回答说”自然保留其功能，避免生硬重复。
- source_word: הֲלֹא
  choice: 岂能不……呢
  rationale: 表达预期肯定回答的反问，并传达巴兰受约束、必须如此行的语气。
- source_word: אֵת אֲשֶׁר ... אֹתוֹ
  choice: ……的话
  rationale: 原文先提出关系宾语，后以代词复指；汉语用“……的话”自然整合这一结构。
- source_word: יָשִׂים ... בְּפִי
  choice: 放在我口中
  rationale: 保留希伯来语赐下言语的形象，同时在现代汉语中清楚可懂。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代简体中文圣经语境中通行的专名形式呈现四字神名，而不以称号替代。
- source_word: אֶשְׁמֹר לְדַבֵּר
  choice: 谨慎照着说
  rationale: שׁמר 加不定式带有谨守、严格遵行的意味；“谨慎照着说”既保留这一词义力度，也表明所说内容严格依从神放在他口中的话。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。中文正文采用读者最熟悉且明确作为专名的“耶和华”，不以“主”替换；“雅威”是另一种较接近学术拟音的译法。
- issue: 巴兰话语中义务与谨守的程度
  choice: 我岂能不谨慎照着说呢
  alternative: 我岂能不说呢
  rationale: הֲלֹא 构成带义务意味的反问，אֶשְׁמֹר לְדַבֵּר 又可强调谨守所领受的话；正文保留这层约束，但不把它解释为机械性的口授。
translation_notes:
  register: 采用庄重、自然的现代标准汉语。“放在我口中”保留原文形象；反问句体现必须遵从的语气。“谨慎照着说”保存 אֶשְׁמֹר 的谨守意味，同时避免过度解释。
