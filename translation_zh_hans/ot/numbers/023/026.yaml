base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/026.yaml
  text: Balaam answered and said to Balak[a], “Did I not speak to you, saying, ‘All that Yahweh speaks, that I will do’?”
translation:
  language: zh_hans
  text: 巴兰回答巴勒说：“我不是对你说过吗？‘凡雅威[a]所说的，我都要照着做。’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “雅威”是希伯来文神名יהוה（YHWH）的音译，传统上也译作“耶和华”。
    reason: 说明神名的译法及读者熟悉的传统译名。
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמֶר
  choice: 回答……说
  rationale: 保留希伯来叙事中引出答话的双动词格式，同时符合现代汉语的自然表达。
- source_word: הֲלֹא דִּבַּרְתִּי אֵלֶיךָ
  choice: 我不是对你说过吗
  rationale: הֲלֹא引出预期肯定回答的反问；“说过”自然表达巴兰对先前话语的回顾。
- source_word: כֹּל אֲשֶׁר יְדַבֵּר יְהוָה
  choice: 凡雅威所说的
  rationale: “凡……所……”保留כֹּל אֲשֶׁר的周全范围；此处未强行限定未完成式为一次未来言说，而保留概括性的原则。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语音译呈现四字神名，区别于作为称号的“主”。
- source_word: אֹתוֹ אֶעֱשֶׂה
  choice: 我都要照着做
  rationale: “照着做”清楚表达宾语代词回指雅威所说的内容；“都”承接前面的“凡”，保留全面遵行的语气。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名；“雅威”较贴近学界通常重构的读音，也避免把专名改成称号。脚注提供传统译名，方便读者辨认。
- issue: 巴兰话语所表达的行动约束
  choice: 凡雅威所说的，我都要照着做
  alternative: 雅威叫我做什么，我就必须做什么
  rationale: 原文说“我将做”，并未明说“必须”；因此保留承诺或行动原则的张力，不额外加入强制意味。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“我不是……吗”保留反问语气；内层引语显示巴兰是在重申自己先前说过的话。
