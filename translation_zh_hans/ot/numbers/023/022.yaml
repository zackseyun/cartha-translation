base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/022.yaml
  text: God brings them out of Egypt[b][a]; he has for him the horns of a wild ox.
translation:
  language: zh_hans
  text: '神领他们出埃及；

    他有野牛般的高角[a][b]。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “野牛般的高角”：希伯来语短语含义较难确定，也可译作“野牛般的力量”。这里保留原文具体的动物意象。
    reason: lexical_alternative
  - marker: b
    text: “野牛”：指一种强壮的野生牛类，可能是已经灭绝的原牛；传统上曾译作“独角兽”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵל
  choice: 神
  rationale: 此处是句子的主语，直译为“神”最简明自然；无需增译“全能的”等原文未明确表达的修饰语。
- source_word: מוֹצִיאָם
  choice: 领他们出
  rationale: 使役分词带第三人称复数宾语后缀，表示神是领他们出来的那一位。用现在时态的“领”保留诗歌中鲜明、持续呈现的语气，同时指向出埃及事件。
- source_word: מִמִּצְרָיִם
  choice: 出埃及
  rationale: 介词与表示移动的使役动词连用，译成“领他们出埃及”符合现代汉语习惯，也清楚呈现出埃及的图景。
- source_word: כְּתוֹעֲפֹת
  choice: 般高耸的角
  rationale: 该复数名词意义有争议，可涉及高耸的角、突出之物或威力。结合野牛意象，正文采用具体的“高耸的角”，并在脚注中保留“力量”这一抽象译法。介词 כְּ 以“般”表达比较。
- source_word: רְאֵם
  choice: 野牛
  rationale: 该词最可能指强壮的野生牛类，或更具体地指原牛，并非神话中的独角兽。“野牛”兼顾现代可懂度和动物类别。
- source_word: לוֹ
  choice: 他有
  rationale: 后缀是第三人称阳性单数。汉语以“他有”保留单数形式，不把它擅自改成复数；“他”在诗句中仍可按集合意义指以色列。
theological_decisions:
- issue: רְאֵם 所指的动物
  choice: 野牛
  alternative: 原牛；独角兽
  rationale: “野牛”符合当前词汇研究及上下文中的强大动物意象。“原牛”较精确但不够通俗；“独角兽”主要来自旧有翻译传统，不大可能是希伯来词实际所指。
- issue: לוֹ 的单数所指
  choice: 保留“他”的单数表达，不在正文中明定所指
  alternative: 改译为“他们有”或明确写成“以色列有”
  rationale: 马所拉文本由前句复数宾语“他们”转为单数后缀“他”。这可能以集合性的单数指以色列，也可能在诗歌结构中形成别的指涉关系；正文不应无声地消除这一语法张力。
- issue: 野牛意象是“角”还是抽象的“力量”
  choice: 正文保留“高耸的角”的具体意象
  alternative: 译作“野牛般的力量”
  rationale: תּוֹעֲפֹת 的确切语义困难。具体译法能保存动物图像及诗意，抽象的“力量”则作为脚注中的合理备选，避免把不确定性包装成定论。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“领他们出埃及”简洁呈现使役动作；分行和分号保留希伯来诗歌的两行结构。“高耸的角”维持具体、有力的诗歌意象，疑难词义则由脚注交代。
