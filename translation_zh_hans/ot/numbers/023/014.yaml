  yaml_path: translation/ot/numbers/023/014.yaml
  text: So he took him to the Field of Zophim[a], to the top of Pisgah, and built seven altars and offered a bull and a ram on each altar.
translation:
  language: zh_hans
  text: 于是，他带巴兰到了毗斯迦山顶的瞭望者之田[a]。他筑了七座祭坛，在每座坛上献一头公牛和一只公羊。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “瞭望者之田”也可音译为“琐腓田”。希伯来语短语可理解为“瞭望者之田”这一描述性名称，也可视为保留原音的专名。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקָּחֵהוּ
  choice: 于是，他带巴兰
  rationale: 该词是叙事性连续式，意为“他带了他”。汉语用“于是”自然衔接上文；根据上下文补出宾语“巴兰”，避免连续代词造成含混，而主语仍以“他”保留上下文所指的巴勒。
- source_word: שְׂדֵה צֹפִים
  choice: 瞭望者田
  rationale: 该组合可按普通名词理解为“瞭望者之田”，也可能是地名“琐腓田”。正文译出词义，同时用脚注保留音译地名的可能性。
- source_word: אֶל רֹאשׁ הַפִּסְגָּה
  choice: 上了毗斯迦山顶
  rationale: רֹאשׁ在地理语境中指顶部或山顶；הַפִּסְגָּה在此按地名“毗斯迦”处理。“上了”符合汉语对抵达山顶的自然表达。
- source_word: וַיִּבֶן שִׁבְעָה מִזְבְּחֹת
  choice: 他筑了七座坛
  rationale: 直译动词“建造”和宾语“七座祭坛”；“筑坛”是简洁、庄重且易懂的现代汉语表达。
- source_word: וַיַּעַל
  choice: 献
  rationale: עלה在献祭语境中指把祭物献上。“献”准确而简洁，不额外限定献祭的具体形式。
- source_word: פָּר וָאַיִל
  choice: 一头公牛和一只公绵羊
  rationale: 两个名词均为单数；量词使现代汉语明确自然。“公绵羊”比单说“公羊”更清楚地区别动物种类。
- source_word: בַּמִּזְבֵּחַ
  choice: 在每座坛上
  rationale: 希伯来文形式为单数“在坛上”，但紧接七座坛，且本段平行叙述表明祭物分献于各坛。译作“每座坛”传达语境中的分配含义。
