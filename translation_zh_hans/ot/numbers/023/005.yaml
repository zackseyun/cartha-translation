  text: וַ/יָּ֧שֶׂם יְהוָ֛ה דָּבָ֖ר בְּ/פִ֣י בִלְעָ֑ם וַ/יֹּ֛אמֶר שׁ֥וּב אֶל בָּלָ֖ק וְ/כֹ֥ה תְדַבֵּֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/005.yaml
  text: Then Yahweh put a word in Balaam’s mouth and said[a], “Return to Balak, and thus you shall speak.”
translation:
  language: zh_hans
  text: 耶和华把话放在巴兰口中，说：“你回到巴勒那里，要这样说。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּשֶׂם
  choice: 放在
  rationale: שׂוּם意为“放、安置”；与“口中”连用时保留希伯来文“把话放在某人口中”的具体意象，现代汉语也自然可懂。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 将四字神名按现代中文圣经传统音译为“耶和华”，保留其作为专名的性质，不以“主”这一称号代替。
- source_word: דָּבָר
  choice: 一句话
  rationale: 该词为单数，在这里指上帝交给巴兰说的话；“一句话”既体现单数，也比单用“一话”自然，并保留“话”而非进一步解释为“信息”。
- source_word: בְּפִי בִלְעָם
  choice: 在巴兰口中
  rationale: 贴近原文“在巴兰的口中”，保留上帝赐下言语的形象。
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: 叙事中的常用引语动词；主语自然承接“耶和华”，无需重复。
- source_word: שׁוּב אֶל בָּלָק
  choice: 你回到巴勒那里
  rationale: שׁוּב是命令式“返回”；补出“你”符合现代汉语命令句表达，“到……那里”清楚表达方向。
- source_word: וְכֹה תְדַבֵּר
  choice: 要这样说
  rationale: כֹה意为“如此、这样”，תְדַבֵּר在语境中具有指令意味；“要这样说”简洁自然，同时保留命令语气。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用神的专名而非称号。中文采用广为人知的专名音译“耶和华”，不译作“主”，从而保留专名性质；“雅威”是更接近学界拟音的可选形式。
- issue: 上帝把话放在巴兰口中的表达
  choice: 保留具体意象“把一句话放在巴兰口中”
  alternative: 赐给巴兰一句话／把信息告诉巴兰
  rationale: 原文刻意使用“放在口中”的先知性言语意象；直译可保留上帝掌管巴兰所说内容这一叙事重点，而不额外界定其先知身份或启示方式。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“把……放在……口中”保留原文形象；直接引语用“要这样说”表达命令，避免文言式“如此说”。
