base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/004.yaml
  text: And God met with Balaam[a], and he said to him, “I have arranged the seven altars and offered a bull and a ram on the altar.”
translation:
  language: zh_hans
  text: 上帝与巴兰相遇[a]。巴兰对他说：“我已经摆设好那七座祭坛，并在祭坛上献了一头公牛和一只公羊。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“上帝遇见巴兰”。这里的希伯来语动词可表示相遇，在有些语境中也带有偶然碰上的意味。
    reason: 说明וַיִּקָּר的词义范围，并保留“相遇／遇见”以及潜在偶遇意味之间的翻译空间。
lexical_decisions:
- source_word: וַיִּקָּר
  choice: 与……相遇
  rationale: 该动词在这里表示上帝与巴兰相遇。译文采用自然的现代汉语，表达真实的相遇，同时不强化其在其他语境中可能具有的偶然意味。
- source_word: אֱלֹהִים
  choice: 上帝
  rationale: 该复数形式在这里搭配单数动词，并明确指独一的神；“上帝”是现代标准普通话中自然、庄重的称呼。
- source_word: בִּלְעָם
  choice: 巴兰
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: וַיֹּאמֶר אֵלָיו
  choice: 巴兰对他说
  rationale: 希伯来语字面为“他对他说”；随后第一人称话语表明说话者是巴兰。中文明确重复“巴兰”，可避免两个男性代词连续出现造成的歧义。
- source_word: אֶת שִׁבְעַת הַמִּזְבְּחֹת
  choice: 那七座祭坛
  rationale: 定指形式指向上文已经提到的七座祭坛；以“那”体现其特指性。
- source_word: עָרַכְתִּי
  choice: 我已经摆设好
  rationale: ערך表示安排、摆设或依次安置；“摆设好”既体现动作已经完成，也符合祭坛预备完毕的语境。
- source_word: וָאַעַל
  choice: 并……献了
  rationale: עלה在献祭语境中表示把祭物献上；“献”是简洁自然的现代汉语祭祀用语。
- source_word: פָּר
  choice: 一头公牛
  rationale: פר在献祭语境中通常指公牛；“头”是汉语中适合牛的量词。
- source_word: וָאַיִל
  choice: 一只公羊
  rationale: אַיִל在此指作祭物的公羊；采用通行且易懂的译法。
- source_word: בַּמִּזְבֵּחַ
  choice: 在祭坛上
  rationale: 原文使用带定冠词的单数“祭坛”。尽管上下文可能具有逐坛分配的含义，正文仍保留单数，不擅自扩展为“在每座祭坛上”。
theological_decisions:
- issue: וַיִּקָּר所表达的神圣相遇具有何种性质
  choice: 译作上帝与巴兰真实相遇，不暗示此事纯属偶然
  alternative: 译作“上帝偶然碰见巴兰”或“上帝遇见巴兰”
  rationale: 该词根在某些语境中可能带有碰巧遇上的意味，但本段叙事描写的是上帝主动向巴兰显现并与他交谈。正文用中性的“相遇”，脚注保留其词义范围，避免把神学推断写入正文。
- issue: וַיֹּאמֶר אֵלָיו中说话者的身份
  choice: 在中文正文中明确为巴兰
  alternative: 保留为“他对他说”
  rationale: 原文代词形式本身简略，但随后的第一人称陈述清楚显示说话者是巴兰。中文若连续使用两个“他”会产生不必要的指代混乱，故明确主语而不改变叙事含义。
- issue: 单数“祭坛”是否应按上下文扩展为“每座祭坛”
  choice: 保留原文单数“在祭坛上”
  alternative: 译作“在每座祭坛上”
  rationale: 上下文中的七座祭坛可能使末尾单数具有分配意义，但原文本节没有明说“每一座”。为保留原文形式及其张力，正文不作解释性扩展。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准普通话。“摆设好”体现祭坛已安排妥当；“献”准确传达献祭语境。正文明确巴兰是说话者，以免汉语代词歧义；同时严格保留末尾“祭坛”的单数形式。
