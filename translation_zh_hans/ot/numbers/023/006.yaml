  yaml_path: translation/ot/numbers/023/006.yaml
  text: Then he returned to him, and behold, he was standing beside his burnt offering—he and all the princes of Moab.
translation:
  language: zh_hans
  text: 他回到巴勒那里，只见巴勒正站在自己的燔祭旁，摩押的众首领也都和他在一起。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּשָׁב אֵלָיו
  choice: 他回到巴勒那里
  rationale: 希伯来语直译为“他回到他那里”；结合紧接的叙述对象，将第二个“他”明示为巴勒，可避免现代汉语中代词指向不清，同时不改变所指。
- source_word: וְהִנֵּה
  choice: 只见
  rationale: 以自然、庄重的现代汉语表达叙事中引人注意的“看哪”。
- source_word: נִצָּב עַל־עֹלָתוֹ
  choice: 正站在自己的燔祭旁
  rationale: נִצָּב 表示站立的状态；עַל 在此按空间关系译为“旁”，עֹלָה 采用通行祭祀术语“燔祭”。
- source_word: הוּא וְכָל־שָׂרֵי מוֹאָב
  choice: 摩押的众首领也都和他在一起
  rationale: 原文名词短语直陈“他和摩押所有首领”；汉语改用伴随结构，更清楚地表明他们一同站在那里。
