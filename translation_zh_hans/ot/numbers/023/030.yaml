  yaml_path: translation/ot/numbers/023/030.yaml
  text: So Balak did as Balaam had said, and he offered up a bull and a ram on the altar.
translation:
  language: zh_hans
  text: 于是，巴勒照巴兰所说的做了，在祭坛上献上一头公牛和一只公羊。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: 做了
  rationale: עשה与כַּאֲשֶׁר אָמַר连用，表示照所说的去做；“做了”在现代汉语中自然准确。
- source_word: כַּאֲשֶׁר אָמַר
  choice: 照……所说的
  rationale: 表达巴勒依照巴兰先前所说的话行事，也自然体现该话在行动之前已经说出。
- source_word: וַיַּעַל
  choice: 献上
  rationale: עלה在献祭语境中指把祭牲献在坛上；“献上”保留了礼仪含义，也符合现代汉语表达。
- source_word: פָּר
  choice: 一头公牛
  rationale: 准确指明祭牲的种类和性别，并使用适合牛的现代汉语量词。
- source_word: אַיִל
  choice: 一只公绵羊
  rationale: אַיִל在此指作祭牲的成年雄绵羊；“公绵羊”比单说“公羊”更明确。
- source_word: בַּמִּזְבֵּחַ
  choice: 在祭坛上
  rationale: 按希伯来文保留定冠、单数的“祭坛”，并以“在……上”自然表达献祭所在之处。
- source_word: וַ
  choice: 于是
  rationale: 句首叙事连接词承接前文的吩咐并引出结果；“于是”比单纯的“和”更符合汉语叙事流程。
theological_decisions: []
