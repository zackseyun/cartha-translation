base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/011.yaml
  text: Then Balak said to Balaam[a], “What have you done to me? I took you to curse my enemies, but look, you have done nothing but bless them!”
translation:
  language: zh_hans
  text: 巴勒对巴兰说：“你对我做了什么？我带你来，是要你咒诅我的仇敌；你看，你竟然祝福了他们[a]！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文也可译作“你确实祝福了他们”或“你的确祝福了他们”；原文用限定动词和绝对不定式连用，以加强语气。
    reason: 说明希伯来文的强调结构及可行的较形式对应译法，避免将强调误解为原文明确表示祝福的次数或程度。
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: 前置的 וַ 推进叙事；汉语依上下文自然承接，不必机械译出“然后”。
- source_word: מֶה עָשִׂיתָ לִי
  choice: 你对我做了什么？
  rationale: 直接保留疑问句及 לִי 所表达的受事关系，符合现代汉语表达。
- source_word: לָקֹב
  choice: 咒诅
  rationale: קבב 在本段指向人宣告咒诅；“咒诅”准确、庄重，也与“祝福”形成清楚对照。
- source_word: אֹיְבַי
  choice: 我的仇敌
  rationale: 忠实表达带第一人称所有关系的复数名词；“仇敌”适合经文的庄重语体。
- source_word: לְקַחְתִּיךָ
  choice: 我带你来
  rationale: לקח 基本义为“带、取”；结合移动到观望地点的语境译为“带你来”，而不擅自限定为“雇用”。
- source_word: וְהִנֵּה
  choice: 看哪
  rationale: 保留 הִנֵּה 引人注意并表达惊讶的功能；“看哪”庄重而易懂，前后反差另以“反倒”显明。
- source_word: בֵּרַכְתָּ בָרֵךְ
  choice: 反倒大大祝福了他们
  rationale: 限定动词加绝对不定式构成强调；“大大”在汉语中自然传达强调。“他们”由上下文补出，原文宾语省略但所指明确。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“看哪”保留原文突显意外结果的语气；分号呈现巴勒原先目的与眼前结果之间的强烈反差。
