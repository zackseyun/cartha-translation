base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/007.yaml
  text: 'Then he took up his discourse and said: “From Aram Balak king of Moab has led me[a], from the mountains of the east: ‘Come, curse Jacob for me; yes, come[c][b], denounce Israel.’”'
translation:
  language: zh_hans
  text: '他便说出这首诗歌：


    “摩押王巴勒把我从亚兰、

    从东方的群山领来[a]：


    ‘来，为我咒诅雅各；

    来，斥责以色列！’”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “东方的群山”也可译作“东部群山”。这里的希伯来语大概是指摩押以东的地区。
    reason: lexical_alternative
  - marker: b
    text: “斥责”所译的希伯来语动词不同于前面的“咒诅”，也可译作“怒斥”或“咒骂”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׂא מְשָׁלוֹ
  choice: 他就吟诵诗歌
  rationale: 该习语直译为“举起他的 mashal”，在这里引出正式而具有诗体特征的宣告。“吟诵诗歌”既体现庄重的口头宣告，也比“箴言”更符合本段体裁；“神谕”则可能过度限定其先知性质。
- source_word: מִן אֲרָם
  choice: 从亚兰
  rationale: 亚兰是地名，应保留音译，不以较晚的地缘名称“叙利亚”替代。
- source_word: יַנְחֵנִי
  choice: 把我领来
  rationale: נחה 的使役形表示引领、带领；结合巴勒召巴兰前来的叙事情境，“把我领来”自然地保留了受引导移动的含义。
- source_word: מֵהַרְרֵי קֶדֶם
  choice: 从东方的群山
  rationale: קדם 在这里与“亚兰”并列，最适合按空间意义理解为“东方”；“群山”自然表达复数构词。
- source_word: לְכָה
  choice: 来
  rationale: 该祈使式在直接引语中表示邀请或催促，译作“来”简洁自然。
- source_word: אָרָה
  choice: 咒诅
  rationale: 该动词明确表示施加咒诅；“咒诅”准确而庄重。
- source_word: לִּי
  choice: 为我
  rationale: 此处介词表示行动为巴勒的利益或代表他而做，“为我”简明准确。
- source_word: יַעֲקֹב
  choice: 雅各
  rationale: 保留标准人名音译；在诗歌中同时作为民族称谓。
- source_word: זֹעֲמָה
  choice: 斥责
  rationale: 该词与前面的 אָרָה 不同，含愤怒谴责、怒斥或咒骂之意。“斥责”保留词汇区别且现代读者易懂；脚注说明更强的可能译法。
- source_word: יִשְׂרָאֵל
  choice: 以色列
  rationale: 保留标准人名及民族名称音译。
theological_decisions:
- issue: “雅各”与“以色列”在巴勒请求中的关系
  choice: 分别保留两个名称，作为对同一立约群体的诗体平行称呼
  alternative: 合并意译为“以色列人”等单一集体称谓
  rationale: 原文有意并列“雅各”和“以色列”，形成诗体平行，并保留其历史与立约联想；译文不另加教义性解释。
- issue: מָשָׁל 的话语性质
  choice: 译为“诗歌”，强调正式的诗体宣告
  alternative: 译为“神谕”或“箴言”
  rationale: 上下文确有受神启示的宣告性质，但该词本身语义范围较宽；“神谕”可能过度明确，“箴言”又过窄，因此不在正文中替读者解决其全部体裁张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话，并以分行保留诗体平行。首句避免生硬直译“举起他的比喻”，用“吟诵诗歌”呈现正式宣告。正文中的所有脚注标记均已对应列出。
