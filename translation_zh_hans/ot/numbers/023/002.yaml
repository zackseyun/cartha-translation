  yaml_path: translation/ot/numbers/023/002.yaml
  text: Balak did as Balaam had spoken[a], and Balak and Balaam offered a bull and a ram on the altar.
translation:
  language: zh_hans
  text: 巴勒照巴兰所说的去做了；巴勒和巴兰在祭坛上献上了一头公牛和一只公羊。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “献上”直译为“使……上升”；在献祭语境中，意思是“献上”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: 做了
  rationale: 在“照……所说的”这一固定语境中，表示按吩咐行事；“做了”自然、准确。
- source_word: כַּאֲשֶׁר דִּבֶּר
  choice: 照……所说的
  rationale: 表达巴勒的行动与巴兰先前所说之话相符，也符合现代汉语叙事习惯。
- source_word: וַיַּעַל
  choice: 献了
  rationale: עלה的使役式在祭牲与祭坛的语境中是献祭用语，指把祭物献上；正文采用清楚自然的“献了”。
- source_word: פָּר
  choice: 一头公牛
  rationale: פָּר在献祭语境中指公牛；原文未在本节明确限定年龄，因此不增译“幼”。
- source_word: וָאַיִל
  choice: 和一只公绵羊
  rationale: אַיִל指公羊；用“公绵羊”可避免现代汉语中“公羊”可能被误解为姓氏或泛称，同时准确标示牲畜种类与性别。
- source_word: בַּמִּזְבֵּחַ
  choice: 在坛上
  rationale: בְּ在此表示祭牲被献在祭坛上；承接上文已有的祭坛，简洁译为“在坛上”。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“照……所说的做了”保留原文的顺从结构；“献了”传达希伯来语献祭习语，并以脚注说明其字面意象。脚注标记置于整句献祭陈述之后。
