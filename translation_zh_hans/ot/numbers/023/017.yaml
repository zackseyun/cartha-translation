base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/017.yaml
  text: He came to him[a], and behold, he was standing by his burnt offering, with the princes of Moab with him. And Balak said to him, “What has Yahweh spoken?”
translation:
  language: zh_hans
  text: 他来到巴勒那里；看哪，巴勒正站在自己的燔祭旁，摩押的首领也和他在一起。巴勒问他：“雅威说了什么？”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹא אֵלָיו
  choice: 他来到巴勒那里
  rationale: בוא本义为“来、进入”；上下文虽是巴兰回来见巴勒，原文只说“来到他那里”。为消除连续代词在中文中的歧义，按上下文明确宾语为巴勒。
- source_word: וְהִנּוֹ
  choice: 看哪，巴勒正……
  rationale: הִנֵּה类指示话语标记使读者注意眼前情景。“看哪”保留原文突然而鲜明的叙事效果；并明确此处代词所指是巴勒。
- source_word: נִצָּב
  choice: 正站在
  rationale: 分词表达当时持续的姿态；“正站在”自然呈现巴兰抵达时巴勒正在站立的状态。
- source_word: עַל עֹלָתוֹ
  choice: 在自己的燔祭旁
  rationale: עַל在这里表示与祭物相邻的位置，而非字面的“在……上面”；“旁”简洁自然。反身表达“自己的”清楚表明祭物属于巴勒。
- source_word: עֹלָה
  choice: 燔祭
  rationale: 这是指整只焚烧献上的祭物的标准献祭术语；“燔祭”是现代中文圣经语境中准确且通行的对应词。
- source_word: וְשָׂרֵי מוֹאָב אִתּוֹ
  choice: 摩押的首领也和他在一起
  rationale: שָׂרִים可指首领、官长或官员。“首领”既保留其地位含义，也不过度限定其具体政治身份；“也”顺畅表达并列陪同关系。
- source_word: וַיֹּאמֶר לוֹ בָּלָק
  choice: 巴勒问他
  rationale: 原文直译为“巴勒对他说”，但后接直接问句；中文用“问他”更自然，同时完整保留言语行为。
- source_word: מַה דִּבֶּר
  choice: 说了什么
  rationale: דבר意为“说、讲话”；完成式在直接问句中询问已经发出的神谕，中文“说了什么”准确自然。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见音译直接呈现四字神名，保留其专名性质，不用称号替代。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。译作“雅威”保留个人专名，并较贴近通常重构的发音；不以“主”这一称号替代，也不在正文中混入其他传统读法。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。通过点明“巴勒”解决原文代词在中文中容易产生的指代不清，同时保留“看哪”的叙事强调。שָׂרֵי取较宽泛的“首领”，不把身份收窄为王族或特定官职。
