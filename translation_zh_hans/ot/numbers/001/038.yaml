base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/038.yaml
  text: 'For the sons of Dan[a], by their generations, by their clans, by their fathers’ houses, according to the number of names, from twenty years old and upward, every male able to go out to war:'
translation:
  language: zh_hans
  text: 但的子孙，按他们的世系、宗族、父家，照名字的数目，凡二十岁及以上、能出去打仗的男子[a]：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“凡适合服兵役的人。”希伯来语的惯用说法字面意思是“出去打仗”。
    reason: 说明“能出去打仗”这一军事惯用语的功能含义及其字面表达。
lexical_decisions:
- source_word: לִבְנֵי דָן
  choice: 但支派的人
  rationale: לִבְנֵי דָן直译为“但的众子”，在支派人口登记的语境中指但的后裔，即但支派的人；采用现代中文自然表达，同时保留其支派归属。
- source_word: תּוֹלְדֹתָם
  choice: 按着宗族
  rationale: 此处指谱系或世系划分；“宗族”能表达共同祖系，又与后面的组织层级相衔接。
- source_word: לְמִשְׁפְּחֹתָם
  choice: 家族
  rationale: מִשְׁפָּחָה在以色列支派组织中指支派以下的亲族单位；译作“家族”，与“父家”有所区别。
- source_word: לְבֵית אֲבֹתָם
  choice: 父家
  rationale: 这是人口登记中的父系亲属单位术语；“父家”简洁保留了原文的社会结构，避免泛化为普通的“家庭”。
- source_word: בְּמִסְפַּר שֵׁמוֹת
  choice: 照名字的人数
  rationale: 保留原文按名计数的表达，说明登记涉及逐名点算，而不只是一项概括性人口总数。
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: 凡二十岁以上
  rationale: 自然准确地表达人口登记的年龄下限；“以上”包含二十岁。
- source_word: כֹּל יֹצֵא צָבָא
  choice: 能出去打仗的男子
  rationale: 原文惯用语字面为“所有出去从军/出战的”；结合本章男性军事人口登记的语境，以“男子”明确实际所指，并以“能出去打仗”保留原文意象。
theological_decisions:
- issue: 军事人口登记中的性别指向
  choice: 能出去打仗的男子
  alternative: 凡可服兵役的人
  rationale: 本章登记的是二十岁以上具备出战资格的男性。译文明确“男子”，既符合语境，也不将原文的男性指向中性化；脚注同时给出功能性译法。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语，并保留本章人口登记公式的层次和节奏。句末用冒号，因为本节是接续下文统计结果的引介。
