- source_word: פְּקֻדֵיהֶם
  choice: 被数点的
  rationale: 该词源于פקד，在本章人口统计的语境中指登记、数点在册的人；译作“被数点的”既保留被动含义，也符合《民数记》反复出现的统计用语。
- source_word: לְמַטֵּה
  choice: 支派中
  rationale: 介词ל与מַטֶּה连用，在此表示支派归属；结合汉语句法译作“支派中”，自然地表达这些被数点者属于该支派。
- source_word: רְאוּבֵן
  choice: 吕便
  rationale: 采用现代简体中文圣经中通行的人名、支派名译法。
- source_word: שִׁשָּׁה וְאַרְבָּעִים אֶלֶף וַחֲמֵשׁ מֵאוֹת
