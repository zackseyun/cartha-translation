base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/017.yaml
  text: So Moses and Aaron took these men[a], who had been designated by name.
translation:
  language: zh_hans
  text: 摩西和亚伦就带着这些按名指定的人[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“被按名点出的人”，即明确指名的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: 召集了
  rationale: לקח的基本义是“拿、带领”，但在这里宾语是上一段逐一列名的代表；按叙事语境，摩西和亚伦是把他们召集到一起。“召集了”以自然中文表达这里的实际动作，同时不增添“任命”等原文没有的意思。
- source_word: מֹשֶׁה וְאַהֲרֹן
  choice: 摩西和亚伦
  rationale: 采用现代中文圣经人名的通行译法。
- source_word: אֵת הָאֲנָשִׁים הָאֵלֶּה
  choice: 这些……的人
  rationale: 原文指前文所列的男性代表。中文以“这些人”自然表达；他们的代表身份由上下文说明，不在本节另加“首领”。
- source_word: אֲשֶׁר נִקְּבוּ בְּשֵׁמוֹת
  choice: 按名指定的人
  rationale: נקב的Nifal形式与בְּשֵׁמוֹת连用，表示被明确点名、指名或指定。“按名指定”兼顾逐名识别和正式选定的语境，并在脚注保留较贴近字面的表达。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“就”承接前文命令和名单；句式简洁，适合叙事及行政性语境。
