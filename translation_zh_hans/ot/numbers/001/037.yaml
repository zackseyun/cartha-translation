  language: zh_hans
  text: 便雅悯支派被数点的，共有三万五千四百人。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פְּקֻדֵיהֶם
  choice: 被数点的
  rationale: 该词源自פקד，在本节人口统计语境中指接受数点并计入总数的人；译作“被数点的”既保留被动含义，也符合《民数记》的庄重用语。末尾补出“人”使汉语数量表达自然，但不把它并入该词本身。
- source_word: לְמַטֵּה
  choice: 支派
  rationale: לְ与מַטֶּה构成反复出现的人口统计套语，标明所属支派；汉语用“便雅悯支派被数点的”自然表达这种归属关系，无须逐字译出介词。
- source_word: בִנְיָמִן
  choice: 便雅悯
  rationale: 采用现代中文圣经传统中通行的人名及支派名译法。
- source_word: חֲמִשָּׁה וּשְׁלֹשִׁים אֶלֶף וְאַרְבַּע מֵאוֹת
  choice: 三万五千四百
  rationale: 按现代汉语数词顺序准确表达原文总数35,400。
