  yaml_path: translation/ot/numbers/001/019.yaml
  text: just as Yahweh had commanded Moses[a], so he counted them in the wilderness of Sinai.
translation:
  language: zh_hans
  text: 雅威怎样吩咐摩西，摩西就怎样在西奈旷野登记了他们[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“数点了他们”或“召集编列了他们”。这个希伯来语动词可指登记造册、清点人数，或为编组而召集检阅。
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּאֲשֶׁר
  choice: 怎样……就照样
  rationale: 这一对应结构自然表达摩西的行动完全遵照此前的命令，也保留希伯来语所强调的符合关系。
- source_word: צִוָּה
  choice: 吩咐
  rationale: 该动词表示发出命令；“吩咐”在现代汉语叙事中自然、庄重，并清楚体现雅威对摩西的权威。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按其最可能的古代读音音译四字神名，保留经文中的专名，不以“主”等称号替代。
- source_word: אֶת מֹשֶׁה
  choice: 摩西
  rationale: אֶת是直接宾语标记，无须另译；“摩西”是“吩咐”的宾语。
- source_word: וַיִּפְקְדֵם
  choice: 摩西就照样……登记了他们
  rationale: פקד在本章人口调查的语境中指清点并登记人员；重复“摩西”比单用“他”更清楚，且主语由上下文确定。
- source_word: בְּמִדְבַּר סִינָי
  choice: 在西奈旷野
  rationale: “旷野”准确传达מִדְבָּר所指的荒野地带；“西奈旷野”是自然、通行的中文地名表达。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名。译作“雅威”保留其专名性质，并较贴近学界通常重建的读音；不以称号替换。
- issue: פקד在本节中的含义
  choice: 登记了他们
  alternative: 数点了他们；召集登记了他们
  rationale: 本章语境是人口调查和编组。“登记”涵盖造册含义，同时脚注保留“数点”或带召集、检阅意味的可能性，避免把词义收窄为单纯计数。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“怎样……就照样”体现严格遵命的关系；正文用“登记”贴合人口调查语境，脚注保留原词较宽的语义范围。
