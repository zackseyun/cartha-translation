  yaml_path: translation/ot/numbers/001/046.yaml
  text: So all those who were counted were six hundred three thousand five hundred and fifty[a].
translation:
  language: zh_hans
  text: 这样，所有被数点的人，共有六十万三千五百五十人[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “被数点的人”也可译作“被登记的人”或“被编入名册的人”；希伯来文指在这次统计中登记的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: 这样，……共有
  rationale: 这里的叙事性连接词引出并总结数点的结果；用“这样……共有”自然表达其承接和总结作用。
- source_word: כָּל הַפְּקֻדִים
  choice: 所有被数点的
  rationale: הַפְּקֻדִים指在这次人口统计中被登记、点算的人。“被数点的”保留被动含义，也与本章上下文的统计用语协调；“所有”保留כָּל的完整范围。
- source_word: שֵׁשׁ מֵאוֹת אֶלֶף וּשְׁלֹשֶׁת אֲלָפִים וַחֲמֵשׁ מֵאוֹת וַחֲמִשִּׁים
  choice: 六十万三千五百五十人
  rationale: 按现代汉语习惯完整表达希伯来文逐项相加所得的数字603,550；补出量词“人”，使中文自然清楚，所指由上下文确定。
