  text: אֵ֚לֶּה קריאי הָ/עֵדָ֔ה נְשִׂיאֵ֖י מַטּ֣וֹת אֲבוֹתָ֑/ם רָאשֵׁ֛י אַלְפֵ֥י יִשְׂרָאֵ֖ל הֵֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/016.yaml
  text: These were the ones called from the congregation[a], the leaders of their fathers’ tribes[b], the heads of the thousands of Israel.
translation:
  language: zh_hans
  text: 这些人就是从会众中召来的[a]，是各父系支派的领袖，也是以色列各“千人”单位[b]的首领。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“会众中被召集的”或“会众中被指定的”。希伯来语分词可指被呼召、召集或指定的人。
    reason: lexical_alternative
  - marker: b
    text: “千人”可以指实际由一千人组成的群体，也可以泛指以色列中的宗族或军事编组。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה ... הֵם
  choice: 这些人就是
  rationale: 首尾的指示词和独立代词共同形成强调性的确认句；用“这些人就是”自然表达这一辨认和强调。
- source_word: קריאי הָעֵדָה
  choice: 从会众中召来的
  rationale: קריאי 是 קרא 的被动分词，可指被呼召、召集或指定的人；此处译作“召来的”，保留被动含义而不把它限定为拣选或正式任命。属格关系在汉语中依语境自然表达为“从会众中”。
- source_word: נְשִׂיאֵי
  choice: 领袖
  rationale: נָשִׂיא 在支派治理语境中指居领导地位的人；“领袖”现代、庄重，也不带“王子”的世袭含义。
- source_word: מַטּוֹת אֲבוֹתָם
  choice: 各父系支派
  rationale: מַטּוֹת 指支派，אֲבוֹתָם 表明这些支派按父系祖属划分；“父系支派”简明保留原文的父系关系。
- source_word: רָאשֵׁי
  choice: 首领
  rationale: רֹאשׁ 字面为“头”，用于人物时指各单位的首长；“首领”符合现代汉语的行政和群体语境。
- source_word: אַלְפֵי יִשְׂרָאֵל
  choice: 以色列各“千人”单位
  rationale: אֶלֶף 可指实际的一千，也可指宗族或军事编组。加引号并补“单位”，既保留“千”的原文字面，又不武断认定其具体组织性质。
