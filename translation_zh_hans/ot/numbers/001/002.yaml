  text: שְׂא֗וּ אֶת רֹאשׁ֙ כָּל עֲדַ֣ת בְּנֵֽי יִשְׂרָאֵ֔ל לְ/מִשְׁפְּחֹתָ֖/ם לְ/בֵ֣ית אֲבֹתָ֑/ם בְּ/מִסְפַּ֣ר שֵׁמ֔וֹת כָּל זָכָ֖ר לְ/גֻלְגְּלֹתָֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/002.yaml
  text: Take a census of the whole congregation of the sons of Israel[a], by their clans, by their fathers’ houses, according to the number of names, every male[c][b], head by head.
translation:
  language: zh_hans
  text: 你们要普查[a]以色列子孙的全会众[b]：按他们的宗族、父家，照姓名数目，把所有男性逐一登记[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“抬起……的头”，在这里意为数点或登记人口。
    reason: lexical_alternative
  - marker: b
    text: 或译“以色列人”；希伯来文直译为“以色列的众子”。
    reason: lexical_alternative
  - marker: c
    text: 希伯来文直译为“按他们的头颅”，是逐人计数的习语。
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂאוּ אֶת רֹאשׁ
  choice: 普查
  rationale: 这个短语直译为“抬起……的头”，在本段行政语境中指为人口登记而数点；“普查”以自然的现代汉语表达其实际含义。
- source_word: כָּל עֲדַת
  choice: 全会众
  rationale: עֵדָה 指作为整体的以色列群体；“全会众”保留其共同体和集合性的含义。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列众子
  rationale: 保留希伯来文“以色列的众子”这一父系称谓，不将它直接概括为较宽泛的“以色列人”。
- source_word: לְמִשְׁפְּחֹתָם
  choice: 按他们的宗族
  rationale: מִשְׁפָּחָה 在此指支派内部的亲族单位；“宗族”比现代汉语的“家庭”更准确。
- source_word: לְבֵית אֲבֹתָם
  choice: 按他们的父家
  rationale: 该词组指按父系谱系组织的家族单位；“父家”简洁保留原文的父系结构。
- source_word: בְּמִסְפַּר שֵׁמוֹת
  choice: 照姓名的数目
  rationale: 原文强调按照登记的姓名计数；此译法保留其正式、行政性的措辞。
- source_word: כָּל זָכָר
  choice: 所有男性
  rationale: זָכָר 明确指男性，译作“男性”比“男人”更精确。
- source_word: לְגֻלְגְּלֹתָם
  choice: 按人头逐一数点
  rationale: 该词直指“他们的头颅”，在这里是逐人计算的习语；“按人头逐一数点”既保留头的意象，也清楚表达逐个登记。
