  to: 你们要普查[a]以色列子孙的全会众[b]：按他们的宗族、父家，照姓名数目，把所有男性逐一登记[c]。
  rationale: 修订仅调整汉语定语语序及行政动作的表达方式，未改变原文的范围、亲族分类、姓名计数或男性限定。脚注锚点及其说明均予保留。
