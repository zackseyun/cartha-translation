language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/הַ/לְוִיִּ֞ם יַחֲנ֤וּ סָבִיב֙ לְ/מִשְׁכַּ֣ן הָ/עֵדֻ֔ת וְ/לֹֽא יִהְיֶ֣ה קֶ֔צֶף עַל עֲדַ֖ת בְּנֵ֣י יִשְׂרָאֵ֑ל וְ/שָׁמְרוּ֙ הַ/לְוִיִּ֔ם אֶת מִשְׁמֶ֖רֶת מִשְׁכַּ֥ן הָ/עֵדֽוּת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/053.yaml
  text: But the Levites shall camp around the tabernacle of the testimony[a], so that there may be no wrath on the congregation of the sons of Israel; and the Levites shall keep charge of the tabernacle of the testimony.
translation:
  language: zh_hans
  text: 利未人却要在见证的帐幕四周扎营，免得烈怒临到以色列人的会众；利未人要负责看守见证的帐幕。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהַלְוִיִּם
  choice: 利未人却
  rationale: וְ承接上文，并与其他支派的安营安排形成对照；“却”能自然表达这一语篇关系。“利未人”是现代中文通行称呼。
- source_word: יַחֲנוּ סָבִיב
  choice: 要在……四周扎营
  rationale: 未完成式在此表达指令；“要……扎营”兼顾命令意味与自然中文，“四周”准确表达סָבִיב的空间意义。
- source_word: מִשְׁכַּן הָעֵדֻת
  choice: 见证帐幕
  rationale: מִשְׁכָּן指会幕或作为居所的帐幕，עֵדוּת指“见证”，在此与其中存放的圣约见证相关。“见证帐幕”保留原文术语及其指向，不直接窄化为某一具体器物。
- source_word: וְלֹא יִהְיֶה קֶצֶף
  choice: 免得烈怒临到
  rationale: 此句说明利未人如此安营的防范性目的。“烈怒”保留קֶצֶף所含的强烈、审判性色彩；原文没有明说发怒者，因此正文也不补出“上帝的”。
- source_word: עַל עֲדַת בְּנֵי יִשְׂרָאֵל
  choice: 临到以色列人的会众
  rationale: עַל与קֶצֶף连用时自然表示烈怒落在或临到某群体；עֵדָה译为“会众”，保留以色列作为聚集群体的含义。中文“以色列人”自然涵盖בְּנֵי יִשְׂרָאֵל在此所指的民族群体。
- source_word: וְשָׁמְרוּ ... אֶת מִשְׁמֶרֶת
  choice: 要负责守卫
  rationale: שׁמר与מִשְׁמֶרֶת构成同词根表达，兼有看守和履行受托职责之意；“负责守卫”在现代中文中简洁地传达两层含义。
- source_word: מִשְׁכַּן הָעֵדוּת
  choice: 见证帐幕
  rationale: 与本节前半句的相同短语保持一致，避免在同一节中无依据地改变圣所术语。
theological_decisions:
- issue: קֶצֶף在圣所语境中的性质
  choice: 译作“烈怒”，正文不明说发怒者
  alternative: 译作“上帝的烈怒”或一般性的“愤怒”
  rationale: 民数记的圣所边界语境表明这是因圣洁秩序受侵犯而可能临到会众的审判性烈怒；但本节希伯来文没有明确的所有格或主语，因此既保留其神学分量，也不在正文中补足原文隐含信息。
- issue: הָעֵדוּת所指为何
  choice: 保留“见证”这一较宽的称谓
  alternative: 明确译成“约版”“法版”或“约柜”
  rationale: 该词在五经中与圣约见证、尤其法版密切相关，但原词本身仍是“见证”；不把帐幕直接等同于约柜，也不把所指缩窄到未经本句明说的对象。
- issue: בְּנֵי יִשְׂרָאֵל的中文表达
  choice: 以色列人
  alternative: 以色列众子
  rationale: 希伯来语的“儿子们”在此是民族群体的惯用称呼。现代中文“以色列人”准确而自然；直译“以色列众子”容易被误解为仅指男性或雅各的亲生儿子。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“见证帐幕”作为礼仪术语略带经文语体，脚注帮助普通读者理解；其余表达如“四周扎营”“负责守卫”保持自然清晰。
