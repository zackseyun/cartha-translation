review_pass:
  verdict: revise
  source_fidelity: 正文准确传达了利未人围绕帐幕扎营、藉此避免烈怒临到以色列会众，以及他们受托看守帐幕的职责。“烈怒”恰当地保留了קֶצֶף的强度，而未擅自补出施怒者。惟“见证帐幕”在现代汉语中缺少必要的结构标记，容易被误解为“帐幕作见证”；改为“见证的帐幕”可清楚保留原文属格关系。
  naturalness: “四周扎营”“免得烈怒临到以色列人的会众”庄重自然。将“见证帐幕”改为“见证的帐幕”更合现代标准汉语的名词修饰习惯；“负责看守”也自然表达受托守卫的职责。
  terminology: “利未人”“会众”“烈怒”均合适。“见证的帐幕”既不将הָעֵדוּת窄化为法版或约柜，也比无“的”的复合名词更清晰。脚注应避免把“见证”直接界定为“圣约的见证”，因该具体指向虽很可能，却不由本节完全明说。
