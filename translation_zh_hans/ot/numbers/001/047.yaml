base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/047.yaml
  text: But the Levites, by their ancestral tribe, were not counted among them.
translation:
  language: zh_hans
  text: 但利未人按他们祖宗的支派[a]，没有和他们一同被登记数点[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“按他们父辈的支派”。
    reason: lexical_alternative
  - marker: b
    text: “登记数点”也可译作“登记”或“数点”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַלְוִיִּם
  choice: 但利未人
  rationale: 连词 וְ 在本节承接前文，却突出利未人未被纳入此前统计的对比，因此译作“但”；לְוִיִּם 采用通行名称“利未人”。
- source_word: לְמַטֵּה אֲבֹתָם
  choice: 按他们祖宗的支派
  rationale: מַטֶּה 在人口统计语境中指“支派”，אֲבֹתָם 字面为“他们的父辈”，在此表达祖系归属；译文保留原文的父祖谱系观念，同时使用自然庄重的现代汉语。
- source_word: לֹא הָתְפָּקְדוּ
  choice: 没有……被登记数点
  rationale: פקד 的 Hitpael 形式在本章人口统计语境中表示被编入名册并接受数点。“登记数点”兼顾正式登记与计数两层含义，避免只译“计算”而削弱人口登记的语境。
- source_word: בְּתוֹכָם
  choice: 和他们一同
  rationale: בְּתוֹכָם 字面为“在他们中间”，此处表示利未人没有被纳入其余支派受统计的群体；“和他们一同”在汉语中更自然地表达这种未被包括在内的关系。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的书面语。“祖宗”在经文语体中自然表达父祖谱系；“登记数点”明确本章人口普查的行政语境。所有脚注标记均置于相关词组之后。
