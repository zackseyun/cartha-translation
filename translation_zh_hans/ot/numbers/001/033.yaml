  text: 以法莲支派中被数点的，共有四万零五百人。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פְּקֻדֵיהֶם
  choice: 被数点的
  rationale: 这是源于פקד的被动性名词形式，带第三人称阳性复数后缀，在本章人口统计的语境中指被登记、点算的人。“被数点的”保留原文普查用语，也不额外强化军事含义。
- source_word: לְמַטֵּה
  choice: 支派中
  rationale: 介词ל与מַטֶּה构成本段反复出现的统计公式，表示归属于某支派；译为“支派中”符合现代汉语表达。
- source_word: אֶפְרָיִם
  choice: 以法莲
  rationale: 采用现代中文圣经传统中通行的人名及支派名译法。
- source_word: אַרְבָּעִים אֶלֶף וַחֲמֵשׁ מֵאוֹת
  choice: 四万零五百
  rationale: 准确表达四万五百（40,500）；采用中文大写数词形式，与庄重的叙事文体相称。
