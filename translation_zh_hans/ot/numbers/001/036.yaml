base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/036.yaml
  text: 'For the sons of Benjamin[a], by their generations, by their clans, by their fathers’ houses, according to the number of names, from twenty years old and upward, every man able to go out to war:'
translation:
  language: zh_hans
  text: 便雅悯的子孙，按他们的世系、宗族、父家，照人名的数目，凡二十岁及以上、能出去打仗的男子[a]：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“凡出去从军的”，这是指有资格服兵役的人。
    reason: 说明军事人口统计惯用语的字面形式和语境含义。
lexical_decisions:
- source_word: לִבְנֵי בִנְיָמִן
  choice: 便雅悯的子孙
  rationale: לִבְנֵי在本段人口统计格式中引出支派对象；译作“子孙”既自然，也准确表达便雅悯支派的后裔群体。
- source_word: תּוֹלְדֹתָם
  choice: 按他们的世系
  rationale: 此处指按血统和谱系归类；“世系”比“世代”更贴合人口登记的语境。
- source_word: לְמִשְׁפְּחֹתָם
  choice: 宗族
  rationale: מִשְׁפָּחָה在以色列支派结构中指支派之下的亲族群体；“宗族”可与后面的“父家”区分。
- source_word: לְבֵית אֲבֹתָם
  choice: 父家
  rationale: 保留古代以色列以父系家户为单位的专门亲属称谓，同时在中文圣经语体中简洁易懂。
- source_word: בְּמִסְפַּר שֵׁמֹת
  choice: 照人名的数目
  rationale: 紧贴原文“按名字的数目”，并用“人名”明确这里是逐名统计人员。
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: 凡二十岁以上
  rationale: 自然表达从二十岁起、包括二十岁的年龄下限。
- source_word: כֹּל יֹצֵא צָבָא
  choice: 能出去打仗的男子
  rationale: 该军事人口统计惯用语指符合出战或服役条件的人；结合阳性单数集合表达和上下文，译出“男子”，并以“能”传达资格含义。
