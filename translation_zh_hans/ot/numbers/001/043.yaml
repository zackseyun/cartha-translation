  text: 拿弗他利支派中被登记的人，共有五万三千四百人。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פְּקֻדֵיהֶם
  choice: 被数点的
  rationale: 该词源于פקד，在本章人口统计语境中指经登记、清点的人；“被数点的”既贴近被动含义，也符合《民数记》反复出现的统计用语。
- source_word: לְמַטֵּה
  choice: 支派中
  rationale: 介词ל与מַטֶּה连用，在此统计公式中表明支派归属；译作“支派中”符合现代汉语表达，并自然连接被统计的人数。
- source_word: נַפְתָּלִי
  choice: 拿弗他利
  rationale: 按现代中文圣经人名的通行音译处理该专名。
- source_word: שְׁלֹשָׁה וַחֲמִשִּׁים אֶלֶף
  choice: 五万三千
  rationale: 按现代汉语数词顺序表达五十三个千，不机械保留希伯来语“三又五十千”的排列。
- source_word: וְאַרְבַּע מֵאוֹת
  choice: 四百
  rationale: 直接按现代汉语数词表达，并与前项合成总数“五万三千四百”。
