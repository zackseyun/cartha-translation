source:
  edition: WLC
  text: וְ/אַתָּ֡ה הַפְקֵ֣ד אֶת הַ/לְוִיִּם֩ עַל מִשְׁכַּ֨ן הָ/עֵדֻ֜ת וְ/עַ֣ל כָּל כֵּלָי/ו֮ וְ/עַ֣ל כָּל אֲשֶׁר ל/וֹ֒ הֵ֜מָּה יִשְׂא֤וּ אֶת הַ/מִּשְׁכָּן֙ וְ/אֶת כָּל כֵּלָ֔י/ו וְ/הֵ֖ם יְשָׁרְתֻ֑/הוּ וְ/סָבִ֥יב לַ/מִּשְׁכָּ֖ן יַחֲנֽוּ־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/050.yaml
  text: But you[a], appoint the Levites over the tabernacle of the testimony, and over all its furnishings, and over all that belongs to it. They are to carry the tabernacle and all its furnishings, and they are to minister to it[b], and they are to camp around the tabernacle.
translation:
  language: zh_hans
  text: 但你要指派利未人负责见证的帐幕[a]、帐幕的一切器具，以及所有附属之物。他们要搬运帐幕和帐幕的一切器具，要在帐幕那里供职[b]，也要在帐幕四周安营。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或按字面译作“见证之帐幕”。“见证”在五经的圣所语境中可指与约有关的见证，常与约柜内的法版相关。
    reason: 保留 מִשְׁכַּן הָעֵדֻת 的形式表达，并说明“见证”可能的语境所指，而不将其限定为单一释义。
  - marker: b
    text: 或译“服事它”或“照料它”。原文动词在这里带有圣所职事的意味。
    reason: 保留该动词兼有服事、执行职务和照料的语义范围。
lexical_decisions:
- source_word: וְאַתָּה
  choice: 但你要
  rationale: 承接上文利未人不列入其他支派统计的安排，וְ 在这里带有转折意味；“但你要”自然地突出对摩西的直接命令。
- source_word: הַפְקֵד ... עַל
  choice: 指派……负责
  rationale: הַפְקֵד 是 פקד 的使役命令式，在此表示委派职责；与 עַל 连用，重点是使利未人承担管理和看守责任，而不只是一般的“任命”。
- source_word: מִשְׁכַּן הָעֵדֻת
  choice: 安放法版的帐幕
  rationale: מִשְׁכָּן 指作为上帝居所的圣所帐幕；הָעֵדֻת 在摩西五经的会幕语境中通常指约柜内作为“见证”的法版。正文以自然汉语表达其关联，同时用脚注保留较形式对应的译法。
- source_word: כֵּלָיו
  choice: 帐幕的一切器具
  rationale: כֵּלִים 在圣所语境中泛指各种器皿、用具和附属设备；“器具”既简明，又不把范围限定为某一类物品。
- source_word: כָּל אֲשֶׁר לוֹ
  choice: 一切属于帐幕的物件
  rationale: 直译为“一切归它所有的”；补出“帐幕”和“物件”，使中文指代清楚，同时保留宽泛范围。
- source_word: יִשְׂאוּ
  choice: 抬
  rationale: נשא 在此指迁营时实际负载、搬运帐幕及其器具；“抬”符合中文叙述中多人搬运圣所构件的情境。
- source_word: יְשָׁרְתֻהוּ
  choice: 在帐幕那里供职
  rationale: שרת 的加强词干常指承担职务，圣所语境下尤指礼仪性服事；译作“供职”保留神圣职事色彩，又不增添经文未明说的祭司职分。代词宾语按自然汉语作地点性表达。
- source_word: סָבִיב לַמִּשְׁכָּן יַחֲנוּ
  choice: 要在帐幕四周安营
  rationale: 未完成式在法规语境中有命令性；“四周安营”准确表达围绕帐幕驻扎的安排。
theological_decisions:
- issue: מִשְׁכַּן הָעֵדֻת 中“见证”的所指
  choice: 正文译为“安放法版的帐幕”，脚注保留“见证的帐幕”
  alternative: 见证的帐幕；法版的帐幕
  rationale: הָעֵדֻת 可形式化译为“见证”，但在五经圣所语境中具体关联作为约之见证的法版。正文以普通读者可理解的方式呈现，脚注则保留希伯来语结构及其含义张力。
- issue: שרת 的圣所职事意味
  choice: 供职
  alternative: 服事它；照料它
  rationale: “供职”体现制度化、神圣场所中的职责，却不将利未人的工作直接等同于祭司献祭，也不把动词淡化为普通照料。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“帐幕”沿用中文圣经中对便携圣所的通行称呼；句式适度重复“帐幕”，对应希伯来文的强调并避免代词含混。所有脚注标记均已置于正文相应位置。
