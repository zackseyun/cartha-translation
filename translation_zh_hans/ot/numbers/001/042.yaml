base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/042.yaml
  text: 'The sons of Naphtali[a], by their generations, by their clans, by their fathers’ houses, according to the number of names, from twenty years old and upward, every male able to go out to war:'
translation:
  language: zh_hans
  text: 拿弗他利的子孙，按着世系、宗族和父家，照人名的数目，从二十岁起，所有能出征作战的男子[a]：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“凡出去打仗的”或“凡出去从军的”。这是希伯来语惯用语，在这里指具备服兵役资格的人。
    reason: 保留 כֹּל יֹצֵא צָבָא 的较字面译法及其在军事人口统计语境中的含义。
lexical_decisions:
- source_word: בְּנֵי נַפְתָּלִי
  choice: 拿弗他利的子孙
  rationale: בְּנֵי 字面为“儿子们”，但在支派人口统计中指从拿弗他利而出的男性后裔；“子孙”既保留谱系关系，也符合现代汉语表达。
- source_word: תּוֹלְדֹתָם
  choice: 按着世系
  rationale: 该词在此指家族繁衍和谱系划分；“世系”比“世代”更准确地表达人口登记中的血缘脉络。
- source_word: לְמִשְׁפְּחֹתָם
  choice: 按着……宗族
  rationale: מִשְׁפָּחָה 在支派组织中指比现代核心家庭更大的亲族单位，因此译作“宗族”。
- source_word: לְבֵית אֲבֹתָם
  choice: 按着……父家
  rationale: 保留以父系家族为单位的以色列社会结构；“父家”简洁且是可理解的圣经谱系用语。
- source_word: בְּמִסְפַּר שֵׁמוֹת
  choice: 照人名的数目
  rationale: 表达按名字逐一登记并计数的含义，同时保留原文正式的人口统计措辞。
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: 二十岁以上
  rationale: 这是现代汉语表达年龄下限的自然说法，准确包含年满二十岁及更年长者。
- source_word: כֹּל יֹצֵא צָבָא
  choice: 凡出去服兵役的
  rationale: 原文近乎字面是“凡出去从军的”；在本章人口统计语境中，指具备参军资格的人。“服兵役”自然地传达军事含义，而脚注保留较形式对应的译法。
