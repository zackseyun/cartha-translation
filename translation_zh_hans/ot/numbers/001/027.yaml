  language: zh_hans
  text: 犹大支派被数点的人，共有七万四千六百人。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פְּקֻדֵיהֶם
  choice: 被数点的
  rationale: 这是动词 פקד 的被动形式，在人口普查语境中指被清点或登记的人。“被数点的”保留普查含义，也不在此短语中擅自增添原文未明说的“男丁”。
- source_word: לְמַטֵּה
  choice: 犹大支派
  rationale: 介词 לְ 与 מַטֶּה 连用，在这份普查名录中表示支派归属。汉语按自然语序译作“犹大支派被数点的”。
- source_word: יְהוּדָה
  choice: 犹大
  rationale: 采用现代中文圣经传统中通行的支派名称。
- source_word: אַרְבָּעָה וְשִׁבְעִים אֶלֶף וְשֵׁשׁ מֵאוֹת
  choice: 七万四千六百
  rationale: 按现代汉语数字表达呈现希伯来文所指的总数。
