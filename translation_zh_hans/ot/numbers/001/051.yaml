  text: וּ/בִ/נְסֹ֣עַ הַ/מִּשְׁכָּ֗ן יוֹרִ֤ידוּ אֹת/וֹ֙ הַ/לְוִיִּ֔ם וּ/בַ/חֲנֹת֙ הַ/מִּשְׁכָּ֔ן יָקִ֥ימוּ אֹת֖/וֹ הַ/לְוִיִּ֑ם וְ/הַ/זָּ֥ר הַ/קָּרֵ֖ב יוּמָֽת׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/051.yaml
  text: When the tabernacle is to set out[a], the Levites shall take it down; and when the tabernacle is to camp, the Levites shall set it up. And the outsider who comes near shall be put to death.
translation:
  language: zh_hans
  text: 会幕起行时，利未人要把它拆下；会幕安营时，利未人要把它支搭起来。擅自近前的人[a]必被处死。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“外人若近前”；这里指没有获准接近圣所或参与相关职务的人，并非专指族裔上的外邦人。
    reason: 说明זָר在圣所语境中的含义，并保留较贴近字面的另一译法。
lexical_decisions:
- source_word: וּבִנְסֹעַ הַמִּשְׁכָּן
  choice: 会幕起行时
  rationale: ב加不定式构成时间从句；נסע在旷野行程语境中表示拔营起行。直译为“会幕起行”保留原文以会幕为主语的表达。
- source_word: הַמִּשְׁכָּן
  choice: 会幕
  rationale: 这是现代中文圣经语境中对以色列可移动圣所的通行称呼，简洁且准确。
- source_word: יוֹרִידוּ אֹתוֹ
  choice: 把它拆下
  rationale: ירד的使役形在此指为搬运而卸下、拆除会幕；“拆下”既体现向下卸除的动作，也符合实际语境。
- source_word: הַלְוִיִּם
  choice: 利未人
  rationale: 该族群名称的标准中文译法。
- source_word: וּבַחֲנֹת הַמִּשְׁכָּן
  choice: 会幕安营时
  rationale: חנה表示扎营、安营；此处仍按原文保留“会幕”为语法主语，与“起行时”形成对称。
- source_word: יָקִימוּ אֹתוֹ
  choice: 把它支搭起来
  rationale: קום的使役形在此指竖立、搭设会幕；“支搭起来”自然表达搭建帐幕的动作。
- source_word: וְהַזָּר
  choice: 擅自……的人
  rationale: זָר在圣所职务语境中指没有获准承担或接近圣职者，并非主要指族裔上的外国人；“擅自”突出其未经授权，同时避免把范围武断限定为所有非利未人。
- source_word: הַקָּרֵב
  choice: 近前
  rationale: קרב表示接近；“近前”简洁保留圣所禁令公式的庄重语气。
- source_word: יוּמָת
  choice: 必被处死
  rationale: מות的使役被动形表明死亡是施加的刑罚，而不只是自然死亡；中文被动式也不指定执行者。
theological_decisions:
- issue: יוּמָת所表达的死亡性质
  choice: “必被处死”，理解为被动施加的死刑
  alternative: “必死”，理解为结果性的死亡警告
  rationale: 希伯来文为使役被动形，通常表达使某人死亡；译文保留法律和圣洁禁令的性质，却不补出执行刑罚的是人还是上帝。
- issue: זָר所指的人
  choice: 未经授权而接近圣所职务范围的人
  alternative: 族裔上的外邦人，或一概指任何非利未人
  rationale: 祭司和会幕语境中的זָר主要标示不具相关圣职资格者；采用“擅自近前的人”表达越权性质，不把原文收窄为族裔类别。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“起行／安营”和“拆下／支搭起来”形成清晰对称；末句保持法律警告的简洁力度。
