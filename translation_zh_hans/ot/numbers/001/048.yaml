  yaml_path: translation/ot/numbers/001/048.yaml
  text: Then Yahweh spoke to Moses[a], saying,
translation:
  language: zh_hans
  text: 雅威[a]对摩西说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文：יהוה（YHWH），神的名字；传统中文译作“耶和华”。
    reason: 说明原文神名的形式及传统中文译法。
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: 说
  rationale: 该动词表示“说、讲话”；叙事性 waw 推进上下文，但现代汉语在此无需机械译出“于是/又”，简洁的“说”自然且准确。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的专名“耶和华”对应四字神名 YHWH，并用脚注说明其希伯来文形式。
- source_word: אֶל
  choice: 对
  rationale: 在“对某人说”的汉语结构中，自然表达言语所指向的对象。
- source_word: מֹשֶׁה
  choice: 摩西
  rationale: 采用该人名的标准现代中文译名。
- source_word: לֵאמֹר
  choice: 说：
  rationale: 该不定词用于引出下文直接引语；汉语以“说：”及冒号自然保留其篇章功能，无需重复译作“说道”。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威；上主
  rationale: 原文直接使用 YHWH。正文采用中文传统且广为人知的专名“耶和华”，不以称号取代专名；脚注交代希伯来文字母形式，以保留原文信息。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。希伯来语的叙事连接形式不单独译出，以免汉语生硬；用冒号承接下一节的直接引语。
