source:
  edition: WLC
  text: וַֽ/יַּעֲשׂ֖וּ בְּנֵ֣י יִשְׂרָאֵ֑ל כְּ֠/כֹל אֲשֶׁ֨ר צִוָּ֧ה יְהוָ֛ה אֶת מֹשֶׁ֖ה כֵּ֥ן עָשֽׂוּ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/054.yaml
  text: So the sons of Israel did according to all that Yahweh had commanded Moses[a]; so they did.
translation:
  language: zh_hans
  text: 以色列人就照耶和华所吩咐摩西的一切做了；他们就是这样做的。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲשׂוּ
  choice: 就……做了
  rationale: עשה是含义宽泛的“做、行”；此处概括以色列对命令的执行，“做了”自然且保留原文用词的朴素性。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 该短语字面为“以色列的众子”，但在此作为民族共同体的常规称呼；现代汉语用“以色列人”准确、自然，也不误导为仅指雅各的亲生儿子。
- source_word: כְּכֹל אֲשֶׁר
  choice: 照……的一切
  rationale: 既表达行动与命令相符，也保留כֹל所强调的完整范围。
- source_word: צִוָּה
  choice: 所吩咐
  rationale: 完成式表示在先的命令；汉语“所吩咐”置于关系结构中，时序由上下文自然显明，无须另加时态标记。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代简体中文读者熟悉的专名形式直接呈现四字神名，而不以“主”这一称号替代。
- source_word: אֶת מֹשֶׁה
  choice: 摩西
  rationale: אֶת标明摩西是“吩咐”的直接宾语，故译作“吩咐摩西”，不添加原文没有的“给”。
- source_word: כֵּן עָשׂוּ
  choice: 他们就是这样做的
  rationale: 保留原文末尾对עשה的重复，并以“就是”传达כֵּן所强调的完全照办。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用神的专名而非“主”的称号。中文正文采用历史悠久且普通读者最熟悉的专名“耶和华”；“雅威”更接近一种现代学术拟音，但希伯来文辅音文本本身未完整保存古代读音。
- issue: בְּנֵי יִשְׂרָאֵל的指称范围
  choice: 以色列人
  alternative: 以色列的众子
  rationale: 此处指全体以色列共同体的行动，不宜让现代读者误解为仅指以色列的亲生儿子；“以色列人”保留实际指称范围。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。分号保留两小句间的总结与强调关系；末句不予顺译删除，以呈现希伯来文刻意的重复。
