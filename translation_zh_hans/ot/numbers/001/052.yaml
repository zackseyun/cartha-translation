  yaml_path: translation/ot/numbers/001/052.yaml
  text: The sons of Israel shall camp[a], each man by his camp and each man by his banner, according to their divisions.
translation:
  language: zh_hans
  text: 以色列人要各按本营、各按本旗，照着他们的队伍安营。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְחָנוּ
  choice: 要……安营
  rationale: 连词加Qal完成式在本段指示营地秩序的语境中具有将来兼规定意味；“要……安营”既自然，也保留命令性。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 原文直译为“以色列的众子”，在现代汉语中“以色列人”更自然，并准确指向以色列共同体。
- source_word: אִישׁ ... וְאִישׁ
  choice: 各……各……
  rationale: 以两个“各”再现原文重复的分配性结构，表达每个人都按所属单位就位，同时避免生硬重复“各人”。
- source_word: עַל מַחֲנֵהוּ
  choice: 归本营
  rationale: עַל在此表示位置或归属关系；“归本营”简明表达各人按自己所属营区安营，不把空间关系限定得过细。
- source_word: דִּגְלוֹ
  choice: 本旗
  rationale: דֶּגֶל指部族或军事编组的旗帜、旗号；“本旗”与“本营”平行，既凝练又体现所属关系。
- source_word: לְצִבְאֹתָם
  choice: 按着他们的队伍
  rationale: צָבָא在这里侧重有组织的编队或部队；“队伍”保留组织性而不夸大为正在作战的军队。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事法规语体。句末落在“安营”，使“各归本营、各在本旗之下、按着他们的队伍”共同修饰主要动作，并保留原文整齐的分配结构。
