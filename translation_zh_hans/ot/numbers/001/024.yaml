base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/024.yaml
  text: 'For the sons of Gad[a], by their generations, by their clans, by their fathers’ houses, according to the number of names, from twenty years old and upward[c][b], every man able to go out to war:'
translation:
  language: zh_hans
  text: 迦得的子孙，按他们的世系、宗族和父家，照名字的数目，凡二十岁以上、能出征的男丁：
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִבְנֵי גָד
  choice: 迦得子孙中
  rationale: ל 在人口统计条目中引出支派对象；“子孙”自然表达部族后裔，并结合后文“男丁”明确实际受点数者。
- source_word: תּוֹלְדֹתָם
  choice: 按宗族
  rationale: 此词在本段人口统计公式中指血统、世系所形成的群体；译作“宗族”既体现谱系关系，也适合现代汉语。
- source_word: לְמִשְׁפְּחֹתָם
  choice: 家族
  rationale: 指支派内部的亲族单位；与“宗族”和“父家”并列，保留原文逐层划分的结构。
- source_word: לְבֵית אֲבֹתָם
  choice: 父家
  rationale: 保留以父系家族为单位的希伯来社会术语，同时简洁庄重。
- source_word: בְּמִסְפַּר שֵׁמוֹת
  choice: 照名字的数目
  rationale: 贴近原文，表示按个人姓名逐一登记、计数，而不额外引入“名册”等原文未明说的概念。
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: 凡二十岁以上
  rationale: 以自然现代汉语表达人口统计的年龄下限。
- source_word: כֹּל יֹצֵא צָבָא
  choice: 能出去服兵役的男丁
  rationale: צָבָא 在此指军役；“能”表达该短语在统计语境中的服役资格，“男丁”呼应受点数的男性群体。
