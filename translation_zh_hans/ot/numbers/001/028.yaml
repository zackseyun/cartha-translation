base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/028.yaml
  text: 'For the sons of Issachar[a], by their generations, by their clans, by their fathers’ houses, by the number of names, from twenty years old and upward, every man able to go out to war:'
translation:
  language: zh_hans
  text: 以萨迦的子孙，按他们的世系、宗族和父家，按名数，凡二十岁及以上、能出去作战的男子[a]：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“所有出去作战的。”希伯来文直译近于“所有出去从军／出战的”；在本章人口统计的语境中，指符合军事服役条件的男子。
    reason: 保留 יֹצֵא צָבָא 较字面的表达，同时说明其在本章征点语境中的功能性含义。
lexical_decisions:
- source_word: לִבְנֵי יִשָּׂשכָר
  choice: 以萨迦子孙中
  rationale: בְּנֵי 字面为“儿子们”，在支派人口统计中指以萨迦的男性后裔或支派成员；译作“子孙”既保留宗族含义，也符合现代汉语。介词 לְ 在此引出统计对象，用“中”自然衔接后续分类。
- source_word: תּוֹלְדֹתָם
  choice: 按他们的世系
  rationale: תּוֹלְדוֹת 在此指世代相承的谱系或血统分系；“世系”保留其谱系意义，又不把它限定为书面的族谱。
- source_word: לְמִשְׁפְּחֹתָם
  choice: 宗族
  rationale: מִשְׁפָּחָה 在以色列支派结构中是支派之下的亲族单位；“宗族”比现代汉语中的一般“家庭”更准确。
- source_word: לְבֵית אֲבֹתָם
  choice: 父家
  rationale: 这是以色列亲属组织的固定表达，指以父系为单位的家族或家室；“父家”简洁地保留原文的父系结构。
- source_word: בְּמִסְפַּר שֵׁמוֹת
  choice: 照名字的数目
  rationale: 近似直译原文的人口统计用语，表明按列名的个人逐一计数；同时保持现代汉语可懂度。
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: 凡二十岁以上
  rationale: 这是包含二十岁在内的年龄门槛公式；现代汉语“二十岁以上”自然地表达这一范围。
- source_word: כֹּל יֹצֵא צָבָא
  choice: 能出去作战的男子
  rationale: 该短语字面近于“每一个出去从军／出战的”，在本章语境中指具备军事服役资格的男性；正文表达其语境功能，脚注保留较字面的另一种理解。
theological_decisions:
- issue: 人口统计中的性别限定
  choice: 能出去作战的男子
  alternative: 所有能出去作战的人
  rationale: 原文使用阳性形式，且本段统计的是以色列各支派中达到服役年龄的男性。明确译出“男子”忠实呈现语境中的性别范围，不作性别中和。
- issue: יֹצֵא צָבָא 是实际出战还是具备服役资格
  choice: 能出去作战
  alternative: 出去作战
  rationale: 在征点人口的语境中，该表达通常具有军事资格的功能性含义；但希伯来文分词本身可较直译为“出去作战的”，因此以脚注保留这一表达上的张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“世系、宗族和父家”保留原文由大到小的亲属组织层次；句末冒号承接下一节所列的统计总数。
