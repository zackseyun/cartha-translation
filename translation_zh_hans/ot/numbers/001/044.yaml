base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/044.yaml
  text: These are the ones counted[a], whom Moses and Aaron counted, and the leaders of Israel—twelve men[b], each one for his fathers’ house—were with them.
translation:
  language: zh_hans
  text: 这些就是被数点的人[a]，是摩西、亚伦和以色列的首领所数点的。这十二位首领各自代表自己的父家[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“登记在册的人”。希伯来文既可着重被数点的人，也可着重人口登记这一结果。
    reason: lexical_alternative
  - marker: b
    text: “父家”指以父系祖先为基础的家族或宗族单位，是以色列支派结构中的一个层级。
    reason: cultural_note
lexical_decisions:
- source_word: הַפְּקֻדִים
  choice: 被数点的人
  rationale: 该被动分词在本章人口统计的语境中主要指接受登记、数点的人；“被数点的人”既保留其人称指向，也与后面的同根动词相呼应。
- source_word: פָּקַד
  choice: 数点
  rationale: 此处指为人口统计而逐一清点、登记；“数点”符合《民数记》的语境，也比单纯的“数”更庄重明确。
- source_word: נְשִׂיאֵי יִשְׂרָאֵל
  choice: 以色列的首领
  rationale: נָשִׂיא在这里指各支派领袖；“首领”准确自然，并避免“王子”所暗示的王室身份。
- source_word: שְׁנֵים עָשָׂר אִישׁ
  choice: 共有十二人
  rationale: 原文明确为十二名男子；在这一已由“首领”限定身份的句子中，“十二人”自然表达人数而不改变所指。
- source_word: אִישׁ אֶחָד
  choice: 一人
  rationale: 与前置的“每个父家”合用，清楚保留“一家一个”的分配意义。
- source_word: לְבֵית אֲבֹתָיו
  choice: 每个父家
  rationale: “父家”保留以父系祖先为基础的家族或宗族单位；结合上下文译为“每个父家一人”，体现这些首领的代表关系。
- source_word: הָיוּ
  choice: 共有
  rationale: 原文的系词说明这些首领为十二人，并各自对应一个父家。中文用“共有十二人”自然承载这一断言，避免生硬直译为“他们是”。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“数点”保留本章人口统计的传统语感；将较长的希伯来语句分成两句，以符合现代汉语表达，同时保留摩西、亚伦和以色列首领共同执行数点，以及十二位首领各代表一个父家的信息。
