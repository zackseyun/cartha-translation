base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/003.yaml
  text: From twenty years old and upward[b][a], every man going out to war in Israel—you and Aaron shall count them by their companies.
translation:
  language: zh_hans
  text: 凡以色列中二十岁以上、能出征的男子[a]，你和亚伦要按他们所属的军队单位[b]登记人数。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“凡出征的人。”原文是军事惯用语，指有资格服役的人；本章上下文明确统计对象为男性。
    reason: lexical_alternative
  - marker: b
    text: 或译：“按他们的各军”或“按他们的军事单位”。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: 二十岁以上
  rationale: 自然、准确地表达希伯来语所规定的最低年龄；“以上”包含二十岁。
- source_word: כָּל יֹצֵא צָבָא
  choice: 能出征的男子
  rationale: 这是军事惯用语，指具备服役资格的人。“能出征”在现代汉语中清楚传达资格含义；本章人口统计的对象明确为男性，因此译出“男子”。脚注保留较贴近字面的表达。
- source_word: בְּיִשְׂרָאֵל
  choice: 以色列中
  rationale: 表示以色列群体之内，符合此处全国性人口统计的语境。
- source_word: תִּפְקְדוּ אֹתָם
  choice: 登记人数
  rationale: פקד在本章指为人口统计和军事服役进行点算、登记；“登记人数”兼顾现代汉语的清晰度与统计语境。
- source_word: לְצִבְאֹתָם
  choice: 按他们的军队编制
  rationale: 该词与צָבָא相关，表示按军事队伍或单位加以组织、统计；“军队编制”保留军事含义，又避免古奥表达。
- source_word: אַתָּה וְאַהֲרֹן
  choice: 你和亚伦
  rationale: 直接保留原文明确且带强调意味的执行者。
theological_decisions:
- issue: 军事服役对象的性别表述
  choice: 能出征的男子
  alternative: 能出征的人
  rationale: 单看该短语可按形式译作“凡出征的人”，但本章前文明确规定统计男性；译作“男子”忠实反映实际所指，并在脚注说明原文表达。
translation_notes:
  register: 采用现代、庄重而通顺的书面汉语。“登记人数”清楚呈现人口统计行动；“军队编制”保留原文的军事组织色彩。脚注标记均置于其所解释的词组之后。
