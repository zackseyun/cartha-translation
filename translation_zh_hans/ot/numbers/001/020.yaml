base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/020.yaml
  text: 'The sons of Reuben[a], the firstborn of Israel, by their generations, by their clans, by their fathers’ houses, according to the number of names, head by head, every male from twenty years old and upward, everyone going out to war:'
translation:
  language: zh_hans
  text: 以色列的长子吕便的子孙，照他们的世系、宗族和父家，按姓名逐一数点[a]；凡二十岁以上、出去从军的男子，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “逐一”原文直译为“按各人的头颅”，是逐个人清点的说法。
    reason: 保留 לְגֻלְגְּלֹתָם 的字面意象，同时在正文中采用自然、易懂的中文。
lexical_decisions:
- source_word: וַיִּהְיוּ בְנֵי רְאוּבֵן
  choice: 吕便的子孙
  rationale: 本节是人口统计句式的一部分；将 וַיִּהְיוּ 融入中文列举结构，比直译为“是”更自然。“子孙”在支派谱系语境中准确表达 בְנֵי 所指的后裔群体。
- source_word: בְּכֹר יִשְׂרָאֵל
  choice: 以色列长子
  rationale: 保留同位语关系，说明吕便是以色列的长子，措辞简洁自然。
- source_word: תּוֹלְדֹתָם
  choice: 照他们的世系
  rationale: תּוֹלְדוֹת 在此指谱系和世代传承；“世系”既贴近原文，又避免把它限定为书面家谱记录。
- source_word: לְמִשְׁפְּחֹתָם
  choice: 宗族
  rationale: מִשְׁפָּחָה 在支派组织中指支派以下的亲族单位；“宗族”可与随后更小的“父家”相区别。
- source_word: לְבֵית אֲבֹתָם
  choice: 父家
  rationale: 保留希伯来文人口统计中的技术性亲属称谓，指以父系家庭为单位的家族群体。
- source_word: בְּמִסְפַּר שֵׁמוֹת
  choice: 按姓名
  rationale: 表达按名字登记、计数个人的意思；中文不必生硬重复“姓名的数目”。
- source_word: לְגֻלְגְּלֹתָם
  choice: 逐一数点
  rationale: 该词字面为“按各人的头颅”，在这里是逐人清点的习语；正文采用自然中文，脚注保留原文意象。
- source_word: כָּל זָכָר
  choice: 凡……男子
  rationale: 准确表达所有符合条件的男性；在现代中文中，“男子”比“雄性”或单用“男的”更庄重自然。
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: 二十岁以上
  rationale: 这是现代中文表达年龄下限的标准说法，完整涵盖“从二十岁起及以上”。
- source_word: כֹּל יֹצֵא צָבָא
  choice: 出去从军的
  rationale: 紧贴“出去加入军队”的分词表达，并在中文中清楚呈现人口统计所针对的军事服役群体；不额外加入原文没有明说的“有能力”或“合格”。
