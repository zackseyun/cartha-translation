base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/030.yaml
  text: 'For the sons of Zebulun[a], by their generations, by their clans, by their fathers’ houses, according to the number of names, from twenty years old and upward, every male able to go out to war:'
translation:
  language: zh_hans
  text: 西布伦子孙，按世系、宗族和父家，按名字的数目，凡二十岁以上、能出去打仗的男子[a]：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“适合服兵役的”。希伯来语直译为“出去打仗的”。
    reason: 说明希伯来军事惯用语的字面表达及其功能性译法。
lexical_decisions:
- source_word: לִבְנֵי זְבוּלֻן
  choice: 西布伦子孙中
  rationale: לְ在本章人口统计的分支标题中引出所统计的支派；“子孙”自然表达部族后裔，“中”则与后续列举相衔接。西布伦采用现代中文圣经中通行的专名译法。
- source_word: תּוֹלְדֹתָם
  choice: 按世系
  rationale: 此词在这里指按血统传承所作的登记或归类；“世系”保留其谱系含义，也比“各代”更符合人口统计语境。
- source_word: לְמִשְׁפְּחֹתָם
  choice: 宗族
  rationale: מִשְׁפָּחָה在支派内部表示扩展亲属群体；“宗族”比现代汉语中范围较窄的“家庭”更准确。
- source_word: לְבֵית אֲבֹתָם
  choice: 父家
  rationale: 保留希伯来人口统计与亲属制度中的固定表达，指以父系祖先为单位的家族群体，不泛化为“祖籍”。
- source_word: בְּמִסְפַּר שֵׁמוֹת
  choice: 照人名的数目
  rationale: 既保留“名字”这一原文意象，也用“人名”明确这是逐名登记的人数，而不直接意译为“点人数目”。
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: 凡二十岁以上
  rationale: 自然、准确地表达从二十岁起算的年龄门槛；“以上”在现代中文中包含二十岁本身。
- source_word: כֹּל יֹצֵא צָבָא
  choice: 能出去打仗的男子
  rationale: יֹצֵא צָבָא字面为“出去参战／从军的”，在本章指有资格承担军事任务者。“能”传达资格或能力，“男子”根据“从二十岁的儿子”和军事人口统计的语境明确其男性范围。
theological_decisions:
- issue: 军事人口统计中的性别范围
  choice: 能出去打仗的男子
  alternative: 所有能出去打仗的人
  rationale: 虽然כֹּל本身是“所有”，没有另带“男人”一词，但前面的מִבֶּן（从……岁的儿子／男性）以及本章军事登记语境限定了统计对象为成年男性。译作“男子”明确原文语境，而不将范围性别中和。
- issue: יֹצֵא צָבָא的军事含义
  choice: 能出去打仗的
  alternative: 适合服兵役的
  rationale: 正文保留希伯来语“出去”与军事行动的具体意象；脚注提供较功能性的译法，不把该短语仅仅制度化解释为一般兵役。
translation_notes:
  register: 采用现代、庄重而易懂的行政统计语体，并保留本章反复出现的谱系层级。句末冒号表明本节是后续人数数字的引介。
