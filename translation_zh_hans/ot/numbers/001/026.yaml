base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/026.yaml
  text: 'For the sons of Judah[a], by their generations, by their clans, by their fathers’ houses, according to the number of names, from twenty years old and upward, every male going out to war:'
translation:
  language: zh_hans
  text: 犹大子孙中，按他们的世系、宗族、父家，照名字逐一数点，二十岁以上凡出去打仗的男子[a]：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“凡出去服兵役的男子”。这个希伯来语习语指有资格服兵役的人。
    reason: 说明军事习语在本段人口统计中的语境含义，并提供较解释性的译法。
lexical_decisions:
- source_word: לִבְנֵי יְהוּדָה
  choice: 犹大子孙中
  rationale: בני 字面为“儿子们”，但在支派人口统计中指犹大的男性后裔或支派成员；“子孙”既保留血缘含义，也符合现代汉语的族谱语境。“中”承接本章逐支派列举的句法。
- source_word: תּוֹלְדֹתָם
  choice: 按他们的世系
  rationale: תולדות 可指世代、谱系或家谱记录；此处强调按血缘谱系编排。“世系”保留其范围，不武断地理解为书面档案。
- source_word: לְמִשְׁפְּחֹתָם
  choice: 宗族
  rationale: משפחה 在以色列支派结构中指支派之下的亲族群体，比现代汉语的普通“家庭”范围更大；“宗族”较准确。
- source_word: לְבֵית אֲבֹתָם
  choice: 父家
  rationale: 该词组字面为“他们父亲的家”，指父系家族单位。“父家”简洁保留原文的父系结构和固定人口统计用语。
- source_word: בְּמִסְפַּר שֵׁמֹת
  choice: 照名字逐一数点
  rationale: 原文是“按名字的数目”，表示按名登记并计数。译为“照名字逐一数点”在现代汉语中更自然，并保留逐名统计的意义。
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: 二十岁以上
  rationale: 这是人口统计中的年龄门槛固定语，包含年满二十岁者；“二十岁以上”简明自然。
- source_word: כֹּל יֹצֵא צָבָא
  choice: 凡出去打仗的男子
  rationale: 短语字面是“凡出去从军/打仗的”。“出去打仗”保留原文的动态军事习语；根据本段男性军事人口统计的语境，用“男子”明确其所指，而脚注说明其服兵役资格含义。
theological_decisions:
- issue: 人口统计用语的性别所指
  choice: 凡出去打仗的男子
  alternative: 凡能服兵役的人
  rationale: 希伯来语形式为阳性，且本段统计的是达到军役年龄的男性。正文不作性别中和，也不把“能”直接加入正文，以免将习语的解释完全替代原文表达。
- issue: 军事习语的解释程度
  choice: 正文保留“出去打仗”，脚注说明服兵役资格
  alternative: 正文直译为“凡出去从军的”或解释为“凡有资格服兵役的”
  rationale: 原文既可按字面理解为出征，也在统计公式中指有资格服军役者。正文与脚注配合，保存这一措辞与语境意义之间的张力。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“世系—宗族—父家”保留原文由较大到较小的父系社会单位排列；冒号保留本节作为下一节人数总计引句的未完结构。
