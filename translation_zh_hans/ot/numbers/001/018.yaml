base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/018.yaml
  text: And they assembled all the congregation on the first day of the second month[a], and they registered themselves by clans, by their fathers’ houses, according to the number of names, from twenty years old and upward[b], head by head.
translation:
  language: zh_hans
  text: 他们在第二个月的第一日召集全体会众；会众按各自的宗族和父家申报世系[a]；二十岁及以上的，按名字逐人计算[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“按族谱登记自己”。原文动词是一种罕见的族谱用语，表示依据血缘世系申报或登记身份。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“按他们的头颅”，是指把每个人逐一数点。
    reason: lexical_alternative
lexical_decisions:
- source_word: הִקְהִילוּ
  choice: 召集
  rationale: 该词为קהל的使役式，表示使人聚集；“召集”自然体现主动召聚全体会众的意思。
- source_word: כָּל הָעֵדָה
  choice: 全体会众
  rationale: עֵדָה指以色列共同体或集会群体；“全体会众”兼顾其群体性及כָּל所表达的整体范围。
- source_word: בְּאֶחָד לַחֹדֶשׁ הַשֵּׁנִי
  choice: 在二月初一
  rationale: 这是希伯来语日期惯用表达，直译为“在第二月的一日”，现代汉语自然表达为“二月初一”。
- source_word: וַיִּתְיַלְדוּ
  choice: 申报世系
  rationale: 该词是ילד罕见的反身式族谱用语，在此表示依据血缘世系申报或登记身份；“申报世系”既保留族谱含义，也符合人口统计的行政语境。
- source_word: עַל מִשְׁפְּחֹתָם
  choice: 按各自的宗族
  rationale: מִשְׁפָּחָה在支派组织和人口统计语境中常指宗族层级的亲属群体，“宗族”比泛称“家庭”更准确。
- source_word: לְבֵית אֲבֹתָם
  choice: 按各自的父家
  rationale: 这是以色列社会组织中的固定亲属单位称谓；“父家”保留原文父系家族结构，避免笼统译作“家庭”。
- source_word: בְּמִסְפַּר שֵׁמוֹת
  choice: 按名字逐一数点
  rationale: 该短语表示依据具名的个人进行统计；此译清楚呈现点名计数的方式。
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: 二十岁及以上的
  rationale: 这是规定年龄下限的固定表达；译文简洁、自然，并准确保留范围。
- source_word: לְגֻלְגְּלֹתָם
  choice: 逐人登记
  rationale: 该词字面意为“按他们的头颅”，在统计语境中是逐个计算个人的习语；正文以自然汉语表达，字面意象在脚注说明。
