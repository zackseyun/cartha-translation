  text: אַ֣ךְ אֶת מַטֵּ֤ה לֵוִי֙ לֹ֣א תִפְקֹ֔ד וְ/אֶת רֹאשָׁ֖/ם לֹ֣א תִשָּׂ֑א בְּ/ת֖וֹךְ בְּנֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/049.yaml
  text: Only the tribe of Levi you shall not count[a], and you shall not take their number among the sons of Israel.
translation:
  language: zh_hans
  text: 只是，利未支派你不可数点，也不可在以色列人[a]中计算他们的人数。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“以色列的儿子们”；这是对以色列民族的惯用称谓。
    reason: 说明 בְּנֵי יִשְׂרָאֵל 的字面形式及其集合性惯用意义。
lexical_decisions:
- source_word: אַךְ
  choice: 唯独
  rationale: 此处引出对前述人口统计命令的例外；“唯独”准确表达限制和排除之意。
- source_word: מַטֵּה לֵוִי
  choice: 利未支派
  rationale: מַטֶּה 在人口统计和以色列部族的语境中指“支派”，不是其本义“杖”。
- source_word: תִפְקֹד
  choice: 数点
  rationale: פקד 在本段指为人口或军事编组而清点人数；“数点”既简明，也符合本章人口统计的语境。
- source_word: רֹאשָׁם
  choice: 他们的人数
  rationale: 该词字面涉及“头”，但与 נשׂא 连用时是人口统计用语，意为总人数或人头数；译作“人数”自然清楚。
- source_word: תִשָּׂא
  choice: 计入
  rationale: נשׂא 与 רֹאשׁ 构成人口统计表达；结合介词 בְּתוֹךְ，译作“把……人数计入……中”准确传达其语境意义，避免生硬直译为“举起”。
- source_word: בְּתוֹךְ
  choice: ……中
  rationale: 此处表示利未支派不可包括在以色列众子的统计范围内；“计入……中”是自然的现代汉语表达。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列众子
  rationale: 保留希伯来文阳性复数的盟约群体称谓及其与“以色列”的父子关系表达，同时以脚注说明现代汉语常用译法。
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל 的性别化盟约称谓
  choice: 以色列众子
  alternative: 以色列人
  rationale: 希伯来文直称“以色列的众子”，并作为全民族的固定称谓。正文保留其阳性和亲属关系意象，脚注则说明较自然的集合性译法，不将其含义静默中性化。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“数点”保留人口统计语境中的经文用语；后半句用“把他们的人数计入……中”自然呈现希伯来文重复而不合并两个禁令。
