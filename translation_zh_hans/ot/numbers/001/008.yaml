- source_word: נְתַנְאֵל
  choice: 拿坦业
  rationale: 人名按现代中文圣经常见形式音译，不按其词源含义“上帝赐予”意译。
- source_word: בֶּן
  choice: ……的儿子
  rationale: 在父子身份说明中，בֶּן 通常表示直接的父子关系；本处没有理由泛化为“后裔”。
- source_word: צוּעָר
  choice: 苏押
  rationale: 专名采用现代中文圣经中通行的音译形式。
