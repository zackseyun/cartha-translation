  text: Their numbered men from the tribe of Manasseh were thirty-two thousand two hundred.
translation:
  language: zh_hans
  text: 玛拿西支派被数点的人，共有三万二千二百人。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פְּקֻדֵיהֶם
  choice: 被数点的
  rationale: 该词是动词 פקד 的被动形式，在人口统计语境中指接受登记、被计数的人。上下文已明确所数点的是符合条件的男子，本节用“被数点的”自然承接前文，避免无根据地补入原文此处未明说的“男丁”。
- source_word: לְמַטֵּה
  choice: 支派
  rationale: 介词 לְ 与 מַטֶּה 连用，在反复出现的统计公式中标明支派归属。汉语以“玛拿西支派被数点的”即可自然表达“属于玛拿西支派而被数点的人”。
- source_word: מְנַשֶּׁה
  choice: 玛拿西
  rationale: 采用现代中文圣经传统中通行的人名音译。
- source_word: שְׁנַיִם וּשְׁלֹשִׁים אֶלֶף וּמָאתָיִם
  choice: 三万二千二百
  rationale: 按现代汉语数词顺序准确表达希伯来文的数值三万二千二百。
