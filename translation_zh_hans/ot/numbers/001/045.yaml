    reason: lexical_alternative
  - marker: b
    text: 或译“所有适合服兵役的”。原文直译近于“所有出去从军的”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: 这样，……的
  rationale: 承接前文各支派的统计并作总结；用“这样”表达叙事推进及归总意味。原句的系词意义须与下一节的总数合读，因此本节保留未完句式。
- source_word: כָּל פְּקוּדֵי
  choice: 被数点的
  rationale: פקד在此指人口清点或军事登记；“被数点的”保留其被动、统计性的含义，也与本章语境一致。
- source_word: בְנֵי יִשְׂרָאֵל
  choice: 以色列众子
  rationale: 较直接地保留“以色列的众子”这一阳性表达；本次统计明确以具备出征资格的成年男子为对象，因此不在正文中泛化为不标明性别的族群称谓。
- source_word: לְבֵית אֲבֹתָם
  choice: 按父家
  rationale: “父家”体现这次统计所依据的父系宗族单位；“按”自然表达分类或归属标准。
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: 凡二十岁以上
  rationale: 准确而自然地表达年龄门槛，包括年满二十岁者。
- source_word: כָּל יֹצֵא צָבָא
  choice: 能出征的
  rationale: 该习语直译近于“每一个出去从军的”；结合军事人口统计的语境，“能出征的”简洁表达具备出征或服役资格者，同时保留行动意象。
- source_word: בְּיִשְׂרָאֵל
  choice: 以色列众子中
  rationale: 介词短语表达在以色列群体之中的范围；汉语将其前置并与主语合并，可避免句末生硬重复。
