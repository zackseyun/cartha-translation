    rationale: “凡二十岁以上、所有能出征的男子”将“凡”与“所有”重叠使用，且顿号连接的结构不平行。应改为“逐名数点二十岁及以上所有能出征作战的男子”，使年龄条件和军事条件共同修饰被数点者。
  revised_text: 约瑟的子孙中，就是以法莲的子孙，按着他们的世系、宗族和父家，逐名数点二十岁及以上所有能出征作战的男子[a]：
