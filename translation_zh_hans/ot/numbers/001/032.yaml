revisions:
- from: 约瑟的子孙中，以法莲的子孙，按着他们的世系、宗族、父家，逐名数点；凡二十岁以上、所有能出征的男子[a]：
  to: 约瑟的子孙中，就是以法莲的子孙，按着他们的世系、宗族和父家，逐名数点二十岁及以上所有能出征作战的男子[a]：
  rationale: 修订仅处理中文句法和支派层级的明确性：以“就是”自然连接约瑟与以法莲，并将年龄与军事条件整合为“逐名数点”的受事。保留原文的登记公式、男性军事人口范围及句末冒号。
