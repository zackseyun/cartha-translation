base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/032.yaml
  text: 'For the sons of Joseph[a], for the sons of Ephraim, by their generations, by their clans, by their fathers’ houses, by the number of names, from twenty years old and upward, every man going out to war:'
translation:
  language: zh_hans
  text: 约瑟的子孙中，就是以法莲的子孙，按着他们的世系、宗族和父家，逐名数点二十岁及以上所有能出征作战的男子[a]：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“所有服兵役的男子”。希伯来语直译为“所有出去作战的人”。
    reason: 说明军事惯用语的字面意义及另一种自然译法。
lexical_decisions:
- source_word: לִבְנֵי יוֹסֵף
  choice: 约瑟的子孙中
  rationale: בנים在此指约瑟支派性的后裔；译作“子孙”比“儿子”更符合人口统计语境。介词לְ在此引出支派项目，并结合下一个短语自然译为“……中”。
- source_word: לִבְנֵי אֶפְרַיִם
  choice: 以法莲的子孙
  rationale: 说明约瑟后裔中所统计的是以法莲支派；“子孙”保留谱系关系，也符合现代汉语。
- source_word: תּוֹלְדֹתָם
  choice: 按着他们的世系
  rationale: תולדות在此表示世代相承的谱系，而非明确指书面档案；“世系”简洁地保留这一含义。
- source_word: לְמִשְׁפְּחֹתָם
  choice: 宗族
  rationale: מִשְׁפָּחָה在以色列支派组织中指大于一般家庭的亲族单位；“宗族”比现代意义的“家庭”更准确。
- source_word: לְבֵית אֲבֹתָם
  choice: 父家
  rationale: 这是人口统计中的固定父系亲属单位；“父家”保留希伯来语的结构和父系谱系用语。
- source_word: בְּמִסְפַּר שֵׁמוֹת
  choice: 逐名数点
  rationale: 希伯来语字面为“按名字的数目”；“逐名数点”自然表达逐一登记、统计姓名的意思。
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: 凡二十岁以上
  rationale: 准确表达该人口统计的年龄下限，并符合现代汉语习惯。
- source_word: כֹּל יֹצֵא צָבָא
  choice: 所有能出征的男子
  rationale: 该短语字面指“所有出去作战的人”，在本段人口统计中指达到服役条件的成年男子；“能出征”传达资格含义，“男子”明确保留统计对象的性别。
theological_decisions:
- issue: 人口统计用语中的性别指向
  choice: 所有能出征的男子
  alternative: 所有能出征的人
  rationale: 上下文统计的是二十岁以上可出征的男性。明确译作“男子”避免把原文所指范围不恰当地性别中和，同时不加入额外的神学解释。
- issue: יֹצֵא צָבָא的军事含义
  choice: 能出征
  alternative: 服兵役
  rationale: “出征”保留原文“出去作战”的具体意象；“服兵役”虽能表达制度性含义，却较为行政化，可能弱化原文措辞。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。用“世系、宗族、父家”保留人口统计公式中的层级关系；以分号划分登记方式与年龄、军事资格条件。
