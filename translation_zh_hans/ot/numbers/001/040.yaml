base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/040.yaml
  text: 'For the sons of Asher[a], by their generations, by their clans, by their fathers’ houses, according to the number of names, from twenty years old and upward, every man going out to war:'
translation:
  language: zh_hans
  text: 亚设的子孙，按他们的世系、宗族、父家，照名字的数目，凡二十岁以上、能出去作战的男子[a]：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译作“所有出去作战的”；这是指可服兵役、出战的人。
    reason: 说明“出去作战”这一希伯来语军事习语在本章人口统计语境中的含义。
lexical_decisions:
- source_word: לִבְנֵי אָשֵׁר
  choice: 亚设子孙中
  rationale: לְ在此引出人口统计中的支派项目；“亚设子孙”既保留血缘与支派含义，也符合现代汉语表达。
- source_word: תּוֹלְדֹתָם
  choice: 按着宗族
  rationale: 该词在本段人口统计公式中指按世系划分的人群；“宗族”表达世系关系，同时避免把它过度解释为书面家谱。
- source_word: לְמִשְׁפְּחֹתָם
  choice: 家族
  rationale: מִשְׁפָּחָה指支派以下的亲属群体；“家族”自然易懂，并与后面的“父家”有所区分。
- source_word: לְבֵית אֲבֹתָם
  choice: 父家
  rationale: 保留以色列社会结构中的固定亲属称谓“父家”，不将其泛化为普通家庭。
- source_word: בְּמִסְפַּר שֵׁמֹת
  choice: 照名字的数目
  rationale: 贴近原文逐名计数的表达，并保持本章反复出现的人口统计公式。
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: 凡二十岁以上
  rationale: 准确表达年龄下限，在现代汉语中简洁自然。
- source_word: כֹּל יֹצֵא צָבָא
  choice: 能出去作战的男子
  rationale: 这是指符合服役资格者的军事用语；“男子”由上下文中的男性人口统计明确，“能出去作战”自然传达该习语的功能。
