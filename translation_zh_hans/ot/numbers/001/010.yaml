  text: 'For the sons of Joseph: for Ephraim, Elishama son of Ammihud; for Manasseh, Gamaliel son of Pedahzur.'
translation:
  language: zh_hans
  text: 约瑟的子孙：以法莲的亚米忽的儿子以利沙玛；玛拿西的比大蓿的儿子迦玛列。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִבְנֵי יוֹסֵף
  choice: 约瑟的子孙中
  rationale: בְנֵי 字面为“儿子们”，此处指由约瑟而出的支系；译作“子孙”符合现代汉语的名单语境，也避免误解为只列约瑟的亲生儿子。介词 ל 在本节承接各支派首领的名单，汉语用“中”自然引出其下两支。
- source_word: לְאֶפְרַיִם
  choice: 以法莲支派
  rationale: 介词 ל 标明约瑟之下的具体支系。原文未明说“支派”，但在普查名单中补出可使现代读者清楚其所指，并保持简洁。
- source_word: אֱלִישָׁמָע
  choice: 以利沙玛
  rationale: 按现代中文圣经人名的通行音译。
- source_word: בֶּן
  choice: ……的儿子
  rationale: 保留希伯来语父子构词关系，并采用自然的现代汉语次序。
- source_word: עַמִּיהוּד
  choice: 亚米忽
  rationale: 按现代中文圣经人名的通行音译。
- source_word: לִמְנַשֶּׁה
  choice: 玛拿西支派
  rationale: 与“以法莲支派”平行，明确这是约瑟子孙中的另一支系。
- source_word: גַּמְלִיאֵל
  choice: 迦玛列
  rationale: 按现代中文圣经人名的通行音译。
- source_word: פְּדָהצוּר
  choice: 比大蓿
  rationale: 按现代中文圣经人名的通行音译。
