  terminology: “约瑟的子孙”、以法莲、玛拿西、以利沙玛、亚米忽、迦玛列、比大蓿均合适，且与通行中文圣经人名译法一致。删去原文未明说而草稿补入的“支派”，以避免不必要的解释性增补；“以法莲”“玛拿西”在本章普查名单语境中已清楚指其支系。
