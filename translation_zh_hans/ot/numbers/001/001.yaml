  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יְדַבֵּ֨ר יְהוָ֧ה אֶל מֹשֶׁ֛ה בְּ/מִדְבַּ֥ר סִינַ֖י בְּ/אֹ֣הֶל מוֹעֵ֑ד בְּ/אֶחָד֩ לַ/חֹ֨דֶשׁ הַ/שֵּׁנִ֜י בַּ/שָּׁנָ֣ה הַ/שֵּׁנִ֗ית לְ/צֵאתָ֛/ם מֵ/אֶ֥רֶץ מִצְרַ֖יִם לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/001.yaml
  text: And Yahweh spoke to Moses in the wilderness of Sinai[a], in the tent of meeting, on the first day of the second month, in the second year after they had come out of the land of Egypt, saying,
translation:
  language: zh_hans
  text: 他们离开埃及地后的第二年，二月初一，雅威在西奈旷野的会幕[a]中对摩西说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译“会见的帐幕”；传统也译作“会幕”。
    reason: 说明该场所名称的字面含义及通行传统译名。
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: 对……说
  rationale: 该叙事动词引出雅威的发言；现代汉语用“对……说”自然地表达其功能，并与句末 לֵאמֹר 共同构成引语导语。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常用音译呈现神的专名，而不以“主”等称号替代。
- source_word: בְּמִדְבַּר סִינַי
  choice: 在西奈旷野
  rationale: “旷野”准确表达 מִדְבָּר 所指的人烟稀少之地，也保留本段的地理背景。
- source_word: בְּאֹהֶל מוֹעֵד
  choice: 在……会见帐幕中
  rationale: אָהֶל 是帐幕，מוֹעֵד 在此表示约定的会见；“会见帐幕”比单用传统术语“会幕”更透明。
- source_word: בְּאֶחָד לַחֹדֶשׁ הַשֵּׁנִי
  choice: 二月初一
  rationale: 这是希伯来日期表达法；“二月初一”是简洁自然的现代汉语说法。
- source_word: בַּשָּׁנָה הַשֵּׁנִית
  choice: 第二年
  rationale: 直接保留原文所标明的年份。
- source_word: לְצֵאתָם מֵאֶרֶץ מִצְרַיִם
  choice: 他们出埃及地后
  rationale: 保留第三人称复数后缀“他们”和原文明确出现的“埃及地”，同时以自然汉语表达时间关系。
- source_word: לֵאמֹר
  choice: 说：
  rationale: 该不定式是引出下文直接话语的固定格式；汉语用冒号即可清楚表明发言内容将接续于下一节。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。译作“雅威”保留其专名性质；不以称号“主”替代，也不采用较传统但与常见学术重构差异较大的“耶和华”。
- issue: לְצֵאתָם 中复数代词所指
  choice: 保留“他们”
  alternative: 明确译作“以色列人”
  rationale: 本节希伯来文仅以第三人称复数后缀回指先前语境，没有在本句明说“以色列人”；保留代词避免把语境推断写入正文。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。时间成分前置，使长句符合汉语信息结构；用冒号自然承接下一节的神谕。
