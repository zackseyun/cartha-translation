  text: וְ/אִתְּ/כֶ֣ם יִהְי֔וּ אִ֥ישׁ אִ֖ישׁ לַ/מַּטֶּ֑ה אִ֛ישׁ רֹ֥אשׁ לְ/בֵית אֲבֹתָ֖י/ו הֽוּא־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/004.yaml
  text: And with you there shall be a man from each tribe[a], each man the head of his fathers’ house.
translation:
  language: zh_hans
  text: 各支派各有一人与你们同在；每人都是自己父家的首领[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “父家”指按父系组织的家庭或家族单位；也可译作“父系家族”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִתְּכֶם
  choice: 与你们同在
  rationale: 该介词短语说明这些支派代表要陪同摩西和亚伦；“与你们同在”既自然，也保留原文关于共同在场的含义。
- source_word: יִהְיוּ
  choice: 要有……同在
  rationale: 未完成式在上下文中带有指令或将来意味，规定人口统计时应有哪些人在场。
- source_word: אִישׁ אִישׁ
  choice: 每个支派要有一人
  rationale: אִישׁ 的重复具有逐一分配的作用，表示各支派各有一名代表；现代汉语以“每个……一人”自然表达。
- source_word: לַמַּטֶּה
  choice: 支派
  rationale: מַטֶּה 在民数记人口统计及组织编制的语境中指以色列的支派，而非字面意义的杖。
- source_word: אִישׁ רֹאשׁ
  choice: 各人都要是……的首领
  rationale: 这一同位结构说明每名代表的身份；“首领”表达 רֹאשׁ 在此处的领导含义，同时保留其居首的意象。
- source_word: לְבֵית אֲבֹתָיו
  choice: 自己父家
  rationale: “父家”指按父系组织的祖传家族或宗族单位；保留这一简洁的希伯来社会结构用语，并以脚注加以说明。
- source_word: הוּא
  choice: 都要是
  rationale: 独立代词带有强调或复指作用；汉语用“都要是”自然承接并突出各代表必须具备的身份。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“每个……一人”传达原文重复 אִישׁ 的逐一分配意义；“父家”保留古代以色列父系家族组织的文化概念，并通过脚注避免现代读者误解为单一核心家庭。
