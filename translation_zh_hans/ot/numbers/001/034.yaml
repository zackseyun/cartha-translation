base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/034.yaml
  text: 'From the sons of Manasseh[a], by their generations, by their clans, by their fathers’ houses, by the number of names, from twenty years old and upward, every man going out for military service:'
translation:
  language: zh_hans
  text: 玛拿西子孙中，按家谱、宗族、父家，逐名计数，凡二十岁及以上、能出征的男子[a]：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“凡出去打仗的男子。”希伯来语这一表达在这里指有资格承担军役的人。
    reason: 保留 יֹצֵא צָבָא 可直译为“出去打仗”的词义，同时说明其在人口统计语境中的军役资格含义。
lexical_decisions:
- source_word: לִבְנֵי מְנַשֶּׁה
  choice: 玛拿西子孙中
  rationale: 前缀 ל־在本章重复的人口统计格式中引出支派项目；译作“……子孙中”既承接上下文省略的句法，也保留 בנים 的宗族血缘含义。
- source_word: תּוֹלְדֹתָם
  choice: 按家谱
  rationale: 此处指按世系或谱系登记；“家谱”比直译“世代”更清楚地表达人口统计中的谱系分类。
- source_word: לְמִשְׁפְּחֹתָם
  choice: 宗族
  rationale: מִשְׁפָּחָה 在支派人口统计中指支派以下的亲族群体；“宗族”既准确，又避免现代“家庭”范围过窄。
- source_word: לְבֵית אֲבֹתָם
  choice: 父家
  rationale: 保留以父系家族为单位的以色列社会结构；“父家”简洁、庄重，并适合作为本章反复出现的固定用语。
- source_word: בְּמִסְפַּר שֵׁמוֹת
  choice: 逐名计数
  rationale: 该短语表示按个人姓名一一登记并计数；此译自然地传达功能，同时保留“名字”所强调的逐人核点。
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: 二十岁以上
  rationale: 这是年龄下限的希伯来语惯用表达；“二十岁以上”是现代汉语简洁准确的说法。
- source_word: כֹּל יֹצֵא צָבָא
  choice: 凡能出去服兵役的男子
  rationale: 该表达在本章语境中指具备从军资格、可参加有组织军事行动的人；“服兵役”清楚表达 צָבָא 的军事含义，而“男子”明确保留这次军事人口统计的男性所指。
theological_decisions:
- issue: 军事人口统计中的性别所指
  choice: 凡能出去服兵役的男子
  alternative: 凡能出去服兵役的人
  rationale: 上下文统计的是二十岁以上、可服军役的以色列男性；明确译出“男子”避免将原文在此语境中的男性所指中性化。
- issue: יֹצֵא צָבָא 的行动与资格含义
  choice: 能出去服兵役
  alternative: 出去打仗
  rationale: 该短语可以描写出去参战，也可在统计语境中指有资格承担军役的人；正文采用较符合人口统计功能的表达，脚注保留更直接的战争用语，避免排除原文的行动色彩。
translation_notes:
  register: 采用现代、庄重而易懂的人口统计用语。“家谱、宗族、父家”形成由谱系到亲族单位的简洁并列；全句保留原文作为统计清单项目的省略结构，并以冒号承接下一节人数。
