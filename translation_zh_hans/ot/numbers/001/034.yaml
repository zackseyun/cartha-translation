revisions:
- from: 玛拿西子孙中，按家谱、宗族、父家，逐名计数，凡二十岁以上、能出去服兵役的男子[a]：
  to: 玛拿西子孙中，按家谱、宗族、父家，逐名计数，凡二十岁及以上、能出征的男子[a]：
  rationale: 修订仅澄清年龄下限包含二十岁，并以较自然、较贴近原文行动意象的“能出征”替换“能出去服兵役”。其余结构与术语均忠实且适合现代标准汉语。
  reviewer_model: gpt-5.6-terra
