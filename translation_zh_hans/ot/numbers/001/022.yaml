base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/022.yaml
  text: 'For the sons of Simeon[a], by their generations, by their clans, by their fathers’ houses, those numbered of them, by the number of names, head by head, every male from twenty years old and upward[c][b], everyone going out to war:'
translation:
  language: zh_hans
  text: 西缅子孙，按世系、宗族和父家；凡二十岁及以上、出去作战[c]的男子，按人名逐一登记[b]，都是被数点[a]的：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “被数点”也可译作“被召集登记”；希伯来语פקד在这里既有人口清点的含义，也可能带有军事召集的意味。
    reason: lexical_alternative
  - marker: b
    text: “逐一”直译为“按各人的头颅”，是指一个一个地清点。
    reason: cultural_note
  - marker: c
    text: “出去作战的”也可理解为“适合服兵役的”；原文更直译为“所有出去参加军队／战争的人”。
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי שִׁמְעוֹן
  choice: 西缅子孙
  rationale: 这里指以西缅为始祖的支派成员；“子孙”既保留血统关系，也比仅指第一代的“儿子”更符合人口统计语境。
- source_word: תּוֹלְדֹתָם
  choice: 按世系
  rationale: 该词在族谱和人口统计语境中指世代相承的谱系；“世系”简洁地保留这一行政兼族谱含义。
- source_word: לְמִשְׁפְּחֹתָם
  choice: 按宗族
  rationale: מִשְׁפָּחָה在以色列支派结构中通常指支派之下的亲族单位，“宗族”比泛称“家庭”更准确。
- source_word: לְבֵית אֲבֹתָם
  choice: 按父家
  rationale: “父家”保留原文以父系家族为组织单位的表达，同时是中文圣经语体中清楚而简练的称呼。
- source_word: פְּקֻדָיו
  choice: 被数点
  rationale: 该词源自פקד，在此指人口统计中被登记、清点的人；“数点”保留其正式的统计含义，并不提前强化军事征召色彩。
- source_word: בְּמִסְפַּר שֵׁמוֹת
  choice: 照人名的数目
  rationale: 保留按姓名核算人数的正式人口统计表达。
- source_word: לְגֻלְגְּלֹתָם
  choice: 逐一登记
  rationale: 原文直译为“按他们的头颅”，是逐人清点的习语；正文采用自然中文表达，具体意象见脚注。
- source_word: כָּל זָכָר
  choice: 凡……男子
  rationale: זָכָר明确指男性；在本节二十岁以上的语境中，“男子”自然且准确。
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: 二十岁以上
  rationale: 这是年龄下限公式，包含年满二十岁的人；现代中文以“二十岁以上”自然表达。
- source_word: כֹּל יֹצֵא צָבָא
  choice: 出去作战的
  rationale: 贴近原文“出去参加军队／战争”的动态说法，不在正文中直接改释为“适合服兵役”。
theological_decisions: []
