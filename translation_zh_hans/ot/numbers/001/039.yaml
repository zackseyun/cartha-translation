  text: Those counted from the tribe of Dan were sixty-two thousand seven hundred.
translation:
  language: zh_hans
  text: 但支派中被登记的人，共有六万二千七百人。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פְּקֻדֵיהֶם
  choice: 被数点的
  rationale: 该词源于פקד，在本段人口普查语境中指被登记、点数的人；译作“被数点的”既保留普查含义，也与《民数记》第一章的重复格式相符。
- source_word: לְמַטֵּה דָן
  choice: 但支派中
  rationale: 介词לְ与מַטֶּה连用，在此标明支派归属；现代汉语用“但支派中”自然表达其成员来自但支派。
- source_word: דָן
  choice: 但
  rationale: 采用该人名及支派名在中文圣经中的通行译名。
- source_word: שְׁנַיִם וְשִׁשִּׁים אֶלֶף
  choice: 六万二千
  rationale: 按现代汉语数字顺序表达希伯来语的“二又六十千”。
- source_word: וּשְׁבַע מֵאוֹת
  choice: 七百
  rationale: 依原文准确译出余下数目，并与前项合为“六万二千七百”。
