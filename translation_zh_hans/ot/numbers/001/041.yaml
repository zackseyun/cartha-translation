- source_word: אָשֵׁר
  choice: 亚设
  rationale: 按现代中文圣经人名的通行音译处理该支派名称。
- source_word: אֶחָד וְאַרְבָּעִים אֶלֶף וַחֲמֵשׁ מֵאוֹת
  choice: 四万一千五百
  rationale: 依现代汉语数字顺序准确表达希伯来文所记总数41,500。
