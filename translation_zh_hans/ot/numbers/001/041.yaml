  choice: 被数点的
  rationale: 该词源自פקד，在本章人口统计语境中指接受登记、点数的人；译作“被数点的”既保留被动含义和统计语境，也不在此节公式本身之外擅自增添身份说明。
- source_word: לְמַטֵּה
