  text: 'And these are the names of the men who shall stand with you: for Reuben[a], Elizur son of Shedeur.'
translation:
  language: zh_hans
  text: 以下是要与你们一同站立的男子的名字：属吕便支派的，是示丢珥的儿子以利蓿。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“代表吕便的是示丢珥的儿子以利蓿。”希伯来语介词既可表示支派归属，也可表示支派代表关系。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה שְׁמוֹת
  choice: 这些人的名字如下
  rationale: 以自然的现代汉语呈现希伯来语名单引介公式；上下文的承接关系由语境体现，不机械译出句首 וְ。
- source_word: הָאֲנָשִׁים
  choice: 这些人
  rationale: 这里指随后列出的男性代表；“这些人”在汉语中自然且不改变所指。
- source_word: יַעַמְדוּ אִתְּכֶם
  choice: 他们要与你们一同站立
  rationale: 保留 עמד 的“站立”意象及复数“你们”，也表达这些代表与摩西、亚伦共同履职的语境。
- source_word: לִרְאוּבֵן
  choice: 吕便支派是
  rationale: 前缀 ל־可表示归属或代表关系；正文按自然汉语理解为支派名单项目，同时用脚注保留“代表吕便”的可能表达。
- source_word: אֱלִיצוּר
  choice: 以利蓿
  rationale: 采用中文圣经传统且通行的人名音译。
- source_word: בֶּן שְׁדֵיאוּר
  choice: 示丢珥的儿子
  rationale: 直接呈现希伯来语父子关系公式，并采用通行音译“示丢珥”。
