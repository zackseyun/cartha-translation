  text: those counted from the tribe of Issachar were fifty-four thousand four hundred[a].
translation:
  language: zh_hans
  text: 以萨迦支派被数点的，共有五万四千四百人[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“他们的数目”或“被登记的”。希伯来语的人口统计用词指被登记、数点的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּקֻדֵיהֶם
  choice: 被数点的，共有
  rationale: 该词源自פקד，在本段人口统计语境中指被登记、点算的人及其总数。译作“被数点的，共有”既保留统计含义，也使中文数字句式自然；句末“人”由人口统计语境明确，不限定额外身份。
- source_word: לְמַטֵּה
  choice: 以萨迦支派
  rationale: 介词לְ与מַטֶּה组成反复出现的人口统计格式，标明支派归属。现代中文用“某支派被数点的”自然表达此关系。
- source_word: יִשָּׂשכָר
  choice: 以萨迦
  rationale: 依现代中文圣经传统音译该专名，清楚且便于读者辨认。
- source_word: אַרְבָּעָה וַחֲמִשִּׁים אֶלֶף וְאַרְבַּע מֵאוֹת
  choice: 五万四千四百
  rationale: 按现代汉语数词顺序准确表达同一数量，避免机械保留希伯来语次序。
