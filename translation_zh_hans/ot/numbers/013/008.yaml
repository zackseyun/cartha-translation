- source_word: לְמַטֵּה
  choice: ……支派的
  rationale: 介词 לְ 与 מַטֶּה 在名单中标明所属支派或所代表的支派。中文采用“以法莲支派的”，既自然简洁，也与上下文名单体例相符。
- source_word: אֶפְרָיִם
  choice: 以法莲
  rationale: 依现代中文圣经传统音译该支派名称。
- source_word: הוֹשֵׁעַ
  choice: 何西阿
  rationale: 该名与先知何西阿的希伯来文名字形式相同；采用现代中文读者熟悉的传统译名，并以脚注说明此人后来称为约书亚。
- source_word: בִּן
  choice: ……的儿子
  rationale: 准确表达希伯来文父子关系，并在名单中保持简洁。
- source_word: נוּן
  choice: 嫩
  rationale: 采用该人名在现代中文圣经中的通行译法。
