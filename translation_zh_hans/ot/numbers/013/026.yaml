base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/026.yaml
  text: They went and came to Moses and Aaron and to all the congregation of the sons of Israel in the wilderness of Paran[a], at Kadesh. They brought back word to them and to all the congregation, and showed them the fruit of the land.
translation:
  language: zh_hans
  text: 他们回来，来到巴兰旷野的加低斯，来到摩西、亚伦和以色列全会众那里。他们向他们和全会众报告，并把那地的果子给他们看。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּלְכוּ וַיָּבֹאוּ
  choice: 他们走完行程，来到
  rationale: 保留两个连续叙事动词所表达的行进与抵达，同时避免汉语中生硬的“他们走了，又来了”。
- source_word: עֲדַת בְּנֵי יִשְׂרָאֵל
  choice: 以色列全会众
  rationale: “会众”准确传达 עֵדָה 的集体含义；“以色列”在现代汉语中自然涵盖“以色列人”，不把此处固定族群称谓误解为仅指男性后裔。
- source_word: מִדְבַּר פָּארָן
  choice: 巴兰旷野
  rationale: “旷野”符合民数记行程叙事中 מִדְבָּר 的常用含义，也比“沙漠”更能涵盖非纯沙地的荒野环境。
- source_word: קָדֵשָׁה
  choice: 加低斯
  rationale: 词尾 הָ 表示朝向该地；结合 וַיָּבֹאוּ 的抵达语义，汉语以“来到……加低斯”自然表达目的地。
- source_word: וַיָּשִׁיבוּ אוֹתָם דָּבָר
  choice: 他们向摩西、亚伦和全会众复命
  rationale: 该表达指侦察者返回后把消息带给差遣者；“复命”简洁自然，并保留正式汇报的语境。
- source_word: וַיַּרְאוּם
  choice: 给众人看
  rationale: 准确表达 ראה 的使役式，即“使他们看见、展示给他们看”。
- source_word: פְּרִי הָאָרֶץ
  choice: 那地的果子
  rationale: 直译“那地的果实/果子”；结合上下文实际展示的葡萄等，“果子”具体而自然，且保留原文意象。
