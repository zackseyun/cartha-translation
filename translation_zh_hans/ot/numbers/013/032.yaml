  text: וַ/יּוֹצִ֜יאוּ דִּבַּ֤ת הָ/אָ֨רֶץ֙ אֲשֶׁ֣ר תָּר֣וּ אֹתָ֔/הּ אֶל בְּנֵ֥י יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר הָ/אָ֡רֶץ אֲשֶׁר֩ עָבַ֨רְנוּ בָ֜/הּ לָ/ת֣וּר אֹתָ֗/הּ אֶ֣רֶץ אֹכֶ֤לֶת יוֹשְׁבֶ֨י/הָ֙ הִ֔וא וְ/כָל הָ/עָ֛ם אֲשֶׁר רָאִ֥ינוּ בְ/תוֹכָ֖/הּ אַנְשֵׁ֥י מִדּֽוֹת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/032.yaml
  text: So they brought out to the sons of Israel a bad report about the land that they had explored, saying, “The land through which we passed to explore it is a land that devours its inhabitants, and all the people whom we saw in it are men of great size.”
translation:
  language: zh_hans
  text: 于是，他们向以色列子民[a]散布关于他们所探察之地的恶信[b]，说：“我们经过并探察的那地，是吞噬其中居民的地[c]；我们在那里看见的所有人，都是身材高大的人[d]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译“以色列的众子”。这是指以色列民的传统群体称谓，并非只指男性。
    reason: cultural_note
  - marker: b
    text: “散布……恶信”也可译作“传出坏消息”；更强烈地说，可译作“毁谤那地”。
    reason: lexical_alternative
  - marker: c
    text: “吞噬”也可译作“消耗”；原文保留了强烈的比喻，没有说明具体指什么。
    reason: lexical_alternative
  - marker: d
    text: 原文直译为“有身量的人”，这里指体格或身材高大。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹצִיאוּ דִּבַּת
  choice: 散布……恶信
  rationale: 该搭配直译为“带出恶信”，语境中指把负面且损害名声的报告传给会众。“散布……恶信”在现代汉语中自然，也保留其贬义；“毁谤”则更明确断定内容虚假，故置于脚注。
- source_word: הָאָרֶץ
  choice: 那地
  rationale: “地”承接本章所探察的应许之地，简洁并保留叙事中的地理及盟约色彩。
- source_word: תָּרוּ / לָתוּר
  choice: 探察
  rationale: תור表示为了解情况而察看、侦察。“探察”兼顾探索与侦察意味，不把行动狭窄化为秘密谍报。
- source_word: אֶל־בְּנֵי יִשְׂרָאֵל
  choice: 向以色列众子
  rationale: 保留希伯来文“以色列的众子”这一标准群体称谓；脚注说明它在此统指以色列民，避免现代读者误以为仅指男性。
- source_word: עָבַרְנוּ בָהּ
  choice: 我们经过
  rationale: 自然表达עבר加ב所表示的穿行、经过该地。
- source_word: אֶרֶץ אֹכֶלֶת יוֹשְׁבֶיהָ
  choice: 吞噬其中居民的地
  rationale: “吞噬”保留אכל的强烈拟人化意象和探子话语中的惊悚修辞，不将这句含义具体化为某一种灾害或社会状况。
- source_word: וְכָל־הָעָם
  choice: 所有人
  rationale: 这里的עָם指他们所见的当地人口；“所有人”比“所有人民”更符合现代汉语，同时保留כָּל的全称表达。
- source_word: אַנְשֵׁי מִדּוֹת
  choice: 身材高大的人
  rationale: 该习语直译为“有尺寸的人”，在上下文中指体格或身量出众。“身材高大”清楚传达身体尺度，避免“有身份的人”之类的误读。
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל的性别形式与群体所指
  choice: 正文译作“以色列众子”，脚注说明统指以色列民
  alternative: 以色列人／以色列民
  rationale: 保留原文明确的男性复数亲属称谓及其盟约性表达，同时说明其在本处作为民族整体的标准名称，并不暗示听众只有男性。
- issue: 探子报告的修辞真实性
  choice: 译作“恶信”，不在正文直接判定为“毁谤”
  alternative: 毁谤那地／散布谣言
  rationale: דִּבָּה具有负面、损害名声的含义，但本节自身并未逐项说明报告中哪些内容虚假；较宽的译法保留叙事张力，不额外强化道德判决。
- issue: “吞噬居民”的具体含义
  choice: 保留原文隐喻
  alternative: 使居民丧命／消耗居民的地
  rationale: 原文可能暗示生存环境严酷、战争频繁或其他致命状况，但没有明确解释；保留“吞噬”避免擅自消除歧义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。正文尽量保存希伯来文的重复结构和强烈隐喻；“以色列众子”略带经文体色彩，因此以脚注帮助普通读者理解其群体含义。
