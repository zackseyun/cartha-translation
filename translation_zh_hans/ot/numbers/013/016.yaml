base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/016.yaml
  text: These are the names of the men whom Moses sent to scout out the land[c][b][a]. And Moses called Hoshea son of Nun Joshua.
translation:
  language: zh_hans
  text: 这些是摩西派去察看[a]那地的人的名字。摩西称嫩的儿子何西阿[b]为约书亚。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“侦察”。这里的希伯来语动词可指探察、勘察或侦察。
    reason: lexical_alternative
  - marker: b
    text: “何西阿”是“约书亚”这个名字较早的形式；本节记载摩西称他为“约书亚”。
    reason: cultural_note
lexical_decisions:
- source_word: אֵלֶּה שְׁמוֹת הָאֲנָשִׁים
  choice: 这些就是……之人的名字
  rationale: 保留指示语和名单总结句式；“人”在上下文中明确指受派的男性代表，现代汉语无需刻意重复性别。
- source_word: שָׁלַח מֹשֶׁה
  choice: 摩西派去
  rationale: “派去”自然表达奉差遣前往执行任务的叙事含义。
- source_word: לָתוּר אֶת־הָאָרֶץ
  choice: 察看那地
  rationale: תור在本章指实地探察、侦察；“察看”既自然，又避免把任务过度限定为秘密刺探。“那地”承接上下文所指的迦南地。
- source_word: וַיִּקְרָא מֹשֶׁה לְהוֹשֵׁעַ ... יְהוֹשֻׁעַ
  choice: 摩西给……何西阿起名叫约书亚
  rationale: קרא在此为给人命名；“起名叫”清楚传达命名行为，同时不额外断定这是何西阿首次获得该名还是正式改名。
- source_word: הוֹשֵׁעַ בִּן־נוּן
  choice: 嫩的儿子何西阿
  rationale: 采用中文圣经传统中通行且易识别的人名音译，并以自然汉语表达父子关系。
- source_word: יְהוֹשֻׁעַ
  choice: 约书亚
  rationale: 采用现代中文读者熟悉的标准圣经人名译法。
theological_decisions:
- issue: 摩西称何西阿为约书亚的行为性质
  choice: 起名叫
  alternative: 改名为
  rationale: 希伯来文直译为“称/叫……约书亚”；“起名叫”保留命名含义，却不把经文未明说的时间与改名程序说得过满。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“这些就是”承接前文名单；“察看”便于普通读者理解，同时以脚注保留“侦察”的词义可能。人名采用简体中文圣经中通行的“摩西、嫩、何西阿、约书亚”。
