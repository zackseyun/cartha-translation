base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/033.yaml
  text: And there we saw the Nephilim—the sons of Anak[a], from the Nephilim—and we seemed in our own eyes like grasshoppers, and so we were in their eyes.
translation:
  language: zh_hans
  text: 在那里，我们看见了尼非林人[a]——亚衲的子孙，出自尼非林人。在我们自己眼中，我们像蚱蜢；在他们眼中，我们也是这样。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “尼非林人”传统上也译作“巨人”。这个希伯来词的确切含义不能确定，因此正文采用音译。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנְּפִילִים
  choice: 尼非林人
  rationale: 该词所指不确定，并带有特定文化背景，故采用音译而不直接解释为“巨人”或“堕落者”；加“人”符合现代汉语表达。
- source_word: בְּנֵי עֲנָק
  choice: 亚衲的子孙
  rationale: בְּנֵי 在此表达族裔或血统关系；“子孙”比字面的“儿子们”更自然，也不改变其宗族含义。
- source_word: מִן הַנְּפִלִים
  choice: 出自尼非林人
  rationale: 介词 מִן 最自然地表示来源或血统；“出自”保留关系上的一定含混，不进一步界定其具体性质。
- source_word: וַנְּהִי בְעֵינֵינוּ
  choice: 我们看自己就像
  rationale: “在我们眼中，我们是”属于感知和自我判断的习语；译为“我们看自己”既自然，又保留主观视角。
- source_word: כַּחֲגָבִים
  choice: 像蚱蜢一样
  rationale: חֲגָבִים 可指蚱蜢一类昆虫；此处比喻体形渺小，“蚱蜢”是现代汉语中清楚而惯常的表达。
- source_word: וְכֵן הָיִינוּ בְּעֵינֵיהֶם
  choice: 在他们眼中，我们也是如此
  rationale: 保留与前句“我们看自己”相对应的视角结构，同时自然传达 וְכֵן 的“同样如此”之意。
theological_decisions:
- issue: נְפִילִים 的译法
  choice: 尼非林人
  alternative: 巨人；堕落者
  rationale: 该词也见于《创世记》6:4，其词义和所指历来有争议。正文采用音译，以免把传统解释或特定词源推断写入经文；脚注提供传统译法“巨人”。
- issue: 亚衲子孙与尼非林人的关系
  choice: 亚衲的子孙，出自尼非林人
  alternative: 亚衲的子孙，是尼非林人；亚衲的子孙，属于尼非林人
  rationale: 原文 מִן 可表达来源、血统或群体关系。采用“出自”保存这种关系的开放性，不把它明确限定为身份等同或群体归属。
translation_notes:
  register: 采用现代、庄重而通顺的普通话。“尼非林人”保留原词的不确定性；破折号呈现原文同位说明的突兀感，分号则突出“在自己眼中”与“在他们眼中”的修辞对称。
