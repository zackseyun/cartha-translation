base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/029.yaml
  text: Amalek lives in the land of the Negev[a], and the Hittites, the Jebusites, and the Amorites live in the hill country[c][b], and the Canaanites live by the sea and along the Jordan.
translation:
  language: zh_hans
  text: 亚玛力人住在南地[a]；赫人、耶布斯人和亚摩利人住在山区；迦南人住在海边和约旦河沿岸[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “南地”也可译作“南方地区”；这里很可能特指迦南南部称为“南地”的区域。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“在约旦河的旁边”。
    reason: idiom_clarification
lexical_decisions:
- source_word: עֲמָלֵק
  choice: 亚玛力人
  rationale: 此处以族群为主语；采用现代中文圣经语境中通行的音译，并加“人”明确族群所指。
- source_word: יוֹשֵׁב / יֹשֵׁב
  choice: 住在
  rationale: 希伯来语分词在这里表示持续、定居性的居住；“住在”自然清楚，也适合三个地域分句。
- source_word: בְּאֶרֶץ הַנֶּגֶב
  choice: 在南地
  rationale: נֶגֶב在此主要指迦南南部的特定干旱地区；“南地”既保留地域名称性质，也符合简体中文圣经地理用语。中文不必机械译出אֶרֶץ为“土地”。
- source_word: הַחִתִּי / הַיְבוּסִי / הָאֱמֹרִי / הַכְּנַעֲנִי
  choice: 赫人／耶布斯人／亚摩利人／迦南人
  rationale: 原文虽使用单数形式的族名，却具有集合意义；现代汉语用带“人”的族称自然表达各族群。
- source_word: בָּהָר
  choice: 在山区
  rationale: הָר在地域描述中可指山地或丘陵地区；“山区”简洁自然，不把它缩窄为某一座山。
- source_word: עַל הַיָּם
  choice: 在海边
  rationale: 直译意义为“在海旁”；“海边”保留原文空间关系，避免将其进一步解释成特定的“沿海平原”。
- source_word: עַל יַד הַיַּרְדֵּן
  choice: 在约旦河沿岸
  rationale: “在……的手边”是表示邻近、旁侧的希伯来语习语；“沿岸”自然表达在约旦河旁一带居住的意思。
theological_decisions: []
