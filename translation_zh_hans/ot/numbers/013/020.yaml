base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/020.yaml
  text: And whether the land is fertile or lean[a], whether there are trees in it or not. And be strong[b], and take some of the fruit of the land.” Now the days were the days of the first-ripe grapes.
translation:
  language: zh_hans
  text: 那地怎样，是肥沃还是贫瘠；那里有没有树木[a]。你们要刚强，从那地的果子中取一些来。”那时正是葡萄初熟的时候。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “树木”也可译作“木材”；原文这个词兼有两种含义。
    reason: lexical_alternative
  - marker: b
    text: 原文直译：“那些日子是葡萄初熟的日子”，即葡萄收获季节开始之时。
    reason: cultural_note
lexical_decisions:
- source_word: הַשְּׁמֵנָה הִוא אִם רָזָה
  choice: 是肥沃还是贫瘠
  rationale: 两个形容词本义分别为“肥厚”和“瘦薄”，用于土地时自然表达为肥沃与贫瘠，保留鲜明对比。
- source_word: הֲיֵשׁ בָּהּ עֵץ אִם אַיִן
  choice: 那里有没有树木
  rationale: עֵץ既可指树木，也可指木材；正文采用勘察土地特征时最直接的“树木”，并以脚注保留“木材”的可能。
- source_word: וְהִתְחַזַּקְתֶּם
  choice: 你们要刚强
  rationale: 该词在此是复数劝勉语，直指执行任务时应振作、坚强；“要刚强”简洁庄重，也不把语义限缩为内心勇气。
- source_word: וּלְקַחְתֶּם מִפְּרִי הָאָרֶץ
  choice: 从那地的果子中取一些来
  rationale: מִן表达从整体中取一部分；“取一些”准确体现这一点。“果子”贴近פְּרִי，也与下文葡萄相呼应。
- source_word: בִּכּוּרֵי עֲנָבִים
  choice: 葡萄初熟的时候
  rationale: 此处说明侦察发生的时令，意为葡萄开始成熟之际；采用自然汉语表达，避免无根据地赋予礼仪性“初熟之物”的含义。
- source_word: וְהַיָּמִים יְמֵי
  choice: 那时正是……的时候
  rationale: 将希伯来语重复式的时间说明转换为自然、清楚的现代汉语，同时保留叙事中的时令提示。
