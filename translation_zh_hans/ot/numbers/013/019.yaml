  text: וּ/מָ֣ה הָ/אָ֗רֶץ אֲשֶׁר הוּא֙ יֹשֵׁ֣ב בָּ֔/הּ הֲ/טוֹבָ֥ה הִ֖וא אִם רָעָ֑ה וּ/מָ֣ה הֶֽ/עָרִ֗ים אֲשֶׁר הוּא֙ יוֹשֵׁ֣ב בָּ/הֵ֔נָּה הַ/בְּ/מַֽחֲנִ֖ים אִ֥ם בְּ/מִבְצָרִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/019.yaml
  text: And what is the land like in which he lives? Is it good or bad? And what are the cities like in which he lives? Are they in camps or in fortifications?[a]
translation:
  language: zh_hans
  text: 他们所住的那地怎么样？是好是坏？他们所住的城镇又怎么样？是营寨式的，还是有防御工事的？[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “营寨式的”或译“在营寨中”；“有防御工事的”或译“在堡垒中”。希伯来文在此把营寨般的开放聚落与筑有防御工事的地方相对照。
    reason: 说明两个地点名词可指聚落类型或居民所处的地方，并保留较字面的词汇替代译法。
lexical_decisions:
- source_word: וּמָה הָאָרֶץ
  choice: 那地……究竟怎么样
  rationale: וּמָה在这里询问土地的状况或性质；用“究竟怎么样”既自然，也不把含义缩窄为肥沃程度。
- source_word: אֲשֶׁר הוּא יֹשֵׁב בָּהּ
  choice: 就是他们所住的地方
  rationale: 希伯来文用阳性单数代词，以集合性方式指当地居民。现代汉语用复数“他们”可清楚自然地表达这一集合意义，而不造成只指某一个人的误解。
- source_word: הֲטוֹבָה הִוא אִם רָעָה
  choice: 是好是坏
  rationale: 保留טוֹבָה与רָעָה宽泛的评价含义，不擅自限定为“肥沃或贫瘠”。
- source_word: הֶעָרִים
  choice: 城镇
  rationale: עָרִים可指有居民聚居的城市或城镇；此处“城镇”适合普通现代汉语，也与后面的设防状况相配。
- source_word: הַבְּמַחֲנִים
  choice: 营地式的
  rationale: מַחֲנִים本义为营地、营寨。这里与设防之地对举，描述城镇是开放、营地式的聚落；加“式的”使汉语问句自然，并避免误解为居民临时住在军营中。
- source_word: בְּמִבְצָרִים
  choice: 设防的
  rationale: מִבְצָרִים指筑有防御工事的地方或要塞。“设防的”直接呈现与营地式聚落的对比，同时符合对城镇状况的询问。
