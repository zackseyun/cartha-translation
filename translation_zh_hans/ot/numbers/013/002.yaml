revisions:
- from: “你要为自己派出一些男子，让他们去察看[a]迦南地，就是我正赐给以色列子孙[b]的那地。你们要从各父系支派中各派一人，个个都要是他们中间的首领[c]。”
  to: “你要为自己派出一些男子，让他们去察看[a]迦南地，就是我正赐给以色列子孙[b]的那地。你们要按各人的父系支派，每支派派一人；全都是他们中间的首领[c]。”
  rationale: 修订仅澄清逐支派选派一人的中文句法，并保留原文由“你要”（单数）转为“你们要”（复数）的变化。“按各人的父系支派”对应“其父辈的支派”，不把父系关系泛化为支派的固定名称。其余译法及脚注锚点均可保留。
