language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: שְׁלַח לְ/ךָ֣ אֲנָשִׁ֗ים וְ/יָתֻ֨רוּ֙ אֶת אֶ֣רֶץ כְּנַ֔עַן אֲשֶׁר אֲנִ֥י נֹתֵ֖ן לִ/בְנֵ֣י יִשְׂרָאֵ֑ל אִ֣ישׁ אֶחָד֩ אִ֨ישׁ אֶחָ֜ד לְ/מַטֵּ֤ה אֲבֹתָי/ו֙ תִּשְׁלָ֔חוּ כֹּ֖ל נָשִׂ֥יא בָ/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/002.yaml
  text: Send for yourself men[a], and let them scout out the land of Canaan, which I am giving to the sons of Israel. You shall send one man from each tribe of his fathers[c][b], every one a leader among them.
translation:
  language: zh_hans
  text: “你要为自己派出一些男子，让他们去察看[a]迦南地，就是我正赐给以色列子孙[b]的那地。你们要按各人的父系支派，每支派派一人；全都是他们中间的首领[c]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“探查”或“侦察”。
    reason: lexical_alternative
  - marker: b
    text: “以色列子孙”是希伯来文对以色列全体百姓的惯常群体称谓，并非只指男性。
    reason: cultural_note
  - marker: c
    text: “首领”或译“首长”；原词可指支派的首领或领袖。
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁלַח לְךָ
  choice: 你要为自己派出
  rationale: 保留命令式“派出”和希伯来文中明确出现的 לְךָ（“为自己”），不擅自判定它仅是习语、许可语气或强调语气。
- source_word: אֲנָשִׁים
  choice: 一些男子
  rationale: 此处指从各支派选出的男性代表；“男子”准确保留原文阳性复数的所指。
- source_word: וְיָתֻרוּ
  choice: 让他们去察看
  rationale: תור 在此指为了解当地情况而巡视、探查；“察看”自然易懂，又不把其含义限缩为带有隐秘敌情活动色彩的“侦察”。
- source_word: אֶרֶץ כְּנַעַן
  choice: 迦南地
  rationale: 明确表达 אֶרֶץ“地、土地”，并采用现代中文通行的地名形式。
- source_word: אֲשֶׁר אֲנִי נֹתֵן
  choice: 就是我正赐给……的那地
  rationale: “正赐给”体现分词 נֹתֵן 所表达的正在进行或已启动的赐予，而不改成单纯将来或完成时。
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: 给以色列子孙
  rationale: 保留“以色列的儿子／子孙”这一亲属与圣约群体称谓，不将其扁平化为单纯族名；中文“子孙”在此可自然指整个群体。
- source_word: אִישׁ אֶחָד אִישׁ אֶחָד
  choice: 各派一人
  rationale: 以中文分配结构“各……一人”传达原文重复所形成的逐一、每支派一人的强调，避免生硬重复。
- source_word: לְמַטֵּה אֲבֹתָיו
  choice: 从各父系支派中
  rationale: מַטֶּה 在此是“支派”；“父系”保留 אֲבֹתָיו 所指的祖先／父系归属，也符合以支派血统辨识代表的语境。
- source_word: תִּשְׁלָחוּ
  choice: 你们要……派
  rationale: 保留原文从单数命令“你要”转为复数动词“你们要”的人称数变化，不在译文中默默统一。
- source_word: כֹּל נָשִׂיא בָהֶם
  choice: 个个都要是他们中间的首领
  rationale: נָשִׂיא 可指首领、领袖或族长；“首领”简洁庄重。“他们中间”保留 בָהֶם 的群体内关系，不额外限定其确切先行词。
theological_decisions:
- issue: 神命令中的 לְךָ 有何语气作用
  choice: 正文译作“为自己”
  alternative: 省略不译，或译作“由你”“为你自己”
  rationale: 原文明确有该代词成分。直译保留它可能表达的个人参与、授权或强调等张力，而不替读者选定某一种解释。
- issue: בני ישראל 的群体称谓
  choice: 译作“以色列子孙”
  alternative: 译作“以色列人”或“以色列的儿女”
  rationale: “以色列子孙”既保留原文亲属性、群体性的表达，也不意味着只包括男性；脚注说明其实际指向整个以色列群体。
- issue: 命令对象由单数转为复数
  choice: 分别译作“你要”和“你们要”
  alternative: 全节统一译作单数“你要”以使中文更顺
  rationale: 原文 שְׁלַח 是阳性单数命令式，而 תִּשְׁלָחוּ 是阳性复数形式。译文保留这一变化，不预先解释后一句究竟把哪些人纳入执行者。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。正文保留“为自己”、神正在“赐给”土地、亲属性群体称谓以及单复数命令的转换；用“各派一人”自然表达希伯来文的分配性重复。所有脚注标记均已在正文对应位置出现。
