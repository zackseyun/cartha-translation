  terminology: “迦南地”“以色列子孙”“首领”均适切。“父系支派”宜改为“各人的父系支派”，使“父亲／祖先”的归属关系对应希伯来文复数后缀，且符合现代中文表达。脚注c中“首领或领袖”近义重复，改列“首长”作为较有区分的替代词。
