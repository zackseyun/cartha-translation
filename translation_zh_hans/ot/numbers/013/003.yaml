  text: וַ/יִּשְׁלַ֨ח אֹתָ֥/ם מֹשֶׁ֛ה מִ/מִּדְבַּ֥ר פָּארָ֖ן עַל פִּ֣י יְהוָ֑ה כֻּלָּ֣/ם אֲנָשִׁ֔ים רָאשֵׁ֥י בְנֵֽי יִשְׂרָאֵ֖ל הֵֽמָּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/003.yaml
  text: So Moses sent them from the wilderness of Paran at the command of Yahweh[a]. All of them were men[b], heads of the sons of Israel.
translation:
  language: zh_hans
  text: 于是，摩西照雅威的吩咐[a]，从巴兰旷野差遣他们。他们全都是男子，是以色列子孙的首领[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“照雅威的话”。希伯来语习语字面为“按雅威的口”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来语为“以色列子孙的首领”；也可译作“以色列人的首领”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: 差遣
  rationale: 该叙事动词表示摩西奉命派出这些人；“差遣”自然、庄重，也保留受命执行任务的语气。
- source_word: מִמִּדְבַּר פָּארָן
  choice: 从巴兰旷野
  rationale: מִדְבָּר指未开垦的荒野地区；“旷野”符合现代中文圣经地理语体，巴兰按专名音译。
- source_word: עַל פִּי יְהוָה
  choice: 照雅威的吩咐
  rationale: 该习语字面为“在雅威口上”，实际表示依照其命令；“照……的吩咐”准确传达神授权的含义，同时脚注保留字面意象。
- source_word: יְהוָה
  choice: 雅威
  rationale: 直接音译四字神名，区别于“主”这一称号，并在简体中文中采用通行形式。
- source_word: כֻּלָּם אֲנָשִׁים
  choice: 他们全都是……首领
  rationale: כֻּלָּם强调全体；אֲנָשִׁים在此与后面的身份说明连用，指所差遣的男性代表。中文以“他们全都是”保留总体强调，不另加可能显得累赘的“男人”。
- source_word: רָאשֵׁי בְנֵי יִשְׂרָאֵל
  choice: 以色列人的首领
  rationale: רָאשֵׁי表示各群体的首领；בְנֵי יִשְׂרָאֵל字面为“以色列之子”，现代中文在民族整体语境中自然表达为“以色列人”。
- source_word: הֵמָּה
  choice: 都是
  rationale: 独立代词带有强调作用，与כֻּלָּם结合译为“他们全都是”，在中文中充分体现强调而不生硬重复。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文使用神的专名而非称号；“雅威”较直接地转写该名，不以“主”替代。
- issue: אֲנָשִׁים与בְנֵי יִשְׂרָאֵל中的性别和群体表达
  choice: 他们全都是以色列人的首领
  alternative: 他们全是男子，是以色列众子的首领
  rationale: 上下文中的受派者确为男性部族代表，但中文“他们”及随后列出的男性姓名已经明确指称，不必以不自然的“男子”重复说明。בְנֵי יִשְׂרָאֵל在这里是全民族称谓，译作“以色列人”自然且不改变所指；字面形式在脚注中保留。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“于是”承接前文命令；“差遣他们出去”比单说“差他们”更符合现代汉语。主文使用自然的“以色列人的首领”，脚注则保留希伯来语的家族性表达。
