base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/017.yaml
  text: Moses sent them to scout out the land of Canaan[a], and he said to them, “Go up this way into the Negev[c][b], and go up into the hill country.”
translation:
  language: zh_hans
  text: 摩西派他们去察看迦南地[a]，对他们说：“你们要从这边上去，进入南地[b]，再上到山地[c]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “察看”也可译作“侦察”。
    reason: lexical_alternative
  - marker: b
    text: “南地”指迦南南部的干旱地区，希伯来语称“尼革夫”。
    reason: cultural_note
  - marker: c
    text: “山地”也可译作“山区”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: 派
  rationale: שׁלח在叙事中表示差遣；“派”简洁自然，也符合摩西交付任务的语境。
- source_word: לָתוּר
  choice: 去察看
  rationale: תור在本章指为了解土地而进行勘察。“察看”保留调查、探察之意，又不把现代汉语“侦察”可能带有的军事或秘密活动色彩强加于原文。
- source_word: אֶרֶץ כְּנָעַן
  choice: 迦南地
  rationale: 准确保留地名与“地”的完整表达，是现代中文圣经语体中自然且易懂的说法。
- source_word: עֲלוּ זֶה
  choice: 从这里上到
  rationale: עלה表示“上去”，זֶה在此很可能作副词性指示语。“从这里上到”自然表达所指路线，同时保留地势上行的方向感。
- source_word: בַּנֶּגֶב
  choice: 南地
  rationale: נֶגֶב既可表示南方，也可作为迦南南部干旱地区的地理名称；“南地”保留这一专名性质，并以脚注补充地理背景。
- source_word: וַעֲלִיתֶם
  choice: 再上到
  rationale: 带ו的完成式在前一命令之后延续指令。“再”自然呈现行动次序。
- source_word: הָהָר
  choice: 山地
  rationale: הָהָר在此泛指高地区域，而不是一座特定的山；“山地”比单数“那座山”更符合语境。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而通顺的普通话。“派他们去察看”清楚交代任务；引语中的“从这里……再……”体现路线与先后次序。地名“南地”配以脚注，兼顾正文可读性和原文地理含义。
