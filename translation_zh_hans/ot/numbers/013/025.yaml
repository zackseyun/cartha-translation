base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/025.yaml
  text: They returned from scouting out the land at the end of forty days[a].
translation:
  language: zh_hans
  text: 四十天期满后，他们从对那地的侦察[a]中回来了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “侦察”也可译作“察看”或“窥探”。希伯来语动词指在勘察任务中察看那地。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֻׁבוּ
  choice: 他们……回来了
  rationale: 这是שׁוב的Qal连续式第三人称阳性复数，叙述下一件事。汉语用“回来了”自然表达返回，连接成分可由叙事语流体现。
- source_word: מִתּוּר
  choice: 侦察完
  rationale: תור的不定式与מִן连用，表示完成对那地的察看后返回；“侦察”既体现此次任务的勘察性质，又避免“窥探”可能带有的过强贬义。
- source_word: הָאָרֶץ
  choice: 那地
  rationale: 此处指前文所说、他们受命察看的特定地域；“那地”比泛指的“土地”更合上下文。
- source_word: מִקֵּץ
  choice: ……结束时
  rationale: מִן与קֵץ构成的表达指一段时期达到终点；译作“结束时”准确而自然。
- source_word: אַרְבָּעִים יוֹם
  choice: 四十天
  rationale: 希伯来语以数词加单数名词构成时间量词；现代汉语自然译为“四十天”。
