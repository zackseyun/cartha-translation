  yaml_path: translation/ot/numbers/013/001.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: zh_hans
  text: 耶和华[a]对摩西说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文为“YHWH”（四字神名）；也可音译为“雅威”。
    reason: 说明神名的原文形式及另一常见音译。
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: 说
  rationale: 这是叙事中的连续式动词，表示一次言说事件。汉语“说”自然地引出下文，也可与句末的 לֵאמֹר 合并表达，避免生硬重复。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的专名“耶和华”译出四字神名，而不以“主”这一称号替代。
- source_word: אֶל
  choice: 对
  rationale: 在言说结构中标明说话的对象；现代汉语“对摩西说”最为自然。
- source_word: מֹשֶׁה
  choice: 摩西
  rationale: 采用该人名通行的现代中文译名。
- source_word: לֵאמֹר
  choice: 说
  rationale: 该不定式属于希伯来语常见的引语导入公式。汉语无需逐字译成“说着说”，而以“对摩西说”整体传达其功能，并用冒号引出直接引语。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威；上主
  rationale: 原文直接使用四字神名。正文保留中文传统中广为人知的专名“耶和华”，不以称号“上主”替代；脚注说明其希伯来文形式及另一常见音译，以避免把发音问题说成确定无疑。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。将希伯来语“说话……说”的公式合并为“对摩西说”，并以冒号承接下一节内容；脚注标记置于冒号之前。
