base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/028.yaml
  text: However[a], the people who dwell in the land are strong, and the cities are fortified and very large; and we also saw the descendants of Anak there.
translation:
  language: zh_hans
  text: 然而，那地的居民强大，城邑坚固而且非常大；我们还在那里看见了亚衲的后代[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“亚衲的子孙”。希伯来语原文指亚衲的后裔。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶפֶס כִּי
  choice: 然而
  rationale: 这一组合承接上一节对土地的正面描述，并引出强烈的转折和限制；“然而”自然、庄重，也保留其逆转语气。
- source_word: עַז
  choice: 很强大
  rationale: 这里形容当地居民力量强、难以对付；“很强大”保留其威势，又不像“凶猛”那样额外强调敌意。
- source_word: הָעָם הַיֹּשֵׁב בָּאָרֶץ
  choice: 住在那地的民
  rationale: 按希伯来语的集合名词和分词结构译出，表达全体当地居民，同时保持叙事语体简洁。
- source_word: הֶעָרִים בְּצֻרוֹת
  choice: 城邑坚固
  rationale: בְּצֻרוֹת 指城邑设有防御工事、难以攻取；“坚固”在中文圣经叙事中自然，也不局限于仅有城墙。
- source_word: גְּדֹלֹת מְאֹד
  choice: 非常大
  rationale: 直接保留 מְאֹד 的强化作用，并将 גְּדֹלֹת 在本处理解为城邑规模很大。
- source_word: וְגַם
  choice: 还
  rationale: 表示在前述不利情况之外又增加一项令人忧虑的观察，现代中文用“还”简明自然。
- source_word: יְלִדֵי הָעֲנָק
  choice: 亚衲的后代
  rationale: 该组合表示出自亚衲的血统或族裔；“后代”比直译“儿女”更清楚地传达谱系含义。
- source_word: רָאִינוּ שָׁם
  choice: 我们还在那里看见了
  rationale: 保留第一人称复数亲历报告以及地点副词“在那里”，并以完成体“看见了”自然表达已经发生的观察。
theological_decisions: []
