base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/023.yaml
  text: They came to the Valley of Eshcol[a], and from there they cut down a branch with a single cluster of grapes, and two of them carried it on a pole[b]; they also took some of the pomegranates and some of the figs.
translation:
  language: zh_hans
  text: 他们来到以实各谷[a]，从那里砍下一根葡萄枝，枝上有一串葡萄；两个人用杠子抬着它[b]。他们又带走了一些石榴和无花果。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“以实各溪谷”或“以实各河谷”。希伯来语נַחַל既可指谷地或峡谷，也可指季节性水道。
    reason: lexical_alternative
  - marker: b
    text: 或译“两个人把它架在杠子上抬着”。
    reason: lexical_alternative
lexical_decisions:
- source_word: נַחַל אֶשְׁכֹּל
  choice: 以实各谷
  rationale: נַחַל可指谷地、峡谷或季节性水道；此处作为地名的一部分，译作“谷”自然易懂，同时在脚注保留其他地貌可能。אֶשְׁכֹּל按传统中文圣经地名音译为“以实各”。
- source_word: זְמוֹרָה
  choice: 一根葡萄枝
  rationale: 该词特指葡萄树的枝条；中文明说“葡萄枝”自然，也避免仅译“枝子”可能产生的歧义。
- source_word: אֶשְׁכּוֹל עֲנָבִים אֶחָד
  choice: 一整串葡萄
  rationale: אֶחָד强调一串；“一整串”在现代汉语中既保留单数整体的重点，又自然呈现所砍枝条上连着的一串葡萄。
- source_word: וַיִּשָּׂאֻהוּ
  choice: 抬着它
  rationale: 单数后缀回指前述葡萄枝及其葡萄串这一整体；结合两人和杠子的场景，“抬着”比泛称“带着”更准确。
- source_word: בַמּוֹט
  choice: 用一根杠子
  rationale: מוֹט指抬运物品的杆或杠；“杠子”清楚呈现两人共同负载的运输方式。
- source_word: בִּשְׁנָיִם
  choice: 两个人
  rationale: 原文简略为“由两个”；上下文所指是探子中的两人，中文需补出量词和人的含义，但不额外限定其身份。
- source_word: וּמִן הָרִמֹּנִים וּמִן הַתְּאֵנִים
  choice: 他们又带走了一些石榴和无花果
  rationale: 原文承接前面的动作，列出从当地取得的其他果物；中文补出隐含谓语“带走”，使叙事完整流畅。
