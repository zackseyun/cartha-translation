base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/022.yaml
  text: They went up into the Negev, and he came as far as Hebron. Ahiman, Sheshai, and Talmai, the descendants of Anak, were there. Hebron had been built seven years before Zoan of Egypt.
translation:
  language: zh_hans
  text: 他们上到南地，他来到希伯仑。亚衲的后裔亚希幔、示筛和挞买在那里。希伯仑比埃及的琐安早建成七年。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַנֶּגֶב
  choice: 南地
  rationale: 此处是专名化的地域名称，指迦南南部干旱地区；采用中文圣经地理用语“南地”，而不只译作泛指的“南方”。
- source_word: יְלִידֵי הָעֲנָק
  choice: 亚衲的后裔
  rationale: יְלִידֵי 可指所生者或后裔；结合人物群体关系，译为自然且不过度具体化的“后裔”。
- source_word: נִבְנְתָה לִפְנֵי
  choice: 比……早建造
  rationale: לִפְנֵי 在时间比较中表示“早于”；此译清楚保留希伯仑与琐安建城年代相差七年的陈述。
- source_word: צֹעַן מִצְרָיִם
  choice: 埃及的琐安
  rationale: 保留地名“琐安”，并按原文以“埃及的”说明其所在地区。
theological_decisions:
- issue: 复数主语后接单数动词的指称转换
  choice: “他们上到……，他来到……”
  alternative: “他们上到……，来到……”
  rationale: 原文先用复数 וַיַּעֲלוּ，随后明确转为单数 וַיָּבֹא。译文保留这一不寻常的数变化，不擅自统一主语，也不判定“他”具体指谁。
translation_notes:
  register: 采用现代、庄重而易懂的叙事体。人名与地名沿用简体中文圣经中较为通行的音译；句法尽量自然，同时保留原文从“他们”转为“他”的真实歧义。
