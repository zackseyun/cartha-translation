base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/021.yaml
  text: So they went up and spied out the land from the wilderness of Zin as far as Rehob[a], at Lebo-hamath.
translation:
  language: zh_hans
  text: 他们上去窥探那地，从寻的旷野直到利合，就是在哈马口一带[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “哈马口”也可按地名译作“利波·哈马”。希伯来语此处可理解为描述性说法，即“通往哈马的入口”，也可理解为地名。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעֲלוּ
  choice: 他们上去
  rationale: 保留עלה所表达的向上行进之意；“上去”符合现代汉语叙事表达。
- source_word: וַיָּתֻרוּ
  choice: 窥探
  rationale: 本段讲受派之人侦察迦南地；“窥探”既体现侦察任务，也比泛指游历的“考察”更贴合语境。
- source_word: הָאָרֶץ
  choice: 那地
  rationale: 上下文所指为他们奉命侦察的迦南地；“那地”自然承接前文，又不在本节中增添原文未明说的地名。
- source_word: מִמִּדְבַּר צִן
  choice: 从寻的旷野
  rationale: מִדְבָּר指荒野地带，译作“旷野”符合五经地理语境；צִן按传统中文地名译作“寻”。
- source_word: עַד רְחֹב
  choice: 直到……利合
  rationale: עַד表示范围的终点，译作“直到”；רְחֹב作为地名音译为“利合”。
- source_word: לְבֹא חֲמָת
  choice: 利波·哈马
  rationale: 正文按复合地名理解并音译，以保留其可能的专名性质；描述性读法“哈马口”列入脚注。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。将地理范围重排为“从……直到……的利合”，使利合与利波·哈马之间的定位关系在中文中清楚，同时保留原文对לְבֹא חֲמָת究竟是专名还是描述语的歧义。
