base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/024.yaml
  text: That place was called the Valley of Eshcol because of the cluster that the sons of Israel cut from there[a][b][c].
translation:
  language: zh_hans
  text: 那地方叫作以实各谷[a]，因为以色列人从那里割下了那一挂葡萄[b][c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “谷”所译的希伯来词也可指季节性河道、干河床或溪谷，因此也可译作“以实各溪谷”。
    reason: lexical_alternative
  - marker: b
    text: “以实各”就是希伯来语“果串”或“一挂”的词；这地因以色列人在那里割下的那一挂而得名。原文只说“那一挂”，根据上文可知是葡萄。
    reason: cultural_note
  - marker: c
    text: “以色列人”原文直译为“以色列的众子”；也可译作“以色列子民”。
    reason: lexical_alternative
lexical_decisions:
- source_word: לַמָּקוֹם הַהוּא
  choice: 那地方
  rationale: 保留定指和回指作用，用现代汉语自然表达前文所说的地点。
- source_word: קָרָא
  choice: 叫作
  rationale: 希伯来语虽为第三人称阳性单数主动形式，但主语未明，在命名句中具有泛指效果；汉语“叫作”自然保留这种不明说命名者的表达。
- source_word: נַחַל
  choice: 谷
  rationale: נַחַל可指季节性河道、溪谷或与之相连的山谷；“谷”适合地名，且不把地貌过度限定为常年有水的溪流。
- source_word: אֶשְׁכּוֹל
  choice: 以实各
  rationale: 此处用作地名，采用音译；其与意为“一挂／一串”的普通名词同形所形成的命名关联在脚注说明。
- source_word: עַל אֹדוֹת
  choice: 因为
  rationale: 该短语说明命名缘由，“因为”准确、清楚地表达因果关系。
- source_word: הָאֶשְׁכּוֹל
  choice: 那一挂葡萄
  rationale: 原文名词意为“一挂／一串”，前一节明确所指为葡萄；正文补出“葡萄”使现代汉语指代清楚，同时以脚注注明原文只说“那一挂”。
- source_word: אֲשֶׁר כָּרְתוּ
  choice: 砍下了
  rationale: כרת有“砍、割断”之意；用于从枝上取下葡萄时，“砍下”既保留动作力度，也符合前文用杠抬走的巨大果挂。
- source_word: מִשָּׁם
  choice: 从那里
  rationale: 直接保留原文的地点指示。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 这是希伯来语常用的民族称谓；在现代汉语中“以色列人”自然准确，不会误解为仅指以色列的亲生儿子。
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל的表达
  choice: 以色列人
  alternative: 以色列的子孙／以色列的众子
  rationale: 原文直译为“以色列的众子”，但在此是指参与探察的以色列人。正文采用现代汉语通行族称，脚注保留其家族性原文形式；不涉及需要偏向某一教派的解释。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“以实各谷”保留传统、易辨识的地名形式；正文以“以色列人”避免现代读者把希伯来习语误解为狭义亲子关系。所有脚注标记均置于正文相关词句之后。
