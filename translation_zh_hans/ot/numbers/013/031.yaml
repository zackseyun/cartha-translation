  yaml_path: translation/ot/numbers/013/031.yaml
  text: But the men who had gone up with him said[a], “We are not able to go up against the people[b], because they are stronger than we are.”
translation:
  language: zh_hans
  text: 那些与他一同上去的人却说：“我们不能上去攻击那民[a]，因为他们比我们强大[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“上去到那民那里”；在这里的军事语境中，意思是“上去攻击那民”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文采用单数形式，直译为“那民……他比我们强大”；这里按集合名词的含义译作“他们比我们强大”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָאֲנָשִׁים
  choice: 但那些……的人
  rationale: וְ 在语境中承接并转出与迦勒意见相反的话；“但”自然体现对比，“那些……的人”则保留定冠词和复数所指。
- source_word: אֲשֶׁר עָלוּ עִמּוֹ
  choice: 和他一同上去
  rationale: 保留 עלה“上去”的空间表达，并以自然汉语关系结构说明这些人曾与迦勒同行。
- source_word: אָמְרוּ
  choice: 说
  rationale: 以简单叙事动词对应希伯来语完成式在叙事中的用法。
- source_word: לֹא נוּכַל
  choice: 我们不能
  rationale: 准确表达 יכל 所指的能力或可行性；现代汉语中“不能”比“没有能力”更自然。
- source_word: לַעֲלוֹת אֶל הָעָם
  choice: 上去攻打那族人
  rationale: 保留 לַעֲלוֹת“上去”，同时按军事语境将 אֶל 的趋向关系译明为“攻打”；הָעָם 指前文所说当地居民，译为“那族人”可避免泛指一般民众。
- source_word: כִּי
  choice: 因为
  rationale: 清楚表达其引出理由的功能。
- source_word: חָזָק הוּא מִמֶּנּוּ
  choice: 他们比我们强大
  rationale: 保留 מִן 的比较意义；原文以单数代词回指集合名词 הָעָם，汉语依其群体所指自然使用复数“他们”。
