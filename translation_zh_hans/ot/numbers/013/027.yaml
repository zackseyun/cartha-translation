  yaml_path: translation/ot/numbers/013/027.yaml
  text: They reported to him and said[a], “We came into the land to which you sent us. It truly flows with milk and honey, and this is its fruit.”
translation:
  language: zh_hans
  text: 他们向他报告说：“我们进了你派我们去的那地；那地的确流奶与蜜[a]，这就是那地的果子。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“而且，那地流奶与蜜。”希伯来语“וְגַם”在这里加强了对那地丰饶的肯定。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְסַפְּרוּ לוֹ וַיֹּאמְרוּ
  choice: 他们向他报告说
  rationale: ספר 的皮勒式在这里指正式地陈述、报告；将连续的“报告……并说”自然合并为“报告说”，既保留叙事功能，也符合现代汉语。לוֹ 仍译作代词“向他”，不把上下文中的摩西直接代入正文。
- source_word: בָּאנוּ אֶל־הָאָרֶץ אֲשֶׁר שְׁלַחְתָּנוּ
  choice: 我们进了你派我们去的那地
  rationale: בוא 可表示来到或进入；鉴于探子已经在当地察看，“进了”准确而自然。关系结构在汉语中调整为“你派我们去的那地”。
- source_word: וְגַם
  choice: 果然
  rationale: 这里的连词与强调词共同确认那地确实具有所说的丰饶；“果然”在报告语境中自然表达这种肯定语气，同时以脚注保留“而且/的确”的可能理解。
- source_word: זָבַת חָלָב וּדְבַשׁ הִוא
  choice: 那地果然是流奶与蜜之地
  rationale: “流奶与蜜”保留希伯来语形象，表示土地丰饶；补出“之地”使汉语谓语完整，并明确阴性代词 הִוא 回指“那地”。
- source_word: וְזֶה פִּרְיָהּ
  choice: 这就是那地的果子
  rationale: 保留 זֶה 的指示性和现场展示证物的意味；将代词后缀明确译为“那地的”，避免汉语“它的”指代含混。
