base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/018.yaml
  text: See what the land is like[a], and whether the people who dwell in it are strong or weak[b], whether they are few or many.
translation:
  language: zh_hans
  text: 要察看那地怎样[a]，住在那地的百姓[b]是强是弱，是少是多。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“那地是什么”；这里是要评估那地的性质或状况。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译为“住在其上的百姓”；按现代汉语习惯译为“住在那地的百姓”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּרְאִיתֶם
  choice: 要察看
  rationale: ראה在此承接摩西差派探子的指示，具有命令意味。“察看”比单纯的“看”更能表达实地观察、查明的语境，同时保持简洁。
- source_word: הָאָרֶץ מַה הִוא
  choice: 那地怎样
  rationale: 直译为“那地是什么”，实际询问的是土地的性质或状况。“那地怎样”是自然的现代汉语，也保留原文概括性的评估意味。
- source_word: הָעָם הַיֹּשֵׁב עָלֶיהָ
  choice: 住在那地的百姓
  rationale: יֹשֵׁב与עַל־הארץ连用表示居住、定居于该地。现代汉语以“住在那地”表达最自然，不机械译作“住在其上”。
- source_word: הֶחָזָק
  choice: 强
  rationale: חזק在此指居民在力量或实力方面强大；“强”与下文“弱”构成直接、清楚的对举。
- source_word: הֲרָפֶה
  choice: 弱
  rationale: רפה在此与חזק相对，表示缺乏力量；“弱”是准确而通俗的对应词。
- source_word: הַמְעַט
  choice: 少
  rationale: 此词在数量上与רָב对举；“少”简明地保留这一数量判断。
- source_word: רָב
  choice: 多
  rationale: 此处表示人数众多，与“少”相对；“多”符合现代汉语的自然对举。
- source_word: אִם
  choice: 是……是……
  rationale: אִם在并列的间接选择问句中表达“还是/是否”。汉语用“是强是弱，是少是多”可自然保留两组选择结构。
