base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/014.yaml
  text: from the tribe of Naphtali[a], Nahbi the son of Vophsi;
translation:
  language: zh_hans
  text: 拿弗他利支派的代表是瓦弗西的儿子拿比；
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְ/מַטֵּה
  choice: ……支派的代表是
  rationale: 在这份各支派代表的名单中，介词 לְ 与 מַטֶּה 一同标明所属支派；补出“代表是”可使本节作为名单项目在现代汉语中自然完整，同时不增加原文之外的身份信息。
- source_word: נַפְתָּלִי
  choice: 拿弗他利
  rationale: 采用现代中文圣经读者熟悉的支派名称译写。
- source_word: נַחְבִּי
  choice: 拿比
  rationale: 按中文圣经通行形式音译该人名；希伯来语喉音 ח 未另以汉字明显标出，以保持名称简洁易读。
- source_word: בֶּן
  choice: ……的儿子
  rationale: 准确表达希伯来语父子关系结构，并按汉语姓名列表的自然语序将父名置于“的儿子”之前。
- source_word: וָפְסִי
  choice: 瓦弗西
  rationale: 直接依据希伯来语 וָפְסִי（近于 Wāfsî）音译；“瓦”反映首音节元音，比从英语形式 Vophsi 转译更贴近马所拉文本。
theological_decisions: []
translation_notes:
  register: 采用简洁、庄重的现代标准汉语，并与上下文的支派代表名单体例相配。原文是省略谓语的名单条目；译文补出“代表是”，使独立经节通顺。英语咨询文本把脚注标在“Naphtali”之后，但脚注内容实际讨论 Vophsi/Vapsi 的英语拼写差异；这属于英语音译问题，中文稿直接从希伯来语音译，故不保留该脚注。
