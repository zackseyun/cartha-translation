lexical_decisions:
- source_word: וְאֵלֶּה
  choice: 如下
  rationale: 本句承接上文并引出名单；现代汉语用“如下”自然表达“这些是”，而上下文的连续性无需机械译出连接词“和”。
- source_word: שְׁמוֹתָם
  choice: 他们的名字
  rationale: 按原文保留复数“名字”和所属关系，并与“如下”组成自然的名单引语。
- source_word: לְמַטֵּה רְאוּבֵן
  choice: 吕便支派的
  rationale: 此处介词לְ表示名单成员与支派的归属或代表关系；“吕便支派的”简洁自然，并保留原文未明说“代表”的表达。
- source_word: רְאוּבֵן
  choice: 吕便
  rationale: 采用现代中文圣经中通行的人名及支派名音译。
- source_word: שַׁמּוּעַ
  choice: 撒母亚
  rationale: 按希伯来语人名音译，并采用中文圣经通行译名。
- source_word: בֶּן
  choice: ……的儿子
  rationale: 明确表达希伯来语父子关系，同时调整为自然的现代汉语语序。
- source_word: זַכּוּר
  choice: 撒刻
  rationale: 按希伯来语人名音译，并采用中文圣经通行译名。
