base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/030.yaml
  text: Then Caleb quieted the people before Moses and said[a], “Let us surely go up and take possession of it[c][b], for we are certainly able to do it.”
translation:
  language: zh_hans
  text: 迦勒使百姓在摩西面前安静下来[a]，说：“我们一定要上去[b]，占领那地，因为我们必定能够办到[c]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“叫百姓在摩西面前静下来”。这个希伯来语动词可表示使人安静、止声。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译：“上去，我们一定要上去”，用重复式结构加强语气。
    reason: lexical_alternative
  - marker: c
    text: 或译：“因为我们确实能做到。”希伯来文用重复式结构加强“能够”的语气。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּהַס
  choice: 使……安静下来
  rationale: 该动词表示使一群人静下来；这一译法自然地呈现迦勒制止喧嚷、让百姓安静的动作，又不额外赋予强硬压制的意味。
- source_word: אֶת־הָעָם
  choice: 百姓
  rationale: 这里指聚集的以色列民众；“百姓”是现代中文圣经叙事中自然、庄重的称呼。
- source_word: אֶל־מֹשֶׁה
  choice: 在摩西面前
  rationale: 介词 אֶל 通常表示“向、到”，但此处结合场景，指百姓在摩西面前或当着摩西时被制止安静；保留“在摩西面前”也避免过度解释他们原先是否正向摩西说话。
- source_word: עָלֹה נַעֲלֶה
  choice: 我们一定要上去
  rationale: 不定式绝对形与未完成式连用，加强“上去”的语气；“一定要”既表达迦勒的劝勉，也保留原文的强调，而不加入原文没有明说的“立刻”。
- source_word: וְיָרַשְׁנוּ אֹתָהּ
  choice: 占领那地
  rationale: ירשׁ 在进入迦南的语境中表示取得并占有土地。“占领”体现主动取得土地的含义；宾语阴性单数代词所指的“那地”明确译出，以符合自然中文。
- source_word: כִּי יָכוֹל נוּכַל
  choice: 因为我们必定能够
  rationale: 这里同样以不定式绝对形加强未完成式，强烈表达能力与信心；“必定能够”保留其强调语气。
- source_word: לָהּ
  choice: 办到
  rationale: 该阴性单数代词回指那地，字面结构是“对它有能力”。中文用“办到”承接前述上去占领那地的整项行动，表达通顺，同时不把原文限定为某一种具体军事方式。
theological_decisions:
- issue: 迦勒信心宣告中能力的具体对象
  choice: 译作“必定能够办到”，承接上去占领那地的行动
  alternative: “必能胜过它”或“足能攻取那地”
  rationale: 原文 לָהּ 可理解为对那地有能力、能够应付或胜过它。正文采用较少解释性的中文表达，以保留能力所指范围的开放性；脚注列出更具军事色彩的可能译法。
translation_notes:
  register: 采用现代、清楚而庄重的叙事语言。“安静下来”适合群众场景；“一定要……必定能够”对应原文两处强调结构。正文不加入“立刻”，因为原文没有明确的时间副词。脚注标记依其所解释的词语紧邻放置。
