  yaml_path: translation/ot/numbers/031/037.yaml
  text: And the tribute for Yahweh from the flock was six hundred seventy-five.
translation:
  language: zh_hans
  text: 从羊群中抽取、归给雅威的份额是六百七十五只。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: 是
  rationale: 此处是叙事中的系词结构，用来说明贡物的数目；汉语用“是”自然表达，不必另译句首连接词。
- source_word: הַמֶּכֶס
  choice: 贡物
  rationale: 该词指从战利品中抽取并交出的规定份额；“贡物”既体现其应缴性质，也避免套用现代“税收”的制度含义。
- source_word: לַיהוָה
  choice: 归给雅威的
  rationale: 介词 ל 表示这一份额被指定给雅威；“归给”清楚表达其归属和奉献对象。
- source_word: יהוה
  choice: 雅威
  rationale: 按希伯来文四字神名直接采用现代汉语中通行的音译“雅威”，而不以称号替代。
- source_word: מִן הַצֹּאן
  choice: 从羊群中
  rationale: צֹאן 是羊类小牲畜的集合称呼，可包括绵羊和山羊；“羊群”在汉语中自然，并不刻意缩窄为单一品种。
- source_word: שֵׁשׁ מֵאוֹת חָמֵשׁ וְשִׁבְעִים
  choice: 六百七十五只
  rationale: 准确保留数目，并添加适合牲畜的量词“只”，使现代汉语完整自然。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名，译作“雅威”保留其专名性质，不以“主”这一称号替代；“耶和华”是传统形式，但较不贴近该名称通常重建的发音。
translation_notes:
  register: 采用简洁、庄重的现代标准汉语，保持原文报数式陈述。“贡物”与上下文从战利品中抽取的规定份额相符；句末加量词“只”以符合汉语习惯。
