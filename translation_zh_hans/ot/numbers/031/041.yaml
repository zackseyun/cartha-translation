  text: וַ/יִּתֵּ֣ן מֹשֶׁ֗ה אֶת מֶ֨כֶס֙ תְּרוּמַ֣ת יְהוָ֔ה לְ/אֶלְעָזָ֖ר הַ/כֹּהֵ֑ן כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/041.yaml
  text: And Moses gave the tribute[a], the contribution for Yahweh, to Eleazar the priest[b], just as Yahweh had commanded Moses.
translation:
  language: zh_hans
  text: 摩西把那份贡物[a]，就是归给雅威的奉献[b]，交给祭司以利亚撒，正如雅威吩咐摩西的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“征收的份额”或“应缴之物”，指从战利品中按规定抽取的部分。
    reason: lexical_alternative
  - marker: b
    text: 也可译“献给雅威的奉献”或“雅威的奉献”；传统译作“雅威的举祭”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: 交给
  rationale: נתן在这里表示把指定之物转交给接受者；“交给”比单说“给了”更自然，也符合叙事语境。
- source_word: מֶכֶס
  choice: 贡物
  rationale: 此词指从战利品中按规定抽取的份额。“贡物”表达必须缴纳之物，同时避免直接让人联想到现代税制；脚注保留“征收份额”等可能译法。
- source_word: תְּרוּמַת יְהוָה
  choice: 归给雅威的奉献
  rationale: תְּרוּמָה指分别出来、用于神圣用途的奉献。“归给雅威”既表达这份物品被划归雅威，也不过度限定属格关系；传统的礼仪术语“举祭”列入脚注。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语音译四字神名，保留原文所用的专名，不以称号替代。
- source_word: לְאֶלְעָזָר הַכֹּהֵן
  choice: 交给祭司以利亚撒
  rationale: 按现代汉语习惯将身份称谓置于人名前，准确表达介词短语及同位称谓。
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת־מֹשֶׁה
  choice: 正如雅威吩咐摩西的
  rationale: “正如”突出摩西的行动完全依照先前命令；句末“的”使中文叙事流畅，并自然承接前句。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名。译作“雅威”保留其专名性质，也较接近学界通常重构的读音；“耶和华”是传统汉语形式，但反映较晚形成的混合读法。
- issue: תְּרוּמַת יְהוָה中属格关系的理解
  choice: 归给雅威的奉献
  alternative: 雅威的奉献；献给雅威的奉献
  rationale: 希伯来语结构可以表达归属、指定对象或圣物性质。“归给雅威”传达该份额被分别归于雅威，同时不把语义过窄地限定为某一种属格关系。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“贡物”保留古代战利品分配的语境；以插入语“就是……”呈现原文两个名词短语的解释关系。所有脚注标记均置于其所说明的词语之后。
