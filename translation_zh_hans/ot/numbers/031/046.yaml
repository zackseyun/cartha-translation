lexical_decisions:
- source_word: וְ/נֶפֶשׁ אָדָם
  choice: 人口
  rationale: נֶפֶשׁ在战利品清点的语境中指被计数的个人，אָדָם进一步表明所指为人而非牲畜。现代汉语用“人口”既自然地表达人数统计，也不把נֶפֶשׁ误解为专指非物质的“灵魂”。连接词וְ承接前面的清单，汉语中不必机械译出。
- source_word: שִׁשָּׁה עָשָׂר אָלֶף
  choice: 一万六千
  rationale: 该希伯来语数词明确表示十六个一千，按现代汉语计数习惯译为“一万六千”。
