source:
  edition: WLC
  text: וְ/חָצִ֨יתָ֙ אֶת הַ/מַּלְק֔וֹחַ בֵּ֚ין תֹּפְשֵׂ֣י הַ/מִּלְחָמָ֔ה הַ/יֹּצְאִ֖ים לַ/צָּבָ֑א וּ/בֵ֖ין כָּל הָ/עֵדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/027.yaml
  text: And divide the plunder between those who took part in the war[a], who went out to battle[b], and all the congregation.
translation:
  language: zh_hans
  text: 你要把战利品[a]分作两份：一份给参战出征的人，另一份给全体会众[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“掳获物”。这里指战争中掳获的人和物；本章上下文具体包括人和牲畜。
    reason: lexical_alternative
  - marker: b
    text: 或译“全体民众”或“全体大会”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְחָצִיתָ
  choice: 你要……分作两份
  rationale: חצה表示分开、分成两部分；未完成式在神对摩西的指示中具有命令意味。“分作两份”也自然呈现后面בֵין…וּבֵין所指的两个受分配群体。
- source_word: הַמַּלְקוֹחַ
  choice: 战利品
  rationale: מַלְקוֹחַ指战争中掳获的一切；“战利品”是现代汉语中自然、庄重的概括表达。上下文表明其范围包括被掳的人和牲畜，故以脚注说明。
- source_word: תֹּפְשֵׂי הַמִּלְחָמָה הַיֹּצְאִים לַצָּבָא
  choice: 参战出征的人
  rationale: 前一短语直译近似“掌握/从事战争的人”，是对参战者的习语性称呼；后一分词短语进一步说明他们是出征服役的人。合译为“参战出征的人”，既保留两层描述，也避免生硬直译。
- source_word: וּבֵין כָּל הָעֵדָה
  choice: 另一份给全体会众
  rationale: עֵדָה指以色列整体共同体或集会群体。“全体会众”保留其群体与圣约共同体色彩；“另一份给”自然表达בֵין…וּבֵין的第二方。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的指令语体。“一份……另一份……”使希伯来语在两个群体之间分配的结构在汉语中清楚自然；不改变双方各得一半的上下文含义。
