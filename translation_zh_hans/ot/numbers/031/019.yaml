  text: וְ/אַתֶּ֗ם חֲנ֛וּ מִ/ח֥וּץ לַֽ/מַּחֲנֶ֖ה שִׁבְעַ֣ת יָמִ֑ים כֹּל֩ הֹרֵ֨ג נֶ֜פֶשׁ וְ/כֹ֣ל נֹגֵ֣עַ בֶּֽ/חָלָ֗ל תִּֽתְחַטְּא֞וּ בַּ/יּ֤וֹם הַ/שְּׁלִישִׁי֙ וּ/בַ/יּ֣וֹם הַ/שְּׁבִיעִ֔י אַתֶּ֖ם וּ/שְׁבִי/כֶֽם׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/019.yaml
  text: And you[a], camp outside the camp for seven days. Everyone who has killed a person, and everyone who has touched one slain, shall purify yourselves on the third day and on the seventh day—you and your captives.
translation:
  language: zh_hans
  text: 你们要在营外驻扎七天。凡杀过人的，凡接触过被杀之人[a]的，都要在第三天和第七天洁净自己——你们和你们所掳来的人都要这样做。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“被杀之人的尸体”。希伯来文直译为“被杀的人”；在本段语境中，所指的是接触死者尸体而成为不洁。
    reason: 说明词义范围及尸体接触的语境含义，同时保留原文以“被杀的人”表达的特点。
lexical_decisions:
- source_word: חֲנוּ
  choice: 驻扎
  rationale: 这是חנה的复数祈使式；“驻扎”自然贴合战后营地的语境，也表达在营外停留安营之意。
- source_word: מִחוּץ לַמַּחֲנֶה
  choice: 在营外
  rationale: 准确保留空间关系，并以简洁的现代汉语表达。
- source_word: שִׁבְעַת יָמִים
  choice: 七天
  rationale: 直接表达规定的持续时间，汉语无需另加介词。
- source_word: כֹּל הֹרֵג נֶפֶשׁ
  choice: 凡杀过人的
  rationale: נֶפֶשׁ在此指人而非抽象的“灵魂”；分词结合战后语境指已经杀人的人，因此译作“杀过”。
- source_word: וְכֹל נֹגֵעַ בֶּחָלָל
  choice: 凡接触过被杀之人的
  rationale: חָלָל指遭杀害的人，也在此洁净条例中实际涉及其尸体；正文保留希伯来语的人称表达，脚注说明语境含义。
- source_word: תִּתְחַטְּאוּ
  choice: 洁净自己
  rationale: חטא的Hitpael形式在此礼仪语境中指除去不洁，而不是泛指道德悔改或罪得赦免。
- source_word: בַּיּוֹם הַשְּׁלִישִׁי וּבַיּוֹם הַשְּׁבִיעִי
  choice: 在第三天和第七天
  rationale: 保留洁净程序中两个明确日期，形式清楚而庄重。
- source_word: אַתֶּם וּשְׁבִיכֶם
  choice: 你们和你们所掳来的人
  rationale: שְׁבִי在军事语境中指战争中掳获的人；此译法比笼统的“囚犯”更贴近上下文。
theological_decisions:
- issue: 杀人或接触死者之后洁净的性质
  choice: 表达因接触死亡而进行的礼仪性洁净
  alternative: 理解为除去杀人所负的道德罪责
  rationale: 本节规定第三天和第七天进行洁净，与尸体不洁的礼仪程序相符。因此译作“洁净自己”，不进一步断言这是道德罪责的赦免。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“驻扎”“洁净”“所掳来的人”保留旷野军营与礼仪条例的语域；破折号自然承接末尾强调成分，说明洁净规定同时适用于以色列人和被掳者。
