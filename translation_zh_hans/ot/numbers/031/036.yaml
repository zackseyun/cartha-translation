base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/036.yaml
  text: And the half[a], the portion of those who went out to war, was in number 337,500 sheep.
translation:
  language: zh_hans
  text: 那一半[a]，即出征者的份额，羊的数目是337,500只。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文“那一半”与“出征者的份额”同位并列。
    reason: 说明原文的同位结构。
lexical_decisions:
- source_word: וַתְּהִי
  choice: 共有
  rationale: 此处引出分配后所得的总数；“共有”符合现代汉语计数表达，同时保留其结果性陈述。
- source_word: הַמֶּחֱצָה
  choice: 那一半
  rationale: 指上文从战利品中分出的一半；加“那”承接语境，并保留“半数”这一明确概念。
- source_word: חֵלֶק
  choice: 所得的份
  rationale: 该词与“那一半”构成同位说明，指出这一半归谁；“所得的份”自然表达分配所得。
- source_word: הַיֹּצְאִים בַּצָּבָא
  choice: 出征之人
  rationale: 该短语直指参加军事行动的人；“出征之人”简洁、自然，也保留“出去参战”的动作意味。
- source_word: מִסְפַּר הַצֹּאן
  choice: 羊共有
  rationale: 这是引出羊只总数的计数结构；“羊共有”符合现代汉语习惯，避免生硬的“羊的数目是”。
- source_word: הַצֹּאן
  choice: 羊
  rationale: צֹאן可指成群的小型牲畜；在本段分类清点战利品的语境中译作“羊”清楚且简练，汉语“羊”本身也不强行限定具体品种。
- source_word: שְׁלֹשׁ מֵאוֹת אֶלֶף וּשְׁלֹשִׁים אֶלֶף וְשִׁבְעַת אֲלָפִים וַחֲמֵשׁ מֵאוֹת
  choice: 337,500只
  rationale: 原文为300,000、30,000、7,000和500相加；使用阿拉伯数字便于现代读者准确辨读，并以量词“只”配合牲畜计数。
theological_decisions: []
