lexical_decisions:
- source_word: אֶלֶף לַמַּטֶּה אֶלֶף לַמַּטֶּה
  choice: 每个支派一千人，每个支派一千人
  rationale: 保留希伯来文刻意的重复及其分配性语义，同时采用自然、清楚的现代汉语表达。
- source_word: לְכֹל מַטּוֹת יִשְׂרָאֵל
  choice: 从以色列所有支派中
  rationale: 在征召军队的语境中，介词短语说明人员选取的范围；“从……中”最符合上下文。
- source_word: תִּשְׁלְחוּ
  choice: 要……派他们
  rationale: 未完成式第二人称复数在此具有命令意味；“要”既体现指令语气，也符合现代汉语经文文体。
- source_word: לַצָּבָא
  choice: 参军
  rationale: צָבָא在此涉及军事队伍或军事服役；“参军”自然表达被派投入军队服役的含义。
