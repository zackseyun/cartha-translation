  yaml_path: translation/ot/numbers/031/048.yaml
  text: Then the officers who were over the thousands of the army[a], the commanders of thousands and the commanders of hundreds[b], came near to Moses.
translation:
  language: zh_hans
  text: 那些负责军中各千人队的官长，就是千夫长和百夫长，都上前来到摩西面前。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְרְבוּ
  choice: 上前到……那里
  rationale: 该动词表示向某人靠近；此译法符合现代汉语叙事习惯，同时保留实际趋近的含义。
- source_word: הַפְּקֻדִים
  choice: 官长
  rationale: 这是由פקד构成的被动形式，在此指受委派管理军事单位的人，并非普通士兵；“官长”能自然表达其职务身份。
- source_word: אֲשֶׁר לְאַלְפֵי הַצָּבָא
  choice: 负责军中各千人队的
  rationale: 上下文及后面的同位说明表明，这些官长负责军队中的千人编制；此译法清楚表达其管辖关系。
- source_word: אַלְפֵי
  choice: 各千人队
  rationale: אֶלֶף也可指宗族或军事编队，但本节处于军事语境，又与“百夫长”并列，故按千人军事单位理解。
- source_word: הַצָּבָא
  choice: 军中
  rationale: צָבָא在此指有组织的作战部队；“军中”简洁自然。
- source_word: שָׂרֵי הָאֲלָפִים
  choice: 千夫长
  rationale: שַׂר指首领或长官；在军事层级中，“千夫长”是现代中文圣经语境中清楚而凝练的称谓。
- source_word: וְשָׂרֵי הַמֵּאוֹת
  choice: 和百夫长
  rationale: 与“千夫长”平行，保留原文所呈现的军事层级。
