  text: And they burned with fire all their cities in their dwelling places[b][a], and all their encampments.
translation:
  language: zh_hans
  text: 他们把米甸人各聚居处的所有城镇[a]和所有营寨[b]，都用火焚烧了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “米甸人各聚居处的所有城镇”或译“他们各聚居地的一切城邑”。
    reason: lexical_alternative
  - marker: b
    text: “营寨”也可译作“营地”或“村落”；原词可指有围护的驻地或较小的聚居点。
    reason: lexical_alternative
lexical_decisions:
- source_word: עָרֵיהֶם
  choice: 米甸人的所有城镇
  rationale: עִיר可指城或镇；“城镇”在现代汉语中范围较宽，适合这里的军事与聚居背景。原文为“他们的城镇”，根据紧接的上下文将代词所指明说为“米甸人”，避免汉语中连续使用“他们”造成误解。
- source_word: בְּמוֹשְׁבֹתָם
  choice: 居住地
  rationale: מוֹשָׁב可指住处、居住地或聚居地。译作“居住地”既保留地点含义，也能自然修饰“所有城镇”。
- source_word: טִירֹתָם
  choice: 所有营寨
  rationale: טִירָה可指营地、围起来的驻地或村落。“营寨”保留其与“城镇”不同的聚居形态，又不把具体形态限定得过死；其他可能译法列于脚注。
- source_word: שָׂרְפוּ בָּאֵשׁ
  choice: 用火烧了
  rationale: בָּאֵשׁ在这里表示手段。“用火烧了”自然保留原文对火的明说，不额外强化为“烧毁”。
- source_word: וְאֵת ... וְאֵת
  choice: 所有……和所有……
  rationale: 两个带כָּל的并列直接宾语都表达总括范围，重复“所有”以保留原文的分项强调。
