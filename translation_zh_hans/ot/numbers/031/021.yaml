base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/021.yaml
  text: Then Eleazar the priest said to the men of the army who had come to the battle[a], “This is the statute of the law that Yahweh commanded Moses:”
translation:
  language: zh_hans
  text: 祭司以利亚撒对那些上阵作战的人说：“这是耶和华吩咐摩西的律法条例：[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “律法条例”也可译作“律法的定例”或“训诲的条例”。
    reason: 保留חֻקַּת הַתּוֹרָה中“定例／条例”与“律法／训诲”的词义幅度。
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: 未另译连接词“וַ”，以自然的现代汉语承接上下文叙事；“说”准确表达该动词。
- source_word: אֶלְעָזָר הַכֹּהֵן
  choice: 祭司以利亚撒
  rationale: 按现代汉语习惯将职分置于姓名之前；人名采用通行圣经译名。
- source_word: אַנְשֵׁי הַצָּבָא
  choice: 那些……的人
  rationale: 结合后面的关系分句表达军中人员；保留原文所指男性战士的语境，同时避免生硬直译为“军队的人”。
- source_word: הַבָּאִים לַמִּלְחָמָה
  choice: 上阵作战
  rationale: 介词ל表示朝向战争或投入战事；译文不擅自改作“从战场回来”，因原文并未明说“回来”。
- source_word: חֻקַּת הַתּוֹרָה
  choice: 律法条例
  rationale: חֻקָּה指具有约束力的定例、条例，תּוֹרָה在此指权威性的律法或训诲；“律法条例”自然且保留法律语域。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代简体中文圣经语境中广为人知的神名音译，明确呈现四字神名，而非以称号替代。
- source_word: אֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: 耶和华吩咐摩西的
  rationale: אֶת标明摩西是“吩咐”的直接宾语；译文不改成“借着摩西”，以免把受命者解释为中介者。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 两者都是四字神名的中文表达；正文采用中文读者最熟悉且明确区别于“主”的“耶和华”，不以称号替代专名。
- issue: 摩西在命令中的语法角色
  choice: 耶和华吩咐摩西
  alternative: 耶和华借摩西吩咐
  rationale: 原文用直接宾语标记אֶת指向摩西，因此保留摩西为受命者，不将本句解释为强调摩西的中介角色。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“上阵作战”简洁表达前往、投入战事的含义；句末冒号保留本节引出下文具体规定的结构。
