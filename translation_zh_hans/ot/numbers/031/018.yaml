  text: וְ/כֹל֙ הַ/טַּ֣ף בַּ/נָּשִׁ֔ים אֲשֶׁ֥ר לֹא יָדְע֖וּ מִשְׁכַּ֣ב זָכָ֑ר הַחֲי֖וּ לָ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/018.yaml
  text: But keep alive for yourselves every young girl among the women who has not known the bed of a man[a].
translation:
  language: zh_hans
  text: 但在妇女中，所有未曾与男子同房的女孩[a]，你们要让她们活着，留给自己。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译得更明确些：“所有没有与男子发生过性关系的女孩”。
    reason: 说明原文性委婉语的明确含义，同时正文保留较含蓄、庄重的表达。
lexical_decisions:
- source_word: וְ/כֹל
  choice: 但所有
  rationale: וְ在上下文中与前述处置命令形成转折，用“但”体现其对比作用；כֹל修饰集合性对象，译作“所有”自然准确。
- source_word: הַטַּף בַּנָּשִׁים
  choice: 所有年幼女子
  rationale: טַף指年幼者或孩子；בַּנָּשִׁים及后续限定语明确所指为女性。合译为“年幼女子”既避免生硬的“女子中的孩子”，又保留年龄和性别信息。
- source_word: אֲשֶׁר לֹא יָדְעוּ מִשְׁכַּב זָכָר
  choice: 凡未曾与男子同房的
  rationale: יָדַע与מִשְׁכַּב זָכָר在此共同构成指性经历的委婉说法。“与男子同房”是现代汉语中清楚而庄重的对应表达，没有改用“处女”这一抽象身份称谓。
- source_word: הַחֲיוּ לָכֶם
  choice: 你们都要让她们活着，留给自己
  rationale: הַחֲיוּ是חיה的使役命令式，意为使其存活或让其活着；לָכֶם意为“给你们自己”。此译保留两层意思，同时不擅自说明其后用途。
theological_decisions:
- issue: 是否在正文中把性方面的委婉语完全直白化
  choice: 正文采用“未曾与男子同房”
  alternative: 没有与男子发生过性关系
  rationale: 原文使用委婉表达，而不是“处女”之类的身份标签。“同房”在现代汉语中既能明确传意，也保留原文较含蓄的语气；更直白的解释列入脚注。
- issue: 是否将טַף译成不标性别的“孩子”
  choice: 译作“年幼女子”
  alternative: 孩子；年幼者
  rationale: טַף本身未必限定性别，但紧接的בַּנָּשִׁים和关系从句把所指限定为女性；正文明确性别符合本句语境，同时没有超出原文断定更具体的年龄。
- issue: 如何表达לָכֶם而不推断这些幸存者的具体用途
  choice: 保留“留给自己”
  alternative: 归你们所有；供你们使用
  rationale: 原文明确含有“给你们自己”，却未在本节说明具体安排。“留给自己”保留其令人不安的占有意味和叙事张力，不另加用途解释。
translation_notes:
  register: 采用现代、庄重而直接的叙事命令语体。“同房”通俗可懂但不粗俗；“让她们活着，留给自己”贴近原文，也不弱化或解释其中的伦理张力。脚注标记[a]已置于正文对应短语之后。
