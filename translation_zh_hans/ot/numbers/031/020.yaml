  text: וְ/כָל בֶּ֧גֶד וְ/כָל כְּלִי ע֛וֹר וְ/כָל מַעֲשֵׂ֥ה עִזִּ֖ים וְ/כָל כְּלִי עֵ֑ץ תִּתְחַטָּֽאוּ־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/020.yaml
  text: And every garment[a], and every article of leather, and every work of goats’ hair, and every article of wood, you shall purify.
translation:
  language: zh_hans
  text: 凡衣服、皮制物品、山羊毛制品和木制物品，你们都要使它们洁净。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּגֶד
  choice: 衣服
  rationale: 该词通常指衣服或衣物；此处用“衣服”自然明白，也符合物品清单的语境。
- source_word: כְּלִי עוֹר
  choice: 皮制物品
  rationale: כְּלִי 可泛指器具、器皿或物件，不宜限缩为容器；“皮制物品”既保留材料类别，也符合现代汉语。
- source_word: מַעֲשֵׂה עִזִּים
  choice: 山羊毛制品
  rationale: 该短语直译近于“山羊的制作品”，在材料清单中通常理解为用山羊毛制成的物品；此译清楚表达最可能的所指，同时避免生硬的直译。
- source_word: כְּלִי עֵץ
  choice: 木制物品
  rationale: כְּלִי 的范围比“器皿”宽；“木制物品”与前面的材料分类平行。
- source_word: תִּתְחַטָּאוּ
  choice: 你们都要使它们洁净
  rationale: 在本节清单和战后礼仪洁净的语境中，前列物品最自然地作动词的对象。“洁净”表达礼仪层面的除污，不误导为一般清洗或道德悔改；脚注保留希伯来语反身形式所产生的另一种理解。
theological_decisions:
- issue: 战争后礼仪洁净语境中 תִּתְחַטָּאוּ 的对象与反身意义
  choice: 正文理解为命令听众使所列物品在礼仪上洁净
  alternative: “你们都要洁净自己”
  rationale: 所列名词置于句首，按上下文最自然地充当被洁净的对象；但该动词采用通常带反身意义的形式，因此不应完全遮蔽“洁净自己”的语法可能。正文不加入“除罪”等措辞，以免把礼仪洁净扩展为后期教义意义上的赦罪或内在更新。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“凡……都……”保留清单的总括结构；“皮制物品、山羊毛制品、木制物品”形成平行表达。“洁净”按上下文表示礼仪洁净，而非普通清洗。
