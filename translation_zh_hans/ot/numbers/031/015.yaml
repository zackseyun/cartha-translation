base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/015.yaml
  text: Moses said to them[a], “Have you kept alive every female?”
translation:
  language: zh_hans
  text: 摩西对他们说：“你们让所有女性都活下来了吗？”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你们让所有女性都活着吗？”
    reason: 词义与汉语表达的另一种译法；“活下来”强调在事件后幸存，“活着”强调持续存活。
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: 这是叙事中常见的 wayyiqtol 形式，现代汉语用“说”自然、准确。
- source_word: אֲלֵיהֶם
  choice: 对他们
  rationale: 介词 אֶל 加第三人称阳性复数后缀，表示说话所指向的对象。
- source_word: מֹשֶׁה
  choice: 摩西
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: הַחִיִּיתֶם
  choice: 你们让……活着吗
  rationale: חיה 的使役式在此表示“让……存活”；前缀 הַ 构成疑问。此译法保留使役意义和摩西质问的语气，不加入原文未明说的动机。
- source_word: כָּל
  choice: 所有
  rationale: כָּל 修饰单数集合性名词时表示范围无一例外；中文用“所有”最自然。
- source_word: נְקֵבָה
  choice: 女性
  rationale: 该词按性别泛指女性，并不限于成年妇女；“女性”能保留原文宽泛而直接的范围。
theological_decisions:
- issue: 战争暴力语境中 נְקֵבָה 的范围
  choice: 女性
  alternative: 妇女；女人；妇女和女孩
  rationale: 原文按性别指称，未在本节限定年龄。“女性”既不把对象缩限为成年人，也不借增词预先划分年龄类别，因而保留原文的广度与严峻性。
- issue: הַחִיִּיתֶם 所表达的责任与语气
  choice: 让……活着吗
  alternative: 保全了……的性命吗；让……活下来了吗
  rationale: 使役式可表示“使其活着”或“容其存活”。正文采用直接、自然的质问句，同时不把它强化为原文未显式表达的审判理由。
translation_notes:
  register: 采用庄重而通俗的现代标准汉语。问句保持原文简短、直接的质问语气；“女性”有意保留 נְקֵבָה 不限年龄的广泛指称。
