  yaml_path: translation/ot/numbers/031/011.yaml
  text: And they took all the spoil and all the plunder, both man and beast.
translation:
  language: zh_hans
  text: 他们拿走了一切战利品，以及一切掳获的人和牲畜。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׁלָל
  choice: 战利品
  rationale: 指战争中夺得的物品，用现代汉语“战利品”准确自然。
- source_word: מַלְקוֹחַ
  choice: 掳获之物
  rationale: 与“战利品”并列，较广泛地指所掳获、带走的一切，保留原文两个近义词的区别。
- source_word: אָדָם
  choice: 人口
  rationale: 在与牲畜并列、作为所掳获对象的语境中，“人口”比单数形式的“人”更符合现代汉语集合表达。
- source_word: בְּהֵמָה
  choice: 牲畜
  rationale: 此处指被掳获的家畜，译作“牲畜”比笼统的“兽”更合乎语境。
- source_word: וַיִּקְחוּ
  choice: 带走了
  rationale: 该动词基本义为“拿、取”；在战后携走战利品的语境中译作“带走了”自然准确。
