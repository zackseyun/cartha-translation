- from: “你要向米甸人报以色列人的仇。[a]之后，你必归到你本族那里。”[b]
  to: “你要为以色列人向米甸人报仇。之后，你必归到你的族人那里。”
  rationale: 修订消除了“报以色列人的仇”在现代汉语中的句法歧义，并使死亡惯用语更自然。保留“报仇”的强度、以色列人的相关性、米甸人作为对象，以及“归到……那里”的原文意象；未将其解释为特定的死后状态。脚注a保留“替”的可选表达，并避免误导性的汉语“从……那里报仇”直译。
