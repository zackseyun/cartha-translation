  text: נְקֹ֗ם נִקְמַת֙ בְּנֵ֣י יִשְׂרָאֵ֔ל מֵ/אֵ֖ת הַ/מִּדְיָנִ֑ים אַחַ֖ר תֵּאָסֵ֥ף אֶל עַמֶּֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/002.yaml
  text: Take vengeance for the sons of Israel on the Midianites[b][a]. Afterward you will be gathered to your people.
translation:
  language: zh_hans
  text: “你要为以色列人向米甸人报仇。之后，你必归到你的族人那里。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נְקֹם נִקְמַת
  choice: 报……的仇
  rationale: 动词与同根名词连用，构成加强语气的表达；现代汉语用“报……的仇”自然地传达这一命令的力度，无须生硬重复为“报仇报仇”。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 此处指以色列共同体；“以色列人”比直译“以色列的众子”更符合现代汉语，同时不改变所指。
- source_word: מֵאֵת הַמִּדְיָנִים
  choice: 向米甸人
  rationale: 与 נקם 连用时，标明报仇所针对的对象；“向米甸人报仇”是自然、准确的汉语表达。
- source_word: אַחַר
  choice: 之后
  rationale: 简洁表达事件的先后次序。
- source_word: תֵּאָסֵף אֶל עַמֶּיךָ
  choice: 你必归到你本族那里
  rationale: 保留希伯来语关于死亡的委婉意象；“归到……那里”在现代汉语中较自然，“本族”传达 עַמֶּיךָ 的群体含义，又不把它缩窄为“祖先”。
theological_decisions:
- issue: 摩西将死的希伯来语委婉说法
  choice: 保留“归到你本族那里”的意象
  alternative: 之后你必死／之后你必归到你列祖那里
  rationale: 原文是常见的死亡委婉语，但并未在本节明确说明死后状态；保留意象可避免把经文简化为直白释义，也避免加入“列祖”这一较原文更具体的解释。
- issue: 报仇行为的主体与归属
  choice: 译作“向米甸人报以色列人的仇”
  alternative: 替以色列人向米甸人报仇／从米甸人那里讨还以色列人的血债
  rationale: 原文命令摩西执行属于以色列人的报复；所选译法保留这一关系，不额外加入“血债”等原文未明说的内容。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“报……的仇”保留命令的强度；“归到你本族那里”保留原文死亡委婉语及其神学开放性。脚注标记均置于相关正文之后。
