- source_word: אַנְשֵׁי הַצָּבָא
  choice: 军中的人
  rationale: 该构造短语指军队中的男性成员；“军中的人”在现代汉语中自然、准确，也避免将其误解为军队整体。
- source_word: בָּזְזוּ
  choice: 掠取了财物
  rationale: 该动词意为掳掠、夺取战利品；原文宾语虽省略，但上下文明确指财物，译出可使汉语完整通顺。
- source_word: אִישׁ לוֹ
  choice: 都各自
  rationale: 这是分配性表达，字面意为“各人为自己”，强调军中每个人分别取得财物；“都各自”保留这一分配含义。
