  text: The plunder[a], the remainder of the spoil that the people of the army had plundered, was 675,000 sheep.
translation:
  language: zh_hans
  text: 掳获物[a]，即军队人员所掠得的战利品中其余的部分，共有羊六十七万五千只。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“战利品，就是其余的掳获物”。希伯来语在这里使用了两个意义相近、都指战争掳获物的词（מַלְקוֹחַ 和 בָּז），可能带有文体或分类上的细微差别。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: 共有
  rationale: 此处引出清点所得的总数；用“共有”自然表达希伯来语的存在／系词作用，不额外加入原文没有的时间副词。
- source_word: הַמַּלְקוֹחַ
  choice: 所掳获的战利品
  rationale: 指战争中掳获之物；这一译法既交代取得方式，也符合本节清点战利品的语境。
- source_word: יֶתֶר הַבָּז
  choice: 所掠得之物的余数
  rationale: 保留“余数／剩余部分”的构造关系，并以不同措辞反映本句两个意义相近的战利品用语。
- source_word: אֲשֶׁר בָּזְזוּ
  choice: 所掠得
  rationale: 准确表达在战争中掠取战利品的动作，同时避免中文中累赘地重复“掠夺战利品”。
- source_word: עַם הַצָּבָא
  choice: 军队众人
  rationale: 原文直译近于“军队的民众／人员”；“军队众人”保留集体人员的含义，又比“军中之民”更符合现代汉语。
- source_word: צֹאן
  choice: 羊
  rationale: 在牲畜清点的语境中，译作“羊”直接、自然。
- source_word: שֵׁשׁ מֵאוֹת אֶלֶף וְשִׁבְעִים אֶלֶף וַחֲמֵשֶׁת אֲלָפִים
  choice: 六十七万五千
  rationale: 原文数字合计为六十万、七万和五千；以中文数字完整呈现准确数量。
