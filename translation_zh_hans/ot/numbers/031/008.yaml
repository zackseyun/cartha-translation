base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/008.yaml
  text: 'They killed the kings of Midian along with the rest of their slain: Evi[a], Rekem, Zur, Hur, and Reba, the five kings of Midian. They also killed Balaam son of Beor with the sword.'
translation:
  language: zh_hans
  text: 他们还杀了米甸的众王，连同其他被杀的米甸人：以未[a]、利金、苏珥、户珥和利巴，就是这五位米甸王。他们也用刀杀了比珥的儿子巴兰。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “连同其他被杀的米甸人”也可译作“在他们所杀的人中间”。希伯来语的表达十分紧凑，可能是说这些王死在米甸其余死者之中。
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרְגוּ
  choice: 杀了
  rationale: 该词是 הרג 的 Qal 完成式第三人称复数，直接表示杀死；“杀了”清楚、自然，也符合现代汉语。
- source_word: עַל חַלְלֵיהֶם
  choice: 与米甸其他被杀的人一同被杀
  rationale: 希伯来语字面近于“在他们被杀的人之上／之中”，表达紧凑；此译文保留诸王与其余死者一同被杀的关系，同时以脚注注明也可理解为空间性的“在……之中”。
- source_word: מַלְכֵי מִדְיָן
  choice: 米甸的众王
  rationale: 准确表达属格结构；“众王”与随后列出的五人相配，行文自然。
- source_word: אֱוִי
  choice: 以未
  rationale: 采用现代中文圣经中较通行的人名音译。
- source_word: רֶקֶם
  choice: 利金
  rationale: 采用现代中文圣经中较通行的人名音译。
- source_word: צוּר
  choice: 苏珥
  rationale: 采用现代中文圣经中较通行的人名音译。
- source_word: חוּר
  choice: 户珥
  rationale: 采用现代中文圣经中较通行的人名音译。
- source_word: רֶבַע
  choice: 利巴
  rationale: 采用现代中文圣经中较通行的人名音译。
- source_word: חֲמֵשֶׁת מַלְכֵי מִדְיָן
  choice: 共五位米甸王
  rationale: 该同位语总结前述五个人名；“共五位”在现代汉语中明确而顺畅。
- source_word: בִּלְעָם בֶּן בְּעוֹר
  choice: 比珥的儿子巴兰
  rationale: 忠实表达姓名及父子关系，并采用中文圣经通行译名。
- source_word: בֶּחָרֶב
  choice: 用刀
  rationale: 介词 בְּ 在此表示工具；“用刀”直接保留具体的杀戮工具，且符合现代汉语。
