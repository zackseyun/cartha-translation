  naturalness: 人名和基本叙述均自然，但分号后的“他们是……被杀的”不符合现代汉语叙事节奏，且“他们”须回指诸王，读者需要停顿辨认。将该短语置于主要动词结构内更顺畅。
  terminology: “米甸”“以未、利金、苏珥、户珥、利巴”“比珥的儿子巴兰”均可保留，符合常见中文圣经人名形式。“众王”与后文“五位米甸王”一致。
