revisions:
- from: 他们杀了米甸的众王，就是以未[a]、利金、苏珥、户珥和利巴，共五位米甸王；他们是与米甸其他被杀的人一同被杀的。他们也用刀杀了比珥的儿子巴兰。
  to: 他们还杀了米甸的众王，连同其他被杀的米甸人：以未[a]、利金、苏珥、户珥和利巴，就是这五位米甸王。他们也用刀杀了比珥的儿子巴兰。
  rationale: 修订将“连同／在……中间”这一有歧义的希伯来语短语保留在“杀了”的主句结构中，避免原译不自然且过度展开的被动说明；脚注保留其空间性理解。其余人名、人数、巴兰的父名及“用刀”均维持不变。
