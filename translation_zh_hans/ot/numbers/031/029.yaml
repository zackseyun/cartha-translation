  text: מִ/מַּֽחֲצִיתָ֖/ם תִּקָּ֑חוּ וְ/נָתַתָּ֛ה לְ/אֶלְעָזָ֥ר הַ/כֹּהֵ֖ן תְּרוּמַ֥ת יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/029.yaml
  text: From their half you shall take it and give it to Eleazar the priest as Yahweh’s contribution[a].
translation:
  language: zh_hans
  text: 你们要从他们那一半中取出；你要把所取出的交给祭司以利亚撒，作为归雅威的奉献[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“雅威的供物”或“献给雅威的供物”。希伯来语תְּרוּמָה指从物品中分别出来、归作神圣用途的一份。
    reason: 说明תְּרוּמָה的祭祀语境和构造关系的可译范围，避免将其限定为特定仪式动作。
lexical_decisions:
- source_word: מִמַּחֲצִיתָם
  choice: 从属于他们的那一半中
  rationale: מִן与מַחֲצִית及第三人称复数词尾合起来，直指“从他们的那一半中”。译文保留“一半”的具体分配含义，并用“属于他们的”自然表达所属关系。
- source_word: תִּקָּחוּ
  choice: 你们要……取出
  rationale: 该动词为第二人称阳性复数形式，带指令语气；译作“你们要……取出”，保留原文的复数受命者。
- source_word: וְנָתַתָּה
  choice: 你要把它交给
  rationale: 该动词转为第二人称阳性单数。译文保留从复数“你们”到单数“你”的转换，而不将其抹平；“它”是汉语为承接所取之物而补出的代词。
- source_word: לְאֶלְעָזָר הַכֹּהֵן
  choice: 交给祭司以利亚撒
  rationale: 按现代汉语常用次序，将职衔置于人名前；אֶלְעָזָר采用通行中文音译“以利亚撒”。
- source_word: תְּרוּמַת יְהוָה
  choice: 雅威的贡物
  rationale: תְּרוּמָה在这里指从战利品中划出、归于神圣用途的一份。“贡物”兼顾按份取出的性质与献归神的语境；构造关系可理解为“雅威的”或“献给雅威的”，故以脚注保留其他自然译法。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语音译呈现四字神名，区别于作为称号的“主”。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名。译作“雅威”保留其专名性质，而不以称号代替。
- issue: תְּרוּמַת יְהוָה中构造关系及祭祀词义
  choice: 雅威的贡物
  alternative: 献给雅威的供物；归雅威的贡物
  rationale: 原文既可用所属表达，也可按受益或归属关系理解；正文采用简洁的所属结构，脚注说明其神圣用途及其他可能表达，不把语义范围缩窄为某一种仪式动作。
- issue: 第二人称由复数转为单数
  choice: 保留“你们……你……”的转换
  alternative: 统一译作“你要”；统一译作“你们要”
  rationale: 希伯来文תִּקָּחוּ为复数，וְנָתַתָּה为单数。保留转换可呈现原文对执行群体与单数受命者之间未经解释的切换，避免替原文消除张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“你们要……；你要……”略显突兀，但有意忠实保留希伯来文人称数目的转换。脚注标记[a]已置于正文对应词组之后。
