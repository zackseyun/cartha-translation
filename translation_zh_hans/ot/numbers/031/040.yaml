  source_fidelity: 原文先给出作为战利品清单中“人”的总数，随后给出从这批人中为雅威课取的份额；数字一万六千与三十二均译出。草稿的“从中抽出”正确表达了此处按规定抽取的语境，但“贡物是三十二人”在现代汉语中搭配略显生硬，容易把“贡物”理解为物品而非被课取的人数。
  naturalness: “人口有一万六千”可懂，但在本节的清单和分配语境中，“人口共一万六千”更自然凝练。“其中抽取归给雅威的份额为三十二人”既清楚表明三十二人是所抽取的份额，也保持庄重、现代的行政清单式表达。
  terminology: “雅威”忠实保留 יהוה 的专名性质。“人口／人”适当地处理 נֶפֶשׁ אָדָם 与末尾 נָפֶשׁ 的计数用法，不引入“灵魂”的形而上含义。以“份额”表达 מִכְסָם，并在脚注说明其为按规定课取的部分，较“贡物”直接作“三十二人”的表语更合乎汉语。
