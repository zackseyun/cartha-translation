  to: 人口[a]共一万六千；其中抽取归给雅威的份额[b]为三十二人。
  rationale: 修订仅改善汉语搭配与脚注表述：将“贡物”调整为“份额”，并以“其中抽取归给雅威”清楚呈现该份额从所列人口中按规定取出。人、总数、归属对象及三十二人的数额均未改变。
