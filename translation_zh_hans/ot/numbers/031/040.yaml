base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/040.yaml
  text: And the persons of mankind were sixteen thousand, and their tribute for Yahweh was thirty-two persons.
translation:
  language: zh_hans
  text: 人口[a]共一万六千；其中抽取归给雅威的份额[b]为三十二人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语直译可作“人的生命（或人）”。这里“生命”是计算人数的用语，指人，并用来与牲畜相区别。
    reason: lexical_alternative
  - marker: b
    text: 或译“课征的一份”。原词指从战利品中按规定抽取、分别归给雅威的份额。
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶפֶשׁ אָדָם
  choice: 人口
  rationale: 这里是战利品清单中的计数用语，指与牲畜相对的人，译作“人口”既保留类别含义，又符合现代汉语表达。
- source_word: שִׁשָּׁה עָשָׂר אָלֶף
  choice: 一万六千
  rationale: 按希伯来文基数词直译。
- source_word: מִכְסָם
  choice: 从中抽出的贡物
  rationale: מֶכֶס 指从战利品中按规定比例抽取、分别出来的一份；“贡物”表达其作为献给雅威之份的性质，加上“从中抽出”使代词后缀及分配语境清楚。
- source_word: לַיהוָה
  choice: 归给雅威
  rationale: 介词 לְ 在此表示分配或奉献的归属；“归给”自然传达这份贡物属于雅威。
- source_word: שְׁנַיִם וּשְׁלֹשִׁים נָפֶשׁ
  choice: 三十二人
  rationale: נֶפֶשׁ 再次作为人的计数单位，现代汉语用量词“人”最自然。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；“雅威”以现代汉语常见音译保留其专名性质，不改为称号。
- issue: נֶפֶשׁ 在人口清单中的含义
  choice: 人口／人
  alternative: 灵魂；性命
  rationale: 本节是在统计作为战利品分配的人数，נֶפֶשׁ 指一个个活人，并非专论人与身体有别的“灵魂”；因此避免引入原文在此没有强调的形而上含义。
translation_notes:
  register: 采用现代、庄重而清楚的清单式表述；以分号衔接总数与归给雅威的份额。“人口”适合行政统计语境，“三十二人”则符合现代汉语计数习惯。
