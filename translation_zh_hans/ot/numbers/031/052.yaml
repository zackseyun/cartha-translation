  text: וַ/יְהִ֣י כָּל זְהַ֣ב הַ/תְּרוּמָ֗ה אֲשֶׁ֤ר הֵרִ֨ימוּ֙ לַֽ/יהוָ֔ה שִׁשָּׁ֨ה עָשָׂ֥ר אֶ֛לֶף שְׁבַע מֵא֥וֹת וַ/חֲמִשִּׁ֖ים שָׁ֑קֶל מֵ/אֵת֙ שָׂרֵ֣י הָֽ/אֲלָפִ֔ים וּ/מֵ/אֵ֖ת שָׂרֵ֥י הַ/מֵּאֽוֹת׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/052.yaml
  text: And all the gold of the contribution that they presented to Yahweh was sixteen thousand seven hundred and fifty shekels[a], from the commanders of the thousands and from the commanders of the hundreds.
translation:
  language: zh_hans
  text: 献给雅威的捐献之金[a]，共计一万六千七百五十舍客勒，都是千夫长和百夫长所献的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“奉献之礼”；传统也译“举祭”。希伯来语指分别出来献给雅威的礼物。
    reason: 说明תְּרוּמָה的可选译法及礼仪含义，避免“捐献”被理解为一般性的慈善捐赠。
lexical_decisions:
- source_word: וַיְהִי כָּל זְהַב
  choice: ……之金，共计
  rationale: וַיְהִי在这里引出总数；汉语用“共计”自然表达统计结果。כָּל表示全部总量，不必生硬译成“所有的”。
- source_word: הַתְּרוּמָה
  choice: 捐献
  rationale: 该词指分别出来献作神圣用途的贡献；“捐献”既符合战利品奉献的语境，也比传统但不透明的礼仪术语更易懂。
- source_word: אֲשֶׁר הֵרִימוּ לַיהוָה
  choice: 献给雅威的
  rationale: רום的使役式在此表示把财物分别出来奉献，并非单纯向上举起；“献给”简明保留奉献方向。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以音译呈现四字神名，保留经文所用的盟约之名，而不以称号替代。
- source_word: שִׁשָּׁה עָשָׂר אֶלֶף שְׁבַע מֵאוֹת וַחֲמִשִּׁים שָׁקֶל
  choice: 一万六千七百五十舍客勒
  rationale: 按原文数值直译；“舍客勒”是重量单位，在此用于称量黄金。
- source_word: מֵאֵת שָׂרֵי הָאֲלָפִים וּמֵאֵת שָׂרֵי הַמֵּאוֹת
  choice: 都是千夫长和百夫长所献的
  rationale: מֵאֵת标明来源；“千夫长、百夫长”是现代中文圣经语体中清楚而简洁的军事职衔表达。句末“所献的”自然说明这些黄金来自他们。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名；“雅威”较贴近通行的学术复原读音，并保留专名性质，不以“主”这一称号消解它。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。为符合汉语信息结构，将总数用“共计”引出，并把来源表述为“都是……所献的”；不增添原文没有的解释。
