base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/003.yaml
  text: So Moses spoke to the people, saying, “Arm men from among you for the army, and let them go against Midian to execute Yahweh’s vengeance on Midian.”
translation:
  language: zh_hans
  text: 摩西对百姓说：“你们要从你们中间选派一些人，整装参战，攻打米甸，向米甸施行耶和华的复仇[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“为耶和华施行复仇。”希伯来语可指属于耶和华的复仇，也可指为耶和华而施行的复仇。
    reason: 原文属格结构可有不同理解，不宜在正文中默默排除另一种读法。
lexical_decisions:
- source_word: וַיְדַבֵּר מֹשֶׁה אֶל־הָעָם לֵאמֹר
  choice: 摩西对百姓说
  rationale: 采用自然的希伯来叙事引语格式；“百姓”准确指受摩西吩咐的以色列群体。
- source_word: הֵחָלְצוּ מֵאִתְּכֶם אֲנָשִׁים לַצָּבָא
  choice: 你们要从中间派人整装出战
  rationale: הֵחָלְצוּ在军事语境中表示装备、预备投入战斗；“整装出战”兼顾军事含义和现代汉语的自然表达。“派人”体现从群体中抽调男子参战，但不额外指定人数。
- source_word: וְיִהְיוּ עַל־מִדְיָן
  choice: 攻打米甸
  rationale: היה על在敌对军事语境中表示对付、进攻某方；汉语直译为“在米甸之上”无法传意，“攻打米甸”清楚呈现其语境意义。
- source_word: לָתֵת נִקְמַת
  choice: 施行……的复仇
  rationale: לָתֵת与נִקְמַת连用，意为实行或施加复仇；“施行……的复仇”保留名词结构和原文的严厉语气。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代简体中文圣经语境中对四字神名最通行、易懂的音译。
- source_word: בְּמִדְיָן
  choice: 向米甸
  rationale: 介词בְּ在此标明复仇所针对的对象；“向米甸”符合现代汉语搭配。
theological_decisions:
- issue: נִקְמַת יְהוָה中属格关系的理解
  choice: 耶和华的复仇
  alternative: 为耶和华复仇
  rationale: 正文保留希伯来语组合结构可能表达的归属或发起关系，不把它完全限定为“替耶和华复仇”；脚注说明另一种成立的理解，以保存原文的神学张力。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“整装出战”比生硬的“武装一些人归于军队”更自然，同时保留军事动员之意；不淡化“复仇”一词，也不增添对战争的神学解释。
