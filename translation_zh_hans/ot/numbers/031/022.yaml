  text: אַ֥ךְ אֶת הַ/זָּהָ֖ב וְ/אֶת הַ/כָּ֑סֶף אֶֽת הַ/נְּחֹ֨שֶׁת֙ אֶת הַ/בַּרְזֶ֔ל אֶֽת הַ/בְּדִ֖יל וְ/אֶת הָ/עֹפָֽרֶת־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/022.yaml
  text: Only the gold[a], the silver, the bronze, the iron, the tin, and the lead—
translation:
  language: zh_hans
  text: 只有金、银、铜[a]、铁、锡和铅——
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“青铜”。希伯来语这个词可泛指铜或以铜为主要成分的金属。
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: 只有
  rationale: 此处引出对前文规定的限定或例外；“只有”自然表明下列金属属于另行处理的一类。
- source_word: הַזָּהָב
  choice: 金
  rationale: זָהָב在此指金这种金属；现代汉语列举金属时无需表达希伯来语定冠词。
- source_word: הַכָּסֶף
  choice: 银
  rationale: 上下文列举需要洁净的金属，因此כֶּסֶף在此指“银”，不是“钱”。
- source_word: הַנְּחֹשֶׁת
  choice: 铜
  rationale: נְחֹשֶׁת可泛指铜或铜合金；汉语“铜”既自然，又能保留其较宽泛的指称，具体为青铜的可能性以脚注说明。
- source_word: הַבַּרְזֶל
  choice: 铁
  rationale: בַּרְזֶל的常规对应词。
- source_word: הַבְּדִיל
  choice: 锡
  rationale: בְּדִיל在金属清单中通常指锡，比泛称“合金”更准确。
- source_word: הָעֹפָרֶת
  choice: 铅
  rationale: עֹפָרֶת的常规对应词。
- source_word: אֵת（各名词前重复出现）
  choice: 不单独译出
  rationale: 这是希伯来语直接宾语标记；其重复使清单结构鲜明，汉语以并列和标点自然呈现。
