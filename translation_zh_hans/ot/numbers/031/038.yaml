  yaml_path: translation/ot/numbers/031/038.yaml
  text: And the cattle were thirty-six thousand, and their tribute for the LORD was seventy-two.
translation:
  language: zh_hans
  text: 牛共有三万六千头，其中归给耶和华的贡物是七十二头。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַבָּקָר
  choice: 牛
  rationale: בָּקָר在此战利品清单中统指牛类牲畜；现代汉语用“牛”自然简洁，并以量词“头”表明计数。
- source_word: שִׁשָּׁה וּשְׁלֹשִׁים אָלֶף
  choice: 三万六千头
  rationale: 按现代汉语数词顺序表达希伯来文的“三十六千”，并补出适合牲畜的量词。
- source_word: מִכְסָם
  choice: 从中征作……的份额
  rationale: מֶכֶס指从战利品中按规定抽取的部分；此译既保留“征取”的含义，也清楚说明它是指定份额，避免现代“税款”可能造成的货币联想。
- source_word: לַיהוָה
  choice: 献给耶和华
  rationale: 介词ל表示归给或指定给；结合本段献纳语境，译作“献给”。יהוה采用中文圣经传统且公众熟悉的专名“耶和华”。
- source_word: שְׁנַיִם וְשִׁבְעִים
  choice: 七十二头
  rationale: 依现代汉语习惯调整希伯来文“二又七十”的顺序，并补出量词，使所指数目明确。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。简体中文正文采用读者广泛熟悉、具有专名功能的“耶和华”；“雅威”更接近学术界常见的拟音，但古代确切读音并非完全可证。
- issue: לַיהוָה所表达的归属与献纳关系
  choice: 献给耶和华
  alternative: 归耶和华
  rationale: ל本身可表示归属或指定对象；本章上下文是从战利品中抽取贡份，因此“献给”自然呈现实际用途，同时没有改变该份额归属耶和华的核心意思。
translation_notes:
  register: 采用现代、庄重而易懂的清单式叙述。“共有”承接统计语境；后半句适度展开紧缩的希伯来句法，以“从中征作……的份额”说明מִכְסָם与总数的关系。
