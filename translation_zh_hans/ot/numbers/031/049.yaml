base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/049.yaml
  text: And they said to Moses[a], “Your servants have taken a count of the men of war who are under our command[b], and not one man of us is missing.”
translation:
  language: zh_hans
  text: 他们对摩西说：“你的仆人已经清点[a]了我们所统领[b]的战士，其中没有少一个人。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “清点”原文直译为“抬起……的头”，是希伯来语中清点或统计人数的惯用说法。
    reason: lexical_alternative
  - marker: b
    text: 或译“由我们负责”。原文直译为“在我们手中”。
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲבָדֶיךָ
  choice: 你的仆人
  rationale: 这里是军官对摩西的谦恭自称；译作“仆人”既保留从属语气，也不刻意引入奴隶身份的含义。
- source_word: נָשְׂאוּ אֶת־רֹאשׁ
  choice: 清点
  rationale: 该短语字面为“抬起……的头”，在行政和军事语境中是点数、统计人数的惯用语；“清点”自然传达这里的含义。
- source_word: אַנְשֵׁי הַמִּלְחָמָה
  choice: 作战男子
  rationale: 原文明确指参与作战的男性；“作战男子”保留性别信息和军事语境，避免将其泛化为所有人员。
- source_word: אֲשֶׁר בְּיָדֵנוּ
  choice: 我们所掌管
  rationale: 原文直译为“在我们手中”，这里表示这些士兵处于军官的管理和权责之下；“所掌管”保留责任与权柄两方面的含义。
- source_word: וְלֹא נִפְקַד מִמֶּנּוּ אִישׁ
  choice: 我们中一个也没有少
  rationale: נִפְקַד 在点名或清点的语境中表示缺少、未到或未被计入；此译法自然表达全员无缺，同时不把原因限定为阵亡或失踪。
theological_decisions: []
