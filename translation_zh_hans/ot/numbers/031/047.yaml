id: NUM.31.47
reference: Numbers 31:47
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יִּקַּ֨ח מֹשֶׁ֜ה מִ/מַּחֲצִ֣ת בְּנֵֽי יִשְׂרָאֵ֗ל אֶת הָֽ/אָחֻז֙ אֶחָ֣ד מִן הַ/חֲמִשִּׁ֔ים מִן הָ/אָדָ֖ם וּ/מִן הַ/בְּהֵמָ֑ה וַ/יִּתֵּ֨ן אֹתָ֜/ם לַ/לְוִיִּ֗ם שֹֽׁמְרֵי֙ מִשְׁמֶ֨רֶת֙ מִשְׁכַּ֣ן יְהוָ֔ה כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/047.yaml
  text: From the half belonging to the sons of Israel[a], Moses took one portion out of fifty, from the people and from the livestock, and gave them to the Levites who kept charge of the tabernacle of Yahweh[b], just as Yahweh had commanded Moses.
translation:
  language: zh_hans
  text: 摩西从分给以色列人[a]的那一半中，无论人口还是牲畜，每五十取一个，把这些交给负责看守雅威帐幕的利未人，正如雅威吩咐摩西的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来原文直译为“以色列的众子”，即以色列人。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִמַּחֲצִת בְּנֵי יִשְׂרָאֵל
  choice: 从分给以色列人的那一半中
  rationale: מַחֲצִית 指分配战利品所得的一半；结合上下文补出“分给”，能自然表达该构造所指的归属，同时以“以色列人”传达 בְּנֵי יִשְׂרָאֵל 的群体含义。
- source_word: הָאָחֻז אֶחָד מִן הַחֲמִשִּׁים
  choice: 每五十取一个
  rationale: אָחֻז 在这里指被抽取、征收的份额；整句规定五十分之一的比例。“每五十取一个”既保留抽取动作，也符合现代汉语表达。
- source_word: מִן הָאָדָם וּמִן הַבְּהֵמָה
  choice: 无论人口还是牲畜
  rationale: אָדָם 在此集合性地指战俘人口，בְּהֵמָה 指家畜。“无论……还是……”清楚表明五十分之一的比例同时适用于两类。
- source_word: וַיִּתֵּן אֹתָם
  choice: 把这些交给
  rationale: 希伯来语代词为复数，回指从人口和牲畜中取出的对象。汉语用“这些”可自然涵盖人和牲畜，避免只适用于人的“他们”。
- source_word: שֹׁמְרֵי מִשְׁמֶרֶת מִשְׁכַּן יְהוָה
  choice: 负责看守雅威帐幕的
  rationale: 同根词 שֹׁמְרֵי מִשְׁמֶרֶת 强调承担看守、守护职责；“负责看守”自然保留其职分含义。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语中常见的音译呈现四字神名，保留其作为专名的性质，不以称号代替。
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: 正如雅威吩咐摩西的
  rationale: כַּאֲשֶׁר 表明摩西的行动完全依照先前命令；“正如……的”符合汉语叙事习惯。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名。译作“雅威”以音译方式保留专名，并避免将其改换为“主”等称号；“耶和华”是传统汉语音译，但较少反映学界通常重构的读音。
- issue: בְּנֵי יִשְׂרָאֵל 的群体表达
  choice: 以色列人
  alternative: 以色列的众子
  rationale: 该短语在这里指分得战利品一半的以色列群体，并非特意限定男性后裔。“以色列人”准确而自然；脚注保留其字面形式。
- issue: 战利品中人口的表述
  choice: 人口
  alternative: 人
  rationale: 原文 אָדָם 集合性地涵盖作为战利品计算的人。采用“人口”不淡化经文将人列入分配对象所造成的伦理与神学张力，也不额外解释其身份。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“每五十取一个”简洁呈现征收比例；“把这些交给”自然统摄人口与牲畜。保留原文将人口与牲畜并列的表达，不作伦理性缓和或扩释。
