base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/006.yaml
  text: So Moses sent them to the war[a], a thousand from each tribe, them and Phinehas son of Eleazar the priest, to the war[b], with the holy vessels and the trumpets for the battle cry in his hand.
translation:
  language: zh_hans
  text: 于是，摩西把他们派去作战，每支派一千人。他派这些人和祭司以利亚撒的儿子非尼哈一同出征；非尼哈手中拿着圣器[a]和用于发出战斗信号的号筒[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“圣所的器具”或“神圣的器具”。
    reason: כְּלֵי הַקֹּדֶשׁ可指圣器，也可理解为圣所的器具。
  - marker: b
    text: 或译“吹响警报的号筒”或“发信号的号筒”。
    reason: תְּרוּעָה可指战斗号声、警报声或其他响亮的集合信号。
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: 派去
  rationale: 在军事叙事中自然表达“差遣、派出”，同时保留摩西主动差派的意思。
- source_word: אֶלֶף לַמַּטֶּה
  choice: 每支派一千人
  rationale: לַמַּטֶּה在这里具有分配意义，说明各支派各出一千人。
- source_word: לַצָּבָא
  choice: 去作战／一同出征
  rationale: צָבָא在本节指军事行动或服役，并非仅指作为组织的“军队”；根据两处句法分别采用自然的现代汉语表达。
- source_word: אֹתָם ... אֹתָם
  choice: 他们……这些人
  rationale: 保留原文重复所形成的强调和同位关系，同时避免现代汉语中生硬的连续重复。
- source_word: פִּינְחָס בֶּן אֶלְעָזָר הַכֹּהֵן
  choice: 祭司以利亚撒的儿子非尼哈
  rationale: 按希伯来语句法，הַכֹּהֵן更自然地修饰以利亚撒；此译法也符合上下文中以利亚撒的祭司身份。
- source_word: וּכְלֵי הַקֹּדֶשׁ
  choice: 圣物
  rationale: כְּלֵי可指器具、物件，הַקֹּדֶשׁ可表达神圣属性或与圣所有关；“圣物”简洁保留一定歧义，脚注列出更具体的可能译法。
- source_word: וַחֲצֹצְרוֹת הַתְּרוּעָה
  choice: 吹响战斗信号的号筒
  rationale: חֲצֹצְרוֹת指号筒，תְּרוּעָה指高声吹出的信号、警报或战时号声；军旅语境支持“战斗信号”，而不把它限定为人的呐喊。
- source_word: בְּיָדוֹ
  choice: 非尼哈手里带着
  rationale: 单数代词最自然地回指最近的单数人物非尼哈；“手里带着”保留原文意象，也符合现代汉语习惯。
theological_decisions:
- issue: 非尼哈及圣物在军事行动中的作用
  choice: 呈现非尼哈随军出征，并携带圣物和用于战斗信号的号筒
  alternative: 把非尼哈仅视为旁观者，或进一步把本节扩展为完整的“圣战”教义陈述
  rationale: 原文明说非尼哈、圣物和号筒随军，但没有进一步界定他的全部职责或阐述相关神学体系，因此译文只保留经文明确呈现的祭司与军事行动之间的联系。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“派去作战／一同出征”避免直译成不自然的“到战争去”；分号使原文较长的并列结构清楚易读。脚注标记[a]、[b]均紧随其所说明的词语。
