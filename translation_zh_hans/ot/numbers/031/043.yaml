  yaml_path: translation/ot/numbers/031/043.yaml
  text: And the half belonging to the congregation, from the flock, was 337,500.
translation:
  language: zh_hans
  text: 会众所得的那一半羊群，共有337,500只。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתְּהִי
  choice: 共有
  rationale: 此处的叙事形式用于说明清点所得的总数；“共有”符合现代汉语列举数量时的自然表达。
- source_word: מֶחֱצַת הָעֵדָה
  choice: 会众所得的那一半
  rationale: מֶחֱצַת是“半份”的构造形式，后接“会众”；结合上文的分配语境，译为“会众所得的那一半”，既表达所属关系，也保留所指的确定性。
- source_word: הָעֵדָה
  choice: 会众
  rationale: עֵדָה指以色列的共同体或集会群体；“会众”简洁、庄重，也不必然带入后期教会制度含义。
- source_word: מִן הַצֹּאן
  choice: 羊群
  rationale: צֹאן是绵羊和山羊等小型牲畜的集合称谓。此处按类别统计，译作“羊群”自然简明；量词“只”明确其为牲畜数量。
- source_word: שְׁלֹשׁ מֵאוֹת אֶלֶף וּשְׁלֹשִׁים אֶלֶף שִׁבְעַת אֲלָפִים וַחֲמֵשׁ מֵאוֹת
  choice: 337,500只
  rationale: 原文数字合计为300,000＋30,000＋7,000＋500。使用阿拉伯数字便于现代读者准确辨认，并完整保留原数值。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而自然的清点用语；语序调整为“羊群共有……只”，避免生硬直译，同时保留会众所得半份与牲畜总数之间的关系。
