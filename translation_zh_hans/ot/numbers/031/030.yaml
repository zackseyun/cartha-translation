  text: וּ/מִ/מַּחֲצִ֨ת בְּנֵֽי יִשְׂרָאֵ֜ל תִּקַּ֣ח אֶחָ֣ד אָחֻ֣ז מִן הַ/חֲמִשִּׁ֗ים מִן הָ/אָדָ֧ם מִן הַ/בָּקָ֛ר מִן הַ/חֲמֹרִ֥ים וּ/מִן הַ/צֹּ֖אן מִ/כָּל הַ/בְּהֵמָ֑ה וְ/נָתַתָּ֤ה אֹתָ/ם֙ לַ/לְוִיִּ֔ם שֹׁמְרֵ֕י מִשְׁמֶ֖רֶת מִשְׁכַּ֥ן יְהוָֽה־׀׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/030.yaml
  text: And from the half belonging to the sons of Israel you shall take one taken from every fifty[a], from the man, from the cattle, from the donkeys, and from the flock, from every kind of livestock[b]; and you shall give them to the Levites who keep charge of the tabernacle of Yahweh.
translation:
  language: zh_hans
  text: 至于以色列人所得的那一半，你要从人和各类牲畜——包括牛、驴和羊群[a]——中，每五十取一个[b]，交给负责看守耶和华帐幕的利未人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “羊群”所译的原文是集合名词，可包括绵羊和山羊。
    reason: lexical_alternative
  - marker: b
    text: 直译作“从五十中取一个”，即每五十取一。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִמַּחֲצִת בְּנֵי יִשְׂרָאֵל
  choice: 至于以色列人的那一半
  rationale: מַחֲצִית指分得的一半；这里承接前文两半战利品的分配。“以色列人的那一半”自然表达该份额的归属，同时保留“那一半”的指称关系。
- source_word: אֶחָד אָחֻז מִן הַחֲמִשִּׁים
  choice: 每五十取一个
  rationale: 该短语规定五十分之一的征取比例。用“取”体现אָחֻז所含的被取出之意，并以简洁自然的汉语表达计数方式。
- source_word: מִן הָאָדָם
  choice: 从人
  rationale: אָדָם在此为集合用法，指战利品中的人口。“人”既保留原文措辞，也避免把其误归入后面的牲畜类别。
- source_word: מִן הַבָּקָר מִן הַחֲמֹרִים וּמִן הַצֹּאן מִכָּל הַבְּהֵמָה
  choice: 以及牛、驴、羊群等各类牲畜中
  rationale: 分别对应牛、驴和צֹאן所指的小型畜群；“各类牲畜”概括בְּהֵמָה在本清单中的总类意义。“以及”把人口与牲畜明确区分。
- source_word: שֹׁמְרֵי מִשְׁמֶרֶת מִשְׁכַּן
  choice: 负责看守……帐幕
  rationale: 同根结构שֹׁמְרֵי מִשְׁמֶרֶת强调履行受托的守护职责；“负责看守”兼顾职责和守护两层含义，且符合现代汉语。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名，而非称号。“耶和华”在现代汉语圣经语境中是广为人知的专名形式，保留其作为立约之神名字的功能；“雅威”是更贴近学术重建读音的可行译法。
translation_notes:
  register: 采用现代、庄重而易懂的法律指令语体。“每五十取一个”简洁呈现征取比例；通过“从人，以及……牲畜中”避免让读者误以为“人”属于“牲畜”这一总类。
