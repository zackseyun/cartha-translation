  text: וּ/מִֽ/מַּחֲצִ֖ית בְּנֵ֣י יִשְׂרָאֵ֑ל אֲשֶׁר֙ חָצָ֣ה מֹשֶׁ֔ה מִן הָ/אֲנָשִׁ֖ים הַ/צֹּבְאִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/042.yaml
  text: And from the half belonging to the sons of Israel[a], which Moses had separated from the men who served in the army—
translation:
  language: zh_hans
  text: 至于以色列人的那一半，就是摩西从出征的男人[a]那里分出来的——
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“服军役的男人”或“参战的男人”。
    reason: הַצֹּבְאִים可侧重服军役、出征或实际参战；正文采用符合上下文且自然的“出征”。
lexical_decisions:
- source_word: וּמִמַּחֲצִית
  choice: 至于……那一半
  rationale: 介词与连接词引出接续上文的新一项；“那一半”自然表达战利品被分成两半后所得的份额。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 这是现代汉语中对该群体的标准称呼；此处指全体以色列会众所得的一半，并非刻意限定男性后裔。
- source_word: אֲשֶׁר חָצָה מֹשֶׁה
  choice: 就是摩西……分出来的
  rationale: 关系从句修饰“那一半”；חָצָה在分配战利品的语境中表示划分、分出。
- source_word: מִן הָאֲנָשִׁים הַצֹּבְאִים
  choice: 从出征的男人那里
  rationale: אֲנָשִׁים明确指男人；הַצֹּבְאִים是צבא的分词，表示参与军役或出征的人。“从……那里”保留这一半与出征者所得份额分开的关系。
