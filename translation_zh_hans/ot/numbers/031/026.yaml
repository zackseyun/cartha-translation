  yaml_path: translation/ot/numbers/031/026.yaml
  text: Take a count of the plunder that was taken[c][b][a], both of man and of beast—you and Eleazar the priest and the heads of the fathers’ houses of the congregation.
translation:
  language: zh_hans
  text: “你、祭司以利亚撒和会众各宗族的首领，要清点所掳来的战利品[a]，包括人和牲畜。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “所掳来的战利品”也可译作“掳获的人和财物”。希伯来语所指的是战争中掳获的一切，本节说明其中包括人和牲畜。
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂא אֵת רֹאשׁ
  choice: 清点
  rationale: 这是表示统计数目的习语；译为“清点”自然准确，避免直译为“抬起头”。
- source_word: מַלְקוֹחַ הַשְּׁבִי
  choice: 所掳来的战利品
  rationale: 该组合指战争中掳获之物，下文明确包括人和牲畜；“战利品”在现代汉语中清楚自然，而“所掳来的”保留其被俘获、掳取的含义。
- source_word: בָּאָדָם
  choice: 人口
  rationale: אָדָם在此与牲畜相对，泛指人；在清点语境中，“人口”简洁自然，不限定性别。
- source_word: וּבַבְּהֵמָה
  choice: 牲畜
  rationale: בְּהֵמָה在本段战利品语境中主要指家畜；译作“牲畜”比泛称“动物”更贴切。
- source_word: אַתָּה
  choice: 你
  rationale: 原文显明使用第二人称单数，强调摩西也参与清点；中文将“你”置于联合主语之首以保留这一点。
- source_word: אֶלְעָזָר הַכֹּהֵן
  choice: 祭司以利亚撒
  rationale: 按自然汉语次序将职衔置于人名前。
- source_word: רָאשֵׁי אֲבוֹת הָעֵדָה
  choice: 会众各宗族的首领
  rationale: 该短语指会众中父系家族单位的领袖；“各宗族的首领”既保留社会结构，也比生硬的“父家首领”更易懂。
