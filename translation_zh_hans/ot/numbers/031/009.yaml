  rationale: 修订仅解决所有格指向的实质性问题：以“米甸人”明确涵盖原文所指的整体群体，避免“她们”造成范围缩窄。将“幼儿”调整为“孩子”，因为“米甸的妇女和孩子”在汉语中更自然，且不把孩子限定为所提妇女的幼儿；仍保留טַף所指的未成年、幼小群体这一概括性表达。其余词汇与句法维持原意和庄重的现代经文语体。
