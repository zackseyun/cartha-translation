  text: וַ/יִּשְׁבּ֧וּ בְנֵי יִשְׂרָאֵ֛ל אֶת נְשֵׁ֥י מִדְיָ֖ן וְ/אֶת טַפָּ֑/ם וְ/אֵ֨ת כָּל בְּהֶמְתָּ֧/ם וְ/אֶת כָּל מִקְנֵ/הֶ֛ם וְ/אֶת כָּל חֵילָ֖/ם בָּזָֽזוּ־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/009.yaml
  text: The sons of Israel took captive the women of Midian and their little ones[a], and plundered all their livestock, all their herds[c][b], and all their wealth.
translation:
  language: zh_hans
  text: 以色列人俘虏了米甸的妇女和孩子，又掳掠了米甸人所有的牲畜、所有的畜群和一切财物。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁבּוּ
  choice: 俘虏了
  rationale: שׁבה 的 Qal 在此专指把人掳作俘虏；“俘虏了”自然、明确，并与后文掳掠财物的 בָּזָזוּ 区分。
- source_word: בְנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 该希伯来习语在现代汉语中通常且自然地指以色列民族成员；直译“以色列的儿子们”容易被误解为雅各的亲生儿子。
- source_word: נְשֵׁי מִדְיָן
  choice: 米甸的妇女
  rationale: נָשִׁים 在本语境泛指妇女，并非特指妻子；保留原文所属结构。
- source_word: טַפָּם
  choice: 她们的幼儿
  rationale: טַף 指年幼的孩子或幼小者；“幼儿”保留年龄较小的语义，并按最近的复数先行词“妇女”处理代词。
- source_word: בְּהֶמְתָּם
  choice: 她们所有的牲畜
  rationale: בְּהֵמָה 集合用法指家畜；“牲畜”符合战争掳掠的语境。
- source_word: מִקְנֵהֶם
  choice: 所有的畜群
  rationale: מִקְנֶה 常指所拥有的牛羊牲口或畜群；“畜群”既保留牧业含义，也与前面的总称“牲畜”有所区别。
- source_word: חֵילָם
  choice: 一切财物
  rationale: חַיִל 在此列于人口和牲畜之后，最自然地表示物质资产或财物，而非军队或能力。
- source_word: בָּזָזוּ
  choice: 掳掠了
  rationale: בזז 指战胜后夺取战利品；“掳掠”保留战争语境，并能统摄牲畜、畜群和财物。
theological_decisions:
- issue: בְנֵי יִשְׂרָאֵל 的民族称谓表达
  choice: 以色列人
  alternative: 以色列的众子／以色列的子孙
  rationale: 此处没有必须由男性形式承载的神学论点。“以色列人”准确表达民族主体，且避免现代读者误以为仅指雅各的亲生儿子。
- issue: 第三人称复数所有格的指向
  choice: 她们的幼儿、她们所有的牲畜
  alternative: 他们的幼儿、他们所有的牲畜
  rationale: 希伯来语阳性复数后缀可回指米甸这一群体，也可在句法上随整体所有关系理解。汉语采用“她们”使其自然承接刚提到的“米甸的妇女”，但不改变这些人和财物属于米甸群体的含义。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“俘虏”用于人，“掳掠”用于战利品，以反映两个不同的希伯来动词。保留“牲畜／畜群／财物”的三项并列，不把近义项擅自合并。
