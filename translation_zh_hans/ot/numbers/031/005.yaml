base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/005.yaml
  text: 'So from the thousands of Israel[b][a], a thousand from each tribe were assigned: twelve thousand armed for war.'
translation:
  language: zh_hans
  text: 于是，从以色列的千人中[a]，每支派各有一千人被选派[b]，共一万二千名武装出战的人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “以色列的千人”也可指以色列较大的宗族或军队编制，而不只指数字上的“千人”。
    reason: lexical_alternative
  - marker: b
    text: “被选派”也可译作“被交付”“被提供”或“被征调”；希伯来语动词可指为服役而提供或指派人员。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמָּסְרוּ
  choice: 交出
  rationale: 该动词为尼法勒形态，表示这些人从以色列中被交付、提供出来参加战事。中文以主动式“每支派交出”更自然，同时保留“交出、交付”的基本语义；脚注说明也可理解为征调或选派。
- source_word: מֵאַלְפֵי יִשְׂרָאֵל
  choice: 从以色列的千人单位中
  rationale: אַלְפֵי 字面为“千”，在部族或军事语境中也可指以千人为名的宗族或编制单位。“千人单位”既保留数字关联，又呈现组织层面的可能含义。
- source_word: אֶלֶף לַמַּטֶּה
  choice: 每支派……一千人
  rationale: 介词结构在上下文中具有分配意义，表示各支派分别提供一千人。
- source_word: שְׁנֵים עָשָׂר אֶלֶף
  choice: 共一万二千名
  rationale: 准确表达十二个一千人的总数，并以“共”清楚呈现总结关系。
- source_word: חֲלוּצֵי צָבָא
  choice: 武装出战的人
  rationale: חֲלוּצֵי 指装备好、列队准备行动者，צָבָא 指军旅或战争；此译兼顾武装状态与出战用途。
