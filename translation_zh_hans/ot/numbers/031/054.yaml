base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/054.yaml
  text: So Moses and Eleazar the priest took the gold from the commanders of thousands and of hundreds[a], and they brought it into the tent of meeting as a memorial for the sons of Israel before Yahweh.
translation:
  language: zh_hans
  text: 摩西和祭司以利亚撒从千夫长和百夫长手中收下金子，把金子带进会幕，作为以色列子孙[a]在雅威面前的纪念。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“以色列人”。希伯来语直译为“以色列的众子”，这是对以色列圣约群体的惯用称呼。
    reason: 说明惯用群体称谓的字面形式及较自然的替代译法。
lexical_decisions:
- source_word: וַיִּקַּח
  choice: 收下
  rationale: לקח的基本义为“拿、取”；本处金子由军官交出，译作“收下”既符合来源关系，也比“拿走”更自然。
- source_word: הַזָּהָב
  choice: 金子
  rationale: 指上文所述已经献出的特定金器和金饰；现代汉语不必另用定冠词。
- source_word: מֵאֵת
  choice: 从……手中
  rationale: 表示金子的来源；“从……手中”自然保留了希伯来语的来源含义。
- source_word: שָׂרֵי הָאֲלָפִים וְהַמֵּאוֹת
  choice: 千夫长和百夫长
  rationale: 此处שׂרים是军事首领；“千夫长、百夫长”是简明而通行的汉语军事称谓，所指为相应的军事编制。
- source_word: אֹהֶל מוֹעֵד
  choice: 会幕
  rationale: 这是该圣所名称在现代中文圣经语境中自然、通行且简洁的表达。
- source_word: זִכָּרוֹן
  choice: 纪念
  rationale: 保留该词作为纪念物或纪念凭据的礼仪性含义，不缩减为主观的“提醒”。
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: 以色列子孙
  rationale: 较贴近字面并保留其族裔及圣约群体称谓；脚注提供更惯用的“以色列人”。
- source_word: לִפְנֵי יְהוָה
  choice: 在雅威面前
  rationale: 保留礼仪语境中处于雅威面前、在其临在中的意义。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以通行的汉语音译呈现四字神名，保留其作为专名的性质，而不以称号代替。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”较接近学界通常重构的读音，并明确保留神名而非用“主”替代。
- issue: בני ישראל的群体称谓
  choice: 以色列子孙
  alternative: 以色列人
  rationale: 正文保留希伯来语传统圣约群体称谓的形式，同时以脚注说明自然的现代汉语替代译法；不把该短语限定为仅指成年男性。
- issue: זִכָּרוֹן所表达的纪念关系
  choice: 作为以色列子孙在雅威面前的纪念
  alternative: 在雅威面前作为以色列子孙的纪念物
  rationale: 原文简洁，未进一步说明是使雅威记念以色列、使以色列记念此事，还是作为代表他们的纪念凭据；译文保留这种关系上的含蓄。
translation_notes:
  register: 采用现代、庄重而易懂的叙事体。“会幕”“千夫长和百夫长”沿用读者熟悉的中文宗教及军事用语；句式尽量简洁，并保留原文“纪念”一语的神学含蓄。
