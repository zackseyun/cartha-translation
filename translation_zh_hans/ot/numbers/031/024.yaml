base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/024.yaml
  text: You shall wash your clothes on the seventh day[a], and you shall be clean[b]; afterward you may come into the camp.
translation:
  language: zh_hans
  text: 第七天，你们要洗涤衣服，你们就洁净了[a]；之后，你们才可以进入营地[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你们就得以洁净。”这里指按规定洗涤后，在礼仪上成为洁净。
    reason: lexical_alternative
  - marker: b
    text: 直译：“之后，你们要进入营地。”上下文表明，洁净完成后才获准进入。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִבַּסְתֶּם
  choice: 你们要洗净
  rationale: כּבס 的 Piel 形式特指洗涤衣物；“要洗净”既体现指令语气，也自然表达洗涤的目的。
- source_word: בִּגְדֵיכֶם
  choice: 衣服
  rationale: בגד 指衣物；“衣服”是现代普通话中自然、准确的表达。
- source_word: בַּיּוֹם הַשְּׁבִיעִי
  choice: 第七天
  rationale: 准确保留希伯来文的时间表达，并符合现代汉语习惯。
- source_word: וּטְהַרְתֶּם
  choice: 这样就洁净了
  rationale: טהר 的 Qal 形式在此侧重礼仪状态上的结果，即经过规定的洗涤后成为洁净；“这样就洁净了”保留结果性，避免误解为道德或内在的净化。
- source_word: וְאַחַר
  choice: 之后
  rationale: 简明表达洁净完成后才发生的下一步。
- source_word: תָּבֹאוּ אֶל הַמַּחֲנֶה
  choice: 你们才可以进入营地
  rationale: בוא אל 可指进入；在礼仪洁净的上下文中，这句话表示洁净完成后获准重新进入营地。“才可以”清楚体现这一许可和先后条件。
theological_decisions:
- issue: 礼仪洁净用语
  choice: 洁净了
  alternative: 得以洁净／洁净自己
  rationale: 本节所说的是战争之后礼仪上从不洁恢复为洁净。“洁净了”保留希伯来文所强调的状态和结果，不把它扩大为道德或属灵层面的净化，也不把该动词过度处理为反身动作。
- issue: 进入营地的语气
  choice: 才可以进入营地
  alternative: 然后要进入营地／然后进入营地
  rationale: 希伯来文形式本身可直译为“你们要进入”，但本段礼仪规定的语境表明，重点是洁净完成后才获准进入；正文表达这一语境含义，脚注保留较直译的可能。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。“洁净”保留民数记礼仪语境中的关键概念；“营地”比“营”更明确，也易于普通读者理解。两个脚注标记均紧接其所说明的短语。
