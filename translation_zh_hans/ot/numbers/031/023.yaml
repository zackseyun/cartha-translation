id: NUM.31.23
reference: Numbers 31:23
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כָּל דָּבָ֞ר אֲשֶׁר יָבֹ֣א בָ/אֵ֗שׁ תַּעֲבִ֤ירוּ בָ/אֵשׁ֙ וְ/טָהֵ֔ר אַ֕ךְ בְּ/מֵ֥י נִדָּ֖ה יִתְחַטָּ֑א וְ/כֹ֨ל אֲשֶׁ֧ר לֹֽא יָבֹ֛א בָּ/אֵ֖שׁ תַּעֲבִ֥ירוּ בַ/מָּֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/023.yaml
  text: Everything that can go through the fire[a], you shall pass through the fire, and it shall be clean; only it must be purified with the water for impurity. But everything that cannot go through the fire, you shall pass through the water.
translation:
  language: zh_hans
  text: 凡能经火的物件，都要使它经火，就洁净了；不过，还必须用除污秽的水洁净[a]。凡不能经火的，都要使它经过水。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “除污秽的水”也可直译为“污秽之水”；传统译法作“除秽水”或“分别之水”。参民数记19章。
    reason: 说明希伯来语מֵי נִדָּה的结构歧义及传统译法，同时交代其礼仪背景。
lexical_decisions:
- source_word: כָּל דָּבָר
  choice: 凡……的物件
  rationale: 在战利品清洁条例的语境中，指每一件具体物品；“物件”比抽象的“东西”更准确，也适合庄重的法规文体。
- source_word: אֲשֶׁר יָבֹא בָאֵשׁ
  choice: 能经火的
  rationale: 此处按语境表达物件可耐受火处理，而不只是事实上进入火中；简洁保留了希伯来语意象。
- source_word: תַּעֲבִירוּ בָאֵשׁ
  choice: 都要使它经火
  rationale: 保留עבר使役形的“使……经过”意义，并与后文“使它经过水”形成对应。
- source_word: וְטָהֵר
  choice: 就洁净了
  rationale: 表达经火之后达到洁净状态，而不把后一句另有要求的洁净程序并入本词。
- source_word: אַךְ
  choice: 不过
  rationale: 自然表达对前句的限制和补充：经火虽使之洁净，仍须按规定用水洁净。
- source_word: בְּמֵי נִדָּה
  choice: 用除污秽的水
  rationale: 结合民数记19章，指用于除去礼仪性污秽的特定水；避免把נִדָּה误解为水本身污秽，也不采用现代汉语不透明的“分别之水”。
- source_word: יִתְחַטָּא
  choice: 还必须……洁净
  rationale: 在祭司法规语境中表示接受除污秽的洁净处理；“必须”清楚传达此处的规定性，避免理解为道德意义上的赦罪。
- source_word: וְכֹל אֲשֶׁר לֹא יָבֹא בָּאֵשׁ
  choice: 凡不能经火的
  rationale: 与上半句形成实际分类，指不适宜接受火处理的物件。
- source_word: תַּעֲבִירוּ בַמָּיִם
  choice: 都要使它经过水
  rationale: 保留与“使它经火”相同的使役动词和平行结构，而不将原文具体化为单纯“洗”。
theological_decisions:
- issue: 祭司法规中洁净用语的性质
  choice: 按礼仪性洁净与污秽来表达
  alternative: 将יִתְחַטָּא译为与道德罪责相关的“除罪”或“赎罪”
  rationale: 本节及民数记19章讨论接触污秽后物件所需的礼仪洁净，不是在陈述道德罪责得赦；译文因此使用“污秽”和“洁净”，不加入原文没有提出的教义含义。
- issue: 经火洁净与水洁净的关系
  choice: 保留“经火后洁净，却仍必须用水洁净”的张力
  alternative: 将水理解为只适用于不能经火的物件，或把两种程序合并成一个步骤
  rationale: 原文先说经火之物“洁净”，随后以אַךְ加以限定，规定仍须用特定的水洁净；译文不消解这一法规层面的并列要求。
translation_notes:
  register: 采用现代、庄重而易懂的法规语体。“经火”简练保留原文意象，“使它经过水”则维持上下句的动词平行。脚注标记[a]已置于对应短语之后。
