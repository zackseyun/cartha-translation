  source_fidelity: 译文准确保留了法规的两组平行指令：可经火之物须经火，且仍须以特定的水行洁净；不可经火之物则须经过水。“能／不能经火”恰当地按语境表达物件是否适于火处理，而非仅指实际是否进入火中。“都要使它经火／经过水”也反映了希伯来语使役式的平行。对יִתְחַטָּא按礼仪洁净处理，没有误作道德性的除罪或赦罪。
