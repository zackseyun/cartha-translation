base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/039.yaml
  text: The donkeys were 30,500[a], and their tribute to Yahweh was 61.
translation:
  language: zh_hans
  text: 驴有三万零五百头；从中归给雅威的贡物[a]是六十一头。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“征收的份额”。希伯来词指从战利品中按规定抽出、归给雅威的那一份。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַחֲמֹרִים
  choice: 驴有
  rationale: חֲמֹרִים是“驴”的普通复数形式；句首连接词在连续清单中用分号和承接句式自然体现。
- source_word: שְׁלֹשִׁים אֶלֶף וַחֲמֵשׁ מֵאוֹת
  choice: 三万零五百
  rationale: 准确表达希伯来文的总数，并采用现代汉语数字读法。
- source_word: וּמִכְסָם
  choice: 从中……的贡物[a]
  rationale: מֶכֶס在本段指从战利品中按规定抽取、归给雅威的份额。“贡物”简洁表达必须交纳并献出的性质；“从中”明确其取自上述总数。
- source_word: לַיהוָה
  choice: 归给雅威
  rationale: 介词ל表示这份额的归属或交付对象；“归给”兼顾二者。专名יהוה音译为“雅威”，保留经文中的神圣名字。
- source_word: אֶחָד וְשִׁשִּׁים
  choice: 六十一头
  rationale: 按原文准确译出数目；补入现代汉语计数牲畜常用的量词“头”，使表达自然。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；“雅威”以通行的现代汉语音译保留其专名性质，不以称号替代。
- issue: מֶכֶס在献给雅威的语境中的含义
  choice: 贡物
  alternative: 征收的份额；税项
  rationale: 上下文所指是从战利品中按规定抽出、归给雅威的一份，并非一般民政税收。“贡物”保留其强制分配和奉献归属，同时不额外规定具体礼仪性质。
translation_notes:
  register: 采用现代、庄重而易懂的清单式表述。牲畜数量补用量词“头”；以分号承接前后两项统计。脚注标记放在其实际解释的“贡物”之后，而不是总数之后。
