  text: Then Yahweh spoke to Moses[a], saying,
translation:
  language: zh_hans
  text: 耶和华对摩西说[a]：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “耶和华”也可译作“雅威”。原文采用常见的叙事引语公式，直译近似“耶和华对摩西说，说”。
    reason: 说明神名的音译选择，并交代 לֵאמֹר 在汉语中由冒号体现。
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: 这是推进叙事的常用言说公式；汉语直接译作“说”自然简洁，句首无需机械加入“然后”或“又”。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的专名“耶和华”对应四字神名，保留其作为名称而非称号的性质。
- source_word: אֶל־מֹשֶׁה
  choice: 对摩西
  rationale: 准确表达言说所指向的对象，符合现代汉语习惯。
- source_word: לֵאמֹר
  choice: 以冒号表示
  rationale: 该不定式用于引出下一节的话语内容；现代汉语用冒号即可自然表达这一功能，避免累赘的“说”。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用以色列神的专名。正文采用中文传统且广为人知的音译“耶和华”，不以“主”这一称号替代；脚注提示另一种较贴近学界重构读音的译法。
translation_notes:
  register: 采用简洁、庄重的现代标准汉语。保留神的专名，以冒号自然衔接下一节的直接引语；脚注标记已置于正文相关位置。
