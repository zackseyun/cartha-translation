  to: 你要从出征作战的人那里，为雅威征取一份贡物：从人、牛、驴和羊群中，每五百取一[a]。
  rationale: 修订删除了原文未明说的“所得的份”，恢复本节对征取对象的直接表述；将并列项目全数以“和”连接；并将有关 נֶפֶשׁ 的说明置于相应计数短语处。译文仍保留法规性、庄重而现代的语体，也不把该词解释为具形上含义的“灵魂”。
