base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/028.yaml
  text: 'And you shall levy a tribute for Yahweh from the men of war who went out to battle: one out of five hundred[b][a], from the people and from the cattle and from the donkeys and from the flock.'
translation:
  language: zh_hans
  text: 你要从出征作战的人那里，为雅威征取一份贡物：从人、牛、驴和羊群中，每五百取一[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “每五百取一”直译为“一个生命，出自五百”。希伯来语“生命”（nephesh）在这里用作人和牲畜的计数单位，指一个活着的个体。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַהֲרֵמֹתָ מֶכֶס
  choice: 抽取贡物献给
  rationale: הרים 的使役式在此指从战利品中提取、分别出来；מֶכֶס 是按规定征取的一份。“抽取贡物献给”既表达征取，也说明其归属。
- source_word: לַיהוָה
  choice: 献给雅威
  rationale: 介词 ל 表明贡物归给神；יהוה 作为神的专名译作“雅威”。
- source_word: מֵאֵת אַנְשֵׁי הַמִּלְחָמָה הַיֹּצְאִים לַצָּבָא
  choice: 从出战的战士所得的份中
  rationale: 本节与上下文的战利品分配相连，贡物是从参战者所得之份中提取；此译使汉语关系清楚，同时保留“出战者”的限定。
- source_word: אֶחָד נֶפֶשׁ מֵחֲמֵשׁ הַמֵּאוֹת
  choice: 每五百个活物取一个
  rationale: נֶפֶשׁ 在这里是人和牲畜均可使用的活体计数语。“活物”保留其跨越人畜的范围，避免把它误解成非物质的“灵魂”。
- source_word: מִן הָאָדָם
  choice: 人口
  rationale: אָדָם 在此指战利品中的人，与后列牲畜相对；“人口”适合清单式计数语境。
- source_word: וּמִן הַבָּקָר וּמִן הַחֲמֹרִים וּמִן הַצֹּאן
  choice: 牛、驴或羊群
  rationale: 分别对应 cattle、donkeys 和作为集合名词的 small livestock；צֹאן 可包括绵羊和山羊，因此保留较宽泛的“羊群”。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”较贴近学界通常重构的读音，并保留其专名性质。
- issue: נֶפֶשׁ 是否译为“灵魂”
  choice: 活物
  alternative: 个
  rationale: 该词在这里同时统摄人和牲畜，是活体的计数表达；译作“灵魂”容易引入原文此处并未强调的身心二分观念，而只译“个”又会完全隐去该词。
translation_notes:
  register: 采用现代、庄重而清楚的叙事法规语体。“每五百个活物取一个”保留原文人畜共用的计数方式；脚注解释其希伯来语特点。
