  text: וְ/נֶ֣פֶשׁ אָדָ֔ם מִן הַ֨/נָּשִׁ֔ים אֲשֶׁ֥ר לֹֽא יָדְע֖וּ מִשְׁכַּ֣ב זָכָ֑ר כָּל נֶ֕פֶשׁ שְׁנַ֥יִם וּ/שְׁלֹשִׁ֖ים אָֽלֶף־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/035.yaml
  text: And the persons from the women who had not known the bed of a male[a], all the persons, were thirty-two thousand.
translation:
  language: zh_hans
  text: 从妇女中，那些未曾与男人同房的[a]，共计三万二千人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“未曾知道男人的床榻”，是指未曾与男人发生性关系。
    reason: 说明源文的委婉习语及其字面形式。
lexical_decisions:
- source_word: נֶפֶשׁ אָדָם
  choice: 人
  rationale: 此处指人，与上下文所数的牲畜相区别；现代汉语用“人”自然、准确，无须生硬译作“人的性命”或“人类个体”。
- source_word: מִן הַנָּשִׁים
  choice: 从妇女中
  rationale: 保留介词所表达的从被掳妇女群体中划分出这一组的意思。
- source_word: אֲשֶׁר לֹא יָדְעוּ מִשְׁכַּב זָכָר
  choice: 那些未曾与男人同房的
  rationale: 源语直译近似“未曾知道男人的床榻”，是指未与男性发生性关系的委婉说法。“与男人同房”在现代中文圣经语体中既自然庄重，也保留其委婉性质。
- source_word: כָּל נֶפֶשׁ
  choice: 共计……人
  rationale: 该短语在这里总结这一群体的总人数；译作“共计”符合现代汉语计数表达，并避免逐字翻译造成重复。
- source_word: שְׁנַיִם וּשְׁלֹשִׁים אָלֶף
  choice: 三万二千
  rationale: 按现代汉语数字习惯准确表达三十二千。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事与统计语体。“同房”避免露骨，也不以现代技术性术语取代希伯来文的委婉表达；“共计”自然呈现原文重复使用 נֶפֶשׁ 所具有的汇总功能。
