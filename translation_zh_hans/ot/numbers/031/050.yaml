  to: 因此，我们把献给耶和华的供物带来了：各人所得到的金器——臂环[a]、手镯、戒指、耳环和饰物[b]——为要在耶和华面前为我们自己[c]赎罪。
  rationale: 仅作两项安全修订：将[c]移至“我们自己”之后，使脚注锚点准确对应 נַפְשֹׁתֵינוּ；并消除“带来／献上”的轻微重复，使金器清单直接说明所带来的供物。未改变原文的献呈、逐一分配、金制物品或赎罪含义。
