  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/נַּקְרֵ֞ב אֶת קָרְבַּ֣ן יְהוָ֗ה אִישׁ֩ אֲשֶׁ֨ר מָצָ֤א כְלִֽי זָהָב֙ אֶצְעָדָ֣ה וְ/צָמִ֔יד טַבַּ֖עַת עָגִ֣יל וְ/כוּמָ֑ז לְ/כַפֵּ֥ר עַל נַפְשֹׁתֵ֖י/נוּ לִ/פְנֵ֥י יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/050.yaml
  text: 'So we have brought near Yahweh’s offering: each man what he found—articles of gold[a], armlets and bracelets, rings, earrings[c][b], and pendants—to make atonement for ourselves before Yahweh.'
translation:
  language: zh_hans
  text: 因此，我们把献给耶和华的供物带来了：各人所得到的金器——臂环[a]、手镯、戒指、耳环和饰物[b]——为要在耶和华面前为我们自己[c]赎罪。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “臂环”也可能指“脚环”。
    reason: lexical_alternative
  - marker: b
    text: “饰物”所对应的希伯来词确切含义不明，也可能指项链、坠饰或鼻环。
    reason: lexical_alternative
  - marker: c
    text: 直译：“为我们的性命（或：我们这些人）赎罪”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַנַּקְרֵב
  choice: 所以，我们……带来了
  rationale: 使役词形本义为“使靠近、带近”，在献祭语境中指把供物带来献上；“所以”承接前文叙事。
- source_word: קָרְבַּן יְהוָה
  choice: 献给耶和华的供物
  rationale: קָרְבָּן是带近、呈献之物；属格结构可表示归属或受献对象。译作“献给耶和华的供物”在中文中自然，并保留献祭意味。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的神圣名字译法，而不以“主”这一称号替代专名。
- source_word: אִישׁ אֲשֶׁר מָצָא
  choice: 各人把自己所得的
  rationale: אִישׁ在这里具有逐一分配的意义，所指为上下文中的男性军人；“各人”自然表达这一作用。מָצָא直译为“找到”，在战利品语境中译作“所得”更合乎现代汉语。
- source_word: כְלִי זָהָב
  choice: 金器
  rationale: כְלִי是广义的器物或物件；后列各种首饰，因此“金器”既简洁，也不把词义过早限定为某一类珠宝。
- source_word: אֶצְעָדָה
  choice: 臂环
  rationale: 指戴在肢体上的环饰，具体部位并不完全确定；正文采用常见的“臂环”，脚注保留“脚环”的可能。
- source_word: צָמִיד
  choice: 手镯
  rationale: 通常指戴在手腕或手臂上的环状饰物；“手镯”是清楚自然的现代中文表达。
- source_word: טַבַּעַת
  choice: 戒指
  rationale: 该词可指环或戒指，虽有时是印戒，但本节并未明确要求“印戒”，故采用较宽泛的“戒指”。
- source_word: עָגִיל
  choice: 耳环
  rationale: 在饰物清单中通常指耳饰，译作“耳环”可与前面的戒指清楚区分。
- source_word: כוּמָז
  choice: 饰物
  rationale: 具体所指不确定，可能是项链、坠饰或鼻环等；正文采用不作过度断定的上位词，脚注列出主要可能。
- source_word: לְכַפֵּר
  choice: 赎罪
  rationale: כפר在礼仪和献祭语境中带有遮盖、赎罪的神学分量；“赎罪”是现代中文中凝练且为普通读者熟悉的对应语。
- source_word: עַל נַפְשֹׁתֵינוּ
  choice: 为我们自己
  rationale: 字面为“为我们的性命／人身”；这里表示为他们本人赎罪，避免译成“灵魂”而引入原文没有表达的身灵二分。
theological_decisions:
- issue: 这份供物与כפר的关系
  choice: 保留“赎罪”用语，表明供物与众人在耶和华面前得赎有关
  alternative: 只将其解释为感恩礼物，或译成非礼仪性的“消灾”
  rationale: 经文明用כפר，又称礼物为קָרְבַּן，并说是在耶和华面前，因此不应淡化其礼仪和赎罪意味；同时，译文不进一步规定赎罪如何生效。
- issue: אִישׁ的性别与分配意义
  choice: 各人
  alternative: 每个人／每一位士兵
  rationale: 上下文所指是男性军人，但现代中文“各人”在该语境中自然地逐一指向他们，无须另加原文未明说的身份名词。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“把……带来了”保留“带近供物”的动作感，“就是”引出金器的具体清单。脚注标记均放在对应词语之后；未沿用英文咨询层中位置明显错乱的脚注标记。
