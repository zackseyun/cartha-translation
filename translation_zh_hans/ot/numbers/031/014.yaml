  source_fidelity: “归来的”虽合叙事语境，却比原文“来的／前来”的分词更明确地加入了返程方向；“从战场服役归来”在中文中搭配不当，也未清楚表达“从战事的军役（或军事行动）而来”。修订以“从战事中回来的”自然表达上下文所指，同时以脚注保留“军役”的词义范围。
  naturalness: 原句“从战场服役归来”不符合现代汉语的通常搭配；改为“从战事中回来的”流畅、庄重。删除“就是那些”后，同位结构更简洁自然。
  terminology: “军队的长官”“千夫长”“百夫长”“发怒”均适切。“官长”可较自然地统括后面的千夫长和百夫长，并保留其军事领导身份。
  issues:
