base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/014.yaml
  text: And Moses was angry with the officers of the army[a], the commanders of thousands and the commanders of hundreds, who were coming from the service of the war.
translation:
  language: zh_hans
  text: 摩西向军队的官长，就是从战事中回来的千夫长和百夫长发怒。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְצֹף
  choice: 发怒
  rationale: קצף表示生气、震怒；“发怒”自然庄重，又不把程度强化为“暴怒”或“大发雷霆”。
- source_word: פְּקוּדֵי הֶחָיִל
  choice: 军队的长官
  rationale: פְּקוּדֵי源于פקד，在此指军队中受任并负有管理、指挥责任的人；“军队的长官”兼顾任职和军事语境。
- source_word: שָׂרֵי הָאֲלָפִים
  choice: 千夫长
  rationale: 这是按“千”编制的军事首领；“千夫长”是现代中文读者能够理解且简洁的传统军事称谓。
- source_word: וְשָׂרֵי הַמֵּאוֹת
  choice: 百夫长
  rationale: 与“千夫长”平行，保留希伯来文按人数划分的军队组织层级。
- source_word: הַבָּאִים
  choice: 归来的
  rationale: 分词本义是“来的”；结合介词מִן“从……”及出征后的叙事场景，中文用“归来的”自然表达他们从战事中回来，但此方向性包含语境解释。
- source_word: מִצְּבָא הַמִּלְחָמָה
  choice: 从战场服役
  rationale: צָבָא可指军队、服役或军事行动，מִלְחָמָה指战争、战事；“从战场服役”保留军事服役与战争行动两层含义，避免只译作“战场”而丢失צָבָא的语义。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“就是”说明“千夫长和百夫长”是前述“军队的长官”的同位语；保留“千夫长、百夫长”以呈现原文的军事编制。
