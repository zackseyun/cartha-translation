revisions:
- from: 摩西向军队的长官[a]，就是那些从战场服役归来的千夫长和百夫长发怒。
  to: 摩西向军队的官长，就是从战事中回来的千夫长和百夫长发怒。
  rationale: 将不自然且含混的“从战场服役归来”改为“从战事中回来的”，使中文符合现代用法，并以脚注交代צְבָא הַמִּלְחָמָה所含军事服役／军事行动的语义。正文保留军事层级和叙事语气，不作额外神学或历史解释。
