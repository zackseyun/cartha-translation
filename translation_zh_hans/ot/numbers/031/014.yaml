    rationale: “服役”通常不以“从战场”作直接起点；希伯来语短语指从战事相关的军事服役／军事行动而来。
  - severity: low
    issue: “归来的”将原文“来的”具体化为“返回”。
    rationale: 上下文确实是出征者回来，但原文分词本身只说“来的”。中文正文可按语境表达，脚注宜提示“军役”这一未完全展开的语义。
  revised_text: 摩西向军队的官长，就是从战事中回来的千夫长和百夫长发怒。
