  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/001.yaml
  text: Then Yahweh spoke to Moses[a], saying,
translation:
  language: zh_hans
  text: 耶和华[a]对摩西说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文为“YHWH”（四字神名）；中文传统译作“耶和华”，也有音译作“雅威”。
    reason: 说明神名的原文形式及可采用的不同音译。
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: 说
  rationale: 该叙事形式推进事件，直译可作“于是……讲话”。现代汉语在引出直接引语时用“对……说”最自然，也保留了发言动作；本节无需另加“于是”，以免在段落开头显得生硬。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 这是四字神名 YHWH。中文圣经传统普遍以“耶和华”作为专名译法，普通读者易于识别；脚注说明其希伯来文形式及其他音译。
- source_word: אֶל
  choice: 对
  rationale: 此处标明讲话对象；现代汉语固定表达为“对摩西说”。
- source_word: מֹשֶׁה
  choice: 摩西
  rationale: 采用现代中文圣经及通行用语中的标准人名译法。
- source_word: לֵאמֹר
  choice: 说：
  rationale: 该不定式用于引出随后直接引语。汉语以“说：”连同冒号自然表达这一功能，避免重复译成“说……说道”。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用神的专名而非称号。正文采用中文读者最熟悉且具有专名功能的“耶和华”，并用脚注保留 YHWH 的形式及“雅威”等音译可能，不将其改为“主”。
translation_notes:
  register: 采用简洁、庄重的现代标准汉语。“对摩西说：”符合中文叙事与引出直接引语的习惯；省略机械对应叙事连接词的“于是”，而次序关系由上下文自然体现。
