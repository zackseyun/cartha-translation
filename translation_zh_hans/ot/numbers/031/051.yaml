  rationale: 修订以“即所有”保留希伯来文中“金子”与“所有制作的器物”之间的同位说明，并以脚注保存集合性与逐件性两种可行的中文表达。将“从他们手中”改为“从他们那里”，避免添加原文未明示的“手”这一具体成分。
