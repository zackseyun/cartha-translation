base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/051.yaml
  text: So Moses and Eleazar the priest took the gold from them[a], every crafted article.
translation:
  language: zh_hans
  text: 于是，摩西和祭司以利亚撒从他们那里收下了金子，即所有加工制成的器物[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“每一件加工制成的器物。”
    reason: “כֹּל כְּלִי מַעֲשֶׂה”中的“所有”可按集合意义译为“所有……器物”，也可突出逐件涵盖的意思译为“每一件……器物”；两种译法都说明所收的金子是加工制成的物件。
lexical_decisions:
- source_word: וַיִּקַּח
  choice: 收下了
  rationale: לקח可指拿取或接收；本节语境是摩西和以利亚撒接收众军官交来的金子，因此“收下了”既符合叙事动作，也自然体现来源关系。
- source_word: מֹשֶׁה
  choice: 摩西
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: וְאֶלְעָזָר הַכֹּהֵן
  choice: 和祭司以利亚撒
  rationale: 保留人名及其职分；中文将职分置于姓名之前更自然。
- source_word: אֶת הַזָּהָב
  choice: 金子
  rationale: 指上下文中众军官献上的特定金器；中文在此不必机械加入指示限定词。
- source_word: מֵאִתָּם
  choice: 从他们手中
  rationale: 该介词结构表示来源；“从他们手中”既保持具体动作感，也符合现代汉语表达。
- source_word: כֹּל
  choice: 每一件
  rationale: כֹּל修饰单数集合性名词短语，可表达其中无一遗漏；“每一件”贴近这种逐件涵盖的语气。
- source_word: כְּלִי
  choice: 器物
  rationale: כְּלִי可泛指器具、物件或器皿；此处所指包括各类金制物品，“器物”比“器皿”范围更宽。
- source_word: מַעֲשֶׂה
  choice: 加工制成的
  rationale: 该词在构词关系中表示人工制作或工艺加工，说明这些是制成品，而不是未经加工的金料。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“也就是”明确后半句与“金子”构成同位说明，而不把它误读为另一项物品；同时用脚注保留希伯来语单数集合结构在“每一件”与“所有”之间的表达空间。
