reference: Numbers 31:16
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: הֵ֣ן הֵ֜נָּה הָי֨וּ לִ/בְנֵ֤י יִשְׂרָאֵל֙ בִּ/דְבַ֣ר בִּלְעָ֔ם לִ/מְסָר מַ֥עַל בַּ/יהוָ֖ה עַל דְּבַר פְּע֑וֹר וַ/תְּהִ֥י הַ/מַּגֵּפָ֖ה בַּ/עֲדַ֥ת יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/016.yaml
  text: Look[a], these women were the ones who, at Balaam’s word, caused the sons of Israel to act unfaithfully against Yahweh in the matter of Peor[b], and so the plague came upon the congregation of Yahweh.
translation:
  language: zh_hans
  text: “看哪，正是这些女人照着巴兰的话[a]，使以色列的子孙[b]在毗珥的事上对耶和华不忠，因此瘟疫临到耶和华的会众。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“听从巴兰的计谋”或“按巴兰的指点”。希伯来语直译为“照着巴兰的话”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来语直译为“以色列的众子”；这里指以色列民。
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן הֵנָּה
  choice: 看哪，正是这些女人
  rationale: “הֵן”带有引人注意和强调的语气，“הֵנָּה”是阴性复数；结合上下文明确译为“这些女人”，并用“正是”保留原文的强调。
- source_word: בִּדְבַר בִּלְעָם
  choice: 照着巴兰的话
  rationale: 原文直译为“凭着／按照巴兰的话”；此处可能指巴兰的指点或计谋。“照着巴兰的话”既保留“话”的字面联系，也不排除“建议、计谋”的语境含义。
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: 以色列的子孙
  rationale: 保留希伯来语“以色列之子”的表达，同时以脚注说明这里泛指以色列民。
- source_word: לִמְסָר מַעַל בַּיהוָה
  choice: 使……对耶和华不忠
  rationale: מַעַל表示失信、背信，常带有违背与上帝关系的含义；“对耶和华不忠”清楚而自然地表达这种关系性与盟约性的背叛。לִמְסָר在此表达这些女人促使以色列人陷入不忠。
- source_word: עַל דְּבַר פְּעוֹר
  choice: 在毗珥的事上
  rationale: 保留“关于毗珥之事”的事件指向，不把原文进一步解释为“巴力毗珥事件”。
- source_word: וַתְּהִי הַמַּגֵּפָה בַּעֲדַת יְהוָה
  choice: 因此瘟疫临到耶和华的会众
  rationale: “因此”表达叙事中的后果关系；“临到……会众”自然呈现瘟疫落在群体中的意思。
theological_decisions:
- issue: 神圣名号 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 采用现代中文读者最熟悉且直接作为专名使用的“耶和华”；不以“主”替代原文出现的神圣名号。
- issue: מַעַל 的关系性含义
  choice: 对耶和华不忠
  alternative: 得罪耶和华／干犯耶和华
  rationale: “不忠”保留该词所含的背信意味，又不把它缩减为一般性的犯罪；原文对行为细节并未在本节中进一步界定。
- issue: 是否明确 הֵנָּה 的女性所指
  choice: 这些女人
  alternative: 这些人／这些
  rationale: 该代词为阴性复数，且上下文明指米甸妇女；明确译出所指不会增加原文没有的信息。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“看哪”保留原文的强烈提示语气；“正是这些女人”传达双重强调。“会众”延续民数记中以色列群体的礼仪与共同体色彩。
