  yaml_path: translation/ot/numbers/031/013.yaml
  text: Then Moses[a], Eleazar the priest, and all the leaders of the congregation went out to meet them outside the camp.
translation:
  language: zh_hans
  text: 摩西、祭司以利亚撒和会众的所有首领都出到营外迎接他们。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּצְאוּ
  choice: 出营
  rationale: 该动词表示从里面向外出去；结合句末“营外”的目的地，译作“出营”自然简洁，也保留方向感。
- source_word: אֶלְעָזָר הַכֹּהֵן
  choice: 祭司以利亚撒
  rationale: 原文以职衔说明以利亚撒的身份；现代汉语将职衔置于姓名之前较为自然。
- source_word: כָל נְשִׂיאֵי הָעֵדָה
  choice: 会众的所有首领
  rationale: נְשִׂיאִים在此指群体中获承认的领袖，并非君王；הָעֵדָה指以色列会众。此译法准确且适合现代读者。
- source_word: לִקְרָאתָם
  choice: 迎接他们
  rationale: 该结构表示出去与他们相会的目的；“迎接”在此比直译“去见”更符合汉语叙事习惯。
- source_word: אֶל מִחוּץ לַמַּחֲנֶה
  choice: 出营
  rationale: 原文明确指出相会之处在营地之外。汉语以“出营迎接”自然表达出去到营外相迎，且不造成相会发生在营内的误解。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。原文没有需要以脚注保存的实质歧义；“首领”可涵盖其群体领袖之义，不必列出容易引发王室联想的“王子”等译法。
