  text: וַֽ/יִּצְבְּאוּ֙ עַל מִדְיָ֔ן כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶׁ֑ה וַ/יַּֽהַרְג֖וּ כָּל זָכָֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/007.yaml
  text: So they waged war against Midian[a], just as Yahweh had commanded Moses, and they killed every male.
translation:
  language: zh_hans
  text: 正如耶和华所吩咐摩西的那样，他们与米甸[a]交战，杀了所有男性。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们出兵攻击米甸。”这里的希伯来语动词可指服兵役、出征或从事战争。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּצְבְּאוּ
  choice: 出战
  rationale: 此处צָבָא的动词形式指参与军事行动或作战。“出战”在现代汉语中自然、庄重，并保留其军事行动之意。
- source_word: עַל
  choice: 攻击
  rationale: 与军事行动动词连用时，עַל表示敌对方向；汉语将其与“出战”组合为“出战攻击”，清楚表达针对米甸的敌对行动。
- source_word: מִדְיָן
  choice: 米甸
  rationale: 采用现代中文圣经传统中通行的专名译法。
- source_word: כַּאֲשֶׁר
  choice: 照着……的
  rationale: 表达军事行动与先前命令相符；此结构符合现代汉语叙事习惯。
- source_word: צִוָּה
  choice: 吩咐
  rationale: צוה表示发出命令；“吩咐”自然且庄重，适合上帝向摩西下令的语境。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代简体中文读者熟悉的传统音译呈现四字神名，而不以“主”这一称号替代。
- source_word: אֶת מֹשֶׁה
  choice: 摩西
  rationale: אֶת在此标明“摩西”为צוה的直接宾语，因此译为“吩咐摩西”，而不是“吩咐给摩西”。
- source_word: וַיַּהַרְגוּ
  choice: 杀了
  rationale: הרג直接表示杀死；“杀了”准确、简明，不采用古雅或弱化的措辞。
- source_word: כָּל
  choice: 所有
  rationale: 与集合意义的“男性”搭配时，“所有”自然地表达כָּל的全称范围。
- source_word: זָכָר
  choice: 男性
  rationale: זָכָר指雄性或男性，不限于成年男子；“男性”避免将原文范围缩窄为“男人”。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用四字神名而非称号。中文正文保留专名，并采用普通现代中文读者最熟悉的传统音译“耶和华”；不以“主”替代。
- issue: זָכָר所指范围
  choice: 男性
  alternative: 男人
  rationale: 原词按性别指称，并未限定为成年男子；译作“男性”保留原文可能涵盖不同年龄男性的范围，不自行缩窄。
- issue: 战争叙事中的全称表达
  choice: 杀了所有男性
  alternative: 杀了所有的男人
  rationale: 保留כָּל的完整范围和הרג的直接力度，不对叙述作伦理缓和，也不额外解释对象年龄。
translation_notes:
  register: 采用现代、庄重而直接的叙事语体。“照着……的”呈现行动与命令的一致；“出战攻击”兼顾צָבָא的军事行动含义及עַל的敌对方向。脚注保留“交战”这一合理词义选择。
