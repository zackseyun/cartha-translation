revisions:
- from: 他们把俘虏、掳获物和战利品带到摩西、祭司以利亚撒和以色列全会众那里，也就是带到摩押平原的营地；这平原在约旦河边，与耶利哥相对。[a]
  to: 他们把俘虏、掳获物和战利品带到摩西、祭司以利亚撒和以色列会众那里，也带到营地；营地在摩押平原，就是在约旦河边、耶利哥对岸。[a]
  rationale: 修订消除了“也就是”造成的句法和逻辑含混，删去原文未明说的“全”，并校正脚注对地理短语直译与解释性译法的区分。其余关键军事术语及地名均予保留。
  reviewer_model: gpt-5.6-terra
