base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/012.yaml
  text: And they brought the captives[a], the prey, and the spoil to Moses, to Eleazar the priest, and to the congregation of the sons of Israel, to the camp on the plains of Moab[c][b], which are by the Jordan at Jericho.
translation:
  language: zh_hans
  text: 他们把俘虏、掳获物和战利品带到摩西、祭司以利亚撒和以色列会众那里，也带到营地；营地在摩押平原，就是在约旦河边、耶利哥对岸。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “摩押平原”也可译作“摩押草原”。“在约旦河边、耶利哥对岸”也可译作“在耶利哥的约旦河边”。
    reason: 保留地貌名称及地理短语的译法选择；“耶利哥对岸”表达该地理位置的通常理解，不将其误称为逐字直译。
lexical_decisions:
- source_word: וַיָּבִאוּ
  choice: 他们把……带到
  rationale: בוא 的使役式在此表示“带来”；随后三个直接宾语也明确支持使役含义。
- source_word: הַשְּׁבִי
  choice: 俘虏
  rationale: 军事语境中指被俘的人，而非抽象的“被掳”状态。
- source_word: הַמַּלְקוֹחַ
  choice: 掳获物
  rationale: 指掳获所得，常包括牲畜及可移动财物；采用“掳获物”以便与后面的 שׁלל 区分。
- source_word: הַשָּׁלָל
  choice: 战利品
  rationale: 这是战争中所得财物的常用词；“战利品”自然清楚，也保留与 מלקוח 的措辞差异。
- source_word: עֲדַת בְּנֵי יִשְׂרָאֵל
  choice: 以色列全会众
  rationale: עֵדָה 指共同体或聚集的会众；“以色列全会众”符合现代中文表达，并传达 בְּנֵי יִשְׂרָאֵל 所指的以色列群体。
- source_word: אֶל הַמַּחֲנֶה
  choice: 带到……营地
  rationale: אֶל 表示移动的终点“到”，不额外断定已经进入营内。
- source_word: עַרְבֹת מוֹאָב
  choice: 摩押平原
  rationale: 这是该地理名称清楚且通行的中文表达；原词也可按地貌译为“摩押草原”。
- source_word: אֲשֶׁר עַל יַרְדֵּן יְרֵחוֹ
  choice: 这平原在约旦河边，与耶利哥相对
  rationale: 该短语按上下文说明摩押平原位于约旦河边、耶利哥对岸；“与耶利哥相对”比容易误解为同岸的“耶利哥附近”更准确。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事文体。以“掳获物”和“战利品”分别对应两个意义相近的希伯来词，避免在中文中合并；用“也就是”表明营地的位置，同时维持原句连续推进的结构。
