base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/031.yaml
  text: So Moses and Eleazar the priest did as Yahweh had commanded Moses[a].
translation:
  language: zh_hans
  text: 于是，摩西和祭司以利亚撒照雅威所吩咐摩西的去做了。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文：YHWH；传统中文译作“耶和华”。
    reason: 说明神名的原文形式及传统中文译法。
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: 就……做了
  rationale: עשה在这里概括二人执行前述命令；“照……做了”自然地表达遵命而行，并保留原文简洁措辞。
- source_word: מֹשֶׁה
  choice: 摩西
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: וְאֶלְעָזָר
  choice: 和……以利亚撒
  rationale: 保留并列连词，并采用通行的人名音译。
- source_word: הַכֹּהֵן
  choice: 祭司
  rationale: 作为同位称谓说明以利亚撒的职分；中文在专名之前不用冠词。
- source_word: כַּאֲשֶׁר
  choice: 照
  rationale: 表达行动与命令相符，比逐字译作“如同”更符合现代汉语习惯。
- source_word: צִוָּה
  choice: 吩咐
  rationale: 在上帝向人发布命令的语境中，“吩咐”庄重、自然，并准确表达命令之意。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文读者最熟悉的四字神名传统音译；脚注说明原文为YHWH，以透明呈现源文形式。
- source_word: אֶת מֹשֶׁה
  choice: 摩西
  rationale: אֶת是直接宾语标记，中文无需另译，只译专名。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。正文采用中文传统且广为人知的“耶和华”，不以“主”这一称号代替神名；脚注标明希伯来文形式YHWH，也让读者知道其源文依据。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“于是”承接上文命令，“就”突出随即遵行；语序保持清楚，不增添原文没有的解释。
