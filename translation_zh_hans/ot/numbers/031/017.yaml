    rationale: “因男性的躺卧而认识男人”在中文中难以理解，也把 לְ 的关系译成了不必要的因果。宜说明为“认识男人，就男性的同寝而言”，并指出这是性关系的习语。
  - severity: low
    issue: “所以现在”略显生硬。
    rationale: וְעַתָּה确有承接和转折作用，但中文以句首“现在”即可自然体现；不必强加“所以”。
  revised_text: 现在，要杀死孩童中所有的男孩；凡与男人发生过性关系的女人[a]，也都要杀死。
