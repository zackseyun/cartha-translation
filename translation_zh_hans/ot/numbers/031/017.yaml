revisions:
- from: 所以现在，要杀掉孩童中所有的男丁；凡与男人同过房的女人[a]，也都要杀掉。
  to: 现在，要杀死孩童中所有的男孩；凡与男人发生过性关系的女人[a]，也都要杀死。
  rationale: 修订使“孩童中的男性”在现代汉语中明确为“孩童中所有的男孩”，避免“男丁”的年龄歧义；以清楚、非委婉的现代用语传达性关系，同时在脚注保留原文的习语结构。两个命令仍保持直接、并列且严酷的表达，未加入任何历史或伦理解释。
