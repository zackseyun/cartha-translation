  text: וְ/עַתָּ֕ה הִרְג֥וּ כָל זָכָ֖ר בַּ/טָּ֑ף וְ/כָל אִשָּׁ֗ה יֹדַ֥עַת אִ֛ישׁ לְ/מִשְׁכַּ֥ב זָכָ֖ר הֲרֹֽגוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/017.yaml
  text: So now[a], kill every male among the little ones, and kill every woman who has known a man by lying with him.
translation:
  language: zh_hans
  text: 现在，要杀死孩童中所有的男孩；凡与男人发生过性关系的女人[a]，也都要杀死。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译作“认识男人，就男性的同寝而言”；这是指发生性关系的习语。
    reason: 说明“认识男人”及“男性的同寝”这一希伯来语结构的字面形式和习语含义。
lexical_decisions:
- source_word: וְעַתָּה
  choice: 所以现在
  rationale: 既保留וְ所承接的推论或过渡作用，也表达עַתָּה所指的当前行动；中文“所以现在”自然呈现紧接上文的命令。
- source_word: הִרְגוּ / הֲרֹגוּ
  choice: 杀掉
  rationale: 两个形式都来自הרג，均为直接而强烈的命令。“杀掉”是现代中文清楚、直截了当的对应，不以委婉语减弱原文力度。
- source_word: כָל זָכָר בַּטָּף
  choice: 孩童中所有的男丁
  rationale: זָכָר指男性，בַּטָּף限定其属于孩童或年幼者。“男丁”保留性别所指，“孩童中”保留该限定，避免只译成泛称“孩子”。
- source_word: כָל אִשָּׁה
  choice: 凡……的女人
  rationale: אִשָּׁה在此泛指女人，并非特指妻子；“凡……的女人”自然表达כָל的全称范围。
- source_word: יֹדַעַת אִישׁ לְמִשְׁכַּב זָכָר
  choice: 与男人同过房
  rationale: 这是指性关系的希伯来语表达。“同过房”以自然、庄重的现代中文传达实际含义，同时由脚注保留原文较为具体的字面结构。
theological_decisions:
- issue: 如何翻译这一严酷的战争命令而不加以淡化或扩释
  choice: 直接保留杀戮命令的力度与对象范围
  alternative: 使用“处死”等较委婉措辞，或在正文中加入历史、伦理解释
  rationale: 原文以直接命令陈述行动；译文不应减弱其严酷性，也不应把原文未明说的辩护、解释或道德评断加入正文。
- issue: 性关系表达是保留字面习语还是直接传达含义
  choice: 正文采用自然中文“与男人同过房”，脚注说明原文结构
  alternative: 正文直译为“因男性的躺卧而认识男人”
  rationale: 逐词直译在中文中晦涩且可能误解；正文清楚传达语义，脚注则保留原文措辞及其习语性质，不额外限定婚姻身份或其他背景。
translation_notes:
  register: 采用现代、庄重而直接的普通话。“杀掉”保留原命令的强度；分号清楚呈现两个并列命令。“男丁”在此与“孩童中”连用，明确指年幼者中的男性，而不把זָכָר擅自收窄为某一更具体年龄。
