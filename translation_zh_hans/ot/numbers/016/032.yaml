base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/032.yaml
  text: and the earth opened its mouth and swallowed them[a], their households, all the people who belonged to Korah[b], and all their possessions.
translation:
  language: zh_hans
  text: 地就张开口，把他们和他们的家眷[a]，以及所有属可拉的人[b]和一切财物，都吞了下去。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “家眷”或译“房屋”。原文既可指实体房屋，也可由“家”引申指一家的人。
    reason: lexical_alternative
  - marker: b
    text: “所有属可拉的人”也可译作“所有与可拉一伙的人”。原文的“人”采用单数集合用法。
    reason: alternative_reading
lexical_decisions:
- source_word: וַתִּפְתַּח הָאָרֶץ אֶת־פִּיהָ
  choice: 地就张开口
  rationale: 保留原文“地张开自己的口”这一拟人化意象；中文无需明说“它的”，仍能自然、准确地表达领属关系。
- source_word: וַתִּבְלַע
  choice: 吞了下去
  rationale: 直接对应 בלע“吞咽、吞下”，并以现代汉语常用趋向补语表现动作的完整性。
- source_word: בָּתֵּיהֶם
  choice: 他们的家眷
  rationale: 该词字面可指“他们的房屋”，也可借“家”指家庭成员；上下文中的审判对象包括人，因此正文采用自然明确的“家眷”，并在脚注保留实体房屋的可能。
- source_word: כָּל־הָאָדָם אֲשֶׁר לְקֹרַח
  choice: 所有属可拉的人
  rationale: אָדָם 在此为单数集合用法，宜译作“人”；介词 לְ 表示归属或关联，正文用“属可拉的”，脚注保留“与可拉一伙”的关联性译法。
- source_word: כָּל־הָרֲכוּשׁ
  choice: 一切财物
  rationale: רְכוּשׁ 指财产、物品；“财物”简明自然，能涵盖其范围。
theological_decisions:
- issue: 集合用法 אָדָם 的性别与范围
  choice: 所有属可拉的人
  alternative: 每一个属可拉的男人
  rationale: 原文虽采用语法上的阳性单数形式，但 אָדָם 在 כָּל־הָאָדָם 中是集合表达，并不明确要求逐个强调男性。汉语“人”既保留集合意义，也不额外限定性别。
- issue: לְקֹרַח 所表达的关系
  choice: 属可拉的
  alternative: 与可拉一伙的／跟随可拉的
  rationale: 介词 לְ 可表达归属或关联。正文采用简洁且贴近形式的“属可拉的”，脚注说明较明确的结党或跟随关系也是可能理解，避免过度断定。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“张开口”和“吞了下去”保留希伯来文鲜明的拟人意象；列举结构用“以及”和停顿加以梳理，不改变原文各受审对象之间的关系。
