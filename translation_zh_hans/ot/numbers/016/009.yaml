source:
  edition: WLC
  text: הַ/מְעַ֣ט מִ/כֶּ֗ם כִּֽי הִבְדִּיל֩ אֱלֹהֵ֨י יִשְׂרָאֵ֤ל אֶתְ/כֶם֙ מֵ/עֲדַ֣ת יִשְׂרָאֵ֔ל לְ/הַקְרִ֥יב אֶתְ/כֶ֖ם אֵלָ֑י/ו לַ/עֲבֹ֗ד אֶת עֲבֹדַת֙ מִשְׁכַּ֣ן יְהוָ֔ה וְ/לַ/עֲמֹ֛ד לִ/פְנֵ֥י הָ/עֵדָ֖ה לְ/שָׁרְתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/009.yaml
  text: Is it too small a thing for you that the God of Israel has separated you from the congregation of Israel[a], to bring you near to himself, to serve in the service of the tabernacle of Yahweh, and to stand before the congregation to minister to them?
translation:
  language: zh_hans
  text: 以色列的上帝把你们从以色列会众中分别出来，使你们亲近他，在雅威的帐幕中供职，又站在会众面前服侍他们；这难道是小事吗？[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“这对你们还不够吗？”希伯来语这一问法既可理解为“这难道是小事吗”，也可较意译地表达为“这还不够吗”。
    reason: 保留 הַמְעַט 这一希伯来语修辞问法的两种自然理解。
lexical_decisions:
- source_word: הַמְעַט
  choice: 难道你们以为这是小事吗
  rationale: 这是带责问意味的修辞问句，指出他们不该轻看已经领受的特权；中文以“难道……是小事吗”自然保留其反诘力度。
- source_word: הִבְדִּיל
  choice: 分别出来
  rationale: 使役形表达上帝使他们与以色列其余会众分开；“分别出来”既准确，也不额外限定为某种神学意义上的“分别为圣”。
- source_word: עֲדַת יִשְׂרָאֵל
  choice: 以色列会众
  rationale: עֵדָה指共同体或聚集的群体；“会众”兼顾群体和礼仪语境。
- source_word: לְהַקְרִיב אֶתְכֶם אֵלָיו
  choice: 使你们亲近他
  rationale: קרב的使役形在此以利未人为宾语，表达使他们来到上帝近前；译文保留关系和礼仪双重意味，不将其误解为献祭。
- source_word: לַעֲבֹד אֶת עֲבֹדַת מִשְׁכַּן יְהוָה
  choice: 办理雅威帐幕的事务
  rationale: 动词עבד与同根名词עֲבֹדָה强调承担帐幕的服役和工作；“办理……事务”在现代中文中庄重自然，并能涵盖礼仪职责与实际劳作。
- source_word: מִשְׁכַּן יְהוָה
  choice: 雅威帐幕
  rationale: מִשְׁכָּן在旷野叙事中指圣所帐幕；“帐幕”是准确且通行的中文表达。
- source_word: יְהוָה
  choice: 雅威
  rationale: 原文直接使用四字神名；以“雅威”音译，保留其作为以色列上帝专名的性质，不以头衔替代。
- source_word: וְלַעֲמֹד לִפְנֵי הָעֵדָה
  choice: 又站在会众面前
  rationale: 直译其代表性、职分性的站立姿态，中文自然且不作过度解释。
- source_word: לְשָׁרְתָם
  choice: 服侍他们
  rationale: שרת常指侍从或职分性的服务；“服侍”保留庄重和礼仪色彩，代词“他们”按语法回指会众。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 经文使用的是上帝的专名而非“主”这一头衔；“雅威”较直接地按学界通行拟音呈现该名，同时不把古代读音的重构说成绝对确定。
- issue: 利未人被带到上帝近前的含义
  choice: 使你们亲近他
  alternative: 把你们献到他面前
  rationale: 原文קרב可有礼仪背景，但本句宾语是利未人，未明确将他们称为祭物；译文保留亲近与礼仪准入的张力，不强化为献祭。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。句子依中文信息结构重排，将较长的“上帝把你们分别出来……”内容置于反诘句之前，使末尾责问有力而清楚；保留“会众”“帐幕”“服侍”等经文语域常用词，但避免生硬重复希伯来语同根词。
