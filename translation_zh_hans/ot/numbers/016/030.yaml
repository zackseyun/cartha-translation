id: NUM.16.30
reference: Numbers 16:30
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/אִם בְּרִיאָ֞ה יִבְרָ֣א יְהוָ֗ה וּ/פָצְתָ֨ה הָ/אֲדָמָ֤ה אֶת פִּ֨י/הָ֙ וּ/בָלְעָ֤ה אֹתָ/ם֙ וְ/אֶת כָּל אֲשֶׁ֣ר לָ/הֶ֔ם וְ/יָרְד֥וּ חַיִּ֖ים שְׁאֹ֑לָ/ה וִֽ/ידַעְתֶּ֕ם כִּ֧י נִֽאֲצ֛וּ הָ/אֲנָשִׁ֥ים הָ/אֵ֖לֶּה אֶת יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/030.yaml
  text: But if Yahweh creates something new[a], and the ground opens its mouth and swallows them and all that belongs to them, and they go down alive to Sheol[b], then you will know that these men have despised Yahweh.
translation:
  language: zh_hans
  text: 但耶和华若另创新事，地便张开口，把他们和一切属于他们的都吞下去；他们便活着下到阴间[a]，你们就知道，这些人藐视了耶和华。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “阴间”译自希伯来语“示奥尔”，指死人的领域；也可在较具体的意义上译作“坟墓”。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּרִיאָה יִבְרָא
  choice: 创出一件新事
  rationale: 希伯来文以同源名词和动词相连，形成强调性的表达。中文用“创出一件新事”既保留“创造”的词义和非凡、新异之意，也比直译为“创造一个创造”自然。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的神名译法，保留原文专名，而不以“主”这一称号替代。
- source_word: וּפָצְתָה הָאֲדָמָה אֶת־פִּיהָ
  choice: 使地张开口
  rationale: 保留原文把地拟人化为“张开口”的鲜明意象；在使役语境中用“使”自然衔接耶和华所创出的新事。
- source_word: וּבָלְעָה
  choice: 吞下去
  rationale: 直接表达 בלע 的“吞没、吞下”之义，并与“地张开口”的形象自然搭配。
- source_word: כָּל אֲשֶׁר לָהֶם
  choice: 一切属于他们的
  rationale: 保留短语的广泛范围，不擅自限定为财物、家属或其他某一类别。
- source_word: וְיָרְדוּ חַיִּים שְׁאֹלָה
  choice: 让他们活着下到阴间
  rationale: 保留“活着”这一反常而受强调的状态；“阴间”承载 שְׁאוֹל 作为死人领域的含义，又不将其缩窄为具体坟墓。
- source_word: וִידַעְתֶּם
  choice: 你们就知道
  rationale: “就”清楚表达条件句所得出的结果，符合现代汉语习惯。
- source_word: נִאֲצוּ
  choice: 藐视了
  rationale: “藐视”传达 נאץ 所含的轻蔑、蔑弃之意，同时保持庄重简洁。
- source_word: הָאֲנָשִׁים הָאֵלֶּה
  choice: 这些人
  rationale: 现代汉语“人”在此自然指向上下文中的男性，不必使用容易产生年龄或口语色彩的“男人”。
theological_decisions:
- issue: שְׁאוֹל 的译法
  choice: 阴间
  alternative: 坟墓；死人所在之地；音译“示奥尔”
  rationale: “阴间”在中文圣经语境中可指死人所在的领域，较“坟墓”更能保留 שְׁאוֹל 的宽广语义；脚注同时说明具体语境下也可理解为坟墓，避免过度界定其性质。
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威；上主
  rationale: 正文使用中文读者广泛熟悉的专名“耶和华”，明确它是神名而非称号；不据此引入关于其古代发音的确定判断。
- issue: בְּרִיאָה יִבְרָא 的强调结构
  choice: 创出一件新事
  alternative: 施行一件前所未有的事；创造一个创造
  rationale: 原文强调这是耶和华非同寻常的创造性作为，但并未系统界定其创造方式；译文保留“创”与“新事”，不额外导入创造论结论。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。句子保留条件—结果结构和“地张开口”的拟人意象；避免古奥措辞，也不把“阴间”的性质解释得超出本节原文。
