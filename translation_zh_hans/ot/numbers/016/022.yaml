base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/022.yaml
  text: Then they fell on their faces and said[a], “God, the God of the spirits of all flesh, shall one man sin[b], and will you be angry with the whole congregation?”
translation:
  language: zh_hans
  text: 他们就俯伏在地，说：“上帝，一切有血肉者之灵的上帝[a]，难道一人犯罪，你就要向全会众发怒吗？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可理解为“一切有血肉者的气息（或生命）之上帝”。“灵”也可强调上帝对各人内在生命的权柄与洞察。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְּלוּ עַל־פְּנֵיהֶם
  choice: 他们就俯伏在地
  rationale: 这是希伯来语表示谦卑、惊惧或代求的具体动作；“俯伏在地”在现代汉语中自然庄重，并保留脸伏于地的意象。
- source_word: אֵל
  choice: 上帝
  rationale: 此处是直接呼求；以标点和直接引语表达呼格，不额外加入原文没有的修饰语。
- source_word: אֱלֹהֵי הָרוּחֹת לְכָל־בָּשָׂר
  choice: 赐一切有血肉者灵的上帝
  rationale: “灵”保留 רוּחֹת 的复数及其指向生命或内在生命的开放性；“赐”使汉语所属结构更自然，也呼应上帝作为众生之灵来源的含义，但不排除其掌管并洞察各人之灵的语境意义。
- source_word: בָּשָׂר
  choice: 有血肉者
  rationale: 既保留“肉身/血肉”的希伯来表达，又比直译“一切肉体”更符合现代汉语，范围指一切属血肉的生命，此处尤其涉及全会众。
- source_word: הָאִישׁ אֶחָד
  choice: 一人
  rationale: 准确保留阳性单数和数词“一”；汉语“一人”简洁自然，也容许该人具有代表性这一语境含义。
- source_word: יֶחֱטָא
  choice: 犯罪
  rationale: 保留动词的基本意义，不在正文中过度限定时态或情态；反问结构由整句体现。
- source_word: וְעַל כָּל־הָעֵדָה
  choice: 向全会众
  rationale: עַל 标示怒气所针对的对象；“向……发怒”是自然汉语，“全会众”保留以色列共同体语境。
- source_word: תִּקְצֹף
  choice: 发怒
  rationale: 清楚表达神的震怒，同时避免使用过度强化或古奥的措辞。
theological_decisions:
- issue: “一切有血肉者的灵”的人论含义
  choice: 正文译作“赐一切有血肉者灵的上帝”，兼顾上帝是生命之灵的赐予者，并保留他掌管、洞察各人内在生命的含义。
  alternative: “一切有血肉者之灵的上帝”，较形式对应，并更突出上帝对各人之灵的权柄与认识。
  rationale: רוּחֹת 可指诸灵，也可关联气息与生命；上下文中的代求强调上帝能区分个人罪责，但词语本身也容许生命来源的意味，因此以脚注保存两者的张力。
- issue: “一人”与全会众责任的关系
  choice: 保留“一人犯罪”这一直接反问，不在正文中断定只有单一个体负有罪责。
  alternative: 将“一人”明确解释为代表性人物，或译成“一个人犯罪”。
  rationale: 经文的请求以个人之罪与全体所受之怒形成对照，但“一人”是否具有代表性不宜在正文中被解释性地固定。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“俯伏在地”“全会众”“发怒”保留经文语体但不显古奥；两个脚注标记均已置于正文相应位置。
