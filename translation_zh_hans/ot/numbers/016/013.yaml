base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/013.yaml
  text: Is it a small thing that you have brought us up out of a land flowing with milk and honey to kill us in the wilderness[b][a], that you should also make yourself a ruler over us?
translation:
  language: zh_hans
  text: 难道你把我们从流奶与蜜之地[a]领上来，要叫我们死在旷野，还算小事，竟还要辖制我们吗？[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 说话的人带着反讽，把埃及称为“流奶与蜜之地”；圣经其他地方通常用这个说法描述应许之地。
    reason: cultural_note
  - marker: b
    text: “辖制我们”也可译作“在我们之上作首领”。原文把同一词根的有限动词与不定式绝对式连用，以加强对统治权的指责。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמְעַט
  choice: 还算小事吗
  rationale: 这是表达愤慨的反问；放在第一项控诉之后，符合现代汉语习惯，也保留“难道……还算小事吗”的修辞力度。
- source_word: הֶעֱלִיתָנוּ
  choice: 你把我们……领上来
  rationale: 使役形表达“使我们上来、带我们上来”。“领上来”保留出埃及叙事中的方向性用语，又比生硬的“使我们上来”自然。
- source_word: מֵאֶרֶץ זָבַת חָלָב וּדְבַשׁ
  choice: 从流奶与蜜之地
  rationale: 直译这一丰饶意象，不明说讽刺，使听者从上下文辨认说话者反用通常描述应许之地的语言来指埃及。
- source_word: לַהֲמִיתֵנוּ
  choice: 要叫我们死
  rationale: 目的不定式表示他们指控摩西领他们出来是要使他们丧命；此译自然且保留控诉语气。
- source_word: בַּמִּדְבָּר
  choice: 在旷野
  rationale: “旷野”是五经语境中对 מִדְבָּר 准确而通行的译法，不将环境窄化为沙漠。
- source_word: תִשְׂתָּרֵר ... הִשְׂתָּרֵר
  choice: 你竟还要作威作福，辖管我们
  rationale: 动词表示摆出统治者姿态并施行管辖；同源不定式绝对式加强语气。“作威作福，辖管”兼顾自居高位的贬义和实际统治之意。
- source_word: גַּם
  choice: 还
  rationale: 标明在第一项指控之外再加一项控诉。
theological_decisions:
- issue: 将埃及称为“流奶与蜜之地”的反讽
  choice: 正文照原文保留“流奶与蜜之地”
  alternative: 在正文明确增添“你所谓的”等讽刺提示
  rationale: 原文借上下文形成反讽，并未使用明示讽刺的词；直译可保留说话者颠倒应许之地意象所造成的张力。
- issue: 强化式 תִשְׂתָּרֵר ... הִשְׂתָּרֵר 的语气
  choice: 译为“竟还要作威作福，辖管我们”
  alternative: 较中性地译为“还要作我们的统治者”
  rationale: 该结构强化对擅权统治的指控；采用带贬义而不过度具体化的汉语表达，以保留其强烈责难。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。以两个连续反问呈现希伯来语的愤慨语气；保留“领上来”“流奶与蜜之地”“旷野”等五经语汇，同时避免过度古雅。所有脚注标记均置于相关正文之后。
