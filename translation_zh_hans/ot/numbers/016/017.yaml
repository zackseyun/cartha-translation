base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/017.yaml
  text: And let each man take his firepan[a], and put incense on them, and bring before Yahweh each man his firepan—two hundred and fifty firepans—and you and Aaron[b], each his firepan.
translation:
  language: zh_hans
  text: 你们各人要拿自己的火盘，在盘上放香；各人要把自己的火盘带到雅威[a]面前，共二百五十个火盘；你和亚伦也各拿自己的火盘[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “雅威”是希伯来文神名“YHWH”的音译，传统常译作“耶和华”。
    reason: 说明神名的音译及传统译名。
  - marker: b
    text: “火盘”也可译作“香炉”，指盛放炭火、用来焚香的器皿。
    reason: 提供礼仪器皿名称的可行替代译法。
lexical_decisions:
- source_word: וּקְחוּ אִישׁ מַחְתָּתוֹ
  choice: 你们各人要拿自己的火盘
  rationale: 复数命令式配合分配用法的“各人”及单数所属形式；“火盘”具体表达这种盛放炭火、焚香用的器皿。
- source_word: וּנְתַתֶּם עֲלֵיהֶם קְטֹרֶת
  choice: 在盘上放香
  rationale: 保留介词עַל的“在……上”之意，所指是把香放在火盘中的炭火上；补出“盘”使汉语指代清楚。
- source_word: וְהִקְרַבְתֶּם לִפְנֵי יְהוָה
  choice: 要把……带到雅威面前
  rationale: קרב的使役形在礼仪语境中表示带近、呈到面前；此译兼顾动作的具体性与献呈语境。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以常见现代汉语音译呈现四字神名，保留其专名性质，不以称号代替。
- source_word: חֲמִשִּׁים וּמָאתַיִם מַחְתֹּת
  choice: 共二百五十个火盘
  rationale: 明确这是前述各人所带火盘的总数；“共”自然体现同位说明关系。
- source_word: וְאַתָּה וְאַהֲרֹן אִישׁ מַחְתָּתוֹ
  choice: 你和亚伦也各拿自己的火盘
  rationale: 希伯来文为简洁的分配性短语；汉语补出承前省略的动作“拿”，并用“也”表明摩西和亚伦另各一盘。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名。译作“雅威”保留专名，并以脚注说明传统译法，避免在正文中将名字改为称号。
translation_notes:
  register: 采用现代、庄重而易懂的叙述语体。“你们各人……各人……”保留原文的分配结构；末句补出承前省略的“拿”，使汉语完整自然。脚注标记均置于正文相关词句之后。
