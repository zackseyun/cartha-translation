  yaml_path: translation/ot/numbers/016/006.yaml
  text: 'Do this: take censers for yourselves[b][a], Korah and all his congregation.'
translation:
  language: zh_hans
  text: 你们要这样做：可拉和他的全体会众，你们要给自己拿香炉[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“火盘”。原文所指的器皿可用来盛放燃烧的炭，尤其用于焚香礼仪。
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת עֲשׂוּ
  choice: 你们要这样做
  rationale: 指示代词与复数祈使式连用，指向下文即将吩咐的行动；这样译符合现代汉语习惯，也保留命令语气。
- source_word: קְחוּ לָכֶם
  choice: 各自拿
  rationale: 复数祈使式 קְחוּ 表示“拿”，לָכֶם 带有为自己取用的反身意味；“各自拿”在汉语中自然地传达这一点。
- source_word: מַחְתּוֹת
  choice: 香炉
  rationale: 该词指盛放火炭、用于焚香礼仪的器具；在本段祭仪语境中，“香炉”最清楚自然，另将较宽泛的“火盘”列入脚注。
- source_word: קֹרַח
  choice: 可拉
  rationale: 按现代中文圣经人名的通行音译处理。
- source_word: וְכָל עֲדָתוֹ
  choice: 和他的全体会众
  rationale: עֵדָה 指聚集成群体的会众或集会者，后缀表示“他的”；“全体会众”既保留群体含义，也适合本段语境。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的命令句。“可拉和他的全体会众”置于命令内容之前作为受命者；“各自拿”避免生硬直译“为自己拿”，同时保留 לָכֶם 的反身意味。脚注标记分别紧跟其所说明的词语。
