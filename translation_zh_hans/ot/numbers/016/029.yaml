  text: אִם כְּ/מ֤וֹת כָּל הָֽ/אָדָם֙ יְמֻת֣וּ/ן אֵ֔לֶּה וּ/פְקֻדַּת֙ כָּל הָ֣/אָדָ֔ם יִפָּקֵ֖ד עֲלֵי/הֶ֑ם לֹ֥א יְהוָ֖ה שְׁלָחָֽ/נִי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/029.yaml
  text: If these men die the death of all mankind[a], and the fate of all mankind is visited on them, then Yahweh has not sent me.
translation:
  language: zh_hans
  text: 这些人若像众人一样死去，众人通常所遭遇的事也临到他们[a]，雅威就没有差遣我。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “众人通常所遭遇的事也临到他们”所译的两个希伯来语词出自同一词根 פקד。这个词根可有察看或眷顾、追究或处置、任命或指定，以及某事临到某人的意思；本节保留其所指遭遇的具体色彩。
    reason: 说明原文同根复现，并保留פְּקֻדָּה／יִפָּקֵד在此处可指通常遭遇、处置或察看的语义张力。
lexical_decisions:
- source_word: אִם
  choice: 若
  rationale: 引出摩西所设的条件，以现代汉语简洁自然地表达假设。
- source_word: כְּמוֹת כָּל־הָאָדָם יְמֻתוּן אֵלֶּה
  choice: 这些人若像所有世人一样死去
  rationale: 保留比较结构及 אָדָם 的泛指、集合意义；“所有世人”指人类共有的处境，并非专指男性。汉语调整语序，使条件句自然清楚。
- source_word: וּפְקֻדַּת כָּל־הָאָדָם יִפָּקֵד עֲלֵיהֶם
  choice: 所有世人所遭遇的也临到他们
  rationale: פְּקֻדָּה 与 יִפָּקֵד 同根，可表达临到人的察看、处置、命定遭遇或结局。正文采用不预先限定为惩罚的宽泛译法，并以“所遭遇的……临到”尽量反映原文同根复现。
- source_word: לֹא יְהוָה שְׁלָחָנִי
  choice: 雅威就没有差遣我
  rationale: “就”明确标示条件句的结论；“没有差遣”表达过去差遣行为对当前主张的效力。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以常见的现代汉语音译呈现四字神名，保留其作为专名的性质，而不以称号替代。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；译作“雅威”保留其专名身份，也对应较通行的学术重构读音。
- issue: פְּקֻדָּה／פקד 在本节是否明确指惩罚
  choice: 以“所遭遇的……临到”保留宽泛含义
  alternative: 惩罚临到；命运落到
  rationale: 上下文带有审判意味，但该词组本身也可指察看、处置、所命定之事或通常遭遇。正文不把潜在的惩罚义绝对化，以保留原文的词义张力。
- issue: כָּל־הָאָדָם 的范围
  choice: 所有世人
  alternative: 所有人；全人类
  rationale: 此处是泛指人类通常的死亡和遭遇，不限于男性，也不是指某一个人。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“若……就……”清楚呈现摩西的条件论证；避免生硬直译“死世人的死”，也不把 פקד 的司法意味过度收窄为单一的“惩罚”。
