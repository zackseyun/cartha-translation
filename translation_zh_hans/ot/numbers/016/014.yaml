  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: אַ֡ף לֹ֣א אֶל אֶרֶץ֩ זָבַ֨ת חָלָ֤ב וּ/דְבַשׁ֙ הֲבִ֣יאֹתָ֔/נוּ וַ/תִּ֨תֶּן לָ֔/נוּ נַחֲלַ֖ת שָׂדֶ֣ה וָ/כָ֑רֶם הַ/עֵינֵ֞י הָ/אֲנָשִׁ֥ים הָ/הֵ֛ם תְּנַקֵּ֖ר לֹ֥א נַעֲלֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/014.yaml
  text: Indeed[a], you have not brought us into a land flowing with milk and honey, nor have you given us an inheritance of fields and vineyards. Will you gouge out the eyes of these men? We will not come up.
translation:
  language: zh_hans
  text: 况且，你并没有把我们领进流奶与蜜之地，也没有把田地和葡萄园赐给我们作产业。难道你要剜掉这些人的眼睛[a]吗？我们不上去！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“难道你要蒙蔽这些人吗？”希伯来语直译为“剜掉这些人的眼睛”，也可能暗指把他们当作看不清真相、可以任意欺骗的人。
    reason: 说明原文具体意象及其可能的比喻含义。
lexical_decisions:
- source_word: אַף לֹא
  choice: 况且……并没有
  rationale: אַף在此承接并加强前面的控诉，לֹא表示否定；“况且……并没有”既保留递进语气，也符合现代汉语表达。
- source_word: אֶל אֶרֶץ זָבַת חָלָב וּדְבַשׁ
  choice: 进流奶与蜜之地
  rationale: 保留希伯来语描写土地丰饶的固定意象，并以“进”配合带领进入目的地的语义。
- source_word: הֲבִיאֹתָנוּ
  choice: 把我们领进
  rationale: 此词是בוא的使役式，表示“使我们进入、把我们带进”；在本句中受前面的לֹא否定，并非疑问词。
- source_word: וַתִּתֶּן לָנוּ נַחֲלַת שָׂדֶה וָכָרֶם
  choice: 也没有把田地和葡萄园赐给我们作产业
  rationale: נַחֲלָה指分得并持有的产业；“田地和葡萄园”自然表达两个单数集合名词所涵盖的产业类别。
- source_word: הַעֵינֵי הָאֲנָשִׁים הָהֵם תְּנַקֵּר
  choice: 难道你要剜掉这些人的眼睛吗
  rationale: נקר的加强式具体指剜出眼睛。正文保留其强烈而具体的形象；疑问句在语境中表达责难，也可能暗含蒙蔽众人的比喻义。
- source_word: לֹא נַעֲלֶה
  choice: 我们不上去
  rationale: עלה本义为“上去”；这里是大坍和亚比兰拒绝摩西召见，简洁保留原文方向表达。
theological_decisions:
- issue: “剜掉眼睛”是实际威胁还是比喻性控诉
  choice: 正文保留具体说法“剜掉这些人的眼睛”
  alternative: 译作“蒙蔽这些人”
  rationale: 原文采用具体而激烈的身体意象，但语境可能借此指把人当作看不见事实、任人欺骗；正文不替读者消解这种张力，脚注说明可能的比喻义。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“况且”体现控诉的递进；“作产业”保留土地分配与长久占有的含义；末句用“我们不上去”呈现直接、坚决的拒绝。
