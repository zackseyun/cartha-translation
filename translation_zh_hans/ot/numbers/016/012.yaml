base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/012.yaml
  text: Then Moses sent to summon Dathan and Abiram[a], the sons of Eliab, but they said, “We will not come up.”
translation:
  language: zh_hans
  text: 摩西派人去召以利押的儿子大坍和亚比兰来；他们却说：“我们不上去。[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“我们不去”。希伯来语动词的字面意思是“上去、登上”，这里可能指上到摩西所在之处，或指应召到他面前去。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: 派人去
  rationale: שׁלח在此表示摩西差人传召；译作“派人去”符合现代汉语，也不具体指定使者身份。
- source_word: לִקְרֹא
  choice: 召……来
  rationale: קרא接ל和人的结构在此意为传唤、召来；“召……来”既体现正式意味，又与后文拒绝前往相呼应。
- source_word: דָתָן וַאֲבִירָם
  choice: 大坍和亚比兰
  rationale: 采用现代中文圣经中通行的人名音译。
- source_word: בְּנֵי אֱלִיאָב
  choice: 以利押的儿子
  rationale: 忠实保留父子身份说明；希伯来语复数“儿子”在中文中可自然统摄两人。
- source_word: וַיֹּאמְרוּ
  choice: 他们却说
  rationale: 连接词字面可作“于是/并且”，但语境中他们的回答与摩西的传召形成明显转折，“却”自然表达这种对抗性回应。
- source_word: לֹא נַעֲלֶה
  choice: 我们不上去
  rationale: 保留עלה“上去、登上”的方向性及未完成式所表达的坚决拒绝，不把潜在的地点或司法性含义写入正文。
theological_decisions:
- issue: “上去”是否具有“到摩西那里”或“应召出席”的引申义
  choice: 正文保留直译“上去”
  alternative: 译作“我们不去”或“我们不会前来”
  rationale: 原文的方向性表达可能指前往摩西所在之处，也可能带有应召出面的语用含义；保留“上去”并以脚注说明，可避免过早消解歧义。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。“派人去召……来”清楚呈现传召动作；分号和“却”凸显传召与拒绝之间的对照。脚注标记置于引语内相关语句之后。
