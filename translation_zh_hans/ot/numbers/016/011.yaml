  text: לָ/כֵ֗ן אַתָּה֙ וְ/כָל עֲדָ֣תְ/ךָ֔ הַ/נֹּעָדִ֖ים עַל יְהוָ֑ה וְ/אַהֲרֹ֣ן מַה ה֔וּא כִּ֥י תלונו עָלָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/011.yaml
  text: Therefore[a], you and all your company who have assembled against Yahweh—and Aaron, what is he[c][b], that you grumble against him?
translation:
  language: zh_hans
  text: 因此，你和你那一伙人，全都聚集起来敌对雅威[a]；至于亚伦，他算什么，你们竟向他发怨言呢？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “雅威”译自希伯来文神名 YHWH。
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: 所以
  rationale: 承接上文并引出摩西的结论，保留原文的推论语气。
- source_word: עֲדָתְךָ
  choice: 你那一伙人
  rationale: 此处指可拉所聚集的群体，而非以色列全体；“一伙人”在现代汉语中自然，并保留语境中的责斥意味。也可译作“你的会众”或“你的群体”。
- source_word: הַנֹּעָדִים
  choice: 聚集起来
  rationale: 对应 יעד 的尼法勒分词，表示因共同约定或目的而聚集，不额外推断其组织程度。
- source_word: עַל
  choice: 敌挡
  rationale: 叛乱语境表明介词在这里具有敌对含义，不只是“在……面前”或“关于”。
- source_word: יְהוָה
  choice: 雅威
  rationale: 直接音译四字神名 YHWH，保留原文所使用的上帝之名。
- source_word: וְאַהֲרֹן מַה הוּא
  choice: 至于亚伦，他算什么
  rationale: 保留反问对亚伦个人地位的弱化：叛逆最终所敌挡的是雅威，不只是亚伦。
- source_word: תלונו
  choice: 发怨言
  rationale: לון 在旷野叙事中常指带有不满和反抗意味的抱怨；“发怨言”比中性的“抱怨”更贴合这一惯用语境。
- source_word: עָלָיו
  choice: 向他
  rationale: 表明怨言针对亚伦；与“发怨言”搭配符合自然汉语。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名；采用“雅威”可明确呈现专名，而不以称号“主”代替。
- issue: 叛逆真正针对的对象
  choice: 先明确众人聚集敌挡雅威，再以反问弱化亚伦个人的重要性
  alternative: 把雅威和亚伦并列为同等的敌挡对象
  rationale: 希伯来语先以 הַנֹּעָדִים עַל־יְהוָה 指明他们敌挡雅威，随后另提亚伦并问“他算什么”，显示怨言表面针对亚伦，实质却是敌挡雅威。
translation_notes:
  register: 采用现代、庄重而口语可懂的表达。“你那一伙人”带有本节责斥叛党所需的语气，但避免使用过于粗俗的说法；“他算什么”保留原文尖锐的反问。
