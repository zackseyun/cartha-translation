  to: 因此，你和你那一伙人，全都聚集起来敌对雅威[a]；至于亚伦，他算什么，你们竟向他发怨言呢？
  rationale: 修订仅调整汉语句法、标点和“敌对”的常用搭配；保留“你那一伙人”的责斥语气、雅威这一神名译法，以及亚伦被修辞性弱化、怨言实际指向他的原文结构。未增添任何教义性解释。
