base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/003.yaml
  text: They assembled against Moses and against Aaron and said to them[a], “You have gone too far! For all the congregation—all of them—are holy, and Yahweh is among them[b]. So why do you exalt yourselves above the assembly of Yahweh?”
translation:
  language: zh_hans
  text: 他们聚集起来反对摩西和亚伦，对他们说：“你们太过分了！全体会众，个个都是圣洁的，耶和华也在他们中间。你们为什么还要高抬自己，凌驾于耶和华的会众之上呢？”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקָּהֲלוּ עַל
  choice: 聚集起来反对
  rationale: 保留קהל所表达的集体聚集，并按对抗语境将עַל译为“反对”，不把敌意额外强化为“围攻”等。
- source_word: רַב לָכֶם
  choice: 你们太过分了
  rationale: 这是尖锐的责备性习语；现代汉语“太过分了”自然传达“够了／你们越界了”的语气，避免生硬直译。
- source_word: כָל הָעֵדָה כֻּלָּם
  choice: 全体会众——他们个个
  rationale: 用破折号保留כָל…כֻּלָּם的重复强调，突出全体中的每一个人。
- source_word: קְדֹשִׁים
  choice: 圣洁的
  rationale: 采用קדושׁ的标准宗教用语，同时直接呈现说话者的主张，不预先替叙事作判断。
- source_word: וּבְתוֹכָם יְהוָה
  choice: 耶和华也在他们中间
  rationale: 自然表达上帝临在于群体之中；将神名יהוה音译为汉语传统通行形式“耶和华”。
- source_word: תִּתְנַשְּׂאוּ עַל
  choice: 抬高自己，凌驾于……之上
  rationale: 体现Hitpael的反身意义及עַל所表示的居高于人；“抬高自己”保留动作意象，“凌驾于”清楚传达指控。
- source_word: קְהַל יְהוָה
  choice: 耶和华的会众
  rationale: קהל在此指属于耶和华、聚集成体的以色列群体；“会众”庄重且为现代读者易懂。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名；正文采用现代中文圣经语境中最通行、最易识别的专名“耶和华”，不以“主”这一称号替代神名。
- issue: 是否在“全体会众……都是圣洁的”中加入叙事评价
  choice: 不加限定，直接译为说话者的宣称
  alternative: 译成“都自称圣洁”或加入质疑性措辞
  rationale: 原文直接报告可拉一党的论断；其真伪与限度应由上下文评判，译文不预先消解其中的神学张力。
- issue: 摩西和亚伦是否确实自高
  choice: 保留为反对者提出的质问
  alternative: 改写为客观陈述，暗示二人确实自高
  rationale: 疑问句表达的是说话者的指控。译文保留其言语层次，不把指控转化为叙述者认可的事实。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“你们太过分了”保留直接冲突的口吻；破折号再现希伯来文对全体成员的强调。两个群体名词עֵדָה与קהל均译作“会众”，以保证中文流畅；本节语境不要求强行制造不同术语。
