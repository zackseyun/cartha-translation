  text: וַ/יִּקְח֞וּ אִ֣ישׁ מַחְתָּת֗/וֹ וַ/יִּתְּנ֤וּ עֲלֵי/הֶם֙ אֵ֔שׁ וַ/יָּשִׂ֥ימוּ עֲלֵי/הֶ֖ם קְטֹ֑רֶת וַֽ/יַּעַמְד֗וּ פֶּ֛תַח אֹ֥הֶל מוֹעֵ֖ד וּ/מֹשֶׁ֥ה וְ/אַהֲרֹֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/018.yaml
  text: So each man took his firepan[a], and they put fire in them and put incense on them, and they stood at the entrance of the tent of meeting, with Moses and Aaron.
translation:
  language: zh_hans
  text: 于是，各人拿起自己的火盘[a]，把火放在盘里，又把香放在火上；他们同摩西、亚伦一起站在会幕的门口。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“香炉”。希伯来语所指的是一种盛放炭火、用于焚香的器皿。
    reason: 保留מַחְתָּה的传统译法及其器物功能所容许的词义选择。
lexical_decisions:
- source_word: אִישׁ מַחְתָּתוֹ
  choice: 他们各自拿起自己的火盘
  rationale: אִישׁ在这里作分配用法，表示每个人都拿自己的器具。מַחְתָּה指盛放炭火、用于焚香的器皿；“火盘”具体易懂，也保留其盛火功能。
- source_word: וַיִּתְּנוּ עֲלֵיהֶם אֵשׁ
  choice: 在盘中放上火
  rationale: 介词עַל字面为“在……上”，但用于容器时，现代汉语自然表达为“在盘中放上火”，清楚呈现把火放入器皿的动作。
- source_word: וַיָּשִׂימוּ עֲלֵיהֶם קְטֹרֶת
  choice: 又在火上放香
  rationale: קְטֹרֶת是焚烧用的香；按仪式动作，香放在盘中的炭火上。这样译成自然汉语，同时保持连续动作的关系。
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: 会幕门口
  rationale: פֶּתַח指入口或门口；אֹהֶל מוֹעֵד采用现代中文圣经语境中简明而通行的“会幕”。
- source_word: וּמֹשֶׁה וְאַהֲרֹן
  choice: 和摩西、亚伦一同
  rationale: 原文在站立地点之后并列提到摩西和亚伦，最自然地表示他们也在那里；“一同”清楚传达共同站在会幕门口的情形。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“火盘”突出器皿盛火的具体功能，脚注保留传统的“香炉”。句中以“在盘中……在火上……”自然呈现仪式步骤，避免机械重复代词造成歧义。
