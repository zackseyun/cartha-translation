id: NUM.16.5
reference: Numbers 16:5
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יְדַבֵּ֨ר אֶל קֹ֜רַח וְ/אֶֽל כָּל עֲדָת/וֹ֮ לֵ/אמֹר֒ בֹּ֠קֶר וְ/יֹדַ֨ע יְהוָ֧ה אֶת אֲשֶׁר ל֛/וֹ וְ/אֶת הַ/קָּד֖וֹשׁ וְ/הִקְרִ֣יב אֵלָ֑י/ו וְ/אֵ֛ת אֲשֶׁ֥ר יִבְחַר בּ֖/וֹ יַקְרִ֥יב אֵלָֽי/ו־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/005.yaml
  text: And he spoke to Korah and to all his congregation[a], saying, “In the morning Yahweh will make known who is his, and who is holy, and will bring him near to himself. The one whom he chooses[b], he will bring near to himself.”
translation:
  language: zh_hans
  text: 他对可拉和可拉的全体会众说：“到了早晨，雅威必显明谁是属他的，谁是圣洁的，并使谁亲近他；他拣选谁，就使谁亲近他。[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “显明”直译可作“知道”。“使……亲近”是祭司礼仪用语，指获准到雅威面前从事神圣事奉。
    reason: 保留ידע的词义歧义，并说明קרב在本节中的礼仪背景。
lexical_decisions:
- source_word: וַיְדַבֵּר ... לֵאמֹר
  choice: 他……说
  rationale: דבר表示发言或讲话，后接לֵאמֹר引出直接引语；现代汉语用“对……说”自然且不重复。
- source_word: עֲדָתוֹ
  choice: 可拉的全体会众
  rationale: עֵדָה指聚集的群体或会众；补出“可拉”以明确希伯来语第三人称所属关系，避免误解为摩西的会众。
- source_word: בֹּקֶר
  choice: 到了早晨
  rationale: 裸名词在此作时间状语，所指是即将到来的早晨；“到了早晨”符合现代汉语叙事。
- source_word: וְיֹדַע יְהוָה
  choice: 雅威必显明
  rationale: ידע字面为“知道”，但在此语境中指雅威公开辨明或显出人的身份；正文采用自然的语境义，同时以脚注保留直译可能。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以通行的汉语音译呈现四字神名，保留其作为以色列之神专名的性质。
- source_word: אֵת אֲשֶׁר לוֹ
  choice: 谁是属他的
  rationale: 保留希伯来语简洁的所属表达，不把其具体所指过度解释为某一职分。
- source_word: וְאֶת הַקָּדוֹשׁ
  choice: 谁是圣洁的
  rationale: 定冠词加形容词作实体用法；译为谓语结构，与前句“谁是属他的”保持平行，也保留圣洁或被分别出来的含义。
- source_word: וְהִקְרִיב אֵלָיו / יַקְרִיב אֵלָיו
  choice: 使谁亲近他 / 使谁亲近他
  rationale: קרב的使役形在祭司礼仪语境中表示使人获准靠近神；重复译出，以保留原文的强调。
- source_word: אֲשֶׁר יִבְחַר בּוֹ
  choice: 他拣选谁
  rationale: בחר表示选择或拣选；此译简洁自然，并保留神主动选择的语气。
theological_decisions:
- issue: וְיֹדַע在此是“知道”还是“显明”
  choice: 正文译“显明”
  alternative: 雅威必知道谁是属他的
  rationale: 动词形式本身是普通主动式“知道”，因此直译确有根据；但上下文关注次日公开验证谁获准亲近雅威，“显明”更准确传达语用效果。脚注保留形式上的歧义。
- issue: “属他的”“圣洁的”是否指同一人或两类人
  choice: 保持两个并列问项，不明确合并或拆分
  alternative: 译成“谁是属他的圣者”或明确为两组人
  rationale: 希伯来语以两个带宾格标记的成分并列，句法可让人理解为相互关联的身份描述，但不宜在译文中武断消除其张力。
- issue: קרב的神学与礼仪含义
  choice: 译为“使……亲近他”
  alternative: 使……到他面前／准许……担任圣职
  rationale: “亲近”保留原文的空间隐喻和祭司礼仪内涵，又不把经文限定为正文未明说的具体职务。
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华／主
  rationale: 采用四字神名的现代汉语音译，保留专名性质，而不以称号替代。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。保留“属他的—圣洁的—亲近他—拣选”的平行与重复，不用现代宗派职衔解释经文。脚注标记置于整句末，涵盖“显明”和“使……亲近”两项说明。
