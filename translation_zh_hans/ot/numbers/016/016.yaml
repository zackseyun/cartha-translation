base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/016.yaml
  text: And Moses said to Korah[a], “You and all your congregation[b], be before Yahweh tomorrow—you and they and Aaron.”
translation:
  language: zh_hans
  text: 摩西对可拉说：“明天，你和你的全体会众——你、他们和亚伦——都要到耶和华面前[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在耶和华的临在中。”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: 未将叙事连接词 וַ 单独译出，以符合现代汉语叙事习惯；动词仍准确表达摩西发言。
- source_word: קֹרַח
  choice: 可拉
  rationale: 采用该人名通行的现代中文圣经音译。
- source_word: אַתָּה וְכָל־עֲדָתְךָ
  choice: 你和你的全会众
  rationale: עֵדָה 指聚集起来的群体；“全会众”既保留共同体含义，也契合本章语境。
- source_word: הֱיוּ לִפְנֵי יְהוָה
  choice: 都要到耶和华面前
  rationale: הֱיוּ 字面为“要在/要成为”，在此命令语境中表示届时在场；“要到……面前”以自然汉语表达出席之意，同时保留 לִפְנֵי 的空间及临在含义。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文读者熟悉的专名形式呈现四字神名，不改作称号“主”。
- source_word: אַתָּה וָהֵם וְאַהֲרֹן
  choice: 你、他们和亚伦都要到场
  rationale: 保留原文对各方的再次明确列举；补出“都要到场”，使汉语句子完整，并承接前面的复数命令。
- source_word: מָחָר
  choice: 明天
  rationale: 直接表达时间副词，并前置于命令内容，使现代汉语自然清楚。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用神的专名而非一般称号；译文保留专名性质。“耶和华”是现代中文中最广为识别的形式，脚注不必将经文改写为“主”。
- issue: לִפְנֵי יְהוָה 所表达的临在含义
  choice: 到耶和华面前
  alternative: 在耶和华临在之处
  rationale: 原语可表示空间上的“在……面前”，也可强调处于某位的临在中。正文采用简洁而传统的表达，脚注保留后一层可能含义，不把两者强行区分。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“到……面前”比逐字译作“要在……面前存在”更易懂；破折号保留原文后半句对出席各方的强调性复述。
