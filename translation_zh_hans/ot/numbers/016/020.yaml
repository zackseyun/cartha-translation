  yaml_path: translation/ot/numbers/016/020.yaml
  text: And Yahweh spoke to Moses and to Aaron[a], saying,
translation:
  language: zh_hans
  text: 耶和华对摩西和亚伦说：
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: 说
  rationale: 该形式推进叙事，并引出直接话语；现代汉语以“说”自然表达这一常用叙事公式。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 这是四字神名；采用现代中文圣经读者熟悉的专名“耶和华”，不以称号替代。
- source_word: אֶל מֹשֶׁה וְאֶל אַהֲרֹן
  choice: 对摩西和亚伦
  rationale: 介词 אֶל 标明说话对象；中文用一个“对”统摄并列的两位受话者，自然而不改变原意。
- source_word: לֵאמֹר
  choice: 说：
  rationale: 这是引出后续直接引语的常用公式；中文以“说：”表达，冒号承担引语提示功能，避免生硬重复为“说……说”。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。正文保留为专名而非译作“主”；“耶和华”是现代中文读者最熟悉的传统音译，而“雅威”较接近学术界常见的拟音。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。原文重复介词的并列结构在中文中合并为“对摩西和亚伦”，不损失两人同为受话者的信息；以冒号自然引出下一节的话。
