base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/002.yaml
  text: and rose up before Moses[a], with two hundred fifty men from the sons of Israel, leaders of the congregation, called to the assembly[b], men of renown.
translation:
  language: zh_hans
  text: 他们和二百五十名以色列人一同起来，站在摩西面前[a]；这些人是会众的首领，是被召参加集会的人[b]，也是有名望的人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 按本段语境，也可译作“起来反对摩西”；希伯来语字面为“起来，在摩西面前”。
    reason: lexical_alternative
  - marker: b
    text: 或译“被召赴会的人”。这里可能指正式受召参加共同体指定集会的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֻמוּ לִפְנֵי מֹשֶׁה
  choice: 他们起来，站在摩西面前
  rationale: 保留קום的起身行动和לִפְנֵי的空间关系，不在正文中直接把动作解释为反叛；上下文仍可显出对抗意味。
- source_word: וַאֲנָשִׁים מִבְּנֵי יִשְׂרָאֵל חֲמִשִּׁים וּמָאתָיִם
  choice: 与他们一起的，还有二百五十名以色列人
  rationale: 希伯来语在动词后采用省略式并列；中文补出“与他们一起的，还有”以清楚表达这些人也一同起来。“以色列人”是现代汉语对בְּנֵי יִשְׂרָאֵל自然且准确的群体称谓。
- source_word: נְשִׂיאֵי עֵדָה
  choice: 会众的首领
  rationale: נָשִׂיא指居领导地位的人，עֵדָה指共同体或会众；译文兼顾身份含义与现代可懂性。
- source_word: קְרִאֵי מוֹעֵד
  choice: 被召参加大会的人
  rationale: קְרִאֵי具有“被召”的被动含义，מוֹעֵד在此指指定的集会；此译法自然表达他们受召参与共同体正式集会的身份。
- source_word: אַנְשֵׁי שֵׁם
  choice: 有名望的人
  rationale: 直译为“有名字的人”，是指享有声望、广为人知的人；“有名望的人”准确传达这一希伯来习语。
theological_decisions:
- issue: לִפְנֵי在叙事语境中是否应直接译为敌对行动
  choice: 正文译作“站在摩西面前”
  alternative: “起来反对摩西”
  rationale: 该介词本身通常表示“在……面前”，虽在本段语境中带有对抗意味，但不宜把上下文推论直接写进词义；脚注保留语境性译法。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“起来，站在”保留原文动作及关系；分号和“与他们一起的，还有”使希伯来语省略式并列在中文中清楚流畅。所有身份称谓保持平行，并避免加入宗派性解释。
