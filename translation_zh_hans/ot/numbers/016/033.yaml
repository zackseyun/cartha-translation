base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/033.yaml
  text: So they went down alive into Sheol—they and all that belonged to them—and the earth covered them[a], and they perished from the midst of the assembly.
translation:
  language: zh_hans
  text: 于是，他们和一切属于他们的，都活着下到阴间[a]；大地遮盖了他们，他们就从会众中灭亡了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“坟墓”或“死者之境”。希伯来文作“示俄勒”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרְדוּ
  choice: 下到
  rationale: ירד表示“下去、下降”；“下到”自然地保留了叙事中的向下运动，并与目的地“阴间”衔接。
- source_word: הֵם וְכָל אֲשֶׁר לָהֶם
  choice: 他们和一切属于他们的
  rationale: 原文措辞宽泛，可包括与他们有关的人和财物；此译法不把范围擅自限定为某一类。
- source_word: חַיִּים
  choice: 活着
  rationale: 这里强调他们进入阴间时仍然活着；“活着下到”符合现代汉语表达。
- source_word: שְׁאֹלָה
  choice: 到阴间
  rationale: שְׁאוֹל所指不限于单个坟墓，而是死者所在之处；“阴间”是现代中文圣经语境中较自然且不等同于“地狱”的表达。方向词尾以“到”体现。
- source_word: וַתְּכַס עֲלֵיהֶם הָאָרֶץ
  choice: 地把他们掩盖了
  rationale: 保留“地”为施事主体和כסה“遮盖、掩盖”的具体图景；“掩盖”也体现土地合拢在他们上面的含义。
- source_word: וַיֹּאבְדוּ
  choice: 他们就……灭亡了
  rationale: אבד在此表示灭亡、消失；“灭亡”符合审判语境，又不额外说明原文未明说的方式。
- source_word: מִתּוֹךְ הַקָּהָל
  choice: 从会众中
  rationale: קהל指聚集的群体；“会众”简明地保留群体语境，“从……中”自然表达מִתּוֹךְ。
theological_decisions:
- issue: שְׁאוֹל的译法
  choice: 阴间
  alternative: 坟墓；死者之境
  rationale: 该词在希伯来圣经中通常比具体的坟墓含义更广。“阴间”保留死者所在之境的概念，同时不把它直接解释为后世体系化意义上的“地狱”；其他可能译法列入脚注。
translation_notes:
  register: 采用现代、庄重而易懂的叙事体。“都活着下到阴间”保留原文中“他们和一切属于他们的”共同下去的宽泛表述；分号呈现事件推进，并避免句子层次含混。
