  language: zh_hans
  text: 你要对会众说：‘你们要离开可拉、大坍和亚比兰住处的周围。’
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָעֵדָה
  choice: 会众
  rationale: 指聚集的以色列群体；“会众”准确、庄重，也符合民数记的语境。
- source_word: הֵעָלוּ
  choice: 上去
  rationale: 希伯来语动词是עלה的使役式复数命令，字面为“上去/离开而上”；保留原文的空间表达，不将其仅意译为“离开”。
- source_word: מִסָּבִיב לְמִשְׁכַּן
  choice: 从……的住处周围
  rationale: 保留מִן所表达的离开起点和סביב的“周围”；מִשְׁכָּן在此指人的居处，译作“住处”比宗教语境中的“帐幕”更自然，同时不限定为单一帐篷。
