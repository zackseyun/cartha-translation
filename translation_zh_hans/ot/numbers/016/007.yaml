source:
  edition: WLC
  text: וּ/תְנ֣וּ בָ/הֵ֣ן אֵ֡שׁ וְ/שִׂימוּ֩ עֲלֵי/הֶ֨ן קְטֹ֜רֶת לִ/פְנֵ֤י יְהוָה֙ מָחָ֔ר וְ/הָיָ֗ה הָ/אִ֛ישׁ אֲשֶׁר יִבְחַ֥ר יְהוָ֖ה ה֣וּא הַ/קָּד֑וֹשׁ רַב לָ/כֶ֖ם בְּנֵ֥י לֵוִֽי׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/007.yaml
  text: and put fire in them[a], and place incense on them before Yahweh tomorrow. Then the man whom Yahweh chooses—he is the holy one. You have gone too far, sons of Levi!
translation:
  language: zh_hans
  text: 明天，你们要把火放在香炉里，把香放在香炉上，放在雅威面前。雅威所拣选的那人，就是那位圣者。利未的子孙，你们太过分了！[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“利未的子孙，这对你们已经够了！”原文短语字面含“多、够”的意思；在这里可表示他们已经越界，也可作带有“够了”意味的喝止。
    reason: 保留רַב לָכֶם在越界责备与“够了”式喝止之间的词义张力。
lexical_decisions:
- source_word: וּתְנוּ בָהֵן אֵשׁ
  choice: 你们要把火放在香炉里
  rationale: נתן与介词ב表示把火放入前文所说的香炉；中文补出代词所指的“香炉”，使本节独立阅读时清楚自然。
- source_word: וְשִׂימוּ עֲלֵיהֶן קְטֹרֶת
  choice: 把香放在上面
  rationale: שׂים意为“放置”，עֲלֵיהֶן的阴性复数与香炉相应。“上面”保留原文关系，未擅自把所指改成火。
- source_word: לִפְנֵי יְהוָה
  choice: 在雅威面前献上
  rationale: “在……面前”保留礼仪行动发生在神面前的含义；补出“献上”使中文与献香语境自然，但不改变动作内容。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以“雅威”音译四字神名，区别于称号“主”。
- source_word: מָחָר
  choice: 明天
  rationale: 直接表达时间副词，并按自然中文语序置于句首。
- source_word: וְהָיָה הָאִישׁ אֲשֶׁר יִבְחַר יְהוָה
  choice: 雅威拣选谁，谁就是
  rationale: 以现代中文的“谁……谁……”结构表达将由试验显明的结果，保留拣选者是雅威。
- source_word: הוּא הַקָּדוֹשׁ
  choice: 谁就是那圣者
  rationale: 定冠词使קָדוֹשׁ成为有标记的称谓；“那圣者”比单说“是圣洁的”更能保留此人被神确认、分别出来的含义。
- source_word: רַב לָכֶם
  choice: 你们太过分了
  rationale: 此短语字面涉及“多、够”，在语境中构成指责对方越过适当界限；正文采用自然有力的现代汉语，脚注保留另一种可能语气。
- source_word: בְּנֵי לֵוִי
  choice: 利未的子孙
  rationale: 保留字面的家族称呼和直接呼语，不泛化为一般性的“利未人”。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名；采用“雅威”保留专名性质，不以称号代替。
- issue: הוּא הַקָּדוֹשׁ是称谓还是单纯性质描述
  choice: 就是那圣者
  alternative: 就是圣洁的；就是那位分别为圣的人
  rationale: 保留定冠词所标示的特定身份，同时不进一步解释此处的圣洁具体等同于何种职分。
- issue: רַב לָכֶם的责备力度
  choice: 你们太过分了
  alternative: 够了；你们有的已经够多了
  rationale: 上下文支持越界式责备，但原短语也可带“够了”的语气，因此正文采用语境义，脚注保存其词义张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。命令用“要把……”，结果句用自然的“谁……谁……”结构；保留“利未的子孙”的希伯来家族表达，并避免加入具体宗派性的祭司职分解释。
