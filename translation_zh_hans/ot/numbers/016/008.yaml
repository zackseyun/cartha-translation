  text: וַ/יֹּ֥אמֶר מֹשֶׁ֖ה אֶל קֹ֑רַח שִׁמְעוּ נָ֖א בְּנֵ֥י לֵוִֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/008.yaml
  text: Then Moses said to Korah[a], “Hear now, you sons of Levi.”
translation:
  language: zh_hans
  text: 摩西便对可拉说：“利未的子孙啊，请听！[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“利未的子孙啊，你们现在听着！”；也可译：“利未人啊，请听！”
    reason: שִׁמְעוּ נָא 可译为“请听”或“现在听着”；בְּנֵי לֵוִי 字面为“利未的子孙”，也可按其群体所指译为“利未人”。
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 又……说
  rationale: 未完成式连续结构推进叙事；“又……说”既承接上文，也符合现代汉语叙事习惯。
- source_word: אֶל־קֹרַח
  choice: 对可拉
  rationale: 介词 אֶל 标明说话的对象；“对可拉”是自然、准确的现代汉语表达。
- source_word: שִׁמְעוּ
  choice: 你们听着
  rationale: 复数祈使式要求多人留心听；“你们听着”保留直接召唤和责令留意的语气。
- source_word: נָא
  choice: 着（结合祈使语气表达即时催促）
  rationale: נָא 可表示恳请或催促。此处在对峙语境中，“听着”自然传达当下留心听的催促感，而不将语气固定为礼貌的“请”。
- source_word: בְּנֵי לֵוִי
  choice: 利未的子孙
  rationale: 直译为“利未的众子”，在这里指男性利未人。“利未的子孙”既保留亲属／宗族表达，也比“利未的众子”更符合现代汉语。
- source_word: מֹשֶׁה
  choice: 摩西
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: קֹרַח
  choice: 可拉
  rationale: 采用现代中文圣经传统中通行的人名译法。
theological_decisions:
- issue: 直接称呼中带性别的宗族用语
  choice: 利未的子孙
  alternative: 利未人
  rationale: 原文 בְּנֵי לֵוִי 字面为“利未的众子”，在当前语境中针对男性利未人。正文保留宗族关系和男性所指，不将其直接泛化为较中性的群体名称；脚注列出自然的概括译法。
- issue: נָא 的语气
  choice: 以“听着”表达即时催促
  alternative: 请听；现在听
  rationale: נָא 的功能可在恳请与催促之间摆动。上下文带有责问和警告色彩，因此正文不采用偏礼貌的“请”，同时用脚注保留其他可能。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“哪”标示直接呼语；“你们听着”具有明确的复数对象和郑重催促的语气。
