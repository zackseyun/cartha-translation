  rationale: 修改仅为提升现代标准汉语的自然度和句法明确性：以“发出”对应火由雅威而出的动作，以“献上香的人”明确分词短语的动作关系。保留雅威、二百五十人、吞灭及脚注中的“面前”这一替代译法，未改变经文含义或添加神学解释。
