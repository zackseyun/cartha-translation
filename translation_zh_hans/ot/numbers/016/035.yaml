base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/035.yaml
  text: And fire came out from Yahweh and consumed the two hundred and fifty men who were offering the incense[a].
translation:
  language: zh_hans
  text: 有火从雅威那里发出，吞灭了那二百五十个献上香的人。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或较直译为：“有火从雅威面前发出。”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֵשׁ
  choice: 于是有火
  rationale: אֵשׁ意为“火”；叙事连接词וְ在此推进事件，译作“于是”符合现代汉语叙事习惯，并清楚表达前后相承。
- source_word: יָצְאָה
  choice: 出来
  rationale: יצא表示“出去、出来”；这里指火从神那里发出，“出来”简明自然。
- source_word: מֵ/אֵת יְהוָה
  choice: 从雅威那里
  rationale: מֵאֵת在此表示来源，也保留“从……面前”的空间性意味；正文采用自然汉语“从雅威那里”，并以脚注保留较贴近形式的译法。“雅威”音译圣名יהוה。
- source_word: וַ/תֹּאכַל
  choice: 吞灭了
  rationale: אכל本义为“吃”，以火为主语时表示吞噬、烧尽。“吞灭”既保留原文形象，也传达彻底毁灭的结果。
- source_word: הַ/חֲמִשִּׁים וּ/מָאתַיִם אִישׁ
  choice: 那二百五十个……的人
  rationale: 该数词短语指前文所述的特定群体；“那”体现定指，“二百五十个……的人”符合现代汉语表达。
- source_word: מַקְרִיבֵי הַ/קְּטֹרֶת
  choice: 献香的人
  rationale: קרב的分词结构描述这些人当时正在执行的行动；קְטֹרֶת指礼仪用香。“献香的人”简洁自然，并保留其身份与行为。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名יהוה；采用“雅威”以圣名音译呈现，不以称号替代。
- issue: 火的来源表达
  choice: 从雅威那里出来
  alternative: 从雅威面前出来
  rationale: מֵאֵת既可自然表达来源，也可较形式化地表达为“从……面前”。正文优先采用清楚自然的来源表达，脚注保留空间性较强的译法，不额外界定火发出的具体方式。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“吞灭”保留火如同吞噬的原文意象；数字以汉字书写，与经文体例协调。
