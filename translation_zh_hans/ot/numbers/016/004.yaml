  text: וַ/יִּשְׁמַ֣ע מֹשֶׁ֔ה וַ/יִּפֹּ֖ל עַל פָּנָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/004.yaml
  text: When Moses heard it[a], he fell on his face.
translation:
  language: zh_hans
  text: 摩西听见了，就俯伏在地。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“倒在自己的脸上”；这是指面朝下伏地，也可译作“脸伏于地”。
    reason: 说明希伯来习语的字面形式及可接受的译法。
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: 听见了
  rationale: שׁמע在连续叙事中自然表示“听见”。希伯来文未明说宾语；中文依上下文也可自然省略，所听见的是上一节众人的话。
- source_word: מֹשֶׁה
  choice: 摩西
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: וַיִּפֹּל
  choice: 俯伏
  rationale: נפל本义为“倒下、落下”；与“在脸上”这一希伯来习语连用时，表示面朝下伏地。译作“俯伏”可用自然、庄重的现代中文表达其具体姿势，同时不擅自说明其情绪或目的。
- source_word: עַל פָּנָיו
  choice: 在地
  rationale: 该短语直译为“在他的脸上”，是面朝下伏地的希伯来习语。中文“俯伏在地”传达同一身体动作；脚注保留原文的字面形象。
theological_decisions:
- issue: 摩西俯伏这一姿势的解释
  choice: 只陈述摩西“俯伏在地”，不说明这是祷告、悲痛、震惊或代求。
  alternative: 译为“俯伏祷告”或“悲痛地伏在地上”。
  rationale: 原文只记述身体动作，没有明确解释其目的或情绪；保持具体动作可保留叙事中的神学张力，避免加入文本未明说的意义。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。“俯伏在地”比生硬的“倒在脸上”更符合中文表达，并由脚注保存原文的具体措辞。
