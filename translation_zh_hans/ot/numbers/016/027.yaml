base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/027.yaml
  text: So they moved away from around the dwelling of Korah[a], Dathan, and Abiram. And Dathan and Abiram came out, standing at the entrance of their tents, with their wives, their sons[b], and their little children.
translation:
  language: zh_hans
  text: 于是，众人从可拉[a]、大坍和亚比兰住处的四周退开。大坍和亚比兰出来，站在各自帐篷的门口；他们的妻子、儿子和幼儿也都在那里。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “退开”所译的希伯来语动词字面意思是“上去”；在这里，它与“从……之上/离开”和“四周”等空间表达连用，按上下文很可能指从那一带撤离。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּעָלוּ מֵעַל ... מִסָּבִיב
  choice: 从……四周退开
  rationale: 动词字面为“上去”，但与מֵעַל和מִסָּבִיב连用，并结合上下文，表示众人离开、避开该处；“退开”自然传达空间上的撤离，同时以脚注保留字面可能。
- source_word: מִשְׁכַּן
  choice: 住处
  rationale: 这里指与可拉、大坍和亚比兰相关的居住地或营居处，并非耶和华的会幕；“住处”既准确又可避免混淆。
- source_word: יָצְאוּ נִצָּבִים
  choice: 出来，站在
  rationale: 分别保留“出来”和表示姿态的分词“站着”，不额外加入“公然对抗”等语义。
- source_word: פֶּתַח אָֽהֳלֵיהֶם
  choice: 自己帐棚的门口
  rationale: 保留希伯来文帐棚的复数所表达的各自家庭居所，并用现代汉语自然表达。
- source_word: וּנְשֵׁיהֶם וּבְנֵיהֶם וְטַפָּם
  choice: 他们的妻子、儿子和幼儿
  rationale: בנים译作“儿子”，与随后指年幼子女或幼小家属的טף相区别；טף在此译为具体清楚的“幼儿”。
theological_decisions:
- issue: מִשְׁכַּן是否指圣所会幕
  choice: 译作“住处”，理解为叛乱者相关的居住或营居区域
  alternative: 译作“会幕”
  rationale: 名词虽可用于圣所会幕，但此处所有格结构及叙事情境指向可拉、大坍和亚比兰的住处；译成“会幕”容易造成神学和场景上的误解。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“则”突出大坍和亚比兰与退开的众人之间的场景对照；末句用“也都在那里”自然表达家属陪同在帐棚门口的情形。脚注标记已在正文中对应出现。
