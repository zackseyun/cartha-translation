base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/028.yaml
  text: And Moses said[a], “By this you will know that Yahweh has sent me to do all these deeds[b], for it was not from my own heart.”
translation:
  language: zh_hans
  text: 摩西说：“你们就会凭这件事知道，耶和华差遣我做这一切事[a]，我做这些事并不是出于自己的心意[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “这一切事”也可译作“这一切作为”或“这一切行动”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译为“不是从我的心”；这是说并非出于摩西自己的主意或权柄。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר מֹשֶׁה
  choice: 摩西说
  rationale: 希伯来语叙事中的 wayyiqtol 在此引出直接引语；现代汉语无需机械添加“于是”或“然后”。
- source_word: בְּזֹאת
  choice: 凭这件事
  rationale: 介词 בְּ 表示凭借或依据，指接下来发生、用来证实摩西所言的事件。
- source_word: תֵּדְעוּן
  choice: 你们……就会知道
  rationale: 第二人称阳性复数未完成式在语境中表达将来的认知结果；“就会知道”自然呈现其验证意味。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 直接译出四字神名，并采用现代中文圣经读者最熟悉的传统音译。
- source_word: שְׁלָחַנִי
  choice: 差遣我
  rationale: “差遣”准确表达受委派、奉命而来的含义；汉语不必明示希伯来语完成式的时体。
- source_word: לַעֲשׂוֹת אֵת כָּל הַמַּעֲשִׂים הָאֵלֶּה
  choice: 做这一切事
  rationale: מַעֲשִׂים 可指行为、作为或事情；正文采用自然且范围较宽的“事”，脚注保留“作为”的词义可能。
- source_word: כִּי לֹא מִלִּבִּי
  choice: 并且这不是出于我自己的心意
  rationale: 将第二个 כִּי 理解为继续说明“你们会知道”的内容；“出于我自己的心意”既保留“从我的心”这一意象，也传达并非摩西自行发起之意。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。中文正文不以“主”替代，而采用广为人知的传统音译“耶和华”；“雅威”是可能的学术拟音。
- issue: 第二个 כִּי 与前句的关系
  choice: 并且这不是出于我自己的心意
  alternative: 因为这不是出于我自己的心意
  rationale: כִּי 可表原因，也可引出所知内容。这里保留它可能与前一 כִּי 并列、共同受“知道”支配的读法，避免把逻辑关系限定为原因。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留“从心而出”的希伯来语意象，同时用“心意”使中文自然；句法不刻意仿古。
