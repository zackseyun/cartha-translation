  yaml_path: translation/ot/numbers/016/025.yaml
  text: Then Moses rose and went to Dathan and Abiram[a], and the elders of Israel went after him.
translation:
  language: zh_hans
  text: 于是，摩西起身，到大坍和亚比兰那里去；以色列的长老们也跟在他后面。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּקָם
  choice: 起身
  rationale: קום的叙事性未完成式表示接续发生的新行动；“起身”自然、简洁，并保留站起来采取行动的意味。
- source_word: וַיֵּלֶךְ אֶל
  choice: 到……那里去
  rationale: הלך与אֶל共同表达朝着某人所在之处前往；汉语用“到……那里去”比生硬的“走向”更自然，也不额外限定行走方式。
- source_word: דָּתָן וַאֲבִירָם
  choice: 大坍和亚比兰
  rationale: 依照现代中文圣经人名的通行音译处理。
- source_word: וַיֵּלְכוּ אַחֲרָיו
  choice: 也跟在他后面
  rationale: 该短语直观描写众长老在摩西身后同行；“跟在他后面”同时体现הלך的移动和אַחֲרָיו的方位关系，且符合现代汉语表达。
- source_word: זִקְנֵי יִשְׂרָאֵל
  choice: 以色列的长老们
  rationale: 该结构指以色列中获认可的长老或领袖；加“们”清楚体现希伯来语复数，表达自然。
- source_word: וַ
  choice: 于是／也
  rationale: 句首的连接词推进叙事，译作“于是”；后半句的连接词译作“也”，自然呈现长老随同行动的接续关系。
