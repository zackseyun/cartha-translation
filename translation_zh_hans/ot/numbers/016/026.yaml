base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/026.yaml
  text: And he spoke to the congregation[a], saying, “Please move away from the tents of these wicked men, and do not touch anything that belongs to them, lest you be swept away in all their sins.”
translation:
  language: zh_hans
  text: 他对会众说：“请你们离开这些恶人的帐篷，不要碰任何属于他们的东西，免得你们也因他们所犯的一切罪而被扫灭[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“免得你们也在他们所犯的一切罪中被扫灭。”希伯来文在这里也可理解为与他们的罪相关，而不一定限于明确的因果关系。
    reason: 词义与句法上的另一种可能
lexical_decisions:
- source_word: הָעֵדָה
  choice: 会众
  rationale: עֵדָה在此指聚集的以色列群体；“会众”简洁自然，并保留其整体性。
- source_word: סוּרוּ נָא
  choice: 请你们离开
  rationale: סוּר的命令式要求转身离开，נָא使语气带有恳切和紧迫感；“请你们离开”兼顾命令与恳切语气。
- source_word: מֵעַל אָהֳלֵי
  choice: 离开……的帐棚
  rationale: מֵעַל在这里按语境表示离开帐棚所在之处，而非字面上的“从帐棚上面”；此译法符合现代汉语表达。
- source_word: הָאֲנָשִׁים הָרְשָׁעִים הָאֵלֶּה
  choice: 这些恶人
  rationale: רְשָׁעִים带有明确的道德和审判意味；“这些恶人”准确指向眼前特定的一群男子，汉语无需另加“男人”。
- source_word: וְאַל תִּגְּעוּ
  choice: 不要碰
  rationale: נגע的基本义为触碰或接触；“不要碰”保留禁令的直接性，不额外解释接触的性质。
- source_word: בְּכָל אֲשֶׁר לָהֶם
  choice: 任何属于他们的东西
  rationale: 该短语概括他们所有的财物；在否定命令中用“任何……东西”自然体现其周遍范围。
- source_word: פֶּן תִּסָּפוּ
  choice: 免得你们……也被扫灭
  rationale: ספה的尼法勒形可指在审判中被扫除、毁灭；“被扫灭”保留被动语态及被卷入共同毁灭的意象，“也”体现一同遭殃的关联。
- source_word: בְּכָל חַטֹּאתָם
  choice: 在他们这一切的罪中
  rationale: 介词ב可表示处境、关联，也可能带有原因意味；正文采用较贴近形式且保留张力的译法，未把它限定为纯粹的因果关系。
theological_decisions:
- issue: 因与恶人相连而一同遭受审判
  choice: 警告会众远离恶人及其财物，免得在与他们罪行相关的审判中也被扫灭。
  alternative: 也可将末句更明确地理解为因果关系：“免得你们因他们这一切的罪而被除灭。”
  rationale: 希伯来文既把危险与恶人的罪相连，也借上下文强调空间上的分离。正文保留这种关联与因果之间的张力，不把它扩展为某种罪责归算的教义，也不把它简化为单一因果说明。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“请你们离开”传达恳切而紧迫的命令；“被扫灭”保留审判中被一并扫除的形象。脚注标记置于它实际说明的末句之后。
