  text: וַ/יִּקַּ֣ח קֹ֔רַח בֶּן יִצְהָ֥ר בֶּן קְהָ֖ת בֶּן לֵוִ֑י וְ/דָתָ֨ן וַ/אֲבִירָ֜ם בְּנֵ֧י אֱלִיאָ֛ב וְ/א֥וֹן בֶּן פֶּ֖לֶת בְּנֵ֥י רְאוּבֵֽן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/001.yaml
  text: Korah son of Izhar[a], son of Kohath, son of Levi, along with Dathan and Abiram, sons of Eliab, and On son of Peleth, sons of Reuben, took men,
translation:
  language: zh_hans
  text: 可拉（以斯哈的儿子；以斯哈是哥辖的儿子，哥辖是利未的儿子），连同以利押的儿子大坍和亚比兰，以及比勒的儿子安——他们是吕便的子孙——带了一些人[a]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译是“可拉取了”，没有说明所取的是什么；这里根据下一节补出“一些人”。
    reason: 说明原文省略宾语及正文为清楚起见所作的补充。
lexical_decisions:
- source_word: וַיִּקַּח
  choice: 拉拢了一些人
  rationale: לקח的基本义是“拿、带、取”，但本句没有明说宾语。结合下一节出现的二百五十名首领，“拉拢了一些人”能在现代汉语中自然表达此处省略的宾语及叙事语境，同时用脚注保留原文的省略现象。
- source_word: קֹרַח בֶּן יִצְהָר בֶּן קְהָת בֶּן לֵוִי
  choice: 利未的儿子哥辖，哥辖的儿子以斯哈，以斯哈的儿子可拉
  rationale: 保留逐代相承的族谱链。按汉语习惯由先祖到后代排列，使各个“儿子”所指清楚，而不削弱原文对可拉利未血统的强调。
- source_word: וְדָתָן וַאֲבִירָם בְּנֵי אֱלִיאָב
  choice: 连同以利押的儿子大坍、亚比兰
  rationale: “连同”表明二人参与同一行动；“儿子”直接对应בְּנֵי，并采用通行的中文圣经人名形式。
- source_word: וְאוֹן בֶּן פֶּלֶת
  choice: 以及比勒的儿子安
  rationale: 直接保留人物及父子关系，并采用通行中文音译。
- source_word: בְּנֵי רְאוּבֵן
  choice: 他们都是吕便的子孙
  rationale: 此处复数短语概括前述大坍、亚比兰和安的吕便支派身份；“子孙”在汉语中比逐字作“儿子们”更自然，也避免误解为三人都是吕便的直接儿子。
theological_decisions:
- issue: 开头动词的省略宾语
  choice: 正文补出“人”，译为“拉拢了一些人”，并以脚注说明原文省略宾语
  alternative: 只译“取了／带了”，或较强地解释为“起来反叛／结党”
  rationale: 原文只说“可拉取了”，没有宾语。下一节的二百五十人很可能是所指，但原文的省略不宜被完全隐藏；正文求清楚，脚注则保存形式上的含混。“起来反叛”预先点明叙事含义，超出了该动词本身。
- issue: בְּנֵי רְאוּבֵן的修饰范围
  choice: 理解为概括大坍、亚比兰和安三人，译作“他们都是吕便的子孙”
  alternative: 仅让“吕便的子孙”修饰紧邻的安
  rationale: 复数“子孙”与前面三名吕便谱系人物相称，且民数记26:5、8-9明确把以利押及其儿子置于吕便支派中。译文用破折号标出概括说明，同时不加入额外教义解释。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。族谱次序按汉语表达由先祖排到后代；人名采用简体中文圣经中较通行的译名。句末保留逗号，以反映本节动作在下一节继续展开。
