  text: וַ/יַּקְהֵ֨ל עֲלֵי/הֶ֥ם קֹ֨רַח֙ אֶת כָּל הָ֣/עֵדָ֔ה אֶל פֶּ֖תַח אֹ֣הֶל מוֹעֵ֑ד וַ/יֵּרָ֥א כְבוֹד יְהוָ֖ה אֶל כָּל הָ/עֵדָֽה־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/019.yaml
  text: And Korah assembled the whole congregation against them at the entrance to the tent of meeting[a], and the glory of Yahweh appeared to the whole congregation.
translation:
  language: zh_hans
  text: 可拉把全体会众召集到会幕门口，与摩西和亚伦对抗。雅威[a]的荣耀向全体会众显现。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文为יהוה（YHWH）；这里音译作“雅威”，传统中文常译作“耶和华”。
    reason: 说明神名的原文形式及传统译法。
lexical_decisions:
- source_word: וַיַּקְהֵל
  choice: 召集
  rationale: 该词是קהל的使役形，表示可拉主动使会众聚集；“召集”自然地保留这一使役和领导行动。
- source_word: עֲלֵיהֶם
  choice: 与摩西和亚伦对抗
  rationale: 结合本章叛乱的语境，介词עַל在这里带有敌对意味。将代词所指明示为摩西和亚伦，既符合上文，也使现代汉语表达清楚。
- source_word: כָּל הָעֵדָה
  choice: 全体会众
  rationale: עֵדָה指作为整体聚集的以色列群体；“会众”符合《民数记》的语境，“全体”保留כָּל。
- source_word: אֶל פֶּתַח אֹהֶל מוֹעֵד
  choice: 到会幕门口
  rationale: אֶל保留移动的方向，פֶּתַח指入口；“会幕”是现代中文中对אֹהֶל מוֹעֵד准确而通行的称呼。
- source_word: וַיֵּרָא
  choice: 显现
  rationale: ראה的尼法勒形在此表示可见的彰显；“显现”简洁自然，也不额外说明彰显的具体方式。
- source_word: כְבוֹד יְהוָה
  choice: 雅威的荣耀
  rationale: כָּבוֹד在此指神临在的彰显；属格结构按自然汉语译作“雅威的荣耀”。
- source_word: יְהוָה
  choice: 雅威
  rationale: 原文直接使用四字神名יהוה；音译为“雅威”保留其专名性质，而不以称号代替。
- source_word: אֶל כָּל הָעֵדָה
  choice: 向全体会众
  rationale: 介词אֶל标明显现所面向的对象；“向”既保留方向感，也符合现代汉语习惯。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文使用神的四字专名。正文采用较贴近现有学术重构的音译“雅威”，并以脚注说明传统中文译法，避免把专名无声替换为称号。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“会幕门口”“全体会众”“显现”均为普通读者易懂且适合经文语体的表达；将“他们”明示为“摩西和亚伦”，消除汉语中可能产生的指代不清，但不改变原文的敌对关系。
