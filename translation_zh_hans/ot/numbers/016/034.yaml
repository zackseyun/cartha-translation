  text: וְ/כָל יִשְׂרָאֵ֗ל אֲשֶׁ֛ר סְבִיבֹתֵי/הֶ֖ם נָ֣סוּ לְ/קֹלָ֑/ם כִּ֣י אָֽמְר֔וּ פֶּן תִּבְלָעֵ֖/נוּ הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/034.yaml
  text: And all Israel who were around them fled at their cry[a], for they said, “Lest the earth swallow us up!”
translation:
  language: zh_hans
  text: 他们周围所有的以色列人听见他们的声音[a]，就逃跑了，因为他们说：“恐怕大地把我们吞下去！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“他们的喊声”。希伯来语“קוֹל”（qōl）可指声音、嗓音或喊声。
    reason: 保留该词在此处究竟泛指所听见的声音，还是特指受审判者喊声的词义不确定性。
lexical_decisions:
- source_word: וְכָל־יִשְׂרָאֵל אֲשֶׁר סְבִיבֹתֵיהֶם
  choice: 他们周围的以色列众人
  rationale: 按集合意义译出“全以色列”，同时用关系短语限定为当时在他们周围的人；现代汉语中“以色列众人”比“全以色列”更不易让人误解为全国每一个人都在现场。
- source_word: נָסוּ
  choice: 就都逃跑了
  rationale: נוּס表示因危险而逃离；“逃跑”自然直接，“都”与前面的集合性主语相呼应。
- source_word: לְקֹלָם
  choice: 一听见他们的声音[a]
  rationale: קוֹל可指声音、嗓音或喊声。正文采用范围较宽的“声音”，不武断限定为呼喊；“一听见……就……”自然表达介词לְ在此所引出的触发情形。
- source_word: כִּי אָמְרוּ
  choice: 因为他们说
  rationale: כִּי在这里说明逃跑的原因；“因为”清楚保留因果关系。
- source_word: פֶּן
  choice: 恐怕
  rationale: פֶּן引出所惧怕的结果；“恐怕”在现代汉语直接引语中自然，并保留说话者的忧惧。
- source_word: תִּבְלָעֵנוּ הָאָרֶץ
  choice: 大地把我们也吞下去
  rationale: בלע在上下文中描写大地裂开吞人，“吞下去”保留鲜明意象；“大地”呼应前文的地面事件。“也”显明说话者担心遭遇同样的结局，是汉语语境所需的自然表达。
theological_decisions: []
