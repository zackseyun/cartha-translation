lexical_decisions:
- source_word: וַיְהִי כְּכַלֹּתוֹ לְדַבֵּר
  choice: 他一说完
  rationale: כְּ与不定式结构在此表示前一动作刚完成，随即发生后一事件；“一……就……”自然传达紧接关系。
- source_word: כָּל הַדְּבָרִים הָאֵלֶּה
  choice: 这一切话
  rationale: 保留כָּל“全部”和הָאֵלֶּה“这些”的范围与指示意义，同时符合现代汉语表达。
- source_word: וַתִּבָּקַע הָאֲדָמָה
  choice: 地就裂开了
  rationale: בקע为被裂开或裂开的意思；此处用汉语不及物表达，不额外指明施事。
- source_word: אֲשֶׁר תַּחְתֵּיהֶם
  choice: 他们脚下的
  rationale: 直译为“在他们下面的”；“他们脚下的地”在现代汉语中自然、清楚，并保留空间关系。
