  text: וַ/יִּ֤חַר לְ/מֹשֶׁה֙ מְאֹ֔ד וַ/יֹּ֨אמֶר֙ אֶל יְהוָ֔ה אַל תֵּ֖פֶן אֶל מִנְחָתָ֑/ם לֹ֠א חֲמ֨וֹר אֶחָ֤ד מֵ/הֶם֙ נָשָׂ֔אתִי וְ/לֹ֥א הֲרֵעֹ֖תִי אֶת אַחַ֥ד מֵ/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/015.yaml
  text: Then Moses became very angry and said to Yahweh, “Do not turn toward their offering. I have not taken a single donkey from them, nor have I harmed any one of them.”
translation:
  language: zh_hans
  text: 摩西非常愤怒，就对雅威说：“求你不要垂顾他们的供物。[a]我没有从他们那里拿过一头驴，也没有伤害过他们中任何一人。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“不要看中他们的供物”或“不要悦纳他们的供物”。希伯来文直译为“不要转向他们的供物”。
    reason: 说明 פנה אל 的字面意象及其在本语境中可能表达的有利关注或接纳，并保留语义幅度。
lexical_decisions:
- source_word: וַיִּחַר לְמֹשֶׁה מְאֹד
  choice: 摩西非常愤怒
  rationale: 希伯来语惯用表达 חרה ל 描写怒气发作；“非常愤怒”以自然的现代汉语表达该惯用语，并保留 מְאֹד 的强烈程度。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见音译呈现四字神名，而不以称号替代原文中的专名。
- source_word: אַל תֵּפֶן אֶל מִנְחָתָם
  choice: 求你不要垂顾他们的供物
  rationale: פנה אל 字面为“转向”，在祷告语境中可指带着认可或恩待而关注；“垂顾”自然保留这种意象和语用含义。“求”体现否定祈使在向上帝祷告时的汉语语气，并未增添新的命题内容。
- source_word: מִנְחָתָם
  choice: 他们的供物
  rationale: מִנְחָה 可指礼物、贡物或献给上帝的供物；此处用宽泛的“供物”，不武断限定为素祭。
- source_word: לֹא חֲמוֹר אֶחָד מֵהֶם נָשָׂאתִי
  choice: 我没有从他们那里拿过一头驴
  rationale: נשא 在这里表示拿取或占取；译文保留“一头驴”的具体意象，也不以“夺取”过度强化原文。
- source_word: וְלֹא הֲרֵעֹתִי אֶת אַחַד מֵהֶם
  choice: 也没有伤害过他们中任何一人
  rationale: רעע 的使役形在此表示加害或作恶；“伤害”简洁自然，“任何一人”保留 אַחַד 的个体强调。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用上帝的专名，因此采用音译“雅威”，不以“主”这一称号取代；“耶和华”是传统形式，但“雅威”更贴近通常重构的读音。
- issue: “转向他们的供物”所表达的态度
  choice: 垂顾
  alternative: 转向；看中；悦纳
  rationale: 原文意象是“转向”，语境可能蕴含有利的关注乃至接纳，但没有明说“悦纳”；“垂顾”既传达祷告语境中的有利关注，又由脚注保留字面表达及其他可能译法。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“垂顾”略带祷告语体色彩，适合摩西向上帝发言的场景；其具体语义范围由脚注说明。标点和代词安排力求朗读流畅。
