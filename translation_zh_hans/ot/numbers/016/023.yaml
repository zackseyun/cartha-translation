  text: Then Yahweh spoke to Moses[a], saying,
translation:
  language: zh_hans
  text: 随后，耶和华对摩西说[a]：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文可直译为：“于是（或：又），耶和华对摩西说：”句首连接词在叙事中承接上文，也可不另译出。
    reason: 说明希伯来语句首连接词的叙事承接功能及可译选择。
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: 随后……说
  rationale: 叙事性 wayyiqtol 在这里推进事件次序；“随后”以自然的现代汉语表达其承接作用，“说”符合汉语引出直接引语的惯常表达。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的专名“耶和华”对应四字神名，避免用“主”这一称号取代原文专名。
- source_word: אֶל־מֹשֶׁה
  choice: 对摩西
  rationale: 介词 אֶל 与说话动词连用，表示话语所指向的对象；现代汉语自然表达为“对摩西”。
- source_word: לֵּאמֹר
  choice: 说：
  rationale: 该不定式在固定言说公式中引出下一节的直接引语；汉语以“说：”自然保留其功能和经文未完待续的结构。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用以色列之神的专名。译作“耶和华”保留其专名性质，也采用现代中文圣经传统中最通行、普通读者最容易识别的形式；“雅威”则较接近常见的学术重构读音。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“随后”承接上文并推进叙事；冒号表明直接引语见下一节。
