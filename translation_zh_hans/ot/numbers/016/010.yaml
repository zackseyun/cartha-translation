  text: וַ/יַּקְרֵב֙ אֹֽתְ/ךָ֔ וְ/אֶת כָּל אַחֶ֥י/ךָ בְנֵי לֵוִ֖י אִתָּ֑/ךְ וּ/בִקַּשְׁתֶּ֖ם גַּם כְּהֻנָּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/010.yaml
  text: He has brought you near[a], and all your brothers, the sons of Levi, with you; yet you are seeking the priesthood as well.
translation:
  language: zh_hans
  text: 他使你和你所有的弟兄，就是利未的子孙，一同近前来；你们还寻求祭司的职分。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּקְרֵב
  choice: 已经使……近前来
  rationale: 使役形表达“使人靠近、准许近前”的意思；“近前来”既保留空间意象，也能在本段礼仪语境中传达获准事奉的身份含义。“已经”体现先前恩准对当前责问仍有影响。
- source_word: אֹתְךָ
  choice: 你
  rationale: 阳性单数直接宾语，指可拉本人。
- source_word: וְאֶת כָּל אַחֶיךָ בְנֵי לֵוִי
  choice: 也使你所有的弟兄，就是利未的子孙
  rationale: 保留“弟兄”以及同位语“利未的子孙”，既贴近希伯来文结构，也明确所指群体。
- source_word: אִתָּךְ
  choice: 与你一同
  rationale: 按上下文指可拉的利未弟兄与他一同获准近前；译文保留原文重复提到“你”的强调。
- source_word: וּבִקַּשְׁתֶּם
  choice: 你们还要寻求……吗
  rationale: 动词为复数，责问对象从可拉本人扩展到与他同伙的人；结合上下文，以疑问语气自然表达责备意味。
- source_word: גַּם
  choice: 还要
  rationale: 表示在已经所得的利未职分之外，还企求更多，保留附加和递进意味。
- source_word: כְּהֻנָּה
  choice: 祭司的职分
  rationale: 指祭司身份或职任，不只是一般祭司活动；此译法清楚区分利未人的事奉与祭司职分。
theological_decisions:
- issue: 利未人的礼仪地位与祭司职分的区别
  choice: 祭司的职分
  alternative: 祭司职务；祭司的事奉
  rationale: 原文所指是可拉一党在已有利未事奉资格之外所寻求的祭司身份和职任。“祭司的职分”保留本段核心的制度性区别，又不加入宗派性解释。
- issue: “使近前来”的礼仪含义
  choice: 近前来
  alternative: 亲近他；使……靠近
  rationale: 原文没有明说靠近的对象，但上下文赋予该动词礼仪准入的含义。译作“近前来”保留这种含蓄性，不擅自补出宾语。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。前半句保留原文先提可拉、再提其利未弟兄与他一同近前的层次；后半句用复数“你们”和反问语气呈现摩西对整个群体的责备。
