revisions:
- from: 他已经使你近前来，也使你所有的弟兄，就是利未的子孙，与你一同近前来；你们还要寻求祭司的职分吗？
  to: 他使你和你所有的弟兄，就是利未的子孙，一同近前来；你们还寻求祭司的职分。
  rationale: 修订将原文单一的“使近前”动词自然地统领可拉及其利未弟兄，并将末句恢复为原文的陈述式责备。保留“近前来”不补出原文未明说的对象，保留“祭司的职分”以准确体现制度性含义。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T04:52:03Z'
review_pass:
  verdict: revise
  source_fidelity: 原文以单数“你”指可拉，继而将“你所有的弟兄、利未的子孙”与他并列；末句动词为复数，指向可拉及其同伙。译文应保留这种由单数转复数的变化。原文末句是陈述式责备，并非语法上的问句；不宜将其明确改作反问句。
  naturalness: 原译前半句两次使用“使……近前来”，虽可理解，但中文较为重复。将并列宾语合并为“使你和……弟兄……一同近前来”，更自然，也准确表达“与你同在”的关系。
  terminology: “利未的子孙”忠实对应“利未之子”；“祭司的职分”恰当表达כְּהֻנָּה所指的祭司身份／职任，并保留其与利未人事奉的区别。
  issues:
  - severity: medium
    issue: 末句被译为反问句“你们还要寻求祭司的职分吗？”。
    rationale: 希伯来文“你们还寻求祭司职分”在形式上是陈述式；其责备语气由上下文和“还／也”体现。改为陈述式可避免增添原文未明示的疑问句语气。
  - severity: low
    issue: 前半句重复“使……近前来”。
    rationale: 原文是一个动词统领两个并列宾语。合并表达更符合现代汉语，并保留原有句法关系。
  revised_text: 他使你和你所有的弟兄，就是利未的子孙，一同近前来；你们还寻求祭司的职分。
