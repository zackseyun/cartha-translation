  text: הִבָּ֣דְל֔וּ מִ/תּ֖וֹךְ הָ/עֵדָ֣ה הַ/זֹּ֑את וַ/אַכַלֶּ֥ה אֹתָ֖/ם כְּ/רָֽגַע׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/021.yaml
  text: Separate yourselves from the midst of this congregation[b][a], that I may consume them in an instant.
translation:
  language: zh_hans
  text: “你们要从这会众中间离开，好让我顷刻间消灭他们。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִבָּדְלוּ
  choice: 离开
  rationale: 该词是בדל的尼法勒命令式复数，在这里要求受话者把自己与会众分开；结合“从……中间”，译作“离开”自然清楚，并保留实际撤离的命令意味。
- source_word: מִתּוֹךְ
  choice: 从……中间
  rationale: 介词结构表示从某群体内部出来；“从……中间”保留了原文的空间意味。
- source_word: הָעֵדָה הַזֹּאת
  choice: 这会众
  rationale: עֵדָה在民数记中常指作为整体聚集的以色列群体；“会众”简洁、庄重，也符合本书语境。
- source_word: וַאֲכַלֶּה
  choice: 好让我……消灭
  rationale: כלה的加强词干在此表达彻底除灭、终结。命令之后接第一人称意愿形式，“好让我”自然传达目的或结果意味，而“消灭”保留审判的强烈程度。
- source_word: אֹתָם
  choice: 他们
  rationale: 第三人称复数直接宾语，回指面临审判的会众。
- source_word: כְּרָגַע
  choice: 顷刻间
  rationale: רֶגַע指极短的片刻；“顷刻间”以庄重而通俗的现代汉语表达审判的迅速性。
theological_decisions:
- issue: 神所宣告之审判的性质
  choice: 按真实而严厉的灭绝意向翻译为“消灭他们”
  alternative: 弱化为“处置他们”或“除去他们”
  rationale: כלה在本段语境中具有强烈的终结和毁灭含义。译文不把这项宣告淡化为泛指的处理，也不借后续情节预先消解其神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“你们要……离开”明确表达复数命令；“会众”延续五经群体称谓；“顷刻间”兼具自然度与审判宣告所需的力度。原文没有必须借脚注呈现的实质歧义，因此不设脚注。
