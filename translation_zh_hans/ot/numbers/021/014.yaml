  text: עַל כֵּן֙ יֵֽאָמַ֔ר בְּ/סֵ֖פֶר מִלְחֲמֹ֣ת יְהוָ֑ה אֶת וָהֵ֣ב בְּ/סוּפָ֔ה וְ/אֶת הַ/נְּחָלִ֖ים אַרְנֽוֹן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/014.yaml
  text: Therefore it is said in the Book of the Wars of Yahweh[a], “Waheb in Suphah[b], and the wadis of the Arnon.”
translation:
  language: zh_hans
  text: 因此，《耶和华的战争记》中说：“瓦希伯在苏法[a]，以及亚嫩的河谷。”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “苏法”也可能不是地名，而是普通名词；这样可译作“暴风中的瓦希伯”。
    reason: alternative_reading
  - marker: b
    text: 这句希伯来语引文含义不明；“瓦希伯”也有其他解释，甚至可能是一个动词性短语的一部分，而不是地名。
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל כֵּן
  choice: 因此
  rationale: 保留引出引文或说明的推论连接作用，符合现代汉语表达。
- source_word: יֵאָמַר
  choice: 中说
  rationale: 希伯来语尼法勒未完成式在此作无人称用法，引出文献中的引文；汉语以“中说”自然表达。
- source_word: בְּסֵפֶר מִלְחֲמֹת יְהוָה
  choice: 《耶和华战争记》中
  rationale: 将已知文献的名称按现代中文书名格式处理；“战争”保留复数名词的总体含义，“记”表明这是文献名称。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文读者熟悉的神名音译，不以“主”这一称号替代专名。
- source_word: אֶת וָהֵב
  choice: 瓦希伯
  rationale: 这段古老引文语义晦涩；正文将 וָהֵב 谨慎视为地名并音译，不强行采用推测性的动词解释。
- source_word: בְּסוּפָה
  choice: 苏法的
  rationale: 正文将 סוּפָה 视为地名，并以领属结构自然连接“瓦希伯”；也可能是普通名词“暴风”，故以脚注保留。
- source_word: וְאֶת הַנְּחָלִים
  choice: 以及……河谷
  rationale: נחל 在此地理语境中可指谷地及季节性水道；“河谷”兼顾地形和水系含义，且比音译术语更易懂。
- source_word: אַרְנוֹן
  choice: 亚嫩
  rationale: 采用该地名在中文圣经传统中通行且易识别的音译。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 中文正文保留神的专名而不代换为“主”；“耶和华”是现代中文读者最熟悉、最具可识别性的固定译名。
- issue: 古诗引文中 וָהֵב בְּסוּפָה 的理解
  choice: 苏法的瓦希伯
  alternative: 暴风中的瓦希伯；或把“瓦希伯”理解为动词性短语的一部分
  rationale: 原文极为晦涩，正文采用较少解释性的地名读法，同时用脚注明确保留其他可能，避免消除文本本有的歧义。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。文献名用书名号；古地名采用通行或近似希伯来语的中文音译。正文保持古诗引文的简略和晦涩，不补入原文没有的谓语。脚注标记与相应说明匹配：关于“苏法”的备选理解置于[a]，关于“瓦希伯”的词汇歧义置于[b]。
