  yaml_path: translation/ot/numbers/021/021.yaml
  text: Then Israel sent messengers to Sihon king of the Amorites[a], saying,
translation:
  language: zh_hans
  text: 于是，以色列派使者到亚摩利人的王西宏那里，说：
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: 于是……派
  rationale: 叙事性连续式推动情节发展；“于是”自然体现承接关系，“派”准确表达差遣之意。
- source_word: יִשְׂרָאֵל
  choice: 以色列
  rationale: 此处是指以色列百姓这一整体，采用通行译名。
- source_word: מַלְאָכִים
  choice: 使者
  rationale: 上下文是外交往来，所指为受差派的人，而非天使；“使者”准确且庄重。
- source_word: אֶל
  choice: 到……那里
  rationale: 结合差派使者的语境，以现代汉语“到……那里”自然表达方向和对象。
- source_word: סִיחֹן
  choice: 西宏
  rationale: 采用该人名的通行中文译法。
- source_word: מֶלֶךְ הָאֱמֹרִי
  choice: 亚摩利人的王
  rationale: 希伯来语附属结构表示西宏是亚摩利人之王；此译法清楚保留其统治对象，也避免把“亚摩利”误解为地名。
- source_word: לֵאמֹר
  choice: 说
  rationale: 这是引出下一节直接引语的固定表达；汉语用“说”最自然。
theological_decisions: []
