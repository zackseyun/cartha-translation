  register: 采用现代、庄重而易懂的叙事语言。“于是”体现希伯来叙事的推进；句末冒号提示下节将出现直接引语。原英文脚注涉及英语中两种结构的表达差异，中文正文“亚摩利人的王”已清楚传达原意，因此无需设置脚注。
