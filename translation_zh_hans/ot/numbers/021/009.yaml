revisions:
- from: 于是，摩西造了一条铜蛇[a]，把它安在杆子[b]上。后来，蛇若咬了人[c]，那人一望这铜蛇[d]，就活了。
  to: 于是，摩西造了一条铜蛇[a]，把它安在杆子[b]上。凡被蛇咬的人[c]，只要看这铜蛇，就活了[d]。
  rationale: 修改叙事连接和条件句表达，使译文既保留原文“若蛇咬人、其人看铜蛇便活”的概括性结果，也符合现代标准汉语。保留“看”，避免“仰望”或“信靠”等超出本节明说的神学强化；同时调整关于“杆子”的词汇脚注，避免“标杆”的现代歧义。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T04:56:46Z'
