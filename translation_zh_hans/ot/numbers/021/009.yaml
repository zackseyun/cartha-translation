  text: וַ/יַּ֤עַשׂ מֹשֶׁה֙ נְחַ֣שׁ נְחֹ֔שֶׁת וַ/יְשִׂמֵ֖/הוּ עַל הַ/נֵּ֑ס וְ/הָיָ֗ה אִם נָשַׁ֤ךְ הַ/נָּחָשׁ֙ אֶת אִ֔ישׁ וְ/הִבִּ֛יט אֶל נְחַ֥שׁ הַ/נְּחֹ֖שֶׁת וָ/חָֽי־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/009.yaml
  text: So Moses made a bronze serpent and set it on the pole[a]. And it happened that if the serpent bit a man, and he looked at the bronze serpent[d][c][b], he lived.
translation:
  language: zh_hans
  text: 于是，摩西造了一条铜蛇[a]，把它安在杆子[b]上。凡被蛇咬的人[c]，只要看这铜蛇，就活了[d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “铜”也可译作“青铜”；希伯来语这个金属名称可指铜或青铜。
    reason: lexical_alternative
  - marker: b
    text: “杆子”所译的词也可指作为标志的旗帜或旗杆。
    reason: lexical_alternative
  - marker: c
    text: 希伯来语直译为“一个男人”，此处泛指任何被蛇咬的人。
    reason: lexical_alternative
  - marker: d
    text: 这一事件后来在约翰福音3:14—15中得到预表性的呼应。
    reason: cross_reference
lexical_decisions:
- source_word: נְחַשׁ
  choice: 蛇
  rationale: 现代汉语以“蛇”自然、准确地指活蛇及其铸造形象；“毒蛇”会加入原文本节未明说的性质。
- source_word: נְחֹשֶׁת
  choice: 铜
  rationale: 该词可指铜或青铜；“铜蛇”既保留材料意义，也符合自然、庄重的汉语表达，并用脚注注明另一可能。
- source_word: הַנֵּס
  choice: 杆子
  rationale: 此处指承托铜蛇的竖立物。“旗杆”可能使读者以为杆上挂的是旗，“旌旗”则会把承托物变成旗帜本身。
- source_word: וְהָיָה
  choice: 后来
  rationale: 在此引出随后反复出现的情形；“后来”使叙事衔接自然，又不把句式生硬直译为“事情发生了”。
- source_word: אִם נָשַׁךְ הַנָּחָשׁ אֶת אִישׁ
  choice: 蛇若咬了人
  rationale: 保留条件结构和单数意象；汉语“人”自然表达 אִישׁ 在此代表任何被咬之人的泛指作用。
- source_word: וְהִבִּיט אֶל
  choice: 一望
  rationale: 表达朝向铜蛇观看的动作，并与“就活了”构成自然的条件—结果关系；避免用可能预先强化神学含义的“仰望”。
- source_word: וָחָי
  choice: 就活了
  rationale: 直接表达观看之后存活的结果；不译作“痊愈”，因为原文只明确说活下来。
theological_decisions:
- issue: אִישׁ 的代表性阳性表达
  choice: 人
  alternative: 男人；任何人
  rationale: 原文阳性单数在这里具有代表性。现代汉语“人”可保留单数泛指而不错误限定只有男性；脚注说明原文形式。
- issue: “观看”动作的潜在预表性解读
  choice: 一望
  alternative: 仰望；信靠地望向
  rationale: 民数记本节只明说被咬者观看铜蛇便活了，不在正文中加入“信靠”等解释；约翰福音3:14—15的后续预表呼应置于脚注。
translation_notes:
  register: 采用现代、庄重而易懂的叙事体。“安在……上”比口语化的“放在”更能表达将铸造形象固定于竖杆之意；“一望……就活了”简洁保留原文动作与结果的紧密联系。脚注标记按其实际所注释的词语排列为[a]铜蛇、[b]杆子、[c]人、[d]整个观看铜蛇而存活的事件。
