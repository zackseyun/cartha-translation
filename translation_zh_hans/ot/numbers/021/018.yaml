  text: the well that the princes dug[a], that the nobles of the people hollowed out with the ruler’s staff, with their staffs[b]. And from the wilderness they went to Mattanah.
translation:
  language: zh_hans
  text: '这口井是众首领所挖的，是百姓中的贵族用权杖、用他们的杖掘成的[a]。


    他们从旷野起行，到了玛他拿[b]。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “权杖”所对应的希伯来词也可指“立法者”或“统治者”；这里因与“用他们的杖”平行，译作“权杖”。
    reason: alternative_reading
  - marker: b
    text: 希伯来文直译为“从旷野，玛他拿”，没有明说“起行，到了”；这里按上下文的行程次序补译。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּאֵר
  choice: 井
  rationale: 普通名词“井”；本句承接上一节所歌唱的那口井，汉语无需另加指示词也能自然衔接。
- source_word: חֲפָרוּהָ
  choice: 所挖
  rationale: חפר意为“挖掘”，阴性单数宾语后缀回指“井”；用“所挖”配合前置的“井”，符合汉语诗句表达。
- source_word: שָׂרִים
  choice: 众首领
  rationale: 指地位较高的领袖或官长；“首领”既保留政治社会身份，也比“王子”更适合本处语境。
- source_word: כָּרוּהָ
  choice: 掘成
  rationale: כרה同样表示挖掘；译作“掘成”既与前面的“挖”略作变化，也表达把井开掘出来的结果。
- source_word: נְדִיבֵי הָעָם
  choice: 百姓中的贵族
  rationale: 在与שָׂרִים平行的语境中，נְדִיבִים最可能指有身份、有地位的人；“百姓中的贵族”自然保留这一社会等级含义。
- source_word: בִּמְחֹקֵק
  choice: 用权杖
  rationale: מְחֹקֵק可指立法者、统治者或其权杖；因与下句“用他们的杖”平行，这里优先按工具义理解。“权杖”也保留其统治权象征。
- source_word: בְּמִשְׁעֲנֹתָם
  choice: 用他们的杖
  rationale: מִשְׁעֵנָה指用作支撑的杖；译作“杖”简洁自然，并保持诗句中与“权杖”的平行。
- source_word: וּמִמִּדְבָּר מַתָּנָה
  choice: 他们从旷野起行，到了玛他拿
  rationale: 原文直译近于“从旷野，玛他拿”，省略了行进动词和目的地介词；结合18—20节行程站点的连续列举，补出“起行，到了”可自然表达其隐含关系，同时以脚注说明原文的简略形式。
theological_decisions:
- issue: בִּמְחֹקֵק在诗歌平行句中的含义
  choice: 按工具义译为“用权杖”
  alternative: “由立法者”或“按命令”
  rationale: 它与“用他们的杖”形成直接平行，工具义最符合句法与意象；脚注保留其也可指“立法者”的真实词义歧义，避免把后来的神学联想带入本段旷野之歌。
- issue: וּמִמִּדְבָּר מַתָּנָה的句法关系
  choice: 按行程转换译为“他们从旷野起行，到了玛他拿”
  alternative: 较直译为“从旷野，玛他拿”
  rationale: 上下文连续列出迁行站点，因此行程转换最合语境；不过原文没有明说行进动词，也没有在“玛他拿”前写“到”，故以脚注明示补译。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“众首领／百姓中的贵族”保持诗歌平行；“用权杖、用他们的杖”保留原文重复和仪式性意象。地名מַתָּנָה按常见圣经音译写作“玛他拿”。
