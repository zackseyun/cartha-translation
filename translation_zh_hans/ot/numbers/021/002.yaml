  to: 于是，以色列向耶和华许愿说：“你若确实把这群人交在我手中[a]，我就将他们的城邑献定毁灭[b]。”
  rationale: 修订使正文更直接地表达以色列所许的主动誓愿，并以“献定毁灭”保留ḥerem所含的献定与毁灭双重语义。脚注a校正了对希伯来文强调结构的说明；“这群人”使集合名词在现代汉语中更自然。
