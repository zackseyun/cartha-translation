base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/002.yaml
  text: Then Israel made a vow to Yahweh and said[a], “If you indeed give this people into my hand[b], then I will devote their cities to destruction.”
translation:
  language: zh_hans
  text: 于是，以色列向耶和华许愿说：“你若确实把这群人交在我手中[a]，我就将他们的城邑献定毁灭[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “确实把……交在”也可译作“真的把……交在”。希伯来文以不定式绝对形加强“交”的语气，意思近似“若你确实交给”。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“把他们的城邑置于禁毁令之下”。这里的希伯来词指将某物不可撤回地献定，置于毁灭之下；这称为“禁毁”（ḥerem）。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּדַּר ... נֶדֶר
  choice: 许愿
  rationale: 希伯来文采用同根结构，直译为“许了一个愿”；现代汉语用“许愿”即可自然表达正式、郑重的誓愿。
- source_word: לַיהוָה
  choice: 向耶和华
  rationale: 介词表示许愿所面对的对象；“向耶和华许愿”符合现代汉语表达，并以“耶和华”呈现神的专名 יהוה。
- source_word: אִם נָתֹן תִּתֵּן
  choice: 你若真的……交
  rationale: 不定式绝对形与限定动词连用，加强语气；“真的”保留强调，又不采用生硬的同词重复。
- source_word: הָעָם הַזֶּה
  choice: 这民
  rationale: עָם 是单数集合名词；“这民”简洁地保留原文的集合意义和指示结构。
- source_word: בְּיָדִי
  choice: 交在我手中
  rationale: 保留“手”的原文意象，同时在汉语中清楚表达交在以色列掌控之下。
- source_word: וְהַחֲרַמְתִּי
  choice: 我就使……归于毁灭
  rationale: Hiphil 形式在此指将对象置于 חרם 之下，即不可撤回地献定并加以毁灭；此译法既避免仅译作一般性的“毁灭”，也不把术语处理得过于晦涩。
- source_word: עָרֵיהֶם
  choice: 他们的城邑
  rationale: “城邑”可涵盖有城墙的城市及聚落，语体庄重，并与军事语境相合。
theological_decisions:
- issue: 战争誓愿中 חרם 的表达
  choice: 使他们的城邑归于毁灭
  alternative: 彻底毁灭他们的城邑；把他们的城邑置于禁毁令之下
  rationale: חרם 同时具有献定与毁灭的含义。正文以“归于毁灭”保留其正式、不可撤回的性质，脚注则说明其宗教与军事层面的术语内涵，不为经文加入伦理辩护或后来的教义解释。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“于是”承接叙事；引语保留誓愿的条件句结构。正文避免使用读者难以理解的音译术语，并用脚注交代 חרם 的特殊含义。
