base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/004.yaml
  text: Then they set out from Mount Hor by the way of the Red Sea[a], to go around the land of Edom[b], and the people became impatient on the way.
translation:
  language: zh_hans
  text: 他们从何珥山起程，取道红海[a]的路，为要绕过以东地；百姓在路上变得不耐烦[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“芦苇海”。希伯来文作 yam suph。
    reason: lexical_alternative
  - marker: b
    text: 或译“百姓灰心了”，或“百姓在路上泄了气”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: 起程
  rationale: נסע在旷野行程记述中常指拔营出发；“起程”简洁自然，并保留行程阶段开始的意味。
- source_word: מֵהֹר הָהָר
  choice: 从何珥山
  rationale: הֹר הָהָר是地名，按现代中文圣经地名惯例译作“何珥山”。
- source_word: דֶּרֶךְ יַם סוּף
  choice: 沿着通往红海的路
  rationale: דֶּרֶךְ表示道路或路线，这一结构可指通往红海方向的路线；主文采用传统且为读者熟悉的“红海”，并以脚注保留“芦苇海”的词义可能。
- source_word: לִסְבֹב
  choice: 为要绕过
  rationale: 不定式在此表示目的；“为要绕过”清楚表达他们选择这条路线是为了避开以东地。
- source_word: אֶת אֶרֶץ אֱדוֹם
  choice: 以东地
  rationale: אֶרֶץ与地名连用可指土地或疆域；“以东地”自然、简洁，不额外限定其政治性质。
- source_word: וַתִּקְצַר נֶפֶשׁ הָעָם
  choice: 百姓渐渐失去耐性
  rationale: קצר נפש直译近于“心灵变短”，是表示难以忍受、焦躁不耐的习语；“渐渐失去耐性”符合上下文，也保留过程感。该习语也可能强调灰心丧志，故收入脚注。
- source_word: בַּדָּרֶךְ
  choice: 在路上
  rationale: 介词ב在此最直接地作处所理解，即“在路上”；语境中也可能带有因路途而起的因果意味，但主文不将这一层意思明定。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“起程”“绕过”“失去耐性”贴近日常现代汉语，同时避免口语化过度。脚注标记均置于其实际说明的词语之后；第二个标记放在“失去耐性”之后，以准确对应希伯来语习语的译法分歧。
