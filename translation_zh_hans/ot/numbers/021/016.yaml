base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/016.yaml
  text: And from there they went to Beer[a]. That is the well about which Yahweh said to Moses, “Gather the people[b], and I will give them water.”
translation:
  language: zh_hans
  text: 他们从那里到了比珥[a]。这就是耶和华对摩西所说的那口井：“召集百姓，我好给他们水。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “比珥”是地名；其希伯来语名称与“井”一词相同（此处带有表示方向的词尾）。
    reason: 说明地名与普通名词之间的希伯来语关联，并交代本节形式中的方向词尾。
lexical_decisions:
- source_word: וּמִשָּׁם
  choice: 他们从那里
  rationale: 承接前文行程。希伯来文没有明说主语，中文按叙事语境补出“他们”，使表达自然。
- source_word: בְּאֵרָה
  choice: 到了比珥
  rationale: בְּאֵר加方向词尾表示朝比珥而去；译作“到了比珥”既表达移动，也把该词作为地名音译。
- source_word: הִוא הַבְּאֵר
  choice: 这就是那口井
  rationale: 保留原文的指认、解释作用，也呈现地名“比珥”与普通名词“井”之间的联系。
- source_word: אֲשֶׁר אָמַר יְהוָה לְמֹשֶׁה
  choice: 耶和华曾为这井对摩西说
  rationale: 关系代词所指的句法略有歧义；正文按其修饰“井”处理，并用“为这井”自然连接后面的直接引语。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的神圣四字名专名译法，而不以“主”这一称号代替。
- source_word: אֱסֹף אֶת הָעָם
  choice: 把百姓聚集起来
  rationale: 准确表达命令式“聚集”以及עָם在旷野叙事中所指的以色列百姓。
- source_word: וְאֶתְּנָה לָהֶם מָיִם
  choice: 我要给他们水
  rationale: 第一人称鼓励式接在命令之后，表达上帝的意愿或应许；“我要”自然保留这种意向力度。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用四字神名。正文保留为专名而不译成“主”；“耶和华”是现代中文圣经传统中最广为人知且庄重的形式。
- issue: וְאֶתְּנָה所表达的语气
  choice: 我要给他们水
  alternative: 好让我给他们水
  rationale: 该鼓励式可表示意愿、决心或目的。正文保留直接应许的力度，但不把它扩展为额外的神学主张。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。正文补出行程主语“他们”；保留短句节奏及神直接说话的力度。原英文所列脚注b与其正文并非真正替代关系，且原文关系从句最自然地修饰“井”，故不另设该脚注。
