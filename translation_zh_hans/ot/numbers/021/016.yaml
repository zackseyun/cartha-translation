revisions:
- from: 他们从那里到了比珥[a]。这就是那口井；耶和华曾为这井对摩西说：“把百姓聚集起来，我要给他们水。”
  to: 他们从那里到了比珥[a]。这就是耶和华对摩西所说的那口井：“召集百姓，我好给他们水。”
  rationale: 修订仅调整关系从句的中文语序及脚注的语言学精度，并将命令后的第一人称鼓励式译作中文自然的“我好给他们水”。这保留了原文将该地点认定为耶和华曾向摩西提及之井的意思，也不强加该语气究竟是未来、意愿还是目的的单一解释。
