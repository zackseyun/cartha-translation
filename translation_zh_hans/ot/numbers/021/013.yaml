base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/013.yaml
  text: From there they set out and camped on the other side of the Arnon[a], which is in the wilderness that extends from the border of the Amorites, for the Arnon is the border of Moab[b], between Moab and the Amorites.
translation:
  language: zh_hans
  text: 他们从那里起行，安营在亚嫩河的另一边[a]，那地方在旷野中；这旷野从亚摩利人的边界延伸出来[b]。因为亚嫩河是摩押的边界，介于摩押和亚摩利人之间。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “另一边”也可译作“亚嫩河以外”。希伯来语这一表达可指某一界线的对面或越过界线的地区，具体方位取决于观察者所在的位置。
    reason: lexical_alternative
  - marker: b
    text: 直译“从亚摩利人的边界出来”。这里描述旷野从亚摩利人的边界向外延伸。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשָּׁם נָסָעוּ
  choice: 他们从那里起行
  rationale: מִשָּׁם表示承接上一地点的“从那里”；נסע在行程叙事中常指拔营出发，“起行”简洁且符合现代中文圣经叙事语体。
- source_word: וַיַּחֲנוּ
  choice: 安营
  rationale: 准确表达停下并扎营，庄重而易懂。
- source_word: מֵעֵבֶר אַרְנוֹן
  choice: 在亚嫩河的另一边
  rationale: עֵבֶר可指界线或河流的另一侧；此译保留相对观察方位的含混，不擅自确定具体方向。
- source_word: אֲשֶׁר בַּמִּדְבָּר
  choice: 就是旷野中……的地方
  rationale: 关系从句所修饰对象在希伯来文中可产生一定结构张力；中文补出“地方”，使地理描述自然，同时不额外限定具体营地。
- source_word: הַיֹּצֵא מִגְּבוּל הָאֱמֹרִי
  choice: 从亚摩利人的边界延伸出来
  rationale: יֹצֵא字面为“出来”，在此描述旷野由边界向外伸展；“延伸出来”兼顾字面意象和地理语义。
- source_word: גְּבוּל
  choice: 边界
  rationale: 两处均指地域分界，“边界”在现代中文中清楚一致。
- source_word: הָאֱמֹרִי
  choice: 亚摩利人
  rationale: 原文形态为单数族称，但在此具有集合意义；中文族名“亚摩利人”自然涵盖该群体。
- source_word: כִּי
  choice: 因为
  rationale: 引出对前述地理位置的解释，保留原文的说明关系。
- source_word: בֵּין מוֹאָב וּבֵין הָאֱמֹרִי
  choice: 位于摩押和亚摩利人之间
  rationale: 重复的בֵּין清楚标示边界所分隔的双方；补出“位于”使中文句法完整。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而通顺的叙事语体。地名按通行中文译名处理；保留“亚嫩河的另一边”所含的方位不确定性。原英文资料的第二个脚注实际解释的是“从亚摩利人的边界延伸出来”，并非“摩押的边界”，因此不在“摩押”处设置容易误导的脚注。
