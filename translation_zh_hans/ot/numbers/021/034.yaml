  text: וַ/יֹּ֨אמֶר יְהוָ֤ה אֶל מֹשֶׁה֙ אַל תִּירָ֣א אֹת֔/וֹ כִּ֣י בְ/יָדְ/ךָ֞ נָתַ֧תִּי אֹת֛/וֹ וְ/אֶת כָּל עַמּ֖/וֹ וְ/אֶת אַרְצ֑/וֹ וְ/עָשִׂ֣יתָ לּ֔/וֹ כַּ/אֲשֶׁ֣ר עָשִׂ֗יתָ לְ/סִיחֹן֙ מֶ֣לֶךְ הָֽ/אֱמֹרִ֔י אֲשֶׁ֥ר יוֹשֵׁ֖ב בְּ/חֶשְׁבּֽוֹן־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/034.yaml
  text: And Yahweh said to Moses[a], “Do not fear him, for I have given him into your hand, along with all his people and his land. You shall do to him as you did to Sihon king of the Amorites[b], who lived in Heshbon.”
translation:
  language: zh_hans
  text: 耶和华对摩西说：“不要怕他，因为我已经把他和他的全体人民，以及他的土地，都交在你手中[a]。你要怎样对待住在希实本的亚摩利王西宏，也要照样对待他。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “交在你手中”是希伯来语惯用语，意思是“交在你权下，任你处置”。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的专名形式来呈现四字神名，而不以“主”替代原文专名。
- source_word: אַל תִּירָא אֹתוֹ
  choice: 不要怕他
  rationale: 直接表达 ירא 的禁止式含义，简洁、自然，并保留以“他”为恐惧对象。
- source_word: בְיָדְךָ נָתַתִּי אֹתוֹ
  choice: 我已经把他……交在你手中
  rationale: 完成式 נָתַתִּי 表明此事在神的宣告中已确定；“交在你手中”保留希伯来语意象，也能自然表示交由掌控。
- source_word: אֹתוֹ וְאֶת כָּל עַמּוֹ וְאֶת אַרְצוֹ
  choice: 他和他的全体人民，以及他的土地
  rationale: 完整保留三个并列受词；以“以及”使现代汉语层次清楚。
- source_word: וְעָשִׂיתָ לּוֹ כַּאֲשֶׁר עָשִׂיתָ
  choice: 你要怎样对待……也要照样对待他
  rationale: עשה ל 在此为“对某人行事、对待某人”；中文采用前置比较对象的结构，既自然又准确保留类比关系。
- source_word: לְסִיחֹן מֶלֶךְ הָאֱמֹרִי
  choice: 亚摩利王西宏
  rationale: 按现代汉语自然语序表达“西宏，亚摩利人的王”，不增加原文没有的解释。
- source_word: אֲשֶׁר יוֹשֵׁב בְּחֶשְׁבּוֹן
  choice: 住在希实本的
  rationale: 分词 יוֹשֵׁב 描述其居住地点；“住在”较“居于”更符合现代标准汉语，同时保持庄重。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威；上主
  rationale: 原文使用神的专名而非 אֲדֹנָי（主）；译为“耶和华”可在简体中文传统中明确保留专名功能，避免以称号取代。
- issue: 神所宣告之交付的时态与确定性
  choice: 我已经……交在你手中
  alternative: 我要……交在你手中
  rationale: 希伯来语完成式 נָתַתִּי 从说话者角度将交付呈现为已经确定；译文保留这种已然、确定的语气，而不将其弱化为单纯未来。
translation_notes:
  register: 采用自然、庄重的现代标准普通话。保留“交在你手中”的源语意象，并用脚注说明其惯用含义。比较句调整为符合汉语习惯的“怎样……也照样……”结构。
