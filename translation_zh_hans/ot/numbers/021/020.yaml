base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/020.yaml
  text: and from Bamoth to the valley that is in the field of Moab[a], to the top of Pisgah[b], which overlooks the face of the wasteland.
translation:
  language: zh_hans
  text: 又从巴末到了摩押田野中的山谷，再到毗斯迦山顶；这山顶俯瞰着荒原[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译作“耶示门”，把这个希伯来词视为地域名称，而不是表示荒凉之地的普通名词。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译为“荒原的表面（或面前）”；这是表示面向或俯瞰荒原一带的说法。
    reason: cultural_note
lexical_decisions:
- source_word: וּמִבָּמוֹת
  choice: 又从巴末
  rationale: 保留连接词和介词所表达的行程延续关系；בָּמוֹת在此是行程中的地名，采用传统音译“巴末”，不译作“高处”。
- source_word: הַגַּיְא
  choice: 山谷
  rationale: גַּיְא可指山谷或沟谷；“山谷”自然清楚，也适合本节的地理语境。
- source_word: אֲשֶׁר בִּשְׂדֵה מוֹאָב
  choice: 摩押田野中的
  rationale: שָׂדֶה本义为“田野”，在地理语境中也可泛指乡野或地域；译文保留原文的田野意象。
- source_word: רֹאשׁ הַפִּסְגָּה
  choice: 毗斯迦山顶
  rationale: רֹאשׁ在地形语境中指顶端或山顶；“毗斯迦”按专名处理，“山顶”则使现代中文含义明确。
- source_word: וְנִשְׁקָפָה
  choice: 这山顶俯瞰着
  rationale: 该词表达从高处朝向或俯视某地；用指示性分句自然连接前面的“毗斯迦山顶”，同时保留其地形关系。
- source_word: עַל־פְּנֵי
  choice: 俯瞰着
  rationale: 该短语字面涉及“……的表面／面前”，在此与נשׁקף合用，表达面向并俯瞰下方地域的意思；正文采用自然的现代汉语，字面意象在脚注说明。
- source_word: הַיְשִׁימֹן
  choice: 荒原
  rationale: יְשִׁימוֹן可指荒凉、无人之地，也可能近似地域专名；正文译作“荒原”以传达其描述性含义，专名读法列入脚注。
