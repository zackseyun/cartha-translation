base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/032.yaml
  text: Then Moses sent men to spy out Jazer[a], and they captured its villages and dispossessed the Amorites who were there.
translation:
  language: zh_hans
  text: 摩西派人去侦察雅谢；他们攻取了属雅谢的村镇[a]，摩西又逐出了那里的亚摩利人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译是“它的女儿们”，这是希伯来语的说法，指一座城所辖或依附于它的村镇。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: 派人
  rationale: 叙事中 שׁלח 表示差派；原文未明说宾语，但 לְרַגֵּל 表明所派的是执行侦察任务的人，现代汉语补出“人”更自然。
- source_word: לְרַגֵּל
  choice: 去窥探
  rationale: רגל 的加强式在此指军事侦察；“窥探”保留暗中察看敌地的含义，也与《民数记》相关语境相称。
- source_word: יַעְזֵר
  choice: 雅谢
  rationale: 按现代中文圣经地名的通行译法音译该地名。
- source_word: וַיִּלְכְּדוּ
  choice: 又攻取了
  rationale: לכד 在征战语境中指夺取或攻占；“攻取”既体现军事行动，也符合中文历史叙事语体。
- source_word: בְּנֹתֶיהָ
  choice: 属雅谢的村镇
  rationale: 字面为“它的女儿们”，是希伯来地理用语，指主城所辖或依附于它的聚落；“属雅谢的村镇”清楚表达从属关系，同时以脚注保留原文意象。
- source_word: וַיִּירַשׁ
  choice: 赶走
  rationale: ירש 在征服语境中可指夺取土地并逐出原居民；本句宾语是当地的亚摩利人，因此“赶走”直接表达使其失去原居之地这一面。
- source_word: הָאֱמֹרִי
  choice: 亚摩利人
  rationale: 原文以单数形式作集合名词，现代汉语自然译为族群名称“亚摩利人”。
- source_word: אֲשֶׁר שָׁם
  choice: 那里的
  rationale: 关系从句所指为当地的亚摩利人；前置定语符合现代汉语表达。
