  text: And we shot at them[a]; Heshbon has perished as far as Dibon, and we laid waste as far as Nophah[b], which reaches to Medeba.
translation:
  language: zh_hans
  text: 我们射击了他们[a]；希实本直到第本都毁灭了；我们一直毁坏到挪法[b]，直到米底巴。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 开头这个希伯来语短句很难确定，也可理解为“我们击败了他们”或“他们的权势毁灭了”。
    reason: textual_variant
  - marker: b
    text: 译作“我们一直毁坏”的原文形式也不确定；有人作其他解释，但在这首胜利之歌中，表示毁坏的动词较符合上下文。
    reason: textual_variant
lexical_decisions:
- source_word: וַנִּירָם
  choice: 我们射击他们
  rationale: 此词形式和词义均疑难。按所给辅音及一复主语、三复宾语后缀理解为与射击有关的动词，能保留胜利之歌中鲜明的战争意象；其他主要解释列入脚注。
- source_word: אָבַד
  choice: 毁灭了
  rationale: 该动词表示灭亡、毁坏；这里用完成性的表达，符合诗歌对城邑败亡的宣告。
- source_word: חֶשְׁבּוֹן
  choice: 希实本
  rationale: 采用现代中文圣经地名的通行音译。
- source_word: עַד דִּיבוֹן
  choice: 直到底本
  rationale: עַד 表示空间范围的终点；“直到”自然保留其疆域延伸含义。
- source_word: וַנַּשִּׁים
  choice: 我们使城邑荒废
  rationale: 原文形式疑难；结合征服之歌的上下文，按表示毁坏、使荒凉的第一人称复数动词处理。“城邑”为中文中使隐含受事明确的补语，并非另立专名；不确定性列入脚注。
- source_word: עַד נֹפַח
  choice: 直到挪法
  rationale: עַד 表示范围终点；挪法按通行形式音译。
- source_word: אֲשֶׁר עַד מֵידְבָא
  choice: 就是直到米底巴
  rationale: 关系词 אֲשֶׁר 所引短语的句法不够明确。译文以同位说明衔接，同时避免过度断定它究竟修饰挪法还是前述毁坏范围。
- source_word: מֵידְבָא
  choice: 米底巴
  rationale: 采用现代中文圣经地名的通行音译。
