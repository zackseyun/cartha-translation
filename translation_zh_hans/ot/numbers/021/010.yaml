  text: Then the sons of Israel set out and camped at Oboth[a].
translation:
  language: zh_hans
  text: 以色列人启程，在阿伯安营。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: 启程
  rationale: נסע在旷野行程记载中指拔营出发、继续前行。“启程”简洁自然，并保留行程推进的意味。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 字面为“以色列的众子”，但在此是指以色列民族整体的固定族称。现代汉语以“以色列人”表达最自然、准确，也不把所指不必要地限于男性。
- source_word: וַיַּחֲנוּ
  choice: 安营
  rationale: חנה是旷野行程中表示驻扎、扎营的常用动词。“安营”符合现代汉语圣经叙事的庄重语体。
- source_word: בְּאֹבֹת
  choice: 在阿伯
  rationale: אֹבֹת是地名，采用音译“阿伯”；介词ב在安营的行程公式中自然译为“在”。
- source_word: וַ
  choice: （以语序承接，不另译）
  rationale: 句首叙事性连接词推动事件顺序。现代汉语可通过两个连续谓语“启程，在……安营”自然体现承接关系，无须机械译作“然后”或“于是”。
