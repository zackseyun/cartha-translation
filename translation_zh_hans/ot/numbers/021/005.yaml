    rationale: 该动词为第二人称阳性单数，不是复数。译为“你”保留原文的单数形式；该单数指向谁可由上下文理解，不宜以译文或注释断定为上帝与摩西共同作为语法主语。
  - severity: medium
    issue: “粗劣的粮食”对 קְלֹקֵל 的贬抑语义不足够准确
    rationale: 该罕见词强调被说话者视为轻贱、低劣或无价值；“粗劣”容易理解为工艺粗糙。
  - severity: low
    issue: “抨击”语体略偏现代评论文，“粮食”语义略窄
    rationale: “发怨言”更直接呈现本节的敌对抱怨；“食物”更适合缺乏食物和水的语境，并可在两处保持词语重复。
