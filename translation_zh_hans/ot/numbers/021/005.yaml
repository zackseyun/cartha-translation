  rationale: 修正第二人称单数的关键语法错误，避免将动词主语无根据地复数化。以“向……发怨言”传达原文在敌对抱怨语境中的逆向语气；将两处 לֶחֶם 统一译为“食物”以保留重复；将末语调整为“低劣的食物”，并以脚注保留该罕见形容词的语义范围。
