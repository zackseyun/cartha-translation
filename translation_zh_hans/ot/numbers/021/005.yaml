base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/005.yaml
  text: 'And the people spoke against God and against Moses: “Why have you brought us up out of Egypt to die in the wilderness? For there is no bread and no water[a], and we loathe this miserable bread.”'
translation:
  language: zh_hans
  text: 百姓向上帝和摩西发怨言，说：“你为什么把我们从埃及带出来，让我们死在旷野里？这里没有食物，也没有水；我们厌恶这种低劣的食物[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “低劣的”或译“可鄙的”或“毫无价值的”。希伯来语这个罕见的形容词表达说话者对上帝所赐食物的轻蔑。
    reason: 说明罕见的希伯来语形容词的词义范围，并表明贬抑语气出自百姓的抱怨。
lexical_decisions:
- source_word: וַיְדַבֵּר הָעָם בֵּאלֹהִים וּבְמֹשֶׁה
  choice: 百姓抨击上帝和摩西
  rationale: דבר与介词ב本可表示对、向或论及，但后面的引语明显带有敌对和指责意味。“抨击”自然传达逆向语气，同时避免扩展为“亵渎”。
- source_word: לָמָה הֶעֱלִיתֻנוּ מִמִּצְרַיִם
  choice: 你们为什么把我们从埃及带出来
  rationale: הֶעֱלִיתֻנוּ为复数，所责问的对象是上帝和摩西；中文用“你们”保留这一语法特点。“带出来”自然表达使役意义和出埃及的方向。
- source_word: לָמוּת בַּמִּדְבָּר
  choice: 让我们死在旷野里
  rationale: 目的或结果均可由上下文理解；“让我们死在”在现代汉语中自然保留百姓指责的语气。“旷野”比“沙漠”更准确涵盖מִדְבָּר。
- source_word: כִּי אֵין לֶחֶם וְאֵין מַיִם
  choice: 这里没有粮食，也没有水
  rationale: לֶחֶם既可指饼，也可泛指食物；“粮食”适合此处，并与末句同一词的重复相呼应。补出“这里”符合汉语表达，但不增加新的实质信息。
- source_word: וְנַפְשֵׁנוּ קָצָה
  choice: 我们厌恶
  rationale: 直译近于“我们的心厌烦／我们的性命嫌恶”；“我们厌恶”以自然汉语传达强烈反感，不把נֶפֶשׁ机械译作“灵魂”。
- source_word: בַּלֶּחֶם הַקְּלֹקֵל
  choice: 这种粗劣的粮食
  rationale: קְלֹקֵל是罕见形容词，表达轻蔑、低劣或毫无价值之意。“粗劣”保留贬斥语气；“这种”虽非独立指示词，却自然体现定冠词和眼前供食的语境。
theological_decisions:
- issue: 百姓对上帝和摩西说话的性质
  choice: 译为“抨击上帝和摩西”
  alternative: “对上帝和摩西说”或“谈论上帝和摩西”
  rationale: 介词结构本身有一定范围，但引语显然是敌对的责问。译出逆向语气忠于语境，又不额外加入“亵渎”等神学判断。
- issue: 责问中的复数对象
  choice: 译为“你们为什么把我们……”
  alternative: 按中文传统语感用单数“你为什么……”
  rationale: 希伯来语动词הֶעֱלִיתֻנוּ为第二人称阳性复数，呼应前面的上帝和摩西。保留复数可避免把责任只归给摩西或只归给上帝。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“旷野”“上帝”等用语保持经文语体；引语则保留百姓直接、强烈的责问。将לֶחֶם两次都译作“粮食”，既自然又保存原文刻意形成的词语重复和抱怨中的张力。
