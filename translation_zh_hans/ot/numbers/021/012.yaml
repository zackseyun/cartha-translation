  yaml_path: translation/ot/numbers/021/012.yaml
  text: From there they set out and camped by the Wadi Zered[a].
translation:
  language: zh_hans
  text: 他们从那里起行，在撒烈谷[a]安营。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “撒烈谷”也可译作“撒烈溪谷”或“撒烈溪流”；希伯来语 naḥal 可指干河谷、溪谷或季节性河道。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשָּׁם
  choice: 从那里
  rationale: 自然准确地表达从上一地点出发，并保持行程叙事的衔接。
- source_word: נָסָעוּ
  choice: 起行
  rationale: נסע在旷野行程叙事中常指拔营出发；“起行”简洁庄重，也符合现代中文圣经地理叙事的语域。
- source_word: וַיַּחֲנוּ
  choice: 安营
  rationale: 准确表达חנה的驻扎、扎营之意，比“露营”更符合迁徙行程的语境。
- source_word: בְּנַחַל
  choice: 在……谷
  rationale: נַחַל可指干河谷、溪谷或季节性水道；正文采用自然简明的“谷”，介词בְּ按其地点义译为“在”。
- source_word: זָרֶד
  choice: 撒烈
  rationale: 作为地名按传统且通行的现代中文圣经译名音译。
