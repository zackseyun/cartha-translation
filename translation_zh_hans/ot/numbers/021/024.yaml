source:
  edition: WLC
  text: וַ/יַּכֵּ֥/הוּ יִשְׂרָאֵ֖ל לְ/פִי חָ֑רֶב וַ/יִּירַ֨שׁ אֶת אַרְצ֜/וֹ מֵֽ/אַרְנֹ֗ן עַד יַבֹּק֙ עַד בְּנֵ֣י עַמּ֔וֹן כִּ֣י עַ֔ז גְּב֖וּל בְּנֵ֥י עַמּֽוֹן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/024.yaml
  text: Israel struck him with the edge of the sword and took possession of his land from the Arnon as far as the Jabbok[a], as far as the sons of Ammon, for the border of the sons of Ammon was strong.
translation:
  language: zh_hans
  text: 以色列人以刀锋击打了他，占领了他的土地，从亚嫩河直到雅博河，直到亚扪人的领地，因为亚扪人的边界坚固。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “边界坚固”：也可译作“边界强大”。原文没有说明这边界的力量或坚固具体是出于地势、设防或其他因素。
    reason: 保留עַז修饰“边界”时的语义宽度，不将其具体化为天然屏障或军事防御。
lexical_decisions:
- source_word: וַיַּכֵּהוּ
  choice: 击败了他
  rationale: נכה本义为“击打”。在战争及随后占领土地的语境中，“击败”自然表达军事胜利，又不像“杀死”那样明确断定其死亡。
- source_word: לְפִי חָרֶב
  choice: 用刀刃
  rationale: 保留希伯来语“刀之口”的形象意义，同时符合现代汉语表达；此处“刀”泛指作战用的剑或刀剑。
- source_word: וַיִּירַשׁ
  choice: 占领了
  rationale: ירש在此指通过征战取得并占有土地。“占领”准确传达军事语境，不采用容易让人联想到继承财产的“承受”。
- source_word: אַרְצוֹ
  choice: 他的土地
  rationale: 直接对应אֶרֶץ及第三人称单数所有格，不把它现代政治化为“国家”。
- source_word: מֵאַרְנֹן עַד יַבֹּק
  choice: 从亚嫩河直到雅博河
  rationale: מִן…עַד表示地域范围；在两个专名后补出“河”，帮助现代读者识别这些地理界线。
- source_word: עַד בְּנֵי עַמּוֹן
  choice: 也就是直到亚扪人的地界
  rationale: 字面是“直到亚扪人”。结合下句的“边界”，补出“地界”可清楚表示征服所到之处；“亚扪人”是בני עמון在汉语中自然、准确的族称。
- source_word: כִּי
  choice: 因为
  rationale: 明确表达后句对征服止于此处所作的原因说明。
- source_word: עַז
  choice: 坚固
  rationale: עַז基本义为强、有力；修饰边界时，“坚固”比抽象的“强”更符合汉语，但不进一步具体解释为城防或天然屏障。
- source_word: גְּבוּל בְּנֵי עַמּוֹן
  choice: 亚扪人的边界
  rationale: גְּבוּל可指边界或疆界；“边界”保持原文概括性，未擅自说明其坚固的具体性质。
theological_decisions:
- issue: בְּנֵי עַמּוֹן的族称表达
  choice: 亚扪人
  alternative: 亚扪的子孙
  rationale: 该希伯来语亲属表达在此具有族群指称功能。现代汉语以“亚扪人”最自然，也不会把所指误限为男性后裔；这不改变其民族身份。
- issue: עַז גְּבוּל所指的障碍性质
  choice: 亚扪人的边界坚固
  alternative: 亚扪人的边境防守严密／亚扪人的边界是雅谢
  rationale: 辅音文本直接支持“边界坚固”。不把“坚固”具体化为军事防守，也不采纳涉及地名“雅谢”的文本修订，从而保留原文措辞及其可能涵盖天然或军事屏障的开放性。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“亚嫩河”“雅博河”按常用圣经地名译法处理。正文用“刀刃”保留原文意象，用“击败”避免过度断定西宏本人被杀；用“亚扪人”自然表达族群称谓。脚注标记[a]已置于正文相关句末。
