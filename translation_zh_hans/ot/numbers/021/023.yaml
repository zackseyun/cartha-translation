base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/023.yaml
  text: But Sihon did not allow Israel to pass through his territory[a]. So Sihon gathered all his people and went out to meet Israel in the wilderness[c][b]. He came to Jahaz and fought against Israel.
translation:
  language: zh_hans
  text: 但西宏不准以色列人从他的领地经过[a]。于是西宏召集他的全体百姓[b]，到旷野去迎见以色列人。他来到雅杂，与以色列人交战。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“穿过他的疆界。”这里的希伯来词既可指“疆界”，也可指疆界以内的“领地”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来原文作“他的全体百姓”，并未明确说“军队”，尽管交战语境表明其中包括武装人员。
    reason: lexical_alternative
lexical_decisions:
- source_word: נָתַן ... עֲבֹר
  choice: 不准……经过
  rationale: נָתַן与不定式连用并受否定时，在这里表达不给予通行许可；“不准……经过”准确而自然。
- source_word: בִּגְבֻלוֹ
  choice: 从他的领地
  rationale: גְּבוּל既可指边界，也可指边界以内的地域；本句谈的是穿越西宏辖地，因此译作“领地”更清楚。
- source_word: וַיֶּאֱסֹף ... אֶת כָּל עַמּוֹ
  choice: 召集他的全体百姓
  rationale: 原文明确说“他的全体百姓”，没有直接使用“军队”一词；保留这一表述，不把军事语境中的推断写入正文。
- source_word: לִקְרַאת יִשְׂרָאֵל
  choice: 迎战以色列人
  rationale: לִקְרַאת本身可表示前去迎接或迎面相遇；结合随后明确的交战行动，此处“迎战”自然表达敌对相遇，同时不额外加入军队等信息。
- source_word: הַמִּדְבָּרָה
  choice: 出到旷野
  rationale: 词尾-ה表示朝向旷野的运动；“出到旷野”兼顾方向性和现代汉语叙事的自然表达。
- source_word: יָהְצָה
  choice: 雅杂
  rationale: 采用现代中文圣经地名中常见的译名“雅杂”，方向词尾不属于地名本身。
- source_word: וַיִּלָּחֶם בְּיִשְׂרָאֵל
  choice: 与以色列人交战
  rationale: לחם的此种结构表示敌对作战；“与……交战”准确、庄重，也符合现代汉语。
- source_word: וְלֹא
  choice: 但……不
  rationale: 连接词在上下文中与先前请求通行形成转折，译作“但”比机械的“和”更符合篇章关系。
theological_decisions: []
