revisions:
- from: 但西宏不准以色列人从他的领地经过[a]。于是，西宏召集他的全体百姓[b]，出到旷野迎战以色列人。他来到雅杂，与以色列人交战。
  to: 但西宏不准以色列人从他的领地经过[a]。于是西宏召集他的全体百姓[b]，到旷野去迎见以色列人。他来到雅杂，与以色列人交战。
  rationale: 将“迎战”改为“迎见”，以避免在原文尚仅表述前往会遇之处提前明说作战；后句“交战”完整保留原文的敌对行动。同步微调脚注a，使“边界”这一词义在现代汉语中更明确，且不改变正文含义。
