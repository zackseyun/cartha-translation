base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/029.yaml
  text: Woe to you[a], Moab! You are ruined, people of Chemosh! He has made his sons fugitives and his daughters captives to Sihon, king of the Amorites.
translation:
  language: zh_hans
  text: 摩押啊，你有祸了[a]！基抹的民哪，你灭亡了！他使自己的儿子成为逃亡者，又使自己的女儿被掳给亚摩利人的王西宏。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “自己的儿子”和“自己的女儿”也可译作“摩押的儿子”和“摩押的女儿”，即把原文的代词后缀理解为指摩押，而不是基抹。
    reason: alternative_reading
lexical_decisions:
- source_word: אוֹי לְךָ
  choice: 你有祸了
  rationale: אוֹי是表达哀叹与灾祸的感叹词；“你有祸了”保留对摩押直接宣告灾难的诗歌力度，也符合现代汉语表达。
- source_word: אָבַדְתָּ
  choice: 你灭亡了
  rationale: 该完成式描写摩押遭受毁灭性败亡；“灭亡了”紧贴אבד的语义，并适合战败嘲歌的语境。
- source_word: עַם כְּמוֹשׁ
  choice: 基抹的民
  rationale: 构造关系表明这民族属于或认同于摩押神基抹；译法简洁、自然。
- source_word: נָתַן
  choice: 使……交在……手中
  rationale: נָתַן本义为“给、交出”，在此与“逃亡、被掳”的结果状态相连；此译既体现结果，也明确被交给西宏的含义。
- source_word: בָּנָיו פְּלֵיטִם
  choice: 使自己的儿子逃亡
  rationale: 阳性单数后缀按最近先行词基抹理解；פְּלֵיטִם指逃脱、流亡之人，“逃亡”保留战败后奔逃的意象。
- source_word: וּבְנֹתָיו בַּשְּׁבִית
  choice: 使自己的女儿被掳
  rationale: 继续将后缀理解为指基抹；“被掳”自然表达落入俘虏状态，并与前句形成平行。
- source_word: לְמֶלֶךְ אֱמֹרִי סִיחוֹן
  choice: 交在亚摩利人的王西宏手中
  rationale: לְ标示交付的对象；“交在……手中”是自然、庄重的汉语，完整保留西宏作为亚摩利人之王的身份。
theological_decisions:
- issue: בָּנָיו和בְנֹתָיו中第三人称阳性单数后缀的所指
  choice: 理解为指基抹，译作“自己的儿子”和“自己的女儿”
  alternative: 理解为统指摩押，译作“摩押的儿子”和“摩押的女儿”
  rationale: 最近的语法先行词是基抹，诗歌也借基抹无法保护自己的人民来讥讽摩押；但后缀也可能回指作为整体的摩押，因此以脚注保留另一种理解。
translation_notes:
  register: 采用现代、庄重而可朗读的标准普通话，保留古代战歌兼嘲歌的呼告和强烈语气。“基抹”“西宏”沿用中文圣经中通行的人名、神名译法；避免额外加入宗派性解释。
