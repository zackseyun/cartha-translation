revisions:
- from: 摩押啊，你有祸了[a]！基抹的民哪，你灭亡了！他使自己的儿子逃亡，使自己的女儿被掳，交在亚摩利人的王西宏手中。
  to: 摩押啊，你有祸了[a]！基抹的民哪，你灭亡了！他使自己的儿子成为逃亡者，又使自己的女儿被掳给亚摩利人的王西宏。
  rationale: 修订仅澄清中文句法，并以“成为逃亡者／被掳给”呈现原文中儿子与女儿的平行结果及其与西宏的关系。保留“他”指基抹的主阅读，也完整保留脚注中的另一种所指理解。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T04:56:39Z'
review_pass:
  verdict: revise
  source_fidelity: 整体忠实呈现了对摩押的哀叹、其灭亡、作为“基抹的民”的身份，以及儿子逃亡、女儿被掳给西宏的战败图景；脚注也恰当保留了人称后缀可能回指摩押的歧义。不过，现译末尾“使自己的女儿被掳，交在亚摩利人的王西宏手中”在汉语句法上容易读成只有“女儿”被“交在”西宏手中，且“被掳”与“交在……手中”形成不够协调的重复。
  naturalness: “摩押啊，你有祸了！基抹的民哪”庄重、可朗读。“自己的儿子／女儿”可表达后缀指向基抹，但后半句需要调整为更自然清楚的汉语，并使“逃亡者／俘虏”的平行关系显明。
  terminology: “基抹”“摩押”“亚摩利人”“西宏”均合乎通行中文圣经名称。“基抹的民”可保留；“逃亡者”和“俘虏”比动词式“逃亡”“被掳”更准确对应原文的名词性结果状态。
  issues:
  - severity: medium
    issue: 末句的句法附着和并列关系不清楚。
    rationale: “使自己的女儿被掳，交在亚摩利人的王西宏手中”会使“交在……手中”只附着于“女儿”，并与“被掳”重复；原文将儿子成为逃亡者与女儿进入俘虏状态并列，并以西宏为交付／归属的对象。改为“使……成为逃亡者，又使……被掳给……”可自然保留这种关系。
  - severity: low
    issue: “逃亡”未显出原文复数名词“逃亡者”的结果状态。
    rationale: 译作“成为逃亡者”既保留战败后逃散的意象，也与“被掳”构成更清晰的平行。
  revised_text: 摩押啊，你有祸了[a]！基抹的民哪，你灭亡了！他使自己的儿子成为逃亡者，又使自己的女儿被掳给亚摩利人的王西宏。
