  yaml_path: translation/ot/numbers/021/017.yaml
  text: 'Then Israel sang this song: “Spring up[a], O well! Answer it!”'
translation:
  language: zh_hans
  text: '那时，以色列唱了这首歌：


    “井啊，涌上来吧！


    你们要回应它！”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָז
  choice: 那时
  rationale: 作时间副词，引出叙事中的下一行动；“那时”自然、庄重，也保留与前文的时间衔接。
- source_word: יָשִׁיר
  choice: 唱了
  rationale: 虽为未完成式，但与 אָז 连用时在叙事中具有过去时效力；译作“唱了”符合现代汉语叙事习惯。
- source_word: יִשְׂרָאֵל
  choice: 以色列
  rationale: 此处指以色列民，沿用标准专名译法；汉语中可用集合名词作主语。
- source_word: הַשִּׁירָה הַזֹּאת
  choice: 这首歌
  rationale: 定冠词名词加指示词，直译为“这首歌”，并与随后引述的诗歌相称。
- source_word: עֲלִי
  choice: 涌上来吧
  rationale: 阴性单数祈使式，所呼唤的对象是“井”；在水井语境中，“涌上来”比生硬的“上来”更自然，同时保留水从井中升起的意象。
- source_word: בְאֵר
  choice: 井啊
  rationale: 该词在此为呼格；“井啊”清楚表现直接呼唤，并保持诗歌语气。
- source_word: עֱנוּ לָהּ
  choice: 你们要向它回应
  rationale: ענה 的基本意思是“回答、回应”；复数祈使式指向歌唱者，而 לָהּ 指向阴性的“井”。“向它回应”保留原文可能涉及应答式或轮唱式歌唱的含义，不直接改释为“歌唱”。
