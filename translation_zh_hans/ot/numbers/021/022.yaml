base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/022.yaml
  text: Let me pass through your land. We will not turn aside into field or vineyard[a], and we will not drink water from a well. We will go by the king’s road until we have passed through your territory.
translation:
  language: zh_hans
  text: “请让我从你的国土经过。我们不转入田地或葡萄园，也不喝井里的水；我们走王的大路[a]，直到越过你的疆界。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“王道”，即王的大道。
    reason: 说明传统简译，并避免现代汉语中“王道”可能被理解为政治伦理观念。
lexical_decisions:
- source_word: אֶעְבְּרָה
  choice: 请让我……经过
  rationale: 该词是עבר的第一人称单数祈愿式，在外交请求中表达礼貌的恳求；“请让我”自然体现这一语气，并保留原文由单数转为复数的变化。
- source_word: בְאַרְצְךָ
  choice: 你的国土
  rationale: אֶרֶץ在这里指受王统辖的土地；“国土”既自然，又明确其政治地理含义。
- source_word: לֹא נִטֶּה
  choice: 我们不偏入
  rationale: נטה在行路语境中指离开既定路线；“偏入”保留转离道路、进入田园的动作意象。
- source_word: בְּשָׂדֶה וּבְכֶרֶם
  choice: 田地或葡萄园
  rationale: 两个单数名词在此作泛指；现代汉语无需添加量词，且“或”自然表达两类耕作区域均不进入。
- source_word: לֹא נִשְׁתֶּה מֵי בְאֵר
  choice: 也不喝井里的水
  rationale: 原文直指“井水”；此译清楚表达他们不会取用当地水源。
- source_word: בְּדֶרֶךְ הַמֶּלֶךְ
  choice: 只走王的大路
  rationale: 字面为“王的道路”，指主要的公共通道。“王的大路”比单说“王道”更不易被现代读者误解为政治伦理概念；“只”在汉语中自然呈现与前两项保证之间的排他对照。
- source_word: נֵלֵךְ
  choice: 我们……走
  rationale: הלך是普通的行走、前行用语；“走”简明自然。
- source_word: עַד אֲשֶׁר נַעֲבֹר
  choice: 直到越过
  rationale: 该结构标明通行的终点；“直到越过”保留完成跨越的含义。
- source_word: גְּבֻלֶךָ
  choice: 你的疆界
  rationale: גְּבוּל主要指边界、疆界；“疆界”保留具体的领土边界意象，同时符合庄重的叙事语体。
theological_decisions: []
