  text: וַ/יְשַׁלַּ֨ח יְהוָ֜ה בָּ/עָ֗ם אֵ֚ת הַ/נְּחָשִׁ֣ים הַ/שְּׂרָפִ֔ים וַֽ/יְנַשְּׁכ֖וּ אֶת הָ/עָ֑ם וַ/יָּ֥מָת עַם רָ֖ב מִ/יִּשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/006.yaml
  text: So Yahweh sent among the people the fiery serpents[a], and they bit the people, and many from Israel died.
translation:
  language: zh_hans
  text: 于是，雅威差遣火蛇[a]进入百姓中间；火蛇咬了百姓，以色列人中有许多人死了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“毒蛇”或“灼热的蛇”。希伯来文直译为“那些蛇，那些燃烧的蛇”。
    reason: 保留הַשְּׂרָפִים可能描述蛇本身、毒性或咬伤灼烧感的词义歧义。
lexical_decisions:
- source_word: וַיְשַׁלַּח
  choice: 放到
  rationale: שׁלח在叙事中表示“差出、送出、放出”。“把……放到……中间”在现代汉语中自然，也保留了雅威主动使蛇进入百姓中的意思。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以常见的现代汉语音译呈现四字神名，不用称号替代原文中的专名。
- source_word: בָּעָם
  choice: 百姓中间
  rationale: 这里的介词בְּ主要表示蛇被置于百姓所在的范围之内；译作“中间”避免增添“攻击”这一解释。
- source_word: הַנְּחָשִׁים הַשְּׂרָפִים
  choice: 火蛇
  rationale: נְחָשִׁים意为“蛇”，שְׂרָפִים意为“燃烧的、灼热的”。“火蛇”简洁保留希伯来文的火焰或灼烧意象；其可能指毒蛇或蛇咬后的灼烧感，收入脚注说明。
- source_word: וַיְנַשְּׁכוּ
  choice: 咬了
  rationale: נשׁך的基本义是“咬”；直译在汉语中清楚自然。
- source_word: וַיָּמָת
  choice: 死了
  rationale: מות是普通的“死”，无需加强为“灭亡”或其他带解释性的表达。
- source_word: עַם רָב
  choice: 许多人
  rationale: 该短语表达人数众多；在本句中译作“许多人”符合现代汉语习惯。
- source_word: מִיִּשְׂרָאֵל
  choice: 以色列中
  rationale: מן在这里表示从以色列群体之中；“以色列中”准确而自然地呈现这一范围。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文使用的是神的专名而非称号。“雅威”直接音译该名，既不以“主”替换，也不在经文中加入原文没有的解释。
- issue: הַשְּׂרָפִים在本处的含义
  choice: 火蛇
  alternative: 毒蛇；灼热的蛇
  rationale: “火蛇”保留原文的形象和词义张力，不武断认定该词只描述毒性、颜色，还是咬伤后的灼烧感；其他可能译法列于脚注。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“百姓”与民数记叙事语域相称；分成两句以清楚呈现希伯来文连续叙事动作。
