  text: וַ/יִּשְׁמַ֞ע הַ/כְּנַעֲנִ֤י מֶֽלֶךְ עֲרָד֙ יֹשֵׁ֣ב הַ/נֶּ֔גֶב כִּ֚י בָּ֣א יִשְׂרָאֵ֔ל דֶּ֖רֶךְ הָ/אֲתָרִ֑ים וַ/יִּלָּ֨חֶם֙ בְּ/יִשְׂרָאֵ֔ל וַ/יִּ֥שְׁבְּ מִמֶּ֖/נּוּ שֶֽׁבִי־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/001.yaml
  text: When the Canaanite king of Arad[a], who lived in the Negev, heard that Israel was coming by the way of Atharim, he fought against Israel and took some of them captive.
translation:
  language: zh_hans
  text: 住在南地的迦南人亚拉得王，听说以色列人正沿着亚他林之路[a]前来，就与以色列人交战，并掳走了他们中的一些人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “亚他林”一词含义不确定，可能是地名；有些人根据古代译本将它理解为“探子”或“侦察者”，因而理解为“探子之路”或“侦察者之路”。
    reason: 保留希伯来语难词的歧义及古代译本所反映的另一种理解，避免在替代译法中加入原文未明示的动作含义。
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: 听说
  rationale: 叙事中表示听到消息；“听说”自然体现王得知以色列行程这一信息。
- source_word: הַכְּנַעֲנִי מֶלֶךְ עֲרָד
  choice: 迦南人亚拉得王
  rationale: 保留定冠词所指明的族属身份，并将其与“亚拉得王”自然连用。
- source_word: יֹשֵׁב הַנֶּגֶב
  choice: 住在南地的
  rationale: 分词表示居住；“南地”是该地理区域在中文圣经语境中清楚而简洁的名称，不泛化为一般方位“南方”。
- source_word: כִּי בָּא יִשְׂרָאֵל
  choice: 以色列人正……前来
  rationale: כִּי引出听到的消息；完成式在此语境中指正在逼近的行动。“以色列人”按集体所指作自然中文表达。
- source_word: דֶּרֶךְ הָאֲתָרִים
  choice: 沿着亚他林之路
  rationale: 将难解的אֲתָרִים保守地音译为疑似地名，不在正文中武断解释；“沿着……之路”准确表达路线。
- source_word: וַיִּלָּחֶם בְּיִשְׂרָאֵל
  choice: 与以色列人交战
  rationale: 准确表达敌对军事行动，同时不将冲突规模扩大为全面战争。
- source_word: וַיִּשְׁבְּ מִמֶּנּוּ שֶׁבִי
  choice: 掳走了他们中的一些人
  rationale: שׁבה与שֶׁבִי构成掳获俘虏的同源表达；מִמֶּנּוּ在语境中回指集体性的以色列，中文以部分关系明确表达。
