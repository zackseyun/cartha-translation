  yaml_path: translation/ot/numbers/021/011.yaml
  text: They set out from Oboth and camped at Iye-abarim in the wilderness that is opposite Moab[a], toward the sunrise.
translation:
  language: zh_hans
  text: 他们从阿伯起程，在以耶·亚巴琳[a]安营；那里是在摩押对面、日出之地的旷野。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “以耶·亚巴琳”也可按词义理解为“亚巴琳的废墟”或“亚巴琳的石堆”，但这里用作地名。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: 起程
  rationale: 此动词在旷野行程记录的固定表达中指拔营继续前行；“起程”自然简洁，并保留行程阶段的含义。
- source_word: מֵאֹבֹת
  choice: 从阿伯
  rationale: 专有地名按希伯来语音译；词尾辅音在现代汉语中不宜生硬复现。
- source_word: וַיַּחֲנוּ
  choice: 安营
  rationale: 准确表达 חנה 的具体动作，也符合现代中文圣经叙事的庄重语体。
- source_word: בְּעִיֵּי הָעֲבָרִים
  choice: 在以耶·亚巴琳
  rationale: 该结构在行程记录中用作地名，因此正文音译；其可理解为“亚巴琳的废墟”或“亚巴琳的石堆”的词义另收入脚注。
- source_word: בַּמִּדְבָּר
  choice: 在旷野
  rationale: מִדְבָּר 可指荒野或干旱草原；“旷野”符合以色列行程语境及现代中文惯用表达。
- source_word: אֲשֶׁר עַל־פְּנֵי מוֹאָב
  choice: 这地方在摩押对面
  rationale: 地理描述中的 עַל־פְּנֵי 表示“面对、在……对面”；此译清楚呈现空间关系。
- source_word: מִמִּזְרַח הַשָּׁמֶשׁ
  choice: 向着日出之地
  rationale: 保留希伯来语以日出指东方的意象，同时在中文中清楚可懂；该短语修饰营地相对于摩押的方位。
