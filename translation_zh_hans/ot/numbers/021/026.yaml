  text: כִּ֣י חֶשְׁבּ֔וֹן עִ֗יר סִיחֹ֛ן מֶ֥לֶךְ הָ/אֱמֹרִ֖י הִ֑וא וְ/ה֣וּא נִלְחַ֗ם בְּ/מֶ֤לֶךְ מוֹאָב֙ הָֽ/רִאשׁ֔וֹן וַ/יִּקַּ֧ח אֶת כָּל אַרְצ֛/וֹ מִ/יָּד֖/וֹ עַד אַרְנֹֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/026.yaml
  text: For Heshbon was the city of Sihon king of the Amorites[a], and he had fought against the former king of Moab and had taken all his land from his hand as far as the Arnon.
translation:
  language: zh_hans
  text: 因为希实本原是亚摩利王西宏的城。西宏曾与先前[a]的摩押王交战，并从那王手中[b]夺取了他所有的土地，直到亚嫩河。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “先前”或译“第一位”。
    reason: 原文形容词可表示“先前的”或“第一的”；语境倾向前者，但不宜抹去词义上的可能性。
  - marker: b
    text: “从那王手中”是希伯来语惯用说法，意思是“从他的控制之下”。
    reason: 说明原文身体意象所表达的支配权含义，避免读者误作字面动作。
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 本句解释上文为何希实本及其属城归入西宏的领地；“因为”自然表达其说明缘由的作用。
- source_word: עִיר סִיחֹן
  choice: 西宏的城
  rationale: 直译所属关系，不额外将希实本限定为“首都”，以免超出本节措辞。
- source_word: הִוא
  choice: 原是
  rationale: 希伯来语名词句本身没有显明时态；在历史叙述中用“原是”既符合汉语，也表明所述是此前的情形。
- source_word: נִלְחַם
  choice: 曾与……交战
  rationale: 该动词在此指投入战斗或与对方作战；“曾”体现这场战争早于当前叙述焦点。
- source_word: הָרִאשׁוֹן
  choice: 先前的
  rationale: 在此最自然地指此前在位的摩押王，同时以脚注保留“第一位”的形式可能。
- source_word: וַיִּקַּח
  choice: 夺取了
  rationale: 既表达“拿取”，也准确体现战争背景下夺占土地的含义。
- source_word: כָּל־אַרְצוֹ
  choice: 他的全部土地
  rationale: 保留原文第三人称所有格；就近先行词是摩押王。
- source_word: מִיָּדוֹ
  choice: 从他手中
  rationale: 保留希伯来语“手”的意象，同时现代汉语也能自然表达从对方掌控下夺走。
- source_word: עַד אַרְנֹן
  choice: 直到亚嫩河
  rationale: 表达征服范围延伸至亚嫩这一地理界线；“河”按该专名所指的水系明示于汉语。
