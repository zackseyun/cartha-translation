  text: וַ/יֵּ֨שֶׁב֙ יִשְׂרָאֵ֔ל בְּ/אֶ֖רֶץ הָ/אֱמֹרִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/031.yaml
  text: So Israel lived in the land of the Amorites[a].
translation:
  language: zh_hans
  text: 于是，以色列人住在亚摩利人的土地上[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“于是，以色列人住在亚摩利人的境内。”
    reason: 说明“土地”对应原文“地”，在此可指亚摩利人的地域或领土。
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: 住
  rationale: ישׁב可表示“坐、居住、定居”。这里是叙事总结，“住”自然、简明，表达以色列人在该地居住，又不把永久定居的意味说得过强。
- source_word: יִשְׂרָאֵל
  choice: 以色列人
  rationale: 此处“以色列”作为集合主体，指以色列民众；现代汉语用“以色列人”更自然，也与单数动词所表达的集体概念相符。
- source_word: בְּאֶרֶץ
  choice: 在……的地
  rationale: אֶרֶץ在此指一片地域或领土。“地”贴近原文，并保留简洁的圣经叙事风格。
- source_word: הָאֱמֹרִי
  choice: 亚摩利人
  rationale: 原文为单数族称，可集合性地指亚摩利民族；汉语通常译作“亚摩利人”，这里以所有关系表达其地域。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“于是”承接前文结果；“住”避免“定居”可能带来的永久性强化。脚注保留“地／境内”的词义选择。
