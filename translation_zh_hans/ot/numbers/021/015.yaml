  text: and the slope of the wadis that extends to the site of Ar and leans against the border of Moab[a][b].
translation:
  language: zh_hans
  text: 以及旱溪谷[a]的斜坡，延伸到亚珥所在之地[b]，并紧靠摩押的边界。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“山谷”或“沟壑”。希伯来语 נְחָלִים 常指季节性水道及其河床，即雨季有水、旱季干涸的溪谷。
    reason: lexical_alternative
  - marker: b
    text: 或译“到亚珥的居处”或“到亚珥的座位”。这句希伯来语较难确定，可能指亚珥坐落之处，也可能指其居住地。
    reason: alternative_reading
lexical_decisions:
- source_word: אֶשֶׁד
  choice: 斜坡
  rationale: 该名词指倾斜而下的地势，尤指溪谷或沟壑一侧的坡地；“斜坡”简明自然，符合本节的地形语境。
- source_word: הַנְּחָלִים
  choice: 旱溪谷
  rationale: נחל 在旷野地理语境中常指雨季有水、旱季干涸的河床及其谷地。“旱溪谷”既比音译术语通俗，也保留其季节性水道的特点；其他可能译法列于脚注。
- source_word: אֲשֶׁר נָטָה
  choice: 那斜坡延伸
  rationale: נטה 可表示伸展、倾斜或转向。这里描述地形走向，译作“延伸”最为清楚；补出“那斜坡”以明确关系代词所承接的对象。
- source_word: לְשֶׁבֶת עָר
  choice: 到亚珥所在地
  rationale: 此短语结构艰深；ישב 的不定式可表达居住、坐落或所在。因上下文是地形描述，译作“所在地”自然且不把“居住”这一含义说死，其他理解保留在脚注。
- source_word: עָר
  choice: 亚珥
  rationale: 按现代汉语圣经地名惯例音译此地名。
- source_word: וְנִשְׁעַן
  choice: 倚着
  rationale: שען 的基本意象是倚靠、贴靠。此处用于地形与边界的关系，“倚着”保留原文比喻，也可自然理解为毗邻。
- source_word: לִגְבוּל מוֹאָב
  choice: 摩押的边界
  rationale: גבול 在此指地域界线；“边界”准确而符合现代汉语地理表述。
