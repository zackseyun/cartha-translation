  yaml_path: translation/ot/numbers/021/027.yaml
  text: Therefore the poets say, “Come to Heshbon; let the city of Sihon be built and established.”
translation:
  language: zh_hans
  text: '因此，吟诵诗歌的人[a]说：


    “来吧，到希实本来！


    愿西宏的城被建造，得以坚立！”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“作诗歌的人”“说箴言的人”或“说譬喻的人”；传统译作“统治者”。这里的希伯来语分词较可能指创作或吟诵箴言式诗歌、讽歌的人，而不是政治上的统治者。
    reason: 保留 הַמֹּשְׁלִים 的词义范围及传统译法，同时说明本段诗歌语境所支持的理解。
lexical_decisions:
- source_word: עַל כֵּן
  choice: 因此
  rationale: 承接前文，引出由前述事件而来的诗歌或俗语，保留推论和解释的连接作用。
- source_word: יֹאמְרוּ
  choice: 说
  rationale: 未完成式在此用于惯常的引语公式，现代汉语用现在时“说”最自然。
- source_word: הַמֹּשְׁלִים
  choice: 说箴言的人
  rationale: 该分词在本语境中较可能指创作或吟诵箴言式诗歌、讽歌的人；这样译既保留与 משל 的词义联系，也避免误解为政治上的“统治者”。
- source_word: בֹּאוּ
  choice: 你们来……吧
  rationale: 这是阳性复数命令式；补出“你们”并用“吧”表达向众人的召唤。
- source_word: חֶשְׁבּוֹן
  choice: 希实本
  rationale: 采用现代中文圣经读者熟悉的地名音译。
- source_word: תִּבָּנֶה
  choice: 愿……被建造
  rationale: 诗句中的未完成式具有祈愿或号召色彩；“愿”保留其意愿语气，被动式则对应希伯来文形态。
- source_word: וְתִכּוֹנֵן
  choice: 得以坚立
  rationale: 表达 כון 所含的稳固、确立之意，并与“被建造”构成诗体平行。
- source_word: עִיר סִיחוֹן
  choice: 西宏的城
  rationale: 直观表达原文附属结构所表示的归属关系，同时保持中文自然。
