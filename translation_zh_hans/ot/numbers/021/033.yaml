base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/033.yaml
  text: Then they turned and went up by the way of Bashan[a], and Og king of Bashan came out to meet them, he and all his people, for battle at Edrei.
translation:
  language: zh_hans
  text: 他们转向，沿着通往巴珊的路上去。巴珊王噩和他的全体百姓都出来迎向他们[a]，要在以得来交战。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “迎向”也可译作“迎接”。这个希伯来语表达本身可以是中性的，但下文“交战”表明这里是敌对的相遇。
    reason: 保留לִקְרָאתָם本身可能中性的词义，同时说明上下文所确定的敌对性质。
lexical_decisions:
- source_word: וַיִּפְנוּ
  choice: 他们转向
  rationale: פנה在连续叙事中表示改变行进方向；“转向”简洁自然，不额外指定转往何方。
- source_word: וַיַּעֲלוּ
  choice: 上去
  rationale: 保留עלה所表达的向上行进或地势方向感，避免较书面的“登上”。
- source_word: דֶּרֶךְ הַבָּשָׁן
  choice: 沿着通往巴珊的路
  rationale: דרך加地名可指与该地相关或通往该地的道路；此译符合现代汉语行路叙事，同时不过度限定具体路线。
- source_word: עוֹג מֶלֶךְ הַבָּשָׁן
  choice: 巴珊王噩
  rationale: 采用现代中文圣经地名、人名的通行音译，并以自然汉语次序表达王号。
- source_word: וַיֵּצֵא
  choice: 出来
  rationale: יצא在军事叙事中可指从驻地出来迎敌；“出来”保留原词的一般动作义，不增译为“率军出战”。
- source_word: לִקְרָאתָם
  choice: 迎向他们
  rationale: 该表达字面指朝对方而去、与对方相遇，本身未必含敌意；“迎向”保留这一方向性，而后文“交战”明确此处的敌对语境。
- source_word: הוּא וְכָל־עַמּוֹ
  choice: 他和他的全体百姓
  rationale: עם直译为“百姓、人民”；虽处于军事语境，原文并未明确说“军队”，故不将其窄化。
- source_word: לַמִּלְחָמָה
  choice: 要……交战
  rationale: ל加名词在此表示目的；用汉语目的结构“要……交战”自然表达他们出来是为作战。
- source_word: אֶדְרֶעִי
  choice: 在以得来
  rationale: 将地名按中文通行形式音译，并以“在”表达交战发生的地点；原文地名无介词，语法关系需由语境补明。
