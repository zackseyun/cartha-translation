base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/035.yaml
  text: So they struck him down[a], and his sons, and all his people, until he had no survivor left[b]; and they took possession of his land.
translation:
  language: zh_hans
  text: 于是，他们击杀了他、他的众子和全体百姓，直至没有给他留下一个幸存者[a]；他们又占领了他的土地[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“直到没有一个幸存者给他留下。”
    reason: 原文这一分句的施事者未明说；正文采用自然汉语表达，同时脚注保留较贴近原文结构的译法。
  - marker: b
    text: 或译：“占有了他的土地。”
    reason: ירשׁ可指取得或占有；在此战争语境中，“占领”与“占有”均可表达战胜后取得领土。
lexical_decisions:
- source_word: וַיַּכּוּ
  choice: 击杀了
  rationale: נכה在战争语境中指击打、击败，且本节下文明确说明无人幸存；“击杀”自然传达这里的致命结果，同时保留具体动作感。
- source_word: אֹתוֹ
  choice: 他
  rationale: 直接宾语代词，承接上文的巴珊王噩。
- source_word: בָּנָיו
  choice: 他的众子
  rationale: בנים为阳性复数，此处宜明确译作“众子”，不泛化为“儿女”。
- source_word: כָּל עַמּוֹ
  choice: 他的全体百姓
  rationale: עם通常指“百姓、人民”；这里范围宽于军队，因此不缩窄为“全军”。
- source_word: עַד בִּלְתִּי הִשְׁאִיר לוֹ שָׂרִיד
  choice: 一个幸存者也没有给他留下
  rationale: 贴近希伯来文“直到没有给他留下幸存者”的结构，清楚表达战败的彻底性，同时避免把未明说的主语强加给动词。
- source_word: שָׂרִיד
  choice: 幸存者
  rationale: 战争语境下“幸存者”比“余民”更直接，也避免引入不必要的神学术语色彩。
- source_word: וַיִּירְשׁוּ
  choice: 占领了
  rationale: ירשׁ在征服语境中表示取得并占有土地；“占领”自然表达战胜后夺取领土，不误作和平承受产业。
- source_word: אַרְצוֹ
  choice: 他的土地
  rationale: 指噩统治的领土；“土地”既保持传统经文用语，也不过度限定为现代国家。
