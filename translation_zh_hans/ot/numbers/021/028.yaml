base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/028.yaml
  text: For fire has gone out from Heshbon[a], a flame from the city of Sihon; it has consumed Ar of Moab[b], the lords of the high places of the Arnon.
translation:
  language: zh_hans
  text: '因为有火从希实本发出，

    有火焰从西宏的城中腾起；

    它吞噬了摩押的亚珥，

    和亚嫩高地的主人[a]。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “亚嫩高地的主人”直译希伯来语。这里的“主人”也可译为“掌权者”“拥有者”；该短语究竟指哪些人，原文并不明确。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 在诗歌语境中引出前文所述情形的原因或根据，保留其解释性、因果性作用。
- source_word: אֵשׁ יָצְאָה
  choice: 有火……发出
  rationale: 保留火从一地向外而出的具体诗歌意象，并采用自然的现代汉语表达。
- source_word: מֵחֶשְׁבּוֹן
  choice: 从希实本
  rationale: 按专名音译；“希实本”是现代中文圣经读者较熟悉的地名形式。
- source_word: לֶהָבָה
  choice: 有火焰
  rationale: 与上一分句的“火”构成诗歌平行，保留具体意象。
- source_word: מִקִּרְיַת סִיחֹן
  choice: 从西宏之城
  rationale: קִרְיָה在此是普通名词“城”，与“西宏”构成属格关系；“西宏之城”简洁而庄重。
- source_word: אָכְלָה
  choice: 烧毁了
  rationale: 原词直义为“吃、吞吃”，用于火时表示焚烧、吞灭；“烧毁”在汉语中自然，并明确传达火造成的毁灭。
- source_word: עָר מוֹאָב
  choice: 摩押的亚珥
  rationale: עָר在此最可能是已知的摩押地名“亚珥”，而非普通名词“城”。
- source_word: בַּעֲלֵי
  choice: 主人
  rationale: 较直接地保留בַּעַל复数构造式所表达的“主人、拥有者、掌权者”之义，不擅自解释为“居民”。
- source_word: בָּמוֹת אַרְנֹן
  choice: 亚嫩高地
  rationale: בָּמוֹת可指“高处、高地”，也可带有“邱坛”含义；在此地理诗歌语境中译作“高地”较自然，同时避免无根据地限定为宗教场所。
