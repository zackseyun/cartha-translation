  register: 采用现代、庄重而易懂的诗歌体；以四行呈现希伯来诗句的平行结构。地名使用常见中文音译。末行保留马所拉文本中“主人”这一较难理解的措辞，并以脚注说明其语义范围，不在正文中擅自消除歧义。
