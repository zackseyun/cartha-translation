base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/003.yaml
  text: And Yahweh heard the voice of Israel and gave the Canaanite over to them, and they devoted them and their cities to destruction. So the name of the place was called Hormah.
translation:
  language: zh_hans
  text: 耶和华听了以色列的呼声，就把迦南人交给他们；以色列人把迦南人和他们的城都献作毁灭之物。于是那地方名叫何珥玛[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “何珥玛”与希伯来语中“献作毁灭之物”所对应的词根相关。
    reason: 准确说明地名חָרְמָה与动词חרם之间的词源双关，避免仅称为读音相近。
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代汉语圣经读者熟悉的专名形式来呈现四字神名，不以“主”这一称号代替。
- source_word: וַיִּשְׁמַע ... בְּקוֹל
  choice: 听了……的呼声
  rationale: 该希伯来语习语既有“听见声音”也有垂听、回应之意；“听了……的呼声”在汉语中自然，并保留以色列发声求告的意味。
- source_word: וַיִּתֵּן אֶת־הַכְּנַעֲנִי
  choice: 把迦南人交给他们
  rationale: נתן以敌对群体为宾语时表示交出、交在对方权下；“他们”虽未明写于本分句，却由上下文明确指向以色列。集体单数הַכְּנַעֲנִי在汉语中自然译为“迦南人”。
- source_word: וַיַּחֲרֵם
  choice: 献作当毁灭之物
  rationale: חרם的使役式不只是一般的毁坏，而是把人或物置于不可撤回、归于毁灭的禁令之下；此译法尽量保留“献归”与“毁灭”两层含义。
- source_word: אֶתְהֶם וְאֶת־עָרֵיהֶם
  choice: 迦南人和他们的城
  rationale: 明确代词所指以避免汉语歧义，同时忠实保留人和城两个并列宾语。
- source_word: וַיִּקְרָא שֵׁם הַמָּקוֹם
  choice: 于是那地方名叫
  rationale: 希伯来文动词为单数，但主语没有明说；采用汉语无施事的命名表达，不武断指定是上帝、以色列或某个人命名。
- source_word: חָרְמָה
  choice: 何珥玛
  rationale: 按传统且通行的现代中文圣经地名音译；其名称与חרם“献作当毁灭之物”构成词源呼应，另以脚注说明。
theological_decisions:
- issue: חרם战争术语的表达
  choice: 把迦南人和他们的城都献作当毁灭之物
  alternative: 把他们和他们的城彻底毁灭；把他们和他们的城置于禁令之下
  rationale: 正文既不把该词淡化为普通的“毁灭”，也不使用现代读者难懂的纯技术术语；“献作当毁灭之物”保留其归献及毁灭的专门含义。
- issue: 毁灭行为的主语
  choice: 以色列人
  alternative: 他；不明说主语
  rationale: וַיַּחֲרֵם为阳性单数形式，语法上可与集体名词“以色列”呼应；结合前文以色列所许的愿，正文明确为“以色列人”，而不把行动归给耶和华本人。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。句式简洁，保留叙事的连续推进；“献作当毁灭之物”略带礼仪及法律色彩，以承载希伯来语חרם的专门含义，并用脚注解释地名双关。
