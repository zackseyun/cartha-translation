  source_fidelity: 正文准确保留了“夺取”“这一切城邑”“亚摩利人的各城”“希实本”及其附属聚落等核心信息。惟原文在第二分句重复“以色列”，并以“在……在……”的结构将希实本及其属镇列为居住地点；修订后予以更清楚地呈现，且不把这种关系过度限定为严格的同位解释。
  naturalness: 原文“各城，就是希实本和……”虽可理解，但“就是”容易把前面的“各城”限定为仅等同于希实本及其属镇，句法也稍显生硬。以分号分开两个连续动作，并用“其中包括”连接，在现代庄重汉语中更自然清晰。
  terminology: “亚摩利人”“希实本”“城邑”“附属城镇”均合乎常见中文圣经用语和本节古代城市—属镇的语境。“附属城镇”并非逐字译法，故保留说明原文“女儿”的脚注是恰当的。
  issues:
