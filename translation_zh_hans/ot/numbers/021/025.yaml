  - severity: low
    issue: 第二分句省略原文重复的主语“以色列”。
    rationale: 汉语可以省略主语，但本节两个连续叙事动作分别由同一主语执行；恢复主语并用分号分隔，可使结构更清楚，也更贴近原文强调。
