- from: 以色列夺取了这一切城邑，并住在亚摩利人的各城，就是希实本和它所有的附属城镇[a]。
  to: 以色列夺取了这一切城邑；以色列住在亚摩利人的各城中，其中包括希实本和它所有的附属城镇[a]。
  rationale: 修订主要改善句法和范围表达：保留原文两个连续动作及重复主语，以“其中包括”自然表达希实本及其属镇与“亚摩利人的各城”的关系。脚注补足介词和连接词，较完整地反映原文直译，同时说明“女儿”是城镇从属关系的习语。
