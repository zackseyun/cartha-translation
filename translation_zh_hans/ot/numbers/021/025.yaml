base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/025.yaml
  text: Israel took all these cities[a], and Israel settled in all the cities of the Amorites, in Heshbon and in all its daughter towns.
translation:
  language: zh_hans
  text: 以色列夺取了这一切城邑；以色列住在亚摩利人的各城中，其中包括希实本和它所有的附属城镇[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“并在它所有的女儿中”；这是指隶属于一座主要城市的较小城镇。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: 夺取了
  rationale: לקח的基本义是“拿、取”；在军事征服的语境中，“夺取”自然明确，又不额外引入毁灭等原文未明说的含义。
- source_word: כָּל הֶעָרִים הָאֵלֶּה
  choice: 这一切城邑
  rationale: 保留“这一切”的指示意义；“城邑”可自然涵盖古代规模不一的设防聚落，语体庄重而易懂。
- source_word: וַיֵּשֶׁב
  choice: 住在
  rationale: ישב可指居住、定居。此处“住在”忠实保留其宽泛含义，不强行判定是开始定居还是持续居住。
- source_word: בְּכָל עָרֵי הָאֱמֹרִי
  choice: 在亚摩利人的各城
  rationale: 按原文领属结构直译，清楚表达这些城属于亚摩利人；单数集合称谓הָאֱמֹרִי按汉语习惯译为“亚摩利人”。
- source_word: בְּחֶשְׁבּוֹן
  choice: 希实本
  rationale: 采用现代中文圣经读者熟悉的传统地名译法。
- source_word: וּבְכָל בְּנֹתֶיהָ
  choice: 和它所有的附属城镇
  rationale: 原文直说“它所有的女儿”，是以母城和女儿比喻中心城市及其所属小城镇。“附属城镇”在正文中清楚传达实际所指，脚注保留原有比喻。
theological_decisions: []
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“就是”将“希实本和它所有的附属城镇”理解为前述亚摩利人各城的具体说明；不增添原文未明说的毁城、杀戮或永久占有等含义。
