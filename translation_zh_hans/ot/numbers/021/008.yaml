base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/008.yaml
  text: Then Yahweh said to Moses[a], “Make for yourself a fiery serpent and set it on a pole, and it shall be that everyone who is bitten, when he looks at it[b], shall live.”
translation:
  language: zh_hans
  text: 耶和华对摩西说：“你要做一条火蛇[a]，把它安在旗杆[b]上。凡被咬的，看见它，就必存活。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “火蛇”原文也可译作“燃烧者”；本处指能致人死命的蛇。
    reason: lexical_alternative
  - marker: b
    text: “旗杆”原文也可指“旌旗”或“标志杆”。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的神名译法，明确呈现原文专名，避免以“主”替代。
- source_word: עֲשֵׂה לְךָ
  choice: 你要做
  rationale: 命令式清楚译为“你要做”；其中受益与格“给你/为你”在此不必机械译出，否则现代汉语容易误解为供摩西本人使用。
- source_word: שָׂרָף
  choice: 火蛇
  rationale: 该词本义与“燃烧”有关，在本叙事中指造成致命灼痛的蛇；“火蛇”既保留原文意象，也与21:6的称呼衔接，并避免直接解释为“毒蛇”。
- source_word: נֵס
  choice: 杆子
  rationale: 该词通常可指旌旗、标志或竖立标志的杆；本处强调蛇像被高举安放的具体载体，“杆子”自然清楚，同时以脚注保留词义范围。
- source_word: הַנָּשׁוּךְ
  choice: 凡被咬的
  rationale: 带冠词的被动分词具有泛指作用；此译简洁地涵盖所有被蛇咬的人。
- source_word: וְרָאָה אֹתוֹ
  choice: 一看它
  rationale: “看见它”在语境中构成存活的条件；“一看它”自然表达随即发生的条件—结果关系，又不额外说明观看的性质。
- source_word: וָחָי
  choice: 就必活
  rationale: 保留结果陈述的确定性与庄重语气；“活”不限定为痊愈或继续存活，从而保留原文表达。
theological_decisions:
- issue: שָׂרָף所指及其意象
  choice: 正文译作“火蛇”
  alternative: “撒拉弗”、“燃烧者”或“毒蛇”
  rationale: 上下文明确涉及蛇灾和蛇像。“火蛇”保留词根的燃烧意象及叙事联系，不引入后来与天上生物相关的特定联想；“毒蛇”虽解释了致命效果，却比原文更具解释性。
- issue: 观看与存活的关系
  choice: 译作“一看它，就必活”
  alternative: “看见它，并且活了”
  rationale: 原文连续动词在本句中表达条件及结果。此译清楚呈现叙事逻辑，但不增添有关观看本身如何生效的神学解释。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。短句保持神谕的直接性；“凡……的，一……就……”使原文的泛指条件结构易于普通读者理解。脚注标记均紧随其所解释的词语，纠正了英文咨询层中标记位置与脚注内容不对应的问题。
