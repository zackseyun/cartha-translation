  text: וַ/יָּבֹא֩ הָ/עָ֨ם אֶל מֹשֶׁ֜ה וַ/יֹּאמְר֣וּ חָטָ֗אנוּ כִּֽי דִבַּ֤רְנוּ בַֽ/יהוָה֙ וָ/בָ֔/ךְ הִתְפַּלֵּל֙ אֶל יְהוָ֔ה וְ/יָסֵ֥ר מֵ/עָלֵ֖י/נוּ אֶת הַ/נָּחָ֑שׁ וַ/יִּתְפַּלֵּ֥ל מֹשֶׁ֖ה בְּעַ֥ד הָ/עָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/007.yaml
  text: Then the people came to Moses and said[a], “We have sinned, for we have spoken against Yahweh and against you. Pray to Yahweh, that he may take away the serpent from us.” So Moses prayed for the people.
translation:
  language: zh_hans
  text: 于是百姓来到摩西那里，说：“我们犯了罪，因为我们说了反对雅威和你的话。求你向雅威祷告，让他把蛇[a]从我们这里除去。”于是摩西为百姓祷告。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “蛇”原文为单数，也可能作为集合称谓，统指这场灾患中的蛇群。
    reason: 保留希伯来文单数形式，同时说明其在上下文中可能具有集合意义。
lexical_decisions:
- source_word: וַיָּבֹא הָעָם
  choice: 于是百姓来到
  rationale: 连续式叙事动词推进事件发展；“于是”自然体现承接关系。“百姓”是集合名词，按现代汉语习惯搭配“来到”。
- source_word: חָטָאנוּ
  choice: 我们犯了罪
  rationale: 完成式在认罪语境中表示已经发生且仍与当前处境相关的行为；“犯了罪”自然、庄重。
- source_word: כִּי דִבַּרְנוּ בַיהוָה וָבָךְ
  choice: 因为我们说了反对雅威、也反对你的话
  rationale: כִּי引出认罪的理由；דבר与介词ב连用在此表示敌对性的言说。“说了反对……的话”既准确表达“说话攻击/反对”，也符合现代汉语。
- source_word: יְהוָה
  choice: 雅威
  rationale: 直接音译四字神名，保留经文所用的专名性质，并与所给审定方针一致。
- source_word: הִתְפַּלֵּל אֶל יְהוָה
  choice: 求你向雅威祷告
  rationale: התפלל在此是向神祷告；结合请求语境加“求你”，自然表达原文祈使语气。
- source_word: וְיָסֵר מֵעָלֵינוּ
  choice: 让他把……从我们这里除去
  rationale: 前缀动词承接祈使句，表达祷告所求的内容或结果；“除去”保留移走灾患的含义。
- source_word: אֶת הַנָּחָשׁ
  choice: 蛇
  rationale: נָחָשׁ指具体的蛇；原文为带定冠词的单数形式，但在本语境中可能集合性地统指造成灾患的蛇，因此正文保留单数形式，并以脚注说明。
- source_word: וַיִּתְפַּלֵּל מֹשֶׁה בְּעַד הָעָם
  choice: 于是摩西为百姓祷告
  rationale: בְּעַד表示为某人、代表某人代求；“为百姓祷告”清楚自然，并保留代求含义。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名。译作“雅威”保留其专名性质，也避免把专名改成称号；不据任何宗派传统扩充其含义。
- issue: 单数“蛇”与群体蛇患的关系
  choice: 正文保留单数“蛇”，脚注说明其可能具有集合意义
  alternative: 正文译作“蛇群”
  rationale: 原文明确使用单数，但上下文容许集合性理解。保留单数并加注，既忠于形式，也不消除语义上的真实张力。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“说了反对……的话”避免生硬直译；“求你向……祷告”保持百姓恳求摩西代祷的语气。脚注标记置于其实际说明的“蛇”之后。
