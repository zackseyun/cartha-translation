  naturalness: “于是，他给那地方起名叫……”虽可理解，但“他就给那地方起名叫……”在现代汉语叙事中更连贯自然。删去“曾”可避免在汉语中额外突出“过去曾经”的对比意味；上下文和“起名”的因果关系已足以表明这是已发生的事。
