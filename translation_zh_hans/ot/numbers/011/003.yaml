  text: וַ/יִּקְרָ֛א שֵֽׁם הַ/מָּק֥וֹם הַ/ה֖וּא תַּבְעֵרָ֑ה כִּֽי בָעֲרָ֥ה בָ֖/ם אֵ֥שׁ יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/003.yaml
  text: So he called the name of that place Taberah[a], because the fire of Yahweh burned among them.
translation:
  language: zh_hans
  text: 他就给那地方起名叫他备拉[a]，因为耶和华的火在他们中间燃烧。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “他备拉”与希伯来语“燃烧”一词相关。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: 起名叫
  rationale: קרא与“名”连用时表示命名；“起名叫”是现代汉语中自然、明确的表达。
- source_word: שֵׁם הַמָּקוֹם הַהוּא
  choice: 给那地方起名
  rationale: 将希伯来语“称那地方的名”按汉语习惯转换为命名结构，同时保留叙事中的正式命名意味。
- source_word: תַּבְעֵרָה
  choice: 他备拉
  rationale: 作为地名采用音译；其与“燃烧”的语源联系由脚注说明，并由后面的原因从句呼应。
- source_word: כִּי
  choice: 因为
  rationale: 清楚表达原因关系，符合现代汉语叙事习惯。
- source_word: בָעֲרָה
  choice: 曾……燃烧
  rationale: בער直接表示燃烧；“曾”体现希伯来语完成体所叙述的已发生事件，也与地名的含义形成呼应。
- source_word: בָם
  choice: 在他们中间
  rationale: 这里指火在营地群体当中燃烧，而不是在人的身体内部燃烧。
- source_word: אֵשׁ יְהוָה
  choice: 耶和华的火
  rationale: 保留原文所属结构，并将神的专名 יְהוָה 按现代中文圣经传统译作“耶和华”。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文明确使用四字神名。现代简体中文的一般读者对“耶和华”最为熟悉；此处以专名呈现，而不以“主”替代，从而保留原文的立约神名。
- issue: “耶和华的火”所表达的关系
  choice: 保留所属结构“耶和华的火”
  alternative: 从耶和华那里来的火
  rationale: 希伯来语结构本身可强调归属、来源或与耶和华的关联；直译所属结构可保留这种语义张力，不把它单一限定为来源。
translation_notes:
  register: 采用自然、庄重且易懂的现代标准汉语。“于是”承接前文叙事；代词“他”保留原文主语未明说姓名的特点。脚注标记已置于地名之后。
