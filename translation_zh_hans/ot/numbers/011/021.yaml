base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/021.yaml
  text: But Moses said[a], “The people among whom I am are six hundred thousand on foot, and yet you have said, ‘I will give them meat[b], and they will eat for a month of days.’”
translation:
  language: zh_hans
  text: 摩西却说：“我所在的百姓中，步行的人有六十万[a]；你却说：‘我要给他们肉吃，他们要吃整整一个月[b]。’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“步行的男子有六十万。”原文“步行的”也可指步兵。
    reason: alternative_reading
  - marker: b
    text: 原文直译近于“一个月的日子”，是指完整的一个月。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 摩西却说
  rationale: 叙事连接词在这里承接上文，同时引出摩西对上帝应许的质疑；“却”自然表达语境中的转折，不把该词机械译作“于是”或“和”。
- source_word: שֵׁשׁ מֵאוֹת אֶלֶף
  choice: 六十万
  rationale: 按原文基数词结构直接翻译。
- source_word: רַגְלִי הָעָם
  choice: 百姓，步行的就有六十万
  rationale: רַגְלִי 与“脚”有关，可指步行者，也可能带有步兵或受点算男子的含义。正文保留“百姓”和“步行的”，避免无根据地把范围限定为男子或军人；脚注列出可能译法。
- source_word: אֲשֶׁר אָנֹכִי בְּקִרְבּוֹ
  choice: 我身处其中的
  rationale: בקרבו 表示“在其当中”。“我身处其中”既保留摩西置身百姓当中的强调，也符合现代汉语表达。
- source_word: וְאַתָּה אָמַרְתָּ
  choice: 你却说
  rationale: 原文明确使用第二人称代词，形成强调和对比；“你却说”表达摩西面对庞大人数时的惊疑。
- source_word: בָּשָׂר אֶתֵּן לָהֶם
  choice: 我要给他们肉吃
  rationale: בשר 在语境中指供食用的肉。“给他们肉吃”是自然汉语，同时忠实表达给予食物的意思。
- source_word: וְאָכְלוּ
  choice: 他们要吃
  rationale: 保留与前句并列的将来陈述，不改写为仅表示目的的“好让他们吃”。
- source_word: חֹדֶשׁ יָמִים
  choice: 整整一个月
  rationale: 该希伯来语习语直译近于“一个月的日子”，意思是完整的一个月。正文采用自然而有强调意味的“整整一个月”，脚注说明原文形式。
theological_decisions:
- issue: 摩西话语中的质疑语气
  choice: 以两个“却”呈现上下文中的反差和惊疑
  alternative: 用中性的“摩西说……你说”
  rationale: 这句话以百姓人数与上帝刚才的宣告相对照，带有明显的疑问和难以置信；译文呈现这一语用效果，但不进一步解释为不信、试探或其他神学判断。
translation_notes:
  register: 采用现代、庄重而口语可懂的叙事语言。“我身处其中”保留原文空间意象；“整整一个月”自然传达希伯来习语。脚注按其所解释的词语重新安放，避免英文咨询层中标记位置与注释内容错配。
