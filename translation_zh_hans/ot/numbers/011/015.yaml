  text: וְ/אִם כָּ֣כָה אַתְּ עֹ֣שֶׂה לִּ֗/י הָרְגֵ֤/נִי נָא֙ הָרֹ֔ג אִם מָצָ֥אתִי חֵ֖ן בְּ/עֵינֶ֑י/ךָ וְ/אַל אֶרְאֶ֖ה בְּ/רָעָתִֽ/י־׀־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/015.yaml
  text: If this is how you are going to deal with me[a], please kill me at once, if I have found favor in your eyes, and do not let me see my misery.
translation:
  language: zh_hans
  text: 你若这样待我，求你干脆杀了我吧！我若在你眼中蒙恩，就不要让我看见自己的苦难。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“自己的灾祸”或“自己的患难”。这里的希伯来词可指逆境或灾难，不只指道德上的恶。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: 你若
  rationale: 引出条件句；句首连接词在现代汉语中可自然省略，“若”保留庄重而清楚的条件语气。
- source_word: כָּכָה אַתְּ עֹשֶׂה לִּי
  choice: 这样待我
  rationale: עשה ל在这里表示上帝如何对待摩西；“这样待我”自然简洁，也保留关系性的含义。
- source_word: הָרְגֵנִי נָא הָרֹג
  choice: 求你索性杀了我吧
  rationale: נָא表达恳求，命令式与同根绝对不定式连用加强语气；“索性……吧”传达彻底、坚决的请求，不把强调机械地重复出来。
- source_word: אִם מָצָאתִי חֵן בְּעֵינֶיךָ
  choice: 我若在你眼中蒙恩
  rationale: 保留希伯来语“在你眼中”的意象，并采用现代汉语中自然、庄重的“蒙恩”表达受到眷顾。
- source_word: וְאַל אֶרְאֶה
  choice: 就不要让我眼看
  rationale: 表达摩西向上帝提出的否定请求；“眼看”保留“看见”的字面意象，并在汉语中带出亲历、目睹之意。
- source_word: בְּרָעָתִי
  choice: 自己的苦难
  rationale: רָעָה在本处可指逆境、祸患或痛苦，而不必指道德上的恶；“自己的苦难”符合摩西不堪重负的语境，同时以脚注保留其他可能译法。
theological_decisions:
- issue: בְּרָעָתִי所指的是摩西的道德邪恶，还是他所遭受的困苦或灾祸
  choice: 自己的苦难
  alternative: 自己的灾祸／自己的患难／自己的恶
  rationale: 上下文描写摩西因承担百姓的重担而绝望，并非认罪。“苦难”传达个人所经历的困境，同时不完全排除即将临到的灾祸这一层意思。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“索性杀了我吧”保留原文强烈而近乎绝望的恳求；感叹号体现语势，但不增添新的命题内容。脚注标记置于“苦难”之后，因为脚注解释的是בְּרָעָתִי。
