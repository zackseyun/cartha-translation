review_pass:
  verdict: revise
  source_fidelity: 草稿准确传达了耶和华降临、与摩西说话、众人共同承担百姓重担以及摩西不再独自担当的主旨。不过，“降在你身上的灵”将原文仅称“在你身上的灵”具体化为“降在”，而“分赐一些给他们”弱化并省略了神把灵“放在他们身上”的明确动作与意象。
  naturalness: 草稿整体庄重通顺，但“把降在你身上的灵分赐一些给他们”语序略显滞涩。“从那在你身上的灵中取出一些，放在他们身上”既自然，也更清楚地呈现两个连续动作。
  terminology: “灵”适合保留原文在中文中可容纳的神圣赋能含义，而不强加后期教义术语。“担当百姓的重担”准确且符合现代庄重书面语。
  issues:
  - severity: medium
    issue: “降在你身上的灵”超出了原文的直接表述。
    rationale: 希伯来文为“那在你身上的灵”（הָרוּחַ אֲשֶׁר עָלֶיךָ），并未在本句使用“降下”一词描述灵；虽与上下文相符，正文宜保留较中性的“在你身上”。
  - severity: medium
    issue: “分赐一些给他们”没有明确表达“放在他们身上”。
    rationale: 原文在“从……灵中取出一些”后另有“放在他们身上”（וְשַׂמְתִּי עֲלֵיהֶם）。译文应保留这一赋予并临到其身的动作，避免将其完全合并为一般性的“分赐”。
  revised_text: 我要降临，在那里与你说话；我要从那在你身上的灵中取出一些，放在他们身上；他们要与你一同担当百姓的重担，你就不必独自担当了。
