  text: וְ/יָרַדְתִּ֗י וְ/דִבַּרְתִּ֣י עִמְּ/ךָ֮ שָׁם֒ וְ/אָצַלְתִּ֗י מִן הָ/ר֛וּחַ אֲשֶׁ֥ר עָלֶ֖י/ךָ וְ/שַׂמְתִּ֣י עֲלֵי/הֶ֑ם וְ/נָשְׂא֤וּ אִתְּ/ךָ֙ בְּ/מַשָּׂ֣א הָ/עָ֔ם וְ/לֹא תִשָּׂ֥א אַתָּ֖ה לְ/בַדֶּֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/017.yaml
  text: And I will come down and speak with you there[a], and I will take some of the Spirit that is on you and put it on them, and they will bear the burden of the people with you, so that you will not bear it by yourself alone.
translation:
  language: zh_hans
  text: 我要降临，在那里与你说话；我要从那在你身上的灵中取出一些，放在他们身上；他们要与你一同担当百姓的重担，你就不必独自担当了。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְיָרַדְתִּי
  choice: 我要降临
  rationale: 保留 ירד“下来”的空间意象及神显色彩；现代汉语中“降临”比“下来”更庄重自然。
- source_word: וְדִבַּרְתִּי עִמְּךָ שָׁם
  choice: 在那里与你说话
  rationale: 忠实保留“在那里”的地点指向，并以自然现代汉语表达“与你说话”。
- source_word: וְאָצַלְתִּי מִן־הָרוּחַ
  choice: 我要把……灵分赐一些
  rationale: 罕见动词 אצל 在此表示从摩西所受的灵取出一部分转授众长老；“分赐一些”保留部分性与转授之意，同时不武断断定摩西所得因此减少。
- source_word: הָרוּחַ אֲשֶׁר עָלֶיךָ
  choice: 降在你身上的灵
  rationale: רוּחַ 在上下文中指赐予领导能力的神圣之灵；汉字不以大小写区分专名，因此用“灵”并借“降在……身上”呈现其临到、赋能的语境。
- source_word: וְשַׂמְתִּי עֲלֵיהֶם
  choice: 分赐……给他们
  rationale: 将“放在他们身上”的意象整合进“分赐给他们”，使汉语流畅；其临到众人的含义仍由前面的“降在你身上”与转授结构表达。
- source_word: וְנָשְׂאוּ אִתְּךָ בְּמַשָּׂא הָעָם
  choice: 使他们与你一同担当这百姓的重担
  rationale: נשא 与 מַשָּׂא 构成担当重担的语义呼应；“一同”准确传达 אִתְּךָ 所表达的共同承担。
- source_word: וְלֹא־תִשָּׂא אַתָּה לְבַדֶּךָ
  choice: 免得你独自担当
  rationale: 将连接词按上下文译为目的或结果关系“免得”；“独自”自然传达强调性的“你自己单独”。
theological_decisions:
- issue: רוּחַ 指神的灵还是摩西个人的精神或气质
  choice: 灵（理解为神所赐、使人胜任领导职责的灵）
  alternative: 精神、心志
  rationale: 本节说这灵在摩西身上，并由神分赐给长老；11:25 又明确描述耶和华使灵临到他们，因此上下文支持神圣赋能之灵。不过中文正文仅用“灵”，不加入超出经文本身的后期教义界定。
- issue: 分赐给长老是否意味着摩西原有的灵被削减
  choice: 不明确断定是否削减
  alternative: 译作“从你身上取走一些”，明确暗示摩西有所损失
  rationale: מִן 与 אצל 表达从其上之灵取出、分配的动作，但经文没有明说摩西所得因此减少；“分赐一些”保留转授与部分性而不消解这一张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“降临”保留神显语感；“分赐一些”兼顾原文的部分性和中文可读性；避免把 רוּחַ 过度教义化，也不把它弱化为人的性情。
