  yaml_path: translation/ot/numbers/011/014.yaml
  text: I am not able, I alone, to carry all this people, because it is too heavy for me.
translation:
  language: zh_hans
  text: 我一个人无法承担所有这些百姓，因为他们对我来说太沉重了。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְבַדִּי
  choice: 独自
  rationale: 表达“我一个人、单独”的强调；汉语将主语“我”与“独自”连用，已自然保留原文 אָנֹכִי 与 לְבַדִּי 的强调。
- source_word: לָשֵׂאת
  choice: 担当
  rationale: 本义为“背负、承载”；此处指承担带领全体百姓的重任，“担当”既保留负重意象，也符合现代庄重汉语。
- source_word: כָבֵד מִמֶּנִּי
  choice: 这担子对我来说太重了
  rationale: 原文直指“它比我所能承受的更重”；补出“这担子”使中文指代清楚，并延续“担当”的负重意象。
theological_decisions:
- issue: 摩西无力承担的范围
  choice: 保留“我不能独自”的限定
  alternative: 译成绝对的“我不能担当”
  rationale: 原文特别强调“我独自一人”，所否定的是单独承担全体百姓的能力，而非否定任何形式的担当。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语；通过“独自”保留原文强调，通过“担当／担子太重”维持贯穿全句的承重意象。
