  yaml_path: translation/ot/numbers/011/019.yaml
  text: You will eat not for one day[a], or two days, or five days, or ten days, or twenty days,
translation:
  language: zh_hans
  text: 你们将不会只吃一天，也不会只吃两天、五天、十天或二十天；[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 较为形式对应的译法是：“你们将不会吃一天，也不会吃两天，也不会吃五天，也不会吃十天，也不会吃二十天。”
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא
  choice: 不是……也不是……或……
  rationale: לֹא在各个时段前反复出现，逐项排除这些时长。中文用“不是只……，也不是……或……”既保留递进排除的语气，又避免机械重复。
- source_word: יוֹם אֶחָד
  choice: 一天
  rationale: 直接表达基数与名词的组合，并与后续数字构成清晰的递进序列。
- source_word: תֹּאכְלוּ/ן
  choice: 你们吃肉
  rationale: 该词为Qal未完成式第二人称阳性复数，在这里表示将来的行动。结合上文所说要给百姓肉吃，中文补出宾语“肉”，使本节作为连续话语自然易懂。
- source_word: יוֹמָיִם
  choice: 两天
  rationale: 希伯来语双数形式明确指两天。
- source_word: חֲמִשָּׁה יָמִים
  choice: 五天
  rationale: 直译数字和复数名词，保留修辞上的递进。
- source_word: עֲשָׂרָה יָמִים
  choice: 十天
  rationale: 直译以保留逐步增强的列举。
- source_word: עֶשְׂרִים יוֹם
  choice: 二十天
  rationale: 希伯来语在二十之后使用单数“日”是惯用结构，现代汉语自然表达为“二十天”。
- source_word: וְ
  choice: 也不是／或
  rationale: 连接词וְ通常可译为“和”，但在反复否定的序列中，现代汉语宜按各项关系译为“也不是”及末尾的“或”，准确传达逐项排除。
