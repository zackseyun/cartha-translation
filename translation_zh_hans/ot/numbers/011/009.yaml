base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/009.yaml
  text: When the dew came down on the camp at night[a], the manna came down on it.
translation:
  language: zh_hans
  text: 夜间，露水降在营地上的时候[a]，吗哪也降在其上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“当夜间露水降在营地上时，吗哪也降在其上。”希伯来文描述露水和吗哪时用了同一个动词“降”，突出了两者之间的平行。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְרֶדֶת
  choice: ……降……的时候
  rationale: 介词 בְּ 加动词 ירד 的不定式附属形构成时间从句；前缀 וּ 可按希伯来语叙事衔接自然处理，不必机械译作“并且”。
- source_word: הַטַּל
  choice: 露水
  rationale: 保留定指所指；现代汉语通常不另加相当于冠词的成分。
- source_word: עַל הַמַּחֲנֶה
  choice: 在营地上
  rationale: עַל 表示“在……上”；此处指露水降落并覆在营地上。
- source_word: לָיְלָה
  choice: 夜间
  rationale: 作时间状语，译为简洁自然的现代汉语“夜间”。
- source_word: יֵרֵד
  choice: 也降
  rationale: 未完成式在叙事语境中表达惯常发生的过去事件；汉语无需强加时态标记。采用“降”与前句呼应，保留原文两次使用 ירד 的平行；“也”自然呈现两件事的对应关系。
- source_word: הַמָּן
  choice: 吗哪
  rationale: 采用中文圣经传统中对这种食物的通行音译。
- source_word: עָלָיו
  choice: 在其上
  rationale: 保留第三人称阳性单数代词的含蓄指向，最自然的先行词是“营地”；不将其明确改写为“露水上”，以免消除原文可能存在的关系含混。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“吗哪”沿用通行译名；正文重复“降”，以再现希伯来文的词汇呼应。“其上”略具书面色彩，但能简洁保留代词所指的含蓄性。
