source:
  edition: WLC
  text: הֶ/אָנֹכִ֣י הָרִ֗יתִי אֵ֚ת כָּל הָ/עָ֣ם הַ/זֶּ֔ה אִם אָנֹכִ֖י יְלִדְתִּ֑י/הוּ כִּֽי תֹאמַ֨ר אֵלַ֜/י שָׂאֵ֣/הוּ בְ/חֵיקֶ֗/ךָ כַּ/אֲשֶׁ֨ר יִשָּׂ֤א הָ/אֹמֵן֙ אֶת הַ/יֹּנֵ֔ק עַ֚ל הָֽ/אֲדָמָ֔ה אֲשֶׁ֥ר נִשְׁבַּ֖עְתָּ לַ/אֲבֹתָֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/012.yaml
  text: Did I conceive all this people? Did I give birth to him[a], that you should say to me, ‘Carry him in your bosom[b], as a guardian carries a nursing child,’ to the land that you swore to his fathers?
translation:
  language: zh_hans
  text: 难道是我怀了这全体百姓吗？难道是我生了他[a]，以致你对我说：‘把他抱在怀里，像养育者抱着吃奶的婴孩一样’，带到你向他的祖先起誓应许的那片土地去吗？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文用单数的“他”和“他的祖先”，把全体百姓看作一个孩子；也可按汉语习惯理解为“他们”和“他们的祖先”。
    reason: alternative_reading
lexical_decisions:
- source_word: הֶאָנֹכִי הָרִיתִי
  choice: 难道……是我怀的吗
  rationale: 疑问词与独立代词加强反问语气；“怀”保留妊娠、生育的母性比喻，并符合现代汉语表达。
- source_word: כָּל הָעָם הַזֶּה
  choice: 这全体百姓
  rationale: עָם是集合单数；“全体百姓”自然地表达群体整体，也为后文将其视作一个孩子的单数指代留下空间。
- source_word: אִם אָנֹכִי יְלִדְתִּיהוּ
  choice: 难道是我生了他
  rationale: 延续怀孕和生产的比喻，并保留希伯来文指向集合单数“百姓”的阳性单数宾语后缀。
- source_word: כִּי תֹאמַר אֵלַי
  choice: 以致你对我说
  rationale: כִּי在此承接反问，说明由此而来的要求；“以致”使逻辑关系清楚而不将其过度解释为严格因果。
- source_word: שָׂאֵהוּ בְחֵיקֶךָ
  choice: 把他抱在怀里
  rationale: שׂא表达携带，חֵיק指怀中、胸怀或膝怀；汉语“抱在怀里”既具体自然，又保留照料婴孩的画面。
- source_word: הָאֹמֵן
  choice: 养育者
  rationale: 该词指负责看顾、扶养幼儿的人，并不必然是哺乳者；“养育者”避免武断限定性别或具体身份。
- source_word: הַיֹּנֵק
  choice: 吃奶的婴孩
  rationale: 该分词特指仍在吃奶的幼儿；此译法现代、清楚，并保留原文所指的生命阶段。
- source_word: עַל הָאֲדָמָה
  choice: 带到……那片土地去
  rationale: 结合携带动作与应许之地这一目的地，עַל在汉语中自然表达为“到……去”。
- source_word: אֲשֶׁר נִשְׁבַּעְתָּ
  choice: 你……起誓应许的
  rationale: נשׁבע明确含有起誓之意；补入“应许”使汉语完整表达向祖先起誓赐地的语义，而不削弱誓言色彩。
- source_word: לַאֲבֹתָיו
  choice: 向他祖先
  rationale: 保留单数后缀与集合单数“百姓”的呼应；“祖先”比字面“父亲们”更符合现代汉语在盟约历史语境中的通常表达。
theological_decisions:
- issue: 把以色列百姓作为集合单数指称
  choice: 保留“他”和“他祖先”
  alternative: 使用“他们”和“他们的祖先”
  rationale: 原文连续使用单数后缀，把整个百姓描绘成一个由摩西怀抱的孩子。保留单数可维持这一鲜明比喻；脚注说明现代汉语也可按群体用复数理解。
- issue: הָאֹמֵן所指照料者的身份
  choice: 译作“养育者”
  alternative: 乳母、保姆、养父
  rationale: 原词强调承担照护和扶养职责的人，其性别和具体角色未被完全限定。“养育者”保留这种宽度，不把形象限定为女性乳母或男性养父。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。用两个“难道”呈现摩西强烈的反问；“怀、生、抱在怀里、吃奶的婴孩”维持贯穿全句的生育与养育意象。主文仅设一个脚注，且标记[a]已置于对应的单数代词之后。
