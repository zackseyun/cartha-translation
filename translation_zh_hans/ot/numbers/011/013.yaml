  text: מֵ/אַ֤יִן לִ/י֙ בָּשָׂ֔ר לָ/תֵ֖ת לְ/כָל הָ/עָ֣ם הַ/זֶּ֑ה כִּֽי יִבְכּ֤וּ עָלַ/י֙ לֵ/אמֹ֔ר תְּנָ/ה לָּ֥/נוּ בָשָׂ֖ר וְ/נֹאכֵֽלָה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/013.yaml
  text: Where am I to get meat to give to all this people? For they are weeping before me[a], saying, ‘Give us meat, so that we may eat.’
translation:
  language: zh_hans
  text: 我从哪里能弄到肉给这全体百姓呢？他们在我面前哭[a]，说：‘给我们肉，好让我们吃。’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“向我哭求”，也可理解为“用哭声向我施压”。希伯来语直译为“在我身上哭”。
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵאַיִן לִי
  choice: 我从哪里能弄到
  rationale: מֵאַיִן询问来源，לִי在这里涉及摩西自身能否取得所需之物。译为“我从哪里能弄到”既保留来源之意，也自然表达他的无能为力和困窘。
- source_word: בָּשָׂר
  choice: 肉
  rationale: 此处指供人食用的动物肉；现代汉语用“肉”最自然，无须采用偏书面的“肉食”或字面的“肉体”。
- source_word: לְכָל הָעָם הַזֶּה
  choice: 给这全体百姓
  rationale: עָם是集合名词。“这全体百姓”保留单一群体的概念，也比“所有这些人”更贴近以色列会众的语境。
- source_word: יִבְכּוּ עָלַי
  choice: 他们在我面前哭
  rationale: עַל加人称后缀在此可表示哭泣朝向摩西，并对他形成压力。“在我面前哭”保持中性，不把语义过早限定为单纯请求或敌对控诉；其他可能含义列入脚注。
- source_word: תְּנָה לָּנוּ
  choice: 给我们肉
  rationale: 祈使式加间接受词自然译为“给我们”；宾语“肉”按汉语需要在引语中补出。
- source_word: וְנֹאכֵלָה
  choice: 好让我们吃
  rationale: 第一人称复数鼓励式在请求之后表达期望的目的或结果。“好让我们吃”传达其意愿色彩，而不把它处理为单纯的将来陈述。
theological_decisions: []
