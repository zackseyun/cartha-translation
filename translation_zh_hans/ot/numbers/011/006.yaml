  text: וְ/עַתָּ֛ה נַפְשֵׁ֥/נוּ יְבֵשָׁ֖ה אֵ֣ין כֹּ֑ל בִּלְתִּ֖י אֶל הַ/מָּ֥ן עֵינֵֽי/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/006.yaml
  text: But now our appetite is dried up[a]; there is nothing at all except the manna before our eyes.
translation:
  language: zh_hans
  text: 可是现在，我们的食欲枯竭了[a]；眼前除了吗哪，什么也没有。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“我们的心灵枯干了”。希伯来语“נֶפֶשׁ”（nephesh）可指“心灵”“生命”，在谈论食物的语境中也可指“食欲”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: 可是现在
  rationale: 连接词与时间副词在抱怨的语境中形成今昔对比；“可是现在”自然传达转折意味。
- source_word: נַפְשֵׁנוּ
  choice: 我们的食欲
  rationale: נֶפֶשׁ 可指生命、心灵或人本身；在谈论食物、饥渴和欲望的语境中，也可指食欲。此处百姓抱怨食物单调，译作“食欲”最贴合语境，同时以脚注保留较直译的可能。
- source_word: יְבֵשָׁה
  choice: 枯竭了
  rationale: 原词描写干涸、枯干的状态。“枯竭了”在现代汉语中保留原文的干枯意象，也能自然表达食欲耗尽。
- source_word: אֵין כֹּל
  choice: 什么也没有
  rationale: 否定词与 כֹּל 连用，表示全然没有；“什么也没有”准确体现强调语气。
- source_word: בִּלְתִּי אֶל
  choice: 除了
  rationale: 该结构表达排除关系，即除指定事物之外别无所有。
- source_word: הַמָּן
  choice: 吗哪
  rationale: 定冠词指向众人熟知的特定食物；汉语专名“吗哪”通常无需另加指示词或冠词。
- source_word: עֵינֵינוּ
  choice: 眼前
  rationale: 原文直指“我们的眼睛”，表达眼睛所见之物；“眼前”简洁自然地保留可见、摆在面前的具体意象。
theological_decisions: []
