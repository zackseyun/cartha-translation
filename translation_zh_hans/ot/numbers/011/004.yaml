  yaml_path: translation/ot/numbers/011/004.yaml
  text: The rabble among them had a strong craving[a], and the sons of Israel also turned back and wept, and said[d][c][b], “Who will feed us meat?”
translation:
  language: zh_hans
  text: 他们中间的闲杂人[a]产生了强烈的贪欲[b]；以色列人[c]也再次哭了起来，说：“谁给我们肉吃呢？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “闲杂人”所译的希伯来词十分罕见，并带贬义；也可译作“混杂的群众”或“乌合之众”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文以“贪恋”和“贪欲”这两个同根词相连，用以加强欲望的程度。
    reason: lexical_alternative
  - marker: c
    text: 希伯来文作“以色列的众子”，在这里指以色列人。
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאסַפְסֻף
  choice: 闲杂人群
  rationale: 这是一个罕见且带贬义的集合名词，指以色列群体中不属于核心成员的一群人。“闲杂人群”既保留其群体性和负面色彩，又比生硬的直译更符合现代汉语。
- source_word: אֲשֶׁר בְּקִרְבּוֹ
  choice: 他们中间的
  rationale: 原文直译近于“在其当中的”。这里指身处以色列营中的闲杂人群；“他们中间的”自然地表达了这种位置和关系。
- source_word: הִתְאַוּוּ תַּאֲוָה
  choice: 起了强烈的贪欲
  rationale: 原文以同根动词和名词相连，直译为“贪恋一种贪欲”，用来加强欲望的程度。“起了强烈的贪欲”在现代汉语中自然，并保留强烈且受谴责的欲求语气。
- source_word: וַיָּשֻׁבוּ וַיִּבְכּוּ
  choice: 也又哭了起来
  rationale: שׁוּב在这里表示再次或重新做某事，与“哭”连用。“又哭了起来”比“转回去哭”更符合汉语习惯，同时保留动作再次发生的含义。
- source_word: גַּם בְּנֵי יִשְׂרָאֵל
  choice: 以色列人也
  rationale: 原文形式为“以色列的众子”，在此是民族称谓。“以色列人”是现代汉语中清楚自然的对应表达，“也”保留他们受到闲杂人群影响而加入哭诉的关系。
- source_word: מִי יַאֲכִלֵנוּ בָּשָׂר
  choice: 谁给我们肉吃呢？
  rationale: 使役形动词意为“使……吃”或“给……吃”。“给我们肉吃”简洁自然；בָּשָׂר在此指作为食物的肉，而非强调身体意义的“肉体”。
