  terminology: 人名“伊利达、米达”可保留。“灵”不宜译作“那灵”；此处可译“神的灵”，既清楚传达上下文中的所指，也不把本节简略的“那灵”不当地等同于特定后期术语。“帐幕”保留，脚注说明很可能指会幕。
