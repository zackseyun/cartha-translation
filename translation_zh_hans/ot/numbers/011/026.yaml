  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יִּשָּׁאֲר֣וּ שְׁנֵֽי אֲנָשִׁ֣ים בַּֽ/מַּחֲנֶ֡ה שֵׁ֣ם הָ/אֶחָ֣ד אֶלְדָּ֡ד וְ/שֵׁם֩ הַ/שֵּׁנִ֨י מֵידָ֜ד וַ/תָּ֧נַח עֲלֵי/הֶ֣ם הָ/ר֗וּחַ וְ/הֵ֨מָּה֙ בַּ/כְּתֻבִ֔ים וְ/לֹ֥א יָצְא֖וּ הָ/אֹ֑הֱלָ/ה וַ/יִּֽתְנַבְּא֖וּ בַּֽ/מַּחֲנֶֽה־׀׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/026.yaml
  text: But two men remained in the camp[a]. The name of the one was Eldad, and the name of the second was Medad. And the Spirit rested on them; they were among those recorded, but they had not gone out to the tent[b], and they prophesied in the camp.
translation:
  language: zh_hans
  text: 但有两个人留在营中：一个名叫伊利达，另一个名叫米达。神的灵降在他们身上；他们原是在被记录的人当中[a]，却没有到帐幕去[b]，仍在营中说预言。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们原是在登记在册的人当中。”原文直译为“他们是在被写下（或被记录）的人当中”。
    reason: lexical_alternative
  - marker: b
    text: 按本段语境，这帐幕很可能是指会幕。
    reason: cross_reference
lexical_decisions:
- source_word: וַיִּשָּׁאֲרוּ
  choice: 留在
  rationale: שׁאר表示留下或剩下；“留在”自然地表达他们仍在营中，又不推断他们没有出去的原因。
- source_word: שְׁנֵי אֲנָשִׁים
  choice: 两个人
  rationale: 原文指两个男性；现代汉语在已由姓名明确人物性别的语境中，用“两个人”比“两名男子”更自然，也没有改变所指。
- source_word: שֵׁם הָאֶחָד ... וְשֵׁם הַשֵּׁנִי
  choice: 一个名叫……另一个名叫……
  rationale: 以自然的现代汉语保留原文依次介绍两人姓名的结构。
- source_word: אֶלְדָּד / מֵידָד
  choice: 伊利达／米达
  rationale: 采用现代中文圣经中易于辨认的常见音译。
- source_word: וַתָּנַח עֲלֵיהֶם הָרוּחַ
  choice: 那灵停在他们身上
  rationale: 定冠词及上下文表明这是前文所说、使人得以说预言的灵；“那灵”保留所指的确定性，而不在中文中另加原文没有的称谓。“停在……身上”贴近 נוח 的安歇、停驻之意。
- source_word: וְהֵמָּה בַּכְּתֻבִים
  choice: 他们也在被记录的人当中
  rationale: כְּתֻבִים 字面为“被写下／被记录的人”；此译保留原文措辞及其可能指被列入名单的含义，避免直接把解释写成“登记在册”。
- source_word: וְלֹא יָצְאוּ הָאֹהֱלָה
  choice: 却没有出去到帐幕那里
  rationale: “出去”对应 יָצְאוּ，方向词尾由“到……那里”表达；主文只译原文的“帐幕”，不直接扩写为“会幕”。
- source_word: וַיִּתְנַבְּאוּ
  choice: 说预言
  rationale: 直接表达 נבא 在此处的先知性言说活动，不额外加入“开始”或持续时态。
theological_decisions:
- issue: הָרוּחַ 是否明确译作“圣灵”或“耶和华的灵”
  choice: 那灵
  alternative: 圣灵／耶和华的灵
  rationale: 上下文明确是从摩西身上分赐、使长老说预言的灵，但本节原文只说“那灵”。“那灵”既照应前文，也不加入本节未出现的神学称谓。
- issue: הָאֹהֱלָה 是否在主文明确译作“会幕”
  choice: 帐幕
  alternative: 会幕
  rationale: 本段语境很可能指会幕，但本节本身只写“帐幕”。主文保留原文的简略表达，并在脚注说明语境所指。
- issue: בַּכְּתֻבִים 是否确定解释为正式登记的长老名单
  choice: 在被记录的人当中
  alternative: 在登记在册的人当中
  rationale: 语境支持名单或登记的理解，但原文仍保有较宽的“被写下／被记录”含义；译文不把可能的行政程序说得过于确定。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“那灵”照应上文并保留原文的确定指称；“被记录的人当中”略带原文痕迹，是为保留其词义上的开放性。所有脚注标记均置于相关词句之后。
