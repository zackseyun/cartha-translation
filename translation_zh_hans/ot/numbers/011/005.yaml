base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/005.yaml
  text: We remember the fish that we ate in Egypt for nothing[a], the cucumbers, the melons, the leeks, the onions, and the garlic.
translation:
  language: zh_hans
  text: 我们记得在埃及白白吃的鱼[a]，还有黄瓜、瓜、韭葱、洋葱和大蒜。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“免费”或“不花钱”。这是百姓抱怨时对埃及生活的回忆，尽管他们当时实际上在那里作奴隶。
    reason: 说明 חִנָּם 的词义选择，并保留说话者视角与历史处境之间的张力。
lexical_decisions:
- source_word: זָכַרְנוּ
  choice: 我们还记得
  rationale: Qal完成式第一人称复数在直接引语中表达当前的回想；“还记得”自然传达抱怨中对往事的追忆。
- source_word: הַדָּגָה
  choice: 鱼
  rationale: 此词集合性地指作为食物的鱼类；汉语用“鱼”即可保留集合意义。
- source_word: אֲשֶׁר נֹאכַל
  choice: 吃的
  rationale: 未完成式在此处具有过去惯常行为的语境意义；放在“还记得”之后，汉语不必另加“过去常常”也能自然表达。
- source_word: בְּמִצְרַיִם
  choice: 在埃及
  rationale: 直接保留地点短语。
- source_word: חִנָּם
  choice: 白白
  rationale: 表示不付代价、免费；“白白吃”是自然的现代汉语，同时保留说话者抱怨视角及其与埃及奴役现实之间的反讽张力。
- source_word: הַקִּשֻּׁאִים
  choice: 黄瓜
  rationale: 采用该农产品名称的标准辨识。
- source_word: הָאֲבַטִּחִים
  choice: 甜瓜
  rationale: 原词指某种瓜类，可能特指西瓜；“甜瓜”保持较宽泛的瓜类指称，避免过度确定品种。
- source_word: הֶחָצִיר
  choice: 韭菜
  rationale: 该词通常可指青草，但在这份食物清单中较可能指葱属蔬菜；“韭菜”承接传统且合乎语境的理解。
- source_word: הַבְּצָלִים
  choice: 洋葱
  rationale: 采用此词的标准现代汉语对应词。
- source_word: הַשּׁוּמִים
  choice: 大蒜
  rationale: 采用此词的标准现代汉语对应词。
theological_decisions:
- issue: 结合以色列人在埃及受奴役的背景理解 חִנָּם
  choice: 白白
  alternative: 免费；不花钱
  rationale: 经文是在转述百姓自己抱怨时的说法，并非对埃及奴役生活作客观的神学评价。直译这一副词可保留其修辞力量和反讽，而不在正文中替说话者纠正观点。
translation_notes:
  register: 采用现代、清楚而庄重的普通话。“我们还记得”符合直接抱怨的口吻；食物名称使用普通读者熟悉的词汇。
