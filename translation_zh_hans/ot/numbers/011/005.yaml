  terminology: “黄瓜、洋葱、大蒜”准确。“瓜”保留 הָאֲבַטִּחִים 的非特定性，不在正文判定为甜瓜或西瓜。“韭葱”对应 leek，优于“韭菜”。脚注对 חִנָּם 的处理恰当，且不把埃及的奴役背景改写进正文。
  issues:
