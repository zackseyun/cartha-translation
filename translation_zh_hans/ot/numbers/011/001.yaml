id: NUM.11.1
reference: Numbers 11:1
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יְהִ֤י הָ/עָם֙ כְּ/מִתְאֹ֣נְנִ֔ים רַ֖ע בְּ/אָזְנֵ֣י יְהוָ֑ה וַ/יִּשְׁמַ֤ע יְהוָה֙ וַ/יִּ֣חַר אַפּ֔/וֹ וַ/תִּבְעַר בָּ/ם֙ אֵ֣שׁ יְהוָ֔ה וַ/תֹּ֖אכַל בִּ/קְצֵ֥ה הַֽ/מַּחֲנֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/001.yaml
  text: The people were like those who complain of hardship in the hearing of Yahweh[a], and Yahweh heard it, and his anger burned[d][c][b], and the fire of Yahweh burned among them and consumed some at the edge of the camp.
translation:
  language: zh_hans
  text: 百姓仿佛在为苦难抱怨；这话传到耶和华耳中[a]。耶和华听见了，怒气燃起；耶和华的火在他们中间燃烧[b]，吞噬了营地边缘的一些东西[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “仿佛在为苦难抱怨”：希伯来语此处的形式罕见且较难理解；也可译作“像抱怨的人一样”或“像是在抱怨”。“传到耶和华耳中”直译为“在耶和华耳中”，是指他们的抱怨被耶和华听见。
    reason: 保留罕见形式的比较语气、词义不确定性，以及“在……耳中”的听觉惯用语。
  - marker: b
    text: “耶和华的火”也可译作“从耶和华而来的火”。
    reason: 原文属格结构可表示所属或来源。
  - marker: c
    text: 原文只说火在“营地边缘”吞噬或烧毁，没有明确说明被吞噬的是人、帐棚还是营地的其他部分。
    reason: 避免把原文未明说的受词限定为人或营地的一部分。
lexical_decisions:
- source_word: וַיְהִי הָעָם כְּמִתְאֹנְנִים רַע
  choice: 百姓怨声不止，诉说自己的苦楚
  rationale: 希伯来语短语罕见且句法较难；כְמִתְאֹנְנִים带有“像抱怨的人／仿佛在抱怨”的比较色彩，רַע在此较可能指苦楚、困境。正文用自然汉语表达持续发怨言及其内容，同时在脚注保留形式上的歧义。
- source_word: בְּאָזְנֵי יְהוָה
  choice: 耶和华听见了
  rationale: 原文直译为“在耶和华耳中”，意指怨言传到耶和华那里；以自然汉语保留听觉意象。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的专名“耶和华”译出四字神名，不以头衔替代。
- source_word: וַיִּחַר אַפּוֹ
  choice: 怒气就发作
  rationale: 这是表示愤怒燃起的希伯来语惯用语；中文“怒气发作”清楚自然，也避免生硬直译“鼻子发热”。
- source_word: וַתִּבְעַר בָּם אֵשׁ יְהוָה
  choice: 耶和华的火在他们中间燃烧
  rationale: 保留“耶和华的火”这一属格关系及בָּם所表达的“在他们中间”；脚注提示也可理解为“从耶和华而来的火”。
- source_word: וַתֹּאכַל בִּקְצֵה הַמַּחֲנֶה
  choice: 烧毁了营地边缘的一些地方
  rationale: 原文只说火“吞噬／烧毁”在营地边缘，并未明说宾语是人还是营地的一部分；译作“一些地方”使中文完整，同时不擅自断定有人被烧死。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用神的专名；中文正文采用广为人知且具有尊严的“耶和华”，而不是用“主”替代专名。
- issue: 审判之火与耶和华的关系
  choice: 耶和华的火
  alternative: 从耶和华而来的火
  rationale: 原文אֵשׁ יְהוָה可表达所属或来源；正文保留较形式对应的属格结构，脚注列出来源性的理解，不削弱经文把火与耶和华直接联系起来的陈述。
- issue: 火所烧毁的对象
  choice: 营地边缘的一些地方
  alternative: 营地边缘的一些人
  rationale: 希伯来文没有明示受词，不能确定所烧毁的是人、帐棚或营地的一部分；选择较少限定的表达，以免添加经文没有明说的死亡结论。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。短句划分增强可读性；“怨声不止”传达分词的持续意味。正文不使用古雅的“怒气发作”以外过度文言表达，并以脚注保留原文的词汇、句法及神学歧义。
