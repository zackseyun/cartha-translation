base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/008.yaml
  text: The people would roam about and gather it, and grind it in the millstones or crush it in the mortar, and boil it in the pot, and make it into cakes; and its taste was like the taste of rich oil.
translation:
  language: zh_hans
  text: 百姓四处走动，把它收集起来，用磨石磨碎，或放在臼里捣碎，再放在锅里煮，做成饼；它的滋味好像油的醇厚滋味。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“鲜油的滋味。”希伯来语“לְשַׁד הַשָּׁמֶן”词义难定，可能指油的丰润、醇厚，或新鲜油。
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁטוּ
  choice: 四处走动
  rationale: 该动词表示在一片区域内来回走动；结合上下文，用“四处走动”自然地描写百姓惯常收取吗哪的行动。
- source_word: לָקְטוּ
  choice: 收集起来
  rationale: 这是常用于采集、拾取的动词；“收集起来”符合百姓收取吗哪的语境。
- source_word: טָחֲנוּ בָרֵחַיִם
  choice: 用磨磨碎
  rationale: רֵחַיִם 指手磨或磨石；“用磨磨碎”保留具体工具及介词的工具意义，也符合现代汉语表达。
- source_word: דָכוּ בַּמְּדֹכָה
  choice: 放在臼里捣碎
  rationale: 动词表示捣碎、压碎，מְדֹכָה 指臼；此译具体而自然。
- source_word: בִשְּׁלוּ בַּפָּרוּר
  choice: 放在锅里煮
  rationale: 动词可表示煮或烹调，פָּרוּר 是锅类器皿；“放在锅里煮”直接保留原文所述的器具和做法。
- source_word: עָשׂוּ אֹתוֹ עֻגוֹת
  choice: 做成饼
  rationale: עֻגוֹת 指饼，可能带有圆饼之意，但形状并非本句重点；“做成饼”简洁地保留宾语关系。
- source_word: טַעְמוֹ
  choice: 它的滋味
  rationale: 该词表示味道、滋味；“滋味”在此庄重自然，并适合描述食物。
- source_word: לְשַׁד הַשָּׁמֶן
  choice: 油脂的浓香
  rationale: לְשַׁד 是罕见且含义困难的词，可能指丰润、脂膏或鲜润的精华；“油脂的浓香”在中文中传达浓郁丰润的味觉感受，同时以脚注保留“鲜油”等可能理解。
theological_decisions: []
translation_notes:
  register: 采用现代、清楚而庄重的叙述语体。以连续动词重现百姓收集、加工和烹煮吗哪的过程；“它”承接上下文中的吗哪。困难短语 לְשַׁד הַשָּׁמֶן 不作过度确定的解释，并用脚注保留另一种主要译法。
