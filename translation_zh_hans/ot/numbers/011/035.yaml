  yaml_path: translation/ot/numbers/011/035.yaml
  text: From Kibroth-hattaavah the people set out for Hazeroth[a], and they stayed at Hazeroth.
translation:
  language: zh_hans
  text: 百姓从基博罗·哈他瓦出发，前往哈洗录[a]，并在哈洗录停留。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “基博罗·哈他瓦”意思是“贪欲之墓”，也可译作“欲望之墓”。
    reason: 说明该地名可辨识的词源含义，并保留תַּאֲוָה可指贪欲或欲望的语义幅度。
lexical_decisions:
- source_word: מִקִּבְרוֹת הַתַּאֲוָה
  choice: 从基博罗·哈他瓦
  rationale: 该词组在叙事中用作地名，采用音译；其由普通名词构成的含义保留在脚注中。
- source_word: נָסְעוּ
  choice: 出发
  rationale: נסע在行程叙事中通常指拔营启程；“出发”符合现代汉语，也保留离开上一地点的意味。
- source_word: הָעָם
  choice: 百姓
  rationale: 此处指以色列民整体；“百姓”是圣经叙事中自然、庄重而通俗的对应词。
- source_word: חֲצֵרוֹת
  choice: 哈洗录
  rationale: 这是专有地名，按现代中文圣经常用形式音译。
- source_word: וַיִּהְיוּ בַּחֲצֵרוֹת
  choice: 并在哈洗录停留
  rationale: 字面为“他们在哈洗录”，但在行程语境中表示驻留于该地；“停留”自然传达这一叙事功能，且不额外限定停留时长。
