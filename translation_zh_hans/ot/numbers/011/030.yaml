  yaml_path: translation/ot/numbers/011/030.yaml
  text: Then Moses returned to the camp[a], he and the elders of Israel.
translation:
  language: zh_hans
  text: 于是，摩西和以色列的长老回到营里。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或按字面译：“于是，摩西被聚集回营中；他和以色列的长老。”原文动词可作较字面的译法；但在本段语境中，意思是摩西与以色列的长老回到了营里。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּאָסֵף
  choice: 回到
  rationale: 该词是动词 אסף 的尼法勒形态，并带叙事性连接形式；字面可理解为“被聚集”，但在本段语境中表示摩西在先前事件之后返回营地。“回到”自然准确地表达了这里的行动含义。
- source_word: אֶל הַמַּחֲנֶה
  choice: 营里
  rationale: מַחֲנֶה 指以色列人的营地；介词 אֶל 基本义为“向、到”。汉语说“回到营里”自然，也保留了返回营地的方向含义。
- source_word: הוּא וְזִקְנֵי יִשְׂרָאֵל
  choice: 摩西和以色列的长老
  rationale: 原文用代词 הוּא 回指摩西，再与“以色列的长老”并列，表明摩西与长老一同返回。汉语直接重提“摩西”，可避免生硬的“他和……”，同时清楚保留并列关系。
- source_word: זִקְנֵי יִשְׂרָאֵל
  choice: 以色列的长老
  rationale: 这是该属格结构清楚而庄重的标准译法，符合现代汉语圣经叙事语体。
theological_decisions: []
