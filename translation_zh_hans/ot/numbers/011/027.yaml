  text: Then a young man ran and told Moses[a], and said, “Eldad and Medad are prophesying in the camp.”
translation:
  language: zh_hans
  text: 有个年轻人跑去告诉摩西[a]，说：“伊利达和米达正在营中说预言。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“那个年轻人跑去向摩西报告。”希伯来语在“年轻人”前有定冠词；“告诉”也可译作“报告”或“通报”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּרָץ
  choice: 跑来
  rationale: רוץ直接表示“跑”；结合叙事视角译作“跑来”，自然地表现他来到摩西面前报告。
- source_word: הַנַּעַר
  choice: 有一个年轻人
  rationale: נַעַר可指少年或年轻男子。此人此前未明确出现，现代汉语叙事用“有一个年轻人”引入更自然；希伯来语定冠词的形式差异收入脚注。
- source_word: וַיַּגֵּד לְמֹשֶׁה
  choice: 告诉摩西
  rationale: נגד的使役式在此指告诉、报告；“告诉摩西”简洁自然，后面的直接引语给出报告内容。
- source_word: וַיֹּאמַר
  choice: 说
  rationale: אמר是引出直接引语的常用动词；汉语无需重复连接词，译作“说”即可保留叙事顺序。
- source_word: אֶלְדָּד וּמֵידָד
  choice: 伊利达和米达
  rationale: 按现代中文圣经人名的通行音译处理，不翻译名字的词源含义。
- source_word: מִתְנַבְּאִים
  choice: 正在……说预言
  rationale: נבא的Hitpael分词表示持续进行中的先知性活动；“正在说预言”既保留进行状态，也比“预言”单独作动词更符合现代汉语习惯。
- source_word: בַּמַּחֲנֶה
  choice: 在营里
  rationale: מַחֲנֶה在本段指以色列人的营地；“在营里”准确且简洁。
