  text: וַ/יִּקְרָ֛א אֶת שֵֽׁם הַ/מָּק֥וֹם הַ/ה֖וּא קִבְר֣וֹת הַֽתַּאֲוָ֑ה כִּי שָׁם֙ קָֽבְר֔וּ אֶת הָ/עָ֖ם הַ/מִּתְאַוִּֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/034.yaml
  text: So the name of that place was called Kibroth-hattaavah[a], because there they buried the people who had craved.
translation:
  language: zh_hans
  text: 于是，他给那地方起名叫“基博罗·哈他瓦”[a]，因为他们在那里埋葬了那些贪求的人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “基博罗·哈他瓦”可能意为“贪求之墓”或“贪婪欲望之墓”。
    reason: 说明音译地名的希伯来语含义；“贪求”与“贪婪欲望”体现该词可指强烈、失序的欲求，且不将其限于性欲。
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: 于是，他……起名叫
  rationale: 该词是קרא的连续叙事形式，第三人称阳性单数；“于是”承接叙事，“起名叫”自然传达希伯来语“称……的名”的命名表达，同时保留原文未明说姓名的“他”。
- source_word: אֶת שֵׁם הַמָּקוֹם הַהוּא
  choice: 给那地方起名
  rationale: 以现代汉语自然的命名句式表达原文“称那地方的名”，并保留“那地方”的指示意义。
- source_word: קִבְרוֹת הַתַּאֲוָה
  choice: 基博罗·哈他瓦
  rationale: 正文音译地名，不用释义取代专名；其可能含义在脚注中说明。中点帮助现代读者辨认复合地名的两个音译部分。
- source_word: כִּי
  choice: 因为
  rationale: 引出该地得名的原因，符合现代汉语的因果表达。
- source_word: שָׁם
  choice: 在那里
  rationale: 直接表达地点副词的方位意义。
- source_word: קָבְרוּ
  choice: 他们……埋葬了
  rationale: 准确表达קבר的复数完成式；“埋葬”庄重而通俗。
- source_word: הָעָם הַמִּתְאַוִּים
  choice: 那些起贪欲的人
  rationale: 关系化表达“那群正在/曾经贪求的人”。“起贪欲”保留התאוה所指的强烈、失序欲求，又不把语义误限为性欲。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。正文保留地名音译，并用脚注呈现其解释性含义；不补出“他”具体是谁，也不将“贪欲”窄化为性欲。
