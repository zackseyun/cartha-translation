source:
  edition: WLC
  text: וְ/אֶל הָ/עָ֨ם תֹּאמַ֜ר הִתְקַדְּשׁ֣וּ לְ/מָחָר֮ וַ/אֲכַלְתֶּ֣ם בָּשָׂר֒ כִּ֡י בְּכִיתֶם֩ בְּ/אָזְנֵ֨י יְהוָ֜ה לֵ/אמֹ֗ר מִ֤י יַאֲכִלֵ֨/נוּ֙ בָּשָׂ֔ר כִּי ט֥וֹב לָ֖/נוּ בְּ/מִצְרָ֑יִם וְ/נָתַ֨ן יְהוָ֥ה לָ/כֶ֛ם בָּשָׂ֖ר וַ/אֲכַלְתֶּֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/018.yaml
  text: And to the people you shall say[a], ‘Consecrate yourselves for tomorrow, and you shall eat meat, because you have wept in the hearing of Yahweh, saying, “Who will feed us meat? For it was good for us in Egypt.” And Yahweh will give you meat, and you shall eat.”
translation:
  language: zh_hans
  text: 你要对百姓说：“你们要为明天自洁[a]，就会吃肉；因为你们曾在雅威耳中哭泣，说：‘谁会给我们肉吃呢？因为我们在埃及过得很好。’雅威会把肉给你们，你们就会吃。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“使自己分别为圣，预备明天”。希伯来语动词表示为迎接雅威的行动而把自己分别出来。
    reason: 说明“自洁”所对应动词的圣洁、分别和预备含义。
lexical_decisions:
- source_word: תֹּאמַר
  choice: 你要……说
  rationale: 未完成式第二人称阳性单数在此具有指令语气；用“你要”自然表达雅威对摩西的命令。
- source_word: הִתְקַדְּשׁוּ
  choice: 自洁
  rationale: 该词是קדשׁ的Hitpael命令式，表示为迎接神的行动而使自己成为圣洁、分别出来；“自洁”简洁庄重，并保留宗教礼仪色彩。
- source_word: לְמָחָר
  choice: 为明天
  rationale: 介词לְ指向即将到来的日子，表示为明天所发生的事作准备。
- source_word: וַאֲכַלְתֶּם בָּשָׂר
  choice: 就会吃肉
  rationale: בָּשָׂר在此指供食用的肉；接在命令式之后的形式表达将来的结果。
- source_word: בְּכִיתֶם
  choice: 曾……哭泣
  rationale: 完成式指百姓先前的行为，而“曾”体现该行为与当前宣告的关联。
- source_word: בְּאָזְנֵי יְהוָה
  choice: 在雅威耳边
  rationale: 保留希伯来文“在……耳中”的形象，同时以自然中文表达雅威听见了他们的话。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以通行的现代汉语音译呈现四字神名，保留其作为以色列之神专名的性质，而不以称号替代。
- source_word: מִי יַאֲכִלֵנוּ בָּשָׂר
  choice: 谁会给我们肉吃呢？
  rationale: אכל的Hiphil形式具有使役义，即“使我们吃”；中文“给我们肉吃”准确且自然。
- source_word: כִּי טוֹב לָנוּ בְּמִצְרָיִם
  choice: 因为我们在埃及过得很好
  rationale: 保留טוֹב的正面陈述，不擅自加入原文没有明说的比较级“更好”。
- source_word: וְנָתַן יְהוָה לָכֶם בָּשָׂר
  choice: 雅威会把肉给你们
  rationale: 保留简单连接所承载的顺承关系，不用“所以”把因果关系表达得比原文更明确。
- source_word: וַאֲכַלְתֶּם
  choice: 你们就会吃
  rationale: 保留原文对“吃”的重复，以维持强调和修辞力量。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；“雅威”以现代汉语音译保留其专名性质，而“上主”是称号，“耶和华”则源于较晚形成的混合读法。
- issue: הִתְקַדְּשׁוּ的宗教含义
  choice: 自洁
  alternative: 使自己分别为圣；预备自己
  rationale: “自洁”既保留为神圣行动作准备的意味，也避免仅译作“预备”而抹去קדשׁ的圣洁语义；脚注说明其分别出来的含义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“自洁”保留宗教语域，并以脚注补足“分别为圣”的词义；引语层级清楚，重复“吃”以再现原文强调。
