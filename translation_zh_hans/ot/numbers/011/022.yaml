base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/022.yaml
  text: Would sheep and cattle be slaughtered for them and be enough for them? Or if all the fish of the sea were gathered for them[a], would it be enough for them?
translation:
  language: zh_hans
  text: 难道为他们宰杀羊和牛，就够他们吃吗？或者，把海里所有的鱼都聚集起来给他们，就够他们吃吗？[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “够他们吃”原文直译为“为他们找得到”；这里是表示“足够、够用”的习语。
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲ
  choice: 难道……吗
  rationale: 疑问词引出摩西带有质疑意味的反问；“难道……吗”在现代汉语中自然传达这种语气。
- source_word: צֹאן וּבָקָר
  choice: 羊群牛群
  rationale: צֹאן泛指羊类小牲畜，בָקָר指牛；用“羊群牛群”既具体清楚，又保留群体性的意味。
- source_word: יִשָּׁחֵט
  choice: 宰了
  rationale: 该动词指宰杀牲畜；“宰了”符合供人食用的语境，比泛泛的“杀了”更准确自然。
- source_word: לָהֶם
  choice: 给他们
  rationale: 此处表示为百姓供应食物；“给他们”是自然的现代汉语表达。
- source_word: וּמָצָא לָהֶם
  choice: 就够他们吃
  rationale: מצא ל在这里是“足够、够用”的习语；上下文明确谈论食物，因此补出“吃”使汉语自然，同时不改变所指。
- source_word: אִם
  choice: 或者
  rationale: 这里引出反问中的第二种设想，与前一分句构成选择关系；“或者”比单纯译作“如果”更清楚。
- source_word: אֵת כָּל דְּגֵי הַיָּם
  choice: 海里所有的鱼
  rationale: 直接保留“所有”的总体范围，并以现代汉语自然表达“海中的鱼”。
- source_word: יֵאָסֵף
  choice: 都聚拢来
  rationale: 该被动形式意为“被聚集、被收集”；“聚拢来”保留汇集之意，不额外限定为捕捞。
