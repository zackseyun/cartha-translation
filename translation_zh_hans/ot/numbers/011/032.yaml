base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/032.yaml
  text: And the people rose up all that day and all that night and all the next day[a], and they gathered the quail. The one who gathered the least gathered ten homers[b], and they spread them out for themselves all around the camp.
translation:
  language: zh_hans
  text: 百姓起来后，那一整天、整夜和第二天一整天都在收集鹌鹑。收得最少的也收了十贺梅珥[a]；他们把鹌鹑摊开来，铺在营地四周。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “贺梅珥”是古代一种很大的干量单位，确切折合成现代容量并不确定。这里强调的是，即使收得最少的人也收集了极多的鹌鹑。这个词也可能按其与“驴”一词的关联理解为“十驴驮”。
    reason: 说明古代计量单位，并保留该词按词源关联所作的另一种可能理解。
lexical_decisions:
- source_word: וַיָּקָם הָעָם
  choice: 百姓起来
  rationale: 保留קום所表达的起身投入行动这一叙事推进，同时使用现代汉语自然的说法。
- source_word: כָּל הַיּוֹם הַהוּא וְכָל הַלַּיְלָה וְכֹל יוֹם הַמָּחֳרָת
  choice: 整整那一天、那一夜和第二天
  rationale: 用“整整”传达三个כָּל所强调的持续时间，并保留从当天、当夜直到次日的连续性。
- source_word: וַיַּאַסְפוּ אֶת־הַשְּׂלָו
  choice: 都在收集鹌鹑
  rationale: “收集”准确表达אָסף，加入“都在”使汉语清楚呈现百姓在整段时间持续进行的行动。
- source_word: הַמַּמְעִיט אָסַף
  choice: 收得最少的也收了
  rationale: 依上下文把分词的省略意义明确为收集数量最少者；“也”自然凸显最低数量仍然巨大。
- source_word: עֲשָׂרָה חֳמָרִים
  choice: 十贺梅珥
  rationale: 将חֹמֶר作为古代容量单位音译，避免用现代单位制造虚假的精确性，也不在正文中采用较不确定的“十驴驮”。
- source_word: וַיִּשְׁטְחוּ לָהֶם שָׁטוֹחַ
  choice: 他们把鹌鹑摊开，铺在
  rationale: 用“摊开，铺在”体现同根动词与不定式所加强的铺展动作；宾语“鹌鹑”按上下文补明。“为自己”在汉语中并非必要，且不可过度解释用途。
- source_word: סְבִיבוֹת הַמַּחֲנֶה
  choice: 营地四周
  rationale: 简洁传达围绕整个营地的分布范围。
theological_decisions: []
