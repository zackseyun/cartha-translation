  to: 摩西对雅威[a]说：“你为什么苦待你的仆人[b]？我为什么没有在你眼前蒙恩[c]，以致你竟把这全体百姓的重担都放在我身上？”
  rationale: 仅作必要的句法澄清：加入“以致你竟”以明确“把这全体百姓的重担放在我身上”的施事是雅威，并对应前面两项质问所引出的申诉性结果/内容。以“放在”贴近 לָשׂוּם（放置），同时保留“重担”隐喻。脚注锚点和内容均保持有效。
