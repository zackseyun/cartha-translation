  text: וַ/יֹּ֨אמֶר מֹשֶׁ֜ה אֶל יְהוָ֗ה לָ/מָ֤ה הֲרֵעֹ֨תָ֙ לְ/עַבְדֶּ֔/ךָ וְ/לָ֛/מָּה לֹא מָצָ֥תִי חֵ֖ן בְּ/עֵינֶ֑י/ךָ לָ/שׂ֗וּם אֶת מַשָּׂ֛א כָּל הָ/עָ֥ם הַ/זֶּ֖ה עָלָֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/011.yaml
  text: And Moses said to Yahweh[a], “Why have you treated your servant badly? And why have I not found favor in your eyes[c][b], that you have laid the burden of all this people on me?”
translation:
  language: zh_hans
  text: 摩西对雅威[a]说：“你为什么苦待你的仆人[b]？我为什么没有在你眼前蒙恩[c]，以致你竟把这全体百姓的重担都放在我身上？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “雅威”是希伯来文四字神名יהוה的音译。
    reason: divine_name
  - marker: b
    text: “苦待”所译的希伯来文也可较直译为“使你的仆人遭遇坏事”或“降祸给你的仆人”，表现摩西强烈的申诉。
    reason: lexical_alternative
  - marker: c
    text: 希伯来文直译为“在你眼中找到恩惠”，是得到某人恩待的常见说法。
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  choice: 雅威
  rationale: 采用四字神名的常见中文音译，保留其作为以色列之上帝专名的性质，不以称号代替。
- source_word: הֲרֵעֹתָ
  choice: 苦待
  rationale: 该词为רעע的使役式，可表达使人遭受坏事、伤害或祸患。“苦待”自然地传达摩西因所受重压而发出的强烈申诉，同时不替经文断定上帝在道德上行恶。
- source_word: לְעַבְדֶּךָ
  choice: 你的仆人
  rationale: 这里是摩西在上帝面前的自称，重点在谦卑和从属关系；“仆人”比“奴隶”更符合语境。
- source_word: מָצָתִי חֵן בְּעֵינֶיךָ
  choice: 在你眼前蒙恩
  rationale: 保留希伯来语“在某人眼中找到恩惠”的常见表达，同时采用自然、庄重的现代中文。
- source_word: לָשׂוּם
  choice: 竟把……压在
  rationale: 结合“重担”这一搭配，将“放置”具体译为“压在”，并以“竟”传达前文两个质问所含的申诉语气和结果关系。
- source_word: מַשָּׂא
  choice: 重担
  rationale: 既保留负荷的比喻，也传达治理全体百姓给摩西造成的沉重压力。
- source_word: כָּל הָעָם הַזֶּה
  choice: 这全体百姓
  rationale: “百姓”在中文中本身具有集合意义；“这全体百姓”保留原文单数集合名词和“全部”的范围。
- source_word: עָלָי
  choice: 压在我身上
  rationale: 与“重担”构成自然的中文比喻，准确表达责任落到摩西身上。
theological_decisions:
- issue: 以הֲרֵעֹתָ描述雅威对摩西的作为，可能被理解为上帝行了道德上的恶
  choice: 译作“苦待”
  alternative: “向你的仆人行恶”或“降祸给你的仆人”
  rationale: 原文措辞尖锐，表达摩西的痛苦申诉；“苦待”保留这种张力，却不把摩西主观申诉中的“坏处/祸患”擅自提升为关于上帝道德邪恶的断言。脚注同时保留较直译的可能。
- issue: מָצָתִי חֵן בְּעֵינֶיךָ是形象化习语还是抽象陈述
  choice: 保留为“在你眼前蒙恩”
  alternative: “没有得到你的恩待”
  rationale: 保留原文的身体意象和圣经希伯来语习语，同时中文读者仍能自然理解。
translation_notes:
  register: 采用现代、庄重而口语可懂的申诉语气。“竟”突出摩西质问中的惊愕与痛苦；“重担……压在我身上”保留原文负重的比喻。
