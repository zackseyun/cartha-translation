source:
  edition: WLC
  text: וְ/ר֜וּחַ נָסַ֣ע מֵ/אֵ֣ת יְהוָ֗ה וַ/יָּ֣גָז שַׂלְוִים֮ מִן הַ/יָּם֒ וַ/יִּטֹּ֨שׁ עַל הַֽ/מַּחֲנֶ֜ה כְּ/דֶ֧רֶךְ י֣וֹם כֹּ֗ה וּ/כְ/דֶ֤רֶךְ יוֹם֙ כֹּ֔ה סְבִיב֖וֹת הַֽ/מַּחֲנֶ֑ה וּ/כְ/אַמָּתַ֖יִם עַל פְּנֵ֥י הָ/אָֽרֶץ׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/031.yaml
  text: Then a wind went out from Yahweh and drove quail in from the sea[a], and let them fall beside the camp, about a day’s journey on this side and a day’s journey on that side, all around the camp[b], and about two cubits above the surface of the ground.
translation:
  language: zh_hans
  text: 有一阵风从耶和华那里刮来[a]，把鹌鹑从海上卷来，落在营地四周；向这边约有一天的路程，向那边也约有一天的路程，环绕营地；鹌鹑离地面约两肘高[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “风”也可译作“灵”；但这里的上下文更支持“风”，因为它把鹌鹑从海上带来。
    reason: lexical_alternative
  - marker: b
    text: 原文为“在地面上（或之上）约两肘”。这可能是说鹌鹑铺展或飞行时离地的高度，也可能指它们在地面上堆积的厚度。
    reason: alternative_reading
lexical_decisions:
- source_word: וְרוּחַ
  choice: 一阵风
  rationale: רוּחַ可指“风、气息、灵”；本句描述它从海上带来鹌鹑，语境最支持“风”，同时以脚注保留“灵”的词义可能。
- source_word: נָסַע מֵאֵת יְהוָה
  choice: 从耶和华那里刮来
  rationale: נָסַע本义为“起行、出发”；与“风”和מֵאֵת连用时，表达风从耶和华那里发出并开始运行。“刮来”符合现代汉语，也保留其来源。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的神名音译“耶和华”，而不以称号替代专名。
- source_word: וַיָּגָז שַׂלְוִים
  choice: 把鹌鹑从海上卷来
  rationale: גוז在此罕见，按上下文指风将鹌鹑带来；“卷来”既体现风的推动力，又不采用难懂的机械直译。
- source_word: מִן הַיָּם
  choice: 从海上
  rationale: 按通常地理意义译出鹌鹑来自海面或海的方向，不擅自改为“从西边”。
- source_word: וַיִּטֹּשׁ עַל הַמַּחֲנֶה
  choice: 散落在营地四周
  rationale: נטשׁ可表示铺开、投下或留下；后文明确说分布在营地周围，因此“散落”表达结果，“四周”避免误解为只落在帐篷上。
- source_word: כְּדֶרֶךְ יוֹם כֹּה וּכְדֶרֶךְ יוֹם כֹּה
  choice: 这边约有一天的路程，那边约有一天的路程
  rationale: 保留希伯来文“这边……那边……”的重复结构，并清楚表达从营地向外延展的范围。
- source_word: סְבִיבוֹת הַמַּחֲנֶה
  choice: 遍布营地周围
  rationale: 复数形式带有环绕各处的概括意义；“遍布”体现其广泛分布。
- source_word: וּכְאַמָּתַיִם
  choice: 约……两肘高
  rationale: כְּ表示约数；保留古代长度单位“两肘”，不把不确定的现代换算写入正文。
- source_word: עַל פְּנֵי הָאָרֶץ
  choice: 在地面以上
  rationale: 字面为“在地面之上/地面上”；结合“两肘”，正文采用高度解释，但以脚注保留它也可能描述堆积厚度或飞行高度的歧义。
theological_decisions:
- issue: 风从耶和华而来的施事关系
  choice: 描述一阵源自耶和华的风，借此把鹌鹑带来
  alternative: 可更动态地译成“耶和华刮起一阵风”，突出耶和华直接差遣风
  rationale: 原文明确风的来源是耶和华，却没有进一步说明作用机制；译文同时保留神的主权施事和风作为自然媒介。
- issue: רוּחַ是“风”还是“灵”
  choice: 正文译“风”
  alternative: “有一个灵从耶和华那里出来”
  rationale: 该词自身可有两义；但从海上运来鹌鹑的动作强烈支持“风”。脚注保留词汇上的真实可能，避免抹去原文多义性。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“刮来、卷来、散落”形成清楚的动作链；保留“两肘”这一古代单位，并用脚注说明末句在高度、飞行状态或堆积厚度之间的歧义。所有脚注标记均已置于正文。
