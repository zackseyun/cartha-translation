  text: הַ/בָּשָׂ֗ר עוֹדֶ֨/נּוּ֙ בֵּ֣ין שִׁנֵּי/הֶ֔ם טֶ֖רֶם יִכָּרֵ֑ת וְ/אַ֤ף יְהוָה֙ חָרָ֣ה בָ/עָ֔ם וַ/יַּ֤ךְ יְהוָה֙ בָּ/עָ֔ם מַכָּ֖ה רַבָּ֥ה מְאֹֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/033.yaml
  text: While the meat was still between their teeth[a], before it was consumed, Yahweh’s anger burned against the people, and Yahweh struck the people with a very severe plague.
translation:
  language: zh_hans
  text: 肉还在他们牙齿之间，尚未吃完[a]，雅威就向百姓发怒；雅威以极其严重的灾殃击打百姓。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “吃完”直译为“被割断”或“被除去”；这里指肉还没有吃尽。
    reason: 说明希伯来原文的字面表达及其在进食语境中的含义。
lexical_decisions:
- source_word: הַבָּשָׂר
  choice: 肉
  rationale: 上下文所指是作为食物的鹌鹑肉；现代汉语用“肉”自然准确。
- source_word: עוֹדֶנּוּ בֵּין שִׁנֵּיהֶם
  choice: 还在他们牙齿之间
  rationale: 保留原文鲜明的进食画面，同时符合现代汉语表达。
- source_word: טֶרֶם יִכָּרֵת
  choice: 尚未吃完
  rationale: יִכָּרֵת字面为“被割断、被除去”，在进食语境中自然理解为肉还没有吃完；脚注保留字面可能性。
- source_word: וְאַף יְהוָה חָרָה בָעָם
  choice: 雅威就向百姓发怒
  rationale: 该希伯来习语表达怒气燃起。汉语“发怒”自然庄重；“就”体现事件紧接发生，但不额外解释神怒的性质。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见音译呈现四字神名，保留其专名性质，不以称号替代。
- source_word: וַיַּךְ יְהוָה בָעָם
  choice: 雅威重重击打百姓
  rationale: נכה表示击打；结合后面的灾殃结果，用“重重击打”保留审判的力度。
- source_word: מַכָּה רַבָּה מְאֹד
  choice: 使他们遭受极其严重的灾殃
  rationale: מַכָּה可指打击及由此造成的灾害；“灾殃”比特指疫病的“瘟疫”更能保留词义范围，“极其严重”表达רַבָּה מְאֹד的强烈程度。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华／主
  rationale: 原文直接使用四字神名；译作“雅威”保留专名，并避免以称号代替。
- issue: 神怒的拟人化表达
  choice: 雅威就向百姓发怒
  alternative: 雅威的怒气向百姓燃烧
  rationale: 保留神真实发怒和施行审判的陈述，同时采用自然现代汉语；不淡化为泛泛的不悦，也不额外作神学解释。
- issue: מַכָּה是瘟疫还是一般灾殃
  choice: 灾殃
  alternative: 瘟疫／灾祸
  rationale: 该词可泛指沉重打击或灾害，单凭本节未必限定为传染病；采用“灾殃”保留其语义宽度。
translation_notes:
  register: 采用自然、庄重而通俗的现代标准汉语。分号呈现神发怒与击打百姓之间紧密相连但有层次的动作；不使用古奥的“未及”“烈怒”等措辞。
