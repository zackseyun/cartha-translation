  text: וַ/יֹּ֤אמֶר ל/וֹ֙ מֹשֶׁ֔ה הַֽ/מְקַנֵּ֥א אַתָּ֖ה לִ֑/י וּ/מִ֨י יִתֵּ֜ן כָּל עַ֤ם יְהוָה֙ נְבִיאִ֔ים כִּי יִתֵּ֧ן יְהוָ֛ה אֶת רוּח֖/וֹ עֲלֵי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/029.yaml
  text: But Moses said to him[a], “Are you jealous for my sake? If only all Yahweh’s people were prophets[b], that Yahweh would put his Spirit on them!”
translation:
  language: zh_hans
  text: 摩西对他说：“你是在为我嫉妒吗？[a]但愿雅威的百姓人人都作先知，愿雅威使他的灵降在他们身上！”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “为我嫉妒”也可译作“替我嫉妒”或“为我大发热心”。原词可指嫉妒，也可指热切、排他性的维护；这里指约书亚维护摩西的态度。
    reason: 说明קנא在本句语境中的语义范围，并保留其张力。
  - marker: b
    text: 原文直译近于“愿雅威把他的灵放在他们身上”。“降在他们身上”保留原文“在……身上”的临到意象；本句延续前面的愿望。
    reason: 说明נתן与עַל的表达意象，并准确交代后半句与前面愿望的关系。
lexical_decisions:
- source_word: הַמְקַנֵּא אַתָּה לִי
  choice: 你是为我嫉妒吗
  rationale: קנא在这里指约书亚因维护摩西而产生的排他性热心；“为我嫉妒”保留了原文既可指嫉妒、也可指热切维护的语义张力。
- source_word: וּמִי יִתֵּן
  choice: 但愿
  rationale: 这是希伯来语表达强烈愿望的惯用语，并非询问“谁会赐下”；“但愿”自然、庄重地传达祈愿语气。
- source_word: כָּל עַם יְהוָה נְבִיאִים
  choice: 雅威的百姓人人都作先知
  rationale: “人人”自然表达כָּל修饰集合名词עַם所指的全体成员；“作先知”准确传达名词נְבִיאִים在此处的述语功能。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以通行的音译呈现四字神名，保留原文所用的专名，不以称号替代。
- source_word: כִּי יִתֵּן יְהוָה אֶת רוּחוֹ עֲלֵיהֶם
  choice: 但愿雅威使他的灵降在他们身上
  rationale: 把כִּי所引出的内容理解为延续前句愿望；“降在……身上”自然保留עַל的临到意象，而“他的灵”在预言语境中明确指雅威的灵。
theological_decisions:
- issue: כִּי与前一愿望句的关系
  choice: 以第二个“但愿”表达与前句并列、延续的愿望
  alternative: “因为雅威把他的灵赐在他们身上”或“当雅威把他的灵赐在他们身上时”
  rationale: 在“但愿人人都作先知”的祈愿语境中，后半句最自然地说明与此愿望相连的神圣赋能；重复“但愿”使现代汉语清楚，同时脚注保留连接词的其他可能理解。
- issue: רוּחוֹ在预言赋能语境中的所指
  choice: 他的灵
  alternative: 他的气息或他的风
  rationale: 上下文直接涉及说预言，故这里最可能指雅威赋予人预言能力的灵；译文不进一步界定其作用方式，以免超出原文。
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；以“主”代称
  rationale: 原文使用神的专名，音译“雅威”可直接保留这一点。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“人人都作先知”比“全体百姓都是先知”更自然地表达全体成员之意；连续两个“但愿”体现摩西强烈的愿望。脚注标记均置于相应正文之后。
