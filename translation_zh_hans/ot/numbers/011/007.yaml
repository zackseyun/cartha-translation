  yaml_path: translation/ot/numbers/011/007.yaml
  text: The manna was like coriander seed[a], and its appearance was like the appearance of bdellium.
translation:
  language: zh_hans
  text: 吗哪像芫荽籽，它的外观像比多拉[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “比多拉”所译的希伯来词具体指什么并不确定；通常认为是一种有香气的树胶或树脂，也有人认为是珍珠或水晶一类的物质。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמָּן
  choice: 吗哪
  rationale: 采用现代汉语圣经传统中通行的名称，指旷野中以色列人熟知的食物；汉语无需另译定冠词。
- source_word: כִּזְרַע גַּד
  choice: 像芫荽籽
  rationale: כִּ 表示相似；גַּד 通常认作芫荽。译作“芫荽籽”具体、自然，也保留原文的形状比较。
- source_word: וְעֵינוֹ
  choice: 外观
  rationale: עַיִן 本义为“眼睛”，此处是描述可见的样子；“外观”简洁自然。
- source_word: כְּעֵין
  choice: 像
  rationale: 原文再次使用 עַיִן 构成视觉比较。汉语若直译为“外观像……的外观”显得累赘，因此以“外观像……”自然表达，同时保留视觉层面的比较。
- source_word: הַבְּדֹלַח
  choice: 芳香树脂[a]
  rationale: בְּדֹלַח 通常对应 bdellium，一般理解为一种芳香树胶或树脂。正文采用普通读者较易理解的类别名称，并以脚注说明具体所指并不确定及其他可能解释。
