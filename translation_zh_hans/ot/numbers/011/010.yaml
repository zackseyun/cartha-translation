base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/010.yaml
  text: Moses heard the people weeping by their clans[a], each man at the entrance of his tent. And the anger of Yahweh burned greatly[b], and it was evil in the eyes of Moses.
translation:
  language: zh_hans
  text: 摩西听见百姓按各家族哭泣，各人都在自己帐篷门口。雅威就大大发怒；这在摩西眼中是恶的[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 直译“在摩西眼中是恶的”；也可译“这使摩西不悦”。原文没有明说“这”具体指什么。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: 听见
  rationale: 此处是感知百姓哭声，不是强调专心聆听；“听见”准确而自然。
- source_word: בֹּכֶה
  choice: 哭泣
  rationale: 分词描写持续进行的动作；“哭泣”保留哀诉的语气。
- source_word: לְמִשְׁפְּחֹתָיו
  choice: 按着各宗族
  rationale: מִשְׁפָּחָה可指家族或宗族群体；“按着各宗族”既表达分组分布，也符合旷野群体的社会结构。
- source_word: אִישׁ לְפֶתַח אָהֳלוֹ
  choice: 各人都在自己的帐棚门口
  rationale: אִישׁ在此作逐一分配用法；现代汉语用“各人”即可准确表达，不必强加只限男性的意思。
- source_word: וַיִּחַר אַף יְהוָה מְאֹד
  choice: 雅威的怒气就大大发作
  rationale: 保留“怒气发作”的希伯来语意象，并以“大大”表达מְאֹד的强烈程度。
- source_word: יְהוָה
  choice: 雅威
  rationale: 用现代汉语对神圣四字名YHWH的常见音译，保留其作为专名而非称号的性质。
- source_word: וּבְעֵינֵי מֹשֶׁה רָע
  choice: 摩西看这事为恶
  rationale: 贴近“在摩西眼中是恶的”这一表达，保留评价对象未被明确说明以及“恶／不好／不悦”的语义张力。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用神圣四字名；“雅威”较贴近通常重构的读音，并清楚表明这是专名。
- issue: “在摩西眼中为恶”所指为何
  choice: 摩西看这事为恶
  alternative: 这使摩西不悦
  rationale: 原文没有明确指出摩西认为“恶”的究竟是百姓哭泣、整体局面，还是雅威发怒；正文不把它缩减为单纯的情绪不悦。
- issue: 分配用法אִישׁ是否必须译成男性
  choice: 各人
  alternative: 各个男人
  rationale: 这里的阳性单数用于逐一指称帐棚中的百姓；“各人”保留分配意义，又不把语法性别误作上下文明示的性别限制。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“帐棚”保留传统而清楚的旷野生活用语；句末略带直译色彩，以保存原文的含混和神学张力。
