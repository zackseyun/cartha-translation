source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה הֲ/יַ֥ד יְהוָ֖ה תִּקְצָ֑ר עַתָּ֥ה תִרְאֶ֛ה הֲ/יִקְרְ/ךָ֥ דְבָרִ֖/י אִם לֹֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/023.yaml
  text: And Yahweh said to Moses[b][a], “Has Yahweh’s hand become short? Now you will see whether my word will happen for you or not.”
translation:
  language: zh_hans
  text: 雅威对摩西说：“雅威的手难道会缩短吗？[a]现在你就会看见，我的话是否会在你身上实现。[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “雅威的手难道会缩短吗？”是希伯来语习语，意思是“雅威的能力难道会变得有限吗？”。
    reason: cultural_note
  - marker: b
    text: “我的话是否会在你身上实现”也可译作“我所说的是否会临到你”。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: 雅威
  rationale: 采用神圣名字的常见现代汉语音译，不以“主”这一称号替代原文专名。
- source_word: הֲיַד יְהוָה תִּקְצָר
  choice: 雅威的手难道缩短了吗
  rationale: 保留原文以“手”表示能力的拟人化意象，并用“难道……吗”传达反问语气；不直接释为“能力有限”，以保存原文的修辞张力。
- source_word: עַתָּה תִרְאֶה
  choice: 现在你会看见
  rationale: 直接表达时间副词和未完成体在语境中的将来含义，指向即将得到的验证。
- source_word: הֲיִקְרְךָ דְבָרִי
  choice: 我的话会不会临到你
  rationale: “临到”兼顾 קרה 的“发生、遇到、临及”之义，并保留第二人称后缀；“我的话”对应单数 דְבָרִי，避免在正文中把它完全解释为“应验”。
- source_word: אִם לֹא
  choice: 会不会
  rationale: 以自然现代汉语表达“是否……或不”的选择疑问结构。
theological_decisions:
- issue: 用身体意象描述神的能力
  choice: 保留“雅威的手……缩短”
  alternative: “雅威的能力难道有限吗”
  rationale: 原文借“手”表达能力，保留这一意象可维持责问的力度，同时脚注说明其习语意义，避免读者作粗糙的实体化理解。
- issue: 神的话如何临到摩西
  choice: “我的话会不会临到你”
  alternative: “我所说的是否会为你实现”
  rationale: 原文 קרה 可指发生、临到或遇上；正文保留其较宽的语义范围，不把它无提示地限定为某一种系统性的“应验”概念。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“难道……吗”呈现原文反问；“临到”略带经文语体，但在现代汉语中仍易理解，并有助于保存原词的语义开放性。
