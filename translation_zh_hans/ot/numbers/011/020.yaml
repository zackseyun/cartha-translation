  to: 整整一个月，直到肉从你们的鼻孔里出来，成为你们所厌恶的[a]，因为你们厌弃了在你们中间的耶和华，又在他面前哭泣，说：‘我们为什么从埃及出来呢？’”
  rationale: 修订仅收回正文中超出原文的语义限定：“出来”不指定“冒”的方式；“成为你们所厌恶的”保留原文的系词结构和强烈厌恶而不窄化为恶心；末句以直接反问呈现百姓的悔恨式抱怨。其余译文忠实、自然，且“耶和华”作为中文专名可保留。
