id: NUM.11.20
reference: Numbers 11:20
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: עַ֣ד חֹ֣דֶשׁ יָמִ֗ים עַ֤ד אֲשֶׁר יֵצֵא֙ מֵֽ/אַפְּ/כֶ֔ם וְ/הָיָ֥ה לָ/כֶ֖ם לְ/זָרָ֑א יַ֗עַן כִּֽי מְאַסְתֶּ֤ם אֶת יְהוָה֙ אֲשֶׁ֣ר בְּ/קִרְבְּ/כֶ֔ם וַ/תִּבְכּ֤וּ לְ/פָנָי/ו֙ לֵ/אמֹ֔ר לָ֥/מָּה זֶּ֖ה יָצָ֥אנוּ מִ/מִּצְרָֽיִם׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/020.yaml
  text: for a whole month, until it comes out of your nostrils and becomes loathsome to you, because you have rejected Yahweh who is among you and have wept before him, saying, ‘Why did we ever come out of Egypt?’”
translation:
  language: zh_hans
  text: 整整一个月，直到肉从你们的鼻孔里出来，成为你们所厌恶的[a]，因为你们厌弃了在你们中间的耶和华，又在他面前哭泣，说：‘我们为什么从埃及出来呢？’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“成为你们所憎恶的东西。”此处希伯来语表达强烈的厌恶；也可包含令人反胃的意味。
    reason: 保留 לְזָרָא“成为……所厌恶的”的句法及其广泛的强烈反感语义，避免正文限定为生理恶心。
lexical_decisions:
- source_word: עַד חֹדֶשׁ יָמִים
  choice: 整整一个月
  rationale: 希伯来语字面为“直到一个月的日子”，指足足一个月；此译自然并保留时长的强调。
- source_word: יֵצֵא מֵאַפְּכֶם
  choice: 从你们的鼻孔里冒出来
  rationale: אַפּ 在此取具体的“鼻子／鼻孔”义；“鼻孔”保留原文夸张而鲜明的身体意象，“冒出来”符合肉从鼻孔出来的语境。
- source_word: וְהָיָה לָכֶם לְזָרָא
  choice: 令你们恶心
  rationale: זָרָא 表达强烈的厌恶或反胃感；“令你们恶心”是现代汉语中自然、有力的表达。
- source_word: יַעַן כִּי
  choice: 因为
  rationale: 该短语引出惩罚的原因，“因为”清楚、自然。
- source_word: מְאַסְתֶּם
  choice: 厌弃了
  rationale: מאס 可指拒绝、藐视或厌弃；“厌弃”既体现拒绝，也保留轻蔑和嫌恶的语气。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代简体中文读者熟悉的专名“耶和华”直接呈现四字神名，而不以头衔替代。
- source_word: אֲשֶׁר בְּקִרְבְּכֶם
  choice: 在你们中间的
  rationale: 所指是耶和华临在于群体之中；此译避免被理解为个体内在状态。
- source_word: וַתִּבְכּוּ לְפָנָיו
  choice: 又在他面前哭泣
  rationale: 保留 בכה 的哭泣含义和 לְפָנָיו 所表达的当面／在其临在中的关系场景。
- source_word: לָמָּה זֶּה
  choice: 为什么要……呢
  rationale: 该结构带有抱怨和反问色彩；汉语“为什么要……呢”自然传达这种语气而不额外加入时间强调。
- source_word: יָצָאנוּ מִמִּצְרָיִם
  choice: 从埃及出来
  rationale: 贴近 יצא 的“出来”意象，也延续出埃及叙事的惯用措辞。
theological_decisions:
- issue: 四字神名 יהוה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用神的专名。中文出版语境中“耶和华”辨识度高，且作为专名保留其功能；“雅威”则更接近现代学界常见的拟音。
- issue: מְאַסְתֶּם 的关系性力度
  choice: 厌弃了
  alternative: 拒绝了
  rationale: 原词不仅可表示拒绝，也可带藐视、嫌弃之意；上下文中百姓对出埃及的抱怨构成对耶和华的厌弃。“拒绝”较中性，力度稍弱。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“鼻孔里冒出来”刻意保留原文强烈而夸张的画面；引语用反问语气呈现百姓的抱怨。脚注标记已置于正文对应词语之后。
