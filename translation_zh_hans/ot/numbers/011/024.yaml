  terminology: “雅威”一致呈现四字神名；“长老”准确表达זקנים的社会／职分含义；“七十人”在汉语中是自然的集合数词表达，且其由长老群体中选出已在上下文明确。脚注对“使他们站立”及“帐篷”可能所指的说明均恰当。
