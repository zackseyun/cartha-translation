  source_fidelity: 正文准确对应希伯来文的叙事次序与主要语义：摩西出去、向百姓传讲雅威的话、从百姓的长老中召集七十人，并使他们站在帐篷周围。"从……长老中"恰当保留了מן的部分性；"让他们站"传达了עמד使役式的核心意思，且没有把“帐篷”直接扩充为“会幕”。
