language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יֵּצֵ֣א מֹשֶׁ֗ה וַ/יְדַבֵּר֙ אֶל הָ/עָ֔ם אֵ֖ת דִּבְרֵ֣י יְהוָ֑ה וַ/יֶּאֱסֹ֞ף שִׁבְעִ֥ים אִישׁ֙ מִ/זִּקְנֵ֣י הָ/עָ֔ם וַֽ/יַּעֲמֵ֥ד אֹתָ֖/ם סְבִיבֹ֥ת הָ/אֹֽהֶל־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/024.yaml
  text: So Moses went out and spoke to the people the words of Yahweh[b][a]. He gathered seventy men from the elders of the people and stationed them around the tent.
translation:
  language: zh_hans
  text: 摩西出去，把雅威的话告诉百姓。他从百姓的长老中召集了七十人，让他们站[a]在帐篷[b]周围。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“把他们安置在那里”。希伯来语动词的字面意思是“使他们站立”。
    reason: lexical_alternative
  - marker: b
    text: 原文作“帐篷”；按上下文，很可能指会幕。
    reason: cross_reference
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: 出去
  rationale: יצא在连续叙事中表示从先前所在之处出去；“出去”简洁自然，也保留了原文的移动意味。
- source_word: וַיְדַבֵּר אֶל־הָעָם אֵת דִּבְרֵי יְהוָה
  choice: 把雅威的话告诉百姓
  rationale: 原文直译为“向百姓说雅威的话”。现代汉语用“把……的话告诉……”更自然，同时保留“话”这一具体表达，不泛化为“信息”。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语中常见的音译呈现四字神名，保留其作为专名的性质，不以称号替代。
- source_word: וַיֶּאֱסֹף
  choice: 召集
  rationale: אסף可指聚集、集合；这里是摩西有意把所选的长老集合起来，“召集”符合领袖召聚人员的语境。
- source_word: שִׁבְעִים אִישׁ
  choice: 七十人
  rationale: 数词后的אִישׁ为集合性单数。汉语“七十人”自然准确；上下文“长老”已限定其身份，无须添加原文没有的性别词。
- source_word: מִזִּקְנֵי הָעָם
  choice: 从百姓的长老中
  rationale: 保留介词מִן的部分性含义，表明这七十人是从百姓的长老群体中选出的；“长老”也体现其公认的群体职分，而不只是年长者。
- source_word: וַיַּעֲמֵד אֹתָם
  choice: 让他们站
  rationale: עמד的使役式字面意为“使他们站立”。“让他们站”既体现使役含义，也符合现代汉语叙事表达。
- source_word: סְבִיבֹת הָאֹהֶל
  choice: 在帐篷周围
  rationale: סְבִיבֹת表示“周围”，הָאֹהֶל仅作“那/这帐篷”。正文不擅自补入原文未出现的“会幕”全称。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。译作“雅威”保留其专名性质，并避免以“主”这一称号取代神名；“耶和华”是另一传统音译。
- issue: שִׁבְעִים אִישׁ的性别表达
  choice: 七十人
  alternative: 七十个男人
  rationale: אִישׁ在数词后采用集合性用法，所指人员来自长老群体。现代汉语“七十人”并不否认其语法或历史语境中的男性所指，却比“七十个男人”更自然，也不把重点从其长老身份转向性别。
- issue: הָאֹהֶל是否明确译为“会幕”
  choice: 帐篷
  alternative: 会幕
  rationale: 上下文很可能指会幕，但本节希伯来文只写“帐篷”。正文保留原文措辞，并以脚注说明语境所指，从而避免把合理推断写成明示内容。
translation_notes:
  register: 采用现代、庄重而易懂的叙事体。“把雅威的话告诉百姓”避免生硬照搬希伯来语语序；“让他们站在……周围”保留使役含义。脚注标记紧随各自所说明的词语。
