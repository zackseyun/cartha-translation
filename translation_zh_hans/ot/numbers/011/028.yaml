base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/028.yaml
  text: Then Joshua son of Nun[a], Moses’ attendant from his youth, answered and said, “My lord Moses[b], restrain them!”
translation:
  language: zh_hans
  text: 嫩的儿子约书亚——摩西的侍从，从年轻时起就服侍摩西[a]——回答说：“我主摩西，请制止他们[b]！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“是摩西手下的年轻人之一”，也可能是“是摩西所拣选的人之一”。这里的希伯来语很简略，含义不完全确定。
    reason: lexical_alternative
  - marker: b
    text: 或译：“禁止他们。”这个希伯来语动词可指约束、拦阻或禁止。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן
  choice: 他回应说
  rationale: ענה在叙事中引出对前文的回应；“回应说”既表达承接关系，也符合现代汉语叙事习惯。
- source_word: יְהוֹשֻׁעַ בִּן נוּן
  choice: 嫩的儿子约书亚
  rationale: 采用现代中文圣经人名的通行译法，并保留希伯来语“某人的儿子”这一亲属结构。
- source_word: מְשָׁרֵת מֹשֶׁה
  choice: 侍候摩西
  rationale: משרת指在近旁服侍、协助的人；“侍候”自然地表达约书亚作为摩西助手的长期服侍，又不暗示奴隶身份。
- source_word: מִבְּחֻרָיו
  choice: 从年轻时
  rationale: 按马所拉元音可理解为表示人生的青年时期，与“侍候摩西”连读自然；但该紧凑形式也可能指摩西的年轻人或所拣选的人，因此以脚注保留歧义。
- source_word: אֲדֹנִי מֹשֶׁה
  choice: 我主摩西
  rationale: אֲדֹנִי在此是对人间上级的尊称；“我主”保留约书亚对摩西恭敬而恳切的语气，摩西之名也明确排除了对上帝的称呼。
- source_word: כְּלָאֵם
  choice: 请制止他们
  rationale: כלא可表示约束、拦阻或禁止；这里指不让伊利达和米达继续说预言。“制止”保留行为方式上的开放性，“请”则自然表达对上级所用的祈使语气。
theological_decisions:
- issue: 约书亚与摩西关系的时间或群体限定
  choice: 正文译作“从年轻时就侍候摩西”
  alternative: “是摩西手下的年轻人之一”或“是摩西所拣选的人之一”
  rationale: 希伯来语מִבְּחֻרָיו形式紧凑，既可按青年时期理解，也可能按群体成员理解。正文采用上下文中自然且有古译传统支持的时间解释，脚注明确保留其他可能，不据此建立特殊的职分或权威观。
- issue: 约书亚要求摩西采取的行动
  choice: 制止他们
  alternative: 禁止他们
  rationale: 经文没有说明摩西应以命令、拘禁或其他方式阻止二人，因此正文不把כלא的实施方式说得过于具体。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。将希伯来语较长的单句分为两句，使主语和引语清晰；保留“我主摩西”的恭敬称呼，并用脚注呈现两处真实的词义歧义。
