source:
  edition: WLC
  text: וַ/יֵּ֨רֶד יְהוָ֥ה בֶּ/עָנָן֮ וַ/יְדַבֵּ֣ר אֵלָי/ו֒ וַ/יָּ֗אצֶל מִן הָ/ר֨וּחַ֙ אֲשֶׁ֣ר עָלָ֔י/ו וַ/יִּתֵּ֕ן עַל שִׁבְעִ֥ים אִ֖ישׁ הַ/זְּקֵנִ֑ים וַ/יְהִ֗י כְּ/נ֤וֹחַ עֲלֵי/הֶם֙ הָ/ר֔וּחַ וַ/יִּֽתְנַבְּא֖וּ וְ/לֹ֥א יָסָֽפוּ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/025.yaml
  text: Then Yahweh came down in the cloud and spoke to him[a], and he took some of the Spirit that was on him and put it on the seventy elders. And when the Spirit rested on them, they prophesied, but they did not continue.
translation:
  language: zh_hans
  text: 耶和华在云中降临，对摩西说话；他从降在摩西身上的灵中分出一些，放在那七十位长老身上。灵停驻在他们身上时，他们就说预言，但此后不再说预言。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们说预言，没有停止。”这里的希伯来语表达很简短，历来有不止一种理解。
    reason: 保留 וְלֹא יָסָפוּ 的真实语义歧义及传统异读。
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代汉语圣经读者熟悉的神名音译“耶和华”，不以“主”这一称号替代原文专名。
- source_word: וַיֵּרֶד
  choice: 降临
  rationale: 既表达向下而来的动作，也以自然、庄重的现代汉语保留神显叙述的拟人性语言。
- source_word: בֶּעָנָן
  choice: 在云中
  rationale: 定冠词指向上下文中那象征耶和华临在的特定云彩；“在云中”自然地保留其明确性。
- source_word: וַיְדַבֵּר אֵלָיו
  choice: 对摩西说话
  rationale: 原文代词指向上下文中的摩西。中文明确说出所指对象，可避免连续多个“他”造成歧义。
- source_word: וַיָּאצֶל מִן הָרוּחַ אֲשֶׁר עָלָיו
  choice: 把降在摩西身上的灵分赐一些
  rationale: 罕见动词 אצל 在这里表示从已有之物取出或分出；“分赐一些”表达分配而不暗示灵本身因而减少。“降在……身上”依照本段反复出现的 על 意象。
- source_word: רוּחַ
  choice: 灵
  rationale: 上下文表明这是赐下先知性能力的神之灵。汉字本身没有英文大小写差异，因此不另加原文没有的限定语。
- source_word: וַיִּתֵּן עַל
  choice: 放在……身上
  rationale: 保留原文“给予在……之上”的空间意象，同时符合现代汉语表达。
- source_word: שִׁבְעִים אִישׁ הַזְּקֵנִים
  choice: 那七十位长老
  rationale: “七十人”和“长老”为同位关系；中文用“七十位长老”自然、准确，量词“位”也已表达其为人。
- source_word: כְּנוֹחַ עֲלֵיהֶם הָרוּחַ
  choice: 灵停驻在他们身上时
  rationale: נוח 表示安歇、停留；“停驻”保留动态临到后驻留的意象，并与 על 的“在……身上”对应。
- source_word: וַיִּתְנַבְּאוּ
  choice: 他们就说预言
  rationale: 此处指由灵引发的先知性言说；“说预言”比容易被理解为单纯预测未来的“预言”动词用法更清楚。
- source_word: וְלֹא יָסָפוּ
  choice: 但后来没有再说
  rationale: יסף 常有“再、继续”的意义；主文采用他们此后没有再次说预言这一语境性理解，同时以脚注保留“没有停止”的传统异读。
theological_decisions:
- issue: רוּחַ 指神的灵还是一般的灵
  choice: 译作“灵”，按上下文理解为神赐下、使人说预言的灵
  alternative: 理解为一般的“精神”或人的内在状态
  rationale: 这灵原在摩西身上，又被赐给长老，并直接带来先知性活动，因此所指显然超出人的一般心态；但正文不添加原文未明说的“圣”字。
- issue: וְלֹא יָסָפוּ 的含义
  choice: 他们后来没有再说预言
  alternative: 他们说预言而没有停止
  rationale: 该简短表达可由 יסף 的“再做、继续”义理解为此事没有重演，但古代及传统解释中也有“没有停止”的理解。正文采用较符合语境的一解，脚注明确保存另一解，不消除真实歧义。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。为避免代词所指不清，两次明确使用“摩西”。保留“云中”“在……身上”等原文意象；脚注标记置于相关争议分句之后。
