base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/016.yaml
  text: Then Yahweh said to Moses[a], “Gather for me seventy men from the elders of Israel, whom you know to be the elders of the people and its officers, and bring them to the tent of meeting[b], and let them stand there with you.”
translation:
  language: zh_hans
  text: 雅威对摩西说：“你要为我从以色列的长老中召集七十名男子[a]，就是你所知道的百姓的长老和官员[b]。把他们带到会幕，让他们和你一同站在那里。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “召集”也可译作“聚集”。
    reason: lexical_alternative
  - marker: b
    text: “官员”也可译作“办事人员”；希伯来语这个词指在长老之下承担行政职责的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文四字神名的常见拟音译出其专名，不以“主”这一称号代替。
- source_word: אֶסְפָה לִּי
  choice: 为我召集
  rationale: אָסַף在此表示把人召聚起来；“为我”保留לִּי的受益或归属意味。
- source_word: שִׁבְעִים אִישׁ
  choice: 七十个人
  rationale: אִישׁ在数词后作分配性单数；上下文明确这些人是以色列长老。“个人”在现代汉语中自然，又不削弱其具体人数。
- source_word: מִזִּקְנֵי יִשְׂרָאֵל
  choice: 从以色列的长老中
  rationale: 介词מִן表示从较大群体中选取，译文保留这一选择关系。
- source_word: אֲשֶׁר יָדַעְתָּ כִּי הֵם
  choice: 就是你所知道的
  rationale: 自然表达摩西已知道并认可这些人的身份，同时保留定语从句与后文身份说明的关系。
- source_word: זִקְנֵי הָעָם וְשֹׁטְרָיו
  choice: 百姓长老和官员
  rationale: “长老”指公认的群体领袖；שֹׁטֵר在此指承担治理、行政职责的人，译作“官员”较切合语境。
- source_word: וְלָקַחְתָּ אֹתָם אֶל
  choice: 把他们带到
  rationale: לקח本可直译“取、带”，但朝指定地点移动时，现代汉语用“带到”最自然。
- source_word: אֹהֶל מוֹעֵד
  choice: 会幕
  rationale: 这是אֹהֶל מוֹעֵד在中文圣经语境中的简洁惯用称呼，字面为“相会之帐幕”。
- source_word: וְהִתְיַצְּבוּ שָׁם עִמָּךְ
  choice: 让他们和你一同站在那里
  rationale: התיצב表示站定、列于某处或到场侍立；此处保留其指令语气及“与你同在”的空间关系。
theological_decisions:
- issue: 四字神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用以色列上帝的专名；译作“雅威”旨在以现代常见拟音保留专名，而不以“主”代替。希伯来文未保存无争议的完整古代读音，因此“耶和华”仍是中文传统中的另一译法。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“你要”表达希伯来语命令意味；将两个脚注标记分别置于其实际说明的词语之后，避免与英文咨询层中错置的标记位置相混。
