source:
  edition: WLC
  text: וַ/יִּצְעַ֥ק הָ/עָ֖ם אֶל מֹשֶׁ֑ה וַ/יִּתְפַּלֵּ֤ל מֹשֶׁה֙ אֶל יְהוָ֔ה וַ/תִּשְׁקַ֖ע הָ/אֵֽשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/002.yaml
  text: Then the people cried out to Moses[a], and Moses prayed to Yahweh, and the fire died down.
translation:
  language: zh_hans
  text: 于是，百姓向摩西呼求。摩西向雅威祷告，火就平息了[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “平息”也可译作“沉下去”或“消退”。希伯来语动词含有下沉、逐渐止息的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּצְעַק
  choice: 呼求
  rationale: צעק常指人在危难中发出求助的呼声；“呼求”既体现急迫求助，也自然承接“向摩西”。
- source_word: הָעָם
  choice: 百姓
  rationale: 在本叙事中指以色列群体；“百姓”是现代中文圣经叙事中自然、庄重的集体称呼。
- source_word: אֶל מֹשֶׁה
  choice: 向摩西
  rationale: 介词אֶל表示动作所指向的对象；“向摩西呼求”准确而通顺。
- source_word: וַיִּתְפַּלֵּל
  choice: 祷告
  rationale: פלל的Hitpael词形通常表示祷告。上下文虽带有代求意味，但正文采用直接词义，不额外明说“代求”。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按原文直接音译四字神名，保留其作为以色列之神专名的性质，而不以称号替代。
- source_word: וַתִּשְׁקַע
  choice: 平息了
  rationale: שקע本有下沉、消退之意；以火为主语时，“平息了”是自然的现代中文，也保留火势消退而未必强调瞬间熄灭的含义。
- source_word: הָאֵשׁ
  choice: 火
  rationale: אֵשׁ直译为“火”，此处承接上文降下的火。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文使用四字神名；“雅威”较直接反映学界通常采用的读音重构，并保留专名性质。
- issue: 摩西祷告是否明译为代求
  choice: 祷告
  alternative: 代求
  rationale: 本节语境显示摩西是在为百姓求情，但动词本身直接表示“祷告”；采用“祷告”可避免把语境推论写入正文。
translation_notes:
  register: 采用简洁、庄重而易懂的现代标准汉语。“于是”衔接上文危机，“就”体现摩西祷告后火势随即平息的叙事关系；不把上下文隐含的“代求”直接加入正文。
