base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/001.yaml
  text: 'Then the daughters of Zelophehad son of Hepher[a], son of Gilead, son of Machir, son of Manasseh, from the clans of Manasseh son of Joseph, came near. And these were the names of his daughters: Mahlah, Noah, Hoglah, Milcah[b], and Tirzah.'
translation:
  language: zh_hans
  text: 于是，西罗非哈的女儿们前来[a]。西罗非哈是希弗的儿子，希弗是基列的儿子，基列是玛吉的儿子，玛吉是玛拿西的儿子；她们属于约瑟之子玛拿西的宗族。西罗非哈的女儿名叫玛拉、挪阿[b]、曷拉、密迦和得撒。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “前来”也可译作“走近”或“上前”。这个措辞可能表示她们上前正式陈情，正如下文所叙述的。
    reason: lexical_alternative
  - marker: b
    text: 这里的“挪阿”是西罗非哈一个女儿的名字，不要与《创世记》中的男性“挪亚”混淆。
    reason: cultural_note
lexical_decisions:
- source_word: וַתִּקְרַבְנָה
  choice: 走上前来
  rationale: 该词是קרב的Qal叙事形式、第三人称阴性复数，表示这些女子来到权威人物面前。“走上前来”既保留实际趋近之意，也自然预示下文正式陈情的场景，却不在本节擅自补出她们走近谁。
- source_word: בְּנוֹת
  choice: 女儿们
  rationale: 这里是带人名的构造形式，指西罗非哈的亲生女儿；下文逐一列名也印证这一点。
- source_word: בֶּן ... בֶּן ... בֶּן ... בֶּן
  choice: 是……的儿子
  rationale: 逐层保留原文谱系，没有压缩成“后裔”，因为这条明确的父系脉络与随后提出的产业继承诉求密切相关。
- source_word: לְמִשְׁפְּחֹת
  choice: 属于……的宗族
  rationale: מִשְׁפָּחָה在支派谱系语境中指宗族；前缀ל־在这里表示归属。“属于……的宗族”符合现代汉语，也保留其社会和支派含义。
- source_word: מְנַשֶּׁה בֶן יוֹסֵף
  choice: 约瑟之子玛拿西
  rationale: 明确保留玛拿西与约瑟的父子关系，使整条支派谱系完整呈现。
- source_word: וְאֵלֶּה שְׁמוֹת בְּנֹתָיו
  choice: 西罗非哈的女儿名叫
  rationale: 原文直译为“这些是他女儿们的名字”。中文用“名叫”自然引出名单，并将代词所指明说为西罗非哈，避免长串谱系之后产生歧义。
- source_word: מַחְלָה נֹעָה וְחָגְלָה וּמִלְכָּה וְתִרְצָה
  choice: 玛拉、挪阿、曷拉、密迦和得撒
  rationale: 采用现代中文圣经人名的通行音译，并保留五人的列名次序。
