base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/017.yaml
  text: who will go out before them and come in before them[a], and who will lead them out and bring them in[c][b], so that the congregation of Yahweh may not be like sheep that have no shepherd.
translation:
  language: zh_hans
  text: 他要在他们前面出去，也要在他们前面进来[a]；他要领他们出去，也带他们进来[b]，使雅威的会众[c]不至于像没有牧人的羊群。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在他们前面”也可译作“走在他们前头”；两处相同。
    reason: lexical_alternative
  - marker: b
    text: “出去……进来……领他们出去……带他们进来”是希伯来语描述全面承担公共领导职责的一种说法。
    reason: cultural_note
  - marker: c
    text: “雅威的会众”也可译作“雅威的群体”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר יֵצֵא לִפְנֵיהֶם וַאֲשֶׁר יָבֹא לִפְנֵיהֶם
  choice: 他要在他们前面出去，也在他们前面进来
  rationale: 两个关系分句共同描述所求领袖；保留“出去—进来”的对应结构，并将 לִפְנֵיהֶם 译为“在他们前面”，呈现领袖走在民众前头的具体形象。
- source_word: וַאֲשֶׁר יוֹצִיאֵם וַאֲשֶׁר יְבִיאֵם
  choice: 他要领他们出去，也带他们进来
  rationale: 两个使役形分别表示使百姓出去和进来；“领……出去／带……进来”既保留使役意义，也符合牧者带领群体的语境。
- source_word: עֲדַת יְהוָה
  choice: 雅威的会众
  rationale: עֵדָה 指聚集成群体的以色列民，译作“会众”简洁而保留其群体性；יְהוָה 以专名“雅威”呈现。
- source_word: כַּצֹּאן אֲשֶׁר אֵין לָהֶם רֹעֶה
  choice: 像没有牧人的羊群
  rationale: צֹאן 是集合名词，汉语用“羊群”自然；רֹעֶה 译作“牧人”，直接保留本节的牧养与领导比喻。
- source_word: וְלֹא תִהְיֶה
  choice: 这样……就不至于
  rationale: 这里表达摩西请求设立领袖的目的或结果；“不至于”自然传达否定性的预期，同时不把语气强化为绝对断言。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名；“雅威”按其专名性质音译，避免以称号“主”取代。
- issue: “出去—进来—领出去—带进来”的含义
  choice: 保留具体的出入与带领语言
  alternative: 概括译为“治理他们”或“在一切事上引导他们”
  rationale: 这组行动语可概括全面的公共领导，但原文刻意使用具体、重复的动作，并以“没有牧人的羊群”收束；保留其形式可维持领导意涵和牧养意象，而不将其抽象化。
- issue: לִפְנֵיהֶם 的领导意涵
  choice: 在他们前面
  alternative: 当着他们；走在他们前头
  rationale: 该短语既可表示在众人面前，也可在此语境中表示走在他们前头。正文采用较贴近形式且能容纳两层意味的译法，并在脚注提示另一自然表达。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“出去／进来”有意保留原文的重复和对称；“牧人—羊群”的比喻不作抽象化处理。所有脚注标记均置于对应正文之后。
