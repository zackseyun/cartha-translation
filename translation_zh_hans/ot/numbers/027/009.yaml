base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/009.yaml
  text: And if he has no daughter, then you shall give his inheritance to his brothers.
translation:
  language: zh_hans
  text: 他若没有女儿，你们就要把他的产业给他的弟兄。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/אִם
  choice: 若
  rationale: 在连续的继承法规中引出下一种条件情形；现代汉语法律表述用“若”自然承接上下文，无须生硬译出连接词。
- source_word: אֵין ל֖/וֹ
  choice: 没有
  rationale: 希伯来语存在句加介词短语在此表示领有关系，汉语自然译作“没有”。
- source_word: בַּת
  choice: 女儿
  rationale: 保留希伯来语阴性单数名词的明确含义；“没有女儿”在汉语中可自然涵盖没有任何女儿的情形。
- source_word: וּ/נְתַתֶּם
  choice: 你们就要把……给
  rationale: “就”标明条件句的结果，“要”表达第二人称复数法律指令的约束力，同时保持现代汉语的自然表达。
- source_word: נַחֲלָת֖/וֹ
  choice: 他的产业
  rationale: נַחֲלָה在本段指依法承受并传递的家族地产或份业；“产业”既能体现实体地产，也适合本段继承法规的语境。
- source_word: לְ/אֶחָי/ו
  choice: 给他的弟兄
  rationale: 原文为阳性复数，明确指该男子的兄弟；“弟兄”保留性别和亲属关系，并与庄重的经文语体相称。
