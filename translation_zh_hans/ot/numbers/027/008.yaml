  text: וְ/אֶל בְּנֵ֥י יִשְׂרָאֵ֖ל תְּדַבֵּ֣ר לֵ/אמֹ֑ר אִ֣ישׁ כִּֽי יָמ֗וּת וּ/בֵן֙ אֵ֣ין ל֔/וֹ וְ/הַֽעֲבַרְתֶּ֥ם אֶת נַחֲלָת֖/וֹ לְ/בִתּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/008.yaml
  text: And you shall speak to the sons of Israel[a], saying, ‘If a man dies and has no son, then you shall transfer his inheritance to his daughter.’
translation:
  language: zh_hans
  text: 你要对以色列人[a]说：‘若有男子死了，没有儿子，你们就要把他的产业转给他的女儿。’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “以色列人”直译为“以色列的众子”，也可译作“以色列的子孙”。
    reason: 说明固定族群称谓的字面形式及可行译法。
lexical_decisions:
- source_word: וְאֶל בְּנֵי יִשְׂרָאֵל
  choice: 你要对以色列人说
  rationale: בְּנֵי יִשְׂרָאֵל 字面为“以色列的众子”，在这里是对整个以色列共同体的固定称呼；正文采用现代汉语自然、准确的“以色列人”，脚注保留其字面形式。
- source_word: תְּדַבֵּר לֵאמֹר
  choice: 说
  rationale: 这是希伯来语常见的引语引入公式。汉语用“说”并接冒号即可自然传达其功能，不机械重复为“讲话说”。
- source_word: אִישׁ כִּי יָמוּת
  choice: 如果一个男人死了
  rationale: אִישׁ 是阳性单数法律主体，且本条涉及儿子与女儿的继承次序；译作“一个男人”保留原文明确的性别表达。כִּי 在判例法中引入假设情形，译作“如果”。
- source_word: וּבֵן אֵין לוֹ
  choice: 没有儿子
  rationale: 自然表达字面的“他没有儿子”，并保留 בֵּן 所指男性后嗣的限定。
- source_word: וְהַעֲבַרְתֶּם
  choice: 你们就要把……转给
  rationale: עבר 的使役式在此表示依法使产业转归另一继承人；“转给”既体现法律上的转移，也符合现代汉语。主语由单数“你”转为复数“你们”，照原文形式保留摩西受命宣告与群体执行规定之间的变化。
- source_word: נַחֲלָתוֹ
  choice: 他的产业
  rationale: נַחֲלָה 在本段指可世代承受的家族产业，主要涉及土地及其继承权。“产业”比单纯的“遗产”更能体现民数记土地继承语境，同时不把范围不必要地限于一般动产。
- source_word: לְבִתּוֹ
  choice: 给他的女儿
  rationale: לְ 标示转移的接受者；“给他的女儿”是自然直接的汉语表达。
theological_decisions:
- issue: 产业转归女儿的法律条件
  choice: 明确保留“没有儿子”这一条件及“他的女儿”这一继承人
  alternative: 泛化为“没有孩子便转给后代”
  rationale: 原文规定的是特定继承次序，不应以概括性或现代化语言消除儿子与女儿的区别。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。以“你要……说”简洁呈现神对摩西的命令和引语公式；正文保留法律条文清晰的条件—结果结构，并保留原文单复数主语的转换。
