  text: וְ/לִ/פְנֵ֨י אֶלְעָזָ֤ר הַ/כֹּהֵן֙ יַעֲמֹ֔ד וְ/שָׁ֥אַל ל֛/וֹ בְּ/מִשְׁפַּ֥ט הָ/אוּרִ֖ים לִ/פְנֵ֣י יְהוָ֑ה עַל פִּ֨י/ו יֵצְא֜וּ וְ/עַל פִּ֣י/ו יָבֹ֗אוּ ה֛וּא וְ/כָל בְּנֵי יִשְׂרָאֵ֥ל אִתּ֖/וֹ וְ/כָל הָ/עֵדָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/021.yaml
  text: And he shall stand before Eleazar the priest[a], who shall inquire for him by the judgment of the Urim before Yahweh. At his command they shall go out, and at his command they shall come in—he and all the sons of Israel with him[b], even all the congregation.
translation:
  language: zh_hans
  text: 他要站在祭司以利亚撒面前；以利亚撒要在耶和华面前，按乌陵的裁决为他求问。[a]他们要按他的吩咐出去，也要按他的吩咐进来——他和随同他的所有以色列人，就是全会众。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“借乌陵的判定为他求问。”这是指祭司在耶和华面前借乌陵求得裁决。
    reason: lexical_alternative
  - marker: b
    text: “以色列人”原文直译为“以色列的众子”，这里指以色列全体民众。
    reason: lexical_alternative
lexical_decisions:
- source_word: לִפְנֵי אֶלְעָזָר הַכֹּהֵן יַעֲמֹד
  choice: 他要站在祭司以利亚撒面前
  rationale: 保留“站在……面前”的关系性表达，并以“要”体现委任语境中的指令意味。
- source_word: וְשָׁאַל לוֹ
  choice: 以利亚撒要……为他求问
  rationale: 上下文表明主语转为以利亚撒，他代表约书亚求问；明示姓名可避免现代汉语中的代词混淆。
- source_word: בְּמִשְׁפַּט הָאוּרִים
  choice: 用乌陵的裁决
  rationale: מִשְׁפָּט在此指借乌陵所得的判定或裁决；“乌陵”保留祭司求问所用专门术语的音译。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经语境中对四字神名的通行专名译法，而不以一般称号替代。
- source_word: עַל פִּיו
  choice: 按他的吩咐
  rationale: 该习语字面为“按他的口”，表示依据权威指令；保留单数代词，不在正文中过度确定其直接所指。
- source_word: יֵצְאוּ וְיָבֹאוּ
  choice: 出去……进来
  rationale: 保留希伯来语成对表达，可涵盖群体在领袖带领下的行动，尤其是公共或军事行动。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 此处是指以色列群体的惯用族称；现代汉语用“以色列人”自然准确，也避免将语法阳性误解为仅指男性。
- source_word: הָעֵדָה
  choice: 全会众
  rationale: “会众”体现五经中盟约群体的集体含义；“全”对应 כָּל。
theological_decisions:
- issue: “按他的吩咐”中代词的指向
  choice: 正文保留单数“他的”，不明确补成“以利亚撒的”或“约书亚的”
  alternative: 明确解释为以利亚撒传达的指令，或约书亚作为领袖所下的命令
  rationale: 希伯来文的紧缩结构使直接先行词并不完全明朗；命令最终源自耶和华面前借乌陵所得的裁决，并经祭司传达。保留代词可维持原文的含混和权威传递关系。
translation_notes:
  register: 采用庄重而清晰的现代标准普通话。“求问”“裁决”“会众”保留祭司礼仪和盟约群体语境；调整语序，把“在耶和华面前”紧接求问行为，以免误读为约书亚站在耶和华面前。所有脚注标记均已置入正文。
