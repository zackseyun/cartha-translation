  source_fidelity: 译文准确呈现了约书亚站在祭司以利亚撒面前、以利亚撒在耶和华面前为他借乌陵求问，以及全会众按权威命令出入的基本结构。惟“所有与他同去的以色列人”将 אִתּוֹ（“与他／随同他”）具体化为“同去”，与后面的“出去”重复，并略窄化了原文的伴随关系。另将 בְּמִשְׁפַּט 更贴切地译为“按……裁决”。
  naturalness: 整体庄重、清楚，符合现代标准普通话的经文语体。“随同他的所有以色列人”比“所有与他同去的以色列人”更自然，也避免预先指定行动方向。
  terminology: “祭司以利亚撒”“耶和华”“乌陵”“求问”“会众”均恰当且前后一致。“按乌陵的裁决”较好保留 מִשְׁפָּט 的司法性决定含义，而不把“乌陵”单纯表述为工具。
