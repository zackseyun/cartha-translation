  rationale: 将“同去”改为“随同”，以保留原文未指定方向的伴随关系；将“用乌陵的裁决”改为“按乌陵的裁决”，以更准确表达按乌陵所得裁决进行求问。其余译文保留原有的代词含混：两次“他的吩咐”不在正文中判定其直接先行词。
