  text: וְ/אִם אֵ֥ין ל֖/וֹ אַחִ֑ים וּ/נְתַתֶּ֥ם אֶת נַחֲלָת֖/וֹ לַ/אֲחֵ֥י אָבִֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/010.yaml
  text: But if he has no brothers[a], then you shall give his inheritance to his father's brothers.
translation:
  language: zh_hans
  text: 如果他没有兄弟，就要把他的产业给他父亲的兄弟[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“给他的叔伯”。
    reason: 词汇替代：这是更符合汉语亲属称谓习惯的表达，但正文保留原文“父亲的兄弟”这一结构。
lexical_decisions:
- source_word: וְאִם
  choice: 如果
  rationale: 在连续列举的继承法规中引出下一种条件情形；现代汉语用“如果”即可自然表达其承接和条件作用，无须生硬译出连接词。
- source_word: אֵין לוֹ
  choice: 他没有
  rationale: 希伯来语以存在否定词配合介词及代词后缀表达领有关系，汉语自然译为“他没有”。
- source_word: אַחִים
  choice: 兄弟
  rationale: 该阳性复数在此继承法语境中指男性同胞；“兄弟”既准确又符合现代汉语表达。
- source_word: וּנְתַתֶּם
  choice: 就要把……给
  rationale: 第二人称复数形式延续对共同体或执行者的法律指令；“就要”自然呈现条件成立后的规定性结果。
- source_word: נַחֲלָתוֹ
  choice: 他的产业
  rationale: נַחֲלָה在此指可依法承继的家产或地产。“产业”适合本段法律语境，也保留其作为继承份额的含义。
- source_word: לַאֲחֵי אָבִיו
  choice: 给他父亲的兄弟
  rationale: 按构词关系直译为“他父亲的兄弟”，清楚保留原文的亲属结构；“叔伯”更简洁，但会把原文未逐项明说的汉语亲属分类带入正文。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的法律叙述语体。“如果……就要……”明确呈现条件法规的结构；避免使用过于古雅的“若”“必将”，也不额外解释继承制度。
