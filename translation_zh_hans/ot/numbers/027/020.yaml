  text: וְ/נָתַתָּ֥ה מֵ/הֽוֹדְ/ךָ֖ עָלָ֑י/ו לְמַ֣עַן יִשְׁמְע֔וּ כָּל עֲדַ֖ת בְּנֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/020.yaml
  text: And you shall put some of your splendor on him[c][b][a], so that all the congregation of the sons of Israel may obey.
translation:
  language: zh_hans
  text: 你要把你的一部分尊荣加在他身上[a]，好让以色列人的全体会众[c]都听从[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “尊荣”也可译作“威荣”“光彩”或“荣耀”；这里也包含职分所带的威望。原文表示从摩西的尊荣中分出一部分。
    reason: lexical_alternative
  - marker: b
    text: “听从”也可译作“听”或“留心听”。原文动词常兼有听见和顺服的意思。
    reason: lexical_alternative
  - marker: c
    text: 原文直译为“以色列的众子”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתָּה
  choice: 你要把……加在
  rationale: נתן本义为“给”，与עַל连用时可表达把某物加在某人身上；此译保留授予与加在身上的意象，同时符合现代汉语。
- source_word: מֵהוֹדְךָ
  choice: 你的一部分尊荣
  rationale: הוֹד可指威荣、尊荣或光彩，也可包含职分所带的威望；מִן在这里表示从摩西所有的尊荣中分出一部分。“一部分尊荣”既保留词义范围，也不把它单一化为抽象的“权柄”。
- source_word: עָלָיו
  choice: 在他身上
  rationale: 直接体现עַל加第三人称单数阳性后缀的空间及授予意象。
- source_word: לְמַעַן
  choice: 好让
  rationale: 自然、清楚地表达目的关系。
- source_word: יִשְׁמְעוּ
  choice: 听从
  rationale: שׁמע兼有听、留心听和服从之意；在约书亚受委任的语境中，“听从”保留“听”的词面联系，也表达顺服领袖的实际含义。
- source_word: כָּל עֲדַת
  choice: 全会众
  rationale: עֵדָה指作为整体的以色列共同体或聚集的会众；“全会众”简洁且符合本段语境。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 这是现代汉语对该族群名称自然且准确的表达；脚注保留原文的亲属称谓形式。
theological_decisions:
- issue: 摩西加在约书亚身上的הוֹד究竟侧重什么
  choice: 译作“一部分尊荣”，保留威荣、尊荣及职分威望的语义张力。
  alternative: 译作“一部分权柄”或“一部分威荣”。
  rationale: 上下文确实涉及公开委任和领导权，但הוֹד本身并非通常表示“权柄”的专门词。正文采用较贴近原词且在汉语中自然的“尊荣”，避免把上下文功能直接替代词义；脚注说明其可包含职分所带的威望。
- issue: יִשְׁמְעוּ在目的从句中的语气
  choice: 译作“听从”，兼顾聆听与顺服。
  alternative: 译作“听见”“听”或“服从”。
  rationale: שׁמע的语义可从听见延伸至听从、顺服。委任领袖的语境支持顺服义，但“听从”比单独的“服从”更能保留希伯来词固有的听觉成分。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“把……加在他身上”保留授职时由摩西向约书亚授予尊荣的具体意象；“好让”自然表达目的。“以色列人全会众”面向普通读者，亲属式原文则在脚注中交代。
