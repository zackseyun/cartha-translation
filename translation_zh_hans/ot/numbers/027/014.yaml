source:
  edition: WLC
  text: כַּ/אֲשֶׁר֩ מְרִיתֶ֨ם פִּ֜/י בְּ/מִדְבַּר צִ֗ן בִּ/מְרִיבַת֙ הָֽ/עֵדָ֔ה לְ/הַקְדִּישֵׁ֥/נִי בַ/מַּ֖יִם לְ/עֵינֵי/הֶ֑ם הֵ֛ם מֵֽי מְרִיבַ֥ת קָדֵ֖שׁ מִדְבַּר צִֽן־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/014.yaml
  text: because you rebelled against my command in the wilderness of Zin[a], in the strife of the congregation, by not treating me as holy at the waters before their eyes[b]. These are the waters of Meribath-kadesh in the wilderness of Zin.
translation:
  language: zh_hans
  text: 因为你们在寻旷野、会众争闹时，违背了我的命令，没有在水边、在他们眼前显明我是圣的[a]。这就是寻旷野加低斯的米利巴水[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“在水边、在他们眼前使我显为圣”或“尊我为圣”。不定词本身是肯定形式，但上下文表明摩西和亚伦没有这样做。
    reason: lexical_alternative
  - marker: b
    text: “加低斯的米利巴”也可译作“米利巴·加低斯”，较直译为“加低斯的争闹”。“米利巴”意为“争闹”。
    reason: alternative_reading
lexical_decisions:
- source_word: כַּאֲשֶׁר
  choice: 因为
  rationale: 此处承接上一节，说明摩西和亚伦不能进入应许之地的原因；按语境取因果义比直译为“正如”更清楚。
- source_word: מְרִיתֶם פִּי
  choice: 你们违背了我的命令
  rationale: מְרִיתֶם 表示反抗、悖逆；פִּי 字面为“我的口”，在这里转指神口中所出的命令。合译自然，并保留对神权威的抗拒之意。
- source_word: בְּמִדְבַּר צִן
  choice: 在寻旷野
  rationale: מִדְבָּר 译为“旷野”，符合经文地理语境；צִן 按惯用中文圣经地名音译为“寻”。
- source_word: בִּמְרִיבַת הָעֵדָה
  choice: 会众争闹的时候
  rationale: מְרִיבָה 指争执、争闹；עֵדָה 指作为整体的会众。此处用时间情境表达，中文流畅，也不把该短语误解为地点名称。
- source_word: לְהַקְדִּישֵׁנִי
  choice: 没有……彰显我的圣洁
  rationale: 该使役式不定词本身为肯定形式，意为“使我显为圣”或“尊我为圣”；结合 מְרִיתֶם 及民数记20章的事件，语境所指是摩西和亚伦未能如此，因此在正文补出隐含的否定，并以脚注保存原文形式。
- source_word: בַמַּיִם לְעֵינֵיהֶם
  choice: 在水那里、在他们眼前
  rationale: 既保留事件发生于水边的情境，也保留 לְעֵינֵיהֶם 所强调的公开可见性。
- source_word: מֵי מְרִיבַת קָדֵשׁ
  choice: 加低斯的米利巴水
  rationale: 将名称理解为与加低斯相关的“米利巴水”；“米利巴”沿用常见音译，同时脚注说明其字义及另一种名称表达。
theological_decisions:
- issue: לְהַקְדִּישֵׁנִי 所表达的失败
  choice: 正文译为“没有……彰显我的圣洁”
  alternative: 按形式直译为“使我显为圣”或“尊我为圣”
  rationale: 希伯来语不定词在形式上没有否定词，但上下文明确把这件事作为二人违命之处。正文补明语境中的否定以便理解，脚注则保留其正面语法形式和译法可能，避免掩盖原文张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“会众”保留以色列共同体语感；“彰显我的圣洁”比生硬的“使我成圣”更准确地表达神在人前被显明为圣的含义。正文脚注标记[a]、[b]均已对应出现。
