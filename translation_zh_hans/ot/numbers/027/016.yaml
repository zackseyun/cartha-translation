base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/016.yaml
  text: May Yahweh[a], the God of the spirits of all flesh, appoint a man over the congregation[c][b],
translation:
  language: zh_hans
  text: 愿雅威[a]，凡有血肉之人的灵的上帝，委任一位男子管理会众。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “雅威”是希伯来语神名 יהוה 的常用音译；传统中文译本多译作“耶和华”。
    reason: lexical_alternative
  - marker: b
    text: “凡有血肉之人”直译为“所有血肉”，是指全人类、强调人作为受造而必死者的希伯来语习语。“会众”也可译为“会集”或“集会”。
    reason: textual_and_cultural_note
lexical_decisions:
- source_word: יִפְקֹד
  choice: 委派
  rationale: פקד 在此以“人”为宾语，并接“治理会众”的语境，表示指定某人担任职分；“委派”在现代汉语中清楚自然。
- source_word: יְהוָה
  choice: 雅威
  rationale: 直接音译四字神名，保留以色列上帝的专名，而不以称号替代。
- source_word: אֱלֹהֵי הָרוּחֹת לְכָל בָּשָׂר
  choice: 赐众生气息的上帝
  rationale: רוּחוֹת 可指灵或气息；结合 כָּל־בָּשָׂר 所表达的受造、必死生命，这里译作“赐众生气息”自然传达上帝掌管一切生命之气，同时以脚注保留“众生之灵的上帝”这一较形式对应的理解。
- source_word: אִישׁ
  choice: 一个人
  rationale: 保留希伯来文阳性单数所指的个别男性继任者；现代汉语“一个人”在此自然，且未将单数个体泛化。
- source_word: עַל הָעֵדָה
  choice: 治理会众
  rationale: עַל 表示居于其上、负领导责任；עֵדָה 指以色列立约群体。“治理会众”比生硬的“在会众之上”更符合汉语，同时保留领导含义。
theological_decisions:
- issue: 祈愿句中神名及神圣称号的表达
  choice: 愿雅威……委派
  alternative: 愿耶和华……任命；求主……委派
  rationale: יִפְקֹד 在本句可作祈愿语气；译作“愿”保留摩西向上帝所发请求的性质。神名 יְהוָה 直接译为“雅威”，不以“主”这一称号替代。
- issue: אֱלֹהֵי הָרוּחֹת לְכָל בָּשָׂר 的关系
  choice: 赐众生气息的上帝
  alternative: 众生之灵的上帝
  rationale: 希伯来语可较形式地理解为“所有血肉之灵的上帝”，也可强调上帝是众生命气息的主宰。正文采用自然汉语表达，脚注明示较直译读法，以免消除原文张力。
- issue: אִישׁ 的性别和个体性
  choice: 一个人
  alternative: 一位男子；某人
  rationale: 上下文所求的是接替摩西的单一领导者，原词为阳性单数。中文“一个人”既保持个体性，也不额外强化原文没有明说的性别措辞。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“愿……委派”保留祈愿语气；避免生硬照搬“所有血肉之灵的上帝”，但以脚注保留其形式和语义可能性。所有脚注标记均已置于正文。
