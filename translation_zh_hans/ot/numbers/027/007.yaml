base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/007.yaml
  text: The daughters of Zelophehad are right[a]. You must surely give them a hereditary possession among their father's brothers[b], and you shall transfer their father's inheritance to them.
translation:
  language: zh_hans
  text: “西罗非哈的女儿们说得对[a]。你一定要在她们父亲的兄弟中间，把一份可继承的产业赐给她们[b]；你要把她们父亲的产业转给她们。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“西罗非哈的女儿们说得正确”。这里是在肯定她们所提出的继承主张。
    reason: lexical_alternative
  - marker: b
    text: 此处希伯来文本有一次使用阳性复数后缀“给他们”，但上下文明指西罗非哈的女儿们，因此正文按所指对象译为“给她们”。
    reason: textual_variant
lexical_decisions:
- source_word: כֵּן ... דֹּבְרֹת
  choice: 说得对
  rationale: 该短语直译为“说得正确”，在司法裁决语境中是肯定她们的主张；“说得对”自然清楚，同时保留“说”的表达。
- source_word: נָתֹן תִּתֵּן
  choice: 一定要……给
  rationale: 不定式绝对形与限定动词连用，加强命令语气；“一定要”兼顾强调和现代汉语的自然表达。
- source_word: אֲחֻזַּת נַחֲלָה
  choice: 一份产业……作继承之业
  rationale: 原文兼有占有之地产和承受产业两层含义；此译既表达实际产业，也保留继承权的法律性质。
- source_word: בְּתוֹךְ אֲחֵי אֲבִיהֶם
  choice: 在她们父亲的兄弟中间
  rationale: 较贴近原文的空间与宗族分配表达，指她们所得的产业位于父系叔伯的份额之中。
- source_word: וְהַעֲבַרְתָּ
  choice: 你要……转给
  rationale: עבר的使役式在此具有法律转移产业的含义；“转给”清楚表达继承权由父亲转归女儿。
- source_word: נַחֲלַת אֲבִיהֶן
  choice: 她们父亲的产业
  rationale: 指原属已故父亲的世袭产业；简洁保留亲属和财产权关系。
theological_decisions: []
