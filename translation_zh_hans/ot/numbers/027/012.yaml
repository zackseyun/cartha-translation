  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה עֲלֵ֛ה אֶל הַ֥ר הָ/עֲבָרִ֖ים הַ/זֶּ֑ה וּ/רְאֵה֙ אֶת הָ/אָ֔רֶץ אֲשֶׁ֥ר נָתַ֖תִּי לִ/בְנֵ֥י יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/012.yaml
  text: Then Yahweh said to Moses[b][a], “Go up to this mountain of the Abarim and see the land that I have given to the sons of Israel.”
translation:
  language: zh_hans
  text: 雅威对摩西说：“你上这座亚巴琳山去，观看我赐给以色列人的那片土地。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: 雅威
  rationale: 采用神圣四字名的通行汉语音译，保留其作为上帝专名的性质，不以称号代替。
- source_word: וַיֹּאמֶר
  choice: 对……说
  rationale: 叙事中的连续式推动情节；汉语无需机械译出连接词，直接以“对……说”自然承接上文。
- source_word: עֲלֵה
  choice: 上……去
  rationale: 准确表达命令式及向高处移动的含义，也符合现代汉语习惯。
- source_word: הַר הָעֲבָרִים הַזֶּה
  choice: 这座亚巴琳山
  rationale: 将עֲבָרִים作为地名音译，并以“这座”保留指示词；正文采用自然的汉语山名结构，脚注说明希伯来语的领属结构。
- source_word: וּרְאֵה
  choice: 观看
  rationale: 保留命令式“看”的直接含义；“观看”比单用“看”稍显庄重，又不至古奥。
- source_word: הָאָרֶץ
  choice: 那片土地
  rationale: 此处指上帝赐予以色列人的特定土地；“那片土地”在汉语中自然，并与摩西登山眺望的语境相合。
- source_word: נָתַתִּי
  choice: 我赐给
  rationale: 希伯来语完成式把赐地表述为确定的既成授予；汉语“赐给”在此已能表达上帝授予土地的庄重语义，无需强加时态助词。
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: 给以色列人
  rationale: 该短语是常见的民族称谓；现代汉语以“以色列人”最自然准确，脚注保留其字面形式“以色列的众子”。
theological_decisions:
- issue: 神圣四字名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: “雅威”直接音译上帝的圣名，避免用称号“主”取代专名；“耶和华”虽有深厚汉语传统，但反映的是较晚形成的读音。
- issue: בְּנֵי יִשְׂרָאֵל的群体称谓
  choice: 以色列人
  alternative: 以色列的众子；以色列子孙
  rationale: 此处该阳性复数结构作为全体民族的固定称谓，并非只强调男性后裔；正文译为“以色列人”可自然涵盖所指群体，同时在脚注中交代字面形式，不抹去原文表达。
- issue: נָתַתִּי完成式在应许语境中的理解
  choice: 我赐给
  alternative: 我已经赐给；我要赐给
  rationale: 保留上帝授地之确定性，却不把完成式过度解释为单纯过去事件或未来时；汉语无须明确标记时态，因而可保存原文在既定授予与实际承受之间的张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“上……去”保持口语自然度，“观看”“赐给”则维持经文应有的庄重感。正文不机械复制希伯来语连接词和语序，但保留命令、指示、专名及授地宣告的核心信息。
