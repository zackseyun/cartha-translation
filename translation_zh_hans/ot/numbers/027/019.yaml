base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/019.yaml
  text: You shall set him before Eleazar the priest and before all the congregation[a], and you shall commission him in their sight.
translation:
  language: zh_hans
  text: 你要让他站在祭司以利亚撒和全体会众面前，并要在他们眼前嘱咐他[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“命令他”或“吩咐他”。这个希伯来语动词通常表示命令；在这里的公开设立场合，也可指公开交托给约书亚的职责。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַעֲמַדְתָּ
  choice: 你要让他站在
  rationale: 该词是עמד的使役式，表示使某人站立或把某人安置在他人面前；此处译作“让他站在”既保留使役含义，也符合公开任命的场景。
- source_word: לִפְנֵי
  choice: 面前
  rationale: 该介词表示处于某人或群体之前，也可表示在其正式见证之下；“面前”简洁自然，并保留空间和礼仪层面的含义。
- source_word: אֶלְעָזָר
  choice: 以利亚撒
  rationale: 采用现代中文圣经中通行的人名音译。
- source_word: הַכֹּהֵן
  choice: 祭司
  rationale: 保留以利亚撒在这一公开交接仪式中的明确职分。
- source_word: כָּל הָעֵדָה
  choice: 全体会众
  rationale: עֵדָה在此指以色列聚集的共同体；“全体会众”自然易懂，并保留其集体及聚集的意味。
- source_word: וְצִוִּיתָה אֹתוֹ
  choice: 委任他
  rationale: צוה通常表示命令或嘱咐，但在本段公开设立约书亚的语境中，也包含正式授予职责的意味；“委任他”传达这一场景，同时用脚注保留基本词义的其他可能。
- source_word: לְעֵינֵיהֶם
  choice: 当着众人的面
  rationale: 原文直译为“在他们眼前”，是表示公开可见、由众人见证的惯用语；该译法符合现代汉语表达。
theological_decisions:
- issue: 约书亚权柄的公开授予
  choice: 将צוה译作“委任”，并以脚注说明“嘱咐”或“命令”的可能
  alternative: 直译为“命令他”或“嘱咐他”
  rationale: 上下文描述摩西在祭司和全会众面前公开设立约书亚。“委任”能体现正式交托职责的语境，但希伯来语动词本身较宽，故不排除命令或训示的含义。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“让他站在……面前”保留原文使役结构；“当着众人的面”自然表达公开见证的意味。脚注标记置于其所解释的“委任他”之后。
