  text: וְ/רָאִ֣יתָה אֹתָ֔/הּ וְ/נֶאֱסַפְתָּ֥ אֶל עַמֶּ֖י/ךָ גַּם אָ֑תָּה כַּ/אֲשֶׁ֥ר נֶאֱסַ֖ף אַהֲרֹ֥ן אָחִֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/013.yaml
  text: And when you have seen it[a], you also will be gathered to your people, just as Aaron your brother was gathered.
translation:
  language: zh_hans
  text: 你看过那地以后，也必被收归到你的族人那里[a]，正如你哥哥亚伦被收归一样。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这是希伯来文表示死亡的惯用语，直译为“被收归到你的族人那里”；也可较意译为“死去”或“归到你的祖先那里”。
    reason: 说明原文死亡惯用语，并保留其可能的解释范围。
lexical_decisions:
- source_word: וְרָאִיתָה אֹתָהּ
  choice: 你看过那地以后
  rationale: ראה为Qal第二人称阳性单数；结合上文观看那地的命令，连词在此自然表达先后关系。阴性宾语代词指向上文的“地”，汉语明说“那地”比单用“它”更清楚。
- source_word: וְנֶאֱסַפְתָּ אֶל עַמֶּיךָ
  choice: 也必被收归到你的族人那里
  rationale: 保留אסף的Niphal被动形式及“归到自己的人民中”的死亡惯用语，不直接简化为“死”，以保存其亲族意象和原文含蓄性。
- source_word: גַּם אָתָּה
  choice: 也必
  rationale: “也”突出摩西将与亚伦有同样结局；“必”自然表达此处所宣告的将来事件。
- source_word: כַּאֲשֶׁר נֶאֱסַף
  choice: 正如……被收归一样
  rationale: “正如”清楚标示比较，并重复“被收归”，保持原文用词的一致和平行结构。
- source_word: אַהֲרֹן אָחִיךָ
  choice: 你哥哥亚伦
  rationale: אָח可泛指兄弟；按民数记叙事中亚伦为摩西的兄长，现代汉语用“哥哥”自然且符合语境。
theological_decisions:
- issue: 死亡惯用语 אסף אל־עמיו 的处理
  choice: 保留为“被收归到你的族人那里”
  alternative: 译为“死去”或“归到你的祖先那里”
  rationale: 原文不仅陈述死亡，还以被收归到所属族群的表达承载亲族意味。直译式保留这一意象，同时借脚注说明其含义，不据此额外规定死后状态。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“被收归”略带文学色彩，用来保留希伯来文被动惯用语；脚注帮助普通读者理解。
