base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/015.yaml
  text: Then Moses spoke to Yahweh[a], saying,
translation:
  language: zh_hans
  text: 于是，摩西对雅威[a]说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文为“YHWH”（神圣四字名）；传统上也译作“上主”。
    reason: 说明神名的原文形式及传统替代译法。
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: 于是……说
  rationale: 该叙事性动词形式推进事件次序；“于是”自然体现承接关系。由于后有 לֵאמֹר 引出下文，汉语合并译作一个“说”比重复“讲话说”更自然。
- source_word: מֹשֶׁה
  choice: 摩西
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: אֶל
  choice: 对
  rationale: 此处介词表示言语所指向的对象，汉语用“对……说”最自然准确。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文读者熟悉的神圣四字名音译，并以脚注说明原文形式及传统替代译法。
- source_word: לֵאמֹר
  choice: 说
  rationale: 该不定式结构用于引出直接引语；在现代汉语中与前面的言说动词合并表达，避免生硬重复，同时保留下文为摩西话语内容的功能。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威；上主
  rationale: 原文直接使用神圣四字名 YHWH。正文采用中文传统且普通读者最熟悉的音译“耶和华”，不以称号无提示地取代专名；脚注交代原文形式及“上主”这一传统替代译法。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“于是”承接前文并推进叙事；“对……说”符合现代汉语表达。句末用冒号，因为下一节开始直接引语。
