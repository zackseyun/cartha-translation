  yaml_path: translation/ot/numbers/027/023.yaml
  text: And he laid his hands on him and commanded him[b][a], just as Yahweh had spoken by the hand of Moses.
translation:
  language: zh_hans
  text: 摩西把双手按在约书亚身上，吩咐他[a]，正如耶和华藉摩西的手所说的[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “吩咐”也可译作“命令”“嘱咐”或“郑重托付”。这里是在公开设立约书亚为领袖的情境中所作的正式吩咐。
    reason: lexical_alternative
  - marker: b
    text: “藉摩西的手”是希伯来语表达，意思是耶和华藉着摩西、以摩西为传话者。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְמֹךְ אֶת־יָדָיו עָלָיו
  choice: 把双手按在约书亚身上
  rationale: סמך与“手”连用表示按手；יָדָיו为复数，译作“双手”。依上下文明确代词所指为摩西和约书亚，使中文自然清楚。
- source_word: וַיְצַוֵּהוּ
  choice: 嘱咐他
  rationale: צוה通常表示命令、吩咐；在本段公开立约书亚为领袖的语境中，也带有郑重托付之意。“嘱咐”兼顾命令与正式委任语境，同时不把后者写死在正文中。
- source_word: כַּאֲשֶׁר
  choice: 正如
  rationale: 表达摩西所行与耶和华先前所言完全相应。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经语境中通行的神圣名字译法。
- source_word: בְּיַד מֹשֶׁה
  choice: 藉摩西的手
  rationale: 保留希伯来文“藉……的手”这一代理表达，同时以脚注说明其含义。
theological_decisions:
- issue: 约书亚受立时动词צוה的含义
  choice: 嘱咐他
  alternative: 任命他；吩咐他；告诫他
  rationale: 原词的核心是命令或嘱咐，而上下文又是摩西公开设立约书亚。“嘱咐”保留词义及正式托付的语气，不直接采用“按立”等可能带入后期宗派制度含义的术语。
- issue: “藉摩西的手”的代理含义
  choice: 正文保留原文意象，脚注解释为“藉着摩西”
  alternative: 正文直接译作“藉着摩西”
  rationale: 保留圣经希伯来语的具象表达，也让读者明白摩西在此是传达耶和华话语的代理者。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“双手”准确反映希伯来文复数；以“约书亚”明确代词对象，避免中文连续使用“他”造成歧义。保留“藉摩西的手”的原文意象，并用脚注解释。
