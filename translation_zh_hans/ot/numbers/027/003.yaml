base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/003.yaml
  text: Our father died in the wilderness[a], and he was not among the congregation of those who gathered themselves against Yahweh in the company of Korah; rather, he died for his own sin[c][b], and he had no sons.
translation:
  language: zh_hans
  text: “我们的父亲死在旷野；他并不在可拉一党中——就是那群聚集反对雅威的人——乃是因自己的罪而死，并且没有儿子。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָבִינוּ
  choice: 我们的父亲
  rationale: 说话者是西罗非哈的女儿们，直指她们的父亲；不宜泛化为“祖先”。
- source_word: בַּמִּדְבָּר
  choice: 在旷野
  rationale: “旷野”是摩西五经相关语境中自然且传统的译法，能保留以色列旷野时期的背景。
- source_word: בְּתוֹךְ הָעֵדָה הַנּוֹעָדִים עַל יְהוָה
  choice: 在那群聚集起来反对耶和华的人中
  rationale: בְּתוֹךְ 表示“在……中”；נֹועָדִים 是集体聚集的分词，עַל 在此表达敌对方向。中文用“那群……的人”自然传达 עֵדָה 的群体含义。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的专名形式呈现四字神名，而不以“主”这一称号替代。
- source_word: בַּעֲדַת קֹרַח
  choice: 属于可拉一伙
  rationale: 该短语指与可拉相关的反叛集团；“一伙”在此清楚表达特定结党群体，并避免与前文重复。
- source_word: כִּי בְחֶטְאוֹ מֵת
  choice: 他是因自己的罪而死的
  rationale: כִּי 在上下文中引出纠正或对照；בְּ 可按因果关系理解。加入“自己的”体现第三人称单数后缀，并与参与可拉集团的共同罪责形成区别。
- source_word: וּבָנִים לֹא הָיוּ לוֹ
  choice: 并且没有儿子
  rationale: 自然表达希伯来语存在句加 לְ 的领属结构；保留“儿子”，因为上下文关乎没有男性后嗣时的产业继承。
theological_decisions:
- issue: 父亲之死与可拉叛乱之间的关系
  choice: 明确他不属于聚集反对耶和华的可拉集团，却因自己的罪而死
  alternative: 译作“死在自己的罪中”
  rationale: 经文区分其个人之死与参加可拉叛乱，却没有说明具体是哪一种罪；译文保留这种界限，不额外推断。
- issue: 神名 יְהוָה 的呈现
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用神的专名而非普通称号；正文保留专名。中文采用广为读者识别的“耶和华”，不改译为“主”。
translation_notes:
  register: 采用现代、庄重而清楚的普通话。“一伙”在此不是戏谑语，而是简洁指称可拉所领导的特定结党群体；整体保留希伯来语先否定参与集团、再说明个人死亡缘由的对照结构。
