revisions:
- from: “我们的父亲死在旷野。他并不在那群聚集起来反对耶和华的人中，也不属于可拉一伙；他是因自己的罪而死的[a]，并且没有儿子。”
  to: “我们的父亲死在旷野；他并不在可拉一党中——就是那群聚集反对雅威的人——乃是因自己的罪而死，并且没有儿子。”
  rationale: 修订将“可拉一党”与“那群聚集反对雅威的人”处理为同位说明，保留希伯来文对相关会众的界定，同时使现代汉语句法自然。将神名改为“雅威”以对应既定 Yahweh 翻译决定。脚注仍保留对 בְחֶטְאוֹ 的可行替代译法，避免断定未说明的具体罪行。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T05:00:50Z'
review_pass:
  verdict: revise
  source_fidelity: 草稿将“可拉的会众”拆作与前一否定并列的“也不属于可拉一伙”，弱化了原文中“可拉的会众”对“那聚集反对耶和华之会众”的限定/同位关系。并且，英文审校轨迹既定将 יהוה 译为 Yahweh，中文宜相应采用“雅威”，而非传统形式“耶和华”。其余主要信息——死在旷野、未参与可拉的叛乱、因自己的罪而死、没有儿子——均得到保留。
  naturalness: “可拉一伙”带有较强口语和贬抑色彩，且“那群……的人中，也不属于……”造成不必要的重复。改为破折号同位说明，可自然清楚地表达该群体的身份及其反对雅威的行为。
  terminology: 将神名统一为“雅威”，对应原文 יהוה 及英文 POB 的 Yahweh。以“可拉一党”指称与可拉有关的派别，语体庄重且不额外渲染。保留“因自己的罪而死”，因为此处 בְ 可作因果理解；脚注保留“死在自己的罪中”这一可行的字面替代，并说明罪行未被具体说明。
