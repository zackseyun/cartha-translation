    rationale: 经文确实描述反叛者，但“可拉一党”足以标示派别，不必增加口语化的评价色彩。
  revised_text: “我们的父亲死在旷野；他并不在可拉一党中——就是那群聚集反对雅威的人——乃是因自己的罪而死，并且没有儿子。”
