source:
  edition: WLC
  text: וְ/אִם אֵ֣ין אַחִים֮ לְ/אָבִי/ו֒ וּ/נְתַתֶּ֣ם אֶת נַחֲלָת֗/וֹ לִ/שְׁאֵר֞/וֹ הַ/קָּרֹ֥ב אֵלָ֛י/ו מִ/מִּשְׁפַּחְתּ֖/וֹ וְ/יָרַ֣שׁ אֹתָ֑/הּ וְֽ/הָ֨יְתָ֜ה לִ/בְנֵ֤י יִשְׂרָאֵל֙ לְ/חֻקַּ֣ת מִשְׁפָּ֔ט כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/011.yaml
  text: And if his father has no brothers[a], then you shall give his inheritance to his nearest relative from his clan, and he shall possess it. This shall be for the sons of Israel a statute of judgment[d][c][b], just as Yahweh commanded Moses.
translation:
  language: zh_hans
  text: 如果他父亲没有兄弟，就要把他的产业交给他本族中与他血缘最近的亲属[a]，由他继承[b]。这要成为以色列人的法律条例[c]，正如雅威吩咐摩西的那样。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文同时用了“血亲”和“与他最近的”来说明这位亲属。
    reason: 保留希伯来文两个相邻限定语所表达的血缘及亲疏层次。
  - marker: b
    text: 或译：“由他占有。”
    reason: ירשׁ兼有继承和取得、占有产业的含义。
  - marker: c
    text: 或译：“审判的律例”或“法定条例”。
    reason: חֻקַּת מִשְׁפָּט可按形式直译，也可按其法律功能译出。
lexical_decisions:
- source_word: אַחִים לְאָבִיו
  choice: 他父亲……兄弟
  rationale: 这里承接前文的继承次序，指死者父亲的兄弟；按现代汉语自然表达为“他父亲没有兄弟”。
- source_word: נַחֲלָתוֹ
  choice: 他的产业
  rationale: 本段讨论世袭财产的转移；“产业”既能表达可继承的财产，也符合庄重的法律语境。
- source_word: לִשְׁאֵרוֹ הַקָּרֹב אֵלָיו
  choice: 与他血缘最近的亲属
  rationale: שְׁאֵר指血亲，הַקָּרֹב אֵלָיו进一步限定亲属关系的远近；合译可清楚表达法律上的最近血亲。
- source_word: מִמִּשְׁפַּחְתּוֹ
  choice: 他本族中
  rationale: מִשְׁפָּחָה在以色列的社会结构中常指比核心家庭更广的亲族群体；“本族”比“家庭”更贴合此处。
- source_word: וְיָרַשׁ אֹתָהּ
  choice: 由那亲属承受
  rationale: ירשׁ可指继承或取得产业；“承受”在中文中保留继承产业的语义，并避免紧接“交给”后的生硬重复。
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 原文直译为“以色列的众子”，在这里是全体以色列民的固定称谓；“以色列人”是自然且准确的现代汉语表达。
- source_word: לְחֻקַּת מִשְׁפָּט
  choice: 法定条例
  rationale: 该词组表示具有约束力的司法或法律规定；“法定条例”在现代汉语中自然地传达其法律效力，同时在脚注保留结构上的其他可能译法。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以“雅威”音译四字神名，保留原文所用的专名，而不以称号替代。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用以色列上帝的四字神名；音译“雅威”保留专名性质。
- issue: לִבְנֵי יִשְׂרָאֵל 的群体指向
  choice: 以色列人
  alternative: 以色列的众子
  rationale: 该短语形式上是阳性复数，却在此作为盟约群体和民族整体的惯用称谓；现代汉语“以色列人”不把范围误限于男性。
- issue: 继承动词 וְיָרַשׁ 的语义
  choice: 承受
  alternative: 继承；占有
  rationale: 语境明确涉及产业继承，但该动词也可强调取得并占有；正文采用兼具继承意味的“承受”，脚注说明其语义幅度。
translation_notes:
  register: 采用现代、庄重而易懂的法律叙述语体。“本族”“产业”“法定条例”体现继承法规的语境；句法保持清晰，不照搬希伯来语结构。
