base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/002.yaml
  text: And they stood before Moses[a], before Eleazar the priest, before the leaders, and all the congregation, at the entrance of the tent of meeting, saying[b],
translation:
  language: zh_hans
  text: 她们在会幕门口，站在摩西、祭司以利亚撒、众首领和全会众面前，说：
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתַּעֲמֹדְנָה
  choice: 她们来到……面前，站在
  rationale: עמד的第三人称阴性复数形式表明是上一节所列的众女儿采取行动；此处兼顾叙事推进和公开陈情的正式意味。中文加入“来到”使“站在……面前”自然连贯，并未改变动作核心。
- source_word: לִפְנֵי
  choice: 在……面前
  rationale: 保留原文在列举摩西、以利亚撒、众首领及全会众时所表达的正式、公公开出现于权威和群体面前的意味。
- source_word: אֶלְעָזָר הַכֹּהֵן
  choice: 祭司以利亚撒
  rationale: 按现代汉语习惯将职衔置于姓名之前；原文只称“祭司”，不扩充为“大祭司”。
- source_word: הַנְּשִׂיאִם
  choice: 众首领
  rationale: נשיאים在本处指群体或支派的正式领袖；“首领”既体现其职分，也避免“王子”所带来的世袭王族误解。
- source_word: כָל הָעֵדָה
  choice: 全会众
  rationale: עדה在民数记中常指以色列共同体；“会众”保留其群体性和经常聚集的语感，כָל译为“全”。
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: 在会幕门口
  rationale: פתח指入口；אהל מועד采用中文圣经中清楚而简洁的传统对应“会幕”，即相会之帐幕。
- source_word: לֵאמֹר
  choice: 说：
  rationale: 该公式引出下一节的直接引语。中文以“说：”比悬置的“说道”更自然，并清楚保留经文衔接。
theological_decisions:
- issue: 众女儿公开提出案件的法律与群体场景
  choice: 完整保留摩西、祭司以利亚撒、众首领和全会众的列举
  alternative: 将对象概括为“以色列的领袖和会众”
  rationale: 原文逐项列举受理者及在场群体，凸显这次申诉的公开性、正式性和共同体分量；不宜为求简洁而压缩。
- issue: עֵדָה的群体含义
  choice: 会众
  alternative: 大会；集会
  rationale: “会众”在现代中文中仍能自然表达聚集的共同体，又不把该词仅仅理解为一次程序性的会议。
- issue: אהל מועד的名称
  choice: 会幕
  alternative: 相会帐幕；会见之幕
  rationale: “会幕”是简洁且广为理解的专名式译法；它不额外判定“相会”的具体主体，也避免冗长解释。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。保留原文完整的权威与群体名单，但按汉语语序将地点“在会幕门口”置于“站在”之后，并用冒号衔接下一节引语。英文咨询层的脚注标记与其实际脚注内容明显错配，且希伯来文本在“摩西”处无“全会众”的异读、在“说”处也无“首领/王子”的词义问题，因此不沿用这些标记。
