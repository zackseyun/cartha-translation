  text: וַ/יַּ֣עַשׂ מֹשֶׁ֔ה כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֹת֑/וֹ וַ/יִּקַּ֣ח אֶת יְהוֹשֻׁ֗עַ וַ/יַּֽעֲמִדֵ֨/הוּ֙ לִ/פְנֵי֙ אֶלְעָזָ֣ר הַ/כֹּהֵ֔ן וְ/לִ/פְנֵ֖י כָּל הָ/עֵדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/022.yaml
  text: 'And Moses did as Yahweh had commanded him: he took Joshua and set him before Eleazar the priest and before all the congregation[a].'
translation:
  language: zh_hans
  text: 摩西就照雅威所吩咐他的做了。他带着约书亚，使他站在祭司以利亚撒和全会众面前。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“把他安置在祭司以利亚撒和全会众面前。”这里的希伯来语动词也可表示“将他呈在……面前”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: 做了
  rationale: עשה在此概括摩西对先前命令的遵行；“照……所吩咐的做了”自然、准确，并保留原文简洁的表达。
- source_word: כַּאֲשֶׁר
  choice: 照
  rationale: 该比较连词表明摩西依照耶和华的命令行事；现代汉语中“照……做”简洁自然。
- source_word: צִוָּה
  choice: 所吩咐
  rationale: “吩咐”适合上对下的命令语境；“所”字结构清楚表达该命令先于摩西的行动，无须用汉语额外标示过去完成时。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的专名“耶和华”对应四字神名，保留其作为以色列之神专名的性质，而不以称号替代。
- source_word: וַיִּקַּח אֶת־יְהוֹשֻׁעַ
  choice: 他领来约书亚
  rationale: לקח本义为“取、带领”；在公开授职的场景中，“领来”比字面的“带走”更清楚地表达摩西把约书亚带到众人面前，同时不过度解释。
- source_word: וַיַּעֲמִדֵהוּ
  choice: 使他站在
  rationale: עמד的使役式表示使某人站立或将某人安置、呈现在面前；正文采用较贴近其形态和场景的“使他站在”，并以脚注保留“把他带到……面前”的语义可能。
- source_word: לִפְנֵי
  choice: 面前
  rationale: 该介词表示在某人或群体面前、在其见证之下；“面前”可自然地同时连接以利亚撒和全会众。
- source_word: הַכֹּהֵן
  choice: 祭司
  rationale: 直接对应以利亚撒的职分称谓；中文姓名前置为“祭司以利亚撒”，行文自然。
- source_word: כָּל־הָעֵדָה
  choice: 全会众
  rationale: עֵדָה指聚集的以色列共同体；“全会众”简洁、通行，并准确体现כָּל。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用神的专名而非普通称号。正文保留专名，并采用现代简体中文圣经传统中辨识度最高的“耶和华”；“雅威”是依据学界常见拟音的可行替代，但不影响本节含义。
- issue: 约书亚在以利亚撒和会众面前的动作性质
  choice: 使他站在……面前
  alternative: 把他带到／呈在……面前
  rationale: 使役式 וַיַּעֲמִדֵהוּ 既可突出实际站立，也可在授职语境中表示公开安置或呈上。正文保留动作的具体性，不把授职仪式的含义过度明说；脚注注明较宽泛的译法。
translation_notes:
  register: 采用现代、庄重而易懂的叙事体。“摩西就照……做了”体现连续叙事及顺服关系；“领来”“使他站在……面前”既自然，也保留公开授职场景中的具体动作。脚注标记置于正文相关句末。
