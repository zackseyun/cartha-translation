    rationale: 原文为四字神名；英文项目明确选择 Yahweh。中文应采用相应的专名音译“雅威”，以维持该项目对神名不以传统替代形式处理的原则。
  - severity: low
    issue: 脚注把 וַיַּעֲמִדֵהוּ 的替代译法表述为“把他带到”。
    rationale: “带到”主要对应前面的 וַיִּקַּח；此处使役式的核心是使其站立、安置或呈现在面前。脚注应避免混淆两个动词，并保留其仪式性呈现的可能。
