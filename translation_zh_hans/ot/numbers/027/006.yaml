  text: 于是雅威对摩西说：
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: 未完成式连续结构在这里推进叙事；现代汉语接续上文时通常不必另译“然后”或“于是”，简洁的“说”已自然承接事件次序。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代简体中文圣经传统中最通行的神名音译“耶和华”，使普通读者能够识别这是专名而非称号。
- source_word: אֶל
  choice: 对
  rationale: 在“对某人说”的汉语引语公式中，“对”自然准确地表达说话对象。
- source_word: מֹשֶׁה
  choice: 摩西
  rationale: 采用该人名在现代汉语中的标准译名。
- source_word: לֵאמֹר
  choice: 以冒号体现
  rationale: 该不定式用于引出随后话语；现代汉语以“说：”自然表达其功能，若再译作“说道”或“说以下的话”则显累赘。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。中文正文采用广为人知的专名“耶和华”，既不以“主”这一称号替代，也保持庄重和可识别性；“雅威”是更接近学界常见拟音的可行译法。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。冒号引出下一节的直接话语，既体现 לֵאמֹר 的功能，又避免生硬重复。
