  text: וַ/יַּקְרֵ֥ב מֹשֶׁ֛ה אֶת מִשְׁפָּטָ֖/ לִ/פְנֵ֥י יְהוָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/005.yaml
  text: So Moses brought their case before Yahweh[a].
translation:
  language: zh_hans
  text: 于是，摩西把她们的案件带到雅威面前。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“摩西把她们的法律诉求呈到雅威面前。”
    reason: מִשְׁפָּטָן在此法律语境中也可译为“她们的法律诉求”；וַיַּקְרֵב可译为“呈到／呈上”。
lexical_decisions:
- source_word: וַיַּקְרֵב
  choice: 呈到
  rationale: 该词为קרב的使役形，意为“使靠近、带到、呈上”。在司法语境中，“呈到”自然表达摩西把案件正式交由雅威裁决。
- source_word: מִשְׁפָּטָן
  choice: 她们的案件
  rationale: מִשְׁפָּט可指判决、公正、诉讼事项或案件；此处阴性复数后缀指西罗非哈的众女儿。“她们的案件”既保留法律语境，也符合现代汉语表达。
- source_word: לִפְנֵי
  choice: 面前
  rationale: 本义为“在……面前”；此处表示把案件呈交雅威审断。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以“雅威”音译四字神名，保留原文所用的专名，不以称号替代。
- source_word: וַ
  choice: 于是
  rationale: 连接并推进叙事，同时表明摩西的行动承接前文众女儿所提出的请求。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用以色列上帝的专名；音译为“雅威”可保留专名性质，而不将其改作称号。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“呈到……面前”保留原文空间性表达及正式提交案件的法律意味；“她们”明确对应阴性复数后缀。
