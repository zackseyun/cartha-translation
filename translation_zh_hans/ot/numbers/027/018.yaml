base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/018.yaml
  text: And Yahweh said to Moses[a], “Take Joshua son of Nun, a man in whom is spirit, and lay your hand on him.”
translation:
  language: zh_hans
  text: 耶和华对摩西说：“你要带嫩的儿子约书亚来；他是一个有灵的人[a]。你要把手按在他身上。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“灵在他里面”。“灵”也可理解为“上帝的灵”或某种属灵的禀赋；希伯来文没有说明其具体所指。
    reason: 保留原文在“灵”的具体所指上的歧义。
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经语境中广为人知的神圣名字译法，明确保留原文专名，而不以“主”替代。
- source_word: קַח לְךָ
  choice: 你要选取
  rationale: לקח 的基本义为“拿、取”，在指定继任者的语境中译作“选取”自然准确；לְךָ 属希伯来语惯用结构，无须机械译成“为你自己”。
- source_word: יְהוֹשֻׁעַ בִּן נוּן
  choice: 嫩的儿子约书亚
  rationale: 按现代中文常用圣经人名译法处理专名，并保留父子关系。
- source_word: אִישׁ אֲשֶׁר רוּחַ בּוֹ
  choice: 他是个里面有灵的人
  rationale: 贴近原文“一个灵在他里面的人”的简洁结构。原文“灵”不带冠词，主文不擅自明确为“圣灵”，以保留其可指上帝所赐之灵或属灵禀赋的张力。
- source_word: וְסָמַכְתָּ אֶת יָדְךָ עָלָיו
  choice: 你要把手按在他身上
  rationale: “把手按在……身上”准确表达 סמך 与“手”搭配的委任动作，并保留原文单数“手”。
theological_decisions:
- issue: רוּחַ 是否明确指上帝的灵
  choice: 主文译作“灵”，不加“圣”或“上帝的”
  alternative: 上帝的灵／圣灵
  rationale: 希伯来文没有冠词，也未明说“上帝的”或“圣”。上下文容许将其理解为上帝所赐、使约书亚胜任领导的灵，但译文不应把这一合理解释变成原文唯一明说的含义。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。“选取”符合任命继任者的语境；分号使人物与其特征之间的关系清楚。脚注标记紧接“里面有灵的人”，避免误指前面的摩西或约书亚姓名。
