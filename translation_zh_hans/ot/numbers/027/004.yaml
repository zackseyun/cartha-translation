base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/004.yaml
  text: Why should our father's name be taken away from among his clan because he had no son? Give us a possession among our father's brothers[a][b].
translation:
  language: zh_hans
  text: “为什么我们父亲没有儿子，他的名字就要从宗族中被除掉[a]呢？请在我们父亲的兄弟中给我们一份产业[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “除掉”或译“减损”或“移除”。希伯来文所问的是：父亲因没有儿子，他的“名字”为什么就要从宗族中失去。
    reason: lexical_alternative
  - marker: b
    text: “产业”在这里指宗族内分得并持有的一份土地，即继承制度中的地产份额。
    reason: cultural_note
lexical_decisions:
- source_word: לָמָּה
  choice: 为什么……呢
  rationale: 引出带有申诉意味的反问，既保留疑问，也自然表达说话者认为此事不应发生的语气。
- source_word: יִגָּרַע
  choice: 除掉
  rationale: 该词为גרע的未完成式Nifal形态，在这里表示父亲的名字从宗族中被减除或不再存留；“除掉”清楚传达实际失去名分与纪念的结果，同时以脚注保留“减损”等词义可能。
- source_word: שֵׁם אָבִינוּ
  choice: 我们父亲的名字
  rationale: 直译“名字”，保留希伯来语中名字代表家系延续、身份与纪念的表达，不在正文中解释性改写。
- source_word: מִתּוֹךְ מִשְׁפַּחְתּוֹ
  choice: 从他宗族中
  rationale: מִשְׁפָּחָה在支派土地与继承语境中指宗族群体，比现代汉语的“家庭”范围更大；“宗族”能体现这一层级。
- source_word: כִּי אֵין לוֹ בֵּן
  choice: 因他没有儿子
  rationale: 中文无须强行标示过去或现在时，因而可贴近希伯来文无动词分句，并保留法律问题所针对的男性后嗣。
- source_word: תְּנָה לָּנוּ
  choice: 请……给我们
  rationale: 原文是直接命令式请求；加入“请”符合现代汉语向领袖陈情的自然语气，又不削弱请求的明确性。
- source_word: אֲחֻזָּה
  choice: 一份产业
  rationale: 指宗族土地制度中可持有的土地份额或继承地产；“产业”在中文圣经法律语境中简洁自然，脚注说明其土地性质。
- source_word: בְּתוֹךְ אֲחֵי אָבִינוּ
  choice: 在我们父亲的兄弟中
  rationale: 保留原文明确的父系男性亲属用语，不泛化为“亲属”；介词短语表示在这些叔伯所处的继承份额范围内获得产业。
theological_decisions:
- issue: 继承语境中的性别特指用语
  choice: 保留“儿子”和“父亲的兄弟”
  alternative: 译作“孩子”和“父系亲属”
  rationale: 希伯来文明确使用בֵּן（儿子）和אֲחֵי אָבִינוּ（我们父亲的兄弟），因为此处法律争议正涉及儿子与父系兄弟承接土地的制度；不将这些词中性化，以免淡化经文提出的问题。
translation_notes:
  register: 采用现代、庄重而易懂的陈情语体。“为什么……呢”表达申诉式反问，“请……给我们”保持请求的直接性；保留“名字”“儿子”“父亲的兄弟”等原文具体措辞，并用脚注解释古代宗族土地制度。
