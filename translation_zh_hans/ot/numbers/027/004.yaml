revisions:
- from: “为什么因他没有儿子，就让我们父亲的名字从他宗族中除掉[a]呢？请在我们父亲的兄弟中给我们一份产业[b]。”
  to: “为什么我们父亲没有儿子，他的名字就要从宗族中被除掉[a]呢？请在我们父亲的兄弟中给我们一份产业[b]。”
  rationale: 仅作安全的汉语语法与语体修订：以“被除掉”明确原文被动语态，并重排因果分句使申诉式问句自然。脚注 b 略作收束，保留土地持有与继承制度背景，而不把请求授予的土地说成已经继承取得。
