  terminology: “宗族”“儿子”“父亲的兄弟”“产业”均符合本段土地继承语境和现代中文圣经语体。产业脚注宜避免将所请求的授予直接表述成已经“继承所得”，而说明其作为继承制度中的土地份额即可。
