  yaml_path: translation/ot/numbers/034/007.yaml
  text: 'And this shall be your northern border: from the Great Sea you shall mark out for yourselves Mount Hor[a][b].'
translation:
  language: zh_hans
  text: 你们的北界要这样划定：从大海起，你们要把界线划到何珥山[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你们要从大海向何珥山划定边界线。”这里的动词在地理划界的语境中，可以表示描画或标定边界线。
    reason: lexical_alternative
  - marker: b
    text: “大海”指地中海。
    reason: cultural_note
lexical_decisions:
- source_word: וְ/זֶה יִהְיֶה לָ/כֶם גְּבוּל צָפוֹן
  choice: 你们北面的边界要这样划定
  rationale: 原文直译为“这要作你们北面的边界”。结合下文的划界指示，译作“要这样划定”更符合现代汉语，同时保留法规性语气和段落承接作用。
- source_word: מִן הַ/יָּם הַ/גָּדֹל
  choice: 从大海起
  rationale: 保留希伯来文地理称谓“大海”，不在正文中直接以现代名称“地中海”取代；“起”自然表达边界线的起点。
- source_word: תְּתָא֥וּ לָ/כֶ֖ם
  choice: 要为自己把边界划到
  rationale: 该动词在划界语境中可指描画、标定或延伸边界线；“把边界划到”以自然汉语表达其方向性，并以脚注保留词义上的其他可能。לָכֶם 译为“为自己”，保留动作与以色列自身领地的关系。
- source_word: הֹ֥ר הָ/הָֽר
  choice: 何珥山
  rationale: 按中文圣经地名的通行音译处理这一专名；原文形式字面近于“何珥那山”，但在此指名为“何珥山”的地点。
