translation_notes:
  register: 采用现代、庄重而易懂的法规与地理描述语体。“北面的边界”比“北界”更便于普通读者理解；正文保留“大海”这一原文称谓，并以脚注说明现代地理名称。所有脚注标记均置于相关正文之后。
