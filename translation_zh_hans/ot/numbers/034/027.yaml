lexical_decisions:
- source_word: וּ/לְ/מַטֵּה
  choice: ……支派的
  rationale: מַטֶּה在分配土地的语境中指“支派”，而非其具体意义“杖”；介词לְ在本节省略谓语的名单句式中自然处理为领属结构。
- source_word: בְנֵי אָשֵׁר
  choice: 亚设子孙
  rationale: בְנֵי字面为“儿子们”，在此是支派群体的惯用称呼；“子孙”既保留血缘表述，也符合现代中文圣经叙事用语。
- source_word: נָשִׂיא
  choice: 首领
  rationale: 此词指受命代表支派参与土地分配的人；“首领”体现其正式领导身份，又避免“王子”的王室含义。
- source_word: אֲחִיהוּד
  choice: 亚希忽
  rationale: 按希伯来语人名音译，并采用现代中文圣经中通行、易辨识的形式。
- source_word: בֶּן שְׁלֹמִי
  choice: 示罗米的儿子
  rationale: 忠实表达希伯来语标准父子名号结构，并采用自然的现代汉语语序。
