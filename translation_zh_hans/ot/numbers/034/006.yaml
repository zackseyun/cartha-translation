  yaml_path: translation/ot/numbers/034/006.yaml
  text: And the western border shall be for you the Great Sea as a border[a]; this shall be your western border.
translation:
  language: zh_hans
  text: “西边的边界：大海要作你们的边界[a]；这就是你们西边的边界。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“海的边界”或“沿海的边界”。在这段划定疆界的语境中，希伯来语“海”也可表示西方，因此译作“西边”。
    reason: lexical_alternative
lexical_decisions:
- source_word: גְּבוּל יָם
  choice: 西边的边界
  rationale: יָם本义为“海”，但在此处的疆界描述中也表示朝海的一侧，即西边；译为“西边的边界”自然清楚，同时以脚注保留原文措辞。
- source_word: הַיָּם הַגָּדוֹל
  choice: 大海
  rationale: 这是希伯来圣经对地中海的常用地理称呼；“大海”既保留原文字面形式，也符合中文圣经地理语境。
- source_word: וּגְבוּל
  choice: 作……的边界
  rationale: 此词在“大海”之后说明其疆界功能；用“作你们的边界”明确表达大海构成边界，而不生硬复制希伯来语结构。
- source_word: זֶה יִהְיֶה לָכֶם גְּבוּל יָם
  choice: 这就是你们西边的边界
  rationale: 这是总结性的复述；“这就是”自然传达指示词与系词结构，“你们西边的边界”保留领属和方位含义。
theological_decisions: []
