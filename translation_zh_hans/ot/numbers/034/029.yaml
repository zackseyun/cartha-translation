base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/029.yaml
  text: These are the ones whom Yahweh commanded to apportion the inheritance to the sons of Israel in the land of Canaan[a].
translation:
  language: zh_hans
  text: 这些人，是雅威吩咐在迦南地把产业分给以色列子孙的[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“这些人，是雅威吩咐在迦南地使以色列子孙承受产业的。”
    reason: 词义选择：לְנַחֵל可侧重在分地过程中把产业分给人，也可侧重使人承受产业。
lexical_decisions:
- source_word: אֵלֶּה אֲשֶׁר
  choice: 以上这些人
  rationale: 指回前文列出的领袖，并以自然的现代汉语表达希伯来语的指示和关系结构。
- source_word: צִוָּה
  choice: 吩咐
  rationale: 保留צוה“命令、吩咐”的基本意义；上下文虽涉及受委任的人，但本句着重雅威交付给他们的任务。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按专名音译四字神名，避免以“主”这一称号代替原文中的名字。
- source_word: לְנַחֵל
  choice: 给……分配产业
  rationale: 该词为נחל的使役形，在此指使以色列人取得产业，结合分地语境译为“分配产业”，兼顾产业承受和土地分配两层含义。
- source_word: אֶת בְּנֵי יִשְׂרָאֵל
  choice: 给以色列子孙
  rationale: 保留“以色列子孙”的原文表达；“给”由现代汉语中“分配”的配价结构自然补出。
- source_word: בְּאֶרֶץ כְּנָעַן
  choice: 在迦南地
  rationale: 准确保留地点与“地”这一名词，表达简洁自然。
theological_decisions:
- issue: 四字神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文使用神的专名而非“主”这一称号；“雅威”较直接地反映通常重构的读音。
- issue: לְנַחֵל所表达的产业关系
  choice: 分配产业
  alternative: 使以色列子孙承受产业
  rationale: 上下文是领袖负责划分迦南地，正文采用自然且具体的“分配产业”；脚注保留使役结构所容许的“使……承受产业”，不把词义张力完全消除。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“以上这些人”承接前文名单；句末“的”构成自然的判断句。正文保留“以色列子孙”这一传统且贴近原文的称谓，并用脚注呈现使役动词的另一种合理译法。
