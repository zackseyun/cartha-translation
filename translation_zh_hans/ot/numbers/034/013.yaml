base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/013.yaml
  text: Then Moses commanded the sons of Israel, saying, “This is the land that you shall inherit by lot, which the LORD commanded to give to the nine tribes and the half-tribe.”
translation:
  language: zh_hans
  text: 摩西吩咐以色列人说：“这就是你们要拈阄承受为业的地，是耶和华吩咐赐给九个半支派的。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְצַו
  choice: 吩咐
  rationale: 准确表达带有权威性的命令，符合现代汉语经文语体。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 字面为“以色列的众子”，此处指以色列民众；译作“以色列人”自然且准确。
- source_word: תִּתְנַחֲלוּ אֹתָהּ
  choice: 承受为业
  rationale: 该动词在此指取得土地作为产业；“承受为业”保留土地产业和继承所得的含义。
- source_word: בְּגוֹרָל
  choice: 拈阄
  rationale: 表示借抽签分配土地；“拈阄”简洁保留古代分地方式。
- source_word: לָתֵת
  choice: 赐给
  rationale: 不定式直译为“给”；主语为耶和华时用“赐给”符合庄重语域，同时不改变句法关系。
- source_word: תִשְׁעַת הַמַּטּוֹת וַחֲצִי הַמַּטֶּה
  choice: 九个半支派
  rationale: 原文直为“九个支派和半个支派”；汉语合称“九个半支派”清楚自然。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 采用中文圣经读者广泛熟悉的传统专名“耶和华”；不以“主”替代，从而保留原文专名的性质。
- issue: אֲשֶׁר 的关系从句所指
  choice: “是耶和华吩咐赐给九个半支派的”修饰“地”
  alternative: 理解为强调耶和华所下达的分地命令
  rationale: 原文关系代词紧接整句土地描述，汉译保持其句法开放性，不额外补出受命执行赐地的人，也不解决“吩咐谁赐给”的隐含问题。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“拈阄”“承受为业”略带经文语体，但含义明确，并能保留古代分地及土地产业的语义。
