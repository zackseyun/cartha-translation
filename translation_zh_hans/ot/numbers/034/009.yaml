  yaml_path: translation/ot/numbers/034/009.yaml
  text: Then the border shall extend to Ziphron[a], and its endpoint shall be Hazar-enan. This shall be your northern border.
translation:
  language: zh_hans
  text: 边界要延伸到西斐仑，尽头是哈萨以难[a]。这就是你们北面的边界。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“它的终点（复数）是哈萨以难。”希伯来语在此用复数形式描述边界终止之处。
    reason: 保留原文复数形式的信息，同时避免“出口”在现代汉语中的误解。
lexical_decisions:
- source_word: וְיָצָא
  choice: 要延伸
  rationale: 在划定疆界的语境中，יצא描述边界线的走向或伸展；“要延伸”自然地表达这种地理意义，而不按字面译作人的“出去”。
- source_word: הַגְּבֻל
  choice: 边界
  rationale: גְּבוּל指领土的界线；“边界”符合现代汉语的地理表述。
- source_word: זִפְרֹנָה
  choice: 到西斐仑
  rationale: זִפְרֹן为地名，采用音译；词尾־ָה表示朝向该地，以“到”表达。
- source_word: וְהָיוּ תוֹצְאֹתָיו
  choice: 尽头是
  rationale: 该复数表达在疆界记述中指边界线终止之处。正文采用自然的汉语单数集合说法“尽头”，并以脚注保留原文复数形式的信息。
- source_word: חֲצַר עֵינָן
  choice: 哈萨·以难
  rationale: 地名音译，并用间隔号显示复合名称的两个组成部分。
- source_word: זֶה יִהְיֶה לָכֶם
  choice: 这就是你们……的
  rationale: 该句总结并确认刚才所述界线；“这就是你们……的”在现代汉语中简洁明确。
- source_word: גְּבֻל צָפוֹן
  choice: 北面的边界
  rationale: 该结构指北侧的疆界；“北面的边界”自然且准确。
