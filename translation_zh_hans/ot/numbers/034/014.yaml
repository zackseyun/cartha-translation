  text: כִּ֣י לָקְח֞וּ מַטֵּ֨ה בְנֵ֤י הָ/ראוּבֵנִי֙ לְ/בֵ֣ית אֲבֹתָ֔/ם וּ/מַטֵּ֥ה בְנֵֽי הַ/גָּדִ֖י לְ/בֵ֣ית אֲבֹתָ֑/ם וַ/חֲצִי֙ מַטֵּ֣ה מְנַשֶּׁ֔ה לָקְח֖וּ נַחֲלָתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/014.yaml
  text: For the tribe of the sons of Reuben[a], by their fathers’ houses, and the tribe of the sons of Gad, by their fathers’ houses[c][b], and the half-tribe of Manasseh have taken their inheritance.
translation:
  language: zh_hans
  text: 因为吕便子孙的支派[a]按着宗族[b]，迦得子孙的支派也按着宗族，以及玛拿西的半个支派[c]，都已经取得了他们的产业。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “吕便子孙”也可译作“吕便人”；下文“迦得子孙”同样可译作“迦得人”。
    reason: lexical_alternative
  - marker: b
    text: “宗族”原文直译为“父家”，指支派内部按父系祖先划分的家族或宗族单位。
    reason: cultural_note
  - marker: c
    text: 或译：“玛拿西支派的一半”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，为先前有关分地的说明提供原因，保留希伯来语的因果、解释作用。
- source_word: לָקְחוּ
  choice: 已经取得了
  rationale: 该词为完成式，在此表示这些支派已经取得所分得的土地；“取得”比“领受”更贴近 לקח 的基本动作含义。
- source_word: מַטֵּה
  choice: 支派
  rationale: 在分地语境中指以色列的支派单位，并非字面的“杖”。
- source_word: בְנֵי הָרְאוּבֵנִי / בְנֵי הַגָּדִי
  choice: 吕便子孙／迦得子孙
  rationale: 保留原文的宗族谱系色彩，同时符合现代汉语圣经叙事的自然表达；也可较简洁地译作“吕便人／迦得人”。
- source_word: לְבֵית אֲבֹתָם
  choice: 按着宗族
  rationale: 这里指支派内部以父系祖先为依据的家族、宗族单位；“按着宗族”自然地表达分配所依据的单位。
- source_word: וַחֲצִי מַטֵּה מְנַשֶּׁה
  choice: 玛拿西的半个支派
  rationale: 直接表达玛拿西支派中只有一半在此范围内，保留原文结构而不增添解释。
- source_word: נַחֲלָתָם
  choice: 他们的产业
  rationale: 本节指所分得、可承受的土地；“产业”兼具土地份额和承受所得之意。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“按着宗族”避免生硬直译“按着他们的父家”，脚注则保留其文化背景；“取得产业”保留原文完成动作及土地承受的含义。
