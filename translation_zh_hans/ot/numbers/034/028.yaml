  text: 拿弗他利子孙支派的首领是亚米忽的儿子比大黑。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/לְ/מַטֵּה
  choice: 拿弗他利……的支派
  rationale: מַטֶּה在划分土地的名单语境中指“支派”，而非字面的“杖”；前缀וּלְ在本句承接名单并标明所属对象，汉语可结合句式表达。
- source_word: בְנֵי נַפְתָּלִי
  choice: 拿弗他利众子孙
  rationale: בְנֵי字面为“众子”，在标准支派称谓中泛指拿弗他利的后裔；译作“众子孙”既保留父系支派称谓，又让现代读者明白其群体含义。
- source_word: נָשִׂיא
  choice: 首领
  rationale: 此处指受命代表支派办理分地事务的人；“首领”清楚自然，也避免“王子”所带来的君主制含义。
- source_word: פְּדַהְאֵל
  choice: 比大黑
  rationale: 依照现代中文圣经人名的通行译写处理该专名。
- source_word: בֶּן
  choice: ……的儿子
  rationale: 这是直接的父子称谓和标准父名式表达。
- source_word: עַמִּיהוּד
  choice: 亚米忽
  rationale: 依照现代中文圣经人名的通行译写处理该专名。
