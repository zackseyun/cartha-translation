translation_notes:
  register: 采用现代、庄重且适合名单体裁的简洁表达。希伯来文是省略谓语的名词短语；结合34:17—29的上下文，以“由……负责”补足汉语句法，表达该首领代表本支派参与分地，而不增添身份或神学含义。
