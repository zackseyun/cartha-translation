  text: 耶和华对摩西说：
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: 说
  rationale: 该动词在这一固定引语公式中表示“说、讲话”；中文用“对……说”自然准确。句首的 וַ 在连续叙事中主要承接上下文，无须机械译作“然后”。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代简体中文圣经语境中最通行的神名音译“耶和华”，将专名与“主”等称号区别开来。
- source_word: אֶל מֹשֶׁה
  choice: 对摩西
  rationale: 介词 אֶל 标明言说的对象；“对摩西”是自然、清楚的现代汉语表达。
- source_word: לֵאמֹר
  choice: 说：
  rationale: 这是引出后续直接话语的固定公式。汉语以“说：”及冒号表达其功能，避免冗余的“说道”。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用四字神名，而非“主”这一称号。正文保留专名，并采用普通中文读者最熟悉、最易识别的传统音译“耶和华”；“雅威”更接近常见学术重构的读音，但尚非中文通行形式。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。保留本节作为后续神谕引言的功能，以冒号收束。
