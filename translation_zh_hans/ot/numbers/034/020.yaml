  text: 西缅子孙支派的首领是亚米忽的儿子示母利。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/לְ/מַטֵּה
  choice: ……支派的代表是
  rationale: מַטֶּה在此行政分地名单中指支派；结合上下文补出“代表”，使省略式名单在现代汉语中自然清楚。前缀וּ与לְ的关系由整句结构体现，不机械译作“并且给”。
- source_word: בְּנֵי שִׁמְעוֹן
  choice: 西缅子孙
  rationale: 保留בְּנֵי“众子／子孙”的族裔含义；“西缅子孙支派”符合现代中文圣经语体，也明确这是以西缅后裔构成的支派。
- source_word: שְׁמוּאֵל
  choice: 示母利
  rationale: 采用中文圣经中此人的惯用译名，并以音译处理希伯来人名；不套用先知撒母耳的通行名，以避免把不同人物混同。
- source_word: בֶּן
  choice: ……的儿子
  rationale: 在这份首领名单中按直接父子关系表达，准确反映谱系标记。
- source_word: עַמִּיהוּד
  choice: 亚米忽
  rationale: 采用该希伯来人名在中文圣经中的惯用音译。
