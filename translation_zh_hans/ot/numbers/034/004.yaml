base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/004.yaml
  text: Then the border shall turn for you from the south of the Ascent of Akrabbim[a], and cross to Zin; and its end shall be south of Kadesh-barnea; then it shall go out to Hazar-addar and cross to Azmon.
translation:
  language: zh_hans
  text: 你们的边界要从亚克拉滨坡[a]南边转向，经过寻；边界的终点要在加低斯·巴尼亚南边；然后延伸到哈萨·亚达，再经过押们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “亚克拉滨”可能意为“蝎子”；这个地名也可译作“蝎子坡”或“蝎子隘口”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָסַב לָכֶם הַגְּבוּל
  choice: 你们的边界要……转向
  rationale: נָסַב在划界语境中表示边界转弯或改变走向；保留לָכֶם所表达的“你们的”。
- source_word: מִנֶּגֶב לְמַעֲלֵה עַקְרַבִּים
  choice: 从亚克拉滨坡南边
  rationale: מִנֶּגֶב表示位于该地标南侧；מַעֲלֵה指上坡、坡道，עַקְרַבִּים作为地名音译，并在脚注说明其词义。
- source_word: וְעָבַר צִנָה
  choice: 经过寻
  rationale: עָבַר在边界行程中表示边界经过某地；方向词尾表明朝向“寻”，中文用“经过寻”自然表达其线路走向。
- source_word: וְהָיָה תּוֹצְאֹתָיו
  choice: 边界的终点要在
  rationale: תּוֹצְאוֹתָיו虽为形态复数，但在划界文本中可指边界的尽头或终止处；中文以集合性的单数“终点”表达更自然。
- source_word: מִנֶּגֶב לְקָדֵשׁ בַּרְנֵעַ
  choice: 在加低斯·巴尼亚南边
  rationale: 此处说明边界终点相对于加低斯·巴尼亚的位置，即其南侧，而非仅表示朝向该城。
- source_word: וְיָצָא חֲצַר אַדָּר
  choice: 然后延伸到哈萨·亚达
  rationale: יָצָא在边界描述中指界线继续伸展至下一地点；“延伸到”比直译“出去到”更符合现代汉语。
- source_word: וְעָבַר עַצְמֹנָה
  choice: 再经过押们
  rationale: 延续边界路线的叙述；עַצְמֹנָה带方向词尾，中文以“经过押们”表达。
theological_decisions: []
