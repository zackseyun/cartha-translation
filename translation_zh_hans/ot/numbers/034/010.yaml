base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/010.yaml
  text: And you shall mark out for yourselves the eastern border from Hazar-enan to Shepham[a].
translation:
  language: zh_hans
  text: 你们要为自己划定东边的边界，从哈萨·以难直到示番。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “划定”也可译作“勾画”或“标出”。这里的希伯来语动词较少见，在本段语境中指划出边界线。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִתְאַוִּיתֶם
  choice: 要……划定
  rationale: 此动词在划界语境中指勾画、标定边界线；“划定”符合现代汉语的法律地理语体，也避免按该词根在其他语境中的常见义误译为“渴望”。
- source_word: לָכֶם
  choice: 为自己
  rationale: 保留与格代词的受益兼反身意味，表明以色列人是为自己所承受的土地划界。
- source_word: לִגְבוּל קֵדְמָה
  choice: 东边的边界
  rationale: גְבוּל 指领土界线，קֵדְמָה 在此指东面；合译为“东边的边界”自然清楚。
- source_word: מֵחֲצַר עֵינָן
  choice: 从哈萨·以难
  rationale: 按地名音译，并以“从”明确这段边界的起点。
- source_word: שְׁפָמָה
  choice: 直到示番
  rationale: 地名音译；原文方向词尾在此与起点短语共同表示划界所至，译为“直到”清楚呈现终点。
theological_decisions: []
