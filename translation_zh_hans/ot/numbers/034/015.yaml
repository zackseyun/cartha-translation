base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/015.yaml
  text: The two tribes and the half-tribe have taken their inheritance beyond the Jordan at Jericho[a], eastward[b], toward the sunrise.
translation:
  language: zh_hans
  text: 两个支派和半个支派已经取得了自己的产业，在耶利哥对面的约旦河东岸，向东，朝日出之处[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在耶利哥对面的约旦河另一边”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文为“向东，朝日出之处”，以两个相近的表达强调东方。
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁנֵי הַמַּטּוֹת
  choice: 这两个支派
  rationale: מַטֶּה本义可指杖，但在分地语境中惯指“支派”；加指示成分“这”使本节承接上文更自然。
- source_word: וַחֲצִי הַמַּטֶּה
  choice: 和那半个支派
  rationale: 这里指玛拿西半支派这一公认的分地单位；“那半个支派”既自然，也保留原文的定指。
- source_word: לָקְחוּ
  choice: 已经……取得了
  rationale: Qal完成式表示已经完成的行动；“取得”比“领受”更贴近לקח，同时“已经……了”清楚表达完成性。
- source_word: נַחֲלָתָם
  choice: 自己的产业
  rationale: נַחֲלָה在土地分配语境中指承受所得的地业；“产业”保留承受之地的含义，又符合现代中文圣经语域。
- source_word: מֵעֵבֶר לְיַרְדֵּן
  choice: 约旦河对岸
  rationale: 该短语指从叙述视角所看的约旦河另一边；“对岸”简洁自然，并保留视角关系。
- source_word: יְרֵחוֹ
  choice: 耶利哥附近
  rationale: 地名在此作方位限定，指约旦河靠耶利哥的一带；“附近”避免误解为产业位于耶利哥城内。
- source_word: קֵדְמָה
  choice: 向东
  rationale: 带方向词尾的形式表示朝东的方向；“向东”准确保留其方向性。
- source_word: מִזְרָחָה
  choice: 日出的方向
  rationale: 该词指东方，并带有太阳升起之处的词源意象；单独译出可保留与קֵדְמָה构成的强调性复表达。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“产业”延续土地承受语境中的传统用语；“向东，就是日出的方向”有意保留希伯来文的重复强调，而不将其压缩为单一方位词。
