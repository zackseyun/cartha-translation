  yaml_path: translation/ot/numbers/034/018.yaml
  text: And you shall take one leader from each tribe to inherit the land[a].
translation:
  language: zh_hans
  text: 你们要从每个支派选一位首领，来承受那地。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“为使那地成为产业”，即“把那地分配为产业”。原文动词通常可指承受产业；结合本段分地的语境，也可理解为使人得产业或分配为产业。
    reason: lexical_alternative
lexical_decisions:
- source_word: נָשִׂיא
  choice: 首领
  rationale: 指获正式认可的领袖；在按支派分地的行政语境中，“首领”自然准确，也不带“王子”的王室含义。
- source_word: אֶחָד נָשִׂיא אֶחָד מִמַּטֶּה
  choice: 从每个支派中选出一位首领
  rationale: 原文重复“一位”，强调每个支派各有一名代表；汉语用“每个……一位”自然表达其分配意义。
- source_word: מִמַּטֶּה
  choice: 从每个支派中
  rationale: מַטֶּה本可指“杖”，但在此支派行政语境中指“支派”。
- source_word: תִּקְחוּ
  choice: 你们要……选出
  rationale: 未完成式在此具有指令语气；“要……选出”既保留命令力度，也符合现代汉语。
- source_word: לִנְחֹל
  choice: 让他们分配……作为产业
  rationale: 结合34:17及后续列名首领协助分地的语境，此不定式宜理解为使土地成为产业、把土地分给各支派，而非这些首领亲自承受整片土地；同时以脚注保留“承受”的词义可能。
- source_word: הָאָרֶץ
  choice: 那地
  rationale: 指上下文中特定的迦南地；“那地”比泛指的“土地”更贴合篇章指称。
theological_decisions:
- issue: לִנְחֹל表示领受产业还是使人得产业／分配产业
  choice: 正文采用使役性的“分配那地作为产业”
  alternative: “承受那地”
  rationale: 该词形在此可能引出继承／产业领域中的不同理解。紧接34:17的“给你们分地为业”以及这些首领的行政职责，较支持使役、分配之义；脚注保留较直接的“承受”译法，避免消除原文张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“首领”“支派”“产业”延续民数记土地分配语境中的核心术语；用“选出”表达按代表资格取用某人的意思。
