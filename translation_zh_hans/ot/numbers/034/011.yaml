  yaml_path: translation/ot/numbers/034/011.yaml
  text: Then the border shall go down from Shepham to Riblah[a], on the east side of Ain[b]; and the border shall go down and reach the slope of the Sea of Kinnereth on the east.
translation:
  language: zh_hans
  text: 边界要从示番下到亚延以东的利比拉[a]；边界又要下到基尼烈海东面的山坡[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“亚延东边的利比拉”。希伯来语字面为“从亚延的东面”，在此表示利比拉位于亚延以东。
    reason: lexical_alternative
  - marker: b
    text: “山坡”直译为“肩”；这里是地理用语，可指海边的侧面、坡地或岸边地带。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָרַד
  choice: 下到／往下
  rationale: ירד的基本义是“下去、下降”；在划界叙述中表示边界沿地势向下延伸。中文按上下文分别译为“下到”和“往下”，既保留方向感，也避免生硬重复。
- source_word: הַגְּבֻל / הַגְּבוּל
  choice: 边界
  rationale: גְּבוּל指领土的界线；“边界”符合现代汉语的地理与法律描述。
- source_word: מִשְּׁפָם
  choice: 从示番
  rationale: 地名按通行的中文圣经音译处理。
- source_word: הָרִבְלָה
  choice: 到利比拉
  rationale: 视为目的地地名；希伯来语形式中的冠词不另行译出，方向关系用“到”表达。
- source_word: מִקֶּדֶם לָעָיִן
  choice: 就是亚延东边
  rationale: 该短语表明利比拉相对于亚延的位置。“东边”自然明确；“就是”将位置说明与前一地名连接起来，但不消除原文短语在表达上的简略性。
- source_word: וּמָחָה
  choice: 抵达
  rationale: מחה在此划界语境中表示边界触及某一地形。“抵达”传达接触、到达之意，比直译“击打”更符合现代汉语。
- source_word: עַל כֶּתֶף
  choice: 山坡
  rationale: כֶּתֶף本义为“肩”，用于地理描述时可指侧面、山脊或坡地。正文译作“山坡”以表达地形含义，脚注保留字面形象及其他可能理解。
- source_word: יָם כִּנֶּרֶת
  choice: 基尼烈海
  rationale: 保留希伯来地名，不以较晚的“加利利海”替代。
- source_word: קֵדְמָה
  choice: 东面的
  rationale: 该方向副词指出所触及地形位于基尼烈海东面；置于“山坡”之前符合自然汉语语序。
theological_decisions: []
translation_notes:
  register: 采用庄重、清楚的现代标准汉语，保留古代划界文书的方向推进感。地名使用简体中文圣经中常见的音译；对“肩”这一不透明的地理隐喻在正文中作适度意译，并以脚注保存原文形象和语义范围。
