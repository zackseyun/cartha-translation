  text: אֵ֚לֶּה שְׁמ֣וֹת הָֽ/אֲנָשִׁ֔ים אֲשֶׁר יִנְחֲל֥וּ לָ/כֶ֖ם אֶת הָ/אָ֑רֶץ אֶלְעָזָר֙ הַ/כֹּהֵ֔ן וִ/יהוֹשֻׁ֖עַ בִּן נֽוּן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/017.yaml
  text: 'These are the names of the men who shall assign the land to you as an inheritance: Eleazar the priest and Joshua son of Nun[a].'
translation:
  language: zh_hans
  text: 以下是要把那地分给你们作产业的男子的名字：祭司以利亚撒和嫩的儿子约书亚。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“使你们承受那地为业。”希伯来语动词含有使人承受产业或把产业分配给人的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה שְׁמוֹת הָאֲנָשִׁים
  choice: 以下是……男子的名字
  rationale: 希伯来语以指示词引出一组特定男性领袖的姓名；用“以下是”符合现代汉语列举方式，“男子”保留原文明确的男性复数含义。
- source_word: אֲשֶׁר
  choice: 要……的
  rationale: 用现代汉语定语结构表达限定这些男子职责的关系从句。
- source_word: יִנְחֲלוּ לָכֶם אֶת הָאָרֶץ
  choice: 要把那地分给你们作产业
  rationale: נחל的使役式在此指这些领袖负责分配土地，使以色列人承受为业；“分给……作产业”兼顾行政分配和产业继承两层意义。
- source_word: אֶלְעָזָר הַכֹּהֵן
  choice: 祭司以利亚撒
  rationale: 采用现代中文圣经人名惯用译法，并以自然汉语次序表达职衔。
- source_word: וִיהוֹשֻׁעַ בִּן נוּן
  choice: 和嫩的儿子约书亚
  rationale: 采用现代中文圣经人名惯用译法，并完整保留父子关系。
