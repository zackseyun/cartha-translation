  text: From Mount Hor you shall mark out the border to Lebo-hamath[a], and the end points of the border shall be at Zedad.
translation:
  language: zh_hans
  text: 从何珥山起，你们要划定边界，直到哈马口[a]；边界的终点要在西达。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译“哈马的入口”；这里很可能是固定地名“哈马口”。
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵהֹר הָהָר
  choice: 从何珥山起
  rationale: 该结构是地名“何珥山”，前缀 מִן 表示起点；加“起”自然表达边界由此开始。
- source_word: תְּתָאוּ
  choice: 你们要划定
  rationale: 此动词在勘定疆界的语境中指划出、标定界线；“划定”兼顾动作和法律地理含义。
- source_word: לְבֹא חֲמָת
  choice: 直到哈马口
  rationale: 字面为“到哈马的入口”，但很可能是固定地名。正文采用现代中文圣经地名中较自然的“哈马口”，并以脚注保留字面意义与地名性质。
- source_word: וְהָיוּ
  choice: 要在
  rationale: 在法规式边界描述中表达后续规定；与“终点”及地点搭配时，中文用“要在”自然简洁。
- source_word: תּוֹצְאֹת הַגְּבֻל
  choice: 边界的终点
  rationale: 该名词在疆界清单中表示边界延伸所到的末端或界限；此处用单数集合表达“终点”符合现代中文习惯。
- source_word: צְדָדָה
  choice: 在西达
  rationale: 词尾方向形式在此标示边界所到之处；结合谓语“要在”，译为“在西达”自然地表达终点位置。
