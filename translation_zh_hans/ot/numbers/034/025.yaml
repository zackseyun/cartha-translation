  text: 西布伦子孙的支派，首领是帕纳的儿子以利撒番。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/לְ/מַטֵּה
  choice: ……支派的
  rationale: מַטֶּה在分配土地和列举各支派代表的语境中指“支派”；前缀וּ和לְ承接名单并标明所属关系。现代汉语中不必机械译出句首“并且/为”，用“……支派的”自然表达。
- source_word: בְנֵי זְבוּלֻן
  choice: 西布伦子孙
  rationale: בְנֵי字面为“众子”，在这里泛指西布伦的后裔；译作“子孙”既保留族谱性表达，也符合现代汉语的群体称谓。
- source_word: נָשִׂיא
  choice: 首领
  rationale: נָשִׂיא指受认可的支派领袖或代表；“首领”比“王子”更符合此处行政性名单的语境。
- source_word: אֱלִיצָפָן
  choice: 以利撒番
  rationale: 按中文圣经人名的通行音译处理。
- source_word: בֶּן פַּרְנָךְ
  choice: 帕纳的儿子
  rationale: בֶּן是标准的父子谱系标记；用现代汉语自然表达为“帕纳的儿子”。
