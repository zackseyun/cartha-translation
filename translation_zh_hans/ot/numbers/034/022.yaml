  language: zh_hans
  text: 但支派[a]：首领是约利的儿子布基。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“但的子孙”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/מַטֵּה
  choice: 但支派
  rationale: מַטֶּה在《民数记》分地的语境中指“支派”，不是字面的“杖”。前缀וּלְ承接名单并引出该支派；中文以名单式结构和冒号自然表达。
- source_word: בְנֵי דָן
  choice: 但支派[a]
  rationale: בְנֵי דָן字面是“但的子孙”，在此作为支派名称的一部分。正文采用现代汉语惯用的“但支派”，脚注保留其字面亲属表达。
- source_word: נָשִׂיא
  choice: 首领
  rationale: 此词在本章指受命代表支派办理分地事务的人；“首领”既准确又符合庄重的现代汉语。
- source_word: בֻּקִּי
  choice: 布基
  rationale: 按希伯来语人名בֻּקִּי音译，并采用汉语圣经中清楚自然的人名形式。
- source_word: בֶּן
  choice: 儿子
  rationale: 这是直接的父子身份表达，在人名谱系结构中译作“儿子”最自然。
- source_word: יָגְלִי
  choice: 约利
  rationale: 按希伯来语人名יָגְלִי音译；词首辅音按汉语圣经人名的通行形式处理。
