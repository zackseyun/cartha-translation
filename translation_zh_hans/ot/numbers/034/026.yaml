  yaml_path: translation/ot/numbers/034/026.yaml
  text: 'And for the tribe of the sons of Issachar, a leader: Paltiel son of Azzan.'
translation:
  language: zh_hans
  text: 以萨迦子孙支派的首领是押散的儿子帕铁。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/לְ/מַטֵּה
  choice: ……支派的
  rationale: מַטֶּה在分地名单的语境中指“支派”；前缀וּ和לְ承接名单并引出该支派所指派的人。中文不必机械译出“并为”，以所属结构自然表达。
- source_word: בְנֵי יִשָׂשכָר
  choice: 以萨迦子孙
  rationale: בְנֵי直译为“众子”，但在支派称谓中指以萨迦的后裔；“子孙”既保留父系支派称谓，也符合现代中文圣经语体。
- source_word: נָשִׂיא
  choice: 首领
  rationale: 此词在本章指代表支派办理分地事务的人；“首领”准确、庄重，也不会像“王子”那样误示王室身份。
- source_word: פַּלְטִיאֵל
  choice: 帕铁
  rationale: 按现代汉语圣经人名惯例音译；该名在本节作为以萨迦支派首领之名。
- source_word: בֶּן
  choice: ……的儿子
  rationale: 标准父名结构，直接译作“儿子”。
- source_word: עַזָּן
  choice: 押散
  rationale: 按现代汉语圣经人名惯例音译。
