base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/012.yaml
  text: Then the border shall go down to the Jordan[a], and its end shall be at the Salt Sea[b]. This shall be your land according to its borders all around.
translation:
  language: zh_hans
  text: 边界再向下延伸到约旦河；它的终点[a]是盐海[b]。这要成为你们的土地，按其四周的边界划定。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “终点”原文为复数形式，也可译作“尽头”或“各端点”。在这里指边界线终止之处。
    reason: lexical_alternative
  - marker: b
    text: 原文作“盐海”，就是今天通常所称的死海。
    reason: cultural_note
lexical_decisions:
- source_word: וְיָרַד
  choice: 再下到
  rationale: יָרַד意为“下去、下降”；这里描述边界线的走向。“再”承接前文连续的边界路线，“下到”保留地理移动的意象。
- source_word: הַגְּבוּל
  choice: 边界
  rationale: גְּבוּל在本章指划定领土的界线；“边界”是现代汉语中自然、准确的地理用语。
- source_word: הַיַּרְדֵּנָה
  choice: 到约旦河
  rationale: 词尾־ָה表示方向，意为“朝向、到”；“约旦河”比单称“约旦”更符合现代汉语地名习惯。
- source_word: תוֹצְאֹתָיו
  choice: 其终点
  rationale: 该复数形式在边界记述中指界线的末端或终止处。汉语用单数集合性的“终点”更自然，同时以脚注保留原文复数形式及可能译法。
- source_word: יָם הַמֶּלַח
  choice: 盐海
  rationale: 直译希伯来语地名“盐海”，不以现代通称“死海”取代原文措辞。
- source_word: זֹאת תִּהְיֶה לָכֶם הָאָרֶץ
  choice: 这就是你们的土地
  rationale: 按上下文是对所划领土的总结；“你们的土地”自然表达לָכֶם在此处的归属意义。
- source_word: לִגְבֻלֹתֶיהָ סָבִיב
  choice: 四周以这些边界为界
  rationale: 保留“边界”与“四周”的明示内容，表达这片土地由前述界线从四面围定。
