base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/002.yaml
  text: 'Command the sons of Israel and say to them[a], ‘When you enter the land of Canaan[b], this is the land that will fall to you as an inheritance: the land of Canaan according to its borders.’'
translation:
  language: zh_hans
  text: 你要吩咐以色列人[a]，对他们说：‘你们进入迦南地时，这地必归你们为业[b]；这就是按其疆界所定的迦南地。’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语直译为“以色列的众子”；这里指以色列人。
    reason: lexical_alternative
  - marker: b
    text: “必归你们为业”中“归你们”希伯来语字面为“落给你们”，是指土地被分配给人的习语；也可译作“必分给你们作产业”。
    reason: lexical_alternative
lexical_decisions:
- source_word: צַו
  choice: 吩咐
  rationale: 该命令式动词表示有权威的指令；“吩咐”在现代汉语中庄重自然，也保留了命令的力度。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 希伯来语直译为“以色列的众子”，在这里是全体以色列民的常用称呼；“以色列人”符合现代汉语习惯，脚注保留其字面形式。
- source_word: וְאָמַרְתָּ אֲלֵהֶם
  choice: 对他们说
  rationale: 直接保留连续命令的结构和正式语气。
- source_word: כִּי אַתֶּם בָּאִים אֶל
  choice: 你们进入……时
  rationale: כִּי 在此结合表示将要进入的分词，适合按情境理解为时间关系；此译法自然表达即将发生的入境。
- source_word: הָאָרֶץ כְּנָעַן
  choice: 迦南地
  rationale: 简洁、惯用地表达“那地，即迦南”的同位关系。
- source_word: זֹאת הָאָרֶץ
  choice: 这就是……的地
  rationale: 保留指示词的指定作用，引出随后对领土范围的正式说明。
- source_word: אֲשֶׁר תִּפֹּל לָכֶם
  choice: 要归给你们
  rationale: תִּפֹּל 字面为“落给”，在分地语境中是土地经分配而归属某人的习语；正文采用自然汉语，字面意象在脚注说明。
- source_word: בְּנַחֲלָה
  choice: 作产业
  rationale: נַחֲלָה 指承受而得、长期归属的份地或产业；“作产业”兼顾土地分配的法律语境和经文传统用语。
- source_word: אֶרֶץ כְּנַעַן לִגְבֻלֹתֶיהָ
  choice: 按其疆界划定的迦南地
  rationale: לִגְבֻלֹתֶיהָ 指按照其边界范围；“按其疆界划定”清楚预示下文对四境的具体说明。
theological_decisions: []
