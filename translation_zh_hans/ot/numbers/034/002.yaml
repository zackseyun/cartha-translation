  to: 你要吩咐以色列人[a]，对他们说：‘你们进入迦南地时，这地必归你们为业[b]；这就是按其疆界所定的迦南地。’
  rationale: 修订仅调整两处表达：以“必归你们为业”更直接对应土地将“落给”他们作为产业的宣告；以“按其疆界所定的”避免“划定”所带来的额外动作色彩，同时保留本节引出后文疆界说明的功能。脚注锚点依正文所附词语设置，内容与正文一致。
