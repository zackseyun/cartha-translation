base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/001.yaml
  text: Then Yahweh spoke to Moses[a], saying,
translation:
  language: zh_hans
  text: 耶和华对摩西说[a]：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文为“YHWH”（四字神名）；也可译作“雅威”。
    reason: 说明神名的原文形式及另一常见音译。
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: 说
  rationale: 该叙事性连续式推动行文；在这一固定引语公式中，现代汉语用“说”最自然，无须另加“然后”。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的专名形式呈现四字神名，并用脚注说明其希伯来文字形及另一常见音译。
- source_word: אֶל
  choice: 对
  rationale: 与言说动词搭配时，介词 אֶל 自然译为“对”，标明受话者。
- source_word: מֹשֶׁה
  choice: 摩西
  rationale: 采用该人名约定俗成的现代中文译名。
- source_word: לֵאמֹר
  choice: 说：
  rationale: 该不定词用于引出后续直接话语；中文以“说”加冒号自然保留其引语功能。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。正文采用现代中文最广为人知、且作为专名使用的“耶和华”，不以“主”这一称号替代；脚注保留“雅威”这一较接近学界重构读音的选择。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。省略机械对应英语叙事连接词的“然后”，并以冒号承接下一节的直接话语。
