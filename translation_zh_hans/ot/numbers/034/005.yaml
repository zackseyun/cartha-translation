  yaml_path: translation/ot/numbers/034/005.yaml
  text: Then the border shall turn from Azmon to the Brook of Egypt[b][a], and its end shall be at the sea.
translation:
  language: zh_hans
  text: 边界要从亚斯们转到埃及溪[a]，终点在海边[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“到埃及干河谷”。希伯来语“溪”常指季节性水道或干河谷。
    reason: lexical_alternative
  - marker: b
    text: 直译“它的各终点在海边”。希伯来语用复数形式描述边界所到的尽头。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָסַב
  choice: 要……转向
  rationale: 在划定疆界的语境中，נסב表示边界改变走向；“转向”自然地表达这一含义，“要”则配合本段对边界走向的规定。
- source_word: הַגְּבוּל
  choice: 边界
  rationale: 指领土的界线；“边界”是现代汉语中准确而自然的地理用语。
- source_word: מֵעַצְמוֹן
  choice: 从押们
  rationale: 地名按既有中文圣经传统音译；介词מִן表示边界由此处转向下一地点。
- source_word: נַחְלָה מִצְרָיִם
  choice: 到埃及溪
  rationale: נחל通常指溪流、季节性水道或干河谷，而非尼罗河一类的大河。“埃及溪”简洁易懂，也避免“埃及河”可能造成的误解；地貌上的另一种译法收入脚注。
- source_word: וְהָיוּ תוֹצְאֹתָיו
  choice: 终点在
  rationale: 在边界描述中，תוצאות指界线所到的尽头。希伯来语采用复数形式，但现代汉语用单数“终点”更自然；原文形式另见脚注。
- source_word: הַיָּמָּה
  choice: 海边
  rationale: 方向词形表示“向海／到海”。此处描述边界的终点，译作“在海边”符合汉语表达；不在正文中补明“地中海”，因为原文只说“海”。
