  text: 'For the sons of Joseph[a], for the tribe of the sons of Manasseh: a leader, Hanniel son of Ephod.'
translation:
  language: zh_hans
  text: 约瑟子孙[a]中，玛拿西子孙支派的首领是以弗的儿子汉聂。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语直译“约瑟的儿子们……玛拿西的儿子们”；在支派谱系用语中，指他们的子孙后裔。
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי יוֹסֵף
  choice: 约瑟子孙中
  rationale: בְּנֵי直译为“儿子们”，但在支派谱系语境中泛指后裔；译作“子孙”既自然，也保留群体的谱系含义。前缀לְ在这份名单的汉语句式中以“中”表达所属范围。
- source_word: לְמַטֵּה
  choice: 支派的
  rationale: מַטֶּה本可指“杖”，但在土地分配和支派行政语境中是“支派”的惯用义；לְ所表达的归属关系由“的”承载。
- source_word: בְנֵי מְנַשֶּׁה
  choice: 玛拿西子孙
  rationale: 这里同样是支派谱系用语，译为“子孙”比字面的“儿子们”更符合现代汉语，同时不改变其后裔群体之义。
- source_word: נָשִׂיא
  choice: 首领
  rationale: 此词在行政名单中指支派的代表或领袖；“首领”清楚表达其正式地位，又不带“王子”的王室含义。
- source_word: חַנִּיאֵל
  choice: 哈尼业
  rationale: 按希伯来语人名音译，并采用现代中文圣经人名的常见形式。
- source_word: בֶּן אֵפֹד
  choice: 以弗的儿子
  rationale: 标准父系称谓结构。אֵפֹד在这里是人名，不是祭司礼服，故按人名音译为“以弗”。
