  yaml_path: translation/ot/numbers/034/024.yaml
  text: 'And for the tribe of the sons of Ephraim[a], a leader: Kemuel son of Shiphtan.'
translation:
  language: zh_hans
  text: 至于以法莲子孙的支派[a]，首领是示弗但的儿子基母利。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译“以法莲子孙的支派”；指以法莲支派的成员或后裔。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/מַטֵּה
  choice: 支派
  rationale: מַטֶּה本义可指“杖”，但在分配土地的支派名单中惯指“支派”；介词לְ在这一省略式名单中用中文话题结构自然表达。
- source_word: בְנֵי אֶפְרַיִם
  choice: 以法莲子孙
  rationale: 保留בְנֵי“儿子们／子孙”的亲属与后裔表达；此处指以法莲的后裔，即该支派成员。
- source_word: נָשִׂיא
  choice: 首领
  rationale: 在本段指受命代表支派的人；“首领”符合行政名单语境，又避免“王子”的王室含义。
- source_word: קְמוּאֵל
  choice: 基母利
  rationale: 按现代中文圣经人名的通行形式音译该专名。
- source_word: בֶּן
  choice: ……的儿子
  rationale: 按希伯来语父名结构直译，并调整为自然的中文姓名语序。
- source_word: שִׁפְטָן
  choice: 示弗但
  rationale: 按现代中文圣经人名的通行形式音译该专名。
