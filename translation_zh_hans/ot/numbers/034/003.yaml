base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/003.yaml
  text: Your southern side shall be from the wilderness of Zin along the side of Edom[b][a], and your southern border shall be from the end of the Salt Sea eastward.
translation:
  language: zh_hans
  text: 你们南面的区域要从寻旷野起，沿着以东一带；你们南边的边界要从盐海[a]的尽头[b]向东延伸。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 传统上称“死海”；希伯来文作“盐海”。
    reason: lexical_alternative
  - marker: b
    text: “尽头”也可译作“末端”或“边缘”。
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּאַת נֶגֶב
  choice: 南面的地域
  rationale: פֵּאָה在疆界描述中指一片领土的侧面或边缘；译作“南面的地域”既保留空间含义，也避免误解为几何上的“角”。נֶגֶב在此作方向词，译为“南面”，而非专名“南地”。
- source_word: מִמִּדְבַּר צִן
  choice: 从寻旷野……起
  rationale: מִדְבָּר译作传统而自然的地理用语“旷野”；צִן按通行圣经地名译作“寻”。介词מִן表示起点，以“从……起”表达。
- source_word: עַל יְדֵי אֱדוֹם
  choice: 靠近以东的一带
  rationale: 该地理习语表示在以东旁边、与以东相邻；此译保留邻接关系，而不擅自将其明确为正式国界线。
- source_word: גְּבוּל נֶגֶב
  choice: 南边的边界
  rationale: גְּבוּל指领土边界；“南边的边界”准确表达其疆界语境，并与前半句的“南面的地域”有所区分。
- source_word: מִקְצֵה יָם הַמֶּלַח
  choice: 从盐海的尽头
  rationale: קָצֶה可指末端、极处或边缘；正文采用自然的“尽头”，并用脚注保留词义范围。יָם הַמֶּלַח按希伯来文地名直译为“盐海”。
- source_word: קֵדְמָה
  choice: 向东
  rationale: 该方向副词表示朝东或在东面；正文用简洁的“向东”，不额外补入希伯来文没有的路线动词。
- source_word: וְהָיָה לָכֶם ... וְהָיָה לָכֶם
  choice: 要……；要……
  rationale: 重复结构是在规定疆界；中文以两个“要”保留其法定、说明性的语气，同时避免生硬照搬“成为你们的”。
