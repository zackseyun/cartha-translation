  yaml_path: translation/ot/numbers/034/019.yaml
  text: 'And these are the names of the men: for the tribe of Judah, Caleb son of Jephunneh.'
translation:
  language: zh_hans
  text: 这些人的名字如下：犹大支派的是耶孚尼的儿子迦勒。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: 这些……如下
  rationale: וְ承接上文，אֵלֶּה引出下列人名。中文用“这些……如下”自然表达名单的引介功能；本节紧接上文，故不必机械译出“和”。
- source_word: שְׁמוֹת הָאֲנָשִׁים
  choice: 这些人的名字
  rationale: שְׁמוֹת为构造形，与הָאֲנָשִׁים组成“这些人的名字”；אֲנָשִׁים在此指获委任的男性代表，用“人”在中文语境中既准确又自然。
- source_word: לְמַטֵּה יְהוּדָה
  choice: 犹大支派的是
  rationale: מַטֶּה在分地语境中指“支派”，לְ表示所属或代表关系；“犹大支派的是”自然引出该支派的代表。
- source_word: כָּלֵב
  choice: 迦勒
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: בֶּן יְפֻנֶּה
  choice: 耶孚尼的儿子
  rationale: בֶּן表示父子关系；按现代中文自然语序译作“耶孚尼的儿子”。“耶孚尼”为通行音译。
