  naturalness: 整体语句通顺，但“按着……服役需要”略显生硬；改为“按照他们所承担的职务”更自然、准确。将行政关系前置为“在……监管下”也更符合现代汉语。
  terminology: “米拉利的子孙”“祭司”“以他玛”均可。以他玛在此应明确为“亚伦的儿子、祭司”，以对应原文的同位语结构，避免把“祭司”误连为只修饰亚伦。
