  text: וְ/אֵ֣ת אַרְבַּ֣ע הָ/עֲגָלֹ֗ת וְ/אֵת֙ שְׁמֹנַ֣ת הַ/בָּקָ֔ר נָתַ֖ן לִ/בְנֵ֣י מְרָרִ֑י כְּ/פִי֙ עֲבֹ֣דָתָ֔/ם בְּ/יַד֙ אִֽיתָמָ֔ר בֶּֽן אַהֲרֹ֖ן הַ/כֹּהֵֽן׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/008.yaml
  text: And he gave the four carts and the eight oxen to the sons of Merari[a], according to their service[b], under the direction of Ithamar son of Aaron the priest.
translation:
  language: zh_hans
  text: 他把四辆车和八头牛给了米拉利的子孙，按照他们所承担的职务，在亚伦的儿子、祭司以他玛的监管下。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָעֲגָלֹת
  choice: 车
  rationale: עֲגָלָה指有轮的运输车辆；上下文已说明由牛牵引，译作“车”自然简明。
- source_word: הַבָּקָר
  choice: 牛
  rationale: בָּקָר可泛指牛群或牛；这里是用来拉车的牲畜，数量明确，译作“八头牛”准确自然，且不额外断定性别或阉割状况。
- source_word: נָתַן
  choice: 给了
  rationale: 保留动词“给”的基本意义；虽然语境涉及正式分配，但原词本身不必译成更具解释性的“分派”。
- source_word: לִבְנֵי מְרָרִי
  choice: 给了米拉利的子孙
  rationale: 忠实保留希伯来语“米拉利的众子”这一家族、支派式表达，同时符合现代汉语习惯。
- source_word: כְּפִי עֲבֹדָתָם
  choice: 按着他们的服役需要
  rationale: כְּפִי是“按照、与……相称”，עֲבֹדָה在此指会幕运输方面的职务或服役；补出“需要”自然表达所给车辆牲畜与其任务相称的语境含义。
- source_word: בְּיַד אִיתָמָר
  choice: 交由……以他玛管理
  rationale: 该短语字面为“在以他玛手下/借以他玛的手”，行政语境中表示经手、负责或监督；“交由……管理”清楚传达其功能而不拘泥于字面。
- source_word: הַכֹּהֵן
  choice: 祭司
  rationale: 在“祭司亚伦”中保留亚伦的正式身份称谓，符合原文定冠结构的指认作用。
theological_decisions:
- issue: בְּיַד所表达的是直接代理还是监督管理
  choice: 交由以他玛管理
  alternative: 经以他玛的手
  rationale: 上下文是利未人会幕职务与运输资源的安排，管理或监督义最合适；译文不进一步规定其具体行政方式。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“服役”保留利未人在会幕中的职务色彩；“管理”自然转达希伯来语“在……手下”的行政习语。原文无须以脚注保存的重大歧义，因此不设脚注。
