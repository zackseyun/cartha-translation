  rationale: 修订保留“给”“米拉利的子孙”“四辆车和八头牛”等原文基本表达；以“按照他们所承担的职务”准确传达כְּפִי עֲבֹדָתָם，未添加“需要”。“在……监管下”以自然现代汉语表达בְּיַד的行政性经手/监督含义，同时不将其限定为唯一具体行政模式。
