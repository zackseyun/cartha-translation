base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/083.yaml
  text: 'And for the sacrifice of peace offerings: two cattle[a], five rams, five male goats, and five male lambs a year old. This was the offering of Ahira son of Enan.'
translation:
  language: zh_hans
  text: 作平安祭所献的祭牲是：两头牛、五只公绵羊、五只公山羊、五只一岁的公羊羔。这就是亚希拉，以南的儿子，所献的供物。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/לְ/זֶבַח הַשְּׁלָמִים
  choice: 作平安祭的牲畜是
  rationale: 前缀 וּלְ 承接献物清单，זֶבַח הַשְּׁלָמִים 是固定祭祀用语。译成“作平安祭的牲畜是”既保留“祭牲”的含义，也自然引出后面的数目清单。
- source_word: בָּקָר שְׁנַיִם
  choice: 两头牛
  rationale: בָּקָר 是牛类的集合名词，原文在此没有限定性别；“两头牛”准确且符合现代汉语量词习惯。
- source_word: אֵילִם חֲמִשָּׁה
  choice: 五只公绵羊
  rationale: אֵילִם 专指雄性的绵羊；“公绵羊”比单说“羊”更精确，也比生僻或含混的称呼更易懂。
- source_word: עַתֻּדִים חֲמִשָּׁה
  choice: 五只公山羊
  rationale: עַתֻּדִים 指雄性山羊，译文明确保留其性别和种类。
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה חֲמִשָּׁה
  choice: 五只一岁的公羊羔
  rationale: כְּבָשִׂים 在此为阳性复数，בְּנֵי שָׁנָה 表示一岁；“一岁的公羊羔”同时表达年龄与性别。
- source_word: זֶה קָרְבַּן
  choice: 这就是……所献的供物
  rationale: 这是重复段落结尾的确认公式。“供物”适合 קָרְבַּן 的概括性含义，又避免与本节特定的“平安祭”混同。
- source_word: אֲחִירַע בֶּן עֵינָן
  choice: 亚希拉〔以南的儿子〕
  rationale: 人名按现代中文圣经常见形式音译；父子关系采用自然汉语表达，并用插入结构保持结尾公式清楚。
theological_decisions:
- issue: הַשְּׁלָמִים 的祭祀名称
  choice: 平安祭
  alternative: 团契祭；福祉祭
  rationale: 该词的确切词源色彩可涉及平安、完整或共享团契，但在中文圣经传统中“平安祭”是清楚且广为识别的祭名；正文不额外限定其神学功能。
translation_notes:
  register: 采用庄重而自然的现代标准汉语，保留祭物清单的简洁节奏。牛的性别未被原文限定，因此不译作“公牛”；其余牲畜按原词所表达的雄性明确翻译。
