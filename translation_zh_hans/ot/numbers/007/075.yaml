translation:
  language: zh_hans
  text: 一头公牛，一只公绵羊，一只一岁的公羊羔，作燔祭；
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פַּר אֶחָד בֶּן בָּקָר
  choice: 一头公牛犊
  rationale: פַּר指公牛或幼公牛，בֶּן בָּקָר在此属于祭牲清单中的惯用限定语。合译为“一头公牛犊”，既自然表达牛类祭牲，也避免生硬直译为“牛群之子”；量词用“头”。
- source_word: אַיִל אֶחָד
  choice: 一只公绵羊
  rationale: אַיִל是成年的雄性绵羊。译作“公绵羊”比单说“公羊”更明确，也与下一项羊羔相区分。
- source_word: כֶּבֶשׂ אֶחָד
  choice: 一只公羊羔
  rationale: כֶּבֶשׂ指羊羔，在祭牲语境中为雄性；“公羊羔”清楚保留其性别与幼龄类别。
- source_word: בֶּן שְׁנָתוֹ
  choice: 一岁的
  rationale: 该希伯来语习语表示处于第一年或一岁龄。正文采用自然简洁的“一岁的”。
- source_word: לְעֹלָה
  choice: 作燔祭
  rationale: עֹלָה是整只焚烧献上的祭；“燔祭”是准确而通行的中文圣经术语，介词לְ译为“作”。
- source_word: אֶחָד
  choice: 一头／一只
  rationale: 原文在每种祭牲后重复数词“一”，译文逐项保留，并按现代汉语分别配以恰当量词。
