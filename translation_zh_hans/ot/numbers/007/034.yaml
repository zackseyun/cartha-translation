lexical_decisions:
- source_word: שְׂעִיר עִזִּים
  choice: 公山羊
  rationale: 该组合字面为“山羊中的多毛者”，是指雄性山羊的希伯来语惯用表达。“公山羊”符合现代汉语习惯，也保留祭牲的性别信息。
- source_word: אֶחָד
  choice: 一只
  rationale: 明确保留数词，并用量词“只”使汉语自然，同时维持民数记第7章逐项列举的格式。
- source_word: לְחַטָּאת
  choice: 作赎罪祭
  rationale: 在祭祀清单中，חַטָּאת指祭物类别“赎罪祭”，而非抽象的“罪”；介词לְ在此自然译为“作”。
theological_decisions:
- issue: 祭祀语境中חַטָּאת的译法
  choice: 赎罪祭
  alternative: 罪；为罪
  rationale: 上下文列举各支派首领献上的祭物，因此该词在此表示祭祀类别。译作“赎罪祭”准确反映祭司传统术语，同时不额外引入后期神学解释。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文；保留清单式的简洁结构及原文明确的数量信息。
