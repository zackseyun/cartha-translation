lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的专名形式表达神的四字圣名，区别于一般称谓“主”。
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: 按希伯来叙事常用句式自然译出；句首的 וַ 在上下文中承担叙事推进功能，中文无需机械译作“然后”。
- source_word: לֵאמֹר
  choice: 说：
  rationale: 该引语引介式在中文中用冒号自然体现，避免重复成“说……说”，并明确下文为直接话语。
theological_decisions:
- issue: 神圣名号 יְהוָה 的译法
  choice: 耶和华
  alternative: 上主／主
  rationale: 原文使用专有圣名而非 אֲדֹנָי；译作“耶和华”可保留这一词汇区别，不额外导入特定神学解释。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。以“对摩西说：”承载希伯来语 אֶל־מֹשֶׁה לֵאמֹר 的引语引介功能，简洁衔接下一节内容。
