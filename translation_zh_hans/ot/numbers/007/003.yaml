base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/003.yaml
  text: 'And they brought their offering before Yahweh: six covered carts and twelve oxen[a], a cart for every two leaders and an ox for each one; and they presented them before the tabernacle.'
translation:
  language: zh_hans
  text: 他们把供物带到雅威面前：六辆有篷的车[a]和十二头牛；每两位首领一辆车，每位首领一头牛。他们把这些呈在会幕前。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “有篷的车”：希伯来语短语的确切含义不明，传统上理解为有遮盖或篷顶的运输车。
    reason: lexical_alternative
lexical_decisions:
- source_word: קָרְבָּנָם
  choice: 供物
  rationale: 该词在礼仪语境中指带到上帝面前献上的礼物或供献；“供物”自然、庄重，也不把这些车辆和牛误说成宰杀的祭牲。
- source_word: לִפְנֵי יְהוָה
  choice: 到雅威面前
  rationale: 保留“在……面前”的空间及关系含义，并将神名 יהוה 音译为“雅威”。
- source_word: עֶגְלֹת צָב
  choice: 有篷的车
  rationale: עגלות 指运输车辆；罕见修饰语 צב 传统上理解为有遮盖或篷顶。正文采用这一传统解释，同时用脚注提示词义不确定。
- source_word: בָּקָר / שׁוֹר
  choice: 牛／一头牛
  rationale: בקר 可泛指牛群或牛只；此处与单数 שור 的分配说明相呼应，指用于运输的牛。“牛”避免在原文未明确性别或阉割状态时过度限定为“公牛”或“阉牛”。
- source_word: עֲגָלָה עַל שְׁנֵי הַנְּשִׂאִים
  choice: 每两位首领献一辆车
  rationale: 按分配关系表达一辆车对应两位首领；补出“献”使现代汉语通顺，其含义由上下文的供献动作提供。
- source_word: וְשׁוֹר לְאֶחָד
  choice: 每位献一头牛
  rationale: “每位”回指首领，准确表达一位首领对应一头牛的分配关系。
- source_word: וַיַּקְרִיבוּ אֹתָם
  choice: 把这些呈到
  rationale: קרב 的使役形在礼仪语境可指带近、呈献；“呈到”保留礼仪性的呈交，又不暗示车辆和牛都被宰杀。
- source_word: הַמִּשְׁכָּן
  choice: 会幕
  rationale: משכן 指上帝在以色列人中间的圣所居所；“会幕”是现代中文圣经语境中清楚且通行的称呼。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华／上主
  rationale: 原文直接使用四字神名；“雅威”较贴近学界通行的拟音，并保留其作为专名的性质，不以称号替代。
- issue: 车辆和牛的“呈献”是否意味着献祭宰杀
  choice: 使用“呈到”，不明确为宰杀献祭
  alternative: 献上／奉献
  rationale: 上下文对象包括车辆，且 הקריב 可表示带近或呈交；因此不应将动作收窄为宰杀祭牲。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“雅威”保留神名；“供物”“呈到”体现礼仪场景，同时避免把车辆和牛一概解释为宰杀的祭物。脚注标记已在正文“十二头牛”之后出现，但脚注实际说明整组“有篷的车”这一词语。
