base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/071.yaml
  text: 'and for the sacrifice of peace offerings: two cattle[a], five rams, five male goats, and five one-year-old lambs. This was the offering of Ahiezer son of Ammishaddai.'
translation:
  language: zh_hans
  text: 用于平安祭的牲畜是：两头牛[a]、五只公绵羊、五只公山羊和五只一岁的公羊羔。这是亚希以谢，亚米沙代的儿子，所献的供物。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “平安祭”也可译为“团契祭”或“福祉祭”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/זֶבַח הַשְּׁלָמִים
  choice: 作平安祭的
  rationale: 前缀连词和介词承接前面的供物清单；“作……祭的”在中文中自然简洁。“平安祭”是שְׁלָמִים的通行祭祀术语，同时以脚注保留其他可能含义。
- source_word: בָּקָר שְׁנַיִם
  choice: 两头牛
  rationale: בָּקָר泛指牛类牲畜，并未明确性别；“两头牛”既自然，也避免译成“公牛”而过度限定。
- source_word: אֵילִם חֲמִשָּׁה
  choice: 五只公绵羊
  rationale: אֵילִם明确指公绵羊；此译法准确且符合现代汉语。
- source_word: עַתֻּדִים חֲמִשָּׁה
  choice: 五只公山羊
  rationale: עַתֻּדִים特指雄性山羊，译文保留其性别信息。
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה חֲמִשָּׁה
  choice: 五只一岁的公羊羔
  rationale: 该短语直指五只满一年左右的羊羔；结合祭牲清单语境，将כְּבָשִׂים译作“公羊羔”，并明确年龄。
- source_word: זֶה קָרְבַּן
  choice: 这是……所献的供物
  rationale: 保留希伯来语指示句式的现在时形式；“供物”准确表达קָרְבָּן在本段中的祭献含义。
- source_word: אֲחִיעֶזֶר בֶּן עַמִּישַׁדָּי
  choice: 亚希以谢 son of Ammishaddai
  rationale: 人名按项目惯例音译；בֶּן表达父子关系。
theological_decisions:
- issue: שְׁלָמִים这一祭类名称的语义范围
  choice: 平安祭
  alternative: 团契祭；福祉祭
  rationale: “平安祭”是中文圣经传统中辨识度高的祭祀术语，但原词也可强调团契或福祉，因此用脚注保留其语义张力。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语，以量词使牲畜清单自然清晰；保留祭祀术语和重复段落的公式化结句。
