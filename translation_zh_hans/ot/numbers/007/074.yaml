  text: 一个金盘，重十舍客勒[a]，盛满了香；
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“一个金盘，十（金子），盛满香”；“舍客勒”是根据本段反复出现的供物格式补出的重量单位。
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּף
  choice: 盘
  rationale: 此处指盛放物品的小型器皿，而非手掌或普通餐具；“盘”符合会幕供物清单的语境，也适合现代汉语。
- source_word: אַחַת
  choice: 一个
  rationale: 阴性数词，与כַּף一致；汉语按器皿自然译作“一个”。
- source_word: עֲשָׂרָה זָהָב
  choice: 重十舍客勒
  rationale: 原文直陈“十，金”，省略重量单位；本章反复出现的供物格式表明这里指器皿的重量，故正文补出“舍客勒”，并以脚注说明。
- source_word: מְלֵאָה
  choice: 盛满了
  rationale: 表示器皿装满其内容物；“盛满了”比单纯“满有”更符合汉语器皿语境。
- source_word: קְטֹרֶת
  choice: 香料
  rationale: 此词指用于圣所焚烧的芳香物质；“香料”在此强调器皿所盛的供物，避免现代读者把“香”仅理解为已经制成的香枝。
