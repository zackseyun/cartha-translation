  text: one gold dish[a], weighing ten shekels, full of incense;
translation:
  language: zh_hans
  text: 一个重十舍客勒的金盘[a]，盛满了香；
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“金碟”或“金碗”。传统译本常译作“金匙”，但希伯来词泛指一种小型礼仪器皿。
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּף
  choice: 盘
  rationale: 在会幕礼仪器具的语境中，כַּף 指盛放物品的小型器皿；译作“盘”比传统的“匙”更不易使现代读者误解为普通餐具，同时保留器形并不完全确定的空间。
- source_word: אַחַת
  choice: 一个
  rationale: 基数词，与阴性名词 כַּף 配合，表示器皿的数量。
- source_word: עֲשָׂרָה
  choice: 重十舍客勒
  rationale: 原文仅作“十”，但本章反复出现的献礼清单表明这里省略了重量单位“舍客勒”；在正文中补明，以自然汉语表达原有含义。
- source_word: זָהָב
  choice: 金
  rationale: 表示器皿的材质，即金制的器皿。
- source_word: מְלֵאָה
  choice: 盛满了
  rationale: 谓语形容词表示器皿装满其后所说的物品；“盛满了”符合汉语对容器及内容物的自然搭配。
- source_word: קְטֹרֶת
  choice: 香
  rationale: 指敬拜礼仪中焚烧的芳香物；“香”是简洁、通行的圣经用语。
