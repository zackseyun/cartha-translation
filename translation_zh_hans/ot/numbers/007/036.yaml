  text: 第五天，是西缅子孙的领袖、苏利沙代的儿子示路蔑：
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בַּיּוֹם הַחֲמִישִׁי
  choice: 第五天
  rationale: 按现代汉语习惯表达带定冠词的序数日期，不补入原文没有明说的“奉献礼”。
- source_word: נָשִׂיא
  choice: 领袖
  rationale: 此处指西缅支派公认的首领；“领袖”清楚自然，也避免“王子”所带来的王室含义。
- source_word: לִבְנֵי שִׁמְעוֹן
  choice: 西缅子孙的
  rationale: 保留“西缅的众子孙”这一希伯来语亲属群体表达，并以“的”自然表示归属或代表关系。
- source_word: שְׁלֻמִיאֵל
  choice: 示路蔑
  rationale: 采用现代中文圣经读者较熟悉的传统音译。
- source_word: בֶּן
  choice: ……的儿子
  rationale: 以现代汉语惯用的父子称谓表达家系关系。
- source_word: צוּרִישַׁדָּי
  choice: 苏利沙代
  rationale: 采用现代中文圣经读者较熟悉的传统音译。
theological_decisions:
- issue: 本节在希伯来文中没有限定动词，句法延续后文的献礼清单。
  choice: 用“是”与句末冒号构成引介语，保留未完待续的结构。
  alternative: 译成完整句，如“第五天献礼的是……”。
  rationale: 完整句会补入原文未明说的“献礼”；当前处理既符合现代汉语，又表明内容在下一节继续。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。保留“西缅子孙”这一较贴近原文的群体称呼；人名采用中文圣经传统常见译名。句末用冒号反映本节作为后续供物清单引介语的未完结构。
