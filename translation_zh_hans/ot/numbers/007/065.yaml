base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/065.yaml
  text: 'and for the sacrifice of peace offerings: two cattle[a], five rams, five male goats, and five male lambs a year old. This was the offering of Abidan son of Gideoni.'
translation:
  language: zh_hans
  text: 又作平安祭[a]的牲畜是两头牛、五只公绵羊、五只公山羊和五只一岁的公羊羔。这是基甸俄尼的儿子亚比但的供物。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “平安祭”也可译为“团契祭”或“福祉祭”。
    reason: 词汇替代；שְׁלָמִים 是祭祀术语，“平安祭”为通行译名，但其语义亦可表达团契或福祉。
lexical_decisions:
- source_word: וּלְזֶבַח הַשְּׁלָמִים
  choice: 作平安祭的
  rationale: וּלְ承接前文的供物清单，并引出祭物类别；“平安祭”是现代中文圣经语境中对 זֶבַח שְׁלָמִים 简洁且通行的称呼。
- source_word: בָּקָר שְׁנַיִם
  choice: 两头牛
  rationale: בָּקָר 是牛类牲畜的集合名词，原文未明确性别；“两头牛”自然且不作过度限定。
- source_word: אֵילִם חֲמִשָּׁה
  choice: 五只公绵羊
  rationale: אֵילִם 特指公绵羊；此译法准确，并与下文公山羊和公羊羔清楚区分。
- source_word: עַתֻּדִים חֲמִשָּׁה
  choice: 五只公山羊
  rationale: עַתֻּדִים 指雄性的山羊，译文保留祭牲的性别信息。
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה חֲמִשָּׁה
  choice: 五只一岁的公羊羔
  rationale: כְּבָשִׂים 在此指公羊羔，בְּנֵי שָׁנָה 表示一岁；按现代汉语量词和修饰语次序自然表达。
- source_word: זֶה קָרְבַּן
  choice: 这是……的供物
  rationale: 希伯来文是无显式时态的总结公式；中文用“这是”自然保留其直陈性质，“供物”准确表达 קָרְבַּן。
- source_word: אֲבִידָן בֶּן גִּדְעֹנִי
  choice: 基甸奥尼的儿子亚比但
  rationale: 按现代汉语谱系表达调整语序，并以通行的中文音译呈现人名。
theological_decisions:
- issue: הַשְּׁלָמִים 的祭名
  choice: 平安祭
  alternative: 团契祭；福祉祭
  rationale: 该词可能关联完整、平安、福祉，也涉及共享祭宴；“平安祭”是中文读者熟悉的传统术语，但不将其含义缩减为单一神学解释。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语；保留清单式节奏和本章反复出现的总结公式。原文没有需要在正文中标注的文本异读或不可避免的歧义，因此不设脚注。
