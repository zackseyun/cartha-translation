base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/059.yaml
  text: 'And for the sacrifice of peace offerings: two cattle[a], five rams, five male goats, and five one-year-old lambs[c][b]. This was the offering of Gamliel son of Pedahzur.'
translation:
  language: zh_hans
  text: 又为平安祭[a]献上：两头牛[b]、五只公绵羊、五只公山羊和五只一岁的羊羔。这是比大蓿的儿子迦玛列所献的供物。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “平安祭”也可译作“团契祭”或“福祉祭”。
    reason: lexical_alternative
  - marker: b
    text: 原文作“牛两头”，是泛指牛类牲畜，并未进一步限定为公牛或役用牛。
    reason: lexical_clarification
lexical_decisions:
- source_word: וּלְזֶבַח הַשְּׁלָמִים
  choice: 作为平安祭的祭牲
  rationale: 介词结构承接前文的献祭清单；“祭牲”自然表达 זֶבַח 在此处所指的献祭牲畜。“平安祭”是 שְׁלָמִים 的传统且易懂的祭祀术语，同时以脚注保留“团契祭、福祉祭”等可能侧重。
- source_word: בָּקָר שְׁנַיִם
  choice: 两头牛
  rationale: בָּקָר 是牛类牲畜的集合名词，并不限定为役用牛；汉语用量词“头”准确而自然。
- source_word: אֵילִם חֲמִשָּׁה
  choice: 五只公绵羊
  rationale: אֵילִם 明确指公绵羊；此译法比单说“公羊”更能与后面的公山羊区分。
- source_word: עַתֻּדִים חֲמִשָּׁה
  choice: 五只公山羊
  rationale: עַתֻּדִים 在这里指雄性的山羊，译文明确保留其性别和种类。
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה חֲמִשָּׁה
  choice: 五只一岁的羊羔
  rationale: בְּנֵי שָׁנָה 直指“一岁的”，译文保留祭牲的年龄要求；כְּבָשִׂים 可自然译为“羊羔”，原文没有另加明确的性别说明。
- source_word: זֶה קָרְבַּן
  choice: 这是……所献的供物
  rationale: 希伯来语是没有明示系词的指示性名词句；汉语用“这是”既自然又无需在现在时与过去时之间作不必要的选择。“供物”准确表达献给上帝之物。
- source_word: גַּמְלִיאֵל בֶּן פְּדָה־צוּר
  choice: 比大蓿的儿子迦玛列
  rationale: 按希伯来语人名音译，并采用现代中文圣经读者较熟悉的写法；בֶּן 译为“儿子”。
theological_decisions:
- issue: שְׁלָמִים 的祭祀含义
  choice: 正文采用“平安祭”
  alternative: “团契祭”或“福祉祭”
  rationale: 该词可能涉及平安、完满、福祉以及献祭后的共享筵席等意涵；正文采用通行术语，但用脚注保留其他可能侧重，不把词义限定为某一套神学解释。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语，并保留献祭清单简洁、重复的文体。量词按现代汉语补出；冒号呈现原文清单结构。人名使用简体中文圣经传统中较熟悉的形式。
