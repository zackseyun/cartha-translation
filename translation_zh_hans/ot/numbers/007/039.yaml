translation:
  language: zh_hans
  text: 一头公牛，一只公绵羊，一只一岁的公羊羔，作燔祭；
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פַּר אֶחָד בֶּן בָּקָר
  choice: 一头公牛犊
  rationale: פַּר指公牛或公牛犊，בֶּן בָּקָר是表示牛类牲畜的惯用语；合译为“一头公牛犊”，既自然，也符合献祭清单的语境。
- source_word: אֶחָד
  choice: 一头／一只
  rationale: 原文在每种祭牲后重复数词“一”；中文按动物量词分别译作“一头”和“一只”，保留逐项计数的结构。
- source_word: אַיִל אֶחָד
  choice: 一只公绵羊
  rationale: אַיִל指成年的雄性绵羊；“公绵羊”是现代汉语中清楚而准确的表达。
- source_word: כֶּבֶשׂ אֶחָד בֶּן שְׁנָתוֹ
  choice: 一只一岁的公羊羔
  rationale: כֶּבֶשׂ在献祭语境中通常指雄性羊羔，בֶּן שְׁנָתוֹ是“一岁”或“第一年内”的年龄惯用表达；译文采用自然简洁的“一岁的公羊羔”。
- source_word: לְעֹלָה
  choice: 作燔祭
  rationale: עֹלָה是整只焚烧献上的祭物，传统且通行的中文术语为“燔祭”；介词לְ在此表示用途，译作“作”。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的祭祀清单体。以“一头／一只”体现汉语量词习惯，并保留原文逐项重复“一”的节奏。本节无需脚注；原文的בֶּן בָּקָר可在正文中自然归入“公牛犊”，而כֶּבֶשׂ的雄性含义直接译明。
