  language: zh_hans
  text: 一只金碟，重十舍客勒[a]，盛满了香；
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译：“一只金碟，十，盛满了香。”重量单位“舍客勒”是根据民数记第7章反复出现的献礼格式补出的。
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּף
  choice: 香碟
  rationale: 这里指盛香的礼仪器皿。译作“香碟”既体现其用途，也避免现代读者把它误解为普通汤匙。
- source_word: אַחַת
  choice: 一个
  rationale: 阴性基数词，与כַּף一致；汉语自然译为“一个”。
- source_word: עֲשָׂרָה זָהָב
  choice: 重十舍客勒
  rationale: 希伯来文为省略表达，字面只有“十，金”；根据民数记第7章反复出现的献礼公式，这里所指的是器皿的重量，重量单位“舍客勒”隐含在上下文中。
- source_word: מְלֵאָה
  choice: 盛满了
  rationale: 表示器皿装满某物；“盛满了”符合汉语描述容器及其内容物的习惯。
- source_word: קְטֹרֶת
  choice: 香
  rationale: 指礼仪中焚烧的芳香物质；“香”是简洁、自然且符合会幕语境的译法。
