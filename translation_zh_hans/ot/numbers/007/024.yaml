  text: On the third day[a], the leader of the sons of Zebulun was Eliab son of Helon.
translation:
  language: zh_hans
  text: 第三天，西布伦子孙的首领[a]是希伦的儿子以利押。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“代表西布伦子孙的首领”。这里的希伯来介词既可表示归属，也可表示代表关系。
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַשְּׁלִישִׁי
  choice: 第三天
  rationale: בְּ与“日”连用，在这一叙事格式中表示时间；现代汉语用“第三天”自然、准确。
- source_word: נָשִׂיא
  choice: 首领
  rationale: 此词在《民数记》中指支派中获承认的领袖；“首领”既体现其正式地位，也避免“王子”所暗示的王室身份。
- source_word: לִבְנֵי זְבוּלֻן
  choice: 西布伦子孙的
  rationale: לְ在此可表示归属或代表关系；正文用“……的”保留支派归属之意，并以脚注说明另一种可能理解。
- source_word: זְבוּלֻן
  choice: 西布伦
  rationale: 采用现代中文圣经中通行的支派名称译法。
- source_word: אֱלִיאָב
  choice: 以利押
  rationale: 采用现代中文圣经中通行的人名译法。
- source_word: בֶּן
  choice: ……的儿子
  rationale: 按希伯来语父名结构译出亲子关系，符合自然汉语表达。
- source_word: חֵלֹן
  choice: 希伦
  rationale: 采用现代中文圣经中通行的人名译法。
