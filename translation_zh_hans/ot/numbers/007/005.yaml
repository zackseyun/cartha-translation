revisions:
- from: 你要从他们那里收下这些[a]，用来办理会幕的事务；要把这些交给利未人，各按各自所办的事务分配[b]。
  to: 你要从他们那里收下这些[a]，使这些供会幕的服事使用；然后要按各人所负责的服事，把这些交给利未人[b]。
  rationale: 修订明确这些物品是供会幕服事使用，并将“按各人所负责的服事”直接关联于把物品交给利未人的行动。保留“这些”的上下文指向说明，同时将脚注b限制在原文实际表达的范围内，不预先界定“各人”为个人或家族。
