  text: קַ֚ח מֵֽ/אִתָּ֔/ם וְ/הָי֕וּ לַ/עֲבֹ֕ד אֶת עֲבֹדַ֖ת אֹ֣הֶל מוֹעֵ֑ד וְ/נָתַתָּ֤ה אוֹתָ/ם֙ אֶל הַ/לְוִיִּ֔ם אִ֖ישׁ כְּ/פִ֥י עֲבֹדָתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/005.yaml
  text: Take them from them[a], and let them be for doing the service of the tent of meeting; and you shall give them to the Levites[b], each according to his service.
translation:
  language: zh_hans
  text: 你要从他们那里收下这些[a]，使这些供会幕的服事使用；然后要按各人所负责的服事，把这些交给利未人[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “这些”指上文各首领献上的车辆和公牛。
    reason: referent_clarification
  - marker: b
    text: 希伯来文直译为“各人按照他的服事”。
    reason: lexical_alternative
lexical_decisions:
- source_word: קַח מֵאִתָּם
  choice: 你要从他们那里收下这些
  rationale: לקח在此是对摩西的命令；结合首领献上车辆和公牛的语境，“收下”比单纯“拿”更自然，也保留来源短语“从他们那里”。“这些”承接上文所献之物。
- source_word: וְהָיוּ לַעֲבֹד אֶת־עֲבֹדַת
  choice: 用来办理……的事务
  rationale: 希伯来文直译近于“它们要为办理……的事务而存在”。所指为无生命的车辆和公牛，汉语用“用来”自然表达其用途；“办理……事务”保留עבד与עבודה的同根呼应及指定工作的含义。
- source_word: אֹהֶל מוֹעֵד
  choice: 会幕
  rationale: 这是该旷野圣所的固定称谓；“会幕”是现代中文圣经语体中简洁、通行且准确的译法。
- source_word: וְנָתַתָּה אֹתָם אֶל־הַלְוִיִּם
  choice: 要把这些交给利未人
  rationale: נתן的基本义为“给”；“交给”在此自然表示将所献之物交由利未人使用，而不额外规定所有权。
- source_word: אִישׁ כְּפִי עֲבֹדָתוֹ
  choice: 各按各自所办的事务分配
  rationale: אִישׁ在此具分配义；כפי字面为“按……之口”，是“依照、按其所需”的习语。加入“分配”明确汉语中所隐含的分派关系，而“各自所办的事务”保留各人或各组职责不同的意思。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“会幕”“利未人”沿用通行圣经称谓；主句避免生硬复刻希伯来文“为服事事务”的同源宾语结构，同时以“办理……事务”尽量保留其正式职责色彩。
