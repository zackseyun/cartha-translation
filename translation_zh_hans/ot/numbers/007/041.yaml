base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/041.yaml
  text: 'and for the sacrifice of peace offerings: two cattle[a], five rams, five male goats, and five male lambs a year old[b]. This was the offering of Shelumiel son of Zurishaddai.'
translation:
  language: zh_hans
  text: 又作平安祭[a]的祭牲：两头牛[b]、五只公绵羊、五只公山羊、五只一岁的公羊羔。这是苏利沙代的儿子示路蔑所献的供物。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “平安祭”也可译作“相交祭”或“福祉祭”。
    reason: lexical_alternative
  - marker: b
    text: 原文泛指牛类，并未明确说是公牛。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְזֶבַח הַשְּׁלָמִים
  choice: 作平安祭的牲畜是
  rationale: 前缀 וּלְ 承接献物清单，并引出祭牲类别；“平安祭”是 שְׁלָמִים 在现代中文圣经语境中简洁且通行的礼仪用语。“牲畜是”自然引出随后列举的动物。
- source_word: בָּקָר שְׁנַיִם
  choice: 两头牛
  rationale: בָּקָר 泛指牛类，并未明确限定为公牛；中文以量词“头”表达计数，既自然又不增加原文没有的性别信息。
- source_word: אֵילִם חֲמִשָּׁה
  choice: 五只公绵羊
  rationale: אֵילִם 指成年公绵羊；译出性别，并用“绵羊”与后面的公山羊清楚区分。
- source_word: עַתֻּדִים חֲמִשָּׁה
  choice: 五只公山羊
  rationale: עַתֻּדִים 在献祭清单中明确指公山羊，因此保留性别信息。
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה חֲמִשָּׁה
  choice: 五只一岁的公羊羔
  rationale: כְּבָשִׂים 指公羊羔，בְּנֵי שָׁנָה 是“一岁”的惯用表达；译文保留年龄和性别。
- source_word: זֶה קָרְבַּן
  choice: 这是……所献的供物
  rationale: זֶה 是指示语“这是”，קָרְבַּן 在此泛指献上的供物；中文关系结构使整句自然，同时保留原文公式化表达。
- source_word: שְׁלֻמִיאֵל בֶּן צוּרִישַׁדָּי
  choice: 苏利沙代的儿子示路蔑
  rationale: 依照现代中文圣经中较通行的专名形式音译，并忠实保留“某人的儿子”这一身份说明。
theological_decisions:
- issue: שְׁלָמִים 的祭名含义
  choice: 平安祭
  alternative: 相交祭；福祉祭
  rationale: 该词可能突出平安、福祉或献祭者与上帝及群体共享祭物所体现的相交。“平安祭”沿用广为理解的礼仪名称，但以脚注保留其他合理语义取向，避免将含义收窄为单一神学解释。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。献祭术语保持准确，动物的种类、性别和年龄按希伯来文逐项表达；专名采用较通行的中文圣经译名。脚注标记均紧随其所说明的词语。
