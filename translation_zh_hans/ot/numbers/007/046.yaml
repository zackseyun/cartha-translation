lexical_decisions:
- source_word: שְׂעִיר עִזִּים
  choice: 公山羊
  rationale: 该结构指雄性的山羊。现代汉语用“公山羊”既自然清楚，也保留原文明确的性别信息。
- source_word: אֶחָד
  choice: 一只
  rationale: 保留原文明示的数词，并用适合动物的量词“只”，符合本章重复列举祭物的清单体例。
- source_word: לְחַטָּאת
  choice: 作赎罪祭
  rationale: 在祭祀语境中，חַטָּאת通常是祭物术语，指与罪有关的祭，即“赎罪祭”；介词לְ在这里表示用途或指定，译作“作”。
theological_decisions:
- issue: 祭祀语境中חַטָּאת的译法
  choice: 赎罪祭
  alternative: 为罪／作除罪祭
  rationale: 在祭司文献的献祭清单中，该词通常指一种祭，而不只是抽象的“罪”。“赎罪祭”是现代中文读者熟悉且能清楚标明祭物类别的译法；脚注保留更贴近字面的可能表达，避免掩盖原词与“罪”的直接联系。
translation_notes:
  register: 采用简洁、庄重的祭物清单语体；保留“一只”以体现原文的计数格式，并以分号衔接本章连续列举的结构。
