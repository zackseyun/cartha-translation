  text: 第四天，流便子孙的首领[a]是示丢珥的儿子以利蓿。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“族长”；传统译作“王子”。希伯来语此词指正式担任支派领导职分的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הָרְבִיעִי
  choice: 第四天
  rationale: 介词 בְּ 与“日”在此列举叙事中表示时间；现代汉语自然表达为“第四天”。
- source_word: נָשִׂיא
  choice: 首领
  rationale: 此词在《民数记》中指获正式承认的支派领袖。“首领”既体现其身份，又避免“王子”可能带来的王室含义。
- source_word: לִבְנֵי רְאוּבֵן
  choice: 吕便子孙的
  rationale: 介词 לְ 在这里表示归属或代表关系；“吕便子孙的”贴近希伯来文的亲族—支派表达，也符合现代汉语。
- source_word: אֱלִיצוּר
  choice: 以利蓿
  rationale: 按现代中文圣经人名惯例音译该专名。
- source_word: בֶּן
  choice: ……的儿子
  rationale: 这是希伯来文中表示父子身份的标准结构；依汉语语序表达为“示丢珥的儿子”。
- source_word: שְׁדֵיאוּר
  choice: 示丢珥
  rationale: 按现代中文圣经人名惯例音译该专名。
