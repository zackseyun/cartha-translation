base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/087.yaml
  text: 'All the cattle for the burnt offering: twelve bulls[a], twelve rams, twelve one-year-old lambs, and their grain offering; and twelve male goats for a sin offering.'
translation:
  language: zh_hans
  text: 作燔祭的牛共有十二头；公绵羊十二只；一岁的公羊羔十二只，及其素祭；作赎罪祭的公山羊十二只[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“洁净祭”。希伯来语“חַטָּאת”既可指与罪有关的祭，也可侧重除去污秽、恢复洁净。
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הַבָּקָר לָעֹלָה
  choice: 作燔祭的牲畜共有
  rationale: כָּל引出献祭总数，לָעֹלָה表示用途。הַבָּקָר本指牛群或牛类，但此处随即总列公牛、公绵羊和羊羔，因此按清单语境译为较宽泛的“牲畜”，避免让现代读者误以为后列羊类也属于牛类。
- source_word: פָּרִים
  choice: 公牛
  rationale: 祭祀语境中פַּר指公牛；中文以“头”为量词。
- source_word: אֵילִם
  choice: 公绵羊
  rationale: 明确指成年雄性绵羊，较单译“公羊”更能与后面的公山羊区分。
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה
  choice: 一岁的公羊羔
  rationale: 保留年龄限定；在献祭清单中按该词的阳性复数形式自然表达为公羊羔。
- source_word: וּמִנְחָתָם
  choice: 并有同献的素祭
  rationale: מִנְחָה在祭祀法规中通常指与牲祭同献的谷物祭；“素祭”沿用清楚而常见的中文圣经祭祀术语，并以“同献的”表达第三人称复数后缀所指的配套关系。
- source_word: וּשְׂעִירֵי עִזִּים
  choice: 另有公山羊
  rationale: 该词组明确表示雄性山羊；“另有”表现其从燔祭牲畜转入另一类祭物的清单关系。
- source_word: לְחַטָּאת
  choice: 作赎罪祭
  rationale: לְ表示用途；חַטָּאת在祭司献祭法规中通常称为“赎罪祭”，同时在脚注保留其洁净、除污层面的可能含义。
theological_decisions:
- issue: 献祭法规中חַטָּאת的译法
  choice: 赎罪祭
  alternative: 洁净祭
  rationale: 该词既可关联罪，也可强调除去礼仪污秽、恢复洁净。“赎罪祭”是现代中文读者较熟悉且符合此处祭物清单的名称，但不应抹去“洁净祭”的词义侧重，故以脚注注明。
translation_notes:
  register: 采用庄重而自然的现代标准普通话，以冒号和分号呈现希伯来文的祭物清单结构。动物名称明确区分公绵羊、公羊羔和公山羊，并使用现代汉语常用量词。脚注标记置于其实际说明的“赎罪祭”之后。
