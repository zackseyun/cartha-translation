  yaml_path: translation/ot/numbers/007/048.yaml
  text: On the seventh day[a], the leader of the sons of Ephraim was Elishama son of Ammihud.
translation:
  language: zh_hans
  text: 第七天[a]，以法莲子孙的领袖是亚米忽的儿子以利沙玛。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “以法莲子孙的领袖”也可译作“为以法莲子孙作领袖的人”。希伯来语介词既可表示所属关系，也可表示代表关系。
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַשְּׁבִיעִי
  choice: 第七天
  rationale: 介词בְּ与“日”和序数词连用，构成时间表达；“第七天”是自然、准确的现代汉语译法。
- source_word: נָשִׂיא
  choice: 领袖
  rationale: 本章中指代表支派献礼的首领；“领袖”清楚表达其领导及代表身份，又避免“王子”等可能引起的误解。
- source_word: לִבְנֵי אֶפְרָיִם
  choice: 以法莲子孙的
  rationale: 介词לְ在此可表示与以法莲子孙的隶属关系，也可表示为他们担任代表；正文用自然的所属结构，并以脚注保留另一理解。
- source_word: אֱלִישָׁמָע
  choice: 以利沙玛
  rationale: 按现代中文圣经人名的通行音译处理。
- source_word: בֶּן עַמִּיהוּד
  choice: 亚米忽的儿子
  rationale: 忠实表达希伯来语父系身份结构，同时符合自然的现代汉语语序。
