translation:
  language: zh_hans
  text: 一只公山羊，作赎罪祭；[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“作洁净祭。”在祭祀语境中，希伯来语“חַטָּאת”可指处理罪和礼仪不洁的祭物。
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂעִיר עִזִּים
  choice: 公山羊
  rationale: 该结构短语指雄性的山羊。译作“公山羊”既符合现代汉语习惯，也保留祭牲的性别信息。
- source_word: אֶחָד
  choice: 一只
  rationale: 明确保留数词“一”，并使用适合动物的量词“只”，体现《民数记》第7章清单式、重复性的列举文体。
- source_word: לְחַטָּאת
  choice: 作赎罪祭
  rationale: 在祭祀语境中，חַטָּאת 指处理罪与礼仪不洁的祭物，而非抽象的“罪”。“赎罪祭”是现代中文圣经语境中清楚且易识别的表达；另以脚注保留“洁净祭”这一语境上成立的译法。
theological_decisions:
- issue: 祭祀语境中 חַטָּאת 的译法
  choice: 赎罪祭
  alternative: 洁净祭
  rationale: 这里显然指一种祭物。“赎罪祭”保留该词与罪的直接联系，也为普通读者熟悉；但这种祭也涉及礼仪上的洁净，因此用脚注保留“洁净祭”，避免将原词的功能范围压缩为单一层面。
translation_notes:
  register: 采用简洁、庄重的现代标准汉语。“一只……作……”保持祭物清单的节奏；分号与上下文连续列举的格式相配。
