base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/053.yaml
  text: 'and for the sacrifice of peace offerings: two cattle[a], five rams, five male goats, and five lambs a year old[b]. This was the offering of Elishama son of Ammihud.'
translation:
  language: zh_hans
  text: 作平安祭[a]的牲畜是：牛两头，公绵羊五只，公山羊五只，一岁的公羊羔五只。这是亚米忽的儿子以利沙玛的供物。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “平安祭”也可译作“团契祭”或“福祉祭”；这个希伯来语祭名常与共享祭肉的筵席有关，表达平安、和好或完整的福祉。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְזֶבַח הַשְּׁלָמִים
  choice: 作平安祭
  rationale: 前缀连接本节与前面的供物清单；זֶבַח指献祭，שְׁלָמִים是特定祭名。采用现代中文圣经语境中简明而可辨识的“平安祭”。
- source_word: בָּקָר שְׁנַיִם
  choice: 牛两头
  rationale: בָּקָר是牛类的集合名词，并未明确限定为公牛；中文以量词“头”自然表达，同时保留原文的宽泛性。
- source_word: אֵילִם חֲמִשָּׁה
  choice: 公绵羊五只
  rationale: אֵילִם明确指成年公绵羊，译文保留其性别和种类。
- source_word: עַתֻּדִים חֲמִשָּׁה
  choice: 公山羊五只
  rationale: עַתֻּדִים特指公山羊，故明确译出性别。
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה חֲמִשָּׁה
  choice: 一岁的公羊羔五只
  rationale: כְּבָשִׂים在祭牲清单中指公羊羔；בְּנֵי שָׁנָה是“一岁”的惯用表达。中文按自然语序将年龄前置。
- source_word: זֶה קָרְבַּן
  choice: 这是……的供物
  rationale: 无动词的指认句在中文中自然译为“这是”；קָרְבַּן在此指献上的供物。
- source_word: אֱלִישָׁמָע בֶּן עַמִּיהוּד
  choice: 亚米忽的儿子以利沙玛
  rationale: 按现代中文自然的亲属结构表达父子关系，并采用通行的圣经人名音译。
theological_decisions:
- issue: שְׁלָמִים这一祭名的含义
  choice: 平安祭
  alternative: 团契祭；福祉祭
  rationale: “平安祭”是简洁且通行的祭祀术语；脚注保留该词也可强调共享祭餐、和好或完整福祉的语义，不把其神学含义缩减为单一解释。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。祭牲按中文自然方式搭配量词，并保留原文对牛只类别的概括性，以及其他牲畜的性别和年龄信息。脚注标记紧随所解释的“平安祭”。
