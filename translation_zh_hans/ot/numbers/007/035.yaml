  text: וּ/לְ/זֶ֣בַח הַ/שְּׁלָמִים֮ בָּקָ֣ר שְׁנַיִם֒ אֵילִ֤ם חֲמִשָּׁה֙ עַתֻּדִ֣ים חֲמִשָּׁ֔ה כְּבָשִׂ֥ים בְּנֵֽי שָׁנָ֖ה חֲמִשָּׁ֑ה זֶ֛ה קָרְבַּ֥ן אֱלִיצ֖וּר בֶּן שְׁדֵיאֽוּר־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/035.yaml
  text: 'and for the sacrifice of peace offerings: two cattle[a], five rams, five male goats, and five lambs a year old. This was the offering of Elizur son of Shedeur.'
translation:
  language: zh_hans
  text: 作平安祭[a]的祭牲，是两头牛、五只公绵羊、五只公山羊和五只一岁的公羊羔。这是示丢珥的儿子以利蓿的供物。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“团契祭”或“福祉祭”。
    reason: שְׁלָמִים 的语义范围包括平安、福祉及相交共享等含义；正文采用传统术语，脚注保存词义上的可能性。
lexical_decisions:
- source_word: וּ/לְ/זֶבַח הַשְּׁלָמִים
  choice: 作平安祭的祭牲
  rationale: 介词结构承接前文的供物清单；“平安祭”是 שְׁלָמִים 的通行祭祀术语，“祭牲”对应 זֶבַח，并使中文列举自然清楚。
- source_word: בָּקָר שְׁנַיִם
  choice: 两头牛
  rationale: בָּקָר 是牛类牲畜的集合名词，并未限定为阉牛；中文以量词“头”自然表达。
- source_word: אֵילִם חֲמִשָּׁה
  choice: 五只公绵羊
  rationale: אֵילִם 明确指成年公绵羊；译为“公绵羊”可与后面的公山羊和羊羔区分。
- source_word: עַתֻּדִים חֲמִשָּׁה
  choice: 五只公山羊
  rationale: עַתֻּדִים 特指公山羊，保留了原文的性别信息。
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה חֲמִשָּׁה
  choice: 五只一岁的公羊羔
  rationale: כְּבָשִׂים 是阳性羊羔用语，בְּנֵי שָׁנָה 表示一岁；译文保留其年龄和性别信息。
- source_word: זֶה קָרְבַּן
  choice: 这是……的供物
  rationale: קָרְבַּן 指献到上帝面前的供物；中文用“供物”简洁地保留一般性祭物术语。
- source_word: אֱלִיצוּר בֶּן שְׁדֵיאוּר
  choice: 示丢珥的儿子以利蓿
  rationale: 采用现代中文圣经中较熟悉的人名音译，并明确保留父子关系。
theological_decisions:
- issue: שְׁלָמִים 的祭祀含义
  choice: 平安祭
  alternative: 团契祭；福祉祭
  rationale: 该词可强调平安、福祉以及献祭者与上帝相交共享的层面；正文采用通行的“平安祭”，脚注保留其他合理理解，避免把词义限于单一神学解释。
translation_notes:
  register: 采用庄重而现代的清单句式；牲畜量词用“头”和“只”，便于普通读者理解。脚注标记紧随其实际说明的“平安祭”，而不置于“牛”之后。
