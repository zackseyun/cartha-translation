translation:
  language: zh_hans
  text: 一头公牛，一只公绵羊，一只一岁的公羊羔，作燔祭；
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פַּר אֶחָד בֶּן בָּקָר
  choice: 一头公牛犊
  rationale: פַּר在献祭语境中指公牛，בֶּן בָּקָר进一步表明是牛群中的幼畜；译作“一头公牛犊”既自然，也保留牲畜类别和数量。
- source_word: אַיִל אֶחָד
  choice: 一只公绵羊
  rationale: אַיִל指成年的公绵羊；量词“一只”符合现代汉语习惯，并保留重复计数的清单结构。
- source_word: כֶּבֶשׂ אֶחָד
  choice: 一只公羊羔
  rationale: כֶּבֶשׂ指公的幼羊；“公羊羔”明确表达其性别与幼龄。
- source_word: בֶּן שְׁנָתוֹ
  choice: 一岁的
  rationale: 该希伯来语年龄习语表示处于出生后第一年；在现代汉语祭物清单中，“一岁的”简洁清楚。
- source_word: לְעֹלָה
  choice: 作燔祭
  rationale: עֹלָה是整只焚烧献上的祭物，传统且通行的汉语术语为“燔祭”；“作”准确表达用途。
- source_word: אֶחָד
  choice: 一头／一只
  rationale: 原文在每种动物后重复数词“一”；译文逐项保留数量，并按汉语习惯搭配相应量词。
theological_decisions: []
translation_notes:
