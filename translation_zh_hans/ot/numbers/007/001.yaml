  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יְהִ֡י בְּ/יוֹם֩ כַּלּ֨וֹת מֹשֶׁ֜ה לְ/הָקִ֣ים אֶת הַ/מִּשְׁכָּ֗ן וַ/יִּמְשַׁ֨ח אֹת֜/וֹ וַ/יְקַדֵּ֤שׁ אֹת/וֹ֙ וְ/אֶת כָּל כֵּלָ֔י/ו וְ/אֶת הַ/מִּזְבֵּ֖חַ וְ/אֶת כָּל כֵּלָ֑י/ו וַ/יִּמְשָׁחֵ֖/ם וַ/יְקַדֵּ֥שׁ אֹתָֽ/ם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/001.yaml
  text: And it happened on the day Moses finished setting up the tabernacle[a], that he anointed it and consecrated it, along with all its furnishings, and the altar with all its utensils; he anointed them and consecrated them.
translation:
  language: zh_hans
  text: 摩西支搭完帐幕的那一天[a]，他膏抹帐幕，使帐幕、帐幕的一切器具、祭坛和祭坛的一切器具分别为圣；又膏抹它们，使它们分别为圣。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“当摩西支搭完帐幕时。”希伯来语的时间表达可按字面译为“在……完成的那一天”，也可较自然地译为“当……完成时”。
    reason: 说明时间结构 בְּיוֹם כַּלּוֹת 的可行译法，不将“那一天”的时间关系不必要地改成“以后”的后续关系。
lexical_decisions:
- source_word: וַיְהִי
  choice: （不单独译出，以时间句式承载叙事起始功能）
  rationale: 该叙事性 wayyiqtol 在这里引出新段落。现代汉语若直译为“事情发生了”较生硬，改由句首时间结构自然开启叙事。
- source_word: בְּיוֹם כַּלּוֹת
  choice: ……完……的那一天
  rationale: 保留希伯来语“在……完成之日”的时间表达，同时用自然的现代汉语呈现。此结构也可能泛指“当……完成以后”，故加脚注说明。
- source_word: לְהָקִים
  choice: 支搭
  rationale: 使役形在帐幕语境中指把帐幕竖立、搭建起来。“支搭帐幕”准确、自然，也符合中文圣经语域。
- source_word: הַמִּשְׁכָּן
  choice: 帐幕
  rationale: 在旷野圣所语境中，这是准确且广为人知的标准译法，比“居所”更能直接指明具体设施。
- source_word: וַיִּמְשַׁח
  choice: 膏抹
  rationale: 该词指以油施行奉献礼。“膏抹”既保留具体礼仪动作，也承载其分别奉献的含义。
- source_word: וַיְקַדֵּשׁ
  choice: 使……分别为圣
  rationale: 此处指把圣所物件分别出来归于神、供神圣用途，并非道德层面的改变。“使……分别为圣”比单用“成圣”更清楚。
- source_word: כָּל כֵּלָיו（帐幕）
  choice: 其中的一切器具
  rationale: כְּלִים 可泛指帐幕内供敬拜使用的器物。“其中的一切器具”清楚表达所属关系，又不把范围缩窄为餐具式的“用具”。
- source_word: הַמִּזְבֵּחַ
  choice: 祭坛
  rationale: 这是 מזבח 在献祭语境中的标准、准确译法。
- source_word: כָּל כֵּלָיו（祭坛）
  choice: 祭坛的一切器具
  rationale: 第二处具体指属于祭坛的器物。重复“祭坛”可避免汉语代词所指不明。
- source_word: וַיִּמְשָׁחֵם וַיְקַדֵּשׁ אֹתָם
  choice: 膏抹……使它们分别为圣
  rationale: 复数宾语概括前述祭坛及其器具；中文把“膏抹”提前与各组宾语相连，并在句末保留复数总结，使行文自然而不消除原文的概括关系。
theological_decisions:
- issue: 礼仪性圣洁术语
  choice: 使……分别为圣
  alternative: 使……成圣；将……圣化
  rationale: 上下文说的是帐幕及器具经奉献而归作神圣用途，不是受造物发生道德转变。“分别为圣”保留 קדשׁ 的礼仪含义，也避免引入特定宗派解释。
- issue: 末尾复数代词的涵盖范围
  choice: 按近接结构理解为祭坛和祭坛的一切器具，同时不增添排他性限定
  alternative: 明确解释为前面提到的全部帐幕、祭坛及器具
  rationale: 希伯来语复数“它们”在句法上紧接祭坛及其器具，但也具有总结作用。译文保留“它们”，不强行断定其范围只限于最近的名词或涵盖此前全部对象。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“支搭帐幕”“膏抹”“祭坛”保留熟悉的经文语域；“使……分别为圣”明确表达礼仪性奉献。通过重复“帐幕”“祭坛”减少汉语代词歧义，但保留末尾复数“它们”的概括弹性。
