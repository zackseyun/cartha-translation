lexical_decisions:
- source_word: שְׂעִיר עִזִּים
  choice: 公山羊
  rationale: 该组合词是指山羊中的雄性牲畜；“公山羊”符合现代汉语习惯，也保留了祭牲的性别信息。
- source_word: אֶחָד
  choice: 一只
  rationale: 明确保留数词，并采用适用于山羊的量词“只”，呼应民数记第7章献礼清单反复列举的格式。
- source_word: לְחַטָּאת
  choice: 作赎罪祭
  rationale: 在祭祀语境中，חַטָּאת指处理罪或礼仪不洁的祭；“作赎罪祭”是通行、自然的表达，也体现前缀לְ所表示的用途。
theological_decisions:
- issue: 祭祀术语חַטָּאת的译法
  choice: 赎罪祭
  alternative: 洁净祭
  rationale: 此处明确指一种祭，但该希伯来词既可突出罪，也可突出礼仪污秽的洁净。“赎罪祭”较为通行，另以脚注保留“洁净祭”这一真实的词义侧重。
translation_notes:
