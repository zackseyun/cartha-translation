  text: וַ/יַּקְרִ֨יבוּ֙ נְשִׂיאֵ֣י יִשְׂרָאֵ֔ל רָאשֵׁ֖י בֵּ֣ית אֲבֹתָ֑/ם הֵ֚ם נְשִׂיאֵ֣י הַ/מַּטֹּ֔ת הֵ֥ם הָ/עֹמְדִ֖ים עַל הַ/פְּקֻדִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/002.yaml
  text: Then the leaders of Israel[a], the heads of their fathers’ houses, brought offerings. They were the leaders of the tribes[c][b]; they were the ones standing over those who were counted.
translation:
  language: zh_hans
  text: 以色列的首领，就是他们父系家族的首领，献上了礼物。[a]他们是各支派的首领，也是负责监管被数点之人的。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “献上礼物”也可译作“带到近前”或“呈献”。希伯来语动词本身没有明说所献之物；这里根据本章奉献礼物的上下文补出。
    reason: lexical_alternative
  - marker: b
    text: “负责监管被数点之人的”较字面可译作“站在被数点之人之上的”；所指是负责监管人口统计中登记之人的首领。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְרִיבוּ
  choice: 前来献上礼物
  rationale: קרב 的使役形字面含义是“使靠近、带到近前”，在本章奉献礼物的语境中指呈献。译作“前来献上礼物”符合现代汉语，并借上下文补明省略的宾语；脚注保留较字面的理解。
- source_word: נְשִׂיאֵי יִשְׂרָאֵל
  choice: 以色列的首领
  rationale: נָשִׂיא 在此指各支派中居领导地位的人，并非王室意义上的“王子”；“首领”准确而庄重。
- source_word: רָאשֵׁי בֵּית אֲבֹתָם
  choice: 各父系家族的族长
  rationale: בֵּית אָב 是以共同父系祖先为纽带的宗族或家族单位。“父系家族”保留古代亲族结构，“族长”自然表达 רָאשִׁים 的领导含义。
- source_word: הֵם נְשִׂיאֵי הַמַּטֹּת
  choice: 他们是各支派的首领
  rationale: מַטֶּה 字面为“杖”，在此是“支派”的惯用称呼；直接译为“支派”可清楚传达所指。
- source_word: הֵם הָעֹמְדִים עַל הַפְּקֻדִים
  choice: 也是负责管理那些被数点之人的
  rationale: עמד על 字面有“站在……之上”之意，在此表示监督或负责；הַפְּקֻדִים 指人口统计中被登记、数点的人。“负责管理”以自然汉语传达职权关系，同时脚注说明可按较字面方式理解。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“父系家族”比直译“父家”更清楚，也保留古代以父系祖先组织宗族的文化背景；全句避免将这些首领误解为王室成员。
