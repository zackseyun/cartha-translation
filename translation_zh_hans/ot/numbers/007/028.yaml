lexical_decisions:
- source_word: שְׂעִיר עִזִּים
  choice: 公山羊
  rationale: 该组合在献祭清单中指雄性的山羊；“公山羊”既明确性别和种类，也符合现代汉语习惯。
- source_word: אֶחָד
  choice: 一只
  rationale: 原文明确使用数词“一”；在逐项列举祭物的语境中予以保留，并用量词“只”使表达自然。
- source_word: לְחַטָּאת
  choice: 作赎罪祭
  rationale: חַטָּאת在此献祭清单中指一种祭，而非抽象的“罪”；介词לְ在这里自然译为“作”。“赎罪祭”是现代汉语中清楚而通行的礼仪用语。
theological_decisions:
- issue: 献祭语境中חַטָּאת的译法
  choice: 赎罪祭
  alternative: 洁净祭；为罪而献
  rationale: 上下文正在列举祭物，因此应译为祭礼名称，而不是抽象的“罪”。采用通行的“赎罪祭”，但不在正文中进一步界定该祭的作用机制，以免消除原词可能兼具除罪与洁净层面的语义张力。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语，保留献祭清单的短句形式。逗号体现祭物与用途之间的列举关系。
