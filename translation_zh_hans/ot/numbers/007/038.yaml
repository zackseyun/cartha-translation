  text: one gold dish[a], ten shekels[b], full of incense.
translation:
  language: zh_hans
  text: 一个金盘[a]，重十舍客勒[b]，盛满香料。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“碗”或“调羹”。这里指一种小型器皿。
    reason: lexical_alternative
  - marker: b
    text: 原文直译近于“十金”；本节省略了重量单位。根据上下文，所指为重十舍客勒的黄金。
    reason: clarity
lexical_decisions:
- source_word: כַּף
  choice: 碟
  rationale: 这里指盛放祭物的小型器皿，而不是“手掌”。“碟”在现代汉语中自然，也可避免传统译法“调羹”使人误以为是普通餐具。
- source_word: אַחַת
  choice: 一个
  rationale: 阴性基数词，修饰כַּף，直接译出数量。
- source_word: עֲשָׂרָה זָהָב
  choice: 重十舍客勒
  rationale: 原文是省略重量单位的简略表达，直译近于“十〔之〕金”；依据本章紧邻上下文和平行句式，所指为器皿所用黄金的重量，单位是舍客勒。正文补出单位并用“重”明确其句法功能。
- source_word: מְלֵאָה
  choice: 盛满了
  rationale: 谓语形容词与כַּף一致，说明器皿中的内容；“盛满了”符合汉语描述容器的习惯。
- source_word: קְטֹרֶת
  choice: 香
  rationale: 指敬拜礼仪中焚烧的芳香物质；“香”是简洁、通行且符合本段祭仪语境的译法。
