  text: He gave the two carts and the four cattle to the sons of Gershon[b][a], according to their service.
translation:
  language: zh_hans
  text: 他把两辆车[a]和四头牛[b]给了革顺的子孙，照着他们的职务。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“运载用的车”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来语使用牛类牲畜的集合称呼；按这里的用途，也可理解为拉车的牛，但原文没有限定性别。
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעֲגָלֹת
  choice: 车
  rationale: עֲגָלָה指运输用的车或货运车。“车”在现代汉语中简洁自然；结合上下文，可清楚理解为搬运会幕物件所用的车辆。
- source_word: הַבָּקָר
  choice: 牛
  rationale: בָּקָר是牛类牲畜的集合称呼。此处这些牛用于牵引车辆，但原文没有明确限定性别；译作“牛”可避免过度具体化。
- source_word: לִבְנֵי גֵרְשׁוֹן
  choice: 革顺的子孙
  rationale: 保留希伯来语“革顺之子”的亲属群体表达；“子孙”在现代中文中比直译“儿子们”更能自然表达其宗族后裔。
- source_word: כְּפִי עֲבֹדָתָם
  choice: 按照他们所承担的服事
  rationale: כְּפִי表示“按照、与……相称”，עֲבֹדָה在此指利未人获派的会幕服事。“所承担的”使中文关系清楚，又不把原文具体化为某一种工作。
- source_word: נָתַן
  choice: 他把……给了
  rationale: 直接表达נָתַן“给”的普通含义，不另行加入“分配”或“指派”的解释。
