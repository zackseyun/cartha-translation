  text: קָרְבָּנ֞/וֹ קַֽעֲרַת כֶּ֣סֶף אַחַ֗ת שְׁלֹשִׁ֣ים וּ/מֵאָה֮ מִשְׁקָלָ/הּ֒ מִזְרָ֤ק אֶחָד֙ כֶּ֔סֶף שִׁבְעִ֥ים שֶׁ֖קֶל בְּ/שֶׁ֣קֶל הַ/קֹּ֑דֶשׁ שְׁנֵי/הֶ֣ם מְלֵאִ֗ים סֹ֛לֶת בְּלוּלָ֥ה בַ/שֶּׁ֖מֶן לְ/מִנְחָֽה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/067.yaml
  text: His offering was one silver plate[a], its weight one hundred thirty shekels, one silver basin of seventy shekels, according to the shekel of the sanctuary[c][b]; both of them were full of fine flour mixed with oil for a grain offering.
translation:
  language: zh_hans
  text: 他的供物是：一个银盘[a]，重一百三十舍客勒；一个银盆[b]，重七十舍客勒，都是按圣所的舍客勒[c]计算。两个器皿都盛满了调油的细面，作素祭。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “盘”或译“碟”，指献礼清单中的一种浅器皿。
    reason: lexical_alternative
  - marker: b
    text: “盆”或译“碗”，指祭礼所用的器皿。
    reason: lexical_alternative
  - marker: c
    text: 即按照圣所规定的标准重量。
    reason: cultural_note
lexical_decisions:
- source_word: קָרְבָּנוֹ
  choice: 他的供物是
  rationale: קָרְבָּן在礼仪语境中指献上的供物；“供物”既准确又符合现代中文圣经语体。
- source_word: קַעֲרַת כֶּסֶף אַחַת
  choice: 一个银盘
  rationale: קְעָרָה指较浅的盘状器皿；“银盘”简洁自然，并保留器皿形态。
- source_word: שְׁלֹשִׁים וּמֵאָה מִשְׁקָלָהּ
  choice: 重一百三十舍客勒
  rationale: 将希伯来文“它的重量是一百三十”自然表达为中文重量说明。
- source_word: מִזְרָק אֶחָד כֶּסֶף
  choice: 一个银盆
  rationale: מִזְרָק是祭礼中使用的容器；“盆”比日常性的“碗”更能体现其较大的礼仪器皿性质。
- source_word: שִׁבְעִים שֶׁקֶל
  choice: 重七十舍客勒
  rationale: 原文在名词短语中直接给出重量；中文补出“重”以明确其计量关系。
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: 都是按圣所的舍客勒计算
  rationale: 该短语表示采用圣所规定的标准重量；“按……计算”清楚传达计量标准，而不把“舍客勒”误解为单纯的钱币。
- source_word: שְׁנֵיהֶם מְלֵאִים
  choice: 两个器皿都盛满了
  rationale: 明确复数所指为前述银盘和银盆，并保留“两者都满”的强调。
- source_word: סֹלֶת
  choice: 细面
  rationale: סֹלֶת指献祭所用的精细面粉；“细面”是准确、简练且易懂的祭礼用语。
- source_word: בְּלוּלָה בַשֶּׁמֶן
  choice: 调油的
  rationale: 被动分词表示细面与油混合；“调油的细面”自然简洁。
- source_word: לְמִנְחָה
  choice: 作素祭
  rationale: 在祭司礼仪语境中，מִנְחָה特指以谷物为主的祭物；“素祭”是简洁且通行的中文名称。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的中文，并保留本节礼物清单的整齐节奏。将重量单位“舍客勒”音译保留，以脚注解释“圣所的舍客勒”是计量标准；标点略作调整，使计量标准自然统摄两个银器的重量。
