  yaml_path: translation/ot/numbers/007/010.yaml
  text: Then the leaders presented the dedication offering for the altar on the day it was anointed[a], and the leaders presented their offering before the altar.
translation:
  language: zh_hans
  text: 众首领在祭坛受膏的那一天，为祭坛的奉献礼献上供物；众首领把他们的供物献在祭坛前。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּקְרִיבוּ
  choice: 献上了／献在
  rationale: קרב 的使役式在献祭语境中指把礼物或祭物带到近前献上。中文用“献上”自然地保留礼仪含义；第二处依句法译作“献在祭坛前”。
- source_word: הַנְּשִׂאִים
  choice: 众首领
  rationale: 本词在《民数记》中指各支派的领袖。“首领”比“王子”更符合其身份，也保持庄重而清楚的现代汉语表达。
- source_word: חֲנֻכַּת הַמִּזְבֵּחַ
  choice: 祭坛的奉献礼
  rationale: חֲנֻכָּה 的基本含义是奉献、启用或奉献礼。原文直接以“祭坛的奉献礼”为宾语，没有明说“奉献礼物”，因此正文保留这一凝练表达，并用脚注说明语境所指。
- source_word: בְּיוֹם הִמָּשַׁח אֹתוֹ
  choice: 在祭坛受膏的那一天
  rationale: 介词 בְּ 加不定式结构表示时间；“受膏”准确反映被动意义，明确“祭坛”为所指对象，避免中文代词含混。
- source_word: קָרְבָּנָם
  choice: 自己的供物
  rationale: קָרְבָּן 泛指带到上帝面前的礼物或祭物。此处“供物”既有礼仪色彩，又不把它限定为某一种祭；用“自己的”自然表达复数主体共同各献其物。
- source_word: לִפְנֵי הַמִּזְבֵּחַ
  choice: 在祭坛前
  rationale: לִפְנֵי 在这里表示空间位置；“在祭坛前”是现代汉语中清楚自然的表达。
theological_decisions: []
translation_notes:
  register: 采用庄重、自然的现代标准汉语。“奉献礼”指祭坛奉献启用的礼仪，避免只译作“奉献物”而抹去原文的抽象表达；后半句用“他们”承接“众首领”，减少中文中不必要的重复，同时不改变指代。
