  rationale: 修订解决了正文中“献上奉献礼”的汉语搭配问题，保留原文的时间、受膏对象、两次主语重复、供物及其在祭坛前呈献等要素。脚注标示在正文为自然汉语而作出的语境性展开，并保留原文名词结构的字面歧义。
