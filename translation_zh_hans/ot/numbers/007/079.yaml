base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/079.yaml
  text: His offering was one silver plate[a], its weight one hundred thirty shekels, one silver basin of seventy shekels, according to the sanctuary shekel[b]; both of them full of fine flour mixed with oil for a grain offering.
translation:
  language: zh_hans
  text: 他的供物是：一个银盘[a]，重一百三十舍客勒；一个银盆[b]，重七十舍客勒，都是按圣所的舍客勒计算；两个器皿都盛满了用油调和的细面，作为素祭。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“一个银碗”。希伯来语 קַעֲרָה 指一种器皿，其确切形状不能完全确定。
    reason: lexical_alternative
  - marker: b
    text: 或译“一个银钵”。希伯来语 מִזְרָק 可指与洒血等礼仪用途有关的器皿。
    reason: lexical_alternative
lexical_decisions:
- source_word: קָרְבָּנוֹ
  choice: 他的供物
  rationale: קָרְבָּן 指带到上帝面前献上的礼物或祭物；“供物”在此祭祀语境中准确、自然，也不把它限定为某一种祭。
- source_word: קַעֲרַת כֶּסֶף אַחַת
  choice: 一个银盘
  rationale: קַעֲרָה 指一种盛物的器皿，可能较浅；正文采用简明的“银盘”，并以脚注保留其形状不完全确定这一点。
- source_word: שְׁלֹשִׁים וּמֵאָה מִשְׁקָלָהּ
  choice: 重一百三十舍客勒
  rationale: 原文直陈“它的重量是一百三十”；译为“重一百三十舍客勒”符合现代汉语，并完整表达重量。
- source_word: מִזְרָק אֶחָד כֶּסֶף
  choice: 一个银盆
  rationale: מִזְרָק 是礼仪中使用的容器，可能与洒血有关；“银盆”既自然又避免在正文中过度限定其具体用途。
- source_word: שִׁבְעִים שֶׁקֶל
  choice: 重七十舍客勒
  rationale: 该短语说明银盆的重量；补出“重”使汉语关系清楚。
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: 都是按圣所的舍客勒计算
  rationale: 这是祭司文献中的标准重量公式，说明两件银器均依圣所采用的舍客勒标准计量。
- source_word: שְׁנֵיהֶם מְלֵאִים
  choice: 两个器皿都盛满了
  rationale: 明确保留 שְׁנֵיהֶם 对前述两件器皿的共同指称；“盛满了”自然表达其装载内容的状态。
- source_word: סֹלֶת בְּלוּלָה בַשֶּׁמֶן
  choice: 调油的细面
  rationale: סֹלֶת 是祭物所用的精细面粉，בְּלוּלָה 表示与油混合；“调油的细面”简洁且符合现代祭祀语境。
- source_word: לְמִנְחָה
  choice: 作素祭
  rationale: 在此祭司礼仪语境中，מִנְחָה 是以细面等为主要材料的祭类；“素祭”是简明且明确的中文术语。
