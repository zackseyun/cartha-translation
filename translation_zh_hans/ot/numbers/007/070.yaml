translation:
  language: zh_hans
  text: 一只公山羊作赎罪祭[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“作为赎罪祭。”希伯来语 חַטָּאת 可指“罪”，在本节这样的献祭语境中则可指“赎罪祭”。
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂעִיר עִזִּים
  choice: 公山羊
  rationale: 该组合是指山羊中的雄性，现代汉语用“公山羊”自然清楚，也保留了祭牲种类与性别的信息。
- source_word: אֶחָד
  choice: 一只
  rationale: 该数词直接计数祭牲；用量词“只”符合现代汉语，并保留民数记第7章清单式的重复表达。
- source_word: לְחַטָּאת
  choice: 作赎罪祭
  rationale: חַטָּאת 在献祭语境中指赎罪祭，前缀 לְ 在此表示用途或功用；“作赎罪祭”简洁自然，适合祭物清单。
theological_decisions:
- issue: 献祭语境中 חַטָּאת 的译法
  choice: 赎罪祭
  alternative: 罪；为罪
  rationale: 本节属于祭物清单，因此语境要求采用该词的祭祀含义；仅译为“罪”或“为罪”会弱化其所指的特定祭物。不过脚注保留希伯来词本义与语境义之间的词义关系。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语，保持原文祭物清单的短句形式。“一只公山羊”避免古雅的“公山羊羔”等不必要增译；“作赎罪祭”符合当代中文圣经语体。
