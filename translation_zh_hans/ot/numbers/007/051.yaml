translation:
  language: zh_hans
  text: 一头公牛犊，一只公绵羊，一只一岁的公羔羊，作燔祭；
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פַּר בֶּן־בָּקָר
  choice: 公牛犊
  rationale: פַּר指公牛或幼公牛，בֶּן־בָּקָר进一步表明它属于牛群中的幼牛；现代中文祭物清单中合译为“公牛犊”自然、准确，也避免生硬直译为“牛群之子”。
- source_word: אַיִל
  choice: 公绵羊
  rationale: 该词是献祭语境中成年雄性绵羊的常用称谓；“公绵羊”清楚区别于后面的羊羔。
- source_word: כֶּבֶשׂ
  choice: 公羊羔
  rationale: 该词指羊羔，在此献祭清单中为雄性；译作“公羊羔”明确其性别，并符合现代汉语。
- source_word: בֶּן־שְׁנָתוֹ
  choice: 一岁的
  rationale: 字面为“其年之子”，是表示处于一岁或第一年内的惯用语；正文采用自然的“一岁的”。
- source_word: לְעֹלָה
  choice: 作燔祭
  rationale: עֹלָה指整只焚烧献上的祭物，是固定的献祭类别；“作燔祭”简洁并适合清单句式。
- source_word: אֶחָד
  choice: 一头／一只
  rationale: 原文在每种动物后重复数词“一”；中文依动物量词分别译为“一头”和“一只”，保留逐项计数。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。保留献祭术语“燔祭”，并按中文习惯使用动物量词；句末分号承接上下文中的供物清单。
