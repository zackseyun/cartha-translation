base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/085.yaml
  text: each silver plate weighing one hundred thirty shekels, and each basin seventy; all the silver of the vessels was two thousand four hundred shekels, by the shekel of the sanctuary.
translation:
  language: zh_hans
  text: 每个银盘重一百三十舍客勒，每个银碗重七十舍客勒；这些器皿所用的银子共重二千四百舍客勒，均按圣所的舍客勒为准[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“按圣所的舍客勒标准称量。”
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁלֹשִׁים וּמֵאָה
  choice: 一百三十
  rationale: 希伯来语字面次序为“三十和一百”，按现代汉语数词习惯译为“一百三十”。
- source_word: הַקְּעָרָה הָאַחַת
  choice: 每个银盘
  rationale: 在本章重复列举供物的清单语境中，带定冠词的单数名词和数词具有逐一分配的含义；קְעָרָה在此指盘。
- source_word: כֶּסֶף
  choice: 银
  rationale: 这里指器皿的材质，而不是货币；与“盘”组合译为“银盘”。
- source_word: וְשִׁבְעִים
  choice: 七十舍客勒
  rationale: 原文直接给出数值，重量单位由上下文及本句末尾的称量标准补明；为使现代汉语清楚，在此补出“舍客勒”。
- source_word: הַמִּזְרָק הָאֶחָד
  choice: 每个银碗
  rationale: 单数形式在清单语境中作逐一分配理解。מִזְרָק指礼仪用的碗或盆；结合上下文中的银质器皿，译为“银碗”。
- source_word: כֹּל כֶּסֶף הַכֵּלִים
  choice: 这些器皿的银子共重
  rationale: כֹּל表示总量，כֵּלִים指器皿；汉语用“共重”自然表达所用银子的总重量。
- source_word: אַלְפַּיִם וְאַרְבַּע מֵאוֹת
  choice: 二千四百
  rationale: 按现代汉语数词习惯表达总数。
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: 按圣所的舍客勒计算
  rationale: 介词בְּ在这里说明称量所依据的标准；该译法既保留“圣所的舍客勒”这一结构，也用自然汉语交代其计量功能。
theological_decisions: []
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。保留古代重量单位“舍客勒”，并用“重”“计算”明确本节是在说明各器皿及其银料总量的重量。
