- source_word: שְׂעִיר עִזִּים
  choice: 公山羊
  rationale: 这个希伯来语组合是指公的山羊；“公山羊”是现代汉语中自然、明确的表达，也保留了祭牲性别的具体信息。
- source_word: אֶחָד
  choice: 一只
  rationale: 原文明确使用数词“一”；按汉语习惯加量词“只”，并保留民数记第7章清单式叙述的重复节奏。
- source_word: לְחַטָּאת
  choice: 作赎罪祭
  rationale: חַטָּאת在献祭语境中指赎罪祭，而非抽象的“罪”；介词לְ在此表示用途，用“作”简洁自然。
