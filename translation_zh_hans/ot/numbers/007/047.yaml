base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/047.yaml
  text: 'and for the sacrifice of peace offerings: two cattle[a], five rams, five male goats, five one-year-old lambs. This was the offering of Eliasaph son of Deuel.'
translation:
  language: zh_hans
  text: 作平安祭[a]的祭牲有两头牛、五只公绵羊、五只公山羊、五只一岁的羊羔。这是丢珥的儿子以利雅萨的供物。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “平安祭”也可译作“团契祭”或“福祉祭”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/זֶבַח הַשְּׁלָמִים
  choice: 作平安祭的
  rationale: 前缀וּ和לְ承接供物清单，并引出祭牲用途；译为“作……祭的”符合现代汉语列举方式。שְׁלָמִים采用汉语圣经传统且易懂的祭祀术语“平安祭”，同时以脚注保留其“团契祭／福祉祭”的语义可能。
- source_word: בָּקָר שְׁנַיִם
  choice: 两头牛
  rationale: בָּקָר是牛类牲畜的集合称谓，原文此处未限定性别；“两头牛”既自然又不作过度限定。
- source_word: אֵילִם חֲמִשָּׁה
  choice: 五只公绵羊
  rationale: אֵילִם明确指公绵羊；如此译出可与后面的公山羊区别。
- source_word: עַתֻּדִים חֲמִשָּׁה
  choice: 五只公山羊
  rationale: עַתֻּדִים特指雄性山羊，“公山羊”准确保留牲畜种类和性别。
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה חֲמִשָּׁה
  choice: 五只一岁的羊羔
  rationale: בְּנֵי שָׁנָה直译为“一岁之子”，表示满一年左右的年龄要求；“一岁的羊羔”是自然、清楚的现代汉语。
- source_word: זֶה קָרְבַּן
  choice: 这是……的供物
  rationale: 希伯来语使用无系词的名词句，时间意义由上下文决定；汉语用“这是”自然地保留原文陈述形式。קָרְבַּן在献祭语境中译为“供物”。
- source_word: אֶלְיָסָף בֶּן דְּעוּאֵל
  choice: 丢珥的儿子以利雅萨
  rationale: 按现代中文圣经常用音译处理人名，并以自然汉语表达父子关系。
theological_decisions:
- issue: שְׁלָמִים这一祭名的语义
  choice: 正文采用“平安祭”
  alternative: “团契祭”或“福祉祭”
  rationale: 该词可关联平安、完整、福祉及献祭者与上帝共享祭宴的团契层面。正文采用中文读者熟悉的“平安祭”，但不把其全部意义缩减为单一神学解释，故在脚注列出其他可能译法。
translation_notes:
  register: 采用庄重而自然的现代标准汉语，保持祭物清单的简洁节奏。量词按现代汉语习惯补出；对牛不添加原文没有说明的性别。脚注标记置于本节末尾，以免打断清单，同时明确对应“平安祭”这一词语。
