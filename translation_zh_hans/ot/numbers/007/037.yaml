  text: קָרְבָּנ֞/וֹ קַֽעֲרַת כֶּ֣סֶף אַחַ֗ת שְׁלֹשִׁ֣ים וּ/מֵאָה֮ מִשְׁקָלָ/הּ֒ מִזְרָ֤ק אֶחָד֙ כֶּ֔סֶף שִׁבְעִ֥ים שֶׁ֖קֶל בְּ/שֶׁ֣קֶל הַ/קֹּ֑דֶשׁ שְׁנֵי/הֶ֣ם מְלֵאִ֗ים סֹ֛לֶת בְּלוּלָ֥ה בַ/שֶּׁ֖מֶן לְ/מִנְחָֽה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/037.yaml
  text: His offering was one silver plate[a], its weight one hundred thirty shekels, one silver basin of seventy shekels, by the shekel of the sanctuary[c][b]; both of them were full of fine flour mixed with oil for a grain offering.
translation:
  language: zh_hans
  text: 他的供物是：一个银盘[a]，重一百三十舍客勒；一个银盆[b]，重七十舍客勒；两者的重量都按圣所的舍客勒[c]计算。两个器皿都盛满了用油调和的细面，作为素祭。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “盘”或译“碟”或“浅碗”；希伯来语所指是一种较浅的器皿。
    reason: lexical_alternative
  - marker: b
    text: “盆”或译“洒血盆”；这种器皿在其他礼仪场合可用于洒血。
    reason: lexical_alternative
  - marker: c
    text: “圣所的舍客勒”指圣所采用的标准重量。
    reason: cultural_note
lexical_decisions:
- source_word: קָרְבָּנוֹ
  choice: 他的供物
  rationale: קָרְבָּן指带来献上的礼物或祭物；在此敬拜礼仪清单中译作“供物”，自然且不把它限缩为某一种祭。
- source_word: קַעֲרַת כֶּסֶף אַחַת
  choice: 一个银盘
  rationale: קְעָרָה可指盘、碟或浅碗；“银盘”符合器皿清单的语境，并以脚注保留较宽泛的可能。
- source_word: שְׁלֹשִׁים וּמֵאָה מִשְׁקָלָהּ
  choice: 重一百三十舍客勒
  rationale: 希伯来文直陈“它的重量”为一百三十；汉语用“重……”简洁自然。
- source_word: מִזְרָק אֶחָד כֶּסֶף
  choice: 一个银盆
  rationale: מִזְרָק是礼仪中使用的盆或碗，有时用于洒血；正文用不额外限定用途的“银盆”，脚注说明另一译法。
- source_word: שִׁבְעִים שֶׁקֶל
  choice: 重七十舍客勒
  rationale: 该短语说明银盆的重量；补出“重”使汉语关系清楚。
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: 都是按圣所的舍客勒计算
  rationale: 该短语规定两个重量所依据的圣所标准；“按……计算”传达计量标准，而非货币价值。
- source_word: שְׁנֵיהֶם מְלֵאִים
  choice: 两个器皿都盛满了
  rationale: שְׁנֵיהֶם明确回指前述两个器皿；译出“器皿”可使现代汉语指代清晰。
- source_word: סֹלֶת בְּלוּלָה בַשֶּׁמֶן
  choice: 调油的细面
  rationale: סֹלֶת是祭礼所用的精细面粉，בְּלוּלָה指与油调和；“调油的细面”简练并符合汉语祭礼表述。
- source_word: לְמִנְחָה
  choice: 作素祭
  rationale: 在祭司礼仪语境中，מִנְחָה特指以细面等献上的非血祭；“素祭”是简洁且广为理解的中文术语。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。用分号区分两件银器，并把重量标准明确关联到两者；保留“舍客勒”这一古代重量单位，不擅自换算。“供物”与“素祭”加以区分：前者统称本节所献之物，后者专指器皿中调油细面的祭类。
