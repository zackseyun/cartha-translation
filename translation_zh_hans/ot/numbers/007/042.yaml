  yaml_path: translation/ot/numbers/007/042.yaml
  text: 'On the sixth day[b][a], the leader of the sons of Gad was Eliasaph son of Deuel:'
translation:
  language: zh_hans
  text: 第六日，迦得子孙[a]的首领是丢珥[b]的儿子以利雅萨：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“迦得的众子”，这里指迦得的后裔，也就是迦得支派。
    reason: lexical_alternative
  - marker: b
    text: 本节希伯来文本作“丢珥”；另参相关经文中写作“流珥”的地方。
    reason: alternative_reading
lexical_decisions:
- source_word: בַּיּוֹם הַשִּׁשִּׁי
  choice: 第六日
  rationale: 介词 בְּ 与“日”构成时间表达；现代汉语用“第六日”自然地表达叙事中的日期顺序。
- source_word: נָשִׂיא
  choice: 首领
  rationale: 此词在民数记7章指一个支派正式承认的领袖；“首领”既体现其地位，也避免“王子”所带来的王室含义。
- source_word: לִבְנֵי גָד
  choice: 迦得子孙的
  rationale: 介词 לְ 在这里表示首领与该支派群体的关系；“迦得子孙”保留希伯来文以家族后裔称呼支派的表达。
- source_word: אֶלְיָסָף
  choice: 以利雅萨
  rationale: 按现代中文圣经人名的惯用音译处理。
- source_word: בֶּן
  choice: ……的儿子
  rationale: 这是希伯来文标准的父子谱系表达，中文以“某人的儿子”自然对应。
- source_word: דְּעוּאֵל
  choice: 丢珥
  rationale: 本节马所拉文本的辅音形式为 דְּעוּאֵל，对应“丢珥”；相关经文中另见“流珥”这一形式，故以脚注说明。
