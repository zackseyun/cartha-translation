- source_word: שְׂעִיר עִזִּים
  choice: 公山羊
  rationale: 该组合在祭祀清单中指雄性的山羊。译作“公山羊”既明确性别，也符合现代汉语的自然表达，无须逐字重复“山羊中的山羊”。
- source_word: אֶחָד
  choice: 一只
  rationale: 该词表示数量“一”；配合动物使用量词“只”，保留本章献物清单的列举形式。
- source_word: לְחַטָּאת
  choice: 作赎罪祭
  rationale: חַטָּאת在此祭祀语境中指特定祭类，而非抽象的“罪”；前缀לְ在清单公式中表示用途或身份，译作“作”简洁自然。
theological_decisions:
- issue: 祭祀术语חַטָּאת的翻译
  choice: 赎罪祭
  alternative: 为罪；除罪祭
  rationale: 上下文是祭物清单，因此该词指规定的祭祀类别。“赎罪祭”是现代中文圣经语境中清楚且通行的表达，也避免把它误解为抽象的罪本身；原词可能涉及洁净或除罪功能，但本短句不宜在正文中额外展开。
