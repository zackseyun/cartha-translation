base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/012.yaml
  text: And the one presenting his offering on the first day was Nahshon son of Amminadab[a], of the tribe of Judah.
translation:
  language: zh_hans
  text: 第一天献上供物的是亚米拿达的儿子拿顺，属犹大支派。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “属犹大支派”也可按上下文译为“代表犹大支派”或“为犹大支派”。希伯来语介词可表示支派归属，也可在此类首领献礼的语境中带有代表该支派的意思。
    reason: 保留לְמַטֵּה יְהוּדָה的归属表达及其语境中的代表性理解，避免在正文中排除其中一种可能。
lexical_decisions:
- source_word: וַיְהִי
  choice: 是
  rationale: 这里的叙事结构用于引出第一天献礼者的身份；现代汉语用“是”构成判断句，既自然，也无需照搬“事情发生了”之类的形式。
- source_word: הַמַּקְרִיב
  choice: 献上……的是
  rationale: 使役词干的分词指把供物带近、呈献的人。“献上”符合敬拜礼仪语境，并以“……的是”保留分词作为人物称谓的作用。
- source_word: בַּיּוֹם הָרִאשׁוֹן
  choice: 第一天
  rationale: 按上下文指奉献礼开始后的第一天；现代汉语时间短语无需加介词。
- source_word: אֶת קָרְבָּנוֹ
  choice: 自己的供物
  rationale: קָרְבָּן在此指为会幕奉献礼呈献的礼物或祭礼性供物。“供物”保留礼仪色彩；“自己的”清楚表达第三人称所有后缀。
- source_word: נַחְשׁוֹן
  choice: 拿顺
  rationale: 采用现代中文圣经人名的通行音译。
- source_word: בֶּן עַמִּינָדָב
  choice: 亚米拿达的儿子
  rationale: 直接、自然地表达希伯来语父系身份结构。
- source_word: לְמַטֵּה יְהוּדָה
  choice: 他代表犹大支派
  rationale: 介词לְ在此可表达归属或代表关系。上下文中各首领按支派献礼，因此正文用“代表”清楚传达拿顺为犹大支派献礼，同时用脚注保留较贴近形式的译法。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“供物”比“礼物”更能体现会幕奉献礼的礼仪语境，又不把本节未明确限定的供物一概译成“祭物”。句式简洁，与随后逐日列举各支派献礼者的叙事节奏相称。
