    reason: lexical_alternative
lexical_decisions:
- source_word: כַּף
  choice: 盘
  rationale: 在会幕礼仪器具的语境中，指盛放香料的小型容器；译作“盘”自然具体，也避免按通常词义误解为“手掌”。
- source_word: אַחַת
  choice: 一个
  rationale: 阴性数词，与כַּף呼应，直接表示数量“一”。
- source_word: עֲשָׂרָה זָהָב
  choice: 重十舍客勒的金
  rationale: 原文直译近于“金，十”，计量单位省略；紧邻经文反复出现的献礼清单表明这里说的是器皿所用金子的重量为十舍客勒。
- source_word: מְלֵאָה
  choice: 盛满了
  rationale: 该阴性形容词与器皿名词呼应；结合所盛之物，中文用“盛满了”比单说“满有”更自然。
- source_word: קְטֹרֶת
  choice: 香
  rationale: 指圣所礼仪中焚烧的芳香物质；“香”是简洁而惯用的中文表达。
