  text: בַּ/יּוֹם֙ הַ/שְּׁמִינִ֔י נָשִׂ֖יא לִ/בְנֵ֣י מְנַשֶּׁ֑ה גַּמְלִיאֵ֖ל בֶּן פְּדָה צֽוּר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/054.yaml
  text: On the eighth day[a], the leader of the sons of Manasseh was Gamaliel son of Pedahzur.
translation:
  language: zh_hans
  text: 第八日，玛拿西子孙[a]的首领是比大蓿的儿子迦玛列。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “玛拿西子孙”是支派称呼，指玛拿西的后裔，也就是玛拿西支派。
    reason: cultural_note
lexical_decisions:
- source_word: בַּיּוֹם הַשְּׁמִינִי
  choice: 第八日
  rationale: 介词 בְּ 与“日”及序数词构成时间表达；“第八日”自然、庄重，也不补入本节未明说的“奉献礼”等背景。
- source_word: נָשִׂיא
  choice: 首领
  rationale: 此处指支派中受认可的领袖；“首领”符合民数记语境，也避免“王子”可能带来的王室含义。
- source_word: לִבְנֵי מְנַשֶּׁה
  choice: 玛拿西子孙的
  rationale: 保留 בְּנֵי 的亲族—支派表达；介词 לְ 在这里标明该首领所属或所代表的群体，汉语用“……的首领”最自然。
- source_word: מְנַשֶּׁה
  choice: 玛拿西
  rationale: 采用现代中文圣经中通行的人名及支派名译法。
- source_word: גַּמְלִיאֵל
  choice: 迦玛列
  rationale: 采用现代中文圣经中通行的人名译法。
- source_word: בֶּן
  choice: ……的儿子
  rationale: 这是标准的父系称名结构；译为“……的儿子”准确而自然。
- source_word: פְּדָה צוּר
  choice: 比大蓿
  rationale: 该复合专名按现代中文圣经通行形式音译为一个名字。
