  text: הִקְרִ֨ב אֶת קָרְבָּנ֜/וֹ קַֽעֲרַת כֶּ֣סֶף אַחַ֗ת שְׁלֹשִׁ֣ים וּ/מֵאָה֮ מִשְׁקָלָ/הּ֒ מִזְרָ֤ק אֶחָד֙ כֶּ֔סֶף שִׁבְעִ֥ים שֶׁ֖קֶל בְּ/שֶׁ֣קֶל הַ/קֹּ֑דֶשׁ שְׁנֵי/הֶ֣ם מְלֵאִ֗ים סֹ֛לֶת בְּלוּלָ֥ה בַ/שֶּׁ֖מֶן לְ/מִנְחָֽה־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/019.yaml
  text: 'He presented his offering: one silver plate[a], its weight one hundred thirty shekels; one silver basin, seventy shekels, by the shekel of the sanctuary[c][b]; both of them full of fine flour mixed with oil for a grain offering.'
translation:
  language: zh_hans
  text: 他献上供物：一个银盘[a]，重一百三十舍客勒；一个银盆[b]，重七十舍客勒，都是按圣所的舍客勒[c]计算；两个器皿都盛满了调油的细面，作素祭。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “银盘”或译“银碟”。
    reason: lexical_alternative
  - marker: b
    text: “银盆”或译“银碗”。
    reason: lexical_alternative
  - marker: c
    text: “按圣所的舍客勒”指采用圣所规定的标准重量。
    reason: cultural_note
lexical_decisions:
- source_word: הִקְרִב אֶת קָרְבָּנוֹ
  choice: 他献上供物
  rationale: הִקְרִב在奉献礼仪语境中指将供物带近、呈献；“献上供物”自然庄重，也保留祭祀语义。
- source_word: קַעֲרַת כֶּסֶף
  choice: 银盘
  rationale: קַעֲרָה指较浅的盛器；“银盘”适合器物清单语境，同时以脚注保留“银碟”的可能。
- source_word: שְׁלֹשִׁים וּמֵאָה מִשְׁקָלָהּ
  choice: 重一百三十舍客勒
  rationale: 以现代汉语简洁表达原文“它的重量为一百三十舍客勒”，所指明确为银盘。
- source_word: מִזְרָק
  choice: 银盆
  rationale: 该词指礼仪中使用的容器，可译为盆或碗；“盆”较能体现其器皿性质，并保留“碗”为脚注备选。
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: 按圣所的舍客勒计算
  rationale: 该短语说明重量采用圣所规定的标准；补出“计算”使现代汉语清楚，而不改变原义。
- source_word: שְׁנֵיהֶם מְלֵאִים
  choice: 两个器皿都盛满了
  rationale: 明确双数所指为前述银盘与银盆，符合汉语表达并保留“两者皆满”的信息。
- source_word: סֹלֶת בְּלוּלָה בַשֶּׁמֶן
  choice: 调油的细面
  rationale: סֹלֶת是祭物所用的精细面粉，בְּלוּלָה表示与油混合；“调油的细面”简洁、自然且符合礼仪语境。
- source_word: לְמִנְחָה
  choice: 作素祭
  rationale: 在祭司礼仪文本中，מִנְחָה特指以谷物为主的祭物；“素祭”是准确而通行的中文圣经术语。
theological_decisions: []
