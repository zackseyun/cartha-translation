lexical_decisions:
- source_word: בַּיּוֹם הָעֲשִׂירִי
  choice: 第十天
  rationale: 介词 בְּ 与“日”连用，在此献礼次序中表示时间；现代汉语直接说“第十天”最自然。
- source_word: נָשִׂיא
  choice: 首领
  rationale: 指一个支派公认的领袖或代表；“首领”既符合民数记的语境，也避免“王子”等词可能带来的王室含义。
- source_word: לִבְנֵי דָן
  choice: 代表但子孙的
  rationale: 介词 לְ 标明该首领所代表、所属的群体；加入“代表”可自然表达关系，同时保留 בְּנֵי 的家族性称呼“子孙”。
- source_word: אֲחִיעֶזֶר
  choice: 亚希以谢
  rationale: 按现代中文圣经人名的通行译名音译。
- source_word: בֶּן
  choice: ……的儿子
  rationale: 这是标准父子谱系结构，直译为“……的儿子”。
- source_word: עַמִּישַׁדָּי
  choice: 亚米沙代
  rationale: 按现代中文圣经人名的通行译名音译。
