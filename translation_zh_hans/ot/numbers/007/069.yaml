  text: one bull from the herd[a], one ram, one male lamb a year old, for a burnt offering[b];
translation:
  language: zh_hans
  text: 一头公牛，一只公绵羊，一只一岁的公羊羔，作燔祭；
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פַּר אֶחָד בֶּן בָּקָר
  choice: 一头公牛
  rationale: פַּר指公牛或青年公牛；בֶּן בָּקָר是说明其属于牛类的惯用表达。现代汉语用“一头公牛”已自然涵盖其类别，避免生硬重复为“一头牛群之子”。
- source_word: אַיִל אֶחָד
  choice: 一只公绵羊
  rationale: אַיִל是成年雄性绵羊；译作“公绵羊”既准确，又与下文较幼小的公羊羔形成清楚区别。
- source_word: כֶּבֶשׂ אֶחָד בֶּן שְׁנָתוֹ
  choice: 一只一岁的公羊羔
  rationale: כֶּבֶשׂ指羊羔，在献祭语境中为雄性；בֶּן שְׁנָתוֹ表示一岁或尚在第一年。正文采用自然简洁的“一岁的公羊羔”。
- source_word: לְעֹלָה
  choice: 作燔祭
  rationale: עֹלָה是全牲焚烧献上的祭，汉语圣经传统称“燔祭”；“作燔祭”符合本节祭物清单的句法。
- source_word: אֶחָד
  choice: 一头／一只
  rationale: 各项均重复数词“一”；按现代汉语为不同牲畜搭配自然量词，同时保留逐项计数的清单结构。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而简明的祭物清单体。量词依汉语习惯处理：牛用“头”，羊用“只”。不为希伯来语惯用分类语“牛群之子”另设脚注，因为“一头公牛”已完整传达本句信息，且不存在影响理解的实质性歧义。
