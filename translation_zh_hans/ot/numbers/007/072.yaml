  text: On the eleventh day[a], the leader of the sons of Asher was Pagiel son of Ocran.
translation:
  language: zh_hans
  text: 第十一天，亚设子孙的首领是俄兰的儿子帕结。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּיוֹם ... יוֹם
  choice: 第十一天
  rationale: 希伯来语以“在日……日”的重复形式引出日期，是民数记第7章反复使用的叙事格式；现代汉语自然简化为“第十一天”。
- source_word: עַשְׁתֵּי עָשָׂר
  choice: 第十一
  rationale: 此处数词在连续献礼的次序中具有序数功能，译作“第十一”准确而自然。
- source_word: נָשִׂיא
  choice: 首领
  rationale: 此词在本章指代表支派的公认领袖；“首领”符合现代中文语境，也避免“王子”等词可能带来的王室含义。
- source_word: לִבְנֵי אָשֵׁר
  choice: 亚设子孙的
  rationale: 介词ל与“亚设子孙”共同标明首领所属和所代表的群体；保留“子孙”可反映希伯来语的亲族表达。
- source_word: פַּגְעִיאֵל
  choice: 帕结
  rationale: 按现代中文圣经人名的通行音译处理。
- source_word: בֶּן עָכְרָן
  choice: 俄兰的儿子
  rationale: בֶּן直译为“儿子”，构成常见的父子称名格式；עָכְרָן采用中文圣经通行译名“俄兰”。
