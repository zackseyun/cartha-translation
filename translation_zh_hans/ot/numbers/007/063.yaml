translation:
  language: zh_hans
  text: 一头公牛，一只公绵羊，一只一岁公羊羔，作燔祭；
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פַּר אֶחָד בֶּן בָּקָר
  choice: 一头公牛
  rationale: פַּר在献祭语境中指公牛；בֶּן־בָּקָר是表示牛类牲畜的惯用语。现代汉语中“一头公牛”已自然、完整地表达其含义，无须生硬译作“牛群之子”。
- source_word: אַיִל אֶחָד
  choice: 一只公绵羊
  rationale: אַיִל指成年的雄性绵羊。译作“公绵羊”可与后面的公羊羔清楚区分，也避免“公羊”可能泛指雄性山羊的歧义。
- source_word: כֶּבֶשׂ אֶחָד
  choice: 一只公羊羔
  rationale: כֶּבֶשׂ在此献祭清单中指羊羔，并很可能特指雄性；“公羊羔”自然保留了性别信息。
- source_word: בֶּן שְׁנָתוֹ
  choice: 一岁
  rationale: 该希伯来惯用语意为处于出生后的第一年或满一岁左右；正文采用简洁自然的献祭清单用语“一岁”。
- source_word: לְעֹלָה
  choice: 作燔祭
  rationale: עֹלָה是献祭术语，指祭牲全部焚烧献上的燔祭；לְ在此表达用途，译作“作燔祭”。
- source_word: אֶחָד
  choice: 一头／一只
  rationale: 原文在每项祭牲后重复数字“一”。汉语按动物量词分别译作“一头”和“一只”，保留逐项计数的结构。
