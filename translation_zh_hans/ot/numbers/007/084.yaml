base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/084.yaml
  text: 'This was the dedication offering of the altar on the day it was anointed[a], from the leaders of Israel: twelve silver dishes, twelve silver bowls[c][b], and twelve gold pans.'
translation:
  language: zh_hans
  text: 这是祭坛受膏之日，以色列众首领所献的祭坛奉献礼：银盘十二个，银碗十二个，金匙十二个[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这些器皿的具体形制不能完全确定。“银盘、银碗、金匙”也可译作“银浅盘、银盆、金碟（或金勺）”等。
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת חֲנֻכַּת הַמִּזְבֵּחַ
  choice: 这是……为祭坛所献的奉献礼物
  rationale: חֲנֻכָּה本义为“奉献、启用礼”；本节回顾并汇总前文各首领献上的器皿，因此译出语境隐含的“礼物”，同时保留其用于祭坛奉献礼的关系。
- source_word: בְּיוֹם הִמָּשַׁח אֹתוֹ
  choice: 是在祭坛受膏的那一天献上的
  rationale: בְּיוֹם构成时间表达；“受膏”的对象是祭坛。补出“献上的”使中文句法自然，并明确这是对礼物呈献时间的回顾。
- source_word: מֵאֵת נְשִׂיאֵי יִשְׂרָאֵל
  choice: 以色列众首领
  rationale: נָשִׂיא在《民数记》中指各支派公认的领袖；“首领”准确、庄重，也避免“王子”所带来的世袭王族含义。
- source_word: קַעֲרֹת כֶּסֶף
  choice: 银盘
  rationale: קְעָרָה指盘或浅盘一类器皿；译作“盘”可与随后较深的מִזְרָק区分。
- source_word: מִזְרְקֵי כֶסֶף
  choice: 银碗
  rationale: מִזְרָק指礼仪中使用的碗或盆；“碗”符合本章器皿清单的普通现代汉语表达。
- source_word: כַּפּוֹת זָהָב
  choice: 金碟
  rationale: כַּף可指掌形或匙、浅皿状的小器皿；根据本章这些器皿盛香的语境，译作“碟”较自然，但器形并不能完全确定。
- source_word: שְׁתֵּים עֶשְׂרֵה / שְׁנֵים עָשָׂר
  choice: 十二个
  rationale: 三类器皿各为十二件；中文统一用量词“个”，不复制希伯来语的阴阳性配合。
