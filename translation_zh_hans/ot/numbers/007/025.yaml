source:
  edition: WLC
  text: קָרְבָּנ֞/וֹ קַֽעֲרַת כֶּ֣סֶף אַחַ֗ת שְׁלֹשִׁ֣ים וּ/מֵאָה֮ מִשְׁקָלָ/הּ֒ מִזְרָ֤ק אֶחָד֙ כֶּ֔סֶף שִׁבְעִ֥ים שֶׁ֖קֶל בְּ/שֶׁ֣קֶל הַ/קֹּ֑דֶשׁ שְׁנֵי/הֶ֣ם מְלֵאִ֗ים סֹ֛לֶת בְּלוּלָ֥ה בַ/שֶּׁ֖מֶן לְ/מִנְחָֽה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/025.yaml
  text: His offering was one silver plate, its weight one hundred thirty shekels, one silver basin of seventy shekels, by the shekel of the sanctuary; both of them were full of fine flour mixed with oil for a grain offering.
translation:
  language: zh_hans
  text: 他的供物是一个银盘[a]，重一百三十舍客勒；一个银盆[b]，重七十舍客勒，都是按圣所的舍客勒[c]计算。两个器皿都盛满了调油的细面，作素祭。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “银盘”或译“银碟”。
    reason: lexical_alternative
  - marker: b
    text: “银盆”或译“银碗”。
    reason: lexical_alternative
  - marker: c
    text: “按圣所的舍客勒”，意思是按照圣所规定的标准重量。
    reason: cultural_note
lexical_decisions:
- source_word: קָרְבָּנוֹ
  choice: 他的供物是
  rationale: קָרְבָּן指带到上帝面前的礼物或祭物；本节为礼仪清单，用“供物”既保留敬拜语境，也自然衔接后面的器物明细。
- source_word: קַעֲרַת כֶּסֶף אַחַת
  choice: 一个银盘
  rationale: קְעָרָה指盘、碟一类较浅的器皿；“银盘”简洁自然，并以脚注保留“银碟”这一可能译法。
- source_word: שְׁלֹשִׁים וּמֵאָה מִשְׁקָלָהּ
  choice: 重一百三十舍客勒
  rationale: 希伯来文直陈“它的重量是一百三十”；汉语用“重……”表达更自然，同时完整保留数量。
- source_word: מִזְרָק אֶחָד כֶּסֶף
  choice: 一个银盆
  rationale: מִזְרָק指礼仪中使用的盛接或洒液器皿，可译为盆或碗；“银盆”能与前面的浅盘区分，脚注保留“银碗”。
- source_word: שִׁבְעִים שֶׁקֶל
  choice: 重七十舍客勒
  rationale: 该重量修饰银盆；补出“重”符合现代汉语，也与前一器皿的重量表述平行。
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: 都是按圣所的舍客勒计算
  rationale: 该短语规定两个重量所依据的圣所标准；补出“都是”和“计算”，清楚表明其统摄前述两个器皿，同时以脚注解释计量背景。
- source_word: שְׁנֵיהֶם מְלֵאִים
  choice: 两个器皿都盛满了
  rationale: שְׁנֵיהֶם明确指前述两个器皿；补出“器皿”避免代词指向含混，“盛满”符合容器装有细面的语境。
- source_word: סֹלֶת
  choice: 细面
  rationale: סֹלֶת是献祭所用的精细面粉；“细面”是简洁而庄重的礼仪用语。
- source_word: בְּלוּלָה בַשֶּׁמֶן
  choice: 调油的
  rationale: 被动分词表示细面与油混合；“调油的细面”自然简练，准确表达制备方式。
- source_word: לְמִנְחָה
  choice: 作素祭
  rationale: מִנְחָה在祭司礼仪语境中专指以谷物为主要材料的祭物；“素祭”是简明且可辨识的专门译名。
