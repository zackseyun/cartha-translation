source:
  edition: WLC
  text: וּ/בְ/בֹ֨א מֹשֶׁ֜ה אֶל אֹ֣הֶל מוֹעֵד֮ לְ/דַבֵּ֣ר אִתּ/וֹ֒ וַ/יִּשְׁמַ֨ע אֶת הַ/קּ֜וֹל מִדַּבֵּ֣ר אֵלָ֗י/ו מֵ/עַ֤ל הַ/כַּפֹּ֨רֶת֙ אֲשֶׁר֙ עַל אֲרֹ֣ן הָ/עֵדֻ֔ת מִ/בֵּ֖ין שְׁנֵ֣י הַ/כְּרֻבִ֑ים וַ/יְדַבֵּ֖ר אֵלָֽי/ו־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/089.yaml
  text: When Moses went into the tent of meeting to speak with him[a], he heard the voice speaking to him from above the mercy seat that was on the ark of the testimony, from between the two cherubim[c][b]; and he spoke to him.
translation:
  language: zh_hans
  text: 摩西进入会幕，要与他[a]说话时，听见那声音从法柜上的施恩盖上方、从两个基路伯中间对他说话[b]；随后便对他说话[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “他”在本句原文中没有明说是谁；按上下文，摩西是来与神说话。
    reason: 指代说明
  - marker: b
    text: “施恩盖”就是法柜的盖。原文描述声音从这盖的上方、从两个基路伯中间发出。
    reason: 文化背景
  - marker: c
    text: 原文末句的主语没有明说。可理解为前述“声音”对摩西说话；按上下文也可更明确地译为“上主就对他说话”。也有人将末句理解为摩西对神说话。
    reason: 保留原文歧义
lexical_decisions:
- source_word: וּבְבֹא
  choice: 摩西进……的时候
  rationale: 介词 בְּ 加动词不定式构成时间从句；此处表达一次叙事中的进入，以“……的时候”自然传达。
- source_word: אֹהֶל מוֹעֵד
  choice: 会幕
  rationale: 这是该圣所名称在现代中文圣经语境中准确而通行的译法。
- source_word: לְדַבֵּר אִתּוֹ
  choice: 要与他说话
  rationale: 保留介词 אֵת 所带的互动意味以及原文代词，不把所指直接明说为上主。
- source_word: וַיִּשְׁמַע אֶת־הַקּוֹל
  choice: 就听见有声音
  rationale: קוֹל 在此因后接“说话”而指可言说的声音；中文用“有声音……对他说话”比“听见那声音说话”更自然。
- source_word: מִדַּבֵּר
  choice: 对他说话
  rationale: 按马所拉文本的主动分词理解，并以自然中文表达“声音正在说话”；脚注保留其可能具有被动式细微意味的解释。
- source_word: מֵעַל הַכַּפֹּרֶת
  choice: 从……施恩盖上方
  rationale: כַּפֹּרֶת 指法柜的盖；“施恩盖”既标明器物，又保留该词在礼仪语境中的赎罪、施恩关联。
- source_word: אֲרֹן הָעֵדֻת
  choice: 法柜
  rationale: עֵדוּת 在本语境指柜中作为盟约法定见证的法版；“法柜”简洁自然，并与普通箱柜区别。
- source_word: מִבֵּין שְׁנֵי הַכְּרֻבִים
  choice: 从两个基路伯中间
  rationale: “基路伯”是 כְּרוּבִים 在中文圣经传统中通行的音译，避免把这种特定受造物泛化为天使。
- source_word: וַיְדַבֵּר אֵלָיו
  choice: 那一位就对他说话
  rationale: 原文动词为阳性单数而主语省略。中文若直译“他”易误指摩西；“那一位”指向发声者，同时不直接补出“上主”。
theological_decisions:
- issue: “与他”及末句省略主语的所指
  choice: 正文将发声者理解为从施恩盖上方对摩西说话的那一位，但不直接补出“上主”
  alternative: 可明确译为“上主就对他说话”；也可把“声音”作为末句主语，译为“那声音就对他说话”；另有人将摩西理解为末句主语
  rationale: 上下文和声音发出的圣所位置强烈指向神是说话者，但希伯来文末句没有明说主语。译文以“那一位”保持人格性和上下文联系，同时用脚注保存句法上的歧义。
translation_notes:
  register: 采用现代、庄重而可朗读的简体中文。“会幕”“施恩盖”“法柜”“基路伯”保留必要的圣所术语；句序尽量贴近希伯来文，同时避免连续代词造成中文所指混乱。所有脚注标记均已置入正文。
