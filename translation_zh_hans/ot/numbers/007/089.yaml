  to: 摩西进入会幕，要与他[a]说话时，听见那声音从法柜上的施恩盖上方、从两个基路伯中间对他说话[b]；随后便对他说话[c]。
  rationale: 修订使中文句法更自然，并以“那声音”准确对应原文的定指名词。末句不补入“那一位”或“上主”，而在正文保留省略主语，在脚注说明不同理解，因此既维持上下文中神圣发声的最可能意义，也不将存在争议的主语解释强加于正文。
