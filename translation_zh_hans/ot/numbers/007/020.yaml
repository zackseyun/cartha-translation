  text: one gold dish of ten shekels[a], full of incense;
translation:
  language: zh_hans
  text: 一个重十舍客勒的金盘[a]，盛满了香；
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“一个金盘，十〔的〕金”；根据上下文献礼清单的固定表达，这里省略了重量单位“舍客勒”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּף
  choice: 盘
  rationale: 此处指盛放供物的小型器皿，不是人的手掌。译作“盘”自然，也避免“勺”让现代读者误以为是餐具。
- source_word: אַחַת
  choice: 一个
  rationale: 阴性基数词，与כַּף相配；汉语按器皿使用量词“个”。
- source_word: עֲשָׂרָה זָהָב
  choice: 重十舍客勒的金
  rationale: 原文没有明说重量单位，但本章相邻献礼清单的固定表达表明，此处省略了“舍客勒”。正文补出单位以使意思完整，并用脚注说明原文形式。
- source_word: מְלֵאָה
  choice: 盛满了
  rationale: 表达该器皿装满某物的状态，比直译为“满有”更符合现代汉语。
- source_word: קְטֹרֶת
  choice: 香
  rationale: 指会幕敬拜中焚烧的芳香供物；“香”是简明、传统而清楚的中文表达。
