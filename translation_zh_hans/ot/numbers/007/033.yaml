  text: one bull from the herd[a], one ram, one male lamb a year old, for a burnt offering[b];
translation:
  language: zh_hans
  text: 一头公牛[a]，一只公绵羊，一只一岁大的公羊羔[b]，作燔祭；
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语直译：“一头公牛，牛群之子”；这是指牛群中的公牛的惯用语，常理解为幼公牛。
    reason: lexical_alternative
  - marker: b
    text: 或译：“一只在第一年内的公羊羔”。
    reason: lexical_alternative
lexical_decisions:
- source_word: פַּר אֶחָד בֶּן בָּקָר
  choice: 一头公牛犊
  rationale: פַּר指公牛或幼公牛，בֶּן בָּקָר是表明其属牛类牲畜的惯用语；合译为“一头公牛犊”，既自然，也避免生硬直译为“牛群之子”。
- source_word: אַיִל אֶחָד
  choice: 一只公绵羊
  rationale: אַיִל是献祭语境中成年公羊的常用词；“公绵羊”在现代汉语中明确、易懂。
- source_word: כֶּבֶשׂ אֶחָד
  choice: 一只公羊羔
  rationale: כֶּבֶשׂ指羊羔，在献祭清单中通常为雄性；译作“公羊羔”明确牲畜种类和性别。
- source_word: בֶּן שְׁנָתוֹ
  choice: 一岁[a]
  rationale: 这是表示年龄的希伯来语惯用表达，可指“一岁”或“在第一年之内”；正文采用简洁自然的“一岁”，脚注保留另一种理解。
- source_word: לְעֹלָה
  choice: 作燔祭
  rationale: עֹלָה是整只焚烧献上的祭，传统且准确的汉语圣经术语为“燔祭”；“作”符合本节祭物清单的句法。
- source_word: אֶחָד
  choice: 一头／一只
  rationale: 重复出现的数词表示每种祭牲各一；按现代汉语为牛用量词“头”，为羊用“只”。
