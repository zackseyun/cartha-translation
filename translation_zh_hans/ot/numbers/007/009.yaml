source:
  edition: WLC
  text: וְ/לִ/בְנֵ֥י קְהָ֖ת לֹ֣א נָתָ֑ן כִּֽי עֲבֹדַ֤ת הַ/קֹּ֨דֶשׁ֙ עֲלֵ/הֶ֔ם בַּ/כָּתֵ֖ף יִשָּֽׂאוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/009.yaml
  text: But to the sons of Kohath he gave none[a], because the service of the holy things was upon them; they were to carry them on the shoulder.
translation:
  language: zh_hans
  text: 但他没有把车和牛给哥辖的子孙，因为他们负责圣物[a]的事奉，要用肩抬。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “圣物”或译“圣所”。原文直译为：“因为圣所（或圣物）的事奉在他们身上；他们要用肩抬。”这里很可能特指交托给哥辖人搬运的圣物。
    reason: 保留הַקֹּדֶשׁ可指“圣物”或“圣所”的词义空间，并说明本段语境所支持的理解。
lexical_decisions:
- source_word: וְ/לִ/בְנֵי קְהָת
  choice: 但……哥辖的子孙
  rationale: לִבְנֵי表示间接受词；“哥辖的子孙”既保留宗族称谓，也符合现代中文。句首וְ按上下文译为“但”，体现与前文其他利未宗族所得赠物的对比。
- source_word: לֹא נָתָן
  choice: 他没有给
  rationale: נתן受否定词修饰，所给之物承接前文的车辆和牛。正文保持原文未明说宾语的表达，由上下文补足含义。
- source_word: כִּי
  choice: 因为
  rationale: 在此引出没有给他们车辆和牛的原因，现代中文用“因为”清楚自然。
- source_word: עֲבֹדַת הַקֹּדֶשׁ
  choice: 办理圣物的职责
  rationale: עֲבֹדָה可指工作、服役或职责；הַקֹּדֶשׁ在本段语境中很可能指交托哥辖人搬运的圣物。“办理圣物的职责”兼顾具体语境与责任含义。
- source_word: עֲלֵיהֶם
  choice: 在他们身上
  rationale: 保留希伯来语“在他们身上”的责任隐喻，不将其完全释义为“交给他们”，从而保存原文表达。
- source_word: בַּכָּתֵף
  choice: 用肩
  rationale: 原文为单数“肩”，具有集合或分配意义；“用肩抬”是自然中文，也准确表达亲自肩负搬运。
- source_word: יִשָּׂאוּ
  choice: 他们要……抬
  rationale: 未完成式在此表达规定的职责或义务。“要……抬”自然传达应当履行的任务；原文宾语省略，中文也可借语境理解。
theological_decisions:
- issue: עֲבֹדַת הַקֹּדֶשׁ所指范围
  choice: 正文译作“办理圣物的职责”
  alternative: “圣所的职事”或“神圣的服役”
  rationale: 紧邻语境涉及哥辖人搬运会幕内的圣物，因此“圣物”最可能；但הַקֹּדֶשׁ本身也可理解为“圣所”，故在脚注保留这一词义可能性。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“办理……的职责在他们身上”保留原文责任临到他们的形象；“用肩抬”简洁自然。脚注标记[a]已置于正文相关句末。
