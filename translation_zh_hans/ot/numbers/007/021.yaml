  text: פַּ֣ר אֶחָ֞ד בֶּן בָּקָ֗ר אַ֧יִל אֶחָ֛ד כֶּֽבֶשׂ אֶחָ֥ד בֶּן שְׁנָת֖/וֹ לְ/עֹלָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/021.yaml
  text: one bull from the herd[a], one ram, one male lamb a year old, for a burnt offering[b];
translation:
  language: zh_hans
  text: 一头公牛[a]、一只公绵羊、一只一岁的公羊羔[b]，作燔祭；
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译为“一头公牛，牛群之子”；这是指牛类牲畜的希伯来语表达。
    reason: lexical_alternative
  - marker: b
    text: 或译：“一只第一年内的公羊羔”。
    reason: lexical_alternative
lexical_decisions:
- source_word: פַּר אֶחָד בֶּן בָּקָר
  choice: 一头公牛
  rationale: פַּר指公牛或年轻公牛；בֶּן בָּקָר直译为“牛群之子”，是指牛类牲畜的希伯来语表达。译为“一头公牛”既自然，也保留祭牲清单中反复出现的数量“一”。
- source_word: אַיִל אֶחָד
  choice: 一只公绵羊
  rationale: אַיִל在祭牲语境中指成年的公绵羊；“公绵羊”准确区别于后面的公羊羔。
- source_word: כֶּבֶשׂ אֶחָד
  choice: 一只公羊羔
  rationale: כֶּבֶשׂ指羊羔，本处为阳性单数；“公羊羔”自然地表达其性别，并保留“一只”的清单格式。
- source_word: בֶּן שְׁנָתוֹ
  choice: 一岁的
  rationale: 该习语表示羊羔处于一岁左右或出生后的第一年；正文采用简洁常用的“一岁的”，脚注保留“第一年内”的译法。
- source_word: לְעֹלָה
  choice: 作燔祭
  rationale: עֹלָה是整只焚烧献上的祭物。“燔祭”是准确且通行的中文圣经祭祀用语；“作”自然表达前缀לְ在清单中的用途关系。
theological_decisions:
- issue: עֹלָה的祭祀术语
  choice: 燔祭
  alternative: 全烧祭
  rationale: “全烧祭”更直观地说明祭物全部焚烧，但“燔祭”是中文圣经传统中稳定、简洁的术语，也不会额外解释该词名称与“上升”之间可能存在的关联。
translation_notes:
  register: 采用现代、庄重而简洁的祭牲清单语体；以“头”量公牛，以“只”量羊。保留原文三次“一”的重复结构，并用分号承接上下文中的连续献礼清单。
