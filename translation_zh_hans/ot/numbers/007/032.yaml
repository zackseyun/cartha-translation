- source_word: זָהָב
  choice: 金
  rationale: 表示器皿的材质；“金盘”是现代汉语中简洁自然的表达。
- source_word: מְלֵאָה
  choice: 盛满了
  rationale: 描述器皿装有内容物；“盛满了”比单纯“充满”更符合容器语境。
- source_word: קְטֹרֶת
  choice: 香
  rationale: 祭司与会幕语境中的香料祭物，现代中文圣经语体通常称为“香”。
