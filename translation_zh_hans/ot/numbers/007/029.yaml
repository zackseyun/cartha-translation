  yaml_path: translation/ot/numbers/007/029.yaml
  text: 'and for the sacrifice of peace offerings: two cattle[a], five rams, five male goats, and five male lambs a year old. This was the offering of Eliab son of Helon.'
translation:
  language: zh_hans
  text: 又献作平安祭[a]的祭物：两头牛、五只公绵羊、五只公山羊、五只一岁的公羊羔。这是希伦的儿子以利押的供物。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “平安祭”或译“团契祭”或“福祉祭”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/זֶבַח הַשְּׁלָמִים
  choice: 又献作平安祭的
  rationale: 前缀וּ和לְ承接上一节的献物清单，并引出祭物类别。זֶבַח הַשְּׁלָמִים是固定祭祀用语；“平安祭”简洁、庄重且为中文读者熟悉，同时以脚注保留其“团契／福祉”方面的词义可能。
- source_word: בָּקָר שְׁנַיִם
  choice: 两头牛
  rationale: בָּקָר是牛类的集合名词，原文在此未明确性别；“两头牛”既自然，也不擅自限定为公牛。
- source_word: אֵילִם חֲמִשָּׁה
  choice: 五只公绵羊
  rationale: אֵילִם明确指雄性的绵羊；译作“公绵羊”可与后面的公山羊和羊羔清楚区分。
- source_word: עַתֻּדִים חֲמִשָּׁה
  choice: 五只公山羊
  rationale: עַתֻּדִים特指雄性山羊，因此在译文中保留性别。
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה חֲמִשָּׁה
  choice: 五只一岁的公羊羔
  rationale: כְּבָשִׂים在此祭物清单中指公羊羔，בְּנֵי שָׁנָה是表示年龄的惯用语；“一岁的”符合现代汉语表达。
- source_word: זֶה קָרְבַּן
  choice: 这是……的供物
  rationale: קָרְבָּן泛指带到上帝面前的供物。“这是”贴近希伯来语指示结构，并适合本段反复出现的总结句式。
- source_word: אֱלִיאָב בֶּן חֵלֹן
  choice: 希伦的儿子以利押
  rationale: 采用现代中文圣经中通行的人名音译，并以自然的汉语所属结构表达父子关系。
theological_decisions:
- issue: שְׁלָמִים这一祭名的含义范围
  choice: 正文采用“平安祭”，脚注列出“团契祭”和“福祉祭”
  alternative: 正文直接采用“团契祭”或“福祉祭”
  rationale: 该词可能关联平安、福祉以及献祭者与上帝并共同进食者之间的团契；正文不以单一解释消除其词义张力，而以传统且易识别的“平安祭”为主，并在脚注中保留其他合理理解。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“又献作……的，有……”承接前文清单；量词按现代汉语分别使用“头”和“只”。正文中的脚注标记置于其实际所说明的“平安祭”之后。
