  text: one gold dish of ten shekels[a], full of incense;
translation:
  language: zh_hans
  text: 一个金盘，重十舍客勒[a]，盛满了香；
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“一个盘，十，金，盛满了香”；这里没有明写重量单位。“舍客勒”是根据民数记第7章反复出现的献礼格式补出的。
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּף
  choice: 盘
  rationale: 此处指盛香的小型器皿，不是字面的“手掌”。“盘”符合会幕献礼清单的语境，也比“匙”更符合现代汉语习惯。
- source_word: אַחַת
  choice: 一个
  rationale: 直译数量词，并与“盘”自然搭配。
- source_word: עֲשָׂרָה זָהָב
  choice: 重十舍客勒
  rationale: 原文简略作“十，金”，没有明写重量单位；依据民数记第7章反复出现的完整献礼格式，这里所指是金器重十舍客勒。正文补出单位以使意思清楚，脚注保留原文的简略形式。
- source_word: מְלֵאָה
  choice: 盛满了
  rationale: 表达器皿装满某物，现代汉语自然，也保留原文阴性形容词所描述的满盛状态。
- source_word: קְטֹרֶת
  choice: 香
  rationale: 指礼仪中焚烧的香料；在圣幕敬拜语境中，“香”是简明、通行的译法。
