  text: 一个金碟，重十舍客勒[a]，盛满了香；
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“一个金碟，十，盛满了香”；“舍客勒”这一重量单位是根据上下文反复出现的献礼格式补出的。
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּף
  choice: 盘
  rationale: 在会幕礼仪器具的语境中，指盛放香料的小型容器；“盘”比按字面译作“手掌”准确，也比“勺”更不易让现代读者误解为普通餐具。
- source_word: אַחַת
  choice: 一个
  rationale: 阴性基数词，与כַּף呼应；汉语自然表达为“一个”。
- source_word: עֲשָׂרָה
  choice: 重十舍客勒
  rationale: 原文只有“十”，重量单位依上下文重复的献礼格式省略；译文补出“舍客勒”，并以“重”明确这里指重量。
- source_word: זָהָב
  choice: 金
  rationale: 表示器皿的材质；“金盘”简洁自然。
- source_word: מְלֵאָה
  choice: 盛满了
  rationale: 该阴性形容词以כַּף为所指，表示器皿装满其内容物；“盛满了”符合汉语器皿语境。
- source_word: קְטֹרֶת
  choice: 香
  rationale: 指礼仪中焚烧的芳香物；在圣幕语境中译作“香”准确而自然。
