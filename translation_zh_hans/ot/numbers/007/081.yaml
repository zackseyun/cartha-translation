  text: one bull from the herd, one ram, one male lamb a year old, for a burnt offering;
translation:
  language: zh_hans
  text: 一头公牛，一只公绵羊，一只一岁的公羊羔，作燔祭；
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פַּר בֶּן בָּקָר
  choice: 公牛犊
  rationale: פַּר指公牛或幼公牛，בֶּן בָּקָר进一步表明其属牛群；合译为“公牛犊”，自然简洁，也保留祭牲的种类与性别信息。
- source_word: אֶחָד
  choice: 一头／一只
  rationale: 原文三次重复数词“一”；中文按动物量词分别译作“一头”和“一只”，保留逐项计数的清单结构。
- source_word: אַיִל
  choice: 公绵羊
  rationale: 该词指成年公羊；译作“公绵羊”可明确物种和性别，并与下一项公羊羔区分。
- source_word: כֶּבֶשׂ
  choice: 公羊羔
  rationale: 该词指幼小的公绵羊；“公羊羔”准确保留性别和年龄类别。
- source_word: בֶּן שְׁנָתוֹ
  choice: 一岁的
  rationale: 这是表示祭牲年龄的希伯来语惯用表达，意为一岁或在第一年之内；正文采用自然的现代汉语“一岁的”。
- source_word: לְעֹלָה
  choice: 作燔祭
  rationale: עֹלָה是整只焚烧献上的祭，中文圣经传统术语“燔祭”准确而简洁；介词לְ译为“作”，符合清单语体。
