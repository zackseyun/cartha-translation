  yaml_path: translation/ot/numbers/007/006.yaml
  text: So Moses took the carts and the cattle and gave them to the Levites[a][b].
translation:
  language: zh_hans
  text: 于是，摩西收下车[a]和牛群[b]，把它们交给利未人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “车”也可译作“车辆”。
    reason: lexical_alternative
  - marker: b
    text: 原文为指牛类牲畜的集合名词；本章上下文明确所指的是公牛。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: 收下
  rationale: לקח常指“拿、取”；这里的物品刚由首领献上，因此“收下”自然表达摩西接收这些物品，同时不增添所有权转移之外的含义。
- source_word: הָעֲגָלֹת
  choice: 车辆
  rationale: עֲגָלוֹת指用于载运的有轮车辆。“车辆”是自然且不过度限定形制的现代汉语；也可译作“车”。
- source_word: הַבָּקָר
  choice: 牲畜
  rationale: בָּקָר是指牛类牲畜的集合名词。本节保留较宽泛的表达“牲畜”，而上下文说明所指的是牛。
- source_word: וַיִּתֵּן
  choice: 交给
  rationale: נתן基本义为“给”。在物品由摩西转交给利未人的语境中，“交给”比单说“给”更自然，又不把它解释为行政性的“分配”。
- source_word: אוֹתָם
  choice: 它们
  rationale: 阳性复数宾语代词统指车辆和牲畜；现代汉语用“它们”自然承接。
- source_word: אֶל הַלְוִיִּם
  choice: 给利未人
  rationale: 介词אֶל在这里表达转交的对象；“交给利未人”直接呈现这一关系。
theological_decisions: []
