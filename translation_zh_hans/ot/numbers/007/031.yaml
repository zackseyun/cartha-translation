  text: קָרְבָּנ֞/וֹ קַֽעֲרַת כֶּ֣סֶף אַחַ֗ת שְׁלֹשִׁ֣ים וּ/מֵאָה֮ מִשְׁקָלָ/הּ֒ מִזְרָ֤ק אֶחָד֙ כֶּ֔סֶף שִׁבְעִ֥ים שֶׁ֖קֶל בְּ/שֶׁ֣קֶל הַ/קֹּ֑דֶשׁ שְׁנֵי/הֶ֣ם מְלֵאִ֗ים סֹ֛לֶת בְּלוּלָ֥ה בַ/שֶּׁ֖מֶן לְ/מִנְחָֽה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/031.yaml
  text: His offering was one silver plate[a], its weight one hundred thirty shekels, one silver basin of seventy shekels, according to the sanctuary shekel[c][b]; both of them were full of fine flour mixed with oil for a grain offering.
translation:
  language: zh_hans
  text: 他的供物是一个银盘[a]，重一百三十舍客勒；一个银盆[b]，重七十舍客勒，都是按圣所的舍客勒[c]。两件器皿都盛满了调油的细面，作素祭用。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “盘”或译“碟”；希伯来语指一种礼仪用的器皿。
    reason: lexical_alternative
  - marker: b
    text: “盆”或译“碗”；希伯来语指与献祭有关的器皿。
    reason: lexical_alternative
  - marker: c
    text: 即按照圣所规定的重量标准。
    reason: cultural_note
lexical_decisions:
- source_word: קָרְבָּנוֹ
  choice: 他的供物是
  rationale: קָרְבָּן在本段礼仪语境中指献给上帝的供物；“供物”准确且能与句末特指的“素祭”区分。
- source_word: קַעֲרַת כֶּסֶף אַחַת
  choice: 一个银盘
  rationale: קַעֲרָה指盘、碟一类器皿；“银盘”自然简明，并以脚注保留“银碟”的可能译法。
- source_word: שְׁלֹשִׁים וּמֵאָה מִשְׁקָלָהּ
  choice: 重一百三十舍客勒
  rationale: 希伯来文直陈其重量；汉语用“重……”简洁地保留重量信息。
- source_word: מִזְרָק אֶחָד כֶּסֶף
  choice: 一个银盆
  rationale: מִזְרָק是与献祭有关的盛器，可能用于盛接或洒祭物；“银盆”较能体现其礼仪器皿性质。
- source_word: שִׁבְעִים שֶׁקֶל
  choice: 重七十舍客勒
  rationale: 该短语说明银盆的重量；补出“重”符合现代汉语，也与前一器皿的表述平行。
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: 都是按圣所的舍客勒
  rationale: 这是说明衡量标准的固定表达；“按圣所的舍客勒”保留原文的礼仪背景，脚注解释其为圣所规定的重量标准。
- source_word: שְׁנֵיהֶם
  choice: 两件器皿都
  rationale: 明确回指前述银盘与银盆，既保留“两者”的含义，也避免汉语代词指向含混。
- source_word: מְלֵאִים
  choice: 盛满了
  rationale: 用于器皿时，“盛满了”比直译“充满”更自然，并保留满盛的状态。
- source_word: סֹלֶת
  choice: 细面
  rationale: סֹלֶת指献祭所用的精细面粉；“细面”是准确、简练且适合祭祀语境的表达。
- source_word: בְּלוּלָה בַשֶּׁמֶן
  choice: 调油的
  rationale: 被动分词表示细面与油混合；“调油的细面”是自然的现代汉语祭物表述。
- source_word: לְמִנְחָה
  choice: 作为素祭
  rationale: 在祭司礼仪语境中，מִנְחָה特指以谷物为主的祭物；“素祭”是简明且能与一般“供物”区分的术语。
