base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/086.yaml
  text: twelve gold dishes full of incense[a], each dish weighing ten shekels by the sanctuary shekel; all the gold of the dishes was one hundred twenty shekels.
translation:
  language: zh_hans
  text: 十二个金盘，盛满了香[a]；每个盘按圣所的舍客勒计算，重十舍客勒。所有盘所用的金子共重一百二十舍客勒。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “盘”也可译作“碟”“碗”，传统上译作“匙”；这里指盛香的器皿。
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּפּוֹת
  choice: 盘
  rationale: 此词在会幕献礼的语境中指盛香的小型器皿；“盘”符合器物可盛满香料并按重量计算的描述，也比传统译法“匙”更符合现代汉语读者的理解。
- source_word: זָהָב
  choice: 金
  rationale: 直接表达器皿的材质；汉语中“金盘”自然简洁。
- source_word: שְׁתֵּים עֶשְׂרֵה
  choice: 十二个
  rationale: 准确表达器皿的总数，并添加现代汉语所需量词。
- source_word: מְלֵאֹת קְטֹרֶת
  choice: 盛满了香料
  rationale: 保留“满”的状态含义；קְטֹרֶת 在祭仪语境中指焚烧献上的芳香混合物，“香料”比单说“香”更清楚。
- source_word: עֲשָׂרָה עֲשָׂרָה הַכַּף
  choice: 每个盘……重十舍客勒
  rationale: 希伯来语数字重复表达逐一分配，译作“每个”自然准确。
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: 按圣所的舍客勒
  rationale: 保留按圣所官方度量标准计算的技术性含义。
- source_word: כָּל זְהַב הַכַּפּוֹת
  choice: 所有盘子的金子
  rationale: 表达这些金制器皿所用金子的合计重量，不将原文关系过度解释为其他含义。
- source_word: עֶשְׂרִים וּמֵאָה
  choice: 一百二十舍客勒
  rationale: 准确表达总数一百二十，并依据紧邻的重量单位在汉语中补出“舍客勒”，使句意完整。
