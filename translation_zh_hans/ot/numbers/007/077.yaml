base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/077.yaml
  text: 'and for the sacrifice of peace offerings: two cattle[a], five rams, five male goats, five male lambs a year old[b]. This was the offering of Pagiel son of Ocran.'
translation:
  language: zh_hans
  text: 又为平安祭[a]献上：牛两头[b]，公绵羊五只，公山羊五只，一岁的公羊羔五只。这是俄兰的儿子帕结所献的供物。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “平安祭”或译“团契祭”或“福祉祭”。
    reason: lexical_alternative
  - marker: b
    text: 原文“牛”是集合用语，未说明性别；有译本译作“公牛”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/זֶבַח הַ/שְּׁלָמִים
  choice: 又献作平安祭的
  rationale: 前缀连接词和介词承接祭物清单；“平安祭”是这一祭祀类别在中文圣经传统中清楚且易辨认的名称。“又献作……的”符合现代中文清单句式。
- source_word: בָּקָר שְׁנַיִם
  choice: 牛两头
  rationale: בָּקָר是牛类的集合名词，此处未明确性别；“牛两头”既准确表达数量，也不擅自限定为公牛。
- source_word: אֵילִם חֲמִשָּׁה
  choice: 公绵羊五只
  rationale: אֵילִם特指成年公绵羊；如此译法比笼统的“羊”更准确。
- source_word: עַתֻּדִים חֲמִשָּׁה
  choice: 公山羊五只
  rationale: עַתֻּדִים指公山羊，译文保留了性别和种类。
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה חֲמִשָּׁה
  choice: 一岁的公羊羔五只
  rationale: כְּבָשִׂים在此指公羊羔，בְּנֵי שָׁנָה表示一岁；译文完整保留年龄、性别和数量。
- source_word: זֶה קָרְבַּן
  choice: 这是……所献的供物
  rationale: 保留希伯来文指示代词加名词的总结公式，并以自然中文明确“供物”与献祭者的关系。
- source_word: פַּגְעִיאֵל בֶּן עָכְרָן
  choice: 俄兰的儿子帕结
  rationale: 按现代中文圣经人名惯例音译，并以“……的儿子……”清楚表达父子关系。
theological_decisions:
- issue: שְׁלָמִים这一祭类名称的含义范围
  choice: 平安祭
  alternative: 团契祭；福祉祭
  rationale: “平安祭”是中文读者熟悉的传统名称，但原词也涉及相交、完整和福祉等含义，因此用脚注保留可行译法，不把其神学含义缩减为单一解释。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。祭物清单沿用“名词＋数量”的简洁结构；开头用“又”承接上文。所有脚注标记均置于对应词语之后。
