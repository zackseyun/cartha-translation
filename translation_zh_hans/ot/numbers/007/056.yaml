  text: one gold dish weighing ten shekels[a], full of incense;
translation:
  language: zh_hans
  text: 一个重十舍客勒[a]的金盘，盛满了香；
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“一个金盘，十〔舍客勒〕，盛满了香。”希伯来原文在这里省略了重量单位；根据本章反复出现的献礼格式，意思是十舍客勒。
    reason: 原文省略重量单位，正文为清楚起见予以补出。
lexical_decisions:
- source_word: כַּף
  choice: 盘
  rationale: 这里指盛香的小型器皿，而非字面上的“手掌”。“盘”符合会幕献礼清单的语境，也比现代汉语中的“匙”更不易使人联想到餐具。
- source_word: אַחַת
  choice: 一个
  rationale: 阴性基数词，与כַּף呼应；汉语自然表达为“一个”。
- source_word: עֲשָׂרָה
  choice: 十舍客勒
  rationale: 原文只有“十”，重量单位省略；根据本章反复出现的献礼格式，所指是十舍客勒。正文补出单位以便理解，并用脚注说明。
- source_word: זָהָב
  choice: 金
  rationale: 表示器皿的材质；“金盘”是简洁自然的现代汉语。
- source_word: מְלֵאָה
  choice: 盛满了
  rationale: 谓语形容词表示器皿装满某物；“盛满了”既传达“满”，又适合容器语境。
- source_word: קְטֹרֶת
  choice: 香
  rationale: 指礼仪中焚烧的芳香物质；在圣所与献礼语境中，“香”是自然且通行的译法。
