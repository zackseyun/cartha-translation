  text: קָרְבָּנ֞/וֹ קַֽעֲרַת כֶּ֣סֶף אַחַ֗ת שְׁלֹשִׁ֣ים וּ/מֵאָה֮ מִשְׁקָלָ/הּ֒ מִזְרָ֤ק אֶחָד֙ כֶּ֔סֶף שִׁבְעִ֥ים שֶׁ֖קֶל בְּ/שֶׁ֣קֶל הַ/קֹּ֑דֶשׁ שְׁנֵי/הֶ֣ם מְלֵאִ֗ים סֹ֛לֶת בְּלוּלָ֥ה בַ/שֶּׁ֖מֶן לְ/מִנְחָֽה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/043.yaml
  text: His offering was one silver plate[a], its weight one hundred thirty shekels, one silver basin of seventy shekels, according to the shekel of the sanctuary[c][b]; both of them full of fine flour mixed with oil for a grain offering.
translation:
  language: zh_hans
  text: 他的供物是：一个银盘[a]，重一百三十舍客勒；一个银碗[b]，重七十舍客勒；二者的重量都按圣所的舍客勒标准[c]计算，里面都盛满了用油调和的细面，用作素祭。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “盘”也可译作“碟”。
    reason: lexical_alternative
  - marker: b
    text: “碗”也可译作“盆”；这是礼仪中使用的器皿。
    reason: lexical_alternative
  - marker: c
    text: 希伯来文直译为“按圣所的舍客勒”，指圣所采用的标准重量。
    reason: cultural_note
lexical_decisions:
- source_word: קָרְבָּנוֹ
  choice: 他的供物是
  rationale: קָרְבָּן指在敬拜礼仪中献上的供物；“供物”准确、庄重，也适合本段列举各支派首领所献物品的语境。希伯来文为无动词句，中文补出“是”并用冒号引出清单。
- source_word: קַעֲרַת כֶּסֶף אַחַת
  choice: 一个银盘
  rationale: קַעֲרָה指盘、碟一类的器皿；“银盘”自然简明，并保留器皿的材质与数量。
- source_word: שְׁלֹשִׁים וּמֵאָה מִשְׁקָלָהּ
  choice: 重一百三十舍客勒
  rationale: 原文直陈“它的重量是一百三十”；中文用“重……”表达更自然，同时完整保留重量数值。
- source_word: מִזְרָק אֶחָד כֶּסֶף
  choice: 一个银碗
  rationale: מִזְרָק是礼仪中使用的碗状器皿；“银碗”不过度限定其具体用途，并以脚注保留其他可能译法。
- source_word: שִׁבְעִים שֶׁקֶל
  choice: 重七十舍客勒
  rationale: 该短语说明银碗的重量；中文补出“重”，使两个器皿的重量表达平行清楚。
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: 都是按圣所的舍客勒标准
  rationale: 该固定表达指以圣所采用的舍客勒为称重标准。“标准”明示其计量功能，不把“圣”误解为舍客勒本身具有某种性质。
- source_word: שְׁנֵיהֶם מְלֵאִים
  choice: 两个器皿都盛满了
  rationale: 保留שְׁנֵיהֶם明确的双数指向，即前述银盘和银碗；“盛满了”自然表达器皿装满内容物。
- source_word: סֹלֶת
  choice: 细面
  rationale: סֹלֶת是献祭所用的精细面粉；“细面”是准确、简洁的礼仪用语。
- source_word: בְּלוּלָה בַשֶּׁמֶן
  choice: 调油的
  rationale: 该被动分词表示细面与油混合；“调油的细面”符合现代汉语献祭语境，也保留混合关系。
- source_word: לְמִנְחָה
  choice: 用作素祭
  rationale: 在祭司礼仪语境中，מִנְחָה特指以谷物为主的祭物；“素祭”简明地区别于一般供物。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。以冒号和分号清楚呈现供物清单，并将重量标准放在两个器皿之后，使“都是”明确涵盖两者。保留“舍客勒”这一古代重量单位，不擅自换算成现代单位。
