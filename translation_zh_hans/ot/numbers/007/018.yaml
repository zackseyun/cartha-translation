  text: On the second day Nethanel son of Zuar, the leader of Issachar, presented his offering.
translation:
  language: zh_hans
  text: 第二天，苏押的儿子、以萨迦的首领拿坦业献上了供物[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来原文只说“献上”；根据民数记第7章各支派首领献供物的重复语境，正文补出“供物”。
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַשֵּׁנִי
  choice: 第二天
  rationale: 介词 בְּ、名词“日”和序数词“第二”构成时间短语；“第二天”自然、简洁，也未加入本节没有明说的信息。
- source_word: הִקְרִיב
  choice: 献上了供物
  rationale: קרב 的使役词干在献祭及奉献礼语境中表示“使靠近、呈献、献上”。原文在本节省略宾语，但民数记第7章反复出现的上下文清楚表明所献的是供物；正文补出“供物”使现代汉语完整自然，并以脚注说明。
- source_word: נְתַנְאֵל
  choice: 拿坦业
  rationale: 采用现代简体中文圣经读者熟悉的人名译法。
- source_word: בֶּן צוּעָר
  choice: 苏押的儿子
  rationale: 按普通现代汉语表达希伯来语父子关系结构，同时保留族谱身份信息。
- source_word: נְשִׂיא
  choice: 首领
  rationale: 在支派语境中指获认可的领袖；“首领”准确而庄重，不带现代王室头衔“王子”的误导意味。
- source_word: יִשָּׂשכָר
  choice: 以萨迦
  rationale: 采用现代简体中文圣经读者熟悉的支派名称译法。
