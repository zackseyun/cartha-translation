  text: קָרְבָּנ֞/וֹ קַֽעֲרַת כֶּ֣סֶף אַחַ֗ת שְׁלֹשִׁ֣ים וּ/מֵאָה֮ מִשְׁקָלָ/הּ֒ מִזְרָ֤ק אֶחָד֙ כֶּ֔סֶף שִׁבְעִ֥ים שֶׁ֖קֶל בְּ/שֶׁ֣קֶל הַ/קֹּ֑דֶשׁ שְׁנֵי/הֶ֣ם מְלֵאִ֗ים סֹ֛לֶת בְּלוּלָ֥ה בַ/שֶּׁ֖מֶן לְ/מִנְחָֽה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/061.yaml
  text: His offering was one silver plate[a], its weight one hundred thirty shekels, one silver basin of seventy shekels, according to the shekel of the sanctuary[c][b]; both of them full of fine flour mixed with oil for a grain offering.
translation:
  language: zh_hans
  text: 他的供物是：一个银盘[a]，重一百三十舍客勒；一个银盆[b]，重七十舍客勒，都是按圣所的舍客勒[c]。这两个器皿都盛满了调油的细面，作素祭。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “盘”或译“碟”（קַעֲרָה）。
    reason: lexical_alternative
  - marker: b
    text: “盆”或译“碗”（מִזְרָק），指圣所礼仪中使用的器皿。
    reason: lexical_alternative
  - marker: c
    text: “按圣所的舍客勒”意思是按圣所规定的标准重量。
    reason: cultural_note
lexical_decisions:
- source_word: קָרְבָּנוֹ
  choice: 他的供物是
  rationale: קָרְבָּן在祭祀语境中指献上的供物；“供物”准确而简明，加“是”使后面的清单符合现代汉语句法。
- source_word: קַעֲרַת כֶּסֶף אַחַת
  choice: 一个银盘
  rationale: קְעָרָה指较浅的盘状器皿；“银盘”自然简洁，同时以脚注保留“银碟”的可能译法。
- source_word: שְׁלֹשִׁים וּמֵאָה מִשְׁקָלָהּ
  choice: 重一百三十舍客勒
  rationale: 原文直陈器皿的重量；“重……”是现代汉语清单中最自然的表达。
- source_word: מִזְרָק אֶחָד כֶּסֶף
  choice: 一个银盆
  rationale: מִזְרָק指圣所礼仪中使用的容器；“银盆”比日常意味较强的“银碗”更贴合祭祀场景。
- source_word: שִׁבְעִים שֶׁקֶל
  choice: 重七十舍客勒
  rationale: 此处承接前一个器皿的重量说明，补出“重”可使汉语清楚而不改变原意。
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: 都是按圣所的舍客勒
  rationale: 该短语指定圣所采用的标准重量；“按圣所的舍客勒”保留原文措辞，并借脚注解释其文化含义。“都是”表明该标准适用于前述两个重量。
- source_word: שְׁנֵיהֶם
  choice: 这两个器皿
  rationale: 明确回指银盘和银盆，保留原文对二者的共同说明。
- source_word: מְלֵאִים
  choice: 都盛满了
  rationale: 表达两个器皿均处于装满状态，符合现代汉语习惯。
- source_word: סֹלֶת
  choice: 细面
  rationale: 这是祭物用的精细面粉；“细面”是中文圣经祭祀语境中清楚而简洁的称呼。
- source_word: בְּלוּלָה בַשֶּׁמֶן
  choice: 调油的
  rationale: 被动分词表示细面与油混合；“调油的细面”自然凝练，也保持祭物配制的含义。
- source_word: לְמִנְחָה
  choice: 作素祭
  rationale: 在祭司礼仪语境中，מִנְחָה特指以谷物为主的祭物；“素祭”是简明且明确的标准术语。
