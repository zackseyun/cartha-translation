  text: וַ/יֹּ֥אמֶר יְהוָ֖ה אֶל מֹשֶׁ֑ה נָשִׂ֨יא אֶחָ֜ד לַ/יּ֗וֹם נָשִׂ֤יא אֶחָד֙ לַ/יּ֔וֹם יַקְרִ֨יבוּ֙ אֶת קָרְבָּנָ֔/ם לַ/חֲנֻכַּ֖ת הַ/מִּזְבֵּֽחַ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/011.yaml
  text: Then Yahweh said to Moses[a], “One leader each day, one leader each day, they shall present their offering for the dedication of the altar.”
translation:
  language: zh_hans
  text: 耶和华对摩西说：“一日一位首领，一日一位首领，献上他们的供物，作为祭坛的奉献礼。”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“每天一位支派首领。”希伯来文重复“一日一位首领”，强调他们按既定次序逐日献上供物。
    reason: 说明“首领”在上下文中指支派首领，并解释原文重复所表达的有序、逐日安排。
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: 未机械译出连接词וַ；现代汉语叙事中上下文已自然表示事件推进，直接译“说”简洁顺畅。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的专名“耶和华”对应四字神名，保留其作为上帝名字而非称号的性质。
- source_word: נָשִׂיא
  choice: 首领
  rationale: 本处指以色列各支派的领袖；“首领”准确自然，也不带“王子”的君主制含义。
- source_word: אֶחָד לַיּוֹם
  choice: 每天由一位
  rationale: 按分配意义表达每天一人的次序，同时保留“一位”的数词意义。
- source_word: יַקְרִיבוּ
  choice: 献上
  rationale: קרב的使役式在祭祀语境中表示把礼物带近、呈献；“献上”是自然且庄重的中文表达。
- source_word: קָרְבָּנָם
  choice: 他们的供物
  rationale: קָרְבָּן指带到上帝面前的祭祀礼物；“供物”既保留祭仪语境，也避免与动词“献上”重复。
- source_word: לַחֲנֻכַּת
  choice: 作为……的奉献礼
  rationale: חֲנֻכָּה指启用或奉献的仪式；此处介词ל可表示与该仪式相关的目的或场合。
- source_word: הַמִּזְבֵּחַ
  choice: 祭坛
  rationale: 这是该祭祀设施的标准现代汉语译法。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。正文采用中文读者广泛熟悉的专名“耶和华”，不以“主”这一称号替代，从而保留原文使用神名的特点。
- issue: 重复短语נָשִׂיא אֶחָד לַיּוֹם的处理
  choice: 每天由一位首领，每天一位首领
  alternative: 每天一位支派首领
  rationale: 保留原文刻意重复，以突出各首领按日依次献礼；不把“支派”直接加入正文，因为该词在本节中没有明说，但可由上下文明确。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。正文保留希伯来文的重复结构及集体主语“他们”，脚注说明“支派首领”这一上下文限定。
