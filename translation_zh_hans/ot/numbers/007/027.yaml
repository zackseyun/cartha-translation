  text: one bull from the herd[a], one ram, one male lamb a year old, for a burnt offering[b];
translation:
  language: zh_hans
  text: 一头公牛[a]，一只公绵羊，一只一岁的公羊羔[b]，作燔祭；
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“一头公牛，牛群之子”。这是指牛群中的公牛；在某些语境中可理解为年轻的公牛。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“其年之子”，指一岁的公羊羔，或仍在第一年内的公羊羔。
    reason: lexical_alternative
lexical_decisions:
- source_word: פַּר אֶחָד בֶּן בָּקָר
  choice: 一头公牛犊
  rationale: פַּר指公牛，בֶּן בָּקָר是祭牲清单中指牛类幼畜的惯用表达。译作“公牛犊”既符合现代汉语，也保留其类别及较幼的含义；量词用“头”。
- source_word: אַיִל אֶחָד
  choice: 一只公绵羊
  rationale: אַיִל指成年的雄性绵羊；“公绵羊”比单说“公羊”更能避免与山羊混淆，量词用“只”。
- source_word: כֶּבֶשׂ אֶחָד
  choice: 一只公羊羔
  rationale: כֶּבֶשׂ在此指雄性羊羔。“公羊羔”保留原文的性别信息，并自然区别于前面的成年公绵羊。
- source_word: בֶּן שְׁנָתוֹ
  choice: 一岁的
  rationale: 该希伯来语惯用语直译为“其年之子”，表示一岁或尚在第一年内。正文采用简明自然的“一岁的”，并以脚注提示可能的年龄表述范围。
- source_word: לְעֹלָה
  choice: 作燔祭
  rationale: עֹלָה是献祭术语，指全部焚烧献上的祭。“作燔祭”适合本节祭物清单的句法。
- source_word: אֶחָד
  choice: 一头／一只
  rationale: 原文在三项祭牲前重复数词“一”；中文结合各自量词逐项译出，以保留清单式结构。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的祭祀清单表达。保留三次“一”的逐项列举，并按中文习惯分别使用“头”和“只”。“燔祭”为现代中文圣经语境中稳定且简洁的术语。
