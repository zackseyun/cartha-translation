  text: one gold dish of ten shekels[a], full of incense;
translation:
  language: zh_hans
  text: 一个重十舍客勒的金盘[a]，里面盛满了香；
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译：“一个金盘，十〔金〕，盛满了香。”根据本章反复出现的重量表述，这里的“十”是指十舍客勒；正文补出“舍客勒”以便理解。
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּף
  choice: 盘
  rationale: 这里指盛香的小型器皿。“盘”自然、具体，又避免用“勺”而把器形限定得过细。
- source_word: אַחַת
  choice: 一个
  rationale: 阴性基数词，与כַּף配合；中文按器皿使用量词“个”。
- source_word: עֲשָׂרָה זָהָב
  choice: 重十舍客勒的金
  rationale: 本章反复出现的清单格式表明，“十”指器皿的重量；“舍客勒”由上下文补出，使现代读者易于理解。זָהָב说明器皿材质为金。
- source_word: מְלֵאָה
  choice: 里面盛满了
  rationale: 表达该器皿装满其内容物，符合现代汉语对容器及其盛装物的自然说法。
- source_word: קְטֹרֶת
  choice: 香
  rationale: 指礼仪中焚烧的芳香物质；“香”是简明而通行的圣经用语。
