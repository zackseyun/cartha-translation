  yaml_path: translation/ot/numbers/007/078.yaml
  text: On the twelfth day, the leader of the sons of Naphtali was Ahira son of Enan.
translation:
  language: zh_hans
  text: 第十二天，拿弗他利子孙的领袖是以南的儿子亚希拉。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּיוֹם שְׁנֵים עָשָׂר יוֹם
  choice: 第十二天
  rationale: 希伯来语以介词 בְּ 加“日”和数词构成时间表达；现代汉语自然地用序数“第十二天”，无需重复“日”。
- source_word: נָשִׂיא
  choice: 领袖
  rationale: 此词在支派语境中指公认的首领或领导者；“领袖”清楚自然，也避免“王子”可能带来的王室含义。
- source_word: לִבְנֵי נַפְתָּלִי
  choice: 拿弗他利子孙的
  rationale: 介词 לִ 在这里表示领袖与该支派群体的归属或关联；בְנֵי 是惯用的支派称谓，译作“子孙”既保留谱系含义，也符合现代汉语表达。
- source_word: אֲחִירַע
  choice: 亚希拉
  rationale: 按常用中文圣经人名音译处理该专名。
- source_word: בֶּן עֵינָן
  choice: 以南的儿子
  rationale: 直接呈现标准的希伯来语父系称谓结构“某人的儿子”。
theological_decisions:
- issue: 支派称谓 בְּנֵי 的性别与谱系表达
  choice: 拿弗他利子孙
  alternative: 拿弗他利的儿子们；拿弗他利的后裔
  rationale: 原文为阳性复数，但在支派名称中是惯用的谱系群体称谓。中文“子孙”保留其父系谱系色彩，又不会误导读者以为这里只指拿弗他利的亲生儿子。
translation_notes:
  register: 采用现代、庄重而简明的叙述体；句式紧贴本章反复出现的献礼次序公式，并保留“领袖是……”这一原文名词句结构。
