base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/023.yaml
  text: 'and for the sacrifice of peace offerings: two cattle[a], five rams, five male goats, and five male lambs a year old. This was the offering of Nethanel son of Zuar.'
translation:
  language: zh_hans
  text: 又作平安祭[a]，献上两头牛、五只公羊、五只公山羊和五只一岁的公羔羊。这是苏押的儿子拿坦业所献的供物。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “平安祭”也可译为“团契祭”或“福祉祭”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/זֶבַח הַשְּׁלָמִים
  choice: 作平安祭的牲畜
  rationale: 介词结构承接前面的供物清单；“平安祭”是 שְׁלָמִים 在中文圣经祭祀术语中的通行译法，而“牲畜”自然引出后列动物。
- source_word: בָּקָר שְׁנַיִם
  choice: 两头牛
  rationale: בָּקָר 是牛类牲畜的集合名词，并未明确性别；“两头牛”准确且符合现代汉语量词习惯。
- source_word: אֵילִם חֲמִשָּׁה
  choice: 五只公绵羊
  rationale: אֵילִם 特指成年公羊；译作“公绵羊”可与后面的公山羊及羊羔清楚区分。
- source_word: עַתּוּדִים חֲמִשָּׁה
  choice: 五只公山羊
  rationale: עַתּוּדִים 指雄性山羊；“公山羊”是清楚自然的现代汉语。
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה חֲמִשָּׁה
  choice: 五只一岁的公羊羔
  rationale: כְּבָשִׂים 在此指公羊羔，בְּנֵי שָׁנָה 表示一岁；保留了性别和年龄信息。
- source_word: זֶה קָרְבַּן
  choice: 这是……所献的供物
  rationale: 这是清单末尾的总结辨识句；“供物”适合 קָרְבָּן 的祭祀语境，也避免与本节特定的平安祭类别混同。
- source_word: נְתַנְאֵל בֶּן צוּעָר
  choice: 苏押的儿子拿坦业
  rationale: 按现代中文圣经常见专名形式音译，并以自然汉语表达父子关系。
theological_decisions:
- issue: שְׁלָמִים 的祭类名称
  choice: 平安祭
  alternative: 团契祭／福祉祭
  rationale: “平安祭”是中文圣经传统中稳定、可识别的祭祀术语；该词的语义范围也涉及共享筵席、和好或福祉，但本节无需选定其中一种神学解释。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语；保留祭祀清单的简洁节奏，动物名称兼顾物种、性别及年龄，不添加原文没有明示的信息。
