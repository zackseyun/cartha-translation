  register: 采用现代、庄重而易懂的清单式表达。以分号区分两件银器，以句号分开器皿重量与所盛祭物；保留“舍客勒”和“素祭”等必要的圣经礼仪术语。脚注标记分别紧跟其所说明的器皿名词，避免误指。
