source:
  edition: WLC
  text: וְ/קָרְבָּנ֞/וֹ קַֽעֲרַת כֶּ֣סֶף אַחַ֗ת שְׁלֹשִׁ֣ים וּ/מֵאָה֮ מִשְׁקָלָ/הּ֒ מִזְרָ֤ק אֶחָד֙ כֶּ֔סֶף שִׁבְעִ֥ים שֶׁ֖קֶל בְּ/שֶׁ֣קֶל הַ/קֹּ֑דֶשׁ שְׁנֵי/הֶ֣ם מְלֵאִ֗ים סֹ֛לֶת בְּלוּלָ֥ה בַ/שֶּׁ֖מֶן לְ/מִנְחָֽה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/013.yaml
  text: And his offering was one silver plate[a], its weight one hundred thirty shekels, one silver bowl of seventy shekels, according to the shekel of the sanctuary[b]; both of them were full of fine flour mixed with oil for a grain offering.
translation:
  language: zh_hans
  text: 他的供物是：一个银盘[a]，重一百三十舍客勒；一个银碗[b]，重七十舍客勒，都是按圣所的舍客勒为准。两件器皿都盛满了调油的细面，作为素祭。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “盘”也可译作“浅盘”；原词指一种较宽浅的器皿。
    reason: lexical_alternative
  - marker: b
    text: “碗”也可译作“盆”；原词指礼仪用的器皿。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקָרְבָּנוֹ
  choice: 他的供物是
  rationale: קָרְבָּן在祭祀语境中指献上的供物；译作“供物”既保留礼仪含义，也自然承接上文。前缀וְ的连接作用由上下文和冒号体现。
- source_word: קַעֲרַת כֶּסֶף אַחַת
  choice: 一个银盘
  rationale: קַעֲרָה指较宽浅的器皿。“银盘”简明自然，并以脚注保留“浅盘”的形状提示。
- source_word: שְׁלֹשִׁים וּמֵאָה מִשְׁקָלָהּ
  choice: 重一百三十舍客勒
  rationale: 原文先列器皿，随后说明其重量；中文用“重……”准确而流畅地表达这一结构。
- source_word: מִזְרָק אֶחָד כֶּסֶף
  choice: 一个银碗
  rationale: מִזְרָק是礼仪用器皿，其他语境可用于盛接或洒血，但本节没有明说其用途，因此正文采用较中性的“碗”，不把功能加入译文。
- source_word: שִׁבְעִים שֶׁקֶל
  choice: 重七十舍客勒
  rationale: 此处说明银碗的重量；补出“重”符合现代汉语清单式表达。
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: 都是按圣所的舍客勒为准
  rationale: 该短语规定称重所采用的圣所度量标准。“为准”明确其计量功能，而不改变原文的礼仪称谓。
- source_word: שְׁנֵיהֶם מְלֵאִים
  choice: 两件器皿都盛满了
  rationale: 原文明确指前述两个器皿。中文补出“器皿”，使指代清楚，并保留“两者都”的强调。
- source_word: סֹלֶת
  choice: 细面
  rationale: סֹלֶת是献祭用的精细面粉；“细面”是简洁、清楚的礼仪用语。
- source_word: בְּלוּלָה בַשֶּׁמֶן
  choice: 调油的
  rationale: 该被动分词说明细面已经与油混合。“调油的细面”自然表达这一状态。
- source_word: לְמִנְחָה
  choice: 作为素祭
  rationale: 在祭司礼仪语境中，מִנְחָה特指以谷物为主的祭物；“素祭”准确保留其祭类名称。
theological_decisions: []
