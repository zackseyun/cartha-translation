  text: one bull from the herd, one ram, one male lamb a year old, for a burnt offering;
translation:
  language: zh_hans
  text: 一头公牛，一只公绵羊，一只一岁的公羊羔，作燔祭；
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פַּר בֶּן־בָּקָר
  choice: 公牛犊
  rationale: פַּר指公牛或幼公牛，בֶּן־בָּקָר进一步表明属于牛类；合译为“公牛犊”，既自然简洁，又保留牲畜种类和较幼的含义。
- source_word: אַיִל
  choice: 公绵羊
  rationale: 在献祭清单中指成年的公羊；译作“公绵羊”可与后面的公羊羔清楚区分。
- source_word: כֶּבֶשׂ
  choice: 公羊羔
  rationale: 指羊羔，在本献祭语境中为雄性；“公羊羔”明确其性别，并符合现代汉语用法。
- source_word: בֶּן־שְׁנָתוֹ
  choice: 一岁的
  rationale: 该希伯来语习语表示处于第一年或约一岁；“一岁的”简明自然，并与清单体裁相称。
- source_word: לְעֹלָה
  choice: 作燔祭
  rationale: עֹלָה是整只焚烧献上的祭物；沿用现代中文圣经语境中清楚而固定的术语“燔祭”。
- source_word: אֶחָד
  choice: 一头／一只
  rationale: 原文在每种祭牲前重复“一”；中文依量词分别译作“一头”和“一只”，保留逐项计数的清单风格。
