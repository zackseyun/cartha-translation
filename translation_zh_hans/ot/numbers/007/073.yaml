base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/073.yaml
  text: His offering was one silver plate[a], its weight one hundred thirty shekels, one silver basin of seventy shekels, according to the shekel of the sanctuary[b]; both of them full of fine flour mixed with oil for a grain offering.
translation:
  language: zh_hans
  text: 他的供物是：一个银盘[a]，重一百三十舍客勒；一个银盆，重七十舍客勒；二者的重量都按圣所的舍客勒[b]计算。这两个器皿都盛满了用油调和的细面，作为素祭。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “盘”或译“碟”；原文所指是圣所器具中一种较浅的银器皿。
    reason: lexical_alternative
  - marker: b
    text: “按圣所的舍客勒”指按照圣所所用的重量标准计算。
    reason: clarification
lexical_decisions:
- source_word: קָרְבָּנוֹ
  choice: 他的供物是
  rationale: קָרְבָּן在祭祀语境中指献上的供物；译作“供物”准确、庄重，并补出“是”使希伯来文名词式列举在现代汉语中自然。
- source_word: קַעֲרַת כֶּסֶף אַחַת
  choice: 一个银盘
  rationale: קְעָרָה指较浅的器皿；“银盘”符合圣所器具清单的语境，也保留“银”这一材质说明。
- source_word: שְׁלֹשִׁים וּמֵאָה מִשְׁקָלָהּ
  choice: 重一百三十舍客勒
  rationale: 原文直陈器皿的重量；汉语用“重……”简洁自然，并维持清单体。
- source_word: מִזְרָק אֶחָד כֶּסֶף
  choice: 一个银盆
  rationale: מִזְרָק是礼仪用器皿，常与盛接或泼洒液体有关；“银盆”比日常色彩较强的“碗”更契合圣所语境。
- source_word: שִׁבְעִים שֶׁקֶל
  choice: 重七十舍客勒
  rationale: 该短语说明银盆重量；补出“重”可清楚表达原文省略式结构。
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: 都是按圣所的舍客勒
  rationale: 该短语说明所用的神圣度量标准。“按圣所的舍客勒”既贴近原文，又让现代读者明确这是重量标准；“都是”表明这一标准适用于前述两项重量。
- source_word: שְׁנֵיהֶם
  choice: 两个器皿都
  rationale: 原文明确指前述两个器皿；译出“器皿”可消除汉语指代歧义。
- source_word: מְלֵאִים
  choice: 盛满了
  rationale: 此词描述两个器皿装满其内容物；“盛满了”比单说“满有”更自然，并与器皿搭配。
- source_word: סֹלֶת
  choice: 细面
  rationale: סֹלֶת是献祭所用的精细面粉；“细面”是准确、简洁的礼仪用语。
- source_word: בְּלוּלָה בַשֶּׁמֶן
  choice: 调油的
  rationale: 被动分词表示细面已经与油混合；“调油的细面”自然表达这一制备方式。
- source_word: לְמִנְחָה
  choice: 作素祭
  rationale: 在祭司文献语境中，מִנְחָה特指以谷物为主的祭物；“素祭”是简明而明确的汉语祭祀术语。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的清单式表达。以分号区分两件器皿，并将度量标准自然地关联到二者；保留“舍客勒”“素祭”等必要的古代礼仪术语，同时用脚注解释器皿词义与重量标准。
