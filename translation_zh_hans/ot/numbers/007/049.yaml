  text: קָרְבָּנ֞/וֹ קַֽעֲרַת כֶּ֣סֶף אַחַ֗ת שְׁלֹשִׁ֣ים וּ/מֵאָה֮ מִשְׁקָלָ/הּ֒ מִזְרָ֤ק אֶחָד֙ כֶּ֔סֶף שִׁבְעִ֥ים שֶׁ֖קֶל בְּ/שֶׁ֣קֶל הַ/קֹּ֑דֶשׁ שְׁנֵי/הֶ֣ם מְלֵאִ֗ים סֹ֛לֶת בְּלוּלָ֥ה בַ/שֶּׁ֖מֶן לְ/מִנְחָֽה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/049.yaml
  text: His offering was one silver plate[a], its weight one hundred thirty shekels, one silver basin of seventy shekels, according to the sanctuary shekel; both of them full of fine flour mixed with oil for a grain offering.
translation:
  language: zh_hans
  text: 他的供物是一个银盘[a]，重一百三十舍客勒；一个银碗，重七十舍客勒，都是按圣所的舍客勒计算。两件器皿都盛满了调油的细面，作为素祭。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “盘”或译“碟”；下文“碗”也可译作“盆”。
    reason: lexical_alternative
lexical_decisions:
- source_word: קָרְבָּנוֹ
  choice: 他的供物是
  rationale: קָרְבָּן在此指献到圣所的礼物或祭物；“供物”既保留礼仪语境，也适合本段清单式表述。
- source_word: קַעֲרַת כֶּסֶף אַחַת
  choice: 一个银盘
  rationale: קַעֲרָה指盘、碟一类较宽浅的器皿；“银盘”简洁自然，并与后面的银碗区分。
- source_word: שְׁלֹשִׁים וּמֵאָה מִשְׁקָלָהּ
  choice: 重一百三十舍客勒
  rationale: 把希伯来文的名词性重量说明译为现代汉语自然的“重……”，同时保留精确数值。
- source_word: מִזְרָק אֶחָד כֶּסֶף
  choice: 一个银碗
  rationale: מִזְרָק指献祭礼仪中使用的碗形器皿；“银碗”准确易懂，不额外加入经文未明说的用途。
- source_word: שִׁבְעִים שֶׁקֶל
  choice: 重七十舍客勒
  rationale: 与前一器皿的重量说明采用平行表达，使清单清楚流畅。
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: 都是按圣所的舍客勒计算
  rationale: 该短语说明称重所依据的圣所标准；补出“计算”符合现代汉语，又未改变原意。“都是”按语境涵盖前述两项重量。
- source_word: שְׁנֵיהֶם מְלֵאִים
  choice: 两件器皿都盛满了
  rationale: שְׁנֵיהֶם明确回指两个器皿；补出“器皿”可避免汉语指代含混，“盛满”贴合容器及其内容物。
- source_word: סֹלֶת
  choice: 细面
  rationale: 这是祭祀语境中精制面粉的常用汉语名称，简明且与《民数记》礼仪术语相称。
- source_word: בְּלוּלָה בַשֶּׁמֶן
  choice: 调油的
  rationale: 表示细面与油混合；“调油的细面”是自然、简洁的祭物表述。
- source_word: לְמִנְחָה
  choice: 作为素祭
  rationale: מִנְחָה在祭司礼仪语境中特指以谷物为主的祭物；“素祭”保留其专门祭祀含义。
