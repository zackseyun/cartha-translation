  language: zh_hans
  text: 一头公牛[a]，一只公绵羊，一只一岁的公羔羊，作燔祭；
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“一头公牛，牛群之子”。“牛群之子”是指牛群中的牛的惯用说法，也常译为“幼公牛”。
    reason: lexical_alternative
lexical_decisions:
- source_word: פַּר אֶחָד בֶּן בָּקָר
  choice: 一头公牛犊
  rationale: פַּר指公牛或幼公牛；בֶּן בָּקָר是按字面为“牛群之子”的惯用语，与פַּר合用时自然表达为“公牛犊”，既交代牛类，也符合现代汉语祭牲清单的表达。
- source_word: אַיִל אֶחָד
  choice: 一只公绵羊
  rationale: אַיִל指成年的雄性绵羊；译作“公绵羊”可避免与泛指羊类的“公羊”产生物种上的含混。
- source_word: כֶּבֶשׂ אֶחָד בֶּן שְׁנָתוֹ
  choice: 一只一岁的公羊羔
  rationale: כֶּבֶשׂ在献祭语境中指公羊羔，בֶּן שְׁנָתוֹ是年龄惯用语，意为“一岁”或“在第一年内”；正文采用自然简明的“一岁的”。
- source_word: לְעֹלָה
  choice: 作燔祭
  rationale: עֹלָה是献祭术语“燔祭”，介词לְ标明这些牲畜的用途；“作燔祭”符合中文清单体裁。
- source_word: אֶחָד
  choice: 一头／一只
  rationale: 重复出现的基数词均明确每种祭牲各一；依现代汉语按动物类别搭配量词。
