  text: וְ/כֹ֞ל בְּקַ֣ר זֶ֣בַח הַ/שְּׁלָמִ֗ים עֶשְׂרִ֣ים וְ/אַרְבָּעָה֮ פָּרִים֒ אֵילִ֤ם שִׁשִּׁים֙ עַתֻּדִ֣ים שִׁשִּׁ֔ים כְּבָשִׂ֥ים בְּנֵי שָׁנָ֖ה שִׁשִּׁ֑ים זֹ֚את חֲנֻכַּ֣ת הַ/מִּזְבֵּ֔חַ אַחֲרֵ֖י הִמָּשַׁ֥ח אֹתֽ/וֹ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/088.yaml
  text: And all the cattle for the sacrifice of peace offerings were twenty-four bulls[a], sixty rams, sixty male goats, and sixty one-year-old lambs. This was the dedication of the altar after it had been anointed.
translation:
  language: zh_hans
  text: 献作平安祭[a]的祭牲共有：公牛二十四头，公绵羊六十只，公山羊六十只，一岁的公羊羔六十只。这就是祭坛受膏之后的奉献礼。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “平安祭”或译“团契祭”或“福祉祭”。
    reason: 保留 זֶבַח הַשְּׁלָמִים 的主要译法及其可强调团契、完整或福祉的替代译法。
lexical_decisions:
- source_word: וְכֹל בְּקַר
  choice: 牲畜共有
  rationale: 本节汇总此类祭牲；“共有”自然表达 כֹל 的总计意味，בְּקַר 则由随后“公牛二十四头”具体说明。
- source_word: זֶבַח הַשְּׁלָמִים
  choice: 平安祭
  rationale: 这是固定的献祭类别；“平安祭”在现代中文圣经语境中简洁、可懂，也保留与和平、福祉相关的词义联想。
- source_word: פָּרִים
  choice: 公牛
  rationale: פַּר 在献祭语境中指公牛；原文在此未明确要求译作“少壮公牛”。
- source_word: אֵילִם
  choice: 公绵羊
  rationale: 明确表达献祭用的成年雄性绵羊，并与后面的公山羊和羊羔区分。
- source_word: עַתֻּדִים
  choice: 公山羊
  rationale: 该词明确指雄性山羊，现代汉语译作“公山羊”清楚自然。
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה
  choice: 一岁的公羊羔
  rationale: 保留年龄说明；结合献祭清单中的用词和语境，将阳性复数明确译为公羊羔。
- source_word: חֲנֻכַּת הַמִּזְבֵּחַ
  choice: 祭坛……的奉献礼
  rationale: חֲנֻכָּה 在这里指祭坛启用时的奉献或奉献礼仪；“奉献礼”既贴近上下文中的事件，也不额外限定为某一种祭物。
- source_word: אַחֲרֵי הִמָּשַׁח אֹתוֹ
  choice: 祭坛受膏之后
  rationale: 原结构表示在祭坛被膏以后；采用被动表达，避免添入原文没有明说的施膏者。
theological_decisions:
- issue: שְׁלָמִים 这一献祭类别的译法
  choice: 平安祭
  alternative: 团契祭；福祉祭
  rationale: “平安祭”保留传统且通行的礼仪术语；脚注列出“团契祭”和“福祉祭”，以呈现该词可强调相交、完整与福祉的语义层面，而不把其中一种神学侧重点定为唯一解释。
- issue: חֲנֻכָּה 指奉献事件还是奉献祭物
  choice: 奉献礼
  alternative: 奉献；奉献祭
  rationale: 上下文虽在汇总祭物，但该名词本身可指祭坛的奉献或启用仪式。“奉献礼”保留事件性，也避免把原文收窄为特定的“奉献祭物”。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。量词按牲畜类别使用“头”和“只”；句式保留原文先列总数、后总结祭坛奉献礼的结构。
