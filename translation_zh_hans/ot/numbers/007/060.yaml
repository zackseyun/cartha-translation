  text: בַּ/יּוֹם֙ הַ/תְּשִׁיעִ֔י נָשִׂ֖יא לִ/בְנֵ֣י בִנְיָמִ֑ן אֲבִידָ֖ן בֶּן גִּדְעֹנִֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/060.yaml
  text: On the ninth day[a], the leader of the sons of Benjamin was Abidan son of Gideoni.
translation:
  language: zh_hans
  text: 第九天，便雅悯子孙的首领是基多尼的儿子亚比但。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בַּיּוֹם הַתְּשִׁיעִי
  choice: 第九天
  rationale: בְּ与“日”构成时间表达；现代汉语自然译作“第九天”。定冠词与序数词共同指献礼次序中的特定一天。
- source_word: נָשִׂיא
  choice: 首领
  rationale: 本章指代表支派献礼的公认领袖。“首领”准确、庄重，也避免“王子”可能带来的王室含义。
- source_word: לִבְנֵי בִנְיָמִן
  choice: 便雅悯子孙的
  rationale: 介词ל在此表示首领与该支派群体的归属或代表关系；“便雅悯子孙的”既符合自然汉语，也保留בְנֵי的家族血缘表述。
- source_word: אֲבִידָן
  choice: 亚比但
  rationale: 按现代中文圣经人名的通行形式音译。
- source_word: בֶּן
  choice: ……的儿子
  rationale: 这是标准的希伯来语父子谱系结构；汉语译作“某人的儿子”准确自然。
- source_word: גִּדְעֹנִי
  choice: 基多尼
  rationale: 按现代中文圣经人名的通行形式音译。
theological_decisions:
- issue: 支派称谓בְנֵי的性别与谱系表达
  choice: 便雅悯子孙
  alternative: 便雅悯人／便雅悯支派
  rationale: 原文使用阳性复数的亲属称谓，借共同祖先表述支派身份。“子孙”在现代汉语中可自然指后裔群体，既保留谱系意象，又不把经文缩减为单纯的地域或行政称呼。
- issue: 介词ל所表达的关系
  choice: 便雅悯子孙的首领
  alternative: 为便雅悯子孙作首领的人
  rationale: ל既可表达关系，也可带代表意味。正文采用自然简洁的属领结构，不额外断定其语义只能是归属或只能是代表；二者在此语境中相容。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。句序贴近希伯来文，同时使用自然汉语的定中结构。此处不加脚注：英文咨询层所列脚注实际讨论的是“首领”与לִבְנֵי之间的关系，而非“第九天”；中文正文“便雅悯子孙的首领”已能自然涵盖归属与代表关系。
