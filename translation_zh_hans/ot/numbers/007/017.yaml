base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/017.yaml
  text: 'and for the sacrifice of peace offerings: two cattle[a], five rams, five male goats, and five lambs a year old. This was the offering of Nahshon son of Amminadab.'
translation:
  language: zh_hans
  text: 作平安祭[a]的祭牲是两头牛、五只公绵羊、五只公山羊和五只一岁的羊羔。这是亚米拿达之子拿顺的供物。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “平安祭”也可译作“团契祭”或“福祉祭”；这个希伯来语祭祀术语常指献祭者在平安与相交中共享祭肉的祭。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/זֶבַח הַ/שְּׁלָמִים
  choice: 作平安祭的祭牲
  rationale: 前缀 וּלְ 承接上一项供物并引出用途；זֶבַח 指献祭或祭牲，שְׁלָמִים 是特定祭类。译作“作平安祭的祭牲”既保留祭祀术语，也自然引出牲畜清单。
- source_word: בָּקָר שְׁנַיִם
  choice: 两头牛
  rationale: בָּקָר 是牛类的集合名词，此处未明确性别；“两头牛”不增添“公牛”等原文未说明的信息。
- source_word: אֵילִם חֲמִשָּׁה
  choice: 五只公绵羊
  rationale: אֵילִם 明指成年公绵羊；用“公绵羊”比仅作“公羊”更清楚地区别于后面的公山羊。
- source_word: עַתּוּדִים חֲמִשָּׁה
  choice: 五只公山羊
  rationale: עַתּוּדִים 在祭牲清单中指公山羊，译文明确保留其性别和种类。
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה חֲמִשָּׁה
  choice: 五只一岁的羊羔
  rationale: כְּבָשִׂים 指羊羔，בְּנֵי שָׁנָה 表示一岁或出生第一年；此处不强行加入原文未明确标出的性别。
- source_word: זֶה קָרְבַּן
  choice: 这是……的供物
  rationale: 希伯来文是无系词的指示句；汉语用“这是”自然表达。קָרְבַּן 在此为献给上帝的祭祀供物。
- source_word: נַחְשׁוֹן בֶּן עַמִּינָדָב
  choice: 亚米拿达之子拿顺
  rationale: 按现代中文圣经人名的通行音译处理，并用“之子”简洁保留父子关系。
theological_decisions:
- issue: שְׁלָמִים 的祭类名称
  choice: 平安祭
  alternative: 团契祭；福祉祭
  rationale: 该词可关联平安、福祉以及献祭后的共享筵席。“平安祭”是清楚而通行的祭祀术语，但脚注保留其他能够体现其关系性和福祉含义的译法，避免把词义只限定为一种解释。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。量词依牲畜用“头”和“只”；清单结构简洁清楚。脚注标记紧随其实际解释的“平安祭”，而非放在后面的牲畜名称之后。
