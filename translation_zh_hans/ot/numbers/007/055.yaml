base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/055.yaml
  text: His offering was one silver plate[a], its weight one hundred thirty shekels, one silver basin of seventy shekels, according to the shekel of the sanctuary[c][b]; both of them were full of fine flour mixed with oil for a grain offering.
translation:
  language: zh_hans
  text: 他的供物是：一个银盘[a]，重一百三十舍客勒；一个银盆[b]，重七十舍客勒——都是按圣所的舍客勒[c]。两个器皿都盛满了调油的细面，作素祭。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “盘”或译“碟”；原词指一种较浅的银器皿。
    reason: lexical_alternative
  - marker: b
    text: “盆”或译“碗”；原词指圣所礼仪中使用的器皿。
    reason: lexical_alternative
  - marker: c
    text: “按圣所的舍客勒”是指按照圣所规定的标准重量。舍客勒是古代重量单位。
    reason: cultural_note
lexical_decisions:
- source_word: קָרְבָּנוֹ
  choice: 他的供物是
  rationale: קָרְבָּן指带到上帝面前献上的礼物；在本段礼仪语境中，“供物”自然且准确。原文是无动词的清单句，汉语补出“是”以便阅读。
- source_word: קַעֲרַת כֶּסֶף אַחַת
  choice: 一个银盘
  rationale: קְעָרָה指较浅的器皿；“银盘”符合本段器物清单的语境，同时以脚注保留“银碟”这一可能译法。
- source_word: שְׁלֹשִׁים וּמֵאָה מִשְׁקָלָהּ
  choice: 重一百三十舍客勒
  rationale: 原文直译为“它的重量是一百又三十”；汉语依惯常数序译作“一百三十”，并用“重”简洁表达重量。
- source_word: מִזְרָק אֶחָד כֶּסֶף
  choice: 一个银盆
  rationale: מִזְרָק是圣所礼仪所用的容器；“盆”比日常色彩较强的“碗”更能体现其器物性质，但脚注保留另一可能译法。
- source_word: שִׁבְעִים שֶׁקֶל
  choice: 重七十舍客勒
  rationale: 该短语说明银盆的重量；补出“重”使现代汉语清楚自然。
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: 按圣所的舍客勒
  rationale: 该短语指定称量所依据的圣所标准；保留“舍客勒”这一古代重量单位，并在脚注解释。
- source_word: שְׁנֵיהֶם מְלֵאִים
  choice: 两个器皿都盛满了
  rationale: 明确保留שְׁנֵיהֶם对前述两个器皿的指称；“盛满了”比直译“是满的”更符合容器语境。
- source_word: סֹלֶת בְּלוּלָה בַשֶּׁמֶן
  choice: 调油的细面
  rationale: סֹלֶת是献祭所用的精细面粉，בְּלוּלָה表示与油混合；“调油的细面”是简洁、庄重而自然的礼仪表达。
- source_word: לְמִנְחָה
  choice: 作素祭
  rationale: 在祭司礼仪语境中，מִנְחָה专指以谷物为主要祭物的祭；“素祭”是简明而明确的中文术语。
theological_decisions:
- issue: מִנְחָה在本节中的祭祀类别
  choice: 素祭
  alternative: 礼物／供物
  rationale: 此处与细面和油直接相连，明确属于祭司礼仪中的谷物祭，不宜泛化为普通礼物；该选择只标明原文祭类，不加入宗派解释。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文，以冒号和分号呈现清单结构。重量标准在希伯来语中位于第二件器皿之后；译文用破折号和“都是”自然表明它适用于前述两件银器，同时不改动原文信息。
