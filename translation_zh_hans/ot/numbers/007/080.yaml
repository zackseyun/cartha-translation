  text: one golden dish of ten shekels[a], full of incense[b];
translation:
  language: zh_hans
  text: 一个金盘[a]，重十舍客勒[b]，里面盛满了香；
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “盘”所译的希伯来词也常译作“匙”；这里指盛香用的小型器皿。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“一个金盘，十金，盛满了香”；“舍客勒”是根据本章献礼清单中反复出现的格式补出的重量单位。
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּף
  choice: 金盘
  rationale: 这里指盛香用的小型器皿，而不是人的手掌；“盘”比现代汉语中的“匙”更能自然表达容器的用途。
- source_word: אַחַת
  choice: 一个
  rationale: 阴性基数词，与כַּף相配，表示一个器皿。
- source_word: עֲשָׂרָה זָהָב
  choice: 重十舍客勒
  rationale: 原文省略重量单位；根据本章反复出现的献礼清单格式，所指为十舍客勒。用“重”明确这是重量，而非价值。
- source_word: מְלֵאָה
  choice: 里面盛满了
  rationale: 表达器皿处于装满某物的状态，符合现代汉语习惯。
- source_word: קְטֹרֶת
  choice: 香
  rationale: 祭司礼仪和会幕语境中所用的标准祭香用语。
