  text: אֵ֚ל מוֹצִיא֣/וֹ מִ/מִּצְרַ֔יִם כְּ/תוֹעֲפֹ֥ת רְאֵ֖ם ל֑/וֹ יֹאכַ֞ל גּוֹיִ֣ם צָרָ֗י/ו וְ/עַצְמֹתֵי/הֶ֛ם יְגָרֵ֖ם וְ/חִצָּ֥י/ו יִמְחָֽץ׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/008.yaml
  text: God brings him out of Egypt[a]; he has for him the horns of a wild ox. He will consume the nations that are his adversaries[b], and will gnaw their bones and crush them with his arrows.
translation:
  language: zh_hans
  text: '上帝领他出埃及；

    他有如野牛的角[a]。


    他要吞灭敌对他的列国，

    啃咬他们的骨头[b]，

    用他的箭击碎他们。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他有野牛般的威力。”希伯来语短语含义较难确定；“野牛”指古代的一种大型野生牛科动物。
    reason: lexical_alternative
  - marker: b
    text: “啃咬”所译的希伯来语动词十分罕见；也可理解为“打断他们的骨头”或“使他们的骨头裸露”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵל
  choice: 上帝
  rationale: 这里明确以上帝为施行拯救的主语；“上帝”是现代普通话中自然、庄重且不带宗派限定的称呼。
- source_word: מוֹצִיאוֹ מִמִּצְרַיִם
  choice: 领他出埃及
  rationale: 分词带第三人称单数后缀，具有生动的进行或现时叙述色彩；“领他出埃及”保留出埃及事件的固定意象，也保留单数受事者。
- source_word: כְּתוֹעֲפֹת רְאֵם לֹו
  choice: 他有野牛般的威力
  rationale: 该短语意义困难；תּוֹעֲפֹת可指高耸之物或强大威势，与רְאֵם的野生牛科动物意象结合。正文采用自然的“威力”，脚注保留“高角”这一更具象的理解。
- source_word: יֹאכַל
  choice: 吞灭
  rationale: 本义是“吃、吞吃”，在战争诗歌中表示彻底毁灭。“吞灭”既保留吞食意象，又符合现代汉语表达。
- source_word: גּוֹיִם צָרָיו
  choice: 敌对他的列国
  rationale: צָרָיו限定גּוֹיִם，表示这些列国是他的敌手；此译法保留关系而不把范围泛化为所有列国。
- source_word: וְעַצְמֹתֵיהֶם יְגָרֵם
  choice: 啃碎他们的骨头
  rationale: יְגָרֵם是罕见动词，确切语义不明；“啃碎”与前面的吞食意象连贯，同时表达对骨头的猛烈破坏。其他可能义项列入脚注。
- source_word: וְחִצָּיו יִמְחָץ
  choice: 用他的箭击碎他们
  rationale: יִמְחָץ通常表示压碎、击碎；汉语补出由上下文可知的受事者“他们”，并将“他的箭”表达为工具，以形成自然而有力的战斗诗句。
theological_decisions:
- issue: 巴兰谕言中第三人称单数代词的所指
  choice: 保留“他／他的”这一单数表达，不在正文中明确其身份
  alternative: 可理解为作为整体的以色列、以色列的君王或代表，也可在后来的诠释传统中指向弥赛亚个体
  rationale: 希伯来文持续使用单数形式，而上下文容许集体单数和君王代表等理解。译文不擅自缩窄所指，以保留原文的神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的诗体普通话，以分行维持谕言的节奏和并行结构。保留猛烈的吞食、碎骨和箭击意象；单数代词一律保留，不解释为特定个人。脚注标记紧随其实际说明的词句，修正了咨询层中标记位置与脚注内容不对应的问题。
