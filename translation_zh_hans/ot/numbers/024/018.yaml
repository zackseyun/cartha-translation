  text: וְ/הָיָ֨ה אֱד֜וֹם יְרֵשָׁ֗ה וְ/הָיָ֧ה יְרֵשָׁ֛ה שֵׂעִ֖יר אֹיְבָ֑י/ו וְ/יִשְׂרָאֵ֖ל עֹ֥שֶׂה חָֽיִל׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/018.yaml
  text: Edom will become a possession[a]; Seir also will become a possession for his enemies[b], while Israel acts valiantly.
translation:
  language: zh_hans
  text: 以东必成为产业；西珥也必成为他仇敌的产业[a]；而以色列必大显威力[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “他”原文为阳性单数。可指上下文所说的那位统治者；也有人理解为西珥或以东，因而译作“西珥必成为其仇敌的产业”。
    reason: alternative_reading
  - marker: b
    text: “大显威力”原文直译为“施行力量”，是指显出力量或英勇行事的习语。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: 必成为
  rationale: 先知性话语中的完成式配合连接词表达将来的结果；“成为”自然体现状态的转变，“必”则传达宣告的确定性。
- source_word: אֱדוֹם
  choice: 以东
  rationale: 采用现代中文圣经传统中通行的专名译法，指以扫后裔的国家或地域。
- source_word: יְרֵשָׁה
  choice: 产业
  rationale: 该名词指被占有、取得之物；“产业”保留其归属与占有含义，也符合征服语境，不额外限定取得方式。
- source_word: שֵׂעִיר
  choice: 西珥
  rationale: 按通行译名音译；原文此处没有“山”字，因此不增译为“西珥山”。
- source_word: אֹיְבָיו
  choice: 他仇敌的
  rationale: 原文为第三人称阳性单数后缀，直译为“他的仇敌”；“他”可能回指上下文中的那位统治者，也可能按地域实体理解为西珥或以东，正文保留阳性单数形式。
- source_word: וְיִשְׂרָאֵל
  choice: 以色列却要
  rationale: 连接词基本义为“而、和”；“却”在中文中自然呈现以色列施展力量与以东、西珥成为产业之间的对照，同时不将逻辑关系说得过满。
- source_word: עֹשֶׂה חָיִל
  choice: 大显威力
  rationale: 这是表示施展力量、英勇有为的习语；“大显威力”自然、庄重，并保留军事语境中的强健意味。
theological_decisions:
- issue: “他仇敌”中单数代词的所指
  choice: 正文保留“他”，不明确指定其所指
  alternative: 译作“西珥仇敌的”或“其仇敌的”，将所指理解为西珥／以东
  rationale: 希伯来文确为阳性单数后缀，而17—19节的近距语境聚焦于一位从以色列兴起的统治者；保留“他”可维持这种文学联系，又不把经文明确化为某一特定的弥赛亚解释。脚注说明另一种可能，以保存原文歧义。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。平行分句保持简洁有力；正文以“他”保存原文代词的性与数，并用脚注交代所指歧义。所有脚注标记均已置于正文相应位置。
