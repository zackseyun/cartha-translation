revisions:
- from: 水要从他的桶里流出[a]，他的种子要在丰沛的水中；他的王必高过亚甲，他的国必被高举。
  to: 水必从他的桶中流出[a]，他的种子必得丰沛的水滋养；他的王必高过亚甲，他的国必被高举。
  rationale: 修订仅处理译入语句法和语气一致性：将“要”改为“必”，并将不完整的第二分句改为“必得丰沛的水滋养”。这反映丰富水源与种子／后裔兴旺的诗歌关系，却不把“种子”改定为后裔，也不认定“王”的身份。脚注内容和锚点均可保留。
