base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/007.yaml
  text: Water will flow from his buckets[a], and his seed will be in abundant waters; his king will be higher than Agag[b], and his kingdom will be exalted.
translation:
  language: zh_hans
  text: 水必从他的桶中流出[a]，他的种子必得丰沛的水滋养；他的王必高过亚甲，他的国必被高举。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “桶”也可能被比喻性地理解为“枝条”，但该词通常指汲水用的桶。
    reason: lexical_alternative
lexical_decisions:
- source_word: יִזַּל
  choice: 流出
  rationale: 该动词表达液体流淌；“流出”自然保留水流意象，又不把方式限定为滴落或倾泻。
- source_word: מִדָּלְיוֹ
  choice: 从他的桶里
  rationale: דְּלִי通常指汲水用的桶；此处采用其常见义，并以脚注保留较不确定的比喻解释。
- source_word: וְזַרְעוֹ
  choice: 他的种子
  rationale: זֶרַע既可指种子，也可指后裔；“种子”在诗歌语境中较能保留生育、繁茂与后代之间的双重意象。
- source_word: בְּמַיִם רַבִּים
  choice: 在丰沛的水中
  rationale: בְּ直译为“在……中”；רַבִּים在此表达水量充足。“丰沛”符合丰饶意象，且现代汉语自然。
- source_word: וְיָרֹם מֵאֲגַג
  choice: 必高过亚甲
  rationale: רוּם表示高升或崇高，比较介词מִן宜译作“过”；此译保留与亚甲的明确比较。
- source_word: מַלְכּוֹ
  choice: 他的王
  rationale: מֶלֶךְ直指君王；保留代词形式，不在译文中指定这位王的具体身份。
- source_word: וְתִנַּשֵּׂא מַלְכֻתוֹ
  choice: 他的国必被高举
  rationale: נשא的此形态表达被抬高、被尊崇；מַלְכוּת可指国度、王权或统治。“国必被高举”保留政治共同体意涵及被动形式。
theological_decisions:
- issue: “他的种子”的所指
  choice: 正文译作“他的种子”，不限定为农作物、后裔或二者兼有。
  alternative: 可译“他的后裔”或“他的子孙”。
  rationale: 希伯来语זֶרַע本身兼有种子和后裔的语义，水源丰沛的诗歌背景可能有意唤起繁衍与丰饶的双重意象，不宜在正文中消除这种张力。
- issue: “他的王”的身份及其与亚甲的关系
  choice: 保留为“他的王必高过亚甲”，不作具体身份认定。
  alternative: 可理解为以色列未来的君王，也可作预表性或弥赛亚式理解。
  rationale: 经文本身没有明确指出这位王是扫罗、大卫、弥赛亚或其他人物，因此译文只呈现原文的王权比较，不加入后来的神学判断。
- issue: מַלְכוּת的范围
  choice: 译为“国”。
  alternative: 可译“王权”或“统治”。
  rationale: 该词可涵盖国度、王权和统治；“国”在现代汉语中简洁自然，并与“他的王”形成对应，同时不排斥其统治权的含义。
translation_notes:
  register: 采用庄重而明白的现代标准汉语，保持诗句的两组平行结构。“丰沛的水”传达充足与繁茂；“种子”刻意保留原文在植物繁盛与后裔兴旺之间的含混。脚注标记[a]已置于正文对应位置。未为“亚甲”设置脚注，因为原文没有相关词义歧义；英语咨询层的[b]实际说明“seed”，其标记位置与说明内容不一致，中文稿据原文重新校准。
