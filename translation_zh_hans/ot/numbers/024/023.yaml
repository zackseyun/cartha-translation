base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/023.yaml
  text: Then he took up his discourse and said[a], “Alas[b], who can live when God does this?”
translation:
  language: zh_hans
  text: '他又吟诵一段诗体宣告[a]，说：


    “哀哉！上帝使这事发生时[b]，谁能存活呢？”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “诗体宣告”或译“箴言”、“比喻”或“神谕”。原词可指多种格言式、比喻性或诗体言辞。
    reason: lexical_alternative
  - marker: b
    text: 本句希伯来文含义难定；“上帝使这事发生时”也可译作“上帝设立这事时”。原文这一短语高度压缩，按词形可见“从／由于……设立他（它）……上帝”一类的结构；其中代词所指及“上帝”的句法作用并不明确。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשָּׂא
  choice: 又吟诵
  rationale: נשׂא与מָשָׁל连用，是“发出、吟诵一段言辞”的惯用表达。“吟诵”符合此处诗体宣告的语境，也比直译“举起”自然；“又”体现这一宣告承接前文一连串诗歌。
- source_word: מְשָׁלוֹ
  choice: 他的诗歌
  rationale: מָשָׁל可指箴言、比喻、讽喻或诗体宣告。此处指巴兰所吟诵的一段诗体言辞，“诗歌”在现代汉语中清楚自然，同时不把它限定为某一种预言体裁。
- source_word: אוֹי
  choice: 哀哉
  rationale: 该感叹词表达悲叹与惊惧。“哀哉”庄重而简洁，保留原文强烈的感叹语气。
- source_word: מִי יִחְיֶה
  choice: 谁能存活呢
  rationale: 字面为“谁会活着”；在将临灾变的语境中是问谁能够活下来。“能存活”自然表达其生存、幸免之意，同时保留反问力度。
- source_word: מִשֻּׂמוֹ
  choice: 使这事发生时
  rationale: 这是一个高度压缩且含义困难的形式，源于שׂוּם（放置、设立、使之发生）并带介词מִן及第三人称阳性单数后缀。正文按时间意义处理，并以“这事”笼统指向所预告的变局，不把原文未明说的内容具体化。
- source_word: אֵל
  choice: 上帝
  rationale: 将אֵל理解为末句的主语，指施行这事的上帝；“上帝”是现代汉语中自然、庄重的称呼。
theological_decisions:
- issue: 困难短语מִשֻּׂמוֹ אֵל中施事者及句法关系
  choice: 将אֵל理解为主语，译作“上帝使这事发生时”
  alternative: “当他设立这事时，上帝啊”；或按不同的后缀及句法分析理解为“自从上帝设立它”
  rationale: 原文结构简约，代词后缀的所指和אֵל的句法作用都不完全明确。正文采用语境上较连贯的时间性理解，保留上帝的施事角色；脚注说明原文也可有更贴近“设立”的译法，避免把有争议的句法说成唯一解释。
translation_notes:
  register: 采用现代、庄重而易懂的叙事和诗歌语体。“哀哉”保留古典庄重感，但在现代读者中仍通行。正文不擅自说明“这事”具体指哪一场灾难，并用脚注保留末句希伯来文真实的句法歧义。
