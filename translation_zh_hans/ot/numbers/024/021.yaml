base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/021.yaml
  text: 'Then he saw the Kenite[a], and he took up his discourse and said: “Your dwelling place is enduring, and your nest is set in the rock.”'
translation:
  language: zh_hans
  text: '他看见基尼人，就吟诗[a]说：


    “你的住处坚固，


    把你的巢安在岩石中吧！”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“宣告”。希伯来词 מָשָׁל 可指箴言、讥讽的话或先知性的诗体言说；这里指巴兰所吟诵的诗体宣告。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַקֵּינִי
  choice: 基尼人
  rationale: 希伯来语形式为带冠词的单数，在这里以单数集合称谓代表基尼族群；汉语“基尼人”既自然，也可按上下文作群体理解。
- source_word: מְשָׁלוֹ
  choice: 诗歌
  rationale: מָשָׁל在巴兰的诗歌语境中指庄重的诗体言说，可带先知性宣告意味。“诗歌”符合本段形式，同时以脚注保留“宣告”等语义可能。
- source_word: אֵיתָן
  choice: 坚固
  rationale: 该词表达牢固、持久、稳固；“坚固”与岩石和巢穴的意象自然呼应，又不把重点限定为时间上的长久。
- source_word: מוֹשָׁבֶךָ
  choice: 你的住处
  rationale: 指居住之处或定居之地；“住处”简洁、自然，并保留第二人称单数的诗体称呼。
- source_word: וְשִׂים
  choice: 把……安在……吧
  rationale: 按WLC元音标注，此词为第二人称阳性单数命令式。译文保留其命令或劝令语气，不将其无提示地改作陈述式“安在”。
- source_word: בַּסֶּלַע
  choice: 在岩石中
  rationale: סֶלַע可指岩石、峭壁或岩崖；介词בְּ基本义为“在……中/里”。“在岩石中”保留原文表达及岩间筑巢的意象。
- source_word: קִנֶּךָ
  choice: 你的巢
  rationale: 原词直指鸟巢，并与基尼人的名称形成可能的音韵联想；直译“巢”可保存这一鲜明比喻。
theological_decisions:
- issue: וְשִׂים的语气
  choice: 按马所拉元音保留命令式：“把你的巢安在岩石中吧”
  alternative: 按上下文作状态陈述：“你的巢安在岩石中”
  rationale: WLC将该词标为命令式；虽然不少译法根据诗句平行关系把它理解为状态描写，但正文保留形式上的命令语气，更能保存原文的张力。
translation_notes:
  register: 采用现代、庄重而易懂的诗体汉语。分行呈现平行诗句；“吟诵诗歌说”承接巴兰反复出现的诗歌引言格式。脚注标记置于其实际说明的“诗歌”之后。
