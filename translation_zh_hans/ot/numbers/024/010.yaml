base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/010.yaml
  text: Then Balak’s anger burned against Balaam[a], and he struck his hands together. And Balak said to Balaam, “I called you to curse my enemies, but look—you have indeed blessed them these three times!”
translation:
  language: zh_hans
  text: 于是，巴勒向巴兰怒火中烧，双掌相击。巴勒对巴兰说：“我召你来，是要你咒诅我的仇敌；看哪，你竟一连三次为他们祝福了[a]！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“你祝福了，祝福”，以限定动词和绝对不定式构成强调表达，表示祝福的行动受到加强或反复发生。
    reason: 说明 בֵּרַכְתָּ בָרֵךְ 的强调结构；标记紧贴其对应译文。
lexical_decisions:
- source_word: וַיִּחַר אַף בָּלָק אֶל בִּלְעָם
  choice: 巴勒向巴兰发怒
  rationale: 希伯来语惯用语字面涉及“怒气燃烧”，但现代汉语通常说“向……发怒”；这样既保留怒气所指向的对象，也避免生硬表达。
- source_word: וַיִּסְפֹּק אֶת כַּפָּיו
  choice: 就拍起掌来
  rationale: 该短语指双掌相击；上下文明确这是愤怒的动作，因此“拍起掌来”自然准确，不会被理解为赞赏性的鼓掌。
- source_word: לָקֹב
  choice: 咒诅
  rationale: 准确表达受召目的，即对敌人发出诅咒；也与本段祝福形成鲜明对照。
- source_word: אֹיְבַי
  choice: 我的仇敌
  rationale: 直接呈现第一人称复数所属关系；“仇敌”符合庄重的经文语体。
- source_word: קְרָאתִיךָ
  choice: 我召你来
  rationale: 此处不是普通呼喊，而是巴勒把巴兰召来执行任务；“召你来”比“叫你”更贴合语境。
- source_word: וְהִנֵּה
  choice: 看哪
  rationale: 保留该提示词引人注意并表达意外、责怪的功能，同时采用现代读者仍能理解的庄重经文用语。
- source_word: בֵּרַכְתָּ בָרֵךְ
  choice: 你竟……为他们祝福了
  rationale: 限定动词加绝对不定式构成强调；“竟”传达巴勒的惊愕和责怪，具体的重复则由“一连三次”明确表达，不额外加入“只顾”等解释。
- source_word: זֶה שָׁלֹשׁ פְּעָמִים
  choice: 一连三次
  rationale: 自然表达截至此刻发生的连续三次行动，也保留重复累积的语气。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留“看哪”“咒诅”“仇敌”等适合经文叙事的词语；避免将拍掌误写成带赞赏意味的“鼓掌”。脚注标记置于相关整句之后，解释希伯来文的强调结构。
