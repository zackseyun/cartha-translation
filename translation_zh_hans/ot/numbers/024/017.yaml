  text: אֶרְאֶ֨/נּוּ֙ וְ/לֹ֣א עַתָּ֔ה אֲשׁוּרֶ֖/נּוּ וְ/לֹ֣א קָר֑וֹב דָּרַ֨ךְ כּוֹכָ֜ב מִֽ/יַּעֲקֹ֗ב וְ/קָ֥ם שֵׁ֨בֶט֙ מִ/יִּשְׂרָאֵ֔ל וּ/מָחַץ֙ פַּאֲתֵ֣י מוֹאָ֔ב וְ/קַרְקַ֖ר כָּל בְּנֵי שֵֽׁת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/017.yaml
  text: I see him[a], but not now; I behold him, but not near. A star has come forth from Jacob, and a scepter has risen from Israel[c][b]; it will crush the corners of Moab and tear down all the sons of Sheth.
translation:
  language: zh_hans
  text: 我看见他[a]，却不是现在；我望见他，却不在近处。必有一颗星从雅各出现，必有一根权杖从以色列兴起；他必击碎摩押的边角[b]，摧毁所有舍特之子[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “我看见他”也可译作“我将看见他”。原文用阳性单数代词；后面的“星”和“权杖”是君王的意象。
    reason: lexical_alternative
  - marker: b
    text: “摩押的边角”直译原文；这可能指摩押的边界、全境或力量。
    reason: cultural_note
  - marker: c
    text: “舍特”也可译作专名“塞特”。有人则把这个词理解为对全人类或某一敌对族群的诗意称呼。
    reason: alternative_reading
lexical_decisions:
- source_word: אֶרְאֶנּוּ
  choice: 我看见他
  rationale: 该词是ראה的Qal未完成式第一人称单数，带第三人称阳性单数后缀。译作“他”保留原文的人称指向；现在时表达先知异象的鲜明感，同时不排除未来应验。
- source_word: אֲשׁוּרֶנּוּ
  choice: 我望见他
  rationale: שׁור意为观看、注视。“望见”既与“看见”构成诗意平行，也保留较为庄重的先知语体。
- source_word: וְלֹא קָרוֹב
  choice: 却不在近处
  rationale: קָרוֹב可指空间或时间上的近。译文不直接改成“不久”，以保留原文可能兼具的时空含义。
- source_word: דָּרַךְ כּוֹכָב
  choice: 有一颗星从……出来
  rationale: דָּרַךְ本义为踏出、行进，在此与“星”连用，描绘其出现或进发。“出来”自然地保留这一动态意象，而不把“星”直接解释为君王。
- source_word: וְקָם שֵׁבֶט
  choice: 有一根权杖……兴起
  rationale: שֵׁבֶט可指杖、权杖或支派。与“星”平行并处于征服语境中，“权杖”最能呈现王权意象；“兴起”对应קום。
- source_word: וּמָחַץ
  choice: 他必击碎
  rationale: מחץ意为击碎、粉碎。原文动词为阳性单数，主语可理解为星或权杖所象征的那位人物；用“他”承接开头的阳性单数对象，同时仍让星与权杖的象征保持在正文中。
- source_word: פַּאֲתֵי מוֹאָב
  choice: 摩押的四角
  rationale: פֵּאָה通常指角、边缘或侧面。“四角”是汉语中自然的整体性空间意象，也透明地保留原文比喻，不擅自改译为首领或力量。
- source_word: וְקַרְקַר
  choice: 摧毁
  rationale: 该罕见动词的确切意义有争议，常见理解包括拆毁、击破、毁灭。“摧毁”适合征服语境，但不对具体动作作过度限定。
- source_word: כָּל בְּנֵי שֵׁת
  choice: 所有示特之子
  rationale: שֵׁת按辅音文本最自然可作专名。采用“示特”音译，避免在正文中直接等同于创世记的“塞特”，并以脚注说明其他理解。
theological_decisions:
- issue: 巴兰神谕的弥赛亚含义
  choice: 正文保留“星”和“权杖”的王权意象，不直接将所指者称为弥赛亚。
  alternative: 明确译成弥赛亚预言，或仅限定为大卫等历史君王。
  rationale: 原文呈现一位未来征服者的象征性王权形象，却没有直接使用“弥赛亚”一词。保留意象可容纳其历史与更深层的弥赛亚理解，而不把解释写入正文。
- issue: 阳性单数所指与象征性主语的关系
  choice: 开头用“他”，后文也以“他”表达施行动作的所指者，同时保留“星”和“权杖”的象征。
  alternative: 后文用“它”将星或权杖完全非人格化，或把全节改写成明确的人物称号。
  rationale: 开头两个动词都带阳性单数宾语后缀，支持人格化所指；后文的星和权杖又构成诗歌象征。译文兼顾这两个层面。
- issue: 完成式的先知性用法
  choice: “出来、兴起”采用汉语无标记体，结果性行动译作“必击碎、摧毁”。
  alternative: 全部明确译成过去完成，或全部加“将要”译成普通将来。
  rationale: 希伯来语完成式在先知话语中可把未来事件描绘为确定事实。现代汉语不宜机械复制时态形式；无标记叙述配合“必”能兼顾异象的呈现感和预言的确定性。
translation_notes:
  register: 采用现代、庄重而清楚的普通话。保留“星”“权杖”“四角”等诗歌意象；使用“望见”“兴起”等略带典雅色彩但普通读者易懂的词语。所有脚注标记均置于相应正文之后。
