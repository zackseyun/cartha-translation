base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/015.yaml
  text: 'Then he took up his discourse and said: “The declaration of Balaam son of Beor[a], the declaration of the man whose eye is opened:”'
translation:
  language: zh_hans
  text: '他便吟诵他的诗歌，说：


    “比珥的儿子巴兰的宣告，


    眼睛被开启之人的宣告[a]：”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“眼睛闭着之人的宣告。”这句希伯来语较难理解，历来有不同解释。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשָּׂא מְשָׁלוֹ
  choice: 他又作歌说
  rationale: 该搭配惯用于引出巴兰正式的诗体言辞。译作“作歌说”既自然地表明其诗歌体裁和郑重性，也避免把 מָשָׁל 限定为现代汉语通常所说的“比喻”。
- source_word: וַיֹּאמַר
  choice: 说
  rationale: 与前面的惯用表达合译为“作歌说”，简洁地引出后面的直接引语。
- source_word: נְאֻם
  choice: 宣告
  rationale: 该词标示庄严而具有权威性的发言；两次出现均译为“宣告”，保留原文的重复和平行结构。
- source_word: בִּלְעָם בְּנוֹ בְעֹר
  choice: 比珥的儿子巴兰
  rationale: 按现代中文圣经人名惯例音译专名，并清楚表达父子关系。
- source_word: הַגֶּבֶר
  choice: 人
  rationale: 此处指男性说话者；中文用“人”自然庄重，无须额外强化其力量含义。
- source_word: שְׁתֻם הָעָיִן
  choice: 那眼睛睁开之人
  rationale: 该短语语义有争议。结合下一节“眼睛得以睁开”的异象语境，正文采用启示性看见的理解；同时用脚注保留“眼睛闭着”的可能解释。
theological_decisions:
- issue: 巴兰自称 שְׁתֻם הָעָיִן 的含义
  choice: 那眼睛睁开之人
  alternative: 那眼睛闭着的人
  rationale: 上下文把巴兰描写为领受上帝异象、眼睛得以开启的人，因此正文采用“睁开”；但该希伯来语表达本身艰深，词形也容许不同理解，故不在正文中消除争议，而在脚注列出另一译法。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“这是……的宣告”保留原文两行平行反复的正式语气；使用“作歌说”表明这是诗体宣言。
