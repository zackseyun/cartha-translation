  rationale: 修订删除无明确对应的“又”，以较自然的“吟诵他的诗歌”引出正式诗体言辞；将两次“宣告”重整为与希伯来文相应的平行结构；并以“眼睛被开启之人”表达正文所取的启示性理解，同时在脚注完整保留“闭着”的可行异译。
