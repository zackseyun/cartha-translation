  naturalness: 建议以“吟诵他的诗歌”表达“举起/说出他的诗歌（箴言式言辞）”，并将两句改为直接、平行的“……的宣告”。“眼睛被开启之人”比“那眼睛睁开之人”更符合现代汉语，也避免误解为人主动睁眼。
  terminology: “宣告”适合对应两次נְאֻם，且应保持一致。人名“巴兰”“比珥”正确。争议的שְׁתֻם הָעָיִן正文可按上下文采用“眼睛被开启”，但须保留“眼睛闭着”的脚注。
