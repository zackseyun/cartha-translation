base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/009.yaml
  text: He crouched[a], he lay down like a lion, and like a lioness—who will rouse him? Those who bless you are blessed[b], and those who curse you are cursed.
translation:
  language: zh_hans
  text: 他屈身躺卧，如狮子，又如母狮[a]；谁能叫他起来？祝福你的，必蒙福；咒诅你的，必受咒诅[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“又如壮狮”。希伯来语这个词可指强壮或成熟的狮子；正文译作“母狮”，以保留它与前一个“狮子”在原文中的用词区别。
    reason: lexical_alternative
  - marker: b
    text: 这句祝福与咒诅的公式呼应《创世记》12:3和27:29。
    reason: cross_reference
lexical_decisions:
- source_word: כָּרַע
  choice: 屈身
  rationale: 该动词表示身体弯下或伏低；结合后面的“躺卧”和狮子意象，“屈身”自然地描绘猛兽伏下的姿态，也避免误解为敬拜或臣服。
- source_word: שָׁכַב
  choice: 躺卧
  rationale: 常用义为躺下、卧下；与“屈身”并列，描绘狮子安然伏卧的状态。
- source_word: כַּאֲרִי
  choice: 如公狮
  rationale: אֲרִי是狮子的常用词，כַּ明确表达比喻。译作“公狮”可与下一个不同的狮类词形成自然对应。
- source_word: וּכְלָבִיא
  choice: 又如母狮
  rationale: לָבִיא可指狮子或母狮，也可能强调强壮、成熟。正文采用“母狮”以保留它与前一个狮子用词的区别，脚注注明“壮狮”这一可能译法。
- source_word: מִי יְקִימֶנּוּ
  choice: 谁能叫他起来？
  rationale: קום的使役式在伏卧狮子的语境中指使其起身或将其惊起。“叫他起来”既贴近原文，也保留“唤醒、惊动”的语境意味。
- source_word: מְבָרֲכֶיךָ בָרוּךְ
  choice: 为你祝福的，蒙福
  rationale: 分词加第二人称单数后缀自然译为“为你祝福的”；בָרוּךְ作为表语，是祝福状态的宣告。中文用“蒙福”简洁保留格言式语气。
- source_word: וְאֹרְרֶיךָ אָרוּר
  choice: 咒诅你的，受咒诅
  rationale: 与前句形成严格平行，直接保留“祝福／咒诅”和“蒙福／受咒诅”的对应关系。
theological_decisions:
- issue: “为你祝福的……咒诅你的”中第二人称单数所指
  choice: 保留单数“你”，让它在巴兰诗歌中指向以单数形象出现的以色列／雅各
  alternative: 明确译成“为以色列祝福的”；或把所指限定为以色列的王
  rationale: 上下文以诗歌性的单数称呼以色列／雅各，并与族长祝福传统相呼应。正文不把所指进一步限定，以保存其代表性、群体性的张力。
- issue: 族长祝福公式的回响
  choice: 正文直接保留祝福与咒诅的对称宣告，以脚注提示相关经文
  alternative: 在正文中明说这是亚伯拉罕之约的应验或扩写其神学含义
  rationale: 原文确实强烈呼应《创世记》中的祝福公式，但翻译不应把后续神学解释嵌入正文。
translation_notes:
  register: 采用现代、庄重而易懂的诗体表达。“屈身躺卧”保留两个连续动词；“蒙福／受咒诅”形成简洁对仗。正文中的“他”和“你”均按希伯来语保留单数，不擅自明确其代表对象。
