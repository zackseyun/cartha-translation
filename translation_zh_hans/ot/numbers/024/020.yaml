  text: וַ/יַּרְא֙ אֶת עֲמָלֵ֔ק וַ/יִּשָּׂ֥א מְשָׁל֖/וֹ וַ/יֹּאמַ֑ר רֵאשִׁ֤ית גּוֹיִם֙ עֲמָלֵ֔ק וְ/אַחֲרִית֖/וֹ עֲדֵ֥י אֹבֵֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/020.yaml
  text: 'Then he saw Amalek and took up his discourse and said: “Amalek was the first of the nations[c][b][a], but his end is utter destruction.”'
translation:
  language: zh_hans
  text: '于是他看见亚玛力，便吟诵这首诗歌说：[a]


    “亚玛力是列国之首，[b]


    但他的结局终必灭亡。”[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “吟诵这首诗歌”也可译作“发出他的神谕”或“说出他的箴言”；原文这个词可指诗歌、箴言、讥讽诗或神谕。
    reason: lexical_alternative
  - marker: b
    text: “列国之首”也可译作“列国中最早的”或“列国中居首的”；原文既可能指时间上的最早，也可能指地位上的首要。
    reason: lexical_alternative
  - marker: c
    text: “结局终必灭亡”也可译作“结局就是灭亡”或“最终必灭亡”；原文表达简练，指向彻底的毁灭。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא אֶת־עֲמָלֵק
  choice: 他看见亚玛力
  rationale: 按叙事次序直译“看见”；“亚玛力”在此以族名代表该民族。
- source_word: וַיִּשָּׂא מְשָׁלוֹ
  choice: 就作诗说
  rationale: מָשָׁל在此指巴兰所发的诗体言辞，也可理解为箴言、诗歌或神谕；“作诗说”在现代汉语中自然，并保留其诗体性质。
- source_word: רֵאשִׁית גּוֹיִם
  choice: 列国之首
  rationale: רֵאשִׁית既可表示时间上的“最早”，也可表示地位上的“居首”；“列国之首”保留一定歧义，并以脚注说明。
- source_word: וְאַחֲרִיתוֹ
  choice: 但他的结局
  rationale: אַחֲרִית表示最终结局，与前句的“之首”形成对照；连接词按语义转折译作“但”。
- source_word: עֲדֵי אֹבֵד
  choice: 必归灭亡
  rationale: 原文是简练的省略表达，指向最终的毁灭；“归灭亡”传达其终局性，而不额外加入原文未明说的“永远”。
theological_decisions:
- issue: “列国之首”所指的是时间优先还是地位居首
  choice: 在正文中保留歧义，以“列国之首”表达，并用脚注列出两种可能
  alternative: 明确译为“列国中最早的”或“列国中最强盛的”
  rationale: 希伯来语רֵאשִׁית可指起初、最早或首要；经文本身没有消除歧义，因此不以历史或神学推断替文本作出决定。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“作诗说”承接民数记中巴兰连续发出的诗体言辞；正文保持简洁、平行的诗歌节奏。脚注标记均置于对应正文之后。
