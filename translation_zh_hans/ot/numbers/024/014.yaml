base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/014.yaml
  text: And now[a], behold, I am going to my people. Come[b], I will advise you what this people will do to your people in the latter days.
translation:
  language: zh_hans
  text: 如今，看哪，我正要到我的族人那里去。来吧，我要指点你：这百姓在末后的日子[a]会怎样对待[b]你的百姓。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“在将来的日子”。这个希伯来语短语可以泛指未来，但“末后的日子”保留了它可能具有的预言和终末意味。
    reason: alternative_reading
  - marker: b
    text: 也可译作“攻击你的百姓”。原文介词直译是“向”或“对”，但在这里的语境中可能指敌对行动。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: 现在
  rationale: 作为时间性话语标记，引出巴兰接下来的陈述；汉语用“现在”已能自然承接上文，不必生硬译出连接词וְ。
- source_word: הִנְנִי
  choice: 看哪，我要
  rationale: הִנְנִי突出说话者当前或即将采取的行动；“看哪”保留原文显著的提示语气，“我要”则自然表达其临近性。
- source_word: הוֹלֵךְ לְעַמִּי
  choice: 要到我的族人那里去了
  rationale: 分词表示即将进行的行动；“我的族人”自然表达עַמִּי的群体归属，且不额外限定具体民族身份。
- source_word: לְכָה
  choice: 来吧
  rationale: 这是召唤对方注意或行动的命令式表达；“来吧”既自然，也保留劝请语气。
- source_word: אִיעָצְךָ
  choice: 我要指点你
  rationale: יעץ的核心义为劝告、谋划或给予指点。此处后接预告性内容，“指点你”既保留劝告含义，也能自然引出下文，而不把它简化为单纯“通知”。
- source_word: אֲשֶׁר יַעֲשֶׂה
  choice: 会怎样对待
  rationale: 关系结构引出这番指点的具体内容。汉语“会怎样对待”自然表达“将对……做什么”，同时给לְעַמְּךָ留下关系或敌对行为的语境空间。
- source_word: הָעָם הַזֶּה
  choice: 这百姓
  rationale: 保留עָם的单数集合意义及指示语气；“百姓”符合庄重而易懂的圣经叙事语体。
- source_word: לְעַמְּךָ
  choice: 对待你的百姓
  rationale: 介词לְ字面表示朝向或受事关系；结合יַעֲשֶׂה译为“对待”，既保持形式上的开放性，也不在正文中提前确定为“攻击”。
- source_word: בְּאַחֲרִית הַיָּמִים
  choice: 在末后的日子
  rationale: 保留希伯来语惯用表达的预言分量及其潜在末世意涵，同时用脚注说明它也可泛指未来。
theological_decisions:
- issue: בְּאַחֲרִית הַיָּמִים所指的预言时间
  choice: 在末后的日子
  alternative: 在将来的日子
  rationale: 该短语既可能泛指未来，也可能带有更强的终末性意味。正文保留“末后的日子”，不把这层神学张力消解为普通的将来时间。
- issue: לְעַמְּךָ是否明确表示敌对行动
  choice: 对待你的百姓
  alternative: 攻击你的百姓
  rationale: 介词לְ本身并非明确的敌对标记，虽然后续预言显示行动具有敌对性质。正文保留较宽的关系表达，并在脚注中交代语境允许的明确译法。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“看哪”保留原文刻意突出的提示语气；“指点”比“告知”更贴近יעץ的劝告义，又能自然引出预言内容。脚注标记均置于所解释的短语之后。
