base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/024.yaml
  text: But ships shall come from the coast of Kittim[a], and they shall afflict Asshur, and they shall afflict Eber[d][c][b]; and he too shall come to destruction.
translation:
  language: zh_hans
  text: 必有船只从基提沿岸[a]而来；这些船必使亚述[b]受苦，也必使希伯[c]受苦；他[d]也必归于灭亡。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “基提”可能特指塞浦路斯，也可能泛指西方的海洋民族。
    reason: alternative_reading
  - marker: b
    text: “亚述”也可理解为亚述的地域、人民或帝国。
    reason: lexical_alternative
  - marker: c
    text: “希伯”可能是族名，也可能指希伯来人，或指某一边界（如幼发拉底河）“彼岸”的诸民。
    reason: alternative_reading
  - marker: d
    text: 希伯来文作“他也”；这个代词所指不明，也有人按集合意义理解为“它也”，或认为它指基提势力的统治者。
    reason: alternative_reading
lexical_decisions:
- source_word: צִים
  choice: 船只
  rationale: 该词指航海船舶；用“船只”自然、宽泛，不额外限定为舰队或战船。
- source_word: מִיַּד
  choice: 从……沿岸
  rationale: 字面为“从……之手”，在地理语境中可指一地的边沿、海岸或区域；因上下文提到船只，“从……沿岸”最贴合海上来航的画面。
- source_word: כִּתִּים
  choice: 基提
  rationale: 保留希伯来文专名，不直接判定为塞浦路斯或更广泛的西方海洋民族。
- source_word: וְעִנּוּ
  choice: 必压迫
  rationale: ענה 的强化词干可表达使人受苦、压制或羞辱；“压迫”在此能自然表达敌对势力施加的苦害与制伏。
- source_word: אַשּׁוּר
  choice: 亚述
  rationale: 采用现代中文圣经与历史语境中通行的专名译法，同时由脚注说明它可指相关地域或政权。
- source_word: עֵבֶר
  choice: 希伯
  rationale: 按专名音译，以保留它可能指希伯一族、希伯来人或边界彼岸诸民的歧义。
- source_word: וְגַם הוּא
  choice: 他也
  rationale: 忠实保留希伯来文阳性单数代词；其先行对象并不明确，不在正文中擅自解释为某民族、政权或统治者。
- source_word: עֲדֵי אֹבֵד
  choice: 必走向灭亡
  rationale: 表达“直到／趋于毁灭”的方向和结局，又不加入“永远灭亡”或“彻底毁灭”等原文未明确强化的含义。
theological_decisions:
- issue: 基提、亚述、希伯及末句单数代词的所指
  choice: 正文保留“基提、亚述、希伯”等名称，并把末句阳性单数代词译作“他”。
  alternative: 可将基提解释为塞浦路斯或西方海洋势力，将亚述理解为亚述帝国，将希伯理解为希伯来人或幼发拉底河彼岸诸民，并将“他”理解为基提所代表的势力、其统治者或另一帝国。
  rationale: 这则预言涉及的历史对象存在争议；原文并未明确消除这些歧义，因此正文不锁定某一历史或神学解释。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。“必有……而来”保留预言语气；分号呈现三个并列而又递进的分句。专名使用简体中文语境中较熟悉的“基提、亚述、希伯”，并以脚注保存历史所指的不确定性。
