  text: וְ/עַתָּ֖ה בְּרַח לְ/ךָ֣ אֶל מְקוֹמֶ֑/ךָ אָמַ֨רְתִּי֙ כַּבֵּ֣ד אֲכַבֶּדְ/ךָ֔ וְ/הִנֵּ֛ה מְנָעֲ/ךָ֥ יְהוָ֖ה מִ/כָּבֽוֹד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/011.yaml
  text: So now[a], flee to your place. I said, ‘I would surely honor you,’ but behold[b], Yahweh has kept you back from honor.
translation:
  language: zh_hans
  text: “现在，你逃到你自己的地方去吧！我曾说[a]：‘我必定尊荣你。’但看哪，雅威使你得不到尊荣[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “我曾说”也可按语境译作“我本来说要……”。“必定尊荣你”所对应的希伯来语使用不定式绝对形加限定动词的强调结构。
    reason: 时态与强调结构的译法
  - marker: b
    text: “使你得不到尊荣”也可译作“阻止你获得尊荣”或“使你不得尊荣”。
    reason: 词义与句法的可选译法
lexical_decisions:
- source_word: וְעַתָּה
  choice: 现在
  rationale: 承接巴勒前面的斥责，并引出最后的逐客命令；现代汉语用“现在”即可自然表达转折后的时间推进。
- source_word: בְּרַח לְךָ אֶל־מְקוֹמֶךָ
  choice: 你逃回自己的地方去吧
  rationale: בְּרַח是语气强烈的命令，含赶快逃离之意；“逃回……去吧”保留巴勒粗暴逐客的口吻。“自己的地方”不擅自限定为家乡或住所。
- source_word: אָמַרְתִּי
  choice: 我曾说
  rationale: 指巴勒先前所作的承诺。希伯来语形式本身是完成式，汉语译为“曾说”自然，同时在脚注保留“本来说过”的语境性理解。
- source_word: כַּבֵּד אֲכַבֵּדְךָ
  choice: 我一定要尊荣你
  rationale: 同源不定式绝对形与限定动词连用，具有强调作用；“一定要”传达承诺的强烈语气，而不机械重复动词。
- source_word: וְהִנֵּה
  choice: 可是，看哪
  rationale: וְ在这里具有语境上的反差，“可是”显明承诺与结果的对立；“看哪”保留הִנֵּה的突显和即时感，并维持庄重语体。
- source_word: מְנָעֲךָ מִכָּבוֹד
  choice: 使你得不到尊荣
  rationale: מנע与מן连用表示阻止某人获得某物。“使你得不到尊荣”符合现代汉语，并保留是雅威阻止巴兰获得巴勒所许尊荣的意思。
- source_word: יְהוָה
  choice: 雅威
  rationale: 将四字神名作为专名音译，而不以称号代替；“雅威”是现代汉语中可辨认的音译形式。
- source_word: כָּבוֹד
  choice: 尊荣
  rationale: 此处指巴勒原拟给予巴兰的地位、礼遇和相应奖赏，并非抽象的神圣荣耀；“尊荣”既与前句动词呼应，也不把含义窄化为金钱报酬。
theological_decisions:
- issue: 四字神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用神的专名。正文采用音译“雅威”，保留其专名性质；不以“上主”这一称号取代，也不选用来源较晚的传统音译“耶和华”。
- issue: 雅威使巴兰得不到尊荣所表达的因果关系
  choice: 保留巴勒归因于雅威的原话
  alternative: 解释为雅威惩罚巴兰，或解释为巴勒讽刺性地推卸责任
  rationale: 经文明确由巴勒说雅威阻止巴兰得尊荣，却没有在本句解释这是客观神学判断、讽刺，还是推责；译文不替叙述者裁定。
translation_notes:
  register: 采用现代、庄重而易懂的直接引语。“逃回”保持逐客命令的力度；“看哪”略带经文语体，用来保存原文突显语气。正文避免把“尊荣”具体化为钱财或奖赏，也不解释巴勒言辞的神学可靠性。
