revisions:
- from: '它们绵延开来，如同河谷，

    如同河畔的园子，

    如同雅威栽种的沉香树[a]，

    如同水边的香柏树。'
  to: '它们如同河谷般延展，

    如同河畔的园子，

    如同雅威栽种的沉香树[a]，

    如同水边的香柏树。'
  rationale: 修订首行以使比较关系在现代汉语中明确自然；并重写脚注，避免以“芦荟树”造成现代植物名称上的误解，同时保留原文所涉芳香木种类的辨识不确定性。其余措辞忠实且适合现代庄重诗体，故予以保留。
