source:
  edition: WLC
  text: כִּ/נְחָלִ֣ים נִטָּ֔יוּ כְּ/גַנֹּ֖ת עֲלֵ֣י נָהָ֑ר כַּ/אֲהָלִים֙ נָטַ֣ע יְהוָ֔ה כַּ/אֲרָזִ֖ים עֲלֵי מָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/006.yaml
  text: Like valleys they spread out[a], like gardens beside a river, like aloes that Yahweh has planted, like cedars beside the waters.
translation:
  language: zh_hans
  text: '它们如同河谷般延展，

    如同河畔的园子，

    如同雅威栽种的沉香树[a]，

    如同水边的香柏树。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“沉香木”或“伽罗木”。这里的希伯来词指芳香的树木或木料，并非“帐棚”。
    reason: 保留植物名称辨识上的不确定性，并说明该词在此不是指“帐棚”。
lexical_decisions:
- source_word: נְחָלִים
  choice: 河谷
  rationale: 该词可指有水流经过的谷地、溪谷或河床；这里以“河谷”保留地形和水源所带来的丰美意象。
- source_word: נִטָּיוּ
  choice: 绵延开来
  rationale: 源自动词 נטה，表示伸展、铺展；“绵延开来”自然传达复数主体广阔铺陈的景象。
- source_word: גַנֹּת
  choice: 园子
  rationale: 直译复数“园圃、园子”；“园子”通俗自然，也保留人工培植、繁茂肥沃的意象。
- source_word: עֲלֵי נָהָר
  choice: 河畔
  rationale: 介词短语在此表示临近河流；“河畔”简洁而具有诗意。
- source_word: אֲהָלִים
  choice: 沉香树
  rationale: 这里指产生芳香木料的树，通常理解为沉香木一类；采用“沉香树”比字面相近但语义不合的“帐棚”更符合诗歌语境，并以脚注保留译名差异。
- source_word: נָטַע
  choice: 栽种
  rationale: 该完成式描写雅威已经施行、结果已然可见的栽植行动；汉语“栽种”无需另加时态词即可自然表达。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文直接呈现神的专名，而不以称号替代。
- source_word: אֲרָזִים
  choice: 香柏树
  rationale: 这是该树名在现代中文圣经语境中清楚而惯常的译法，并传达高大、坚固的意象。
- source_word: עֲלֵי מָיִם
  choice: 水边
  rationale: 自然表达临水而生的景象；希伯来文“众水”的形式在汉语中以集合性的“水”表达更流畅，丰沛水源的意象仍由上下文保存。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；音译为“雅威”保留其作为以色列之神专名的性质，不以头衔取代。
- issue: 是否为复数动词补明所指对象
  choice: 使用代词“它们”，不在本节擅自补入具体名词
  alternative: 补作“你的帐棚”或“以色列的营地”
  rationale: נִטָּיוּ 是复数，但本节未明说主语，其所指承接上文。译作“它们”既使现代汉语句子完整，也保留原文在本节中的含蓄关联。
translation_notes:
  register: 采用现代、庄重而易懂的诗体。四个“如同”对应原文连续的比喻结构；首行保留复数主体的承接关系，其余三行维持平行节奏。
