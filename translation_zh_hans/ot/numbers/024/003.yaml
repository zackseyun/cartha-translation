base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/003.yaml
  text: 'Then he took up his discourse and said: “The declaration of Balaam son of Beor[a], the declaration of the man whose eye is opened.”'
translation:
  language: zh_hans
  text: '他就吟诵诗歌，说：


    “这是比珥之子巴兰的宣言，


    是那眼睛闭着[a]的人的宣言。”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“眼睛睁开的人。”有些人根据先知异象的上下文和古代解释传统这样理解；但这里的希伯来语形式更直接地表示“闭着”或“合上”。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשָּׂא מְשָׁלוֹ
  choice: 他就吟诵诗歌
  rationale: 该惯用语引出正式的诗体言辞；“吟诵诗歌”既体现 מָשָׁל 在此处的诗性，又符合现代汉语表达，且不与下文 נְאֻם 的宣告意味混同。
- source_word: וַיֹּאמַר
  choice: 说
  rationale: 采用 אָמַר 的普通叙事义，并保留希伯来文引言的节奏。
- source_word: נְאֻם
  choice: ……的宣言
  rationale: 该词用于庄重、带先知性质的宣告；“宣言”简明而正式，也与本节开头的 מָשָׁל 有所区别。
- source_word: בִּלְעָם בְּנוֹ בְעֹר
  choice: 比珥之子巴兰
  rationale: 按希伯来文的亲属关系准确表达，并采用中文圣经中通行的人名译法。
- source_word: הַגֶּבֶר
  choice: 人
  rationale: 此处是庄重的自述称谓；译作“人”自然准确，不额外加入“壮士”等原文在本语境中未必强调的含义。
- source_word: שְׁתֻם הָעָיִן
  choice: 那眼睛闭着之人
  rationale: שְׁתֻם 的希伯来文本形态较直接地指向“闭着、合上”；正文保留这一较形式对应的读法，同时以脚注交代按异象语境和古代解释传统所产生的另一种理解。
theological_decisions:
- issue: 巴兰异象自述中 שְׁתֻם הָעָיִן 的含义
  choice: 眼睛闭着
  alternative: 眼睛睁开
  rationale: 此语句在词义与语境之间存在真实张力。正文优先反映马所拉文本中 שְׁתֻם 较直接的“闭着”之义，不因下文的异象语境而静默改写；脚注保留“睁开”的传统理解。
translation_notes:
  register: 采用现代、庄重且适合诗体宣告的简体中文。“吟诵诗歌”自然引出巴兰的正式诗性言辞；后两行重复“宣言”，保留原文 נְאֻם 的平行结构和庄严节奏。脚注标记置于争议短语之后，使其指向清楚。
