source:
  edition: WLC
  text: נְאֻ֗ם שֹׁמֵ֨עַ֙ אִמְרֵי אֵ֔ל וְ/יֹדֵ֖עַ דַּ֣עַת עֶלְי֑וֹן מַחֲזֵ֤ה שַׁדַּי֙ יֶֽחֱזֶ֔ה נֹפֵ֖ל וּ/גְל֥וּי עֵינָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/016.yaml
  text: 'the declaration of one who hears the words of God[a], and knows the knowledge of the Most High, who sees the vision of the Almighty, falling down[b], yet with uncovered eyes:'
translation:
  language: zh_hans
  text: 听见上帝话语之人的宣告[a]：他知道至高者的知识，看见全能者的异象；他仆倒，双眼却无遮蔽[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“听见上帝话语之人的神谕。”
    reason: lexical_alternative
  - marker: b
    text: 或译：“仆倒，双眼无遮蔽。”有人认为这描写的是看见异象时的恍惚状态。
    reason: lexical_alternative
lexical_decisions:
- source_word: נְאֻם
  choice: 宣告
  rationale: 该词引出庄严的先知性言论。“宣告”在现代汉语中清楚、庄重，也不把它过度限定为某一种神谕形式。
- source_word: שֹׁמֵעַ
  choice: 那听见……之人
  rationale: Qal 主动分词在此作名词用；这一表达保留其特征性、持续性的意味，并与上下文的自我描述相衔接。
- source_word: אִמְרֵי אֵל
  choice: 上帝言语
  rationale: 原文为表示上帝所说之话的复数构造词组。“言语”自然且庄重，也保留口头传达的意味。
- source_word: וְיֹדֵעַ דַּעַת עֶלְיוֹן
  choice: 他知晓至高者的知识
  rationale: 保留原文“知晓”与“知识”的词根呼应，也保留属格关系可能指至高者所拥有、所赐下或与他有关之知识的含混性，不擅自改成“明白至高者的心意”。
- source_word: עֶלְיוֹן
  choice: 至高者
  rationale: 作为神圣称号翻译其至高含义，采用现代中文圣经语体中清楚而庄重的表达。
- source_word: מַחֲזֵה שַׁדַּי
  choice: 全能者的异象
  rationale: מַחֲזֵה 指异象中的所见；שַׁדַּי 在此作为神圣称号译出其传统含义，而不音译。
- source_word: יֶחֱזֶה
  choice: 看见
  rationale: 该未完成式在诗歌性自我描述中与前面的分词平行；中文用“看见”简洁地表达异象性的观看。
- source_word: נֹפֵל
  choice: 仆倒
  rationale: 原词字面表示倒下或仆倒。正文保留这一具体动作，不直接解释为进入恍惚状态。
- source_word: וּגְלוּי עֵינָיִם
  choice: 眼睛却睁开
  rationale: 原文直译为“眼睛无遮蔽”。“睁开”是自然中文，同时保留人在仆倒时仍能观看异象的鲜明张力；“却”表达语境中的转折关系。
theological_decisions:
- issue: 神圣称号 אֵל、עֶלְיוֹן 与 שַׁדַּי 的处理
  choice: 上帝／至高者／全能者
  alternative: 伊勒／以利昂／沙代
  rationale: 这些词在本节作为指称上帝的称号使用。译出其意义，较能让普通现代读者把握诗句的神学分量，也避免把称号误当作必须音译的专名。
- issue: דַּעַת עֶלְיוֹן 所表达的知识关系
  choice: 至高者的知识
  alternative: 从至高者而来的知识／至高者的心意
  rationale: 原文紧凑的属格结构可有不止一种理解。正文保留“至高者的知识”，不明确断定这是他所拥有的知识、他所赐的知识，还是关于他的知识。
- issue: נֹפֵל 是否明确指异象中的恍惚状态
  choice: 仆倒
  alternative: 陷入恍惚／进入异象状态
  rationale: 希伯来文直接说“仆倒”。虽然语境可能涉及先见者的特殊状态，正文不把一种解释提升为明说的事实。
translation_notes:
  register: 采用现代、庄重而可朗读的普通话书面语。句式保留希伯来诗歌中层层并列的自我描述，并用分号帮助读者辨认结构。正文刻意保留“至高者的知识”的属格含混性，以及“仆倒”与“眼睛睁开”之间的张力。
