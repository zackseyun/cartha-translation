revisions:
- from: 这是那听见上帝言语之人的宣告[a]；他知晓至高者的知识，看见全能者的异象；他仆倒[b]，眼睛却睁开。
  to: 听见上帝话语之人的宣告[a]：他知道至高者的知识，看见全能者的异象；他仆倒，双眼却无遮蔽[b]。
  rationale: 修订仅处理无原文依据的“这是”、不够自然的词语搭配，以及“眼睛无遮蔽”的字面意象。保留“至高者的知识”的属格含混性，保留“仆倒”的具体表述，并在脚注中谨慎提示恍惚状态只是一种解释。
