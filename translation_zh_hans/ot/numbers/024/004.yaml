source:
  edition: WLC
  text: נְאֻ֕ם שֹׁמֵ֖עַ אִמְרֵי אֵ֑ל אֲשֶׁ֨ר מַחֲזֵ֤ה שַׁדַּי֙ יֶֽחֱזֶ֔ה נֹפֵ֖ל וּ/גְל֥וּי עֵינָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/004.yaml
  text: 'the declaration of one who hears the words of God[a], who sees the vision of the Almighty, falling down[b], yet with eyes uncovered:'
translation:
  language: zh_hans
  text: '那听见上帝言语之人的宣告[a]：


    他看见全能者的异象，


    倒下，双眼却睁开[b]。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “宣告”也可译作“庄严言辞”。希伯来语 נְאֻם 是引出郑重话语的正式用语，常见于先知性言论。
    reason: lexical_alternative
  - marker: b
    text: “双眼却睁开”也可按字面意象译作“双眼却被揭开”或“双眼却无遮蔽”。
    reason: lexical_alternative
lexical_decisions:
- source_word: נְאֻם
  choice: 宣告
  rationale: 这是引出庄严话语、尤其是先知性言论的正式用语。“宣告”既保留郑重语气，也比“神谕”更少带入原文未明说的联想。
- source_word: שֹׁמֵעַ אִמְרֵי אֵל
  choice: 那听见上帝言语之人
  rationale: 分词 שֹׁמֵעַ 在此名词化，描述此人的特征；“听见”保留其直接感知上帝言语的表述。אֵל 在这里按通用神称译作“上帝”。
- source_word: מַחֲזֵה שַׁדַּי יֶחֱזֶה
  choice: 他看见全能者的异象
  rationale: מַחֲזֵה 指异象性的所见；同根动词 יֶחֱזֶה 译作“看见”，以自然中文保留视觉启示的含义。שַׁדַּי 是神的称号，译作“全能者”。
- source_word: נֹפֵל
  choice: 倒下
  rationale: 保留分词的动作性，不进一步限定为俯伏、昏倒或某种特定姿势。
- source_word: וּגְלוּי עֵינָיִם
  choice: 双眼却睁开
  rationale: 该短语字面意象是眼睛被揭开或不受遮蔽，在语境中表示具有清楚的异象视觉；“双眼却睁开”是自然中文，并以“却”表达与“倒下”之间的反差。
theological_decisions:
- issue: שַׁדַּי 的译法
  choice: 全能者
  alternative: 沙代
  rationale: 此处作为神的称号使用；翻译称号比音译更便于普通读者理解，同时不额外限定其神学内涵。
- issue: 倒下与双眼睁开的关系
  choice: 以“却”表达反差，不解释倒下的原因或状态
  alternative: 译为“俯伏在地，眼睛仍然看得见”
  rationale: 原文并未明确说明这是敬拜俯伏、昏厥还是启示中的其他身体状态，也未出现“仍然看得见”这样的解释；现译保留诗句的张力和含混性。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话，并按希伯来诗句分行。冒号承接后续诗歌内容；“那……之人的宣告”保留原文公式化的先知言论结构。
