base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/022.yaml
  text: For if Kain is destined for burning, how long before Asshur carries you away captive?
translation:
  language: zh_hans
  text: 因为，若该隐[a]注定被焚毁，亚述[b]还要多久才把你掳走呢？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里的“该隐”很可能指基尼人，而不是名叫该隐的那个人。
    reason: lexical_alternative
  - marker: b
    text: “亚述”在这里可指亚述国，也可指亚述人或亚述势力。
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי אִם
  choice: 因为，即使
  rationale: 保留其与上一节的解释性联系，也保留条件或让步意味，不把句间关系单一化。
- source_word: יִהְיֶה לְבָעֵר
  choice: 注定被焚毁
  rationale: “成为/归于焚烧”的结构指向将来的结局；“注定被焚毁”在现代汉语中自然，同时保留焚烧的意象，不径直改译为泛指的“灭亡”。
- source_word: קָיִן
  choice: 该隐
  rationale: 按专名音译；此处很可能是用单数专名指基尼人群体，另以脚注说明，避免在正文中消除原文形式。
- source_word: עַד מָה
  choice: 还要多久才
  rationale: 以自然汉语表达“直到何时/要多久才”的时间疑问。
- source_word: אַשּׁוּר
  choice: 亚述
  rationale: 采用通行译名；原词可指亚述国或亚述势力，正文保留专名，脚注提示其语境范围。
- source_word: תִּשְׁבֶּךָּ
  choice: 把你掳走
  rationale: 准确表达 שבה 所含俘获并带走的意思，也保留第二人称单数（可能指集体）的形式。
