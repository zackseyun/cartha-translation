  text: וַ/יִּשָּׂ֨א בִלְעָ֜ם אֶת עֵינָ֗י/ו וַ/יַּרְא֙ אֶת יִשְׂרָאֵ֔ל שֹׁכֵ֖ן לִ/שְׁבָטָ֑י/ו וַ/תְּהִ֥י עָלָ֖י/ו ר֥וּחַ אֱלֹהִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/002.yaml
  text: Then Balaam lifted up his eyes and saw Israel dwelling according to its tribes[b][a], and the Spirit of God came upon him.
translation:
  language: zh_hans
  text: 巴兰举目，看见以色列人按着支派安营[a]；上帝的灵临到他[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“按着支派居住”，或“一个支派一个支派地安营”。
    reason: 保留 שֹׁכֵן 与 לִשְׁבָטָיו 在居住、驻营及分支派排列方面的词义幅度。
  - marker: b
    text: 或译：“上帝的灵在他身上。”
    reason: וַתְּהִי עָלָיו 可理解为动态的“临到他”，也可较静态地译为“在他身上”。
lexical_decisions:
- source_word: וַיִּשָּׂא בִלְעָם אֶת־עֵינָיו
  choice: 巴兰举目
  rationale: “举目”是现代汉语中自然且庄重的表达，保留了希伯来语“抬起眼睛”的习语意象，也避免译成单纯的“看”。
- source_word: וַיַּרְא
  choice: 看见
  rationale: 直接表达视觉感知，与前面的“举目”衔接自然。
- source_word: שֹׁכֵן
  choice: 安营
  rationale: 此处描述旷野中以色列各支派有序驻扎的状态；“安营”比泛指居住的“住着”更符合语境，同时保留分词所表达的持续状态。
- source_word: לִשְׁבָטָיו
  choice: 按着支派
  rationale: 介词 ל־在此表示依照支派划分、排列；“按着支派”简洁地表达各支派分别有序安营，而不额外限定具体阵形。
- source_word: רוּחַ אֱלֹהִים
  choice: 上帝的灵
  rationale: 该短语在随后的神谕语境中自然指上帝使人发预言的灵；译文不额外加入原文没有的冠词信息，也不引入后期教义细节。
- source_word: וַתְּהִי עָלָיו
  choice: 临到他
  rationale: “临到”能表达希伯来语“在他身上／来到他身上”的动态语感，并符合现代中文圣经叙事中描述先知受感的庄重用语。
theological_decisions:
- issue: 预言语境中 רוּחַ אֱלֹהִים 的理解
  choice: 上帝的灵
  alternative: 上帝之灵／从上帝而来的灵
  rationale: 上下文将巴兰接下来的话呈现为受神感动的神谕，因此“上帝的灵”最贴合该表达的通常含义；同时脚注保留“上帝的灵在他身上”这一较静态、贴近字面的句法可能。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“巴兰举目”保留原文意象；“以色列人”明确集体所指；分号呈现所见景象与上帝之灵临到之间紧密但有层次的关系。
