  yaml_path: translation/ot/numbers/024/025.yaml
  text: Then Balaam rose and went and returned to his place, and Balak also went on his way.
translation:
  language: zh_hans
  text: 于是，巴兰起身离去，回到自己的地方；巴勒也上路离去了。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּקָם
  choice: 起身
  rationale: קום的Qal叙事形式可表示站起或开始行动；“起身”既保留动作意象，也自然引出离去。
- source_word: בִּלְעָם
  choice: 巴兰
  rationale: 采用现代中文圣经中通行的人名译法。
- source_word: וַיֵּלֶךְ
  choice: 离去
  rationale: הלך基本义为“走、去”；在此离别语境中译作“离去”自然，同时不增添目的地信息。
- source_word: וַיָּשָׁב
  choice: 回到
  rationale: שׁוב配合目的地短语表示返回先前所在之处；“回到”准确表达这一方向。
- source_word: לִמְקֹמוֹ
  choice: 自己的地方
  rationale: מקום直译为“地方”；不译作“家”，以免把原文未明确的信息带入正文。“自己的”自然表达第三人称所属关系。
- source_word: וְגַם
  choice: 也
  rationale: 该组合把巴勒的行动作为并列补充；分号已经呈现句法并列，因此用“也”即可自然保留添加意义。
- source_word: בָּלָק
  choice: 巴勒
  rationale: 采用现代中文圣经中通行的人名译法。
- source_word: הָלַךְ
  choice: 走了
  rationale: הלך在此概述巴勒随后离开；“走了”简明自然，并与“上路”构成现代汉语习惯表达。
- source_word: לְדַרְכּוֹ
  choice: 上路
  rationale: דרך意为道路、行程；הלך לדרכו是各自离去的惯用表达，译作“上路走了”自然且保留道路意象。
