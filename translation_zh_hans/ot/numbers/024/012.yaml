base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/012.yaml
  text: Balaam said to Balak[a], “Did I not also speak to your messengers whom you sent to me[b], saying,”
translation:
  language: zh_hans
  text: 巴兰对巴勒说：“我不是也曾对你派到我这里来的使者[a]说过吗？[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “使者”也可译作“使臣”。希伯来语原词在其他语境中也可指“天使”，但这里按上下文是人间的使者。
    reason: lexical_alternative
  - marker: b
    text: 本句所引出的说话内容接续在下一节。
    reason: cross_reference
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: 叙事中常用的说话引介语；现代汉语用“说”自然、准确。
- source_word: בִּלְעָם
  choice: 巴兰
  rationale: 采用现代中文圣经人名的通行音译。
- source_word: אֶל בָּלָק
  choice: 对巴勒
  rationale: 介词 אֶל 标明说话对象；“对巴勒说”符合现代汉语表达。
- source_word: הֲלֹא
  choice: 不是……吗
  rationale: 带否定的疑问形式，预期肯定回答；汉语反问句“不是……吗”保留了原文语气。
- source_word: גַּם
  choice: 也
  rationale: 保留附加和强调意味，指出巴兰先前也曾对巴勒的使者说过同样的话。
- source_word: מַלְאָכֶיךָ
  choice: 你的使者
  rationale: מַלְאָך 可指人间使者或天使；本处外交往来的语境明确指巴勒派出的人。“使者”准确且庄重。
- source_word: אֲשֶׁר שָׁלַחְתָּ אֵלַי
  choice: 你派来见我的
  rationale: 关系从句修饰“使者”；“派来见我”自然表达其受派前来巴兰这里的意思。
- source_word: דִּבַּרְתִּי
  choice: 我……曾……说过
  rationale: 完成式回指巴兰先前已经说过的话；“曾……说过”清楚体现过去经历。
- source_word: לֵאמֹר
  choice: 这样说
  rationale: 该不定式引出下节所载话语内容；“这样说”既自然，又保留对后文引语的引介作用。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“不是……吗”保留原文预期肯定回答的反问语气；句末问号反映该语气，而脚注说明其所引话语接续至下一节。
