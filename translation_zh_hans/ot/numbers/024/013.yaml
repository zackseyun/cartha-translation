id: NUM.24.13
reference: Numbers 24:13
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: אִם יִתֶּן לִ֨/י בָלָ֜ק מְלֹ֣א בֵית/וֹ֮ כֶּ֣סֶף וְ/זָהָב֒ לֹ֣א אוּכַ֗ל לַ/עֲבֹר֙ אֶת פִּ֣י יְהוָ֔ה לַ/עֲשׂ֥וֹת טוֹבָ֛ה א֥וֹ רָעָ֖ה מִ/לִּבִּ֑/י אֲשֶׁר יְדַבֵּ֥ר יְהוָ֖ה אֹת֥/וֹ אֲדַבֵּֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/013.yaml
  text: If Balak were to give me his house full of silver and gold[a], I could not go beyond the word of Yahweh, to do good or evil from my own heart. Whatever Yahweh speaks, that I will speak.
translation:
  language: zh_hans
  text: 若巴勒把满屋的金银给我，我也不能越过雅威的话[a]，凭自己的心意行善或作恶。雅威说什么，我就说什么。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“越过雅威的口。”
    reason: 说明原文以“口”代指雅威所说的话，并保留“越过”这一越界隐喻。
lexical_decisions:
- source_word: אִם יִתֶּן
  choice: 即使……给我
  rationale: 这里的“אִם”与未完成式构成假设条件；结合上下文，这一条件带有让步意味。“即使”既自然，也准确表达无论报酬多么丰厚，巴兰都不能自行越界。
- source_word: מְלֹא בֵיתוֹ כֶּסֶף וְזָהָב
  choice: 满屋的金银
  rationale: 原文描绘巴勒整座房子装满金银的丰厚报酬。“满屋的金银”在现代汉语中简洁自然，并保留原有意象。
- source_word: לֹא אוּכַל
  choice: 我也不能
  rationale: 在假设条件中表示巴兰没有能力或权限这样做；“不能”准确保留这一限制，“也”与前面的让步条件自然衔接。
- source_word: לַעֲבֹר אֶת־פִּי יְהוָה
  choice: 越过雅威的话
  rationale: 原文直译为“越过雅威的口”，以“口”转指所说的话。“越过……的话”保留越界的空间隐喻，同时符合现代汉语表达。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代简体中文常见音译呈现四字神名，保留其作为专名的性质，而不以称号代替。
- source_word: לַעֲשׂוֹת טוֹבָה אוֹ רָעָה
  choice: 行善或作恶
  rationale: 保留原文“好／恶”的对举及其道德分量；“行善或作恶”是庄重而易懂的现代汉语。
- source_word: מִלִּבִּי
  choice: 凭自己的心意
  rationale: “从我的心”在这里表示出于巴兰自己的意愿或主张。“凭自己的心意”清楚呈现自主发起之意，并与雅威所说的话形成对照。
- source_word: אֲשֶׁר יְדַבֵּר יְהוָה אֹתוֹ אֲדַבֵּר
  choice: 雅威说什么，我就说什么
  rationale: 以汉语“什么……就什么”的对应结构自然表达原文的关系—复指结构，同时保留前后“说”的词语呼应。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。译作“雅威”可在中文中保留神名的专名性质，不以“主”这一称号代替；也不采用源于较晚混合读法的“耶和华”。
- issue: 巴兰所受限制的性质
  choice: 不能越过雅威的话，也不能凭自己心意行善或作恶
  alternative: 仅指不能改变针对以色列的祝福或咒诅
  rationale: 原文既提到不可越过雅威的话，也明说不可凭自己的心行善或作恶。译文保留这一较宽的直接陈述，不把它缩窄为仅涉及祝福和咒诅，也不延伸为对所有先知行为的系统性论断。
- issue: “善或恶”的含义
  choice: 保留“行善或作恶”的道德对举
  alternative: 做有利或不利的事
  rationale: טוֹבָה／רָעָה 可随语境指好坏、福祸或善恶。这里译作“行善或作恶”忠实保留措辞的道德张力，同时不进一步断定善恶的对象或结果。
translation_notes:
  register: 采用庄重、清晰的现代标准汉语。“即使……也……”呈现假设兼让步关系；“雅威说什么，我就说什么”口吻自然有力，并保留原文重复“说”的修辞。脚注标记置于其所解释的“雅威的话”之后。
