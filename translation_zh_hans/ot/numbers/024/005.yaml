  yaml_path: translation/ot/numbers/024/005.yaml
  text: How good are your tents[a], O Jacob, your dwellings, O Israel!
translation:
  language: zh_hans
  text: 雅各啊，你的帐篷何等美好；以色列啊，你的居所何等美好！
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַה
  choice: 何等
  rationale: 这里的 מַה 引出赞叹，并非疑问；“何等”能自然、庄重地表达希伯来诗句的惊叹语气。
- source_word: טֹּבוּ
  choice: 美好／佳美
  rationale: טוֹב 在此可指美好、悦人或优美。两处采用“美好／佳美”表达同一赞叹，既保留其宽泛含义，也符合汉语诗歌平行句的自然表达。
- source_word: אֹהָלֶיךָ
  choice: 你的帐篷
  rationale: אֹהֶל 通常指帐篷；上下文是巴兰观看以色列人的营地，并非特指圣所，因此不用带有礼仪色彩的“会幕”。
- source_word: יַעֲקֹב
  choice: 雅各
  rationale: 按通行中文译名处理；这里作为以色列民族的诗意称呼。
- source_word: מִשְׁכְּנֹתֶיךָ
  choice: 你的居所
  rationale: מִשְׁכָּן 可指居住之处。“居所”与“帐篷”构成平行，同时避免误解为专指圣幕。
- source_word: יִשְׂרָאֵל
  choice: 以色列
  rationale: 按通行中文译名处理，与“雅各”平行，诗意地称呼同一群体。
theological_decisions:
- issue: 本节是否沿用带有圣所含义的传统措辞
  choice: 译作“帐篷”和“居所”
  alternative: 译作“帐幕”和“会幕”
  rationale: 原文在此描写以色列的营地与住处，并不要求理解为敬拜圣所；采用普通居住用语可避免加入原文未明确表达的礼仪含义。
translation_notes:
  register: 采用现代、庄重而易懂的诗体汉语。“雅各啊……以色列啊……”保留原文呼语和平行结构；感叹号体现开头 מַה 的赞叹语气。第二分句用“佳美”承接原文省略而共享的谓语，使汉语表达完整自然。
