  text: וְ/יֵ֖רְדְּ מִֽ/יַּעֲקֹ֑ב וְ/הֶֽאֱבִ֥יד שָׂרִ֖יד מֵ/עִֽיר׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/019.yaml
  text: And one shall rule from Jacob[b][a], and he shall destroy the survivor from the city.
translation:
  language: zh_hans
  text: 必有一位出自雅各，施行统治[a]；他要消灭城中的幸存者[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “施行统治”或译“掌权”。希伯来语动词兼有“统治、管辖”的意思。
    reason: lexical_alternative
  - marker: b
    text: “幸存者”或译“余民”。原文为单数，也可具有集合意义。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֵרְדְּ
  choice: 必有一位……施行统治
  rationale: 该动词最可能源自 רדה，意为“统治、掌权”。希伯来文此分句没有明说主语；结合上文所描写的王者，译作“必有一位”既使中文完整，也不在正文中明确指定其身份。“下来”须诉诸另一词根，在此语境中可能性较低。
- source_word: מִיַּעֲקֹב
  choice: 出自雅各
  rationale: 介词 מן 表示来源。“出自雅各”自然表达这位统治者从雅各／以色列兴起，也与上文的王权语境衔接。
- source_word: וְהֶאֱבִיד
  choice: 他要消灭
  rationale: אבד 的使役式表示使之灭亡。“消灭”保留原文直接而强烈的力度，没有增添具体方式。
- source_word: שָׂרִיד
  choice: 幸存者
  rationale: 该单数名词指存留下来或逃过毁灭的人，也可能具有集合意义。“幸存者”保留具体的人称指向；“余民”则是可行的替代译法。
- source_word: מֵעִיר
  choice: 城中的
  rationale: 字面结构是“从城里”，在“消灭”之后表示把幸存者从城中除尽。译为“城中的”符合现代汉语表达，同时不把 עִיר 过度具体化为“堡垒”或“城邦”。
theological_decisions:
- issue: 巴兰神谕中的王者／弥赛亚指向
  choice: 采用概括性的王权语言，不在正文中明说这位统治者就是弥赛亚。
  alternative: 把他限定为某位近期历史君王，或直接译明为弥赛亚。
  rationale: 上下文表明这是一位出自雅各的统治者，但本节本身没有明确给出其身份。如此翻译既容许历史性、预表性或弥赛亚性的正典解读，也不替原文消除其神学张力。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“必有一位”补足希伯来诗句中未明说的主语；“出自雅各”表达来源而不额外确定人物身份。分号保留两个并列行动之间的紧密关系。
