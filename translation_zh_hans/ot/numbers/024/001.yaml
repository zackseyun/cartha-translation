  text: וַ/יַּ֣רְא בִּלְעָ֗ם כִּ֣י ט֞וֹב בְּ/עֵינֵ֤י יְהוָה֙ לְ/בָרֵ֣ךְ אֶת יִשְׂרָאֵ֔ל וְ/לֹא הָלַ֥ךְ כְּ/פַֽעַם בְּ/פַ֖עַם לִ/קְרַ֣את נְחָשִׁ֑ים וַ/יָּ֥שֶׁת אֶל הַ/מִּדְבָּ֖ר פָּנָֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/001.yaml
  text: When Balaam saw that it was good in the eyes of Yahweh to bless Israel[a], he did not go, as at other times, to seek omens, but set his face toward the wilderness.
translation:
  language: zh_hans
  text: 巴兰看出雅威乐意赐福给以色列，就不再像以往那样去寻求占卜的兆头[a]，却把脸转向旷野。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“去迎向兆头”或“去遇见占卜的征兆”。原文所用表达指巴兰先前寻求占卜征兆的做法。
    reason: 词义和句法可有不同译法；脚注保留לִקְרַאת נְחָשִׁים中“迎向／遇见”与“占卜征兆”之间的语义幅度。
lexical_decisions:
- source_word: וַיַּרְא
  choice: 看出
  rationale: ראה在这里不只是肉眼看见，也表示巴兰从先前发生的事认清了雅威的心意；“看出”既保留视觉用语，也符合现代汉语叙事。
- source_word: כִּי טוֹב בְּעֵינֵי יְהוָה
  choice: 雅威乐意
  rationale: 希伯来语直译为“在雅威眼中是好的”，在此表示这事蒙他喜悦、合他心意；“乐意”自然表达其含义，同时不额外说明原因。
- source_word: יְהוָה
  choice: 雅威
  rationale: 用“雅威”音译四字神名，保留经文中的专名，而不以称号代替。
- source_word: לְבָרֵךְ
  choice: 赐福给
  rationale: ברך在此指雅威赐福以色列；“赐福给”在现代汉语中明确、自然。
- source_word: וְלֹא הָלַךְ כְּפַעַם בְּפַעַם
  choice: 就不再像以往那样去
  rationale: כְּפַעַם בְּפַעַם表示一次又一次的既往做法。“像以往那样”保留惯常行为之意，“不再”则自然承接巴兰刚有的认识。
- source_word: לִקְרַאת נְחָשִׁים
  choice: 寻求占卜的兆头
  rationale: נְחָשִׁים在此指占卜所得的征兆，并非蛇；לִקְרַאת字面有“迎向、遇见”之意，语境中指巴兰为占卜而寻求兆头。
- source_word: וַיָּשֶׁת אֶל־הַמִּדְבָּר פָּנָיו
  choice: 而是面向旷野
  rationale: 原文为“把脸朝向旷野”，表示有意转定方向；“面向旷野”简洁保留动作和方向。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；音译为“雅威”可在中文中保留其专名性质，避免用“主”等称号取代。
- issue: 巴兰所寻求之נְחָשִׁים的性质
  choice: 占卜的兆头
  alternative: 占卜；征兆
  rationale: 该词在上下文中涉及巴兰此前的占卜实践。“占卜的兆头”既说明其异教占卜性质，也不把经文改写成对具体方法的断言。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“看出”“乐意”“面向旷野”均为自然普通话；脚注标记紧接其所解释的“占卜的兆头”。
