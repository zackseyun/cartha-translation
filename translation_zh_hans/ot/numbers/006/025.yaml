  text: יָאֵ֨ר יְהוָ֧ה פָּנָ֛י/ו אֵלֶ֖י/ךָ וִֽ/יחֻנֶּֽ/ךָּ׀׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/025.yaml
  text: May Yahweh make his face shine upon you and be gracious to you[a].
translation:
  language: zh_hans
  text: 愿雅威使他的脸光照你，赐恩给你[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“愿雅威使他的脸向你发光，恩待你。”
    reason: 原文 אֶל 可较直译为“向”，חנן 也可译作“恩待”；此译法更直接显出原文的方向性和施惠含义。
lexical_decisions:
- source_word: יָאֵר
  choice: 愿……使……光照
  rationale: 这是 אוֹר 的使役式祈愿形，表达祝福中的愿望，并带有“使之发光”的使役含义；中文用“愿……使……光照”兼顾语法语气和诗性意象。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常用音译呈现四字神名，保留其作为以色列之上帝专名的性质，不以称号替代。
- source_word: פָּנָיו
  choice: 他的脸
  rationale: 原文直译为“他的脸”。保留这一具体的拟人化意象，不将其直接抽象化为“同在”或“眷顾”。
- source_word: אֵלֶיךָ
  choice: 光照你
  rationale: 介词 אֶל 基本义为“向、朝着”；在“使脸发光”的希伯来语意象中，现代汉语以“光照你”表达其惠然指向，较“向你发光”更自然庄重。
- source_word: וִיחֻנֶּךָ
  choice: 赐恩给你
  rationale: חנן 表示施恩、厚待或显出恩惠。“赐恩给你”既保留恩惠的含义，也适合祝福语的庄重语体；脚注列出较动态的“恩待你”。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名。正文采用与“Yahweh”相应的现代汉语音译“雅威”，以保留专名，不用“主”等称号替换。
- issue: “使他的脸发光”的拟人化意象
  choice: 在正文中保留“他的脸光照你”
  alternative: 眷顾你
  rationale: 原文借上帝的脸发光表达临在与恩宠。正文保留其具体诗性意象，不把含义压缩为抽象解释。
- issue: חנן 的恩惠含义
  choice: 赐恩给你
  alternative: 恩待你
  rationale: 两种译法都符合原文；正文“赐恩给你”较明确地保留“恩”的神学与语义联系，脚注提供自然的动态表达。
translation_notes:
  register: 采用现代、庄重而易懂的祝福语体。“他的脸光照你”保留希伯来诗歌的具体意象；“雅威”作为专名音译。
