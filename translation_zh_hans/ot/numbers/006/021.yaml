source:
  edition: WLC
  text: זֹ֣את תּוֹרַ֣ת הַ/נָּזִיר֮ אֲשֶׁ֣ר יִדֹּר֒ קָרְבָּנ֤/וֹ לַֽ/יהוָה֙ עַל נִזְר֔/וֹ מִ/לְּ/בַ֖ד אֲשֶׁר תַּשִּׂ֣יג יָד֑/וֹ כְּ/פִ֤י נִדְר/וֹ֙ אֲשֶׁ֣ר יִדֹּ֔ר כֵּ֣ן יַעֲשֶׂ֔ה עַ֖ל תּוֹרַ֥ת נִזְרֽ/וֹ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/021.yaml
  text: This is the law of the Nazirite who vows his offering to Yahweh for his Nazirite vow[a], besides what his hand can afford. According to the vow that he vows, so he shall do, according to the law of his Nazirite vow.
translation:
  language: zh_hans
  text: “这是拿细耳人的条例：他为自己的拿细耳之愿向雅威许愿献上的供物，连同他能力所及另行献上的供物；他许什么愿，就要照着所许的去做，按照他拿细耳之愿的条例。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תּוֹרַת
  choice: 条例
  rationale: 这里指规范拿细耳人之愿的法定规条；“条例”既保留法律语体，也比笼统的“律法”更贴合具体规定。
- source_word: הַנָּזִיר
  choice: 拿细耳之人
  rationale: 采用现代中文圣经语境中通行的技术名称，保留这种特殊许愿身份，而不把它简化为一般的“奉献者”。
- source_word: קָרְבָּנוֹ
  choice: 他的供物
  rationale: קָרְבָּן泛指带到上帝面前献上的供物；“供物”自然、庄重，并不擅自限定祭物种类。
- source_word: לַיהוָה
  choice: 献给雅威
  rationale: ל表示献呈的对象；直称圣名“雅威”，保留原文的专名性质。
- source_word: עַל נִזְרוֹ
  choice: 为自己所许的拿细耳人之愿
  rationale: 本章语境中的נֵזֶר指拿细耳人的分别归属状态及其誓愿；译文明确其所指，同时保留“愿”的贯穿性。
- source_word: מִלְּבַד אֲשֶׁר תַּשִּׂיג יָדוֹ
  choice: 此外，还要献上自己能力所及的
  rationale: 这是表示个人财力或供给能力的惯用语；正文传达实际含义，脚注保留“手所能达到”的原文意象。
- source_word: כְּפִי נִדְרוֹ אֲשֶׁר יִדֹּר
  choice: 他许了什么愿，就要照所许的
  rationale: 保留原文对“许愿”的重复及按誓愿内容履行的约束力，同时使中文句式自然。
- source_word: כֵּן יַעֲשֶׂה
  choice: 就要……去做
  rationale: 表达法律语境中的义务，而不使用过分古雅的“必如此行”。
- source_word: עַל תּוֹרַת נִזְרוֹ
  choice: 并遵守拿细耳人之愿的条例
  rationale: 末句把个人所许之愿与本章既定条例联系起来；“遵守”自然表达依照条例而行的规范意义。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；采用“雅威”作为其较贴近希伯来语读音的现代汉语音译，不以称号替代专名。
- issue: נֵזֶר在本节是誓愿还是分别为圣的状态
  choice: 拿细耳人之愿
  alternative: 分别归属的状态／离俗
  rationale: 该词兼有分别归属及拿细耳人身份标志的含义；本节反复使用נדר“许愿”，故正文以“拿细耳人之愿”承接上下文，但不把它解释为某一宗派性的奉献观。
- issue: 末句עַל的关系
  choice: 并遵守……条例
  alternative: 按照……条例
  rationale: 介词可表达依据或附加关系。译文让个人额外所许的义务与拿细耳人的既定条例并列，避免暗示个人之愿可以取代条例。
translation_notes:
  register: 采用现代、庄重而易懂的法律语体。“拿细耳之人／拿细耳人之愿”保留本章技术性身份用语；句式适度拆分，以显明供物、个人能力及履行誓愿三层关系，同时不消除原文介词结构可能具有的附加与依据之张力。
