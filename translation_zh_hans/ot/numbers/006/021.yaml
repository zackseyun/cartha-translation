revisions:
- from: “这是许愿作拿细耳之人的条例：他要为自己所许的拿细耳人之愿，把供物献给雅威；此外，还要献上自己能力所及的[a]。他许了什么愿，就要照所许的去做，并遵守拿细耳人之愿的条例。”
  to: “这是拿细耳人的条例：他为自己的拿细耳之愿向雅威许愿献上的供物，连同他能力所及另行献上的供物；他许什么愿，就要照着所许的去做，按照他拿细耳之愿的条例。”
  rationale: 修订将“能力所及”保留为对额外供物的限定，避免把原文的“此外／除……以外”误译成独立且强制的献祭命令；并将末句恢复为“照所许的去做”的规范依据。为术语一致，全文统一为“拿细耳人”。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T04:51:44Z'
review_pass:
  verdict: revise
  source_fidelity: 草稿准确保留了拿细耳人、许愿、供物、雅威及按所许之愿履行的主要要素。然而，“此外，还要献上自己能力所及的”将“除了／此外，按其能力所及”明确化为另一项强制性的献上命令；原文此处更适宜表达在既定要求以外、按个人能力所能献上的额外供物。结尾“并遵守”也将“按／就……条例”改作独立命令，弱化了原文的依据关系。
  naturalness: 原译整体庄重通顺，但“把供物献给雅威；此外，还要献上自己能力所及的”容易被理解为必须另献一项未指明的祭物。改为“另行献上的供物”可使所省略的中心词明确，同时保持现代中文的简洁法律语体。
  terminology: “条例”“拿细耳人”“供物”“雅威”均可接受。为一致并避免“拿细耳之人／拿细耳人”交替，修订全文统一使用“拿细耳人”。“拿细耳之愿”保留该节中נֵזֶר与许愿语境的关联，但不将其狭义化为单纯个人誓词。
  issues:
  - severity: medium
    issue: “此外，还要献上自己能力所及的”添加了明确的强制性和新的献祭动作。
    rationale: מִלְּבַד意为“除……以外／此外”，而אֲשֶׁר תַּשִּׂיג יָדוֹ是能力、财力所及的惯用表达。此处宜作为在规定供物之外可按能力增献的限定，而非“还要”所表示的另一项必行命令。
  - severity: medium
    issue: “并遵守拿细耳人之愿的条例”把末尾介词短语处理为独立的并列命令。
    rationale: עַל תּוֹרַת נִזְרוֹ更直接地限定“照所许的去做”的规范依据，即“按照他拿细耳之愿的条例”；修订应保留这种关系。
  - severity: low
    issue: 技术称谓前后不一致。
    rationale: 同一节内“拿细耳之人”与“拿细耳人”交替并无必要；统一术语使法律条文更清晰。
  revised_text: “这是拿细耳人的条例：他为自己的拿细耳之愿向雅威许愿献上的供物，连同他能力所及另行献上的供物；他许什么愿，就要照着所许的去做，按照他拿细耳之愿的条例。”
  revised_footnotes:
  - marker: a
    text: 直译：“除了他的手所能达到的。”这里“手所能达到的”指他能力或财力所及、可另行献上的供物。
    reason: 保留希伯来语惯用语的字面意象，并说明其在此处指个人能力或财力所及的额外供物。
  revision_rationale: 修订将“能力所及”保留为对额外供物的限定，避免把原文的“此外／除……以外”误译成独立且强制的献祭命令；并将末句恢复为“照所许的去做”的规范依据。为术语一致，全文统一为“拿细耳人”。
