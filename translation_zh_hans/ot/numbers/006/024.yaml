base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/024.yaml
  text: May Yahweh bless you and keep you[a].
translation:
  language: zh_hans
  text: 愿雅威[a]赐福给你，保护你。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文作“YHWH”；传统译作“耶和华”或“主”。
    reason: 说明神名的原文形式及常见传统译法。
lexical_decisions:
- source_word: יְבָרֶכְךָ
  choice: 愿……赐福给你
  rationale: 该词是 ברך 的皮勒式未完成时第三人称阳性单数，带第二人称阳性单数后缀；在祭司祝福的语境中具有祈愿语气。“愿……赐福给你”自然传达这种祝愿，而不译成命令或单纯将来时。
- source_word: יְהוָה
  choice: 雅威
  rationale: 这是上帝的四字神名 YHWH。音译为“雅威”，以保留经文所用的专名，而不以称号替代。
- source_word: וְיִשְׁמְרֶךָ
  choice: 保护你
  rationale: 该词是 שמר 的卡勒式未完成时第三人称阳性单数，带第二人称阳性单数后缀，并在此承接祈愿语气。“保护你”清楚自然地表达看守、护卫和保全之意。
theological_decisions:
- issue: 如何翻译神名 יְהוָה
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名 YHWH。“雅威”按其较通行的学术拟音保留专名；脚注同时说明传统译法，避免把原文的专名默默改成称号。
- issue: 两个未完成时动词在祝福中的语气
  choice: 以“愿”统摄“赐福”和“保护”
  alternative: “雅威必赐福给你，必保护你”
  rationale: 上下文是祭司宣告的祝福，两个动词具有祈愿意味。译作“愿……”保留祝愿的语气，同时不把它收窄为单纯的未来预告。
translation_notes:
  register: 采用简洁、庄重而现代的普通话。“你”保留原文第二人称阳性单数；“愿”同时支配两个并列动词，以维持希伯来诗句紧凑的节奏。
