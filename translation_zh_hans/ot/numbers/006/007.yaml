base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/007.yaml
  text: He shall not make himself unclean for them at their death[a], not even for his father or his mother, for his brother or his sister[b], because the consecration of his God is on his head.
translation:
  language: zh_hans
  text: 即使父亲、母亲、兄弟或姐妹去世，他也不可因他们而使自己成为礼仪上不洁[a]，因为他头上有归自己的上帝为圣的圣别记号[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们去世时，他不可因他们成为礼仪上不洁。”
    reason: lexical_alternative
  - marker: b
    text: 希伯来语为 nezer；在拿细耳人的语境中，指分别出来归上帝为圣的状态或记号，以他头上的头发为可见象征。
    reason: cultural_note
lexical_decisions:
- source_word: לְאָבִיו ... וּלְאִמּוֹ ... לְאָחִיו ... וּלְאַחֹתוֹ
  choice: 即使父亲、母亲、兄弟或姐妹
  rationale: 原文把亲属成分前置以示强调；汉语用“即使”保留这种强调，并逐项保留父亲、母亲、兄弟、姐妹。
- source_word: לֹא יִטַּמָּא
  choice: 不可使自己不洁
  rationale: 动词在此具有反身意义，指拿细耳人不可因接触死者而使自己陷入礼仪上的不洁；避免使用容易让人理解为道德败坏的措辞。
- source_word: לָהֶם בְּמֹתָם
  choice: 他们去世……因他们
  rationale: בְּמֹתָם 表示死亡发生之际，לָהֶם 回指上述亲属；此译法在现代汉语中自然，也保留了因亲属死亡而沾染礼仪不洁的关系。
- source_word: כִּי
  choice: 因为
  rationale: 明确表达该词在此引出的原因。
- source_word: נֵזֶר
  choice: 归……为圣的标记
  rationale: 在拿细耳人的语境中，该词兼有分别、奉献及其外在标志的含义，并由头发具体体现；“标记”与“在头上”的意象相合，脚注补充其语义范围。
- source_word: אֱלֹהָיו
  choice: 他的上帝
  rationale: 保留希伯来文明确的第三人称单数所属后缀。
- source_word: עַל רֹאשׁוֹ
  choice: 在他头上
  rationale: 保留原文具体的身体意象，并暗示拿细耳人头发是其分别归圣的可见标志。
theological_decisions:
- issue: 拿细耳条例中“不洁”的性质
  choice: 采用礼仪意义的“使自己不洁”
  alternative: 采用可能带有道德谴责意味的“玷污自己”
  rationale: 上下文论及因死亡和尸体接触而产生的礼仪不洁，并未在此断言个人道德上的败坏。
- issue: נֵזֶר 在本节中的含义
  choice: 译作“归他的上帝为圣的标记”，兼顾奉献状态与头上的可见标志
  alternative: 译作“冠冕”或仅译作抽象的“奉献”
  rationale: “冠冕”可能使读者误以为另有实物冠饰；只译“奉献”又会削弱“在头上”及拿细耳人头发这一具体意象。脚注保留该词可指分别归圣之状态或记号的张力。
translation_notes:
  register: 采用现代、庄重而通顺的普通话。“去世”适合亲属死亡的语境；“使自己不洁”明确反身及礼仪含义。脚注标记均放在其所说明的正文词语之后。
