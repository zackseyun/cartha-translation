base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/001.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: zh_hans
  text: 耶和华[a]对摩西说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文为YHWH（四字神名）；中文传统多译作“耶和华”，也有译作“雅威”的。
    reason: 说明神名的原文形式及常见替代音译。
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: 说
  rationale: 该叙事性动词形式承接上下文，引出上帝正式宣告的内容。现代汉语用“说”自然简洁；其承接作用可由上下文体现，无须机械增译“然后”或“又”。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 这是四字神名YHWH。采用现代中文圣经传统中最通行的专名译法“耶和华”，而不以“主”这一称号代替；脚注注明原文形式及另一常见音译。
- source_word: אֶל מֹשֶׁה
  choice: 对摩西
  rationale: 介词אֶל在言说结构中标明说话对象，现代汉语自然表达为“对摩西”。מֹשֶׁה按通行中文人名译作“摩西”。
- source_word: לֵאמֹר
  choice: 说：
  rationale: 该不定式用于引出随后讲话的具体内容。汉语以“说”加冒号自然表达这一话语引介功能，避免生硬重复为“说，曰”。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威；上主
  rationale: 原文直接使用以色列上帝的专名YHWH。正文保留专名而不改用称号；“耶和华”是普通中文读者最熟悉的专名形式，同时在脚注中交代“雅威”这一较贴近现代学术拟音的译法。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。“耶和华[a]对摩西说：”符合汉语叙事和直接引语的常用引介方式；冒号表明下文是讲话内容。
