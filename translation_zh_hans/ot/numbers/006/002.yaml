  yaml_path: translation/ot/numbers/006/002.yaml
  text: 'Speak to the sons of Israel and say to them: When a man or a woman makes a special vow[a], the vow of a Nazirite, to dedicate himself to Yahweh[b],'
translation:
  language: zh_hans
  text: 你要对以色列人说：“男人或女人若特意许拿细耳人的愿[a]，把自己分别出来归给雅威[b]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“男人或女人若许愿，使自己成为拿细耳人。”
    reason: lexical_alternative
  - marker: b
    text: “拿细耳人”指借着这种愿而特别分别出来、归给雅威的人。
    reason: cultural_note
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 现代汉语中自然、准确的群体称呼；无需机械保留希伯来语“以色列的众子”的亲属习语。
- source_word: אִישׁ אוֹ אִשָּׁה
  choice: 无论男人或女人
  rationale: 明确保留原文对男女双方的列举及律例的包容范围。
- source_word: כִּי
  choice: 若
  rationale: 这里引入律例中的条件情形；“若”简洁地保留其条件意味。
- source_word: יַפְלִא לִנְדֹּר נֶדֶר
  choice: 许一个特别的愿
  rationale: יַפְלִא 表达非同寻常、特意而为的含义，与后面的同源宾语结构合译，形成自然汉语。
- source_word: נֶדֶר נָזִיר
  choice: 拿细耳人的愿
  rationale: 保留该专门制度的传统音译，并清楚表达这是与拿细耳人身份相关的愿。
- source_word: לְהַזִּיר
  choice: 分别自己归给
  rationale: 同时传达该词“使自己分别出来”及“奉献归属”的含义，与拿细耳制度相符。
- source_word: לַיהוָה
  choice: 归给雅威
  rationale: 以“雅威”音译四字神名，保留原文所用的盟约名字。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；“雅威”较贴近通常重建的读音，也避免以称号取代专名。
- issue: 拿细耳之愿所表达的行动
  choice: 分别自己归给雅威
  alternative: 献身给雅威；使自己成为拿细耳人归给雅威
  rationale: 保留 נזר 的“分别”与奉献含义，不把它仅缩减为一般性的献身，也不额外规定其神学机制。
- issue: 律例中的性别范围
  choice: 无论男人或女人
  alternative: 任何人
  rationale: 原文明确列出男人和女人，译文照样保留，而不以概括语消除这一强调。
translation_notes:
  register: 采用现代、庄重而易懂的律例语言。“拿细耳人”保留通行的圣经专名；“分别自己归给”兼顾原文的词根联系与自然汉语。经文在下一节继续，故此处保留未完句式。
