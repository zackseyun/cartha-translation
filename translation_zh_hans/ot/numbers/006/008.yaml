base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/008.yaml
  text: All the days of his separation he is holy to Yahweh[a].
translation:
  language: zh_hans
  text: 在他作为拿细耳人、分别出来的所有日子，他归雅威为圣[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“在他许拿细耳愿的所有日子”或“在他的奉献期内”。这里的希伯来语指他作为拿细耳人而分别出来的状态。
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּל יְמֵי
  choice: 整个期间
  rationale: 这一组合涵盖作拿细耳人的全部日子；现代汉语用“整个期间”既自然，又保留其完整、持续的时间范围。
- source_word: נִזְרוֹ
  choice: 他作拿细耳人、分别出来
  rationale: 此词在本段指作拿细耳人而处于分别出来的状态，不仅是许愿这一动作。“作拿细耳人、分别出来”明确其语境，同时保留“分别”的核心含义。
- source_word: קָדֹשׁ הוּא
  choice: 他是……为圣的
  rationale: 保留希伯来文独立代词所带出的主语强调，以及“圣”在经文中的神学分量。
- source_word: לַיהוָה
  choice: 归雅威
  rationale: 介词 ל 在此表达归属和献身关系；“归”比单纯的“向”更符合自然汉语。“雅威”直接呈现神的专名 יהוה。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。采用“雅威”以专名形式呈现，避免用称号“主”取代神名。
- issue: נִזְרוֹ 在拿细耳人条例中的含义
  choice: 他作拿细耳人、分别出来
  alternative: 他所许的拿细耳愿；他的奉献
  rationale: 上下文着重的是他在整个期限内所处的分别状态，而不只是许愿行为；同时不把该词译成“为圣”，以免与后面的 קָדֹשׁ 混同。
- issue: “圣”与雅威的关系
  choice: 归雅威为圣
  alternative: 对雅威来说是圣的；献给雅威
  rationale: 此译法保留 ל 所表达的归属或献身关系，也保留“圣”的神学用语，不将其缩减为单纯的奉献行为。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“拿细耳人”保留通行的圣经专名；用“整个期间”代替较生硬的“所有日子”。主句保留“归……为圣”，以呈现原文的归属关系和神学张力。
