  text: Speak to Aaron and to his sons[a], saying, ‘Thus you shall bless the sons of Israel. Say to them,’
translation:
  language: zh_hans
  text: 你要对亚伦和他的儿子们说：“你们要这样为以色列人祝福，对他们说：
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דַּבֵּר אֶל
  choice: 对……说
  rationale: דַּבֵּר是皮耶勒命令式，直接吩咐摩西发言；现代汉语用“对……说”自然、准确。
- source_word: אַהֲרֹן
  choice: 亚伦
  rationale: 采用现代中文圣经中通行的人名译法。
- source_word: וְאֶל בָּנָיו
  choice: 和他的儿子们
  rationale: 这里指亚伦担任祭司的男性后代，“儿子们”既保留原文性别信息，也符合上下文。
- source_word: לֵאמֹר
  choice: 说
  rationale: 这是引出话语内容的引用公式；汉语将其融入“你要……说”可避免生硬重复，同时保留引语功能。
- source_word: כֹּה
  choice: 这样
  rationale: 表示下文给出规定的祝福方式或用语；“这样”兼具指示性和自然度。
- source_word: תְבָרֲכוּ
  choice: 你们要……祝福
  rationale: 皮耶勒未完成式复数在此具有指令意义；“要”准确传达规定和命令语气，而不误作单纯将来。
- source_word: אֶת בְּנֵי יִשְׂרָאֵל
  choice: 为以色列人祝福
  rationale: בְּנֵי יִשְׂרָאֵל字面为“以色列的众子”，但在此是全体民族的惯用称谓；译作“以色列人”在现代汉语中准确自然。动词ברך的受词按汉语习惯表达为“为……祝福”。
- source_word: אָמֹר לָהֶם
  choice: 对他们说
  rationale: 原文用独立命令式引出下一节祝福的确切措辞；直译为“对他们说”保留重复命令及其引语功能。
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל的群体指称
  choice: 以色列人
  alternative: 以色列的众子
  rationale: 该短语虽有男性复数的字面形式，却是以色列民族的固定称谓，并非只限定男性；“以色列人”既不缩小祝福对象，也符合现代标准汉语。
- issue: 祭司祝福的规定语气
  choice: 你们要这样为……祝福
  alternative: 你们将这样为……祝福
  rationale: 上下文是上帝对祭司的指示，不是单纯预告未来；“要”保留命令和礼仪规定的权威语气。
- issue: כֹּה所指的范围
  choice: 保留为“这样”
  alternative: 你们要用以下的话
  rationale: 原文可同时指祝福的方式和随后的固定措辞；“这样”保留这一开放性，不把它过度限定为仅指逐字公式。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留“你们要这样……对他们说”的指令结构，以衔接下一节的亚伦祝福；避免文言色彩较重的“如此”“晓谕”。
