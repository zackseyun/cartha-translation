  text: וּ/בַ/יּ֣וֹם הַ/שְּׁמִינִ֗י יָבִא֙ שְׁתֵּ֣י תֹרִ֔ים א֥וֹ שְׁנֵ֖י בְּנֵ֣י יוֹנָ֑ה אֶל הַ/כֹּהֵ֔ן אֶל פֶּ֖תַח אֹ֥הֶל מוֹעֵֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/010.yaml
  text: And on the eighth day he shall bring two turtledoves or two young pigeons to the priest[a], to the entrance of the tent of meeting.
translation:
  language: zh_hans
  text: 第八天，他要把两只斑鸠或两只雏鸽带到会幕门口，交给祭司。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבַיּוֹם הַשְּׁמִינִי
  choice: 第八天
  rationale: 介词 ב 与“日”构成时间表达；上下文的先后关系在汉语中无须硬译连接词 ו，简洁译为“第八天”自然且准确。
- source_word: יָבִא
  choice: 要把……带到
  rationale: בוא 的使役未完成式在律法语境中具有指令意味；“要”保留规定性，“带到”也与后面的地点短语自然衔接。
- source_word: שְׁתֵּי תֹרִים
  choice: 两只斑鸠
  rationale: תֹרִים 指斑鸠，是现代汉语圣经祭牲语境中准确而通行的鸟类名称。
- source_word: אוֹ
  choice: 或
  rationale: 保留原文所给的两种可选祭物。
- source_word: שְׁנֵי בְּנֵי יוֹנָה
  choice: 两只雏鸽
  rationale: 原文字面为“鸽子的两个儿子”，是指幼鸽的惯用表达；“雏鸽”简明、自然，并保留其幼小之意。
- source_word: אֶל הַכֹּהֵן
  choice: 交给祭司
  rationale: 结合“带到会幕门口”的地点成分，“交给祭司”清楚表达献物所归向的对象，避免汉语中连续使用两个“到”所造成的生硬歧义。
- source_word: אֶל פֶּתַח אֹהֶל מוֹעֵד
  choice: 到会幕门口
  rationale: פֶּתַח 是入口、门口；אֹהֶל מוֹעֵד 采用现代汉语中通行且简洁的专名“会幕”，表达作为相会之帐幕的固定称呼。
