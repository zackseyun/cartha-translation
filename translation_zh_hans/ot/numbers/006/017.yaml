  text: וְ/אֶת הָ/אַ֜יִל יַעֲשֶׂ֨ה זֶ֤בַח שְׁלָמִים֙ לַֽ/יהוָ֔ה עַ֖ל סַ֣ל הַ/מַּצּ֑וֹת וְ/עָשָׂה֙ הַ/כֹּהֵ֔ן אֶת מִנְחָת֖/וֹ וְ/אֶת נִסְכּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/017.yaml
  text: And he shall offer the ram as a sacrifice of peace offerings to Yahweh, along with the basket of unleavened bread; and the priest shall offer its grain offering and its drink offering.
translation:
  language: zh_hans
  text: 他要把那只公绵羊连同那篮无酵饼，献给雅威作平安祭[a]；祭司要献上随这祭牲而献的素祭和奠祭。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “平安祭”也可译作“团契祭”。希伯来语 שְׁלָמִים 可作这两种译法。
    reason: 词义有可保留的翻译选择；正文采用传统且较宽泛的“平安祭”。
lexical_decisions:
- source_word: הָאַיִל
  choice: 那只公绵羊
  rationale: אַיִל在献祭语境中特指成年公羊；“公绵羊”准确而通俗，定冠词结合上下文译为“那只”。
- source_word: יַעֲשֶׂה זֶבַח
  choice: 献……作……祭
  rationale: עשה本义宽泛，但与זֶבַח连用时指执行献祭；汉语用“献……作……祭”自然地表达这一礼仪动作。
- source_word: זֶבַח שְׁלָמִים
  choice: 平安祭
  rationale: 这是祭祀类别的固定名称；汉语“平安祭”简明保留传统词义，不把其含义缩窄为单纯的团契或相交。
- source_word: לַיהוָה
  choice: 献给雅威
  rationale: ל表示献祭的归属或方向；按所给神学决策，将四字神名直接音译为“雅威”。
- source_word: עַל סַל הַמַּצּוֹת
  choice: 连同一篮无酵饼
  rationale: עַל在此表示祭物相伴，而非单纯空间位置；“连同”清楚表达公羊与整篮无酵饼一并献上。
- source_word: מִנְחָתוֹ
  choice: 与这祭牲同献的素祭
  rationale: מִנְחָה在祭司法例中是“素祭”；第三人称后缀所指在汉语中若直译为“它的”较生硬，译作“与这祭牲同献的”既明确其附属关系，也避免误指献祭者。
- source_word: נִסְכּוֹ
  choice: 与这祭牲同献的……奠祭
  rationale: נֶסֶךְ指伴随祭牲献上的酒类浇奠祭；“奠祭”是准确、凝练的现代圣经礼仪用语，并与前面的关联修饰语共同表达后缀。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文明确使用四字神名；“雅威”较贴近学界通行的古希伯来语拟音，并依照项目给定决策保留其专名性质。
- issue: שְׁלָמִים的译法
  choice: 平安祭
  alternative: 团契祭
  rationale: “平安祭”保留该祭类名称的传统广度，不将其神学功能限定为团契；脚注说明另一种可行理解。
- issue: מִנְחָתוֹ和נִסְכּוֹ中后缀的所指
  choice: 与这祭牲同献的
  alternative: 他的素祭和奠祭
  rationale: 阳性单数后缀在形式上可译作“他的／它的”，但上下文最自然地指与公羊献祭配套的素祭和奠祭；汉语采用关系性表述，避免误解为献祭者个人所有，同时不增添额外祭礼内容。
translation_notes:
  register: 采用现代、庄重而通俗的祭司法例文体。用分号保留原文两项连续礼仪动作；避免逐字译成生硬的“做一项祭”，也不把希伯来语代词后缀误解为献祭者个人所有。
