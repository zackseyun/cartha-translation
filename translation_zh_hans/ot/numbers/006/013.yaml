  text: וְ/זֹ֥את תּוֹרַ֖ת הַ/נָּזִ֑יר בְּ/י֗וֹם מְלֹאת֙ יְמֵ֣י נִזְר֔/וֹ יָבִ֣יא אֹת֔/וֹ אֶל פֶּ֖תַח אֹ֥הֶל מוֹעֵֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/013.yaml
  text: 'And this is the law of the Nazirite: on the day the days of his separation are completed[b][a], he shall be brought to the entrance of the tent of meeting.'
translation:
  language: zh_hans
  text: 拿细耳人的条例如下：在他离俗的日子期满那一天[a]，要把他带到会幕门口[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “离俗的日子”也可译作“作拿细耳人的日子”或“分别为圣的时期”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译为“他要把他带到”；动词是主动式，并包含第三人称单数主语，但本节没有明确说明该主语指谁。
    reason: source_ambiguity
lexical_decisions:
- source_word: וְזֹאת תּוֹרַת
  choice: ……的条例如下
  rationale: 这是祭司礼仪法规的引介语。“条例”准确传达 תּוֹרָה 在此处的具体规范含义；“如下”使现代汉语自然、庄重，并承接后文。
- source_word: הַנָּזִיר
  choice: 拿细耳人
  rationale: 保留民数记第6章这一特定制度的传统专名，避免用一般性的“奉献者”抹去其专门含义。
- source_word: בְּיוֹם מְלֹאת יְמֵי נִזְרוֹ
  choice: 他离俗的日子满了那一天
  rationale: 保留 בְּיוֹם 的正式时间表达以及“日子满了”的完成意象；“离俗”反映 נזר 所含分别出来的核心意义。
- source_word: יָבִיא אֹתוֹ
  choice: 要把他带到
  rationale: 希伯来文动词为主动式，字面是“他要把他带到”，但本节没有明确交代施事者。汉语无主语的“要把他带到”既自然，又不擅自认定是谁带他去。
- source_word: אֶל פֶּתַח אֹהֶל מוֹעֵד
  choice: 到会幕门口
  rationale: “会幕”是 אֹהֶל מוֹעֵד 的标准称呼；“门口”自然表达 פֶּתַח 所指的入口处。
theological_decisions:
- issue: נָזִיר／נֵזֶר 术语所表达的身份与状态
  choice: 身份译作“拿细耳人”，其期限译作“离俗的日子”
  alternative: 译作“奉献者／分别为圣的时期”，或统一译作“拿细耳愿”
  rationale: 专名保留以色列特有的制度，“离俗”则保留分别出来、归给上帝的词义关联，同时不把“许愿”这一解释直接加入本节措辞。
- issue: יָבִיא אֹתוֹ 的施事者
  choice: 采用不明说主语的汉语把字句“要把他带到”
  alternative: 直译为“他要把他带到”，或解释为“有人要把他带到／他要被带到”
  rationale: 原文形态是主动式，但主语所指不明确。正文不补出特定施事者，可保留原文的语法张力；脚注说明其形式。
translation_notes:
  register: 采用现代、庄重而易懂的法规体。“条例如下”比逐字译成“这是……的律法”更符合自然汉语；正文保留“日子满了”的希伯来表达，并以无主语把字句保存原文施事者不明的现象。
