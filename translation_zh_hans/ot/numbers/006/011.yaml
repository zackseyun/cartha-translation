    rationale: עַל并不等同于“因”，且נֶפֶשׁ在此处须由语境判定为死人；应以释义方式说明，而不提供误导性的直译。
  revised_text: 祭司要献一只作赎罪祭[a]，一只作燔祭，为他赎罪，因为他因接触死人而犯了罪[b]；他要在那一天使他的头分别为圣。
