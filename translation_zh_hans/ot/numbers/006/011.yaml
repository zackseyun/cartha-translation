source:
  edition: WLC
  text: וְ/עָשָׂ֣ה הַ/כֹּהֵ֗ן אֶחָ֤ד לְ/חַטָּאת֙ וְ/אֶחָ֣ד לְ/עֹלָ֔ה וְ/כִפֶּ֣ר עָלָ֔י/ו מֵ/אֲשֶׁ֥ר חָטָ֖א עַל הַ/נָּ֑פֶשׁ וְ/קִדַּ֥שׁ אֶת רֹאשׁ֖/וֹ בַּ/יּ֥וֹם הַ/הֽוּא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/011.yaml
  text: And the priest shall offer one as a sin offering and one as a burnt offering[a], and he shall make atonement for him because he sinned in regard to the dead person[b], and he shall consecrate his head that same day.
translation:
  language: zh_hans
  text: 祭司要献一只作赎罪祭[a]，一只作燔祭，为他赎罪，因为他因接触死人而犯了罪[b]；他要在那一天使他的头分别为圣。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “赎罪祭”也可译作“洁净祭”。希伯来语חַטָּאת在这里是祭物的名称，也与除去礼仪上的不洁有关。
    reason: lexical_alternative
  - marker: b
    text: 原文的短语含有“那人（生命）”一词；按上下文，这里指死人，即使拿细耳人沾染不洁的死者或尸体。
    reason: cultural_note
lexical_decisions:
- source_word: וְעָשָׂה הַכֹּהֵן
  choice: 祭司要献
  rationale: עָשָׂה本义为“做、办理”，在献祭语境中指献上规定的祭物；译作“献”符合现代汉语礼仪用语。
- source_word: אֶחָד לְחַטָּאת
  choice: 一只作赎罪祭
  rationale: חַטָּאת在祭司法例中是祭物类别，传统且通行的汉语名称为“赎罪祭”；本节涉及礼仪不洁，也可理解为洁净祭，故以脚注保留另一译法。
- source_word: וְאֶחָד לְעֹלָה
  choice: 一只作燔祭
  rationale: עֹלָה指整只焚献的祭物；“燔祭”是准确而通行的汉语祭祀术语。
- source_word: וְכִפֶּר עָלָיו
  choice: 为他赎罪
  rationale: כפר在祭司献祭语境中表示施行赎罪；此译保留礼仪与神学分量，而不限定其具体机制。
- source_word: מֵאֲשֶׁר חָטָא עַל הַנָּפֶשׁ
  choice: 因为他因死人而犯了罪
  rationale: מֵאֲשֶׁר在此说明赎罪的缘由；נֶפֶשׁ结合上下文指死人，即造成玷污的尸体。两个“因”略有重复，却清楚保留“因为……犯了罪”及עַל所表达的缘由关系。
- source_word: וְקִדַּשׁ אֶת רֹאשׁוֹ
  choice: 重新使自己的头分别为圣
  rationale: קִדַּשׁ字面为“使……为圣”。上下文表明此前的离俗期已失效，现须重新开始，故加入“重新”以明示语境中的恢复；“头”也保留原文以指向拿细耳人的头发及其离俗身份。
- source_word: בַּיּוֹם הַהוּא
  choice: 在那一天
  rationale: 按原文直译，保持时间指示，不额外强化为“就在当天”。
theological_decisions:
- issue: חַטָּאת在礼仪不洁语境中的含义
  choice: 赎罪祭
  alternative: 洁净祭
  rationale: 该词既是传统所称的“赎罪祭”，在祭司礼仪中也常具有除去不洁的功用。正文采用读者较熟悉的祭名，脚注保留“洁净祭”以呈现词义张力。
- issue: הַנָּפֶשׁ的所指
  choice: 死人
  alternative: 尸体
  rationale: 该词通常表示生命或人，但民数记6章的上下文明确涉及人突然死亡所造成的玷污。“死人”既表达实际所指，也比“尸体”更保留人的意味。
- issue: 拿细耳人所犯之罪与非故意玷污的关系
  choice: 因为他因死人而犯了罪
  alternative: 为他因死人所受的玷污赎罪
  rationale: 原文明确使用חָטָא“犯罪”，即使第9节的死亡事件是突然发生的，也不应把这里的“罪”悄然改写成仅仅“受了玷污”；正文保留这种神学张力。
- issue: קִדַּשׁ是否包含再次奉献之意
  choice: 重新使自己的头分别为圣
  alternative: 使自己的头分别为圣
  rationale: 动词本身只说“使……为圣”，但第9至12节明确描述原离俗期失效后重新开始。正文用“重新”传达语境，仍保留“头”这一原文意象。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。祭名沿用通行的“赎罪祭、燔祭”；“分别为圣”兼顾קִדַּשׁ的礼仪含义与普通读者的可理解性。正文保留原文将意外接触死亡称为“犯了罪”的张力，并以脚注解释נֶפֶשׁ在本语境中的特殊所指。
