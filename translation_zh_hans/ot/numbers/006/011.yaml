  to: 祭司要献一只作赎罪祭[a]，一只作燔祭，为他赎罪，因为他因接触死人而犯了罪[b]；他要在那一天使他的头分别为圣。
  rationale: 修订删除未经原文动词明说的“重新”，将与死人的关系译得更自然明确，并校正脚注b对希伯来语短语的说明；其余祭仪术语和句法结构予以保留。
