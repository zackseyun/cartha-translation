    issue: 正文将קִדַּשׁ译为“重新使自己的头分别为圣”。
    rationale: “重新”是从第9—12节的程序语境推得，非本节动词本身所明说；为保留原文措辞，应译“使他的头分别为圣”。
  - severity: medium
    issue: “因为他因死人而犯了罪”表达重复且关系不够明确。
    rationale: 原文在本段死亡玷污的语境中指与死者的接触；改作“因为他因接触死人而犯了罪”既自然，也准确表达上下文限定的含义。
  - severity: low
