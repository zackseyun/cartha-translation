  text: וְ/הִזִּ֤יר לַֽ/יהוָה֙ אֶת יְמֵ֣י נִזְר֔/וֹ וְ/הֵבִ֛יא כֶּ֥בֶשׂ בֶּן שְׁנָת֖/וֹ לְ/אָשָׁ֑ם וְ/הַ/יָּמִ֤ים הָ/רִאשֹׁנִים֙ יִפְּל֔וּ כִּ֥י טָמֵ֖א נִזְרֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/012.yaml
  text: He shall rededicate to Yahweh the days of his Nazirite vow[a], and he shall bring a male lamb a year old as a guilt offering. But the former days shall be void[b], because his Nazirite vow was defiled.
translation:
  language: zh_hans
  text: 他要把作拿细耳人的日子重新献给耶和华[a]，并献上一只一岁的公羔羊作赎愆祭。先前的日子不再计算[b]，因为他的分别为圣已经受了玷污。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “作拿细耳人的日子”也可译作“分别为圣的日子”或“奉献的日子”。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“先前的日子要落下”，意思是此前的日子不再计入拿细耳人的期限。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִזִּיר לַיהוָה אֶת יְמֵי נִזְרוֹ
  choice: 他要把作拿细耳人的日子重新献给耶和华
  rationale: הִזִּיר在本段表示因玷污中断后重新开始分别奉献的时期；“重新献给”自然表达重启之意，同时保留献给耶和华的方向。
- source_word: יְמֵי נִזְרוֹ
  choice: 作拿细耳人的日子
  rationale: 这里指拿细耳人分别奉献的法定期限。正文采用现代、易懂的制度性表达，脚注保留“分别为圣/奉献期”的词义层面。
- source_word: לַיהוָה
  choice: 给耶和华
  rationale: 直接以“耶和华”呈现神名יהוה，符合现代中文圣经读者熟悉的用法。
- source_word: כֶּבֶשׂ בֶּן שְׁנָתוֹ
  choice: 一只一岁、公的羊羔
  rationale: 保留祭牲的年龄与性别规格；希伯来语כֶּבֶשׂ在此指公羊羔。
- source_word: לְאָשָׁם
  choice: 作赎愆祭
  rationale: אָשָׁם是祭祀类别的专门用语；“赎愆祭”准确且为中文圣经传统所熟悉。
- source_word: וְהַיָּמִים הָרִאשֹׁנִים יִפְּלוּ
  choice: 先前的日子不再计算
  rationale: 字面为“先前的日子要落下”；语境中的法律效果是此前已守的日子不计入重新开始的期限。脚注保留原文意象。
- source_word: כִּי טָמֵא נִזְרוֹ
  choice: 因为他作拿细耳人的奉献已经受了玷污
  rationale: טָמֵא在这里涉及礼仪上的污秽；“受了玷污”保留被污染的结果，而“奉献”传达נֵזֶר在此的分别归属含义。
theological_decisions:
- issue: נזר在拿细耳人条例中的表达
  choice: 作拿细耳人的日子／作拿细耳人的奉献
  alternative: 分别为圣的日子／拿细耳人的愿
  rationale: 该词既含分别奉献之义，又在民数记6章指特定的拿细耳人制度。译文按上下文分别采用“作拿细耳人的日子”和“奉献”，避免把“愿”强加到每一处，同时保留制度与奉献两层含义。
- issue: 神名יהוה的译法
  choice: 耶和华
  alternative: 雅威／上主
  rationale: “耶和华”是现代简体中文圣经语境中最为人熟悉的专名形式，并明确区别于一般称号“主”。
- issue: יִפְּלוּ的法律效果
  choice: 不再计算
  alternative: 归于无效／落下
  rationale: 在本条例中，意思是受玷污前的日子不能计入拿细耳期；正文说明实际效果，脚注则保留字面表达，避免掩盖原文措辞。
translation_notes:
  register: 采用庄重而通顺的现代标准普通话。“拿细耳人”和“赎愆祭”作为本章的制度性、祭祀性术语予以保留；句法适度现代化，并用脚注呈现希伯来语的字面意象和可选译法。
