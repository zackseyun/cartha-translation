  text: וְ/לָקַ֨ח הַ/כֹּהֵ֜ן אֶת הַ/זְּרֹ֣עַ בְּשֵׁלָה֮ מִן הָ/אַיִל֒ וְֽ/חַלַּ֨ת מַצָּ֤ה אַחַת֙ מִן הַ/סַּ֔ל וּ/רְקִ֥יק מַצָּ֖ה אֶחָ֑ד וְ/נָתַן֙ עַל כַּפֵּ֣י הַ/נָּזִ֔יר אַחַ֖ר הִֽתְגַּלְּח֥/וֹ אֶת נִזְרֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/019.yaml
  text: Then the priest shall take the boiled shoulder from the ram[a], one unleavened loaf from the basket, and one unleavened wafer, and put them on the palms of the Nazirite after he has shaved his consecrated head.
translation:
  language: zh_hans
  text: 祭司要从公绵羊身上取煮熟的前腿，并从筐子里取一个无酵饼和一片无酵薄饼；拿细耳人剃去他离俗的头发[a]以后，祭司要把这些放在拿细耳人的双掌上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“剃他的离俗”。这里指他作为离俗标志的头发。
    reason: 说明נִזְרוֹ的字面表达及其在剃发礼仪语境中的具体所指，避免将抽象名词机械直译入正文。
lexical_decisions:
- source_word: וְלָקַח
  choice: 要……取下
  rationale: 在礼仪规程中，连接词加完成式表示接续的规定动作；用“要”表达规范语气，并按汉语习惯呈现动作顺序。
- source_word: הַכֹּהֵן
  choice: 祭司
  rationale: 准确对应主持礼仪的特定人员，符合现代汉语圣经用语。
- source_word: הַזְּרֹעַ בְּשֵׁלָה מִן הָאַיִל
  choice: 从公绵羊取下煮熟的前腿
  rationale: זְרֹעַ在献祭语境中指前腿或肩部这一肉块；“前腿”较具体。בְּשֵׁלָה表明已经煮熟，מִן保留“从……取下”的来源关系。
- source_word: חַלַּת מַצָּה אַחַת
  choice: 一个无酵饼
  rationale: חַלָּה指饼或圆形面包；“无酵饼”自然简明，并保留מַצָּה的无酵含义。
- source_word: מִן הַסַּל
  choice: 从筐子里
  rationale: 准确表达器物和取出来源，符合现代汉语习惯。
- source_word: וּרְקִיק מַצָּה אֶחָד
  choice: 和一片无酵薄饼
  rationale: רָקִיק指薄的饼类；“一片无酵薄饼”兼顾形态和无酵性质。
- source_word: עַל כַּפֵּי הַנָּזִיר
  choice: 放在他的双手掌心上
  rationale: כַּפֵּי具体指双手的掌心，不泛化为“手中”；代词承接前句的“离俗人”，使汉语表达顺畅。
- source_word: הַנָּזִיר
  choice: 离俗人
  rationale: 该词指因特定誓愿分别出来的人；“离俗人”比纯音译更便于普通现代读者理解，又不额外加入宗派性解释。
- source_word: אַחַר הִתְגַּלְּחוֹ
  choice: 剃去……以后
  rationale: 介词加不定式结构构成时间从句，表示剃发动作先于祭司把物品放到掌心的动作。
theological_decisions:
- issue: נִזְרוֹ在离俗礼仪中的具体所指
  choice: 离俗期间所留的头发
  alternative: 他的离俗；他分别为圣的头；他离俗的头发
  rationale: נֵזֶר本义可指离俗、分别出来的身份或其标志；在本段剃发的具体语境中，它借由未剪的头发体现。正文明确实际被剃去的是头发，同时用脚注保留希伯来文较抽象且具有礼仪张力的字面表达。
translation_notes:
  register: 采用现代、庄重而易懂的礼仪规程语体。以“离俗人”表达נָזִיר，并通过脚注解释头发与离俗身份的关系；句法拆为两句，以清楚呈现所取物品和随后执行的动作。
