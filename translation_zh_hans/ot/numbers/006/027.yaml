  text: וְ/שָׂמ֥וּ אֶת שְׁמִ֖/י עַל בְּנֵ֣י יִשְׂרָאֵ֑ל וַ/אֲנִ֖י אֲבָרֲכֵֽ/ם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/027.yaml
  text: So they shall put my name on the sons of Israel[b][a], and I myself will bless them.
translation:
  language: zh_hans
  text: 这样，他们要把我的名放在以色列子孙身上[b][a]，我必亲自赐福给他们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“以色列人”或“以色列民”。希伯来文直译为“以色列的众子”，这里指整个以色列群体。
    reason: lexical_alternative
  - marker: b
    text: “把我的名放在……身上”很可能指奉耶和华立约的名为他们祝福，并标明他们属于他。
    reason: cultural_note
lexical_decisions:
- source_word: וְשָׂמוּ
  choice: 这样，他们要把……放在
  rationale: שׂוּם 的基本义是“放、安置”；句首 וְ 在此承接前面的祭司祝福及命令，译为“这样”可自然表达结果和施行方式，同时保留动词的将来/义务色彩。
- source_word: אֶת שְׁמִי
  choice: 我的名
  rationale: 保留“名”的具体表达，因为这里承载立约关系、代表和归属等丰富含义；若直接译成“我的权柄”或“我的祝福”，会把原文未明说的解释写入正文。
- source_word: עַל
  choice: 在……身上
  rationale: עַל 在此表示把上帝的名置于百姓“之上/身上”。“放在……身上”既符合现代汉语，也保留原文的具体隐喻。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列子孙
  rationale: 这是该希伯来语族群称谓的自然、庄重且较贴近字面的汉语表达，指整个以色列群体，并非仅指男性。
- source_word: וַאֲנִי
  choice: 我必亲自
  rationale: 原文另用独立代词 אֲנִי，具有强调作用；“亲自”准确传达“是我”的强调，不改变施事者。
- source_word: אֲבָרֲכֵם
  choice: 赐福给他们
  rationale: ברך 意为“赐福”；未完成式在此表达上帝所应许的行动，“必”也与独立代词的强调相协调。
theological_decisions:
- issue: 把上帝的名放在以色列身上的含义
  choice: 正文保留“把我的名放在……身上”的具体立约表达
  alternative: 译作“奉我的名为他们祝福”或“标明他们属于我”
  rationale: 该短语可能包含宣告耶和华之名、立约归属和赐福等意义，但原文以“把名放在……身上”的意象表达。正文不把丰富含义缩减为单一解释，脚注仅作说明。
- issue: בְּנֵי יִשְׂרָאֵל 的所指
  choice: 以色列子孙
  alternative: 以色列人；以色列民
  rationale: “以色列子孙”贴近原文固定称谓，又能在现代中文中自然指整个立约群体；脚注说明可替换的通顺译法，避免误解为只包括男性。
- issue: 赐福的最终施事者
  choice: 我必亲自赐福给他们
  alternative: 我必赐福给他们
  rationale: 独立代词 אֲנִי 强调赐福者是上帝自己。加入“亲自”呈现这一重点，同时不暗示祭司毫无参与；祭司把名放在百姓身上，上帝则是赐福的最终来源。
translation_notes:
  register: 采用现代、庄重且适合公开诵读的标准普通话。“以色列子孙”保留五经中的传统族群称谓；“放在……身上”有意保留希伯来文意象，而不在正文中将其解释化。脚注标记依照所修饰内容排列为[b][a]：先解释整句惯用语，再说明“以色列子孙”的词汇替代译法。
