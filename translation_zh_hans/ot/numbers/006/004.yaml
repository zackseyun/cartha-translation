  text: כֹּ֖ל יְמֵ֣י נִזְר֑/וֹ מִ/כֹּל֩ אֲשֶׁ֨ר יֵעָשֶׂ֜ה מִ/גֶּ֣פֶן הַ/יַּ֗יִן מֵ/חַרְצַנִּ֛ים וְ/עַד זָ֖ג לֹ֥א יֹאכֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/004.yaml
  text: All the days of his Nazirite vow[a], he shall not eat anything that is made from the grapevine, from the seeds to the skin.
translation:
  language: zh_hans
  text: 在他作拿细耳人的整个期间，凡用葡萄树所产之物制成的，从籽到皮[a]，他都不可吃。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“从籽到皮”，是概括葡萄各部分的一种说法。
    reason: 说明原文的首尾概括表达及其全面含义。
lexical_decisions:
- source_word: נִזְרוֹ
  choice: 他作拿细耳人的期间
  rationale: נֵזֶר在本章特指拿细耳人的分别身份及其期限。译作“作拿细耳人的期间”既保留这一制度性称谓，也避免把“誓愿”这一在本节并未明说的概念直接加入正文。
- source_word: מִכֹּל אֲשֶׁר יֵעָשֶׂה
  choice: 所产的一切
  rationale: 该短语指葡萄树产生或制成的所有东西；否定词由句末动词承载。中文用“所产的一切……都不可吃”自然地表达全面禁令。
- source_word: מִגֶּפֶן הַיַּיִן
  choice: 葡萄树
  rationale: 字面为“酒之藤”，是指结葡萄的藤本植物；“葡萄树”是现代汉语中清楚、通行的表达。
- source_word: מֵחַרְצַנִּים וְעַד זָג
  choice: 从籽到皮
  rationale: 保留希伯来文“从……到……”的首尾概括表达，表示葡萄的各部分无一例外。חַרְצַנִּים指籽，זָג通常理解为外皮。
- source_word: לֹא יֹאכֵל
  choice: 他都不可吃
  rationale: 否定未完成式在律法语境中表达禁令；“不可吃”语气庄重明确，并与前面的“一切”自然呼应。
- source_word: כֹּל יְמֵי
  choice: 整个期间
  rationale: 该短语强调规定在全部时日内持续有效；“整个期间”比逐字译作“所有日子”更符合现代汉语。
theological_decisions:
- issue: נִזְרוֹ是否明译为“誓愿”或“分别归主”
  choice: 作拿细耳人的期间
  alternative: 拿细耳誓愿期间／分别归主期间
  rationale: 本节的词形本身可表示分别、奉献或拿细耳身份；上下文明确涉及拿细耳制度，但此处未直接出现“誓愿”一词。正文采用制度性而较中性的表达，以免过度限定其神学内涵。
translation_notes:
  register: 采用现代、庄重而易懂的律法语体。“拿细耳人”保留传统且通行的圣经专名；句式将禁令置于末尾，以符合汉语表达习惯，同时保留原文对整个期限和全部葡萄制品的强调。
