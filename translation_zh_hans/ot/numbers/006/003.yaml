source:
  edition: WLC
  text: מִ/יַּ֤יִן וְ/שֵׁכָר֙ יַזִּ֔יר חֹ֥מֶץ יַ֛יִן וְ/חֹ֥מֶץ שֵׁכָ֖ר לֹ֣א יִשְׁתֶּ֑ה וְ/כָל מִשְׁרַ֤ת עֲנָבִים֙ לֹ֣א יִשְׁתֶּ֔ה וַ/עֲנָבִ֛ים לַחִ֥ים וִ/יבֵשִׁ֖ים לֹ֥א יֹאכֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/003.yaml
  text: he shall abstain from wine and strong drink[a]; he shall not drink vinegar made from wine or vinegar made from strong drink, and he shall not drink any juice of grapes or eat grapes[b], fresh or dried.
translation:
  language: zh_hans
  text: 他要戒绝葡萄酒和其他致醉饮料；不可喝葡萄酒制成的醋或致醉饮料制成的醋，也不可喝任何葡萄浸泡液[a]；鲜葡萄或葡萄干[b]也不可吃。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“葡萄汁”。希伯来语主要指浸泡葡萄所得的液体，也可能较宽泛地指经浸泡或加工所得的葡萄液。
    reason: lexical_alternative
  - marker: b
    text: 希伯来语直译“葡萄，新鲜的和干的”。“葡萄干”即晒干的葡萄。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִיַּיִן
  choice: 葡萄酒
  rationale: יַיִן是通常表示葡萄酒的词；介词מִן与יַזִּיר连用所表达的远离之意，在汉语中由“戒绝”承载。
- source_word: וְשֵׁכָר
  choice: 和其他致醉饮料
  rationale: שֵׁכָר指葡萄酒以外能使人醉的饮料。译作“其他致醉饮料”既保留它与葡萄酒的区别，也避免“烈酒”使现代读者误以为特指蒸馏酒。
- source_word: יַזִּיר
  choice: 他要戒绝
  rationale: נזר的使役词形在本段拿细耳人条例中表示使自己远离、禁戒某物；“戒绝”自然简洁，也保留主动禁戒的意味。
- source_word: חֹמֶץ יַיִן
  choice: 葡萄酒制成的醋
  rationale: חֹמֶץ可指酸酒或醋；此译明确表达与葡萄酒的所属或来源关系，并与下一短语保持平行。
- source_word: וְחֹמֶץ שֵׁכָר
  choice: 或致醉饮料制成的醋
  rationale: 按希伯来文与“葡萄酒制成的醋”平行处理，表明由这类饮料变酸而成的饮品同样在禁戒之列。
- source_word: וְכָל מִשְׁרַת עֲנָבִים
  choice: 任何葡萄浸泡液
  rationale: מִשְׁרָה主要指浸泡所得的液体；“葡萄浸泡液”比单译“葡萄汁”更贴近词义，同时以脚注说明可能的宽泛理解。
- source_word: עֲנָבִים לַחִים וִיבֵשִׁים
  choice: 鲜葡萄或葡萄干
  rationale: 原文直译为“新鲜的和干的葡萄”。汉语用“鲜葡萄或葡萄干”自然地表达同一对比；并列禁令在汉语中用“或”表示两类都不可吃。
- source_word: לֹא יֹאכֵל
  choice: 也不可吃
  rationale: 直接表达否定命令，并以“也”连接前面的饮用禁令。
theological_decisions:
- issue: 拿细耳人所禁饮料的范围
  choice: 保留从葡萄酒、其他致醉饮料到葡萄浸泡液及葡萄本身的逐项列举
  alternative: 概括为“所有酒类和葡萄制品”
  rationale: 逐项翻译避免把经文概括成原文未直接采用的类别，也保留禁令范围由饮料延伸至鲜葡萄和干葡萄的张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“其他致醉饮料”避免“烈酒”可能带来的现代蒸馏酒联想；分号保留原文禁令的层次和并列结构。
