  text: וְ/הֵנִיף֩ אוֹתָ֨/ם הַ/כֹּהֵ֥ן תְּנוּפָה֮ לִ/פְנֵ֣י יְהוָה֒ קֹ֤דֶשׁ הוּא֙ לַ/כֹּהֵ֔ן עַ֚ל חֲזֵ֣ה הַ/תְּנוּפָ֔ה וְ/עַ֖ל שׁ֣וֹק הַ/תְּרוּמָ֑ה וְ/אַחַ֛ר יִשְׁתֶּ֥ה הַ/נָּזִ֖יר יָֽיִן׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/020.yaml
  text: The priest shall wave them as a wave offering before Yahweh[a]. It is holy for the priest, besides the breast of the wave offering and the thigh of the contribution offering[b]. Afterward the Nazirite may drink wine.
translation:
  language: zh_hans
  text: 祭司要把这些在雅威面前摇献，作为摇祭。这归祭司为圣，另加上摇祭的胸脯和举祭的腿[a]。此后，拿细耳人可以喝酒[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“作为奉献物的腿”。“举祭”是תְּרוּמָה的传统译法，指分别出来献上的一份。
    reason: lexical_alternative
  - marker: b
    text: 也可较直译为：“此后，拿细耳人要喝酒。”这里按上下文译为禁令解除后的许可。
    reason: alternative_reading
lexical_decisions:
- source_word: וְהֵנִיף אֹתָם ... תְנוּפָה
  choice: 把这些摇一摇，作为摇祭
  rationale: 保留希伯来文中动词与同根名词并用的祭仪表达，同时用现代汉语清楚说明这是摇祭动作。
- source_word: לִפְנֵי יְהוָה
  choice: 在雅威面前
  rationale: 按原文直接呈现神的专名יהוה；“在……面前”保留祭仪场景中的临在含义。
- source_word: קֹדֶשׁ הוּא לַכֹּהֵן
  choice: 这是归祭司的圣物
  rationale: 以“这”集合指代刚才摇献的各物，保留原文单数指代，又自然表达其已分别为圣、归祭司所有。
- source_word: עַל
  choice: 此外还有
  rationale: 此处表示在祭司原有份额之外的追加关系，而非空间上的“在……上面”。
- source_word: חֲזֵה הַתְּנוּפָה
  choice: 摇祭的胸
  rationale: 保留祭祀法规中的固定部位和摇祭术语。
- source_word: שׁוֹק הַתְּרוּמָה
  choice: 作为奉献物献上的腿
  rationale: שׁוֹק指腿部肉，תְּרוּמָה指分别出来奉献的份；此译比单用传统术语“举祭”更便于现代读者理解。
- source_word: וְאַחַר יִשְׁתֶּה
  choice: 此后……可以喝
  rationale: 上下文表明离俗期结束后先前的禁令解除，因此用“可以”表达许可；脚注保留形式上更直译的读法。
- source_word: הַנָּזִיר
  choice: 拿细耳人
  rationale: 采用现代中文圣经语境中通行的称谓，指承担本章所述特别离俗之愿的人。
- source_word: יַיִן
  choice: 酒
  rationale: 原词יַיִן通常指葡萄酒；在“喝酒”这一汉语搭配中译作“酒”自然明确。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文明确使用四字神名；“雅威”较直接地音译该圣约之名，而不以称号替代。
- issue: יִשְׁתֶּה所表达的是许可还是陈述/命令
  choice: 可以喝酒
  alternative: 要喝酒；将喝酒
  rationale: 本章语境是拿细耳之愿完成后饮酒禁令解除；译作许可最符合该法律条文的语用，但希伯来文形式本身也容许更直译为“要喝”。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语；保留“摇祭”“拿细耳人”等必要的经文术语，同时以“作为奉献物献上的腿”避免只使用现代读者不易理解的传统祭仪术语。所有脚注标记均置于其所解释的正文词句之后。
