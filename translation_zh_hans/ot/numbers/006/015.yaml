  text: 'and a basket of unleavened bread: fine flour cakes mixed with oil[a], and unleavened wafers anointed with oil[b], along with their grain offering and their drink offerings.'
translation:
  language: zh_hans
  text: 还要带上一篮无酵饼[a]：用细面调油做的饼，以及抹上油的无酵薄饼[b]，连同同献的素祭和奠祭。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “无酵饼”也可译作“无酵面饼”。这里的希伯来语泛指无酵饼类，随后具体提到饼和薄饼。
    reason: lexical_alternative
  - marker: b
    text: “抹上油”所译的希伯来语动词通常也可译作“膏抹”；这里指制作薄饼时在其上涂油。
    reason: lexical_alternative
lexical_decisions:
- source_word: סַל
  choice: 一篮
  rationale: 该词指盛放无酵饼类的篮子；译作“一篮”既表达容器，也自然连接其中的祭物。
- source_word: מַצּוֹת
  choice: 无酵饼
  rationale: 该词广指未发酵的饼类，后文再细分为饼和薄饼；“无酵饼”在中文中自然且保留其类别含义。
- source_word: סֹלֶת
  choice: 细面
  rationale: 这是献祭律例中对精细研磨面粉的常用称呼；“细面”准确、简洁，也符合中文圣经祭祀语域。
- source_word: חַלֹּת
  choice: 饼
  rationale: 此处指由细面和油制成的成形饼食，不必具体化为现代意义的糕或大面包。
- source_word: בְּלוּלֹת בַּשֶּׁמֶן
  choice: 调油做的
  rationale: 分词表示油与饼的原料混合；“调油做的”比逐字译法更符合现代汉语，同时保留制作方式。
- source_word: רְקִיקֵי מַצּוֹת
  choice: 无酵薄饼
  rationale: רְקִיקִים 指薄而扁平的饼；“无酵薄饼”清楚传达其形态和未发酵性质。
- source_word: מְשֻׁחִים בַּשָּׁמֶן
  choice: 抹上油的
  rationale: משׁח 通常可表示“膏抹”，但在食品制作语境中是把油涂抹在薄饼上；“抹上油”自然且避免引入不必要的神学联想。
- source_word: מִנְחָתָם
  choice: 相应的素祭
  rationale: 献祭律例中的 מִנְחָה 特指谷物祭。“相应的”表达复数后缀所指向的配属关系，而不生硬照译为“它们的”。
- source_word: נִסְכֵּיהֶם
  choice: 奠祭
  rationale: 该词指随祭牲浇献的液体祭物；“奠祭”是准确而简明的中文祭祀术语。
theological_decisions: []
