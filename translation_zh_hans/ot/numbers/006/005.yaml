source:
  edition: WLC
  text: כָּל יְמֵי֙ נֶ֣דֶר נִזְר֔/וֹ תַּ֖עַר לֹא יַעֲבֹ֣ר עַל רֹאשׁ֑/וֹ עַד מְלֹ֨את הַ/יָּמִ֜ם אֲשֶׁר יַזִּ֤יר לַ/יהוָה֙ קָדֹ֣שׁ יִהְיֶ֔ה גַּדֵּ֥ל פֶּ֖רַע שְׂעַ֥ר רֹאשֽׁ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/005.yaml
  text: All the days of his Nazirite vow[a], no razor shall pass over his head. Until the days are completed for which he separates himself to Yahweh, he shall be holy[b]; he shall let the locks of the hair of his head grow long.
translation:
  language: zh_hans
  text: 在他所许拿细耳人之愿的一切日子[a]，剃刀不可从他头上经过[b]。直到他为雅威分别自己的日子满了，他要圣洁；他要让头上的头发任其生长。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “拿细耳人”一词源于表示“分别、奉献”的希伯来语词根；也可译作“他所许分别之愿的一切日子”。
    reason: 说明专门称谓的词源含义，并保留可成立的译法。
  - marker: b
    text: “剃刀不可从他头上经过”是希伯来语的表达，意思是他不可剃头。
    reason: 说明保留在正文中的希伯来语意象所表达的实际禁令。
lexical_decisions:
- source_word: נֶדֶר נִזְרוֹ
  choice: 他许愿作拿细耳人
  rationale: 以“拿细耳人”保留本段律法中的专门身份，同时用“许愿作”自然表达“愿”与该身份的关系；脚注说明其希伯来词根所含的分别、奉献之意。
- source_word: תַּעַר לֹא יַעֲבֹר עַל רֹאשׁוֹ
  choice: 剃刀不可经过他的头
  rationale: 保留希伯来文“剃刀经过头”的具体意象和禁令语气；在现代中文中仍可理解，脚注补明其实际含义是不剃头。
- source_word: עַד מְלֹאת הַיָּמִים
  choice: 直到……的日子满了
  rationale: “日子满了”准确体现 מלא 的完成、期满含义，也符合中文经文的庄重语体。
- source_word: אֲשֶׁר יַזִּיר לַיהוָה
  choice: 他分别自己归给雅威
  rationale: 保留 נזר 的核心概念“分别”，并以“归给”表达 ל 所指向的奉献关系，不把它过度解释为更具体的礼仪行为。
- source_word: קָדֹשׁ יִהְיֶה
  choice: 他要圣洁
  rationale: 直接保留 קדוש 的神学用语“圣洁”，不以“献上”或“分别为圣”替代，从而保留原文简洁而有分量的陈述。
- source_word: גַּדֵּל פֶּרַע שְׂעַר רֹאשׁוֹ
  choice: 他要任由头发披散长长
  rationale: “任由……长长”表达使其自然生长的含义，“披散”体现 פֶּרַע 所指未经修剪、自由生长的头发状态，兼顾原文细节和现代中文自然度。
theological_decisions:
- issue: 如何译出圣名 יהוה
  choice: 雅威
  alternative: 耶和华／上主
  rationale: 原文直接使用四字圣名；“雅威”较直接地呈现该专名，避免以称号代替，也不在正文中加入解释。
- issue: קדוש 是否译作解释性的“分别为圣”
  choice: 他要圣洁
  alternative: 他要分别为圣
  rationale: 原文明确使用 קדוש；保留“圣洁”可维持其神学重量，也避免与本节前面的 נזר“分别”混同。
translation_notes:
  register: 采用现代、庄重而可理解的律法语体。“拿细耳人”作为技术称谓保留，并用脚注解释；“剃刀不可经过他的头”刻意保留原文意象。“任由头发披散长长”避免生硬堆叠“绺、发、头”等名词，同时体现头发未经修剪而自由生长。
