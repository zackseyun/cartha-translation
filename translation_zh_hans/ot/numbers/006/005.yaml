revisions:
- from: 在他许愿作拿细耳人的一切日子[a]，剃刀不可经过他的头[b]。直到他分别自己归给雅威的日子满了，他要圣洁；他要任由头发披散长长。
  to: 在他所许拿细耳人之愿的一切日子[a]，剃刀不可从他头上经过[b]。直到他为雅威分别自己的日子满了，他要圣洁；他要让头上的头发任其生长。
  rationale: 修订末句以避免将未修剪、生长的头发误限为“披散”，并将两处语序调整为更自然的现代标准汉语。正文仍保留剃刀“经过头上”的原文意象、“圣洁”的关键术语及“雅威”这一神名译法。
