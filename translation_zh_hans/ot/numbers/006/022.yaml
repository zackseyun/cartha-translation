  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/022.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: zh_hans
  text: 耶和华对摩西说[a]：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文为“YHWH”（יהוה），是神的专名；传统上也常译作“主”。
    reason: 说明原文神名及传统替代译法。
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: 说
  rationale: 该形式推进叙事，并引出神谕。在现代汉语中，“对摩西说”自然、庄重；若译作“讲话”，与后面的 לֵאמֹר 组合反而生硬。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 这是汉语圣经传统中对四字神名 YHWH 的通行音译，作为专名保留，不以“主”这一称号替代。
- source_word: אֶל־מֹשֶׁה
  choice: 对摩西
  rationale: 介词 אֶל 在言说结构中标示说话的对象，现代汉语自然译为“对摩西”。
- source_word: לֵאמֹר
  choice: 说：
  rationale: 该不定式是希伯来语惯用的引语导入语。汉语不机械重复为“说着说”，而以句末“说：”承接下一节的直接引语。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威；上主；主
  rationale: 原文直接使用四字神名。正文采用汉语读者最熟悉的专名形式“耶和华”，既区别于称号“主”，也避免仅凭不完全确定的古代发音改用较陌生的“雅威”；脚注说明其希伯来文字母形式。
translation_notes:
  register: 采用简洁、庄重的现代标准汉语。将希伯来语“说……说”式结构整合为自然的“对摩西说：”，冒号表明直接引语从下一节开始。
