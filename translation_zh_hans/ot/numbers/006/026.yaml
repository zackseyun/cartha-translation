  text: יִשָּׂ֨א יְהוָ֤ה פָּנָי/ו֙ אֵלֶ֔י/ךָ וְ/יָשֵׂ֥ם לְ/ךָ֖ שָׁלֽוֹם׀׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/026.yaml
  text: May Yahweh lift up his face toward you and give you peace[a].
translation:
  language: zh_hans
  text: 愿雅威向你抬起脸来，赐你平安[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “平安”所译的希伯来语שָׁלוֹם（shalom）也可涵盖完整、健全和福祉。
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשָּׂא
  choice: 仰起
  rationale: נשׂא的基本义是“举起、抬起”。这里以“脸”为宾语，构成表达眷顾和悦纳的习语；译作“仰起”保留原文具体意象。
- source_word: יְהוָה
  choice: 雅威
  rationale: 原文直接使用四字神名יהוה；“雅威”是现代汉语中依据该神名常见学术重构所作的音译，保留其作为名字而非称号的性质。
- source_word: פָּנָיו
  choice: 他的脸
  rationale: פנים直译为“脸”。保留这一拟人化意象，不将其抽象化为“恩待”或“眷顾”。
- source_word: אֵלֶיךָ
  choice: 向你
  rationale: 介词אל表示朝向、趋向；“向你”准确表达脸所朝的方向。
- source_word: וְיָשֵׂם לְךָ
  choice: 赐你
  rationale: שׂים的基本义为“放置、安置”，与לְךָ和“平安”连用时表示使平安临到受益者；汉语祝福语中“赐你”自然而庄重。
- source_word: שָׁלוֹם
  choice: 平安
  rationale: שָׁלוֹם既可指和平、安宁，也可涵盖完整、健全和福祉；“平安”是此祝福语境中自然且通行的核心译法，并以脚注提示其较宽含义。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文使用的是以色列之神的专名，而非“主”这一称号；采用“雅威”保留专名，并贴近该名称的主流学术拟音。
- issue: 是否保留“仰起他的脸”这一拟人化习语
  choice: 保留脸的具体意象
  alternative: 向你施恩／眷顾你
  rationale: 该习语传达雅威以恩慈关注受祝福者，但原文刻意使用“脸”的形象；保留它可维持经文的文学质感，不把含义完全抽象化。
- issue: 祝福句的语气
  choice: 以“愿”表达祈愿
  alternative: 雅威必向你仰脸
  rationale: 本节属于祭司祝福公式，动词形式在语境中表达祈愿而非直接陈述或保证，故用“愿”准确传达其语气。
translation_notes:
  register: 采用现代、庄重而易懂的祝福语体。“向你仰起他的脸”略带希伯来语意象色彩，是为保留原文的具象表达；“赐你平安”则按自然汉语表达原文“为你安置平安”的意思。
