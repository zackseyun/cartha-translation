language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/הִקְרִ֣יב אֶת קָרְבָּנ֣/וֹ לַ/יהוָ֡ה כֶּבֶשׂ֩ בֶּן שְׁנָת֨/וֹ תָמִ֤ים אֶחָד֙ לְ/עֹלָ֔ה וְ/כַבְשָׂ֨ה אַחַ֧ת בַּת שְׁנָתָ֛/הּ תְּמִימָ֖ה לְ/חַטָּ֑את וְ/אַֽיִל אֶחָ֥ד תָּמִ֖ים לִ/שְׁלָמִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/014.yaml
  text: 'and he shall present his offering to Yahweh: one year-old male lamb without blemish for a burnt offering[a], and one year-old ewe lamb without blemish for a sin offering, and one ram without blemish for peace offerings[b],'
translation:
  language: zh_hans
  text: 他要向雅威献上自己的供物：一只一岁的无瑕疵公羊羔，作燔祭；一只一岁的无瑕疵母羊羔，作赎罪祭[a]；一只无瑕疵的公绵羊，作平安祭[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “赎罪祭”也可译作“洁净祭”。希伯来语חַטָּאת既可指罪，也可指为除去不洁或过犯而献的祭。
    reason: 保留该祭名在罪责与礼仪洁净之间的语义张力。
  - marker: b
    text: “平安祭”也可译作“福祉祭”或“团契祭”。
    reason: שְׁלָמִים所涵盖的平安、福祉和共享团契难以由一个中文祭名完全表达。
lexical_decisions:
- source_word: וְהִקְרִיב אֶת־קָרְבָּנוֹ
  choice: 并要把他的供物献上
  rationale: הקריב在献祭语境中指将祭物带近并呈献；“献上”自然保留礼仪含义。וְ承接上文，未完成式在法规语体中译为“要”。קָרְבָּנוֹ译作“他的供物”。
- source_word: לַיהוָה
  choice: 给雅威
  rationale: 直接音译圣名יהוה为“雅威”，保留其作为盟约之名的性质。与“献上”搭配时，“献给雅威”符合现代汉语。
- source_word: כֶּבֶשׂ בֶּן־שְׁנָתוֹ תָמִים אֶחָד
  choice: 一只一岁的、没有残疾的公羊羔
  rationale: כֶּבֶשׂ在此指公羊羔；בֶּן־שְׁנָתוֹ表示一岁或在第一年；תָמִים在祭牲法规中表示无缺陷，译为“没有残疾”。
- source_word: לְעֹלָה
  choice: 作燔祭
  rationale: עֹלָה是整牲焚烧献上的标准祭类，传统且清楚地译作“燔祭”。介词לְ表达用途，译作“作”。
- source_word: וְכַבְשָׂה אַחַת בַּת־שְׁנָתָהּ תְּמִימָה
  choice: 一只一岁的、没有残疾的母羊羔
  rationale: כַבְשָׂה明确为母羊羔；בַּת־שְׁנָתָהּ是相应的阴性表达，指一岁；“母羊羔”保留与前项公羊羔的性别对照。
- source_word: לְחַטָּאת
  choice: 作赎罪祭
  rationale: חַטָּאת既可指罪，也可指处理罪责或不洁的祭；主文采用现代中文圣经读者熟悉的祭类名称“赎罪祭”，另以脚注保留“洁净祭”的功能性理解。
- source_word: וְאַיִל אֶחָד תָּמִים
  choice: 一只没有残疾的公绵羊
  rationale: אַיִל专指成年公羊。译作“公绵羊”可与前面的“公羊羔”清楚区分，避免汉语“公羊”可能兼指幼羊的含混。
- source_word: לִשְׁלָמִים
  choice: 作平安祭
  rationale: שְׁלָמִים是祭类名称，词义涉及平安、福祉及共享团契；主文采用通行的“平安祭”，其他含义在脚注说明。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名。音译“雅威”让读者看见这是专名，而不是普通称号。
- issue: 祭牲תָמִים的含义
  choice: 没有残疾
  alternative: 无瑕疵；完全
  rationale: 在献祭法规中，该词要求祭牲没有身体缺陷；“没有残疾”表达具体法规含义，不将其抽象化为道德上的“完全”。
- issue: חַטָּאת祭的性质
  choice: 赎罪祭
  alternative: 洁净祭
  rationale: 该词在祭司法中既与罪有关，也具有洁净不洁的功能。主文保留通行名称，不以单一功能消除原词的语义张力，并在脚注列出另一译法。
- issue: שְׁלָמִים祭的性质
  choice: 平安祭
  alternative: 团契祭；福祉祭
  rationale: 词根与完整、平安、福祉相关，而这种祭也涉及共享祭餐。采用熟悉的“平安祭”，同时用脚注保留其他合理侧重。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。以分号清楚区分三种祭牲及其用途；保留句首“并”以体现וְ对上文程序的承接。祭类名称采用中文圣经传统中较为通行的“燔祭、赎罪祭、平安祭”，对有实质意义的替代译法加注。
