base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/006.yaml
  text: All the days of his separation to Yahweh[b][a], he shall not go near a dead body.
translation:
  language: zh_hans
  text: 在他离俗归耶和华[a]的所有日子里，他不可接近死人的尸体[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“他归耶和华的离俗时期”或“他作拿细耳人的时期”。希伯来语此词指人为归属耶和华而分别出来的状态或时期。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“一个死去的人（נֶפֶשׁ）”。在这里的礼仪洁净语境中，指人的尸体。
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל יְמֵי
  choice: 所有日子里
  rationale: 保留原文涵盖整个时段的总括意义，并用自然的汉语时间表达。
- source_word: הַזִּירוֹ
  choice: 他……为离俗者
  rationale: 该词源于 נזר，指拿细耳人分别出来的状态或时期；结合上下文译作“为离俗者”，既体现专门背景，也不在正文中额外加入“许愿”一词。
- source_word: לַיהוָה
  choice: 归耶和华
  rationale: 介词 ל 表达归属、奉献或指向；“归耶和华”自然地传达献身于他的含义。神名 יהוה 采用“耶和华”这一现代中文圣经读者熟悉的专名译法。
- source_word: עַל נֶפֶשׁ מֵת
  choice: 接近死人
  rationale: 在洁净条例语境中，נֶפֶשׁ מֵת 指死去之人的尸体；与 בוא 连用时，עַל 表示来到其近旁。正文用自然简洁的“接近死人”，脚注说明其字面措辞。
- source_word: לֹא יָבֹא
  choice: 不可接近
  rationale: 否定词与未完成式在法律条文中表达禁令；“不可”符合现代中文规范性语体。
theological_decisions:
- issue: 如何翻译拿细耳人术语而不过度限定其含义
  choice: 归耶和华为离俗者
  alternative: 向耶和华离俗的时期；向耶和华许拿细耳愿
  rationale: 原词主要指分别出来的状态或时期，而上下文明确属于拿细耳制度。“为离俗者”保留这种分别归属的意义，同时避免把原词直接等同于“愿”。
- issue: 如何翻译神名 יהוה
  choice: 耶和华
  alternative: 雅威；上主
  rationale: 采用现代简体中文圣经传统中辨识度最高的专名形式，使其与表示称号的“主”有所区别；原文此处使用的是神的专名。
- issue: נֶפֶשׁ מֵת 所指对象
  choice: 死人
  alternative: 尸体；死去的人
  rationale: 此固定表达在礼仪洁净语境中指人的遗体。“死人”自然且保留原文以“死的 נפשׁ”指人的表达，脚注进一步澄清。
translation_notes:
  register: 采用现代、庄重而清楚的法律条文语体。“所有日子里……不可”保留原文的时段总括与禁令结构；“离俗者”作为上下文中的制度性称谓，并以脚注帮助普通读者理解。
