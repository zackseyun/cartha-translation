revisions:
- from: 拿细耳人要在会幕门口剃去他分别为圣的头发，并拿起剃下的头发，放在平安祭[a]下面的火上。
  to: 拿细耳人要在会幕门口剃去他分别为圣的头发，并拿起剃下的头发，放在平安祭祭牲下面的火上。
  rationale: 仅修订末句的空间关系表达：以“平安祭祭牲下面的火”明确原文“在平安祭的祭物之下的火”，避免将“平安祭”这一祭礼类别本身理解为火所处位置的实体。其余译文准确、自然，予以保留。
