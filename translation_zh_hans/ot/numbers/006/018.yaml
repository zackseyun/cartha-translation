base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/018.yaml
  text: Then the Nazirite shall shave the head of his consecration at the entrance of the tent of meeting[a], and shall take the hair of the head of his consecration and put it on the fire that is under the sacrifice of peace offerings.
translation:
  language: zh_hans
  text: 拿细耳人要在会幕门口剃去他分别为圣的头发，并拿起剃下的头发，放在平安祭祭牲下面的火上。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַנָּזִיר
  choice: 拿细耳人
  rationale: 采用现代中文圣经中通行的专门称谓，指本章所规定、许下拿细耳愿而分别出来的人，避免泛化为普通的“奉献者”或“离俗人”。
- source_word: וְגִלַּח
  choice: 要……剃去
  rationale: 表达礼仪条例中的指令性质，并清楚表明所剃的是头发。
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: 在会幕门口
  rationale: “门口”自然、简洁地表达帐幕的入口；“会幕”是 אֹהֶל מוֹעֵד 的通行中文礼仪术语。
- source_word: רֹאשׁ נִזְרוֹ
  choice: 他分别为圣的头发
  rationale: 原文直译为“他分别为圣之头”，在拿细耳礼仪中具体指作为分别为圣标志而留的头发。译文以自然中文明确动作对象，同时保留头发与分别为圣状态的联系。
- source_word: שְׂעַר רֹאשׁ נִזְרוֹ
  choice: 剃下的头发
  rationale: 原文重复“他分别为圣之头的头发”；中文承接前句，用“剃下的头发”避免生硬重复，同时保持指代清楚。
- source_word: הָאֵשׁ אֲשֶׁר תַּחַת
  choice: 下面的火
  rationale: 按空间关系直接翻译，指平安祭下面的火，不额外说明具体器具或烹煮方式。
- source_word: זֶבַח הַשְּׁלָמִים
  choice: 平安祭
  rationale: 这是该祭类在现代中文圣经中的通行名称，也保留 שְׁלָמִים 与平安、完整和福祉相关的语义范围。
theological_decisions:
- issue: 祭祀术语 שְׁלָמִים 的译法
  choice: 平安祭
  alternative: 团契祭；福祉祭
  rationale: “平安祭”保留传统祭类名称，并不把该词局限为共同进餐或团契；其他译法分别凸显团契和福祉，也是可能的语义表达，因此列入脚注。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。用“拿细耳人”“会幕”“平安祭”等通行礼仪术语；将希伯来语较生硬的“分别为圣之头”按上下文译为“分别为圣的头发”，使普通读者能够理解，同时不割断头发与拿细耳人奉献身份之间的关系。
