base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/016.yaml
  text: And the priest shall present them before Yahweh and offer his sin offering and his burnt offering[a][b].
translation:
  language: zh_hans
  text: 祭司要把这些祭物带到雅威面前[a]，并为他献上赎罪祭[b]和燔祭。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“把这些祭物带近雅威面前。”希伯来语动词可侧重实际献祭之前，把祭物带到上帝面前呈上。
    reason: lexical_alternative
  - marker: b
    text: “赎罪祭”在祭司礼仪用语中也可理解为“洁净祭”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרִיב
  choice: 要把这些祭物呈到
  rationale: 使役词形在献祭语境中表示“使接近、带到、呈上”。译作“呈到”可与下文实际献祭的 וְעָשָׂה 区分；“这些祭物”承接上一节隐含的宾语，使中文清楚自然。
- source_word: הַכֹּהֵן
  choice: 祭司
  rationale: 祭祀语境中 כֹּהֵן 的标准现代汉语译法。
- source_word: לִפְנֵי יְהוָה
  choice: 雅威面前
  rationale: לִפְנֵי 表示在上帝面前或临在之处；יְהוָה 按其专名音译为“雅威”。
- source_word: וְעָשָׂה
  choice: 献上
  rationale: עָשָׂה 本义为“做、办理”，但以祭物为宾语时是执行献祭礼仪；“献上”符合现代汉语祭祀表达。
- source_word: אֶת חַטָּאתוֹ
  choice: 他的赎罪祭
  rationale: חַטָּאת 在祭司礼仪中指处理罪或不洁的祭物；“赎罪祭”是通行且易懂的译名，同时以脚注保留“洁净祭”的理解。后缀 וֹ 译作“他的”，保留原文所属关系。
- source_word: וְאֶת עֹלָתוֹ
  choice: 和燔祭
  rationale: עֹלָה 指整只焚烧献上的祭物，惯用译名为“燔祭”；中文中前文的“他的”可自然统摄并列的两种祭。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；音译“雅威”保留其作为以色列之神专名的性质，而不以“主”这一称号替代。
- issue: חַטָּאת 作为祭名的含义
  choice: 赎罪祭
  alternative: 洁净祭
  rationale: “赎罪祭”是中文读者熟悉的传统祭名，但该祭在祭司文献中也具有除去礼仪不洁、使人或圣所得洁净的功能，因此不在正文中排除“洁净祭”的理解，并以脚注说明。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“呈到……面前”保留先呈上、后献祭的动作层次；补出“这些祭物”以承接上文，但不具体列举，避免超过希伯来文本的信息。脚注标记均置于正文相应词语之后。
