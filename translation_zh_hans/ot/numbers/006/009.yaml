  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/כִֽי יָמ֨וּת מֵ֤ת עָלָי/ו֙ בְּ/פֶ֣תַע פִּתְאֹ֔ם וְ/טִמֵּ֖א רֹ֣אשׁ נִזְר֑/וֹ וְ/גִלַּ֤ח רֹאשׁ/וֹ֙ בְּ/י֣וֹם טָהֳרָת֔/וֹ בַּ/יּ֥וֹם הַ/שְּׁבִיעִ֖י יְגַלְּחֶֽ/נּוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/009.yaml
  text: And if someone dies suddenly beside him[a], and he defiles his consecrated head, then he shall shave his head on the day of his cleansing[b]; on the seventh day he shall shave it.
translation:
  language: zh_hans
  text: 如果有人忽然死在他身旁[a]，以致他那分别为圣的头[b]受了玷污，他就要在洁净的日子剃头；第七天要剃头。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译近似“若有死者在他身旁死亡，突然，猝然”，以同根词和近义词叠用强调死亡来得突然、出人意料。
    reason: 说明希伯来语强化表达及正文的自然化处理。
  - marker: b
    text: 原文直译为“他分别为圣之头”或“他奉献之头”，把拿细耳人的头与其分别为圣的身份紧密相连。
    reason: 保留 רֹאשׁ נִזְרוֹ 的结构和礼仪含义。
lexical_decisions:
- source_word: וְכִי
  choice: 如果
  rationale: 在拿细耳人条例中引出一种条件情形；中文以“如果”自然表达，前后衔接不必机械译出连接词 וְ。
- source_word: יָמוּת מֵת
  choice: 有人……猝死
  rationale: 这是“死”与“死者”同根并用的希伯来语表达，指有人死亡；中文用“有人……死”避免生硬重复，并结合下文的突发意味译为“猝死”。
- source_word: עָלָיו
  choice: 在他身旁
  rationale: 这里表示死者与拿细耳人近在咫尺，以致造成礼仪上的玷污；“在他身旁”比字面的“在他之上”更符合语境。
- source_word: בְּפֶתַע פִּתְאֹם
  choice: 突然
  rationale: 两个近义词连用，强调事情发生得猝不及防；“突然猝死”自然传达突发且意外的意味，脚注保留原文的强化形式。
- source_word: וְטִמֵּא
  choice: 使……受了玷污
  rationale: 原文为及物形式，主语可理解为突然死亡的人或整个突发事件；采用使动表达，保留死亡事件使拿细耳人的头陷入不洁状态这一关系，而不强行限定主语。
- source_word: רֹאשׁ נִזְרוֹ
  choice: 他那分别为圣的头
  rationale: נֵזֶר 在本段指拿细耳人的奉献、分别为圣状态，特别体现于未剪的头发。“分别为圣的头”兼顾可读性和礼仪含义，脚注说明原文结构。
- source_word: בְּיוֹם טָהֳרָתוֹ
  choice: 在得洁净的日子
  rationale: 指因接触死亡污秽后礼仪上恢复洁净的日期；“得洁净”既通俗，也保留礼仪语境。
- source_word: בַּיּוֹם הַשְּׁבִיעִי יְגַלְּחֶנּוּ
  choice: 第七天，他要把头剃了
  rationale: 保留原文对剃头命令的重复，并明确代词后缀所指的是“头”；“第七天”说明前句所说的洁净之日。
theological_decisions:
- issue: 拿细耳人之头受玷污的性质
  choice: 以“分别为圣”表达 נֵזֶר 的礼仪奉献含义
  alternative: 译作“许愿的头”或“分离的头”
  rationale: 本节重点是死亡污秽中断拿细耳人的奉献状态；“分别为圣”保留其礼仪意义，又不把本句没有明说的“愿”直接加入正文。
- issue: 玷污动作的主语
  choice: 译作“使……受了玷污”，让死亡事件整体成为原因
  alternative: 明确译作“死者玷污了”或“他就成为不洁净”
  rationale: 希伯来语动词为及物形式，但主语指向可理解为死者或突发死亡这一事态。使动结构保留这种张力，也避免把及物动词改成纯粹的状态描述。
translation_notes:
  register: 采用现代、庄重而易懂的法规叙述语体。“突然猝死”简洁传达原文双重强化；末尾保留“剃头”的重复，以反映原文先概括洁净之日、再明确第七日的表达。
