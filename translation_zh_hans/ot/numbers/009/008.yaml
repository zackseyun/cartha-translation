  text: וַ/יֹּ֥אמֶר אֲלֵ/הֶ֖ם מֹשֶׁ֑ה עִמְד֣וּ וְ/אֶשְׁמְעָ֔ה מַה יְצַוֶּ֥ה יְהוָ֖ה לָ/כֶֽם־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/008.yaml
  text: And Moses said to them[a], “Wait, and I will hear what Yahweh commands concerning you.”
translation:
  language: zh_hans
  text: 摩西对他们说：“你们等候[a]，我来听听雅威会就你们的事吩咐什么。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你们站着等候。”希伯来语祈使词的字面意思是“站立”。
    reason: 保留עִמְדוּ的字面意义，同时说明正文采用其在本语境中的惯用含义。
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵהֶם מֹשֶׁה
  choice: 摩西对他们说
  rationale: 按希伯来叙事顺序自然承接上文；中文不必机械译出句首连接词，仍完整表达说话者和对象。
- source_word: עִמְדוּ
  choice: 你们等候
  rationale: 该复数祈使式字面义为“站立”，在此语境中指留在原处等待答复；“等候”符合现代中文表达，字面意象保留于脚注。
- source_word: וְאֶשְׁמְעָה
  choice: 我要听听
  rationale: 第一人称意愿式表达摩西有意聆听并获得雅威的答复；“我要听听”保留“听”的原文意象，也符合自然中文。
- source_word: מַה יְצַוֶּה
  choice: 会吩咐……什么
  rationale: מַה引出所期待命令的内容，צוה的Piel未完成式表示将作出的吩咐；此译法自然呈现其未来指向。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代中文音译呈现四字神名，保留其作为专名的性质，而不以称号代替。
- source_word: לָכֶם
  choice: 吩咐你们
  rationale: 介词ל与第二人称复数后缀可表示命令所针对或所关乎的对象；中文“吩咐你们什么”自然，并不过度限定为“为你们”或“关于你们”。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。采用“雅威”作为现代汉语音译，以保留盟约之神的专名；不用“主”替代专名，也不采用源自较晚混合读法的“耶和华”。
- issue: לָכֶם所表达的命令对象或关联
  choice: 会吩咐你们什么
  alternative: 关于你们会作什么吩咐；会为你们作什么吩咐
  rationale: 原文介词结构容许“对你们、为你们、关于你们”等语义关联。正文采用自然且较开放的“吩咐你们什么”，避免把命令仅解释为关于他们处境的裁定。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“等候”比口语化的“等一下”更适合经文语体；“我要听听”保留原文“听”的措辞和摩西有意寻求答复的语气。脚注标记已在正文相应词后标出。
