  text: וַ/יְהִ֣י אֲנָשִׁ֗ים אֲשֶׁ֨ר הָי֤וּ טְמֵאִים֙ לְ/נֶ֣פֶשׁ אָדָ֔ם וְ/לֹא יָכְל֥וּ לַ/עֲשֹׂת הַ/פֶּ֖סַח בַּ/יּ֣וֹם הַ/ה֑וּא וַֽ/יִּקְרְב֞וּ לִ/פְנֵ֥י מֹשֶׁ֛ה וְ/לִ/פְנֵ֥י אַהֲרֹ֖ן בַּ/יּ֥וֹם הַ/הֽוּא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/006.yaml
  text: There were men who were unclean because of a human corpse[a], so they could not keep the Passover on that day; and they came near before Moses and before Aaron on that day.
translation:
  language: zh_hans
  text: 有几个人因人的尸体而不洁[a]，所以不能在那一天守逾越节。那一天，他们来到摩西和亚伦面前。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“因人的נפש而不洁”；这里的נפש是指死者，即人的尸体。这是表示尸体所致不洁的惯用说法。
    reason: 说明希伯来文惯用语及其礼仪语境，避免读者把נפש机械理解为“灵魂”。
lexical_decisions:
- source_word: וַיְהִי אֲנָשִׁים
  choice: 有几个人
  rationale: היה在此引入新的叙事情形；אֲנָשִׁים是阳性复数，语境明确指一群人。译为“有几个人”既自然，也不添加原文没有的显式时间副词。
- source_word: טְמֵאִים לְנֶפֶשׁ אָדָם
  choice: 因人的尸体而不洁
  rationale: 这是祭司礼仪语境中的惯用表达，指由人的尸体所造成的礼仪性不洁。“不洁”保留律法术语，“因人的尸体”则清楚表达不洁的缘由。
- source_word: וְלֹא יָכְלוּ
  choice: 所以不能
  rationale: 不洁的状态导致他们无法按规定守节；“所以”自然呈现上下句的结果关系，但不把这种不能解释为道德过犯。
- source_word: לַעֲשֹׂת הַפֶּסַח
  choice: 守逾越节
  rationale: 希伯来文直译为“行逾越节”，实际指遵守逾越节的礼仪规定。“守逾越节”是准确而自然的现代汉语表达。
- source_word: בַּיּוֹם הַהוּא
  choice: 在那一天／就在那一天
  rationale: 第一次说明他们无法按期守节，第二次强调他们当天便前来求问；用“就在”自然传达重复所形成的强调，而不改变时间指向。
- source_word: וַיִּקְרְבוּ לִפְנֵי
  choice: 他们来到……面前
  rationale: קרב表示走近、来到，לִפְנֵי表示“在……面前”。此译法保留正式晋见的姿态，又不额外断定这是法律诉讼。
- source_word: מֹשֶׁה ... אַהֲרֹן
  choice: 摩西……亚伦
  rationale: 采用现代简体中文圣经传统中通行的人名译法。
theological_decisions:
- issue: 不洁的性质
  choice: 译作由人的尸体造成的礼仪性“不洁”
  alternative: 按字面译作“因人的נפש而不洁”，或采用带有道德意味的“玷污”
  rationale: 五经洁净条例中的该短语指接触或涉及死人所造成的礼仪状态，并不必然表示个人犯罪；译文应清楚表达其礼仪含义而不加入道德定性。
translation_notes:
  register: 采用庄重而通顺的现代标准普通话。“不洁”“守逾越节”保留律法叙事所需的术语感；分为两句以增强可读性，并用“就在那一天”体现原文重复时间短语的强调作用。
