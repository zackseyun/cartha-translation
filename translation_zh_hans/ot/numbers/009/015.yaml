base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/015.yaml
  text: On the day the tabernacle was set up[a], the cloud covered the tabernacle, the tent of the testimony; and in the evening it was over the tabernacle like the appearance of fire until morning.
translation:
  language: zh_hans
  text: 帐幕立起的那一天，云彩遮盖了帐幕，就是见证之帐棚[a]；到了晚上，云彩在帐幕上方显得如火一般，直到早晨。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “见证之帐棚”也可译作“见证的帐棚”。“见证”在这里是礼仪用语，指与上帝和以色列所立之约有关的见证。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְיוֹם הָקִים
  choice: 帐幕立起的那一天
  rationale: 将带冠词的不定式结构自然地译为时间从句；希伯来文侧重设立帐幕这一事件，中文用“立起”简洁准确。
- source_word: הַמִּשְׁכָּן
  choice: 帐幕
  rationale: 这是以色列人在旷野中的可移动圣所，采用现代中文圣经语境中通行而清楚的名称。
- source_word: כִּסָּה הֶעָנָן
  choice: 云彩遮盖了
  rationale: כסה表示覆盖、遮盖；“云彩”保留定指背景所指的那片云，又符合自然中文表达。
- source_word: לְאֹהֶל הָעֵדֻת
  choice: 就是见证之帐棚
  rationale: 按最自然的句法，将此短语视为对“帐幕”的同位说明；“见证”保留עֵדוּת的核心意义，“帐棚”则与前面的מִשְׁכָּן“帐幕”作适度区分。
- source_word: וּבָעֶרֶב יִהְיֶה
  choice: 到了晚上，云彩在
  rationale: 未完成式在此描写当晚持续存在的状态；中文补出“云彩”避免代词指向含混，并用“到了晚上”自然承接。
- source_word: כְּמַרְאֵה אֵשׁ
  choice: 看起来像火
  rationale: 原文表达视觉上的相似而非直接认定为火；此译法清楚保留比较意味。
- source_word: עַד בֹּקֶר
  choice: 直到早晨
  rationale: 准确表达这一状态延续的时间终点。
theological_decisions:
- issue: “帐幕”与“见证之帐棚”的关系
  choice: 将后者译为同位说明：“就是见证之帐棚”
  alternative: 将ל理解为带地点或方向意味：“遮盖帐幕，直到/在见证之帐棚那里”
  rationale: 上下文与句法更自然地表明两个短语指同一圣所；但不进一步解释“见证”的具体所指，以免替原文消除其礼仪语境中的含义张力。
- issue: 夜间所见之物与火的关系
  choice: 译为“看起来像火”
  alternative: 译为“就是火”
  rationale: כְּמַרְאֵה明确表达外观上的类比，原文没有断言云彩本身化为火。
translation_notes:
  register: 采用庄重、流畅的现代标准汉语。“就是”清楚呈现同位关系；“看起来像火”避免生硬的“如火之貌”，同时忠实保留视觉比较。
