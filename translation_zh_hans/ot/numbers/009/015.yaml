  terminology: “帐幕”与“见证之帐棚”可保留，以反映原文两个相关称谓。现有脚注把“法版之帐棚”列为另一种译法不够准确：法版可与“见证”的具体所指相关，却不是该短语本身可直接替换的词汇译法。脚注应改为说明“见证”也可译作“证词/见证物”，并避免把其含义限定为某一具体物件。
