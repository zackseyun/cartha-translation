language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: דַּבֵּ֛ר אֶל בְּנֵ֥י יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר אִ֣ישׁ אִ֣ישׁ כִּי יִהְיֶֽה טָמֵ֣א לָ/נֶ֡פֶשׁ אוֹ֩ בְ/דֶ֨רֶךְ רְחֹקָ֜הׄ לָ/כֶ֗ם א֚וֹ לְ/דֹרֹ֣תֵי/כֶ֔ם וְ/עָ֥שָׂה פֶ֖סַח לַ/יהוָֽה־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/010.yaml
  text: Speak to the sons of Israel[a], saying, ‘If any man becomes unclean by a dead body, or is on a distant journey, whether among you or among your generations[c][b], he shall still keep the Passover to Yahweh.
translation:
  language: zh_hans
  text: 你要告诉以色列子孙[a]说：‘你们中间或你们的后代中，若有人因尸体而不洁[b]，或在远行途中[c]，他要为雅威守逾越节。’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“以色列的儿子们”；这里指整个以色列群体。
    reason: lexical_alternative
  - marker: b
    text: 原文是“因一个人（生命）而不洁”；在这类律法语境中，指因死者或尸体而沾染礼仪上的不洁。
    reason: lexical_alternative
  - marker: c
    text: “远途”所对应的希伯来词末字母上有古代抄写传统留下的特殊点号，其确切作用不明；本译文按马所拉正文通常的读法翻译。
    reason: textual_feature
lexical_decisions:
- source_word: דַּבֵּר אֶל־בְּנֵי יִשְׂרָאֵל
  choice: 你要告诉以色列子孙
  rationale: דַּבֵּר是命令式；“告诉”在现代汉语中自然地引出所传达的指示。“以色列子孙”保留בְּנֵי יִשְׂרָאֵל的家族—盟约表达，同时脚注说明其群体所指。
- source_word: אִישׁ אִישׁ
  choice: 若有人
  rationale: 重复的אִישׁ具有逐一、任一成员的分配意义；“若有人”自然表达条件句与个别适用范围，而不把重复生硬译出。
- source_word: טָמֵא לָנֶפֶשׁ
  choice: 因尸体而不洁
  rationale: 在祭司律法语境中，נֶפֶשׁ用于这类不洁表达时指死者或尸体；“因尸体而不洁”既说明不洁的缘由，也不额外限定具体接触方式。
- source_word: בְדֶרֶךְ רְחֹקָה
  choice: 身在远途
  rationale: 该短语指人在远行途中、远离通常守节地点；“身在远途”简洁、庄重，也符合现代汉语。
- source_word: לָכֶם אוֹ לְדֹרֹתֵיכֶם
  choice: 你们中间或你们后世中
  rationale: 这里把条例的适用范围从眼前会众延伸至后代；中文将范围语前置，使其与“若有人”自然衔接。
- source_word: וְעָשָׂה פֶסַח
  choice: 他仍要……守逾越节
  rationale: עָשָׂה与פֶסַח连用是“守逾越节”的惯用表达。连接词וְ在此承接前述障碍，语境上表明此人仍须守节，故用“仍要”呈现其延续性的义务。
- source_word: לַיהוָה
  choice: 向雅威
  rationale: 直接音译四字神名יהוה为“雅威”；介词לְ表明守节所指向、归给的对象，译作“向”。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华／上主
  rationale: 原文直接使用四字神名；“雅威”以通行的现代汉语音译保留其专名性质，不用称号替代。
- issue: 不洁或远行者守逾越节的语气
  choice: 他仍要……守逾越节
  alternative: 他可以……守逾越节／他要……守逾越节
  rationale: 原文וְעָשָׂה本身可直译为“他要守”，上下文则强调前述状况并不取消守节责任。“仍要”保留义务性，并呈现连接词在语境中的转折承接；不译成纯粹许可。
- issue: 盟约群体称呼的性别与范围
  choice: 以色列子孙；若有人
  alternative: 以色列人；若有男子
  rationale: “以色列子孙”保留原有盟约家族用语；אִישׁ אִישׁ在法规中具有分配性的代表用法，译成“若有人”避免无根据地把条例限于成年男性。
translation_notes:
  register: 采用现代、庄重而易懂的法规语体。“你要告诉……说”保留希伯来命令与引语框架；范围语前置以符合汉语表达。“身在远途”避免生硬的“在遥远的路上”。脚注仅解释原文习语、群体范围及马所拉特殊点号，不替正文消解其神学张力。
