  text: וְ/יֵ֞שׁ אֲשֶׁר יִהְיֶ֤ה הֶֽ/עָנָן֙ מֵ/עֶ֣רֶב עַד בֹּ֔קֶר וְ/נַעֲלָ֧ה הֶֽ/עָנָ֛ן בַּ/בֹּ֖קֶר וְ/נָסָ֑עוּ א֚וֹ יוֹמָ֣ם וָ/לַ֔יְלָה וְ/נַעֲלָ֥ה הֶ/עָנָ֖ן וְ/נָסָֽעוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/021.yaml
  text: And sometimes the cloud would remain from evening until morning; when the cloud was taken up in the morning[a], they would set out. Or if it remained for a day and a night, when the cloud was taken up, they would set out.
translation:
  language: zh_hans
  text: 有时云彩从晚上停留到早晨；早晨云彩一升起[a]，他们就起行。或者云彩停留一昼一夜；云彩一升起，他们就起行。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “升起”或译“被提起”。希伯来语动词在这里可指云彩上升，也可能带有被举起的意味；两种理解都表示云彩离开原先停驻的位置，作为以色列人起行的信号。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֵשׁ אֲשֶׁר
  choice: 有时
  rationale: 该习语引出前述一般规律中的一种情况；“有时”简洁自然，并保留偶发情形的意味。
- source_word: יִהְיֶה הֶעָנָן
  choice: 云彩……停留
  rationale: היה 基本义为“是、存在”，但与“从晚上到早晨”的时间范围连用时，表达持续存在；“停留”符合现代汉语，也准确传达延续含义。
- source_word: מֵעֶרֶב עַד בֹּקֶר
  choice: 从晚上……到早晨
  rationale: 直接表达起止时段，符合现代汉语习惯。
- source_word: וְנַעֲלָה הֶעָנָן
  choice: 云彩一升起
  rationale: עלה 的尼法勒形在本段指云彩从帐幕上方升起，成为以色列人出发的信号。“一……就……”自然呈现动作与随后起行之间的紧密关系；形态上也可理解为“被提起”，故加注保留其可能性。
- source_word: וְנָסָעוּ
  choice: 他们就起行
  rationale: נסע 在旷野行程语境中指拔营出发；“起行”庄重、清楚，并与本段反复出现的程序性表达相称。
- source_word: אוֹ יוֹמָם וָלַיְלָה
  choice: 也有时……一昼一夜
  rationale: אוֹ 引出另一种并列情况；יוֹמָם וָלַיְלָה 在此结合省略的“停留”表达持续时长。“一昼一夜”准确而简练。
theological_decisions: []
translation_notes:
  register: 采用现代、清楚而庄重的叙事语言。“云彩”“起行”与民数记旷野行程的语域协调；用两个“有时”呈现并列案例，并以“一……就……”准确表达云彩升起后立即出发的规律。
