  text: כֵּ֚ן יִהְיֶ֣ה תָמִ֔יד הֶ/עָנָ֖ן יְכַסֶּ֑/נּוּ וּ/מַרְאֵה אֵ֖שׁ לָֽיְלָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/016.yaml
  text: 'So it was continually: the cloud would cover it[a], and the appearance of fire by night.'
translation:
  language: zh_hans
  text: 情形总是这样：云彩遮盖帐幕，夜间呈现火的样子。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“夜间有火的景象。”
    reason: 原文可指“火的景象”，也可指“看起来像火的样子”；两种译法都保留其外观性的含义。
lexical_decisions:
- source_word: כֵּן יִהְיֶה תָמִיד
  choice: 一直都是这样
  rationale: 概括前文所述持续不变的情形；用现代汉语自然表达未完成式在此处的惯常、延续意义。
- source_word: הֶעָנָן
  choice: 云彩
  rationale: 指上下文中覆盖帐幕、引导以色列人的特定云彩；“云彩”符合现代中文圣经语体且易懂。
- source_word: יְכַסֶּנּוּ
  choice: 遮盖帐幕
  rationale: 动词意为“遮盖”；阳性单数后缀依上下文最自然地回指帐幕。为避免中文代词指向不明，明说“帐幕”。
- source_word: וּמַרְאֵה אֵשׁ
  choice: 则有火一般的景象
  rationale: מַרְאֶה强调可见的外观或景象；此译保留它究竟是火本身还是看起来像火的现象这一含混性。
- source_word: לָיְלָה
  choice: 夜间
  rationale: 简洁自然地表达时间状语。
theological_decisions:
- issue: יְכַסֶּנּוּ中第三人称阳性单数后缀的所指
  choice: 译作“帐幕”
  alternative: 译作“它”或“他”
  rationale: 紧接的上下文谈到云彩遮盖帐幕；中文若只用“它”容易指代不清，而“他”会造成不必要的人格化。
- issue: מַרְאֵה אֵשׁ所指是实际的火还是火状显现
  choice: “火一般的景象”
  alternative: “火的景象”或“看起来像火”
  rationale: 原文说的是“火的外观/景象”，并未明确断定其本体；译文避免把这种现象直接等同于普通的火。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“一直都是这样”传达持续和惯常状态；“则有”使白昼云彩与夜间火状景象的对照清楚。脚注标记置于正文相关分句之后。
