  text: וּ/בְ/הַאֲרִ֧יךְ הֶֽ/עָנָ֛ן עַל הַ/מִּשְׁכָּ֖ן יָמִ֣ים רַבִּ֑ים וְ/שָׁמְר֧וּ בְנֵי יִשְׂרָאֵ֛ל אֶת מִשְׁמֶ֥רֶת יְהוָ֖ה וְ/לֹ֥א יִסָּֽעוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/019.yaml
  text: When the cloud remained over the tabernacle for many days[b][a], the sons of Israel kept the charge of Yahweh and did not set out.
translation:
  language: zh_hans
  text: 当云彩在帐幕上停留许多日子时，以色列人[a]就谨守雅威所交付的职守[b]，并不拔营出发。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“以色列的众子”；也可译作“以色列子民”。
    reason: lexical_alternative
  - marker: b
    text: 原文为“雅威的职守（或守则）”。“所交付的职守”表达应当谨守的责任；也可译作“雅威的吩咐”或“雅威所规定的义务”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְהַאֲרִיךְ
  choice: 若……停留
  rationale: ב 加不定式构成时间或情境从句；אָרַךְ在此表示持续较长时间。“若……停留”既承接上下文反复出现的不同停留时长，也符合现代汉语叙事表达。
- source_word: הֶעָנָן
  choice: 云彩
  rationale: 指旷野中显明雅威同在并引导以色列的可见云彩；“云彩”庄重且符合经文语境。
- source_word: עַל הַמִּשְׁכָּן
  choice: 在帐幕上
  rationale: עַל表示云彩处于帐幕上方；מִשְׁכָּן在此特指旷野圣所，译作“帐幕”。
- source_word: יָמִים רַבִּים
  choice: 许多日子
  rationale: 贴近原文复数名词短语，并明确表达延续多日，而不笼统改写为“很久”。
- source_word: בְנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 原文字面为“以色列的众子”，在本段泛指以色列群体；“以色列人”是现代汉语中自然、准确的群体称谓，字面形式另见脚注。
- source_word: אֶת מִשְׁמֶרֶת יְהוָה
  choice: 雅威所交付的职守
  rationale: מִשְׁמֶרֶת可指应当谨守的职责、托付或规定；“所交付的职守”保留其责任与托付色彩，避免把它简化成单一命令。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语音译四字神名，保留原文所用的专名，而不以“主”这一称号替代。
- source_word: וְלֹא יִסָּעוּ
  choice: 不拔营出发
  rationale: נסע在旷野行程中指拔营启程；“拔营出发”清楚呈现其具体语境，胜过较宽泛的“不行路”。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用神的专名。译作“雅威”旨在保留专名性质，并采用较接近通常学术重构读音的现代汉语音译；不以称号“主”替代。
- issue: מִשְׁמֶרֶת יְהוָה 所表达的责任性质
  choice: 雅威所交付的职守
  alternative: 雅威的吩咐；雅威所规定的义务
  rationale: 此语既可强调必须遵守的规定，也可强调受托看守、履行的职责。正文采用“所交付的职守”以保留责任和托付的张力，不把它收窄为某一道明确口头命令。
- issue: בְנֵי יִשְׂרָאֵל 的群体指称
  choice: 以色列人
  alternative: 以色列的众子；以色列子民
  rationale: 本节指整个行营共同体，并非只突出男性后裔；正文用现代汉语自然的群体称谓，脚注保留原文的家族性字面表达。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“谨守”保留 שׁמר 的认真遵行意味；“拔营出发”使旷野行程的动作具体可见。句式以“若……就……”呈现本段按云彩停留情况而行动的条件性规律。
