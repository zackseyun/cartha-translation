  language: zh_hans
  text: 摩西就告诉以色列人，要守逾越节。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: 于是……吩咐
  rationale: 该动词基本义为“说、讲话”；在此语境中，摩西向以色列人传达应当举行逾越节的指示，用“吩咐”自然表达其言语行为与命令性质。“于是”承接上文叙事。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 字面为“以色列的众子”，在群体称谓中自然指全体以色列民；现代汉语通常译为“以色列人”。
- source_word: לַעֲשֹׂת
  choice: 守
  rationale: 字面为“做、举行”；与逾越节搭配时，汉语“守”能够涵盖按规定举行、遵守这一节期。
- source_word: הַפָּסַח
  choice: 逾越节
  rationale: 此处指以色列人按规定举行的逾越节礼仪或节期；采用现代中文圣经读者熟悉且准确的名称。
