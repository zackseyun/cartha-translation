  text: אֽוֹ יֹמַ֜יִם אוֹ חֹ֣דֶשׁ אוֹ יָמִ֗ים בְּ/הַאֲרִ֨יךְ הֶ/עָנָ֤ן עַל הַ/מִּשְׁכָּן֙ לִ/שְׁכֹּ֣ן עָלָ֔י/ו יַחֲנ֥וּ בְנֵֽי יִשְׂרָאֵ֖ל וְ/לֹ֣א יִסָּ֑עוּ וּ/בְ/הֵעָלֹת֖/וֹ יִסָּֽעוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/022.yaml
  text: Whether it was two days[a], or a month, or longer, when the cloud remained over the tabernacle, dwelling over it, the sons of Israel would camp and would not set out; but when it was lifted up, they would set out.
translation:
  language: zh_hans
  text: 或是两天，或是一个月，或是多日[a]；当云彩在帐幕上久停不去时，以色列人就安营，不起行；云彩升起时，他们就起行。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “多日”原文直译为“日子”；在此语境中指延长的一段时间。
    reason: 说明 יָמִים 的字面形式和语境功能；不把其具体解释为必然比“一个月”更久。
lexical_decisions:
- source_word: אֽוֹ ... אוֹ ... אוֹ
  choice: 或是……或是……或是……
  rationale: 保留原文反复出现的选择连词及其列举不同时长的结构，现代汉语也自然。
- source_word: יֹמַיִם
  choice: 两天
  rationale: 这是双数形式，明确指两天。
- source_word: חֹדֶשׁ
  choice: 一个月
  rationale: 在时长列举中用不定数量表达，译为“一个月”清楚自然。
- source_word: יָמִים
  choice: 更久
  rationale: 该词字面为“日子”，但继“两天”和“一个月”之后，在语境中指较长的一段时间；正文以“更久”传达其功能，脚注保留较直译的可能。
- source_word: בְּהַאֲרִיךְ הֶעָנָן
  choice: 只要云彩长久停在
  rationale: 使役词形在此表达云彩持续、延长停留的时间；“长久停在”既体现延续义，又适合汉语条件—惯常结果结构。
- source_word: הַמִּשְׁכָּן
  choice: 帐幕
  rationale: 这是民数记中以色列可移动圣所的惯用中文名称，简洁且为普通读者熟悉。
- source_word: לִשְׁכֹּן עָלָיו
  choice: 住在其上
  rationale: 较直接保留 שכן 的“居住、停驻”含义，也保留它与 מִשְׁכָּן 在原文中的词根呼应，虽在中文中无法完全重现该双关。
- source_word: יַחֲנוּ בְנֵי יִשְׂרָאֵל
  choice: 以色列人就安营
  rationale: 未完成式在此描述反复发生的惯常行动；“以色列人”是 בְנֵי יִשְׂרָאֵל 自然、准确且不制造性别误解的现代汉语表达。
- source_word: וְלֹא יִסָּעוּ
  choice: 不起行
  rationale: נסע 在旷野行程语境中指拔营出发；“起行”简明，并与后句重复形成鲜明对照。
- source_word: וּבְהֵעָלֹתוֹ
  choice: 云彩一升上去
  rationale: 原文形式可自然理解为云彩升起；译文不额外指定使云彩升起的施事者，并保留动作作为起行信号的作用。
theological_decisions:
- issue: 云彩升起的施事者是否明说
  choice: 不明说施事者，译作“云彩一升上去”
  alternative: “云彩一被收上去”
  rationale: 本节原文聚焦云彩升起这一信号，并未明说施事者；避免在译文中补入解释，有助于保存原文表达的开放性。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“安营／起行”与本段旷野行程语境一致；用“只要……就……”表达原文所述反复发生的规律。
