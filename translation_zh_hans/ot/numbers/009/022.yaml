revisions:
- from: 或是两天，或是一个月，或是更久[a]，只要云彩长久停在帐幕上，住在其上，以色列人就安营，不起行；云彩一升上去，他们就起行。
  to: 或是两天，或是一个月，或是多日[a]；当云彩在帐幕上久停不去时，以色列人就安营，不起行；云彩升起时，他们就起行。
  rationale: 修订以“多日”保留יָמִים的字面开放性，并将云彩持续停驻的表达整理为自然的现代汉语。“云彩升起时”保留原文未明说施事者的表达。其余关键术语维持不变。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T04:51:42Z'
review_pass:
  verdict: revise
  source_fidelity: “更久”将יָמִים处理为与前列时段相比较的“更长”，虽有英语审校轨迹支持，却比希伯来文“日子”的开放表达更具体；改为“多日”更贴近原文并保留其在语境中指延长时段的含义。“云彩一升上去”可不明说施事者，但“升上去”的口语和方向补充不如“升起时”稳妥。
  naturalness: “只要……就……”可表达惯常条件，但与“云彩长久停在帐幕上，住在其上”连用显得重复且“住在其上”指代生硬。改为“当云彩在帐幕上久停不去时”自然、庄重，也保留云彩持续停驻的意思。
  terminology: “帐幕”“以色列人”“安营”“起行”均符合本段旷野行程和现代中文圣经叙事的惯用语，可保留。
  issues:
