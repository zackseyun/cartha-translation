  text: וּ/לְ/פִ֞י הֵעָלֹ֤ת הֶֽ/עָנָן֙ מֵ/עַ֣ל הָ/אֹ֔הֶל וְ/אַ֣חֲרֵי כֵ֔ן יִסְע֖וּ בְּנֵ֣י יִשְׂרָאֵ֑ל וּ/בִ/מְק֗וֹם אֲשֶׁ֤ר יִשְׁכָּן שָׁם֙ הֶֽ/עָנָ֔ן שָׁ֥ם יַחֲנ֖וּ בְּנֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/017.yaml
  text: Whenever the cloud was lifted from over the tent[a], after that the sons of Israel would set out; and in the place where the cloud settled[b], there the sons of Israel would camp.
translation:
  language: zh_hans
  text: 每逢云彩从帐幕[a]上面升起，随后以色列人就起程；云彩停驻在哪里，以色列人就在哪里安营。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “帐幕”直译为“帐棚”，这里指会幕的帐棚。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְפִי הֵעָלֹת
  choice: 每逢……升起
  rationale: לְפִי与不定式连用，在本段反复启程、安营的语境中表示时间和惯常情形；“每逢”自然传达这种重复性。עלה在此描述云彩离开帐幕上方，“升起”既贴近字义，也符合现代汉语。
- source_word: הֶעָנָן
  choice: 云彩
  rationale: ענן在旷野引导的语境中指那朵特定的云；“云彩”是自然、庄重且通行的圣经用语。
- source_word: מֵעַל הָאֹהֶל
  choice: 从帐幕上面
  rationale: מֵעַל表达从某物上方离开；אֹהֶל字面为“帐棚”，但此处所指为会幕，因此正文采用现代读者更易明确理解的“帐幕”，并以脚注保留字面表达。
- source_word: וְאַחֲרֵי כֵן
  choice: 随后
  rationale: 该短语明确标示先后次序；“随后”简洁而完整地表达云彩升起之后百姓才起程。
- source_word: יִסְעוּ
  choice: 就起程
  rationale: 未完成式在上下文中具有反复、惯常意味；与“每逢……就……”搭配可在汉语中自然呈现这一迭代关系。“起程”准确表达拔营出发。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 希伯来语字面是“以色列的众子”，在此作为全体民族的常用称谓；现代汉语“以色列人”准确、自然，并涵盖全体百姓。
- source_word: וּבִמְקוֹם אֲשֶׁר יִשְׁכָּן שָׁם הֶעָנָן
  choice: 云彩停驻在哪里
  rationale: שׁכן可指居住、停留或驻留；用于云彩时，“停驻”既保留较“停下”更强的驻留意味，又避免将其过度人格化。汉语关系结构自然整合了原文“在……地方……那里”的表达。
- source_word: שָׁם ... שָׁם
  choice: 在哪里……就在哪里
  rationale: 原文重复“那里”，形成地点上的对应和强调；汉语“在哪里……就在哪里”自然保留这一对应结构。
- source_word: יַחֲנוּ
  choice: 就……安营
  rationale: 此未完成式同样表达反复惯常的行动；“安营”是现代汉语中准确而庄重的表达，“就”与前面的条件地点结构相应。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言，以“每逢……就……”和“在哪里……就在哪里……”呈现希伯来文的反复行动及对应结构。避免古奥的“拔营”“扎营于”等措辞。
