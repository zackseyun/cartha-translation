base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/023.yaml
  text: At the command of Yahweh they camped[a], and at the command of Yahweh they set out. They kept the charge of Yahweh at the command of Yahweh by the hand of Moses.
translation:
  language: zh_hans
  text: 他们照耶和华的命令安营，也照耶和华的命令起行。他们照耶和华借摩西之手[a]所传的命令，谨守耶和华所吩咐的事。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “借摩西之手”是希伯来语习语，意思是“借着摩西”或“由摩西传达”。
    reason: 解释“借……之手”的习语用法，表明命令出于耶和华，并经摩西传达。
lexical_decisions:
- source_word: עַל־פִּי
  choice: 照……的命令／遵照……所下的命令
  rationale: 这个短语直译为“在……口上”，在本节表示依照权威命令行事。译作“照……的命令”既自然，也保留三次重复所形成的强调。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 直接译出四字神名，并采用现代中文圣经读者最熟悉的形式。
- source_word: יַחֲנוּ
  choice: 安营
  rationale: 准确表达在旷野旅程中驻扎、设营的动作，也是自然易懂的现代中文用语。
- source_word: יִסָּעוּ
  choice: 起行
  rationale: 此处指拔营出发；“起行”简洁地突出启程，与“安营”形成清楚对应。
- source_word: מִשְׁמֶרֶת
  choice: 所交付的职分
  rationale: 该词指受托而应当看守、履行的责任；此译保留受托与顺服两层含义，避免仅译成泛泛的“责任”。
- source_word: שָׁמָרוּ
  choice: 谨守
  rationale: 该动词兼有看守、持守和遵行之意；与“所交付的职分”搭配时，“谨守”能体现认真履行受托之事。
- source_word: בְּיַד מֹשֶׁה
  choice: 借摩西之手
  rationale: 保留希伯来文“借……之手”的具体意象，同时表达摩西作为传达者或中介的作用；脚注说明其惯用含义。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名；正文不以“主”替代，而采用中文读者广泛熟悉的专名“耶和华”。
- issue: בְּיַד מֹשֶׁה 所表达的中介关系
  choice: 保留“借摩西之手”的意象
  alternative: 意译为“借着摩西”或“由摩西传达”
  rationale: 原文既明确命令源于耶和华，也说明命令经摩西传达。保留“手”的意象，不把摩西误写成命令的最终来源；脚注则帮助现代读者理解这一习语。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“安营／起行”形成平衡对应，并保留原文三次提到耶和华命令的强调。“职分”在此指受托而必须谨守的责任，不限于现代职业或宗教职位。
