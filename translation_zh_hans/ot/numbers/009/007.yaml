  text: וַ֠/יֹּאמְרוּ הָ/אֲנָשִׁ֤ים הָ/הֵ֨מָּה֙ אֵלָ֔י/ו אֲנַ֥חְנוּ טְמֵאִ֖ים לְ/נֶ֣פֶשׁ אָדָ֑ם לָ֣/מָּה נִגָּרַ֗ע לְ/בִלְתִּ֨י הַקְרִ֜ב אֶת קָרְבַּ֤ן יְהוָה֙ בְּ/מֹ֣עֲד֔/וֹ בְּ/ת֖וֹךְ בְּנֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/007.yaml
  text: And those men said to him[a], “We are unclean by a human corpse[c][b]. Why should we be kept from presenting the offering of Yahweh at its appointed time among the sons of Israel?”
translation:
  language: zh_hans
  text: 那些人对他说：“我们因接触人的尸体而不洁[a]。为什么我们要被排除[b]，不能在规定的时间，在以色列人当中献上耶和华的祭物呢？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译近似“因人的生命而不洁”；这是礼仪律法中的惯用说法，指因接触人的尸体而不洁。
    reason: 说明 לְנֶפֶשׁ אָדָם 的字面形式及其在本处指尸体不洁的惯用含义。
  - marker: b
    text: “被排除”也可译作“被阻止”或“被剥夺资格”。
    reason: 保留 נִגָּרַע 在此处“被扣除、被排除于参与之外”的语义幅度。
lexical_decisions:
- source_word: וַיֹּאמְרוּ הָאֲנָשִׁים הָהֵמָּה אֵלָיו
  choice: 那些人对他说
  rationale: 按希伯来叙事句法自然表达；指示语 הָהֵמָּה 译为“那些”，אֵלָיו 依上下文译为“对他说”。
- source_word: טְמֵאִים
  choice: 不洁
  rationale: 这里指礼仪层面的不洁，“不洁”是现代中文圣经语境中清楚而准确的表达。
- source_word: לְנֶפֶשׁ אָדָם
  choice: 因接触人的尸体
  rationale: 该短语在祭司礼仪语境中是因尸体而沾染不洁的惯用说法；补出“接触”可让现代读者明白其含义，但不把它误解为一般性的死亡关联。
- source_word: נִגָּרַע לְבִלְתִּי הַקְרִב
  choice: 被排除，不能……献上
  rationale: נִגָּרַע 的尼法勒形式在此表达被剥夺或排除于参与之外，后接不定式结构说明不能做的事。
- source_word: קָרְבַּן יְהוָה
  choice: 耶和华的供物
  rationale: קָרְבָּן 指献给上帝的祭礼供物；中文以“供物”保留其名词性质，并将四字神名按中文通行形式译为“耶和华”。
- source_word: בְּמֹעֲדוֹ
  choice: 在指定的时间
  rationale: מוֹעֵד 在这里指按规例确定的逾越节献祭时间。
- source_word: בְּתוֹךְ בְּנֵי יִשְׂרָאֵל
  choice: 和以色列人一起
  rationale: בְּתוֹךְ 表示在群体当中；בְּנֵי יִשְׂרָאֵל 是民族称谓，现代汉语自然译为“以色列人”。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用四字神名。中文正文采用读者最熟悉且能明确作为专名的“耶和华”；“雅威”是较接近现代学术重构发音的另一译法。
- issue: 尸体不洁的表达
  choice: 因接触人的尸体而不洁
  alternative: 因人的尸体而不洁
  rationale: 原文的 לְנֶפֶשׁ אָדָם 是礼仪法律惯语。正文明确其实际所指的尸体接触，同时脚注保留原文较直译的形式，避免把“不洁”理解为道德罪责。
- issue: נִגָּרַע 所表达的诉求
  choice: 为什么我们要被排除
  alternative: 为什么我们要被阻止
  rationale: 该动词可强调被扣除、被剥夺或被排除。译文保留他们质问为何不能参与献祭的语气，不预先判断其要求是否应获准。
translation_notes:
  register: 采用现代、庄重而口语可懂的普通话。“指定的时间”清楚表达礼仪规定的固定日期；问句保留当事人申诉和请求裁决的力度。所有脚注标记均置于正文相应位置。
