  yaml_path: translation/ot/numbers/009/002.yaml
  text: And let the sons of Israel keep the Passover at its appointed time[a].
translation:
  language: zh_hans
  text: 以色列人[a]要在所定的时候守逾越节。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译“以色列的众子”，传统上也译作“以色列子孙”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיַעֲשׂוּ
  choice: 要……守
  rationale: עָשָׂה本义为“做、行”，以“逾越节”为宾语时，惯用义是“守、举行”。结合上下文，未完成式在此表达命令语气；“要……守”既自然，也保留礼仪性命令的意味。词首וְ承接上文，在现代汉语中无需机械译作“并且”。
- source_word: בְנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 该短语字面为“以色列的众子”，在这里作为以色列民族的集体称谓。“以色列人”是现代汉语中自然、准确的表达；字面形式另以脚注说明。
- source_word: הַפָּסַח
  choice: 逾越节
  rationale: פֶּסַח在此可泛指逾越节的遵守，也可能涵盖逾越节祭物；“逾越节”保留原词在本节中的宽泛所指，不擅自缩窄为祭物或节期活动。
- source_word: בְּמוֹעֲדוֹ
  choice: 按指定的日期
  rationale: מוֹעֵד表示指定的时间、节期；第三人称单数后缀指逾越节。“按指定的日期”自然地传达其规定的历法日期和遵守要求。
