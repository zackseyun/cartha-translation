  text: On the fourteenth day of this month[a], between the evenings, you shall keep it at its appointed time; according to all its statutes and according to all its ordinances you shall keep it.
translation:
  language: zh_hans
  text: 本月十四日，黄昏之间[a]，你们要在所定的时间守逾越节；要照逾越节的一切律例和一切典章守逾越节。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “黄昏之间”直译希伯来语的传统时间表达，大致指黄昏前后；其确切范围有不同理解。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּאַרְבָּעָה עָשָׂר יוֹם בַּחֹדֶשׁ הַזֶּה
  choice: 这个月十四日
  rationale: 按现代汉语自然表达日期，准确保留具体日子。
- source_word: בֵּין הָעַרְבַּיִם
  choice: 在两晚之间
  rationale: 这是与逾越节时间有关的希伯来语固定表达，其确切时段存在解释空间；正文保留原文形式，脚注说明大意。
- source_word: תַּעֲשׂוּ אֹתוֹ
  choice: 守逾越节／守节
  rationale: עשה以逾越节为宾语时指举行、遵守这一节期；译出隐含对象比直译“行它”自然，并在句末避免累赘。
- source_word: בְּמוֹעֲדוֹ
  choice: 在指定的时间
  rationale: מוֹעֵד在礼仪历法语境中指规定、指定的时刻。
- source_word: כְּכָל חֻקֹּתָיו
  choice: 照这一节期的一切律例
  rationale: חֻקּוֹת指制定的规例；代词所指在汉语中明示为“这一节期”，使句意清楚。
- source_word: וּכְכָל מִשְׁפָּטָיו
  choice: 和一切典章
  rationale: מִשְׁפָּטִים在律法和礼仪语境中指具有规范性的条例；用“典章”与“律例”相区别。
