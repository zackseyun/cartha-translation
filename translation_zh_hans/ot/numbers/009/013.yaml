id: NUM.9.13
reference: Numbers 9:13
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/הָ/אִישׁ֩ אֲשֶׁר ה֨וּא טָה֜וֹר וּ/בְ/דֶ֣רֶךְ לֹא הָיָ֗ה וְ/חָדַל֙ לַ/עֲשׂ֣וֹת הַ/פֶּ֔סַח וְ/נִכְרְתָ֛ה הַ/נֶּ֥פֶשׁ הַ/הִ֖וא מֵֽ/עַמֶּ֑י/הָ כִּ֣י קָרְבַּ֣ן יְהוָ֗ה לֹ֤א הִקְרִיב֙ בְּ/מֹ֣עֲד֔/וֹ חֶטְא֥/וֹ יִשָּׂ֖א הָ/אִ֥ישׁ הַ/הֽוּא־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/013.yaml
  text: But the man who is clean and is not on a journey[a], yet fails to keep the Passover—that person shall be cut off from his people, because he did not present Yahweh’s offering at its appointed time[b]; that man shall bear his sin.
translation:
  language: zh_hans
  text: 但那人若是洁净的，又不在旅途中，却不守逾越节，那人就要从他的族人中被剪除[a]；因为他没有在所定的时候献上雅威的供物；那人要担当自己的罪[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “被剪除”是希伯来语的惯用说法，表示严厉的盟约审判；本节没有具体说明这种惩罚如何执行。
    reason: 保留原文法律惯用语的含混性，避免武断解释为逐出或处死。
  - marker: b
    text: 或译：“担当自己的罪责。”
    reason: חֶטְאוֹ יִשָּׂא可侧重担当罪，也可侧重承担罪责及其后果。
lexical_decisions:
- source_word: טָהוֹר
  choice: 洁净的
  rationale: 这里指礼仪上的洁净，而非泛指道德纯洁；“洁净”准确保留祭仪语境。
- source_word: וּבְדֶרֶךְ לֹא הָיָה
  choice: 不在旅途中
  rationale: 与上下文中因远行而获准延期的情形相对；此译自然表达当事人并未因旅行而缺席。
- source_word: וְחָדַל לַעֲשׂוֹת הַפֶּסַח
  choice: 却不守逾越节
  rationale: חָדַל 表示停止、避而不做或未去做；与“行逾越节”连用时，“不守逾越节”简明而保留有意未履行的含义。
- source_word: וְנִכְרְתָה הַנֶּפֶשׁ הַהִוא
  choice: 那人就要……被剪除
  rationale: נֶפֶשׁ 在此指当事人；“被剪除”保留希伯来语严厉的盟约与司法惯用语，不擅自限定执行方式。
- source_word: מֵעַמֶּיהָ
  choice: 从自己的族人中
  rationale: 阴性后缀在语法上呼应 נֶפֶשׁ，实际所指仍是前述男子；“族人”比单纯“人民”更能体现其所属群体。
- source_word: קָרְבַּן יְהוָה
  choice: 雅威的供物
  rationale: קָרְבָּן 是带到神面前的供物；以“供物”保留其概括性，不缩窄为某一种祭。神名 יהוה 音译为“雅威”，保留专名。
- source_word: בְּמֹעֲדוֹ
  choice: 在指定的时间
  rationale: מוֹעֵד 在此指为逾越节规定的固定时间；“指定的时间”清楚自然。
- source_word: חֶטְאוֹ יִשָּׂא
  choice: 要担当自己的罪
  rationale: 直译保留“担当罪”的圣经惯用表达，其中可兼含罪责及其后果，不单一化为“受罚”或“担当罪责”。
theological_decisions:
- issue: “被剪除”的具体惩罚含义
  choice: 保留“从自己的族人中被剪除”这一惯用语
  alternative: 译作“被逐出群体”或“被处死”
  rationale: 本节没有明确说明这是死亡、逐出、绝嗣还是神亲自施行的审判；保留原文表达可避免消解其法律与神学张力。
- issue: “担当自己的罪”的范围
  choice: 保留“担当自己的罪”
  alternative: 译作“担当自己的罪责”
  rationale: 原文 חֵטְא 可指罪，也可在该惯用语中涉及罪责和后果；正文采用较形式对应的译法，脚注提示另一种理解。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“逾越节”“洁净”“供物”等保持经文祭仪语域；句法尽量贴近希伯来文的条件、判罚与理由结构，同时避免生硬欧化。
