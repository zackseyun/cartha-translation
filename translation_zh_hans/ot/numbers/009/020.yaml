  text: וְ/יֵ֞שׁ אֲשֶׁ֨ר יִהְיֶ֧ה הֶֽ/עָנָ֛ן יָמִ֥ים מִסְפָּ֖ר עַל הַ/מִּשְׁכָּ֑ן עַל פִּ֤י יְהוָה֙ יַחֲנ֔וּ וְ/עַל פִּ֥י יְהוָ֖ה יִסָּֽעוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/020.yaml
  text: Sometimes the cloud would remain over the tabernacle for a number of days; at the command of Yahweh they would camp[a], and at the command of Yahweh they would set out.
translation:
  language: zh_hans
  text: 有时，云彩在帐幕上方停留数日；他们就照雅威的吩咐[a]安营，也照雅威的吩咐起行。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“照雅威的口”，意思是照雅威的命令。
    reason: 说明 עַל־פִּי 的字面表达及其在语境中的含义。
lexical_decisions:
- source_word: וְיֵשׁ אֲשֶׁר
  choice: 有时
  rationale: 这一习语在一连串不同情形中引出其中一种情况；“有时”简洁自然地表达“有些时候”。
- source_word: יִהְיֶה הֶעָנָן
  choice: 云彩……停留
  rationale: 此处 היה 表示云彩持续处于帐幕上方，而不只是存在；“停留”准确体现延续状态。
- source_word: יָמִים מִסְפָּר
  choice: 数日
  rationale: 原文意为有限数目的日子；“数日”既保留未明确的天数，也符合庄重、自然的现代汉语。
- source_word: עַל הַמִּשְׁכָּן
  choice: 在帐幕上
  rationale: מִשְׁכָּן 指旷野中的圣所帐幕；介词短语表示云彩位于其上方。
- source_word: עַל פִּי יְהוָה
  choice: 照雅威的吩咐
  rationale: 该习语字面为“照雅威的口”，在本语境中指按雅威所发的命令行动；正文采用自然汉语，脚注保留其字面形象。
- source_word: יַחֲנוּ
  choice: 安营
  rationale: 未完成式在此描述反复或惯常的行动；“安营”是现代汉语中准确且自然的旅行语汇。
- source_word: יִסָּעוּ
  choice: 起行
  rationale: נסע 在旷野行程中常指拔营出发；“起行”与“安营”形成清楚对应。
- source_word: יְהוָה
  choice: 雅威
  rationale: 原文直接使用四字神名；“雅威”以通行的现代汉语音译保留其作为专名的性质。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文是神的专名而非称号；采用“雅威”保留专名，并避免以“主”替代。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“数日”保留原文未具体说明天数的含义；“安营／起行”形成简洁对举。
