  text: לֹֽא יַשְׁאִ֤ירוּ מִמֶּ֨/נּוּ֙ עַד בֹּ֔קֶר וְ/עֶ֖צֶם לֹ֣א יִשְׁבְּרוּ ב֑/וֹ כְּ/כָל חֻקַּ֥ת הַ/פֶּ֖סַח יַעֲשׂ֥וּ אֹתֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/012.yaml
  text: They shall leave none of it until morning[a], and they shall not break a bone of it[b]; according to all the statute of the Passover they shall keep it.
translation:
  language: zh_hans
  text: 一点也不可留到早晨；它的骨头一根也不可折断。[a]要照逾越节的一切律例来守逾越节。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 不可折断骨头的规定也见《出埃及记》12:46。
    reason: cross_reference
lexical_decisions:
- source_word: יַשְׁאִירוּ מִמֶּנּוּ עַד בֹּקֶר
  choice: 一点也不可留到早晨
  rationale: יַשְׁאִירוּ是使役形，表示“留下、使剩下”；מִמֶּנּוּ具有部分义。合译为“一点也不可留到早晨”，自然表达禁令及其时间界限。
- source_word: וְעֶצֶם לֹא יִשְׁבְּרוּ בוֹ
  choice: 它的骨头一根也不可折断
  rationale: עֶצֶם虽为单数，却可作分配性用法；בוֹ在此表示与逾越节祭牲相关的所属或范围。译文保留“一根也不可”的全面禁止意味，同时符合现代汉语。
- source_word: כְּכָל חֻקַּת הַפֶּסַח
  choice: 照逾越节的一切律例
  rationale: חֻקָּה指规定、律例；单数与כָּל连用，表示有关逾越节的整套规定。“一切律例”在汉语中自然传达其集合意义。
- source_word: יַעֲשׂוּ אֹתוֹ
  choice: 守这节
  rationale: עשה与节期或礼仪连用时可指遵守、举行。此处代词所指可涵盖逾越节礼仪；“守这节”简明自然，也避免生硬的“做它”。
theological_decisions:
- issue: 不可折断骨头这一规定的经文间意义
  choice: 正文仅按本处语境直译为逾越节的规定，并以脚注指出《出埃及记》中的平行规定。
  alternative: 在正文中采用刻意凸显后续基督论应验的措辞。
  rationale: 本节直接语境是在规定如何守逾越节。后来的经文联系不应被预先写入正文，以免超出希伯来文本；但可用交叉参照帮助读者看见经文联系。
translation_notes:
  register: 采用现代、庄重而易懂的规范汉语。以“一点也不可”和“一根也不可”形成平衡句式；“守这节”明确表达礼仪遵行。英文材料中脚注标记与脚注内容似有错位：其脚注a所谓替代译法实际对应骨头分句，而非“留到早晨”；本稿依据希伯来原文，仅保留有实际信息的交叉参照脚注，并将标记置于相应分句后。
