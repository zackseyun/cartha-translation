  text: בַּ/חֹ֨דֶשׁ הַ/שֵּׁנִ֜י בְּ/אַרְבָּעָ֨ה עָשָׂ֥ר י֛וֹם בֵּ֥ין הָ/עַרְבַּ֖יִם יַעֲשׂ֣וּ אֹת֑/וֹ עַל מַצּ֥וֹת וּ/מְרֹרִ֖ים יֹאכְלֻֽ/הוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/011.yaml
  text: In the second month[a], on the fourteenth day at twilight, they shall keep it; they shall eat it with unleavened bread and bitter herbs.
translation:
  language: zh_hans
  text: 第二个月十四日黄昏的时候[a]，他们要守这逾越节；要和无酵饼、苦菜一同吃逾越节的祭牲。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “黄昏的时候”，希伯来文直译为“两个黄昏之间”，指日落前后的时段。
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּחֹדֶשׁ הַשֵּׁנִי
  choice: 第二个月
  rationale: חֹדֶשׁ在历法语境中通常指“月”；这里是明确的日期表达。
- source_word: בְּאַרְבָּעָה עָשָׂר יוֹם
  choice: 十四日
  rationale: 希伯来语用基数词加“日”表示日期；现代汉语自然表达为“十四日”。
- source_word: בֵּין הָעַרְבַּיִם
  choice: 黄昏的时候
  rationale: 该习语指日落前后、暮色降临的时段；正文采用自然清楚的汉语，直译另见脚注。
- source_word: יַעֲשׂוּ אֹתוֹ
  choice: 他们要守这逾越节
  rationale: 在逾越节语境中，עשה加所指为逾越节的宾语，意为举行、遵守，而非泛指“做”；补出“逾越节”可明确代词所指。
- source_word: עַל מַצּוֹת וּמְרֹרִים
  choice: 和无酵饼、苦菜一同
  rationale: עַל在进食语境中表达伴随；מַצּוֹת是无酵饼，מְרֹרִים在此指苦菜。
- source_word: יֹאכְלֻהוּ
  choice: 吃逾越节的祭牲
  rationale: 动词后缀所指与前面的逾越节祭牲相关。为避免汉语中“吃逾越节”的误解，明确译出隐含对象，同时不限定祭牲的具体部位。
theological_decisions:
- issue: 两个阳性单数宾语后缀אֹתוֹ和יֹאכְלֻהוּ的所指
  choice: 前者译为“这逾越节”，后者译为“逾越节的祭牲”
  alternative: 两处都译作“它”
  rationale: “守”所指的是逾越节礼仪，而“吃”所指的是逾越节祭牲；原文借上下文维持关联，汉语若均用“它”则不够自然且容易误解。此处理仅显明上下文所指，不加入特定宗派解释。
translation_notes:
  register: 采用现代、庄重而易懂的法令性表达。“要”体现未完成式在律例语境中的命令义；保留日期和礼仪动作的简洁结构。
