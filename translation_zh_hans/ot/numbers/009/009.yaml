base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/009.yaml
  text: Then Yahweh spoke to Moses[a], saying,
translation:
  language: zh_hans
  text: 雅威[a]对摩西说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文为 YHWH（יהוה），即神的专名；中文传统常译作“耶和华”。
    reason: 说明正文“雅威”所对应的四字神名，并提示传统中文译名。
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: 说
  rationale: 该形式承接并推进叙事；现代汉语在独立经节中无需机械译出“于是/又”。与后面的 לֵאמֹר 合并为自然的引语引介公式“对……说”。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经传统中最通行的专名形式，并以脚注说明其对应希伯来文四字神名 YHWH。
- source_word: אֶל־מֹשֶׁה
  choice: 对摩西
  rationale: 自然、准确地表达说话的对象。
- source_word: לֵאמֹר
  choice: 说
  rationale: 这是引出下文直接话语的固定公式；汉语与 וַיְדַבֵּר 合译为“对摩西说”，避免生硬重复。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用神的专名 YHWH，而非“主”这一称号。正文采用普通中文读者最熟悉的“耶和华”，脚注保留原文形式，既不以称号替代专名，也不把学界对古代读音的重构说成完全确定。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。“耶和华对摩西说”是中文叙事中自然的引语引介方式；冒号表明下文将接所说的内容。脚注标记置于正文中。
