source:
  edition: WLC
  text: וַ/יַּעֲשׂ֣וּ אֶת הַ/פֶּ֡סַח בָּ/רִאשׁ֡וֹן בְּ/אַרְבָּעָה֩ עָשָׂ֨ר י֥וֹם לַ/חֹ֛דֶשׁ בֵּ֥ין הָ/עַרְבַּ֖יִם בְּ/מִדְבַּ֣ר סִינָ֑י כְּ֠/כֹל אֲשֶׁ֨ר צִוָּ֤ה יְהוָה֙ אֶת מֹשֶׁ֔ה כֵּ֥ן עָשׂ֖וּ בְּנֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/005.yaml
  text: So they kept the Passover in the first month[a], on the fourteenth day of the month at twilight, in the wilderness of Sinai; according to all that Yahweh had commanded Moses, so the sons of Israel did.
translation:
  language: zh_hans
  text: 他们在正月十四日黄昏[a]，在西奈旷野守了逾越节。以色列子孙就照着雅威所吩咐摩西的一切去做了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译“在两个傍晚之间”，是指黄昏时分。
    reason: 保留 בֵּין הָעַרְבַּיִם 的字面形式及其习语含义。
lexical_decisions:
- source_word: וַיַּעֲשׂוּ / עָשׂוּ
  choice: 守／做了
  rationale: עָשָׂה与“逾越节”连用时表示遵守、举行该礼仪，译作“守”符合现代汉语习惯；末句仍译作“做了”，保留原文首尾动词的呼应。
- source_word: הַפֶּסַח
  choice: 逾越节
  rationale: 本节语境指整个逾越节礼仪，而不只限于祭牲；“守逾越节”能自然表达这一整体含义。
- source_word: בָּרִאשׁוֹן
  choice: 正月
  rationale: 原文直称“第一〔月〕”；在以色列历法日期语境中，“正月”简明自然，也补出了希伯来文省略但语义明确的“月”。
- source_word: בְּאַרְבָּעָה עָשָׂר יוֹם לַחֹדֶשׁ
  choice: 十四日
  rationale: 与“正月”合成现代汉语标准日期表达“正月十四日”，准确反映原文。
- source_word: בֵּין הָעַרְבַּיִם
  choice: 黄昏
  rationale: 该希伯来语习语字面为“两个傍晚之间”，指黄昏时段；正文采用自然译法，字面形式收入脚注。
- source_word: בְּמִדְבַּר סִינָי
  choice: 在西奈旷野
  rationale: מִדְבָּר指荒野或旷野；“西奈旷野”是清楚、庄重且贴近原文的表达。
- source_word: כְּכֹל אֲשֶׁר
  choice: 照……的一切
  rationale: 保留“全部、无一遗漏”的强调，说明他们完全依照所领受的命令而行。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以中文音译呈现四字神名，而不以称号代替，保留原文使用专名的特点。
- source_word: צִוָּה
  choice: 吩咐
  rationale: “吩咐”在现代汉语中自然表达上位者所发的命令，也适合庄重的经文语体；上下文已清楚表明命令先于执行，无须另加时态词。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列众子
  rationale: 保留原文“以色列的众子”这一明确的父系群体称谓，同时用“众”显出其集体含义。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”较直接对应通常重构的读音 Yahweh，并避免把专名改为“主”等称号。
- issue: 群体称谓 בְּנֵי יִשְׂרָאֵל 的译法
  choice: 以色列众子
  alternative: 以色列人
  rationale: 原文形式明确是“以色列的众子”，因此正文保留其亲属与男性语法意象；同时“众子”在这里是对立约群体的集体称呼。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。正文按汉语习惯重组日期和地点成分；用“守逾越节”表达礼仪语义，并在末句保留“做了”以呼应原文重复的 עָשָׂה。
