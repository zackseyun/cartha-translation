  text: עַל פִּ֣י יְהוָ֗ה יִסְעוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל וְ/עַל פִּ֥י יְהוָ֖ה יַחֲנ֑וּ כָּל יְמֵ֗י אֲשֶׁ֨ר יִשְׁכֹּ֧ן הֶ/עָנָ֛ן עַל הַ/מִּשְׁכָּ֖ן יַחֲנֽוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/018.yaml
  text: At the command of Yahweh the sons of Israel set out[a], and at the command of Yahweh they camped. All the days that the cloud remained over the tabernacle, they remained camped.
translation:
  language: zh_hans
  text: 以色列人照雅威的吩咐[a]起行，也照雅威的吩咐安营。云彩停留在帐幕上的日子，他们都安营不动。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “照雅威的吩咐”原文直译为“照雅威的口”，是“遵照雅威命令”的习语。
    reason: 说明希伯来语习语的字面形式及其语境含义。
lexical_decisions:
- source_word: עַל פִּי יְהוָה
  choice: 照雅威的吩咐
  rationale: עַל־פִּי 字面为“照……的口”，在这里是表示依照权威命令的习语。“照雅威的吩咐”既准确传达含义，也符合现代汉语表达。
- source_word: יִסְעוּ
  choice: 起行
  rationale: נסע 在旷野行程语境中指拔营出发；“起行”简洁庄重，并与下文“安营”形成自然对应。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 希伯来语字面为“以色列的众子”，但此处指以色列全体民众；“以色列人”在现代汉语中自然、准确，也不会误解为仅指男性。
- source_word: יַחֲנוּ
  choice: 安营／安营不动
  rationale: חנה 的基本义是安营。末句处在持续时间结构中，因此用“安营不动”自然表达他们在云彩停留期间持续驻营的意思。
- source_word: כָּל יְמֵי אֲשֶׁר
  choice: 只要……就……
  rationale: 该短语标示整个持续期间。汉语条件—持续结构“只要……就……”自然传达“在……所有日子里”的时间关系。
- source_word: יִשְׁכֹּן
  choice: 停留
  rationale: שׁכן 可指居住、驻留；以云彩为主语时，“停留”最符合现代汉语，并保留其持续存在的含义。
- source_word: הַמִּשְׁכָּן
  choice: 帐幕
  rationale: מִשְׁכָּן 是神圣的居所，即会幕建筑；“帐幕”简明且能与 אֹהֶל מוֹעֵד（会幕）保持词语区别。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华／上主
  rationale: 原文直接使用四字神名。采用“雅威”作为较贴近学界通行重构的音译，保留专名性质，不以称号替代。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“起行／安营”保留旷野行程的经文用语；末句使用“只要……就……”清楚表达云彩停留与百姓驻营之间持续对应的关系。
