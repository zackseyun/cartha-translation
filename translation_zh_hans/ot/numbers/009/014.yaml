base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/014.yaml
  text: And if a sojourner is staying with you and would keep the Passover to Yahweh[a], he shall do it according to the statute of the Passover and according to its ordinance; so he shall do it. One statute shall be for you, for the sojourner[c][b], and for the native of the land.
translation:
  language: zh_hans
  text: 若有寄居者住在你们中间，为雅威守逾越节[a]，他就要按照逾越节的律例和规例来守。你们、寄居者[b]和本地人[c]都要遵守同一条律例。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“举行（或做）逾越节”，这是指遵守、举行逾越节礼仪的惯用说法。
    reason: lexical_alternative
  - marker: b
    text: “寄居者”指住在以色列人中间的外来居民，不只是暂时路过的陌生人。也可译作“外来居民”。
    reason: lexical_alternative
  - marker: c
    text: “本地人”也可译作“本地出生的人”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: 如果
  rationale: 引出与上文相连的条件情形；现代汉语用“如果”已足以自然表达这种承接关系。
- source_word: יָגוּר ... גֵּר
  choice: 有寄居者住在你们中间
  rationale: גֵּר指住在以色列群体中的外来居民，并非短暂停留的旅客；“寄居者”保留其法律和社会身份色彩。动词יָגוּר译作“住在……中间”，自然表达居住状态。
- source_word: וְעָשָׂה פֶסַח
  choice: 愿意……守逾越节
  rationale: “做／举行逾越节”是指遵守逾越节礼仪。“守逾越节”是现代中文清楚而庄重的惯用表达；结合条件句，译作“愿意……守”表达其有意举行这一礼仪，而不把动词误解为单指献祭。
- source_word: לַיהוָה
  choice: 为雅威
  rationale: 介词表示这一礼仪是归给、献给雅威的；“为雅威”在中文中自然地保留奉献和指向。
- source_word: כְּחֻקַּת הַפֶּסַח
  choice: 按照逾越节的律例
  rationale: חֻקָּה指规定下来的法则或条例；“律例”保留礼仪法规的正式语气。
- source_word: וּכְמִשְׁפָּטוֹ
  choice: 和规例
  rationale: מִשְׁפָּט在此指有关礼仪的规则或规范。“规例”既与“律例”有所区分，也保留两词意义上的重叠，不将其过度具体化为某一种程序。
- source_word: כֵּן יַעֲשֶׂה
  choice: 他就要……来守
  rationale: 将希伯来文“他要如此行”融入前句，既保留命令意味，也使中文避免生硬重复。
- source_word: חֻקָּה אַחַת יִהְיֶה לָכֶם
  choice: 都要遵守同一条律例
  rationale: “同一条律例”明确表达只有一个共同适用的规定；“都要遵守”以自然中文传达法律约束力。
- source_word: וּלְאֶזְרַח הָאָרֶץ
  choice: 和本地人
  rationale: אֶזְרַח与גֵּר相对，指本地出生或本土所属的人；“本地人”避免引入现代“公民”概念。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名。译作“雅威”以音译方式保留其作为圣约之神专名的性质，不用称号替代。
- issue: 逾越节规定对寄居者与本地人的适用范围
  choice: 译明三类表述都遵守同一条律例，但不把结论扩展到本节以外
  alternative: 将此句概括为寄居者与以色列人在所有法律上完全相同
  rationale: 原文明说“一条律例”适用于“你们、寄居者和本地人”；上下文直接涉及逾越节礼仪，因此译文保留此处的平等适用，同时不增添更广泛的法律或神学结论。
- issue: חֻקָּה与מִשְׁפָּט的关系
  choice: 分别译作“律例”和“规例”
  alternative: 合并译作“各项规定”；分别译作“律例”和“法则”
  rationale: 原文并列两个近义法律礼仪用语。分别翻译可保留措辞上的张力和重复，又不武断规定二者存在严格的技术性区别。
translation_notes:
  register: 采用现代、庄重而易懂的法规语体。“按照……来守”和“都要遵守同一条律例”使句法符合现代普通话，同时保留原文的条件结构、礼仪命令和共同适用的法律重点。
