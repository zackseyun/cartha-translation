id: NUM.9.1
reference: Numbers 9:1
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יְדַבֵּ֣ר יְהוָ֣ה אֶל מֹשֶׁ֣ה בְ/מִדְבַּר סִ֠ינַי בַּ/שָּׁנָ֨ה הַ/שֵּׁנִ֜ית לְ/צֵאתָ֨/ם מֵ/אֶ֧רֶץ מִצְרַ֛יִם בַּ/חֹ֥דֶשׁ הָ/רִאשׁ֖וֹן לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/001.yaml
  text: And Yahweh spoke to Moses in the wilderness of Sinai[a], in the second year after they came out of the land of Egypt, in the first month, saying,
translation:
  language: zh_hans
  text: 他们出埃及地后的第二年正月，雅威在西奈旷野[a]对摩西说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“西奈荒漠”。
    reason: מִדְבָּר 可指旷野，也可按地貌语感译为荒漠。
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: 说
  rationale: 该叙事动词推进事件，并引出下一节的直接话语；现代汉语用“对摩西说”自然、准确，无须另译连接词 וַ。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文四字神名作音译，以保留其作为上帝专名的性质，不以称号替代。
- source_word: אֶל מֹשֶׁה
  choice: 对摩西
  rationale: 介词 אֶל 与说话动词连用，标明话语的对象；“对摩西”符合现代汉语表达。
- source_word: בְּמִדְבַּר סִינַי
  choice: 在西奈旷野
  rationale: מִדְבָּר 指人烟稀少的荒野或干旱地带；“西奈旷野”既保留地名修饰关系，也符合庄重自然的中文圣经语体。
- source_word: בַּשָּׁנָה הַשֵּׁנִית לְצֵאתָם מֵאֶרֶץ מִצְרַיִם
  choice: 他们出埃及地后第二年
  rationale: 将带后缀的不定式结构 לְצֵאתָם 译作时间基准“他们……后”，保留原文第三人称复数，不擅自补明其所指；“埃及地”对应 אֶרֶץ מִצְרַיִם。
- source_word: בַּחֹדֶשׁ הָרִאשׁוֹן
  choice: 正月
  rationale: 这里指历法中的第一个月；“正月”是现代汉语对一年首月的简洁自然说法，并与“第二年”顺畅衔接。
- source_word: לֵאמֹר
  choice: 说：
  rationale: 该形式引出随后话语的内容；中文以“说”及冒号表达这一衔接，比直译为分词更自然。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名。译作“雅威”较贴近通常重构的读音 Yahweh，并明确保留专名；“耶和华”是传统中文形式，但其音形来自较晚的混合读法。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。为使中文时间关系清晰，将两个时间短语前置；保留“他们”而不补作“以色列人”，避免加入本节原文未明说的名词。冒号表明话语内容在下一节继续。
