source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יְהוָה֮ אֶל מֹשֶׁ֣ה וְ/אֶֽל אַהֲרֹן֒ יַ֚עַן לֹא הֶאֱמַנְתֶּ֣ם בִּ֔/י לְ/הַ֨קְדִּישֵׁ֔/נִי לְ/עֵינֵ֖י בְּנֵ֣י יִשְׂרָאֵ֑ל לָ/כֵ֗ן לֹ֤א תָבִ֨יאוּ֙ אֶת הַ/קָּהָ֣ל הַ/זֶּ֔ה אֶל הָ/אָ֖רֶץ אֲשֶׁר נָתַ֥תִּי לָ/הֶֽם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/012.yaml
  text: And Yahweh said to Moses and to Aaron[a], “Because you did not believe me, to treat me as holy before the eyes of the sons of Israel[c][b], therefore you shall not bring this assembly into the land that I have given them.”
translation:
  language: zh_hans
  text: 耶和华对摩西和亚伦说：“因为你们不信靠我[a]，没有在以色列人眼前尊我为圣[b]，所以你们必不得领这会众进入我赐给他们的那片土地。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“相信我”。原文动词兼有相信和信赖的含义。
    reason: lexical_alternative
  - marker: b
    text: 或译：“显明我为圣”或“维护我的圣洁”。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的神名音译“耶和华”，保留专名性质，不以“主”这一称号替代。
- source_word: הֶאֱמַנְתֶּם בִּי
  choice: 信靠我
  rationale: אמן 的使役词干与介词 ב 连用，可表达相信或信赖；“信靠我”在现代汉语中自然，并保留关系性的信任含义。
- source_word: לְהַקְדִּישֵׁנִי
  choice: 尊我为圣
  rationale: 准确表达使神被承认为圣、公开维护其圣洁的含义，也符合庄重而易懂的现代中文表达。
- source_word: לְעֵינֵי בְּנֵי יִשְׂרָאֵל
  choice: 在以色列人眼前
  rationale: 保留希伯来语“在……眼前”的公开、可见维度；“以色列人”是该民族称谓在现代中文中的自然表达。
- source_word: לָכֵן
  choice: 所以
  rationale: 清楚标示前因后果，比“因此”略自然，同时保持审判宣告的逻辑。
- source_word: תָבִיאוּ
  choice: 领……进入
  rationale: בוא 的使役形表示使之进入；在摩西、亚伦带领会众的语境中，“领……进入”比单纯“带进”更贴切。
- source_word: הַקָּהָל הַזֶּה
  choice: 这会众
  rationale: “会众”保留旷野中聚集群体的含义，并是简洁、庄重且通行的中文圣经用语。
- source_word: הָאָרֶץ אֲשֶׁר נָתַתִּי לָהֶם
  choice: 我赐给他们的那片土地
  rationale: “赐给”体现神作为赐予者；完成式译为既已赐予，保留应许确定、已然有效的语气。
theological_decisions:
- issue: 摩西和亚伦过犯的性质
  choice: 同时保留“不信靠我”和“没有……尊我为圣”两个指控，不进一步说明两者具体如何关联。
  alternative: 解释为不顺服、未荣耀神，或未显明神的圣洁。
  rationale: 原文并列呈现信靠与尊神为圣的层面；译文不把这种张力化约为单一解释。
- issue: 神名的译法
  choice: 耶和华
  alternative: 雅威；上主；主
  rationale: “耶和华”在现代中文语境中是广为人知的专名形式，可避免把四字神名仅译成称号；“雅威”则更接近当代学界常见的拟音。
- issue: “赐给他们”的时态与应许性质
  choice: 采用完成性的“赐给”，而不译成“将要赐给”。
  alternative: 我将赐给他们；我正赐给他们
  rationale: 希伯来语完成式把土地呈现为神已经赐下的确定恩赐，即使会众尚未实际进入。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“耶和华”“会众”“尊我为圣”保留经文语体，但整体句法简明，普通读者可以理解。所有脚注标记均置于对应主文之后。
