base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/003.yaml
  text: And the people quarreled with Moses and said[a], “If only we had perished when our brothers perished before Yahweh!”
translation:
  language: zh_hans
  text: 百姓与摩西争吵，说：“巴不得我们的弟兄们死在雅威面前的时候，我们也死了！”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“巴不得我们也像我们的弟兄们一样，死在雅威面前！”
    reason: בִּגְוַע可按时间理解为“在……死的时候”，也可在汉语中自然表达为与弟兄们同样死去。
lexical_decisions:
- source_word: וַיָּרֶב
  choice: 争吵
  rationale: ריב表示争执、相争；“争吵”以现代汉语自然地保留百姓与摩西对立的语气，比“抱怨”更有对抗性。
- source_word: הָעָם
  choice: 百姓
  rationale: 此处泛指以色列民众；“百姓”简明自然，也符合叙事语境。
- source_word: עִם מֹשֶׁה
  choice: 与摩西
  rationale: עִם通常意为“与、同”；搭配“争吵”已能清楚表达敌对互动，无须强化为“反对摩西”。
- source_word: וַיֹּאמְרוּ לֵאמֹר
  choice: 说
  rationale: 这是希伯来语常见的引语引介格式；汉语只译“说”即可自然完整地传达功能。
- source_word: וְלוּ
  choice: 巴不得
  rationale: 该词表达强烈愿望和哀叹；“巴不得”是自然、清楚而有情感力度的现代汉语。
- source_word: גָוַעְנוּ / בִּגְוַע
  choice: 死去／死
  rationale: 两处均源自גוע，意为死亡、断气。“死去／死”自然庄重，并通过重复“死”保留原文同根词的呼应。
- source_word: אַחֵינוּ
  choice: 弟兄们
  rationale: 原文为阳性复数，字面是“我们的弟兄”；在此可能指先前死去的以色列同胞。“弟兄们”保留原文的性别形式和群体关系。
- source_word: לִפְנֵי יְהוָה
  choice: 在雅威面前
  rationale: לִפְנֵי意为“在……面前／在……临在中”；“在雅威面前”简洁保留原文表达，并将四字神名按专名译为“雅威”。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华／主
  rationale: 原文直接使用四字神名。正文采用“雅威”，以汉语音译呈现该盟约之名，而不以称号“主”代替；“耶和华”虽为传统形式，但并非较可能的古代读音。
- issue: אַחֵינוּ 的性别与群体范围
  choice: 弟兄们
  alternative: 同胞们／弟兄姊妹
  rationale: 原文是阳性复数，正文保留为“弟兄们”，不擅自扩大或中性化；同时不排除它在语境中泛指以色列同胞。
- issue: בִּגְוַע 所表达的关系
  choice: 在弟兄们……的时候
  alternative: 像弟兄们一样
  rationale: 介词ב与不定式结构可表达时间或情境。正文采用时间性理解，但以脚注保留比较或同样遭遇死亡的可能表达，避免消除原文张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“争吵”保留对抗力度；“巴不得”呈现哀叹愿望；句中加入“也”使汉语关系清楚，但不增加新的事件内容。
