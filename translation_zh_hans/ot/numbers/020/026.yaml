  terminology: “亚伦”“以利亚撒”译名规范；“衣服”忠实对应בְּגָדָיו，未在正文擅加“祭司服”。脚注以“祭司服”说明上下文所指，同时明确这是语境性说明而非原文词汇的扩充。
