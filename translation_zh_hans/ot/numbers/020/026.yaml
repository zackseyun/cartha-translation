base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/026.yaml
  text: Strip Aaron of his garments and put them on Eleazar his son[b][a]. Then Aaron will be gathered to his people and die there.
translation:
  language: zh_hans
  text: 你要把亚伦的衣服[a]脱下来，给他儿子以利亚撒穿上。亚伦必被收聚[b]，死在那里。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 按本节原文直译是“衣服”；结合上下文，所指的是他的祭司服。
    reason: lexical_alternative
  - marker: b
    text: “被收聚”是希伯来语描述死亡的惯用说法；其他经文有较完整的表达，如“归到他本族那里”。本节原文没有“归到他本族那里”这几个字。
    reason: cross_reference
lexical_decisions:
- source_word: וְהַפְשֵׁט
  choice: 脱下来
  rationale: 这是פשט的使役式命令，表示从某人身上脱去衣物。“把……脱下来”准确表达使役含义，也符合现代汉语习惯。
- source_word: בְּגָדָיו
  choice: 他的衣服
  rationale: בגד通常指衣服或衣裳；上下文表明这是祭司的服饰，但本节原文本身只说“衣服”，因此正文不作扩充。
- source_word: וְהִלְבַּשְׁתָּם
  choice: 给……穿上
  rationale: 使役式表示使这些衣服穿在以利亚撒身上；“给他儿子以利亚撒穿上”自然地表达衣服的转交，并保留复数代词所指的内容。
- source_word: אֶת אֶלְעָזָר בְּנוֹ
  choice: 他儿子以利亚撒
  rationale: 按自然汉语语序表达以利亚撒与亚伦的父子关系。
- source_word: יֵאָסֵף
  choice: 必被收聚
  rationale: 保留אסף在死亡语境中的被动式惯用表达。原文本节没有“归到他本族那里”等补语，因此不在正文中增添。
- source_word: וּמֵת שָׁם
  choice: 死在那里
  rationale: 承接前面的将来结果，简洁自然地表达亚伦将在该处死亡。
theological_decisions:
- issue: יֵאָסֵף所含的死亡惯用语
  choice: 正文译为“必被收聚”，不补入宾语或归属对象。
  alternative: 必归到他本族那里；必死去
  rationale: “被收聚”保留希伯来文的文学与神学含义；本节未出现完整短语“归到他本族那里”，而且后文另有明确的“死”，故既不扩写，也不把两者合并为单纯的死亡陈述。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“把……脱下来，给……穿上”清楚呈现祭司衣服的转交；“必被收聚”略带异文化色彩，但脚注说明其死亡惯用义，并忠实保留本节原文有意简略的措辞。
