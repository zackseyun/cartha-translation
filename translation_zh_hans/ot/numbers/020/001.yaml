  to: 以色列全体会众[a]在正月来到寻的旷野；百姓住在加低斯。米利暗死在那里，也葬在那里。
  rationale: 仅作句法和措辞调整：“以色列全体会众”自然地保留“以色列子孙”与“全会众”共同指向全体以色列民的表达。用分号划分抵达与驻留两个连续叙事动作，不改变意义。原文未说明年份，译文仍未补充。
