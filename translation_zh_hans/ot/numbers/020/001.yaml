  text: וַ/יָּבֹ֣אוּ בְנֵֽי יִ֠שְׂרָאֵל כָּל הָ֨/עֵדָ֤ה מִדְבַּר צִן֙ בַּ/חֹ֣דֶשׁ הָֽ/רִאשׁ֔וֹן וַ/יֵּ֥שֶׁב הָ/עָ֖ם בְּ/קָדֵ֑שׁ וַ/תָּ֤מָת שָׁם֙ מִרְיָ֔ם וַ/תִּקָּבֵ֖ר שָֽׁם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/001.yaml
  text: Then the sons of Israel[a], the whole congregation, came into the wilderness of Zin in the first month, and the people stayed at Kadesh[b]. Miriam died there and was buried there.
translation:
  language: zh_hans
  text: 以色列全体会众[a]在正月来到寻的旷野；百姓住在加低斯。米利暗死在那里，也葬在那里。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“以色列的众子”，即以色列人。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 该词组字面为“以色列的众子”，在这里指以色列民族全体；“以色列人”是现代汉语中准确、自然且不造成性别误解的表达。
- source_word: כָּל הָעֵדָה
  choice: 全会众
  rationale: עֵדָה在本段指作为整体的以色列群体，“全会众”既保留其群体、集会色彩，也对应כָּל“全体”。
- source_word: מִדְבַּר צִן
  choice: 寻的旷野
  rationale: מִדְבָּר指旷野地带；“寻”采用现代中文圣经地名的通行译名。
- source_word: בַּחֹדֶשׁ הָרִאשׁוֹן
  choice: 在正月
  rationale: 原文直译为“在第一个月”；“正月”在现代汉语中简洁表达历法中的首月，并不擅自补明年份。
- source_word: וַיֵּשֶׁב
  choice: 住
  rationale: 此处主语是“百姓”，动词表示居住或停留；“住”自然且不暗示永久定居。
- source_word: הָעָם
  choice: 百姓
  rationale: 在此指以色列民众整体，“百姓”符合叙事语体，也与“会众”形成自然区分。
- source_word: בְּקָדֵשׁ
  choice: 在加低斯
  rationale: 采用该地名的通行音译；介词按汉语地点表达译为“在”。
- source_word: מִרְיָם
  choice: 米利暗
  rationale: 采用现代中文圣经传统中广为识别的人名译法。
- source_word: וַתָּמָת
  choice: 死
  rationale: 直接保留מות的朴素陈述，不用“去世”等委婉表达削弱原文语气。
- source_word: וַתִּקָּבֵר
  choice: 葬
  rationale: 希伯来语为被动式；汉语“葬在那里”可自然表达被安葬而不增添未明说的施事者。
- source_word: שָׁם ... שָׁם
  choice: 在那里……在那里
  rationale: 保留原文地点副词的重复，使死亡与安葬都明确落在同一地点。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而清楚的叙事汉语。“以色列人全会众”紧贴原文两个相邻的群体称谓；保留“在那里……在那里”的重复。原文只说“正月”，未说明具体年份，因此译文不作补充。
