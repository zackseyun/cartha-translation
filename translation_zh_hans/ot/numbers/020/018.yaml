  source_fidelity: 译文准确传达了以东拒绝以色列通行，并以持剑出战相威胁的意思。惟“带刀”较像随身携带，未充分体现בַּחֶרֶב（“用剑／以刀剑”）在威胁语境中的武装攻击方式；改为“拿刀出来攻击”更明确、自然，且不增添原文没有的细节。
