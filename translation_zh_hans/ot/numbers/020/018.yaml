base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/018.yaml
  text: But Edom said to him[a], “You shall not pass through me[b], lest I come out against you with the sword.”
translation:
  language: zh_hans
  text: 以东却对他说：“你不可从我这里经过[a]，不然我会拿刀出来攻击你[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“在我里面”。以东在这里既代表民族，也代表其领土，意思是经过以东境内。
    reason: lexical_alternative
  - marker: b
    text: 原文也可直译为“出来迎着你”或“出来与你相遇”；在这里因提到刀，所表达的是武装敌对。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 却对他说
  rationale: וַיֹּאמֶר是叙事中常见的连续式表达；结合前文以色列的请求，用“却”自然体现以东的拒绝，而“对他说”对应אֵלָיו。
- source_word: אֱדוֹם
  choice: 以东
  rationale: 既可指民族，也可指其疆土；此处将以东人格化为发言者，保留原文表达。
- source_word: לֹא תַעֲבֹר
  choice: 你不可……经过
  rationale: 未完成式在此表达明确禁令；“不可”庄重而自然，保留拒绝通行的强硬语气。
- source_word: בִּי
  choice: 从我这里
  rationale: 字面为“在我里面／经过我”；以东代表民族及其领土说话，因此“从我这里”既保留人格化，也能让现代读者理解为经过其境内。
- source_word: פֶּן
  choice: 不然
  rationale: 此处引出若不听从禁令便会发生的威胁性后果；现代汉语“不然”比目的性较强的“免得”更贴合语境。
- source_word: בַּחֶרֶב
  choice: 带刀
  rationale: 字面为“用刀／带着刀”；这是武装行动的表达。“带刀”保留具体意象，并自然传达军事威胁。
- source_word: אֵצֵא לִקְרָאתֶךָ
  choice: 出来迎击你
  rationale: 字面可作“出来迎接你／与你相遇”，但在带刀威胁的语境中显然带敌对含义；“迎击”准确传达语用意义，脚注保留较直译的可能。
