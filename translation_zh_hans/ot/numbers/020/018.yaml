translation_notes:
  register: 采用现代、庄重而清楚的叙事语言。“从我这里经过”保留以东作为国家与领土的拟人化说法；“不然”体现直接威胁；“带刀出来迎击”保持原文的军事意象与敌对语气。脚注标记均置于相关短语之后。
