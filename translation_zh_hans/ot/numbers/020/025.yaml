base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/025.yaml
  text: Take Aaron and Eleazar his son[a], and bring them up Mount Hor.
translation:
  language: zh_hans
  text: 你带着亚伦和他儿子以利亚撒，领他们登上何珥山[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译“何珥那座山”，通常译作“何珥山”。
    reason: lexical_alternative
lexical_decisions:
- source_word: קַח
  choice: 带着
  rationale: 这是动词לקח的Qal命令式，基本义为“拿、带”。这里指摩西带亚伦和以利亚撒同行，译作“带着”符合现代汉语习惯。
- source_word: אַהֲרֹן
  choice: 亚伦
  rationale: 采用现代中文圣经中通行的人名译法。
- source_word: אֶלְעָזָר
  choice: 以利亚撒
  rationale: 采用现代中文圣经中通行的人名译法。
- source_word: בְּנוֹ
  choice: 他儿子
  rationale: 第三人称阳性单数后缀按上下文自然指向亚伦，说明以利亚撒是亚伦的儿子。
- source_word: וְהַעַל
  choice: 领……登上
  rationale: 这是עלה的Hiphil命令式，具有使役意味，即“使……上去”。“领他们登上”既保留使役和引领之意，也符合登山语境中的自然汉语。
- source_word: אֹתָם
  choice: 他们
  rationale: 复数宾语代词共同指亚伦和以利亚撒。
- source_word: הֹר הָהָר
  choice: 何珥山
  rationale: 原文形式上是“何珥那座山”；“何珥山”是清楚自然且通行的中文地名表达。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“带着……领他们登上”保留原文两个命令动词及第二个动词的使役意味；脚注标记置于其实际说明的地名之后。
