  text: But he said[c][b][a], “You shall not pass through.” And Edom came out to meet him with a large force and with a strong hand.
translation:
  language: zh_hans
  text: 他却说：“你不可经过。”于是，以东带着大队人马和强大的武力[a]出来迎战他[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“用强有力的手”，意思是凭强大的力量或武力。
    reason: lexical_alternative
  - marker: b
    text: “迎战他”也可译为“出来迎接他”或“出来面对他”；希伯来语表达本身可以是中性的，但这里的上下文显然带有敌意。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 他却说
  rationale: 叙事性连接词在上下文中带有转折意味，因为这是以东对以色列请求的拒绝；“他”保留原文隐含而由语境确定的说话者。
- source_word: לֹא תַעֲבֹר
  choice: 你不可经过
  rationale: 未完成式在此表达明确的禁止或拒绝；“经过”自然表达穿越以东领土之意。
- source_word: וַיֵּצֵא אֱדוֹם
  choice: 于是，以东……出来
  rationale: 保留“出来”的基本动作义，不擅自具体化为“出兵”或“进军”，而让后文显明其武力对抗的性质。
- source_word: לִקְרָאתוֹ
  choice: 迎战他
  rationale: 该表达基本义为“出来迎接/面对他”，本身可中性使用，但此处上下文明显敌对；“迎战”在现代汉语中自然呈现语境意义，脚注说明较字面的译法。
- source_word: בְּעַם כָּבֵד
  choice: 带着大队人马
  rationale: 原文字面为“带着沉重/强大的一群人”，是指人数众多或阵容强盛；“大队人马”既自然，也避免过度限定为正规军。
- source_word: וּבְיָד חֲזָקָה
  choice: 和强大的武力
  rationale: “用强有力的手”是表示力量、权势或武力的习语；此处军事对峙语境下译为“强大的武力”清楚自然，同时在脚注保留原文意象。
