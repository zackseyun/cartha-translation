lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: 说
  rationale: 此处是希伯来叙事中常见的发言引入公式；现代汉语用“说”自然简洁，无须机械保留连接词“于是/并且”。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代简体中文读者最熟悉的专名形式音译四字神名，保留其作为名字而非称号的性质。
- source_word: אֶל מֹשֶׁה
  choice: 对摩西
  rationale: 介词 אֶל 在言说结构中自然译为“对”，מֹשֶׁה 采用通行译名“摩西”。
- source_word: לֵאמֹר
  choice: 说：
  rationale: 该不定式用于引出随后话语；汉语以“说：”及冒号自然表达其功能，避免重复成“说……说”。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文明确使用四字神名。正文采用中文圣经传统中最通行、普通读者最易识别的专名“耶和华”，不以“主”这一称号替代；“雅威”是更接近现代学界常见重构读音的另一种音译。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“耶和华对摩西说：”完整传达发言公式，并以冒号衔接下一节的直接引语。
