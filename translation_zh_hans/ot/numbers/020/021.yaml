  text: וַ/יְמָאֵ֣ן אֱד֗וֹם נְתֹן֙ אֶת יִשְׂרָאֵ֔ל עֲבֹ֖ר בִּ/גְבֻל֑/וֹ וַ/יֵּ֥ט יִשְׂרָאֵ֖ל מֵ/עָלָֽי/ו׀־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/021.yaml
  text: But Edom refused to let Israel pass through his territory[a], so Israel turned away from him.
translation:
  language: zh_hans
  text: 以东不肯让以色列从他的境内经过，于是以色列就转离以东[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：从以东转向一旁。
    reason: 原文动词可表示“转离”或“转向一旁”，着重说明以色列改变路线。
lexical_decisions:
- source_word: וַיְמָאֵן
  choice: 不肯
  rationale: 表达 מאן 所含的拒绝、不愿之意，在叙事中自然且力度恰当。
- source_word: אֱדוֹם
  choice: 以东
  rationale: 采用该民族和地域名称在现代中文圣经语境中的通行译名。
- source_word: נְתֹן
  choice: 让
  rationale: נתן 与 מאן 连用，在这里表示准许；译为“不肯让”符合现代汉语习惯。
- source_word: עֲבֹר
  choice: 经过
  rationale: 结合领土语境，表示从一地通行；“经过”简洁自然。
- source_word: בִּגְבֻלוֹ
  choice: 从他的境内
  rationale: גְּבוּל 可指边界或疆域；本段谈的是穿越以东领土，故“境内”比字面的“边界”更准确自然。
- source_word: וַיֵּט
  choice: 转身离开
  rationale: נטה 在这里指改变行进方向、避开以东；“转身离开”呈现实际行动，同时保留“转离”的方向感。
- source_word: מֵעָלָיו
  choice: 了他
  rationale: 该介词短语在此表示离开以东；其离去方向已由“转身离开”自然表达。
