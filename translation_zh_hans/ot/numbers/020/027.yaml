base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/027.yaml
  text: Moses did as Yahweh commanded[a], and they went up Mount Hor before the eyes of all the congregation.
translation:
  language: zh_hans
  text: 摩西照雅威所吩咐的做了；他们在全体会众眼前[a]上了何珥山。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“在全体会众眼前”，意思是当着聚集的众人，公开地进行。
    reason: 说明希伯来语“在……眼前”的具体意象及其语用含义。
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: 做了
  rationale: 此处指摩西遵行刚才所领受的命令。“做了”简洁自然，并保留希伯来叙事的直截了当。
- source_word: כַּאֲשֶׁר
  choice: 照……所……的
  rationale: 表达摩西的行动完全依照雅威的吩咐；这一汉语结构比逐字译作“如同”更自然。
- source_word: צִוָּה
  choice: 吩咐
  rationale: צוה表示有权威的命令。“吩咐”在现代中文圣经叙事中自然庄重，也保留上帝命令的权威性。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以常见的现代汉语音译呈现四字神名，保留其作为以色列之上帝专名的性质，而不以称号替代。
- source_word: וַיַּעֲלוּ
  choice: 他们……上了
  rationale: עלה在登山语境中意为“上去、登上”。“上了何珥山”是自然简明的现代汉语，并保留复数主语，不凭上下文把人物姓名补入正文。
- source_word: אֶל הֹר הָהָר
  choice: 上了何珥山
  rationale: הֹר הָהָר是地名，按现代汉语地名习惯译作“何珥山”；介词方向意义已融入动词“上了”。
- source_word: לְעֵינֵי
  choice: 在……眼前
  rationale: 保留希伯来语“在眼前”的具体意象，同时清楚表达此事是在众人公开注视下发生的。
- source_word: כָּל הָעֵדָה
  choice: 全体会众
  rationale: עֵדָה指聚集的以色列共同体。“全体会众”简洁、庄重，并体现כָּל所强调的整体性。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。译作“雅威”可保留专名性质，不以“主”这一称号代替，也采用现代学界较通行的拟音。
- issue: 复数主语 וַיַּעֲלוּ 的指代
  choice: 他们
  alternative: 摩西、亚伦和以利亚撒
  rationale: 本节自身只明说复数“他们”；具体人物可由上文确定，但正文保留代词，以免把上下文解释写入本节原文。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“照……所吩咐的做了”体现顺服命令，“就在……眼前上了……”使中文语序流畅。脚注标记置于其实际说明的短语“全体会众眼前”之后。
