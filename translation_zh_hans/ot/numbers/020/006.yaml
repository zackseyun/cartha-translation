  text: וַ/יָּבֹא֩ מֹשֶׁ֨ה וְ/אַהֲרֹ֜ן מִ/פְּנֵ֣י הַ/קָּהָ֗ל אֶל פֶּ֨תַח֙ אֹ֣הֶל מוֹעֵ֔ד וַֽ/יִּפְּל֖וּ עַל פְּנֵי/הֶ֑ם וַ/יֵּרָ֥א כְבוֹד יְהוָ֖ה אֲלֵי/הֶֽם־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/006.yaml
  text: Then Moses and Aaron came from before the assembly to the entrance of the tent of meeting and fell on their faces[c][b][a], and the glory of Yahweh appeared to them.
translation:
  language: zh_hans
  text: 于是，摩西和亚伦离开会众[a][b]，来到会幕门口，俯伏在地；雅威的荣耀[c]向他们显现。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“从会众面前”，意思是从聚集的人群所在之处离开。
    reason: cultural_note
  - marker: b
    text: “会众”也可译作“聚集的民众”。
    reason: lexical_alternative
  - marker: c
    text: “荣耀”也可译作“荣光”；原文没有说明这次显现的具体形态。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: 来到
  rationale: בוא可按叙事视角译为“来、去、进入”；此处有明确目的地“会幕门口”，译作“来到”自然且准确。
- source_word: מִפְּנֵי הַקָּהָל
  choice: 离开会众
  rationale: 字面为“从会众面前／从会众所在之处”；现代汉语用“离开会众”自然表达他们从聚集之人那里退到会幕门口。
- source_word: הַקָּהָל
  choice: 会众
  rationale: קהל指聚集起来的群体；“会众”在民数记语境中简洁、清楚，并保留以色列共同体的整体含义。
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: 会幕门口
  rationale: 该短语字面指“会见之帐的入口”；“会幕门口”是准确且为普通中文读者熟悉的表达。
- source_word: וַיִּפְּלוּ עַל־פְּנֵיהֶם
  choice: 俯伏在地
  rationale: 希伯来语字面为“仆倒在自己的脸上”，表示面伏于地的姿势；“俯伏在地”既自然又保留谦卑、恳求的动作。
- source_word: וַיֵּרָא
  choice: 显现
  rationale: ראה的Nifal形式在此表示可见的彰显；“显现”比单纯“被看见”更符合该神显语境，同时不增添原文未明说的细节。
- source_word: כְבוֹד יְהוָה
  choice: 雅威的荣耀
  rationale: כבוד在此指神可感知的荣耀彰显；用“雅威的荣耀”直接表达希伯来语属格结构。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以“雅威”音译四字神名，保留原文所用的专名，不以“主”等称号代替。
- source_word: אֲלֵיהֶם
  choice: 向他们
  rationale: 介词אל表示朝向；与“显现”搭配时，“向他们显现”是自然准确的现代汉语。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名。正文采用较贴近通常学术重构读音的“雅威”，以保留专名；“耶和华”是传统汉译形式，“上主”则以称号代替专名。
- issue: “雅威的荣耀”是否指可见的神显
  choice: 保留“荣耀向他们显现”的表述
  alternative: 把“荣耀”解释性译成“荣光”或具体的可见现象
  rationale: 原文说כבוד יהוה显现，却没有说明其具体形态。译文保留这种开放性，不将其限定为光、云或其他现象。
translation_notes:
  register: 采用现代、庄重而易懂的叙事文体。“于是”衔接前文；“会幕”沿用读者熟悉的圣经用语；“俯伏在地”避免生硬照译“倒在脸上”。标点用分号区分人的动作与随后发生的神显。
