base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/011.yaml
  text: Then Moses raised his hand and struck the rock with his staff twice, and abundant water came out, and the congregation drank, along with their livestock.
translation:
  language: zh_hans
  text: 摩西举起手，用他的杖击打那磐石两次，大量的水就流了出来；会众和他们的牲畜都喝了。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּרֶם מֹשֶׁה אֶת־יָדוֹ
  choice: 摩西举起手来
  rationale: הרים在使役词干中表示“举起、抬起”；译文保留“手”这一明确宾语，并采用自然的现代汉语表达。
- source_word: וַיַּךְ אֶת־הַסֶּלַע
  choice: 击打磐石
  rationale: נכה表示击打；“击打”兼顾动作力度与庄重叙事语体。סלע在此指特定的岩石，译作“五经叙事中常用的‘磐石’”。
- source_word: בְּמַטֵּהוּ
  choice: 用杖
  rationale: מַטֶּה可指杖或棍；此处是摩西所持之杖，简洁译作“杖”，所属关系由主语和语境自然表明。
- source_word: פַּעֲמָיִם
  choice: 两次
  rationale: 该双数形式在此作次数表达，现代汉语自然译为“两次”。
- source_word: וַיֵּצְאוּ מַיִם רַבִּים
  choice: 就有大量的水涌出来
  rationale: רַבִּים修饰“水”，表示数量很多；“大量的水”准确传达数量，“涌出来”自然呈现水从磐石出来的动态，未额外加入方式或神学解释。
- source_word: הָעֵדָה
  choice: 会众
  rationale: עֵדָה指聚集的以色列共同体；“会众”简洁、庄重，也符合五经语境。
- source_word: וּבְעִירָם
  choice: 和他们的牲畜
  rationale: בְּעִיר泛指家养牲畜，不限于牛；“牲畜”比“牛群”更准确。并列语义在汉语中自然表达为“会众和他们的牲畜都喝了”。
theological_decisions:
- issue: 如何叙述摩西击打磐石的行为
  choice: 只按本节明说的内容译为“用杖击打磐石两次”
  alternative: 在正文中增添“不顺服”“违命”等评价性措辞
  rationale: 本节直接叙述摩西的动作及其结果；其行为的神学评价由上下文说明，不应提前加入本节译文。
translation_notes:
  register: 采用现代、清晰而庄重的叙事语体。“磐石”“会众”“杖”保持五经语境的传统辨识度，同时避免古奥表达。分号连接出水与饮用两个紧密相连的结果，使句子流畅。
