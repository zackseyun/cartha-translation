base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/015.yaml
  text: And our fathers went down to Egypt[a], and we lived in Egypt many days[c][b], and the Egyptians treated us and our fathers badly.
translation:
  language: zh_hans
  text: 我们的祖先下到埃及[a]，我们在埃及住了许多日子[b]；埃及人恶待我们和我们的祖先[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “祖先”原文直译为“父亲们”；此处指祖先。本节末尾同。
    reason: lexical_alternative
  - marker: b
    text: “许多日子”是原文的字面表达，也可意译为“很长一段时间”。
    reason: lexical_alternative
  - marker: c
    text: “恶待”也可译为“加害于”或“亏待”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרְדוּ
  choice: 下到
  rationale: 保留ירד“下去、下到”的地理移动表达；“下到埃及”在现代中文中清楚，也延续了圣经叙事的语感。
- source_word: אֲבֹתֵינוּ
  choice: 我们的祖先
  rationale: 字面为“我们的父辈”，在此历史回顾中泛指先祖；“祖先”比“父亲们”自然准确，并涵盖其群体性所指。
- source_word: מִצְרַיְמָה
  choice: 到埃及
  rationale: 词尾方向词素表示朝向或进入某地；译作“到埃及”最符合现代汉语。
- source_word: וַנֵּשֶׁב
  choice: 我们……住了
  rationale: ישב在此表示居住、停留；“住了”简明自然，不引入“定居”可能含有的额外意味。
- source_word: יָמִים רַבִּים
  choice: 许多日子
  rationale: 保留希伯来文“许多日子”的具体措辞，同时以脚注说明其可指很长一段时间，避免正文过度释义。
- source_word: וַיָּרֵעוּ
  choice: 恶待
  rationale: רעע的使役形在此表示对人行恶、加害或亏待；“恶待”保留道德负面力度，又不把具体方式限定为某一种虐待。
- source_word: מִצְרַיִם
  choice: 埃及人
  rationale: 原文形式为“埃及”，但搭配复数动词，所指是埃及人；中文明确译为“埃及人”更自然。
- source_word: לָנוּ
  choice: 我们
  rationale: 介词ל标示行为所针对、影响的对象；在“恶待”之后直接译作宾语“我们”。
- source_word: וְלַאֲבֹתֵינוּ
  choice: 和我们的祖先
  rationale: 保留原文第二次出现的“我们的祖先”，不将其与“我们”合并，以维持原文强调。
theological_decisions: []
