  text: יֵאָסֵ֤ף אַהֲרֹן֙ אֶל עַמָּ֔י/ו כִּ֣י לֹ֤א יָבֹא֙ אֶל הָ/אָ֔רֶץ אֲשֶׁ֥ר נָתַ֖תִּי לִ/בְנֵ֣י יִשְׂרָאֵ֑ל עַ֛ל אֲשֶׁר מְרִיתֶ֥ם אֶת פִּ֖/י לְ/מֵ֥י מְרִיבָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/024.yaml
  text: Aaron will be gathered to his people[a], because he will not enter the land that I have given to the sons of Israel[b], because you rebelled against my command at the waters of Meribah.
translation:
  language: zh_hans
  text: 亚伦必归到他的本族那里[a]，因为他不得进入我赐给以色列子孙的那地；因为你们在米利巴水边违抗了我的命令[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “归到他的本族那里”是希伯来语在死亡语境中所用的惯用说法；也可译作“归到他的族人那里”。
    reason: 说明原文的死亡惯用语，同时不将其完全化约为“死”，也不具体化为“祖先”。
  - marker: b
    text: “我的命令”原文直译为“我的口”，意思是神亲口所说的话或所下的命令。
    reason: 说明正文按汉语惯用法译出该身体部位隐喻的含义。
lexical_decisions:
- source_word: יֵאָסֵף
  choice: 必被收归
  rationale: 保留尼法勒态的被动形式和死亡语境中的庄重委婉表达，不直接简化为“必死”。
- source_word: אֶל עַמָּיו
  choice: 到他的族人那里
  rationale: 直译“到他的人民／族人那里”；“族人”在现代汉语中较自然，也不把所指收窄为“祖先”。
- source_word: כִּי לֹא יָבֹא אֶל הָאָרֶץ
  choice: 因为他不得进入……那地
  rationale: כִּי 表原因；“不得进入”自然表达否定及神所宣告的结果。
- source_word: אֲשֶׁר נָתַתִּי
  choice: 我赐给……的
  rationale: 完成式在这里表达神已确定赐下的土地；“赐给”符合神赐地的语境，同时不额外加入“应许之地”。
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 这是表示全体民族的固定称谓；现代汉语用“以色列人”比机械直译“以色列的众子”更准确自然，且不改变其群体所指。
- source_word: מְרִיתֶם
  choice: 你们……违抗了
  rationale: 动词为复数，指摩西和亚伦；“违抗”清楚保留对神权威的反叛含义。
- source_word: אֶת־פִּי
  choice: 我的命令
  rationale: 字面为“我的口”，在本句中转指神亲口发出的命令；正文按汉语惯用法表达其实际含义。
- source_word: לְמֵי מְרִיבָה
  choice: 在米利巴水那里
  rationale: 保留事件地点的专名“米利巴”和“水”这一成分，不将专名直接释作“争闹”。
theological_decisions:
- issue: “被收归到他的族人那里”这一死亡委婉语
  choice: 保留原文意象，并以脚注说明它在语境中指死亡
  alternative: 直接译作“亚伦必死”或解释为“归到他的祖先那里”
  rationale: 原文不只是陈述死亡，也保留了与本族相聚的文学和神学意涵；但它没有明确说“祖先”，也未详细界定死后状态，因此不作进一步教义化解释。
- issue: 对违抗者的复数指称
  choice: 译作“你们”，保留第二人称复数
  alternative: 明确增译为“你和摩西”或“你们二人”
  rationale: 希伯来文仅以复数动词表达，语境可确定涉及摩西和亚伦；正文不增添原文没有直说的姓名。
- issue: 神所赐之地的时态
  choice: 译作“我赐给……的那地”
  alternative: “我将要赐给……的那地”
  rationale: 原文使用完成式，强调赐予已经确定或已成事实；不因以色列尚未全面进入而改成纯粹将来时。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“必被收归”略带礼仪性和经文色彩，以承载原文死亡委婉语；其余句法尽量自然。“米利巴水”保留传统且透明的专名表达。
