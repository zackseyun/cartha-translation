base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/005.yaml
  text: And why have you brought us up out of Egypt to bring us into this evil place? It is not a place of grain[a], or figs, or vines, or pomegranates[c][b], and there is no water to drink.
translation:
  language: zh_hans
  text: 你为什么把我们从埃及带上来，带到这个糟糕的地方呢？这里不是适合播种的地方[a]，也没有无花果树、葡萄树和石榴树[b]，连喝的水也没有。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“不是种子的地方”，可指不适合播种的地方，也可指不出产粮食或庄稼的地方。
    reason: lexical_alternative
  - marker: b
    text: 也可理解为无花果、葡萄和石榴等果实；原文这些词可指植物，也可着重指其出产。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָמָה
  choice: 你们为什么
  rationale: 承接上文的抱怨；汉语不必机械译出句首连接词，语流仍然清楚。
- source_word: הֶעֱלִיתֻנוּ מִמִּצְרַיִם
  choice: 把我们从埃及领上来
  rationale: 保留希伯来语“从埃及上来”的出埃及表达，同时“领”符合摩西、亚伦带领百姓的语境。
- source_word: לְהָבִיא אֹתָנוּ
  choice: 带到
  rationale: 表达不定式所含的目的或结果，并与后面的地点自然衔接。
- source_word: אֶל־הַמָּקוֹם הָרָע הַזֶּה
  choice: 到这个糟糕的地方
  rationale: רָע在这里主要指环境恶劣、令人难以忍受，而非道德上的邪恶；“糟糕”自然保留强烈贬义。
- source_word: לֹא מְקוֹם זֶרַע
  choice: 这里不是可耕种的地方
  rationale: 字面为“不是种子的地方”，语境上可指不适合播种或不能出产庄稼；正文采用自然且涵盖农业用途的表达，并用脚注保留歧义。
- source_word: וּתְאֵנָה וְגֶפֶן וְרִמּוֹן
  choice: 没有无花果、葡萄树和石榴树
  rationale: 这些单数集合名词可指植物或其果实；“葡萄树”明确גֶפֶן，用脚注说明也可理解为果实。
- source_word: וּמַיִם אַיִן לִשְׁתּוֹת
  choice: 连喝的水也没有
  rationale: 准确表达存在否定和饮用用途；“连……也……”自然体现清单末项的递进抱怨。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而口语自然的抱怨语气。“糟糕”避免把描述环境有害或恶劣的רָע误读成道德意义上的“邪恶”；“可耕种”使农业语境清楚，同时由脚注保留זֶרַע的字面形式和语义范围。
