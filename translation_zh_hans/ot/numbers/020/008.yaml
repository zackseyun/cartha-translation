source:
  edition: WLC
  text: קַ֣ח אֶת הַ/מַּטֶּ֗ה וְ/הַקְהֵ֤ל אֶת הָ/עֵדָה֙ אַתָּה֙ וְ/אַהֲרֹ֣ן אָחִ֔י/ךָ וְ/דִבַּרְתֶּ֧ם אֶל הַ/סֶּ֛לַע לְ/עֵינֵי/הֶ֖ם וְ/נָתַ֣ן מֵימָ֑י/ו וְ/הוֹצֵאתָ֨ לָ/הֶ֥ם מַ֨יִם֙ מִן הַ/סֶּ֔לַע וְ/הִשְׁקִיתָ֥ אֶת הָ/עֵדָ֖ה וְ/אֶת בְּעִירָֽ/ם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/008.yaml
  text: Take the staff[a], and assemble the congregation, you and Aaron your brother, and speak to the rock before their eyes, and it will give its water[d][c][b]. Then you shall bring out water for them from the rock and give drink to the congregation and to their livestock.
translation:
  language: zh_hans
  text: “你要拿那根杖[a]，召集会众[b]；你和亚伦，你哥哥，要当着他们的面[c]对磐石说话，磐石就会流出水来。你要从磐石中为他们取出水来，使会众和他们的牲畜[d]喝水。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “杖”也可译作“手杖”。
    reason: lexical_alternative
  - marker: b
    text: “会众”也可译作“集会”或“群体”。
    reason: lexical_alternative
  - marker: c
    text: 直译“在他们眼前”。
    reason: literal_rendering
  - marker: d
    text: “牲畜”也可译作“家畜”或“役畜”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּטֶּה
  choice: 杖
  rationale: מַטֶּה可指手杖或权杖；“杖”简洁自然，也与本段叙事中的特定物件相符。
- source_word: הָעֵדָה
  choice: 会众
  rationale: עֵדָה指聚集的以色列群体；“会众”保留正式的群体含义，又为现代读者所熟悉。
- source_word: וְדִבַּרְתֶּם אֶל הַסֶּלַע
  choice: 你们要……吩咐磐石
  rationale: דבר אל基本义为“对……说话”；在此命令语境中，“吩咐磐石”比生硬的“对磐石说话”更自然，同时保留复数动词所包含的摩西与亚伦。
- source_word: לְעֵינֵיהֶם
  choice: 当着他们的面
  rationale: 该习语直译为“在他们眼前”，强调事情公开发生；“当着他们的面”在现代汉语中自然地保留这一重点。
- source_word: וְנָתַן מֵימָיו
  choice: 磐石就会流出水来
  rationale: 希伯来文直译为“它就给出它的水”，主语为磐石。“流出水来”符合汉语表达，并保留水由磐石而出的意思；“它的水”在中文中略显生硬，故不机械保留所有格。
- source_word: וְהוֹצֵאתָ לָהֶם מַיִם מִן הַסֶּלַע
  choice: 你要使水从磐石中流出来给他们喝
  rationale: יצא的使役式表示“使……出来”。译作“使水……流出来”保留使役意义；补出“给他们喝”承接上下文目的，在汉语中清楚自然。
- source_word: וְהִשְׁקִיתָ
  choice: 让……喝水
  rationale: שקה的使役式意为“使喝、给……水喝”；“让……喝水”是自然且准确的现代汉语。
- source_word: בְּעִירָם
  choice: 他们的牲畜
  rationale: בְּעִיר泛指家畜或役畜；“牲畜”比“牛群”更宽泛，也比“走兽”更符合语境。
- source_word: אַתָּה וְאַהֲרֹן אָחִיךָ
  choice: 你和你哥哥亚伦一起
  rationale: 明确保留摩西与其兄亚伦二人；调整为自然汉语语序。
theological_decisions:
- issue: 神迹命令的公开性质
  choice: 译为“当着他们的面”，明确摩西和亚伦要在会众公开注视下吩咐磐石。
  alternative: 可较直译为“在他们眼前”，或较简略地译为“在他们面前”。
  rationale: לְעֵינֵיהֶם突出公开可见的见证；保留这一点有助于呈现本章后续事件的叙事张力，而不预先解释其神学意义。
- issue: 吩咐磐石的主体
  choice: 使用复数“你们”，包括摩西和亚伦。
  alternative: 按中文叙事习惯只以摩西为命令执行者。
  rationale: וְדִבַּרְתֶּם是第二人称阳性复数，原文明确让摩西与亚伦共同对磐石说话，不宜将复数静默改为单数。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。保留命令链条、复数“你们”和公开见证的重点；避免机械直译“磐石给出它的水”，改用自然的“流出水来”。所有脚注标记均置于正文对应词语之后。
