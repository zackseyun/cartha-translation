  yaml_path: translation/ot/numbers/020/022.yaml
  text: And they set out from Kadesh[a], and the sons of Israel, the whole congregation[b], came to Mount Hor.
translation:
  language: zh_hans
  text: 他们从加低斯起行；以色列人[a]，即全会众，来到何珥山[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “以色列人”原文直译为“以色列的众子”。
    reason: lexical_alternative
  - marker: b
    text: “何珥山”原文字面为“何珥，那山”，在这里用作地名。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: 起行
  rationale: נסע在行程叙事中常指拔营动身、继续前行。“起行”简洁自然，也保留了从驻扎地出发的含义。
- source_word: מִקָּדֵשׁ
  choice: 从加低斯
  rationale: 原文仅作“加低斯”，不在此处补入“加低斯巴尼亚”，以免超出本节措辞。
- source_word: וַיָּבֹאוּ
  choice: 来到
  rationale: בוא在地点名称前可表示来到或抵达；“来到”既贴近原文，也符合现代汉语叙事表达。
- source_word: בְנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 希伯来语直译为“以色列的众子”，是表示以色列民族的惯用语；现代汉语用“以色列人”更自然，脚注保留其字面形式。
- source_word: כָּל הָעֵדָה
  choice: 全会众
  rationale: עֵדָה指作为整体的群体或会众；כָּל在此表示全体，因此译作“全会众”，保留其共同体色彩。
- source_word: הֹר הָהָר
  choice: 何珥山
  rationale: 该短语作为地名使用，汉语按山名惯例译作“何珥山”；字面结构另见脚注。
theological_decisions: []
