  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/לָ/מָ֤ה הֲבֵאתֶם֙ אֶת קְהַ֣ל יְהוָ֔ה אֶל הַ/מִּדְבָּ֖ר הַ/זֶּ֑ה לָ/מ֣וּת שָׁ֔ם אֲנַ֖חְנוּ וּ/בְעִירֵֽ/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/004.yaml
  text: And why have you brought the assembly of Yahweh into this wilderness[a], that we and our livestock should die there?
translation:
  language: zh_hans
  text: 你们为什么把雅威的会众带到这旷野来，要叫我们和我们的牲畜都死在这里呢？
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְלָמָה
  choice: 为什么
  rationale: 连接词与疑问词承接上一节的埋怨；汉语以“为什么”起句已能自然体现连续语气，无须机械译出“和”。
- source_word: הֲבֵאתֶם
  choice: 把……带到……来
  rationale: 使役形在此意为“带来”；“把”字句符合现代汉语表达，也保留对摩西、亚伦的直接质问。
- source_word: קְהַל יְהוָה
  choice: 雅威的会众
  rationale: קָהָל 指聚集成群体的百姓；“会众”兼顾其集体含义和经文语体，又不把它限定为现代教会组织。יהוה 作为专名音译为“雅威”。
- source_word: אֶל הַמִּדְבָּר הַזֶּה
  choice: 到这旷野来
  rationale: מִדְבָּר 是旷野、荒野地带，不必然专指沙漠；“到……来”自然表达朝说话者所在之处的移动。
- source_word: לָמוּת שָׁם
  choice: 要叫……死在这里
  rationale: 不定式可表达目的或结果；“要叫”保留百姓指控中的目的／结果张力。שָׁם 按希伯来语字面为“那里”，但在汉语直接引语中，说话者身处该旷野，译作“这里”更自然。
- source_word: אֲנַחְנוּ וּבְעִירֵנוּ
  choice: 我们和我们的牲畜
  rationale: בְּעִיר 是家畜的集合称谓；“牲畜”准确、通俗，不局限于牛。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华；以“主”代称
  rationale: 原文直接使用四字神名；“雅威”按较通行的学术拟音保留其专名性质，不以称号取代，也不采用较晚形成的混合读音。
- issue: לָמוּת 的目的或结果含义
  choice: 要叫我们和我们的牲畜都死在这里
  alternative: 以致我们和我们的牲畜都死在这里
  rationale: 不定式在此既可被听作目的，也可被理解为预期结果；采用“要叫”保留埋怨者将责任和意图归给领袖的强烈语气，而不以“以致”单方面消解这种张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“会众”“旷野”保留圣经叙事语域；句末“呢”呈现质问语气。“都”使人和牲畜共同面临死亡的范围在汉语中清楚自然。
