base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/014.yaml
  text: 'Then Moses sent messengers from Kadesh to the king of Edom: “Thus says your brother Israel: You know all the hardship that has come upon us.”[a][b][c]'
translation:
  language: zh_hans
  text: 于是，摩西从加低斯派遣使者去见以东的王，说：“你的弟兄以色列这样说：你知道我们所遭遇的一切艰难。[a][b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “弟兄”也可理解为“亲族”。原文使用亲属称谓，表明以东与以色列之间的祖源关系。
    reason: lexical_alternative
  - marker: b
    text: “所遭遇的”直译为“遇见我们的”；这是一个习语，意为“临到我们的”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: 于是……派
  rationale: 承接前文并推进叙事；“于是”符合现代汉语叙事习惯。
- source_word: מַלְאָכִים
  choice: 使者
  rationale: 此处是外交语境，指受差派的人，而非天使；“使者”准确且不作过度解释。
- source_word: מִקָּדֵשׁ
  choice: 从加低斯
  rationale: 原文仅作“加低斯”，不补入本节未出现的较长地名。
- source_word: אֶל מֶלֶךְ אֱדוֹם
  choice: 到以东王那里
  rationale: 自然表达使者被派往以东王处，同时忠实保留目的对象。
- source_word: כֹּה אָמַר
  choice: 这样说
  rationale: 保留古代使者传话的固定公式，又符合现代汉语表达。
- source_word: אָחִיךָ יִשְׂרָאֵל
  choice: 你的弟兄以色列
  rationale: 保留原文直接的亲属称谓，唤起以东与以色列的祖源关系，不在正文中弱化为泛称“亲族”。
- source_word: אַתָּה יָדַעְתָּ
  choice: 你都知道
  rationale: 完成式在这里表示当前已知的状态；“都”与后面的“一切”自然搭配，并略显原文显式代词的强调。
- source_word: כָּל הַתְּלָאָה
  choice: 一切艰难
  rationale: 该词可指艰苦、困苦或患难；“艰难”庄重、清楚，也保留一定语义宽度。
- source_word: אֲשֶׁר מְצָאָתְנוּ
  choice: 我们所遭遇的
  rationale: 原文直译为“找到我们的”；“所遭遇的”是自然汉语，并保留临到、发生在其身上的意思。
theological_decisions:
- issue: 以色列与以东之间的亲属语言
  choice: 你的弟兄以色列
  alternative: 你的亲族以色列
  rationale: 原文有意使用“弟兄”这一直接亲属隐喻，以其共同祖源为请求的背景；译文不将其泛化。
translation_notes:
  register: 采用现代、庄重而易懂的叙事与外交传话语体。保留“你的弟兄以色列”的原文亲属隐喻；将希伯来语“找到我们”的习语译为自然汉语“我们所遭遇的”，并用脚注说明其字面形式。
