  text: וַ/יֹּאמְר֨וּ אֵלָ֥י/ו בְּנֵֽי יִשְׂרָאֵ֘ל בַּֽ/מְסִלָּ֣ה נַעֲלֶה֒ וְ/אִם מֵימֶ֤י/ךָ נִשְׁתֶּה֙ אֲנִ֣י וּ/מִקְנַ֔/י וְ/נָתַתִּ֖י מִכְרָ֑/ם רַ֥ק אֵין דָּבָ֖ר בְּ/רַגְלַ֥/י אֶֽעֱבֹֽרָה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/019.yaml
  text: And the sons of Israel said to him[a], “We will go up on the highway, and if I and my livestock drink your water, then I will pay its price. Let me only pass through on foot[c][b], nothing more.”
translation:
  language: zh_hans
  text: 以色列人[a]对他说：“我们要沿大路[b]上去；若我和我的牲畜喝了你的水，我必付水钱。我只求徒步[c]经过，别无他求。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语直译为“以色列的众子”。
    reason: lexical_alternative
  - marker: b
    text: 或译“沿修筑的大道”；这里的希伯来词指修筑起来的大路或高起的道路。
    reason: lexical_alternative
  - marker: c
    text: 直译“用我的脚经过”，意为只是从境内通行。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 希伯来语直译为“以色列的众子”，现代汉语通常以“以色列人”自然表达这一民族称谓；脚注保留原文形式。
- source_word: בַּמְסִלָּה
  choice: 沿大路
  rationale: מְסִלָּה指修筑起来、可供通行的大路；介词在此表示沿着该道路行进。“沿大路”比“在公路上”更符合古代语境和现代汉语习惯。
- source_word: נַעֲלֶה
  choice: 上去
  rationale: 保留动词“上去”的基本方向意义，不将其泛化为“经过”或“行进”。
- source_word: מֵימֶיךָ
  choice: 你的水
  rationale: 希伯来语“水”采用惯常复数形式，汉语用单数集合名词“水”自然表达。
- source_word: נִשְׁתֶּה אֲנִי וּמִקְנַי
  choice: 我和我的牲畜喝了
  rationale: 保留原文从复数“我们”转为单数“我”的变化，反映群体以一个声音发言；מִקְנֶה泛指所拥有的牲畜。
- source_word: וְנָתַתִּי מִכְרָם
  choice: 我必付水钱
  rationale: מֶכֶר表示价款；所付款项在语境中指饮用之水的价钱。“付水钱”简洁、明确且符合汉语表达。
- source_word: רַק אֵין דָּבָר
  choice: 只求……别无他求
  rationale: 该短语限定并弱化请求，表示除单纯过境外没有别的要求；采用前后呼应的汉语结构传达其语用功能。
- source_word: בְּרַגְלַי אֶעֱבֹרָה
  choice: 徒步经过
  rationale: 原文直译为“用我的脚经过”，是表示步行、单纯过境的说法；“徒步经过”保留脚行的含义而避免生硬直译。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。保留原文由复数“我们”转为单数“我”的突变，不擅自统一人称；用“沿大路上去”保存道路和方向信息，以“别无他求”自然呈现请求的限定语气。
