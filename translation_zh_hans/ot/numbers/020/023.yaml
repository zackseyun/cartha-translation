base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/023.yaml
  text: And Yahweh spoke to Moses and to Aaron at Mount Hor[a], on the border of the land of Edom, saying,
translation:
  language: zh_hans
  text: 雅威[a]在以东地边界的何珥山，对摩西和亚伦说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文为“YHWH”；也常音译为“耶和华”。
    reason: 说明原文的神名形式及另一常见音译。
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: אמר的基本意思是“说”；这里引出下一节的直接话语，用“说”最自然准确。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 将四字神名YHWH作为专名处理；“耶和华”是现代中文读者最熟悉的专名形式，并以脚注说明其希伯来文形式及另一常见译法。
- source_word: אֶל מֹשֶׁה וְאֶל אַהֲרֹן
  choice: 对摩西和亚伦
  rationale: אֶל标明说话的对象；中文以一个“对”统领两个并列对象，表达自然，也不损失原意。
- source_word: בְּהֹר הָהָר
  choice: 在何珥山
  rationale: בְּ在此表示地点；הֹר הָהָר是地名，按通行中文形式译作“何珥山”。
- source_word: עַל גְּבוּל אֶרֶץ אֱדוֹם
  choice: 就是以东地的边界
  rationale: עַל גְּבוּל表示位于边界处；“就是”把这一地理说明自然地接在“何珥山”之后。
- source_word: לֵאמֹר
  choice: 说：
  rationale: 这是希伯来叙事中引出话语内容的固定形式；中文用“说：”衔接下一节的直接引语。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用神的专名YHWH，不宜改成“主”这一称号。“耶和华”在现代中文中辨识度最高；脚注保留“雅威”这一更贴近学界重构读音的译法，避免把具体发音视为毫无争议。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“对摩西和亚伦说”符合中文叙事习惯；以冒号表明话语内容见下一节。地名采用通行译名“何珥山”和“以东”。
