  yaml_path: translation/ot/numbers/020/002.yaml
  text: There was no water for the congregation[a], and they assembled against Moses and against Aaron.
translation:
  language: zh_hans
  text: 会众没有水喝[a]，就聚集起来反对摩西和亚伦。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “会众”或译“群体”。希伯来语עֵדָה指聚集在一起的以色列民众。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/לֹא הָיָה מַיִם לָ/עֵדָה
  choice: 会众没有水喝
  rationale: היה与不定名词构成存在表达；לָעֵדָה表示水是供会众使用的。汉语说“没有水喝”比“没有水给会众”自然，也准确表达会众无水可用的处境。句首וְ承接叙事，以后句“就”自然体现事件推进，不另加“现在”。
- source_word: עֵדָה
  choice: 会众
  rationale: 该词指聚集成群的以色列民众；“会众”保留其群体性，并适合本段语境。脚注列出可行译法。
- source_word: וַ/יִּקָּהֲלוּ
  choice: 就聚集起来
  rationale: קהל表示成群聚集；“聚集起来”是自然的现代汉语。“就”体现叙事连续性。
- source_word: עַל מֹשֶׁה וְ/עַל אַהֲרֹן
  choice: 反对摩西和亚伦
  rationale: 本段争闹、抱怨的语境使עַל带有敌对、对抗意味。“反对”准确传达其方向；汉语无须机械重复介词。
