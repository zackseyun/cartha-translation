  text: נַעְבְּרָה נָּ֣א בְ/אַרְצֶ֗/ךָ לֹ֤א נַעֲבֹר֙ בְּ/שָׂדֶ֣ה וּ/בְ/כֶ֔רֶם וְ/לֹ֥א נִשְׁתֶּ֖ה מֵ֣י בְאֵ֑ר דֶּ֧רֶךְ הַ/מֶּ֣לֶךְ נֵלֵ֗ךְ לֹ֤א נִטֶּה֙ יָמִ֣ין וּ/שְׂמֹ֔אול עַ֥ד אֲשֶֽׁר נַעֲבֹ֖ר גְּבוּלֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/017.yaml
  text: Please let us pass through your land[a]. We will not pass through field or vineyard, and we will not drink water from a well. We will go by the king’s road[b]; we will not turn to the right or to the left until we have passed through your border.
translation:
  language: zh_hans
  text: 求你准许我们经过你的领土。我们不经过田地或葡萄园，也不喝井里的水；我们要沿着王的大路[a]行走，不向右或向左偏离，直到越过你的边界[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“王的道路”。
    reason: lexical_alternative
  - marker: b
    text: “边界”也可按上下文理解为对方领土的界限；这里指越过其领土而离境。
    reason: lexical_alternative
lexical_decisions:
- source_word: נַעְבְּרָה נָּא
  choice: 求你准许我们……经过
  rationale: 意愿式配合נָא构成礼貌请求；“求你准许”既保留请求语气，也符合庄重、自然的现代汉语。
- source_word: בְאַרְצֶךָ
  choice: 从你的领土经过
  rationale: 介词ב与עבר连用时表示从某地穿行；“领土”在向以东王提出过境请求的语境中比泛指土地的“地”更明确。
- source_word: לֹא נַעֲבֹר בְּשָׂדֶה וּבְכֶרֶם
  choice: 我们不穿过田地或葡萄园
  rationale: 两个单数名词在此作类指；“或”自然表达两类耕作区域都不会进入。
- source_word: וְלֹא נִשְׁתֶּה מֵי בְאֵר
  choice: 也不喝井里的水
  rationale: 准确表达构词短语“井之水”，并采用普通现代汉语说法。
- source_word: דֶּרֶךְ הַמֶּלֶךְ
  choice: 王的大道
  rationale: 直译为“王的道路”。“王的大道”可指受王权管理或指定的干道，并避免现代汉语“王道”常有的政治伦理含义。
- source_word: נֵלֵךְ
  choice: 沿着……走
  rationale: הלך在这里指沿指定路线行进；“沿着……走”清楚呈现不离开道路的承诺。
- source_word: לֹא נִטֶּה יָמִין וּשְׂמֹאול
  choice: 不偏向右，也不偏向左
  rationale: 保留原文成对的方向用语及“不偏离路线”的含义。
- source_word: עַד אֲשֶׁר נַעֲבֹר גְּבוּלֶךָ
  choice: 直到穿过你的疆域
  rationale: גְּבוּל既可指边界，也可指边界以内的疆域；本句语境强调完成对以东领土的穿越，因此正文采用“穿过你的疆域”，并以脚注保留边界义。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的外交请求语体。保留原文反复出现的“经过／穿过”意象，并用分号衔接路线承诺。英文咨询层的脚注标记与脚注内容位置明显错配，故依希伯来文分别将道路异译置于[a]、疆界歧义置于[b]。
