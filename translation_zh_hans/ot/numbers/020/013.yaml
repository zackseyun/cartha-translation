  text: הֵ֚מָּה מֵ֣י מְרִיבָ֔ה אֲשֶׁר רָב֥וּ בְנֵֽי יִשְׂרָאֵ֖ל אֶת יְהוָ֑ה וַ/יִּקָּדֵ֖שׁ בָּֽ/ם־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/013.yaml
  text: These are the waters of Meribah, where the sons of Israel quarreled with Yahweh, and he showed himself holy among them.
translation:
  language: zh_hans
  text: 这些水就是米利巴水[a]；以色列人在那里与耶和华争闹，耶和华在他们中间显为圣[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “米利巴”意思是“争闹”或“争竞”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“耶和华在他们身上被尊为圣”，或“耶和华借着他们显明自己是圣的”。
    reason: alternative_reading
lexical_decisions:
- source_word: הֵמָּה
  choice: 这些水就是
  rationale: 希伯来语代词用于指认并命名前述的水；汉语补出“水”，使指代清楚，并以“就是”自然表达命名句式。
- source_word: מֵי מְרִיבָה
  choice: 米利巴水
  rationale: מְרִיבָה在本叙事中已成为地名，正文采用音译“米利巴”，并在脚注说明其“争闹、争竞”的词义。
- source_word: רָבוּ
  choice: 争闹
  rationale: ריב表示争执、争竞；“争闹”既符合本段叙事，也与“米利巴”名称的含义形成呼应。
- source_word: בְנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 这是指以色列群体的固定族称；现代汉语用“以色列人”准确而自然，避免生硬的逐字表达“以色列的众子”。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以中文读者熟悉的专名“耶和华”呈现四字神名，而不以“主”这一称号替代。
- source_word: וַיִּקָּדֵשׁ
  choice: 显为圣
  rationale: קדש的Nifal形态在这里表示耶和华的圣洁在事件中得到彰显或被认明；“显为圣”保留其被动—反身张力，又不暗示人使上帝本身成为圣洁。
- source_word: בָּם
  choice: 在他们中间
  rationale: 介词ב在此可表示“在他们中间／在他们身上／借着他们”；正文采用符合语境且较少解释性的“在他们中间”，其他可能见脚注。
theological_decisions:
- issue: 末句如何表达耶和华“被尊为圣／显为圣”
  choice: 耶和华也在他们中间显为圣
  alternative: 耶和华也在他们身上被尊为圣／借着他们显明自己是圣的
  rationale: 原文Nifal形式容许被动或反身理解。正文用“显为圣”避免误解为耶和华原先并非圣洁，同时保留其圣洁在这次事件中被彰显的意思；脚注列出其他语法可能。
- issue: בְנֵי יִשְׂרָאֵל是否逐字译作阳性亲属称谓
  choice: 以色列人
  alternative: 以色列众子／以色列的子孙
  rationale: 此处是全体民族的惯用称呼，并非专门强调亲子关系或男性成员；现代汉语族称“以色列人”既忠实于实际所指，也更自然清楚。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“这些水就是”承接上文并自然引出命名；重复“耶和华”而不用含混的代词，使末句主语在中文中清楚。
