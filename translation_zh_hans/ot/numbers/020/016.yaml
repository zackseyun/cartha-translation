base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/016.yaml
  text: And we cried out to Yahweh[a], and he heard our voice and sent an angel and brought us out of Egypt. And look, we are in Kadesh, a city at the edge of your border.
translation:
  language: zh_hans
  text: 我们向耶和华呼求；他听见了我们的声音，就差遣了一位使者[a]，把我们从埃及领了出来。看哪，我们现在在加低斯，一座位于你边界尽头的城。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“一位天使”。希伯来语这个词既可指人，也可指天使；在这里，许多人理解为上帝所差来的天使。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַנִּצְעַק
  choice: 我们……呼求
  rationale: צעק表示在困苦中急切求助；“呼求”既保留强烈语气，也符合现代汉语的经文语体。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文读者熟悉的专名“耶和华”对应四字神名，保留其作为以色列之上帝名字的性质，而不以一般称号替代。
- source_word: וַיִּשְׁמַע קֹלֵנוּ
  choice: 他听见了我们的声音
  rationale: 原文明确含有“我们的声音”；此直译在汉语中自然，也保留了上帝垂听呼求的表达形象。
- source_word: מַלְאָךְ
  choice: 一位使者
  rationale: מַלְאָךְ本义为受差遣的使者，可指人间使者，也可指天使；正文采用较中性的“使者”，不越过本节所明确说明的范围，脚注保留“天使”的可能。
- source_word: וַיֹּצִאֵנוּ מִמִּצְרָיִם
  choice: 把我们从埃及领了出来
  rationale: 使役式יצא表示“使出来、带出来”；“领了出来”自然体现带领以色列出埃及的行动。
- source_word: וְהִנֵּה
  choice: 看哪，现在
  rationale: הִנֵּה用于唤起对当前处境的注意；“看哪”保留其强调功能，“现在”则使汉语衔接自然。
- source_word: עִיר קְצֵה גְבוּלֶךָ
  choice: 你边界上的一座城
  rationale: 该结构说明加低斯位于对方疆界的边缘；“边界上”简洁自然，并保留空间关系。
theological_decisions:
- issue: 出埃及叙述中מַלְאָךְ所指者的身份
  choice: 正文译作“一位使者”，不进一步界定其身份。
  alternative: 译作“一位天使”，或将其理解为具有特殊神圣身份的使者。
  rationale: 本节只说耶和华差遣了מַלְאָךְ，并未进一步指明其确切身份；采用词义较宽的“使者”，并在脚注说明“天使”的可能，可保留原文的含混与神学张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“呼求”“听见了我们的声音”贴近原文措辞；“看哪”保留话语中的提示和强调作用，同时避免整体语言过于古雅。
