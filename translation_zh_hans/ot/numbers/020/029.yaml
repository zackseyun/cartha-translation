  text: וַ/יִּרְאוּ֙ כָּל הָ֣/עֵדָ֔ה כִּ֥י גָוַ֖ע אַהֲרֹ֑ן וַ/יִּבְכּ֤וּ אֶֽת אַהֲרֹן֙ שְׁלֹשִׁ֣ים י֔וֹם כֹּ֖ל בֵּ֥ית יִשְׂרָאֵֽל־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/029.yaml
  text: When all the congregation saw that Aaron had died[b][a], all the house of Israel wept for Aaron thirty days.
translation:
  language: zh_hans
  text: 全体会众看见亚伦已经死了[a]，以色列全家[b]就为亚伦哀哭了三十天。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “看见”也可理解为“得知”或“意识到”。希伯来文直译为“看见亚伦已经死了”，其中“看见”可以包括认清这一事实。
    reason: lexical_alternative
  - marker: b
    text: “以色列全家”是把全体以色列民视为一个整体的说法。
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּרְאוּ
  choice: 看见
  rationale: ראה的基本意思是“看见”；在本语境中也可指认清或得知事实。正文保留原文的具体表达，脚注说明其语义范围。
- source_word: כָּל הָעֵדָה
  choice: 全体会众
  rationale: עֵדָה指以色列共同体或聚集的会众。“全体会众”庄重自然，也保留群体含义。
- source_word: כִּי
  choice: （看见）……已经
  rationale: 此处כִּי引出“看见／认清”的内容；汉语不必另译“that”，而以宾语从句自然表达。
- source_word: גָוַע
  choice: 已经死了
  rationale: גוע表示断气、死亡，常用于庄重叙事。“死了”清楚自然，“已经”标明死亡先于会众的看见或得知。
- source_word: וַיִּבְכּוּ
  choice: 就……哀哭
  rationale: בכה的核心意思是哭泣；此处是为死者举哀，“哀哭”既保留哭泣的情感力度，也符合丧葬语境。
- source_word: אֶת אַהֲרֹן
  choice: 为亚伦
  rationale: בכה后接直接宾语标记时，所指是被哀悼的人；汉语以“为亚伦哀哭”表达自然。
- source_word: שְׁלֹשִׁים יוֹם
  choice: 三十天
  rationale: 原文为表示持续时间的结构，汉语直接置于动词之后即可清楚表达时长。
- source_word: כֹּל בֵּית יִשְׂרָאֵל
  choice: 以色列全家
  rationale: בֵּית יִשְׂרָאֵל是将以色列民视为一个整体的群体称谓。“以色列全家”保留“家”的整体性意象；“全”表达כֹּל。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“全体会众”与“以色列全家”分别保留原文两个群体称谓；句序按现代汉语调整，使末句主语清晰。“哀哭”贴合死亡语境，但未将动作泛化为仅仅“哀悼”。
