base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/028.yaml
  text: So Moses stripped Aaron of his garments and put them on Eleazar his son[a], and Aaron died there on the top of the mountain[b]. Then Moses and Eleazar came down from the mountain.
translation:
  language: zh_hans
  text: 摩西脱下亚伦的衣服，给亚伦的儿子以利亚撒穿上[a]。亚伦就死在那里，在山顶上[b]。随后，摩西和以利亚撒从山上下来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里是把亚伦作为祭司所穿的衣服给以利亚撒穿上，表明以利亚撒承接祭司职分；参见本段上下文。
    reason: cultural_note
  - marker: b
    text: 或译：“在山峰上”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּפְשֵׁט ... אֶת בְּגָדָיו
  choice: 脱下亚伦的衣服
  rationale: פשט的使役式在此指从某人身上脱去衣物；בגד是普通的“衣服”一词。译文保留具体动作，也不在正文中增添原文未明说的“祭司”一词。
- source_word: וַיַּלְבֵּשׁ אֹתָם אֶת אֶלְעָזָר בְּנוֹ
  choice: 给他儿子以利亚撒穿上
  rationale: לבש的使役式意为“给某人穿上”；中文依上下文可自然省略已明确的宾语“这些衣服”，同时“他儿子”忠实保留亲属关系。
- source_word: וַיָּמָת
  choice: 死
  rationale: מות是普通、直接的“死”，不采用委婉说法。
- source_word: שָׁם
  choice: 在那里
  rationale: 明确保留原文的地点副词。
- source_word: בְּרֹאשׁ הָהָר
  choice: 在山顶上
  rationale: רֹאשׁ本义为“头”，用于山时指山的顶部或峰顶；“山顶”是现代汉语中自然而准确的表达。
- source_word: וַיֵּרֶד ... מִן הָהָר
  choice: 从山上下来
  rationale: ירד表示向下移动，מן标明起点；“从山上下来”符合现代汉语叙事习惯。
theological_decisions:
- issue: 转交给以利亚撒的衣服具有何种身份意义
  choice: 正文只译“衣服”，脚注说明是祭司职分承接中的祭司服
  alternative: 正文译作“祭司服”或“大祭司的礼服”
  rationale: 本节使用普通名词בְּגָדָיו“他的衣服”，上下文则显示这些衣服具有祭司职分传承的意义。正文不把上下文信息写成词义本身，脚注用于解释文化和叙事背景。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“脱下……给……穿上”具体自然；用“衣服”而非较书面的“衣袍”或带有额外制度色彩的“祭司礼服”。以短句呈现亚伦死亡这一叙事转折，并保留“在那里”和“山顶上”两个地点成分。
