  text: וַ/יִּקַּ֥ח מֹשֶׁ֛ה אֶת הַ/מַּטֶּ֖ה מִ/לִּ/פְנֵ֣י יְהוָ֑ה כַּ/אֲשֶׁ֖ר צִוָּֽ/הוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/009.yaml
  text: So Moses took the staff from before Yahweh[a], just as he had commanded him.
translation:
  language: zh_hans
  text: 于是，摩西从雅威面前取了那根杖[a]，正如雅威所吩咐他的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “杖”也可译作“棍”。
    reason: 词语מַטֶּה在此指一件具体的杖状器物；正文用“杖”，脚注保留“棍”这一可行的词汇替代。
lexical_decisions:
- source_word: וַיִּקַּח
  choice: 取了
  rationale: לקח的Qal叙事形式表示随后发生的简单动作；“取了”自然准确，不额外加入“拿起”等原文未必包含的意味。
- source_word: מֹשֶׁה
  choice: 摩西
  rationale: 采用该人名在现代中文圣经传统中的通行译名。
- source_word: הַמַּטֶּה
  choice: 那根杖
  rationale: מַטֶּה在此指具体器物，可译“杖”或“棍”；“杖”既符合上下文，也保留其作为摩西所持之杖的叙事关联。定冠词译作“那根”，表明是上下文中已经提到的杖。
- source_word: מִלִּפְנֵי
  choice: 从……面前
  rationale: 保留介词短语具体的空间意象及敬拜场所语境，避免扩译为较抽象的“从……的同在中”。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代中文常见音译呈现四字神名，而不以“主”等称号替代。
- source_word: כַּאֲשֶׁר
  choice: 照
  rationale: 自然表达摩西的行动与先前命令相符；“照……所……”准确传达比较及遵行关系。
- source_word: צִוָּהוּ
  choice: 所吩咐他的
  rationale: צוה表示带权威的命令；关系从句在中文中自然体现命令先于取杖这一动作，其中两个代词分别指雅威和摩西。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”较贴近学界通行的重构读音，并保留其作为专名的性质，不改用称号。
- issue: “从雅威面前”的空间及礼仪含义
  choice: 保留“从雅威面前”
  alternative: 从雅威的同在中
  rationale: 原文מִלִּפְנֵי具有具体空间表达，同时可能带有礼仪场所含义；直译可保留这种张力，而不把它纯粹抽象化。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“于是”承接前文，“照……所吩咐他的”符合自然汉语语序；保留“从雅威面前”的希伯来语具体意象。
