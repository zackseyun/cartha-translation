  naturalness: “于是，摩西照雅威所吩咐他的，从雅威面前取了那根杖”在现代汉语中略显倒置，也使“雅威”短距离重复。改为先叙述取杖，后以“正如雅威所吩咐他的”作补充，较自然庄重。
