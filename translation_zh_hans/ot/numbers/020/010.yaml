base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/010.yaml
  text: 'Then Moses and Aaron assembled the assembly before the rock, and he said to them, “Listen now, you rebels: shall we bring out water for you from this rock?”'
translation:
  language: zh_hans
  text: 于是，摩西和亚伦把会众召集到磐石前。摩西对他们说：“你们这些悖逆的人，听着！难道我们要从这磐石中为你们引出[a]水来吗？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “引出”也可译作“使……出来”。
    reason: 说明נוֹצִיא的使役含义及直译可能。
lexical_decisions:
- source_word: וַיַּקְהִלוּ
  choice: 召集
  rationale: 该词是קהל的使役式，表示使人聚集；“召集”自然地保留了使役含义。
- source_word: הַקָּהָל
  choice: 会众
  rationale: 指聚集起来的群体；“会众”在现代中文中自然庄重，也避免生硬重复“召集……集会”。
- source_word: אֶל־פְּנֵי הַסָּלַע
  choice: 到磐石前
  rationale: 准确表达趋向及位于磐石前面的空间关系。
- source_word: וַיֹּאמֶר
  choice: 摩西对他们说
  rationale: 原文动词为单数，最近且自然的指称对象是摩西；中文明示主语可避免复合主语后的歧义。
- source_word: שִׁמְעוּ נָא
  choice: 听着
  rationale: 表达命令及נָא在此处加强语气的作用，比礼貌性的“请听”更符合斥责语境。
- source_word: הַמֹּרִים
  choice: 你们这些悖逆的人
  rationale: 该实词化分词源于מרה，指以悖逆为特征的人；译法直接而不失庄重。
- source_word: הֲמִן הַסֶּלַע הַזֶּה
  choice: 难道……从这磐石中
  rationale: הֲ标明疑问，מִן标明来源；“难道”贴合语境中的反问语气，“从……中”自然表达水由磐石而出。
- source_word: נוֹצִיא
  choice: 我们要……引出
  rationale: יצא的使役式意为使之出来；“引出”保留使役含义，且第一人称复数“我们”得到明确保留。
- source_word: מָיִם
  choice: 水
  rationale: 该词的标准现代汉语对应词。
theological_decisions:
- issue: 摩西问句中的第一人称复数
  choice: 难道我们要从这磐石中为你们引出水来吗？
  alternative: 难道水会从这磐石中为你们流出来吗？
  rationale: 原文נוֹצִיא明确是第一人称复数使役式。保留“我们”及人的施事表述，不以神为隐含主语来消解摩西、亚伦与神之作为之间的神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“会众”符合民数记的群体语境；用“磐石”保持经文体裁的庄重感。反问句保留原文的强烈责问语气。
