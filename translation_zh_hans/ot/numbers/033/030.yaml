lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: 他们……出发
  rationale: נסע在旷野行程记录的固定句式中指从一处营地启程；“出发”自然、简洁，也能清楚体现行程的推进。
- source_word: מֵחַשְׁמֹנָה
  choice: 从哈实摩拿
  rationale: 前缀מֵ译作“从”；חַשְׁמֹנָה是地名，按其希伯来语读音音译为“哈实摩拿”。
- source_word: וַיַּחֲנוּ
  choice: 安营
  rationale: חנה在行程语境中指扎营、驻营；“安营”是现代中文圣经叙事中自然且庄重的表达。
- source_word: בְּמֹסֵרֹת
  choice: 在摩西录
  rationale: 介词בְּ在行程记录中表示停驻地点，译作“在”；מֹסֵרֹת为地名，按希伯来语音译为“摩西录”。
