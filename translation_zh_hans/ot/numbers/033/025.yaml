  language: zh_hans
  text: 他们从哈拉大起行，在玛吉希录安营。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: 起行
  rationale: נסע在旷野行程记录的固定句式中，表示从一处营地出发；“起行”简洁自然，也保留了开始行程的含义。
- source_word: מֵחֲרָדָה
  choice: 从哈拉大
  rationale: 介词מִן表示出发的地点；חֲרָדָה是地名，按现代中文圣经常见译名音译为“哈拉大”。
- source_word: וַיַּחֲנוּ
  choice: 安营
  rationale: חנה在行程记录中指扎营、驻营；“安营”符合中文叙事习惯，也与本章反复出现的行程句式相称。
- source_word: בְּמַקְהֵלֹת
  choice: 在玛吉希录
  rationale: 介词בְ在此标明扎营地点；מַקְהֵלֹת是地名，按现代中文圣经常见译名音译为“玛吉希录”。
