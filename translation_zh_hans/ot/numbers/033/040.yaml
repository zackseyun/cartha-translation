base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/040.yaml
  text: And the Canaanite king of Arad[a], who lived in the Negev in the land of Canaan[b], heard when the sons of Israel came.
translation:
  language: zh_hans
  text: 住在迦南地的南地[b]的迦南人亚拉得王，听说以色列人[a]来了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “以色列人”希伯来文直译为“以色列的儿子们”。
    reason: lexical_alternative
  - marker: b
    text: “南地”也可译为“南方”或“南部地区”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: 听说
  rationale: שׁמע在此没有明示宾语，后接בְּ加不定式结构，说明听闻的时机或内容。汉语用“听说……来了”自然地表达这种省略宾语的结构，又不另行添加“消息”等原文没有的名词。
- source_word: הַכְּנַעֲנִי מֶלֶךְ עֲרָד
  choice: 迦南人亚拉得王
  rationale: 保留“迦南人”这一族属说明，并将其与“亚拉得王”按现代汉语习惯紧密组合。定冠词的指称作用由整个名词短语自然体现。
- source_word: וְהוּא יֹשֵׁב
  choice: 住在
  rationale: 代词加分词提供背景性描述；汉语以前置定语“住在……的”自然表达，既不把它处理成新的主线动作，也保留其描述功能。
- source_word: בַּנֶּגֶב
  choice: 南地
  rationale: נֶגֶב在此指迦南南部的特定地理区域。采用中文圣经地理名称“南地”，既保留专名性质，也比泛称“南方”更准确。
- source_word: בְּאֶרֶץ כְּנָעַן
  choice: 在迦南地
  rationale: 保留原文אֶרֶץ“地”的明确表达及其地理强调。
- source_word: בְּבֹא
  choice: ……来了
  rationale: ב加בוא的不定式结构在此具有时间或情境功能。原文没有明说进入何处，因此译作“来了”，不补入“进入迦南”等对象。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 该固定族群称谓在现代汉语中自然译为“以色列人”。逐字译作“以色列的儿子们”容易被误解为仅指男性直系儿子，因此将字面形式置于脚注。
theological_decisions: []
