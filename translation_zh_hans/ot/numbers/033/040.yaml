  terminology: “亚拉得”“南地”“迦南人”和“以色列人”均合适。应补回与英语审校轨迹中“Negev/南地”词义选择相对应的脚注，并将其锚点置于“南地”后；“以色列人”的字面译法脚注也应紧随该词。
