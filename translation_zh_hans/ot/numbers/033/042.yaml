lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: 他们……起行
  rationale: נסע在旷野行程清单的固定句式中，指拔营出发；“起行”简洁自然，也能保留反复出现的行程公式。
- source_word: מִצַּלְמֹנָה
  choice: 从撒摩拿
  rationale: 介词מִן译为“从”；地名צַלְמֹנָה按希伯来语音译为“撒摩拿”。
- source_word: וַיַּחֲנוּ
  choice: 在……安营
  rationale: חנה在行程语境中指驻扎、扎营；“安营”符合现代中文圣经叙事的庄重语体，并与“起行”自然对应。
- source_word: בְּפוּנֹן
  choice: 在普嫩
  rationale: 介词בְּ在宿营地点前译为“在”；地名פּוּנֹן按希伯来语音译为“普嫩”。
