  text: They set out from Rimmon-perez and camped at Libnah.
translation:
  language: zh_hans
  text: 他们从临门·帕烈起行，在立拿安营。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: 起行
  rationale: נסע在旷野行程记录的固定句式中指从一处营站出发；“起行”简洁自然，也与《民数记》行程语境相称。
- source_word: מֵרִמֹּן פָּרֶץ
  choice: 从临门·帕烈
  rationale: מִן表示“从”；רִמֹּן פָּרֶץ是复合地名，按音译处理，以间隔号标明两个音译成分。
- source_word: וַיַּחֲנוּ
  choice: 安营
  rationale: חנה在行程记录中表示驻扎、扎营；“安营”是现代中文圣经叙事中清楚而庄重的表达。
- source_word: בְּלִבְנָה
  choice: 在立拿
  rationale: 介词בְּ在此标示驻营地点，译为“在”；לִבְנָה作为地名音译为“立拿”。
