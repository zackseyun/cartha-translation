id: NUM.33.50
reference: Numbers 33:50
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יְדַבֵּ֧ר יְהוָ֛ה אֶל מֹשֶׁ֖ה בְּ/עַֽרְבֹ֣ת מוֹאָ֑ב עַל יַרְדֵּ֥ן יְרֵח֖וֹ לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/050.yaml
  text: And Yahweh spoke to Moses in the plains of Moab by the Jordan at Jericho[a], saying,
translation:
  language: zh_hans
  text: 雅威在摩押平原[a]，在耶利哥附近的约旦河边，对摩西说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“摩押草原”。
    reason: 希伯来语עֲרָבוֹת可指平原，也可指较干旱的草原、旷野地带。
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: 对……说
  rationale: 该动词连同前置的叙事连接形式推进叙事。汉语用“对……说”自然引出下文直接引语；若机械地译成“讲话……说”，会显得重复生硬。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来语四字神名的通行汉语音译处理，保留其专名性质，不以称号替代。
- source_word: מֹשֶׁה
  choice: 摩西
  rationale: 采用该人名通行的现代汉语译名。
- source_word: בְּעַרְבֹת
  choice: 在……平原
  rationale: עֲרָבוֹת指平坦、较干旱的草原或旷野地带；“平原”自然清楚，也符合此地理名称的汉语惯用表达。其“草原”义以脚注保留。
- source_word: מוֹאָב
  choice: 摩押
  rationale: 采用该地名通行的现代汉语译名。
- source_word: עַל יַרְדֵּן יְרֵחוֹ
  choice: 在耶利哥附近的约旦河边
  rationale: 此处עַל表达临近河流的位置；יַרְדֵּן יְרֵחוֹ把这段约旦河与耶利哥联系起来。“附近”避免让人误以为地点位于河面上，同时不把原文明确化为并未直接出现的“对面”。
- source_word: לֵאמֹר
  choice: 说：
  rationale: 该不定式引出下一节的直接话语。汉语以“说：”和冒号自然表达这一功能。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用以四个辅音字母构成的神名。译作“雅威”旨在按较常见的学术重构发音音译，保留其作为以色列之神专名的性质；“耶和华”是历史悠久的另一种汉语形式，但反映的是后期形成的混合读法。
translation_notes:
  register: 采用现代、庄重而自然的叙事语言。将地点成分依汉语习惯前置；不使用较古雅的“晓谕”，也不为保留דבר与אמר的形式区别而制造“讲话说”之类生硬重复。
