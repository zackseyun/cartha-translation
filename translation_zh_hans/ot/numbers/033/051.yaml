lexical_decisions:
- source_word: דַּבֵּר
  choice: 告诉
  rationale: 该词是 דבר 的 Piel 祈使式，命令摩西向百姓传达信息；现代汉语用“告诉”自然清楚，并与后面的“对他们说”共同保留原文两个言说动词。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 字面为“以色列的众子”，在此是对整个以色列群体的惯用称呼；“以色列人”符合现代汉语表达，不会误解为仅指雅各的亲生儿子。
- source_word: וְאָמַרְתָּ אֲלֵהֶם
  choice: 对他们说
  rationale: 保留 אמר 及其间接宾语，也保留它与前一个言说命令之间的重复结构。
- source_word: כִּי אַתֶּם עֹבְרִים
  choice: 你们……的时候
  rationale: כִּי 与代词加分词在本语境中引出即将发生的过河行动；用时间从句自然表达其前瞻性，同时不把行动说成已经发生。
- source_word: אֶת הַיַּרְדֵּן
  choice: 过约旦河
  rationale: יַרְדֵּן 是河名；汉语通常加“河”，而动词 עבר 在此表示渡过、越过。
- source_word: אֶל אֶרֶץ כְּנָעַן
  choice: 进入迦南地
  rationale: אֶל 在越过边界的语境中表示朝向并进入；“迦南地”保留 אֶרֶץ。
