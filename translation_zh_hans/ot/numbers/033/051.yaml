  text: 你要告诉以色列人，对他们说：‘你们过[a]约旦河、进入迦南地的时候，’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你们即将过约旦河、进入迦南地。”原文使用分词，可表达即将发生的动作。
