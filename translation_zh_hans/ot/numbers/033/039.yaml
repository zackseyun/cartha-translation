  text: And Aaron was one hundred twenty-three years old when he died on Mount Hor.
translation:
  language: zh_hans
  text: 亚伦死在何珥山时，年一百二十三岁。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/אַהֲרֹן
  choice: 亚伦
  rationale: 连词 ו 承接上文；本节在中文中不必机械译作“并且”，省略后更自然。专名 אַהֲרֹן 采用现代中文圣经通行译名“亚伦”。
- source_word: בֶּן שָׁלֹשׁ וְ/עֶשְׂרִים וּ/מְאַת שָׁנָה
  choice: 年一百二十三岁
  rationale: 希伯来语“בן＋岁数＋שנה”是表示年龄的惯用结构。译作“年一百二十三岁”既准确，又符合庄重、自然的现代汉语表达。
- source_word: בְּ/מֹת/וֹ
  choice: 死……时
  rationale: 介词 בְּ 加带第三人称单数阳性后缀的 מוֹת，在这里表达时间关系，意为“他死的时候”。汉语用“死……时”简洁地保留这一时间意义。
- source_word: בְּ/הֹר הָ/הָר
  choice: 在何珥山
  rationale: הֹר הָהָר 是地名“何珥山”；介词 בְּ 在这里表示地点，译作“在”。“何珥山”沿用现代中文圣经常见地名译法。
