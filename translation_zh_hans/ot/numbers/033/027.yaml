  rationale: חנה在行程语境中指扎营驻留；“安营”是现代中文中清楚而庄重的表达。
- source_word: בְּתָרַח
  choice: 在他拉
  rationale: 介词בְּ在营地名称前表示所在地点，译为“在”；地名תָּרַח音译为“他拉”。
