  yaml_path: translation/ot/numbers/033/010.yaml
  text: They set out from Elim and camped by the Red Sea[a].
translation:
  language: zh_hans
  text: 他们从以琳起行，在红海边安营。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“芦苇海”。希伯来语名称“亚姆·苏夫”（Yam Suph）传统上译作“红海”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: 起行
  rationale: 在旷野行程清单的固定表达中，נסע指从一处营地出发；“起行”简洁自然，也保留了行程叙述的格式。
- source_word: מֵאֵילִם
  choice: 从以琳
  rationale: 介词מִן表示出发地点；אֵילִם是地名，按通行中文译名音译为“以琳”。
- source_word: וַיַּחֲנוּ
  choice: 安营
  rationale: חנה是行程记载中表示扎营的常用动词；“安营”准确、庄重，也符合现代中文圣经叙事语体。
- source_word: עַל
  choice: 在……边
  rationale: עַל虽常有“在……上”之义，但与海域及扎营语境连用时表示临近、靠近；译作“在……边”符合自然中文。
- source_word: יַם סוּף
  choice: 红海
  rationale: 这是该希伯来地名的传统通行译法；סוּף也可理解为“芦苇”，因此将“芦苇海”保留在脚注中，以呈现词义上的真实可能性。
