  text: 他们从密特加出发，在哈施摩拿安营。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: 他们……出发
  rationale: נסע在旷野行程表的固定句式中表示拔营离开一站、前往下一站；“出发”符合现代汉语表达，并保留移动启程之意。
- source_word: מִמִּתְקָה
  choice: 从密特加
  rationale: 前缀介词מִן表示“从”；מִתְקָה是地名，按希伯来语读音音译为“密特加”。
- source_word: וַיַּחֲנוּ
  choice: 安营
  rationale: חנה是行程记载中表示驻扎、扎营的常用动词；“安营”简洁自然，也符合圣经行程叙述的庄重语体。
- source_word: בְּחַשְׁמֹנָה
  choice: 在哈施摩拿
  rationale: 介词בְּ在营地名称前表示驻扎地点，译作“在”；חַשְׁמֹנָה为地名，按希伯来语读音音译为“哈施摩拿”。
