  text: 他们从玛基希录起程，在他哈安营。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: 他们……起程
  rationale: נסע在旷野行程表的固定句式中表示离开一处营地继续行进；“起程”自然简洁，并保留出发的动态含义。
- source_word: מִמַּקְהֵלֹת
  choice: 从玛吉希录
  rationale: מִן表示“从”；מַקְהֵלֹת是地名，采用现代中文圣经中较通行的音译“玛吉希录”，不按其词形可能引出的普通名词意义翻译。
- source_word: וַיַּחֲנוּ
  choice: 安营
  rationale: חנה在行程记载中指抵达下一站并扎营；“安营”符合现代中文叙事习惯，也与本章反复出现的行程格式协调。
- source_word: בְּתָחַת
  choice: 在他哈
  rationale: בְּ在此标示扎营地点，译为“在”；תָחַת在这里是专名，音译为“他哈”，不按同形普通词的意义翻译。
