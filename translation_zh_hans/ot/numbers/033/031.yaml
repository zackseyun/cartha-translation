lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: 起程
  rationale: נסע在民数记33章的行程公式中指拔营出发；“起程”简洁自然，也适合本章反复出现的叙述格式。
- source_word: מִמֹּסֵרֹות
  choice: 从摩西录
  rationale: 前缀מִן表示“从”；מֹסֵרוֹת是地名，采用音译“摩西录”，不按其词形翻译。
- source_word: וַיַּחֲנוּ
  choice: 安营
  rationale: חנה在旷野行程语境中表示驻扎、扎营；“安营”庄重而通俗。
- source_word: בִּבְנֵי יַעֲקָן
  choice: 在比尼·雅干
  rationale: ב在营地名称前按汉语习惯译为“在”；בְנֵי יַעֲקָן字面为“雅干之子”，但此处在行程名单中用作地名，因此音译。
