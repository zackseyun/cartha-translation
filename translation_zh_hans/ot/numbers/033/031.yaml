  yaml_path: translation/ot/numbers/033/031.yaml
  text: They set out from Moseroth and camped at Bene-jaakan[a].
translation:
  language: zh_hans
  text: 他们从摩西录起程，在比尼·雅干[a]安营。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “比尼·雅干”希伯来文直译为“雅干之子”，但这里用作地名。
