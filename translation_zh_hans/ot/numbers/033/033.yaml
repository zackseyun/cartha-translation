lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: 他们……起行
  rationale: נסע在旷野行程表的固定句式中表示离开上一站继续上路。“起行”简洁自然，也与本章反复出现的行程句式协调。
- source_word: מֵחֹר הַגִּדְגָּד
  choice: 从何珥·哈吉甲
  rationale: מִן表示出发地点；חֹר הַגִּדְגָּד按专名音译为“何珥·哈吉甲”，中点标示复合地名的两个组成部分，不把名称含义另行翻译。
- source_word: וַיַּחֲנוּ
  choice: 安营
  rationale: חנה在行程记载中指扎营停驻。“安营”是现代中文圣经叙事中自然、清楚而庄重的表达。
- source_word: בְּיָטְבָתָה
  choice: 在约巴他
  rationale: בְּ标示停驻地点；יָטְבָתָה作为地名音译为“约巴他”。
