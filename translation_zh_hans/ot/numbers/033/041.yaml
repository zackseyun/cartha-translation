lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: 出发
  rationale: נסע在行程记载中常指拔营启程；“出发”符合现代汉语旅行叙事的表达，也与本章反复出现的行程公式相称。
- source_word: מֵהֹר הָהָר
  choice: 从何珥山
  rationale: הֹר הָהָר是固定地名，中文按通行的圣经地名形式译作“何珥山”；介词מִן译为“从”。
- source_word: וַיַּחֲנוּ
  choice: 安营
  rationale: חנה在旷野行程中指扎营驻留；“安营”简洁、庄重，又是现代读者易懂的常用圣经行程用语。
- source_word: בְּצַלְמֹנָה
  choice: 在撒摩拿
  rationale: 介词בְ在此表示地点，译作“在”；צַלְמֹנָה按通行音译处理为“撒摩拿”。
