  text: while the Egyptians were burying those whom Yahweh had struck down among them[a], all the firstborn; and on their gods Yahweh had executed judgments.
translation:
  language: zh_hans
  text: 那时，埃及人正在埋葬雅威在他们中间击杀的人，就是所有的长子；雅威也向他们的诸神施行了审判。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּמִצְרַיִם מְקַבְּרִים
  choice: 那时，埃及人正在埋葬
  rationale: 名词加分词在叙事中构成背景性的伴随情状；“那时……正在”自然表达以色列人出发时仍在进行的动作。
- source_word: אֵת אֲשֶׁר הִכָּה יְהוָה בָּהֶם
  choice: 耶和华在他们中间击杀的人
  rationale: 保留“……的人”这一关系结构；נכה在长子之灾的语境中指致死击打，译作“击杀”兼顾动作意象与结果；בָּהֶם按群体范围译为“在他们中间”。
- source_word: כָּל בְּכוֹר
  choice: 就是所有的长子
  rationale: 按希伯来语后置同位说明的结构翻译，不擅自加上“他们的”，避免把原文关系过度明确化。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者最熟悉、庄重且可辨识的四字神名音译。
- source_word: וּבֵאלֹהֵיהֶם
  choice: 也向他们的神明
  rationale: ב与“施行审判”连用可表达审判所针对的对象；“向”在现代汉语中自然。“神明”明确指埃及诸神，又不将其解释性改写为“偶像”。
- source_word: עָשָׂה ... שְׁפָטִים
  choice: 施行了审判
  rationale: 这是固定搭配，意为实施审判性的行动；“施行审判”庄重、清楚，也贴近原文。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用四字神名。中文正文采用通行且可识别的专名“耶和华”，而不以“主”这一称号替代，保留专名性质。
- issue: “他们的神明”的所指
  choice: 保留为埃及人的神明
  alternative: 偶像；统治者
  rationale: אֱלֹהֵיהֶם在出埃及审判语境中直接指埃及诸神；不将其化约为人的统治者，也不以“偶像”预先加入解释性评价。
- issue: 审判与埃及诸神的关系
  choice: 耶和华向他们的神明施行审判
  alternative: 耶和华在他们的神明中施行审判
  rationale: 介词ב可有一定语义幅度；结合עשה שפטים，“向／对……施行审判”最自然地表达诸神是审判对象，同时不展开原文未明说的实施方式。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。保留原文“被击杀的人——所有的长子”的后置同位关系，以免添加所有格；分号呈现埋葬死者与审判诸神两个相关分句。
