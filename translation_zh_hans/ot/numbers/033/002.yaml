base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/002.yaml
  text: Moses wrote down their starting points according to their journeys at the command of Yahweh[c][b][a], and these were their journeys according to their starting points.
translation:
  language: zh_hans
  text: 摩西按雅威的吩咐[a]，按照他们的行程，记下他们各次出发的地点[b]；以下是他们按照各次出发的地点所走的行程[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“按雅威的口”，这是表示“按雅威的吩咐”的惯用说法。
    reason: lexical_alternative
  - marker: b
    text: “出发的地点”也可译作“出发”或“出去之处”。
    reason: lexical_alternative
  - marker: c
    text: 本节刻意倒置两个词项：先说“按照行程……出发的地点”，再说“按照出发的地点……行程”。
    reason: literary_structure
lexical_decisions:
- source_word: וַיִּכְתֹּב
  choice: 记下
  rationale: 该形式在叙事中表示过去发生的动作；“记下”自然表达写成记录之意，又不过度扩充。
- source_word: מוֹצָאֵיהֶם
  choice: 他们各次出发的地点
  rationale: מוֹצָא可指出去、出发，也可指出发之处。行程表的语境侧重每段旅程的起点；加入“各次”使复数意义在中文中清楚。
- source_word: לְמַסְעֵיהֶם
  choice: 照着他们的行程
  rationale: מַסָּע可指拔营、旅程或行程阶段；关系性的ל译为“照着”，并保留本节前后词项倒置的结构。
- source_word: עַל פִּי יְהוָה
  choice: 按雅威的吩咐
  rationale: עַל־פִּי字面为“按……的口”，在这里是“奉命、按吩咐”的惯用表达；יְהוָה按项目规范译为“雅威”。
- source_word: וְאֵלֶּה
  choice: 以下是
  rationale: 该指示语引出随后列出的行程；“以下是”符合现代中文篇章表达。
- source_word: מַסְעֵיהֶם
  choice: 他们所走的行程
  rationale: “行程”兼顾旅程及分段行进的含义；补入“所走的”使中文自然，但不增加实质信息。
- source_word: לְמוֹצָאֵיהֶם
  choice: 照着出发地点
  rationale: 与前半句“照着他们的行程……出发的地点”形成倒置，尽量保存希伯来文刻意的对应结构。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”较贴近学界通常重构的读音，并按项目既定规范保留其专名性质。
- issue: עַל־פִּי的理解
  choice: 按……的吩咐
  alternative: 按……的口
  rationale: 此处是常见惯用语，表示摩西记录行程是出于雅威的命令；直译“按……的口”在现代中文中容易造成误解。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“记下”体现书面记录；“行程”和“出发地点”适合行程表语境。保留原文前后倒置的修辞结构，同时用中文语序和必要的虚词确保可读性。
