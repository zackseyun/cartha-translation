  text: They set out from Rissah and camped at Kehelathah.
translation:
  language: zh_hans
  text: 他们从利撒起行，在基希拉他安营。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: 起行
  rationale: נסע在旷野行程表述中指离开一处营地继续上路。“起行”是中文圣经行程语境中自然、简洁的表达，并保留反复出现的固定句式。
- source_word: מֵרִסָּה
  choice: 从利撒
  rationale: מֵ־表示“从”；רִסָּה为地名，按读音音译作“利撒”。
- source_word: וַיַּחֲנוּ
  choice: 安营
  rationale: חנה在行程语境中指扎营停驻。“安营”准确而庄重，也适合与“起行”构成固定行程句式。
- source_word: בִּקְהֵלָתָה
  choice: 在基希拉他
  rationale: בְּ־在此标示扎营地点，译作“在”；קְהֵלָתָה为地名，按读音音译作“基希拉他”。
