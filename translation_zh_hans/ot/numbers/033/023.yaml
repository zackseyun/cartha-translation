lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: 起行
  rationale: 在民数记33章的行程记录中，נסע表示拔营出发；“起行”简洁自然，也与本章反复出现的行程格式相符。
- source_word: מִקְּהֵלָתָה
  choice: 从基希拉他
  rationale: 介词מִן表示“从”，קְהֵלָתָה是地名，按希伯来语读音音译为“基希拉他”。
- source_word: וַיַּחֲנוּ
  choice: 安营
  rationale: חנה在旷野行程记录中指扎营驻留；“安营”是现代中文圣经叙事中自然、庄重的表达。
- source_word: בְּהַר
  choice: 在……山
  rationale: הַר可指山或山区；在后接专名的驻扎地点清单中，理解为“某某山”最合适，介词בְ译为地点介词“在”。
- source_word: שָׁפֶר
  choice: 沙斐
  rationale: 这是地名，依据马所拉文本读音 Šāfer 音译为“沙斐”；无需沿用英语形式所产生的异译。
