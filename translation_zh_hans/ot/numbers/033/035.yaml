  text: 他们从亚伯罗拿起行，在以旬迦别安营。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: 他们……起行
  rationale: נסע在旷野行程表的固定叙述中表示离开一处营地继续上路；“起行”简洁自然，并保留行程推进的意味。
- source_word: מֵעַבְרֹנָה
  choice: 从阿博拿
  rationale: 介词מֵ译为“从”；עַבְרֹנָה是地名，按希伯来语读音音译为“阿博拿”。
- source_word: וַיַּחֲנוּ
  choice: 安营
  rationale: חנה在行程语境中指驻扎设营；“安营”是现代中文圣经叙事中自然、准确且庄重的表达。
- source_word: בְּעֶצְיוֹן גָּבֶר
  choice: 在以旬·迦别
  rationale: 介词בְּ在此表示地点，译为“在”；עֶצְיוֹן גָּבֶר为复合地名，音译作“以旬·迦别”，以间隔号标明其两个组成部分。
