  text: וַ/יִּסְע֤וּ מֵֽ/רַעְמְסֵס֙ בַּ/חֹ֣דֶשׁ הָֽ/רִאשׁ֔וֹן בַּ/חֲמִשָּׁ֥ה עָשָׂ֛ר י֖וֹם לַ/חֹ֣דֶשׁ הָ/רִאשׁ֑וֹן מִֽ/מָּחֳרַ֣ת הַ/פֶּ֗סַח יָצְא֤וּ בְנֵֽי יִשְׂרָאֵל֙ בְּ/יָ֣ד רָמָ֔ה לְ/עֵינֵ֖י כָּל מִצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/003.yaml
  text: They set out from Rameses in the first month[a], on the fifteenth day of the first month[b]; on the day after the Passover the sons of Israel went out with a high hand before the eyes of all the Egyptians.
translation:
  language: zh_hans
  text: 他们从兰塞起行；那时是第一月十五日。逾越节的次日，以色列人[a]以高举的手，在全体埃及人眼前出去了。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “以色列人”原文直译为“以色列的众子”。
    reason: lexical_alternative
  - marker: b
    text: “以高举的手”是希伯来语习语，指公开而大胆地行动。
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: 起行
  rationale: 在行程清单中，נסע常指拔营出发；“起行”简洁、庄重，也符合《民数记》33章反复出现的行程表达。
- source_word: מֵרַעְמְסֵס
  choice: 从兰塞
  rationale: 采用现代中文圣经地名的常见音译“兰塞”，保留其专名性质。
- source_word: בַּחֹדֶשׁ הָרִאשׁוֹן
  choice: 在正月
  rationale: 此处指一年中的第一个月；“正月”是自然简洁的中文表达，脚注说明其确切含义，避免误解为现代农历月份。
- source_word: בַּחֲמִשָּׁה עָשָׂר יוֹם לַחֹדֶשׁ הָרִאשׁוֹן
  choice: 正月十五日
  rationale: 忠实而自然地表达希伯来文日期格式。
- source_word: מִמָּחֳרַת הַפֶּסַח
  choice: 逾越节的次日
  rationale: מָחֳרַת表示次日；“逾越节”准确传达 הַפֶּסַח 的节期所指。
- source_word: יָצְאוּ
  choice: 出去了
  rationale: 保留 יצא 的基本意义及出埃及叙事中的关键词呼应。
- source_word: בְנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 该固定表达在这里指以色列全体民众；现代汉语用“以色列人”最自然清楚，脚注保留其字面形式。
- source_word: בְּיָד רָמָה
  choice: 昂然
  rationale: 该习语字面为“以高举的手”，在此表达公开、无所畏惧而有气势地行动；“昂然”保留其大胆而公开的语气，同时避免中文“高举着手”可能造成的动作误读。
- source_word: לְעֵינֵי כָּל מִצְרָיִם
  choice: 在全体埃及人眼前
  rationale: 贴近“在……眼前”的具体措辞，也清楚表达此事在众目睽睽之下公开发生。
theological_decisions:
- issue: בְנֵי יִשְׂרָאֵל 的集体称谓
  choice: 以色列人
  alternative: 以色列的众子
  rationale: 希伯来文形式为阳性复数“以色列的众子”，但在上下文中是指整个以色列群体。正文采用自然的现代汉语集体称谓，脚注注明字面形式，不把所指限制为成年男性。
- issue: בְיָד רָמָה 的习语力度
  choice: 昂然
  alternative: 以高举的手；大胆地；公然地
  rationale: 原文形象包含高举之手，并可传达大胆、公开乃至无所畏惧的离去。译作“昂然”保留其气势，却不强行确定为“挑衅”或“得胜”等更具体的神学或情感解释；脚注呈现字面意象和意义范围。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“起行”与本章行程清单的体裁相称；“昂然”较凝练，脚注补足希伯来习语的具体形象。所有脚注标记均置于正文相关词句之后。
