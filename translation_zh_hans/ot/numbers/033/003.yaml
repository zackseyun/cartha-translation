- from: 他们在正月[a]，就是正月十五日，从兰塞起行。逾越节的次日，以色列人[b]在全体埃及人眼前昂然出去了。[c]
  to: 他们从兰塞起行；那时是第一月十五日。逾越节的次日，以色列人[a]以高举的手，在全体埃及人眼前出去了。[b]
  rationale: 修订以“第一月”直接对应原文月份称谓，并调整语序使中文更流畅。将“昂然”改为“以高举的手”，保留希伯来习语的形象与语义开放性；脚注仅说明其公开、大胆的含义。其余专名、节名和集体称谓维持原译。
