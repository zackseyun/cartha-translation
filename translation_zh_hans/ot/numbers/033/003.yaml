    text: “以色列人”原文直译为“以色列的众子”。
    reason: lexical_alternative
  - marker: b
    text: “以高举的手”是希伯来语习语，指公开而大胆地行动。
    reason: cultural_note
  revision_rationale: 修订以“第一月”直接对应原文月份称谓，并调整语序使中文更流畅。将“昂然”改为“以高举的手”，保留希伯来习语的形象与语义开放性；脚注仅说明其公开、大胆的含义。其余专名、节名和集体称谓维持原译。
