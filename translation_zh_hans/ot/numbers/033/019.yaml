lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: 起行
  rationale: נסע在旷野行程记录的固定表达中指拔营出发；“起行”简洁自然，也保留了行程表的庄重、公式化语气。
- source_word: מֵרִתְמָה
  choice: 从利提玛
  rationale: 前缀מִן表示出发地点，译作“从”；地名按希伯来语音译为“利提玛”。
- source_word: וַיַּחֲנוּ
  choice: 安营
  rationale: חנה是行程记录中表示驻扎设营的常用动词；“安营”是现代中文圣经叙事中自然、庄重的表达。
- source_word: בְּרִמֹּן פָּרֶץ
  choice: 在临门·帕烈
  rationale: 介词בְּ在此表示驻扎地点，译作“在”；复合地名按希伯来语音译，并用间隔号显示其两部分而仍作为一个地名。
