lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: 起行
  rationale: נסע在旷野行程清单的固定句式中，指离开一处营地继续上路；“起行”简洁自然，也符合《民数记》行程叙述的庄重语体。
- source_word: מִדָּפְקָה
  choice: 从脱加
  rationale: 前缀מִן表示出发点“从”；דָּפְקָה是地名，按现代中文圣经常用译名音译为“脱加”。
- source_word: וַיַּחֲנוּ
  choice: 安营
  rationale: חנה在行程语境中表示驻扎、设营；“安营”准确且是现代中文读者熟悉的行旅用语。
- source_word: בְּאָלֽוּשׁ
  choice: 在亚录
  rationale: 介词בְּ表示所在地点；אָלֽוּשׁ为地名，按现代中文圣经常用译名音译为“亚录”。
