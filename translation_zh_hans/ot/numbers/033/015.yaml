lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: 他们……出发
  rationale: נסע在行程记载的固定表达中指拔营离开上一站；“出发”自然清楚，并保留启程的动作含义。
- source_word: מֵרְפִידִם
  choice: 从利非订
  rationale: 前缀מ־表示起点或来源；רְפִידִם是地名，采用现代中文圣经中通行的音译“利非订”。
- source_word: וַיַּחֲנוּ
  choice: 安营
  rationale: חנה在旷野行程语境中指驻扎、扎营；“安营”简洁庄重，也符合中文叙事习惯。
- source_word: בְּמִדְבַּר סִינָי
  choice: 在西奈旷野
  rationale: מִדְבָּר指旷野或荒野，不必限定为极度干旱的沙漠；该短语表示名为西奈的旷野，译作“西奈旷野”自然且准确。
