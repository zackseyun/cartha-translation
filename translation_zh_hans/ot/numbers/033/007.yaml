base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/007.yaml
  text: They set out from Etham and turned back to Pi-hahiroth[a], which is opposite Baal-zephon, and camped before Migdol.
translation:
  language: zh_hans
  text: 他们从以倘起行，折回到比·哈希录；那里在巴力·洗分对面。他们在密夺前安营。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: 起行
  rationale: נסע在旷野行程记录的固定表达中指拔营出发；“起行”简洁自然，也保留行程推进的意味。
- source_word: מֵאֵתָם
  choice: 从以倘
  rationale: אֵתָם是地名，按常见中文圣经地名形式音译。
- source_word: וַיָּשָׁב
  choice: 转向
  rationale: שׁוב可指返回，也可指改变方向；本节未明确说他们回到先前到过的地点，因此正文用“转向”保留路线折返或改向的含义，并以脚注说明另一译法。
- source_word: עַל־פִּי הַחִירֹת
  choice: 向比·哈希录
  rationale: 介词עַל在此与地名相连，语境表示行进所朝向的地点；译作“向”比机械直译更符合现代汉语。地名采用音译。
- source_word: אֲשֶׁר עַל־פְּנֵי בַּעַל צְפֹן
  choice: 比·哈希录在巴力·洗分对面
  rationale: עַל־פְּנֵי在地理说明中表达相对位置，“对面”自然且明确；בַּעַל צְפֹן作为地名音译。为避免中文关系从句冗长，拆为独立分句。
- source_word: וַיַּחֲנוּ
  choice: 安营
  rationale: חנה指扎营；“安营”是清楚、庄重而通行的现代汉语表达。
- source_word: לִפְנֵי מִגְדֹּל
  choice: 在密夺前面
  rationale: לִפְנֵי表示相对于某地的前方或面前；“前面”保留其空间关系。מִגְדֹּל在此是地名，故采用音译而不译作“塔”。
theological_decisions: []
translation_notes:
  register: 采用现代、清楚而庄重的叙事语体。“起行—安营”呼应民数记行程记录的固定节奏；地名使用中点分隔复合音译名，以提高辨识度。
