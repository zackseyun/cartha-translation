lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: 起行
  rationale: 在旷野行程表的固定句式中，נסע表示从上一站出发；“起行”简洁自然，也能维持本章反复出现的行程节奏。
- source_word: מִבְּנֵי יַעֲקָן
  choice: 从比尼·雅干
  rationale: 此处在行程表中用作地名，并与申命记10:6的相关地名相呼应，因此采用音译，不在正文中直译其字面构成。
- source_word: וַיַּחֲנוּ
  choice: 安营
  rationale: חנה是行程表中表示扎营的固定用语；“安营”是现代中文圣经叙事中清楚、庄重而简练的表达。
- source_word: בְּחֹר הַגִּדְגָּד
  choice: 在曷·哈及甲
  rationale: 这是地点名称，ב表示所在地点，译作“在”；名称采用接近希伯来语形式的中文音译。
