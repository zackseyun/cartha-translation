  text: וְ/אִם לֹ֨א תוֹרִ֜ישׁוּ אֶת יֹשְׁבֵ֣י הָ/אָרֶץ֮ מִ/פְּנֵי/כֶם֒ וְ/הָיָה֙ אֲשֶׁ֣ר תּוֹתִ֣ירוּ מֵ/הֶ֔ם לְ/שִׂכִּים֙ בְּ/עֵ֣ינֵי/כֶ֔ם וְ/לִ/צְנִינִ֖ם בְּ/צִדֵּי/כֶ֑ם וְ/צָרֲר֣וּ אֶתְ/כֶ֔ם עַל הָ/אָ֕רֶץ אֲשֶׁ֥ר אַתֶּ֖ם יֹשְׁבִ֥ים בָּֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/055.yaml
  text: But if you do not drive out the inhabitants of the land from before you[a], then those whom you let remain from among them will become barbs in your eyes and thorns in your sides[c][b], and they will harass you on the land where you are living.
translation:
  language: zh_hans
  text: 但你们若不从你们面前赶走那地的居民，你们所留下的人就必成为你们眼中的刺、你们肋旁的荆棘[a]；他们必在你们居住的那地侵扰你们[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “刺”和“荆棘”所译的两个希伯来语名词都指尖锐、刺人的东西，具体所指不确定；后者也可译作“钩刺”。这两个并列意象都表示持续而痛苦的祸患。
    reason: lexical_alternative
  - marker: b
    text: “侵扰”也可译作“苦害”或“压迫”；原文动词可涵盖多种敌对性的侵扰。
    reason: lexical_alternative
lexical_decisions:
- source_word: תוֹרִישׁוּ
  choice: 赶走
  rationale: 此处使役式表达使当地居民失去占有并被逐离；“赶走”自然清楚，也符合征服与定居的语境。
- source_word: יֹשְׁבֵי הָאָרֶץ
  choice: 那地的居民
  rationale: 直接表达分词结构，现代汉语自然庄重。
- source_word: מִפְּנֵיכֶם
  choice: 从你们面前
  rationale: 保留希伯来语的空间意象，指随着以色列人前进而将居民逐离。
- source_word: תּוֹתִירוּ
  choice: 你们所留下的人
  rationale: 表达使役式“使之留下、留存”的含义，不额外加入“怜惜”或“饶恕”的意味。
- source_word: לְשִׂכִּים בְּעֵינֵיכֶם
  choice: 你们眼中的刺
  rationale: 罕见名词指尖锐刺人的东西；“眼中的刺”保留鲜明而痛苦的身体隐喻。
- source_word: לִצְנִינִם בְּצִדֵּיכֶם
  choice: 肋旁的荆棘
  rationale: 保留与前一短语成对的尖锐物意象；“肋旁”比笼统的“身旁”更清楚呈现身体部位。
- source_word: וְצָרֲרוּ
  choice: 扰害
  rationale: צרר可指敌对、困扰或压迫；“扰害”涵盖持续敌对与造成痛苦，又不把程度限定为正式压迫。
- source_word: עַל הָאָרֶץ אֲשֶׁר אַתֶּם יֹשְׁבִים בָּהּ
  choice: 在你们居住的那地
  rationale: 按现代汉语习惯以“在”表达居于土地之中，同时保留当前居住的语气。
theological_decisions: []
