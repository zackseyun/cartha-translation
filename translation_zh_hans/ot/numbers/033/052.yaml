  text: וְ/ה֨וֹרַשְׁתֶּ֜ם אֶת כָּל יֹשְׁבֵ֤י הָ/אָ֨רֶץ֙ מִ/פְּנֵי/כֶ֔ם וְ/אִ֨בַּדְתֶּ֔ם אֵ֖ת כָּל מַשְׂכִּיֹּתָ֑/ם וְ/אֵ֨ת כָּל צַלְמֵ֤י מַסֵּֽכֹתָ/ם֙ תְּאַבֵּ֔דוּ וְ/אֵ֥ת כָּל בָּמֹתָ֖/ם תַּשְׁמִֽידוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/052.yaml
  text: and you shall drive out all the inhabitants of the land from before you[a], and you shall destroy all their figured stones, and all their cast-metal images you shall destroy[b], and all their high places you shall demolish.
translation:
  language: zh_hans
  text: 你们要把那地所有的居民从你们面前赶出去；要毁掉他们一切雕刻的石像[a]，毁掉他们一切铸像[b]，拆毁他们一切的丘坛。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“他们一切雕刻的像”。希伯来语 מַשְׂכִּיּוֹת 指带有图形的物件，其确切形制和材质仍有争议。
    reason: lexical_alternative
  - marker: b
    text: 或译“他们一切熔铸的像”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוֹרַשְׁתֶּם
  choice: 赶走
  rationale: 此处使役形表达使当地居民失去占有并离开；“赶走”自然明确，也与“从你们面前”衔接。
- source_word: יֹשְׁבֵי הָאָרֶץ
  choice: 那地所有的居民
  rationale: 分词结构指居住在当地的人；“居民”简洁、现代。
- source_word: מִפְּנֵיכֶם
  choice: 从你们面前
  rationale: 保留希伯来语的空间意象，同时在现代汉语中仍清楚可懂。
- source_word: וְאִבַּדְתֶּם / תְּאַבֵּדוּ
  choice: 毁掉
  rationale: 两个词形都源于 אבד 的加强词干，均用于毁灭祭祀物件；重复“毁掉”保留原文的反复与力度。
- source_word: מַשְׂכִּיֹּתָם
  choice: 他们一切刻有图像的石头
  rationale: 该词指带有图形的表现物，可能特指雕刻或刻画的石制物；正文采用较可能的具体所指，脚注说明其形制和材质存在争议。
- source_word: צַלְמֵי מַסֵּכֹתָם
  choice: 他们一切铸造的像
  rationale: צֶלֶם 指像，מַסֵּכָה 表明以熔融金属浇铸而成；“铸造的像”准确传达制作方式，又不额外限定其具体形态。
- source_word: בָּמֹתָם
  choice: 他们一切的丘坛
  rationale: בָּמוֹת 是设于高处或称为“高处”的祭祀场所；“丘坛”是简洁且可理解的汉语宗教建筑用语。
- source_word: תַּשְׁמִידוּ
  choice: 拆毁
  rationale: 该使役动词表达彻底除灭；对象是祭祀场所，因此“拆毁”比泛称“毁灭”更贴合。
theological_decisions:
- issue: 如何呈现针对当地居民及其祭祀设施的命令
  choice: 按原文直译为赶走所有居民，并毁掉具体的祭祀物件与场所，不淡化命令的严厉性。
  alternative: 将首个动词弱化为纯粹领土意义的“使其失去产业”，或把各类祭祀物件笼统译成“异教习俗”。
  rationale: 原文分别明确命令移除居民，并摧毁若干具体祭祀物件和场所。译文不应削弱这些内容，也不应加入本节没有陈述的神学辩护。
translation_notes:
  register: 采用现代、庄重而易懂的命令语体。保留“从你们面前”的原文意象，并以“丘坛”表达特定祭祀场所。两个脚注标记均放在其实际说明的词语之后。
