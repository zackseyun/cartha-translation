  text: 他们从以因起行，在底本迦得安营。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: 起行
  rationale: 在《民数记》的行程记载中，נסע指从一处营地出发；“起行”简洁自然，并保留启程前行的意味。
- source_word: מֵעִיִּים
  choice: 从以因
  rationale: 前缀מֵ译作“从”；地名עִיִּים按现代中文圣经地名惯例音译为“以因”。
- source_word: וַיַּחֲנוּ
  choice: 安营
  rationale: חנה在旷野行程公式中指扎营、驻营；“安营”符合中文叙事表达，也准确体现临时驻扎。
- source_word: בְּדִיבֹן גָּד
  choice: 在底本·迦得
  rationale: 介词בְּ在行程语境中译作“在”；דִיבֹן גָּד作为复合地名音译为“底本·迦得”，中点显示两部分共同构成地名，避免擅自解释为所属关系。
