- source_word: וַיִּסְעוּ
  choice: 他们……出发
  rationale: נסע在旷野行程记录的固定表达中指拔营启程；译作“出发”简洁自然，也适合本章反复出现的行程句式。
- source_word: מִפּוּנֹן
  choice: 从普嫩
  rationale: 前缀介词מִן表示起点，译作“从”；地名פּוּנֹן按现代中文圣经通行形式音译为“普嫩”。
- source_word: וַיַּחֲנוּ
  choice: 安营
  rationale: חנה在行程语境中指驻扎、扎营；“安营”庄重而易懂，并与民数记行程表的固定用语相称。
- source_word: בְּאֹבֹת
  choice: 在阿伯
  rationale: 介词בְּ在此标示驻营地点，译作“在”；地名אֹבֹת按现代中文圣经通行形式音译为“阿伯”。
