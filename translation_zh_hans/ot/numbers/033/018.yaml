  rationale: חנה在行程记载中指驻扎、扎营；“安营”简洁庄重，也符合现代中文圣经语体。
- source_word: בְּרִתְמָה
  choice: 在利提玛
  rationale: 介词בְּ在此标明驻营地点；地名רִתְמָה按通行的中文圣经音译作“利提玛”。
