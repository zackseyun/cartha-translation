  yaml_path: translation/ot/numbers/033/048.yaml
  text: They set out from the mountains of Abarim and camped in the plains of Moab by the Jordan at Jericho[a][b].
translation:
  language: zh_hans
  text: 他们从亚巴琳山起程，安营在摩押平原，在耶利哥一带的约旦河边。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“在耶利哥对面的约旦河边”。原文可指耶利哥一带的约旦河边；“对面”是结合地理语境作出的较具体理解，原文没有明说“对面”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: 起程
  rationale: 在行程记录的固定语境中，נסע指拔营后前往下一站；“起程”自然简洁，并保留行程推进之意。
- source_word: מֵהָרֵי הָעֲבָרִים
  choice: 从亚巴琳山
  rationale: הָרֵי是“山”的复数附属形式；“亚巴琳山”按地名音译，并以现代汉语常用的集合性“山”表达该山地。
- source_word: וַיַּחֲנוּ
  choice: 安营
  rationale: חנה在旷野行程记载中指扎营；“安营”准确、庄重，也符合现代中文圣经地理叙事的语体。
- source_word: בְּעַרְבֹת מוֹאָב
  choice: 在摩押平原
  rationale: עַרְבֹת可指平原或草原、干旱台地；“摩押平原”通顺易懂，并保留地理名称。
- source_word: עַל יַרְדֵּן יְרֵחוֹ
  choice: 约旦河边、耶利哥对面的地方
  rationale: עַל表示临近、沿着；“约旦河边”直接反映位置。末尾无明说“对面”的专词，但“耶利哥”在这一地理短语中自然限定为隔河相对的地点；正文明确表达该地理关系，同时以脚注保留更贴近字面的另一种理解。
theological_decisions: []
