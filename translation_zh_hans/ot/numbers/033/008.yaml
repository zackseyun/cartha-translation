base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/008.yaml
  text: They set out from before Hahiroth and passed through the midst of the sea into the wilderness[b][a], and they went a three-day journey in the wilderness of Etham and camped at Marah.
translation:
  language: zh_hans
  text: 他们从哈希录前面[a]起行，从海中穿过，进入旷野；又在以倘旷野走了三天的路程[b]，在玛拉安营。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文作“从哈希录前面”。《出埃及记》通常称此地为“比·哈希录”；本节没有“比”这一成分，因此保留较短的名称，不与其他经文协调。
    reason: alternative_reading
  - marker: b
    text: 或译：“在以倘旷野行走了三天。”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: 起行
  rationale: 在行程站点的叙述中，נסע指拔营出发；“起行”简洁、庄重，也符合《民数记》行程录的语体。
- source_word: מִפְּנֵי הַחִירֹת
  choice: 从哈希录前面
  rationale: 按本节马所拉文本直译为“从哈希录前面”；此处没有《出埃及记》中地名“比·哈希录”的“比”这一成分，因此不作协调。
- source_word: וַיַּעַבְרוּ בְתוֹךְ הַיָּם
  choice: 穿过海中
  rationale: עבר与בְּתוֹךְ合用，表达从海的中间经过；“穿过海中”保留了原文对路线位置的强调。
- source_word: הַמִּדְבָּרָה
  choice: 进入旷野
  rationale: 词尾方向性־ה表示朝向或进入；结合上下文，以“进入旷野”自然传达其方向意义。
- source_word: וַיֵּלְכוּ דֶּרֶךְ שְׁלֹשֶׁת יָמִים
  choice: 走了三天的路程
  rationale: דֶּרֶךְ שְׁלֹשֶׁת יָמִים可指三天的行程或路程；此译保留时间与行程的联系，同时符合现代汉语。
- source_word: בְּמִדְבַּר אֵתָם
  choice: 在以倘旷野
  rationale: 这是由“旷野”和专名“以倘”构成的属格结构；汉语自然表达为“以倘旷野”。
- source_word: וַיַּחֲנוּ בְּמָרָה
  choice: 在玛拉安营
  rationale: חנה在行程记载中意为驻扎、安营；“在玛拉安营”准确而自然。
theological_decisions: []
