lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: 起行
  rationale: נסע在旷野行程记载的固定句式中指拔营出发。“起行”简洁自然，也保留了连续行程的叙述格式。
- source_word: מִתָּרַח
  choice: 从他拉
  rationale: 前缀מִן表示出发点；תָּרַח在此为地名，按常见中文圣经地名音译作“他拉”。
- source_word: וַיַּחֲנוּ
  choice: 安营
  rationale: חנה在行程语境中意为扎营、驻营。“安营”是现代中文中自然、庄重且具体的表达。
- source_word: בְּמִתְקָה
  choice: 在密加
  rationale: 前缀בְּ表示地点；מִתְקָה为营地名，音译作“密加”。
