lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: 起程
  rationale: נסע在旷野行程表的固定表达中指拔营出发；“起程”简洁自然，并保留行程推进的含义。
- source_word: מִמִּדְבַּר
  choice: 从……的旷野
  rationale: מִדְבָּר指旷野或荒漠地带；“旷野”符合摩西五经行程记载的语境，介词מִן译为“从”。
- source_word: סִין
  choice: 汛
  rationale: 这是地名的音译，并非普通名词；采用现代中文圣经读者较熟悉的译名“汛”。
- source_word: וַיַּחֲנוּ
  choice: 安营
  rationale: חנה在行程记载中指驻扎设营；“安营”是自然、庄重且通行的现代汉语表达。
- source_word: בְּדָפְקָה
  choice: 在脱加
  rationale: 介词בְּ表示驻营地点，译作“在”；דָפְקָה作为地名音译为“脱加”。
