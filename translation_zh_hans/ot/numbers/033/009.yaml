base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/009.yaml
  text: They set out from Marah and came to Elim. At Elim there were twelve springs of water and seventy palm trees, and they camped there.
translation:
  language: zh_hans
  text: 他们从玛拉出发，来到以琳。以琳有十二处水泉和七十棵棕榈树；他们就在那里安营。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: 他们……出发
  rationale: נסע在行程记载的固定表达中指拔营启程；“出发”自然简洁，并保留行程推进的含义。
- source_word: מִמָּרָה
  choice: 从玛拉
  rationale: מָרָה是地名，按现代普通话惯用音译作“玛拉”。
- source_word: וַיָּבֹאוּ
  choice: 来到
  rationale: בוא表示来到或抵达；“来到”贴近原文常用义，也自然承接前面的出发动作。
- source_word: אֵילִמָה / בְאֵילִם
  choice: 来到以琳 / 以琳有
  rationale: 前一形式带方向后缀，表示前往以琳；后一介词短语说明当地的情况。中文第二句以“以琳有”表达地点范围，简明自然。
- source_word: שְׁתֵּים עֶשְׂרֵה
  choice: 十二
  rationale: 按现代汉语基数词的常规形式直译。
- source_word: עֵינֹת מַיִם
  choice: 十二股水泉
  rationale: עַיִן在此指天然涌出的泉源，而非人工挖掘的井；量词“股”适合泉水，并保留“水泉”的具体含义。
- source_word: וְשִׁבְעִים
  choice: 和七十
  rationale: 直接表达并列的基数数量。
- source_word: תְּמָרִים
  choice: 棕榈树
  rationale: תָּמָר指棕榈类树木，可能是枣椰树；原文未在此明确强调果实种类，因此采用较宽泛、通行的“棕榈树”。
- source_word: וַיַּחֲנוּ שָׁם
  choice: 他们就在那里安营
  rationale: חנה在旷野行程语境中指扎营；“安营”庄重而易懂，“就”自然表达随后发生的叙事关系。
