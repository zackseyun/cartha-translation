  text: 他们从沙斐山起行，在哈拉大安营。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: 起行
  rationale: נסע在旷野行程表的固定表达中指拔营出发；“起行”简洁自然，也符合中文圣经行程叙述的庄重语体。
- source_word: מֵהַר שָׁפֶר
  choice: 从沙斐山
  rationale: מִן表示“从”，הַר在地名前作“山”；שָׁפֶר是地名，按希伯来语读音音译为“沙斐”。
- source_word: וַיַּחֲנוּ
  choice: 安营
  rationale: חנה在行程语境中表示驻扎、扎营；“安营”是现代读者容易理解且适合经文体裁的表达。
- source_word: בַּחֲרָדָה
  choice: 在哈拉大
  rationale: 介词ב在行程记载中标示驻营地点，译作“在”；חֲרָדָה作为地名音译为“哈拉大”，不按其普通名词含义“战兢”意译。
