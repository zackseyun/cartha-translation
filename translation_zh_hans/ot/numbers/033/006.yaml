base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/006.yaml
  text: They set out from Sukkoth and camped at Etham[a], which is at the edge of the wilderness.
translation:
  language: zh_hans
  text: 他们从疏割出发，在以倘安营；以倘位于旷野的边缘。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: 他们……出发
  rationale: נסע在行程记载中表示拔营启程；“出发”符合现代汉语，也清楚表达行程推进。
- source_word: מִסֻּכֹּת
  choice: 从疏割
  rationale: 地名סֻכּוֹת采用中文圣经中通行的音译“疏割”，不按其词义翻译。
- source_word: וַיַּחֲנוּ
  choice: 安营
  rationale: חנה意为驻扎、扎营；“安营”简洁自然，并适合庄重的行程叙述。
- source_word: בְאֵתָם
  choice: 在以倘
  rationale: 地名אֵתָם采用通行音译“以倘”；介词ב按抵达后驻扎于某地的语境译为“在”。
- source_word: אֲשֶׁר
  choice: 以倘位于
  rationale: 关系词引出对以倘所在地的说明；在汉语中改用重复地名的独立分句，比直译“它”更清楚自然。
- source_word: בִּקְצֵה
  choice: 边缘
  rationale: קָצֶה表示尽头、边缘或边界；此处是地理方位，译作“边缘”既准确，又不把它限定为政治疆界。
- source_word: הַמִּדְבָּר
  choice: 旷野
  rationale: מִדְבָּר指未耕作、荒凉的野地，不一定是沙漠；“旷野”准确且符合现代中文圣经语域。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的行程叙述。分号连接启程安营与地点说明，使句意清晰；本节没有需要另加脚注才能保留的实质歧义。英文脚注把“at the border of the wilderness”列为替代说法，但该说法实际对应בִּקְצֵה，而不是地名Etham；中文正文以“旷野的边缘”保留其地理含义。
