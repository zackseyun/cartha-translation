  text: They set out from Oboth and camped at Iye-abarim[a], on the border of Moab.
translation:
  language: zh_hans
  text: 他们从阿伯起程，在摩押边界的以耶亚巴琳[a]安营。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这个希伯来地名的组成部分可能分别与“废墟”和“亚巴琳（彼岸地区）”有关。
    reason: 说明该复合地名可能的词源关联，同时不把不确定的词源解释固定为正文译义。
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: 起程
  rationale: נסע在旷野行程记录的固定表达中指拔营出发；“起程”简洁自然，并保留行程推进的意味。
- source_word: מֵאֹבֹת
  choice: 从阿伯
  rationale: 前缀מֵ表示出发地点；אֹבֹת是地名，按现代中文圣经人名地名的常见音译处理。
- source_word: וַיַּחֲנוּ
  choice: 安营
  rationale: חנה是行程记录中表示扎营的常用动词；“安营”庄重而易懂。
- source_word: בְּעִיֵּי הָעֲבָרִים
  choice: 在……以耶·亚巴琳
  rationale: 该词组在行程语境中作为地名使用，因此采用音译，不把可能的词源含义直接译入正文；分隔点帮助现代读者辨识复合地名。
- source_word: בִּגְבוּל
  choice: 在……边界
  rationale: גְּבוּל可指边界或疆域；此处译作“边界”最直接，也避免断定营地位于摩押腹地。
- source_word: מוֹאָב
  choice: 摩押
  rationale: 采用现代中文圣经中通行的地名译法。
theological_decisions: []
