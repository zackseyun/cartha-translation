base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/001.yaml
  text: These are the stages of the journey of the sons of Israel[a], who went out from the land of Egypt by their companies[d][c][b], under the hand of Moses and Aaron.
translation:
  language: zh_hans
  text: 以下是以色列人从埃及地出来、按着他们的队伍[a]、在摩西和亚伦带领下[b]所走的各段行程[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “按着他们的队伍”或译“按着他们的军队”或“按着编队”。原文可含有组织严整、甚至军事编制的意味。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“藉着摩西和亚伦的手”，是表示经由他们带领或执行的希伯来语习惯说法。
    reason: cultural_note
  - marker: c
    text: “各段行程”也可译作“各次起行”或“行程”。原文所指的是以色列行程中接连的各个阶段。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה מַסְעֵי
  choice: 以下是……所经过的各段行程
  rationale: מַסְעֵי 指行程中连续的起行或停驻阶段。译作“各段行程”适合下文行程表的性质；将 אֵלֶּה 译作“以下是”，自然地引出后面的清单。
- source_word: בְנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 这是现代汉语中对该群体最自然且准确的称呼；原文虽直译为“以色列的众子”，但在此泛指整个以色列群体，不宜让“众子”被误解为仅指男性。
- source_word: אֲשֶׁר יָצְאוּ מֵאֶרֶץ מִצְרַיִם
  choice: 从埃及地出来
  rationale: 保留 יצא 的“出来”以及 אֶרֶץ 的“地”，准确呈现他们离开埃及地的动作。
- source_word: לְצִבְאֹתָם
  choice: 按着队伍
  rationale: צָבָא 可指军队、编队或有组织的群体。此处强调以色列人有组织地分队出行；“队伍”保留组织性而不把战斗意味说得过强。
- source_word: בְּיַד מֹשֶׁה וְאַהֲרֹן
  choice: 在摩西和亚伦带领下
  rationale: בְּיַד 直译为“藉着……的手”，在此表示经由二人的带领或执行。正文采用自然的现代汉语表达，脚注保留希伯来习语。
