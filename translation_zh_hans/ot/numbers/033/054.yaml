- from: 你们要按宗族抽签分配这地。人数多的，要多分产业；人数少的，要少分产业。签为谁抽到哪里，哪里就归他。你们要按父系支派承受产业。
  to: 你们要按宗族抽签分配这地。人数多的宗族，要多给他产业；人数少的宗族，要少给他产业。谁抽签抽到哪一处，哪一处就归谁。你们要按你们祖先各支派承受产业。
  rationale: 仅作安全的措辞修订：改善抽签结果句的现代汉语表达，并将“父系支派”改为更贴近原文且自然的“你们祖先各支派”。保留“产业”以维系נחלה与末句承受产业之间的词汇和法律—继承语义联系。
