base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/054.yaml
  text: You shall apportion the land by lot according to your clans. To the larger group you shall increase its inheritance[a], and to the smaller you shall reduce its inheritance. Wherever the lot falls for anyone, that shall be his. You shall receive your inheritances according to the tribes of your fathers.
translation:
  language: zh_hans
  text: 你们要按宗族抽签分配这地。人数多的宗族，要多给他产业；人数少的宗族，要少给他产业。谁抽签抽到哪一处，哪一处就归谁。你们要按你们祖先各支派承受产业。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִתְנַחַלְתֶּם
  choice: 分配
  rationale: 此处为土地按宗族和抽签分授的语境，译作“分配”自然地表达该词在这里的分配性含义；末句则保留“承受产业”，体现 נחל 的继承主题。
- source_word: בְּגוֹרָל
  choice: 抽签
  rationale: גורל 指借抽签决定土地归属；“抽签”是现代汉语中准确、易懂的表达。
- source_word: לְמִשְׁפְּחֹתֵיכֶם
  choice: 按宗族
  rationale: מִשְׁפָּחָה 在支派土地分配中指支派之下的亲族单位，不宜仅译为现代意义的“家庭”。
- source_word: לָרַב ... וְלַמְעַט
  choice: 人数多的……人数少的
  rationale: 上下文比较各群体人口规模；补出“人数”可明确希伯来语在分地语境中的省略含义。
- source_word: נַחֲלָתוֹ
  choice: 产业
  rationale: נַחֲלָה 在这里既是承继所得之地，也是分得的份额；“产业”保留土地继承的盟约性用语，并符合庄重的经文语体。
- source_word: אֶל אֲשֶׁר יֵצֵא לוֹ שָׁמָּה הַגּוֹרָל לֹו יִהְיֶה
  choice: 签为谁抽到哪里，哪里就归他
  rationale: 紧贴“签为他出来到哪里，那里就属于他”的空间和归属结构，同时使用自然现代汉语。
- source_word: לְמַטּוֹת אֲבֹתֵיכֶם
  choice: 按父系支派
  rationale: 该短语指按祖先或父系所属的支派体系分地；“父系支派”简洁表达其谱系结构，而非仅指个人父亲。
- source_word: תִּתְנֶחָלוּ
  choice: 承受产业
  rationale: 末句回到 נחל 的继承、领受含义；“承受产业”既保留关键词联系，也适合土地作为世袭份额的语境。
theological_decisions: []
