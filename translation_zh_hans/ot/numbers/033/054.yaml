  source_fidelity: 译文总体准确呈现了按宗族抽签分地、按人数增减份额，以及按祖先支派承受产业的结构。“签为谁抽到哪里”虽意图对应原文“签为谁出来到哪里”，但在现代汉语中句法不够自然，且使“抽签”和“地点归属”的关系略显含混。
  naturalness: 整体为庄重、易懂的现代汉语。“签为谁抽到哪里”不够合乎现代汉语习惯；改为“谁抽签抽到哪一处，哪一处就归谁”更清楚自然。“父系支派”虽可理解，但“你们祖先各支派”更贴近经文常用的谱系表达，也避免把“父系”误解为现代社会学分类。
  terminology: “宗族”“抽签”“产业”均恰当，并保留了土地作为承继份额的语义。“祖先各支派”准确对应“你们父祖的支派”；此处不需要脚注。
