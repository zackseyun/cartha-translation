  yaml_path: translation/ot/numbers/033/014.yaml
  text: They set out from Alush and camped at Rephidim, but there was no water there for the people to drink.
translation:
  language: zh_hans
  text: 他们从亚录起行，在利非订安营；但那里没有水给百姓喝。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: 起行
  rationale: נסע用于旷野行程记录的固定表达，指拔营出发；“起行”简洁自然，也与行程体例相符。
- source_word: מֵאָלוּשׁ
  choice: 从亚录
  rationale: 地名按希伯来语音译；“亚录”沿用中文圣经中较为通行的译名。
- source_word: וַיַּחֲנוּ
  choice: 安营
  rationale: חנה指驻扎、扎营；“安营”是现代中文圣经叙事中自然而庄重的表达。
- source_word: בִּרְפִידִם
  choice: 在利非订
  rationale: 地名按希伯来语音译；“利非订”沿用中文圣经中较为通行的译名。
- source_word: וְלֹא הָיָה שָׁם
  choice: 但那里没有
  rationale: 连接词ו在此引出与安营事实相对的不利情形，译作“但”自然呈现语境中的转折，同时不增加原文未明说的因果关系。
- source_word: מַיִם
  choice: 水
  rationale: מַיִם的常规对应词。
- source_word: לָעָם
  choice: 给百姓
  rationale: עָם在此集体指以色列民；“百姓”符合中文圣经叙事语域。介词ל与后面的不定式共同表达可供百姓饮用。
- source_word: לִשְׁתּוֹת
  choice: 喝
  rationale: שׁתה的不定式在此说明水的用途；“给百姓喝”是自然、清楚的现代汉语表达。
