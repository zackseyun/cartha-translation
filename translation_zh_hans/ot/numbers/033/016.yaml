  text: They set out from the wilderness of Sinai and camped at Kibroth-hattaavah[a].
translation:
  language: zh_hans
  text: 他们从西奈旷野起程，在基博罗·哈他瓦[a]安营。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “基博罗·哈他瓦”意思是“贪欲之墓”。
    reason: 说明希伯来地名 קִבְרֹת הַתַּאֲוָה 的构词含义，同时保留正文中的专名形式。
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: 他们……起程
  rationale: נסע在民数记三十三章的行程记述套语中表示拔营出发；“起程”简洁自然，也便于在本章重复使用。
- source_word: מִמִּדְבַּר סִינָי
  choice: 从西奈旷野
  rationale: מִדְבָּר指旷野或荒漠地区；“西奈旷野”既保留原文的地理关系，也符合现代汉语圣经地名表达。
- source_word: וַיַּחֲנוּ
  choice: 安营
  rationale: חנה在行程记述中指扎营停驻；“安营”庄重而易懂，并与“起程”形成自然对应。
- source_word: בְּקִבְרֹת הַתַּאֲוָה
  choice: 在基博罗·哈他瓦
  rationale: 这是地名，正文采用音译，避免把专名直接改写成释义；其构词含义在脚注中说明。
