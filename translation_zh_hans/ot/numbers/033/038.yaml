base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/038.yaml
  text: And Aaron the priest went up Mount Hor at the command of Yahweh[a], and he died there, in the fortieth year after the Israelites came out from the land of Egypt, in the fifth month, on the first day of the month.
translation:
  language: zh_hans
  text: 祭司亚伦遵照雅威的命令[a]上了何珥山，死在那里。那时是以色列人出埃及地后的第四十年，五月初一。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“照雅威的话”；直译：“按雅威的口”。
    reason: 保留 עַל־פִּי 的惯用义、替代译法和字面意象。
lexical_decisions:
- source_word: וַיַּעַל
  choice: 上了
  rationale: עלה表示向上行、登上；“上了何珥山”在现代汉语中自然，并保留方向含义。
- source_word: הַכֹּהֵן
  choice: 祭司
  rationale: 直接表达亚伦的职分；与人名构成同位关系。
- source_word: אֶל הֹר הָהָר
  choice: 何珥山
  rationale: 按已通行的圣经地名译法处理这一专名，避免机械译作“何珥那山”。
- source_word: עַל פִּי יְהוָה
  choice: 遵照雅威的命令
  rationale: עַל פִּי字面为“按……的口”，在此是依照命令行事的惯用表达；正文采用自然明确的汉语，脚注保留较贴近字面的替代译法。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以音译呈现四字神名，保留其作为专名的性质，而不以称号替代。
- source_word: וַיָּמָת שָׁם
  choice: 死在那里
  rationale: 直接保留死亡事件及地点副词；承接前句时无需重复主语。
- source_word: בִּשְׁנַת הָאַרְבָּעִים
  choice: 第四十年
  rationale: 准确表达希伯来语纪年公式中的序数。
- source_word: לְצֵאת בְּנֵי יִשְׂרָאֵל
  choice: 以色列人出……后
  rationale: 这里的不定式结构以出埃及事件为纪年起点；“以色列人”自然表达民族整体。
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: 出埃及地
  rationale: 保留“地”这一成分，同时采用现代汉语常见的“出埃及地”表达。
- source_word: בַּחֹדֶשׁ הַחֲמִישִׁי בְּאֶחָד לַחֹדֶשׁ
  choice: 五月初一
  rationale: 简洁、自然地表达“第五个月的第一日”；这里“五月”指历法中的第五个月，并非必然对应现代公历五月。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文使用四字神名，正文以“雅威”音译，保留其专名性质；不以传统音译或称号代替。
- issue: עַל פִּי יְהוָה 的表达
  choice: 遵照雅威的命令
  alternative: 照雅威的话
  rationale: 该习语可侧重“口所发的话”或其命令效力；正文表达命令含义，脚注保留“话”这一较贴近原文意象的译法，不赋予额外神学解释。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“亚伦祭司”保留原文同位称谓；将较长的希伯来语句子分为两句以便普通读者理解，并用“那时”清楚衔接纪年信息。脚注标记已置于对应短语之后。
