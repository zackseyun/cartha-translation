  yaml_path: translation/ot/numbers/033/037.yaml
  text: They set out from Kadesh and camped at Mount Hor[b][a], on the edge of the land of Edom.
translation:
  language: zh_hans
  text: 他们从加低斯[a]起行，在以东地边缘的何珥山[b]安营。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文作“加低斯”；有些译本根据更广的上下文扩作“加低斯巴尼亚”，但本节只写较短的地名。
    reason: alternative_reading
  - marker: b
    text: 希伯来文直译近于“何珥，那山”，通常译作“何珥山”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: 起行
  rationale: 在旷野行程表的固定叙述中，נסע表示离开营地出发；“起行”简洁自然，也保留了反复出现的行程用语。
- source_word: מִקָּדֵשׁ
  choice: 从加低斯
  rationale: 希伯来文本此处仅作“加低斯”，没有“巴尼亚”；译文不根据上下文扩充地名。
- source_word: וַיַּחֲנוּ
  choice: 安营
  rationale: חנה指扎营、驻营；“安营”是现代中文圣经叙事中自然且具体的表达。
- source_word: בְּהֹר הָהָר
  choice: 在何珥山
  rationale: 字面结构近于“在何珥，那山”，但这是传统所称的山名；“何珥山”符合现代汉语地名次序。
- source_word: בִּקְצֵה
  choice: 位于……的边缘
  rationale: קצה可指尽头、边缘或边界；“边缘”保留空间含义，不强行把它限定为正式政治边界。
- source_word: אֶרֶץ אֱדוֹם
  choice: 以东地
  rationale: אֶרֶץ指土地、地域；“以东地”直接表达以东所属或所占的地域。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的行程叙事用语。“起行—安营”保持《民数记》旷野行程表的公式感；后半句稍作汉语句法调整，清楚说明山的位置。脚注标记均置于对应词语之后。
