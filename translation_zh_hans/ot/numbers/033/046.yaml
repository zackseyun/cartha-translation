  text: 他们从底本迦得起行，在亚门低比拉太音安营。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: 起行
  rationale: 在民数记三十三章的行程记载中，נסע常指拔营后动身前往下一站；“起行”简洁自然，也适合本章反复出现的固定句式。
- source_word: מִדִּיבֹן גָּד
  choice: 从底本·迦得
  rationale: 这是地名，按读音音译；מִן译为“从”。用间隔号连接复合地名的两个部分，既保留原文形式，也避免将其解释性地译成“迦得的底本”。
- source_word: וַיַּחֲנוּ
  choice: 安营
  rationale: חנה在行程公式中表示驻扎、设营；“安营”是现代中文圣经叙事中自然、庄重且易懂的表达。
- source_word: בְּעַלְמֹן דִּבְלָתָיְמָה
  choice: 在亚门·低比拉太音
  rationale: 这是下一处营地的名称，采用音译；前缀בְּ译为表示地点的“在”。间隔号表明两部分共同构成一个地名，而不额外解释其关系。
