- source_word: וַיִּסְעוּ
  choice: 起程
  rationale: נסע在旷野行程表的固定表达中指离开一处营地继续前行。“起程”符合现代汉语习惯，也保留了开始下一段行程的意味。
- source_word: מִלִּבְנָה
  choice: 从立拿
  rationale: 介词מִן表示出发的地点；לִבְנָה是地名，按常用圣经音译译作“立拿”。
- source_word: וַיַּחֲנוּ
  choice: 安营
  rationale: חנה是行程记载中表示驻扎、扎营的常用动词。“安营”简洁、庄重，并符合中文圣经行程叙述的自然表达。
- source_word: בְּרִסָּה
  choice: 在勒撒
  rationale: 介词בְּ在此标明驻营地点；רִסָּה为地名，音译作“勒撒”。
