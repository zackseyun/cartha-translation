  text: And they camped by the Jordan[a], from Beth-jeshimoth as far as Abel-shittim, in the plains of Moab.
translation:
  language: zh_hans
  text: 他们在摩押平原的约旦河边扎营，从伯·耶施末直到亚伯·什亭。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “平原”也可译作“草原地带”；希伯来语所指的是摩押境内平坦、干旱的平原或草原地区。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּחֲנוּ
  choice: 他们……扎营
  rationale: 该叙事形式承接前文，表示以色列人行程中的下一站；“扎营”是现代汉语中自然、清楚的表达。
- source_word: עַל הַיַּרְדֵּן
  choice: 在约旦河边
  rationale: 介词 עַל 与河流连用时可表示在河旁、河边；结合扎营语境，不宜机械译作“在河上”。
- source_word: מִבֵּית הַיְשִׁמֹת
  choice: 从伯·耶施末
  rationale: 前缀 מִן 标明范围的起点；地名按希伯来语音译，并用间隔号呈现复合名称。
- source_word: עַד אָבֵל הַשִּׁטִּים
  choice: 直到亚伯·什亭
  rationale: עַד 标明地理范围的终点；“直到”准确而自然，地名按希伯来语音译。
- source_word: בְּעַרְבֹת מוֹאָב
  choice: 位于摩押平原
  rationale: עֲרָבוֹת 指平坦、较干旱的草原或旷野地带；“摩押平原”符合中文圣经地理用语，“位于”清楚表明整段营地范围所在区域。
