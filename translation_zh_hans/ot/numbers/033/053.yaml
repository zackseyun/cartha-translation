  text: וְ/הוֹרַשְׁתֶּ֥ם אֶת הָ/אָ֖רֶץ וִֽ/ישַׁבְתֶּם בָּ֑/הּ כִּ֥י לָ/כֶ֛ם נָתַ֥תִּי אֶת הָ/אָ֖רֶץ לָ/רֶ֥שֶׁת אֹתָֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/053.yaml
  text: You shall take possession of the land and live in it, because I have given the land to you to possess it.
translation:
  language: zh_hans
  text: 你们要取得那地，住在其中，因为我已经把那地赐给你们，让你们占有[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“承受为业”。希伯来语动词 ירשׁ 既可表示取得、占有，也可在圣约的土地应许语境中表示承受为业。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוֹרַשְׁתֶּם
  choice: 你们要取得
  rationale: 该动词是 ירשׁ 的使役式，既可涉及使原有居民失去土地，也可表示由此取得产业。这里的直接宾语是“那地”，译作“取得那地”既自然，也保留实际占领、取得所有权的语义，而不把土地本身说成被赶走。
- source_word: הָאָרֶץ
  choice: 那地
  rationale: אֶרֶץ 在此指上文所说、应许给以色列人的特定地域；“那地”符合现代汉语，也保留圣经土地应许语境。
- source_word: וִישַׁבְתֶּם בָּהּ
  choice: 住在其中
  rationale: ישׁב 可指居住、定居或留住；“住在其中”自然清楚，并表达实际居于该地的意思。
- source_word: כִּי
  choice: 因为
  rationale: 此处引出命令的根据，具有明确的因果意义。
- source_word: לָכֶם נָתַתִּי
  choice: 我已经把……赐给你们
  rationale: 完成式 נָתַתִּי 将赐地表述为已经成就、现今仍具效力的行动；“已经……赐给”在中文中体现这种完成而持续有效的意义。
- source_word: לָרֶשֶׁת אֹתָהּ
  choice: 让你们占有
  rationale: 不定式说明赐地的目的或结果。“占有”简洁表达取得并持有土地；ירשׁ 所可能含有的“承受为业”意义另以脚注保留。
theological_decisions:
- issue: 土地应许语境中 ירשׁ 的译法
  choice: 取得／占有
  alternative: 承受为业
  rationale: 本节既以神的赐予为根据，又命令以色列人实际取得并居住在那地。正文采用“取得／占有”，贴合本段关于占领土地的直接语境；同时以脚注保留该词在圣约与土地应许语境中“承受为业”的可能含义，避免消除其神学张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“取得那地”避免将使役式机械译成仿佛土地本身被驱逐；“住在其中”比“居于其内”更易懂，同时保持经文语体。
