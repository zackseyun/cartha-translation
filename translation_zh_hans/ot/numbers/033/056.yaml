  text: then it will happen that what I intended to do to them[a], I will do to you.
translation:
  language: zh_hans
  text: 必会这样：我原打算怎样对待他们，也必怎样对待你们。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָיָה
  choice: 到那时
  rationale: 这个惯用结构承接前文警告，引出其未来后果；“到那时”在现代汉语中自然地表达这一结果关系。
- source_word: כַּאֲשֶׁר
  choice: 也必照样
  rationale: 表达前后行动的对应关系，即上帝原拟对当地居民所做的，也将同样施于以色列人；这一译法保留“怎样……也怎样”的比较意味。
- source_word: דִּמִּיתִי
  choice: 我原打算
  rationale: 此处该动词表示意图或筹划。“原打算”既体现既定意向，也符合上下文中警告的严肃语气。
- source_word: לַעֲשׂוֹת לָהֶם
  choice: 对他们做的
  rationale: 保留 עשה 的宽泛含义及介词结构，不在正文中额外具体化审判的方式。
- source_word: אֶעֱשֶׂה לָכֶם
  choice: 对你们做
  rationale: 与前半句保持词汇和句法上的对应，突出警告中同等报应的力量。
theological_decisions:
- issue: 警告所表达的对应性审判
  choice: 译为上帝将把原打算施于当地居民的行动照样施于以色列人
  alternative: 弱化为一种不特别强调上帝意向的一般后果
  rationale: 本节以直接而庄严的神圣警告收束前文；译文保留审判的对应关系，同时不添加本节未明说的具体惩罚内容。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“到那时”自然承接前文，“原打算……也必照样……”保留希伯来文的意向、未来结果和鲜明平行结构。
