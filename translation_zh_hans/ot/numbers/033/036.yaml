  text: They set out from Ezion-geber and camped in the wilderness of Zin (that is[a], Kadesh).
translation:
  language: zh_hans
  text: 他们从以旬迦别起程，安营在寻的旷野，就是加低斯[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“这就是加低斯。”希伯来语代词在这里用于说明地点的同一关系。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: 起程
  rationale: נסע在行程记载中指拔营出发；“起程”自然简洁，也符合《民数记》33章反复出现的行程句式。
- source_word: מֵעֶצְיוֹן גָּבֶר
  choice: 从以旬迦别
  rationale: 这是地名 עֶצְיוֹן גָּבֶר 的通行中文音译，以“从”准确表达介词 מִן。
- source_word: וַיַּחֲנוּ
  choice: 安营
  rationale: חנה指扎营或驻营；“安营”既保留具体动作，也符合现代中文圣经叙事的庄重语体。
- source_word: בְמִדְבַּר צִן
  choice: 在寻旷野
  rationale: מִדְבָּר所指不一定是沙漠，译作“旷野”可避免过度限定地貌；צִן按通行译名作“寻”。
- source_word: הִוא
  choice: 就是
  rationale: 阴性代词 הִוא 在这里具有同位说明作用，用来认定前述地点；“就是”在中文中自然表达这种地点同一关系。
- source_word: קָדֵשׁ
  choice: 加低斯
  rationale: 地名 קָדֵשׁ 采用通行中文音译。
