    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: 他们……起行
  rationale: נסע在民数记33章行程记录的固定句式中，指拔营出发；“起行”简洁、自然，也与本章重复结构相称。
- source_word: מֵעַלְמֹן דִּבְלָתָיְמָה
  choice: 从亚勒们·低比拉太音
  rationale: 这是地名，采用音译；中点表示它是一个复合地名，同时便于现代中文读者辨读其组成。
- source_word: וַיַּחֲנוּ
  choice: 安营
  rationale: חנה在行程记录中指驻扎、扎营；“安营”庄重而通俗，并能与“起行”形成稳定搭配。
- source_word: בְּהָרֵי
  choice: 在……山地
  rationale: הָרִים的复数构词形式可指群山或山区；此处描述驻营区域，“山地”比逐字译作“诸山上”更自然，且不强行断定营地位于山峰之上。
- source_word: הָעֲבָרִים
  choice: 亚巴琳
  rationale: 此处作为专名使用，故音译，不按其词根含义译成“那边的地区”。
- source_word: לִפְנֵי
  choice: 在……前面
  rationale: 保留介词“在……面前/前方”的基本空间意义，不擅自确定为“对面”或某一具体方位。
- source_word: נְבוֹ
  choice: 尼波
  rationale: 专有地名，依通行中文圣经地名形式音译。
