  text: The sons of Israel set out from Rameses and camped at Succoth[a][b].
translation:
  language: zh_hans
  text: 以色列的子孙从兰塞起行，在疏割安营。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: 起行
  rationale: נסע在行程记录中指拔营出发；“起行”简洁自然，也符合《民数记》行程段落的庄重语体。
- source_word: בְנֵי יִשְׂרָאֵל
  choice: 以色列众子
  rationale: 按原文保留“以色列之子”的形式和阳性复数含义；加“众”使现代汉语表达更顺畅，且不将其泛化为“以色列人”。
- source_word: מֵרַעְמְסֵס
  choice: 从兰塞
  rationale: 前缀מִן表示出发地点；רַעְמְסֵס采用现代中文圣经地名中简明、常见的音译“兰塞”。
- source_word: וַיַּחֲנוּ
  choice: 安营
  rationale: חנה指驻扎、扎营；“安营”是现代中文中清楚而庄重的对应表达。
- source_word: בְסֻכֹּת
  choice: 在疏割
  rationale: 介词ב表示所在地点；סֻכֹּת作为地名音译为传统且易辨识的“疏割”。
