    reason: cultural_note
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: 起行
  rationale: נסע在《民数记》33章的行程套语中表示离开上一处营地继续上路；“起行”简洁自然，也保留了反复出现的行程表达。
- source_word: מִיַּם סוּף
  choice: 从红海
  rationale: יַם־סוּף是传统上译作“红海”的地名，现代中文读者也最熟悉这一称呼；其较贴近字面的可能译法“芦苇海”列入脚注，以保留词义上的讨论空间。
- source_word: וַיַּחֲנוּ
  choice: 安营
  rationale: חנה指扎营、驻营；“安营”是现代中文圣经叙事中自然而庄重的表达。
- source_word: בְּמִדְבַּר סִין
  choice: 在汛旷野
  rationale: מִדְבָּר指旷野或荒漠地区；“旷野”符合五经语境。סִין是地名，音译为“汛”，不按普通词义翻译。
