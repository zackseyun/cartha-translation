  text: 他们从红海[a]起行，在汛的旷野[b]安营。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“芦苇海”。希伯来语名称 yam suf 传统上译作“红海”，但较贴近字面的译法常被理解为“芦苇海”。
    reason: lexical_alternative
