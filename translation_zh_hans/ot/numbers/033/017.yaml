lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: 起程
  rationale: 在旷野行程表的固定表达中，נסע指从一处营地出发；“起程”简洁自然，也保留了行程推进的意味。
- source_word: מִקִּבְרֹת הַתַּאֲוָה
  choice: 从基博罗·哈他瓦
  rationale: 这是地名，正文采用音译；前缀 מִן 译作“从”。名称本身的含义另以脚注说明，不在正文中取代地名。
- source_word: וַיַּחֲנוּ
  choice: 安营
  rationale: חנה 在行程记载中表示扎营驻留；“安营”是自然、庄重且常见的现代汉语表达。
- source_word: בַּחֲצֵרֹת
  choice: 在哈洗录
  rationale: 这是地名，采用音译；介词 ב 在此表示安营所在之处，译作“在”。
