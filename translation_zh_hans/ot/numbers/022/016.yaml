  yaml_path: translation/ot/numbers/022/016.yaml
  text: 'They came to Balaam and said to him[a], “Thus says Balak son of Zippor: Please do not refrain from coming to me.”'
translation:
  language: zh_hans
  text: 他们来到巴兰那里，对他说：“西拨的儿子巴勒这样说：‘请不要推辞前来[a]。’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“不要克制自己去我那里”。原文使用通常表示“走、去”的动词；在巴勒的引语中，汉语按说话者的视角自然说“前来”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ אֶל־בִּלְעָם
  choice: 他们来到巴兰那里
  rationale: בוא表示“来、进入、到达”；这里是使者来到巴兰所在之处。“来到……那里”符合现代汉语叙事习惯，并清楚表达趋近。
- source_word: וַיֹּאמְרוּ לוֹ
  choice: 对他说
  rationale: אמר加间接宾语直译为“对他说”，自然保留引出直接引语的结构。
- source_word: כֹּה אָמַר
  choice: 这样说
  rationale: 这是正式的传信公式；“这样说”既保留原文形式，也符合庄重而易懂的现代汉语。
- source_word: בָּלָק בֶּן־צִפּוֹר
  choice: 西拨的儿子巴勒
  rationale: 按希伯来文从属关系表达父子身份，并采用通行的中文人名译法。
- source_word: אַל־נָא
  choice: 请你不要
  rationale: אַל表示禁止，נָא带有请求、恳请的语气；“请你不要”同时传达两者。
- source_word: תִמָּנַע
  choice: 推辞
  rationale: מנע在此有抑制自己、拒绝或不肯采取行动之意；“推辞”能自然表达巴勒请求巴兰不要拒绝前来的语气。
- source_word: מֵהֲלֹךְ אֵלָי
  choice: 到我这里来
  rationale: הלך的基本义是“走、去”，与אֵלָי合起来表示朝说话者而去。汉语从巴勒的引语视角通常说“到我这里来”，比机械译作“去我那里”自然。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而口语可懂的叙事表达。“推辞”保留请求对方不要拒绝行动的含义；以外层双引号和内层单引号区分使者的话与其中转述的巴勒原话。
