  text: וְ/עַתָּ֗ה שְׁב֨וּ נָ֥א בָ/זֶ֛ה גַּם אַתֶּ֖ם הַ/לָּ֑יְלָה וְ/אֵ֣דְעָ֔ה מַה יֹּסֵ֥ף יְהוָ֖ה דַּבֵּ֥ר עִמִּֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/019.yaml
  text: Now please stay here tonight[a], you also, so that I may know what more Yahweh will say to me.
translation:
  language: zh_hans
  text: 现在，请你们也在这里住一夜，好让我知道雅威还要对我说什么。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַתָּה
  choice: 现在
  rationale: 作为话语转换标记，引出巴兰接下来的吩咐；现代汉语用“现在”自然明白，无须机械译出连接词。
- source_word: שְׁבוּ נָא
  choice: 请……住一夜
  rationale: ישׁב 在此不是强调坐下，而是指留下、住宿；נָא 带有请求或礼貌语气，以“请”表达。
- source_word: בָזֶה
  choice: 在这里
  rationale: 按上下文取地点义；“在这里”是简洁自然的现代汉语表达。
- source_word: גַּם אַתֶּם
  choice: 你们也
  rationale: 保留 גַּם 的附加意味，表明这批使者也像先前的人一样留下。
- source_word: הַלָּיְלָה
  choice: 住一夜
  rationale: 指眼前这一夜。结合汉语住宿语境译作“住一夜”，比“这夜”更自然。
- source_word: וְאֵדְעָה
  choice: 好让我知道
  rationale: 该鼓励式形式在这里表达目的或预期结果，用“好让我知道”保留其意愿和目的色彩。
- source_word: מַה יֹּסֵף
  choice: 还要……什么
  rationale: יסף 与后接动词构成继续、再进一步之意；“还要……什么”既自然，也保留新增启示的意味。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文直接呈现四字神名，而不以“主”这一称号替代；“雅威”是现代汉语中通行且贴近原名的音译。
- source_word: דַּבֵּר עִמִּי
  choice: 对我说
  rationale: 原文介词可直译为“与我说话”，但此处重点在雅威将传达什么；“对我说”符合现代汉语习惯，也不额外强化双方交谈的意味。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文使用神的专名，正文采用较贴近 YHWH 学术重构读音的“雅威”，保留专名性质，不以“主”替换。
- issue: 巴兰询问进一步话语的措辞
  choice: 雅威还要对我说什么
  alternative: 雅威还会对我说些什么
  rationale: “还要”贴近 יסף 所表达的追加、进一步之意，同时不判断雅威是否必然另有不同指示，保留叙事中的张力。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。“请你们也在这里住一夜”清楚保留请求语气和附加重点；“好让我知道”呈现目的关系。句式简洁，适合普通读者朗读与理解。
