revisions:
- from: 巴兰回答巴勒的臣仆说：“即使巴勒把他满屋的金银给我，我也不能越过雅威—我的上帝—口中所出的话[a][b]，去做小事或大事。”
  to: 巴兰回答巴勒的臣仆，说：“即使巴勒把他满屋的金银给我，我也不能越过雅威——我的上帝——所说的话，去做任何事，无论大小。”
  rationale: 修订仅改善中文句法和自然度：将同位语置于“所说的话”之前，避免破折号割裂领属结构；并将“小事或大事”改为“任何事，无论大小”，使原文的全括性表达在现代汉语中更清楚。保留“即使”、能力性的“不能”、“越过”这一习语意象、雅威之名及两则脚注。
