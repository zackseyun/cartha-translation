  terminology: “雅威”恰当保留四字神名的专名性质；“我的上帝”忠实反映 אֱלֹהָי。“臣仆”可用于君王差遣的随从／使者。正文以“越过……所说的话”保留原文习语，脚注说明其“违背命令”的含义，处理妥当。
