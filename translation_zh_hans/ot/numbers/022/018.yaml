base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/018.yaml
  text: Balaam answered and said to Balak’s servants, “Even if Balak were to give me his house full of silver and gold, I could not go beyond the word of Yahweh my God, to do anything small or great.”
translation:
  language: zh_hans
  text: 巴兰回答巴勒的臣仆，说：“即使巴勒把他满屋的金银给我，我也不能越过雅威——我的上帝——所说的话，去做任何事，无论大小。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַן
  choice: 回答
  rationale: 这是叙事中引出回应的常用表达；“回答”保留正式的对话结构。
- source_word: עַבְדֵי בָלָק
  choice: 巴勒的臣仆
  rationale: 此处指巴勒派来的使者或宫廷人员。“臣仆”既保留从属关系，也避免把他们误解为仅指奴隶。
- source_word: אִם יִתֶּן לִי בָלָק
  choice: 即使巴勒……给我
  rationale: אִם字面为“如果”；在此假设语境中带有让步意味，现代汉语用“即使”能自然表达巴兰所设想的极端条件。
- source_word: מְלֹא בֵיתוֹ כֶּסֶף וְזָהָב
  choice: 他满屋的金银
  rationale: 保留“房屋充满金银”的财富意象，同时符合现代汉语表达。
- source_word: לֹא אוּכַל
  choice: 我也不能
  rationale: יכל表达能力或可能性上的不能，不仅是主观上不愿意；“也”与前面的让步条件自然呼应。
- source_word: לַעֲבֹר אֶת פִּי
  choice: 越过……口中所出的话
  rationale: 尽量保留希伯来语“越过……的口”这一具体比喻，同时用“口中所出的话”使汉语可理解。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见音译呈现四字神名，区别于称号“主”。
- source_word: אֱלֹהָי
  choice: 我的上帝
  rationale: 直接保留第一人称领属关系，不额外推断巴兰与雅威之间关系的性质。
- source_word: לַעֲשׂוֹת קְטַנָּה אוֹ גְדוֹלָה
  choice: 去做小事或大事
  rationale: 保留“小或大”的两极并举，表达无论事情大小都包括在内。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名，而非一般称号；音译“雅威”保留专名性质。
- issue: 巴兰所说“不能”的语气
  choice: 保留能力或可能性上的“不能”
  alternative: 不肯违背雅威的命令
  rationale: 原文使用יכל（能够），并以“越过……的口”描述界限。译文不将其简化为单纯的主观拒绝。
- issue: “越过……的口”的含义
  choice: 正文保留比喻为“越过……口中所出的话”
  alternative: 违背雅威我上帝的命令
  rationale: 原文的具体说法既可理解为超出所说范围，也包含违犯所命之意；正文与脚注共同保留这一张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“臣仆”适合王室使者的身份；破折号突出“我的上帝”是对雅威的同位说明。正文有意保留希伯来语的“越过”比喻，并借脚注解释其习语含义。
