base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/013.yaml
  text: So Balaam rose in the morning and said to Balak’s officials[a], “Go to your land, because Yahweh has refused to let me go with you.”
translation:
  language: zh_hans
  text: 于是巴兰早晨起来，对巴勒的官员[a]说：“你们回自己的地方去吧，因为雅威不肯让我跟你们一起去。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“巴勒的首领”或“巴勒的权贵”。
    reason: שָׂרֵי含义较宽，可指官员、首领或地位显赫者；正文按这些人作为王室使者的身份译为“官员”。
lexical_decisions:
- source_word: וַיָּקָם
  choice: 起来
  rationale: קום的Qal叙事形式表示接续动作；与“早晨”连用时，“起来”是自然、准确的现代汉语表达。
- source_word: בַּבֹּקֶר
  choice: 早晨
  rationale: 标准时间短语；“早晨起来”简洁自然，不额外加入“很早”等原文没有的强调。
- source_word: שָׂרֵי בָלָק
  choice: 巴勒的官员
  rationale: שָׂרִים可指官员、首领或权贵；这些人是巴勒派出的使者，“官员”能清楚表达其政治代表身份，又不限定为世袭王族。
- source_word: לְכוּ אֶל אַרְצְכֶם
  choice: 你们回自己的地方去吧
  rationale: הלך的命令式本义为“去”；结合使团返程的语境译作“回……去”自然明确。אֶרֶץ在这里指他们所属之地，“自己的地方”符合现代汉语习惯。
- source_word: כִּי
  choice: 因为
  rationale: 引出巴兰要求使者返回的理由，用“因为”最清楚直接。
- source_word: מֵאֵן
  choice: 不肯
  rationale: מאן的Piel完成式表达明确拒绝；“不肯”保留意志性的拒绝，且适合直接引语。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文直接音译四字神名，保留其专名性质，不以称号替代。
- source_word: לְתִתִּי לַהֲלֹךְ
  choice: 让我……去
  rationale: נתן接不定式在此具有准许、容许之意；译为“让我去”比逐字译法自然，同时准确传达许可被拒。
- source_word: עִמָּכֶם
  choice: 跟你们一起
  rationale: עִם表示伴随；“跟你们一起去”自然传达随使团同行之意。
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: אמר的常规叙事译法，简洁自然。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文使用四字神名而非普通称号；“雅威”较直接地反映学界通行的拟音，并保留神名的专名性质。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“于是”承接叙事；命令句加“吧”使口吻自然，但仍保留明确的遣返意味。正文保留שָׂרֵי的词义弹性于脚注，并将神名译为“雅威”。
