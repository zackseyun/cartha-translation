base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/030.yaml
  text: Then the donkey said to Balaam[a], “Am I not your donkey, on which you have ridden all your life to this day? Have I ever been accustomed to do thus to you?” And he said, “No.”
translation:
  language: zh_hans
  text: 母驴对巴兰说[a]：“我不是你的母驴吗？从你有我以来，直到今天，你一直骑着我，不是吗？我一向会这样对待你吗？”他说：“没有。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “母驴”：希伯来语所用名词特指雌性的驴。另，“从你有我以来”也可理解为“从你有生以来”。
    reason: 说明原文名词的性别特指，并保留מֵעוֹדְךָ在此处可能指向巴兰自身存续时间的语义歧义。
lexical_decisions:
- source_word: הָאָתוֹן / אֲתֹנְךָ
  choice: 母驴 / 你的母驴
  rationale: אָתוֹן特指雌性驴；“母驴”在现代汉语中自然清楚，也保留了原文明确标示的性别。
- source_word: הֲלוֹא אָנֹכִי אֲתֹנְךָ
  choice: 我不是你的母驴吗
  rationale: הֲלוֹא引出期待肯定回答的反问；此译保留其申辩语气。
- source_word: אֲשֶׁר רָכַבְתָּ עָלַי
  choice: 你不是一直骑着我吗
  rationale: 原文关系从句表达巴兰骑乘这头母驴；汉语依上下文重组为反问句，衔接更自然。
- source_word: מֵעוֹדְךָ עַד הַיּוֹם הַזֶּה
  choice: 从你有我以来，直到今天
  rationale: מֵעוֹדְךָ字面和句法较少见，可能指“自你存在以来”或“自你拥有我以来”。结合“你的母驴”和长期骑乘的语境，正文采用自然的“从你有我以来”，并用脚注保存另一理解。
- source_word: הַהַסְכֵּן הִסְכַּנְתִּי
  choice: 我向来曾……吗
  rationale: סכן的同根不定式绝对形与限定动词连用，强调惯常行为；“向来曾……吗”保留强调和反问意味。
- source_word: לַעֲשׂוֹת לְךָ כֹּה
  choice: 这样待过你
  rationale: כֹּה指母驴当下的异常举动；“这样待过你”既表达行为方式，也保留לְךָ所体现的针对关系。
- source_word: וַיֹּאמֶר לֹא
  choice: 他说：“没有。”
  rationale: 按汉语对“曾否如此”的问句，以“没有”作简洁自然的否定回答。
theological_decisions: []
