base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/022.yaml
  text: But God’s anger burned because he was going[a], and the angel of Yahweh took his stand in the road as an adversary to him. He was riding on his donkey[b], and his two young men were with him.
translation:
  language: zh_hans
  text: 因他前去，神的怒气燃起了。雅威的使者在路上站定，作他的敌手[a]。当时他骑着自己的母驴，两个年轻人也跟他在一起。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里译作“敌手”的希伯来词是 שָׂטָן（satan），意思是“敌手”或“对手”；此处不一定是专名“撒但”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּחַר אַף אֱלֹהִים
  choice: 神的怒气就发作了
  rationale: 保留希伯来语“怒气燃起”的强烈意象，同时采用现代汉语中自然、庄重的表达。
- source_word: כִּי הוֹלֵךְ הוּא
  choice: 因他前去
  rationale: 按原文将巴兰前去一事表述为神发怒的原因，不添加“执意”等原文未明说的动机，以保留上下文中的张力。
- source_word: וַיִּתְיַצֵּב
  choice: 站在
  rationale: 该反身词形含有主动就位、站定的意味；结合“在路上”已能自然传达有意挡在其行程中的场景。
- source_word: מַלְאַךְ יְהוָה
  choice: 雅威的使者
  rationale: מַלְאַךְ 的基本义是“使者”，此处指天上的使者；将神名 יְהוָה 音译为“雅威”。
- source_word: לְשָׂטָן לוֹ
  choice: 要与他作对
  rationale: 此处 שָׂטָן 是普通名词，表示敌对者或对手；译成自然的动词短语，避免误解为专名“撒但”。
- source_word: אֲתֹנוֹ
  choice: 自己的母驴
  rationale: 原词明确指雌性的驴；“母驴”在汉语叙事中自然，也保留了原文信息。
- source_word: שְׁנֵי נְעָרָיו
  choice: 两个年轻人
  rationale: נַעַר 可指年轻人、仆人或随从；采用较直接且不过度限定其身份的“年轻人”。
theological_decisions:
- issue: שָׂטָן 在本节中的所指
  choice: 与他作对
  alternative: 作他的敌手；撒但
  rationale: 语法和语境表明该词在此描述雅威使者敌对、拦阻巴兰的角色，并非指名为“撒但”的另一位存在。
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名；采用“雅威”以明确呈现这个专名，而不以称号替代。
- issue: 神为何因巴兰前去而发怒
  choice: 不补充巴兰的隐含动机
  alternative: 因他执意前去；因他心怀恶意前去
  rationale: 本节只说神因他前去而发怒；补入“执意”或其他动机会消解叙事本身保留的张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。“因他前去”刻意保持简洁，不替原文解释神发怒的深层原因；“两个年轻人”保留其身份可能是随从或仆人的词义开放性。
