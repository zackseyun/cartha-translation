  to: 因他前去，神的怒气燃起了。雅威的使者在路上站定，作他的敌手[a]。当时他骑着自己的母驴，两个年轻人也跟他在一起。
  rationale: 修订仅提升与原文形式和语义的对应：以“怒气燃起了”保留希伯来习语的形象，以“站定”表达使者有意拦在路上，并以“作他的敌手”保留 שָׂטָן 的普通名词和角色性含义。没有增加巴兰前去的动机，也没有把该词解释为专名“撒但”。
