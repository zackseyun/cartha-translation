  text: וַ/יֹּ֨אמֶר מוֹאָ֜ב אֶל זִקְנֵ֣י מִדְיָ֗ן עַתָּ֞ה יְלַחֲכ֤וּ הַ/קָּהָל֙ אֶת כָּל סְבִ֣יבֹתֵ֔י/נוּ כִּ/לְחֹ֣ךְ הַ/שּׁ֔וֹר אֵ֖ת יֶ֣רֶק הַ/שָּׂדֶ֑ה וּ/בָלָ֧ק בֶּן צִפּ֛וֹר מֶ֥לֶךְ לְ/מוֹאָ֖ב בָּ/עֵ֥ת הַ/הִֽוא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/004.yaml
  text: And Moab said to the elders of Midian[a], “Now this assembly will lick up all that is around us[b], as the ox licks up the green growth of the field.” Now Balak son of Zippor was king of Moab at that time.
translation:
  language: zh_hans
  text: 摩押对米甸的长老说：“现在，这会众要把我们周围的一切都舔尽，就像牛舔尽田野的青绿植物一样。”那时，西拨的儿子巴勒作摩押王。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מוֹאָב
  choice: 摩押
  rationale: 按民族及其政治共同体的名称译出；原文将摩押拟人化为说话者，中文可自然地以“摩押”为主语。
- source_word: זִקְנֵי מִדְיָן
  choice: 米甸的长老
  rationale: 直接体现附属结构“米甸的长老”，自然且清楚。
- source_word: הַקָּהָל
  choice: 这会众
  rationale: 指聚集的以色列群体；“会众”保留共同体、集会群体之义，“这”体现语境中的指示意味。
- source_word: יְלַחֲכוּ
  choice: 要……舔尽
  rationale: 保留לחך“舔”的具体意象，并以“尽”表达彻底吞食周围之物的语境含义，也与后面的牛之比喻呼应。
- source_word: אֶת כָּל סְבִיבֹתֵינוּ
  choice: 我们周围的一切
  rationale: 自然表达字面所指的“我们四周所有之物”，不把范围不必要地限定为土地或食物。
- source_word: כִּלְחֹךְ הַשּׁוֹר
  choice: 就像牛舔尽……一样
  rationale: 保留比较结构及לחך词根的重复，使原文鲜明的农业意象在中文中连贯。
- source_word: יֶרֶק הַשָּׂדֶה
  choice: 田野的青绿植物
  rationale: יֶרֶק泛指绿色植物、青绿草木，并非只指草；此译比“青草”范围更准确。
- source_word: וּבָלָק בֶּן צִפּוֹר
  choice: 那时，西拨的儿子巴勒
  rationale: 将此处连接词按背景说明处理；“西拨的儿子巴勒”清楚保留父子关系。
- source_word: מֶלֶךְ לְמוֹאָב בָּעֵת הַהִוא
  choice: 作摩押王
  rationale: 结合句首“那时”自然表达当时的王位身份，忠实而简洁。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事体。保留“舔尽”的重复意象，不以“吞吃”抹平原文比喻；“青绿植物”避免把יֶרֶק过度限定为青草。专名采用常见中文圣经译名“摩押、米甸、巴勒、西拨”。
