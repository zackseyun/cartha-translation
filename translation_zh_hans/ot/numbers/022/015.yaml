  text: וַ/יֹּ֥סֶף ע֖וֹד בָּלָ֑ק שְׁלֹ֣חַ שָׂרִ֔ים רַבִּ֥ים וְ/נִכְבָּדִ֖ים מֵ/אֵֽלֶּה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/015.yaml
  text: Then Balak again sent officials[a], more numerous and more honored than these.
translation:
  language: zh_hans
  text: 于是，巴勒又派了一批官长来；他们人数更多，地位也比先前那些人更高。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּסֶף עוֹד ... שְׁלֹחַ
  choice: 又派了
  rationale: יָסַף与不定式连用，加上עוֹד，表示再次进行同一行动；现代汉语用“又派了”自然地表达重复，并由“于是”承接叙事。
- source_word: בָּלָק
  choice: 巴勒
  rationale: 按现代中文圣经人名的通行音译处理。
- source_word: שָׂרִים
  choice: 官长
  rationale: 该词在此指奉命出使的高级人员或权贵代表；“官长”既体现身份，也符合庄重的经文语体。
- source_word: רַבִּים
  choice: 人数更多
  rationale: 受后面的比较结构מֵאֵלֶּה支配，此处不是单说“许多”，而是说第二批使者比先前一批人数更多。
- source_word: וְנִכְבָּדִים
  choice: 地位也……更高
  rationale: נכבד源于כבד，在此表示受尊重、显贵或身份重要；“地位更高”以自然现代汉语传达社会声望和等级之意。
- source_word: מֵאֵלֶּה
  choice: 比先前那些人
  rationale: 直译为“比这些人”；所指是上一批使者。中文明确为“先前那些人”，可避免指示对象含混而不改变意义。
theological_decisions: []
translation_notes:
  register: 采用现代、清楚而庄重的叙事语体。“一批”补足中文表达，使“人数更多”的比较自然；分号清楚连接第二批使者的两项比较特征。原文此处主要涉及人数与身份等级，不存在需要另行处理的神学歧义。
