  text: הִנֵּ֤ה הָ/עָם֙ הַ/יֹּצֵ֣א מִ/מִּצְרַ֔יִם וַ/יְכַ֖ס אֶת עֵ֣ין הָ/אָ֑רֶץ עַתָּ֗ה לְכָ֤/ה קָֽבָ/ה לִּ/י֙ אֹת֔/וֹ אוּלַ֥י אוּכַ֛ל לְ/הִלָּ֥חֶם בּ֖/וֹ וְ/גֵרַשְׁתִּֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/011.yaml
  text: Look[a], the people who came out of Egypt have covered the face of the land. Now come, curse them for me. Perhaps I will be able to fight against them and drive them out.
translation:
  language: zh_hans
  text: 看哪，那从埃及出来的民已经遮盖了地面[a]。现在，来吧，为我咒诅他们；或许我能与他们交战，把他们赶出去。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“遮盖了地的眼”，这是指遮盖土地可见的表面。
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: 看哪
  rationale: 作为引起注意的感叹语，传达说话人的急切；“看哪”庄重而仍为现代读者所熟悉。
- source_word: הָעָם
  choice: 那……的民
  rationale: 指作为一个整体的以色列民；用“民”保留群体性，并与后文复数指称自然衔接。
- source_word: הַיֹּצֵא מִמִּצְרַיִם
  choice: 从埃及出来的
  rationale: 带冠词的分词短语修饰“民”，指出这群人的身份特征；汉语定语结构简洁自然。
- source_word: וַיְכַס
  choice: 遮盖了
  rationale: 表示这民已经铺满地表所造成的当前局面；“遮盖了”保留原文的覆盖意象。
- source_word: עֵין הָאָרֶץ
  choice: 地面
  rationale: 原文直译为“地的眼”，在此是指土地可见的表面；正文采用自然汉语，并以脚注保存原文意象。
- source_word: עַתָּה
  choice: 现在
  rationale: 标示从陈述局势转入紧迫请求。
- source_word: לְכָה
  choice: 请来
  rationale: 这是催促对方行动的命令式；“请来”符合汉语召请语气，同时不削弱请求的迫切性。
- source_word: קָבָה לִּי אֹתוֹ
  choice: 为我咒诅他们
  rationale: “咒诅”准确表达施加诅咒，“为我”保留受益与代理含义；“他们”按集合名词的实际所指处理。
- source_word: אוּלַי אוּכַל
  choice: 或许我就能
  rationale: 保留说话人对结果的推测与期望，不把可能性说成确定事实。
- source_word: לְהִלָּחֶם בּוֹ
  choice: 与他们交战
  rationale: 介词在此表示敌对对象；“交战”自然表达进入战斗的含义。
- source_word: וְגֵרַשְׁתִּיו
  choice: 把他们赶出去
  rationale: 表示将这民从当地驱逐；“出去”保留离开该地的方向含义。
theological_decisions: []
