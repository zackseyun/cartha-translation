  text: וַ/יֹּ֤אמֶר אֱלֹהִים֙ אֶל בִּלְעָ֔ם לֹ֥א תֵלֵ֖ךְ עִמָּ/הֶ֑ם לֹ֤א תָאֹר֙ אֶת הָ/עָ֔ם כִּ֥י בָר֖וּךְ הֽוּא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/012.yaml
  text: And God said to Balaam[a], “You must not go with them. You must not curse the people, because it is blessed.”
translation:
  language: zh_hans
  text: 神对巴兰说：“你不可跟他们去，也不可诅咒这百姓，因为他们[a]是蒙福的。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文此处用单数形式，回指集合单数“百姓”；中文按人群的自然表达译为“他们”。
    reason: 说明希伯来文集合单数与中文复数人称表达之间的语法对应。
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: 叙事中的连续式推动情节；现代汉语通常不必机械译出连接词，直接用“说”自然且忠实。
- source_word: אֱלֹהִים
  choice: 神
  rationale: 此处指向巴兰说话的真神；“神”是现代中文圣经语体中准确而通行的译法。
- source_word: לֹא תֵלֵךְ עִמָּהֶם
  choice: 你不可跟他们去
  rationale: לֹא加未完成式在直接话语中表达禁止；“不可”保留命令力度，并具有庄重而易懂的现代中文语感。
- source_word: לֹא תָאֹר אֶת הָעָם
  choice: 也不可咒诅那民
  rationale: אָרַר意为“咒诅”；第二个禁令用“也”自然衔接。“那民”指前文所涉及的以色列民，不额外增添解释。
- source_word: כִּי
  choice: 因为
  rationale: 引出不可咒诅的原因；“因为”在现代汉语中清楚直接。
- source_word: בָרוּךְ הוּא
  choice: 他们是蒙福的
  rationale: 希伯来文以阳性单数代词和谓语形容词回指集合名词הָעָם；中文以复数人称代词回指群体最自然，同时“蒙福”准确表达בָרוּךְ的状态。
theological_decisions:
- issue: “蒙福”从句中代词的所指与数
  choice: 译作“他们是蒙福的”，指以色列民这一整体
  alternative: 较形式对应地译作“它是蒙福的”或“他是蒙福的”
  rationale: 原文בָרוּךְ הוּא采用单数语法，是因先行词הָעָם为集合单数，并非指某个男性个体。现代汉语用“他们”指由人组成的群体更自然，也没有改变所指；“它”会把人群物化，“他”则容易误解为某个个人。
translation_notes:
  register: 采用自然、庄重、清楚的现代标准普通话。“不可”保留神直接禁令的力度；句式简洁，适合公开诵读。原文集合单数在中文中以群体复数自然表达，无需脚注。
