  yaml_path: translation/ot/numbers/022/039.yaml
  text: So Balaam went with Balak[a], and they came to Kiriath-huzoth.
translation:
  language: zh_hans
  text: 于是，巴兰与巴勒同行；他们来到基列·胡琐[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “基列·胡琐”可能意为“街道之城”或“空旷地之城”。
    reason: 说明该地名两个可能的词源含义，保留חֻצוֹת可指“街道”或“空旷地方”的词义幅度。
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: 同行
  rationale: 这是הלך的Qal叙事式，表示接续发生的行动；结合后面的介词עִם，用“与……同行”既自然，又准确表达一同前往。
- source_word: בִּלְעָם
  choice: 巴兰
  rationale: 采用现代中文圣经读者熟悉的人名音译。
- source_word: עִם
  choice: 与
  rationale: 该介词在此直接表示陪同、伴随关系。
- source_word: בָּלָק
  choice: 巴勒
  rationale: 采用现代中文圣经读者熟悉的人名音译。
- source_word: וַיָּבֹאוּ
  choice: 他们来到
  rationale: בוא的复数Qal叙事式推进叙事；“他们来到”保留复数主语和基本的趋向意义，不额外限定为进入或抵达某处内部。
- source_word: קִרְיַת חֻצוֹת
  choice: 基列·胡琐
  rationale: 此处作为专有地名，正文采用音译；中点清楚显示复合地名的两个组成部分，其词义另以脚注说明。
