base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/001.yaml
  text: Then the sons of Israel set out and camped in the plains of Moab[c][b][a], beyond the Jordan at Jericho.
translation:
  language: zh_hans
  text: 以色列人[a]起行，在摩押平原安营；那里即在约旦河对岸[b]、耶利哥对面[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“以色列的众子”，这是对以色列民族的惯常称呼。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“约旦河那边”。这个说法所指的方位取决于叙述者的观察位置。
    reason: lexical_alternative
  - marker: c
    text: 耶利哥是这里的地理参照点，说明摩押平原的营地位于约旦河另一边，与耶利哥相对。
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: 起行
  rationale: נסע在旷野行程叙事中指拔营出发、继续行进。“起行”简洁自然，也符合本书反复出现的行程语境。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 字面为“以色列的众子”，但在这里是指以色列民族整体；现代汉语以“以色列人”表达这一惯用民族称谓最为自然，脚注保留其字面形式。
- source_word: וַיַּחֲנוּ
  choice: 安营
  rationale: חנה意为驻扎、扎营。“安营”庄重而通俗，并与旷野行程的语境相称。
- source_word: בְּעַרְבוֹת מוֹאָב
  choice: 在摩押平原
  rationale: עֲרָבוֹת指平坦、较干旱的草原或旷野地带。“摩押平原”是清楚、自然且通行的地理表达。
- source_word: מֵעֵבֶר לְיַרְדֵּן
  choice: 在约旦河对岸
  rationale: עֵבֶר表示河的另一边或对岸，其方位随叙述视角而定；正文不直接加上“东岸”，以免消除原文保留的相对视角。
- source_word: יְרֵחוֹ
  choice: 正对着耶利哥
  rationale: “耶利哥”在此进一步标明摩押平原营地相对于约旦河西岸地标的位置。汉语用“正对着耶利哥”能清楚表达这一地理关系。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“起行—安营”保留民数记行程记载的节奏；以分号拆开密集的地理修饰，使中文清晰，同时不在正文中擅自把相对方位明确成“东岸”。
