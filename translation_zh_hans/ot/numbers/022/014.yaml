  text: So the officials of Moab got up and went to Balak, and said, “Balaam refused to go with us.”
translation:
  language: zh_hans
  text: 于是，摩押的首领们便起身去见巴勒，说：“巴兰不肯跟我们一起去。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׂרֵי מוֹאָב
  choice: 摩押的首领们
  rationale: שָׂרִים可指首领、官长或贵族；结合他们作为巴勒使者的身份，译作“首领们”自然且保留其地位含义。
- source_word: וַיָּק֨וּמוּ
  choice: 起来
  rationale: 直译该叙事动词，表示他们起身采取行动；与后面的“回到”衔接自然。
- source_word: וַיָּבֹאוּ אֶל־בָּלָק
  choice: 回到巴勒那里
  rationale: 原文是“来到巴勒那里”；上下文表明他们此前由巴勒派出，此处是返回复命，因此用“回到”明确自然语境而不增添实质信息。
- source_word: מֵאֵן
  choice: 不肯
  rationale: 该词表达拒绝或不愿做某事；“不肯”准确传达巴兰明确拒绝同行的意思。
- source_word: הֲלֹךְ עִמָּנוּ
  choice: 跟我们来
  rationale: 字面为“与我们同行”；这是使者向巴勒复命，中文直接引语用“跟我们来”最自然，并保留同行方向。
