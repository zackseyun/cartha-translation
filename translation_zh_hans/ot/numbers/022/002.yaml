  yaml_path: translation/ot/numbers/022/002.yaml
  text: Balak son of Zippor saw all that Israel had done to the Amorites[a].
translation:
  language: zh_hans
  text: 西拨的儿子巴勒看见了以色列对亚摩利人[a]所做的一切。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文作“对亚摩利人”（单数民族称谓）；这里用单数统指亚摩利人。
    reason: 说明原文以单数民族称谓表达集体意义，并反映原文介词所表达的关系。
lexical_decisions:
- source_word: וַיַּרְא
  choice: 看见了
  rationale: ראה意为“看见”；句首的叙事性וַ承接并推进叙事，现代汉语在此无需另加“现在”或“于是”。“了”自然表明叙事中已经发生的观察。
- source_word: בָּלָק בֶּן צִפּוֹר
  choice: 西拨的儿子巴勒
  rationale: 按现代中文的亲属关系表达调整语序，并采用通行圣经人名译法“巴勒”“西拨”。
- source_word: אֵת כָּל אֲשֶׁר
  choice: ……所做的一切
  rationale: אֵת标示直接宾语，כָּל אֲשֶׁר表示后述事项的全部；“所做的一切”准确且自然。
- source_word: עָשָׂה
  choice: 所做
  rationale: עָשָׂה的基本义为“做”。上下文已清楚表明这些事先于巴勒看见其结果，中文不必另行标出过去完成时。
- source_word: יִשְׂרָאֵל
  choice: 以色列
  rationale: 保留民族／群体名称“以色列”，不擅自增补原文没有的“人”。
- source_word: לָאֱמֹרִי
  choice: 对亚摩利人
  rationale: 介词ל在“做”这一语境中表示行为所涉及的对象；“对……所做”保留了原文较宽泛的关系，避免用“攻击”等词过度解释。原文民族称谓为单数集体用法，正文按自然中文译为复数意义的“亚摩利人”。
theological_decisions: []
