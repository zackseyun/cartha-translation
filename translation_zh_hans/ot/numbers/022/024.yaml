base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/024.yaml
  text: Then the angel of Yahweh stood in a narrow path between the vineyards[a], with a wall on this side and a wall on that side.
translation:
  language: zh_hans
  text: 于是，雅威的天使[a]站在葡萄园之间的窄路上；两边各有一道墙。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“雅威的使者。”希伯来语这个词既可指“使者”，也可指“天使”；这里的叙事语境表明所指的是超自然的天使。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲמֹד
  choice: 于是……站在
  rationale: 该叙事性动词形式推进情节；“于是”自然表达前后相承，“站在”保留עמד的基本意义。
- source_word: מַלְאַךְ יְהוָה
  choice: 雅威的使者
  rationale: מַלְאָךְ本义可指“使者”或超自然的“天使”；本叙事明确指超自然存在，但中文“使者”既保留词义的宽度，也符合上下文。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以常见音译呈现四字神名，保留其作为专名的性质，不以称号替代。
- source_word: בְּמִשְׁעוֹל הַכְּרָמִים
  choice: 在葡萄园之间的窄道上
  rationale: מִשְׁעוֹל指狭窄的路径；复数“葡萄园”与随后道路两边都有墙的空间描述相呼应。
- source_word: גָּדֵר מִזֶּה וְגָדֵר מִזֶּה
  choice: 一边有墙，另一边也有墙
  rationale: 紧贴重复结构，清楚表达窄道两侧各有一道墙；原文未说明材质，因此不增译为“石墙”。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华／主
  rationale: 原文直接使用四字神名；采用“雅威”以专名形式呈现，不以“主”这一称号替换。
- issue: מַלְאַךְ在本节中的身份表达
  choice: 正文作“使者”，脚注说明也可译“天使”
  alternative: 雅威的天使
  rationale: 上下文表明这是超自然存在，但该希伯来词本身兼有“使者”和“天使”之义；正文保留词汇张力，脚注交代符合语境的另一译法。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“一边……另一边……”自然呈现道路受两墙夹逼的场景；不添加原文未明说的墙体材质。
