  text: וַ/תֵּ֨רֶא הָ/אָת֜וֹן אֶת מַלְאַ֣ךְ יְהוָ֗ה וַ/תִּלָּחֵץ֙ אֶל הַ/קִּ֔יר וַ/תִּלְחַ֛ץ אֶת רֶ֥גֶל בִּלְעָ֖ם אֶל הַ/קִּ֑יר וַ/יֹּ֖סֶף לְ/הַכֹּתָֽ/הּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/025.yaml
  text: When the donkey saw the angel of Yahweh[a], she pressed herself against the wall and pressed Balaam’s foot against the wall, so he struck her again.
translation:
  language: zh_hans
  text: 母驴看见雅威的天使[a]，就把身子挤向墙边，把巴兰的脚挤在墙上；巴兰又打了它。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“雅威的使者”。这里所指的显然是超自然的存在，因此正文译作“天使”。
    reason: 保留מַלְאָךְ可译作一般“使者”的词义，同时说明上下文采用“天使”的依据。
lexical_decisions:
- source_word: הָאָתוֹן
  choice: 母驴
  rationale: אָתוֹן特指雌性的驴；译作“母驴”简明自然，也保留了原文所指动物的性别。
- source_word: מַלְאַךְ יְהוָה
  choice: 雅威的天使
  rationale: מַלְאַךְ既可指一般的“使者”，也可指超自然的“天使”；本段叙事明确呈现超自然存在，因此正文采用“天使”，并以脚注保留词义上的另一可能。
- source_word: וַתִּלָּחֵץ אֶל הַקִּיר
  choice: 就挤向墙边
  rationale: 该表达描写母驴把身子紧贴着墙移动；“挤向墙边”符合现代汉语表达，并传达受挤压、贴近墙面的动作。
- source_word: וַתִּלְחַץ אֶת רֶגֶל בִּלְעָם אֶל הַקִּיר
  choice: 把巴兰的脚挤在墙上
  rationale: 同一词根לחץ在此以巴兰的脚为宾语，表示母驴的动作使他的脚被夹挤在墙上；重复使用“挤”保留原文的词汇呼应。
- source_word: רֶגֶל
  choice: 脚
  rationale: רֶגֶל在此处通常指脚；场景是骑乘者的脚被挤到墙上，译作“脚”最贴切。
- source_word: וַיֹּסֶף לְהַכֹּתָהּ
  choice: 巴兰又打了它
  rationale: יָסַף加不定式表示动作再次发生或继续；结合上下文，译作“又打了它”简洁地表达重复动作，不额外暗示持续殴打的时长。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名יְהוָה；“雅威”较贴近学界通常重构的读音，并在现代汉语中清楚保留这一专名。
- issue: מַלְאַךְ יְהוָה的身份称谓
  choice: 雅威的天使
  alternative: 雅威的使者
  rationale: מַלְאַךְ本义可为“使者”，但本段中的这一存在具有明确的超自然性质，所以正文用“天使”；脚注保留较宽泛的词义，不进一步界定其神学身份。
translation_notes:
  register: 采用现代、庄重而通顺的叙事语言。“挤向墙边……挤在墙上”保留原文同一词根的重复；末句补明“巴兰”为施事者，以免汉语代词产生歧义。
