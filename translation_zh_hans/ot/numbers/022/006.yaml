  text: וְ/עַתָּה֩ לְכָ/ה נָּ֨א אָֽרָ/ה לִּ֜/י אֶת הָ/עָ֣ם הַ/זֶּ֗ה כִּֽי עָצ֥וּם הוּא֙ מִמֶּ֔/נִּי אוּלַ֤י אוּכַל֙ נַכֶּה בּ֔/וֹ וַ/אֲגָרְשֶׁ֖/נּוּ מִן הָ/אָ֑רֶץ כִּ֣י יָדַ֗עְתִּי אֵ֤ת אֲשֶׁר תְּבָרֵךְ֙ מְבֹרָ֔ךְ וַ/אֲשֶׁ֥ר תָּאֹ֖ר יוּאָֽר־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/006.yaml
  text: So now[a], please come and curse this people for me, because they are too mighty for me. Perhaps I will be able to strike them and drive them out of the land, for I know that whoever you bless is blessed[b], and whoever you curse is cursed.
translation:
  language: zh_hans
  text: 所以，现在，请你来为我咒诅这百姓，因为他们比我强大。或许我就能攻击他们[a]，把他们赶出这地；因为我知道，你祝福谁，谁就蒙福；你咒诅谁，谁就受咒诅。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文此处先说“或许我能”（第一人称单数），随后说“我们攻击他们”（第一人称复数），人称有转换；译文为通顺起见协调为“我就能攻击他们”。“百姓”在原文为单数集合名词。
    reason: textual_grammar
lexical_decisions:
- source_word: וְעַתָּה
  choice: 所以现在
  rationale: 既承接上文，又表达巴勒请求中的紧迫转折。
- source_word: לְכָה נָּא
  choice: 请你来
  rationale: 命令式与恳求语气词 נָא 并用；“请你来”自然地保留礼貌而急切的请求。
- source_word: אָרָה לִּי אֶת הָעָם הַזֶּה
  choice: 为我咒诅这百姓
  rationale: אָרָה 指以咒诅招致祸患；“为我”保留 לִּי 所表达的受益或委托关系，“这百姓”保留集合名词的表达。
- source_word: כִּי עָצוּם הוּא מִמֶּנִּי
  choice: 因为他们比我强大
  rationale: מִמֶּנִּי 表示比较；中文用“比我强大”准确表达军事力量上的威胁，并以复数代词自然指代集合性的“百姓”。
- source_word: אוּלַי אוּכַל נַכֶּה בּוֹ
  choice: 或许我就能击败他们
  rationale: אוּלַי 保留不确定性；נכה 本义为击打，在军事语境中译作“击败”较符合现代汉语。原文从第一人称单数“我能”转为第一人称复数“我们击打”，中文正文按整体语义顺译，脚注注明这一形式特点。
- source_word: וַאֲגָרְשֶׁנּוּ מִן הָאָרֶץ
  choice: 把他们从这地赶出去
  rationale: גרש 表示驱逐、赶出；“这地”在语境中指当地地域，不预先限定为现代意义的国家。
- source_word: אֵת אֲשֶׁר תְּבָרֵךְ מְבֹרָךְ
  choice: 你祝福谁，谁就蒙福
  rationale: 以自然中文保留泛指关系和结果状态；“蒙福”体现被动、结果性的 מְבֹרָךְ。
- source_word: וַאֲשֶׁר תָּאֹר יוּאָר
  choice: 你咒诅谁，谁就受咒诅
  rationale: 与前句保持平行，并用“受咒诅”体现 יוּאָר 的被动形式。
theological_decisions:
- issue: 巴兰祝福或咒诅之能力的表述
  choice: 按巴勒本人的认知直接引述：“我知道，你祝福谁……你咒诅谁……”
  alternative: 将这句话解释为对巴兰真实属灵权能的客观确认
  rationale: 本节是巴勒的话；译文不应越过叙事视角，替经文判定巴勒的认知在神学上是否完全正确。
translation_notes:
  register: 采用现代、庄重而易懂的叙事用语。“咒诅／祝福／蒙福／受咒诅”保留原文的平行结构；避免古雅的“击打之、逐之”等表达。
