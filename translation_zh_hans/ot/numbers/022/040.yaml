  yaml_path: translation/ot/numbers/022/040.yaml
  text: And Balak sacrificed cattle and sheep[b][a], and sent some to Balaam and to the officials who were with him.
translation:
  language: zh_hans
  text: 巴勒献祭牛羊[b]，又送给巴兰和跟他在一起的官员。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文只说“送”，没有说明所送的是什么；根据前文献祭牲畜的语境，可理解为送祭肉或祭物的份额。
    reason: lexical_alternative
  - marker: b
    text: “羊”也可理解为“小牲畜”或“羊群”，因为这里的希伯来词可包括绵羊和山羊。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזְבַּח
  choice: 献上
  rationale: זבח通常指为献祭而宰杀；结合宾语和叙事场景，“献上”自然表达祭祀含义，避免理解成普通屠宰。
- source_word: בָּקָר
  choice: 牛
  rationale: בקר是牛类牲畜的集合称谓；“牛”简洁自然，也不限定为公牛。
- source_word: צֹאן
  choice: 羊群
  rationale: צאן是集合称谓，可包括绵羊和山羊；“羊群”比单说“羊”更能保留其范围，具体所指仍见脚注。
- source_word: וַיְשַׁלַּח
  choice: 又把一些祭肉送给
  rationale: 动词本身仅表示“送”，并未明说所送之物；上下文是献祭牲畜，因此补出“一些祭肉”使汉语完整，但以脚注说明这是语境补足。
- source_word: לְבִלְעָם
  choice: 给巴兰
  rationale: 人名按现代中文圣经通行译名音译。
- source_word: לַשָּׂרִים
  choice: 官员
  rationale: שׂרים指有地位的官长或官员；“官员”是清楚的现代汉语，也避免“王子”可能带来的世袭身份含义。
- source_word: אֲשֶׁר אִתּוֹ
  choice: 跟他在一起的
  rationale: 单数代词最自然地回指邻近的“巴兰”；保留代词表达，不将所指直接写死。
