  yaml_path: translation/ot/numbers/022/021.yaml
  text: So Balaam rose in the morning[a], saddled his donkey, and went with the princes of Moab.
translation:
  language: zh_hans
  text: 巴兰早晨起来，给他的母驴备上鞍，就和摩押的首领一同去了。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּקָם
  choice: 起来
  rationale: קום的Qal叙事形式表示接续动作；“起来”是现代汉语中自然、直接的表达。
- source_word: בִּלְעָם
  choice: 巴兰
  rationale: 按现代中文圣经人名的通行译法音译。
- source_word: בַּבֹּקֶר
  choice: 早晨
  rationale: 原文是通常的时间短语“在早晨”，并未明确加入“很早”或“清早”的强化意味。
- source_word: וַיַּחֲבֹשׁ
  choice: 备好鞍
  rationale: חבש用于驴时，指给牲口装鞍、备妥以供骑乘；“备好鞍”比生硬的“给……上鞍”更自然，也保留准备牲口的动作。
- source_word: אֶת אֲתֹנוֹ
  choice: 自己的母驴
  rationale: אָתוֹן明确指母驴；中文直接说“母驴”自然且准确，无须像英语那样把性别信息移入脚注。反身领属“自己的”清楚表达后缀“他的”。
- source_word: וַיֵּלֶךְ
  choice: 去了
  rationale: הלך在简单叙事中意为“去、行走”；“去了”不额外加入“动身”或“启程”的语义。
- source_word: עִם
  choice: 和……一同
  rationale: 准确表达陪同关系，并使现代汉语句式流畅。
- source_word: שָׂרֵי מוֹאָב
  choice: 摩押的首领
  rationale: שָׂרִים可指统治者、要员或官长；“首领”保留其政治与社会地位，且比“王子”更避免误导为王室子嗣。
