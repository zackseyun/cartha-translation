source:
  edition: WLC
  text: וַ/יֹּאמֶר֩ מַלְאַ֨ךְ יְהוָ֜ה אֶל בִּלְעָ֗ם לֵ֚ךְ עִם הָ֣/אֲנָשִׁ֔ים וְ/אֶ֗פֶס אֶת הַ/דָּבָ֛ר אֲשֶׁר אֲדַבֵּ֥ר אֵלֶ֖י/ךָ אֹת֣/וֹ תְדַבֵּ֑ר וַ/יֵּ֥לֶךְ בִּלְעָ֖ם עִם שָׂרֵ֥י בָלָֽק־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/035.yaml
  text: Then the angel of Yahweh said to Balaam[a], “Go with the men, but only the word that I speak to you[c][b], that you shall speak.” So Balaam went with the officials of Balak.
translation:
  language: zh_hans
  text: 雅威的天使[a]对巴兰说：“你跟这些人去吧；不过，我对你说的话[b]，你只能说那话。”于是，巴兰就跟巴勒的官员[c]去了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“雅威的使者”。
    reason: lexical_alternative
  - marker: b
    text: “话”也可译作“信息”或“事情”。
    reason: lexical_alternative
  - marker: c
    text: 或译“巴勒的首领”或“巴勒的官长”。
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְאַךְ יְהוָה
  choice: 雅威的天使
  rationale: מַלְאַךְ 可指“使者”或“天使”；本段叙事明确描写一位超自然存在，因此正文采用“天使”，并以脚注保留“使者”这一词义。神名 יְהוָה 音译为“雅威”。
- source_word: לֵךְ עִם הָאֲנָשִׁים
  choice: 你跟这些人去吧
  rationale: 准确表达命令式 לֵךְ 与介词 עִם；“这些人”在上下文中自然指与巴兰同行的男子。
- source_word: וְאֶפֶס
  choice: 不过
  rationale: 此词在准许巴兰同行之后引出严格限制；“不过”自然传达转折和限定作用。
- source_word: הַדָּבָר
  choice: 话
  rationale: דָּבָר 可指话、信息、事情；这里与两次“说”相连，译作“话”最符合言语语境，同时以脚注保留其他可能。
- source_word: אֲדַבֵּר אֵלֶיךָ אֹתוֹ תְדַבֵּר
  choice: 我对你说的话，你只能说那话
  rationale: 保留前置宾语及 אֹתוֹ 的回指强调，明确巴兰不得说所领受之话以外的内容；“只能”在现代汉语中自然表达此限制。
- source_word: שָׂרֵי בָלָק
  choice: 巴勒的官员
  rationale: שָׂרִים 可指首领、官长或官员；在外交使团语境中，“官员”自然且不会误导为君王之子。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；正文采用较贴近其通常学术重构读音 Yahweh 的现代汉语音译“雅威”，而不以称号替代。
- issue: מַלְאַךְ יְהוָה 的身份称谓
  choice: 雅威的天使
  alternative: 雅威的使者
  rationale: 上下文呈现超自然显现，故正文译“天使”；同时，希伯来词本身具有“使者”的词义，脚注予以保留，不据此进一步界定其神学身份。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“我对你说的话，你只能说那话”略保留希伯来文的重复与强调，以呈现巴兰只能传达所领受之言的严格限制。
