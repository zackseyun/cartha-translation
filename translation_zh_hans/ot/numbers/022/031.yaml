    issue: 末句将וַיִּקֹּד译为“低下头”，并将לְאַפָּיו概括为“俯伏在地”。
    rationale: וַיִּקֹּד表示躬身、屈身下拜，不只是低头；לְאַפָּיו明确表示脸朝地。改为“俯身下拜，脸伏于地”可保留两个动作及其具体姿态，而不额外解释为敬拜。
  - severity: low
    issue: 脚注a的替代译文“使巴兰的眼睛开了”不够自然。
    rationale: “开启巴兰的眼睛”更符合现代汉语，也能作为“揭开”的惯用性替代译法；脚注仍须说明原文直译为“揭开”。
