- from: 雅威揭开了巴兰的眼睛[a]，他就看见雅威的使者[b]站在路上，手中握着出鞘的剑。巴兰便低下头，俯伏在地[c]。
  to: 雅威揭开了巴兰的眼睛[a]，他就看见雅威的使者[b]站在路上，手中握着出鞘的剑。巴兰便俯身下拜，脸伏于地[c]。
  rationale: 修订仅加强末句对希伯来文两个连续动词及“脸伏于地”这一习语的对应，并润饰脚注a的汉语表达。神名、使者称谓及不将身体动作预先定性为敬拜的处理均予保留。
