source:
  edition: WLC
  text: וַ/יְגַ֣ל יְהוָה֮ אֶת עֵינֵ֣י בִלְעָם֒ וַ/יַּ֞רְא אֶת מַלְאַ֤ךְ יְהוָה֙ נִצָּ֣ב בַּ/דֶּ֔רֶךְ וְ/חַרְבּ֥/וֹ שְׁלֻפָ֖ה בְּ/יָד֑/וֹ וַ/יִּקֹּ֥ד וַ/יִּשְׁתַּ֖חוּ לְ/אַפָּֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/031.yaml
  text: Then Yahweh uncovered Balaam’s eyes[a], and he saw the angel of Yahweh standing in the road with his sword drawn in his hand[c][b]; and he bowed down and prostrated himself with his face to the ground.
translation:
  language: zh_hans
  text: 雅威揭开了巴兰的眼睛[a]，他就看见雅威的使者[b]站在路上，手中握着出鞘的剑。巴兰便俯身下拜，脸伏于地[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“开启巴兰的眼睛”。希伯来语动词直译为“揭开”。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“雅威的天使”。希伯来语词既可指一般的“使者”，也可指来自上帝的超自然使者。
    reason: lexical_alternative
  - marker: c
    text: 或译：“俯伏下拜，脸伏于地。”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְגַל
  choice: 揭开了
  rationale: גלה的基本意象是“揭开、除去遮蔽”。这里与“眼睛”构成具体而有张力的表达，表示雅威除去了阻碍巴兰看见的遮蔽；脚注补充较惯用的译法。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见音译“雅威”呈现四字神名，保留其专名性质，不以称号替代。
- source_word: מַלְאַךְ יְהוָה
  choice: 雅威的使者
  rationale: מַלְאָךְ的核心意义是“使者”，语境表明这是超自然存在；采用“使者”保留词义范围，不预先将其限定为后世术语“天使”。
- source_word: נִצָּב בַּדֶּרֶךְ
  choice: 站在路上
  rationale: 准确表达分词所描写的站立姿态及其挡在巴兰行路路线上的位置。
- source_word: וְחַרְבּוֹ שְׁלֻפָה בְיָדוֹ
  choice: 手中握着出鞘的剑
  rationale: 以自然汉语表达“他的剑已经拔出，在他手中”的伴随状态，同时保留武器已出鞘的威胁性画面。
- source_word: וַיִּקֹּד וַיִּשְׁתַּחוּ לְאַפָּיו
  choice: 低下头，俯伏在地
  rationale: 分别呈现弯身低头与俯伏的连续动作；避免直接译作“敬拜”，以免把身体动作所含的神学意义解释得过满。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用神的专名。音译“雅威”既保留专名，也避免用称号替换；不据此加入本节未明说的神学解释。
- issue: מַלְאַךְ יְהוָה 的身份表述
  choice: 雅威的使者
  alternative: 雅威的天使
  rationale: “使者”更直接对应מַלְאָךְ，并保留该称谓在叙事中的语义与身份张力；脚注列出传统而自然的“天使”译法。
- issue: וַיִּשְׁתַּחוּ 是否明确译作敬拜
  choice: 俯伏在地
  alternative: 敬拜；俯伏下拜
  rationale: 本节首先描写巴兰的身体反应。采用动作性措辞，不强行断定这一举动是否应被理解为完整意义上的敬拜。
translation_notes:
  register: 采用现代、庄重而易懂的叙事体。“揭开了……眼睛”有意保留希伯来语的具体意象，并以脚注提供更惯用的汉语表达；末句用两个连续动作呈现原文节奏。
