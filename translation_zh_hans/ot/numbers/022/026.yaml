source:
  edition: WLC
  text: וַ/יּ֥וֹסֶף מַלְאַךְ יְהוָ֖ה עֲב֑וֹר וַֽ/יַּעֲמֹד֙ בְּ/מָק֣וֹם צָ֔ר אֲשֶׁ֛ר אֵֽין דֶּ֥רֶךְ לִ/נְט֖וֹת יָמִ֥ין וּ/שְׂמֹֽאול־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/026.yaml
  text: Then the angel of Yahweh went farther and stood in a narrow place[a], where there was no way to turn to the right or to the left.
translation:
  language: zh_hans
  text: 耶和华的使者又往前去，站在一个狭窄的地方，那里无路可向右或向左转。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיּוֹסֶף ... עֲבוֹר
  choice: 又往前去
  rationale: יסף接不定式עֲבוֹר构成“继续前行、再次往前”的叙事表达；“又往前去”既体现动作再次发生，也符合上下文中使者移到前方另一处的情景。
- source_word: מַלְאַךְ יְהוָה
  choice: 耶和华的使者
  rationale: מַלְאַךְ本义为“使者”，在本段指超自然使者；中文“耶和华的使者”自然、庄重，并保留该词与普通“使者”之间的词义联系。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的专名“耶和华”呈现四字神名，而不以称号替代。
- source_word: וַיַּעֲמֹד
  choice: 站
  rationale: עמד在此表示使者站定位置；简洁译作“站”即可准确表达。
- source_word: בְּמָקוֹם צָר
  choice: 在一个狭窄的地方
  rationale: 直译该空间性短语，突出这处地点逼仄、无法绕行的特征。
- source_word: אֲשֶׁר אֵין דֶּרֶךְ
  choice: 那里无路可
  rationale: דֶּרֶךְ在此不是说完全没有道路，而是没有可供转向的通路；与后面的不定式连译为“无路可……转”最清楚。
- source_word: לִנְטוֹת יָמִין וּשְׂמֹאול
  choice: 向右或向左转
  rationale: נטה在方向语境中表示转向；中文按自然次序明确左右两个方向。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。译文保留专名性质；“耶和华”是现代简体中文圣经传统中最广为人知且易于普通读者识别的形式，不以“主”代替，也不借此解决其古代发音的不确定性。
- issue: מַלְאַךְ的身份称谓
  choice: 使者
  alternative: 天使
  rationale: 原词兼有“使者”和“天使”之义。上下文确指超自然存在，但“使者”保留希伯来语的基本词义及“奉差遣者”的意味，避免在译词中加入原文未明说的存在类别。
translation_notes:
  register: 采用现代、简洁而庄重的叙事语体。“又往前去”顺畅表达希伯来语“继续／再次前行”的结构；句末“向右或向左转”保留原文对左右两边均无退路的强调。无需脚注，因为正文已自然承载主要词义，且没有必须另行标示的文本歧义。
