  yaml_path: translation/ot/numbers/022/009.yaml
  text: Then God came to Balaam and said, “Who are these men with you?”
translation:
  language: zh_hans
  text: 于是，上帝来到巴兰那里，说：“跟你在一起的这些人是谁？”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹא
  choice: 于是……来到
  rationale: 叙事性连续式推进事件次序；“于是”自然承接上文，“来到……那里”准确表达 בוא אֶל 的趋向，不额外限定进入某处。
- source_word: אֱלֹהִים
  choice: 上帝
  rationale: 此处动词为单数，叙事语境所指为以色列的上帝；“上帝”是现代汉语中自然、庄重的对应词。
- source_word: בִּלְעָם
  choice: 巴兰
  rationale: 采用现代中文圣经传统中通行的人名音译。
- source_word: וַיֹּאמֶר
  choice: 问他说
  rationale: אמר 本义为“说”，但其后的直接引语是问句；“问他说”既保留言说引介，也符合中文叙事表达。
- source_word: מִי
  choice: 谁
  rationale: 该疑问代词要求辨明人物身份，直译为“谁”。
- source_word: הָאֲנָשִׁים הָאֵלֶּה
  choice: 这些人
  rationale: אֲנָשִׁים 在此指前来见巴兰的男性使者；汉语“这些人”自然涵盖其所指，避免生硬的“这些男人”。
- source_word: עִמָּךְ
  choice: 跟你在一起
  rationale: עם 加第二人称单数后缀表示陪同或同处；此译清楚表达他们与巴兰同在。
theological_decisions:
- issue: 巴兰叙事中 אֱלֹהִים 的所指
  choice: 上帝
  alternative: 一位神；神明
  rationale: 单数动词的一致关系及上下文表明，这里是上帝亲自向巴兰说话；译作“上帝”忠实呈现所指，同时不增加经文未明说的教义说明。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“于是”体现希伯来叙事推进；“来到巴兰那里”避免让中文读者误以为上帝进入了某个明确建筑；直接引语简洁自然。
