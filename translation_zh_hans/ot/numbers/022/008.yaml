base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/008.yaml
  text: And he said to them[a], “Lodge here tonight[c][b], and I will bring back word to you according to what Yahweh speaks to me.” So the princes of Moab stayed with Balaam.
translation:
  language: zh_hans
  text: 巴兰对他们说：“你们今晚就在这里留宿。雅威[a]对我说什么，我就把什么话转告你们。”于是，摩押的首领[b]就留在巴兰那里。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文为神的名YHWH，常拟音作“雅威”；传统中文译作“耶和华”。
    reason: 说明原文神名及中文译名传统。
  - marker: b
    text: “首领”也可译作“官员”或“王公”。
    reason: 保留שָׂרִים在身份和官阶上的词义幅度。
lexical_decisions:
- source_word: לִינוּ פֹה הַלַּיְלָה
  choice: 你们今晚在这里住宿
  rationale: לִינוּ是复数命令式，指留宿过夜；“今晚在这里住宿”自然地保留了地点、时间和过夜之意。
- source_word: וַהֲשִׁבֹתִי אֶתְכֶם דָּבָר
  choice: 我就把什么话转告你们
  rationale: 这一表达直译近于“把话带回给你们”，语境中指按所得启示回复来使；“转告你们”保留传达所得话语的含义，同时符合现代汉语习惯。
- source_word: כַּאֲשֶׁר יְדַבֵּר יְהוָה אֵלָי
  choice: 耶和华对我说什么
  rationale: כַּאֲשֶׁר表示依照或对应关系；本译以“说什么……就把什么……”呈现原文的对应结构。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者最熟悉的神名音译，并用脚注说明其对应希伯来文四字神名YHWH及另一常见拟音“雅威”。
- source_word: שָׂרֵי מוֹאָב
  choice: 摩押的首领
  rationale: שָׂרִים可指王公、官员或领袖；“首领”既能体现这些使者的显要身份，又不把其具体官阶说得过于确定。
- source_word: וַיֵּשְׁבוּ
  choice: 住下
  rationale: ישׁב本可指坐、居住或停留；在受邀过夜的语境中，“住下”最为自然。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威（YHWH）
  rationale: 原文使用神的专名而非普通称号。正文保留中文传统音译“耶和华”，脚注注明YHWH及另一常见拟音，避免将专名化为“主”等称号，也不对古代确切读音作过度断定。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“住宿”清楚表达留宿一夜的邀请；“住下”承接前句而避免生硬重复。“说什么……就把什么话……”保留原文所强调的严格对应关系。
