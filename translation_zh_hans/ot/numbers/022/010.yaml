base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/010.yaml
  text: And Balaam said to God[a], “Balak son of Zippor, king of Moab, has sent to me:”
translation:
  language: zh_hans
  text: 巴兰对上帝说：“西拨的儿子巴勒——摩押王——差人到我这里来：”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: 未将叙事性连接词 וַ 单独译出，符合现代汉语叙事习惯；“说”准确表达 אמר。
- source_word: בִּלְעָם
  choice: 巴兰
  rationale: 采用现代中文圣经中通行的人名音译。
- source_word: אֶל הָאֱלֹהִים
  choice: 对上帝
  rationale: 定冠词及上下文表明这里指前一节向巴兰显现的上帝；“对上帝说”是自然的现代汉语表达。
- source_word: בָּלָק בֶּן צִפֹּר
  choice: 西拨的儿子巴勒
  rationale: 按现代汉语习惯将父子关系置于人名前，同时保留原文身份信息；人名采用通行音译。
- source_word: מֶלֶךְ מוֹאָב
  choice: 摩押王
  rationale: 简洁、自然地表达“摩押的王”，并与后面的同位身份说明衔接。
- source_word: שָׁלַח אֵלָי
  choice: 派人来找我
  rationale: שׁלח 在此省略所派对象，结合使者已来到巴兰处的语境，汉语用“派人”补足隐含宾语；אֵלַי 直译是“到我这里”，语境上可自然表达为“来找我”。脚注保留较字面的译法。
theological_decisions:
- issue: הָאֱלֹהִים 的所指
  choice: 上帝
  alternative: 神明／诸神
  rationale: 定冠词、单数句法意义及紧接上文的叙事语境都指向与巴兰交谈的那一位上帝；此译法不额外加入教派性解释。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“摩押王西拨的儿子巴勒”避免生硬的多重后置同位语；末尾保留“说”及冒号，因为本节原文引出下一节的引语。
