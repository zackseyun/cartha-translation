base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/020.yaml
  text: God came to Balaam at night and said to him[a], “If the men have come to call you, rise, go with them; but only the word that I speak to you[b], that you shall do.”
translation:
  language: zh_hans
  text: 夜里，神来到巴兰那里，对他说[a]：“这些人若是来召你的，你就起来，跟他们去；但我对你所说的话[b]，你只能照着去做。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“如果这些人已经来召你。”
    reason: lexical_alternative
  - marker: b
    text: 或译：“但我对你所说的那件事，你只能去做。”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: 来到
  rationale: בוא在叙事体中表示神来到巴兰那里；不译为“显现”，以免加入原文没有明说的显现方式。
- source_word: אֱלֹהִים
  choice: 神
  rationale: 本节明确使用אֱלֹהִים，而非神名יהוה，因此保留原文的称谓区别。
- source_word: לַיְלָה
  choice: 夜里
  rationale: 自然、简洁地表达事情发生于夜间。
- source_word: אִם לִקְרֹא לְךָ בָּאוּ הָאֲנָשִׁים
  choice: 如果这些人来是要召你
  rationale: לִקְרֹא לְךָ在此指来召唤巴兰；“来是要……”自然地保留目的含义，完成体בָּאוּ按语境译作“来”。
- source_word: קוּם לֵךְ אִתָּם
  choice: 你就起来，跟他们去
  rationale: 保留“起来”和“去”两个命令，并用现代汉语自然表达。
- source_word: וְאַךְ
  choice: 不过……只能
  rationale: 同时表达转折和严格限制，说明准许同行并不等于准许自行其是。
- source_word: הַדָּבָר אֲשֶׁר אֲדַבֵּר אֵלֶיךָ
  choice: 我对你说什么
  rationale: דָּבָר与“说”相连，在汉语中用“说什么”既保留言语含义，也避免生硬重复“话……说”。
- source_word: אֹתוֹ תַעֲשֶׂה
  choice: 你就只能做什么
  rationale: 与前面的“什么”照应，并借“只能”体现אַךְ的限制力及宾语前置所带出的强调。
theological_decisions:
- issue: 本节对神的称谓
  choice: 神
  alternative: 耶和华
  rationale: 希伯来文本本节使用אֱלֹהִים，不使用יהוה；译文不按邻近经文加以协调。
- issue: 神准许巴兰同行所附的限制
  choice: 不过，我对你说什么，你就只能做什么
  alternative: 但你只要照我对你所说的话去做
  rationale: 所选译法保留原文强烈的限制语气，同时不进一步解释神准许同行与后续发怒之间的神学张力。
translation_notes:
  register: 采用现代、庄重而口语可懂的普通话。“来到巴兰那里”贴近原文空间表达；末句以汉语对应结构“说什么……做什么”传达原文的限制和强调。
