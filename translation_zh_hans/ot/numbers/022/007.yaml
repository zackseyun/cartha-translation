base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/007.yaml
  text: So the elders of Moab and the elders of Midian went[a], with divination fees in their hands, and they came to Balaam and spoke to him the words of Balak.
translation:
  language: zh_hans
  text: 于是，摩押的长老和米甸的长老动身了，手里带着占卜的酬金[a]。他们来到巴兰那里，把巴勒的话告诉了他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“手里带着占卜之物（或兆象）”；原文可指占卜所用之物或占卜所得的兆象，但按本段语境，更可能指为请人占卜而带来的酬金。
    reason: lexical_alternative
lexical_decisions:
- source_word: זִקְנֵי
  choice: 长老
  rationale: 该词与族名构成属格结构时，通常指群体中公认的年长领袖或治理者；“长老”既保留其社会政治身份，也符合中文圣经语体。
- source_word: וּקְסָמִים בְּיָדָם
  choice: 手里带着占卜的酬金
  rationale: קְסָמִים 本可指占卜之事、占卜用品或兆象，但在此叙事语境中更可能借指请巴兰施行占卜所带的酬金；正文采用较符合语境的理解，并以脚注保留原文歧义。
- source_word: וַיָּבֹאוּ אֶל
  choice: 来到……那里
  rationale: בוא אֶל 表示来到或抵达某人所在之处；承接前面的“动身了”，译作“来到……那里”自然呈现行动次序。
- source_word: וַיְדַבְּרוּ אֵלָיו
  choice: 转告了他
  rationale: דבר אֶל 的基本意思是“对他说话”；结合宾语“巴勒的话”，中文用“把……转告了他”更自然，同时清楚表达使者传达所受托话语的动作。
- source_word: דִּבְרֵי בָלָק
  choice: 巴勒的话
  rationale: 保留构造短语“巴勒的话”的形式，不将其限定为一般性的“口信”，从而保留它可能指具体言辞或受托信息的开放性。
- source_word: וַיֵּלְכוּ
  choice: 于是……动身了
  rationale: 连续式叙事动词推进前文所引发的行动；“于是”体现承接关系，“动身了”也避免与随后“来到”重复。
