base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/041.yaml
  text: And in the morning Balak took Balaam and brought him up to Bamoth-baal[b][a], and from there he saw the edge of the people.
translation:
  language: zh_hans
  text: 到了早晨，巴勒带巴兰上到巴末·巴力[a]；巴兰从那里看见了以色列民的边缘[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “巴末·巴力”也可按描述性短语译为“巴力的高地”。
    reason: lexical_alternative
  - marker: b
    text: 意思是从那里只能看见以色列民最外围的一部分。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַבֹּקֶר
  choice: 第二天早晨
  rationale: 该叙事结构推进事件并交代时间；结合上文夜间的情节，译作“第二天早晨”自然清楚。
- source_word: וַיִּקַּח
  choice: 带着
  rationale: לקח在此指巴勒带巴兰同行；“带着”比孤立的“带走”更符合现代汉语语境。
- source_word: וַיַּעֲלֵהוּ
  choice: 带着……上到
  rationale: עלה的使役式表示使人上去；与וַיִּקַּח合译为“带着……上到”，既表达登高，也避免汉语重复。
- source_word: בָּמוֹת בָּעַל
  choice: 巴力的高地
  rationale: 该词组既可理解为地名“巴末·巴力”，也可按描述性短语理解为“巴力的高地”；正文采用自然且保留词义的译法，并以脚注注明地名读法。
- source_word: וַיַּרְא
  choice: 他看见了
  rationale: ראה是普通的“看见”；希伯来文未明说主语所指，中文保留代词“他”，不在正文中替原文消除指代上的轻微含混。
- source_word: מִשָּׁם
  choice: 从那里
  rationale: 直接表达观看所处的地点。
- source_word: קְצֵה הָעָם
  choice: 以色列民的一角
  rationale: קצה指边缘、末端或局部；“一角”自然表达只能望见民众外围的一部分。上下文明确所指为以色列民，补出“以色列”有助于普通读者理解。
theological_decisions:
- issue: וַיַּרְא的主语指向
  choice: 正文译作“他”，保留原文代词所容许的轻微含混
  alternative: 明确译作“巴兰”
  rationale: 叙事目的和后续语境通常使人理解为巴兰观看以色列，但希伯来文动词只编码第三人称阳性单数，未直接点名；不宜在正文中无提示地完全消除这种形式上的含混。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“第二天早晨”顺应汉语叙事习惯；“巴力的高地”保留原词组的可理解意义，同时用脚注呈现专名分析。所有脚注标记均已置于正文对应处。
