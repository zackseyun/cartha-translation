  text: וַ/יֹּ֨אמֶר בִּלְעָ֜ם אֶל בָּלָ֗ק הִֽנֵּה בָ֨אתִי֙ אֵלֶ֔י/ךָ עַתָּ֕ה הֲ/יָכ֥וֹל אוּכַ֖ל דַּבֵּ֣ר מְא֑וּמָה הַ/דָּבָ֗ר אֲשֶׁ֨ר יָשִׂ֧ים אֱלֹהִ֛ים בְּ/פִ֖/י אֹת֥/וֹ אֲדַבֵּֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/038.yaml
  text: And Balaam said to Balak[a], “Look, I have come to you now. Am I really able to speak anything at all? I will speak only the word that God puts in my mouth.”
translation:
  language: zh_hans
  text: 巴兰对巴勒说：“看哪，我现在已经到你这里来了。我果真能说什么吗？上帝把话放在我口中，我就说那话。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  choice: 看
  rationale: 保留指示和强调语气，同时符合现代汉语表达。
- source_word: בָאתִי אֵלֶיךָ עַתָּה
  choice: 我现在已经到你这里来了
  rationale: 自然表达完成动作及 עַתָּה 所强调的当下时点。
- source_word: הֲיָכוֹל אוּכַל
  choice: 我真能……吗
  rationale: 以“真能”体现不定式绝对形与限定动词同用所形成的强调和反问语气。
- source_word: דַּבֵּר מְאוּמָה
  choice: 随意说什么
  rationale: מְאוּמָה 表示“任何东西”；结合上下文译为“随意说什么”，凸显巴兰不能自行决定所说的话。
- source_word: הַדָּבָר
  choice: 什么话
  rationale: 在受神指示发言的语境中，דָּבָר 指将要说出的言语；汉语用“话”自然且保留具体言语的含义。
- source_word: יָשִׂים אֱלֹהִים בְּפִי
  choice: 上帝把什么话放在我口中
  rationale: 保留希伯来文“放在口中”的形象，表达言语由上帝赐下。
- source_word: אֹתוֹ אֲדַבֵּר
  choice: 我就说什么
  rationale: 借助“什么……就……”结构表现前置宾语的限定作用：上帝所放的话正是巴兰要说的话。
- source_word: אֱלֹהִים
  choice: 上帝
  rationale: 尽管该词形态为复数，此处搭配单数动词，且上下文指向以色列的上帝，因此译为单数“上帝”。
theological_decisions:
- issue: 上帝对巴兰言语的约束
  choice: 巴兰不能随意发言，只能说上帝放在他口中的话。
  alternative: 巴兰有能力任意发言，只是自愿选择只说上帝的话。
  rationale: 强调式 הֲיָכוֹל אוּכַל 和结尾 אֹתוֹ אֲדַבֵּר 共同呈现言语受到约束，而不仅是个人偏好；译文保留这种神学张力，不进一步说明默示的机制。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“看”传达 הִנֵּה 的强调；“我真能随意说什么吗”保留反问及能力受限之意；末句保留“放在我口中”的希伯来语形象。
