base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/003.yaml
  text: And Moab was very afraid because of the people[a], because they were numerous[b]; and Moab was filled with dread because of the sons of Israel.
translation:
  language: zh_hans
  text: 摩押因这民人数众多而十分惧怕；摩押又因以色列人而烦扰不安。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “烦扰不安”也可译作“厌恶”“厌烦”或“因……而苦恼”。原文动词可表达厌恶、烦扰或不堪其扰；在此上下文中，摩押对以色列人的反应带有强烈的困扰和排斥意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּגָר
  choice: 非常惧怕
  rationale: גור在此语境表示惧怕、畏惧；与מְאֹד合译为“非常惧怕”，自然地保留强烈程度。
- source_word: מִפְּנֵי
  choice: 因
  rationale: 该介词短语字面与“面前”有关，但此处表达造成惧怕和不安的原因，译作“因”最符合现代汉语。
- source_word: הָעָם
  choice: 这民
  rationale: 单数集合名词指前文所说的以色列民；“这民”既保留指示语境，也保持集体称谓。
- source_word: כִּי רַב הוּא
  choice: 因这民极其众多
  rationale: רַב在这里指人数众多；希伯来语以单数代词回指集合名词，汉语无需机械呈现其语法数。
- source_word: וַיָּקָץ
  choice: 惊惧不安
  rationale: קוץ可表示厌恶、烦扰，或带有强烈排斥感的恐惧不安；结合上下文，译文保留恐惧及不堪承受的情绪，而不将其单限定为“厌恶”。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 字面是“以色列的众子”，在民族称谓中，现代汉语以“以色列人”最自然，也涵盖整个群体。
- source_word: מוֹאָב
  choice: 摩押
  rationale: 采用中文圣经传统中通行的专名译法；此处按集体主体理解。
