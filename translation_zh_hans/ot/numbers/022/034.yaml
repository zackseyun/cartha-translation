  text: וַ/יֹּ֨אמֶר בִּלְעָ֜ם אֶל מַלְאַ֤ךְ יְהוָה֙ חָטָ֔אתִי כִּ֚י לֹ֣א יָדַ֔עְתִּי כִּ֥י אַתָּ֛ה נִצָּ֥ב לִ/קְרָאתִ֖/י בַּ/דָּ֑רֶךְ וְ/עַתָּ֛ה אִם רַ֥ע בְּ/עֵינֶ֖י/ךָ אָשׁ֥וּבָה לִּֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/034.yaml
  text: Then Balaam said to the angel of Yahweh[a], “I have sinned, for I did not know that you were standing to confront me on the road. And now, if it is evil in your eyes[b], I will turn back.”
translation:
  language: zh_hans
  text: 巴兰对耶和华的使者[a]说：“我犯了罪，因为我不知道你站在路上拦阻我。现在，如果你看这事为恶[b]，我就回去。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“耶和华的天使”。
    reason: lexical_alternative
  - marker: b
    text: 直译“如果（这）在你眼中为恶”。
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְאַךְ יְהוָה
  choice: 耶和华的使者
  rationale: מַלְאַךְ既可指一般“使者”，也可指天上的使者；本段语境表明其为超自然存在。中文“使者”保留原词的语义宽度，脚注注明可译“天使”。
- source_word: חָטָאתִי
  choice: 我犯了罪
  rationale: 完成式在此表达巴兰承认自己已经犯罪；“我犯了罪”是自然、庄重的中文认罪表述。
- source_word: כִּי לֹא יָדַעְתִּי
  choice: 因为我不知道
  rationale: כִּי引出巴兰所陈述的缘由，直译为“因为”清楚自然。
- source_word: נִצָּב לִקְרָאתִי
  choice: 站在路上拦阻我
  rationale: נִצָּב表示站立或站定，לִקְרָאתִי本可指迎面而来；结合使者拔刀挡路的上下文，“拦阻我”传达此处明显的对抗意味。
- source_word: בַּדָּרֶךְ
  choice: 在路上
  rationale: 按其处所意义直接译出，符合本段行路场景。
- source_word: אִם רַע בְּעֵינֶיךָ
  choice: 如果你看这事为恶
  rationale: 保留希伯来语“在你眼中为恶”的判断性和道德分量，同时采用自然的现代中文句式；“这事”指巴兰继续前行一事，是中文所需的隐含主语补足。
- source_word: אָשׁוּבָה לִּי
  choice: 我就回去
  rationale: 鼓励式在这里表示巴兰愿意或决定返回；中文条件句中的“我就回去”简洁自然。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 采用现代中文圣经读者最熟悉的专名“耶和华”，将四字神名作为专名而非“主”这一称号来表达；“雅威”是较接近学界拟音的另一译法。
- issue: מַלְאַךְ 的身份称谓
  choice: 使者
  alternative: 天使
  rationale: 原词本身兼有“使者”和“天使”的意义。正文用“使者”保留词义空间，不把词汇层面的含义缩窄；上下文仍清楚显示这是一位超自然使者。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“拦阻我”依据拔刀挡路的叙事语境表达 לִקְרָאתִי 的对抗意味；条件句保留“恶”的道德力度，不弱化为单纯的“不喜欢”或“不悦”。
