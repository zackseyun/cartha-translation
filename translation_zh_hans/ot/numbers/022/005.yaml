  text: וַ/יִּשְׁלַ֨ח מַלְאָכִ֜ים אֶל בִּלְעָ֣ם בֶּן בְּע֗וֹר פְּ֠תוֹרָ/ה אֲשֶׁ֧ר עַל הַ/נָּהָ֛ר אֶ֥רֶץ בְּנֵי עַמּ֖/וֹ לִ/קְרֹא ל֑/וֹ לֵ/אמֹ֗ר הִ֠נֵּה עַ֣ם יָצָ֤א מִ/מִּצְרַ֨יִם֙ הִנֵּ֤ה כִסָּה֙ אֶת עֵ֣ין הָ/אָ֔רֶץ וְ/ה֥וּא יֹשֵׁ֖ב מִ/מֻּלִֽ/י־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/005.yaml
  text: So he sent messengers to Balaam son of Beor at Pethor[a], which is by the River, in the land of the sons of his people, to call him, saying, “Look, a people has come out of Egypt. Look, it has covered the face of the land[c][b], and it is dwelling opposite me.”
translation:
  language: zh_hans
  text: 他派使者到比珥的儿子巴兰那里去；巴兰住在毗夺，毗夺在那河[a]旁、在他本族子民之地[b]。他要召巴兰来，对他说：“看哪，有一群人从埃及出来了；看哪，他们遮满了地面[c]，如今住在我的对面。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文作“那河”，很可能指幼发拉底河。
    reason: cross_reference
  - marker: b
    text: 原文作“他子民的儿子们之地”。这个短语较难理解；也可理解为“他本族之地”。“他”所指为何有不同看法。
    reason: alternative_reading
  - marker: c
    text: 原文直译为“遮住了地的眼”；这里指遮满地的表面。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח מַלְאָכִים
  choice: 于是，他派使者
  rationale: 叙事性连接形式推动情节发展，译作“于是”自然体现承接关系；此处 מַלְאָכִים 指人间受差遣传话的人，因此译作“使者”，不译作“天使”。
- source_word: פְּתוֹרָה
  choice: 到……毗夺
  rationale: 地名带有表示趋向的词尾，译作“到……毗夺”保留前往该地的动态含义。
- source_word: אֲשֶׁר עַל־הַנָּהָר
  choice: 大河边
  rationale: 原文直称“那河／大河”，很可能指幼发拉底河；正文保留原文未明说河名的表达，并以脚注说明。
- source_word: אֶרֶץ בְּנֵי עַמּוֹ
  choice: 他族人的土地
  rationale: 该短语结构生硬，且“他”所指可能有不同理解。正文采用可懂的现代汉语，同时保留所属代词及族群含义；直译结构另见脚注。
- source_word: לִקְרֹא לוֹ
  choice: 召……巴兰
  rationale: 该不定式表示差遣使者的目的；“召”既保留叫他前来的意思，也符合外交使团的语境。
- source_word: הִנֵּה
  choice: 看哪
  rationale: 原文连续两次使用引人注意的语气词。保留为“看哪”，体现强调和紧迫感，且具有庄重而易懂的经文语体。
- source_word: עַם
  choice: 一族人
  rationale: עַם 表示作为整体的民族或族群。“一族人”比“一国”更贴近原词，也能维持后文集体单数的表达。
- source_word: כִסָּה אֶת־עֵין הָאָרֶץ
  choice: 遮满了地面
  rationale: 原文直译为“遮住了地的眼”，在此是指可见的地表。“遮满了地面”用自然汉语传达其夸张图像，同时由脚注保留字面措辞。
- source_word: וְהוּא יֹשֵׁב מִמֻּלִי
  choice: 现在就住在我的对面
  rationale: 原文以集体单数指前述族群，并使用一般性的“居住、停留”动词；未在正文加入“安营”或“驻扎”，以免增加原文未明确表达的军事色彩。
