revisions:
- from: 于是，他派使者到大河[a]边的毗夺去召比珥的儿子巴兰；毗夺位于他族人的土地[b]。使者说：“看哪，有一族人从埃及出来了！看哪，他们遮满了地面[c]，现在就住在我的对面。”
  to: 他派使者到比珥的儿子巴兰那里去；巴兰住在毗夺，毗夺在那河[a]旁、在他本族子民之地[b]。他要召巴兰来，对他说：“看哪，有一群人从埃及出来了；看哪，他们遮满了地面[c]，如今住在我的对面。”
  rationale: 修正引语的说话者为巴勒，并重组地点与目的结构，使“巴兰在毗夺”及“毗夺在那河旁、在相关地域”清晰对应原文。对难解的地域短语采用较贴近原文而仍可读的正文，并以脚注保留其构造和代词指向的歧义。其余措辞维持现代、庄重的普通话语体，不增添军事或解释性内容。
