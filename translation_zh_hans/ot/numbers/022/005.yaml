    reason: cross_reference
  - marker: b
    text: 原文作“他子民的儿子们之地”。这个短语较难理解；也可理解为“他本族之地”。“他”所指为何有不同看法。
    reason: alternative_reading
  - marker: c
    text: 原文直译为“遮住了地的眼”；这里指遮满地的表面。
    reason: lexical_alternative
