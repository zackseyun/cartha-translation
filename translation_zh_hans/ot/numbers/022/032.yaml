base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/032.yaml
  text: And the angel of Yahweh said to him[a], “Why have you struck your donkey these three times? Look, I have come out as an adversary[b], because your way is perverse before me.”
translation:
  language: zh_hans
  text: 耶和华的使者对他说：“你为什么三次打你的母驴？看哪，我出来要作你的对头[a]，因为你所走的路在我面前不正[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文此处所用的名词可译作“对头”“敌对者”或“反对者”；这里并非专名“撒但”。
    reason: lexical_alternative
  - marker: b
    text: 译作“不正”的希伯来语动词十分罕见，含义不确定；也可能表示“鲁莽”“冒进”或“与我相悖”。
    reason: alternative_reading
lexical_decisions:
- source_word: מַלְאַךְ יְהוָה
  choice: 耶和华的使者
  rationale: מַלְאַךְ 在本叙事中指超自然的使者；“使者”既自然，也保留该词“使者／天使”的语义范围。神名 יְהוָה 音译为“耶和华”。
- source_word: עַל מָה הִכִּיתָ
  choice: 你为什么……打
  rationale: עַל מָה 是询问原因的惯用语；נכה 的基本义为“击打”，此处译“打”简明自然，不额外强化为“毒打”。
- source_word: אֲתֹנְךָ
  choice: 你的母驴
  rationale: אָתוֹן 特指母驴；中文明确译出性别自然，并忠实于原文。
- source_word: זֶה שָׁלֹשׁ רְגָלִים
  choice: 这样三次
  rationale: רְגָלִים 在此为“次数”的习语；“这样三次”同时承接先前三次击打。
- source_word: הִנֵּה אָנֹכִי יָצָאתִי
  choice: 看哪，我出来
  rationale: הִנֵּה 用“看哪”保留提醒注意的庄重语气；יצא 依现场相遇的视角译为“出来”。
- source_word: לְשָׂטָן
  choice: 阻挡你
  rationale: שָׂטָן 在此是普通名词，意为敌对者、阻挡者；结合目的性介词 לְ，动词化译作“阻挡你”符合现代汉语，又不误作专名“撒但”。
- source_word: יָרַט הַדֶּרֶךְ
  choice: 你所走的路……是险恶的
  rationale: יָרַט 是罕见且词义有争议的动词；“险恶”可涵盖道路或行径不正、危险而冒进的语意，同时避免过度确定其确切词义。
- source_word: לְנֶגְדִּי
  choice: 在我面前
  rationale: 保留该短语兼具空间关系和评价意味的表达，不径直加强为“与我作对”。
theological_decisions:
- issue: לְשָׂטָן 是否指专名“撒但”
  choice: 译为“阻挡你”，按普通名词理解
  alternative: 译为“作你的对头”或误解为专名“撒但”
  rationale: 上下文是耶和华的使者出来阻挡巴兰，该词在这里描述其敌对、拦阻的作用，并不指魔鬼的专名。
- issue: 罕见动词 יָרַט 的含义
  choice: 正文译“险恶”，脚注保留“不正／冒进／与我相悖”等可能
  alternative: 正文确定译为“悖逆”“乖僻”或“鲁莽”
  rationale: 该词只见于此处，词义不确定；正文需可读，但不应把某一种解释包装成毫无疑问的定论。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“看哪”保留圣经叙事中 הִנֵּה 的提示作用；其余措辞避免文言化。所有脚注标记均置于相关正文之后。
