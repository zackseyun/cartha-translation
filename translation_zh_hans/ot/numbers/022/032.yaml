  to: 耶和华的使者对他说：“你为什么三次打你的母驴？看哪，我出来要作你的对头[a]，因为你所走的路在我面前不正[b]。”
  rationale: 修订避免以“险恶”将受争议的 יָרַט 具体化为道路危险，改用可涵盖道德或行为评价的“不正”，并在脚注中保留其他合理理解。将“阻挡你”改为“作你的对头”，更直接呈现 לְשָׂטָן 的名词性和普通名词意义；同时调整“三次”的语序，使中文自然。
