  text: וַ/תֵּ֣רֶא הָ/אָתוֹן֩ אֶת מַלְאַ֨ךְ יְהוָ֜ה נִצָּ֣ב בַּ/דֶּ֗רֶךְ וְ/חַרְבּ֤/וֹ שְׁלוּפָה֙ בְּ/יָד֔/וֹ וַ/תֵּ֤ט הָֽ/אָתוֹן֙ מִן הַ/דֶּ֔רֶךְ וַ/תֵּ֖לֶךְ בַּ/שָּׂדֶ֑ה וַ/יַּ֤ךְ בִּלְעָם֙ אֶת הָ֣/אָת֔וֹן לְ/הַטֹּתָ֖/הּ הַ/דָּֽרֶךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/023.yaml
  text: When the donkey saw the angel of Yahweh standing in the road with his sword drawn in his hand[a], the donkey turned aside from the road and went into the field. So Balaam struck the donkey to turn her back to the road.
translation:
  language: zh_hans
  text: 母驴看见耶和华的使者[a]站在路中，手持出鞘的刀，就离开道路，走进田野。巴兰便打母驴，要使它转回路上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“天使”。
    reason: מַלְאָךְ 可指受差遣的使者，也可指天使；本段上下文可支持后一译法。
lexical_decisions:
- source_word: הָאָתוֹן
  choice: 驴
  rationale: אָתוֹן特指母驴，但现代汉语叙事中用“驴”最自然；本节无需用性别代词来维持语义。
- source_word: מַלְאַךְ יְהוָה
  choice: 耶和华的使者
  rationale: מַלְאָךְ可指“使者”或“天使”。此处所指为超自然存在，但“使者”既保留词义幅度，也符合庄重的现代汉语表达。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的专名“耶和华”呈现四字神名，而不以称号替代。
- source_word: נִצָּב בַּדֶּרֶךְ
  choice: 站在路中
  rationale: 分词表示使者正站立；“路中”传达其拦阻道路的位置。
- source_word: וְחַרְבּוֹ שְׁלוּפָה בְיָדוֹ
  choice: 手里拔出了刀
  rationale: שְׁלוּפָה表示刀已从鞘中拔出；译文保留刀在手中的鲜明图景。
- source_word: וַתֵּט הָאָתוֹן מִן הַדֶּרֶךְ
  choice: 就转离道路
  rationale: נטה在此表示偏离原来的路线；“转离”准确、简洁。
- source_word: וַתֵּלֶךְ בַּשָּׂדֶה
  choice: 走进田野
  rationale: שָׂדֶה可指田地或旷野；在道路旁的场景中，“田野”自然且不过度限定。
- source_word: וַיַּךְ
  choice: 打
  rationale: נכה在此表示击打；现代汉语“打”比“击打”更自然，也不擅自加入反复动作。
- source_word: לְהַטֹּתָהּ הַדָּרֶךְ
  choice: 要把它赶回路上
  rationale: 使役不定式表示要使母驴转向道路；结合它刚离开道路的语境，“赶回路上”自然呈现目的。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。中文采用广为人知的专名“耶和华”，保留其专名性质，不以“主”替代。
- issue: מַלְאַךְ的译法
  choice: 使者
  alternative: 天使
  rationale: “使者”保留该词本身可指受差遣者的意义；上下文中的超自然身份由叙事显明，无须在正文中提前消除词义张力。
translation_notes:
  register: 采用自然、庄重而清楚的现代标准普通话。“路中”保留使者拦路的空间感；“赶回路上”按上下文表达巴兰击打母驴的目的。
