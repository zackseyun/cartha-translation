revisions:
- from: 驴看见耶和华的使者站在路中，手里拔出了刀[a]，就转离道路，走进田野。巴兰便打驴，要把它赶回路上。
  to: 母驴看见耶和华的使者[a]站在路中，手持出鞘的刀，就离开道路，走进田野。巴兰便打母驴，要使它转回路上。
  rationale: 修订将“拔出了刀”改为“手持出鞘的刀”，保留原文对刀已出鞘且在使者手中的状态描写；将“赶回”收敛为“使它转回”，避免增加原文未明说的驱赶方式。脚注改为与“使者”锚点直接对应的词汇替代。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T04:56:39Z'
review_pass:
  verdict: revise
  source_fidelity: 正文对事件顺序、使者拦路、母驴离开道路进入田野，以及巴兰击打母驴的目的均基本忠实。惟“手里拔出了刀”将原文描述刀已出鞘、正持在手中的状态，误表为使者当时执行“拔刀”动作；“赶回路上”比使役动词“使其转向道路”稍强，带有驱赶意味。
  naturalness: 原文整体流畅、庄重。改为“手持出鞘的刀”更符合现代汉语，也准确表达原文名词性状态分句；“要使它转回路上”自然且不额外强化动作方式。
  terminology: “耶和华”恰当保留神名；“使者”可保留 מַלְאָךְ 的词义幅度。脚注应仅在“使者”处提供“天使”的词汇替代，而不把整个已调整的描述句作为替代译文。母驴的阴性可在中文中明确呈现，既忠实又不显生硬。
  issues:
  - severity: medium
    issue: “手里拔出了刀”把完成的持刀状态译成了拔刀动作。
    rationale: וְחַרְבּוֹ שְׁלוּפָה בְּיָדוֹ 意为“他的刀已出鞘、在他手中”，并未叙述此刻拔刀。
  - severity: low
    issue: “赶回路上”略强化了使役方式。
    rationale: לְהַטֹּתָהּ 表示使母驴转向道路；巴兰确实击打她，但原词本身不要求译为“赶”。
  - severity: low
    issue: 脚注内容与锚点及其声明的词汇替代不够对应。
    rationale: 脚注理由是说明 מַלְאָךְ 可译“天使”，但脚注实际给出整句改写；应简明标示“使者”的可选译法。
  revised_text: 母驴看见耶和华的使者[a]站在路中，手持出鞘的刀，就离开道路，走进田野。巴兰便打母驴，要使它转回路上。
  revised_footnotes:
  - marker: a
    text: 或译：“天使”。
    reason: מַלְאָךְ 可指受差遣的使者，也可指天使；本段上下文可支持后一译法。
  revision_rationale: 修订将“拔出了刀”改为“手持出鞘的刀”，保留原文对刀已出鞘且在使者手中的状态描写；将“赶回”收敛为“使它转回”，避免增加原文未明说的驱赶方式。脚注改为与“使者”锚点直接对应的词汇替代。
