  yaml_path: translation/ot/numbers/022/017.yaml
  text: For I will greatly honor you[a], and I will do whatever you say to me. So please come, curse this people for me.
translation:
  language: zh_hans
  text: 因为我必使你得极大的尊荣[a]；你对我说的一切，我都必照办。现在请来，为我咒诅这民吧！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我必大大尊荣你”，也可按语境理解为“我必重重酬谢你”。希伯来文以同词根的不定式绝对形和限定动词连用，表示强调。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，说明巴勒再次邀请并恳求巴兰的理由；现代汉语中“因为”清楚自然。
- source_word: כַבֵּד אֲכַבֶּדְךָ מְאֹד
  choice: 我必使你大得尊荣
  rationale: 保留כבד的“尊荣”语义，并以“必……大得”表达不定式绝对形与限定动词连用所形成的强烈强调；不把语义仅限缩为物质酬报。
- source_word: וְכֹל אֲשֶׁר תֹּאמַר אֵלַי אֶעֱשֶׂה
  choice: 你对我说的一切，我都必照办
  rationale: 体现כֹל אֲשֶׁר的全面范围，同时用自然现代汉语表达巴勒无条件应允之意。
- source_word: וּלְכָה נָּא
  choice: 现在请来
  rationale: “来”表达移动命令，נָּא以“请”传达恳求语气；“现在”使重复邀请中的催促感自然呈现。
- source_word: קָבָה
  choice: 咒诅
  rationale: 在巴兰叙事语境中指施加或宣告诅咒；“咒诅”准确且符合庄重经文语体。
- source_word: לִּי
  choice: 为我
  rationale: 保留巴勒要求巴兰代表自己行动、为自己谋利的含义。
- source_word: אֵת הָעָם הַזֶּה
  choice: 这民
  rationale: 保留עָם作为单数集合名词的表达；“这民”简洁庄重，并区别于泛指若干个人的“这些人”。
