base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/028.yaml
  text: Then Yahweh opened the mouth of the donkey[a], and she said to Balaam, “What have I done to you[b], that you have struck me these three times?”
translation:
  language: zh_hans
  text: 于是，雅威开了母驴的口[a]。母驴对巴兰说：“我对你做了什么，你竟这三次打我[b]？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“雅威打开母驴的口”。这里“驴”所用的希伯来语名词为阴性，指母驴。
    reason: 说明原文措辞及名词的性别信息。
  - marker: b
    text: 原文直译为“这三脚”；“脚”在这里构成表示次数或场合的习语，意为“这三次”或“这三个场合”。
    reason: 说明希伯来语习语，并保留其字面措辞与实际含义。
lexical_decisions:
- source_word: וַיִּפְתַּח יְהוָה אֶת פִּי הָאָתוֹן
  choice: 雅威使母驴开口
  rationale: 原文直译为“雅威打开母驴的口”。现代汉语以“使母驴开口”自然表达雅威直接使母驴获得说话能力，同时保留神主动施行此事的含义。אָתוֹן特指母驴。
- source_word: יְהוָה
  choice: 雅威
  rationale: 采用对四字神名的现代汉语音译，不以“主”这一称号代替原文中的专名。
- source_word: וַתֹּאמֶר לְבִלְעָם
  choice: 母驴对巴兰说
  rationale: 希伯来语动词为阴性单数，与母驴相呼应；汉语明说“母驴”可清楚标示说话者。בִלְעָם按通行汉译作“巴兰”。
- source_word: מֶה עָשִׂיתִי לְךָ
  choice: 我对你做了什么
  rationale: 这是自然的现代汉语问法，准确传达母驴质问巴兰自己究竟做了什么。
- source_word: כִּי הִכִּיתַנִי
  choice: 你竟这样打我
  rationale: כִּי在此引出质问所针对的行为；“竟”自然表达责问语气。“打”准确传达נכה的击打之意，而不强化为更重的“毒打”。
- source_word: זֶה שָׁלֹשׁ רְגָלִים
  choice: 三次
  rationale: רְגָלִים字面为“脚”，但此处是表示次数或场合的习语；“三次”是清楚自然的汉语表达。上下文中的“这样”也传达了原文指示成分זֶה的语用作用。
theological_decisions:
- issue: 如何翻译神名יְהוָה
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文使用神的专名，而不是“主”这一称号，因此正文保留专名。“雅威”较直接反映学界通常重构的读音；不把它改成称号，也不声称古代读音毫无不确定性。
- issue: 雅威使母驴说话的表达
  choice: 使母驴开口
  alternative: 打开母驴的口
  rationale: 保留神直接行动这一叙事重点，但用自然汉语表达；不额外解释这一事件的机制或神学意义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“于是”承接前文连续动作；对话以自然口语呈现，但避免俚俗。正文保留“雅威”这一神名，并以“母驴”明确原文动物的性别。
