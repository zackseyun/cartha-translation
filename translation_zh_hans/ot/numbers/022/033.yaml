base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/033.yaml
  text: The donkey saw me and turned aside before me these three times. If she had not turned aside from before me[a], surely by now I would have killed you and let her live.
translation:
  language: zh_hans
  text: 母驴看见我，这三次都在我面前转开了。要不是它从我面前转开[a]，我早就把你杀了，却让它活着。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“或许它从我面前转开了”；这句话通常按反事实理解为“要不是它从我面前转开”，与上下文和后面的结果相符。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּרְאַנִי
  choice: 看见我
  rationale: ראה在此指直接的视觉感知；“看见我”自然、准确。
- source_word: הָאָתוֹן
  choice: 驴
  rationale: אָתוֹן特指母驴，但现代汉语通常用“驴”即可；后文“它”不标性别，性别信息在本节并非重点。
- source_word: וַתֵּט לְפָנַי
  choice: 从我面前转开了
  rationale: נטה表示偏转、转开；结合天使拦路的空间关系，译作“从我面前转开”清楚自然，并与后句מִפָּנַי呼应。
- source_word: זֶה שָׁלֹשׁ רְגָלִים
  choice: 这三次都
  rationale: רְגָלִים在此是“次数、回”的习语；加入“都”符合汉语表达，并突出三次重复发生。
- source_word: אוּלַי נָטְתָה מִפָּנַי
  choice: 要不是它从我面前转开
  rationale: אוּלַי通常可作“或许”，但此处上下文要求反事实条件。希伯来文本未明写否定词，汉语需补出“不是”才能表达叙事逻辑；以脚注说明。
- source_word: כִּי עַתָּה
  choice: 早就
  rationale: 在反事实结果句中表达“到如今已经”的强调和时间意味；“早就”是自然的现代汉语。
- source_word: גַּם אֹתְכָה הָרַגְתִּי
  choice: 我早就把你杀了
  rationale: 完成式在反事实结果中用汉语“早就……了”表达；גַּם的强调由“你”与“它”的对比及句式体现。
- source_word: וְאֹתָהּ הֶחֱיֵיתִי
  choice: 却会让它活着
  rationale: חיה的使役式意为“使存活、让活着”；“却”清楚呈现巴兰被杀与驴存活之间的对比。
theological_decisions:
- issue: אוּלַי后面的分句没有明写否定词，却在语境中构成反事实条件
  choice: 正文译为“要不是它从我面前转开”
  alternative: 按字面译为“或许它从我面前转开了”
  rationale: 叙事逻辑表明，驴转开使巴兰免于被杀；若不补出反事实否定，后面的结果句便与上下文相反。正文传达语境所要求的意思，同时用脚注保留原文形式上的张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“要不是……早就……”自然表达反事实关系；“却会让它活着”保留杀死巴兰与让驴存活的鲜明对照。
