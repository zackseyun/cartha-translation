base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/037.yaml
  text: And Balak said to Balaam[c][b][a], “Did I not indeed send to you to call you? Why did you not come to me? Am I really not able to honor you?”
translation:
  language: zh_hans
  text: 巴勒对巴兰说：“我不是特意派人去召你来吗？你为什么不到我这里来？难道我真的不能使你尊贵吗？”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “使你尊贵”也可译作“厚待你”或“重重赏赐你”；原文可包括赐予财物、名位或尊荣，并不只是表示尊敬。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: 希伯来叙事常用连续式动词推进情节；中文以“说”自然承接上文，无须机械补出“于是”或“并且”。
- source_word: הֲלֹא
  choice: 我不是……吗
  rationale: 带否定的反问句期待肯定回答；“我不是……吗”准确传达巴勒责问的语气。
- source_word: שָׁלֹחַ שָׁלַחְתִּי
  choice: 特意派人
  rationale: 不定式绝对形与限定动词连用，强化“派遣”；“特意”在现代汉语中自然表达强调，同时不把形式限定为“多次”或“紧急”。
- source_word: לִקְרֹא לָךְ
  choice: 召你来
  rationale: קרא 在此指派人召唤；“召你来”比直译“叫你”更符合君王差使使者传召的语境，也自然体现朝说话者所在之处而来。
- source_word: לָמָּה לֹא הָלַכְתָּ אֵלָי
  choice: 你为什么不到我这里来
  rationale: הלך 字面为“去”，但 אֵלַי 是“到我这里”；从巴勒的说话视角，现代汉语自然说“来”。
- source_word: הַאֻמְנָם
  choice: 难道……真的
  rationale: 该词引出带惊讶或不满的强调问句；“难道……真的”保留其难以置信和责问语气。
- source_word: לֹא אוּכַל כַּבְּדֶךָ
  choice: 我不能使你尊贵吗
  rationale: יכל 表示能力，כבד 的皮勒形在此指使人得尊荣、提高其地位；“使你尊贵”保留社会地位及赏赐等较宽含义，不缩窄为单纯付酬。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。反问结构保留巴勒受冒犯般的责问语气；对强调结构采用“特意”，避免无充分依据地译成“多次”或“紧急”。脚注标记置于相关句末。
