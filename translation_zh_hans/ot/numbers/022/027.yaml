base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/027.yaml
  text: When the donkey saw the angel of Yahweh[a], she lay down under Balaam[b]. Then Balaam became angry and struck the donkey with his staff.
translation:
  language: zh_hans
  text: 母驴看见雅威的天使[a]，就卧倒在巴兰身下。巴兰发怒，用杖打了母驴。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “天使”也可译作“使者”。原词可指一般受差遣的人，也可指超自然的使者；这里的上下文表明是后者。
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאָתוֹן
  choice: 母驴
  rationale: אָתוֹן特指雌性的驴；现代汉语用“母驴”既准确又自然，无须借助代词体现其性别。
- source_word: מַלְאַךְ יְהוָה
  choice: 耶和华的天使
  rationale: מַלְאָךְ可指一般的“使者”，也可指超自然的“天使”；本段语境明确是超自然使者，因此正文译作“天使”，并以脚注保留词义上的另一可能。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的专名“耶和华”表达四字神名，保留其作为以色列之神名字的功能，而不以称号替代。
- source_word: וַתִּרְבַּץ
  choice: 就卧倒
  rationale: רבץ表示躺卧、伏卧；“卧倒”自然呈现驴在骑乘者身下躺下的动作，又不额外解释为跌倒或瘫倒。
- source_word: תַּחַת בִּלְעָם
  choice: 在巴兰身下
  rationale: תַּחַת直指“在……下面”；结合巴兰骑在驴上的场景，“在巴兰身下”准确而自然。
- source_word: וַיִּחַר אַף בִּלְעָם
  choice: 巴兰发怒
  rationale: 希伯来语是怒气“燃烧”的惯用表达；“发怒”简洁传达其起怒的动态含义。
- source_word: וַיַּךְ
  choice: 打了
  rationale: נכה在此表示击打；“打了”是现代汉语中直接自然的叙事表达，不把单次动词过度强化为持续殴打。
- source_word: בַּמַּקֵּל
  choice: 用杖
  rationale: מַקֵּל可指杖或棍；旅行语境中“杖”贴切。希伯来原文有定冠词但没有物主词，因此不额外补出“他的”。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 正文保留神名而非以“主”替代；“耶和华”是现代中文圣经传统中最广为人知、能被普通读者直接识别的形式。
- issue: מַלְאַךְ יְהוָה的身份称谓
  choice: 耶和华的天使
  alternative: 耶和华的使者
  rationale: 该词本身可泛指使者，但上下文显示这位使者属于超自然领域；译作“天使”符合语境，同时脚注保留原词的词义宽度，不进一步界定其本体身份。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。句式紧凑，保留希伯来叙事连续推进的节奏；使用“母驴”“卧倒”“发怒”“用杖打”等普通读者易懂的词语，不增添原文未明说的动机或动作强度。
