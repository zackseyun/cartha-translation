base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/036.yaml
  text: When Balak heard that Balaam had come[a], he went out to meet him at the city of Moab, which is on the border of the Arnon[b], at the edge of the border.
translation:
  language: zh_hans
  text: 巴勒听说巴兰已经来了，就出去，到摩押城[a]迎接他。这城在亚嫩河边界上，就是在边界的尽头[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“摩押的一座城”。希伯来语可指摩押境内一座特定而为人所知的城，也可泛指属于摩押的一座城。
    reason: lexical_alternative
  - marker: b
    text: 或译“位于疆域的尽头”。这里译作“边界”的希伯来词也可指“疆域、领土”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: 听说
  rationale: שׁמע的基本义是“听见、听到”；叙事中“听说”自然表达巴勒得知巴兰到来的消息，又不额外说明消息来源。
- source_word: כִּי בָא בִלְעָם
  choice: 巴兰来了
  rationale: 该从句说明巴勒所听见的内容；汉语“来了”自然呈现巴兰已经来到这一叙事先后关系，无须另加完成时标记。
- source_word: וַיֵּצֵא לִקְרָאתוֹ
  choice: 就前往……迎接他
  rationale: יצא表示出去，לקראת表示朝某人而去以便相会。合译为“前往……迎接他”符合现代汉语叙事，也保留主动出迎的动作。
- source_word: אֶל עִיר מוֹאָב
  choice: 摩押城
  rationale: עִיר מוֹאָב可理解为一座已知的“摩押城”，也可能泛指“摩押的一座城”。正文采用较可能的专指理解，另一种理解收入脚注。介词אֶל在移动语境中译为“前往”。
- source_word: אֲשֶׁר עַל גְּבוּל אַרְנֹן
  choice: 这城在亚嫩河的边界上
  rationale: עַל גְּבוּל表示位于边界上或边界附近；“亚嫩”在此指作为地理界标的亚嫩河，正文明确补出“河”以便普通读者理解。
- source_word: אֲשֶׁר בִּקְצֵה הַגְּבוּל
  choice: 位于边界的尽头
  rationale: קצה表示尽头、末端或边缘；גבול紧接前句再次出现，正文重复译为“边界”，保留希伯来文的重复。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“听说”“前往……迎接”符合自然汉语；地名使用通行译名“巴勒、巴兰、摩押、亚嫩河”。正文保留原文两次出现“边界”的重复，并以脚注呈现“城”和“边界／疆域”的真实词义歧义。
