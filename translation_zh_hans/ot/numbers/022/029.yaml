  yaml_path: translation/ot/numbers/022/029.yaml
  text: And Balaam said to the donkey[a], “Because you have made a mockery of me! If only there were a sword in my hand[c][b], I would kill you right now.”
translation:
  language: zh_hans
  text: 巴兰对母驴说：“因为你戏弄我！[a]要是我手里有一把剑，我现在就杀了你！”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “戏弄我”也可译作“羞辱我”或“恶意对待我”。原词可指以戏弄、羞辱或恶意的方式对待人。
    reason: lexical_alternative
  - marker: b
    text: 或译：“我现在早已把你杀了。”这里的希伯来语在与事实相反的愿望中，可表达巴兰会立刻杀死母驴；也可按完成式理解为若手中有剑，他早已杀了它。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר בִּלְעָם לָאָתוֹן
  choice: 巴兰对母驴说
  rationale: 按希伯来叙事句式自然译出；אָתוֹן明确指雌驴，因此译为“母驴”，既准确又符合现代汉语。
- source_word: כִּי הִתְעַלַּלְתְּ בִּי
  choice: 因为你竟敢这样戏弄我
  rationale: התעלל的此处词义涵盖戏弄、羞辱和恶意对待；“戏弄我”自然地表达巴兰认为自己被愚弄的愤怒，“竟敢这样”传达直接话语中的强烈责怪语气，但不把具体行为解释得过死。
- source_word: לוּ יֶשׁ חֶרֶב בְּיָדִי
  choice: 要是我手里有刀
  rationale: לוּ在这里引出与现实相反的愿望或假设；“要是”是现代汉语中自然的反事实表达，并保留“刀在手里”的原文意象。
- source_word: כִּי עַתָּה הֲרַגְתִּיךְ
  choice: 我现在就杀了你
  rationale: 在לוּ所引出的反事实结构中，这句话表达巴兰当场杀驴的意图；“现在就”传达כִּי עַתָּה的即时、强烈语气。
