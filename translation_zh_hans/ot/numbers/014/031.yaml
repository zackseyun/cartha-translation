id: NUM.14.31
reference: Numbers 14:31
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/טַ֨פְּ/כֶ֔ם אֲשֶׁ֥ר אֲמַרְתֶּ֖ם לָ/בַ֣ז יִהְיֶ֑ה וְ/הֵבֵיאתִ֣י אֹתָ֔/ם וְ/יָֽדְעוּ֙ אֶת הָ/אָ֔רֶץ אֲשֶׁ֥ר מְאַסְתֶּ֖ם בָּֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/031.yaml
  text: But your little ones[a], whom you said would become plunder, I will bring in[c][b], and they will know the land that you rejected.
translation:
  language: zh_hans
  text: 但你们幼小的孩子，就是你们所说会成为掳物[a]的，我必把他们领进去；他们必认识[b]你们所厌弃[c]的那片土地。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“成为战利品”，也可译作“成为猎物”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“亲身经历”。这里的希伯来语“认识”可以含有亲自体验的意思。
    reason: lexical_alternative
  - marker: c
    text: 或译：“所拒绝”或“所藐视”。
    reason: lexical_alternative
lexical_decisions:
- source_word: טַפְּכֶם
  choice: 你们幼小的孩子
  rationale: טַף在此特指年幼、需要保护的孩子；译作“幼小的孩子”既准确，也保留父母先前为他们担忧的语境。
- source_word: לָבַז
  choice: 成为掳物
  rationale: בַּז指敌人在战争中夺取的掳物或战利品；“成为掳物”符合军事语境，也表达这些孩子将落入敌手的忧虑。
- source_word: וְהֵבֵיאתִי אֹתָם
  choice: 我必把他们领进去
  rationale: בוא的使役形在此意为使他们进入；目的地由下文“那片土地”明确，因此汉语可自然地说“领进去”。
- source_word: וְיָדְעוּ
  choice: 他们必认识
  rationale: יָדַע基本义为“知道、认识”，在这里也可包含亲自经历、实际享有那地的意味；正文保留较贴近原文且具有一定开放性的“认识”。
- source_word: הָאָרֶץ
  choice: 那片土地
  rationale: 原文只说“那地”，语境指此前所谈的土地；“那片土地”在现代汉语中自然清楚，同时不擅自加上“应许之地”或“迦南”。
- source_word: מְאַסְתֶּם בָּהּ
  choice: 你们所厌弃的
  rationale: מָאַס可指拒绝、厌弃或藐视；“厌弃”在此兼顾拒绝接受与轻看那地的语气，而不过度强化为仇恨。
theological_decisions:
- issue: 是否明说这片土地是应许之地或迦南
  choice: 正文只译作“那片土地”
  alternative: “应许之地”或“迦南地”
  rationale: 希伯来文仅用הָאָרֶץ；所指对象由上下文确定。正文不加入原文没有的神学性或地理性说明。
- issue: וְיָדְעוּ是否直接解释为进入并享有那地
  choice: 保留“认识”，并以脚注说明其亲身经历的意味
  alternative: “亲身经历”或“得以享有”
  rationale: 原文使用意义范围较宽的יָדַע。保留“认识”可避免把其体验性含义限定为某一种解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“幼小的孩子”比单说“孩子”更准确地体现טַף的年龄与脆弱性；分号呈现神所采取的行动与孩子将有的经历之间的推进关系。所有脚注标记均置于对应词语之后。
