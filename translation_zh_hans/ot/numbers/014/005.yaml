base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/005.yaml
  text: Then Moses and Aaron fell on their faces before the whole assembly of the congregation of the sons of Israel[a][b].
translation:
  language: zh_hans
  text: 于是，摩西和亚伦在以色列人[a]的全体会众[b]面前俯伏在地。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“以色列的众子”；这是指以色列民的惯用称谓。
    reason: lexical_alternative
  - marker: b
    text: 原文在此连用两个意思相近的群体词，直译可作“会众的集会”或“会众的大会”，以加强其公开、全体性的语气。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפֹּל
  choice: 俯伏在地
  rationale: נפל的叙事形式基本义为“倒下、伏下”；结合“在他们脸上”这一希伯来语惯用表达，译作“俯伏在地”既自然，也保留公开谦卑、恳切伏地的动作，而不进一步说明其动机。
- source_word: עַל־פְּנֵיהֶם
  choice: 俯伏在地
  rationale: 该短语直译近于“在他们的脸上”，是表示面朝下伏地的惯用语。现代汉语用“俯伏在地”最为清楚庄重；其含义与动词合并表达，避免生硬的“倒在脸上”。
- source_word: לִפְנֵי
  choice: 在……面前
  rationale: 该介词表示处于某群体之前或在其公开见证之下；“在……面前”准确而自然。
- source_word: כָּל
  choice: 全体
  rationale: 修饰集合名词时，“全体”清楚表达整体性，也符合现代汉语群体称谓。
- source_word: קְהַל
  choice: 大会
  rationale: קָהָל指聚集起来的群体或集会；在此译作“大会”，以区别于后面的עֵדָה，并保留两个相关群体词并用的结构。
- source_word: עֲדַת
  choice: 会众
  rationale: עֵדָה常指作为一个有组织整体的群体；“会众”是清楚、庄重且合乎语境的对应词。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列众子
  rationale: 原文明确为“以色列的众子”。正文保留其男性复数形式，不将其直接中性化；脚注列出现代汉语中更常用的替代译法。
theological_decisions:
- issue: 是否把קְהַל עֲדַת两个相近的群体词合并为一个词
  choice: 保留为“全体会众的大会”
  alternative: “以色列全会众”或“以色列全体会众”
  rationale: 原文连续使用קָהָל与עֵדָה，形成庄重、公开的群体表达。正文保留两者，避免把原文的强调结构压平；脚注说明这一希伯来语特点。
- issue: 是否把בְּנֵי יִשְׂרָאֵל译成性别中性的群体名称
  choice: 以色列众子
  alternative: “以色列人”或“以色列子民”
  rationale: 正文保留原文语法上的男性复数和族群称谓，同时用脚注提示更符合现代汉语习惯的等值表达，不据此加入额外的神学判断。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“俯伏在地”自然传达希伯来语“倒下在脸上”的惯用动作；“全体会众的大会”略带正式色彩，是为保留原文两个相关群体名词的叠用。所有脚注标记均置于正文相应词语之后。
