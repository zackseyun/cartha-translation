source:
  edition: WLC
  text: יְהוָ֗ה אֶ֤רֶךְ אַפַּ֨יִם֙ וְ/רַב חֶ֔סֶד נֹשֵׂ֥א עָוֺ֖ן וָ/פָ֑שַׁע וְ/נַקֵּה֙ לֹ֣א יְנַקֶּ֔ה פֹּקֵ֞ד עֲוֺ֤ן אָבוֹת֙ עַל בָּנִ֔ים עַל שִׁלֵּשִׁ֖ים וְ/עַל רִבֵּעִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/018.yaml
  text: Yahweh is slow to anger and abundant in steadfast love[a], forgiving iniquity and transgression, but he will by no means clear the guilty[d][c][b], visiting the iniquity of fathers on children to the third and to the fourth generation.
translation:
  language: zh_hans
  text: 雅威不轻易发怒，满有慈爱[a]，赦免罪孽和过犯[b]；但他绝不以有罪的为无罪[c]，追讨父亲的罪孽，自父及子，直到三四代[d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “满有慈爱”也可译作“大有盟约忠诚”“满有怜悯”或“有丰盛的忠贞之爱”。
    reason: lexical_alternative
  - marker: b
    text: “赦免”在希伯来原文中直译为“担当”或“背负”罪孽和过犯。
    reason: lexical_alternative
  - marker: c
    text: 也可译作“但他绝不会免除刑罚”或“绝不会宣告无罪”。原文用同根词叠加强调这一否定。
    reason: lexical_alternative
  - marker: d
    text: 希伯来原文直译为“到第三、到第四”，所指的是第三代和第四代。
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语音译上帝向以色列启示的专名，不用“主”这一称号代替。
- source_word: אֶרֶךְ אַפַּיִם
  choice: 不轻易发怒
  rationale: 这是希伯来语“鼻孔长”的习语，表示怒气迟延；“不轻易发怒”是自然、清楚的现代汉语表达。
- source_word: רַב חֶסֶד
  choice: 有丰盛的慈爱
  rationale: רַב 表示丰盛；חֶסֶד 兼有慈爱、信实和盟约忠诚之意。正文采用通顺而庄重的“慈爱”，脚注保留其余语义。
- source_word: נֹשֵׂא עָוֺן וָפָשַׁע
  choice: 赦免罪孽和过犯
  rationale: נשא 与罪的词语连用时可指承担、除去或赦免；此处在宣告上帝怜悯的语境中译作“赦免”，同时区分 עָוֺן（罪孽）与 פָשַׁע（过犯、悖逆）。
- source_word: וְנַקֵּה לֹא יְנַקֶּה
  choice: 但他绝不以有罪的为无罪
  rationale: 同根词的加强结构强调否定，表达司法性的绝不宣告无罪；“有罪的”是汉语为使隐含宾语明确而作的必要补足。
- source_word: פֹּקֵד עֲוֺן אָבוֹת עַל בָּנִים
  choice: 他追讨父辈的罪孽，使其临到子孙
  rationale: פקד 在此表示追究并使后果或惩罚临到；译文保留其司法意味，也不把经文限定为仅指自然后果。
- source_word: עַל שִׁלֵּשִׁים וְעַל רִבֵּעִים
  choice: 直到三代、四代
  rationale: 原文省略“代”，但明确指连续世代；汉语补出“代”以保证清楚，并以“三代、四代”保留原文并列措辞。
theological_decisions:
- issue: 赦免与绝不宣告有罪者无罪之间的张力
  choice: 同时直陈雅威赦免罪孽和过犯，又绝不以有罪的为无罪
  alternative: 将后半句弱化为仅指罪的自然后果，或用解释性文字调和两者
  rationale: 希伯来文本本身并置神的慈爱、赦免与司法公义；译文保留这一神学张力，不代替经文作系统性调和。
- issue: 父辈罪孽临到后代的代际审判表述
  choice: 保留“追讨父辈的罪孽，使其临到子孙，直到三代、四代”
  alternative: 改译为后代仅承受非司法性的社会影响，或依据其他经文淡化此处措辞
  rationale: 原文明确使用 פקד 与“临到子孙”的结构。译文不预先限定其机制，也不借其他经文消解此处的严肃表述。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“雅威”保留神的专名；“罪孽、过犯、追讨”维持经文的司法和道德分量。分成两句以提升汉语可读性，但保留慈爱、赦免与审判之间的并置关系。
