  rationale: 删除原文未直接表达的“却不同”，让“但”与原因分句自然构成上下文对比。将“另有一种心灵”改为“有别样的灵与他同在”，以改善现代汉语表达，并保留רוּחַ所含“灵、心志、内在倾向”等未决范围。将“得那地为业”改为“承受那地”，与动词ירשׁ及脚注替代译法更直接对应；不改变土地应许的含义。
