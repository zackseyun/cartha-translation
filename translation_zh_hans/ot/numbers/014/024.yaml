source:
  edition: WLC
  text: וְ/עַבְדִּ֣/י כָלֵ֗ב עֵ֣קֶב הָֽיְתָ֞ה ר֤וּחַ אַחֶ֨רֶת֙ עִמּ֔/וֹ וַ/יְמַלֵּ֖א אַחֲרָ֑/י וַ/הֲבִֽיאֹתִ֗י/ו אֶל הָ/אָ֨רֶץ֙ אֲשֶׁר בָּ֣א שָׁ֔מָּ/ה וְ/זַרְע֖/וֹ יוֹרִשֶֽׁ/נָּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/024.yaml
  text: But my servant Caleb[a], because a different spirit was with him and he followed me fully, I will bring him into the land where he went[c][b], and his offspring will possess it.
translation:
  language: zh_hans
  text: 但我的仆人迦勒，因为有别样的灵与他同在[a]，又全心全意地跟随我[b]，我要领他进入他曾到过的那地；他的后裔必承受那地[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他有不同的心志”；原文也可直译为“有另一位（或另一种）灵与他同在”。
    reason: 保留 רוּחַ אַחֶרֶת עִמּוֹ 的词义范围和神学开放性。
  - marker: b
    text: 希伯来语习语，字面结构为“他在我之后充满”；意思是他完全、毫无保留地跟随耶和华。
    reason: 说明不宜按字面翻译的习语。
  - marker: c
    text: 或译：“他的后裔必占有那地”或“必得那地为业”。
    reason: 保留 ירשׁ 在土地语境中“占有／承受产业”的词义范围。
lexical_decisions:
- source_word: וְעַבְדִּי כָלֵב
  choice: 但我的仆人迦勒却不同
  rationale: וְ 在上下文中表示与不信的那一代形成转折；“仆人”自然表达迦勒与上帝的忠诚从属关系。“却不同”承接后面的原因从句，使现代汉语结构清楚。
- source_word: עֵקֶב
  choice: 因为
  rationale: 明确表达上帝厚待迦勒的原因。
- source_word: הָיְתָה רוּחַ אַחֶרֶת עִמּוֹ
  choice: 另有一种心灵与他同在
  rationale: 尽量保留希伯来语“另一种灵/心灵与他同在”的表达及其开放性，不直接限定为圣灵，也不完全化约为“态度”。
- source_word: וַיְמַלֵּא אַחֲרָי
  choice: 他也全心全意地跟随我
  rationale: 这是希伯来语习语，字面为“在我后面充满”；所表达的是完全、专一地跟随。
- source_word: וַהֲבִיאֹתִיו
  choice: 所以我要领他进入
  rationale: 在宣告应许的语境中，该形式表达将来的行动；“领……进入”自然呈现使其进入应许之地的含义。
- source_word: אֶל הָאָרֶץ אֲשֶׁר בָּא שָׁמָּה
  choice: 他曾去过的那地
  rationale: 贴近“他到那里去”的希伯来语措辞，并由“曾”表明迦勒此前作为探子去过该地。
- source_word: וְזַרְעוֹ
  choice: 他的后裔
  rationale: זֶרַע 在这里是集合意义，指迦勒的子孙后代；“后裔”庄重而清楚。
- source_word: יוֹרִשֶׁנָּה
  choice: 必得那地为业
  rationale: 兼顾 ירשׁ 在土地应许语境中“占有”和“承受产业”的含义；“得……为业”是清楚且庄重的汉语表达。
theological_decisions:
- issue: 迦勒“另有一种心灵”的所指
  choice: 保留为“另有一种心灵与他同在”
  alternative: “他有不同的心志”或“上帝的灵特别与他同在”
  rationale: רוּחַ 可指灵、心灵、心志或内在倾向；原文没有明确指定圣灵，也不只是普通态度，因此不把神学含义限定在单一解释上。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“心灵”保留原文 רוּחַ 的宽泛意义；“全心全意地跟随”自然传达希伯来语习语；“得那地为业”体现土地应许语境，同时以脚注保留“占有／承受”的可能译法。
