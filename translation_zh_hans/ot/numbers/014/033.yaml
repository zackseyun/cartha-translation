  text: וּ֠/בְנֵי/כֶם יִהְי֨וּ רֹעִ֤ים בַּ/מִּדְבָּר֙ אַרְבָּעִ֣ים שָׁנָ֔ה וְ/נָשְׂא֖וּ אֶת זְנוּתֵי/כֶ֑ם עַד תֹּ֥ם פִּגְרֵי/כֶ֖ם בַּ/מִּדְבָּֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/033.yaml
  text: And your sons will be shepherds in the wilderness for forty years, and they will bear your acts of sexual unfaithfulness until your dead bodies are finished off in the wilderness.
translation:
  language: zh_hans
  text: 你们的儿子要在旷野作牧人[a]四十年，承受你们淫乱不忠[b]的后果，直到你们的尸首在旷野灭尽[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在旷野漂泊”。希伯来语原词与牧放、牧养有关，字面是“作牧人”，也有人认为这里着重表示他们将过漂泊不定的生活。
    reason: lexical_alternative
  - marker: b
    text: “淫乱不忠”所译的希伯来语词也可译作“淫行”或“不忠”；这里用性的意象表达对上主的背信。
    reason: lexical_alternative
  - marker: c
    text: 或译：“直到你们的尸首都在旷野终尽。”
    reason: alternative_reading
lexical_decisions:
- source_word: וּבְנֵיכֶם
  choice: 你们的儿子
  rationale: בנים是阳性复数，通常指“儿子”；本节没有充分理由将其泛化为“儿女”或“后代”。
- source_word: רֹעִים
  choice: 作牧人
  rationale: 该词源自“牧放、牧养”，字面是“牧人”；正文保留牧养意象，不直接改译为其处境性含义“漂泊”。
- source_word: בַּמִּדְבָּר
  choice: 在旷野
  rationale: מִדְבָּר指人烟稀少的旷野或牧野，不必专指沙漠；“旷野”符合本段地理和叙事背景。
- source_word: אַרְבָּעִים שָׁנָה
  choice: 四十年
  rationale: 直接表达持续时间，现代汉语无需另加介词。
- source_word: וְנָשְׂאוּ
  choice: 承受……的后果
  rationale: נשא本义为“背负、担当”，在此表示下一代承受上一代不忠所造成的后果；这一表达在现代汉语中自然，同时避免断言儿子承担父辈本人的罪责。
- source_word: אֶת זְנוּתֵיכֶם
  choice: 你们淫乱不忠的后果
  rationale: זְנוּת带有淫乱、卖淫的性意象，在此语境中比喻以色列对上主的背信；“淫乱不忠”兼顾意象与所指，未将其缩减为一般的“不忠”。
- source_word: עַד תֹּם פִּגְרֵיכֶם
  choice: 直到你们的尸首全都倒毙
  rationale: תֹּם表示达到尽头或全部完结，פֶּגֶר是语气强烈的“尸首”；译文保留死亡审判的严厉措辞，并以“全都倒毙”表达这一代人死尽。
theological_decisions:
- issue: זְנוּתֵיכֶם是按字面性行为理解，还是按圣约关系中的不忠理解
  choice: 译作“淫乱不忠”，保留性意象，也指明其背信含义
  alternative: 淫行；不忠
  rationale: 上下文针对以色列悖逆上主，单译“淫行”容易被误解为仅指性犯罪，单译“不忠”又会抹去希伯来词刻意使用的性隐喻。
- issue: 儿子“担当”父辈之事是否意味着承担父辈本人的罪责
  choice: 译作“承受……的后果”
  alternative: 担当你们的淫乱不忠；承担你们淫乱不忠的罪责
  rationale: 本节宣告儿子将因父辈的悖逆而在旷野生活四十年，重点是承受后果；译成“罪责”会额外确定原文没有明说的归罪关系。
- issue: רֹעִים是否应按结果解释为“漂泊者”
  choice: 正文保留“作牧人”
  alternative: 在旷野漂泊
  rationale: 希伯来词明确属于牧养词族；漂泊是这种旷野牧居生活的语境含义，可在脚注说明，不应取代正文中的原有意象。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“作牧人”保留原文意象；“淫乱不忠”保留尖锐的性隐喻及其圣约背信含义；“尸首”“倒毙”维持审判宣告的沉重语气。
