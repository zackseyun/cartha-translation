source:
  edition: WLC
  text: בַּ/מִּדְבָּ֣ר הַ֠/זֶּה יִפְּל֨וּ פִגְרֵי/כֶ֜ם וְ/כָל פְּקֻדֵי/כֶם֙ לְ/כָל מִסְפַּרְ/כֶ֔ם מִ/בֶּ֛ן עֶשְׂרִ֥ים שָׁנָ֖ה וָ/מָ֑עְלָ/ה אֲשֶׁ֥ר הֲלִֽינֹתֶ֖ם עָלָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/029.yaml
  text: In this wilderness your dead bodies will fall[a], all of you who were counted according to your whole number, from twenty years old and upward[c][b], who have grumbled against me.
translation:
  language: zh_hans
  text: 在这旷野中，你们的尸首必倒下[a]：就是你们中所有被数点的，按你们的全数计算，从二十岁以上、向我发怨言[c]的人[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“你们的尸体必倒下”。希伯来文措辞具体而强烈，突出他们将在旷野肉身死亡。
    reason: lexical_alternative
  - marker: b
    text: “被数点的人”指在人口统计或点名编组中登记在册的人。
    reason: cultural_note
  - marker: c
    text: “发怨言”也可译作“抱怨”。这里含有对上帝不满、抗拒的意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּמִּדְבָּר הַזֶּה
  choice: 在这旷野
  rationale: “旷野”准确表达 מִדְבָּר 在摩西五经中的荒野地带，也保留以色列漂流之地的叙事背景。
- source_word: יִפְּלוּ פִגְרֵיכֶם
  choice: 你们的尸首必倒下
  rationale: 保留 נפל“倒下”的具体意象和 פגר“尸首”的身体性，不淡化为单纯的“你们必死”；“尸首”庄重而带有审判语气。
- source_word: וְכָל פְּקֻדֵיכֶם
  choice: 你们中所有被数点的人
  rationale: פְּקֻדִים 指在人口统计或点名编组中登记的人；“被数点的人”保留民数记的统计背景，同时可为现代读者理解。
- source_word: לְכָל מִסְפַּרְכֶם
  choice: 照着你们的总数
  rationale: 表达该短语对全部被统计人数的概括与强调，避免将其误解为零散的个别人。
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמָעְלָה
  choice: 凡二十岁以上
  rationale: 以自然的现代汉语表达希伯来文人口统计中的年龄下限公式。
- source_word: אֲשֶׁר הֲלִינֹתֶם עָלָי
  choice: 向我发怨言
  rationale: לון 的使役词干在旷野叙事中表示带有反抗意味的抱怨；“发怨言”既自然，又比一般的“抱怨”更能体现持续不满和悖逆色彩。
theological_decisions:
- issue: 审判宣告是否保留具体的尸首意象
  choice: 保留“你们的尸首必倒下”
  alternative: 译作“你们必死在这旷野”
  rationale: 原文并非只抽象地宣告死亡，而是以尸首倒在旷野的鲜明图景表达审判；保留这一图景可维持原文的严厉分量。
- issue: “所有被数点的人”与年龄、发怨言者之间的关系
  choice: 将各限定语并列保留，不进一步解释为某一特定兵役或神学群体
  alternative: 明确译成“所有登记服兵役的男子”
  rationale: 上下文虽与人口统计有关，但本节自身没有明说“服兵役的男子”；译文不加入超出本节措辞的限定。
translation_notes:
  register: 采用现代、庄重而清楚的书面汉语。“尸首必倒下”刻意保留原文较为生硬而鲜明的审判图景；后半句重复“都必倒下”，使汉语长句结构清楚，并明确全部限定语都受主要判词支配。
