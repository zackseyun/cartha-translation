base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/038.yaml
  text: But Joshua son of Nun and Caleb son of Jephunneh remained alive from among those men who had gone to spy out the land[a].
translation:
  language: zh_hans
  text: 但在那些去窥探那地的人中，嫩的儿子约书亚和耶孚尼的儿子迦勒仍然活着[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“察看那地”，或“侦察那地”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וִיהוֹשֻׁעַ
  choice: 但……约书亚
  rationale: 连词结合上文形成转折：其他探子已经死亡，约书亚却仍然活着。“约书亚”采用现代中文圣经中通行的人名译法。
- source_word: בִּן נוּן
  choice: 嫩的儿子
  rationale: 按希伯来语父子关系结构直译，并采用“嫩”这一通行专名译法。
- source_word: וְכָלֵב בֶּן יְפֻנֶּה
  choice: 和耶孚尼的儿子迦勒
  rationale: 连词连接两名幸存者；父子关系予以保留，专名采用现代中文通行译法。
- source_word: חָיוּ
  choice: 仍然活着
  rationale: חיה的Qal完成式在本语境中表示这些人没有像其余探子那样死亡；“仍然活着”既保留“活着”的基本义，也自然表达上下文中的对比。
- source_word: מִן הָאֲנָשִׁים הָהֵם
  choice: 在那些……的人中
  rationale: מִן在这里标明二人是该群体中的例外；中文用“在……中”自然表达从群体中存留下来的关系。
- source_word: הַהֹלְכִים
  choice: 去……的
  rationale: 分词描述先前参与行动的那群人；中文以“去……的人”简洁自然地表达该修饰关系。
- source_word: לָתוּר אֶת הָאָרֶץ
  choice: 去窥探那地
  rationale: תור在本段指对迦南地进行勘察的任务。“窥探”符合侦察语境，但该词也可侧重察看或侦察，因此以脚注保留词义选择的幅度。
