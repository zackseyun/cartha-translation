  text: וַ/יַּשְׁכִּ֣מוּ בַ/בֹּ֔קֶר וַ/יַּֽעֲל֥וּ אֶל רֹאשׁ הָ/הָ֖ר לֵ/אמֹ֑ר הִנֶּ֗/נּוּ וְ/עָלִ֛ינוּ אֶל הַ/מָּק֛וֹם אֲשֶׁר אָמַ֥ר יְהוָ֖ה כִּ֥י חָטָֽאנוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/040.yaml
  text: They rose early in the morning and went up to the top of the mountain[a], saying, “Here we are, and we will go up to the place that Yahweh has spoken of, for we have sinned.”
translation:
  language: zh_hans
  text: 他们清早起来，上到山顶，说：“我们在这里；我们要上到雅威所说的那地方去，因为我们犯了罪。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּשְׁכִּמוּ בַבֹּקֶר
  choice: 他们清早起来
  rationale: שׁכם的使役形与“早晨”连用，表示一早起身；“清早起来”自然保留时间上的强调。
- source_word: וַיַּעֲלוּ אֶל רֹאשׁ הָהָר
  choice: 上到山顶
  rationale: עלה意为“上去”，רֹאשׁ הָהָר是“山的顶部”，合译为“上到山顶”简洁自然。
- source_word: הִנֶּנּוּ
  choice: 我们在这里
  rationale: 这是第一人称复数的自我呈现用语；译文不额外加入“准备好了”等解释。
- source_word: וְעָלִינוּ
  choice: 我们要上……去
  rationale: 此处完成式结合语境表达已决定或意欲采取的行动；“要上……去”符合现代汉语，同时保留其意向性。
- source_word: אֲשֶׁר אָמַר יְהוָה
  choice: 耶和华所说的
  rationale: אמר本义为“说”；直译为“所说的”可保留原文简略关系，不强化为“应许的”。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的神名音译“耶和华”，将四字神名作为专名呈现，而非用称号替代。
- source_word: כִּי חָטָאנוּ
  choice: 因为我们犯了罪
  rationale: כִּי在此引出理由；חטא明确涉及犯罪、获罪，译为“犯了罪”保留其道德与神学分量。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用四字神名。简体中文正文采用广为人知且具专名功能的“耶和华”；“雅威”是更贴近常见学术重构读音的可行替代。
- issue: אֲשֶׁר אָמַר所表达的关系
  choice: 所说的地方
  alternative: 所应许的地方
  rationale: 原文动词仅为“说”，没有明说“应许”；保留“所说的”可避免把上下文所暗示的应许意味直接写入正文。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。“我们在这里”保留原文自我呈现公式；分号表现其后行动宣告与前句的紧密关系。原文没有需要在本节正文标出的文本异读或不可避免的词义歧义，故不设脚注。
