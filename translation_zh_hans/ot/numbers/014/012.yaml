base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/012.yaml
  text: I will strike him with the plague and dispossess him[a], and I will make you into a nation greater and mightier than he.
translation:
  language: zh_hans
  text: 我要用瘟疫击打这民，使他们失去所承受的产业[a]；我要使你成为一个比这民更大、更强的国。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“剥夺他们所占有的地业。”原文动词可兼有使人失去所承受的产业和剥夺其所占有之地的意味。
    reason: 保留 ירשׁ 使役式在“使人失去承受的产业”与“剥夺所占有的地业”之间的词义张力。
lexical_decisions:
- source_word: אַכֶּנּוּ
  choice: 击打这民
  rationale: נכה 的使役式在此表示“击打”。希伯来语用第三人称阳性单数后缀，把以色列民视为一个整体；中文以“这民”自然保留集合单数的意味。
- source_word: בַדֶּבֶר
  choice: 用瘟疫
  rationale: דֶּבֶר 在审判语境中通常指致命的疫病；“瘟疫”既准确又符合现代中文。
- source_word: וְאוֹרִשֶׁנּוּ
  choice: 剥夺他们的产业
  rationale: ירשׁ 的使役式可表示使人失去所占有或承受的产业。此译保留土地占有和承受产业两方面的含义，同时避免把经文限定为现代法律意义上的“取消继承权”。
- source_word: וְאֶעֱשֶׂה אֹתְךָ לְגוֹי
  choice: 使你的后代成为一个……国
  rationale: 原文直译为“使你成为一个国”，实际指从摩西而出的国族。中文补出“你的后代”，使意思自然清楚，而不改变所指。
- source_word: גָּדוֹל וְעָצוּם
  choice: 更大、更强
  rationale: 两个形容词与后面的比较结构 מִמֶּנּוּ־ 连用。עָצוּם 可指强盛，也可含人数众多之意；“强”保留较宽泛的国力含义。
- source_word: מִמֶּנּוּ
  choice: 比他们
  rationale: 原文为第三人称阳性单数，所指却是作为整体的以色列民。现代中文在比较句中用复数“他们”更自然，集合对象已由“这民”明确。
theological_decisions:
- issue: 审判对象的单数集合表达
  choice: 前句用“这民”体现以色列作为整体，后续代词按现代中文习惯用“他们”。
  alternative: 全句使用“他”，形式上对应希伯来语阳性单数后缀。
  rationale: 希伯来语的单数后缀指整个以色列群体，并非某个男性个人。中文若连续用“他”容易造成误解；“这民”既保留整体性，又明确其群体所指。
- issue: וְאוֹרִשֶׁנּוּ 的语义范围
  choice: 剥夺他们的产业
  alternative: 使他们丧失继承权；赶走他们；除灭他们
  rationale: 该动词在此兼有失去占有之地和承受之产业的意味。“剥夺他们的产业”保留这种张力，不把威胁过早限定为单纯驱逐、法律上的废嗣或彻底消灭。
- issue: “使你成为一国”的所指
  choice: 使你的后代成为一个国
  alternative: 使你成为一个国
  rationale: 应许是从摩西产生一个国族，而非把摩西个人等同于国家。补出隐含的后代关系符合中文表达，也与上下文中民族延续的含义一致。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“这民”保留原文把以色列视为一个整体的表达；分号呈现审判与另立一国之间鲜明的转折。
