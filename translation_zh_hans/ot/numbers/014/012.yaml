  rationale: 修订直接对应原文的句法与语义：以“这民”呈现单数集合指称，以“他们”作自然的中文回指；将处置动词改为“使他们失去所承受的产业”，避免“剥夺他们的产业”可能造成的财物意义偏移；删除解释性补入的“你的后代”，恢复原文对摩西的直接表述。脚注保留动词的处置／剥夺地业含义，且不把有争议的细微语义定为单一解释。
