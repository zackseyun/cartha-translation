  text: וַ/יַּעְפִּ֕לוּ לַ/עֲל֖וֹת אֶל רֹ֣אשׁ הָ/הָ֑ר וַ/אֲר֤וֹן בְּרִית יְהוָה֙ וּ/מֹשֶׁ֔ה לֹא מָ֖שׁוּ מִ/קֶּ֥רֶב הַֽ/מַּחֲנֶֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/044.yaml
  text: But they presumed to go up to the top of the mountain[b][a], though the ark of the covenant of Yahweh and Moses did not move from the midst of the camp.
translation:
  language: zh_hans
  text: 然而，他们擅自上到山顶[a]；雅威的约柜[b]和摩西却没有离开营中。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “擅自”也可译作“执意”或“狂妄地”。原文动词含有任意冒进、擅作主张的意味。
    reason: lexical_alternative
  - marker: b
    text: 原文直译可作“雅威之约的柜”；正文采用汉语中较自然的“雅威的约柜”。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעְפִּלוּ
  choice: 却擅自
  rationale: 该动词在此表达明知违命仍执意妄行的意味。“擅自”自然简洁，既体现主观冒进和僭越，也不把语义收窄为单纯的“勇敢”或身体上的登山。
- source_word: לַעֲלוֹת
  choice: 上到
  rationale: 准确表达向上行进并到达目标之意，符合现代汉语叙事习惯。
- source_word: אֶל רֹאשׁ הָהָר
  choice: 山顶
  rationale: רֹאשׁ字面为“头”，在此惯用义为“顶部、顶峰”；הָהָר在本场景中自然译作“山”。
- source_word: וַאֲרוֹן בְּרִית יְהוָה
  choice: 雅威的约柜
  rationale: 希伯来语结构可理解为“雅威之约的柜”或传统所称“雅威的约柜”。正文采用自然、通行而简洁的“雅威的约柜”，另以脚注保留结构上的译法。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语中较通行的音译呈现四字神名，保留其专名性质，不以称号替代。
- source_word: וּמֹשֶׁה
  choice: 和摩西
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: לֹא מָשׁוּ
  choice: 都没有离开
  rationale: מוש在此指移开、离去。主语为约柜和摩西，汉语加“都”清楚表明二者均未随行；“没有离开”比“没有移动”更准确地传达未从营中出去。
- source_word: מִקֶּרֶב הַמַּחֲנֶה
  choice: 营中
  rationale: 简洁自然地表达“从营地内部／当中”；与“离开”连用即可完整传达起点关系。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。译作“雅威”保留其作为以色列之神专名的性质；不以“主”这一称号替代，也不采用较晚形成的混合读音“耶和华”。
- issue: וַיַּעְפִּלוּ所表达的以色列人行为性质
  choice: 他们却擅自上到
  alternative: 他们竟敢上去；他们执意上去；他们狂妄地上去
  rationale: 上下文表明这次登山违背了雅威的宣告，带有有意冒进、僭越的性质。“擅自”保留其应受责备的意味，同时避免把词义过度解释为某一种特定心理状态。
- issue: 约柜与圣约的所属关系
  choice: 雅威的约柜
  alternative: 雅威之约的柜；雅威的约柜（即约柜）
  rationale: 希伯来语בְּרִית יְהוָה可直译为“雅威的约”，整个短语即“雅威之约的柜”；但汉语惯用“雅威的约柜”更自然。脚注说明较贴近原文结构的译法，以保留可能的关系表达。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“却”承接上文的禁令与警告，突出逆转；分号区分百姓冒进与约柜、摩西留营这两个对照鲜明的叙事分句。所有脚注标记均置于正文相应词语之后。
