base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/019.yaml
  text: Please forgive the iniquity of this people according to the greatness of your steadfast love[a], just as you have forgiven this people from Egypt until now.
translation:
  language: zh_hans
  text: 求你照你丰盛的慈爱，赦免这百姓的罪孽，正如你从埃及直到如今一直背负[a]这百姓。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “背负”也可译作“赦免”。希伯来语动词可表示“承载、背负”，在某些语境中也可表示“赦免”。
    reason: lexical_alternative
lexical_decisions:
- source_word: סְלַח נָא
  choice: 求你……赦免
  rationale: 祈使式与语气词נָא构成恳切请求；“求你……赦免”在现代汉语中自然地表达请求和迫切语气。
- source_word: לַעֲוֹן
  choice: 罪孽
  rationale: עָוֹן可指罪行、罪责或罪的后果；“罪孽”保留其道德分量，又不将含义仅限于其中一面。
- source_word: הָעָם הַזֶּה
  choice: 这百姓
  rationale: עַם是集合单数，指作为共同体的人民；“这百姓”简洁庄重，并保留共同体意味。
- source_word: כְּגֹדֶל חַסְדֶּךָ
  choice: 照你丰盛的慈爱
  rationale: גֹּדֶל表示广大，חֶסֶד包含坚定、忠诚而施恩的爱；“丰盛的慈爱”符合自然汉语，也保留其持久信实的内涵。
- source_word: וְכַאֲשֶׁר
  choice: 正如
  rationale: 该连接语引出上帝以往作为的类比；“正如”清楚表达摩西诉诸先例的恳求。
- source_word: נָשָׂאתָה
  choice: 一直背负
  rationale: נשא的基本义是举起、承载或背负，在涉及罪的语境中也可表示赦免。此处直接宾语是“这百姓”，故正文保留“背负”的意象，并以脚注说明“赦免”的可能性。
- source_word: מִמִּצְרַיִם וְעַד הֵנָּה
  choice: 从埃及直到如今
  rationale: 该短语兼有从埃及到此处、从出埃及以来直到此刻的时空延续意味；“直到如今”在语境中自然突出持续时间。
theological_decisions:
- issue: 摩西所说上帝以往נָשָׂאתָה这百姓的含义
  choice: 正文译为“背负”，表现上帝一路承载、容忍百姓，也不排除赦免之意。
  alternative: 译为“赦免”，强调上帝从埃及以来不断赦免百姓。
  rationale: 动词的直接宾语是“这百姓”，不是他们的罪孽，因此“背负”较贴近句法和基本词义；但该动词在罪与罪责的语境中确可表示“赦免”，所以用脚注保留这一真实歧义，避免把摩西的诉求仅化约为忍耐或仅化约为赦罪。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“求你”“慈爱”“罪孽”适合祷告语境；“背负这百姓”略带意象性，以保留希伯来原文的表达和歧义。
