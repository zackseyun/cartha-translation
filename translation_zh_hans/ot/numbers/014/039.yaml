  text: וַ/יְדַבֵּ֤ר מֹשֶׁה֙ אֶת הַ/דְּבָרִ֣ים הָ/אֵ֔לֶּה אֶֽל כָּל בְּנֵ֖י יִשְׂרָאֵ֑ל וַ/יִּֽתְאַבְּל֥וּ הָ/עָ֖ם מְאֹֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/039.yaml
  text: Moses spoke these words to all the sons of Israel[a], and the people mourned greatly.
translation:
  language: zh_hans
  text: 摩西把这些话告诉了所有以色列人[a]，百姓就极其悲痛。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“所有以色列的众子”；也可译作“所有以色列子民”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: 告诉了
  rationale: 此处指摩西把上文的神圣判词传达给全体百姓；“告诉了”比单纯的“说了”更自然地体现向特定对象传达内容，同时不增添“宣告”等额外语气。
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: 这些话
  rationale: דְּבָרִים 可指话、事情或信息；这里承接上文神所说的判词，“这些话”既贴近原文，也清楚自然。
- source_word: אֶל כָּל בְּנֵי יִשְׂרָאֵל
  choice: 所有以色列人
  rationale: בְּנֵי יִשְׂרָאֵל 是以色列民族的常用称谓。现代汉语以“以色列人”表达最自然，也能包含整个群体；原文的字面形式另见脚注。
- source_word: וַיִּתְאַבְּלוּ
  choice: 悲痛
  rationale: אבל 的 Hitpael 形式表示陷入哀恸、举哀的状态。此处百姓因审判的信息而深切哀伤，“悲痛”自然且保留其强度。
- source_word: הָעָם
  choice: 百姓
  rationale: עָם 在此将以色列民作为一个集体来指称；“百姓”符合现代中文圣经叙事语域，且与前句的“以色列人”衔接自然。
- source_word: מְאֹד
  choice: 极其
  rationale: מְאֹד 强化百姓悲痛的程度；“极其”庄重自然，并准确保留其强调作用。
