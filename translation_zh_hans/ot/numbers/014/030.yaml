  text: אִם אַתֶּם֙ תָּבֹ֣אוּ אֶל הָ/אָ֔רֶץ אֲשֶׁ֤ר נָשָׂ֨אתִי֙ אֶת יָדִ֔/י לְ/שַׁכֵּ֥ן אֶתְ/כֶ֖ם בָּ֑/הּ כִּ֚י אִם כָּלֵ֣ב בֶּן יְפֻנֶּ֔ה וִ/יהוֹשֻׁ֖עַ בִּן נֽוּן־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/030.yaml
  text: Surely you shall not come into the land in which I raised my hand to settle you[a], except Caleb son of Jephunneh and Joshua son of Nun.
translation:
  language: zh_hans
  text: 你们绝不能进入我曾举手起誓、要使你们住在其中的那地[a]；只有耶孚尼的儿子迦勒和嫩的儿子约书亚可以进去。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“我曾举起我的手、要使你们住在其中的那地”；举手是起誓的动作，表示上帝曾起誓要把那地赐给他们居住。
    reason: cultural_note
lexical_decisions:
- source_word: אִם אַתֶּם תָּבֹאוּ
  choice: 你们绝不能进入
  rationale: 句首的 אִם 用于起誓式宣告，在此表达强烈否定，并非普通的条件句。“绝不能”既传达誓言式的确定语气，也符合现代汉语表达。
- source_word: אֶל הָאָרֶץ
  choice: 进入……那地
  rationale: 介词 אֶל 与动词 בוא 连用，表示进入某地；“进入……那地”自然准确。
- source_word: אֲשֶׁר נָשָׂאתִי אֶת יָדִי
  choice: 我曾举手起誓
  rationale: 原文保留“举手”的具体动作，该动作在语境中表示起誓。译文同时保留形象并说明其文化含义，避免现代读者误解。
- source_word: לְשַׁכֵּן אֶתְכֶם בָּהּ
  choice: 要使你们住在其中
  rationale: 使役词形表示“使……居住、安顿”。“使你们住在其中”保留使役意义，也与 בָּהּ 的“在其中”对应。
- source_word: כִּי אִם
  choice: 只有
  rationale: 此结构在前述否定之后引出仅有的例外；汉语“只有”清楚表达排他性。
- source_word: כָּלֵב בֶּן יְפֻנֶּה
  choice: 耶孚尼的儿子迦勒
  rationale: 采用现代中文圣经读者熟悉的人名音译，并按自然汉语次序表达父子关系。
- source_word: וִיהוֹשֻׁעַ בִּן נוּן
  choice: 和嫩的儿子约书亚
  rationale: 保留连接词及父名结构，采用通行中文音译。
theological_decisions:
- issue: 起誓用语与神审判宣告的力度
  choice: 你们绝不能进入
  alternative: 如果你们进入……
  rationale: 这里的 אִם 属于誓言中的强烈否定用法。译成普通条件句会造成残缺或误导，削弱神审判宣告的确定性。
- issue: 例外人物是否补出省略的动作
  choice: 只有……可以进去
  alternative: 只有耶孚尼的儿子迦勒和嫩的儿子约书亚
  rationale: 希伯来文在“只有”后省略了由前句可直接补足的“进入”。汉语补出“可以进去”使句子完整清楚，并未增加新的神学内容。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“绝不能”表达原文誓言式否定的力度；“举手起誓”保留原文意象并帮助普通读者理解。人名使用简体中文圣经传统中通行的译名。
