  text: וַ/יֹּ֣אמְר֔וּ אֶל כָּל עֲדַ֥ת בְּנֵֽי יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר הָ/אָ֗רֶץ אֲשֶׁ֨ר עָבַ֤רְנוּ בָ/הּ֙ לָ/ת֣וּר אֹתָ֔/הּ טוֹבָ֥ה הָ/אָ֖רֶץ מְאֹ֥ד מְאֹֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/007.yaml
  text: And they said to all the congregation of the sons of Israel[b][a], “The land through which we passed to spy it out is an exceedingly good land.”
translation:
  language: zh_hans
  text: 他们对以色列全体会众[a]说：“我们经过那地，为要察看[b]它；那地非常非常好。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“以色列人全体大会”。
    reason: עֵדָה既可指共同体，也可着重指聚集起来的大会。
  - marker: b
    text: 或译：“探索”，或“侦察”。
    reason: תור在这里表示实地探察，具体可按语境译作探索或侦察。
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: 他们……说
  rationale: 以现代汉语自然的叙事方式表达希伯来语连续叙事形式，并引出直接引语。
- source_word: כָּל עֲדַת בְּנֵי יִשְׂרָאֵל
  choice: 以色列全体会众
  rationale: עֵדָה指聚集的共同体或会众；“全体会众”既保留群体含义，也符合现代汉语表达。
- source_word: לֵאמֹר
  choice: 不另行译出
  rationale: 这是希伯来语引出话语的惯用形式，汉语在“说”后直接使用引号即可自然表达。
- source_word: הָאָרֶץ אֲשֶׁר עָבַרְנוּ בָהּ
  choice: 我们经过那地
  rationale: עבר与ב连用表示经过或穿过某地；“经过那地”准确而简洁。
- source_word: לָתוּר אֹתָהּ
  choice: 为要察看它
  rationale: תור在本段指对土地进行实地探察；“察看”保留探索与侦察之间的语义空间，不把军事含义说得过强。
- source_word: טוֹבָה
  choice: 好
  rationale: 采用该形容词的基本意义；其强烈程度由后面的重复副词表达。
- source_word: מְאֹד מְאֹד
  choice: 非常非常
  rationale: 保留原文副词重复所产生的强调和修辞力度，而不将其压缩为单一程度副词。
theological_decisions: []
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“非常非常好”有意保留原文מְאֹד מְאֹד的重复强调；以分号呈现原文先界定所察看之地、随后再次以“那地”作主语加以评价的结构。
