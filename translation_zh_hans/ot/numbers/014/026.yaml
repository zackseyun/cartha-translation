  yaml_path: translation/ot/numbers/014/026.yaml
  text: And Yahweh spoke to Moses and to Aaron[a], saying,
translation:
  language: zh_hans
  text: 耶和华对摩西和亚伦说：
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: 说
  rationale: 该形式在叙事中引出新的说话事件；汉语神圣讲话公式用“对……说”自然、准确。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经传统中对四字神名的通行音译，保留其专名性质，而不改作称号“主”。
- source_word: אֶל מֹשֶׁה וְאֶל אַהֲרֹן
  choice: 对摩西和亚伦
  rationale: אֶל 标明讲话对象；现代汉语以一个“对”统摄并列的两位受话者，既忠实又避免生硬重复。
- source_word: לֵאמֹר
  choice: 说：
  rationale: 这是引出后续直接引语的固定表达；中文以“说：”及冒号自然承接下一节内容，无须重复译为“说话……说”。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威；主
  rationale: 原文使用四字神名。译作“耶和华”符合简体中文读者长期通行的专名形式，并避免以“主”这一称号取代原文神名；“雅威”则是另一种较接近学术重构发音的音译。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“对摩西和亚伦说”简洁地再现希伯来文神谕引言；句末冒号表明讲话内容延续至下一节。
