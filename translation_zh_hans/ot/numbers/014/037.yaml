  text: וַ/יָּמֻ֨תוּ֙ הָֽ/אֲנָשִׁ֔ים מוֹצִאֵ֥י דִבַּת הָ/אָ֖רֶץ רָעָ֑ה בַּ/מַּגֵּפָ֖ה לִ/פְנֵ֥י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/037.yaml
  text: those men who had brought out a bad report about the land died by the plague before Yahweh.
translation:
  language: zh_hans
  text: 那些诋毁那地的人，都在雅威面前遭瘟疫而死。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּמֻתוּ
  choice: 而死
  rationale: 该词是 מות 的 Qal 叙事过去式；用“而死”自然承接前文并表达事件结果。
- source_word: הָאֲנָשִׁים
  choice: 那些……的人
  rationale: 定冠词复数形式在语境中回指先前提到的探子；“那些……的人”保留其回指作用。
- source_word: מוֹצִאֵי דִבַּת הָאָרֶץ רָעָה
  choice: 诋毁那地的人
  rationale: 该分词结构按先前行为界定这些人。דִבָּה 在此不只是中性的“报告”，而含有恶意毁谤、败坏名声的意味；“诋毁那地”简洁而自然地表达这一层意思。
- source_word: בַּמַּגֵּפָה
  choice: 遭瘟疫
  rationale: מַגֵּפָה 指带来死亡的灾疫或击打；介词 בְּ 在这里表达致死的手段。“遭瘟疫而死”符合现代汉语叙事习惯。
- source_word: לִפְנֵי יְהוָה
  choice: 在雅威面前
  rationale: לִפְנֵי 表示处于雅威面前或临在之中；直译为“在雅威面前”保留审判发生于神面前的庄严意味。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名。采用“雅威”以音译该盟约之名，而不以称号“主”替代。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“诋毁”比笼统的“报恶信”更自然，也保留 דִבָּה 所含的毁谤意味；句序基本依从希伯来文，同时调整为流畅汉语。
