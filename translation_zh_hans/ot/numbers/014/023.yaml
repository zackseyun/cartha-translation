  text: they certainly shall not see the land that I swore to their fathers[b][a], and none of those who despised me shall see it.
translation:
  language: zh_hans
  text: 他们必不得见我向他们列祖[b]起誓要赐的那地[a]；凡藐视我的人，一个也不得见那地。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“他们若见那地”；这是誓言句式，实际语意是强烈的否定：“他们必不得见那地。”
    reason: lexical_alternative
  - marker: b
    text: “列祖”也可译作“祖先”；希伯来文直译为“他们的父辈”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: 必不得
  rationale: 这里的 אִם 用于誓言句式，并非普通条件词“若”；结合上文的起誓宣告，应以强烈否定表达。
- source_word: יִרְאוּ
  choice: 见
  rationale: ראה 的基本义为“看见”；在本语境中也含有亲身进入、得享那地的意味，但正文保留简洁的“见”。
- source_word: הָאָרֶץ
  choice: 那地
  rationale: 此处特指上文所说、上帝应许赐给以色列的土地；“那地”既明确指称，又保留希伯来文的圣经用语。
- source_word: נִשְׁבַּעְתִּי
  choice: 起誓
  rationale: שבע 的尼法勒词形表示郑重发誓；“起誓”准确保留誓约力度。
- source_word: לַאֲבֹתָם
  choice: 向他们列祖
  rationale: אָבוֹת 字面为“父辈”，此处指以色列人的先祖，尤其是承受应许的列祖；“列祖”自然、庄重，也保留其男性祖先的具体所指。
- source_word: וְכָל ... לֹא
  choice: 凡……的，一个也不
  rationale: 以现代汉语的全称否定结构传达“所有……都不”的分配性和强调意味。
- source_word: מְנַאֲצַי
  choice: 藐视我的
  rationale: נאץ 表示轻蔑、鄙弃或公然蔑视；“藐视”凝练而有应有的严肃分量。
- source_word: לֹא יִרְאוּהָ
  choice: 不得见那地
  rationale: 阴性代词后缀指回“那地”；汉语重复名词比使用“它”更自然，也清楚保留原文的重复强调。
theological_decisions:
- issue: 句首誓言公式的语力
  choice: 译为强调否定“必不得见”
  alternative: 直译为“他们若见那地……”并让誓言含义依靠语境补足
  rationale: 希伯来语誓言公式中的 אִם 在此表达自我咒诅式的强烈否定。若按普通条件句直译，现代读者容易误解为未完成的假设句，无法准确把握上帝审判宣告的语力。
- issue: אָבוֹת 的译法
  choice: 正文译作“列祖”
  alternative: 译作“祖先”或“父辈”
  rationale: “列祖”符合此处族长和承受应许之先祖的具体语境，也保留原词的男性家族指向；“祖先”较中性，“父辈”则可能被误解为仅指上一代。
- issue: “见那地”的语义范围
  choice: 正文保留“见”，不直接扩展为“进入”
  alternative: 译作“进入那地”或“得见并进入那地”
  rationale: “见”在语境中可包含进入并经历那地的含义，但原文确实使用 ראה。保留“见”可避免将语境推论取代原词，同时不消除其丰富含义。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“必不得”传达誓言式判决的强烈语气；“列祖”符合圣经历史语境；后半句以“凡……的，一个也……”形成自然有力的全称否定。脚注标记均置于相应正文之后。
