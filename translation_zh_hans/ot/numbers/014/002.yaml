base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/002.yaml
  text: And all the sons of Israel grumbled against Moses and against Aaron[a], and the whole congregation said to them[b], “If only we had died in the land of Egypt! Or if only we had died in this wilderness!”
translation:
  language: zh_hans
  text: 以色列众人[b]都埋怨[a]摩西和亚伦；全会众对他们说：“我们要是早死在埃及地就好了！或是早死在这旷野就好了！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “埋怨”也可译作“发怨言”或“抱怨”。
    reason: lexical_alternative
  - marker: b
    text: “以色列众人”，希伯来语字面意为“以色列的众子”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּלֹּנוּ
  choice: 埋怨
  rationale: 该动词在旷野叙事中表示群体因不满而向领袖发怨言。“埋怨”是自然的现代汉语，既传达抱怨，也保留其对抗意味。
- source_word: עַל
  choice: 埋怨……
  rationale: עַל在此标明埋怨所针对的对象；汉语以“埋怨摩西和亚伦”自然表达这种指向性，无须另译介词。
- source_word: כֹּל בְּנֵי יִשְׂרָאֵל
  choice: 以色列众人
  rationale: 这是现代汉语中自然的民族群体称谓，准确涵盖全体以色列人；脚注保留希伯来语字面的“以色列的众子”。
- source_word: כָּל הָעֵדָה
  choice: 全会众
  rationale: עֵדָה在《民数记》中常指聚集的以色列共同体。“全会众”简洁、庄重，并保留其群体和集会色彩。
- source_word: לוּ מַתְנוּ / לוּ מָתְנוּ
  choice: 要是早死……就好了／早死……也好
  rationale: לוּ引出与事实相反的愿望；“要是……就好了”和“……也好”以自然现代汉语传达未实现的过去愿望，“早死”明确其反事实的时间指向。
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: 在埃及地
  rationale: 保留原文“埃及之地”的完整地理表达，同时符合中文圣经语体。
- source_word: בַּמִּדְבָּר הַזֶּה
  choice: 在这旷野
  rationale: “旷野”准确反映以色列行程的荒野背景，也保留“这”所表达的眼前处境。
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל的性别化民族称谓
  choice: 正文译作“以色列众人”，脚注说明字面为“以色列的众子”
  alternative: 以色列的众子
  rationale: 该固定称谓在语境中指整个民族共同体。正文采用现代汉语自然且涵盖全体的表达，避免让读者误以为只指成年男性；脚注则公开其阳性复数的字面形式，不掩盖原文。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“要是早死……就好了”自然传达反事实哀愿；第二句用“要不……也好”承接原文的“或”，并保留两处死亡愿望的强烈重复。
