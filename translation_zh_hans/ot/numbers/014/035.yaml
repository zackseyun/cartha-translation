base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/035.yaml
  text: 'I[a], Yahweh, have spoken[b]. Surely I will do this to all this evil congregation who have gathered together against me: in this wilderness they will come to an end, and there they will die.'
translation:
  language: zh_hans
  text: “我，雅威，已经说了：我必[b]这样处置这整个邪恶的会众，就是那些聚集起来反对我的人；他们必在这旷野灭绝，也必死在那里。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 这里译作“必”的希伯来语惯用语，字面是“若不”，用于誓言中表达强烈的确定性。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: 雅威
  rationale: 以常见的现代汉语音译保留上帝向以色列启示的专名，不以“主”这一称号代替。
- source_word: דִּבַּרְתִּי
  choice: 已经说了
  rationale: 完成式表示宣告已经发出，并在当前具有确定效力；此译也保留神圣宣告的庄严语气。
- source_word: אִם לֹא
  choice: 必
  rationale: 该短语在誓言语境中不是未决条件，而是表达强烈确定性的惯用语；汉语用“必”自然地传达其郑重断言。
- source_word: זֹאת אֶעֱשֶׂה
  choice: 这样对待
  rationale: “这样”保留指示词的回指作用；结合宾语“会众”，用“对待”比直译“做这事给……”更符合现代汉语。
- source_word: הָעֵדָה
  choice: 会众
  rationale: 该词指作为整体聚集的以色列群体；“会众”兼顾共同体意义与本句正式的审判语气。
- source_word: הָרָעָה
  choice: 邪恶的
  rationale: 这里是上帝对悖逆群体的道德判断，不只是指其处境恶劣或令人不快。
- source_word: הַנּוֹעָדִים עָלַי
  choice: 聚集起来反对我的这些人
  rationale: 保留分词所表达的集体聚集行动，也明确介词在此处所带的敌对含义。
- source_word: בַּמִּדְבָּר הַזֶּה
  choice: 在这旷野
  rationale: “旷野”准确表达五经叙事中的地理环境，并保留原文指示词“这”。
- source_word: יִתַּמּוּ
  choice: 灭尽
  rationale: 该动词表示达到终结、完全消亡；“灭尽”符合审判语境，同时仍与随后明确的“死”保持两个并列动作。
- source_word: וְשָׁם יָמֻתוּ
  choice: 也必死在那里
  rationale: 保留“在那里”的强调，回指旷野为审判发生之处，并维持与前一分句的平行关系。
theological_decisions:
- issue: 誓言式短语 אִם לֹא 的表达
  choice: 译作强调确定性的“必”
  alternative: 按字面译作“若不”或“如果不”
  rationale: 此处是希伯来语誓言惯用式，功能是郑重确认上帝必定施行所说的事，并非留下一个未决条件。
- issue: 以 עֵדָה 对以色列群体的称呼
  choice: 译作“会众”
  alternative: 译作“群体”或“集会”
  rationale: 原文把受审判者视为聚集的整体；“会众”保留正式的共同体含义，但不特意引入后世教会制度的观念。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“我—雅威—”用破折号凸显说话者的自我宣告；后半句保留“灭尽／死在那里”的平行递进，避免把两个希伯来语动词合并。
