  text: וַ/תִּשָּׂא֙ כָּל הָ֣/עֵדָ֔ה וַֽ/יִּתְּנ֖וּ אֶת קוֹלָ֑/ם וַ/יִּבְכּ֥וּ הָ/עָ֖ם בַּ/לַּ֥יְלָה הַ/הֽוּא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/001.yaml
  text: Then all the congregation raised their voices and cried out[a], and the people wept that night.
translation:
  language: zh_hans
  text: 于是，全会众高声呼喊[a]，百姓在那一夜哭泣。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译近似“举起〔声音〕……发出他们的声音”，是指众人放声呼喊的惯用表达。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּשָּׂא ... וַיִּתְּנוּ אֶת־קוֹלָם
  choice: 高声呼喊
  rationale: 原文直译近似“举起〔声音〕……发出他们的声音”，是表示众人放声呼喊的希伯来语表达。译作“高声呼喊”既传达音量和群体哀号，也符合现代汉语习惯。
- source_word: כָּל הָעֵדָה
  choice: 全会众
  rationale: עֵדָה 指聚集成群体的以色列会众；“全会众”保留 כָּל 的整体含义，并采用现代中文圣经语境中清楚而庄重的称呼。
- source_word: הָעָם
  choice: 百姓
  rationale: 保留原文从“会众”转用“百姓”的措辞变化，不把两个群体称谓抹平。
- source_word: וַיִּבְכּוּ
  choice: 哭泣
  rationale: בכה 表示流泪哀哭；“哭泣”可与前面的高声呼喊区分，同时保持庄重自然。
- source_word: בַּלַּיְלָה הַהוּא
  choice: 在那一夜
  rationale: 准确表达“在那夜”的时间范围，不译成“哭了一整夜”，以免添加原文未明确表达的持续整夜之意。
theological_decisions: []
