  text: כִּי֩ הָ/עֲמָלֵקִ֨י וְ/הַ/כְּנַעֲנִ֥י שָׁם֙ לִ/פְנֵי/כֶ֔ם וּ/נְפַלְתֶּ֖ם בֶּ/חָ֑רֶב כִּֽי עַל כֵּ֤ן שַׁבְתֶּם֙ מֵ/אַחֲרֵ֣י יְהוָ֔ה וְ/לֹא יִהְיֶ֥ה יְהוָ֖ה עִמָּ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/043.yaml
  text: For the Amalekites and the Canaanites are there before you, and you will fall by the sword, because you have turned back from following Yahweh, and Yahweh will not be with you.
translation:
  language: zh_hans
  text: 因为亚玛力人和迦南人就在那里，在你们前面；你们必倒在刀下。正因为你们已经转身，不再跟随雅威，雅威必不与你们同在。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 句首连词承接上一节，说明警告的理由；现代汉语用“因为”自然表达这一解释性、因果性的关系。
- source_word: הָעֲמָלֵקִי וְהַכְּנַעֲנִי
  choice: 亚玛力人和迦南人
  rationale: 两个形态上的单数族名都作集合名词使用，汉语以“……人”自然指整个族群。
- source_word: שָׁם לִפְנֵיכֶם
  choice: 就在那里，在你们前面
  rationale: 同时保留“在那里”的方位指示和“在你们前面”的空间关系；“就”使警告语气在汉语中更自然。
- source_word: וּנְפַלְתֶּם בֶּחָרֶב
  choice: 你们必倒在刀下
  rationale: 保留 נפל“倒下”的战场意象，并用汉语惯用语“倒在刀下”表达因兵刃而败亡。
- source_word: כִּי עַל כֵּן
  choice: 正因为
  rationale: 该组合引出将要败亡的根本原因；“正因为”既传达因果，也体现原文 עַל כֵּן 的强调意味。
- source_word: שַׁבְתֶּם מֵאַחֲרֵי יְהוָה
  choice: 你们已经转身，不再跟随雅威
  rationale: “转身”保留 שׁוב 的回转动作，“不再跟随”则保留 מֵאַחֲרֵי 所含从跟随者位置退离的意象。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见音译呈现四字神名，而不以“主”这一称号替代。
- source_word: וְלֹא יִהְיֶה יְהוָה עִמָּכֶם
  choice: 雅威必不与你们同在
  rationale: 直译其将来否定意义，并保留“同在”这一重要的神圣临在表达。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；采用“雅威”是按较可能的读音作现代汉语音译，避免以称号取代专名。
- issue: “转身离开跟随雅威”的关系意象
  choice: 转身，不再跟随雅威
  alternative: 背离雅威
  rationale: 较完整地保存原文“从跟随……之后转回”的空间及盟约跟随意象，不把它压缩成较抽象的“背离”。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“倒在刀下”自然传达战场死亡；分为两句以清晰呈现外在危险及其盟约性原因，同时保留原文连续警告的力度。
