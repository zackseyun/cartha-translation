source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יְהוָ֔ה סָלַ֖חְתִּי כִּ/דְבָרֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/020.yaml
  text: And Yahweh said[a], “I have forgiven, according to your word.”
translation:
  language: zh_hans
  text: 耶和华说：“我照你的话赦免了[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我照你所说的宽恕了。”
    reason: 词汇与句式的可行替代译法：סלח 可译“赦免”或“宽恕”，כדברך 也可表达为“照你所说的”。
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: 前缀式叙事形式推进叙事；中文在上下文中无需机械补出“于是”或“又”，直接译为“说”自然且不额外限定时序关系。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 这是四字神名 יהוה；采用现代中文圣经读者熟悉的专名“耶和华”，不以称号“主”替代。
- source_word: סָלַחְתִּי
  choice: 我……赦免了
  rationale: סלח 表示赦免、宽恕；完成式在此表达已经作出的赦免决定，以“赦免了”自然呈现其完成性。
- source_word: כִּדְבָרֶךָ
  choice: 照你的话
  rationale: 贴近“按着你的话”的结构，并自然指向摩西此前的代求；“照你的话”在现代汉语中简洁通顺。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用以色列之神的专名。中文正文采用长期通行、普通读者易识别的“耶和华”，同时保留其为专名而非“主”这一称号的性质。
- issue: 赦免的范围是否在本节中加以限定
  choice: 仅译“我照你的话赦免了”
  alternative: 补译为“我赦免了他们”或说明赦免并不取消刑罚
  rationale: 原文未明说宾语，也未在本句解释随后审判与赦免的关系；正文保留这种简洁和神学张力，不把上下文解释增添进本节。
translation_notes:
  register: 采用现代、庄重而简明的普通话。“照你的话”既保留原文结构，又符合自然中文；不补出原文省略的赦免对象。
