base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/010.yaml
  text: But all the congregation said to stone them with stones[a], and the glory of Yahweh appeared in the tent of meeting to all the sons of Israel.
translation:
  language: zh_hans
  text: 全会众却说，要用石头砸他们；雅威的荣光在会幕中向全体以色列人显现。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כָּל הָעֵדָה
  choice: 全会众
  rationale: עֵדָה指聚集成群体的以色列会众；“全会众”简洁保留其整体性和正式语感。
- source_word: לִרְגּוֹם אֹתָם בָּאֲבָנִים
  choice: 要用石头砸他们
  rationale: רגם意为用石头击打、施行石刑；译文保留具体手段和代词所指，不添入原文未明说的“打死”，也不以约书亚和迦勒的名字替换“他们”。
- source_word: כְבוֹד יְהוָה
  choice: 雅威的荣光
  rationale: כָּבוֹד在此指神可见的荣耀彰显；“荣光”符合现代中文宗教语域，也保留显现的场景。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语音译呈现四字神名，而不以“主”这一称号替代。
- source_word: נִרְאָה
  choice: 显现
  rationale: ראה的Niphal形在此表示变得可见、显露出来；“显现”自然贴合神圣显现的语境。
- source_word: בְּאֹהֶל מוֹעֵד
  choice: 在会幕中
  rationale: “会幕”是 אֹהֶל מוֹעֵד 的通行中文名称；“在……中”对应介词 בְּ，并保留显现地点。
- source_word: אֶל כָּל בְּנֵי יִשְׂרָאֵל
  choice: 向全体以色列人
  rationale: בְּנֵי יִשְׂרָאֵל在此是民族共同体的固定称呼，不专指男性后裔；“全体以色列人”准确、自然，并保留 אֶל 所表达的显现对象。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用神的专名。译作“雅威”保留专名性质并较贴近常见的学术复原读音；不以称号“主”代替，也不把文本所说的神名化为解释性表达。
- issue: בְּנֵי יִשְׂרָאֵל 是否按字面译作“以色列的众子”
  choice: 全体以色列人
  alternative: 以色列的众子
  rationale: 该短语在此是全民族的惯用称谓，且前有 כָּל；译成“全体以色列人”传达其群体指向，避免现代读者误以为显现只面向男性。
- issue: רגם 是否明确译出死亡结果
  choice: 用石头砸他们
  alternative: 用石头打死他们
  rationale: 石刑语境通常含有致死意图，但本句没有另用“杀死”等词明说结果；正文保留这一含蓄程度，不额外明确死亡结局。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“可是”承接上文并表达会众对劝告的强烈反转；“就在这时”自然呈现第二个 וַ 所引出的紧接事件，不把两件事解释为更具体的因果关系。
