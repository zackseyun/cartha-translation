  text: מִ/בִּלְתִּ֞י יְכֹ֣לֶת יְהוָ֗ה לְ/הָבִיא֙ אֶת הָ/עָ֣ם הַ/זֶּ֔ה אֶל הָ/אָ֖רֶץ אֲשֶׁר נִשְׁבַּ֣ע לָ/הֶ֑ם וַ/יִּשְׁחָטֵ֖/ם בַּ/מִּדְבָּֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/016.yaml
  text: Because Yahweh was not able to bring this people into the land that he swore to them[a], he slaughtered them in the wilderness.
translation:
  language: zh_hans
  text: “耶和华不能把这百姓带进他向他们起誓应许的那地[a]，所以在旷野杀戮了他们。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他起誓要赐给他们的那地”。
    reason: 原文直译为“他向他们起誓的”；誓言所涉及的是这地，具体“赐给”的内容由上下文补足。
lexical_decisions:
- source_word: מִבִּלְתִּי יְכֹלֶת
  choice: 不能
  rationale: 这一结构表达能力上的缺乏，并在上下文中引出列国可能作出的解释。译作“不能”自然、直接，同时保留这项指控的尖锐意味。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代简体中文圣经传统中最通行的神名译法，明确其为专名而非一般称号。
- source_word: לְהָבִיא
  choice: 带进
  rationale: בוא 的使役式表示使人进入；“带进”同时传达带领和进入目的地的意思。
- source_word: הָעָם הַזֶּה
  choice: 这百姓
  rationale: 保留 עָם 的集合性单数和经文中的指示语气；“百姓”在现代中文圣经语体中自然庄重。
- source_word: אֶל הָאָרֶץ
  choice: 那地
  rationale: 在“带进”的支配下清楚表达进入该地；定冠词结合上下文自然译作“那地”。
- source_word: אֲשֶׁר נִשְׁבַּע לָהֶם
  choice: 他向他们起誓应许的
  rationale: 原文直译是“他向他们起誓的”。中文单说“起誓那地”不完整，因此用“起誓应许”表达誓言所涉及的土地，同时不把“赐给”直接写入正文。
- source_word: וַיִּשְׁחָטֵם
  choice: 把他们杀了
  rationale: שׁחט 可指宰杀或杀戮；此处宾语是百姓。“杀了”准确、自然，并避免“宰了他们”在现代中文中可能产生不合宜的口语色彩。
- source_word: בַּמִּדְבָּר
  choice: 在旷野
  rationale: “旷野”是摩西五经语境中 מִדְבָּר 的准确且通行译法。
theological_decisions:
- issue: 列国对耶和华能力的指控
  choice: “耶和华不能……”
  alternative: “因耶和华没有能力……”
  rationale: 本句延续上文摩西所设想的列国言论，并非叙述者对神能力的直接断言。译文保留这项指控本身，不以解释性措辞消解其神学张力。
- issue: 誓言中是否明说“赐给”
  choice: “向他们起誓应许的那地”
  alternative: “起誓要赐给他们的那地”
  rationale: “赐给”符合上下文所暗含的内容，但本节原文没有相应动词。正文用“起誓应许”保持中文通顺，脚注给出较明确的补足译法。
translation_notes:
  register: 采用现代、庄重而易懂的普通话书面语。全句置于引号内，以提示这是上一节所引出的列国言论；保留“不能”的强烈指控，并以“杀了”传达 שׁחט 的严厉语气而不过度口语化。
