base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/003.yaml
  text: And why is Yahweh bringing us into this land to fall by the sword? Our wives and our little ones will become plunder[a]. Would it not be better for us to return to Egypt?
translation:
  language: zh_hans
  text: 雅威为什么要领我们进入这地，使我们倒在刀剑之下呢？我们的妻子和幼小的孩子将成为掠物[a]。我们回埃及去，岂不更好吗？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“战利品”；希伯来语指被敌人夺取的掠物。
    reason: 保留בַּז在战争语境中“掠物、战利品”的词义，并避免将其限定为“被掳”。
lexical_decisions:
- source_word: וְלָמָה
  choice: 为什么
  rationale: 承接上文继续表达百姓的抱怨；现代汉语中无需机械译出句首连接词，语流仍然清楚。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来语四字神名作音译，以保留经文所用的上帝之名，而不以称号替代。
- source_word: מֵבִיא אֹתָנוּ אֶל הָאָרֶץ הַזֹּאת
  choice: 要领我们进入这地
  rationale: 分词在抱怨中表示正在进行或即将实现的行动；“要领我们进入”兼顾这一语气和自然汉语表达。
- source_word: לִנְפֹּל בַּחֶרֶב
  choice: 让我们倒在刀剑之下
  rationale: 保留希伯来语在战争语境中表示被杀的惯用说法，同时现代读者也能理解。
- source_word: נָשֵׁינוּ וְטַפֵּנוּ
  choice: 我们的妻子和年幼的儿女
  rationale: נָשִׁים在家庭语境中指妻子；טַף尤指幼小的孩子或家中弱小者，“年幼的儿女”突出了其脆弱处境。
- source_word: יִהְיוּ לָבַז
  choice: 必被掳去
  rationale: בַּז指敌人夺取的掠物或战利品；正文采用自然且符合战争语境的表达，并以脚注保留较直译的词义。
- source_word: הֲלוֹא טוֹב לָנוּ שׁוּב מִצְרָיְמָה
  choice: 我们回埃及去，岂不更好吗
  rationale: 否定疑问形式表达期待肯定回答的反问；“岂不更好吗”准确传达其劝诱和抱怨语气。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；采用较贴近学界常见重构读音的“雅威”，保留其作为专名的性质。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“倒在刀剑之下”保留原文战争惯用语；“年幼的儿女”凸显 טַף 所指的弱小孩子；反问句以“岂不更好吗”呈现百姓执意返回埃及的语气。
