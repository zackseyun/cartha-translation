  text: And they said to one another[b][a], “Let us appoint a leader and return to Egypt.”
translation:
  language: zh_hans
  text: 他们彼此说[a]：“我们立一个首领[b]，回埃及去吧！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 字面意思是“各人对自己的弟兄”；这是表示众人互相说话的希伯来语习惯表达。
    reason: lexical_alternative
  - marker: b
    text: 字面意思是“立一个头”；这里的“头”指被立在众人之上的人，也就是首领。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: 他们说
  rationale: 叙事性连续式推动情节；中文按自然叙事表达为“他们说”，无需机械译出连接词。
- source_word: אִישׁ אֶל אָחִיו
  choice: 彼此
  rationale: 字面为“各人对自己的弟兄”，在这里是相互代词式的希伯来习语；“彼此”简洁自然，也不误将阳性单数形式理解为特别强调男性。
- source_word: נִתְּנָה רֹאשׁ
  choice: 我们立一个首领
  rationale: נִתְּנָה 是第一人称复数鼓励式，与“头”连用，表示设立一人统领众人；“立一个首领”既保留设立之意，也符合现代中文。
- source_word: וְנָשׁוּבָה
  choice: 回……去吧
  rationale: 该词同样是第一人称复数鼓励式；句末“吧”自然表达共同提议的语气，并与前面的“我们立”共同涵盖两个并列行动。
- source_word: מִצְרָיְמָה
  choice: 埃及
  rationale: 词尾表示朝向埃及的运动；在“回……去”结构中，方向已清楚表达。
