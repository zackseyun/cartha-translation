  text: אֱמֹ֣ר אֲלֵ/הֶ֗ם חַי אָ֨נִי֙ נְאֻם יְהוָ֔ה אִם לֹ֕א כַּ/אֲשֶׁ֥ר דִּבַּרְתֶּ֖ם בְּ/אָזְנָ֑/י כֵּ֖ן אֶֽעֱשֶׂ֥ה לָ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/028.yaml
  text: Say to them, ‘As I live, declares the LORD, surely just as you have spoken in my hearing, so I will do to you.’
translation:
  language: zh_hans
  text: 你要对他们说：‘我指着我的永生起誓——这是耶和华的宣告——你们怎样说给我听，我必照样待你们。’
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חַי אָנִי
  choice: 我指着我的永生起誓
  rationale: 这是希伯来语誓言惯用语；译出起誓含义，比直译“我活着”更符合现代汉语，同时保留上帝以自己的永生作保证的力度。
- source_word: נְאֻם יְהוָה
  choice: 这是耶和华的宣告
  rationale: נְאֻם标示庄严的神谕宣告；采用“耶和华”呈现专名יהוה，与普通称号“主”相区分。
- source_word: אִם לֹא
  choice: （由誓言句式表达，未另译）
  rationale: 在誓言结构中，אִם לֹא具有强烈肯定作用，相当于“我必”；中文以“起誓”和后句“必”自然传达其确定语气。
- source_word: כַּאֲשֶׁר דִּבַּרְתֶּם בְּאָזְנָי
  choice: 你们怎样说给我听
  rationale: 保留“在我耳中说”的听觉意象之核心意义，并以自然现代汉语表达。
- source_word: כֵּן אֶעֱשֶׂה לָכֶם
  choice: 我必照样待你们
  rationale: 准确表达对应性的审判：百姓所说的话将按其内容临到他们；“待你们”自然呈现עשה ל的关系结构。
theological_decisions:
- issue: יהוה的译法
  choice: 耶和华
  alternative: 上主／主
  rationale: 原文使用以色列上帝的专名，而非אֲדֹנָי；译作“耶和华”可保留专名性质，不把它化为称号。
- issue: אִם לֹא在神圣誓言中的效力
  choice: 以“指着我的永生起誓……必”表达确定性
  alternative: 直译为“如果不……”或另加“确实”
  rationale: 该结构不是开放条件句，而是省略咒诅后果的誓言公式；译文应传达不可更改的保证，同时不额外补入原文未明说的咒诅内容。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。破折号把“这是耶和华的宣告”作为插入式神谕公式标出；整句保留誓言的严肃性和前后对应结构。
