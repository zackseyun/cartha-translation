  text: וְ/הֵמַתָּ֛ה אֶת הָ/עָ֥ם הַ/זֶּ֖ה כְּ/אִ֣ישׁ אֶחָ֑ד וְ/אָֽמְרוּ֙ הַ/גּוֹיִ֔ם אֲשֶׁר שָׁמְע֥וּ אֶֽת שִׁמְעֲ/ךָ֖ לֵ/אמֹֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/015.yaml
  text: And if you kill this people as one man[a], then the nations that have heard your report will say[b],
translation:
  language: zh_hans
  text: 如果你把这百姓全都杀死，如同杀一个人一样[a]，那么，听见有关你的消息的列国就会说[b]：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译“如同一个人”；这是一个习语，指全体一同遭灭，或一下子全被杀死。
    reason: lexical_alternative
  - marker: b
    text: 或译：“听见你的消息的列国”。这里的“消息”也可指名声。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵמַתָּה
  choice: 如果你……杀
  rationale: הֵמַתָּה 是 מות 的使役形，意为“使其死亡、杀死”。连接词 וְ 本身不是条件词，但本句承接上文未完的条件语境，汉语补出“如果”较为自然。
- source_word: הָעָם הַזֶּה
  choice: 这百姓
  rationale: עָם 在此集合性地指以色列民；“这百姓”保留指示语气，也符合现代中文圣经语体。
- source_word: כְּאִישׁ אֶחָד
  choice: 像一个人一样
  rationale: 直译保留希伯来语“如同一个人”的修辞形式；在此是整体性表达，指全体遭遇同一结局。脚注说明其习语含义。
- source_word: הַגּוֹיִם
  choice: 列国
  rationale: גּוֹיִם 指以色列以外的各国；“列国”简洁、庄重，又避免引入较后期的“外邦人”语义联想。
- source_word: אֲשֶׁר שָׁמְעוּ אֶת שִׁמְעֲךָ
  choice: 听见关于你的传闻的
  rationale: שֵׁמַע 可指消息、传闻或名声。译作“关于你的传闻”自然地表达传闻以耶和华及其作为为内容，同时保留“你的传闻”这一较形式对应的译法作为脚注备选。
- source_word: לֵאמֹר
  choice: 就会说：
  rationale: 该不定式引出下一节列国所说的话；中文用“说：”并加冒号自然承接直接引语。
theological_decisions:
- issue: 男性单数名词构成的整体性习语
  choice: 像一个人一样
  alternative: 一举把他们全都杀死
  rationale: אִישׁ 是阳性单数，但该短语并非专指男性，而是表达全体如一、共同遭灭。正文保留原文形象，脚注交代其整体性含义，不将习语中的性别形式扩展为神学命题。
- issue: שִׁמְעֲךָ 所指的消息或名声
  choice: 关于你的传闻
  alternative: 你的名声
  rationale: 该词在语境中既可能表示有关耶和华的消息，也可引申为他的声名。采用“关于你的传闻”保留较宽语义，不把它单一确定为“名声”。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“这百姓”“列国”保持经文的群体与国际视角；正文保留原文习语，并借脚注澄清。末尾冒号表明本句在下一节继续。
