base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/013.yaml
  text: But Moses said to Yahweh[a], “Then the Egyptians will hear, for by your power you brought up this people from among them.”
translation:
  language: zh_hans
  text: 摩西却对雅威说：“那么，埃及人就会听说：你曾用你的大能把这百姓从他们中间领上来。[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“埃及人已经听说：你曾用你的大能把这百姓从他们中间领上来。”这里的希伯来语动词既可理解为过去发生的事，也可理解为摩西恳求中将会产生的结果；正文依照上下文采用前瞻的意思。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 摩西却……说
  rationale: 该形式推进叙事；结合上节雅威宣告审判的语境，用“却”自然表达摩西提出反驳或代求的转折。
- source_word: יְהוָה
  choice: 雅威
  rationale: 直接音译四字神名，保留其作为以色列之神专名的性质，不以称号替代。
- source_word: וְשָׁמְעוּ מִצְרַיִם
  choice: 这样，埃及人就会听见
  rationale: 完成式在摩西的论证中可理解为预期的结果；“这样……就会”以自然汉语呈现其前瞻和承接关系。“埃及人”比地名“埃及”更适合作“听见”的主体。
- source_word: כִּי
  choice: 因为
  rationale: 保留其解释或说明理由的功能，同时不排除它与“听见”所听内容之间较紧密的联系。
- source_word: הֶעֱלִיתָ
  choice: 领上来
  rationale: 保留 עלה 使役式“使上去、领上来”的基本意象；在出埃及语境中自然指把百姓从埃及带出来。
- source_word: בְכֹחֲךָ
  choice: 用大能
  rationale: 介词 בְּ 表示手段；“用大能”简洁而庄重，突出雅威施行拯救的力量。
- source_word: הָעָם הַזֶּה
  choice: 这百姓
  rationale: 准确呈现单数集合名词及指示词，符合现代中文圣经语体。
- source_word: מִקִּרְבּוֹ
  choice: 从他们中间
  rationale: 单数后缀在此指作为集合整体的埃及；中文按所指的埃及人用复数“他们”表达更自然。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文使用四字神名而非称号；“雅威”较直接地呈现通行学术重构的读音，并保留神名性质。
- issue: וְשָׁמְעוּ 的时态与论证方向
  choice: 埃及人就会听见
  alternative: 埃及人已经听见
  rationale: 希伯来语形式本身可作过去或在语境中表达将来结果；上下文是摩西陈述若百姓被灭将引发的列国反应，因此正文采用前瞻理解，同时以脚注保留过去时读法。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“领上来”有意保留希伯来语的方向性表达；脚注标记置于整句引语末尾，以涵盖主要的时态替代读法。
