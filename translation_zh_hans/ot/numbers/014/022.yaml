source:
  edition: WLC
  text: כִּ֣י כָל הָ/אֲנָשִׁ֗ים הָ/רֹאִ֤ים אֶת כְּבֹדִ/י֙ וְ/אֶת אֹ֣תֹתַ֔/י אֲשֶׁר עָשִׂ֥יתִי בְ/מִצְרַ֖יִם וּ/בַ/מִּדְבָּ֑ר וַ/יְנַסּ֣וּ אֹתִ֗/י זֶ֚ה עֶ֣שֶׂר פְּעָמִ֔ים וְ/לֹ֥א שָׁמְע֖וּ בְּ/קוֹלִֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/022.yaml
  text: For all the men who have seen my glory and my signs that I did in Egypt and in the wilderness[a], and have tested me these ten times and have not listened to my voice—
translation:
  language: zh_hans
  text: 因为所有看见过我的荣耀和我在埃及及旷野所行神迹的人，已经十次试探我，又不听从我的话[a]——
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“没有听我的声音”；这个希伯来语习语也有“不听从、不顺服”的意思。
    reason: 保留原文听觉意象及其顺服层面的词义选择。
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接前文耶和华起誓所宣告的审判，说明其缘由；中文以“因为”自然体现解释关系。
- source_word: כָל הָאֲנָשִׁים
  choice: 所有这些人
  rationale: אֲנָשִׁים 在本叙事中指受审判的那一代成年男子；“这些人”既保留具体所指，也比生硬的“所有男人”更符合现代汉语语境。
- source_word: הָרֹאִים
  choice: 虽然看见了
  rationale: 分词描述这些人的既有经历；“虽然”将原文各并列事实之间蕴含的让步张力自然呈现出来，而不改变命题内容。
- source_word: כְּבֹדִי
  choice: 我的荣耀
  rationale: 保留 כָּבוֹד 在神显现语境中的惯用、庄重表达。
- source_word: אֹתֹתַי
  choice: 我的神迹
  rationale: אוֹת 指具有标志和见证作用的超常作为；现代中文圣经语境中“神迹”自然易懂，并未仅强调奇观。
- source_word: אֲשֶׁר עָשִׂיתִי
  choice: 我……所行的
  rationale: “所行的”准确对应 עשה，也符合中文谈论神之作为的庄重表达。
- source_word: בְמִצְרַיִם וּבַמִּדְבָּר
  choice: 在埃及和旷野
  rationale: “旷野”是 מִדְבָּר 在出埃及叙事中的准确、通行译法。
- source_word: וַיְנַסּוּ אֹתִי
  choice: 试探我
  rationale: נסה 在此不是中性的检验，而是人以悖逆行为考验神；“试探我”保留其负面伦理意味。
- source_word: זֶה עֶשֶׂר פְּעָמִים
  choice: 这十次
  rationale: 保留 זֶה 的指示和强调作用；“这十次”在中文中简洁自然。
- source_word: וְלֹא שָׁמְעוּ בְּקוֹלִי
  choice: 不听从我的话
  rationale: שׁמע בקול 是听而遵从的习语；“听从我的话”兼顾听闻意象与顺服含义，较“听我的声音”更自然。
theological_decisions:
- issue: 神以第一人称自述
  choice: 保留“我的荣耀”“我……所行的神迹”“我的话”
  alternative: 改写为第三人称或加入神学解释
  rationale: 原文是神直接发言，应保留其直接性和审判的庄严感，不作超出经文的教义扩展。
- issue: הָאֲנָשִׁים 的性别及所指
  choice: 所有这些人
  alternative: 所有男人／所有百姓
  rationale: 上下文限定其为受审判的成年一代；中文“这些人”不把范围扩大为全体百姓，也避免“所有男人”在现代汉语中的别扭感。
- issue: 看见神迹与悖逆之间的张力
  choice: 以“虽然……却仍……”表达
  alternative: 完全按形式并列为“看见了……又试探……”
  rationale: 原文虽由连接词串联，语境却明确构成让步反差；中文显化该关系有助于准确传达责备力度，但不额外添加行为或动机。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。经文在句末以破折号收住，因为本句语法和宣判内容延续至下一节。
