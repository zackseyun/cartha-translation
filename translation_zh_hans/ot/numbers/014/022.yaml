revisions:
- from: 因为所有这些人虽然看见了我的荣耀，也看见了我在埃及和旷野所行的神迹，却仍这十次试探我，不听从我的话[a]——
  to: 因为所有看见过我的荣耀和我在埃及及旷野所行神迹的人，已经十次试探我，又不听从我的话[a]——
  rationale: 删除“虽然……却仍……”及“这些”，以免加入原文未明说的让步和指示意义；其余措辞维持原有的现代、庄重中文，并保留对“听从”的习语说明和跨节破折号。
