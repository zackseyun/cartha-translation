  text: עַד מָתַ֗י לָ/עֵדָ֤ה הָֽ/רָעָה֙ הַ/זֹּ֔את אֲשֶׁ֛ר הֵ֥מָּה מַלִּינִ֖ים עָלָ֑/י אֶת תְּלֻנּ֞וֹת בְּנֵ֣י יִשְׂרָאֵ֗ל אֲשֶׁ֨ר הֵ֧מָּה מַלִּינִ֛ים עָלַ֖/י שָׁמָֽעְתִּי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/027.yaml
  text: How long shall this evil congregation grumble against me? I have heard the complaints of the sons of Israel[b][a], which they are grumbling against me.
translation:
  language: zh_hans
  text: 这邪恶的会众[a]还要向我发怨言到什么时候呢？以色列人向我所发的怨言，我已经听见了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “会众”也可译作“群体”或“共同体”。
    reason: lexical_alternative
lexical_decisions:
- source_word: עַד מָתַי
  choice: 到什么时候
  rationale: 这是表达不满与责问的惯用时间问句；结合“还要”，既符合现代汉语，也保留原文强烈的诘问语气。
- source_word: לָעֵדָה
  choice: 会众
  rationale: עֵדָה在此指以色列这个共同体；“会众”简洁庄重，并以脚注注明“群体、会集的人”等可能译法。
- source_word: הָרָעָה הַזֹּאת
  choice: 这邪恶的
  rationale: רָעָה在这里带有上帝对其悖逆行为的道德评断；“邪恶”比“坏”更准确地保留其严厉程度。
- source_word: מַלִּינִים
  choice: 发怨言
  rationale: 该词在旷野叙事中指带有反抗意味的抱怨；“发怨言”自然、清楚，也能与名词תְּלֻנּוֹת形成词义呼应。
- source_word: עָלַי
  choice: 向我
  rationale: 此处表示怨言所针对的对象。“向我发怨言”在现代汉语中自然，并保留其敌对指向。
- source_word: תְּלֻנּוֹת
  choice: 怨言
  rationale: 该名词指公开表达的不满；“怨言”既保持庄重语体，也与前面的“发怨言”重现原文词根重复的修辞效果。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 这是现代汉语对该群体名称最自然、准确的表达；在本语境中指以色列全体民众，并非只强调男性后代。
- source_word: שָׁמָעְתִּי
  choice: 我已经听见了
  rationale: 完成式在此强调上帝确已听见他们持续的怨言，并将据此回应；“已经……了”清楚表达这一结果状态。
theological_decisions:
- issue: מַלִּינִים的使役词形与语境意义
  choice: 译为“发怨言”
  alternative: “使人向我发怨言”
  rationale: 该词虽为使役词干形式，但在旷野叙事中常按“抱怨、发怨言”理解；上下文也明确把怨言归于以色列人。采用惯用语义可避免凭空补出另一个被使唤发怨言的对象。
- issue: בְּנֵי יִשְׂרָאֵל的群体指称
  choice: 译为“以色列人”
  alternative: “以色列的子孙”
  rationale: 原短语是希伯来语中对以色列民族的常规称呼。此处关乎全体会众的悖逆，不宜把语法上的阳性形式解释为仅指男性；“以色列人”准确保留其民族群体意义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“还要……到什么时候呢”传达原文的责问和厌烦语气；两次使用“发怨言／怨言”保留原文动词与名词的重复。
