  text: וְ/אוּלָ֖ם חַי אָ֑נִי וְ/יִמָּלֵ֥א כְבוֹד יְהוָ֖ה אֶת כָּל הָ/אָֽרֶץ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/021.yaml
  text: But as I live[a], the glory of Yahweh will fill all the earth.
translation:
  language: zh_hans
  text: 然而，我凭着我的生命起誓：耶和华的荣耀必充满全地[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “全地”也可译作“全境”；希伯来文 אֶרֶץ 既可指整个大地，也可指某一片土地。
    reason: 保留原词可能具有普世或较局部范围的词义歧义。
lexical_decisions:
- source_word: וְאוּלָם
  choice: 然而
  rationale: 表达对上文的强烈转折，也保留庄重语气；现代汉语中自然清楚。
- source_word: חַי אָ֑נִי
  choice: 我指着我的永生起誓
  rationale: 这是上帝以自己的生命起誓的固定表达。直译“我活着”在现代汉语中不易显出誓言功能，因此采用明确而庄重的习语化译法。
- source_word: וְיִמָּלֵא
  choice: 必充满
  rationale: 该形式表达将要实现的结果；结合后面的宾语标记 אֶת，可自然理解为耶和华的荣耀遍及全地。“必”也承接誓言的确定语气。
- source_word: כְבוֹד
  choice: 荣耀
  rationale: 在指耶和华时，“荣耀”既是通行译法，也能涵盖其尊荣、威严和彰显的临在。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 直接音译希伯来文神名，在中文圣经传统中辨识度高，并与普通名词“主”有所区分。
- source_word: אֶת כָּל הָאָרֶץ
  choice: 全地
  rationale: 简洁保留 כָּל 的总体范围；אֶרֶץ 在此可指普世“大地”，也可指较局部的“土地／境内”，故在脚注中保留词义范围。
theological_decisions:
- issue: הָאָרֶץ 的范围
  choice: 正文译作“全地”，以普世范围为主要理解
  alternative: “全境”或“全境之地”，指较局部的地域
  rationale: 有关耶和华荣耀的庄严宣告较支持普世含义，但希伯来词 אֶרֶץ 本身也可指特定土地；正文不扩写为“全世界”，并用脚注保留局部理解。
- issue: חַי אָ֑נִי 的誓言性质
  choice: 明确译出“起誓”
  alternative: 较形式对应地译作“我活着”或“我既永远活着”
  rationale: 原文是神圣誓言公式。明确其言语功能可避免现代读者误解，同时不增添誓言内容。
- issue: וְיִמָּלֵא 的句法表达
  choice: 将“耶和华的荣耀”译为施事性主语：“必充满全地”
  alternative: 译作“全地必充满耶和华的荣耀”
  rationale: 原文把“耶和华的荣耀”置于动词之后，并以 אֶת 标示“全地”；所选表达较贴近这一句法关系。另一译法表达相近结果，但会重组主宾结构。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“然而”承接上文转折；冒号显明誓言公式与所宣告内容的关系。正文避免古奥的“我指着永生的我”，也不把“荣耀”解释性扩展为某一特定神学概念。
