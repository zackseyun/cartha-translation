  text: וּ/פִגְרֵי/כֶ֖ם אַתֶּ֑ם יִפְּל֖וּ בַּ/מִּדְבָּ֥ר הַ/זֶּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/032.yaml
  text: But as for you[a], your dead bodies will fall in this wilderness.
translation:
  language: zh_hans
  text: 至于你们，你们的尸首[a]必倒在这旷野里。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“尸体”或“死尸”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפִגְרֵיכֶם
  choice: 你们的尸首
  rationale: פֶּגֶר指死尸、尸首；“尸首”在现代汉语中庄重而鲜明，保留审判话语的沉重和具体性。句首连接词结合上下文的对比关系，译入“至于”。
- source_word: אַתֶּם
  choice: 至于你们
  rationale: 独立人称代词具有强调和对比作用；“至于你们”自然体现这一语用力量，同时保留后面的“你们的尸首”。
- source_word: יִפְּלוּ
  choice: 必倒
  rationale: נפל本义为“倒下”；在尸首作主语的语境中指倒毙。译作“必倒”既保留原文意象，也表达判语的确定性。
- source_word: בַּמִּדְבָּר הַזֶּה
  choice: 在这旷野里
  rationale: מִדְבָּר在民数记语境中通常译为“旷野”；指示词הַזֶּה明确指当前所在的这片旷野。
theological_decisions:
- issue: פִגְרֵיכֶם所呈现之审判的严厉和具体性
  choice: 你们的尸首
  alternative: 你们的尸体；你们的死尸
  rationale: 原文明确呈现这一代人将死在旷野的身体性后果。“尸首”保留其肃穆、刺耳的力度，却不额外加入侮辱性色彩。
- issue: יִפְּלוּ在审判宣告中的语气
  choice: 必倒
  alternative: 将倒下；要倒毙
  rationale: 未完成式在此为将来审判宣告。“必”传达其确定性；不直接译成“倒毙”，以免把动词本身的死亡含义说得比原文更满，因为死亡已由“尸首”清楚表达。
translation_notes:
  register: 采用现代、庄重、易懂的普通话。“至于你们”体现与上下文的对比强调；“尸首必倒”略带圣经叙事的凝重感，同时忠实保留原文中“尸首”与“倒下”的搭配。
