  text: אִם חָפֵ֥ץ בָּ֨/נוּ֙ יְהוָ֔ה וְ/הֵבִ֤יא אֹתָ֨/נוּ֙ אֶל הָ/אָ֣רֶץ הַ/זֹּ֔את וּ/נְתָנָ֖/הּ לָ֑/נוּ אֶ֕רֶץ אֲשֶׁר הִ֛וא זָבַ֥ת חָלָ֖ב וּ/דְבָֽשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/008.yaml
  text: If Yahweh delights in us[a], he will bring us into this land and give it to us—a land flowing with milk and honey.
translation:
  language: zh_hans
  text: 如果雅威喜悦我们[a]，他就会领我们进入这片土地，把它赐给我们；那是一片流奶与蜜之地。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“悦纳我们”或“恩待我们”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: 如果
  rationale: 引出真实的条件句，保留希伯来文所表达的条件性，不改写为确定意味较强的“既然”或“当……时”.
- source_word: חָפֵץ בָּנוּ
  choice: 喜悦我们
  rationale: חפץ ב־表示以某人为喜悦、对其满意或施以恩宠；“喜悦我们”保留其带有人格关系和情感色彩的含义。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语中常见的音译呈现四字神名，保留专名性质，不以头衔替代。
- source_word: וְהֵבִיא אֹתָנוּ אֶל הָאָרֶץ הַזֹּאת
  choice: 他就会领我们进入这片土地
  rationale: 连接词在条件句后引出结果；“进入”准确体现以色列人将要进入迦南的语境。
- source_word: וּנְתָנָהּ לָנוּ
  choice: 把它赐给我们
  rationale: 后缀所指为前述土地；“赐给”自然表达雅威作为赐予者，也保留 נתן 的基本给予义。
- source_word: אֶרֶץ אֲשֶׁר הִוא זָבַת חָלָב וּדְבָשׁ
  choice: 那是一片流奶与蜜之地
  rationale: 保留原文同位语式的再次说明，并沿用“流奶与蜜”这一描写土地丰饶的希伯来语意象。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；采用“雅威”以保留其专名身份，避免用称号替代。
- issue: חָפֵץ בָּנוּ 所表达的神圣喜悦或恩宠
  choice: 喜悦我们
  alternative: 悦纳我们；恩待我们
  rationale: 正文保留该词的情感和关系意味，同时不把它缩减为单纯施恩；脚注列出其可包含的悦纳与恩宠色彩。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“如果……就……”清楚呈现条件与结果；分号保留原文对这片土地的补充描述。
