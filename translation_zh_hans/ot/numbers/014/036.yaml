base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/036.yaml
  text: The men whom Moses sent to scout out the land returned and caused the whole congregation to grumble against him by bringing out a bad report about the land[a][b].
translation:
  language: zh_hans
  text: 摩西派去察看[a]那地的那些人回来后，散布贬损那地的报告[b]，使全会众都向他发怨言。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“窥探”。
    reason: תור既可指考察、察看，也可按侦察语境译为“窥探”。
  - marker: b
    text: 或译：“传出有关那地的坏报告”。原词可指带有贬损意味的负面传言或报告。
    reason: דבה兼有坏报告、恶评或毁谤性报告等语义色彩；“报告”较贴合本节的侦察汇报语境。
lexical_decisions:
- source_word: וְהָאֲנָשִׁים אֲשֶׁר שָׁלַח מֹשֶׁה
  choice: 摩西派去……的那些人
  rationale: 将希伯来语的连接词自然融入承接上文的句式，不另加表示时间的“现在”；关系从句按现代汉语语序前置。
- source_word: לָתוּר אֶת־הָאָרֶץ
  choice: 察看那地
  rationale: תור在此指为了解迦南地而进行的考察；“察看”自然、中性，也不把行动过度限定为秘密侦察。
- source_word: וַיָּשֻׁבוּ
  choice: 回来后
  rationale: 表达שוב的返回之意，并以“后”清楚连接随后发生的行动，符合现代汉语叙事习惯。
- source_word: וילונו עָלָיו אֶת כָּל־הָעֵדָה
  choice: 使全会众都向他发怨言
  rationale: 该结构在本句中具有使动意义：这些人的报告促使全会众向摩西发怨言。“发怨言”保留旷野叙事中反复出现的抱怨主题；“他”则保留原文代词形式。
- source_word: לְהוֹצִיא דִבָּה עַל־הָאָרֶץ
  choice: 散布贬损那地的消息
  rationale: הוציא在这里表示把消息传出、散布；דבה不只是中性的报告，而带有损害对象声誉的负面色彩。“贬损……的消息”兼顾这一语义和现代汉语的可懂度。
theological_decisions: []
