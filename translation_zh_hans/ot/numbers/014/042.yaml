source:
  edition: WLC
  text: אַֽל תַּעֲל֔וּ כִּ֛י אֵ֥ין יְהוָ֖ה בְּ/קִרְבְּ/כֶ֑ם וְ/לֹא֙ תִּנָּ֣גְפ֔וּ לִ/פְנֵ֖י אֹיְבֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/042.yaml
  text: Do not go up[a], for Yahweh is not among you[b], so that you may not be struck down before your enemies.
translation:
  language: zh_hans
  text: 不要上去，因为雅威不在你们中间，免得你们在仇敌面前被击败。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַל תַּעֲלוּ
  choice: 不要上去
  rationale: אַל与未完成式连用构成禁止；תַּעֲלוּ本义为“上去”，在此也含向山地进发之意。保留简洁的空间和军事语感。
- source_word: כִּי אֵין יְהוָה בְּקִרְבְּכֶם
  choice: 因为雅威不在你们中间
  rationale: כִּי引出禁止的理由；בְּקִרְבְּכֶם直译为“在你们中间”，指雅威在群体中的同在，不泛化为较弱的“与你们同在”。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文四字神名作通行的现代汉语音译，保留其专名性质，不以称号替代。
- source_word: וְלֹא תִּנָּגְפוּ
  choice: 免得你们……被击败
  rationale: וְלֹא在警告语境中引出应避免的负面后果；תִּנָּגְפוּ为被动形式，在战争语境可指遭击打或战败。“被击败”既保留被动语态，也自然表达军事后果。
- source_word: לִפְנֵי אֹיְבֵיכֶם
  choice: 在仇敌面前
  rationale: לִפְנֵי在战事叙述中常指“在……面前”；אֹיְבֵיכֶם为“你们的仇敌”。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用神的专名；采用“雅威”作为较贴近YHWH可能读音的现代汉语音译，避免以“主”等称号取代。
- issue: בְּקִרְבְּכֶם所表达的神圣临在
  choice: 不在你们中间
  alternative: 不与你们同在
  rationale: “在你们中间”保留原文的群体空间意象，同时不额外界定这种临在的神学方式。
- issue: וְלֹא所连接的逻辑关系
  choice: 免得
  alternative: 否则
  rationale: 此处既可形式化地理解为“并且不要被击败”，也可按语境理解为警告所要避免的结果。“免得”自然呈现后一层关系，却不把结果说成绝对必然。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。“上去”承接前文进入山地的叙事背景；整句保留原文先禁止、后说明原因、再警告后果的结构。
