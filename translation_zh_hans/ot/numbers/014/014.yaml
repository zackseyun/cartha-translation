language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/אָמְר֗וּ אֶל יוֹשֵׁב֮ הָ/אָ֣רֶץ הַ/זֹּאת֒ שָֽׁמְעוּ֙ כִּֽי אַתָּ֣ה יְהוָ֔ה בְּ/קֶ֖רֶב הָ/עָ֣ם הַ/זֶּ֑ה אֲשֶׁר עַ֨יִן בְּ/עַ֜יִן נִרְאָ֣ה אַתָּ֣ה יְהוָ֗ה וַ/עֲנָֽנְ/ךָ֙ עֹמֵ֣ד עֲלֵ/הֶ֔ם וּ/בְ/עַמֻּ֣ד עָנָ֗ן אַתָּ֨ה הֹלֵ֤ךְ לִ/פְנֵי/הֶם֙ יוֹמָ֔ם וּ/בְ/עַמּ֥וּד אֵ֖שׁ לָֽיְלָה־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/014.yaml
  text: And they will tell the inhabitants of this land[a], who have heard that you, Yahweh, are in the midst of this people, that you, Yahweh, are seen face to face, and your cloud stands over them, and you go before them in a pillar of cloud by day and in a pillar of fire by night.
translation:
  language: zh_hans
  text: 他们会把这事告诉这地的居民，而这些居民已经听说：你耶和华在这百姓中间；他们眼对眼看见你[a]；你的云停在他们上方；白天你在云柱中走在他们前面，夜间在火柱中走在他们前面。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“你耶和华是眼对眼被看见的”；也可译：“你耶和华与他们面对面显现。”
    reason: 保留 עַיִן בְּעַיִן 的具体意象，并说明 נִרְאָה 的被动／显现含义及该短语的合理替代译法。
lexical_decisions:
- source_word: יוֹשֵׁב הָאָרֶץ הַזֹּאת
  choice: 这地的居民
  rationale: 单数分词在此具有集合意义，译作“居民”既自然，也保留常住人口的含义。
- source_word: שָׁמְעוּ
  choice: 已经听说
  rationale: 完成式表示这些居民此前已听闻并现已知晓；“已经听说”符合现代汉语。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 直接音译四字神名，不以称号替代，保留经文所用的上帝专名。
- source_word: בְּקֶרֶב
  choice: 就在……中间
  rationale: “在……中间”贴近原文的空间和临在意味；“就”使汉语语气自然，并强调其真实临在。
- source_word: עַיִן בְּעַיִן
  choice: 眼对眼
  rationale: 保留希伯来语具体而略带张力的意象，不在正文中直接化约为“面对面”或“清楚地”。
- source_word: נִרְאָה
  choice: 能……看见
  rationale: 希伯来语为“被看见／显现”；汉语以不定主体“人能看见你”自然表达其可见性，同时在脚注交代较直译的被动形式及另一译法。
- source_word: וַעֲנָנְךָ עֹמֵד עֲלֵהֶם
  choice: 你的云彩停立在他们上方
  rationale: “停立”保留 עמד 的静立形象，“在他们上方”忠实表达 על 的空间关系。
- source_word: הֹלֵךְ לִפְנֵיהֶם
  choice: 走在他们前面
  rationale: 贴近 הלך 与 לפני 的具体表达，不直接解释成“带领”。
- source_word: בְּעַמּוּד עָנָן ... וּבְעַמּוּד אֵשׁ
  choice: 在云柱中……在火柱中
  rationale: 将介词 ב 理解为所处或显现的方式，保留原文“在柱中”的表达，而不改成工具性的“借着”。
- source_word: יוֹמָם ... לָיְלָה
  choice: 白天……夜间
  rationale: 采用现代汉语自然的时间副词，并保持昼夜对举。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威；主
  rationale: 原文直接使用四字神名，正文采用中文读者熟悉的专名音译“耶和华”，而不以“主”这一称号替代。
- issue: עַיִן בְּעַיִן נִרְאָה 的意义
  choice: 人能眼对眼看见你耶和华
  alternative: 你耶和华与他们面对面显现；人清楚地看见你耶和华
  rationale: 正文保留“眼对眼”的原文意象及其含义张力，不把它完全解释为直接视觉、亲密相见或仅仅“清楚可见”；脚注说明语法和其他可能译法。
- issue: בְּעַמּוּד 的介词关系
  choice: 在云柱中／在火柱中
  alternative: 借着云柱／借着火柱
  rationale: 介词既可带处所或方式意味，也可能被理解为工具关系；正文采用较贴近可见临在图景的“在……中”，不排除云火柱具有引导作用。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“这人民”略带经文语体，用来对应原文反复出现的“这百姓／这人民”；全句以分号呈现连续听闻内容，避免希伯来语长句在汉语中显得滞重。
