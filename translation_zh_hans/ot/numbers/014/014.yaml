revisions:
- from: 他们会把这事告诉这地的居民。这些人已经听说，你耶和华就在这人民中间；人能眼对眼看见你耶和华[a]；你的云彩停立在他们上方；白天，你在云柱中走在他们前面，夜间则在火柱中走在他们前面。
  to: 他们会把这事告诉这地的居民，而这些居民已经听说：你耶和华在这百姓中间；他们眼对眼看见你[a]；你的云停在他们上方；白天你在云柱中走在他们前面，夜间在火柱中走在他们前面。
  rationale: 修订不改变经文的叙述关系或神名译法。以“他们眼对眼看见你”作为汉语中对被动式“你被看见”的自然转换，删除原文没有的“能”，并将“这人民”改为较自然的“这百姓”。脚注锚点移至“看见你”之后，使其准确对应“眼对眼”短语。
