base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/045.yaml
  text: Then the Amalekites and the Canaanites who lived in that hill country came down and struck them and beat them down as far as Hormah[a].
translation:
  language: zh_hans
  text: 于是，住在那片山地的亚玛力人和迦南人下来，击打他们，将他们击溃，直到何珥玛[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “何珥玛”是地名；这个希伯来名称与“毁灭”或“奉献而毁灭”一词有关。
    reason: cultural_note
lexical_decisions:
- source_word: וַיֵּרֶד
  choice: 下来
  rationale: 保留从山地向下发动军事行动的方向感；希伯来文动词虽为单数，却置于复合主语之前，是常见句法现象。
- source_word: הָעֲמָלֵקִי וְהַכְּנַעֲנִי
  choice: 亚玛力人和迦南人
  rationale: 两个族名在形态上均为单数，在本句中却作集合称谓，后续动词也是复数；现代汉语以“人”表达群体自然准确。
- source_word: הַיֹּשֵׁב בָּהָר הַהוּא
  choice: 住在那片山地的
  rationale: יֹשֵׁב表示居住；הָר在此指一片山区地貌，而不只是单独一座山，因此译作“山地”。“那片”自然体现指示词并符合区域语境。
- source_word: וַיַּכּוּם
  choice: 击打他们
  rationale: נכה可指击打、攻击或击败；“击打”保留具体动作及较宽泛的语义，不提前把战果解释为彻底击败。
- source_word: וַיַּכְּתוּם
  choice: 把他们打退
  rationale: 此动词表达进一步重创、击溃的军事行动；“打退”在现代汉语中自然，并与前面的“击打”形成递进，同时避免过度译成“消灭”。
- source_word: עַד הַחָרְמָה
  choice: 直到何珥玛
  rationale: עַד标明行动达到的界限；“直到”清楚表达败退所及之处。地名按惯用音译保留为“何珥玛”。
