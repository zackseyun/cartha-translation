source:
  edition: WLC
  text: וְ/עַתָּ֕ה יִגְדַּל נָ֖א כֹּ֣חַ אֲדֹנָ֑/י כַּ/אֲשֶׁ֥ר דִּבַּ֖רְתָּ לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/017.yaml
  text: And now[a], please let the power of the Lord be great, just as you have spoken, saying,
translation:
  language: zh_hans
  text: 现在，愿主的大能显出其伟大[a]，正如你所说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“愿主的大能显为伟大。”
    reason: 保留יִגְדַּל较为形式对应的译法；该词在此为祈愿式，可指大能为大或显为大。
lexical_decisions:
- source_word: וְעַתָּה
  choice: 现在
  rationale: 作为承接上文并引出恳求的话语标记；现代汉语用“现在”已能自然表达这一推进关系，无须生硬地译出连接词。
- source_word: יִגְדַּל נָא
  choice: 愿……彰显出来
  rationale: 未完成式在此具有祈愿语气，נָא加强恳求意味。“愿”自然传达请求；“彰显出来”表达大能被显明为大的含义，同时避免译成能力本身在数量上增加。
- source_word: כֹּחַ
  choice: 大能
  rationale: 该词指力量、能力；在向上帝祈求的语境中，“大能”庄重自然，也符合普通现代读者的表达习惯。
- source_word: אֲדֹנָי
  choice: 主
  rationale: 原文是神圣称号אֲדֹנָי，并非四字神名；译为“主”既准确又不混同于“耶和华”。
- source_word: כַּאֲשֶׁר דִּבַּרְתָּ
  choice: 正如你曾说
  rationale: “正如”保留对应、依据之意；“曾说”指向上帝先前所说、如今仍作为摩西祈求根据的话。
- source_word: לֵאמֹר
  choice: ：
  rationale: 该引语词引出下一节的直接引文；现代汉语以冒号自然清楚地表达这一功能，避免不地道的“说着”。
theological_decisions:
- issue: 神圣称号אֲדֹנָי的译法
  choice: 主
  alternative: 主宰
  rationale: “主”直接对应此称号，并避免把它误作四字神名；“主宰”会增加原文没有明说的统治语义。
- issue: יִגְדַּל כֹּחַ所表达的大能“变大”还是“被彰显”
  choice: 愿主的大能彰显出来
  alternative: 愿主的大能显为伟大
  rationale: 原文可直译为“大能为大”，语境中不是暗示上帝原先能力不足，而是恳求他按自己所说的显出大能。正文采用自然汉语“彰显出来”，脚注保留较形式对应的译法，以免抹去原文张力。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语体。“愿”兼顾恳求粒子נָא与祈愿式语气；句末用冒号承接下一节的引文。脚注标记置于相关短语之后。
