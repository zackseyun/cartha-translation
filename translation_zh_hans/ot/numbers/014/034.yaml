  text: בְּ/מִסְפַּ֨ר הַ/יָּמִ֜ים אֲשֶׁר תַּרְתֶּ֣ם אֶת הָ/אָרֶץ֮ אַרְבָּעִ֣ים יוֹם֒ י֣וֹם לַ/שָּׁנָ֞ה י֣וֹם לַ/שָּׁנָ֗ה תִּשְׂאוּ֙ אֶת עֲוֺנֹ֣תֵי/כֶ֔ם אַרְבָּעִ֖ים שָׁנָ֑ה וִֽ/ידַעְתֶּ֖ם אֶת תְּנוּאָתִֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/034.yaml
  text: According to the number of the days in which you spied out the land, forty days, a day for a year, a day for a year, you shall bear your iniquities forty years, and you shall know my opposition.
translation:
  language: zh_hans
  text: 按你们侦察那地的日数，就是四十天，一天算一年，一天算一年；你们要担当自己的罪孽四十年。这样，你们就会知道我怎样与你们作对。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这个希伯来词也可译作“我怎样疏远你们”、“我对你们的敌意”或“我的不悦”。一些传统英文译本译作“我背弃承诺”，但这里更可能是指耶和华反对或疏远这个悖逆的世代，并不是说上帝没有信守承诺。
    reason: 说明罕见词 תְּנוּאָתִי 的主要词义选择与其他可能译法，并避免传统英文译法引起神学误解。
lexical_decisions:
- source_word: בְּמִסְפַּר הַיָּמִים
  choice: 按这日数
  rationale: 介词 ב 与“数目”构成对应、按比例的表达；“按这日数”自然地连接侦察的天数与受罚的年数。
- source_word: תַּרְתֶּם אֶת־הָאָרֶץ
  choice: 你们侦察那地
  rationale: תור 在本段指对迦南地的侦察行动；“侦察”比中性的“考察”更准确，也不必补出原文未明说的“应许之地”。
- source_word: יוֹם לַשָּׁנָה יוֹם לַשָּׁנָה
  choice: 一天算一年，一天算一年
  rationale: 保留希伯来文的重复和强调，同时以现代汉语清楚表达一天与一年的对应关系。
- source_word: תִּשְׂאוּ אֶת־עֲוֺנֹתֵיכֶם
  choice: 你们要担当自己的罪孽
  rationale: נשא עון 同时包含背负罪责及承受其后果的意味；“担当自己的罪孽”保留这一凝练而沉重的意象。
- source_word: וִידַעְתֶּם
  choice: 这样，你们就会知道
  rationale: ידע 可包含亲身经历而得知的意味；“知道”保留其宽度，“这样”则自然呈现前后结果关系。
- source_word: תְּנוּאָתִי
  choice: 我反对你们是怎样一回事
  rationale: 该罕见名词可指反对、疏远、敌对或不悦。将名词性表达转成自然汉语分句，体现上帝对悖逆一代的审判立场，又不暗示上帝背弃承诺。
theological_decisions:
- issue: 罕见词 תְּנוּאָתִי 在审判语境中的含义
  choice: 我反对你们是怎样一回事
  alternative: 我怎样疏远你们；我对你们的敌意；我的不悦；我背弃承诺
  rationale: 上下文强调上帝对悖逆者的司法性反对。“反对你们”既保留审判的严肃性，也避免传统译法“背弃承诺”可能造成上帝不守信的误解；脚注同时保留该罕见词所容许的疏远、敌对和不悦等语义可能。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。“侦察”“担当罪孽”保持经文的正式语气；分号和重复句式保留原文的比例结构与强调。脚注标记已在正文中以 [a] 出现。
