id: NUM.14.9
reference: Numbers 14:9
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: אַ֣ךְ בַּֽ/יהוָה֮ אַל תִּמְרֹדוּ֒ וְ/אַתֶּ֗ם אַל תִּֽירְאוּ֙ אֶת עַ֣ם הָ/אָ֔רֶץ כִּ֥י לַחְמֵ֖/נוּ הֵ֑ם סָ֣ר צִלָּ֧/ם מֵ/עֲלֵי/הֶ֛ם וַֽ/יהוָ֥ה אִתָּ֖/נוּ אַל תִּירָאֻֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/009.yaml
  text: Only[a], do not rebel against Yahweh. And do not fear the people of the land, for they are our bread; their protection has departed from over them, and Yahweh is with us[b]. Do not fear them.
translation:
  language: zh_hans
  text: 只是，不要背叛耶和华；也不要惧怕那地的百姓，因为他们是我们的饼[a]。他们的荫庇已经离开他们[b]，耶和华与我们同在。不要怕他们！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“他们是我们的饼”；意思可能是他们将容易被征服，如同供人食用的食物。
    reason: 说明原文比喻及其可能含义。
  - marker: b
    text: “荫庇”原文直译为“影子”，在这里可能指遮蔽、庇护或保护。
    reason: 保留关键词的字面意象和语义范围。
lexical_decisions:
- source_word: אַךְ
  choice: 只是
  rationale: 表达限制兼强调的语气，既承接上文，也突出唯一不可做的事是背叛耶和华。
- source_word: בַּיהוָה אַל תִּמְרֹדוּ
  choice: 不要背叛耶和华
  rationale: 介词 בּ 与“背叛”连用，标明背叛所针对的对象；“背叛”直接传达 מרד 的含义。神名 יהוה 音义惯例译作“耶和华”，使其与一般称号相区别。
- source_word: עַם הָאָרֶץ
  choice: 那地的百姓
  rationale: 贴近原文“那地之民”，在现代汉语中自然清楚。
- source_word: כִּי לַחְמֵנוּ הֵם
  choice: 因为他们是我们的饼
  rationale: 保留原文简短而鲜明的“饼”之比喻，不将其直接释义为“我们必吞吃他们”；脚注说明其语用含义。
- source_word: סָר צִלָּם מֵעֲלֵיהֶם
  choice: 他们的荫庇已经离开他们
  rationale: צֵל 字面为“影子”，在此喻指遮蔽和保护；“荫庇”兼顾影子的意象与保护的含义。
- source_word: וַיהוָה אִתָּנוּ
  choice: 耶和华与我们同在
  rationale: 保留原文对神同在的直接宣告；前面的简单连接词在汉语中可不明译，以免误加过强的转折。
- source_word: תִּירְאוּ / תִּירָאֻם
  choice: 不要惧怕／不要怕他们
  rationale: 两次禁令均予保留；末句用较简洁的“怕”形成有力重申。
theological_decisions:
- issue: 征服比喻“他们是我们的饼”
  choice: 正文保留“饼”的原始意象
  alternative: 译作“他们是我们的食物”或“我们必吞吃他们”
  rationale: 原文没有明说具体征服方式；保留比喻可避免把隐含意义扩写成确定陈述，同时借脚注帮助现代读者理解。
- issue: “影子”所指的保护
  choice: 译作“荫庇”，并在脚注保留字面信息
  alternative: 直译“他们的影子已经离开他们”或意译“保护他们的力量已经离开他们”
  rationale: “荫庇”保留遮蔽意象，也让保护之义清楚可懂，不进一步断定这保护具体指神祇、君王或军事力量。
- issue: יהוה 的译法
  choice: 耶和华
  alternative: 雅威或“主”
  rationale: 采用现代中文圣经读者熟悉的专名形式，并使原文的专有神名不被一般称号“主”取代。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。保留原文两次“不要怕”的重复、鲜明的“饼”之比喻，以及“荫庇离开”的图像；不把保护者的身份或征服的具体方式解释得超过原文。
