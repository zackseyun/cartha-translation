base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/025.yaml
  text: The Amalekites and the Canaanites are living in the valley[a]. Tomorrow turn and set out for yourselves into the wilderness by the way of the Red Sea.
translation:
  language: zh_hans
  text: 亚玛力人和迦南人住在谷中。明天你们要转向，起程往旷野去，走红海[a]的路。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文作“芦苇海”；传统译作“红海”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָעֲמָלֵקִי וְהַכְּנַעֲנִי
  choice: 亚玛力人和迦南人
  rationale: 两个带定冠词的单数族名均作集合用法，现代汉语自然地译为族群名称；句首连接词不另加“现在”等原文没有的时间词。
- source_word: יוֹשֵׁב בָּעֵמֶק
  choice: 住在谷中
  rationale: 分词表示持续居住的状态；עֵמֶק在此直译为“谷”，用“谷中”简洁自然。
- source_word: מָחָר
  choice: 明天
  rationale: 直接表达次日，符合原文时间副词的通常含义。
- source_word: פְּנוּ
  choice: 转向
  rationale: 该命令要求改变方向；“转向”保留基本语义，不擅自补入原文未明说的“回去”。
- source_word: וּסְעוּ לָכֶם
  choice: 你们要……起程
  rationale: נסע在行旅语境中指拔营出发；לָכֶם加强命令对受众的指向，汉语以明确主语“你们”自然体现，不生硬直译为“为自己”。
- source_word: הַמִּדְבָּר
  choice: 旷野
  rationale: 指人烟稀少的荒野地区，不必限定为沙质沙漠；“旷野”也是本语境中准确而庄重的常用译法。
- source_word: דֶּרֶךְ יַם סוּף
  choice: 走红海那条路
  rationale: דֶּרֶךְ表示路线或方向；主文沿用读者熟悉的传统地名“红海”，并以脚注注明更贴近字面的译法。
theological_decisions: []
