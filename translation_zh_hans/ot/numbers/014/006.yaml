base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/006.yaml
  text: And Joshua son of Nun and Caleb son of Jephunneh[a], from those who had spied out the land[b], tore their clothes.
translation:
  language: zh_hans
  text: 在窥探那地的人中[a]，嫩的儿子约书亚和耶孚尼的儿子迦勒撕裂了自己的衣服[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“属于那些窥探那地的人”。希伯来语介词在这里表示他们是这群人中的成员。
    reason: lexical_alternative
  - marker: b
    text: 撕裂衣服是当时表达悲痛、惊骇或极度忧伤的惯常举动。
    reason: cultural_note
lexical_decisions:
- source_word: וִיהוֹשֻׁעַ בִּן נוּן
  choice: 嫩的儿子约书亚
  rationale: 按现代中文圣经中通行的人名译法处理，并保留希伯来语“某人的儿子”这一父名结构。句首连接词结合中文叙事语序处理，不另译作生硬的“并且”。
- source_word: וְכָלֵב בֶּן יְפֻנֶּה
  choice: 和耶孚尼的儿子迦勒
  rationale: 连接词译作“和”，表明迦勒与约书亚同为句子主语；父名结构予以保留。
- source_word: מִן הַתָּרִים אֶת הָאָרֶץ
  choice: 在窥探那地的人中
  rationale: 介词 מִן 在此作部分用法，表明约书亚和迦勒属于窥探者这一群体。“窥探”表达 תור 在本段勘察、侦察土地的语境意义；הָאָרֶץ 依原文译为“那地”，不擅自增补“迦南”。
- source_word: קָרְעוּ בִּגְדֵיהֶם
  choice: 撕裂了自己的衣服
  rationale: קָרַע 表示撕开、撕裂；中文用“撕裂衣服”自然表达该动作。“自己的”清楚回指两位主语，也符合复数属格后缀的意义。
