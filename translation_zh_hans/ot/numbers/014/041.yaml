  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר מֹשֶׁ֔ה לָ֥/מָּה זֶּ֛ה אַתֶּ֥ם עֹבְרִ֖ים אֶת פִּ֣י יְהוָ֑ה וְ/הִ֖וא לֹ֥א תִצְלָֽח־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/041.yaml
  text: But Moses said[c][b][a], “Why is this that you are transgressing the command of Yahweh? It will not succeed.”
translation:
  language: zh_hans
  text: 但摩西说：“你们为什么竟违背耶和华的命令[a]？这事不会成功[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“耶和华的口”，意指耶和华所说或所吩咐的话；也可译作“耶和华的话”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“这事不会亨通。”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 但摩西说
  rationale: 叙事连接词在此承接百姓执意上去的行动，并引出摩西与之相反的警告；译作“但”自然体现语境中的转折。
- source_word: לָמָה זֶּה
  choice: 为什么竟
  rationale: לָמָה זֶּה 不只是普通的“为什么”，还带有强调和诘问意味；“为什么竟”在现代汉语中自然传达这种语气。
- source_word: אַתֶּם עֹבְרִים
  choice: 你们……违背
  rationale: עבר 以耶和华的“口/命令”为宾语时，并非指空间上的越过，而是越界、不遵从或违反所吩咐的事；“违背”准确且通俗。
- source_word: אֶת פִּי יְהוָה
  choice: 耶和华的命令
  rationale: 字面为“耶和华的口”，是指他亲口所说、所吩咐的话；本段语境着重百姓不服从神的指示，因此正文译作“命令”，并以脚注保留字面意象及另一可行译法。
- source_word: וְהִוא
  choice: 这事
  rationale: 阴性代词所指并未明说，可能概括百姓企图上去争战这一行动；汉语用“这事”自然，同时不把所指限定得过细。
- source_word: לֹא תִצְלָח
  choice: 不会成功
  rationale: צלח 在此表示一项行动顺利、有成效；“不会成功”清楚表达摩西对这次擅自出征的警告。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 中文圣经传统和普通读者最熟悉的专名形式是“耶和华”；正文保留其作为神之立约名字的专名性质，而不译作称号“主”。
- issue: “这事”所指为何
  choice: 保留概括性，指百姓拟进行的行动
  alternative: 明确译作“这次出征”或理解为“所违背之事”
  rationale: 原文仅用阴性代词 וְהִוא，具体先行对象存在一定含混；译作“这事”既符合上下文，也避免替原文作过度明确的解释。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“为什么竟”保留原文诘问的强调语气；“违背……命令”表达希伯来语习语的实际含义。脚注标记均置于正文相关词句之后。
