  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה עַד אָ֥נָה יְנַאֲצֻ֖/נִי הָ/עָ֣ם הַ/זֶּ֑ה וְ/עַד אָ֨נָה֙ לֹא יַאֲמִ֣ינוּ בִ֔/י בְּ/כֹל֙ הָֽ/אֹת֔וֹת אֲשֶׁ֥ר עָשִׂ֖יתִי בְּ/קִרְבּֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/011.yaml
  text: And Yahweh said to Moses[a], “How long will this people treat me with contempt? And how long will they not believe in me[c][b], despite all the signs that I have done among them?”
translation:
  language: zh_hans
  text: 耶和华对摩西说：“这百姓藐视我要到几时呢？尽管我在他们中间所行的一切神迹，他们还不信靠我要到几时呢？[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “神迹”也可译作“记号”；“信靠我”也可译作“相信我”。
    reason: 保留 אוֹת 与 אמן 在本处各自可表达的较宽语义范围。
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代简体中文中广为人知的专名“耶和华”译出四字神名，不以“主”这一称号代替。
- source_word: עַד אָנָה
  choice: 要到几时呢
  rationale: 自然保留希伯来语反复出现的时间诘问及责问语气。
- source_word: יְנַאֲצֻנִי
  choice: 藐视我
  rationale: 该动词表达轻蔑、鄙弃或公然拒斥；“藐视”简洁庄重，并保留强烈的关系性冒犯。
- source_word: הָעָם הַזֶּה
  choice: 这百姓
  rationale: 保留集体单数和原文略带疏离、责备的指称语气。
- source_word: לֹא יַאֲמִינוּ בִי
  choice: 不信靠我
  rationale: אמן 的使役式与介词 ב 连用，兼有相信和信赖之义；“信靠”在现代中文中自然地涵盖认信与倚赖。
- source_word: בְּכֹל הָאֹתוֹת
  choice: 虽看见……一切神迹
  rationale: 此处介词结构在语境中具有让步意味；补出“虽看见”使中文关系清楚，同时不改变这些记号已经向百姓显明的语境。
- source_word: הָאֹתוֹת
  choice: 神迹
  rationale: אוֹת 本义为“记号”，在此指上帝所施行、用以显明其能力的超常作为；“神迹”符合本段语境和普通中文表达。
- source_word: עָשִׂיתִי
  choice: 我……所行的
  rationale: 中文关系结构自然表达已经完成而对当前仍具效力的作为。
- source_word: בְּקִרְבּוֹ
  choice: 在他们中间
  rationale: 原文后缀为单数，回指集体单数“这百姓”；中文按语义采用复数代词较自然。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用神的专名。正文保留中文读者最熟悉的专名形式，不以“主”替代；“雅威”是另一种常见的拟音形式。
- issue: לֹא יַאֲמִינוּ בִי 中相信与信赖的语义张力
  choice: 不信靠我
  alternative: 不信我／不相信我
  rationale: 希伯来语结构既可突出相信上帝所显明的事实，也可突出对上帝的信赖；“信靠”较能在中文中同时承载这两层关系性含义。
- issue: בְּכֹל הָאֹתוֹת 的逻辑关系
  choice: 让步关系：虽看见……一切神迹
  alternative: 因着／鉴于这一切神迹
  rationale: 上下文强调百姓在经历诸多记号之后仍然不信，让步理解最符合责问的力度；原介词本身较宽泛，因此不将其解释为更具体的因果神学命题。
translation_notes:
  register: 采用现代、庄重而易懂的普通话书面语。两次“要到几时呢”保留原文的平行责问；“这百姓”维持集体称谓及责备语气。脚注标记置于正文引语末尾，所注内容同时涵盖两个真实的词义选择。
