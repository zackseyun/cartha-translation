  yaml_path: translation/ot/numbers/035/024.yaml
  text: then the congregation shall judge between the one who struck him and the avenger of blood, according to these ordinances.
translation:
  language: zh_hans
  text: 会众要按照这些条例[b]，在击打者和报血仇的人[a]之间作出裁断。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“血的报仇者”。这个希伯来语称谓指负责为被害亲属之血报仇的人。
    reason: lexical_alternative
  - marker: b
    text: 或译“这些判决”。希伯来语这个词可指法律条例，也可指司法裁断。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁפְטוּ
  choice: 要……作出裁断
  rationale: 该形式在这段法律程序中表达随后应当进行的司法行动；“要……作出裁断”既体现规范性，又保留审判含义。
- source_word: הָעֵדָה
  choice: 会众
  rationale: עֵדָה指以色列的集体会众；此处会众承担司法职能。“会众”自然、庄重，也不把它预先限定为较狭义的法庭机构。
- source_word: בֵּין ... וּבֵין
  choice: 在……和……之间
  rationale: 对应希伯来语重复的介词结构，是现代汉语中自然的双方关系表达。
- source_word: הַמַּכֶּה
  choice: 击打人的
  rationale: 按字面保留נכה分词“击打者”的含义，不提前将此人定性为“凶手”或“杀人犯”；结合上下文，“击打人的”在汉语中可指实施击打的那个人。
- source_word: גֹּאֵל הַדָּם
  choice: 报血仇者
  rationale: 保留该法律称谓中“血”与“报仇”的语义，指负责为被害亲属之血施行报复的人；脚注说明其亲属背景。
- source_word: עַל
  choice: 按照
  rationale: 在此法律语境中表示以所列规范为裁断依据。
- source_word: הַמִּשְׁפָּטִים הָאֵלֶּה
  choice: 这些条例
  rationale: מִשְׁפָּטִים在律法材料中可指具有规范作用的法律条款或裁断；“条例”适合此处的正式法律语域，同时以脚注保留“判例／裁断”的可能语义。
theological_decisions:
- issue: 会众在致死案件中的司法角色
  choice: 译文让会众在击打人的与报血仇者之间依照既定条例裁断，不预先认定击打人的犯了谋杀罪。
  alternative: 把“会众”限定为专门法庭，或把הַמַּכֶּה译为已经定罪的“杀人犯”。
  rationale: 希伯来文本描述的是司法程序中的双方及会众的裁断职能，本节本身尚未作出谋杀定罪；译文因此保持程序上的中立。
translation_notes:
  register: 采用现代、庄重而易懂的法律叙述语体。“作出裁断”明确表达会众的司法职能；“击打人的”刻意避免使用会预断罪责的“凶手”或“杀人犯”。所有脚注标记均置于对应词语之后。
