  text: וְ/הִקְרִיתֶ֤ם לָ/כֶם֙ עָרִ֔ים עָרֵ֥י מִקְלָ֖ט תִּהְיֶ֣ינָה לָ/כֶ֑ם וְ/נָ֥ס שָׁ֨מָּ/ה֙ רֹצֵ֔חַ מַכֵּה נֶ֖פֶשׁ בִּ/שְׁגָגָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/011.yaml
  text: then you shall designate cities for yourselves; they shall be cities of refuge for you, and the manslayer who strikes down a person unintentionally shall flee there.
translation:
  language: zh_hans
  text: 你们要为自己指定几座城[a]，作为你们的逃城；无意中杀了人的人要逃到那里去[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “指定”也可译作“选定”或“划定”。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“无意中击杀一人的杀人者”，指造成他人死亡却并非蓄意谋杀的人。
    reason: alternative_reading
lexical_decisions:
- source_word: וְהִקְרִיתֶם
  choice: 要……指定
  rationale: 该词是 קרה 的使役形，在此法律语境中指选定、划定某些城；“指定”准确而自然。
- source_word: עָרִים עָרֵי מִקְלָט
  choice: 一些城，作为……逃城
  rationale: “逃城”是现代中文圣经语境中明确且简洁的法律制度名称；句式保留先说“城”、再说明其用途的希伯来文结构。
- source_word: וְנָס שָׁמָּה
  choice: 可以逃到那里
  rationale: 在设立逃城的法规语境中，这一形式说明获准采取的行动；“可以”比机械地译成未来时更符合现代汉语，同时不把它强化为绝对命令。
- source_word: רֹצֵחַ מַכֵּה נֶפֶשׁ
  choice: 误杀人的人
  rationale: 整组短语指造成他人死亡者；后面的 בִּשְׁגָגָה 明确排除蓄意杀人。“误杀人的人”在中文中清楚表达非故意致死，又不引入“谋杀犯”的蓄意含义。
- source_word: נֶפֶשׁ
  choice: 人
  rationale: 此处指遭受致命伤害的人，而不是抽象的“灵魂”。
- source_word: בִּשְׁגָגָה
  choice: 误杀
  rationale: 该词表示无意、过失或失误；与“杀人”合译为“误杀”，自然呈现此处关键的法律区别。
theological_decisions:
- issue: 致死者的法律分类
  choice: 译为“误杀人的人”
  alternative: “杀人者”或“谋杀者”
  rationale: 经文本身用“无意中”限定致死行为，因此不应以“谋杀者”预先认定蓄意和相应罪责；同时保留其确已导致他人死亡这一事实。
- issue: 逃往逃城的语气
  choice: “可以逃到那里”
  alternative: “要逃到那里”
  rationale: 这里既可理解为法规所规定的后续行动，也可理解为逃城所提供的许可与保障。现代汉语采用“可以”，突出制度功能而不把希伯来文的未来／结果语气过度解释为强制命令。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。“逃城”保留法律制度术语；“误杀人的人”避免较生硬的“杀人者”及带有蓄意含义的“谋杀者”。
