source:
  edition: WLC
  text: כִּ֣י בְ/עִ֤יר מִקְלָט/וֹ֙ יֵשֵׁ֔ב עַד מ֖וֹת הַ/כֹּהֵ֣ן הַ/גָּדֹ֑ל וְ/אַחֲרֵ֥י מוֹת֙ הַ/כֹּהֵ֣ן הַ/גָּדֹ֔ל יָשׁוּב֙ הָ/רֹצֵ֔חַ אֶל אֶ֖רֶץ אֲחֻזָּתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/028.yaml
  text: For he must remain in his city of refuge until the death of the high priest[b][a], and after the death of the high priest the manslayer may return to the land of his possession.
translation:
  language: zh_hans
  text: 因为他必须住在自己的逃城里，直到大祭司去世；大祭司死后，杀人者[a]才可以回到他所拥有的土地[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“致人死亡者”。这里的希伯来语是逃城法规中的法律类别，不应自动理解为“谋杀者”或“凶手”。
    reason: lexical_alternative
  - marker: b
    text: 或译“自己的地产”或“他所持有之地”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 在上下文中引出前述法律规定的理由；句首用“因为”自然保留其解释作用。
- source_word: בְעִיר מִקְלָטוֹ
  choice: 在自己的逃城里
  rationale: “逃城”是本段法律语境中 מִקְלָט 的通行、准确称谓；“自己的”表示分配给当事人居住的那座逃城，并非强调所有权。
- source_word: יֵשֵׁב
  choice: 必须住
  rationale: 该动词本义为居住、停留；在法律条文中带有约束义，因此译为“必须住”，兼顾居住状态和法律义务。
- source_word: עַד מוֹת הַכֹּהֵן הַגָּדֹל
  choice: 直到大祭司去世
  rationale: 以自然现代汉语表达时间界限，同时准确保留“大祭司”这一职衔。
- source_word: וְאַחֲרֵי מוֹת הַכֹּהֵן הַגָּדֹל
  choice: 大祭司死后
  rationale: 保留原文对大祭司死亡这一时间节点的重复；省去生硬的名词化表达，使汉语流畅。
- source_word: הָרֹצֵחַ
  choice: 杀人者
  rationale: 这是逃城法规中的法律类别，单指造成他人死亡的人；“杀人者”不像“凶手”或“谋杀者”那样预先断定其动机和罪责。
- source_word: יָשׁוּב
  choice: 才可以回到
  rationale: “才”表明须等到指定时间之后，“可以”体现先前限制解除后的法律许可，避免误解为命令或单纯预言。
- source_word: אֶל אֶרֶץ אֲחֻזָּתוֹ
  choice: 回到他所拥有的土地
  rationale: אֲחֻזָּה 指依法持有的地产或产业；此译法保留财产与土地占有的含义，又避免在此处引入“产业/基业”可能附带的神学联想。
theological_decisions:
- issue: 是否把 הָרֹצֵחַ 译成已经判定恶意与罪责的“谋杀者”或“凶手”
  choice: 杀人者
  alternative: 凶手；谋杀者；误杀人的
  rationale: 本章明确区分蓄意杀人与非蓄意致死。该词在此指逃城法律所处理的致人死亡者；译作“谋杀者”会预先作出原文本节未作的裁决，译作“误杀人的”则会把上下文倾向直接写进词义。采用较中性的“杀人者”以保留法律和神学上的张力。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语，保留法律条文的因果关系、时间界限及“大祭司死后”的重复。用“杀人者”维持原文法律类别的中性，不提前判定蓄意或误杀。脚注标记分别紧随对应词语。
