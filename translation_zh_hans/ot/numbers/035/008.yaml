base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/008.yaml
  text: And the cities that you give from the possession of the sons of Israel—from the many you shall increase[a], and from the few you shall diminish. Each one, according to his inheritance that they inherit[b], shall give some of his cities to the Levites.
translation:
  language: zh_hans
  text: 你们要从以色列人的产业中把城邑给出来：产业多的，要多给[a]；产业少的，要少给。各支派要按自己所承受产业的大小，从自己的城邑中拨出一些给利未人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“从多的要增多，从少的要减少”，意思是各支派要按照所得产业的大小，按比例给出城邑。
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶעָרִים
  choice: 城邑
  rationale: עִיר可指城或镇；“城邑”在土地分配和利未人城邑的法律语境中庄重自然，也避免套用现代城市规模观念。
- source_word: אֲחֻזַּת בְּנֵי יִשְׂרָאֵל
  choice: 以色列人的产业
  rationale: אֲחֻזָּה指承受并持有的土地产业；“产业”保留本段的承受土地背景。“以色列人”自然表达בְּנֵי יִשְׂרָאֵל所指的整个盟约群体。
- source_word: מֵאֵת הָרַב תַּרְבּוּ וּמֵאֵת הַמְעַט תַּמְעִיטוּ
  choice: 产业多的，要多给；产业少的，要少给
  rationale: 希伯来文直译近于“从多的要增多，从少的要减少”，在上下文中指按各支派所得产业的大小，按比例给出城邑。译文明确被省略的产业与“给”的意思，却不指定具体数目。
- source_word: אִישׁ כְּפִי נַחֲלָתוֹ אֲשֶׁר יִנְחָלוּ
  choice: 各支派要按所得产业的大小
  rationale: אִישׁ具有逐一分配的作用，而复数יִנְחָלוּ表明所指是集体性的承受者。结合上下文，译作“各支派”可自然传达每一支派按其所得产业比例承担责任，并保留复数动词的群体指向。
- source_word: יִתֵּן מֵעָרָיו לַלְוִיִּם
  choice: 从自己的城邑中给一些给利未人
  rationale: מִן具有部分关系，故以“从……中给一些”表达；לַלְוִיִּם按惯用译为“给利未人”。
