  yaml_path: translation/ot/numbers/035/009.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: zh_hans
  text: 耶和华对摩西说：
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: 说
  rationale: 该叙事动词在固定引语公式中引出新的神谕；现代汉语用“对……说”自然准确，无须机械重复“讲话……说”。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经传统中对四字神名的通行音译“耶和华”，保留其作为专名的功能，而不改译为称号“主”。
- source_word: אֶל
  choice: 对
  rationale: 在言说结构中标明说话对象，汉语“对……说”最自然。
- source_word: מֹשֶׁה
  choice: 摩西
  rationale: 采用该人名在现代中文中的标准译名。
- source_word: לֵאמֹר
  choice: 说
  rationale: 此不定式用于固定的引语引介公式。汉语将 וַיְדַבֵּר 与 לֵאמֹר 合并表达为“对……说”，既自然又清楚地引出下文。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威；上主
  rationale: 原文直接使用四字神名。译作“耶和华”可保留专名性质，并符合普通中文读者熟悉的圣经用语；不以称号替代原文专名。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。原文“讲话……说”的公式不在中文中生硬复现，而以“对摩西说”完整传达其功能；冒号表明神谕内容接续于下一节。
