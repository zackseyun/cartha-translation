  text: וְ/אִם יָצֹ֥א יֵצֵ֖א הָ/רֹצֵ֑חַ אֶת גְּבוּל֙ עִ֣יר מִקְלָט֔/וֹ אֲשֶׁ֥ר יָנ֖וּס שָֽׁמָּ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/026.yaml
  text: But if the manslayer does indeed go out beyond the boundary of his city of refuge, to which he fled,[a]
translation:
  language: zh_hans
  text: 但那误杀者若真的越出他所逃往的避难城的边界，[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“但那误杀者若真的走出他所逃往的避难城边界。”希伯来语把不定式绝对式与限定式动词连用（直译类似“出去，他出去”），用来加强语气。
    reason: 说明原文强调结构，并保留“出去”而非“越出”的较直译表达。
lexical_decisions:
- source_word: וְאִם
  choice: 但……若
  rationale: 承接前文并引出与既定庇护安排相对的条件情形；现代汉语法律表述中“但……若”自然清楚。
- source_word: יָצֹא יֵצֵא
  choice: 真的越过
  rationale: 希伯来语以绝对不定式配合限定动词来加强语气。“真的”保留强调作用，而“越过”结合后面的“边界”自然表达出去并跨出界限。
- source_word: הָרֹצֵחַ
  choice: 那误杀人的
  rationale: 本段避难城法规所指是未经预谋而杀人、逃往避难城的人，不宜译成含蓄意犯罪判断的“凶手”或“谋杀犯”。“误杀人的”符合本章近距离语境。
- source_word: אֶת גְּבוּל
  choice: 越过……的边界
  rationale: אֵת 标示“边界”为出去动作所涉及的对象；与 יצא 连用时，语境意义是跨越、走出该界限。
- source_word: עִיר מִקְלָטוֹ
  choice: 他的避难城
  rationale: 保留第三人称所属关系，并采用现代汉语中清楚简洁的法规用语“避难城”。
- source_word: אֲשֶׁר יָנוּס שָׁמָּה
  choice: 他所逃往的
  rationale: שָׁמָּה 含朝向那里的意义，因此译作“逃往”；关系从句修饰避难城，不额外解释为已经获得庇护。
theological_decisions:
- issue: הָרֹצֵחַ 在避难城法规中的罪责含义
  choice: 误杀人的
  alternative: 杀人者
  rationale: 本章上下文区分蓄意杀人与无意致死；此处说的是获准逃入避难城者。采用“误杀人的”避免把他预先定性为谋杀犯，同时保留其致人死亡的事实。
translation_notes:
  register: 采用现代、庄重且易懂的法规叙述语体。本节在原文中是未完的条件从句，句末保留逗号以衔接下一节的结果条款。
