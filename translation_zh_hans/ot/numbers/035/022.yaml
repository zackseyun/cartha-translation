  text: וְ/אִם בְּ/פֶ֥תַע בְּ/לֹא אֵיבָ֖ה הֲדָפ֑/וֹ אוֹ הִשְׁלִ֥יךְ עָלָ֛י/ו כָּל כְּלִ֖י בְּ/לֹ֥א צְדִיָּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/022.yaml
  text: But if he pushed him suddenly[a], without hostility, or threw any object at him without lying in wait[b],
translation:
  language: zh_hans
  text: 但如果他并无敌意，突然推了那人，或没有埋伏，把任何物件扔向他，
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאִם
  choice: 但如果
  rationale: 承接上文并引出与蓄意杀人相对的条件情形；“但如果”自然体现语境中的转折。
- source_word: בְּפֶתַע
  choice: 突然
  rationale: 表示动作突然而出；现代汉语简洁自然，也保留原文对突发性的强调。
- source_word: בְּלֹא אֵיבָה
  choice: 并无敌意
  rationale: אֵיבָה指人与人之间的仇恨或敌对态度；“并无敌意”通俗、准确，且适合法律语境。
- source_word: הֲדָפוֹ
  choice: 推了那人
  rationale: 该动词表示推、撞或猛推；“推了那人”清楚表达动作，同时不额外断定力度或后果。
- source_word: הִשְׁלִיךְ עָלָיו
  choice: 把……扔向他
  rationale: 表达把某物投掷到那人身上或朝他而去；“扔向他”符合现代汉语表达。
- source_word: כָּל כְּלִי
  choice: 任何物件
  rationale: כְּלִי是含义宽泛的器具、物品或物件；此处用“任何物件”避免把范围不必要地限于器皿或武器。
- source_word: בְּלֹא צְדִיָּה
  choice: 不是伺机埋伏
  rationale: צְדִיָּה带有守候机会、设伏袭击的具体意象；此译法保留该意象，不直接扩大为现代法律术语“没有预谋”。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的法律叙述语体。调整希伯来语语序，把“并无敌意”前置，使汉语条件关系清楚；保留“伺机埋伏”的具体意象及其与蓄意行为之间的张力。本节句末用逗号，因为原文句法在下一节继续。
