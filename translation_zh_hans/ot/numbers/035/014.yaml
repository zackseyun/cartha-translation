  text: אֵ֣ת שְׁלֹ֣שׁ הֶ/עָרִ֗ים תִּתְּנוּ֙ מֵ/עֵ֣בֶר לַ/יַּרְדֵּ֔ן וְ/אֵת֙ שְׁלֹ֣שׁ הֶֽ/עָרִ֔ים תִּתְּנ֖וּ בְּ/אֶ֣רֶץ כְּנָ֑עַן עָרֵ֥י מִקְלָ֖ט תִּהְיֶֽינָה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/014.yaml
  text: You shall appoint three of the cities beyond the Jordan[a], and three of the cities in the land of Canaan[b]; they shall be cities of refuge.
translation:
  language: zh_hans
  text: 你们要在约旦河那边[b]划出三座城[a]，又在迦南地划出三座城；这些城要作避难城。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“拨出”或“指定”。希伯来语动词字面意思是“给”，这里指把这些城划定作这一用途。
    reason: lexical_alternative
  - marker: b
    text: 也可译“约旦河对岸”或“约旦河另一边”。原文是相对方位说法，本身没有在此处明说东边或西边。
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּתְּנוּ / תִּתְּנוּ
  choice: 划出
  rationale: נתן的字面意思是“给”，但在这里指从已有的城中拨出、指定若干座作特定用途。“划出”既保留分配之意，也符合现代汉语的法规语境。
- source_word: מֵעֵבֶר לַיַּרְדֵּן
  choice: 在约旦河那边
  rationale: 该短语表示约旦河的另一边，但单独看本节并未明确采用“东边”或“西边”的定向说法。“那边”保留了原文以说话者所在位置为参照的关系性表达。
- source_word: בְּאֶרֶץ כְּנָעַן
  choice: 在迦南地
  rationale: 保留אֶרֶץ“地、土地”的领土含义，同时采用自然简洁的现代汉语表达。
- source_word: עָרֵי מִקְלָט
  choice: 避难城
  rationale: מִקְלָט指可逃往并获得保护的地方。“避难城”清楚表达这些城的法定庇护功能，又避免“庇护”在现代政治语境中的特殊联想；传统译法“逃城”较为简短，但对普通现代读者不够直观。
- source_word: אֵת שְׁלֹשׁ הֶעָרִים ... וְאֵת שְׁלֹשׁ הֶעָרִים
  choice: 三座城……三座城
  rationale: 希伯来语两次使用带定冠词的“城”，所指是上文六座城中的两组。中文在上下文中无需机械加入“这些”，否则容易显得累赘；“划出三座城”已自然传达从既定总数中指定的意思。
- source_word: תִּהְיֶינָה
  choice: 这些城要作
  rationale: 未完成式在此说明被指定之城将具有的身份和用途。“要作”符合中文法规式陈述，也保留结果与目的的意味。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的法规叙述语体。“避难城”比传统的“逃城”更直观；两次重复“划出三座城”，对应希伯来语的平行结构。脚注标记均置于相关词语之后。
