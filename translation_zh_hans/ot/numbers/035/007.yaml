  yaml_path: translation/ot/numbers/035/007.yaml
  text: All the cities that you give to the Levites shall be forty-eight cities[a], them and their pasturelands.
translation:
  language: zh_hans
  text: 你们要给利未人的所有城，共四十八座，连同各城的郊野[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “郊野”或译“草场”、“公用地”或“空地”，指各城周围划出的土地。
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הֶעָרִים
  choice: 城，共
  rationale: כָּל限定全部城邑，并与后面的四十八形成总数说明；现代汉语用“共”自然表达总计含义，避免生硬重复“所有……四十八座”。
- source_word: אֲשֶׁר תִּתְּנוּ לַלְוִיִּם
  choice: 你们要给利未人的
  rationale: 未完成式在法规语境中表达应当履行的指令，译作“要给”；לַ指明利未人是领受者。
- source_word: אַרְבָּעִים וּשְׁמֹנֶה עִיר
  choice: 四十八座
  rationale: 希伯来语以“四十和八”表示四十八；汉语采用惯常数字形式，并以“座”作城的量词。
- source_word: אֶתְהֶן
  choice: 这些城
  rationale: 带代词的宾格标记回指前述四十八座城；明译为“这些城”，保留原文的复指和强调。
- source_word: וְאֶת מִגְרְשֵׁיהֶן
  choice: 和城周围的草场
  rationale: מִגְרָשׁ指城外划出的开阔地，在本段供牲畜使用；“城周围的草场”既表达位置，也传达主要功能，同时以脚注保留“公用地／空地”的词义可能。
