review_pass:
  verdict: revise
  source_fidelity: “流血者”在现代汉语通常指正在流血或遭受流血的人，不能明确表达希伯来文שֹׁפְכוֹ所指“使这血流出的人”。此外，“以血偿还”虽可解释为处死凶手，却比原文“借着……的血”更具意译和报偿色彩。应以较贴近原文且不含混的说法表达。
  naturalness: 原译整体庄重通顺；但“自己所居住的地”略强于“你们所在的地”，而末句的“流血者以血偿还”有指称歧义。修订后仍保持现代标准汉语的自然、庄重语体。
  terminology: “玷污”恰当地保留חנף在本节的道德—礼仪污染含义。“赎罪”可保留כפר的祭仪—道德语域；“这地不能……得到赎罪”虽属庄重表达，准确维持土地是被处理的对象。
  issues:
  - severity: medium
    issue: “流血者”指称含混。
    rationale: 中文“流血者”可指流血的受害者，并不必然指“使血流出的人”；原文后缀明确指向血的倾流者。
  - severity: medium
    issue: “以血偿还”加入了原文未明说的报偿性措辞。
    rationale: 原文直述唯一途径是“借着流这血之人的血”。可用更贴近的表达，避免把处理机制额外概念化。
  - severity: low
    issue: “自己所居住的地”略微限缩“你们所在的地”。
    rationale: בָּהּ与“你们”相连，基本意为“你们在其中的地”；经文语境当然是居住之地，但无需在译文中加入“居住”。
  revised_text: 你们不可玷污你们所在的地，因为血会玷污这地；这地不能因流在其上的血而得到赎罪，除非借着流这血之人的血。
  revised_footnotes:
