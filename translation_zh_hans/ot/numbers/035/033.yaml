revisions:
- from: 你们不可玷污自己所居住的地，因为血会玷污这地；对于流在地上的血，除非流血者以血偿还，否则这地就不能得到赎罪。[a]
  to: 你们不可玷污你们所在的地，因为血会玷污这地；这地不能因流在其上的血而得到赎罪，除非借着流这血之人的血。
  rationale: 修订将“流血者以血偿还”改为“借着流这血之人的血”，明确该人是倾流此血者，并更直接对应בְּדַם שֹׁפְכוֹ；同时不额外表述“偿还”。首句改为“你们所在的地”，更贴近原文。保留“玷污”和“赎罪”，以维持本节的道德—礼仪语义及土地作为受影响对象的句法。
  reviewer_model: gpt-5.6-terra
