  text: וְ/לֹֽא תַחֲנִ֣יפוּ אֶת הָ/אָ֗רֶץ אֲשֶׁ֤ר אַתֶּם֙ בָּ֔/הּ כִּ֣י הַ/דָּ֔ם ה֥וּא יַחֲנִ֖יף אֶת הָ/אָ֑רֶץ וְ/לָ/אָ֣רֶץ לֹֽא יְכֻפַּ֗ר לַ/דָּם֙ אֲשֶׁ֣ר שֻׁפַּךְ בָּ֔/הּ כִּי אִ֖ם בְּ/דַ֥ם שֹׁפְכֽ/וֹ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/033.yaml
  text: You shall not pollute the land in which you are[a], for blood pollutes the land, and no atonement can be made for the land for the blood that was shed in it[b], except by the blood of the one who shed it.
translation:
  language: zh_hans
  text: 你们不可玷污你们所在的地，因为血会玷污这地；这地不能因流在其上的血而得到赎罪，除非借着流这血之人的血。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תַחֲנִיפוּ / יַחֲנִיף（חנף，Hiphil）
  choice: 玷污
  rationale: 这里指流血使土地在道德和礼仪意义上受到污损。“玷污”既保留这种神圣—道德色彩，也比仅指环境污染的说法更贴合上下文；两处采用同一译词以呈现原文重复。
- source_word: הָאָרֶץ
  choice: 地／这地
  rationale: 所指是以色列人居住的特定土地，而非整个世界；中文依语境先译“地”，后用“这地”自然回指。
- source_word: כִּי הַדָּם הוּא
  choice: 因为血会
  rationale: הוּא在此使“血”成为鲜明主语，但不必机械译作“血本身”；中文以明确主语自然表达其强调。
- source_word: יְכֻפַּר
  choice: 得到赎罪
  rationale: כפר的被动式在此表示土地因血债而需要被除罪或洁净。“得到赎罪”保留原文祭仪—道德含义，同时为现代读者所能理解。
- source_word: וְלָאָרֶץ לֹא יְכֻפַּר לַדָּם
  choice: 对于流在地上的血……这地就不能得到赎罪
  rationale: 保留土地为赎罪所关涉的对象，并将לַדָּם所表达的关联明确为“对于……血”，避免误解为给血本身赎罪。
- source_word: שֻׁפַּךְ
  choice: 流在
  rationale: 法律语境中的被动“流血”用中文“流在地上”自然表达，并保留血被倾流于地的图景。
- source_word: כִּי אִם
  choice: 除非……否则
  rationale: 原短语限定唯一例外或途径；中文条件结构清楚呈现其排他性。
- source_word: בְּדַם שֹׁפְכוֹ
  choice: 流血者以血偿还
  rationale: 指以杀人者本人的血作为处理血债的唯一途径。“以血偿还”自然而凝练，但以脚注说明较直译的表达，以免把赎价机制阐释过度。
theological_decisions:
- issue: 流血如何玷污土地
  choice: 译文表达流血会真实地使土地陷入道德—神圣层面的污秽，并使土地需要赎罪。
  alternative: 仅把这句话理解为社会秩序受破坏的比喻。
  rationale: חנף的重复和כפר的使用共同表明，这里不只是社会混乱或一般刑事后果；译文保留这种张力，但不引入经文以外的系统神学术语。
- issue: 土地得赎罪的唯一途径
  choice: 保留只有流血者以自己的血偿还，土地才能得赎罪的排他陈述。
  alternative: 弱化为一般性的司法惩罚或补偿。
  rationale: כִּי אִם与בְּדַם שֹׁפְכוֹ明确限定唯一途径；上下文指向杀人者，而不是任意代替者。
translation_notes:
  register: 采用庄重而通顺的现代标准普通话。“玷污”保留土地受道德和神圣污染的意味；“赎罪”保留כפר的祭仪色彩。句法稍作中文化处理，以“除非……否则……”清楚表达原文唯一例外。
