source:
  edition: WLC
  text: וְ/הִצִּ֨ילוּ הָ/עֵדָ֜ה אֶת הָ/רֹצֵ֗חַ מִ/יַּד֮ גֹּאֵ֣ל הַ/דָּם֒ וְ/הֵשִׁ֤יבוּ אֹת/וֹ֙ הָֽ/עֵדָ֔ה אֶל עִ֥יר מִקְלָט֖/וֹ אֲשֶׁר נָ֣ס שָׁ֑מָּ/ה וְ/יָ֣שַׁב בָּ֗/הּ עַד מוֹת֙ הַ/כֹּהֵ֣ן הַ/גָּדֹ֔ל אֲשֶׁר מָשַׁ֥ח אֹת֖/וֹ בְּ/שֶׁ֥מֶן הַ/קֹּֽדֶשׁ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/025.yaml
  text: Then the congregation shall rescue the manslayer from the hand of the avenger of blood[a], and the congregation shall return him to his city of refuge, where he fled; and he shall live in it until the death of the high priest[c][b], whom he was anointed with the holy oil.
translation:
  language: zh_hans
  text: 会众要从报血仇者[a]手中救出那杀人者，并把他送回他逃往的避难城；他要住在那里[b]，直到大祭司死去，就是那位有人用圣油膏立的大祭司[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“复仇者”。希伯来语这个称谓指依法负责为流血之事追讨血债的人，通常是死者的近亲。
    reason: lexical_alternative
  - marker: b
    text: “住在那里”也可译为“留在那里”。
    reason: lexical_alternative
  - marker: c
    text: 希伯来原文直译为“他用圣油膏立的”；“膏立”的主语没有明说。正文以“有人”避免把这个未明说的主语误指为前文的杀人者。许多译本按通常理解改用被动语态，译作“受圣油膏立的”。
    reason: alternative_reading
lexical_decisions:
- source_word: הִצִּילוּ
  choice: 救出
  rationale: 使役形在此表示使人脱离另一人的掌控；“救出”切合司法保护的语境。
- source_word: הָעֵדָה
  choice: 会众
  rationale: 在《民数记》中常指共同体作为整体、尤其作为审判群体采取行动；“会众”兼具正式性与可懂度。
- source_word: הָרֹצֵחַ
  choice: 那杀人者
  rationale: 本章所指可包括误杀者，并不必然是已被认定有谋杀罪的人；“杀人者”保留其法律身份的开放性。
- source_word: גֹּאֵל הַדָּם
  choice: 报血仇者
  rationale: 指负有追讨血债之法律责任的人，通常是死者的近亲；此译保留该制度性称谓。
- source_word: וְהֵשִׁיבוּ אֹתוֹ
  choice: 把他送回
  rationale: 使役形意为使其返回；“送回”在现代汉语中自然，也呈现会众采取行动的意思。
- source_word: עִיר מִקְלָטוֹ
  choice: 他的避难城
  rationale: “避难城”是本章固定的法律制度用语；所有格说明这是指定给他的避难处。
- source_word: אֲשֶׁר נָס שָׁמָּה
  choice: 他逃往的
  rationale: שָׁמָּה具有方向性，译作“逃往”准确表达他逃到该城。
- source_word: וְיָשַׁב בָּהּ
  choice: 他要住在那里
  rationale: ישב在此可指居住或留在某地；正文采用自然的“住在那里”，脚注保留“留在那里”的可能。
- source_word: עַד מוֹת הַכֹּהֵן הַגָּדֹל
  choice: 直到大祭司死去
  rationale: 自然表达原文“直到大祭司之死”的时间界限。
- source_word: אֲשֶׁר מָשַׁח אֹתוֹ
  choice: 这位大祭司，是他……膏立的
  rationale: 原文为第三人称阳性单数主动动词，大祭司是受词，施事者没有明说；正文保留主动句和未明说的“他”。
- source_word: בְּשֶׁמֶן הַקֹּדֶשׁ
  choice: 用圣油
  rationale: 准确表达以分别为圣之油施行膏立；“圣油”简洁而庄重。
theological_decisions:
- issue: הָרֹצֵחַ在逃城律法中的法律身份
  choice: 译为“杀人者”，不译为“凶手”或“谋杀犯”
  alternative: 凶手；谋杀犯
  rationale: 本章区分故意谋杀与非故意杀人。这里不应在审判结论之前把主观恶意或罪责加入译文。
- issue: מָשַׁח אֹתוֹ的隐含主语
  choice: 保留主动表达“是他……膏立的”，不指明“他”是谁
  alternative: “受圣油膏立的大祭司”；“那位已经被膏立的大祭司”
  rationale: 马所拉文本明确使用主动语态，主语却未显明。改为被动虽较顺畅，却会消除原文真实存在的句法突兀与歧义。
translation_notes:
  register: 采用现代、庄重而清楚的法律叙事语体。“会众”“避难城”“大祭司”“圣油”保留经文制度与礼仪色彩；避免用“谋杀犯”预断罪责。末句刻意保留原文主动语态和未明说的施事者，并以脚注解释其句法歧义。
