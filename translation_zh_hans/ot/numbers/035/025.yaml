  to: 会众要从报血仇者[a]手中救出那杀人者，并把他送回他逃往的避难城；他要住在那里[b]，直到大祭司死去，就是那位有人用圣油膏立的大祭司[c]。
  rationale: 只修正末句在汉语中的代词回指问题。改文不指定膏立者是谁，也不把原文主动结构所留下的施事者空缺解释为任何特定人物；其余措辞和脚注锚点维持原意。
