base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/004.yaml
  text: And the pasture lands of the cities that you give to the Levites shall be from the wall of the city outward a thousand cubits all around[a][b].
translation:
  language: zh_hans
  text: 你们给利未人的各城，城周围的空地[a]要从城墙[b]向外一千肘，四围都是如此。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“郊野”或“公用地”，指城周围划出的开放土地。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译“从城的墙”；有些人较笼统地理解为“从城市边界”。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִגְרְשֵׁי
  choice: 郊野
  rationale: 该词指城邑周围划出的开阔用地；在本章语境中可供牲畜使用。“郊野”既保留土地环绕城邑的空间含义，也不把用途限定得过窄。
- source_word: הֶעָרִים
  choice: 各城
  rationale: עִיר可指城或城镇；这里用复数，并承接利未人的城邑，译作“各城”自然且符合上下文。
- source_word: אֲשֶׁר תִּתְּנוּ לַלְוִיִּם
  choice: 你们给利未人的
  rationale: 按原文关系从句直译，清楚表明这些城是给利未人的，并在上下文中保留命令所带的将来指向。
- source_word: מִקִּיר הָעִיר
  choice: 从城墙
  rationale: קִיר通常意为“墙”；“城墙”是此处最直接、自然的表达。至于是否泛指城市边界，则以脚注保留。
- source_word: וָחוּצָה
  choice: 向外
  rationale: 该形式表达朝外的方向，“向外”准确传达方向义。
- source_word: אֶלֶף אַמָּה
  choice: 一千肘
  rationale: 保留原文的古代长度单位“肘”，不作可能造成虚假精确性的现代单位换算。
- source_word: סָבִיב
  choice: 四面都是如此
  rationale: 表达这一距离适用于城市四周；比单说“四周”更清楚地传达环绕各面的分布含义。
