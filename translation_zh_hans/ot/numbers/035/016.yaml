  text: וְ/אִם בִּ/כְלִ֨י בַרְזֶ֧ל הִכָּ֛ה/וּ וַ/יָּמֹ֖ת רֹצֵ֣חַֽ ה֑וּא מ֥וֹת יוּמַ֖ת הָ/רֹצֵֽחַ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/016.yaml
  text: But if he struck him with an iron tool and he died[a], he is a murderer; the murderer must surely be put to death.
translation:
  language: zh_hans
  text: 但如果他用铁器击打那人，致使那人死亡，他就是杀人犯；杀人犯必须被处死。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאִם
  choice: 但如果
  rationale: 承接前文的判例并引出另一种情况；“但如果”既体现语篇转折，也符合现代汉语法律表述。
- source_word: בִּכְלִי בַרְזֶל
  choice: 用铁器
  rationale: כְּלִי 可泛指器具、物件或用具；“铁器”保留其宽泛性，不擅自限定为特定工具或武器。
- source_word: הִכָּהוּ
  choice: 击打那人
  rationale: נכה 的使役形在此表示以器物击打；“击打”庄重、清楚，并保留暴力动作。宾语译作“那人”，以避免连续男性代词造成指代不清。
- source_word: וַיָּמֹת
  choice: 致使那人死亡
  rationale: 原文以连续叙事形式表达击打后死亡；在汉语法律语境中，“致使……死亡”自然地呈现该结果关系，并未超出上下文所明确表达的因果联系。
- source_word: רֹצֵחַ הוּא
  choice: 他就是杀人犯
  rationale: רֹצֵחַ 在本章判别误杀与应负罪责之杀人的法律语境中，是对行为人的司法定性；“杀人犯”比泛称“杀人者”更能传达这一法律身份。
- source_word: מוֹת יוּמַת
  choice: 必须处死
  rationale: 不定式绝对形与被动未完成式连用，强化死刑判决的确定性和义务性；“必须处死”以简洁的现代汉语保留其强调和法律效力。
- source_word: הָרֹצֵחַ
  choice: 杀人犯
  rationale: 定冠词形式再次指称已被定性之人；汉语重复“杀人犯”可清楚保留原文的法律重申。
theological_decisions:
- issue: 本节中 רֹצֵחַ 的法律定性
  choice: 杀人犯
  alternative: 杀人者／杀人凶手
  rationale: 本节依据所用铁器及致死结果，把行为人归入应受死刑的罪责性杀人类别，与本章所论误杀者相区别。“杀人犯”保留司法定性，但不额外加入原文未明说的动机细节。
translation_notes:
  register: 采用现代、庄重而易懂的法律叙述语体。“铁器”有意保留希伯来语 כְּלִי 的广义，不限定为某一种武器；因此无需另设词义脚注。
