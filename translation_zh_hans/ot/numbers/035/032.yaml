  text: וְ/לֹא תִקְח֣וּ כֹ֔פֶר לָ/נ֖וּס אֶל עִ֣יר מִקְלָט֑/וֹ לָ/שׁוּב֙ לָ/שֶׁ֣בֶת בָּ/אָ֔רֶץ עַד מ֖וֹת הַ/כֹּהֵֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/032.yaml
  text: And you shall not take a ransom for him who has fled to his city of refuge[b][a], so that he may return to live in the land before the death of the priest.
translation:
  language: zh_hans
  text: 你们不可收取赎金[a]，使逃往其避难城的人能在祭司死以前返回那地居住[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “赎金”也可译作“补偿款”或“赎价”；希伯来语כֹּפֶר指用作赎价或补偿的款项。
    reason: lexical_alternative
  - marker: b
    text: 希伯来语句法十分紧凑，也可理解为：不可收取与此人留在避难城，或在祭司死前离开避难城、返回那地居住有关的款项。
    reason: alternative_reading
lexical_decisions:
- source_word: כֹּפֶר
  choice: 赎金
  rationale: 该词指为代替法定后果而付出的赎价或补偿款；“赎金”既保留法律语境中的替代性质，也避免把它直接解释为带有贬义的“贿赂”。
- source_word: לָנוּס אֶל עִיר מִקְלָטוֹ
  choice: 逃到避难城的人
  rationale: נוּס意为“逃走、逃往”；结合避难城制度和后文的返回，本处自然理解为已经逃到其避难城的人。汉语不必直译第三人称单数后缀，定指的“避难城”足以表达其获指定的避难之处。
- source_word: לָשׁוּב לָשֶׁבֶת בָּאָרֶץ
  choice: 回来居住在本地
  rationale: 两个连续的不定式分别表达“返回”和“居住”；“回来居住”在现代汉语中自然地保留这两个动作。“本地”表达בָּאָרֶץ在此法律语境中避难城以外原居地域的含义，同时不把范围过度限定为某一具体地点。
- source_word: עַד מוֹת הַכֹּהֵן
  choice: 在祭司死以前
  rationale: 禁令所针对的是祭司死亡之前获准提前返回。“在……以前”清楚呈现这一时间限制；原文仅称“祭司”，正文不擅自补作“大祭司”。
theological_decisions:
- issue: 赎金与逃到避难城及提前返回之间的句法关系
  choice: 正文将禁令表述为不可向已经逃到避难城的人收取赎金，以让他在祭司死前返回居住。
  alternative: 可理解为不可收取与他逃往、留在或离开避难城有关的赎金。
  rationale: 希伯来语结构紧凑，לָנוּס和לָשׁוּב לָשֶׁבֶת之间的关系并非完全明朗。正文采用符合上下文法律后果的自然读法，脚注则保留更宽的句法可能，不把神学或法律含义收窄为唯一解释。
- issue: “祭司”的身份
  choice: 保留“祭司”。
  alternative: 按本章上下文译为“大祭司”。
  rationale: 民数记35章前文明确提到大祭司，但本节希伯来文本身只有הַכֹּהֵן“祭司”。正文按本节原词保留，避免把上下文补充直接写入经文。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“收取赎金”符合条文语体；“逃到避难城的人”比逐字译作“为逃往其避难城”更符合汉语表达，也衔接后文的返回。脚注标记均置于正文相关词句之后。
