revisions:
- from: 你们不可玷污你们所居住的地，就是我住在其中的地，因为我雅威住在以色列人中间。
  to: 你们不可玷污你们所居住、我住在其中的地，因为我——雅威——住在以色列人中间。
  rationale: 将两个修饰“地”的关系从句并列呈现，以更贴合原文句法；并以破折号处理“我——雅威——”的同位语和强调。其余关键词及庄重现代汉语语域均予保留。
