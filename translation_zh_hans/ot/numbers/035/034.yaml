  - severity: low
    issue: “我雅威住在”缺少同位语标点。
    rationale: 原文“我，雅威”具有强调和同位结构；汉语以破折号或逗号标示可避免把“我雅威”读得生硬或含混。
  revised_text: 你们不可玷污你们所居住、我住在其中的地，因为我——雅威——住在以色列人中间。
