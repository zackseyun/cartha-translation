source:
  edition: WLC
  text: וְ/לֹ֧א תְטַמֵּ֣א אֶת הָ/אָ֗רֶץ אֲשֶׁ֤ר אַתֶּם֙ יֹשְׁבִ֣ים בָּ֔/הּ אֲשֶׁ֥ר אֲנִ֖י שֹׁכֵ֣ן בְּ/תוֹכָ֑/הּ כִּ֚י אֲנִ֣י יְהוָ֔ה שֹׁכֵ֕ן בְּ/ת֖וֹךְ בְּנֵ֥י יִשְׂרָאֵֽל־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/034.yaml
  text: And you shall not defile the land in which you dwell[a], in the midst of which I dwell, for I, Yahweh, dwell in the midst of the sons of Israel.
translation:
  language: zh_hans
  text: 你们不可玷污你们所居住、我住在其中的地，因为我——雅威——住在以色列人中间。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תְטַמֵּא
  choice: 玷污
  rationale: 该动词在此指使土地在礼仪和道德意义上成为不洁；“玷污”兼具这两层含义，也避免“污染”偏重现代环境问题的联想。
- source_word: הָאָרֶץ
  choice: 地
  rationale: 上下文所指是以色列人居住的特定土地，并非整个世界；“地”自然贴合本节的地理和盟约语境。
- source_word: יֹשְׁבִים בָּהּ
  choice: 你们所居住的
  rationale: ישב 表示居住、定居；此译法自然体现分词所表达的持续状态，并明确修饰“地”。
- source_word: שֹׁכֵן
  choice: 住
  rationale: שכן 表示居住，也承载上帝临在其子民当中的神学意味；“住”简洁自然，不额外引入“会幕”等技术性概念。
- source_word: בְּתוֹכָהּ
  choice: 在其中
  rationale: 保留 תוך 所表达的内部、居中之意，同时以现代汉语自然承接前面的“地”。
- source_word: כִּי
  choice: 因为
  rationale: 此处引出不可玷污土地的理由，“因为”清楚表达其因果解释功能。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以通行的现代汉语音译呈现四字神名，保留其作为上帝专名的性质，而不以称号替代。
- source_word: בְּתוֹךְ בְּנֵי יִשְׂרָאֵל
  choice: 在以色列人中间
  rationale: “以色列人”是 בני ישראל 在现代汉语中准确而自然的群体称谓；“中间”保留 תוך 所强调的临在于群体之中的含义。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用上帝的专名；“雅威”较贴近学界通常重构的读音，并保留专名性质。
- issue: בני ישראל 的性别与群体含义
  choice: 以色列人
  alternative: 以色列的儿子们
  rationale: 该固定希伯来语表达在此指以色列全体盟约子民；现代汉语“以色列人”准确自然，不把所指错误限制为男性，也不消解其民族身份。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。以“就是我住在其中的地”保留原文连续两个关系从句及土地与上帝临在之间的紧密联系；末句重复“住”，呼应希伯来文两次使用 שֹׁכֵן。
