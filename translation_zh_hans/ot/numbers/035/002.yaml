base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/002.yaml
  text: Command the sons of Israel that they give to the Levites[a], from the inheritance of their possession, cities to live in[b]; and you shall give to the Levites pasturelands around the cities.
translation:
  language: zh_hans
  text: 你要吩咐以色列人[a]，叫他们从自己承受为业的地产中，给利未人城邑，供他们居住；你们也要把城邑四周的草场[b]给利未人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语直译为“以色列的众子”，是对以色列民的集体称呼。
    reason: lexical_alternative
  - marker: b
    text: “草场”所译的词，指城四周的空地，尤其用于放牧及其他公共用途。
    reason: cultural_note
lexical_decisions:
- source_word: צַו
  choice: 吩咐
  rationale: 这是对摩西使用的命令式；“吩咐”保留权威性的命令语气，同时符合现代汉语圣经叙事的庄重语体。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 希伯来语直译为“以色列的众子”，在此作为全体以色列民的集体称谓；“以色列人”在现代汉语中自然、准确，直译信息收入脚注。
- source_word: וְנָתְנוּ
  choice: 叫他们……拿出
  rationale: 连接词加完成式在命令之后带有指令性的结果含义；这一表达自然呈现第三人称复数，并与后面的第二人称复数形成区别。
- source_word: לַלְוִיִּם
  choice: 给利未人
  rationale: 直接表达接受者。
- source_word: מִנַּחֲלַת אֲחֻזָּתָם
  choice: 从自己承受为业的地产中
  rationale: “承受为业”体现 נַחֲלָה 的继承、产业含义，“地产”体现 אֲחֻזָּה 的持有土地含义；既保留土地分配语境中的双重概念，也避免生硬重复。
- source_word: עָרִים לָשָׁבֶת
  choice: 一些城给……居住
  rationale: 不定式表示目的；“给……居住”是自然的现代汉语。原文无明确数量，“一些”在汉语中用于不定复数，不规定具体数目。
- source_word: מִגְרָשׁ
  choice: 草场
  rationale: 此词指城外四周供放牧等公共用途的空地；本段语境中“草场”简明贴切，范围信息由脚注补充。
- source_word: לֶעָרִים סְבִיבֹתֵיהֶם
  choice: 城四周的
  rationale: 自然表达这些附属空地环绕城邑的位置关系，不额外加入原文没有的指示限定。
- source_word: תִּתְּנוּ
  choice: 你们也要……给
  rationale: 明确保留第二人称复数，与前面的第三人称“他们”相区别；“也要”承接前一项命令。
