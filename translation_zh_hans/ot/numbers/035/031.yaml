  text: וְ/לֹֽא תִקְח֥וּ כֹ֨פֶר֙ לְ/נֶ֣פֶשׁ רֹצֵ֔חַ אֲשֶׁר ה֥וּא רָשָׁ֖ע לָ/מ֑וּת כִּי מ֖וֹת יוּמָֽת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/031.yaml
  text: You shall not accept a ransom for the life of a murderer who is guilty of death[c][b][a], for he must surely be put to death.
translation:
  language: zh_hans
  text: 不可收取赎价来保全那犯了死罪的杀人者的性命[a]，因为他必须被处死[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“不可为杀人者的性命收取赎价”。“赎价”也可译作“补偿金”或“赎身款”，指为免除刑罚或使人获释而支付的钱。
    reason: lexical_alternative
  - marker: b
    text: 原文以不定式绝对式与同根动词构成强调，直译为“他必要被处死”。
    reason: lexical_alternative
lexical_decisions:
- source_word: תִקְחוּ
  choice: 收取
  rationale: 该动词本义为“拿、取”，与כֹּפֶר连用时指收受某种款项；“收取”符合现代汉语法律语境。
- source_word: כֹּפֶר
  choice: 赎价
  rationale: 该词指为免除刑罚或使人获释而付的钱；“赎价”保留了以付款换取免刑、保全性命的法律含义，而不将其窄化为“贿赂”。
- source_word: לְנֶפֶשׁ רֹצֵחַ
  choice: 来保全……杀人者的性命
  rationale: נֶפֶשׁ在此可指“性命”或“人”；上下文所禁止的是以付款使杀人者免死。译文自然表达这一含义，脚注说明原文形式。
- source_word: רֹצֵחַ
  choice: 杀人者
  rationale: 本章区分误杀与应负死罪的杀人行为；“杀人者”紧贴词义，并由后面的“犯了死罪”限定其法律责任，避免仅凭该词预先消除上下文所保留的判断过程。
- source_word: רָשָׁע לָמוּת
  choice: 犯了死罪
  rationale: 原文直译近于“有罪而当死”，在司法语境中表示依法应受死刑。“犯了死罪”简洁自然，并保留法律定罪的意味。
- source_word: כִּי מוֹת יוּמָת
  choice: 他必须被处死
  rationale: 不定式绝对形与同根限定动词连用，强化处死的确定性或义务性；“必须”传达强制力，被动式则对应原文的使役被动意义。
theological_decisions:
- issue: 死刑判决的法律约束力
  choice: 本节命令不得以赎价使应受死刑的杀人者免死，并规定必须将他处死。
  alternative: 将本节理解为仅描述惯例，而非具有强制力的法律命令。
  rationale: לֹא תִקְחוּ是明确禁令，מוֹת יוּמָת又是强调结构，因此译文以“不可”和“必须”保留其规范性与强制力。
translation_notes:
  register: 采用现代、庄重而易懂的法律性表述。“不可……；他必须……”体现禁令与判决的力度；以“保全……性命”清楚说明赎价的目的，同时用脚注保留原文较紧凑的结构。
