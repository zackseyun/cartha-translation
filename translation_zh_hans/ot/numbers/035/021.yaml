  text: א֣וֹ בְ/אֵיבָ֞ה הִכָּ֤ה/וּ בְ/יָד/וֹ֙ וַ/יָּמֹ֔ת מֽוֹת יוּמַ֥ת הַ/מַּכֶּ֖ה רֹצֵ֣חַֽ ה֑וּא גֹּאֵ֣ל הַ/דָּ֗ם יָמִ֛ית אֶת הָ/רֹצֵ֖חַ בְּ/פִגְע/וֹ בֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/021.yaml
  text: Or if he struck him with his hand in enmity and he died[a], the one who struck him must surely be put to death; he is a murderer[b]. The avenger of blood shall put the murderer to death when he meets him.
translation:
  language: zh_hans
  text: 或是怀着仇恨[a]用手击打他，以致他死了，那击打他的人必须被处死；他是杀人犯。报血仇者[b]遇见这杀人犯时，就要将他处死。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “怀着仇恨”也可译作“出于敌意”或“因仇恨”。
    reason: lexical_alternative
  - marker: b
    text: “报血仇者”也可译作“血仇报复者”；更明确地说，可译作“为血报仇的近亲”。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּאֵיבָה
  choice: 因仇恨
  rationale: אֵיבָה表示敌意、仇恨；结合介词בְּ和法律语境，“因仇恨”自然地表达敌对动机，同时保留“出于敌意”的词义可能。
- source_word: הִכָּהוּ בְיָדוֹ
  choice: 用手击打他
  rationale: 保留נכה“击打”和בְיָדוֹ“用他的手”的具体施害方式，以符合本段逐项区分案件的法律表述。
- source_word: וַיָּמֹת
  choice: 致使他死去
  rationale: 希伯来文形式上是“于是他死了”的连续叙述；汉语用“致使”清楚表达语境中的因果关系，但不增加死亡方式等未明说的内容。
- source_word: מוֹת יוּמַת
  choice: 必须被处死
  rationale: 以“必须”体现不定式绝对形与未完成式组合的强调和法律必然性；被动式对应יוּמַת。
- source_word: הַמַּכֶּה
  choice: 那打人的
  rationale: 用现代汉语关系结构表达字面上的“击打者”，并与前面的行为清楚衔接。
- source_word: רֹצֵחַ הוּא
  choice: 他是杀人犯
  rationale: 上下文明确指出仇恨动机，属于故意杀人的法律类别；“杀人犯”比泛称“致人死亡者”更准确。
- source_word: גֹּאֵל הַדָּם
  choice: 报血仇者
  rationale: 保留这一古代以色列法律身份的血仇和追讨含义；脚注说明其通常是承担此责任的近亲，避免在正文中加入原短语未显明表达的解释。
- source_word: יָמִית
  choice: 要将……处死
  rationale: 采用法律语域的“处死”，与本节前半句的刑罚措辞保持一致。
- source_word: בְּפִגְעוֹ בוֹ
  choice: 一遇见……就
  rationale: פגע在此表示遇见、碰上；“一……就”自然表达介词短语所规定的执行时机，不额外限定遭遇的地点或情形。
theological_decisions:
- issue: 故意杀人的法律类别
  choice: 杀人犯
  alternative: 杀人者／致人死亡者
  rationale: 本案以“仇恨”为动机，文本将其与误杀区分，因此采用具有罪责含义的“杀人犯”，但不加入预谋等文本未明说的条件。
- issue: גֹּאֵל הַדָּם所指的制度身份
  choice: 报血仇者
  alternative: 血仇报复者／报血仇的近亲
  rationale: 正文保留法律称号及其古代语境中的张力，不把它泛化为私人复仇者，也不在正文中明加“近亲”；近亲含义置于脚注。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语，保留案件条文的条件结构和司法语气。“必须被处死”传达原文的强调刑罚公式；“报血仇者”保留古代法律制度称号，并以脚注作必要说明。
