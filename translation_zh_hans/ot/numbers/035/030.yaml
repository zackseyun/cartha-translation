base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/030.yaml
  text: Whoever strikes down a person[a], the murderer shall be put to death on the testimony of witnesses[b]; but one witness shall not testify against a person for death.
translation:
  language: zh_hans
  text: 凡击杀人的，必须凭多个见证人的证言[a]将那杀人者处死[b]；但不可只凭一个见证人的证言判人死刑。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“按见证人的口”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文在“杀人者”和“处死”两处使用同一词根；中文正文用不同措辞，以免把司法处死误解为非法杀人。
    reason: lexical_alternative
lexical_decisions:
- source_word: מַכֵּה נֶפֶשׁ
  choice: 击杀人的
  rationale: 该分词短语直指击打并致人死亡者；在本司法语境中译作“击杀人的”，既保留暴力致死的含义，也不把 נֶפֶשׁ 误解为与身体相对的“灵魂”。
- source_word: לְפִי עֵדִים
  choice: 凭多个见证人的证言
  rationale: לְפִי 字面为“按……之口”，在法律语境中表示以证言为依据；“见证人”为复数，并与下句“一个见证人”形成明确对照，故译出“多个”。
- source_word: יִרְצַח אֶת הָרֹצֵחַ
  choice: 将那杀人者处死
  rationale: 希伯来文动词与名词同属 רצח 词根。现代汉语若机械重复为“谋杀那谋杀者”会把合法刑罚说成非法杀害，因此用“处死”表达司法执行，同时以脚注保留原文的词根呼应。
- source_word: הָרֹצֵחַ
  choice: 那杀人者
  rationale: 此处指经证人证言确认、须承担死刑的杀人者。“那杀人者”自然承接前句，同时避免在本节单独预先裁定现代汉语“谋杀”所含的全部法律分类。
- source_word: לֹא יַעֲנֶה
  choice: 不可凭……的证言
  rationale: ענה 在司法语境中指作证；结合 בְנֶפֶשׁ לָמוּת，将其自然表达为不得以单一证言作为判处死刑的依据。
- source_word: בְנֶפֶשׁ לָמוּת
  choice: 判人死刑
  rationale: 这是紧缩的法律措辞，字面近于“针对一人，以至于死”。“判人死刑”清楚表达该证言所涉及的司法后果，同时不暗示见证人亲自执行刑罚。
theological_decisions:
- issue: 单一见证在死刑案件中的效力
  choice: 不可凭一个见证人的证言判人死刑
  alternative: 一个见证人不可作证使人死亡
  rationale: 原文禁止单一见证成为致人于死的依据；采用司法化表达以传达其法律效力，不扩展为禁止该见证人提供任何信息。
- issue: רצח 词根在司法处死与杀人者之间的张力
  choice: 正文区分“杀人者”与“处死”，脚注说明原文同根
  alternative: 按同一词根直译为“杀死那杀人者”
  rationale: 原文的词根呼应值得保留说明，但现代汉语正文若完全照搬，容易模糊非法杀人与司法刑罚的区别。
translation_notes:
  register: 采用现代、庄重而清楚的法律语体。“见证人”与上下文一致；“凭……证言”“判人死刑”符合现代汉语司法表达。所有脚注标记均已置于正文相应位置。
