base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/012.yaml
  text: The cities shall be for you as a refuge from the avenger[a], so that the manslayer may not die until he stands before the congregation for judgment.
translation:
  language: zh_hans
  text: 这些城要作你们的避难所，使你们躲避报血仇者[a]；杀人者在会众面前受审以前，不致死亡。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “报血仇者”也可译作“报血仇的近亲”。希伯来语גֹאֵל是一个亲属身份用语，在这里指为死者之血伸冤、追讨血债的人。
    reason: 保留גֹאֵל兼有亲属身份和报血仇职能的词义。
lexical_decisions:
- source_word: וְהָיוּ לָכֶם הֶעָרִים לְמִקְלָט
  choice: 这些城要作你们的避难所
  rationale: 承接上文所指定的城；希伯来语在法律指示中带规定和将来意味。“作你们的避难所”自然保留其保护功能。
- source_word: מִגֹּאֵל
  choice: 使你们躲避报血仇的人
  rationale: גֹאֵל本是亲属身份用语，在本段杀人案件的法律语境中指为死者报血仇的近亲。正文用现代读者容易理解的表达，亲属含义留在脚注。
- source_word: וְלֹא יָמוּת
  choice: 不可被处死
  rationale: 语法本身只说“不可死”，但语境显示危险来自报血仇者。被动表达在中文中清楚呈现其法律保护作用，同时不指定合法执行者。
- source_word: הָרֹצֵחַ
  choice: 杀人者
  rationale: 此词在逃城法规中指造成他人死亡的人，其罪责尚待审断；“杀人者”比“谋杀犯”更能避免预先判定故意与罪责。
- source_word: עַד עָמְדוֹ לִפְנֵי הָעֵדָה לַמִּשְׁפָּט
  choice: 在站到会众面前受审以前
  rationale: עַד加不定式构成时间界限；עֵדָה指承担司法职能的共同体，“会众”保留五经语境中的集体意味；מִשְׁפָּט在此指司法审理或裁决。
theological_decisions:
- issue: 审判前杀人者的法律身份
  choice: 译作“杀人者”
  alternative: “凶手”或“谋杀犯”
  rationale: 经文规定此人先到会众面前受审，因此译文不应在审理前便断定其为蓄意谋杀或已经定罪。
- issue: גֹאֵל在血案法规中的含义
  choice: 正文译作“报血仇的人”，脚注说明其通常为死者近亲
  alternative: “报血仇的近亲”或“亲属复仇者”
  rationale: 正文明确其在本段中的职能，脚注则保存该词的亲属身份内涵，不把更广泛的“赎回者”含义强加进当前语境。
- issue: וְלֹא יָמוּת的施事与法律效果
  choice: 译作“不可被处死”
  alternative: “不至于死”
  rationale: 上下文表明逃城保护杀人者免遭报血仇者杀害；被动式使中文目的清楚，但仍不把此处误解为已经作出的无罪判决。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“会众”保留五经法律语境中的共同体称谓；分号划分避难功能与审判前保护这两个紧密相连的条款。
