  text: But if he pushed him in hatred[a], or threw something at him intentionally, and he died,
translation:
  language: zh_hans
  text: 但人若因仇恨推那人，或蓄意[a]向他扔什么东西，以致他死了，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“怀着恶意”或“伺机埋伏”；希伯来语原词表示蓄意的敌对行为，可能也带有预先埋伏的意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: 但人若
  rationale: 承接上文并引出与误杀情形相对的条件案例；“但……若”自然表达语境中的转折。
- source_word: בְּשִׂנְאָה
  choice: 因仇恨
  rationale: 表达该介词短语所指的动机，比直译为“在仇恨中”更符合现代汉语。
- source_word: יֶהְדָּפֶנּוּ
  choice: 推了那人
  rationale: 该动词指推、猛推或冲撞；“推”忠实而不过度强化动作。用“那人”明确宾语，避免连续代词造成歧义。
- source_word: אוֹ
  choice: 或
  rationale: 保留原文列举另一种行为的简单选择关系。
- source_word: הִשְׁלִיךְ עָלָיו
  choice: 把什么东西扔向他
  rationale: 原文未明说所扔之物，汉语为表达完整而补出泛指的“什么东西”；“扔向他”保留动作的敌对方向。
- source_word: בִּצְדִיָּה
  choice: 故意[a]
  rationale: 正文表达蓄意行为的核心法律含义；脚注保留“伺机埋伏”或恶意谋害等更具体但不确定的语义。
- source_word: וַיָּמֹת
  choice: 以致他死了
  rationale: 在汉语中清楚表达前述行为导致死亡的结果；本节句法尚未完结，末尾保留逗号以承接下一节。
