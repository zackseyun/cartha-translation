  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דַּבֵּר
  choice: 说
  rationale: 该词是דבר的Piel祈使式，命令摩西向特定对象发言；译为“说”自然保留命令语气，配合“对”表达אֶל。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列的子孙
  rationale: 原文直译为“以色列的众子”。“以色列的子孙”既保留家族—盟约称谓，也符合现代中文圣经语体；“以色列人”是更简洁的意译。
- source_word: וְאָמַרְתָּ אֲלֵהֶם
  choice: 告诉他们
  rationale: 保留原文“说……又对他们说”的双重发言结构，同时用“告诉”避免中文机械重复，使句子自然。
- source_word: כִּי
  choice: ……的时候
  rationale: 此处引出将要发生的处境，结合分词结构宜作时间义，译为“……的时候”；不取常见的原因义“因为”。
- source_word: אַתֶּם עֹבְרִים
  choice: 你们过
  rationale: 独立代词加分词表达即将发生或预期发生的行动；在时间从句中译为“你们过”简洁自然。
- source_word: אֶת הַיַּרְדֵּן
  choice: 约旦河
  rationale: 原文地名带定冠词，中文惯用名称为“约旦河”；补出“河”使普通读者清楚。
- source_word: אַרְצָה כְּנָעַן
  choice: 进入迦南地
  rationale: אֶרֶץ所带方向词尾表示朝向该地的运动；结合渡河语境，“进入”准确表达进入境内，而“迦南地”保留原文地理称谓。
