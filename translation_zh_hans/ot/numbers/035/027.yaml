base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/027.yaml
  text: and the avenger of blood finds him outside the boundary of his city of refuge[a], and the avenger of blood kills the manslayer[b], he is not guilty of blood.
translation:
  language: zh_hans
  text: 报血仇的人若在杀人者的逃城界外遇见他，并把他杀死，报血仇的人就不负流血之罪。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来原文直译：“他没有血”，意思是他不承担血债或流血之罪。
    reason: lexical_alternative
lexical_decisions:
- source_word: גֹּאֵל הַדָּם
  choice: 报血仇的人
  rationale: 该短语在逃城法规中指有权为死者追讨血债的人。“报血仇的人”既传达法律角色，也不额外明说原文在本节未直接表达的亲属关系。
- source_word: מִחוּץ לִגְבוּל
  choice: 在……界外
  rationale: 这里指超出逃城提供庇护的法定范围；“界外”简洁地兼顾空间边界和法律界限。
- source_word: עִיר מִקְלָטוֹ
  choice: 杀人者的逃城
  rationale: “逃城”是本段制度性名称；属格代词表示此人所归属、投奔的那座逃城。为避免中文代词指向含混，正文明确为“杀人者的”。
- source_word: וְרָצַח
  choice: 把他杀死
  rationale: 此处随后明确说报血仇者不负流血之罪，因此采用法律评价中性的“杀死”，不用暗示非法或恶意杀人的“谋杀”。
- source_word: הָרֹצֵחַ
  choice: 杀人者
  rationale: 在逃城法规中，该词指杀了人而逃往逃城的人，可能属于误杀；“杀人者”比“凶手”更中性，也比单译“误杀者”更贴近本节词形本身。
- source_word: אֵין לוֹ דָּם
  choice: 不负流血之罪
  rationale: 这是希伯来语法律习语，意为该人不因这次杀人承担血债或流血罪责；正文采用自然、明确的现代汉语，直译另见脚注。
theological_decisions:
- issue: 在法律许可的杀人情境中如何表达 רצח
  choice: 译为评价中性的“杀死”
  alternative: 译为“谋杀”或“杀害”
  rationale: 本节末句明说报血仇者不承担流血罪责。若使用本身暗示犯罪的词，会造成原文没有的法律矛盾；中性译法保留本段对行为及其法律后果的区分。
- issue: אֵין לוֹ דָּם 中“他”的指向
  choice: 在正文中明确为报血仇的人不负流血之罪
  alternative: 保留仅用“他”的代词表达
  rationale: 希伯来语最近的主动主语是报血仇者，法律条款的意义也是免除其血债。中文若只写“他”容易被理解为被杀的杀人者，因此适度明示指向。
translation_notes:
  register: 采用现代、庄重而易懂的法律叙述语体。“若……就……”把希伯来语并列推进的个案法结构自然地呈现为中文条件句；“逃城”保留《民数记》中的制度性术语。
