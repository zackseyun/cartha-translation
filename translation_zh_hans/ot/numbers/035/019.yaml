  text: גֹּאֵ֣ל הַ/דָּ֔ם ה֥וּא יָמִ֖ית אֶת הָ/רֹצֵ֑חַ בְּ/פִגְע/וֹ ב֖/וֹ ה֥וּא יְמִיתֶֽ/נּוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/019.yaml
  text: The avenger of blood himself shall put the murderer to death; when he meets him[a], he himself shall put him to death.
translation:
  language: zh_hans
  text: 报血仇者[a]要亲自处死那杀人者；他遇见那人时，要亲自处死他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “报血仇者”是希伯来语中的固定法律称谓，指负责为遭非法杀害者追讨血债的近亲。
    reason: 解释古代以色列法律术语及其亲属责任背景。
lexical_decisions:
- source_word: גֹּאֵל הַדָּם
  choice: 报血仇者
  rationale: 这是以色列杀人案件律法中的固定称谓，指负责为被杀亲属追讨血债的近亲。“报血仇者”既保留“血”的法律意象，也避免把 גֹּאֵל 在其他语境中的“赎回者”含义带入本节。
- source_word: הוּא
  choice: 亲自
  rationale: 独立人称代词在两处都带有强调作用；译为“亲自”，突显由报血仇者本人执行处死，并保留原文的重复强调。
- source_word: יָמִית / יְמִיתֶנּוּ
  choice: 处死
  rationale: מות 的使役式表示“使……死”。本节处于法律语境，“处死”比一般的“杀死”更能体现依法执行死亡处置的含义。
- source_word: הָרֹצֵחַ
  choice: 那杀人者
  rationale: רֹצֵחַ 指实施杀人行为的人；“杀人者”保留该词在本章区分故意与非故意杀人时所具有的法律语境，不额外加入现代汉语“谋杀犯”可能暗含的定罪细节。
- source_word: בְּפִגְעוֹ בוֹ
  choice: 他一遇见那人
  rationale: פגע 在此表示遇到或碰见某人，前缀 בְּ 与不定式结构表达时间关系。“一遇见”自然传达“在遇见之时”的即时意味，同时不将其误解为“击打”。
theological_decisions:
- issue: גֹּאֵל הַדָּם 的法律身份
  choice: 译作“报血仇者”，理解为以色列司法制度中承担追讨血债职责的近亲
  alternative: 译作“赎血者”或赋予救赎性的神学含义
  rationale: 上下文讨论杀人案件及逃城制度，重点是亲属在该法律框架中的职责，而非神学上的救赎主题。译文保留这一古代法律角色，不引入后来的教义联想。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“报血仇者”保留原文法律术语的血债意象，并以脚注说明；两次“亲自处死”对应原文刻意的重复，维持其强调和法律上的严肃语气。
