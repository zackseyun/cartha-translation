base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/006.yaml
  text: And the cities that you give to the Levites shall be the six cities of refuge[a], which you shall give for the manslayer to flee there; and besides them you shall give forty-two cities.
translation:
  language: zh_hans
  text: 你们所要给利未人的城中，要有六座逃城，供杀人者[a]逃到那里；此外，你们还要给他们四十二座城。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“杀了人的人”。这里的希伯来语用于逃城的法律语境，本身并未说明杀人是蓄意还是意外。
    reason: 保留הָרֹצֵחַ在此处对主观意图的真实歧义，避免将其预先限定为谋杀犯或误杀者。
lexical_decisions:
- source_word: הֶעָרִים
  choice: 城
  rationale: עִיר可指城或城镇；本段论及分给利未人的城邑，译作“城”简洁自然，也与“逃城”的固定表达一致。
- source_word: לַלְוִיִּם
  choice: 给利未人
  rationale: 保留介词所表达的受领关系，说明这些城是分给利未人的。
- source_word: שֵׁשׁ עָרֵי הַמִּקְלָט
  choice: 六座逃城
  rationale: מִקְלָט意为避难、庇护之所；“逃城”是现代中文圣经语境中清楚而凝练的法律制度名称。
- source_word: לָנוּס שָׁמָּה
  choice: 可以逃到那里
  rationale: 保留נוּס“逃往、逃离”的动作和שָׁמָּה“到那里”的方向意义；加入“可以”自然表达设立这些城所提供的途径。
- source_word: הָרֹצֵחַ
  choice: 杀人者
  rationale: 该分词指杀了人的人，在逃城法律语境中本词自身并不明确判定蓄意或误杀；“杀人者”比“凶手”或“谋杀犯”更能保留这种法律上的未决性。
- source_word: וַעֲלֵיהֶם
  choice: 此外
  rationale: 此处עַל构成增添关系，不是空间上的“在其上”；“此外”准确说明另加四十二座城。
- source_word: אַרְבָּעִים וּשְׁתַּיִם עִיר
  choice: 四十二座城
  rationale: 希伯来语在数词后使用单数名词，现代汉语按习惯用量词“座”表达。
theological_decisions:
- issue: הָרֹצֵחַ是否限定为误杀者
  choice: 译作“杀人者”，不在正文中限定动机
  alternative: “误杀人的人”或“谋杀犯”
  rationale: 原词在本节只说明此人杀了人，蓄意与否须由后续法律审理判明；正文不应预先消除这一张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“你们要给利未人的城中，有六座是……”重组了希伯来语前置宾语结构，清楚表明六座逃城属于分给利未人的城；分号保留两组城数之间的并列及增添关系。
