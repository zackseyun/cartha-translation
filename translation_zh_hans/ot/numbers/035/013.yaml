  text: And the cities that you give shall be six cities of refuge for you.
translation:
  language: zh_hans
  text: 你们所给的城中，要有六座作你们的逃城。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/הֶ/עָרִים
  choice: 你们所给的城
  rationale: 希伯来语以连词和带定冠词的复数名词“城”起句；中文结合后面的关系从句表达为“你们所给的城”，既保留话题焦点，也避免生硬直译句首连词。
- source_word: אֲשֶׁר תִּתֵּנוּ
  choice: 你们所给的
  rationale: 关系词加נתן的第二人称阳性复数未完成式，指以色列人将要交出的城。中文关系结构用“所给的”自然表达其前瞻性；上下文已使将来或指令含义清楚。
- source_word: שֵׁשׁ
  choice: 六座
  rationale: 准确表达基数“六”，并按现代汉语为城加量词“座”。
- source_word: עָרֵי מִקְלָט
  choice: 逃城
  rationale: 该结构直指供误杀者逃往并获得庇护的法律制度。“逃城”是简洁而固定的中文圣经术语，也符合本章语境。
- source_word: תִּהְיֶינָה
  choice: 要有……作为
  rationale: 该动词为第三人称阴性复数未完成式，在法律指令中具有规定和结果意味。译为“要有……作为”比机械的“将是”更符合现代汉语，同时保留规范性。
- source_word: לָ/כֶם
  choice: 你们的
  rationale: 介词ל加第二人称复数后缀，在此表示这些城是为以色列群体而设。结合“逃城”译作领属形式“你们的”，自然传达受益和归属关系。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的法律叙述语体。“要有六座作为”保持原文的规定性，又避免文言化的“当为”。不在中文句首机械保留וְ“和”，因为本节承接关系可由上下文自然体现。
