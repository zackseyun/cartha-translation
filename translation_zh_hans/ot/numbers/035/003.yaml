base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/003.yaml
  text: The cities shall be for them to live in[a], and their pasturelands shall be for their livestock, for their possessions[b], and for all their animals.
translation:
  language: zh_hans
  text: 这些城要供他们居住；城周围的草场[a]要供他们的牲畜、财物[b]和一切动物之用。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“城周围的空地”或“公用地”。希伯来语所指的是城四周划出的开阔地，本节尤其强调其供牲畜使用的功能。
    reason: lexical_alternative
  - marker: b
    text: 或译“产业”或“所有物”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶעָרִים
  choice: 这些城
  rationale: עִיר可指城或城镇；本段是法律性分地条文，译作“城”简明自然，并承接上下文所指定的城。
- source_word: לָשָׁבֶת
  choice: 给他们居住
  rationale: ישׁב在此表达居住、定居之意；“给他们居住”保留目的含义，符合现代汉语。
- source_word: מִגְרְשֵׁיהֶם
  choice: 城周围的草场
  rationale: מִגְרָשׁ指城外划出的空地或公用地，本节突出其供牲畜等使用的功能；“城周围的草场”既交代位置，也自然表达实际用途。
- source_word: לִבְהֶמְתָּם
  choice: 供他们的牲畜
  rationale: בְּהֵמָה在此集合性地指家养牲畜；“牲畜”是准确、通行的现代汉语。
- source_word: לִרְכֻשָׁם
  choice: 财物
  rationale: רְכוּשׁ指财产、所有物；“财物”能涵盖他们拥有的物资，同时不把含义限定为土地或法律意义上的不动产。
- source_word: וּלְכֹל חַיָּתָם
  choice: 和一切动物
  rationale: חַיָּה可指活物或动物；在已经提到牲畜后，此处用“一切动物”保留较宽的范围，也避免古雅的“走兽”。
theological_decisions: []
