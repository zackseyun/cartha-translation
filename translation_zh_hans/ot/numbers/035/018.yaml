  text: א֡וֹ בִּ/כְלִ֣י עֵֽץ יָד֩ אֲשֶׁר יָמ֨וּת בּ֥/וֹ הִכָּ֛ה/וּ וַ/יָּמֹ֖ת רֹצֵ֣חַֽ ה֑וּא מ֥וֹת יוּמַ֖ת הָ/רֹצֵֽחַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/018.yaml
  text: Or if he struck him with a wooden object in the hand[a], by which one could die, and he died, he is a murderer; the murderer must surely be put to death.
translation:
  language: zh_hans
  text: 或者，他若用手中的木器[a]击打那人，所用的木器足以致命，而那人死了，他就是杀人犯；这杀人犯必须被处死。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“用手持的木制器具”。
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּכְלִי עֵץ יָד
  choice: 用手中的木器
  rationale: כְּלִי עֵץ泛指木制器物或器具；יָד在此表明该物可持在手中使用。译作“手中的木器”保留原文意象，也符合本段与铁器、石块并列的法律语境。
- source_word: אֲשֶׁר יָמוּת בּוֹ
  choice: 所用的足以致命
  rationale: 该关系从句说明器物具有致死能力，并非只重复本案的死亡结果。“足以致命”在现代汉语中简洁自然，且保留其可能性含义。
- source_word: הִכָּהוּ
  choice: 击打那人
  rationale: נכה指击打或打击；“击打”保持庄重的法律文体，又不在后文交代死亡之前预先强化结果。
- source_word: וַיָּמֹת
  choice: 而那人死了
  rationale: 按原文顺序陈述击打后的死亡事实，不额外说明具体因果程度。
- source_word: רֹצֵחַ
  choice: 杀人犯
  rationale: 本段区分故意或应负罪责的杀人与误杀，并规定死刑；“杀人犯”能传达这里的法律定罪含义，比泛称“杀人者”更准确。
- source_word: מוֹת יוּמַת
  choice: 必须被处死
  rationale: 同源不定式绝对式与未完成式连用，强化刑罚的确定性和必要性；“必须被处死”以自然的现代法律汉语表达这一强调。
theological_decisions:
- issue: 杀人法规中רֹצֵחַ的法律分类
  choice: 译为“杀人犯”
  alternative: “杀人者”或“杀人凶手”
  rationale: 上下文将这种应受死刑的杀人行为与误杀区分开来。“杀人犯”保留法律与道德判定，同时不加入额外的宗派性解释。
translation_notes:
  register: 采用现代、庄重且易懂的法律叙述语体。“木器”保留כְּלִי的宽泛性；脚注交代“手持”这一可能更明确的表达。
