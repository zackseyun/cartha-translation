base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/023.yaml
  text: or with any stone by which one could die[a], without seeing, he dropped it on him so that he died, though he was not his enemy and was not seeking his harm—
translation:
  language: zh_hans
  text: 或是他用任何足以致人死亡的石头，在没有看见的情况下，使它落在那人身上，以致那人死亡；他本不是那人的仇敌，也没有企图伤害他——
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אוֹ
  choice: 或是
  rationale: 承接上文列举的另一种法律情形，用“或是”自然体现选择关系。
- source_word: בְּכָל אֶבֶן אֲשֶׁר יָמוּת בָּהּ
  choice: 一块足以致人死亡的石头
  rationale: “足以致人死亡”准确表达关系从句所说明的致命能力；“一块”符合现代汉语对石头的计量习惯，而不必生硬直译 כָל。
- source_word: בְּלֹא רְאוֹת
  choice: 没有看见
  rationale: 保留希伯来文具体的“看见”意象，不在正文中直接解释为“无意”或“意外”，从而保存其含义空间。
- source_word: וַיַּפֵּל עָלָיו
  choice: 使……石头落在那人身上
  rationale: 采用使动表达，反映 נפל 的 Hiphil 词形，同时避免误译成石头自行落下。
- source_word: וַיָּמֹת
  choice: 导致那人死亡
  rationale: 在汉语中清楚表达前一动作造成死亡的结果。
- source_word: וְהוּא לֹא אֹיֵב לוֹ
  choice: 其实他与那人并无仇
  rationale: “其实”自然引出对行为人动机的补充说明；“并无仇”简洁、庄重地表达不是仇敌。
- source_word: וְלֹא מְבַקֵּשׁ רָעָתוֹ
  choice: 也没有图谋害他
  rationale: רָעָה 在此法律语境中指针对他人的伤害；“图谋害他”保留主动寻求加害的意图含义。
