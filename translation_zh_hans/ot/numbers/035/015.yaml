source:
  edition: WLC
  text: לִ/בְנֵ֣י יִשְׂרָאֵ֗ל וְ/לַ/גֵּ֤ר וְ/לַ/תּוֹשָׁב֙ בְּ/תוֹכָ֔/ם תִּהְיֶ֛ינָה שֵׁשׁ הֶ/עָרִ֥ים הָ/אֵ֖לֶּה לְ/מִקְלָ֑ט לָ/נ֣וּס שָׁ֔מָּ/ה כָּל מַכֵּה נֶ֖פֶשׁ בִּ/שְׁגָגָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/015.yaml
  text: These six cities shall be for refuge for the sons of Israel[a], and for the sojourner and for the resident among them[c][b], so that anyone who kills a person unintentionally may flee there.
translation:
  language: zh_hans
  text: 这六座城要作为避难之处，供以色列人[a]、寄居者和住在他们中间的外来居民[b]使用，使任何无意中杀人的人[c]都可以逃到那里。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“以色列众子”，是对以色列民族的惯用称呼。
    reason: lexical_alternative
  - marker: b
    text: “寄居者”和“外来居民”对应两个不同的希伯来语词（גֵּר 与 תּוֹשָׁב），都指住在以色列社会中、却不具本族人身份的人。
    reason: cultural_note
  - marker: c
    text: 也可译作“误杀人的人”或“非故意致人死亡的人”；原文强调致人死亡并非出于故意。
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: 给以色列人
  rationale: 这是以色列民族兼盟约群体的固定称谓。现代汉语通常自然地译作“以色列人”；脚注保留原文“以色列众子”的字面形式。
- source_word: גֵּר
  choice: 寄居者
  rationale: 指住在以色列群体中、并非本地出生而受其保护的人；“寄居者”保留其法律与社会身份色彩。
- source_word: תּוֹשָׁב
  choice: 外来居民
  rationale: 指居住当地但不具本族人完整身份的人。用“外来居民”与“寄居者”区分，同时保持现代汉语可懂性。
- source_word: בְּתוֹכָם
  choice: 住在他们中间
  rationale: 表达这些非本族居民身处以色列群体之中，并自然地与前面的身份词衔接。
- source_word: תִּהְיֶינָה שֵׁשׁ הֶעָרִים הָאֵלֶּה לְמִקְלָט
  choice: 这六座城要……作为避难之处
  rationale: 保持法律规定的语气，并准确传达这些城市被指定为逃难地点的功能。
- source_word: לָנוּס שָׁמָּה
  choice: 可以逃到那里
  rationale: 该不定式说明设立避难城的目的；“可以逃到那里”在汉语中自然表达许可和实际用途。
- source_word: כָּל מַכֵּה נֶפֶשׁ
  choice: 任何……杀人的人
  rationale: 字面为“每一个击打人命者”，在本段法律语境中指造成他人死亡的人；结合“不慎”译成“误杀人的人”最为清楚。
- source_word: נֶפֶשׁ
  choice: 人
  rationale: 此处指作为受害者的一个人，并非抽象的“灵魂”。
- source_word: בִּשְׁגָגָה
  choice: 误杀
  rationale: 表示非故意、因疏忽或失误而造成死亡；“误杀”简洁体现逃城律法所强调的意图区别。
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל 中带性别形式的盟约群体称谓
  choice: 正文采用“以色列人”
  alternative: 以色列众子／以色列的子孙
  rationale: 希伯来语字面形式为“以色列众子”，但它在这里是整个民族的惯用称谓，并不只指男性。“以色列人”在现代汉语中准确、自然，脚注则保留原文形式，避免遮蔽其表达。
- issue: גֵּר 与 תּוֹשָׁב 两类非本族居民的关系
  choice: 分别译作“寄居者”和“外来居民”
  alternative: 合并为“寄居的外族人”
  rationale: 原文有意使用两个不同的法律社会身份词，正文应维持区别，而不武断界定两者全部制度细节。
- issue: בִּשְׁגָגָה 所表达的杀人责任
  choice: 译作“误杀”
  alternative: 意外杀人／无意中杀人
  rationale: 本节明确把非故意致死者与蓄意杀人者区分开来；“误杀”保留法律张力，却不暗示行为完全没有责任。
translation_notes:
  register: 采用现代、庄重而易懂的法律叙事语体。“要……作为”体现规定性质；“误杀”避免古奥的“误杀人者”，也不把非故意致死淡化成毫无责任的普通事故。所有脚注标记均置于对应正文成分之后。
