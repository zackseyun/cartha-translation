  to: 这六座城要作为避难之处，供以色列人[a]、寄居者和住在他们中间的外来居民[b]使用，使任何无意中杀人的人[c]都可以逃到那里。
  rationale: 修订仅改善句法清晰度并将脚注 b 移至其所解释的两个身份术语之后。译文仍保留原文的法律用途、两类非本族居住者的区分，以及非故意致人死亡这一限定，未对其制度细节或责任程度作超出原文的界定。
