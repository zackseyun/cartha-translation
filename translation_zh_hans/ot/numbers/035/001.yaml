  yaml_path: translation/ot/numbers/035/001.yaml
  text: And Yahweh spoke to Moses in the plains of Moab by the Jordan at Jericho, saying,
translation:
  language: zh_hans
  text: 雅威在摩押平原、耶利哥附近的约旦河边，对摩西说：
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: 对……说
  rationale: 该叙事形式引出一次新的发言事件；现代汉语以“对摩西说”自然表达，并可与后面的 לֵאמֹר 合并处理，避免生硬重复“讲话说”。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见音译呈现四字神名，保留其作为专名的性质，不以称号替代。
- source_word: מֹשֶׁה
  choice: 摩西
  rationale: 采用现代中文圣经及一般读者熟悉的人名译法。
- source_word: בְּעַרְבֹת מוֹאָב
  choice: 在摩押平原
  rationale: עֲרָבוֹת 指开阔的平原或草原地带；“摩押平原”是准确而通行的地理表达。
- source_word: עַל־יַרְדֵּן יְרֵחוֹ
  choice: 约旦河边、耶利哥对面
  rationale: 该地理短语指约旦河东岸、与耶利哥相对的地点；此译法在现代汉语中清楚交代相对位置，同时不把 עַל 机械译作“在……上”。
- source_word: לֵאמֹר
  choice: 说：
  rationale: 该不定式引出随后话语的内容；汉语用“说：”衔接直接引语最自然，并与前面的发言动词整合。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名。译作“雅威”保留专名，并以较接近学界通常重构读音的现代汉语音译呈现；不以“上主”等称号替换。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。保留原文的发言公式，但按汉语习惯整合为“对摩西说：”；地理信息按由大到小的层次排列，便于普通读者理解。
