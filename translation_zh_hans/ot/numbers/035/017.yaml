  to: 或者，他若用一块足以致命的手持石头[a]击打那人，以致那人死了，他就是凶手；凶手必须被处死。
  rationale: 修订仅调整语序以使“足以致命”明确限定石头，并删除原文未表达的“也”。“手持石头”配合脚注保留בְּאֶבֶן יָד的字面表达及其可指手中所拿或适于手持的歧义；其余法律定性与刑罚措辞维持原译的准确性和庄重语域。
